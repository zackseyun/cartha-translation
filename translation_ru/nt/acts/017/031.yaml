  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀καθότι ἔστησεν ἡμέραν ἐν ᾗ μέλλει κρίνειν τὴν οἰκουμένην ἐν δικαιοσύνῃ ἐν ἀνδρὶ ᾧ ὥρισεν, πίστιν παρασχὼν πᾶσιν ἀναστήσας αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/031.yaml
  text: because he has fixed a day on which he is going to judge the inhabited world in righteousness by a man whom he appointed[b][a], having given proof to all by raising him from the dead.
translation:
  language: ru
  text: потому что Он назначил день, когда будет судить весь мир по справедливости[a] через человека, которого Он назначил, дав всем доказательство[b], воскресив его из мёртвых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в праведности».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дал всем уверенность» или «удостоверение»; буквальнее: «дал всем веру». Здесь речь о доказательстве, данном посредством воскресения.'
    reason: alternative_reading
lexical_decisions:
- source_word: καθότι
  choice: потому что
  rationale: Передаёт причинную связь с предшествующим призывом к покаянию и естественно звучит по-русски.
- source_word: ἔστησεν ἡμέραν
  choice: назначил день
  rationale: Передаёт установленный Богом определённый срок; это ясно, торжественно и естественно.
- source_word: ἐν ᾗ μέλλει κρίνειν
  choice: когда будет судить
  rationale: Русское будущее естественно передаёт предстоящее и определённое действие; буквальное «намеревается судить» здесь звучало бы менее уверенно, чем греческий оборот в контексте.
- source_word: τὴν οἰκουμένην
  choice: обитаемый мир
  rationale: Сохраняет конкретное значение οἰκουμένη и всеобщий человеческий охват суда.
- source_word: ἐν δικαιοσύνῃ
  choice: по справедливости
  rationale: В контексте суда выражение обозначает праведный и справедливый характер суда; по-русски «по справедливости» естественнее буквального «в праведности».
- source_word: ἐν ἀνδρὶ ᾧ ὥρισεν
  choice: через Мужа, Которого определил для этого
  rationale: «Через» передаёт посредническую функцию ἐν; «Муж» сохраняет мужской референт ἀνήρ и достоинство стиля. Добавление «для этого» эксплицирует подразумеваемое назначение, не называя референта сверх текста.
- source_word: πίστιν παρασχὼν πᾶσιν
  choice: дал всем удостоверение
  rationale: В сочетании с παρέχω πίστις означает основание для уверенности, удостоверение или гарантию, а не субъективную веру.
- source_word: ἀναστήσας αὐτὸν ἐκ νεκρῶν
  choice: воскресив Его из мёртвых
  rationale: Деепричастный оборот передаёт средство, посредством которого Бог дал удостоверение; «из мёртвых» сохраняет образность исходного выражения.
theological_decisions:
- issue: Значение δικαιοσύνη в контексте суда
  choice: по справедливости
  alternative: в праведности
  rationale: В русском судебном контексте «по справедливости» ясно передаёт праведный характер Божьего суда, а более формальный вариант сохранён в примечании.
- issue: Значение πίστις в обороте πίστιν παρασχὼν πᾶσιν
  choice: удостоверение
  alternative: веру; уверенность; доказательство
  rationale: Идиома указывает на данное всем объективное основание для уверенности посредством воскресения. Буквальное «дал всем веру» могло бы ошибочно означать, что каждый человек получил личную спасительную веру.
- issue: Передача ἀνδρί
  choice: Мужа
  alternative: человека; мужчину
  rationale: Сохраняется мужской референт и неопределённая форма греческого выражения без прямого внесения имени Иисуса; прописная буква помогает естественно обозначить известного из контекста мессианского референта.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Местоимения, относящиеся к Богу и назначенному Им Мужу, написаны с прописной буквы. Синтаксис сохраняет причинную связь и последовательность греческого текста, избегая неестественной буквальности.
