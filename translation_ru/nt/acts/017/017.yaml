base_translation:
  language: en
  yaml_path: translation/nt/acts/017/017.yaml
  text: So he was reasoning in the synagogue with the Jews and those who worshiped God[b][a], and in the marketplace every day with those who happened to be there.
translation:
  language: ru
  text: Итак, он беседовал в синагоге с иудеями и с почитающими Бога[a], а также каждый день на городской площади[b] — с теми, кто там оказывался.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «богобоязненными». Это выражение может обозначать людей, связанных с иудейским богопочитанием.'
    reason: lexical_alternative
  - marker: b
    text: Городская площадь служила также общественным центром, где собирались люди, а не только местом торговли.
    reason: cultural_note
lexical_decisions:
- source_word: διελέγετο
  choice: беседовал
  rationale: Имперфект передаёт продолжавшееся или повторявшееся действие, а «беседовал» сохраняет диалогический характер глагола, не сводя речь ни к отвлечённому рассуждению, ни обязательно к спору.
- source_word: μὲν οὖν
  choice: итак
  rationale: Естественно обозначает продолжение и вывод из предшествующего повествования.
- source_word: ἐν τῇ συναγωγῇ
  choice: в синагоге
  rationale: В данном контексте речь идёт об иудейской синагоге как месте собрания.
- source_word: τοῖς Ἰουδαίοις
  choice: с иудеями
  rationale: Обозначает членов местной иудейской общины, а не только выходцев из Иудеи.
- source_word: τοῖς σεβομένοις
  choice: с почитающими Бога
  rationale: Слово «Бога» восполнено из контекста и обычного для Деяний употребления; выражение понятно современному читателю и не превращает обозначение группы в неясный технический термин.
- source_word: ἐν τῇ ἀγορᾷ
  choice: на городской площади
  rationale: ἀγορά была не только рынком, но и главным общественным пространством города; этот вариант лучше передаёт функцию места в данном эпизоде.
- source_word: κατὰ πᾶσαν ἡμέραν
  choice: каждый день
  rationale: Естественно передаёт регулярную ежедневную повторяемость.
- source_word: πρὸς τοὺς παρατυγχάνοντας
  choice: с теми, кто там оказывался
  rationale: Передаёт людей, случайно присутствовавших или встречавшихся там, не сужая смысл до одних прохожих.
theological_decisions:
- issue: Кого обозначает τοῖς σεβομένοις
  choice: почитающие Бога
  alternative: богобоязненные
  rationale: Вероятно, имеются в виду неиудеи, связанные с иудейским богопочитанием. Основной текст передаёт смысл описательно, а примечание сохраняет возможный групповой оттенок термина.
translation_notes:
  register: Современный литературный русский язык; достоинство повествовательного стиля сочетается с общедоступной лексикой. Тире устраняет тяжёлый повтор сказуемого. Маркеры примечаний поставлены непосредственно после соответствующих выражений и упорядочены по появлению в тексте.
