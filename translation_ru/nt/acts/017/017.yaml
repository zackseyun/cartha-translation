    rationale: В оригинале καί соединяет служение в синагоге и на агоре без противопоставления. «Также» или простое «и» точнее передаёт связь.
  - severity: medium
    issue: Примечание a утверждает вероятную этническую принадлежность группы
    rationale: τοῖς σεβομένοις буквально означает «почитающим [Бога]»; техническое понимание как связанных с синагогой неиудеев возможно в контексте Деяний, но не должно подаваться как определение, выводимое непосредственно из формы данного стиха.
