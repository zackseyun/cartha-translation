id: ACT.17.13
reference: Acts 17:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὡς δὲ ἔγνωσαν οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι ὅτι καὶ ἐν τῇ Βεροίᾳ κατηγγέλη ὑπὸ τοῦ Παύλου ὁ λόγος τοῦ θεοῦ, ἦλθον κἀκεῖ σαλεύοντες ⸂καὶ ταράσσοντες⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/013.yaml
  text: But when the Jews from Thessalonica learned that the word of God had been proclaimed by Paul in Berea also[a], they came there too[b], stirring up and troubling the crowds.
translation:
  language: ru
  text: Но когда иудеи из Фессалоники узнали, что и в Верии слово Божье было возвещено Павлом, они пришли и туда, будоража и приводя в смятение толпы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: Но когда
  rationale: Передаёт временное значение ὡς и лёгкий повествовательный контраст, выраженный δέ.
- source_word: ἔγνωσαν
  choice: узнали
  rationale: Аорист γινώσκω здесь обозначает получение известия, а не уже имеющееся знание.
- source_word: οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι
  choice: иудеи из Фессалоники
  rationale: Ясно указывает на конкретную группу по месту происхождения и не обобщает сказанное на всех иудеев.
- source_word: ὅτι καὶ ἐν τῇ Βεροίᾳ
  choice: что и в Верии
  rationale: 'Частица καί относится к дополнительному месту возвещения: весть прозвучала не только в Фессалонике, но и в Верии.'
- source_word: κατηγγέλη ὑπὸ τοῦ Παύλου
  choice: Павел возвещал
  rationale: Естественная русская активная конструкция сохраняет названного деятеля и смысл публичного провозглашения; несовершенный вид не навязывает завершённость действия.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: слово Божье
  rationale: Сохраняет устойчивое библейское выражение и его богословскую значимость, не сужая λόγος до одного из возможных толкований.
- source_word: ἦλθον κἀκεῖ
  choice: они пришли и туда
  rationale: Передаёт κἀκεῖ как распространение их противодействия также на Верию.
- source_word: σαλεύοντες
  choice: будоража
  rationale: В контексте толпы глагол означает возбуждать общественное волнение; «будоража» естественно передаёт этот образ.
- source_word: καὶ ταράσσοντες
  choice: и приводя в смятение
  rationale: Сохраняет второй, усиливающий причастный оборот и оттенок беспокойства, замешательства и волнения.
- source_word: τοὺς ὄχλους
  choice: толпы
  rationale: Нейтрально передаёт множественное число ὄχλοι без усиления до значения «чернь» или «мятежники».
theological_decisions:
- issue: Передача ὁ λόγος τοῦ θεοῦ
  choice: слово Божье
  alternative: Божья весть
  rationale: Выбран устойчивый оборот, сохраняющий как непосредственный смысл провозглашаемой вести, так и богословское звучание исходного выражения, без внесения более узкого толкования.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным стилем. Два причастия сохранены как два взаимно усиливающих действия; формулировка не изображает толпы уже сложившейся агрессивной чернью.
