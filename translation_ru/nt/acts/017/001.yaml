source:
  edition: SBLGNT
  text: Διοδεύσαντες δὲ τὴν Ἀμφίπολιν καὶ ⸀τὴν Ἀπολλωνίαν ἦλθον εἰς Θεσσαλονίκην, ὅπου ⸀ἦν συναγωγὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/001.yaml
  text: After passing through Amphipolis and Apollonia[a], they came to Thessalonica[b], where there was a synagogue of the Jews.
translation:
  language: ru
  text: Пройдя через Амфиполь и Аполлонию, они пришли в Фессалонику, где была иудейская синагога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διοδεύσαντες
  choice: Пройдя через
  rationale: Аористное причастие обозначает действие, предшествующее основному глаголу, и передаёт движение через названные города; деепричастный оборот естественен в русском повествовании.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Здесь частица служит мягким повествовательным переходом и не обозначает существенного противопоставления; отдельный союз в русском не требуется.
- source_word: Ἀμφίπολιν καὶ Ἀπολλωνίαν
  choice: Амфиполь и Аполлонию
  rationale: Географические названия переданы в принятых русских формах и поставлены в винительный падеж после предлога «через».
- source_word: ἦλθον
  choice: они пришли
  rationale: Прямо передаёт аорист множественного числа от ἔρχομαι и сохраняет простой глагол движения без добавочного акцента на завершённости прибытия.
- source_word: εἰς Θεσσαλονίκην
  choice: в Фессалонику
  rationale: εἰς с названием города указывает на движение к месту или внутрь него; русское «в Фессалонику» естественно выражает направление.
- source_word: ὅπου ἦν
  choice: где была
  rationale: Естественная русская передача относительного наречия места и глагола существования.
- source_word: συναγωγὴ τῶν Ἰουδαίων
  choice: иудейская синагога
  rationale: Форма «иудейская синагога» естественно и точно передаёт принадлежность синагоги местной иудейской общине; отсутствие артикля не требует неопределённого местоимения в русском языке.
theological_decisions:
- issue: Передача Ἰουδαίων в повествовательном контексте
  choice: иудейская
  alternative: синагога иудеев; еврейская синагога
  rationale: В данном контексте речь идёт о религиозно-этнической общине, связанной с синагогой в Фессалонике, а не исключительно о жителях Иудеи. «Иудейская» сохраняет традиционное новозаветное обозначение и звучит естественно; географическое истолкование не навязывается.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный повествовательный стиль. Деепричастный оборот сохраняет последовательность действий оригинала без тяжеловесности.
