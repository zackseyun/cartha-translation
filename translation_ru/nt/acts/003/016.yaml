  source_fidelity: 'Основная структура и все существенные элементы греческого текста переданы верно: основание в вере в имя Иисуса, повторное подлежащее «само Его имя», публичная очевидность результата и неуточнённая связь веры с Иисусом. Однако «полное исцеление» несколько смещает ὁλοκληρία от состояния полной телесной целости/здоровья к событию или процессу исцеления.'
