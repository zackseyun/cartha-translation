  - severity: low
    issue: «Полное исцеление» для ὁλοκληρία.
    rationale: Существительное обозначает полноту телесной целости, совершенное здоровье; это скорее результатное состояние, чем акт исцеления. «Полное здоровье» точнее и естественно в данном контексте.
