  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ⸀ἐπὶ τῇ πίστει τοῦ ὀνόματος αὐτοῦ τοῦτον ὃν θεωρεῖτε καὶ οἴδατε ἐστερέωσεν τὸ ὄνομα αὐτοῦ, καὶ ἡ πίστις ἡ δι’ αὐτοῦ ἔδωκεν αὐτῷ τὴν ὁλοκληρίαν ταύτην ἀπέναντι πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/016.yaml
  text: And on the basis of faith in his name[a], his name itself has made strong this man whom you see and know[c][b]; and the faith that is through him has given him this wholeness in the presence of all of you.
translation:
  language: ru
  text: И по вере в Его имя[a] само Его имя укрепило этого человека, которого вы видите и знаете; и вера через Него дала ему это полное здоровье[b] на глазах у всех вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по доверию к Его имени». Греческое слово πίστις может означать «веру», «доверие», а в некоторых контекстах — «верность».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «эту полную телесную целостность»; «это совершенное здоровье».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ πίστει
  choice: по вере
  rationale: ἐπί с дательным падежом указывает здесь на основание или причину. Русское «по вере» сохраняет эту смысловую связь и естественно вводит выражение «в Его имя».
- source_word: πίστει τοῦ ὀνόματος αὐτοῦ
  choice: вере в Его имя
  rationale: Родительный падеж при πίστις в данном контексте естественно передаётся как объект веры. «Имя» сохранено как значимое для Деяний обозначение личности и власти Иисуса.
- source_word: ἐστερέωσεν
  choice: укрепило
  rationale: Глагол означает «сделать крепким, сильным». «Укрепило» кратко и естественно передаёт телесный результат исцеления.
- source_word: θεωρεῖτε καὶ οἴδατε
  choice: которого вы видите и знаете
  rationale: Сохраняются и непосредственное наблюдение, и известность человека слушателям.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: само Его имя
  rationale: Повтор слова «имя» сохранён, а «само» подчёркивает его роль как грамматического субъекта и делает сложное построение яснее по-русски.
- source_word: ἡ πίστις ἡ δι’ αὐτοῦ
  choice: вера, которая через Него
  rationale: 'Намеренно сохранена компактная неоднозначность διά: текст не уточняет, идёт ли речь о вере, даруемой, производимой или опосредованной Иисусом.'
- source_word: ὁλοκληρίαν
  choice: полное исцеление
  rationale: В контексте физического восстановления редкое существительное обозначает полную телесную целостность и здоровье; «полное исцеление» понятно современному читателю и не сужает смысл до отдельного симптома.
- source_word: ἀπέναντι πάντων ὑμῶν
  choice: на глазах у всех вас
  rationale: Естественная русская формулировка подчёркивает публичный и очевидный характер исцеления.
theological_decisions:
- issue: Чья вера имеется в виду и как она связана с исцелением
  choice: Не указывать человеческого носителя веры; сохранить связь веры с именем Иисуса и формулу «через Него».
  alternative: Уточнить, что это вера исцелённого, вера апостолов или вера, дарованная Иисусом.
  rationale: Греческий текст не называет прямо того, чья это вера, и допускает несколько оттенков выражения δι’ αὐτοῦ. Перевод не должен устранять эту богословскую напряжённость.
- issue: Значение «имени» как действующего начала
  choice: Сохранить буквальное «само Его имя укрепило».
  alternative: Передать как «сам Иисус укрепил» или «сила Его имени укрепила».
  rationale: У Луки «имя» метонимически указывает на личность и власть Иисуса. Сохранение выражения передаёт авторский акцент и не добавляет отсутствующего в тексте слова «сила».
translation_notes:
  register: Современный литературный русский язык с достоинством публичной апостольской речи. Повтор «Его имя… само Его имя» сохранён как риторический и богословский акцент оригинала; несколько непривычная формула «вера, которая через Него» намеренно сохраняет неоднозначность греческого текста.
