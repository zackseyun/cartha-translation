source:
  edition: SBLGNT
  text: ἰδὼν δὲ ⸀ὁ Πέτρος ἀπεκρίνατο πρὸς τὸν λαόν· Ἄνδρες Ἰσραηλῖται, τί θαυμάζετε ἐπὶ τούτῳ, ἢ ἡμῖν τί ἀτενίζετε ὡς ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ πεποιηκόσιν τοῦ περιπατεῖν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/012.yaml
  text: But when Peter saw it[a], he answered the people, “Men of Israel, why do you marvel at this[b], or why do you stare at us as though by our own power or godliness we had made him walk?”
translation:
  language: ru
  text: 'Увидев это, Пётр ответил народу: «Мужи Израиля! Почему вы удивляетесь этому или почему так пристально смотрите на нас,[a] будто мы собственной силой или благочестием[b] сделали так, что он может ходить?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «почему вы неотрывно смотрите на нас?» Глагол указывает на пристальный, продолжительный взгляд.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «набожностью», «преданностью Богу». Пётр отрицает, что исцеление произошло благодаря их собственным духовным качествам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πέτρος
  choice: Увидев это, Пётр
  rationale: Аористное причастие передано обстоятельственным оборотом, обозначающим предшествующее действие. «Это» естественно восполняет подразумеваемый из контекста объект — реакцию народа на исцеление.
- source_word: ἀπεκρίνατο πρὸς τὸν λαόν
  choice: сказал народу в ответ
  rationale: Глагол обозначает отклик не только на заданный вопрос, но и на сложившуюся ситуацию. Такая формулировка сохраняет значение ответа и естественно звучит по-русски.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Мужи израильтяне
  rationale: Сохранено прямое обращение в мужском роде. «Мужи» уместно для торжественной публичной речи, оставаясь понятным современному читателю.
- source_word: τί θαυμάζετε ἐπὶ τούτῳ
  choice: Почему вы удивляетесь этому
  rationale: θαυμάζω здесь означает удивление или изумление, а ἐπὶ τούτῳ указывает на совершившееся исцеление.
- source_word: ἢ ἡμῖν τί ἀτενίζετε
  choice: или почему так пристально смотрите на нас
  rationale: ἀτενίζω выражает напряжённый, продолжительный взгляд. Наречие «пристально» передаёт эту смысловую особенность без излишней резкости слова «уставились».
- source_word: ὡς ἰδίᾳ δυνάμει
  choice: будто мы собственной силой
  rationale: ὡς вводит ошибочное предположение, которое Пётр отвергает, а ἰδίᾳ подчёркивает, что сила якобы принадлежит самим апостолам.
- source_word: εὐσεβείᾳ
  choice: благочестием
  rationale: Слово обозначает почтительное отношение к Богу, религиозную преданность или благочестие. Выбран традиционный, но всё ещё понятный литературный эквивалент.
- source_word: πεποιηκόσιν τοῦ περιπατεῖν αὐτόν
  choice: сделали так, что он стал ходить
  rationale: Формулировка естественно передаёт предполагаемую причинность и достигнутый результат, не создавая оттенка принуждения, возможного у выражения «заставили его ходить».
theological_decisions:
- issue: Может ли εὐσεβείᾳ подразумевать, что исцеление совершилось благодаря духовной заслуге апостолов
  choice: благочестием
  alternative: набожностью; преданностью Богу
  rationale: Перевод сохраняет религиозный смысл слова, но не вводит позднейших учений о заслуге. Пётр прямо отрицает, что исцеление произошло благодаря духовным качествам самих апостолов.
- issue: Передача обращения Ἄνδρες Ἰσραηλῖται
  choice: Мужи израильтяне
  alternative: Израильтяне; народ Израиля
  rationale: Сохранена грамматически мужская форма оригинального обращения без утверждения, что среди слушателей могли находиться только мужчины.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром публичной апостольской речи. Конструкция «сделали так, что он стал ходить» выбрана ради ясности и отсутствия оттенка принуждения. Знаки сносок поставлены непосредственно при тех выражениях, к которым относятся.
