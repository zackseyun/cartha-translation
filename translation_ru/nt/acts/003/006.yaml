id: ACT.3.6
reference: Acts 3:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἶπεν δὲ Πέτρος· Ἀργύριον καὶ χρυσίον οὐχ ὑπάρχει μοι, ὃ δὲ ἔχω τοῦτό σοι δίδωμι· ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου ⸀περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/006.yaml
  text: 'But Peter said[a], “Silver and gold I do not have, but what I do have, this I give to you: in the name of Jesus the Messiah the Nazarene[b], walk.”'
translation:
  language: ru
  text: 'Пётр же сказал: «Серебра и золота у меня нет, но что у меня есть, то я даю тебе: во имя Иисуса Мессии[a], Назарянина[b], ходи!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисуса Христа». Греческое Χριστός — титул со значением «Мессия», то есть «Помазанник».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «из Назарета». Греческое τοῦ Ναζωραίου буквально обозначает Назарянина.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀργύριον καὶ χρυσίον
  choice: Серебра и золота
  rationale: Сохранено буквальное называние двух металлов, образующих устойчивое обозначение материальных средств; родительный падеж естественен после отрицательной конструкции «у меня нет».
- source_word: οὐχ ὑπάρχει μοι
  choice: у меня нет
  rationale: Естественная русская конструкция обладания точно передаёт смысл греческого оборота.
- source_word: ὃ δὲ ἔχω τοῦτό σοι δίδωμι
  choice: но что у меня есть, то я даю тебе
  rationale: Соотносительные «что… то» сохраняют подчёркнутую конструкцию ὃ… τοῦτο и контраст с отсутствием серебра и золота.
- source_word: ἐν τῷ ὀνόματι
  choice: во имя
  rationale: Устоявшееся и естественное русское соответствие, сохраняющее как буквальный образ имени, так и возможный оттенок власти и полномочия.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός здесь сохраняет титульное значение; «Мессия» передаёт смысл титула, а не сводит его к имени собственному.
- source_word: τοῦ Ναζωραίου
  choice: Назарянина
  rationale: Передаёт обозначение человека из Назарета и сохраняет субстантивированную, почти титульную форму греческого слова; вариант «из Назарета» более истолковывающий.
- source_word: περιπάτει
  choice: ходи
  rationale: Настоящее повелительное наклонение передано краткой естественной командой; «начни ходить» явно выражало бы начинательное значение, которое в самой форме не обязательно.
theological_decisions:
- issue: Передача Χριστοῦ в формуле исцеления
  choice: Мессии
  alternative: Христа
  rationale: В данном провозглашении слово сохраняет значение титула «Помазанник»; «Мессия» делает этот смысл явным, тогда как традиционный вариант «Христос» указан в сноске.
- issue: Смысл выражения ἐν τῷ ὀνόματι
  choice: во имя
  alternative: властью
  rationale: Перевод не сводит многозначное выражение только к делегированной власти, а сохраняет его широкое богословское звучание.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой апостольской речи. Порядок «Пётр же сказал» сохраняет повествовательную связь δέ без архаизации. Формулировка «что у меня есть, то я даю тебе» слегка подчёркнута вслед за греческим оригиналом, но остаётся естественной.
