  source_fidelity: 'Текст точно передаёт греческий оригинал: противопоставление отсутствующих «серебра и золота» тому, что Пётр может дать; эмфатическая соотносительная конструкция «что… то»; формула «во имя»; титульное значение Χριστός; обозначение «Назарянин»; и краткое повеление περιπάτει.'
