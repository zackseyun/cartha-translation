  to: Бог Авраама, Исаака и Иакова, Бог наших отцов, прославил Своего Служителя Иисуса[a], Которого вы выдали и от Которого отреклись перед Пилатом, когда тот решил Его отпустить.
  rationale: Исправления ограничены передачей судебного действия, синтаксической связи генитива абсолютного и естественностью сноски. Они не меняют содержания, сохраняют неоднозначность παῖς и не навязывают уступительное толкование конструкции κρίναντος ἐκείνου ἀπολύειν.
