  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ θεὸς Ἀβραὰμ καὶ ⸂Ἰσαὰκ καὶ⸃ Ἰακώβ, ὁ θεὸς τῶν πατέρων ἡμῶν, ἐδόξασεν τὸν παῖδα αὐτοῦ Ἰησοῦν, ὃν ὑμεῖς ⸀μὲν παρεδώκατε καὶ ⸀ἠρνήσασθε κατὰ πρόσωπον Πιλάτου, κρίναντος ἐκείνου ἀπολύειν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/013.yaml
  text: The God of Abraham and Isaac and Jacob[a], the God of our fathers, has glorified his servant Jesus, whom you handed over and denied before Pilate, when he had decided to release him.
translation:
  language: ru
  text: Бог Авраама, Исаака и Иакова, Бог наших отцов, прославил Своего Служителя Иисуса[a], Которого вы выдали и от Которого отреклись перед Пилатом, когда тот решил Его отпустить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Своего ребёнка Иисуса». Греческое слово παῖς может означать как «ребёнок», так и «слуга, служитель»; здесь выбрано «Служитель» ввиду вероятной отсылки к образу Служителя Господа у Исаии.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: Бог Авраама, Исаака и Иакова
  rationale: Сохраняет узнаваемую заветную формулу из Исх. 3:6 и повтор союза перед последним именем, оставаясь естественным для современного русского языка.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Бог наших отцов
  rationale: Буквально и с библейской торжественностью передаёт πατέρων; в данном заветном контексте «отцов» точнее, чем более общее «предков».
- source_word: ἐδόξασεν
  choice: прославил
  rationale: Передаёт богословскую насыщенность δοξάζω и завершённое действие греческого аориста без искусственного уточнения вида или времени.
- source_word: τὸν παῖδα αὐτοῦ Ἰησοῦν
  choice: Своего Служителя Иисуса
  rationale: παῖς допускает значения «слуга/служитель» и «дитя»; «Служитель» предпочтителен ввиду вероятной отсылки к Служителю Господа у Исаии. Заглавная буква помогает воспринимать выражение как мессианское обозначение, не превращая его в отдельное имя.
- source_word: παρεδώκατε
  choice: предали
  rationale: В судебно-повествовательном контексте естественно обозначает передачу Иисуса властям; здесь слово не ограничивается значением личного предательства.
- source_word: ἠρνήσασθε
  choice: отреклись от Которого
  rationale: «Отреклись» ярко и точно передаёт отказ признать Иисуса и сохраняет связь с новозаветной лексикой отречения; дополнение перестроено ради естественного русского управления.
- source_word: κατὰ πρόσωπον Πιλάτου
  choice: перед Пилатом
  rationale: Идиоматически передаёт буквальное «перед лицом Пилата», сохраняя смысл открытого действия в его присутствии.
- source_word: κρίναντος ἐκείνου ἀπολύειν
  choice: хотя тот решил Его отпустить
  rationale: Генитивная абсолютная конструкция допускает временное прочтение, но контекст подчёркивает контраст между отречением обвинителей и решением Пилата; «тот» однозначно указывает на Пилата.
theological_decisions:
- issue: Передача παῖς применительно к Иисусу
  choice: Служитель
  alternative: Дитя
  rationale: Вероятная связь с образом Служителя Господа у Исаии делает «Служитель» наиболее уместным, при этом примечание сохраняет реальную лексическую неоднозначность и не смешивает παῖς с прямой терминологией сыновства.
- issue: Логическая связь κρίναντος ἐκείνου ἀπολύειν с главным высказыванием
  choice: хотя тот решил Его отпустить
  alternative: когда тот решил Его отпустить
  rationale: 'Сам причастный оборот может быть понят временно, однако повествовательный контекст поддерживает уступительный оттенок: адресаты отвергли Иисуса вопреки решению Пилата освободить Его. Неоднозначность отмечена в сноске.'
translation_notes:
  register: Современный литературный русский язык с dignified библейским регистром. Синтаксис сделан естественным для устной апостольской речи; заветная формула и богословски значимые слова сохранены. Местоимения, относящиеся к Богу и Иисусу, написаны с прописной буквы в соответствии с принятой русской библейской традицией.
