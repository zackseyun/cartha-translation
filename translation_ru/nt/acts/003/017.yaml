  text: Καὶ νῦν, ἀδελφοί, οἶδα ὅτι κατὰ ἄγνοιαν ἐπράξατε, ὥσπερ καὶ οἱ ἄρχοντες ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/017.yaml
  text: And now[a], brothers, I know that you acted in ignorance, just as your rulers also did.
translation:
  language: ru
  text: А теперь, братья[a], я знаю, что вы поступили так по неведению, как и ваши правители.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры»; в греческом тексте буквально «братья», но это обращение могло представительно относиться ко всей смешанной группе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ νῦν
  choice: А теперь
  rationale: Естественно передаёт связующий переход от предшествующего обличения к нынешнему обращению, сохраняя значение καί и νῦν.
- source_word: ἀδελφοί
  choice: братья
  rationale: Прямо передаёт форму мужского рода во множественном числе; в данном обращении слово может представительно охватывать более широкую смешанную группу, что отмечено в сноске.
- source_word: οἶδα
  choice: я знаю
  rationale: Прямой и естественный эквивалент утверждения Петра о своём знании.
- source_word: κατὰ ἄγνοιαν
  choice: по неведению
  rationale: Устойчиво и точно обозначает действие, совершённое вследствие незнания, не превращая это обстоятельство в полное оправдание.
- source_word: ἐπράξατε
  choice: вы поступили так
  rationale: Передаёт общее значение πράσσω и естественно отсылает к описанным ранее действиям, не добавляя нового конкретного объекта.
- source_word: ὥσπερ καὶ
  choice: как и
  rationale: Лаконично и естественно передаёт сравнение с добавочным значением καί.
- source_word: οἱ ἄρχοντες ὑμῶν
  choice: ваши правители
  rationale: Сохраняет значение лиц, наделённых властью, и подходит к контексту иерусалимского руководства, не сводя его только к неформальному лидерству.
theological_decisions:
- issue: Следует ли передать неведение как обстоятельство, полностью снимающее вину
  choice: «поступили так по неведению» без дальнейшего смягчения
  alternative: «сделали это, потому что не знали» или формулировка, прямо оправдывающая поступок
  rationale: Греческий текст указывает на неведение, однако не утверждает полной невиновности; последующий призыв к покаянию сохраняет напряжение между незнанием и ответственностью.
translation_notes:
  register: Современный литературный русский язык; обращение звучит достойно и понятно. «По неведению» сохраняет библейскую серьёзность без архаической тяжеловесности, а «поступили так» естественно связывает стих с предшествующим контекстом.
