  text: but you killed the Author of life[a], whom God raised from the dead[b], of which we are witnesses.
translation:
  language: ru
  text: Но вы убили Автора жизни[a], которого Бог воскресил из мёртвых, чему мы свидетели[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Начальника жизни», «Предводителя жизни», «Основателя жизни» или «Зачинателя жизни». Греческое слово ἀρχηγός может указывать на того, кто даёт начало, ведёт других или занимает первенствующее положение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и мы — Его свидетели». Греческий текст может указывать как на самого воскресшего Иисуса, так и на факт Его воскресения.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: но
  rationale: Союз продолжает обвинение Петра и одновременно подчёркивает резкий контраст с предыдущим контекстом; русское «но» естественно передаёт этот переход.
- source_word: ἀρχηγὸν
  choice: Автора
  rationale: 'ἀρχηγός может обозначать зачинателя, основателя, предводителя или того, кто занимает первенствующее положение. «Автор жизни» в современном русском языке ясно выражает связь Христа с происхождением жизни и сохраняет парадокс: люди убили Того, от Кого исходит жизнь.'
- source_word: τῆς ζωῆς
  choice: жизни
  rationale: Родительный падеж передан прямо и сохраняет краткую, титульную форму выражения.
- source_word: ἀπεκτείνατε
  choice: вы убили
  rationale: Прямое и естественное соответствие аористу; «предали смерти» было бы менее прямым, а «убили беззаконно» добавляло бы отсутствующую в глаголе оценку.
- source_word: ἤγειρεν ἐκ νεκρῶν
  choice: воскресил из мёртвых
  rationale: Устойчивое и точное русское выражение для новозаветного языка воскресения; сохраняет Бога как действующее лицо.
- source_word: οὗ
  choice: этому
  rationale: Указательное местоимение естественно связывает свидетельство апостолов с только что названным воскресением, не перегружая русское предложение. Возможная личная отсылка к воскресшему Иисусу отмечена в сноске.
- source_word: μάρτυρές ἐσμεν
  choice: мы свидетели
  rationale: Именная конструкция сохраняет акцент греческого текста на статусе апостолов как свидетелей, а не только на самом действии свидетельствования.
theological_decisions:
- issue: Передача христологического титула ἀρχηγὸς τῆς ζωῆς
  choice: Автор жизни
  alternative: Начальник жизни; Вождь жизни; Основатель жизни; Зачинатель жизни
  rationale: Основной вариант сохраняет смысл происхождения и начала, особенно выразительный рядом с глаголом «убили», но сноска не позволяет свести многозначное ἀρχηγός только к одному оттенку.
- issue: Референт οὗ в заключительной части стиха
  choice: мы свидетели этому
  alternative: мы — Его свидетели
  rationale: Контекст непосредственно подчёркивает свидетельство о воскресении, однако форма греческого относительного местоимения допускает отнесение к самому воскресшему Христу; эта неоднозначность сохранена сноской.
translation_notes:
  register: Современный литературный русский язык с прямой, торжественной интонацией апостольской речи. «Автор жизни» понятно современному читателю и сохраняет титульную краткость; тире выделяет заключительное утверждение о свидетельстве. Местоимение «которого» написано со строчной буквы в соответствии с современной нейтральной издательской практикой.
