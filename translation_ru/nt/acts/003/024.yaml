  text: καὶ πάντες δὲ οἱ προφῆται ἀπὸ Σαμουὴλ καὶ τῶν καθεξῆς ὅσοι ἐλάλησαν καὶ κατήγγειλαν τὰς ἡμέρας ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/024.yaml
  text: And all the prophets from Samuel and those after him[a], as many as spoke[c][b], also announced these days.
translation:
  language: ru
  text: И все пророки, начиная с Самуила и далее[a], — все, кто говорил, — также возвещали[b] об этих днях[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и тех, кто следовал за ним»; букв. «и последующих по порядку».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «провозглашали»; по смыслу в данном контексте возможно: «предсказывали».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «об этих временах». Речь идёт о нынешнем для речи Петра периоде исполнения пророчеств.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ πάντες δὲ οἱ προφῆται
  choice: И все пророки
  rationale: Сочетание καί и δέ имеет здесь связующую и слегка усилительную функцию. Простое «И» естественно передаёт продолжение речи, не создавая излишнего противопоставления.
- source_word: ἀπὸ Σαμουὴλ καὶ τῶν καθεξῆς
  choice: начиная с Самуила и далее
  rationale: ἀπό обозначает исходную точку последовательности, а субстантивированное καθεξῆς — следующих по порядку. Такой оборот краток, естественен по-русски и сохраняет идею преемственности пророков.
- source_word: ὅσοι ἐλάλησαν
  choice: все, кто говорил
  rationale: ὅσοι выражает полный охват названной группы, а ἐλάλησαν означает «говорили». Вставная конструкция сохраняет широкий охват греческой фразы.
- source_word: καὶ κατήγγειλαν
  choice: также возвещали
  rationale: καταγγέλλω означает публично объявлять или провозглашать. «Возвещали» уместно в пророческом контексте, но не вносит более узкого значения «предсказывали»; «также» передаёт координирующее καί.
- source_word: τὰς ἡμέρας ταύτας
  choice: об этих днях
  rationale: Это прямое и естественное соответствие греческой временной фразе, сохраняющее её связь с нынешним для речи Петра периодом исполнения, не конкретизируя его сверх текста.
theological_decisions:
- issue: Отнесение пророчеств к нынешнему моменту исполнения Божьего замысла
  choice: об этих днях
  alternative: об этих временах
  rationale: Фраза, вероятно, указывает на период исполнения, связанный с Мессией и событиями, о которых говорит Пётр. Перевод сохраняет буквальный временной образ и не делает эсхатологический смысл более явным, чем в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Тире выделяют пояснительную фразу «все, кто говорил» и помогают сохранить структуру греческого предложения без тяжеловесности.
