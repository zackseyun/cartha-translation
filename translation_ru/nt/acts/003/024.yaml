  source_fidelity: 'Перевод точно передаёт структуру и основной смысл греческого текста: все пророки, начиная с Самуила и следующие за ним, возвещали о «этих днях». «Начиная с Самуила и далее» корректно выражает исходную точку и последующую преемственность; «все, кто говорил» воспроизводит охватывающее ὅσοι ἐλάλησαν. Предложное оформление «возвещали об этих днях» естественно для современного русского и по смыслу соответствует прямому дополнению τὰς ἡμέρας ταύτας, не добавляя конкретного истолкования.'
