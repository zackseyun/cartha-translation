  text: ἔσται δὲ πᾶσα ψυχὴ ἥτις ⸀ἂν μὴ ἀκούσῃ τοῦ προφήτου ἐκείνου ἐξολεθρευθήσεται ἐκ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/023.yaml
  text: And every person who does not listen to that prophet will be utterly destroyed from among the people[a].
translation:
  language: ru
  text: И всякий, кто не послушает того пророка, будет истреблён из среды народа[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет отсечён от народа».'
    reason: Лексическая альтернатива, сохраняющая ветхозаветный оттенок удаления из среды народа.
lexical_decisions:
- source_word: πᾶσα ψυχὴ
  choice: всякий
  rationale: В этом обороте ψυχή обозначает отдельного человека, а не «душу» в узком антропологическом смысле. «Всякий» естественно передаёт значение выражения в современном русском языке.
- source_word: ἥτις ἂν μὴ ἀκούσῃ
  choice: кто не послушает
  rationale: Неопределённо-относительная конструкция означает «всякий, кто не…». В данном контексте ἀκούω подразумевает не просто физическое восприятие речи, а отклик и повиновение, что точно передаёт глагол «послушает».
- source_word: τοῦ προφήτου ἐκείνου
  choice: того пророка
  rationale: Фраза указывает на пророка, подобного Моисею, упомянутого выше. Строчная буква сохраняет обычное предметное значение греческого слова и не превращает его в формальный титул.
- source_word: ἐξολεθρευθήσεται
  choice: будет истреблён
  rationale: Глагол выражает суровое и полное устранение или уничтожение. «Будет истреблён» сохраняет эту силу и звучит естественно и достойно; возможный смысл «будет отсечён» вынесен в примечание.
- source_word: ἐκ τοῦ λαοῦ
  choice: из среды народа
  rationale: Предлог ἐκ указывает на удаление изнутри народа. Оборот «из среды народа» ясно сохраняет общинный смысл и не добавляет отсутствующего в греческом притяжательного местоимения.
theological_decisions:
- issue: Характер суда, которым грозит цитата или аллюзия на Второзаконие 18:19
  choice: Передать суровое уничтожение или удаление, не уточняя вид и время суда.
  alternative: Истолковать выражение исключительно как исключение из общины завета либо исключительно как окончательный Божий суд.
  rationale: Стих недвусмысленно говорит о тяжком суде над тем, кто не послушает пророка, но не определяет здесь исчерпывающе, является ли этот суд временным, общинным или эсхатологическим. Перевод сохраняет и силу глагола, и упоминание народа, не снимая богословского напряжения.
translation_notes:
  register: Современный литературный русский язык; изложение ясное, сдержанное и торжественное. Архаическое «всякая душа» заменено естественным «всякий», а пророк написан со строчной буквы, поскольку греческий текст не оформляет это слово как особый титул.
