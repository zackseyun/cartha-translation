  text: καὶ ἐξαλλόμενος ἔστη καὶ περιεπάτει, καὶ εἰσῆλθεν σὺν αὐτοῖς εἰς τὸ ἱερὸν περιπατῶν καὶ ἁλλόμενος καὶ αἰνῶν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/008.yaml
  text: And leaping up, he stood and began to walk, and he entered the temple with them, walking and jumping and praising God.
translation:
  language: ru
  text: Вскочив, он встал и начал ходить. Затем он вошёл вместе с ними в храм, ходя, подпрыгивая и восхваляя Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαλλόμενος
  choice: Вскочив
  rationale: Передаёт резкое движение вверх при вставании; деепричастие сохраняет связь с последующим ἔστη.
- source_word: περιεπάτει
  choice: начал ходить
  rationale: Имперфект обозначает начавшееся и продолжавшееся действие; по-русски естественно выразить это сочетанием «начал ходить».
- source_word: τὸ ἱερόν
  choice: храм
  rationale: В данном контексте речь о храмовом комплексе; общеупотребительное «храм» естественно и достаточно точно.
- source_word: ἁλλόμενος
  choice: подпрыгивая
  rationale: Здесь, после уже описанного вставания, слово передаёт повторяющиеся радостные прыжки, а не однократное вскакивание.
- source_word: αἰνῶν τὸν θεόν
  choice: восхваляя Бога
  rationale: Точно передаёт открыто выражаемую хвалу Богу и сохраняет параллельный ряд причастий.
