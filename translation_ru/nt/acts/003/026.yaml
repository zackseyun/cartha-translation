  source_fidelity: 'Смысловые соответствия в целом точны: «прежде всего» передаёт приоритет πρῶτον, «воздвигнув» сохраняет неоднозначность ἀναστήσας, а «Слуга» удачно отражает вероятный исайевский фон παῖς. Однако деепричастие «отвращая» при главном сказуемом «Бог ... послал» по норме русского языка относится к Богу, тогда как греческие причастие и инфинитив описывают действие посланного Слуги. Это создаёт существенную синтаксическую и смысловую неясность.'
