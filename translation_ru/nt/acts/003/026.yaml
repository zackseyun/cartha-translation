  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὑμῖν πρῶτον ⸂ἀναστήσας ὁ θεὸς⸃ τὸν παῖδα ⸀αὐτοῦ ἀπέστειλεν αὐτὸν εὐλογοῦντα ὑμᾶς ἐν τῷ ἀποστρέφειν ἕκαστον ἀπὸ τῶν πονηριῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/026.yaml
  text: To you first[a], God, having raised up his servant[b], sent him to bless you by turning each of you from your wicked ways.
translation:
  language: ru
  text: Бог прежде всего для вас, воздвигнув[a] Своего Слугу[b], послал Его, чтобы Он благословил вас и отвратил каждого из вас от ваших злых дел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может означать как «воздвигнув, явив или поставив», так и «воскресив»; здесь возможны оба смысловых оттенка.
    reason: alternative_reading
  - marker: b
    text: Или «дитя». Греческое παῖς может означать «слуга» или «дитя», однако здесь «Слуга», вероятно, перекликается с образом Слуги Господа у Исаии.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῖν πρῶτον
  choice: Для вас прежде всего
  rationale: Передаёт дательный адресата и приоритет иудейских слушателей Петра, не сводя πρῶτον лишь к порядку слов.
- source_word: ἀναστήσας
  choice: воздвигнув
  rationale: 'Сохраняет возможную двусмысленность: Бог мог «воздвигнуть» Служителя, то есть явить или поставить Его, либо речь может отсылать к воскресению.'
- source_word: τὸν παῖδα αὐτοῦ
  choice: своего Слугу
  rationale: «Слуга» естественно передаёт вероятный фон пророчеств Исаии о Слуге Господа; варианты «дитя» и «сын» здесь либо менее естественны, либо излишне конкретизируют значение.
- source_word: ἀπέστειλεν αὐτόν
  choice: послал Его
  rationale: Прямо передаёт действие Бога и сохраняет явное местоименное указание на Служителя.
- source_word: εὐλογοῦντα ὑμᾶς
  choice: благословить вас
  rationale: Инфинитив естественно выражает цель или результат послания в современном русском языке.
- source_word: ἐν τῷ ἀποστρέφειν ἕκαστον
  choice: отвращая каждого из вас
  rationale: Деепричастная конструкция передаёт средство осуществления благословения, а «каждого из вас» сохраняет распределительное значение ἕκαστον.
- source_word: ἀπὸ τῶν πονηριῶν ὑμῶν
  choice: от ваших злых дел
  rationale: Множественное число указывает на конкретные проявления зла; «злые дела» звучит естественно и сохраняет нравственную весомость выражения.
theological_decisions:
- issue: Значение ἀναστήσας применительно к Иисусу
  choice: Оставить в основном тексте «воздвигнув», не уточняя однозначно, идёт ли речь о воскресении или о явлении и поставлении Служителя.
  alternative: «воскресив из мёртвых» или «поставив/явив»
  rationale: Греческое слово допускает связь с воскресением, но в контексте речи также перекликается с обещанием о пророке и Служителе, которого Бог воздвигнет. Перевод сохраняет это напряжение.
- issue: Христологический оттенок παῖς
  choice: Перевести как «Слуга».
  alternative: «дитя» или «Сын»
  rationale: Так лучше сохраняется вероятная связь со Слугой из книги Исаии и не вносится более определённое указание на сыновство, чем выражено данным греческим словом в этом стихе.
- issue: Характер благословения
  choice: Передать благословение как совершаемое посредством отвращения каждого от злых дел.
  alternative: Понять отвращение лишь как сопутствующее обстоятельство.
  rationale: Конструкция ἐν τῷ с инфинитивом естественно выражает средство или тесно связанную с действием сопутствующую сторону; формулировка не отделяет благословение от нравственного обращения.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Сохранены повтор адресата («вас») и богословская неоднозначность ἀναστήσας. Местоимение «Его» написано с прописной буквы по устойчивой русской религиозно-издательской традиции; «Слуга» оформлено как мессианское обозначение.
