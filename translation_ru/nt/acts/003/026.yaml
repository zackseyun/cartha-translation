  terminology: «Слуга» с прописной буквы допустим как мессианское обозначение в данном регистре; сноска корректно отмечает лексическую альтернативу «дитя». «Воздвигнув» и сноска к нему не предрешают, имеется ли в виду воскресение или воздвижение/поставление.
  issues:
