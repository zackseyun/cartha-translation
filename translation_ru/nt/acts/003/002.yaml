  text: καί τις ἀνὴρ χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ ὑπάρχων ἐβαστάζετο, ὃν ἐτίθουν καθ’ ἡμέραν πρὸς τὴν θύραν τοῦ ἱεροῦ τὴν λεγομένην Ὡραίαν τοῦ αἰτεῖν ἐλεημοσύνην παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/002.yaml
  text: And a certain man[a], lame from his mother’s womb, was being carried, whom they would place every day at the gate of the temple called Beautiful, to ask for alms from those entering into the temple[c][b],
translation:
  language: ru
  text: И несли одного человека, хромого от рождения. Его каждый день сажали у ворот храма, называемых «Красивыми»[a], чтобы он просил милостыню у входивших в храм[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое название ворот буквально означает «Красивая».
    reason: lexical_alternative
  - marker: b
    text: Здесь и выше греческое слово ἱερόν обозначает весь храмовый комплекс, а не только внутреннее святилище.
    reason: cultural_note
lexical_decisions:
- source_word: τις ἀνὴρ
  choice: одного человека
  rationale: Сочетание вводит конкретного, но пока не названного человека; по-русски это естественно передаётся словами «одного человека».
- source_word: χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ ὑπάρχων
  choice: хромого от рождения
  rationale: Выражение буквально означает «хромого от чрева матери» и указывает на состояние с рождения; идиоматичный русский вариант сохраняет смысл без неестественной кальки.
- source_word: ἐβαστάζετο
  choice: несли
  rationale: Имперфект описывает происходившее в тот момент на фоне привычного ежедневного действия; неопределённо-личная конструкция естественна в русском и не добавляет неизвестных субъектов.
- source_word: ἐτίθουν καθ’ ἡμέραν
  choice: каждый день сажали
  rationale: Имперфект и обстоятельство времени выражают привычное повторяющееся действие. В данном контексте «сажали» естественнее буквального «клали» или канцелярского «помещали».
- source_word: θύραν τοῦ ἱεροῦ
  choice: у ворот храма
  rationale: В архитектурном контексте θύρα означает ворота, а ἱερόν — весь храмовый комплекс, что по-русски обычно передаётся словом «храм» с пояснением в сноске.
- source_word: τὴν λεγομένην Ὡραίαν
  choice: называемых Красивыми
  rationale: Ὡραία служит названием ворот и буквально означает «Красивая»; согласование во множественном числе соответствует русскому слову «ворота».
- source_word: τοῦ αἰτεῖν ἐλεημοσύνην
  choice: чтобы он просил милостыню
  rationale: Артиклевый инфинитив выражает цель; добавление «он» делает субъект ясным и создаёт естественную русскую фразу.
- source_word: παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν
  choice: у входивших в храм
  rationale: Причастие обозначает людей, входивших в храмовый комплекс; русский несовершенный вид сохраняет процессуальный и повторяющийся характер.
