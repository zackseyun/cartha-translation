revisions:
- from: А он крепко держался за Петра и Иоанна[a], и весь народ, вне себя от изумления, сбежался к ним в крытую колоннаду, называемую Соломоновой[b].
  to: Когда он крепко держался за Петра и Иоанна[a], весь народ в крайнем изумлении сбежался к ним, которые находились в крытой колоннаде, называемой Соломоновой[b].
  rationale: 'Заменены две формулировки: эмоционально более нагруженное «вне себя от изумления» уточнено как «в крайнем изумлении», а место действия выражено так, чтобы не приписывать тексту движение именно внутрь колоннады. Остальные элементы, включая имена, название и сноски, сохранены.'
  reviewer_model: gpt-5.6-terra
