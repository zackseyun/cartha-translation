  text: Κρατοῦντος δὲ ⸀αὐτοῦ τὸν Πέτρον καὶ ⸀τὸν Ἰωάννην συνέδραμεν ⸂πᾶς ὁ λαὸς πρὸς αὐτοὺς⸃ ἐπὶ τῇ στοᾷ τῇ καλουμένῃ Σολομῶντος ἔκθαμβοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/011.yaml
  text: While he was holding on to Peter and John[a], all the people, utterly astonished[b], ran together to them at the portico called Solomon’s.
translation:
  language: ru
  text: Когда он крепко держался за Петра и Иоанна[a], весь народ в крайнем изумлении сбежался к ним, которые находились в крытой колоннаде, называемой Соломоновой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «цеплялся за Петра и Иоанна». Греческий глагол может подчёркивать, что он крепко за них держался.'
    reason: lexical_alternative
  - marker: b
    text: Имеется в виду крытая колоннада на территории храма, традиционно известная как Соломонова колоннада.
    reason: cultural_note
lexical_decisions:
- source_word: Κρατοῦντος δὲ αὐτοῦ
  choice: А он крепко держался за
  rationale: Генитив абсолютный с причастием настоящего времени передаёт действие, происходящее одновременно с последующим. κρατέω здесь означает крепко держать или не отпускать; формулировка естественна по-русски и не приписывает исцелённому лишних мотивов.
- source_word: τὸν Πέτρον καὶ τὸν Ἰωάννην
  choice: Петра и Иоанна
  rationale: Устоявшаяся русская передача личных имён.
- source_word: συνέδραμεν
  choice: сбежался
  rationale: Глагол συντρέχω обозначает быстрое совместное движение и схождение людей к одному месту; «сбежался» кратко передаёт и стремительность, и собирательный характер действия.
- source_word: πᾶς ὁ λαὸς
  choice: весь народ
  rationale: Близко передаёт πᾶς ὁ λαός и не сужает значение до заранее определённой группы.
- source_word: πρὸς αὐτούς
  choice: к ним
  rationale: Естественно передаёт направленное движение, выраженное πρός с винительным падежом.
- source_word: ἐπὶ τῇ στοᾷ
  choice: в крытую колоннаду
  rationale: στοά — крытая галерея с колоннами. В сочетании с глаголом движения русская конструкция «сбежался… в колоннаду» ясно обозначает место, где находились апостолы.
- source_word: τῇ καλουμένῃ Σολομῶντος
  choice: называемую Соломоновой
  rationale: Сохраняет значение καλουμένῃ и традиционное наименование сооружения без ненужного повторения слова «колоннада».
- source_word: ἔκθαμβοι
  choice: вне себя от изумления
  rationale: Передаёт высокую степень потрясения и удивления, выраженную ἔκθαμβοι, и естественно согласуется с собирательным подлежащим «народ».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным стилем. «Крытая колоннада» выбрана вместо менее прозрачного для современного читателя архитектурного термина «притвор»; интенсивность ἔκθαμβοι сохранена идиомой «вне себя от изумления».
