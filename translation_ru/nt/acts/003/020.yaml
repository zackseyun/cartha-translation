source:
  edition: SBLGNT
  text: ὅπως ἂν ἔλθωσιν καιροὶ ἀναψύξεως ἀπὸ προσώπου τοῦ κυρίου καὶ ἀποστείλῃ τὸν προκεχειρισμένον ὑμῖν χριστὸν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/020.yaml
  text: so that times of refreshing may come from the presence of the Lord[a], and that he may send the Messiah appointed for you, Jesus,
translation:
  language: ru
  text: чтобы от лица Господа пришли времена облегчения и чтобы Он послал предназначенного для вас[a] Мессию, Иисуса,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «назначенного вам»; возможно также: «заранее предназначенного для вас».'
    reason: 'Лексические варианты передачи προκεχειρισμένον ὑμῖν: назначение для адресатов, а также возможный явно выраженный оттенок предварительного назначения.'
lexical_decisions:
- source_word: ὅπως ἂν
  choice: чтобы
  rationale: Союз естественно вводит цель или ожидаемый результат предшествующего призыва к покаянию, не устраняя присущей сослагательному наклонению обусловленности.
- source_word: ἔλθωσιν
  choice: пришли
  rationale: Форма сослагательного наклонения зависит от ὅπως ἂν; по-русски это естественно передаётся прошедшей формой после «чтобы».
- source_word: καιροὶ
  choice: времена
  rationale: Слово обозначает периоды или поры, особенно благоприятные или определённые обстоятельствами; «времена» сохраняет широту значения без лишней эсхатологической конкретизации.
- source_word: ἀναψύξεως
  choice: отрады
  rationale: Существительное передаёт освежение, облегчение и восстановление сил. «Отрада» сохраняет образный и возвышенный характер выражения, оставаясь понятной современному читателю.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: от присутствия Господа
  rationale: Хотя πρόσωπον буквально означает «лицо», в данном обороте речь идёт о присутствии; выбранный вариант ясно и естественно передаёт идиому.
- source_word: ἀποστείλῃ
  choice: Он послал
  rationale: Вторая форма сослагательного наклонения координирована с ἔλθωσιν и естественно передаётся конструкцией «чтобы Он послал».
- source_word: προκεχειρισμένον
  choice: назначенного
  rationale: Причастие выражает предварительное избрание или назначение. «Назначенного» передаёт основное значение, а возможная явная передача предшествования вынесена в примечание.
- source_word: ὑμῖν
  choice: вам
  rationale: Дательный падеж допускает смысл «вам» или «для вас». Краткое «назначенного вам» естественно по-русски и сохраняет допустимую смысловую широту.
- source_word: χριστὸν
  choice: Мессию
  rationale: Здесь слово выступает как титул, поэтому его значение передано переводом «Мессия», а не традиционной транслитерацией «Христос».
- source_word: Ἰησοῦν
  choice: Иисуса
  rationale: Общепринятая русская форма личного имени; тире ясно показывает, что назначенный Мессия — Иисус.
theological_decisions:
- issue: Передача χριστὸν как титула или как ставшего именем обозначения
  choice: Мессию
  alternative: Христа
  rationale: В этом контексте χριστός обозначает мессианский титул Иисуса. «Мессия» раскрывает значение титула и сохраняет иудейский контекст речи Петра.
- issue: Смысл сочетания προκεχειρισμένον ὑμῖν
  choice: назначенного вам
  alternative: предназначенного вам; ранее назначенного для вас
  rationale: Причастие допускает акцент на предварительном назначении, а дательный ὑμῖν — передачу как «вам» или «для вас». Основной текст сохраняет лаконичность, а варианты отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксический параллелизм двух оборотов с «чтобы» сохранён; запятая в конце отражает продолжение предложения в следующем стихе.
