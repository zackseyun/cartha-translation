  source_fidelity: 'Синтаксис цели и координация двух аористных конъюнктивов переданы верно. Однако «от присутствия Господа» по-русски звучит семантически неестественно: присутствие не является обычным источником, обозначаемым предлогом «от». Оборот «от лица Господа» точно передаёт греческое ἀπὸ προσώπου τοῦ κυρίου и сохраняет библейски уместный регистр. «Предназначенного для вас» естественнее и яснее передаёт προκεχειρισμένον ὑμῖν, чем двусмысленное «назначенного вам».'
