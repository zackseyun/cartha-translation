  text: καὶ εἶδεν ⸂πᾶς ὁ λαὸς αὐτὸν⸃ περιπατοῦντα καὶ αἰνοῦντα τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/009.yaml
  text: And all the people saw him walking and praising God,
translation:
  language: ru
  text: И весь народ видел, как он ходил и хвалил Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой сочинительный союз естественно продолжает повествование, не добавляя более выраженного временного значения.
- source_word: εἶδεν
  choice: видел
  rationale: Аорист ὁράω сообщает о непосредственном восприятии исцелённого человека народом; «видел» точно и естественно передаёт смысл.
- source_word: πᾶς ὁ λαὸς
  choice: весь народ
  rationale: Сочетание πᾶς с определённым артиклем и существительным в единственном числе имеет собирательный смысл; «весь народ» сохраняет его лучше, чем «вся толпа».
- source_word: αὐτὸν
  choice: как он
  rationale: В греческом это прямое дополнение при εἶδεν, за которым следуют объектные причастия; по-русски конструкция «видел, как он…» естественно передаёт ту же синтаксическую связь.
- source_word: περιπατοῦντα
  choice: ходил
  rationale: Причастие настоящего времени описывает наблюдаемое действие исцелённого; «ходил» подчёркивает факт восстановленной способности ходить.
- source_word: καὶ αἰνοῦντα
  choice: и хвалил
  rationale: αἰνέω означает воздавать хвалу, особенно Богу; «хвалил» — ясное и прямое соответствие.
- source_word: τὸν θεόν
  choice: Бога
  rationale: Определённое дополнение при глаголе хвалы; в русском языке имя «Бог» в данном контексте естественно употребляется без дополнительных определителей.
