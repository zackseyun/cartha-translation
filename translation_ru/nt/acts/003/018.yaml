id: ACT.3.18
reference: Acts 3:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ἃ προκατήγγειλεν διὰ στόματος πάντων τῶν ⸀προφητῶν παθεῖν τὸν χριστὸν ⸀αὐτοῦ ἐπλήρωσεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/018.yaml
  text: But God thus fulfilled what he had announced beforehand through the mouth of all the prophets[b][a], that his Messiah would suffer.
translation:
  language: ru
  text: 'Но Бог так исполнил то, что заранее возвестил устами всех пророков[a]: его Мессия[b] пострадает.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через всех пророков». Буквально: «устами всех пророков».'
    reason: lexical_alternative
  - marker: b
    text: Греч. «его Христос»; здесь Χριστός передано словом «Мессия», поскольку оно употреблено как титул.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Союз противопоставляет действия Бога поступкам слушателей, описанным в предыдущем стихе.
- source_word: προκατήγγειλεν
  choice: заранее возвестил
  rationale: Передаёт как временную предшествующесть, выраженную приставкой προ-, так и значение публичного провозглашения.
- source_word: διὰ στόματος πάντων τῶν προφητῶν
  choice: устами всех пророков
  rationale: Сохраняет конкретный библейский образ греческого выражения и значение πάντων — «всех», оставаясь естественным по-русски.
- source_word: παθεῖν
  choice: пострадает
  rationale: Личная форма естественно выражает содержание предварительного возвещения; будущее время не добавляет к инфинитиву явно выраженной модальной необходимости.
- source_word: τὸν χριστὸν αὐτοῦ
  choice: его Мессия
  rationale: Χριστός здесь выступает как титул, поэтому «Мессия» сохраняет иудейский контекст речи; αὐτοῦ передано притяжательным «его», относящимся к Богу.
- source_word: ἐπλήρωσεν
  choice: исполнил
  rationale: Обычное и ясное русское соответствие πληρόω в контексте исполнения пророчества.
- source_word: οὕτως
  choice: так
  rationale: Кратко и естественно передаёт указание на способ исполнения — через только что упомянутые страдания Мессии.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном месте слово функционирует как титул, а не преимущественно как имя; «Мессия» сохраняет связь с пророческими ожиданиями в речи Петра.
- issue: Модальная сила παθεῖν
  choice: его Мессия пострадает
  alternative: его Мессия должен был пострадать
  rationale: Греческий инфинитив сообщает содержание пророчества, но сам по себе не выражает необходимость настолько явно, чтобы добавлять «должен был».
- issue: Связь οὕτως с исполнением
  choice: Бог так исполнил
  alternative: Бог исполнил это
  rationale: «Так» сохраняет указание на способ исполнения и не устраняет возможную связь с описанными ранее событиями.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Сохранён оборот «устами всех пророков», но синтаксис упрощён для ясного чтения. Двоеточие естественно вводит содержание предварительного возвещения.
