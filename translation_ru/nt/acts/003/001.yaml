lexical_decisions:
- source_word: δέ
  choice: же
  rationale: Передаёт мягкую повествовательную связку и лёгкое переключение внимания без усиления до явного противопоставления.
- source_word: ἀνέβαινον
  choice: шли
  rationale: Имперфект передаёт действие в процессе. Значение движения вверх естественно подразумевается в историко-географическом контексте, тогда как «поднимались в храм» в современном русском может ошибочно восприниматься как подъём по ступеням.
- source_word: ἱερόν
  choice: храм
  rationale: Обозначает храмовый комплекс, а не только внутреннее святилище; обычное русское «храм» здесь понятно и не перегружает текст.
- source_word: ἐπὶ τὴν ὥραν
  choice: к часу
  rationale: В сочетании с глаголом движения естественно выражает направленность к установленному времени молитвы.
- source_word: τῆς προσευχῆς
  choice: молитвы
  rationale: Сохраняет родительную конструкцию устойчивого выражения «час молитвы».
- source_word: τὴν ἐνάτην
  choice: девятому часу
  rationale: Сохраняет древнюю систему отсчёта времени; современный эквивалент вынесен в примечание.
