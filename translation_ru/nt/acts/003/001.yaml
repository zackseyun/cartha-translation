  verdict: revise
  source_fidelity: 'Имперфект ἀνέβαινον удачно передан формой «шли», а «же» адекватно передаёт мягкую связующую функцию δέ. Однако «к часу молитвы» выражает движение к моменту времени и несколько ослабляет значение ἐπὶ τὴν ὥραν в данном контексте: действие происходит в установленный час молитвы. Два временных обозначения в греческом тексте следует сохранить.'
  naturalness: «В час молитвы, в девятый час» — ясная и нормативная для современного литературного русского конструкция. Она избегает несколько неестественного дательного приложения после тире («к часу молитвы — девятому часу»).
  terminology: «Храм» — приемлемое краткое соответствие ἱερόν в основном тексте. «Девятый час» сохранён как историческое обозначение; пояснение в сноске уместно. Маркер сноски следует поставить непосредственно после выражения, которое она поясняет.
  issues:
  - severity: medium
    issue: Временной оборот «к часу молитвы»
    rationale: В данном контексте ἐπὶ τὴν ὥραν обозначает время/назначенный час, а не приближение к нему. «В час молитвы» точнее и естественнее.
  - severity: low
    issue: Оформление «— девятому часу»
    rationale: Дательный падеж после «к» и тире создаёт тяжеловесное приложение. Повтор предлога в «в девятый час» ясно воспроизводит уточнение исходного текста.
  - severity: low
    issue: Положение маркера сноски
    rationale: Сноска объясняет именно «девятый час», поэтому маркер должен быть привязан к этому выражению.
  revised_text: Пётр же и Иоанн шли в храм в час молитвы, в девятый час[a].
