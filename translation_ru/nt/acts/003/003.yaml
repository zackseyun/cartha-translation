lexical_decisions:
- source_word: ὃς ἰδών
  choice: Увидев, … он
  rationale: Относительное местоимение относится к хромому из предыдущего стиха, а аористное причастие естественно передаётся русским деепричастием, выражающим предшествующее восприятие.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: Пётр и Иоанн
  rationale: Употреблены традиционные русские формы личных имён.
- source_word: μέλλοντας εἰσιέναι
  choice: собираются войти
  rationale: 'Оборот μέλλω с инфинитивом здесь указывает на близкое намерение: они были готовы войти в храм.'
- source_word: εἰς τὸ ἱερόν
  choice: в храм
  rationale: В основном тексте выбрано естественное и общепонятное обозначение; более точный смысл всего храмового комплекса пояснён в сноске.
- source_word: ἠρώτα
  choice: стал просить
  rationale: Имперфект допускает длительное или повторяющееся действие; «стал просить» естественно передаёт развёртывающуюся просьбу, не превращая её в единичное завершённое действие.
- source_word: ἐλεημοσύνην λαβεῖν
  choice: просить у них подаяния
  rationale: ἐλεημοσύνη обозначает помощь бедному, а инфинитив λαβεῖν — желаемое получение. По-русски содержание просьбы естественно выражается родительным падежом; добавление «у них» ясно указывает, к кому она обращена.
