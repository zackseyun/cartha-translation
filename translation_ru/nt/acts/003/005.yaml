  text: ὁ δὲ ἐπεῖχεν αὐτοῖς προσδοκῶν τι παρ’ αὐτῶν λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/005.yaml
  text: So he fixed his attention on them[a], expecting to receive something from them.
translation:
  language: ru
  text: Он внимательно смотрел на них[a], ожидая получить от них что-нибудь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сосредоточил на них внимание»; «не сводил с них глаз».'
    reason: Лексема ἐπέχω здесь допускает передачу как направленного внимания, так и пристального взгляда.
lexical_decisions:
- source_word: ὁ δὲ
  choice: Он
  rationale: Местоимение указывает на хромого, а слабый повествовательный переход δέ в русском не требует отдельного союза.
- source_word: ἐπεῖχεν αὐτοῖς
  choice: внимательно смотрел на них
  rationale: В данном контексте выражение означает направленное и продолжительное внимание; имперфект передан формой несовершенного вида.
- source_word: προσδοκῶν
  choice: ожидая
  rationale: Причастие обозначает сопутствующее ожидание и естественно передаётся русским деепричастием.
- source_word: τι
  choice: что-нибудь
  rationale: Неопределённое местоимение сохраняет неспецифицированный характер ожидаемого дара, не добавляя прямо отсутствующего в стихе слова «милостыня».
- source_word: παρ’ αὐτῶν
  choice: от них
  rationale: Παρά с родительным падежом обозначает источник.
- source_word: λαβεῖν
  choice: получить
  rationale: Инфинитив выражает содержание ожидания; «получить» уместно в контексте предполагаемого подаяния.
