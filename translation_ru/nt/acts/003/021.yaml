review_pass:
  verdict: revise
  source_fidelity: 'Основная синтаксическая проблема — «о чём Бог говорил». В греческом ὧν естественно относится к πάντων как относительное местоимение в родительном падеже (вероятно, вследствие падежного притяжения): речь о «всём, что Бог возвестил», а не о том, «о чём» Он говорил. Английская контрольная версия также сохраняет эту связь: «all things that God spoke».'
  naturalness: «Его должно принять небо» допустимо и сохраняет библейскую торжественность, но «Небо должно принять Его» естественнее для современного литературного русского, не меняя образа или модальности. Остальной регистр удачен.
  terminology: «Восстановление всего» верно передаёт ἀποκατάστασις πάντων и не сужает богословски открытый объём выражения. «Устами Своих святых пророков издревле» точно и литературно передаёт διὰ στόματος τῶν ἁγίων ἀπ’ αἰῶνος αὐτοῦ προφητῶν.
