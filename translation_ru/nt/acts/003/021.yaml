    rationale: Такой перевод представляет пророческую речь как речь о восстановлении, тогда как текст формулирует восстановление всего того, что Бог возвестил через пророков. Следует сохранить связь с «всего» посредством «что Бог возвестил».
  revised_text: Небо должно принять Его до времён восстановления всего, что Бог возвестил устами Своих святых пророков издревле.
