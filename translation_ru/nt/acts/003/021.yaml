  text: ὃν δεῖ οὐρανὸν μὲν δέξασθαι ἄχρι χρόνων ἀποκαταστάσεως πάντων ὧν ἐλάλησεν ὁ θεὸς διὰ ⸀στόματος τῶν ἁγίων ⸂ἀπ’ αἰῶνος αὐτοῦ προφητῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/021.yaml
  text: whom heaven must receive until the times of the restoration of all things that God spoke through the mouth of his holy prophets from of old.
translation:
  language: ru
  text: Небо должно принять Его до времён восстановления всего, что Бог возвестил устами Своих святых пророков издревле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃν δεῖ οὐρανὸν μὲν δέξασθαι
  choice: Его должно принять небо
  rationale: Сохранены объектное «Его», безличная необходимость δεῖ и небо как грамматический субъект инфинитива δέξασθαι; формулировка остаётся естественной и торжественной по-русски.
- source_word: ἄχρι χρόνων
  choice: до времён
  rationale: Передаёт множественное число χρόνων и временной предел ἄχρι без сведения выражения к одному моменту.
- source_word: ἀποκαταστάσεως πάντων
  choice: восстановления всего
  rationale: ἀποκατάστασις обозначает восстановление или возвращение в должное состояние; πάντων намеренно сохранено в широком и неоднозначном значении «всего».
- source_word: ὧν ἐλάλησεν ὁ θεός
  choice: о чём Бог говорил
  rationale: 'Родительное относительное местоимение ὧν естественно понимается при подразумеваемом περί: речь идёт о том, о чём говорил Бог. Это грамматически яснее по-русски, чем буквальное «которое Бог говорил».'
- source_word: διὰ στόματος
  choice: устами
  rationale: Естественный русский способ передать семитизированное выражение «через уста», сохраняя смысл пророческого посредничества.
- source_word: ἀπ’ αἰῶνος
  choice: издревле
  rationale: Кратко и в достойном регистре передаёт значение «с давних времён», не навязывая философского смысла вечности.
theological_decisions:
- issue: Объём выражения ἀποκαταστάσεως πάντων
  choice: восстановления всего
  alternative: восстановления всех вещей / всеобщего восстановления
  rationale: Сохранена широта и потенциальная неоднозначность греческого выражения; перевод не уточняет объём восстановления и не превращает стих в утверждение конкретной доктрины о всеобщем спасении.
- issue: Связь относительного ὧν
  choice: о чём Бог говорил
  alternative: что Бог говорил
  rationale: Выбран распространённый синтаксический анализ с подразумеваемым περί, согласно которому пророки говорили о восстановлении. Он даёт ясный русский текст, не утверждая, будто «всё» само является непосредственным дополнением глагола «говорил».
- issue: Необходимость пребывания Христа на небе
  choice: Его должно принять небо до времён
  alternative: Он должен оставаться на небе до времён
  rationale: Сохранён образ неба, принимающего Его, и модальность божественной необходимости, без добавления отсутствующего в греческом глагола «оставаться».
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис близок к греческому, но относительное предложение оформлено естественно для русского языка. Заглавная буква в «Своих» соответствует традиционному уважительному оформлению местоимения, относящегося к Богу.
