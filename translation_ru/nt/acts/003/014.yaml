  yaml_path: translation/nt/acts/003/014.yaml
  text: But you denied the Holy and Righteous One[a], and asked for a murderer to be granted to you,
translation:
  language: ru
  text: Но вы отреклись от Святого и Праведного и попросили отпустить вам убийцу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «чтобы вам был дарован убийца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ
  choice: Но вы
  rationale: δέ выражает противопоставление предыдущему высказыванию, а явное ὑμεῖς подчёркивает прямое обвинение; «Но вы» естественно передаёт обе функции.
- source_word: τὸν ἅγιον καὶ δίκαιον
  choice: Святого и Праведного
  rationale: Артикль и согласованные прилагательные употреблены субстантивированно как весомое наименование Иисуса. Русская форма не требует добавления слова «Тот» или «Человек»; прописные буквы передают титульный характер.
- source_word: ἠρνήσασθε
  choice: отреклись от
  rationale: ἀρνέομαι здесь означает отречение и отказ признать Иисуса. Управление «отреклись от» естественно по-русски и сохраняет как судебный, так и личностный оттенок.
- source_word: ᾐτήσασθε
  choice: попросили
  rationale: αἰτέω означает просить или ходатайствовать. «Попросили» точно передаёт смысл без усиления до «потребовали».
- source_word: ἄνδρα φονέα
  choice: убийцу
  rationale: Сочетание ἄνδρα φονέα идиоматически обозначает человека-убийцу. В русском «убийцу» естественно и полно передаёт референт; буквальное «человека-убийцу» было бы тяжеловесно.
- source_word: χαρισθῆναι ὑμῖν
  choice: чтобы вам даровали
  rationale: Пассивный инфинитив χαρισθῆναι выражает предоставление кого-либо как милости. «Даровали» сохраняет более широкий лексический смысл, тогда как контекстуальное «отпустили» вынесено в примечание.
theological_decisions:
- issue: Христологическая сила выражения τὸν ἅγιον καὶ δίκαιον
  choice: Передать как титульное наименование «Святого и Праведного» с прописных букв
  alternative: Передать как обычные описательные прилагательные «святого и праведного»
  rationale: В контексте это субстантивированные, богословски значимые обозначения Иисуса. Прописные буквы показывают титульную функцию, не добавляя содержания, отсутствующего в тексте.
- issue: Судебно-контекстуальный оттенок χαρισθῆναι
  choice: В основном тексте сохранить более широкое «даровали»
  alternative: Передать контекстуально как «отпустили»
  rationale: Сам глагол означает даровать или предоставить как милость, хотя в повествовательном контексте речь идёт об освобождении Вараввы. Более явный контекстуальный смысл сохранён в примечании.
translation_notes:
  register: Современный литературный русский язык; прямой и торжественный обвинительный тон сохранён. Синтаксис сделан естественным для русского, без конфессионально окрашенных добавлений.
