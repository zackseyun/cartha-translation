  text: καὶ πιάσας αὐτὸν τῆς δεξιᾶς χειρὸς ἤγειρεν ⸀αὐτόν· παραχρῆμα δὲ ἐστερεώθησαν ⸂αἱ βάσεις αὐτοῦ⸃ καὶ τὰ ⸀σφυδρά,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/007.yaml
  text: And taking him by the right hand[a], he raised him up; and immediately his feet and ankles were strengthened.
translation:
  language: ru
  text: И, взяв его за правую руку, он поднял его. И тотчас окрепли его ступни и лодыжки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιάσας
  choice: взяв
  rationale: Аористное причастие обозначает действие, предшествующее основному глаголу. «Взяв» естественно передаёт физический контакт без резкого оттенка «схватив».
- source_word: τῆς δεξιᾶς χειρός
  choice: за правую руку
  rationale: Родительный падеж после πιάσας по-русски естественно передаётся конструкцией «взяв за…». Принадлежность руки понятна из контекста и не нуждается в добавлении местоимения.
- source_word: ἤγειρεν αὐτόν
  choice: он поднял его
  rationale: Передаёт обычное значение ἐγείρω и конкретное физическое действие, не добавляя интерпретирующего «помог встать».
- source_word: παραχρῆμα
  choice: тотчас
  rationale: Сохраняет подчёркнутую внезапность результата и соответствует достоинству повествовательного регистра.
- source_word: ἐστερεώθησαν
  choice: окрепли
  rationale: Естественно передаёт наступившее укрепление частей тела. Русская непереходная форма не уточняет действующего лица и не добавляет отсутствующего в этой фразе указания на божественное действие.
- source_word: αἱ βάσεις αὐτοῦ
  choice: его ступни
  rationale: βάσεις обозначает опорные части стоп; «ступни» конкретнее и естественнее буквального «основания», при этом не сужает значение до одних подошв.
- source_word: τὰ σφυδρά
  choice: лодыжки
  rationale: Слово обозначает область или суставы лодыжек. «Лодыжки» — современный и достаточно точный анатомический эквивалент без излишней конкретизации «лодыжечные кости».
theological_decisions:
- issue: Характер описания исцеления
  choice: Передать непосредственное физическое укрепление ступней и лодыжек без пояснения механизма чуда.
  alternative: Перевести как «исцелились» или прямо указать здесь на действие Бога.
  rationale: Греческий текст конкретно сообщает об укреплении частей тела, а чудесный характер события раскрывается контекстом. Перевод не добавляет отсутствующей в предложении богословской интерпретации.
translation_notes:
  register: Современный литературный русский язык; ясный, сдержанный и достойный повествовательный стиль. Порядок действий и внезапность исцеления сохранены.
