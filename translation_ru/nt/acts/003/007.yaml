  source_fidelity: 'Текст точно передаёт последовательность греческого оригинала: Пётр берёт человека за правую руку и поднимает его; затем немедленно обретают силу его ступни и лодыжки. «Тотчас» адекватно передаёт παραχρῆμα, а «окрепли» естественно выражает ἐστερεώθησαν, не добавляя указания на действующее лицо.'
  naturalness: Фраза звучит естественно на современном литературном русском. Конструкция «взяв его за правую руку, он поднял его» ясна в повествовательном контексте; «ступни и лодыжки» — понятное и согласованное анатомическое сочетание.
