base_translation:
  language: en
  yaml_path: translation/nt/acts/003/004.yaml
  text: And Peter[a], together with John, fixed his gaze on him and said, “Look at us.”
translation:
  language: ru
  text: 'Пётр вместе с Иоанном пристально посмотрел на него и сказал: «Посмотри на нас».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίσας
  choice: пристально посмотрел
  rationale: Причастие от ἀτενίζω обозначает сосредоточенный, направленный взгляд; это сочетание естественно передаёт интенсивность действия по-русски.
- source_word: δὲ
  choice: не передано отдельно
  rationale: Здесь δέ служит слабой повествовательной связкой; в современном русском последовательность естественно выражается без отдельного союза.
- source_word: σὺν τῷ Ἰωάννῃ
  choice: вместе с Иоанном
  rationale: Предлог σύν с дательным падежом выражает совместность и подчёркивает участие Иоанна.
- source_word: εἶπεν
  choice: сказал
  rationale: Обычное и контекстуально точное соответствие глаголу речи.
- source_word: Βλέψον
  choice: Посмотри
  rationale: Аористный императив выражает прямое разовое побуждение обратить взгляд; «посмотри» естественнее в данном контексте, чем более продолжительное «смотри».
- source_word: εἰς ἡμᾶς
  choice: на нас
  rationale: При глаголе зрительного восприятия εἰς обозначает направленность взгляда и по-русски естественно передаётся предлогом «на».
- source_word: εἰς αὐτόν
  choice: на него
  rationale: С ἀτενίζω предлог εἰς указывает объект сосредоточенного взгляда.
