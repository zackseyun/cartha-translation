  text: μετανοήσατε οὖν καὶ ἐπιστρέψατε ⸀πρὸς τὸ ἐξαλειφθῆναι ὑμῶν τὰς ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/019.yaml
  text: Therefore repent and turn back[a], so that your sins may be wiped away,
translation:
  language: ru
  text: Итак, покайтесь и обратитесь, чтобы ваши грехи были изглажены[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стёрты».'
    reason: Лексический вариант, яснее передающий конкретный образ ἐξαλείφω — стирания написанного.
lexical_decisions:
- source_word: μετανοήσατε
  choice: покайтесь
  rationale: 'Аорист, действительный залог, повелительное наклонение: призыв к решительному покаянию. «Покайтесь» естественно и ёмко передаёт нравственный и религиозный смысл, не ослабляя его до простой перемены мнения.'
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предшествующего рассуждения и естественно звучит в современной русской речи.
- source_word: ἐπιστρέψατε
  choice: обратитесь
  rationale: Аорист, действительный залог, повелительное наклонение. В сочетании с «покайтесь» обозначает деятельное обращение к Богу; активная форма не заменена пассивным «будьте обращены».
- source_word: πρὸς τὸ ἐξαλειφθῆναι
  choice: чтобы … были изглажены
  rationale: Оборот с πρὸς и субстантивированным инфинитивом допускает оттенок цели или результата. Русское «чтобы» сохраняет эту связь, не уточняя догматический механизм.
- source_word: ἐξαλειφθῆναι
  choice: были изглажены
  rationale: Пассивный инфинитив ἐξαλείφω передаёт образ полного удаления или стирания. «Изглажены» сохраняет библейскую образность и остаётся понятным в данном устойчивом сочетании; более буквальный образ отмечен в сноске.
- source_word: ἁμαρτίας
  choice: грехи
  rationale: Прямое и общепринятое соответствие множественному числу ἁμαρτία без сужения смысла до отдельных поступков.
theological_decisions:
- issue: Связь покаяния и обращения с удалением грехов
  choice: «чтобы ваши грехи были изглажены»
  alternative: «для изглаживания ваших грехов»
  rationale: Формулировка сохраняет выраженную в тексте связь цели/результата, но не превращает этот стих в изложение полного порядка спасения и не вносит конфессионального толкования.
- issue: Различение двух повелений μετανοήσατε и ἐπιστρέψατε
  choice: «покайтесь и обратитесь»
  alternative: «измените образ мыслей и поверните назад»
  rationale: 'Два глагола сохранены раздельно: первый выражает покаяние, второй — обращение. При этом русский текст не создаёт искусственного противопоставления между внутренней переменой и возвращением к Богу.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Итак» естественнее связывает стих с предыдущей речью; «покайтесь и обратитесь» понятно широкому читателю и сохраняет два активных повеления оригинала.
