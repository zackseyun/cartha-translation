id: ACT.3.10
reference: Acts 3:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐπεγίνωσκον ⸀δὲ αὐτὸν ὅτι ⸀οὗτος ἦν ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος ἐπὶ τῇ Ὡραίᾳ Πύλῃ τοῦ ἱεροῦ, καὶ ἐπλήσθησαν θάμβους καὶ ἐκστάσεως ἐπὶ τῷ συμβεβηκότι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/010.yaml
  text: And they recognized him[a], that this was the man who used to sit for alms at the Beautiful Gate of the temple[b], and they were filled with amazement and astonishment at what had happened to him.
translation:
  language: ru
  text: 'И они узнавали его: это был тот самый человек, который обычно сидел у Красивых ворот храма[a] и просил милостыню. И они исполнились изумления и потрясения от того, что с ним произошло.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово ἱερόν обозначает весь храмовый комплекс, а не только внутреннее святилище.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεγίνωσκον
  choice: узнавали
  rationale: Имперфект передаёт продолжающееся узнавание людьми знакомого им человека; «узнавали» естественно сохраняет этот видовой оттенок.
- source_word: δὲ
  choice: И
  rationale: Здесь δέ служит мягкой повествовательной связкой без выраженного противопоставления.
- source_word: οὗτος ἦν
  choice: это был тот самый человек
  rationale: Так передана усиленная указательная идентификация исцелённого с известным всем просителем милостыни.
- source_word: ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος
  choice: который обычно сидел ... и просил милостыню
  rationale: Естественная русская формулировка раскрывает контекстуальное значение обычного, повторявшегося занятия, не создавая впечатления, будто он лишь сидел рядом с милостыней.
- source_word: ἐλεημοσύνην
  choice: милостыню
  rationale: Точный и общепонятный русский термин для подаяния нуждающемуся.
- source_word: ἐπὶ τῇ Ὡραίᾳ Πύλῃ
  choice: у Красивых ворот
  rationale: Предлог «у» естественно обозначает место возле ворот; название передано как имя собственное.
- source_word: τοῦ ἱεροῦ
  choice: храма
  rationale: В основном тексте употреблено привычное русское обозначение, хотя греческое ἱερόν относится ко всему храмовому комплексу.
- source_word: ἐπλήσθησαν
  choice: исполнились
  rationale: Сохраняет образ наполнения состоянием и соответствует dignified библейскому повествовательному регистру, оставаясь понятным современному читателю.
- source_word: θάμβους
  choice: изумления
  rationale: Передаёт сильное ошеломлённое удивление и позволяет отличить термин от следующего ἔκστασις.
- source_word: ἐκστάσεως
  choice: потрясения
  rationale: В данном контексте обозначает состояние человека, выведенного из обычного душевного равновесия, а не мистический экстаз.
- source_word: ἐπὶ τῷ συμβεβηκότι αὐτῷ
  choice: от того, что с ним произошло
  rationale: Естественно передаёт причину реакции и совершившееся событие с сохраняющимся результатом.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Конструкция «тот самый человек» подчёркивает узнавание, а «обычно сидел» выражает привычный характер прежнего занятия. Смысл ἱερόν уточнён в сноске.
