  source_fidelity: 'Текст точно передаёт греческий оригинал: «сыны» сохраняет υἱοί, «завет» — διαθήκη, «заключил с вашими отцами» естественно выражает διέθετο…πρὸς τοὺς πατέρας ὑμῶν, а «в твоём потомстве» сохраняет собирательность σπέρμα. Будущий пассив «благословятся» соответствует ἐνευλογηθήσονται. «Семьи земли» допустимо передаёт πατριαί τῆς γῆς и удерживает универсальный масштаб обещания.'
