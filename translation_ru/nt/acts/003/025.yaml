id: ACT.3.25
reference: Acts 3:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὑμεῖς ἐστε ⸀οἱ υἱοὶ τῶν προφητῶν καὶ τῆς διαθήκης ἧς ⸂διέθετο ὁ θεὸς⸃ πρὸς τοὺς πατέρας ⸀ὑμῶν, λέγων πρὸς Ἀβραάμ Καὶ ἐν τῷ σπέρματί σου ⸀ἐνευλογηθήσονται πᾶσαι αἱ πατριαὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/025.yaml
  text: You are the sons of the prophets and of the covenant that God made with your fathers[a], saying to Abraham[b], ‘And in your offspring all the families of the earth will be blessed.’
translation:
  language: ru
  text: 'Вы — сыны пророков и завета, который Бог заключил с вашими отцами[a], сказав Аврааму: «И в твоём потомстве[b] благословятся все семьи земли».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предками».'
    reason: «Отцы» буквально сохраняет πατέρες и библейское обозначение праотцов; «предки» является естественным современным смысловым вариантом.
  - marker: b
    text: 'Буквально: «семени». Греческое слово может обозначать потомство собирательно, но в библейско-богословском контексте допускает также смысл единственного представителя.'
    reason: Сноска сохраняет лексическую форму и намеренно не устраняет напряжение между собирательным и единственным представительным прочтением.
lexical_decisions:
- source_word: υἱοὶ
  choice: сыны
  rationale: Сохраняет мужской род и библейское выражение о наследниках и участниках обетований; речь не обязательно о биологическом происхождении.
- source_word: τῶν προφητῶν
  choice: пророков
  rationale: Прямо передаёт родительный падеж; выражение указывает на принадлежность к наследию пророческих обетований.
- source_word: διαθήκης
  choice: завета
  rationale: В контексте Божьего обещания Аврааму διαθήκη означает завет, а не завещание или просто соглашение.
- source_word: διέθετο ὁ θεὸς
  choice: Бог заключил
  rationale: Естественная русская формула для заключения завета, точно передающая значение среднего залога διατίθεμαι в данном сочетании.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: с вашими отцами
  rationale: Предлог πρός в контексте заключения завета естественно передаётся русским «с»; «отцы» сохраняет историко-родовой смысл.
- source_word: λέγων πρὸς Ἀβραάμ
  choice: сказав Аврааму
  rationale: Кратко и естественно передаёт греческое причастие, вводя содержание заветного обещания.
- source_word: σπέρματί
  choice: потомстве
  rationale: «Потомство» сохраняет собирательную семантику σπέρμα и не исключает возможности единственного представительного смысла, присутствующего в библейско-богословском контексте.
- source_word: ἐνευλογηθήσονται
  choice: благословятся
  rationale: Передаёт будущее страдательное значение и сохраняет традиционную форму цитаты, не уточняя сверх текста, кто именно совершает благословение.
- source_word: πατριαὶ
  choice: семьи
  rationale: Естественно передаёт семейно-родовые объединения; «роды» возможно, но в современном русском звучит уже и менее непосредственно.
- source_word: γῆς
  choice: земли
  rationale: Универсальный охват Авраамова обещания требует значения всей земли, а не отдельной страны.
theological_decisions:
- issue: Мужской и заветно-наследственный смысл υἱοὶ
  choice: сыны
  alternative: дети
  rationale: «Сыны» сохраняет грамматический мужской род и выражение о наследниках заветных обетований. Слово может включать всех участников этого наследия, что пояснено в сноске.
- issue: Собирательный и возможный представительный смысл σπέρμα
  choice: потомство
  alternative: семя; потомок
  rationale: «Потомство» естественно по-русски и сохраняет собирательный смысл, не устраняя возможного единственного представительного оттенка; «потомок» принудительно делал бы выражение единственным числом, а «семя» звучит архаично.
- issue: Залог в ἐνευλογηθήσονται
  choice: благословятся
  alternative: будут благословлены
  rationale: Обе формы передают будущий пассив; возвратно-страдательная форма естественна в формулировке библейского обещания и не снимает невыраженность действующего лица.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. «Сыны» и «отцы» сохранены как узнаваемые заветно-наследственные термины, но их смысл пояснён. Синтаксис слегка сглажен для русского языка без устранения неоднозначности σπέρμα.
