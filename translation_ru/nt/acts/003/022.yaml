reference: Acts 3:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Μωϋσῆς ⸀μὲν εἶπεν ὅτι Προφήτην ὑμῖν ἀναστήσει κύριος ὁ ⸀θεὸς ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ· αὐτοῦ ἀκούσεσθε κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/022.yaml
  text: Moses indeed said[a], ‘The Lord God will raise up for you a prophet from among your brothers, like me[b]. You shall listen to him in everything he says to you.’
translation:
  language: ru
  text: 'Моисей же сказал: «Господь Бог[b] воздвигнет для вас пророка из среды ваших братьев[a], подобного мне. Слушайтесь его во всём, что бы он ни сказал вам».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из среды ваших соплеменников». В греческом тексте буквально сказано «из среды ваших братьев»; мужское обозначение родства здесь употреблено в представительном смысле применительно к народу завета.'
    reason: lexical_alternative
  - marker: b
    text: Здесь Деяния цитируют Второзаконие 18:15 с некоторыми отличиями в формулировке. В частности, греческий текст Деяний говорит «Господь Бог», а не «Господь, ваш Бог».
    reason: cross_reference
lexical_decisions:
- source_word: Μωϋσῆς μὲν εἶπεν
  choice: Моисей же сказал
  rationale: Имя передано в общепринятой русской форме; частица μέν отражена через «же», которое естественно отмечает развитие рассуждения, не создавая искусственного противопоставления.
- source_word: Προφήτην
  choice: пророка
  rationale: Существительное оставлено нарицательным и неопределённым по смыслу; перевод не подменяет формулировку текста титулом «Пророк» и не вставляет слово «Мессия».
- source_word: ἀναστήσει
  choice: воздвигнет
  rationale: «Воздвигнет» сохраняет образ исходного глагола и связь с цитатой из Второзакония; здесь речь прежде всего о появлении и поставлении пророка, а не о воскресении.
- source_word: κύριος ὁ θεὸς
  choice: Господь Бог
  rationale: Перевод следует именно греческому тексту Деяний, где отсутствует местоимение «ваш», и не гармонизирует его с формой цитаты во Второзаконии.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: из среды ваших братьев
  rationale: Переданы предлог ἐκ и грамматически мужское ἀδελφῶν; в данном заветно-этническом контексте «братья» обозначает соплеменников.
- source_word: ὡς ἐμέ
  choice: подобного мне
  rationale: 'Сохранён прямой сравнительный смысл: обещанный пророк будет подобен Моисею.'
- source_word: αὐτοῦ ἀκούσεσθε
  choice: Слушайтесь его
  rationale: Будущая форма в цитате имеет повелительно-заветную силу. «Слушайтесь» передаёт не простое восприятие речи, а послушное внимание.
- source_word: κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς
  choice: во всём, что бы он ни сказал вам
  rationale: Оборот естественно передаёт всеохватность κατὰ πάντα и неопределённо-обобщающий оттенок ὅσα ἂν с сослагательным наклонением.
theological_decisions:
- issue: Цитата из Второзакония 18 и мессианское отнесение
  choice: Сохранено выражение «пророка» без поясняющей вставки «Мессия» и без превращения слова в титул.
  alternative: «Пророка» как титул или прямо «Мессию».
  rationale: В контексте Пётр относит пророчество к Иисусу, однако сама цитата говорит о пророке. Перевод сохраняет формулировку и богословское движение текста, не внося толкование внутрь цитаты.
- issue: Значение ἀδελφῶν
  choice: ваших братьев
  alternative: ваших братьев и сестёр; ваших соотечественников
  rationale: Мужская форма исходного текста сохранена, а её более широкое заветно-этническое значение пояснено в сноске.
- issue: Повелительная сила ἀκούσεσθε
  choice: Слушайтесь его
  alternative: Вы будете слушать его; Слушайте его
  rationale: Форма будущего времени в контексте цитаты выражает обязательное повеление; возвратный глагол ясно передаёт требование повиноваться сказанному.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Воздвигнет» сохраняет межтекстовую связь и достоинство стиля, а «Слушайтесь» делает обязательную силу фразы ясной обычному читателю. Местоимения, относящиеся к обещанному пророку, набраны со строчной буквы, поскольку исходный текст сам по себе не кодирует почтительное русское написание.
