    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: мы
  rationale: Явно выраженное местоимение подчёркивает субъект и вместе с δὲ создаёт контраст с теми, кому поручат другое служение.
- source_word: δὲ
  choice: а
  rationale: В данном контексте союз обозначает противопоставление предыдущему предложению; русское «а» передаёт его естественно, без излишне резкого оттенка.
- source_word: τῇ προσευχῇ
  choice: молитве
  rationale: Дательный падеж при προσκαρτερέω указывает на занятие, которому посвящают себя; эта конструкция естественна по-русски.
- source_word: διακονίᾳ
  choice: служению
  rationale: Слово означает служение или исполнение порученной задачи. «Служение» сохраняет связь с тем же смысловым полем, что и обслуживание столов, и не вводит жёсткого разделения между духовным и практическим трудом.
- source_word: τοῦ λόγου
  choice: словом
  rationale: Родительное сочетание обозначает служение, осуществляемое посредством возвещения слова. Творительный падеж звучит по-русски естественно и яснее передаёт характер деятельности, чем тяжеловесное «служение слова».
- source_word: προσκαρτερήσομεν
  choice: посвятим себя
  rationale: Будущее время глагола выражает твёрдое намерение постоянно и усердно заниматься названными делами; «посвятим себя» передаёт устойчивую отдачу этому делу.
theological_decisions:
- issue: Значение διακονία в сопоставлении с обслуживанием столов
  choice: служение словом
  alternative: служба слова; возвещение слова
  rationale: Выбор сохраняет служебный характер апостольской задачи и не превращает выражение в специальный титул или указание на отдельное сословие.
- issue: Значение λόγος
  choice: слово
  alternative: весть; Божье слово
  rationale: В контексте Деяний речь идёт о возвещаемом слове, однако определение «Божье» в данном стихе прямо отсутствует. «Слово» сохраняет краткость и контекстуально понятную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. Начальное «А мы» сохраняет контраст и акцент явного ἡμεῖς. Все элементы исходного предложения представлены без добавления конфессиональной терминологии.
