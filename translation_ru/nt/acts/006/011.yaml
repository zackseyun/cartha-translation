    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Обычная временная связка, последовательно вводящая следующий эпизод повествования.
- source_word: ὑπέβαλον
  choice: тайно подговорили
  rationale: Глагол в данном контексте означает скрыто побудить или подучить кого-либо; сочетание передаёт и побуждение, и закулисный характер действия.
- source_word: ἄνδρας
  choice: нескольких мужчин
  rationale: ἀνήρ обозначает здесь лиц мужского пола. Слово «нескольких» естественно выражает неопределённость без добавления конкретного числа.
- source_word: λέγοντας
  choice: заявить
  rationale: Причастная конструкция после ὑπέβαλον по-русски естественно передаётся инфинитивом, обозначающим внушённое им высказывание; «заявить» подходит к последующему обвинению.
- source_word: Ἀκηκόαμεν
  choice: Мы слышали
  rationale: Русский язык обычно передаёт результативный перфект данного глагола прошедшим временем; контекст самой реплики сохраняет силу свидетельского заявления.
- source_word: αὐτοῦ λαλοῦντος
  choice: как он произносил
  rationale: Конструкция с глаголом слухового восприятия естественно передаётся оборотом «слышали, как…»; «произносил» сохраняет акцент на речевом действии.
- source_word: ῥήματα βλάσφημα
  choice: хульные слова
  rationale: Близко передаёт форму и религиозно-правовую силу обвинения, не утверждая его истинность.
- source_word: εἰς Μωϋσῆν καὶ τὸν θεόν
  choice: против Моисея и Бога
  rationale: В контексте враждебного обвинения εἰς указывает на направленность оскорбительной речи; общее «против» естественно относится к обоим дополнениям.
theological_decisions:
- issue: Характер обвинения против Стефана
  choice: Передать βλάσφημα как «хульные», сохранив религиозно-правовую силу предъявленного обвинения.
  alternative: «оскорбительные» или «клеветнические» слова
  rationale: Повествование сообщает содержание подстроенного обвинения, не подтверждая его истинность. «Хульные» сохраняет напряжение между серьёзностью заявления и его ложным происхождением.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Формулировка ясна широкому читателю; «хульные слова» сохраняет библейскую и юридико-религиозную окраску, а сноска поясняет скрытый характер подстрекательства.
