revisions:
- from: 'Тогда Двенадцать созвали всех учеников и сказали: «Нехорошо нам, оставив слово Божье, обслуживать столы[a]».'
  to: 'Тогда Двенадцать созвали всё собрание учеников и сказали: «Нам не следует, оставив слово Божье, служить при столах[a]».'
  rationale: Исправлены две стилистически и семантически уязвимые формулировки. «Всё собрание учеников» лучше передаёт τὸ πλῆθος τῶν μαθητῶν, а «служить при столах» сохраняет намеренную конкретность и контекстуальную открытость τραπέζαις. «Нам не следует» передаёт вопрос уместности распределения обязанностей, не обесценивая практическое служение.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:50:04Z'
review_pass:
  verdict: revise
  source_fidelity: 'В целом смысл передан верно: «Двенадцать» созывают общину и говорят о недопустимости оставлять слово Божье ради πρακтического служения. Однако «обслуживать столы» в современном русском обычно означает работу официанта и чрезмерно сужает/конкретизирует неоднозначное διακονεῖν τραπέζαις. «Всех учеников» передаёт охват, но слабее выражает τὸ πλῆθος как собрание или совокупность учеников.'
  naturalness: «Нехорошо нам» возможно, но звучит разговорно и может восприниматься как моральная оценка самого практического служения. «Нам не следует» — более естественная современная литературная передача уместности/приоритета. «Служить при столах» сохраняет образ оригинала без неестественного в данном контексте «обслуживать столы».
  terminology: «Двенадцать» и «слово Божье» уместны. Формулировка «служить при столах» сохраняет связь διακονεῖν с последующим служением в 6:4, не навязывая позднейшую церковную терминологию и не сводя смысл исключительно к раздаче пищи.
  issues:
  - severity: medium
    issue: «обслуживать столы»
    rationale: Фраза неестественна для библейского повествования и в современном употреблении ассоциируется прежде всего с обслуживанием посетителей в ресторане. Греческое τραπέζαις допускает контекстуальную связь с распределением пищи и средств, но основной текст сохраняет более широкий буквальный образ.
  - severity: low
    issue: «всех учеников»
    rationale: Передаёт «всех», но τὸ πλῆθος обозначает собравшееся множество/всю общину учеников. «Всё собрание учеников» точнее сохраняет собирательный аспект.
  - severity: low
    issue: «Нехорошо нам»
    rationale: Разговорный оттенок и потенциальная моральная окраска слабее передают оценку уместности, выраженную οὐκ ἀρεστόν ἐστιν.
