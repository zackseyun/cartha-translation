  text: προσκαλεσάμενοι δὲ οἱ δώδεκα τὸ πλῆθος τῶν μαθητῶν εἶπαν· Οὐκ ἀρεστόν ἐστιν ἡμᾶς καταλείψαντας τὸν λόγον τοῦ θεοῦ διακονεῖν τραπέζαις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/002.yaml
  text: So the Twelve called together the whole group of the disciples and said[c][b][a], “It is not right for us to abandon the word of God to serve tables.”
translation:
  language: ru
  text: 'Тогда Двенадцать созвали всё собрание учеников и сказали: «Нам не следует, оставив слово Божье, служить при столах[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть заниматься практическим распределением пищи и средств в общине.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: созвали
  rationale: Аористное причастие обозначает созыв собрания и естественно передаётся русской личной формой перед основным глаголом.
- source_word: δὲ
  choice: тогда
  rationale: Частица отмечает развитие повествования и переход от возникшей жалобы к ответу Двенадцати, без выраженного противопоставления.
- source_word: οἱ δώδεκα
  choice: Двенадцать
  rationale: Сохранено устойчивое обозначение апостольской группы без добавления отсутствующего в греческом слова «апостолы».
- source_word: τὸ πλῆθος τῶν μαθητῶν
  choice: всех учеников
  rationale: Передаёт собирательный смысл πλῆθος как всего собрания учеников естественным современным русским языком.
- source_word: Οὐκ ἀρεστόν ἐστιν
  choice: Нехорошо
  rationale: В данном контексте выражение оценивает уместность распределения обязанностей; «нехорошо» естественно передаёт это, не превращая высказывание в безусловное нравственное осуждение практического служения.
- source_word: ἡμᾶς καταλείψαντας
  choice: нам, оставив
  rationale: Сохраняет конструкцию и серьёзность действия, но не усиливает значение до эмоционально окрашенного «бросив» или «отказавшись».
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: слово Божье
  rationale: Прозрачная и богословски ёмкая передача, сохраняющая как смысл провозглашаемой вести, так и традиционное выражение.
- source_word: διακονεῖν
  choice: обслуживать
  rationale: В сочетании со «столами» обозначает практическое попечение и не вносит позднейшего церковно-должностного оттенка слова «служить».
- source_word: τραπέζαις
  choice: столы
  rationale: Сохранён конкретный образ греческого текста; вероятный смысл практического распределения пищи и средств пояснён в сноске, а не подставлен в основной текст.
theological_decisions:
- issue: Соотношение апостольского служения слову и практического служения
  choice: 'Высказывание передано как вопрос уместного распределения ответственности: «Нехорошо нам, оставив слово Божье…»'
  alternative: «Нам не подобает оставить слово Божье…» или формулировка, предполагающая низшую ценность практического служения
  rationale: Контекст противопоставляет обязанности, а не достоинство видов служения. Перевод сохраняет приоритет призвания Двенадцати, не обесценивая заботу о нуждах общины.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён естественным переходом от причастия к однородным сказуемым. «Двенадцать» оформлено как устойчивое наименование группы. Конкретное «столы» сохранено в тексте, а контекстуальный смысл вынесен в краткую сноску.
