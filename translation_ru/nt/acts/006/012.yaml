lexical_decisions:
- source_word: συνεκίνησάν
  choice: подстрекнули
  rationale: Глагол передаёт целенаправленное возбуждение людей против Стефана. «Подстрекнули» естественно выражает причинный и враждебный оттенок, не добавляя прямого указания на насилие.
- source_word: τε
  choice: а затем
  rationale: Слабая соединительная частица передана естественной русской связкой, обозначающей продолжение и последовательность повествования.
- source_word: τὸν λαὸν
  choice: народ
  rationale: Прямое и достаточно широкое соответствие, не сужающее значение до конкретной толпы.
- source_word: τοὺς πρεσβυτέρους
  choice: старейшин
  rationale: В данном иудейском общественно-судебном контексте речь идёт о признанных руководителях, а не просто о пожилых мужчинах.
- source_word: τοὺς γραμματεῖς
  choice: книжников
  rationale: Устоявшийся русский историко-религиозный термин для знатоков и толкователей Писания и закона.
- source_word: ἐπιστάντες
  choice: внезапно напав на Стефана
  rationale: Причастие указывает на резкое приближение или внезапное появление рядом; в сочетании с последующим захватом «внезапно напав» естественно передаёт стремительность и враждебность действия. Имя Стефана восстанавливает ясный референт местоимения в русском тексте.
- source_word: συνήρπασαν
  choice: схватили
  rationale: Передаёт насильственное взятие под стражу без добавления невыраженной детали о волочении.
- source_word: ἤγαγον
  choice: привели
  rationale: Естественно обозначает доставление Стефана к судебному органу; принудительность уже ясна из «схватили».
- source_word: τὸ συνέδριον
  choice: синедрион
  rationale: В иерусалимском контексте термин обозначает высший иудейский совет; историческое название точнее общего слова «совет».
theological_decisions:
- issue: Передача συνέδριον
  choice: синедрион
  alternative: совет
  rationale: Контекст с участием старейшин и книжников указывает на конкретный иудейский судебно-управленческий орган. Выбор сохраняет историческую определённость, а сноска отмечает возможную более общую передачу.
translation_notes:
  register: Современный литературный русский язык с сохранением исторических терминов «старейшины», «книжники» и «синедрион». Синтаксис сделан плавным и повествовательным; местоимение заменено именем «Стефан» ради естественной русской ясности.
