  text: καὶ οὐκ ἴσχυον ἀντιστῆναι τῇ σοφίᾳ καὶ τῷ πνεύματι ᾧ ἐλάλει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/010.yaml
  text: And they were not able to withstand the wisdom and the Spirit by which he was speaking[a].
translation:
  language: ru
  text: И они не могли противостоять мудрости и Духу, Которым он говорил[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «духу, которым он говорил», если речь идёт о собственном духе Стефана, а не о Святом Духе.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσχυον
  choice: не могли
  rationale: Имперфект с отрицанием выражает продолжавшуюся неспособность оппонентов; «не могли» естественно и точно передаёт смысл.
- source_word: ἀντιστῆναι
  choice: противостоять
  rationale: Глагол обозначает сопротивление или попытку устоять перед кем-либо либо чем-либо; в контексте речь идёт о неспособности успешно возражать Стефану.
- source_word: σοφίᾳ
  choice: мудрости
  rationale: Определённость конкретной мудрости, проявлявшейся в речи Стефана, по-русски достаточно выражена контекстом.
- source_word: πνεύματι
  choice: Духу
  rationale: Контекст Деяний, особенно характеристика Стефана как исполненного Святого Духа (Деян. 6:5), преимущественно указывает на Святого Духа; прописная буква отражает это понимание.
- source_word: ᾧ ἐλάλει
  choice: Которым он говорил
  rationale: Творительный «Которым» передаёт дательный падеж как указание на действующую через Стефана силу или посредство; имперфект передан формой «говорил», естественной для продолженного действия в русском повествовании.
theological_decisions:
- issue: Относится ли πνεύματι к Святому Духу или к собственному духу Стефана
  choice: Духу
  alternative: духу
  rationale: Упоминание полноты Святого Духа у Стефана и сочетание мудрости с Духом поддерживают первое толкование, однако грамматика сама по себе не исключает второе, поэтому оно сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. Союз καί передан как «но», поскольку в данном контексте он вводит контраст с действиями споривших со Стефаном. Прописная буква в «Которым» согласована с выбранным пониманием слова «Дух» как обозначения Святого Духа.
