source:
  edition: SBLGNT
  text: καὶ ἤρεσεν ὁ λόγος ἐνώπιον παντὸς τοῦ πλήθους, καὶ ἐξελέξαντο Στέφανον, ἄνδρα ⸀πλήρης πίστεως καὶ πνεύματος ἁγίου, καὶ Φίλιππον καὶ Πρόχορον καὶ Νικάνορα καὶ Τίμωνα καὶ Παρμενᾶν καὶ Νικόλαον προσήλυτον Ἀντιοχέα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/005.yaml
  text: And the proposal pleased the whole multitude[a], and they chose Stephen, a man full of faith and of the Holy Spirit, Philip, Prochorus, Nicanor, Timon, Parmenas, and Nicolaus[c][b], a proselyte of Antioch.
translation:
  language: ru
  text: Это предложение понравилось всему собранию, и они избрали Стефана — человека, полного веры[a] и Святого Духа, — а также Филиппа, Прохора, Никанора, Тимона, Пармена и Николая, прозелита из Антиохии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верности». Греческое слово может означать веру, доверие или верность.'
    reason: lexical_alternative
  - marker: b
    text: Прозелитом называли человека из язычников, принявшего иудаизм.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος
  choice: это предложение
  rationale: В контексте речь идёт о только что высказанном апостолами предложении, а не о «слове» в отвлечённом смысле.
- source_word: ἐνώπιον παντὸς τοῦ πλήθους
  choice: всему собранию
  rationale: В сочетании с ἤρεσεν оборот передаёт одобрение всей собравшейся общиной; «собрание» естественно по-русски и не вводит позднейшей церковной терминологии.
- source_word: ἐξελέξαντο
  choice: они избрали
  rationale: Глагол означает выбрать из числа других; «избрали» здесь естественно и сохраняет оттенок целенаправленного выбора.
- source_word: πλήρης πίστεως
  choice: полного веры
  rationale: πίστις прежде всего передано как «вера»; возможный оттенок верности сохранён в сноске.
- source_word: πνεύματος ἁγίου
  choice: Святого Духа
  rationale: В контексте Деяний выражение обозначает Святого Духа как божественную Личность.
- source_word: προσήλυτον Ἀντιοχέα
  choice: антиохийского прозелита
  rationale: προσήλυτος — не просто обращённый вообще, а язычник, принявший иудаизм; прилагательное Ἀντιοχεύς указывает на связь Николая с Антиохией.
- source_word: Στέφανον, Φίλιππον, Πρόχορον, Νικάνορα, Τίμωνα, Παρμενᾶν, Νικόλαον
  choice: Стефана, Филиппа, Прохора, Никанора, Тимона, Пармена и Николая
  rationale: Использованы устоявшиеся русские формы библейских имён; греческое многосоюзие передано естественным русским перечислением.
theological_decisions:
- issue: Значение πίστις в характеристике Стефана
  choice: вера
  alternative: верность
  rationale: Контекст естественно допускает значение доверия и веры, однако слово может обозначать также верность; эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Пунктуация отделяет развёрнутую характеристику Стефана, не выводя остальных шестерых из единого списка избранных.
