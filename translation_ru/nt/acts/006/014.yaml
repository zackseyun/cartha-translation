  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀκηκόαμεν γὰρ αὐτοῦ λέγοντος ὅτι Ἰησοῦς ὁ Ναζωραῖος οὗτος καταλύσει τὸν τόπον τοῦτον καὶ ἀλλάξει τὰ ἔθη ἃ παρέδωκεν ἡμῖν Μωϋσῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/014.yaml
  text: For we heard him saying that this Jesus the Nazarene will destroy this place and will change the customs that Moses handed down to us[a][b][c].
translation:
  language: ru
  text: Ведь мы слышали, как он говорил, что этот Иисус Назарянин[a] разрушит это место[b] и изменит обычаи, которые передал нам Моисей[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «этот Иисус из Назарета».'
    reason: lexical_alternative
  - marker: b
    text: Под «этим местом» имеется в виду храм.
    reason: cultural_note
  - marker: c
    text: 'Или: «предания, которые передал нам Моисей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκόαμεν
  choice: мы слышали
  rationale: Перфект ἀκούω указывает на услышанное, значимое для настоящего обвинения; в данном повествовательном контексте по-русски естественно простое прошедшее время.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующим обвинением и естественно звучит в русской обвинительной речи.
- source_word: αὐτοῦ λέγοντος
  choice: как он говорил
  rationale: Естественно передаёт конструкцию с причастием после глагола слухового восприятия и сохраняет утверждение о непосредственно услышанной речи.
- source_word: Ἰησοῦς ὁ Ναζωραῖος οὗτος
  choice: этот Иисус Назарянин
  rationale: «Назарянин» сохраняет форму обозначения ὁ Ναζωραῖος, а «этот» передаёт выразительное οὗτος и возможный пренебрежительный оттенок речи обвинителей.
- source_word: καταλύσει
  choice: разрушит
  rationale: В сочетании с «этим местом», то есть храмом, глагол означает разрушение или уничтожение; «разрушит» ясно и точно передаёт смысл.
- source_word: τὸν τόπον τοῦτον
  choice: это место
  rationale: Сохраняется буквальная формулировка греческого текста без внесения слова «храм» в основной текст; референт пояснён в сноске.
- source_word: ἀλλάξει
  choice: изменит
  rationale: Прямой и естественный эквивалент будущего времени ἀλλάσσω.
- source_word: τὰ ἔθη
  choice: обычаи
  rationale: Слово обозначает установившиеся обычаи и практики общины; «обычаи» не придаёт ему лишнего позднейшего терминологического оттенка.
- source_word: ἃ παρέδωκεν ἡμῖν Μωϋσῆς
  choice: которые передал нам Моисей
  rationale: Передаёт идею получения и дальнейшей передачи установлений; порядок слов естественен для современного русского языка.
theological_decisions:
- issue: Что означает «это место»
  choice: В основном тексте сохранено «это место».
  alternative: этот храм; это святилище
  rationale: Греческий текст говорит буквально о «месте»; из контекста ясно, что имеется в виду храм, но перевод не делает это уточнение частью слов обвинителей.
- issue: Тон обвинения против Иисуса
  choice: Сохранено выражение «этот Иисус Назарянин».
  alternative: Иисус из Назарета; этот Иисус из Назарета
  rationale: Указательное местоимение передаёт риторическое выделение и возможный враждебный оттенок, не усиливая его дополнительными средствами.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет форму свидетельского обвинения, выразительное «этот» и не уточняет в основном тексте то, что греческий оригинал оставляет контексту.
