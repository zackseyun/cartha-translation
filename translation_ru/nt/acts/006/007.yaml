  yaml_path: translation/nt/acts/006/007.yaml
  text: And the word of God kept increasing[a], and the number of the disciples in Jerusalem kept multiplying greatly, and a large crowd of the priests were becoming obedient to the faith.
translation:
  language: ru
  text: А слово Божье всё шире распространялось, и число учеников в Иерусалиме значительно возрастало; и многие священники становились послушны вере.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повиновались вере». Греческое выражение может означать послушание христианской вести, а не только внутренний акт доверия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: слово Божье
  rationale: Сохраняет устойчивую библейскую формулировку и не сужает λόγος до одного лишь значения «весть» или «проповедь».
- source_word: ηὔξανεν
  choice: продолжало распространяться
  rationale: Имперфект передаёт продолжающийся процесс; применительно к слову естественное русское «распространяться» яснее буквального «расти».
- source_word: ἐπληθύνετο ὁ ἀριθμὸς τῶν μαθητῶν
  choice: число учеников… быстро росло
  rationale: Передаёт продолжающееся значительное увеличение числа учеников без неестественного русского «умножалось».
- source_word: ἐν Ἰερουσαλὴμ σφόδρα
  choice: в Иерусалиме быстро
  rationale: σφόδρα усиливает глагол и означает высокую степень роста; «быстро» естественно выражает стремительное увеличение в данном контексте.
- source_word: πολύς τε ὄχλος τῶν ἱερέων
  choice: также множество священников
  rationale: «Множество» естественно передаёт собирательное πολύς ὄχλος, а τε отмечено связкой «также».
- source_word: ὑπήκουον
  choice: покорялось
  rationale: Имперфект обозначает продолжавшийся процесс; «покорялось» сохраняет смысл послушания, а не только внутреннего согласия.
- source_word: τῇ πίστει
  choice: вере
  rationale: Дательный падеж соответствует управлению ὑπακούω; формулировка сохраняет возможный объективный смысл — вера как принимаемая весть и исповедание — без поясняющей вставки в основной текст.
theological_decisions:
- issue: Значение πίστις в выражении ὑπήκουον τῇ πίστει
  choice: покорялось вере
  alternative: повиновалось вере; принимало веру с послушанием
  rationale: Греческая конструкция может обозначать покорность христианской вере как провозглашаемой вести, а не только личный акт доверия. Краткое «вере» сохраняет эту смысловую напряжённость, а примечание предупреждает чрезмерно субъективное прочтение.
translation_notes:
  register: Современный литературный русский язык, ясный и достоинственный. Продолжающийся характер имперфектов передан словами «продолжало» и формами несовершенного вида. Синтаксис разделён на два предложения ради естественности, при сохранении последовательности исходного текста.
