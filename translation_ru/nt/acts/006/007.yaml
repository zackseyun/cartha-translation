revisions:
- from: А слово Божье продолжало распространяться, и число учеников в Иерусалиме быстро росло. Также множество священников покорялось вере.[a]
  to: А слово Божье всё шире распространялось, и число учеников в Иерусалиме значительно возрастало; и многие священники становились послушны вере.[a]
  rationale: Исправление заменяет темпоральное «быстро» на обозначающее степень «значительно», передаёт τε простым союзом «и» и делает последнюю часть естественной в русском языке, сохраняя множественное число и процессуальный оттенок греческого имперфекта. Смысл и неоднозначность выражения «послушны вере» сохранены в тексте и примечании.
