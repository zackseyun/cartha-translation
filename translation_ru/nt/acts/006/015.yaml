id: ACT.6.15
reference: Acts 6:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἀτενίσαντες εἰς αὐτὸν ⸀πάντες οἱ καθεζόμενοι ἐν τῷ συνεδρίῳ εἶδον τὸ πρόσωπον αὐτοῦ ὡσεὶ πρόσωπον ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/015.yaml
  text: And all who were sitting in the council[a], fixing their eyes on him, saw his face like the face of an angel.
translation:
  language: ru
  text: И все сидевшие в совете[a], пристально глядя на него, увидели, что лицо его — как лицо ангела.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Синедрионе». Греческое слово обозначает высший иудейский совет.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀτενίσαντες
  choice: пристально глядя
  rationale: Передаёт сосредоточенный, продолжительный взгляд и естественно звучит в современном русском повествовании.
- source_word: πάντες οἱ καθεζόμενοι
  choice: все сидевшие
  rationale: Сохраняет значение всеобщности πάντες и описание присутствующих посредством причастия καθεζόμενοι.
- source_word: συνεδρίῳ
  choice: совете
  rationale: Прямо передаёт название правящего совета, не превращая его в собственное имя; исторический термин «Синедрион» указан в сноске.
- source_word: πρόσωπον
  choice: лицо
  rationale: Обычное и точное современное соответствие в данном контексте.
- source_word: ὡσεὶ
  choice: как
  rationale: Кратко и естественно сохраняет сравнительное значение, не уточняя характер сходства.
- source_word: ἀγγέλου
  choice: ангела
  rationale: В повествовательном контексте речь идёт о сверхъестественном небесном существе, а не просто о человеческом посланнике.
theological_decisions:
- issue: Характер сравнения «как лицо ангела»
  choice: Сохранено общее сравнение внешнего вида Стефана с лицом ангела без пояснения конкретного свойства.
  alternative: Уточнить, что лицо сияло, выражало невинность, спокойствие или небесную власть.
  rationale: Греческий текст утверждает сходство, но не определяет, состояло ли оно в сиянии, безмятежности, величии или сочетании этих черт.
translation_notes:
  register: Современный литературный русский язык; достоинство повествования сохранено без архаизмов. Конструкция «лицо его — как лицо ангела» передаёт заметный результат наблюдения и сохраняет лаконичность исходного сравнения.
