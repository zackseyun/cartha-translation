  source_fidelity: 'Текст точно передаёт все основные элементы греческого оригинала: «все сидевшие», сосредоточенный взгляд на Стефана, видение его лица и осторожное сравнение с лицом ангела. Формулировка «лицо его — как лицо ангела» сохраняет именно сравнение и не приписывает лицу конкретно сияние, славу или иное качество.'
