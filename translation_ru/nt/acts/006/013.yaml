  source_fidelity: 'Текст точно передаёт греческий оригинал: ἔστησαν — «выставили» в судебном контексте; μάρτυρας ψευδεῖς — «лжесвидетелей»; οὐ παύεται — «не перестаёт»; κατά — «против». Неявный в греческом, но контекстуально естественный указательный оттенок в «этого святого места» допустим, поскольку обвинение относится к локально известному храму. Опущенное как отдельное русское дополнение ῥήματα не утрачивает самостоятельного смыслового компонента: «не перестаёт говорить против» естественно выражает греческую конструкцию λαλῶν ῥήματα κατά.'
