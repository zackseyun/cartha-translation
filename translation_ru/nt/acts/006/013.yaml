  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἔστησάν τε μάρτυρας ψευδεῖς λέγοντας· Ὁ ἄνθρωπος οὗτος οὐ παύεται ⸂λαλῶν ῥήματα⸃ κατὰ τοῦ τόπου τοῦ ⸀ἁγίου καὶ τοῦ νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/013.yaml
  text: They also set up false witnesses who said[c][b][a], “This man does not stop speaking against this holy place and the law,”
translation:
  language: ru
  text: 'И выставили лжесвидетелей, которые говорили: «Этот человек не перестаёт говорить против этого святого места[a] и закона».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святого места». В данном контексте имеется в виду храм.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησάν
  choice: выставили
  rationale: В судебном контексте глагол означает, что свидетелей представили или выдвинули для дачи показаний; «выставили» естественно передаёт это действие и оттенок устроенного обвинения.
- source_word: τε
  choice: и
  rationale: Частица связывает это действие с предыдущими событиями и добавляет следующий шаг; в русском повествовании это естественно выражается союзом «и».
- source_word: μάρτυρας ψευδεῖς
  choice: лжесвидетелей
  rationale: Устоявшийся русский юридический и библейский термин точно передаёт свидетелей, дающих ложные показания.
- source_word: λέγοντας
  choice: которые говорили
  rationale: Придаточное определительное естественно передаёт греческое причастие и вводит содержание показаний.
- source_word: Ὁ ἄνθρωπος οὗτος
  choice: Этот человек
  rationale: Прямой современный эквивалент, сохраняющий указательный и несколько отчуждённый тон без неоправданного усиления презрения.
- source_word: οὐ παύεται
  choice: не перестаёт
  rationale: Передаёт продолжающийся, повторяющийся характер обвиняемого действия и соответствует естественной русской речи.
- source_word: λαλῶν ῥήματα
  choice: говорить
  rationale: Греческое сочетание буквально связано с произнесением слов, но по-русски «говорить слова против» звучит неестественно; простой глагол полностью передаёт смысл идиомы. Вариант с явным объектом отмечен не требуется, поскольку он не создаёт отдельного смыслового компонента.
- source_word: κατὰ
  choice: против
  rationale: В контексте враждебного обвинения предлог выражает направленность речи против храма и закона.
- source_word: τοῦ τόπου τοῦ ἁγίου
  choice: этого святого места
  rationale: Хотя в греческом нет отдельного указательного местоимения, обвинители говорят о находящемся в центре ситуации храме; «этого» естественно передаёт контекстуальную указательность. Буквальная альтернатива приведена в сноске.
- source_word: τοῦ νόμου
  choice: закона
  rationale: Речь идёт о Моисеевом законе; строчная буква сохраняет нейтральную современную орфографическую подачу, не меняя референта.
theological_decisions:
- issue: К чему относятся «святое место» и «закон»
  choice: Обвинение касается Иерусалимского храма и Моисеева закона, но эти уточнения не вставляются в основной текст.
  alternative: Обобщённое указание на священное пространство и правовую традицию.
  rationale: Ближайший контекст Деяний связывает обвинение Стефана с храмом и Моисеем. Сохранение формулировок «святое место» и «закон» передаёт слова обвинителей без поясняющего расширения.
- issue: Сила обвинительной лексики
  choice: Сохранить формулировку «говорить против».
  alternative: 'Передать более истолковывающе: «хулить» или «клеветать на».'
  rationale: Греческий текст сообщает о речи, направленной против святого места и закона, но не употребляет здесь более сильного термина; перевод не должен усиливать обвинение.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; сохранён судебно-обвинительный тон. «Лжесвидетели» — нормативный ёмкий термин. Синтаксис сделан естественным для русского языка без усиления обвинения.
