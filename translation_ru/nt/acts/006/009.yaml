  text: ἀνέστησαν δέ τινες τῶν ἐκ τῆς συναγωγῆς τῆς λεγομένης Λιβερτίνων καὶ Κυρηναίων καὶ Ἀλεξανδρέων καὶ τῶν ἀπὸ Κιλικίας καὶ Ἀσίας συζητοῦντες τῷ Στεφάνῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/009.yaml
  text: But some of those from the synagogue called the Synagogue of the Freedmen[a], and of the Cyrenians and Alexandrians, and of those from Cilicia and Asia[b], stood up and began arguing with Stephen.
translation:
  language: ru
  text: Но некоторые из членов синагоги, называемой синагогой вольноотпущенников[a], киренцев и александрийцев, а также выходцев из Киликии и Азии[b], поднялись и вступили в спор со Стефаном.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «либертины». Греческое слово обозначает вольноотпущенников — вероятно, бывших рабов или их потомков.'
    reason: lexical_alternative
  - marker: b
    text: Здесь «Азия» — римская провинция на западе Малой Азии, а не Азия в современном географическом смысле.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέστησαν
  choice: выступили
  rationale: В данном контексте глагол обозначает выступление против Стефана; такой перевод сохраняет образ действия и не уточняет сверх текста характер противостояния.
- source_word: δέ
  choice: но
  rationale: Союз вводит контрастный поворот от успешного служения Стефана к возникшему противодействию.
- source_word: τινες τῶν ἐκ τῆς συναγωγῆς
  choice: некоторые из тех, кто принадлежал к синагоге
  rationale: Передаёт частичное значение родительного падежа и ясно указывает, что речь идёт лишь о части связанных с синагогой людей.
- source_word: τῆς λεγομένης
  choice: называемой
  rationale: Нейтрально вводит известное название, не придавая выражению пренебрежительного оттенка, который может иметь русское «так называемой».
- source_word: Λιβερτίνων
  choice: вольноотпущенников
  rationale: Греческое заимствование из латинского libertini обозначает получивших свободу рабов либо связанную с ними группу, а не распущенных людей в современном смысле.
- source_word: Κυρηναίων καὶ Ἀλεξανδρέων
  choice: киренеев и александрийцев
  rationale: Естественные русские названия жителей Кирены и Александрии; родительный падеж сохраняет связь этих групп с названием или составом синагоги.
- source_word: τῶν ἀπὸ Κιλικίας καὶ Ἀσίας
  choice: выходцев из Киликии и Азии
  rationale: Оборот с ἀπό обозначает происхождение; «выходцы из» ясно и естественно передаёт это значение.
- source_word: συζητοῦντες τῷ Στεφάνῳ
  choice: стали спорить со Стефаном
  rationale: В контексте противодействия συζητέω означает не нейтральное обсуждение, а словесный спор; конструкция с «стали» естественно связывает причастие с глаголом движения повествования.
