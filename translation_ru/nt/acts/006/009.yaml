revisions:
- from: Но некоторые из тех, кто принадлежал к синагоге, называемой синагогой вольноотпущенников[a], киренеев и александрийцев, а также выходцев из Киликии и Азии[b], выступили и стали спорить со Стефаном.
  to: Но некоторые из членов синагоги, называемой синагогой вольноотпущенников[a], киренцев и александрийцев, а также выходцев из Киликии и Азии[b], поднялись и вступили в спор со Стефаном.
  rationale: Заменены «выступили» и «стали спорить» на более близкие к греческой последовательности «поднялись и вступили в спор». Формулировка «из членов синагоги» естественно передаёт partitive τῶν ἐκ τῆς συναγωγῆς. Единственное число «синагоги» и весь перечень сохранены, поэтому перевод не навязывает решения о том, была ли это одна община или несколько групп, связанных с ней.
