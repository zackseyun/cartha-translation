translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксис сохраняет единственное число слова «синагога» и грамматически относит перечисленные группы к ней, не решая сверх греческого текста вопрос о точном устройстве или официальном названии этой общины.
