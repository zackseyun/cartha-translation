  text: ἐπισκέψασθε ⸀δέ, ἀδελφοί, ἄνδρας ἐξ ὑμῶν μαρτυρουμένους ἑπτὰ πλήρεις ⸀πνεύματος καὶ σοφίας, οὓς ⸀καταστήσομεν ἐπὶ τῆς χρείας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/003.yaml
  text: But brothers[a], select from among yourselves seven men who are well attested, full of the Spirit and wisdom[d][c][b], whom we will appoint over this duty.
translation:
  language: ru
  text: Но, братья[a], выберите из своей среды семь мужчин, пользующихся доброй репутацией[b], исполненных Духа и мудрости[c], которых мы поставим для этого дела[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое обращение стоит в форме мужского рода; оно могло быть обращено ко всей общине верующих.
    reason: cultural_note
  - marker: b
    text: 'Или: «о которых хорошо отзываются».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «исполненных Святого Духа и мудрости». По-гречески: «исполненных Духа и мудрости».'
    reason: alternative_reading
  - marker: d
    text: Под «этим делом» подразумевается практический вопрос ежедневной раздачи, упомянутой в ближайшем контексте.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκέψασθε
  choice: выберите
  rationale: Повелительная форма призывает общину найти и отобрать подходящих людей; «выберите» естественно передаёт это действие по-русски.
- source_word: δέ
  choice: итак
  rationale: В контексте частица вводит практический вывод из слов апостолов в предыдущем стихе. «Итак» естественно обозначает переход, не придавая фразе резкого противопоставления.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохранена грамматически мужская форма обращения; возможный более широкий круг адресатов пояснён в сноске.
- source_word: ἄνδρας ἐξ ὑμῶν
  choice: из своей среды семь мужчин
  rationale: ἄνδρας обозначает именно мужчин, а ἐξ ὑμῶν указывает, что они должны быть избраны из самой общины.
- source_word: μαρτυρουμένους
  choice: о которых хорошо отзываются
  rationale: Так передаётся смысл благоприятного свидетельства других людей без неестественного буквального оборота «хорошо засвидетельствованных».
- source_word: πλήρεις πνεύματος καὶ σοφίας
  choice: исполненных Духа и мудрости
  rationale: «Исполненных» сохраняет образ полноты. Заглавная буква отражает вероятное указание на Божьего Духа в контексте Луки — Деяний, но слово «Святого» не добавляется в основной текст.
- source_word: καταστήσομεν
  choice: мы поставим
  rationale: Глагол обозначает официальное назначение на порученное дело; «поставим» сохраняет этот смысл и звучит естественно в данном контексте.
- source_word: ἐπὶ τῆς χρείας ταύτης
  choice: на это служение
  rationale: Оборот указывает на порученную практическую обязанность. «Служение» естественно сочетается с «поставим» и не сводит χρεία к отвлечённой нужде.
theological_decisions:
- issue: Обозначает ли πνεύματος дух вообще или Святого Духа
  choice: Духа
  alternative: духа; Святого Духа
  rationale: В контексте Луки — Деяний речь, вероятнее всего, идёт о Божьем Духе. Заглавная буква обозначает этот вероятный референт, тогда как отсутствие слова ἁγίου в греческом тексте сохранено тем, что определение «Святого» не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка понятна широкому читателю, избегает как архаизмов, так и разговорной сниженности; мужское обозначение ἄνδρας сохранено явно.
