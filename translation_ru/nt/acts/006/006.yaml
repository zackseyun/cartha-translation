lexical_decisions:
- source_word: οὓς
  choice: их
  rationale: Относительное местоимение мужского рода во множественном числе отсылает к семерым, названным в предыдущем стихе. Русское «их» естественно сохраняет эту связь без добавления отсутствующего в греческом слова «мужчин».
- source_word: ἔστησαν
  choice: поставили
  rationale: 'Форма от ἵστημι употреблена в каузативном значении: выбранных поставили перед апостолами. Перевод сохраняет конкретность греческого глагола; возможный смысл официального представления указан в сноске.'
- source_word: ἐνώπιον τῶν ἀποστόλων
  choice: перед апостолами
  rationale: Оборот обозначает нахождение в присутствии апостолов. «Перед апостолами» — краткое, естественное и точное соответствие.
- source_word: προσευξάμενοι
  choice: помолившись
  rationale: Аористное причастие передаёт действие, предшествующее возложению рук. Деепричастие естественно выражает эту последовательность по-русски.
- source_word: ἐπέθηκαν αὐτοῖς τὰς χεῖρας
  choice: возложили на них руки
  rationale: Это устойчивое и точное русское соответствие греческому выражению о возложении рук; оно описывает действие, не определяя само по себе его полного церковного значения.
theological_decisions:
- issue: Значение возложения рук
  choice: Сохранено описательное выражение «возложили на них руки».
  alternative: «рукоположили их» или «поручили им служение»
  rationale: Греческий текст называет обрядовое действие, но в данном предложении не определяет его исчерпывающе как рукоположение, благословение, уполномочивание или передачу особого дара. Интерпретирующее уточнение внесло бы конфессиональный вывод в основной текст.
- issue: Кто молился и возлагал руки
  choice: Местоимение «они» по естественной связи указывает на апостолов, оставаясь формально местоименным обозначением.
  alternative: Явно повторить «апостолы» либо использовать безличную конструкцию
  rationale: В ближайшем контексте апостолы являются естественными исполнителями возложения рук. Местоимение сохраняет компактность греческого текста и не добавляет нового наименования субъекта.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сделан ясным и плавным; традиционное выражение «возложили руки» сохранено без конфессионально обусловленного истолкования.
