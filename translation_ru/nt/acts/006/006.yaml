  naturalness: «Их представили апостолам» — естественный современный литературный оборот для ἔστησαν ἐνώπιον τῶν ἀποστόλων. Ясное называние апостолов устраняет неудачную местоименную двусмысленность; деепричастный оборот «помолившись» сохраняет предшествование молитвы.
  terminology: «Апостолы» и традиционное, нейтрально-описательное «возложили на них руки» сохранены. Сноска не определяет возложение рук как рукоположение и потому не навязывает конфессионального прочтения.
