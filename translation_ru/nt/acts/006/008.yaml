  yaml_path: translation/nt/acts/006/008.yaml
  text: Stephen[a], full of grace and power, was doing great wonders and signs among the people.
translation:
  language: ru
  text: Стефан[a], исполненный благодати и силы, совершал великие чудеса и знамения среди народа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «исполненный веры и силы» вместо «исполненный благодати и силы».'
    reason: textual_variant
lexical_decisions:
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Здесь δέ служит мягкой связкой, продолжающей повествование. В русском отдельное «же» или «теперь» утяжелило бы фразу либо создало бы лишний оттенок противопоставления или времени.
- source_word: πλήρης χάριτος καὶ δυνάμεως
  choice: исполненный благодати и силы
  rationale: Оборот с πλήρης и родительным падежом указывает на полноту и характерное обладание этими качествами. «Исполненный» естественно и достойно передаёт конструкцию, сохраняя библейский оттенок.
- source_word: χάριτος
  choice: благодати
  rationale: Основной текст SBLGNT читает χάριτος — «благодати». Это слово сохраняет смысл Божьего благоволения и его действенного проявления в служении Стефана.
- source_word: δυνάμεως
  choice: силы
  rationale: В данном контексте δύναμις обозначает силу, проявляющуюся в чудесных деяниях. Русское «сила» естественно сочетается с «исполненный» и не требует уточнения, отсутствующего в оригинале.
- source_word: ἐποίει
  choice: совершал
  rationale: Имперфект передаёт продолжительное или повторяющееся действие в прошлом. Несовершенный вид «совершал» сохраняет этот аспект и идиоматично употребляется с чудесами и знамениями.
- source_word: τέρατα καὶ σημεῖα
  choice: чудеса и знамения
  rationale: 'Сохранена традиционная и смысловая пара: τέρατα подчёркивает вызывающий изумление характер событий, а σημεῖα — их значение как указующих знаков.'
- source_word: μεγάλα
  choice: великие
  rationale: Прилагательное относится к сочетанию «чудеса и знамения» и прямо передаёт масштаб деяний без дополнительного толкования.
- source_word: ἐν τῷ λαῷ
  choice: среди народа
  rationale: Предлог ἐν здесь обозначает среду, в которой происходили деяния. «Среди народа» естественно передаёт этот смысл и сохраняет собирательное значение λαός.
theological_decisions:
- issue: Текстовый вариант χάριτος / πίστεως
  choice: благодати
  alternative: веры
  rationale: Основной текст следует предоставленному SBLGNT, где стоит χάριτος («благодати»). Значимый вариант πίστεως («веры») сохранён в сноске, чтобы не скрывать текстологическую и богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским регистром. Формулировка сохраняет длительность действия, различие между чудесами и знамениями и не вводит лишнего противопоставления через δέ.
