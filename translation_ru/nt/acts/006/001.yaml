id: ACT.6.1
reference: Acts 6:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς ἡμέραις ταύταις πληθυνόντων τῶν μαθητῶν ἐγένετο γογγυσμὸς τῶν Ἑλληνιστῶν πρὸς τοὺς Ἑβραίους ὅτι παρεθεωροῦντο ἐν τῇ διακονίᾳ τῇ καθημερινῇ αἱ χῆραι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/001.yaml
  text: In those days[a], as the disciples were increasing in number, a complaint arose from the Hellenists against the Hebrews[b], because their widows were being overlooked in the daily distribution.
translation:
  language: ru
  text: В те дни, когда число учеников умножалось, у эллинистов возник ропот на евреев[a], потому что их вдов обходили вниманием при ежедневной раздаче[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вероятно, эллинистами здесь названы грекоязычные иудеи, а евреями — иудеи, говорившие на арамейском или еврейском языке.
    reason: cultural_note
  - marker: b
    text: 'Или: «их вдовами пренебрегали при ежедневном служении».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ταύταις
  choice: В те дни
  rationale: Передаёт временную рамку; мягкая связующая функция δέ естественно выражается ходом повествования без отдельного «же» или «теперь».
- source_word: πληθυνόντων τῶν μαθητῶν
  choice: когда число учеников умножалось
  rationale: Передаёт фоновое обстоятельство генитивного абсолюта и продолжающийся численный рост учеников.
- source_word: ἐγένετο γογγυσμός
  choice: возник ропот
  rationale: «Ропот» сохраняет оттенок недовольства и жалобы, а «возник» естественно передаёт ἐγένετο.
- source_word: τῶν Ἑλληνιστῶν πρὸς τοὺς Ἑβραίους
  choice: у эллинистов возник ропот на евреев
  rationale: Исторические групповые обозначения сохранены без подмены толкованием; направленность недовольства передана конструкцией «ропот на».
- source_word: παρεθεωροῦντο
  choice: обходили вниманием
  rationale: Имперфект передаёт продолжавшееся положение дел; выражение не утверждает намеренной дискриминации, которой глагол сам по себе не требует.
- source_word: ἐν τῇ διακονίᾳ τῇ καθημερινῇ
  choice: при ежедневной раздаче
  rationale: Хотя διακονία означает служение в широком смысле, контекст заботы о вдовах и последующих стихов указывает на ежедневное распределение помощи.
- source_word: αἱ χῆραι αὐτῶν
  choice: их вдов
  rationale: Местоимение естественно относится к эллинистам; русская форма сохраняет эту связь.
theological_decisions:
- issue: Значение обозначений Ἑλληνισταί и Ἑβραῖοι
  choice: Сохранить в основном тексте исторические названия «эллинисты» и «евреи», пояснив их вероятный смысл в сноске.
  alternative: «грекоязычные и еврее- или арамеоязычные иудеи» непосредственно в тексте
  rationale: Источник называет группы историческими терминами, а не прямо языковыми описаниями. Основной текст сохраняет эту особенность и возможную широту различия, тогда как сноска даёт наиболее вероятное объяснение.
- issue: Характер пренебрежения вдовами
  choice: «обходили вниманием» без указания на умысел
  alternative: «намеренно обделяли»
  rationale: παρεθεωροῦντο описывает продолжающееся оставление без должного внимания, но не устанавливает мотив или намеренность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Ропот» — понятное традиционное слово, точно передающее коллективное недовольство; исторические названия групп пояснены в сноске.
