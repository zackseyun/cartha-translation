  text: νῦν οὖν ὑμεῖς ἐμφανίσατε τῷ χιλιάρχῳ σὺν τῷ συνεδρίῳ ⸀ὅπως ⸂καταγάγῃ αὐτὸν εἰς⸃ ὑμᾶς ὡς μέλλοντας διαγινώσκειν ἀκριβέστερον τὰ περὶ αὐτοῦ· ἡμεῖς δὲ πρὸ τοῦ ἐγγίσαι αὐτὸν ἕτοιμοί ἐσμεν τοῦ ἀνελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/015.yaml
  text: Now therefore[a], you, together with the council, make it known to the commander so that he may bring him down to you, as though you were about to examine more carefully the things concerning him[c][b]. But we are ready to kill him before he comes near.
translation:
  language: ru
  text: Итак, теперь вы вместе с советом сообщите тысяченачальнику, чтобы он привёл Павла к вам[a], будто вы намерены тщательнее разобраться в его деле[b]. А мы готовы убить его, прежде чем он приблизится[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «свёл Павла к вам». Греческий глагол включает значение движения вниз.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будто вы собираетесь тщательнее расследовать обстоятельства его дела». Формулировка указывает на притворное намерение дальнейшего разбирательства.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «прежде чем он прибудет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφανίσατε
  choice: сообщите
  rationale: Императив означает официально довести дело до сведения начальника; «сообщите» естественно по-русски и не уточняет сверх текста, будет ли это просьба или заявление.
- source_word: χιλιάρχῳ
  choice: тысяченачальнику
  rationale: Традиционный и достаточно понятный русский эквивалент римского военного звания χιλίαρχος; он точнее общего «начальнику».
- source_word: σὺν τῷ συνεδρίῳ
  choice: вместе с советом
  rationale: Передаёт значение совместного действия и сохраняет прозрачное родовое обозначение συνέδριον без обязательной транслитерации «синедрион».
- source_word: καταγάγῃ αὐτὸν εἰς ὑμᾶς
  choice: привёл Павла к вам вниз
  rationale: «Привёл» естественно передаёт движение под стражей, а «вниз» сохраняет направительное значение приставки κατά-. Имя «Павла» употреблено вместо местоимения ради ясности русского текста.
- source_word: ὡς μέλλοντας
  choice: будто вы намерены
  rationale: Оборот с ὡς представляет заявленное, но мнимое намерение; «будто» сохраняет смысл притворного предлога без избыточного пояснения.
- source_word: διαγινώσκειν ἀκριβέστερον τὰ περὶ αὐτοῦ
  choice: точнее разобраться в его деле
  rationale: Передаёт судебно-следственный оттенок διαγινώσκω, сравнительную степень ἀκριβέστερον и идиому τὰ περὶ αὐτοῦ естественным современным русским выражением.
- source_word: πρὸ τοῦ ἐγγίσαι αὐτὸν
  choice: прежде чем он приблизится
  rationale: Сохраняет временное предшествование и буквальный пространственный оттенок ἐγγίζω, не превращая его без необходимости в «прибудет».
- source_word: τοῦ ἀνελεῖν αὐτόν
  choice: убить его
  rationale: Прямо и нейтрально передаёт значение ἀναιρέω в данном контексте, не добавляя юридической оценки «убить из засады» или «убить преступно».
