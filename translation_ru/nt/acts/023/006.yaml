id: ACT.23.6
reference: Acts 23:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Γνοὺς δὲ ὁ Παῦλος ὅτι τὸ ἓν μέρος ἐστὶν Σαδδουκαίων τὸ δὲ ἕτερον Φαρισαίων ⸀ἔκραζεν ἐν τῷ συνεδρίῳ· Ἄνδρες ἀδελφοί, ἐγὼ Φαρισαῖός εἰμι, υἱὸς ⸀Φαρισαίων· περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν ⸀ἐγὼ κρίνομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/006.yaml
  text: But Paul[a], knowing that one part were Sadducees and the other Pharisees, cried out in the council, “Men, brothers, I am a Pharisee, a son of Pharisees[c][b]. It is concerning the hope and resurrection of the dead that I am being judged.”
translation:
  language: ru
  text: 'Павел же, зная, что одну часть составляли саддукеи, а другую — фарисеи, громко воскликнул в совете[a]: «Мужи и братья! Я фарисей, сын фарисеев[b]. Меня судят за надежду и воскресение мёртвых[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Синедрионе». Греческое слово может обозначать именно высший иудейский совет.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «сын родителей-фарисеев» или «потомок фарисеев».'
    reason: alternative_reading
  - marker: c
    text: 'Возможно также: «Меня судят за надежду на воскресение мёртвых».'
    reason: alternative_reading
lexical_decisions:
- source_word: Γνοὺς δὲ ὁ Παῦλος
  choice: Павел же, зная
  rationale: Сохраняет обстоятельственное значение аористного причастия и связующее δέ, оставаясь естественным для современного русского языка.
- source_word: τὸ ἓν μέρος ... τὸ δὲ ἕτερον
  choice: одна часть собравшихся ... другая
  rationale: «Часть» передаёт μέρος, а добавление «собравшихся» естественно обозначает две группы внутри присутствующего собрания, не превращая их в формально названные фракции.
- source_word: Σαδδουκαίων / Φαρισαίων
  choice: саддукеи / фарисеи
  rationale: Устоявшиеся русские наименования иудейских религиозно-политических течений.
- source_word: ἔκραζεν
  choice: громко сказал
  rationale: Передаёт публичную речь, произнесённую повышенным голосом, без излишне эмоционального оттенка русского «закричал».
- source_word: ἐν τῷ συνεδρίῳ
  choice: в совете
  rationale: Прямо передаёт значение συνέδριον; контекстуально возможное специальное наименование «Синедрион» приведено в сноске.
- source_word: Ἄνδρες ἀδελφοί
  choice: Братья!
  rationale: Естественная русская форма обращения к мужчинам; отдельная передача ἄνδρες дала бы тяжеловесное и неидиоматичное «мужи, братья».
- source_word: Φαρισαῖός εἰμι
  choice: Я фарисей
  rationale: Прямая передача самоопределения Павла в настоящем времени.
- source_word: υἱὸς Φαρισαίων
  choice: сын фарисеев
  rationale: Сохраняет множественное число и семейно-преемственный образ греческого выражения, не уточняя без достаточных оснований, идёт ли речь о родителях или более широком происхождении.
- source_word: περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν
  choice: за надежду и воскресение мёртвых
  rationale: «За» естественно обозначает предмет судебного преследования; союз «и» сохраняет формальную координацию надежды и воскресения и не устраняет возможную смысловую связь между ними.
- source_word: κρίνομαι
  choice: меня судят
  rationale: Естественно и точно передаёт настоящее пассивное значение и текущую судебную ситуацию Павла.
theological_decisions:
- issue: Значение выражения υἱὸς Φαρισαίων
  choice: сын фарисеев
  alternative: сын родителей-фарисеев; потомок фарисеев
  rationale: Основной текст сохраняет семейную метафору и множественное число оригинала, не сужая смысл до конкретного утверждения об обоих родителях или обо всей родословной.
- issue: Соотношение «надежды» и «воскресения»
  choice: за надежду и воскресение мёртвых
  alternative: за надежду на воскресение мёртвых
  rationale: Греческий текст соединяет два существительных союзом καί. Основной вариант сохраняет эту координацию, тогда как сноска отмечает возможное понимание единой надежды, направленной на воскресение.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Реплика Павла звучит ясно и непосредственно; архаичные «мужи», «взывая» и канцелярское «подвергаюсь суду» не используются. Синтаксис сохраняет связь с греческим оригиналом, но не воспроизводит его механически.
