  terminology: Наименования «саддукеи», «фарисеи» и «Синедрион» в сноске корректны. «Сын фарисеев» удачно сохраняет множественное число и не навязывает толкование. Координация «надежду и воскресение мёртвых» сохранена, а альтернативное прочтение отмечено.
