  text: πολλῆς δὲ ⸀γινομένης στάσεως ⸀φοβηθεὶς ὁ χιλίαρχος μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν ἐκέλευσεν τὸ στράτευμα ⸀καταβὰν ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν, ἄγειν ⸀τε εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/010.yaml
  text: And when a great dispute arose[a], the commander, fearing that Paul might be torn apart by them, ordered the troops to go down, seize him from among them[c][b], and bring him into the barracks.
translation:
  language: ru
  text: Когда же разгорелась сильная распря[a], тысяченачальник, опасаясь, как бы они не разорвали Павла на части[b], приказал воинам спуститься, вырвать его из их среды и отвести в казарму[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сильный раздор» или «сильное волнение». Греческое слово στάσις может обозначать острый внутренний конфликт, а в некоторых контекстах — мятеж.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как бы они не растерзали Павла на части». Греческий глагол διασπάω передаёт угрозу насильственно разорвать или растерзать.'
    reason: lexical_alternative
  - marker: c
    text: Греческое слово παρεμβολή может буквально означать «лагерь»; здесь речь идёт о римских военных помещениях в Иерусалиме.
    reason: cultural_note
lexical_decisions:
- source_word: πολλῆς ... γινομένης στάσεως
  choice: когда же разгорелась сильная распря
  rationale: Генитив абсолютный передан обстоятельственным придаточным. «Распра» выражает острый внутренний конфликт, а «разгорелась» естественно передаёт развитие ситуации; πολλῆς отражено словом «сильная».
- source_word: φοβηθεὶς
  choice: опасаясь
  rationale: Деепричастная форма естественно передаёт мотив последующего приказа и согласуется с конструкцией μή с аористом конъюнктива.
- source_word: χιλίαρχος
  choice: тысяченачальник
  rationale: Традиционный и достаточно понятный русский термин для римского военного начальника соответствующего ранга; он сохраняет историческую специфику греческого слова.
- source_word: μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν
  choice: как бы они не разорвали Павла на части
  rationale: Конструкция «опасаясь, как бы… не» передаёт опасение, а не свершившийся факт; «разорвали… на части» сохраняет яркую и насильственную образность διασπάω.
- source_word: ἐκέλευσεν
  choice: приказал
  rationale: Прямое и естественное соответствие в военном контексте.
- source_word: τὸ στράτευμα
  choice: воинам
  rationale: Коллективное обозначение военной силы естественно передаётся по-русски множественным числом; дательный падеж обусловлен управлением глагола «приказал».
- source_word: καταβὰν
  choice: спуститься
  rationale: Сохраняет пространственное движение вниз от крепости к месту заседания.
- source_word: ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν
  choice: вырвать его из их среды
  rationale: «Вырвать» передаёт принудительное и быстрое удаление, выраженное ἁρπάζω, а «из их среды» формально сохраняет ἐκ μέσου αὐτῶν.
- source_word: ἄγειν τε
  choice: и отвести
  rationale: В контексте сопровождения Павла к указанному месту «отвести» звучит естественно и сохраняет направленное перемещение.
- source_word: παρεμβολήν
  choice: казарму
  rationale: В данном иерусалимском контексте слово обозначает римские военные помещения, а не полевой лагерь.
