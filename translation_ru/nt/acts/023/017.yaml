  text: So Paul called one of the centurions and said[a], “Take this young man to the commander, for he has something to report to him.”
translation:
  language: ru
  text: 'Тогда Павел подозвал одного из сотников и сказал: «Отведи этого молодого человека к командиру: у него есть что сообщить ему[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рассказать ему». Греческий глагол может означать «сообщить», «возвестить» или «рассказать»; здесь «сообщить» соответствует передаче важных сведений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: подозвал
  rationale: Аористное причастие среднего залога обозначает, что Павел позвал сотника к себе; «подозвал» естественно и точно передаёт это движение.
- source_word: δὲ
  choice: тогда
  rationale: Частица отмечает переход к следующему действию повествования, без выраженного противопоставления.
- source_word: ἕνα τῶν ἑκατονταρχῶν
  choice: одного из сотников
  rationale: «Сотник» — понятное и традиционное русское обозначение римского центуриона.
- source_word: ἔφη
  choice: сказал
  rationale: Нейтральная передача обычного глагола речи.
- source_word: νεανίαν
  choice: молодого человека
  rationale: Современное нейтральное обозначение молодого мужчины, без архаического оттенка.
- source_word: ἄπαγε
  choice: отведи
  rationale: Императив ἀπάγω в данном контексте означает сопроводить человека к другому лицу; «отведи» точнее передаёт направленное сопровождение.
- source_word: πρὸς τὸν χιλίαρχον
  choice: к командиру
  rationale: χιλίαρχος обозначает военного начальника, в данном контексте римского трибуна; «командир» понятно современному читателю и не перегружает текст специальным термином.
- source_word: ἔχει γὰρ ἀπαγγεῖλαί τι αὐτῷ
  choice: ему нужно кое-что сообщить
  rationale: Оборот ἔχει + инфинитив выражает наличие того, что человек должен или может сделать; местоименная соотнесённость в русском естественно передана как «ему нужно», а ἀπαγγέλλω — как «сообщить».
