  text: οἱ δὲ παρεστῶτες εἶπαν· Τὸν ἀρχιερέα τοῦ θεοῦ λοιδορεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/004.yaml
  text: Those standing nearby said[a], “Are you insulting God’s high priest?”
translation:
  language: ru
  text: 'Стоявшие рядом сказали: «Ты оскорбляешь первосвященника Божьего?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты поносишь первосвященника Божьего?»'
    reason: 'Лексическая альтернатива: λοιδορέω может передаваться более сильным и традиционным глаголом «поносить».'
lexical_decisions:
- source_word: οἱ δὲ παρεστῶτες
  choice: Стоявшие рядом
  rationale: Субстантивированное причастие обозначает людей, находившихся возле Павла; этот вариант естественно передаёт и присутствие, и пространственную близость.
- source_word: εἶπαν
  choice: сказали
  rationale: Аорист продвигает повествование и естественно передаётся простым прошедшим временем.
- source_word: ἀρχιερέα
  choice: первосвященника
  rationale: В данном контексте речь идёт об иудейском первосвященнике; это точный и общепринятый русский эквивалент.
- source_word: τοῦ θεοῦ
  choice: Божьего
  rationale: Родительный падеж указывает на отношение первосвященнического служения к Богу; притяжательное прилагательное звучит естественно и не добавляет оценки личности.
- source_word: λοιδορεῖς
  choice: оскорбляешь
  rationale: Глагол обозначает словесное поношение или оскорбление. Выбранное слово понятно современному читателю и сохраняет укоризненную силу вопроса.
theological_decisions:
- issue: Смысл τοῦ θεοῦ при упоминании первосвященника
  choice: «первосвященника Божьего» — обозначение служения в его отношении к Богу без дополнительного утверждения о Божьем одобрении поведения данного человека.
  alternative: «первосвященника Бога» / «Божьего первосвященника»
  rationale: Греческий текст связывает должность с Богом, но сам по себе не выносит богословской оценки поступкам занимающего её человека.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, естественная и сохраняет достоинство повествования. Вопрос оставлен без вводного «как ты смеешь», которого нет в греческом тексте.
