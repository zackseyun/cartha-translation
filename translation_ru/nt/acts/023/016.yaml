  text: Ἀκούσας δὲ ὁ υἱὸς τῆς ἀδελφῆς Παύλου ⸂τὴν ἐνέδραν⸃ παραγενόμενος καὶ εἰσελθὼν εἰς τὴν παρεμβολὴν ἀπήγγειλεν τῷ Παύλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/016.yaml
  text: But when Paul’s sister’s son heard of the ambush[c][b][a], he came and entered the barracks and reported it to Paul.
translation:
  language: ru
  text: Но сын сестры Павла, услышав о засаде, пришёл, вошёл в казарму[a] и сообщил об этом Павлу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в военный лагерь». Здесь, вероятно, имеется в виду римская казарма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: услышав
  rationale: Аористное причастие передаёт действие, предшествующее основному; русское деепричастие естественно и точно сохраняет эту последовательность.
- source_word: δὲ
  choice: Но
  rationale: 'Частица обозначает переход с лёгким противопоставлением: заговорщики готовят нападение, но о нём становится известно.'
- source_word: ὁ υἱὸς τῆς ἀδελφῆς Παύλου
  choice: сын сестры Павла
  rationale: Буквально и естественно передаёт указанное в греческом тексте родство, не заменяя его более общим словом «племянник».
- source_word: τὴν ἐνέδραν
  choice: о засаде
  rationale: ἐνέδρα конкретно обозначает засаду, нападение из укрытия или подстерегание; это точнее общих вариантов «заговор» и «замысел».
- source_word: παραγενόμενος
  choice: пришёл
  rationale: Причастие указывает на прибытие героя к месту последующего действия; личная глагольная форма делает русское повествование естественным.
- source_word: εἰσελθὼν εἰς τὴν παρεμβολὴν
  choice: вошёл в казарму
  rationale: παρεμβολή может означать лагерь или казарму; в данном контексте римского содержания под стражей наиболее вероятна казарма.
- source_word: ἀπήγγειλεν
  choice: сообщил об этом
  rationale: Глагол означает передать или доложить сведения; «об этом» естественно восполняет подразумеваемый объект — известие о засаде.
- source_word: τῷ Παύλῳ
  choice: Павлу
  rationale: Дательный падеж прямо передаёт адресата сообщения.
