  text: ὁ μὲν οὖν χιλίαρχος ἀπέλυσε τὸν ⸀νεανίσκον παραγγείλας μηδενὶ ἐκλαλῆσαι ὅτι ταῦτα ἐνεφάνισας πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/022.yaml
  text: So the commander dismissed the young man[a], instructing him, “Tell no one that you have reported these things to me.”
translation:
  language: ru
  text: 'Тогда тысяченачальник отпустил юношу, приказав ему: «Никому не говори, что сообщил мне об этом».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιλίαρχος
  choice: тысяченачальник
  rationale: Традиционный и достаточно понятный русский термин для римского военного начальника уровня трибуна; передаёт чин точнее, чем общее «командир».
- source_word: ἀπέλυσε
  choice: отпустил
  rationale: В контексте означает, что начальник завершил разговор и позволил юноше уйти; слово не обязательно подразумевает освобождение из-под стражи.
- source_word: νεανίσκον
  choice: юношу
  rationale: Обозначает молодого мужчину; «юноша» естественно и уважительно передаёт возрастную характеристику.
- source_word: παραγγείλας
  choice: приказав ему
  rationale: Причастие выражает властное распоряжение; «приказав» соответствует официальному положению военачальника и ясному запрету.
- source_word: μηδενὶ ἐκλαλῆσαι
  choice: Никому не говори
  rationale: Естественный современный русский запрет разглашать сведения кому-либо.
- source_word: ἐνεφάνισας
  choice: сообщил
  rationale: Глагол означает довести до сведения, в том числе официального лица; «сообщил» точно и естественно подходит контексту.
- source_word: ταῦτα
  choice: об этом
  rationale: Хотя греческое слово имеет форму множественного числа («эти вещи»), по-русски ссылка на совокупность только что переданных сведений естественно выражается единой формулой «об этом».
- source_word: πρὸς ἐμέ
  choice: мне
  rationale: 'Предлог с винительным после глагола сообщения обозначает адресата: сведения были сообщены начальнику.'
