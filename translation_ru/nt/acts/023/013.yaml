  text: ἦσαν δὲ πλείους τεσσεράκοντα οἱ ταύτην τὴν συνωμοσίαν ⸀ποιησάμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/013.yaml
  text: There were more than forty who had formed this conspiracy[a].
translation:
  language: ru
  text: А тех, кто составил этот заговор, было больше сорока.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλείους τεσσεράκοντα
  choice: больше сорока
  rationale: Сравнительная форма πλείους при числительном означает «больше сорока». Русское выражение естественно и сохраняет точное количественное значение без добавления отсутствующего в греческом существительного.
- source_word: συνωμοσίαν
  choice: заговор
  rationale: Слово обозначает тайный сговор или заговор. «Заговор» точно передаёт смысл в данном контексте, не привнося из соседних стихов указание на клятву.
- source_word: ποιησάμενοι
  choice: составил
  rationale: Причастие аориста среднего залога от ποιέω в сочетании с συνωμοσίαν означает тех, кто устроил или составил заговор. «Составил заговор» — естественное русское сочетание, отражающее совершённое действие.
- source_word: ἦσαν δὲ
  choice: А ... было
  rationale: δέ имеет лёгкую связующую или переходную функцию, переданную союзом «А»; ἦσαν естественно выражено русской конструкцией со сказуемым «было».
- source_word: οἱ ταύτην τὴν συνωμοσίαν ποιησάμενοι
  choice: тех, кто составил этот заговор
  rationale: 'Артикль с причастием употреблён субстантивированно: «те, кто составил этот заговор». Русское относительное придаточное ясно и естественно передаёт эту функцию.'
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык; фраза звучит естественно и достойно. Инверсия «А тех, кто..., было...» сохраняет связь с предыдущим повествованием и выделяет численность участников. Сноска не требуется: вариант «свыше сорока» не меняет смысла и не отражает существенной неоднозначности оригинала.'
