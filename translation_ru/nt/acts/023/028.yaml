  text: βουλόμενός ⸀τε ⸀ἐπιγνῶναι τὴν αἰτίαν δι’ ἣν ἐνεκάλουν αὐτῷ, ⸀κατήγαγον εἰς τὸ συνέδριον αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/028.yaml
  text: And wanting to know the charge for which they were accusing him[a], I brought him down to their council.
translation:
  language: ru
  text: Желая точно выяснить, в чём они его обвиняют, я свёл его в их совет[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в их синедрион». Греческое слово συνέδριον означает «совет»; в данном контексте оно, вероятно, обозначает иудейский руководящий совет в Иерусалиме.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενός τε ἐπιγνῶναι
  choice: Желая точно узнать
  rationale: Причастный оборот передаёт мотив Лисия; «точно узнать» естественно выражает оттенок более определённого знания у ἐπιγνῶναι.
- source_word: τὴν αἰτίαν δι’ ἣν ἐνεκάλουν αὐτῷ
  choice: в чём именно они обвиняют его
  rationale: В юридическом контексте αἰτία обозначает основание обвинения. Русская косвенная конструкция естественно передаёт смысл всего греческого оборота, а настоящее время в придаточном уместно при соотнесении с прошедшим «желая узнать».
- source_word: κατήγαγον
  choice: я привёл его
  rationale: Глагол означает «свёл/привёл вниз», но направление движения по-русски здесь несущественно и без контекста звучало бы тяжеловесно; «привёл» ясно передаёт действие.
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: в их совет
  rationale: «Совет» непосредственно передаёт συνέδριον и сохраняет возможность понимать слово как обозначение иудейского правящего совета, не заменяя его традиционным заимствованием в основном тексте.
