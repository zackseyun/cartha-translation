lexical_decisions:
- source_word: ἀναγνοὺς
  choice: Прочитав письмо
  rationale: Аористное причастие обозначает предшествующее действие; объект прямо не назван в стихе, но из ближайшего контекста ясно, что речь о письме. Слово «письмо» добавлено для естественности и ясности.
- source_word: δὲ
  choice: не передано отдельно
  rationale: Слабая повествовательная связка; в русском её функция естественно выражается последовательностью действий без отдельного союза.
- source_word: καὶ ἐπερωτήσας
  choice: правитель спросил
  rationale: Причастная конструкция преобразована в личную форму ради естественного русского синтаксиса. Подлежащее «правитель» восстановлено из контекста, не называя его по имени внутри незавершённого предложения.
- source_word: ἐκ ποίας ἐπαρχείας ἐστίν
  choice: из какой Павел провинции
  rationale: ἐπαρχία означает римскую административную провинцию. Имя «Павел» восполняет подразумеваемое подлежащее и устраняет двусмысленность русского оборота.
- source_word: καὶ πυθόμενος
  choice: и, узнав
  rationale: Передаёт получение сведений как следующее действие, сохраняя причастную связь с последующим продолжением предложения.
- source_word: ὅτι ἀπὸ Κιλικίας
  choice: что он из Киликии
  rationale: ἀπό с географическим названием обозначает происхождение; связка «он из» звучит естественно и точно.
- source_word: Κιλικίας
  choice: Киликии
  rationale: Устоявшаяся русская форма названия римской провинции Киликия.
