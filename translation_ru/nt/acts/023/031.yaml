  text: Οἱ μὲν οὖν στρατιῶται κατὰ τὸ διατεταγμένον αὐτοῖς ἀναλαβόντες τὸν Παῦλον ἤγαγον ⸀διὰ νυκτὸς εἰς τὴν Ἀντιπατρίδα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/031.yaml
  text: So the soldiers[a], according to what had been ordered them[b], took Paul and brought him by night to Antipatris.
translation:
  language: ru
  text: Итак, воины, исполняя отданное им приказание, взяли Павла и ночью доставили его в Антипатриду.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ μὲν οὖν στρατιῶται
  choice: Итак, воины
  rationale: οὖν продолжает повествование и указывает на исполнение только что отданного распоряжения; μέν подготавливает последующее противопоставление в ст. 32, но в русском здесь естественно отдельно не передаётся.
- source_word: κατὰ τὸ διατεταγμένον αὐτοῖς
  choice: исполняя отданное им приказание
  rationale: Субстантивированное перфектное страдательное причастие означает то, что им было приказано. Формулировка сохраняет отсылку к ранее отданному приказу и звучит естественно по-русски.
- source_word: ἀναλαβόντες
  choice: взяли Павла
  rationale: 'Аористное причастие обозначает действие, предшествующее основному глаголу: воины приняли Павла под свою ответственность и отправились с ним. «Взяли» не добавляет прямо не выраженного значения сопровождения.'
- source_word: ἤγαγον
  choice: доставили его
  rationale: ἄγω допускает значения «вести», «отвести», «доставить». При названном пункте назначения и военном конвое «доставили» ясно и естественно передаёт перемещение Павла в Антипатриду.
- source_word: διὰ νυκτός
  choice: ночью
  rationale: Оборот διά с родительным νυκτός означает «в течение ночи / ночью». «Ночью» сохраняет указание на время, не утверждая, что путь занял всю ночь.
- source_word: Ἀντιπατρίδα
  choice: Антипатриду
  rationale: Название города передано принятой русской библейской транслитерацией и поставлено в винительный падеж после предлога «в» при обозначении направления.
