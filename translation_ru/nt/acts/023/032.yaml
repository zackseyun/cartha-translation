  text: τῇ δὲ ἐπαύριον ἐάσαντες τοὺς ἱππεῖς ⸀ἀπέρχεσθαι σὺν αὐτῷ ὑπέστρεψαν εἰς τὴν παρεμβολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/032.yaml
  text: But on the next day[a], after letting the horsemen go on with him, they returned to the barracks.
translation:
  language: ru
  text: На следующий день они позволили всадникам продолжить путь с ним, а сами вернулись в казармы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в военный лагерь». Греческое слово может обозначать лагерь или место размещения войск; здесь, вероятно, имеются в виду римские казармы в иерусалимской крепости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: На следующий день
  rationale: Идиома означает «на следующий день». Частица δέ служит здесь мягким повествовательным переходом и не требует отдельного противительного союза в русском тексте.
- source_word: ἐάσαντες
  choice: позволили
  rationale: 'Аористное причастие обозначает действие, предшествующее возвращению: они позволили всадникам ехать дальше. Личная форма естественна для современного русского повествования.'
- source_word: τοὺς ἱππεῖς
  choice: всадникам
  rationale: Слово обозначает конных воинов; «всадники» ясно и без излишней военно-технической окраски передаёт его смысл.
- source_word: ἀπέρχεσθαι σὺν αὐτῷ
  choice: продолжить путь с ним
  rationale: В данном контексте всадники продолжают сопровождать Павла, тогда как остальные возвращаются. Местоимение «с ним» сохраняет форму исходного текста.
- source_word: ὑπέστρεψαν
  choice: вернулись
  rationale: Глагол обычно означает «вернуться» или «повернуть назад»; «вернулись» естественно передаёт основное повествовательное действие.
- source_word: εἰς τὴν παρεμβολήν
  choice: в казармы
  rationale: παρεμβολή может означать военный лагерь или место размещения войск. В контексте речь, вероятнее всего, идёт о римских казармах в иерусалимской крепости.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанное. Конструкция «а сами» естественно подчёркивает различие между всадниками, продолжившими путь, и возвратившимися воинами, не добавляя нового смыслового содержания.
