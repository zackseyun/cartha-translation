    reason: lexical_alternative
lexical_decisions:
- source_word: συλλημφθέντα
  choice: схватили
  rationale: Передаёт насильственное задержание без добавочного оттенка официального ареста.
- source_word: Ἰουδαίων
  choice: иудеи
  rationale: Обычное русское обозначение этнорелигиозной группы в данном контексте; возможное географическое значение отмечено в сноске.
- source_word: μέλλοντα ἀναιρεῖσθαι
  choice: собирались убить
  rationale: Естественно передаёт близость намеревавшегося действия и прямое значение ἀναιρέω в контексте.
- source_word: ἐπιστὰς
  choice: подоспел
  rationale: Выражает прибытие и вмешательство в критический момент, не добавляя причинной связи.
- source_word: σὺν τῷ στρατεύματι
  choice: с отрядом
  rationale: στράτευμα здесь обозначает военное подразделение; «отряд» естественно и не уточняет его размер.
- source_word: ἐξειλάμην
  choice: спас его
  rationale: Точно передаёт избавление от непосредственной угрозы смерти.
- source_word: μαθὼν
  choice: узнав
  rationale: Сохраняет обстоятельственную форму и заявленную в письме связь событий, не исправляя её по более широкому повествованию.
- source_word: Ῥωμαῖός ἐστιν
  choice: он римлянин
  rationale: Прямо передаёт греческое выражение; в юридическом контексте подразумевается римское гражданство.
theological_decisions:
- issue: Историко-риторическое изложение в письме тысяченачальника
  choice: Передать заявление автора письма прямо, сохранив «узнав» без гармонизации с Деян 21–22.
  alternative: Перефразировать хронологию так, чтобы согласовать её с предшествующим рассказом.
  rationale: Текст сообщает формулировку самого Клавдия Лисия, выгодно представляющего свои действия; перевод не должен устранять повествовательное напряжение.
