  text: ἔφη τε ὁ Παῦλος· Οὐκ ᾔδειν, ἀδελφοί, ὅτι ἐστὶν ἀρχιερεύς· γέγραπται γὰρ ⸀ὅτι Ἄρχοντα τοῦ λαοῦ σου οὐκ ἐρεῖς κακῶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/005.yaml
  text: And Paul said, “I did not know, brothers, that he is the high priest; for it is written, ‘You shall not speak evil of a ruler of your people.’”
translation:
  language: ru
  text: 'Павел сказал: «Я не знал, братья, что он первосвященник. Ведь написано: „Не злословь правителя своего народа“».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не говори дурного о правителе своего народа».'
    reason: Лексическая альтернатива для οὐκ ἐρεῖς κακῶς, сохраняющая более буквальное значение «не говорить плохо».
lexical_decisions:
- source_word: ἔφη τε ὁ Παῦλος
  choice: Павел сказал
  rationale: τέ — слабая связующая частица, которую в современном русском здесь естественно не выражать отдельно; ἔφη вводит прямую речь.
- source_word: Οὐκ ᾔδειν
  choice: Я не знал
  rationale: Прямая и естественная передача формы οἶδα, обозначающей отсутствие знания в данной ситуации.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет грамматически мужское обращение; в данном контексте Павел обращается к членам совета.
- source_word: ὅτι ἐστὶν ἀρχιερεύς
  choice: что он первосвященник
  rationale: Именное сказуемое с нулевой связкой естественно передаёт настоящее ἐστίν и не превращает его без необходимости в прошедшее время.
- source_word: γέγραπται γὰρ
  choice: Ведь написано
  rationale: Устойчивая и доступная формула ссылки на Писание; «ведь» передаёт объяснительное γάρ.
- source_word: Ἄρχοντα τοῦ λαοῦ σου
  choice: правителя своего народа
  rationale: «Правитель» точно передаёт ἄρχων в юридико-общественном контексте; возвратное «своего» естественно в русском запрете, обращённом ко второму лицу.
- source_word: οὐκ ἐρεῖς κακῶς
  choice: Не злословь
  rationale: Будущее изъявительное имеет силу запрета; «злословить» ёмко передаёт речь, направленную во зло против человека.
theological_decisions:
- issue: Временная отнесённость ἐστὶν в словах Павла
  choice: что он первосвященник
  alternative: что он был первосвященником
  rationale: Сохранено настоящее время греческого текста, при этом русская нулевая связка звучит естественно и не разрешает дополнительно вопрос о характере слов Павла.
- issue: Передача обращения ἀδελφοί
  choice: братья
  alternative: братья и сёстры
  rationale: Контекст обращения к синедриону и мужская форма источника поддерживают точную передачу «братья».
- issue: Формулировка цитаты из Писания
  choice: 'Ведь написано: «Не злословь правителя своего народа»'
  alternative: 'Ведь написано: «Не говори дурного о правителе своего народа»'
  rationale: Сохранены авторитетная формула цитирования и широкий запрет злой, поносной речи без конфессионального истолкования.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достойный повествовательный регистр. Цитата звучит как ясный библейский запрет без избыточной архаизации. Маркер сноски поставлен после всей цитаты, к которой относится лексическая альтернатива.
