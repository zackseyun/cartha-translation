  yaml_path: translation/nt/acts/023/014.yaml
  text: These men came to the chief priests and the elders and said[a], “We have bound ourselves under a curse to taste nothing until we kill Paul.”
translation:
  language: ru
  text: 'Они пришли к первосвященникам и старейшинам и сказали: «Мы поклялись, призвав на себя проклятие, ничего не есть, пока не убьём Павла».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мы связали себя проклятием, чтобы ничего не вкушать». Греческое выражение обозначает клятву, при которой человек призывает на себя проклятие в случае её нарушения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Они
  rationale: Относительное местоимение указывает на участников заговора из предыдущего стиха; в отдельном русском стихе естественно продолжить повествование личным местоимением.
- source_word: προσελθόντες
  choice: пришли к
  rationale: Аористное причастие обозначает действие, предшествующее глаголу «сказали»; такой перевод естественен для русского повествования.
- source_word: τοῖς ἀρχιερεῦσιν καὶ τοῖς πρεσβυτέροις
  choice: к первосвященникам и старейшинам
  rationale: В данном контексте это наименования признанных представителей иудейского руководства.
- source_word: Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: мы под клятвой зареклись
  rationale: Однокоренная конструкция выражает суровую самообязывающую клятву с подразумеваемым проклятием; «зареклись» естественно передаёт обязательство, а «под клятвой» — его торжественную и опасную силу.
- source_word: μηδενὸς γεύσασθαι
  choice: ничего не есть
  rationale: В контексте поста до совершения убийства γεύομαι означает принятие пищи; буквальное «ничего не вкушать» в современном русском звучит архаично.
- source_word: ἕως οὗ ἀποκτείνωμεν τὸν Παῦλον
  choice: пока не убьём Павла
  rationale: Конструкция обозначает временной предел принятого обязательства; «убьём» прямо передаёт ἀποκτείνωμεν без добавления юридической квалификации «совершим убийство».
theological_decisions:
- issue: Передача формулы Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: мы под клятвой зареклись
  alternative: мы предали себя проклятию / мы связали себя клятвой
  rationale: Формула обозначает самообязывающую клятву, подкреплённую проклятием в случае её нарушения, а не позднейший церковный акт анафемы. Основной текст сохраняет естественность, а примечание раскрывает более буквальный смысл.
translation_notes:
  register: Современный литературный русский, ясный и повествовательно естественный. «Первосвященники» и «старейшины» сохраняют традиционную библейскую терминологию; архаичное «вкушать» вынесено в буквальное примечание.
