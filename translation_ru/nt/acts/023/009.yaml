source:
  edition: SBLGNT
  text: ἐγένετο δὲ κραυγὴ μεγάλη, καὶ ἀναστάντες ⸂τινὲς τῶν γραμματέων⸃ τοῦ μέρους τῶν Φαρισαίων διεμάχοντο λέγοντες· Οὐδὲν κακὸν εὑρίσκομεν ἐν τῷ ἀνθρώπῳ τούτῳ· εἰ δὲ πνεῦμα ἐλάλησεν αὐτῷ ἢ ⸀ἄγγελος—
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/009.yaml
  text: Then a great outcry arose[a], and some of the scribes of the party of the Pharisees stood up and contended, saying, “We find nothing wrong in this man[b]. But if a spirit or an angel has spoken to him—”
translation:
  language: ru
  text: 'Тогда поднялся громкий крик. Некоторые книжники из партии фарисеев встали и стали горячо спорить: «Мы не находим в этом человеке ничего дурного. Но если с ним заговорил дух[a] или ангел—»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дух». Однако сопоставление с ангелом скорее указывает здесь на духовное существо вообще.'
    reason: alternative_reading
  - marker: b
    text: В греческом тексте фраза внезапно обрывается после слов «или ангел».
    reason: textual_feature
lexical_decisions:
- source_word: κραυγὴ μεγάλη
  choice: громкий крик
  rationale: Передаёт силу и шум возгласов естественным современным русским выражением; в контексте речь идёт о громком общем протесте.
- source_word: ἀναστάντες
  choice: встали
  rationale: Сохраняет буквальное действие и указывает, что книжники поднялись, чтобы выступить перед собранием.
- source_word: τινὲς τῶν γραμματέων τοῦ μέρους τῶν Φαρισαίων
  choice: некоторые книжники из партии фарисеев
  rationale: «Книжники» — точное и привычное обозначение знатоков Закона в данном иудейском контексте; «из партии фарисеев» ясно передаёт их принадлежность к этой стороне в совете.
- source_word: διεμάχοντο
  choice: стали горячо спорить
  rationale: Передаёт продолжительный и напряжённый характер спора, выраженный имперфектом и значением глагола.
- source_word: Οὐδὲν κακὸν εὑρίσκομεν ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: Мы не находим в этом человеке ничего дурного
  rationale: Сохраняет судебно-оценочный смысл высказывания, не усиливая его до формального оправдательного приговора.
- source_word: πνεῦμα
  choice: дух
  rationale: В сочетании с «ангелом» слово естественнее всего обозначает духовное существо; перевод сохраняет неопределённость и не отождествляет его прямо со Святым Духом.
- source_word: ἐλάλησεν αὐτῷ
  choice: с ним говорил
  rationale: Естественная русская передача обращения духовного существа к Павлу без добавления не выраженных в тексте подробностей.
- source_word: ἄγγελος
  choice: ангел
  rationale: Сверхъестественный контекст указывает здесь на ангела, а не на человеческого посланника.
theological_decisions:
- issue: Значение πνεῦμα рядом с ἄγγελος
  choice: дух как духовное существо
  alternative: Дух, то есть Святой Дух
  rationale: Сопоставление «дух или ангел» отражает две категории духовных существ и не требует уточнять, что имеется в виду Святой Дух. Строчная буква сохраняет эту неопределённость.
- issue: Незавершённость последней фразы
  choice: сохранить обрыв фразы с многоточием
  alternative: превратить фразу в законченный риторический вопрос
  rationale: Греческий текст обрывается после слова «ангел». Многоточие естественно передаёт это в русском тексте, не восполняя подразумеваемое продолжение.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. «Горячо спорить» передаёт напряжённость без архаичного «препираться», а обрыв реплики сохранён, чтобы не устранять подлинную синтаксическую незавершённость.
