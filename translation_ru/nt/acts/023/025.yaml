lexical_decisions:
- source_word: γράψας
  choice: Он написал
  rationale: Аористное причастие обозначает действие субъекта из предыдущего стиха. В русском повествовании естественно передать его личной формой глагола.
- source_word: ἐπιστολήν
  choice: письмо
  rationale: Обычное современное обозначение письменного сообщения; «послание» здесь звучало бы излишне книжно и церковно.
- source_word: ἔχουσαν
  choice: следующего содержания
  rationale: Причастие согласуется с «письмом» и вместе с последующими словами вводит текст письма. Идиоматическая русская конструкция точно выполняет эту функцию.
- source_word: τύπον
  choice: содержания
  rationale: В данном контексте τύπος указывает на приводимый далее вид, формулировку или содержание письма. «Содержание» естественно вводит его полный текст, не сводя значение исключительно к внешней форме.
- source_word: τοῦτον
  choice: следующего
  rationale: Указательное местоимение направляет читателя вперёд, к цитируемому далее письму; по-русски это естественно выражается словом «следующего».
