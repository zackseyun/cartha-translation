id: ACT.23.30
reference: Acts 23:30
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μηνυθείσης δέ μοι ἐπιβουλῆς εἰς τὸν ⸀ἄνδρα ἔσεσθαι ⸀ἐξαυτῆς ἔπεμψα πρὸς σέ, παραγγείλας καὶ τοῖς κατηγόροις ⸀λέγειν πρὸς αὐτὸν ἐπὶ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/030.yaml
  text: And when I was informed that there would be a plot against the man[a], I sent him to you at once, also ordering his accusers to state their case before you.
translation:
  language: ru
  text: Когда же мне донесли, что против этого человека готовится заговор, я тотчас отправил его к тебе, велев также его обвинителям изложить перед тобой свои обвинения против него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говорить против него перед тобой»; это выражение употреблено здесь в судебном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηνυθείσης
  choice: когда же мне донесли
  rationale: Аористный пассивный генитив абсолютный естественно передан временным придаточным; безличная конструкция сохраняет смысл сообщения, полученного Клавдием Лисием.
- source_word: ἐπιβουλῆς
  choice: заговор
  rationale: Слово обозначает враждебный замысел; «заговор» естественно в данном контексте и не сужает значение до конкретной засады.
- source_word: εἰς τὸν ἄνδρα
  choice: против этого человека
  rationale: Предлог выражает направленность враждебного замысла; указательное «этого» ясно отсылает к Павлу в официальном письме.
- source_word: ἔσεσθαι
  choice: готовится
  rationale: Будущий инфинитив сообщает о предстоящем заговоре; по-русски «готовится заговор» естественно передаёт его близость и предполагаемое осуществление.
- source_word: ἐξαυτῆς
  choice: тотчас
  rationale: Наречие указывает на немедленность действия; «тотчас» кратко и соответствует достоинству официального повествования.
- source_word: ἔπεμψα πρὸς σέ
  choice: я … отправил его к тебе
  rationale: Объект «его» ясно восстанавливается из контекста и необходим для естественной русской фразы.
- source_word: παραγγείλας
  choice: велев также
  rationale: Деепричастная конструкция передаёт сопутствующее распоряжение и добавочное значение καί.
- source_word: κατηγόροις
  choice: его обвинителям
  rationale: Притяжательное местоимение проясняет, что речь идёт об обвинителях Павла.
- source_word: λέγειν πρὸς αὐτὸν
  choice: изложить … свои обвинения против него
  rationale: Буквально выражение означает «говорить к/против него», но судебный контекст требует смысла предъявления обвинений; формулировка сохраняет и содержание, и направленность речи.
- source_word: ἐπὶ σοῦ
  choice: перед тобой
  rationale: В судебно-административном контексте выражение означает выступление в присутствии и перед властью Феликса.
