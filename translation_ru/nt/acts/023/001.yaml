base_translation:
  language: en
  yaml_path: translation/nt/acts/023/001.yaml
  text: And Paul[a], looking intently at the council, said, “Brothers, I have lived before God with an entirely good conscience up to this day.”
translation:
  language: ru
  text: 'Павел, пристально посмотрев на совет, сказал: «Братья! До сего дня я жил[a] перед Богом с совершенно чистой совестью».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я жил как гражданин перед Богом»; греческий глагол может сохранять гражданский оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: пристально посмотрев
  rationale: Передаёт направленный и сосредоточенный взгляд, выраженный аористным причастием ἀτενίζω, естественно для современного русского языка.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Слабый повествовательный связующий элемент; в русском начале стиха отдельное «и» или «же» утяжеляло бы фразу без смысловой необходимости.
- source_word: τῷ συνεδρίῳ
  choice: на совет
  rationale: В данном контексте имеется в виду иудейский руководящий совет; перевод общего существительного сохраняет прозрачность исходного выражения и не требует транслитерации «синедрион».
- source_word: Ἄνδρες ἀδελφοί
  choice: Братья!
  rationale: Естественная русская форма традиционного мужского обращения; буквальное «мужи братья» в современном тексте звучит архаично.
- source_word: πάσῃ συνειδήσει ἀγαθῇ
  choice: с совершенно чистой совестью
  rationale: πάσῃ усиливает характеристику совести, а русское устойчивое выражение «чистая совесть» естественно передаёт нравственно положительный смысл ἀγαθῇ.
- source_word: πεπολίτευμαι
  choice: я жил
  rationale: В контексте глагол обозначает образ жизни или поведение; форма перфекта охватывает прожитую до настоящего момента жизнь. Возможный гражданский оттенок сохранён в примечании.
- source_word: τῷ θεῷ
  choice: перед Богом
  rationale: Передаёт жизнь в отношении к Богу и под его взором, хорошо сочетаясь в русском языке с упоминанием совести.
- source_word: ἄχρι ταύτης τῆς ἡμέρας
  choice: до сего дня
  rationale: Точно обозначает продолжительность вплоть до момента речи; выражение литературно и понятно современному читателю.
theological_decisions:
- issue: Смысл самоописания Павла посредством πεπολίτευμαι
  choice: Общее утверждение об образе жизни перед Богом с чистой совестью
  alternative: «Я вёл себя перед Богом как гражданин», с явным сохранением гражданского оттенка
  rationale: 'В данном контексте основной смысл этический: Павел говорит о своём поведении и совести. Перевод не превращает фразу ни в техническое заявление о гражданском статусе, ни в более сильное утверждение о безгрешности.'
translation_notes:
  register: Современный литературный и достойный регистр. Обращение «Братья!» естественно передаёт Ἄνδρες ἀδελφοί без архаизма. Маркер примечания поставлен после всей реплики, поскольку поясняет глагол «жил» внутри неё.
