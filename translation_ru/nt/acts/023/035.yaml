review_pass:
  verdict: revise
  source_fidelity: '«Я разберу твоё дело» передаёт судебный контекст, но добавляет объект «дело», которого в греческом тексте нет, и глагол «разберу» может подразумевать не только слушание, но и принятие решения по делу. Более прямое «Я выслушаю тебя» точно передаёт Διακούσομαί σου и сохраняет судебный смысл благодаря контексту обвинителей. Остальные элементы переведены верно: будущее время ὅταν с сослагательным наклонением, «обвинители», распоряжение о содержании под стражей и локализация в претории Ирода.'
  naturalness: «Я выслушаю тебя» — естественная современная литературная реплика в судебно-официальном контексте. «Прибудут и твои обвинители» и «держать его под стражей» также звучат ясно и нормативно. Сноску лучше поставить непосредственно после слова «Ирода», к которому она относится.
  terminology: «Обвинители», «под стражей» и «претория» удачны. Термин «претория» следует сохранить с культурно-историческим пояснением; формулировка сноски нейтральна и не выходит за пределы вероятной идентификации здания.
  issues:
  - severity: medium
    issue: «Я разберу твоё дело»
    rationale: Греческое Διακούσομαί σου буквально имеет личный объект («выслушаю тебя»); «дело» — допустимое контекстуальное развёртывание, однако «разберу» в русском может означать рассмотрение с вынесением решения. Более прямой перевод лучше сохраняет пределы смысла оригинала.
  - severity: low
    issue: Расположение маркера сноски
    rationale: Сноска поясняет «преторию Ирода», поэтому маркер следует поставить сразу после этого выражения, а не после завершающей точки предложения.
