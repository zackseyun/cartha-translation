  text: “I will hear your case,” he said[b][a], “when your accusers also arrive.” And he ordered that he be kept under guard in Herod’s praetorium.
translation:
  language: ru
  text: «Я выслушаю тебя, — сказал он, — когда прибудут и твои обвинители». И приказал держать его под стражей в претории Ирода[a].
