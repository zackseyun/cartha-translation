    reason: cultural_note
lexical_decisions:
- source_word: Διακούσομαί σου
  choice: Я разберу твоё дело
  rationale: Глагол διακούω в данном судебном контексте означает выслушать дело; по-русски естественно передать это как «разобрать дело», не добавляя спорного наречия «полностью».
- source_word: ὅταν καὶ οἱ κατήγοροί σου παραγένωνται
  choice: когда прибудут и твои обвинители
  rationale: ὅταν с сослагательным наклонением выражает ожидаемое будущее условие; καί сохранено словом «и», а παραγίνομαι передано формальным и естественным «прибудут».
- source_word: κελεύσας
  choice: И приказал
  rationale: Аористное причастие передано отдельным сказуемым, что естественно для русского повествования и сохраняет последовательность действий.
- source_word: ἐν τῷ πραιτωρίῳ τοῦ Ἡρῴδου
  choice: в претории Ирода
  rationale: Историко-административный термин πραιτώριον сохранён; родительный падеж естественно передаёт принадлежность или наименование комплекса.
- source_word: φυλάσσεσθαι αὐτόν
  choice: держать его под стражей
  rationale: Форма обозначает продолжающееся содержание под охраной; перевод не усиливает смысл до наказания или тюремного заключения.
