base_translation:
  language: en
  yaml_path: translation/nt/acts/023/003.yaml
  text: Then Paul said to him[a], “God is about to strike you, you whitewashed wall! And do you sit judging me according to the law, and yet in violation of the law command me to be struck?”
translation:
  language: ru
  text: 'Тогда Павел сказал ему: «Бог вот-вот поразит тебя, побелённая стена![a] Ты сидишь и судишь меня по Закону, а сам, нарушая Закон, приказываешь бить меня?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог поразит тебя». Буквально: «Бог собирается поразить тебя»; эта конструкция может подчёркивать близость действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τύπτειν σε μέλλει ὁ θεός
  choice: Бог вот-вот поразит тебя
  rationale: Конструкция μέλλει с инфинитивом передаёт предстоящее, близкое действие. «Вот-вот поразит» сохраняет оттенок скорой неизбежности и форму утверждения, а не пожелания.
- source_word: τοῖχε κεκονιαμένε
  choice: стена побелённая
  rationale: Сохранена яркая метафора обращения. Причастие совершенного вида κεκονιαμένε указывает на стену, покрытую побелкой; постпозиция определения придаёт упрёку естественную для русского библейского повествования выразительность.
- source_word: κάθῃ
  choice: сидишь здесь
  rationale: Конкретный образ сидящего судьи сохранён, а «здесь» естественно усиливает риторический вопрос, не меняя его смысла.
- source_word: κρίνων με κατὰ τὸν νόμον
  choice: чтобы судить меня по Закону
  rationale: Оборот передаёт роль сидящего судьи и сохраняет κατὰ τὸν νόμον как соответствие норме Закона. Прописная буква обозначает Моисеев Закон в данном контексте.
- source_word: παρανομῶν
  choice: нарушая Закон
  rationale: Причастный оборот ясно выражает действие вопреки Закону и сохраняет намеренный контраст между судом «по Закону» и его нарушением.
- source_word: κελεύεις με τύπτεσθαι
  choice: приказываешь бить меня
  rationale: Сохранены властный смысл κελεύω и пассивная направленность действия на Павла; русская конструкция с инфинитивом звучит естественно и резко.
- source_word: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν
  choice: Тогда Павел сказал ему
  rationale: Прямой и естественный перевод повествовательного введения без смыслового расширения.
theological_decisions:
- issue: Характер слов Павла «Бог вот-вот поразит тебя»
  choice: Передано как утверждение о близком Божьем действии
  alternative: «Да поразит тебя Бог» как проклятие или пожелание; «Бог поразит тебя» как простой будущий факт
  rationale: Μέλλει с инфинитивом естественнее всего обозначает предстоящее действие. Перевод не решает дополнительно, являются ли слова пророчеством, судебным провозглашением или резким обличением, и не выносит оценки нравственной правомерности реакции Павла.
translation_notes:
  register: Современный литературный русский с достоинством и риторической резкостью оригинала. Сохранены юридический контраст и образ побелённой стены; синтаксис слегка выровнен для ясного устного восприятия.
