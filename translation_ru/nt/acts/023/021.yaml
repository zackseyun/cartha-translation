  - severity: medium
    issue: «Связали себя проклятием»
    rationale: Фраза понятна, но для современного русского не вполне естественна и может быть прочитана как прямое проклятие. Греческий оборот означает клятву с призыванием проклятия на себя в случае нарушения.
