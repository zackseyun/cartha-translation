  naturalness: Текст в целом литературный и ясный. «Дали клятву, призвав на себя проклятие» звучит по-русски естественнее, чем «связали себя проклятием», и точнее объясняет характер обязательства.
  terminology: «Обещание» для ἐπαγγελία сохранено; сноска уместно уточняет контекстуальный оттенок согласия или разрешения. «Поджидают его в засаде» передаёт конкретный образ ἐνεδρεύουσιν без ненужной архаизации.
  issues:
