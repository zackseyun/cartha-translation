source:
  edition: SBLGNT
  text: σὺ οὖν μὴ πεισθῇς αὐτοῖς, ἐνεδρεύουσιν γὰρ αὐτὸν ἐξ αὐτῶν ἄνδρες πλείους τεσσεράκοντα, οἵτινες ἀνεθεμάτισαν ἑαυτοὺς μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀνέλωσιν αὐτόν, καὶ νῦν ⸂εἰσιν ἕτοιμοι⸃ προσδεχόμενοι τὴν ἀπὸ σοῦ ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/021.yaml
  text: So do not be persuaded by them, for more than forty men from among them are lying in ambush for him, who have bound themselves under a curse neither to eat nor to drink until they have killed him. And now they are ready, waiting for the promise from you.
translation:
  language: ru
  text: 'Итак, не поддавайся их уговорам: ведь его поджидают в засаде более сорока человек из их числа. Они дали клятву, призвав на себя проклятие[a], не есть и не пить, пока не убьют его. И теперь они готовы и ждут твоего обещания[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «связали себя клятвой». Греческое выражение подразумевает, что в случае неисполнения они призывают проклятие на самих себя.'
    reason: lexical_alternative
  - marker: b
    text: То есть ждут твоего согласия или разрешения.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισθῇς
  choice: не поддавайся на их уговоры
  rationale: 'Передаёт пассивную форму и контекстуальный смысл предостережения: не позволить просителям склонить себя к их предложению.'
- source_word: ἐνεδρεύουσιν
  choice: устроили на него засаду
  rationale: Сохраняет конкретный образ засады; русское совершенное выражение естественно описывает уже подготовленную ловушку, в которой заговорщики ждут Павла.
- source_word: ἐξ αὐτῶν
  choice: из их числа
  rationale: Ясно показывает, что эти люди принадлежат к ранее упомянутой группе.
- source_word: ἄνδρες πλείους τεσσεράκοντα
  choice: более сорока человек
  rationale: Точно и естественно передаёт сравнительную конструкцию с числительным.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: связали себя проклятием
  rationale: Сохраняет заложенную в выражении идею самообязывания с призыванием проклятия в случае неисполнения.
- source_word: μήτε φαγεῖν μήτε πιεῖν
  choice: не есть и не пить
  rationale: Естественно передаёт парную отрицательную конструкцию и содержание обязательства.
- source_word: ἕως οὗ ἀνέλωσιν αὐτόν
  choice: пока не убьют его
  rationale: В данном контексте ἀναιρέω прямо обозначает насильственное убийство.
- source_word: εἰσιν ἕτοιμοι
  choice: они уже готовы
  rationale: Прямой и естественный перевод; «уже» соответствует καὶ νῦν и подчёркивает текущую готовность.
- source_word: προσδεχόμενοι
  choice: ждут
  rationale: Передаёт выжидание с ожиданием определённого ответа.
- source_word: τὴν ἀπὸ σοῦ ἐπαγγελίαν
  choice: обещания от тебя
  rationale: Сохраняет основное значение ἐπαγγελία — «обещание», не устраняя контекстуальный смысл согласия или разрешения.
