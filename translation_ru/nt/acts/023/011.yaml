source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπιούσῃ νυκτὶ ἐπιστὰς αὐτῷ ὁ κύριος εἶπεν· ⸀Θάρσει, ὡς γὰρ διεμαρτύρω τὰ περὶ ἐμοῦ εἰς Ἰερουσαλὴμ οὕτω σε δεῖ καὶ εἰς Ῥώμην μαρτυρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/011.yaml
  text: But on the following night[a], the Lord stood by him and said, “Take courage, for just as you have testified about me in Jerusalem[b], so you must also testify in Rome.”
translation:
  language: ru
  text: 'В следующую же ночь Господь стал рядом с ним и сказал: «Мужайся![a] Ведь как ты свидетельствовал обо Мне в Иерусалиме[b], так тебе надлежит свидетельствовать и в Риме».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не падай духом!»'
    reason: lexical_alternative
  - marker: b
    text: Греческие глаголы, переведённые здесь как «свидетельствовал» и «свидетельствовать», принадлежат к одной группе слов со значением свидетельства.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπιούσῃ νυκτί
  choice: На следующую же ночь
  rationale: ἐπιούσῃ обозначает следующую ночь, а δέ передано частицей «же», которая естественно продолжает повествование, не создавая излишне сильного противопоставления.
- source_word: ἐπιστὰς αὐτῷ
  choice: встал рядом с ним
  rationale: Передаёт как приближение, так и близкое присутствие Господа, не заменяя выражение более толковательным «явился ему».
- source_word: ὁ κύριος
  choice: Господь
  rationale: Сохраняет прямое обозначение греческого текста, не расширяя его до «Господь Иисус».
- source_word: Θάρσει
  choice: Мужайся
  rationale: Краткое и достойное побуждение к мужеству, соответствующее настоящему повелительному наклонению; возможный смысловой вариант указан в сноске.
- source_word: διεμαρτύρω
  choice: ты свидетельствовал
  rationale: Естественно передаёт завершённое свидетельство Павла и сохраняет в русском связь с последующим μαρτυρῆσαι.
- source_word: τὰ περὶ ἐμοῦ
  choice: обо Мне
  rationale: Естественная русская передача «о том, что касается Меня» без ненужной тяжеловесности.
- source_word: εἰς Ἰερουσαλήμ
  choice: в Иерусалиме
  rationale: Хотя употреблён предлог εἰς, в данном контексте он обозначает место уже совершённого свидетельства и по-русски естественно передаётся предложным падежом.
- source_word: οὕτω
  choice: так
  rationale: Сохраняет прямое соответствие между свидетельством Павла в Иерусалиме и предстоящим свидетельством в Риме.
- source_word: σε δεῖ
  choice: тебе надлежит
  rationale: Передаёт необходимость, вероятно связанную с Божьим замыслом, не усиливая её до идеи неизбежной предопределённости.
- source_word: καὶ εἰς Ῥώμην
  choice: и в Риме
  rationale: καί добавляет Рим как следующее место свидетельства; русский порядок слов звучит естественно.
- source_word: μαρτυρῆσαι
  choice: свидетельствовать
  rationale: Сохраняет связь с διεμαρτύρω посредством того же русского глагола и ясно передаёт поручение Павлу.
theological_decisions:
- issue: Кого обозначает ὁ κύριος
  choice: Господь
  alternative: Господь Иисус
  rationale: В контексте Деяний говорящий — воскресший Иисус, однако греческий текст здесь говорит только «Господь». Перевод сохраняет эту формулировку и не вносит уточнение в основной текст.
- issue: Смысл необходимости в δεῖ
  choice: тебе надлежит
  alternative: ты должен
  rationale: Формулировка ясно выражает необходимость будущего свидетельства, но не определяет сверх сказанного механизм Божьего замысла и не превращает его в фатализм.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Мужайся» и «тебе надлежит» несколько возвышенны, но понятны современному читателю; синтаксис остаётся ясным и близким к структуре греческого текста.
