  text: εἶπεν δὲ ὅτι Οἱ Ἰουδαῖοι συνέθεντο τοῦ ἐρωτῆσαί σε ὅπως αὔριον ⸂τὸν Παῦλον καταγάγῃς εἰς τὸ συνέδριον⸃ ὡς ⸀μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/020.yaml
  text: He said[a], “The Jews have agreed to ask you to bring Paul down to the Sanhedrin tomorrow[b], as though they were going to inquire more accurately about him.”
translation:
  language: ru
  text: 'Он сказал: «Иудеи договорились просить тебя, чтобы ты завтра свёл Павла в Синедрион, будто они намерены точнее разузнать о нём».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνέθεντο
  choice: договорились
  rationale: Средний залог передаёт совместную договорённость; контекст раскрывает злой умысел, но само слово не требует перевода «сговорились».
- source_word: τοῦ ἐρωτῆσαί σε
  choice: просить тебя
  rationale: Артиклевый инфинитив передаёт содержание или цель договорённости; в данном контексте ἐρωτάω означает обращение с просьбой.
- source_word: καταγάγῃς
  choice: ты велел привести Павла вниз
  rationale: 'Сослагательная форма относится к адресату просьбы и допускает каузативное понимание: начальник должен распорядиться доставить Павла. «Вниз» сохраняет направительное значение приставки κατά-.'
- source_word: συνέδριον
  choice: Синедрион
  rationale: В данном иерусалимском контексте речь идёт о конкретном высшем иудейском совете, поэтому институциональное название точнее общего «совет».
- source_word: ὡς
  choice: будто
  rationale: Союз вводит мнимое, притворно заявленное основание просьбы, не добавляя более сильного пояснения вроде «под предлогом».
- source_word: μέλλον τι ἀκριβέστερον πυνθάνεσθαι
  choice: они намерены точнее разузнать
  rationale: μέλλω с инфинитивом выражает намерение, πυνθάνομαι — получение сведений путём расспросов, а сравнительная форма ἀκριβέστερον — большую точность. Русское «разузнать» естественно объединяет эти оттенки.
- source_word: Οἱ Ἰουδαῖοι
  choice: Иудеи
  rationale: Прямо передаёт греческое обозначение. Непосредственный контекст ограничивает его участниками замысла и не позволяет относить утверждение ко всему народу.
theological_decisions:
- issue: Кого обозначает выражение Οἱ Ἰουδαῖοι во враждебном повествовательном контексте
  choice: Сохранено прямое обозначение «Иудеи»
  alternative: «Иудейские начальники» или «некоторые иудеи»
  rationale: Греческий текст сам не добавляет ни «начальники», ни «некоторые». Перевод сохраняет формулировку источника, тогда как конкретный круг лиц определяется контекстом заговора.
- issue: Степень явности обмана в ὡς
  choice: «будто»
  alternative: «под предлогом, что»
  rationale: «Будто» сохраняет указание на мнимость заявленного намерения, не усиливая текст дополнительным существительным «предлог».
translation_notes:
  register: Современный литературный русский язык с умеренно официальной повествовательной интонацией. Порядок слов упрощён ради ясности длинной косвенно-целевой конструкции; сохранены институциональное название «Синедрион» и пространственное «вниз».
