  terminology: «Иудеи» — прямой перевод Οἱ Ἰουδαῖοι; контекст ограничивает референт участниками замысла. «Синедрион» уместен как название конкретного иерусалимского совета. Богословски нагруженных терминов, требующих иной передачи, нет.
