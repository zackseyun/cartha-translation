  text: Γενομένης δὲ ἡμέρας ποιήσαντες ⸂συστροφὴν οἱ Ἰουδαῖοι⸃ ἀνεθεμάτισαν ἑαυτοὺς λέγοντες μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/012.yaml
  text: When day came[a], the Jews formed a conspiracy and bound themselves under a curse[b], saying that they would neither eat nor drink until they had killed Paul.
translation:
  language: ru
  text: Когда настал день, иудеи[a] составили заговор и поклялись, призвав на себя проклятие[b], что не будут ни есть, ни пить, пока не убьют Павла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь слово «иудеи» относится к конкретной группе участников заговора, а не ко всему иудейскому народу.
    reason: cultural_note
  - marker: b
    text: То есть они дали клятву, навлекая на себя проклятие в случае её нарушения.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Когда настал день
  rationale: Естественно передаёт временной генитив абсолютный и переход к событиям нового дня.
- source_word: ποιήσαντες συστροφὴν
  choice: составили заговор
  rationale: В данном контексте выражение обозначает организованный тайный сговор с целью убийства, а не просто собрание или толпу.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Сохраняет прямое обозначение греческого текста; контекстуальное ограничение конкретной группой поясняется в сноске, без подмены формулировки оригинала.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: поклялись, призвав на себя проклятие
  rationale: Передаёт и характер клятвы, и содержащуюся в ней угрозу суда над самими заговорщиками в случае её нарушения.
- source_word: λέγοντες μήτε φαγεῖν μήτε πιεῖν
  choice: что не будут ни есть, ни пить
  rationale: Естественная русская передача содержания принятой клятвы с сохранением парного отрицания.
- source_word: ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον
  choice: пока не убьют Павла
  rationale: Точно и естественно передаёт предел, до которого заговорщики обязались воздерживаться от пищи и питья.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное. Формулировка «поклялись, призвав на себя проклятие» делает понятной древнюю клятвенную формулу, не устраняя её смысловой напряжённости.
