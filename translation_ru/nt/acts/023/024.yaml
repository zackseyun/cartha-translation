lexical_decisions:
- source_word: κτήνη
  choice: верховых животных
  rationale: Слово обозначает животных, используемых для езды или перевозки, не уточняя их вид; перевод сохраняет эту неопределённость и ясно передаёт назначение.
- source_word: τε
  choice: и
  rationale: Частица связывает это распоряжение с предыдущими; в русском контексте естествен простой соединительный союз.
- source_word: παραστῆσαι
  choice: велел приготовить
  rationale: Инфинитив продолжает распоряжение из предыдущего стиха и означает обеспечить наличие готовых животных; добавление «велел» делает синтаксическую зависимость понятной в отдельном стихе.
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт цель распоряжения.
- source_word: ἐπιβιβάσαντες
  choice: посадить на них Павла
  rationale: Причастие означает помочь или заставить кого-либо взойти на животное; однородное сочетание с последующим инфинитивом естественно по-русски и сохраняет последовательность действий.
- source_word: διασώσωσι
  choice: благополучно доставить
  rationale: Глагол выражает доставление в безопасности через возможную опасность; этот перевод объединяет движение и сохранность.
- source_word: πρὸς
  choice: к
  rationale: Обозначает направленность движения к лицу.
- source_word: ἡγεμόνα
  choice: правителю
  rationale: Ἡγεμών обозначает римского провинциального правителя; «правитель» точно и понятно, не вводя более узкого административного титула.
