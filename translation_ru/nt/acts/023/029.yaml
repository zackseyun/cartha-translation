  text: ὃν εὗρον ἐγκαλούμενον περὶ ζητημάτων τοῦ νόμου αὐτῶν, μηδὲν ⸀δὲ ἄξιον θανάτου ἢ δεσμῶν ⸂ἔχοντα ἔγκλημα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/029.yaml
  text: I found that he was being accused concerning questions of their law[b][a], but charged with nothing deserving death or imprisonment.
translation:
  language: ru
  text: Я установил, что его обвиняют по спорным вопросам их Закона, но что против него нет никакого обвинения, заслуживающего смерти или тюремного заключения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὗρον
  choice: Я установил
  rationale: В контексте официального донесения глагол обозначает вывод, сделанный после разбирательства; «установил» естественно передаёт этот юридико-административный оттенок.
- source_word: ἐγκαλούμενον
  choice: его обвиняют
  rationale: Пассивное причастие указывает на предъявляемые ему обвинения, не предполагая доказанной виновности.
- source_word: περὶ ζητημάτων τοῦ νόμου αὐτῶν
  choice: лишь в спорных вопросах их Закона
  rationale: ζητήματα — обсуждаемые или спорные вопросы; «их Закона» сохраняет перспективу римского должностного лица и притяжательное αὐτῶν. «Лишь» естественно выражает противопоставление последующей оговорке, не расширяя содержание обвинений.
- source_word: μηδὲν δὲ ἄξιον θανάτου ἢ δεσμῶν ἔχοντα ἔγκλημα
  choice: и что за ним нет никакой вины, заслуживающей смерти или заключения
  rationale: Фраза означает отсутствие обвинения или проступка, влекущего смертную казнь либо содержание под стражей. «Вина» здесь употреблена в значении вменяемого деяния, а не окончательного признания виновным; сноска сохраняет более буквальную юридическую формулировку.
