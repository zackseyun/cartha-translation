  - severity: high
    issue: «Нет никакой вины» заменяет «нет никакого обвинения».
    rationale: ἔγκλημα означает обвинение, а не доказанную вину. Формулировка с «виной» способна преждевременно приписать Павлу виновность, хотя текст говорит об отсутствии обвинения, заслуживающего соответствующего наказания.
