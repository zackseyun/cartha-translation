  text: ἐπιλαβόμενος δὲ τῆς χειρὸς αὐτοῦ ὁ χιλίαρχος καὶ ἀναχωρήσας κατ’ ἰδίαν ἐπυνθάνετο· Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/019.yaml
  text: So the commander took him by the hand and[a], drawing aside in private, began asking[b], “What is it that you have to report to me?”
translation:
  language: ru
  text: 'Тысяченачальник взял юношу за руку и, отойдя с ним в сторону, спросил наедине: «Что ты хочешь мне сообщить?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος ... τῆς χειρὸς αὐτοῦ
  choice: взял юношу за руку
  rationale: Оборот с родительным падежом означает «взять за руку». Слово «юношу» естественно восстанавливает объект по ближайшему контексту (Деян. 23:18) и не приписывает действию излишней силы.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Частица обозначает продолжение повествования; в русском языке последовательность событий естественно передаётся без отдельного союза.
- source_word: ὁ χιλίαρχος
  choice: тысяченачальник
  rationale: Традиционный и достаточно понятный русский термин для римского военного начальника соответствующего ранга; он точнее общего слова «командир».
- source_word: ἀναχωρήσας κατ’ ἰδίαν
  choice: отойдя с ним в сторону ... наедине
  rationale: Передаёт как удаление от присутствующих, так и частный характер разговора. «С ним» ясно выражает подразумеваемое совместное движение.
- source_word: ἐπυνθάνετο
  choice: спросил
  rationale: Имперфект допускает оттенок начала или процесса расспроса, но в данном контексте вводит один прямой вопрос; простое «спросил» естественно в современном русском.
- source_word: Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι
  choice: Что ты хочешь мне сообщить?
  rationale: Русская идиома естественно передаёт смысл вопроса. ἔχεις с инфинитивом здесь означает наличие сообщения, а не обязанность; «хочешь сообщить» избегает ошибочного оттенка долга. «Сообщить» сохраняет более официальный оттенок ἀπαγγέλλω.
