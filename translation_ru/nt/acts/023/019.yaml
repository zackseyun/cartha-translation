  source_fidelity: 'Перевод точно передаёт основные элементы греческого текста: тысяченачальник берёт юношу за руку, удаляется вместе с ним от других и спрашивает в частном порядке. «Что ты хочешь мне сообщить?» — естественная русская передача вопроса τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι; она не вводит существенного нового смысла и сохраняет официальный оттенок ἀπαγγεῖλαι.'
  naturalness: Текст звучит естественно на современном литературном русском. «Отойдя с ним в сторону» и «наедине» несколько близки по смыслу, но совместно ясно передают движение в сторону и приватность разговора, присутствующие в ἀναχωρήσας κατ’ ἰδίαν.
  terminology: «Тысяченачальник» — устоявшийся, точный и приемлемый в современном библейском русском термин для χιλίαρχος. «Юноша» согласуется с ближайшим контекстом и не создаёт терминологической проблемы. Теологически нагруженных терминов в стихе нет.
