  source_fidelity: 'Текст точно передаёт греческий оригинал: «первосвященник» соответствует ἀρχιερεύς, «приказал» — ἐπέταξεν, «стоявшим рядом с ним» — τοῖς παρεστῶσιν αὐτῷ, а «ударить Павла по устам» естественно передаёт τύπτειν αὐτοῦ τὸ στόμα. Явное имя «Павла» правомерно выводится из непосредственного контекста и снимает русскую местоименную неоднозначность без добавления смысла.'
