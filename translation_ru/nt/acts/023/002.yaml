  text: ὁ δὲ ἀρχιερεὺς Ἁνανίας ἐπέταξεν τοῖς παρεστῶσιν αὐτῷ τύπτειν αὐτοῦ τὸ στόμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/002.yaml
  text: But the high priest Ananias ordered those standing by him to strike him on the mouth[a].
translation:
  language: ru
  text: Но первосвященник Анания приказал стоявшим рядом с ним ударить Павла по устам[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дать Павлу пощёчину». Греческий глагол обозначает удар вообще; перевод «дать пощёчину» возможен, но конкретнее оригинала.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт мягкий противительный переход и резкость реакции на предшествующие слова Павла, не усиливая противопоставление.
- source_word: ἀρχιερεὺς
  choice: первосвященник
  rationale: Устоявшееся и точное русское обозначение данной должности.
- source_word: Ἁνανίας
  choice: Анания
  rationale: Традиционная русская библейская форма личного имени.
- source_word: ἐπέταξεν
  choice: приказал
  rationale: Естественно передаёт властное распоряжение, выраженное греческим глаголом.
- source_word: τοῖς παρεστῶσιν αὐτῷ
  choice: стоявшим рядом с ним
  rationale: Сохраняет пространственный смысл причастия и ясно относит местоимение к Анании.
- source_word: τύπτειν
  choice: ударить
  rationale: Передаёт общее значение нанесения удара, не уточняя без необходимости, был ли это удар ладонью.
- source_word: αὐτοῦ τὸ στόμα
  choice: Павла по устам
  rationale: В греческом буквально «его уста»; имя Павла употреблено для устранения возможной местоименной двусмысленности в естественном русском синтаксисе. «По устам» сохраняет достоинство регистра и обозначает цель удара.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Форма «по устам» выбрана вместо разговорного «по рту»; синтаксис остаётся ясным и доступным.
