lexical_decisions:
- source_word: Κλαύδιος Λυσίας
  choice: Клавдий Лисий
  rationale: Имена переданы в традиционной русской библейской форме, соответствующей греческому написанию.
- source_word: τῷ κρατίστῳ
  choice: досточтимому
  rationale: Превосходная степень κρατίστῳ здесь служит официальным почтительным обращением; «досточтимому» сохраняет высокий деловой регистр без излишней архаичности.
- source_word: ἡγεμόνι
  choice: правителю
  rationale: ἡγεμών обозначает представителя верховной власти; «правитель» точно передаёт значение, не навязывая более узкого технического титула.
- source_word: Φήλικι
  choice: Феликсу
  rationale: Имя передано в принятой русской форме с падежным окончанием, требуемым греческой конструкцией адресата.
- source_word: χαίρειν
  choice: Приветствую тебя
  rationale: В начале письма χαίρειν является устойчивой формулой приветствия, а не буквальным призывом радоваться. Личная форма естественно звучит в современном русском официальном письме.
