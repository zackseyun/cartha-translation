  text: ὁ μὲν οὖν παραλαβὼν αὐτὸν ἤγαγεν πρὸς τὸν χιλίαρχον καὶ φησίν· Ὁ δέσμιος Παῦλος προσκαλεσάμενός με ἠρώτησεν τοῦτον τὸν ⸀νεανίαν ἀγαγεῖν πρὸς σέ, ἔχοντά τι λαλῆσαί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/018.yaml
  text: So he took him and brought him to the commander and said[a], “The prisoner Paul called me to him and asked me to bring this young man to you[b], because he has something to say to you.”
translation:
  language: ru
  text: 'Тот взял юношу, привёл его к тысяченачальнику[a] и сказал: «Узник Павел позвал меня к себе и попросил привести к вам этого юношу: ему есть что сказать вам».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч. χιλίαρχος — римский военный командир; традиционно: «трибун».'
    reason: cultural_note
lexical_decisions:
- source_word: παραλαβὼν αὐτὸν
  choice: взял юношу
  rationale: Причастие описывает сопровождающее действие перед ἤγαγεν; «взял юношу» естественно передаёт, что воин принял его под своё сопровождение, не добавляя отсутствующего в тексте «в сторону».
- source_word: ἤγαγεν πρὸς
  choice: привёл к
  rationale: ἄγω обозначает ведение или доставление к указанному лицу; «привёл к» точно и естественно в данном контексте.
- source_word: χιλίαρχον
  choice: тысяченачальнику
  rationale: Термин χιλίαρχος обозначает римского старшего военного начальника; традиционное «тысяченачальник» сохраняет исторический оттенок, а сноска поясняет должность современному читателю.
- source_word: φησίν
  choice: сказал
  rationale: Историческое настоящее по-русски естественно передаётся прошедшим временем в последовательном повествовании.
- source_word: Ὁ δέσμιος Παῦλος
  choice: Узник Павел
  rationale: δέσμιος обозначает человека, находящегося под стражей; «узник» лаконично и уместно в речи военного.
- source_word: προσκαλεσάμενός με
  choice: позвал меня
  rationale: Средний залог указывает, что Павел позвал говорящего к себе; русское «позвал меня» естественно передаёт смысл без излишне официального «вызвал».
- source_word: ἠρώτησεν ... ἀγαγεῖν
  choice: попросил привести
  rationale: Здесь ἐρωτάω выражает просьбу, а не вопрос; инфинитив ἀγαγεῖν передан зависимым инфинитивом «привести».
- source_word: νεανίαν
  choice: юношу
  rationale: νεανίας означает молодого мужчину; «юноша» точно, литературно и позволяет избежать тяжеловесного повторения «молодой человек».
- source_word: ἔχοντά τι λαλῆσαί σοι
  choice: ему есть что сказать тебе
  rationale: Причастный оборот относится к юноше и буквально выражает наличие у него чего-то, что он хочет сообщить; двоеточие естественно передаёт пояснительную связь, не усиливая её до явно причинного союза.
