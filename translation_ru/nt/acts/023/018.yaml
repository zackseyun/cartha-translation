    issue: Не передано направление в προσκαλεσάμενός με.
    rationale: «Позвал меня» может означать просто окликнул; «позвал меня к себе» воспроизводит смысл среднего залога и контекст личного вызова Павлом воина.
  - severity: medium
    issue: Неуместное неформальное обращение к командиру.
    rationale: В русском «тебе» звучит фамильярно для речи подчинённого к военному начальнику. Греческое σοι грамматически единственное, но не маркирует степень вежливости; «вам» — естественная русская прагматическая передача.
  - severity: low
    issue: Формулировка культурной сноски неточна по рангу.
    rationale: Лучше назвать χιλίαρχος римским военным командиром и указать традиционное «трибун», не определяя его неопределённо как «старшего военачальника».
