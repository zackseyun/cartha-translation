revisions:
- from: 'Тот взял юношу, привёл его к тысяченачальнику[a] и сказал: «Узник Павел позвал меня и попросил привести к тебе этого юношу: ему есть что сказать тебе».'
  to: 'Тот взял юношу, привёл его к тысяченачальнику[a] и сказал: «Узник Павел позвал меня к себе и попросил привести к вам этого юношу: ему есть что сказать вам».'
  rationale: Уточнено, что Павел позвал воина к себе; обращение к командиру приведено в соответствие с русской речевой нормой; культурная сноска сделана более точной. Остальные решения сохранены, включая нейтральное пояснительное двоеточие перед «ему есть что сказать вам».
