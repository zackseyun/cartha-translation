  text: οἵτινες εἰσελθόντες εἰς τὴν Καισάρειαν καὶ ἀναδόντες τὴν ἐπιστολὴν τῷ ἡγεμόνι παρέστησαν καὶ τὸν Παῦλον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/033.yaml
  text: When they entered Caesarea and delivered the letter to the governor[b][a], they also presented Paul to him.
translation:
  language: ru
  text: Прибыв в Кесарию, они вручили письмо правителю[a] и представили ему Павла[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «передали письмо правителю».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «привели к нему Павла».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: они
  rationale: Местоимение относится к сопровождавшим Павла в предыдущем стихе; отдельное «они» естественно вводит главное действие по-русски.
- source_word: εἰσελθόντες
  choice: прибыв
  rationale: Аористное причастие обозначает действие, предшествующее основному. В контексте прибытия отряда в город «прибыв» звучит естественнее буквального «войдя».
- source_word: Καισάρειαν
  choice: Кесарию
  rationale: Традиционная русская форма названия города; уточнение «Приморская» в исходном тексте отсутствует.
- source_word: ἀναδόντες
  choice: вручили
  rationale: Глагол обозначает передачу письма адресату; «вручили» уместно для официального послания и не усиливает смысл сверх контекста.
- source_word: ἐπιστολήν
  choice: письмо
  rationale: Обычный и контекстуально точный эквивалент для письменного официального сообщения.
- source_word: ἡγεμόνι
  choice: правителю
  rationale: Передаёт широкое значение должностного титула без более узкой исторической спецификации, которой само слово здесь не требует.
- source_word: παρέστησαν
  choice: представили
  rationale: В официально-правовом контексте глагол означает доставить и поставить человека перед представителем власти; «представили» кратко передаёт этот смысл.
- source_word: καὶ
  choice: и
  rationale: Соединяет передачу письма с представлением Павла; русское «и» естественно сохраняет добавочное значение без обязательного введения слова «также».
- source_word: Παῦλον
  choice: Павла
  rationale: Традиционная русская форма имени Παῦλος в требуемом падеже.
- source_word: αὐτῷ
  choice: ему
  rationale: Дательный падеж относится к правителю и естественно сочетается с глаголом «представили».
