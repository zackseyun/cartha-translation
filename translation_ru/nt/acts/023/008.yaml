id: ACT.23.8
reference: Acts 23:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Σαδδουκαῖοι ⸀μὲν γὰρ λέγουσιν μὴ εἶναι ἀνάστασιν ⸀μήτε ἄγγελον μήτε πνεῦμα, Φαρισαῖοι δὲ ὁμολογοῦσιν τὰ ἀμφότερα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/008.yaml
  text: For the Sadducees say there is no resurrection[a], nor angel nor spirit, but the Pharisees acknowledge both.
translation:
  language: ru
  text: Ведь саддукеи говорят, что нет ни воскресения, ни ангела, ни духа, а фарисеи признают и то и другое[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по смыслу: «фарисеи признают всё это», то есть воскресение, ангела и духа. В греческом тексте буквально сказано «и то и другое», что непосредственнее всего указывает на ангела и духа, однако некоторые понимают эти слова шире, с учётом контекста.'
    reason: Сохранить неоднозначность того, охватывает ли выражение «и то и другое» только ангела и духа или всё перечисленное, включая воскресение.
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: саддукеи
  rationale: Общепринятое русское наименование иудейского религиозного течения.
- source_word: μὲν γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь стиха с предшествующим повествованием без избыточного воспроизведения обеих греческих частиц.
- source_word: λέγουσιν μὴ εἶναι
  choice: говорят, что нет
  rationale: Естественная русская конструкция, точно передающая сообщение об отрицании существования или реальности перечисленного.
- source_word: ἀνάστασιν
  choice: воскресения
  rationale: Обозначает воскресение как реальность или категорию верования, а не только отдельное событие.
- source_word: μήτε ἄγγελον μήτε πνεῦμα
  choice: ни ангела, ни духа
  rationale: Сохраняет парную отрицательную конструкцию и единственное число обоих существительных.
- source_word: Φαρισαῖοι
  choice: фарисеи
  rationale: Общепринятое русское наименование иудейского религиозного течения.
- source_word: ὁμολογοῦσιν
  choice: признают
  rationale: В данном контексте глагол означает признание истинности или реальности; этот выбор не привносит несвойственного здесь покаянного оттенка слова «исповедуют».
- source_word: τὰ ἀμφότερα
  choice: и то и другое
  rationale: 'Прямо передаёт греческое «оба» и естественнее всего соотносится с ближайшей парой: «ангел» и «дух».'
theological_decisions:
- issue: К чему относится выражение τὰ ἀμφότερα («оба»)?
  choice: В основном тексте сохранено «и то и другое», наиболее непосредственно относящееся к ангелу и духу.
  alternative: 'Понимать выражение шире: фарисеи признают всё перечисленное — воскресение, ангела и духа.'
  rationale: Греческий текст буквально говорит «оба», а не «все три»; ближайшая грамматическая пара — «ангел» и «дух». Вместе с тем контекст и фарисейская вера в воскресение допускают более широкий смысл, поэтому он отмечен в сноске, а не внесён в основной текст.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная по тону. Повторение «ни» естественно передаёт греческое перечисление, а союз «а» сохраняет противопоставление между саддукеями и фарисеями.
