base_translation:
  language: en
  yaml_path: translation/nt/acts/023/007.yaml
  text: And as he was saying this[a], a dispute arose between the Pharisees and Sadducees[b], and the assembly was divided.
translation:
  language: ru
  text: Когда он говорил это, между фарисеями и саддукеями возник спор, и собрание разделилось.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο δὲ αὐτοῦ λαλοῦντος
  choice: Когда он говорил это
  rationale: Родительный самостоятельный оборот с причастием настоящего времени передаёт действие, происходящее одновременно с началом спора. Русское «когда он говорил это» естественно сохраняет эту временную соотнесённость.
- source_word: ἐγένετο
  choice: возник
  rationale: В сочетании со στάσις глагол обозначает начало, возникновение спора или распри.
- source_word: στάσις
  choice: спор
  rationale: В данном контексте слово обозначает разногласие и столкновение между двумя группами. «Спор» ясно и естественно передаёт непосредственную словесную распрю, не усиливая её до мятежа.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: между фарисеями и саддукеями
  rationale: Хотя в греческом употреблён родительный падеж, русская конструкция с «между» естественно обозначает две противостоящие стороны.
- source_word: ἐσχίσθη
  choice: разделилось
  rationale: Страдательная форма σχίζω буквально выражает раскол или разделение; в социальном контексте «разделилось» точно и идиоматично.
- source_word: τὸ πλῆθος
  choice: собрание
  rationale: Речь идёт о собравшемся совете или группе присутствующих на разбирательстве, а не о случайной уличной толпе. «Собрание» сохраняет коллективный и более официальный характер контекста.
