  text: Καὶ προσκαλεσάμενός ⸂τινας δύο⸃ τῶν ἑκατονταρχῶν εἶπεν· Ἑτοιμάσατε στρατιώτας διακοσίους ὅπως πορευθῶσιν ἕως Καισαρείας, καὶ ἱππεῖς ἑβδομήκοντα καὶ δεξιολάβους διακοσίους, ἀπὸ τρίτης ὥρας τῆς νυκτός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/023.yaml
  text: And calling two of the centurions to him[a], he said, “Prepare two hundred soldiers to go as far as Caesarea, and seventy horsemen and two hundred spearmen[b], at the third hour of the night.”
translation:
  language: ru
  text: 'Подозвав к себе двух сотников, он сказал: «Приготовьте двести воинов, семьдесят всадников и двести копейщиков[a], чтобы они отправились до Кесарии в третий час ночи[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «двести праворуких охранников»; точное значение редкого слова, переведённого как «копейщики», неизвестно.'
    reason: lexical_alternative
  - marker: b
    text: То есть примерно через три часа после наступления ночи — около девяти часов вечера по принятому у иудеев счёту времени.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενός
  choice: подозвав к себе
  rationale: Аористное причастие от προσκαλέομαι обозначает вызов людей к себе и естественно вводит основное действие εἶπεν — «сказал».
- source_word: τινας δύο τῶν ἑκατονταρχῶν
  choice: двух сотников
  rationale: Неопределённое τινας в сочетании с δύο не требует отдельной передачи по-русски; ἑκατοντάρχης — римский сотник, то есть центурион.
- source_word: Ἑτοιμάσατε
  choice: приготовьте
  rationale: Прямое военное распоряжение; выбранный глагол сохраняет значение подготовки людей к выступлению и звучит естественно в современном литературном русском.
- source_word: στρατιώτας διακοσίους
  choice: двести воинов
  rationale: Передаёт общее обозначение солдат, отличённых далее от всадников и особого рода войск δεξιολάβοι.
- source_word: ὅπως πορευθῶσιν
  choice: чтобы они отправились
  rationale: ὅπως с сослагательным наклонением выражает цель; русская конструкция с «чтобы» сохраняет эту целевую связь.
- source_word: ἕως Καισαρείας
  choice: до Кесарии
  rationale: ἕως с родительным обозначает предел движения; «до Кесарии» сохраняет оттенок «вплоть до» без излишней тяжеловесности.
- source_word: ἱππεῖς ἑβδομήκοντα
  choice: семьдесят всадников
  rationale: ἱππεῖς обозначает конных воинов; «всадники» ясно и естественно для современного читателя.
- source_word: δεξιολάβους διακοσίους
  choice: двести копейщиков
  rationale: Точный смысл редкого военного термина δεξιολάβος спорен. «Копейщики» — контекстуально вероятное и понятное обозначение особого рода вспомогательных войск; неопределённость отмечена в сноске.
- source_word: ἀπὸ τρίτης ὥρας τῆς νυκτός
  choice: в третий час ночи
  rationale: В данном распоряжении ἀπό указывает начальный момент выступления. Сохранена древняя система счёта времени, а приблизительный современный эквивалент дан в сноске.
