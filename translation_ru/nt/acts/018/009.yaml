  text: εἶπεν δὲ ὁ κύριος ⸂ἐν νυκτὶ δι’ ὁράματος⸃ τῷ Παύλῳ· Μὴ φοβοῦ, ἀλλὰ λάλει καὶ μὴ σιωπήσῃς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/009.yaml
  text: And the Lord said to Paul in the night through a vision[a], “Do not be afraid, but keep speaking and do not be silent,”
translation:
  language: ru
  text: 'И Господь ночью сказал Павлу в видении[a]: «Не бойся, но продолжай говорить и не умолкай».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через видение». Буквально греческий оборот означает «посредством видения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: Господь
  rationale: Сохраняет титул исходного текста и не добавляет прямого отождествления с Иисусом, хотя в контексте Деяний такое понимание наиболее вероятно.
- source_word: ἐν νυκτὶ
  choice: ночью
  rationale: Естественная современная русская передача временного значения греческого оборота.
- source_word: δι’ ὁράματος
  choice: в видении
  rationale: Естественно передаёт способ, которым Господь обратился к Павлу; буквальная инструментальная конструкция отмечена в сноске.
- source_word: Μὴ φοβοῦ
  choice: Не бойся
  rationale: Обычная и точная русская форма запрета, сохраняющая продолжающееся значение настоящего императива.
- source_word: ἀλλὰ λάλει
  choice: но продолжай говорить
  rationale: Передаёт несовершенный вид настоящего императива и призыв не прекращать речь.
- source_word: καὶ μὴ σιωπήσῃς
  choice: и не умолкай
  rationale: Естественно выражает запрет прекратить говорить и сохраняет риторическую пару с предыдущим повелением.
theological_decisions:
- issue: Кого обозначает «Господь»
  choice: Господь
  alternative: Господь Иисус
  rationale: В греческом тексте стоит только ὁ κύριος. Контекст Деяний указывает на воскресшего Иисуса, однако перевод не должен добавлять имя, отсутствующее в данном стихе.
translation_notes:
  register: Современный литературный русский язык; речь ясная и достойная, без архаизмов. «Продолжай говорить» явно передаёт длительность действия, а «не умолкай» сохраняет краткость и силу повеления.
