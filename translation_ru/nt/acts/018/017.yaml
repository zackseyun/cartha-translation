base_translation:
  language: en
  yaml_path: translation/nt/acts/018/017.yaml
  text: Then they all seized Sosthenes[a], the synagogue ruler, and beat him in front of the tribunal. But Gallio paid no attention to these things.
translation:
  language: ru
  text: Тогда все они схватили Сосфена[a], начальника синагоги, и избивали его перед судейским помостом. Но Галлион не обращал на это никакого внимания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях вместо «все они» стоит: «все греки». В более кратком чтении группа не названа.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  choice: схватили
  rationale: Причастие от ἐπιλαμβάνομαι обозначает решительное физическое действие — «схватить, ухватиться»; «схватили» естественно передаёт начало насилия.
- source_word: πάντες
  choice: все они
  rationale: Субстантивированное прилагательное сохраняет значение всеобщности, но не уточняет, к какой группе относятся действующие лица.
- source_word: ἀρχισυνάγωγον
  choice: начальника синагоги
  rationale: Термин обозначает руководящее должностное лицо синагоги; это ясное и устойчивое русское соответствие.
- source_word: ἔτυπτον
  choice: стали бить
  rationale: Имперфект передаёт продолжающееся или повторяющееся нанесение ударов; конструкция «стали бить» естественно показывает развёртывающееся действие.
- source_word: ἔμπροσθεν τοῦ βήματος
  choice: перед судейским местом
  rationale: βῆμα здесь — возвышение или место, с которого проконсул вёл судебное разбирательство; перевод сохраняет конкретный пространственный образ и юридический контекст.
- source_word: οὐδὲν τούτων ... ἔμελεν
  choice: не обращал на это никакого внимания
  rationale: Идиома означает, что происходящее нисколько не заботило Галлиона; выбранная формулировка современна и не усиливает эмоциональную оценку.
- source_word: δέ
  choice: Тогда
  rationale: Передаёт переход к следующему событию повествования.
- source_word: καί
  choice: Но
  rationale: В данном контексте союз вводит контраст между избиением и бездействием Галлиона.
theological_decisions:
- issue: Кого обозначает πάντες («все»)
  choice: 'В основном тексте группа не определена: «все они».'
  alternative: «все греки» или «все иудеи»
  rationale: Краткое чтение SBLGNT не называет группу. Её отождествление с греками засвидетельствовано в части рукописей, однако не должно вноситься в основной текст.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное. Сохранена неопределённость субъекта πάντες и длительный характер ἔτυπτον.
