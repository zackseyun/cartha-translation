  text: οὗτός τε ἤρξατο παρρησιάζεσθαι ἐν τῇ συναγωγῇ· ἀκούσαντες δὲ αὐτοῦ ⸂Πρίσκιλλα καὶ Ἀκύλας⸃ προσελάβοντο αὐτὸν καὶ ἀκριβέστερον αὐτῷ ἐξέθεντο τὴν ⸂ὁδὸν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/026.yaml
  text: And he began to speak boldly in the synagogue. But when Priscilla and Aquila heard him[a], they took him aside and explained the way of God to him more accurately.
translation:
  language: ru
  text: Он стал смело говорить в синагоге. Услышав его, Прискилла и Акила приняли его[a] и точнее объяснили ему путь Божий.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отвели его в сторону»; или: «взяли его к себе». Греческий глагол может означать как принятие человека, так и то, что его берут с собой или отводят для беседы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός τε
  choice: Он
  rationale: Указательное местоимение отсылает к Аполлосу из предыдущего контекста; в современном русском естественно употребить личное местоимение. Частица τέ имеет слабую связующую силу и не требует отдельной передачи.
- source_word: ἤρξατο παρρησιάζεσθαι
  choice: стал смело говорить
  rationale: Сочетание передаёт начало открытой, уверенной речи. «Стал смело говорить» звучит естественно и сохраняет значение начала действия и дерзновенной публичной речи.
- source_word: ἐν τῇ συναγωγῇ
  choice: в синагоге
  rationale: Прямое и общепринятое обозначение места действия.
- source_word: ἀκούσαντες δὲ αὐτοῦ
  choice: Услышав его
  rationale: Аористное причастие имеет временное значение. δέ обозначает мягкий переход; русская конструкция не нуждается в обязательном противительном союзе.
- source_word: Πρίσκιλλα καὶ Ἀκύλας
  choice: Прискилла и Акила
  rationale: Формы имён соответствуют греческому тексту и устоявшейся русской библейской передаче.
- source_word: προσελάβοντο αὐτὸν
  choice: приняли его
  rationale: Средний залог προσλαμβάνομαι допускает значения «принять», «взять к себе» и контекстуально «отвести в сторону». Основной текст сохраняет более широкое значение глагола, а примечание сообщает контекстуально вероятную альтернативу.
- source_word: ἀκριβέστερον
  choice: точнее
  rationale: Сравнительная степень сохраняет мысль о более точном изложении по сравнению с прежним пониманием Аполлоса, не утверждая, что всё сказанное им было неверно.
- source_word: ἐξέθεντο
  choice: объяснили
  rationale: ἐκτίθημι в среднем залоге здесь означает подробно изложить или объяснить; «объяснили» ясно и современно.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: путь Божий
  rationale: Сохраняется образное раннехристианское выражение без сужения его до конкретной доктринальной формулы; русская форма естественна и литературна.
theological_decisions:
- issue: Характер действия Прискиллы и Акилы по отношению к Аполлосу
  choice: «приняли его» с примечанием об альтернативных значениях
  alternative: «отвели его в сторону» или «взяли его к себе»
  rationale: Глагол допускает как принятие человека к себе, так и отведение для частной беседы. Контекст последующего объяснения поддерживает частное наставление, однако основной перевод не должен устранять подлинную лексическую неоднозначность.
- issue: Значение выражения «путь Божий»
  choice: сохранить само выражение без поясняющей конкретизации
  alternative: явно назвать его христианским учением, спасительным путём или нравственным образом жизни
  rationale: Контекст связывает выражение с вестью, которую проповедовал Аполлос, но сам текст не определяет его точнее; перевод сохраняет богословскую ёмкость оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; неоднозначность προσελάβοντο сохранена посредством примечания.
