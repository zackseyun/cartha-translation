  text: Ὡς δὲ κατῆλθον ἀπὸ τῆς Μακεδονίας ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος, συνείχετο τῷ ⸀λόγῳ ὁ Παῦλος, διαμαρτυρόμενος τοῖς Ἰουδαίοις ⸀εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/005.yaml
  text: But when Silas and Timothy came down from Macedonia[a], Paul was occupied with the word[b], solemnly testifying to the Jews that Jesus is the Messiah.
translation:
  language: ru
  text: Когда же Сила и Тимофей спустились из Македонии, Павел был всецело поглощён словом[a], настойчиво свидетельствуя иудеям, что Иисус — Мессия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был побуждаем словом», «целиком посвятил себя возвещению слова». Греческий глагол может означать, что человек чем-либо охвачен, побуждаем или полностью занят.'
    reason: lexical_alternative
  - marker: b
    text: Греч. «Христос». Здесь это слово употреблено как титул и означает «Мессия», то есть «Помазанник».
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Когда же
  rationale: Передаёт временное значение ὡς и переходную связку δέ естественной русской конструкцией.
- source_word: κατῆλθον ἀπὸ τῆς Μακεδονίας
  choice: пришли из Македонии
  rationale: Русское «пришли» естественно передаёт движение к месту действия; буквальное «спустились» здесь могло бы создать ненужный географический акцент.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: Сила и Тимофей
  rationale: Сохраняет обоих участников без тяжеловесного воспроизведения корреляции τε…καί.
- source_word: συνείχετο τῷ λόγῳ
  choice: был всецело поглощён словом
  rationale: Передаёт состояние полной занятости и сосредоточенности Павла на возвещаемом слове, сохраняя образ λόγος и не уточняя сверх текста, было ли это внутренним побуждением или деятельной посвящённостью.
- source_word: διαμαρτυρόμενος
  choice: настойчиво свидетельствуя
  rationale: Сохраняет значение свидетельства и усилительный оттенок глагола; «настойчиво» в современном русском звучит естественнее, чем «торжественно» или «с solemnностью».
- source_word: τοῖς Ἰουδαίοις
  choice: иудеям
  rationale: Прямое и уместное для исторического контекста обозначение адресатов проповеди Павла.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: что Иисус — Мессия
  rationale: Предикативная конструкция отождествляет Иисуса с ожидаемым Помазанником; порядок слов по-русски ясно выражает это утверждение.
theological_decisions:
- issue: Передача Χριστός как титула или имени
  choice: Мессия
  alternative: Христос
  rationale: 'Артикль и предикативное употребление в обращённом к иудеям свидетельстве подчёркивают титульное значение: Иисус является обещанным Мессией. Вариант «Христос» возможен, но в современном русском часто воспринимается как часть имени.'
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным тоном. Сохранены богословски значимые «слово», «свидетельствуя» и титул «Мессия»; неоднозначность συνείχετο разъяснена в сноске, а не устранена толкованием в основном тексте.
