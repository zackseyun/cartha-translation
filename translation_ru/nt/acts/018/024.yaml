base_translation:
  language: en
  yaml_path: translation/nt/acts/018/024.yaml
  text: A certain Jew named Apollos[a], an Alexandrian by birth, an eloquent man, arrived in Ephesus, being mighty in the Scriptures.
translation:
  language: ru
  text: В Эфес прибыл один иудей по имени Аполлос, родом из Александрии, красноречивый[a] человек, хорошо знавший Писания.
  philosophy: optimal-equivalence
