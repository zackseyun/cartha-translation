    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: иудей
  rationale: Здесь слово обозначает этнорелигиозную принадлежность Аполлоса, а не жителя Иудеи.
- source_word: δέ
  choice: передано новым предложением без отдельного союза
  rationale: Частица отмечает переход к новому участнику повествования; в современном русском такой переход естественно выражается самим началом нового эпизода.
- source_word: τις
  choice: один
  rationale: Сохраняет лёгкую неопределённость при введении нового участника и звучит естественнее буквального «некий».
- source_word: Ἀπολλῶς ὀνόματι
  choice: по имени Аполлос
  rationale: Естественная русская передача греческого оборота, вводящего имя человека.
- source_word: Ἀλεξανδρεὺς τῷ γένει
  choice: родом из Александрии
  rationale: Передаёт происхождение Аполлоса ясно и без современных неоднозначных ассоциаций слова «раса».
- source_word: ἀνὴρ λόγιος
  choice: человеком красноречивым
  rationale: λόγιος допускает значения «красноречивый» и «образованный, учёный»; основное значение выбрано по контексту, а альтернатива сохранена в сноске.
- source_word: κατήντησεν εἰς Ἔφεσον
  choice: В Эфес прибыл
  rationale: Глагол означает достижение места назначения; русский порядок слов естественно вводит место и нового участника.
- source_word: δυνατὸς ὢν ἐν ταῖς γραφαῖς
  choice: хорошо знал Писания
  rationale: Передаёт не физическую силу, а высокую компетентность в священных текстах; это естественный современный русский оборот, сохраняющий смысл.
