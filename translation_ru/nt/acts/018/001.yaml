- source_word: ἦλθεν εἰς Κόρινθον
  choice: пришёл в Коринф
  rationale: Глагол ἦλθεν передан обычным «пришёл», а εἰς с названием города — естественной русской конструкцией направления «в Коринф».
- source_word: implicit subject of ἦλθεν
  choice: Павел
  rationale: В греческом подлежащее подразумевается из предшествующего контекста; его явное обозначение по имени устраняет неестественную для отдельного русского стиха неопределённость и соответствует референту повествования.
