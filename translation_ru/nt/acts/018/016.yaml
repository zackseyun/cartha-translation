lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет простой повествовательный союз без добавления причинного или временного оттенка.
- source_word: ἀπήλασεν
  choice: прогнал
  rationale: Передаёт решительное, властное удаление, выраженное аористом ἀπελαύνω, и не смягчает действие до простого «отпустил».
- source_word: αὐτοὺς
  choice: их
  rationale: Естественно отсылает к участникам предшествующей сцены, не конкретизируя их сверх текста.
- source_word: ἀπὸ τοῦ βήματος
  choice: от судейского места
  rationale: Передаёт удаление от официального места судебного разбирательства; выражение понятно современному читателю и сохраняет предметно-пространственный образ βῆμα.
