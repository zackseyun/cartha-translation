  text: И он пробыл там год и шесть месяцев и учил их слову Божьему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν
  choice: пробыл там
  rationale: Хотя основное значение глагола — «сел», в данном повествовательном контексте он идиоматически означает длительное пребывание в одном месте; «пробыл там» естественно сочетается с указанием срока.
- source_word: δὲ
  choice: И
  rationale: Частица δέ служит мягкой повествовательной связкой. Русское «и» естественно продолжает рассказ, не внося излишнего противопоставления или причинного оттенка.
- source_word: ἐνιαυτὸν καὶ μῆνας ἓξ
  choice: год и шесть месяцев
  rationale: Прямая и естественная передача винительного падежа длительности.
- source_word: διδάσκων
  choice: уча
  rationale: Деепричастие передаёт действие, продолжавшееся одновременно с пребыванием Павла.
- source_word: ἐν αὐτοῖς
  choice: их
  rationale: 'В сочетании с русским глаголом «учить» греческое ἐν αὐτοῖς естественно передаётся прямым дополнением «их»: речь идёт об обучении людей внутри этой общины.'
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: слову Божьему
  rationale: Устойчивая библейская формулировка сохраняет богословскую насыщенность λόγος и в конструкции «учить кого-либо чему-либо» требует дательного падежа.
