  text: λέγοντες ὅτι Παρὰ τὸν νόμον ⸂ἀναπείθει οὗτος⸃ τοὺς ἀνθρώπους σέβεσθαι τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/013.yaml
  text: saying[b][a], “This man is persuading people to worship God contrary to the law.”
translation:
  language: ru
  text: 'и говорили: «Этот человек убеждает людей поклоняться Богу вопреки закону[a][b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против закона»; «нарушая закон».'
    reason: lexical_alternative
  - marker: b
    text: Обвинители, вероятнее всего, имеют в виду иудейский закон, хотя по-гречески сказано просто «закон».
    reason: cultural_note
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: 'и говорили: «…»'
  rationale: Причастие вводит содержание обвинения; в русском связном повествовании естественно передать его личной формой с прямой речью.
- source_word: Παρὰ τὸν νόμον
  choice: вопреки закону
  rationale: Παρά с винительным выражает противоречие закону или его нарушение; формулировка сохраняет юридический оттенок, не уточняя вид закона.
- source_word: ἀναπείθει
  choice: убеждает
  rationale: Настоящее время указывает на продолжаемое или характерное действие; нейтральное «убеждает» не привносит отсутствующего в самом глаголе значения обмана.
- source_word: οὗτος
  choice: Этот человек
  rationale: Передаёт указательную и несколько заострённую форму обвинения без излишне уничижительного оттенка.
- source_word: τοὺς ἀνθρώπους
  choice: людей
  rationale: Ἄνθρωποι употреблено обобщённо и не ограничено мужчинами.
- source_word: σέβεσθαι τὸν θεόν
  choice: поклоняться Богу
  rationale: В данном религиозном контексте σέβομαι обозначает почитание Бога в поклонении.
- source_word: τὸν νόμον
  choice: закону
  rationale: Греческий текст говорит просто «закону», не добавляя «иудейскому» или «нашему».
theological_decisions:
- issue: К какому закону относится обвинение
  choice: Сохранено неуточнённое «закону».
  alternative: «иудейскому закону» или «нашему закону»
  rationale: По контексту обвинители, вероятнее всего, имеют в виду иудейский закон, однако исходный текст этого прямо не уточняет; неоднозначность сохранена в основном тексте и пояснена в сноске.
translation_notes:
  register: Современный литературный русский язык; речь ясная и достойная, с сохранением юридического оттенка обвинения. Маркеры сносок размещены после соответствующего высказывания.
