  terminology: Имена «Прискилла» и «Акила» переданы последовательно. «Братья» сохраняет исходный семейный термин ἀδελφοί; сноска корректно поясняет вероятный общинный, включающий смысл. «Обет» не уточняется как назорейский, что соответствует тексту.
