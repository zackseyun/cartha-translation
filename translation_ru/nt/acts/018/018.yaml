  source_fidelity: 'Русский текст точно передаёт синтаксическое и смысловое ядро греческого оригинала: Павел остаётся ещё значительное время, прощается с братьями, отплывает в Сирию в сопровождении Прискиллы и Акилы; стрижка в Кенхреях и обет относятся к Павлу. «Остриг себе волосы» обоснованно сохраняет широту κειράμενος и не навязывает полного бритья. «Был связан обетом» хорошо передаёт продолжающееся обязательство, выраженное εἶχεν εὐχήν.'
