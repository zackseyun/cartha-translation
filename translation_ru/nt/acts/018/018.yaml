source:
  edition: SBLGNT
  text: Ὁ δὲ Παῦλος ἔτι προσμείνας ἡμέρας ἱκανὰς τοῖς ἀδελφοῖς ἀποταξάμενος ἐξέπλει εἰς τὴν Συρίαν, καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας, κειράμενος ⸂ἐν Κεγχρεαῖς τὴν κεφαλήν⸃, εἶχεν γὰρ εὐχήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/018.yaml
  text: After Paul had remained many more days[a], he said farewell to the brothers and sailed away for Syria, and with him were Priscilla and Aquila. In Cenchreae he had his head shaved[e][d][c][b], for he had a vow.
translation:
  language: ru
  text: Павел пробыл там ещё довольно много дней, затем простился с братьями[a] и отплыл в Сирию; вместе с ним отправились Прискилла и Акила. В Кенхреях он остриг себе волосы[b][c], потому что был связан обетом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «братья» здесь, вероятно, обозначает всю общину верующих, включая женщин.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обрил себе голову». Греческий глагол может обозначать стрижку или срезание волос и не обязательно полное бритьё.'
    reason: lexical_alternative
  - marker: c
    text: Некоторые относят стрижку и обет к Акиле, а не к Павлу, однако грамматически причастие естественнее относится к Павлу. Текст говорит лишь об «обете» и прямо не называет его назорейским.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι προσμείνας ἡμέρας ἱκανὰς
  choice: пробыл там ещё довольно много дней
  rationale: Причастие обозначает действие, предшествующее отплытию; ἔτι и ἱκανὰς вместе передают продолжение пребывания в течение значительного времени. «Там» естественно восстанавливается из контекста.
- source_word: τοῖς ἀδελφοῖς
  choice: с братьями
  rationale: Сохранён образ родства, которым в раннехристианской речи обозначается община; возможный включительный смысл пояснён в сноске.
- source_word: ἀποταξάμενος
  choice: простился
  rationale: Средний залог здесь естественно означает «попрощаться, проститься».
- source_word: ἐξέπλει εἰς τὴν Συρίαν
  choice: отплыл в Сирию
  rationale: Передаёт отправление морем и направление движения без лишнего уточнения.
- source_word: καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας
  choice: вместе с ним отправились Прискилла и Акила
  rationale: Фраза оформлена как естественная русская клауза и сохраняет спутников Павла как отдельный элемент исходного предложения.
- source_word: κειράμενος … τὴν κεφαλήν
  choice: остриг себе волосы
  rationale: κείρω означает стричь или срезать волосы и не обязательно подразумевает бритьё наголо. Русская формулировка сохраняет эту лексическую широту.
- source_word: ἐν Κεγχρεαῖς
  choice: в Кенхреях
  rationale: Употреблена устоявшаяся русская форма топонима во множественном числе.
- source_word: εἶχεν γὰρ εὐχήν
  choice: потому что был связан обетом
  rationale: Передаёт идиоматический смысл наличия действующего обязательства, не уточняя вид обета.
theological_decisions:
- issue: К кому относится причастие κειράμενος
  choice: К Павлу
  alternative: К Акиле
  rationale: Мужское причастие единственного числа естественнее всего продолжает главного подлежащего предложения — Павла. Альтернативное отнесение к Акиле известно, но грамматически менее вероятно и отмечено в сноске.
- issue: Характер обета εὐχή
  choice: Неопределённый обет
  alternative: Назорейский обет
  rationale: Греческий текст называет лишь обет и не определяет его как назорейский; конкретизация внесла бы в основной текст отсутствующую информацию.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис разделён на два предложения для удобочитаемости, при этом последовательность действий и связь причастий с Павлом сохранены. Формулировки не уточняют ни степень удаления волос, ни вид обета сверх того, что позволяет греческий текст.
