base_translation:
  language: en
  yaml_path: translation/nt/acts/018/019.yaml
  text: They came to Ephesus[a], and he left them there[c][b]; but he himself entered into the synagogue and reasoned with the Jews.
translation:
  language: ru
  text: Они прибыли в Эфес и он оставил их там[a], а сам вошёл в синагогу и рассуждал с иудеями[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть оставил своих спутников — Прискиллу и Акилу, упомянутых в предыдущем стихе.
    reason: cross_reference
  - marker: b
    text: 'Или: «беседовал с иудеями», «обсуждал с иудеями». Греческое слово подразумевает беседу с обменом доводами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατήντησαν
  choice: прибыли
  rationale: Глагол обозначает прибытие или достижение места назначения; «прибыли в Эфес» естественно передаёт завершение пути.
- source_word: κἀκείνους κατέλιπεν αὐτοῦ
  choice: и он оставил их там
  rationale: Местоимение сохраняет контекстуальную отсылку к спутникам Павла, а «там» передаёт местное значение αὐτοῦ без ненужного повторения названия города.
- source_word: αὐτὸς δὲ
  choice: а сам
  rationale: 'Передаёт как лёгкое противопоставление δέ, так и эмфатическое значение αὐτός: спутники остались, а он лично вошёл в синагогу.'
- source_word: εἰσελθὼν εἰς τὴν συναγωγήν
  choice: вошёл в синагогу
  rationale: Русская сочинительная конструкция естественно передаёт предшествующее обстоятельственное причастие, не утяжеляя фразу буквальным деепричастием.
- source_word: διελέξατο
  choice: беседовал с
  rationale: В данном контексте глагол указывает на содержательный обмен рассуждениями; «беседовал» сохраняет диалогический характер и не придаёт речи излишне конфликтного оттенка.
- source_word: τοῖς Ἰουδαίοις
  choice: с иудеями
  rationale: Прямое и традиционно понятное обозначение этнорелигиозной группы; контекст не позволяет сужать его до руководителей.
theological_decisions: []
