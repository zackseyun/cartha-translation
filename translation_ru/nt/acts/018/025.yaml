source:
  edition: SBLGNT
  text: οὗτος ἦν κατηχημένος τὴν ὁδὸν τοῦ κυρίου, καὶ ζέων τῷ πνεύματι ἐλάλει καὶ ἐδίδασκεν ἀκριβῶς τὰ περὶ τοῦ ⸀Ἰησοῦ, ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/025.yaml
  text: This man had been instructed in the way of the Lord[a], and being fervent in spirit, he was speaking and teaching accurately the things concerning Jesus, knowing only the baptism of John.
translation:
  language: ru
  text: Он был наставлен в пути Господнем и, пламенея духом[a], правильно говорил и учил об Иисусе, зная только крещение Иоанна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пламенея Духом», то есть Святым Духом, а не собственным духом Аполлоса.'
    reason: Альтернативное понимание τῷ πνεύματι сохраняет подлинную смысловую и богословскую неоднозначность греческого текста.
lexical_decisions:
- source_word: κατηχημένος
  choice: был наставлен
  rationale: Перфектное пассивное причастие указывает на полученное ранее наставление, результат которого сохранялся; формулировка естественна и не вносит позднейшего специального смысла слова «катехизирован».
- source_word: τὴν ὁδὸν τοῦ κυρίου
  choice: в пути Господнем
  rationale: Сохраняет раннехристианский образ «пути» и передаёт κύριος как «Господь»; предложное управление естественно для русского выражения «наставлен в…».
- source_word: ζέων τῷ πνεύματι
  choice: пламенея духом
  rationale: «Пламенея» передаёт буквальный образ кипения и сильное рвение; строчная буква не устраняет возможность понимания πνεῦμα как указания на Святого Духа, которая отмечена в сноске.
- source_word: ἐλάλει καὶ ἐδίδασκεν
  choice: говорил и учил
  rationale: Два глагола переданы раздельно и прямо; русские формы несовершенного вида естественно выражают продолжавшуюся или обычную деятельность, обозначенную греческими имперфектами.
- source_word: ἀκριβῶς
  choice: верно
  rationale: В данном контексте наречие характеризует правильность сообщаемого учения. «Верно» звучит естественнее по-русски, чем более техническое «точно», не снимая повествовательного напряжения между правильностью учения и ограниченностью знания.
- source_word: τὰ περὶ τοῦ Ἰησοῦ
  choice: об Иисусе
  rationale: Краткое и естественное русское соответствие, сохраняющее широкий предмет речи без добавочного уточнения.
- source_word: ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου
  choice: зная только крещение Иоанна
  rationale: Деепричастная конструкция непосредственно отражает греческое причастие и не делает уступительное отношение явным там, где оно выводится лишь из контекста.
theological_decisions:
- issue: Значение τῷ πνεύματι в выражении ζέων τῷ πνεύματι
  choice: «духом» — прежде всего внутреннее рвение Аполлоса, без окончательного устранения двусмысленности
  alternative: «Духом» — Святой Дух
  rationale: Греческая форма допускает оба понимания и сама по себе не содержит графического различия. Основной текст использует строчную букву как естественное русское идиоматическое чтение, а богословски значимая альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным и компактным; традиционные слова «Господь» и «крещение» сохранены. Вид русских глаголов передаёт длительность имперфектов без тяжеловесной аналитической конструкции.
