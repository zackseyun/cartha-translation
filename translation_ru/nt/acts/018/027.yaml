  text: βουλομένου δὲ αὐτοῦ διελθεῖν εἰς τὴν Ἀχαΐαν προτρεψάμενοι οἱ ἀδελφοὶ ἔγραψαν τοῖς μαθηταῖς ἀποδέξασθαι αὐτόν· ὃς παραγενόμενος συνεβάλετο πολὺ τοῖς πεπιστευκόσιν διὰ τῆς χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/027.yaml
  text: And when he wanted to go across to Achaia[a], the brothers encouraged him and wrote to the disciples to welcome him. When he arrived[b], he greatly helped those who had believed through grace.
translation:
  language: ru
  text: Когда же он захотел отправиться в Ахайю, братья[b] поддержали его и написали ученикам, чтобы те приняли его. Прибыв туда, он оказал большую помощь уверовавшим по благодати.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «По благодати он оказал большую помощь уверовавшим». Греческое выражение «по благодати» можно связывать не с уверованием, а с помощью, которую оказал Аполлос.'
    reason: alternative_reading
  - marker: b
    text: Слово «братья» может обозначать всё сообщество верующих, включая женщин, хотя в греческом тексте употреблена форма мужского рода.
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλομένου δὲ αὐτοῦ
  choice: Когда же он захотел
  rationale: Генитив абсолютный передан естественным обстоятельственным оборотом; «захотел» сохраняет значение намерения и желания Аполлоса.
- source_word: διελθεῖν εἰς τὴν Ἀχαΐαν
  choice: отправиться в Ахайю
  rationale: В контексте речь о путешествии из Эфеса в Ахайю. Русское «отправиться» звучит естественно; буквальный оттенок пересечения пути не требует отдельного выражения.
- source_word: προτρεψάμενοι
  choice: поддержали его
  rationale: Причастие обозначает ободрение или побуждение. «Поддержали» естественно передаёт доброжелательное содействие братьев и хорошо согласуется с последующим рекомендательным письмом.
- source_word: οἱ ἀδελφοὶ
  choice: братья
  rationale: Сохранена мужская форма греческого текста; в раннехристианском употреблении слово могло обозначать более широкий круг верующих, включая женщин.
- source_word: ἔγραψαν τοῖς μαθηταῖς
  choice: написали ученикам
  rationale: Прямое и естественное соответствие греческой конструкции; «ученики» сохраняет характерную для Деяний лексику.
- source_word: ἀποδέξασθαι αὐτόν
  choice: чтобы те приняли его
  rationale: Здесь глагол означает благожелательно принять Аполлоса. «Приняли» сохраняет как значение признания, так и оттенок гостеприимного приёма.
- source_word: ὃς παραγενόμενος
  choice: Прибыв туда
  rationale: Краткая русская конструкция естественно возобновляет рассказ об Аполлосе; «туда» ясно указывает на Ахайю и не добавляет спорного конкретного города.
- source_word: συνεβάλετο πολὺ
  choice: оказал большую помощь
  rationale: Средний залог συμβάλλω в данном контексте означает существенную помощь или содействие. Выбранное выражение ясно и достойно по регистру.
- source_word: τοῖς πεπιστευκόσιν
  choice: уверовавшим
  rationale: Субстантивированное русское причастие лаконично обозначает тех, кто уже пришёл к вере, и соответствует перфектному греческому причастию.
- source_word: διὰ τῆς χάριτος
  choice: по благодати
  rationale: Устойчивое русское выражение передаёт благодать как основание или средство уверования, не добавляя отсутствующих в греческом тексте слов «Божьей».
theological_decisions:
- issue: Синтаксическая связь διὰ τῆς χάριτος
  choice: 'Фраза отнесена к «уверовавшим»: «уверовавшим по благодати».'
  alternative: 'Фразу можно отнести к помощи Аполлоса: «по благодати оказал большую помощь уверовавшим».'
  rationale: Порядок слов и смысл несколько предпочтительнее связывают выражение с уверованием, однако греческий допускает связь со служением Аполлоса. Альтернатива сохранена в примечании, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис умеренно формальный; традиционные христианские термины «ученики», «уверовавшие» и «благодать» сохранены как общеупотребительные и смыслово точные.
