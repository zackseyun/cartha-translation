id: ACT.18.21
reference: Acts 18:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸂ἀλλὰ ἀποταξάμενος καὶ⸃ ⸀εἰπών· ⸀Πάλιν ἀνακάμψω πρὸς ὑμᾶς τοῦ θεοῦ θέλοντος ἀνήχθη ἀπὸ τῆς Ἐφέσου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/021.yaml
  text: but after taking leave and saying[a], “I will return to you again[b], if God wills,” he set sail from Ephesus.
translation:
  language: ru
  text: 'но, простившись с ними и сказав[a]: «Я снова вернусь к вам, если будет на то воля Бога»[b], он отплыл из Эфеса.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях отсутствуют слова: «и сказав: „Я снова вернусь к вам, если будет на то воля Бога“».'
    reason: textual_variant
  - marker: b
    text: 'Или: «если Бог пожелает».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: но
  rationale: Передаёт противопоставление предшествующей просьбе остаться дольше и естественно связывает стих с контекстом.
- source_word: ἀποταξάμενος
  choice: простившись с ними
  rationale: Аористное причастие среднего залога обозначает прощание перед отъездом; местоимение «с ними» естественно восполняет подразумеваемый объект по контексту.
- source_word: καὶ εἰπών
  choice: и сказав
  rationale: Сохраняет последовательность двух греческих причастий и связь слов Павла с его прощанием.
- source_word: Πάλιν ἀνακάμψω πρὸς ὑμᾶς
  choice: Я снова вернусь к вам
  rationale: Точно и естественно передаёт наречие повторности, глагол возвращения и направление к адресатам.
- source_word: τοῦ θεοῦ θέλοντος
  choice: если будет на то воля Бога
  rationale: Передаёт условное значение родительного самостоятельного оборота и прямое упоминание Бога, оставаясь естественным для современного русского языка.
- source_word: ἀνήχθη
  choice: он отплыл
  rationale: В повествовании о путешествии глагол имеет морское значение — выйти в море, отплыть.
- source_word: ἀπὸ τῆς Ἐφέσου
  choice: из Эфеса
  rationale: Обычное русское обозначение отправления из города.
theological_decisions:
- issue: Зависимость плана Павла от Божьей воли
  choice: если будет на то воля Бога
  alternative: если Бог пожелает; с Божьей помощью
  rationale: Греческий текст прямо говорит о воле Бога. Выбранная формулировка сохраняет условность и не заменяет волю Бога более общим понятием помощи.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Формулировка ясна широкому читателю; причастная конструкция сохраняет структуру оригинала без неестественной буквальности.
