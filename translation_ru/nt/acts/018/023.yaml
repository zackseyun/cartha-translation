  yaml_path: translation/nt/acts/018/023.yaml
  text: And after spending some time there[a], he departed and traveled from place to place through the Galatian region and Phrygia, strengthening all the disciples.
translation:
  language: ru
  text: Проведя там некоторое время, он отправился и, последовательно проходя через Галатийскую область и Фригию, укреплял всех учеников.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσας χρόνον τινά
  choice: проведя там некоторое время
  rationale: Оборот ποιέω + χρόνον означает «проводить некоторое время». Слово «там» естественно восстанавливает из контекста место пребывания, упомянутое в предыдущем стихе.
- source_word: ἐξῆλθεν
  choice: он отправился дальше
  rationale: В повествовании о путешествии глагол обозначает уход из места и начало дальнейшего пути; этот вариант естественен по-русски.
- source_word: διερχόμενος καθεξῆς
  choice: переходил с места на место
  rationale: Причастие передаёт продолжающееся движение через местность, а καθεξῆς — последовательность посещений. Формулировка сохраняет оба оттенка и звучит естественно.
- source_word: τὴν Γαλατικὴν χώραν καὶ Φρυγίαν
  choice: по Галатийской области и Фригии
  rationale: χώρα обозначает область или территорию, не вынуждая понимать Галатию исключительно как официальную римскую провинцию. Форма «Фригии» естественно согласуется с общим обозначением маршрута.
- source_word: στηρίζων
  choice: укрепляя
  rationale: στηρίζω означает делать твёрдым, утверждать или укреплять. «Укрепляя» сохраняет широкий пастырский смысл без неоправданного уточнения способа.
- source_word: πάντας τοὺς μαθητάς
  choice: всех учеников
  rationale: «Ученики» — устойчивое и ясное обозначение последователей Иисуса в Деяниях; πάντας передано словом «всех».
