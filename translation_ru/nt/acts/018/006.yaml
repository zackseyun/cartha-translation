source:
  edition: SBLGNT
  text: ἀντιτασσομένων δὲ αὐτῶν καὶ βλασφημούντων ἐκτιναξάμενος τὰ ἱμάτια εἶπεν πρὸς αὐτούς· Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν· καθαρὸς ἐγώ· ἀπὸ τοῦ νῦν εἰς τὰ ἔθνη πορεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/006.yaml
  text: But when they opposed and reviled him, he shook out his garments and said to them, “Your blood be on your own heads. I am innocent. From now on I will go to the Gentiles.”
translation:
  language: ru
  text: 'Но когда они противились и злословили[a], он отряхнул свою одежду и сказал им: «Кровь ваша — на ваших головах[b]. Я чист. Отныне пойду к язычникам[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол может означать также «богохульствовать» или «поносить»; объект такой речи здесь прямо не назван.
    reason: lexical_alternative
  - marker: b
    text: Выражение «кровь ваша на ваших головах» означает, что ответственность за последствия лежит на них самих.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «к народам»; в данном контексте имеются в виду неевреи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιτασσομένων
  choice: стали противиться
  rationale: Передаёт активное сопротивление Павлу и его проповеди; конструкция с «стали» естественно выражает обстоятельственный причастный оборот и развитие действия.
- source_word: βλασφημούντων
  choice: злословить
  rationale: 'Сохраняет неопределённость греческого глагола: речь может идти как о богохульстве, так и об оскорбительной, поносительной речи. В основной строке не добавлен отсутствующий в греческом объект «его».'
- source_word: ἐκτιναξάμενος τὰ ἱμάτια
  choice: отряхнул свою одежду
  rationale: Естественно по-русски передаёт символический жест отмежевания; «одежду» соответствует собирательному употреблению ἱμάτια в данном контексте.
- source_word: Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν
  choice: Кровь ваша на ваших головах
  rationale: Сохраняет торжественную библейскую формулу ответственности и множественное число, не превращая её пояснительно в проклятие.
- source_word: καθαρὸς ἐγώ
  choice: Я чист
  rationale: Буквально сохраняет метафору чистоты и её напряжение; в контексте она означает непричастность к вине и ответственности, однако перевод не подменяет образ толкованием «я невиновен».
- source_word: ἀπὸ τοῦ νῦν
  choice: Отныне
  rationale: Краткое, современно понятное и торжественное обозначение решительного перехода.
- source_word: εἰς τὰ ἔθνη
  choice: к язычникам
  rationale: В контрасте с аудиторией синагоги означает неевреев; «язычникам» — устоявшийся и ясный русский эквивалент, тогда как буквальное «к народам» здесь менее точно.
- source_word: πορεύσομαι
  choice: пойду
  rationale: Прямо и естественно передаёт будущее намерение движения и служения.
theological_decisions:
- issue: Формула «Кровь ваша на ваших головах»
  choice: Сохранена как идиоматическое заявление о том, что ответственность за последствия лежит на слушателях, а не на Павле.
  alternative: Понять её как более сильную формулу проклятия.
  rationale: Контекст и библейский язык ответственности позволяют видеть здесь торжественное снятие Павлом ответственности после данного свидетельства; буквальный образ сохранён без усиления до прямого проклятия.
- issue: Значение καθαρὸς ἐγώ
  choice: «Я чист» — сохранён образ ритуальной/нравственной чистоты, подразумевающий свободу от ответственности.
  alternative: «Я невиновен» или «с меня вина снята».
  rationale: Более буквальная формулировка сохраняет богословски значимый образ и не сужает его до одного объяснительного значения.
- issue: Объект злословия в βλασφημούντων
  choice: 'Объект не добавлен: «злословить».'
  alternative: «Злословить его» либо «хулить Бога».
  rationale: Греческий текст не называет объект прямо; перевод сохраняет эту подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством и умеренно библейской торжественностью. Синтаксис сделан естественным для широкой аудитории; ключевые образы «кровь на головах» и «я чист» сохранены, а неоднозначность βλασφημούντων вынесена в примечание.
