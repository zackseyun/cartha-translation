id: ACT.18.12
reference: Acts 18:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Γαλλίωνος δὲ ⸂ἀνθυπάτου ὄντος⸃ τῆς Ἀχαΐας κατεπέστησαν ⸂ὁμοθυμαδὸν οἱ Ἰουδαῖοι⸃ τῷ Παύλῳ καὶ ἤγαγον αὐτὸν ἐπὶ τὸ βῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/012.yaml
  text: But while Gallio was proconsul of Achaia[a], the Jews rose up together against Paul and brought him before the tribunal[b],
translation:
  language: ru
  text: Но когда Галлион был проконсулом Ахайи, иудеи[a] сообща выступили против Павла и привели его на суд[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь имеются в виду местные иудеи, сообща выступившие против Павла, а не весь иудейский народ.
    reason: cultural_note
  - marker: b
    text: 'Или: «к судейскому креслу». Греческое слово обозначает возвышение с официальным местом судьи, а по смыслу — место судебного разбирательства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γαλλίωνος
  choice: Галлион
  rationale: Имя передано в принятой русской библейской и исторической форме.
- source_word: δὲ
  choice: Но
  rationale: 'Частица обозначает переход к новому обстоятельству с лёгким оттенком противопоставления: спокойному служению Павла теперь противостоит организованное выступление против него.'
- source_word: ἀνθυπάτου ὄντος
  choice: когда ... был проконсулом
  rationale: Родительный самостоятельный оборот задаёт временной фон; такая передача естественна по-русски и сохраняет временное значение.
- source_word: ἀνθύπατος
  choice: проконсул
  rationale: Сохранён точный титул наместника римской сенатской провинции, а не обобщённое «правитель».
- source_word: Ἀχαΐας
  choice: Ахайи
  rationale: Использована устоявшаяся русская форма названия римской провинции.
- source_word: κατεπέστησαν
  choice: выступили против
  rationale: Передаёт враждебное действие против Павла, не добавляя прямо не выраженного указания на физическое насилие.
- source_word: ὁμοθυμαδὸν
  choice: сообща
  rationale: Кратко и естественно передаёт согласованность и совместность действий, не утверждая формального единогласия каждого члена общины.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Прямо передаёт греческое обозначение, не сужая его без текстового основания до «иудейских вождей»; примечание ограничивает референт местной группой в данном эпизоде.
- source_word: τῷ Παύλῳ
  choice: против Павла
  rationale: Дательный падеж при глаголе враждебного действия естественно выражается по-русски конструкцией с «против».
- source_word: ἤγαγον αὐτὸν
  choice: привели его
  rationale: Нейтрально передаёт ἄγω и не усиливает действие до «потащили», чего сам текст не требует.
- source_word: ἐπὶ τὸ βῆμα
  choice: на суд
  rationale: В данном контексте βῆμα обозначает официальное место судебного разбирательства. «На суд» ясно и естественно передаёт функцию этого места, а предметный смысл пояснён в примечании.
theological_decisions:
- issue: Передача οἱ Ἰουδαῖοι в повествовании о конфликте
  choice: иудеи
  alternative: иудейские вожди; некоторые иудеи
  rationale: Греческий текст не уточняет, что действовали только руководители, и не содержит слова «некоторые», поэтому основной текст не сужает референт. Вместе с тем контекст говорит о местной группе, выступившей против Павла, а не обо всех иудеях вообще; это пояснено в примечании без изменения формулировки исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Сохранён точный римский титул «проконсул»; избегнуты как архаичное «судилище», так и современное слово «трибунал», способное вызвать неверные ассоциации.
