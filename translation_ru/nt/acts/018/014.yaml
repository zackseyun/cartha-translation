  yaml_path: translation/nt/acts/018/014.yaml
  text: But as Paul was about to open his mouth[a], Gallio said to the Jews, “If it were some wrongdoing or a serious crime, O Jews[c][b], I would reasonably put up with you.
translation:
  language: ru
  text: 'Но когда Павел уже собирался заговорить[a], Галлион сказал иудеям: «Если бы речь шла о каком-нибудь правонарушении или злодеянии, иудеи, я с полным основанием потерпел бы вас[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «открыть рот» — греческая идиома, означающая «начать говорить».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «я с полным основанием выслушал бы вас». Греческое выражение буквально означает «терпеть вас» или «сносить вас»; в судебном контексте оно может подразумевать готовность выслушать жалобу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλοντος δὲ τοῦ Παύλου ἀνοίγειν τὸ στόμα
  choice: Но когда Павел уже собирался заговорить
  rationale: Генитив абсолютный с μέλλω и инфинитивом указывает на действие, которое вот-вот должно было начаться; «заговорить» естественно передаёт греческую идиому «открыть рот».
- source_word: Γαλλίων
  choice: Галлион
  rationale: Имя передано в принятой русской библейской форме.
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: сказал иудеям
  rationale: Передаёт адресата речи без добавления отсутствующего в греческом тексте уточнения «обвинителям».
- source_word: ἀδίκημά τι
  choice: каком-нибудь правонарушении
  rationale: В судебном контексте ἀδίκημα обозначает неправомерный поступок или правонарушение; перевод сохраняет его общий юридический смысл.
- source_word: ῥᾳδιούργημα πονηρόν
  choice: злодеянии
  rationale: Слово ῥᾳδιούργημα обозначает преступное деяние, а πονηρόν подчёркивает его злой, порочный характер; «злодеяние» кратко и естественно выражает оба оттенка.
- source_word: ὦ Ἰουδαῖοι
  choice: иудеи
  rationale: Прямое обращение сохранено, но частица ὦ не калькируется архаичным русским «о».
- source_word: κατὰ λόγον ἂν ἀνεσχόμην ὑμῶν
  choice: тогда я с полным основанием выслушал бы вас
  rationale: κατὰ λόγον означает «с основанием, по праву», а ἀνέχομαι — «терпеть, сносить»; в данном судебном контексте речь идёт о готовности дать жалобщикам высказаться. Формулировка сохраняет условный характер и не вносит излишне разговорной резкости.
