id: ACT.18.10
reference: Acts 18:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διότι ἐγώ εἰμι μετὰ σοῦ καὶ οὐδεὶς ἐπιθήσεταί σοι τοῦ κακῶσαί σε, διότι λαός ἐστί μοι πολὺς ἐν τῇ πόλει ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/010.yaml
  text: because I am with you[a], and no one will attack you to harm you[b], because I have many people in this city.
translation:
  language: ru
  text: потому что Я с тобой, и никто не нападёт на тебя, чтобы причинить тебе вред,[a] потому что у Меня много людей в этом городе».[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никто не тронет тебя, чтобы причинить тебе зло».'
    reason: lexical_alternative
  - marker: b
    text: Слова «у Меня много людей в этом городе» указывают на людей, принадлежащих Господу; в контексте служения Павла они могут включать и тех, кому ещё предстоит уверовать.
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: потому что
  rationale: 'Сохраняет причинное значение обоих употреблений союза: присутствие Господа обосновывает повеление из предыдущего стиха, а наличие в городе многих Его людей — данное Павлу обещание.'
- source_word: ἐγώ εἰμι μετὰ σοῦ
  choice: Я с тобой
  rationale: Естественно и ясно передаёт заверение в личном присутствии; выраженное местоимение ἐγώ отражено отдельным «Я».
- source_word: οὐδεὶς ἐπιθήσεταί σοι
  choice: никто не нападёт на тебя
  rationale: В данном контексте ἐπιτίθημι с дательным обозначает враждебное действие против Павла. «Нападёт» естественно передаёт этот смысл, не ограничивая его одним конкретным жестом.
- source_word: τοῦ κακῶσαί σε
  choice: чтобы причинить тебе вред
  rationale: Передаёт целевое значение инфинитивной конструкции и широкий смысл κακόω — причинить зло, ущерб или страдание.
- source_word: λαός
  choice: людей
  rationale: Хотя в греческом стоит собирательное существительное в единственном числе, в конструкции с πολύς современное русское «много людей» звучит естественно и не устраняет идеи принадлежности Господу.
- source_word: ἐστί μοι
  choice: у Меня много
  rationale: Конструкция εἰμί с дательным выражает обладание; русская конструкция «у Меня» точно и идиоматично передаёт её.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: в этом городе
  rationale: Прямой и естественный эквивалент, соответствующий Коринфу как городу.
theological_decisions:
- issue: Кого означают «много людей» в городе
  choice: 'Основной текст сохраняет открытое утверждение Господа: «у Меня много людей в этом городе».'
  alternative: Понять выражение только как указание на уже уверовавших либо, напротив, исключительно на тех, кому ещё предстоит уверовать.
  rationale: Формулировка говорит о принадлежности людей Господу, но сама по себе не уточняет их нынешнее состояние веры. Контекст продолжения миссии Павла допускает включение тех, кто ещё уверует, поэтому перевод не разрешает эту богословскую напряжённость за читателя.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Синтаксис сохраняет две причинные конструкции исходного текста. Прописные буквы в «Я» и «Меня» обозначают Господа как говорящего. Закрывающая кавычка сохранена, поскольку стих продолжает прямую речь, начатую в предыдущем контексте.
