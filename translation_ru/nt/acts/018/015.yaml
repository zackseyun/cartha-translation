  verdict: approve
  source_fidelity: 'Текст точно передаёт структуру и смысл греческого оригинала: ζητήματα передано как «споры» в допустимом процессуальном значении; λόγος оставлен намеренно широким как «слово»; ὀνομάτων — «имён»; νόμου τοῦ καθ’ ὑμᾶς — «вашего закона». «Разбирайтесь сами» естественно выражает отстраняющее распоряжение ὄψεσθε αὐτοί, включая эмфазу «сами», а «не хочу быть судьёй» точно передаёт οὐ βούλομαι εἶναι κριτής. «В таких делах» адекватно отсылает ко всему перечисленному в τούτων.'
  naturalness: Русский текст звучит современно и литературно, с уместным официально-судебным оттенком. Формула «споры насчёт слова» несколько необычна по самой намеренно неопределённой природе оригинала, но понятна и не требует искусственной конкретизации. «Разбирайтесь сами» естественно передаёт резкий отказ Галлиона вмешиваться.
  terminology: «Судья», «закон», «имена» и «слово» выбраны последовательно и без конфессионального истолкования. Сноска корректно отмечает возможные более конкретные значения λόγος («весть», «учение»), не превращая их в основной смысл. Маркер сноски поставлен непосредственно после «слова» и привязан верно.
