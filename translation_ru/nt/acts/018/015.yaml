source:
  edition: SBLGNT
  text: εἰ δὲ ⸀ζητήματά ἐστιν περὶ λόγου καὶ ὀνομάτων καὶ νόμου τοῦ καθ’ ὑμᾶς, ὄψεσθε αὐτοί· ⸀κριτὴς ἐγὼ τούτων οὐ βούλομαι εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/015.yaml
  text: But if these are questions about a word and names and your own law[a], you yourselves will see to it; I do not want to be a judge of these things.
translation:
  language: ru
  text: Но если речь идёт о спорах насчёт слова[a], имён и вашего закона, разбирайтесь сами. Я не хочу быть судьёй в таких делах».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вести», «учения». Греческое слово λόγος имеет широкое значение и здесь может относиться к спорному учению или формулировкам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματα
  choice: споры
  rationale: Слово обозначает вопросы или дела, ставшие предметом разбирательства. «Споры» естественно звучит в судебном контексте и не обязательно подразумевает враждебность.
- source_word: περὶ λόγου
  choice: насчёт слова
  rationale: Буквальная формулировка сохраняет широту λόγος, которое здесь может означать слово, учение, весть или предмет рассуждения; конкретизация вынесена в сноску.
- source_word: ὀνομάτων
  choice: имён
  rationale: Прямой эквивалент сохраняет неопределённость относительно того, о каких именно именах, названиях или титулах идёт речь.
- source_word: νόμου τοῦ καθ’ ὑμᾶς
  choice: вашего закона
  rationale: Передаёт отстранённое указание Галлиона на закон, относящийся к самим обвинителям, а не к римской юрисдикции.
- source_word: ὄψεσθε αὐτοί
  choice: разбирайтесь сами
  rationale: 'Будущее среднего залога здесь имеет идиоматический повелительный оттенок: самим заняться этим делом. Русская форма естественно передаёт также усиление αὐτοί.'
- source_word: κριτής
  choice: судьёй
  rationale: Соответствует судебной обстановке и прямому отказу Галлиона выступать в роли судьи.
- source_word: τούτων
  choice: в таких делах
  rationale: Естественно отсылает к только что перечисленным спорным вопросам, не сужая их содержания.
- source_word: οὐ βούλομαι εἶναι
  choice: не хочу быть
  rationale: Прямо и естественно передаёт выражение личного нежелания или отказа без усиления до специальной юридической формулы.
theological_decisions:
- issue: Объём значения λόγος в отказе Галлиона
  choice: «слово» с пояснительной сноской
  alternative: «весть», «учение» или «доктрина»
  rationale: Контекст допускает спор о формулировке, учении или вести, однако сам текст не уточняет значение λόγος. Основной перевод сохраняет эту неоднозначность и не навязывает конкретного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно официальным судебным оттенком. «Разбирайтесь сами» естественно передаёт резкий, отстранённый ответ должностного лица; конструкция остаётся понятной широкому читателю.
