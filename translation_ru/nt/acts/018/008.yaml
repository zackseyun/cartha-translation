  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Κρίσπος δὲ ὁ ἀρχισυνάγωγος ἐπίστευσεν τῷ κυρίῳ σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ, καὶ πολλοὶ τῶν Κορινθίων ἀκούοντες ἐπίστευον καὶ ἐβαπτίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/008.yaml
  text: But Crispus[a], the synagogue ruler, believed in the Lord together with his whole household, and many of the Corinthians, hearing, were believing and were being baptized.
translation:
  language: ru
  text: Крисп же, начальник синагоги, уверовал в Господа вместе со всем своим домом. И многие из коринфян, слушая, приходили к вере и принимали крещение.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «слушая, веровали и принимали крещение». Имперфекты греческих глаголов изображают отклик многих людей как разворачивавшийся процесс.'
    reason: Передаёт возможную более близкую к форме оригинала формулировку и поясняет аспектуальное значение имперфектов, не навязывая конкретного истолкования их длительности или повторяемости.
lexical_decisions:
- source_word: Κρίσπος
  choice: Крисп
  rationale: Традиционная и естественная русская передача греческого личного имени.
- source_word: ἀρχισυνάγωγος
  choice: начальник синагоги
  rationale: Обозначает руководящее должностное лицо синагоги; выражение понятно современному русскому читателю и не уточняет сверх текста характер его полномочий.
- source_word: ἐπίστευσεν τῷ κυρίῳ
  choice: уверовал в Господа
  rationale: Аорист передаёт совершившийся отклик Криспа; русский глагол «уверовал» естественно сочетается с «в Господа». Титул κύριος сохранён без поясняющего добавления «Иисуса».
- source_word: σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: вместе со всем своим домом
  rationale: «Дом» в библейском повествовательном регистре естественно обозначает семью и домочадцев и сохраняет собирательность οἶκος.
- source_word: πολλοὶ τῶν Κορινθίων
  choice: многие коринфяне
  rationale: Идиоматическая русская передача партитивного выражения без изменения его смысла.
- source_word: ἀκούοντες
  choice: слушая
  rationale: Причастие настоящего времени изображает слушание как сопутствующее обстоятельство; объект, как и в греческом тексте, остаётся подразумеваемым.
- source_word: ἐπίστευον
  choice: уверовали
  rationale: В русском простое прошедшее естественнее буквального «уверовали́вали» и в сочетании с множественным субъектом допускает последовательное, разворачивающееся обращение людей; аспектуальный оттенок пояснён в сноске.
- source_word: ἐβαπτίζοντο
  choice: принимали крещение
  rationale: Передаёт пассивную направленность действия и повторяющийся процесс среди многих коринфян естественнее, чем тяжеловесное «были крещаемы».
theological_decisions:
- issue: Объём утверждения о вере всего дома Криспа
  choice: Сохранить собирательную формулировку «вместе со всем своим домом», не уточняя способ участия каждого домочадца.
  alternative: Явно сказать, что каждый член дома лично уверовал, либо истолковать фразу исключительно как корпоративное описание.
  rationale: Греческий текст не раскрывает, как именно вера относилась к каждому отдельному члену дома; перевод не должен предрешать связанные с этим конфессиональные вопросы.
- issue: К кому относится титул «Господь»
  choice: Перевести κύριος как «Господь» без добавления имени Иисуса.
  alternative: «Господь Иисус».
  rationale: В контексте Деяний подразумевается Иисус, однако в данном стихе греческий текст содержит только титул κύριος.
- issue: Связь веры и крещения коринфян
  choice: Передать последовательность без добавления богословского объяснения причинной или спасительной роли крещения.
  alternative: Пояснить крещение как условие, следствие или знак спасения.
  rationale: Стих сообщает, что люди слушали, уверовали и принимали крещение, но сам по себе не формулирует систематического учения об отношении этих действий.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. «Крисп», «Господь» и «дом» сохраняют привычную библейскую лексику; синтаксис разделён на два предложения ради ясности. Сноска отмечена в основном тексте как [a].
