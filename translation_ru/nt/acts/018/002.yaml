  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ εὑρών τινα Ἰουδαῖον ὀνόματι Ἀκύλαν, Ποντικὸν τῷ γένει, προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ διὰ τὸ ⸀διατεταχέναι Κλαύδιον χωρίζεσθαι πάντας τοὺς Ἰουδαίους ⸀ἀπὸ τῆς Ῥώμης, προσῆλθεν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/002.yaml
  text: And he found a Jew named Aquila[a], a native of Pontus, who had recently come from Italy with Priscilla his wife because Claudius had ordered all the Jews to leave Rome; and he went to them.
translation:
  language: ru
  text: Он нашёл некоего иудея по имени Акила, родом из Понта, который незадолго до того прибыл из Италии вместе со своей женой Прискиллой, потому что Клавдий приказал всем иудеям покинуть Рим[a]. Павел пришёл к ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «приказал изгнать всех иудеев из Рима». Греческий текст буквально говорит о том, чтобы все иудеи удалились от Рима; основной текст передаёт это естественным выражением «покинуть Рим».'
    reason: 'Лексическая альтернатива: «изгнать» сильнее, чем нейтральное выражение об удалении от Рима, и потому не вводится в основной текст.'
lexical_decisions:
- source_word: εὑρών
  choice: нашёл
  rationale: Аористное причастие вводит действие, предшествующее основному; прямое «нашёл» естественно передаёт повествовательную последовательность.
- source_word: τινα Ἰουδαῖον
  choice: одного иудея
  rationale: Неопределённое τις указывает на отдельного человека; «одного иудея» естественно вводит нового участника повествования.
- source_word: ὀνόματι Ἀκύλαν
  choice: по имени Акила
  rationale: Стандартный и естественный русский оборот для представления имени.
- source_word: Ποντικὸν τῷ γένει
  choice: родом из Понта
  rationale: Оборот обозначает происхождение; выбранный вариант ясен современному читателю и сохраняет географическую отсылку.
- source_word: προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας
  choice: который незадолго до того прибыл из Италии
  rationale: Перфектное причастие указывает на недавнее прибытие, предшествующее встрече; «незадолго до того» ясно передаёт временное соотношение.
- source_word: καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ
  choice: вместе со своей женой Прискиллой
  rationale: По смыслу Прискилла сопровождала Акилу при прибытии из Италии; русский оборот естественно выражает эту синтаксическую связь.
- source_word: διὰ τὸ διατεταχέναι Κλαύδιον
  choice: потому что Клавдий приказал
  rationale: διά с артиклевым инфинитивом выражает причину, а διατάσσω — официальное распоряжение.
- source_word: χωρίζεσθαι πάντας τοὺς Ἰουδαίους ἀπὸ τῆς Ῥώμης
  choice: всем иудеям покинуть Рим
  rationale: Греческое выражение буквально говорит об отделении или удалении от Рима. «Покинуть Рим» естественно передаёт требуемый результат, не усиливая формулировку до прямого «изгнать».
- source_word: προσῆλθεν αὐτοῖς
  choice: Павел пришёл к ним
  rationale: Глагол означает приближение или приход к кому-либо. Имя «Павел», восстановленное из контекста, устраняет неясность русского местоимения после упоминания Клавдия.
theological_decisions:
- issue: Передача Ἰουδαῖον / Ἰουδαίους
  choice: иудей / иудеи
  alternative: житель Иудеи / жители Иудеи
  rationale: В данном контексте речь идёт об этнорелигиозной общности евреев в Риме, а не только о выходцах из географической Иудеи.
- issue: Степень принуждения в приказе Клавдия
  choice: приказал всем иудеям покинуть Рим
  alternative: приказал изгнать всех иудеев из Рима
  rationale: Форма χωρίζεσθαι выражает отделение или удаление от Рима, но сама по себе не требует более сильного пассивного значения «быть изгнанными»; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинный. Синтаксис слегка разгружен разделением длинного греческого периода на два предложения. Имя «Павел» во втором предложении восстановлено из ближайшего контекста ради однозначности, поскольку русское «он» могло бы ошибочно отсылать к Клавдию.
