  text: διελέγετο δὲ ἐν τῇ συναγωγῇ κατὰ πᾶν σάββατον, ἔπειθέν τε Ἰουδαίους καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/004.yaml
  text: And he was reasoning in the synagogue every Sabbath and persuading Jews and Greeks[a][b][c].
translation:
  language: ru
  text: И каждую субботу он рассуждал в синагоге[a] и убеждал[b] иудеев и греков[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беседовал», «обсуждал» или «вёл спор». Греческий глагол может обозначать аргументированный диалог или спор.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «старался убедить». Форма глагола подчёркивает продолжавшееся действие, не обязательно его успешный результат.'
    reason: lexical_alternative
  - marker: c
    text: То есть, вероятно, греков, связанных с синагогой; некоторые понимают это слово шире — как «язычников».
    reason: alternative_reading
lexical_decisions:
- source_word: διελέγετο
  choice: рассуждал
  rationale: Имперфект передаёт продолжавшееся или повторявшееся действие, а глагол обозначает аргументированное обсуждение, нередко в форме диалога. «Рассуждал» сохраняет интеллектуально-доказательный оттенок и естественно сочетается с последующим «убеждал».
- source_word: δὲ
  choice: И
  rationale: Здесь частица служит мягкой повествовательной связкой, а не выражает сильное противопоставление.
- source_word: ἐν τῇ συναγωγῇ
  choice: в синагоге
  rationale: Прямое локативное значение предлога ἐν с дательным падежом.
- source_word: κατὰ πᾶν σάββατον
  choice: каждую субботу
  rationale: Передаёт распределительное значение κατά с πᾶν и повторяемость действия.
- source_word: ἔπειθέν
  choice: убеждал
  rationale: Русский несовершенный вид естественно передаёт продолжавшуюся деятельность, не утверждая, что убеждение непременно достигло результата.
- source_word: τε
  choice: и
  rationale: Частица соединяет действие убеждения с предшествующим действием; простое «и» звучит естественно по-русски.
- source_word: Ἰουδαίους
  choice: иудеев
  rationale: В данном контексте слово обозначает иудеев как этнорелигиозную группу; это традиционное и точное библейское обозначение по-русски.
- source_word: Ἕλληνας
  choice: греков
  rationale: Сохраняет прямое лексическое значение и не сужает его до явно не названной в тексте категории боящихся Бога.
theological_decisions:
- issue: Кого обозначает Ἕλληνας в контексте синагоги
  choice: греков
  alternative: язычников; богобоязненных греков
  rationale: Сам стих называет эту группу «греками». Вероятно, речь идёт о связанных с синагогой неиудеях, однако текст не определяет их точнее, поэтому перевод сохраняет исходную неоднозначность.
- issue: Результативность глагола ἔπειθέν
  choice: убеждал
  alternative: старался убедить
  rationale: Имперфект изображает продолжавшееся или повторявшееся действие, но сам по себе не требует явно добавлять идею неудачной попытки. Несовершенный вид русского глагола сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным библейским звучанием. Порядок слов делает повторяемость действия заметной, а несовершенные виды «рассуждал» и «убеждал» передают длительно-повторный характер греческих имперфектов.
