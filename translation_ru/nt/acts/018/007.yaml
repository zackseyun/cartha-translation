base_translation:
  language: en
  yaml_path: translation/nt/acts/018/007.yaml
  text: And after leaving there[a], he entered the house of a man named Titius Justus, who worshiped God[b], whose house was next to the synagogue.
translation:
  language: ru
  text: И, уйдя оттуда, он вошёл в дом человека по имени Титий Иуст, который поклонялся Богу[a]. Его дом примыкал к синагоге[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который боялся Бога» или «почитал Бога». Греческое выражение может обозначать человека, преданного Богу Израиля.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «находился рядом с синагогой»; греческое слово может означать, что дом непосредственно граничил с ней.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: уйдя оттуда
  rationale: Естественно передаёт предшествующее главному действию удаление Павла из прежнего места и сохраняет значение наречия ἐκεῖθεν — «оттуда».
- source_word: εἰσῆλθεν εἰς οἰκίαν
  choice: вошёл в дом
  rationale: Прямо и естественно передаёт движение внутрь дома; выбор «дом», а не «жилище», важен также для последующего указания на его расположение.
- source_word: τινὸς ὀνόματι Τιτίου Ἰούστου
  choice: человека по имени Титий Иуст
  rationale: Современная русская конструкция передаёт неопределённое τινός без тяжеловесного «некоего»; имена транслитерированы с греческой формы.
- source_word: σεβομένου τὸν θεόν
  choice: который поклонялся Богу
  rationale: Передаёт религиозную преданность Богу Израиля описательно, не превращая причастие в жёсткий социорелигиозный термин.
- source_word: οὗ ἡ οἰκία ἦν συνομοροῦσα τῇ συναγωγῇ
  choice: Его дом примыкал к синагоге
  rationale: Разделение длинной греческой относительной конструкции на два предложения звучит естественно по-русски. «Примыкал» точно выражает смежность или общую границу, обозначенную συνομοροῦσα.
theological_decisions:
- issue: Характеристика Тития Иуста выражением σεβόμενος τὸν θεόν
  choice: который поклонялся Богу
  alternative: который боялся Бога; богобоязненный
  rationale: Основной текст сохраняет описательный характер греческого выражения и не утверждает более узкую формальную принадлежность к особой группе; возможная культурно-религиозная окраска отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом и умеренно торжественным библейским регистром. Длинная относительная конструкция оригинала разделена на два предложения ради естественности и устранения двусмысленности местоименной связи.
