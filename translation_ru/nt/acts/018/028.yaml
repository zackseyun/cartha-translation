  text: εὐτόνως γὰρ τοῖς Ἰουδαίοις διακατηλέγχετο δημοσίᾳ ἐπιδεικνὺς διὰ τῶν γραφῶν εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/028.yaml
  text: For he powerfully refuted the Jews in public[b][a], demonstrating through the Scriptures that Jesus is the Messiah.
translation:
  language: ru
  text: Ведь он убедительно опровергал иудеев публично, доказывая на основании Писаний, что Иисус — Мессия.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что Мессия — это Иисус». Греческую инфинитивную конструкцию можно передать в обоих порядках.'
    reason: lexical_alternative
  - marker: b
    text: Греч. «Христос»; здесь это слово передано как «Мессия», поскольку оно употреблено как титул.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐτόνως
  choice: убедительно
  rationale: Наречие передаёт силу и действенность аргументации; «убедительно» естественно по-русски и хорошо сочетается с доказательством по Писаниям.
- source_word: διακατηλέγχετο
  choice: опровергал
  rationale: Глагол обозначает основательное публичное опровержение доводов оппонентов; несовершенный вид передаёт продолженный или повторявшийся характер действия.
- source_word: τοῖς Ἰουδαίοις
  choice: иудеев
  rationale: Прямое обозначение участников спора; в данном контексте речь идёт об иудейских собеседниках, а не обо всём народе без исключения.
- source_word: δημοσίᾳ
  choice: перед всеми
  rationale: Передаёт публичный характер спора естественным современным русским выражением.
- source_word: ἐπιδεικνὺς
  choice: доказывая
  rationale: 'Причастие указывает, каким способом совершалось опровержение: посредством аргументированного доказательства.'
- source_word: διὰ τῶν γραφῶν
  choice: на основании Писаний
  rationale: διά с родительным обозначает средство; русское выражение показывает, что Писания служили основой доказательства.
- source_word: τὸν χριστὸν
  choice: Мессия
  rationale: Здесь χριστός функционирует как титул обещанного Помазанника и помещён в иудейский контекст рассуждения по Писаниям.
- source_word: Ἰησοῦν
  choice: Иисус
  rationale: Традиционная русская форма имени Ἰησοῦς.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: что Иисус — Мессия
  rationale: Естественный русский порядок слов; греческая конструкция допускает также смысловое оформление «что Мессия — это Иисус».
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В этом утверждении слово выступает как титул и обозначает обещанного в Писаниях Помазанника; «Мессия» яснее сохраняет эту функцию.
- issue: Синтаксическое соотношение Ἰησοῦν и τὸν χριστόν
  choice: что Иисус — Мессия
  alternative: что Мессия — это Иисус
  rationale: В винительном с инфинитивом обе именные формы допускают такое распределение темы и сказуемого; основной текст использует наиболее естественную русскую формулировку, а подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Перед всеми» избегает канцелярского оттенка слова «публично», а «убедительно опровергал» сохраняет как энергичность, так и доказательную силу исходного выражения.
