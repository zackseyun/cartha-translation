    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ ὁμότεχνον εἶναι
  choice: поскольку он владел тем же ремеслом
  rationale: Оборот с διά и субстантивированным инфинитивом выражает причину, а ὁμότεχνος указывает на общее ремесло. Формулировка естественна по-русски и не называет конкретное ремесло раньше самого Луки.
- source_word: ἔμενεν παρ’ αὐτοῖς
  choice: остался у них
  rationale: μένω означает «оставаться, пребывать», а παρά с дательным здесь указывает на пребывание у Акилы и Прискиллы, вероятно в их доме.
- source_word: ἠργάζετο
  choice: работал вместе с ними
  rationale: ἐργάζομαι обозначает труд, здесь — ремесленную работу. Слова «вместе с ними» естественно проясняют подразумеваемую совместную работу в контексте общего ремесла, не меняя смысла.
- source_word: σκηνοποιοὶ
  choice: изготовителями палаток
  rationale: Основное и традиционное значение — мастера, изготовлявшие палатки. Описательное русское соответствие понятнее обычному читателю, чем редкое «палаточники»; более широкая возможность ремесла сохранена в сноске.
- source_word: τῇ τέχνῃ
  choice: по ремеслу
  rationale: τέχνη означает ремесло или профессию; дательный падеж здесь указывает на род занятий. «По ремеслу» сохраняет эту характеристику и перекличку с ὁμότεχνος.
