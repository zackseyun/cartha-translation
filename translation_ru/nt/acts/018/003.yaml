  yaml_path: translation/nt/acts/018/003.yaml
  text: And because he was of the same trade[a], he stayed with them and worked, for they were tentmakers by trade.
translation:
  language: ru
  text: 'И поскольку он был того же ремесла, он остался у них и работал: ведь по ремеслу они были изготовителями палаток[a].'
  philosophy: optimal-equivalence
  footnotes:
