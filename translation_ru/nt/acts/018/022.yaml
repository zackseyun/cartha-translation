id: ACT.18.22
reference: Acts 18:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ κατελθὼν εἰς Καισάρειαν, ἀναβὰς καὶ ἀσπασάμενος τὴν ἐκκλησίαν, κατέβη εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/022.yaml
  text: And after going down to Caesarea[a], he went up and greeted the church, then went down to Antioch.
translation:
  language: ru
  text: Спустившись в Кесарию[a], он поднялся, приветствовал церковь, а затем спустился в Антиохию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вероятно, далее имеется в виду церковь в Иерусалиме. Во многих переводах Иерусалим назван прямо, однако в греческом тексте его название отсутствует.
    reason: alternative_reading
lexical_decisions:
- source_word: κατελθὼν
  choice: спустившись
  rationale: Аористное причастие обозначает действие, предшествующее основному глаголу, и сохраняет характерную для Луки топографическую направленность движения.
- source_word: Καισάρειαν
  choice: Кесарию
  rationale: Традиционная русская форма названия; из контекста имеется в виду приморская Кесария.
- source_word: ἀναβὰς
  choice: он поднялся
  rationale: Сохраняет направление движения, не добавляя не названный в греческом тексте Иерусалим.
- source_word: ἀσπασάμενος
  choice: приветствовал
  rationale: Прямое и естественное соответствие глаголу со значением приветствия; менее интерпретативно, чем «посетил».
- source_word: τὴν ἐκκλησίαν
  choice: церковь
  rationale: Естественное в Деяниях обозначение христианской общины; определённость передана по контексту.
- source_word: κατέβη
  choice: спустился
  rationale: Передаёт направительное и топографическое значение глагола и поддерживает словесную связь с предыдущими обозначениями движения.
- source_word: Ἀντιόχειαν
  choice: Антиохию
  rationale: Традиционная русская форма названия; в данном контексте речь идёт об Антиохии Сирийской, но уточнение в основном тексте не требуется.
theological_decisions:
- issue: Следует ли прямо назвать Иерусалим целью подъёма
  choice: Оставить цель движения не названной в основном тексте
  alternative: «поднялся в Иерусалим»
  rationale: Последовательность маршрута и упоминание церкви позволяют предположить Иерусалим, однако в греческом тексте он прямо не назван. Перевод сохраняет эту имплицитность, не превращая вероятное толкование в текст.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным повествовательным синтаксисом. Повтор глагола «спустился» намеренно сохраняет топографическую лексику Луки; «поднялся» оставлено без дополнения ради верности неоднозначности оригинала.
