translation_notes:
  register: Современный литературный русский язык, сдержанный судебно-повествовательный регистр. Синтаксический ряд с повтором «ни» сохраняет структуру отрицания оригинала; формулировки не приписывают толпе насилие, которого греческий текст прямо не утверждает.
