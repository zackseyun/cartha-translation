  yaml_path: translation/nt/acts/024/012.yaml
  text: And they found me neither in the temple arguing with anyone nor stirring up a crowd[b][a], neither in the synagogues nor throughout the city.
translation:
  language: ru
  text: И ни в храме они не застали меня спорящим с кем-либо[a] или собирающим толпу[b], ни в синагогах, ни где бы то ни было в городе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведущим беседу с кем-либо»; «ведущим с кем-либо прения». Греческий глагол может обозначать беседу, рассуждение или спор.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «возбуждающим толпу». Греческое выражение может означать создание скопления людей или возбуждение толпы, но не обязательно подразумевает бунт.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερῷ
  choice: храме
  rationale: В Деяниях ἱερόν обычно обозначает весь храмовый комплекс, а естественное русское «храм» сохраняет этот смысл без неоправданного сужения до святилища.
- source_word: εὗρόν με
  choice: они не застали меня
  rationale: В сочетании с οὔτε глагол передаёт отсутствие наблюдаемого действия; «не застали меня» естественно звучит в контексте судебной защиты.
- source_word: πρός τινα διαλεγόμενον
  choice: спорящим с кем-либо
  rationale: διαλέγομαι может означать беседовать, рассуждать или спорить; контекст обвинения в подстрекательстве допускает более полемический оттенок, но неоднозначность отмечена в сноске.
- source_word: ἐπίστασιν ποιοῦντα ὄχλου
  choice: собирающим вокруг себя толпу
  rationale: Выражение описывает создание скопления или возбуждение толпы, не обязательно бунт; выбранная формулировка ясна и не усиливает степень беспорядка.
- source_word: συναγωγαῖς
  choice: синагогах
  rationale: Обычный и точный русский эквивалент для συναγωγή в данном иудейском контексте.
- source_word: κατὰ τὴν πόλιν
  choice: где-либо в городе
  rationale: В сфере действия повторяющегося οὔτε оборот означает, что обвинители нигде в городе не застали Павла за такими действиями; по-русски это естественнее буквального «по всему городу».
