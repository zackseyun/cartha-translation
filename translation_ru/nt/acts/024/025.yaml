source:
  edition: SBLGNT
  text: διαλεγομένου δὲ αὐτοῦ περὶ δικαιοσύνης καὶ ἐγκρατείας καὶ τοῦ κρίματος τοῦ ⸀μέλλοντος ἔμφοβος γενόμενος ὁ Φῆλιξ ἀπεκρίθη· Τὸ νῦν ἔχον πορεύου, καιρὸν δὲ μεταλαβὼν μετακαλέσομαί σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/025.yaml
  text: But as he was discussing righteousness and self-control and the coming judgment, Felix became afraid and answered, “For now, go away. When I get an opportunity, I will summon you.”
translation:
  language: ru
  text: 'Когда же он рассуждал о праведности, самообладании и грядущем суде, Феликс испугался и ответил: «А теперь иди. Когда представится удобный случай, я вызову тебя».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαλεγομένου
  choice: заговорил
  rationale: Передаёт ведение рассуждения или беседы Павлом; в данном контексте естественнее по-русски, чем буквальное «рассуждал».
- source_word: δικαιοσύνης
  choice: праведности
  rationale: Сохраняет широкий нравственный и богословский смысл греческого слова, не сужая его до юридической «справедливости».
- source_word: ἐγκρατείας
  choice: самообладании
  rationale: Современное и понятное обозначение владения собой, сдержанности и контроля над желаниями.
- source_word: τοῦ κρίματος τοῦ μέλλοντος
  choice: грядущем суде
  rationale: Естественно передаёт определённый будущий суд, сохраняя эсхатологический оттенок.
- source_word: ἔμφοβος γενόμενος
  choice: испугался
  rationale: Прямо и естественно передаёт возникновение страха у Феликса.
- source_word: Τὸ νῦν ἔχον
  choice: А теперь
  rationale: Идиоматически передаёт смысл «на данный момент», обозначая прекращение беседы сейчас.
- source_word: καιρὸν μεταλαβών
  choice: Когда представится удобный случай
  rationale: Передаёт получение подходящего времени или возможности без утверждения, что Феликс искренне намеревался её искать.
- source_word: μετακαλέσομαί σε
  choice: я позову тебя
  rationale: Естественный русский эквивалент распоряжения снова вызвать Павла к себе.
theological_decisions:
- issue: Характер грядущего суда
  choice: грядущий суд
  alternative: будущий суд
  rationale: Формулировка сохраняет эсхатологическую весомость исходного выражения, не уточняя ни срок, ни устройство суда.
- issue: Значение δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» лучше сохраняет одновременно нравственную и богословскую широту слова; контекст не требует ограничивать его общественной или судебной справедливостью.
translation_notes:
  register: Современный литературный русский язык; речь ясная и сдержанно торжественная. Синтаксис упрощён ради естественности, при этом последовательность тем и реакция Феликса сохранены.
