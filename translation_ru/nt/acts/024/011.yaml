  text: as you are able to ascertain[a], that it has been no more than twelve days since I went up to Jerusalem to worship,
translation:
  language: ru
  text: Ты можешь удостовериться, что прошло не более двенадцати дней с тех пор, как я отправился в Иерусалим, чтобы поклониться.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δυναμένου σου ἐπιγνῶναι
  choice: ты сам можешь удостовериться
  rationale: Передаёт способность Феликса установить факты в судебном контексте; «сам» естественно подчёркивает возможность личной проверки, не меняя смысла конструкции.
- source_word: οὐ πλείους εἰσίν μοι ἡμέραι δώδεκα
  choice: прошло не больше двенадцати дней
  rationale: Естественно передаёт греческий идиоматический оборот об истекшем времени, сохраняя верхнюю границу периода.
- source_word: ἀφ’ ἧς
  choice: с тех пор, как
  rationale: Ясно обозначает исходную точку двенадцатидневного периода.
- source_word: ἀνέβην
  choice: я поднялся
  rationale: Сохраняет традиционное и географически осмысленное направление движения вверх к Иерусалиму.
- source_word: προσκυνήσων
  choice: чтобы поклониться
  rationale: Передаёт цель движения, выраженную будущим причастием; объект поклонения не добавлен, поскольку в греческом тексте он подразумевается.
- source_word: εἰς Ἰερουσαλήμ
  choice: в Иерусалим
  rationale: Нормальный русский способ обозначить направление к городу.
