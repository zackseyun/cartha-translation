  text: ὁμολογῶ δὲ τοῦτό σοι ὅτι κατὰ τὴν ὁδὸν ἣν λέγουσιν αἵρεσιν οὕτως λατρεύω τῷ πατρῴῳ θεῷ, πιστεύων πᾶσι τοῖς κατὰ τὸν νόμον καὶ ⸂τοῖς ἐν⸃ τοῖς προφήταις γεγραμμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/014.yaml
  text: But I confess this to you[a], that according to the Way, which they call a sect, so I worship the God of our fathers, believing everything written in the Law and in the Prophets[b],
translation:
  language: ru
  text: 'Но я признаю перед тобой вот что: следуя Пути, который они называют сектой[a], я служу Богу наших предков[b] и верю всему, что написано в Законе и в Пророках.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «религиозным течением»; греческое слово может обозначать группу, партию или секту и здесь не обязательно имеет позднейшее значение «ересь».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «отеческому Богу»; то есть Богу, Которому поклонялись предки Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογῶ
  choice: я признаю
  rationale: Передаёт открытое и официальное заявление Павла в судебной обстановке, не создавая обязательного оттенка признания вины.
- source_word: κατὰ τὴν ὁδόν
  choice: следуя Пути
  rationale: Сохраняет историческое название раннего христианского движения «Путь» и естественно передаёт значение соответствия или следования.
- source_word: αἵρεσιν
  choice: сектой
  rationale: В данном контексте слово обозначает религиозную группу или течение; перевод «ересь» внёс бы более поздний специальный догматический смысл.
- source_word: λατρεύω
  choice: служу
  rationale: Передаёт религиозное служение Богу; в сочетании «служу Богу» по-русски естественно выражает поклонение и преданность.
- source_word: τῷ πατρῴῳ θεῷ
  choice: Богу наших предков
  rationale: Естественно передаёт смысл «Богу, почитаемому предками» и подчёркивает заявленную Павлом преемственность с верой Израиля.
- source_word: πιστεύων πᾶσι τοῖς ... γεγραμμένοις
  choice: и верю всему, что написано
  rationale: Причастная конструкция естественно присоединена к основному глаголу, а всеохватность πᾶσι сохранена словом «всему».
- source_word: κατὰ τὸν νόμον καὶ τοῖς ἐν τοῖς προφήταις
  choice: в Законе и у Пророков
  rationale: Сохраняет традиционное обозначение двух частей Писания; русское «у Пророков» естественно относится к написанному в пророческих книгах.
theological_decisions:
- issue: Отношение Павла к иудейской вере и Пути
  choice: Путь представлен как образ служения тому же Богу предков при сохранении веры в Закон и Пророков.
  alternative: Представить христианство как отдельную религию, противопоставленную иудаизму.
  rationale: Греческий текст прямо связывает следование Пути со служением Богу предков и верой во всё написанное в Законе и у Пророков; перевод сохраняет эту преемственность и присущее контексту напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством судебной речи. «Путь», «Закон» и «Пророки» оформлены как историко-религиозные наименования. Синтаксис упрощён до естественной русской конструкции без устранения смысловой связи между Путём и верностью Богу Израиля.
