base_translation:
  language: en
  yaml_path: translation/nt/acts/024/023.yaml
  text: And he ordered the centurion to keep him in custody[a], yet to let him have some freedom[b], and to prevent none of his own people from attending to his needs.
translation:
  language: ru
  text: И он приказал сотнику держать Павла под стражей, но предоставить ему некоторую свободу[a] и никому из его людей[b] не препятствовать помогать ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дать ему некоторое облегчение» или «некоторое послабление». Греческое слово может означать облегчение, послабление или некоторую свободу от строгого заключения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из его [людей]». Вероятно, имеются в виду люди Павла — его спутники, друзья или сторонники, которым разрешалось помогать ему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαταξάμενος
  choice: приказал
  rationale: Аористное причастие естественно передаётся в русском повествовании личной формой, выражающей распоряжение Феликса.
- source_word: τῷ ἑκατοντάρχῃ
  choice: сотнику
  rationale: Традиционное и точное русское обозначение римского военного чина.
- source_word: τηρεῖσθαι αὐτόν
  choice: держать Павла под стражей
  rationale: В данном судебно-тюремном контексте τηρέω означает содержание под охраной. Имя «Павел» проясняет референт местоимения без изменения смысла.
- source_word: ἔχειν τε ἄνεσιν
  choice: предоставить ему некоторое послабление
  rationale: ἄνεσις обозначает облегчение, послабление или ослабление ограничений, но не полное освобождение; «некоторое послабление» сохраняет эту широту и меру.
- source_word: τε ... καὶ
  choice: но ... и
  rationale: Частицы координируют два распоряжения; «но» естественно передаёт контраст между содержанием под стражей и смягчённым режимом, не превращая его в жёсткое логическое противопоставление.
- source_word: μηδένα κωλύειν
  choice: никому ... не мешать
  rationale: Передаёт универсальное отрицание и значение κωλύω — препятствовать или не допускать.
- source_word: τῶν ἰδίων αὐτοῦ
  choice: из его близких
  rationale: Субстантивированное τῶν ἰδίων буквально указывает на «его [людей]» и может охватывать друзей, спутников и сторонников, не обязательно родственников.
- source_word: ὑπηρετεῖν αὐτῷ
  choice: служить ему
  rationale: Сохраняет широкое значение практической помощи и заботы, не добавляя отсутствующего в тексте уточнения о конкретных нуждах.
