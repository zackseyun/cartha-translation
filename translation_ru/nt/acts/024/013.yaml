lexical_decisions:
- source_word: οὐδὲ
  choice: И они не могут
  rationale: Отрицательный союз продолжает предыдущую мысль Павловой защиты; в современном русском естественно передаётся сочетанием «И ... не».
- source_word: παραστῆσαι
  choice: доказать
  rationale: В судебном контексте глагол обозначает предъявление или установление оснований обвинения; «доказать» ясно передаёт смысл обоснования обвинений, не исключая буквального оттенка «представить».
- source_word: δύνανταί
  choice: могут
  rationale: Прямо и естественно передаёт значение способности или возможности.
- source_word: σοι
  choice: тебе
  rationale: Сохраняет дательный падеж обращения к Феликсу; судебный контекст позволяет понять, что доказательства должны быть представлены судье.
- source_word: περὶ ὧν
  choice: то, в чём
  rationale: Естественная русская относительная конструкция, относящаяся к предмету обвинений, без добавления отсутствующего в греческом существительного «преступления».
- source_word: νυνὶ
  choice: теперь
  rationale: Передаёт подчёркнутое настоящее время обвинения; «теперь» здесь звучит естественно и сохраняет временной контраст.
- source_word: κατηγοροῦσίν μου
  choice: обвиняют меня
  rationale: Точно передаёт юридический смысл глагола и объект, выраженный родительным местоимением.
