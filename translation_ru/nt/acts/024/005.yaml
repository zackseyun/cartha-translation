id: ACT.24.5
reference: Acts 24:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εὑρόντες γὰρ τὸν ἄνδρα τοῦτον λοιμὸν καὶ κινοῦντα ⸀στάσεις πᾶσι τοῖς Ἰουδαίοις τοῖς κατὰ τὴν οἰκουμένην πρωτοστάτην τε τῆς τῶν Ναζωραίων αἱρέσεως,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/005.yaml
  text: For we have found this man to be a plague, stirring up riots among all the Jews throughout the inhabited world, and also a ringleader of the sect of the Nazarenes,
translation:
  language: ru
  text: 'Мы установили, что этот человек — настоящая чума: он поднимает мятежи среди всех иудеев по всему обитаемому миру и является предводителем секты назареев.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιμόν
  choice: настоящая чума
  rationale: Буквально «чума, зараза»; здесь это резкое обвинительное обозначение опасного для общества человека. Сохранена образность и оскорбительная сила выражения.
- source_word: κινοῦντα στάσεις
  choice: поднимает мятежи
  rationale: στάσεις обозначает волнения, смуты или мятежи; в судебной обвинительной речи «поднимает мятежи» естественно передаёт утверждение о подстрекательстве к общественным беспорядкам.
- source_word: κατὰ τὴν οἰκουμένην
  choice: по всему обитаемому миру
  rationale: Сохранено характерное для эпохи выражение οἰκουμένη, обычно относящееся к известному обитаемому миру, в данном контексте прежде всего к пространству Римской империи.
- source_word: πρωτοστάτην
  choice: предводителем
  rationale: Слово означает стоящего впереди, ведущего человека; в обвинительном контексте — главаря или предводителя. «Предводитель» сохраняет официальный тон без лишней разговорной окраски.
- source_word: αἱρέσεως
  choice: секты
  rationale: В данном контексте αἵρεσις обозначает религиозную группировку или течение, а в устах обвинителя имеет пренебрежительный оттенок; «секта» соответствует судебной риторике стиха.
- source_word: Ναζωραίων
  choice: назареев
  rationale: Передано традиционным русским названием последователей Иисуса Назарянина, употреблённым здесь их противниками.
theological_decisions:
- issue: Характер обвинений против Павла
  choice: Сохранить обвинительную риторику без подтверждения её истинности от лица повествователя
  alternative: Смягчить «чума» и «мятежи» до нейтральных «опасный человек» и «волнения»
  rationale: Это речь обвинителя Тертулла; резкость формулировок важна для повествования, но контекст речи не позволяет принимать их за авторскую оценку Павла.
- issue: Передача αἵρεσις применительно к назареям
  choice: секта
  alternative: течение / направление
  rationale: «Секта» сохраняет уничижительную силу обвинения и не вводит утверждения рассказчика о богословском статусе ранних христиан.
translation_notes:
  register: Современный литературный русский язык с достоинством судебной речи. Фраза звучит как формальное, намеренно резкое обвинение. Союз γάρ передан связью с предшествующей речью через начальное «Мы установили», без отдельного «ибо», которое в изолированном русском стихе звучало бы тяжеловесно.
