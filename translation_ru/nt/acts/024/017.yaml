    rationale: 'В греческом εἰς τὸ ἔθνος μου относится к цели/адресату действия: «моему народу». Хотя ἐλεημοσύνας по смыслу предполагает помощь нуждающимся, исходный текст не оформляет «нуждающихся из моего народа» как именную группу; такая перестройка излишне уточняет синтаксис.'
