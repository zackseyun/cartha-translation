  text: δι’ ἐτῶν δὲ πλειόνων ⸂ἐλεημοσύνας ποιήσων εἰς τὸ ἔθνος μου παρεγενόμην⸃ καὶ προσφοράς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/017.yaml
  text: After several years I came to bring alms to my nation[a], and offerings.
translation:
  language: ru
  text: Спустя несколько лет я прибыл, чтобы оказать благотворительную помощь моему народу и принести приношения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι’ ἐτῶν δὲ πλειόνων
  choice: Спустя несколько лет
  rationale: διά с родительным падежом в данном временном обороте обозначает промежуток, по истечении которого произошло действие. Сравнительная форма πλειόνων здесь идиоматически означает «несколько» или «много»; «несколько» естественно передаёт неопределённо длительный период. Частица δέ имеет слабую связующую силу и не требует подчёркнутого «но».
- source_word: ἐλεημοσύνας
  choice: помощь нуждающимся
  rationale: Существительное обозначает милостыню, благотворительную помощь или пожертвования нуждающимся. Выбранное выражение ясно передаёт смысл современному читателю и избегает возможного понимания «милостыни» как мелкой подачки.
- source_word: ποιήσων
  choice: чтобы передать
  rationale: Будущее причастие выражает цель прибытия. В сочетании с ἐλεημοσύνας глагол ποιέω образует идиоматическое выражение «оказать/дать милостыню»; по-русски в данном контексте естественно «передать помощь».
- source_word: εἰς τὸ ἔθνος μου
  choice: из моего народа
  rationale: ἔθνος здесь относится к еврейскому народу Павла. Предлог εἰς указывает на адресата помощи; конструкция перестроена по-русски как «нуждающимся из моего народа», чтобы ясно показать, кому предназначалась помощь.
- source_word: παρεγενόμην
  choice: я прибыл
  rationale: παραγίνομαι здесь означает прибытие в место, подразумеваемое контекстом. «Прибыл» уместно для сдержанной судебной речи Павла.
- source_word: προσφοράς
  choice: приношения
  rationale: προσφορά обозначает приношения, нередко культовые. «Приношения» сохраняет связь с храмовым контекстом, не уточняя без основания их точный вид.
theological_decisions:
- issue: Характер помощи, принесённой Павлом в Иерусалим
  choice: помощь нуждающимся из моего народа
  alternative: милостыню моему народу; пожертвования для моего народа
  rationale: Греческое слово конкретно указывает на благотворительность, но не определяет устройство сбора или круг получателей подробнее, чем это допускает обычное значение ἐλεημοσύνη. Формулировка передаёт социальный смысл, не придавая ему особого конфессионального значения.
- issue: Характер προσφοράς
  choice: приношения
  alternative: жертвы; жертвенные дары
  rationale: Контекст допускает культовый смысл, однако само слово не уточняет вид приношений. Более широкая передача сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим судебной защитительной речи Павла. Синтаксис слегка перестроен ради естественности и ясности адресата помощи; различие между благотворительной помощью и храмовыми приношениями сохранено.
