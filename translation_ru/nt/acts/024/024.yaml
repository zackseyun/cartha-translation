  text: Μετὰ δὲ ἡμέρας τινὰς παραγενόμενος ὁ Φῆλιξ σὺν Δρουσίλλῃ τῇ ⸀ἰδίᾳ γυναικὶ οὔσῃ Ἰουδαίᾳ μετεπέμψατο τὸν Παῦλον καὶ ἤκουσεν αὐτοῦ περὶ τῆς εἰς Χριστὸν ⸀Ἰησοῦν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/024.yaml
  text: After some days[a], Felix came with Drusilla, his own wife, who was Jewish[b], and sent for Paul and heard him concerning faith in Messiah Jesus.
translation:
  language: ru
  text: Спустя несколько дней Феликс пришёл со своей женой Друзиллой, иудейкой, послал за Павлом и выслушал Павла о вере[a] в Иисуса Мессию[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о доверии». Греческое слово πίστις может означать как веру, так и доверие.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально порядок слов в греческом тексте: «в Мессию Иисуса»; возможно также традиционное: «во Христа Иисуса». Здесь «Мессия» передаёт значение титула Χριστός.'
    reason: translation_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ἡμέρας τινὰς
  choice: Спустя несколько дней
  rationale: Естественно передаёт временное выражение μετά с винительным падежом; частица δέ здесь лишь продолжает повествование и не требует отдельного слова в русском тексте.
- source_word: παραγενόμενος
  choice: пришёл
  rationale: Причастие обозначает прибытие Феликса; форма личного глагола естественна в русском повествовании.
- source_word: σὺν Δρουσίλλῃ τῇ ἰδίᾳ γυναικὶ
  choice: со своей женой Друзиллой
  rationale: Русское возвратное притяжательное «своей» естественно выражает принадлежность и передаёт силу ἰδίᾳ без тяжеловесного «с собственной».
- source_word: οὔσῃ Ἰουδαίᾳ
  choice: иудейкой
  rationale: Кратко и точно обозначает принадлежность Друзиллы к иудейскому народу; приложение сохраняет связь определения именно с ней.
- source_word: μετεπέμψατο
  choice: послал за Павлом
  rationale: Обычное русское соответствие глаголу со значением «послать, чтобы позвать».
- source_word: ἤκουσεν αὐτοῦ περὶ
  choice: выслушал его, когда тот говорил о
  rationale: Греческое сочетание обозначает слушание Павла по определённой теме. Развёрнутая русская конструкция звучит естественнее буквального «слушал его о» и не меняет содержания.
- source_word: πίστεως
  choice: вере
  rationale: В данном сочетании πίστις прежде всего означает веру, направленную на Иисуса; возможный оттенок доверия отмечен в сноске.
- source_word: εἰς Χριστὸν Ἰησοῦν
  choice: в Иисуса Мессию
  rationale: εἰς после πίστις указывает на того, на кого направлена вера. Χριστός передан как титул «Мессия», а русский порядок слов делает выражение ясным и естественным.
theological_decisions:
- issue: Передача Χριστός
  choice: Иисуса Мессию
  alternative: Христа Иисуса; Мессию Иисуса
  rationale: Здесь Χριστός сохраняет смысл титула, поэтому переведено словом «Мессия», а не только традиционной формой «Христос». Порядок имени и титула изменён ради естественного русского выражения, без изменения смысла.
- issue: Смысл τῆς εἰς Χριστὸν Ἰησοῦν πίστεως
  choice: о вере в Иисуса Мессию
  alternative: о доверии Иисусу Мессии
  rationale: Конструкция πίστις с εἰς и винительным падежом наиболее естественно обозначает веру, направленную на Иисуса, а не его собственную верность. Лексический оттенок доверия сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный для широкого круга читателей. Синтаксис слегка развёрнут ради естественной передачи ἤκουσεν αὐτοῦ περὶ; тон повествовательный и сдержанный.
