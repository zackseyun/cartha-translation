  text: Но тысяченачальник Лисий пришёл и с большой силой увёл его из наших рук,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот стих — вместе с концом стиха 6 и началом стиха 8 — отсутствует в наиболее ранних греческих рукописях, включая папирус 74 (III век), Синайский и Ватиканский кодексы (IV век), а также в ранних коптских переводах. Он сохранился в византийской традиции, представленной большинством рукописей, в латинской традиции и в более поздних греческих рукописях. По всей видимости, это раннее редакционное расширение, рассказывающее перед Феликсом о вмешательстве римского военачальника.
    reason: textual_critical
lexical_decisions:
- source_word: παρελθών
  choice: пришёл
  rationale: Аористное причастие от παρέρχομαι передаёт появление Лисия на месте событий; личная форма естественна для современного русского повествования.
- source_word: χιλίαρχος
  choice: тысяченачальник
  rationale: Точный традиционный эквивалент названия римской военной должности; он сохраняет исторический колорит и указывает на высокий ранг командира.
- source_word: μετὰ πολλῆς βίας
  choice: применив большую силу
  rationale: Оборот передаёт физическое принуждение, не добавляя отсутствующей в тексте оценки как злонамеренного насилия.
- source_word: ἐκ τῶν χειρῶν ἡμῶν ἀπήγαγεν
  choice: вырвал его из наших рук
  rationale: Контекстуально естественно передаёт насильственное изъятие Павла; местоимение «его» восполняет подразумеваемое дополнение для ясности по-русски.
