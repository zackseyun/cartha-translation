lexical_decisions:
- source_word: Ἀπεκρίθη τε ὁ Παῦλος
  choice: Павел ответил
  rationale: τε слегка продолжает повествование и естественно передаётся порядком слов и связью с предшествующей временной частью; ἀπεκρίθη — обычное «ответил».
- source_word: νεύσαντος αὐτῷ τοῦ ἡγεμόνος λέγειν
  choice: Когда правитель знаком велел Павлу говорить
  rationale: Генитив абсолютный передан временным придаточным. νεύω обозначает жест или знак, не обязательно именно кивок; формулировка сохраняет физический способ разрешения говорить.
- source_word: ἡγεμόνος
  choice: правитель
  rationale: Термин обозначает римского провинциального правителя; русское «правитель» ясно передаёт должность без более узкой и потенциально неточной титулатуры.
- source_word: Ἐκ πολλῶν ἐτῶν ὄντα σε κριτὴν
  choice: вы уже много лет судите
  rationale: Естественная русская передача продолжительного исполнения судебной функции; настоящее время сохраняет её актуальность в момент речи.
- source_word: τῷ ἔθνει τούτῳ
  choice: этот народ
  rationale: ἔθνος здесь относится к иудейскому народу; «народ» в современном русском звучит естественнее, чем политически окрашенное «нация».
- source_word: ἐπιστάμενος
  choice: Я знаю
  rationale: Причастие передано личной конструкцией, ясной в современной русской речи; причинная связь выражена словами «и потому».
- source_word: εὐθύμως
  choice: охотно
  rationale: Наречие выражает готовность и бодрый настрой; «охотно» естественно в контексте согласия представить защиту, а оттенок уверенности отмечен в сноске.
- source_word: τὰ περὶ ἐμαυτοῦ ἀπολογοῦμαι
  choice: выступаю в свою защиту
  rationale: Передаёт судебный смысл ἀπολογοῦμαι и предмет защиты без тяжеловесного буквального оборота «о том, что касается меня».
