  text: ἢ περὶ μιᾶς ταύτης φωνῆς ἧς ἐκέκραξα ⸂ἐν αὐτοῖς ἑστὼς⸃ ὅτι Περὶ ἀναστάσεως νεκρῶν ἐγὼ κρίνομαι σήμερον ⸀ἐφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/021.yaml
  text: 'or about this one statement that I shouted while standing among them: ‘It is concerning the resurrection of the dead that I am being judged before you today.’[a][b]'
translation:
  language: ru
  text: 'или за это одно высказывание[a], которое я выкрикнул, стоя среди них: «За воскресение мёртвых[b] меня сегодня судят перед вами».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возглас» или «голос»; греческое слово может обозначать как само высказывание, так и голос или возглас, которым оно было произнесено.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «воскресение из мёртвых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: или
  rationale: Сохраняет связь с предыдущей частью защиты Павла и не усиливает значение до «разве только», хотя контекст допускает такой оттенок.
- source_word: μιᾶς ταύτης φωνῆς
  choice: за одно только высказывание
  rationale: Сочетание подчёркивает единичность конкретного произнесённого утверждения. «Высказывание» естественно передаёт здесь содержание речи, а не просто звук голоса.
- source_word: ἐκέκραξα
  choice: я выкрикнул
  rationale: Глагол обозначает громкое публичное произнесение; «выкрикнул» сохраняет силу выражения и подходит к обстановке собрания.
- source_word: ἐν αὐτοῖς ἑστὼς
  choice: стоя среди них
  rationale: Передаёт как обстоятельственное значение причастия, так и пространственный смысл выражения.
- source_word: ἀναστάσεως νεκρῶν
  choice: воскресение мёртвых
  rationale: Это прямой и общепонятный перевод родительной конструкции; он сохраняет общий характер предмета спора и не сужает его только до воскресения Иисуса.
- source_word: κρίνομαι
  choice: меня судят
  rationale: Настоящее страдательное значение передано естественной русской судебной формулировкой без добавления отсутствующих в тексте подробностей.
- source_word: ἐφ’ ὑμῶν
  choice: перед вами
  rationale: В судебном контексте выражение указывает на предстояние перед властью или судом и не утверждает однозначно, что присутствующие сами являются непосредственными исполнителями суда.
- source_word: σήμερον
  choice: сегодня
  rationale: Естественный современный эквивалент временного наречия.
theological_decisions:
- issue: Предмет спорного обвинения
  choice: воскресение мёртвых
  alternative: воскресение Иисуса из мёртвых
  rationale: Греческий текст формулирует предмет спора широко — περὶ ἀναστάσεως νεκρῶν. Перевод не вводит более узкое христологическое уточнение, хотя в более широком контексте Деяний проповедь Павла связана с воскресением Иисуса.
translation_notes:
  register: Современный литературный русский язык с ясной судебной лексикой. Формулировка сохраняет громкость реплики Павла, пространственную деталь и неоднозначность греческих выражений, не перегружая стих архаизмами.
