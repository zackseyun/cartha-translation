  text: συνεπέθεντο δὲ καὶ οἱ Ἰουδαῖοι φάσκοντες ταῦτα οὕτως ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/009.yaml
  text: And the Jews also joined in the charge[a], asserting that these things were so.
translation:
  language: ru
  text: Иудеи тоже поддержали обвинение[a], утверждая, что всё так и есть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иудеи тоже присоединились, утверждая, что всё так и есть».'
    reason: 'Лексическая альтернатива: συνεπέθεντο может быть передано более обобщённо — без прямого дополнения «обвинение».'
lexical_decisions:
- source_word: συνεπέθεντο
  choice: поддержали обвинение
  rationale: В судебном контексте глагол означает присоединение к обвинительному выступлению. Этот вариант передаёт совместное враждебное действие, не создавая впечатления физического нападения.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Слабая повествовательная связка естественно передаётся в русском последовательностью предложений; отдельное «и» перед подлежащим звучало бы тяжеловесно рядом с «тоже».
- source_word: καὶ
  choice: тоже
  rationale: Показывает, что иудеи присоединились к уже прозвучавшим обвинениям.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Прямое и контекстуально уместное обозначение присутствовавшей на слушании группы обвинителей.
- source_word: φάσκοντες
  choice: утверждая
  rationale: Передаёт уверенное заявление и хорошо соответствует судебному контексту.
- source_word: ταῦτα
  choice: всё
  rationale: Естественно отсылает ко всей совокупности только что высказанных обвинений, не сужая референцию до отдельного пункта.
- source_word: οὕτως ἔχειν
  choice: так и есть
  rationale: Современная русская идиома точно передаёт значение «дело обстоит именно так».
theological_decisions: []
