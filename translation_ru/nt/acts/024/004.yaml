  yaml_path: translation/nt/acts/024/004.yaml
  text: But[a], so that I may not delay you any further[b], I beg you to hear us briefly, in your graciousness.
translation:
  language: ru
  text: Но, чтобы не отнимать у тебя больше времени[a], прошу тебя по твоей снисходительности[b] кратко выслушать нас.
  philosophy: optimal-equivalence
