lexical_decisions:
- source_word: ἵνα δὲ μὴ
  choice: Но, чтобы… не
  rationale: Сохраняет мягкий противительный переход δέ и целевую конструкцию ἵνα μή, оставаясь естественным для современного русского языка.
- source_word: ἐπὶ πλεῖόν
  choice: больше
  rationale: В сочетании с последующим выражением передаёт идиоматическое значение «дольше, далее, в большей мере».
- source_word: σε ἐγκόπτω
  choice: отнимать у тебя времени
  rationale: В контексте официального слушания ἐγκόπτω означает мешать или задерживать, занимая время правителя; русское выражение ясно передаёт этот смысл без неуместного оттенка физического задержания.
- source_word: παρακαλῶ
  choice: прошу тебя
  rationale: Передаёт почтительную просьбу в судебной речи; «умоляю» здесь звучало бы чрезмерно эмоционально.
- source_word: ἀκοῦσαί σε ἡμῶν
  choice: выслушать нас
  rationale: 'Отражает юридически уместный смысл глагола ἀκούω с родительным падежом лица: предоставить говорящим возможность изложить дело.'
- source_word: συντόμως
  choice: кратко
  rationale: Сохраняет наречное указание на краткость предстоящего изложения, не уточняя без необходимости, относится ли она прежде всего к речи или ко времени слушания.
- source_word: τῇ σῇ ἐπιεικείᾳ
  choice: проявить снисходительность
  rationale: Естественно передаёт дательный оборот как обращение к справедливой мягкости и терпимости правителя; сохраняет возможный судебный оттенок ἐπιείκεια.
