lexical_decisions:
- source_word: ἐν αἷς
  choice: Во время этого
  rationale: Оборот отсылает к упомянутым ранее действиям или обстоятельствам. Такое выражение естественно по-русски передаёт временно-обстоятельственный смысл, не устраняя формальной неоднозначности, отмеченной в сноске.
- source_word: εὗρόν με
  choice: меня нашли
  rationale: 'Обычное повествовательное значение εὑρίσκω: противники Павла застали или обнаружили его в храме. «Нашли» точно и нейтрально.'
- source_word: ἡγνισμένον
  choice: прошедшим обряд очищения
  rationale: Перфектное страдательное причастие указывает на достигнутое состояние после ритуального очищения. Перевод передаёт культовый смысл и звучит естественнее буквального «очищенным».
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: ἱερόν обозначает храмовый комплекс, а не обязательно внутреннее святилище; традиционное «в храме» здесь достаточно точно.
- source_word: οὐ μετὰ ὄχλου
  choice: без толпы
  rationale: ὄχλος означает толпу или множество людей. Нейтральное «толпа» не привносит более резкого значения «сборище».
- source_word: οὐδὲ μετὰ θορύβου
  choice: и без беспорядков
  rationale: θόρυβος в контексте судебной защиты обозначает общественное волнение, суматоху или беспорядки. «Беспорядки» яснее передаёт обвинительно-правовой контекст, чем буквальное «шум».
