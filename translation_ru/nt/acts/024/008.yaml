  text: παρ’ οὗ δυνήσῃ αὐτὸς ἀνακρίνας περὶ πάντων τούτων ἐπιγνῶναι ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/008.yaml
  text: From him[a], by examining him yourself[b], you will be able to learn about all these things of which we accuse him.
translation:
  language: ru
  text: От него ты сам, допросив его, сможешь узнать обо всём том, в чём мы его обвиняем.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых рукописях перед этими словами говорится, что тысяченачальник Лисий силой забрал Павла и велел обвинителям явиться к Феликсу. В тексте SBLGNT этой фразы нет.
    reason: textual_variant
lexical_decisions:
- source_word: παρ’ οὗ
  choice: От него
  rationale: παρά с родительным падежом обозначает источник сведений; «от него» естественно по-русски и указывает на самого Павла.
- source_word: δυνήσῃ
  choice: сможешь
  rationale: Будущая форма δύναμαι выражает возможность, которая откроется Феликсу при допросе.
- source_word: αὐτὸς
  choice: и сам
  rationale: Эмфатическое местоимение подчёркивает, что Феликс может лично провести допрос и удостовериться в обвинениях.
- source_word: ἀνακρίνας
  choice: допросив его
  rationale: В судебно-следственном контексте ἀνακρίνω означает допрашивать или подвергать разбирательству; «допросив» точно и естественно передаёт этот смысл.
- source_word: περὶ πάντων τούτων
  choice: обо всём том
  rationale: Передаёт значение περί с родительным и собирательно выражает множественное πάντων τούτων в естественном русском синтаксисе.
- source_word: ἐπιγνῶναι
  choice: узнать
  rationale: В данном контексте глагол означает установить или получить знание о фактах; «узнать» понятно и не усиливает значение неоправданно.
- source_word: ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ
  choice: в чём мы его обвиняем
  rationale: Естественная русская конструкция с глаголом «обвинять», сохраняющая юридический смысл и явное «мы» греческого текста.
