  yaml_path: translation/nt/acts/024/022.yaml
  text: But Felix, having a more accurate knowledge about the Way, put them off, saying, “When Lysias the commander comes down, I will decide your case.”
translation:
  language: ru
  text: 'Феликс же, будучи лучше осведомлён о Пути[b], отложил разбирательство[a] и сказал: «Когда прибудет тысяченачальник Лисий, я решу ваше дело[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отсрочил слушание дела»; греческий глагол может означать отсрочку или приостановление судебного разбирательства.'
    reason: lexical_alternative
  - marker: b
    text: «Путь» — раннее обозначение христианского движения.
    reason: cultural_note
  - marker: c
    text: 'Или: «решу вопросы, касающиеся вас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνεβάλετο δὲ αὐτοὺς
  choice: Феликс же… отложил разбирательство
  rationale: Глагол в данном судебном контексте означает отсрочить решение или производство. Хотя αὐτούς буквально указывает на участников дела, по-русски естественнее сказать «отложил разбирательство»; личное дополнение вроде «отложил их» было бы неясным.
- source_word: ἀκριβέστερον εἰδὼς
  choice: лучше зная
  rationale: Сравнительная степень ἀκριβέστερον передана словом «лучше», а причастная конструкция сохранена без тяжеловесного «имея более точные знания».
- source_word: τὰ περὶ τῆς ὁδοῦ
  choice: об этом Пути
  rationale: «Путь» в Деяниях служит ранним обозначением христианского движения. Указательное «этом» естественно в русском контексте и не превращает выражение в пояснительный пересказ.
- source_word: Ὅταν Λυσίας ὁ χιλίαρχος καταβῇ
  choice: Когда прибудет тысяченачальник Лисий
  rationale: Ὅταν с аористом сослагательного наклонения обозначает ожидаемое будущее событие. «Прибудет» естественно передаёт движение к месту действия; «сойдёт» по-русски могло бы ошибочно подразумевать буквальный спуск. «Тысяченачальник» сохраняет исторический военный титул χιλίαρχος.
- source_word: διαγνώσομαι τὰ καθ’ ὑμᾶς
  choice: я решу ваше дело
  rationale: В судебном контексте διαγνώσομαι означает вынести решение после рассмотрения, а τὰ καθ’ ὑμᾶς — относящиеся к сторонам обстоятельства дела. «Решу ваше дело» ясно и идиоматично.
theological_decisions:
- issue: Статус выражения ἡ ὁδός
  choice: Путь с прописной буквы и пояснительной сноской
  alternative: христианское учение / христианское движение
  rationale: Сохранено раннее самоназвание без внесения в основной текст более поздней или истолковывающей терминологии.
translation_notes:
  register: Современный литературный русский язык с умеренно официальной судебной лексикой. Порядок слов слегка перестроен ради ясности причинной связи; историческое обозначение «Путь» сохранено. Все сноски отмечены в основном тексте.
