base_translation:
  language: en
  yaml_path: translation/nt/acts/024/001.yaml
  text: After five days[a], the high priest Ananias came down with some elders and a certain orator named Tertullus, and they brought charges against Paul before the governor.
translation:
  language: ru
  text: Через пять дней первосвященник Анания спустился с несколькими старейшинами и неким оратором[a] по имени Тертулл. Они выдвинули перед правителем обвинения против Павла.
  philosophy: optimal-equivalence
