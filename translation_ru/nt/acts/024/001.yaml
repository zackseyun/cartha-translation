    text: 'Или: «судебным представителем». Греческое слово может означать публичного оратора или представителя, выступающего в суде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ πέντε ἡμέρας
  choice: Через пять дней
  rationale: μετά с винительным обозначает истекший промежуток времени. Частица δέ здесь лишь продолжает повествование и в естественном русском не требует отдельного перевода.
- source_word: κατέβη
  choice: прибыл туда
  rationale: Глагол буквально означает движение вниз. В данном контексте речь идет о прибытии из Иерусалима в Кесарию; «прибыл туда» естественно передает повествовательную перспективу, не добавляя спорной точки отсчета для «пришел/отправился».
- source_word: ὁ ἀρχιερεὺς Ἁνανίας
  choice: первосвященник Анания
  rationale: ἀρχιερεύς обозначает иудейскую должность первосвященника; имя передано в принятой русской библейской форме.
- source_word: μετὰ πρεσβυτέρων τινῶν
  choice: с несколькими старейшинами
  rationale: πρεσβύτεροι здесь — иудейские руководители, а τινῶν указывает на неопределенную часть группы.
- source_word: ῥήτορος Τερτύλλου τινός
  choice: неким судебным оратором Тертуллом
  rationale: ῥήτωρ может обозначать публичного оратора или выступающего в суде представителя. Определение «судебный» ясно передает юридический контекст, а «неким» отражает τινός.
- source_word: οἵτινες ἐνεφάνισαν τῷ ἡγεμόνι κατὰ τοῦ Παύλου
  choice: Они представили правителю обвинения против Павла
  rationale: В юридическом контексте ἐμφανίζω означает официально заявить дело или обвинение; дательный τῷ ἡγεμόνι обозначает адресата, а κατά с родительным — направленность против Павла.
