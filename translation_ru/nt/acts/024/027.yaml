lexical_decisions:
- source_word: Διετίας δὲ πληρωθείσης
  choice: Когда же исполнилось два года
  rationale: Родительный абсолют передаёт временное обстоятельство; формулировка сохраняет значение завершившегося двухлетнего срока и естественно звучит по-русски.
- source_word: ἔλαβεν διάδοχον ὁ Φῆλιξ Πόρκιον Φῆστον
  choice: преемником Феликса стал Порций Фест
  rationale: Греческое выражение буквально означает, что Феликс «получил преемника»; русская конструкция ясно и естественно передаёт смену должностного лица.
- source_word: θέλων
  choice: Желая
  rationale: Причастие выражает мотив последующего поступка Феликса; деепричастная конструкция сохраняет связь без излишнего истолкования.
- source_word: χάριτα καταθέσθαι τοῖς Ἰουδαίοις
  choice: снискать расположение иудеев
  rationale: Идиома допускает оттенки как оказания услуги, так и приобретения благосклонности. В данном контексте выбран естественный русский оборот, передающий стремление обеспечить себе доброе отношение иудеев; неоднозначность отмечена в сноске.
- source_word: κατέλιπε τὸν Παῦλον δεδεμένον
  choice: оставил Павла под стражей
  rationale: Глагол указывает, что при уходе с должности Феликс сохранил прежнее положение Павла. δεδεμένον буквально значит «связанным», но в контексте содержания узника «под стражей» естественно передаёт продолжающееся заключение, не уточняя вид оков.
