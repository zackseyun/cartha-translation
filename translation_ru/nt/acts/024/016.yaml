id: ACT.24.16
reference: Acts 24:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀καὶ αὐτὸς ἀσκῶ ἀπρόσκοπον συνείδησιν ⸀ἔχειν πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους διὰ παντός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/016.yaml
  text: In view of this[a], I myself also strive always to have a blameless conscience before God and men.
translation:
  language: ru
  text: Поэтому[a] и я сам всегда стараюсь иметь безупречную совесть перед Богом и людьми.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «В этом».'
    reason: Греческое ἐν τούτῳ может выражать вывод из предшествующего высказывания («поэтому») либо указывать на его предмет или сферу («в этом»).
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Поэтому
  rationale: Оборот отсылает к сказанному ранее о надежде и воскресении и в данном контексте естественно выражает основание последующего стремления Павла. Возможное более буквальное понимание сохранено в сноске.
- source_word: καὶ αὐτὸς
  choice: и сам я
  rationale: «И» передаёт добавочное значение καί, а «сам» — умеренное эмфатическое значение αὐτός.
- source_word: ἀσκῶ
  choice: стараюсь
  rationale: Глагол обозначает усердное, постоянное усилие или упражнение; «стараюсь» звучит естественно в сочетании с инфинитивом и не ослабляет нравственной направленности действия.
- source_word: ἀπρόσκοπον συνείδησιν
  choice: чистую совесть
  rationale: В этом сочетании ἀπρόσκοπον говорит о совести, не отмеченной нравственным проступком или поводом к преткновению. «Чистая совесть» — ясное и естественное современное русское выражение.
- source_word: ἔχειν
  choice: иметь
  rationale: Прямо передаёт инфинитив, обозначающий цель постоянных усилий Павла.
- source_word: πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους
  choice: перед Богом и людьми
  rationale: πρός здесь выражает отношение и ответственность. «Перед Богом и людьми» естественно передаёт обе стороны этой ответственности; ἀνθρώπους употреблено обобщённо и по-русски точно передаётся словом «людьми».
- source_word: διὰ παντός
  choice: всегда
  rationale: Оборот обозначает постоянство во времени; «всегда» кратко и ясно передаёт это значение.
theological_decisions:
- issue: Связь нравственного усилия Павла с предшествующей надеждой на воскресение
  choice: Поэтому
  alternative: В этом
  rationale: Контекст допускает как указание на основание («поэтому»), так и более буквальное «в этом». Основной текст естественно выражает логическую связь, а сноска сохраняет языковую неоднозначность.
- issue: Обобщённое значение ἀνθρώπους
  choice: людьми
  alternative: человеческим обществом
  rationale: Форма обозначает людей вообще, а не только мужчин; русское «людьми» точно и без конфессиональной нагрузки передаёт это обобщённое значение.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет достоинство судебной речи Павла, оставаясь понятной обычному читателю. Порядок слов подчёркивает «сам я», а «всегда» естественно связывается с постоянством усилий.
