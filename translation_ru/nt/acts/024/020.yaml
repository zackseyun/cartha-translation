lexical_decisions:
- source_word: ἢ
  choice: Или
  rationale: Вводит альтернативу в защитительной речи Павла и прямо передаёт значение греческого союза.
- source_word: αὐτοὶ οὗτοι
  choice: они сами
  rationale: Сохраняет эмфатическое значение αὐτοί; указательность οὗτοι естественно передаётся местоимением «они» с учётом присутствующих обвинителей.
- source_word: εἰπάτωσαν
  choice: пусть ... скажут
  rationale: Передаёт повелительное наклонение третьего лица и естественно звучит в судебной речи.
- source_word: τί εὗρον
  choice: какое ... нашли
  rationale: В сочетании с существительным единственного числа τί естественно передаётся как «какое», а εὗρον — нейтральным «нашли».
- source_word: ἀδίκημα
  choice: нарушение
  rationale: Сохраняет широкий юридико-нравственный смысл неправомерного поступка, не сужая его до уголовного преступления.
- source_word: στάντος μου
  choice: когда я стоял
  rationale: Естественно передаёт временное значение конструкции с аористным причастием.
- source_word: ἐπὶ τοῦ συνεδρίου
  choice: перед Советом
  rationale: Передаёт явку Павла перед иудейским руководящим советом; прописная буква указывает на конкретный орган.
