base_translation:
  language: en
  yaml_path: translation/nt/acts/024/026.yaml
  text: At the same time he was hoping that money would be given to him by Paul[a]; therefore he also sent for him more often and talked with him.
translation:
  language: ru
  text: В то же время он надеялся, что Павел даст ему денег[a]. Поэтому он также чаще посылал за ним и беседовал с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, конкретнее по смыслу: «надеялся получить от Павла взятку». В греческом тексте: «деньги».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα καὶ
  choice: В то же время
  rationale: Передаёт одновременность с предшествующим повествованием естественным современным русским оборотом.
- source_word: ἐλπίζων
  choice: он надеялся
  rationale: Причастие настоящего времени обозначает продолжающееся ожидание Феликса на фоне повторяющихся встреч.
- source_word: χρήματα
  choice: денег
  rationale: Греческое слово прямо означает «деньги»; взятка подразумевается контекстом, но не названа явно.
- source_word: δοθήσεται αὐτῷ ὑπὸ τοῦ Παύλου
  choice: Павел даст ему
  rationale: Естественная для русского языка активная конструкция точно сохраняет Павла как ожидаемый источник денег и Феликса как получателя.
- source_word: διὸ καὶ
  choice: Поэтому
  rationale: Ясно передаёт причинно-следственную связь; оттенок καί естественно выражен самим продолжением действия и не требует тяжеловесного «также».
- source_word: πυκνότερον
  choice: чаще
  rationale: Точно и идиоматично передаёт сравнительную степень частоты.
- source_word: μεταπεμπόμενος
  choice: посылал за ним
  rationale: Соответствует значению «вызывать, посылать за кем-либо» и подходит к ситуации содержания Павла под стражей.
- source_word: ὡμίλει αὐτῷ
  choice: беседовал с ним
  rationale: Передаёт личное, неоднократное общение, а не официальную речь.
theological_decisions:
- issue: Следует ли прямо назвать ожидаемые деньги взяткой
  choice: В основном тексте оставить «денег», сохранив подразумеваемый коррупционный мотив в примечании
  alternative: «надеялся получить от Павла взятку»
  rationale: Контекст убедительно указывает на взятку, однако χρήματα лексически означает просто «деньги». Такой перевод сохраняет формулировку источника и не устраняет её смысловой подтекст.
