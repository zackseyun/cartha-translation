lexical_decisions:
- source_word: ἐλπίδα ἔχων εἰς τὸν θεόν
  choice: имея надежду на Бога
  rationale: Сохраняет именную конструкцию с причастием и естественно передаёт направленность надежды на Бога.
- source_word: ἣν καὶ αὐτοὶ οὗτοι προσδέχονται
  choice: которую разделяют и они сами
  rationale: В судебном контексте речь идёт об общей с оппонентами надежде. «Разделяют» естественно передаёт признание этой надежды, а примечание сохраняет возможный оттенок ожидания.
- source_word: ἀνάστασιν μέλλειν ἔσεσθαι
  choice: будет воскресение
  rationale: Передаёт будущее событие без неуместного оттенка непосредственной близости, который могло бы создать «вот-вот произойдёт».
- source_word: δικαίων τε καὶ ἀδίκων
  choice: и праведных, и неправедных
  rationale: Парная конструкция ясно сохраняет охват обеих нравственно противопоставленных групп.
theological_decisions:
- issue: Охват воскресения в утверждении Павла
  choice: воскресение и праведных, и неправедных
  alternative: общее воскресение без явного нравственного разграничения
  rationale: Греческий текст прямо называет обе группы; перевод сохраняет это разграничение, не уточняя сроки, порядок или характер последующего суда.
translation_notes:
  register: Современный литературный русский язык; синтаксис достоинственный и понятный. Формулировка «разделяют надежду» звучит естественнее буквального «принимают её» и сохраняет судебно-полемический смысл.
