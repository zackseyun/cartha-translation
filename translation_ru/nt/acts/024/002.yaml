  text: κληθέντος δὲ αὐτοῦ ἤρξατο κατηγορεῖν ὁ Τέρτυλλος λέγων· Πολλῆς εἰρήνης τυγχάνοντες διὰ σοῦ καὶ ⸀διορθωμάτων γινομένων τῷ ἔθνει τούτῳ διὰ τῆς σῆς προνοίας
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/002.yaml
  text: 'And when he had been summoned[a], Tertullus began to accuse him, saying: “Since through you we are enjoying much peace[b], and reforms are being brought to this nation through your foresight,”'
translation:
  language: ru
  text: 'Когда Павла вызвали, Тертулл начал обвинять его, говоря: «Благодаря тебе мы наслаждаемся прочным миром, и благодаря твоей предусмотрительности для этого народа проводятся преобразования[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «улучшения»; «исправительные меры».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθέντος δὲ αὐτοῦ
  choice: Когда Павла вызвали
  rationale: Генитив абсолютный задаёт обстоятельство основного действия. Явное имя устраняет неясность русского местоимения; из контекста вызван именно Павел.
- source_word: ἤρξατο κατηγορεῖν
  choice: начал обвинять
  rationale: Прямо передаёт начинательную конструкцию и юридический смысл κατηγορέω без более узкого толкования «выступать обвинителем».
- source_word: ὁ Τέρτυλλος
  choice: Тертулл
  rationale: Использована традиционная русская передача имени.
- source_word: Πολλῆς εἰρήνης τυγχάνοντες διὰ σοῦ
  choice: Благодаря тебе мы наслаждаемся долгим миром
  rationale: Передаёт лестную риторику речи. В данном контексте πολλῆς при εἰρήνης естественно означает значительную, продолжительную меру мира; «долгим миром» звучит по-русски естественнее, чем «многим миром».
- source_word: διορθωμάτων γινομένων τῷ ἔθνει τούτῳ
  choice: для этого народа проводятся преобразования
  rationale: διορθώματα — исправительные меры, улучшения или реформы; «преобразования» сохраняет широту значения. Настоящее причастие передано продолжающимся административным действием.
- source_word: διὰ τῆς σῆς προνοίας
  choice: благодаря твоей предусмотрительности
  rationale: В политико-административной лести πρόνοια обозначает предусмотрительность и попечение правителя, а не обязательно божественное провидение.
theological_decisions:
- issue: Значение πρόνοια применительно к человеческому правителю
  choice: предусмотрительность
  alternative: провидение; попечение
  rationale: «Предусмотрительность» сохраняет административный смысл и не привносит богословскую идею божественного промысла.
translation_notes:
  register: Современный литературный русский язык с сохранением официально-судебной обстановки и подчеркнуто льстивого тона Тертулла. Реплика продолжается в следующем стихе, поэтому закрывающая кавычка здесь не ставится.
