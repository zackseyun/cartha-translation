- from: 'Когда Павла вызвали, Тертулл начал обвинять его, говоря: «Благодаря тебе мы наслаждаемся долгим миром, и благодаря твоей предусмотрительности для этого народа проводятся преобразования[a].'
  to: 'Когда Павла вызвали, Тертулл начал обвинять его, говоря: «Благодаря тебе мы наслаждаемся прочным миром, и благодаря твоей предусмотрительности для этого народа проводятся преобразования[a].'
