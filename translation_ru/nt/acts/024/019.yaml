  yaml_path: translation/nt/acts/024/019.yaml
  text: But there are some Jews from Asia who ought to have been present before you and to accuse me[b][a], if they had anything against me.
translation:
  language: ru
  text: Но некоторые иудеи из Азии[a] должны были предстать перед тобой и обвинить меня[b], если у них было что-нибудь против меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «Азия» — римская провинция в западной части Малой Азии, а не современная часть света.
    reason: cultural_note
  - marker: b
    text: 'Или: «выдвинуть против меня обвинение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς
  choice: некоторые
  rationale: Передаёт неопределённое множество лиц без излишне официального оттенка.
- source_word: δὲ
  choice: Но
  rationale: Выражает контраст с предшествующими словами Павла.
- source_word: ἀπὸ τῆς Ἀσίας
  choice: из Азии
  rationale: Сохраняет краткую форму оригинала; историко-географическое значение разъяснено в сноске.
- source_word: Ἰουδαῖοι
  choice: иудеи
  rationale: Обычное для библейского повествования обозначение представителей иудейского народа в данном историческом контексте.
- source_word: ἔδει
  choice: должны были
  rationale: Передаёт несовершенный вид глагола необходимости и подразумеваемую неисполненную обязанность.
- source_word: ἐπὶ σοῦ παρεῖναι
  choice: сами предстать перед тобой
  rationale: Естественно передаёт явку перед правителем в судебном контексте; «сами» подчёркивает требуемое личное присутствие обвинителей, подразумеваемое контекстом.
- source_word: κατηγορεῖν
  choice: обвинить меня
  rationale: Кратко и точно передаёт судебное значение глагола.
- source_word: εἴ τι ἔχοιεν πρὸς ἐμέ
  choice: если у них было что-нибудь против меня
  rationale: Сохраняет широкую формулировку и потенциальный оттенок условия, не сужая смысл до формально предъявленного обвинения.
