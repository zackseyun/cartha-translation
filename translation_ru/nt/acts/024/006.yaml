  text: He even tried to defile the temple[a], and we seized him,
translation:
  language: ru
  text: Он даже попытался осквернить храм[a], и мы схватили его,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых рукописях здесь добавлен более пространный текст, в том числе о том, что мы хотели судить Павла по нашему закону, но тысяченачальник Лисий силой забрал его из наших рук.
    reason: textual_variant
lexical_decisions:
- source_word: ὃς
  choice: Он
  rationale: Относительное местоимение относится к Павлу; в данном фрагменте обвинительной речи современный русский естественно возобновляет мысль личным местоимением.
- source_word: καὶ
  choice: даже
  rationale: 'В контексте обвинения καὶ усиливает следующий пункт: Павел «даже» покусился на святость храма.'
- source_word: τὸ ἱερὸν
  choice: храм
  rationale: Ἱερόν обозначает весь храмовый комплекс, а не только внутреннее святилище; общеупотребительное «храм» передаёт смысл естественно и без ненужного усложнения.
- source_word: ἐπείρασεν
  choice: попытался
  rationale: Здесь πειράζω означает предпринять попытку; «попытался» точно и естественно сочетается с инфинитивом.
- source_word: βεβηλῶσαι
  choice: осквернить
  rationale: Βεβηλόω означает лишить священного статуса, профанировать или ритуально осквернить. «Осквернить» понятно современному читателю и уместно в обвинении, связанном со святостью храма.
- source_word: ὃν
  choice: его
  rationale: Местоимение относится к Павлу и в современном русском естественно передаётся объектной формой «его».
- source_word: ἐκρατήσαμεν
  choice: мы схватили
  rationale: Κρατέω здесь означает захватить или удержать. «Схватили» сохраняет физическую и конфликтную окраску лучше, чем более процедурное «арестовали».
theological_decisions:
- issue: Краткое чтение Деян 24:6 и более пространное византийское чтение
  choice: Переведён только текст SBLGNT, заканчивающийся словами «и мы схватили его,»
  alternative: В некоторых рукописях далее говорится, что обвинители хотели судить Павла по своему закону, но тысяченачальник Лисий силой забрал его из их рук; формулировки различаются.
  rationale: Основной текст следует предоставленному греческому источнику и не включает более позднее пространное чтение. Известный рукописный вариант отмечен в сноске, чтобы не скрывать текстологическое расхождение.
translation_notes:
  register: Современный литературный русский язык; обвинительная речь передана кратко и энергично. Запятая в конце сохранена, поскольку стих обрывается внутри продолжающегося высказывания.
