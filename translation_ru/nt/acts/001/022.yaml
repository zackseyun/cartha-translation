source:
  edition: SBLGNT
  text: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου ἕως τῆς ἡμέρας ἧς ἀνελήμφθη ἀφ’ ἡμῶν, μάρτυρα τῆς ἀναστάσεως αὐτοῦ ⸂σὺν ἡμῖν γενέσθαι⸃ ἕνα τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/022.yaml
  text: beginning from the baptism of John until the day when he was taken up from us[b][a], one of these must become a witness with us of his resurrection.
translation:
  language: ru
  text: начиная с крещения Иоанна[a] и до того дня, когда Он был вознесён от нас, — один из них должен вместе с нами стать свидетелем Его воскресения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начиная с того времени, когда крестил Иоанн».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου
  choice: начиная с крещения Иоанна
  rationale: Сохраняет причастную конструкцию и начало временного промежутка. Родительный падеж в греческом допускает сжатое выражение, которое по контексту обозначает крещение, связанное со служением Иоанна.
- source_word: ἕως τῆς ἡμέρας ἧς
  choice: и до того дня, когда
  rationale: Естественно передаёт конечную границу временного промежутка и относительное придаточное.
- source_word: ἀνελήμφθη ἀφ’ ἡμῶν
  choice: Он был вознесён от нас
  rationale: Пассивная форма и направленность вверх сохранены без добавления отсутствующих в стихе слов «на небо»; «от нас» прямо передаёт ἀφ’ ἡμῶν.
- source_word: μάρτυρα τῆς ἀναστάσεως αὐτοῦ
  choice: свидетелем Его воскресения
  rationale: Русская конструкция с родительным падежом точна и естественна, сохраняя связь свидетеля с воскресением Иисуса.
- source_word: σὺν ἡμῖν γενέσθαι
  choice: вместе с нами стать
  rationale: Передаёт как присоединение к существующей группе свидетелей, так и значение инфинитива γενέσθαι.
- source_word: ἕνα τούτων
  choice: один из них
  rationale: Местоименное выражение естественно отсылает к людям, названным в предыдущем стихе, без добавления отсутствующего здесь слова «мужчин».
theological_decisions:
- issue: Необходимость избрания, выраженная управляющим словом из предыдущего стиха
  choice: добавлено «должен»
  alternative: оставить только «стать», сохранив формальную зависимость от стиха 21
  rationale: Инфинитив γενέσθαι синтаксически зависит от δεῖ в стихе 21. В русском тексте отдельного стиха слово «должен» необходимо для ясной и полной передачи этой связи.
- issue: Обозначение вознесения Иисуса
  choice: «Он был вознесён»
  alternative: «Он был взят» или расширенное «Он вознёсся на небо»
  rationale: Выбранная пассивная форма сохраняет грамматику и направленность греческого глагола, не превращая её в активную и не добавляя прямо не названное здесь «небо».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксическая зависимость от предыдущего стиха сделана понятной посредством «должен». Заглавные местоимения «Он», «Его» помогают однозначно обозначить Иисуса в данном фрагменте.
