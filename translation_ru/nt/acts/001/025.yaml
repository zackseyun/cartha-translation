  text: λαβεῖν τὸν ⸀τόπον τῆς διακονίας ταύτης καὶ ἀποστολῆς, ⸀ἀφ’ ἧς παρέβη Ἰούδας πορευθῆναι εἰς τὸν τόπον τὸν ἴδιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/025.yaml
  text: to take the place of this ministry and apostleship[b][a], from which Judas turned aside to go to his own place.
translation:
  language: ru
  text: чтобы занять место в этом служении и апостольстве, от которого Иуда уклонился[a], чтобы уйти в своё место[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отступил от него», «оставил его» или «отпал от него». Греческий глагол может обозначать уклонение от служения или уход из него.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «своё место» может означать просто место, ставшее уделом Иуды, или, в более определённом смысле, подобающее ему место суда.
    reason: alternative_reading
lexical_decisions:
- source_word: λαβεῖν
  choice: занять
  rationale: В сочетании с τόπον инфинитив означает вступить на освободившееся место; «занять место» естественно по-русски и сохраняет образ исходного текста.
- source_word: τὸν τόπον
  choice: место
  rationale: Слово обозначает здесь роль или положение, но буквальное «место» сохраняет перекличку с выражением «в своё место» в конце стиха.
- source_word: τῆς διακονίας ταύτης
  choice: в этом служении
  rationale: διακονία означает служение как порученную деятельность; предложная конструкция естественно сочетается по-русски с «занять место».
- source_word: καὶ ἀποστολῆς
  choice: и апостольстве
  rationale: ἀποστολή в данном контексте обозначает апостольское призвание и полномочия, а не просто миссию.
- source_word: ἀφ’ ἧς
  choice: от которого
  rationale: Относительное местоимение в греческом согласовано с ближайшим существительным ἀποστολῆς; русский перевод относит уход к совокупному апостольскому служению без устранения грамматической связи.
- source_word: παρέβη
  choice: уклонился
  rationale: Глагол передаёт отклонение от порученного служения или оставление его; «уклонился» сохраняет эту широту и не усиливает значение до технического термина «отпал» или общего «согрешил».
- source_word: πορευθῆναι
  choice: чтобы пойти
  rationale: Инфинитив допускает целевое или последующее прочтение. «Чтобы пойти» формально сохраняет конструкцию и её смысловую напряжённость.
- source_word: εἰς τὸν τόπον τὸν ἴδιον
  choice: в своё место
  rationale: Краткая формулировка сохраняет намеренную неопределённость и перекличку с первым упоминанием «места».
theological_decisions:
- issue: Что означает «своё место» применительно к участи Иуды
  choice: Сохранить неопределённое выражение «в своё место» в основном тексте.
  alternative: Явно перевести как место осуждения, ад, смерть или могилу.
  rationale: Греческий текст не называет место прямо. Более определённая формулировка разрешила бы богословскую неоднозначность, которой сам стих не разрешает.
- issue: Характер ухода Иуды из апостольского служения
  choice: Передать παρέβη как «уклонился».
  alternative: «Отступил», «отпал», «оставил» или «согрешил».
  rationale: Выбранное слово выражает отклонение и уход, не превращая его без достаточных оснований ни в узкий термин вероотступничества, ни только в физическое оставление должности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Сохранены повтор слова «место», синтаксическая связь служения и апостольства, а также неоднозначность конечной участи Иуды. Все сноски отмечены в основном тексте.
