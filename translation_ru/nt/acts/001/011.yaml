base_translation:
  language: en
  yaml_path: translation/nt/acts/001/011.yaml
  text: They also said[a], “Men of Galilee, why do you stand looking into heaven? This Jesus, who was taken up from you into heaven, will come in the same way that you saw him going into heaven.”
translation:
  language: ru
  text: 'И они сказали: «Галилеяне, что вы стоите и смотрите на небо? Этот Иисус[a], взятый от вас на небо, придёт так же, как вы видели его уходящим на небо».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в традиционном переводе: «Этот же Иисус» или «Тот же самый Иисус». В греческом тексте сказано «Этот Иисус»; слова со значением «же» или «тот же самый» отсутствуют, и такое усиление является толковательным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Γαλιλαῖοι
  choice: Галилеяне
  rationale: В русском языке самостоятельное обращение «галилеяне» естественно и точно обозначает мужчин из Галилеи; буквальное «мужи галилейские» звучит архаично.
- source_word: τί ἑστήκατε βλέποντες
  choice: что вы стоите и смотрите
  rationale: Передаёт состояние, выраженное перфектом ἑστήκατε, и сопутствующее действие βλέποντες ясным современным русским оборотом.
- source_word: εἰς τὸν οὐρανόν
  choice: на небо
  rationale: Обычный русский оборот как при взгляде вверх, так и при вознесении; слово «небо» сохраняет присущий οὐρανός диапазон между видимым небом и небесной сферой.
- source_word: οὗτος ὁ Ἰησοῦς
  choice: Этот Иисус
  rationale: Прямо передаёт указательное οὗτος, не добавляя отсутствующего в греческом слова со значением «тот же самый».
- source_word: ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν
  choice: взятый от вас на небо
  rationale: Сохраняет пассивную форму и идею удаления от учеников; направление вверх ясно из сочетания «на небо».
- source_word: οὕτως ἐλεύσεται ὃν τρόπον
  choice: придёт так же, как
  rationale: Естественно передаёт сопоставление способа будущего прихода со способом ухода, не утяжеляя фразу буквальным «таким образом, каким».
- source_word: ἐθεάσασθε αὐτὸν πορευόμενον
  choice: вы видели его уходящим
  rationale: Сохраняет объект αὐτόν и причастную конструкцию, передающую наблюдаемое движение; «уходящим» в данном контексте точнее связывает движение с удалением.
theological_decisions:
- issue: Значение οὐρανός при вознесении и возвращении
  choice: небо
  alternative: видимое небо / небеса
  rationale: Русское «небо» естественно охватывает как наблюдаемое направление, так и богословский смысл небесной сферы, поэтому не требуется преждевременно устранять смысловую многозначность.
- issue: Передача οὗτος ὁ Ἰησοῦς
  choice: Этот Иисус
  alternative: Этот же Иисус / Тот же самый Иисус
  rationale: В греческом тексте явно присутствует указательное местоимение «этот», но нет отдельного слова «тот же самый». Традиционное усиление допустимо как толкование и вынесено в сноску.
- issue: Пассивный залог ἀναλημφθεὶς
  choice: взятый
  alternative: вознёсшийся
  rationale: Пассивная форма источника оставлена без уточнения действующего лица; вариант «вознёсшийся» изменил бы залог и мог бы скрыть богословски значимый божественный пассив.
translation_notes:
  register: Современный литературный русский язык без архаизмов «мужи» и «сей». Синтаксис сохраняет торжественность прямой речи, оставаясь понятным обычному читателю. Местоимение «он» написано со строчной буквы согласно нейтральной современной норме; конфессиональная практика почтительного прописного написания не навязывается.
