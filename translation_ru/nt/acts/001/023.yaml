  yaml_path: translation/nt/acts/001/023.yaml
  text: 'And they put forward two: Joseph called Barsabbas[a], who was also called Justus, and Matthias.'
translation:
  language: ru
  text: 'И предложили двоих: Иосифа, называемого Варсавой[a], которого также называли Иустом, и Матфия.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выдвинули двоих» или «представили двоих». Греческий глагол может означать, что людей поставили перед собранием; здесь, вероятно, речь идёт о предложении кандидатов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν
  choice: предложили
  rationale: В контексте выбора глагол означает, что этих людей представили общине как кандидатов; «предложили» естественно передаёт процедурный смысл, не утверждая, что их уже назначили.
- source_word: δύο
  choice: двоих
  rationale: Форма одушевлённого числительного естественно указывает на двух мужчин-кандидатов.
- source_word: καλούμενον
  choice: называемого
  rationale: Причастие вводит дополнительное имя Иосифа и сохраняет структуру греческой фразы.
- source_word: Βαρσαββᾶν
  choice: Варсавой
  rationale: Использована традиционная русская библейская передача личного имени с требуемым творительным падежом.
- source_word: ἐπεκλήθη
  choice: которого прозвали
  rationale: Глагол вводит ещё одно имя или прозвище; «прозвали» позволяет естественно отличить эту формулу от предшествующего «называемого».
- source_word: Ἰοῦστος
  choice: Иустом
  rationale: Традиционная русская библейская передача имени с требуемым творительным падежом.
- source_word: Μαθθίαν
  choice: Матфия
  rationale: Традиционная русская библейская форма имени в винительном падеже.
- source_word: καὶ ... καὶ
  choice: И ... и
  rationale: Сохранены повествовательное продолжение и координация двух кандидатов.
theological_decisions:
- issue: Степень официальности действия ἔστησαν
  choice: предложили двоих
  alternative: назначили двоих / поставили двоих
  rationale: Контекст последующего жребия показывает, что здесь представлены кандидаты, а не окончательно назначены апостолы; при этом сноска сохраняет лексическую широту выражения.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Традиционные русские формы библейских имён сохранены; синтаксис слегка упрощён ради ясности, но две формулы именования Иосифа переданы раздельно.
