source:
  edition: SBLGNT
  text: οἷς καὶ παρέστησεν ἑαυτὸν ζῶντα μετὰ τὸ παθεῖν αὐτὸν ἐν πολλοῖς τεκμηρίοις, δι’ ἡμερῶν τεσσεράκοντα ὀπτανόμενος αὐτοῖς καὶ λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/003.yaml
  text: To them he also presented himself alive after he had suffered[a], by many proofs[b], appearing to them over forty days and speaking about the kingdom of God.
translation:
  language: ru
  text: 'Им Он и явил Себя живым после Своих страданий, дав множество доказательств[a]: на протяжении сорока дней[b] Он являлся им и говорил о Царстве Божьем.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посредством множества доказательств». Греческое слово обозначает веское свидетельство, служащее основанием для уверенности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в течение сорока дней». Речь идёт о явлениях, происходивших в пределах этого периода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: им
  rationale: Относительное местоимение относится к апостолам из предыдущего стиха; русский контекст позволяет сохранить местоименную форму, не добавляя отсутствующее в греческом слово «мужчинам».
- source_word: παρέστησεν ἑαυτὸν ζῶντα
  choice: явил Себя живым
  rationale: Передаёт действие представления или показывания Себя и предикативное ζῶντα; оборот естественен для русского повествования о явлениях после воскресения.
- source_word: μετὰ τὸ παθεῖν αὐτὸν
  choice: после Своих страданий
  rationale: Сохраняет временное значение конструкции с μετά и не конкретизирует характер страданий сверх сказанного в тексте.
- source_word: ἐν πολλοῖς τεκμηρίοις
  choice: дав множество доказательств
  rationale: Передаёт инструментальный смысл ἐν и сильное доказательное значение τεκμήριον естественным современным русским оборотом.
- source_word: δι’ ἡμερῶν τεσσεράκοντα
  choice: на протяжении сорока дней
  rationale: Выражает протяжённость периода и допускает ряд явлений в его пределах, не подразумевая непрерывного видимого присутствия.
- source_word: ὀπτανόμενος αὐτοῖς
  choice: Он являлся им
  rationale: Обычное контекстуальное значение ὀπτάνομαι в повествованиях о явлениях воскресшего Иисуса.
- source_word: λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: говорил о Царстве Божьем
  rationale: Естественно передаёт идиому τὰ περὶ с родительным падежом, сохраняя традиционный и понятный эквивалент βασιλεία τοῦ θεοῦ.
theological_decisions:
- issue: Воскресение и доказательная сила явлений
  choice: «явил Себя живым… дав множество доказательств»
  alternative: «показал Себя живым… со многими убедительными доказательствами»
  rationale: Перевод прямо сохраняет утверждение о том, что после страданий Иисус был жив, и сильное значение τεκμήριον, но не добавляет к тексту оценочных слов вроде «неопровержимых».
- issue: Референт οἷς
  choice: «им»
  alternative: «этим мужам»
  rationale: Из ближайшего контекста ясно, что речь об апостолах, однако в самом местоимении нет существительного «мужи»; поэтому более точна местоименная передача.
- issue: Царство Божье
  choice: «Царство Божье»
  alternative: «владычество Бога»
  rationale: Слово βασιλεία может обозначать как царское правление, так и царство; традиционный русский эквивалент сохраняет эту смысловую ёмкость и не сужает выражение до одного аспекта.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка перестроен ради ясности: деепричастный оборот передаёт доказательную фразу, а последующие причастия — самостоятельными сказуемыми. Заглавные буквы в «Себя», «Своих» следуют принятой русской библейской издательской норме; «Божьем» выбрано как современная литературная форма.'
