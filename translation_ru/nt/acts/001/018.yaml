  text: Οὗτος μὲν οὖν ἐκτήσατο χωρίον ἐκ μισθοῦ τῆς ἀδικίας, καὶ πρηνὴς γενόμενος ἐλάκησεν μέσος, καὶ ἐξεχύθη πάντα τὰ σπλάγχνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/018.yaml
  text: So this man acquired a field with the wages of unrighteousness[a], and falling headlong he burst open in the middle[c][b], and all his intestines spilled out.
translation:
  language: ru
  text: Итак, он приобрёл поле на деньги, полученные за неправедность[a], и, упав вниз головой[b], разорвался посередине, так что все его внутренности вывалились.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на вознаграждение за злодеяние». Буквальнее: «из платы за неправедность».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «оказавшись лежащим лицом вниз». Греческое выражение, вероятно, описывает падение вниз головой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος μὲν οὖν
  choice: Итак, он
  rationale: Указательное местоимение отсылает к Иуде, а сочетание μέν οὖν продолжает повествование с оттенком вывода; «итак» естественно передаёт эту связь.
- source_word: ἐκτήσατο
  choice: приобрёл
  rationale: Глагол означает приобретение или обретение владения и не требует более узкого смысла «купил».
- source_word: χωρίον
  choice: поле
  rationale: В данном контексте слово естественно обозначает поле или участок земли; «поле» сохраняет связь с ближайшим повествовательным контекстом.
- source_word: ἐκ μισθοῦ τῆς ἀδικίας
  choice: на плату за неправедность
  rationale: Оборот передаёт средство приобретения и сохраняет нравственно насыщенные существительные μισθός и ἀδικία без тяжеловесной буквальности «из платы неправедности».
- source_word: πρηνὴς γενόμενος
  choice: упав вниз головой
  rationale: πρηνής описывает положение лицом вниз или движение головой вперёд; в контексте естественнее всего передать вероятный смысл падения вниз головой, оставив буквальную возможность в примечании.
- source_word: ἐλάκησεν μέσος
  choice: лопнул посередине
  rationale: λακάω обозначает разрыв или растрескивание, а μέσος указывает на середину; выбранная формулировка ясна, наглядна и естественна по-русски.
- source_word: ἐξεχύθη πάντα τὰ σπλάγχνα αὐτοῦ
  choice: все его внутренности вывалились
  rationale: ἐκχέω обозначает излияние наружу, а σπλάγχνα — внутренние органы. «Внутренности вывалились» точно и естественно описывает событие без архаического «внутренняя утроба».
theological_decisions:
- issue: Связь Иуды с приобретением поля
  choice: «приобрёл», без уточнения, что он лично купил поле
  alternative: «купил поле» либо пояснение, что поле было приобретено от его имени или на связанные с ним деньги
  rationale: Греческое ἐκτήσατο утверждает приобретение или владение, но не определяет механизм. Перевод не должен заранее согласовывать этот стих с Мф. 27:5–8 или усиливать кажущееся расхождение.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и наглядное, без архаизмов. Сохранена резкость описания оригинала и намеренно не уточнён способ приобретения поля.
