  text: καὶ συναλιζόμενος παρήγγειλεν αὐτοῖς ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι, ἀλλὰ περιμένειν τὴν ἐπαγγελίαν τοῦ πατρὸς ἣν ἠκούσατέ μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/004.yaml
  text: And while staying with them[a], he ordered them not to depart from Jerusalem, but to wait for the promise of the Father, which you heard from me.
translation:
  language: ru
  text: И, находясь вместе с ними[a], Он велел им не уходить из Иерусалима, а ждать обещания Отца, о котором вы слышали от Меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собравшись с ними»; некоторые понимают это выражение как «за трапезой с ними».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συναλιζόμενος
  choice: находясь вместе с ними
  rationale: Причастие лексически трудно и допускает несколько пониманий. Нейтральная формулировка естественно передаёт несомненный для контекста смысл совместного пребывания Иисуса с апостолами, не устраняя более конкретные варианты.
- source_word: παρήγγειλεν
  choice: велел
  rationale: Глагол выражает властное распоряжение. «Велел» ясно передаёт эту силу и звучит естественно в современном русском языке.
- source_word: ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι
  choice: не уходить из Иерусалима
  rationale: В сочетании с обозначением города глагол означает не покидать это место. Русская формулировка точна и идиоматична.
- source_word: περιμένειν
  choice: ждать
  rationale: Передаёт ожидание исполнения обещания просто и естественно.
- source_word: τὴν ἐπαγγελίαν τοῦ πατρὸς
  choice: обещанного Отцом
  rationale: Русская субстантивированная форма естественно обозначает то, что обещал Отец, не добавляя в основной текст уточнения «дар».
- source_word: ἣν ἠκούσατέ μου
  choice: о чём вы слышали от Меня
  rationale: 'Относительное местоимение согласуется по-гречески с «обещанием», тогда как по-русски при «обещанном» естественно употребить «о чём». Генитив μου передан как источник услышанного: «от Меня».'
theological_decisions:
- issue: Значение συναλιζόμενος применительно к деятельности Иисуса после воскресения
  choice: 'Общее указание на совместное пребывание: «находясь вместе с ними»'
  alternative: «собравшись с ними» или «за трапезой с ними»
  rationale: Форма допускает разные лексические толкования. Основной текст сохраняет несомненный смысл совместного присутствия, не превращая спорный оттенок в однозначное утверждение; варианты указаны в сноске.
- issue: Характер «обещания Отца»
  choice: «обещанного Отцом»
  alternative: «обещания Отца» или «обещанного Отцом дара»
  rationale: Формулировка указывает на Отца как давшего обещание и не вводит слово «дар», отсутствующее в стихе. Ближайший контекст раскрывает содержание обещанного, поэтому преждевременное уточнение не требуется.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным регистром. Местоимения, относящиеся к Иисусу, переданы с прописной буквы по принятой русской библейской традиции. Спорная лексическая деталь сохранена в сноске.
