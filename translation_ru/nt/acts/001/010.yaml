lexical_decisions:
- source_word: ἀτενίζοντες
  choice: пристально смотрели
  rationale: Причастие передаёт продолжительный, сосредоточенный взгляд; это естественное современное выражение без усиления до «уставились».
- source_word: οὐρανόν
  choice: небо
  rationale: Русское «небо» естественно сохраняет присущую греческому слову связь как с видимым небом, так и с небесной сферой, что особенно уместно в контексте вознесения.
- source_word: πορευομένου αὐτοῦ
  choice: пока Он удалялся
  rationale: Родительный самостоятельный оборот обозначает одновременное продолжающееся движение. «Удалялся» естественно передаёт движение прочь, не добавляя прямо не выраженного направления.
- source_word: ἰδοὺ
  choice: и вот
  rationale: Сохраняет функцию указательного повествовательного маркера и его торжественную выразительность в естественном русском синтаксисе.
- source_word: ἄνδρες δύο
  choice: два человека
  rationale: В данном явленческом контексте «два человека» естественно передаёт человеческий облик названных лиц, не вводя в текст их предполагаемую ангельскую природу. Пол обозначен числительным и согласованием.
- source_word: παρειστήκεισαν
  choice: рядом с ними встали
  rationale: Передаёт присутствие непосредственно возле учеников и повествовательное обнаружение этих лиц; не заменяет глагол толкованием «явились».
- source_word: ἐσθήσεσι λευκαῖς
  choice: в белой одежде
  rationale: ἐσθής обозначает одежду в широком смысле; формулировка не сужает значение до конкретных одеяний или риз.
theological_decisions:
- issue: Значение οὐρανός в контексте вознесения
  choice: небо
  alternative: небеса
  rationale: Русское единственное число сохраняет естественную лексическую многозначность между видимым небом и небесной сферой и не навязывает более определённой космологии.
- issue: Кем были два человека
  choice: два человека
  alternative: два ангела
  rationale: В стихе употреблено ἄνδρες, а не ἄγγελοι; поэтому перевод не вводит ангельскую идентификацию, которая лишь подразумевается более широким контекстом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Указательное «и вот» сохраняет библейскую выразительность, оставаясь понятным современному читателю. Заглавная буква в местоимении «Он» следует принятой русской благоговейной издательской норме.
