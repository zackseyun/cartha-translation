  text: Τὸν μὲν πρῶτον λόγον ἐποιησάμην περὶ πάντων, ὦ Θεόφιλε, ὧν ἤρξατο ⸀ὁ Ἰησοῦς ποιεῖν τε καὶ διδάσκειν
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/001.yaml
  text: In the first account[a], O Theophilus, I wrote about all that Jesus began both to do and to teach,
translation:
  language: ru
  text: В первом повествовании[a], Феофил, я рассказал обо всём, что Иисус начал делать и учить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «В первой книге»; «В прежнем повествовании».'
    reason: Лексема λόγος в этом контексте может означать письменный труд, повествование или изложение; πρῶτον допускает значение «первый» либо «прежний».
lexical_decisions:
- source_word: Τὸν μὲν πρῶτον λόγον
  choice: В первой книге
  rationale: В данном контексте λόγος обозначает составленное письменное повествование — Евангелие от Луки. «Первая книга» естественно звучит по-русски и сохраняет последовательное значение πρῶτον; частица μέν задаёт связь с последующим повествованием, но не требует отдельного перевода.
- source_word: ἐποιησάμην
  choice: я написал
  rationale: В сочетании с λόγον глагол означает создание письменного труда; «написал» — ясный и естественный русский эквивалент.
- source_word: περὶ πάντων ... ὧν
  choice: обо всём, что
  rationale: Эта конструкция естественно передаёт сочетание περί с родительным падежом и относительным местоимением, не превращая «всё» в утверждение об абсолютной исчерпывающей полноте.
- source_word: ὦ Θεόφιλε
  choice: Феофил
  rationale: Русская форма обращения передана звательным интонационным обособлением. Частица «о» в современном русском здесь звучала бы неестественно и чрезмерно возвышенно.
- source_word: ἤρξατο
  choice: начал
  rationale: Прямо сохраняет значение греческого глагола и возможный намёк на продолжение деятельности Иисуса в повествовании Деяний, не разъясняя этот намёк внутри перевода.
- source_word: ὁ Ἰησοῦς
  choice: Иисус
  rationale: Устоявшаяся русская форма имени.
- source_word: ποιεῖν τε καὶ διδάσκειν
  choice: делать и чему учить
  rationale: Сохраняет различение дел и учения Иисуса. В русском управление «начал ... чему учить» естественнее буквального «начал учить», а τε καί достаточно выражено парой однородных инфинитивных конструкций без утяжеляющего «как... так и».
theological_decisions:
- issue: Возможный смысл ἤρξατο («начал») как указание на продолжение дела Иисуса в Деяниях
  choice: Сохранить «начал» без поясняющей парафразы.
  alternative: Передать как «что Иисус делал и чему учил» либо явно добавить продолжение его дела через апостолов.
  rationale: Слово «начал» присутствует в греческом тексте и может подразумевать продолжение дела Иисуса, однако сам стих не раскрывает этот смысл прямо. Перевод сохраняет богословское напряжение, не разрешая его за читателя.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Обращение «Феофил» оставлено без архаического «о». Формулировка сохраняет структуру и смысловые акценты греческого текста, избегая как буквалистской тяжеловесности, так и богословской экспликации.
