id: ACT.1.14
reference: Acts 1:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὗτοι πάντες ἦσαν προσκαρτεροῦντες ὁμοθυμαδὸν τῇ ⸀προσευχῇ σὺν γυναιξὶν καὶ ⸀Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ καὶ ⸀σὺν τοῖς ἀδελφοῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/014.yaml
  text: All of these were continually devoting themselves with one accord to prayer[a], together with the women, and Mary the mother of Jesus[c][b], and with his brothers.
translation:
  language: ru
  text: Все они единодушно и постоянно пребывали в молитве[a] вместе с женщинами[b], Марией, матерью Иисуса, и Его братьями[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «неотступно посвящали себя молитве». Греческая конструкция подчёркивает продолжительное и настойчивое действие; слово «единодушно» также указывает на общность их намерения.
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте слово «женщины» употреблено без артикля; вероятно, речь идёт об известной группе женщин, связанных с учениками.
    reason: lexical_alternative
  - marker: c
    text: «Братьями» передаёт греческое adelphoi. Некоторые понимают это слово шире — как обозначение близких родственников или родичей; здесь текст не уточняет степень родства.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι πάντες
  choice: Все они
  rationale: Естественно по-русски передаёт и указание на ранее названных людей, и охват всей группы.
- source_word: ἦσαν προσκαρτεροῦντες
  choice: постоянно пребывали
  rationale: Сочетание имперфекта с причастием выражает продолжительное, устойчивое действие; формулировка передаёт постоянство и преданность молитве без излишнего усиления.
- source_word: ὁμοθυμαδόν
  choice: единодушно
  rationale: Передаёт не только совместное присутствие, но и общность намерения и настроя, характерную для употребления этого слова у Луки.
- source_word: τῇ προσευχῇ
  choice: в молитве
  rationale: При προσκαρτερέω дательный падеж обозначает то, чему люди неизменно посвящали себя; по-русски сочетание «пребывать в молитве» звучит естественно и достойно.
- source_word: σὺν γυναιξίν
  choice: вместе с женщинами
  rationale: Передаёт σύν и не вносит в русский текст отсутствующее в нём грамматическое различие определённости; контекст допускает понимание известной читателю группы женщин.
- source_word: Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ
  choice: Марией, матерью Иисуса
  rationale: Обычная русская форма имени и ясная передача приложения, однозначно определяющего Марию.
- source_word: σὺν τοῖς ἀδελφοῖς αὐτοῦ
  choice: и Его братьями
  rationale: ἀδελφοί имеет форму мужского рода множественного числа и непосредственно передаётся словом «братья»; прописная буква в местоимении соответствует принятому благоговейному русскому библейскому регистру.
theological_decisions:
- issue: Кого обозначает выражение τοῖς ἀδελφοῖς αὐτοῦ
  choice: Его братьями
  alternative: Его близкими родственниками или родичами
  rationale: Обычное значение ἀδελφοί — «братья», однако сам стих не уточняет точную степень родства. Перевод сохраняет прямое лексическое значение и не решает межконфессиональный вопрос о том, были ли они родными братьями, сводными братьями или другими близкими родственниками.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным библейским звучанием. Синтаксис сохраняет единство собравшейся группы и длительность молитвы, не становясь тяжеловесным. Подлинная неоднозначность слова ἀδελφοί вынесена в примечание, а не разрешена в основном тексте.
