source:
  edition: SBLGNT
  text: γέγραπται γὰρ ἐν βίβλῳ ψαλμῶν· Γενηθήτω ἡ ἔπαυλις αὐτοῦ ἔρημος καὶ μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ, καί· Τὴν ἐπισκοπὴν αὐτοῦ ⸀λαβέτω ἕτερος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/020.yaml
  text: For it is written in the book of Psalms[a], ‘Let his dwelling place become desolate, and let there be no one dwelling in it,’ and[c][b], ‘Let another take his office.’
translation:
  language: ru
  text: 'Ведь в книге Псалмов написано: «Пусть его жилище[a] опустеет, и пусть никто в нём не живёт»,[b] и ещё: «Пусть его должность займёт другой».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обитель», «место обитания».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и пусть не будет живущего в нём»; по смыслу также: «и пусть не будет в нём обитателя».'
    reason: lexical_alternative
  - marker: c
    text: Греческое слово ἐπισκοπή может означать порученный надзор, попечение или соответствующую должность. Перевод «епископство» способен создать здесь не обязательное для контекста представление о более позднем техническом церковном чине.
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: написано
  rationale: Устойчивое русское соответствие новозаветной формуле цитирования Писания; передаёт сохраняющуюся силу перфекта.
- source_word: ἐν βίβλῳ ψαλμῶν
  choice: в книге Псалмов
  rationale: Естественно и точно обозначает книгу Писания, из которой приводятся цитаты.
- source_word: Γενηθήτω ἡ ἔπαυλις αὐτοῦ ἔρημος
  choice: Пусть его жилище опустеет
  rationale: Конструкция с «пусть» передаёт повелительно-желательное значение аористного императива; «опустеет» естественно выражает превращение жилища в безлюдное место.
- source_word: ἔπαυλις
  choice: жилище
  rationale: Широкое и понятное обозначение места проживания, не сужающее значение до дома, усадьбы или поселения.
- source_word: μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ
  choice: и пусть никто в нём не живёт
  rationale: 'Современная и ясная русская передача запретительной конструкции с субстантивированным причастием: в этом месте не должно быть жильца.'
- source_word: ἐπισκοπή
  choice: должность
  rationale: Передаёт порученную Иуде роль, которую должен занять другой, не навязывая тексту значение позднейшего технического церковного титула.
- source_word: λαβέτω ἕτερος
  choice: пусть … займёт другой
  rationale: В сочетании с «должность» глагол «занять» естественно передаёт принятие освободившейся роли другим человеком.
theological_decisions:
- issue: Значение ἐπισκοπή применительно к освободившемуся месту Иуды
  choice: должность
  alternative: служение; попечение; надзор; епископство
  rationale: «Должность» сохраняет смысл порученной роли, переходящей к другому, и не отождествляет её без необходимости с позднее оформившейся должностью епископа. Лексическое значение надзора отмечено в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием библейской цитаты. «Ведь» естественно передаёт объяснительное γάρ; добавление «ещё» ясно вводит вторую цитату из книги Псалмов, не меняя логики исходного текста.
