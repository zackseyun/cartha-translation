base_translation:
  language: en
  yaml_path: translation/nt/acts/001/009.yaml
  text: And after he said these things[a], as they were watching, he was lifted up[c][b], and a cloud took him out of their sight.
translation:
  language: ru
  text: Сказав это, Он у них на глазах был поднят, и облако скрыло Его из виду.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «облако приняло Его», так что Он исчез из их виду. Облако может напоминать библейские сцены Божьего присутствия, однако здесь это прямо не поясняется.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: καὶ ταῦτα εἰπὼν
  choice: Сказав это
  rationale: Естественно передаёт предшествующее обстоятельство аористного причастия и связь с предыдущей речью; отдельное «и» в русском повествовании необязательно.
- source_word: βλεπόντων αὐτῶν
  choice: на их глазах
  rationale: 'Генитив абсолютный обозначает сопутствующее обстоятельство: ученики непосредственно видели происходящее. Русский оборот краток и естественен.'
- source_word: ἐπήρθη
  choice: был поднят
  rationale: Сохраняет пассивную форму и видимое движение вверх, не уточняя прямо, кто совершает действие.
- source_word: νεφέλη
  choice: облако
  rationale: Передаёт неопределённое существительное без внесения в основной текст явного богословского толкования.
- source_word: ὑπέλαβεν αὐτὸν
  choice: скрыло Его
  rationale: В данном контексте глагол описывает, как облако приняло/подхватило Иисуса так, что Он перестал быть видим. «Скрыло» естественно сочетается с последующим указанием на зрение, хотя несколько менее буквально.
- source_word: ἀπὸ τῶν ὀφθαλμῶν αὐτῶν
  choice: от их взоров
  rationale: Современный литературный эквивалент идиомы «от их глаз», обозначающий исчезновение из поля зрения.
theological_decisions:
- issue: Следует ли передавать ἐπήρθη традиционной формулой вознесения
  choice: был поднят
  alternative: был взят вверх / вознёсся
  rationale: Пассив «был поднят» близок к греческому тексту, сохраняет подразумеваемое действие Бога и не заменяет пассив возвратным активным «вознёсся».
- issue: Следует ли прямо обозначить облако как знак Божьего присутствия
  choice: облако
  alternative: облако Божьего присутствия
  rationale: Библейская ассоциация возможна, но стих прямо её не формулирует; поэтому она отмечена лишь в сноске.
- issue: Как передать ὑπέλαβεν в связи с исчезновением из поля зрения
  choice: скрыло Его
  alternative: приняло Его / подхватило Его
  rationale: «Скрыло» ясно передаёт наблюдаемый результат и естественно звучит по-русски; сноска сохраняет более буквальную лексическую возможность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Заглавные местоимения по отношению к Иисусу использованы в соответствии с распространённой русской библейской издательской нормой. Синтаксис сделан плавным, при этом сохранены пассивность ἐπήρθη и возможная многозначность образа облака.
