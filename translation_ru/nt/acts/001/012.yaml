  yaml_path: translation/nt/acts/001/012.yaml
  text: Then they returned to Jerusalem from the mount called Olivet[a], which is near Jerusalem[b], a Sabbath day’s journey away.
translation:
  language: ru
  text: Тогда они вернулись в Иерусалим с горы, называемой Елеонской[a], которая находится близ Иерусалима — на расстоянии субботнего пути[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть с Масличной горы.
    reason: lexical_alternative
  - marker: b
    text: «Субботний путь» — условная мера расстояния, которое, согласно иудейской традиции, разрешалось проходить в субботу.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественная временная связка, обозначающая следующее событие повествования.
- source_word: ὑπέστρεψαν εἰς Ἰερουσαλὴμ
  choice: они вернулись в Иерусалим
  rationale: Точно и естественно передаёт возвращение к указанному месту.
- source_word: ἀπὸ ὄρους
  choice: с горы
  rationale: ἀπό обозначает исходный пункт движения, а ὄρος — гору; русская конструкция «с горы» здесь идиоматична.
- source_word: τοῦ καλουμένου Ἐλαιῶνος
  choice: называемой Елеонской
  rationale: Передаёт традиционное русское название места, сохраняя согласование с существительным «гора» и значение причастия καλουμένου.
- source_word: ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ
  choice: Она находится близ Иерусалима
  rationale: Естественно выражает близость горы к городу; отдельное предложение устраняет тяжеловесность длинной относительной конструкции.
- source_word: σαββάτου ἔχον ὁδόν
  choice: на расстоянии субботнего пути
  rationale: Сохраняет иудейскую культурную меру расстояния и образ исходного выражения без искусственного уточнения точной длины.
theological_decisions:
- issue: Иудейское выражение σαββάτου ἔχον ὁδόν
  choice: на расстоянии субботнего пути
  alternative: на расстоянии пути, дозволенного в субботу
  rationale: Основной текст сохраняет культурно-религиозный термин и его историческую окраску, а сноска кратко объясняет его, не вводя спорной точной величины.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской топонимией. «Елеонская гора» сохранена как узнаваемое русское название, а прозрачный вариант дан в сноске. Формулировка остаётся dignified и понятной без архаической синтаксической тяжеловесности.
