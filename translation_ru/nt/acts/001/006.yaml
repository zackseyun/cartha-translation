lexical_decisions:
- source_word: Οἱ μὲν οὖν συνελθόντες
  choice: Итак, собравшись
  rationale: Причастие συνελθόντες передаёт временное обстоятельство, а μὲν οὖν связывает вопрос с предшествующим повествованием. Такая формулировка естественна для русского повествования и не перегружает связку частиц.
- source_word: ἠρώτων αὐτὸν λέγοντες
  choice: они спросили Его
  rationale: Имперфект ἠρώτων здесь естественно передать повествовательным совершенным видом. Отдельное «говоря» в русском избыточно, поскольку содержание вопроса непосредственно следует после двоеточия.
- source_word: Κύριε
  choice: Господи
  rationale: Традиционная и живая русская форма прямого обращения сохраняет уважительный и богословски значимый титул κύριος.
- source_word: ἐν τῷ χρόνῳ τούτῳ
  choice: в это время
  rationale: χρόνος обозначает время или период, а не обязательно мгновение. Формулировка близка греческому тексту и естественна в конструкции «не в это ли время».
- source_word: ἀποκαθιστάνεις
  choice: Ты восстанавливаешь
  rationale: Глагол означает возвращение к прежнему состоянию или положению. Настоящее время сохранено и в данном вопросе по-русски может указывать на ожидаемое действие.
- source_word: τὴν βασιλείαν
  choice: царство
  rationale: βασιλεία может означать царство или царствование; в вопросе учеников об Израиле слово «царство» сохраняет конкретность их ожидания, не определяя заранее его политический или духовный характер.
- source_word: τῷ Ἰσραήλ
  choice: Израилю
  rationale: Русский дательный падеж близко передаёт греческий датив и допускает понимание восстановления царства Израилю, не превращая выражение в притяжательное «царство Израиля».
theological_decisions:
- issue: Характер ожидаемого учениками восстановления царства Израилю
  choice: 'Передать вопрос прямо: «восстанавливаешь царство Израилю»'
  alternative: «восстанавливаешь царство для Израиля» или «восстанавливаешь Израильское царство»
  rationale: Стих сообщает ожидание учеников, но сам по себе не подтверждает и не опровергает его политическое либо духовное понимание. Прямой перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Конструкция «не в это ли время» передаёт вопрос о сроке без добавочного толкования. Маркер сноски поставлен после слова «Израилю», к которому относится пояснение.
