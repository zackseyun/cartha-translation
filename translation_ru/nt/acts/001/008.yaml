  text: ἀλλὰ λήμψεσθε δύναμιν ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς, καὶ ἔσεσθέ ⸀μου μάρτυρες ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ καὶ ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/008.yaml
  text: But you will receive power when the Holy Spirit has come upon you[a], and you will be my witnesses in Jerusalem, and in all Judea and Samaria, and to the end of the earth.
translation:
  language: ru
  text: Но вы примете силу, когда на вас сойдёт Святой Дух, и будете Моими свидетелями в Иерусалиме, по всей Иудее и Самарии и до края земли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до самых отдалённых мест земли». Греческое выражение стоит в единственном числе («до края земли»), но означает наиболее удалённые пределы земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт противопоставление предыдущему высказыванию о сроках и временах (ст. 7).
- source_word: λήμψεσθε δύναμιν
  choice: вы примете силу
  rationale: Будущее время указывает на получение даруемой силы; «силу» сохраняет широкий смысл действенной способности, исходящей от Духа.
- source_word: ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς
  choice: когда на вас сойдёт Святой Дух
  rationale: Генитив абсолютный естественно передан временным придаточным; «сойдёт на вас» сохраняет образ движения и является ясным современным русским выражением.
- source_word: ἔσεσθέ μου μάρτυρες
  choice: будете Моими свидетелями
  rationale: Передаёт принадлежность и отношение свидетелей к Иисусу, не привнося позднейшего значения мученичества.
- source_word: ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ
  choice: в Иерусалиме, по всей Иудее и Самарии
  rationale: «По всей» идиоматично выражает охват территории; общий предлог распространяется на согласованные названия Иудеи и Самарии.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: до края земли
  rationale: Сохраняет единственное число греческого выражения и его идиоматический смысл — до самой отдалённой части земли.
theological_decisions:
- issue: Личностный божественный референт πνεῦμα
  choice: Святой Дух
  alternative: святой дух
  rationale: Контекст говорит о Святом Духе как действующем божественном Лице; традиционное написание с прописных букв ясно передаёт референт без добавления догматических формулировок.
- issue: Характер обещанной δύναμις
  choice: сила, получаемая при сошествии Святого Духа
  alternative: власть или природная способность учеников
  rationale: «Сила» сохраняет широту исходного слова и непосредственную связь дара с сошествием Духа, не сужая смысл до должностной власти или врождённой способности.
- issue: Географический размах свидетельства
  choice: конкретное расширение от Иерусалима до края земли
  alternative: исключительно символическая духовная география
  rationale: Сохранены реальные географические названия и всемирный горизонт фразы без навязывания тексту дополнительной экклезиологической схемы.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формулировка ясна обычному читателю; избегаются как архаизмы («приимете», «Дух Святый»), так и разговорная сниженная лексика. Местоимение «Моими» написано с прописной буквы по принятой русской библейской издательской традиции.
