  text: δεῖ οὖν τῶν συνελθόντων ἡμῖν ἀνδρῶν ἐν παντὶ χρόνῳ ⸀ᾧ εἰσῆλθεν καὶ ἐξῆλθεν ἐφ’ ἡμᾶς ὁ κύριος Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/021.yaml
  text: Therefore[a], it is necessary that one of the men who accompanied us during all the time in which the Lord Jesus went in and out among us[b],
translation:
  language: ru
  text: Итак, необходимо, чтобы один из мужчин, бывших с нами[a] на протяжении всего того времени, пока Господь Иисус входил и выходил среди нас[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сошедшихся вместе с нами»; по смыслу — тех, кто был с нами.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «входил и выходил среди нас» означает постоянную жизнь и деятельность Иисуса в обществе учеников.
    reason: cultural_note
lexical_decisions:
- source_word: δεῖ
  choice: необходимо
  rationale: Безличная конструкция передаёт выраженную в греческом тексте необходимость и сохраняет синтаксическую связь со следующим стихом.
- source_word: οὖν
  choice: итак
  rationale: Естественно обозначает вывод, который Пётр делает из предшествующих слов.
- source_word: τῶν συνελθόντων ἡμῖν ἀνδρῶν
  choice: из мужчин, которые были вместе с нами
  rationale: Передаёт как конкретно мужское значение ἀνδρῶν, так и продолжительное пребывание этих людей вместе с апостолами; буквальный образ совместного схождения вынесен в примечание.
- source_word: ἐν παντὶ χρόνῳ
  choice: всё то время
  rationale: Речь идёт обо всём периоде земного служения Иисуса в обществе учеников, а не о каждом отдельном случае.
- source_word: ᾧ
  choice: пока
  rationale: В данном временном обороте современное русское «пока» естественно передаёт относительное значение «в течение которого».
- source_word: εἰσῆλθεν καὶ ἐξῆλθεν
  choice: входил и выходил
  rationale: Сохранён исходный образ устойчивой деятельности и общения; его идиоматический смысл пояснён в примечании.
- source_word: ἐφ’ ἡμᾶς
  choice: среди нас
  rationale: Передаёт деятельность Иисуса в кругу учеников и хорошо сочетается с сохранённым образом движения.
- source_word: ὁ κύριος Ἰησοῦς
  choice: Господь Иисус
  rationale: «Господь» сохраняет обычное новозаветное почётное и богословски значимое наименование κύριος.
theological_decisions:
- issue: Передача κύριος как христологического титула
  choice: Господь Иисус
  alternative: Учитель Иисус; Владыка Иисус
  rationale: «Господь» соответствует устойчивому новозаветному употреблению и не ослабляет богословский вес титула.
- issue: Мужской род существительного ἀνδρῶν
  choice: мужчин
  alternative: людей; тех, кто
  rationale: Греческое ἀνήρ здесь прямо обозначает мужчин; нейтрализация рода скрыла бы выраженное исходным текстом условие.
- issue: Подразумеваемое «один» в конструкции, продолжающейся в Деян 1:22
  choice: один из мужчин
  alternative: из мужчин… должен стать
  rationale: Хотя слово «один» формально появляется из смысла продолжающейся в следующем стихе конструкции, его явное выражение делает отдельный стих понятным по-русски и не меняет критерия выбора одного нового свидетеля.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Сохранены исходный образ «входил и выходил» и незавершённость фразы, продолжающейся в следующем стихе; конечная запятая отражает эту синтаксическую связь.
