  text: ὅτι Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ ⸂ἐν πνεύματι βαπτισθήσεσθε⸃ ἁγίῳ οὐ μετὰ πολλὰς ταύτας ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/005.yaml
  text: For John baptized with water[a], but you will be baptized in the Holy Spirit not many days from now.
translation:
  language: ru
  text: Ибо Иоанн крестил водой, а вы не через много дней будете крещены в Святом Духе[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Святым Духом». Греческий предлог может указывать как на пребывание в определённой сфере, так и на средство действия.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Ибо
  rationale: В данном контексте союз вводит пояснение к предшествующему обещанию Иисуса; «ибо» естественно передаёт эту смысловую связь.
- source_word: ἐβάπτισεν
  choice: крестил
  rationale: Устоявшийся религиозный термин сохраняет связь с христианским употреблением и не уточняет способ совершения действия сверх того, что выражено в греческом тексте.
- source_word: ὕδατι
  choice: водой
  rationale: Беспредложный дательный падеж естественно передаётся русским творительным и может обозначать средство; это также сохраняет краткость исходного выражения.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: в Святом Духе
  rationale: Предлог «в» формально отражает ἐν и сохраняет возможность понимать выражение как указание на сферу, не сводя его исключительно к средству. В русском контексте «Святой Дух» естественно воспринимается как определённое личное именование.
- source_word: βαπτισθήσεσθε
  choice: будете крещены
  rationale: Форма будущего времени страдательного залога передана прямо; совершающий действие, как и в греческом тексте, не назван.
- source_word: οὐ μετὰ πολλὰς ταύτας ἡμέρας
  choice: не через много дней
  rationale: Формулировка близко передаёт отрицательное временное выражение оригинала и по-русски означает, что событие произойдёт вскоре после произнесённых слов.
theological_decisions:
- issue: Передача ἐν πνεύματι ἁγίῳ в богословски значимой формуле крещения
  choice: в Святом Духе
  alternative: Святым Духом
  rationale: Греческое ἐν допускает понимание как сферы, так и средства. Основной текст сохраняет предложную конструкцию, а распространённая инструментальная передача дана в сноске, чтобы не устранять богословскую и грамматическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис сохраняет пояснительное «ибо» и контраст «а вы»; терминология не привязана к конфессиональному толкованию.
