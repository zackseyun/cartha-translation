  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ προσευξάμενοι εἶπαν Σὺ κύριε καρδιογνῶστα πάντων, ἀνάδειξον ὃν ἐξελέξω, ἐκ τούτων τῶν δύο ἕνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/024.yaml
  text: And after praying[a], they said, “You, Lord, knower of the hearts of all[b], show which one of these two you have chosen,”
translation:
  language: ru
  text: 'И, помолившись, они сказали: «Ты, Господи[a], знающий сердца всех, укажи[b], кого из этих двоих Ты избрал».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Обращение «Господи» может относиться к Богу вообще или конкретно к Иисусу; греческий текст здесь прямо не называет адресата.
    reason: alternative_reading
  - marker: b
    text: 'Или: «назначь» либо «покажи»; греческий глагол может означать как указание на кого-либо, так и его публичное назначение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσευξάμενοι
  choice: помолившись
  rationale: Аористное причастие обозначает действие, предшествующее глаголу «сказали»; деепричастие естественно передаёт эту последовательность по-русски.
- source_word: Σὺ κύριε
  choice: Ты, Господи
  rationale: Явное местоимение σύ придаёт обращению выразительное ударение, а звательная форма «Господи» естественна для современного литературного русского языка.
- source_word: καρδιογνῶστα πάντων
  choice: знающий сердца всех
  rationale: Передаёт обращение в единственном числе и сохраняет образ сердца как внутреннего мира человека, не сводя составное существительное к менее прозрачному «всеведущий».
- source_word: ἀνάδειξον
  choice: укажи
  rationale: В контексте молитвы об определении уже избранного человека «укажи» передаёт выявление Божьего выбора, не утверждая однозначно, что речь идёт о самом акте назначения.
- source_word: ὃν ἐξελέξω
  choice: кого ... Ты избрал
  rationale: Русская конструкция естественно выражает предшествующий выбор Господа, который теперь просят обнаружить.
- source_word: ἐκ τούτων τῶν δύο ἕνα
  choice: кого из этих двоих
  rationale: Местоимение единственного числа «кого» вместе с «из этих двоих» ясно выражает выбор одного человека из двух без добавления отсутствующего в греческом слова «мужчин».
theological_decisions:
- issue: К кому относится обращение «Господи» в молитве
  choice: Оставить обращение «Господи» без уточнения адресата.
  alternative: Понимать молитву как обращённую либо к Богу вообще (или к Отцу), либо конкретно к воскресшему Иисусу.
  rationale: Греческий текст прямо не называет адресата; перевод сохраняет эту богословски значимую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Сохранены прямое обращение, образ сердца и неоднозначность адресата молитвы; синтаксис сделан естественным для чтения вслух.
