  text: καὶ ὅτε εἰσῆλθον, ⸂εἰς τὸ ὑπερῷον ἀνέβησαν⸃ οὗ ἦσαν καταμένοντες, ὅ τε Πέτρος καὶ ⸂Ἰωάννης καὶ Ἰάκωβος⸃ καὶ Ἀνδρέας, Φίλιππος καὶ Θωμᾶς, Βαρθολομαῖος καὶ Μαθθαῖος, Ἰάκωβος Ἁλφαίου καὶ Σίμων ὁ ζηλωτὴς καὶ Ἰούδας Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/013.yaml
  text: 'And when they had entered[a], they went up to the upstairs room where they were staying: Peter, John, James, and Andrew; Philip and Thomas; Bartholomew and Matthew; James the son of Alphaeus, and Simon the Zealot, and Judas the son of James.'
translation:
  language: ru
  text: 'Когда они вошли, то поднялись в комнату на верхнем этаже, где они пребывали: Пётр, Иоанн, Иаков и Андрей; Филипп и Фома; Варфоломей и Матфей; Иаков, сын Алфея, Симон Зилот и Иуда, сын Иакова[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иуда, брат Иакова». В греческом тексте сказано только «Иуда Иакова», поэтому точный характер родства не указан.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσῆλθον
  choice: они вошли
  rationale: Аорист в придаточном времени обозначает действие, предшествующее подъёму. Простое русское прошедшее время естественно передаёт последовательность без добавления не названного в стихе места.
- source_word: εἰς τὸ ὑπερῷον ἀνέβησαν
  choice: поднялись в комнату на верхнем этаже
  rationale: Перевод сохраняет как движение вверх, выраженное ἀνέβησαν, так и обычное архитектурное значение ὑπερῷον, не придавая помещению особого церковного оттенка.
- source_word: οὗ ἦσαν καταμένοντες
  choice: где остановились
  rationale: Сочетание имперфекта с причастием указывает на продолжающееся пребывание. «Остановились» естественно описывает временное проживание в данном месте.
- source_word: Ἰάκωβος Ἁλφαίου
  choice: Иаков, сын Алфея
  rationale: Родительный падеж служит для уточнения личности Иакова; в таком перечне наиболее естественно понимать его как патронимическое обозначение.
- source_word: Σίμων ὁ ζηλωτὴς
  choice: Симон Зилот
  rationale: ζηλωτής выступает как устойчивое прозвище. «Зилот» — ясная и укоренившаяся русская передача, отличающая этого Симона от других.
- source_word: Ἰούδας Ἰακώβου
  choice: Иуда, сын Иакова
  rationale: В перечне мужчин родительный падеж, вероятнее всего, обозначает отца, однако само греческое выражение буквально не уточняет характер родства; эта неоднозначность отмечена в сноске.
theological_decisions:
- issue: Характер родства в выражении Ἰούδας Ἰακώβου
  choice: Иуда, сын Иакова
  alternative: Иуда, брат Иакова
  rationale: В апостольском перечне патронимическое понимание наиболее вероятно, но греческий текст содержит лишь родительный падеж и не называет Иуду прямо ни сыном, ни братом. Поэтому альтернативное понимание сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык; синтаксис достоинственный и доступный. Перечень разбит точками с запятой в соответствии с его смысловыми группами. Маркер сноски помещён непосредственно после спорного выражения, к которому относится примечание.
