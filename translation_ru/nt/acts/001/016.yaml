  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, ἔδει πληρωθῆναι τὴν ⸀γραφὴν ἣν προεῖπε τὸ πνεῦμα τὸ ἅγιον διὰ στόματος Δαυὶδ περὶ Ἰούδα τοῦ γενομένου ὁδηγοῦ τοῖς συλλαβοῦσιν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/016.yaml
  text: Men[a], brothers, it was necessary for the Scripture to be fulfilled, which the Holy Spirit spoke beforehand through the mouth of David concerning Judas, who became a guide to those who arrested Jesus[c][b],
translation:
  language: ru
  text: «Братья![a] Надлежало исполниться Писанию, которое Святой Дух заранее сказал[b] устами Давида об Иуде, ставшем проводником для тех, кто схватил[c] Иисуса».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Мужи, братья».'
    reason: literal_form
  - marker: b
    text: 'Или: «заранее произнёс»; также возможно: «предсказал».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «арестовали».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Братья!
  rationale: В русском обращение «мужи братья» звучит архаично, а «мужчины, братья» — неестественно. «Братья!» естественно передаёт обращение; наличие ἄνδρες и буквальная форма отмечены в сноске.
- source_word: ἔδει
  choice: надлежало
  rationale: Передаёт безличную необходимость, не уточняя, чем именно она обусловлена, и сохраняет возвышенный, но понятный регистр.
- source_word: πληρωθῆναι τὴν γραφὴν
  choice: исполниться Писанию
  rationale: Сохраняет страдательно-результативную идею исполнения и обычную новозаветную формулу исполнения Писания.
- source_word: προεῖπε
  choice: заранее произнёс
  rationale: Передаёт буквальную идею предварительного высказывания, не сужая её до технического значения «предсказал».
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Святой Дух
  rationale: Общепринятое современное обозначение, соответствующее греческой конструкции.
- source_word: διὰ στόματος Δαυὶδ
  choice: устами Давида
  rationale: Естественная русская идиома сохраняет образ «уст» и выражает посредническую роль Давида.
- source_word: περὶ Ἰούδα
  choice: об Иуде
  rationale: Прямо и естественно обозначает предмет сказанного.
- source_word: τοῦ γενομένου ὁδηγοῦ
  choice: ставшем проводником
  rationale: «Ставшем» сохраняет значение γενομένου, а «проводником» передаёт роль человека, который привёл других к нужному месту, не добавляя определённого артикля.
- source_word: τοῖς συλλαβοῦσιν Ἰησοῦν
  choice: для тех, кто схватил Иисуса
  rationale: «Схватил» хорошо передаёт фактическое задержание Иисуса и сохраняет живую силу глагола; юридически более определённое «арестовал» оставлено как возможный вариант.
theological_decisions:
- issue: Характер необходимости исполнения Писания
  choice: «Надлежало исполниться Писанию» без объяснения источника или механизма необходимости.
  alternative: «Это должно было произойти по Божьему предопределению».
  rationale: Греческий текст утверждает необходимость, но не раскрывает здесь её механизм; перевод не разрешает напряжение между Божьим замыслом и человеческой ответственностью.
- issue: Божественное и человеческое участие в Писании
  choice: 'Святой Дух представлен говорящим, а Давид — человеческим посредником: «Святой Дух… устами Давида».'
  alternative: «Давид, вдохновлённый Святым Духом, написал».
  rationale: Синтаксис оригинала прямо называет Святым Духом говорящего и сохраняет инструментальную роль Давида; перевод не заменяет речь более узким понятием письменного вдохновения.
translation_notes:
  register: Современный литературный русский с умеренно торжественной интонацией публичной речи. Архаичное «мужи братья» вынесено в сноску; образное «устами Давида» сохранено как понятная русская идиома.
