  text: ἄχρι ἧς ἡμέρας ἐντειλάμενος τοῖς ἀποστόλοις διὰ πνεύματος ἁγίου οὓς ἐξελέξατο ἀνελήμφθη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/002.yaml
  text: until the day when[a], after giving commands through the Holy Spirit to the apostles whom he had chosen, he was taken up.
translation:
  language: ru
  text: до того дня, когда Он, дав через Святого Духа повеления избранным Им апостолам, был вознесён.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда Он, дав повеления Святым Духом…» Греческий оборот может указывать на средство или действующее посредство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι ἧς ἡμέρας
  choice: до того дня, когда
  rationale: Естественно передаёт временной предел и сохраняет связь со сказанным в предыдущем стихе.
- source_word: ἐντειλάμενος
  choice: дав ... повеления
  rationale: Деепричастная конструкция передаёт действие, предшествующее вознесению; «повеления» сохраняет более сильное значение глагола, чем «наставления».
- source_word: τοῖς ἀποστόλοις
  choice: апостолам
  rationale: Устоявшееся и точное обозначение избранной Иисусом группы в Евангелии от Луки и Деяниях.
- source_word: διὰ πνεύματος ἁγίου
  choice: через Святого Духа
  rationale: Передаёт διά с родительным падежом как средство или посредство, не уточняя смысл сверх греческого текста.
- source_word: οὓς ἐξελέξατο
  choice: избранным Им
  rationale: Естественная русская атрибутивная конструкция ясно указывает на предшествующее избрание апостолов Иисусом.
- source_word: ἀνελήμφθη
  choice: был вознесён
  rationale: Точно передаёт страдательный залог и традиционно, но современно обозначает вознесение, не добавляя отсутствующего здесь уточнения «на небо».
theological_decisions:
- issue: Связь повелений Иисуса со Святым Духом
  choice: Иисус дал апостолам повеления через Святого Духа
  alternative: Иисус дал апостолам повеления силой Святого Духа / по действию Святого Духа
  rationale: Оборот естественнее всего относится к «дав повеления» и выражает средство или посредство, сохраняя при этом присущую греческой конструкции смысловую широту.
translation_notes:
  register: Современный литературный русский язык; синтаксис достоинственный и понятный. Прописные местоимения «Он», «Им» использованы в соответствии с распространённой русской библейской издательской практикой.
