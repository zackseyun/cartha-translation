  text: καὶ γνωστὸν ἐγένετο πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ, ὥστε κληθῆναι τὸ χωρίον ἐκεῖνο τῇ ⸀ἰδίᾳ διαλέκτῳ αὐτῶν Ἁκελδαμάχ, τοῦτ’ ἔστιν Χωρίον Αἵματος.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/019.yaml
  text: And it became known to all those living in Jerusalem[a], so that in their own language that field was called Akeldamach, that is[b], Field of Blood.
translation:
  language: ru
  text: Об этом стало известно всем жителям Иерусалима, так что то поле на их собственном языке[a] назвали «Акелдамах», то есть «Поле крови».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на своём наречии». Греческое διάλεκτος может обозначать как язык, так и местную форму речи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἐγένετο
  choice: об этом стало известно
  rationale: Безличная конструкция естественно передаёт то, что упомянутое событие получило широкую известность, не усиливая смысл до «стало общеизвестным».
- source_word: πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ
  choice: всем жителям Иерусалима
  rationale: Причастный оборот обозначает людей, постоянно живущих в городе; «жителям» кратко и естественно передаёт его смысл.
- source_word: ὥστε
  choice: так что
  rationale: Союз вводит фактическое следствие, а не логический вывод или цель.
- source_word: κληθῆναι
  choice: стали называть
  rationale: В сочетании с ὥστε эта форма естественно передаётся русской неопределённо-личной конструкцией, выражающей возникшее употребление названия.
- source_word: τὸ χωρίον ἐκεῖνο
  choice: то поле
  rationale: χωρίον может означать участок земли или поле; «поле» сохраняет связь с поясняющим названием «Поле крови».
- source_word: τῇ ἰδίᾳ διαλέκτῳ αὐτῶν
  choice: на их родном языке
  rationale: διάλεκτος допускает значения «язык» и «наречие»; основной вариант звучит естественно, а неоднозначность отмечена в сноске.
- source_word: Ἁκελδαμάχ
  choice: Акелдамах
  rationale: Транслитерация сохраняет конечный χ греческой формы; более привычная русская форма указана в сноске.
- source_word: τοῦτ’ ἔστιν
  choice: то есть
  rationale: Устойчивая формула вводит данное самим текстом пояснение значения названия.
- source_word: Χωρίον Αἵματος
  choice: «Поле крови»
  rationale: Прямо передаёт греческое толкование названия; кавычки и прописная буква показывают, что это топонимическое наименование.
