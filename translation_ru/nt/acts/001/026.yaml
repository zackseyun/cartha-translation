  yaml_path: translation/nt/acts/001/026.yaml
  text: And they cast lots for them[a], and the lot fell to Matthias[b], and he was counted with the eleven apostles.
translation:
  language: ru
  text: И они бросили жребий между ними[a], и жребий выпал Матфию, и он был причислен к одиннадцати апостолам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «дали им жребии».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν κλήρους αὐτοῖς
  choice: бросили жребий между ними
  rationale: Греческое выражение буквально означает «дали им жребии», но в данном контексте описывает выбор между двумя кандидатами посредством жребия. Русское «бросили жребий между ними» естественно передаёт действие и его направленность, не добавляя способа проведения процедуры.
- source_word: κλήρους / ὁ κλῆρος
  choice: жребий / жребий
  rationale: В этом повествовательном контексте κλῆρος обозначает жребий как средство выбора, а не долю или наследственный удел. В русском языке при описании самой процедуры естественно употребляется единственное число.
- source_word: ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν
  choice: жребий выпал Матфию
  rationale: Это обычное современное русское выражение для результата жеребьёвки; оно сохраняет метафору греческого текста.
- source_word: Μαθθίαν
  choice: Матфию
  rationale: Использована закрепившаяся в русской библейской традиции форма имени Матфий, здесь в дательном падеже.
- source_word: συγκατεψηφίσθη
  choice: был причислен
  rationale: Глагол означает, что человек был сочтён или поставлен в один ряд с определённой группой. «Был причислен» близко передаёт пассивную форму и не утверждает больше, чем сказано в тексте.
- source_word: μετὰ τῶν ἕνδεκα ἀποστόλων
  choice: к одиннадцати апостолам
  rationale: При русском глаголе «причислить» нормативно управление с предлогом «к». Смысл совместного счисления с уже существовавшей группой одиннадцати апостолов сохранён.
theological_decisions:
- issue: Следует ли передавать συγκατεψηφίσθη так, чтобы подразумевалось особое божественное или церковное назначение
  choice: был причислен к одиннадцати апостолам
  alternative: был добавлен к одиннадцати апостолам
  rationale: Выбранная формулировка сообщает о признанном результате выбора, но не привносит в стих более сильного утверждения о характере назначения, чем допускает греческий глагол.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Сохранена последовательность трёх греческих предложений, соединённых союзом «и», а также пассивная форма заключительного глагола.
