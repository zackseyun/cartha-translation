  yaml_path: translation/nt/acts/001/017.yaml
  text: For he was numbered among us and received a share in this ministry[a].
translation:
  language: ru
  text: потому что он был причислен к нам и получил долю в этом служении[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «получил жребий (назначенную долю) этого служения». Греческое слово κλῆρος может означать как «жребий», так и «долю, удел».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: В контексте союз вводит основание сказанного об Иуде; «потому что» ясно передаёт причинно-пояснительную связь.
- source_word: κατηριθμημένος ἦν
  choice: был причислен
  rationale: 'Перифрастическая конструкция передаёт устойчивое состояние: Иуда действительно считался членом апостольской группы. Пассивная форма сохранена.'
- source_word: ἐν ἡμῖν
  choice: к нам
  rationale: В сочетании «причислен к нам» естественно по-русски выражает включённость в число апостолов, а не просто нахождение рядом с ними.
- source_word: ἔλαχεν
  choice: получил
  rationale: Глагол может обозначать получение по жребию или доставшейся доли. Нейтральное «получил» не утверждает прямо процедуру бросания жребия, которой данный стих не описывает.
- source_word: τὸν κλῆρον
  choice: долю
  rationale: κλῆρος означает «жребий», а также доставшуюся или назначенную долю. В данном контексте «доля» естественно передаёт участие в служении; буквальная альтернатива отмечена в сноске.
- source_word: τῆς διακονίας ταύτης
  choice: в этом служении
  rationale: Сочетание «доля в этом служении» естественно для современного русского языка и сохраняет указание на конкретное апостольское служение.
theological_decisions:
- issue: Отношение Иуды к апостольскому служению
  choice: Иуда был действительно включён в число апостолов и имел долю в их служении.
  alternative: Ослабленное понимание как простого общения или внешней связи с группой.
  rationale: Фразы «был причислен к нам» и «получил долю» утверждают реальную включённость и участие, но текст сам по себе не выносит суждения о последующем постоянстве Иуды и не разрешает связанных с этим богословских вопросов.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Причислен» сохраняет умеренно торжественный регистр повествования, не становясь архаизмом; начальная строчная буква учитывает продолжение предшествующей синтаксической конструкции.
