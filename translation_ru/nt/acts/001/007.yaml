base_translation:
  language: en
  yaml_path: translation/nt/acts/001/007.yaml
  text: But he said to them[b][a], “It is not for you to know times or seasons that the Father has set by his own authority.”
translation:
  language: ru
  text: 'Он же сказал им: «Не вам знать времена или сроки[a], которые Отец установил Своей властью[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «периоды или назначенные времена». В греческом тексте употреблены два близких слова: χρόνοι — временные периоды, и καιροί — определённые или назначенные моменты.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в Своей власти». Этот оборот указывает, что Отец определил эти времена и сроки по Своему властному праву.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: же
  rationale: Передаёт мягкий переход и оттенок противопоставления ответу учеников без чрезмерно резкого «но».
- source_word: Οὐχ ὑμῶν ἐστιν γνῶναι
  choice: Не вам знать
  rationale: 'Естественная и лаконичная русская идиома, сохраняющая смысл: это знание не относится к сфере или праву учеников.'
- source_word: χρόνους
  choice: времена
  rationale: Передаёт временные периоды или продолжительность и сохраняет различие с καιρούς.
- source_word: καιροὺς
  choice: сроки
  rationale: Обозначает определённые или назначенные моменты; в сочетании «времена или сроки» звучит естественно и не превращает различие двух слов в жёсткую техническую систему.
- source_word: ὁ πατὴρ
  choice: Отец
  rationale: Сохраняет употреблённый в греческом тексте титул без добавления местоимения «Мой».
- source_word: ἔθετο
  choice: установил
  rationale: Передаёт значение установления или определения; русский совершенный вид выражает совершённое действие с сохраняющейся силой.
- source_word: ἐν τῇ ἰδίᾳ ἐξουσίᾳ
  choice: Своей властью
  rationale: Естественно выражает, что установление принадлежит собственной власти Отца, сохраняя ἰδίᾳ и значение ἐξουσία.
theological_decisions:
- issue: Передача пары χρόνοι / καιροί
  choice: времена или сроки
  alternative: периоды или назначенные времена
  rationale: Сохраняется различие двух близких временных понятий, но текст не навязывает им спекулятивное или строго систематизированное значение.
- issue: Значение ἐν τῇ ἰδίᾳ ἐξουσίᾳ
  choice: Своей властью
  alternative: в Своей власти
  rationale: Основной вариант естественно передаёт суверенное право Отца устанавливать эти времена и сроки; примечание сохраняет более буквальную пространственную форму греческого оборота.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и понятным синтаксисом. Заглавные буквы в «Отец» и «Своей» отражают титул и его отнесённость к Богу; архаизмы и конфессионально окрашенные уточнения не вводятся.
