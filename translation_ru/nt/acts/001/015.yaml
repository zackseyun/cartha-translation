    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: встал
  rationale: Причастие аориста обозначает конкретное действие Петра перед речью; «встал» естественно и точно передаёт ситуацию.
- source_word: ἐν μέσῳ
  choice: среди
  rationale: Передаёт положение Петра внутри собравшейся группы естественным современным русским языком.
- source_word: ἀδελφῶν
  choice: братьев
  rationale: Сохраняет грамматически мужскую форму исходного текста; возможный широкий контекстуальный смысл пояснён в сноске.
- source_word: ὄχλος ὀνομάτων
  choice: собравшихся было … человек
  rationale: Греческое выражение буквально говорит о «множестве имён», но здесь идиоматически обозначает число присутствующих людей; буквальное «множество имён» по-русски было бы неясным и неестественным.
- source_word: ἐπὶ τὸ αὐτό
  choice: собравшихся
  rationale: В данном контексте выражение указывает на совместное пребывание группы; значение включено в естественную русскую конструкцию.
- source_word: ὡς ἑκατὸν εἴκοσι
  choice: около ста двадцати
  rationale: ὡς перед числительным указывает на приблизительность; «около» ясно передаёт эту функцию.
- source_word: τε
  choice: а
  rationale: Частица связывает вводное замечание с повествованием; русское «а» естественно вводит поясняющую вставку.
theological_decisions:
- issue: Гендерный охват слова ἀδελφῶν применительно к собравшейся общине
  choice: В основном тексте — «братьев», со сноской о возможном включении женщин
  alternative: «братьев и сестёр» или «верующих»
  rationale: Основной текст сохраняет мужскую форму греческого слова и не устраняет его формальную особенность, а сноска отмечает вероятный инклюзивный смысл в этом контексте.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Пояснительная скобочная конструкция оригинала сохранена, но идиома ὄχλος ὀνομάτων передана естественно как указание на число собравшихся. Двоеточие после «сказал» подготавливает прямую речь следующего стиха.
