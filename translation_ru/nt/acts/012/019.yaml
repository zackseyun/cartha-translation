base_translation:
  language: en
  yaml_path: translation/nt/acts/012/019.yaml
  text: But Herod[a], after searching for him and not finding him, examined the guards and ordered them to be led away to execution. Then he went down from Judea to Caesarea and stayed there.
translation:
  language: ru
  text: Ирод искал Петра, но не нашёл его. Допросив стражников, он приказал увести их на казнь.[a] Затем он спустился из Иудеи в Кесарию и оставался там.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «приказал увести их». В данном контексте, вероятнее всего, имеется в виду, что их увели на казнь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιζητήσας αὐτὸν καὶ μὴ εὑρὼν
  choice: велел тщательно искать Петра, но его не нашли
  rationale: Причастия обозначают предшествующие поиски и их безрезультатность. Глагол ἐπιζητέω передаёт настойчивые поиски; перестройка в личную конструкцию естественна по-русски. Имя «Пётр» восстанавливает ясного референта местоимения из контекста.
- source_word: ἀνακρίνας
  choice: допросил
  rationale: В данном контексте речь идёт об официальном разбирательстве со стражниками; «допросил» яснее передаёт судебно-следственный оттенок, чем общее «расспросил».
- source_word: τοὺς φύλακας
  choice: стражников
  rationale: Обозначает людей, поставленных охранять заключённого; «стражники» — ясное и естественное русское соответствие.
- source_word: ἐκέλευσεν ἀπαχθῆναι
  choice: приказал увести их на казнь
  rationale: Буквально сказано «приказал увести», однако в повествовательном и историческом контексте это устойчиво подразумевает увод для казни. Дополнение «на казнь» делает смысл понятным, а буквальная форма отмечена в сноске.
- source_word: κατελθὼν ἀπὸ τῆς Ἰουδαίας εἰς Καισάρειαν
  choice: отправился из Иудеи в Кесарию
  rationale: Греческое «сойдя» отражает географическое движение к прибрежной Кесарии. В современном русском «отправился» звучит естественнее и не создаёт ложного впечатления пешего спуска.
- source_word: διέτριβεν
  choice: оставался там
  rationale: Имперфект передаёт продолжительное пребывание; «оставался там» сохраняет длительный характер действия.
theological_decisions:
- issue: Следует ли явно назвать казнь в передаче ἀπαχθῆναι
  choice: приказал увести их на казнь
  alternative: приказал увести их
  rationale: Сам глагол буквально означает увод, а не убийство, поэтому буквальный смысл сохранён в сноске. Вместе с тем контекст наказания стражи за исчезновение узника с высокой вероятностью указывает на казнь; основной текст передаёт этот подразумеваемый смысл, не заменяя его более категоричным «приказал казнить».
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Синтаксис греческих причастий перестроен ради естественного русского повествования; юридический оттенок ἀνακρίνας и длительность διέτριβεν сохранены.
