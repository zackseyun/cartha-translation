  yaml_path: translation/nt/acts/012/022.yaml
  text: And the crowd kept shouting[a], “The voice of a god, and not of a man!”
translation:
  language: ru
  text: 'А толпа всё кричала: «Это голос бога, а не человека!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Это голос Бога, а не человека!» Греческий текст допускает такое понимание, однако в данном контексте вероятнее «голос бога»: языческая толпа воздавала Ироду божественные почести.'
    reason: alternative_reading
lexical_decisions:
- source_word: δῆμος
  choice: народ
  rationale: Здесь слово обозначает собравшуюся публику; «народ» естественно передаёт публичное одобрение толпы, не подразумевая формального политического собрания.
- source_word: ἐπεφώνει
  choice: всё кричал
  rationale: Имперфект выражает продолжавшееся или повторявшееся действие; оборот «всё кричал» передаёт эту длительность.
- source_word: Θεοῦ
  choice: бога
  rationale: В языческом контексте чествования Ирода существительное без артикля естественнее понимать неопределённо — «бога», а не как прямое указание на Бога Израиля.
- source_word: φωνὴ
  choice: голос
  rationale: Сохраняет именную и восклицательную форму греческой фразы и прямое противопоставление человеческому голосу.
- source_word: ἀνθρώπου
  choice: человека
  rationale: Сохраняет прямое сопоставление «бога» и «человека» без пояснительного перефразирования.
theological_decisions:
- issue: Следует ли передать Θεοῦ как «Бога» или «бога»
  choice: бога
  alternative: Бога
  rationale: Контекст описывает языческое обожествляющее приветствие Ироду, а отсутствие артикля допускает неопределённое значение. Вариант «бога» лучше отражает историко-религиозную ситуацию, не создавая впечатления, будто толпа исповедовала Бога Израиля.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, восклицательная и торжественно-льстивая. Частица «всё» передаёт продолженность выкриков, а указательное «это» делает безглагольное греческое восклицание естественным по-русски.
