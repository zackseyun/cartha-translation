source:
  edition: SBLGNT
  text: Ἦν ⸀δὲ θυμομαχῶν Τυρίοις καὶ Σιδωνίοις· ὁμοθυμαδὸν δὲ παρῆσαν πρὸς αὐτόν, καὶ πείσαντες Βλάστον τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως ᾐτοῦντο εἰρήνην διὰ τὸ τρέφεσθαι αὐτῶν τὴν χώραν ἀπὸ τῆς βασιλικῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/020.yaml
  text: He was very angry with the Tyrians and Sidonians[a]. But they came to him with one accord, and after persuading Blastus, the king’s chamberlain, they were asking for peace[d][c][b], because their country was fed from the king’s domain.
translation:
  language: ru
  text: Ирод был крайне разгневан на жителей Тира и Сидона[a]. Они же сообща явились к нему и, убедив Власта, царского постельничего[b], просили о мире, потому что их область получала продовольствие из царских владений[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «относился враждебно к жителям Тира и Сидона». Греческое слово выражает сильный гнев или враждебность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «того, кто над царской опочивальней»; вероятно, это был придворный, имевший доступ в личные покои царя.'
    reason: cultural_note
  - marker: c
    text: 'Или: «потому что их земля снабжалась продовольствием из царской области».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμομαχῶν
  choice: был крайне разгневан на
  rationale: Причастие обозначает сильный гнев, доходящий до враждебности. Выбранная формулировка естественна по-русски и сохраняет интенсивность выражения.
- source_word: Τυρίοις καὶ Σιδωνίοις
  choice: на жителей Тира и Сидона
  rationale: Греческие этниконы обозначают население этих двух городов; описательная передача яснее и естественнее в современном русском.
- source_word: ὁμοθυμαδόν
  choice: сообща
  rationale: Наречие выражает согласованность намерения и совместность действий, а не только одновременное присутствие.
- source_word: παρῆσαν πρὸς αὐτόν
  choice: явились к нему
  rationale: Передаёт прибытие или появление перед правителем в достаточно dignified современном регистре.
- source_word: πείσαντες
  choice: склонив на свою сторону
  rationale: Передаёт предшествующее действие и вероятный смысл привлечения влиятельного придворного к поддержке их прошения, не уточняя средства убеждения.
- source_word: Βλάστον
  choice: Власта
  rationale: Традиционная русская библейская передача имени Βλάστος; падежная форма обусловлена синтаксисом.
- source_word: τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως
  choice: царского постельничего
  rationale: Краткое историческое название придворного, ведавшего царской опочивальней и имевшего доступ к личным покоям царя; культурное значение пояснено в сноске.
- source_word: ᾐτοῦντο εἰρήνην
  choice: просили о мире
  rationale: Имперфект допускает продолженное или настойчивое прошение; русская форма естественно выражает дипломатическое обращение, не утверждая, что мир уже был предоставлен.
- source_word: διὰ τὸ τρέφεσθαι
  choice: потому что ... получала продовольствие
  rationale: Конструкция указывает причину, а пассивный инфинитив в контексте означает обеспечение пищей или снабжение продовольствием.
- source_word: αὐτῶν τὴν χώραν
  choice: их область
  rationale: χώρα может обозначать землю, область или территорию; «область» не навязывает современного представления о суверенном государстве.
- source_word: ἀπὸ τῆς βασιλικῆς
  choice: из царских владений
  rationale: Субстантивированное прилагательное обозначает принадлежащую царю территорию; множественное «владения» идиоматично по-русски и сохраняет геополитико-экономический смысл.
