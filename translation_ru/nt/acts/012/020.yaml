translation_notes:
  register: 'Современный литературный русский язык с умеренно высоким повествовательным регистром. Имя «Ирод» восстановлено из ближайшего контекста как естественный русский субъект местоименно подразумеваемого греческого предложения. Союзы δέ переданы контрастивно только там, где это естественно: первое δέ не воспроизведено отдельным вводным словом, второе передано как «же». Сноски размещены непосредственно после соответствующих выражений.'
