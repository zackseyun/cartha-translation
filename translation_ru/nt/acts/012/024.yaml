  text: А слово Божье росло и умножалось[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «А Божья весть росла и умножалась».'
    reason: Лексическая альтернатива для λόγος; «весть» уточняет смысл возвещаемого сообщения, тогда как основной текст сохраняет устойчивую формулу «слово Божье».
lexical_decisions:
- source_word: λόγος
  choice: слово
  rationale: Сохраняет характерное для Луки выражение «слово Божье» и его широкий смысл — возвещаемую Божью весть; вариант «весть» поясняет значение, но ослабляет межтекстовую связь.
- source_word: τοῦ θεοῦ
  choice: Божье
  rationale: Естественная русская передача родительного падежа, указывающего на принадлежность или источник слова.
- source_word: ηὔξανεν
  choice: продолжало расти
  rationale: Имперфект передаёт длительное, развивающееся действие; «продолжало расти» естественно выражает этот оттенок.
- source_word: ἐπληθύνετο
  choice: распространяться
  rationale: Буквально глагол означает «умножаться», однако применительно к слову по-русски естественнее «распространяться»; это сохраняет отличие от предшествующего «расти» и передаёт расширение охвата возвещения.
- source_word: δὲ
  choice: А
  rationale: Частица отмечает контраст с гибелью Ирода в предыдущем эпизоде; русское «А» передаёт его естественно и без чрезмерно резкого противопоставления.
theological_decisions:
- issue: Передавать ли «слово Божье» более динамично как «Божья весть»
  choice: слово Божье
  alternative: Божья весть
  rationale: Традиционное и понятное выражение сохраняет повторяющуюся у Луки формулу и её более широкие библейские ассоциации, не сводя λόγος только к содержанию сообщения.
translation_notes:
  register: Современный литературный русский язык; тон краткий и повествовательный. Выражение «слово Божье» сохраняет достоинство и знакомую библейскую формулу, а «распространяться» избегает неестественного для современного русского сочетания «слово умножалось».
