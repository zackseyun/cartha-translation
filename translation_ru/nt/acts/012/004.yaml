  text: ὃν καὶ πιάσας ἔθετο εἰς φυλακήν, παραδοὺς τέσσαρσιν τετραδίοις στρατιωτῶν φυλάσσειν αὐτόν, βουλόμενος μετὰ τὸ πάσχα ἀναγαγεῖν αὐτὸν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/004.yaml
  text: After arresting him[a], he put him in prison, handing him over to four squads of soldiers to guard him[b], intending to bring him out to the people after the Passover.
translation:
  language: ru
  text: Схватив Петра, Ирод посадил его в тюрьму, передав под охрану четырёх отрядов, по четыре воина в каждом[a]. После Пасхи[b] он намеревался вывести его к народу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «четырём четверицам воинов», то есть четырём группам по четыре воина.'
    reason: lexical_alternative
  - marker: b
    text: Здесь имеется в виду иудейская Пасха.
    reason: historical_clarification
lexical_decisions:
- source_word: πιάσας
  choice: схватив
  rationale: Аористное причастие обозначает действие, предшествующее заключению в тюрьму. «Схватив» естественно передаёт насильственное задержание.
- source_word: ἔθετο εἰς φυλακήν
  choice: посадил его в тюрьму
  rationale: Современное русское идиоматическое выражение точно передаёт заключение под стражу и сохраняет повествовательный регистр.
- source_word: παραδοὺς
  choice: поручил
  rationale: В данном контексте речь идёт о передаче заключённого под охрану воинов. «Поручил… стеречь» звучит естественно и ясно выражает эту функцию.
- source_word: τέσσαρσιν τετραδίοις στρατιωτῶν
  choice: четырём отрядам по четыре воина
  rationale: τετράδιον — группа из четырёх человек; перевод прямо передаёт как число групп, так и их состав.
- source_word: φυλάσσειν αὐτόν
  choice: стеречь его
  rationale: Инфинитив выражает цель передачи воинам; «стеречь» кратко и точно передаёт охрану заключённого.
- source_word: βουλόμενος
  choice: намеревался
  rationale: Передаёт обдуманное намерение Ирода, не добавляя эмоциональной окраски.
- source_word: μετὰ τὸ πάσχα
  choice: после Пасхи
  rationale: πάσχα обозначает иудейскую Пасху; временная конструкция естественно передана по-русски.
- source_word: ἀναγαγεῖν αὐτὸν τῷ λαῷ
  choice: вывести Петра к народу
  rationale: Глагол в данном публично-судебном контексте означает вывести или представить человека народу. Формулировка не уточняет сверх текста, предполагался ли суд, приговор или казнь.
- source_word: λαῷ
  choice: к народу
  rationale: Сохраняет широкое обозначение народа как публично собравшегося сообщества.
theological_decisions:
- issue: Значение πάσχα
  choice: Пасха — иудейский праздник
  alternative: Христианская Пасха
  rationale: Греческое πάσχα в данном историческом контексте обозначает иудейскую Пасху. Примечание предотвращает возможное современное русское понимание слова исключительно как названия христианского праздника.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Имена Петра и Ирода раскрывают местоименные отсылки, очевидные из ближайшего контекста, и устраняют неестественную для отдельного русского стиха двусмысленность. Судебный характер намерения Ирода не конкретизирован сверх греческого текста.
