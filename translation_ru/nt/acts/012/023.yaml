  source_fidelity: 'Перевод точно передаёт все основные элементы греческого текста: немедленность действия (παραχρῆμα), поражение ангелом Господним, причинное основание суда, отказ воздать славу Богу, состояние, обозначенное σκωληκόβρωτος, и последующую смерть. Формулировка «изъеденный червями» естественно выражает смысл этого редкого сложного слова, не навязывая медицинского объяснения или чрезмерно точной хронологии.'
