id: ACT.12.23
reference: Acts 12:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: παραχρῆμα δὲ ἐπάταξεν αὐτὸν ἄγγελος κυρίου ἀνθ’ ὧν οὐκ ἔδωκεν ⸀τὴν δόξαν τῷ θεῷ, καὶ γενόμενος σκωληκόβρωτος ἐξέψυξεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/023.yaml
  text: Immediately an angel of the Lord struck him[a], because he did not give the glory to God, and becoming worm-eaten[c][b], he died.
translation:
  language: ru
  text: И тотчас ангел Господень поразил его за то, что он не воздал славу Богу; и, изъеденный червями, он умер.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «испустил дух».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: тотчас
  rationale: Передаёт действие без промедления и сохраняет внезапность суда; это естественное и литературное современное русское слово.
- source_word: ἐπάταξεν
  choice: поразил
  rationale: Глагол обозначает удар или поражение. «Поразил» уместно в контексте Божьего суда и не утверждает само по себе, что смерть наступила в тот же миг, поскольку далее она названа отдельно.
- source_word: ἄγγελος κυρίου
  choice: ангел Господень
  rationale: Безартиклевое греческое выражение не требует определённости; в русском языке традиционная и естественная форма «ангел Господень» также сама по себе не отождествляет его с каким-либо ранее названным ангелом.
- source_word: ἀνθ’ ὧν
  choice: за то, что
  rationale: Ясно передаёт причинное основание наказания и в данном контексте естественнее буквального «в воздаяние за то, что».
- source_word: οὐκ ἔδωκεν τὴν δόξαν τῷ θεῷ
  choice: не воздал славу Богу
  rationale: Устойчиво и точно выражает непризнание славы, принадлежащей Богу, сохраняя направленность действия к Богу.
- source_word: γενόμενος σκωληκόβρωτος
  choice: изъеденный червями
  rationale: Передаёт яркий смысл сложного прилагательного и связанную с причастием последовательность, не вводя медицинского объяснения.
- source_word: ἐξέψυξεν
  choice: умер
  rationale: Естественный современный эквивалент глагола со значением «испустить дух, умереть»; более буквальная образность отмечена в сноске.
theological_decisions:
- issue: Характер и последовательность суда
  choice: Смерть Ирода представлена как Божий суд, совершённый через ангела, однако перевод не уточняет медицинский механизм и точную длительность процесса.
  alternative: Представить смерть как мгновенный результат удара ангела либо как исключительно естественную смерть.
  rationale: Текст прямо называет действующим лицом ангела Господня и указывает причину наказания, но сочетание причастия «изъеденный червями» с последующим глаголом «умер» не даёт основания для более точной временной или медицинской реконструкции.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Ангел Господень» и «воздал славу Богу» сохраняют узнаваемый библейский регистр, не становясь архаичными; графическая сила σκωληκόβρωτος передана выражением «изъеденный червями».
