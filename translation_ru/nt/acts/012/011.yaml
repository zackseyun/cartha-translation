id: ACT.12.11
reference: Acts 12:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ὁ Πέτρος ⸂ἐν ἑαυτῷ γενόμενος⸃ εἶπεν· Νῦν οἶδα ἀληθῶς ὅτι ἐξαπέστειλεν ⸀ὁ κύριος τὸν ἄγγελον αὐτοῦ καὶ ἐξείλατό με ἐκ χειρὸς Ἡρῴδου καὶ πάσης τῆς προσδοκίας τοῦ λαοῦ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/011.yaml
  text: And Peter[a], coming to himself, said[c][b], “Now I truly know that the Lord sent his angel and rescued me from Herod’s hand and from all the expectation of the people of the Jews.”
translation:
  language: ru
  text: 'И Пётр, придя в себя[a], сказал: «Теперь я точно знаю, что Господь послал своего ангела и избавил меня от руки Ирода[b] и от всего, чего ожидал иудейский народ[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «опомнившись».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «от руки Ирода» означает «от власти Ирода».
    reason: cultural_note
  - marker: c
    text: 'Букв.: «от всего ожидания иудейского народа»; то есть от всего того, что народ ожидал увидеть совершившимся над Петром.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑαυτῷ γενόμενος
  choice: придя в себя
  rationale: Естественное русское соответствие идиоме, обозначающей возвращение Петра к полному осознанию происходящего; при этом сохраняется образ греческого выражения.
- source_word: ἀληθῶς
  choice: точно
  rationale: В сочетании «точно знаю» передаёт уверенность и подчёркнутое осознание Петра на естественном современном русском языке.
- source_word: ἐξαπέστειλεν
  choice: послал
  rationale: Контекст не требует отдельно передавать приставочное значение «выслал»; «послал» ясно и точно выражает действие.
- source_word: κύριος
  choice: Господь
  rationale: Сохраняет неуточнённое обозначение исходного текста, не определяя его референта как Бога или воскресшего Иисуса.
- source_word: ἄγγελον
  choice: ангела
  rationale: В повествовательном контексте речь явно идёт о небесном существе, а не просто о человеческом посланнике.
- source_word: ἐξείλατό με
  choice: избавил меня
  rationale: Передаёт спасительное освобождение от опасности и власти Ирода; это естественная библейская, но понятная современная формулировка.
- source_word: ἐκ χειρὸς Ἡρῴδου
  choice: от руки Ирода
  rationale: Сохраняет исходный образ руки как власти или контроля; значение разъясняется в сноске.
- source_word: πάσης τῆς προσδοκίας
  choice: от всего, чего ожидал
  rationale: Буквальное «от всего ожидания» по-русски неестественно. Выбранная формулировка передаёт ожидаемый народом исход, не уточняя сверх текста, каким именно он должен был быть.
- source_word: τοῦ λαοῦ τῶν Ἰουδαίων
  choice: иудейский народ
  rationale: Естественно и точно передаёт греческую родительную конструкцию без тяжеловесного «народ иудеев».
theological_decisions:
- issue: Референт κύριος
  choice: Господь
  alternative: Бог; воскресший Иисус
  rationale: Греческий текст не уточняет референта. Перевод «Господь» сохраняет эту богословскую открытость и не разрешает её в пользу одного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской образностью. Синтаксис остаётся прозрачным для широкого читателя; идиома «от руки Ирода» сохранена ради образа исходного текста и пояснена в сноске. Местоимение «своего» не получает почтительного прописного написания, поскольку оно не выражено как отдельное богословское уточнение.
