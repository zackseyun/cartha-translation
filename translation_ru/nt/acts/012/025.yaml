  text: Βαρναβᾶς δὲ καὶ Σαῦλος ὑπέστρεψαν, ⸀εἰς Ἰερουσαλὴμ πληρώσαντες τὴν διακονίαν, ⸀συμπαραλαβόντες Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/025.yaml
  text: But Barnabas and Saul returned to Jerusalem after completing the ministry, taking along John, who was called Mark.
translation:
  language: ru
  text: Варнава же и Савл возвратились в Иерусалим[a], завершив служение, и взяли с собой Иоанна, прозванного Марком.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «из Иерусалима» вместо «в Иерусалим».'
    reason: textual_variant
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: возвратились
  rationale: Аорист ὑποστρέφω обычно означает «возвратиться, вернуться»; «возвратились» естественно и достойно звучит в повествовании.
- source_word: εἰς Ἰερουσαλήμ
  choice: в Иерусалим
  rationale: Предлог εἰς в представленном тексте SBLGNT имеет обычное направительное значение «в, к»; значимое разночтение отражено в сноске.
- source_word: πληρώσαντες τὴν διακονίαν
  choice: завершив служение
  rationale: πληρόω здесь передаёт завершение порученного дела, а διακονία — служение; формулировка сохраняет широту греческого выражения, не уточняя его как помощь нуждающимся непосредственно в основном тексте.
- source_word: συμπαραλαβόντες
  choice: и взяли с собой
  rationale: Причастие обозначает сопутствующее действие — взять человека с собой; сочинительная конструкция естественна по-русски и ясно передаёт последовательность.
- source_word: Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον
  choice: Иоанна, прозванного Марком
  rationale: Пассивное ἐπικληθέντα указывает на дополнительное имя, которым его называли; «прозванного Марком» кратко и естественно различает два имени.
theological_decisions:
- issue: Текстуальное разночтение в указании направления возвращения
  choice: в Иерусалим
  alternative: из Иерусалима
  rationale: Предоставленный текст SBLGNT читает εἰς Ἰερουσαλήμ («в Иерусалим»), поэтому основной текст следует ему, хотя вариант ἐξ Ἰερουσαλήμ («из Иерусалима») лучше согласуется с ближайшим повествовательным контекстом. Разночтение сохранено в сноске без его молчаливого разрешения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Служение» сохраняет широкое значение διακονία; контекстуальное уточнение «служение помощи» намеренно не внесено. Частица «же» передаёт δέ без чрезмерного противопоставления.
