  source_fidelity: 'Текст точно передаёт чтение SBLGNT: «возвратились в Иерусалим» соответствует εἰς Ἰερουσαλήμ; аорист ὑπέστρεψαν передан естественно. «Завершив служение» адекватно передаёт πληρώσαντες τὴν διακονίαν без неоправданного сужения до благотворительной помощи. «Взяли с собой Иоанна, прозванного Марком» верно отражает συμπαραλαβόντες Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον.'
