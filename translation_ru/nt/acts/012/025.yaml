  terminology: «Служение» — удачный широкий эквивалент διακονία в данном контексте. Имена «Варнава», «Савл», «Иоанн» и «Марк» переданы в устоявшейся русской библейской форме; «прозванного Марком» корректно передаёт дополнительное имя.
