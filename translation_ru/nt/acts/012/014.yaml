  text: καὶ ἐπιγνοῦσα τὴν φωνὴν τοῦ Πέτρου ἀπὸ τῆς χαρᾶς οὐκ ἤνοιξεν τὸν πυλῶνα, εἰσδραμοῦσα δὲ ἀπήγγειλεν ἑστάναι τὸν Πέτρον πρὸ τοῦ πυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/014.yaml
  text: And when she recognized Peter’s voice[a], because of her joy she did not open the gate[b], but ran in and reported that Peter was standing at the gate.
translation:
  language: ru
  text: Узнав голос Петра, она от радости не открыла ворот[a], а вбежала внутрь и сообщила, что Пётр стоит у ворот[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вход» или «наружная дверь». Греческое слово πυλών обозначает внешний вход с улицы на территорию дома.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сообщила, что Пётр стоит перед воротами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοῦσα τὴν φωνὴν τοῦ Πέτρου
  choice: узнав голос Петра
  rationale: Причастие аориста передаёт состоявшееся узнавание по голосу; русское «узнав» естественно связывает его с последующим действием.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: от радости
  rationale: Предложное сочетание выражает причину; «от радости» кратко и естественно передаёт её по-русски.
- source_word: οὐκ ἤνοιξεν
  choice: не открыла
  rationale: Глагол означает «открывать»; уточнение «не отперла» не требуется источником.
- source_word: πυλῶνα / πυλῶνος
  choice: наружную дверь / у входа
  rationale: В домашнем контексте πυλών обозначает выходящий на улицу вход, ворота или наружную дверь. Контекстуально естественные русские соответствия избегают ошибочного образа обычной внутренней двери.
- source_word: εἰσδραμοῦσα
  choice: вбежала в дом
  rationale: Глагол передаёт быстрое движение внутрь. Добавление «в дом» естественно обозначает подразумеваемое направление, не меняя смысла.
- source_word: ἀπήγγειλεν
  choice: сообщила
  rationale: Нейтральное повествовательное слово передаёт значение «известила, объявила» без излишней торжественности.
- source_word: ἑστάναι
  choice: стоит
  rationale: Перфектный инфинитив имеет результативно-стативный смысл; в зависимой речи русское настоящее время естественно передаёт, что Пётр в тот момент находится там.
- source_word: πρὸ τοῦ πυλῶνος
  choice: у входа
  rationale: πρό с родительным указывает на положение перед входом; «у входа» идиоматично передаёт эту локализацию, а буквальная форма отмечена в сноске.
