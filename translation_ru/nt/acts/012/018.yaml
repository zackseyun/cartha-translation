  source_fidelity: Текст точно передаёт временной генитивный абсолют («Когда же настал день»), литоту τάραχος οὐκ ὀλίγος («немалый переполох»), круг лиц, среди которых возникло смятение, и идиому τί ἄρα … ἐγένετο («что же стало с Петром?»). Вопросительное оформление после двоеточия естественно передаёт содержание недоумения воинов и не сужает смысл до конкретной версии произошедшего.
  naturalness: Фраза звучит естественно на современном литературном русском. «Поднялся немалый переполох» и «что стало с Петром?» ясны и стилистически уместны. «Воины» несколько возвышеннее, чем «солдаты», но допустимо в умеренно библейском регистре и не нарушает смысла.
  terminology: «Пётр» передан в нормативной русской библейской форме. «Воины» является прямым, не чрезмерно контекстуализированным соответствием στρατιῶται; терминологических или богословских проблем нет.
