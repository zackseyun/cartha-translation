  text: Γενομένης δὲ ἡμέρας ἦν τάραχος οὐκ ὀλίγος ἐν τοῖς στρατιώταις, τί ἄρα ὁ Πέτρος ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/018.yaml
  text: When day came[a], there was no small disturbance among the soldiers over what had become of Peter.
translation:
  language: ru
  text: 'Когда же настал день, среди воинов поднялся немалый переполох: что же стало с Петром?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Когда же настал день
  rationale: Генитив абсолютный передан естественной временной конструкцией; «же» сохраняет переходную функцию δέ, не добавляя отсутствующего в греческом наречия «теперь».
- source_word: τάραχος οὐκ ὀλίγος
  choice: поднялся немалый переполох
  rationale: «Немалый» сохраняет литоту οὐκ ὀλίγος, а «переполох» естественно передаёт сильное замешательство и тревогу в данной ситуации.
- source_word: ἐν τοῖς στρατιώταις
  choice: среди воинов
  rationale: Предлог ἐν обозначает круг людей, внутри которого возник переполох; στρατιώταις передано прямым соответствием «воины», без контекстуального сужения до «стражников».
- source_word: τί ἄρα
  choice: что же
  rationale: Форма косвенного вопроса и оттенок недоумения, вносимый ἄρα, естественно выражены частицей «же»; двоеточие вводит содержание тревожного вопроса.
- source_word: ὁ Πέτρος
  choice: Петром
  rationale: Имя передано в принятой русской библейской форме и поставлено в творительный падеж по норме оборота «что стало с…».
- source_word: ἐγένετο
  choice: стало с
  rationale: В сочетании τί … ἐγένετο речь идёт о том, что произошло с человеком или куда он исчез; русский идиоматический оборот «что стало с Петром» сохраняет эту смысловую широту.
