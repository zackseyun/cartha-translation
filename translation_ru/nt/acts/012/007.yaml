  text: καὶ ἰδοὺ ἄγγελος κυρίου ἐπέστη, καὶ φῶς ἔλαμψεν ἐν τῷ οἰκήματι· πατάξας δὲ τὴν πλευρὰν τοῦ Πέτρου ἤγειρεν αὐτὸν λέγων· Ἀνάστα ἐν τάχει· καὶ ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/007.yaml
  text: And behold[a], an angel of the Lord stood near, and a light shone in the cell. Striking Peter on the side, he woke him, saying[b], “Get up quickly.” And his chains fell off from his hands.
translation:
  language: ru
  text: 'И вот, рядом появился ангел Господа[a], и в помещении[b] засиял свет. Ударив Петра в бок, ангел разбудил его и сказал: «Вставай скорее!» И цепи упали с его рук.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол может означать «встал рядом», «предстал» или «внезапно появился».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в комнате», «в покое». Греческое слово имеет более общее значение; в данном тюремном контексте возможно «в темнице».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: и вот
  rationale: Передаёт указательно-повествовательную силу частицы и сохраняет живость рассказа естественным для современного русского способом.
- source_word: ἄγγελος κυρίου
  choice: ангел Господа
  rationale: Естественно передаёт родительную конструкцию, сохраняя смысл ангела, принадлежащего Господу или посланного Им.
- source_word: ἐπέστη
  choice: рядом внезапно появился
  rationale: Совмещает пространственную близость со свойственным глаголу оттенком внезапного появления; неоднозначность отмечена в сноске.
- source_word: φῶς ἔλαμψεν
  choice: засиял свет
  rationale: Прямое и естественное соответствие существительного с глаголом, передающее возникновение света в помещении.
- source_word: ἐν τῷ οἰκήματι
  choice: в темнице
  rationale: Общее обозначение помещения конкретизировано тюремным контекстом; вариант «в помещении» отмечен в сноске.
- source_word: πατάξας τὴν πλευρὰν
  choice: ударив Петра в бок
  rationale: Сохраняет более сильное значение физического воздействия, а не ослабляет его до «толкнув»; русское управление естественно передаёт объект и часть тела.
- source_word: ἤγειρεν αὐτόν
  choice: разбудил его
  rationale: Контекст сна Петра определяет здесь значение ἐγείρω как пробуждение.
- source_word: Ἀνάστα ἐν τάχει
  choice: Скорее вставай!
  rationale: Естественная современная команда, сохраняющая срочность греческого выражения.
- source_word: ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν
  choice: цепи упали с его рук
  rationale: Близко передаёт внезапное отпадение цепей и сохраняет буквальное χείρ «руки», не заменяя его более конкретным «запястья».
theological_decisions:
- issue: Передача κύριος в выражении ἄγγελος κυρίου
  choice: Господь
  alternative: Владыка
  rationale: «Господь» соответствует устойчивому новозаветному употреблению и не добавляет к исходной конструкции частного конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оборотом «И вот». Для ясности субъект «ангел» повторён перед «разбудил», поскольку русская цепочка деепричастия и местоимения иначе может звучать менее ясно. «Темница» сохраняет достоинство регистра и точно подходит к тюремному контексту, хотя греческое слово само по себе обозначает помещение более широко.
