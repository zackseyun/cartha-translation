id: ACT.12.15
reference: Acts 12:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἱ δὲ πρὸς αὐτὴν εἶπαν· Μαίνῃ. ἡ δὲ διϊσχυρίζετο οὕτως ἔχειν. οἱ δὲ ἔλεγον· Ὁ ἄγγελός ⸂ἐστιν αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/015.yaml
  text: But they said to her[a], “You are out of your mind.” But she kept insisting that it was so. And they kept saying, “It is his angel.”
translation:
  language: ru
  text: 'Они же сказали ей: «Ты не в своём уме». Но она продолжала настаивать, что всё так и есть. А они твердили: «Это его ангел[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «его ангел-хранитель», «представляющий его ангел» или, по мнению некоторых толкователей, «его дух (призрак)». По-гречески сказано просто: «его ангел».'
    reason: alternative_reading
lexical_decisions:
- source_word: Μαίνῃ
  choice: Ты не в своём уме
  rationale: Естественная современная русская идиома, передающая резкое обвинение в безумии без архаического или клинического оттенка.
- source_word: διϊσχυρίζετο
  choice: продолжала настаивать
  rationale: Имперфект передаёт длительное действие, а значение глагола — настойчивое утверждение.
- source_word: οὕτως ἔχειν
  choice: что всё так и есть
  rationale: Естественно передаёт идиому со значением «что дело обстоит именно так».
- source_word: ἔλεγον
  choice: твердили
  rationale: Имперфект указывает на продолжавшуюся или повторявшуюся речь; «твердили» кратко выражает эту настойчивую повторяемость.
- source_word: ἄγγελός
  choice: ангел
  rationale: В контексте наиболее вероятно обозначение сверхъестественного вестника; буквальное «ангел» сохраняет неопределённость выражения.
- source_word: αὐτοῦ
  choice: его
  rationale: Естественная передача родительного местоимения в сочетании «его ангел».
theological_decisions:
- issue: Значение выражения «его ангел»
  choice: его ангел
  alternative: его ангел-хранитель; представляющий его ангел; его дух/призрак
  rationale: Греческий текст не уточняет характер связи ангела с Петром. Буквальная передача сохраняет богословскую неопределённость, а возможные толкования вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и естественное, с сохранением длительности действий, выраженной греческими имперфектами. Формулировка «его ангел» намеренно не конкретизирована.
