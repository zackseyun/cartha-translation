base_translation:
  language: en
  yaml_path: translation/nt/acts/012/021.yaml
  text: On an appointed day[a], Herod, having put on royal clothing and having sat down on the tribunal[b], was delivering a public address to them.
translation:
  language: ru
  text: В назначенный день Ирод облачился в царское одеяние[a], сел на возвышении[b] и выступал перед ними с публичной речью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царские одежды». Греческое слово может обозначать одежду или наряд вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на судейском месте». Греческое слово βῆμα может обозначать официальное место либо приподнятый помост, в том числе судейский.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τακτῇ ... ἡμέρᾳ
  choice: в назначенный день
  rationale: Передаёт установленный, заранее определённый день естественным современным русским выражением.
- source_word: ἐνδυσάμενος
  choice: облачился
  rationale: Аористное причастие обозначает предшествующее действие; личная форма в последовательном русском повествовании звучит естественнее и сохраняет порядок действий.
- source_word: ἐσθῆτα βασιλικὴν
  choice: царское одеяние
  rationale: Сохраняет собирательное значение ἐσθής и царственный характер одежды, не уточняя без необходимости её конкретный вид.
- source_word: καθίσας
  choice: сел
  rationale: Передаёт следующее завершённое действие в последовательности, избегая тяжеловесной цепочки деепричастий.
- source_word: ἐπὶ τοῦ βήματος
  choice: на возвышении
  rationale: βῆμα может обозначать официальное возвышение или помост с местом для правителя либо судьи; контекст публичной речи не требует однозначно судебного значения.
- source_word: ἐδημηγόρει
  choice: обратился ... с публичной речью
  rationale: δημηγορέω означает выступать перед народным собранием; перевод ясно передаёт публичный и официальный характер речи.
- source_word: πρὸς αὐτούς
  choice: к ним
  rationale: Естественно передаёт направленность речи к собравшимся.
