base_translation:
  language: en
  yaml_path: translation/nt/acts/012/009.yaml
  text: And he went out and followed[a], and he did not know that what was happening through the angel was real, but thought he was seeing a vision.
translation:
  language: ru
  text: Пётр вышел и следовал за ним; он не знал, что происходящее через ангела[a] было реальностью, а думал, что видит видение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ангелом». Греческое διά с родительным падежом может выражать действие посредством или при посредстве ангела.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Выйдя
  rationale: Деепричастие естественно передаёт предшествующее действие аористного причастия и сохраняет связь с последующим движением.
- source_word: ἠκολούθει
  choice: последовал за ним
  rationale: Глагол «последовать» естественен в русском повествовании; дополнение «за ним» ясно выражает направление следования, определяемое контекстом.
- source_word: οὐκ ᾔδει
  choice: не понимая
  rationale: В данном контексте речь идёт о неосознании действительности происходящего; «не понимая» естественно сочетается с русской структурой предложения.
- source_word: ἀληθές ἐστιν
  choice: было на самом деле
  rationale: Оборот передаёт реальность события в противопоставлении видению и звучит естественнее буквального «истинно».
- source_word: τὸ γινόμενον
  choice: происходящее
  rationale: Субстантивированное причастие передаёт событие в процессе и соответствует греческой форме.
- source_word: διὰ τοῦ ἀγγέλου
  choice: через ангела
  rationale: «Через» сохраняет значение опосредованного действия у διά с родительным падежом, не исключая агентного оттенка.
- source_word: ἐδόκει
  choice: он думал
  rationale: Передаёт субъективное представление Петра без неестественного буквального оборота.
- source_word: ὅραμα
  choice: видение
  rationale: Обычное и точное русское обозначение воспринимаемого сверхъестественного зрелища.
- source_word: βλέπειν
  choice: видит
  rationale: В зависимой конструкции после глагола мысли настоящее время естественно передаёт одновременное переживание.
theological_decisions:
- issue: Характер действия ангела
  choice: через ангела
  alternative: ангелом
  rationale: Так сохраняется опосредующий оттенок διά с родительным падежом и не вносится дополнительное утверждение о самостоятельной силе или роли ангела.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Имя «Пётр» восстановлено из ближайшего контекста вместо местоимения, чтобы по-русски избежать неясности при двух мужских участниках; «за ним» относится к ангелу. Подлинная смысловая напряжённость между реальным событием и предполагаемым видением сохранена.
