id: ACT.12.10
reference: Acts 12:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διελθόντες δὲ πρώτην φυλακὴν καὶ δευτέραν ἦλθαν ἐπὶ τὴν πύλην τὴν σιδηρᾶν τὴν φέρουσαν εἰς τὴν πόλιν, ἥτις αὐτομάτη ἠνοίγη αὐτοῖς, καὶ ἐξελθόντες προῆλθον ῥύμην μίαν, καὶ εὐθέως ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/010.yaml
  text: After they had passed the first guard and the second[a], they came to the iron gate leading into the city, which opened to them by itself; and after they went out, they went along one street[b], and immediately the angel departed from him.
translation:
  language: ru
  text: Пройдя первый и второй посты стражи, они подошли к железным воротам, ведущим в город. Ворота сами собой отворились перед ними. Выйдя, они прошли одну улицу[a], и тотчас ангел отошёл от него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть, вероятно, они прошли расстояние в одну улицу.
    reason: cultural_note
lexical_decisions:
- source_word: διελθόντες
  choice: Пройдя
  rationale: Деепричастие естественно передаёт предшествующее действие аористного причастия и сохраняет быстрый ход повествования.
- source_word: πρώτην φυλακὴν καὶ δευτέραν
  choice: первый и второй посты стражи
  rationale: В данном контексте φυλακή обозначает последовательные охраняемые рубежи; «посты стражи» ясно передаёт смысл и не создаёт впечатления двух темниц.
- source_word: τὴν πύλην τὴν σιδηρᾶν
  choice: к железным воротам
  rationale: Сохраняется указание на материал ворот в естественной русской форме.
- source_word: τὴν φέρουσαν εἰς τὴν πόλιν
  choice: ведущим в город
  rationale: Причастный оборот кратко и естественно обозначает, куда давали доступ ворота.
- source_word: αὐτομάτη ἠνοίγη αὐτοῖς
  choice: сами собой отворились перед ними
  rationale: «Сами собой» передаёт αὐτομάτη без современных механистических ассоциаций слова «автоматически»; «перед ними» естественно выражает дательный αὐτοῖς в контексте движения.
- source_word: ῥύμην μίαν
  choice: одну улицу
  rationale: Формально сохраняет выражение оригинала и его возможный смысл протяжённости движения; пояснение дано в сноске.
- source_word: εὐθέως ἀπέστη
  choice: тотчас … отошёл
  rationale: Передаёт немедленность следующего события и нейтральное значение удаления ангела.
theological_decisions:
- issue: Характер открытия ворот
  choice: Ворота сами собой отворились перед ними
  alternative: Ворота автоматически открылись для них
  rationale: Перевод сохраняет представленное в повествовании необычайное событие, не добавляя объяснения его механизма и избегая технического оттенка слова «автоматически».
- issue: Значение φυλακή
  choice: посты стражи
  alternative: караулы; места заключения
  rationale: Контекст побега через последовательные охраняемые рубежи поддерживает значение караульных постов, а не отдельных темниц.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанно торжественное. «Отворились» выбрано как естественное сочетание с воротами и не является чрезмерно архаичным. Длинное греческое предложение разделено для удобства чтения без изменения последовательности событий.
