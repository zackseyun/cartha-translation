    reason: lexical_alternative
lexical_decisions:
- source_word: κρούσαντος δὲ αὐτοῦ
  choice: Когда он постучал
  rationale: Аористное причастие с δέ вводит следующее событие повествования; временное придаточное естественно передаёт последовательность действий.
- source_word: τὴν θύραν τοῦ πυλῶνος
  choice: в дверь у ворот
  rationale: 'Переданы оба элемента конструкции: θύρα — дверь, πυλών — ворота или входной проход при доме. Русское «дверь у ворот» ясно описывает наружный вход и не создаёт тяжеловесного сочетания.'
- source_word: προσῆλθε
  choice: к двери подошла
  rationale: Глагол означает приближение; дополнение «к двери» естественно восстанавливается из контекста и точно обозначает движение служанки.
- source_word: παιδίσκη
  choice: служанка
  rationale: Слово может обозначать молодую домашнюю служанку, в том числе рабыню. «Служанка» естественно для повествования, а возможный правовой статус отмечен в сноске.
- source_word: ὑπακοῦσαι
  choice: чтобы узнать, кто там
  rationale: В ситуации стука в дверь глагол означает откликнуться на зов или стук. По-русски «узнать, кто там» естественно выражает действие человека, подошедшего ответить у запертого входа.
- source_word: ὀνόματι Ῥόδη
  choice: по имени Рода
  rationale: Обычная русская конструкция для называния имени; греческое имя Ῥόδη передано традиционной транслитерацией «Рода».
