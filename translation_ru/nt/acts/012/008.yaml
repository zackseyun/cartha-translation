  text: εἶπεν ⸀δὲ ὁ ἄγγελος πρὸς αὐτόν· ⸀Ζῶσαι καὶ ὑπόδησαι τὰ σανδάλιά σου· ἐποίησεν δὲ οὕτως. καὶ λέγει αὐτῷ· Περιβαλοῦ τὸ ἱμάτιόν σου καὶ ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/008.yaml
  text: And the angel said to him[a], “Tie on your belt and put on your sandals.” And he did so. And he says to him[c][b], “Put on your cloak and follow me.”
translation:
  language: ru
  text: 'Ангел сказал ему: «Подпояшься[a] и надень сандалии». И он так и сделал. И ангел говорит ему[b]: «Накинь на себя верхнюю одежду[c] и следуй за мной».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «опояшься», то есть затяни на себе пояс, приготовившись идти.'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте здесь настоящее время — «говорит», употреблённое для живости повествования.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «оберни вокруг себя верхнюю одежду».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: ангел
  rationale: В контексте повествования это небесное существо, явившееся в темнице; «ангел» точнее контекстуального «вестник».
- source_word: Ζῶσαι
  choice: Подпояшься
  rationale: Средний императив обозначает действие человека, который затягивает на себе пояс; русское «подпояшься» кратко и точно передаёт подготовку к движению.
- source_word: ὑπόδησαι τὰ σανδάλιά σου
  choice: надень сандалии
  rationale: Естественная современная формулировка конкретного повеления надеть обувь.
- source_word: ἐποίησεν δὲ οὕτως
  choice: Он так и сделал
  rationale: Идиоматично и кратко передаёт исполнение Петром обоих предшествующих повелений.
- source_word: λέγει
  choice: говорит
  rationale: Сохранён исторический презенс греческого текста, придающий повествованию живость.
- source_word: Περιβαλοῦ τὸ ἱμάτιόν σου
  choice: Накинь плащ
  rationale: ἱμάτιον здесь — верхняя одежда, а περιβάλλω указывает на её набрасывание вокруг себя; «накинь плащ» естественно передаёт оба элемента.
- source_word: ἀκολούθει μοι
  choice: следуй за мной
  rationale: Сохраняет обычное значение ἀκολουθέω и его новозаветную словесную связь с мотивом следования, хотя здесь речь о буквальном движении.
