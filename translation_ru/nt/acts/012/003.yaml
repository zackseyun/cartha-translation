id: ACT.12.3
reference: Acts 12:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸂ἰδὼν δὲ⸃ ὅτι ἀρεστόν ἐστιν τοῖς Ἰουδαίοις προσέθετο συλλαβεῖν καὶ Πέτρον (ἦσαν ⸀δὲ ἡμέραι τῶν ἀζύμων),
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/003.yaml
  text: And when he saw that it was pleasing to the Jews[a], he proceeded to arrest Peter also[b]. (Now these were the days of Unleavened Bread.)
translation:
  language: ru
  text: Увидев же, что это понравилось иудеям[a], он вслед за тем арестовал и Петра. (Это было в дни Опресноков[b].)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «жителям Иудеи» или, при более узком понимании контекста, «иудейским руководителям». Однако в греческом тексте здесь сказано просто «иудеям».'
    reason: lexical_alternative
  - marker: b
    text: То есть в праздничный период, связанный с Пасхой, когда ели пресный хлеб.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Увидев же
  rationale: Деепричастная конструкция естественно передаёт предшествующее восприятие Ирода, а частица «же» сохраняет повествовательную связь δέ.
- source_word: ἀρεστόν ἐστιν
  choice: это понравилось
  rationale: Так естественно по-русски передаётся значение «быть угодным, приятным»; местоимение «это» отсылает к предшествующему действию Ирода.
- source_word: τοῖς Ἰουδαίοις
  choice: иудеям
  rationale: Греческий текст прямо называет Ἰουδαῖοι и здесь сам по себе не сужает значение до руководителей или жителей Иудеи.
- source_word: προσέθετο συλλαβεῖν
  choice: вслед за тем арестовал
  rationale: Оборот с προστίθημι и инфинитивом означает переход к следующему действию. Русская формулировка передаёт последовательность естественнее буквального «добавил схватить».
- source_word: καὶ Πέτρον
  choice: и Петра
  rationale: 'Частица καί имеет добавочное значение: после Иакова ещё одной целью стал Пётр.'
- source_word: ἦσαν δὲ ἡμέραι τῶν ἀζύμων
  choice: Это было в дни Опресноков
  rationale: Фраза сохраняет отдельное название праздничного периода и естественно вводит временное пояснение в скобках.
theological_decisions:
- issue: Значение Ἰουδαίοις в Деяниях
  choice: иудеям
  alternative: жителям Иудеи; иудейским руководителям
  rationale: Основное обозначение сохранено без неоправданного сужения референта; возможные контекстуальные оттенки отмечены в сноске.
- issue: Передача τῶν ἀζύμων
  choice: дни Опресноков
  alternative: Пасха
  rationale: В греческом тексте назван именно период Опресноков. Его не следует отождествлять в переводе с Пасхой, хотя праздники тесно связаны.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. «Иудеи» и «Опресноки» сохраняют историко-культурную точность; синтаксис остаётся ясным для обычного современного читателя.
