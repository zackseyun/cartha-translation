  text: Κατ’ ἐκεῖνον δὲ τὸν καιρὸν ἐπέβαλεν Ἡρῴδης ὁ βασιλεὺς τὰς χεῖρας κακῶσαί τινας τῶν ἀπὸ τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/001.yaml
  text: About that time Herod the king laid hands on some from the church to mistreat them[a][b][c].
translation:
  language: ru
  text: Примерно в то время[a] царь Ирод поднял руку на некоторых членов церкви[b], чтобы причинить им вред[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «В то время»; «Около того времени».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «наложил руки на». Это выражение здесь обозначает враждебные действия против некоторых членов церкви.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «чтобы плохо обращаться с ними».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατ’ ἐκεῖνον δὲ τὸν καιρόν
  choice: Примерно в то время
  rationale: 'Оборот с κατά и винительным падежом указывает на время приблизительно: «примерно/около того времени». Частица δέ имеет лёгкую повествовательную связующую функцию и не требует отдельного слова в русском тексте.'
- source_word: ἐπέβαλεν ... τὰς χεῖρας
  choice: поднял руку на
  rationale: Русский фразеологизм естественно передаёт враждебное действие, сохраняет образ исходного выражения и не сужает его значения до одного лишь ареста.
- source_word: Ἡρῴδης ὁ βασιλεύς
  choice: царь Ирод
  rationale: Это естественный для современного русского языка порядок титула и имени.
- source_word: κακῶσαί
  choice: чтобы причинить им вред
  rationale: Передаёт широкое значение причинения зла или дурного обращения, не вводя более специального понятия систематического религиозного преследования.
- source_word: τινας τῶν ἀπὸ τῆς ἐκκλησίας
  choice: некоторых членов церкви
  rationale: Естественно по-русски обозначает некоторых людей, принадлежавших к христианской общине; буквальное «некоторых из тех, кто от церкви» звучало бы неестественно.
theological_decisions:
- issue: Передача ἐκκλησία
  choice: церковь
  alternative: община; собрание
  rationale: В данном повествовании слово обозначает христианское сообщество. «Церковь» — понятный и устойчивый русский эквивалент, тогда как «собрание» здесь могло бы быть понято как отдельная встреча.
translation_notes:
  register: Современный литературный русский язык. Выражение «поднял руку на» сохраняет образность греческого оборота и ясно указывает на враждебное намерение; формулировка остаётся достаточно широкой и не уточняет вид причинённого вреда.
