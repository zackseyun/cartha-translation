lexical_decisions:
- source_word: ἀνεῖλεν
  choice: убил
  rationale: Глагол ἀναιρέω здесь означает причинить смерть. «Убил» прямо и естественно передаёт смысл, не добавляя прямо не выраженного в стихе юридического оттенка казни.
- source_word: δὲ
  choice: И
  rationale: Частица δέ продолжает повествование; союз «и» сохраняет простой ход рассказа, не усиливая противопоставление.
- source_word: Ἰάκωβον
  choice: Иакова
  rationale: Использована устоявшаяся русская форма имени новозаветного персонажа.
- source_word: τὸν ἀδελφὸν Ἰωάννου
  choice: брата Иоанна
  rationale: Приложение уточняет, о каком Иакове идёт речь; формулировка естественна по-русски и близка структуре греческого текста.
- source_word: μαχαίρῃ
  choice: мечом
  rationale: Дательный падеж имеет инструментальное значение. «Мечом» сохраняет конкретное указание на орудие убийства и звучит естественно по-русски.
theological_decisions:
- issue: Характер действия Ирода
  choice: Передать как убийство, не называя его в основном тексте судебной казнью.
  alternative: «казнил Иакова мечом» — с акцентом на вероятный официальный характер убийства.
  rationale: Глагол ἀνεῖλεν прямо сообщает о причинении смерти, а μαχαίρῃ указывает орудие. Контекст допускает официальную казнь, но сам стих не требует такого юридически конкретного обозначения.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная повествовательная формулировка. Порядок слов подчёркивает указанное в греческом тексте орудие, оставаясь естественным для русского читателя.
