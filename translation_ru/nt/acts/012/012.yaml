  verdict: revise
  source_fidelity: 'В целом смысл передан точно: «осознав это» адекватно передаёт Συνιδών в контексте предыдущего стиха; идентификация Марии и Иоанна, называемого Марком, сохранена; «многие» оправданно передаёт ἱκανοί. Однако «пошёл к дому» может означать лишь движение в направлении дома, тогда как ἦλθεν ἐπὶ τὴν οἰκίαν означает прибытие к дому как месту назначения. «В дом» точнее передаёт движение к месту, где находились молящиеся.'
  naturalness: Фраза литературна и понятна. В исправленном варианте «собралось много людей, и они молились» звучит естественнее, чем субстантивированное «многие собрались», и яснее выражает, что молитва была их продолжающимся занятием.
  terminology: Имена «Мария», «Иоанн» и «Марк» переданы в обычных русских библейских формах. Формулировка «называемого Марком» нейтрально передаёт ἐπικαλουμένου и не добавляет спорного оттенка «также». Богословски нагруженных терминов нет.
  issues:
