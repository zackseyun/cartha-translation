    issue: «Пошёл к дому»
    rationale: В русском это может обозначать движение только до наружной стороны здания. Для направления к дому как месту, в котором находятся собравшиеся, естественнее и точнее «пошёл в дом Марии».
  - severity: low
    issue: «Где многие собрались и молились»
    rationale: Смысл понятен, но «многие» как обозначение людей здесь несколько менее естественно. «Где собралось много людей, и они молились» сохраняет количественный смысл ἱκανοί, результативность συνηθροισμένοι и длительность προσευχόμενοι.
  revised_text: Осознав это, он пошёл в дом Марии, матери Иоанна, называемого Марком, где собралось много людей, и они молились.
