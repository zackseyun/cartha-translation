  text: Συνιδών τε ἦλθεν ἐπὶ τὴν οἰκίαν ⸀τῆς Μαρίας τῆς μητρὸς Ἰωάννου τοῦ ἐπικαλουμένου Μάρκου, οὗ ἦσαν ἱκανοὶ συνηθροισμένοι καὶ προσευχόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/012.yaml
  text: And when he realized this[a], he went to the house of Mary, the mother of John who was called Mark, where many had gathered together and were praying.
translation:
  language: ru
  text: Осознав это, он пошёл в дом Марии, матери Иоанна, называемого Марком, где собралось много людей, и они молились.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνιδών
  choice: Осознав это
  rationale: Аористное причастие передаёт наступившее полное осознание Петром своего положения после ухода ангела; местоимение «это» естественно восполняется из контекста.
- source_word: τε
  choice: связь передана последовательностью повествования
  rationale: Слабая соединительная частица не нуждается в отдельном русском соответствии; деепричастный оборот естественно связывает события.
- source_word: ἦλθεν ἐπὶ τὴν οἰκίαν
  choice: он пошёл к дому
  rationale: Оборот обозначает направленное движение к месту; «пошёл к дому» естественно для данной повествовательной перспективы.
- source_word: οἰκίαν
  choice: дому
  rationale: В контексте подразумевается прежде всего здание, куда направился Пётр и где собрались люди.
- source_word: τῆς Μαρίας
  choice: Марии
  rationale: Принятая в русской библейской традиции форма имени Μαρία.
- source_word: τῆς μητρὸς Ἰωάννου
  choice: матери Иоанна
  rationale: Прямо сохраняет родительное отношение и уточняет, о какой Марии идёт речь.
- source_word: τοῦ ἐπικαλουμένου Μάρκου
  choice: называемого Марком
  rationale: Причастие указывает на дополнительное имя Иоанна, не требуя добавления наречия «также».
- source_word: οὗ
  choice: где
  rationale: Относительное наречие отсылает к дому Марии и кратко обозначает место.
- source_word: ἱκανοὶ
  choice: многие
  rationale: Во множественном числе слово обозначает значительное число людей; «многие» передаёт это естественно и без утяжеления.
- source_word: συνηθροισμένοι
  choice: собрались
  rationale: Перфектное причастие в перифрастической конструкции описывает состояние как результат предшествующего собирания; русский глагол совершенного вида передаёт этот результат.
- source_word: καὶ προσευχόμενοι
  choice: и молились
  rationale: Передаёт продолжавшуюся молитву собравшихся; несовершенный вид сохраняет длительность действия.
