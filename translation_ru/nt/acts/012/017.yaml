  variant: modern literary Russian
source:
  edition: SBLGNT
  text: κατασείσας δὲ αὐτοῖς τῇ χειρὶ σιγᾶν διηγήσατο αὐτοῖς πῶς ὁ κύριος αὐτὸν ἐξήγαγεν ἐκ τῆς φυλακῆς, εἶπέν ⸀τε· Ἀπαγγείλατε Ἰακώβῳ καὶ τοῖς ἀδελφοῖς ταῦτα. καὶ ἐξελθὼν ἐπορεύθη εἰς ἕτερον τόπον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/017.yaml
  text: But motioning to them with his hand to be silent[a], he explained to them how the Lord had brought him out of the prison. And he said, “Report these things to James and to the brothers.” Then he departed and went to another place.
translation:
  language: ru
  text: 'Но он сделал им знак рукой, чтобы они молчали, и рассказал, как Господь вывел его из темницы. Затем он сказал: «Сообщите об этом Иакову и братьям[a]». После этого он вышел и отправился в другое место.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братьям и сёстрам»; по-гречески буквально «братьям», но в зависимости от контекста это слово может обозначать более широкий круг верующих.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατασείσας ... τῇ χειρὶ σιγᾶν
  choice: сделал им знак рукой, чтобы они молчали
  rationale: Передаёт жест рукой, призывающий собравшихся к тишине, естественным современным русским языком, не уточняя форму жеста сверх греческого текста.
- source_word: διηγήσατο
  choice: рассказал
  rationale: Глагол обозначает последовательное изложение случившегося; «рассказал» естественно в повествовательном контексте и не добавляет отсутствующей в тексте интерпретации.
- source_word: πῶς
  choice: как
  rationale: 'Сохраняет способ выражения содержания рассказа Петра: он рассказал, как произошло освобождение.'
- source_word: ὁ κύριος
  choice: Господь
  rationale: Традиционное и точное соответствие κύριος в данном титульном употреблении; русский язык не требует артикля.
- source_word: ἐξήγαγεν
  choice: вывел
  rationale: Прямо передаёт значение «вывести наружу» и сохраняет образ Господа как действующего избавителя.
- source_word: ἐκ τῆς φυλακῆς
  choice: из темницы
  rationale: «Темница» соответствует месту заключения и поддерживает достойный библейский регистр, оставаясь понятным современному читателю.
- source_word: Ἀπαγγείλατε
  choice: Сообщите
  rationale: Передаёт повеление довести важное известие до названных адресатов без излишне официального оттенка.
- source_word: Ἰακώβῳ
  choice: Иакову
  rationale: Устоявшаяся русская библейская передача имени Ἰάκωβος/Ἰακώβ.
- source_word: τοῖς ἀδελφοῖς
  choice: братьям
  rationale: Сохраняет грамматически мужское множественное число греческого текста; возможный более широкий смысл применительно к общине отмечен в сноске.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: он вышел и отправился
  rationale: 'Сохраняет оба элемента: выход из нынешнего места и последующее удаление, избегая неестественного повтора.'
- source_word: εἰς ἕτερον τόπον
  choice: в другое место
  rationale: Точно сохраняет намеренную неопределённость греческого выражения.
theological_decisions:
- issue: Референт κύριος
  choice: Господь
  alternative: уточнить как «Господь Иисус» или «Бог»
  rationale: Греческий текст не уточняет референта. Перевод сохраняет титул и не снимает возможную смысловую напряжённость в повествовании Деяний.
- issue: Объём значения τοῖς ἀδελφοῖς
  choice: братьям с пояснительной сноской
  alternative: братьям и сёстрам; всем верующим
  rationale: Основной текст сохраняет форму оригинала, а сноска указывает, что в контексте слово может обозначать более широкий круг верующих, не решая вопрос категорически.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Синтаксис сделан естественным для устного повествования; неопределённость относительно личности «Господа» и состава группы «братьев» сохранена.
