  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ μὲν οὖν Πέτρος ἐτηρεῖτο ἐν τῇ φυλακῇ· προσευχὴ δὲ ἦν ⸀ἐκτενῶς γινομένη ὑπὸ τῆς ἐκκλησίας πρὸς τὸν θεὸν ⸀περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/005.yaml
  text: So Peter was being kept in the prison[a], but earnest prayer was being made to God by the church for him.
translation:
  language: ru
  text: Итак, Петра держали в тюрьме, а церковь усердно молилась о нём Богу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «горячо» или «неотступно»; греческое слово может подчёркивать силу либо настойчивость молитвы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτηρεῖτο
  choice: держали
  rationale: Имперфект пассивного залога передаёт продолжавшееся содержание Петра под стражей; русская неопределённо-личная конструкция естественно выражает этот смысл без излишнего уточнения способа охраны.
- source_word: ἐν τῇ φυλακῇ
  choice: в тюрьме
  rationale: Контекст указывает на место заключения; «в тюрьме» — естественное и нейтральное повествовательное соответствие.
- source_word: προσευχὴ ... ἦν ... γινομένη
  choice: молилась
  rationale: По-русски длительное совершение молитвы естественнее передаётся глаголом несовершенного вида, чем буквальной конструкцией «молитва совершалась».
- source_word: ἐκτενῶς
  choice: усердно
  rationale: Слово передаёт напряжённость, горячность или настойчивость молитвы; «усердно» сохраняет смысл и звучит естественно в современном литературном русском.
- source_word: ὑπὸ τῆς ἐκκλησίας
  choice: церковь
  rationale: Здесь ἐκκλησία обозначает христианскую общину; «церковь» является общеупотребительным русским соответствием и не требует институционального уточнения.
- source_word: πρὸς τὸν θεόν
  choice: Богу
  rationale: Дательный падеж при глаголе «молиться» естественно передаёт направленность молитвы к Богу.
- source_word: περὶ αὐτοῦ
  choice: о нём
  rationale: В контексте ходатайственной молитвы выражение означает молитву о Петре; «о нём» естественно и не добавляет отсутствующих в тексте деталей.
- source_word: μὲν οὖν ... δὲ
  choice: Итак, ... а ...
  rationale: Сочетание передаёт развитие повествования и контраст между заключением Петра и молитвой церкви; русское «итак… а…» сохраняет обе функции без тяжеловесности.
theological_decisions:
- issue: Передача ἐκκλησία
  choice: церковь
  alternative: община; собрание
  rationale: В данном месте речь идёт о христианском сообществе, молящемся о Петре. «Церковь» — привычное и контекстуально точное обозначение, не навязывающее конкретного конфессионального устройства.
- issue: Характер молитвы в ἐκτενῶς
  choice: усердно
  alternative: горячо; неотступно
  rationale: Греческое наречие допускает акцент как на интенсивности, так и на настойчивости. Основной текст использует широкое по смыслу «усердно», а примечание сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с естественным повествовательным порядком слов. Формулировка сохраняет контраст исходного текста и длительный характер заключения и молитвы, избегая канцеляризма «молитва совершалась».
