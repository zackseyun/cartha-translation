id: ACT.12.6
reference: Acts 12:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὅτε δὲ ἤμελλεν ⸂προαγαγεῖν αὐτὸν⸃ ὁ Ἡρῴδης, τῇ νυκτὶ ἐκείνῃ ἦν ὁ Πέτρος κοιμώμενος μεταξὺ δύο στρατιωτῶν δεδεμένος ἁλύσεσιν δυσίν, φύλακές τε πρὸ τῆς θύρας ἐτήρουν τὴν φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/006.yaml
  text: When Herod was about to bring him out[a], on that very night Peter was sleeping between two soldiers, bound with two chains[b], and guards before the door were keeping watch over the prison.
translation:
  language: ru
  text: Когда Ирод уже собирался вывести его[a], в ту самую ночь Пётр спал между двумя воинами, скованный двумя цепями, а стражники перед дверью охраняли тюрьму[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вывести вперёд». Греческий глагол может означать, что человека выводят для публичного появления или судебного разбирательства.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «несли стражу у тюрьмы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμελλεν
  choice: уже собирался
  rationale: Передаёт близость предстоящего действия; частица «уже» естественно усиливает ощущение его непосредственного приближения.
- source_word: προαγαγεῖν αὐτὸν
  choice: вывести его
  rationale: Сохраняет движение из-под стражи наружу и не уточняет без достаточных оснований, шла ли речь о суде или публичном появлении.
- source_word: τῇ νυκτὶ ἐκείνῃ
  choice: в ту самую ночь
  rationale: Передаёт указательность и повествовательное усиление ἐκείνῃ.
- source_word: κοιμώμενος
  choice: спал
  rationale: Естественно передаёт продолжавшееся действие в русском повествовании.
- source_word: μεταξὺ δύο στρατιωτῶν
  choice: между двумя воинами
  rationale: Точно и естественно передаёт пространственное положение Петра.
- source_word: δεδεμένος ἁλύσεσιν δυσίν
  choice: скованный двумя цепями
  rationale: Передаёт наличное состояние, возникшее вследствие связывания, и прямо указывает средство удержания.
- source_word: φύλακες πρὸ τῆς θύρας
  choice: стражники перед дверью
  rationale: Сохраняет и функцию людей, и обозначенное в греческом тексте их местоположение.
- source_word: ἐτήρουν τὴν φυλακήν
  choice: охраняли тюрьму
  rationale: В данном контексте φυλακή естественнее всего обозначает место заключения, а всё сочетание — несение охраны.
