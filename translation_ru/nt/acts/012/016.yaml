lexical_decisions:
- source_word: ἐπέμενεν κρούων
  choice: продолжал стучать
  rationale: Сочетание имперфекта ἐπέμενεν с причастием κρούων передаёт продолжающееся действие; по-русски это естественно выражается словами «продолжал стучать».
- source_word: ἀνοίξαντες
  choice: когда же они открыли
  rationale: Аористное причастие передано временной конструкцией, ясно показывающей последовательность действий. Объект не добавлен в основной текст, поскольку в греческом он не назван.
- source_word: εἶδαν αὐτόν
  choice: увидели его
  rationale: Прямой и нейтральный перевод повествовательного употребления ὁράω.
- source_word: ἐξέστησαν
  choice: пришли в изумление
  rationale: Выражение сохраняет сильную степень неожиданности и при этом звучит естественно и достойно в современном русском повествовании.
- source_word: δὲ
  choice: но / же
  rationale: Первое δέ передаёт контраст с предыдущим эпизодом словом «но»; второе отмечено частицей «же» в придаточной временной конструкции.
- source_word: Πέτρος
  choice: Пётр
  rationale: Использована традиционная русская форма библейского имени.
