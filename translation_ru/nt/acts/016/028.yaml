  yaml_path: translation/nt/acts/016/028.yaml
  text: But Paul shouted with a loud voice[a], saying, “Do not do yourself any harm, for we are all here.”
translation:
  language: ru
  text: 'Но Павел громко крикнул: «Не причиняй себе никакого вреда! Ведь мы все здесь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφώνησεν δὲ φωνῇ μεγάλῃ ὁ Παῦλος
  choice: Но Павел громко крикнул
  rationale: δέ передаёт противопоставление намерению тюремщика в предыдущем стихе; φωνέω с φωνῇ μεγάλῃ обозначает громкий, срочный возглас. Наречие «громко» естественно передаёт обстоятельственный дательный оборот, не создавая тавтологии «крикнул громким голосом».
- source_word: λέγων
  choice: двоеточие перед прямой речью
  rationale: Причастие вводит содержание возгласа; в современном русском его естественно выразить пунктуационно, без избыточного «говоря».
- source_word: Μηδὲν πράξῃς σεαυτῷ κακόν
  choice: Не причиняй себе никакого вреда
  rationale: Формулировка сохраняет широкое значение κακόν и возвратную направленность σεαυτῷ, а в контексте ясно относится к намерению тюремщика покончить с собой.
- source_word: ἅπαντες γάρ ἐσμεν ἐνθάδε
  choice: Мы все здесь
  rationale: ἅπαντες подчёркивает, что никто из заключённых не ушёл; γάρ вводит основание запрета. В прямой срочной речи отдельное русское предложение естественно выражает причинную связь без обязательного союза «ведь» или «потому что».
- source_word: ὁ Παῦλος
  choice: Павел
  rationale: Использована традиционная русская форма личного имени.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая, срочная прямая речь. Перевод сохраняет широкую формулировку о причинении себе вреда, не сужая её в основном тексте до прямого указания на самоубийство. Стилистически тяжёлое буквальное сочетание «крикнул громким голосом, говоря» передано естественным русским оборотом.
