  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἰδόντες δὲ οἱ κύριοι αὐτῆς ὅτι ἐξῆλθεν ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν ἐπιλαβόμενοι τὸν Παῦλον καὶ τὸν Σιλᾶν εἵλκυσαν εἰς τὴν ἀγορὰν ἐπὶ τοὺς ἄρχοντας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/019.yaml
  text: But when her masters saw that their hope of profit had gone out[a], they seized Paul and Silas and dragged them into the marketplace before the rulers[b],
translation:
  language: ru
  text: Когда же её хозяева увидели, что надежда на их заработок исчезла[a], они схватили Павла и Силу и потащили их на городскую площадь к властям[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вышла надежда на их заработок». Это выражение может перекликаться с тем, что дух вышел из служанки (стих 18).'
    reason: Сохранение образа исходного текста и возможной словесной переклички.
  - marker: b
    text: Здесь употреблено общее слово, означающее городских правителей или представителей власти; в следующем стихе стоит более специальное название должностных лиц.
    reason: Различение двух греческих обозначений властей в соседних стихах.
lexical_decisions:
- source_word: οἱ κύριοι αὐτῆς
  choice: её хозяева
  rationale: В контексте речь о людях, владевших служанкой и извлекавших из неё доход. «Хозяева» естественно передаёт как власть над ней, так и имущественное отношение.
- source_word: ἐξῆλθεν
  choice: исчезла
  rationale: Буквально глагол означает «вышла», причём его употребление перекликается с выходом духа в предыдущем стихе. В основном тексте «исчезла» звучит по-русски естественно, а образная буквальная передача отмечена в сноске.
- source_word: ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν
  choice: надежда на их заработок
  rationale: ἐλπίς сохраняется как «надежда», а ἐργασία в данном контексте означает доход или заработок от деятельности служанки, а не труд вообще.
- source_word: ἐπιλαβόμενοι
  choice: схватили
  rationale: Причастие обозначает решительное, силовое задержание; «схватили» передаёт это ясно и естественно.
- source_word: εἵλκυσαν
  choice: потащили
  rationale: Глагол выражает принудительное волочение или сильное тянущее движение. «Потащили» сохраняет насильственный характер действия.
- source_word: ἀγορὰν
  choice: городскую площадь
  rationale: ἀγορά была не только рынком, но и общественным центром города, где совершались гражданские и судебные дела. В сцене привода к властям «городская площадь» точнее передаёт функцию места.
- source_word: ἐπὶ τοὺς ἄρχοντας
  choice: к властям
  rationale: ἄρχοντες — общее обозначение городских правителей или представителей власти. «К властям» не смешивает его с более специальным термином στρατηγοί в следующем стихе.
