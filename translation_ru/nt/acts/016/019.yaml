  verdict: approve
  source_fidelity: 'Текст точно передаёт основные элементы греческого оригинала: «её хозяева» уместно отражает οἱ κύριοι αὐτῆς в контексте эксплуатации служанки; сохранена «надежда» (ἐλπίς) на доход; «схватили» и «потащили» хорошо передают насильственные ἐπιλαβόμενοι и εἵλκυσαν. «На городскую площадь к властям» адекватно передаёт движение на агору к городским правителям, не отождествляя ἄρχοντες со специальным обозначением должностных лиц в следующем стихе.'
  naturalness: Современный литературный русский, синтаксис плавный и ясный. «Надежда на их заработок исчезла» несколько менее образна, чем буквальное «вышла», но это естественная русская передача, а образ и связь с предыдущим стихом корректно вынесены в сноску.
  terminology: «Хозяева», «заработок», «городская площадь» и «власти» соответствуют контексту и регистру. Формулировка «к властям» достаточно широка для ἄρχοντες и не навязывает более узкий административный титул. Имена Павел и Сила переданы нормативно.
