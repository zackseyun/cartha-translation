  text: ὃς παραγγελίαν τοιαύτην ⸀λαβὼν ἔβαλεν αὐτοὺς εἰς τὴν ἐσωτέραν φυλακὴν καὶ τοὺς πόδας ⸂ἠσφαλίσατο αὐτῶν⸃ εἰς τὸ ξύλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/024.yaml
  text: He[a], having received such an order[b], threw them into the inner prison and secured their feet in the stocks.
translation:
  language: ru
  text: Получив такой приказ, он бросил их во внутреннюю темницу[a] и надёжно закрепил их ноги в колодках[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в самую внутреннюю часть темницы».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в дереве»; имеется в виду деревянное приспособление, которым фиксировали ноги, — колодки.'
    reason: cultural_note
lexical_decisions:
- source_word: παραγγελίαν τοιαύτην
  choice: такой приказ
  rationale: παραγγελία обозначает распоряжение или приказ, исходящий от власти; «такой приказ» естественно передаёт и значение, и указание на предшествующее повеление.
- source_word: λαβὼν
  choice: получив
  rationale: Аористное причастие выражает действие, предшествующее основным действиям; русское деепричастие кратко и точно сохраняет эту связь.
- source_word: ἔβαλεν
  choice: бросил
  rationale: βάλλω может означать «поместить», но основное значение «бросить» здесь передаёт суровость обращения с Павлом и Силой.
- source_word: ἐσωτέραν φυλακήν
  choice: во внутреннюю темницу
  rationale: ἐσωτέραν — сравнительная форма со значением «более внутренняя»; выражение указывает на защищённую внутреннюю часть темницы, возможно самую дальнюю.
- source_word: ἠσφαλίσατο
  choice: надёжно зажал
  rationale: ἀσφαλίζω означает «надёжно закрепить, обезопасить»; в сочетании с колодками «надёжно зажал» ясно описывает действие тюремщика и сохраняет оттенок усиленной меры безопасности.
- source_word: τοὺς πόδας αὐτῶν
  choice: их ноги
  rationale: πούς буквально означает «ступня, нога»; в русском описании помещения в колодки естественно употребить «ноги».
- source_word: εἰς τὸ ξύλον
  choice: в колодках
  rationale: ξύλον буквально означает «дерево» или «деревянный предмет», но в данном тюремном контексте обозначает деревянное приспособление для фиксации ног — колодки.
