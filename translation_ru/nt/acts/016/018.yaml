  text: τοῦτο δὲ ἐποίει ἐπὶ πολλὰς ἡμέρας. διαπονηθεὶς ⸀δὲ Παῦλος καὶ ἐπιστρέψας τῷ πνεύματι εἶπεν· Παραγγέλλω σοι ⸀ἐν ὀνόματι Ἰησοῦ Χριστοῦ ἐξελθεῖν ἀπ’ αὐτῆς· καὶ ἐξῆλθεν αὐτῇ τῇ ὥρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/018.yaml
  text: And she kept doing this for many days[a]. But Paul, becoming greatly troubled, turned to the spirit and said[b], “I command you in the name of Jesus the Messiah to come out of her.” And it came out that very hour.
translation:
  language: ru
  text: 'Она продолжала делать это много дней. Но Павел, глубоко обеспокоенный, обернулся и сказал духу: «Именем Иисуса Мессии повелеваю тебе выйти из неё!» И в тот же час дух вышел.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίει ἐπὶ πολλὰς ἡμέρας
  choice: Так продолжалось много дней
  rationale: Имперфект передаёт продолжавшееся или повторявшееся действие; по-русски естественно выразить это оборотом «так продолжалось».
- source_word: διαπονηθεὶς
  choice: глубоко обеспокоенный
  rationale: Причастие обозначает сильную тягость, беспокойство или изнурённость, а не просто лёгкое раздражение.
- source_word: ἐπιστρέψας
  choice: обернулся
  rationale: Передаёт физический поворот Павла к находившейся позади девушке и духу, к которому он обращается.
- source_word: τῷ πνεύματι
  choice: духу
  rationale: Сохранено неуточнённое πνεῦμα без добавления слов «злому» или «нечистому»; характер духа ясен из контекста.
- source_word: Παραγγέλλω σοι
  choice: повелеваю тебе
  rationale: Выражает властное приказание; «повелеваю» уместно в достойном библейском регистре и остаётся понятным современному читателю.
- source_word: ἐν ὀνόματι Ἰησοῦ Χριστοῦ
  choice: Именем Иисуса Мессии
  rationale: Русский творительный оборот естественно передаёт действие властью имени; Χριστός сохранено как титул «Мессия».
- source_word: ἐξελθεῖν ἀπ’ αὐτῆς
  choice: выйти из неё
  rationale: Точно и естественно передаёт приказ духу покинуть девушку.
- source_word: ἐξῆλθεν αὐτῇ τῇ ὥρᾳ
  choice: И в тот же час дух вышел
  rationale: Оборот αὐτῇ τῇ ὥρᾳ означает немедленное исполнение. Явно названный «дух» устраняет неестественное для русского языка местоименное подлежащее, не добавляя нового референта.
theological_decisions:
- issue: Передача Χριστοῦ в формуле власти
  choice: Мессии
  alternative: Христа
  rationale: Здесь Χριστός сохраняет значение титула; «Мессия» делает это значение прозрачным и не превращает титул в подобие фамилии.
- issue: Следует ли уточнить природу духа
  choice: духу
  alternative: злому духу / бесу
  rationale: В самом стихе πνεῦμα не имеет определения. Перевод сохраняет формулировку источника, позволяя ближайшему контексту определить природу духа.
- issue: Передача немедленности исхода
  choice: в тот же час
  alternative: в тот же миг
  rationale: Сохраняется образная формулировка источника αὐτῇ τῇ ὥρᾳ без сужения её до буквального момента.
translation_notes:
  register: 'Современный литературный русский язык с достойным повествовательным тоном. Синтаксис сделан естественным для русского: повторяющееся действие передано без обязательного повторения подлежащего, а подразумеваемый субъект последнего глагола назван словом «дух» для ясности. Архаизмы и конфессионально окрашенные добавления исключены.'
