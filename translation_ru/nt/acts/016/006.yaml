  text: ⸀Διῆλθον δὲ τὴν Φρυγίαν ⸀καὶ Γαλατικὴν χώραν, κωλυθέντες ὑπὸ τοῦ ἁγίου πνεύματος λαλῆσαι τὸν λόγον ἐν τῇ Ἀσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/006.yaml
  text: And they passed through the region of Phrygia and Galatia[b][a], having been forbidden by the Holy Spirit to speak the word in Asia.
translation:
  language: ru
  text: Они прошли через Фригию и Галатийскую область[a], получив запрет от Святого Духа возвещать слово в Асии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «через Фригийско-Галатийскую область». Греческую конструкцию можно понимать как единое обозначение региона.'
    reason: alternative_reading
  - marker: b
    text: То есть в римской провинции Асия на западе Малой Азии, а не в современной части света Азии.
    reason: cultural_note
lexical_decisions:
- source_word: Διῆλθον
  choice: прошли через
  rationale: Аорист διέρχομαι обозначает движение через местность; этот перевод естественно сохраняет направительный смысл.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Слабая повествовательная связка δέ в русском естественно передаётся последовательностью предложений без обязательного отдельного союза.
- source_word: τὴν Φρυγίαν καὶ Γαλατικὴν χώραν
  choice: через Фригию и Галатийскую область
  rationale: χώρα передано как «область». Формулировка остаётся понятной, а возможное понимание всей греческой конструкции как единого регионального обозначения отмечено в сноске.
- source_word: κωλυθέντες
  choice: поскольку … не позволил им
  rationale: Аористное пассивное причастие обозначает воспрепятствование; причинная придаточная конструкция звучит по-русски естественнее и ясно передаёт запрет.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: Святой Дух
  rationale: Сочетание с ὑπό и родительным указывает на действующего; в русской активной конструкции Святой Дух прямо назван субъектом действия.
- source_word: λαλῆσαι
  choice: возвещать
  rationale: Хотя λαλέω буквально значит «говорить», в данном миссионерском контексте «возвещать» естественно выражает публичное сообщение, не сужая его до формального проповедования.
- source_word: τὸν λόγον
  choice: слово
  rationale: Сохраняется характерное для Луки обозначение христианской вести без поясняющего сужения до «Евангелия».
- source_word: ἐν τῇ Ἀσίᾳ
  choice: в Асии
  rationale: Историческое название римской провинции передано традиционной русской формой «Асия»; сноска исключает смешение с современной частью света.
theological_decisions:
- issue: Действие и личная субъектность Духа в запрете
  choice: Святой Дух не позволил им
  alternative: им было воспрещено Святым Духом
  rationale: Греческая конструкция называет Святого Духа действующим лицом. Активная русская формулировка ясно сохраняет эту субъектность, не добавляя утверждений сверх текста.
translation_notes:
  register: Современный литературный русский язык; повествовательный стиль ясный и сдержанно торжественный. Историческое название «Асия» сохранено и пояснено. Причастная конструкция преобразована в естественное русское придаточное предложение.
