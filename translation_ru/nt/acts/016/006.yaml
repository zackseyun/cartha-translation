  to: Они прошли через Фригию и Галатийскую область[a], получив запрет от Святого Духа возвещать слово в Асии[b].
  rationale: Замена причинного придаточного на деепричастный оборот точнее отражает греческое страдательное причастие, не навязывая степень причинной связи. Уточнение сноски b исправляет стилистику, сохраняя её историко-географическую функцию.
