    rationale: Выражение «в современной части света» звучит неестественно и не называет сопоставляемый географический термин. Лучше прямо указать, что имеется в виду римская провинция, а не современная часть света Азия.
  revised_text: Они прошли через Фригию и Галатийскую область[a], получив запрет от Святого Духа возвещать слово в Асии[b].
