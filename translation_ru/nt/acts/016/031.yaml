base_translation:
  language: en
  yaml_path: translation/nt/acts/016/031.yaml
  text: And they said[a], “Believe in the Lord Jesus[b], and you will be saved—you and your household.”
translation:
  language: ru
  text: 'Они ответили: «Поверь в Господа Иисуса — и будете спасены ты и твои домашние[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «твой дом»; здесь имеются в виду люди, принадлежащие к его дому, а не само здание.'
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Они ответили
  rationale: δέ здесь служит лёгкой повествовательной связкой, а εἶπαν в данном диалоге естественно передаётся как «ответили» без усиления противопоставления.
- source_word: Πίστευσον ἐπὶ τὸν
  choice: Поверь в
  rationale: Аористный императив призывает к решительному отклику; сочетание πιστεύω с ἐπί и винительным падежом указывает на того, к кому обращена вера. «Поверь в» — прямое и естественное выражение на современном русском языке.
- source_word: κύριον Ἰησοῦν
  choice: Господа Иисуса
  rationale: «Господь» сохраняет как почтительный титул, так и его христологическую значимость; личное имя передано в принятой русской форме.
- source_word: σωθήσῃ
  choice: будешь спасён
  rationale: Будущее страдательного залога от σῴζω. В данном благовестническом контексте «спасён» сохраняет широкий смысл спасения и не сводит его только к избавлению от непосредственной опасности.
- source_word: σὺ καὶ ὁ οἶκός σου
  choice: ты и твои домашние
  rationale: οἶκος здесь обозначает людей, составляющих домочадство, а не здание. «Твои домашние» ясно и естественно передаёт этот социальный смысл, не определяя сверх сказанного в тексте, каким образом каждый из них получит спасение.
theological_decisions:
- issue: Объём обещания о спасении тюремщика и его домашних
  choice: Сохранить прямое включение тюремщика и его домашних в обещание, не утверждая автоматического спасения домашних независимо от веры.
  alternative: Понять слова либо как безусловное спасение всего дома через веру одного главы семьи, либо как обещание только самому тюремщику, фактически ослабив упоминание домашних.
  rationale: Греческий текст прямо называет и тюремщика, и его дом, однако сам по себе этот стих не разъясняет отношение личной веры каждого к исполнению обещания. Перевод сохраняет эту богословскую напряжённость и не вносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Поверь» предпочтено более архаичному «уверуй»; порядок «будешь спасён ты» сохраняет выразительное выделение местоимения σὺ и естественно присоединяет домашних.
