review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: Πίστευσον ἐπὶ τὸν κύριον Ἰησοῦν отражено как призыв поверить в Господа Иисуса, а σωθήσῃ — как будущее обещание спасения. Однако при подлежащем «ты и твои домашние» форма единственного числа «будешь спасён» создаёт в русском грамматическую шероховатость и может ошибочно привязать спасение лишь к одному адресату.'
  naturalness: «Они ответили» и «Поверь в Господа Иисуса» звучат современно и уместны. Формулировка «и будете спасены — ты и твои домашние» естественнее и яснее, сохраняя выделение προσωπного местоимения σὺ через пояснительное приложение после тире.
  terminology: '«Господь», «спасены» и «домашние» хорошо соответствуют контексту. Сноску следует уточнить: «домочадство» — это уже коллектив людей, поэтому выражение «люди, составляющие его домочадство» неудачно. οἶκος здесь означает дом/домашнее хозяйство в смысле людей дома, а не здание.'
  issues:
  - severity: medium
    issue: Согласование сказуемого с составным подлежащим
    rationale: В оригинале σωθήσῃ стоит в единственном числе, поскольку речь сначала обращена к тюремщику, а затем добавлен «его дом». Русское «будешь спасён ты и твои домашние» при обычном чтении звучит как несогласование. Множественное «будете спасены» естественно передаёт включение обоих элементов, не решая богословский вопрос о механизме спасения домашних.
  - severity: low
    issue: Неточная и неестественная формулировка сноски
    rationale: «Домочадство» само обозначает совокупность домашних; люди не «составляют домочадство» в данной формулировке. Лучше прямо пояснить, что имеются в виду люди его дома, а не строение.
