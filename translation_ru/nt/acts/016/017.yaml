id: ACT.16.17
reference: Acts 16:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: αὕτη ⸀κατακολουθοῦσα τῷ Παύλῳ καὶ ἡμῖν ἔκραζεν λέγουσα· Οὗτοι οἱ ἄνθρωποι δοῦλοι τοῦ θεοῦ τοῦ ὑψίστου εἰσίν, οἵτινες καταγγέλλουσιν ⸀ὑμῖν ὁδὸν σωτηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/017.yaml
  text: She kept following Paul and us and crying out[a], saying, “These men are servants of the Most High God, who are proclaiming to you the way of salvation.”
translation:
  language: ru
  text: 'Она неотступно следовала за Павлом и нами и всё время кричала: «Эти люди — рабы Всевышнего Бога; они возвещают вам путь спасения[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом перед словом «путь» нет артикля, поэтому выражение допускает понимание как определённого «пути спасения», так и неопределённого «пути спасения». Русская формулировка сохраняет эту неоднозначность.
    reason: alternative_reading
lexical_decisions:
- source_word: κατακολουθοῦσα
  choice: неотступно следовала
  rationale: Настоящее причастие в сочетании с глаголом в имперфекте передаёт продолжительное действие; приставка κατα- здесь усиливает значение следования за кем-либо.
- source_word: ἔκραζεν
  choice: всё время кричала
  rationale: Имперфект выражает продолжительный или повторяющийся громкий возглас; такая передача сохраняет и длительность, и силу глагола.
- source_word: δοῦλοι
  choice: рабы
  rationale: Слово обозначает людей, принадлежащих господину; в данном контексте оно подчёркивает их принадлежность Богу, что точнее передаёт «рабы», а не более широкое «служители».
- source_word: τοῦ θεοῦ τοῦ ὑψίστου
  choice: Всевышнего Бога
  rationale: Естественная для современного русского языка передача устойчивого божественного титула с сохранением превосходного значения ὑψίστου.
- source_word: καταγγέλλουσιν
  choice: возвещают
  rationale: Глагол означает публично объявлять или провозглашать; «возвещают» сохраняет публичный и торжественный характер речи.
- source_word: ὑμῖν
  choice: вам
  rationale: Дательный падеж указывает на тех, кому обращено возвещение.
- source_word: ὁδὸν σωτηρίας
  choice: путь спасения
  rationale: Русское сочетание естественно передаёт образ пути и родительный падеж σωτηρίας, при этом отсутствие артиклей в русском не заставляет устранять присущую греческой форме неоднозначность определённости.
theological_decisions:
- issue: Определённость выражения ὁδὸν σωτηρίας
  choice: путь спасения
  alternative: один из путей спасения
  rationale: Перед ὁδόν в греческом нет артикля, однако безартиклевое употребление само по себе не требует неопределённого смысла. Русское «путь спасения» естественно сохраняет возможную определённость или неопределённость, не усиливая ни исключительность, ни множественность путей сверх исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Рабы» сохраняет конкретное отношение принадлежности, а «возвещают» — публичный характер объявления. Продолжительность обоих действий выражена словами «неотступно» и «всё время».
