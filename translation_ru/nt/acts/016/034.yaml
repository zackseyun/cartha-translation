  text: ἀναγαγών τε αὐτοὺς εἰς τὸν ⸀οἶκον παρέθηκεν τράπεζαν καὶ ⸀ἠγαλλιάσατο πανοικεὶ πεπιστευκὼς τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/034.yaml
  text: And after bringing them up into the house[a], he set a meal before them and rejoiced greatly with his whole household[b], having believed in God.
translation:
  language: ru
  text: Подняв их в дом, он накрыл для них стол[a] и вместе со всеми домашними[b] возликовал, уверовав в Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поставил перед ними стол»; это греческое выражение означает, что он подал им еду.'
    reason: lexical_alternative
  - marker: b
    text: Греческий текст можно понимать как указание на то, что вместе с ним ликовали все домашние; некоторые также видят здесь подразумеваемое участие всего дома в вере.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγαγών
  choice: поднявшись с ними
  rationale: Аористное причастие передаёт предшествующее основным действиям движение вверх из темницы в дом; по-русски естественно выразить это как «поднявшись с ними».
- source_word: οἶκον
  choice: дом
  rationale: Определённый артикль указывает на известный из контекста дом тюремщика; добавлять притяжательное «свой» необязательно.
- source_word: παρέθηκεν τράπεζαν
  choice: накрыл для них стол
  rationale: Греческое выражение буквально связано с приготовлением стола и идиоматически означает подать еду; русский оборот сохраняет и образ, и смысл гостеприимства.
- source_word: ἠγαλλιάσατο
  choice: возликовал
  rationale: Глагол обозначает сильную, торжествующую радость; «возликовал» кратко и достойно передаёт её интенсивность.
- source_word: πανοικεὶ
  choice: вместе со всеми домашними
  rationale: Наречие означает участие всего дома, то есть всех домочадцев; выбранная формулировка естественна в современном русском языке.
- source_word: πεπιστευκὼς τῷ θεῷ
  choice: уверовав в Бога
  rationale: Перфектное причастие мужского рода единственного числа непосредственно относится к тюремщику и указывает на состоявшееся обретение веры с сохраняющимся результатом; деепричастие не добавляет явно выраженной причинной связи.
theological_decisions:
- issue: Относится ли вера только к тюремщику или также ко всем его домашним
  choice: В основном тексте «уверовав» грамматически относится к тюремщику, тогда как все домашние участвуют в ликовании.
  alternative: Понимать фразу так, что весь дом не только ликовал, но и уверовал.
  rationale: Единственное число причастия πεπιστευκώς прямо согласуется с субъектом-тюремщиком, однако положение πανοικεὶ допускает более широкое понимание участия домашних. Примечание сохраняет эту неоднозначность, не утверждая коллективную веру категоричнее греческого текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Возликовал» передаёт силу ἠγαλλιάσατο, а «накрыл стол» естественно воспроизводит идиому гостеприимства. Все маркеры примечаний присутствуют в основном тексте.
