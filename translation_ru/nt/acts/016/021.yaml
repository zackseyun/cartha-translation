  yaml_path: translation/nt/acts/016/021.yaml
  text: and they are proclaiming customs that it is not lawful for us to accept or practice[a], since we are Romans.
translation:
  language: ru
  text: и провозглашают обычаи, которые нам, римлянам, не дозволено ни принимать, ни соблюдать.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые нам не дозволено ни принимать, ни соблюдать, поскольку мы римляне»; возможно также: «будучи римлянами». Греческий причастный оборот указывает на основание, которым обвинители объясняют запрет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: и
  rationale: Простой соединительный союз продолжает обвинение из предыдущего стиха.
- source_word: καταγγέλλουσιν
  choice: возвещают
  rationale: Глагол обозначает публичное провозглашение или объявление; «возвещают» сохраняет характер обвинения, не добавляя более узкого смысла «учат» или «пропагандируют».
- source_word: ἔθη
  choice: обычаи
  rationale: Слово обозначает установившиеся обычаи или практики; «обычаи» естественно передаёт гражданско-религиозный контекст обвинения.
- source_word: οὐκ ἔξεστιν
  choice: не дозволено
  rationale: Оборот выражает отсутствие законного или общественно признанного разрешения. Формулировка сохраняет официальный оттенок, но не утверждает от лица повествователя, что обвинение юридически верно.
- source_word: παραδέχεσθαι
  choice: принимать
  rationale: В контексте речь идёт о принятии чужих обычаев как допустимых или обязательных; широкий русский эквивалент не сужает смысл до формального усыновления или введения.
- source_word: οὐδὲ ποιεῖν
  choice: ни соблюдать
  rationale: В сочетании с «обычаями» ποιεῖν означает следовать им на практике. «Соблюдать» звучит по-русски естественнее буквального «делать».
- source_word: Ῥωμαίοις οὖσιν
  choice: нам, римлянам
  rationale: Дательный причастный оборот указывает на названное обвинителями основание запрета. Русская конструкция естественно передаёт смысл «поскольку мы римляне», сохраняя некоторую краткость оригинала.
theological_decisions:
- issue: Характер запрета в обвинении
  choice: 'Передать обвинение в юридико-гражданских выражениях: «нам… не дозволено», не подтверждая его истинность от лица повествователя.'
  alternative: «нам не следует» или «для нас неприемлемо»
  rationale: Текст сообщает слова обвинителей, а не даёт авторскую оценку римского права. Выбранная формулировка сохраняет заявленный ими правовой характер запрета.
- issue: Смысл Ῥωμαίοις οὖσιν
  choice: 'Связать римское гражданское положение говорящих с заявленным запретом: «нам, римлянам».'
  alternative: «поскольку мы римляне» / «будучи римлянами»
  rationale: Причастный оборот допускает причинное раскрытие. Основной текст передаёт это естественной русской аппозицией, а примечание фиксирует более явные варианты.
translation_notes:
  register: Современный литературный русский язык с умеренно официальной интонацией, соответствующей публичному обвинению. «Возвещают» сохраняет достоинство библейского стиля без архаизации; «не дозволено» передаёт юридический оттенок; парная конструкция «ни принимать, ни соблюдать» ясно отражает два инфинитива оригинала.
