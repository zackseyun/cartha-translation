base_translation:
  language: en
  yaml_path: translation/nt/acts/016/027.yaml
  text: When the jailer woke up and saw the prison doors standing open[a], he drew his sword and was about to kill himself[b], supposing that the prisoners had escaped.
translation:
  language: ru
  text: Тюремщик проснулся и, увидев, что двери темницы открыты[a], обнажил меч[b] и уже собирался убить себя, полагая, что узники бежали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «увидев двери темницы открытыми». Греческое перфектное причастие подчёркивает состояние дверей после того, как они открылись.'
    reason: lexical_alternative
  - marker: b
    text: Греческое μάχαιρα может обозначать меч или более короткое клинковое оружие, например кинжал; здесь использован традиционный контекстуальный перевод «меч».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξυπνος ... γενόμενος
  choice: проснулся
  rationale: Сочетание прилагательного с причастием обозначает переход в состояние бодрствования; «проснулся» естественно и точно передаёт этот смысл.
- source_word: δεσμοφύλαξ
  choice: тюремщик
  rationale: Слово обозначает служащего, отвечающего за заключённых; «тюремщик» конкретнее общего слова «страж».
- source_word: ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς
  choice: увидев, что двери темницы открыты
  rationale: Перфектное страдательное причастие подчёркивает состояние дверей как открытых; русская конструкция естественно сохраняет этот результирующий смысл.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: выхватил меч
  rationale: Глагол в сочетании с μάχαιρα означает извлечение оружия; «выхватил» соответствует стремительности ситуации, а «меч» является обычным контекстуальным эквивалентом.
- source_word: ἤμελλεν ἑαυτὸν ἀναιρεῖν
  choice: уже собирался убить себя
  rationale: ἤμελλεν указывает на близость намереваемого действия; частица «уже» ясно передаёт его непосредственную близость.
- source_word: νομίζων
  choice: полагая
  rationale: Причастие выражает сделанный тюремщиком вывод и причину его намерения, не представляя этот вывод как достоверный факт.
- source_word: ἐκπεφευγέναι
  choice: бежали
  rationale: Перфектный инфинитив указывает на предположительно завершившийся побег; в русском придаточном прошедшее время естественно передаёт этот смысл.
- source_word: τοὺς δεσμίους
  choice: узники
  rationale: В контексте речь идёт о содержащихся под стражей людях; «узники» — ясное, ёмкое и стилистически достойное обозначение.
