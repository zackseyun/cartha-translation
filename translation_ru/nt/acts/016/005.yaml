  text: αἱ μὲν οὖν ἐκκλησίαι ἐστερεοῦντο τῇ πίστει καὶ ἐπερίσσευον τῷ ἀριθμῷ καθ’ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/005.yaml
  text: So the churches were being strengthened in the faith and were increasing in number day by day[a].
translation:
  language: ru
  text: Итак, церкви укреплялись в вере[a] и день ото дня росли числом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое выражение может означать как укрепление в общей христианской вере — разделяемом учении и образе жизни, — так и укрепление веры как доверия и упования.
    reason: alternative_reading
lexical_decisions:
- source_word: αἱ μὲν οὖν
  choice: Итак
  rationale: Сочетание частиц вводит переходный итог предшествующего повествования; «итак» естественно передаёт эту связь, не придавая μέν лишнего противопоставительного значения.
- source_word: ἐκκλησίαι
  choice: церкви
  rationale: В данном контексте речь идёт о местных христианских общинах; «церкви» — общепринятое и понятное русское соответствие.
- source_word: ἐστερεοῦντο
  choice: укреплялись
  rationale: Форма имперфекта в пассивном залоге обозначает продолжавшийся процесс. Русское «укреплялись» естественно сохраняет значение постепенного становления твёрже.
- source_word: τῇ πίστει
  choice: в вере
  rationale: Дательный падеж обозначает сферу укрепления. Выражение «в вере» сохраняет возможную отсылку как к общей христианской вере, так и к вере как упованию, не снимая неоднозначности греческого текста.
- source_word: ἐπερίσσευον
  choice: росли
  rationale: Имперфект передаёт продолжавшееся увеличение. В сочетании с «числом» глагол «росли» звучит естественно и не усиливает смысл до «умножались».
- source_word: τῷ ἀριθμῷ
  choice: числом
  rationale: 'Творительный падеж в русском идиоматично передаёт дательный отношения: общины росли по численности.'
- source_word: καθ’ ἡμέραν
  choice: день ото дня
  rationale: Оборот передаёт регулярный, непрерывный рост и сохраняет распределительный оттенок греческого выражения.
theological_decisions:
- issue: Значение πίστις с артиклем
  choice: «в вере» — вероятная отсылка к общей христианской вере, которой держались церкви
  alternative: «в вере» как укрепление доверия и упования верующих
  rationale: Артикль и церковный контекст благоприятствуют общему, предметному смыслу — христианской вере как разделяемому убеждению и образу жизни. Однако русское выражение и примечание сохраняют возможный личный смысл веры.
translation_notes:
  register: Современный литературный русский язык; краткий повествовательный итог передан ясно и торжественно без архаизмов. Порядок «день ото дня росли числом» выбран ради естественного ритма.
