  text: ὡς δὲ διεπορεύοντο τὰς πόλεις, ⸀παρεδίδοσαν αὐτοῖς φυλάσσειν τὰ δόγματα τὰ κεκριμένα ὑπὸ τῶν ἀποστόλων ⸀καὶ πρεσβυτέρων τῶν ἐν ⸀Ἱεροσολύμοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/004.yaml
  text: As they went through the cities[a], they delivered to them for observance the decrees that had been decided by the apostles and elders in Jerusalem.
translation:
  language: ru
  text: Проходя по городам, они передавали верующим для соблюдения постановления[a], принятые апостолами и старейшинами, находившимися в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «решения». Греч. δόγματα — постановления, принятые апостолами и старейшинами, находившимися в Иерусалиме.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπορεύοντο
  choice: проходя
  rationale: Передаёт продолжительное продвижение через ряд городов; деепричастная конструкция естественно связывает его с основным действием.
- source_word: παρεδίδοσαν
  choice: передавали
  rationale: Сохраняет смысл вручения и сообщения авторитетных решений, не придавая фразе излишне канцелярского оттенка.
- source_word: αὐτοῖς
  choice: верующим
  rationale: В русском без уточнения местоимение «им» могло бы ошибочно указывать на города; контекстуально речь идёт о верующих в этих городах.
- source_word: φυλάσσειν
  choice: для соблюдения
  rationale: Передаёт требование придерживаться решений, а не просто хранить их.
- source_word: δόγματα
  choice: постановления
  rationale: Выражает официальный и обязательный характер решений Иерусалимского собрания, не вызывая позднейших ассоциаций с термином «догматы».
- source_word: κεκριμένα
  choice: принятые
  rationale: В сочетании с «постановления» естественно обозначает уже вынесенные и сохраняющие силу решения.
- source_word: ἀποστόλων καὶ πρεσβυτέρων
  choice: апостолами и старейшинами
  rationale: Стандартная и понятная передача признанных руководителей иерусалимской общины.
- source_word: τῶν ἐν Ἱεροσολύμοις
  choice: в Иерусалиме
  rationale: Кратко и естественно указывает местонахождение апостолов и старейшин.
- source_word: ὡς δὲ
  choice: Проходя
  rationale: В русском временное отношение естественно выражено деепричастием; частица δέ здесь служит повествовательному переходу и не требует отдельного перевода.
theological_decisions:
- issue: Авторитет решений Иерусалимского собрания
  choice: постановления
  alternative: решения
  rationale: «Постановления» сохраняет формальный и обязательный характер δόγματα в контексте Деян 15, но не переносит в текст позднейшее техническое значение слова «догмат».
translation_notes:
  register: Современный литературный русский язык; ясный повествовательный синтаксис и умеренно официальный тон, соответствующий передаче решений. Экспликация «верующим» устраняет неясную русскую референцию местоимения, опираясь на ближайший контекст.
