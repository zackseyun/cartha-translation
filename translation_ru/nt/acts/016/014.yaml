  text: καί τις γυνὴ ὀνόματι Λυδία, πορφυρόπωλις πόλεως Θυατείρων σεβομένη τὸν θεόν, ἤκουεν, ἧς ὁ κύριος διήνοιξεν τὴν καρδίαν προσέχειν τοῖς λαλουμένοις ὑπὸ ⸀τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/014.yaml
  text: And a certain woman named Lydia[a], a seller of purple cloth from the city of Thyatira, who worshiped God, was listening; the Lord opened her heart to pay attention to what was being spoken by Paul.
translation:
  language: ru
  text: И одна женщина по имени Лидия, торговавшая пурпурными тканями, из города Фиатиры, почитавшая Бога[a], слушала. Господь открыл её сердце, чтобы она внимала тому, что говорил Павел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклонявшаяся Богу». Это выражение может обозначать язычницу, почитавшую Бога Израиля.'
    reason: Лексическая альтернатива и возможный социально-религиозный оттенок выражения σεβομένη τὸν θεόν.
lexical_decisions:
- source_word: καί τις γυνὴ ὀνόματι Λυδία
  choice: Одна женщина по имени Лидия
  rationale: «Одна женщина» естественно передаёт неопределённость τις и вводит новую участницу повествования; «по имени Лидия» — современная идиоматичная передача ὀνόματι Λυδία.
- source_word: πορφυρόπωλις
  choice: торговавшая пурпурными тканями
  rationale: Слово обозначает торговку пурпуром или окрашенными пурпуром изделиями. Такая передача ясна современному читателю и не сужает значение до конкретного вида одежды.
- source_word: πόλεως Θυατείρων
  choice: родом из города Фиатиры
  rationale: Естественно выражает происхождение Лидии, сохраняя явное упоминание города.
- source_word: σεβομένη τὸν θεόν
  choice: почитавшая Бога
  rationale: Передаёт религиозное благоговение и поклонение Богу Израиля, не превращая возможное обозначение особой группы в технический термин основного текста.
- source_word: ἤκουεν
  choice: слушала
  rationale: Несовершенный вид русского глагола естественно передаёт продолжающееся действие греческого имперфекта.
- source_word: ὁ κύριος
  choice: Господь
  rationale: Точно сохраняет традиционное и контекстуально уместное соответствие κύριος, не уточняя прямо не названного референта.
- source_word: διήνοιξεν τὴν καρδίαν
  choice: открыл её сердце
  rationale: Сохраняет греческий образ внутренней открытости и восприимчивости без поясняющей парафразы.
- source_word: προσέχειν
  choice: чтобы она внимала
  rationale: «Внимать» выражает сосредоточенное, восприимчивое внимание и не добавляет явно не выраженного значения «откликнуться» или «уверовать».
- source_word: τοῖς λαλουμένοις ὑπὸ τοῦ Παύλου
  choice: тому, что говорил Павел
  rationale: Идиоматично передаёт содержание субстантивированного пассивного причастия и действующее лицо, сохраняя длительный характер речи.
theological_decisions:
- issue: Референт выражения ὁ κύριος
  choice: Господь
  alternative: Господь Иисус; Бог
  rationale: В греческом тексте стоит только ὁ κύριος. Перевод не уточняет, относится ли наименование здесь непосредственно к Иисусу или к Богу, и тем самым сохраняет формулировку и смысловую открытость источника.
- issue: Статус Лидии в выражении σεβομένη τὸν θεόν
  choice: почитавшая Бога
  alternative: богобоязненная; поклонявшаяся Богу
  rationale: Фраза может иметь как описательный смысл, так и указывать на язычницу, примкнувшую к почитанию Бога Израиля. Основной текст сохраняет описательную форму, а возможный социально-религиозный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным строем. Синтаксис разделён на два предложения ради естественности; образ «открыл её сердце» сохранён. Слово «внимала» слегка возвышенно, но общепонятно и точно передаёт направленное восприимчивое внимание.
