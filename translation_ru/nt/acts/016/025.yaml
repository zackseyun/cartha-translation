  text: Κατὰ δὲ τὸ μεσονύκτιον Παῦλος καὶ Σιλᾶς προσευχόμενοι ὕμνουν τὸν θεόν, ἐπηκροῶντο δὲ αὐτῶν οἱ δέσμιοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/025.yaml
  text: About midnight Paul and Silas were praying and singing hymns to God[a], and the prisoners were listening to them.
translation:
  language: ru
  text: Около полуночи Павел и Сила молились и пели хвалебные песни Богу, а узники внимательно слушали их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ δὲ τὸ μεσονύκτιον
  choice: Около полуночи
  rationale: κατά с винительным времени обозначает приблизительное время; лёгкая связующая функция δέ естественно передана структурой предложения без отдельного вводного слова.
- source_word: Παῦλος καὶ Σιλᾶς
  choice: Павел и Сила
  rationale: Употреблены традиционные русские формы библейских имён.
- source_word: προσευχόμενοι
  choice: молились
  rationale: Причастие настоящего времени обозначает продолжающееся действие, одновременное с ὕμνουν; русское однородное сказуемое естественно передаёт эту одновременность.
- source_word: ὕμνουν
  choice: пели хвалебные песни
  rationale: Глагол ὑμνέω означает воспевать хвалу, петь гимны; выбранная формулировка ясна современному читателю и сохраняет содержание хвалы.
- source_word: τὸν θεόν
  choice: Богу
  rationale: Дательный падеж естественно выражает адресата хвалебного пения в русском языке.
- source_word: ἐπηκροῶντο
  choice: внимательно слушали
  rationale: Глагол выражает не просто слышание, а сосредоточенное, внимательное слушание; имперфект передаёт продолжающееся действие.
- source_word: οἱ δέσμιοι
  choice: узники
  rationale: Слово обозначает находящихся в заключении или оковах; «узники» точно и уместно в повествовании о тюрьме.
theological_decisions: []
