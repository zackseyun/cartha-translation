lexical_decisions:
- source_word: παραλαβὼν
  choice: отвёл
  rationale: Причастие обозначает, что тюремщик взял Павла и Силу с собой или отвёл их для омовения ран; русский глагол естественно передаёт действие, не уточняя место.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτός
  choice: в тот же ночной час
  rationale: Фраза сохраняет временную конкретность и подчёркивает, что тюремщик действовал без промедления глубокой ночью.
- source_word: ἔλουσεν ἀπὸ τῶν πληγῶν
  choice: омыл их раны
  rationale: Греческое выражение буквально связывает омовение с ранами; по-русски «омыл их раны» ясно и естественно передаёт уход за повреждениями.
- source_word: ἐβαπτίσθη
  choice: крестился
  rationale: Обычный современный русский эквивалент пассивной формы, обозначающий принятие крещения и не уточняющий его способ.
- source_word: οἱ αὐτοῦ πάντες
  choice: все его домашние
  rationale: Выражение охватывает всех принадлежавших к его домашнему кругу и не сужает значение до одной только ближайшей семьи.
- source_word: παραχρῆμα
  choice: тут же
  rationale: Кратко и естественно передаёт подчёркнутую в повествовании немедленность.
theological_decisions:
- issue: Состав крещённых, обозначенных οἱ αὐτοῦ πάντες
  choice: все его домашние
  alternative: вся его семья
  rationale: «Домашние» сохраняет широту греческого выражения и не определяет возраст, личное исповедание или способ крещения, поэтому не привносит выводов из позднейших конфессиональных споров.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. «Омыл» сохраняет достоинство библейского регистра, а «тут же» естественно передаёт немедленность. Порядок предложений следует последовательности греческого текста.
