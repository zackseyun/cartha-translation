  text: τοῦτον ἠθέλησεν ὁ Παῦλος σὺν αὐτῷ ἐξελθεῖν, καὶ λαβὼν περιέτεμεν αὐτὸν διὰ τοὺς Ἰουδαίους τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις, ᾔδεισαν γὰρ ἅπαντες ⸂ὅτι Ἕλλην ὁ πατὴρ αὐτοῦ⸃ ὑπῆρχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/003.yaml
  text: Paul wanted him to go out with him[a], and after taking him, he circumcised him because of the Jews who were in those places[c][b], for they all knew that his father was a Greek.
translation:
  language: ru
  text: Павел захотел, чтобы Тимофей отправился с ним[a]. Взяв его, он обрезал его из-за иудеев[b], живших в тех местах, потому что все знали, что его отец был греком[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вышел с ним»; здесь это выражение может означать отправление в путь.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «ради иудеев» или «по причине иудеев».'
    reason: lexical_alternative
  - marker: c
    text: Греч. «греком»; в данном контексте это, вероятно, указывает на то, что отец Тимофея не был иудеем.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτον
  choice: Тимофей
  rationale: Указательное местоимение относится к Тимофею из предыдущего контекста. Имя устраняет возможную неясность двух последующих мужских местоимений и естественно начинает русский стих.
- source_word: ἠθέλησεν
  choice: захотел
  rationale: Передаёт волеизъявление Павла естественным современным русским глаголом, не усиливая его до твёрдого решения или приказа.
- source_word: σὺν αὐτῷ ἐξελθεῖν
  choice: чтобы Тимофей отправился с ним
  rationale: ἐξέρχομαι буквально означает «выйти», но здесь в повествовании о миссионерском пути обозначает отправление в дорогу. «Отправился с ним» естественно передаёт идиоматический смысл; буквальная образность отмечена в сноске.
- source_word: λαβὼν
  choice: взяв его
  rationale: Деепричастие сохраняет предшествующее обстоятельство аористного причастия и не добавляет к «взяв» отсутствующего в греческом уточнения.
- source_word: περιέτεμεν
  choice: совершил над ним обрезание
  rationale: Прямо и недвусмысленно передаёт действие περιτέμνω; эта формулировка ясна и литературна в современном русском.
- source_word: διὰ τοὺς Ἰουδαίους
  choice: из-за иудеев
  rationale: διά с винительным падежом указывает на причину или мотив. «Из-за» сохраняет неопределённость относительно точного характера побуждения, не истолковывая его заранее как благожелательную уступку.
- source_word: τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις
  choice: живших в тех местах
  rationale: Причастный оборот характеризует местных иудеев. «Живших» в данном контексте естественнее буквального «находившихся», хотя слегка конкретизирует устойчивость их присутствия.
- source_word: ᾔδεισαν γὰρ ἅπαντες
  choice: потому что все знали
  rationale: Передаёт объяснительное γάρ и усиленную всеохватность ἅπαντες ясной русской причинной конструкцией.
- source_word: Ἕλλην
  choice: греком
  rationale: Сохраняет буквальное этнокультурное обозначение Ἕλλην, не заменяя его более широким толкованием «язычник».
- source_word: ὁ πατὴρ αὐτοῦ ὑπῆρχεν
  choice: его отец был
  rationale: Простая связка естественно передаёт ὑπάρχω в данном контексте, не добавляя оттенков происхождения или случайности.
theological_decisions:
- issue: Причина обрезания Тимофея и отношение действия Павла к иудейским требованиям
  choice: Текст сообщает о поступке Павла, мотивированном присутствием местных иудеев и их знанием о греческом происхождении отца Тимофея.
  alternative: Истолковать поступок либо как богословское утверждение обязательности обрезания, либо исключительно как миссионерскую тактику.
  rationale: Стих прямо называет обстоятельство и причину, но не формулирует общего учения о спасении, заветном статусе или миссионерской стратегии. Перевод сохраняет эту повествовательную и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом и умеренно торжественным библейским регистром. Имя «Тимофей» введено из непосредственного контекста для референциальной ясности. Термин «иудеи» сохранён как историко-религиозное обозначение; неоднозначность мотива διά не устранена.
