  yaml_path: translation/nt/acts/016/029.yaml
  text: Then[a], asking for lights, he rushed in, and trembling with fear he fell down before Paul and Silas[c][b],
translation:
  language: ru
  text: Тогда тюремщик попросил света, ворвался внутрь и, дрожа от страха, упал перед Павлом и Силой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пал перед Павлом и Силой». Греческий глагол описывает падение перед ними в страхе, мольбе или почтении, но не обязательно поклонение.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Тогда
  rationale: Частица обозначает переход к следующему событию повествования, а не сильное противопоставление.
- source_word: αἰτήσας
  choice: попросил принести
  rationale: Аористное причастие выражает действие, предшествующее основному; такая формулировка естественно передаёт просьбу дать или принести источники света.
- source_word: φῶτα
  choice: светильники
  rationale: Множественное число означает источники света; «светильники» сохраняет общее значение, не уточняя их вид.
- source_word: εἰσεπήδησεν
  choice: вбежал внутрь
  rationale: Глагол передаёт стремительное, резкое движение внутрь; «вбежал» звучит естественно и сохраняет срочность действия.
- source_word: ἔντρομος γενόμενος
  choice: дрожа от страха
  rationale: Выражение описывает охваченного страхом и физически дрожащего человека; русский оборот естественно передаёт обе стороны значения.
- source_word: προσέπεσεν
  choice: пал перед
  rationale: Глагол означает падение перед кем-либо в страхе, мольбе или почтении, но сам по себе не обязательно обозначает поклонение.
- source_word: τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: перед Павлом и Силой
  rationale: Дательный падеж при προσπίπτω естественно передаётся предлогом «перед»; упоминание ног было бы излишним уточнением.
theological_decisions:
- issue: Характер жеста тюремщика перед Павлом и Силой
  choice: пал перед Павлом и Силой
  alternative: поклонился Павлу и Силе; простёрся ниц перед Павлом и Силой
  rationale: Контекст указывает на страх, потрясение и почтительную мольбу. Греческий глагол не требует понимания этого жеста как религиозного поклонения, поэтому перевод не вносит такого утверждения.
translation_notes:
  register: Современный литературный русский язык, ясный и повествовательно динамичный. «Тюремщик» восстановлен из ближайшего контекста как подразумеваемое подлежащее, необходимое для естественного русского изложения. Единственная сноска сохраняет смысловую широту жеста и не перегружает простой стих вариантами.
