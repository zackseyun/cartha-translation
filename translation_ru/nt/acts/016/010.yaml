id: ACT.16.10
reference: Acts 16:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὡς δὲ τὸ ὅραμα εἶδεν, εὐθέως ἐζητήσαμεν ἐξελθεῖν ⸀εἰς Μακεδονίαν, συμβιβάζοντες ὅτι προσκέκληται ἡμᾶς ὁ ⸀θεὸς εὐαγγελίσασθαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/010.yaml
  text: And when he had seen the vision[a], we immediately sought to go on into Macedonia[c][b], concluding that God had called us to proclaim the good news to them.
translation:
  language: ru
  text: После того как он увидел видение, мы тотчас постарались отправиться в Македонию, сделав вывод, что Бог призвал нас возвестить им Благую весть.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: После того как
  rationale: Передаёт временную связь и последовательность событий естественным современным русским языком.
- source_word: τὸ ὅραμα εἶδεν
  choice: он увидел видение
  rationale: Прямо и без добавочных толкований передаёт объект и аорист глагола; предшествование главному действию выражено конструкцией «после того как».
- source_word: εὐθέως
  choice: тотчас
  rationale: Сохраняет значение немедленности и соответствует достоинству повествовательного регистра.
- source_word: ἐζητήσαμεν
  choice: мы постарались
  rationale: В данном контексте ζητέω обозначает целенаправленное стремление или попытку; буквальное «искали» по-русски было бы неестественно.
- source_word: ἐξελθεῖν εἰς Μακεδονίαν
  choice: отправиться в Македонию
  rationale: Естественно передаёт выход и движение к месту назначения, не навязывая излишне буквальный пространственный образ «выйти в».
- source_word: συμβιβάζοντες
  choice: заключив
  rationale: Передаёт вывод, сделанный на основании видения; деепричастие сохраняет связь с действием первого лица множественного числа.
- source_word: προσκέκληται
  choice: призвал
  rationale: Передаёт совершившийся Божий призыв с сохраняющейся значимостью; русская временная последовательность ясна из контекста без аналитического плюсквамперфекта.
- source_word: εὐαγγελίσασθαι
  choice: возвестить Благую весть
  rationale: Доступно и точно передаёт глагол благовествования, сохраняя его содержательную связь с благой вестью.
- source_word: αὐτούς
  choice: им
  rationale: Местоимение естественно обозначает людей в Македонии как адресатов возвещения.
theological_decisions:
- issue: Переход повествования к первому лицу множественного числа
  choice: Сохранено прямое «мы тотчас постарались».
  alternative: Безличная передача, скрывающая переход к «мы».
  rationale: Греческий текст явно переходит к первому лицу множественного числа; перевод сохраняет эту особенность, не делая выводов об авторстве.
- issue: Божественная инициатива в προσκέκληται ἡμᾶς ὁ θεὸς
  choice: «Бог призвал нас»
  alternative: «Бог направлял нас» или «Бог пригласил нас».
  rationale: Глагол обозначает призыв; выбранная формулировка сохраняет утверждение о Божьей инициативе без усиления или ослабления.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным повествовательным регистром. Синтаксис естественный для широкой аудитории; первое лицо множественного числа и логический вывод из видения сохранены.
