lexical_decisions:
- source_word: συνεπέστη
  choice: сообща выступила против
  rationale: Передаёт как совместный характер действия толпы, так и его враждебную направленность, не уточняя сверх текста, ограничилось ли оно выступлением или перешло в физическое нападение.
- source_word: ὄχλος
  choice: толпа
  rationale: Естественный современный эквивалент; слово «чернь» стилистически устарело и оценочно, а «сброд» привнесло бы отсутствующее в исходном слове осуждение.
- source_word: κατ’ αὐτῶν
  choice: против них
  rationale: Передаёт обычное здесь враждебное значение κατά с родительным падежом.
- source_word: στρατηγοὶ
  choice: городские начальники
  rationale: Понятное широкому читателю обозначение гражданских властей римской колонии; более специальное «преторы» вынесено в примечание.
- source_word: περιρήξαντες
  choice: сорвав
  rationale: Деепричастие естественно передаёт действие, предшествующее распоряжению о наказании, а приставочное значение глагола указывает на резкое снятие одежды.
- source_word: αὐτῶν τὰ ἱμάτια
  choice: с них одежду
  rationale: Ясно показывает, что сняли одежду Павла и Силы; единственное собирательное «одежду» звучит по-русски естественнее буквального «их одежды».
- source_word: ἐκέλευον
  choice: велели
  rationale: Передаёт властное распоряжение естественным русским языком. Отдельное выражение длительности имперфекта сделало бы фразу тяжеловесной, тогда как процессуальный характер сцены сохраняется контекстом.
- source_word: ῥαβδίζειν
  choice: бить их палками
  rationale: Прямо передаёт наказание ударами прутьев или палок и не создаёт ассоциации с бичом либо плетью.
