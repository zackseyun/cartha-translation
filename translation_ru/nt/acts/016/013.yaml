base_translation:
  language: en
  yaml_path: translation/nt/acts/016/013.yaml
  text: On the Sabbath day we went outside the gate beside the river[a], where we supposed there was a place of prayer, and after sitting down we were speaking to the women who had gathered there.
translation:
  language: ru
  text: В субботу мы вышли за ворота к реке, где, как мы полагали, было место для молитвы[a]. Сев, мы говорили с собравшимися там женщинами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «где, как мы полагали, совершалась молитва». Греческое слово может означать как молитву, так и место, отведённое для молитвы; здесь контекст скорее указывает на место для молитвы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἡμέρᾳ τῶν σαββάτων
  choice: В субботу
  rationale: Греческое выражение является обычным койне-идиомом со значением дня субботы; естественная русская передача не требует буквального «в день суббот».
- source_word: ἐξήλθομεν ἔξω τῆς πύλης
  choice: мы вышли за ворота
  rationale: Передаёт направленное движение наружу и сохраняет упоминание ворот, не добавляя отсутствующего в греческом тексте слова «городские».
- source_word: παρὰ ποταμόν
  choice: к реке
  rationale: παρά с винительным здесь выражает движение к месту у реки; в сочетании с глаголом движения по-русски естественно «к реке».
- source_word: οὗ ἐνομίζομεν προσευχὴν εἶναι
  choice: где, как мы полагали, было место для молитвы
  rationale: νομίζω означает «полагать, считать», а προσευχή может обозначать как молитву, так и выделенное для неё место. Контекст собрания у реки благоприятствует локальному значению.
- source_word: καὶ καθίσαντες
  choice: Сев
  rationale: Аористное причастие обозначает действие, предшествующее говорению; краткая русская конструкция ясно сохраняет последовательность.
- source_word: ἐλαλοῦμεν
  choice: мы стали говорить
  rationale: Конструкция передаёт начало и последующее протекание речи, соответствуя несовершенному виду греческого имперфекта и звуча естественно в повествовании.
- source_word: ταῖς συνελθούσαις γυναιξίν
  choice: с собравшимися там женщинами
  rationale: Причастие указывает на женщин, уже собравшихся вместе; «там» естественно связывает собрание с названным местом.
theological_decisions:
- issue: Значение προσευχή в данном контексте
  choice: место для молитвы
  alternative: «молитва» как действие; «синагога» как институциональное толкование
  rationale: Контекст описывает конкретное место у реки, где собрались люди, а в эллинистическом иудейском употреблении προσευχή может обозначать молитвенное место. При этом перевод не вводит более узкое слово «синагога», которого в греческом тексте нет; лексическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный повествовательный стиль. Сохранены пространственная последовательность и длительный характер говорения; институционально окрашенное «синагога» не добавлено.
