- from: 'Ночью Павлу явилось видение: перед ним стоял некий македонянин и настойчиво просил его: «Переправься в Македонию[a] и помоги нам!»'
  to: 'Ночью Павлу явилось видение: стоял некий македонянин и настойчиво просил его: «Перейди в Македонию и помоги нам!»'
  rationale: 'Удалено не выраженное в оригинале пространственное уточнение «перед ним». «Переправься» заменено нейтральным «перейди», чтобы не предполагать конкретного способа перехода. Сноска не требуется: русская конструкция естественно передаёт греческий призыв, а буквальное «перейдя» в этом месте было бы менее ясным и не представляет существенной текстологической или смысловой альтернативы.'
