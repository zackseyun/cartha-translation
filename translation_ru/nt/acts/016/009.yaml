source:
  edition: SBLGNT
  text: καὶ ὅραμα ⸀διὰ νυκτὸς ⸂τῷ Παύλῳ ὤφθη⸃, ἀνὴρ ⸂Μακεδών τις ἦν⸃ ἑστὼς ⸀καὶ παρακαλῶν αὐτὸν καὶ λέγων· Διαβὰς εἰς Μακεδονίαν βοήθησον ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/009.yaml
  text: 'And a vision appeared to Paul in the night: a certain Macedonian man was standing and urging him[a], saying[c][b], “Come over into Macedonia and help us.”'
translation:
  language: ru
  text: 'Ночью Павлу явилось видение: стоял некий македонянин и настойчиво просил его: «Перейди в Македонию и помоги нам!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅραμα
  choice: видение
  rationale: Обычное в Деяниях обозначение данного свыше зрительного откровения; перевод не уточняет природу переживания сверх сказанного в тексте.
- source_word: διὰ νυκτός
  choice: ночью
  rationale: Естественно и точно передаёт временное значение греческого оборота в современном русском языке.
- source_word: τῷ Παύλῳ ὤφθη
  choice: Павлу явилось
  rationale: Пассивная форма ὁράω с дательным лицом идиоматически означает, что нечто явилось этому лицу; формулировка сохраняет явленный характер видения.
- source_word: ἀνὴρ Μακεδών τις
  choice: некий македонянин
  rationale: ἀνήρ указывает на мужчину, Μακεδών — на его македонское происхождение, а τις сохраняется словом «некий».
- source_word: ἦν ἑστώς
  choice: стоял
  rationale: Естественная русская передача перифрастической конструкции, описывающей положение человека в разворачивающейся сцене.
- source_word: παρακαλῶν αὐτὸν καὶ λέγων
  choice: настойчиво просил его
  rationale: В данном контексте παρακαλέω выражает настоятельную просьбу, а λέγων вводит её содержание; объединение глагольных форм устраняет тяжеловесность без утраты смысла.
- source_word: Διαβάς εἰς Μακεδονίαν
  choice: Переправься в Македонию
  rationale: Аористное причастие вместе с повелительным глаголом выражает сопутствующее предшествующее действие; «переправься» передаёт движение через водную преграду к Македонии.
- source_word: βοήθησον ἡμῖν
  choice: помоги нам
  rationale: Прямая, ясная и точная передача повелительной просьбы о помощи.
theological_decisions:
- issue: Характер видения, обозначенного словами ὅραμα и ὤφθη
  choice: Передать как явившееся Павлу видение, не определяя точнее способ его восприятия.
  alternative: Сон, внутреннее впечатление или объективное явление.
  rationale: Греческий текст называет переживание видением и сообщает, что оно явилось Павлу ночью, но не раскрывает его точную феноменологию.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. «Явилось видение» сохраняет библейскую торжественность без архаизации; «настойчиво просил» передаёт силу обращения, не усиливая её до мольбы.
