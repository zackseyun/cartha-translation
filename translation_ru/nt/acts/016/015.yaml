review_pass:
  verdict: revise
  source_fidelity: Нужна небольшая правка для более точной передачи залога и заключительного глагола. «Крестились» в русском возможно, но «были крещены» яснее передаёт греческий страдательный аорист. «Настояла на своём» не выражает прямо, что Лидия склонила к этому именно «нас»; παρεβιάσατο ἡμᾶς требует сохранить этот объект.
  naturalness: Исправленный текст остаётся современным литературным русским и звучит естественно. «Настойчиво просила нас» и «убедила нас» ясно передают гостеприимное приглашение и его настойчивый результат.
  terminology: «Домашние» и «дом» удачно различают социальное и пространственное значения οἶκος. «Верной Господу» сохраняет допустимую смысловую широту πιστή; примечание уместно отмечает альтернативу «верующей в Господа».
  issues:
  - severity: medium
    issue: «Крестились» вместо явной страдательной конструкции
    rationale: ἐβαπτίσθη — страдательная форма («была крещена»), а в координированном русском выражении — «были крещены». Возвратное «крестились» допустимо в церковном употреблении, но менее однозначно отражает залог оригинала.
  - severity: medium
    issue: «И она настояла на своём»
    rationale: Фраза не называет людей, которых Лидия склонила, тогда как ἡμᾶς («нас») — прямое дополнение. «Она убедила нас» сохраняет и объект, и результат её настойчивости.
  - severity: low
    issue: «Стала просить нас»
    rationale: Аорист παρεκάλεσεν сообщает о самой настойчивой просьбе, но не обязательно о её начале. «Настойчиво просила нас» точнее передаёт лексический оттенок без добавления ингрессивного значения.
