base_translation:
  language: en
  yaml_path: translation/nt/acts/016/015.yaml
  text: And when she and her household were baptized[a], she urged us, saying, “If you have judged me to be faithful to the Lord, come into my house and stay.” And she prevailed upon us.
translation:
  language: ru
  text: 'Когда же она и её домашние были крещены, она настойчиво просила нас: «Если вы признали меня верной Господу[a], войдите в мой дом и оставайтесь». И она убедила нас.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верующей в Господа». Греческое прилагательное может означать «верная», «достойная доверия» или «верующая».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς
  choice: Когда же она и её домашние крестились
  rationale: Временное ὡς с мягким связующим δέ естественно передано как «когда же». Хотя сказуемое в греческом стоит в единственном числе и сначала относится к Лидии, добавление «и её дом» распространяет событие на всё домашнее сообщество; по-русски естественно множественное число. «Домашние» обозначает людей её дома, а не здание.
- source_word: παρεκάλεσεν
  choice: стала просить нас
  rationale: παρακαλέω здесь означает настойчивую просьбу-приглашение. Русское «стала просить» звучит естественно и в сочетании с заключительным указанием на её настойчивость не ослабляет смысла.
- source_word: Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι
  choice: Если вы признали меня верной Господу
  rationale: Перфект κεκρίκατέ выражает уже сложившуюся оценку, поэтому выбрано «признали». «Верной Господу» сохраняет возможные оттенки преданности, надёжности и веры, не сводя прилагательное лишь к одному из них.
- source_word: εἰσελθόντες εἰς τὸν οἶκόν μου μένετε
  choice: войдите в мой дом и оставайтесь
  rationale: Причастие εἰσελθόντες передано как сопутствующее повеление. Здесь οἶκος означает жилище, поэтому употреблено «дом»; μένετε — «оставайтесь», то есть поселитесь у неё на время.
- source_word: καὶ παρεβιάσατο ἡμᾶς
  choice: И она настояла на своём
  rationale: Средний глагол παραβιάζομαι передаёт сильную настойчивость, благодаря которой собеседники уступили. Выражение «настояла на своём» сохраняет силу, не создавая впечатления физического принуждения.
theological_decisions:
- issue: Крещение Лидии и её домашних
  choice: Передать повествовательное утверждение прямо, не уточняя возраст и состояние веры домашних.
  alternative: Сформулировать текст так, чтобы он подразумевал либо крещение младенцев, либо крещение исключительно лично исповедавших веру.
  rationale: Стих сообщает о крещении домашних, но не описывает состав дома и не разрешает позднейшие конфессиональные споры.
- issue: Значение πιστή в словах Лидии
  choice: верной Господу
  alternative: верующей в Господа; достойной доверия перед Господом
  rationale: Греческое прилагательное допускает оттенки веры, верности и надёжности. Основной текст сохраняет эту смысловую широту, а примечание сообщает существенную альтернативу.
translation_notes:
  register: 'Современный литературный русский язык с ясным, достойным повествовательным тоном. Различены два значения οἶκος: «домашние» как домашнее сообщество и «дом» как жилище. Формулировка не привносит конфессиональных выводов о крещении домашних.'
