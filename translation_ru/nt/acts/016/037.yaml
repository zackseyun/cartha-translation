id: ACT.16.37
reference: Acts 16:37
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ Παῦλος ἔφη πρὸς αὐτούς· Δείραντες ἡμᾶς δημοσίᾳ ἀκατακρίτους, ἀνθρώπους Ῥωμαίους ὑπάρχοντας, ἔβαλαν εἰς φυλακήν· καὶ νῦν λάθρᾳ ἡμᾶς ἐκβάλλουσιν; οὐ γάρ, ἀλλὰ ἐλθόντες αὐτοὶ ⸀ἡμᾶς ἐξαγαγέτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/037.yaml
  text: But Paul said to them[a], “After beating us publicly without trial, though we are Roman citizens, they threw us into prison; and now are they sending us out secretly? No indeed! Rather[c][b], let them come themselves and lead us out.”
translation:
  language: ru
  text: 'Но Павел сказал им: «Нас публично избили без суда[a], хотя мы римские граждане[b], и бросили в тюрьму, а теперь тайком выгоняют? Нет уж! Пусть сами придут и выведут нас[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не вынеся нам приговора»; буквально — «неосуждённых».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «людей, являющихся римлянами»; здесь речь идёт о римском гражданстве и связанных с ним правовых гарантиях.'
    reason: cultural_note
  - marker: c
    text: 'Или: «выведут наружу»; по контексту также возможно: «сами проводят нас из тюрьмы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη πρὸς αὐτούς
  choice: сказал им
  rationale: Естественная для современного русского повествования передача обычной формулы введения прямой речи.
- source_word: Δείραντες ἡμᾶς δημοσίᾳ
  choice: Нас публично избили
  rationale: Аористное причастие обозначает действие, предшествующее заключению в тюрьму; «избили» не сужает значение до конкретного вида бичевания, а «публично» точно передаёт наречие.
- source_word: ἀκατακρίτους
  choice: без суда
  rationale: В данном правовом контексте кратко и понятно передаёт отсутствие судебного осуждения; более буквальная возможность отмечена в сноске.
- source_word: ἀνθρώπους Ῥωμαίους ὑπάρχοντας
  choice: хотя мы римские граждане
  rationale: 'Передаёт подразумеваемую уступительную силу оборота и его юридический смысл: Павел и Сила обладали римским гражданством и соответствующей правовой защитой.'
- source_word: ἔβαλαν εἰς φυλακήν
  choice: бросили в тюрьму
  rationale: Сохраняет резкость βάλλω и естественно звучит по-русски.
- source_word: λάθρᾳ ἡμᾶς ἐκβάλλουσιν
  choice: теперь тайком выгоняют
  rationale: Сохраняет настоящее время риторического вопроса, скрытность действия и резкий оттенок ἐκβάλλω.
- source_word: οὐ γάρ
  choice: Нет уж!
  rationale: Передаёт решительный, усиленный отказ без добавления отдельного довода.
- source_word: ἐλθόντες αὐτοὶ ἡμᾶς ἐξαγαγέτωσαν
  choice: Пусть сами придут и выведут нас
  rationale: «Сами» сохраняет эмфазу αὐτοί, а «выведут» прямо передаёт ἐξάγω, не уточняя, должно ли это быть официальным сопровождением.
theological_decisions:
- issue: Юридический смысл указания на римский статус
  choice: римские граждане
  alternative: римляне
  rationale: Контекст связан с незаконным телесным наказанием и заключением лиц, обладавших римскими гражданскими правами; такая передача раскрывает языковой и исторический смысл, не привнося конфессионального толкования.
- issue: Значение ἀκατακρίτους
  choice: без суда
  alternative: неосуждёнными; не вынеся нам приговора
  rationale: Греческое слово непосредственно указывает на отсутствие судебного осуждения. Основной текст естественно выражает юридическую несправедливость, а сноска сохраняет более буквальные варианты и не утверждает лишних подробностей о процедуре.
translation_notes:
  register: Современный литературный русский язык с достоинством и живой резкостью прямой речи. Юридический смысл выражен понятно для обычного читателя; буквальные альтернативы и историко-правовое пояснение вынесены в сноски. Риторический вопрос и личная, публичная ответственность городских начальников сохранены.
