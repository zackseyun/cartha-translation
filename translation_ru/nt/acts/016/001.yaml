lexical_decisions:
- source_word: Κατήντησεν δὲ καὶ
  choice: Он пришёл также
  rationale: Καταντάω обозначает прибытие в какое-либо место, а сочетание δὲ καὶ продолжает повествование и добавляет новый пункт маршрута. «Пришёл также» естественно передаёт обе составляющие.
- source_word: εἰς Δέρβην καὶ εἰς Λύστραν
  choice: в Дервию и Листру
  rationale: В рассказе о путешествии εἰς с названиями городов означает направление движения. Русское управление не требует повторения предлога перед вторым однородным названием.
- source_word: καὶ ἰδοὺ
  choice: И вот
  rationale: Ἰδού привлекает внимание к появлению нового важного лица; «и вот» сохраняет выразительность повествовательного перехода.
- source_word: μαθητής τις ἦν ἐκεῖ
  choice: там был один ученик
  rationale: Τις вводит конкретного, прежде не упоминавшегося человека. «Один ученик» передаёт эту неопределённость естественнее для современного русского языка, а «там был» сохраняет указание ἐκεῖ.
- source_word: ὀνόματι Τιμόθεος
  choice: по имени Тимофей
  rationale: Естественное русское соответствие дательному обороту ὀνόματι с личным именем.
- source_word: γυναικὸς Ἰουδαίας πιστῆς
  choice: мать была верующей иудейкой
  rationale: В данном контексте πιστή вероятнее всего означает принадлежность к верующим. Развёрнутая русская конструкция ясно передаёт эллиптическую греческую родословную формулу.
- source_word: πατρὸς δὲ Ἕλληνος
  choice: а отец — греком
  rationale: Δέ выражает контраст между матерью-иудейкой и отцом-греком. Отдельная часть предложения звучит по-русски естественно и сохраняет противопоставление.
theological_decisions:
- issue: Значение πιστῆς применительно к матери Тимофея
  choice: верующей
  alternative: верной
  rationale: В Деяниях πιστός в подобных контекстах обычно обозначает человека, уверовавшего во Христа. Вместе с тем прилагательное допускает значение «верная», поэтому лексическая неоднозначность отмечена в сноске без догматического сужения.
- issue: Значение Ἕλληνος применительно к отцу Тимофея
  choice: греком
  alternative: язычником
  rationale: Ἕλλην прямо указывает на грека по происхождению или культуре; более широкое религиозное обозначение «язычник» внесло бы в текст дополнительное толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной повествовательной интонацией. Формула «И вот» сохраняет выразительность оригинала, а родословное описание развёрнуто в два грамматически ясных утверждения. Имена городов даны в традиционной русской библейской форме.
