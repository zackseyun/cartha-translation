  yaml_path: translation/nt/acts/016/020.yaml
  text: And after bringing them before the magistrates[a], they said, “These men are disturbing our city[b], being Jews,”
translation:
  language: ru
  text: 'Приведя их к городским начальникам[a], они сказали: «Эти люди возмущают наш город, будучи иудеями[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к преторам» — высшим римским городским должностным лицам в такой колонии, как Филиппы.'
