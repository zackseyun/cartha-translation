lexical_decisions:
- source_word: προσαγαγόντες
  choice: Приведя
  rationale: Аористное причастие обозначает действие, предшествующее εἶπαν; деепричастие естественно передаёт эту последовательность по-русски.
- source_word: στρατηγοῖς
  choice: городским начальникам
  rationale: В римской колонии Филиппы слово обозначает высших городских должностных лиц; выражение понятно современному читателю, а специальный исторический термин вынесен в сноску.
- source_word: ἐκταράσσουσιν
  choice: возмущают
  rationale: Глагол означает приводить в сильное волнение или смятение; «возмущают город» сохраняет силу обвинения и лаконичность исходного текста.
- source_word: ἡμῶν τὴν πόλιν
  choice: наш город
  rationale: Сохраняет притяжательное и риторически подчеркнутое противопоставление обвинителей пришельцам.
- source_word: Ἰουδαῖοι
  choice: иудеи
  rationale: В данном контексте речь идёт об этнорелигиозной принадлежности Павла и Силы, а не только об их связи с географической Иудеей.
- source_word: ὑπάρχοντες
  choice: Они иудеи
  rationale: Отдельное краткое предложение естественно по-русски передаёт причастную конструкцию, не уточняя однозначно, является ли принадлежность сопутствующим обстоятельством или основанием обвинения.
- source_word: Οὗτοι οἱ ἄνθρωποι
  choice: Эти люди
  rationale: Указательное выражение относится к конкретным мужчинам, однако в русском обвинительная формула «эти люди» звучит естественнее, чем избыточно маркированное «эти мужчины».
theological_decisions:
- issue: Передача Ἰουδαῖοι в составе враждебного этнорелигиозного обвинения
  choice: иудеи
  alternative: жители Иудеи
  rationale: В диаспорном контексте Филипп слово, вероятнее всего, указывает на этнорелигиозную идентичность. Текст передаёт слова обвинителей, а не оценку повествователя и не суждение обо всех иудеях.
- issue: Связь ὑπάρχοντες с обвинением
  choice: Они иудеи
  alternative: потому что они иудеи / будучи иудеями
  rationale: Греческое причастие допускает оттенок сопутствующего обстоятельства или основания. Самостоятельная фраза сохраняет резкость обвинения и не делает причинное значение более определённым, чем в оригинале.
translation_notes:
  register: Современный литературный русский язык с лаконичной судебно-общественной формулировкой. «Городские начальники» предпочтено малоупотребительному «магистраты» в основном тексте; историческое обозначение дано в сноске. Пунктуационное разделение последней части сохраняет двусмысленность синтаксической роли ὑπάρχοντες.
