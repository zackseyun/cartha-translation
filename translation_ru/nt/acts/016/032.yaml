base_translation:
  language: en
  yaml_path: translation/nt/acts/016/032.yaml
  text: And they spoke the word of the Lord to him[c][b][a], together with all who were in his house.
translation:
  language: ru
  text: И они говорили слово Господа[a] ему и всем, кто был в его доме[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «весть о Господе». Греческое выражение может означать слово, принадлежащее Господу, исходящее от Него или повествующее о Нём.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «ему вместе со всеми, кто был в его доме». Слово «дом» здесь может также подразумевать домашних.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησαν
  choice: говорили
  rationale: Форма от λαλέω обозначает устное обращение и передачу вести. «Говорили» сохраняет обычный, не усиленный характер глагола; «проповедовали» или «возвещали» добавило бы более выраженный оттенок публичного провозглашения.
- source_word: αὐτῷ
  choice: ему
  rationale: Дательный падеж указывает на тюремщика как адресата речи.
- source_word: τὸν λόγον
  choice: слово
  rationale: Здесь λόγος означает сообщаемую христианскую весть. «Слово» сохраняет устойчивое новозаветное выражение и не сужает его до одного из возможных толкований.
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: Родительный падеж сохранён без уточнения, исходит ли это слово от Господа или повествует о Господе.
- source_word: σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: и всем, кто был в его доме
  rationale: Греческое σύν буквально означает «вместе с». В контексте эти люди также слышат обращённое к ним слово, поэтому по-русски естественно представить их как дополнительных адресатов, не создавая впечатления, будто они лишь сопровождали тюремщика.
- source_word: οἰκίᾳ
  choice: доме
  rationale: οἰκία может обозначать как здание, так и домашних. Конкретное «в доме» близко к греческой форме, а контекст ясно указывает на находившихся там людей.
theological_decisions:
- issue: Значение выражения «слово Господа»
  choice: Сохранено «слово Господа» без уточнения отношения родительного падежа.
  alternative: «весть от Господа» или «весть о Господе»
  rationale: Греческое выражение допускает значение слова, принадлежащего Господу, исходящего от Него или повествующего о Нём. Основной текст сохраняет эту смысловую открытость.
- issue: Круг адресатов
  choice: Тюремщик и все находившиеся в его доме представлены как адресаты слова.
  alternative: «ему вместе со всеми, кто был в его доме»
  rationale: Хотя σύν формально означает «вместе с», контекст указывает, что присутствующие также слышали передаваемое слово. Русская конструкция с повторно подразумеваемым адресатным дательным выражает это естественно, не делая дополнительных выводов о составе семьи.
translation_notes:
  register: Современный литературный русский язык с сохранением новозаветного выражения «слово Господа». Порядок слов умеренно книжный, но ясный; архаизмы «Господне», «бывшие» и конфессионально нагруженное «проповедовали» не использованы.
