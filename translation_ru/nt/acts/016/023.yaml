lexical_decisions:
- source_word: πολλὰς ... πληγὰς
  choice: множество ударов
  rationale: Передаёт многочисленные удары при избиении, не уточняя орудие наказания и не смещая значение к ранам как последствиям.
- source_word: τε
  choice: и
  rationale: Связующая частица продолжает предшествующее повествование; в русском её функция естественно передаётся союзом «и» перед вторым однородным сказуемым.
- source_word: ἐπιθέντες
  choice: нанеся
  rationale: В сочетании с πληγάς означает «нанеся удары»; деепричастие сохраняет предшествование действию главного глагола.
- source_word: ἔβαλον εἰς φυλακήν
  choice: их бросили в темницу
  rationale: «Бросили» сохраняет энергичность βάλλω и насильственный характер заключения; «темница» обозначает место заключения и уместна в современном литературном библейском повествовании.
- source_word: παραγγείλαντες
  choice: приказали
  rationale: Передаёт властный характер распоряжения без излишней канцелярской тяжеловесности.
- source_word: δεσμοφύλακι
  choice: тюремщику
  rationale: Краткое и точное обозначение человека, отвечающего за заключённых.
- source_word: ἀσφαλῶς τηρεῖν
  choice: надёжно стеречь
  rationale: В данном контексте речь идёт об обеспечении строгой охраны и предотвращении побега, а не о безопасности заключённых.
- source_word: αὐτούς
  choice: их
  rationale: Местоимение относится к Павлу и Силе как к заключённым, которых надлежало стеречь.
