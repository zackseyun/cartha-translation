translation:
  language: ru
  text: Миновав Мисию[a], они спустились в Троаду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пройдя через Мисию»; или: «пройдя мимо Мисии». Греческое причастие допускает несколько близких вариантов перевода. По смыслу они продолжили путь, не задерживаясь там.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρελθόντες
  choice: Миновав
  rationale: Аористное причастие παρέρχομαι с винительным падежом названия области допускает значения движения мимо, через или далее без остановки. «Миновав» естественно и кратко передаёт продолжение пути, не уточняя сверх греческого текста, шли ли они строго мимо границ области или через неё.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: δέ — слабая повествовательная связка. В русском языке последовательность событий естественно передаётся без отдельного союза; добавление «итак» могло бы придать лишний оттенок вывода.
- source_word: Μυσίαν
  choice: Мисию
  rationale: Устоявшаяся русская форма названия области; винительный падеж соответствует греческой конструкции.
- source_word: κατέβησαν
  choice: они спустились
  rationale: Сохраняет направительное значение καταβαίνω — движение вниз, вероятно к побережью или в более низкую местность, и звучит естественно по-русски.
- source_word: εἰς
  choice: в
  rationale: При названии города εἰς естественно передаётся русским предлогом «в», обозначающим направление к месту назначения.
- source_word: Τρῳάδα
  choice: Троаду
  rationale: Устоявшаяся русская форма названия города Троада в винительном падеже.
