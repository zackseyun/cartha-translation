lexical_decisions:
- source_word: προαγαγὼν αὐτοὺς ἔξω
  choice: Выведя их наружу
  rationale: Аористное причастие обозначает действие, предшествующее вопросу; «выведя» естественно передаёт последовательность, а «наружу» — направленность ἔξω.
- source_word: ἔφη
  choice: он спросил
  rationale: Хотя буквально глагол означает «сказал», следующая прямая речь является вопросом, поэтому по-русски естественно «спросил».
- source_word: Κύριοι
  choice: Господа
  rationale: Звательная форма множественного числа здесь служит почтительным обращением к Павлу и Силе, а не божественным титулом.
- source_word: τί με δεῖ ποιεῖν
  choice: что мне нужно делать
  rationale: δεῖ выражает необходимость; несовершенный вид «делать» соответствует инфинитиву настоящего времени ποιεῖν и не сужает вопрос до одного действия.
- source_word: ἵνα σωθῶ
  choice: чтобы спастись
  rationale: Конструкция с ἵνα передаёт цель, а русское «спастись» является естественным соответствием греческой пассивной формы σωθῶ.
theological_decisions:
- issue: Значение σωθῶ в вопросе тюремщика
  choice: спастись
  alternative: быть спасённым; получить избавление
  rationale: Контекст последующего ответа в стихе 31 указывает на спасение в полном духовном смысле, однако выбранная общеупотребительная формулировка не вводит более узкой конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский язык; повествование лаконичное и dignified. Обращение «господа» уместно в историческом контексте и понятно современному читателю. Синтаксис вопроса сохраняет необходимость действия и цель спасения.
