  yaml_path: translation/nt/acts/016/035.yaml
  text: And when day came[a], the magistrates sent the rod-bearers, saying, “Release those men.”
translation:
  language: ru
  text: 'Когда же наступил день, магистраты послали ликторов[a] со словами: «Отпусти тех людей».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ликторы — служители римских магистратов, носившие связки прутьев как знак власти; буквально: «носители прутьев».'
    reason: Поясняет исторический термин «ликторы» и сохраняет буквальный образ греческого ῥαβδοῦχοι.
lexical_decisions:
- source_word: Ἡμέρας δὲ γενομένης
  choice: Когда же настал день
  rationale: Генитив абсолютный обозначает временной переход; формулировка естественна по-русски и сохраняет связующую силу δέ.
- source_word: ἀπέστειλαν
  choice: послали
  rationale: Обычное и точное соответствие аористу ἀποστέλλω в данном контексте.
- source_word: στρατηγοὶ
  choice: городские начальники
  rationale: В Филиппах речь идёт о высших должностных лицах римской колонии, а не о военачальниках; выражение понятно современному читателю и передаёт гражданскую должность.
- source_word: ῥαβδούχους
  choice: ликторов
  rationale: Исторически точное обозначение официальных служителей римских магистратов; пояснение вынесено в сноску, поскольку термин может быть незнаком читателю.
- source_word: λέγοντες
  choice: со словами
  rationale: Естественно по-русски вводит содержание переданного распоряжения, сохраняя смысл причастия.
- source_word: Ἀπόλυσον
  choice: Отпусти
  rationale: 'Форма единственного числа сохранена: распоряжение через посланцев обращено к тюремщику; глагол естественно передаёт освобождение из-под стражи.'
- source_word: τοὺς ἀνθρώπους ἐκείνους
  choice: тех людей
  rationale: Передаёт указательное значение ἐκείνους без стилистически неестественного или пренебрежительного оттенка.
