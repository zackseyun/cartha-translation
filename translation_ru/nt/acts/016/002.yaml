  text: ὃς ἐμαρτυρεῖτο ὑπὸ τῶν ἐν Λύστροις καὶ Ἰκονίῳ ἀδελφῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/002.yaml
  text: He was well spoken of by the brothers in Lystra and Iconium[a].
translation:
  language: ru
  text: О нём хорошо отзывались братья в Листре и Иконии[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры», то есть верующие в этих городах.'
    reason: 'Лексическая альтернатива: ἀδελφοί во множественном числе может обозначать всю общину единоверцев, включая мужчин и женщин.'
lexical_decisions:
- source_word: ὃς
  choice: О нём
  rationale: Относительное местоимение относится к Тимофею из предыдущего стиха; в русском языке самостоятельное предложение естественно начать сочетанием «О нём», связанным с глаголом «отзывались».
- source_word: ἐμαρτυρεῖτο
  choice: хорошо отзывались
  rationale: Имперфект пассива μαρτυρέω здесь передаёт устойчивое благоприятное свидетельство о Тимофее. Русское выражение «о нём хорошо отзывались» естественно и точно передаёт смысл репутации.
- source_word: ὑπὸ
  choice: братья… отзывались
  rationale: Предлог с родительным падежом обозначает действующих лиц при пассивной форме. В русском переводе пассив естественно преобразован в активную конструкцию, где «братья» выступают подлежащим.
- source_word: τῶν ἐν Λύστροις καὶ Ἰκονίῳ
  choice: в Листре и Иконии
  rationale: Оборот определяет братьев как находящихся в этих двух городах; предложная конструкция сохраняет эту локальную связь кратко и ясно.
- source_word: ἀδελφῶν
  choice: братья
  rationale: Сохраняется грамматически мужская форма греческого слова, тогда как сноска поясняет возможное более широкое обозначение местных верующих обоих полов.
theological_decisions:
- issue: Гендерный охват слова ἀδελφῶν применительно к христианской общине
  choice: братья
  alternative: братья и сёстры; верующие
  rationale: Основной текст сохраняет мужскую форму оригинала и не устраняет его формальную особенность; сноска отмечает, что в раннехристианском употреблении слово могло охватывать всю общину верующих.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная. Активная русская конструкция устраняет тяжеловесность буквального пассива, не меняя смысла.
