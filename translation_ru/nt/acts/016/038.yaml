id: ACT.16.38
reference: Acts 16:38
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀ἀπήγγειλαν δὲ τοῖς στρατηγοῖς οἱ ῥαβδοῦχοι τὰ ῥήματα ταῦτα· ⸂ἐφοβήθησαν δὲ⸃ ἀκούσαντες ὅτι Ῥωμαῖοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/038.yaml
  text: So the rod-bearers reported these words to the magistrates[a], and they were afraid when they heard that they were Romans[c][b],
translation:
  language: ru
  text: Ликторы[a] передали эти слова городским властям[b]. Услышав, что Павел и Сила — римляне[c], те испугались.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ликторы — служители при римских должностных лицах; они носили связки прутьев как знак власти.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «стратегам»; так названы высшие городские должностные лица в Филиппах.'
    reason: cultural_note
  - marker: c
    text: 'То есть римские граждане. В греческом тексте буквально: «римляне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: передали
  rationale: Глагол обозначает сообщение или передачу сведений; в данном контексте речь идёт об официальной передаче слов тюремщика городским должностным лицам.
- source_word: στρατηγοῖς
  choice: городским властям
  rationale: В римской колонии Филиппы слово обозначает высших городских должностных лиц. Этот вариант понятен современному читателю и не приписывает им неточный современный титул.
- source_word: ῥαβδοῦχοι
  choice: ликторы
  rationale: Так назывались служители при римских должностных лицах, носившие связки прутьев как знак их власти. Исторический термин точнее буквального, но неестественного русского «жезлоносцы»; пояснение дано в сноске.
- source_word: τὰ ῥήματα ταῦτα
  choice: эти слова
  rationale: Прямо сохраняет форму греческого выражения и отсылает к сообщению в предыдущем стихе.
- source_word: ἐφοβήθησαν
  choice: испугались
  rationale: Естественно передаёт аорист ἐφοβήθησαν как возникшую вследствие услышанного реакцию страха.
- source_word: ἀκούσαντες
  choice: услышав
  rationale: Деепричастие естественно передаёт предшествующее и причинно связанное действие греческого аористного причастия.
- source_word: Ῥωμαῖοί
  choice: римляне
  rationale: Греческий текст буквально говорит «римляне»; юридически в данном контексте имеется в виду обладание римским гражданством, что поясняется в сноске.
- source_word: εἰσιν
  choice: Павел и Сила — римляне
  rationale: 'Русский текст явно называет подразумеваемых участников, чтобы устранить неестественную местоименную двусмысленность: испугались власти, тогда как римлянами были Павел и Сила.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Исторический термин «ликторы» сохранён ради точности и кратко объяснён; синтаксис перестроен, чтобы по-русски было однозначно, кто испугался и кто являлся римлянами.
