base_translation:
  language: en
  yaml_path: translation/nt/acts/016/040.yaml
  text: After they came out of the prison[a], they went to Lydia, and when they saw the brothers, they encouraged them and departed.
translation:
  language: ru
  text: Выйдя из темницы, они пришли к Лидии и, увидев братьев[a], ободрили их и ушли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братьев и сестёр». Греческое слово стоит во множественном числе мужского рода, но может обозначать всех верующих, включая женщин.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες δὲ ἀπὸ τῆς φυλακῆς
  choice: Выйдя из темницы
  rationale: Аористное причастие передаёт действие, предшествующее основному; русский деепричастный оборот естественно сохраняет последовательность. «Темница» — понятное и достойное повествовательное обозначение конкретного места заключения.
- source_word: εἰσῆλθον πρὸς τὴν Λυδίαν
  choice: они пришли к Лидии
  rationale: Оборот с πρός при лице означает прийти к этому человеку, вероятно туда, где он находится. Упоминание дома не внесено в основной текст, поскольку его нет явно в данной греческой фразе.
- source_word: ἰδόντες
  choice: увидев
  rationale: Аористное причастие естественно передано деепричастием, обозначающим действие перед последующим ободрением.
- source_word: παρεκάλεσαν
  choice: ободрили
  rationale: παρακαλέω здесь имеет широкий пастырский смысл поддержки и укрепления; «ободрили» не сужает значение до одного лишь утешения или наставления.
- source_word: τοὺς ἀδελφούς
  choice: братьев
  rationale: Сохранена грамматически мужская форма исходного текста; возможное включение женщин разъяснено в сноске.
- source_word: ἐξῆλθαν
  choice: отправились дальше
  rationale: Глагол означает уход или выступление в путь. Контекстуальное «дальше» естественно отличает этот уход от выхода из темницы в начале стиха, не уточняя конечного пункта.
theological_decisions:
- issue: Относится ли τοὺς ἀδελφούς только к мужчинам или ко всей общине верующих
  choice: братьев с пояснением в сноске
  alternative: братьев и сестёр; верующих
  rationale: Основной текст сохраняет форму греческого оригинала, а сноска удерживает реальную возможность смешанной по полу группы, не разрешая неоднозначность без основания.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-достойным повествовательным стилем. Синтаксис близок к греческой последовательности, но естественен по-русски; неявное слово «дом» не добавлено.
