translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Реплика тюремщика звучит как передача официального решения, но без канцелярской тяжеловесности. Техническое наименование филиппийских должностных лиц не вынесено в сноску, поскольку для понимания стиха достаточно функционального обозначения «городские начальники».
