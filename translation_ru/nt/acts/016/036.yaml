  text: ἀπήγγειλεν δὲ ὁ δεσμοφύλαξ τοὺς λόγους ⸀τούτους πρὸς τὸν Παῦλον, ὅτι Ἀπέσταλκαν οἱ στρατηγοὶ ἵνα ἀπολυθῆτε· νῦν οὖν ἐξελθόντες πορεύεσθε ἐν εἰρήνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/036.yaml
  text: 'And the jailer reported these words to Paul: “The magistrates have sent word that you may be released[a]. So now[b], come out and go in peace.”'
translation:
  language: ru
  text: 'Тюремщик передал Павлу эти слова: «Городские должностные лица прислали распоряжение освободить вас[a]. Итак, теперь выходите и идите с миром».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «городские должностные лица». Греч. στρατηγοί обозначает гражданских магистратов Филипп; более специальное название — «преторы».'
    reason: cultural_note
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: передал
  rationale: Глагол обозначает сообщение или передачу полученных сведений; «передал» естественно описывает доставку официального распоряжения.
- source_word: ὁ δεσμοφύλαξ
  choice: тюремщик
  rationale: В данном контексте это человек, отвечавший за тюрьму и заключённых; современное русское слово точно и понятно.
- source_word: τοὺς λόγους τούτους
  choice: эти слова
  rationale: Близко передаёт греческое выражение, не заменяя его более истолковывающим словом «весть» или «сообщение».
- source_word: Ἀπέσταλκαν
  choice: прислали распоряжение
  rationale: Объект глагола «послали» в греческом не выражен, но из контекста ясно, что власти передали распоряжение. По-русски такая экспликация звучит естественно и сохраняет результативность перфекта.
- source_word: οἱ στρατηγοὶ
  choice: городские начальники
  rationale: В римской колонии Филиппы слово обозначает городских должностных лиц. Этот вариант понятнее обычному читателю, чем техническое «преторы», и конкретнее неоднозначного «магистраты».
- source_word: ἵνα ἀπολυθῆτε
  choice: освободить вас
  rationale: Пассивный аорист относится к освобождению из-под стражи; инфинитив естественно передаёт содержание присланного распоряжения.
- source_word: νῦν οὖν
  choice: теперь
  rationale: В контексте «теперь» естественно выражает переход к следствию из полученного распоряжения; отдельное «поэтому» в русском здесь необязательно.
- source_word: ἐξελθόντες πορεύεσθε
  choice: выходите и идите
  rationale: Причастие вместе с повелительным глаголом задаёт последовательность действий. Два согласованных императива естественно воспроизводят её по-русски.
- source_word: ἐν εἰρήνῃ
  choice: с миром
  rationale: Устойчивое и понятное русское выражение, сохраняющее библейский оттенок и смысл мирного, благополучного ухода.
