lexical_decisions:
- source_word: ἐλθόντες
  choice: дойдя
  rationale: Аористное причастие передаёт предшествующее обстоятельство времени; деепричастие естественно обозначает последовательность событий по-русски.
- source_word: δὲ
  choice: же
  rationale: Частица отмечает продолжение повествования с лёгким поворотом; «же» передаёт это без чрезмерно сильного противопоставления.
- source_word: κατὰ τὴν Μυσίαν
  choice: до Мисии[a]
  rationale: В географическом контексте выражение, вероятно, указывает на прибытие к области или её пограничью. Основной текст остаётся естественным, а подлинная пространственная неоднозначность отражена в сноске.
- source_word: ἐπείραζον
  choice: пытались
  rationale: Имперфект передаёт продолжавшуюся или предпринятую попытку, которая не осуществилась.
- source_word: εἰς τὴν Βιθυνίαν πορευθῆναι
  choice: направиться в Вифинию
  rationale: Передаёт намерение двигаться в эту область; «направиться» естественно в контексте путешествия.
- source_word: οὐκ εἴασεν αὐτοὺς
  choice: не позволил им
  rationale: Точно передаёт значение запрета или отсутствия позволения, не усиливая его до категорического «запретил».
- source_word: τὸ πνεῦμα Ἰησοῦ
  choice: Дух Иисуса
  rationale: Сохраняет необычное явное упоминание Иисуса и не подменяет его более привычным выражением «Святой Дух».
theological_decisions:
- issue: Передача христологического выражения τὸ πνεῦμα Ἰησοῦ
  choice: Дух Иисуса
  alternative: Святой Дух; Дух
  rationale: В греческом тексте прямо сказано «Иисуса». Буквенная формулировка сохраняет богословскую выразительность и напряжение исходного текста, не добавляя толкования.
