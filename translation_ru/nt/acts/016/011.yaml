  text: Ἀναχθέντες ⸀οὖν ⸀ἀπὸ Τρῳάδος εὐθυδρομήσαμεν εἰς Σαμοθρᾴκην, τῇ ⸀δὲ ἐπιούσῃ εἰς ⸂Νέαν Πόλιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/011.yaml
  text: So[a], after putting out to sea from Troas, we sailed straight to Samothrace, and on the following day to Neapolis,
translation:
  language: ru
  text: Итак, отплыв из Троады, мы взяли прямой курс на Самофракию, а на следующий день — в Неаполь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: отплыв
  rationale: В морском контексте ἀνάγω означает «выходить в море, отплывать». Деепричастие естественно передаёт предшествующее действие греческого причастия.
- source_word: οὖν
  choice: Итак
  rationale: οὖν связывает маршрут с предшествующими событиями и одновременно продолжает повествование; «итак» сохраняет эту связь без чрезмерно сильного оттенка логического вывода.
- source_word: ἀπὸ Τρῳάδος
  choice: из Троады
  rationale: Предлог ἀπό обозначает исходный пункт, а «Троада» — устоявшаяся русская форма топонима.
- source_word: εὐθυδρομήσαμεν
  choice: мы взяли прямой курс
  rationale: Глагол обозначает плавание прямым курсом. Такой перевод точно передаёт морской образ и звучит естественно по-русски.
- source_word: εἰς Σαμοθρᾴκην
  choice: на Самофракию
  rationale: εἰς обозначает направление к месту назначения; для острова Самофракия нормативно сочетание «на Самофракию».
- source_word: τῇ δὲ ἐπιούσῃ
  choice: а на следующий день
  rationale: Субстантивированное выражение обозначает следующий день; δέ передано союзом «а», который естественно отмечает следующий этап маршрута.
- source_word: εἰς Νέαν Πόλιν
  choice: прибыли в Неаполь
  rationale: Вторая глагольная форма подразумевается из контекста. Добавление «прибыли» необходимо для ясного и естественного русского синтаксиса; Неаполь — традиционная русская форма древнего топонима Νέα Πόλις.
