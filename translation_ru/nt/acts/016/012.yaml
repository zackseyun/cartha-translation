  text: ⸀κἀκεῖθεν εἰς Φιλίππους, ἥτις ἐστὶν ⸂πρώτη τῆς μερίδος⸃ Μακεδονίας πόλις, κολωνία. ἦμεν δὲ ἐν ⸀ταύτῃ τῇ πόλει διατρίβοντες ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/012.yaml
  text: and from there to Philippi[a], which is a leading city of the district of Macedonia, a Roman colony[b]. And we stayed in this city for some days.
translation:
  language: ru
  text: А оттуда — в Филиппы, видный город области Македонии[a], римскую колонию[b]. В этом городе мы пробыли несколько дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «первый город области Македонии». Греческий оборот не вполне ясен: слово «первый» может указывать на ранг, известность или место в последовательности.'
    reason: Альтернативное прочтение
  - marker: b
    text: То есть римскую колонию — город с особым статусом в составе Римского государства.
    reason: Историко-культурное пояснение
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: а оттуда
  rationale: Сохраняет связь с предыдущим маршрутом и не добавляет отсутствующего в греческом тексте глагола движения.
- source_word: εἰς Φιλίππους
  choice: в Филиппы
  rationale: Естественная русская передача направления движения к городу; сохранено традиционное название.
- source_word: πρώτη τῆς μερίδος Μακεδονίας πόλις
  choice: один из главных городов этой части Македонии
  rationale: Передаёт вероятный смысл значимости, не утверждая спорного первенства или административного статуса. Оборот «один из» естественно согласует определение со значением «главный» в современном русском.
- source_word: κολωνία
  choice: римскую колонию
  rationale: Уточнение «римскую» раскрывает подразумеваемый исторический статус, выраженный греческим заимствованным термином.
- source_word: ἦμεν ... διατρίβοντες
  choice: мы провели
  rationale: Естественно передаёт продолжительное пребывание в городе в сочетании с указанием срока.
- source_word: ἡμέρας τινάς
  choice: несколько дней
  rationale: Передаёт неопределённый период без излишней точности.
theological_decisions:
- issue: Значение πρώτη в описании Филипп
  choice: «один из главных городов»
  alternative: «первый город»
  rationale: Греческий оборот труден и может указывать на ранг, известность либо последовательность. Основной текст избегает исторически спорного утверждения, а примечание сохраняет буквальную альтернативу.
translation_notes:
  register: Современный литературный русский язык; повествование звучит естественно и достойно. Тире восполняет подразумеваемое движение без добавления отдельного глагола. Подлинная неоднозначность спорного греческого оборота сохранена в примечании.
