source:
  edition: SBLGNT
  text: Ἐγένετο δὲ πορευομένων ἡμῶν εἰς ⸀τὴν προσευχὴν παιδίσκην τινὰ ἔχουσαν πνεῦμα ⸀πύθωνα ⸀ὑπαντῆσαι ἡμῖν, ἥτις ἐργασίαν πολλὴν παρεῖχεν τοῖς κυρίοις αὐτῆς μαντευομένη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/016.yaml
  text: And it happened that, as we were going to the place of prayer, a certain servant girl who had a python spirit met us, and she was bringing much profit to her masters by fortune-telling.
translation:
  language: ru
  text: Однажды, когда мы шли к месту молитвы, нам встретилась некая девушка-рабыня, у которой был дух Пифона[a]. Прорицая[b], она приносила своим хозяевам большой доход.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух прорицания». По-гречески: «дух Пифона»; это выражение связано с античными представлениями о прорицании.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «занимаясь гаданием».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Однажды
  rationale: Естественно вводит очередное событие повествования, не воспроизводя тяжеловесно семитизированную конструкцию «и случилось».
- source_word: πορευομένων ἡμῶν
  choice: когда мы шли
  rationale: Передаёт одновременное и продолженное фоновое действие генитива абсолютного.
- source_word: εἰς τὴν προσευχὴν
  choice: к месту молитвы
  rationale: Артикль и контекст позволяют понимать προσευχή как определённое место, где собирались для молитвы.
- source_word: παιδίσκην τινά
  choice: одна рабыня
  rationale: Упоминание нескольких хозяев и извлекаемого ими дохода делает её несвободное положение контекстуально значимым; «одна» естественно передаёт неопределённое τινά.
- source_word: ἔχουσαν πνεῦμα πύθωνα
  choice: одержимая духом Пифона
  rationale: Сохраняет культурно обусловленное название πύθων и при этом ясно передаёт, что дух владел девушкой, а не был её добровольным обладанием.
- source_word: ὑπαντῆσαι ἡμῖν
  choice: нам встретилась
  rationale: Естественно передаёт главное событие встречи в русской повествовательной речи.
- source_word: ἐργασίαν πολλὴν παρεῖχεν
  choice: приносила большой доход
  rationale: Передаёт значительную и постоянную материальную выгоду с учётом имперфекта.
- source_word: τοῖς κυρίοις αὐτῆς
  choice: своим хозяевам
  rationale: В данном контексте κύριοι — люди, владевшие рабыней и получавшие от неё прибыль.
- source_word: μαντευομένη
  choice: Прорицая
  rationale: Кратко и достойно передаёт занятие мантической практикой, не сужая его до бытового гадания о будущем.
theological_decisions:
- issue: Передача культурно нагруженного выражения πνεῦμα πύθωνα
  choice: духом Пифона
  alternative: духом прорицания
  rationale: Основной текст сохраняет специфический греческий образ и связанную с ним античную мантическую традицию, а сноска поясняет его смысл, не устраняя культурную неоднозначность.
- issue: Следует ли явно передать несвободное положение παιδίσκη
  choice: рабыня
  alternative: служанка
  rationale: Наличие хозяев, получающих доход от её деятельности, указывает на рабский статус и эксплуатацию; «служанка» могло бы это затемнить.
- issue: Передача ἔχουσαν как состояния девушки
  choice: одержимая
  alternative: имевшая
  rationale: В контексте Деяний речь идёт о присутствии духовной сущности, управляющей её прорицанием. «Одержимая» естественнее по-русски, но сноска и формулировка «дух Пифона» сохраняют исходную специфику без уточнения природы духа сверх текста.
translation_notes:
  register: Современный литературный русский язык; повествование звучит естественно и достойно. Термин «дух Пифона» сохранён ради культурной конкретности оригинала и разъяснён в сноске; социальная эксплуатация девушки явно передана словом «рабыня».
