revisions:
- from: Однажды, когда мы шли к месту молитвы, нам встретилась одна рабыня, одержимая духом Пифона[a]. Прорицая[b], она приносила своим хозяевам большой доход.
  to: Однажды, когда мы шли к месту молитвы, нам встретилась некая девушка-рабыня, у которой был дух Пифона[a]. Прорицая[b], она приносила своим хозяевам большой доход.
  rationale: Исправление ограничено снятием невыраженного в оригинале вывода об одержимости и более полным отражением παιδίσκη. Сохранены повествовательный стиль, культурно специфический термин «дух Пифона», значение продолжающегося дохода и оба сносочных якоря.
