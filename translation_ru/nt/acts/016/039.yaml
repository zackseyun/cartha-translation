  text: Они пришли и стали уговаривать их[a], а затем, выведя их, просили покинуть город[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «убеждать», «упрашивать». Здесь речь, вероятно, идёт о примирительной просьбе властей после незаконного обращения с Павлом и Силой.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческая форма глагола «просили» может указывать на продолжавшуюся или повторявшуюся просьбу: «продолжали просить» или «не раз просили».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: они пришли
  rationale: Аористное причастие обозначает предшествующее действие; личная форма естественно передаёт последовательность событий по-русски.
- source_word: παρεκάλεσαν
  choice: стали уговаривать
  rationale: 'В данном контексте παρακαλέω имеет примирительно-просительный оттенок: власти стараются склонить Павла и Силу к нужному им решению, а не «утешают» их.'
- source_word: αὐτούς
  choice: их
  rationale: Местоимение относится к Павлу и Силе; буквальное соответствие естественно в русском контексте.
- source_word: ἐξαγαγόντες
  choice: выведя из тюрьмы
  rationale: Причастие ἐξάγω означает «вывести». Уточнение «из тюрьмы» восполняет подразумеваемое по непосредственному контексту место и предотвращает ошибочное понимание, будто их вывели из города.
- source_word: ἠρώτων
  choice: просили
  rationale: В контексте ἐρωτάω обозначает вежливую просьбу. Несовершенный вид греческой формы допускает продолжительность или повторяемость действия.
- source_word: ἀπελθεῖν ἀπὸ τῆς πόλεως
  choice: покинуть город
  rationale: Естественное современное русское выражение, точно передающее движение прочь из города.
