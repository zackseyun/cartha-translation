base_translation:
  language: en
  yaml_path: translation/nt/acts/016/026.yaml
  text: Suddenly there was a great earthquake[a], so that the foundations of the prison were shaken; and immediately all the doors were opened[b], and everyone's chains were unfastened.
translation:
  language: ru
  text: Внезапно произошло сильное землетрясение, так что поколебались основания тюрьмы; сразу все двери открылись, и оковы у всех заключённых ослабли.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄφνω
  choice: Вдруг
  rationale: Передаёт внезапность события естественным для современного русского повествования наречием.
- source_word: σεισμὸς ἐγένετο μέγας
  choice: произошло сильное землетрясение
  rationale: Русская конструкция естественно передаёт γίνομαι с существительным; «сильное» выражает μέγας применительно к землетрясению без неестественной буквальности.
- source_word: ὥστε σαλευθῆναι
  choice: так что поколебались
  rationale: ὥστε обозначает результат, а «поколебались» сохраняет смысл пассивного σαλευθῆναι в естественной русской форме.
- source_word: τὰ θεμέλια τοῦ δεσμωτηρίου
  choice: основания темницы
  rationale: «Основания» точно передаёт конструктивные основания здания; «темница» сохраняет контекст заключения и достоинство библейского повествования.
- source_word: παραχρῆμα
  choice: Тотчас
  rationale: Передаёт немедленность действия кратко и литературно.
- source_word: ἠνεῴχθησαν ... αἱ θύραι πᾶσαι
  choice: все двери отворились
  rationale: Медиально-пассивная форма допускает естественное русское «отворились» без указания действующего лица; порядок слов сохраняет охват πᾶσαι.
- source_word: πάντων
  choice: у всех узников
  rationale: Явно восстанавливает подразумеваемых носителей оков из контекста и избегает возможного понимания «у всех» как относящегося к дверям.
- source_word: τὰ δεσμὰ
  choice: оковы
  rationale: Широкое русское обозначение средств связывания, сохраняющее неоднозначность между цепями и иными узами.
- source_word: ἀνέθη
  choice: ослабли
  rationale: Передаёт результат действия ἀνίημι — оковы были отпущены или ослаблены — не утверждая больше, чем сказано в греческом тексте.
