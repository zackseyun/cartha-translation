  rationale: Редакция модернизирует регистр и устраняет сноску, в которой значение греческого глагола было сформулировано слишком широко. Сохраняются результативная связь, всеобщий охват дверей и оков, а также осторожный смысл «ослабли», не подразумевающий освобождения из заключения.
