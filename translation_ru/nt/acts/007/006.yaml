  text: ἐλάλησεν ⸀δὲ οὕτως ὁ θεὸς ὅτι ἔσται τὸ σπέρμα αὐτοῦ πάροικον ἐν γῇ ἀλλοτρίᾳ, καὶ δουλώσουσιν αὐτὸ καὶ κακώσουσιν ἔτη τετρακόσια·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/006.yaml
  text: 'But God spoke in this way: that his offspring would be a foreign resident in a strange land[a], and they would enslave it and mistreat it for four hundred years.'
translation:
  language: ru
  text: 'Но Бог сказал так: «Его потомство будет жить на чужой земле в положении пришельцев[a]; его поработят и будут притеснять четыреста лет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный более свободный перевод: «его потомки будут жить на чужой земле как пришельцы; их поработят и будут притеснять четыреста лет». В греческом тексте употреблено собирательное единственное число: τὸ σπέρμα («потомство»), πάροικον («пришелец») и αὐτό («его»).'
    reason: Лексическая альтернатива и пояснение собирательного единственного числа.
lexical_decisions:
- source_word: ἐλάλησεν δὲ οὕτως ὁ θεὸς
  choice: Но Бог сказал так
  rationale: δέ передаёт лёгкий переход или противопоставление, а οὕτως сохранено явным словом «так». Глагол «сказал» естественно вводит содержание Божьей речи.
- source_word: τὸ σπέρμα αὐτοῦ
  choice: его потомство
  rationale: «Потомство» передаёт собирательное единственное число σπέρμα и ясно указывает на будущих потомков Авраама.
- source_word: πάροικον ἐν γῇ ἀλλοτρίᾳ
  choice: жить пришельцем в чужой земле
  rationale: πάροικος обозначает человека, живущего не на своей земле и не обладающего там полноправным положением. «Жить пришельцем» естественно по-русски передаёт и проживание, и чужеземный статус; «чужой» сохраняет смысл земли, не принадлежащей потомству.
- source_word: δουλώσουσιν αὐτὸ
  choice: его поработят
  rationale: «Поработят» передаёт обращение в рабство; местоимение единственного числа согласовано с собирательным существительным «потомство», как и αὐτό со σπέρμα.
- source_word: κακώσουσιν
  choice: будут притеснять
  rationale: Глагол передаёт причинение страданий и дурное обращение, не сужая смысл до одного конкретного вида насилия.
- source_word: ἔτη τετρακόσια
  choice: четыреста лет
  rationale: Русский винительный времени естественно выражает длительность без дополнительного предлога.
theological_decisions:
- issue: Собирательное единственное число в обозначении потомства Авраама
  choice: 'Сохранено: «потомство… его»'
  alternative: «потомки… их»
  rationale: Греческий текст последовательно употребляет собирательное единственное число σπέρμα и согласованное с ним αὐτό. Русское «потомство» позволяет сохранить эту особенность без неестественной конструкции.
- issue: Неуказанный деятель порабощения и притеснения
  choice: Передан неопределённо-личными формами «поработят» и «будут притеснять»
  alternative: Явно назвать жителей чужой земли
  rationale: В греческом подлежащее выражено только формой третьего лица множественного числа; перевод не добавляет отсутствующего в данном стихе уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формулировка «жить пришельцем» понятна широкому читателю и сохраняет статус временного или неполноправного жителя; синтаксис не уточняет личность притеснителей сверх исходного текста.
