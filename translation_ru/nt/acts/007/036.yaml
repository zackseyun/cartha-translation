  text: οὗτος ἐξήγαγεν αὐτοὺς ποιήσας τέρατα καὶ σημεῖα ἐν ⸀γῇ Αἰγύπτῳ καὶ ἐν Ἐρυθρᾷ Θαλάσσῃ καὶ ἐν τῇ ἐρήμῳ ἔτη τεσσεράκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/036.yaml
  text: This man led them out[a], performing wonders and signs in the land of Egypt and at the Red Sea and in the wilderness for forty years.
translation:
  language: ru
  text: Именно он вывел их, совершая чудеса и знамения в земле Египта, на Красном море[a] и в пустыне в течение сорока лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тростниковом море». В греческом тексте стоит «Красное море» (Ἐρυθρὰ Θάλασσα) — обычное название места перехода Израиля в Новом Завете и греческом переводе Ветхого Завета.'
    reason: Лексическая альтернатива отражает древнееврейский фон названия, тогда как основной текст следует непосредственной греческой формулировке.
lexical_decisions:
- source_word: οὗτος
  choice: Именно он
  rationale: Указательное местоимение подчёркнуто отсылает к Моисею. «Именно он» естественно передаёт эту риторическую силу по-русски, не добавляя к тексту уничижительного или дистанцирующего оттенка, возможного у «этот человек».
- source_word: ἐξήγαγεν αὐτούς
  choice: вывел их
  rationale: Глагол обозначает выведение или приведение наружу; «вывел их» кратко и естественно передаёт исход Израиля под предводительством Моисея.
- source_word: ποιήσας
  choice: совершая
  rationale: Деепричастная конструкция сохраняет связь причастия с главным действием и представляет чудеса и знамения как сопровождавшие служение Моисея, не создавая впечатления, будто все они были полностью завершены до исхода.
- source_word: τέρατα καὶ σημεῖα
  choice: чудеса и знамения
  rationale: 'Устойчивая и точная библейская передача пары: первое слово подчёркивает необычайность и вызываемый трепет, второе — указующее значение деяний.'
- source_word: ἐν γῇ Αἰγύπτῳ
  choice: в Египетской земле
  rationale: 'Сохраняет слово γῇ и трёхчастное перечисление мест: Египетская земля, Красное море, пустыня.'
- source_word: ἐν Ἐρυθρᾷ Θαλάσσῃ
  choice: на Красном море
  rationale: «Красное море» прямо передаёт греческое название Ἐρυθρὰ Θάλασσα. Русское «на море» естественно обозначает место событий, не исключая происходившего в водах моря.
- source_word: ἐν τῇ ἐρήμῳ
  choice: в пустыне
  rationale: Обычная современная русская передача библейского обозначения необжитой пустынной местности, где странствовал Израиль.
- source_word: ἔτη τεσσεράκοντα
  choice: в течение сорока лет
  rationale: Ясно выражает продолжительность событий в пустыне и естественно следует за обстоятельством места.
theological_decisions:
- issue: Указание на Моисея и его роль при исходе
  choice: «Именно он» подчёркивает Моисея как названного в повествовании участника исхода и совершителя знамений.
  alternative: Нейтральное «он», ослабляющее риторическое ударение, или «этот человек», способное звучать отчуждённо.
  rationale: Контекст речи Стефана настойчиво указывает на того самого Моисея, которого прежде отвергли. Формулировка сохраняет человеческую роль Моисея, но не утверждает, будто он действовал независимо от Бога.
- issue: Место чудес у моря
  choice: «на Красном море»
  alternative: «в Красном море»
  rationale: Предлог ἐν допускает локативное понимание. Русская формулировка естественно охватывает события у моря и в нём, не сужая смысл до одной стороны берега или исключительно толщи воды.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным строем. Подчёркнутое «Именно он» передаёт риторику речи Стефана; синтаксис остаётся доступным и сохраняет последовательность географических указаний оригинала.
