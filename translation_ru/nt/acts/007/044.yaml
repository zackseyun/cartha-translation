lexical_decisions:
- source_word: Ἡ σκηνὴ τοῦ μαρτυρίου
  choice: шатёр свидетельства
  rationale: «Шатёр» естественно передаёт основное значение σκηνή как переносного святилища, а сочетание «свидетельства» сохраняет библейский генитив τοῦ μαρτυρίου без излишнего истолкования.
- source_word: τοῖς πατράσιν ἡμῶν
  choice: у наших отцов
  rationale: Оборот передаёт дательный принадлежности/обладания и сохраняет буквальное «отцов», относящееся к праотцам Израиля.
- source_word: ἐν τῇ ἐρήμῳ
  choice: в пустыне
  rationale: Обычное и контекстуально точное обозначение пустыни, где странствовал Израиль.
- source_word: διετάξατο
  choice: по повелению
  rationale: Передаёт авторитетное распоряжение; перестройка предложения делает русскую фразу естественной и ясно связывает повеление с изготовлением шатра.
- source_word: ὁ λαλῶν τῷ Μωϋσῇ
  choice: Того, кто говорил Моисею
  rationale: Сохраняет не названного прямо говорящего и передаёт субстантивированное причастие, не добавляя «Бог» или «Господь».
- source_word: ποιῆσαι αὐτὴν
  choice: он должен был сделать его
  rationale: Явно передаёт содержание повеления; местоимение «его» согласовано с русским словом «шатёр».
- source_word: κατὰ τὸν τύπον
  choice: по образцу
  rationale: «Образец» естественно выражает показанный Моисею прототип устройства святилища.
- source_word: ὃν ἑωράκει
  choice: который видел
  rationale: Русское прошедшее время в контексте однозначно указывает на предшествующее видение; субъектом остаётся Моисей.
theological_decisions:
- issue: Кто говорил Моисею
  choice: Того, кто говорил Моисею
  alternative: Бога, говорившего Моисею / Господа, говорившего Моисею
  rationale: Греческий текст не называет говорящего существительным, поэтому перевод сохраняет подразумеваемый референт и не делает его более явным, чем оригинал.
- issue: Значение «шатра свидетельства»
  choice: Сохранено традиционное образное наименование без пояснения в основном тексте
  alternative: шатёр откровения / шатёр со скрижалями свидетельства
  rationale: τοῦ μαρτυρίου допускает связь с Божьим свидетельством и скрижалями завета, но сам стих не раскрывает эту связь; перевод не сужает значение.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. «Шатёр» понятнее обычному читателю, чем «скиния», при этом традиционный термин дан в сноске. Неестественная для русского калька «шатёр был у отцов» преобразована в «у наших отцов... был шатёр». Все маркеры сносок присутствуют в основном тексте.
