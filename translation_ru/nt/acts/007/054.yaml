  yaml_path: translation/nt/acts/007/054.yaml
  text: When they heard these things[a], they were cut to the heart and gnashed their teeth at him.
translation:
  language: ru
  text: Услышав это, они кипели от ярости и скрежетали зубами на него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούοντες
  choice: услышав
  rationale: Обстоятельственное причастие передаёт временной фон основных действий; деепричастие естественно и точно звучит по-русски.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Частица обозначает развитие повествования, которое в русском контексте не требует искусственного вводного «теперь» или обязательного противительного союза.
- source_word: ταῦτα
  choice: это
  rationale: Указывает на предшествующую речь Стефана; русское собирательное «это» естественнее буквального «эти вещи».
- source_word: διεπρίοντο
  choice: пришли в ярость
  rationale: В данном контексте глагол описывает крайнюю внутреннюю ожесточённость. Основной текст передаёт его идиоматический смысл, а примечание сохраняет яркий буквальный образ рассечения.
- source_word: ταῖς καρδίαις αὐτῶν
  choice: в глубине сердца
  rationale: Передаёт внутреннюю сферу переживания. Единственное число употреблено как естественное русское обобщение, без изменения смысла греческого множественного числа.
- source_word: ἔβρυχον τοὺς ὀδόντας
  choice: скрежетали зубами
  rationale: Устойчивое и выразительное русское соответствие жесту ярости и враждебности.
- source_word: ἐπ’ αὐτόν
  choice: на него
  rationale: Предлог обозначает направленность враждебного действия; сочетание «скрежетать на кого-либо зубами» естественно для русского библейского регистра.
theological_decisions:
- issue: Характер внутренней реакции слушателей
  choice: пришли в ярость в глубине сердца
  alternative: были пронзены в сердце
  rationale: Контекст и последующий скрежет зубами указывают на яростное внутреннее возмущение. Примечание сохраняет буквальный образ глагола и не скрывает возможную смысловую напряжённость выражения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Устранён не имеющий прямого лексического основания вводный эквивалент «теперь»; образность редкого греческого глагола сохранена в примечании.
