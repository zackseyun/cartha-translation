- from: Услышав это, они пришли в ярость в глубине сердца[a] и скрежетали на него зубами.
  to: Услышав это, они кипели от ярости и скрежетали зубами на него.
  rationale: Перевод основной строки сделан естественным для современного литературного русского и сохраняет контекстуально ясный смысл глагола διεπρίοντο — яростное внутреннее возмущение. В сноске сохранены буквальная образность глагола и греческая конструкция «в своих сердцах», не выдавая спорный буквальный образ за единственно возможный смысл.
