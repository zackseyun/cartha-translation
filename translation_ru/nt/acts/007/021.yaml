  yaml_path: translation/nt/acts/007/021.yaml
  text: But when he had been exposed[b][a], Pharaoh’s daughter took him up and raised him as her own son.
translation:
  language: ru
  text: Но когда его вынесли и оставили, дочь фараона подобрала его[a] и воспитала как своего сына[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «взяла его к себе». Греческий глагол может обозначать, что оставленного младенца подобрали.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «себе в сыновья» или «себе как сына».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτεθέντος
  choice: когда его оставили
  rationale: Аористное страдательное причастие ἐκτίθημι говорит о младенце, которого вынесли и оставили. «Оставили» естественно по-русски и не усиливает значение до намеренного «бросили» или «отказались от него».
- source_word: δὲ
  choice: но
  rationale: 'δέ обозначает переход с оттенком контраста: младенца оставили, но дочь фараона приняла его.'
- source_word: ἀνείλατο
  choice: подобрала его
  rationale: В данном контексте средняя форма ἀναιρέω означает взять оставленного младенца. «Подобрала» передаёт конкретное действие и не смешивает его с последующим принятием в качестве сына.
- source_word: ἡ θυγάτηρ Φαραώ
  choice: дочь фараона
  rationale: Естественная русская форма, точно передающая родительное отношение.
- source_word: ἀνεθρέψατο
  choice: воспитала
  rationale: ἀνατρέφω означает растить, вскармливать и воспитывать ребёнка; «воспитала» здесь звучит естественно и охватывает его взросление.
- source_word: ἑαυτῇ εἰς υἱόν
  choice: как своего сына
  rationale: Оборот обозначает положение или роль сына по отношению к самой дочери фараона. Формулировка естественна и сохраняет семейный смысл, не вводя специальной юридической терминологии усыновления.
