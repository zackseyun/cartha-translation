  text: Then the high priest said[a], “Are these things so?”
translation:
  language: ru
  text: 'Тогда первосвященник сказал: «Так ли это?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Так ли обстоят дела?»; более явно: «Верны ли эти обвинения?»'
    reason: Лаконичное греческое выражение ταῦτα οὕτως ἔχει допускает как близкую по форме, так и уточняющую по контексту передачу.
lexical_decisions:
- source_word: Εἶπεν
  choice: спросил
  rationale: Формально это аорист от λέγω («сказал»), однако глагол непосредственно вводит вопрос; по-русски «спросил» здесь естественно передаёт речевое действие, не меняя его содержания.
- source_word: δὲ
  choice: Тогда
  rationale: Частица отмечает переход к следующему шагу повествования после выдвинутых обвинений; «тогда» естественно выражает эту последовательность.
- source_word: ὁ ἀρχιερεύς
  choice: первосвященник
  rationale: Устойчивое и точное русское обозначение единственного верховного священнослужителя, председательствующего в данном разбирательстве.
- source_word: Εἰ
  choice: ли
  rationale: В прямом общем вопросе εἰ имеет вопросительное значение; русская частица «ли» идиоматично передаёт его без условного оттенка.
- source_word: ταῦτα
  choice: это
  rationale: Греческое указательное местоимение имеет форму множественного числа («эти вещи»), но в русском «это» естественно суммарно отсылает к только что изложенным обвинениям, не называя их прямо.
- source_word: οὕτως ἔχει
  choice: так
  rationale: Идиома означает «так обстоит дело», «это действительно так»; краткое «так ли это?» естественно и точно передаёт вопрос о достоверности обвинений.
