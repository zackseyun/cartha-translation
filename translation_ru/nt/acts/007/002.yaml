  text: ὁ δὲ ἔφη· Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατε· Ὁ θεὸς τῆς δόξης ὤφθη τῷ πατρὶ ἡμῶν Ἀβραὰμ ὄντι ἐν τῇ Μεσοποταμίᾳ πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/002.yaml
  text: 'And he said[a], “Brothers and fathers, listen: the God of glory appeared to our father Abraham when he was in Mesopotamia[b], before he lived in Haran.”'
translation:
  language: ru
  text: 'Он же сказал: «Братья и отцы, послушайте! Бог славы явился нашему отцу Аврааму, когда тот был в Месопотамии, прежде чем Авраам поселился в Харране».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἔφη
  choice: Он же сказал
  rationale: Частица δέ слабо продолжает повествование и здесь естественно передаётся русским «же», без усиленного противопоставления.
- source_word: Ἄνδρες ἀδελφοὶ καὶ πατέρες
  choice: Братья и отцы
  rationale: Формула представляет собой почтительное обращение к мужчинам; отдельное «мужи» в современном русском звучало бы избыточно и архаично, тогда как мужской состав адресатов сохраняется словами «братья и отцы».
- source_word: ἀκούσατε
  choice: послушайте
  rationale: Прямой призыв обратить внимание, естественный для современной русской речи.
- source_word: Ὁ θεὸς τῆς δόξης
  choice: Бог славы
  rationale: Сохраняет родительную конструкцию греческого текста и её возможный ветхозаветный отзвук, не сводя выражение к прилагательному «славный».
- source_word: ὤφθη
  choice: явился
  rationale: Обычное значение пассивной формы ὁράω в контексте богоявления; оно точнее и менее толковательно, чем «открыл Себя».
- source_word: τῷ πατρὶ ἡμῶν Ἀβραὰμ
  choice: нашему отцу Аврааму
  rationale: Естественный русский порядок слов сохраняет выраженную Стефаном общность с Авраамом.
- source_word: ὄντι ἐν τῇ Μεσοποταμίᾳ
  choice: когда тот был в Месопотамии
  rationale: Причастный оборот имеет временно-обстоятельственное значение; местоимение «тот» ясно относит его к Аврааму и устраняет возможную двусмысленность русского «он».
- source_word: πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν
  choice: прежде чем поселился в Харране
  rationale: κατοικέω допускает значения «жить» и «поселиться»; в данном контексте «поселился» естественно передаёт переход к проживанию в Харране.
theological_decisions:
- issue: Мужская форма обращения к аудитории
  choice: Братья и отцы
  alternative: Мужи, братья и отцы
  rationale: Перевод не нейтрализует мужской род обращения, но избегает буквального и тяжеловесного дублирования формулы посредством отдельного слова «мужи».
- issue: Передача божественного титула θεὸς τῆς δόξης
  choice: Бог славы
  alternative: славный Бог
  rationale: Родительная конструкция сохраняет богословскую и возможную межтекстовую насыщенность исходной формулы, не разрешая её в пользу простого качественного определения.
- issue: Значение κατοικῆσαι применительно к Харрану
  choice: поселился
  alternative: жил
  rationale: Оба значения лексически допустимы; «поселился» лучше выражает начало проживания, но не добавляет идеи окончательного или постоянного обустройства.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной защитительной речи. Синтаксис ясен обычному читателю; сохранено библейски значимое выражение «Бог славы», при этом избегнуты необязательные архаизмы вроде «мужи» и «внемлите».
