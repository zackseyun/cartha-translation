  text: И патриархи, позавидовав Иосифу, продали его в Египет, и Бог был с ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατριάρχαι
  choice: патриархи
  rationale: В контексте речи Стефана это сыновья Иакова, родоначальники племён Израиля. «Патриархи» — точный, устоявшийся и понятный русский эквивалент.
- source_word: ζηλώσαντες
  choice: из зависти
  rationale: Причастие указывает на мотив продажи. Оборот «из зависти» естественно передаёт причинный оттенок и отрицательное значение ζηλόω в данном контексте.
- source_word: ἀπέδοντο
  choice: продали
  rationale: С учётом повествования об Иосифе глагол означает именно продажу, а не более общее «передали».
- source_word: εἰς Αἴγυπτον
  choice: в Египет
  rationale: Русское «продали в Египет» естественно выражает направленность εἰς и подразумеваемое перемещение Иосифа туда.
- source_word: ἦν ὁ θεὸς μετ’ αὐτοῦ
  choice: Бог был с ним
  rationale: Простая формулировка точно сохраняет утверждение о Божьем присутствии рядом с Иосифом; местоимение имеет ясный антецедент.
theological_decisions:
- issue: Присутствие Бога при страдании Иосифа
  choice: но Бог был с ним
  alternative: и Бог был с ним
  rationale: 'Греческое καί формально соединяет части предложения, но в контексте возникает явное противопоставление: Иосиф был продан, однако Бог оставался с ним. Русское «но» естественно передаёт этот контекстуальный смысл, не добавляя утверждений о провидении сверх текста.'
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, достойная и доступная. Термин «патриархи» сохранён как исторически и богословски точный, а синтаксис сделан естественным для русского повествования.
