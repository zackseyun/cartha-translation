  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: «патриархи» указывает на сыновей Иакова, ζηλώσαντες — на зависть как мотив, ἀπέδοντο — на продажу Иосифа в Египет, а заключительная фраза утверждает Божье присутствие с ним. Однако оба греческих καί переданы как «а» и особенно «но». «Но» вводит противопоставление, которое уместно по контексту, но не выражено союзом оригинала; для оптимально-эквивалентного перевода его лучше не усиливать.'
