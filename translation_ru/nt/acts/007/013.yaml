  text: καὶ ἐν τῷ δευτέρῳ ⸀ἀνεγνωρίσθη Ἰωσὴφ τοῖς ἀδελφοῖς αὐτοῦ, καὶ φανερὸν ἐγένετο τῷ Φαραὼ τὸ ⸀γένος Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/013.yaml
  text: And on the second visit Joseph was recognized by his brothers[b][a], and Joseph’s family became known to Pharaoh.
translation:
  language: ru
  text: Во второй раз Иосиф был узнан своими братьями[a], и фараону стало известно о семье Иосифа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по смыслу повествования: «открылся своим братьям». Греческий глагол имеет форму страдательного залога и буквально может означать «был узнан».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «о роде Иосифа»; «о его родных».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ δευτέρῳ
  choice: во второй раз
  rationale: Субстантивированное порядковое числительное обозначает второй случай или второе посещение. Русское «во второй раз» естественно передаёт смысл, не добавляя отсутствующего в греческом тексте слова «приход».
- source_word: ἀνεγνωρίσθη
  choice: был узнан
  rationale: Сохранён пассивный залог греческого глагола и его возможный смысл «был распознан». Контекст рассказа об Иосифе допускает понимание «открылся», поэтому оно вынесено в сноску, а неоднозначность основного текста не устранена.
- source_word: ἀδελφοῖς
  choice: своими братьями
  rationale: Речь идёт именно о братьях Иосифа; возвратное притяжательное местоимение естественно передаёт αὐτοῦ по-русски.
- source_word: φανερὸν ἐγένετο
  choice: стало известно
  rationale: Оборот означает переход к известности или явности. «Стало известно» кратко и естественно сочетается с дательным «фараону».
- source_word: γένος
  choice: семье
  rationale: В данном контексте слово обозначает родных или семейный круг Иосифа. «Семья» понятно современному читателю и не вызывает современных ассоциаций со словом «раса».
- source_word: τῷ Φαραώ
  choice: фараону
  rationale: Дательный падеж обозначает лицо, которому стали известны сведения о семье Иосифа; русский дательный сохраняет эту связь.
theological_decisions:
- issue: Способ, которым братья узнали Иосифа
  choice: Сохранить формально пассивное «был узнан»
  alternative: «открылся своим братьям»
  rationale: Греческая форма пассивна, тогда как повествовательный контекст Бытия указывает на раскрытие Иосифом своей личности. Основной текст сохраняет грамматическую форму и напряжение между формой и контекстом, а альтернативное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; изложение краткое и достойное. Синтаксис близок к греческому, но естественен для обычного читателя. Пассивная форма первого сказуемого намеренно сохранена, а значение γένος передано общеупотребительным словом «семья».
