id: ACT.7.42
reference: Acts 7:42
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἔστρεψεν δὲ ὁ θεὸς καὶ παρέδωκεν αὐτοὺς λατρεύειν τῇ στρατιᾷ τοῦ οὐρανοῦ, καθὼς γέγραπται ἐν βίβλῳ τῶν προφητῶν· Μὴ σφάγια καὶ θυσίας προσηνέγκατέ μοι ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ, οἶκος Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/042.yaml
  text: 'But God turned away and gave them over to serve the host of heaven[a], just as it is written in the book of the prophets: ‘Did you offer to me slain offerings and sacrifices for forty years in the wilderness[d][c][b], O house of Israel?’'
translation:
  language: ru
  text: 'Но Бог отвернулся и предал их служению небесному воинству[a], как написано в книге пророков[b]: «Разве вы приносили Мне закланные жертвы и жертвоприношения в течение сорока лет в пустыне, дом Израиля?[c]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклоняться небесному воинству». Греческий глагол может обозначать религиозное служение или поклонение. «Небесное воинство» — библейское выражение о небесных светилах и, шире, о связанных с ними небесных силах, которым поклонялись как идолам.'
    reason: Лексическая альтернатива и культурно-историческое пояснение.
  - marker: b
    text: 'Или: «в свитке пророков».'
    reason: 'Лексическая альтернатива: βίβλος может означать книгу или свиток.'
  - marker: c
    text: Цитата из Амоса 5:25.
    reason: Перекрёстная ссылка.
lexical_decisions:
- source_word: ἔστρεψεν
  choice: отвернулся
  rationale: В сочетании с последующим «предал их» глагол обозначает не просто поворот, а Божье отстранение как суд; дополнение «от них» подразумевается русским глаголом и контекстом.
- source_word: παρέδωκεν
  choice: предал их
  rationale: Сохраняет суровый судебный оттенок передачи во власть избранного ими идолопоклонства, не утверждая, будто Бог был виновником их греха.
- source_word: λατρεύειν
  choice: служить
  rationale: Передаёт культовое служение и сохраняет лексическую широту греческого глагола; значение поклонения указано в сноске.
- source_word: τῇ στρατιᾷ τοῦ οὐρανοῦ
  choice: небесному воинству
  rationale: Это узнаваемое библейское выражение, которое не сужает референт исключительно до звёзд или ангелов.
- source_word: ἐν βίβλῳ τῶν προφητῶν
  choice: в книге пророков
  rationale: Естественно передаёт название собрания пророческих текстов; исторически возможное «свитке» отмечено в сноске.
- source_word: Μὴ
  choice: Разве
  rationale: Русская вопросительная частица передаёт риторический вопрос, предполагающий отрицательный ответ.
- source_word: σφάγια καὶ θυσίας
  choice: закланные жертвы и жертвоприношения
  rationale: Сохраняет два близких, но отдельных культовых термина, причём первый явно указывает на заклание.
- source_word: προσηνέγκατέ μοι
  choice: приносили Мне
  rationale: В контексте жертвоприношения «приносить» является естественным русским соответствием προσφέρω и прямо сохраняет дательное μοι.
- source_word: ἐν τῇ ἐρήμῳ
  choice: в пустыне
  rationale: Традиционное и ясное обозначение места странствий Израиля после исхода.
theological_decisions:
- issue: Действие Бога в суде
  choice: «Бог отвернулся и предал их» передаёт судебное оставление людей избранному ими идолопоклонству.
  alternative: Бог лишь пассивно допустил это либо непосредственно принудил их к идолопоклонству.
  rationale: Два последовательных глагола выражают реальный Божий суд в ответ на мятеж, но текст не называет Бога источником самого греха.
- issue: Значение «небесного воинства»
  choice: Сохранено широкое библейское выражение, относящееся к небесным светилам и связанным с ними небесным силам как предметам ложного поклонения.
  alternative: Только звёзды или только ангелы.
  rationale: Контекст астрального идолопоклонства ясен, однако греческое выражение не требует искусственно сужать референт.
- issue: Риторический вопрос из Амоса
  choice: Форма с «разве» сохраняет ожидаемый отрицательный ответ.
  alternative: Простое нейтральное «приносили ли».
  rationale: Частица μή указывает, что вопрос предполагает ответ «нет», но саму напряжённость пророческого вопроса следует сохранить, а не заменять пояснительным утверждением.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Сохранены пророческая риторика, обращение «дом Израиля» и намеренное сближение двух жертвенных терминов; архаизмы и конфессионально окрашенные формулировки не вводились.
