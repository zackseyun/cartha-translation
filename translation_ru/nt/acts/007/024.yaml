  yaml_path: translation/nt/acts/007/024.yaml
  text: And when he saw someone being wronged[b][a], he defended him and brought justice for the one being oppressed by striking down the Egyptian.
translation:
  language: ru
  text: Увидев человека, с которым поступали несправедливо, он вступился за него и отомстил за угнетённого[a], поразив египтянина[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершил возмездие за угнетённого»; также возможно: «восстановил справедливость для угнетённого». Греческое выражение ἐποίησεν ἐκδίκησιν может означать как возмездие, так и защиту или восстановление справедливости.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ударив египтянина». Глагол πατάσσω означает «ударить, поразить»; сам по себе он не уточняет смертельный исход, хотя тот известен из контекста повествования.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδών
  choice: увидев
  rationale: Аористное причастие естественно передаёт предшествующее обстоятельство и сохраняет компактность греческой конструкции.
- source_word: τινα ἀδικούμενον
  choice: что с одним человеком поступают несправедливо
  rationale: Передаёт неопределённость τινα и нравственно-правовой оттенок ἀδικέω, не уточняя личность пострадавшего сверх текста.
- source_word: ἠμύνατο
  choice: вступился за него
  rationale: Средняя форма означает выступить в защиту или прийти на помощь; русское выражение естественно в данном контексте.
- source_word: ἐποίησεν ἐκδίκησιν
  choice: отомстил за
  rationale: Устойчивое сочетание буквально выражает совершение возмездия или отмщения; формулировка сохраняет более резкий оттенок оригинала, не превращая рассказ в нравственное одобрение поступка.
- source_word: τῷ καταπονουμένῳ
  choice: за угнетённого
  rationale: Субстантивированное страдательное причастие обозначает человека, подвергаемого тяжёлому притеснению; дательный связан с действием в его пользу.
- source_word: πατάξας
  choice: поразив
  rationale: πατάσσω означает ударить или поразить; выбранный вариант сохраняет лексическую широту, тогда как смертельный исход известен из контекста.
- source_word: τὸν Αἰγύπτιον
  choice: египтянина
  rationale: Естественная русская передача субстантивированного этнонима.
theological_decisions:
- issue: Характер ἐκδίκησις в поступке Моисея
  choice: отомстил за угнетённого
  alternative: добился справедливости для угнетённого
  rationale: ἐκδίκησις допускает значения возмездия, отмщения и восстановления справедливости. Более прямое «отомстил» сохраняет напряжённость повествования и не представляет поступок Моисея нейтральным судебным актом; повествовательное описание само по себе не означает богословского одобрения личной мести.
translation_notes:
  register: Современный литературный русский язык; фраза звучит достойно и понятно, при этом сохраняет резкий оттенок греческого выражения и не сглаживает нравственную напряжённость эпизода.
