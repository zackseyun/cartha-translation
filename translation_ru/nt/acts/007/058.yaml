  text: καὶ ἐκβαλόντες ἔξω τῆς πόλεως ἐλιθοβόλουν. καὶ οἱ μάρτυρες ἀπέθεντο τὰ ἱμάτια ⸀αὐτῶν παρὰ τοὺς πόδας νεανίου καλουμένου Σαύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/058.yaml
  text: And after they had driven him out of the city[a], they were stoning him. And the witnesses laid their outer garments at the feet of a young man called Saul.
translation:
  language: ru
  text: Выгнав его из города, они побивали его камнями. И свидетели положили свои верхние одежды[a] у ног молодого человека по имени Савл.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свои одежды»; греческое слово обозначает одежду вообще, нередко верхнюю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες ἔξω τῆς πόλεως
  choice: Выгнав его из города
  rationale: Аористное причастие обозначает действие, предшествующее основному; «выгнав» естественно передаёт и последовательность, и принудительное удаление за пределы города.
- source_word: ἐλιθοβόλουν
  choice: побивали его камнями
  rationale: Несовершенный вид греческого глагола представляет побивание камнями как продолжавшееся действие; русская форма несовершенного вида сохраняет этот аспект.
- source_word: οἱ μάρτυρες
  choice: Свидетели
  rationale: В данном судебном контексте речь идёт о свидетелях, а не о «мучениках» в позднейшем христианском смысле.
- source_word: ἀπέθεντο τὰ ἱμάτια αὐτῶν
  choice: положили свою верхнюю одежду
  rationale: Глагол передаёт откладывание или снятие и складывание одежды; ἱμάτια обозначает одежду, часто верхнюю. Единственное число «одежду» естественно по-русски употребляется собирательно при множественном субъекте.
- source_word: παρὰ τοὺς πόδας
  choice: у ног
  rationale: Это естественный русский эквивалент расположения предметов возле чьих-либо ног.
- source_word: νεανίου καλουμένου Σαύλου
  choice: молодого человека по имени Савл
  rationale: Передаёт возрастное обозначение νεανίας и идиоматично выражает значение καλουμένου без архаизации.
theological_decisions:
- issue: Значение μάρτυρες в контексте казни
  choice: «Свидетели» в юридическом смысле
  alternative: «Мученики»
  rationale: Непосредственный контекст говорит о свидетелях обвинения, участвующих в побивании камнями; значение «мученики» внесло бы более поздний церковный смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Формулировка «побивали его камнями» сохраняет юридико-повествовательный характер сцены и длительный аспект действия; примечание поставлено непосредственно после выражения, к которому относится.
