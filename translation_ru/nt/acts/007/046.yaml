  text: ὃς εὗρεν χάριν ἐνώπιον τοῦ θεοῦ καὶ ᾐτήσατο εὑρεῖν σκήνωμα τῷ ⸀θεῷ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/046.yaml
  text: who found favor before God and asked to find a dwelling place for the God of Jacob[a].
translation:
  language: ru
  text: Он обрёл благоволение перед Богом и попросил о возможности найти жилище для Бога Иакова.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скинию для Бога Иакова».'
    reason: 'Лексическая альтернатива: σκήνωμα может обозначать скинию, хотя также имеет более широкое значение «жилище».'
lexical_decisions:
- source_word: εὗρεν χάριν
  choice: обрёл благоволение
  rationale: Греческая идиома означает снискать благосклонность; «обрёл благоволение» естественно и сохраняет её личностный смысл.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: перед Богом
  rationale: Предлог с родительным падежом передаёт нахождение перед кем-либо или в чьих-либо глазах; краткое «перед Богом» соответствует греческой конструкции.
- source_word: ᾐτήσατο
  choice: попросил
  rationale: Средняя форма обозначает обращение с просьбой; «попросил» ясно и не придаёт выражению излишней официальности.
- source_word: εὑρεῖν
  choice: найти
  rationale: Сохранено прямое значение инфинитива. По контексту речь может идти о том, чтобы обрести или устроить место, но перевод не устраняет особенность греческой формулировки.
- source_word: σκήνωμα
  choice: жилище
  rationale: Слово обозначает место обитания и здесь не обязательно является техническим названием скинии. «Жилище» понятно современному читателю и не предрешает, о каком именно сооружении идёт речь.
- source_word: τῷ θεῷ Ἰακώβ
  choice: для Бога Иакова
  rationale: Дательный падеж естественно передан оборотом с «для», а родительный Ἰακώβ — традиционной библейской формулой «Бог Иакова».
theological_decisions:
- issue: Характер места, которое Давид просил найти для Бога
  choice: жилище для Бога Иакова
  alternative: скинию для Бога Иакова
  rationale: 'σκήνωμα шире технических обозначений скинии или храма. Такой перевод сохраняет напряжение повествования: Давид желает обрести место для Бога, а в следующем стихе дом строит Соломон.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Обрёл благоволение» сохраняет устойчивый библейский оборот, а «жилище» остаётся доступным и не становится преждевременно техническим термином.
