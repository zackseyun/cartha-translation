base_translation:
  language: en
  yaml_path: translation/nt/acts/007/019.yaml
  text: This man[a], having dealt shrewdly with our people, mistreated our fathers[c][b], causing their infants to be exposed so that they would not be kept alive.
translation:
  language: ru
  text: Он[a] коварно обошёлся с нашим народом и подверг наших предков жестокому обращению, заставляя их оставлять своих младенцев[b] на произвол судьбы, чтобы те не остались в живых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Этот». Речь идёт о царе, упомянутом в предыдущем стихе. Возможный перевод продолжения: «обошёлся с нашим народом с хитростью».'
    reason: lexical_alternative
  - marker: b
    text: То есть оставлять младенцев без защиты и помощи, обрекая их на смерть.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: Он
  rationale: Русское местоимение естественно отсылает к упомянутому выше царю; указательная сила греческого слова ясна из непосредственного контекста.
- source_word: κατασοφισάμενος
  choice: поступил ... коварно
  rationale: Передаёт отрицательную идею хитрого, злонамеренного обращения; примечание сохраняет близкую альтернативу «обошёлся ... с хитростью».
- source_word: τὸ γένος ἡμῶν
  choice: с нашим народом
  rationale: В данном контексте γένος означает народ Израиля; «народ» естественно и не вызывает современных ассоциаций слова «раса».
- source_word: ἐκάκωσεν
  choice: стал угнетать
  rationale: Глагол обозначает причинение зла и жестокое обращение; в контексте политики фараона «угнетать» передаёт смысл ясно, не перегружая фразу.
- source_word: τοὺς πατέρας
  choice: наших предков
  rationale: Речь идёт о предшествующих поколениях Израиля. Притяжательное «наших» определяется контекстом и естественно по-русски.
- source_word: τοῦ ποιεῖν τὰ βρέφη ἔκθετα αὐτῶν
  choice: заставляя их бросать своих младенцев
  rationale: Передаёт причинно-средственное отношение инфинитивной конструкции и смысл ἔκθετα — оставление младенцев на произвол судьбы. Контекст исходного повеления фараона поддерживает оттенок принуждения.
- source_word: εἰς τὸ μὴ ζῳογονεῖσθαι
  choice: чтобы те не остались в живых
  rationale: Сохраняет целевое значение конструкции и смысл пассивного ζῳογονεῖσθαι — быть сохранёнными в живых; «те» однозначно относится к младенцам.
theological_decisions:
- issue: Цель или результат в εἰς τὸ μή с инфинитивом
  choice: чтобы те не остались в живых
  alternative: так что они не могли остаться в живых
  rationale: Греческая конструкция допускает оттенки цели и результата; контекст политики фараона благоприятствует цели, но перевод не уточняет способ гибели и не добавляет богословских выводов.
translation_notes:
  register: Современный литературный русский язык, ясный для широкого читателя. Формулировка сохраняет достоинство повествования; исторический смысл оставления младенцев разъяснён в примечании. Термин «предки» выбран вместо менее естественного здесь «отцы».
