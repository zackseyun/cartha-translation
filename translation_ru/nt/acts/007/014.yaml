  text: Then Joseph sent and summoned Jacob his father and all his relatives[a], seventy-five persons in all.
translation:
  language: ru
  text: Тогда Иосиф послал за Иаковом, своим отцом, и всей своей роднёй и велел им прийти — всего семьдесят пять человек.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых местах Ветхого Завета общее число указано как «семьдесят» (например, в еврейском тексте Бытия 46:27 и Исхода 1:5); здесь, в Деяниях, сказано «семьдесят пять».
    reason: cross_reference
lexical_decisions:
- source_word: ἀποστείλας
  choice: послал
  rationale: Аористное причастие обозначает действие, предшествующее основному глаголу. В сочетании «послал за» по-русски естественно передаётся отправка с целью пригласить кого-либо, без добавления отсутствующего в греческом тексте прямого дополнения вроде «посланцев».
- source_word: δὲ
  choice: тогда
  rationale: Союз отмечает переход к следующему событию повествования; «тогда» естественно передаёт эту последовательность.
- source_word: μετεκαλέσατο
  choice: послал за
  rationale: Глагол означает позвать или послать за кем-либо, чтобы тот пришёл. Русское «послал за» идиоматично объединяет выраженные греческой конструкцией отправку и приглашение прибыть, избегая тяжеловесного «послал и вызвал».
- source_word: Ἰακὼβ τὸν πατέρα αὐτοῦ
  choice: своим отцом Иаковом
  rationale: Естественная русская аппозиция сохраняет прямое указание, что Иаков — отец Иосифа.
- source_word: πᾶσαν τὴν συγγένειαν
  choice: всей своей роднёй
  rationale: συγγένεια обозначает совокупность родственников. «Родня» — понятное современное собирательное слово; оно здесь точнее широкого «семья» и не имеет архаичного оттенка.
- source_word: ἐν ψυχαῖς
  choice: всего ... человек
  rationale: Буквально «в душах» — счётный оборот со значением числа людей. Русское «всего ... человек» естественно передаёт смысл, не привнося отдельного антропологического утверждения о душе.
- source_word: ἑβδομήκοντα πέντε
  choice: семьдесят пять
  rationale: Прямая передача числительного греческого текста.
theological_decisions:
- issue: Численность рода Иакова в сопоставлении с ветхозаветными текстами
  choice: семьдесят пять человек
  alternative: семьдесят человек
  rationale: В греческом тексте Деяний прямо указано число семьдесят пять. Оно сохранено без гармонизации с еврейским текстом Бытия 46:27 и Исхода 1:5, где указано семьдесят; расхождение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Оборот «послал за» естественно передаёт греческую конструкцию без ненужной буквальности; тире выделяет итоговое число.
