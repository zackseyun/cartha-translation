  text: ἦλθεν δὲ λιμὸς ἐφ’ ὅλην τὴν ⸀Αἴγυπτον καὶ Χανάαν καὶ θλῖψις μεγάλη, καὶ οὐχ ηὕρισκον χορτάσματα οἱ πατέρες ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/011.yaml
  text: A famine came over all Egypt and Canaan[a], and great distress, and our fathers could not find food.
translation:
  language: ru
  text: По всему Египту и Ханаану наступил голод и пришло великое бедствие, и наши отцы[a] не могли найти пропитания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наши предки». В греческом тексте буквально: «наши отцы» — речь идёт о праотцах Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν δὲ λιμὸς
  choice: наступил голод
  rationale: «Наступил голод» естественно передаёт событийное употребление ἔρχομαι с λιμός. Частица δέ здесь служит развитию повествования и не требует отдельного русского слова.
- source_word: ἐφ’ ὅλην τὴν Αἴγυπτον καὶ Χανάαν
  choice: по всему Египту и Ханаану
  rationale: Предлог ἐπί с винительным обозначает распространение бедствия на всю названную область; формулировка сохраняет географический охват.
- source_word: θλῖψις μεγάλη
  choice: великое бедствие
  rationale: В данном историческом контексте θλῖψις обозначает тяжёлое бедствие, вызванное голодом, без специального эсхатологического оттенка.
- source_word: οὐχ ηὕρισκον
  choice: не могли найти
  rationale: Такая передача выражает продолжавшуюся практическую невозможность, заложенную в имперфекте.
- source_word: χορτάσματα
  choice: пропитания
  rationale: Слово обозначает пищу или съестные припасы; «пропитание» естественно в контексте голода и не сужает значение до зерна либо корма.
- source_word: οἱ πατέρες ἡμῶν
  choice: наши отцы
  rationale: Сохранено буквально выраженное мужское родовое обозначение праотцов Израиля; более нейтральная альтернатива дана в сноске.
theological_decisions:
- issue: Гендерно маркированное обозначение предков Израиля
  choice: наши отцы
  alternative: наши предки
  rationale: Греческий текст прямо говорит «наши отцы» и отсылает к мужским праотцам Израиля в истории спасения; перевод сохраняет эту форму, не превращая её в конфессиональное толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Повтор глагольных сказуемых («наступил… пришло») позволяет естественно передать греческое присоединение θλῖψις μεγάλη, не делая великое бедствие ни простым синонимом голода, ни явно его следствием.
