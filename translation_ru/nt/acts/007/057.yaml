- source_word: κράξαντες
  choice: громко закричали
  rationale: Причастие аориста передаёт предшествующее или сопутствующее основному действию громкое восклицание; личная форма естественна в современном русском повествовании, а наречие сохраняет смысл φωνῇ μεγάλῃ.
- source_word: δὲ
  choice: Но
