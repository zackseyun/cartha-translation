- source_word: φωνῇ μεγάλῃ
  choice: громко
  rationale: Наречное соответствие точно и естественно передаёт греческое выражение «громким голосом», не меняя степени интенсивности.
- source_word: συνέσχον τὰ ὦτα αὐτῶν
  choice: заткнули себе уши
  rationale: Русское устойчивое выражение ясно передаёт намеренное прекращение слышания; возвратное «себе» естественно обозначает принадлежность ушей субъекту.
- source_word: ὥρμησαν
  choice: бросились
  rationale: Глагол передаёт внезапное и стремительное направленное движение без добавления не выраженных прямо подробностей насилия.
- source_word: ὁμοθυμαδὸν
  choice: все как один
  rationale: Выражение передаёт не просто одновременность, а согласованность и единство действия толпы; возможное более формальное соответствие отмечено в сноске.
- source_word: ἐπ’ αὐτόν
  choice: на него
  rationale: При глаголе стремительного движения предлог ἐπί с винительным обозначает направленность на человека; по-русски «бросились на него» естественно выражает враждебное движение.
