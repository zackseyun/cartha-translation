  text: ἀκούσας δὲ Ἰακὼβ ὄντα ⸂σιτία εἰς Αἴγυπτον⸃ ἐξαπέστειλεν τοὺς πατέρας ἡμῶν πρῶτον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/012.yaml
  text: But when Jacob heard that there was grain in Egypt[a], he sent out our fathers the first time.
translation:
  language: ru
  text: Но Иаков, услышав, что в Египте есть зерно[a], в первый раз отправил туда наших отцов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «съестные припасы». Греческое слово σιτία может обозначать припасы вообще, хотя в данном контексте, вероятнее всего, имеется в виду зерно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: услышав
  rationale: Аористное причастие передаёт обстоятельство времени, предшествующее основному действию; деепричастие естественно сохраняет последовательность событий.
- source_word: δὲ
  choice: Но
  rationale: Частица обозначает мягкий переход в повествовании; «но» сохраняет движение мысли, не создавая чрезмерно резкого противопоставления.
- source_word: ὄντα σιτία εἰς Αἴγυπτον
  choice: что в Египте есть зерно
  rationale: Конструкция с винительным падежом и причастием после ἀκούω естественно передаётся косвенной речью. Оборот «в Египте есть» соответствует смыслу контекста и нормам современного русского языка.
- source_word: σιτία
  choice: зерно
  rationale: Слово может обозначать зерно или, шире, съестные припасы; в повествовании о голоде и поездках сыновей Иакова наиболее вероятно значение «зерно».
- source_word: ἐξαπέστειλεν
  choice: отправил туда
  rationale: Глагол означает послать или отправить; «туда» естественно выражает направление в Египет, не перегружая русский текст.
- source_word: τοὺς πατέρας ἡμῶν
  choice: наших отцов
  rationale: Буквальная родственная формулировка сохраняет речь Стефана изнутри истории Израиля и здесь конкретно указывает на сыновей Иакова.
- source_word: πρῶτον
  choice: в первый раз
  rationale: Форма указывает на первую из нескольких поездок и подготавливает упоминание о втором посещении далее.
theological_decisions:
- issue: Передача τοὺς πατέρας ἡμῶν
  choice: наших отцов
  alternative: наших предков; патриархов
  rationale: Выражение сохраняет мужской род и семейно-исторический язык оригинала. В данном контексте речь идёт конкретно о праотцах-мужчинах, поэтому нейтральное «предки» менее точно, а «патриархи» добавляет толкование.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок слов выбран ради ясности: обстоятельство «в первый раз» относится к отправлению, а «туда» недвусмысленно указывает на Египет.'
