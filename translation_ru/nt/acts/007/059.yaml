  yaml_path: translation/nt/acts/007/059.yaml
  text: And they were stoning Stephen as he called out and said[a], “Lord Jesus, receive my spirit.”
translation:
  language: ru
  text: 'И они побивали Стефана камнями, а Стефан взывал[a]: «Господи Иисус, прими мой дух».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «призывая [Его] и говоря». Греческое причастие может более явно обозначать молитвенное призывание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθοβόλουν
  choice: побивали камнями
  rationale: Имперфект передаёт продолжающееся действие; форма «побивали» сохраняет его длительность и звучит естественно в повествовании.
- source_word: ἐπικαλούμενον
  choice: он взывал
  rationale: Причастие обозначает обращение с призывом и в данном контексте — молитвенное обращение к Иисусу. «Взывал» сохраняет эту смысловую насыщенность и достойный регистр.
- source_word: λέγοντα
  choice: и говорил
  rationale: Сохраняет координацию двух греческих причастий и вводит прямую речь без превращения их в полностью тождественные действия.
- source_word: Κύριε Ἰησοῦ
  choice: Господь Иисус
  rationale: Русская форма звательного обращения совпадает с именительным падежом; «Господь» сохраняет почтительность и христологическую значимость κύριος.
- source_word: δέξαι
  choice: прими
  rationale: Повелительная форма в молитвенном контексте естественно передаётся глаголом «прими», выражающим вверение себя адресату.
- source_word: τὸ πνεῦμά μου
  choice: мой дух
  rationale: Прямой и традиционно понятный эквивалент, уместный для духа Стефана, вверяемого Иисусу перед смертью.
theological_decisions:
- issue: Следует ли ясно передать молитвенное обращение Стефана к воскресшему Иисусу
  choice: '«он взывал…: „Господь Иисус, прими мой дух!“»'
  alternative: «он громко говорил» или «он призывал Бога и говорил»
  rationale: Греческий текст прямо называет Иисуса адресатом просьбы, а ἐπικαλούμενον допускает и подразумевает призывание в молитве. Перевод не скрывает этого, но и не добавляет отсутствующего в тексте объекта при причастии.
translation_notes:
  register: Современный литературный русский язык с торжественностью, соответствующей сцене мученической смерти. Длительность действия сохранена формой «побивали», а молитвенный характер обращения — глаголом «взывал».
