  text: τίνα τῶν προφητῶν οὐκ ἐδίωξαν οἱ πατέρες ὑμῶν; καὶ ἀπέκτειναν τοὺς προκαταγγείλαντας περὶ τῆς ἐλεύσεως τοῦ δικαίου οὗ νῦν ὑμεῖς προδόται καὶ φονεῖς ⸀ἐγένεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/052.yaml
  text: Which of the prophets did your fathers not persecute? And they killed those who announced beforehand the coming of the Righteous One[a], of whom you have now become betrayers and murderers[c][b],
translation:
  language: ru
  text: Кого из пророков не преследовали ваши отцы?[a] И они убили тех, кто заранее возвестил о пришествии Праведника,[b] предателями[c] и убийцами которого теперь стали вы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваши предки». Греческое слово буквально означает «отцы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Справедливого».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «изменниками».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα τῶν προφητῶν
  choice: Кого из пророков
  rationale: 'Частичная конструкция с родительным множественного числа естественно передаётся по-русски как «кого из пророков» и сохраняет риторический смысл: гонениям подвергались все пророки.'
- source_word: ἐδίωξαν
  choice: не преследовали
  rationale: В данном контексте глагол обозначает враждебное преследование пророков; этот вариант точен и естественен в современном русском языке.
- source_word: οἱ πατέρες ὑμῶν
  choice: ваши отцы
  rationale: Формально близкая передача сохраняет обвинительную преемственность между слушателями Стефана и прежними поколениями Израиля; возможный смысл «предки» вынесен в примечание.
- source_word: ἀπέκτειναν
  choice: убили
  rationale: Прямой современный эквивалент без архаизации и без ослабления обвинения.
- source_word: τοὺς προκαταγγείλαντας
  choice: тех, кто заранее возвестил
  rationale: Передаёт как значение провозглашения, так и временной компонент приставки προ-.
- source_word: περὶ τῆς ἐλεύσεως
  choice: о пришествии
  rationale: «Пришествие» естественно сочетается с предварительным пророческим возвещением и точно передаёт ἔλευσις, не уточняя характер прихода сверх текста.
- source_word: τοῦ δικαίου
  choice: Праведника
  rationale: Субстантивированное определение с артиклем имеет здесь титульную силу и относится к Иисусу; прописная буква отмечает это употребление.
- source_word: οὗ
  choice: которого
  rationale: Родительное относительное местоимение прямо связывает Праведника со словами «предателями и убийцами».
- source_word: νῦν
  choice: теперь
  rationale: Сохраняет временной контраст между поступками отцов и нынешней виной слушателей.
- source_word: προδόται
  choice: предателями
  rationale: Передаёт личное предательство и участие в выдаче Иисуса; вариант «изменниками» возможен, но способен вызвать более узкие политические ассоциации.
- source_word: φονεῖς
  choice: убийцами
  rationale: Выражает не просто причинение смерти, а нравственно виновное убийство.
- source_word: ἐγένεσθε
  choice: стали
  rationale: Естественно передаёт вхождение в названное состояние; вместе с «теперь» сохраняет результирующий смысл.
theological_decisions:
- issue: Передача τοῦ δικαίου как христологического обозначения
  choice: Праведника
  alternative: Праведного
  rationale: В контексте речи Стефана это определённое обозначение Иисуса, чьё пришествие предвозвестили пророки. «Праведник» сохраняет титульную силу и остаётся понятным современному читателю.
- issue: Прописная буква в слове «Праведник»
  choice: Праведника с прописной буквы
  alternative: праведника со строчной буквы
  rationale: Контекст указывает на конкретное лицо — Иисуса, — а форма с артиклем функционирует как титул; прописная буква помогает распознать это, ничего не добавляя к содержанию.
translation_notes:
  register: Современный литературный русский язык с достоинством и прямотой обвинительной речи Стефана. Синтаксис слегка перестроен ради естественного русского порядка слов, при этом сохранены риторический вопрос, последовательность обвинений и богословская напряжённость текста.
