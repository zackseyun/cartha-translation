  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐξείλατο αὐτὸν ἐκ πασῶν τῶν θλίψεων αὐτοῦ, καὶ ἔδωκεν αὐτῷ χάριν καὶ σοφίαν ἐναντίον Φαραὼ βασιλέως Αἰγύπτου, καὶ κατέστησεν αὐτὸν ἡγούμενον ἐπ’ Αἴγυπτον ⸀καὶ ὅλον τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/010.yaml
  text: and rescued him from all his afflictions[a], and gave him favor and wisdom before Pharaoh king of Egypt[c][b], and appointed him ruler over Egypt and over all his household.
translation:
  language: ru
  text: и избавил его от всех бедствий, и даровал ему благосклонность и мудрость в глазах фараона, царя Египта,[a] и поставил его правителем над Египтом и над всем домом фараона.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «расположение и мудрость перед фараоном, царём Египта».'
    reason: 'Лексическая альтернатива: χάρις может передаваться словом «расположение», а ἐναντίον — «перед».'
  - marker: b
    text: 'Или: «назначил его управляющим Египтом и всем домом фараона».'
    reason: Лексическая альтернатива для κατέστησεν… ἡγούμενον, обозначающего поставление на руководящую должность.
lexical_decisions:
- source_word: ἐξείλατο
  choice: избавил
  rationale: Средняя форма ἐξαιρέω обозначает спасение или избавление от беды; «избавил» естественно сочетается с «от всех бедствий» и сохраняет активное действие подразумеваемого субъекта.
- source_word: θλίψεων
  choice: бедствий
  rationale: Во множественном числе слово охватывает перенесённые Иосифом тяготы, притеснения и страдания; «бедствия» передаёт широкий повествовательный смысл без специальных эсхатологических оттенков.
- source_word: χάριν
  choice: расположение
  rationale: Здесь χάρις означает благосклонное отношение к Иосифу со стороны фараона, а не требует богословски нагруженного слова «благодать».
- source_word: σοφίαν
  choice: мудрость
  rationale: Прямо передаёт σοφίαν, включая практическую рассудительность Иосифа, признанную фараоном.
- source_word: ἐναντίον
  choice: перед
  rationale: Передаёт нахождение перед лицом или в присутствии фараона и звучит естественно в данном повествовании.
- source_word: κατέστησεν
  choice: поставил
  rationale: В контексте назначения на властную должность «поставил» точно и естественно передаёт καθίστημι; слово сохраняет библейскую торжественность без архаичности.
- source_word: ἡγούμενον
  choice: правителем
  rationale: Обозначает лицо, осуществляющее руководство и власть; «правитель» шире и ближе к греческому, чем более административно конкретное «управляющий».
- source_word: ἐπ’ Αἴγυπτον
  choice: над Египтом
  rationale: ἐπί с винительным после глагола назначения выражает сферу власти.
- source_word: ὅλον τὸν οἶκον αὐτοῦ
  choice: над всем домом фараона
  rationale: οἶκος здесь означает дом, двор и хозяйство фараона. Повтор «фараона» снимает возможную русскую двусмысленность местоимения «его», хотя имя в этой фразе подразумевается из ближайшего контекста.
theological_decisions:
- issue: Подразумеваемый субъект глаголов
  choice: Не добавлять слово «Бог»
  alternative: 'Явно перевести: «Бог избавил его…»'
  rationale: Единственное число глаголов продолжает предшествующее утверждение о Боге в Деян 7:9, однако в самом стихе субъект не назван. Русская координация позволяет сохранить это подразумевание, не устраняя особенность греческого текста.
- issue: Значение χάρις в отношении фараона
  choice: расположение
  alternative: благодать
  rationale: Контекст говорит о благосклонном отношении перед фараоном. Выбор не переносит сюда более узкое систематико-богословское значение «благодати».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным регистром. Синтаксическая цепочка греческого текста сохранена. «Дом фараона» передаёт не только жилище, но также двор и хозяйство; явное повторение референта предотвращает двусмысленность русского «его».
