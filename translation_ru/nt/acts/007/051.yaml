  text: Σκληροτράχηλοι καὶ ἀπερίτμητοι ⸀καρδίαις καὶ τοῖς ὠσίν, ὑμεῖς ἀεὶ τῷ πνεύματι τῷ ἁγίῳ ἀντιπίπτετε, ὡς οἱ πατέρες ὑμῶν καὶ ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/051.yaml
  text: You stiff-necked people[a], uncircumcised in hearts and ears, you always resist the Holy Spirit; as your fathers did, so do you.
translation:
  language: ru
  text: Жестоковыйные[a] и необрезанные сердцем и ушами! Вы всегда противитесь Святому Духу — как ваши отцы[b], так и вы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с жёсткой шеей», то есть упорно непокорные.'
    reason: Пояснение сохранённой библейской метафоры.
  - marker: b
    text: 'Или: «ваши предки». По-гречески: «ваши отцы».'
    reason: Лексическая альтернатива и пояснение более широкого контекстуального значения.
lexical_decisions:
- source_word: Σκληροτράχηλοι
  choice: Жестоковыйные
  rationale: Сохраняет яркую библейскую метафору «жёсткой шеи», обозначающую упорное неповиновение, а не сводит её к более общему «упрямые».
- source_word: ἀπερίτμητοι καρδίαις καὶ τοῖς ὠσίν
  choice: необрезанные сердцем и ушами
  rationale: Сохраняет намеренно резкий заветный образ и передаёт дательные сферы естественным для русского языка творительным отношения.
- source_word: ἀεὶ
  choice: всегда
  rationale: Прямо передаёт постоянный, повторяющийся характер сопротивления.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: Святому Духу
  rationale: Стандартное современное обозначение личного божественного референта в контексте Деяний.
- source_word: ἀντιπίπτετε
  choice: противитесь
  rationale: Передаёт активное сопротивление и сохраняет пророчески-обличительный тон без лишнего расширения.
- source_word: ὡς οἱ πατέρες ὑμῶν καὶ ὑμεῖς
  choice: как ваши отцы, так и вы
  rationale: Естественно воспроизводит сравнение, делая по-русски явным подразумеваемый во второй части глагол.
theological_decisions:
- issue: Значение выражения «Святой Дух»
  choice: Личный божественный Святой Дух
  alternative: святое духовное влияние или расположение
  rationale: Определённая греческая конструкция и устойчивое употребление в Деяниях указывают здесь на Святого Духа как личного деятеля.
- issue: Образ необрезанности сердца и ушей
  choice: Сохранить заветную метафору
  alternative: Передать толкованием вроде «закрытые сердцем и глухие»
  rationale: Стефан сознательно использует язык пророческого обличения; буквальный образ сохраняет связь с Писанием Израиля и богословскую напряжённость обвинения.
- issue: Обозначение прежних поколений
  choice: ваши отцы
  alternative: ваши предки
  rationale: Греческое οἱ πατέρες буквально означает «отцы»; этот вариант сохраняет родственную и риторическую силу выражения, а примечание указывает более широкое контекстуальное значение.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и резкости пророческого обличения. Слово «жестоковыйные» имеет выраженную библейскую окраску, но сопровождается кратким пояснением; синтаксис остаётся ясным и пригодным для публичного чтения.
