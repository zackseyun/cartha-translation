lexical_decisions:
- source_word: ἀδικῶν
  choice: обижал
  rationale: Причастие настоящего времени передаёт продолжающееся неправедное действие; «обижал» естественно по-русски выражает причинение несправедливости в данном конфликте.
- source_word: πλησίον
  choice: ближнего
  rationale: «Ближний» — прямое и узнаваемое соответствие, сохраняющее связь с библейской лексикой и не уточняющее сверх текста, что речь идёт о соплеменнике.
- source_word: ἀπώσατο
  choice: оттолкнул
  rationale: Глагол обозначает резкое физическое или пренебрежительное отстранение; «оттолкнул» естественно передаёт конкретное действие в сцене.
- source_word: αὐτόν
  choice: Моисея
  rationale: 'Имя подставлено вместо местоимения ради ясности русского текста: согласно контексту, объект действия — Моисей, тогда как два мужских референта могли бы сделать «его» двусмысленным.'
- source_word: κατέστησεν
  choice: поставил
  rationale: В сочетании с обозначениями власти «поставил» естественно передаёт назначение или установление в должности.
- source_word: ἄρχοντα
  choice: начальником
  rationale: Слово обозначает лицо, наделённое властью; «начальник» сохраняет властный оттенок и естественно сочетается с глаголом «поставил».
- source_word: δικαστὴν
  choice: судьёй
  rationale: Прямое современное соответствие греческому обозначению того, кто выносит судебное решение.
- source_word: ἐφ’ ἡμῶν
  choice: над нами
  rationale: Предложное сочетание выражает власть над группой; «над нами» точно сохраняет вызов предполагаемым полномочиям Моисея.
