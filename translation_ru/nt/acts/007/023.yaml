  text: Ὡς δὲ ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος, ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ ἐπισκέψασθαι τοὺς ἀδελφοὺς αὐτοῦ τοὺς υἱοὺς Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/023.yaml
  text: When he was approaching forty years of age[a], it came into his heart to visit his brothers[c][b], the sons of Israel.
translation:
  language: ru
  text: Когда ему исполнялось сорок лет, ему пришло на сердце[a] навестить своих братьев — сынов Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у него возникло намерение», «он решил». Греческий текст сохраняет образный оборот, описывающий внутреннее побуждение или решение.'
    reason: lexical_alternative
  - marker: b
    text: «Братья» здесь — соплеменники Моисея, израильтяне; выражение «сыны Израиля» обозначает народ Израиля в целом.
    reason: cultural_note
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Когда
  rationale: Передаёт временной переход в повествовании; отдельное русское «теперь» не требуется, а связующая сила частицы δὲ естественно выражается контекстом.
- source_word: ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος
  choice: ему исполнялось сорок лет
  rationale: Естественный русский возрастной оборот сохраняет значение приближающегося к завершению сорокалетнего срока и несовершенный вид греческого глагола, не превращая выражение в чрезмерно точное указание на день рождения.
- source_word: ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ
  choice: ему пришло на сердце
  rationale: Сохраняет образный семитизированный оборот об возникшем внутреннем намерении, не сводя его без пояснения к простому «он решил».
- source_word: ἐπισκέψασθαι
  choice: навестить
  rationale: В контексте обозначает личное посещение соплеменников с заинтересованностью в их положении; «навестить» звучит естественно и допускает оттенок заботы.
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: своих братьев
  rationale: Сохраняет родственную метафору и грамматически мужскую форму оригинала; следующая аппозиция уточняет, что речь идёт о соплеменниках Моисея.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: сынов Израиля
  rationale: Формально и узнаваемо передаёт библейское этническое обозначение, сохраняя связь с именем патриарха Израиля и структуру приложения.
theological_decisions:
- issue: Родственное и этническое обозначение народа
  choice: своих братьев — сынов Израиля
  alternative: своих соплеменников-израильтян
  rationale: Выбранный вариант сохраняет семейно-заветную образность и мужские множественные формы исходного текста, но сноска разъясняет их собирательное этническое значение и не ограничивает референт только мужчинами.
- issue: Характер намерения Моисея
  choice: ему пришло на сердце
  alternative: он решил
  rationale: Образный оборот оригинала оставлен в тексте, чтобы не устранять возможное напряжение между возникшим побуждением и сознательным решением; значение поясняется в сноске без утверждения особого сверхъестественного источника намерения.
translation_notes:
  register: Современный литературный русский язык с умеренным сохранением библейской образности. Оборот «ему пришло на сердце» несколько возвышен, но понятен из контекста и пояснён сноской; тире ясно оформляет приложение «сыны Израиля».
