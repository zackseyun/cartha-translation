  terminology: «Завет обрезания» — устоявшееся и точное соответствие διαθήκη περιτομῆς; «обрезал», «на восьмой день» и «патриархи» также верно передают исходные термины и соответствуют библейско-историческому регистру. Формы имён «Авраам», «Исаак», «Иаков» нормативны в русском библейском употреблении.
