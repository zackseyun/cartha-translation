  source_fidelity: 'Перевод точно передаёт последовательность и основные элементы греческого текста: Бог дал Аврааму «завет обрезания»; затем Авраам стал отцом Исаака и обрезал его на восьмой день; далее сохранена родословная цепочка Исаак—Иаков—двенадцать патриархов. Явное введение имени «Аврааму» оправдано русской необходимостью снять местоименную неоднозначность и не добавляет смысла.'
