  text: καὶ ἔδωκεν αὐτῷ διαθήκην περιτομῆς· καὶ οὕτως ἐγέννησεν τὸν Ἰσαὰκ καὶ περιέτεμεν αὐτὸν τῇ ἡμέρᾳ τῇ ὀγδόῃ, ⸀καὶ Ἰσαὰκ τὸν Ἰακώβ, ⸁καὶ Ἰακὼβ τοὺς δώδεκα πατριάρχας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/008.yaml
  text: And he gave him the covenant of circumcision. And so he fathered Isaac and circumcised him on the eighth day, and Isaac fathered Jacob, and Jacob the twelve patriarchs.
translation:
  language: ru
  text: Он дал Аврааму завет обрезания. И так Авраам стал отцом Исаака и обрезал его на восьмой день; Исаак стал отцом Иакова, а Иаков — двенадцати патриархов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκην περιτομῆς
  choice: завет обрезания
  rationale: «Завет» точно передаёт διαθήκη в библейско-историческом контексте, а сочетание «завет обрезания» сохраняет определяющую роль родительного περιτομῆς и связь с Быт 17, не разворачивая её в пояснительную интерпретацию.
- source_word: οὕτως
  choice: И так
  rationale: Передаёт связь между дарованием завета и последующим рождением и обрезанием Исаака, сохраняя возможный последовательный и результирующий оттенок греческого наречия.
- source_word: ἐγέννησεν
  choice: стал отцом
  rationale: Естественно и точно выражает мужское родительство в генеалогии; не использует архаичное и неестественное для современного русского «родил» применительно к мужчине.
- source_word: περιέτεμεν
  choice: обрезал
  rationale: Стандартный и прямой русский эквивалент глагола περιτέμνω в повествовании о знаке завета.
- source_word: τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: на восьмой день
  rationale: Естественно передаёт временной дательный оборот без добавления отсутствующего в греческом уточнения «после рождения».
- source_word: πατριάρχας
  choice: патриархов
  rationale: Устоявшийся библейско-исторический термин для родоначальников двенадцати колен Израиля.
- source_word: Ἰσαάκ / Ἰακώβ
  choice: Исаак / Иаков
  rationale: Использованы традиционные и общеупотребительные русские формы библейских имён.
theological_decisions:
- issue: Характер завета, обозначенного выражением διαθήκην περιτομῆς
  choice: «завет обрезания»
  alternative: «завет, знаком которого было обрезание»
  rationale: Краткая формулировка сохраняет структуру и богословскую ёмкость исходного выражения, не решая в самом тексте, обозначает ли родительный прежде всего знак, характер или содержание завета.
- issue: Передача генеалогического глагола γεννάω
  choice: «стал отцом»
  alternative: «родил»
  rationale: Выбранная формулировка сохраняет мужскую генеалогическую линию и остаётся естественной в современном литературном русском языке.
- issue: Явное обозначение Авраама
  choice: Имя «Авраам» названо для устранения местоименной двусмысленности
  alternative: «Он дал ему… И так он стал отцом…»
  rationale: В греческом смена подразумеваемого субъекта понятна из контекста, тогда как последовательность русских местоимений могла бы ошибочно представить Бога отцом Исаака. Уточнение не добавляет новой богословской информации, а делает референцию явной.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской исторической речи. Сохранены краткость, генеалогический параллелизм и термин «патриархи»; архаизмы вроде «родил» о мужчине и «породил» не использованы.
