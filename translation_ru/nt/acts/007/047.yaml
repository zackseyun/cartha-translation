  text: Σολομῶν δὲ οἰκοδόμησεν αὐτῷ οἶκον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/047.yaml
  text: But Solomon built a house for him[a].
translation:
  language: ru
  text: Но Соломон построил Ему дом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храм»; букв. «дом».'
    reason: 'Лексический вариант: по контексту речь идёт о храме, тогда как греческое слово буквально означает «дом».'
lexical_decisions:
- source_word: Σολομῶν
  choice: Соломон
  rationale: Устоявшаяся русская форма библейского личного имени.
- source_word: δὲ
  choice: Но
  rationale: Передаёт лёгкое противопоставление и одновременно продолжает историческое повествование.
- source_word: οἰκοδόμησεν
  choice: построил
  rationale: В данном контексте глагол обозначает буквальное возведение здания; «построил» — прямой и естественный русский эквивалент.
- source_word: αὐτῷ
  choice: Ему
  rationale: Местоимение в дательном падеже относится к Богу; русская конструкция «построил Ему дом» естественно передаёт назначение и посвящение постройки.
- source_word: οἶκον
  choice: дом
  rationale: Сохраняет обычное значение греческого слова и важное для контекста библейское обозначение храма как Божьего дома; более конкретное «храм» дано как вариант в сноске.
theological_decisions:
- issue: Передача οἶκον как «дом» или как «храм»
  choice: дом
  alternative: храм
  rationale: В исходном тексте употреблено обычное слово οἶκος, а не более специальное обозначение храма. «Дом» сохраняет словоупотребление Стефана и напряжение с последующим утверждением, что Всевышний не живёт в рукотворных жилищах.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная и dignified формулировка. Заглавная буква в «Ему» указывает на Бога согласно принятой русской библейской издательской традиции.
