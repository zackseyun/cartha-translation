  rationale: Естественное русское временное выражение, точно передающее отсылку к указанному периоду.
- source_word: ἐγεννήθη
  choice: родился
  rationale: Обычная и точная передача аориста пассивного залога γεννάω в контексте рождения.
- source_word: Μωϋσῆς
  choice: Моисей
  rationale: Устоявшаяся русская форма имени.
- source_word: ἀστεῖος
  choice: прекрасен
  rationale: Передаёт значение внешней красоты или особой привлекательности, не сводя его к более узкому толкованию «красив» либо «необыкновенен».
- source_word: τῷ θεῷ
  choice: в глазах Бога
  rationale: Естественно передаёт дательный отношения или оценки и сохраняет явное упоминание Бога.
- source_word: ὃς ἀνετράφη
  choice: его растили
  rationale: Ясно и естественно передаёт пассивное значение воспитания и ухода за ребёнком; местоимение однозначно относится к Моисею.
- source_word: μῆνας τρεῖς
  choice: три месяца
  rationale: Естественное русское обозначение продолжительности.
- source_word: ἐν τῷ οἴκῳ τοῦ πατρός
  choice: в доме отца
  rationale: Сохраняет семейно-домашний смысл исходного выражения без неестественной тяжеловесности.
theological_decisions:
- issue: Значение ἀστεῖος τῷ θεῷ
  choice: прекрасен в глазах Бога
  alternative: прекрасен для Бога; необыкновенно красив; красив перед Богом
