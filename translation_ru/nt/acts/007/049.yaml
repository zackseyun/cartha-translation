  source_fidelity: 'Первая часть передана точно: «небо», «престол», «земля», «подножие моих ног» сохраняют образность и параллелизм греческого текста. «Какой дом вы построите для меня?» адекватно передаёт ποῖον οἶκον οἰκοδομήσετέ μοι. Однако τίς τόπος означает не «где [находится] место», а «что за / какое место»; в проекте вопрос о характере места заменён вопросом о его местонахождении.'
