  rationale: 'Исправлена только передача τίς τόπος: «или что за место» сохраняет второй риторический вопрос как вопрос о качестве или характере места, не превращая его в вопрос о местонахождении. Союз ἤ передан как «или», что яснее воспроизводит структуру исходного противопоставления.'
