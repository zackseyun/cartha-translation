  terminology: '«Господь» верно передаёт κύριος; «дом» обоснованно не заменён на «храм». «Престол» и «подножие моих ног» уместны в библейском регистре. Сноски не требуются: в русском тексте нет необходимости отдельно пояснять образ «подножия моих ног».'
