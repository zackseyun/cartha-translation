  text: Ὁ οὐρανός μοι θρόνος, ⸂ἡ δὲ⸃ γῆ ὑποπόδιον τῶν ποδῶν μου· ποῖον οἶκον οἰκοδομήσετέ μοι, λέγει κύριος, ἢ τίς τόπος τῆς καταπαύσεώς μου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/049.yaml
  text: Heaven is my throne[a], and the earth is the footstool for my feet. What kind of house will you build for me, says the Lord, or what is the place of my rest?
translation:
  language: ru
  text: «Небо — мой престол, а земля — подножие моих ног. Какой дом вы построите для меня, — говорит Господь, — или что за место моего покоя?»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρανός
  choice: небо
  rationale: В противопоставлении земле обозначает небесную сферу; русское «небо» естественно передаёт и космический, и богословский смысл.
- source_word: θρόνος
  choice: престол
  rationale: Сохраняет прозрачный образ царской власти и соответствует возвышенному контексту цитаты.
- source_word: γῆ
  choice: земля
  rationale: Имеет здесь космический смысл в паре с небом, а не значение отдельной страны или территории.
- source_word: ὑποπόδιον τῶν ποδῶν μου
  choice: подножие моих ног
  rationale: Близко передаёт греческую генитивную конструкцию, сохраняет явное упоминание ног и естественно звучит по-русски.
- source_word: ποῖον οἶκον
  choice: какой дом
  rationale: «Какой» передаёт вопрос о характере или качестве дома, а «дом» сохраняет формулировку источника, не подменяя её толкованием «храм».
- source_word: οἰκοδομήσετέ μοι
  choice: вы построите для меня
  rationale: Будущее время и риторический вопрос переданы прямо; местоимение «вы» делает форму второго лица множественного числа явной.
- source_word: κύριος
  choice: Господь
  rationale: Обычное русское соответствие κύριος в формуле пророческой речи.
- source_word: τίς τόπος τῆς καταπαύσεώς μου
  choice: где место моего покоя
  rationale: Естественная русская формулировка сохраняет существительные «место» и «покой», а также риторическую силу вопроса.
theological_decisions:
- issue: Передача κύριος в ветхозаветной цитате, где говорит Бог Израиля
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Перевод следует непосредственно греческому κύριος в новозаветном тексте и не вводит типографическое различие, которого в источнике нет.
- issue: Конкретизация οἶκος как храма
  choice: дом
  alternative: храм
  rationale: Хотя контекст относится к храму, греческий текст сохраняет более широкое слово «дом»; такая передача не устраняет намеренную риторическую широту цитаты.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном. Сохранены параллелизм и образность пророческой цитаты. Местоимения, относящиеся к Богу, даны со строчной буквы в соответствии с нейтральной современной издательской нормой; «Господь» — с прописной как титул-именование. Маркеры сносок не требуются.
