lexical_decisions:
- source_word: ἔφυγεν
  choice: бежал
  rationale: Аорист φεύγω обозначает бегство или поспешное удаление от опасности; «бежал» кратко и точно передаёт смысл.
- source_word: δὲ
  choice: и
  rationale: Частица δέ продолжает повествование; в русском естественная связь с причиной уже выражена оборотом «из-за этих слов», поэтому отдельное «тогда» не требуется.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: из-за этих слов
  rationale: Оборот указывает на высказывание как непосредственный повод к бегству. Множественное «слов» в русском идиоматично обозначает услышанную реплику, не меняя числа греческого λόγος буквально, но передавая его речевой смысл.
- source_word: ἐγένετο πάροικος
  choice: стал чужеземцем
  rationale: πάροικος — человек, живущий не в своей земле, не принадлежащий к местному населению. «Чужеземец» сохраняет этот смысл и подходит достоинству библейского повествования.
- source_word: ἐν γῇ Μαδιάμ
  choice: в земле Мадиамской
  rationale: Сохраняется явное γῇ и традиционно узнаваемое, но современно понятное русское географическое выражение.
- source_word: οὗ
  choice: где
  rationale: Относительное наречие места естественно отсылает к земле Мадиамской.
- source_word: ἐγέννησεν υἱοὺς δύο
  choice: у него родились два сына
  rationale: Греческий активный оборот буквально говорит, что Моисей породил двух сыновей. Русское «у него родились» естественно выражает его отцовство без архаичного «родил» или «породил».
