  yaml_path: translation/nt/acts/007/028.yaml
  text: Do you want to kill me the way you killed the Egyptian yesterday?
translation:
  language: ru
  text: Неужели ты хочешь убить меня, как вчера убил египтянина?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ... θέλεις
  choice: Не хочешь ли ты
  rationale: Вопрос с μὴ обычно предполагает отрицательный ответ; русская вопросительная конструкция естественно передаёт этот оттенок.
- source_word: ἀνελεῖν με
  choice: убить и меня
  rationale: ἀναιρέω здесь означает «убить»; частица «и» естественно подчёркивает подразумеваемое присоединение говорящего к прежней жертве.
- source_word: ὃν τρόπον
  choice: так же, как
  rationale: 'Передаёт сравнительное значение оборота: «тем способом / подобно тому, как».'
- source_word: ἐχθὲς τὸν Αἰγύπτιον
  choice: вчера ... египтянина
  rationale: Сохраняет временное указание и определённость известного из контекста египтянина.
