lexical_decisions:
- source_word: οἵτινες
  choice: вы, которые
  rationale: Качественно-относительное местоимение вместе с глаголами второго лица множественного числа прямо и обвинительно обращено к слушателям Стефана.
- source_word: ἐλάβετε
  choice: получили
  rationale: Естественно передаёт получение закона, не добавляя идеи добровольного принятия.
- source_word: τὸν νόμον
  choice: закон
  rationale: Речь идёт о Моисеевом законе; строчная буква не вносит отсутствующего в греческом тексте типографского толкования.
- source_word: εἰς διαταγὰς ἀγγέλων
  choice: через установления ангелов
  rationale: 'Формулировка сохраняет трудность и многозначность оборота: διαταγαί может обозначать установления, распоряжения или устроение, а контекст связывает получение закона с участием ангелов.'
- source_word: ἀγγέλων
  choice: ангелов
  rationale: В контексте дарования закона имеются в виду небесные существа, а не человеческие посланники.
- source_word: οὐκ ἐφυλάξατε
  choice: но не соблюли его
  rationale: С законом φυλάσσω естественно означает соблюдать или исполнять; местоимение «его» явно выражает подразумеваемое дополнение.
theological_decisions:
- issue: Значение выражения εἰς διαταγὰς ἀγγέλων
  choice: Закон был получен через установления ангелов.
  alternative: Закон был получен при посредничестве ангелов или по распоряжению ангелов.
  rationale: Текст указывает на участие ангелов в даровании закона, но не позволяет с полной уверенностью определить точный характер этого участия. Основной перевод сохраняет лексическую напряжённость, а сноска даёт естественные варианты.
translation_notes:
  register: Современный литературный русский язык; прямое обвинительное обращение сохранено. «Установления» выбрано ради близости к неоднозначному διαταγαί, а более естественные истолковывающие варианты вынесены в сноску.
