id: ACT.7.32
reference: Acts 7:32
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐγὼ ὁ θεὸς τῶν πατέρων σου, ὁ θεὸς Ἀβραὰμ ⸀καὶ Ἰσαὰκ ⸁καὶ Ἰακώβ. ἔντρομος δὲ γενόμενος Μωϋσῆς οὐκ ἐτόλμα κατανοῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/032.yaml
  text: I am the God of your fathers[a], the God of Abraham and Isaac and Jacob[b]. Then Moses became terrified and did not dare to look closely.
translation:
  language: ru
  text: «Я — Бог твоих отцов[a], Бог Авраама, Исаака и Иакова». Моисей задрожал от страха и не осмеливался всмотреться[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предков».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «внимательно рассмотреть»; греческий глагол может обозначать как пристальное наблюдение, так и внимательное осмысление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ὁ θεὸς
  choice: Я — Бог
  rationale: В греческой именной формуле связка отсутствует, а местоимение Ἐγώ подчёркнуто. Русская конструкция с тире естественно передаёт торжественное самоотождествление без ненужного добавления глагола.
- source_word: τῶν πατέρων σου
  choice: твоих отцов
  rationale: Буквальное «отцов» сохраняет библейское и заветное звучание; «предков» возможно, но более обобщённо.
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: Бог Авраама, Исаака и Иакова
  rationale: Естественное русское перечисление сохраняет повторное приложение «Бог» и имена всех трёх патриархов.
- source_word: ἔντρομος δὲ γενόμενος
  choice: Моисей задрожал от страха
  rationale: ἔντρομος обозначает охваченность страхом или дрожью, а γενόμενος — вступление в это состояние. Выражение передаёт обе стороны значения естественным современным русским языком.
- source_word: οὐκ ἐτόλμα
  choice: не осмеливался
  rationale: Несовершенный вид соответствует имперфекту и передаёт продолжавшуюся нерешительность Моисея.
- source_word: κατανοῆσαι
  choice: всмотреться
  rationale: В контексте явления у горящего куста глагол означает внимательное, пристальное восприятие; «всмотреться» передаёт конкретный зрительный смысл, сохраняя идею внимательного рассмотрения.
theological_decisions:
- issue: Форма Божьего самоотождествления в цитате из Исхода
  choice: Я — Бог твоих отцов
  alternative: Я Бог твоих отцов
  rationale: Тире ясно и естественно оформляет русскую именную конструкцию и сохраняет подчёркнутое Ἐγώ, не добавляя к цитате богословских уточнений.
- issue: Объект действия κατανοῆσαι не назван прямо
  choice: не добавлять «на куст» или «на Бога»
  alternative: не осмеливался взглянуть на куст
  rationale: Греческий текст оставляет объект подразумеваемым. Его явное указание сузило бы сохранённую источником неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Формулировка избегает архаичного «воззреть» и сохраняет как интенсивность страха, так и неоднозначность последнего греческого глагола.
