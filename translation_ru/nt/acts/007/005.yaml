review_pass:
  verdict: revise
  source_fidelity: «Наследственное владение» несколько смещает κληρονομίαν к устойчивому праву собственности; здесь прямее и точнее «наследство». Передача βῆμα ποδός как «земли, куда можно было бы поставить ногу» верно раскрывает смысл, но заметно разворачивает образ; «пяди земли» естественно передаёт идиоматический минимум участка. Убрано добавочное «ещё», которого в греческом тексте нет.
  naturalness: Исправленный текст звучит по-современному и литературно. «Пяди земли» — прозрачный русский идиоматический оборот; примечание сохраняет связь с греческим образом ноги.
  terminology: «Наследство» сохраняет связь с κληρονομία и обетованием земли; «во владение» удачно передаёт εἰς κατάσχεσιν. «Потомству» корректно передаёт собирательное σπέρμα.
  issues:
  - severity: medium
    issue: «Наследственное владение» вместо κληρονομίαν
    rationale: Сочетание привносит оттенок уже закреплённого владения, тогда как κληρονομίαν прямо обозначает «наследство/наследственный удел».
  - severity: low
    issue: Добавочное «ещё» в заключительной клаузе
    rationale: Оно логично в контексте, но прямо не выражено в οὐκ ὄντος αὐτῷ τέκνου; нейтральное «не было ребёнка» точнее сохраняет формулировку источника.
  - severity: low
    issue: Сноска a формулирует буквальное значение как «шага ноги»
    rationale: Для русского читателя это неясно и не вполне удачно как буквальная передача. Лучше пояснить образ как «место для стопы» и отметить значение минимального участка земли.
  revised_text: И не дал ему в ней никакого наследства — даже пяди земли, — но обещал дать её во владение ему и его потомству после него, хотя у него не было ребёнка.
