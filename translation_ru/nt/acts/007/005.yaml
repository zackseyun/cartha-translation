reference: Acts 7:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔδωκεν αὐτῷ κληρονομίαν ἐν αὐτῇ οὐδὲ βῆμα ποδός, καὶ ἐπηγγείλατο δοῦναι αὐτῷ εἰς κατάσχεσιν αὐτὴν καὶ τῷ σπέρματι αὐτοῦ μετ’ αὐτόν, οὐκ ὄντος αὐτῷ τέκνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/005.yaml
  text: And he gave him no inheritance in it[a], not even a foot's length, but promised to give it to him as a possession, and to his offspring after him[b], though he had no child.
translation:
  language: ru
  text: И не дал ему в ней никакого наследства — даже пяди земли, — но обещал дать её во владение ему и его потомству после него, хотя у него не было ребёнка.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κληρονομίαν
  choice: наследственного владения
  rationale: Сочетание передаёт как юридический смысл удела, так и связь с обетованной землёй; одно «наследства» в современном русском могло бы прежде всего означать имущество после смерти.
- source_word: οὐδὲ βῆμα ποδός
  choice: даже земли, куда можно было бы поставить ногу
  rationale: Естественно передаёт греческую идиому, буквально связанную с шагом или местом для стопы, то есть с самым малым участком земли.
- source_word: ἐπηγγείλατο
  choice: обещал
  rationale: Прямой и естественный русский эквивалент, сохраняющий силу Божьего обязательства.
- source_word: εἰς κατάσχεσιν
  choice: во владение
  rationale: Передаёт назначение земли как постоянного обладания без избыточно технической формулировки.
- source_word: σπέρματι
  choice: потомству
  rationale: Сохраняет собирательное значение σπέρμα и естественно звучит в русском языке в контексте обетования Аврааму.
- source_word: μετ’ αὐτόν
  choice: после него
  rationale: Прямо передаёт временную последовательность поколений.
- source_word: οὐκ ὄντος αὐτῷ τέκνου
  choice: хотя у него ещё не было ребёнка
  rationale: Концессивное «хотя» выражает контекстуальный контраст между обетованием потомства и бездетностью Авраама; «ещё» естественно обозначает его положение на тот момент, не устраняя напряжения текста.
theological_decisions:
- issue: Значение обстоятельственного генитива οὐκ ὄντος αὐτῷ τέκνου
  choice: хотя у него ещё не было ребёнка
  alternative: когда у него ещё не было ребёнка
  rationale: 'Конструкция допускает временное прочтение, однако в речи Стефана особенно заметен уступительный контраст: Бог дал обещание, несмотря на тогдашнюю бездетность Авраама. Альтернатива указана в примечании.'
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Тире выделяют усилительное уточнение. Формулировка «наследственное владение» сохраняет правовой и заветный оттенок, а идиома о ноге передана понятно без архаизма.
