  to: И не дал ему в ней никакого наследства — даже пяди земли, — но обещал дать её во владение ему и его потомству после него, хотя у него не было ребёнка.
  rationale: Исправления делают передачу ключевых слов ближе к греческому тексту и устраняют невыраженное добавление «ещё». Идиома о минимальном участке земли передана естественным русским оборотом, а её буквальный образ и альтернативное прочтение заключительной конструкции сохранены в сносках.
