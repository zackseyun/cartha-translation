lexical_decisions:
- source_word: εἶπεν πρὸς αὐτόν
  choice: сказал ему
  rationale: Сохранена обычная повествовательная формула и местоимение греческого текста; имя Авраама не добавляется.
- source_word: Ἔξελθε ἐκ τῆς γῆς σου
  choice: Выйди из своей земли
  rationale: «Выйди» передаёт повеление и направленность движения, а «земля» сохраняет широкий территориальный смысл γῆ без современных государственно-политических оттенков слова «страна».
- source_word: ἐκ τῆς συγγενείας σου
  choice: от своей родни
  rationale: «Родня» естественно обозначает совокупность родственников и сохраняет коллективный смысл συγγένεια.
- source_word: δεῦρο εἰς τὴν γῆν
  choice: иди в землю
  rationale: Хотя δεῦρο буквально выражает движение к говорящему («сюда», «приходи»), в русском косвенно переданном указании Бога естественнее «иди»; «в землю» сохраняет направленность εἰς.
- source_word: ἣν ἄν σοι δείξω
  choice: которую Я покажу тебе
  rationale: Будущая направленность конструкции с ἄν и аористом сослагательного наклонения естественно передаётся русским будущим временем без ложного оттенка неуверенности.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Начальное «и» сохранено как связь с предыдущим повествованием. Местоимение «Я» в Божьей речи написано с прописной буквы согласно устойчивой русской библейской традиции; это не устраняет какой-либо смысловой неоднозначности.
