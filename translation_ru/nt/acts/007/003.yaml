  text: And he said to him[a], ‘Go out from your land and from your kindred, and come into the land that I will show you.’
translation:
  language: ru
  text: 'И сказал ему: «Выйди из своей земли и от своей родни[a] и иди в землю, которую Я покажу тебе».'
