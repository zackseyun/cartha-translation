  text: ᾧ οὐκ ἠθέλησαν ὑπήκοοι γενέσθαι οἱ πατέρες ἡμῶν, ἀλλὰ ἀπώσαντο καὶ ἐστράφησαν ⸂ἐν ταῖς καρδίαις⸃ αὐτῶν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/039.yaml
  text: Our fathers were unwilling to become obedient to him[a], but rejected him and turned back in their hearts to Egypt[b],
translation:
  language: ru
  text: Наши отцы не захотели повиноваться ему, но отвергли его и в сердцах своих повернулись к Египту.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть, оставаясь в пустыне, они в душе стремились вернуться в Египет.
    reason: cultural_note
lexical_decisions:
- source_word: ᾧ
  choice: ему
  rationale: Дательный падеж относительного местоимения относится к Моисею из предыдущего стиха и естественно передаётся как дополнение при «повиноваться».
- source_word: οὐκ ἠθέλησαν ὑπήκοοι γενέσθαι
  choice: не захотели повиноваться
  rationale: Передаёт сознательное нежелание подчиниться; буквальное «не захотели стать послушными» по-русски менее естественно.
- source_word: οἱ πατέρες ἡμῶν
  choice: наши отцы
  rationale: Сохраняет прямое обозначение предков Израиля и библейский регистр исходного выражения.
- source_word: ἀπώσαντο
  choice: отвергли его
  rationale: В контексте глагол выражает решительное отвержение Моисея; возможный буквальный образ отталкивания не следует навязывать основному тексту.
- source_word: ἐστράφησαν
  choice: обратились назад
  rationale: Передаёт внутренний поворот вспять к Египту, а не нейтральное изменение направления.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: в сердцах своих
  rationale: Сохраняет библейскую антропологическую идиому, обозначающую внутренние желания и намерения.
- source_word: εἰς Αἴγυπτον
  choice: к Египту
  rationale: Передаёт направленность внутреннего поворота; «назад» уже выражает идею возвращения.
theological_decisions:
- issue: Характер обращения к Египту
  choice: «в сердцах своих обратились назад, к Египту»
  alternative: «сердцем возвратились в Египет»
  rationale: Исходный текст прямо помещает поворот во внутреннюю сферу и указывает направление к Египту. Формулировка сохраняет напряжение между физическим пребыванием в пустыне и внутренним стремлением вернуться, не сводя его только к эмоции или буквальному возвращению.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Повиноваться» естественно передаёт отношение к Моисею, а «наши отцы» сохраняет исходную риторическую связь Стефана со слушателями. Единственная сноска поясняет внутренний, а не физический характер возвращения; маркер помещён в основном тексте.
