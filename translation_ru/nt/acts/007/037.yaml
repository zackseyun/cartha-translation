  text: οὗτός ἐστιν ὁ Μωϋσῆς ὁ ⸀εἴπας τοῖς υἱοῖς Ἰσραήλ· Προφήτην ὑμῖν ἀναστήσει ⸂ὁ θεὸς⸃ ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/037.yaml
  text: This is the Moses who said to the sons of Israel[a], ‘God will raise up for you a prophet from among your brothers[c][b], like me.’
translation:
  language: ru
  text: 'Это тот Моисей, который сказал сынам Израиля: «Бог воздвигнет вам пророка из числа ваших братьев[a], подобного мне».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Братья» здесь означает соплеменников-израильтян.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ Μωϋσῆς
  choice: Это тот Моисей
  rationale: Конструкция имеет подчёркнуто-идентифицирующую силу. «Это тот Моисей» естественно передаёт её по-русски без неестественного буквального артикля при имени.
- source_word: ὁ εἴπας
  choice: который сказал
  rationale: Субстантивированное атрибутивное причастие естественно передаётся определительным придаточным.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: сынам Израиля
  rationale: Сохраняет конкретную лексику υἱοί и ветхозаветное звучание цитаты; более свободный вариант — «израильтянам».
- source_word: Προφήτην
  choice: пророка
  rationale: Существительное без артикля не требует в основном тексте интерпретирующего оформления как титула «Пророк».
- source_word: ἀναστήσει
  choice: воздвигнет
  rationale: Передаёт действие Бога, который поставит и явит пророка, и сохраняет традиционную русскую библейскую сочетаемость без сведения смысла лишь к назначению на должность.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: из числа ваших братьев
  rationale: Явно передаёт ἐκ как происхождение изнутри группы; «братья» здесь обозначает соплеменников-израильтян.
- source_word: ὡς ἐμέ
  choice: подобного мне
  rationale: Прямо и естественно выражает сравнение пророка с Моисеем.
theological_decisions:
- issue: Цитата из Второзакония 18:15 и её мессианское значение
  choice: «пророка» со строчной буквы, без добавления определённого артикля или титульного оформления
  alternative: «Пророка» как известный мессианский титул
  rationale: В контексте Деяний пророчество относится к Иисусу, однако греческое Προφήτην не имеет артикля. Основной текст сохраняет формулировку и богословскую напряжённость, не подменяя перевод толкованием.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. «Воздвигнет» и «сынам Израиля» уместны в прямой ветхозаветной цитате; синтаксис остаётся понятным современному читателю.
