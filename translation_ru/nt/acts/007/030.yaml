  text: Καὶ πληρωθέντων ἐτῶν τεσσεράκοντα ὤφθη αὐτῷ ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ ⸀ἄγγελος ἐν φλογὶ πυρὸς βάτου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/030.yaml
  text: And after forty years had passed[a], an angel appeared to him in the wilderness of Mount Sinai[c][b], in a flame of fire from a bush.
translation:
  language: ru
  text: Когда исполнилось сорок лет[a], в пустыне у горы Синай ему явился ангел[b] в пламени огня, исходившем из куста[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по прошествии сорока лет».'
    reason: lexical_alternative
  - marker: b
    text: В Исх. 3:2 это явление связано с «Ангелом Господним», однако здесь в греческом тексте сказано просто «ангел».
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «в пламени огня куста»; имеется в виду пламя, связанное с кустом (см. Исх. 3:2).'
    reason: cross_reference
lexical_decisions:
- source_word: πληρωθέντων ἐτῶν τεσσεράκοντα
  choice: когда исполнилось сорок лет
  rationale: Генитив абсолютный выражает время; «исполнилось» сохраняет значение πληρόω и естественно звучит по-русски.
- source_word: ὤφθη αὐτῷ
  choice: ему явился
  rationale: Пассивная форма ὁράω в рассказах о сверхъестественном явлении идиоматически передаётся глаголом «явился»; дательный αὐτῷ — «ему».
- source_word: ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ
  choice: в пустыне у горы Синай
  rationale: ἔρημος обозначает безлюдную пустынную местность, а родительный τοῦ ὄρους Σινᾶ здесь естественно передаётся как пространственная привязка «у горы Синай».
- source_word: ἄγγελος
  choice: ангел
  rationale: В контексте речь идёт о небесном вестнике; перевод не добавляет отсутствующего в греческом тексте определения «Господень».
- source_word: ἐν φλογὶ πυρὸς βάτου
  choice: в огненном пламени тернового куста
  rationale: Передача сохраняет образ пламени, связанного с βάτος; «терновый куст» — понятное и традиционно узнаваемое обозначение куста из рассказа Исх. 3:2.
theological_decisions:
- issue: Кем является ἄγγελος в контексте богоявления
  choice: ангел
  alternative: ангел Господень
  rationale: В Деян. 7:30 стоит только ἄγγελος. Более определённое наименование из Исх. 3:2 не внесено в основной текст, чтобы не устранять напряжение между формулировками двух мест.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сделан естественным, при этом сохранены временная конструкция, место действия и сжатый образ пламени куста.
