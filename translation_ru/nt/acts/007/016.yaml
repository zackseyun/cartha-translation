base_translation:
  language: en
  yaml_path: translation/nt/acts/007/016.yaml
  text: and they were carried over to Shechem and laid in the tomb that Abraham had bought for a price of silver from the sons of Hamor in Shechem[a].
translation:
  language: ru
  text: Их перенесли в Сихем и положили в гробнице, которую Авраам купил за серебро у сыновей Еммора в Сихеме[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В словах Стефана соединены детали, которые можно сопоставить с Бытия 23, где Авраам покупает у Ефрона место для погребения в Махпеле, и с Бытия 33:19, где Иаков покупает близ Сихема землю у сыновей Еммора.
    reason: cross_reference
lexical_decisions:
- source_word: μετετέθησαν
  choice: перенесли
  rationale: Аорист пассива μετατίθημι обозначает перенесение останков в другое место; русская неопределённо-личная конструкция естественно передаёт греческий пассив.
- source_word: Συχὲμ / Συχέμ
  choice: Сихем
  rationale: Устоявшаяся русская библейская передача названия места.
- source_word: ἐτέθησαν
  choice: положили
  rationale: В контексте погребения «положили» естественно и близко передаёт пассив τίθημι.
- source_word: μνήματι
  choice: гробнице
  rationale: μνῆμα здесь означает место погребения; «гробница» точнее сохраняет этот смысл, чем возможное «могила».
- source_word: ᾧ
  choice: которую
  rationale: Относительное местоимение соотнесено с μνήματι; по-русски род определяется существительным «гробница».
- source_word: ὠνήσατο
  choice: купил
  rationale: Глагол прямо означает покупку; предшествование захоронению ясно из контекста и не требует добавления формы «ранее купил».
- source_word: τιμῆς ἀργυρίου
  choice: за серебро
  rationale: Кратко и естественно передаёт цену, уплаченную серебром, не превращая выражение в современное «за деньги».
- source_word: παρὰ τῶν υἱῶν Ἑμμὼρ
  choice: у сыновей Еммора
  rationale: παρά с родительным указывает на источник приобретения; конструкция «купил у» естественна для современного русского языка.
- source_word: ἐν Συχέμ
  choice: в Сихеме
  rationale: Прямая передача греческого оборота сохраняет возможность отнести указание места к Еммору или к сделке, не разрешая синтаксическую неоднозначность искусственно.
theological_decisions:
- issue: Историческое напряжение с рассказами Книги Бытия о покупке места погребения
  choice: 'Сохранить формулировку речи Стефана: Авраам купил гробницу у сыновей Еммора в Сихеме.'
  alternative: Согласовать текст либо с покупкой Иаковом земли в Бытие 33:19, либо с покупкой Авраамом участка в Махпеле в Бытие 23.
  rationale: Перевод должен передавать имеющийся греческий текст, а не вносить в него предполагаемое согласование. Сопоставимые детали сообщаются в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Два однородных сказуемых «перенесли» и «положили» дают естественную русскую передачу греческих пассивных форм. Историческое напряжение текста сохранено и пояснено без гармонизации.
