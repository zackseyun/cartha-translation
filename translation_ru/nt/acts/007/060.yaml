  variant: modern literary Russian
source:
  edition: SBLGNT
  text: θεὶς δὲ τὰ γόνατα ἔκραξεν φωνῇ μεγάλῃ· Κύριε, μὴ στήσῃς αὐτοῖς ⸂ταύτην τὴν ἁμαρτίαν⸃· καὶ τοῦτο εἰπὼν ἐκοιμήθη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/060.yaml
  text: Then[a], kneeling down, he cried out with a loud voice, “Lord, do not hold this sin against them.” And after saying this[b], he fell asleep.
translation:
  language: ru
  text: 'Затем он преклонил колени и громко воскликнул: «Господи, не вмени им этого греха!» Сказав это, он уснул[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть умер; в греческом тексте смерть выражена обычной метафорой сна.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὶς δὲ τὰ γόνατα
  choice: Затем он преклонил колени
  rationale: Греческая идиома буквально означает «положив колени»; русское «преклонил колени» естественно и точно передаёт действие. δέ отмечает следующий шаг повествования и передано словом «затем».
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: громко воскликнул
  rationale: Оборот обозначает сильный, громкий возглас. Сжатая русская формулировка сохраняет и действие, и указание на громкость, не звуча тяжеловесно.
- source_word: Κύριε
  choice: Господи
  rationale: Форма звательного обращения «Господи» естественна для молитвы и сохраняет κύριος как титул «Господь»; из контекста предыдущего стиха адресатом является Иисус.
- source_word: μὴ στήσῃς αὐτοῖς ταύτην τὴν ἁμαρτίαν
  choice: не вмени им этого греха
  rationale: Здесь ἵστημι имеет смысл поставить грех кому-либо в счёт. «Не вмени» сохраняет судебно-счётную образность и явное указание на «этот грех», оставаясь понятным в возвышенной молитвенной речи.
- source_word: καὶ τοῦτο εἰπὼν
  choice: Сказав это
  rationale: Деепричастный оборот естественно передаёт предшествующее сопутствующее действие без лишней временной экспликации.
- source_word: ἐκοιμήθη
  choice: он уснул
  rationale: Сохранена греческая метафора сна как обозначения смерти, а не заменена прямым «умер».
theological_decisions:
- issue: Метафорическое обозначение смерти ἐκοιμήθη
  choice: он уснул
  alternative: он умер
  rationale: Греческий текст намеренно говорит о смерти как о сне. Сохранение метафоры передаёт образ и богословскую тональность стиха, не добавляя толкования.
- issue: Обращение Κύριε в молитве Стефана
  choice: Господи
  alternative: Владыка
  rationale: «Господи» сохраняет устойчивый новозаветный титул κύριος и естественную форму молитвенного обращения; контекст связывает обращение с Иисусом.
- issue: Смысл μὴ στήσῃς αὐτοῖς ταύτην τὴν ἁμαρτίαν
  choice: не вмени им этого греха
  alternative: не взыщи с них за этот грех
  rationale: Выбранный вариант сохраняет образ постановки греха в счёт и не уточняет сверх текста, идёт ли речь преимущественно о вине, наказании или окончательном осуждении.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной сцены. «Преклонил колени» и «не вмени» несколько возвышенны, но общепонятны и соответствуют контексту. Единственная сноска поясняет сохранённую метафору смерти.
