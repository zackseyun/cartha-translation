  text: ἰδὼν εἶδον τὴν κάκωσιν τοῦ λαοῦ μου τοῦ ἐν Αἰγύπτῳ, καὶ τοῦ στεναγμοῦ ⸀αὐτοῦ ἤκουσα, καὶ κατέβην ἐξελέσθαι αὐτούς· καὶ νῦν δεῦρο ⸀ἀποστείλω σε εἰς Αἴγυπτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/034.yaml
  text: I have surely seen the mistreatment of my people in Egypt[a], and I have heard their groaning, and I have come down to deliver them. And now come[b], I will send you to Egypt.
translation:
  language: ru
  text: '«Я действительно увидел[a], как угнетают Мой народ в Египте, и слышал его стоны. Я сошёл, чтобы избавить их. А теперь иди: Я пошлю тебя в Египет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «увидев, Я увидел»; оборот выражает усиление: «Я действительно увидел».'
    reason: Передача семитского эмфатического оборота ἰδὼν εἶδον и сохранение доступа к форме оригинала.
lexical_decisions:
- source_word: ἰδὼν εἶδον
  choice: Я ясно видел
  rationale: Сочетание причастия и личной формы глагола передаёт семитское усиление и отсылает к Исх. 3:7. Наречие «ясно» естественно выражает подчёркнутую достоверность Божьего наблюдения, не воспроизводя буквально неестественное «увидев, увидел».
- source_word: κάκωσιν
  choice: как угнетают
  rationale: Существительное обозначает жестокое обращение, притеснение или угнетение. Глагольная конструкция звучит естественно по-русски и ясно показывает, что народ подвергается дурному обращению.
- source_word: λαοῦ μου τοῦ ἐν Αἰγύπτῳ
  choice: Мой народ в Египте
  rationale: Кратко и естественно передаёт принадлежность народа Богу и его местонахождение, сохраняя возможные заветные обертоны без дополнительного истолкования.
- source_word: τοῦ στεναγμοῦ αὐτοῦ
  choice: его стоны
  rationale: Греческое местоимение стоит в единственном числе и согласуется с собирательным «народом». Русское «его» сохраняет эту структуру, а «стоны» точно и естественно передаёт στεναγμός.
- source_word: κατέβην
  choice: Я сошёл
  rationale: Сохраняет аорист и антропоморфный образ Божьего нисхождения ради вмешательства, не объясняя его богословски и не сглаживая.
- source_word: ἐξελέσθαι
  choice: чтобы избавить
  rationale: Средний инфинитив ἐξαιρέω здесь означает освобождение или спасение из бедствия. «Избавить» соответствует достоинству регистра и не сужает смысл до физического спасения.
- source_word: δεῦρο
  choice: иди
  rationale: В данном контексте δεῦρο вводит повеление Моисею выступить для исполнения поручения. Русское «иди» естественно передаёт направленность последующего послания, хотя буквально возможно «подойди» или «давай».
- source_word: ἀποστείλω σε εἰς Αἴγυπτον
  choice: Я пошлю тебя в Египет
  rationale: Будущее изъявительное выражает прямое Божье поручение; «в Египет» — естественное русское обозначение направления.
theological_decisions:
- issue: Антропоморфное описание Божьего нисхождения
  choice: Я сошёл
  alternative: Я спустился / Я сошёл с небес
  rationale: Перевод сохраняет образ исходного текста без устранения антропоморфизма и без добавления отсутствующего в греческом указания «с небес».
- issue: Характер избавления народа
  choice: избавить их
  alternative: спасти их / вывести их
  rationale: «Избавить» сохраняет широкий смысл Божьего освобождения от угнетения. «Спасти» могло бы сильнее актуализировать богословскую терминологию, а «вывести» преждевременно уточнило бы способ избавления.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой Божьей речи. Синтаксис сделан естественным для устного цитирования; антропоморфный образ и собирательное единственное число при слове «народ» сохранены. Прописная буква в «Мой» следует принятой русской библейской типографической традиции.
