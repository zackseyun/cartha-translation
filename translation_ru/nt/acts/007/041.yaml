  text: καὶ ἐμοσχοποίησαν ἐν ταῖς ἡμέραις ἐκείναις καὶ ἀνήγαγον θυσίαν τῷ εἰδώλῳ, καὶ εὐφραίνοντο ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/041.yaml
  text: And in those days they made a calf and offered a sacrifice to the idol[b][a], and they were rejoicing in the works of their hands.
translation:
  language: ru
  text: В те дни они сделали тельца[a], принесли жертву этому идолу и радовались делам своих рук[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изготовили тельца».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «радовались тому, что сделали своими руками».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοσχοποίησαν
  choice: сделали тельца
  rationale: Глагол означает «сделать, изготовить тельца». Краткий и естественный перевод сохраняет прямоту греческого выражения, а последующее слово «идол» ясно указывает на назначение изваяния.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: в те дни
  rationale: Устойчивое и естественное временное выражение, точно соответствующее греческому обороту.
- source_word: ἀνήγαγον θυσίαν
  choice: принесли жертву
  rationale: В контексте жертвоприношения сочетание обозначает принесение жертвы. Русское выражение естественно передаёт культовое действие.
- source_word: τῷ εἰδώλῳ
  choice: этому идолу
  rationale: Артикль отсылает к только что упомянутому тельцу. Указательное «этому» делает связь ясной по-русски, а «идол» сохраняет отрицательную оценку слова εἴδωλον.
- source_word: εὐφραίνοντο
  choice: радовались
  rationale: Несовершенный вид русского глагола естественно передаёт продолжительный оттенок греческого имперфекта без тяжеловесной конструкции.
- source_word: ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν
  choice: делам своих рук
  rationale: Относительно буквальный перевод сохраняет библейский образ и полемическую направленность выражения; вариант с «тому, что сделали своими руками» дан в примечании.
theological_decisions:
- issue: Лексика идолопоклонства и риторическая сила
  choice: Передать εἴδωλον словом «идол» и сохранить выражение «дела своих рук».
  alternative: «изображение»; «то, что они сделали своими руками»
  rationale: Речь Стефана описывает идолопоклонство Израиля языком, созвучным Септуагинте и пророческому обличению. Такой перевод сохраняет богословскую остроту текста, не превращая его в нейтральное описание ремесла.
translation_notes:
  register: Современный литературный русский язык; фраза построена ясно и сдержанно. Выражение «дела своих рук» намеренно сохраняет возвышенно-библейский оттенок и межтекстовую связь с обличением идолопоклонства.
