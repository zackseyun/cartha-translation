  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐπαιδεύθη ⸀Μωϋσῆς πάσῃ σοφίᾳ Αἰγυπτίων, ἦν δὲ δυνατὸς ἐν λόγοις καὶ ἔργοις ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/022.yaml
  text: And Moses was educated in all the wisdom of the Egyptians, and he was mighty in his words and deeds.
translation:
  language: ru
  text: И Моисей был обучен всей мудрости египтян и был силён в своих словах и делах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в речи и поступках».'
    reason: Лексически допустимый более обобщённый перевод λόγοις καὶ ἔργοις.
lexical_decisions:
- source_word: ἐπαιδεύθη
  choice: был обучен
  rationale: Пассивная форма обозначает полученное Моисеем образование и подготовку; «был обучен» естественно передаёт это значение и не сужает его до единичного наставления.
- source_word: πάσῃ σοφίᾳ Αἰγυπτίων
  choice: всей мудрости египтян
  rationale: Дательный падеж передаёт содержание обучения, πάσῃ сохраняется как «всей», а Αἰγυπτίων — как относящаяся к египтянам мудрость.
- source_word: δυνατὸς
  choice: силён
  rationale: «Силён» естественно сочетается с последующим «в словах и делах» и передаёт значение способности и действенной силы без излишнего возвышения регистра.
- source_word: ἐν λόγοις καὶ ἔργοις αὐτοῦ
  choice: в своих словах и делах
  rationale: Возвратное притяжательное местоимение естественно указывает на Моисея как субъект; пара «слова и дела» сохраняет риторический баланс греческого выражения.
theological_decisions:
- issue: Соотношение характеристики Моисея как сильного в словах с Исх. 4:10
  choice: «был силён в своих словах и делах» без гармонизирующего пояснения
  alternative: Ослабить выражение до способности или истолковать его лишь как общественную репутацию и результативность
  rationale: Высказывание Стефана передано на его собственных условиях. Напряжение с признанием Моисея в Исх. 4:10 не следует устранять переводческой парафразой.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью; синтаксис близок к греческому, но остаётся естественным и понятным.
