  yaml_path: translation/nt/acts/007/050.yaml
  text: Did not my hand make all these things?[a][b]
translation:
  language: ru
  text: Разве не Моя рука сотворила всё это?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более динамично: «Разве не Я сотворил всё это?»'
    reason: lexical_alternative
  - marker: b
    text: Эти слова перекликаются с Исаией 66:2.
    reason: cross_reference
lexical_decisions:
- source_word: οὐχὶ
  choice: Разве не
  rationale: Частица вводит риторический вопрос, предполагающий утвердительный ответ; «разве не» естественно передаёт эту силу по-русски.
- source_word: ἡ χείρ μου
  choice: Моя рука
  rationale: Сохранён конкретный антропоморфный образ «руки», важный для цитаты из Исаии 66:2, без замены на толкования «сила» или «Я Сам».
- source_word: ἐποίησεν
  choice: сотворила
  rationale: В контексте Божьего созидания «сотворила» точно и достойно передаёт ποιέω; форма согласована с существительным «рука».
- source_word: ταῦτα πάντα
  choice: всё это
  rationale: Естественное русское выражение сохраняет и указательное значение ταῦτα, и всеохватность πάντα.
theological_decisions:
- issue: Антропоморфное выражение о Боге
  choice: Сохранить «Моя рука» как образ Божьего созидательного действия
  alternative: 'Передать динамически: «Разве не Я сотворил всё это?»'
  rationale: Буквальный образ поддерживает связь с Исаией 66:2 и сохраняет риторическую выразительность, не превращая метафору в отвлечённое богословское объяснение.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, торжественная и понятная. Местоимение «Моя» написано с прописной буквы как уважительное обозначение Бога.
