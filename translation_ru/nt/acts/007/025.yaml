  text: ἐνόμιζεν δὲ συνιέναι τοὺς ⸀ἀδελφοὺς ὅτι ὁ θεὸς διὰ χειρὸς αὐτοῦ δίδωσιν ⸂σωτηρίαν αὐτοῖς⸃, οἱ δὲ οὐ συνῆκαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/025.yaml
  text: He supposed that his brothers understood that God was giving them deliverance through his hand[b][a], but they did not understand.
translation:
  language: ru
  text: 'Он полагал, что его братья[a] понимают: Бог его рукой дарует им избавление[b]. Но они не поняли.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Братья» — соплеменники Моисея, израильтяне; в греческом тексте употреблено существительное мужского рода во множественном числе.
    reason: cultural_note
  - marker: b
    text: 'Или: «спасение». Греческое слово может означать спасение, избавление или освобождение; здесь ближайший контекст указывает на избавление Израиля, совершённое Богом через Моисея.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνόμιζεν
  choice: полагал
  rationale: Имперфект описывает представление Моисея как фоновое ожидание; «полагал» естественно передаёт это значение без добавления отсутствующего в греческом тексте временного маркера.
- source_word: συνιέναι / συνῆκαν
  choice: понимают / не поняли
  rationale: Повтор одного корня сохраняет намеренный контраст греческого текста между ожиданием Моисея и действительной реакцией израильтян.
- source_word: ἀδελφοὺς
  choice: братья
  rationale: Сохраняется мужское множественное число и родственная метафора, относящаяся здесь к соплеменникам Моисея, израильтянам.
- source_word: διὰ χειρὸς αὐτοῦ
  choice: его рукой
  rationale: Русский инструментальный оборот естественно передаёт образ руки как средства Божьего действия и не сводит выражение к менее образному «через него».
- source_word: δίδωσιν
  choice: дарует
  rationale: Настоящее время греческого глагола сохранено в косвенной речи; «дарует» передаёт действие Бога и звучит естественно в данном высоком, но понятном регистре.
- source_word: σωτηρίαν
  choice: избавление
  rationale: В ближайшем контексте речь идёт о конкретном освобождении Израиля от угнетения через Моисея. «Избавление» сохраняет этот исторический смысл, не исключая более широкого мотива спасения.
theological_decisions:
- issue: Значение σωτηρία в рассказе о Моисее
  choice: избавление
  alternative: спасение
  rationale: Контекст указывает прежде всего на Божье освобождение Израиля из угнетения. Основной текст не сужает выражение до преимущественно духовного смысла современного слова «спасение», а сноска сохраняет допустимую богословски значимую альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Двоеточие ясно вводит содержание понимания, а отдельное заключительное предложение подчёркивает контраст. Формулировка сохраняет образ руки и повтор глагола «понимать».
