  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τοῦτον τὸν Μωϋσῆν, ὃν ἠρνήσαντο εἰπόντες· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστήν, τοῦτον ὁ θεὸς ⸀καὶ ἄρχοντα καὶ λυτρωτὴν ⸂ἀπέσταλκεν σὺν⸃ χειρὶ ἀγγέλου τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/035.yaml
  text: This Moses[a], whom they rejected, saying, ‘Who appointed you a ruler and a judge?’—this man God sent as both ruler and redeemer by the hand of the angel who appeared to him in the bush.
translation:
  language: ru
  text: 'Этого Моисея, которого они отвергли, сказав: «Кто поставил тебя правителем и судьёй?» — именно его Бог послал как правителя и избавителя[a] рукою ангела, явившегося ему в терновом кусте.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «освободителя»; возможен также перевод «искупителя». Греческое слово обозначает того, кто приносит избавление, освобождение или искупление.'
    reason: Лексическая многозначность λυτρωτής и его богословски значимый оттенок.
lexical_decisions:
- source_word: ἠρνήσαντο
  choice: отвергли
  rationale: В контексте речь идёт об отказе признать власть Моисея, а не просто о словесном отрицании.
- source_word: κατέστησεν
  choice: поставил
  rationale: Глагол обозначает наделение положением и властью; «поставил» естественно звучит в вопросе и сохраняет связь с должностью.
- source_word: ἄρχοντα
  choice: начальником
  rationale: Слово обозначает человека, облечённого властью. Этот перевод подходит к исходному вопросу и сохраняет намеренный повтор далее в стихе.
- source_word: δικαστήν
  choice: судьёй
  rationale: Прямой и ясный эквивалент названия того, кто вершит суд.
- source_word: λυτρωτὴν
  choice: избавителя
  rationale: В данном повествовательном контексте Моисей выступает посланным Богом освободителем народа. «Избавитель» сохраняет смысл освобождения и не сужает слово до одного богословского оттенка.
- source_word: ἀπέσταλκεν
  choice: послал
  rationale: Русское прошедшее время естественно передаёт совершённое Божье действие в повествовательном обзоре.
- source_word: σὺν χειρὶ
  choice: рукою
  rationale: Сохранён библейский образ руки как посредства действия; здесь он указывает на посредническое участие ангела.
- source_word: ἀγγέλου
  choice: ангела
  rationale: В рассказе о терновом кусте речь идёт о небесном посланнике; «ангел» является обычным и контекстуально точным соответствием.
- source_word: τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ
  choice: явившегося ему в терновом кусте
  rationale: Пассивная по форме конструкция идиоматически означает явление. «Терновый куст» передаёт βάτος, не добавляя отсутствующего здесь определения «горящий».
- source_word: Τοῦτον ... τοῦτον
  choice: Этого ... именно его
  rationale: Так сохраняется риторически значимое повторное указание на того же Моисея, которого люди отвергли, а Бог послал.
- source_word: καὶ ἄρχοντα καὶ λυτρωτὴν
  choice: как начальника и избавителя
  rationale: Парная конструкция представляет две данные Богом роли Моисея; русский союз «и» передаёт их соединение без тяжеловесного повтора.
theological_decisions:
- issue: Передача λυτρωτής в описании спасительной роли Моисея
  choice: избавитель
  alternative: искупитель; освободитель
  rationale: «Избавитель» естественно описывает Моисея как того, через кого Бог вывел народ из рабства, и при этом сохраняет широкий смысл освобождения. Вариант «искупитель» возможен по лексическому родству с языком выкупа и искупления, но в современном русском способен создать более узкое богословское отождествление, которого само слово в этом контексте не требует.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Оборот «рукою ангела» намеренно сохраняет образность оригинала; усиление повторного указательного местоимения передано словами «именно его».
