  text: τῇ τε ἐπιούσῃ ἡμέρᾳ ὤφθη αὐτοῖς μαχομένοις καὶ ⸀συνήλλασσεν αὐτοὺς εἰς εἰρήνην εἰπών· Ἄνδρες, ἀδελφοί ⸀ἐστε· ἱνατί ἀδικεῖτε ἀλλήλους;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/026.yaml
  text: And on the following day he appeared to them as they were fighting and was trying to reconcile them to peace[a], saying, ‘Men, you are brothers[b]; why are you wronging one another?’
translation:
  language: ru
  text: 'На следующий день он явился им, когда они дрались, и пытался примирить их, говоря: «Мужчины, вы братья; почему вы поступаете друг с другом несправедливо?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ τε ἐπιούσῃ ἡμέρᾳ
  choice: На следующий день
  rationale: Естественно передаёт временной дательный оборот и последовательность повествования.
- source_word: ὤφθη αὐτοῖς
  choice: он появился перед ними
  rationale: Пассивная форма ὁράω здесь имеет обычное повествовательное значение «появился»; «перед ними» естественно передаёт дательный αὐτοῖς.
- source_word: αὐτοῖς μαχομένοις
  choice: когда они дрались
  rationale: Обстоятельственный причастный оборот обозначает продолжавшуюся в тот момент физическую схватку.
- source_word: συνήλλασσεν αὐτοὺς εἰς εἰρήνην
  choice: пытался привести их к миру
  rationale: Передаёт направленность εἰς εἰρήνην и вероятное значение попытки у имперфекта, не скрывая в сноске возможного прочтения как продолжающегося действия.
- source_word: Ἄνδρες, ἀδελφοί ἐστε
  choice: Мужи, вы же братья!
  rationale: «Мужи» сохраняет прямое обращение к двум мужчинам, а частица «же» естественно выражает заложенный в обращении призыв помнить об их братстве.
- source_word: ἱνατί ἀδικεῖτε ἀλλήλους
  choice: Почему вы поступаете несправедливо друг с другом?
  rationale: Сохраняет этико-правовой оттенок ἀδικέω и взаимное значение ἀλλήλους, не сужая смысл до телесного вреда или личной обиды.
