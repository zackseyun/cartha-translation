  text: εἶπεν δὲ αὐτῷ ὁ κύριος· Λῦσον τὸ ὑπόδημα τῶν ποδῶν σου, ὁ γὰρ τόπος ⸀ἐφ’ ᾧ ἕστηκας γῆ ἁγία ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/033.yaml
  text: Then the Lord said to him[a], ‘Take off the sandals from your feet, for the place on which you are standing is holy ground.’
translation:
  language: ru
  text: 'Тогда Господь сказал ему: «Сними обувь с ног[a], потому что место, на котором ты стоишь, — святая земля».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Развяжи сандалию с ног твоих».'
    reason: 'Лексическая альтернатива: λύω буквально означает «развязать, освободить», тогда как в контексте подразумевается снятие обуви; греческое ὑπόδημα стоит в единственном числе.'
lexical_decisions:
- source_word: κύριος
  choice: Господь
  rationale: Обычное и почтительное соответствие греческому титулу κύριος; не вводит в текст особого оформления ветхозаветного имени Бога, которого в греческом стихе нет.
- source_word: Λῦσον
  choice: сними
  rationale: Буквально глагол означает «развяжи, освободи», но применительно к обуви естественно передаёт требуемое действие как «сними».
- source_word: τὸ ὑπόδημα
  choice: обувь
  rationale: Греческое слово стоит в единственном числе и обозначает предмет обуви. Русское собирательное «обувь» естественно сочетается с множественным «с ног» и не вносит неуместного утверждения, будто речь идёт только об одной сандалии.
- source_word: τῶν ποδῶν σου
  choice: с ног
  rationale: Сохраняется греческое множественное число «ног», а принадлежность в русском ясно выражена обращением к собеседнику.
- source_word: ὁ γὰρ τόπος
  choice: потому что место
  rationale: «Место» прямо передаёт τόπος, а «потому что» естественно выражает пояснительное γάρ.
- source_word: ἐφ’ ᾧ
  choice: на котором
  rationale: Сохраняет значение предлога ἐπί и относительную конструкцию исходного текста.
- source_word: ἕστηκας
  choice: ты стоишь
  rationale: Перфект здесь обозначает наличное состояние; по-русски оно естественно передаётся настоящим временем.
- source_word: γῆ ἁγία
  choice: святая земля
  rationale: В данном локальном контексте γῆ означает землю под ногами; русское «святая земля» точно и естественно передаёт именную часть сказуемого.
theological_decisions:
- issue: Передача κύριος в цитате о явлении Бога Моисею
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Греческий текст содержит κύριος, а не тетраграмматон. «Господь» сохраняет богословскую значимость титула и не добавляет отсутствующего в исходном тексте типографического различения.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Реплика ясна обычному читателю; конструкция «место, на котором ты стоишь» сохраняет формальную структуру греческого текста, не становясь неестественной.
