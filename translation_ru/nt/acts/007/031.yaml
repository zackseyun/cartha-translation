  text: ὁ δὲ Μωϋσῆς ἰδὼν ⸀ἐθαύμασεν τὸ ὅραμα. προσερχομένου δὲ αὐτοῦ κατανοῆσαι ἐγένετο φωνὴ ⸀κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/031.yaml
  text: 'When Moses saw it[a], he marveled at the sight. And as he came near to look closely[c][b], a voice of the Lord came:'
translation:
  language: ru
  text: 'Увидев это, Моисей изумился этому явлению[a]. Когда же он подошёл, чтобы рассмотреть его поближе, раздался голос[b] Господа[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «видению». Греческое слово может обозначать как видимое явление, так и видение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «возник голос»; возможно также: «послышался голос».'
    reason: lexical_alternative
  - marker: c
    text: В греческом тексте здесь стоит «Господь» (κύριος). Из-за связи с Исходом 3 возможно интерпретирующее написание «ГОСПОДЬ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: увидев это
  rationale: Аористное причастие обозначает действие, предшествующее основному; «увидев это» естественно передаёт временную связь и отсылает к явлению, описанному в контексте.
- source_word: ἐθαύμασεν
  choice: изумился
  rationale: Глагол выражает сильное удивление; «изумился» звучит естественно и сохраняет возвышенный повествовательный тон.
- source_word: τὸ ὅραμα
  choice: этому зрелищу
  rationale: ὅραμα может обозначать видимое явление или видение. Здесь Моисей реагирует на горящий куст как на наблюдаемое явление, поэтому «зрелище» уместно в основном тексте, а «видение» сохранено в сноске.
- source_word: προσερχομένου
  choice: когда же он подошёл
  rationale: Родительный самостоятельный оборот передаёт временное сопутствующее обстоятельство; русская придаточная конструкция ясно выражает приближение Моисея.
- source_word: κατανοῆσαι
  choice: чтобы рассмотреть его поближе
  rationale: Глагол означает внимательно заметить или рассмотреть. Такая формулировка естественна в данном зрительном контексте.
- source_word: ἐγένετο φωνὴ
  choice: раздался голос
  rationale: Греческая событийная конструкция вводит появление голоса. «Раздался голос» — естественный русский эквивалент, не меняющий участника действия.
- source_word: κυρίου
  choice: Господа
  rationale: κύριος передано обычным титулом «Господь». Родительный падеж обусловлен сочетанием «голос Господа».
theological_decisions:
- issue: Передача κύριος в контексте богоявления
  choice: Господа
  alternative: ГОСПОДА
  rationale: В греческом тексте стоит κύριος, а не еврейский тетраграмматон. Поэтому основной текст передаёт форму как «Господь», не подменяя её интерпретирующим написанием «ГОСПОДЬ», хотя контекст явно перекликается с Исходом 3.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Синтаксис сделан плавным и понятным; неоднозначность ὅραμα и особенность передачи κύριος сохранены в сносках.
