  text: τότε ἐξελθὼν ἐκ γῆς Χαλδαίων κατῴκησεν ἐν Χαρράν. κἀκεῖθεν μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ μετῴκισεν αὐτὸν εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/004.yaml
  text: Then, after he had gone out from the land of the Chaldeans, he settled in Haran. And from there, after his father died, God moved him into this land in which you now live,
translation:
  language: ru
  text: Тогда, выйдя из земли халдеев, он поселился в Харране. А оттуда, после смерти его отца, Бог переселил его[a] в эту землю, где вы теперь живёте[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он переселил его». В греческом тексте подлежащее прямо не названо, хотя из контекста следует, что речь идёт о Боге.'
    reason: lexical_alternative
  - marker: b
    text: Стефан говорит, что это переселение произошло после смерти отца Авраама. Сопоставьте Бытие 11:32; 12:4, где изложена связанная с этим хронология.
    reason: cross_reference
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественный временной связующий элемент, вводящий следующее событие в повествовании Стефана.
- source_word: ἐξελθὼν ἐκ γῆς Χαλδαίων
  choice: выйдя из земли халдеев
  rationale: Деепричастный оборот передаёт предшествующее действие аористного причастия и сохраняет полное географическое выражение.
- source_word: κατῴκησεν ἐν Χαρράν
  choice: он поселился в Харране
  rationale: «Поселился» передаёт начало проживания и звучит естественно в современном русском языке.
- source_word: κἀκεῖθεν
  choice: А оттуда
  rationale: Передаёт оба элемента сращения καί + ἐκεῖθεν и естественно связывает части повествования.
- source_word: μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ
  choice: после смерти его отца
  rationale: Ясно и кратко выражает временное отношение, заданное конструкцией μετά с субстантивированным инфинитивом.
- source_word: μετῴκισεν αὐτὸν
  choice: Бог переселил его
  rationale: μετοικίζω означает побудить к переселению или переселить. Контекст указывает на Бога как на подразумеваемого деятеля, однако его имя в самом греческом предложении не выражено, что отмечено в сноске.
- source_word: εἰς τὴν γῆν ταύτην
  choice: в эту землю
  rationale: Предлог «в» с винительным падежом передаёт направленное движение, а «землю» соответствует γῆ.
- source_word: εἰς ἣν ὑμεῖς νῦν κατοικεῖτε
  choice: где вы теперь живёте
  rationale: Естественный современный русский эквивалент относительной конструкции со значением местонахождения.
theological_decisions:
- issue: Подразумеваемое подлежащее при μετῴκισεν
  choice: 'В основном тексте уточнить подлежащее: «Бог переселил его», снабдив выражение сноской.'
  alternative: «Он переселил его» без уточнения подлежащего.
  rationale: В греческом тексте подлежащее прямо не названо, но ближайший широкий контекст речи указывает на Бога. Сноска сохраняет формальную неоднозначность исходного выражения.
- issue: Хронологическая связь со смертью Фарры
  choice: 'Передать последовательность буквально: переселение произошло после смерти отца Авраама.'
  alternative: Переформулировать стих ради согласования с возможным прочтением хронологии Бытия.
  rationale: Перевод сохраняет утверждение Стефана без скрытой гармонизации и отмечает связанные места Писания в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным стилем. Сохранены географическое выражение «земля халдеев», временная последовательность исходного текста и завершающая запятая, поскольку стих синтаксически продолжается далее.
