lexical_decisions:
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Естественное для современного русского языка восклицание, привлекающее внимание и передающее непосредственность слов Стефана.
- source_word: θεωρῶ
  choice: я вижу
  rationale: Настоящее время передаёт продолжающееся восприятие; простое «вижу» естественно звучит в контексте видения.
- source_word: τοὺς οὐρανοὺς
  choice: небеса
  rationale: Сохраняется множественное число греческого текста и возвышенный, богословски значимый регистр.
- source_word: διηνοιγμένους
  choice: раскрытыми
  rationale: Предикативная форма передаёт состояние небес как уже открытых вследствие совершившегося действия, не перегружая фразу.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Сына Человеческого
  rationale: Традиционная буквальная передача сохраняет узнаваемый мессианский титул и связь с Дан 7:13.
- source_word: ἐκ δεξιῶν
  choice: по правую руку
  rationale: Сохраняет библейскую идиому, обозначающую почётное место и власть, оставаясь понятной современному читателю.
- source_word: ἑστῶτα
  choice: стоящего
  rationale: Точно сохраняет явно указанную позу и не гармонизирует стих с местами, где Христос представлен сидящим.
- source_word: τοῦ θεοῦ
  choice: от Бога
  rationale: В сочетании «по правую руку от Бога» это естественная русская конструкция, точно обозначающая положение рядом с Богом.
theological_decisions:
- issue: Христологический титул υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  alternative: Человек / Сын человека
  rationale: Каноническая форма сохраняет значение устойчивого титула, его мессианское звучание и отсылку к Дан 7:13, не сводя выражение лишь к указанию на человеческую природу.
- issue: Поза возвышенного Иисуса
  choice: стоящего по правую руку от Бога
  alternative: находящегося по правую руку от Бога
  rationale: Греческий текст прямо говорит, что Сын Человеческий стоит. Эта деталь сохранена, несмотря на богословское напряжение с более частым образом Христа, сидящего по правую руку Бога.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Вот» передаёт живую непосредственность возгласа; «небеса» и «по правую руку» сохраняют межтекстовые и богословские связи. Маркеры сносок размещены непосредственно после выражений, к которым относятся.
