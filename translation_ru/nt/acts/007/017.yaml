  yaml_path: translation/nt/acts/007/017.yaml
  text: But as the time of the promise that God had made to Abraham was drawing near[a], the people increased and multiplied in Egypt,
translation:
  language: ru
  text: Но когда приближалось время исполнения обещания, которое Бог дал Аврааму[a], народ в Египте рос и умножался.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которое Бог обещал Аврааму»; возможно также: «которое Бог подтвердил Аврааму». Употреблённый здесь греческий глагол может обозначать открыто заявленное обязательство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς δὲ
  choice: Но когда
  rationale: Καθώς вводит временное придаточное, а δέ обозначает мягкий переход; сочетание «но когда» естественно передаёт ход речи, не усиливая противопоставление.
- source_word: ἤγγιζεν ὁ χρόνος τῆς ἐπαγγελίας
  choice: приближалось время исполнения обещания
  rationale: Имперфект ἤγγιζεν передаёт продолжающееся приближение. Добавление «исполнения» естественно выражает подразумеваемый срок осуществления обещанного и не превращает χρόνος в более специальное «назначенный срок».
- source_word: ἧς ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ
  choice: которое Бог дал Аврааму
  rationale: В данном сочетании ὁμολογέω обозначает объявленное обязательство. Русское «дать обещание» ясно и естественно, тогда как «поклялся» неоправданно вводило бы более сильный смысл клятвы.
- source_word: ηὔξησεν ὁ λαὸς καὶ ἐπληθύνθη
  choice: народ … рос и умножался
  rationale: «Рос» передаёт ηὔξησεν, а «умножался» — ἐπληθύνθη, сохраняя различие двух глаголов и коллективное значение λαός.
- source_word: ἐν Αἰγύπτῳ
  choice: в Египте
  rationale: Прямое и естественное обозначение места; в русском предложении обстоятельство поставлено рядом с подлежащим.
theological_decisions:
- issue: Значение ὡμολόγησεν применительно к Божьему обещанию Аврааму
  choice: «обещание, которое Бог дал Аврааму»
  alternative: «обещание, которое Бог обещал Аврааму»; «обещание, которое Бог подтвердил Аврааму»
  rationale: Основной вариант передаёт объявленное Богом обязательство естественным русским оборотом и не усиливает его до клятвы. Смысл исполнения Божьего обещания сохраняется без добавления конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка понятна широкому читателю; архаизмы и искусственное повторение однокоренных слов в основном тексте устранены.
