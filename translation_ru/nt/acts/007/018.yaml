  yaml_path: translation/nt/acts/007/018.yaml
  text: until another king arose over Egypt[b][a], who did not know Joseph.
translation:
  language: ru
  text: пока не воцарился над Египтом другой царь[a], который не знал Иосифа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «встал»; по смыслу также: «пришёл к власти над Египтом».'
    reason: lexical_alternative
  - marker: b
    text: Слова «не знал Иосифа» могут также подразумевать, что царь не признавал Иосифа или не считался с ним.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι οὗ
  choice: пока не
  rationale: Оборот обозначает временной предел продолжавшегося положения; «пока не» естественно передаёт переход к новому событию.
- source_word: ἀνέστη
  choice: воцарился
  rationale: В контексте появления нового царя глагол означает приход к власти. «Воцарился» естественно передаёт этот смысл по-русски; буквальный образ «встал» отмечен в сноске.
- source_word: βασιλεὺς
  choice: царь
  rationale: Прямой лексический эквивалент, соответствующий историческому контексту.
- source_word: ἕτερος
  choice: другой
  rationale: Указывает на царя, отличного от прежнего; «другой» передаёт это без избыточного толкования.
- source_word: ἐπ’ Αἴγυπτον
  choice: над Египтом
  rationale: В сочетании с обозначением царя предлог выражает власть над территорией.
- source_word: οὐκ ᾔδει
  choice: не знал
  rationale: Сохраняет прямое значение οἶδα и не устраняет возможный контекстуальный оттенок непризнания или пренебрежения.
- source_word: τὸν Ἰωσήφ
  choice: Иосифа
  rationale: Традиционная и общепринятая русская форма библейского имени в требуемом падеже.
theological_decisions:
- issue: Смысл выражения «не знал Иосифа»
  choice: Сохранена буквальная формулировка «не знал»
  alternative: «не признавал Иосифа» или «не считался с Иосифом»
  rationale: Греческий текст допускает прагматический оттенок непризнания, но прямо его не выражает; буквальный вариант сохраняет смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Воцарился» ясно и кратко передаёт политический контекст, а сноски сохраняют буквальный образ и смысловую неоднозначность оригинала.
