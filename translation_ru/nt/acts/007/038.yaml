  naturalness: Текст в целом естественный для современного литературного русского. Конструкция «был в собрании в пустыне» допустима и близка к оригиналу; разделение на два предложения не нарушает смысловой связи.
  terminology: «Собрание» удачно передаёт ἐκκλησία без анахроничного институционального значения «церковь». «Ангел», «гора Синай», «наши отцы» и «живые изречения» верно отражают исходные термины. Следует убрать невыраженное в оригинале «Божьи».
