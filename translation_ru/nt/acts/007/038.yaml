source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ γενόμενος ἐν τῇ ἐκκλησίᾳ ἐν τῇ ἐρήμῳ μετὰ τοῦ ἀγγέλου τοῦ λαλοῦντος αὐτῷ ἐν τῷ ὄρει Σινᾶ καὶ τῶν πατέρων ἡμῶν, ὃς ἐδέξατο ⸀λόγια ζῶντα δοῦναι ⸀ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/038.yaml
  text: This is the one who was in the assembly in the wilderness with the angel who was speaking to him on Mount Sinai[a], and with our fathers[c][b]; he received living oracles to give to us.
translation:
  language: ru
  text: Это тот, кто был в собрании[a] в пустыне вместе с ангелом, говорившим с ним на горе Синай, и с нашими отцами[b]. Он принял живые изречения[c], чтобы дать их нам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «общине»; традиционный перевод — «церкви в пустыне».
    reason: alternative_reading
  - marker: b
    text: '«Наши отцы» — израильские праотцы; возможно также: «наши предки».'
    reason: lexical_alternative
  - marker: c
    text: 'Или «живые слова»; возможно также: «животворные изречения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ γενόμενος
  choice: тот, кто был
  rationale: Идиоматично передаёт участие и присутствие Моисея в описываемом событии, не добавляя прямо отсутствующего в стихе имени.
- source_word: ἐκκλησίᾳ
  choice: собрании
  rationale: Передаёт здесь собранный народ Израиля и не привносит более поздних институциональных ассоциаций слова «церковь».
- source_word: ἐρήμῳ
  choice: пустыне
  rationale: Обычное библейское обозначение местности странствования Израиля; естественнее и шире, чем «безводная пустыня».
- source_word: ἀγγέλου
  choice: ангелом
  rationale: В контексте Синая речь идёт о небесном посланнике, поэтому «ангел» точнее общего слова «вестник».
- source_word: λαλοῦντος
  choice: говорившим
  rationale: Причастная форма естественно передаёт действие ангела по отношению к Моисею, сохраняя процессуальный оттенок греческого настоящего причастия.
- source_word: ὄρει Σινᾶ
  choice: горе Синай
  rationale: Нормативная и узнаваемая русская форма географического названия.
- source_word: τῶν πατέρων ἡμῶν
  choice: нашими отцами
  rationale: Сохраняет прямую мужскую форму греческого выражения и традиционное обозначение израильских праотцов.
- source_word: ἐδέξατο
  choice: принял
  rationale: Точно и естественно обозначает получение Моисеем данного Богом откровения.
- source_word: λόγια
  choice: Божьи изречения
  rationale: «Изречения» сохраняет значение авторитетных речений откровения; добавление «Божьи» делает подразумеваемый сакральный смысл понятным современному читателю, не превращая их в обычные слова.
- source_word: ζῶντα
  choice: живые
  rationale: Прямо сохраняет образность и богословскую ёмкость оригинала, не сужая смысл до интерпретации «дающие жизнь».
- source_word: δοῦναι
  choice: чтобы передать
  rationale: Ясно выражает цель получения изречений Моисеем и в русском контексте естественнее повторного «дать».
- source_word: ἡμῖν
  choice: нам
  rationale: Сохраняет отождествление Стефана и его слушателей с народом, которому было передано откровение.
theological_decisions:
- issue: Следует ли переводить ἐκκλησίᾳ словом «церковь» применительно к Израилю в пустыне
  choice: собрание
  alternative: община; церковь
  rationale: Контекст говорит о собранном народе Израиля. «Собрание» сохраняет основное значение слова, не предрешая экклезиологического отождествления Израиля с позднейшей церковью.
- issue: Следует ли истолковывать λόγια ζῶντα как «слова, дающие жизнь»
  choice: живые Божьи изречения
  alternative: живые слова; животворные изречения
  rationale: 'Буквальный образ «живые» сохраняет смысловую напряжённость оригинала: речения могут мыслиться как обладающие жизнью, действенные или дающие жизнь, но перевод не выбирает молча только одно из этих пониманий.'
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис разделён на два предложения для ясности, при сохранении логической связи оригинала. Термин «собрание» избегает анахроничного институционального оттенка, а «живые Божьи изречения» сохраняет сакральность и образность выражения.
