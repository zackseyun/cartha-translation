lexical_decisions:
- source_word: κατέβη
  choice: сошёл
  rationale: Сохраняет направительное значение καταβαίνω и традиционный географический образ движения в Египет как движения вниз.
- source_word: Ἰακώβ
  choice: Иаков
  rationale: Устоявшаяся русская библейская форма личного имени.
- source_word: εἰς Αἴγυπτον
  choice: в Египет
  rationale: Естественно передаёт движение внутрь страны, выраженное предлогом εἰς.
- source_word: ἐτελεύτησεν
  choice: умер
  rationale: Прямой и ясный современный эквивалент глагола τελευτάω без эвфемизации.
- source_word: αὐτὸς
  choice: он
  rationale: Сохраняет явно выраженное греческое местоимение и выделяет Иакова перед добавлением остальных праотцов.
- source_word: οἱ πατέρες ἡμῶν
  choice: наши отцы
  rationale: Буквально и контекстуально передаёт обозначение праотцов Израиля; возможное пояснение «предки» вынесено в сноску.
theological_decisions:
- issue: Передача πατέρες в рассказе об истории Израиля
  choice: наши отцы
  alternative: наши предки
  rationale: Мужской род и семейно-исторический образ исходного выражения сохранены без сведения его к более общему обозначению предков.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. «Там» добавлено для естественной русской связи двух предложений и не меняет смысла: смерть Иакова и отцов соотносится с Египтом в непосредственном контексте.'
