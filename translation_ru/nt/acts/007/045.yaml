source:
  edition: SBLGNT
  text: ἣν καὶ εἰσήγαγον διαδεξάμενοι οἱ πατέρες ἡμῶν μετὰ Ἰησοῦ ἐν τῇ κατασχέσει τῶν ἐθνῶν ὧν ἐξῶσεν ὁ θεὸς ἀπὸ προσώπου τῶν πατέρων ἡμῶν ἕως τῶν ἡμερῶν Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/045.yaml
  text: which our fathers in turn brought in with Joshua at the dispossession of the nations that God drove out from before our fathers[b][a], until the days of David.
translation:
  language: ru
  text: Её также внесли наши отцы, получив её по преемству[a], вместе с Иисусом Навином[b], при завоевании народов, которых Бог изгнал от лица наших отцов, — до дней Давида.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «получив её в порядке преемства». Причастие подчёркивает, что скиния перешла к следующему поколению.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте буквально: «с Иисусом»; греческое имя Ἰησοῦς может обозначать как Иисуса, так и Иисуса Навина. Здесь имеется в виду Иисус Навин, сын Нуна.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: Её
  rationale: Относительное местоимение женского рода отсылает к скинии свидетельства в предыдущем стихе; в русском самостоятельное «её» естественно продолжает длинную греческую конструкцию.
- source_word: εἰσήγαγον
  choice: внесли
  rationale: Передаёт внесение скинии в землю; глагол движения с приставкой «в-» соответствует εἰσάγω.
- source_word: διαδεξάμενοι
  choice: приняв её по преемству
  rationale: Сохраняет как идею получения от предшественников, так и последовательную смену поколений, не сводя причастие лишь к расплывчатому «в свою очередь».
- source_word: οἱ πατέρες ἡμῶν
  choice: наши отцы
  rationale: Сохраняет повторяющуюся в речи Стефана библейскую и историко-заветную формулу.
- source_word: μετὰ Ἰησοῦ
  choice: вместе с Иисусом Навином
  rationale: В контексте вступления Израиля в землю Ἰησοῦ обозначает Иисуса Навина; добавление «Навином» предотвращает ошибочное отнесение к Иисусу Христу.
- source_word: ἐν τῇ κατασχέσει τῶν ἐθνῶν
  choice: когда вступили во владение землёй народов
  rationale: κατάσχεσις означает овладение или владение. Уточнение «землёй» выражает подразумеваемый объект владения и избегает неестественного смысла «владеть народами».
- source_word: ὧν ἐξῶσεν ὁ θεὸς
  choice: которых Бог изгнал
  rationale: Относительное местоимение относится к народам, а ἐξωθέω означает вытеснить или изгнать.
- source_word: ἀπὸ προσώπου τῶν πατέρων ἡμῶν
  choice: от лица наших отцов
  rationale: Сохраняет семитизированный библейский оборот и повтор выражения «наши отцы».
- source_word: ἕως τῶν ἡμερῶν Δαυίδ
  choice: до дней Давида
  rationale: Формально передаёт временную границу и сохраняет связь со следующим стихом; для ясности в русском она оформлена отдельным предложением с восстановленным референтом — скинией.
theological_decisions:
- issue: Референт Ἰησοῦ
  choice: Иисус Навин
  alternative: Иисус
  rationale: Греческая форма имени может обозначать обоих, но исторический контекст после Моисея однозначно указывает на Иисуса Навина. Примечание сохраняет языковую неоднозначность формы.
- issue: Смысл διαδεξάμενοι
  choice: отцы получили скинию от предшествующего поколения и внесли её в землю
  alternative: отцы просто действовали «в свою очередь»
  rationale: Причастие выражает преемственное получение; перевод не должен устранять эту смысловую составляющую.
- issue: Синтаксическое присоединение ἕως τῶν ἡμερῶν Δαυίδ
  choice: скиния оставалась там до дней Давида
  alternative: изгнание народов продолжалось до дней Давида
  rationale: Греческая фраза допускает формальное присоединение к ближайшей части предложения, но ход рассказа и следующий стих естественнее связывают временную границу с присутствием скинии. Восстановление этого смысла делает русский текст понятным, не превращая альтернативу в отдельное учение.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Наши отцы», «от лица» и «до дней Давида» сохраняют риторический строй речи Стефана; синтаксис разделён на два предложения ради ясности.
