  source_fidelity: 'Нужна правка. В тексте необоснованно добавлено «Она оставалась там»: место «там» отсутствует в оригинале, а развернутое отдельное утверждение чрезмерно закрепляет синтаксическое присоединение ἕως τῶν ἡμερῶν Δαυίδ. Кроме того, «сын Навина» в примечании исторически неверно: Иисус Навин — сын Нуна. Оборот о κατάσχεσις лучше передать без добавления отсутствующего в греческом слова «землёй».'
  naturalness: «Приняв её по преемству» понятно, но «получив её по преемству» естественнее. Одно предложение с тире перед заключительным временным оборотом сохраняет связь с греческой фразой и не создаёт нового утверждения о местонахождении скинии.
  terminology: «Иисус Навин» и «наши отцы» уместны. В примечании следует исправить имя отца на «Нун». «При завоевании народов» передаёт контекстуальный смысл κατάσχεσις τῶν ἐθνῶν, не утверждая, что Израиль буквально «владел народами».
