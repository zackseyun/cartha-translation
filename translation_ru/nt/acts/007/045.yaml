revisions:
- from: Её и внесли наши отцы, приняв её по преемству[a], вместе с Иисусом Навином[b], когда вступили во владение землёй народов, которых Бог изгнал от лица наших отцов. Она оставалась там до дней Давида.
  to: Её также внесли наши отцы, получив её по преемству[a], вместе с Иисусом Навином[b], при завоевании народов, которых Бог изгнал от лица наших отцов, — до дней Давида.
  rationale: Правка устраняет фактическую ошибку в сноске и снимает добавленное «там», которого нет в исходном тексте. «Также» передаёт καί; «получив её по преемству» сохраняет значение преемственного получения. Заключительный оборот сохранён в той же фразе, чтобы не навязывать спорное синтаксическое истолкование.
