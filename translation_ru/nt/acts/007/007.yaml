  text: καὶ τὸ ἔθνος ᾧ ⸀ἐὰν ⸀δουλεύσουσιν κρινῶ ἐγώ, ⸂ὁ θεὸς εἶπεν⸃, καὶ μετὰ ταῦτα ἐξελεύσονται καὶ λατρεύσουσίν μοι ἐν τῷ τόπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/007.yaml
  text: And I will judge the nation that they will serve[a], God said[b], and after these things they will come out and worship me in this place.
translation:
  language: ru
  text: «А народ, которому они будут служить[a], Я буду судить, — сказал Бог, — и после этого они выйдут и будут поклоняться Мне[b] в этом месте».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у которого они будут в рабстве»; «которому они будут служить как рабы». Греческий глагол означает «служить», но контекст говорит о рабстве Израиля в Египте.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «служить Мне». Греческий глагол может обозначать религиозное служение или поклонение Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνος
  choice: народ
  rationale: В данном контексте слово обозначает народ как политическое сообщество, поработившее потомков Авраама. «Народ» естественно звучит по-русски и соответствует ветхозаветному фону Бытия 15:14.
- source_word: ᾧ ἐὰν δουλεύσουσιν
  choice: которому они будут служить
  rationale: Дательный падеж относительного местоимения указывает, кому служат. Основной текст сохраняет прямое значение глагола δουλεύω, а принудительный характер служения в египетском рабстве поясняется в сноске.
- source_word: κρινῶ
  choice: Я осужу
  rationale: Будущая форма κρίνω здесь говорит о Божьем суде над поработившим народом. «Осужу» кратко и естественно передаёт судебный смысл, не конкретизируя способ наказания.
- source_word: ὁ θεὸς εἶπεν
  choice: сказал Бог
  rationale: Формула вводится внутрь прямой речи в естественном для русского языка порядке слов.
- source_word: μετὰ ταῦτα
  choice: после этого
  rationale: Естественный современный эквивалент указания на последующую последовательность событий.
- source_word: ἐξελεύσονται
  choice: они выйдут
  rationale: Глагол указывает на исход потомков Авраама из земли порабощения; «выйдут» сохраняет лаконичность исходного текста.
- source_word: λατρεύσουσίν μοι
  choice: будут поклоняться Мне
  rationale: λατρεύω при Боге обозначает религиозное служение. «Поклоняться» ясно передаёт сакральный смысл и отличает его от вынужденного служения поработившему народу.
- source_word: ἐν τῷ τόπῳ τούτῳ
  choice: на этом месте
  rationale: Для русского языка «на этом месте» — естественное пространственное выражение, сохраняющее указание исходного текста на конкретное место.
theological_decisions:
- issue: Значение δουλεύω в контексте рабства
  choice: служить
  alternative: быть в рабстве / служить как рабы
  rationale: Контекст несомненно говорит о порабощении в Египте, однако основной текст сохраняет глагольную формулировку источника и не заменяет её более истолковывающим выражением. Рабский характер служения отмечен в сноске.
- issue: Значение λατρεύω по отношению к Богу
  choice: поклоняться
  alternative: служить
  rationale: Здесь речь идёт не об обычной работе, а о религиозном служении Богу. «Поклоняться» передаёт этот смысл современному читателю, а возможный перевод «служить» указан в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой божественной речи. Пунктуация оформляет слова автора как вставку между двумя частями цитаты. Заглавное «Мне» соответствует принятой русской библейской издательской традиции при обращении к Богу; смысловой неоднозначности это не добавляет.
