  source_fidelity: 'Нужно убрать «Поэтому»: греческое καί здесь означает «и», а не выраженное в тексте следствие. Также «Я переселю» без уточнения может звучать как нейтральное переселение, тогда как μετοικιῶ обозначает принудительное перемещение в изгнание. Сноска a неточно приписывает имени «Рефан» еврейский текст Ам 5:26; корректнее говорить о переводах, отражающих форму «вашего бога».'
