id: ACT.7.43
reference: Acts 7:43
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἀνελάβετε τὴν σκηνὴν τοῦ Μολὸχ καὶ τὸ ἄστρον τοῦ ⸀θεοῦ ⸀Ῥαιφάν, τοὺς τύπους οὓς ἐποιήσατε προσκυνεῖν αὐτοῖς. καὶ μετοικιῶ ὑμᾶς ἐπέκεινα Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/043.yaml
  text: And you took up the tent of Moloch and the star of the god Rephan[a], the images that you made to worship them[c][b], and I will deport you beyond Babylon.
translation:
  language: ru
  text: Вы несли шатёр Молоха и звезду бога Рефана[a] — изображения[c], которые вы сделали, чтобы поклоняться им. И Я переселю вас в изгнание за Вавилон[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Некоторые переводы, следуя еврейскому тексту Ам 5:26, передают: «вашего бога Рефана». Здесь, в Деяниях, греческий текст гласит: «бога Рефана».'
    reason: alternative_reading
  - marker: b
    text: 'В Деяниях сказано «за Вавилон», тогда как в Ам 5:27 соответствующее место обычно переводится: «за Дамаск».'
    reason: cross_reference
  - marker: c
    text: 'Или: «образы», «изваяния».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνελάβετε
  choice: вы носили
  rationale: В контексте переносных предметов культа глагол передаёт их ношение; русское «носили» звучит естественно и не добавляет лишнего толкования.
- source_word: σκηνὴν
  choice: шатёр
  rationale: Буквальное значение — «шатёр». Вариант «скиния» мог бы вызвать ошибочную ассоциацию с законной скинией Бога, а «святилище» было бы более интерпретирующим.
- source_word: Μολὸχ
  choice: Молох
  rationale: Устоявшаяся русская передача имени языческого божества.
- source_word: ἄστρον
  choice: звезду
  rationale: Сохраняется прямое значение существительного без уточняющего толкования «изображение звезды».
- source_word: τοῦ θεοῦ Ῥαιφάν
  choice: бога Рефана
  rationale: Основной текст следует греческому чтению Деяний — «бога Рефана», не заменяя его формой «вашего бога» из еврейского текста Амоса.
- source_word: Ῥαιφάν
  choice: Рефан
  rationale: Передача греческой формы имени, соответствующая распространённой русской библейской традиции.
- source_word: τύπους
  choice: изображения
  rationale: В контексте идолопоклонства слово обозначает созданные людьми образы или изображения; выбран ясный современный эквивалент.
- source_word: ἐποιήσατε
  choice: вы сделали
  rationale: Простая и прямая передача аориста, подчёркивающая, что адресаты сами изготовили эти предметы.
- source_word: προσκυνεῖν αὐτοῖς
  choice: чтобы поклоняться им
  rationale: В религиозном контексте «поклоняться» естественно передаёт значение προσκυνέω; местоимение сохраняет множественное число оригинала.
- source_word: μετοικιῶ
  choice: Я переселю
  rationale: Глагол означает принудительное переселение в изгнание. «Переселю» сохраняет действие Бога как говорящего и звучит современно; смысл изгнания ясен из контекста.
- source_word: ἐπέκεινα Βαβυλῶνος
  choice: за Вавилон
  rationale: Естественная русская передача пространственного значения «по ту сторону, дальше Вавилона»; сохраняется именно чтение Деяний.
theological_decisions:
- issue: В цитате Стефана место изгнания отличается от текста Амоса 5:27
  choice: за Вавилон
  alternative: за Дамаск
  rationale: Греческий текст Деян 7:43 прямо называет Вавилон. Перевод не гармонизирует Деяния с Амосом, а отмечает различие в сноске.
- issue: Форма определения при имени Рефана отличается от еврейского текста Амоса 5:26
  choice: бога Рефана
  alternative: вашего бога Рефана
  rationale: Перевод следует греческому тексту Деяний, где стоит τοῦ θεοῦ Ῥαιφάν, и сохраняет альтернативу исходной цитатной традиции в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан плавным и понятным; «поэтому» передаёт следственный оттенок καί перед угрозой изгнания. Имена переданы в привычной русской форме, а расхождения с текстом Амоса не сглажены.
