id: ACT.7.55
reference: Acts 7:55
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὑπάρχων δὲ πλήρης πνεύματος ἁγίου ἀτενίσας εἰς τὸν οὐρανὸν εἶδεν δόξαν θεοῦ καὶ Ἰησοῦν ἑστῶτα ἐκ δεξιῶν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/055.yaml
  text: But being full of the Holy Spirit[a], he gazed into heaven and saw the glory of God, and Jesus standing at the right hand of God[b],
translation:
  language: ru
  text: Он же, исполненный Святого Духа, устремил взгляд к небу[a] и увидел славу Бога и Иисуса, стоящего по правую руку от Бога[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пристально посмотрел на небо».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «по правую руку от Бога» — библейский образ высочайшей чести и власти.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπάρχων
  choice: исполненный (в сочетании «исполненный Святого Духа»)
  rationale: Причастие обозначает состояние, в котором уже находился Стефан. Отдельное «будучи» по-русски возможно, но утяжеляет фразу; обстоятельственная конструкция сохраняет смысл естественнее.
- source_word: πλήρης πνεύματος ἁγίου
  choice: исполненный Святого Духа
  rationale: Устойчивое и понятное библейское выражение, передающее состояние полноты Духом. Написание с прописных букв отражает личное божественное именование в контексте Луки — Деяний.
- source_word: ἀτενίσας
  choice: устремил взгляд
  rationale: Передаёт сосредоточенное, пристальное смотрение, а не простой взгляд. Личная форма в русском естественно соединяется с последующим «увидел».
- source_word: εἰς τὸν οὐρανόν
  choice: к небу
  rationale: В контексте видения речь идёт о небесной сфере; «к небу» естественно сочетается с выражением «устремил взгляд» и не сводит значение к видимому небосводу.
- source_word: εἶδεν
  choice: увидел
  rationale: Прямой современный эквивалент основного глагола без архаической окраски.
- source_word: δόξαν θεοῦ
  choice: славу Бога
  rationale: Сохраняет явное упоминание Бога и традиционный библейский термин «слава», не поясняя сверх текста характер её видимого явления.
- source_word: Ἰησοῦν
  choice: Иисуса
  rationale: Стандартная русская форма имени в требуемом падеже.
- source_word: ἑστῶτα
  choice: стоящего
  rationale: Сохраняет подчёркнутую текстом позу Иисуса и согласуется с винительным падежом имени.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: по правую руку от Бога
  rationale: Естественный русский эквивалент пространственно-почётной библейской идиомы; сохраняет образ правой стороны, не превращая его в толкование.
- source_word: δέ
  choice: же
  rationale: Передаёт мягкое противопоставление Стефана враждебной толпе из предыдущего контекста без чрезмерно резкого русского «но».
theological_decisions:
- issue: Личный или безличный смысл πνεύματος ἁγίου
  choice: Святого Духа
  alternative: святого духа
  rationale: Употребление в Луке — Деяниях и ближайший повествовательный контекст указывают на Божьего Святого Духа, а не просто на святое расположение духа или безличную силу.
- issue: Образ Иисуса по правую руку от Бога
  choice: Иисуса, стоящего по правую руку от Бога
  alternative: Иисуса, стоящего справа от Бога
  rationale: Формулировка сохраняет и различение Иисуса и Бога в самом предложении, и значимый библейский образ почётного положения и власти, не подменяя его богословским пересказом.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан плавным и доступным: греческие причастные конструкции переданы сочетанием обстоятельственного оборота и личного глагола. Маркер [a] помещён после выражения, к которому относится лексическая альтернатива; расположение маркера в английском консультационном тексте, вероятно, было технически ошибочным.'
