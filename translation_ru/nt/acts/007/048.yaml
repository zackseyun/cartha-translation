base_translation:
  language: en
  yaml_path: translation/nt/acts/007/048.yaml
  text: 'But the Most High does not dwell in things made by hands[a], just as the prophet says:'
translation:
  language: ru
  text: 'Но Всевышний не живёт в том, что сделано руками[a], как говорит пророк:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в храмах, построенных руками людей». Греческое выражение шире — «в том, что сделано руками», хотя непосредственно речь идёт о храме.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Но
  rationale: Передаёт сильное противопоставление предшествующему сообщению о доме, построенном Соломоном.
- source_word: ὁ ὕψιστος
  choice: Всевышний
  rationale: Устоявшийся в русском библейском языке титул Бога; не добавляет отсутствующего в греческом тексте слова «Бог».
- source_word: ἐν χειροποιήτοις
  choice: в том, что сделано руками
  rationale: Сохраняет более широкий смысл субстантивированного прилагательного χειροποιήτοις и не сужает его до храмов, хотя храм составляет непосредственный контекст.
- source_word: κατοικεῖ
  choice: живёт
  rationale: Естественный современный русский эквивалент со значением постоянного пребывания; в сочетании с контекстом ясно выражает мысль о месте Божьего обитания.
- source_word: καθὼς
  choice: как
  rationale: Естественно вводит подтверждающую пророческую цитату; усиленное «точно так же, как» здесь по-русски было бы избыточным.
- source_word: ὁ προφήτης
  choice: пророк
  rationale: Следует греческому тексту, не добавляя имени Исаии.
- source_word: λέγει
  choice: говорит
  rationale: Сохраняет настоящее время формулы цитирования и представляет Писание как продолжающее говорить.
theological_decisions:
- issue: Следует ли понимать χειροποιήτοις конкретно как храмы
  choice: В основном тексте сохранено широкое выражение «в том, что сделано руками»
  alternative: «в храмах, построенных руками людей»
  rationale: Непосредственно речь идёт о храме, однако греческое слово шире и может поддерживать полемику против любых рукотворных мест и предметов культа. Более широкая передача сохраняет эту смысловую напряжённость.
- issue: Следует ли разворачивать ὁ ὕψιστος как «Всевышний Бог»
  choice: «Всевышний»
  alternative: «Всевышний Бог»
  rationale: Речь несомненно о Боге, но существительного θεός в исходном тексте нет; традиционный титул «Всевышний» самодостаточен.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Всевышний» сохраняет достоинство титула, а «живёт» звучит естественнее для широкого читателя, чем более архаичное «обитает».
