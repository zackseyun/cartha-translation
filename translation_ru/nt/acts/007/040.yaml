base_translation:
  language: en
  yaml_path: translation/nt/acts/007/040.yaml
  text: saying to Aaron[a], ‘Make gods for us who will go before us, for this Moses[b], who led us out from the land of Egypt—we do not know what has happened to him.’
translation:
  language: ru
  text: 'говоря Аарону: «Сделай нам богов[a], которые пойдут перед нами, потому что этот Моисей[b], который вывел нас из земли Египта, — мы не знаем, что с ним случилось».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «идолов». В греческом тексте буквально: «богов»; эта формулировка повторяет рассказ книги Исход и передаёт слова самого народа.'
    reason: lexical_alternative
  - marker: b
    text: Слова «этот Моисей» могут выражать отчуждённость или пренебрежение.
    reason: discourse_nuance
lexical_decisions:
- source_word: εἰπόντες τῷ Ἀαρών
  choice: говоря Аарону
  rationale: Причастие аориста вводит содержание речи и сохраняет синтаксическую связь с предшествующим контекстом; форма «говоря» естественна в русском повествовании.
- source_word: Ποίησον ἡμῖν
  choice: Сделай нам
  rationale: Прямо передаёт повелительную форму ποιέω и дательный значения заинтересованного лица.
- source_word: θεοὺς
  choice: богов
  rationale: θεός во множественном числе буквально означает «боги». Хотя речь идёт об идолопоклонстве, исходный текст сохраняет формулировку самого народа, а не заменяет её истолковывающим словом «идолы».
- source_word: οἳ προπορεύσονται ἡμῶν
  choice: которые пойдут перед нами
  rationale: Передаёт значение предшествования в προπορεύομαι, не добавляя более сильного значения «поведут нас».
- source_word: ὁ γὰρ Μωϋσῆς οὗτος
  choice: потому что этот Моисей
  rationale: γάρ указывает основание просьбы, а οὗτος выделяет Моисея и может звучать отчуждённо или пренебрежительно. Русская конструкция остаётся естественной и не усиливает оттенок сверх текста.
- source_word: ἐξήγαγεν ἡμᾶς
  choice: вывел нас
  rationale: ἐξάγω означает вывести или увести наружу; «вывел нас» точно и естественно соответствует контексту исхода.
- source_word: ἐκ γῆς Αἰγύπτου
  choice: из земли Египетской
  rationale: Сохраняет явно названную γῆ «землю» и использует узнаваемую, но всё ещё понятную современному читателю библейскую формулу.
- source_word: οὐκ οἴδαμεν τί ἐγένετο αὐτῷ
  choice: мы не знаем, что с ним случилось
  rationale: Естественно передаёт настоящее οἴδαμεν и идиоматическое значение γίνομαι в данной конструкции.
theological_decisions:
- issue: Передача θεοὺς в контексте идолопоклонства
  choice: богов
  alternative: идолов
  rationale: Основной текст воспроизводит заявление народа с существительным θεοὺς и тем самым сохраняет его притязание и заложенную в повествовании иронию. Вариант «идолов» верен по референту, но заранее истолковывает предмет вместо передачи употреблённого слова.
- issue: Оттенок выражения ὁ Μωϋσῆς οὗτος
  choice: этот Моисей
  alternative: что до этого Моисея
  rationale: «Этот Моисей» сохраняет указательное выделение и возможную отчуждённость, не превращая подразумеваемый тон в однозначно пренебрежительный.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Конструкция «земля Египетская» сохраняет явное γῆ и узнаваемый регистр; тире перед главным утверждением передаёт тематическое выделение Моисея. Все примечания отмечены в основном тексте.
