  text: ἀκούσαντες δὲ ἐβαπτίσθησαν εἰς τὸ ὄνομα τοῦ κυρίου Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/005.yaml
  text: And when they heard this[a], they were baptized in the name of the Lord Jesus.
translation:
  language: ru
  text: Услышав это, они крестились во имя[a] Господа Иисуса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в имя».'
    reason: Сноска сохраняет направительное значение греческого εἰς и отмечает отличие буквальной конструкции от устойчивого русского выражения «во имя».
lexical_decisions:
- source_word: ἀκούσαντες
  choice: услышав это
  rationale: Аористное причастие имеет временное значение. Местоимение «это» естественно передаёт подразумеваемый объект — сказанное Павлом в предыдущем стихе.
- source_word: δὲ
  choice: не передано отдельно
  rationale: Слабая повествовательная связка δέ в русском контексте не требует отдельного союза; деепричастный оборот естественно продолжает рассказ.
- source_word: ἐβαπτίσθησαν
  choice: они крестились
  rationale: Русский возвратный глагол «крестились» — обычный и естественный способ передать греческий пассив, не подразумевая, что они совершили крещение над собой.
- source_word: εἰς τὸ ὄνομα
  choice: во имя
  rationale: Это устойчивое и понятное русское соответствие формулы. Направительное значение εἰς отмечено в сноске, поскольку буквальное «в имя» в современном русском звучит неестественно.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Господа Иисуса
  rationale: κύριος передано титулом «Господь», а имя Ἰησοῦ — принятой русской формой «Иисус» в родительном падеже.
theological_decisions:
- issue: 'Формулировка крещения: εἰς τὸ ὄνομα'
  choice: во имя Господа Иисуса
  alternative: в имя Господа Иисуса
  rationale: Основной текст сохраняет естественную русскую формулу и не гармонизирует стих с иными крещальными формулами. Сноска указывает на буквальное направительное построение греческого текста, не навязывая ему более узкого богословского толкования.
translation_notes:
  register: Современный литературный русский язык; изложение краткое, ясное и достойное. «Крестились» употреблено в привычном библейском значении, а не как указание на самокрещение.
