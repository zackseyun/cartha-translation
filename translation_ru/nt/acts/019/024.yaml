base_translation:
  language: en
  yaml_path: translation/nt/acts/019/024.yaml
  text: For a certain man named Demetrius[a], a silversmith who made silver shrines of Artemis[b], was providing the craftsmen with no small business.
translation:
  language: ru
  text: Ибо некий мастер серебряных дел по имени Димитрий, изготовлявший серебряные святилища Артемиды[a], обеспечивал ремесленникам немалый объём работы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «серебряные храмы Артемиды»; возможно, имеются в виду серебряные модели храма Артемиды. Греческое слово может обозначать храм или святилище, но точный вид этих изделий не указан.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не малую работу (дело)»; это литота, указывающая на значительный объём работы, торгового дела или дохода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Дело в том, что
  rationale: Передаёт пояснительную связь с предшествующим повествованием естественным для современного русского языка оборотом.
- source_word: Δημήτριος… ὀνόματι
  choice: по имени Димитрий
  rationale: Имя передано в традиционной русской форме; греческий оборот с ὀνόματι естественно переводится как «по имени».
- source_word: ἀργυροκόπος
  choice: мастер по серебру
  rationale: Современное и понятное обозначение ремесленника, работавшего с серебром; оно точнее по регистру, чем редкое «серебряник».
- source_word: ποιῶν
  choice: изготовлял
  rationale: Передаёт длительную, обычную деятельность Димитрия; сочетается с ремесленным производством.
- source_word: ναοὺς ἀργυροῦς Ἀρτέμιδος
  choice: серебряные святилища Артемиды
  rationale: ναός обозначает храм или святилище, а в данном торговом контексте, вероятно, небольшие культовые изделия. «Святилища» сохраняет возможную неоднозначность их точной формы.
- source_word: παρείχετο τοῖς τεχνίταις
  choice: давал ремесленникам
  rationale: Передаёт то, что производство постоянно обеспечивало занятость или доход мастерам, без чрезмерного уточнения хозяйственных отношений.
- source_word: οὐκ ὀλίγην ἐργασίαν
  choice: немалый заработок
  rationale: Сохраняет греческую литоту «не малый» и естественно выражает экономический смысл ἐργασία в контексте ремесла.
