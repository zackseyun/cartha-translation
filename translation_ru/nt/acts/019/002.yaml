  text: εἶπέν ⸀τε πρὸς αὐτούς· Εἰ πνεῦμα ἅγιον ἐλάβετε πιστεύσαντες; οἱ ⸀δὲ πρὸς αὐτόν· Ἀλλ’ οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/002.yaml
  text: And he said to them[a], “Did you receive the Holy Spirit when you believed?” And they said to him, “No[b], we have not even heard that there is a Holy Spirit.”
translation:
  language: ru
  text: 'Он спросил их: «Получили ли вы Святого Духа, когда уверовали[a]?» Они ответили ему: «Нет, мы даже не слышали, что есть Святой Дух[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «после того как уверовали». Греческое причастие допускает несколько оттенков временного отношения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мы даже не слышали, есть ли Святой Дух»; более истолковательно: «мы даже не слышали, что Святой Дух был дан».'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπέν τε πρὸς αὐτούς
  choice: Он спросил их
  rationale: Буквально — «и сказал им», однако последующая прямая речь является вопросом; «спросил» естественно и точно передаёт речевое действие, а частица τε лишь связывает его с предыдущим повествованием.
- source_word: Εἰ ... ἐλάβετε πιστεύσαντες
  choice: Получили ли вы ... когда уверовали?
  rationale: Аористное причастие πιστεύσαντες допускает временное понимание, но само по себе не устанавливает строгой последовательности. «Когда уверовали» сохраняет эту гибкость лучше, чем однозначное «после того как уверовали».
- source_word: πνεῦμα ἅγιον
  choice: Святого Духа / Святой Дух
  rationale: В данном контексте выражение обозначает Божьего Святого Духа. Заглавные буквы отражают личностное употребление, не добавляя отсутствующего в греческом пояснения.
- source_word: οἱ δὲ πρὸς αὐτόν
  choice: Они ответили ему
  rationale: Глагол речи подразумевается из контекста; «ответили» естественно передаёт реплику в диалоге. δέ обозначает переход к ответу и не требует тяжеловесного противительного союза.
- source_word: Ἀλλ’ οὐδ’
  choice: Нет, мы даже не
  rationale: Сочетание усиливает отрицание. Русская конструкция «Нет, мы даже не...» естественно передаёт силу ответа.
- source_word: οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν
  choice: мы даже не слышали, что есть Святой Дух
  rationale: Это прямое и краткое воспроизведение греческой конструкции. Возможное понимание εἰ как «ли» отмечено в сноске; истолковательное добавление «что Святой Дух был дан» не внесено в основной текст.
theological_decisions:
- issue: Временное соотношение веры и получения Святого Духа
  choice: «когда уверовали»
  alternative: «после того как уверовали»; «уверовав»
  rationale: Причастие πιστεύσαντες связано по времени с ἐλάβετε, но не разрешает само по себе вопрос о строгой последовательности или одновременности. Перевод сохраняет богословское напряжение текста.
- issue: Смысл неосведомлённости учеников о Святом Духе
  choice: «мы даже не слышали, что есть Святой Дух»
  alternative: '«мы даже не слышали, есть ли Святой Дух»; истолковательно: «мы даже не слышали, что Святой Дух был дан»'
  rationale: Основной текст следует наиболее прямому смыслу греческой фразы, а реальные варианты понимания сохраняются в сноске без внесения пояснений в сам стих.
translation_notes:
  register: Современный литературный русский язык; речь ясная, сдержанная и достойная. Диалог передан естественно, без конфессионально обусловленного уточнения порядка веры и получения Святого Духа.
