  text: И Бог совершал руками Павла необыкновенные чудеса,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «деяния силы, не из обычных».'
    reason: Лексическая альтернатива поясняет буквальный смысл выражения Δυνάμεις οὐ τὰς τυχούσας.
lexical_decisions:
- source_word: Δυνάμεις
  choice: чудеса
  rationale: Во множественном числе в повествовании Деяний слово обозначает явленные действия силы, то есть чудеса, а не отвлечённые «силы».
- source_word: τε
  choice: И
  rationale: Связующая частица продолжает предыдущее повествование; начальное «И» естественно передаёт эту связь.
- source_word: οὐ τὰς τυχούσας
  choice: необыкновенные
  rationale: Греческий оборот буквально означает «не обычные» или «не какие-нибудь»; «необыкновенные» сохраняет усилительный смысл и естественно сочетается со словом «чудеса».
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Бог прямо назван грамматическим субъектом, что сохраняет акцент на божественном источнике чудес.
- source_word: ἐποίει
  choice: совершал
  rationale: Имперфект передаёт продолжавшееся или повторявшееся действие, а «совершал» является естественным русским глаголом при слове «чудеса».
- source_word: διὰ τῶν χειρῶν Παύλου
  choice: руками Павла
  rationale: Оборот с διά и родительным падежом выражает посредничество или орудийность; сохранение слова «руками» передаёт конкретную греческую идиому и показывает Павла как посредника действия Бога.
- source_word: Παύλου
  choice: Павла
  rationale: Имя передано в принятой русской библейской форме.
theological_decisions:
- issue: Кто совершает чудеса
  choice: Чудеса совершает Бог, действуя руками Павла.
  alternative: Чудеса совершает Павел.
  rationale: В греческом тексте ὁ θεὸς — грамматический субъект глагола ἐποίει, тогда как διὰ τῶν χειρῶν Παύλου указывает на посредничество Павла. Перевод сохраняет это различие.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка ясна широкому читателю; конкретная идиома «руками Павла» сохранена без излишней архаизации.
