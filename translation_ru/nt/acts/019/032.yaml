  text: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον, ἦν γὰρ ἡ ἐκκλησία συγκεχυμένη, καὶ οἱ πλείους οὐκ ᾔδεισαν τίνος ἕνεκα συνεληλύθεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/032.yaml
  text: So then some were shouting one thing and some another[a], for the assembly was in confusion, and most of them did not know why they had come together.
translation:
  language: ru
  text: Одни кричали одно, другие — другое, потому что собрание было в смятении, и большинство собравшихся не знали, почему они собрались.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον
  choice: Одни кричали одно, другие — другое
  rationale: Конструкция ἄλλοι… ἄλλο τι передаёт распределительное противопоставление, а имперфект ἔκραζον — продолжавшееся шумное действие. Частицы μὲν οὖν не требуют отдельного формального соответствия в естественном русском повествовании.
- source_word: ἐκκλησία
  choice: собрание
  rationale: В данном контексте слово обозначает собравшихся горожан, а не христианскую церковь. «Собрание» точно и нейтрально передаёт это значение.
- source_word: συγκεχυμένη
  choice: было в смятении
  rationale: Перфектное причастие описывает возникшее и сохраняющееся состояние замешательства и беспорядка; «в смятении» естественно передаёт оба оттенка.
- source_word: οἱ πλείους
  choice: большинство собравшихся
  rationale: Субстантивированная сравнительная форма означает большинство людей. Добавление «собравшихся» ясно обозначает референта без неестественного местоименного согласования.
- source_word: τίνος ἕνεκα
  choice: зачем
  rationale: Идиома обозначает причину или цель. В контексте неосведомлённой толпы естественное русское «зачем» сохраняет возможный целевой оттенок.
- source_word: συνεληλύθεισαν
  choice: они пришли
  rationale: Плюсквамперфект обозначает предшествующее собирание. В русском последовательность событий ясна из контекста, поэтому естественное «пришли» предпочтительнее тяжеловесного аналитического выражения; идея совместного собрания уже выражена словом «собравшихся».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная фраза сохраняет шум и беспорядочность сцены. Термин «собрание» употреблён в гражданском, не церковном смысле; сноска не нужна, поскольку русский контекст не создаёт существенной двусмысленности.
