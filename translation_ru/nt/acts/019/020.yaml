  yaml_path: translation/nt/acts/019/020.yaml
  text: So the word of the Lord was growing mightily and prevailing[a].
translation:
  language: ru
  text: Так слово Господне с великой силой росло и набирало силу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Так слово Господне могущественно росло и укреплялось». Выражение κατὰ κράτος может передаваться наречно: «могущественно», «сильно»; ἴσχυεν означает «обретало силу», «укреплялось».'
    reason: 'Лексическая альтернатива: уточняет возможную наречную передачу κατὰ κράτος и смысл ἴσχυεν без добавления объекта для глагола.'
lexical_decisions:
- source_word: οὕτως
  choice: Так
  rationale: Передаёт итоговый и следственный смысл, связывая утверждение с предшествующими событиями.
- source_word: κατὰ κράτος
  choice: с великой силой
  rationale: Передаёт идиоматическое значение мощи и действенности; в русском естественно относится к совместному действию двух глаголов.
- source_word: τοῦ κυρίου
  choice: Господне
  rationale: Сохраняет греческий титул и привычное русское сочетание «слово Господне», не уточняя в переводе подразумеваемого носителя титула.
- source_word: ὁ λόγος
  choice: слово
  rationale: Сохраняет повторяющееся в Деяниях обозначение возвещаемой вести и не сужает его до пояснительного «весть».
- source_word: ηὔξανεν
  choice: росло
  rationale: Имперфект передаёт продолжавшееся распространение; русская форма прошедшего времени в данном контексте естественно допускает длительное значение.
- source_word: ἴσχυεν
  choice: одолевало
  rationale: Передаёт силу и успешное преобладание слова в контексте его распространения, сохраняя отдельный от роста смысл второго глагола.
theological_decisions:
- issue: Кого обозначает τοῦ κυρίου
  choice: Господне
  alternative: Господа Иисуса
  rationale: Контекст естественно указывает на Господа Иисуса, однако греческий текст содержит только титул «Господь», поэтому явное имя не добавляется.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, торжественная и понятная. Сохранены оба глагольных образа — роста и преобладания — и неоднозначность титула «Господь».
