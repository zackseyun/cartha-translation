base_translation:
  language: en
  yaml_path: translation/nt/acts/019/015.yaml
  text: But the evil spirit answered them[a], “Jesus I know, and Paul I recognize—but who are you?”
translation:
  language: ru
  text: 'Но злой дух ответил им: «Иисуса я знаю, и Павел мне известен[a], а вы кто?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисуса я знаю, и Павла я знаю»; возможно также: «...и о Павле мне известно». В греческом тексте употреблены два разных глагола: γινώσκω («знать») и ἐπίσταμαι («знать, быть осведомлённым»); возможно, между ними есть смысловой оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθὲν ... εἶπεν αὐτοῖς
  choice: ответил им
  rationale: Причастие ἀποκριθέν в сочетании с εἶπεν идиоматически вводит ответную реплику. Русское «ответил им» естественно передаёт всю конструкцию без тяжеловесного «отвечая, сказал им».
- source_word: δὲ
  choice: но
  rationale: 'Частица обозначает переход с оттенком противопоставления: попытке заклинателей противопоставляется ответ злого духа.'
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: злой дух
  rationale: В данном контексте πνεῦμα — личное духовное существо, а πονηρόν характеризует его как злое. Это ясное и традиционно понятное современному читателю выражение.
- source_word: Τὸν Ἰησοῦν γινώσκω
  choice: Иисуса я знаю
  rationale: Начальная позиция имени в греческом подчёркивает объект; русский порядок слов сохраняет это выделение. γινώσκω прямо передано глаголом «знаю».
- source_word: τὸν Παῦλον ἐπίσταμαι
  choice: Павел мне известен
  rationale: Иная русская формулировка отражает употребление второго греческого глагола и сохраняет возможное различие оттенков между γινώσκω и ἐπίσταμαι, не утверждая точной степени знания.
- source_word: ὑμεῖς δὲ τίνες ἐστέ
  choice: а вы кто такие?
  rationale: «А» естественно передаёт контраст δέ, местоимение «вы» сохраняет эмфазу и множественное число, а «кто такие?» идиоматично запрашивает личность собеседников.
theological_decisions:
- issue: Различие между γινώσκω и ἐπίσταμαι в речи злого духа
  choice: «Иисуса я знаю, и Павел мне известен»
  alternative: «Иисуса я знаю, и о Павле знаю»; либо повтор «Иисуса я знаю, и Павла знаю»
  rationale: В оригинале употреблены два разных глагола, вероятно, с риторическим различием. Формулировка «Павел мне известен» отмечает это различие, но не превращает его в догматическое утверждение о разных степенях знания.
translation_notes:
  register: Современный литературный русский язык; реплика звучит естественно и резко. Порядок слов подчёркивает Иисуса и контрастное «вы», а лексическое различие двух греческих глаголов сохранено без переинтерпретации.
