source:
  edition: SBLGNT
  text: καὶ γὰρ κινδυνεύομεν ἐγκαλεῖσθαι στάσεως περὶ τῆς σήμερον μηδενὸς αἰτίου ὑπάρχοντος περὶ οὗ οὐ δυνησόμεθα ⸀ἀποδοῦναι λόγον ⸀περὶ τῆς συστροφῆς ταύτης. καὶ ταῦτα εἰπὼν ἀπέλυσεν τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/040.yaml
  text: For indeed we are in danger of being charged with rioting over what happened today[a], since there is no cause for it, and we will not be able to give an account for this commotion. And after saying these things[c][b], he dismissed the assembly.
translation:
  language: ru
  text: 'Ведь нам грозит обвинение в беспорядках из-за сегодняшних событий[a]: для этого нет никаких оснований, и мы не сможем дать отчёт об этом сборище[b]. Сказав это, он распустил собрание[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в мятеже» либо «в восстании». Греческое слово может обозначать серьёзную гражданскую смуту; в данном контексте оно относится к публичным беспорядкам, способным вызвать вмешательство римских властей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «стечении народа», «беспорядочном сборе». Греческое слово обозначает скопление или беспорядочно собравшуюся толпу и отличается от слова «собрание» в следующем предложении.'
    reason: lexical_alternative
  - marker: c
    text: Греческое слово, переведённое здесь как «собрание», в других местах часто означает «церковь», но в данном контексте речь идёт о гражданском собрании в Эфесе.
    reason: cross_reference
lexical_decisions:
- source_word: κινδυνεύομεν
  choice: нам грозит
  rationale: Передаёт наличную и непосредственную опасность естественным современным русским оборотом.
- source_word: ἐγκαλεῖσθαι
  choice: обвинение
  rationale: Сохраняет юридический оттенок глагола в речи городского должностного лица.
- source_word: στάσεως
  choice: в мятеже
  rationale: Передаёт серьёзность нарушения общественного порядка и возможный политико-правовой оттенок, не утверждая непременно полномасштабное восстание.
- source_word: περὶ τῆς σήμερον
  choice: из-за сегодняшних событий
  rationale: Естественно раскрывает эллиптическое греческое выражение, относя его к происшедшему в тот день.
- source_word: μηδενὸς αἰτίου ὑπάρχοντος
  choice: для этого нет никаких оснований
  rationale: Передаёт генитив абсолютный и юридический смысл отсутствия оправдывающей причины.
- source_word: ἀποδοῦναι λόγον
  choice: дать отчёт
  rationale: Сохраняет устойчивый смысл ответа или объяснения перед властями.
- source_word: συστροφῆς
  choice: сборище
  rationale: Обозначает беспорядочно собравшуюся толпу и ясно отличает её от ἐκκλησία; отрицательная окраска соответствует контексту смуты.
- source_word: ἐκκλησίαν
  choice: собрание
  rationale: В данном контексте это гражданское собрание, а не церковь; русский эквивалент сохраняет нейтральный общественный смысл.
- source_word: ἀπέλυσεν
  choice: распустил
  rationale: Обычный русский глагол для официального завершения и роспуска собрания.
- source_word: καὶ γὰρ
  choice: Ведь
  rationale: Естественно передаёт объяснительно-усилительную функцию сочетания без тяжеловесности.
