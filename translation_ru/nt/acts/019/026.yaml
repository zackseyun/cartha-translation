    issue: «отвратил от прежнего»
    rationale: Оборот добавляет «прежнее», которого в стихе нет, и не сообщает читателю, от чего именно были отвлечены люди. Он также менее естественен, чем русское выражение, обозначающее переход на другую сторону.
  - severity: low
    issue: «и сами»
    rationale: Это дополнительное усиление отсутствует в θεωρεῖτε καὶ ἀκούετε. Риторическая обращённость уже передана формой «вы видите и слышите».
