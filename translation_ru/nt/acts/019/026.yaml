  source_fidelity: 'Фраза «отвратил от прежнего» неудачна: она вводит не названный в греческом тексте объект и по-русски остаётся неопределённой. Μετέστησεν обозначает перемену прежней принадлежности/позиции; в обвинительной речи Димитрия это естественно передать как «переманил». Убрано также добавочное «и сами», для которого нет отдельного соответствия в исходнике.'
  naturalness: Исправленный текст сохраняет современный литературный и публично-обвинительный регистр. «Убедил и переманил немалое число людей» звучит по-русски ясно и передаёт как убеждение, так и последовавший переход.
  terminology: «Провинция Азия» исторически уместно в данном эфесском контексте; примечание поясняет, что речь не о современном континенте. Повтор «боги … не боги» обоснованно сохраняет полемическую структуру оригинала. Примечание к «человеческими руками» корректно объясняет идиому как указание на изготовленные людьми культовые изображения.
