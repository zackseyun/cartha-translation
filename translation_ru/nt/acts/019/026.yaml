  text: καὶ θεωρεῖτε καὶ ἀκούετε ὅτι οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας ὁ Παῦλος οὗτος πείσας μετέστησεν ἱκανὸν ὄχλον, λέγων ὅτι οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/026.yaml
  text: And you see and hear that not only in Ephesus but in almost all of Asia[a], this Paul has persuaded and turned away a considerable crowd[b], saying that gods made by hands are not gods.
translation:
  language: ru
  text: Вы видите и слышите, что не только в Эфесе, но и почти по всей провинции Азия[a] этот Павел убедил и переманил немалое число людей, говоря, что боги, сделанные человеческими руками[b], — не боги.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть в римской провинции Азия, располагавшейся на западе Малой Азии.
    reason: historical_geography
  - marker: b
    text: 'Буквально: «возникающие посредством рук»; имеются в виду изображения богов, изготовленные людьми.'
    reason: cultural_note
lexical_decisions:
- source_word: θεωρεῖτε καὶ ἀκούετε
  choice: видите и слышите
  rationale: Сохраняет двойное обращение к очевидным и общеизвестным свидетельствам; «и сами» естественно передаёт риторический нажим, присутствующий в обращении ко множественному числу.
- source_word: οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας
  choice: не только в Эфесе, но и почти по всей провинции Азия
  rationale: Родительные формы имеют здесь естественный локативный смысл. Уточнение «провинции» предотвращает современное понимание всей части света и исторически верно обозначает римскую Азию.
- source_word: ὁ Παῦλος οὗτος
  choice: этот Павел
  rationale: Сохраняет указательное и слегка пренебрежительное звучание речи Димитрия без усиления до бранного выражения.
- source_word: πείσας μετέστησεν
  choice: убедил и отвратил от прежнего
  rationale: Передаёт убеждение как средство и последовавшее изменение позиции. Добавление «от прежнего» делает русское управление глагола ясным, не конкретизируя сверх текста, от чего именно люди были отвращены.
- source_word: ἱκανὸν ὄχλον
  choice: немало людей
  rationale: Естественно передаёт значительное число людей; буквальное «значительную толпу» в данном контексте по-русски звучало бы менее естественно и могло бы означать одну собравшуюся толпу.
- source_word: λέγων ὅτι
  choice: говоря, что
  rationale: Сохраняет причастное введение содержания проповеди и связь с предшествующим обвинением.
- source_word: οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι
  choice: боги, сделанные человеческими руками, — не боги
  rationale: Сохраняет предикативное отрицание божественного статуса рукотворных изображений и намеренный риторический повтор слова «боги».
theological_decisions:
- issue: Отрицание божественного статуса рукотворных богов
  choice: боги, сделанные человеческими руками, — не боги
  alternative: то, что сделано человеческими руками, не является богами
  rationale: Выбранная формулировка непосредственно сохраняет парадоксальную полемическую силу греческого текста и не добавляет смягчающего «на самом деле».
- issue: Объект, от которого Павел отвратил людей
  choice: отвратил от прежнего
  alternative: отвратил от почитания богов
  rationale: Контекст указывает на оставление идолопоклонства, однако дополнение «от почитания богов» сделало бы явным то, что в самом стихе остаётся подразумеваемым. Выбранный вариант сохраняет эту степень недосказанности.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной речи. Реплика сохраняет обвинительный и слегка пренебрежительный тон Димитрия, но избегает архаизмов и чрезмерно разговорных выражений.
