  text: εἶπέν ⸀τε· Εἰς τί οὖν ἐβαπτίσθητε; οἱ δὲ εἶπαν· Εἰς τὸ Ἰωάννου βάπτισμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/003.yaml
  text: And he said[a], “Into what then were you baptized?” And they said, “Into John's baptism.”
translation:
  language: ru
  text: 'Тогда он спросил: «Во что же вы крестились?» Они ответили: «В крещение Иоанна».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπέν τε
  choice: Тогда он спросил
  rationale: τε слегка связывает реплику с предшествующим диалогом, поэтому «тогда» естественно передаёт повествовательный переход. Хотя λέγω буквально означает «сказать», в русском языке перед прямым вопросом уместно и точно «спросил».
- source_word: Εἰς τί οὖν
  choice: Во что же
  rationale: «Во что» сохраняет εἰς и параллель с ответом; частица «же» естественно передаёт выводный оттенок οὖν в вопросе.
- source_word: ἐβαπτίσθητε
  choice: вы крестились
  rationale: Русское «крестились» — естественный традиционный эквивалент греческого аориста страдательного залога в данном контексте; он не требует неестественной конструкции «были крещены».
- source_word: Εἰς τὸ Ἰωάννου βάπτισμα
  choice: В крещение Иоанна
  rationale: Повтор «в» сохраняет греческий параллелизм вопроса и ответа, а родительный «Иоанна» естественно передаёт Ἰωάννου без уточнения, которое могло бы преждевременно разрешить характер этой связи.
- source_word: βάπτισμα
  choice: крещение
  rationale: «Крещение» является точным и общепонятным соответствием βάπτισμα и непосредственно называет обряд, связанный с Иоанном.
theological_decisions:
- issue: Сохранять ли повтор предлога εἰς в вопросе и ответе
  choice: 'Передать обе формы с помощью «во/в»: «Во что…?» — «В крещение…»'
  alternative: «Какое крещение вы приняли?» — «Крещение Иоанна»
  rationale: Повтор сохраняет риторический параллелизм греческого текста и возможный смысл приобщения или отнесённости, не навязывая определённого конфессионального понимания крещения.
translation_notes:
  register: 'Современный литературный русский язык; реплика звучит естественно, но сохраняет заметный параллелизм оригинала. Формулировка «крещение Иоанна» оставляет открытым смысл родительного падежа: крещение, совершавшееся Иоанном, установленное им или связанное с ним.'
