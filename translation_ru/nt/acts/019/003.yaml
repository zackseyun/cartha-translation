  source_fidelity: 'Текст точно передаёт вопросительную реплику, аористный пассив ἐβαπτίσθητε естественным русским «вы крестились» и повтор εἰς: «Во что…?» — «В крещение…». «Тогда» и «же» совместно передают связующий и выводный оттенки τε и οὖν без излишней тяжеловесности. «Спросил» в вводе прямого вопроса является безопасной и естественной конкретизацией λέγω.'
  naturalness: Формулировка современная, литературная и хорошо звучит в диалоге. «Во что же вы крестились?» сохраняет намеренно необычную, но понятную конструкцию оригинала; ответ с повтором «В крещение Иоанна» воспринимается естественно в данном параллелизме.
  terminology: «Крестились» и «крещение» — устоявшиеся, точные соответствия βαπτίζω и βάπτισμα. «Крещение Иоанна» корректно сохраняет краткую генитивную связь оригинала и не навязывает её богословское истолкование. Имя Иоанн передано нормативно.
