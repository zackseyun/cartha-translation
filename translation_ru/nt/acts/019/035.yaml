source:
  edition: SBLGNT
  text: καταστείλας δὲ ⸂ὁ γραμματεὺς τὸν ὄχλον⸃ φησίν· Ἄνδρες Ἐφέσιοι, τίς γάρ ἐστιν ⸀ἀνθρώπων ὃς οὐ γινώσκει τὴν Ἐφεσίων πόλιν νεωκόρον οὖσαν τῆς ⸀μεγάλης Ἀρτέμιδος καὶ τοῦ διοπετοῦς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/035.yaml
  text: But after the city clerk had quieted the crowd, he said, “Men of Ephesus, for what man is there who does not know that the city of the Ephesians is temple-keeper of the great Artemis and of the image fallen from heaven?”
translation:
  language: ru
  text: 'Но городской секретарь, успокоив толпу, сказал: «Эфесяне! Кто же из людей не знает, что город Эфес — хранитель храма великой Артемиды[a] и предмета, упавшего с неба[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храмовый хранитель великой Артемиды». Греческое слово обозначало город, официально признанный хранителем храма или культа.'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово буквально означает «упавший от Зевса» и обычно относится к предмету, который считался упавшим с неба. Здесь оно, вероятно, обозначает культовый предмет, связанный с Артемидой; возможно, её изображение.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστείλας
  choice: успокоив
  rationale: Аористное причастие обозначает действие, предшествующее речи; деепричастие естественно передаёт последовательность и подавление волнения толпы.
- source_word: ὁ γραμματεὺς
  choice: городской секретарь
  rationale: В данном гражданском контексте это высокопоставленный муниципальный чиновник Эфеса, а не книжник; «городской секретарь» ясно передаёт административную должность.
- source_word: Ἄνδρες Ἐφέσιοι
  choice: Эфесяне!
  rationale: Естественное и достойное русское обращение к гражданам Эфеса; отдельное «мужи» звучало бы архаично и неоправданно тяжеловесно.
- source_word: τίς γάρ ἐστιν ἀνθρώπων ὃς οὐ γινώσκει
  choice: Кто же из людей не знает
  rationale: Сохраняет риторический вопрос, значение γάρ в ходе аргументации и выражение ἀνθρώπων без неестественного буквального синтаксиса.
- source_word: τὴν Ἐφεσίων πόλιν
  choice: город Эфес
  rationale: Естественное русское обозначение того же референта; буквальное «город эфесян» здесь менее идиоматично.
- source_word: νεωκόρον
  choice: хранитель храма
  rationale: Термин обозначает город, признанный попечителем или хранителем храма и культа; формулировка понятна современному читателю и сохраняет культово-гражданский смысл.
- source_word: τῆς μεγάλης Ἀρτέμιδος
  choice: великой Артемиды
  rationale: Передаёт почётный языческий титул в составе сообщения о речи чиновника, не утверждая его истинность от лица повествователя.
- source_word: τοῦ διοπετοῦς
  choice: святыни, упавшей с неба
  rationale: Субстантивированное прилагательное обозначает предмет, считавшийся упавшим с неба. «Святыня» сохраняет неопределённость вида предмета лучше, чем добавленное «изображение», но ясно показывает его культовую функцию.
theological_decisions:
- issue: Передача языческого утверждения об Артемиде и предмете διοπετές
  choice: 'Передать слова чиновника прямо как сообщение о городском культе: «хранитель храма великой Артемиды и святыни, упавшей с неба»'
  alternative: «хранитель храма великой Артемиды и её изображения, упавшего с неба»
  rationale: Повествование цитирует языческое убеждение, но не подтверждает его. Выбранный вариант сохраняет заявленное верование и не уточняет без необходимости, был ли предмет статуей, изображением или иным культовым объектом.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной речи. Избегаются как церковнославянизмы («мужи»), так и канцелярская перегруженность. Риторическая уверенность городского чиновника сохранена; языческое утверждение передано без авторского одобрения.
