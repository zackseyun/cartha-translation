  text: οὐ μόνον δὲ τοῦτο κινδυνεύει ἡμῖν τὸ μέρος εἰς ἀπελεγμὸν ἐλθεῖν, ἀλλὰ καὶ τὸ τῆς μεγάλης θεᾶς ⸂Ἀρτέμιδος ἱερὸν⸃ εἰς οὐθὲν λογισθῆναι, μέλλειν ⸀τε καὶ καθαιρεῖσθαι ⸂τῆς μεγαλειότητος⸃ αὐτῆς, ἣν ὅλη ἡ Ἀσία καὶ ἡ οἰκουμένη σέβεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/027.yaml
  text: And not only is this trade of ours in danger of coming into disrepute, but also the temple of the great goddess Artemis may be counted as nothing, and even her majesty—whom all Asia and the world worships—may be brought down.
translation:
  language: ru
  text: И не только нашему ремеслу грозит потерять доброе имя, но и храм великой богини Артемиды может быть признан ничего не значащим, а сама она может лишиться своего величия[b] — та, которой поклоняются вся Азия и весь мир[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «весь обитаемый мир». Греческое слово часто обозначает населённый мир, особенно обширный мир Римской империи.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «своего великолепия» либо «своего величия и высокого положения». Греческое выражение указывает на величие, славу или возвышенный статус Артемиды, которые могут быть умалены.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κινδυνεύει
  choice: грозит
  rationale: Передаёт реальную опасность, о которой говорит Димитрий, и естественно сочетается с последующим описанием ущерба.
- source_word: τὸ μέρος
  choice: нашему ремеслу
  rationale: В контексте речь идёт о занятии и источнике дохода ремесленников, а не об абстрактной «части».
- source_word: εἰς ἀπελεγμὸν ἐλθεῖν
  choice: дурная слава
  rationale: Передаёт утрату общественной репутации; конструкция «грозит дурная слава» звучит естественно и сохраняет отрицательную оценку.
- source_word: ἱερὸν
  choice: храм
  rationale: Ясно обозначает знаменитый эфесский храмовый комплекс Артемиды.
- source_word: εἰς οὐθὲν λογισθῆναι
  choice: могут перестать почитать
  rationale: Динамически передаёт смысл «счесть ничего не значащим, перестать ставить во что-либо» и в русском естественно относится к храму как объекту общественного почитания.
- source_word: μέλλειν τε καὶ καθαιρεῖσθαι τῆς μεγαλειότητος αὐτῆς
  choice: сама она может лишиться своего величия
  rationale: Сохраняет трудную и сжатую мысль греческого текста об ожидаемом умалении высокого статуса или великолепия Артемиды, не уточняя сверх текста способ этого умаления.
- source_word: ὅλη ἡ Ἀσία
  choice: вся Азия
  rationale: Сохраняет риторический охват; исторически имеется в виду прежде всего римская провинция Азия.
- source_word: ἡ οἰκουμένη
  choice: весь мир
  rationale: Естественный русский эквивалент; более буквальный смысл «обитаемый мир» сохранён в сноске.
- source_word: σέβεται
  choice: поклоняются
  rationale: Точно передаёт религиозное почитание в контексте культа Артемиды.
theological_decisions:
- issue: Передача языческой религиозной речи без смягчения или одобрения
  choice: великая богиня Артемида ... которой поклоняются
  alternative: так называемая великая богиня Артемида ... которую почитают
  rationale: Это прямая передача слов Димитрия. Греческий текст не содержит авторской оговорки «так называемая», поэтому перевод не добавляет её и не ослабляет культовое значение глагола.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной речи. Синтаксис несколько риторичен, что соответствует речи Димитрия, но остаётся понятным обычному читателю. Все маркеры сносок включены в основной текст.
