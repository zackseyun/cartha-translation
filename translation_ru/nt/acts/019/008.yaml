revisions:
- from: Войдя в синагогу, он три месяца смело говорил о Царстве Божьем, рассуждая и стараясь убедить слушателей.[a]
  to: Войдя в синагогу, он три месяца смело говорил, рассуждая о Царстве Божьем и убеждая слушателей.
  rationale: Убрана ненужная сноска, поскольку вариант «стараясь убедить» не является необходимой лексической альтернативой и может менее точно отражать πείθων. Редакция сохраняет открытость вопроса о результате убеждения, естественно передаёт два греческих причастия и яснее связывает рассуждение с темой Царства Божьего.
