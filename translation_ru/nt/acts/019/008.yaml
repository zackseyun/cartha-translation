  text: Εἰσελθὼν δὲ εἰς τὴν συναγωγὴν ἐπαρρησιάζετο ἐπὶ μῆνας τρεῖς διαλεγόμενος καὶ ⸀πείθων περὶ τῆς βασιλείας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/008.yaml
  text: And entering the synagogue[a], he spoke boldly for three months[b], reasoning and persuading them about the kingdom of God.
translation:
  language: ru
  text: Войдя в синагогу, он три месяца смело говорил, рассуждая о Царстве Божьем и убеждая слушателей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσελθὼν
  choice: Войдя
  rationale: Аористное причастие задаёт обстоятельство, предшествующее основному действию; деепричастие естественно передаёт эту связь по-русски.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Слабый повествовательный связующий элемент; в данном русском предложении отдельное «и» или «затем» было бы избыточным.
- source_word: συναγωγήν
  choice: синагогу
  rationale: Точный и общепринятый термин для иудейской синагоги.
- source_word: ἐπαρρησιάζετο
  choice: смело говорил
  rationale: Имперфект передаёт продолжительное открытое и дерзновенное говорение; длительность дополнительно выражена словами «три месяца».
- source_word: ἐπὶ μῆνας τρεῖς
  choice: три месяца
  rationale: ἐπί с винительным падежом обозначает продолжительность времени.
- source_word: διαλεγόμενος
  choice: рассуждая
  rationale: Передаёт аргументированное изложение и обсуждение, не придавая речи излишне конфликтного оттенка.
- source_word: πείθων
  choice: стараясь убедить слушателей
  rationale: Передаёт направленное на убеждение действие, не утверждая однозначно, что все слушатели действительно были убеждены; подразумеваемый объект обозначен естественно для русского языка.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: о Царстве Божьем
  rationale: Естественно передаёт περί с родительным падежом и сохраняет традиционный, узнаваемый новозаветный термин.
theological_decisions:
- issue: Результативность πείθων
  choice: стараясь убедить слушателей
  alternative: убеждая слушателей
  rationale: Греческое причастие может обозначать деятельность, направленную на убеждение, без обязательного указания на достигнутый результат; основной текст не должен подразумевать всеобщий успех проповеди.
- issue: Значение βασιλεία τοῦ θεοῦ
  choice: Царство Божье
  alternative: владычество Бога
  rationale: «Царство Божье» сохраняет устойчивую библейскую формулу, тогда как значение Божьего правления остаётся заключённым в самом понятии и не требует однозначного истолкования в тексте.
- issue: Неявный объект πείθων
  choice: слушателей
  alternative: не указывать объект
  rationale: В русском языке глагол «убедить» обычно требует объекта; «слушателей» ясно выражает подразумеваемых присутствующих в синагоге, не ограничивая их более узкой группой.
translation_notes:
  register: 'Современный литературный русский язык с ясным, достойным повествовательным строем. Порядок слов слегка перестроен: тема Царства Божьего отнесена к содержанию всей речи, а два причастия переданы как сопутствующие способы её ведения.'
