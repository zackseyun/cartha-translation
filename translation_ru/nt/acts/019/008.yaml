    rationale: Этот оборот может создавать более выраженный оттенок недостигнутого результата, чем требует греческий текст. «Убеждая» передаёт саму деятельность и оставляет её результат неуказанным.
  - severity: low
    issue: Связь «о Царстве Божьем» с последующими действиями
    rationale: В исходной формулировке тема поставлена при «говорил», хотя греческая конструкция непосредственно сочетает рассуждение и убеждение с темой Царства. Перестановка делает смысловую связь прозрачнее.
