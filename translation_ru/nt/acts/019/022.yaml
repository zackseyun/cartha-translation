  text: ἀποστείλας δὲ εἰς τὴν Μακεδονίαν δύο τῶν διακονούντων αὐτῷ, Τιμόθεον καὶ Ἔραστον, αὐτὸς ἐπέσχεν χρόνον εἰς τὴν Ἀσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/022.yaml
  text: So after sending into Macedonia two of those who were ministering to him—Timothy and Erastus—he himself stayed for a time in Asia[a].
translation:
  language: ru
  text: Послав в Македонию двух из тех, кто служил ему, — Тимофея и Эраста, — сам он некоторое время оставался в Азии[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть римская провинция Азия в западной части Малой Азии, а не современный континент Азия.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποστείλας
  choice: Послав
  rationale: Аористное причастие обозначает действие, предшествующее основному; русское деепричастие естественно и точно передаёт эту последовательность.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Здесь δέ служит мягкой связкой, продвигающей повествование; в современном русском её отдельная передача была бы тяжеловесной, а связь ясна из контекста.
- source_word: εἰς τὴν Μακεδονίαν
  choice: в Македонию
  rationale: Предлог εἰς указывает направление к области; нормативное русское выражение — «в Македонию».
- source_word: δύο τῶν διακονούντων αὐτῷ
  choice: двух из тех, кто служил ему
  rationale: Формулировка сохраняет партитивную конструкцию и широкое значение διακονέω, не превращая служение в формальную должность.
- source_word: Τιμόθεον καὶ Ἔραστον
  choice: Тимофея и Эраста
  rationale: Использованы закрепившиеся в русской библейской традиции формы имён.
- source_word: αὐτὸς
  choice: сам он
  rationale: Сохранено эмфатическое противопоставление Павла двум посланным им сотрудникам.
- source_word: ἐπέσχεν χρόνον
  choice: ещё некоторое время оставался
  rationale: Оборот передаёт пребывание в данном месте в течение некоторого времени; «оставался» естественно звучит в повествовании, а «ещё» подчёркивает продолжение пребывания.
- source_word: εἰς τὴν Ἀσίαν
  choice: в Азии
  rationale: При глагольном обороте со значением пребывания εἰς имеет здесь локативный смысл. Географическое название оставлено кратким, а его историческое значение разъяснено в сноске.
