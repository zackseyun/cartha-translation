lexical_decisions:
- source_word: ἐπιθέντος αὐτοῖς τοῦ Παύλου χεῖρας
  choice: когда Павел возложил на них руки
  rationale: Генитив абсолютный с аористным причастием естественно передан придаточным времени; устойчивое выражение «возложил руки» сохраняет образ греческого текста.
- source_word: ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς
  choice: на них сошёл Святой Дух
  rationale: Глагол движения с ἐπί передаёт направленность действия; «сошёл на них» — естественная для русского библейского повествования формулировка без дополнительных догматических выводов.
- source_word: ἐλάλουν
  choice: стали говорить
  rationale: Имперфект в данном повествовательном контексте допускает начинательное понимание и обозначает развернувшееся действие; «стали говорить» естественно передаёт его наступление и длительность.
- source_word: γλώσσαις
  choice: на языках
  rationale: Формулировка сохраняет многозначность греческого слова γλῶσσα и не определяет, идёт ли речь об известных человеческих языках или об ином виде вдохновлённой речи.
- source_word: ἐπροφήτευον
  choice: пророчествовать
  rationale: Прямой и общепонятный эквивалент глагола, обозначающего пророческую речь; инфинитив зависит от «стали» и вместе с первым глаголом передаёт продолжающееся действие.
- source_word: τε ... καί
  choice: и ... и
  rationale: Связывает два одновременных проявления в естественной русской конструкции.
theological_decisions:
- issue: Характер речи, обозначенной словом γλώσσαις
  choice: на языках
  alternative: на разных языках
  rationale: Греческое слово само по себе не разрешает спор о том, были ли это известные человеческие языки или иная вдохновлённая речь. Основной текст сохраняет эту неоднозначность.
- issue: Сошествие Святого Духа
  choice: на них сошёл Святой Дух
  alternative: Святой Дух пришёл на них
  rationale: Перевод передаёт описанное событие и направленность ἐπί, не вводя в стих позднейших объяснений о порядке, причине или сакраментальном механизме происходящего.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Порядок «на них сошёл Святой Дух» сохраняет направленность греческой конструкции и избегает тяжеловесности. Маркер сноски помещён непосредственно после спорного выражения.
