  text: τοῦτο δὲ ἐγένετο ἐπὶ ἔτη δύο, ὥστε πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου, Ἰουδαίους τε καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/010.yaml
  text: This continued for two years[a], so that all who lived in Asia heard the word of the Lord, both Jews and Greeks.
translation:
  language: ru
  text: Так продолжалось два года, и в результате все жители Асии[a] услышали слово Господа — и иудеи, и греки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Асия — римская провинция на западе Малой Азии, а не современная часть света Азия.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο δὲ ἐγένετο
  choice: Так продолжалось
  rationale: Оборот отсылает к описанному в предыдущем стихе регулярному наставлению и обозначает его продолжительность; по-русски «так продолжалось» естественно передаёт длительное действие.
- source_word: ἐπὶ ἔτη δύο
  choice: два года
  rationale: ἐπί с винительным падежом обозначает продолжительность времени; в сочетании с «продолжалось» естественно сказать «два года».
- source_word: ὥστε
  choice: и в результате
  rationale: Союз вводит следствие предшествующего действия. Такая формулировка яснее сохраняет результативное значение, чем потенциально целевое «чтобы».
- source_word: πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν
  choice: все жители Асии
  rationale: Субстантивированное причастие означает живущих в данной области, а πάντας сохраняет всеобщий охват. «Асия» — принятое русское историко-библейское название римской провинции, позволяющее отличить её от современного континента Азия.
- source_word: ἀκοῦσαι
  choice: услышали
  rationale: Аористный инфинитив после ὥστε выражает достигнутый результат; «услышали» прямо и естественно передаёт это значение.
- source_word: τὸν λόγον
  choice: слово
  rationale: «Слово» сохраняет повторяющуюся у Луки формулу, обозначающую возвещаемую весть, и её богословскую выразительность.
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: Родительный падеж относится к «слову»; κύριος в данном контексте естественно передаётся традиционным и понятным титулом «Господь».
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: и иудеи, и греки
  rationale: Парная конструкция «и… и…» естественно передаёт включающее сочетание τε καὶ и подчёркивает обе названные группы.
theological_decisions:
- issue: Значение географического названия Ἀσία
  choice: Римская провинция Асия на западе Малой Азии
  alternative: Современная Азия как часть света
  rationale: В Деяниях Ἀσία обозначает римскую провинцию. В основном тексте сохранено краткое собственное имя, а историческое уточнение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Фраза построена ясно и естественно; сохранены результативная связь, универсальный охват и традиционные термины «слово Господа», «иудеи» и «греки».
