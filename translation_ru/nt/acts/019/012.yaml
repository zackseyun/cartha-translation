id: ACT.19.12
reference: Acts 19:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὥστε καὶ ἐπὶ τοὺς ἀσθενοῦντας ⸀ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ σουδάρια ἢ σιμικίνθια καὶ ἀπαλλάσσεσθαι ἀπ’ αὐτῶν τὰς νόσους, τά τε πνεύματα τὰ πονηρὰ ⸀ἐκπορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/012.yaml
  text: so that even handkerchiefs or work aprons were carried away from his body to the sick[a], and the diseases left them[b], and the evil spirits went out.
translation:
  language: ru
  text: так что даже платки или рабочие фартуки[b] с его тела[a] относили к больным, и болезни оставляли их, и злые духи выходили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с его кожи».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рабочие передники». Греческое слово обозначает фартук или другую рабочую одежду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: так что
  rationale: Передаёт следствие необычайных чудес, о которых говорится в предыдущем стихе, и сохраняет связь с контекстом.
- source_word: ἐπὶ τοὺς ἀσθενοῦντας
  choice: к больным
  rationale: Кратко и естественно передаёт направленность движения к тем, кто болел.
- source_word: ἀποφέρεσθαι
  choice: относили
  rationale: Естественная русская безлично-активная конструкция передаёт, что эти предметы переносили от Павла к больным, не уточняя не названных в тексте исполнителей.
- source_word: ἀπὸ τοῦ χρωτὸς αὐτοῦ
  choice: с его тела
  rationale: По-русски естественно передаёт происхождение предметов с поверхности тела; буквальное значение χρώς «кожа» сохранено в сноске.
- source_word: σουδάρια
  choice: платки
  rationale: Обозначает небольшие куски ткани, в том числе использовавшиеся для вытирания лица или пота; «платки» понятно и не перегружает текст уточнением.
- source_word: σιμικίνθια
  choice: рабочие фартуки
  rationale: Передаёт предмет рабочей одежды, вероятно фартук или передник, связанный с ручным трудом.
- source_word: ἀπαλλάσσεσθαι
  choice: оставляли их
  rationale: С болезнями в роли подлежащего эта формулировка естественно выражает прекращение болезни и сохраняет образ её удаления от людей.
- source_word: νόσους
  choice: болезни
  rationale: Точно передаёт множественное число и общее обозначение заболеваний.
- source_word: πνεύματα τὰ πονηρά
  choice: злые духи
  rationale: Прямое и общепонятное обозначение враждебных духовных существ без добавочного истолкования.
- source_word: ἐκπορεύεσθαι
  choice: выходили
  rationale: Сохраняет обычный новозаветный способ описания выхода духов из людей.
theological_decisions:
- issue: Характер исцелений и изгнания духов посредством предметов, побывавших у Павла
  choice: Передать событие прямо, как оно изложено повествователем, без объяснения механизма действия.
  alternative: Истолковать предметы как реликвии либо представить случившееся как чисто символическое событие.
  rationale: Греческий текст утверждает необычайное исцеление и выход злых духов, но не формулирует учения о почитании предметов и не предлагает рационализирующего объяснения.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет последовательность результатов, выраженную повтором союза «и». Формулировка проста и достойна, без архаизации и без привнесения позднейших конфессиональных толкований.
