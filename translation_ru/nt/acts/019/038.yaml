base_translation:
  language: en
  yaml_path: translation/nt/acts/019/038.yaml
  text: If[a], then, Demetrius and the craftsmen with him have a complaint against anyone, court sessions are being held and there are proconsuls[b]; let them bring charges against one another.
translation:
  language: ru
  text: 'Итак, если у Димитрия и ремесленников, которые с ним, есть жалоба на кого-либо, то идут судебные заседания и имеются проконсулы[a]: пусть они предъявляют обвинения друг другу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проконсулы находятся на месте (доступны для разбирательства)». Множественное число может обозначать проконсульскую власть или должность в общем административном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: Итак, если ... то
  rationale: «Итак» передаёт выводно-переходную силу οὖν, а конструкция «если... то» естественно отражает условие; μέν отдельно не перегружает русскую фразу.
- source_word: Δημήτριος
  choice: Димитрий
  rationale: Традиционная и естественная русская форма греческого имени.
- source_word: οἱ σὺν αὐτῷ τεχνῖται
  choice: ремесленники, которые с ним
  rationale: «Ремесленники» передаёт значение квалифицированных мастеров, а «которые с ним» сохраняет нейтральность σὺν αὐτῷ, не уточняя характер их связи.
- source_word: ἔχουσιν πρός τινα λόγον
  choice: есть жалоба на кого-либо
  rationale: 'Оборот имеет юридический смысл: речь идёт о претензии или основании для разбирательства. «Жалоба» ясно передаёт этот смысл без предположения, что дело уже возбуждено.'
- source_word: ἀγοραῖοι ἄγονται
  choice: судебные заседания проводятся
  rationale: Выражение обозначает официально созываемые судебные разбирательства; перевод сохраняет пассивную форму и понятен современному читателю.
- source_word: ἀνθύπατοί εἰσιν
  choice: проконсулы есть
  rationale: Сохранено множественное число источника и институциональный характер высказывания, хотя такая формулировка намеренно несколько необычна по-русски.
- source_word: ἐγκαλείτωσαν ἀλλήλοις
  choice: пусть они предъявляют обвинения друг другу
  rationale: Глагол употреблён в судебно-правовом смысле, а взаимное местоимение сохранено без сведения ситуации к одностороннему иску.
