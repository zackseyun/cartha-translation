id: ACT.19.16
reference: Acts 19:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ⸀ἐφαλόμενος ⸂ὁ ἄνθρωπος ἐπ’ αὐτοὺς⸃ ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρὸν ⸂κατακυριεύσας ἀμφοτέρων⸃ ἴσχυσεν κατ’ αὐτῶν, ὥστε γυμνοὺς καὶ τετραυματισμένους ἐκφυγεῖν ἐκ τοῦ οἴκου ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/016.yaml
  text: And the man in whom the evil spirit was leaped on them[a], and after overpowering both of them, prevailed against them[c][b], so that they fled out of that house naked and wounded.
translation:
  language: ru
  text: И человек, в котором был злой дух, набросился на них[a] и, одолев обоих[b], взял над ними верх, так что они нагими и израненными бежали из того дома[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прыгнул на них»; «кинулся на них».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «обоих». Хотя в более широком контексте упомянуто больше двух сыновей Скевы, здесь греческий текст прямо говорит о двоих.'
    reason: textual_tension
  - marker: c
    text: 'Или: «спаслись бегством из того дома».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφαλόμενος
  choice: набросился на
  rationale: Причастие от ἐφάλλομαι передаёт внезапный физический прыжок или бросок на противников. «Набросился на» естественно по-русски выражает стремительность и насилие действия.
- source_word: ὁ ἄνθρωπος
  choice: человек
  rationale: Существительное обозначает конкретного мужчину, однако в русском повествовании «человек» точно и естественно соответствует греческому ἄνθρωπος.
- source_word: ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρόν
  choice: в котором был злой дух
  rationale: Формулировка близко следует греческой относительной конструкции и не заменяет её более поздним техническим термином.
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: злой дух
  rationale: Это ясное и традиционно понятное соответствие, обозначающее злобного, пагубного духа.
- source_word: κατακυριεύσας
  choice: одолев
  rationale: Глагол выражает установление господства или превосходства. «Одолев» передаёт силовую победу и не дублирует дословно последующий оборот.
- source_word: ἀμφοτέρων
  choice: обоих
  rationale: Греческий текст прямо указывает на двоих. Перевод сохраняет эту деталь, не сглаживая её несогласованность с упоминанием более многочисленной группы в контексте.
- source_word: ἴσχυσεν κατ’ αὐτῶν
  choice: взял над ними верх
  rationale: Естественный русский оборот передаёт значение «оказался сильнее их, одержал над ними верх» и сохраняет отдельность этого действия от κατακυριεύσας.
- source_word: γυμνούς
  choice: нагими
  rationale: Прилагательное обозначает состояние наготы. «Нагими» точно, кратко и уместно для dignified narrative register, не добавляя предположения, что одежда была сорвана.
- source_word: τετραυματισμένους
  choice: израненными
  rationale: Совершенное страдательное причастие указывает, что они были ранены и оставались в таком состоянии. «Израненными» естественно передаёт множественные или заметные ранения без добавления слова «тяжело».
- source_word: ἐκφυγεῖν ἐκ τοῦ οἴκου ἐκείνου
  choice: бежали из того дома
  rationale: Оборот с ὥστε выражает результат, а ἐκφυγεῖν сочетает бегство и спасение. Основной текст передаёт движение прочь из конкретного дома; оттенок спасения бегством отмечен в сноске.
theological_decisions:
- issue: Описание пребывания злого духа в человеке
  choice: человек, в котором был злой дух
  alternative: человек, одержимый злым духом
  rationale: Выбранная формулировка воспроизводит пространственный образ греческого текста и не вводит техническое богословское обозначение, которого здесь прямо нет.
- issue: Соотношение ἀμφοτέρων с более широкой группой сыновей Скевы
  choice: обоих
  alternative: всех их
  rationale: Несмотря на упоминание семерых в предшествующем контексте, данный греческий текст прямо говорит «обоих». Перевод сохраняет напряжение текста и не разрешает его посредством смыслового исправления.
translation_notes:
  register: Современный литературный русский язык с ясным, энергичным повествованием. «Нагими» сохраняет достоинство библейского регистра, не становясь архаизмом; «набросился» и «взял верх» делают последовательность насильственных действий естественной для современного читателя.
