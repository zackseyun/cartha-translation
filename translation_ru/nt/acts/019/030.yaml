translation:
  language: ru
  text: Но когда Павел хотел войти в народное собрание[a], ученики не давали ему войти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в собрание» или «в толпу». Греческое слово δῆμος в данном гражданском контексте может обозначать собравшийся публичный народ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παύλου δὲ … βουλομένου
  choice: Когда же Павел захотел
  rationale: Генитивная абсолютная конструкция передана естественным русским придаточным времени; «же» отмечает мягкий контраст с предыдущим повествованием.
- source_word: εἰσελθεῖν
  choice: выйти
  rationale: В данном контексте Павел намеревался появиться перед людьми, собравшимися в театре; русское «выйти к» естественно передаёт направленное движение к собранию, не подразумевая выхода из города или здания.
- source_word: εἰς τὸν δῆμον
  choice: к собравшемуся народу
  rationale: δῆμος здесь обозначает собравшийся публично народ, возможно гражданское собрание. Формулировка сохраняет связь и с людьми, и с фактом их собрания, не утверждая, что это было законно созванное собрание.
- source_word: οὐκ εἴων αὐτὸν
  choice: не позволили ему
  rationale: Имперфект εἴων выражает продолжавшееся воспрепятствование или отказ; по-русски результативное «не позволили» кратко и естественно передаёт смысл в этом эпизоде.
- source_word: οἱ μαθηταί
  choice: ученики
  rationale: Буквальное и контекстуально ясное обозначение последователей Иисуса; притяжательное «его» в греческом тексте отсутствует.
