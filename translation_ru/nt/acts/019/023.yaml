lexical_decisions:
- source_word: Ἐγένετο
  choice: поднялось
  rationale: Глагол вводит возникновение события; «поднялось» естественно сочетается с «волнение» и сохраняет динамический характер выражения.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Слабый повествовательный связующий элемент в русском здесь естественно передаётся самим переходом к новому событию; отдельное «же» или «тогда» было бы избыточно.
- source_word: κατὰ τὸν καιρὸν ἐκεῖνον
  choice: в то время
  rationale: Кратко и точно передаёт временную отсылку.
- source_word: τάραχος
  choice: волнение
  rationale: Обозначает общественное возбуждение и беспорядок, не предрешая на этой стадии более узкое значение «мятеж» или «бунт».
- source_word: οὐκ ὀλίγος
  choice: немалое
  rationale: Сохраняет литоту оригинала и естественно звучит по-русски.
- source_word: περὶ
  choice: из-за
  rationale: В данном повествовательном контексте указывает на повод волнения; «из-за» естественнее русского «по поводу» и не добавляет лишней конкретики.
- source_word: τῆς ὁδοῦ
  choice: Пути
  rationale: В Деяниях это устойчивое обозначение христианского движения; прописная буква помогает распознать особое употребление, не превращая его в добавленный термин.
theological_decisions:
- issue: Передача τῆς ὁδοῦ как обозначения христианского движения
  choice: Пути
  alternative: пути
  rationale: Контекст и повторяющееся употребление в Деяниях указывают на узнаваемое название движения. Прописная буква передаёт эту функцию, а сноска сохраняет для читателя буквальную альтернативу.
translation_notes:
