source:
  edition: SBLGNT
  text: πολλοί τε τῶν πεπιστευκότων ἤρχοντο ἐξομολογούμενοι καὶ ἀναγγέλλοντες τὰς πράξεις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/018.yaml
  text: And many of those who had believed were coming[a], confessing and disclosing their practices.
translation:
  language: ru
  text: Многие из уверовавших приходили, признаваясь и рассказывая о своих делах[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о своих поступках»; возможно: «о том, что они делали».'
    reason: Лексема πρᾶξις допускает значения «дело», «поступок», «занятие, практика».
lexical_decisions:
- source_word: πολλοί τε
  choice: Многие
  rationale: «Многие» естественно передаёт количественное значение πολλοί; продолжительная частица τε отражена связью с повествовательным контекстом без тяжеловесного отдельного союза.
- source_word: τῶν πεπιστευκότων
  choice: из уверовавших
  rationale: Субстантивированное перфектное причастие указывает на тех, кто ранее уверовал и продолжает находиться в соответствующем состоянии; «уверовавших» сохраняет эту динамику, не превращая выражение в специальное групповое наименование.
- source_word: ἤρχοντο
  choice: приходили
  rationale: Русская форма несовершенного вида естественно передаёт длительное или повторявшееся действие греческого имперфекта, не усиливая его до «продолжали приходить».
- source_word: ἐξομολογούμενοι
  choice: признаваясь
  rationale: Передаёт открытое признание, но не вводит прямо отсутствующее в греческом дополнение «в грехах» и не придаёт фразе обязательного обрядового смысла.
- source_word: ἀναγγέλλοντες
  choice: рассказывая
  rationale: В данном контексте означает сообщать, делать известным; «рассказывая» звучит естественно и отличает это действие от признания.
- source_word: τὰς πράξεις αὐτῶν
  choice: о своих делах
  rationale: πρᾶξις может обозначать дела, поступки или практику. «О своих делах» сохраняет широту слова и не сужает его исключительно до магии или грехов, хотя контекст допускает связь с прежними магическими занятиями.
theological_decisions:
- issue: Передавать ли πεπιστευκότων как устойчивое название группы («верующие») или как описание предшествующего уверования.
  choice: из уверовавших
  alternative: из верующих
  rationale: Перфектное причастие естественно выделяет совершившееся уверование с сохраняющимся результатом. Выбранный вариант не вводит более техническое церковное обозначение.
- issue: Относится ли τὰς πράξεις αὐτῶν исключительно к грехам или магическим занятиям.
  choice: о своих делах
  alternative: о своих магических занятиях; о своих грехах
  rationale: Ближайший контекст связан с магией, однако само существительное шире. Перевод сохраняет контекстуальную возможность, не делая её явным содержанием слова.
- issue: Имеет ли ἐξομολογούμενοι обязательный обрядовый смысл.
  choice: признаваясь
  alternative: исповедуясь
  rationale: «Признаваясь» передаёт открытое признание и избегает возможной конфессионально-обрядовой конкретизации, которой греческая форма сама по себе не требует.
translation_notes:
  register: Современный литературный русский язык; ясный и достойный повествовательный стиль. Несовершенный вид «приходили» сохраняет длительность или повторяемость действия, а два деепричастия передают сопутствующие действия без излишней догматической конкретизации.
