  text: ἐπιγνόντες δὲ ὅτι Ἰουδαῖός ἐστιν φωνὴ ἐγένετο μία ἐκ πάντων ⸀ὡς ἐπὶ ὥρας δύο κραζόντων· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/034.yaml
  text: But when they recognized that he was a Jew[a], one voice arose from them all, crying out for about two hours, “Great is Artemis of the Ephesians!”
translation:
  language: ru
  text: 'Но когда они узнали, что он иудей[a], все в один голос около двух часов кричали: «Велика Артемида Эфесская!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «житель Иудеи». Греческое слово может обозначать как иудея, так и человека из Иудеи; здесь вероятнее более широкое этнорелигиозное значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: когда они узнали
  rationale: Аористное причастие обозначает предшествующее обстоятельство; придаточное времени естественно передаёт распознание толпой принадлежности Александра.
- source_word: δὲ
  choice: но
  rationale: Союз отмечает контраст с предшествующей попыткой Александра обратиться к собравшимся.
- source_word: Ἰουδαῖός
  choice: иудей
  rationale: В диаспорном контексте речь, вероятнее всего, об этнорелигиозной принадлежности, а не только о происхождении из Иудеи.
- source_word: φωνὴ ἐγένετο μία ἐκ πάντων
  choice: все в один голос
  rationale: Естественная русская идиома сохраняет смысл единодушного общего возгласа, выраженный буквальным образом «один голос от всех».
- source_word: ὡς ἐπὶ ὥρας δύο
  choice: около двух часов
  rationale: ὡς при обозначении меры передаёт приблизительность длительности.
- source_word: κραζόντων
  choice: кричали
  rationale: Форма настоящего причастия описывает продолжавшийся громкий крик; русская личная форма естественно соединяется с идиомой «в один голос».
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: Велика Артемида Эфесская!
  rationale: Сохраняется торжественно-возгласный порядок слов; определение «Эфесская» естественно передаёт связь богини с эфесянами.
theological_decisions:
- issue: Передача Ἰουδαῖος
  choice: иудей
  alternative: житель Иудеи
  rationale: В Эфесе реакция толпы обусловлена распознанной этнорелигиозной принадлежностью Александра; географический смысл возможен у слова вообще, но здесь менее вероятен.
translation_notes:
  register: Современный литературный русский язык; фраза «все в один голос» делает греческую конструкцию естественной, сохраняя акцент на единстве толпы. Возглас передан кратко и торжественно.
