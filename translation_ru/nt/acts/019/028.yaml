  text: When they heard this and became full of wrath[a], they were crying out, saying, “Great is Artemis of the Ephesians!”
translation:
  language: ru
  text: 'Услышав это и исполнившись ярости[a], они стали кричать: «Велика Артемида Эфесская!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исполнившись гнева», «придя в ярость». Буквально: «став полными ярости»; греческое слово θυμός обозначает сильный гнев, ярость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: Услышав это
  rationale: Аористное причастие обозначает предшествующее обстоятельство; объект «это» подразумевается контекстом и естественно выражается по-русски.
- source_word: δὲ
  choice: не передано отдельно
  rationale: Здесь δέ служит слабой связкой; русская конструкция с последовательными деепричастиями не требует отдельного союза.
- source_word: γενόμενοι πλήρεις θυμοῦ
  choice: исполнившись ярости
  rationale: Передаёт образ наполненности и высокую степень сильного гнева, оставаясь естественным и достойным по стилю.
- source_word: ἔκραζον
  choice: стали кричать
  rationale: Имперфект указывает на начавшийся и продолжавшийся крик; сочетание «стали кричать» естественно передаёт эту длительность в данном повествовании.
- source_word: λέγοντες
  choice: двоеточие перед прямой речью
  rationale: В русском языке содержание крика естественно вводится двоеточием без избыточного «говоря».
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: Велика Артемида Эфесская!
  rationale: Сохраняет торжественный, скандируемый порядок слов; «Эфесская» естественно передаёт родительный Ἐφεσίων как устойчивое обозначение богини, почитаемой эфесянами.
theological_decisions:
- issue: Передача языческого возгласа без богословского одобрения или смягчения
  choice: «Велика Артемида Эфесская!»
  alternative: «Артемида эфесян велика!»
  rationale: Прямая речь точно сообщает возглас толпы, не превращая его в утверждение переводчика и не ослабляя идолопоклоннического содержания сцены.
translation_notes:
