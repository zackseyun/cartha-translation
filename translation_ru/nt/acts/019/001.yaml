  text: Ἐγένετο δὲ ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ Παῦλον διελθόντα τὰ ἀνωτερικὰ μέρη ⸀ἐλθεῖν εἰς Ἔφεσον καὶ ⸀εὑρεῖν τινας μαθητάς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/001.yaml
  text: It happened that while Apollos was in Corinth[a], Paul passed through the inland regions and came to Ephesus and found some disciples[b],
translation:
  language: ru
  text: Случилось, что во время пребывания Аполлоса в Коринфе Павел, пройдя через внутренние области[a], пришёл в Эфес и нашёл некоторых учеников[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верхние области», «возвышенные районы». Вероятно, речь идёт о пути через внутренние возвышенные области, а не по прибрежной дороге.'
    reason: lexical_alternative
  - marker: b
    text: Здесь не уточняется, чьими учениками они были. Из последующих стихов видно, что они были связаны с крещением Иоанна.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Случилось так, что
  rationale: Передаёт повествовательную переходную формулу Луки естественным современным русским языком; отдельное «теперь» не добавляется, поскольку в греческом нет явного временного наречия.
- source_word: ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ
  choice: пока Аполлос находился в Коринфе
  rationale: Конструкция ἐν τῷ с инфинитивом выражает одновременность; «пока» ясно и естественно передаёт это временное отношение.
- source_word: διελθόντα τὰ ἀνωτερικὰ μέρη
  choice: прошёл через внутренние области
  rationale: Причастие указывает на предшествующее перемещение через местность. ἀνωτερικά буквально может означать «верхние», но здесь, вероятно, обозначает внутренние, возвышенные районы в противоположность прибрежному пути; неоднозначность отмечена в сноске.
- source_word: ἐλθεῖν εἰς Ἔφεσον
  choice: пришёл в Эфес
  rationale: Прямо и естественно передаёт движение к городу и зависимость инфинитива от повествовательной формулы.
- source_word: καὶ εὑρεῖν τινας μαθητάς
  choice: и нашёл нескольких учеников
  rationale: «Нашёл» сохраняет обычное значение εὑρίσκω, «нескольких» естественно передаёт неопределённое τινας, а «учеников» оставляет их принадлежность неуточнённой, как и греческий текст.
theological_decisions:
- issue: Кого обозначает μαθητάς
  choice: учеников
  alternative: учеников Иоанна; учеников Иисуса
  rationale: Сам стих не уточняет, чьими учениками они были. Последующие стихи связывают их с крещением Иоанна, однако перевод не должен заранее устранять сохранённую Лукой неопределённость.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Формулировка сохраняет достоинство библейского повествования, не архаизируя речь и не конкретизируя сверх сказанного в греческом тексте.
