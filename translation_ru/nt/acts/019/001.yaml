  terminology: «Ученики» корректно и нейтрально передаёт μαθητάς; не следует уточнять их принадлежность в основном тексте. Географическое «внутренние области» — обоснованный контекстуальный перевод, а сноска надлежащим образом сохраняет буквальную альтернативу «верхние области». Имена и «крещение Иоанна» переданы нормативно.
