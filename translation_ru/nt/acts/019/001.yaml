  source_fidelity: 'Основной смысл передан точно: χρονальная связь пребывания Аполлоса в Коринфе, путь Павла через τὰ ἀνωτερικὰ μέρη, прибытие в Эфес и встреча с неопределённо обозначенными μαθητάς сохранены. Однако «нескольких» несколько сужает неопределённое τινας до малой численности; «некоторых» точнее передаёт греческую неопределённость без такого оттенка.'
