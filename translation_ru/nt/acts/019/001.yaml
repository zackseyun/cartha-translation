revisions:
- from: Случилось так, что, пока Аполлос находился в Коринфе, Павел прошёл через внутренние области[a], пришёл в Эфес и нашёл нескольких учеников[b].
  to: Случилось, что во время пребывания Аполлоса в Коринфе Павел, пройдя через внутренние области[a], пришёл в Эфес и нашёл некоторых учеников[b].
  rationale: Сохранена повествовательная формула Ἐγένετο δέ, но синтаксис сделан более плавным. «Некоторых» заменяет «нескольких», чтобы не вносить невыраженное ограничение числа. Сноски сохранены, поскольку они корректно отмечают географическую неоднозначность и не предвосхищают идентичность учеников.
