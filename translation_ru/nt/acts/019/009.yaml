revisions:
- from: Но когда некоторые ожесточались и не покорялись[a], злословя Путь[b] перед собравшимися, он отошёл от них, отделил учеников и каждый день вёл беседы в лекционном зале Тиранна[c].
  to: Но когда некоторые ожесточались и отказывались верить[a], злословя Путь[b] перед собравшимися, он отошёл от них и отделил от них учеников; каждый день он вёл беседы в лекционном зале Тиранна[c].
  rationale: 'Исправлены две точки, где русский текст был менее ясен, чем греческий контекст: для ἠπείθουν выбран естественный контекстуальный вариант «отказывались верить» с сохранением иных лексических возможностей в примечании; связь отделения учеников с противниками сделана явной. Повтор «от них» соответствует последовательности греческих глагольных действий и не вносит нового факта.'
