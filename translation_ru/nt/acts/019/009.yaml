id: ACT.19.9
reference: Acts 19:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὡς δέ τινες ἐσκληρύνοντο καὶ ἠπείθουν κακολογοῦντες τὴν ὁδὸν ἐνώπιον τοῦ πλήθους, ἀποστὰς ἀπ’ αὐτῶν ἀφώρισεν τοὺς μαθητάς, καθ’ ἡμέραν διαλεγόμενος ἐν τῇ σχολῇ ⸀Τυράννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/009.yaml
  text: But when some became hardened and disobedient[a], speaking evil of the Way before the crowd, he withdrew from them and set apart the disciples[c][b], reasoning daily in the lecture hall of Tyrannus.
translation:
  language: ru
  text: Но когда некоторые ожесточались и отказывались верить[a], злословя Путь[b] перед собравшимися, он отошёл от них и отделил от них учеников; каждый день он вёл беседы в лекционном зале Тиранна[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не покорялись»; или: «не поддавались убеждению».'
    reason: lexical_alternative
  - marker: b
    text: «Путь» — одно из ранних названий движения последователей Иисуса в книге Деяний.
    reason: cultural_note
  - marker: c
    text: 'Или: «в школе Тиранна».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκληρύνοντο
  choice: ожесточались
  rationale: Имперфект передаёт продолжавшийся процесс сопротивления; возвратная форма естественно сохраняет возможную среднюю окраску, не решая однозначно вопрос о действующем лице.
- source_word: ἠπείθουν
  choice: не покорялись
  rationale: Передаёт волевой и нравственный оттенок ἀπειθέω, а примечание сохраняет возможные значения неверия и отказа убеждаться.
- source_word: κακολογοῦντες
  choice: злословя
  rationale: Выражает враждебную публичную речь, не сужая значение до юридически понимаемой клеветы.
- source_word: τὴν ὁδὸν
  choice: Путь
  rationale: В Деяниях это устойчивое обозначение раннего движения последователей Иисуса; прописная буква помогает распознать его как наименование.
- source_word: ἐνώπιον τοῦ πλήθους
  choice: перед собравшимися
  rationale: Естественно по-русски передаёт публичный характер выступления и значение πλήθος как находившегося там множества людей.
- source_word: ἀποστὰς ἀπ’ αὐτῶν
  choice: он отошёл от них
  rationale: Передаёт решительное удаление Павла от противников без излишнего уточнения характера разрыва.
- source_word: ἀφώρισεν
  choice: отделил
  rationale: Сохраняет прямое значение намеренного обособления учеников от враждебной группы.
- source_word: τοὺς μαθητάς
  choice: учеников
  rationale: Стандартное и контекстуально уместное обозначение последователей и учащихся.
- source_word: καθ’ ἡμέραν
  choice: каждый день
  rationale: Естественно и ясно передаёт регулярность действия.
- source_word: διαλεγόμενος
  choice: вёл беседы
  rationale: Передаёт рассуждение и обсуждение с собеседниками, не создавая обязательно резкого оттенка спора.
- source_word: σχολῇ
  choice: лекционном зале
  rationale: Передаёт место преподавания и обсуждения, не вызывая у современного читателя ложной ассоциации с общеобразовательной школой.
- source_word: Τυράννου
  choice: Тиранна
  rationale: Традиционно и фонетически уместно передаёт греческое личное имя в родительном падеже.
theological_decisions:
- issue: «Путь» как название раннего христианского движения
  choice: Путь с прописной буквы
  alternative: путь как общее обозначение образа жизни или учения
  rationale: В книге Деяний выражение функционирует как узнаваемое наименование движения последователей Иисуса; прописная буква передаёт эту функцию, не добавляя конфессионального толкования.
- issue: Смысл ἠπείθουν
  choice: не покорялись
  alternative: не верили; не поддавались убеждению
  rationale: Основной текст сохраняет волевой оттенок сопротивления, а примечание открыто отмечает лексическую неоднозначность между непокорностью, неверием и отказом принять убеждение.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет последовательность греческого повествования, но избегает тяжеловесных причастных конструкций. Имя действующего лица оставлено местоимением «он», как в греческом тексте, где субъект определяется из контекста.
