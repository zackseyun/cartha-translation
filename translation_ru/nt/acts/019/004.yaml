  text: εἶπεν δὲ Παῦλος· ⸀Ἰωάννης ἐβάπτισεν βάπτισμα μετανοίας, τῷ λαῷ λέγων εἰς τὸν ἐρχόμενον μετ’ αὐτὸν ἵνα πιστεύσωσιν, τοῦτ’ ἔστιν εἰς ⸀τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/004.yaml
  text: And Paul said[a], “John baptized with a baptism of repentance, telling the people to believe in the one coming after him—that is, in Jesus.”
translation:
  language: ru
  text: 'Павел же сказал: «Иоанн крестил крещением покаяния[a] и говорил народу, чтобы они поверили в того, кто придёт после него, то есть в Иисуса».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «крестил крещение покаяния».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβάπτισεν βάπτισμα μετανοίας
  choice: крестил крещением покаяния
  rationale: Сохранены однокоренная конструкция и родительный падеж μετανοίας, чтобы не уточнять сверх текста, каким именно образом крещение связано с покаянием.
- source_word: τῷ λαῷ
  choice: народу
  rationale: Передаёт общее собирательное значение λαός, не добавляя отсутствующего в данной фразе уточнения «Израиля».
- source_word: λέγων
  choice: и говорил
  rationale: Сочинительная конструкция естественна по-русски и передаёт сопутствующее крещению провозглашение Иоанна.
- source_word: ἵνα πιστεύσωσιν
  choice: чтобы они поверили
  rationale: Сохраняет возможный оттенок как содержания призыва, так и его цели, не сводя ἵνα только к одному из них.
- source_word: εἰς τὸν ἐρχόμενον μετ’ αὐτὸν
  choice: в того, кто идёт за ним
  rationale: Передаёт объект веры и образ грядущего вслед за Иоанном; формулировка сохраняет настоящее значение причастия ἐρχόμενον и контекстуальную идею преемственности.
- source_word: τοῦτ’ ἔστιν εἰς τὸν Ἰησοῦν
  choice: то есть в Иисуса
  rationale: Прямо воспроизводит пояснение текста и не добавляет отсутствующего титула «Христос».
theological_decisions:
- issue: Связь крещения Иоанна с верой в Иисуса
  choice: Крещение Иоанна названо крещением покаяния и сопровождается призывом верить в идущего за ним, прямо отождествлённого с Иисусом.
  alternative: Понимать крещение Иоанна как само по себе производящее христианскую веру либо не называть идущего за ним.
  rationale: Греческий синтаксис различает действие крещения и сопутствующее ему возвещение, а пояснение τοῦτ’ ἔστιν явно называет Иисуса.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Конструкция «крещением покаяния» намеренно сохраняет смысловую ёмкость оригинала; местоимение «того» дано со строчной буквы по общим современным нормам.
