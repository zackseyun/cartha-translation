  source_fidelity: 'В целом перевод точно передаёт структуру и содержание греческого текста: «крещением покаяния» сохраняет намеренно ёмкую конструкцию βάπτισμα μετανοίας; «народу» не сужает значение τῷ λαῷ; пояснение «то есть в Иисуса» верно передаёт τοῦτ’ ἔστιν εἰς τὸν Ἰησοῦν. Однако «кто идёт за ним» в современном русском прежде всего может обозначать пространственное следование. В данном контексте μετ’ αὐτόν указывает на того, кто должен прийти после Иоанна.'
