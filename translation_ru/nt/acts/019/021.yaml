id: ACT.19.21
reference: Acts 19:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληρώθη ταῦτα, ἔθετο ὁ Παῦλος ἐν τῷ πνεύματι διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν πορεύεσθαι εἰς ⸀Ἱεροσόλυμα, εἰπὼν ὅτι Μετὰ τὸ γενέσθαι με ἐκεῖ δεῖ με καὶ Ῥώμην ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/021.yaml
  text: After these things were completed[a], Paul resolved in the Spirit to go to Jerusalem after passing through Macedonia and Achaia, saying, “After I have been there[b], I must also see Rome.”
translation:
  language: ru
  text: 'После того как всё это завершилось, Павел в Духе[a] решил пройти через Македонию и Ахайю, а затем отправиться в Иерусалим. Он сказал: «После того как я побываю там, я должен увидеть и Рим».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в своём духе». Греческое выражение может означать как внутреннее решение Павла, так и решение под водительством Святого Духа.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπληρώθη
  choice: завершилось
  rationale: В данном контексте глагол означает, что предшествующие события подошли к завершению, а не исполнение пророчества.
- source_word: ἔθετο
  choice: решил
  rationale: Средний залог τίθημι в этом обороте передаёт обдуманное, твёрдое намерение самого Павла; современное русское «решил» выражает это естественно.
- source_word: ἐν τῷ πνεύματι
  choice: в Духе
  rationale: Основной текст следует вероятному указанию на Святого Духа, характерному для повествования Луки, но не устраняет возможного значения «в своём духе»; оно дано в сноске.
- source_word: διελθὼν
  choice: пройти через
  rationale: Аористное причастие обозначает прохождение через Македонию и Ахайю до прибытия в Иерусалим. Русская последовательность с «а затем» ясно передаёт порядок намеченного пути.
- source_word: πορεύεσθαι
  choice: отправиться
  rationale: Передаёт целенаправленное путешествие в Иерусалим естественным современным русским языком.
- source_word: Ἱεροσόλυμα
  choice: Иерусалим
  rationale: Традиционная и общеупотребительная русская форма названия города.
- source_word: Μετὰ τὸ γενέσθαι με ἐκεῖ
  choice: После того как я побываю там
  rationale: Артиклевый инфинитивный оборот означает, что Павел сначала окажется и побудет в Иерусалиме, а затем продолжит путь.
- source_word: δεῖ
  choice: я должен
  rationale: Сохраняет выраженную в δεῖ необходимость, не уточняя сверх текста, является ли она непосредственно божественным предопределением или непреложной обязанностью.
- source_word: ἰδεῖν
  choice: увидеть
  rationale: Сохраняет буквальный образ греческого глагола и естественно выражает намерение посетить Рим.
theological_decisions:
- issue: К чему относится ἐν τῷ πνεύματι
  choice: «в Духе» — вероятное указание на Святого Духа
  alternative: «в своём духе» — внутренне, в собственном духе
  rationale: В греческом нет ни притяжательного местоимения, ни иного однозначного уточнения. Контекст Деяний допускает водительство Святого Духа, однако грамматика позволяет понимать выражение как внутреннее решение Павла. Основной вариант и сноска сохраняют это напряжение.
- issue: Характер необходимости в δεῖ
  choice: «должен» без дополнительного пояснения
  alternative: «мне необходимо»
  rationale: У Луки δεῖ нередко связано с божественным замыслом, но сам стих не называет источник необходимости прямо; перевод не делает скрытый смысл явным догматическим утверждением.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Конструкция «решил пройти… а затем отправиться» избегает неестественной кальки с греческого причастия и ясно показывает последовательность намеченного маршрута. Заглавная буква в слове «Дух» отражает основной вариант понимания, а сноска сохраняет подлинную неоднозначность.
