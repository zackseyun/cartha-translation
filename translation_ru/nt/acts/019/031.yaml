  text: τινὲς δὲ καὶ τῶν Ἀσιαρχῶν, ὄντες αὐτῷ φίλοι, πέμψαντες πρὸς αὐτὸν παρεκάλουν μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/031.yaml
  text: And even some of the Asiarchs[a], being his friends[c][b], sent word to him and urged him not to venture into the theater.
translation:
  language: ru
  text: И даже некоторые из асиархов[a], дружески расположенные к Павлу, послали ему весть и настойчиво просили его не идти в театр.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Асиархи — влиятельные должностные лица, связанные с римской провинцией Азия.
    reason: cultural_note
lexical_decisions:
- source_word: τινὲς δὲ καὶ τῶν Ἀσιαρχῶν
  choice: Даже некоторые из асиархов
  rationale: καί имеет здесь усилительный оттенок («даже»), а Ἀσιάρχης передаётся транслитерацией как особый исторический титул; пояснение дано в сноске.
- source_word: ὄντες αὐτῷ φίλοι
  choice: дружески расположенные к Павлу
  rationale: Фраза может обозначать как личных друзей, так и благожелательно настроенных влиятельных лиц. Выбранный вариант естественен по-русски и не усиливает степень близости сверх греческого текста; имя Павла восстанавливает ясный референт местоимения.
- source_word: πέμψαντες πρὸς αὐτὸν
  choice: послали к нему людей
  rationale: Глагол πέμπω употреблён без выраженного дополнения и подразумевает отправку посредников; явное добавление «людей» делает эллипсис понятным по-русски.
- source_word: παρεκάλουν
  choice: настойчиво просили
  rationale: Имперфект допускает длительное или повторное побуждение; сочетание передаёт настойчивость, не доводя значение до «умоляли».
- source_word: μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον
  choice: не входить в театр
  rationale: Буквально «не отдавать/предоставлять себя в театр»; в данном контексте это идиоматическое предостережение не подвергать себя опасности, явившись внутрь театра. Русское «не входить» сохраняет направленность εἰς и звучит естественно.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Технический исторический титул сохранён и пояснён; тяжеловесный буквализм оборота δοῦναι ἑαυτόν устранён без снятия подразумеваемой опасности.
