lexical_decisions:
- source_word: ἦσαν
  choice: было
  rationale: В сочетании с указанием общего числа естественная русская конструкция «их было» точно передаёт греческое ἦσαν.
- source_word: δὲ
  choice: —
  rationale: Это слабая связующая частица; в данном кратком итоговом замечании отдельный русский союз не требуется.
- source_word: οἱ πάντες
  choice: Всего их
  rationale: Передаёт значение всей группы и итогового подсчёта естественным современным русским выражением.
- source_word: ἄνδρες
  choice: мужчин
  rationale: Греческое ἄνδρες здесь обозначает мужчин, а не людей вообще; родовая конкретность сохранена.
- source_word: ὡσεὶ
  choice: около
  rationale: Сохраняет выраженную в оригинале приблизительность числа.
- source_word: δώδεκα
  choice: двенадцати
  rationale: Прямой эквивалент количественного числительного с требуемой русской падежной формой.
