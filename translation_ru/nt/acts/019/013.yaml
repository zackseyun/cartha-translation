id: ACT.19.13
reference: Acts 19:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐπεχείρησαν δέ τινες ⸀καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν ὀνομάζειν ἐπὶ τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρὰ τὸ ὄνομα τοῦ κυρίου Ἰησοῦ λέγοντες· ⸀Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν ⸀ὃν Παῦλος κηρύσσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/013.yaml
  text: But some also of the itinerant Jewish exorcists attempted to invoke the name of the Lord Jesus over those who had evil spirits[a], saying, “I adjure you by Jesus[d][c][b], whom Paul proclaims.”
translation:
  language: ru
  text: 'Но некоторые из странствующих иудейских заклинателей[a] тоже попытались призывать имя Господа Иисуса над теми, в ком были злые духи[b], говоря: «Заклинаю вас[c] Иисусом, которого возвещает Павел[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «даже некоторые из странствующих иудейских заклинателей».'
    reason: Частица καί допускает здесь как добавочное значение «и/также», так и усилительное «даже».
  - marker: b
    text: 'Буквально: «имевшими злых духов».'
    reason: Примечание показывает буквальную форму исходного выражения и то, что основной текст не вводит более сильное слово «одержимые».
  - marker: c
    text: 'То есть: «торжественно обязываю вас именем Иисуса» или «требую от вас, призывая Иисуса».'
    reason: ὁρκίζω связано с клятвенным, торжественным требованием и в этом контексте употреблено как формула заклинания.
  - marker: d
    text: 'Или: «которого проповедует Павел».'
    reason: κηρύσσει может передаваться как «возвещает», «провозглашает» или «проповедует».
lexical_decisions:
- source_word: ἐπεχείρησαν
  choice: попытались
  rationale: Аорист ἐπιχειρέω обозначает предпринятую попытку; этот вариант естественен по-русски и не предполагает её успеха.
- source_word: τινες καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν
  choice: и некоторые из странствующих иудейских заклинателей
  rationale: τινες означает «некоторые», καί имеет добавочное значение «и/также», а περιερχομένων указывает на переходивших с места на место. «Заклинатели» передаёт ἐξορκισταί без более сильного утверждения об их действительной власти над духами.
- source_word: ὀνομάζειν ἐπὶ ... τὸ ὄνομα
  choice: призывать имя ... над
  rationale: В данном контексте речь не просто о произнесении имени, а о его использовании в формуле заклинания. Формулировка сохраняет как смысл призывания имени, так и значение ἐπί — «над».
- source_word: τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: теми, в ком были злые духи
  rationale: Передаёт буквальное «имеющими злых духов» естественным русским языком, не усиливая выражение до однозначного «одержимыми».
- source_word: τὸ ὄνομα τοῦ κυρίου Ἰησοῦ
  choice: имя Господа Иисуса
  rationale: Устоявшееся и точное русское соответствие, сохраняющее титул κύριος и его христологический вес.
- source_word: Ὁρκίζω ὑμᾶς
  choice: Заклинаю вас
  rationale: В контексте изгнания духов ὁρκίζω означает торжественно обязать или связать клятвенным требованием. «Заклинаю» точно передаёт формальный характер речи и сохраняет единственное число греческого глагола.
- source_word: τὸν Ἰησοῦν ὃν Παῦλος κηρύσσει
  choice: Иисусом, которого возвещает Павел
  rationale: В конструкции с ὁρκίζω винительный τὸν Ἰησοῦν указывает, кем заклинают. κηρύσσει означает публично провозглашать или проповедовать; «возвещает» ясно и не сужает значение до церковной проповеди.
theological_decisions:
- issue: Передача κύριος в выражении τοῦ κυρίου Ἰησοῦ
  choice: Господа
  alternative: Владыки
  rationale: «Господь Иисус» сохраняет признанный титул и присущий контексту богословский вес, не добавляя толкования.
- issue: Следует ли прямо обозначить одержимость в τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: теми, в ком были злые духи
  alternative: одержимыми злыми духами
  rationale: Греческий текст буквально говорит о людях, «имеющих злых духов». Основной перевод сохраняет эту степень определённости и не вводит более сильную характеристику состояния.
- issue: Сохранение единственного числа в Ὁρκίζω при множественном числе действующих лиц
  choice: Заклинаю
  alternative: Заклинаем
  rationale: Издание SBLGNT читает форму первого лица единственного числа. Перевод не устраняет возникающее напряжение, вероятно связанное с цитированием употреблявшейся формулы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены выражение «имя Господа Иисуса», формальный глагол «заклинаю» и конструкция «над теми», важная для образа действия; при этом синтаксис остаётся понятным обычному читателю.
