  yaml_path: translation/nt/acts/019/014.yaml
  text: There were seven sons of a Jewish chief priest named Sceva doing this[a].
translation:
  language: ru
  text: Этим занимались семь сыновей некоего Скевы, иудейского первосвященника[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «старшего священника». Греческое слово может обозначать как первосвященника, так и в более широком смысле старшего священника или представителя высшего священства.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Этим занимались
  rationale: Форма ἦσαν с δέ продолжает повествование и вместе с причастием образует естественную русскую конструкцию; отдельный противительный союз не требуется.
- source_word: τινος Σκευᾶ
  choice: некоего Скевы
  rationale: Передаёт неопределённость τινος и естественно вводит ранее не названного человека.
- source_word: Ἰουδαίου
  choice: иудейского
  rationale: В данном контексте обозначает иудейскую этнорелигиозную принадлежность, а не только географическое происхождение.
- source_word: ἀρχιερέως
  choice: старшего священника
  rationale: Не утверждает без достаточных оснований, что Скева занимал единственную должность первосвященника, и сохраняет более широкое возможное значение термина.
- source_word: ἑπτὰ υἱοὶ
  choice: семь сыновей
  rationale: Прямо и естественно передаёт числительное и родственное обозначение.
- source_word: τοῦτο ποιοῦντες
  choice: Этим занимались
  rationale: Передаёт продолжающееся действие и отсылает к занятию, описанному в предыдущем контексте.
theological_decisions:
- issue: Значение ἀρχιερεύς применительно к Скеве
  choice: старший священник
  alternative: первосвященник
  rationale: Термин может обозначать как первосвященника, так и представителя высшего священства. Поскольку Скева не известен как занимавший единственную должность иудейского первосвященника, основной текст сохраняет более широкое значение, а вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; фраза перестроена ради естественного порядка слов без потери связи с предыдущим контекстом. Сохранена смысловая неоднозначность титула Скевы.
