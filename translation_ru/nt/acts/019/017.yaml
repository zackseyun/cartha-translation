base_translation:
  language: en
  yaml_path: translation/nt/acts/019/017.yaml
  text: And this became known to all the Jews and Greeks living in Ephesus[a], and fear fell upon them all[b], and the name of the Lord Jesus was being magnified.
translation:
  language: ru
  text: Об этом стало известно всем иудеям и грекам, живущим в Эфесе. Всех их охватил страх[a], и имя Господа Иисуса прославлялось[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «страх пал на всех них»; возможно также: «всех их охватил трепет».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «возвеличивалось» или «было в большом почёте».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: об этом
  rationale: Указательное местоимение в единственном числе отсылает к только что описанному происшествию; по-русски оборот «об этом стало известно» звучит естественно.
- source_word: ἐγένετο γνωστὸν
  choice: стало известно
  rationale: 'Передаёт начальное значение конструкции γίνομαι с прилагательным: произошедшее получило огласку.'
- source_word: πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: всем иудеям и грекам
  rationale: Дательный падеж обозначает тех, кому стало известно происшедшее; τε καὶ объединяет обе группы без противопоставления.
- source_word: τοῖς κατοικοῦσιν τὴν Ἔφεσον
  choice: живущим в Эфесе
  rationale: Естественно передаёт κατοικέω и относит определение как к иудеям, так и к грекам.
- source_word: ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς
  choice: всех их охватил страх
  rationale: Современный русский оборот ясно передаёт внезапно охвативший всех страх; образ более буквально передан в сноске.
- source_word: φόβος
  choice: страх
  rationale: Сохраняет широкий смысл слова, которое в контексте может включать испуг и благоговейный трепет, не сводя его только к одному оттенку.
- source_word: ἐμεγαλύνετο
  choice: всё больше прославлялось
  rationale: Имперфект передаёт продолжавшийся процесс общественного возвеличивания; «всё больше» естественно выражает развёртывание действия.
- source_word: τὸ ὄνομα
  choice: имя
  rationale: 'Сохраняет прямое значение и библейскую смысловую насыщенность: имя связано с личностью, властью и почётом.'
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Господа Иисуса
  rationale: κύριος передано традиционным и понятным христологическим титулом «Господь».
theological_decisions:
- issue: Передача κύριος применительно к Иисусу
  choice: Господь
  alternative: Владыка
  rationale: «Господь» сохраняет признанный титульный и христологический смысл без привнесения более узкого толкования.
- issue: Передача выражения τὸ ὄνομα τοῦ κυρίου Ἰησοῦ
  choice: имя Господа Иисуса
  alternative: слава Господа Иисуса
  rationale: Сохранение слова «имя» не сужает выражение до современной идеи репутации и удерживает его библейские оттенки личности, власти и чести.
- issue: Характер φόβος
  choice: страх
  alternative: благоговейный трепет
  rationale: Контекст допускает одновременно испуг перед проявленной силой и почтительный трепет; нейтральное «страх» сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное, без архаизации. Первое греческое καί естественно отражено новым предложением, а второе — союзом «и». Имперфект ἐμεγαλύνετο передан как развивающийся процесс.
