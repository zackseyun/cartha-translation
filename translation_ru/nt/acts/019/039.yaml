  text: But if you seek anything further[a], it will be settled in the lawful assembly.
translation:
  language: ru
  text: Если же вы добиваетесь чего-либо ещё, это будет решено на законном собрании[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на законно созванном гражданском собрании». Греческое слово обозначает здесь правомочное гражданское собрание, а не церковь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περαιτέρω
  choice: чего-то большего
  rationale: Наречие указывает на нечто дополнительное, сверх уже рассмотренного; в сочетании с ἐπιζητεῖτε естественно передаётся как «добиваетесь чего-то большего».
- source_word: ἐπιζητεῖτε
  choice: добиваетесь
  rationale: В данном общественно-правовом контексте глагол означает настойчиво искать или добиваться рассмотрения дополнительного вопроса; «добиваетесь» естественно передаёт направленность действия, не превращая его в узкий юридический термин.
- source_word: ἐννόμῳ
  choice: законном
  rationale: Прилагательное обозначает соответствие закону и установленному порядку; «законном» сохраняет юридико-гражданский смысл.
- source_word: ἐκκλησίᾳ
  choice: собрании
  rationale: Здесь речь идёт о созванном по закону гражданском собрании Эфеса, а не о христианской общине; «собрание» сохраняет общественный смысл слова.
- source_word: ἐπιλυθήσεται
  choice: это будет решено
  rationale: Будущее страдательного залога указывает, что вопрос получит процедурное разрешение; «будет решено» ясно и естественно по-русски.
- source_word: τι
  choice: чего-то
  rationale: Неопределённое местоимение в условном обороте относится к любому дополнительному требованию или вопросу; форма «чего-то» согласуется с управлением глагола «добиваться».
theological_decisions:
- issue: Передача ἐκκλησία во внехристианском гражданском контексте
  choice: собрание
  alternative: церковь; сходка; суд
  rationale: Контекст указывает на законно созванное гражданское собрание, а не на христианскую церковь. «Суд» был бы чрезмерно толковательным, поскольку само слово не является специальным судебным термином.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, достойная и понятная. Слово «собрание» намеренно избегает церковного оттенка и соответствует эфесскому гражданскому контексту.
