base_translation:
  language: en
  yaml_path: translation/nt/acts/019/019.yaml
  text: And many of those who had practiced magic arts brought their books together and were burning them in front of everyone[b][a]; and they totaled up their value and found it to be fifty thousand pieces of silver.
translation:
  language: ru
  text: Многие из тех, кто занимался магией[a], снесли свои книги и сжигали их у всех на виду; они подсчитали их стоимость, и получилось пятьдесят тысяч серебром[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально греческое выражение связано с «необычными» или «особыми» занятиями, но здесь по контексту речь идёт о магических практиках.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пять мириад серебра», то есть пятьдесят тысяч денежных единиц серебром. Конкретный вид монеты в греческом тексте не указан.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκανοὶ
  choice: многие
  rationale: В данном контексте слово обозначает значительное число людей; «многие» естественно передаёт эту мысль по-русски.
- source_word: τὰ περίεργα πραξάντων
  choice: тех, кто занимался магией
  rationale: В эфесском контексте выражение обозначает магические занятия, а не просто необычные или любопытные дела.
- source_word: συνενέγκαντες τὰς βίβλους
  choice: собрали свои книги
  rationale: Причастие указывает, что книги снесли или собрали в одном месте; притяжательное «свои» естественно следует из контекста.
- source_word: κατέκαιον
  choice: сжигали
  rationale: Несовершенный вид передаёт длительный характер действия, выраженный греческим имперфектом.
- source_word: ἐνώπιον πάντων
  choice: у всех на виду
  rationale: Современное и выразительное обозначение публичности происходящего.
- source_word: συνεψήφισαν τὰς τιμὰς αὐτῶν
  choice: их стоимость подсчитали
  rationale: Передаёт вычисление общей денежной стоимости, не уточняя названного исполнителя там, где греческий текст его явно не называет.
- source_word: ἀργυρίου μυριάδας πέντε
  choice: пятьдесят тысяч серебряных монет
  rationale: Пять мириад равны пятидесяти тысячам; слово «монет» делает денежный смысл понятным, но конкретный номинал не называется и поясняется в сноске.
theological_decisions:
- issue: Характер занятий, обозначенных τὰ περίεργα
  choice: магия
  alternative: тайные (оккультные) занятия; необычные искусства
  rationale: Контекст повествует о заклинаниях, злых духах и уничтожении соответствующих книг, поэтому речь идёт именно о магической практике. Перевод не связывает её с какой-либо поздней конфессиональной категорией.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Формулировка «у всех на виду» естественно передаёт публичность поступка; «сжигали» сохраняет аспектуальную незавершённость греческого имперфекта.
