translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Различие между ὄχλος («толпа») и δῆμος («народное собрание») сохранено. Формулировка не уточняет, выступал ли Александр в защиту себя, иудеев или иной стороны, поскольку греческий текст этого прямо не определяет.
