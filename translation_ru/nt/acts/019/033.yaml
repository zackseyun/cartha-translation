base_translation:
  language: en
  yaml_path: translation/nt/acts/019/033.yaml
  text: And from the crowd they brought forward Alexander[a], since the Jews had pushed him forward; and Alexander, motioning with his hand[b], wanted to make a defense to the assembly.
translation:
  language: ru
  text: Из толпы выдвинули Александра[a], так как иудеи выдвинули его вперёд. Александр подал знак рукой и хотел выступить с защитой перед народным собранием[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Из толпы выдвинули Александра… иудеи выставили его вперёд». В греческом тексте употреблены два глагола с близким значением публичного выведения человека вперёд.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «перед народом». Греческое слово здесь имеет гражданско-публичный смысл и отличается от «толпы» в начале стиха.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεβίβασαν
  choice: вывели
  rationale: В сочетании с ἐκ τοῦ ὄχλου и прямым дополнением обозначает выведение Александра из толпы на всеобщее обозрение; нейтральное «вывели» естественно передаёт движение вперёд.
- source_word: προβαλόντων αὐτὸν τῶν Ἰουδαίων
  choice: которого иудеи вытолкнули вперёд
  rationale: Генитивная абсолютная конструкция поясняет, как Александр оказался впереди. «Вытолкнули вперёд» передаёт настойчивое публичное выдвижение, не утверждая физического насилия.
- source_word: κατασείσας τὴν χεῖρα
  choice: подал знак рукой
  rationale: Передаёт жест с целью привлечь внимание, не добавляя прямо не выраженного уточнения «призывая к тишине».
- source_word: ἤθελεν ἀπολογεῖσθαι
  choice: хотел выступить с защитой
  rationale: Сохраняет значение намерения, а также публично-защитный, близкий к судебному оттенок ἀπολογεῖσθαι; действие не представлено как состоявшееся.
- source_word: τῷ δήμῳ
  choice: перед народным собранием
  rationale: Передаёт гражданско-публичный смысл δῆμος и отличает организованно собравшийся народ от общей «толпы» (ὄχλος) в начале стиха.
- source_word: ὄχλου
  choice: толпы
  rationale: Естественное современное соответствие для общей массы людей; сохраняет отличие от δῆμος.
- source_word: Ἀλέξανδρον / Ἀλέξανδρος
  choice: Александра / Александр
  rationale: Стандартная русская форма греческого личного имени.
