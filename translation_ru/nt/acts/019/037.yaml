base_translation:
  language: en
  yaml_path: translation/nt/acts/019/037.yaml
  text: For you have brought these men here who are neither temple robbers nor blasphemers of our goddess[a].
translation:
  language: ru
  text: Ведь вы привели сюда этих людей, которые не являются ни грабителями храмов, ни хулителями нашей богини.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «нашего бога»; здесь имеется в виду Артемида, поэтому по-русски передано «нашей богини».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάγετε
  choice: вы привели сюда
  rationale: Аорист ἄγω обозначает совершённое действие; «привели сюда» естественно передаёт доставление людей на собрание и дейктический контекст.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит обоснование предыдущего утверждения; «ведь» естественно сохраняет пояснительно-аргументативную связь.
- source_word: τοὺς ἄνδρας τούτους
  choice: этих людей
  rationale: В данном публично-правовом контексте речь идёт о конкретных мужчинах, но современное русское «этих людей» звучит естественнее, не меняя референции.
- source_word: οὔτε ... οὔτε
  choice: не ... и не
  rationale: Русская парная конструкция естественно передаёт оба согласованных отрицания.
- source_word: ἱεροσύλους
  choice: не грабили храмов
  rationale: Термин обозначает расхитителей храмов или святотатцев; глагольная формулировка ясно передаёт конкретное обвинение и согласуется со следующим причастием.
- source_word: βλασφημοῦντας
  choice: не хулили
  rationale: Причастие означает оскорбительную, кощунственную речь против божества; «хулить» точно и уместно в религиозно-правовом контексте.
- source_word: τὴν θεὸν ἡμῶν
  choice: нашу богиню
  rationale: Контекстуальный референт — Артемида; русский язык требует обозначить женский пол божества, хотя форма θεός лексически допускает буквальное «бог».
theological_decisions:
- issue: Передача θεὸν ἡμῶν применительно к Артемиде
  choice: нашу богиню
  alternative: нашего бога
  rationale: Говорящий — эфесский городской служащий, а контекст ясно указывает на Артемиду. «Богиню» передаёт референт и не позволяет ошибочно понять выражение как указание на истинного Бога; это контекстуально-лексическое решение, а не одобрение языческого культа.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной речи. Конструкция сделана ясной и устной по звучанию; сохранены причинная связь и оба отрицания.
