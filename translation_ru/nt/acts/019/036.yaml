  text: ἀναντιρρήτων οὖν ὄντων τούτων δέον ἐστὶν ὑμᾶς κατεσταλμένους ὑπάρχειν καὶ μηδὲν προπετὲς πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/036.yaml
  text: Therefore[a], since these things are undeniable[c][b], it is necessary for you to remain calm and to do nothing rash.
translation:
  language: ru
  text: Итак, поскольку это бесспорно, вам следует сохранять спокойствие и не совершать ничего опрометчивого.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναντιρρήτων
  choice: бесспорно
  rationale: Прилагательное обозначает то, чему невозможно обоснованно возразить; безличное наречное выражение естественно передаёт предикативную конструкцию во множественном числе среднего рода.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предшествующих слов городского секретаря и естественно звучит в публичной речи.
- source_word: ὄντων τούτων
  choice: поскольку это
  rationale: Родительный самостоятельный имеет здесь обстоятельственно-причинный смысл; русская конструкция сохраняет связь увещания с названными фактами.
- source_word: δέον ἐστίν
  choice: вам следует
  rationale: Передаёт необходимость и обязанность естественным современным русским оборотом, не усиливая выражение до категорического приказа.
- source_word: κατεσταλμένους ὑπάρχειν
  choice: сохранять спокойствие
  rationale: Сочетание причастия совершенного вида с ὑπάρχειν описывает устойчивое состояние успокоенности и сдержанности, а не только молчание.
- source_word: μηδὲν προπετὲς πράσσειν
  choice: не совершать ничего опрометчивого
  rationale: προπετής указывает на поспешное, необдуманное действие; «опрометчивого» точно и литературно передаёт этот смысл.
