  text: οὓς συναθροίσας καὶ τοὺς περὶ τὰ τοιαῦτα ἐργάτας εἶπεν· Ἄνδρες, ἐπίστασθε ὅτι ἐκ ταύτης τῆς ἐργασίας ἡ εὐπορία ⸀ἡμῖν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/025.yaml
  text: After gathering them together[a], along with the workmen occupied with such things, he said, “Men, you know that from this business we have our prosperity.
translation:
  language: ru
  text: 'Он собрал их вместе с работниками, занимавшимися подобными ремёслами, и сказал: «Мужи, вы знаете, что это дело приносит нам достаток.[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «этому ремеслу мы обязаны своим благосостоянием».'
    reason: Лексика ἐργασία и εὐπορία допускает более явное указание на ремесло и материальное благосостояние.
lexical_decisions:
- source_word: συναθροίσας
  choice: собрал
  rationale: Аористное причастие обозначает действие, предшествующее главному глаголу; в русском естественно передать его личной формой в последовательности действий.
- source_word: τοὺς περὶ τὰ τοιαῦτα ἐργάτας
  choice: работниками, занимавшимися подобными ремёслами
  rationale: Сохраняется широкое значение ἐργάτας («работники»), а контекст ремесленного производства естественно выражен словом «ремёсла» без чрезмерного уточнения.
- source_word: Ἄνδρες
  choice: Мужи
  rationale: Передаёт обращение к присутствующим мужчинам и сохраняет достоинство речи; «мужчины» в прямом обращении звучало бы менее естественно.
- source_word: ἐπίστασθε
  choice: вы знаете
  rationale: Прямой и естественный эквивалент знания, которым слушатели уже обладают.
- source_word: ἐκ ταύτης τῆς ἐργασίας
  choice: это дело
  rationale: В данном коммерческом контексте ἐργασία означает занятие или предприятие, служащее источником дохода; «дело» звучит естественно и не сужает значение до одного конкретного ремесла.
- source_word: ἡ εὐπορία ἡμῖν ἐστιν
  choice: приносит нам достаток
  rationale: εὐπορία обозначает материальное благополучие или зажиточность; формулировка ясно передаёт, что названная деятельность является его источником.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Обращение «Мужи» несколько возвышенно, но уместно для публичного обращения и точно передаёт Ἄνδρες.
