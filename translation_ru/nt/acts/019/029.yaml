  text: And the city was filled with confusion[a], and they rushed together into the theater, dragging along Gaius and Aristarchus, Macedonians who were Paul’s traveling companions.
translation:
  language: ru
  text: Город охватило смятение, и все вместе устремились в театр, схватив Гая и Аристарха[a] — македонян, спутников Павла.
  philosophy: optimal-equivalence
  footnotes:
