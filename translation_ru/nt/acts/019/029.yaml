lexical_decisions:
- source_word: ἐπλήσθη ἡ πόλις τῆς συγχύσεως
  choice: Весь город охватило смятение
  rationale: Естественная русская конструкция передаёт наступившее состояние всеобщего хаоса, выраженное аористом ἐπλήσθη и генитивом συγχύσεως, без указания на не названного в тексте деятеля.
- source_word: ὥρμησάν
  choice: устремились
  rationale: Передаёт внезапное, энергичное и направленное движение толпы, не добавляя военной окраски.
- source_word: ὁμοθυμαδόν
  choice: все как один
  rationale: В данном контексте обозначает совместное, согласованное движение толпы, а не положительное духовное единодушие.
- source_word: θέατρον
  choice: театр
  rationale: Прямое соответствие греческому θέατρον; более узкое «амфитеатр» текстом не требуется.
- source_word: συναρπάσαντες
  choice: схватив и потащив с собой
  rationale: Сохраняет как насильственный захват, так и последующее перемещение Гая и Аристарха вместе с толпой.
- source_word: Μακεδόνας
  choice: македонян
  rationale: Кратко и точно передаёт географическое происхождение обоих мужчин.
- source_word: συνεκδήμους Παύλου
  choice: спутников Павла
  rationale: Естественное современное обозначение людей, путешествовавших вместе с Павлом вдали от дома.
