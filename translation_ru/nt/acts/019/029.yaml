    issue: «Все как один» усиливает ὁμοθυμαδόν.
    rationale: Наречие обозначает совместное, единодушное действие, но в данном контексте не требует утверждения, что буквально все действовали «как один». «Все вместе» сохраняет коллективность без дополнительной экспрессии.
  - severity: medium
    issue: «Схватив и потащив с собой» чрезмерно конкретизирует συναρπάσαντες.
    rationale: Греческий причастный оборот обозначает насильственный захват (возможен также оттенок увода); разложение на «схватив и потащив» добавляет отдельное действие «тащить». Безопаснее передать основной смысл «схватив», а возможный оттенок увода отметить в сноске.
  - severity: low
    issue: Сноска поставлена в конце стиха, а не у переводимого оборота.
    rationale: Маркер лучше поместить сразу после «схватив Гая и Аристарха», чтобы связь с лексической альтернативой была однозначной.
