  text: ⸀διότι μαρτύρομαι ὑμῖν ἐν τῇ σήμερον ἡμέρᾳ ὅτι καθαρός ⸀εἰμι ἀπὸ τοῦ αἵματος πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/026.yaml
  text: Therefore I testify to you on this day that I am innocent of the blood of all[a][b].
translation:
  language: ru
  text: 'Поэтому сегодня свидетельствую вам: я чист от крови всех[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не виновен в крови всех». Греческое выражение означает, что человек свободен от вины или ответственности за других.'
    reason: lexical_alternative
  - marker: b
    text: Вероятно, это отсылка к образу стража у Иезекииля и ответственности за кровь (см. Иез. 3:18–19; 33:6–9).
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: Поэтому
  rationale: В контексте вводит вывод из сказанного ранее; «поэтому» естественно передаёт логическую связь.
- source_word: μαρτύρομαι
  choice: свидетельствую
  rationale: Сохраняет торжественный характер личного заявления Павла, не усиливая судебную окраску сверх текста.
- source_word: ὑμῖν
  choice: вам
  rationale: Естественная передача дательного падежа без добавления отсутствующего в тексте оттенка «перед вами».
- source_word: ἐν τῇ σήμερον ἡμέρᾳ
  choice: в этот день
  rationale: Передаёт торжественную, несколько семитизированную формулу оригинала и остаётся понятной в современном русском языке.
- source_word: καθαρός εἰμι ἀπὸ τοῦ αἵματος
  choice: я не виновен в крови
  rationale: Русская библейская идиома передаёт свободу от вины и ответственности; буквальное «чист от крови» менее естественно, но отмечено в сноске.
- source_word: πάντων
  choice: никого
  rationale: 'При отрицательном сказуемом это естественная русская передача смысла «всех»: Павел не несёт вины за кровь ни одного человека.'
theological_decisions:
- issue: Смысл выражения «не виновен в крови никого»
  choice: Свобода от вины и ответственности за участь других, поскольку Павел исполнил обязанность возвещать и предостерегать.
  alternative: Узкая ссылка лишь на непричастность к чьей-либо физической смерти.
  rationale: Контекст Деян 20:20–27 и образ стража в Иезекииле указывают на ответственность за верное предупреждение. Идиома сохранена, а не заменена разъясняющим пересказом.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного тона свидетельства. Фраза «в этот день» намеренно формальнее разговорного «сегодня»; идиома о крови сохранена ввиду её межтекстовой и богословской значимости.
