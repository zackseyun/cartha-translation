- source_word: πλὴν ὅτι
  choice: только
  rationale: Оборот вводит единственное ограничение или оговорку к сказанному в предыдущем стихе; «только» естественно передаёт его противительно-ограничительный смысл.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Святой Дух
  rationale: Общепринятое и современное обозначение Святого Духа; определённость греческого выражения ясна из самого имени.
- source_word: κατὰ πόλιν
  choice: в каждом городе
  rationale: Конструкция κατά с существительным в единственном числе имеет распределительное значение и указывает на повторяющееся свидетельство в разных городах.
- source_word: διαμαρτύρεταί μοι
  choice: свидетельствует мне
  rationale: Сохраняет значение настойчивого или торжественного свидетельства и не сужает его до одного лишь предупреждения.
- source_word: λέγον
  choice: говоря
  rationale: Прямо вводит содержание свидетельства Святого Духа.
- source_word: δεσμὰ
  choice: оковы
  rationale: Сохраняет конкретный образ пут или цепей, не сводя выражение сразу к абстрактному «заключению».
- source_word: θλίψεις
  choice: скорби
  rationale: Передаёт тяжёлые притеснения, бедствия и страдания, сохраняя ёмкость греческого слова.
- source_word: με
  choice: меня
  rationale: 'Передаёт дополнение, присутствующее в основном тексте SBLGNT: именно Павла ожидают названные испытания.'
- source_word: μένουσιν
  choice: ожидают
  rationale: В данном контексте глагол обозначает то, что уготовано Павлу и ждёт его впереди.
theological_decisions:
- issue: Личное действие Святого Духа
  choice: Святой Дух представлен как свидетельствующий и говорящий Павлу
  alternative: Безличное духовное воздействие или внутреннее побуждение
  rationale: Грамматика и содержание стиха приписывают Святому Духу речевое действие и личное свидетельство, не требуя дальнейших догматических уточнений.
