  register: Современный литературный русский язык с умеренно возвышенной библейской тональностью. «Оковы» сохраняет конкретный образ оригинала, а «скорби» — его смысловую ёмкость. Порядок слов делает повторяемость свидетельства заметной и остаётся естественным по-русски.
