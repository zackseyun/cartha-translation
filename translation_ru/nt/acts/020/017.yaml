  text: Из Милета он послал в Эфес за старейшинами церкви[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Из Милета он послал в Эфес и вызвал к себе старейшин церкви». В греческом тексте сочетаются выражения «послал в Эфес» и «вызвал к себе», что подразумевает отправку сообщения или посланцев с просьбой, чтобы старейшины пришли к нему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς Μιλήτου
  choice: Из Милета
  rationale: Предлог ἀπό с родительным указывает на исходный пункт. Слабый связующий союз δέ не требует отдельного русского слова и естественно передаётся последовательностью повествования.
- source_word: πέμψας εἰς Ἔφεσον
  choice: послал в Эфес
  rationale: 'Аористное причастие обозначает действие, предшествующее главному: Павел отправил в Эфес сообщение или посланцев. Русская личная форма естественно передаёт последовательность действий, не уточняя того, чего прямо не называет греческий текст.'
- source_word: μετεκαλέσατο
  choice: вызвал к себе
  rationale: Средний залог и значение глагола передают приглашение или требование прибыть к говорящему. «Вызвал к себе» сохраняет направленность к Павлу и не придаёт действию излишне властного оттенка слова «приказал явиться».
- source_word: τοὺς πρεσβυτέρους
  choice: старейшин
  rationale: В контексте Деяний речь идёт о признанных руководителях христианской общины, а не просто о пожилых мужчинах. «Старейшины» — понятное современное обозначение без привнесения поздней конфессиональной терминологии.
- source_word: τῆς ἐκκλησίας
  choice: церкви
  rationale: Здесь ἐκκλησία обозначает местную христианскую общину. «Церковь» является естественным и устойчивым русским соответствием в данном контексте.
theological_decisions:
- issue: Значение πρεσβυτέρους в церковном контексте
  choice: руководители общины, названные «старейшинами»
  alternative: пожилые мужчины общины; пресвитеры как технический термин
  rationale: Контекст последующей речи Павла показывает, что это признанные руководители эфесской церкви. «Старейшины» сохраняет смысл исходного слова, не навязывая более позднюю модель церковного устройства.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанно-достойное. Синтаксис сохраняет оба действия греческого текста, а подразумеваемые посланцы не вводятся непосредственно в основной текст.
