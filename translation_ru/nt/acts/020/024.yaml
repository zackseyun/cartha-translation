id: ACT.20.24
reference: Acts 20:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδενὸς ⸀λόγου ⸀ποιοῦμαι τὴν ⸀ψυχὴν τιμίαν ἐμαυτῷ ὡς ⸀τελειῶσαι τὸν δρόμον ⸀μου καὶ τὴν διακονίαν ἣν ἔλαβον παρὰ τοῦ κυρίου Ἰησοῦ, διαμαρτύρασθαι τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/024.yaml
  text: 'But I do not count my life as of any value to myself[c][b][a], if only I may finish my course and the ministry that I received from the Lord Jesus: to testify to the gospel of the grace of God.'
translation:
  language: ru
  text: 'Но я не считаю свою жизнь[a] сколько-нибудь ценной для себя — лишь бы завершить свой путь[b] и служение, которое я получил от Господа Иисуса: свидетельствовать[c] о Евангелии Божьей благодати.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «душу». Здесь имеется в виду жизнь Павла, которой он готов пожертвовать ради завершения своего служения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «завершить свой забег». Греческое слово может обозначать дистанцию или поприще, которое нужно пройти до конца.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «торжественно свидетельствовать». Греческий глагол может подразумевать настойчивое и серьёзное свидетельство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδενὸς λόγου ποιοῦμαι … τιμίαν ἐμαυτῷ
  choice: не считаю … сколько-нибудь ценной для себя
  rationale: Передаёт оценочный смысл сжатого греческого оборота естественным современным русским языком и сохраняет личный оттенок ἐμαυτῷ.
- source_word: ψυχήν
  choice: жизнь
  rationale: В контексте предстоящих страданий и возможной смерти речь идёт о земной жизни Павла, а не о противопоставлении души и тела.
- source_word: ὡς τελειῶσαι
  choice: лишь бы завершить
  rationale: Передаёт главную, преобладающую цель Павла и сохраняет некоторую смысловую сжатость греческой конструкции, не сводя её однозначно к обычному придаточному цели.
- source_word: τὸν δρόμον μου
  choice: свой путь
  rationale: Естественно передаёт образ предназначенного Павлу поприща; возможный оттенок состязания отмечен в сноске.
- source_word: διακονίαν
  choice: служение
  rationale: Обозначает порученное Господом дело Павла и сохраняет устойчивый, но понятный современному читателю библейский термин.
- source_word: παρὰ τοῦ κυρίου Ἰησοῦ
  choice: от Господа Иисуса
  rationale: Παρά с родительным указывает на источник поручения; титул κύριος передан как «Господь».
- source_word: διαμαρτύρασθαι
  choice: свидетельствовать
  rationale: Передаёт значение настойчивого, серьёзного свидетельства без избыточного пояснения в основном тексте.
- source_word: τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ
  choice: Евангелие Божьей благодати
  rationale: Сохраняет греческую цепочку родительных и не ограничивает её смысл только значением «весть о благодати»; выражение может указывать как на содержание, так и на характер Евангелия.
theological_decisions:
- issue: Значение ψυχή в высказывании Павла
  choice: жизнь
  alternative: душа
  rationale: Контекст говорит о готовности Павла встретить страдания и смерть ради завершения поручения; перевод «жизнь» не привносит отсутствующее здесь противопоставление тела и нематериальной души.
- issue: Смысл ὡς τελειῶσαι
  choice: лишь бы завершить
  alternative: чтобы завершить / с тем чтобы завершить
  rationale: Фраза выражает главную устремлённость Павла, а не только формальную цель; выбранный вариант сохраняет риторическое напряжение.
- issue: Связь родительных в τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ
  choice: Евангелие Божьей благодати
  alternative: Евангелие о Божьей благодати
  rationale: Более буквальная конструкция не решает за читателя, означает ли оборот прежде всего содержание вести или её характер и источник.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Евангелие», «благодать» и «служение» сохранены как широко понятные христианские термины; синтаксис сделан естественным, без устранения смысловой напряжённости греческого текста.
