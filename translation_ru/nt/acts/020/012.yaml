  text: ἤγαγον δὲ τὸν παῖδα ζῶντα, καὶ παρεκλήθησαν οὐ μετρίως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/012.yaml
  text: And they took the boy away alive[a], and were not a little comforted.
translation:
  language: ru
  text: Они увели юношу живым и были весьма утешены.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «были утешены не умеренно»; выражение означает: «были очень утешены».'
    reason: Литота οὐ μετρίως передана естественным русским усилением; примечание сохраняет формальный оттенок исходного выражения.
lexical_decisions:
- source_word: ἤγαγον
  choice: привели
  rationale: Аорист ἄγω допускает значения «вести» и «приводить». Без явно названного пункта назначения «привели» естественно передаёт действие и не добавляет отсутствующей в греческом тексте идеи ухода.
- source_word: παῖδα
  choice: юношу
  rationale: παῖς может означать ребёнка, мальчика или слугу, однако здесь слово относится к Евтиху, ранее названному νεανίας («юноша», ст. 9). «Юношу» сохраняет связь с контекстом и не предполагает, что он был слугой.
- source_word: ζῶντα
  choice: живым
  rationale: 'Причастие употреблено предикативно и обозначает состояние юноши: его привели живым.'
- source_word: παρεκλήθησαν
  choice: обрадовались
  rationale: В данном контексте пассивная форма παρακαλέω выражает сильное утешение и облегчение после того, как юношу увидели живым. Русское «обрадовались» естественно передаёт эту эмоциональную реакцию.
- source_word: οὐ μετρίως
  choice: очень
  rationale: Буквально «не умеренно»; это литота со значением высокой степени. «Очень» ясно и естественно передаёт идиоматический смысл.
theological_decisions:
- issue: Характер события с Евтихом
  choice: Сохранено нейтральное «живым» без пояснения механизма восстановления жизни.
  alternative: Уточнить «воскрешённым» или «пришедшим в себя».
  rationale: Стих утверждает, что юношу привели живым, но сам по себе не формулирует дополнительного объяснения; перевод не должен разрешать богословское и повествовательное напряжение за исходный текст.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная повествовательная формулировка. Греческая литота передана естественным русским усилителем.
