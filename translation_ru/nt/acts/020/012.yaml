  source_fidelity: «Привели» без обозначенного места назначения менее точно передаёт ἤγαγον в данном контексте, где речь идёт о том, что юношу увели/унесли после происшествия. «Обрадовались» передаёт реакцию, но утрачивает значение παρεκλήθησαν — получения утешения, ободрения и облегчения. «Живым» верно передаёт ζῶντα; «юношу» допустимо в свете ст. 9, хотя παῖς само по себе может иметь более широкий возрастной оттенок.
  naturalness: «Они увели юношу живым и были весьма утешены» — естественная современная литературная фраза. «Весьма утешены» несколько книжнее разговорного варианта, но уместно для библейского повествования и точно сохраняет пассивное значение глагола.
  terminology: «Юношу» согласуется с предшествующим обозначением Евтиха как νεανίας и не вносит идеи служебного статуса. «Весьма утешены» передаёт παρακαλέω без сужения до простой радости. Усилитель «весьма» передаёт литоту οὐ μετρίως, не приписывая иной причины их утешению.
