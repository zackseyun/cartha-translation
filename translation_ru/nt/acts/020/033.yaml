  text: ἀργυρίου ἢ χρυσίου ἢ ἱματισμοῦ οὐδενὸς ἐπεθύμησα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/033.yaml
  text: I coveted no one's silver or gold or clothing[a].
translation:
  language: ru
  text: Я не желал ничьего серебра, золота или одежды.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я не домогался ничьего серебра, золота или одежды».'
    reason: Лексическая альтернатива для ἐπεθύμησα; «домогался» сильнее подчёркивает стремление завладеть чужим имуществом.
lexical_decisions:
- source_word: ἀργυρίου
  choice: серебра
  rationale: Сохраняет конкретное название ценности и параллелизм с золотом и одеждой; здесь серебро также могло служить формой богатства.
- source_word: χρυσίου
  choice: золота
  rationale: Прямой и естественный эквивалент, обозначающий ценное имущество.
- source_word: ἱματισμοῦ
  choice: одежды
  rationale: Современное собирательное обозначение одежды; в древнем мире дорогая одежда могла быть значительной ценностью.
- source_word: οὐδενὸς
  choice: принадлежавших кому-либо
  rationale: 'Передаёт генитивную связь: Павел отрицает желание завладеть перечисленным имуществом какого бы то ни было человека. Форма во множественном числе согласуется по смыслу с однородным рядом.'
- source_word: ἐπεθύμησα
  choice: не желал
  rationale: Передаёт значение сильного желания, а контекст чужого имущества сохраняет отрицательный нравственный оттенок; это естественнее в современном русском, чем более узкое «не домогался».
- source_word: ἢ ... ἢ ... ἢ
  choice: ни ... ни ... ни
  rationale: После отрицания повторяющееся «ни» естественно по-русски и сохраняет трёхчастную структуру перечня.
theological_decisions:
- issue: Нравственный оттенок ἐπιθυμέω применительно к чужому имуществу
  choice: «не желал» с явным указанием на принадлежность имущества другим
  alternative: «не домогался» или «не возжелал»
  rationale: Греческий глагол допускает как нейтральное «желать», так и нравственно окрашенное «желать чужого». Контекст защиты бескорыстия придаёт фразе отрицательный оттенок, но перевод не должен делать значение глагола более узким, чем в оригинале.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным звучанием. Конструкция «принадлежавших кому-либо» несколько развёрнута, но ясно передаёт область действия οὐδενός и избегает неестественного сочетания «ничьей одежды» со всем рядом.
