source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ ⸂δεδεμένος ἐγὼ⸃ τῷ πνεύματι πορεύομαι εἰς Ἰερουσαλήμ, τὰ ἐν αὐτῇ συναντήσοντά ⸀μοι μὴ εἰδώς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/022.yaml
  text: And now, behold, bound in the Spirit, I am going to Jerusalem, not knowing what will happen to me there,
translation:
  language: ru
  text: И вот, теперь я, связанный духом[a], иду в Иерусалим, не зная, что случится со мной там.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «связанный Святым Духом». Греческое выражение может относиться как к собственному духу Павла, так и к Святому Духу; возможен также смысл: «побуждаемый Духом».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: вот
  rationale: Передаёт указательно-эмфатическую функцию частицы и подчёркивает торжественный переход в речи Павла, оставаясь естественным для современного русского языка.
- source_word: δεδεμένος
  choice: связанный
  rationale: Сохраняет образ совершенного страдательного причастия от δέω («связывать») и не сводит его значение только к внутреннему побуждению или принуждению.
- source_word: τῷ πνεύματι
  choice: Духом
  rationale: Контекст Деяний и упоминание свидетельства Духа в следующем стихе делают Святого Духа наиболее вероятным референтом. Русский творительный естественно сочетается со словом «связанный», однако подлинная неоднозначность греческой фразы отмечена в сноске.
- source_word: πορεύομαι
  choice: я иду
  rationale: Естественно передаёт настоящее время глагола движения и направленность предстоящего пути.
- source_word: τὰ ἐν αὐτῇ συναντήσοντά μοι
  choice: что случится со мной там
  rationale: Идиоматически передаёт буквальный образ «то, что встретит меня в нём/ней», сохраняя неизвестность ожидающих Павла событий в Иерусалиме.
- source_word: μὴ εἰδώς
  choice: не зная
  rationale: Прямо и естественно передаёт обстоятельственное причастие, относящееся к Павлу.
- source_word: Ἰερουσαλήμ
  choice: Иерусалим
  rationale: Устоявшаяся русская форма географического названия.
theological_decisions:
- issue: Референт выражения τῷ πνεύματι
  choice: 'Святой Дух — наиболее вероятный референт; в основном тексте: «Духом»'
  alternative: 'Собственный дух Павла: «связанный духом»; возможна также смысловая передача «побуждаемый Духом» или «принуждаемый Духом»'
  rationale: В Деяниях πνεῦμα часто обозначает Святого Духа, а ближайший контекст говорит о свидетельстве Духа. Тем не менее грамматика допускает понимание собственного духа Павла и оттенок внутреннего понуждения, поэтому альтернативы не устраняются, а указываются в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Конструкция «И вот теперь» сохраняет выразительный переход; порядок слов и синтаксис остаются ясными для широкого читателя.
