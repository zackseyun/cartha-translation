  text: δουλεύων τῷ κυρίῳ μετὰ πάσης ταπεινοφροσύνης ⸀καὶ δακρύων καὶ πειρασμῶν τῶν συμβάντων μοι ἐν ταῖς ἐπιβουλαῖς τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/019.yaml
  text: serving the Lord with all humility and with tears and trials that happened to me through the plots of the Jews[a][b].
translation:
  language: ru
  text: служа Господу со всем смирением, со слезами и с испытаниями[a], постигшими меня вследствие козней иудеев[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «искушений» или «проверок»; здесь по контексту имеются в виду внешние испытания, вызванные противодействием.'
    reason: lexical_alternative
  - marker: b
    text: То есть козней конкретных противников Павла из числа иудеев, а не всех иудеев вообще.
    reason: cultural_note
lexical_decisions:
- source_word: δουλεύων
  choice: служа
  rationale: Причастие настоящего времени описывает постоянный характер служения Павла; «служа» естественно по-русски и передаёт преданное служение без излишнего акцента на рабском статусе.
- source_word: τῷ κυρίῳ
  choice: Господу
  rationale: Сохранён греческий титул κύριος без добавленного уточнения; в контексте Деяний он естественно относится к Господу Иисусу.
- source_word: μετὰ πάσης ταπεινοφροσύνης
  choice: со всем смирением
  rationale: Передаёт обстоятельство образа действия и усилительную силу πάσης, сохраняя близость к структуре исходного текста.
- source_word: δακρύων
  choice: со слезами
  rationale: Конкретный образ исходного текста сохранён; повтор предлога делает перечисление ясным и естественным по-русски.
- source_word: πειρασμῶν
  choice: среди испытаний
  rationale: В данном контексте речь идёт о внешних тяготах, вызванных враждебными заговорами, а не о внутреннем искушении ко греху; «среди» естественно связывает их с обстоятельствами служения.
- source_word: τῶν συμβάντων μοι
  choice: выпавших на мою долю
  rationale: Естественная литературная формулировка, точно обозначающая испытания, которые произошли с Павлом.
- source_word: ἐν ταῖς ἐπιβουλαῖς
  choice: из-за заговоров
  rationale: ἐν здесь допускает обстоятельственно-причинное понимание; русский оборот ясно передаёт связь испытаний с заговорами, не утверждая более узкой инструментальной нюансировки.
- source_word: τῶν Ἰουδαίων
  choice: иудеев
  rationale: Прямой и традиционно понятный эквивалент Ἰουδαίων; контекстуальное ограничение до конкретных противников Павла вынесено в примечание, а не внесено в основной текст.
theological_decisions:
- issue: Возможность антиеврейского обобщения выражения τῶν Ἰουδαίων
  choice: Сохранить «иудеев», пояснив, что речь о конкретных противниках Павла.
  alternative: «иудейских вождей» или «некоторых иудеев»
  rationale: Исходный текст не содержит слов «вожди» или «некоторые», поэтому основной перевод сохраняет форму оригинала. Примечание предотвращает неправомерное распространение обвинения на весь еврейский народ.
- issue: Смысл πειρασμῶν
  choice: «испытаний» как внешних тягот
  alternative: «искушений» или «проверок»
  rationale: Упоминание заговоров указывает на внешние бедствия и противодействие, хотя лексическая многозначность слова отмечена в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной речи. Синтаксис сохраняет форму зависимого оборота, поскольку стих продолжает предыдущее предложение; повтор «со» проясняет координацию смирения, слёз и испытаний.
