id: ACT.20.18
reference: Acts 20:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὡς δὲ παρεγένοντο πρὸς αὐτὸν εἶπεν αὐτοῖς· Ὑμεῖς ἐπίστασθε ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην εἰς τὴν Ἀσίαν πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/018.yaml
  text: When they came to him[a], he said to them[b], “You yourselves know how I lived among you the whole time from the first day that I set foot in Asia,”
translation:
  language: ru
  text: 'Когда они пришли к нему, он сказал им: «Вы сами знаете, как я жил среди вас[b] всё это время — с самого первого дня, когда ступил на землю Азии[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь Азия — римская провинция на западе Малой Азии, а не современная часть света.
    reason: cultural_note
  - marker: b
    text: 'Или: «каким я был с вами всё это время» либо «как я всё это время находился с вами». Греческое выражение может подчёркивать как образ жизни Павла, так и его постоянное пребывание среди них.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεγένοντο πρὸς αὐτόν
  choice: пришли к нему
  rationale: Передаёт прибытие эфесских старейшин к Павлу и направленность движения, выраженную πρός с винительным падежом.
- source_word: Ὑμεῖς ἐπίστασθε
  choice: Вы сами знаете
  rationale: «Сами» сохраняет подчёркнутое значение явно употреблённого местоимения ὑμεῖς, а «знаете» естественно передаёт личную осведомлённость.
- source_word: ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς
  choice: с самого первого дня, когда
  rationale: Естественно обозначает начальную точку всего периода; «самого» передаёт выразительность оборота без изменения смысла.
- source_word: ἐπέβην εἰς τὴν Ἀσίαν
  choice: ступил на землю Азии
  rationale: Сохраняет наглядный образ ἐπιβαίνω — ступить на землю — и при этом звучит естественно по-русски.
- source_word: πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην
  choice: как я жил среди вас всё это время
  rationale: Передаёт как образ жизни Павла в их среде, так и длительность, выраженную τὸν πάντα χρόνον. Возможность понять оборот как указание на постоянное пребывание отмечена в сноске.
theological_decisions:
- issue: Значение πῶς ... ἐγενόμην
  choice: как я жил среди вас
  alternative: каким я был с вами / как я всё это время находился с вами
  rationale: Греческое выражение допускает акцент как на образе жизни Павла, так и на его постоянном пребывании с адресатами. Основной текст выбран ради естественности, а неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; речь звучит естественно и достойно. Эмфатическое ὑμεῖς передано словом «сами», образность ἐπέβην сохранена выражением «ступил на землю», а географическое уточнение вынесено в сноску.
