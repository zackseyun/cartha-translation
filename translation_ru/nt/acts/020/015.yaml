base_translation:
  language: en
  yaml_path: translation/nt/acts/020/015.yaml
  text: And from there[a], after setting sail, on the next day we came opposite Chios; on the following day we touched at Samos[b]; and on the day after that we came to Miletus.
translation:
  language: ru
  text: Отплыв оттуда, на следующий день мы оказались напротив Хиоса[a]; на следующий день пристали к Самосу[b], а ещё на следующий день прибыли в Милет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «напротив Хиоса» или «у Хиоса». Греческое выражение обозначает положение напротив острова и не обязательно подразумевает высадку на нём.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «зашли на Самос». Здесь употреблён морской термин, который может означать, что судно подошло к берегу или сделало остановку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν ἀποπλεύσαντες
  choice: Отплыв оттуда
  rationale: Краткая деепричастная конструкция естественно передаёт предшествующее действие аористного причастия; «оттуда» сохраняет исходную точку, а последовательность повествования по-русски не требует отдельного начального «и».
- source_word: τῇ ἐπιούσῃ
  choice: на следующий день
  rationale: Временной дательный обозначает следующий день и естественно передаётся этим устойчивым русским оборотом.
- source_word: κατηντήσαμεν ἄντικρυς Χίου
  choice: мы оказались напротив Хиоса
  rationale: Оборот передаёт достижение позиции напротив острова, не подразумевая высадки или захода в порт.
- source_word: τῇ δὲ ἑτέρᾳ
  choice: ещё через день
  rationale: Естественно продолжает последовательность дней и избегает тяжёлого повторения «на следующий день».
- source_word: παρεβάλομεν εἰς Σάμον
  choice: пристали к Самосу
  rationale: В морском контексте глагол обозначает подход судна или заход к месту; «пристали» сохраняет морской оттенок, не уточняя длительность остановки.
- source_word: τῇ δὲ ἐχομένῃ
  choice: а на следующий день
  rationale: Передаёт очередной день в последовательности маршрута и сохраняет связку δέ.
- source_word: ἤλθομεν εἰς Μίλητον
  choice: прибыли в Милет
  rationale: «Прибыли» естественно для описания достижения пункта назначения; русская традиционная форма топонима — «Милет».
- source_word: Χίου / Σάμον / Μίλητον
  choice: Хиос / Самос / Милет
  rationale: Использованы закрепившиеся в современном русском языке формы античных географических названий.
