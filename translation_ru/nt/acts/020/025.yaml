id: ACT.20.25
reference: Acts 20:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ νῦν ἰδοὺ ἐγὼ οἶδα ὅτι οὐκέτι ὄψεσθε τὸ πρόσωπόν μου ὑμεῖς πάντες ἐν οἷς διῆλθον κηρύσσων τὴν ⸀βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/025.yaml
  text: And now, look, I know that none of you among whom I went about proclaiming the kingdom will see my face again.
translation:
  language: ru
  text: И вот теперь я знаю, что вы все, среди кого я ходил, возвещая Царство, больше не увидите моего лица.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ νῦν ἰδοὺ
  choice: И вот теперь
  rationale: Естественно передаёт переход καὶ νῦν и привлекающее внимание ἰδού без архаического «се» и без избыточного отдельного повеления «посмотрите».
- source_word: ἐν οἷς διῆλθον
  choice: среди кого я ходил
  rationale: Сохраняет образ служения Павла среди этих людей; «ходил» в данном контексте естественно обозначает его деятельность и перемещения среди них.
- source_word: κηρύσσων
  choice: возвещая
  rationale: Передаёт публичное провозглашение вести в достойном современном регистре.
- source_word: τὴν βασιλείαν
  choice: Царство
  rationale: Сохраняет краткую форму греческого текста без добавления отсутствующего уточнения «Божье»; прописная буква указывает на богословское употребление.
- source_word: οὐκέτι ὄψεσθε τὸ πρόσωπόν μου
  choice: больше не увидите моего лица
  rationale: Близко воспроизводит семитически окрашенное выражение греческого текста и ясно означает, что они больше не увидятся с Павлом.
theological_decisions:
- issue: Подразумеваемая принадлежность Царства
  choice: Царство
  alternative: Царство Божье
  rationale: В данном стихе SBLGNT имеет только τὴν βασιλείαν. Уточнение понятно из контекста, но его не следует вносить в основной текст.
- issue: Охват обращения πάντες
  choice: вы все, среди кого я ходил
  alternative: никто из вас, среди кого я ходил
  rationale: Греческая конструкция буквально утверждает, что все адресаты больше не увидят Павла; выбранная формулировка сохраняет этот общий охват и остаётся естественной по-русски.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской речи. Синтаксис ясен для обычного читателя; архаизмы и конфессиональные добавления исключены.
