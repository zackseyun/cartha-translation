  text: ἐγὼ ⸀οἶδα ὅτι εἰσελεύσονται μετὰ τὴν ἄφιξίν μου λύκοι βαρεῖς εἰς ὑμᾶς μὴ φειδόμενοι τοῦ ποιμνίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/029.yaml
  text: I know that after my departure fierce wolves will come in among you[b][a], not sparing the flock.
translation:
  language: ru
  text: Я знаю, что после моего ухода[a] в вашу среду войдут свирепые волки[b] и не пощадят стада.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «после моего прихода (прибытия)»; по контексту речь идёт об уходе Павла.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «лютые волки». Греческое определение может выражать суровую, жестокую или губительную силу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: Я знаю
  rationale: Передаёт уверенное знание Павла прямо и естественно, без усиления до «я уверен».
- source_word: εἰσελεύσονται … εἰς ὑμᾶς
  choice: в вашу среду войдут
  rationale: Сохраняет образ вторжения волков внутрь общины и звучит естественно по-русски.
- source_word: μετὰ τὴν ἄφιξίν μου
  choice: после моего ухода
  rationale: Хотя существительное обычно связано с приходом или прибытием, контекст прощальной речи указывает на события после отсутствия Павла; буквальная форма отмечена в сноске.
- source_word: λύκοι βαρεῖς
  choice: свирепые волки
  rationale: βαρεῖς в данном образе выражает суровую, губительную опасность; «свирепые» ясно передаёт её и сохраняет метафору.
- source_word: μὴ φειδόμενοι
  choice: и не пощадят
  rationale: Естественная русская передача обстоятельственного причастия, сохраняющая беспощадность действия.
- source_word: τοῦ ποιμνίου
  choice: стада
  rationale: Сохраняет пастырскую метафору исходного текста и связь с образом волков.
theological_decisions:
- issue: Кого обозначают «волки»
  choice: Сохранить метафору без поясняющей расшифровки в основном тексте.
  alternative: «лжеучители», «гонители» или «губительные люди»
  rationale: Стих не определяет этих людей точнее; расшифровка сузила бы намеренно ёмкий образ.
- issue: Значение ἄφιξις в контексте
  choice: «уход» с указанием буквального значения в сноске
  alternative: «прибытие» или «приход»
  rationale: В прощальной речи Павел предупреждает о том, что произойдёт после его отсутствия. Сноска сохраняет заметное лексическое напряжение греческой формулировки.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной простоты и пастырской метафоры. Порядок слов подчёркивает вторжение в общину; богословская идентификация «волков» намеренно не добавлена.
