  source_fidelity: 'Текст точно передаёт греческий оригинал: οἶδα — «Я знаю»; будущее εἰσελεύσονται и εἰς ὑμᾶς — «в вашу среду войдут»; μὴ φειδόμενοι τοῦ ποιμνίου — «и не пощадят стада». Образ волков сохранён без преждевременного истолкования. «После моего ухода» обоснован контекстом прощальной речи, а сноска корректно отмечает буквальное значение ἄφιξις («приход/прибытие»).'
