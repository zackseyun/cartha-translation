source:
  edition: SBLGNT
  text: πάντα ὑπέδειξα ὑμῖν ὅτι οὕτως κοπιῶντας δεῖ ἀντιλαμβάνεσθαι τῶν ἀσθενούντων, μνημονεύειν τε τῶν λόγων τοῦ κυρίου Ἰησοῦ ὅτι αὐτὸς εἶπεν Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/035.yaml
  text: In everything I showed you that by laboring in this way it is necessary to help the weak[a], and to remember the words of the Lord Jesus, that he himself said, ‘It is more blessed to give than to receive.’
translation:
  language: ru
  text: 'Я во всём показал вам, что, трудясь так, следует поддерживать слабых[a] и помнить слова Господа Иисуса, потому что Он сам сказал: «Блаженнее давать, чем получать».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помогать слабым». Греческий глагол может подразумевать длительную поддержку, а не только разовую помощь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: Во всём
  rationale: 'Наречное употребление при ὑπέδειξα: Павел говорит о полноте показанного им примера, а не об обособленном объекте «всё».'
- source_word: ὑπέδειξα
  choice: я показал
  rationale: Передаёт значение «показать, продемонстрировать», включая показ собственным примером, без излишней конкретизации.
- source_word: οὕτως κοπιῶντας
  choice: трудясь таким образом
  rationale: Сохраняет указание на описанный ранее образ напряжённого труда и естественно передаёт причастную конструкцию.
- source_word: δεῖ
  choice: нужно
  rationale: Выражает необходимость и обязанность без добавления отсутствующего в греческом явного подлежащего.
- source_word: ἀντιλαμβάνεσθαι
  choice: поддерживать
  rationale: Глагол означает приходить на помощь и оказывать поддержку; в данном контексте форма несовершенного вида уместно передаёт не только разовую помощь, но и постоянное содействие.
- source_word: τῶν ἀσθενούντων
  choice: слабых
  rationale: Сохраняет широкий смысл греческого выражения и не сужает его до больных, бедных или духовно немощных.
- source_word: μνημονεύειν τε
  choice: и помнить
  rationale: Естественно передаёт координацию двух необходимых действий.
- source_word: τῶν λόγων τοῦ κυρίου Ἰησοῦ
  choice: слова Господа Иисуса
  rationale: Прямо передаёт λόγων и традиционно, но современно воспроизводит титул κύριος.
- source_word: αὐτὸς εἶπεν
  choice: Он Сам сказал
  rationale: Сохраняет эмфатическую силу αὐτός, подчёркивающую, что изречение принадлежит Самому Иисусу.
- source_word: Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν
  choice: Блаженнее давать, чем получать
  rationale: Краткая и естественная русская сравнительная конструкция, сохраняющая богословски значимое μακάριον как «блаженнее».
theological_decisions:
- issue: Объём значения «слабых»
  choice: Сохранено широкое «слабых» без уточнения вида слабости.
  alternative: бедных; больных; немощных в вере
  rationale: ἀσθενούντων допускает физическую, материальную или иную уязвимость; ближайший контекст труда и даяния не требует сводить значение к одной категории.
- issue: Характер помощи
  choice: «поддерживать» как возможная продолжительная помощь
  alternative: «помогать» как более общее обозначение содействия
  rationale: ἀντιλαμβάνεσθαι может обозначать деятельное принятие на себя заботы и устойчивую поддержку; при этом более широкая альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским регистром. Синтаксис следует греческой логике, но остаётся естественным для обычного читателя; заглавные местоимения в отношении Иисуса использованы в соответствии с устойчивой русской библейской издательской практикой.
