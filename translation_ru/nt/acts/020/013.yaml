  text: Ἡμεῖς δὲ ⸀προελθόντες ⸀ἐπὶ τὸ πλοῖον ἀνήχθημεν ἐπὶ τὴν Ἆσσον, ἐκεῖθεν μέλλοντες ἀναλαμβάνειν τὸν Παῦλον, οὕτως γὰρ ⸂διατεταγμένος ἦν⸃ μέλλων αὐτὸς πεζεύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/013.yaml
  text: But we[a], having gone ahead to the ship, set sail for Assos, intending to take Paul on board from there, for so he had arranged[b], since he himself intended to go by land.
translation:
  language: ru
  text: Мы же, отправившись вперёд к кораблю, отплыли в Асс, чтобы оттуда взять Павла на борт, ибо он так распорядился[a], намереваясь сам идти пешком[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ибо так было распоряжено». Греческая конструкция формально имеет страдательную форму; в контексте она, вероятно, относится к распоряжению самого Павла.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «идти по суше» или «сухопутным путём». Греческий глагол обозначает путешествие пешком и противопоставляет путь Павла плаванию его спутников.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προελθόντες
  choice: прибыв раньше
  rationale: Аористное причастие обозначает действие, предшествующее отплытию, и передаёт, что спутники Павла опередили его.
- source_word: ἐπὶ τὸ πλοῖον
  choice: к кораблю
  rationale: Предлог с винительным обозначает движение к кораблю или на него; последующее «отплыли» ясно подразумевает посадку.
- source_word: ἀνήχθημεν
  choice: отплыли
  rationale: В морском контексте глагол означает выход в море; «отплыли» естественно для современного русского повествования.
- source_word: ἐπὶ τὴν Ἆσσον
  choice: в Асс
  rationale: Передаёт направление плавания; «Асс» — традиционная русская форма названия Ἆσσος.
- source_word: μέλλοντες ἀναλαμβάνειν
  choice: намереваясь там взять Павла на борт
  rationale: μέλλω выражает намерение, а ἀναλαμβάνω в данном морском контексте — принятие человека на корабль.
- source_word: ἐκεῖθεν
  choice: там
  rationale: Хотя наречие буквально может иметь значение «оттуда», по-русски при глаголе «взять на борт» место посадки естественно обозначить словом «там».
- source_word: διατεταγμένος ἦν
  choice: Так он распорядился
  rationale: Формально это перифрастическая пассивная конструкция, однако контекст естественно допускает отнесение распоряжения к Павлу; неоднозначность отмечена в сноске.
- source_word: μέλλων αὐτὸς πεζεύειν
  choice: поскольку сам намеревался идти по суше
  rationale: πεζεύω противопоставляет сухопутный путь морскому; αὐτός передан усилительным «сам».
- source_word: δὲ
  choice: же
  rationale: Частица отмечает мягкое противопоставление действий группы и Павла без чрезмерно резкого русского «но».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное. Сохранено мягкое противопоставление между группой рассказчика и Павлом, а формальная неоднозначность страдательной конструкции и объём значения πεζεύειν вынесены в сноски.
