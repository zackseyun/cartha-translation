  to: Мы же, отправившись вперёд к кораблю, отплыли в Асс, чтобы оттуда взять Павла на борт, ибо он так распорядился[a], намереваясь сам идти пешком[b].
  rationale: Исправлено направление, выраженное ἐκεῖθεν («оттуда»), и в основном тексте выбран более точный эквивалент πεζεύειν («идти пешком»). Прежняя смысловая неопределённость страдательной формы διατεταγμένος ἦν сохранена сноской, при этом личное прочтение в основном тексте остаётся контекстуально вероятным. Перестроено начальное обстоятельство, чтобы естественнее передать προελθόντες без добавления невыраженного «прибытия».
