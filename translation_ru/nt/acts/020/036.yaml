  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Сказав это
  rationale: Начальное Καί в русском повествовании естественно передаётся связью действий без отдельного «и»; последовательность выражена деепричастным оборотом.
- source_word: ταῦτα εἰπὼν
  choice: Сказав это
  rationale: Аористное причастие обозначает действие, предшествующее главному; «это» естественно отсылает к только что сказанному.
- source_word: θεὶς τὰ γόνατα αὐτοῦ
  choice: преклонил колени
  rationale: Буквально «положив свои колени» — греческий оборот со значением встать на колени. Русское «преклонил колени» точно передаёт позу и сохраняет достоинство стиля, не добавляя оттенка внезапного падения.
- source_word: σὺν πᾶσιν αὐτοῖς
  choice: вместе со всеми ими
  rationale: Передаёт сопровождение, выраженное σύν, и сохраняет явный акцент πᾶσιν на участии всей группы.
- source_word: προσηύξατο
  choice: помолился
  rationale: Прямой и естественный русский эквивалент стандартного греческого глагола молитвы; совершенный вид соответствует целостному повествовательному действию аориста.
