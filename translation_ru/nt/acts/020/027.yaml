  verdict: revise
  source_fidelity: '«Весь замысел Бога» удачно передаёт πᾶσαν τὴν βουλὴν τοῦ θεοῦ: «замысел» охватывает намерение, план и цель, не сводя выражение ни к нравственной воле, ни к предопределяющему постановлению. Однако «не уклонился от того, чтобы возвестить» несколько тяжеловесно и у «уклониться» может вызвать оттенок уклонения от обязанности, тогда как ὑπεστειλάμην в данном контексте означает не отступать и не удерживаться от возвещения. Более прямое «не стал удерживаться от того, чтобы...» не годится, поскольку в русском может значить невозможность удержаться. Формулировка с «не отступил перед возвещением» естественнее, но добавляет оттенок страха. Поэтому предпочтительно «не уклонялся от возвещения», что ясно передаёт постоянную практику служения, выраженную аористом в итоговом заявлении.'
