  text: οὐ γὰρ ὑπεστειλάμην τοῦ μὴ ἀναγγεῖλαι ⸂πᾶσαν τὴν βουλὴν τοῦ θεοῦ ὑμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/027.yaml
  text: For I did not shrink back from declaring to you the whole counsel of God[a].
translation:
  language: ru
  text: Ибо я не уклонялся от возвещения вам всего замысла Бога[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всей воли Бога», «всего намерения Бога» или «всего плана Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Ведь
  rationale: Передаёт пояснительно-обосновывающую связь с предыдущей мыслью и естественно звучит в современном русском языке.
- source_word: ὑπεστειλάμην
  choice: не уклонился
  rationale: Сохраняет образ отступления от трудного или нежелательного действия и не сводит смысл лишь к колебанию или страху.
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: от того, чтобы возвестить
  rationale: Передаёт дополнение при глаголе ὑποστέλλω и торжественный оттенок ἀναγγέλλω в контексте публичного наставления.
- source_word: πᾶσαν
  choice: весь
  rationale: При существительном в единственном числе подчёркивает полноту возвещённого.
- source_word: βουλὴν
  choice: замысел
  rationale: Современное русское слово, способное обозначать намерение и план; оно не вызывает у читателя ошибочной ассоциации с «советом» как рекомендацией или собранием.
- source_word: τοῦ θεοῦ
  choice: Бога
  rationale: 'Прямо передаёт родительный падеж: замысел принадлежит Богу или исходит от Него.'
- source_word: ὑμῖν
  choice: вам
  rationale: Передаёт адресатов возвещения — эфесских пресвитеров.
theological_decisions:
- issue: Значение βουλὴ τοῦ θεοῦ
  choice: весь замысел Бога
  alternative: вся воля Бога; всё намерение Бога; весь план Бога
  rationale: βουλή может обозначать замысел, намерение, план или волю. «Замысел» сохраняет широкое значение и не сужает фразу исключительно до предвечного постановления либо нравственных требований; основные возможные оттенки отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Конструкция «не уклонился от того, чтобы возвестить» сохраняет метафору греческого текста; «замысел Бога» предпочтён архаичному и потенциально двусмысленному выражению «совет Божий».
