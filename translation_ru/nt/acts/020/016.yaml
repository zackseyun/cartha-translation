source:
  edition: SBLGNT
  text: ⸀κεκρίκει γὰρ ὁ Παῦλος παραπλεῦσαι τὴν Ἔφεσον, ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι ἐν τῇ Ἀσίᾳ, ἔσπευδεν γὰρ εἰ δυνατὸν ⸀εἴη αὐτῷ τὴν ἡμέραν τῆς πεντηκοστῆς γενέσθαι εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/016.yaml
  text: For Paul had decided to sail past Ephesus[a], so that he might not have to spend time in Asia; for he was hurrying to be in Jerusalem, if possible[b], on the day of Pentecost.
translation:
  language: ru
  text: Павел уже решил проплыть мимо Эфеса, чтобы не задерживаться в Асии[a], потому что спешил, если это будет возможно[b], быть в Иерусалиме ко дню Пятидесятницы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Асия» здесь — римская провинция на западе Малой Азии, а не современная часть света Азия.
    reason: cultural_note
  - marker: b
    text: 'Или: «прибыть в Иерусалим в день Пятидесятницы». Греческое выражение может подчёркивать либо присутствие там к этому дню, либо прибытие туда в тот день.'
    reason: alternative_reading
lexical_decisions:
- source_word: κεκρίκει
  choice: решил
  rationale: Плюсквамперфект указывает на принятое ранее твёрдое решение; в русском повествовании это естественно передаётся формой «решил».
- source_word: παραπλεῦσαι τὴν Ἔφεσον
  choice: пройти мимо Эфеса морем
  rationale: Передаёт как движение мимо города, так и прямо выраженный морской характер пути.
- source_word: ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι
  choice: чтобы не задерживаться
  rationale: Естественно передаёт цель Павла — избежать траты времени или задержки, не воспроизводя тяжеловесно греческую конструкцию.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: в Асии
  rationale: «Асия» — принятое русское историко-библейское название римской провинции, позволяющее отличить её от современного континента Азия.
- source_word: ἔσπευδεν
  choice: спешил
  rationale: Сохраняет значение продолжающейся поспешности в контексте путешествия.
- source_word: εἰ δυνατὸν εἴη αὐτῷ
  choice: если получится
  rationale: Современная и естественная передача реальной, но не гарантированной возможности; не превращает намерение в уверенность.
- source_word: τὴν ἡμέραν τῆς πεντηκοστῆς
  choice: ко дню Пятидесятницы
  rationale: В сочетании с целью путешествия естественно обозначает желаемый срок присутствия в Иерусалиме, сохраняя временную неоднозначность конструкции через примечание.
- source_word: γενέσθαι εἰς Ἱεροσόλυμα
  choice: быть в Иерусалиме
  rationale: Передаёт намеченный результат — присутствовать там к празднику; возможное значение прибытия отмечено в сноске.
- source_word: Ἱεροσόλυμα
  choice: Иерусалим
  rationale: Стандартная русская форма географического названия.
- source_word: πεντηκοστῆς
  choice: Пятидесятница
  rationale: Устоявшееся русское название праздника в новозаветном контексте.
theological_decisions:
- issue: Временной смысл выражения γενέσθαι εἰς Ἱεροσόλυμα с винительным времени
  choice: быть в Иерусалиме ко дню Пятидесятницы
  alternative: прибыть в Иерусалим в день Пятидесятницы
  rationale: Греческое выражение допускает акцент либо на присутствии там к назначенному дню, либо на прибытии в тот день. Основной текст передаёт вероятный целевой срок, а примечание сохраняет альтернативу.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным стилем. «Пройти мимо Эфеса морем» сохраняет морскую семантику глагола; «Асия» употреблено как историческое название провинции и пояснено в сноске. Формулировка «если получится» звучит естественно и сохраняет условность.
