source:
  edition: SBLGNT
  text: ὡς οὐδὲν ὑπεστειλάμην τῶν συμφερόντων τοῦ μὴ ἀναγγεῖλαι ὑμῖν καὶ διδάξαι ὑμᾶς δημοσίᾳ καὶ κατ’ οἴκους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/020.yaml
  text: how I did not shrink back from declaring to you anything that was profitable and teaching you publicly and from house to house,[a]
translation:
  language: ru
  text: как я не уклонился от того, чтобы возвещать вам всё полезное и учить вас публично и по домам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как я ничего полезного для вас не утаил, но возвещал и учил вас публично и по домам».'
    reason: 'Лексическая и синтаксическая альтернатива: ὑποστέλλω может означать «удерживать, утаивать», а τῶν συμφερόντων может пониматься как объект того, что не было утаено.'
lexical_decisions:
- source_word: ὑπεστειλάμην
  choice: не уклонился
  rationale: Средняя форма ὑποστέλλω означает отступить, уклониться или удержаться от действия. «Не уклонился» естественно передаёт отказ Павла отступить перед исполнением служения, не добавляя мотива страха.
- source_word: τῶν συμφερόντων
  choice: всё полезное
  rationale: Субстантивированное причастие от συμφέρω обозначает то, что приносит пользу. «Всё полезное» сохраняет широкий смысл и не вызывает возможной ассоциации слова «выгодное» с материальной выгодой.
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: от того, чтобы возвещать
  rationale: Артикулярный инфинитив с μή после ὑπεστειλάμην раскрывает действие, от которого Павел не уклонился. Русская конструкция сохраняет зависимость инфинитива и отрицания.
- source_word: ἀναγγεῖλαι
  choice: возвещать
  rationale: ἀναγγέλλω значит сообщать, объявлять, делать известным. «Возвещать» соответствует серьёзному контексту служения и остаётся отличным от последующего «учить».
- source_word: διδάξαι
  choice: учить
  rationale: διδάσκω прямо означает «учить». Однородный инфинитив передаёт координацию двух действий, зависящих от одного главного глагола.
- source_word: δημοσίᾳ
  choice: всенародно
  rationale: Наречное употребление указывает на открытое, публичное служение. «Всенародно» естественно противопоставляется дальнейшему «по домам» и имеет достоинство библейского повествовательного регистра.
- source_word: κατ’ οἴκους
  choice: по домам
  rationale: κατά с винительным множественного числа имеет распределительное значение. «По домам» передаёт служение в отдельных домах, не утверждая непременно последовательного обхода каждого дома.
- source_word: ὡς
  choice: как
  rationale: ὡς продолжает начатое в предыдущем контексте напоминание Павла о том, каким было его поведение. Русское «как» естественно сохраняет эту связь.
theological_decisions:
- issue: Характер пользы в выражении τῶν συμφερόντων
  choice: сохранить широкое «всё полезное»
  alternative: уточнить как «всё полезное для вашей духовной жизни»
  rationale: Контекст служения Павла предполагает прежде всего духовную и пастырскую пользу, однако сам греческий текст не вводит такого уточнения. Основной текст поэтому сохраняет более широкое значение.
- issue: Соотношение публичного служения и служения по домам
  choice: передать оба способа служения без дальнейшего уточнения
  alternative: истолковать κατ’ οἴκους как последовательный обход домов или исключительно домашние собрания
  rationale: Текст противопоставляет открытое служение служению в отдельных домах, но не определяет ни точный порядок посещений, ни состав домашних встреч.
translation_notes:
  register: Современный литературный русский с достоинством повествовательной речи. «Всенародно» выбрано как понятное и более органичное в библейском контексте, чем заимствованное «публично»; «по домам» сохраняет распределительный смысл и естественно звучит по-русски.
