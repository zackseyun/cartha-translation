review_pass:
  verdict: revise
  source_fidelity: 'В целом переданы все основные элементы греческого текста: внутренний источник угрозы (ἐξ ὑμῶν αὐτῶν), будущее появление таких лиц, мужской род ἄνδρες, содержание их речи, цель отвлечь учеников и последование за ними. Однако «восстанут» в современном русском прежде всего вызывает значение мятежа или активного выступления, которого ἀναστήσονται здесь не требует; нейтральное «появятся» точнее передаёт значение возникновения/выдвижения.'
  naturalness: '«Из вас самих восстанут мужчины» звучит неестественно: сочетание «восстанут мужчины» легко понимается как начало восстания. «Среди вас самих появятся мужчины» сохраняет конкретно мужской референт и заметно естественнее. «Будут говорить превратное» — литературное и ясное русское соответствие субстантивированному διεστραμμένα.'
  terminology: «Ученики» уместно передаёт μαθηταί в Деяниях. «Мужчины» сохраняет специфически мужское ἄνδρες, хотя в данном контексте несколько маркировано; замена на «люди» была бы утратой указанного признака. «Превратное» передаёт широкий смысл искажённого/искажавшего истину высказывания, не навязывая конкретной ереси или моральной оценки.
  issues:
