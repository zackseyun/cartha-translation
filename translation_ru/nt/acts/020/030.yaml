    rationale: Русское «восстанут» обычно связано с восстанием, бунтом либо решительным выступлением. В данном контексте ἀναστήσονται означает, что такие мужчины возникнут/появятся внутри общины, без необходимого оттенка мятежа.
  - severity: low
    issue: Основной вариант «извращённое» может в современном употреблении чрезмерно смещать смысл к нравственной или сексуальной девиации.
    rationale: διεστραμμένα обозначает то, что искривлено, искажено или превратно представлено. «Превратное» лучше сохраняет широту предупреждения о содержании речи.
  revised_text: И среди вас самих появятся мужчины, которые будут говорить превратное[a], чтобы увлечь учеников за собой.
