  text: καὶ ἐξ ὑμῶν αὐτῶν ἀναστήσονται ἄνδρες λαλοῦντες διεστραμμένα τοῦ ἀποσπᾶν τοὺς μαθητὰς ὀπίσω ⸀ἑαυτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/030.yaml
  text: and from among your own selves men will arise[a], speaking twisted things, to draw away the disciples after themselves.
translation:
  language: ru
  text: И среди вас самих появятся мужчины, которые будут говорить превратное[a], чтобы увлечь учеников за собой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «искажённое»; или: «извращённое».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: из вас самих
  rationale: Сохраняет эмфатическое указание на то, что угроза возникнет внутри самой общины.
- source_word: ἀναστήσονται
  choice: восстанут
  rationale: Передаёт будущее время и идиоматическое значение появления или выдвижения таких людей; в данном контексте звучит естественно и весомо.
- source_word: ἄνδρες
  choice: мужчины
  rationale: Греческое ἀνήρ имеет конкретно мужское значение, поэтому оно не нейтрализовано как «люди».
- source_word: λαλοῦντες
  choice: которые будут говорить
  rationale: Естественно передаёт обстоятельственный причастный оборот и продолжающуюся речевую деятельность.
- source_word: διεστραμμένα
  choice: извращённое
  rationale: Субстантивированное среднее множественного числа обозначает искажённые или извращённые утверждения без уточнения конкретной ереси; собирательное единственное естественно по-русски.
- source_word: τοῦ ἀποσπᾶν
  choice: чтобы увлечь
  rationale: Передаёт значение цели и идею отрыва учеников от прежней верности; «увлечь» естественно сочетается с последующим «за собой».
- source_word: τοὺς μαθητὰς
  choice: учеников
  rationale: Сохраняет устоявшийся в книге Деяний термин для последователей Иисуса.
- source_word: ὀπίσω ἑαυτῶν
  choice: за собой
  rationale: Естественно передаёт идиому следования и стремление создать круг личных приверженцев.
theological_decisions:
- issue: Характер речи лжеучителей
  choice: говорить извращённое
  alternative: говорить искажённое; говорить превратное
  rationale: Формулировка сохраняет широкое указание на отклонение от истины и не сводит предупреждение к определённой ереси или только к нравственной порочности.
- issue: Передача рода ἄνδρες
  choice: мужчины
  alternative: люди; лица
  rationale: Исходное слово имеет конкретно мужское значение, поэтому перевод сохраняет его, не вводя гендерно-нейтрального обобщения.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского предупреждения. Синтаксис сделан естественным для русского читателя, при этом сохранены внутренняя направленность угрозы, целевой оттенок τοῦ ἀποσπᾶν и неоднозначная широта διεστραμμένα.
