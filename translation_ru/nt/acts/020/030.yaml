- from: И из вас самих восстанут мужчины, которые будут говорить извращённое[a], чтобы увлечь учеников за собой.
  to: И среди вас самих появятся мужчины, которые будут говорить превратное[a], чтобы увлечь учеников за собой.
  rationale: 'Исправлены две безопасные стилистико-семантические точки: «появятся» устраняет ложную ассоциацию с мятежом, сохраняя будущий характер ἀναστήσονται; «превратное» передаёт διεστραμμένα в литературном русском без неоправданного сужения смысла. Сохранены мужской род, акцент на происхождении угрозы изнутри общины, цель действия и образ личного увлечения учеников.'
