  yaml_path: translation/nt/acts/020/002.yaml
  text: After passing through those regions and encouraging them with many words[a], he came into Greece.
translation:
  language: ru
  text: Пройдя по тем областям и ободрив их многими словами[a], он пришёл в Грецию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «много увещевав их»; буквально: «ободрив (или увещевав) их многим словом». Вероятно, «их» — верующих в этих областях.'
    reason: Передаёт смысловую широту παρακαλέσας, буквальную форму λόγῳ πολλῷ и контекстуально вероятный референт αὐτούς, не добавляя его в основной текст.
lexical_decisions:
- source_word: διελθὼν
  choice: Пройдя
  rationale: Аористное причастие обозначает действие, предшествующее основному глаголу; деепричастие естественно передаёт эту последовательность по-русски.
- source_word: τὰ μέρη ἐκεῖνα
  choice: по тем областям
  rationale: μέρη здесь обозначает географические области; предлог «по» естественно сочетается с глаголом движения «пройдя».
- source_word: παρακαλέσας
  choice: наставляя
  rationale: παρακαλέω охватывает ободрение, увещание и наставление. «Наставляя» сохраняет широкий пастырский смысл, не сводя его только к утешению.
- source_word: αὐτοὺς
  choice: верующих
  rationale: Местоимение указывает на учеников в упомянутых областях. Явное обозначение референта делает русский текст понятным; добавление отмечено как контекстуальное в сноске.
- source_word: λόγῳ πολλῷ
  choice: много наставляя
  rationale: Буквально выражение означает «многим словом / пространной речью» и указывает на значительный объём речи или наставления. Наречное «много» звучит естественно и сохраняет количественный оттенок.
- source_word: ἦλθεν εἰς τὴν Ἑλλάδα
  choice: он пришёл в Грецию
  rationale: Передаёт движение к названной стране естественным современным русским выражением.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Слабая связка δέ естественно поглощается русской деепричастной конструкцией; отдельное «же» здесь было бы стилистически тяжеловесным.
