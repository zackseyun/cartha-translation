base_translation:
  language: en
  yaml_path: translation/nt/acts/020/001.yaml
  text: After the uproar had ceased[a], Paul sent for the disciples, and after encouraging them and saying farewell, he departed to go to Macedonia.
translation:
  language: ru
  text: После того как утихли беспорядки, Павел послал за учениками, ободрил их, попрощался с ними[a] и отправился в Македонию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поприветствовал их». Греческий глагол может означать как приветствие, так и, в контексте отъезда, прощание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὸ παύσασθαι
  choice: Когда ... утихло
  rationale: Оборот с μετά и субстантивированным инфинитивом задаёт время последующего действия. В русском повествовании «когда ... утихло» естественно передаёт завершённость предшествующего события без тяжеловесной конструкции.
- source_word: θόρυβον
  choice: волнение
  rationale: В контексте эфесских событий слово обозначает общественные беспорядки и шумное возбуждение; «волнение» понятно современному читателю и сохраняет связь с предшествующим рассказом.
- source_word: μεταπεμψάμενος
  choice: позвал
  rationale: Средний залог передаёт смысл «послать за кем-либо, чтобы тот пришёл». Контекстуально естественное «позвал» выражает результат этого действия без излишней официальности.
- source_word: τοὺς μαθητὰς
  choice: учеников
  rationale: Сохраняется характерное для Деяний обозначение последователей Иисуса, без замены более широким словом «верующие».
- source_word: παρακαλέσας
  choice: ободрил их
  rationale: παρακαλέω здесь может включать увещание, утешение и укрепление. «Ободрил» естественно для прощальной сцены после смуты и не сводит действие лишь к наставлению.
- source_word: ἀσπασάμενος
  choice: попрощался с ними
  rationale: Основное значение — приветствовать, однако в контексте отъезда глагол может обозначать прощание. Этот контекстуальный смысл вынесен в текст, а буквальная лексическая альтернатива сохранена в сноске.
- source_word: ἐξῆλθεν
  choice: отправился
  rationale: В повествовании о путешествии глагол функционирует как обозначение отбытия; «отправился» естественно объединяется с указанным далее направлением.
- source_word: πορεύεσθαι εἰς Μακεδονίαν
  choice: в Македонию
  rationale: Инфинитив обозначает намеренное движение к месту назначения. По-русски сочетание «отправился в Македонию» полно и естественно передаёт смысл без отдельного глагола «идти».
