  text: διὸ γρηγορεῖτε, μνημονεύοντες ὅτι τριετίαν νύκτα καὶ ἡμέραν οὐκ ἐπαυσάμην μετὰ δακρύων νουθετῶν ἕνα ἕκαστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/031.yaml
  text: Therefore stay alert[a], remembering that for three years, night and day, I did not stop admonishing each one with tears.
translation:
  language: ru
  text: Поэтому бодрствуйте, помня, что три года ночью и днём я не переставал со слезами наставлять[a] каждого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предостерегать». Греческий глагол может обозначать как наставление и исправление, так и предостережение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего предупреждения и сохраняет логическую связь.
- source_word: γρηγορεῖτε
  choice: бодрствуйте
  rationale: Настоящее повелительное наклонение призывает к постоянной бдительности; слово естественно и уместно в современном литературном русском.
- source_word: μνημονεύοντες
  choice: помня
  rationale: 'Деепричастие сохраняет связь с основным призывом: бодрствовать, удерживая в памяти пример Павла.'
- source_word: τριετίαν
  choice: три года
  rationale: Передаёт винительный длительности времени без лишней тяжеловесности.
- source_word: νύκτα καὶ ἡμέραν
  choice: ночью и днём
  rationale: Сохраняет порядок исходного текста и выражает непрестанность служения естественным русским оборотом.
- source_word: οὐκ ἐπαυσάμην
  choice: я не переставал
  rationale: Точно и идиоматично передаёт непрекращавшееся действие.
- source_word: μετὰ δακρύων
  choice: со слезами
  rationale: Сохраняет значение сопровождения и эмоциональную силу выражения.
- source_word: νουθετῶν
  choice: вразумлять
  rationale: Передаёт наставление, обращённое к уму и совести, включая исправляющий и предостерегающий оттенки.
- source_word: ἕνα ἕκαστον
  choice: каждого
  rationale: Кратко передаёт распределительное значение и подчёркивает личное внимание к каждому человеку.
theological_decisions:
- issue: Пастырский смысл νουθετῶν
  choice: вразумлять
  alternative: предостерегать; наставлять
  rationale: «Вразумлять» удерживает вместе наставительный и исправляюще-предостерегающий смысл, не сводя служение Павла только к сообщению знаний или предупреждению.
translation_notes:
  register: Современный литературный русский язык; тон ясный, достойный и пастырски серьёзный. Синтаксис следует структуре греческого текста, оставаясь естественным для русского читателя.
