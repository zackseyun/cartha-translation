lexical_decisions:
- source_word: ἱκανὸς κλαυθμὸς ἐγένετο πάντων
  choice: Все горько плакали
  rationale: Конструкция указывает на сильный плач всех присутствовавших. «Горько плакали» естественно и выразительно передаёт интенсивность, не утяжеляя русский текст буквальным оборотом «был великий плач».
- source_word: ἐπιπεσόντες ἐπὶ τὸν τράχηλον τοῦ Παύλου
  choice: обнимали Павла за шею
  rationale: Русский идиоматический оборот сохраняет явный образ шеи и передаёт выраженное в греческом жестом объятие; причастие согласовано по времени с последовательностью действий.
- source_word: κατεφίλουν αὐτόν
  choice: не переставали целовать его
  rationale: Имперфект передаёт длительное или повторявшееся действие, а приставочный глагол — горячие, многократные поцелуи. Формулировка естественно выражает продолжительность без добавления неявной оценки.
