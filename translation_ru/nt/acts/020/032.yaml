  text: καὶ τὰ νῦν παρατίθεμαι ⸀ὑμᾶς τῷ ⸀θεῷ καὶ τῷ λόγῳ τῆς χάριτος αὐτοῦ, τῷ δυναμένῳ ⸀οἰκοδομῆσαι καὶ δοῦναι ⸀τὴν κληρονομίαν ἐν τοῖς ἡγιασμένοις πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/032.yaml
  text: And now I entrust you to God and to the word of his grace[a], which is able to build up and to give the inheritance among all those who have been sanctified.
translation:
  language: ru
  text: А теперь я вверяю вас Богу и слову Его благодати[a], которое может назидать и дать наследие вместе со всеми освящёнными.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который может», если последующий оборот относится прежде всего к Богу, а не к «слову Его благодати».'
    reason: alternative_reading
lexical_decisions:
- source_word: παρατίθεμαι
  choice: вверяю
  rationale: Средний залог передаёт мысль о передаче людей под Божью заботу; «вверяю» естественно и точно выражает это в современном русском языке.
- source_word: τῷ θεῷ
  choice: Богу
  rationale: Дательный падеж обозначает того, кому Павел вверяет слушателей.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: слову Его благодати
  rationale: Сохраняет структуру греческого родительного оборота и богословскую насыщенность λόγος; речь идёт о возвещённом слове, несущем Божью благодать.
- source_word: τῷ δυναμένῳ
  choice: которое может
  rationale: В основном тексте оборот отнесён к ближайшему предшествующему слову λόγῳ — «слову». Грамматика также допускает отнесение к Богу, поэтому этот вариант дан в сноске.
- source_word: οἰκοδομῆσαι
  choice: назидать
  rationale: Метафорическое значение — духовно укреплять и созидать. «Назидать» сохраняет библейскую образность и остаётся понятным в литературном русском.
- source_word: δοῦναι τὴν κληρονομίαν
  choice: дать наследие
  rationale: Прямая передача греческого выражения без добавления невыраженного косвенного дополнения.
- source_word: κληρονομίαν
  choice: наследие
  rationale: Традиционный и точный эквивалент, сохраняющий библейско-богословский смысл удела, даруемого Богом.
- source_word: ἐν τοῖς ἡγιασμένοις πᾶσιν
  choice: среди всех освящённых
  rationale: Причастная форма сохраняет значение людей, которых Бог освятил, а «среди» естественно передаёт ἐν в значении принадлежности к их сообществу.
theological_decisions:
- issue: 'К чему относится τῷ δυναμένῳ («могущему»): к Богу или к слову Его благодати'
  choice: 'В основном тексте: «которое может», то есть речь непосредственно о слове Его благодати.'
  alternative: «который может», если оборот относится прежде всего к Богу.
  rationale: Оба прочтения грамматически возможны. Ближайший антецедент — «слово», и в Писании слово может изображаться действенным; однако Бог также естественно понимается как Тот, кто назидает и даёт наследие. Неоднозначность сохранена с помощью сноски.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формулировка сохраняет синтаксическую и богословскую неоднозначность оригинала; местоимение «вас» после «назидать» не добавлено, поскольку в греческом тексте объект прямо не выражен.
