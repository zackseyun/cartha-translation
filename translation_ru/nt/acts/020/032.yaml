  verdict: revise
  source_fidelity: '«Вверяю вас Богу и слову Его благодати» точно передаёт παρατίθεμαι с двумя дательными дополнениями. «Которое может» обоснованно относит τῷ δυναμένῳ к ближайшему «слову», а сноска надлежащим образом сохраняет возможное отнесение к Богу. «Назидать» удачно передаёт метафорическое οἰκοδομῆσαι. Однако «дать наследие среди всех освящённых» в русском языке неясно: оно может звучать так, будто наследие распределяется внутри группы, тогда как ἐν здесь естественно выражает участие в наследии вместе с освящёнными.'
