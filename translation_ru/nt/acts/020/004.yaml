  text: συνείπετο δὲ ⸀αὐτῷ Σώπατρος ⸀Πύρρου Βεροιαῖος, Θεσσαλονικέων δὲ Ἀρίσταρχος καὶ Σεκοῦνδος, καὶ Γάϊος Δερβαῖος καὶ Τιμόθεος, Ἀσιανοὶ δὲ Τυχικὸς καὶ Τρόφιμος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/004.yaml
  text: And Sopater son of Pyrrhus[a], a Berean, accompanied him; and Aristarchus and Secundus from Thessalonica; and Gaius of Derbe, and Timothy[b]; and Tychicus and Trophimus from Asia.
translation:
  language: ru
  text: Его сопровождали Сопатр, сын Пирра, из Верии; Аристарх и Секунд из Фессалоники[a]; Гаий из Дервии и Тимофей; а также Тихик и Трофим из Азии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «из числа фессалоникийцев».'
    reason: lexical_alternative
  - marker: b
    text: Речь идёт о римской провинции Азия, а не о современном континенте.
    reason: cultural_note
lexical_decisions:
- source_word: συνείπετο δὲ αὐτῷ
  choice: Его сопровождали
  rationale: Глагол в имперфекте обозначает сопровождение Павла в пути. В русском языке при последующем перечне нескольких спутников естественно употребить множественное число, хотя в греческом глагол формально согласован с первым названным лицом.
- source_word: Σώπατρος Πύρρου Βεροιαῖος
  choice: Сопатр, сын Пирра, из Верии
  rationale: 'Родительный Πύρρου естественно понимается как отчество: «сын Пирра»; Βεροιαῖος указывает на происхождение из Верии.'
- source_word: Θεσσαλονικέων δὲ Ἀρίσταρχος καὶ Σεκοῦνδος
  choice: Аристарх и Секунд из Фессалоники
  rationale: Родительный множественного числа буквально связывает этих двоих с фессалоникийцами; географическая формулировка ясна и естественна по-русски, а буквальный оттенок сохранён в примечании.
- source_word: Γάϊος Δερβαῖος
  choice: Гаий из Дервии
  rationale: Δερβαῖος — обозначение происхождения; современная русская конструкция с «из» звучит естественнее, чем этноним.
- source_word: Ἀσιανοὶ δὲ Τυχικὸς καὶ Τρόφιμος
  choice: Тихик и Трофим из Азии
  rationale: Ἀσιανοί здесь означает жителей римской провинции Азия. Формулировка сохраняет географическое название, а примечание предупреждает современное неверное понимание.
- source_word: δέ ... δέ ... δέ
  choice: точки с запятой; а также
  rationale: Повторяющиеся частицы разграничивают группы в перечне. Русская пунктуация и заключительное «а также» передают добавочную структуру без тяжеловесного многократного «и».
