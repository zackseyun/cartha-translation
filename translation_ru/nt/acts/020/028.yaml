source:
  edition: SBLGNT
  text: ⸀προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν τὴν ἐκκλησίαν τοῦ ⸀θεοῦ, ἣν περιεποιήσατο διὰ τοῦ ⸂αἵματος τοῦ ἰδίου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/028.yaml
  text: Pay careful attention to yourselves and to all the flock[a], in which the Holy Spirit has appointed you overseers, to shepherd the church of God[c][b], which he obtained through the blood of his own.
translation:
  language: ru
  text: Внимательно следите за собой и за всем стадом, в котором Святой Дух поставил вас блюстителями, чтобы вы пасли церковь Бога[a], которую Он приобрёл кровью Своего Сына[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «церковь Господа».'
    reason: textual_variant
  - marker: b
    text: 'Буквально: «через кровь Своего»; подразумевается «Сына». Возможно также: «Своей кровью».'
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχετε
  choice: внимательно следите
  rationale: Настоящее повелительное наклонение выражает постоянную бдительность; оборот естественен для современного русского языка и сохраняет пастырский призыв.
- source_word: παντὶ τῷ ποιμνίῳ
  choice: за всем стадом
  rationale: Сохраняется коллективная пастырская метафора и значение παντί — «всем, целым».
- source_word: ἐν ᾧ
  choice: в котором
  rationale: Передаёт положение самих блюстителей внутри стада, а не над ним как внешних начальников.
- source_word: ἔθετο
  choice: поставил
  rationale: В данном контексте глагол означает назначение на служение; «поставил» естественно сочетается с последующим обозначением роли.
- source_word: ἐπισκόπους
  choice: блюстителями
  rationale: Передаёт функцию надзора и попечения, не отождествляя её без пояснения с позднейшим церковным титулом «епископ» и избегая административно-карательного оттенка слова «надзиратели».
- source_word: ποιμαίνειν
  choice: чтобы вы пасли
  rationale: Сохраняет глагольную пастырскую метафору и передаёт целевое значение инфинитива.
- source_word: ἐκκλησίαν
  choice: церковь
  rationale: Здесь речь идёт о христианском сообществе Божьего народа; «церковь» — ясный и установившийся русский эквивалент.
- source_word: τοῦ θεοῦ
  choice: Бога
  rationale: Основной текст следует чтению SBLGNT θεοῦ; значимый вариант κυρίου («Господа») указан в сноске.
- source_word: περιεποιήσατο
  choice: приобрёл
  rationale: Передаёт приобретение для себя, выраженное средним залогом, не усиливая без необходимости торговую метафору словом «купил».
- source_word: διὰ τοῦ αἵματος
  choice: кровью
  rationale: Творительный падеж естественно передаёт инструментальное значение διά с родительным и сохраняет жертвенно-искупительный смысл.
- source_word: τοῦ ἰδίου
  choice: Своего Сына
  rationale: Субстантивированное ἴδιος указывает на принадлежащего Богу «Своего», то есть наиболее вероятно на Его Сына. В русском буквальное «кровью Своего» синтаксически неполно и затемняет смысл; краткость и неоднозначность греческого выражения отмечены в сноске.
theological_decisions:
- issue: Смысл сочетания τοῦ αἵματος τοῦ ἰδίου
  choice: «кровью Своего Сына» в основном тексте
  alternative: '«Своей кровью»; буквально: «кровью Своего»'
  rationale: Субстантивированное τοῦ ἰδίου естественно допускает понимание «Своего [Сына]», тогда как традиционное прочтение связывает ἰδίου непосредственно с αἵματος и даёт «Своей кровью». Основной текст выбирает ясный русский оборот, а сноска сохраняет грамматическую и христологическую напряжённость исходного выражения.
- issue: Разночтение θεοῦ / κυρίου
  choice: «церковь Бога»
  alternative: «церковь Господа»
  rationale: Перевод следует предоставленному тексту SBLGNT с θεοῦ, не скрывая хорошо засвидетельствованного варианта κυρίου.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Пастырские образы «стадо» и «пасти» сохранены; «блюстители» выбрано как понятное функциональное обозначение без навязывания позднейшей иерархической терминологии.
