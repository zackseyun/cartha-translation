  text: ποιήσας τε μῆνας τρεῖς· γενομένης ⸂ἐπιβουλῆς αὐτῷ⸃ ὑπὸ τῶν Ἰουδαίων μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν ἐγένετο ⸀γνώμης τοῦ ὑποστρέφειν διὰ Μακεδονίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/003.yaml
  text: After spending three months there[a], when a plot was made against him by the Jews as he was about to sail for Syria[d][c][b], he decided to return through Macedonia.
translation:
  language: ru
  text: Проведя там три месяца, Павел собирался отплыть в Сирию. Но когда иудеи устроили против него заговор, он решил вернуться через Македонию.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσας τε μῆνας τρεῖς
  choice: проведя там три месяца
  rationale: С глаголом ποιέω и обозначением времени оборот означает «провести» определённый срок. Слово «там» естественно восполняет указание на Грецию из предыдущего стиха.
- source_word: γενομένης ἐπιβουλῆς αὐτῷ
  choice: когда … устроили против него заговор
  rationale: Генитив абсолютный передаёт сопутствующее временное обстоятельство; ἐπιβουλή означает враждебный замысел, заговор. Личная конструкция по-русски естественна, поскольку далее назван деятель.
- source_word: ὑπὸ τῶν Ἰουδαίων
  choice: иудеи
  rationale: Сохранено прямое обозначение действующих лиц из греческого текста; контекстуальный объём выражения разъяснён в сноске.
- source_word: μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν
  choice: уже собирался отплыть в Сирию
  rationale: μέλλω выражает близость намеченного действия, а ἀνάγομαι в контексте путешествия означает отплытие или выход в море.
- source_word: ἐγένετο γνώμης τοῦ ὑποστρέφειν
  choice: решил вернуться
  rationale: Идиоматическое выражение обозначает принятое решение; артиклевый инфинитив раскрывает его содержание.
- source_word: διὰ Μακεδονίας
  choice: через Македонию
  rationale: διά с родительным падежом указывает маршрут движения.
theological_decisions:
- issue: Кого обозначает выражение «иудеи» в рассказе о конфликте
  choice: Сохранить в основном тексте слово «иудеи» и пояснить его контекстуальный смысл в сноске.
  alternative: «некоторые иудеи» или «иудейские противники»
  rationale: Греческий текст прямо говорит οἱ Ἰουδαῖοι и не содержит слова «некоторые» или определения «противники». Вместе с тем контекст не даёт оснований относить заговор ко всему еврейскому народу без различия.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Имя «Павел» восполнено из ближайшего контекста ради однозначности подлежащего. Союз «но» естественно передаёт смысловой поворот от намеченного отплытия к изменению маршрута.
