  text: διαμαρτυρόμενος Ἰουδαίοις τε καὶ Ἕλλησιν τὴν ⸀εἰς θεὸν μετάνοιαν καὶ ⸀πίστιν εἰς τὸν κύριον ἡμῶν ⸀Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/021.yaml
  text: solemnly testifying to both Jews and Greeks about repentance toward God and faith in our Lord Jesus[a].
translation:
  language: ru
  text: торжественно свидетельствуя и иудеям, и грекам о покаянии перед Богом и вере в нашего Господа Иисуса[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доверии нашему Господу Иисусу».'
    reason: 'Лексическая альтернатива: πίστις может подчёркивать личное доверие.'
lexical_decisions:
- source_word: διαμαρτυρόμενος
  choice: торжественно свидетельствуя
  rationale: Причастие передаёт усиленное, серьёзное свидетельство; «торжественно» сохраняет вес высказывания, а «свидетельствуя» — его характер.
- source_word: Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: и иудеям, и грекам
  rationale: Парная конструкция τε καί охватывает обе названные группы, а «грекам» прямо сохраняет формулировку Луки, не обобщая её до «язычников».
- source_word: μετάνοιαν
  choice: покаянии
  rationale: «Покаяние» — естественный и содержательно полный русский эквивалент, обозначающий не только перемену мысли, но нравственно-духовное обращение.
- source_word: εἰς θεόν
  choice: перед Богом
  rationale: В сочетании с «покаянием» предлог εἰς выражает направленность к Богу; по-русски «покаяние перед Богом» звучит естественно и не подразумевает лишь пространственного движения.
- source_word: πίστιν
  choice: вере
  rationale: При явно названном объекте πίστις естественно означает веру, обращённую к Иисусу; возможный оттенок доверия сохранён в сноске.
- source_word: εἰς τὸν κύριον ἡμῶν Ἰησοῦν
  choice: в нашего Господа Иисуса
  rationale: После «веры» εἰς передаётся нормативной русской конструкцией «в»; «Господь» сохраняет титул κύριος и его христологический вес.
theological_decisions:
- issue: Передача πίστις в выражении с Иисусом как объектом
  choice: вера в нашего Господа Иисуса
  alternative: доверие нашему Господу Иисусу
  rationale: 'Здесь нет неоднозначности генитивной конструкции: Иисус явно выступает объектом веры. Основной текст сохраняет традиционный и точный термин «вера», а близкое значение «доверие» отмечено в сноске.'
- issue: Направленность покаяния εἰς θεόν
  choice: покаяние перед Богом
  alternative: покаяние, обращающее к Богу
  rationale: Формулировка сохраняет богословскую направленность покаяния, не уточняя сверх текста механизм или последовательность обращения.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской речи. Парное «и иудеям, и грекам» естественно передаёт всеохватность свидетельства; причастная форма сохраняет синтаксическую связь с контекстом предыдущего стиха.
