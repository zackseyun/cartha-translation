  text: καταβὰς δὲ ὁ Παῦλος ἐπέπεσεν αὐτῷ καὶ συμπεριλαβὼν εἶπεν· Μὴ θορυβεῖσθε, ἡ γὰρ ψυχὴ αὐτοῦ ἐν αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/010.yaml
  text: But Paul went down and fell upon him[a], and embracing him said, “Do not be alarmed[b], for his life is in him.”
translation:
  language: ru
  text: 'Павел же, спустившись, пал на него и, обняв его, сказал: «Не тревожьтесь, ведь жизнь[a] его в нём».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «душа его в нём». Греческое слово ψυχή может означать «жизнь», «самого человека» или «душу»; здесь непосредственный контекст — вопрос о том, мёртв ли юноша, — лучше всего соответствует значению «жизнь».'
    reason: lexical_alternative
  - marker: b
    text: Слова Павла можно понять либо так, что юноша всё же не был мёртв, либо так, что его жизнь была восстановлена. Сама греческая формулировка прямо этого не уточняет.
    reason: alternative_reading
lexical_decisions:
- source_word: καταβὰς
  choice: спустился
  rationale: Передаёт направленное движение Павла вниз из верхнего помещения естественным современным русским глаголом.
- source_word: δὲ
  choice: же
  rationale: Обозначает мягкий переход и противопоставление предшествующему сообщению о падении и смерти юноши, не усиливая связь сверх греческого текста.
- source_word: ἐπέπεσεν αὐτῷ
  choice: припал к нему
  rationale: Сохраняет телесное действие и возможный отзвук ветхозаветных рассказов о возвращении к жизни, оставаясь естественнее буквального «упал на него».
- source_word: συμπεριλαβὼν
  choice: обняв его
  rationale: Передаёт охватывающее движение кратко, ясно и без избыточного толкования.
- source_word: Μὴ θορυβεῖσθε
  choice: Не тревожьтесь
  rationale: Выражает и внутреннее волнение, и возникшее среди собравшихся смятение; повелительная форма во множественном числе сохранена.
- source_word: ἡ γὰρ ψυχὴ αὐτοῦ
  choice: ведь жизнь его
  rationale: В контексте вопроса о смерти или жизни ψυχή естественно означает «жизнь»; «душа» могла бы внести не требуемый здесь специальный антропологический смысл.
- source_word: ἐν αὐτῷ ἐστιν
  choice: в нём
  rationale: В составе русского именного предложения «жизнь его в нём» естественно передаёт греческое «находится в нём» и не уточняет, сохранялась жизнь или была возвращена.
theological_decisions:
- issue: Значение ψυχή в контексте жизни и смерти
  choice: «жизнь»
  alternative: «душа»
  rationale: Непосредственный контекст касается физического состояния юноши. «Жизнь» отражает обычное значение ψυχή в таком контексте и не превращает фразу в специальное учение о душе.
- issue: Был ли Евтих всё ещё жив или был возвращён к жизни
  choice: 'Основной текст сохраняет нейтральную формулировку: «жизнь его в нём».'
  alternative: «он жив» или «жизнь вернулась к нему»
  rationale: Греческий текст не поясняет прямо, означает ли фраза, что юноша не умер окончательно, или что его жизнь была восстановлена; перевод не должен устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной библейской интонацией. Синтаксис близок к последовательности греческого повествования, но естественен по-русски; причастные конструкции переданы личным глаголом и деепричастием. Маркеры сносок помещены после всей реплики, поскольку обе сноски относятся к её заключительной формулировке и смыслу.
