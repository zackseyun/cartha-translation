  text: ἡμεῖς δὲ ἐξεπλεύσαμεν μετὰ τὰς ἡμέρας τῶν ἀζύμων ἀπὸ Φιλίππων, καὶ ἤλθομεν πρὸς αὐτοὺς εἰς τὴν Τρῳάδα ἄχρι ἡμερῶν πέντε, ⸀οὗ διετρίψαμεν ἡμέρας ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/006.yaml
  text: But we sailed away from Philippi after the days of Unleavened Bread[a], and came to them at Troas within five days, where we stayed seven days.
translation:
  language: ru
  text: Мы же отплыли из Филипп после дней праздника Опресноков и за пять дней прибыли к ним в Троаду, где пробыли семь дней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπλεύσαμεν
  choice: отплыли
  rationale: Глагол ἐκπλέω обозначает отправление на корабле; «отплыли» естественно и точно передаёт морской характер пути.
- source_word: μετὰ τὰς ἡμέρας τῶν ἀζύμων
  choice: после дней опресноков
  rationale: Сохраняет буквальное временное выражение и традиционное русское название иудейского праздничного периода без добавления отсутствующего в греческом слова «праздник».
- source_word: ἀπὸ Φιλίππων
  choice: из Филипп
  rationale: Нормальная русская передача исходной точки движения и общепринятая форма названия города.
- source_word: ἤλθομεν πρὸς αὐτοὺς εἰς τὴν Τρῳάδα
  choice: прибыли к ним в Троаду
  rationale: «Прибыли» естественно для завершения морского путешествия, а «к ним» сохраняет направленность πρὸς αὐτούς без добавления смысла «присоединились».
- source_word: ἄχρι ἡμερῶν πέντε
  choice: через пять дней
  rationale: В данном контексте выражение обозначает длительность пути до прибытия. Русское «через пять дней» ясно указывает на момент прибытия по истечении этого срока.
- source_word: οὗ
  choice: где
  rationale: Относительное наречие отсылает к Троаде; «где» является прямой и естественной передачей.
- source_word: διετρίψαμεν ἡμέρας ἑπτά
  choice: пробыли семь дней
  rationale: В повествовании о путешествии διατρίβω означает пребывание в месте; «пробыли» кратко и идиоматично передаёт завершённый семидневный срок.
