  source_fidelity: 'Смысл в целом передан верно: авторы отплывают из Филипп после дней Опресноков, достигают находившихся в Троаде спутников и остаются там семь дней. Однако «через пять дней» в современном русском прежде всего обозначает момент, наступающий по прошествии пяти дней, тогда как ἄχρι ἡμερῶν πέντε характеризует длительность пути до прибытия («за пять дней» / «в течение пяти дней»).'
