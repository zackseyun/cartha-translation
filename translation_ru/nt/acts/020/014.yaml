  yaml_path: translation/nt/acts/020/014.yaml
  text: And when he met us at Assos[a], we took him on board and came to Mitylene.
translation:
  language: ru
  text: Когда он встретился с нами в Ассе[a], мы взяли его на борт и прибыли в Митилену.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «присоединился к нам в Ассе»; греческий глагол может означать встречу или соединение с группой. Здесь речь о том, что Павел вновь присоединился к спутникам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβαλλεν
  choice: встретился
  rationale: В данном рассказе о путешествии глагол обозначает встречу Павла с группой в Ассе. Возвратная форма естественна по-русски и сохраняет смысл совместной встречи, не добавляя идеи заранее условленной встречи.
- source_word: ἡμῖν
  choice: с нами
  rationale: Дательный падеж местоимения при συνέβαλλεν естественно передаётся русской конструкцией «встретился с нами».
- source_word: εἰς τὴν Ἆσσον
  choice: в Ассе
  rationale: Хотя εἰς обычно выражает направление, при глаголе встречи сочетание указывает на место события; по-русски естественно «в Ассе».
- source_word: ἀναλαβόντες
  choice: взяли его на борт
  rationale: Контекст морского путешествия показывает, что Павла приняли на корабль. Перевод ясно выражает подразумеваемую обстановку, не меняя последовательности событий.
- source_word: αὐτόν
  choice: его
  rationale: Местоимение относится к Павлу, названному в предшествующем контексте.
- source_word: ἤλθομεν
  choice: прибыли
  rationale: В повествовании о морском маршруте глагол с указанием пункта назначения естественно передаётся как «прибыли»; это ясно обозначает достижение Митилены.
- source_word: εἰς Μιτυλήνην
  choice: в Митилену
  rationale: Обычная русская передача направления движения к городу.
