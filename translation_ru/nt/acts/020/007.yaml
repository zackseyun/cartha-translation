base_translation:
  language: en
  yaml_path: translation/nt/acts/020/007.yaml
  text: On the first day of the week[a], when we had gathered to break bread, Paul was speaking to them, intending to depart the next day[b], and he prolonged the message until midnight.
translation:
  language: ru
  text: В первый день недели, когда мы собрались, чтобы преломить хлеб[a], Павел беседовал с ними, собираясь на следующий день отправиться в путь[b], и продолжал говорить до полуночи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение может означать совместную трапезу и вместе с тем иметь оттенок празднования Вечери Господней.
    reason: lexical_alternative
  - marker: b
    text: 'Возможно: «так как на следующий день ему предстояло отправиться в путь».'
    reason: syntactic_alternative
lexical_decisions:
- source_word: Ἐν δὲ
  choice: В
  rationale: Предлог с дательным падежом обозначает время; слабая связка δέ не требует отдельного русского слова и естественно передаётся связностью повествования.
- source_word: τῇ μιᾷ τῶν σαββάτων
  choice: в первый день недели
  rationale: Это обычное койне-греческое обозначение первого дня недели; буквальное «в один из дней суббот» ввело бы читателя в заблуждение.
- source_word: συνηγμένων ἡμῶν
  choice: когда мы собрались
  rationale: Родительный самостоятельный оборот передаёт обстоятельство основной ситуации; сохранено повествование от первого лица множественного числа.
- source_word: κλάσαι ἄρτον
  choice: чтобы преломить хлеб
  rationale: Инфинитив выражает цель. Сохранён исходный образ, который допускает как общую трапезу, так и связь с Вечерей Господней.
- source_word: διελέγετο αὐτοῖς
  choice: Павел беседовал с ними
  rationale: Имперфект выражает продолженное действие, а διαλέγομαι допускает взаимодействие с собравшимися; «беседовал» не превращает сцену однозначно в монологическую проповедь.
- source_word: μέλλων ἐξιέναι τῇ ἐπαύριον
  choice: намереваясь на следующий день отправиться в путь
  rationale: Причастная конструкция передаёт предстоящее действие и намерение Павла, не делая причинную связь более явной, чем в греческом тексте.
- source_word: παρέτεινέν τε τὸν λόγον
  choice: и продолжал говорить
  rationale: Передаёт продление речи без разговорно-негативного оттенка русского «затянул»; λόγος здесь относится к устному обращению Павла.
- source_word: μέχρι μεσονυκτίου
  choice: до полуночи
  rationale: Точное и естественное обозначение временного предела.
theological_decisions:
- issue: Значение выражения «преломить хлеб» на собрании первых христиан
  choice: Сохранить выражение «преломить хлеб» без уточнения вида трапезы
  alternative: «совершить Вечерю Господню» или «разделить общую трапезу»
  rationale: В Деяниях выражение может обозначать совместную трапезу и одновременно иметь евхаристические оттенки. Перевод не устраняет эту богословскую открытость.
- issue: Связь предстоящего отъезда Павла с продолжительностью беседы
  choice: Передать μέλλων причастным оборотом «намереваясь…»
  alternative: «поскольку он собирался отправиться…»
  rationale: Греческое причастие указывает на предстоящий отъезд, но не маркирует причинное отношение так явно, как русский союз «поскольку».
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Формулировки понятны широкому кругу читателей; сохранены первое лицо рассказчика, возможная диалогичность речи Павла и смысловая открытость выражения о преломлении хлеба.
