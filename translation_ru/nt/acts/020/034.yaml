  text: You yourselves know that these hands served my needs and the needs of those who were with me[a].
translation:
  language: ru
  text: Вы сами знаете, что эти руки обеспечивали всем необходимым и меня, и тех, кто был со мной[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «удовлетворяли мои нужды и нужды тех, кто был со мной». Греческий глагол может подчёркивать практическое служение, результатом которого было материальное обеспечение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: вы сами
  rationale: Самостоятельное местоимение при форме глагола имеет усилительное значение; «вы сами» естественно сохраняет этот акцент.
- source_word: γινώσκετε
  choice: знаете
  rationale: Форма настоящего времени указывает на непосредственное знание слушателей о поведении Павла; «знаете» точно и естественно передаёт смысл.
- source_word: ταῖς χρείαις μου
  choice: необходимым меня
  rationale: χρεία обозначает практические, в данном контексте материальные нужды. Конструкция «обеспечивали необходимым меня» передаёт смысл естественнее, чем буквальное «служили моим нуждам».
- source_word: τοῖς οὖσι μετ’ ἐμοῦ
  choice: тех, кто был со мной
  rationale: Передаёт субстантивированное причастие без уточнения характера отношений и без сужения до формального круга спутников.
- source_word: ὑπηρέτησαν
  choice: обеспечивали
  rationale: Глагол означает оказание практической помощи или служение. При подлежащем «эти руки» и дополнении, обозначающем нужды, «обеспечивали» ясно выражает результат труда, не вводя конфессиональной окраски.
- source_word: αἱ χεῖρες αὗται
  choice: эти руки
  rationale: Сохраняет указательную и наглядную формулировку Павла, подразумевающую его собственный ручной труд, но не добавляет отсутствующего в греческом притяжательного местоимения.
