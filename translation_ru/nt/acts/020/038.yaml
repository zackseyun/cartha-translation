  text: ὀδυνώμενοι μάλιστα ἐπὶ τῷ λόγῳ ᾧ εἰρήκει ὅτι οὐκέτι μέλλουσιν τὸ πρόσωπον αὐτοῦ θεωρεῖν. προέπεμπον δὲ αὐτὸν εἰς τὸ πλοῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/038.yaml
  text: grieving especially over the word that he had spoken[a], that they would no longer see his face[d][c][b]. And they were accompanying him to the ship.
translation:
  language: ru
  text: 'Больше всего они скорбели из-за того, что он сказал: они больше не увидят его лица[a]. И они провожали его к кораблю[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из-за слова, которое он сказал», — а именно из-за того, что они больше не увидят его лица. «Увидеть его лицо» — личное выражение со значением «увидеть его снова».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сопровождали его к кораблю». Глагол может обозначать проводы с почтением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀδυνώμενοι
  choice: скорбели
  rationale: Передаёт сильную душевную боль в контексте прощания естественным и достойным современным русским языком.
- source_word: μάλιστα
  choice: больше же всего
  rationale: Ясно выделяет главную причину их скорби; частица «же» естественно связывает стих с предшествующим повествованием.
- source_word: ἐπὶ τῷ λόγῳ ᾧ εἰρήκει
  choice: из-за сказанных им слов
  rationale: Естественно выражает причинное значение конструкции и содержание ранее произнесённого Павлом; множественное «слов» идиоматично по-русски, хотя греческое λόγος стоит в единственном числе.
- source_word: οὐκέτι μέλλουσιν
  choice: больше не
  rationale: В сочетании с будущим временем передаёт ожидаемое из точки прошлого будущее, не усиливая οὐκέτι до категорического «никогда».
- source_word: τὸ πρόσωπον αὐτοῦ θεωρεῖν
  choice: увидят его лица
  rationale: Сохраняет личный и образный оборот исходного текста, не упрощая его до «не увидят его».
- source_word: προέπεμπον
  choice: проводили
  rationale: Русский глагол естественно обозначает сопровождение при прощании и хорошо соответствует контексту почётных проводов.
- source_word: εἰς τὸ πλοῖον
  choice: до корабля
  rationale: С глаголом «проводили» предлог «до» естественно обозначает конечный пункт сопровождения; «корабль» уместен в морском контексте Деяний.
theological_decisions:
- issue: Степень категоричности οὐκέτι μέλλουσιν
  choice: они больше не увидят
  alternative: они никогда больше не увидят
  rationale: Выбранный вариант сохраняет значение οὐκέτι и будущее ожидание, не добавляя усилительного «никогда», которого в греческом тексте нет.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским достоинством. Синтаксис сделан естественным для повествования; образ «увидеть его лицо» сохранён, а «проводили» передаёт одновременно сопровождение и прощание.
