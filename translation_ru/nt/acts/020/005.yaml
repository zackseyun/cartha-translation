  terminology: «Троада» — нормативная традиционная русская форма. «Ожидали нас» удачно передаёт контекстуальное значение μένω с личным дополнением; сноска должна точно отражать буквальное «оставались/пребывали», не подменяя προσελθόντες значением «отправившись вперёд».
