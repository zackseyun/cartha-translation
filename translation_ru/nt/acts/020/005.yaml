  yaml_path: translation/nt/acts/020/005.yaml
  text: These men went on ahead and were waiting for us in Troas[a].
translation:
  language: ru
  text: Они же, придя, ожидали нас в Троаде[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «Они же, придя, оставались в Троаде, ожидая нас».'
    reason: Лексическое значение μένω — «оставаться, пребывать»; с личным дополнением и в дорожном контексте оно означает ожидание. Деепричастие προσελθόντες передано как «придя», без добавления значения «вперёд».
lexical_decisions:
- source_word: οὗτοι
  choice: они
  rationale: Указательное местоимение мужского рода во множественном числе отсылает к ранее названным спутникам; в русском контексте естественно передаётся местоимением «они».
- source_word: δὲ
  choice: же
  rationale: Частица «же» передаёт мягкую связующую и слегка контрастивную функцию δέ, не утяжеляя повествование.
- source_word: προσελθόντες
  choice: отправившись вперёд
  rationale: В контексте маршрута причастие обозначает, что спутники двинулись раньше группы рассказчика; деепричастная конструкция сохраняет последовательность действий.
- source_word: ἔμενον
  choice: ждали
  rationale: Хотя μένω буквально означает «оставаться», сочетание с ἡμᾶς в данном дорожном контексте означает ожидание прибытия рассказчика и его спутников; несовершенный вид передаёт длительность действия.
- source_word: ἡμᾶς
  choice: нас
  rationale: Прямое соответствие местоимению первого лица множественного числа в винительном падеже.
- source_word: ἐν Τρῳάδι
  choice: в Троаде
  rationale: Нормативная русская передача местного значения предлога ἐν и традиционной формы топонима «Троада».
