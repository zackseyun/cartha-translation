  text: ⸀καθεζόμενος δέ τις νεανίας ὀνόματι Εὔτυχος ἐπὶ τῆς θυρίδος, καταφερόμενος ὕπνῳ βαθεῖ διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον, κατενεχθεὶς ἀπὸ τοῦ ὕπνου ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω καὶ ἤρθη νεκρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/009.yaml
  text: And a certain young man named Eutychus[a], sitting in the window, was sinking into a deep sleep while Paul was speaking at length; and being overcome by sleep, he fell down from the third story and was picked up dead.
translation:
  language: ru
  text: А один юноша по имени Евтих сидел в оконном проёме. Пока Павел долго говорил, он всё глубже погружался в сон; в конце концов сон одолел его, и он упал вниз с третьего этажа. Его подняли мёртвым.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθεζόμενος δέ τις νεανίας
  choice: А один юноша… сидел
  rationale: Причастная конструкция передана личной формой для естественного русского повествования. τις обозначает неопределённое лицо; «один юноша» сохраняет этот оттенок без тяжеловесного «некий».
- source_word: ὀνόματι Εὔτυχος
  choice: по имени Евтих
  rationale: Естественная русская передача дательного ὀνόματι с личным именем; используется традиционная русская форма имени.
- source_word: ἐπὶ τῆς θυρίδος
  choice: в оконном проёме
  rationale: θυρίς обозначает окно или оконный проём; контекст падения указывает на положение внутри проёма, а не просто рядом с окном.
- source_word: καταφερόμενος ὕπνῳ βαθεῖ
  choice: его всё сильнее клонило в глубокий сон
  rationale: Передаёт постепенность настоящего причастия и образ человека, которого одолевает глубокий сон.
- source_word: διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον
  choice: Пока Павел долго говорил
  rationale: Генитив абсолютный передан придаточным времени; διαλέγομαι здесь означает продолжительную речь, а ἐπὶ πλεῖον — её длительность.
- source_word: κατενεχθεὶς ἀπὸ τοῦ ὕπνου
  choice: в конце концов сон одолел его
  rationale: Аористное причастие обозначает решающий итог ранее описанного погружения в сон; формулировка также сохраняет повтор мотива καταφέρω, но избегает неестественного буквального повтора.
- source_word: ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω
  choice: он упал вниз с третьего этажа
  rationale: τρίστεγον указывает на третий этаж или уровень, а κάτω подчёркивает движение вниз.
- source_word: ἤρθη νεκρός
  choice: Его подняли мёртвым
  rationale: Пассив αἴρω естественно передаётся как «подняли»; νεκρός прямо означает «мёртвым», без смягчения смысла.
theological_decisions:
- issue: Следует ли смягчать νεκρός как «казался мёртвым»
  choice: мёртвым
  alternative: казавшимся мёртвым
  rationale: В греческом тексте нет показателя видимости или сомнения. Перевод сохраняет прямое повествовательное утверждение и не устраняет напряжение с последующим рассказом.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный повествовательный стиль. Длинная греческая фраза разделена на три предложения ради естественности и удобства чтения; последовательность событий и повторное усиление сна сохранены.
