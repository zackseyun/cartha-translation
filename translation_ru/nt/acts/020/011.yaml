id: ACT.20.11
reference: Acts 20:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀναβὰς δὲ καὶ κλάσας ⸀τὸν ἄρτον καὶ γευσάμενος ἐφ’ ἱκανόν τε ὁμιλήσας ἄχρι αὐγῆς, οὕτως ἐξῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/011.yaml
  text: Then he went upstairs[a], broke the bread, and ate; and after talking for a long time, until dawn[b], he departed.
translation:
  language: ru
  text: Затем он поднялся наверх, преломил хлеб[a] и поел[b]. Он ещё долго беседовал, до самого рассвета, и после этого ушёл.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «преломил хлеб» может означать совместную трапезу; некоторые понимают его здесь как включающее Вечерю Господню.
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «вкусил»; возможный перевод: «принял пищу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβὰς
  choice: поднялся наверх
  rationale: Причастие от ἀναβαίνω обозначает движение вверх; по контексту Павел вернулся в верхнюю комнату. Формулировка естественна по-русски и не добавляет отсутствующего в стихе уточнения «обратно».
- source_word: κλάσας τὸν ἄρτον
  choice: преломил хлеб
  rationale: Передаёт конкретное действие и традиционную библейскую формулу, не решая однозначно, идёт ли речь об обычной совместной трапезе или о Вечере Господней.
- source_word: γευσάμενος
  choice: поел
  rationale: В контексте трапезы γεύομαι может означать принятие пищи, а не только пробу на вкус. «Поел» звучит естественно и не создаёт впечатления одного символического кусочка.
- source_word: ἐφ’ ἱκανόν
  choice: ещё долго
  rationale: Оборот обозначает значительную продолжительность времени; «долго» ясно и естественно передаёт этот смысл.
- source_word: ὁμιλήσας
  choice: беседовал
  rationale: ὁμιλέω указывает здесь на продолжительное общение или разговор. «Беседовал» сохраняет оттенок взаимодействия, не превращая его однозначно в формальную проповедь.
- source_word: ἄχρι αὐγῆς
  choice: до самого рассвета
  rationale: αὐγή означает рассвет или зарю; частица «самого» естественно подчёркивает длительность беседы.
- source_word: οὕτως ἐξῆλθεν
  choice: и после этого ушёл
  rationale: οὕτως связывает уход с предшествующей последовательностью событий. Русская формулировка естественно передаёт итог, не перегружая фразу буквальным «таким образом».
theological_decisions:
- issue: Следует ли понимать κλάσας τὸν ἄρτον как прямое указание на Вечерю Господню
  choice: Нейтральное «преломил хлеб» без сакраментального уточнения
  alternative: Явно перевести как совершение Вечери Господней либо только как обычную трапезу
  rationale: Выражение в Деяниях может иметь евхаристические ассоциации, но данный стих сам по себе не позволяет однозначно исключить обычную совместную трапезу. Перевод сохраняет эту богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской формулой «преломил хлеб». Синтаксис разделён на два предложения ради ясности; сохранены последовательность действий и неоднозначность характера трапезы.
