  to: исполнения которого надеется достичь наш народ, состоящий из двенадцати колен[a], усердно служа Богу день и ночь[b]. Из-за этой надежды меня обвиняют иудеи[c], царь.
  rationale: Перевод уточнён только там, где русская конструкция требовала ясной связи с обещанием из предыдущего стиха. Добавлено «исполнения», чтобы естественно передать достижение цели обещания; «наш народ, состоящий из двенадцати колен» сохраняет συλλективное единственное число; убрано невыраженное в оригинале усилительное «и». Причинное «из-за этой надежды» естественно передаёт судебный контекст περὶ ἧς ἐλπίδος, не навязывая толкования содержания надежды.
