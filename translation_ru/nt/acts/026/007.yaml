base_translation:
  language: en
  yaml_path: translation/nt/acts/026/007.yaml
  text: to which our twelve tribes hope to attain[a], as they earnestly serve God night and day. It is concerning this hope that I am accused by the Jews[c][b], O king.
translation:
  language: ru
  text: исполнения которого надеется достичь наш народ, состоящий из двенадцати колен[a], усердно служа Богу день и ночь[b]. Из-за этой надежды меня обвиняют иудеи[c], царь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наши двенадцать колен». В греческом употреблено собирательное существительное в единственном числе, обозначающее Израиль как народ двенадцати колен.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поклоняясь Богу». Греческий глагол может обозначать религиозное служение или поклонение Богу.'
    reason: lexical_alternative
  - marker: c
    text: То есть иудейские обвинители Павла в данном судебном деле, а не все иудеи без исключения.
    reason: contextual_clarification
lexical_decisions:
- source_word: εἰς ἣν
  choice: которого
  rationale: Относительное местоимение отсылает к обещанию из предыдущего стиха; русская форма передаёт направленность к цели без тяжеловесного «к которому».
- source_word: τὸ δωδεκάφυλον ἡμῶν
  choice: наш двенадцатиколенный народ
  rationale: Сохраняет собирательное единственное число греческого существительного и его значение Израиля как народа двенадцати колен.
- source_word: ἐν ἐκτενείᾳ
  choice: усердно
  rationale: Естественно передаёт напряжённость, ревность и постоянство служения.
- source_word: νύκτα καὶ ἡμέραν
  choice: день и ночь
  rationale: В русском это устойчивый и естественный порядок слов для непрестанного действия, хотя в греческом буквально стоит «ночь и день».
- source_word: λατρεῦον
  choice: служа Богу
  rationale: Глагол обозначает религиозное служение или поклонение; подразумеваемый объект «Богу» выражен для ясности.
- source_word: ἐλπίζει καταντῆσαι
  choice: надеется достичь
  rationale: Передаёт надежду прийти к исполнению обещанного как к цели.
- source_word: περὶ ἧς ἐλπίδος
  choice: за эту надежду
  rationale: 'В судебном контексте περί допускает причинно-тематический смысл: именно эта надежда является поводом для обвинения.'
- source_word: ἐγκαλοῦμαι
  choice: меня обвиняют
  rationale: Естественная современная русская передача пассивной формы с юридическим значением.
- source_word: ὑπὸ Ἰουδαίων
  choice: иудеи
  rationale: Передаёт действующих лиц обвинения; примечание предотвращает ошибочное понимание как утверждения обо всех иудеях.
- source_word: βασιλεῦ
  choice: царь
  rationale: Сохраняет прямое обращение в звательном употреблении без архаического «о царь».
theological_decisions:
- issue: Подразумеваемый объект λατρεῦον
  choice: служа Богу
  alternative: служа; поклоняясь
  rationale: Хотя слово «Богу» отсутствует как отдельный элемент греческого текста, религиозное значение λατρεύω и контекст Израиля ясно указывают на Бога; добавление делает русскую фразу полноценной, не вводя нового богословского утверждения.
- issue: Содержание надежды
  choice: Сохранена отсылка к обещанию предыдущего стиха без уточнения содержания надежды
  alternative: Прямо назвать воскресение
  rationale: Контекст связывает надежду с Божьим обещанием и темой воскресения, однако данный стих не раскрывает её содержание заново; перевод сохраняет эту смысловую напряжённость.
- issue: Круг обвинителей
  choice: иудеи с поясняющей сноской
  alternative: некоторые иудеи; иудейские обвинители
  rationale: В основном тексте сохранено прямое значение Ἰουδαίων, а сноска уточняет конкретный судебный контекст, не превращая выражение в обобщение обо всём народе.
translation_notes:
  register: Современный литературный русский язык с достоинством судебной речи. «Двенадцатиколенный народ» несколько возвышенно, но точно и понятно в библейском контексте; более буквальная альтернатива дана в сноске. Обращение «царь» естественно для современной русской прямой речи и не архаизировано.
