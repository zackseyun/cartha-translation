  text: that the Messiah would suffer[a], and that, as the first to rise from the dead[d][c][b], he would proclaim light both to the people and to the Gentiles.
translation:
  language: ru
  text: что Христос должен был пострадать[a] и, первым воскреснув из мёртвых, возвестить свет как народу[b], так и язычникам[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мессия должен был пострадать». Греческое слово «Христос» означает «Помазанник» и здесь употреблено как титул.'
    reason: alternative_reading
  - marker: b
    text: Под «народом» здесь, по всей вероятности, подразумевается народ Израиля, в отличие от язычников.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «народам». В этом контексте речь идёт о нееврейских народах, то есть язычниках.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παθητὸς
  choice: должен был пострадать
  rationale: Предикативное прилагательное обозначает, что Мессии предстояло претерпеть страдания; русская глагольная передача естественна в пророческом контексте и не сводит выражение к отвлечённой «способности страдать».
- source_word: ὁ χριστός
  choice: Христос
  rationale: В современном русском библейском употреблении «Христос» остаётся понятным титулом Помазанника и здесь естественнее, чем транслитерированное «Мессия»; титульный смысл пояснён в примечании.
- source_word: πρῶτος ἐξ ἀναστάσεως νεκρῶν
  choice: первым воскреснув из мёртвых
  rationale: Передача сохраняет первенство Христа и естественно раскрывает сжатое греческое выражение, не уточняя сверх текста характер этого первенства.
- source_word: φῶς
  choice: свет
  rationale: Сохранена широкая библейская метафора откровения и спасения без её сужающего истолкования.
- source_word: μέλλει καταγγέλλειν
  choice: возвестить
  rationale: Инфинитивная конструкция выражает предстоящее по пророчеству возвещение; совершенный вид естественно согласуется с «должен был» и передаёт провозглашение.
- source_word: τῷ τε λαῷ
  choice: народу
  rationale: Сохранено исходное обозначение; в противопоставлении язычникам оно подразумевает народ Израиля, что уточняется в примечании.
- source_word: τοῖς ἔθνεσιν
  choice: язычникам
  rationale: В паре с λαός слово обозначает нееврейские народы; «язычникам» ясно передаёт историко-религиозное противопоставление.
- source_word: τε ... καὶ
  choice: как ... так и
  rationale: Русская соотносительная конструкция отчётливо и естественно передаёт греческое соединение двух адресатов.
theological_decisions:
- issue: Характер первенства Христа в воскресении
  choice: Сохранено утверждение, что Христос воскрес первым, без добавочного догматического уточнения.
  alternative: «первым воскреснув для вечной жизни» или «как первенец воскресения»
  rationale: Греческий текст утверждает первенство, но сам не объясняет его соотношение с прежними возвращениями умерших к земной жизни; перевод не должен молча разрешать эту напряжённость.
- issue: Значение «народа»
  choice: В основном тексте оставлено «народу», а вероятный референт — народ Израиля — указан в примечании.
  alternative: «народу Израиля» или «еврейскому народу»
  rationale: Так сохраняется лексическая форма λαός и одновременно не теряется подразумеваемый контраст с язычниками.
- issue: Модальность παθητός
  choice: «должен был пострадать»
  alternative: «мог страдать» или «подлежал страданию»
  rationale: В контексте свидетельства Моисея и пророков выражение касается предсказанного страдания Христа. Формулировка передаёт пророческую предопределённость, не вводя отдельного философского тезиса о страдательности.
translation_notes:
  register: 'Современный литературный русский язык с привычной библейской торжественностью без архаизмов. Синтаксис сохраняет параллель двух утверждений о Христе, но оформлен естественно для русского: «должен был пострадать и… возвестить». «Из мёртвых» выбрано вместо более разговорного «из мёртвых воскрес» как устойчивое и ясное библейское выражение.'
