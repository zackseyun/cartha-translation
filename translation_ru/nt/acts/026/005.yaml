  text: προγινώσκοντές με ἄνωθεν, ἐὰν θέλωσι μαρτυρεῖν, ὅτι κατὰ τὴν ἀκριβεστάτην αἵρεσιν τῆς ἡμετέρας θρησκείας ἔζησα Φαρισαῖος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/005.yaml
  text: They have known me from the beginning[a], if they are willing to testify[b], that I lived as a Pharisee according to the strictest sect of our religion.
translation:
  language: ru
  text: Они издавна знают меня и, если захотят, могут засвидетельствовать, что я жил как фарисей — в соответствии с самым строгим направлением нашей религии.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово αἵρεσις здесь означает направление или религиозную партию, а не «ересь» в позднейшем смысле.
    reason: lexical_alternative
lexical_decisions:
- source_word: προγινώσκοντές με
  choice: они знают меня
  rationale: Причастие выражает давнее знакомство, продолжающееся к моменту речи; русское настоящее время естественно передаёт это состояние.
- source_word: ἄνωθεν
  choice: с самого начала
  rationale: В данном контексте означает знание Павла с раннего периода, а не «свыше»; усилительная частица «самого» естественно передаёт исходную точку.
- source_word: ἐὰν θέλωσι μαρτυρεῖν
  choice: если захотят, могут засвидетельствовать
  rationale: «Захотят» сохраняет значение готовности или желания в θέλωσι, а «засвидетельствовать» соответствует судебному контексту μαρτυρεῖν. Слово «могут» естественно связывает давнее знание с возможным свидетельством, не превращая условие желания в простую будущность.
- source_word: κατὰ τὴν ἀκριβεστάτην αἵρεσιν
  choice: принадлежавшим к самому строгому течению
  rationale: Оборот описывает жизнь Павла как фарисея в рамках наиболее строгой религиозной группы. «Самому строгому» передаёт превосходную степень ἀκριβεστάτην, а «течению» избегает позднейшего отрицательного оттенка слова «секта».
- source_word: τῆς ἡμετέρας θρησκείας
  choice: нашей религии
  rationale: Передаёт принадлежность к общей для Павла и его иудейских слушателей религиозной традиции.
- source_word: ἔζησα Φαρισαῖος
  choice: я жил фарисеем
  rationale: Сохраняет прямую предикативную конструкцию оригинала и естественно описывает прежний образ жизни и идентичность Павла.
theological_decisions:
- issue: Значение αἵρεσις в историческом иудейском контексте
  choice: течение
  alternative: секта; религиозная партия; ересь
  rationale: Здесь слово обозначает фарисейское направление внутри иудаизма, а не «ересь» в позднейшем церковно-техническом смысле. «Течение» точно и нейтрально передаёт историческое значение.
translation_notes:
  register: 'Современный литературный русский язык с достоинством судебной речи. Синтаксис слегка перестроен ради естественности: принадлежность к строгому течению выражена причастным оборотом при слове «фарисеем». Все примечания отмечены в основном тексте.'
