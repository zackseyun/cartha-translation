  yaml_path: translation/nt/acts/026/032.yaml
  text: Then Agrippa said to Festus[a], “This man could have been released if he had not appealed to Caesar.”
translation:
  language: ru
  text: 'Тогда Агриппа сказал Фесту: «Этого человека можно было бы освободить, если бы он не обратился с апелляцией к кесарю».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Тогда
  rationale: Союз отмечает переход к заключительной реплике Агриппы; «тогда» естественно передаёт развитие повествования.
- source_word: ἔφη
  choice: сказал
  rationale: Имперфект φημί здесь служит обычной формулой введения прямой речи; совершенный вид естественен в русском повествовании.
- source_word: Ἀπολελύσθαι
  choice: освободить
  rationale: В данном правовом контексте ἀπολύω означает отпустить или освободить; «оправдать» было бы неоправданно узким и предполагало бы формальный оправдательный приговор.
- source_word: ἐδύνατο
  choice: можно было бы
  rationale: Безличная русская конструкция естественно передаёт нереализованную возможность, выраженную глаголом δύναμαι вместе с условным придаточным.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: этого человека
  rationale: Сохраняются конкретная отсылка к Павлу и указательная сила οὗτος.
- source_word: εἰ μὴ
  choice: если бы ... не
  rationale: Конструкция ясно передаёт условие, противоречащее фактическому положению дел.
- source_word: ἐπεκέκλητο
  choice: потребовал суда
  rationale: В римском правовом контексте медиальная форма ἐπικαλέω с Καίσαρα означает обращение к кесарю как высшей судебной инстанции; такая формулировка понятнее современному русскому читателю, чем буквальное «призвал».
- source_word: Καίσαρα
  choice: кесаря
  rationale: Сохраняется исторический титул, употреблённый в греческом тексте, без замены его пояснительным словом «император».
