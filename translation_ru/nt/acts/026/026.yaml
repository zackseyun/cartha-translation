source:
  edition: SBLGNT
  text: ἐπίσταται γὰρ περὶ τούτων ὁ βασιλεύς, πρὸς ὃν ⸀καὶ παρρησιαζόμενος λαλῶ· λανθάνειν γὰρ ⸀αὐτὸν τούτων οὐ πείθομαι ⸀οὐθέν, οὐ γάρ ⸀ἐστιν ἐν γωνίᾳ πεπραγμένον τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/026.yaml
  text: For the king knows about these things[a], and I speak boldly to him. For I am persuaded that none of these things has escaped his notice[c][b], because this has not been done in a corner.
translation:
  language: ru
  text: Ведь царь знает об этом, и я говорю с ним открыто и смело[a]. Я убеждён, что ничто из этого не укрылось от его внимания[b], потому что это не было совершено в каком-нибудь углу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорю с ним свободно». Греческое слово обозначает откровенную, открытую и уверенную речь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ничто из этого не прошло мимо его внимания» или «ничто из этого от него не скрыто».'
    reason: lexical_alternative
  - marker: c
    text: Выражение «не в каком-нибудь углу» означает, что это не было совершено тайно или безвестно.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπίσταται
  choice: знает
  rationale: Глагол выражает осведомлённость или знакомство с предметом; простое «знает» естественно и точно передаёт утверждение Павла.
- source_word: περὶ τούτων
  choice: об этом
  rationale: Оборот обозначает предмет знания; в русском единственное собирательное «об этом» звучит естественно, сохраняя широкий охват событий.
- source_word: παρρησιαζόμενος λαλῶ
  choice: говорю с ним открыто и смело
  rationale: Причастие передаёт свободную, откровенную и уверенную речь. Сочетание двух наречий сохраняет оттенки открытости и бесстрашия без тяжеловесности.
- source_word: λανθάνειν ... αὐτὸν
  choice: не укрылось от его внимания
  rationale: Русский идиоматический оборот точно передаёт смысл того, что события не остались незамеченными царём.
- source_word: οὐ πείθομαι οὐθέν
  choice: Я убеждён, что ничто
  rationale: πείθομαι здесь означает устойчивую убеждённость; греческое отрицательное построение естественно передано по-русски как «убеждён, что ничто… не».
- source_word: πεπραγμένον
  choice: происходило
  rationale: В контексте речь идёт о совершившихся событиях. «Происходило» естественнее русского буквального «было сделано» и не сужает их характера.
- source_word: ἐν γωνίᾳ
  choice: не в каком-нибудь углу
  rationale: Сохранён греческий образ, означающий, что события не были тайными или безвестными; частица «каком-нибудь» делает идиому естественной по-русски.
- source_word: τοῦτο
  choice: всё это
  rationale: Указание относится к обсуждаемым событиям, точный объём которых стих не определяет. «Всё это» связывает его с предыдущим «ничто из этого», не уточняя референт доктринально.
theological_decisions:
- issue: Объём указания τοῦτο и публичность событий
  choice: 'Оставить указание широким и нейтральным: «всё это», подчеркнув общеизвестность событий.'
  alternative: Ограничить указание только смертью и воскресением Иисуса либо расширить его до всего христианского движения и дела Павла.
  rationale: Сам стих не устанавливает точных границ референта. Перевод сохраняет эту неопределённость и не вводит частное богословское толкование.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным синтаксисом. Образ «в углу» сохранён, но снабжён пояснением; оттенки παρρησιαζόμενος переданы сочетанием «открыто и смело». Все маркеры сносок помещены непосредственно после соответствующих выражений.
