  text: Περὶ πάντων ὧν ἐγκαλοῦμαι ὑπὸ Ἰουδαίων, βασιλεῦ Ἀγρίππα, ἥγημαι ἐμαυτὸν μακάριον ἐπὶ σοῦ μέλλων ⸂σήμερον ἀπολογεῖσθαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/002.yaml
  text: Concerning all the things of which I am accused by the Jews[a], King Agrippa, I consider myself fortunate that I am about to make my defense before you today,
translation:
  language: ru
  text: Что касается всего, в чём меня обвиняют иудеи, царь Агриппа, я считаю себя счастливым[a], что сегодня мне предстоит защищаться перед тобой,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «блаженным»; здесь, вероятно, имеется в виду, что Павел считает своё положение благоприятным или видит в нём особую возможность выступить перед Агриппой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ πάντων ὧν
  choice: Что касается всего, в чём
  rationale: Оборот περί с родительным падежом вводит предмет речи. Такая формулировка сохраняет исходную тематическую конструкцию и естественно звучит по-русски.
- source_word: ἐγκαλοῦμαι
  choice: меня обвиняют
  rationale: Глагол обозначает предъявление обвинения, в данном контексте — официального. Настоящее время и страдательное значение переданы естественной русской неопределённо-личной конструкцией.
- source_word: ὑπὸ Ἰουδαίων
  choice: иудеи
  rationale: Предлог ὑπό указывает на действующих лиц. В контексте имеются в виду обвиняющие Павла иудеи, а не весь народ без исключения.
- source_word: βασιλεῦ Ἀγρίππα
  choice: царь Агриппа
  rationale: Сохранены звательный смысл прямого обращения и титул; отдельная архаическая звательная частица по-русски не требуется.
- source_word: ἥγημαι ἐμαυτὸν
  choice: я считаю себя
  rationale: Передана конструкция со значением «считать, полагать кого-либо каким-либо» и её возвратный характер.
- source_word: μακάριον
  choice: счастливым
  rationale: Русское «счастливым» сохраняет положительную оценку положения Павла и допускает оттенок особой благоприятности, не превращая его слова в однозначное богословское утверждение о благословении.
- source_word: ἐπὶ σοῦ
  choice: перед тобой
  rationale: В контексте слушания выражение означает выступление в присутствии Агриппы; «перед тобой» кратко и естественно передаёт судебный оттенок.
- source_word: μέλλων
  choice: мне предстоит
  rationale: Передано значение близкого предстоящего действия без тяжеловесной буквальной конструкции.
- source_word: σήμερον
  choice: сегодня
  rationale: Прямой современный эквивалент наречия времени.
- source_word: ἀπολογεῖσθαι
  choice: защищаться
  rationale: В данном судебном контексте глагол означает выступать в собственную защиту. Русское «защищаться» естественно выражает этот процесс.
theological_decisions:
- issue: Оттенок значения μακάριον
  choice: счастливым
  alternative: блаженным; находящимся в благоприятном положении
  rationale: Контекст судебной защиты у осведомлённого правителя указывает прежде всего на благоприятность предоставленной Павлу возможности, однако примечание сохраняет более широкий и потенциально религиозный оттенок слова.
translation_notes:
  register: Современный литературный русский язык с достойным судебно-ораторским тоном. Тематический зачин греческого предложения сохранён; конечная запятая показывает, что мысль продолжается в следующем стихе.
