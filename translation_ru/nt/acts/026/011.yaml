  text: καὶ κατὰ πάσας τὰς συναγωγὰς πολλάκις τιμωρῶν αὐτοὺς ἠνάγκαζον βλασφημεῖν, περισσῶς τε ἐμμαινόμενος αὐτοῖς ἐδίωκον ἕως καὶ εἰς τὰς ἔξω πόλεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/011.yaml
  text: And in all the synagogues[a], punishing them many times, I tried to force them to blaspheme; and being exceedingly enraged against them, I kept persecuting them even to the foreign cities.
translation:
  language: ru
  text: Во всех синагогах я многократно наказывал их и пытался принудить к богохульству. В неистовой ярости против них я преследовал их даже до чужих городов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «даже до внешних городов»; вероятно, имеются в виду города за пределами Иудеи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πάσας τὰς συναγωγάς
  choice: во всех синагогах
  rationale: κατά с винительным имеет здесь распределительно-локальное значение и описывает повторявшиеся действия Павла в разных синагогах.
- source_word: πολλάκις τιμωρῶν αὐτούς
  choice: многократно наказывал их
  rationale: Сохраняет повторность πολλάκις и обстоятельственный характер причастия, не утяжеляя русскую фразу буквальной причастной конструкцией.
- source_word: ἠνάγκαζον
  choice: пытался принудить
  rationale: Имперфект передаёт продолжавшиеся или повторявшиеся попытки принуждения и сам по себе не утверждает, что они всегда достигали цели.
- source_word: βλασφημεῖν
  choice: к богохульству
  rationale: Объект богохульства в греческом тексте не назван, поэтому перевод сохраняет эту неопределённость.
- source_word: περισσῶς τε ἐμμαινόμενος αὐτοῖς
  choice: в безмерной ярости против них
  rationale: Передаёт исключительную степень неистовой враждебности, избегая современных ассоциаций с психическим заболеванием.
- source_word: ἐδίωκον
  choice: преследовал
  rationale: В контексте Деяний слово обозначает враждебное преследование верующих; имперфективность естественно выражена русским глаголом несовершенного вида.
- source_word: ἕως καὶ εἰς τὰς ἔξω πόλεις
  choice: даже в чужих городах
  rationale: Идиоматично передаёт движение преследования вплоть до городов за пределами собственной страны или области; более буквальный смысл отмечен в сноске.
theological_decisions:
- issue: Объект βλασφημεῖν
  choice: Не указывать, против кого или чего было направлено богохульство.
  alternative: «хулить Иисуса» или «отрекаться от веры с хулой».
  rationale: Контекст допускает такие уточнения, но сам греческий текст оставляет объект невыраженным.
- issue: Результативность принуждения
  choice: «пытался принудить»
  alternative: «принуждал» или «заставлял».
  rationale: Так сохраняется повторность и незавершённость имперфекта без утверждения, что верующие действительно богохульствовали.
translation_notes:
  register: Современный литературный русский язык; речь энергичная и исповедальная. Синтаксис разделён на два предложения для ясности, при сохранении нарастающей силы признания Павла.
