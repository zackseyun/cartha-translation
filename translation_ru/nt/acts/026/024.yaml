  text: Ταῦτα δὲ αὐτοῦ ἀπολογουμένου ὁ Φῆστος μεγάλῃ τῇ φωνῇ ⸀φησιν· Μαίνῃ, Παῦλε· τὰ πολλά σε γράμματα εἰς μανίαν περιτρέπει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/024.yaml
  text: As he was saying these things in his defense[a], Festus said with a loud voice, “You are out of your mind, Paul! Your great learning is driving you into madness.”
translation:
  language: ru
  text: 'Когда Павел говорил это в свою защиту, Фест громко сказал: «Ты безумен, Павел! Твои обширные познания доводят тебя до безумия».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: защищался
  rationale: Передаёт судебно-риторический смысл глагола ἀπολογέομαι; конструкция с «когда» выражает одновременность действия, обозначенную родительным самостоятельным оборотом.
- source_word: μεγάλῃ τῇ φωνῇ
  choice: громко
  rationale: Естественно передаёт греческое обстоятельство образа действия и резкость вмешательства Феста.
- source_word: φησιν
  choice: сказал
  rationale: Греческое историческое настоящее передано прошедшим временем, обычным для современного русского повествования.
- source_word: Μαίνῃ
  choice: Ты безумен
  rationale: Передаёт прямое обвинение в безумии, не добавляя значения завершившегося перехода, которое могло бы возникнуть в варианте «ты сошёл с ума».
- source_word: τὰ πολλά ... γράμματα
  choice: Большая учёность
  rationale: В данном контексте γράμματα вероятнее обозначает обширные знания или образование, а не буквальные письма; сноска сохраняет лексическую неоднозначность.
- source_word: εἰς μανίαν περιτρέπει
  choice: доводит тебя до безумия
  rationale: Сохраняет каузативный и результативно-направительный смысл сочетания περιτρέπει с εἰς, а также смысловую связь μανίαν с Μαίνῃ.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно формальным повествовательным тоном. Реплика Феста звучит резко и непосредственно; повтор корня «безумен — безумие» намеренно отражает греческую связь Μαίνῃ — μανίαν.
