revisions:
- from: Среди дня, царь, по дороге я увидел свет с неба, сиянием превосходивший солнце и озаривший меня и моих спутников.
  to: В полдень, по дороге, я увидел, царь, свет с неба, ярче солнца, сиявший вокруг меня и тех, кто шёл со мной.
  rationale: Исправление делает временное обозначение более идиоматичным, восстанавливает значение «вокруг» в περιλάμψαν и явнее передаёт πορευομένους. Смысл и степень сравнения сохранены без конфессионального истолкования.
  reviewer_model: gpt-5.6-terra
