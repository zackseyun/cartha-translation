  text: ἡμέρας μέσης κατὰ τὴν ὁδὸν εἶδον, βασιλεῦ, οὐρανόθεν ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου περιλάμψαν με φῶς καὶ τοὺς σὺν ἐμοὶ πορευομένους·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/013.yaml
  text: At midday[a], along the road, I saw, O king, a light from heaven, brighter than the sun, shining around me and those traveling with me.
translation:
  language: ru
  text: В полдень, по дороге, я увидел, царь, свет с неба, ярче солнца, сиявший вокруг меня и тех, кто шёл со мной.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμέρας μέσης
  choice: Среди дня
  rationale: Идиоматическое обозначение середины дня; естественно и точно передаёт временную конкретность греческого выражения.
- source_word: κατὰ τὴν ὁδὸν
  choice: по дороге
  rationale: Передаёт место события во время пути и естественно звучит в современном русском.
- source_word: εἶδον
  choice: я увидел
  rationale: Прямое соответствие аористу глагола зрительного восприятия.
- source_word: βασιλεῦ
  choice: царь
  rationale: Сохраняет прямое обращение к Агриппе без архаизирующей частицы «о».
- source_word: οὐρανόθεν
  choice: с неба
  rationale: Передаёт небесное происхождение света и сохраняет значимый для повествования богословский оттенок.
- source_word: ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου
  choice: сиянием превосходивший солнце
  rationale: Явно передаёт λαμπρότης и значение превосходства у ὑπέρ, оставаясь естественным по-русски.
- source_word: περιλάμψαν
  choice: озаривший
  rationale: Передаёт действие света, охватившего Павла и его спутников; русское «озаривший» естественно выражает направленное освещение.
- source_word: φῶς
  choice: свет
  rationale: Обычное и точное соответствие греческому существительному; русский язык не требует неопределённого артикля.
- source_word: τοὺς σὺν ἐμοὶ πορευομένους
  choice: моих спутников
  rationale: Кратко и естественно обозначает тех, кто шёл вместе с Павлом, без добавления сведений сверх текста.
theological_decisions:
- issue: Значение οὐρανόθεν в контексте видения
  choice: с неба
  alternative: с небосвода
  rationale: В Деяниях выражение указывает не только на пространственное направление, но и на небесное происхождение откровения; «с неба» сохраняет оба оттенка без дальнейшего истолкования.
translation_notes:
  register: Современный литературный русский, торжественный, но не архаичный. Порядок обращения «царь» сохранён близко к греческому. Конструкция «сиянием превосходивший солнце» удерживает явное упоминание яркости, присутствующее в оригинале.
