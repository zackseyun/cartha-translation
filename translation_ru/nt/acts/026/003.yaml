id: ACT.26.3
reference: Acts 26:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μάλιστα γνώστην ὄντα σε πάντων τῶν κατὰ Ἰουδαίους ⸀ἐθῶν τε καὶ ζητημάτων· διὸ ⸀δέομαι μακροθύμως ἀκοῦσαί μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/003.yaml
  text: especially because you are knowledgeable about all the customs and disputes among the Jews[b][a]. Therefore I beg you to listen to me patiently.
translation:
  language: ru
  text: особенно потому, что ты хорошо знаешь все обычаи и спорные вопросы среди иудеев. Поэтому прошу тебя терпеливо выслушать меня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάλιστα
  choice: особенно потому, что
  rationale: Передаёт усиление и естественно связывает его с причиной, выраженной причастным оборотом.
- source_word: γνώστην ὄντα σε
  choice: ты хорошо знаешь
  rationale: Естественная русская передача осведомлённости Агриппы без чрезмерно сильного значения «эксперт».
- source_word: πάντων τῶν κατὰ Ἰουδαίους ἐθῶν
  choice: все обычаи ... среди иудеев
  rationale: Сохраняет широкое значение κατὰ Ἰουδαίους как указания на сферу, не сводя выражение только к характеристике «иудейские».
- source_word: τε καὶ
  choice: и
  rationale: Обычное русское соединение двух однородных категорий; отдельная конструкция «как… так и» здесь не обязательна.
- source_word: ζητημάτων
  choice: спорные вопросы
  rationale: Сохраняет возможное значение обсуждаемых и оспариваемых вопросов, не усиливая его до открытых конфликтов.
- source_word: διὸ
  choice: Поэтому
  rationale: Ясно выражает вывод из осведомлённости Агриппы.
- source_word: δέομαι
  choice: прошу
  rationale: В контексте почтительного обращения передаёт настойчивую просьбу естественнее, чем более эмоциональное «умоляю».
- source_word: μακροθύμως
  choice: терпеливо
  rationale: Прямо передаёт просьбу о терпеливом слушании.
- source_word: ἀκοῦσαί μου
  choice: выслушать меня
  rationale: По-русски естественно обозначает внимательное слушание речи до конца, не внося существенного дополнительного смысла.
theological_decisions: []
