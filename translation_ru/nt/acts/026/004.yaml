  text: Τὴν μὲν οὖν βίωσίν μου ⸀τὴν ἐκ νεότητος τὴν ἀπ’ ἀρχῆς γενομένην ἐν τῷ ἔθνει μου ἔν ⸀τε Ἱεροσολύμοις ἴσασι ⸀πάντες Ἰουδαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/004.yaml
  text: So then[a], all the Jews know my manner of life from my youth, which from the beginning took place among my own nation and also in Jerusalem,
translation:
  language: ru
  text: Итак, все иудеи знают, как я жил[a] с юности, с самого начала — среди моего народа и в Иерусалиме,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каким был мой образ жизни с юности». Греческое слово обозначает уклад или образ жизни, а не просто существование.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βίωσιν
  choice: как я жил / моя жизнь
  rationale: Существительное обозначает образ или уклад жизни, а не просто факт существования. Конструкция «как я жил» естественно передаёт этот смысл по-русски, а повтор «моя жизнь» сохраняет связь с определяющим оборотом.
- source_word: ἐκ νεότητος
  choice: с юности
  rationale: Краткое и естественное временное выражение, указывающее на начало описываемого периода жизни Павла.
- source_word: ἀπ’ ἀρχῆς
  choice: с самого начала
  rationale: Передаёт усилительный временной смысл выражения и его связь со всем последующим описанием.
- source_word: γενομένην
  choice: проходила
  rationale: Причастие описывает то, где протекала жизнь Павла; «жизнь проходила» звучит естественно и не привносит дополнительного смысла.
- source_word: ἐν τῷ ἔθνει μου
  choice: среди моего народа
  rationale: ἔθνος здесь обозначает народ, к которому принадлежал Павел, а не современное политическое государство.
- source_word: ἔν τε Ἱεροσολύμοις
  choice: и в Иерусалиме
  rationale: Союзная частица τε добавляет Иерусалим как ещё одно указанное место без необходимости усиливать связь словом «также».
- source_word: ἴσασι
  choice: знают
  rationale: 'Форма οἶδα имеет настоящее статическое значение: иудеи располагают этим знанием.'
- source_word: πάντες Ἰουδαῖοι
  choice: все иудеи
  rationale: Прямо сохраняет всеобщность утверждения и этническо-религиозное обозначение в данном контексте.
- source_word: μὲν οὖν
  choice: итак
  rationale: Передаёт переход и продолжение речи Павла без избыточного причинно-следственного оттенка.
