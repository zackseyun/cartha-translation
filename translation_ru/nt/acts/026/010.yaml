source:
  edition: SBLGNT
  text: ὃ καὶ ἐποίησα ἐν Ἱεροσολύμοις, καὶ πολλούς ⸀τε τῶν ἁγίων ἐγὼ ⸀ἐν φυλακαῖς κατέκλεισα τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών, ἀναιρουμένων τε αὐτῶν κατήνεγκα ψῆφον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/010.yaml
  text: 'And this is what I did in Jerusalem: I not only locked up many of the saints in prisons[a], having received authority from the chief priests, but also, when they were being put to death[b], I cast my vote against them.'
translation:
  language: ru
  text: 'И это я делал в Иерусалиме: получив полномочия от первосвященников, я не только заключал многих святых[a] в тюрьмы, но и, когда их предавали смерти, подавал свой голос против них[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Святые» здесь — принадлежащие Богу люди, то есть верующие в Иисуса, а не только особо почитаемые верующие.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «вносил (или опускал) голос»; греческое слово ψῆφος первоначально означало камешек, которым голосовали. Выражение может указывать на формальное голосование или, шире, на согласие с приговором; точная обстановка в тексте не названа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ καὶ ἐποίησα
  choice: Именно так я и поступал
  rationale: Оборот подхватывает сказанное ранее о преследовании учеников Иисуса. Такая формулировка естественна по-русски и передаёт усилительное καί.
- source_word: ἐν Ἱεροσολύμοις
  choice: в Иерусалиме
  rationale: Общепринятая современная русская форма географического названия.
- source_word: πολλούς τε τῶν ἁγίων
  choice: многих святых
  rationale: Субстантивированное ἅγιοι обозначает принадлежащих Божьему святому народу верующих, а не особо канонизированную группу; традиционный ключевой термин сохранён и пояснён в сноске.
- source_word: ἐν φυλακαῖς κατέκλεισα
  choice: заключил ... в тюрьмы
  rationale: Передаёт и значение лишения свободы, и явно выраженное множественное число φυλακαῖς; звучит естественно в современном русском языке.
- source_word: τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών
  choice: получив власть от первосвященников
  rationale: Причастный оборот указывает, на каком основании Павел действовал; ἐξουσία передано без сужения до конкретной юридической формы полномочий.
- source_word: ἀναιρουμένων τε αὐτῶν
  choice: когда их предавали смерти
  rationale: Пассивное причастие передано временным придаточным; выражение сохраняет тяжесть смысла, не уточняя сверх текста, шла ли речь именно о юридической казни.
- source_word: κατήνεγκα ψῆφον
  choice: подавал свой голос против них
  rationale: Сохраняется явный образ ψῆφος — голоса при вынесении решения. Несовершенный вид естественно описывает участие Павла в неоднократных случаях, объединённых греческим аористом в итоговое повествование.
theological_decisions:
- issue: Значение ἅγιοι
  choice: «святые» как обозначение верующих в Иисуса
  alternative: «святой народ Божий» или «верующие»
  rationale: Термин относится к членам христианской общины в целом, а не к позднее выделенной категории особо почитаемых лиц. Сноска предупреждает возможное современное недоразумение.
- issue: Смысл κατήνεγκα ψῆφον
  choice: Передано как подача голоса против осуждаемых
  alternative: Общее одобрение их смерти без формального голосования
  rationale: Слово ψῆφος непосредственно обозначает камешек для голосования, а затем голос. Основной текст сохраняет буквальную силу выражения, тогда как сноска оставляет открытым точный характер участия Павла и не приписывает ему конкретную должность или членство в определённом органе.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Синтаксис остаётся прозрачным для широкого читателя; традиционные библейские термины «святые» и «первосвященники» сохранены, а потенциально неоднозначные места пояснены без конфессионального уточнения.
