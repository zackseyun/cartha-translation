  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὅθεν, βασιλεῦ Ἀγρίππα, οὐκ ἐγενόμην ἀπειθὴς τῇ οὐρανίῳ ὀπτασίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/019.yaml
  text: Therefore[a], King Agrippa, I was not disobedient to the heavenly vision,
translation:
  language: ru
  text: Поэтому, царь Агриппа, я не был непослушен небесному видению[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «видению с неба».'
    reason: Прилагательное οὐρανίῳ может указывать либо на небесный характер видения, либо на его происхождение с неба.
lexical_decisions:
- source_word: Ὅθεν
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассказа Павла о встрече и полученном поручении, сохраняя ясную логическую связь.
- source_word: βασιλεῦ Ἀγρίππα
  choice: царь Агриппа
  rationale: Естественно передаёт звательную форму и почётный титул в современном русском языке.
- source_word: οὐκ ἐγενόμην
  choice: я не был
  rationale: Сочетание γίνομαι с предикативным прилагательным здесь идиоматически обозначает состояние; буквальное «не стал» могло бы неоправданно подчеркнуть изменение состояния.
- source_word: ἀπειθὴς
  choice: непослушен
  rationale: В контексте данного свыше поручения слово обозначает отказ повиноваться; «не убеждён» было бы чрезмерно когнитивным, а «мятежен» — слишком сильным.
- source_word: τῇ οὐρανίῳ ὀπτασίᾳ
  choice: небесному видению
  rationale: «Видение» естественно передаёт сверхъестественно явленное зрелище, а «небесному» сохраняет возможный смысл как происхождения, так и характера видения.
theological_decisions:
- issue: Характер пережитого Павлом на дороге в Дамаск
  choice: видение
  alternative: явление; видение с неба
  rationale: ὀπτασία непосредственно обозначает видение или явление. «Видение» сохраняет категорию самого текста, не сводя событие ни к чисто внутреннему переживанию, ни к более разработанной богословской формулировке.
translation_notes:
  register: Современный литературный русский язык; речь Павла звучит уважительно и достойно. Сохранён прямой порядок обращения и умеренно традиционное, но понятное выражение «небесное видение».
