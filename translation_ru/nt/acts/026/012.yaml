lexical_decisions:
- source_word: Ἐν οἷς
  choice: В связи с этим
  rationale: Естественно передаёт отсылку к ранее описанным действиям и намерениям Павла, не вводя отсутствующего в греческом тексте слова «миссия».
- source_word: πορευόμενος
  choice: направляясь
  rationale: Деепричастие передаёт одновременность действия и естественно звучит в рассказе о пути в Дамаск.
- source_word: εἰς τὴν Δαμασκὸν
  choice: в Дамаск
  rationale: Обычный современный русский способ обозначить направление движения к городу.
- source_word: μετ’ ἐξουσίας
  choice: с полномочиями
  rationale: Во множественном числе «полномочия» естественно обозначают официально предоставленное право действовать и не сводят ἐξουσία к физической силе.
- source_word: ἐπιτροπῆς
  choice: поручением
  rationale: Передаёт официально вверенное задание, сохраняя смысловое отличие от «полномочий».
- source_word: τῆς τῶν ἀρχιερέων
  choice: от первосвященников
  rationale: Предлог «от» ясно выражает источник полномочий и поручения, подразумеваемый греческим родительным падежом.
- source_word: ἀρχιερέων
  choice: первосвященников
  rationale: В данном контексте множественное число обозначает первосвященническую верхушку, а не утверждает наличие нескольких одновременно действующих носителей единственной должности.
