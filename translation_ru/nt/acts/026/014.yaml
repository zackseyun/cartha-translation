  text: πάντων ⸀τε καταπεσόντων ἡμῶν εἰς τὴν γῆν ἤκουσα φωνὴν ⸀λέγουσαν πρός ⸀με τῇ Ἑβραΐδι διαλέκτῳ· Σαοὺλ Σαούλ, τί με διώκεις; σκληρόν σοι πρὸς κέντρα λακτίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/014.yaml
  text: And when we had all fallen to the ground[a], I heard a voice saying to me in the Hebrew language, ‘Saul, Saul[b], why are you persecuting me? It is hard for you to kick against the goads.’
translation:
  language: ru
  text: 'Когда мы все упали на землю, я услышал голос, обратившийся ко мне на еврейском языке[a]: «Савл, Савл! Почему ты преследуешь меня? Трудно тебе лягаться против стрекал[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «на арамейском языке»; греческое выражение буквально означает «на еврейском языке (или наречии)».'
    reason: alternative_reading
  - marker: b
    text: 'Пословичный образ: животное, лягающееся против заострённой палки погонщика, лишь причиняет боль самому себе; сопротивление говорящему оборачивается вредом для сопротивляющегося.'
    reason: cultural_note
lexical_decisions:
- source_word: πάντων τε καταπεσόντων ἡμῶν εἰς τὴν γῆν
  choice: Когда мы все упали на землю
  rationale: Генитив абсолютный передан естественным временным придаточным; πάντων и ἡμῶν отражены словами «мы все», а завершённое действие аористного причастия предшествует словам «я услышал».
- source_word: ἤκουσα φωνὴν λέγουσαν πρός με
  choice: я услышал голос, обратившийся ко мне
  rationale: φωνή в контексте последующей прямой речи означает «голос». Оборот «обратившийся ко мне» естественно передаёт направленность речи, выраженную πρός με, не добавляя нового содержания.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: на еврейском языке
  rationale: Основной текст прямо отражает греческое обозначение языка. Возможность того, что в данном историческом контексте подразумевается арамейский, вынесена в примечание.
- source_word: Σαοὺλ Σαούλ
  choice: Савл, Савл
  rationale: Сохранены повтор имени и его эмфатическая сила; употреблена закрепившаяся в русской новозаветной традиции форма имени, понятная современному читателю.
- source_word: τί με διώκεις;
  choice: Почему ты преследуешь меня?
  rationale: Настоящее время и прямое обращение сохранены; «преследуешь» передаёт в данном контексте враждебное гонение.
- source_word: σκληρόν σοι
  choice: Трудно тебе
  rationale: Безличная конструкция передана кратко и естественно, без сужения смысла до одной лишь физической боли.
- source_word: πρὸς κέντρα λακτίζειν
  choice: лягаться против стрекал
  rationale: Сохранены образ удара ногой и множественное число κέντρα. «Стрекала» обозначают заострённые орудия, которыми понукали тягловых животных; смысл пословицы разъяснён в примечании.
theological_decisions:
- issue: Значение τῇ Ἑβραΐδι διαλέκτῳ
  choice: на еврейском языке
  alternative: на арамейском языке
  rationale: Перевод следует явной греческой формулировке и не подменяет её историко-лингвистическим толкованием; распространённая альтернативная трактовка сохранена в примечании.
- issue: Связь преследования верующих с преследованием говорящего
  choice: Почему ты преследуешь меня?
  alternative: Почему ты преследуешь моих последователей?
  rationale: Местоимение με переведено прямо как «меня», чтобы сохранить богословски значимое отождествление говорящего с гонимыми и не разрешать его посредством поясняющего пересказа.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Редкое слово «стрекала» сохранено ради конкретного образа и множественного числа оригинала, но пояснено в сноске. Местоимение «меня» написано со строчной буквы согласно общим правилам современного издания; личность говорящего от этого не меняется.
