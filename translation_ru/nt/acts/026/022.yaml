  text: ἐπικουρίας οὖν τυχὼν τῆς ⸀ἀπὸ τοῦ θεοῦ ἄχρι τῆς ἡμέρας ταύτης ἕστηκα μαρτυρόμενος μικρῷ τε καὶ μεγάλῳ, οὐδὲν ἐκτὸς λέγων ὧν τε οἱ προφῆται ἐλάλησαν μελλόντων γίνεσθαι καὶ Μωϋσῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/022.yaml
  text: Therefore[a], having received the help that is from God, I stand to this day, testifying to both small and great, saying nothing except what both the prophets and Moses said was going to happen[c][b],
translation:
  language: ru
  text: Итак, получив помощь от Бога, я до сегодняшнего дня стою и свидетельствую малым и великим[a], не говоря ничего сверх того, что, как говорили пророки и Моисей, предстояло произойти[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Малым и великим» — то есть людям любого общественного положения.
    reason: cultural_note
  - marker: b
    text: 'Или: «не говоря ничего, кроме того, что пророки и Моисей говорили о том, чему предстояло произойти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικουρίας ... τῆς ἀπὸ τοῦ θεοῦ
  choice: помощь от Бога
  rationale: Передаёт значение содействия или поддержки и прямо сохраняет указание на источник помощи; по-русски естественнее, чем буквальное «помощь, которая от Бога».
- source_word: τυχὼν
  choice: получив
  rationale: Аористное причастие здесь означает обретение или получение помощи; деепричастие естественно передаёт связь с основным сказуемым.
- source_word: ἄχρι τῆς ἡμέρας ταύτης
  choice: до сегодняшнего дня
  rationale: Естественное современное выражение, сохраняющее временную протяжённость до настоящего момента.
- source_word: ἕστηκα
  choice: стою
  rationale: Перфект обозначает достигнутое и сохраняющееся состояние; русский глагол настоящего времени естественно передаёт это состояние в данном контексте.
- source_word: μαρτυρόμενος
  choice: свидетельствую
  rationale: Сохраняет смысл продолжающегося свидетельства и возможный судебный оттенок речи Павла.
- source_word: μικρῷ τε καὶ μεγάλῳ
  choice: малым и великим
  rationale: Сохраняет образную форму и риторическую симметрию греческой идиомы; её социальный смысл пояснён в сноске.
- source_word: οὐδὲν ἐκτὸς λέγων
  choice: не говоря ничего сверх того
  rationale: Передаёт значение «ничего за пределами» и ясно выражает утверждение Павла о соответствии его свидетельства Писанию.
- source_word: ὧν τε οἱ προφῆται ἐλάλησαν ... καὶ Μωϋσῆς
  choice: что, по словам пророков и Моисея
  rationale: Естественная русская конструкция, сохраняющая греческий порядок «пророки и Моисей» и совместное отнесение пророчества к обоим.
- source_word: μελλόντων γίνεσθαι
  choice: должно было произойти
  rationale: Передаёт будущее относительно времени пророческой речи, не усиливая оттенок непосредственной близости события.
theological_decisions:
- issue: Степень преемственности свидетельства Павла с Писанием Израиля
  choice: «не говоря ничего сверх того»
  alternative: «говоря лишь то, что»
  rationale: 'Выбранная формулировка сохраняет сильное отрицательное утверждение исходного текста: Павел не выходит за пределы сказанного пророками и Моисеем, без добавления конфессионального толкования.'
- issue: Модальность выражения μελλόντων γίνεσθαι
  choice: «должно было произойти»
  alternative: «предстояло произойти»
  rationale: Оба варианта выражают будущее с точки зрения пророков; выбранный вариант естественен по-русски, но не уточняет, идёт ли речь о предопределённости или просто о будущем исполнении.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной судебной речи. Сохранены риторические пары и сильное утверждение о преемственности с Писанием; тяжеловесные буквальные конструкции устранены.
