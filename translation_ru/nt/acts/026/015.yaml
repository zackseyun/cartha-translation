  yaml_path: translation/nt/acts/026/015.yaml
  text: And I said[a], ‘Who are you, Lord?’ And the Lord said, ‘I am Jesus, whom you are persecuting.’
translation:
  language: ru
  text: 'Я сказал: «Кто Ты, Господи[a]?» Господь ответил: «Я Иисус, Которого ты преследуешь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «господин?» Греческое κύριε может быть уважительным обращением, однако здесь предпочтительно «Господи», поскольку небесный говорящий сразу называет Себя Иисусом.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ εἶπα
  choice: Я сказал
  rationale: Частица δέ здесь служит мягкой связкой в повествовании и не требует отдельного перевода; явное ἐγώ естественно передаётся русским местоимением «я».
- source_word: Τίς εἶ, κύριε;
  choice: Кто Ты, Господи?
  rationale: τίς εἶ прямо означает «кто ты?», а звательная форма κύριε передана как «Господи» с учётом небесного явления и немедленного отождествления говорящего с Иисусом.
- source_word: ὁ δὲ κύριος εἶπεν
  choice: Господь ответил
  rationale: κύριος с артиклем обозначает уже известного говорящего; «Господь» сохраняет смысл. В контексте вопроса εἶπεν естественно передать как «ответил», а δέ не нуждается в тяжеловесном отдельном союзе.
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: Я Иисус
  rationale: Русская именная конструкция без связки в настоящем времени естественно и точно передаёт прямое самоотождествление; дополнительное усиление не вводится.
- source_word: ὃν σὺ διώκεις
  choice: Которого ты преследуешь
  rationale: διώκω здесь означает враждебное преследование; настоящее время передаёт продолжающееся действие. Местоимение σὺ сохранено как «ты» без искусственного усиления.
theological_decisions:
- issue: Передача κύριε в обращении Савла
  choice: Господи
  alternative: господин
  rationale: Форма может быть уважительным обращением «господин», однако контекст небесного явления и непосредственное самоотождествление говорящего как Иисуса поддерживают «Господи». Альтернатива отмечена в сноске, чтобы сохранить лексическую неоднозначность.
- issue: Передача ὁ κύριος при обозначении говорящего
  choice: Господь
  alternative: господин
  rationale: Артикль указывает на определённого, уже представленного говорящего; в данном повествовательном и христологическом контексте естественно «Господь», без добавления дальнейших doctrинальных уточнений.
translation_notes:
  register: Современный литературный русский язык; прямая речь звучит естественно и торжественно без архаизации. Прописные «Ты» и «Которого» употреблены как традиционный знак почтения в обращении к Господу.
