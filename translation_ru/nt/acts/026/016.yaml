review_pass:
  verdict: revise
  source_fidelity: Основной текст верно передаёт повеления, цель явления, назначение Павла служителем и свидетелем, а также личное явление Иисуса в прошлом и будущем. Однако оборот «того, в чём ты увидел Меня» по-русски воспринимается как указание на обстоятельства, при которых Павел увидел Иисуса, и неудачно передаёт сжатую относительную конструкцию греческого текста.
  naturalness: «Поднимись и встань на ноги» уместно сохраняет два повеления и библейски-торжественный регистр. Замена «в чём ты увидел Меня» на «что ты видел Меня» делает фразу ясной и современной; параллельное «как Я ещё явлюсь тебе» естественно выражает будущие явления, не сводя их к абстрактному сообщению.
  terminology: «Назначить тебя служителем и свидетелем» точно и естественно передаёт προχειρίσασθαί, ὑπηρέτην и μάρτυρα. Термин «служитель» не смешивается с δοῦλος; «свидетель» соответствует μάρτυς. Заглавные местоимения в речи Иисуса согласуются с принятой русской библейской традицией.
  issues:
  - severity: medium
    issue: Неестественный и семантически неточный оборот «того, в чём ты увидел Меня».
    rationale: Русское «в чём» обычно обозначает обстоятельство или среду действия («в чём именно?»), тогда как греческая конструкция с με после εἶδες сжата и допускает передачу как свидетельства о том, что Павел видел Иисуса. Следует устранить ложный оттенок обстоятельства, сохранив явление как личное.
  - severity: low
    issue: «Поставить тебя» менее однозначно, чем «назначить тебя».
    rationale: «Поставить» возможно в церковном регистре, но в современном литературном русском может звучать как специальный термин рукоположения. «Назначить» точно передаёт поручение роли без такого дополнительного оттенка.
