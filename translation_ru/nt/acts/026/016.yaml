source:
  edition: SBLGNT
  text: ἀλλὰ ἀνάστηθι καὶ στῆθι ἐπὶ τοὺς πόδας σου· εἰς τοῦτο γὰρ ὤφθην σοι, προχειρίσασθαί σε ὑπηρέτην καὶ μάρτυρα ὧν τε εἶδές ⸀με ὧν τε ὀφθήσομαί σοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/016.yaml
  text: 'But rise and stand on your feet[a], for I have appeared to you for this purpose: to appoint you as a servant and witness both of the things in which you have seen me and of the things in which I will appear to you,'
translation:
  language: ru
  text: Но поднимись и встань на ноги, потому что Я явился тебе для того, чтобы назначить тебя служителем и свидетелем как того, что ты видел Меня, так и того, как Я ещё явлюсь тебе[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза сжата и синтаксически трудна. Более формально: «свидетелем того, в чём ты видел Меня, и того, в чём Я явлюсь тебе». Возможна также смысловая передача: «свидетелем того, что ты уже видел обо Мне, и того, что Я ещё открою тебе, являясь тебе».'
    reason: Сноска отмечает сжатую и спорную относительную конструкцию, объясняет более буквальный вариант и предлагает ясную смысловую передачу, не подменяя ею основной текст.
lexical_decisions:
- source_word: ἀνάστηθι καὶ στῆθι ἐπὶ τοὺς πόδας σου
  choice: поднимись и встань на ноги
  rationale: Передаёт два последовательных повеления и сохраняет выразительный образ призвания, оставаясь естественным для современного русского языка.
- source_word: εἰς τοῦτο γὰρ ὤφθην σοι
  choice: потому что Я явился тебе для того
  rationale: ὤφθην передано как формула личного явления, а εἰς τοῦτο — как указание на цель этого явления.
- source_word: προχειρίσασθαί σε
  choice: поставить тебя
  rationale: Глагол обозначает избрание и назначение на определённое служение; «поставить» естественно передаёт официальное поручение роли.
- source_word: ὑπηρέτην
  choice: служителем
  rationale: Слово обозначает подчинённого исполнителя или помощника. «Служитель» сохраняет достоинство поручения, не смешивая ὑπηρέτης с δοῦλος.
- source_word: μάρτυρα
  choice: свидетелем
  rationale: Стандартно и точно обозначает человека, которому поручено свидетельствовать о виденном и открытом.
- source_word: ὧν τε εἶδές με ὧν τε ὀφθήσομαί σοι
  choice: как того, в чём ты увидел Меня, так и того, в чём Я ещё явлюсь тебе
  rationale: Сохраняет параллелизм двух относительных оборотов и различие между тем, что уже было увидено, и будущими явлениями, не заменяя ὀφθήσομαι более толковательным «покажу».
theological_decisions:
- issue: Характер откровения в ὤφθην и ὀφθήσομαί
  choice: 'Оба глагола переданы языком личного явления: «Я явился» и «Я ещё явлюсь».'
  alternative: «Я был увиден / буду увиден» или «Я открылся / ещё откроюсь».
  rationale: Так сохраняется объективная направленность слов воскресшего Иисуса о Его явлении Павлу, но не уточняется способ или форма будущего откровения.
- issue: Содержание будущего свидетельства Павла
  choice: Сохранена сжатая греческая конструкция с двумя параллельными оборотами «в чём».
  alternative: Развернуть смысл как «о том, что ты видел обо Мне, и о том, что Я ещё покажу тебе».
  rationale: Развёрнутый вариант звучит проще, но вводит отсутствующий в тексте глагол «покажу» и может скрыть намеренную связь свидетельства с личными явлениями Иисуса.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Заглавные местоимения «Я», «Меня» употреблены в прямой речи Иисуса по принятой русской библейской традиции. Сохранены образное повеление «встань на ноги», целевая структура поручения и напряжение между буквальной сжатостью греческого текста и ясностью перевода.
