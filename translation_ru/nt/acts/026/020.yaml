revisions:
- from: но сначала жителям Дамаска, затем Иерусалима и всей Иудеи, а потом и язычникам я возвещал, чтобы они покаялись, обратились к Богу и делами доказали[a] своё покаяние.
  to: Но сначала жителям Дамаска, затем — жителям Иерусалима, по всей Иудее и язычникам я возвещал, чтобы они покаялись и обратились к Богу, совершая дела, соответствующие покаянию[a].
  rationale: Исправление устраняет не заданное оригиналом значение «доказали» и делает географический ряд естественным для современного литературного русского. Союз «и» между покаянием и обращением сохранен, а причастный оборот передает сопутствующее действие πράσσοντας, не предрешая богословский вопрос о заслуге дел.
