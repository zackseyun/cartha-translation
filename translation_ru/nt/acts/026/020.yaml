  text: ἀλλὰ τοῖς ἐν Δαμασκῷ πρῶτόν ⸀τε καὶ Ἱεροσολύμοις, ⸀πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας, καὶ τοῖς ἔθνεσιν ⸀ἀπήγγελλον μετανοεῖν καὶ ἐπιστρέφειν ἐπὶ τὸν θεόν, ἄξια τῆς μετανοίας ἔργα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/020.yaml
  text: but first to those in Damascus[a], then also in Jerusalem, and throughout all the region of Judea, and to the Gentiles, I proclaimed that they should repent and turn to God[b], doing works worthy of repentance.
translation:
  language: ru
  text: Но сначала жителям Дамаска, затем — жителям Иерусалима, по всей Иудее и язычникам я возвещал, чтобы они покаялись и обратились к Богу, совершая дела, соответствующие покаянию[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «совершая дела, достойные покаяния»; также: «дела, подобающие покаянию».'
    reason: Сноска сохраняет близкую к греческому выражению формулировку ἄξια τῆς μετανοίας ἔργα и отмечает допустимый лексический вариант, не усиливая смысл до «доказательства».
lexical_decisions:
- source_word: ἀλλὰ
  choice: но
  rationale: Естественно передаёт противопоставление предшествующему утверждению Павла.
- source_word: τοῖς ἐν Δαμασκῷ
  choice: жителям Дамаска
  rationale: Дательный с обозначением места относится к находившимся там людям; по-русски это выражено кратко и естественно.
- source_word: πρῶτόν τε καὶ Ἱεροσολύμοις
  choice: сначала жителям Дамаска, затем Иерусалима
  rationale: Передаёт последовательность проповеди и устраняет неестественную для русского синтаксическую двусмысленность.
- source_word: πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας
  choice: всей Иудеи
  rationale: В данном географическом перечислении χώρα обозначает область; краткая формулировка не сужает значение до сельской местности.
- source_word: τοῖς ἔθνεσιν
  choice: язычникам
  rationale: В противопоставлении Иудее слово обозначает нееврейские народы; «язычники» — понятный традиционный русский эквивалент.
- source_word: ἀπήγγελλον
  choice: я возвещал
  rationale: Передаёт публичное провозглашение вести и сохраняет возвышенный, но современный регистр.
- source_word: μετανοεῖν
  choice: покаялись
  rationale: В контексте обращения к Богу речь идёт не просто о перемене мнения, а о покаянии.
- source_word: ἐπιστρέφειν ἐπὶ τὸν θεόν
  choice: обратились к Богу
  rationale: Точно и идиоматично передаёт направленность обращения; «вернулись» могло бы ошибочно предполагать прежнюю принадлежность Богу у всех адресатов.
- source_word: ἄξια τῆς μετανοίας ἔργα πράσσοντας
  choice: делами доказали своё покаяние
  rationale: Естественно по-русски выражает дела, соответствующие покаянию и свидетельствующие о нём, при этом смысловой оттенок «доказали» отмечен сноской.
theological_decisions:
- issue: Соотношение покаяния, обращения к Богу и дел
  choice: Дела представлены как практическое выражение и подтверждение покаяния.
  alternative: 'Буквальнее: «совершая дела, достойные покаяния».'
  rationale: Причастный оборот описывает поведение, сопутствующее покаянию и соответствующее ему; перевод не называет дела основанием принятия Богом.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной речи. Географическое перечисление слегка сглажено ради ясности; богословская связь между покаянием и делами не превращена в утверждение о заслуге.
