  text: τί ἄπιστον κρίνεται παρ’ ὑμῖν εἰ ὁ θεὸς νεκροὺς ἐγείρει;
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/008.yaml
  text: Why is it judged unbelievable by you if God raises the dead?
translation:
  language: ru
  text: Почему вы считаете невероятным, что Бог воскрешает мёртвых?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί ... κρίνεται παρ’ ὑμῖν
  choice: Почему вы считаете невероятным
  rationale: Греческая безличная конструкция буквально означает «почему это считается у вас/вами невероятным». Естественная русская личная конструкция сохраняет обращение к слушателям и оттенок их суждения.
- source_word: ἄπιστον
  choice: невероятным
  rationale: Здесь слово обозначает то, что считают недостоверным или не заслуживающим веры; «невероятным» ясно и естественно передаёт смысл в данном риторическом вопросе.
- source_word: εἰ
  choice: что
  rationale: После выражения оценки εἰ вводит содержание того, что слушатели считают невероятным; по-русски естественно употребить изъяснительное «что», а не условное «если».
- source_word: ὁ θεὸς νεκροὺς ἐγείρει
  choice: Бог воскрешает мёртвых
  rationale: Сохраняются настоящее время и прямой богословский тезис греческого текста; «воскрешает» в этом контексте точнее обычного «поднимает».
theological_decisions:
- issue: Характер высказывания о воскресении
  choice: Бог воскрешает мёртвых
  alternative: Бог может воскрешать мёртвых
  rationale: В оригинале отсутствует модальный глагол «может»; добавление способности смягчило бы прямую формулировку Павла.
- issue: Связь εἰ с риторическим вопросом
  choice: что Бог воскрешает мёртвых
  alternative: если Бог воскрешает мёртвых
  rationale: В данном синтаксисе придаточное передаёт содержание суждения, а не ставит действие Бога под условие. Русское «что» избегает ложного условного оттенка.
translation_notes:
  register: Современный литературный русский язык; краткий, dignified риторический вопрос. Активная конструкция звучит естественнее буквального пассива и сохраняет направленность παρ’ ὑμῖν на адресатов.
