  yaml_path: translation/nt/acts/026/031.yaml
  text: And after they withdrew[a], they were speaking to one another, saying, “This man is doing nothing worthy of death or imprisonment.”
translation:
  language: ru
  text: 'Отойдя, они говорили между собой: «Этот человек не делает ничего такого, за что полагались бы смертная казнь или заключение[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смерть или оковы». Греческое слово δεσμῶν буквально означает «оков, уз», но здесь, вероятно, подразумевает заключение или содержание под стражей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναχωρήσαντες
  choice: Отойдя
  rationale: 'Аористное причастие обозначает действие, предшествующее разговору: присутствующие отошли в сторону или удалились с места слушания. «Отойдя» передаёт это естественно и без излишней конкретизации.'
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: говорили друг другу
  rationale: Имперфект передаёт продолжавшийся обмен мнениями, а взаимное местоимение указывает на разговор между присутствующими.
- source_word: Οὐδὲν ... ἄξιον
  choice: ничего, заслуживающего
  rationale: Оборот выражает отсутствие поступка, который заслуживал бы названного наказания. Такая формулировка естественна в современном русском языке и сохраняет судебный смысл.
- source_word: θανάτου ἢ δεσμῶν
  choice: смерти или заключения
  rationale: θάνατος в данном судебном контексте означает смертную казнь, а δεσμοί буквально значит «оковы, узы» и метонимически указывает на содержание под стражей. «Заключение» ясно передаёт контекстуальный смысл; буквальный образ сохранён в сноске.
- source_word: τι πράσσει
  choice: не делает ничего
  rationale: πράσσω имеет широкое значение «делать, совершать». Перевод не добавляет прямо не выраженного указания на преступление и сохраняет настоящее время.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: этот человек
  rationale: Выражение непосредственно указывает на Павла и естественно передаётся обычным русским обозначением лица мужского пола.
theological_decisions:
- issue: Юридический смысл θανάτου и δεσμῶν
  choice: Сохранить формулировку как оценку того, заслуживают ли поступки Павла смерти или заключения.
  alternative: Передать как окончательное заявление о полной невиновности Павла.
  rationale: Греческий текст утверждает, что Павел не делает ничего достойного этих наказаний; он не формулирует более широкого богословского или юридического вывода.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Имперфект передан формой «говорили», а судебная оценка — естественным оборотом «ничего, заслуживающего». Маркер сноски поставлен непосредственно после слова, к которому относится лексическая альтернатива.
