  - marker: b
    text: Греческое слово здесь обозначает весь храмовый комплекс, а не только внутреннее святилище.
    reason: cultural_note
lexical_decisions:
- source_word: ἕνεκα τούτων
  choice: Из-за этого
  rationale: Оборот с ἕνεκα выражает причину и отсылает к сказанному Павлом ранее; русский вариант краток, естественен и сохраняет эту причинную связь.
- source_word: με
  choice: меня
  rationale: Форма первого лица единственного числа в винительном падеже является прямым дополнением при συλλαβόμενοι.
- source_word: Ἰουδαῖοι
  choice: иудеи
  rationale: Так прямо обозначены участники нападения. В контексте речь идёт о конкретных противниках Павла, а не обо всём иудейском народе.
- source_word: συλλαβόμενοι
  choice: схватили
  rationale: Причастие обозначает насильственное задержание или захват; «схватили» естественно передаёт враждебный характер действия, не придавая ему официально-правового оттенка ареста.
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: ἱερόν обозначает храмовый комплекс, а не только внутреннее святилище; традиционное русское «в храме» естественно в основном тексте, а точность значения поясняется в сноске.
- source_word: ἐπειρῶντο
  choice: пытались
  rationale: Имперфект передаёт продолжавшуюся или не завершившуюся попытку; «пытались» сохраняет этот видовой оттенок.
- source_word: διαχειρίσασθαι
  choice: убить
  rationale: В данном контексте глагол означает насильственно лишить жизни. «Убить» ясно передаёт смысл без дополнительной юридической оценки, которую могло бы внести слово «убить преступно» или «совершить убийство».
theological_decisions:
- issue: Упоминание иудеев в полемически чувствительном контексте
  choice: «иудеи» понимается как обозначение конкретных противников Павла, схвативших его
  alternative: понимать выражение как обобщение обо всём иудейском народе
  rationale: Греческий текст называет группу участников данного события, но не распространяет обвинение на весь народ. Перевод сохраняет историческое обозначение, не усиливая его до этнического обобщения.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и повествовательно естественная. Сохранены причинная связь с предыдущей речью Павла, незавершённый характер попытки и различие между храмовым комплексом и внутренним святилищем.
