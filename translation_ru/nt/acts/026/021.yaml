  terminology: '«Иудеи» — точная историко-культурная передача Ἰουδαῖοι в данном контексте и не должна пониматься как обобщение обо всём народе. «Храм» с поясняющей сноской удачно передаёт ἱερόν. В сноске a вариант «За это» лучше убрать: в современном русском он легко подразумевает карательный мотив и менее точно передаёт нейтральную причинную связь ἕνεκα.'
