base_translation:
  language: en
  yaml_path: translation/nt/acts/026/021.yaml
  text: Because of these things the Jews seized me in the temple and were trying to kill me[a][b].
translation:
  language: ru
  text: Из-за этого[a] иудеи схватили меня в храме[b] и пытались убить меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «По этой причине»; «Из-за этих обстоятельств».'
