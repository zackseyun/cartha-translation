  text: ⸀Ἀνέστη ⸀τε ὁ βασιλεὺς καὶ ὁ ἡγεμὼν ἥ τε Βερνίκη καὶ οἱ συγκαθήμενοι αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/030.yaml
  text: Then the king rose[a], and the governor and Bernice and those seated with them,
translation:
  language: ru
  text: Тогда царь встал, а вместе с ним — правитель, Вереника[a] и сидевшие с ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Вереника: также «Береника».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέστη
  choice: встал
  rationale: 'Аорист ἀνίστημι здесь обозначает физическое действие: царь поднялся со своего места. «Встал» естественно и точно для официальной обстановки.'
- source_word: τε
  choice: тогда; а вместе с ним
  rationale: Первая частица передаёт переход к следующему событию повествования; последующие связующие частицы естественно выражены русской сочинительной конструкцией, не перегруженной повторными союзами.
- source_word: ὁ βασιλεὺς
  choice: царь
  rationale: Сохранён употреблённый в греческом тексте титул, без подстановки имени Агриппы.
- source_word: ὁ ἡγεμὼν
  choice: правитель
  rationale: В данном контексте ἡγεμών обозначает римского провинциального правителя. «Правитель» точно передаёт титул и привычно для современного русского библейского повествования.
- source_word: Βερνίκη
  choice: Вереника
  rationale: «Вереника» — традиционная и узнаваемая русская форма имени; более непосредственная транслитерация «Береника» отмечена в сноске.
- source_word: οἱ συγκαθήμενοι αὐτοῖς
  choice: сидевшие с ними
  rationale: Причастная конструкция сохраняет конкретный образ людей, совместно сидевших с названными лицами, и не приписывает им не указанной в тексте общественной роли.
- source_word: καὶ
  choice: а вместе с ним; и
  rationale: Союзы передают перечисление участников; оборот «а вместе с ним» делает русскую фразу естественной и не меняет смысла совместного ухода.
