  text: Ἀγρίππας δὲ πρὸς τὸν Παῦλον ἔφη· Ἐπιτρέπεταί σοι ⸀ὑπὲρ σεαυτοῦ λέγειν. τότε ὁ Παῦλος ⸂ἐκτείνας τὴν χεῖρα ἀπελογεῖτο⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/001.yaml
  text: 'Then Agrippa said to Paul[b][a], “You are permitted to speak on your own behalf.” Then Paul stretched out his hand and made his defense:'
translation:
  language: ru
  text: 'Тогда Агриппа сказал Павлу: «Тебе разрешается говорить в свою защиту[a]». Тогда Павел простёр руку и стал говорить в свою защиту[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорить за себя».'
    reason: Сочетание ὑπὲρ σεαυτοῦ может быть передано менее юридически, хотя контекст поддерживает перевод «в свою защиту».
  - marker: b
    text: 'Или: «произносил защитительную речь».'
    reason: Греческий глагол обозначает формальную защиту, в том числе в судебной обстановке; форма имперфекта представляет действие как разворачивающееся.
lexical_decisions:
- source_word: Ἀγρίππας
  choice: Агриппа
  rationale: Традиционная русская передача личного имени.
- source_word: δὲ
  choice: Тогда
  rationale: Частица отмечает переход к следующему событию повествования; «тогда» естественно передаёт последовательность.
- source_word: πρὸς τὸν Παῦλον ἔφη
  choice: сказал Павлу
  rationale: Естественная русская передача оборота с глаголом речи и πρός.
- source_word: Ἐπιτρέπεταί σοι
  choice: Тебе разрешается
  rationale: Сохраняет пассивное значение предоставленного разрешения и официальный тон сцены.
- source_word: ὑπὲρ σεαυτοῦ λέγειν
  choice: говорить в свою защиту
  rationale: В судебном контексте ὑπέρ с возвратным местоимением означает выступление в собственную защиту; формулировка не сводит речь лишь к рассказу о себе.
- source_word: τότε
  choice: Павел
  rationale: Отдельное «тогда» опущено как стилистически избыточное после уже употреблённого временного связующего; последовательность действий ясна из порядка предложений.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: простёр руку
  rationale: Прямая и принятая в литературном русском передача жеста без уточнения его предполагаемого значения.
- source_word: ἀπελογεῖτο
  choice: стал защищаться
  rationale: Передаёт длительный вид имперфекта и юридический оттенок глагола, естественно вводя последующую защитительную речь.
theological_decisions:
- issue: Юридический или общий смысл ἀπελογεῖτο
  choice: стал защищаться
  alternative: произнёс речь в свою защиту
  rationale: Возвратный глагол сохраняет юридический оттенок, но не добавляет в основной текст существительного «речь», которого в греческом нет.
translation_notes:
  register: Современный литературный русский с умеренно официальным тоном судебного слушания. «Простёр руку» сохраняет достоинство повествования и привычную библейскую выразительность, оставаясь понятным современному читателю.
