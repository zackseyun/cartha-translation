  text: ὁ δὲ ⸀Παῦλος· Οὐ μαίνομαι, φησίν, κράτιστε Φῆστε, ἀλλὰ ἀληθείας καὶ σωφροσύνης ῥήματα ἀποφθέγγομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/025.yaml
  text: But Paul said[a], “I am not out of my mind, most excellent Festus[c][b], but I am speaking words of truth and sound judgment.”
translation:
  language: ru
  text: 'Но Павел сказал: «Я не безумствую, достопочтенный Фест[a], а произношу слова истины и здравомыслия[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Достопочтенный» — официальное уважительное обращение к высокопоставленному должностному лицу.
    reason: cultural_note
  - marker: b
    text: 'Или: «слова истины и рассудительности»; греческое слово может обозначать здравый ум, рассудительность и самообладание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт противопоставление обвинению Феста в предыдущем стихе.
- source_word: μαίνομαι
  choice: не безумствую
  rationale: Прямо передаёт значение глагола «быть безумным, лишиться рассудка» и естественно отвечает на обвинение Феста.
- source_word: φησίν
  choice: сказал
  rationale: Историческое настоящее передано обычным для русского повествования прошедшим временем.
- source_word: κράτιστε
  choice: достопочтенный
  rationale: Уважительное официальное обращение к высокопоставленному лицу; сохраняет достоинство речи без архаичного «превосходнейший».
- source_word: ἀληθείας
  choice: истины
  rationale: Сохраняет греческую конструкцию «слова истины» и её смысловую выразительность.
- source_word: σωφροσύνης
  choice: здравомыслия
  rationale: В данном контексте обозначает рассудительность и здравое состояние ума, противопоставленные безумию.
- source_word: ῥήματα
  choice: слова
  rationale: Точно передаёт конкретное существительное во множественном числе.
- source_word: ἀποφθέγγομαι
  choice: произношу
  rationale: Передаёт оттенок ясного, открытого и весомого высказывания лучше, чем нейтральное «говорю».
