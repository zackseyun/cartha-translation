id: ACT.26.27
reference: Acts 26:27
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πιστεύεις, βασιλεῦ Ἀγρίππα, τοῖς προφήταις; οἶδα ὅτι πιστεύεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/027.yaml
  text: King Agrippa, do you believe the prophets? I know that you do believe.
translation:
  language: ru
  text: Царь Агриппа, веришь ли ты пророкам?[a] Я знаю, что веришь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принимаешь свидетельство пророков»; или: «доверяешь пророкам».'
    reason: Лексические варианты передачи πιστεύεις τοῖς προφήταις.
lexical_decisions:
- source_word: πιστεύεις
  choice: веришь
  rationale: Настоящее время, действительный залог, второе лицо единственного числа. В сочетании с дательным τοῖς προφήταις глагол выражает признание истинности свидетельства пророков; русское «веришь пророкам» передаёт это прямо и естественно.
- source_word: βασιλεῦ Ἀγρίππα
  choice: Царь Агриппа
  rationale: Вокатив передан естественным для современного литературного русского обращением без архаического «о»; имя дано в принятой русской форме.
- source_word: τοῖς προφήταις
  choice: пророкам
  rationale: Дательный падеж сохранён. Речь идёт о пророках как признанных свидетелях Писания и об истинности их вести, без поясняющей подстановки «писания пророков».
- source_word: οἶδα
  choice: Я знаю
  rationale: Перфектная форма имеет настоящее значение; прямое утверждение Павла сохранено без смягчения до «я уверен».
- source_word: ὅτι πιστεύεις
  choice: что веришь
  rationale: Повтор исходного глагола сохранён. В русском отсутствие местоимения «ты» во второй фразе естественно, а краткая формулировка сохраняет её уверенный и заострённый характер.
theological_decisions:
- issue: Характер веры в пророков
  choice: «веришь пророкам» — признание истинности их свидетельства и вести
  alternative: «принимаешь пророков» или «доверяешь пророкам»
  rationale: Греческое πιστεύω с дательным здесь естественно указывает на веру свидетельству пророков. Перевод не расширяет реплику до утверждения о полноте личной или спасительной веры Агриппы и тем самым сохраняет риторическое и богословское напряжение контекста.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Обращение «Царь Агриппа» сохраняет статус и прямоту речи; синтаксис вопроса и последующего уверенного утверждения следует греческому оригиналу без искусственного усиления.
