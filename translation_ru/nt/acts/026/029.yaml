base_translation:
  language: en
  yaml_path: translation/nt/acts/026/029.yaml
  text: But Paul said[a], “I would pray to God that whether in a short time or in a long time, not only you but also all who hear me today might become such as I am—except for these chains.”
translation:
  language: ru
  text: 'Но Павел сказал: «Я бы просил Бога, чтобы — скоро ли, нескоро ли[a] — не только ты, но и все, кто слушает меня сегодня, стали такими же, как я, только без этих цепей».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «почти ли, вполне ли»; возможно также: «малого ли это потребует, многого ли». Греческое выражение трудно для однозначного понимания и может указывать на степень, усилия или время.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐξαίμην ἂν τῷ θεῷ
  choice: Я молил бы Бога
  rationale: Потенциальный оптатив с ἄν выражает молитвенное желание; дательный τῷ θεῷ указывает, к кому обращена молитва. Формулировка естественна по-русски и сохраняет осторожную модальность.
- source_word: ἐν ὀλίγῳ καὶ ἐν μεγάλῳ
  choice: скоро ли, нескоро ли
  rationale: Передаёт вероятный временной контраст краткого и долгого срока, не делая фразу тяжеловесной. Поскольку греческое выражение допускает и другие толкования, неоднозначность отмечена в сноске.
- source_word: οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον
  choice: не только ты, но и все, кто слушает меня сегодня
  rationale: Сохраняет усилительную конструкцию «не только… но и» и значение причастия настоящего времени — присутствующих слушателей.
- source_word: γενέσθαι
  choice: стали
  rationale: Инфинитив обозначает желаемое наступление нового состояния; русское «стали» ясно и естественно передаёт результат.
- source_word: τοιούτους ὁποῖος καὶ ἐγώ εἰμι
  choice: такими же, как я
  rationale: Точно и современно передаёт соотносительную конструкцию, не добавляя толкования того, в каком именно отношении слушатели должны уподобиться Павлу.
- source_word: παρεκτὸς τῶν δεσμῶν τούτων
  choice: только без этих цепей
  rationale: Передаёт исключение, выраженное παρεκτός, и сохраняет конкретный образ узника; «только без» звучит в русском естественно и подчёркивает живой жест Павла к своим оковам.
theological_decisions:
- issue: Толкование ἐν ὀλίγῳ καὶ ἐν μεγάλῳ в связи с предыдущими словами Агриппы
  choice: 'В основном тексте выражение понято как контраст времени: «скоро ли, нескоро ли».'
  alternative: Возможны значения «почти ли, вполне ли» или «малого ли это потребует, многого ли».
  rationale: Оборот труден и допускает временное, количественное либо степенное понимание. Основной текст использует контекстуально вероятное временное значение, а сноска сохраняет реальную неоднозначность без догматического разрешения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным синтаксисом. «Я молил бы Бога» сохраняет молитвенный характер желания; «скоро ли, нескоро ли» звучит естественно в устной реплике. Маркер сноски помещён непосредственно после спорного оборота.
