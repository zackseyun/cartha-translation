  text: καὶ νῦν ἐπ’ ἐλπίδι τῆς ⸀εἰς τοὺς πατέρας ⸀ἡμῶν ἐπαγγελίας γενομένης ὑπὸ τοῦ θεοῦ ἕστηκα κρινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/006.yaml
  text: And now I stand on trial because of the hope of the promise made by God to our fathers,[a]
translation:
  language: ru
  text: И теперь я стою перед судом за надежду на обещание, данное Богом нашим отцам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нашим предкам». В греческом тексте буквально: «нашим отцам»; имеются в виду праотцы Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: И теперь
  rationale: Сохраняет связь с предшествующей речью Павла и естественно передаёт переход к его нынешнему положению.
- source_word: ἐπ’ ἐλπίδι
  choice: за надежду на
  rationale: ἐπί с дательным указывает здесь на основание или причину суда. Русское «стою перед судом за…» естественно выражает эту причинную связь.
- source_word: ἐπαγγελίας
  choice: обещание
  rationale: 'Родительный падеж зависит от ἐλπίδι: надежда связана с Божьим обещанием. Сочетание «надежда на обещание» ясно и естественно по-русски.'
- source_word: τῆς εἰς τοὺς πατέρας ἡμῶν ἐπαγγελίας
  choice: обещание… нашим отцам
  rationale: Оборот с εἰς обозначает адресатов обещания; дательный падеж естественно передаёт это отношение в русском языке.
- source_word: γενομένης ὑπὸ τοῦ θεοῦ
  choice: данное Богом
  rationale: Причастие с ὑπό и родительным падежом сохраняет Божье действие. «Данное Богом обещание» идиоматично и не меняет смысла на исполненное обещание.
- source_word: πατέρας ἡμῶν
  choice: нашим отцам
  rationale: Сохраняет явно мужское обозначение и библейско-заветный оттенок, относящийся к праотцам Израиля; более общее «предкам» вынесено в примечание.
- source_word: ἕστηκα κρινόμενος
  choice: я стою перед судом
  rationale: Перфект ἕστηκα имеет настоящее статальное значение, а κρινόμενος описывает судебное разбирательство. Русское выражение естественно передаёт оба элемента.
theological_decisions:
- issue: Кого обозначают «наши отцы»
  choice: праотцов Израиля как получателей Божьего обещания
  alternative: предков еврейского народа в общем смысле
  rationale: В речи Павла перед Агриппой выражение отсылает к истории Израиля и Божьему обещанию отцам. Основной текст сохраняет традиционную формулировку, не сужая её дополнительным толкованием.
- issue: Связь надежды и обещания
  choice: «надежда на обещание»
  alternative: «надежда, основанная на обещании»
  rationale: Краткая формулировка сохраняет генитивную связь ἐλπὶς τῆς ἐπαγγελίας и не уточняет сверх текста, является ли обещание объектом, основанием или содержанием надежды.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Судебный контекст передан устойчивым выражением «стоять перед судом»; заветная лексика сохранена словом «отцам» с пояснением в сноске.
