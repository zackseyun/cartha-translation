source:
  edition: SBLGNT
  text: Ἐγὼ μὲν οὖν ἔδοξα ἐμαυτῷ πρὸς τὸ ὄνομα Ἰησοῦ τοῦ Ναζωραίου δεῖν πολλὰ ἐναντία πρᾶξαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/009.yaml
  text: So I myself indeed thought that I ought to do many things in opposition to the name of Jesus the Nazarene[a].
translation:
  language: ru
  text: Итак, я и сам считал, что должен многое делать против имени Иисуса Назорея.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против имени Иисуса из Назарета».'
    reason: Лексическая альтернатива для передачи Ἰησοῦ τοῦ Ναζωραίου.
lexical_decisions:
- source_word: Ἐγὼ
  choice: я и сам
  rationale: Явное местоимение в греческом имеет усилительное значение; сочетание «я и сам» естественно передаёт личный акцент признания Павла.
- source_word: μὲν οὖν
  choice: итак
  rationale: «Итак» передаёт переход и вывод, выраженные οὖν; оттенок μέν в русском естественно поддерживается усилением «и сам», без перегрузки частицами.
- source_word: ἔδοξα ἐμαυτῷ
  choice: считал
  rationale: Идиома обозначает внутреннее убеждение или суждение говорящего. «Считал» звучит естественно и сохраняет этот смысл.
- source_word: πρὸς τὸ ὄνομα
  choice: против имени
  rationale: В сочетании с ἐναντία и πρᾶξαι предлог имеет значение направленного противодействия. Сохранение слова «имя» не сужает библейскую идиому до одной лишь власти, репутации или дела Иисуса.
- source_word: Ἰησοῦ τοῦ Ναζωραίου
  choice: Иисуса Назорея
  rationale: «Назорей» сохраняет характер греческого обозначения Ναζωραῖος и его традиционно узнаваемую библейскую форму; возможное географически более явное прочтение вынесено в сноску.
- source_word: δεῖν
  choice: должен
  rationale: Передаёт осознававшуюся Павлом в прошлом необходимость или обязанность, не утверждая, что она была объективной.
- source_word: πολλὰ ἐναντία πρᾶξαι
  choice: многое делать против
  rationale: «Многое делать» сохраняет множественность в πολλά, а «против» естественно выражает враждебную направленность ἐναντία в русском предложении.
theological_decisions:
- issue: Значение выражения «имя Иисуса»
  choice: Сохранить библейскую идиому «имя», не заменяя её толкованием.
  alternative: «власть Иисуса» или «дело Иисуса»
  rationale: Греческий текст допускает представительное значение имени — личность, авторитет, исповедание и дело Иисуса, — но не требует сводить выражение лишь к одному из этих аспектов.
- issue: Характер необходимости в δεῖν
  choice: 'Передать как субъективное прежнее убеждение Павла: «считал, что должен».'
  alternative: «мне надлежало» как утверждение объективной необходимости
  rationale: Инфинитив зависит от ἔδοξα ἐμαυτῷ, поэтому необходимость представлена как прежняя оценка самого Павла, а не как одобрение его действий Богом.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной защитительной речи. Формулировка сохраняет эмфазу личного признания Павла, библейскую идиому «имя» и намеренно не уточняет её богословский объём.
