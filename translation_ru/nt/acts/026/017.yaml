  text: ἐξαιρούμενός σε ἐκ τοῦ λαοῦ καὶ ⸀ἐκ τῶν ἐθνῶν, εἰς οὓς ἐγὼ ⸂ἀποστέλλω σε⸃
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/017.yaml
  text: delivering you from the people and from the Gentiles[a], to whom I am sending you
translation:
  language: ru
  text: избавляя тебя от народа и от язычников[a], к которым Я посылаю тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спасая тебя от иудейского народа и от язычников».'
    reason: 'Лексико-контекстуальная альтернатива: ἐξαιρούμενος допускает «спасая», а τοῦ λαοῦ в данном противопоставлении относится к иудейскому народу.'
lexical_decisions:
- source_word: ἐξαιρούμενός
  choice: избавляя
  rationale: Причастие настоящего времени передаёт действие Иисуса по спасению Павла от враждебных людей; «избавляя» естественно по-русски и сохраняет оттенок избавления от опасности.
- source_word: τοῦ λαοῦ
  choice: народа
  rationale: В противопоставлении язычникам подразумевается иудейский народ, однако греческий текст говорит буквально «народ»; такое соответствие сохраняет исходную формулировку и её повествовательную перспективу.
- source_word: τῶν ἐθνῶν
  choice: язычников
  rationale: В данном иудейско-языческом противопоставлении ἔθνη обозначает неиудеев; «язычники» ясно и привычно передаёт этот смысл.
- source_word: εἰς οὓς
  choice: к которым
  rationale: После глагола посылания оборот естественно передаётся направительным «к которым»; относительное местоимение согласуется с «язычниками».
- source_word: ἀποστέλλω
  choice: Я посылаю
  rationale: Настоящее время уместно передать русским настоящим «посылаю», выражающим совершаемое поручение без излишнего уточнения длительности.
theological_decisions:
- issue: Кого обозначает «народ» в противопоставлении язычникам
  choice: В основном тексте сохранено «народ», контекстуально означающее иудейский народ.
  alternative: «иудейский народ» или «народ Израиля»
  rationale: Контраст ясно указывает на иудеев и язычников, но в греческом стоит просто λαός. Буквальная формулировка сохраняет исходную сдержанность; пояснение дано в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и dignified библейский регистр. Заглавная «Я» отражает речь воскресшего Иисуса. Синтаксис сохранён как продолжение более длинного высказывания, поэтому начало дано со строчной буквы.
