source:
  edition: SBLGNT
  text: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν, τοῦ ⸀ἐπιστρέψαι ἀπὸ σκότους εἰς φῶς καὶ τῆς ἐξουσίας τοῦ Σατανᾶ ἐπὶ τὸν θεόν, τοῦ λαβεῖν αὐτοὺς ἄφεσιν ἁμαρτιῶν καὶ κλῆρον ἐν τοῖς ἡγιασμένοις πίστει τῇ εἰς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/018.yaml
  text: to open their eyes[a], so that they may turn from darkness to light and from the authority of Satan to God[b], that they may receive forgiveness of sins and an inheritance among those who have been sanctified by faith in me.
translation:
  language: ru
  text: открыть им глаза, чтобы они обратились от тьмы к свету и от власти Сатаны[a] к Богу, чтобы они получили прощение грехов и наследие среди освящённых[b] верой в Меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «господства Сатаны». Греческое слово может обозначать власть, полномочие или сферу владычества.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «тех, кто был сделан святым».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν
  choice: открыть им глаза
  rationale: Сохраняет конкретный образ открытия глаз, который в контексте указывает на духовное прозрение, но не сводится к пояснительному пересказу.
- source_word: τοῦ ἐπιστρέψαι
  choice: чтобы они обратились
  rationale: Передаёт целевое значение инфинитива и естественную для русского языка идею поворота или обращения, не вводя более узкого конфессионального термина.
- source_word: ἀπὸ σκότους εἰς φῶς
  choice: от тьмы к свету
  rationale: Точно сохраняет ясное и богословски ёмкое противопоставление исходного текста.
- source_word: τῆς ἐξουσίας τοῦ Σατανᾶ
  choice: от власти Сатаны
  rationale: ἐξουσία здесь может обозначать власть, господство или сферу владычества; «власть» наиболее прямо и естественно передаёт основной смысл.
- source_word: ἐπὶ τὸν θεόν
  choice: к Богу
  rationale: В сочетании с языком обращения выражает переход к Богу и сохраняет параллель «от… к…».
- source_word: τοῦ λαβεῖν αὐτοὺς
  choice: чтобы получили
  rationale: Передаёт вторую цель поручения; глагол «получили» сохраняет представление о даруемом благе.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: прощение грехов
  rationale: Общепонятное и точное современное соответствие устойчивому новозаветному выражению.
- source_word: κλῆρον
  choice: наследие
  rationale: В данном контексте слово обозначает дарованную долю или наследие в Божьем народе; «наследие» сохраняет заветные и эсхатологические оттенки.
- source_word: ἐν τοῖς ἡγιασμένοις
  choice: среди освящённых
  rationale: Сохраняет значение совершившегося освящения и продолжающегося состояния, выраженное перфектным пассивным причастием.
- source_word: πίστει τῇ εἰς ἐμέ
  choice: верой в Меня
  rationale: Дательный падеж передаёт средство, а конструкция εἰς ἐμέ прямо указывает на объект веры — говорящего Иисуса.
theological_decisions:
- issue: Связь выражения πίστει τῇ εἰς ἐμέ с освящением
  choice: освящённых верой в Меня
  alternative: получили верой в Меня прощение грехов и наследие среди освящённых
  rationale: Ближайшая и наиболее естественная синтаксическая связь — с причастием «освящённых». Порядок слов сохранён, однако альтернативное присоединение грамматически обсуждаемо и не должно превращаться в отдельное доктринальное утверждение.
- issue: Передача πίστις
  choice: вера
  alternative: доверие
  rationale: «Вера в Меня» точно и естественно передаёт личную направленность πίστις εἰς ἐμέ, не относя этот оборот к спорной конструкции πίστις Χριστοῦ.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены образ «открыть глаза», параллель «от тьмы к свету… к Богу» и последовательность целей. Заглавная буква в «Меня» уместна как традиционное русское обозначение прямой речи Христа; «Сатана» оформлено как имя собственное.
