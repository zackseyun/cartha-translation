id: ACT.28.6
reference: Acts 28:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἱ δὲ προσεδόκων αὐτὸν μέλλειν πίμπρασθαι ἢ καταπίπτειν ἄφνω νεκρόν. ἐπὶ πολὺ δὲ αὐτῶν προσδοκώντων καὶ θεωρούντων μηδὲν ἄτοπον εἰς αὐτὸν γινόμενον, ⸀μεταβαλόμενοι ἔλεγον ⸂αὐτὸν εἶναι θεόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/006.yaml
  text: But they were expecting him to swell up or suddenly fall down dead. But after they had waited a long time and saw that nothing unusual was happening to him[a], they changed their minds and began saying that he was a god.
translation:
  language: ru
  text: Они ожидали, что он вот-вот распухнет или внезапно упадёт замертво. Но, прождав долго и увидев, что с ним не происходит ничего необычного[a], они переменили своё мнение и стали говорить, что он — бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ничего ненормального» или «ничего дурного».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεδόκων
  choice: ожидали
  rationale: Имперфект передаёт продолжительное ожидание; русское «ожидали» естественно выражает этот смысл.
- source_word: μέλλειν
  choice: вот-вот
  rationale: Передаёт ожидаемую близость действия, выраженную μέλλω с инфинитивами.
- source_word: πίμπρασθαι
  choice: распухнет
  rationale: В контексте укуса змеи глагол обозначает телесное опухание, а не буквальное горение.
- source_word: καταπίπτειν ἄφνω νεκρόν
  choice: внезапно упадёт замертво
  rationale: Сохраняет внезапность, падение и смертельный исход без стилистической тяжеловесности.
- source_word: ἐπὶ πολὺ
  choice: прождав долго
  rationale: Естественно передаёт длительность ожидания в составе временной конструкции с причастиями.
- source_word: θεωρούντων
  choice: увидев
  rationale: В данном контексте внимательное наблюдение приводит к констатации того, что с Павлом ничего не случилось.
- source_word: μηδὲν ἄτοπον
  choice: ничего необычного
  rationale: Сохраняет широкое значение ἄτοπος — необычное, ненормальное, неладное — и не сужает его до явно вредного последствия.
- source_word: μεταβαλόμενοι
  choice: переменили своё мнение
  rationale: Передаёт резкую смену вывода или оценки; в современном литературном русском звучит ясно и достойно.
- source_word: ἔλεγον
  choice: стали говорить
  rationale: Передаёт начинательное и продолженное значение имперфекта после перемены мнения.
- source_word: θεόν
  choice: бог
  rationale: В предикативной конструкции без артикля и в языческом контексте обозначает одного из богов; русская форма «он — бог» естественно имеет такое неопределённое значение.
theological_decisions:
- issue: Передача αὐτὸν εἶναι θεόν без привнесения утверждения о божественном статусе Павла в христианском смысле
  choice: что он — бог
  alternative: что он — Бог; что он божественен
  rationale: Речь идёт об ошибочном выводе жителей острова в языческом, политеистическом контексте. Строчная буква и предикативная конструкция ясно указывают на «одного из богов», не отождествляя Павла с единым Богом.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. «Вот-вот распухнет» передаёт ожидаемую немедленность реакции, а «упадёт замертво» сохраняет выразительность исходного описания. Маркер сноски поставлен непосредственно после выражения, к которому относится.
