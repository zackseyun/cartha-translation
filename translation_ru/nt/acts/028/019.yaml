  text: ἀντιλεγόντων δὲ τῶν Ἰουδαίων ἠναγκάσθην ἐπικαλέσασθαι Καίσαρα, οὐχ ὡς τοῦ ἔθνους μου ἔχων τι ⸀κατηγορεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/019.yaml
  text: But because the Jews objected[b][a], I was compelled to appeal to Caesar—not because I had anything to accuse my nation of.
translation:
  language: ru
  text: Но поскольку иудеи возражали[a][b], мне пришлось апеллировать к кесарю — не потому, что у меня были основания обвинять свой народ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда иудеи противились мне»; или: «поскольку иудеи выступали против меня».'
    reason: lexical_alternative
  - marker: b
    text: В данном судебном контексте «иудеи» относится к иудейским противникам и обвинителям Павла, а не ко всему еврейскому народу.
    reason: cultural_note
lexical_decisions:
- source_word: ἀντιλεγόντων
  choice: поскольку иудеи возражали
  rationale: Генитив абсолютный обозначает обстоятельство, побудившее Павла к действию; «возражали» естественно звучит по-русски и соответствует юридическому контексту, не сводя смысл к простому несогласию.
- source_word: δὲ
  choice: Но
  rationale: Передаёт умеренное противопоставление предыдущему высказыванию.
- source_word: τῶν Ἰουδαίων
  choice: иудеи
  rationale: Сохраняет прямое обозначение исходного текста без добавления отсутствующего уточнения «руководители»; конкретный круг лиц определяется контекстом.
- source_word: ἠναγκάσθην
  choice: я был вынужден
  rationale: Передаёт пассивную форму и внешнее принуждение в естественном современном русском языке.
- source_word: ἐπικαλέσασθαι Καίσαρα
  choice: обратиться к кесарю
  rationale: В данном юридическом контексте означает воспользоваться правом обращения к императору; «обратиться к кесарю» ясно и узнаваемо передаёт формулу апелляции.
- source_word: οὐχ ὡς
  choice: не потому, что
  rationale: Естественно вводит разъяснение и отрицание предполагаемого мотива Павла.
- source_word: τοῦ ἔθνους μου
  choice: свой народ
  rationale: В контексте ἔθνος обозначает собственную этническую и национальную общность Павла; «свой народ» по-русски естественнее, чем «свою нацию», и сохраняет корпоративный смысл.
- source_word: ἔχων τι κατηγορεῖν
  choice: хотел в чём-либо обвинить
  rationale: Конструкция буквально говорит о наличии чего-либо для обвинения; в сочетании с οὐχ ὡς она выражает отсутствие обвинительного намерения или основания. Русская формулировка ясно передаёт судебный оттенок, хотя оттенок «имел что-либо против» отмечен в сноске.
theological_decisions:
- issue: Объём обозначения «иудеи» в потенциально чувствительном этнорелигиозном выражении
  choice: Сохранить в основном тексте «иудеи» как прямую передачу τῶν Ἰουδαίων.
  alternative: иудейские вожди; жители Иудеи
  rationale: Греческий текст не уточняет общественное положение этих лиц. В контексте речь идёт об иудейских обвинителях и противниках Павла, а не обо всём еврейском народе; это уточняется в сноске без сужения основного текста.
- issue: Смысл отрицательной конструкции οὐχ ὡς ... ἔχων τι κατηγορεῖν
  choice: 'Передать как отрицание обвинительного намерения: «не потому, что хотел в чём-либо обвинить».'
  alternative: «не то чтобы у меня было в чём обвинить»; «не имея никакого обвинения против»
  rationale: Формулировка сохраняет пояснение Павла о том, что обращение к кесарю не было направлено против собственного народа, не превращая его слова в более широкое богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно официальным оттенком, соответствующим судебно-правовому контексту. «Кесарь» сохранено как традиционное и понятное обозначение римского императора. Маркеры сносок размещены непосредственно после выражения, которое они поясняют.
