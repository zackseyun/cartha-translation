source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/027.yaml
  text: For the heart of this people has become dull[a], and with their ears they heard heavily, and they closed their eyes; otherwise they might see with their eyes and hear with their ears and understand with their heart and turn back[b], and I would heal them.
translation:
  language: ru
  text: Ведь сердце этого народа огрубело, ушами они с трудом слышали и глаза свои закрыли; иначе[a] они могли бы увидеть глазами, услышать ушами, понять сердцем, обратиться[b], и Я исцелил бы их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как бы они не увидели глазами, не услышали ушами, не поняли сердцем, не обратились, и Я не исцелил их». Греческий союз в этой цитате из Исаии может иметь более сильный оттенок: «чтобы не» или «как бы не».'
    reason: alternative_reading
  - marker: b
    text: «Обратиться» можно также перевести как «повернуться» или «вернуться», а в данном контексте — как «покаяться».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: огрубело
  rationale: Глагол буквально передаёт утолщение или ожирение, а метафорически — утрату восприимчивости. «Огрубело» сохраняет образ и естественно звучит применительно к сердцу.
- source_word: καρδία
  choice: сердце
  rationale: Сохраняет библейское антропологическое понятие и его связь с последующим выражением «понять сердцем».
- source_word: βαρέως ἤκουσαν
  choice: с трудом слышали
  rationale: Передаёт тяжесть и притуплённость слуха естественным современным русским языком, не превращая выражение в исключительно физиологическое описание.
- source_word: ἐκάμμυσαν
  choice: закрыли
  rationale: Прямо и ясно передаёт намеренное закрытие глаз.
- source_word: μήποτε
  choice: иначе
  rationale: В основном тексте естественно выражает возможный результат и сохраняет напряжение между человеческой ответственностью и судебным ожесточением; более сильный оттенок цели или предотвращения отмечен в сноске.
- source_word: συνῶσιν
  choice: понять
  rationale: Обычное и точное соответствие, сохраняющее связь понимания с сердцем.
- source_word: ἐπιστρέψωσιν
  choice: обратиться
  rationale: Сохраняет образ поворота или возвращения и допускает контекстуальный смысл обращения к Богу, не сужая его до одного термина «покаяться».
- source_word: ἰάσομαι
  choice: Я исцелил бы их
  rationale: В конструкции после μήποτε будущее изъявительное естественно передаётся как следствие условно возможного обращения.
theological_decisions:
- issue: Божественное намерение в цитате из Исаии
  choice: Передать μήποτε словом «иначе», а более сильное целевое прочтение указать в сноске.
  alternative: «Чтобы они не увидели… не обратились и Я не исцелил их».
  rationale: Так сохраняется подлинное напряжение между Божьим судом и ответственностью людей без однозначного разрешения спорного вопроса в основном тексте.
- issue: Смысл ἐπιστρέψωσιν
  choice: обратиться
  alternative: повернуться; вернуться; покаяться
  rationale: «Обратиться» сохраняет направительный образ и духовный смысл контекста, не вводя более узкую богословскую формулировку.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. Синтаксический параллелизм оригинала сохранён, но неестественное буквальное выражение «тяжело услышали» передано как «с трудом слышали».
