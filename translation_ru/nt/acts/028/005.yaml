  text: Стряхнув животное в огонь, он не пострадал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὲν οὖν
  choice: Он же
  rationale: Артикль употреблён местоименно и указывает на Павла; сочетание μέν οὖν мягко продолжает повествование. «Он же» естественно передаёт этот переход, не перегружая текст.
- source_word: ἀποτινάξας
  choice: стряхнул
  rationale: 'Аористное причастие обозначает действие, предшествующее основному. В русском однородные сказуемые естественно и ясно передают последовательность: сначала Павел стряхнул животное, затем не испытал вреда.'
- source_word: τὸ θηρίον
  choice: животное
  rationale: θηρίον — общее обозначение животного, нередко дикого. Из предыдущего стиха ясно, что речь о змее, однако здесь источник не повторяет более конкретного слова; «животное» сохраняет эту лексическую широту.
- source_word: εἰς τὸ πῦρ
  choice: в огонь
  rationale: Прямо передаёт направительное значение εἰς с винительным падежом.
- source_word: ἔπαθεν οὐδὲν κακόν
  choice: не пострадал
  rationale: Русское «не пострадал» кратко и естественно выражает отсутствие какого-либо вреда или дурного последствия, подразумеваемое сочетанием πάσχω и οὐδὲν κακόν.
