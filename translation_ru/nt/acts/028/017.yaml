source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς συγκαλέσασθαι ⸀αὐτὸν τοὺς ὄντας τῶν Ἰουδαίων πρώτους· συνελθόντων δὲ αὐτῶν ἔλεγεν πρὸς αὐτούς· ⸂Ἐγώ, ἄνδρες ἀδελφοί⸃, οὐδὲν ἐναντίον ποιήσας τῷ λαῷ ἢ τοῖς ἔθεσι τοῖς πατρῴοις δέσμιος ἐξ Ἱεροσολύμων παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/017.yaml
  text: It happened that after three days he called together the leading men of the Jews[a]. And when they had come together, he said to them, “I, brothers, though I had done nothing against the people or the customs of our fathers[d][c][b], was delivered as a prisoner from Jerusalem into the hands of the Romans.”
translation:
  language: ru
  text: 'Через три дня Павел созвал видных иудеев[a]. Когда они собрались, он сказал им: «Братья[b], хотя я ничего не сделал против народа или обычаев предков[c], я был передан из Иерусалима в руки римлян[d] как узник».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «руководителей иудеев»; «самых видных среди иудеев».'
    reason: Лексическая альтернатива для τοὺς ὄντας τῶν Ἰουδαίων πρώτους.
  - marker: b
    text: Так Павел обращается к созванным им видным мужчинам иудейской общины; греческое слово ἀδελφοί буквально означает «братья».
    reason: Культурно-языковое пояснение формы обращения.
  - marker: c
    text: 'Или: «обычаев наших отцов»; «унаследованных обычаев».'
    reason: Лексическая альтернатива для τοῖς ἔθεσι τοῖς πατρῴοις.
  - marker: d
    text: 'Буквальнее: «был передан… в руки римлян».'
    reason: Сохранённая в основном тексте, но поясняемая образная и юридическая формулировка греческого текста.
lexical_decisions:
- source_word: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς
  choice: Через три дня
  rationale: Естественная русская передача лукианского повествовательного перехода и временного оборота; отдельное «случилось» здесь было бы тяжеловесным и не добавляло бы содержания.
- source_word: συγκαλέσασθαι αὐτὸν
  choice: Павел созвал
  rationale: Инфинитивная конструкция естественно передана личной формой; имя восстанавливает явно подразумеваемого из контекста деятеля и предотвращает неясность русского местоимения.
- source_word: τοὺς ὄντας τῶν Ἰουδαίων πρώτους
  choice: видных представителей иудеев
  rationale: πρώτους обозначает первенство по положению и влиянию. «Представители» естественно описывает созванных видных членов иудейской общины, не приписывая им непременно формальной должности.
- source_word: συνελθόντων δὲ αὐτῶν
  choice: Когда они собрались
  rationale: Генитив абсолютный естественно преобразован во временное придаточное.
- source_word: Ἐγώ, ἄνδρες ἀδελφοί
  choice: Братья
  rationale: Русское обращение «братья» естественно передаёт солидарность ἀδελφοί; отдельное ἄνδρες в таком сочетании не требует буквального «мужи», а эмфатическое ἐγώ выражено последующим «я».
- source_word: οὐδὲν ἐναντίον ποιήσας
  choice: хотя я ничего не сделал против
  rationale: 'Причастие понято уступительно: Павел подчёркивает контраст между своей невиновностью и передачей под стражу.'
- source_word: τῷ λαῷ
  choice: нашего народа
  rationale: В контексте обращения к иудейским руководителям речь идёт об общем для говорящего и слушателей народе; «нашего» естественно выражает подразумеваемую общность, хотя в греческом притяжательного местоимения нет.
- source_word: τοῖς ἔθεσι τοῖς πατρῴοις
  choice: обычаев предков
  rationale: Современная и точная передача унаследованных от предков установлений без архаического «отеческих обычаев».
- source_word: δέσμιος
  choice: узником
  rationale: Творительный предикативно передаёт статус Павла при передаче властям.
- source_word: ἐξ Ἱεροσολύμων παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων
  choice: меня узником передали из Иерусалима в руки римлян
  rationale: Сохранены пассивно-правовой смысл παραδίδωμι, исходный пункт и образное «в руки», обозначающее переход под власть римлян.
theological_decisions:
- issue: Передача ἀδελφοί в прямом обращении
  choice: Братья
  alternative: Братья и сёстры; мужи братья
  rationale: Здесь Павел обращается к созванным видным мужчинам иудейской общины. «Братья» сохраняет мужскую форму и выражает общность, не расширяя адресатов и не прибегая к архаизму.
- issue: Смысл οὐδὲν ἐναντίον ποιήσας
  choice: уступительное «хотя я ничего не сделал против»
  alternative: нейтральное «не сделав ничего против»
  rationale: Контекст подчёркивает напряжение между заявленной невиновностью Павла и тем, что его передали римлянам; уступительная связь выражает это без богословского дополнения.
- issue: Референт τῷ λαῷ
  choice: нашего народа
  alternative: народа
  rationale: Речь идёт об иудейском народе, к которому принадлежат и Павел, и его слушатели. Притяжательное местоимение делает эту подразумеваемую общность ясной, не меняя референта.
translation_notes:
  register: Современный литературный русский, ясный и достойный, без церковнославянизмов. Синтаксис упрощён там, где буквальное воспроизведение греческой конструкции звучало бы неестественно; юридико-повествовательный тон и контраст между невиновностью Павла и его передачей римлянам сохранены.
