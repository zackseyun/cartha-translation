  text: Ὅτε δὲ ⸀εἰσήλθομεν εἰς Ῥώμην, ⸂ἐπετράπη τῷ Παύλῳ⸃ μένειν καθ’ ἑαυτὸν σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/016.yaml
  text: When we entered Rome[a], Paul was permitted to stay by himself with the soldier guarding him.
translation:
  language: ru
  text: Когда мы вошли в Рим, Павлу разрешили жить отдельно, с воином, который его охранял.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: Когда
  rationale: Ὅτε вводит придаточное времени; δέ служит мягкой связкой и в естественном современном русском не требует отдельной передачи.
- source_word: εἰσήλθομεν εἰς Ῥώμην
  choice: мы вошли в Рим
  rationale: Передаёт движение внутрь, выраженное εἰσέρχομαι с εἰς и винительным падежом, и сохраняет форму первого лица множественного числа.
- source_word: ἐπετράπη τῷ Παύλῳ
  choice: Павлу разрешили
  rationale: Естественная русская неопределённо-личная конструкция точно передаёт безлично-пассивное выражение предоставленного Павлу разрешения.
- source_word: μένειν
  choice: жить
  rationale: В контексте размещения Павла под стражей глагол обозначает проживание или пребывание; «жить» ясно и естественно передаёт смысл, не предполагая освобождения.
- source_word: καθ’ ἑαυτόν
  choice: отдельно
  rationale: Означает пребывание отдельно от других заключённых, а не полное одиночество, поскольку рядом с Павлом находился охранявший его воин.
- source_word: σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ
  choice: вместе с охранявшим его воином
  rationale: σύν выражает совместное пребывание, а определённый артикль указывает на конкретного назначенного в данной ситуации воина; причастная конструкция естественно воспроизводит φυλάσσοντι.
