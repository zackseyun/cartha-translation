  text: διὰ ταύτην οὖν τὴν αἰτίαν παρεκάλεσα ὑμᾶς ἰδεῖν καὶ προσλαλῆσαι, ἕνεκεν γὰρ τῆς ἐλπίδος τοῦ Ἰσραὴλ τὴν ἅλυσιν ταύτην περίκειμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/020.yaml
  text: For this reason[a], therefore, I asked to see you and to speak with you, for it is because of the hope of Israel that I am wearing this chain.
translation:
  language: ru
  text: Именно поэтому я попросил вас встретиться со мной и поговорить со мной, ведь эту цепь я ношу из-за надежды Израиля[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «надежда, обещанная Израилю». Это выражение может относиться к надежде, связанной с Божьими обещаниями Израилю, включая надежду воскресения, которую возвещал Павел.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ ταύτην οὖν τὴν αἰτίαν
  choice: Поэтому я и
  rationale: «Поэтому» естественно передаёт как причинную связь, так и вывод, выраженные сочетанием διὰ…αἰτίαν и οὖν; частица «и» подчёркивает логическое следствие без тяжеловесного повтора «по этой причине поэтому».
- source_word: παρεκάλεσα ὑμᾶς ἰδεῖν καὶ προσλαλῆσαι
  choice: попросил вас прийти, чтобы увидеться и поговорить с вами
  rationale: В контексте Павел вызвал к себе иудейских руководителей, поэтому добавление «прийти» делает подразумеваемую просьбу ясной по-русски. «Увидеться и поговорить с вами» передаёт личную встречу и взаимное общение естественнее буквального «увидеть и говорить».
- source_word: ἕνεκεν γὰρ
  choice: ведь… из-за
  rationale: «Ведь» передаёт пояснительное γάρ, а «из-за» — причинное ἕνεκεν, сохраняя явную связь надежды с заключением Павла.
- source_word: τῆς ἐλπίδος τοῦ Ἰσραήλ
  choice: надежды Израиля
  rationale: Компактное родительное сочетание сохраняет широту греческого выражения и не сводит его прямо ни только к воскресению, ни только к мессианским ожиданиям.
- source_word: τὴν ἅλυσιν ταύτην περίκειμαι
  choice: эту цепь я ношу
  rationale: Сохраняется единственное число ἅλυσιν и конкретный образ глагола περίκειμαι — иметь что-либо на себе или вокруг себя. Русская фраза звучит выразительно и не заменяет образ более отвлечённым «нахожусь в заключении».
theological_decisions:
- issue: Смысл выражения «надежда Израиля»
  choice: надежда Израиля
  alternative: надежда, обещанная Израилю; надежда Израиля на воскресение; мессианская надежда Израиля
  rationale: В контексте Деяний выражение может охватывать данные Израилю обетования, мессианское ожидание и надежду воскресения, исполнение которых Павел возвещает в Иисусе. Перевод не сужает многозначное выражение до одного из этих аспектов.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Синтаксис слегка разгружен ради естественности устной речи Павла; образ цепи и богословски ёмкое выражение «надежда Израиля» сохранены.
