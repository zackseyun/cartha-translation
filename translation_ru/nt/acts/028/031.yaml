  yaml_path: translation/nt/acts/028/031.yaml
  text: proclaiming the kingdom of God and teaching the things concerning the Lord Jesus the Messiah with all boldness[a], unhindered.
translation:
  language: ru
  text: возвещая Царство Божье и наставляя о том, что касается Господа Иисуса Мессии[a], со всей смелостью и беспрепятственно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисуса Христа». Греческое Χριστός может употребляться как титул «Мессия» или, в некоторых контекстах, как обозначение, близкое к имени: «Христос».'
    reason: alternative_reading
lexical_decisions:
- source_word: κηρύσσων
  choice: возвещая
  rationale: Причастие настоящего времени продолжает итоговое описание постоянной деятельности Павла; «возвещая» передаёт публичное провозглашение и не сужает смысл до формальной проповеди.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: Царство Божье
  rationale: Устоявшееся и естественное библейское выражение, сохраняющее как царскую власть Бога, так и относящуюся к ней реальность.
- source_word: διδάσκων τὰ περὶ
  choice: уча о
  rationale: По-русски краткая конструкция естественнее буквального «уча тому, что касается» и точно передаёт содержание наставления.
- source_word: τοῦ κυρίου Ἰησοῦ Χριστοῦ
  choice: о Господе Иисусе Мессии
  rationale: «Господь» сохраняет христологический титул κύριος, а «Мессия» передаёт смысл Χριστός как титула, не превращая его без пояснения в имя.
- source_word: μετὰ πάσης παρρησίας
  choice: со всей смелостью
  rationale: Передаёт полноту открытой, бесстрашной речи; «всей» отражает усилительное πάσης.
- source_word: ἀκωλύτως
  choice: беспрепятственно
  rationale: 'Наречие сохраняет лаконичное и выразительное последнее слово книги: возвещение не было остановлено.'
theological_decisions:
- issue: Передача Χριστός в сочетании Ἰησοῦ Χριστοῦ
  choice: Иисусе Мессии
  alternative: Иисусе Христе
  rationale: В данном титульном сочетании перевод «Мессия» раскрывает значение греческого Χριστός; привычная передача «Христос» остаётся допустимой и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Два деепричастия исходника переданы параллельными формами «возвещая» и «уча»; заключительное «беспрепятственно» сохранено в сильной финальной позиции.
