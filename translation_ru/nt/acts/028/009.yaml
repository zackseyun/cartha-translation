  yaml_path: translation/nt/acts/028/009.yaml
  text: And after this happened[a], the rest of those on the island who had diseases also came and were healed.
translation:
  language: ru
  text: После этого остальные люди на острове, страдавшие от болезней[a], также приходили и исцелялись.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «имевшие болезни»; возможно также: «больные».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτου δὲ γενομένου
  choice: После этого
  rationale: 'Генитив абсолютный с δέ обозначает переход и временную последовательность; по-русски естественно передать кратко: «После этого».'
- source_word: οἱ λοιποὶ οἱ ἐν τῇ νήσῳ
  choice: остальные жители острова
  rationale: Сочетание обозначает остальных людей, находившихся на острове. «Жители острова» естественно в данном контексте, хотя буквально возможно «остальные из находившихся на острове».
- source_word: ἔχοντες ἀσθενείας
  choice: страдавшие от болезней
  rationale: Передаёт буквальный смысл «имевшие болезни» современным и естественным русским языком, сохраняя множественное число ἀσθενείας.
- source_word: προσήρχοντο
  choice: приходили
  rationale: 'Имперфект выражает повторяющееся действие: больные один за другим приходили. Направление к Павлу понятно из контекста и не добавлено явно.'
- source_word: ἐθεραπεύοντο
  choice: исцелялись
  rationale: Сохраняет пассивное значение и длительно-повторительный аспект имперфекта, согласованный с «приходили».
- source_word: καὶ ... καὶ
  choice: и ... и
  rationale: Первое καί показывает, что вслед за исцелением отца Публия действие распространилось и на остальных; русская конструкция естественно передаёт это словом «и».
