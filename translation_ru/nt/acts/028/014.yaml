  text: οὗ εὑρόντες ἀδελφοὺς παρεκλήθημεν ⸀παρ’ αὐτοῖς ἐπιμεῖναι ἡμέρας ἑπτά· καὶ οὕτως εἰς τὴν Ῥώμην ἤλθαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/014.yaml
  text: There we found brothers, and we were invited to stay with them seven days. And so we came to Rome.
translation:
  language: ru
  text: Там мы нашли братьев[a], и нас попросили остаться у них на семь дней. И так мы прибыли в Рим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братьев и сестёр»; по-гречески буквально «братьев», но здесь, вероятно, имеются в виду верующие в целом.'
    reason: Лексическая альтернатива и пояснение вероятного контекстуального охвата мужской формы.
lexical_decisions:
- source_word: οὗ
  choice: Там
  rationale: Местное относительное наречие отсылает к только что упомянутым Путеолам; в современном русском естественно начать новое предложение словом «Там».
- source_word: εὑρόντες
  choice: мы нашли
  rationale: Аористное причастие с тем же субъектом, что и сказуемое, естественно передано личной формой с сохранением последовательности действий.
- source_word: ἀδελφοὺς
  choice: братьев
  rationale: Сохранена мужская форма исходного слова; в данном контексте оно обозначает единоверцев, вероятно всю местную общину.
- source_word: παρεκλήθημεν
  choice: нас попросили
  rationale: Пассив παρακαλέω здесь выражает обращённую к путешественникам настоятельную просьбу; «попросили» естественно для контекста гостеприимства и не усиливает значение до принуждения.
- source_word: παρ’ αὐτοῖς ἐπιμεῖναι
  choice: погостить у них
  rationale: Сочетание обозначает временное пребывание у местных верующих; «погостить у них» естественно передаёт и проживание, и контекст гостеприимства.
- source_word: ἡμέρας ἑπτά
  choice: семь дней
  rationale: Винительный продолжительности времени передан обычной русской конструкцией.
- source_word: καὶ οὕτως
  choice: Так
  rationale: Передаёт итоговый и повествовательный переход «и таким образом» без тяжеловесности.
- source_word: εἰς τὴν Ῥώμην ἤλθαμεν
  choice: мы пришли в Рим
  rationale: ἔρχομαι с εἰς указывает на достижение пункта назначения; «пришли в Рим» сохраняет перспективу рассказчика и естественно звучит по-русски.
theological_decisions:
- issue: Кого обозначает ἀδελφοὺς
  choice: местных братьев по вере, то есть христиан
  alternative: родных братьев или соплеменников-иудеев вообще
  rationale: В повествовательном контексте Деяний и с учётом оказанного гостеприимства слово наиболее вероятно относится к местным верующим. Основной текст сохраняет буквальное «братьев», а примечание раскрывает контекстуальный охват, не подменяя форму оригинала.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным ритмом. «Погостить» употреблено в нейтральном значении временного пребывания у принимающей стороны; богословская неоднозначность слова «братья» сохранена и пояснена в сноске.
