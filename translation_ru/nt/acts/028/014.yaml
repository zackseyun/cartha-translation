  rationale: 'Внесены лишь стилистически и семантически безопасные уточнения: «остаться у них на семь дней» нейтрально передаёт просьбу задержаться у местных верующих, а «И так мы прибыли в Рим» сохраняет καὶ οὕτως и естественно обозначает прибытие к месту назначения. Сноска сохранена с более естественной русской формулировкой.'
