base_translation:
  language: en
  yaml_path: translation/nt/acts/028/007.yaml
  text: In the area around that place there were lands belonging to the chief man of the island[a], named Publius[c][b], who welcomed us and hosted us courteously for three days.
translation:
  language: ru
  text: В окрестностях того места были владения[a], принадлежавшие главному человеку острова[b] по имени Публий. Он принял нас и оказал нам радушное гостеприимство в течение трёх дней.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «земельные участки». Греческое слово может обозначать земли или поместья в этой местности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «первому человеку острова». Греческое выражение, вероятно, обозначает ведущего или самого высокопоставленного человека на острове и, возможно, употреблено как титул.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «Он радушно принял нас у себя на три дня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον
  choice: В окрестностях того места
  rationale: Передаёт пространственное значение выражения περὶ τὸν τόπον ἐκεῖνον естественным современным русским оборотом; δέ здесь служит мягким повествовательным переходом и не требует отдельного слова.
- source_word: ὑπῆρχεν χωρία
  choice: были владения
  rationale: χωρία обозначает земельные участки или земельную собственность во множественном числе; «владения» сохраняет это значение, не уточняя без основания вид угодий.
- source_word: τῷ πρώτῳ τῆς νήσου
  choice: первому лицу острова
  rationale: πρῶτος здесь указывает на первенство по положению и, возможно, является титулом. «Первое лицо острова» естественно передаёт высокий статус, не превращая выражение в более конкретную должность.
- source_word: ὀνόματι Ποπλίῳ
  choice: по имени Публий
  rationale: Обычная русская передача конструкции ὀνόματι с дательным падежом; «Публий» — традиционная форма латинского имени.
- source_word: ἀναδεξάμενος ἡμᾶς
  choice: Он принял нас
  rationale: Передаёт принятие гостей; выделение причастного оборота в отдельное предложение делает длинную греческую фразу ясной по-русски.
- source_word: τρεῖς ἡμέρας
  choice: три дня
  rationale: Винительный падеж обозначает продолжительность времени.
- source_word: φιλοφρόνως ἐξένισεν
  choice: радушно оказывал нам гостеприимство
  rationale: Сочетание передаёт и само гостеприимное содержание ξενίζω, и дружелюбно-благожелательный оттенок φιλοφρόνως.
theological_decisions:
- issue: Статус Публия в выражении τῷ πρώτῳ τῆς νήσου
  choice: первому лицу острова
  alternative: главному человеку острова; правителю острова
  rationale: Исходный текст ясно указывает на первенствующее положение, но не устанавливает однозначно конкретную административную должность. Перевод сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Длинное греческое предложение разделено на два без изменения смысловых связей. Тон достоинственный и общепонятный; административный статус Публия намеренно не конкретизирован сверх исходного текста.
