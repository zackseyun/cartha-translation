  text: И одних убеждало то, что им говорили, а другие не верили.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείθοντο
  choice: убеждались
  rationale: Имперфект передаёт разворачивавшийся отклик слушателей; «убеждались» сохраняет смысл принятия доводов, не отождествляя его автоматически с верой в полном богословском смысле.
- source_word: τοῖς λεγομένοις
  choice: сказанным
  rationale: Субстантивированное причастие обозначает содержание произносимой речи. Русское «сказанным» естественно сочетается с «убеждались»; длительность уже выражена формой основного глагола и контекстом.
- source_word: ἠπίστουν
  choice: не верили
  rationale: Передаёт ἀπιστέω без добавления более сильного волевого оттенка «отказывались верить», которого сама форма однозначно не требует.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: одни ... а другие
  rationale: Естественная русская коррелятивная конструкция, ясно передающая разделение группы и противопоставление.
- source_word: καὶ
  choice: И
  rationale: Сохраняет простой повествовательный переход и связь с предыдущим стихом.
theological_decisions:
- issue: Характер противопоставленных откликов
  choice: Стих сообщает, что одни принимали убедительность сказанного, тогда как другие не верили.
  alternative: Истолковать первых как непременно обладающих спасающей верой, а вторых — как сознательно и окончательно отвергших истину.
  rationale: Греческий текст описывает непосредственные реакции на проповедь Павла, но в самом стихе не определяет окончательное духовное состояние каждого слушателя.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная и достойная повествовательная формулировка. Симметрия «одни ... а другие» сохраняет структуру оригинала.
