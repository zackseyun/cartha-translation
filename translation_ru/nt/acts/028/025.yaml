base_translation:
  language: en
  yaml_path: translation/nt/acts/028/025.yaml
  text: 'And since they were disagreeing with one another, they were leaving after Paul had said one final word: “The Holy Spirit spoke rightly through Isaiah the prophet to your fathers'
translation:
  language: ru
  text: 'Не соглашаясь друг с другом, они стали расходиться после того, как Павел высказал одно заключительное замечание[a]: «Святой Дух верно сказал через пророка Исаию вашим отцам[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «одно слово»; здесь имеется в виду заключительное высказывание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вашим предкам». Речь идёт о праотцах Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους
  choice: Не соглашаясь друг с другом
  rationale: Передаёт состояние взаимного несогласия естественной для современного русского языка деепричастной конструкцией, не превращая её в явно причинное утверждение.
- source_word: ἀπελύοντο
  choice: стали расходиться
  rationale: Несовершенный вид глагола описывает начавшийся и продолжавшийся уход собравшихся; «расходиться» уместно для завершения встречи.
- source_word: εἰπόντος τοῦ Παύλου
  choice: после того, как Павел сказал
  rationale: Родительный абсолют естественно передан временным придаточным; «сказал» точно соответствует εἰπόντος.
- source_word: ῥῆμα ἓν
  choice: одно последнее слово
  rationale: Буквально выражение означает «одно слово», но здесь вводит заключительное высказывание Павла; слово «последнее» ясно передаёт эту дискурсивную функцию.
- source_word: Καλῶς
  choice: Верно
  rationale: Наречие оценивает сказанное Святым Духом как правильное; «верно» выражает это точнее и естественнее, чем буквальное «хорошо».
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Святой Дух
  rationale: Общепринятое русское соответствие определённому греческому выражению.
- source_word: ἐλάλησεν
  choice: сказал
  rationale: В русском оборот «сказал через пророка» естественно выражает пророческую речь и её посредничество.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: через пророка Исаию
  rationale: Предлог διά с родительным падежом обозначает посредничество; русский порядок слов звучит естественно и сохраняет титул Исаии.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: вашим отцам
  rationale: Сохраняет конкретное слово πατέρας и обращение второго лица; по контексту речь идёт о праотцах Израиля.
theological_decisions:
- issue: Участие Святого Духа в пророческой речи
  choice: Святой Дух сказал через пророка Исаию
  alternative: через Исаию было сказано
  rationale: Активная конструкция сохраняет прямое приписывание речи Святому Духу и одновременно обозначает Исаию как посредника, не ослабляя утверждение исходного текста.
- issue: Значение выражения «вашим отцам»
  choice: вашим отцам
  alternative: вашим предкам
  rationale: Перевод сохраняет мужское существительное πατέρας и библейскую форму обращения, а сноска поясняет его широкий исторический референт без замены в основном тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Деепричастная конструкция сохраняет смысловую связь без навязывания исключительно причинного прочтения. Начальная кавычка и двоеточие в конце оставлены незакрытыми, поскольку речь Павла продолжается в следующем стихе.
