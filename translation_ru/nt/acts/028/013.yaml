lexical_decisions:
- source_word: ὅθεν
  choice: Оттуда
  rationale: Естественный пространственный переход в повествовании, точно передающий значение греческого наречия.
- source_word: περιελόντες
  choice: снявшись с якоря
  rationale: В морском контексте причастие обозначает устранение того, что удерживало судно, вероятнее всего поднятие якоря; возвратная форма естественна по-русски. Более широкое понимание отмечено в сноске.
- source_word: κατηντήσαμεν
  choice: мы прибыли
  rationale: Глагол обозначает достижение места назначения; «прибыли» естественно для рассказа о морском путешествии.
- source_word: Ῥήγιον
  choice: Регий
  rationale: Традиционная русская передача древнего топонима Rhegium.
- source_word: μετὰ μίαν ἡμέραν
  choice: Через день
  rationale: Естественно и точно передаёт временной промежуток; последующее δευτεραῖοι уточняет прибытие на второй день.
- source_word: ἐπιγενομένου νότου
  choice: поднялся южный ветер
  rationale: Генитив абсолютный передан отдельной временно-сопутствующей конструкцией; выражение естественно для возникновения ветра.
- source_word: δευτεραῖοι
  choice: на второй день
  rationale: Сохраняет явное указание греческого текста на второй день пути, не сводя его просто к «на следующий день».
- source_word: ἤλθομεν
  choice: мы пришли
  rationale: Обычный глагол движения с указанным пунктом назначения; позволяет избежать стилистического повтора «прибыли».
- source_word: Ποτιόλους
  choice: Путеолы
  rationale: Устоявшаяся русская форма древнего топонима Puteoli.
