source:
  edition: SBLGNT
  text: ὡς δὲ εἶδον οἱ βάρβαροι κρεμάμενον τὸ θηρίον ἐκ τῆς χειρὸς αὐτοῦ, ⸂πρὸς ἀλλήλους ἔλεγον⸃· Πάντως φονεύς ἐστιν ὁ ἄνθρωπος οὗτος ὃν διασωθέντα ἐκ τῆς θαλάσσης ἡ δίκη ζῆν οὐκ εἴασεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/004.yaml
  text: When the islanders saw the creature hanging from his hand[a], they said to one another, “Surely this man is a murderer, whom Justice has not allowed to live[d][c][b], though he was brought safely from the sea.”
translation:
  language: ru
  text: 'Когда островитяне[a] увидели животное, свисавшее с его руки, они стали говорить друг другу: «Этот человек, несомненно, убийца. Хотя он и спасся из моря, Правосудие[b] не позволило ему жить».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «варвары» — обычное греческое обозначение людей, не говоривших по-гречески; здесь имеются в виду местные жители острова, без современного уничижительного оттенка.'
    reason: lexical_alternative
  - marker: b
    text: Греч. δίκη («правосудие, возмездие») здесь, вероятно, олицетворено как карающая сила; возможно, это отражает представление островитян о богине Правосудия.
    reason: cultural_note
lexical_decisions:
- source_word: βάρβαροι
  choice: островитяне
  rationale: В данном контексте слово обозначает местных жителей Мальты, не говоривших по-гречески, а не характеризует их как жестоких или нецивилизованных. «Островитяне» естественно передаёт референт в контексте.
- source_word: κρεμάμενον
  choice: повисло
  rationale: Передаёт зримый образ существа, свисающего с руки Павла, не уточняя без достаточных оснований, каким именно образом оно держалось.
- source_word: τὸ θηρίον
  choice: существо
  rationale: Греческое существительное здесь имеет общее значение «животное, зверь, существо»; хотя из контекста известно, что речь о змее, стих не повторяет более точного обозначения.
- source_word: πρὸς ἀλλήλους ἔλεγον
  choice: они стали говорить друг другу
  rationale: Такая формулировка естественно передаёт несовершенный вид ἔλεγον и явно сохраняет взаимность πρὸς ἀλλήλους.
- source_word: Πάντως
  choice: несомненно
  rationale: Передаёт уверенный вывод островитян на основании увиденного.
- source_word: φονεύς
  choice: убийца
  rationale: Прямой и общепонятный русский эквивалент существительного со значением человека, совершившего убийство.
- source_word: διασωθέντα
  choice: спасся
  rationale: Естественно передаёт благополучное избавление от морской опасности. Русская возвратная форма не вносит здесь богословского смысла спасения.
- source_word: ἡ δίκη
  choice: Правосудие
  rationale: Прописная буква отмечает олицетворение карающего правосудия в представлении островитян, не утверждая прямо, что речь идёт о конкретной богине.
- source_word: ζῆν οὐκ εἴασεν
  choice: не позволило ему жить
  rationale: Близко передаёт греческую конструкцию и мысль о том, что карающая сила не дала ему остаться в живых.
- source_word: ἐκ τῆς θαλάσσης
  choice: из моря
  rationale: Прямо передаёт пространственное значение ἐκ; идею избавления от опасности уже выражает διασωθέντα.
theological_decisions:
- issue: Олицетворение δίκη
  choice: «Правосудие» с прописной буквы
  alternative: «правосудие», «возмездие» или «богиня Правосудия»
  rationale: Прописная буква сохраняет вероятное олицетворение воздающей справедливости в языческом мировоззрении говорящих, но не превращает вероятную культурную предпосылку в явное утверждение текста и не приписывает это воззрение повествователю.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и естественное, прямая речь сохраняет уверенность островитян. Выражение «стали говорить» передаёт длительный оттенок имперфекта без тяжеловесности. Олицетворение отмечено прописной буквой и пояснено с осторожностью в сноске.
