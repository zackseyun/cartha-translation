  text: ἀξιοῦμεν δὲ παρὰ σοῦ ἀκοῦσαι ἃ φρονεῖς, περὶ μὲν γὰρ τῆς αἱρέσεως ταύτης γνωστὸν ⸂ἡμῖν ἐστιν⸃ ὅτι πανταχοῦ ἀντιλέγεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/022.yaml
  text: But we consider it proper to hear from you what you think[a], for concerning this sect it is known to us that it is spoken against everywhere.
translation:
  language: ru
  text: 'Но мы считаем нужным услышать от тебя, что ты думаешь, потому что нам известно: этому движению[a] повсюду противоречат.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «группе», «партии»; греческое слово здесь не обязательно означает «ересь» в позднейшем специальном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιοῦμεν
  choice: мы считаем правильным
  rationale: Передаёт сдержанное суждение об уместности и сохраняет вежливый, официальный тон, не усиливая глагол до требования.
- source_word: παρὰ σοῦ ἀκοῦσαι
  choice: услышать от тебя
  rationale: Естественно по-русски передаёт желание услышать мнение непосредственно от Павла.
- source_word: ἃ φρονεῖς
  choice: что ты думаешь
  rationale: Прямо и современно выражает значение мнения или позиции, не сужая его до формально изложенных взглядов.
- source_word: αἱρέσεως
  choice: течение
  rationale: В данном контексте слово обозначает религиозную группу или движение, а не «ересь» в позднейшем техническом смысле. «Течение» звучит естественнее современного русского «секта» и не добавляет резко отрицательной окраски.
- source_word: γνωστὸν ἡμῖν ἐστιν
  choice: нам известно
  rationale: Сохраняет безличную конструкцию и официальный регистр греческого текста.
- source_word: πανταχοῦ
  choice: повсюду
  rationale: Точно и естественно передаёт широкий пространственный охват.
- source_word: ἀντιλέγεται
  choice: о нём говорят против
  rationale: 'Сохраняет речевой оттенок пассивного глагола: против этого движения именно высказываются, а не только противодействуют ему.'
theological_decisions:
- issue: Передача αἵρεσις
  choice: течение
  alternative: секта; партия; ересь
  rationale: Здесь речь идёт о христианском движении в восприятии посторонних, а не о формально осуждённом вероучительном уклонении. «Ересь» внесла бы более поздний церковно-технический смысл; «течение» сохраняет социально-религиозное значение без лишней конфессиональной оценки.
translation_notes:
  register: Современный литературный русский язык с умеренно официальным тоном. Синтаксис сохраняет последовательность мысли оригинала, но остаётся понятным обычному читателю. Формулировка «говорят против» намеренно сохраняет речевую семантику ἀντιλέγεται, хотя она несколько менее привычна, чем «выступают против».
