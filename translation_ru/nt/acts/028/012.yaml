  text: καὶ καταχθέντες εἰς Συρακούσας ἐπεμείναμεν ἡμέρας τρεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/012.yaml
  text: And after putting in at Syracuse[a], we stayed there three days.
translation:
  language: ru
  text: И, зайдя в порт Сиракуз[a], мы пробыли там три дня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «высадившись в Сиракузах»; греческое причастие употреблено здесь в морском значении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταχθέντες
  choice: зайдя в порт
  rationale: В контексте морского путешествия причастие от κατάγω означает заход судна в порт или прибытие к берегу. «Зайдя в порт» естественно и ясно передаёт морской смысл.
- source_word: εἰς Συρακούσας
  choice: в порт Сиракуз
  rationale: Предлог εἰς указывает направление движения, а форма Συρακούσας обозначает город Сиракузы. В сочетании с морским глаголом русский оборот «зайти в порт Сиракуз» звучит естественно.
- source_word: ἐπεμείναμεν
  choice: мы пробыли там
  rationale: Глагол означает оставаться или находиться некоторое время. «Пробыли там» естественно сочетается с указанием длительности и сохраняет подразумеваемую связь с местом.
- source_word: ἡμέρας τρεῖς
  choice: три дня
  rationale: 'Винительный падеж выражает продолжительность времени; по-русски она естественно передаётся без предлога: «пробыли три дня».'
- source_word: Συρακούσας
  choice: Сиракуз
  rationale: «Сиракузы» — закрепившееся в русском языке название древнего города; после слова «порт» требуется родительный падеж множественного числа.
theological_decisions: []
