base_translation:
  language: en
  yaml_path: translation/nt/acts/028/015.yaml
  text: And from there the brothers[a], when they heard about us, came to meet us as far as Appius Forum and Three Taverns. When Paul saw them, he gave thanks to God and took courage.
translation:
  language: ru
  text: А оттуда братья[a], услышав о нас, вышли нам навстречу до Аппиевой площади и Трёх Таверн. Увидев их, Павел поблагодарил Бога и ободрился.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры»; греческое слово буквально означает «братья», но в этом контексте могло обозначать единоверцев обоего пола.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: А оттуда
  rationale: Передаёт καί + ἐκεῖθεν как естественный переход в продолжающемся рассказе о путешествии.
- source_word: οἱ ἀδελφοὶ
  choice: братья
  rationale: Сохраняет форму греческого текста и обычное раннехристианское обозначение единоверцев; возможный инклюзивный охват пояснён в сноске.
- source_word: ἀκούσαντες τὰ περὶ ἡμῶν
  choice: услышав о нас
  rationale: Кратко и без добавления отсутствующего существительного «новости» передаёт идиоматическое выражение о полученных сведениях относительно Павла и его спутников.
- source_word: ἦλθαν εἰς ἀπάντησιν ἡμῖν
  choice: вышли нам навстречу
  rationale: Естественно передаёт устойчивое выражение о выходе для встречи с прибывающими.
- source_word: ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν
  choice: до Аппиевой площади и Трёх Таверн
  rationale: «До» сохраняет значение предела в ἄχρι; топонимы переданы в традиционной русской библейской форме.
- source_word: οὓς ἰδὼν ὁ Παῦλος
  choice: Увидев их, Павел
  rationale: Сохраняет причастную структуру и ясно связывает местоимение с упомянутыми братьями.
- source_word: εὐχαριστήσας τῷ θεῷ
  choice: поблагодарил Бога
  rationale: Естественный русский эквивалент, сохраняющий явный объект благодарности.
- source_word: ἔλαβε θάρσος
  choice: ободрился
  rationale: Передаёт идиоматический смысл буквального «обрёл мужество» современным и естественным русским глаголом, не усиливая его до дерзновения или смелости в речи.
theological_decisions:
- issue: Значение ἀδελφοί применительно к христианской общине
  choice: братья
  alternative: братья и сёстры; верующие
  rationale: Основной текст сохраняет грамматическую форму оригинала, не исключая вероятного присутствия женщин; широкий контекстуальный смысл указан в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Причастные обороты звучат естественно и сохраняют последовательность греческого рассказа; архаичные «принял мужество» и «возблагодарил» не используются.
