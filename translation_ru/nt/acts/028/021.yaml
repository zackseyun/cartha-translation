  source_fidelity: 'Перевод точно передаёт греческий текст: δέ естественно отражено частицей «же»; явное «мы» сохранено; отрицательная конструкция οὔτε…οὔτε передана нормативно и без потери смысла. «Никто из прибывших братьев» соответствует παραγενόμενός τις τῶν ἀδελφῶν и не добавляет отсутствующее в оригинале «сюда». Различие между ἀπήγγειλεν и ἐλάλησεν в разумной мере сохранено глаголами «сообщил» и «сказал».'
