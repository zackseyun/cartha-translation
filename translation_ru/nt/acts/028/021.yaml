  text: οἱ δὲ πρὸς αὐτὸν εἶπαν· Ἡμεῖς οὔτε γράμματα περὶ σοῦ ἐδεξάμεθα ἀπὸ τῆς Ἰουδαίας, οὔτε παραγενόμενός τις τῶν ἀδελφῶν ἀπήγγειλεν ἢ ἐλάλησέν τι περὶ σοῦ πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/021.yaml
  text: But they said to him[a], “We have received no letters from Judea about you[b], nor has any of the brothers who came reported or spoken anything evil about you.”
translation:
  language: ru
  text: 'Они же сказали ему: «Мы не получали из Иудеи никаких писем о тебе, и никто из прибывших братьев не сообщил и не сказал о тебе ничего дурного».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Братья» здесь могут означать собратьев-иудеев, прибывших из Иудеи; текст прямо не называет их верующими во Христа.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ πρὸς αὐτὸν εἶπαν
  choice: Они же сказали ему
  rationale: Частица δέ передана естественной для русского повествования конструкцией с «же», которая обозначает переход к ответу, не усиливая противопоставление.
- source_word: οὔτε γράμματα περὶ σοῦ ἐδεξάμεθα ἀπὸ τῆς Ἰουδαίας
  choice: Мы не получали из Иудеи никаких писем о тебе
  rationale: Сохраняется смысл получения корреспонденции; порядок слов сделан естественным для современного русского языка.
- source_word: παραγενόμενός τις τῶν ἀδελφῶν
  choice: никто из прибывших братьев
  rationale: Причастие передаёт прибытие, не добавляя отсутствующего в оригинале указания «сюда»; «братьев» сохраняет форму и неоднозначность греческого выражения.
- source_word: ἀπήγγειλεν ἢ ἐλάλησέν τι
  choice: не сообщил и не сказал
  rationale: Два разных глагола сохранены, однако при общей отрицательной конструкции русское «и» естественно передаёт смысл «ни один не сообщил и не сказал».
- source_word: περὶ σοῦ πονηρόν
  choice: о тебе ничего дурного
  rationale: В данном контексте πονηρόν обозначает неблагоприятное или порочащее сообщение; «ничего дурного» звучит естественно и не сужает смысл до формального обвинения.
theological_decisions:
- issue: Кого обозначают «братья» (τῶν ἀδελφῶν)
  choice: Сохранено «братьев» без уточнения их принадлежности
  alternative: «единоверцев-иудеев» или «братьев-христиан»
  rationale: Контекст допускает, что речь идёт о собратьях-иудеях, но сам текст прямо не называет их ни иудеями, ни христианами; перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык, сдержанный повествовательный стиль. Коррелятивное οὔτε…οὔτε передано естественной русской отрицательной конструкцией «не… никаких… и никто… не…». Маркер сноски помещён после всей реплики, поскольку поясняет выражение внутри предложения.
