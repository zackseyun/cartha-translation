  terminology: «Иудея», «братья» и «ничего дурного» выбраны удачно. «Братья» сохраняет намеренную неопределённость τῶν ἀδελφῶν, не навязывая христианскую идентификацию. Сноска корректно поясняет возможное понимание без утверждения его как единственно верного.
