  text: συστρέψαντος δὲ τοῦ Παύλου φρυγάνων ⸀τι πλῆθος καὶ ἐπιθέντος ἐπὶ τὴν πυράν, ἔχιδνα ⸀ἀπὸ τῆς θέρμης ⸀ἐξελθοῦσα καθῆψε τῆς χειρὸς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/003.yaml
  text: But when Paul had gathered a bundle of sticks and put them on the fire[b][a], a viper came out because of the heat and fastened onto his hand.
translation:
  language: ru
  text: Когда Павел набрал охапку хвороста и положил её на костёр, из-за жара[a] выползла гадюка и вцепилась в его руку[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от жара». Греческий предлог допускает такое более буквальное понимание, хотя здесь, вероятно, указывает на причину: гадюка выползла из-за жара от огня.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ухватилась за его руку»; возможно также: «укусила его за руку». Греческий глагол имеет более широкое значение: «прикрепиться», «ухватиться», «вцепиться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συστρέψαντος
  choice: набрал
  rationale: Аористное причастие в родительном самостоятельном обороте обозначает предшествующее действие Павла. В контексте топлива глагол означает собирание, а не буквальное скручивание.
- source_word: φρυγάνων τι πλῆθος
  choice: охапку хвороста
  rationale: φρύγανα — сухие ветки или хворост для топлива, а τι πλῆθος — некоторое количество. «Охапка хвороста» естественно передаёт собранную массу топлива.
- source_word: ἐπιθέντος ἐπὶ τὴν πυράν
  choice: положил её в огонь
  rationale: Оборот продолжает родительный самостоятельный оборот. В современном русском о топливе естественно сказать «положить в огонь»; местоимение согласовано с «охапкой».
- source_word: ἔχιδνα
  choice: гадюка
  rationale: ἔχιδνα обозначает именно ядовитую змею, гадюку, а не змею вообще.
- source_word: ἀπὸ τῆς θέρμης
  choice: из-за жара
  rationale: ἀπό буквально может указывать на исходную точку («от жара»), но в данном контексте вероятнее выражает причину появления змеи. Неоднозначность отмечена в сноске.
- source_word: ἐξελθοῦσα
  choice: выползла
  rationale: Причастие описывает выход змеи наружу. «Выползла» естественно для змеи и не добавляет неуместной детализации.
- source_word: καθῆψε τῆς χειρὸς αὐτοῦ
  choice: вцепилась ему в руку
  rationale: καθάπτω означает прикрепиться, ухватиться или вцепиться. Выбор сохраняет образ змеи, удерживающейся на руке, не сводя значение исключительно к укусу.
