  text: γνωστὸν οὖν ⸂ἔστω ὑμῖν⸃ ὅτι τοῖς ἔθνεσιν ἀπεστάλη ⸀τοῦτο τὸ σωτήριον τοῦ θεοῦ· αὐτοὶ καὶ ⸀ἀκούσονται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/028.yaml
  text: Therefore let it be known to you that this salvation of God has been sent to the Gentiles[b][a]; they also will listen.
translation:
  language: ru
  text: 'Итак, пусть вам будет известно: это Божье спасение послано язычникам[a], и они тоже услышат[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это спасение от Бога». Греческий родительный падеж допускает несколько близких смысловых оттенков.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «они тоже будут слушать» или «они тоже прислушаются». Глагол может означать как «слышать», так и «слушать, внимать» — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: Итак, пусть будет известно вам
  rationale: Сохраняет выводное значение οὖν и публично-декларативную силу конструкции с повелительным ἔστω, оставаясь естественным для современного русского языка.
- source_word: τοῖς ἔθνεσιν
  choice: язычникам
  rationale: В данном контексте противопоставления иудеям речь идёт о неевреях; «язычникам» передаёт это точнее, чем буквальное «народам».
- source_word: ἀπεστάλη
  choice: послано
  rationale: Совершенный вид передаёт завершённость аориста; краткая страдательная форма естественна по-русски и не требует добавлять не названного в тексте деятеля.
- source_word: τοῦτο τὸ σωτήριον τοῦ θεοῦ
  choice: это спасение Божье
  rationale: Субстантивированное σωτήριον передано как «спасение», а родительный τοῦ θεοῦ сохранён без сведения смысла исключительно к источнику или принадлежности.
- source_word: αὐτοὶ καὶ ἀκούσονται
  choice: они и послушают
  rationale: «Послушают» естественно выражает контекстуальный смысл восприимчивого слушания, тогда как частица «и» передаёт усиление αὐτοὶ καί.
theological_decisions:
- issue: Значение σωτήριον в контексте
  choice: спасение
  alternative: весть о спасении
  rationale: Греческое существительное обозначает спасение; уточнение «весть» сузило бы богословскую широту выражения без прямого основания в тексте.
- issue: Отношение τοῦ θεοῦ к σωτήριον
  choice: спасение Божье
  alternative: спасение от Бога
  rationale: Форма «Божье» сохраняет возможную смысловую широту греческого родительного падежа, не сводя его только к указанию на источник.
- issue: Сила ἀκούσονται
  choice: послушают
  alternative: услышат
  rationale: Контекст предполагает не просто физическое слышание, а восприимчивость; при этом «послушают» не добавляет утверждения об обращении каждого язычника.
translation_notes:
  register: Современный литературный русский язык с достойным публично-декларативным тоном. Порядок слов слегка приближен к естественной русской речи; смысловая неоднозначность родительного падежа и глагола слышания отмечена в сносках.
