source:
  edition: SBLGNT
  text: οἳ καὶ πολλαῖς τιμαῖς ἐτίμησαν ἡμᾶς καὶ ἀναγομένοις ἐπέθεντο τὰ πρὸς ⸂τὰς χρείας⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/010.yaml
  text: They also honored us greatly[a], and when we were setting sail[c][b], they put on board what we needed.
translation:
  language: ru
  text: Они оказали нам много почестей[a], а когда мы отплывали[b], погрузили на корабль всё необходимое[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «почтили нас многими почестями».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «выходили в море». Здесь употреблён морской термин, обозначающий начало плавания.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «снабдили нас всем необходимым». Буквально: «положили то, что было нужно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλαῖς τιμαῖς ἐτίμησαν
  choice: оказали нам много почестей
  rationale: Передаёт однокоренное сочетание существительного и глагола без неестественного русского повтора «почтили почестями»; речь идёт о конкретных знаках уважения.
- source_word: ἀναγομένοις
  choice: когда мы отплывали
  rationale: В данном морском контексте ἀνάγω означает отправляться в плавание, отплывать.
- source_word: ἐπέθεντο
  choice: погрузили на корабль
  rationale: Глагол означает «положили, поместили»; контекст отплытия позволяет естественно обозначить подразумеваемый корабль.
- source_word: τὰ πρὸς τὰς χρείας
  choice: всё необходимое
  rationale: Естественно передаёт выражение «то, что относится к нуждам», то есть нужные припасы и вещи, не сужая их перечень.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; достоинство повествования сохранено. Умеренно буквальное «оказали много почестей» сохраняет конкретность греческого выражения, а «погрузили на корабль всё необходимое» ясно передаёт подразумеваемую морскую обстановку.
