source:
  edition: SBLGNT
  text: ἐγένετο δὲ τὸν πατέρα τοῦ Ποπλίου πυρετοῖς καὶ ⸀δυσεντερίῳ συνεχόμενον κατακεῖσθαι, πρὸς ὃν ὁ Παῦλος εἰσελθὼν καὶ προσευξάμενος ἐπιθεὶς τὰς χεῖρας αὐτῷ ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/008.yaml
  text: It happened that the father of Publius was lying sick with fevers and dysentery. Paul went in to him[a], and after praying and laying his hands on him, healed him.
translation:
  language: ru
  text: Случилось, что отец Публия лежал, мучимый лихорадкой и дизентерией.[a] Павел вошёл к нему и, помолившись, возложил на него руки и исцелил его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое причастие можно также передать как «охваченный» или «страдающий от» этих болезней. Множественное число слова «лихорадки» может указывать на повторяющиеся или тяжёлые лихорадочные состояния.
    reason: Лексическая форма подчёркивает, что болезни удерживали человека в состоянии продолжающегося страдания; примечание также сохраняет нюанс греческого множественного числа без излишней конкретизации в основном тексте.
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: Случилось, что
  rationale: Естественно передаёт характерный для Луки переход к новому событию; частица δέ не требует отдельного наречия времени.
- source_word: πατέρα τοῦ Ποπλίου
  choice: отец Публия
  rationale: Точно и естественно передаёт греческую конструкцию с родительным падежом.
- source_word: πυρετοῖς
  choice: приступами лихорадки
  rationale: Множественное число сохранено по смыслу как повторяющиеся или множественные приступы жара; буквальное «лихорадками» звучало бы по-русски неестественно.
- source_word: δυσεντερίῳ
  choice: дизентерией
  rationale: Это прямое и понятное современному читателю название болезни.
- source_word: συνεχόμενον
  choice: мучимый
  rationale: Причастие обозначает человека, охваченного болезнью и продолжающего страдать от неё.
- source_word: κατακεῖσθαι
  choice: лежал
  rationale: Передаёт положение больного, не усиливая текст до значения полной прикованности к постели.
- source_word: πρὸς ὃν ὁ Παῦλος εἰσελθὼν
  choice: Павел вошёл к нему
  rationale: Естественно передаёт направленное движение Павла туда, где находился больной.
- source_word: προσευξάμενος
  choice: помолившись
  rationale: Деепричастие сохраняет предшествование молитвы последующему действию.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: возложил на него руки
  rationale: Устойчивое и точное выражение для описанного жеста; сохраняет множественное число «руки».
- source_word: ἰάσατο αὐτόν
  choice: исцелил его
  rationale: Прямо передаёт совершённое исцеление без добавления медицинских или конфессиональных толкований.
theological_decisions:
- issue: Характер исцеления, совершённого Павлом
  choice: Последовательно передать молитву, возложение рук и исцеление без дополнительных определений.
  alternative: Прямо назвать исцеление чудесным, мгновенным или сакраментальным.
  rationale: Стих утверждает факт исцеления после молитвы и возложения рук, но сам не уточняет его скорость, механизм или богословскую категорию.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным строем. Формулировка «приступами лихорадки» естественно передаёт греческое множественное число, а «исцелил» сохраняет библейскую торжественность без архаизации.
