  text: οἵ ⸀τε βάρβαροι παρεῖχον οὐ τὴν τυχοῦσαν φιλανθρωπίαν ἡμῖν, ⸀ἅψαντες γὰρ πυρὰν προσελάβοντο πάντας ἡμᾶς διὰ τὸν ὑετὸν τὸν ἐφεστῶτα καὶ διὰ τὸ ψῦχος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/002.yaml
  text: And the local people showed us extraordinary kindness[b][a], for they lit a fire and welcomed all of us because of the rain that had set in and because of the cold.
translation:
  language: ru
  text: 'Местные жители[a] проявили к нам необыкновенную доброту[b]: из-за начавшегося дождя и холода они развели костёр и приняли всех нас.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «варвары», то есть люди, не говорившие по-гречески; здесь имеются в виду местные жители острова, а не обязательно дикие или жестокие люди.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «доброту, далеко не обычную».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάρβαροι
  choice: местные жители
  rationale: В данном контексте слово обозначает жителей острова, не говоривших по-гречески, и не обязательно содержит смысл «дикие» или «нецивилизованные». Современное русское «варвары» внесло бы неуместную отрицательную оценку.
- source_word: οὐ τὴν τυχοῦσαν φιλανθρωπίαν
  choice: необыкновенную доброту
  rationale: Греческий оборот буквально отрицает обычность проявленной человечности и означает исключительную, необычайную доброту. Выбранная формулировка естественна по-русски и сохраняет силу выражения.
- source_word: παρεῖχον
  choice: проявили
  rationale: В сочетании с обозначением доброты глагол естественно передаётся по-русски как «проявили».
- source_word: ἅψαντες πυράν
  choice: развели костёр
  rationale: Оборот означает зажечь или развести огонь; «костёр» ясно передаёт огонь, у которого могли согреться потерпевшие кораблекрушение, не добавляя лишних подробностей.
- source_word: προσελάβοντο πάντας ἡμᾶς
  choice: приняли всех нас
  rationale: Глагол описывает радушный приём и заботу; «приняли» сохраняет это значение, а «всех нас» передаёт подчёркнутую включённость всей группы.
- source_word: διὰ τὸν ὑετὸν τὸν ἐφεστῶτα
  choice: из-за начавшегося дождя
  rationale: Причастие указывает на дождь, который уже наступил и продолжался. «Начавшегося» кратко и естественно передаёт наступление неблагоприятной погоды.
- source_word: διὰ τὸ ψῦχος
  choice: из-за … холода
  rationale: Прямое и естественное соответствие греческому обозначению холода.
theological_decisions: []
