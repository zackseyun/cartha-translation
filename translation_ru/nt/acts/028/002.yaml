  register: Современный литературный русский язык с ясным повествовательным синтаксисом. «Местные жители» устраняет современный уничижительный оттенок слова «варвары», а сноска сохраняет буквальную форму оригинала. Формулировка «необыкновенную доброту» передаёт греческую литоту естественным образом.
