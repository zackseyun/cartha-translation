  text: οἵτινες ἀνακρίναντές με ἐβούλοντο ἀπολῦσαι διὰ τὸ μηδεμίαν αἰτίαν θανάτου ὑπάρχειν ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/018.yaml
  text: who[a], after examining me, wanted to release me because there was no basis for the death penalty in my case.
translation:
  language: ru
  text: Они, допросив меня, хотели освободить, потому что не было никаких оснований для смертного приговора против меня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵτινες
  choice: они
  rationale: В продолжении русского предложения относительное местоимение естественно передаётся личным «они»; выраженный оттенок качественной характеристики здесь не требует отдельного воспроизведения.
- source_word: ἀνακρίναντές
  choice: допросив
  rationale: Аористное причастие обозначает действие, предшествующее желанию освободить; в судебном контексте «допросив» точно и естественно.
- source_word: ἐβούλοντο
  choice: хотели
  rationale: Имперфект передаёт намерение в прошлом; «хотели» сохраняет смысл без излишнего усиления.
- source_word: ἀπολῦσαι
  choice: освободить
  rationale: В данном юридическом контексте речь идёт об освобождении Павла из-под стражи.
- source_word: διὰ τὸ μηδεμίαν αἰτίαν θανάτου ὑπάρχειν ἐν ἐμοί
  choice: потому что не нашли за мной никакой вины, заслуживающей смерти
  rationale: Причинная конструкция передана придаточным предложением. «Не нашли за мной» естественно раскрывает судебный смысл буквально необычного для русского «не было во мне», а «вина, заслуживающая смерти» сохраняет связь αἰτία с θανάτου.
