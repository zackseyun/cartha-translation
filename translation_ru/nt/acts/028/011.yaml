  text: Μετὰ δὲ τρεῖς μῆνας ⸀ἀνήχθημεν ἐν πλοίῳ παρακεχειμακότι ἐν τῇ νήσῳ Ἀλεξανδρίνῳ, παρασήμῳ Διοσκούροις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/011.yaml
  text: After three months we set sail in an Alexandrian ship that had wintered on the island[a], with the Dioscuri as its figurehead.
translation:
  language: ru
  text: Через три месяца мы отплыли на александрийском корабле, зимовавшем на острове, с эмблемой Диоскуров[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Диоскуры — Кастор и Поллукс, близнецы, считавшиеся в греко-римской мифологии сыновьями Зевса.
    reason: Пояснение малоизвестного мифологического имени.
lexical_decisions:
- source_word: Μετὰ δὲ τρεῖς μῆνας
  choice: Через три месяца
  rationale: Μετά с винительным падежом обозначает время по истечении указанного срока; слабо соединительное δέ не требует отдельной передачи по-русски.
- source_word: ἀνήχθημεν
  choice: мы отплыли
  rationale: В морском контексте ἀνάγω означает «выходить в море, отплывать»; выбран естественный русский глагол повествовательного стиля.
- source_word: ἐν πλοίῳ ... Ἀλεξανδρίνῳ
  choice: на александрийском корабле
  rationale: Русское «на корабле» идиоматично; прилагательное Ἀλεξανδρίνῳ указывает на происхождение или принадлежность корабля Александрии.
- source_word: παρακεχειμακότι ἐν τῇ νήσῳ
  choice: зимовавшем на острове
  rationale: Перфектное причастие παρακεχειμακότι сообщает, что корабль провёл там зиму; остров известен из ближайшего контекста, поэтому название не добавляется.
- source_word: παρασήμῳ Διοσκούροις
  choice: его знаком были Диоскуры
  rationale: παράσημος обозначает отличительный знак или эмблему корабля, но не обязательно именно носовую фигуру; передача «знаком» сохраняет широту греческого выражения. Διόσκουροι передано традиционным русским собственным именем.
theological_decisions:
- issue: Передача языческой корабельной эмблемы Διοσκούροις
  choice: Диоскуры
  alternative: Боги-близнецы; Кастор и Поллукс
  rationale: Собственное имя непосредственно соответствует греческому тексту и не превращает упоминание в истолковывающий пересказ. Сноска поясняет мифологическую отсылку; повествование сообщает о языческом знаке, не выражая его одобрения.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-повествовательный. Точка с запятой устраняет возможную двусмысленность, будто Диоскуры были знаком острова, и ясно связывает эмблему с кораблём.
