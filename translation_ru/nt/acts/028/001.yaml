lexical_decisions:
- source_word: διασωθέντες
  choice: спасшись
  rationale: Аористное страдательное причастие обозначает благополучное избавление от опасности; русская возвратная форма естественно передаёт результат спасения, не уточняя сверх текста, кем именно оно было совершено.
- source_word: τότε
  choice: последовательность передана конструкцией «Спасшись, мы узнали»
  rationale: 'Отдельное «тогда» в русском здесь избыточно: предшествующее деепричастие ясно выражает временную последовательность.'
- source_word: ἐπέγνωμεν
  choice: мы узнали
  rationale: В данном контексте глагол означает получение новой информации — названия острова.
- source_word: Μελίτη
  choice: Мальта
  rationale: Употреблено общепринятое современное русское название острова, традиционно отождествляемого с греческой Μελίτη.
- source_word: ἡ νῆσος
  choice: остров
  rationale: Прямой и естественный современный русский эквивалент.
- source_word: καλεῖται
  choice: называется
  rationale: Настоящее страдательное время греческого текста естественно сохраняется русским настоящим временем в косвенном сообщении о названии.
