    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνέμεινεν
  choice: прожил там
  rationale: Глагол обозначает продолжительное пребывание; в сочетании с указанием срока естественное русское «прожил там» передаёт проживание в данном месте, не добавляя идеи постоянного поселения.
- source_word: δὲ
  choice: не передано отдельным словом
  rationale: Здесь δέ служит слабой повествовательной связкой. В русском начало нового итогового предложения не требует отдельного «и» или «же»; связь сохраняется контекстом.
- source_word: διετίαν ὅλην
  choice: два полных года
  rationale: Переданы и двухлетний срок, и подчёркивающее ὅλην «полных».
- source_word: ἐν ἰδίῳ μισθώματι
  choice: в снятом им жилье
  rationale: 'μίσθωμα обозначает арендованное помещение или жильё. Оборот «снятом им» естественно передаёт ἰδίῳ: жильё было нанято самим Павлом или находилось в его собственном распоряжении, а не принадлежало ему.'
- source_word: ἀπεδέχετο
  choice: радушно принимал
  rationale: Имперфект выражает продолжавшееся или обычное действие, а «радушно принимал» сохраняет оттенок приветливого приёма у ἀποδέχομαι.
- source_word: πάντας τοὺς εἰσπορευομένους πρὸς αὐτόν
  choice: всех, кто приходил к нему
  rationale: Причастие буквально описывает входивших к нему посетителей. По-русски «приходил к нему» звучит естественно; пространственный оттенок входа пояснён в сноске.
theological_decisions:
- issue: Явное называние Павла при местоимении, подразумеваемом глаголом
  choice: Павел
  alternative: он
  rationale: В греческом подлежащее подразумевается формой глагола и определяется контекстом как Павел. В отдельно цитируемом русском стихе имя устраняет неясность, не внося богословского истолкования.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Формулировки dignified, но не архаичны; «радушно принимал» передаёт гостеприимный оттенок, а сноски сохраняют буквальные пространственные и лексические варианты.
