  terminology: «Слухом услышите», «не поймёте» и «не увидите» уместны и верно передают лексику цитаты. Формула «ни в коем случае не» возможна, но несколько канцелярска для пророческой речи; «никак не» естественнее и передаёт решительное отрицание без ложного временного оттенка.
