  source_fidelity: 'В целом передача точна: сохранены повеление, собирательное «этот народ», усиленная конструкция ἀκοῇ ἀκούσετε, emphatic οὐ μή и различие между συνῆτε («поймёте») и ἴδητε («увидите»). Однако «глядя, будете смотреть» в современном литературном русском звучит искусственно и создаёт ненужное видовое значение длительности, которого греческая форма сама по себе не требует.'
