base_translation:
  language: en
  yaml_path: translation/nt/acts/028/026.yaml
  text: 'saying[a], ‘Go to this people and say: You will indeed hear, but you will never understand; and seeing, you will indeed see[b], but you will never perceive.’'
translation:
  language: ru
  text: 'говоря: «Пойди к этому народу и скажи: “Слухом услышите[a], но никак не поймёте; будете смотреть, но никак не увидите[b]”».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «слухом услышите» — усилительный оборот в духе еврейской речи, сохранённый в греческой цитате из Исаии.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «но никак не постигнете». Греческий текст повторяет слова, связанные со зрением, однако последнее из них в данном контексте может означать внутреннее распознавание.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: говоря
  rationale: Причастие настоящего времени вводит цитату и сохраняет синтаксическую связь с предыдущим стихом.
- source_word: Πορεύθητι πρὸς τὸν λαὸν τοῦτον
  choice: Пойди к этому народу
  rationale: Передаёт повеление движения и сохраняет собирательное, пророческое обозначение λαός.
- source_word: Ἀκοῇ ἀκούσετε
  choice: Слухом услышите
  rationale: Сохраняет намеренно повторную, семитизированную конструкцию греческой цитаты и её торжественный пророческий строй.
- source_word: οὐ μὴ συνῆτε
  choice: ни в коем случае не поймёте
  rationale: Передаёт усиленное отрицание οὐ μή, не превращая его без необходимости во временное «никогда».
- source_word: βλέποντες βλέψετε
  choice: глядя, будете смотреть
  rationale: Сохраняет повтор корня зрительного восприятия и различает продолженное смотрение и итоговое видение в следующей части.
- source_word: οὐ μὴ ἴδητε
  choice: ни в коем случае не увидите
  rationale: Сохраняет основной смысл ἴδητε и лексическую напряжённость между внешним смотрением и отсутствием подлинного видения.
theological_decisions:
- issue: Внешнее восприятие и внутреннее постижение в цитате из Исаии
  choice: Сохранить «не поймёте» и буквальное «не увидите»
  alternative: Передать последнее как «не постигнете» или «не уразумеете»
  rationale: συνίημι прямо обозначает понимание, тогда как ἴδητε остаётся глаголом зрения, хотя в контексте может подразумевать внутреннее распознавание. Буквальное «не увидите» сохраняет эту богословскую и образную неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством пророческой цитаты. Повторы сохранены там, где они значимы для формы и смысла; усиленное отрицание передано естественным русским оборотом.
