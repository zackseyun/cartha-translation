source:
  edition: SBLGNT
  text: Ταξάμενοι δὲ αὐτῷ ἡμέραν ⸀ἧκον πρὸς αὐτὸν εἰς τὴν ξενίαν πλείονες, οἷς ἐξετίθετο διαμαρτυρόμενος τὴν βασιλείαν τοῦ θεοῦ πείθων τε ⸀αὐτοὺς περὶ τοῦ Ἰησοῦ ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν ἀπὸ πρωῒ ἕως ἑσπέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/023.yaml
  text: After they had arranged a day with him[a], more of them came to him at his lodging. To them he was explaining, solemnly testifying about the kingdom of God and persuading them concerning Jesus from both the Law of Moses and the Prophets[c][b], from morning until evening.
translation:
  language: ru
  text: Договорившись с ним о дне, они в ещё большем числе пришли туда, где он остановился.[a] С утра до вечера Павел излагал им, торжественно свидетельствуя о Царстве Божьем и убеждая их относительно Иисуса на основании Закона Моисея и Пророков.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в его жильё»; греческое слово может означать жильё, помещение для гостя или место временного пребывания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «старался убедить их относительно Иисуса». Греческое выражение обозначает действие убеждения, не уточняя здесь, насколько оно было успешным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταξάμενοι δὲ αὐτῷ ἡμέραν
  choice: Договорившись с ним о дне
  rationale: Передаёт идиоматический смысл назначения согласованного дня встречи; средний залог и дательный αὐτῷ естественно выражены взаимной договорённостью.
- source_word: ἧκον πρὸς αὐτὸν εἰς τὴν ξενίαν
  choice: пришли туда, где он остановился
  rationale: ξενία обозначает временное жильё или помещение для гостя. Описательный перевод современен и не уточняет неоправданно вид жилья.
- source_word: πλείονες
  choice: в ещё большем числе
  rationale: 'Сохраняет сравнительное значение: на назначенную встречу пришло больше людей, чем прежде.'
- source_word: ἐξετίθετο
  choice: излагал им
  rationale: Имперфект обозначает продолжительное изложение; «излагал» передаёт развёрнутое объяснение без лишнего добавления объекта.
- source_word: διαμαρτυρόμενος τὴν βασιλείαν τοῦ θεοῦ
  choice: торжественно свидетельствовал о Царстве Божьем
  rationale: διαμαρτύρομαι выражает настойчивое, серьёзное свидетельство; традиционное «Царство Божье» остаётся прозрачным современному читателю.
- source_word: πείθων τε αὐτοὺς περὶ τοῦ Ἰησοῦ
  choice: убеждал их в том, что говорил об Иисусе
  rationale: Передаёт продолжающееся действие убеждения, не утверждая, что все слушатели действительно были убеждены. Оборот περὶ τοῦ Ἰησοῦ сохраняется как содержание речи об Иисусе.
- source_word: ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν
  choice: опираясь на Закон Моисея и Пророков
  rationale: ἀπό здесь указывает на источник и основание доводов; τε ... καί соединяет обе части Писания.
- source_word: ἀπὸ πρωῒ ἕως ἑσπέρας
  choice: с утра до вечера
  rationale: Естественно и точно передаёт весь указанный промежуток времени.
theological_decisions:
- issue: Связь свидетельства о Царстве Божьем с убеждением относительно Иисуса
  choice: Оба направления представлены как части единого продолжительного изложения Павла, основанного на Писании Израиля.
  alternative: Понимать Царство Божье и Иисуса как две совершенно обособленные темы.
  rationale: Синтаксис объединяет свидетельство о Царстве и убеждение относительно Иисуса, но перевод не разворачивает эту связь в дополнительную богословскую систему.
- issue: Результат убеждения слушателей
  choice: «Убеждал» обозначает процесс и направленность речи, не гарантируя успеха.
  alternative: «Убедил» утверждало бы успешный результат для всех слушателей; «старался убедить» сильнее подчёркивало бы лишь попытку.
  rationale: Причастие πείθων называет совершаемое действие, а последующий контекст различает реакции слушателей; несовершенный вид в русском сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного и богословского контекста. Порядок последнего обстоятельства времени перенесён в начало второго предложения ради естественного русского синтаксиса. «Закон Моисея и Пророки» оформлены как общепонятные названия частей Писания.
