base_translation:
  language: en
  yaml_path: translation/nt/acts/027/034.yaml
  text: Therefore I urge you to take some food[a], for this is for your preservation; for not a hair from the head of any of you will perish.
translation:
  language: ru
  text: 'Поэтому я настоятельно прошу вас поесть: это необходимо для сохранения вашей жизни, потому что ни у кого из вас с головы не пропадёт ни один волос.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для вашего спасения». Греческое слово может означать «спасение», «избавление» или «сохранение жизни»; здесь речь идёт о физическом выживании.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующих слов Павла и естественно связывает призыв с ситуацией.
- source_word: παρακαλῶ
  choice: я настоятельно прошу
  rationale: Выражает серьёзный, но не властный призыв Павла; современно и естественно по-русски.
- source_word: μεταλαβεῖν τροφῆς
  choice: поесть
  rationale: Кратко и естественно передаёт идиоматическое значение «принять пищу, подкрепиться».
- source_word: τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει
  choice: это нужно для вашего спасения
  rationale: Передаёт направленность на благополучный исход и сохраняет ключевое слово σωτηρία, которое в данном контексте обозначает физическое спасение.
- source_word: σωτηρίας
  choice: спасения
  rationale: Русское «спасение» естественно применимо к избавлению от физической гибели и одновременно сохраняет более широкий смысловой диапазон греческого слова; контекст уточняется в сноске.
- source_word: οὐδενὸς γὰρ ὑμῶν
  choice: ни у кого из вас
  rationale: Естественно передаёт распределительное значение греческой родительной конструкции.
- source_word: θρὶξ ἀπὸ τῆς κεφαλῆς
  choice: ни один волос с головы
  rationale: Сохраняет образное заверение в полной безопасности и прямо отражает значение предлога ἀπό.
- source_word: ἀπολεῖται
  choice: не пропадёт
  rationale: В сочетании с «волос» это естественный русский эквивалент значения «не будет утрачен»; фраза остаётся образной, а не превращается в буквальное обещание о выпадении волос.
theological_decisions:
- issue: Значение σωτηρία в контексте
  choice: «спасение» в смысле физического избавления и сохранения жизни
  alternative: «выживание» или «сохранение жизни»; либо духовно-сотериологическое «спасение»
  rationale: Непосредственный контекст — угроза кораблекрушения и обещание, что все находящиеся на судне останутся живы. Основной текст сохраняет широкое греческое слово, а сноска предотвращает ошибочное ограничение смысла духовным спасением.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным тоном. Формулировка «настоятельно прошу» передаёт силу обращения, а «поесть» избегает ненужной книжности. Образ «ни один волос с головы не пропадёт» сохранён как понятная идиома полной безопасности.
