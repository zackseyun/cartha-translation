  text: τῶν δὲ στρατιωτῶν βουλὴ ἐγένετο ἵνα τοὺς δεσμώτας ἀποκτείνωσιν, μή τις ἐκκολυμβήσας διαφύγῃ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/042.yaml
  text: The soldiers’ plan was to kill the prisoners, so that no one might swim away and escape.
translation:
  language: ru
  text: Солдаты решили убить узников, чтобы никто, выплыв, не сбежал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βουλὴ ἐγένετο
  choice: решили
  rationale: Естественно передаёт возникшее у солдат намерение; буквальное «замыслом стало» не соответствует современному русскому употреблению.
- source_word: τοὺς δεσμώτας
  choice: узников
  rationale: Передаёт людей, находящихся под стражей, в уместном для повествования литературном регистре.
- source_word: ἐκκολυμβήσας
  choice: уплыл
  rationale: В контексте кораблекрушения означает спасение вплавь от места крушения; «уплыл» кратко и естественно передаёт эту идею.
- source_word: διαφύγῃ
  choice: не убежал
  rationale: Передаёт конечный побег из-под стражи и сохраняет отдельный смысловой компонент после спасения вплавь.
