  text: ὁ δὲ ἑκατοντάρχης τῷ κυβερνήτῃ καὶ τῷ ναυκλήρῳ ⸂μᾶλλον ἐπείθετο⸃ ἢ τοῖς ⸀ὑπὸ Παύλου λεγομένοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/011.yaml
  text: But the centurion paid more attention to the pilot and the shipowner than to what was being said by Paul[a].
translation:
  language: ru
  text: Но сотник больше доверял кормчему и судовладельцу, чем тому, что говорил Павел[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сотник был больше убеждён доводами кормчего и судовладельца, чем словами Павла».'
    reason: 'Лексическая альтернатива: πείθομαι может прямо указывать на то, что человек был убеждён чьими-либо доводами, а не только доверял говорящему.'
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: сотник
  rationale: Традиционный и понятный русский исторический термин для римского офицера в чине центуриона.
- source_word: κυβερνήτῃ
  choice: кормчему
  rationale: В морском контексте обозначает человека, управляющего судном и отвечающего за его курс; это позволяет отличить его от ναύκληρος.
- source_word: ναυκλήρῳ
  choice: судовладельцу
  rationale: Передаёт наиболее вероятное значение владельца или главного распорядителя судна и сохраняет различие двух морских ролей.
- source_word: μᾶλλον ἐπείθετο
  choice: больше доверял
  rationale: Естественно передаёт сравнительную конструкцию и значение πείθομαι — доверять чьему-либо суждению, поддаваться убеждению — в контексте принятия решения.
- source_word: τοῖς ὑπὸ Παύλου λεγομένοις
  choice: тому, что говорил Павел
  rationale: Естественная русская передача субстантивированного пассивного причастного оборота; несовершенный вид отражает процесс речи, выраженный настоящим причастием.
- source_word: δὲ
  choice: Но
  rationale: Обозначает контраст с предшествующим предостережением Павла.
- source_word: ἢ
  choice: чем
  rationale: Прямая передача сравнительного союза при μᾶλλον.
