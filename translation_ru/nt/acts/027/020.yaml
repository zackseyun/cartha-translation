  text: μήτε δὲ ἡλίου μήτε ἄστρων ἐπιφαινόντων ἐπὶ πλείονας ἡμέρας, χειμῶνός τε οὐκ ὀλίγου ἐπικειμένου, λοιπὸν περιῃρεῖτο ⸂ἐλπὶς πᾶσα⸃ τοῦ σῴζεσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/020.yaml
  text: And when neither sun nor stars appeared for many days[a], and no small storm was pressing on us, from then on all hope of our being saved was gradually taken away.
translation:
  language: ru
  text: Много дней не показывались ни солнце, ни звёзды, а нас одолевала сильная буря; в итоге постепенно угасала всякая надежда на наше спасение[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на наше избавление». Здесь речь идёт о физическом спасении от бури и гибели в море.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφαινόντων
  choice: не показывались
  rationale: Передаёт отсутствие видимости солнца и звёзд в условиях затяжной непогоды, не сводя значение только к их сиянию.
- source_word: ἐπὶ πλείονας ἡμέρας
  choice: много дней
  rationale: Естественно выражает продолжительность в течение значительного числа дней.
- source_word: χειμῶνός
  choice: буря
  rationale: В морском контексте слово обозначает штормовую погоду, а не зимнее время года.
- source_word: οὐκ ὀλίγου
  choice: сильная
  rationale: Передаёт смысл греческой литоты ясным современным русским выражением.
- source_word: ἐπικειμένου
  choice: нас одолевала
  rationale: Выражает длительное, тяжёлое давление бури на находившихся в море людей.
- source_word: λοιπὸν
  choice: в конце концов
  rationale: Отмечает наступивший вследствие затянувшейся опасности итоговый этап, когда надежда начала исчезать.
- source_word: περιῃρεῖτο
  choice: стала постепенно исчезать
  rationale: Передаёт несовершенный вид пассивной формы как разворачивающийся процесс утраты надежды, а не одномоментное событие.
- source_word: ἐλπὶς πᾶσα
  choice: всякая надежда
  rationale: Сохраняет всеохватность греческого выражения и естественно звучит по-русски.
- source_word: τοῦ σῴζεσθαι ἡμᾶς
  choice: на наше спасение
  rationale: Естественно передаёт содержание надежды и сохраняет широкий лексический смысл σῴζω; контекст указывает на физическое избавление от гибели.
theological_decisions:
- issue: Значение σῴζεσθαι в повествовании о морской опасности
  choice: физическое спасение от гибели в море, переданное словом «спасение»
  alternative: «избавление» или «выживание»
  rationale: Контекст кораблекрушения ясно указывает на физическое сохранение жизни, а «спасение» сохраняет обычную лексическую связь с σῴζω без привнесения здесь специального духовного смысла.
translation_notes:
  register: Современный литературный русский язык с повествовательной ясностью и сдержанной торжественностью. Греческая литота передана естественным выражением «сильная буря»; длительность утраты надежды отражена словами «стала постепенно исчезать».
