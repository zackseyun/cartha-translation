  text: συναρπασθέντος δὲ τοῦ πλοίου καὶ μὴ δυναμένου ἀντοφθαλμεῖν τῷ ἀνέμῳ ἐπιδόντες ἐφερόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/015.yaml
  text: And when the ship was caught and could not face the wind[a], we gave way and were driven along.
translation:
  language: ru
  text: Корабль подхватило, и он не мог идти против ветра; тогда мы уступили ветру[a], и нас понесло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мы отдались на его волю, и нас понесло».'
    reason: Лексически возможная передача ἐπιδόντες подчёркивает, что команда перестала сопротивляться ветру и позволила ему нести корабль.
lexical_decisions:
- source_word: συναρπασθέντος
  choice: подхватило
  rationale: Аористное страдательное причастие передаёт внезапное воздействие внешней силы на корабль. Безличная русская конструкция звучит естественно и сохраняет образ корабля, подхваченного бурным ветром.
- source_word: πλοίου
  choice: корабль
  rationale: Обычный и ясный русский эквивалент πλοῖον в данном повествовательном контексте.
- source_word: μὴ δυναμένου
  choice: не мог
  rationale: Причастная конструкция естественно передана личной формой русского глагола, выражающей невозможность продолжать действие.
- source_word: ἀντοφθαλμεῖν
  choice: идти против
  rationale: В морском контексте глагол означает быть обращённым навстречу ветру или противостоять ему. «Идти против ветра» ясно передаёт смысл без буквального, но неестественного «смотреть в лицо ветру».
- source_word: ἀνέμῳ
  choice: ветра
  rationale: Слово ἄνεμος означает «ветер»; более сильное «шторм» определяется контекстом, но не самим существительным.
- source_word: ἐπιδόντες
  choice: мы уступили ветру
  rationale: Причастие обозначает прекращение сопротивления и уступку действующей силе. Добавление «ветру» естественно восполняет подразумеваемый объект, при этом возможная более образная передача отмечена в сноске.
- source_word: ἐφερόμεθα
  choice: нас понесло
  rationale: Имперфект страдательного залога описывает продолжавшееся движение под действием внешней силы. Безличная конструкция кратко и выразительно передаёт потерю управления кораблём.
- source_word: δέ
  choice: и; тогда
  rationale: Частица служит продолжению повествования; русская связь между частями предложения передана сочетанием союза «и» и временно-следственного «тогда».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясной повествовательной интонацией. Морской смысл передан общепонятными словами без устаревшей специальной терминологии; краткие безличные конструкции передают внезапность и беспомощность перед ветром.
