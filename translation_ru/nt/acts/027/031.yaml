id: ACT.27.31
reference: Acts 27:31
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἶπεν ὁ Παῦλος τῷ ἑκατοντάρχῃ καὶ τοῖς στρατιώταις· Ἐὰν μὴ οὗτοι μείνωσιν ἐν τῷ πλοίῳ, ὑμεῖς σωθῆναι οὐ δύνασθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/031.yaml
  text: Paul said to the centurion and the soldiers[a], “Unless these men remain in the ship, you cannot be saved.”
translation:
  language: ru
  text: 'Павел сказал сотнику и воинам: «Если эти люди не останутся на корабле, вам не спастись[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вам не уцелеть». Здесь речь идёт о спасении жизни при кораблекрушении.'
    reason: Лексическая альтернатива поясняет физический смысл σωθῆναι в данном контексте.
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: сотнику
  rationale: Традиционное и точное русское обозначение римского военного чина; понятно в библейско-историческом контексте.
- source_word: οὗτοι
  choice: эти люди
  rationale: Указательное местоимение относится к морякам, пытавшимся покинуть судно; добавление «люди» естественно уточняет подразумеваемое существительное.
- source_word: μείνωσιν
  choice: не останутся
  rationale: Глагол μένω в данном условном высказывании естественно передаётся как «остаться».
- source_word: πλοίῳ
  choice: на корабле
  rationale: πλοῖον здесь обозначает крупное морское судно; «корабль» точно соответствует повествовательному контексту.
- source_word: σωθῆναι
  choice: не спастись
  rationale: Русское «спастись» сохраняет широкое значение греческого σῴζω, тогда как контекст указывает на физическое спасение при кораблекрушении.
- source_word: οὐ δύνασθε
  choice: вам не спастись
  rationale: Инфинитивная русская конструкция естественно и прямо передаёт отрицание возможности οὐ δύνασθε, не утяжеляя фразу буквальным «вы не можете».
theological_decisions:
- issue: Следует ли передать σωθῆναι явно как физическое выживание или сохранить более широкое слово «спастись».
  choice: вам не спастись
  alternative: вы не сможете уцелеть / вам не выжить
  rationale: Непосредственный контекст ясно говорит о спасении жизни во время кораблекрушения, однако «спастись» сохраняет лексическую широту греческого глагола и не вносит в текст лишнего уточнения. Сноска предотвращает ошибочное понимание как исключительно духовного спасения.
translation_notes:
  register: Современный литературный русский язык с умеренно dignified повествовательным регистром. «Сотник» сохраняет привычную библейско-историческую терминологию; реплика Павла передана кратко и естественно.
