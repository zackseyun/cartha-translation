  text: τῶν δὲ ναυτῶν ζητούντων φυγεῖν ἐκ τοῦ πλοίου καὶ χαλασάντων τὴν σκάφην εἰς τὴν θάλασσαν προφάσει ὡς ἐκ πρῴρης ⸂ἀγκύρας μελλόντων⸃ ἐκτείνειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/030.yaml
  text: And when the sailors were seeking to escape from the ship and had lowered the skiff into the sea under the pretense of being about to lay out anchors from the bow[b][a],
translation:
  language: ru
  text: А матросы пытались бежать с корабля и спустили шлюпку[a] в море под предлогом, будто собираются бросить якоря с носа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лодку». Греческое слово обозначает малую лодку при корабле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с передней части корабля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ναυτῶν
  choice: матросы
  rationale: Естественное современное обозначение членов судовой команды; в данном контексте точнее и привычнее, чем «мореходы».
- source_word: ζητούντων φυγεῖν
  choice: пытались бежать
  rationale: Сочетание ζητέω с инфинитивом передаёт попытку или намерение; «бежать» сохраняет оттенок тайного оставления корабля.
- source_word: ἐκ τοῦ πλοίου
  choice: с корабля
  rationale: Естественная русская передача исходного пункта движения.
- source_word: χαλασάντων τὴν σκάφην
  choice: спустили шлюпку
  rationale: σκάφη обозначает малую лодку при корабле; «шлюпка» ясно и уместно в морском контексте, а глагол «спустили» точно передаёт χαλάω.
- source_word: εἰς τὴν θάλασσαν
  choice: на море
  rationale: По-русски лодку обычно «спускают на воду» или «на море»; выбранный вариант сохраняет явное θάλασσα и звучит естественно в повествовании.
- source_word: προφάσει
  choice: под предлогом
  rationale: Передаёт ложную заявленную причину, скрывающую истинное намерение матросов.
- source_word: ὡς
  choice: что
  rationale: После выражения «под предлогом» союз «что» естественно вводит мнимое намерение, не устраняя оттенка притворства.
- source_word: ἐκ πρῴρης
  choice: с носа
  rationale: Точный и общепонятный современный морской термин для передней части судна.
- source_word: ἀγκύρας
  choice: якоря
  rationale: Прямая передача формы множественного числа.
- source_word: μελλόντων ἐκτείνειν
  choice: собираются завести
  rationale: μέλλω выражает намерение, а ἐκτείνω в морском контексте — вынесение якорей на некоторое расстояние от судна; русское «завести якоря» передаёт эту операцию точнее, чем простое «бросить».
