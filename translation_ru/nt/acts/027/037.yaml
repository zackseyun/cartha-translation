lexical_decisions:
- source_word: ἤμεθα
  choice: нас… было
  rationale: Форма первого лица множественного числа сохранена естественной русской безлично-количественной конструкцией, которая включает рассказчика в общее число.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Здесь δέ служит слабой повествовательной связкой; отдельное «же» или «а» в изолированном русском стихе звучало бы неестественно и могло бы создать ложный оттенок противопоставления.
- source_word: αἱ πᾶσαι ψυχαὶ
  choice: всего… человек
  rationale: В данном контексте ψυχαί обозначает людей, находившихся на корабле, а не особо нематериальные души; πᾶσαι передано словом «всего».
- source_word: ἐν τῷ πλοίῳ
  choice: на корабле
  rationale: Это нормативный современный русский способ обозначить людей, находящихся на борту судна.
- source_word: διακόσιαι ἑβδομήκοντα ἕξ
  choice: '276'
  rationale: Точное число передано цифрами для ясности и удобства чтения.
theological_decisions:
- issue: Значение ψυχαί
  choice: человек
  alternative: душ
  rationale: Существительное употреблено как обозначение людей или человеческих жизней при подсчёте находившихся на судне; буквальное «душ» могло бы вызвать здесь неуместное антропологическое толкование.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, повествовательная и естественная. Первое лицо греческого ἤμεθα сохранено словом «нас», а слабая связка δέ не вынесена в отдельное русское слово.
