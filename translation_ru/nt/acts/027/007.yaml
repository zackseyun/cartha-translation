  text: ἐν ἱκαναῖς δὲ ἡμέραις βραδυπλοοῦντες καὶ μόλις γενόμενοι κατὰ τὴν Κνίδον, μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου, ὑπεπλεύσαμεν τὴν Κρήτην κατὰ Σαλμώνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/007.yaml
  text: For many days we were sailing slowly[a], and with difficulty we came opposite Cnidus. Since the wind did not allow us to go farther, we sailed under the lee of Crete[b], off Salmone.
translation:
  language: ru
  text: Много дней мы плыли медленно и с трудом оказались напротив Книда. Поскольку ветер не позволял нам идти дальше[a], мы поплыли под защитой Крита, у Салмоны[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ветер не позволял нам приблизиться». Греческое выражение допускает значение как дальнейшего продвижения, так и приближения к месту.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мы поплыли под Критом», то есть под защитой острова, с его подветренной стороны.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἱκαναῖς δὲ ἡμέραις
  choice: Много дней
  rationale: Оборот обозначает продолжительный период; по-русски естественно передаётся как «много дней».
- source_word: βραδυπλοοῦντες
  choice: мы плыли медленно
  rationale: Сохраняет морской образ и значение медленного продвижения, не смешивая его с последующим μόλις.
- source_word: μόλις γενόμενοι κατὰ τὴν Κνίδον
  choice: с трудом добрались до Книда
  rationale: μόλις указывает на затруднённость, а конструкция с κατά — на достижение района напротив или близ Книда; естественное русское выражение не предполагает высадки.
- source_word: μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου
  choice: Поскольку ветер не позволял нам идти дальше
  rationale: Генитив абсолютный выражает причину изменения курса; дополнение «идти дальше» естественно раскрывает подразумеваемое препятствие движению.
- source_word: ὑπεπλεύσαμεν τὴν Κρήτην
  choice: мы поплыли вдоль подветренной стороны Крита
  rationale: В морском контексте глагол означает движение под защитой острова, с его подветренной стороны.
- source_word: κατὰ Σαλμώνην
  choice: мимо Салмоны
  rationale: κατά при береговом ориентире указывает на прохождение у соответствующего мыса или местности; «мимо» естественно передаёт маршрут.
- source_word: Κνίδον / Κρήτην / Σαλμώνην
  choice: Книд / Крит / Салмона
  rationale: Использованы установившиеся русские формы античных географических названий.
