lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественно передаёт временно-последовательный переход к следующему действию.
- source_word: ἀπέκοψαν
  choice: перерезали
  rationale: Передаёт совершённое физическое действие — канаты были рассечены; в русском морском контексте это естественнее буквального «отрезали».
- source_word: οἱ στρατιῶται
  choice: воины
  rationale: Точное и достойное повествовательное обозначение находившихся на судне римских солдат.
- source_word: τὰ σχοινία
  choice: канаты
  rationale: В контексте судна «канаты» точнее общего «верёвки» и естественно обозначает снасти, удерживавшие шлюпку.
- source_word: τῆς σκάφης
  choice: шлюпки
  rationale: σκάφη обозначает малое судно при основном корабле; «шлюпка» ясно сохраняет это различие.
- source_word: εἴασαν
  choice: дали
  rationale: Естественно передаёт значение «позволили, дали» в сочетании с инфинитивом.
- source_word: αὐτὴν
  choice: ей
  rationale: Местоимение относится к существительному «шлюпка» и согласуется с ним по роду.
- source_word: ἐκπεσεῖν
  choice: отойти от корабля
  rationale: В данном морском контексте передаёт результат отсоединения шлюпки, не сводя значение лишь к вертикальному падению; дополнение «от корабля» делает русскую фразу ясной.
