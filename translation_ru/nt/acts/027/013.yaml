base_translation:
  language: en
  yaml_path: translation/nt/acts/027/013.yaml
  text: And when a south wind began to blow gently[a], thinking that they had obtained their purpose, they weighed anchor and sailed along Crete[c][b], close inshore.
translation:
  language: ru
  text: Когда начал дуть слабый южный ветер, они, полагая, что достигли намеченной цели, подняли якорь[a] и поплыли вдоль Крита, держась ближе к берегу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «подняв»; в морском контексте подразумевается якорь.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «поплыли вдоль Крита ближе к берегу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποπνεύσαντος δὲ νότου
  choice: Когда подул лёгкий южный ветер
  rationale: Оборот передаёт начало слабого, благоприятного южного ветра; «лёгкий» естественно выражает значение ὑποπνέω.
- source_word: δόξαντες
  choice: они решили
  rationale: Здесь δοκέω обозначает субъективную оценку ситуации; «решили» передаёт вывод моряков, не утверждая его истинность.
- source_word: τῆς προθέσεως κεκρατηκέναι
  choice: что смогут осуществить свой замысел
  rationale: Сочетание указывает на уверенность, что намеченная цель теперь достижима. Будущая направленность замысла в русском контексте естественно передаётся словом «смогут», хотя греческий перфект буквально выражает мысль, что цель уже обеспечена.
- source_word: ἄραντες
  choice: подняли якорь
  rationale: У αἴρω объект не назван, но морской контекст ясно подразумевает снятие с якоря; русское выражение понятно и точно.
- source_word: παρελέγοντο τὴν Κρήτην
  choice: поплыли вдоль Крита
  rationale: Морское παραλέγομαι означает идти вдоль побережья; добавлять слово «побережье» необязательно.
- source_word: ἆσσον
  choice: держась близко к берегу
  rationale: Сравнительное наречие означает «ближе»; в данном морском контексте берег подразумевается и естественно называется по-русски.
