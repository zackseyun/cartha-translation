base_translation:
  language: en
  yaml_path: translation/nt/acts/027/040.yaml
  text: And after casting off the anchors[a], they left them in the sea; at the same time loosening the ropes of the rudders, and hoisting the foresail to the wind[b], they made for the beach.
translation:
  language: ru
  text: Освободив якоря, они оставили их в море; одновременно, ослабив крепления рулевых вёсел[a] и подняв носовой парус, подставив его дующему ветру[b], взяли курс на берег.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «связи» или «крепления рулей». Редкое греческое морское слово обозначает то, чем удерживалось или закреплялось рулевое устройство.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «верхний парус» или «парус на носу». Точное значение редкого греческого морского термина неясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιελόντες τὰς ἀγκύρας
  choice: освободив якоря
  rationale: Причастие обозначает предшествующее действие. В данном морском контексте якоря отсоединили от судна и бросили; формулировка не уточняет сверх греческого текста, были ли канаты перерезаны или отвязаны.
- source_word: εἴων εἰς τὴν θάλασσαν
  choice: они оставили их в море
  rationale: ἐάω здесь означает «оставить, отпустить»; подразумеваемое дополнение — только что упомянутые якоря.
- source_word: ἅμα
  choice: одновременно
  rationale: Передаёт одновременность освобождения рулевого устройства с действиями над якорями и парусом.
- source_word: ἀνέντες τὰς ζευκτηρίας τῶν πηδαλίων
  choice: развязали крепления рулевых вёсел
  rationale: ἀνίημι указывает на ослабление или освобождение, а редкое ζευκτηρία — на связки либо крепления. Множественное πηδάλια соответствует парным рулевым вёслам древнего судна, а не одному современному рулю.
- source_word: ἐπάραντες τὸν ἀρτέμωνα
  choice: подняли носовой парус
  rationale: ἐπαίρω естественно передаётся как «поднять» применительно к парусу. ἀρτέμων — редкий морской термин; «носовой парус» является вероятным, но не бесспорным обозначением, поэтому неопределённость отмечена в сноске.
- source_word: τῇ πνεούσῃ
  choice: по ветру
  rationale: Субстантивированное причастие от πνέω подразумевает дующий ветер; русское выражение естественно описывает постановку паруса под ветер.
- source_word: κατεῖχον εἰς τὸν αἰγιαλόν
  choice: направились к берегу
  rationale: κατέχω имеет здесь морское значение движения или удержания курса к цели, а αἰγιαλός обозначает береговую полосу, пляж.
