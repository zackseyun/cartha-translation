lexical_decisions:
- source_word: μόλις
  choice: с трудом
  rationale: Передаёт, что продвижение удалось лишь с большим трудом, и естественно звучит в повествовании.
- source_word: παραλεγόμενοι αὐτήν
  choice: продвигаясь вдоль его берега
  rationale: В морском контексте παραλέγομαι означает идти вдоль побережья; местоимение относится к Криту из предыдущего контекста. Добавление «берега» делает морской смысл ясным по-русски, не меняя референта.
- source_word: εἰς τόπον τινά
  choice: в одно место
  rationale: Сохраняет неопределённость τινά и звучит естественнее современного буквального «в некое место».
- source_word: Καλοὺς Λιμένας
  choice: Хорошие Пристани
  rationale: Название передано семантически и в форме, узнаваемой в русской библейской традиции; множественное число соответствует греческому тексту.
- source_word: ᾧ ἐγγὺς ἦν πόλις Λασαία
  choice: неподалёку от него находился город Ласея
  rationale: Относительное местоимение соотнесено с местом Хорошие Пристани; конструкция естественно передаёт близость и не придаёт городу лишней определённости.
