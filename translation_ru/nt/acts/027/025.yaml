  text: διὸ εὐθυμεῖτε, ἄνδρες· πιστεύω γὰρ τῷ θεῷ ὅτι οὕτως ἔσται καθ’ ὃν τρόπον λελάληταί μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/025.yaml
  text: Therefore[a], take courage, men, for I believe God that it will be just as it has been told to me.
translation:
  language: ru
  text: 'Мужчины, мужайтесь: я верю Богу[a], что всё будет именно так, как мне было сказано.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я доверяю Богу». Греческая конструкция может подчёркивать как доверие Богу, так и веру в сказанное Им.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего заверения и сохраняет ясную логическую связь.
- source_word: εὐθυμεῖτε
  choice: мужайтесь
  rationale: Естественный и достойный русский императив, призывающий сохранять бодрость и уверенность перед лицом опасности.
- source_word: ἄνδρες
  choice: мужчины
  rationale: Сохраняет прямое обращение к находившимся на корабле взрослым мужчинам, не нейтрализуя значение ἀνήρ.
- source_word: πιστεύω τῷ θεῷ
  choice: я верю Богу
  rationale: Конструкция с дательным падежом естественно означает, что Павел принимает Божье слово за истину; русский оборот сохраняет и личное доверие, и веру сказанному.
- source_word: ὅτι
  choice: что
  rationale: Вводит содержание веры Павла, а не её причину.
- source_word: οὕτως ἔσται καθ’ ὃν τρόπον
  choice: всё будет именно так, как
  rationale: Естественно передаёт точное соответствие будущих событий сообщённому Павлу слову.
- source_word: λελάληταί μοι
  choice: мне было сказано
  rationale: Сохраняет пассивную форму и не называет говорящего прямо там, где греческий текст оставляет его подразумеваемым; контекст указывает на Божье послание.
theological_decisions:
- issue: Передача πιστεύω τῷ θεῷ
  choice: я верю Богу
  alternative: я доверяю Богу
  rationale: «Верю Богу» точнее сохраняет смысл принятия Божьих слов за истину, тогда как «доверяю Богу» сильнее подчёркивает личное упование. Примечание сохраняет обе возможные смысловые стороны конструкции.
translation_notes:
  register: Современный литературный русский язык с ясным, но dignified библейским регистром. «Мужайтесь» уместно в кризисной обстановке; обращение «мужчины» точно, хотя несколько маркировано в современном русском. Добавлено «всё» для естественности фразы без изменения содержания.
