base_translation:
  language: en
  yaml_path: translation/nt/acts/027/009.yaml
  text: Since considerable time had passed and the voyage was already dangerous[a], because even the Fast had already gone by, Paul was advising them[b],
translation:
  language: ru
  text: 'Прошло уже немало времени, и плавание уже было опасным, поскольку даже Пост уже миновал; Павел советовал им:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἱκανοῦ ... χρόνου διαγενομένου
  choice: Прошло уже немало времени
  rationale: Передаёт значительный промежуток времени и естественно воспроизводит временную генитивную абсолютную конструкцию.
- source_word: ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς
  choice: плавание стало опасным
  rationale: πλοῦς обозначает плавание или морской путь, а ἐπισφαλής — опасность такого предприятия; русский глагол «стало» естественно показывает сложившуюся к тому времени ситуацию.
- source_word: διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι
  choice: поскольку даже Пост уже миновал
  rationale: Сохраняет причинное значение διά с артиклевым инфинитивом, усилительное καί («даже») и завершённость действия перфектного инфинитива.
- source_word: τὴν νηστείαν
  choice: Пост
  rationale: Определённая форма указывает на известный читателям ежегодный иудейский пост; прописная буква обозначает конкретное соблюдение, не вставляя толкование непосредственно в текст.
- source_word: παρῄνει
  choice: советовал им
  rationale: Имперфект и значение παραινέω переданы как продолжающееся или вводящее речь наставление без усиления до «предупреждал».
