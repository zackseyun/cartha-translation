  yaml_path: translation/nt/acts/027/028.yaml
  text: And after taking soundings[a], they found twenty fathoms; then after going a little farther and taking soundings again, they found fifteen fathoms.
translation:
  language: ru
  text: Сделав промер глубины[a], они обнаружили двадцать морских саженей; продвинувшись немного дальше, они снова сделали промер и обнаружили пятнадцать морских саженей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «бросив лот». Лот — груз на лине, которым измеряли глубину; греческая мера здесь приблизительно равна морской сажени (около 1,8 м).'
    reason: lexical_alternative
lexical_decisions:
- source_word: βολίσαντες
  choice: измерив глубину
  rationale: Глагол обозначает промер глубины с помощью лота. Естественное русское выражение ясно передаёт действие, а примечание сохраняет конкретный образ бросания лота.
- source_word: εὗρον
  choice: обнаружили
  rationale: Аорист сообщает полученный при измерении результат; «обнаружили» естественно сочетается с указанием глубины.
- source_word: ὀργυιὰς
  choice: саженей
  rationale: ὀργυιά — мера длины, приблизительно равная размаху рук и близкая русской сажени; в морском контексте здесь обозначает измеренную глубину. Такой перевод сохраняет древнюю меру без искусственной метризации.
- source_word: εἴκοσι
  choice: двадцать
  rationale: Прямая передача числительного.
- source_word: βραχὺ
  choice: немного дальше
  rationale: Наречное употребление указывает на небольшой пройденный отрезок; «дальше» естественно выражает подразумеваемое продвижение судна.
- source_word: διαστήσαντες
  choice: пройдя
  rationale: В данном повествовательном контексте причастие означает продвижение на некоторое расстояние.
- source_word: πάλιν
  choice: снова
  rationale: Передаёт повторение промера.
- source_word: δεκαπέντε
  choice: пятнадцать
  rationale: Прямая передача числительного.
- source_word: καὶ ... δὲ ... καὶ
  choice: …; … снова … и …
  rationale: Связки здесь главным образом последовательно развивают повествование; точка с запятой естественно отделяет второй промер от первого.
