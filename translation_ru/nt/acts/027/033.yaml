lexical_decisions:
- source_word: Ἄχρι δὲ οὗ ἡμέρα ἤμελλεν γίνεσθαι
  choice: А до наступления рассвета
  rationale: Передаёт временной предел и близость наступления дня; «рассвет» естественно выражает появление дневного света в данном контексте.
- source_word: παρεκάλει
  choice: всё убеждал
  rationale: Несовершенный вид греческого глагола указывает на продолжавшееся или повторявшееся настойчивое обращение.
- source_word: ἅπαντας μεταλαβεῖν τροφῆς
  choice: убеждал всех поесть
  rationale: Естественная современная русская формулировка, сохраняющая всеобщий охват и призыв принять пищу.
- source_word: Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν
  choice: Сегодня уже четырнадцатый день
  rationale: Сохраняет акцент оригинала на текущем дне как четырнадцатом; «уже» естественно подчёркивает длительность.
- source_word: προσδοκῶντες
  choice: в тревожном ожидании
  rationale: Причастие обозначает ожидание; контекст шторма позволяет передать сопровождающую его напряжённость, не превращая это в отдельное утверждение о страхе.
- source_word: ἄσιτοι διατελεῖτε
  choice: остаётесь без пищи
  rationale: Передаёт продолжительное пребывание без еды и не создаёт оттенка добровольного религиозного поста.
- source_word: μηθὲν προσλαβόμενοι
  choice: ничего не едите
  rationale: Естественно передаёт поясняющее и усилительное указание на то, что они не принимали пищи.
