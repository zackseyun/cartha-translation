lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Оттуда
  rationale: Естественно передаёт καί + ἐκεῖθεν в последовательном повествовании; связь с предыдущим событием ясна без обязательного отдельного «и».
- source_word: ἀναχθέντες
  choice: мы вышли в море
  rationale: Передаёт морское употребление ἀνάγω — отплыть, выйти в море; последовательность действий выражена сочинением, естественным для современного русского языка.
- source_word: ὑπεπλεύσαμεν
  choice: поплыли вдоль защищённой от ветра стороны
  rationale: Морской глагол ὑποπλέω обозначает движение с подветренной, укрытой стороны острова. Развёрнутая формулировка понятнее обычному читателю, чем специальное «с подветренной стороны».
- source_word: τὴν Κύπρον
  choice: Кипра
  rationale: Общепринятое русское название острова; родительный падеж обусловлен оборотом «вдоль ... стороны».
- source_word: διὰ τὸ ... εἶναι
  choice: потому что ... были
  rationale: διά с субстантивированным инфинитивом выражает причину; русский причинный союз передаёт её ясно и естественно.
- source_word: τοὺς ἀνέμους
  choice: ветры
  rationale: Сохраняет множественное число греческого существительного.
- source_word: ἐναντίους
  choice: встречными
  rationale: В морском контексте точно и естественно обозначает ветры, дующие против курса судна, не добавляя отдельного объекта «нам».
