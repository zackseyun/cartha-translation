base_translation:
  language: en
  yaml_path: translation/nt/acts/027/041.yaml
  text: But falling into a place where two seas met[a], they ran the ship aground; and the bow, having stuck fast, remained immovable, but the stern was being broken up by the force.
translation:
  language: ru
  text: Но, попав в место, где сходились два моря[a], они посадили корабль на мель. Нос корабля, прочно застряв, остался неподвижен, а корма разрушалась от напора.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в место между двумя морями». Редкое греческое выражение может обозначать пролив, отмель либо место встречи двух водоёмов или течений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπεσόντες
  choice: попав
  rationale: Аористное причастие описывает внезапное попадание корабля в опасное место; нейтральное «попав» не уточняет сверх текста, столкнулся ли корабль с отмелью или вошёл в течение.
- source_word: τόπον διθάλασσον
  choice: место, где сходились два моря
  rationale: Редкое διθάλασσος связано с двумя морями или водными потоками. Перевод сохраняет образ и не вводит более конкретную «отмель», хотя контекст её допускает.
- source_word: ἐπέκειλαν τὴν ναῦν
  choice: посадили корабль на мель
  rationale: ἐπικέλλω — морской термин о посадке судна на мель; это естественное и точное русское выражение.
- source_word: πρῷρα
  choice: нос корабля
  rationale: Общепонятный современный русский морской термин; повтор «корабля» помогает ясности после границы предложения.
- source_word: ἐρείσασα
  choice: прочно застряв
  rationale: Передаёт значение ἐρείδω — упереться, прочно закрепиться — и результирующее состояние носовой части.
- source_word: ἔμεινεν ἀσάλευτος
  choice: остался неподвижен
  rationale: Точно передаёт, что нос корабля оставался прочно на месте и не двигался.
- source_word: πρύμνα
  choice: корма
  rationale: Стандартный и общеупотребительный русский термин для задней части судна.
- source_word: ἐλύετο
  choice: разрушалась
  rationale: Имперфект пассива изображает продолжавшееся разрушение кормы, а не одномоментный результат.
- source_word: ὑπὸ τῆς βίας
  choice: под напором воды
  rationale: βία обозначает силу или напор. В морском контексте речь идёт о воздействии воды; «воды» делает подразумеваемый источник силы ясным, не сужая его непременно до волн.
