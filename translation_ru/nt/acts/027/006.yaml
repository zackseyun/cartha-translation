  text: κἀκεῖ εὑρὼν ὁ ⸀ἑκατοντάρχης πλοῖον Ἀλεξανδρῖνον πλέον εἰς τὴν Ἰταλίαν ἐνεβίβασεν ἡμᾶς εἰς αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/006.yaml
  text: There the centurion found an Alexandrian ship sailing for Italy[a], and he put us on board it.
translation:
  language: ru
  text: Там сотник нашёл александрийский корабль, шедший в Италию, и посадил нас на него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖ
  choice: Там
  rationale: Сложное слово может означать «и там»; в русском повествовании союз естественно опускается без потери последовательности.
- source_word: εὑρὼν
  choice: нашёл
  rationale: Предшествующее главному глаголу аористное причастие естественно передано личной формой, обозначающей первое действие в последовательности.
- source_word: ἑκατοντάρχης
  choice: сотник
  rationale: Традиционное и понятное русское обозначение римского военного чина центуриона.
- source_word: πλοῖον Ἀλεξανδρῖνον
  choice: александрийский корабль
  rationale: Прилагательное указывает на связь корабля с Александрией — вероятнее всего, его происхождение или порт приписки, не уточняя это сверх текста.
- source_word: πλέον εἰς τὴν Ἰταλίαν
  choice: шедший в Италию
  rationale: Причастие πλέων описывает движение корабля морем к месту назначения; по-русски «корабль, шедший в Италию» звучит естественно и ясно.
- source_word: ἐνεβίβασεν ἡμᾶς εἰς αὐτό
  choice: посадил нас на него
  rationale: 'Глагол имеет каузативный смысл: сотник велел или помог им подняться на борт; выбранная формулировка ясно передаёт посадку на корабль.'
