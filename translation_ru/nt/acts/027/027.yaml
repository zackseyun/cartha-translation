  text: Ὡς δὲ τεσσαρεσκαιδεκάτη νὺξ ἐγένετο διαφερομένων ἡμῶν ἐν τῷ Ἀδρίᾳ, κατὰ μέσον τῆς νυκτὸς ὑπενόουν οἱ ναῦται προσάγειν τινὰ αὐτοῖς χώραν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/027.yaml
  text: When the fourteenth night had come[a], as we were being driven along in the Adriatic Sea[b], about midnight the sailors began to suspect that some land was drawing near to them.
translation:
  language: ru
  text: Когда наступила четырнадцатая ночь и нас носило по Адриатическому морю[a], около полуночи моряки стали догадываться, что приближаются к какой-то земле[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Древнее название «Адрия» могло обозначать не только современное Адриатическое море, но и более обширную часть центрального Средиземноморья.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «что к ним приближается какая-то земля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσαρεσκαιδεκάτη νὺξ ἐγένετο
  choice: наступила четырнадцатая ночь
  rationale: Оборот с ἐγένετο обозначает наступление указанного времени; выбран естественный русский временной оборот, сохраняющий последовательность событий.
- source_word: διαφερομένων ἡμῶν
  choice: нас носило
  rationale: Страдательное причастие передаёт продолжающееся, неуправляемое движение судна под действием стихии. Безличное «нас носило» естественно выражает это по-русски.
- source_word: ἐν τῷ Ἀδρίᾳ
  choice: по Адриатическому морю
  rationale: Использовано привычное современному читателю географическое название; более широкое значение древнего названия «Адрия» пояснено в сноске.
- source_word: κατὰ μέσον τῆς νυκτός
  choice: около полуночи
  rationale: Передаёт как середину ночи, так и приблизительность выражения κατά.
- source_word: ὑπενόουν
  choice: стали догадываться
  rationale: Имперфект допускает начинательное значение, а глагол выражает предположение по косвенным признакам, а не достоверное знание.
- source_word: προσάγειν τινὰ αὐτοῖς χώραν
  choice: что приближаются к какой-то земле
  rationale: Естественная русская перестройка передаёт восприятие моряков и неопределённость τινά. Необычная греческая перспектива, буквально представляющая землю приближающейся к ним, сохранена в сноске.
theological_decisions: []
