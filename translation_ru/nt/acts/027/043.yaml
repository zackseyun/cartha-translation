lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: сотник
  rationale: Устоявшееся русское наименование римского военного офицера; оно точно и естественно передаёт должность.
- source_word: βουλόμενος
  choice: желая
  rationale: Причастие выражает желание и намерение сотника, не усиливая его до твёрдого решения.
- source_word: διασῶσαι
  choice: спасти
  rationale: В данном контексте речь идёт о сохранении Павлу жизни; «спасти» передаёт это кратко и ясно.
- source_word: ἐκώλυσεν αὐτοὺς τοῦ βουλήματος
  choice: помешал им осуществить задуманное
  rationale: Оборот означает, что сотник воспрепятствовал исполнению намерения воинов, упомянутого в предыдущем стихе.
- source_word: ἐκέλευσέν τε
  choice: и приказал
  rationale: Передаёт властное распоряжение сотника естественным современным русским языком.
- source_word: τοὺς δυναμένους κολυμβᾶν
  choice: тем, кто умеет плавать
  rationale: Ясно обозначает группу людей, способных добраться до суши вплавь.
- source_word: ἀπορίψαντας
  choice: прыгнуть за борт
  rationale: Контекстуально передаёт буквальный образ «бросившись [с корабля]» без неестественной кальки.
- source_word: πρώτους
  choice: первыми
  rationale: 'Сохраняет указание на очерёдность: умеющие плавать должны были покинуть корабль раньше остальных.'
- source_word: ἐπὶ τὴν γῆν ἐξιέναι
  choice: добраться до берега
  rationale: Естественно передаёт движение из моря на сушу; «берег» конкретизирует подразумеваемую границу суши в морском контексте.
