  text: λέγων αὐτοῖς· Ἄνδρες, θεωρῶ ὅτι μετὰ ὕβρεως καὶ πολλῆς ζημίας οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ τῶν ψυχῶν ἡμῶν μέλλειν ἔσεσθαι τὸν πλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/010.yaml
  text: saying to them[a], “Men, I perceive that the voyage is about to be with disaster and great loss, not only of the cargo and the ship[b], but also of our lives.”
translation:
  language: ru
  text: 'говоря им: «Мужи! Я вижу, что плавание грозит бедствием и большими потерями — не только груза и корабля, но и наших жизней[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «душ». Здесь имеются в виду жизни людей, которым угрожает гибель.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: говоря им
  rationale: Причастный оборот передаёт сопутствующее действие и сохраняет связь с предшествующим повествованием.
- source_word: Ἄνδρες
  choice: Мужи
  rationale: Прямое обращение к мужчинам на корабле; «мужи» сохраняет форму оригинала и уместно в dignified современном библейском повествовании.
- source_word: θεωρῶ
  choice: Я вижу
  rationale: Здесь глагол означает осмысленное наблюдение и заключение, а не только физическое зрение; по-русски «вижу» естественно передаёт такое суждение.
- source_word: μετὰ ὕβρεως καὶ πολλῆς ζημίας
  choice: будет сопряжено с бедствием и большим ущербом
  rationale: Оборот описывает тяжёлые, разрушительные последствия плавания. «Бедствие» передаёт контекстуальный смысл ὕβρις без неуместного здесь нравственного значения «дерзость», а «ущерб» соответствует ζημία.
- source_word: οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ
  choice: не только для груза и корабля, но и для
  rationale: Русская конструкция с «ущербом для» ясно и естественно выражает отношение греческих родительных форм к предполагаемой утрате.
- source_word: τῶν ψυχῶν ἡμῶν
  choice: наших жизней
  rationale: В контексте угрозы кораблекрушения ψυχαί обозначает человеческие жизни; перевод «душ» мог бы ошибочно сузить смысл до нематериальной стороны человека.
- source_word: μέλλειν ἔσεσθαι
  choice: будет
  rationale: В составе θεωρῶ ὅτι конструкция выражает ожидаемый характер предстоящего плавания. Простое русское будущее звучит естественно и не усиливает значение до обязательной немедленности.
- source_word: τὸν πλοῦν
  choice: плавание
  rationale: Точно обозначает морской переход и естественно соответствует контексту.
theological_decisions:
- issue: Значение ψυχή в контексте смертельной опасности
  choice: жизнь
  alternative: душа
  rationale: Речь идёт о возможной гибели находящихся на корабле, поэтому контекстуальное значение — физическая жизнь. Сноска сохраняет буквальную лексическую альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Обращение «Мужи!» сохраняет гендерную и стилистическую форму оригинала; остальная фраза построена естественно для современного читателя.
