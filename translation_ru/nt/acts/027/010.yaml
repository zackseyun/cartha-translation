  source_fidelity: 'Смысл в целом передан точно: Павел обращается к мужчинам на корабле и предвидит, что плавание повлечёт бедствие и значительные потери, включая человеческие жизни. Однако сочетание «ущербом — не только для груза и корабля, но и для наших жизней» семантически и синтаксически неудачно: ущерб может быть причинён грузу и кораблю, но выражение «ущерб для жизней» не передаёт прямо ожидаемую утрату жизней. Греческие родительные формы естественнее передать как «потери груза, корабля и наших жизней».'
