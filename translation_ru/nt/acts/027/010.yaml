  terminology: «Плавание» точно передаёт πλοῦς; «груз» — φορτίον; «жизни» верно передаёт ψυχαί в данном контексте. Сноска уместно отмечает буквальное «душ», не навязывая богословского смысла. «Бедствие» приемлемо для ὕβρις в морском контексте, а «большие потери» естественно передаёт πολλὴ ζημία.
