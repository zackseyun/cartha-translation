  text: But we must run aground on some island[a].
translation:
  language: ru
  text: Но нас должно выбросить на какой-нибудь остров[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нам придётся сесть на мель у какого-то острова».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέ
  choice: Но
  rationale: Передаёт лёгкое противопоставление предыдущей мысли и естественно связывает высказывание с контекстом.
- source_word: δεῖ
  choice: предстоит
  rationale: Выражает обусловленную необходимость, при этом естественно звучит в данном предсказании; оттенок необходимости не сводится к намерению людей.
- source_word: ἡμᾶς
  choice: нам
  rationale: Передаёт субъект инфинитива в греческой конструкции с δεῖ естественной русской безличной конструкцией.
- source_word: εἰς νῆσον τινα
  choice: у какого-то острова
  rationale: Сохраняет указание на неопределённый остров; в сочетании с русским морским выражением «сесть на мель» предлог «у» звучит естественно.
- source_word: ἐκπεσεῖν
  choice: сесть на мель
  rationale: В морском контексте глагол обозначает вынужденное достижение берега или посадку на мель; выбран общеупотребительный и понятный русский морской оборот, а более буквальная альтернатива вынесена в сноску.
