  yaml_path: translation/nt/acts/027/019.yaml
  text: And on the third day they threw the ship’s gear overboard with their own hands[a].
translation:
  language: ru
  text: А на третий день они собственными руками выбросили за борт корабельное снаряжение.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они сами выбросили корабельное снаряжение».'
    reason: 'Лексическая альтернатива для αὐτόχειρες: возможна передача через усилительное «сами», хотя «собственными руками» полнее сохраняет образность исходного выражения.'
lexical_decisions:
- source_word: τῇ τρίτῃ
  choice: на третий день
  rationale: Дательный падеж с порядковым числительным выражает время; слово «день» подразумевается и естественно восполняется по-русски.
- source_word: αὐτόχειρες
  choice: собственными руками
  rationale: Передаёт усиленное указание на то, что находившиеся на судне лично совершили это действие, а не просто значение возвратного местоимения.
- source_word: τὴν σκευὴν τοῦ πλοίου
  choice: корабельное снаряжение
  rationale: В морском контексте σκευή обозначает оснащение или снаряжение судна; сочетание естественно передаёт также родительный τοῦ πλοίου.
- source_word: ἔρριψαν
  choice: выбросили за борт
  rationale: Глагол означает «бросили, выбросили»; направление с корабля в море ясно из контекста и идиоматично выражается словами «за борт».
