  text: And when they had eaten enough[c][b][a], they began to lighten the ship by throwing the wheat into the sea.
translation:
  language: ru
  text: Насытившись пищей[a], они стали облегчать[b] корабль, выбрасывая пшеницу[c] в море.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда они насытились пищей»; также возможно: «наевшись досыта».'
