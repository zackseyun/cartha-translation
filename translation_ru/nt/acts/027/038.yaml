    text: 'Или: «зерно». Греческое слово может иметь более широкое значение, хотя здесь, вероятнее всего, имеется в виду пшеница.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κορεσθέντες … τροφῆς
  choice: насытившись пищей
  rationale: Аористное страдательное причастие вместе с родительным τροφῆς передаёт состояние насыщения после еды. Русское деепричастие естественно выражает предшествующее обстоятельство, не устраняя возможного временного оттенка «когда насытились».
- source_word: δὲ
  choice: связь передана последовательностью повествования без отдельного союза
  rationale: Здесь δέ служит слабым повествовательным связующим элементом. В русском после деепричастного оборота отдельное «и» было бы избыточным.
- source_word: ἐκούφιζον
  choice: стали облегчать
  rationale: Имперфект обозначает разворачивающееся действие и допускает начинательное понимание. «Стали облегчать» естественно передаёт начало процесса.
- source_word: τὸ πλοῖον
  choice: корабль
  rationale: В контексте морского плавания πλοῖον обозначает крупное судно; общеупотребительное «корабль» здесь ясно и уместно.
- source_word: ἐκβαλλόμενοι
  choice: выбрасывая
  rationale: Причастие настоящего времени поясняет средство, которым облегчали корабль. Деепричастие сохраняет эту связь без добавления отсутствующего в греческом слова «за борт».
- source_word: τὸν σῖτον
  choice: пшеницу
  rationale: σῖτος может означать зерно вообще, но в данном контексте наиболее вероятно конкретное значение «пшеница».
- source_word: εἰς τὴν θάλασσαν
  choice: в море
  rationale: Прямо и естественно передаёт направление действия в морском контексте.
