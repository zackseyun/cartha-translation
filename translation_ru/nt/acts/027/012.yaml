id: ACT.27.12
reference: Acts 27:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀνευθέτου δὲ τοῦ λιμένος ὑπάρχοντος πρὸς παραχειμασίαν οἱ πλείονες ἔθεντο βουλὴν ἀναχθῆναι ⸀ἐκεῖθεν, εἴ πως δύναιντο καταντήσαντες εἰς Φοίνικα παραχειμάσαι, λιμένα τῆς Κρήτης βλέποντα κατὰ λίβα καὶ κατὰ χῶρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/012.yaml
  text: And because the harbor was unsuitable for wintering[a], the majority decided to put out from there[c][b], if somehow they might reach Phoenix and spend the winter there—a harbor of Crete facing southwest and northwest.
translation:
  language: ru
  text: Поскольку гавань была непригодна для зимовки, большинство решило выйти оттуда в море, чтобы, если удастся, добраться до Финика[a] и перезимовать там. Это критская гавань, обращённая на юго-запад и северо-запад[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Финик — гавань на острове Крит; в некоторых переводах название передаётся как «Феникс».
    reason: cultural_note
  - marker: b
    text: Последнее указание направлений в греческом тексте допускает разные толкования. Традиционный перевод — «на юго-запад и северо-запад»; второе направление иногда понимают точнее как «на западо-северо-запад».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνευθέτου
  choice: непригодна
  rationale: Передаёт практическую непригодность гавани для указанной цели — зимовки — естественным современным русским языком.
- source_word: λιμένος
  choice: гавань
  rationale: В морском повествовании речь идёт прежде всего о защищённом месте стоянки судов, а не обязательно о городе или крупном торговом порте.
- source_word: πρὸς παραχειμασίαν
  choice: для зимовки
  rationale: 'Кратко и точно выражает назначение: пребывание в гавани в течение зимнего сезона.'
- source_word: οἱ πλείονες
  choice: большинство
  rationale: Субстантивированная сравнительная форма обозначает большую часть участвовавших в обсуждении.
- source_word: ἔθεντο βουλήν
  choice: решило
  rationale: Естественно передаёт идиому со значением принятия общего решения.
- source_word: ἀναχθῆναι ἐκεῖθεν
  choice: выйти оттуда в море
  rationale: ἀνάγω здесь употреблено как морской термин, обозначающий отход судна и выход в море.
- source_word: εἴ πως δύναιντο
  choice: если удастся
  rationale: Сохраняет оттенок неопределённой возможности и надежды на благополучный исход.
- source_word: καταντήσαντες εἰς Φοίνικα
  choice: добраться до Финика
  rationale: Передаёт достижение намеченного места назначения; «Финик» соответствует традиционной русской передаче названия критской гавани.
- source_word: παραχειμάσαι
  choice: перезимовать там
  rationale: Естественно обозначает пребывание в данном месте на протяжении зимы.
- source_word: βλέποντα κατὰ λίβα καὶ κατὰ χῶρον
  choice: обращённая на юго-запад и северо-запад
  rationale: Передаёт традиционное понимание ориентации гавани, не скрывая в примечании трудность второго направления.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясной повествовательной синтаксической структурой. Морской термин передан понятно для широкого читателя; неопределённость εἴ πως сохранена оборотом «если удастся». Длинное греческое предложение разделено на два без изменения логических связей.
