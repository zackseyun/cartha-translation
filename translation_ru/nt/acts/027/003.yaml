    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἑτέρᾳ
  choice: на следующий день
  rationale: В повествовательной последовательности временной дательный указывает на следующий день; это естественная современная русская формулировка.
- source_word: κατήχθημεν εἰς Σιδῶνα
  choice: мы пристали к Сидону
  rationale: В морском контексте κατάγω обозначает заход судна к берегу или в порт; «пристали к Сидону» сохраняет морской оттенок.
- source_word: φιλανθρώπως ... χρησάμενος
  choice: отнёсся к Павлу по-доброму
  rationale: Сочетание означает благожелательное, человечное обращение; выбранная формулировка естественна и не теряет оттенка личной доброты.
- source_word: ἐπέτρεψεν
  choice: позволил
  rationale: Точно передаёт предоставление разрешения и звучит естественно в современном русском повествовании.
- source_word: πρὸς τοὺς φίλους
  choice: к друзьям
  rationale: Артикль указывает на известных Павлу людей в Сидоне; по-русски притяжательность понятна из контекста.
- source_word: πορευθέντι
  choice: пойти
  rationale: Аористное причастие при глаголе разрешения естественно передаётся русским инфинитивом.
- source_word: ἐπιμελείας τυχεῖν
  choice: получить от них необходимую помощь
  rationale: Выражение широко обозначает получение заботы, ухода или практического содействия; «необходимая помощь» ясно передаёт контекст, не сужая его до медицинского ухода.
