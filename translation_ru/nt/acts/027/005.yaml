  text: After sailing across the open sea along Cilicia and Pamphylia[b][a], we came down to Myra in Lycia.
translation:
  language: ru
  text: Проплыв по открытому морю вдоль Киликии и Памфилии[a], мы прибыли в Миры Ликийские[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у берегов Киликии и Памфилии».'
    reason: lexical_alternative
  - marker: b
