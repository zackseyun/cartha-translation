    reason: lexical_alternative
lexical_decisions:
- source_word: πέλαγος
  choice: открытое море
  rationale: Слово обозначает открытое морское пространство, а не море вообще; перевод сохраняет эту морскую конкретность.
- source_word: τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν
  choice: вдоль Киликии и Памфилии
  rationale: κατά с винительным падежом в данном географическом обороте указывает на путь вдоль побережья или в водах у названных областей.
- source_word: διαπλεύσαντες
  choice: переплыв
  rationale: Аористное причастие обозначает действие, завершившееся до действия основного глагола; деепричастие естественно передаёт последовательность.
- source_word: κατήλθομεν
  choice: мы прибыли
  rationale: Хотя глагол буквально означает «сошли/спустились», в повествовании о путешествии он естественно обозначает прибытие; буквальный оттенок отмечен в сноске.
- source_word: Μύρα τῆς Λυκίας
  choice: Миры Ликийские
  rationale: Родительный падеж указывает на область, где находился город; традиционная и понятная русская форма точно отличает Миры в Ликии.
- source_word: τε
  choice: связь передана ходом повествования
  rationale: Частица слегка связывает этот отрезок с предыдущим; отдельное русское соответствие сделало бы фразу тяжеловесной.
