source:
  edition: SBLGNT
  text: παρέστη γάρ μοι ταύτῃ τῇ ⸀νυκτὶ τοῦ θεοῦ, οὗ ⸀εἰμι, ᾧ καὶ λατρεύω, ⸀ἄγγελος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/023.yaml
  text: For this very night an angel of the God to whom I belong and whom I also worship stood by me[b][a],
translation:
  language: ru
  text: Ведь этой самой ночью рядом со мной встал ангел Бога, Которому я принадлежу[a] и Которому поклоняюсь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Чей я».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Которому служу»; греческий глагол может обозначать священное служение или поклонение Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέστη
  choice: рядом со мной встал
  rationale: Передаёт пространственный смысл внезапного присутствия рядом с Павлом, не заменяя его более толковательным «явился мне».
- source_word: γάρ
  choice: ведь
  rationale: Естественно вводит объяснение уверенности Павла в предшествующем контексте.
- source_word: ταύτῃ τῇ νυκτί
  choice: этой самой ночью
  rationale: Сохраняет указательность и эмфатическую непосредственность греческого выражения.
- source_word: τοῦ θεοῦ
  choice: Бога
  rationale: Родительный падеж определяет, чей это ангел; последующие относительные придаточные относятся к Богу.
- source_word: οὗ εἰμι
  choice: Которому я принадлежу
  rationale: Естественно и точно передаёт буквальное «Чей я», выражая принадлежность без добавочного догматического уточнения.
- source_word: ᾧ καὶ λατρεύω
  choice: и Которому поклоняюсь
  rationale: λατρεύω применительно к Богу обозначает религиозное служение и поклонение; русский вариант сохраняет сакральный смысл, а возможное «служу» отмечено в сноске.
- source_word: ἄγγελος
  choice: ангел
  rationale: Контекст божественного ободрения ясно указывает на сверхъестественного посланника.
theological_decisions:
- issue: Передача οὗ εἰμι
  choice: Которому я принадлежу
  alternative: Чей я
  rationale: Основной вариант понятен современному читателю и сохраняет идею принадлежности Богу; буквальная формулировка приведена в сноске, чтобы не утратить образ исходного текста.
- issue: Передача λατρεύω
  choice: поклоняюсь
  alternative: служу
  rationale: Глагол обозначает служение религиозного характера. «Поклоняюсь» ясно выражает сакральную направленность, тогда как «служу» остаётся допустимой более широкой передачей и указано в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Порядок компонентов слегка перестроен ради естественности, но связь слова «ангел» с «Бога» и обе относительные характеристики Бога сохранены.
