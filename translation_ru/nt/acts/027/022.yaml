source:
  edition: SBLGNT
  text: καὶ τὰ νῦν παραινῶ ὑμᾶς εὐθυμεῖν, ἀποβολὴ γὰρ ψυχῆς οὐδεμία ἔσται ἐξ ὑμῶν πλὴν τοῦ πλοίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/022.yaml
  text: And now I urge you to take courage[a], for there will be no loss of life among you[b], except for the ship.
translation:
  language: ru
  text: А теперь призываю вас не падать духом[a], потому что никто из вас не погибнет[b] — погибнет только корабль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ободриться»; «сохранять мужество».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не будет никакой потери жизни среди вас». Здесь слово «жизнь» означает физическую жизнь человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: а теперь
  rationale: Естественное русское вводное выражение, передающее переход Павла от прежнего упрёка к нынешнему призыву.
- source_word: παραινῶ
  choice: призываю
  rationale: Передаёт настойчивое увещание, не сводя его ни к нейтральному совету, ни только к эмоциональному ободрению.
- source_word: εὐθυμεῖν
  choice: не падать духом
  rationale: Современная и естественная русская передача призыва сохранять мужество и бодрость в опасной ситуации.
- source_word: ἀποβολὴ ψυχῆς
  choice: никто ... не погибнет
  rationale: Контекстуально передаёт отсутствие человеческих жертв; ψυχή здесь означает земную жизнь, а не отдельно мыслимую душу.
- source_word: ἐξ ὑμῶν
  choice: из вас
  rationale: Сохраняет указание на группу людей, среди которых не будет погибших.
- source_word: πλὴν τοῦ πλοίου
  choice: погибнет только корабль
  rationale: В русском языке буквальное «кроме корабля» после слов о гибели людей звучало бы семантически неровно; явное повторение сказуемого естественно выражает единственную предстоящую утрату.
theological_decisions:
- issue: Значение ψυχή
  choice: земная жизнь человека, выраженная как «никто не погибнет»
  alternative: «ни одна душа не погибнет»
  rationale: Речь идёт о физическом спасении людей при кораблекрушении, а не о посмертной участи или антропологическом различении души и тела.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной и устной по звучанию речью. Формулировка избегает архаичного «ободритесь» как основной передачи и не создаёт богословского смысла «гибели души», отсутствующего в контексте.
