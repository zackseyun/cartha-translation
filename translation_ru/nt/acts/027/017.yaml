  yaml_path: translation/nt/acts/027/017.yaml
  text: After hoisting it up[a], they used supporting cables to undergird the ship; and fearing that they might run aground on the Syrtis[c][b], they lowered the sea anchor and so were driven along.
translation:
  language: ru
  text: Подняв шлюпку, они стали укреплять корабль, обвязывая его канатами. Опасаясь, как бы их не вынесло в район Сирта[a], они спустили корабельное снаряжение[b] и так продолжали нестись по волнам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сирт — известная своими мелями и песчаными отмелями опасная область у североафриканского побережья.
    reason: cultural_note
  - marker: b
    text: 'Или: «снасти»; возможно, имеется в виду плавучий якорь. Греческое слово означает «снаряжение, снасть, приспособление», и точный морской предмет здесь неизвестен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ἄραντες
  choice: Подняв шлюпку
  rationale: Относительное местоимение относится к шлюпке из предыдущего стиха; явное повторение существительного естественно по-русски и устраняет неясность без изменения смысла. Аористное причастие обозначает действие, предшествующее укреплению корабля.
- source_word: βοηθείαις ἐχρῶντο ὑποζωννύντες τὸ πλοῖον
  choice: они стали укреплять корабль, обвязывая его канатами
  rationale: Морское выражение описывает усиление корпуса канатами, проведёнными вокруг него. Формулировка передаёт способ действия понятно и без редкого технического термина.
- source_word: μὴ εἰς τὴν Σύρτιν ἐκπέσωσιν
  choice: как бы их не выбросило на мель у Сирта
  rationale: ἐκπίπτω в данном морском контексте означает быть вынесенным или выброшенным в опасную область; упоминание мели ясно передаёт характер угрозы.
- source_word: Σύρτιν
  choice: Сирта
  rationale: Сохранено собственное географическое название в принятой русской форме; его значение пояснено в сноске.
- source_word: χαλάσαντες τὸ σκεῦος
  choice: они спустили корабельное снаряжение
  rationale: σκεῦος — широкое обозначение предмета, снасти или снаряжения; точное морское устройство здесь не установлено. Обобщённый перевод сохраняет неопределённость греческого текста.
- source_word: οὕτως ἐφέροντο
  choice: и их понесло дальше
  rationale: Имперфект пассива выражает продолжавшееся движение под воздействием внешней силы, в контексте — ветра и моря.
