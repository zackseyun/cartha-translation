lexical_decisions:
- source_word: Ὅτε δὲ ἡμέρα ἐγένετο
  choice: Когда настал день
  rationale: Естественно передаёт наступление дневного света; δέ здесь служит мягким повествовательным переходом и не требует отдельного русского слова.
- source_word: τὴν γῆν οὐκ ἐπεγίνωσκον
  choice: они не узнали этой земли
  rationale: Сохраняет прямое значение γῆ «земля, суша» и значение ἐπιγινώσκω «узнавать, опознавать». Указательное «этой» делает сочетание естественнее по-русски и относится к увиденной земле.
- source_word: κόλπον δέ τινα κατενόουν
  choice: но заметили залив
  rationale: κόλπος в морском контексте означает залив или бухту, а κατανοέω — внимательное замечание. Неопределённость τινα по-русски естественно выражена отсутствием определённости, без тяжеловесного «некий».
- source_word: ἔχοντα αἰγιαλόν
  choice: с берегом
  rationale: αἰγιαλός обозначает морской берег или пляж. «Берег» не добавляет отсутствующего в греческом тексте указания на песок.
- source_word: εἰς ὃν
  choice: туда
  rationale: Естественно передаёт направленность εἰς ὃν внутрь замеченного залива, избегая громоздкого русского относительного оборота.
- source_word: ἐβουλεύοντο εἰ δύναιντο
  choice: решили, если удастся
  rationale: βουλεύομαι здесь выражает принятое намерение, а условие с оптативом сохраняет неуверенность в возможности осуществить план.
- source_word: ἐξῶσαι τὸ πλοῖον
  choice: выбросить туда корабль
  rationale: В данном морском контексте глагол означает намеренно направить или вытолкнуть судно на берег. «Выбросить корабль на берег» — естественное русское морское выражение; место назначения передано наречием «туда».
