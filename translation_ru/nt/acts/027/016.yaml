lexical_decisions:
- source_word: νησίον ... τι
  choice: небольшим островом
  rationale: Уменьшительная форма νησίον естественно указывает на небольшой остров; такой перевод понятен и не вводит излишне специального слова «островок».
- source_word: δέ
  choice: не передано отдельным словом
  rationale: Частица обозначает мягкий переход в повествовании; в русском связь естественно выражена последовательностью событий без обязательного союза.
- source_word: ὑποδραμόντες
  choice: укрывшись от ветра за
  rationale: В морском контексте глагол означает пройти с подветренной стороны острова, воспользовавшись его защитой от ветра. Формулировка передаёт смысл естественным современным русским языком.
- source_word: καλούμενον Καῦδα
  choice: называемым Кавда
  rationale: Причастный оборот прямо сообщает название острова; «Кавда» близко передаёт форму Καῦδα данной греческой редакции.
- source_word: ἰσχύσαμεν μόλις
  choice: мы с трудом сумели
  rationale: Сочетание выражает возможность совершить действие лишь с большим трудом, а не просто недостаток физической силы.
- source_word: περικρατεῖς γενέσθαι
  choice: взять под контроль
  rationale: Греческое выражение буквально описывает овладение или установление контроля. Перевод сохраняет этот оттенок, не уточняя без достаточного основания, каким именно способом моряки обращались со шлюпкой.
- source_word: τῆς σκάφης
  choice: корабельную шлюпку
  rationale: σκάφη обозначает малую лодку при корабле, вероятно буксировавшуюся за ним; «корабельная шлюпка» ясно отличает её от самого судна.
