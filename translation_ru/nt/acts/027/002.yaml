  yaml_path: translation/nt/acts/027/002.yaml
  text: So we boarded an Adramyttian ship that was about to sail to the places along Asia, and put out to sea, with Aristarchus, a Macedonian from Thessalonica, being with us.
translation:
  language: ru
  text: Мы взошли на борт корабля из Адрамиттия, который должен был идти к местам в Асии[a], и вышли в море. С нами был Аристарх, македонянин из Фессалоники.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Асия — римская провинция на западе Малой Азии, а не современная часть света Азия. Возможный перевод: «к местам вдоль побережья Асии».'
    reason: Историко-географическое пояснение и лексическая альтернатива для неоднозначного выражения εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους.
lexical_decisions:
- source_word: ἐπιβάντες
  choice: поднялись на корабль
  rationale: В морском контексте причастие означает «взойти на судно, подняться на борт»; выражение естественно по-русски и сохраняет действие, предшествующее отплытию.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Здесь частица служит главным образом переходом к следующему событию повествования; в русском связь естественно передаётся последовательностью предложений без искусственного противопоставления.
- source_word: πλοίῳ Ἀδραμυττηνῷ
  choice: на корабль из Адрамиттия
  rationale: Прилагательное указывает на связь корабля с Адрамиттием, вероятнее всего на порт приписки или происхождение. Такая передача яснее современному русскому читателю, чем редкое «адрамиттийский корабль».
- source_word: μέλλοντι πλεῖν
  choice: который должен был идти
  rationale: Оборот μέλλω с инфинитивом обозначает предстоящее или намеченное плавание; «должен был идти» естественно передаёт запланированный маршрут, не утверждая необходимости.
- source_word: εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους
  choice: к местам вдоль побережья Асии
  rationale: κατά с винительным имеет здесь географическое значение расположения вдоль области. Морской контекст позволяет явно назвать побережье, но слово «местам» сохранено, чтобы не сужать смысл до портов.
- source_word: Ἀσίαν
  choice: Асии
  rationale: Сохранено историческое название римской провинции; сноска предотвращает смешение с современным континентом Азией.
- source_word: ἀνήχθημεν
  choice: вышли в море
  rationale: Стандартное морское употребление ἀνάγω означает отплытие из гавани; русский оборот точен и естествен.
- source_word: ὄντος σὺν ἡμῖν
  choice: С нами был
  rationale: Генитив абсолютный сообщает сопутствующее обстоятельство. Отдельное краткое предложение передаёт его ясно, не создавая тяжеловесной конструкции.
- source_word: Ἀριστάρχου
  choice: Аристарх
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: Μακεδόνος
  choice: македонянин
  rationale: Существительное прямо указывает на региональную принадлежность Аристарха.
- source_word: Θεσσαλονικέως
  choice: из Фессалоники
  rationale: Естественно уточняет город происхождения и позволяет избежать нагромождения двух этнонимов.
