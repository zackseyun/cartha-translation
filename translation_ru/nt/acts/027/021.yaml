base_translation:
  language: en
  yaml_path: translation/nt/acts/027/021.yaml
  text: Since they had gone a long time without food, then Paul stood up among them and said, “Men, you should have listened to me and not set sail from Crete, and so have avoided this damage and loss.”
translation:
  language: ru
  text: 'После того как они долго оставались без пищи[a], Павел встал среди них и сказал: «Мужи! Вам следовало послушаться меня[b] и не отплывать с Крита — тогда вы избежали бы этого урона и убытка[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «После долгого голодания». Греческое слово ἀσιτία может означать как отсутствие пищи, так и воздержание от еды; в условиях бури, вероятнее всего, речь идёт о том, что люди долго не ели.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «последовать моему совету». Глагол может означать повиновение указанию или власти; здесь речь идёт о совете Павла относительно плавания.'
    reason: lexical_alternative
  - marker: c
    text: Сочетание «урон и убыток», вероятно, различает причинённый вред и материальную потерю.
    reason: cultural_note
lexical_decisions:
- source_word: Πολλῆς τε ἀσιτίας ὑπαρχούσης
  choice: После долгого воздержания от пищи
  rationale: Генитив абсолютный задаёт обстоятельственный фон речи Павла. ἀσιτία допускает как вынужденное отсутствие пищи, так и воздержание от еды; русский оборот сохраняет эту широту лучше, чем религиозно окрашенное «пощение», а «после» естественно передаёт ход повествования без излишне сильной причинной связи.
- source_word: σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν
  choice: Павел встал среди них
  rationale: Передаёт действие причастия и публичное положение Павла внутри собравшейся группы естественным современным русским языком.
- source_word: Ἔδει μέν, ὦ ἄνδρες
  choice: Мужи! Вам следовало
  rationale: «Вам следовало» передаёт несовершенный вид δεῖ как указание на не сделанное ранее должное. «Мужи» сохраняет прямое обращение к мужчинам и уместный библейский, но понятный регистр.
- source_word: πειθαρχήσαντάς μοι
  choice: послушаться меня
  rationale: πειθαρχέω означает повиноваться или следовать указанию. «Послушаться» сохраняет более сильный оттенок, чем просто «выслушать», не приписывая Павлу формальной должности.
- source_word: μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης
  choice: не отплывать с Крита
  rationale: В морском контексте ἀνάγω означает выходить в море; «отплывать с Крита» ясно и естественно передаёт этот смысл.
- source_word: κερδῆσαί τε τὴν ὕβριν ταύτην καὶ τὴν ζημίαν
  choice: тогда вы избежали бы этого бедствия и ущерба
  rationale: κερδαίνω здесь идиоматически выражает сохранение себя от неблагоприятного результата. «Бедствие» передаёт пережитое тяжёлое воздействие ὕβρις, а «ущерб» — понесённую ζημία, сохраняя различие двух понятий.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Обращение «Мужи!» слегка возвышенно, но ясно и точно соответствует мужской аудитории. Синтаксис упрощён до естественной русской условно-контрфактической конструкции, при этом сохранены смысловые оттенки греческого текста.
