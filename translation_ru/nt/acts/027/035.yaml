id: ACT.27.35
reference: Acts 27:35
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀εἴπας δὲ ταῦτα καὶ λαβὼν ἄρτον εὐχαρίστησεν τῷ θεῷ ἐνώπιον πάντων καὶ κλάσας ἤρξατο ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/035.yaml
  text: And after saying these things and taking bread[a], he gave thanks to God in the presence of all, and after breaking it, he began to eat.
translation:
  language: ru
  text: Сказав это, он взял хлеб и в присутствии всех[a] поблагодарил Бога, затем разломил хлеб и начал есть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед всеми».'
    reason: Лексический вариант передачи ἐνώπιον πάντων.
lexical_decisions:
- source_word: εἴπας δὲ ταῦτα
  choice: Сказав это
  rationale: Аористное причастие обозначает действие, предшествующее основному; δέ здесь служит мягкой повествовательной связкой, которую в естественном русском не требуется передавать отдельным союзом.
- source_word: λαβὼν ἄρτον
  choice: он взял хлеб
  rationale: ἄρτον без артикля не уточняет, шла ли речь о целой буханке или части хлеба; простое «хлеб» сохраняет эту неопределённость.
- source_word: εὐχαρίστησεν τῷ θεῷ
  choice: поблагодарил Бога
  rationale: Прямое и естественное соответствие εὐχαριστέω с явно названным адресатом благодарности.
- source_word: ἐνώπιον πάντων
  choice: в присутствии всех
  rationale: Передаёт публичный характер действия, не добавляя указания на то, были ли все физически обращены к Павлу.
- source_word: κλάσας
  choice: затем разломил хлеб
  rationale: Аористное причастие обозначает действие перед началом еды. Повтор существительного «хлеб» звучит по-русски ясно и избегает возможной двусмысленности местоимения.
- source_word: ἤρξατο ἐσθίειν
  choice: начал есть
  rationale: Сохраняет начинательное значение конструкции ἄρχομαι с инфинитивом.
theological_decisions:
- issue: Возможный евхаристический отзвук последовательности «взял хлеб — поблагодарил — разломил — начал есть»
  choice: Передать действия как обычное повествование о трапезе, не усиливая литургическую окраску.
  alternative: Использовать традиционные формулы, сильнее напоминающие повествования о Вечере Господней.
  rationale: Формулировка может вызывать евхаристические ассоциации, однако сам стих описывает публичный приём пищи Павлом на корабле и прямо не называет его Вечерей Господней.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанно-достоинственное. Синтаксис естественен для повествования, а последовательность действий исходного текста сохранена.
