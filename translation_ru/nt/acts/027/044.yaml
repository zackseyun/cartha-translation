  source_fidelity: 'Текст точно передаёт структуру и смысл греческого оригинала: оставшиеся разделены на две группы («кто ... кто»), одни держатся на досках, другие — на предметах/обломках с корабля; итогом становится благополучное достижение суши всеми. «Обломках корабля» несколько конкретнее неопределённого τινων («каких-то предметах»), но в непосредственном контексте разрушенного корабля это естественное и несущественное уточнение, не меняющее смысла.'
