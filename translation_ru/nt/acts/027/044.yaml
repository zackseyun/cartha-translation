source:
  edition: SBLGNT
  text: καὶ τοὺς λοιποὺς οὓς μὲν ἐπὶ σανίσιν οὓς δὲ ἐπί τινων τῶν ἀπὸ τοῦ πλοίου· καὶ οὕτως ἐγένετο πάντας διασωθῆναι ἐπὶ τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/044.yaml
  text: and the rest[a], some on planks and some on pieces from the ship. And so it happened that all were brought safely to land.
translation:
  language: ru
  text: а остальные — кто на досках, кто на обломках корабля. Так все благополучно добрались до суши.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Так все спаслись и достигли суши». Греческий глагол здесь означает физическое избавление при кораблекрушении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς λοιποὺς
  choice: остальные
  rationale: Обозначает людей, не упомянутых в предыдущем стихе; «остальные» естественно и точно передаёт смысл.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: кто ... кто
  rationale: Русская соотносительная конструкция естественно разделяет оставшихся людей на две группы.
- source_word: ἐπὶ σανίσιν
  choice: на досках
  rationale: σανίς означает доску или планку; «досках» ясно и уместно в сцене кораблекрушения.
- source_word: ἐπί τινων τῶν ἀπὸ τοῦ πλοίου
  choice: на обломках корабля
  rationale: Выражение указывает на неопределённые предметы от корабля; «обломках корабля» естественно передаёт это без излишней конкретизации.
- source_word: οὕτως
  choice: так
  rationale: Кратко подводит итог описанному способу спасения.
- source_word: ἐγένετο
  choice: опущено как отдельный глагол; передано итоговой конструкцией «Так все…»
  rationale: В русском повествовании буквальное «и случилось» здесь тяжеловесно; результат естественно выражен самостоятельным итоговым предложением.
- source_word: πάντας διασωθῆναι
  choice: все благополучно добрались
  rationale: Передаёт физическое избавление от опасности и достижение безопасного места, не создавая ненужной ассоциации с духовным спасением.
- source_word: ἐπὶ τὴν γῆν
  choice: до суши
  rationale: В морском контексте γῆ противопоставлена морю; «до суши» естественно сочетается с «добрались».
theological_decisions:
- issue: Возможный богословский оттенок διασωθῆναι
  choice: «благополучно добрались до суши» в смысле физического спасения при кораблекрушении
  alternative: «спаслись на сушу» / «были спасены и достигли суши»
  rationale: Контекст однозначно описывает физическое избавление. Основной текст передаёт это ясно, а примечание сохраняет более буквальную возможность перевода.
translation_notes:
  register: Современный литературный русский язык; повествование краткое, ясное и достойное. Тире после «остальные» облегчает чтение продолжения синтаксической конструкции из предыдущего стиха.
