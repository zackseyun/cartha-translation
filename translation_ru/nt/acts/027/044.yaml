  terminology: «Благополучно добрались до суши» удачно передаёт физическое спасение при кораблекрушении, не навязывая богословского значения глаголу διασῴζω. Примечание корректно поясняет физический характер избавления и даёт допустимую более близкую к греческому альтернативу.
