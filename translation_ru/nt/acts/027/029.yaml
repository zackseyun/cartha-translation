base_translation:
  language: en
  yaml_path: translation/nt/acts/027/029.yaml
  text: And fearing that we might run aground on rocky places[b][a], they dropped four anchors from the stern and prayed for day to come.
translation:
  language: ru
  text: Боясь, как бы мы не налетели на скалистые места[a], они сбросили с кормы четыре якоря и молились о наступлении дня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как бы мы не оказались на опасных неровных местах»; выражение может обозначать скалистый берег, рифы или иной опасный участок.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «молились, чтобы настал день», то есть чтобы пришёл дневной свет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβούμενοί
  choice: боясь
  rationale: Деепричастие сохраняет обстоятельственно-причинную связь с последующими действиями и естественно звучит в русском повествовании.
- source_word: μή που κατὰ τραχεῖς τόπους ἐκπέσωμεν
  choice: как бы нас не выбросило на скалистые места
  rationale: Оборот передаёт опасение, что судно будет вынесено на неровный каменистый участок берега или подводные скалы; первое лицо множественного числа сохраняет форму греческого текста.
- source_word: ἐκπέσωμεν
  choice: не выбросило
  rationale: В морском контексте глагол обозначает вынесение судна на берег, скалы или мель; безличная русская конструкция естественно передаёт действие ветра и волн.
- source_word: ἐκ πρύμνης
  choice: с кормы
  rationale: Точный и общеупотребительный русский морской термин.
- source_word: ῥίψαντες ἀγκύρας τέσσαρας
  choice: сбросили четыре якоря
  rationale: Передаёт действие, предшествующее молитве, и естественно описывает постановку якорей в данной чрезвычайной ситуации.
- source_word: ηὔχοντο
  choice: молились
  rationale: В контексте глагол вероятнее всего означает молитву, хотя может также выражать сильное желание; эта неоднозначность отмечена в сноске.
- source_word: ἡμέραν γενέσθαι
  choice: о наступлении дня
  rationale: Естественный русский оборот, точно передающий буквальное «чтобы наступил день», то есть ожидание дневного света.
