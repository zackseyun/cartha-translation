  terminology: '«Корма» и «якоря» употреблены точно. «Молились о наступлении дня» удачно передаёт εὔχοντο ἡμέραν γενέσθαι. Сноска b не должна представлять «желали» как равнозначный перевод в данном контексте: здесь глагол в повествовательной ситуации естественно означает молитву; полезнее отметить буквальную форму выражения.'
