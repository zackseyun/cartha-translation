  text: λέγων· Μὴ φοβοῦ, Παῦλε· Καίσαρί σε δεῖ παραστῆναι, καὶ ἰδοὺ κεχάρισταί σοι ὁ θεὸς πάντας τοὺς πλέοντας μετὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/024.yaml
  text: saying, ‘Do not be afraid, Paul. You must stand before Caesar, and look, God has granted to you all those sailing with you.’
translation:
  language: ru
  text: 'Он сказал: «Не бойся, Павел! Тебе надлежит предстать перед кесарем, и вот: Бог даровал тебе всех, кто плывёт с тобой».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίσαρί
  choice: перед императором
  rationale: В данном контексте Καῖσαρ — титул римского императора; современному русскому читателю функциональный смысл яснее передаётся словом «император».
- source_word: δεῖ
  choice: надлежит
  rationale: Передаёт необходимость, установленную Божьим замыслом, сохраняя достоинство и естественность повествования.
- source_word: παραστῆναι
  choice: предстать
  rationale: Точно передаёт судебно-официальный смысл появления Павла перед императором.
- source_word: ἰδοὺ
  choice: и вот
  rationale: Сохраняет дискурсивный указатель, привлекающий внимание к следующему обещанию.
- source_word: κεχάρισταί σοι
  choice: даровал тебе
  rationale: Перфект χαρίζομαι выражает уже совершённое милостивое дарование; русское «даровал» сохраняет оттенок благодатного дара.
- source_word: πάντας τοὺς πλέοντας μετὰ σοῦ
  choice: жизнь всех, кто плывёт с тобой
  rationale: Буквально объектом являются сами спутники, однако в контексте кораблекрушения смысл дарования состоит в сохранении их жизни; слово «жизнь» делает естественный русский смысл явным.
theological_decisions:
- issue: Смысл Божьего дарования спутников Павлу
  choice: Бог даровал Павлу жизнь всех плывущих с ним
  alternative: Бог даровал Павлу всех плывущих с ним
  rationale: Контекст непосредственно касается спасения от гибели (ст. 22, 34, 44). Добавление «жизнь» эксплицирует подразумеваемый объект дарования, не утверждая владения Павла этими людьми и не вводя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Обращение передано на «ты», как естественно для прямой личной речи ангела. «Надлежит» сохраняет торжественный оттенок, не делая текст архаичным.
