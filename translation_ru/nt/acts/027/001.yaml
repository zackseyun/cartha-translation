source:
  edition: SBLGNT
  text: Ὡς δὲ ἐκρίθη τοῦ ἀποπλεῖν ἡμᾶς εἰς τὴν Ἰταλίαν, παρεδίδουν τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ σπείρης Σεβαστῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/001.yaml
  text: When it was decided that we should sail for Italy[a], they handed over both Paul and some other prisoners to a centurion named Julius, of the Augustan Cohort.
translation:
  language: ru
  text: Когда было решено, что нам следует отплыть в Италию, Павла и некоторых других узников передали сотнику по имени Юлий из Августовской когорты.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из императорской когорты»; возможно также: «из когорты Себасты». Греческое Σεβαστῆς связано с титулом Августа, то есть императора, однако точное историческое обозначение этой воинской части неясно.'
    reason: Альтернативные варианты передачи спорного названия воинской части.
lexical_decisions:
- source_word: ἐκρίθη
  choice: было решено
  rationale: Безличная пассивная конструкция естественно передаёт официальное решение и сохраняет залог исходного текста.
- source_word: τοῦ ἀποπλεῖν ἡμᾶς
  choice: отплыть
  rationale: Глагол «отплыть» точно передаёт морской характер ἀποπλεῖν; первое лицо множественного числа явствует из дальнейшего повествования, но в русском инфинитивном обороте местоимение «нам» можно естественно опустить.
- source_word: παρεδίδουν
  choice: передали
  rationale: Передаёт официальную передачу заключённых под стражу; русский совершенный вид естественен для последовательного повествования.
- source_word: τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας
  choice: Павла и некоторых других узников
  rationale: Союзная конструкция τε…καί передана естественным русским соединением; «узники» ясно обозначает находящихся под стражей.
- source_word: ἑκατοντάρχῃ
  choice: сотнику
  rationale: Традиционный и понятный русский термин для римского военного звания; дательный падеж передаёт получателя.
- source_word: ὀνόματι Ἰουλίῳ
  choice: по имени Юлий
  rationale: Естественная современная русская формула представления имени.
- source_word: σπείρης Σεβαστῆς
  choice: из Августовой когорты
  rationale: «Августова» прямо отражает Σεβαστή как титульное обозначение, связанное с Августом или императором, не снимая исторической неопределённости.
theological_decisions:
- issue: Исторически не вполне ясное обозначение σπείρης Σεβαστῆς
  choice: из Августовой когорты
  alternative: из императорской когорты; из когорты Себасты
  rationale: Хотя вопрос не является доктринальным, буквальное титульное обозначение сохраняет неопределённость точной воинской части; варианты пояснены в сноске.
translation_notes:
  register: 'Современный литературный русский язык, ясный и сдержанно-достоинный. Частица δέ отдельно не выражена: связь с предыдущим повествованием в русском естественно передаётся последовательностью предложений. Сноска поставлена непосредственно после спорного названия.'
