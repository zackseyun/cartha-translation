reference: Acts 14:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἱκανὸν μὲν οὖν χρόνον διέτριψαν παρρησιαζόμενοι ἐπὶ τῷ κυρίῳ τῷ μαρτυροῦντι ⸀τῷ λόγῳ τῆς χάριτος αὐτοῦ, διδόντι σημεῖα καὶ τέρατα γίνεσθαι διὰ τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/003.yaml
  text: So they stayed there a considerable time[a], speaking boldly for the Lord, who was bearing witness to the word of his grace, granting signs and wonders to be done through their hands.
translation:
  language: ru
  text: Итак, они пробыли там довольно долго, смело говоря, полагаясь на Господа[a]. Господь подтверждал слово Своей благодати, давая знамениям и чудесам совершаться через их руки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смело говоря в Господе». Греческий оборот может подчёркивать, что их смелость имела основание в Господе, была проявлена в единстве с Ним или в служении Ему.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἱκανὸν ... χρόνον
  choice: довольно долго
  rationale: Передаёт заметную, значительную продолжительность времени естественным современным русским выражением, не преувеличивая её.
- source_word: διέτριψαν
  choice: пробыли там
  rationale: Глагол обозначает пребывание или проведение времени в определённом месте; слово «там» естественно восстанавливает место из контекста.
- source_word: παρρησιαζόμενοι
  choice: смело говоря
  rationale: Передаёт открытую, бесстрашную речь и сохраняет обстоятельственное значение причастия.
- source_word: ἐπὶ τῷ κυρίῳ
  choice: полагаясь на Господа
  rationale: ἐπί с дательным при παρρησιάζομαι может указывать на основание или опору смелой речи. Такой перевод ясен по-русски, а возможное значение сферы отношения сохранено в сноске.
- source_word: τῷ κυρίῳ
  choice: Господа / Господь
  rationale: Сохраняет титул κύριος, не добавляя отсутствующее в греческом тексте имя «Иисус».
- source_word: τῷ μαρτυροῦντι
  choice: свидетельствовал
  rationale: Передаёт продолжающееся в тот период подтверждающее свидетельство Господа; форма несовершенного вида сохраняет длительность действия.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: о слове Своей благодати
  rationale: Сохраняет образ «слова» и генитивную связь с благодатью, не сводя её однозначно ни к содержанию вести, ни к её качеству.
- source_word: χάριτος
  choice: благодати
  rationale: Сохраняет устойчивое богословски весомое значение χάρις в повествовании Луки и Деяний.
- source_word: διδόντι
  choice: давал
  rationale: Передаёт Господа как того, кто предоставляет возможность и силу для совершения последующих знамений и чудес.
- source_word: σημεῖα καὶ τέρατα
  choice: знамениям и чудесам
  rationale: Сохраняет традиционную и понятную библейскую пару, выражающую как удостоверяющую функцию, так и поразительный характер деяний.
- source_word: γίνεσθαι
  choice: совершаться
  rationale: Естественно передаёт возникновение или осуществление чудесных деяний, не делая посланников их независимым источником.
- source_word: διὰ τῶν χειρῶν αὐτῶν
  choice: через их руки
  rationale: Сохраняет конкретный греческий образ и подчёркивает инструментальную роль проповедников.
theological_decisions:
- issue: К кому относится титул «Господь»
  choice: Оставить «Господь», не уточняя имени
  alternative: «Господь Иисус» или обобщённо «Бог»
  rationale: В греческом тексте стоит только κύριος. Контекст может указывать на воскресшего Иисуса, однако добавление имени устранило бы формальную неопределённость исходного текста.
- issue: Значение ἐπὶ τῷ κυρίῳ
  choice: «полагаясь на Господа» в основном тексте
  alternative: «в Господе» или «ради Господа»
  rationale: Оборот допускает оттенки основания, опоры, сферы отношения или служения. Основной вариант естественно выражает опору их смелости на Господа; формально близкая альтернатива сохранена в сноске.
- issue: Связь «слова» и «благодати»
  choice: Сохранить конструкцию «слово Своей благодати»
  alternative: «весть о Своей благодати» или «Своё благодатное слово»
  rationale: Родительный падеж может обозначать содержание вести либо характеризовать её. Буквенно естественная русская конструкция не принуждает читателя выбрать лишь одно из этих значений.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис разделён на два предложения ради ясности; повтор «Господь» устраняет тяжёлую цепочку причастных оборотов и сохраняет того же деятеля. Все ключевые образы исходного текста — слово благодати, знамения и чудеса, руки как орудие действия — сохранены.
