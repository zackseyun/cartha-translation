  yaml_path: translation/nt/acts/014/007.yaml
  text: And there they were preaching the good news[a].
translation:
  language: ru
  text: И там они возвещали Благую весть[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «там также они проповедовали Евангелие».'
    reason: Лексически возможны «там также» для κἀκεῖ и традиционное «проповедовали Евангелие» для εὐαγγελιζόμενοι.
lexical_decisions:
- source_word: κἀκεῖ
  choice: И там
  rationale: Слитная форма καί + ἐκεῖ означает «и там» или «там также». В данном контексте «И там» естественно продолжает повествование и сохраняет соединительную силу καί.
- source_word: εὐαγγελιζόμενοι
  choice: возвещали Благую весть
  rationale: Причастие от εὐαγγελίζω обозначает провозглашение доброй вести, в данном контексте — вести о Христе. Глагол «возвещали» передаёт публичное провозглашение, а «Благая весть» ясно и непосредственно отражает значение греческого слова без узкоцерковного оттенка.
- source_word: εὐαγγελιζόμενοι ἦσαν
  choice: они возвещали
  rationale: Перифрастическая конструкция с имперфектом ἦσαν представляет действие как продолжавшееся в прошлом. В русском языке простой несовершенный вид «возвещали» естественно передаёт эту длительность; отдельное «были» здесь не требуется.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным библейским звучанием. «Благая весть» написана с прописной буквы как контекстуальное обозначение христианского благовестия; в сноске сохранён традиционный вариант «Евангелие».
