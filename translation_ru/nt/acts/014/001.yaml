  text: Ἐγένετο δὲ ἐν Ἰκονίῳ κατὰ τὸ αὐτὸ εἰσελθεῖν αὐτοὺς εἰς τὴν συναγωγὴν τῶν Ἰουδαίων καὶ λαλῆσαι οὕτως ὥστε πιστεῦσαι Ἰουδαίων τε καὶ Ἑλλήνων πολὺ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/001.yaml
  text: In Iconium they entered together into the synagogue of the Jews and spoke in such a way that a great multitude of both Jews and Greeks believed[a].
translation:
  language: ru
  text: В Иконии они вместе вошли в иудейскую синагогу[a] и говорили так, что большое множество иудеев и греков уверовало.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в синагогу иудеев».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: не выражено отдельными словами
  rationale: Оборот служит повествовательным переходом; в современном русском отдельное «и случилось» было бы тяжеловесным, а «тогда» добавляло бы более явное временное значение.
- source_word: ἐν Ἰκονίῳ
  choice: В Иконии
  rationale: Прямое обозначение места с традиционной русской формой топонима.
- source_word: κατὰ τὸ αὐτό
  choice: вместе
  rationale: В данном контексте оборот естественно обозначает совместное действие Павла и Варнавы.
- source_word: εἰσελθεῖν αὐτοὺς
  choice: они вошли
  rationale: Зависимый от ἐγένετο инфинитив естественно передан в русском личной формой глагола.
- source_word: εἰς τὴν συναγωγὴν τῶν Ἰουδαίων
  choice: в иудейскую синагогу
  rationale: Естественная русская передача греческого генитива принадлежности; буквальная альтернатива приведена в сноске.
- source_word: λαλῆσαι
  choice: говорили
  rationale: Нейтрально передаёт речь апостолов без добавления невыраженного объекта или уточнения содержания.
- source_word: οὕτως ὥστε
  choice: так, что
  rationale: Сохраняет связь образа действия с наступившим результатом.
- source_word: πιστεῦσαι
  choice: уверовало
  rationale: Точно передаёт наступление веры как результат их речи, не уточняя сверх текста объект веры.
- source_word: Ἰουδαίων τε καὶ Ἑλλήνων
  choice: иудеев и греков
  rationale: Парная конструкция τε καὶ включает обе названные группы.
- source_word: πολὺ πλῆθος
  choice: великое множество
  rationale: Сохраняет образ многочисленной массы людей и возвышенный, но понятный библейский регистр.
theological_decisions:
- issue: Значение πιστεῦσαι в повествовании об отклике на проповедь
  choice: уверовало
  alternative: пришло к вере; поверило вести
  rationale: Глагол сообщает о вере иудеев и греков, но не называет прямо её объект; перевод не добавляет отсутствующее в греческом тексте уточнение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок компонентов сделан естественным для русского, при этом сохранены совместность действия, результативность конструкции и включение обеих групп.
