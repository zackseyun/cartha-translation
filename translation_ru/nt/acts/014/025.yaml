  text: καὶ λαλήσαντες ἐν Πέργῃ τὸν λόγον κατέβησαν εἰς Ἀττάλειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/025.yaml
  text: And after speaking the word in Perga[a], they went down to Attalia,
translation:
  language: ru
  text: И, возвестив слово в Пергии, они спустились в Атталию.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαλήσαντες
  choice: возвестив
  rationale: 'Аористное причастие обозначает действие, предшествующее основному: сначала они возвестили слово, затем спустились. В данном миссионерском контексте «возвестив» естественно передаёт публичное сообщение, не усиливая его до более специального «проповедав».'
- source_word: τὸν λόγον
  choice: слово
  rationale: Сохраняет характерное для Деяний обозначение христианской вести и не добавляет отсутствующее в греческом тексте уточнение «Господне».
- source_word: ἐν Πέργῃ
  choice: в Пергии
  rationale: Предлог ἐν с названием города естественно передаётся русским «в»; традиционная русская форма названия — «Пергия».
- source_word: κατέβησαν
  choice: спустились
  rationale: Передаёт направленное вниз движение из расположенной внутри страны Пергии к прибрежной Атталии и сохраняет географический оттенок καταβαίνω.
- source_word: εἰς Ἀττάλειαν
  choice: в Атталию
  rationale: При обозначении пункта назначения εἰς естественно передаётся конструкцией «в» с винительным падежом.
- source_word: καὶ
  choice: И
  rationale: Сохраняет простой повествовательный союз без добавления более выраженного временного значения.
