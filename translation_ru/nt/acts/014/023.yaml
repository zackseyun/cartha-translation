  verdict: approve
  source_fidelity: 'Текст точно передаёт греческую последовательность: назначение пресвитеров для каждой местной церкви, молитва с постом и вверение Господу. «Назначив» не навязывает способ избрания, а «в Которого те уверовали» адекватно выражает πιστεύω εἰς и предшествование, заложенное в плюсквамперфекте πεπιστεύκεισαν.'
  naturalness: Фраза естественна для современного литературного русского с умеренным библейским регистром. Конструкция «Назначив ... и помолившись ..., они ...» ясна и плавна. «Те» уместно различает субъект главного действия и людей, о которых говорится в придаточном.
  terminology: «Пресвитеры», «Господу» и «вверили» — точные, устоявшиеся и регистрово согласованные соответствия. Примечания корректно сохраняют возможный оттенок χειροτονέω и неоднозначный референт αὐτούς, не предрешая вопросов церковного устройства.
