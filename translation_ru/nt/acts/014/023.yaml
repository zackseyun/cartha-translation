id: ACT.14.23
reference: Acts 14:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: χειροτονήσαντες δὲ αὐτοῖς ⸂κατ’ ἐκκλησίαν πρεσβυτέρους⸃ προσευξάμενοι μετὰ νηστειῶν παρέθεντο αὐτοὺς τῷ κυρίῳ εἰς ὃν πεπιστεύκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/023.yaml
  text: And after appointing elders for them in every church[a], and praying with fasting, they entrusted them to the Lord[c][b], in whom they had believed.
translation:
  language: ru
  text: Назначив им пресвитеров в каждой церкви[a] и помолившись с постом, они вверили их Господу, в Которого те уверовали.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избрав им пресвитеров в каждой церкви». Греческий глагол в некоторых контекстах может означать избрание поднятием рук, однако здесь он может обозначать просто назначение.'
    reason: alternative_reading
  - marker: b
    text: Местоимение «их» может относиться ко всем верующим в этих общинах или, возможно, к только что назначенным пресвитерам.
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονήσαντες
  choice: назначив
  rationale: В данном контексте глагол обозначает выбор и поставление на служение. «Назначив» передаёт основной смысл, не утверждая конкретного порядка избрания голосованием.
- source_word: κατ’ ἐκκλησίαν
  choice: в каждой церкви
  rationale: Распределительное κατά с существительным в единственном числе указывает на каждую поместную общину.
- source_word: πρεσβυτέρους
  choice: пресвитеров
  rationale: В церковном контексте слово обозначает признанных руководителей общины; «пресвитеры» — понятный и укоренившийся русский библейский термин.
- source_word: προσευξάμενοι μετὰ νηστειῶν
  choice: помолившись с постом
  rationale: Передаёт предшествующее главному действию молитвенное действие, сопровождавшееся постом; множественное число νηστειῶν по-русски естественно передаётся собирательно.
- source_word: παρέθεντο
  choice: вверили
  rationale: Средний залог выражает передачу людей под чью-либо заботу; «вверили» сохраняет личный и доверительный оттенок.
- source_word: τῷ κυρίῳ
  choice: Господу
  rationale: Дательный падеж указывает на Того, чьей заботе были вверены люди.
- source_word: εἰς ὃν πεπιστεύκεισαν
  choice: в Которого те уверовали
  rationale: Русское «уверовали в» естественно передаёт конструкцию πιστεύω εἰς; плюсквамперфект указывает на веру, возникшую ранее, а местоимение «те» проясняет смену субъекта без устранения неоднозначности дополнения главного глагола.
- source_word: αὐτοῖς ... αὐτοὺς
  choice: им ... их
  rationale: 'Местоимения сохранены: первое относится к общинам или верующим, для которых назначены пресвитеры; второе может обозначать как верующих в целом, так и назначенных пресвитеров.'
theological_decisions:
- issue: Значение χειροτονήσαντες и устройство церковного управления
  choice: назначив пресвитеров
  alternative: избрав пресвитеров поднятием рук
  rationale: Хотя слово исторически могло обозначать выбор поднятием рук, в койне оно также употребляется шире в смысле назначения. Основной текст не навязывает определённую конфессиональную модель, а примечание сохраняет допустимую альтернативу.
- issue: Референт αὐτοὺς при παρέθεντο
  choice: сохранить местоимение «их» без явного уточнения
  alternative: явно назвать либо всех верующих, либо только новых пресвитеров
  rationale: Контекст благоприятствует пониманию всех учеников или общин, однако грамматически возможна отсылка к ближайшему существительному «пресвитеров». Сохранение местоимения удерживает подлинную неоднозначность, разъяснённую в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Синтаксис следует последовательности греческих действий, но остаётся естественным по-русски. Термин «пресвитеры» выбран как устоявшийся церковно-библейский, без указания на конкретную систему управления.
