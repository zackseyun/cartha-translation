  text: узнав об этом[a], они бежали в города Ликаонии — Листру и Дервию — и в их окрестности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поняв это»; «осознав это». Греческое причастие указывает, что они осознали опасность, описанную в предыдущем стихе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδόντες
  choice: узнав об этом
  rationale: Аористное причастие συνοράω передаёт осознание или обнаружение опасности, описанной в предыдущем стихе. Дополнение «об этом» естественно восполняется из контекста.
- source_word: κατέφυγον
  choice: они бежали
  rationale: В данном повествовательном контексте καταφεύγω обозначает поспешное бегство от угрозы; «бежали» ясно и непосредственно передаёт движение в поисках безопасности.
- source_word: εἰς τὰς πόλεις τῆς Λυκαονίας
  choice: в города Ликаонии
  rationale: Предлог εἰς при глаголе движения указывает направление, а родительный τῆς Λυκαονίας естественно передаётся как принадлежность городов к области.
- source_word: Λύστραν καὶ Δέρβην
  choice: Листру и Дервию
  rationale: Устоявшиеся русские библейские формы топонимов; винительный падеж соответствует направлению движения и приложению к слову «города».
- source_word: τὴν περίχωρον
  choice: их окрестности
  rationale: Субстантивированное περίχωρος означает окружающую местность. Местоимение «их» естественно связывает окрестности с названными городами, не сужая понятие до сельской местности.
- source_word: καὶ ... καὶ
  choice: — Листру и Дервию — и
  rationale: Тире ясно обозначают, что названия городов являются пояснительным приложением, а последнее καί присоединяет окружающую область.
