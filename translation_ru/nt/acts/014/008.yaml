  text: В Листре сидел один человек, у которого не было силы в ногах[a]; он был хромым от рождения и никогда не ходил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лишённый силы в ногах». Греческий текст сначала подчёркивает отсутствие силы в ногах, а затем прямо называет человека хромым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί
  choice: Опущено как самостоятельное «и»
  rationale: В русском повествовании связь с предыдущим эпизодом естественно передаётся продолжением рассказа без начального союза; это не меняет смысловой связи.
- source_word: τις ἀνὴρ
  choice: один человек
  rationale: Естественно обозначает конкретного, но не названного человека, сохраняя неопределённость греческого выражения.
- source_word: ἀδύνατος ... τοῖς ποσίν
  choice: ноги его были бессильны
  rationale: Сохраняет значение отсутствия силы и не сливает его с последующим χωλός — «хромой».
- source_word: ἐν Λύστροις
  choice: в Листре
  rationale: Устоявшаяся русская форма названия города.
- source_word: ἐκάθητο
  choice: сидел
  rationale: Русский несовершенный вид естественно передаёт длительное состояние, выраженное греческим имперфектом.
- source_word: χωλός
  choice: хромым
  rationale: Точное и нейтральное современное обозначение физического состояния.
- source_word: ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: от рождения
  rationale: Естественно передаёт греческую идиому «от утробы матери», указывающую на врождённое состояние.
- source_word: οὐδέποτε περιεπάτησεν
  choice: никогда не ходил
  rationale: Передаёт пожизненную неспособность ходить вплоть до описываемого момента.
