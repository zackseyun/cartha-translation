  text: κἀκεῖθεν ἀπέπλευσαν εἰς Ἀντιόχειαν, ὅθεν ἦσαν παραδεδομένοι τῇ χάριτι τοῦ θεοῦ εἰς τὸ ἔργον ὃ ἐπλήρωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/026.yaml
  text: And from there they sailed to Antioch[b][a], where they had been committed to the grace of God for the work that they had fulfilled.
translation:
  language: ru
  text: А оттуда они отплыли в Антиохию, откуда они были вверены благодати Божьей для дела, которое завершили.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дела, которое исполнили».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: А оттуда
  rationale: Передаёт и повествовательную связь с предыдущим эпизодом, и указание на место отправления.
- source_word: ἀπέπλευσαν
  choice: отплыли
  rationale: Естественно и точно обозначает отправление морем; русская приставка «от-» передаёт направительный оттенок.
- source_word: εἰς Ἀντιόχειαν
  choice: в Антиохию
  rationale: Нормальное русское обозначение направления движения к городу.
- source_word: ὅθεν
  choice: откуда прежде
  rationale: Сохраняет буквальное значение исходной точки; «прежде» проясняет временную соотнесённость, уже выраженную греческой конструкцией прошедшего предшествования.
- source_word: ἦσαν παραδεδομένοι
  choice: были вверены
  rationale: 'Передаёт состояние, возникшее вследствие предшествующего действия: их отдали под попечение Божьей благодати, не уточняя сверх текста церковный обряд или форму поручения.'
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: благодати Божьей
  rationale: Сохраняет богословски значимое слово «благодать» и дательный падеж при «вверены».
- source_word: εἰς τὸ ἔργον
  choice: для дела
  rationale: Прямо передаёт целевое значение и не сужает широкое ἔργον до более интерпретирующего «миссия».
- source_word: ὃ ἐπλήρωσαν
  choice: которое теперь завершили
  rationale: В данном контексте πληρόω означает доведение порученного дела до конца. «Теперь» естественно отмечает контраст между прежним вверением и достигнутым завершением, не добавляя нового события.
theological_decisions:
- issue: Характер прежнего действия антиохийской общины по отношению к Павлу и Варнаве
  choice: были вверены благодати Божьей
  alternative: были препоручены благодати Божьей
  rationale: «Вверены» ясно выражает передачу под действие и попечение Божьей благодати, не вводя специальной конфессиональной терминологии.
- issue: Отношение Божьей благодати к порученному делу
  choice: вверены благодати Божьей для дела
  alternative: преданы благодати Божьей на дело
  rationale: 'Сохранена синтаксическая напряжённость оригинала: люди вверены благодати ради дела; текст не переформулирован так, будто благодать является лишь средством выполнения задачи.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Божьей» понятно современному читателю и сохраняет достоинство речи; порядок слов близок к греческому, но естественен по-русски.
