  verdict: revise
  source_fidelity: '«Отплыли в Антиохию» точно передаёт κἀκεῖθεν ἀπέπλευσαν εἰς Ἀντιόχειαν. «Были вверены благодати Божьей» адекватно передаёт перипрастический плюсквамперфект ἦσαν παραδεδομένοι и не навязывает конфессионального толкования. Однако «теперь» не имеет соответствия в греческом тексте и создаёт добавочное временное противопоставление. Слово «прежде» избыточно: предшествование уже выражено формой «были вверены» в контексте завершённого дела.'
  naturalness: Исправленная формулировка сохраняет современный литературный русский и библейски сдержанный регистр. «Откуда они были вверены...» звучит естественнее, чем «откуда прежде были вверены», поскольку ясно обозначает действующих лиц и не перегружает фразу.
  terminology: «Благодать Божья» — точная и устойчивая передача τῇ χάριτι τοῦ θεοῦ. «Дело» сохраняет широту ἔργον. Для ἐπλήρωσαν уместно «завершили»; сноска предлагает допустимое «исполнили».
