  - severity: low
    issue: «Прежде» избыточно в придаточном с «откуда».
    rationale: Плюсквамперфектное значение ἦσαν παραδεδομένοι уже передано формой «были вверены» относительно последующего «завершили»; «прежде» не требуется и несколько утяжеляет русский текст.
  revised_text: А оттуда они отплыли в Антиохию, откуда они были вверены благодати Божьей для дела, которое завершили.[a]
