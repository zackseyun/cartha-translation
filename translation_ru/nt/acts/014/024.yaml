lexical_decisions:
- source_word: διελθόντες
  choice: пройдя через
  rationale: Аористное причастие от διέρχομαι обозначает действие, предшествующее основному глаголу; деепричастный оборот естественно и точно передаёт эту временную связь.
- source_word: τὴν Πισιδίαν
  choice: Писидию
  rationale: Общепринятая русская форма названия исторической области; винительный падеж обусловлен конструкцией с глаголом движения.
- source_word: ἦλθον
  choice: они пришли
  rationale: Прямое и естественное в повествовании соответствие ἔρχομαι; форма множественного числа сохраняет подразумеваемое греческим глаголом подлежащее.
- source_word: εἰς τὴν Παμφυλίαν
  choice: в Памфилию
  rationale: Предлог εἰς выражает направленное движение; русская конструкция «в» с винительным падежом естественно передаёт вход в область.
- source_word: καὶ
  choice: не передано отдельным словом
  rationale: В русском повествовании связь с предыдущим событием достаточно выражена последовательностью действий; начальное «и» здесь возможно, но утяжеляло бы фразу без смысловой необходимости.
