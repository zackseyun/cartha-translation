  text: καὶ ταῦτα λέγοντες μόλις κατέπαυσαν τοὺς ὄχλους τοῦ μὴ θύειν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/018.yaml
  text: Even by saying these things, they barely restrained the crowds from sacrificing to them.
translation:
  language: ru
  text: И, говоря это, они едва удержали толпы от принесения им жертв.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ταῦτα λέγοντες
  choice: Но даже говоря это
  rationale: 'καί в контексте передаёт усилительно-противительный оттенок: несмотря на только что сказанное, остановить людей оказалось трудно. Причастный оборот сохранён естественной русской конструкцией.'
- source_word: μόλις κατέπαυσαν
  choice: едва удержали
  rationale: μόλις означает «едва, с трудом», а κατέπαυσαν здесь — добиться прекращения или не допустить действия; «удержали» естественно сочетается с последующим оборотом.
- source_word: τοὺς ὄχλους
  choice: толпы
  rationale: Множественное число оригинала сохранено.
- source_word: τοῦ μὴ θύειν αὐτοῖς
  choice: от того, чтобы принести им жертвы
  rationale: Артикль с отрицательным инфинитивом после κατέπαυσαν обозначает предотвращённое действие. Аористическое «принести» уместно для намеченного жертвоприношения; αὐτοῖς относится к Павлу и Варнаве.
theological_decisions:
- issue: Характер сопротивления апостолов языческому поклонению
  choice: едва удержали толпы
  alternative: с трудом убедили толпы не приносить им жертв
  rationale: Перевод сохраняет силу μόλις и не добавляет отсутствующего в тексте уточнения о способе воздействия; подчёркнуто, что апостолы отвергли предназначенные им жертвы.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и повествовательная, с сохранением усиления «даже» и напряжения «едва».
