lexical_decisions:
- source_word: οὗτος
  choice: Этот человек
  rationale: Указательное местоимение отсылает к человеку, не владевшему ногами, из предыдущего стиха; явное обозначение сохраняет связь контекста.
- source_word: ἤκουσεν
  choice: слушал
  rationale: В данном контексте передаёт не просто слышание, а восприятие речи Павла, не добавляя лишнего толкования.
- source_word: τοῦ Παύλου λαλοῦντος
  choice: Павла, когда тот говорил
  rationale: Естественно передаёт родительный абсолют и одновременность действий, сохраняя Павла как говорящего.
- source_word: ἀτενίσας αὐτῷ
  choice: пристально посмотрел на него
  rationale: Передаёт сосредоточенный, напряжённый взгляд без неуместного оттенка грубого разглядывания.
- source_word: ἰδὼν
  choice: увидел
  rationale: Сохраняет конкретную лексику зрительного восприятия, которая в контексте допускает смысл распознавания.
- source_word: ἔχει πίστιν
  choice: у него есть вера
  rationale: Настоящее время греческого текста сохранено; πίστις здесь обозначает веру, направленную на получение Божьей помощи.
- source_word: τοῦ σωθῆναι
  choice: для исцеления
  rationale: В ближайшем контексте речь идёт о восстановлении способности ходить; конструкция выражает направленность или возможность этой веры. Более широкое значение глагола отмечено в сноске.
theological_decisions:
- issue: Значение σωθῆναι в повествовании об исцелении
  choice: для исцеления
  alternative: для спасения
  rationale: Следующий стих описывает телесное восстановление, поэтому контекстуальный смысл — исцеление. При этом более широкая сотериологическая возможность греческого глагола не устраняется, а сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным и достойным повествовательным стилем. Разделение первой части и действий Павла на два предложения устраняет двусмысленность относительного местоимения. Конечная запятая сохранена, поскольку синтаксическая конструкция продолжается в следующем стихе.
