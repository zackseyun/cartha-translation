  text: Ἐπῆλθαν δὲ ἀπὸ Ἀντιοχείας καὶ Ἰκονίου Ἰουδαῖοι, καὶ πείσαντες τοὺς ὄχλους καὶ λιθάσαντες τὸν Παῦλον ἔσυρον ἔξω τῆς πόλεως, ⸀νομίζοντες αὐτὸν τεθνηκέναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/019.yaml
  text: But Jews came from Antioch and Iconium[a], and after persuading the crowds and stoning Paul, they dragged him outside the city, supposing that he was dead.
translation:
  language: ru
  text: Но из Антиохии и Иконии пришли иудеи; они убедили толпы, побили Павла камнями и поволокли его за пределы города, полагая, что он мёртв.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «думая, что он умер». Греческий текст сообщает об их предположении, но прямо не утверждает, что Павел действительно умер.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπῆλθαν δὲ
  choice: Но ... пришли
  rationale: δέ обозначает контрастный поворот после предшествующего благоприятного отклика, а ἐπῆλθαν сообщает о прибытии противников из других городов.
- source_word: Ἰουδαῖοι
  choice: иудеи
  rationale: В данном контексте речь идёт об иудеях, прибывших из Антиохии и Иконии; традиционное русское «иудеи» точно и не связывает их с современным национальным обозначением.
- source_word: πείσαντες τοὺς ὄχλους
  choice: склонив толпы на свою сторону
  rationale: Передаёт не просто интеллектуальное убеждение, а достигнутое воздействие на собравшихся людей; множественное число ὄχλους сохранено.
- source_word: λιθάσαντες τὸν Παῦλον
  choice: побили Павла камнями
  rationale: Естественная русская формулировка для казни или нападения посредством побивания камнями; причастие передано как предшествующее основному действию.
- source_word: ἔσυρον ἔξω τῆς πόλεως
  choice: а затем вытащили его за город
  rationale: «Вытащили» передаёт насильственное волочение, а «затем» ясно выражает последовательность после побивания камнями. Местоимение добавлено для естественности русского синтаксиса.
- source_word: νομίζοντες αὐτὸν τεθνηκέναι
  choice: полагая, что он мёртв
  rationale: Сохраняет значение предположения нападавших и результативное состояние, выраженное перфектным инфинитивом, не утверждая фактическую смерть Павла.
theological_decisions:
- issue: Утверждает ли стих фактическую смерть Павла или только мнение нападавших
  choice: «полагая, что он мёртв»
  alternative: «думая, что он умер»; истолкование, согласно которому Павел действительно умер
  rationale: Греческий текст прямо сообщает лишь предположение нападавших (νομίζοντες), а не удостоверяет смерть Павла. Перевод сохраняет эту смысловую и богословскую неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. «Склонив толпы на свою сторону» звучит естественнее буквального «убедив толпы» и передаёт враждебное воздействие; «побили ... камнями» сохраняет традиционную и общепонятную библейскую лексику.
