id: ACT.14.15
reference: Acts 14:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ἄνδρες, τί ταῦτα ποιεῖτε; καὶ ἡμεῖς ὁμοιοπαθεῖς ἐσμεν ὑμῖν ἄνθρωποι, εὐαγγελιζόμενοι ὑμᾶς ἀπὸ τούτων τῶν ματαίων ἐπιστρέφειν ἐπὶ ⸀θεὸν ζῶντα ὃς ἐποίησεν τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/015.yaml
  text: and saying[a], “Men, why are you doing these things? We also are men with the same nature as you, bringing you good news to turn from these worthless things to the living God[c][b], who made the heaven and the earth and the sea and everything in them.”
translation:
  language: ru
  text: 'и говорили: «Мужи, что вы делаете? Мы тоже такие же люди, как и вы[a]. Мы возвещаем вам добрую весть, чтобы вы отвернулись от этих тщетных вещей[b] и обратились к живому Богу, который сотворил небо[c], землю, море и всё, что в них».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «испытывающие то же, что и вы»; речь идёт об общей для них человеческой природе и участи.'
    reason: lexical_alternative
  - marker: b
    text: Под «тщетными вещами» в данном контексте подразумевается бесплодное языческое поклонение, в том числе идолам.
    reason: cultural_note
  - marker: c
    text: 'Или: «небеса»; в греческом тексте стоит единственное число в традиционной формуле о сотворении мира.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες
  choice: Мужи
  rationale: Звательная форма прямо обращена к мужчинам в толпе; «мужи» сохраняет точность и уместный возвышенный тон публичной речи, не будучи непонятным современному читателю.
- source_word: ὁμοιοπαθεῖς … ἄνθρωποι
  choice: люди, подобные вам по своей природе
  rationale: Передаёт общность человеческой природы и положения Павла, Варнавы и слушателей, а не только сходство чувств или переживаний.
- source_word: εὐαγγελιζόμενοι
  choice: возвещаем вам добрую весть
  rationale: Сохраняет глагольное значение благой вести и звучит естественно, не подменяя его более поздней церковной терминологией.
- source_word: ἀπὸ τούτων τῶν ματαίων
  choice: от этих тщетных вещей
  rationale: «Тщетные» передаёт пустоту, бесполезность и ложность языческого почитания, не сужая греческое выражение до одних материальных идолов.
- source_word: ἐπιστρέφειν ἐπὶ θεὸν ζῶντα
  choice: чтобы вы отвернулись … и обратились к живому Богу
  rationale: В русском языке парная конструкция естественно выражает направленность движения от ложного почитания к Богу; «живому» сохраняет контраст с безжизненными объектами поклонения.
- source_word: ἐποίησεν
  choice: сотворил
  rationale: В контексте перечисления неба, земли и моря глагол обозначает Божье творческое действие; «сотворил» естественно воспроизводит библейскую формулу.
- source_word: τὸν οὐρανὸν
  choice: небо
  rationale: Русское единственное число точно соответствует греческому и естественно звучит в устойчивой формуле творения.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: всё, что в них
  rationale: Естественно и полно передаёт совокупность всего находящегося в небе, на земле и в море.
theological_decisions:
- issue: Человеческий статус Павла и Варнавы в противоположность оказываемым им божественным почестям
  choice: Мы тоже люди, подобные вам по своей природе
  alternative: Мы такие же люди, как и вы
  rationale: Формулировка недвусмысленно отвергает представление о божественности апостолов и сохраняет смысл общей человеческой природы, не сводя его к общности эмоций.
- issue: Объём значения выражения τῶν ματαίων
  choice: тщетные вещи
  alternative: идолы
  rationale: Контекст включает идолопоклонство и попытку языческого жертвоприношения, но греческое выражение шире прямого наименования идолов; более широкая формулировка сохранена в тексте, а контекст уточнён в сноске.
- issue: Характер призыва ἐπιστρέφειν
  choice: чтобы вы отвернулись … и обратились
  alternative: обращая вас
  rationale: Целевая конструкция ясно передаёт содержание возвещаемой вести и сохраняет нравственно-религиозное направление от тщетного поклонения к живому Богу без конфессионального уточнения механизма обращения.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной апостольской речи. «Мужи» сохраняет гендерную точность обращения; остальная фраза построена естественно для современного читателя. Сохранены повторяющиеся союзы в перечне творения и широкое значение анти-языческого выражения.
