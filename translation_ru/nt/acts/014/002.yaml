  text: οἱ δὲ ⸀ἀπειθήσαντες Ἰουδαῖοι ἐπήγειραν καὶ ἐκάκωσαν τὰς ψυχὰς τῶν ἐθνῶν κατὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/002.yaml
  text: But the Jews who were disobedient stirred up the Gentiles and poisoned their minds against the brothers[a][b][c].
translation:
  language: ru
  text: Но иудеи, отказавшиеся поверить, подстрекнули язычников и настроили их против братьев.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «непокорившиеся». Греческое слово может обозначать отказ поверить возвещённой вести и связанное с ним неповиновение.'
    reason: lexical_alternative
  - marker: b
    text: «Братья» здесь, вероятно, означает всех верующих, включая женщин.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειθήσαντες
  choice: отказавшиеся поверить
  rationale: В миссионерском контексте Деяний слово обозначает не просто непослушание, а сознательное неприятие возвещённой вести; перевод сохраняет и смысл неверия, и волевой оттенок отказа.
- source_word: Ἰουδαῖοι
  choice: иудеи
  rationale: Речь идёт о противившейся вести группе местных иудеев, а не обо всём еврейском народе; это ограничение следует из контекста.
- source_word: ἐπήγειραν
  choice: возбудили неприязнь
  rationale: Глагол выражает подстрекательство и возбуждение враждебного настроя; дополнение раскрывается в связи со следующим выражением.
- source_word: ἐκάκωσαν τὰς ψυχὰς
  choice: настроили их против
  rationale: Буквально речь идёт о причинении зла «душам», но в данном сочетании смысл состоит в порче внутреннего расположения и формировании враждебного отношения. Русское выражение естественно передаёт этот идиоматический смысл без антропологического уточнения.
- source_word: τῶν ἐθνῶν
  choice: язычников
  rationale: В иудейско-нееврейском противопоставлении Деяний это обычное обозначение людей из других народов, не принадлежавших к иудеям.
- source_word: κατὰ τῶν ἀδελφῶν
  choice: против братьев
  rationale: Перевод сохраняет мужскую форму греческого множественного числа; в раннехристианском употреблении слово могло обозначать всю общину верующих.
theological_decisions:
- issue: 'Значение ἀπειθήσαντες: неверие или непослушание'
  choice: отказавшиеся поверить
  alternative: непокорившиеся; не поверившие
  rationale: Контекст принятия или отвержения апостольской вести поддерживает значение отказа верить, однако сноска сохраняет более широкую возможность неповиновения.
- issue: Охват слова ἀδελφῶν применительно к христианской общине
  choice: братьев
  alternative: братьев и сестёр; верующих
  rationale: Основной текст следует грамматической форме источника, а сноска указывает на вероятный собирательный смысл, включающий женщин.
translation_notes:
  register: Современный литературный русский язык с повествовательной ясностью и умеренно формальным библейским регистром. Конструкция «возбудили неприязнь… и настроили их» передаёт два греческих глагола без неестественного буквального выражения «озлобили души».
