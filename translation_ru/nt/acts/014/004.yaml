source:
  edition: SBLGNT
  text: ἐσχίσθη δὲ τὸ πλῆθος τῆς πόλεως, καὶ οἱ μὲν ἦσαν σὺν τοῖς Ἰουδαίοις οἱ δὲ σὺν τοῖς ἀποστόλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/004.yaml
  text: But the people of the city were divided[a], and some were with the Jews and some with the apostles.
translation:
  language: ru
  text: 'Но жители города разделились[a]: одни были на стороне иудеев, а другие — на стороне апостолов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «множество города было разделено».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσχίσθη
  choice: разделились
  rationale: Пассивная форма σχίζω означает «быть разделённым, расколоться». В русском языке при собирательном обозначении жителей естественна возвратная форма «разделились», передающая общественное размежевание.
- source_word: τὸ πλῆθος τῆς πόλεως
  choice: жители города
  rationale: Буквально выражение означает «множество города», но в контексте речь идёт о населении города, а не обязательно об одном собравшемся скоплении людей. «Жители города» ясно и естественно передаёт смысл.
- source_word: δὲ
  choice: Но
  rationale: 'δέ обозначает переход с оттенком противопоставления: предыдущая проповедь вызвала не единодушие, а разделение.'
- source_word: οἱ μὲν ... οἱ δὲ
  choice: одни ... а другие
  rationale: Парная конструкция обозначает две противопоставленные группы; это её естественный русский эквивалент.
- source_word: σὺν
  choice: на стороне
  rationale: Хотя σύν буквально означает «с», здесь оно выражает принадлежность к одной из противостоящих сторон. «На стороне» делает этот смысл явным без избыточного толкования.
- source_word: Ἰουδαίοις
  choice: иудеев
  rationale: В стихе нет основания сужать значение до иудейских руководителей; традиционное «иудеи» точно обозначает названную повествователем группу.
- source_word: ἀποστόλοις
  choice: апостолов
  rationale: В Деяниях 14:14 Лука прямо называет Павла и Варнаву апостолами; установленный русский термин сохраняет авторское обозначение.
theological_decisions:
- issue: Кого обозначают «апостолы»
  choice: Сохранить повествовательное обозначение Павла и Варнавы словом «апостолы».
  alternative: Передать более общим словом «посланники».
  rationale: Далее в этой же главе Лука прямо употребляет ἀπόστολοι применительно к Варнаве и Павлу (Деян. 14:14). Прямой перевод сохраняет формулировку текста и не добавляет к ней более узкого доктринального определения.
translation_notes:
  register: Современный литературный русский язык. Формулировка «жители города» понятна широкому читателю и естественнее буквального «множество города»; «на стороне» ясно передаёт контекст общественного размежевания. Тире во второй части устраняет ненужный повтор сказуемого.
