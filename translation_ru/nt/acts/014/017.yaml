  text: ⸀καίτοι οὐκ ἀμάρτυρον ⸀αὑτὸν ἀφῆκεν ⸀ἀγαθουργῶν, οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς καὶ καιροὺς καρποφόρους, ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης τὰς καρδίας ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/017.yaml
  text: Yet he did not leave himself without witness[a], doing good by giving you rains from heaven and fruitful seasons[c][b], filling your hearts with food and gladness.
translation:
  language: ru
  text: 'Однако Он не оставил Себя без свидетельства[a], делая добро: давая вам дожди с неба и плодородные времена[b], насыщая ваши сердца пищей и радостью[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «без свидетельства о Себе».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «плодоносящие времена».'
    reason: lexical_alternative
  - marker: c
    text: 'В некоторых рукописях: «наши сердца»; в SBLGNT — «ваши сердца».'
    reason: textual_variant
lexical_decisions:
- source_word: καίτοι
  choice: Однако
  rationale: 'Передаёт уступительно-противительный смысл: хотя Бог позволял народам идти своими путями, Он всё же свидетельствовал о Себе.'
- source_word: ἀμάρτυρον
  choice: без свидетельства
  rationale: Сохраняет свидетельский оттенок греческого слова и естественно сочетается с выражением «не оставил Себя».
- source_word: αὑτὸν
  choice: Себя
  rationale: Возвратное местоимение относится к Богу и показывает, что речь идёт о свидетельстве Бога о Самом Себе.
- source_word: ἀγαθουργῶν
  choice: делал добро
  rationale: Прямо и естественно передаёт продолжающееся благотворное действие Бога.
- source_word: οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς
  choice: давая вам дожди с неба
  rationale: Сохраняет множественное число «дожди», адресат «вам» и библейски естественное «с неба».
- source_word: καιροὺς καρποφόρους
  choice: урожайные времена
  rationale: Передаёт сельскохозяйственный смысл плодоносящих периодов; «времена» сохраняет широту καιροί, не сводя их непременно к четырём сезонам года.
- source_word: ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης
  choice: насыщая ... пищей и радостью
  rationale: «Насыщая» хорошо выражает полноту наполнения, а «пищей и радостью» сохраняет конкретное благо и внутреннее ликование.
- source_word: τὰς καρδίας ὑμῶν
  choice: ваши сердца
  rationale: Следует чтению SBLGNT с местоимением второго лица множественного числа.
theological_decisions:
- issue: Свидетельство Бога о Себе в благом промысле
  choice: Дожди, урожай и радость представлены как Божье свидетельство о Себе
  alternative: Понимать перечисленное лишь как безличные природные процессы
  rationale: Возвратное «Себя», слово «свидетельство» и причастия, описывающие Божьи действия, прямо связывают Его благость в творении с Его свидетельством о Себе.
- issue: Связь причастия ἀγαθουργῶν с главным глаголом
  choice: Двоеточие вводит пояснение того, как Бог не оставлял Себя без свидетельства
  alternative: Оформить причастие отдельным независимым утверждением
  rationale: Причастная конструкция объясняет содержание и способ свидетельства, не превращаясь в самостоятельную мысль.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис сохраняет ход греческой фразы, но двоеточие делает пояснительную связь причастий ясной. Заглавные местоимения по отношению к Богу применены последовательно в рамках данного стиха.
