base_translation:
  language: en
  yaml_path: translation/nt/acts/014/012.yaml
  text: And they were calling Barnabas Zeus[a], and Paul Hermes[b], because he was the chief speaker.
translation:
  language: ru
  text: Они называли Варнаву Зевсом, а Павла — Гермесом[a], потому что именно он был главным оратором[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых традиционных переводах: «Юпитером» и «Меркурием»; в греческом тексте стоят имена «Зевс» и «Гермес».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «он был главным говорящим»; буквально: «он был ведущим речи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλουν
  choice: называли
  rationale: Имперфект передаёт продолжавшееся действие; русское несовершенное прошедшее «называли» естественно сохраняет этот оттенок.
- source_word: τε
  choice: не выражено отдельно
  rationale: Частица слабо связывает фразу с предыдущим повествованием; в русском отдельный союз здесь не требуется.
- source_word: Δία
  choice: Зевсом
  rationale: Передано греческое имя божества, прямо стоящее в исходном тексте, а не римский эквивалент «Юпитер».
- source_word: Ἑρμῆν
  choice: Гермесом
  rationale: Передано греческое имя божества, прямо стоящее в исходном тексте, а не римский эквивалент «Меркурий».
- source_word: ἐπειδὴ
  choice: потому что
  rationale: Ясно вводит причину, по которой Павла отождествили с Гермесом.
- source_word: αὐτὸς
  choice: он
  rationale: Постпозиция «говорил он» естественно передаёт эмфатическое выделение Павла в противопоставлении Варнаве.
- source_word: ὁ ἡγούμενος τοῦ λόγου
  choice: главным образом говорил
  rationale: Идиоматически передаёт роль Павла как того, кто вёл речь и был основным говорящим, не придавая λόγος специального богословского значения.
theological_decisions:
- issue: Передача имён языческих божеств
  choice: Зевс и Гермес
  alternative: Юпитер и Меркурий
  rationale: Греческий текст называет именно Зевса и Гермеса; римские соответствия происходят из поздней переводческой традиции и не должны заменять исходные имена.
- issue: Значение λόγος в выражении ὁ ἡγούμενος τοῦ λόγου
  choice: речь, говорение
  alternative: слово или послание в специальном богословском смысле
  rationale: В данном повествовательном контексте выражение обозначает ведущую роль Павла в устной речи, а не богословский титул или особое обозначение благовестия.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Инверсия «говорил он» сохраняет смысловое ударение на Павле; имена греческих богов переданы в общеупотребительной русской форме.
