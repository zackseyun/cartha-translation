  variant: modern literary Russian
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ καὶ συναγαγόντες τὴν ἐκκλησίαν ⸀ἀνήγγελλον ὅσα ἐποίησεν ὁ θεὸς μετ’ αὐτῶν καὶ ὅτι ἤνοιξεν τοῖς ἔθνεσιν θύραν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/027.yaml
  text: And when they arrived and gathered the church together[a], they reported all that God had done with them[b], and that he had opened a door of faith to the Gentiles.
translation:
  language: ru
  text: Прибыв, они собрали церковь и рассказали обо всём, что Бог совершил вместе с ними[a], и о том, что Он открыл язычникам дверь веры[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершил через них». Греческое выражение буквально означает «вместе с ними».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «открыл народам дверь веры».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενοι
  choice: прибыв
  rationale: Аористное причастие обозначает действие, предшествующее основному; деепричастие естественно и кратко передаёт эту временную связь.
- source_word: συναγαγόντες τὴν ἐκκλησίαν
  choice: собрали всю церковь
  rationale: Речь идёт о созыве местной общины. «Церковь» сохраняет обычное для Деяний значение ἐκκλησία, а «всю» естественно выражает собрание общины как целого, не добавляя отдельного богословского смысла.
- source_word: ἀνήγγελλον
  choice: рассказали
  rationale: Глагол описывает обстоятельный отчёт перед общиной; «рассказали» звучит естественно в современном русском и не придаёт сообщению излишне официального оттенка.
- source_word: ὅσα
  choice: обо всём, что
  rationale: Естественная русская передача относительной конструкции со значением полноты сообщаемого.
- source_word: ἐποίησεν ὁ θεὸς μετ’ αὐτῶν
  choice: Бог совершил вместе с ними
  rationale: «Вместе с ними» прямо сохраняет значение μετά с родительным падежом и не сводит неоднозначность к исключительно инструментальному «через них».
- source_word: ἤνοιξεν
  choice: открыл
  rationale: Совершенный вид передаёт завершённое действие Бога, о котором апостолы сообщают по возвращении.
- source_word: τοῖς ἔθνεσιν
  choice: язычникам
  rationale: В контексте Деяний слово обозначает прежде всего неевреев, а не политические народы; «язычникам» ясно передаёт это противопоставление.
- source_word: θύραν πίστεως
  choice: дверь веры
  rationale: Сохранены и образ двери, и неоднозначная родительная конструкция, которую не следует без необходимости разворачивать как «дверь к вере» или «возможность уверовать».
- source_word: πίστεως
  choice: веры
  rationale: Обычная и богословски нейтральная передача πίστις в данном контексте.
theological_decisions:
- issue: Значение μετ’ αὐτῶν при описании Божьего действия
  choice: Бог совершил вместе с ними
  alternative: Бог совершил через них
  rationale: Главным деятелем остаётся Бог, а Павел и Варнава связаны с Его действием. Буквальное «вместе с ними» сохраняет возможную смысловую широту и не усиливает инструментальное значение без необходимости.
- issue: Передача ἔθνεσιν
  choice: язычникам
  alternative: народам
  rationale: В данном повествовательном контексте имеется в виду принятие Благой вести неевреями. «Язычникам» передаёт это точнее, не превращая выражение в указание на государства или этнические нации.
- issue: Смысл θύραν πίστεως
  choice: дверь веры
  alternative: дверь к вере
  rationale: Родительная конструкция допускает оттенки доступа к вере, возможности уверовать или входа в сферу веры. Сохранение образной конструкции не устраняет эту плодотворную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; тон ясный и достойный. Сохранены библейский образ «дверь веры» и смысловая неоднозначность выражения о Божьем действии «вместе с ними».
