  source_fidelity: 'Смысл в целом передан точно: речь о совместном враждебном выступлении язычников и иудеев с их начальниками против Павла и Варнавы; инфинитивы обозначают намеченные, а не совершённые в данном стихе действия. «Попытались» удачно передаёт контекстуальный смысл ἐγένετο ὁρμή. Однако «подвергнуть издевательствам» в современном русском часто ассоциируется с насмешками или травлей и недостаточно ясно выражает тяжёлое оскорбительное/жестокое обращение, заключённое в ὑβρίσαι.'
