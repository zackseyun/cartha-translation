lexical_decisions:
- source_word: ὡς δὲ
  choice: Но когда
  rationale: Передаёт временное значение ὡς и лёгкий повествовательный переход или контраст, выраженный δέ.
- source_word: ἐγένετο ὁρμὴ
  choice: попытались
  rationale: В данном контексте сочетание описывает начало враждебного действия или покушение; инфинитивы указывают на задуманные действия, а не на их совершение в этом стихе.
- source_word: τῶν ἐθνῶν τε καὶ Ἰουδαίων
  choice: язычники и иудеи
  rationale: ἔθνη в противопоставлении иудеям означает неевреев; τε καί связывает обе группы как совместных участников.
- source_word: σὺν τοῖς ἄρχουσιν αὐτῶν
  choice: вместе со своими начальниками
  rationale: ἄρχοντες обозначает людей, обладающих властью; «начальники» естественно передаёт это значение, не уточняя без основания, была ли власть гражданской или общинной.
- source_word: ὑβρίσαι
  choice: подвергнуть их издевательствам
  rationale: Передаёт оскорбительное и жестокое обращение, не сужая значение до одних лишь словесных оскорблений.
- source_word: καὶ λιθοβολῆσαι αὐτούς
  choice: и побить камнями
  rationale: Точно передаёт действие λιθοβολέω без добавления прямо не выраженного результата «до смерти».
