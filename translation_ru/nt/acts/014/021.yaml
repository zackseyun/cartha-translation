  text: Εὐαγγελισάμενοί τε τὴν πόλιν ἐκείνην καὶ μαθητεύσαντες ἱκανοὺς ὑπέστρεψαν εἰς τὴν Λύστραν καὶ ⸀εἰς Ἰκόνιον καὶ ⸁εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/021.yaml
  text: And after proclaiming the good news in that city and making many disciples[a], they returned to Lystra and to Iconium and to Antioch,
translation:
  language: ru
  text: Возвестив добрую весть в том городе и сделав многих учениками, они возвратились в Листру, в Иконию и в Антиохию.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐαγγελισάμενοί
  choice: возвестив добрую весть
  rationale: Аористное причастие обозначает действие, предшествующее возвращению. «Возвестив добрую весть» естественно и доступно передаёт εὐαγγελίζομαι без излишне специализированной церковной лексики.
- source_word: τε
  choice: и
  rationale: Частица слегка связывает этот оборот с предшествующим повествованием; союз «и» сохраняет связность фразы.
- source_word: τὴν πόλιν ἐκείνην
  choice: в том городе
  rationale: Указательное выражение отсылает к Дервии из предыдущего контекста; русское управление глагола требует предлога «в».
- source_word: μαθητεύσαντες
  choice: приобретя учеников
  rationale: Глагол означает сделать людей учениками. Выражение «приобрести учеников» передаёт результативное значение и естественно звучит по-русски.
- source_word: ἱκανοὺς
  choice: немало
  rationale: В данном контексте слово указывает на значительное число; «немало» сохраняет умеренную, но явно количественную оценку, не усиливая её до максимально общего «много».
- source_word: ὑπέστρεψαν
  choice: они возвратились
  rationale: Прямо передаёт основное завершённое действие — возвращение по уже пройденному маршруту.
- source_word: εἰς τὴν Λύστραν καὶ εἰς Ἰκόνιον καὶ εἰς Ἀντιόχειαν
  choice: в Листру, затем в Иконию и Антиохию
  rationale: Направление передано естественными русскими формами названий. «Затем» ясно выражает последовательность пунктов маршрута, тогда как буквальное повторение «и в» было бы тяжеловесным.
theological_decisions:
- issue: Значение μαθητεύσαντες
  choice: приобретя немало учеников
  alternative: наставив многих учеников
  rationale: Греческий переходный глагол здесь означает сделать людей учениками, а не просто наставлять уже существующих учеников; выбранный перевод сохраняет миссионерский результат без конфессиональных уточнений.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный повествовательный стиль. Сохранена последовательность действий и пунктов обратного пути; церковнославянизмы и узкоконфессиональная терминология не использованы.
