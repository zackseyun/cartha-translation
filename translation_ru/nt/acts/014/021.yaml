  naturalness: Исправленный текст сохраняет современный литературный, повествовательный регистр. «Сделав многих учениками» несколько более формально, чем разговорная речь, но ясно, естественно для библейского повествования и точно передаёт переходный греческий глагол.
  terminology: «Добрая весть» адекватно передаёт εὐαγγέλιον/εὐαγγελίζομαι без навязывания конфессионального термина. «Ученики» сохраняет основной термин μαθητής. Названия Листра, Икония и Антиохия переданы нормативно.
