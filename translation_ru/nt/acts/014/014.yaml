  text: ἀκούσαντες δὲ οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος, διαρρήξαντες τὰ ἱμάτια ⸀αὐτῶν ⸀ἐξεπήδησαν εἰς τὸν ὄχλον κράζοντες
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/014.yaml
  text: But when the apostles Barnabas and Paul heard, they tore their garments and rushed out into the crowd, crying out,
translation:
  language: ru
  text: 'Но апостолы Варнава и Павел, услышав об этом, разорвали на себе одежды[a], бросились в толпу[b], крича:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Разрывание одежд было обычным знаком скорби, ужаса или протеста против воздания людям божественных почестей.
    reason: cultural_note
  - marker: b
    text: 'Или: «вскочили в толпу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: услышав об этом
  rationale: Аористное причастие передаёт предшествующее обстоятельство; добавленное по-русски «об этом» естественно отсылает к действиям толпы из контекста, не уточняя их сверх текста.
- source_word: δὲ
  choice: Но
  rationale: Передаёт контрастный переход от намерения толпы принести жертву к резкой реакции апостолов.
- source_word: οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος
  choice: апостолы Варнава и Павел
  rationale: Сохраняет прямое приложение греческого текста, называющего Варнаву и Павла апостолами, без догматического сужения значения термина.
- source_word: διαρρήξαντες τὰ ἱμάτια αὐτῶν
  choice: разорвали на себе одежды
  rationale: Естественная русская формулировка для жеста скорби, ужаса и решительного протеста; «на себе» ясно передаёт αὐτῶν и характер действия.
- source_word: ἐξεπήδησαν
  choice: бросились
  rationale: Передаёт внезапное и стремительное движение; приставочный элемент не обязательно требует отдельного «наружу», поскольку исходная точка в стихе не названа.
- source_word: εἰς τὸν ὄχλον
  choice: в толпу
  rationale: εἰς обозначает направленное движение внутрь скопления людей.
- source_word: κράζοντες
  choice: и закричали
  rationale: Передаёт громкое возглашение, сопровождающее движение; личная глагольная форма естественнее русского деепричастного нагромождения и вводит прямую речь следующего стиха.
theological_decisions:
- issue: Обозначение Варнавы и Павла словом «апостолы»
  choice: 'Сохранить: «апостолы Варнава и Павел»'
  alternative: «Варнава и Павел, посланники» либо толкование термина только применительно к Двенадцати
  rationale: Греческое приложение прямо относит ἀπόστολοι к Варнаве и Павлу в данном эпизоде. Перевод сохраняет это утверждение, не разрешая через формулировку более широкий богословский спор об объёме термина.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сделан плавным и динамичным; двоеточие уместно, поскольку далее следует содержание возгласа. Все сноски отмечены в основном тексте.
