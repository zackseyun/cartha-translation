  text: κυκλωσάντων δὲ ⸂τῶν μαθητῶν αὐτὸν⸃ ἀναστὰς εἰσῆλθεν εἰς τὴν πόλιν. καὶ τῇ ἐπαύριον ἐξῆλθεν σὺν τῷ Βαρναβᾷ εἰς Δέρβην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/020.yaml
  text: But after the disciples had gathered around him[a], he got up and went into the city[b]. And on the next day he went out with Barnabas to Derbe.
translation:
  language: ru
  text: Но когда ученики окружили его[a], он встал[b] и вошёл в город. На следующий день он вместе с Варнавой отправился в Дервию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обступили его».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поднялся». Греческое слово может передаваться и как «поднялся», но здесь, вероятнее всего, речь идёт о том, что Павел физически встал, а не о прямом указании на воскресение.'
    reason: alternative_reading
lexical_decisions:
- source_word: κυκλωσάντων
  choice: окружили
  rationale: Аористное причастие от κυκλόω означает «окружить, образовать круг вокруг». В данном контексте слово не выражает враждебности, поскольку действуют ученики; естественное русское «окружили его» сохраняет пространственный образ.
- source_word: δὲ
  choice: Но
  rationale: 'δέ обозначает мягкий переход с оттенком контраста: после побиения Павла камнями и оставления его за мёртвого повествование принимает неожиданный оборот.'
- source_word: τῶν μαθητῶν
  choice: ученики
  rationale: μαθητής последовательно передаётся традиционным и понятным в контексте Деяний словом «ученик».
- source_word: ἀναστὰς
  choice: он встал
  rationale: Причастие от ἀνίστημι здесь естественно описывает физическое действие Павла. «Встал» точно и нейтрально, не добавляя прямого утверждения о воскресении или чудесном оживлении.
- source_word: εἰσῆλθεν εἰς τὴν πόλιν
  choice: вошёл в город
  rationale: Сжато и естественно передаёт движение внутрь, выраженное εἰσέρχομαι с εἰς.
- source_word: τῇ ἐπαύριον
  choice: На следующий день
  rationale: Естественная русская передача дательного времени со значением следующего дня.
- source_word: ἐξῆλθεν ... εἰς Δέρβην
  choice: отправился ... в Дервию
  rationale: Буквально ἐξέρχομαι означает «выйти», однако при указанном пункте назначения русское «отправился в» естественно передаёт начало пути и избегает тяжеловесного «вышел ... в Дервию».
- source_word: σὺν τῷ Βαρναβᾷ
  choice: вместе с Варнавой
  rationale: σύν с дательным обозначает сопровождение; «вместе с» ясно выражает совместное путешествие.
- source_word: Δέρβην
  choice: Дервию
  rationale: Использована устоявшаяся русская библейская форма топонима «Дервия» в винительном падеже.
theological_decisions:
- issue: Следует ли понимать ἀναστὰς как указание на воскресение или чудесное оживление
  choice: 'Передано как обычное физическое действие: «он встал»'
  alternative: «он восстал» или «он был воскрешён»
  rationale: Само причастие ἀναστὰς часто означает просто «встав». Хотя контекст описывает поразительное восстановление Павла после побиения камнями, стих прямо не называет это воскресением и не использует пассивную конструкцию «был воскрешён».
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Синтаксис простой и повествовательный; «вошёл» и «отправился» звучат естественно и достойно. Все маркеры примечаний присутствуют в основном тексте.
