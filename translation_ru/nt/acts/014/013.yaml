- from: А жрец Зевса, чей храм находился перед городом[a], привёл к воротам быков и принёс венки[b] и вместе с толпами хотел совершить жертвоприношение.
  to: Жрец Зевса, храм которого находился перед городом[a], привёл к воротам быков и принёс венки[b], намереваясь вместе с собравшимися толпами совершить жертвоприношение.
  rationale: Правка устраняет неуклюжесть исходной координации и яснее передаёт, что жрец намеревался совершить жертвоприношение совместно с толпами. Формально спорный оборот о Зевсе по-прежнему объяснён в сноске, поэтому добавление «храм» в основном тексте не скрывает неоднозначности источника.
