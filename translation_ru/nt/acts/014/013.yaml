base_translation:
  language: en
  yaml_path: translation/nt/acts/014/013.yaml
  text: And the priest of Zeus[a], whose temple was before the city[b], brought bulls and wreaths to the gates and wanted to offer sacrifice with the crowds.
translation:
  language: ru
  text: Жрец Зевса, храм которого находился перед городом[a], привёл к воротам быков и принёс венки[b], намереваясь вместе с собравшимися толпами совершить жертвоприношение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Зевса, находившегося перед городом»; вероятно, имеется в виду храм или святилище Зевса перед городом, то есть за городской чертой.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «гирлянды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅ τε
  choice: А
  rationale: Продолжает повествование и естественно вводит нового участника событий.
- source_word: ἱερεὺς τοῦ Διὸς
  choice: жрец Зевса
  rationale: «Жрец» точно обозначает служителя языческого культа, а «Зевс» сохраняет греческое имя божества.
- source_word: τοῦ ὄντος πρὸ τῆς πόλεως
  choice: чей храм находился перед городом
  rationale: Оборот формально относится к Зевсу, но по смыслу, вероятнее всего, указывает на его святилище у города; слово «храм» добавлено для ясности, а буквальная особенность отмечена в сноске.
- source_word: ταύρους
  choice: быков
  rationale: Прямое современное соответствие в контексте жертвоприношения.
- source_word: στέμματα
  choice: венки
  rationale: Обозначает ритуальные венки или гирлянды, употреблявшиеся при жертвоприношении.
- source_word: ἐπὶ τοὺς πυλῶνας
  choice: к воротам
  rationale: Предлог с направлением движения и глагол принесения естественно передаются как «к воротам»; множественное число сохранено.
- source_word: ἐνέγκας
  choice: привёл ... и принёс
  rationale: В русском языке разные глаголы для быков и венков обеспечивают естественность и ясно выражают действие аористного причастия.
- source_word: σὺν τοῖς ὄχλοις
  choice: вместе с толпами
  rationale: Сохранено множественное число ὄχλοις и совместность действия.
- source_word: ἤθελεν θύειν
  choice: хотел совершить жертвоприношение
  rationale: Передаёт намерение и культовый смысл θύω, не сводя его к простому закланию.
theological_decisions:
- issue: Подразумеваемый референт в τοῦ ὄντος πρὸ τῆς πόλεως
  choice: «чей храм находился перед городом»
  alternative: «Зевса, находившегося перед городом» или «чьё святилище находилось за городской чертой»
  rationale: Контекст жреца и жертвоприношения позволяет подразумевать храм или святилище Зевса, однако греческий текст прямо этого существительного не содержит. Основной текст остаётся понятным, а формальная неоднозначность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного регистра. «Жрец» и «жертвоприношение» ясно передают языческий культовый контекст. Конструкция с двумя глаголами — «привёл ... быков и принёс венки» — естественнее по-русски, чем единый глагол для одушевлённых животных и предметов.
