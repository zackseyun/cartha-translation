    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ φωνῇ
  choice: громко
  rationale: Дательный оборот обозначает образ действия. «Громко сказал» естественно передаёт силу голоса в современном русском языке.
- source_word: Ἀνάστηθι
  choice: Встань
  rationale: Аористный императив требует принять стоячее положение; «встань» прямо соответствует контексту исцеления человека, прежде не владевшего ногами.
- source_word: ἐπὶ τοὺς πόδας σου
  choice: на ноги
  rationale: Обычное русское выражение, обозначающее положение стоя и сохраняющее образ исходного текста.
- source_word: ὀρθός
  choice: прямо
  rationale: Наречие естественно передаёт требование стоять выпрямившись; буквальное прилагательное в русском повелении звучало бы менее естественно.
- source_word: ἥλατο
  choice: вскочил
  rationale: Глагол передаёт внезапное энергичное движение; «вскочил» ярко и естественно выражает немедленную реакцию исцелённого.
- source_word: περιεπάτει
  choice: стал ходить
  rationale: Имперфект допускает инхоативное понимание — начало продолжающегося действия. «Стал ходить» естественно показывает наступившую способность и последующее действие, не исключая оттенка продолжительности.
theological_decisions:
- issue: Чудо и повеление принять вертикальное положение
  choice: Передать повеление и последовавшее действие как непосредственное физическое исцеление без поясняющих добавлений.
  alternative: Добавить явное утверждение о причине или силе исцеления.
  rationale: Греческий текст сообщает прямое повеление и немедленную видимую реакцию, но в самом стихе не формулирует дополнительного богословского объяснения.
- issue: Вид действия περιεπάτει
  choice: стал ходить
  alternative: ходил / продолжал ходить
  rationale: Имперфект может обозначать как начавшееся, так и продолжавшееся действие; основной текст выбирает естественное для контекста инхоативное прочтение, а примечание сохраняет грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и живое, без архаизмов. «Тот» помогает однозначно отнести действие к исцелённому человеку. Восклицательный знак передаёт громкое, властное повеление, не добавляя содержания.
