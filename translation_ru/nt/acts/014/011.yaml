  yaml_path: translation/nt/acts/014/011.yaml
  text: And when the crowds saw what Paul had done[a], they raised their voices, saying in the Lycaonian language, “The gods, having become like men[b], have come down to us!”
translation:
  language: ru
  text: 'Увидев, что сделал Павел, толпы подняли голоса и стали говорить по-ликаонски: «Боги, став подобными людям[a], сошли к нам!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приняв человеческий облик»; буквально: «будучи уподоблены людям».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε ὄχλοι
  choice: народ
  rationale: Греческое множественное ὄχλοι обозначает собравшуюся толпу; в русском повествовании собирательное «народ» звучит естественно, а τέ продолжает ход рассказа без обязательного отдельного союза.
- source_word: ἰδόντες ὃ ἐποίησεν Παῦλος
  choice: Увидев, что сделал Павел
  rationale: Аористное причастие передаёт предшествующее обстоятельство; деепричастная конструкция естественно сохраняет последовательность действий.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: поднял голос
  rationale: Сохранён образ греческой идиомы, означающей громкое восклицание; число согласовано с собирательным «народ».
- source_word: Λυκαονιστὶ λέγοντες
  choice: заговорил по-ликаонски
  rationale: Наречие обозначает использование ликаонского языка. Формулировка ясна современному читателю и не перегружена пояснениями.
- source_word: Οἱ θεοὶ
  choice: Боги
  rationale: Множественное число прямо передаёт языческое истолкование события жителями Листры.
- source_word: ὁμοιωθέντες ἀνθρώποις
  choice: уподобившись людям
  rationale: Передаёт пассивное причастие ὁμοιωθέντες и идею сходства, не превращая высказывание толпы в специально христологическую формулу.
- source_word: κατέβησαν πρὸς ἡμᾶς
  choice: сошли к нам
  rationale: «Сошли» кратко и естественно передаёт движение сверху вниз; русский совершенный вид уместен в живом восклицании.
theological_decisions:
- issue: Передача языческого понимания явления богов в человеческом облике
  choice: Боги, уподобившись людям, сошли к нам
  alternative: Боги в человеческом облике сошли к нам
  rationale: Выбранный вариант ближе к грамматической форме ὁμοιωθέντες и сохраняет утверждение толпы как её собственное языческое истолкование, не внося терминологии христианского учения о воплощении.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Реплика толпы краткая и эмоциональная; редкое обозначение языка передано естественным наречием «по-ликаонски».
