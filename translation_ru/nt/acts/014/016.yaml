base_translation:
  language: en
  yaml_path: translation/nt/acts/014/016.yaml
  text: In past generations he allowed all the nations to walk in their own ways[a].
translation:
  language: ru
  text: В минувших поколениях Он позволил всем народам идти своими путями.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «позволил всем язычникам идти своими путями».'
    reason: 'Лексическая альтернатива: ἔθνη может означать «язычники».'
lexical_decisions:
- source_word: ὃς
  choice: Он
  rationale: Относительное местоимение связывает фразу с Богом, названным в предыдущем стихе. В русском отдельном стихе естественнее продолжить мысль личным местоимением, не затемняя референта.
- source_word: ἐν ταῖς παρῳχημέναις γενεαῖς
  choice: В минувших поколениях
  rationale: Передаёт поколения, отошедшие в прошлое, естественно и в достойном современном регистре.
- source_word: εἴασεν
  choice: позволял
  rationale: Глагол означает допущение или позволение и не подразумевает одобрения. Несовершенный вид естественно описывает Божье отношение на протяжении прежних поколений.
- source_word: πάντα τὰ ἔθνη
  choice: всем народам
  rationale: Дательный падеж обусловлен русской конструкцией «позволять кому-либо». «Народы» сохраняет широкий этнический смысл ἔθνη, не сводя его исключительно к конфессиональному обозначению язычников.
- source_word: πορεύεσθαι
  choice: идти
  rationale: Сохраняет образ движения, который вместе с «путями» метафорически обозначает образ жизни, и звучит по-русски естественнее буквального «ходить» в этой конструкции.
- source_word: ταῖς ὁδοῖς αὐτῶν
  choice: своими путями
  rationale: Возвратное притяжательное местоимение естественно передаёт αὐτῶν при подлежащем «народы»; «путями» сохраняет метафору жизненного поведения.
theological_decisions:
- issue: Божественное позволение и одобрение
  choice: Бог позволял народам идти своими путями
  alternative: Бог одобрял их пути или предопределял их поведение
  rationale: εἴασεν выражает позволение, а не нравственное одобрение или причинное предопределение. Формулировка сохраняет напряжение между Божьим владычеством и ответственностью людей.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской метафоры пути. Заглавное «Он» помогает ясно указать на Бога как на референта из предыдущего стиха; формулировка остаётся понятной и торжественной без архаизации.
