  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐπιστηρίζοντες τὰς ψυχὰς τῶν μαθητῶν, παρακαλοῦντες ἐμμένειν τῇ πίστει καὶ ὅτι διὰ πολλῶν θλίψεων δεῖ ἡμᾶς εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/022.yaml
  text: strengthening the souls of the disciples[a], encouraging them to remain in the faith[c][b], and saying that through many afflictions we must enter the kingdom of God.
translation:
  language: ru
  text: 'укрепляя души учеников, призывая их оставаться в вере и говоря: «Через многие скорби нам надлежит войти в Царство Бога».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστηρίζοντες
  choice: укрепляя
  rationale: Причастие настоящего времени обозначает продолжающееся действие; «укрепляя» естественно передаёт придание стойкости без добавления идеи формального утверждения в должности.
- source_word: τὰς ψυχὰς τῶν μαθητῶν
  choice: души учеников
  rationale: Сохраняет явное ψυχάς и его значение внутренней жизни, не навязывая при этом жёсткого противопоставления души и тела.
- source_word: παρακαλοῦντες
  choice: призывая
  rationale: 'В сочетании с инфинитивом передаёт поддерживающее увещание: не только утешение, но и побуждение к стойкости.'
- source_word: ἐμμένειν τῇ πίστει
  choice: оставаться в вере
  rationale: «Оставаться» точно передаёт продолжение и постоянство; русское «в вере» естественно сохраняет возможный диапазон между личной верой и верой как общим исповеданием.
- source_word: διὰ πολλῶν θλίψεων
  choice: через многие скорби
  rationale: «Скорби» передаёт бедствия, давление и страдания, сохраняя серьёзность выражения и привычное библейское звучание без архаизма.
- source_word: δεῖ ἡμᾶς
  choice: нам надлежит
  rationale: Передаёт безличную необходимость с полной силой, не поясняя её богословский механизм и не добавляя отсутствующего в тексте действующего лица.
- source_word: εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: войти в Царство Бога
  rationale: Естественная русская конструкция движения; «Царство Бога» сохраняет форму родительного оборота и многозначность βασιλεία как царства и царствования.
theological_decisions:
- issue: Значение πίστις с артиклем
  choice: в вере
  alternative: держаться веры / оставаться верными
  rationale: Греческий артикль может указывать на определённую, разделяемую учениками веру, однако русская конструкция «в вере» естественно оставляет открытым и аспект личного доверия. Перевод не сводит слово исключительно ни к системе учения, ни к субъективному переживанию.
- issue: Сила δεῖ
  choice: нам надлежит войти
  alternative: мы должны войти / нам необходимо войти
  rationale: «Надлежит» сохраняет утверждение необходимости, не превращая скорби в заслугу и не уточняя, каким именно образом обусловлена эта необходимость.
- issue: Связь скорбей со вхождением в Царство Бога
  choice: Через многие скорби нам надлежит войти
  alternative: мы должны пройти через многие скорби, чтобы войти
  rationale: Сохранено греческое обстоятельство пути или средства без добавления целевого оттенка, который мог бы появиться в конструкции «чтобы войти».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сохраняет причастную связь с предыдущим контекстом стиха; перед прямой речью добавлено только подразумеваемое глаголом речи «говоря», необходимое для естественного русского выражения.
