review_pass:
  verdict: approve
  source_fidelity: Перевод точно передаёт три причастных действия (ἐπιστηρίζοντες, παρακαλοῦντες, говоря), призыв оставаться в вере и утверждение о необходимости войти в Царство Бога через многие скорби. «Нам надлежит» адекватно сохраняет силу δεῖ, не объясняя её богословски. Прямая речь после «говоря» естественно оформляет придаточное с ὅτι и не меняет смысла.
  naturalness: Текст грамматически цельный и звучит как современный литературный русский с уместным сдержанно-библейским регистром. «Укрепляя души учеников», «оставаться в вере», «через многие скорби» и «нам надлежит войти» естественны в данном жанре.
  terminology: «Ученики», «вера», «скорби» и «Царство Бога» последовательно и точно передают ключевые термины. Формулировка «в вере» разумно не сужает τῇ πίστει исключительно до конфессионально-доктринального значения, сохраняя возможный общий и личный аспект.
