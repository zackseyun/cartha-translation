  text: εἶπεν δὲ πρὸς αὐτὸν ὁ κύριος· Πορεύου, ὅτι σκεῦος ἐκλογῆς ⸂ἐστίν μοι⸃ οὗτος τοῦ βαστάσαι τὸ ὄνομά μου ἐνώπιον ⸀ἐθνῶν ⸀τε καὶ βασιλέων υἱῶν τε Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/015.yaml
  text: But the Lord said to him[a], “Go[b], because this man is a chosen instrument of mine to carry my name before the Gentiles and kings and the sons of Israel,”
translation:
  language: ru
  text: 'Но Господь сказал ему: «Иди, потому что этот человек — Моё избранное орудие, чтобы нести Моё имя перед язычниками[a], царями и сынами Израиля[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «народами».
    reason: lexical_alternative
  - marker: b
    text: «Сыны Израиля» — традиционное библейское обозначение народа Израиля.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Господь
  rationale: Обычное и естественное русское соответствие титулу κύριος; в данном повествовании так назван воскресший Иисус, говорящий с властью.
- source_word: Πορεύου
  choice: Иди
  rationale: Кратко и естественно передаёт повелительное наклонение без излишней книжности.
- source_word: σκεῦος ἐκλογῆς ἐστίν μοι
  choice: избранное Мною орудие
  rationale: Передаёт метафорическое значение σκεῦος как средства для определённой цели, смысл избрания в ἐκλογῆς и личное отношение, выраженное μοι. «Орудие» понятно современному читателю и не затемняет смысл буквальным «сосуд».
- source_word: τοῦ βαστάσαι
  choice: чтобы нести
  rationale: Передаёт целевое значение артиклевого инфинитива и сохраняет образ несения имени.
- source_word: τὸ ὄνομά μου
  choice: Моё имя
  rationale: Сохраняет буквальную библейскую формулировку и её смысловые оттенки представительства, власти и публичного свидетельства.
- source_word: ἐνώπιον
  choice: перед
  rationale: Естественно передаёт нахождение и свидетельство перед названными группами.
- source_word: ἐθνῶν
  choice: язычниками
  rationale: В противопоставлении сынам Израиля слово обозначает нееврейские народы; более буквальный вариант «народами» отмечен в сноске.
- source_word: βασιλέων
  choice: царями
  rationale: Точное и понятное соответствие конкретному обозначению царей.
- source_word: υἱῶν Ἰσραήλ
  choice: сынами Израиля
  rationale: Сохраняет мужское родственное выражение оригинала и традиционную библейскую форму; его собирательный смысл пояснён в сноске.
- source_word: τε ... καὶ ... τε
  choice: и
  rationale: Три группы естественно соединены по-русски перечислением и союзом «и», без искусственного воспроизведения каждой греческой частицы.
theological_decisions:
- issue: Возможное доктринальное переосмысление ἐκλογῆς
  choice: избранное Мною орудие
  alternative: сосуд избрания; избранный сосуд
  rationale: Фраза ясно говорит о Божьем избрании для служения, но не превращает стих в утверждение одной из позднейших систематических доктрин об избрании.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сделан естественным для устной речи в повествовании; ключевые образы «нести Моё имя» и «сыны Израиля» сохранены.
