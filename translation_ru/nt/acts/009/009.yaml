lexical_decisions:
- source_word: ἦν ἡμέρας τρεῖς
  choice: Три дня он
  rationale: Винительный длительности естественно передаётся по-русски обстоятельством «три дня»; отдельная передача связки ἦν сделала бы фразу тяжеловесной.
- source_word: μὴ βλέπων
  choice: ничего не видел
  rationale: Причастное сочетание буквально означает «не видя». Русское «ничего не видел» естественно передаёт неспособность Савла видеть, не вводя в основной текст более сильное определение «слеп».
- source_word: οὐκ ἔφαγεν οὐδὲ ἔπιεν
  choice: не ел и не пил
  rationale: Два согласованных отрицания наиболее естественно и точно передаются симметричной русской конструкцией «не ел и не пил».
