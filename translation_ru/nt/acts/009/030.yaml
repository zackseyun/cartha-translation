  text: ἐπιγνόντες δὲ οἱ ἀδελφοὶ κατήγαγον αὐτὸν εἰς Καισάρειαν καὶ ἐξαπέστειλαν αὐτὸν εἰς Ταρσόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/030.yaml
  text: When the brothers learned this[a], they brought him down to Caesarea and sent him off to Tarsus.
translation:
  language: ru
  text: Узнав об этом, братья[a] сопроводили его вниз, в Кесарию, и отправили в Тарс.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры». В греческом тексте буквально «братья», но здесь слово может обозначать всю общину верующих.'
    reason: Лексическая альтернатива и пояснение возможного инклюзивного значения.
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: узнав об этом
  rationale: Аористное причастие обозначает обстоятельство, побудившее к последующим действиям. Дополнение подразумевается из предыдущего стиха, поэтому по-русски естественно уточнить «об этом».
- source_word: οἱ ἀδελφοὶ
  choice: братья
  rationale: Передаёт мужскую форму греческого существительного; возможное более широкое обозначение общины верующих отмечено в сноске.
- source_word: κατήγαγον
  choice: отвели
  rationale: Глагол означает «отвести/привести вниз», в данном контексте — доставить к приморской Кесарии. Русское «отвели» естественно передаёт сопровождаемое перемещение; буквальное «свели вниз» здесь звучало бы неестественно.
- source_word: Καισάρειαν
  choice: Кесарию
  rationale: Традиционная русская форма названия города; по контексту имеется в виду приморская Кесария.
- source_word: ἐξαπέστειλαν
  choice: отправили
  rationale: Естественно передаёт направление человека дальше, в другой город, сохраняя усиленный оттенок составного глагола без тяжеловесности.
- source_word: Ταρσόν
  choice: Тарс
  rationale: Традиционная русская форма названия города.
theological_decisions:
- issue: Значение ἀδελφοί применительно к общине, возможно включавшей мужчин и женщин
  choice: братья
  alternative: братья и сёстры; верующие
  rationale: В основном тексте сохранена грамматически мужская форма оригинала, а вероятный широкий общинный смысл указан в сноске, чтобы не устранять заложенную в тексте неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. «Отвели» предпочтено буквальному, но неестественному «свели вниз»; географическое направление к побережью не акцентируется сверх возможностей русского контекста.
