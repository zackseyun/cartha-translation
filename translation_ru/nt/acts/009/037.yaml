  text: ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἀσθενήσασαν αὐτὴν ἀποθανεῖν· λούσαντες δὲ ⸂ἔθηκαν αὐτὴν⸃ ἐν ὑπερῴῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/037.yaml
  text: In those days it happened that she became sick and died. After washing her[a], they laid her in an upstairs room.
translation:
  language: ru
  text: В те дни она заболела и умерла. Тело её омыли и положили в комнате на верхнем этаже.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в горнице». Греческое слово означает комнату на верхнем этаже.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις
  choice: В те дни
  rationale: Естественная для современного русского повествовательная передача временной рамки и мягкого перехода; отдельная передача формулы ἐγένετο здесь была бы тяжеловесной и избыточной.
- source_word: ἀσθενήσασαν αὐτὴν ἀποθανεῖν
  choice: она заболела и умерла
  rationale: Финитная конструкция естественно передаёт греческий оборот с винительным и инфинитивом и сохраняет последовательность болезни и смерти.
- source_word: λούσαντες
  choice: Тело её омыли
  rationale: Контекст однозначно указывает на омовение после смерти; явное слово «тело» устраняет возможное впечатление, будто омывали живую женщину, а «омыли» соответствует погребальному контексту.
- source_word: ἔθηκαν αὐτὴν
  choice: положили
  rationale: Глагол естественно описывает помещение тела в определённое место и сохраняет нейтральный смысл τίθημι.
- source_word: ἐν ὑπερῴῳ
  choice: в комнате на верхнем этаже
  rationale: ὑπερῷον обозначает помещение верхнего этажа; такая передача современна и не создаёт ложной ассоциации с какой-либо одной известной горницей.
theological_decisions:
- issue: Следует ли передавать ὑπερῴῳ традиционным словом «горница»
  choice: в комнате на верхнем этаже
  alternative: в горнице
  rationale: Греческое слово указывает прежде всего на расположение помещения, а не на особое сакральное место. Прозрачная пространственная формулировка не привносит традиционных ассоциаций.
translation_notes:
  register: Современный литературный русский язык; краткое, ясное повествование без архаического «случилось». Уточнение «тело» является контекстуальной экспликацией после прямо названной смерти. Маркер сноски поставлен при выражении, к которому относится лексическая альтернатива.
