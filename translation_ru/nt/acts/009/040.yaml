base_translation:
  language: en
  yaml_path: translation/nt/acts/009/040.yaml
  text: But Peter put them all outside[a], knelt down and prayed, and turning toward the body said, “Tabitha, arise.” Then she opened her eyes, and when she saw Peter, she sat up.
translation:
  language: ru
  text: 'Пётр же велел всем выйти, встал на колени и помолился. Затем, повернувшись к телу, он сказал: «Тавифа, встань[a]!» Она открыла глаза и, увидев Петра, села.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поднимись». Греческий глагол допускает оба варианта; «встань» сохраняет краткость и торжественный тон повеления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλὼν ἔξω πάντας
  choice: велел всем выйти
  rationale: Оборот означает, что Пётр удалил всех присутствующих. Такой перевод естественен по-русски, сохраняет направленность действия и не приписывает ему излишней физической силы.
- source_word: θεὶς τὰ γόνατα
  choice: встал на колени
  rationale: Греческая идиома обозначает коленопреклонённую позу; выбран обычный современный русский оборот.
- source_word: προσηύξατο
  choice: помолился
  rationale: Прямой и естественный эквивалент формы προσεύχομαι.
- source_word: ἐπιστρέψας πρὸς τὸ σῶμα
  choice: повернувшись к телу
  rationale: Сохранены физическое движение и нейтральное значение σῶμα; слово «труп» было бы более резким и менее точно соответствовало бы лексеме.
- source_word: Ταβιθά
  choice: Тавифа
  rationale: Использована устоявшаяся русская форма арамейского имени.
- source_word: ἀνάστηθι
  choice: встань
  rationale: Краткий повелительный глагол естественно звучит как обращение и сохраняет связь ἀνίστημι с поднятием и возвращением к жизни; возможная широта значения отмечена в сноске.
- source_word: ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς
  choice: открыла глаза
  rationale: Прямой и естественный перевод греческого выражения.
- source_word: ἰδοῦσα τὸν Πέτρον
  choice: увидев Петра
  rationale: Деепричастный оборот кратко и ясно передаёт предшествующее обстоятельство.
- source_word: ἀνεκάθισεν
  choice: села
  rationale: Глагол означает, что лежавшая женщина приподнялась и приняла сидячее положение; в русском контексте «села» передаёт это естественно и без ненужного добавления.
- source_word: δὲ / καί
  choice: же / затем / и
  rationale: 'Частицы переданы в соответствии с их повествовательной функцией: δέ обозначает переход, а καί — последовательность и связь событий.'
theological_decisions:
- issue: Передача повеления ἀνάστηθι в сцене возвращения к жизни
  choice: встань
  alternative: поднимись
  rationale: «Встань» сохраняет краткость и торжественную силу приказа, а также его связь с лексикой воскресения, не утверждая сверх того, что выражено в повествовании. Альтернатива отражена в сноске, поскольку глагол может обозначать и более общее поднятие.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно торжественным повествовательным тоном. Синтаксис упрощён до естественной русской последовательности без утраты действий исходного текста; богословская неоднозначность глагола ἀνίστημι сохранена с помощью сноски.
