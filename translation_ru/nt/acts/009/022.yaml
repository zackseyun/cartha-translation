  yaml_path: translation/nt/acts/009/022.yaml
  text: But Saul kept gaining strength all the more and was confounding the Jews living in Damascus[a], proving that this one is the Messiah.
translation:
  language: ru
  text: А Савл становился всё сильнее и приводил в замешательство иудеев, живших в Дамаске, доказывая, что Он и есть Мессия[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческий титул Χριστός означает «Помазанник»; здесь он передан словом «Мессия», чтобы сохранить его иудейский мессианский смысл.'
    reason: alternative_reading
lexical_decisions:
- source_word: μᾶλλον ἐνεδυναμοῦτο
  choice: становился всё сильнее
  rationale: Передаёт продолженное действие имперфекта и сравнительное усиление μᾶλλον, не уточняя без достаточных оснований, был ли источник укрепления внутренним или внешним.
- source_word: συνέχυννεν
  choice: приводил в замешательство
  rationale: Сохраняет сильное значение глагола — повергать в растерянность, лишать возможности уверенно возражать — и естественно звучит в контексте спора.
- source_word: τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ
  choice: иудеев, живших в Дамаске
  rationale: Точно ограничивает обозначенную группу местными иудеями и передаёт причастный оборот современным литературным русским языком.
- source_word: συμβιβάζων
  choice: доказывая
  rationale: В данном контексте глагол обозначает сведение доводов воедино для обоснования вывода; деепричастие сохраняет связь с основным действием.
- source_word: οὗτός
  choice: Он и есть
  rationale: Сочетание указательного местоимения с усилительной конструкцией по-русски естественно передаёт акцент οὗτος; прописная буква указывает на Иисуса в ближайшем контексте, не добавляя Его имени в текст стиха.
- source_word: ὁ χριστός
  choice: Мессия
  rationale: Здесь Χριστός употреблено как титул обещанного Помазанника в иудейском контексте, поэтому «Мессия» яснее сохраняет смысл исходного утверждения.
theological_decisions:
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: 'Определённый артикль и содержание доказательства указывают на титульное употребление: Савл обосновывает, что Иисус — обещанный Помазанник. В сноске сохранён традиционный вариант.'
- issue: Источник укрепления Савла
  choice: становился всё сильнее
  alternative: получал всё больше силы
  rationale: Форма ἐνεδυναμοῦτο допускает среднее или страдательное осмысление. Выбранная формулировка сохраняет эту открытость и не утверждает прямо источник силы.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. «Приводил в замешательство» передаёт полемическую силу глагола без разговорности; «Он и есть» естественно сохраняет эмфатический характер указательного местоимения.
