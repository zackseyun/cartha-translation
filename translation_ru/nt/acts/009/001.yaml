  terminology: «Савл», «ученики», «Господь» и «первосвященник» употреблены точно и в подходящем церковно-историческом регистре. «Убийством» допустимо для φόνου; при этом оборот «дышал угрозами и убийством» следует понимать как выражение смертельной враждебности, а не как утверждение о конкретно совершённом убийстве.
