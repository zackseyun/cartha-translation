  text: Ὁ δὲ Σαῦλος ἔτι ἐμπνέων ἀπειλῆς καὶ φόνου εἰς τοὺς μαθητὰς τοῦ κυρίου, προσελθὼν τῷ ἀρχιερεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/001.yaml
  text: But Saul[a], still breathing threats and murder against the disciples of the Lord, came to the high priest
translation:
  language: ru
  text: А Савл, всё ещё дыша угрозами и убийством против учеников Господа, пришёл к первосвященнику
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: Передаёт переход повествования обратно к Савлу с лёгким оттенком противопоставления, естественным для русского рассказа.
- source_word: ἔτι
  choice: всё ещё
  rationale: Подчёркивает продолжение враждебного состояния Савла, известного из предшествующего контекста.
- source_word: ἐμπνέων
  choice: дышал
  rationale: 'Сохраняет яркую метафору оригинала: угрозы и убийство словно были дыханием Савла.'
- source_word: ἀπειλῆς
  choice: угрозами
  rationale: Творительный падеж естественно сочетается по-русски с глаголом «дышал» и передаёт содержание враждебности.
- source_word: φόνου
  choice: убийством
  rationale: Передаёт убийство и смертоносное намерение без более узкого образа массовой резни; единственное число соответствует форме оригинала.
- source_word: εἰς τοὺς μαθητὰς
  choice: против учеников
  rationale: В контексте угроз и убийства εἰς выражает враждебную направленность.
- source_word: μαθητὰς
  choice: учеников
  rationale: Обычный и точный русский термин для последователей Иисуса в Деяниях.
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: Стандартно передаёт κύριος и естественно относится к ученикам, принадлежащим Господу.
- source_word: προσελθὼν
  choice: Он пришёл к
  rationale: Развёртывание причастия в отдельное личное предложение делает русский текст естественным, сохраняя последовательность действия.
- source_word: ἀρχιερεῖ
  choice: первосвященнику
  rationale: Устоявшийся и точный русский эквивалент единственного числа ἀρχιερεύς.
theological_decisions:
- issue: Передача κύριος в τοῦ κυρίου
  choice: Господа
  alternative: Владыки
  rationale: «Господь» — контекстуально точное и укоренённое обозначение Иисуса в повествовании Луки и Деяний; оснований заменять его менее обычным титулом нет.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Образ «дышал угрозами и убийством» намеренно сохранён как выразительная метафора оригинала. Греческое причастие προσελθών передано отдельным предложением, поскольку стих обрывается перед содержанием просьбы в следующем стихе.
