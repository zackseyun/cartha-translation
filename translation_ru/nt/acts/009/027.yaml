  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ ἐπιλαβόμενος αὐτὸν ἤγαγεν πρὸς τοὺς ἀποστόλους, καὶ διηγήσατο αὐτοῖς πῶς ἐν τῇ ὁδῷ εἶδεν τὸν κύριον καὶ ὅτι ἐλάλησεν αὐτῷ καὶ πῶς ἐν Δαμασκῷ ἐπαρρησιάσατο ἐν τῷ ὀνόματι ⸀τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/027.yaml
  text: But Barnabas took hold of him and brought him to the apostles, and told them how on the road he had seen the Lord, and that he had spoken to him, and how in Damascus he had spoken boldly in the name of Jesus.
translation:
  language: ru
  text: Но Варнава, взяв его с собой, привёл его к апостолам и рассказал им, как Савл по дороге увидел Господа, что Господь говорил с ним и как в Дамаске Савл смело говорил во имя Иисуса.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος αὐτὸν
  choice: взяв его с собой
  rationale: Передаёт как конкретное действие Варнавы, так и его поддерживающее участие; буквальное «схватив его» в современном русском создавало бы неуместный оттенок насилия.
- source_word: ἤγαγεν πρὸς τοὺς ἀποστόλους
  choice: привёл к апостолам
  rationale: 'Естественно и точно передаёт действие ἄγω: Варнава лично приводит Савла и представляет его апостолам.'
- source_word: διηγήσατο
  choice: рассказал им
  rationale: Глагол обозначает последовательный рассказ; простое современное «рассказал» сохраняет смысл без излишне книжного оттенка.
- source_word: πῶς ἐν τῇ ὁδῷ
  choice: как по дороге
  rationale: Здесь ὁδός обозначает путь Савла в Дамаск, а не название христианского движения.
- source_word: εἶδεν τὸν κύριον
  choice: Савл увидел Господа
  rationale: Имя «Савл» вводится для устранения местоименной двусмысленности, неизбежной по-русски; κύριος сохраняется как христологически значимый титул «Господь».
- source_word: ὅτι ἐλάλησεν αὐτῷ
  choice: как Господь говорил с ним
  rationale: Контекст указывает, что подразумеваемый субъект — Господь. Повтор существительного делает это ясным по-русски. «Говорил» передаёт аорист без навязывания аспектуальной детализации.
- source_word: ἐπαρρησιάσατο
  choice: смело говорил
  rationale: Передаёт свободу, открытость и дерзновение речи, не сужая значение до более специального «проповедовал».
- source_word: ἐν τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: во имя Иисуса
  rationale: Сохраняет устойчивый библейский оборот, включающий связь с авторитетом Иисуса и исповеданием его имени.
theological_decisions:
- issue: К кому относится титул κύριος в рассказе о встрече по дороге
  choice: «Господь» относится к Иисусу
  alternative: Более общее обозначение Бога без явного отождествления с Иисусом
  rationale: Ближайший контекст Деян 9 прямо связывает явление Савлу с воскресшим Иисусом, а заключительная фраза стиха говорит об имени Иисуса. При этом перевод сохраняет сам титул «Господь», а не заменяет его именем.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Повтор «Савл» и «Господь» вместо цепочки неоднозначных местоимений необходим для естественной русской референции. Синтаксический параллелизм трёх придаточных с «как» делает перечисление плавным и понятным.
