  naturalness: «Иисус Мессия» — допустимое современное литературное титульное сочетание; краткая реплика сохраняет исходную лаконичность. «Постели себе постель» естественно передаёт действие по устройству постели.
  terminology: «Мессия» сохраняет смысл Χριστός как титула; вариант «Христос» следует оставить в сноске. Имя «Эней», «исцеляет», «Встань» и «тотчас» точны и стилистически уместны.
