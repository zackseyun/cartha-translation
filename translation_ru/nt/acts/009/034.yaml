  text: καὶ εἶπεν αὐτῷ ὁ Πέτρος· Αἰνέα, ἰᾶταί σε Ἰησοῦς ⸀Χριστός· ἀνάστηθι καὶ στρῶσον σεαυτῷ· καὶ εὐθέως ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/034.yaml
  text: And Peter said to him[a], “Aeneas, Jesus the Messiah heals you[b]. Get up and make your bed.” And immediately he got up.
translation:
  language: ru
  text: 'И Пётр сказал ему: «Эней, Иисус Мессия[a] исцеляет тебя. Встань и постели себе постель[b]». И тотчас он встал.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисус Христос». Греческое Χριστός — титул со значением «Помазанник», то есть «Мессия».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «приготовь себе постель».'
    reason: lexical_clarification
lexical_decisions:
- source_word: ἰᾶταί
  choice: исцеляет
  rationale: Настоящее время ἰάομαι передано настоящим временем без превращения возвещения об исцелении в явно завершённое «исцелил» или процессуальное «исцеляет сейчас».
- source_word: Χριστός
  choice: Христос
  rationale: Обычное и узнаваемое русское соответствие греческому титулу; альтернативное смысловое соответствие «Мессия» указано в сноске, чтобы сохранить его титульный характер.
- source_word: ἀνάστηθι
  choice: встань
  rationale: Естественный современный императив в обращении к лежавшему больному; передаёт прямой приказ подняться.
- source_word: στρῶσον σεαυτῷ
  choice: застели себе постель
  rationale: «Застели» передаёт приготовление постели, а «себе» сохраняет σεαυτῷ и подчёркивает вновь обретённую способность Энея самому позаботиться о своём спальном месте.
- source_word: εὐθέως
  choice: тотчас
  rationale: Краткое литературное наречие, точно передающее немедленность действия.
- source_word: ἀνέστη
  choice: он встал
  rationale: Повторяет ключевой глагол повеления и ясно сообщает о его немедленном исполнении.
- source_word: Αἰνέα
  choice: Эней
  rationale: Традиционная и общепринятая русская передача личного имени.
theological_decisions:
- issue: Передача Χριστός в возвещении об исцелении
  choice: Иисус Христос
  alternative: Иисус Мессия
  rationale: «Христос» сохраняет прямую связь с греческим словом и естественно звучит по-русски; сноска раскрывает титульное значение «Мессия», не превращая его без пояснения в фамильное имя.
- issue: Временной оттенок ἰᾶταί
  choice: исцеляет тебя
  alternative: исцелил тебя
  rationale: Греческая форма стоит в настоящем времени. Выбранный вариант сохраняет напряжение между совершающимся речевым актом и его немедленным результатом, не навязывая перфектного истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Краткие повеления и повтор глагола «встать» сохраняют лаконичность и силу греческого текста.
