  text: καὶ πεσὼν ἐπὶ τὴν γῆν ἤκουσεν φωνὴν λέγουσαν αὐτῷ Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/004.yaml
  text: And falling to the ground, he heard a voice saying to him, “Saul, Saul, why are you persecuting me?”
translation:
  language: ru
  text: 'Он упал на землю и услышал голос, говоривший ему: «Савл, Савл! Почему ты преследуешь Меня?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν ἐπὶ τὴν γῆν
  choice: Он упал на землю
  rationale: Аористное причастие передаёт предшествующее обстоятельство; личная форма с союзом «и» естественна для современного русского повествования. «На землю» точно обозначает движение вниз, не расширяя значение до «земли» как мира.
- source_word: ἤκουσεν φωνὴν
  choice: услышал голос
  rationale: В контексте разборчивой речи φωνή означает «голос», а не просто «звук».
- source_word: λέγουσαν αὐτῷ
  choice: говоривший ему
  rationale: Причастный оборот сохраняет грамматическую связь с «голосом» и вводит прямую речь без смыслового добавления.
- source_word: Σαοὺλ Σαούλ
  choice: Савл, Савл
  rationale: Сохраняются традиционная русская передача имени и значимый повтор обращения.
- source_word: τί
  choice: почему
  rationale: В данном вопросительном употреблении τί обозначает причину и естественно переводится «почему».
- source_word: με
  choice: Меня
  rationale: Прямое дополнение сохранено без поясняющей замены; прописная буква соответствует русской библейской издательской традиции для обращения Христа к Себе.
- source_word: διώκεις
  choice: преследуешь
  rationale: Настоящее время передаёт продолжающееся действие, а «преследуешь» выражает враждебное гонение и при этом сохраняет образ погони, присущий глаголу.
theological_decisions:
- issue: Отождествление говорящего с теми, кого преследует Савл
  choice: Сохранено прямое «Меня» без пояснения.
  alternative: «Моих последователей» или «Мой народ»
  rationale: Греческий текст прямо ставит местоимение με; поясняющая замена устранила бы богословски значимое отождествление и разрешила бы напряжение, которое следует сохранить.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified библейским звучанием. Синтаксис слегка упрощён по сравнению с греческим причастным построением ради естественности, без изменения последовательности событий. Восклицательный знак после повторного обращения передаёт настойчивость звательного повтора.
