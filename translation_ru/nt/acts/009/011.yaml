  text: ὁ δὲ κύριος πρὸς αὐτόν· ⸀Ἀναστὰς πορεύθητι ἐπὶ τὴν ῥύμην τὴν καλουμένην Εὐθεῖαν καὶ ζήτησον ἐν οἰκίᾳ Ἰούδα Σαῦλον ὀνόματι Ταρσέα, ἰδοὺ γὰρ προσεύχεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/011.yaml
  text: And the Lord said to him[a], “Get up and go to the street called Straight, and in the house of Judas look for a man named Saul, from Tarsus, for behold, he is praying.”
translation:
  language: ru
  text: 'Господь сказал ему: «Встань и пойди на улицу, называемую Прямой, и в доме Иуды поищи Савла из Тарса[a], ибо вот, он молится».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Савла, тарсянина». Греческое Ταρσέα обозначает человека из Тарса.'
    reason: лексическая_альтернатива
lexical_decisions:
- source_word: κύριος
  choice: Господь
  rationale: Обычная новозаветная передача титула κύριος; сохраняет формулировку стиха, не добавляя прямо имени Иисуса.
- source_word: Ἀναστὰς πορεύθητι
  choice: Встань и пойди
  rationale: Причастие вместе с повелительным глаголом естественно передаётся двумя последовательными повелениями; современно и без излишней буквальности.
- source_word: ῥύμην τὴν καλουμένην Εὐθεῖαν
  choice: улицу, называемую Прямой
  rationale: Передаёт городской объект и конструкцию называния; «Прямая» оформлено как название улицы.
- source_word: ἐν οἰκίᾳ Ἰούδα
  choice: в доме Иуды
  rationale: Сохраняет локативное значение ἐν и ясно указывает место поисков.
- source_word: ζήτησον
  choice: разыщи
  rationale: В данном поручении означает найти посредством поисков; «разыщи» естественнее книжного «ищи» и не теряет побудительного смысла.
- source_word: Σαῦλον ὀνόματι Ταρσέα
  choice: Савла, родом из Тарса
  rationale: Имя передано прямо, поскольку русская конструкция «Савла по имени» избыточна; Ταρσέα естественно обозначает происхождение из Тарса.
- source_word: ἰδοὺ γὰρ προσεύχεται
  choice: потому что он сейчас молится
  rationale: γάρ передано как основание поручения, настоящее время — как текущее действие; отдельное русское соответствие ἰδού опущено ради естественности, поскольку его указательная функция здесь передаётся контекстом.
theological_decisions:
- issue: К кому относится κύριος
  choice: «Господь» без поясняющего имени
  alternative: «Господь Иисус»
  rationale: Контекст указывает на воскресшего Иисуса, однако в самом стихе стоит только κύριος; перевод не делает подразумеваемое имя явным.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским тоном. Синтаксис сделан естественным для устного повеления; традиционные формы имён «Иуда» и «Савл» сохранены.
