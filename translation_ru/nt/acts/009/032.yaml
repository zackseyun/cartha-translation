  text: Ἐγένετο δὲ Πέτρον διερχόμενον διὰ πάντων κατελθεῖν καὶ πρὸς τοὺς ἁγίους τοὺς κατοικοῦντας Λύδδα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/032.yaml
  text: As Peter was passing through all of them, he also went down to the saints living in Lydda.
translation:
  language: ru
  text: Когда Пётр проходил повсюду, он спустился также к святым, жившим в Лидде.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Когда
  rationale: Оборот вводит очередное событие повествования; естественная русская временная конструкция передаёт его функцию без тяжеловесного «и случилось».
- source_word: διερχόμενον διὰ πάντων
  choice: обходил всех
  rationale: Местоимение πάντων без выраженного существительного сохраняется как «всех»; по контексту речь, вероятно, идёт о людях или общинах, но уточнение в текст не внесено.
- source_word: κατελθεῖν καὶ πρὸς
  choice: пришёл и к
  rationale: καταβαίνω буквально обозначает движение вниз, однако здесь естественно передаётся как прибытие; καί сохранено посредством «и».
- source_word: τοὺς ἁγίους
  choice: святым
  rationale: Устоявшееся новозаветное обозначение верующих, без конфессионального уточнения.
- source_word: τοὺς κατοικοῦντας Λύδδα
  choice: жившим в Лидде
  rationale: Причастный оборот передан естественным русским определением; название города дано в традиционной русской форме.
theological_decisions:
- issue: Кого обозначает πάντων («всех»)
  choice: Сохранить неопределённое «всех»
  alternative: «по всем местам» или «по всем общинам»
  rationale: Греческий текст не называет явно ни места, ни общины; конкретизация сняла бы подлинную неоднозначность.
- issue: Значение «святые»
  choice: Сохранить «святые» как обозначение верующих
  alternative: «верующие» или «Божий народ»
  rationale: Прямой эквивалент сохраняет лексику и богословскую окраску исходного текста, не добавляя деноминационного смысла.
translation_notes:
  register: Современный литературный русский язык; повествовательная фраза краткая и естественная, без архаического «и случилось» и без добавочного начального маркера «теперь».
