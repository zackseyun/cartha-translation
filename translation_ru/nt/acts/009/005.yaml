  yaml_path: translation/nt/acts/009/005.yaml
  text: And he said[a], “Who are you, Lord?” And he said, “I am Jesus, whom you are persecuting.”
translation:
  language: ru
  text: 'Он сказал: «Кто Ты, Господь[a]?» Тот ответил: «Я Иисус, Которого ты преследуешь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «господин». Греческое слово может быть почтительной формой обращения; здесь оно переведено как «Господь» с учётом небесного откровения и последующего самоотождествления говорящего.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δέ
  choice: Он спросил
  rationale: Вводит прямой вопрос; русское «спросил» естественно передаёт речевой акт, а слабая повествовательная связь δέ не требует отдельного союза.
- source_word: Τίς εἶ
  choice: Кто Ты
  rationale: Прямая и естественная передача вопросительного местоимения с глаголом-связкой; прописная буква соответствует русской традиции почтительного обращения в библейском тексте.
- source_word: κύριε
  choice: Господь
  rationale: Сохраняет основное новозаветное соответствие κύριος и уместно при обращении к небесному говорящему; возможное значение почтительного «господин» отмечено в сноске.
- source_word: ὁ δέ
  choice: Тот ответил
  rationale: Греческая конструкция обозначает смену говорящего; «Тот ответил» ясно и естественно передаёт её по-русски.
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: Я Иисус
  rationale: Русское именное предложение с нулевой связкой естественно передаёт самоидентификацию, не добавляя отсутствующих в тексте оттенков.
- source_word: ὃν σὺ διώκεις
  choice: Которого ты преследуешь
  rationale: Сохраняет Иисуса как прямой объект продолжающегося преследования; явное σὺ передано местоимением «ты».
theological_decisions:
- issue: Значение κύριε до того, как говорящий назвал Себя
  choice: Господь
  alternative: господин
  rationale: Обращение допускает как признание высшей власти, так и почтительную форму обращения. «Господь» сохраняет богословскую и повествовательную силу сцены, а сноска не устраняет подлинную лексическую неоднозначность.
- issue: Отождествление преследования учеников с преследованием Иисуса
  choice: Которого ты преследуешь
  alternative: Которого ты гонишь
  rationale: Синтаксис оригинала прямо представляет Иисуса объектом действия Савла; перевод сохраняет это напряжение и не поясняет его внутри стиха.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Связки δέ переданы средствами естественного русского повествования, без тяжеловесного повторения «и сказал». Местоимения обращения к Иисусу оформлены с прописной буквы согласно распространённой русской библейской традиции.
