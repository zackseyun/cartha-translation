source:
  edition: SBLGNT
  text: ⸂Ἡ μὲν οὖν ἐκκλησία καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας εἶχεν εἰρήνην οἰκοδομουμένη, καὶ πορευομένη τῷ φόβῳ τοῦ κυρίου καὶ τῇ παρακλήσει τοῦ ἁγίου πνεύματος ἐπληθύνετο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/031.yaml
  text: So then the church throughout all Judea and Galilee and Samaria had peace and was being built up[a]; and walking in the fear of the Lord and in the encouragement of the Holy Spirit[b], it was multiplying.
translation:
  language: ru
  text: Итак, церковь[a] по всей Иудее, Галилее и Самарии пребывала в мире и созидалась; живя в страхе Господнем и получая ободрение от Святого Духа[b], она становилась всё многочисленнее.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «церкви».'
    reason: textual_variant
  - marker: b
    text: 'Или: «утешение» или «увещание» Святого Духа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησία
  choice: церковь
  rationale: Основной текст SBLGNT имеет единственное число; «церковь» передаёт собирательное единство верующих во всех трёх областях. Вариант множественного числа вынесен в сноску.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας
  choice: по всей Иудее, Галилее и Самарии
  rationale: Предлог κατά с родительным падежом выражает распространение по названным областям, а «по всей» естественно передаёт ὅλης.
- source_word: εἶχεν εἰρήνην
  choice: пребывала в мире
  rationale: Формулировка естественна для современного русского языка и передаёт состояние мира и покоя, не сводя его лишь к бездействию.
- source_word: οἰκοδομουμένη
  choice: созидалась
  rationale: Сохраняет строительную метафору греческого причастия и его значение продолжающегося духовного укрепления церкви.
- source_word: πορευομένη
  choice: живя
  rationale: В данном контексте глагол описывает образ жизни и поведение; буквальное «ходя» в современном русском могло бы восприниматься прежде всего физически.
- source_word: τῷ φόβῳ τοῦ κυρίου
  choice: в страхе Господнем
  rationale: Сохраняет традиционное и богословски ёмкое библейское выражение, допускающее смысл благоговейного страха и послушания.
- source_word: κυρίου
  choice: Господнем
  rationale: Передаёт κύριος обычным титулом «Господь», не уточняя референта сверх того, что выражено в греческом тексте.
- source_word: τῇ παρακλήσει τοῦ ἁγίου πνεύματος
  choice: получая ободрение от Святого Духа
  rationale: «Ободрение» хорошо соответствует контексту укрепления и роста; конструкция с «от» ясно и естественно выражает действие Святого Духа. Другие существенные оттенки слова παράκλησις отмечены в сноске.
- source_word: τοῦ ἁγίου πνεύματος
  choice: Святого Духа
  rationale: Стандартное современное русское наименование, сохраняющее личностную и божественную отнесённость выражения.
- source_word: ἐπληθύνετο
  choice: становилась всё многочисленнее
  rationale: Передаёт продолжительный численный рост, выраженный имперфектом, и согласуется с собирательным единственным числом «церковь».
theological_decisions:
- issue: Число и собирательный смысл ἐκκλησία
  choice: 'единственное число: «церковь»'
  alternative: 'множественное число по текстовому варианту: «церкви»'
  rationale: Предоставленный основной греческий текст содержит единственное число, с которым согласованы причастия и глаголы. Значимый вариант рукописей сохранён в сноске.
- issue: Смысл выражения «страх Господень»
  choice: сохранено буквальное выражение, допускающее смысл благоговения и послушной верности
  alternative: разъясняющее «благоговение перед Господом» или смысл ужаса
  rationale: Библейское выражение богословски насыщенно; перевод не сужает его до одного толкования и не придаёт ему однозначно значение рабского ужаса.
- issue: Значение παράκλησις применительно к Святому Духу
  choice: ободрение
  alternative: утешение или увещание
  rationale: Контекст мира, созидания и роста поддерживает значение «ободрение», но широкий смысловой диапазон греческого слова сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Традиционные выражения «страх Господень» и «созидалась» сохранены ради межтекстовых связей, тогда как «живя» и «становилась всё многочисленнее» обеспечивают ясность для современного читателя.
