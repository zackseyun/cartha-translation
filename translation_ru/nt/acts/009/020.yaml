  text: καὶ εὐθέως ἐν ταῖς συναγωγαῖς ἐκήρυσσεν τὸν ⸀Ἰησοῦν ὅτι οὗτός ἐστιν ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/020.yaml
  text: And immediately in the synagogues he began proclaiming Jesus[b][a], that he is the Son of God.
translation:
  language: ru
  text: И сразу же он стал возвещать в синагогах об Иисусе[a], что Он — Сын Божий[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «возвещать Иисуса»; то есть публично провозглашать весть о Нём.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Сын Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: сразу же
  rationale: Передаёт незамедлительность действия естественно и с достаточной повествовательной силой.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: в синагогах
  rationale: Сохраняет локативное значение ἐν и множественное число.
- source_word: ἐκήρυσσεν
  choice: стал возвещать
  rationale: Передаёт публичный характер κηρύσσω; сочетание со «стал» естественно выражает начало продолжавшегося действия, подразумеваемое контекстом и имперфектом.
- source_word: τὸν Ἰησοῦν
  choice: об Иисусе
  rationale: Русское «возвещать Иисуса» звучит неестественно; оборот с «об» ясно передаёт Иисуса как содержание публичного возвещения.
- source_word: ὅτι οὗτός ἐστιν
  choice: что Он —
  rationale: Местоимение естественно отсылает к Иисусу; тире оформляет именную часть сказуемого. Эмфатическое οὗτός частично сглажено ради нормального современного русского синтаксиса.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Сын Божий
  rationale: Устоявшаяся, прозрачная и литературная передача христологического титула без пояснительного расширения.
theological_decisions:
- issue: Христологический титул в проповеди Савла
  choice: Сын Божий
  alternative: Сын Бога
  rationale: «Сын Божий» точно сохраняет титульный характер выражения ὁ υἱὸς τοῦ θεοῦ и является естественной формой в русском библейском регистре.
- issue: Указательная сила οὗτός
  choice: Он
  alternative: Именно Он
  rationale: «Он» сохраняет ясную референцию к Иисусу и звучит естественно; «именно Он» сильнее выявляет указательную эмфазу, но может чрезмерно усиливать её в русском тексте.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Формулировка избегает как церковнославянизмов, так и разговорности; прописные «Он» и «Сын Божий» отражают принятое русское оформление христологического высказывания.
