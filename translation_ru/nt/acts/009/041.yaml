  yaml_path: translation/nt/acts/009/041.yaml
  text: And giving her his hand[a], he raised her up; then he called the saints and the widows and presented her alive.
translation:
  language: ru
  text: Он подал ей руку и поднял её[a]. Затем позвал святых и вдов и представил её им живой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помог ей встать», «поставил её на ноги». Греческий глагол может означать, что человека поднимают или ставят на ноги; в данном контексте он также перекликается с языком воскресения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς δὲ αὐτῇ χεῖρα
  choice: Он подал ей руку
  rationale: Оборот естественно описывает протянутую для помощи руку; «подал ей руку» близко передаёт греческую конструкцию и звучит по-русски ясно.
- source_word: ἀνέστησεν αὐτήν
  choice: поднял её
  rationale: Глагол означает побудить подняться или поставить на ноги. «Поднял её» сохраняет как непосредственное физическое действие, так и возможный отзвук языка воскресения.
- source_word: φωνήσας
  choice: позвал
  rationale: Причастие аориста обозначает действие, предшествующее представлению Тавифы собравшимся; «позвал» естественно передаёт созыв людей.
- source_word: τοὺς ἁγίους
  choice: святых
  rationale: Прямое новозаветное обозначение принадлежащих Богу людей; не заменяется более толковательным словом «верующие».
- source_word: τὰς χήρας
  choice: вдов
  rationale: Прямой перевод, сохраняющий отдельное упоминание вдов, важное в ближайшем контексте.
- source_word: παρέστησεν αὐτὴν ζῶσαν
  choice: представил её им живой
  rationale: Глагол здесь означает представить или поставить перед кем-либо, а ζῶσαν предикативно указывает, что она была жива. Добавленное «им» естественно выражает адресатов, явно названных непосредственно перед этим.
theological_decisions:
- issue: Передача связанного с воскресением глагола ἀνέστησεν
  choice: поднял её
  alternative: помог ей встать / поставил её на ноги
  rationale: Контекст сообщает о возвращении Тавифы к жизни, однако в самом предложении глагол также описывает конкретное действие Петра, когда он помогает ей подняться. Выбор сохраняет оба смысловых плана, не утверждая, будто именно прикосновение совершило воскресение.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Порядок действий сохранён; «затем» естественно раскрывает последовательность, выраженную греческими формами. Термин «святые» оставлен как точное новозаветное обозначение общины.
