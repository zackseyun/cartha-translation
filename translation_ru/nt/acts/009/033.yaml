  text: εὗρεν δὲ ἐκεῖ ἄνθρωπόν τινα ⸂ὀνόματι Αἰνέαν⸃ ἐξ ἐτῶν ὀκτὼ κατακείμενον ἐπὶ ⸀κραβάττου, ὃς ἦν παραλελυμένος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/033.yaml
  text: And there he found a certain man named Aeneas[a], bedridden for eight years, who was paralyzed.
translation:
  language: ru
  text: Там он нашёл одного человека по имени Эней, который уже восемь лет лежал на постели[a] и был парализован.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лежал на подстилке» или «лежал на тюфяке».'
    reason: Сноска сохраняет конкретный смысл κράβαττος — простого переносного ложа, который в основном тексте передан словом «постель».
lexical_decisions:
- source_word: εὗρεν δὲ ἐκεῖ
  choice: Там он нашёл
  rationale: Передаёт продолжение повествования и указание на место естественным русским порядком слов; отдельное «и» для δέ в данном контексте необязательно.
- source_word: ἄνθρωπόν τινα
  choice: одного человека
  rationale: Сочетание ἄνθρωπος с τις вводит конкретного, ранее не упомянутого человека. «Одного человека» звучит современнее и естественнее, чем «некоего человека».
- source_word: ὀνόματι Αἰνέαν
  choice: по имени Эней
  rationale: Обычная русская передача конструкции с дательным ὀνόματι и личным именем; Αἰνέας традиционно передаётся как «Эней».
- source_word: ἐξ ἐτῶν ὀκτὼ
  choice: уже восемь лет
  rationale: Греческий оборот обозначает длительность состояния; «уже» естественно подчёркивает, что оно продолжалось к моменту повествования, не меняя указанного срока.
- source_word: κατακείμενον ἐπὶ κραβάττου
  choice: был прикован к постели
  rationale: Современный русский идиом ясно передаёт длительную неспособность вставать. Конкретный образ лежания на простом ложе сохранён в сноске.
- source_word: ὃς ἦν παραλελυμένος
  choice: Он был парализован
  rationale: Прямо передаёт устойчивое состояние, выраженное перифрастической конструкцией с причастием совершенного вида. Отдельное предложение позволяет не превращать описание в явно причинную связь, которой греческий текст формально не выражает.
