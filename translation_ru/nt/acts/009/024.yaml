  text: But their plot became known to Saul[a]. They were also watching the gates day and night so that they might kill him.
translation:
  language: ru
  text: Но Савлу стало известно об их замысле. Они также днём и ночью следили за воротами[a], чтобы убить его.
  philosophy: optimal-equivalence
