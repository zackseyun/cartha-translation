    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώσθη
  choice: стало известно
  rationale: Безличная пассивная конструкция естественна по-русски и передаёт, что замысел дошёл до сведения Савла, не уточняя, кто сообщил ему о нём.
- source_word: ἐπιβουλή
  choice: замысел
  rationale: В контексте слово обозначает враждебный план, направленный на убийство. «Замысел» звучит естественно и не добавляет деталей, отсутствующих в греческом тексте.
- source_word: παρετηροῦντο
  choice: следили за
  rationale: Имперфект передаёт продолжительное наблюдение; «следили за воротами» сохраняет этот смысл лучше, чем более интерпретирующее «стерегли».
- source_word: πύλας
  choice: воротами
  rationale: Греческий текст говорит просто о «воротах»; из контекста ясно, что имеются в виду городские ворота Дамаска.
- source_word: ἡμέρας τε καὶ νυκτός
  choice: и днём и ночью
  rationale: Естественное современное русское выражение, передающее непрерывность наблюдения.
- source_word: ὅπως
  choice: чтобы
  rationale: Передаёт цель наблюдения кратко и естественно.
- source_word: ἀνέλωσιν
  choice: убить
  rationale: В данном контексте ἀναιρέω прямо означает лишить жизни; «убить» ясно передаёт смысл без эвфемизма.
- source_word: δὲ
  choice: Но / же
  rationale: Первое δέ обозначает контраст между заговором и тем, что Савл узнал о нём; второе поддерживает повествовательный переход к действиям заговорщиков.
- source_word: καὶ
  choice: и
  rationale: 'Сохраняет добавочный оттенок: заговорщики не только составили замысел, но и наблюдали за воротами.'
