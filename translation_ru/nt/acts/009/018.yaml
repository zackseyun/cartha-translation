lexical_decisions:
- source_word: εὐθέως
  choice: тотчас
  rationale: Естественно и ясно передаёт немедленность события в современном русском повествовании.
- source_word: ἀπέπεσαν
  choice: отпали
  rationale: Передаёт и падение, и отделение от глаз, заложенные в ἀποπίπτω.
- source_word: αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν
  choice: от его глаз
  rationale: Грамматически точно и естественно передаёт ἀπό с родительным падежом.
- source_word: ὡς λεπίδες
  choice: словно чешуйки
  rationale: «Словно» сохраняет сравнительное значение ὡς и не утверждает, что это были буквальные чешуйки; уменьшительная форма естественна для образа небольших чешуевидных частиц.
- source_word: ἀνέβλεψεν
  choice: он снова стал видеть
  rationale: В контексте исцеления глагол означает восстановление зрения, а не просто взгляд вверх.
- source_word: τε καὶ
  choice: и
  rationale: Связь и последовательность действий естественно выражены союзом и разбивкой на предложения.
- source_word: ἀναστάς
  choice: встав
  rationale: Кратко и точно передаёт предшествующее действие аористного причастия.
- source_word: ἐβαπτίσθη
  choice: он крестился
  rationale: Обычная современная русская передача страдательной формы βαπτίζω; не уточняет способ совершения крещения.
theological_decisions:
- issue: Передача βαπτίζω без конфессионального уточнения способа крещения
  choice: он крестился
  alternative: он был крещён; он погрузился
  rationale: «Крестился» является устойчивой и нейтральной русской формулировкой. Греческий текст сообщает о крещении, не уточняя в этом стихе его способ; «погрузился» внесло бы спорное конфессиональное уточнение.
translation_notes:
