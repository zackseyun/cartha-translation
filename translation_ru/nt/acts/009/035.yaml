base_translation:
  language: en
  yaml_path: translation/nt/acts/009/035.yaml
  text: And all those living in Lydda and Sharon saw him[b][a], and they turned to the Lord.
translation:
  language: ru
  text: И все жители Лидды и Сарона[a] увидели его и обратились к Господу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «равнины Сарон».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «вернулись к Господу»; по смыслу также: «уверовали в Господа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδαν
  choice: увидели
  rationale: 'Простой аорист ὁράω естественно передаёт зрительное восприятие: жители увидели Энея после исцеления.'
- source_word: πάντες οἱ κατοικοῦντες
  choice: все жители
  rationale: Субстантивированное причастие означает всех живущих в названных местах; «все жители» кратко и естественно по-русски.
- source_word: Λύδδα
  choice: Лидда
  rationale: Традиционная русская передача названия города, соответствующая греческой форме.
- source_word: τὸν Σαρῶνα
  choice: Сарон
  rationale: Название области или равнины передано как топоним; греческий артикль отдельно не воспроизводится.
- source_word: οἵτινες
  choice: и
  rationale: Относительное местоимение связывает названных жителей с их последующим откликом; русское сочинение естественно передаёт ход повествования.
- source_word: ἐπέστρεψαν ἐπὶ τὸν κύριον
  choice: обратились к Господу
  rationale: «Обратились к» сохраняет направленность к Господу и обычный для Деяний смысл духовного поворота, не утверждая прежнего отступничества.
- source_word: κύριον
  choice: Господу
  rationale: Передаёт новозаветный титул без добавления отсутствующего в греческом тексте имени Иисуса.
theological_decisions:
- issue: К кому относится титул «Господь»
  choice: Господу
  alternative: Господу Иисусу
  rationale: Контекст указывает на воскресшего Иисуса, однако исходный текст содержит только титул τὸν κύριον; перевод не добавляет имени.
- issue: Смысл ἐπέστρεψαν
  choice: обратились к
  alternative: вернулись к; уверовали в
  rationale: Выбранная формулировка сохраняет библейский образ поворота к Господу и не уточняет без необходимости ни прежнее состояние людей, ни конкретную систематико-богословскую трактовку.
translation_notes:
  register: Современный литературный русский язык с естественным повествовательным порядком слов. Сохранены традиционные библейские топонимы и титул «Господь»; богословская формулировка намеренно не переуточнена.
