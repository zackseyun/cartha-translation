base_translation:
  language: en
  yaml_path: translation/nt/acts/009/014.yaml
  text: And here he has authority from the chief priests to bind all who call on your name[a].
translation:
  language: ru
  text: И здесь он имеет от первосвященников власть связать всех, кто призывает Твоё имя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех, кто взывает к Тебе». Греческое выражение — устойчивый библейский оборот, часто обозначающий молитвенное призывание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε
  choice: здесь
  rationale: Наречие места указывает на Дамаск, где находится Анания; «здесь» естественно и точно передаёт контекст.
- source_word: ἔχει ἐξουσίαν
  choice: он получил… власть
  rationale: ἐξουσία обозначает официальное полномочие. По-русски конструкция «получил от… власть» естественно выражает имеющееся у Савла полномочие и его источник, хотя буквально ἔχει означает «имеет».
- source_word: παρὰ τῶν ἀρχιερέων
  choice: от первосвященников
  rationale: παρά с родительным падежом обозначает источник полномочия; множественное ἀρχιερεῖς относится к первосвященническому руководству в Иерусалиме.
- source_word: δῆσαι
  choice: связать
  rationale: Сохранён буквальный образ связывания, подразумевающий задержание и заключение под стражу.
- source_word: πάντας τοὺς ἐπικαλουμένους τὸ ὄνομά σου
  choice: всех, кто призывает Твоё имя
  rationale: Сохранён библейский оборот, обозначающий обращение к кому-либо, в том числе в молитве, без сужения смысла до одного истолкования.
theological_decisions:
- issue: Смысл выражения «призывать Твоё имя», обращённого к Иисусу
  choice: Сохранить выражение «кто призывает Твоё имя»
  alternative: «кто молится Тебе»; «кто взывает к Тебе»
  rationale: Греческий оборот может выражать молитвенное призывание и верность тому, чьё имя призывают. Формулировка сохраняет богословскую значимость прямого обращения к Иисусу, не превращая перевод в пояснительный пересказ.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейского повествования. Местоимение «Твоё» написано с прописной буквы как обращение к Иисусу. Порядок слов слегка адаптирован ради естественности русского синтаксиса.
