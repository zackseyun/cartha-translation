base_translation:
  language: en
  yaml_path: translation/nt/acts/009/043.yaml
  text: And he stayed in Joppa for many days with a certain Simon[a], a tanner.
translation:
  language: ru
  text: И Пётр пробыл в Иоппии немало дней у некоего Симона[a], кожевника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в доме у некоего Симона». Греческий предлог может подразумевать проживание в доме этого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... μεῖναι
  choice: Пётр пробыл
  rationale: 'Оборот ἐγένετο с инфинитивом естественно передаётся по-русски простым личным глаголом. Подлежащее восстанавливается из ближайшего контекста: речь идёт о Петре.'
- source_word: δὲ
  choice: И
  rationale: δέ служит мягкой повествовательной связкой, продолжая рассказ без выраженного противопоставления.
- source_word: ἡμέρας ἱκανὰς
  choice: немало дней
  rationale: Выражение обозначает значительный промежуток времени; «немало дней» естественно и достаточно близко сохраняет оттенок ἱκανάς.
- source_word: ἐν Ἰόππῃ
  choice: в Иоппии
  rationale: Использована традиционная русская форма библейского топонима с нормативным склонением.
- source_word: παρά τινι Σίμωνι
  choice: у некоего Симона
  rationale: παρά с дательным здесь указывает на пребывание у человека, вероятно в его доме; τις сохраняется словом «некоего».
- source_word: βυρσεῖ
  choice: кожевника
  rationale: βυρσεύς обозначает ремесленника, обрабатывающего шкуры и выделывающего кожу; «кожевник» точнее современного более широкого «мастер по коже».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Имя Пётр эксплицировано по контексту, поскольку в греческом личная форма подразумевается конструкцией и предшествующим повествованием. Формулировка сохраняет неопределённость τις и возможный оттенок проживания в доме через сноску.
