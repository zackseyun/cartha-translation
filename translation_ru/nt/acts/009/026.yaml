id: ACT.9.26
reference: Acts 9:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Παραγενόμενος δὲ ⸀εἰς Ἰερουσαλὴμ ⸀ἐπείραζεν κολλᾶσθαι τοῖς μαθηταῖς· καὶ πάντες ἐφοβοῦντο αὐτόν, μὴ πιστεύοντες ὅτι ἐστὶν μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/026.yaml
  text: And when he came to Jerusalem[a], he was trying to join the disciples, but they were all afraid of him, not believing that he was a disciple.
translation:
  language: ru
  text: Придя в Иерусалим, он пытался присоединиться к ученикам[a], но все боялись его, не веря, что он ученик.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «примкнуть к ученикам».'
    reason: Лексическая альтернатива для κολλᾶσθαι, подчёркивающая тесное присоединение к группе.
lexical_decisions:
- source_word: Παραγενόμενος δὲ εἰς Ἰερουσαλήμ
  choice: Придя в Иерусалим
  rationale: Аористное причастие обозначает обстоятельство, предшествующее основному действию; деепричастный оборот естественно и кратко передаёт эту временную связь. Частица δέ в русском повествовании не требует отдельного выражения.
- source_word: ἐπείραζεν
  choice: пытался
  rationale: Имперфект передаёт продолжавшуюся или неоднократную попытку; форма «пытался» естественна в данном контексте и не связывает глагол со значением искушения.
- source_word: κολλᾶσθαι τοῖς μαθηταῖς
  choice: присоединиться к ученикам
  rationale: κολλάομαι означает примкнуть, присоединиться, тесно связаться. Выбранная формулировка передаёт стремление Савла быть принятым в круг учеников без привнесения позднейшего понятия формального церковного членства.
- source_word: καὶ πάντες ἐφοβοῦντο αὐτόν
  choice: но все боялись его
  rationale: Хотя καί обычно значит «и», здесь между попыткой Савла и реакцией учеников присутствует ясное смысловое противопоставление, которое по-русски естественно передать союзом «но». Имперфект выражен формой «боялись».
- source_word: μὴ πιστεύοντες
  choice: не веря
  rationale: Причастие указывает на основание их страха. Русское деепричастие сохраняет компактную зависимую конструкцию, не делая причинное значение более явным, чем в греческом.
- source_word: ὅτι ἐστὶν μαθητής
  choice: что он ученик
  rationale: Греческий текст сохраняет настоящее время ἐστίν. Русская конструкция допускает настоящее подразумеваемой связки без обязательного согласования времён, поэтому «что он ученик» точно и естественно передаёт содержание сомнения.
- source_word: μαθητής
  choice: ученик
  rationale: Устоявшийся и точный русский эквивалент, обозначающий последователя и учащегося; нет необходимости заменять его более толковым словом «последователь».
theological_decisions:
- issue: Характер отношений, к которым стремился Савл среди иерусалимских учеников
  choice: присоединиться к ученикам
  alternative: примкнуть к ученикам; держаться вместе с учениками
  rationale: Перевод передаёт социальное и общинное сближение, но не превращает его в формальный обряд, принятие в членство или особый церковно-правовой акт.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и ясное. Сохранены длительность попыток и страха, а также компактная причинная связь в заключительной части стиха.
