  text: ἐλάλει τε καὶ συνεζήτει πρὸς τοὺς Ἑλληνιστάς· οἱ δὲ ἐπεχείρουν ⸂ἀνελεῖν αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/029.yaml
  text: And he was speaking and debating with the Hellenists[a], but they were attempting to kill him.
translation:
  language: ru
  text: Он говорил и спорил с эллинистами[a], а они пытались убить его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Возможно, с грекоязычными иудеями.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλει
  choice: говорил
  rationale: Имперфект передаёт продолжавшееся или повторявшееся действие; в сочетании с «спорил» русская форма несовершенного вида естественно сохраняет этот оттенок.
- source_word: τε καὶ
  choice: и
  rationale: Связывает два однородных глагола; простое «и» естественно для современного русского языка.
- source_word: συνεζήτει
  choice: спорил
  rationale: Глагол обозначает активное обсуждение или прение и в данном враждебном контексте сильнее нейтрального «обсуждал».
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: с эллинистами
  rationale: При глаголе спора πρός обозначает участников взаимодействия; русский предлог «с» здесь идиоматичен.
- source_word: Ἑλληνιστάς
  choice: эллинистами
  rationale: Сохраняет особое наименование группы, не смешивая её с греками-язычниками; пояснение дано в сноске.
- source_word: οἱ δὲ
  choice: а они
  rationale: δέ вводит контрастную реакцию; «а» передаёт противопоставление естественнее и не обязательно сильнее оригинала.
- source_word: ἐπεχείρουν
  choice: пытались
  rationale: Имперфект и значение глагола указывают на предпринимавшиеся попытки; несовершенный вид сохраняет длительность или повторяемость.
- source_word: ἀνελεῖν αὐτόν
  choice: убить его
  rationale: В данном контексте ἀναιρέω прямо означает лишить жизни; это ясная и современная передача.
theological_decisions:
- issue: Кто такие Ἑλληνισταί
  choice: «эллинисты» — грекоязычные иудеи
  alternative: греки или вообще грекоязычные люди
  rationale: В Деяниях это социально-языковое обозначение иудеев, особенно очевидное в Деян 6:1. Основной текст сохраняет термин, а сноска разъясняет его, не представляя собеседников Павла язычниками.
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная фраза сохраняет параллель двух имперфектов и контраст δέ. Термин «эллинисты» оставлен ради точности и пояснён сноской.
