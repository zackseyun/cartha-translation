  - severity: low
    issue: «Щедро помогала нуждающимся» несколько сужает и перефразирует сочетание «добрые дела и милостыни».
    rationale: Фраза хорошо передаёт общий смысл, но не сохраняет двухчленную характеристику и выражение πλήρης («полна»).
