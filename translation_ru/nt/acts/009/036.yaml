  text: Ἐν Ἰόππῃ δέ τις ἦν μαθήτρια ὀνόματι Ταβιθά, ἣ διερμηνευομένη λέγεται Δορκάς· αὕτη ἦν πλήρης ⸂ἔργων ἀγαθῶν⸃ καὶ ἐλεημοσυνῶν ὧν ἐποίει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/036.yaml
  text: In Joppa there was a disciple named Tabitha[a], which translated is called Dorcas. She was full of good works and acts of mercy that she was doing.
translation:
  language: ru
  text: В Иоппии была одна ученица по имени Тавифа, по-гречески Дорка[a]. Она была полна добрых дел и проявлений милосердия, которые постоянно совершала.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Тавифа — арамейское имя; Дорка — его греческий эквивалент. Оба имени означают «серна».
    reason: Сохраняет в основном тексте греческую форму имени Δορκάς и поясняет значение обоих соответствующих имён.
lexical_decisions:
- source_word: μαθήτρια
  choice: ученица
  rationale: Греческое существительное имеет явно женскую форму; русское «ученица» естественно и точно сохраняет это значение.
- source_word: ὀνόματι Ταβιθά
  choice: по имени Тавифа
  rationale: Естественная русская передача дательного оборота, вводящего личное имя.
- source_word: διερμηνευομένη λέγεται Δορκάς
  choice: что в переводе означает «Серна»
  rationale: Оборот поясняет греческий эквивалент семитского имени; русское смысловое соответствие делает пояснение понятным, а греческая форма имени сохранена в сноске.
- source_word: πλήρης ἔργων ἀγαθῶν
  choice: была богата добрыми делами
  rationale: Идиоматичная современная формулировка передаёт полноту и изобилие добрых дел без тяжеловесной буквальности.
- source_word: ἐλεημοσυνῶν ὧν ἐποίει
  choice: щедро помогала нуждающимся
  rationale: ἐλεημοσύνη обозначает милосердную материальную помощь, а имперфект ἐποίει — постоянную, привычную деятельность; формулировка естественно передаёт оба оттенка.
- source_word: δέ
  choice: не выражено отдельным словом
  rationale: Здесь частица служит мягким повествовательным переходом; в русском начале предложения отдельный союз или вводное слово не требуется.
- source_word: Ἐν Ἰόππῃ
  choice: В Иоппии
  rationale: Традиционная русская форма географического названия в предложном падеже.
theological_decisions:
- issue: Передача женской формы μαθήτρια
  choice: ученица
  alternative: последовательница
  rationale: «Ученица» прямо сохраняет грамматический род и связь с новозаветным понятием ученика, не добавляя конфессиональных оттенков.
- issue: Объём значения ἐλεημοσυνῶν
  choice: щедро помогала нуждающимся
  alternative: творила милостыню; совершала дела милосердия
  rationale: Термин может обозначать раздачу милостыни, но также шире — практическую помощь из милосердия. Выбранный вариант сохраняет направленность помощи на нуждающихся и не ограничивает её только денежными пожертвованиями.
- issue: Передача имён Ταβιθά и Δορκάς
  choice: Тавифа в тексте, греческая форма Дорка и значение имени в сноске
  alternative: Тавифа… Серна; Тавифа… Дорка
  rationale: Автор приводит греческий эквивалент арамейского имени. В основном тексте смысл «Серна» делает авторское пояснение прозрачным для русского читателя, а сноска сохраняет фактическую греческую форму.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Была богата добрыми делами» передаёт полноту как устойчивую характеристику, а «щедро помогала» — повторяющийся характер действий, выраженный имперфектом.
