review_pass:
  verdict: revise
  source_fidelity: Основная проблема — выражение διερμηνευομένη λέγεται Δορκάς передано лишь значением «Серна», тогда как Лука приводит именно греческую форму имени Δορκάς. Семантическое значение уместно в сноске, но греческий эквивалент должен быть в основном тексте. «Ученица», «В Иоппии», а также передача постоянной благотворительной деятельности в целом верны.
  naturalness: Предлагаемая редакция сохраняет современный литературный русский и избегает тяжеловесной кальки. «По-гречески Дорка» ясно передаёт авторское пояснение имени. «Была полна добрых дел и проявлений милосердия» естественно выражает полноту характеристики; «постоянно совершала» передаёт имперфект как привычную деятельность.
  terminology: «Ученица» точно передаёт женскую форму μαθήτρια. «Проявления милосердия» достаточно широко передаёт ἐλεημοσύναι, не ограничивая их денежной милостыней. Имя Δορκάς передано как «Дорка» и сохранено в тексте, а не только в примечании.
