  source_fidelity: 'В целом перевод точно передаёт обстоятельство близости Лидды к Иоппии, известие о пребывании Петра в Лидде, посылку двух мужчин и настойчивую просьбу. Однако в прямой речи «Не медли, приди к нам» греческая конструкция Μὴ ὀκνήσῃς διελθεῖν передана двумя независимыми повелениями. Следует сохранить зависимый инфинитивный смысл: просьба не медлить именно с приходом.'
  naturalness: «Не медли прийти к нам» — литературная и ясная формулировка, уместная в библейском повествовании. Причинная связь фонового генитивного абсолюта естественнее выражается союзом «Поскольку», чем простым соединением двух частей союзом «и».
