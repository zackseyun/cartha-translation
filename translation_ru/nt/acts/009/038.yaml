  yaml_path: translation/nt/acts/009/038.yaml
  text: Since Lydda was near Joppa[a], the disciples, hearing that Peter was there, sent two men to him, urging, “Do not delay to come to us.”
translation:
  language: ru
  text: 'Поскольку Лидда находилась недалеко от Иоппии, ученики, услышав, что Пётр там, послали к нему двух человек с настоятельной просьбой: «Не медли[a] прийти к нам».'
  philosophy: optimal-equivalence
  footnotes:
