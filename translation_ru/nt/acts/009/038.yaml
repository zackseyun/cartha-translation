    text: 'Или: «Не колеблись прийти к нам». Глагол может означать как промедление, так и колебание; основной текст передаёт смысл, наиболее естественный для этой настоятельной просьбы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ
  choice: Лидда находилась недалеко от Иоппии
  rationale: Генитивный абсолют задаёт фоновое обстоятельство, объясняющее последующее действие. Русская личная конструкция естественна; δέ передано связью «и» со следующим главным предложением, без добавления отсутствующего в греческом слова «теперь».
- source_word: Λύδδας
  choice: Лидда
  rationale: Традиционная русская новозаветная форма греческого топонима.
- source_word: Ἰόππῃ
  choice: Иоппии
  rationale: Традиционная русская библейская передача греческого названия Ἰόππη.
- source_word: οἱ μαθηταὶ
  choice: ученики
  rationale: Обычный и точный новозаветный эквивалент μαθηταί, обозначающий членов общины верующих.
- source_word: ἀκούσαντες ὅτι Πέτρος ἐστὶν ἐν αὐτῇ
  choice: услышав, что Пётр там
  rationale: Деепричастная конструкция сохраняет компактность причастного оборота; «там» естественно отсылает к Лидде.
- source_word: ἀπέστειλαν δύο ἄνδρας πρὸς αὐτόν
  choice: послали к нему двух человек
  rationale: Прямой современный перевод; «человек» здесь естественнее, чем стилистически маркированное «мужей».
- source_word: παρακαλοῦντες
  choice: с настоятельной просьбой
  rationale: Передаёт настойчивость просьбы, не усиливая её до мольбы или отчаяния.
- source_word: Μὴ ὀκνήσῃς
  choice: Не медли
  rationale: В контексте срочного приглашения наиболее естественно выражает практический смысл ὀκνέω; возможное значение «не колеблись» сохранено в примечании.
- source_word: διελθεῖν ἕως ἡμῶν
  choice: приди к нам
  rationale: Естественно передаёт движение к говорящим; буквальное «пройти до нас» по-русски неидиоматично.
