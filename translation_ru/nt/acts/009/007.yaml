  text: οἱ δὲ ἄνδρες οἱ συνοδεύοντες αὐτῷ εἱστήκεισαν ἐνεοί, ἀκούοντες μὲν τῆς φωνῆς μηδένα δὲ θεωροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/007.yaml
  text: The men traveling with him stood speechless[a], hearing the voice but seeing no one.
translation:
  language: ru
  text: А люди, шедшие вместе с ним, стояли, потеряв дар речи; они слышали голос[a], но никого не видели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «звук». Греческое слово может означать и «голос», и «звук»; ср. Деян. 22:9.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄνδρες
  choice: А люди
  rationale: δέ обозначает мягкий переход или сопоставление; русское «А» естественно связывает стих с предыдущим повествованием, не усиливая противопоставление. ἄνδρες здесь указывает на сопровождавших Савла людей.
- source_word: οἱ συνοδεύοντες αὐτῷ
  choice: шедшие вместе с ним
  rationale: συνοδεύω означает сопровождать в пути. Такой перевод естественен по-русски и сохраняет контекст путешествия.
- source_word: εἱστήκεισαν
  choice: стояли
  rationale: Плюсквамперфект ἵστημι имеет здесь результативно-стативное значение и описывает их положение; «стояли» передаёт его ясно, не добавляя прямо не выраженного значения «остановились».
- source_word: ἐνεοί
  choice: потеряв дар речи
  rationale: ἐνεός означает неспособность говорить, в данном контексте, вероятно, от потрясения. Русская идиома передаёт не просто молчание, а состояние потрясённой немоты.
- source_word: ἀκούοντες μὲν τῆς φωνῆς
  choice: слышали голос
  rationale: φωνή в данном повествовании естественно означает «голос», хотя может также обозначать звук. Перевод не устраняет лексическую неоднозначность ради согласования с Деян 22:9; возможное «звук» указано в сноске.
- source_word: μηδένα δὲ θεωροῦντες
  choice: но никого не видели
  rationale: θεωρέω означает видеть или наблюдать, а μηδένα относится к отсутствию видимого лица. «Никого не видели» — точная и естественная русская формулировка.
theological_decisions:
- issue: Кажущееся расхождение между Деян 9:7 и 22:9 о том, что слышали спутники Савла
  choice: В основном тексте перевести φωνή как «голос», а вариант «звук» вынести в сноску
  alternative: Перевести φωνή как «звук», тем самым явнее отличив восприятие звука от слышания речи
  rationale: В ближайшем контексте речь идёт о голосе, обращающемся к Савлу, и «голос» является прямым соответствием φωνή. При этом греческое слово допускает значение «звук». Сноска сохраняет эту возможность, не разрешая молча напряжение между двумя рассказами.
translation_notes:
  register: Современный литературный русский язык с повествовательной ясностью и достойным библейским регистром. Оборот «потеряв дар речи» идиоматичен и передаёт состояние ἐνεοί без архаического «онемев».
