  text: But his disciples took him by night and lowered him through the wall in a large basket[a][b].
translation:
  language: ru
  text: Но ночью его ученики взяли его и спустили через стену в большой корзине[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через отверстие в стене». Буквально в греческом: «через стену»; вероятно, имеется в виду проём или окно в городской стене.'
    reason: lexical_alternative
  - marker: b
    text: В греческом употреблены два близких по смыслу выражения со значением спуска; эта выразительная конструкция подчёркивает способ бегства.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: взяли
  rationale: Деепричастие аориста вводит действие учеников; в русском однородные сказуемые «взяли и спустили» естественно передают последовательность действий.
- source_word: δὲ
  choice: Но
  rationale: Передаёт лёгкое противопоставление замыслу противников, описанному ранее.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: его ученики
  rationale: Сохраняет притяжательное αὐτοῦ и обычное новозаветное значение μαθηταί.
- source_word: νυκτός
  choice: ночью
  rationale: Естественная и краткая передача родительного времени.
- source_word: διὰ τοῦ τείχους
  choice: через стену
  rationale: Буквально передаёт διά с родительным; вероятное отверстие в стене не вносится непосредственно в основной текст.
- source_word: καθῆκαν αὐτόν
  choice: спустили
  rationale: В данном контексте глагол означает спуск с высоты.
- source_word: χαλάσαντες
  choice: спустили
  rationale: Причастие уточняет способ действия и семантически перекрывается с καθῆκαν; в основном русском тексте двойное выражение свёрнуто ради естественности, а особенность оригинала отмечена в сноске.
- source_word: ἐν σπυρίδι
  choice: в большой корзине
  rationale: σπυρίς обозначает корзину, достаточно большую, чтобы в ней мог поместиться человек; уточнение «большой» уместно передаёт тип корзины.
