  text: γνωστὸν δὲ ἐγένετο καθ’ ὅλης ⸀τῆς Ἰόππης, καὶ ⸂ἐπίστευσαν πολλοὶ⸃ ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/042.yaml
  text: And it became known throughout all Joppa, and many believed in the Lord.
translation:
  language: ru
  text: Об этом стало известно по всей Иоппии, и многие уверовали в Господа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωστὸν δὲ ἐγένετο
  choice: Об этом стало известно
  rationale: Безличный оборот естественно передаёт наступивший результат и не уточняет действующее лицо; местоимение «этом» связывает стих с предшествующим событием.
- source_word: δὲ
  choice: и
  rationale: Здесь частица мягко продолжает повествование; в русском её функцию естественно передаёт союз «и».
- source_word: καθ’ ὅλης τῆς Ἰόππης
  choice: по всей Иоппии
  rationale: Оборот с κατά и родительным падежом обозначает распространение по всей местности; эта формулировка естественна и сохраняет значение всеохватности ὅλης.
- source_word: Ἰόππης
  choice: Иоппии
  rationale: Использована традиционная русская новозаветная форма названия города Иоппия.
- source_word: ἐπίστευσαν πολλοὶ
  choice: многие уверовали
  rationale: «Уверовали» естественно передаёт аорист как событие прихода к вере, а субстантивированное πολλοί — кратким «многие».
- source_word: ἐπὶ τὸν κύριον
  choice: в Господа
  rationale: После πιστεύω сочетание ἐπί с винительным падежом обозначает объект веры и доверия; русское «уверовали в Господа» точно и естественно.
- source_word: κύριον
  choice: Господа
  rationale: «Господь» сохраняет как почётный, так и богословский вес титула κύριος в Деяниях.
theological_decisions:
- issue: Передача πιστεύω + ἐπὶ τὸν κύριον
  choice: уверовали в Господа
  alternative: поверили Господу
  rationale: Выбранная формулировка обозначает обращение к вере и личное доверие Господу, не сводя выражение лишь к признанию истинности отдельных слов.
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — прямой и традиционный русский эквивалент, сохраняющий христологическую значимость титула в контексте Деяний.
translation_notes:
  register: Современный литературный русский язык; изложение краткое, естественное и достойное. Синтаксис сохраняет повествовательную связь с предыдущим стихом. Сноски не требуются.
