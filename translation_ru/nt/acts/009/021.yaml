source:
  edition: SBLGNT
  text: ἐξίσταντο δὲ πάντες οἱ ἀκούοντες καὶ ἔλεγον· Οὐχ οὗτός ἐστιν ὁ πορθήσας ⸀ἐν Ἰερουσαλὴμ τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο, καὶ ὧδε εἰς τοῦτο ἐληλύθει ἵνα δεδεμένους αὐτοὺς ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/021.yaml
  text: And all who heard him were amazed and were saying[a], “Isn’t this the man who devastated in Jerusalem those who call on this name? And had he not come here for this purpose[b], that he might bring them bound to the chief priests?”
translation:
  language: ru
  text: 'Все, кто его слышал, изумлялись и говорили: «Разве это не тот человек, который в Иерусалиме разорял тех, кто призывает это имя[a]? И разве не за тем он сюда пришёл, чтобы привести их связанными к первосвященникам?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть имя Иисуса. Выражение «призывать имя» — библейский оборот, означающий взывать к Богу или Иисусу, называя Его имя, и исповедовать веру в Него.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: изумлялись
  rationale: Имперфект передаёт продолжавшееся изумление слушателей; «изумлялись» естественно и сохраняет силу глагола.
- source_word: πάντες οἱ ἀκούοντες
  choice: все, кто его слышал
  rationale: Субстантивированное причастие обозначает слушавших Савла; местоимение «его» ясно восстанавливает подразумеваемое дополнение из контекста.
- source_word: πορθήσας
  choice: истреблял
  rationale: πορθέω — сильный глагол со значением разорения и уничтожения. «Истреблял» передаёт попытку жестоко уничтожить данную группу и не ослабляет выражение до общего «преследовал».
- source_word: τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο
  choice: призывающих это имя
  rationale: Сохранён библейский оборот о взывании к имени и исповедании его; буквальная форма также удерживает подразумеваемую, но не названную прямо отсылку к Иисусу.
- source_word: εἰς τοῦτο
  choice: за тем
  rationale: Русский оборот естественно выражает цель прибытия, заданную греческим εἰς τοῦτο.
- source_word: ἐληλύθει
  choice: пришёл
  rationale: В русском контексте завершённый вид естественно передаёт состоявшееся ранее прибытие; искусственный аналитический плюсквамперфект не требуется.
- source_word: δεδεμένους
  choice: связанными
  rationale: Совершенное страдательное причастие указывает на состояние пленников; перевод не уточняет сверх текста, были ли использованы цепи или иные узы.
- source_word: ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς
  choice: доставить ... к первосвященникам
  rationale: «Доставить» соответствует приведению задержанных к властям, а предлог «к» сохраняет направительное значение ἐπί с винительным падежом.
- source_word: ἀρχιερεῖς
  choice: первосвященникам
  rationale: Во множественном числе слово обозначает представителей первосвященнической верхушки, а не нескольких одновременно действующих единоличных первосвященников.
theological_decisions:
- issue: Следует ли раскрывать выражение «это имя» как «имя Иисуса» в основном тексте
  choice: Сохранить «это имя»
  alternative: имя Иисуса
  rationale: Греческий текст оставляет имя не названным прямо. Контекст указывает на Иисуса, но сохранение исходной формулировки удерживает её риторическую и богословскую выразительность.
- issue: Насколько сильно передавать πορθήσας
  choice: истреблял
  alternative: преследовал
  rationale: Исходный глагол сильнее общего обозначения преследования и рисует разрушительное нападение; перевод не должен смягчать эту характеристику прежних действий Савла.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Риторический вопрос сохранён, а его вторая часть передана отдельным вопросительным предложением для ясности без изменения общего смысла.
