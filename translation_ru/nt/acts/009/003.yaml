  text: ἐν δὲ τῷ πορεύεσθαι ἐγένετο αὐτὸν ἐγγίζειν τῇ Δαμασκῷ, ⸂ἐξαίφνης τε αὐτὸν περιήστραψεν⸃ φῶς ⸀ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/003.yaml
  text: As he was traveling[a], it happened that he was drawing near to Damascus, and suddenly a light from heaven flashed around him.
translation:
  language: ru
  text: Когда же он был в пути и приближался к Дамаску, внезапно его со всех сторон озарил свет с небес[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с неба». Греческое слово οὐρανός может обозначать как небеса, так и видимое небо; здесь «небеса», вероятно, указывают на божественный источник света.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ τῷ πορεύεσθαι
  choice: Когда же он был в пути
  rationale: Конструкция ἐν с субстантивированным инфинитивом обозначает одновременное действие; «когда… был в пути» естественно передаёт этот смысл, а частица «же» ненавязчиво отражает повествовательное δέ.
- source_word: ἐγένετο αὐτὸν ἐγγίζειν
  choice: и приближался
  rationale: Оборот с ἐγένετο и инфинитивом характерен для повествовательного стиля Луки. В современном русском его буквальное воспроизведение («случилось, что он приближался») звучало бы неестественно; длительный характер настоящего инфинитива сохранён формой несовершенного вида «приближался».
- source_word: τῇ Δαμασκῷ
  choice: к Дамаску
  rationale: Дательный падеж при ἐγγίζω обозначает место, к которому приближаются; русский предлог «к» точно передаёт близость без предположения, что Савл уже вошёл в город.
- source_word: ἐξαίφνης τε
  choice: внезапно
  rationale: «Внезапно» передаёт резкость наступления события; лёгкая соединительная сила τε в русском выражена связностью предложения и не требует отдельного союза.
- source_word: περιήστραψεν
  choice: со всех сторон озарил
  rationale: Глагол обозначает сияние вокруг человека. Сочетание «озарил… со всех сторон» передаёт внезапный и охватывающий характер света без добавления излишней интенсивности.
- source_word: φῶς
  choice: свет
  rationale: В русском отвлечённое и вещественное существительное «свет» обычно употребляется без неопределённого показателя; контекст ясно представляет его как внезапно возникшее явление.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: с небес
  rationale: В контексте божественного явления «с небес» естественно указывает на небесный источник света, сохраняя богословский вес οὐρανός и не называя источник прямо.
theological_decisions:
- issue: Значение οὐρανός в контексте откровения
  choice: с небес
  alternative: с неба
  rationale: Контекст описывает божественную встречу, поэтому «с небес» лучше передаёт вероятный смысл как указание на небесную сферу. Вариант «с неба» остаётся лексически возможным и приведён в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён там, где буквальное воспроизведение луканского оборота с ἐγένετο было бы тяжеловесным; смысл одновременности, приближения и внезапного окружающего сияния сохранён.
