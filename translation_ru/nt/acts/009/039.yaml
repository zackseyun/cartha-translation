  text: ἀναστὰς δὲ Πέτρος συνῆλθεν αὐτοῖς· ὃν παραγενόμενον ἀνήγαγον εἰς τὸ ὑπερῷον, καὶ παρέστησαν αὐτῷ πᾶσαι αἱ χῆραι κλαίουσαι καὶ ἐπιδεικνύμεναι χιτῶνας καὶ ἱμάτια ὅσα ἐποίει μετ’ αὐτῶν οὖσα ἡ Δορκάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/039.yaml
  text: So Peter got up and went with them[a]. When he arrived, they took him up to the upper room, and all the widows stood beside him[c][b], weeping and showing the tunics and garments that Dorcas made while she was with them.
translation:
  language: ru
  text: Пётр встал и пошёл с ними. Когда он пришёл, его повели наверх, в комнату. Все вдовы стояли возле него[a], плача и показывая хитоны и верхние одежды[b], которые Серна[c] изготовляла, когда была с ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предстали перед ним». Греческое выражение допускает более формальный оттенок, однако в этой сцене вдовы, по-видимому, собрались возле Петра.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте употреблены два разных слова: первое обозначает хитоны, которые обычно носили ближе к телу, второе — одежду в более широком смысле, часто верхнюю.'
    reason: cultural_note
  - marker: c
    text: Серна — греческое имя Тавифы; в Деян 9:36 она названа обоими именами.
    reason: cross_reference
lexical_decisions:
- source_word: ἀναστὰς
  choice: встал
  rationale: Причастие обозначает, что Пётр поднялся, чтобы откликнуться на просьбу; краткое «встал» естественно передаёт последовательность действий.
- source_word: συνῆλθεν αὐτοῖς
  choice: пошёл с ними
  rationale: В данном контексте глагол означает, что Пётр отправился вместе с посланниками.
- source_word: παραγενόμενον
  choice: когда он пришёл
  rationale: Причастие имеет временное значение и указывает на прибытие Петра перед следующим действием.
- source_word: ἀνήγαγον
  choice: его отвели
  rationale: Глагол описывает движение наверх; направление уже ясно из слов «в верхнюю комнату».
- source_word: ὑπερῷον
  choice: верхняя комната
  rationale: Так передана комната на верхнем этаже дома без архаичного или излишне специального выражения.
- source_word: παρέστησαν αὐτῷ
  choice: встали рядом с ним
  rationale: Фраза допускает пространственное «встали рядом» и более формальное «предстали перед ним»; контекст общего плача поддерживает первое, а альтернатива отмечена в сноске.
- source_word: κλαίουσαι
  choice: плакали
  rationale: Настоящее причастие рисует продолжающийся плач вдов; личная форма естественна в современном русском повествовании.
- source_word: ἐπιδεικνύμεναι
  choice: показывали
  rationale: Передаёт наглядное предъявление Петру одежды, сшитой умершей.
- source_word: χιτῶνας καὶ ἱμάτια
  choice: хитоны и верхнюю одежду
  rationale: Сохранено различие между нательной туникообразной одеждой и более широким обозначением верхней одежды.
- source_word: ὅσα ἐποίει
  choice: которую шила
  rationale: В контексте одежды ποιέω естественно означает изготовление шитьём. Имперфект передаёт происходившую прежде деятельность, но сам по себе не требует усиленного «обычно шила».
- source_word: ἡ Δορκάς
  choice: Серна
  rationale: Δορκάς — греческое имя/обозначение со значением «газель, серна»; «Серна» сохраняет связь с пояснением имени Тавифы в Деян 9:36 и укоренено в русской библейской речи.
