base_translation:
  language: en
  yaml_path: translation/nt/acts/009/012.yaml
  text: and he has seen in a vision a man named Ananias coming in and laying his hands on him so that he might regain his sight[a][b].
translation:
  language: ru
  text: и он увидел в видении человека по имени Анания, который вошёл и возложил на него руки, чтобы тот снова прозрел[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы он снова стал видеть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: увидел
  rationale: Греческий аорист естественно передаётся русским прошедшим совершенного вида; контекстуальная актуальность видения не требует формы, аналогичной английскому present perfect.
- source_word: ἐν ὁράματι
  choice: в видении
  rationale: Прямо передаёт сферу или способ восприятия.
- source_word: ἄνδρα ... Ἁνανίαν ὀνόματι
  choice: человек по имени Анания
  rationale: Естественная современная русская формула, сохраняющая указание на конкретного мужчину без стилистической тяжеловесности слова «муж».
- source_word: εἰσελθόντα καὶ ἐπιθέντα αὐτῷ χεῖρας
  choice: как вошёл ... и возложил на него руки
  rationale: Конструкция с «как» естественно передаёт содержание увиденного; однородные глаголы сохраняют последовательность действий, а «возложил руки» — узнаваемую библейскую идиому.
- source_word: ὅπως ἀναβλέψῃ
  choice: чтобы он снова прозрел
  rationale: В контексте исцеления ἀναβλέπω означает восстановление зрения; «снова прозрел» ясно и естественно выражает цель действия.
theological_decisions:
- issue: Следует ли уточнять богословское значение возложения рук
  choice: возложил на него руки
  alternative: положил на него руки
  rationale: Текст называет физическое действие, но не определяет здесь его сакраментальный, харизматический или иной специальный смысл; традиционная идиома сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сделан естественным для русского повествования; имя передано в традиционной русской форме «Анания».
