reference: Acts 9:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀπῆλθεν δὲ Ἁνανίας καὶ εἰσῆλθεν εἰς τὴν οἰκίαν, καὶ ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας εἶπεν· Σαοὺλ ἀδελφέ, ὁ κύριος ἀπέσταλκέν με, ⸀Ἰησοῦς ὁ ὀφθείς σοι ἐν τῇ ὁδῷ ᾗ ἤρχου, ὅπως ἀναβλέψῃς καὶ πλησθῇς πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/017.yaml
  text: So Ananias went and entered the house, and laying his hands on him he said, “Brother Saul, the Lord has sent me—Jesus, the one who appeared to you on the road by which you were coming—so that you may regain your sight and be filled with the Holy Spirit.”
translation:
  language: ru
  text: 'И Анания пошёл, вошёл в дом и, возложив на него руки, сказал: «Брат Саул, меня послал Господь — Иисус, явившийся тебе на дороге, по которой ты шёл, — чтобы ты снова обрёл зрение[a] и исполнился Святого Духа».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы ты снова увидел».'
    reason: 'Лексическая альтернатива: ἀναβλέπω может быть передано более буквально как «снова увидеть», тогда как основной текст выражает контекстуальный смысл восстановления зрения.'
lexical_decisions:
- source_word: ἀπῆλθεν δὲ
  choice: И Анания пошёл
  rationale: δέ продолжает повествование; русское «и» естественно связывает действие с предшествующим повелением, а «пошёл» передаёт повествовательный аорист без излишнего оттенка удаления.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν
  choice: вошёл в дом
  rationale: Прямое и идиоматичное соответствие греческому выражению.
- source_word: ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας
  choice: возложив на него руки
  rationale: Сохраняет сопровождающее действие причастной конструкции и привычный библейский оборот, оставаясь понятным современному читателю.
- source_word: Σαοὺλ ἀδελφέ
  choice: Брат Саул
  rationale: Естественная русская форма обращения, сохраняющая тёплое признание Саула братом.
- source_word: ὁ κύριος ἀπέσταλκέν με
  choice: меня послал Господь
  rationale: Порядок слов естественен по-русски и позволяет непосредственно присоединить поясняющее приложение «Иисус». Совершенный вид «послал» передаёт совершившееся поручение, сохраняющее силу в момент речи.
- source_word: Ἰησοῦς ὁ ὀφθείς σοι
  choice: Иисус, явившийся тебе
  rationale: «Иисус» сохранён как приложение к «Господь», а причастие передаёт отождествляющую конструкцию без добавочного толкования.
- source_word: ἐν τῇ ὁδῷ ᾗ ἤρχου
  choice: на дороге, по которой ты шёл
  rationale: Сохраняет буквальную дорогу, относительную конструкцию и длительность несовершенного времени; русское «шёл» естественнее, чем контекстуально неоднозначное «приходил».
- source_word: ἀναβλέψῃς
  choice: снова обрёл зрение
  rationale: В контексте слепоты глагол означает восстановление зрения. Формулировка ясна и сохраняет значение повторного обретения способности видеть.
- source_word: πλησθῇς πνεύματος ἁγίου
  choice: исполнился Святого Духа
  rationale: Традиционно понятная и грамматически точная передача пассивной формы и родительного падежа содержания.
theological_decisions:
- issue: Отождествление «Господа» с Иисусом в конструкции ὁ κύριος ... Ἰησοῦς ὁ ὀφθείς σοι
  choice: «меня послал Господь — Иисус, явившийся тебе...»
  alternative: «Господь послал меня — Иисус, Тот, кто явился тебе...»
  rationale: Тире и приложение сохраняют структуру исходного текста, где «Иисус» поясняет, кто именно назван Господом, не перестраивая фразу в более гладкое, но менее формально близкое относительное предложение.
- issue: Передача безартиклевого πνεύματος ἁγίου
  choice: Святого Духа
  alternative: Духа Святого
  rationale: Отсутствие артикля не делает выражение неопределённым. В Деяниях речь идёт о Божьем Святом Духе; русский язык не требует артикля, а прописные буквы ясно передают личное именование.
- issue: Смысл обращения ἀδελφέ
  choice: Брат Саул
  alternative: Саул, брат
  rationale: Форма сохраняет братское принятие и близость, не уточняя сверх текста, идёт ли речь прежде всего об общей принадлежности к Израилю или о зарождающемся христианском братстве.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены причастная конструкция, обращение «Брат Саул» и приложение, отождествляющее Господа с Иисусом; устаревшие формы и конфессионально окрашенные добавления не использованы.
