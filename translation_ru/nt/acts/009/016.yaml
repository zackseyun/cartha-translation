  text: ἐγὼ γὰρ ὑποδείξω αὐτῷ ὅσα δεῖ αὐτὸν ὑπὲρ τοῦ ὀνόματός μου παθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/016.yaml
  text: For I will show him how much he must suffer for my name[a].
translation:
  language: ru
  text: Ведь Я покажу ему, сколько ему нужно пострадать за Моё имя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради Моего имени».'
    reason: 'Лексическая альтернатива: ὑπέρ в данном контексте может обозначать страдание ради имени или вследствие верности ему; основной вариант «за Моё имя» сохраняет краткость и широту выражения.'
lexical_decisions:
- source_word: ἐγὼ
  choice: Я
  rationale: Явное местоимение сохраняет смысловое ударение на говорящем; прописная буква соответствует принятому русскому оформлению речи Христа.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительно-обосновывающую функцию частицы естественнее для современного русского, чем начальное «ибо».
- source_word: ὑποδείξω
  choice: покажу
  rationale: Прямой и естественный эквивалент со значением «показать, дать увидеть или узнать» без лишнего уточнения способа.
- source_word: αὐτῷ
  choice: ему
  rationale: Дательный падеж косвенного объекта непосредственно воспроизводится по-русски.
- source_word: ὅσα
  choice: сколько
  rationale: В сочетании с необходимостью и страданием выражает меру или объём предстоящих страданий, а не перечень отдельных событий.
- source_word: δεῖ
  choice: предстоит
  rationale: В конструкции «ему предстоит пострадать» передаёт неизбежную необходимость, оставаясь естественным по-русски и не уточняя, является ли она назначением, провиденциальной необходимостью или предсказанной судьбой.
- source_word: ὑπὲρ
  choice: за
  rationale: 'Сочетание «пострадать за Моё имя» естественно и сохраняет широту значения: ради имени, из-за верности ему или в его защиту.'
- source_word: τοῦ ὀνόματός μου
  choice: Моё имя
  rationale: Сохраняется библейский образ имени, способный обозначать личность, власть и открытое исповедание Иисуса.
- source_word: παθεῖν
  choice: пострадать
  rationale: Совершенный вид естественно соответствует инфинитивной конструкции, представляющей страдания как то, что Савлу предстоит претерпеть.
theological_decisions:
- issue: Характер необходимости, выраженной δεῖ
  choice: ему предстоит пострадать
  alternative: он должен пострадать
  rationale: «Предстоит» сохраняет объективную неизбежность будущего страдания, но не превращает её в нравственную обязанность и не вводит более сильной формулы предопределения, которой сам стих явно не выражает.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Ведь» выбрано вместо архаичного «ибо»; порядок слов подчёркивает действующее лицо и сохраняет ясность. Местоимения, относящиеся к Христу, оформлены с прописной буквы по принятой русской библейской традиции.
