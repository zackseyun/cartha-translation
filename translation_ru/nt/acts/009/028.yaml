  text: καὶ ἦν μετ’ αὐτῶν εἰσπορευόμενος ⸂καὶ ἐκπορευόμενος⸃ εἰς ⸀Ἰερουσαλήμ, παρρησιαζόμενος ἐν τῷ ὀνόματι τοῦ ⸀κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/028.yaml
  text: And he was with them in Jerusalem, going in and going out, speaking boldly in the name of the Lord.
translation:
  language: ru
  text: Он был вместе с ними в Иерусалиме, приходил и уходил и смело говорил во имя Господа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν μετ’ αὐτῶν
  choice: был вместе с ними
  rationale: Передаёт продолжительное общение и пребывание среди учеников, не усиливая смысл до постоянного проживания.
- source_word: εἰσπορευόμενος καὶ ἐκπορευόμενος
  choice: приходил и уходил
  rationale: Естественно по-русски передаёт парные причастия и повторяющееся свободное участие в жизни общины, не добавляя отсутствующего в тексте наречия «свободно».
- source_word: εἰς Ἰερουσαλήμ
  choice: в Иерусалиме
  rationale: В сочетании с парой глаголов движения название города обозначает место происходящего; буквальное «в Иерусалим» создало бы ложное впечатление многократного входа именно в город.
- source_word: παρρησιαζόμενος
  choice: смело говорил
  rationale: Передаёт открытую, бесстрашную речь; «говорил» не сужает содержание до формальной проповеди.
- source_word: ἐν τῷ ὀνόματι
  choice: во имя
  rationale: Сохраняет библейское выражение с его оттенками полномочия, представительства и исповедания, не сводя его лишь к одному из них.
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: Сохраняет данный в греческом тексте титул; в русском библейском контексте он уместно пишется с прописной буквы.
theological_decisions:
- issue: К кому относится титул «Господь»
  choice: В основном тексте сохранён титул «Господь»; из контекста подразумевается Иисус.
  alternative: 'Передать прямо: «во имя Иисуса».'
  rationale: Греческий текст содержит κυρίου, а не Ἰησοῦ. Сохранение титула не устраняет значимый для Деяний способ именования Иисуса и не подменяет перевод пояснением.
translation_notes:
  register: Современный литературный русский язык, простой и достойный по тону. Конструкция «приходил и уходил» звучит естественнее буквального «входя и выходя», сохраняя повторяемость движения и общения.
