revisions:
- from: Савл поднялся с земли, но, хотя глаза его были открыты, он ничего не видел.[a] Тогда его повели за руку и привели в Дамаск.
  to: Савл поднялся с земли. Глаза его были открыты, но он ничего не видел. Его повели за руку и привели в Дамаск.
  rationale: Перестроено предложение для естественного современного русского ритма и устранено избыточное «но, хотя». Контраст, заложенный в греческом генитивном абсолюте и последующем «ничего не видел», передан прямо и без искусственного усиления. Сноска удалена, поскольку в новом тексте смысл конструкции передан достаточно прозрачно, а прежняя формулировка её «буквального» значения была неточна.
