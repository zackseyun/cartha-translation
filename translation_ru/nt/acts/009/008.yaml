translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Выражения «поднялся с земли» и «повели за руку» конкретны и доступны, а форма «глаза его» сохраняет умеренно возвышенный библейский регистр без архаизации.
