  text: ἠγέρθη δὲ ⸀Σαῦλος ἀπὸ τῆς γῆς, ἀνεῳγμένων ⸀δὲ τῶν ὀφθαλμῶν αὐτοῦ ⸀οὐδὲν ἔβλεπεν· χειραγωγοῦντες δὲ αὐτὸν εἰσήγαγον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/008.yaml
  text: But Saul got up from the ground[a], and though his eyes were open, he saw nothing. So they led him by the hand and brought him into Damascus.
translation:
  language: ru
  text: Савл поднялся с земли. Глаза его были открыты, но он ничего не видел. Его повели за руку и привели в Дамаск.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγέρθη
  choice: поднялся
  rationale: В данном повествовательном контексте пассивная форма ἐγείρω употреблена непереходно и означает, что Савл встал после падения на землю.
- source_word: ἀπὸ τῆς γῆς
  choice: с земли
  rationale: Здесь γῆ обозначает поверхность земли, на которой лежал Савл, а не мир или географическую область.
- source_word: ἀνεῳγμένων ... τῶν ὀφθαλμῶν αὐτοῦ
  choice: хотя глаза его были открыты
  rationale: Родительный абсолют передаёт сопутствующее обстоятельство; контекст выявляет уступительный контраст между открытыми глазами и полной неспособностью видеть.
- source_word: οὐδὲν ἔβλεπεν
  choice: он ничего не видел
  rationale: Прямо и естественно передаёт полное отсутствие зрения, оставаясь близким к греческой формулировке.
- source_word: χειραγωγοῦντες
  choice: его повели за руку
  rationale: Глагол конкретно обозначает ведение человека за руку, когда тот нуждается в помощи или направлении.
- source_word: εἰσήγαγον εἰς Δαμασκόν
  choice: привели в Дамаск
  rationale: Передаёт движение внутрь города; предыдущая фраза уже уточняет способ, которым его вели.
- source_word: δὲ
  choice: но / тогда
  rationale: Повторяющаяся частица δέ служит развитию повествования и выражает лёгкий контраст; в русском её функции естественно переданы разными связками без механического повторения.
- source_word: Σαῦλος
  choice: Савл
  rationale: Использована укоренившаяся русская библейская форма личного имени.
- source_word: Δαμασκόν
  choice: Дамаск
  rationale: Использована нормативная русская форма географического названия.
