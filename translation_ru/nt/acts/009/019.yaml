lexical_decisions:
- source_word: λαβὼν τροφὴν
  choice: приняв пищу
  rationale: Сохраняет последовательность, выраженную аористным причастием, и передаёт принятие пищи без излишнего уточнения способа действия.
- source_word: ἐνίσχυσεν
  choice: он подкрепился
  rationale: В данном контексте глагол описывает восстановление сил Савла после поста; возвратная форма естественно передаёт непереходное значение.
- source_word: Ἐγένετο δὲ
  choice: затем он… пробыл
  rationale: Оборот служит повествовательным переходом. Русское «затем» передаёт развитие рассказа, а «пробыл» естественно сочетается с указанием длительности.
- source_word: μετὰ τῶν ἐν Δαμασκῷ μαθητῶν
  choice: с учениками в Дамаске
  rationale: μετά с родительным падежом выражает совместное пребывание, а ἐν Δαμασκῷ указывает место нахождения учеников.
- source_word: ἡμέρας τινάς
  choice: несколько дней
  rationale: Винительный падеж выражает длительность; перевод сохраняет неопределённость периода и не задаёт точного числа дней.
