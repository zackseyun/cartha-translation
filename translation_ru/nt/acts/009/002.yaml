  text: ᾐτήσατο παρ’ αὐτοῦ ἐπιστολὰς εἰς Δαμασκὸν πρὸς τὰς συναγωγάς, ὅπως ἐάν τινας εὕρῃ τῆς ὁδοῦ ὄντας, ἄνδρας τε καὶ γυναῖκας, δεδεμένους ἀγάγῃ εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/002.yaml
  text: and asked him for letters to the synagogues in Damascus[a], so that if he found any belonging to the Way, both men and women, he might bring them bound to Jerusalem.
translation:
  language: ru
  text: и попросил у него письма к синагогам в Дамаске, чтобы, если он найдёт тех, кто принадлежит к Пути[a], — как мужчин, так и женщин, — привести их связанными в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «последователей Пути». В греческом тексте употреблено раннее название христианского движения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾐτήσατο παρ’ αὐτοῦ
  choice: попросил у него
  rationale: Передаёт просьбу, обращённую к лицу, у которого просят письма; естественная русская конструкция.
- source_word: ἐπιστολὰς
  choice: письма
  rationale: Прямое соответствие существительному; полномочия подразумеваются контекстом, но не добавляются в текст.
- source_word: εἰς Δαμασκὸν πρὸς τὰς συναγωγάς
  choice: к синагогам в Дамаске
  rationale: Естественно передаёт адресатов и их местонахождение без тяжеловесного повторения предлогов.
- source_word: ὅπως ἐάν τινας εὕρῃ
  choice: чтобы, если он найдёт кого-нибудь
  rationale: Сохраняет одновременно значение цели и условную возможность.
- source_word: τῆς ὁδοῦ ὄντας
  choice: из принадлежащих к Пути
  rationale: Сохраняет раннее название христианского движения и генитивную связь, не сводя выражение к пояснительному пересказу.
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: мужчин или женщин
  rationale: В сфере условного «кого-нибудь» русское «или» естественно охватывает обе названные группы и сохраняет явное упоминание обоих полов.
- source_word: δεδεμένους ἀγάγῃ
  choice: привести их связанными
  rationale: Передаёт состояние задержанных как связанных, не уточняя средства связывания, и целевое действие глагола ἄγω.
- source_word: εἰς Ἰερουσαλήμ
  choice: в Иерусалим
  rationale: Обычная русская форма обозначения движения к городу.
theological_decisions:
- issue: Передача τῆς ὁδοῦ как исторического обозначения раннего христианского движения
  choice: Путь
  alternative: последователи Пути
  rationale: Название сохранено без пояснительного расширения и без привнесения более поздней конфессиональной терминологии.
- issue: Явное упоминание мужчин и женщин
  choice: мужчин или женщин
  alternative: как мужчин, так и женщин
  rationale: Обе группы названы прямо; форма с «или» согласуется с условно-неопределённой конструкцией «если найдёт кого-нибудь».
translation_notes:
  register: Современный литературный русский язык; синтаксис достоинственный и понятный. Заглавная буква в слове «Путь» отмечает историческое название движения. Вставная конструкция выделяет мужчин и женщин, не разрывая основную цель высказывания.
