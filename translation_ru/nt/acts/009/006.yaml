  source_fidelity: Текст точно передаёт повеления ἀνάστηθι и εἴσελθε εἰς τὴν πόλιν, а также будущую пассивную, не называющую говорящего конструкцию λαληθήσεταί σοι через естественное «тебе скажут». «Что ты должен делать» адекватно передаёт ὅ τί σε δεῖ ποιεῖν и сохраняет силу необходимости δεῖ, не уточняя её источник.
