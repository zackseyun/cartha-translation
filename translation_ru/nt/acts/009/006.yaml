  text: ἀλλὰ ἀνάστηθι καὶ εἴσελθε εἰς τὴν πόλιν, καὶ λαληθήσεταί σοι ⸂ὅ τί⸃ σε δεῖ ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/006.yaml
  text: But get up and enter the city[a], and you will be told what you must do.
translation:
  language: ru
  text: Но встань и войди в город, и тебе скажут, что ты должен делать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт противительный переход от предыдущей реплики к повелению Иисуса; кратко и естественно по-русски.
- source_word: ἀνάστηθι
  choice: встань
  rationale: Аористный императив ἀνίστημι; в данном контексте обычное и точное повеление подняться после падения на землю.
- source_word: εἴσελθε εἰς τὴν πόλιν
  choice: войди в город
  rationale: Естественно передаёт направленное движение εἰσέρχομαι с εἰς и сохраняет повелительную форму.
- source_word: λαληθήσεταί σοι
  choice: тебе скажут
  rationale: Безлично-личная русская конструкция естественно передаёт будущий пассив и не вводит названного действующего лица, которого нет в греческом тексте.
- source_word: ὅ τί
  choice: что
  rationale: Естественно вводит содержание будущего сообщения, не утяжеляя русскую фразу.
- source_word: σε δεῖ ποιεῖν
  choice: ты должен делать
  rationale: Сохраняет сильное значение необходимости или обязательности у δεῖ, не уточняя сверх текста источник этой необходимости.
theological_decisions:
- issue: Сила δεῖ в контексте Божьего водительства
  choice: должен
  alternative: нужно / необходимо
  rationale: «Должен» ясно сохраняет обязательность, характерную для δεῖ, но не разрешает явно вопрос о природе или источнике этой необходимости.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Пассивная неопределённость греческого λαληθήσεταί сохранена посредством «тебе скажут» без добавления субъекта.
