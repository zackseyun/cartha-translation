reference: Acts 9:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἦν δέ τις μαθητὴς ἐν Δαμασκῷ ὀνόματι Ἁνανίας, καὶ εἶπεν πρὸς αὐτὸν ⸂ἐν ὁράματι ὁ κύριος⸃· Ἁνανία. ὁ δὲ εἶπεν· Ἰδοὺ ἐγώ, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/010.yaml
  text: There was a disciple in Damascus named Ananias, and the Lord said to him in a vision, “Ananias.” And he said, “Here I am, Lord.”
translation:
  language: ru
  text: 'В Дамаске был один ученик по имени Анания. Господь сказал ему в видении: «Анания!» Тот ответил: «Вот я, Господи».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: В Дамаске был
  rationale: Конструкция вводит нового участника повествования, а δέ обозначает мягкий переход. В русском естественный порядок слов и начало нового предложения передают переход без добавления временного наречия.
- source_word: τις μαθητὴς
  choice: один ученик
  rationale: Неопределённое τις вводит ранее не названного человека. «Один ученик» естественно передаёт эту функцию и не придаёт выражению излишней торжественности, как «некий ученик».
- source_word: ἐν Δαμασκῷ
  choice: в Дамаске
  rationale: Прямое обозначение места посредством ἐν с дательным падежом; употреблена традиционная русская форма названия города.
- source_word: ὀνόματι Ἁνανίας
  choice: по имени Анания
  rationale: Идиоматическая русская передача дательного ὀνόματι в конструкции называния; сохранена традиционная форма имени.
- source_word: εἶπεν πρὸς αὐτόν
  choice: сказал ему
  rationale: Прямо и естественно передаёт λέγω с πρός и винительным падежом.
- source_word: ἐν ὁράματι
  choice: в видении
  rationale: Обозначает способ, которым Господь обратился к Анании; это ясная и устойчивая русская формулировка.
- source_word: ὁ κύριος
  choice: Господь
  rationale: В данном контексте титул относится к воскресшему Иисусу; русское «Господь» сохраняет его христологическое значение.
- source_word: Ἁνανία
  choice: Анания!
  rationale: Звательная форма имени передана традиционной русской формой; восклицательный знак естественно выражает непосредственный зов, не добавляя нового содержания.
- source_word: ὁ δὲ εἶπεν
  choice: Тот ответил
  rationale: Местоимение с δέ обозначает реакцию Анании. «Тот ответил» устраняет неестественное повторение союзов и ясно передаёт смену говорящего.
- source_word: Ἰδοὺ ἐγώ
  choice: Вот я
  rationale: Устойчивая русская формула отклика, выражающая присутствие и готовность; ближе к форме греческого выражения, чем более развёрнутое «Я здесь».
- source_word: κύριε
  choice: Господи
  rationale: Русская звательная форма титула уместна при прямом обращении к воскресшему Иисусу и сохраняет связь с ὁ κύριος.
theological_decisions:
- issue: К кому относятся ὁ κύριος и κύριε в видении
  choice: 'Оба обозначения переданы как обращение к воскресшему Иисусу: «Господь / Господи»'
  alternative: Более общее обозначение Бога или вежливое «господин»
  rationale: В ближайшем контексте Деян 9 говорящий Господь поручает Анании идти к Савлу и говорит о нём как о Своём избранном орудии. Перевод сохраняет христологический смысл, не добавляя имени Иисуса там, где его нет в стихе.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис разбит на два предложения для естественного русского ритма. Архаизмы вроде «некий» и «се» не употреблены; традиционные формы «Господь» и «Господи» сохранены.
