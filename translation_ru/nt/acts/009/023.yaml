base_translation:
  language: en
  yaml_path: translation/nt/acts/009/023.yaml
  text: When many days had passed[c][b][a], the Jews conspired to kill him.
translation:
  language: ru
  text: Когда же прошло много дней[b], иудеи[a] сговорились[c] убить его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «иудеи». В данном контексте имеются в виду конкретные противники Савла, а не все иудеи без исключения.'
    reason: cultural_note
  - marker: b
    text: 'Или: «когда минуло немало дней». Буквально: «когда исполнялись (подходили к концу) многие дни».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «вместе замыслили».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Когда же
  rationale: Передаёт временной переход, сохраняя лёгкое связующее значение δέ; выражение естественно для современного русского повествования.
- source_word: ἐπληροῦντο
  choice: прошло
  rationale: При подлежащем «дни» пассивная форма πληρόω идиоматически обозначает истечение или завершение периода времени. «Прошло» звучит естественно, а более буквальный вариант отмечен в сноске.
- source_word: ἡμέραι ἱκαναί
  choice: много дней
  rationale: ἱκαναί здесь означает значительное количество, а не просто достаточность; «много дней» ясно и естественно передаёт длительный промежуток.
- source_word: συνεβουλεύσαντο
  choice: сговорились
  rationale: Глагол обозначает совместное совещание или выработку замысла; в сочетании с целью убить «сговорились» передаёт коллективное и враждебное намерение, не добавляя юридического оттенка.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Сохраняет данное в греческом тексте этнорелигиозное обозначение без необоснованного сужения до руководителей; контекстуальный объём пояснён в сноске.
- source_word: ἀνελεῖν
  choice: убить
  rationale: Прямо и нейтрально передаёт значение лишения жизни, не добавляя юридической или оценочной окраски слова «убить».
- source_word: αὐτόν
  choice: его
  rationale: Местоимение относится к Савлу, названному в ближайшем контексте.
theological_decisions:
- issue: Передача οἱ Ἰουδαῖοι во враждебном повествовательном контексте
  choice: иудеи
  alternative: иудейские предводители; жители Иудеи
  rationale: 'Основной текст сохраняет формулировку источника и не уточняет референта сверх сказанного. Сноска предотвращает ошибочное универсальное понимание: речь идёт о конкретных противниках Савла в данном контексте, а не обо всех иудеях.'
translation_notes:
  register: Современный литературный русский язык; фраза краткая, повествовательная и достойная по тону. Порядок маркеров приведён в соответствие с теми словами, которые они поясняют.
