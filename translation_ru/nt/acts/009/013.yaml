  source_fidelity: 'Текст точно передаёт все смысловые элементы греческого оригинала: уступительно-связующее «Но», ответ Анании, обращение «Господи», сведения «от многих» об «этом человеке», масштаб причинённого зла, адресатов («Твоим святым») и место действия — Иерусалим. «Сколько зла он причинил» естественно передаёт ὅσα κακὰ ... ἐποίησεν, не сужая его до одного конкретного вида действий.'
