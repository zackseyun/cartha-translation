id: ACT.9.13
reference: Acts 9:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀπεκρίθη δὲ Ἁνανίας· Κύριε, ⸀ἤκουσα ἀπὸ πολλῶν περὶ τοῦ ἀνδρὸς τούτου, ὅσα κακὰ ⸂τοῖς ἁγίοις σου ἐποίησεν⸃ ἐν Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/013.yaml
  text: But Ananias answered[a], “Lord, I have heard from many about this man, how much evil he has done to your saints in Jerusalem.”
translation:
  language: ru
  text: 'Но Анания ответил: «Господи, я слышал от многих об этом человеке, сколько зла он причинил Твоим святым в Иерусалиме».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη δὲ Ἁνανίας
  choice: Но Анания ответил
  rationale: 'δέ обозначает здесь лёгкое противопоставление: Анания отвечает с колебанием; «ответил» прямо передаёт ἀπεκρίθη.'
- source_word: Κύριε
  choice: Господи
  rationale: Естественная русская форма прямого обращения к Господу; в контексте видения Анания обращается к воскресшему Иисусу.
- source_word: ἤκουσα ἀπὸ πολλῶν
  choice: я слышал от многих
  rationale: Передаёт получение сведений в прошлом, сохраняющих значение в настоящем, и не добавляет отсутствующего в греческом тексте существительного.
- source_word: περὶ τοῦ ἀνδρὸς τούτου
  choice: об этом человеке
  rationale: Естественно и точно передаёт περί с родительным падежом и указательное τούτου.
- source_word: ὅσα κακὰ ... ἐποίησεν
  choice: сколько зла он причинил
  rationale: «Сколько зла» сохраняет идею значительной меры и множества злых деяний, а «причинил» естественно сочетается с адресатом в дательном падеже.
- source_word: τοῖς ἁγίοις σου
  choice: Твоим святым
  rationale: Сохраняет новозаветное обозначение верующих как «святых» и притяжательное местоимение, выражающее их принадлежность Господу.
- source_word: ἐν Ἰερουσαλήμ
  choice: в Иерусалиме
  rationale: Стандартная передача местного значения.
theological_decisions:
- issue: Значение Κύριε в обращении Анании
  choice: Господи
  alternative: господин / наставник
  rationale: Непосредственный контекст показывает, что Анания отвечает явившемуся ему воскресшему Иисусу; «Господи» сохраняет и форму почтительного обращения, и богословский вес повествования.
- issue: Обозначение верующих выражением τοῖς ἁγίοις σου
  choice: Твоим святым
  alternative: Твоим освящённым / Твоему святому народу
  rationale: «Святые» является точным, установившимся и не конфессионально узким обозначением принадлежащих Господу верующих; коллективный смысл не требует поясняющего добавления.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся близким к греческому, но фраза «сколько зла он причинил» звучит естественно по-русски. Прописная буква в «Твоим» употреблена как традиционный знак почтения в прямом обращении к Господу.
