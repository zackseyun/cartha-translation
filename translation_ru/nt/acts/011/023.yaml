id: ACT.11.23
reference: Acts 11:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὃς παραγενόμενος καὶ ἰδὼν τὴν χάριν ⸀τὴν τοῦ θεοῦ, ἐχάρη καὶ παρεκάλει πάντας τῇ προθέσει τῆς καρδίας ⸀προσμένειν τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/023.yaml
  text: When he arrived and saw the grace of God, he rejoiced and kept urging them all to remain devoted to the Lord with purpose of heart,
translation:
  language: ru
  text: Придя и увидев благодать Божью[a], он обрадовался и убеждал всех с сердечной решимостью держаться Господа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Божью благодать». Это выражение может указывать на видимые проявления благодатного действия Бога среди них.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «оставаться с Господом»; «оставаться верными Господу».'
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενος
  choice: придя
  rationale: Аористное причастие обозначает прибытие Варнавы; «придя» естественно передаёт событие без лишнего уточнения.
- source_word: ἰδὼν
  choice: увидев
  rationale: Сохраняет обычное зрительное значение ὁράω, не исключая подразумеваемого распознавания Божьего действия.
- source_word: τὴν χάριν τὴν τοῦ θεοῦ
  choice: благодать Божью
  rationale: Сохраняет богословскую ёмкость χάρις и не сводит выражение к пояснительному пересказу «то, что сделал Бог».
- source_word: ἐχάρη
  choice: обрадовался
  rationale: Естественный современный русский эквивалент со значением пережитой радости.
- source_word: παρεκάλει
  choice: убеждал
  rationale: Имперфект передаёт продолжительное наставление, а «убеждал» сохраняет побудительный оттенок παρακαλέω.
- source_word: πάντας
  choice: всех
  rationale: Прямо и естественно передаёт охват всех упомянутых верующих.
- source_word: τῇ προθέσει τῆς καρδίας
  choice: с сердечной решимостью
  rationale: Передаёт πρόθεσις как намерение и твёрдое решение, а καρδία — как внутренний центр воли; выражение естественно для современного русского языка.
- source_word: προσμένειν
  choice: держаться
  rationale: В сочетании с дательным τῷ κυρίῳ выражает продолжающуюся приверженность и близость; «держаться Господа» звучит естественно и не сужает смысл до позднейшей догматической категории.
- source_word: τῷ κυρίῳ
  choice: Господа
  rationale: Передаёт κύριος традиционным и понятным титулом; в контексте Деяний речь идёт о воскресшем Иисусе, но перевод сохраняет форму исходного текста.
theological_decisions:
- issue: Значение выражения «благодать Божья»
  choice: Сохранено само выражение, допускающее понимание как видимого благодатного действия Бога среди верующих Антиохии.
  alternative: 'Перевести пояснительно: «то, что Бог совершил по Своей благодати».'
  rationale: Исходный текст говорит о χάρις, а не прямо о совершённых делах; буквальная по существу передача сохраняет богословскую насыщенность и подлинную широту смысла.
- issue: Смысл προσμένειν τῷ κυρίῳ
  choice: «держаться Господа» — продолжать быть приверженными Ему.
  alternative: «оставаться с Господом» или «оставаться верными Господу».
  rationale: Выбранная формулировка сохраняет как идею продолжающейся связи, так и оттенок стойкой приверженности, не превращая его в более узкое догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Причастная конструкция сохраняет компактность греческого текста; «с сердечной решимостью» понятно современному читателю и избегает тяжеловесного буквализма «с намерением сердца».
