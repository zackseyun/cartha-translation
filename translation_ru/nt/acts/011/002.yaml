  yaml_path: translation/nt/acts/011/002.yaml
  text: But when Peter went up to Jerusalem[a], those of the circumcision were disputing with him.
translation:
  language: ru
  text: Когда же Пётр поднялся в Иерусалим, сторонники обрезания[a] спорили с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «те, кто из обрезания». Возможны также переводы: «люди из обрезанных» или «обрезанные верующие». Греческое выражение обозначает группу, связанную с обрезанием, не обязательно формально организованную партию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Когда же
  rationale: Сочетание сохраняет повествовательный переход с лёгким оттенком противопоставления и естественно звучит по-русски.
- source_word: ἀνέβη
  choice: поднялся
  rationale: Передаёт обычное для библейской речи обозначение пути в Иерусалим как восхождения, связанное с его географическим положением.
- source_word: Ἰερουσαλήμ
  choice: Иерусалим
  rationale: Устоявшаяся русская форма названия города.
- source_word: διεκρίνοντο
  choice: стали спорить
  rationale: В данном контексте глагол обозначает направленное противостояние или пререкание, а имперфект — разворачивавшееся действие; русский оборот естественно передаёт начало спора по возвращении Петра.
- source_word: πρὸς αὐτόν
  choice: с ним
  rationale: При глаголе спора πρός с винительным указывает на человека, с которым вступают в спор, не усиливая враждебность до значения «против него».
- source_word: οἱ ἐκ περιτομῆς
  choice: сторонники обрезания
  rationale: Передаёт группу, определяемую её связью с обрезанием, и в русском яснее буквального, но неестественного «те, кто от обрезания»; при этом не объявляет её официально оформленной партией.
theological_decisions:
- issue: Кого обозначает οἱ ἐκ περιτομῆς
  choice: группа среди верующих в Иерусалиме, придававшая особое значение обрезанию
  alternative: все верующие иудейского происхождения вообще либо официально оформленная «партия обрезания»
  rationale: Контекст указывает на людей, возражавших Петру из-за общения с необрезанными. Перевод отражает их отличительный признак, но не утверждает ни универсального охвата всех иудеохристиан, ни существования формальной партии.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Поднялся в Иерусалим» сохраняет исходную пространственную идиому; «стали спорить» звучит естественно и передаёт активное возражение. Сноска сохраняет неоднозначность обозначения группы.
