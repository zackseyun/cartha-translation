  text: ἐμνήσθην δὲ τοῦ ῥήματος ⸀τοῦ κυρίου ὡς ἔλεγεν· Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ βαπτισθήσεσθε ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/016.yaml
  text: Then I remembered the word of the Lord[a], how he said, ‘John baptized with water, but you will be baptized in the Holy Spirit.’
translation:
  language: ru
  text: 'Тогда я вспомнил слово Господа — то, что Он сказал: «Иоанн крестил водой, а вы будете крещены в Святом Духе[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Святым Духом». Греческий предлог может передаваться как «в», так и «Святым Духом».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθην
  choice: я вспомнил
  rationale: 'Депонентная форма аориста естественно передаётся активным глаголом совершенного вида: Пётр сообщает, что вспомнил сказанное.'
- source_word: δὲ
  choice: тогда
  rationale: Частица обозначает переход к следующему моменту повествования, без выраженного противопоставления.
- source_word: τοῦ ῥήματος τοῦ κυρίου
  choice: слова Господа
  rationale: ῥῆμα означает произнесённое слово или изречение; русское единственное число «слова» в родительном падеже сохраняет форму и привычное библейское словоупотребление.
- source_word: ὡς ἔλεγεν
  choice: как Он говорил
  rationale: Имперфект передаёт речь в её процессе или как вспоминаемую формулировку, но русский несовершенный вид не требует вывода о многократном повторении.
- source_word: Ἰωάννης μὲν ... ὑμεῖς δὲ
  choice: Иоанн ... а вы
  rationale: Союз «а» естественно выражает сопоставление Иоанна и адресатов, соответствующее конструкции μὲν…δὲ.
- source_word: ἐβάπτισεν ὕδατι
  choice: крестил водой
  rationale: Устоявшийся глагол «крестить» точен в данном контексте, а творительный «водой» естественно передаёт дательный средства.
- source_word: βαπτισθήσεσθε
  choice: будете крещены
  rationale: Будущее страдательного залога сохранено без уточнения подразумеваемого деятеля.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: в Святом Духе
  rationale: Предлог «в» сохраняет возможный локативный оттенок ἐν; инструментальное понимание отмечено в сноске. Заглавные буквы указывают на Божьего Духа.
theological_decisions:
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: В контексте речь идёт об авторитетном изречении Иисуса; «Господь» сохраняет обычное новозаветное наименование и его богословский вес.
- issue: Значение ἐν в выражении ἐν πνεύματι ἁγίῳ
  choice: в Святом Духе
  alternative: Святым Духом
  rationale: Греческий предлог допускает локативное и инструментальное понимание. Основной текст сохраняет «в», а естественная русская инструментальная передача дана в сноске, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис прост и понятен; тире перед «как Он говорил» естественно вводит содержание вспомнившегося изречения. Местоимение «Он» написано с заглавной буквы по принятой русской традиции благоговейного обозначения Господа.
