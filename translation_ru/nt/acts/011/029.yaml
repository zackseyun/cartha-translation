  source_fidelity: 'В целом смысл передан верно: ученики принимают решение послать материальную помощь верующим в Иудее, соразмеряя её со средствами каждого. Однако «Тогда» несколько сильнее, чем простое повествовательное δέ, а формулировка «чтобы каждый ... послал» грамматически допустима, но менее точно выражает конструкцию коллективного решения с распределительным участием каждого. «По мере своих средств» точнее и естественнее, чем «по мере достатка», поскольку εὐπορέω относится к наличным возможностям/состоятельности каждого, а не к абстрактному достатку.'
