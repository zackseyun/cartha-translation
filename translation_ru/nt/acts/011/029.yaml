base_translation:
  language: en
  yaml_path: translation/nt/acts/011/029.yaml
  text: So the disciples determined[a], each according to his ability[b], to send relief to the brothers living in Judea.
translation:
  language: ru
  text: Ученики постановили, чтобы каждый из них, по мере своих средств[a], послал помощь братьям, живущим в Иудее[b].
  philosophy: optimal-equivalence
  footnotes:
