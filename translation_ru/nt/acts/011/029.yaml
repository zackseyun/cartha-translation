    reason: lexical_alternative
  - marker: b
    text: Слово «братья», вероятно, обозначает здесь верующих в Иудее в целом, включая всю христианскую общину.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητῶν
  choice: ученики
  rationale: Устоявшееся и точное обозначение последователей Иисуса в книге Деяний.
- source_word: καθὼς εὐπορεῖτό τις … ἕκαστος αὐτῶν
  choice: каждый по мере достатка
  rationale: Передаёт распределительный смысл и зависимость пожертвования от материальных возможностей каждого; формулировка не предполагает одинаковой суммы.
- source_word: ὥρισαν
  choice: решили
  rationale: В данном контексте глагол означает принять обдуманное решение; «решили» естественно звучит по-русски.
- source_word: εἰς διακονίαν πέμψαι
  choice: послал помощь
  rationale: В контексте голода διακονία обозначает практическую поддержку, которую предполагалось отправить; перевод передаёт смысл сочетания без неестественного буквального «послать для служения».
- source_word: τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ
  choice: живущим в Иудее
  rationale: Прямой и естественный перевод причастного оборота.
- source_word: ἀδελφοῖς
  choice: братьям
  rationale: Сохраняет мужскую форму греческого существительного и характерное для раннехристианской общины семейное обращение; возможный собирательный смысл пояснён в сноске.
theological_decisions:
- issue: Объём значения ἀδελφοῖς применительно к верующим в Иудее
  choice: братьям
  alternative: братьям и сёстрам; верующим
  rationale: Греческий текст имеет форму мужского рода во множественном числе, которая могла также обозначать общину в целом. Основной текст сохраняет форму источника, а потенциально инклюзивный объём значения отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет коллективное решение учеников и личную, соразмерную достатку ответственность каждого. «Тогда» естественно передаёт связующее δέ в повествовании.
