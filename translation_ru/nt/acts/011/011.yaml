  text: καὶ ἰδοὺ ἐξαυτῆς τρεῖς ἄνδρες ἐπέστησαν ἐπὶ τὴν οἰκίαν ἐν ᾗ ⸀ἦμεν, ἀπεσταλμένοι ἀπὸ Καισαρείας πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/011.yaml
  text: And behold[a], immediately three men arrived at the house where we were, having been sent to me from Caesarea.
translation:
  language: ru
  text: И вот, в тот же миг[a] у дома, где мы находились, появились трое мужчин, посланные ко мне из Кесарии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тотчас», «как раз тогда».'
    reason: Лексема ἐξαυτῆς может подчёркивать как немедленность, так и совпадение событий во времени.
lexical_decisions:
- source_word: ἰδοὺ
  choice: и вот
  rationale: Сохраняет функцию указания на внезапное и значимое развитие событий и естественно звучит в русском повествовании.
- source_word: ἐξαυτῆς
  choice: в тот же миг
  rationale: Передаёт непосредственную временную связь с предшествующим видением и подчёркнутую безотлагательность.
- source_word: τρεῖς ἄνδρες
  choice: трое мужчин
  rationale: Точно передаёт число и мужской пол названных лиц; собирательное числительное естественно в современном русском языке.
- source_word: ἐπέστησαν ἐπὶ τὴν οἰκίαν
  choice: у дома ... появились
  rationale: Передаёт внезапное прибытие и присутствие людей у дома без буквального, но неестественного «встали у дома».
- source_word: ἐν ᾗ ἦμεν
  choice: где мы находились
  rationale: Сохраняет простое указание на местонахождение, не добавляя отсутствующего в греческом уточнения о проживании или остановке.
- source_word: ἀπεσταλμένοι
  choice: посланные
  rationale: Причастие сохраняет пассивное значение и показывает, что их отправили прежде, чем они прибыли.
- source_word: ἀπὸ Καισαρείας πρός με
  choice: ко мне из Кесарии
  rationale: Ясно передаёт место отправления и Петра как адресата поручения.
theological_decisions: []
