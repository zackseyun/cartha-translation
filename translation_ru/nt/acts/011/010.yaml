id: ACT.11.10
reference: Acts 11:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ⸂ἀνεσπάσθη πάλιν⸃ ἅπαντα εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/010.yaml
  text: This happened three times[a], and everything was drawn up again into heaven.
translation:
  language: ru
  text: Это повторилось трижды, и всё снова было поднято на небо.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и всё это снова было взято на небо».'
    reason: Лексическая альтернатива, передающая ἅπαντα более указательно, а ἀνεσπάσθη — менее образно.
lexical_decisions:
- source_word: τοῦτο δὲ ἐγένετο ἐπὶ τρίς
  choice: Это повторилось трижды
  rationale: Оборот сообщает, что только что описанное событие произошло три раза. «Это повторилось трижды» естественно передаёт повторяемость, не добавляя отсутствующего в греческом слова «видение».
- source_word: ἀνεσπάσθη
  choice: было поднято
  rationale: Страдательная форма сохраняет не названного прямо действующего субъекта и передаёт направленное вверх движение. «Поднято» звучит естественнее, чем буквальное «втянуто», не устраняя образ внешнего воздействия.
- source_word: πάλιν
  choice: снова
  rationale: Передаёт повторное или обратное движение в контексте возвращения увиденного на небо.
- source_word: ἅπαντα
  choice: всё
  rationale: Средний род множественного числа обозначает всю совокупность увиденного, но не уточняет, идёт ли речь о полотне, его содержимом или всей сцене.
- source_word: εἰς τὸν οὐρανόν
  choice: на небо
  rationale: В контексте видения οὐρανός означает небо как небесную сферу; русское «поднято на небо» естественно выражает направление движения.
theological_decisions:
- issue: Референт ἅπαντα в рассказе Петра о видении
  choice: Передано обобщённо как «всё»
  alternative: «всё это»; «все животные»; «всё полотно»
  rationale: Греческий текст охватывает всю совокупность, не называя её точный состав. Обобщённая формулировка сохраняет эту неоднозначность и не сужает смысл.
translation_notes:
  register: Современный литературный русский язык; краткий и dignified повествовательный стиль. «Трижды» общеупотребительно и уместно в библейском повествовании без излишней архаизации.
