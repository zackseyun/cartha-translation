  text: ἠκούσθη δὲ ὁ λόγος εἰς τὰ ὦτα τῆς ἐκκλησίας τῆς ⸀οὔσης ἐν ⸀Ἰερουσαλὴμ περὶ αὐτῶν, καὶ ἐξαπέστειλαν ⸀Βαρναβᾶν ἕως Ἀντιοχείας·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/022.yaml
  text: The report about them reached the ears of the church in Jerusalem[a], and they sent out Barnabas as far as Antioch.
translation:
  language: ru
  text: Известие о них дошло до церкви в Иерусалиме[a], и церковь послала Варнаву в Антиохию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Известие о них было услышано церковью в Иерусалиме»; буквально: «было услышано в уши церкви, находившейся в Иерусалиме». Греч. «до Антиохии» может подчёркивать предел пути.'
    reason: Передаёт пассивную форму и образность греческого выражения, а также отмечает буквальный оттенок ἕως без утяжеления основного русского текста.
lexical_decisions:
- source_word: ἠκούσθη ... εἰς τὰ ὦτα
  choice: дошла до
  rationale: Греческое пассивное выражение буквально говорит, что весть была услышана «в уши»; по-русски естественно передать эту идиому как «дошла до», сохранив смысл поступившего известия.
- source_word: ὁ λόγος
  choice: весть
  rationale: В данном повествовательном контексте λόγος означает известие о ранее описанных людях и событиях, а не речь или богословский «Слово».
- source_word: τῆς ἐκκλησίας τῆς οὔσης ἐν Ἰερουσαλήμ
  choice: церкви в Иерусалиме
  rationale: Причастный оборот определяет местонахождение общины; сжатая русская конструкция передаёт это без смысловой потери.
- source_word: περὶ αὐτῶν
  choice: о них
  rationale: Местоимение оставлено без уточняющей интерпретации, поскольку оно может охватывать упомянутых ранее людей и связанные с ними события.
- source_word: ἐξαπέστειλαν
  choice: оттуда послали
  rationale: Неопределённо-личная конструкция естественна по-русски и не приписывает действие специально апостолам или пресвитерам; «оттуда» показывает отправление из иерусалимской церкви.
- source_word: Βαρναβᾶν
  choice: Варнаву
  rationale: Использована закрепившаяся в русской библейской традиции форма имени.
- source_word: ἕως Ἀντιοχείας
  choice: в Антиохию
  rationale: С предельным ἕως название места обозначает пункт, до которого был послан Варнава; русское «в Антиохию» естественно выражает направление и цель.
theological_decisions:
- issue: Кто послал Варнаву
  choice: Безлично-коллективное «оттуда послали» соотносит действие с иерусалимской церковью в целом.
  alternative: Назвать субъектом апостолов, пресвитеров либо руководство церкви.
  rationale: Ближайший названный участник — церковь в Иерусалиме; текст не выделяет более узкий круг руководителей, поэтому перевод его не добавляет.
- issue: К кому или к чему относится αὐτῶν
  choice: Сохранено местоименное «о них».
  alternative: Уточнить как «об этих событиях» или «об уверовавших».
  rationale: Греческое местоимение допускает контекстуальную широту, которую не следует устранять в основном тексте.
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейским достоинством. «Весть» звучит естественно и повествовательно; конструкция «дошла до» избегает буквального и тяжеловесного «была услышана ушами». Начальный δέ отдельно не выражен: связь с контекстом достаточно передана порядком повествования.'
