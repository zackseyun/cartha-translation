source:
  edition: SBLGNT
  text: εἶπον δέ· Μηδαμῶς, κύριε, ⸀ὅτι κοινὸν ἢ ἀκάθαρτον οὐδέποτε εἰσῆλθεν εἰς τὸ στόμα μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/008.yaml
  text: But I said, ‘By no means, Lord, because nothing common or unclean has ever entered my mouth.’
translation:
  language: ru
  text: 'Но я сказал: «Ни за что, Господи, ведь ничто скверное или нечистое никогда не входило в мои уста».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: Ни за что
  rationale: Естественно и решительно передаёт категорический отказ в данном контексте.
- source_word: κύριε
  choice: Господи
  rationale: Форма обращения, соответствующая греческому звательному употреблению и контексту обращения к Господу.
- source_word: κοινὸν
  choice: скверное
  rationale: Здесь слово обозначает ритуально осквернённое, непригодное в пищу, а не просто «общее»; «скверное» сохраняет отличие от следующего «нечистое».
- source_word: ἀκάθαρτον
  choice: нечистое
  rationale: Прямо передаёт категорию ритуальной нечистоты.
- source_word: εἰσῆλθεν εἰς τὸ στόμα μου
  choice: входило в мои уста
  rationale: Сохраняет образное и несколько формальное выражение оригинала, естественное для библейского регистра.
theological_decisions:
- issue: Соотношение κοινόν и ἀκάθαρτον
  choice: скверное или нечистое
  alternative: обычное или нечистое
  rationale: В пищевом и ритуальном контексте буквальное «общее» в современном русском вводило бы в заблуждение. Выбранная пара сохраняет два отдельных греческих определения, не сводя их в одно.
- issue: Связь причины с отказом
  choice: ведь
  alternative: потому что
  rationale: «Ведь» ясно вводит названную Петром причину и при этом звучит естественнее внутри прямой речи.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи; синтаксис близок к оригиналу, но не выглядит калькой. Кавычки оформляют прямую речь.
