id: ACT.11.5
reference: Acts 11:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος καὶ εἶδον ἐν ἐκστάσει ὅραμα, καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ, καὶ ἦλθεν ἄχρι ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/005.yaml
  text: 'I was in the city of Joppa praying[a], and in a trance I saw a vision: something like a large sheet was coming down, being lowered from heaven by four corners[b], and it came to me.'
translation:
  language: ru
  text: 'Я был в городе Иоппии и молился. В трансе я увидел видение: с неба спускался какой-то предмет[a], похожий на большое полотно; его опускали за четыре угла[b], и он приблизился ко мне.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «какой-то сосуд». Греческое слово имеет широкое значение и может обозначать предмет, сосуд или вместилище.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «опускаемый с неба за четыре угла».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος
  choice: Я был в городе Иоппии и молился
  rationale: Сохраняется явно названный город и одновременность молитвы; отдельное русское сказуемое звучит естественнее буквальной причастной конструкции.
- source_word: ἐν ἐκστάσει ὅραμα
  choice: В трансе я увидел видение
  rationale: 'Переданы оба различимых элемента греческого текста: особое состояние Петра и увиденное им видение. «Транс» яснее для современного читателя, чем эмоционально окрашенное «экстаз».'
- source_word: σκεῦός τι
  choice: какой-то предмет
  rationale: σκεῦος — широкое обозначение вещи, сосуда или вместилища; «предмет» не уточняет его природу до следующего сравнения.
- source_word: ὡς ὀθόνην μεγάλην
  choice: похожий на большое полотно
  rationale: Передаёт сравнение и размер без необоснованного уточнения материала ткани.
- source_word: καταβαῖνον ... καθιεμένην ἐκ τοῦ οὐρανοῦ
  choice: с неба спускался ... его опускали
  rationale: 'Сохраняются и движение вниз, и пассивный смысл: предмет не просто двигался, но был опускаем, при этом действующее лицо не называется.'
- source_word: τέσσαρσιν ἀρχαῖς
  choice: за четыре угла
  rationale: В данном образе ἀρχαί обозначает края или оконечности; «четыре угла» — наиболее естественное русское выражение.
- source_word: ἦλθεν ἄχρι ἐμοῦ
  choice: он приблизился ко мне
  rationale: Передаёт движение предмета вплоть до местонахождения Петра, не добавляя, что предмет коснулся его или лёг рядом.
theological_decisions:
- issue: Передача терминов откровения без усиления мистических коннотаций
  choice: В трансе я увидел видение
  alternative: В исступлении я увидел видение
  rationale: Формулировка сохраняет различие между ἔκστασις и ὅραμα, но не представляет переживание как эмоциональный экстаз или безумие.
- issue: Неназванный деятель при опускании предмета
  choice: его опускали
  alternative: он был опускаем
  rationale: Неопределённо-личная конструкция естественна по-русски и не называет Бога или ангелов там, где греческий пассив оставляет деятеля невыраженным.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. «Иоппия» сохраняет устоявшуюся русскую библейскую форму топонима. Длинная греческая конструкция разделена на два предложения для понятности, без устранения повторения «транс — видение».
