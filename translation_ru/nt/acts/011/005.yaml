  source_fidelity: 'Перевод точно передаёт все основные элементы греческого текста: пребывание Петра в Иоппии во время молитвы, состояние ἐν ἐκστάσει, отдельное ὅραμα, неопределённое σκεῦός τι, сравнение с большим полотном, спускание с неба за четыре угла и приближение предмета к Петру. Неопределённо-личное «его опускали» удачно сохраняет невыраженного деятеля греческого пассива.'
  naturalness: Текст звучит естественно на современном литературном русском. Разделение длинной греческой фразы на два предложения не меняет логических связей. «Какой-то предмет» немного разговорнее, чем «некий предмет», но в данном контексте остаётся допустимым и хорошо передаёт неопределённое τι.
  terminology: «Иоппия» — устоявшаяся русская библейская форма. «В трансе» и «видение» корректно различают ἔκστασις и ὅραμα, не навязывая богословской интерпретации. «Большое полотно» и «за четыре угла» адекватно передают образ ὀθόνη и τέσσαρσιν ἀρχαῖς. Сноски привязаны к соответствующим словам и содержательно верны.
