  text: ἀναστὰς δὲ εἷς ἐξ αὐτῶν ὀνόματι Ἅγαβος ἐσήμανεν διὰ τοῦ πνεύματος λιμὸν ⸀μεγάλην μέλλειν ἔσεσθαι ἐφ’ ὅλην τὴν οἰκουμένην· ⸀ἥτις ἐγένετο ἐπὶ ⸀Κλαυδίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/028.yaml
  text: And one of them[a], named Agabus, stood up and indicated by the Spirit that a great famine was about to come over the whole inhabited world—which happened in the time of Claudius.
translation:
  language: ru
  text: Один из них, по имени Агав, встал и сообщил через Духа, что по всему обитаемому миру[a] предстоит сильный голод. Этот голод и случился во времена Клавдия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по всему миру». В книгах Луки выражение «обитаемый мир» может также относиться более конкретно к римскому миру.'
    reason: 'Лексическая неоднозначность οἰκουμένη: выражение может означать обитаемый мир в широком смысле, а в контексте Луки — более конкретно римский мир.'
lexical_decisions:
- source_word: ἀναστὰς
  choice: встал
  rationale: 'Передаёт обычное в данном контексте значение причастия ἀνίστημι: Агав поднялся, чтобы обратиться к собравшимся.'
- source_word: ἐσήμανεν
  choice: дал знать
  rationale: Сохраняет значение «указать, сообщить, дать понять», не конкретизируя без необходимости форму пророческого сообщения.
- source_word: διὰ τοῦ πνεύματος
  choice: через Духа
  rationale: Передаёт διά с родительным как посредство или действие Духа; прописная буква отражает контекстуальную отсылку к Святому Духу.
- source_word: λιμὸν μεγάλην
  choice: великий голод
  rationale: Прямо передаёт существительное λιμός и прилагательное μέγας, сохраняя достоинство и силу исходной формулировки.
- source_word: μέλλειν ἔσεσθαι
  choice: предстоит
  rationale: Естественно по-русски выражает ожидаемое будущее и оттенок приближения, присущий конструкции μέλλω с инфинитивом.
- source_word: ἐφ’ ὅλην τὴν οἰκουμένην
  choice: по всей обитаемой земле
  rationale: Сохраняет буквальное значение οἰκουμένη и не сужает его в основном тексте до Римской империи.
- source_word: ἥτις ἐγένετο
  choice: Он и случился
  rationale: Отдельное предложение ясно связывает исполнение с предсказанным голодом и естественно передаёт относительную конструкцию с эмфатическим оттенком.
- source_word: ἐπὶ Κλαυδίου
  choice: во времена Клавдия
  rationale: Точно и понятно передаёт хронологическое употребление ἐπί с родительным, не добавляя в основной текст слова «царствование» или «правление».
theological_decisions:
- issue: Кого обозначает «Дух» в διὰ τοῦ πνεύματος
  choice: Святой Дух
  alternative: дух или духовное вдохновение в менее определённом смысле
  rationale: В пророческих контекстах книги Деяний определённое «Дух» обычно относится к Святому Духу; прописная буква передаёт это контекстуальное понимание.
- issue: Объём значения οἰκουμένη
  choice: в основном тексте сохранено широкое лексическое значение «вся обитаемая земля»
  alternative: весь мир; весь римский мир
  rationale: Слово может обозначать обитаемый мир вообще, а в контексте Луки — также мир Римской империи. Перевод не устраняет эту неоднозначность, а примечание указывает более узкую возможность.
translation_notes:
  register: Современный литературный русский язык; ясная, сдержанная и достойная повествовательная речь. Формулировка «через Духа дал знать» намеренно сохраняет средство откровения и не заменяет σημαίνω более узким «предсказал».
