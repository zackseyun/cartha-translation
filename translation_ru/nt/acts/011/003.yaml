  text: saying[a], “You went in to uncircumcised men and ate with them.”
translation:
  language: ru
  text: 'говоря: «Ты вошёл к необрезанным и ел с ними».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: говоря
  rationale: Причастие настоящего времени вводит содержание упрёка и сохраняет синтаксическую связь с предыдущим стихом.
- source_word: ὅτι
  choice: двоеточие и прямая речь
  rationale: Союз вводит содержание высказывания; в современном русском естественно оформить его прямой речью.
- source_word: Εἰσῆλθες πρὸς
  choice: ты вошёл к
  rationale: Передаёт как конкретное вхождение, так и направленность к людям; выражение естественно звучит по-русски и сохраняет обвинительный оттенок.
- source_word: ἄνδρας ἀκροβυστίαν ἔχοντας
  choice: необрезанным
  rationale: Субстантивированное прилагательное естественно передаёт мужчин, не имевших обрезания, не заменяя исходную характеристику толкованием «язычники».
- source_word: καὶ συνέφαγες αὐτοῖς
  choice: и ел с ними
  rationale: Прямо и естественно передаёт совместную трапезу, выраженную глаголом συνεσθίω.
theological_decisions:
- issue: Передавать ли ἀκροβυστίαν ἔχοντας как «язычники» или как «необрезанные»
  choice: необрезанным
  alternative: к язычникам
  rationale: Исходный текст формулирует упрёк через отсутствие знака обрезания, подчёркивая заветную и социально-религиозную границу; перевод не должен заменять это более общим этническим обозначением.
translation_notes:
  register: Современный литературный русский язык; краткая, резкая формулировка сохраняет характер прямого обвинения. «Вошёл к» намеренно сохраняет конкретность действия, а «ел с ними» — совместность трапезы.
