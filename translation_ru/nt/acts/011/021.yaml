    reason: lexical_alternative
lexical_decisions:
- source_word: χεὶρ κυρίου
  choice: рука Господа
  rationale: Сохранена библейская метафора, обозначающая действенную силу и благоволение Господа; она понятна по-русски и поддерживает межтекстовые связи.
- source_word: κύριος
  choice: Господь
  rationale: Обычный и достойный русский эквивалент титула κύριος; перевод не уточняет референта сверх греческого текста.
- source_word: μετ’ αὐτῶν
  choice: с ними
  rationale: 'Передаёт естественное значение μετά с родительным падежом: присутствие и поддержка Господа сопровождали возвещавших.'
- source_word: πολύς τε ἀριθμός
  choice: великое число
  rationale: Сохраняет именную конструкцию оригинала и естественно обозначает множество людей.
- source_word: ὁ πιστεύσας
  choice: уверовавших
  rationale: Субстантивированное причастие аориста согласовано по смыслу с собирательным выражением «великое число»; русский перевод сохраняет возможную временную связь с последующим обращением.
- source_word: ἐπέστρεψεν ἐπὶ τὸν κύριον
  choice: обратилось к Господу
  rationale: «Обратилось» естественно передаёт направленное к Господу изменение и конверсионный смысл глагола, не добавляя прямо не выраженного указания на покаяние и не предполагая прежней принадлежности.
theological_decisions:
- issue: К кому относится титул «Господь»
  choice: В обоих случаях оставить «Господь», не уточняя «Иисус» или «Бог».
  alternative: Явно перевести как «Иисус» либо истолковать как обозначение Бога вообще.
  rationale: Контекст Деяний может указывать на Иисуса, особенно в речи об обращении, однако греческий текст в обоих случаях использует только κύριος. Сохранение титула не снимает присущей тексту открытости.
- issue: Связь между верой и обращением в ὁ πιστεύσας ἐπέστρεψεν
  choice: «уверовавших обратилось»
  alternative: «которые уверовали и обратились» либо «поверив, обратились»
  rationale: Причастие аориста допускает понимание предшествующего или сопутствующего обстоятельства. Формулировка сохраняет компактность и напряжение оригинала, не превращая грамматическую связь в отдельную явно последовательную стадию.
translation_notes:
  register: Современный литературный русский язык с сохранением традиционной библейской метафоры «рука Господа». Синтаксис сделан ясным и торжественным без архаизмов; единственное число «обратилось» согласуется с собирательным сочетанием «великое число».
