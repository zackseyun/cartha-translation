source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διασπαρέντες ἀπὸ τῆς θλίψεως τῆς γενομένης ἐπὶ Στεφάνῳ διῆλθον ἕως Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας μηδενὶ λαλοῦντες τὸν λόγον εἰ μὴ μόνον Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/019.yaml
  text: So then[a], those who had been scattered because of the affliction that arose over Stephen went as far as Phoenicia and Cyprus and Antioch[c][b], speaking the word to no one except Jews.
translation:
  language: ru
  text: Итак, рассеявшиеся из-за бедствия[a], разразившегося в связи со Стефаном, дошли до Финикии, Кипра и Антиохии, никому не возвещая слова[b], кроме одних только иудеев[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В данном контексте возможно также: «гонение», «притеснение» или «скорбь».'
    reason: lexical_alternative
  - marker: b
    text: '«Слово» здесь означает возвещаемую весть об Иисусе; возможный перевод: «весть».'
    reason: lexical_alternative
  - marker: c
    text: 'В греческом тексте ограничение подчёркнуто: «только иудеям» или «никому, кроме одних лишь иудеев».'
    reason: emphasis
lexical_decisions:
- source_word: Οἱ μὲν οὖν διασπαρέντες
  choice: Итак, рассеявшиеся
  rationale: «Итак» передаёт возобновление повествовательной линии посредством μὲν οὖν, а причастие «рассеявшиеся» сохраняет пассивный смысл и отсылает к ранее описанному рассеянию.
- source_word: ἀπὸ τῆς θλίψεως
  choice: из-за гонения
  rationale: Хотя θλῖψις имеет более широкий смысл — «бедствие, притеснение, скорбь», контекст Деян 8:1–4 ясно описывает враждебное преследование. «Гонение» естественно и точно передаёт значение слова в данном контексте; его более широкий диапазон отмечен в сноске.
- source_word: τῆς γενομένης ἐπὶ Στεφάνῳ
  choice: начавшегося в связи со Стефаном
  rationale: 'Формулировка сохраняет ассоциативно-причинную широту ἐπί с дательным падежом: речь идёт о гонении, развернувшемся в связи с делом и смертью Стефана, а не обязательно о гонении лично на него.'
- source_word: διῆλθον ἕως
  choice: дошли до
  rationale: Естественно передаёт передвижение и обозначенный ἕως предел пути без излишнего уточнения маршрута.
- source_word: Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας
  choice: Финикии, Кипра и Антиохии
  rationale: Употреблены закрепившиеся в русском библейском и литературном языке географические названия.
- source_word: λαλοῦντες τὸν λόγον
  choice: возвещали слово
  rationale: «Возвещали» естественно выражает публичную передачу вести в данном контексте, а «слово» сохраняет характерный для Деяний тематический оборот τὸν λόγον без поясняющего расширения в основном тексте.
- source_word: μηδενὶ ... εἰ μὴ μόνον Ἰουδαίοις
  choice: одним только иудеям
  rationale: Русское сочетание «одним только» естественно сохраняет усилительное ограничение, выраженное μηδενὶ, εἰ μή и μόνον.
theological_decisions:
- issue: Характер бедствия после смерти Стефана
  choice: В основном тексте употреблено контекстуально конкретное «гонение».
  alternative: «бедствие», «притеснение» или «скорбь»
  rationale: Само θλῖψις шире понятия преследования, однако непосредственный контекст говорит о гонении на общину. Сноска сохраняет более широкий лексический диапазон и не делает контекстуальный выбор невидимым.
- issue: Смысл выражения τὸν λόγον
  choice: Сохранено выражение «слово».
  alternative: «весть» или «послание»
  rationale: В Деяниях «слово» служит повторяющимся обозначением возвещаемой вести об Иисусе. Более явное пояснение было бы истолковательным расширением; значение кратко раскрыто в сноске.
- issue: Ограничение аудитории иудеями
  choice: «одним только иудеям»
  alternative: «никому, кроме иудеев»
  rationale: Выбранный вариант передаёт подчёркнутую исключительность греческой конструкции, не объясняя богословские причины такого ограничения.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Одно длинное греческое предложение разделено на два русских для ясности; причастный оборот и логическая связь сохранены. Термин «иудеи» выбран как исторически и контекстуально точный.
