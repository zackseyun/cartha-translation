  text: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν ἐπέπεσεν τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτοὺς ὥσπερ καὶ ἐφ’ ἡμᾶς ἐν ἀρχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/015.yaml
  text: And as I began to speak[c][b][a], the Holy Spirit fell on them just as it had on us at the beginning.
translation:
  language: ru
  text: Когда же я начал говорить[a], Святой Дух сошёл на них — так же, как вначале на нас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как только я начал говорить». Греческая конструкция может подчёркивать одновременность и то, что это произошло в самом начале речи.'
    reason: lexical_alternative
  - marker: b
    text: «Вначале» здесь, вероятно, означает начало излияния Святого Духа на учеников, в день Пятидесятницы.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν
  choice: Когда же я начал говорить
  rationale: Конструкция ἐν с субстантивированным инфинитивом выражает время одновременного действия. «Когда же я начал говорить» естественно по-русски и передаёт, что событие произошло в самом начале речи Петра.
- source_word: ἐπέπεσεν
  choice: сошёл на
  rationale: Глагол ἐπιπίπτω здесь образно описывает нисхождение Духа на людей. «Сошёл на» сохраняет библейскую выразительность и звучит естественнее современного русского буквального «пал на».
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Святой Дух
  rationale: Общепринятое точное обозначение в современном русском библейском языке.
- source_word: ὥσπερ καὶ ἐφ’ ἡμᾶς
  choice: как и на нас
  rationale: Передаёт точное уподобление, выраженное ὥσπερ, и включающее значение καί, не перегружая русскую фразу.
- source_word: ἐν ἀρχῇ
  choice: вначале
  rationale: Наречие естественно обозначает начальный момент описываемого опыта и не вызывает столь сильной ассоциации с сотворением мира, как формула «в начале».
theological_decisions:
- issue: К чему относится выражение ἐν ἀρχῇ («вначале»)
  choice: В основном тексте сохранена широкая временная формулировка «вначале»; в примечании указано вероятное отнесение к Пятидесятнице.
  alternative: Понимать как общее «сначала», без указания на конкретное событие.
  rationale: Сравнение с тем, что произошло «на нас», в контексте Деяний, вероятнее всего, отсылает к первоначальному излиянию Духа в Пятидесятницу. Однако сам перевод не превращает это контекстуальное заключение в явное утверждение текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Выбрано естественное «сошёл на» вместо кальки «пал на»; синтаксис остаётся близким к греческому, но не звучит искусственно.
