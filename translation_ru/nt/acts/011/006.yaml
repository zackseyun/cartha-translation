  text: εἰς ἣν ἀτενίσας κατενόουν καὶ εἶδον τὰ τετράποδα τῆς γῆς καὶ τὰ θηρία καὶ τὰ ἑρπετὰ καὶ τὰ πετεινὰ τοῦ οὐρανοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/006.yaml
  text: As I looked intently into it[a], I was considering it, and I saw the four-footed animals of the earth, the wild beasts, the reptiles, and the birds of the sky.
translation:
  language: ru
  text: Я пристально всмотрелся в него, внимательно его рассматривал и увидел земных четвероногих животных, диких зверей, пресмыкающихся[a] и птиц небесных.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ползучих существ». Греческое слово обозначает более широкую категорию существ, передвигающихся ползком, и перекликается с классификациями животных в повествовании о сотворении мира и в законах о чистой и нечистой пище.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν
  choice: в него
  rationale: Оборот относится к полотну (σκεῦος в предыдущем контексте — среднего рода); с ἀτενίζω передаёт направленность взгляда внутрь увиденного вместилища.
- source_word: ἀτενίσας
  choice: пристально всмотрелся
  rationale: Передаёт сосредоточенный, напряжённый взгляд и естественно сочетается с направлением «в него».
- source_word: κατενόουν
  choice: стал внимательно разглядывать
  rationale: Передаёт продолженное внимательное рассмотрение, выраженное имперфектом, и отличает его от последующего εἶδον.
- source_word: εἶδον
  choice: увидел
  rationale: Простое обозначение зрительного восприятия сохраняет отличие аориста от предшествующего продолженного действия.
- source_word: τὰ τετράποδα τῆς γῆς
  choice: земных четвероногих животных
  rationale: Сохраняет категорию четвероногих существ и связь с землёй, но звучит естественнее буквального «четвероногих земли».
- source_word: τὰ θηρία
  choice: диких зверей
  rationale: Передаёт отдельную категорию диких животных и сохраняет торжественный характер перечня.
- source_word: τὰ ἑρπετά
  choice: пресмыкающихся
  rationale: Традиционное и понятное библейское обозначение ползающих существ; более широкое значение отмечено в сноске.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: небесных птиц
  rationale: Естественно передаёт птиц, обитающих в небе, и сохраняет образную классификацию греческого текста.
