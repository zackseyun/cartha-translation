  text: And they did so[a], sending it to the elders by the hand of Barnabas and Saul.
translation:
  language: ru
  text: 'Так они и сделали: отправили помощь старейшинам[a] через Варнаву и Савла.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пресвитерам».'
    reason: Греческое πρεσβύτεροι может передаваться традиционным церковным термином «пресвитеры»; в основном тексте выбрано более прозрачное современное «старейшины».
lexical_decisions:
- source_word: ὃ καὶ ἐποίησαν
  choice: Так они и сделали
  rationale: Относительное местоимение ὃ отсылает к решению учеников оказать помощь в предыдущем стихе. Русское «так они и сделали» естественно передаёт эту анафору и краткость греческого выражения.
- source_word: ἀποστείλαντες
  choice: отправили
  rationale: Аористное причастие поясняет, каким действием они осуществили принятое решение. В современном русском однородная личная форма после двоеточия звучит естественнее буквального причастного оборота.
- source_word: implicit object from context
  choice: собранное
  rationale: Объект в греческом тексте не выражен, но восстанавливается из предыдущего стиха, где говорится о помощи. «Собранное» ясно указывает на передаваемые средства, не уточняя сверх контекста их вид или объём.
- source_word: πρὸς τοὺς πρεσβυτέρους
  choice: пресвитерам
  rationale: В русской библейской речи «пресвитеры» — устоявшееся и узнаваемое обозначение признанных руководителей общины; оно сохраняет связь с греческим πρεσβύτεροι.
- source_word: διὰ χειρὸς
  choice: через
  rationale: Греческая идиома буквально означает «рукой» и здесь обозначает посредничество или доставку через уполномоченных людей. Русское «через» передаёт её смысл естественно.
- source_word: Βαρναβᾶ καὶ Σαύλου
  choice: Варнаву и Савла
  rationale: Имена переданы в их традиционной русской библейской форме и поставлены в требуемый предлогом «через» винительный падеж.
