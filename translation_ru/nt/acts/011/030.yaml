translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Двоеточие ясно показывает, что отправка собранного была исполнением решения из предыдущего стиха; буквальная калька «рукой Варнавы и Савла» устранена как неестественная для современного русского.
