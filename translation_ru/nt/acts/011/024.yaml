lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит объяснение предшествующей положительной оценки Варнавы; «потому что» естественно передаёт причинно-пояснительную связь.
- source_word: ἀνὴρ ἀγαθὸς
  choice: добрым человеком
  rationale: Сочетание характеризует Варнаву как нравственно доброго человека; русское «человек» здесь естественно и не устраняет мужскую референцию, уже выраженную местоимением «он».
- source_word: πλήρης πνεύματος ἁγίου
  choice: исполненным Святого Духа
  rationale: «Исполненный» — естественное и укоренённое русское соответствие конструкции πλήρης с родительным падежом; «Святой Дух» обозначает личного Божьего Духа.
- source_word: πίστεως
  choice: веры
  rationale: Основное значение πίστις здесь естественно передаётся как «вера», хотя в характеристике Варнавы возможен и оттенок верности.
- source_word: προσετέθη
  choice: присоединилось
  rationale: Русское «присоединилось к Господу» естественнее буквального «было добавлено к Господу» и сохраняет пассивно-результативный смысл присоединения без подмены указанного объекта церковью.
- source_word: ὄχλος ἱκανὸς
  choice: множество людей
  rationale: Выражение указывает на значительное число людей; «множество людей» звучит современно и достойно, не создавая образа случайной уличной толпы.
- source_word: τῷ κυρίῳ
  choice: к Господу
  rationale: Сохраняется прямо названный в греческом тексте объект присоединения — Господь, а не подразумеваемая община.
theological_decisions:
- issue: Значение πνεύματος ἁγίου
  choice: Святого Духа как личного Божьего Духа
  alternative: святого духа или святого расположения
  rationale: В контексте Луки — Деяний выражение πνεῦμα ἅγιον обычно обозначает Святого Духа; характеристика Варнавы соответствует действию Духа в учениках.
- issue: Оттенок πίστεως в характеристике Варнавы
  choice: веры
  alternative: верности
  rationale: «Вера» сохраняет обычное значение πίστις, а возможный характерологический оттенок «верности» отмечен в сноске, чтобы не устранять подлинную лексическую неоднозначность.
- issue: К кому присоединилось множество
  choice: к Господу
  alternative: к церкви или общине
  rationale: Греческий текст прямо называет Господа; церковное присоединение может подразумеваться, но не должно подменять выраженный объект.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Причастная конструкция сохраняет компактность оригинала; оборот «присоединилось к Господу» выбран вместо неестественно буквального пассива.
