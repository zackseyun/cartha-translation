  text: ἐξῆλθεν δὲ εἰς ⸀Ταρσὸν ἀναζητῆσαι Σαῦλον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/025.yaml
  text: Then he went out to Tarsus to look for Saul,[a]
translation:
  language: ru
  text: Затем он отправился в Тарс, чтобы разыскать Савла.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы найти Савла»; возможно также: «чтобы искать Савла».'
    reason: Лексическое значение ἀναζητέω допускает передачу как целенаправленного поиска, так и стремления найти человека; контекст не требует уточнять интенсивность или результат поисков.
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: отправился
  rationale: Аорист ἐξέρχομαι обозначает уход и движение к месту назначения. «Отправился» естественно передаёт этот смысл по-русски; буквальное «вышел» здесь звучало бы неполно без указания исходной точки.
- source_word: δὲ
  choice: затем
  rationale: Здесь δέ служит мягкой повествовательной связкой и продвигает рассказ вперёд, не выражая явного противопоставления.
- source_word: εἰς Ταρσόν
  choice: в Тарс
  rationale: Предлог εἰς при глаголе движения указывает на место назначения. Название города передано в принятой русской форме «Тарс».
- source_word: ἀναζητῆσαι
  choice: чтобы разыскать
  rationale: Инфинитив выражает цель движения. «Разыскать» ясно передаёт целенаправленные поиски, допускаемые составным глаголом ἀναζητέω, не добавляя сведений о результате.
- source_word: Σαῦλον
  choice: Савла
  rationale: Имя передано в традиционной русской библейской форме и поставлено в винительном падеже согласно синтаксису.
theological_decisions: []
