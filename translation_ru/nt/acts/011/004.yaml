lexical_decisions:
- source_word: ἀρξάμενος
  choice: начал
  rationale: Аористное причастие употреблено обстоятельственно при основном глаголе; личная форма «начал» естественно передаёт начало последовательного объяснения.
- source_word: δὲ
  choice: же
  rationale: Частица отмечает переход и лёгкое противопоставление обвинению предыдущего стиха; постпозитивное «же» сохраняет этот оттенок без чрезмерно сильного контраста.
- source_word: Πέτρος
  choice: Пётр
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: ἐξετίθετο
  choice: объяснять
  rationale: Имперфект среднего залога здесь означает последовательное изложение или разъяснение дела. Инфинитив после «начал» образует естественную русскую конструкцию.
- source_word: αὐτοῖς
  choice: им
  rationale: Прямое соответствие дательному падежу местоимения во множественном числе.
- source_word: καθεξῆς
  choice: по порядку
  rationale: Наречие указывает на последовательное, упорядоченное изложение; «по порядку» точно и естественно передаёт этот смысл.
- source_word: λέγων
  choice: ':'
  rationale: Причастие вводит последующую прямую речь. В современном русском двоеточие перед репликой естественнее буквального «говоря» и выполняет ту же дискурсивную функцию.
