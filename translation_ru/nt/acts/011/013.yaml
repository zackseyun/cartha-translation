  text: And he reported to us how he had seen the angel standing in his house and saying[a], ‘Send to Joppa and summon Simon, who is called Peter.’
translation:
  language: ru
  text: 'Он рассказал нам, как увидел ангела, стоявшего в своём доме и говорившего: «Пошли в Иоппию и позови[a] Симона, называемого Петром».'
