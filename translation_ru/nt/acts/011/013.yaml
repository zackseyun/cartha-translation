lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: рассказал
  rationale: Глагол передаёт сообщение или изложение увиденного; «рассказал» естественно звучит в повествовании и не придаёт словам официально-канцелярского оттенка.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Слабая повествовательная связка δέ в русском контексте не требует отдельного союза; её явная передача словом «и» была бы менее естественной в начале фразы.
- source_word: πῶς εἶδεν
  choice: как видел
  rationale: «Как» сохраняет способно-содержательный оттенок πῶς, а русское прошедшее время естественно передаёт действие, предшествовавшее рассказу, без обязательного особого плюсквамперфекта.
- source_word: τὸν ἄγγελον
  choice: ангела
  rationale: В русском винительном падеже артикль не выражается; контекст указывает на конкретного ангела, увиденного Корнилием.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: в его доме
  rationale: Прямо и естественно обозначает жилище Корнилия и сохраняет местоименную соотнесённость оригинала.
- source_word: σταθέντα καὶ εἰπόντα
  choice: стоявшего … и говорившего
  rationale: Согласованные причастия сохраняют синтаксическую связь обоих действий с ангелом и передают его присутствие и речь в видении.
- source_word: Ἀπόστειλον εἰς Ἰόππην
  choice: Пошли в Иоппию
  rationale: Императив передан без добавления отсутствующего в греческом объектного слова «людей»; «в Иоппию» естественно выражает направление.
- source_word: μετάπεμψαι
  choice: позови
  rationale: В данном контексте глагол означает распорядиться, чтобы человек пришёл; «позови» понятно современному читателю, а буквальный оттенок посылки за ним отмечен в сноске.
- source_word: Σίμωνα τὸν ἐπικαλούμενον Πέτρον
  choice: Симона, называемого Петром
  rationale: Причастный оборот сохраняет идентифицирующую функцию греческой конструкции и различие между именами Симон и Пётр.
