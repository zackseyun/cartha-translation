  text: εἰ οὖν τὴν ἴσην δωρεὰν ἔδωκεν αὐτοῖς ὁ θεὸς ὡς καὶ ἡμῖν πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν, ⸀ἐγὼ τίς ἤμην δυνατὸς κωλῦσαι τὸν θεόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/017.yaml
  text: If then God gave to them the same gift as also to us who believed in the Lord Jesus the Messiah[b][a], who was I that I could hinder God?
translation:
  language: ru
  text: Итак, если Бог дал им тот же дар, что и нам, поверившим в Господа Иисуса, Мессию[a], то кто я такой, чтобы препятствовать Богу?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа». Греч. Χριστόν; здесь переведено как «Мессию», поскольку слово сохраняет значение титула.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσην δωρεάν
  choice: тот же дар
  rationale: ἴσην указывает на равенство и соответствие дара; «тот же дар» естественно передаёт сопоставление дара язычникам с даром, данным иудейским верующим.
- source_word: πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν
  choice: нам, поверившим в Господа Иисуса Мессию
  rationale: Причастие согласуется с ἡμῖν и наиболее прямо описывает «нас» как поверивших; предлог ἐπί с винительным при πιστεύω передаёт направленность веры и естественно переводится конструкцией «поверить в».
- source_word: κύριον
  choice: Господа
  rationale: В составе христологического исповедания κύριος выступает как титул Иисуса и передаётся традиционным и понятным словом «Господь».
- source_word: Χριστόν
  choice: Мессию
  rationale: Здесь Χριστός сохраняет силу титула; «Мессия» передаёт его смысл, а не превращает в подобие фамилии.
- source_word: ἐγὼ τίς ἤμην δυνατὸς
  choice: то кто я такой, чтобы
  rationale: Русская риторическая конструкция естественно выражает подчёркнутое ἐγώ, самоумаление говорящего и невозможность противиться Божьему действию.
- source_word: κωλῦσαι
  choice: препятствовать
  rationale: Глагол означает мешать, удерживать или воспрепятствовать; «препятствовать» допускает прямое дополнение «Богу» и сохраняет силу исходного выражения.
- source_word: τὸν θεόν
  choice: Богу
  rationale: 'По-русски глагол «препятствовать» требует дательного падежа; при этом сохраняется поразительная мысль исходного текста: сопротивление принятию язычников означало бы сопротивление самому Богу.'
theological_decisions:
- issue: Передача Χριστόν в титуле κύριον Ἰησοῦν Χριστόν
  choice: Мессию
  alternative: Христа
  rationale: «Мессия» сохраняет смысловую силу титула Χριστός в данном исповедании и не привносит конфессионального уточнения.
- issue: Связь причастия πιστεύσασιν с ἡμῖν
  choice: 'описательное значение: «нам, поверившим»'
  alternative: 'временное значение: «когда мы поверили»'
  rationale: Дательный падеж причастия согласуется с ἡμῖν, поэтому описательная конструкция формально ближе греческому тексту. Она также не закрепляет более точную временную последовательность дара и веры, чем выражено в исходнике.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет риторическую условную конструкцию оригинала; «то» естественно связывает условие с итоговым вопросом. Формулировка избегает как архаизма «воспрепятствовать», так и разговорного «мешать Богу».
