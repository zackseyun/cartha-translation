id: ACT.11.18
reference: Acts 11:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ ταῦτα ἡσύχασαν καὶ ⸀ἐδόξασαν τὸν θεὸν λέγοντες· ⸀Ἄρα καὶ τοῖς ἔθνεσιν ὁ θεὸς τὴν μετάνοιαν ⸂εἰς ζωὴν ἔδωκεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/018.yaml
  text: When they heard these things[a], they became quiet and glorified God, saying[b], “Then God has also granted to the Gentiles the change of mind that leads to life.”
translation:
  language: ru
  text: 'Услышав это, они умолкли и прославили Бога, говоря: «Значит, и язычникам[a] Бог даровал покаяние, ведущее к жизни[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народам». Здесь слово ἔθνεσιν обозначает неевреев, поэтому по контексту переведено как «язычникам».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «покаяние к жизни» либо «покаяние для жизни». Греческое выражение εἰς ζωήν может указывать на направленность к жизни или на результат — жизнь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες δὲ ταῦτα
  choice: Услышав это
  rationale: Аористное причастие передаёт предшествующее обстоятельство; естественная русская деепричастная конструкция сохраняет временную последовательность. Слабое связующее δέ отдельно не выражено.
- source_word: ἡσύχασαν
  choice: умолкли
  rationale: В контексте глагол означает, что прежние возражения прекратились и собеседники замолчали. «Умолкли» естественнее и точнее здесь, чем эмоционально окрашенное «успокоились».
- source_word: ἐδόξασαν τὸν θεόν
  choice: прославили Бога
  rationale: Сохраняет обычное для Луки — Деяний богословски значимое значение δοξάζω и прямой объект.
- source_word: λέγοντες
  choice: говоря
  rationale: Сохраняет причастную форму и вводит содержание их ответа без превращения её в отдельный самостоятельный глагол.
- source_word: Ἄρα
  choice: Значит
  rationale: Передаёт вывод, сделанный слушателями из рассказа Петра, естественным современным русским словом.
- source_word: καὶ τοῖς ἔθνεσιν
  choice: и язычникам
  rationale: καί подчёркивает включение ещё одной группы, а ἔθνη в данном контексте обозначает неевреев, поэтому «язычники» точнее, чем политико-географическое «народы».
- source_word: μετάνοιαν
  choice: покаяние
  rationale: «Покаяние» — установившийся и понятный русский эквивалент, охватывающий перемену внутренней направленности, а не только интеллектуальную «перемену ума».
- source_word: εἰς ζωήν
  choice: ведущее к жизни
  rationale: Передаёт направленность или результат, выраженные εἰς, не устраняя возможный оттенок цели.
- source_word: ἔδωκεν
  choice: даровал
  rationale: Передаёт совершившееся действие Бога и дарственный оттенок конструкции; контекст не требует русского перфекта.
theological_decisions:
- issue: Покаяние как дар Бога
  choice: «Бог даровал покаяние»
  alternative: «Бог дал возможность покаяться»
  rationale: Греческий текст прямо называет μετάνοιαν объектом ἔδωκεν. Перевод сохраняет это утверждение, не превращая его ни в одну лишь возможность, ни в развёрнутое учение о соотношении Божьего действия и человеческого ответа.
- issue: Связь покаяния и жизни
  choice: «покаяние, ведущее к жизни»
  alternative: «покаяние для жизни» / «покаяние в жизнь»
  rationale: Формулировка сохраняет направительно-результативную силу εἰς ζωήν и не уточняет сверх текста, идёт ли речь преимущественно о цели или о результате.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Умолкли» передаёт прекращение возражений без разговорности; «даровал» и «прославили» сохраняют достоинство и богословскую насыщенность текста. Маркеры примечаний поставлены непосредственно при выражениях, к которым относятся.
