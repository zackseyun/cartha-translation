  source_fidelity: 'Перевод точно передаёт греческий текст: аористное обстоятельство ἀκούσαντες, прекращение возражений в ἡσύχασαν, прославление Бога, выводное Ἄρα, включительное καί, адресата τοῖς ἔθνεσιν и дарование покаяния εἰς ζωήν. Формулировка «покаяние, ведущее к жизни» корректно передаёт направительно-результативный смысл εἰς без излишней догматической конкретизации.'
