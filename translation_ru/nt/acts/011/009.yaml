  yaml_path: translation/nt/acts/011/009.yaml
  text: But a voice answered from heaven a second time[a], ‘What God has made clean, you must not call common.’
translation:
  language: ru
  text: 'Но во второй раз голос с неба ответил: «То, что Бог очистил, ты не считай нечистым[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не объявляй обычным (профанным)». В данном контексте также возможно: «не считай осквернённым» или «не объявляй нечистым».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ответил
  rationale: Форма аориста от ἀποκρίνομαι означает «ответил»; русский глагол естественно передаёт реакцию голоса на слова Петра.
- source_word: φωνὴ
  choice: голос
  rationale: Сохраняет неопределённость греческого текста и не уточняет личность говорящего.
- source_word: ἐκ δευτέρου
  choice: во второй раз
  rationale: Точно и естественно передаёт идиому со значением повторного действия.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: с неба
  rationale: В данном контексте речь идёт о небесном источнике голоса; «с неба» — естественное русское соответствие.
- source_word: Ἃ
  choice: То, что
  rationale: Передаёт собирательное значение среднего рода множественного числа естественной русской конструкцией.
- source_word: ἐκαθάρισεν
  choice: очистил
  rationale: Передаёт завершённое действие Бога без добавления отсутствующего в греческом тексте временного оттенка.
- source_word: σὺ
  choice: ты
  rationale: Сохраняет выраженное в греческом тексте личное местоимение и его смысловое противопоставление Божьему действию.
- source_word: μὴ κοίνου
  choice: не считай осквернённым
  rationale: В контексте ритуальной чистоты κοινόω обозначает признание чего-либо профанным, осквернённым или нечистым. Формулировка понятна современному читателю и сохраняет оттенок профанации лучше, чем простое «нечистым».
theological_decisions:
- issue: Оттенок терминологии чистоты в κοινόω
  choice: не считай осквернённым
  alternative: не считай нечистым; не объявляй скверным
  rationale: Греческий глагол связан с категорией «обычного, непосвящённого, профанного» и в иудейском контексте чистоты может означать признание чего-либо нечистым. Основной текст сохраняет оттенок осквернения, а примечание указывает более привычные смысловые соответствия, не сводя термин к одной категории.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным строем. Порядок слов «во второй раз с неба ответил голос» сохраняет движение греческой фразы, оставаясь естественным по-русски; местоимение «ты» оставлено для передачи эмфазы.
