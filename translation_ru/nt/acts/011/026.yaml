id: ACT.11.26
reference: Acts 11:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ εὑρὼν ⸀ἤγαγεν εἰς Ἀντιόχειαν. ἐγένετο δὲ ⸂αὐτοῖς καὶ⸃ ἐνιαυτὸν ὅλον συναχθῆναι ⸀ἐν τῇ ἐκκλησίᾳ καὶ διδάξαι ὄχλον ἱκανόν, χρηματίσαι τε ⸀πρώτως ἐν Ἀντιοχείᾳ τοὺς μαθητὰς Χριστιανούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/026.yaml
  text: And when he found him, he brought him to Antioch. And for a whole year they met together with the church and taught a considerable crowd; and it was in Antioch that the disciples were first called Christians.
translation:
  language: ru
  text: Найдя его, он привёл его в Антиохию. Целый год они собирались вместе с церковью[a] и учили множество людей. Именно в Антиохии учеников впервые назвали христианами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собирались в церкви». Здесь под церковью имеется в виду христианская община, а не обязательно здание.'
    reason: lexical_alternative
  - marker: b
    text: То есть именно там учеников впервые стали называть «христианами»; вероятно, это название возникло как общественное обозначение группы.
    reason: cultural_note
lexical_decisions:
- source_word: εὑρὼν
  choice: Найдя его
  rationale: Аористное причастие обозначает действие, предшествующее основному; русский деепричастный оборот естественно передаёт последовательность.
- source_word: ἤγαγεν
  choice: привёл его
  rationale: В контексте Варнава приводит Савла в Антиохию; «привёл» точно и естественно передаёт ἄγω.
- source_word: ἐγένετο δὲ αὐτοῖς καὶ ἐνιαυτὸν ὅλον
  choice: Целый год они
  rationale: Греческая идиома вводит последующее обстоятельство; по-русски естественно прямо обозначить длительность и сохранить повествовательный переход.
- source_word: συναχθῆναι ἐν τῇ ἐκκλησίᾳ
  choice: собирались вместе с церковью
  rationale: Передаёт совместное собрание Варнавы и Савла с христианской общиной и не создаёт ненужного впечатления, будто речь обязательно идёт о здании.
- source_word: ἐκκλησίᾳ
  choice: церковью
  rationale: В данном контексте ἐκκλησία обозначает христианскую общину; «церковь» — привычный и уместный русский эквивалент.
- source_word: διδάξαι ὄχλον ἱκανόν
  choice: учили множество людей
  rationale: ἱκανός указывает на значительное число; русское «множество людей» звучит естественнее буквального «значительную толпу», не усиливая смысл.
- source_word: χρηματίσαι
  choice: назвали
  rationale: В данном контексте глагол означает присвоение или употребление наименования; форма «назвали» сохраняет подразумеваемого внешнего деятеля и естественна по-русски.
- source_word: πρώτως
  choice: впервые
  rationale: Точно обозначает первое засвидетельствованное употребление названия.
- source_word: Χριστιανούς
  choice: христианами
  rationale: Это закрепившееся групповое наименование, для которого нормативным русским соответствием является «христиане».
theological_decisions:
- issue: Передача Χριστιανούς с учётом связи слова с титулом Χριστός
  choice: христианами
  alternative: последователями Мессии
  rationale: Здесь употреблено не само титульное наименование Χριστός, а сложившееся название группы Χριστιανοί. «Христиане» точно передаёт историческое имя и не навязывает дополнительного толкования.
- issue: Значение ἐν τῇ ἐκκλησίᾳ
  choice: вместе с церковью
  alternative: в церкви
  rationale: Контекст допускает буквальное «в церкви», однако «вместе с церковью» яснее указывает на общину, а не на церковное здание, существование которого фраза сама по себе не утверждает.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и достойное, без архаизмов. Три действия разделены на короткие предложения, чтобы избежать перегруженности и выделить заключительное сообщение о названии «христиане».
