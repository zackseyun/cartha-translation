lexical_decisions:
- source_word: Ἀναστάς
  choice: Встань
  rationale: Естественно и точно передаёт повеление подняться; форма причастия в сочетании с императивами имеет побудительный смысл.
- source_word: θῦσον
  choice: заколи
  rationale: В данном контексте означает убить животное для употребления в пищу; «заколи» сохраняет конкретность действия и звучит естественнее, чем более широкое «убей».
- source_word: φάγε
  choice: ешь
  rationale: Прямой и общеупотребительный эквивалент повелительной формы.
