  text: ὃς λαλήσει ῥήματα πρὸς σὲ ἐν οἷς σωθήσῃ σὺ καὶ πᾶς ὁ οἶκός σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/014.yaml
  text: He will speak words to you by which you and all your household will be saved[a].
translation:
  language: ru
  text: Он скажет тебе слова, через которые спасёшься ты и весь твой дом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в которых»; греческое выражение указывает, что через эти слова приходит спасение.'
    reason: Лексическая альтернатива для ἐν οἷς и пояснение его инструментального оттенка.
lexical_decisions:
- source_word: ὃς
  choice: Он
  rationale: Относительное местоимение указывает на ранее упомянутого человека; в самостоятельной русской формулировке естественно начать с личного местоимения.
- source_word: λαλήσει
  choice: скажет
  rationale: В сочетании с прямым дополнением «слова» русское «скажет слова» звучит естественнее, чем «будет говорить слова», и точно передаёт будущее действие.
- source_word: ῥήματα
  choice: слова
  rationale: Сохраняет конкретное множественное число греческого существительного, не заменяя его толкованием «весть».
- source_word: πρὸς σὲ
  choice: тебе
  rationale: При глаголе речи πρός с винительным обозначает адресата; по-русски это естественно передаётся дательным падежом.
- source_word: ἐν οἷς
  choice: через которые
  rationale: 'Передаёт инструментальное значение выражения: произнесённые слова служат средством, через которое приходит спасение, при этом возможная буквальная передача отмечена в сноске.'
- source_word: σωθήσῃ
  choice: спасёшься
  rationale: Форма аориста пассивного конъюнктива обусловлена относительной конструкцией ἐν οἷς; русское будущее естественно передаёт обещанный результат. Возвратная форма «спасёшься» является обычным русским соответствием пассивного значения и не означает самоспасения.
- source_word: σὺ
  choice: ты
  rationale: Явно выраженное греческое местоимение сохранено в сочетании «ты и весь твой дом».
- source_word: πᾶς ὁ οἶκός σου
  choice: весь твой дом
  rationale: «Дом» в современном литературном русском может обозначать семью и всех домашних, как οἶκος здесь; эта формулировка также сохраняет краткость и коллективный смысл оригинала.
theological_decisions:
- issue: Смысл спасения в повествовании о доме Корнилия
  choice: «спасёшься»
  alternative: «будешь избавлен»
  rationale: Контекст Деяний связан с возвещением благой вести и спасением. Перевод сохраняет сотериологический смысл, не добавляя догматического объяснения механизма спасения.
- issue: Охват выражения πᾶς ὁ οἶκός σου
  choice: «весь твой дом»
  alternative: «все твои домашние»
  rationale: Коллективное выражение сохранено без утверждения, что члены дома спасаются автоматически или независимо от отклика на услышанное; сам стих этого не уточняет.
- issue: Связь слов и спасения в ἐν οἷς
  choice: «через которые»
  alternative: «в которых»
  rationale: Выбрана естественная инструментальная передача, показывающая роль возвещённых слов как средства, но не уточняющая сверх текста причинную или сакраментальную модель.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Синтаксис краток и близок к греческому. «Весь твой дом» употреблено в значении всех домашних; сноска сохраняет неоднозначность предлога ἐν.
