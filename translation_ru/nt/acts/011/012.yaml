  text: εἶπεν δὲ ⸂τὸ πνεῦμά μοι⸃ συνελθεῖν αὐτοῖς μηδὲν ⸀διακρίναντα. ἦλθον δὲ σὺν ἐμοὶ καὶ οἱ ἓξ ἀδελφοὶ οὗτοι, καὶ εἰσήλθομεν εἰς τὸν οἶκον τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/012.yaml
  text: And the Spirit told me to go with them[a], making no distinction. These six brothers also came with me, and we entered the man's house.
translation:
  language: ru
  text: Дух велел мне пойти с ними, не проводя никаких различий[a]. Со мной пошли и эти шестеро братьев, и мы вошли в дом того человека.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не колеблясь»; или: «не сомневаясь». Греческое причастие может означать как «не проводить различий», так и «не колебаться» или «не сомневаться».'
    reason: Сохранение подлинной лексической неоднозначности μηδὲν διακρίναντα.
lexical_decisions:
- source_word: τὸ πνεῦμά
  choice: Дух
  rationale: В контексте исходящее от Бога откровение указывает на Святого Духа; перевод сохраняет определённое обозначение Луки, не добавляя отсутствующее в греческом тексте слово «Святой».
- source_word: εἶπεν ... μοι
  choice: велел мне
  rationale: Глагол с последующим инфинитивом выражает указание; «велел мне» естественно передаёт его директивную силу в современном русском языке.
- source_word: συνελθεῖν αὐτοῖς
  choice: пойти с ними
  rationale: В данном контексте συνέρχομαι означает сопровождать посланных людей; этот вариант ясен и естествен.
- source_word: μηδὲν διακρίναντα
  choice: не делая различия
  rationale: διακρίνω может означать как проведение различия, так и сомнение или колебание. Контекст преодоления границы между иудеями и язычниками поддерживает основной вариант, а иные значения сохранены в сноске.
- source_word: οἱ ἓξ ἀδελφοὶ οὗτοι
  choice: эти шестеро братьев
  rationale: Речь идёт о шести мужчинах, сопровождавших Петра; «эти» передаёт указательное οὗτοι.
- source_word: εἰσήλθομεν
  choice: мы вошли
  rationale: Прямой и естественный перевод повествовательного аориста.
- source_word: τὸν οἶκον τοῦ ἀνδρός
  choice: дом того человека
  rationale: Сохраняется явно выраженное существительное ἀνήρ и указание на уже известного из контекста мужчину, а не заменяется местоимением.
theological_decisions:
- issue: Значение μηδὲν διακρίναντα в рассказе Петра
  choice: не делая различия
  alternative: не колеблясь; не сомневаясь
  rationale: Ближайший контекст связан с тем, что Пётр вошёл в дом язычника и затем защищал этот поступок перед верующими из иудеев. Основной перевод сохраняет тему отсутствия различия между иудеями и язычниками, однако многозначность греческого причастия не устраняется и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом и умеренно торжественным библейским регистром. Порядок фраз слегка адаптирован ради естественности, без устранения смысловой неоднозначности.
