    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ταύταις δὲ ταῖς ἡμέραις
  choice: В те дни
  rationale: Естественно и точно передаёт временную рамку; слабая связующая частица δέ не требует отдельного выражения в русском тексте.
- source_word: κατῆλθον
  choice: пришли
  rationale: В данном контексте глагол обозначает прибытие из Иерусалима в Антиохию. Русское «пришли» естественно передаёт движение к месту назначения; буквальный компонент «вниз» здесь не обязателен и может звучать неестественно.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: из Иерусалима
  rationale: Предлог ἀπό передаёт исходный пункт движения; с названием города в русском нормативно употребляется «из».
- source_word: προφῆται
  choice: пророки
  rationale: Сохраняет обычное и широкое значение греческого слова, не сужая характер их служения.
- source_word: εἰς Ἀντιόχειαν
  choice: в Антиохию
  rationale: Предлог εἰς выражает направление движения; форма с «в» и винительным падежом естественна для названия города.
theological_decisions:
- issue: Характер служения названных здесь пророков
  choice: пророки
  alternative: пророческие учители; вдохновлённые вестники
  rationale: Сам греческий текст не уточняет точный объём и статус их служения, поэтому широкий термин сохраняет богословскую открытость и не привносит конфессионального толкования.
