  text: Ἤκουσαν δὲ οἱ ἀπόστολοι καὶ οἱ ἀδελφοὶ οἱ ὄντες κατὰ τὴν Ἰουδαίαν ὅτι καὶ τὰ ἔθνη ἐδέξαντο τὸν λόγον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/001.yaml
  text: The apostles and the brothers who were throughout Judea heard that the Gentiles also had received the word of God[a].
translation:
  language: ru
  text: Апостолы и братья, находившиеся по всей Иудее, услышали, что и язычники приняли слово Божье[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры»; в греческом тексте стоит «братья», но это слово может шире обозначать единоверцев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: услышали
  rationale: Аорист ἀκούω сообщает о получении известия; «услышали» естественно и точно передаёт форму и смысл.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Здесь δέ служит мягким повествовательным переходом без явного противопоставления; в современном русском отдельное «же» или «теперь» звучало бы избыточно.
- source_word: οἱ ἀπόστολοι
  choice: апостолы
  rationale: Устоявшееся и контекстуально точное обозначение признанной апостольской группы.
- source_word: οἱ ἀδελφοὶ
  choice: братья
  rationale: Сохраняет грамматически мужскую форму греческого текста; в данном контексте слово может шире обозначать единоверцев, что пояснено в сноске.
- source_word: οἱ ὄντες κατὰ τὴν Ἰουδαίαν
  choice: находившиеся по всей Иудее
  rationale: Оборот с κατά имеет распределительное значение; «по всей Иудее» передаёт его точнее, чем просто «в Иудее».
- source_word: καὶ τὰ ἔθνη
  choice: и язычники
  rationale: καί подчёркивает присоединение ещё одной группы, а τὰ ἔθνη в контексте означает неевреев, а не политические нации.
- source_word: ἐδέξαντο
  choice: приняли
  rationale: δέχομαι здесь означает принятие возвещённого слова; «приняли» сохраняет как восприятие вести, так и положительный отклик на неё.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: слово Божье
  rationale: Сохраняет устойчивое библейское выражение и его богословскую насыщенность, оставаясь естественным для современного русского языка.
theological_decisions:
- issue: Значение ἀδελφοὶ в общине, которая могла включать мужчин и женщин
  choice: братья с пояснительной сноской
  alternative: братья и сёстры; верующие
  rationale: Основной текст сохраняет мужскую форму источника, не исключая возможного собирательного значения; сноска честно сообщает читателю о широте референции.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Порядок слов сделан естественным для русского; повествовательное δέ не получило отдельного формального эквивалента. Форма «Божье» современнее, чем «Божие», при сохранении традиционного выражения «слово Божье».
