base_translation:
  language: en
  yaml_path: translation/nt/acts/011/020.yaml
  text: But some of them were men from Cyprus and Cyrene[a], who, when they came to Antioch, were also speaking to the Hellenists, proclaiming the good news about the Lord Jesus.
translation:
  language: ru
  text: Но среди них были и мужчины, родом с Кипра и из Кирены, которые, придя в Антиохию, обращались также к эллинистам[a], возвещая благую весть о Господе Иисусе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «к грекам» вместо «к эллинистам». Если первоначально именно это чтение, речь идёт о проповеди язычникам, а не только грекоязычным иудеям.'
    reason: textual_variant
lexical_decisions:
- source_word: τινες
  choice: некоторые
  rationale: Передаёт неопределённое указание на часть ранее упомянутой группы.
- source_word: ἄνδρες
  choice: мужчины
  rationale: Сохраняет конкретное указание греческого существительного на взрослых лиц мужского пола.
- source_word: Κύπριοι καὶ Κυρηναῖοι
  choice: с Кипра и из Кирены
  rationale: Естественно по-русски передаёт происхождение, выраженное греческими этниконами.
- source_word: ἐλθόντες εἰς Ἀντιόχειαν
  choice: придя в Антиохию
  rationale: Деепричастный оборот кратко и естественно передаёт предшествующее обстоятельство аористного причастия.
- source_word: ἐλάλουν
  choice: стали говорить
  rationale: В контексте прибытия в Антиохию передаёт начавшуюся и продолжавшуюся деятельность, выраженную имперфектом.
- source_word: καὶ πρὸς
  choice: также с
  rationale: Передаёт присоединительное значение καί — расширение круга тех, к кому они обращались.
- source_word: τοὺς Ἑλληνιστάς
  choice: эллинистами
  rationale: Следует чтению SBLGNT Ἑλληνιστάς и сохраняет обозначение грекоязычных иудеев; значимое вариантное чтение вынесено в сноску.
- source_word: εὐαγγελιζόμενοι
  choice: возвещая благую весть о
  rationale: Доступно и содержательно передаёт провозглашение благой вести, избегая узкого церковного жаргона.
- source_word: τὸν κύριον Ἰησοῦν
  choice: Господе Иисусе
  rationale: Сохраняет христологический титул κύριος и естественное русское управление после выражения «благая весть о».
theological_decisions:
- issue: Идентичность τοὺς Ἑλληνιστάς и вариант Ἕλληνας
  choice: В основном тексте — «эллинистами», то есть грекоязычными иудеями.
  alternative: «греками», то есть язычниками.
  rationale: Основной текст следует предоставленному SBLGNT. Поскольку вариант меняет представление об адресатах проповеди и развитии миссии среди язычников, он сохранён в сноске без попытки устранить напряжение.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Термин «эллинисты» сохранён ради точности к принятому греческому тексту и пояснён сноской; синтаксис слегка упрощён для естественного чтения.
