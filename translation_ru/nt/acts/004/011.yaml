source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ λίθος ὁ ἐξουθενηθεὶς ὑφ’ ὑμῶν τῶν ⸀οἰκοδόμων, ὁ γενόμενος εἰς κεφαλὴν γωνίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/011.yaml
  text: This is the stone that was rejected by you[a], the builders, which has become the cornerstone.
translation:
  language: ru
  text: Он — тот камень, которым пренебрегли вы, строители, который стал краеугольным камнем.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верхний, завершающий камень»; буквально: «глава угла».'
    reason: 'Лексическая альтернатива: точная архитектурная функция выражения κεφαλὴ γωνίας остаётся предметом обсуждения.'
lexical_decisions:
- source_word: οὗτός
  choice: Он
  rationale: Указательное местоимение с особым ударением отсылает к Иисусу в непосредственном контексте; русское «Он» естественно сохраняет прямое отождествление.
- source_word: λίθος
  choice: камень
  rationale: Основное значение слова и важный элемент отсылки к Псалму 117:22 в русской нумерации.
- source_word: ἐξουθενηθεὶς
  choice: которым пренебрегли
  rationale: Глагол означает счесть ничтожным, отнестись с презрением или пренебречь. «Пренебрегли» точнее передаёт именно форму, употреблённую в Деяниях, не сводя её лишь к функциональному отказу.
- source_word: ὑφ’ ὑμῶν τῶν οἰκοδόμων
  choice: вы, строители
  rationale: Сохраняет прямое обвинение во втором лице множественного числа и строительную метафору; обращение-приложение звучит по-русски естественно.
- source_word: γενόμενος
  choice: стал
  rationale: Передаёт совершившуюся перемену положения камня без неестественной для русского языка перегрузки временной формы.
- source_word: κεφαλὴν γωνίας
  choice: краеугольным камнем
  rationale: Устойчивое и понятное русское обозначение важнейшего углового камня, сохраняющее образ псалма. Поскольку точная архитектурная функция выражения не бесспорна, возможный вариант вынесен в сноску.
theological_decisions:
- issue: Архитектурный образ цитаты из Псалма 117:22
  choice: краеугольный камень
  alternative: верхний, завершающий камень; буквально «глава угла»
  rationale: Основной вариант сохраняет традиционный библейский образ возвышения отвергнутого камня, не добавляя частного доктринального толкования. Неопределённость точного архитектурного референта отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. Синтаксис сохраняет прямое обвинение руководителей и контраст между пренебрежением и последующим возвышением камня.
