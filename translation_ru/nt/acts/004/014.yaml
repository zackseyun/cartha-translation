base_translation:
  language: en
  yaml_path: translation/nt/acts/004/014.yaml
  text: And seeing the man who had been healed standing with them[a], they had nothing to say in reply.
translation:
  language: ru
  text: Видя же исцелённого человека, стоящего с ними, они не могли ничего возразить.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «им нечего было сказать против этого»; или: «им нечего было опровергнуть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τε
  choice: же
  rationale: Частица связывает предложение с предшествующим повествованием; русское «же» естественно передаёт продолжение и лёгкий смысловой поворот без усиления.
- source_word: ἄνθρωπον
  choice: человека
  rationale: Речь идёт о конкретном мужчине, исцелённом ранее; в данном обороте «человека» звучит естественно и точно.
- source_word: βλέποντες
  choice: видя
  rationale: Причастие обозначает действие, одновременное с основной ситуацией; деепричастие «видя» сохраняет структуру и причинно-обстоятельственный оттенок оригинала.
- source_word: σὺν αὐτοῖς
  choice: рядом с ними
  rationale: Предлог σύν выражает совместное присутствие. «Рядом с ними» естественно описывает видимую сцену, не исключая более общего значения «с ними».
- source_word: ἑστῶτα
  choice: стоящего
  rationale: 'Перфектное причастие ἵστημι обозначает устойчивое состояние: человек стоит. Русское «стоящего» передаёт этот результативно-стативный смысл.'
- source_word: τεθεραπευμένον
  choice: исцелённого
  rationale: Перфектное страдательное причастие указывает на совершившееся исцеление с сохраняющимся результатом. «Исцелённого» уместно в контексте чудесного восстановления и сохраняет пассивный смысл.
- source_word: οὐδὲν
  choice: ничего
  rationale: Слово выражает полное отсутствие того, что можно было бы возразить.
- source_word: εἶχον ἀντειπεῖν
  choice: не могли ничего возразить
  rationale: Оборот ἔχω с инфинитивом здесь выражает отсутствие возможности или основания выступить с ответным возражением; «не могли ничего возразить» естественно передаёт противительный смысл ἀντειπεῖν.
