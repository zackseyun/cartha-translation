  verdict: revise
  source_fidelity: 'Основной смысл передан точно: наблюдение за смелостью Петра и Иоанна, вывод об отсутствии у них признанной специальной подготовки и последующее изумление сохранены. Однако «узнавали в них тех, кто был с Иисусом» в русском языке меняет акцент на распознавание неких третьих лиц и звучит неестественно; греческое αὐτούς относится непосредственно к Петру и Иоанну.'
  naturalness: '«Видя ... и понимая ...» и «они удивлялись» естественны для современного литературного повествования. Формулировку заключительной части следует сделать прямой: «они узнавали, что те были с Иисусом».'
