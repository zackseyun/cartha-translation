  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Θεωροῦντες δὲ τὴν τοῦ Πέτρου παρρησίαν καὶ Ἰωάννου καὶ καταλαβόμενοι ὅτι ἄνθρωποι ἀγράμματοί εἰσιν καὶ ἰδιῶται, ἐθαύμαζον, ἐπεγίνωσκόν τε αὐτοὺς ὅτι σὺν τῷ Ἰησοῦ ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/013.yaml
  text: As they observed the boldness of Peter and John[a], and realized that they were uneducated and ordinary men, they were astonished, and they recognized that they had been with Jesus.
translation:
  language: ru
  text: Видя смелость Петра и Иоанна и понимая, что они люди неучёные и простые[a], они удивлялись и узнавали, что те были с Иисусом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не получившие книжного образования и не принадлежавшие к образованным кругам». Греческие слова указывают на отсутствие формальной учёной подготовки и признанного статуса знатоков; они не обязательно означают неграмотность или недостаток ума.'
    reason: Лексическая альтернатива поясняет, что характеристика касается образования и общественного положения Петра и Иоанна, а не их умственных способностей.
lexical_decisions:
- source_word: Θεωροῦντες
  choice: видя
  rationale: Причастие передаёт внимательное наблюдение руководителей за Петром и Иоанном; в русском контексте «видя» звучит естественно и не ослабляет оценочного характера наблюдения.
- source_word: παρρησίαν
  choice: смелость
  rationale: Слово обозначает открытую, бесстрашную речь; «смелость» естественно передаёт здесь мужественную свободу высказывания.
- source_word: καταλαβόμενοι
  choice: понимая
  rationale: Передаёт сделанный ими вывод о положении и подготовке Петра и Иоанна без излишнего усиления.
- source_word: ἀγράμματοί
  choice: неучёные
  rationale: В данном контексте речь идёт прежде всего об отсутствии формального книжного или раввинского образования, а не о неспособности читать или о недостатке ума.
- source_word: ἰδιῶται
  choice: простые
  rationale: Обозначает людей без специального учёного или официального статуса; «простые» сохраняет социальный контраст с членами совета и не звучит как оскорбление.
- source_word: ἐθαύμαζον
  choice: удивлялись
  rationale: Имперфект описывает продолжавшуюся реакцию; несовершенный вид русского глагола сохраняет этот оттенок.
- source_word: ἐπεγίνωσκόν
  choice: узнавали в них
  rationale: Передаёт распознавание или отождествление этих людей по их прежней связи с Иисусом; несовершенный вид соответствует форме греческого глагола.
- source_word: σὺν τῷ Ἰησοῦ ἦσαν
  choice: тех, кто был с Иисусом
  rationale: Естественно по-русски выражает их прежнее общение и связь с Иисусом, распознанную теперь членами совета.
theological_decisions:
- issue: Социальная и образовательная характеристика Петра и Иоанна
  choice: «люди неучёные и простые»
  alternative: «неграмотные и несведущие»; «не получившие книжного образования и миряне»
  rationale: Греческие слова противопоставляют Петра и Иоанна формально обученным и официально признанным знатокам, но не утверждают, что апостолы были неграмотны, неразумны или невежественны. Перевод сохраняет социальное напряжение, не внося уничижительного смысла.
- issue: Характер распознания связи с Иисусом
  choice: «узнавали в них тех, кто был с Иисусом»
  alternative: «поняли, что они были с Иисусом»
  rationale: Выбранная формулировка сохраняет значение распознания в ἐπεγίνωσκον, а не сводит его лишь к отвлечённому умозаключению; при этом греческий текст не уточняет, было ли это личное узнавание или вывод по их поведению.
translation_notes:
  register: Современный литературный русский язык с простым, достойным повествовательным строем. Сохранены несовершенные формы «удивлялись» и «узнавали», отражающие продолженность реакции. Начальный δὲ отдельно не передан, поскольку служит связке повествования и не требует искусственного «теперь» или «но».
