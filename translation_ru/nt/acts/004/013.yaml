    issue: Неестественное и неточное синтаксическое оформление ἐπεγίνωσκον αὐτούς ὅτι ...
    rationale: Оборот «узнавали в них тех, кто был с Иисусом» создаёт впечатление, будто в Петре и Иоанне распознавали других людей, и конструкция с единственным «кто» неудачна при двух референтах. Нужно прямо выразить, что их узнавали как людей, бывших с Иисусом.
  - severity: low
