  yaml_path: translation/nt/acts/004/019.yaml
  text: But Peter and John answered and said to them[a], “If it is right in the sight of God to listen to you rather than to God, judge for yourselves.”
translation:
  language: ru
  text: 'Но Пётр и Иоанн ответили им: «Справедливо ли перед Богом предпочитать слушать вас Богу? Судите сами.[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с передачей подразумеваемого смысла: «повиноваться вам, а не Богу». Греческий глагол буквально означает «слушать», но в этом контексте подразумевает следование распоряжению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες εἶπον πρὸς αὐτούς
  choice: ответили им
  rationale: Причастие с личной формой глагола представляет собой обычное греческое, отчасти семитизированное выражение речи. В современном русском буквальное «ответив, сказали им» тяжеловесно, поэтому естественное «ответили им» точно передаёт функцию оборота.
- source_word: δίκαιόν
  choice: справедливо
  rationale: Вопрос касается того, что нравственно и юридически правильно перед Божьим судом. «Справедливо» сохраняет этот оценочный оттенок и естественно сочетается с безличной конструкцией.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: перед Богом
  rationale: Оборот обозначает оценку в Божьем присутствии и с Божьей точки зрения. «Перед Богом» кратко и естественно сохраняет этот смысл.
- source_word: ἀκούειν
  choice: слушать
  rationale: Глагол буквально значит «слышать, слушать», а в данном контексте подразумевает следование распоряжению. Основной текст сохраняет исходный образ и не заменяет его более истолковывающим «повиноваться».
- source_word: μᾶλλον ἢ
  choice: больше, чем
  rationale: Русская сравнительная конструкция сохраняет форму греческого противопоставления и его намеренно заострённую формулировку.
- source_word: κρίνατε
  choice: судите сами
  rationale: Императив означает вынести суждение; «сами» естественно передаёт прямой вызов собеседникам самостоятельно оценить очевидную дилемму.
- source_word: ὁ δὲ Πέτρος καὶ Ἰωάννης
  choice: Но Пётр и Иоанн
  rationale: δέ отмечает противопоставление ответной реакции апостолов данному им приказу; «но» естественно выражает этот поворот.
theological_decisions:
- issue: Следует ли передать ἀκούειν истолковывающим глаголом «повиноваться» в противопоставлении человеческой власти и Бога
  choice: Сохранить в основном тексте «слушать вас больше, чем Бога»
  alternative: «повиноваться вам, а не Богу»
  rationale: Контекст несомненно затрагивает повиновение, однако греческий текст использует глагол «слушать», а не однозначный глагол повиновения. Выбранный вариант сохраняет лексику источника и заложенное в ней напряжение, а примечание поясняет прагматический смысл.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Устранён неестественный для русского плеоназм «ответив, сказали», при этом сохранены судебно-нравственный оттенок вопроса и буквальный образ слушания. Форма «Пётр» соответствует нормативному русскому библейскому имени.
