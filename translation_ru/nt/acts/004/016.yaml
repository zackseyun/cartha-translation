source:
  edition: SBLGNT
  text: λέγοντες· Τί ⸀ποιήσωμεν τοῖς ἀνθρώποις τούτοις; ὅτι μὲν γὰρ γνωστὸν σημεῖον γέγονεν δι’ αὐτῶν πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν, καὶ οὐ δυνάμεθα ⸀ἀρνεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/016.yaml
  text: saying[a], “What should we do with these men? For indeed, a notable sign has happened through them, evident to all who live in Jerusalem, and we cannot deny it.”
translation:
  language: ru
  text: 'говоря: «Что нам делать с этими людьми? Ведь всем жителям Иерусалима ясно, что через них совершилось известное знамение[a], и мы не можем этого отрицать».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «общеизвестное знамение». Греческое γνωστόν означает «известное, хорошо известное»; здесь речь идёт о знамении, факт которого получил публичное признание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: говоря
  rationale: Причастие настоящего времени вводит содержание речи совета и сохраняет синтаксическую связь с предшествующим контекстом.
- source_word: Τί ποιήσωμεν τοῖς ἀνθρώποις τούτοις
  choice: Что нам делать с этими людьми?
  rationale: Делиберативный аорист конъюнктива естественно передаётся современным русским вопросом «что нам делать»; оборот с «с» идиоматично выражает значение дательного при ποιέω.
- source_word: ὅτι μὲν γὰρ
  choice: Ведь
  rationale: Передаёт объяснительную и подчёркивающую функцию сочетания без тяжеловесности.
- source_word: γνωστὸν σημεῖον
  choice: известное знамение
  rationale: «Известное» сохраняет основное значение γνωστός и в данном контексте указывает на публично признанный характер события; «знамение» сохраняет богословскую ёмкость σημεῖον.
- source_word: γέγονεν
  choice: совершилось
  rationale: Русский совершенный вид передаёт состоявшееся событие с сохраняющимся результатом; глагол естественно сочетается со словом «знамение».
- source_word: δι’ αὐτῶν
  choice: через них
  rationale: Сохраняет инструментальное или посредническое значение διά с родительным падежом, не приписывая Петру и Иоанну независимой силы.
- source_word: πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν
  choice: всем жителям Иерусалима ясно
  rationale: Естественный русский порядок слов ясно передаёт публичную очевидность знамения для всех жителей города.
- source_word: οὐ δυνάμεθα ἀρνεῖσθαι
  choice: мы не можем этого отрицать
  rationale: Местоимение «этого» восполняет подразумеваемый в греческом объект и относится к факту совершившегося знамения.
theological_decisions:
- issue: Значение σημεῖον в контексте публичного исцеления
  choice: знамение
  alternative: чудо
  rationale: «Знамение» сохраняет лукианское обозначение события как действия, указывающего за пределы самого необычайного происшествия; перевод «чудо» сузил бы этот оттенок.
- issue: Посредничество в выражении δι’ αὐτῶν
  choice: через них
  alternative: ими
  rationale: Формулировка сохраняет открытую в греческом тексте инструментальность и не превращает апостолов в самостоятельный источник силы.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Синтаксис сделан естественным для устного обсуждения совета; термин «знамение» сохранён ради смысловой и богословской точности.
