id: ACT.4.12
reference: Acts 4:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν ἐν ἄλλῳ οὐδενὶ ἡ σωτηρία, ⸀οὐδὲ γὰρ ὄνομά ἐστιν ἕτερον ⸂ὑπὸ τὸν οὐρανὸν⸃ τὸ δεδομένον ἐν ἀνθρώποις ἐν ᾧ δεῖ σωθῆναι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/012.yaml
  text: And there is salvation in no one else[a], for there is no other name under heaven given among men by which we must be saved.
translation:
  language: ru
  text: И нет спасения ни в ком другом, потому что нет под небом другого имени, данного среди людей[a], которым надлежит нам спастись.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «данного людям». Греческое выражение относится здесь ко всему человечеству.'
    reason: Лексико-синтаксическая альтернатива для ἐν ἀνθρώποις; основное чтение точнее передаёт значение предлога ἐν, а альтернатива сохраняет естественный русский способ выразить дарование имени людям.
lexical_decisions:
- source_word: σωτηρία
  choice: спасение
  rationale: Передаёт как избавление, так и богословскую полноту слова в контексте провозглашения исключительной спасительной роли Иисуса.
- source_word: ἐν ἄλλῳ οὐδενί
  choice: ни в ком другом
  rationale: Сохраняет личный характер и категоричность греческого выражения, не сводя его к отвлечённому «нет иного пути».
- source_word: ὄνομα
  choice: имя
  rationale: 'Сохраняет библейскую многозначность: имя может подразумевать личность, власть и явленную идентичность, но перевод не раскрывает это толкованием.'
- source_word: ἕτερον
  choice: другого
  rationale: В отрицательной конструкции естественно передаёт отсутствие какого-либо иного имени.
- source_word: ὑπὸ τὸν οὐρανόν
  choice: под небом
  rationale: Сохраняет библейский образ и всемирный охват выражения без его упрощения до «в мире».
- source_word: δεδομένον ἐν ἀνθρώποις
  choice: данного людям
  rationale: Естественно по-русски выражает дарование имени в человеческой среде; «людям» ясно передаёт родовое, всеохватное значение ἀνθρώποις.
- source_word: ἐν ᾧ
  choice: которым
  rationale: Относится к слову «имя» и естественно выражает средство спасения, сохраняя связь с библейским понятием имени.
- source_word: δεῖ
  choice: надлежит
  rationale: Передаёт необходимость, включая контекстуальный оттенок установленной Богом необходимости, в достойном современном регистре.
- source_word: σωθῆναι
  choice: спастись
  rationale: Естественная русская форма пассивно-возвратного значения; согласуется с существительным «спасение» в первой части стиха.
theological_decisions:
- issue: Исключительность спасения в Иисусе
  choice: «ни в ком другом нет спасения»
  alternative: «нет иного пути спасения»
  rationale: Греческий текст прямо говорит о том, что спасение не находится ни в ком другом; перевод сохраняет личную и безоговорочную формулировку, не добавляя доктринального пояснения.
- issue: Значение ἀνθρώποις
  choice: «людям» в основном тексте
  alternative: «среди людей»
  rationale: Слово обозначает человечество в целом. Русское «людям» гендерно всеохватно и естественно, а примечание сохраняет возможное понимание предлога ἐν как «среди».
- issue: Связь «имени» со средством спасения
  choice: «имени… которым надлежит нам спастись»
  alternative: «имени… в котором надлежит нам спастись»
  rationale: Творительный падеж естественно выражает средство и не заменяет «имя» толкованием вроде «личность» или «власть».
translation_notes:
  register: Современный литературный русский с торжественным библейским звучанием. «Надлежит» выбрано как понятное и достойное соответствие δεῖ; синтаксис сохраняет параллелизм и категоричность оригинала.
