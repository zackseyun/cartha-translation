  terminology: «Спасение», «имя», «под небом» и «надлежит» удачно сохраняют лексику и регистр оригинала, не внося конфессионального толкования. «Людей» в значении человечества гендерно всеохватно. Примечание следует направить на различие предлоговой конструкции, а не на неопределённое «греческое слово».
