  source_fidelity: 'Основная смысловая линия передана точно: προσωπная исключительность («ни в ком другом»), спасение, «имя», вселенский охват «под небом» и необходимость («надлежит») соответствуют греческому тексту. Однако ἐν ἀνθρώποις наиболее прямо означает «среди людей / среди человечества», тогда как «данного людям» меняет отношение на адресата дара («данного кому?»). Это допустимое истолковательное сглаживание, но менее точное, чем исходная конструкция.'
