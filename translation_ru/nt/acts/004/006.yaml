  text: (καὶ ⸂Ἅννας ὁ ἀρχιερεὺς καὶ Καϊάφας καὶ Ἰωάννης καὶ Ἀλέξανδρος⸃ καὶ ὅσοι ἦσαν ἐκ γένους ἀρχιερατικοῦ),
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/006.yaml
  text: and Annas the high priest[a], and Caiaphas, and John, and Alexander, and all who were of the high-priestly family,
translation:
  language: ru
  text: и первосвященник Анна, и Каиафа, и Иоанн, и Александр, и все из первосвященнического рода[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «происходившие из первосвященнической семьи».'
    reason: 'Лексическая альтернатива: γένος может обозначать род, родословную, семью или родственную группу.'
lexical_decisions:
- source_word: Ἅννας
  choice: Анна
  rationale: Традиционная русская форма имени библейского персонажа; сохраняет различие с женским именем Анна благодаря контексту и мужскому приложению «первосвященник».
- source_word: ὁ ἀρχιερεὺς
  choice: первосвященник
  rationale: Обычный и точный русский эквивалент титула ἀρχιερεύς; приложение прямо относится к Анне, как в греческом тексте.
- source_word: Καϊάφας
  choice: Каиафа
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: Ἰωάννης
  choice: Иоанн
  rationale: Устоявшаяся русская библейская форма греческого имени Ἰωάννης.
- source_word: Ἀλέξανδρος
  choice: Александр
  rationale: Естественная и традиционная русская передача имени.
- source_word: ὅσοι ἦσαν
  choice: все принадлежавшие
  rationale: Естественно передаёт собирательное значение «все, кто были из» в контексте перечисления.
- source_word: ἐκ γένους ἀρχιερατικοῦ
  choice: к первосвященническому роду
  rationale: γένος здесь обозначает род, семью или родственную группу, а ἀρχιερατικός — связь с первосвященством; формулировка сохраняет родовое значение и не утверждает, что каждый из них занимал должность.
theological_decisions:
- issue: Титул Анны при исторически действующем первосвященнике Каиафе
  choice: первосвященник Анна
  alternative: Анна, бывший первосвященник
  rationale: Греческий текст прямо называет Анну ὁ ἀρχιερεύς. Добавление «бывший» исторически разъясняло бы ситуацию, но вносило бы отсутствующую в тексте интерпретацию и снимало бы сохраняемое источником напряжение.
translation_notes:
  register: Современный литературный русский с традиционными русскими формами библейских имён. Повторяющийся союз «и» сохранён, поскольку он передаёт структуру греческого перечисления; пунктуация и конечная запятая учитывают, что стих является частью более длинного предложения.
