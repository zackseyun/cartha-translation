  naturalness: «Все из первосвященнического рода» — естественная краткая русская формула для перечисления и яснее сохраняет значение происхождения. Повтор союза «и» уместен как отражение структуры исходного перечня.
  terminology: «Первосвященник», «первосвященнический род», «Каиафа» и «Иоанн» соответствуют русской библейской традиции и современному литературному регистру. Мужской титул достаточно снимает возможную неоднозначность традиционной формы имени «Анна».
