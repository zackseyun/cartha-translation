lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественный временной маркер, вводящий следующее событие повествования.
- source_word: Πέτρος
  choice: Пётр
  rationale: Устоявшаяся русская форма имени апостола.
- source_word: πλησθεὶς
  choice: исполнившись
  rationale: Передаёт аористное пассивное причастие πίμπλημι естественной для русского библейского повествования формой и указывает на состояние, в котором Пётр заговорил.
- source_word: πνεύματος ἁγίου
  choice: Святого Духа
  rationale: Родительный падеж после «исполнившись» естественно воспроизводит греческую конструкцию; прописные буквы обозначают личного Божественного Духа в контексте Деяний.
- source_word: εἶπεν πρὸς αὐτούς
  choice: сказал им
  rationale: Прямая и естественная передача повествовательной формулы обращения.
- source_word: Ἄρχοντες
  choice: Правители
  rationale: Сохраняет значение лиц, наделённых официальной властью, в судебно-общественном контексте.
- source_word: τοῦ λαοῦ
  choice: народа
  rationale: Прямая передача λαός; в контексте имеется в виду народ Израиля, однако уточнение не добавляется в основной текст.
- source_word: πρεσβύτεροι
  choice: старейшины
  rationale: Обозначает признанных представителей руководства, а не просто пожилых мужчин.
theological_decisions:
- issue: Передача πνεύματος ἁγίου
  choice: Святого Духа
  alternative: святого духа
  rationale: В контексте Деяний выражение относится к личному Божественному Святому Духу, который даёт силу для свидетельства; написание с прописных букв отражает этот референт, не добавляя нового содержания.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, но понятным библейским регистром. Восклицательный знак естественно оформляет самостоятельное звательное обращение, которым открывается продолжающаяся далее речь.
