  text: πολλοὶ δὲ τῶν ἀκουσάντων τὸν λόγον ἐπίστευσαν, καὶ ἐγενήθη ⸀ὁ ἀριθμὸς τῶν ἀνδρῶν ⸀ὡς χιλιάδες πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/004.yaml
  text: But many of those who had heard the message believed[b][a], and the number of the men became about five thousand.
translation:
  language: ru
  text: Но многие из слышавших слово[a] поверили, и число мужчин[b] составило около пяти тысяч.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «весть». Здесь «слово» означает возвещённую апостолами весть.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте буквально: «число мужчин». Вероятно, речь идёт о подсчёте мужчин, а не всех присутствовавших.'
    reason: cultural_note
lexical_decisions:
- source_word: πολλοὶ δὲ
  choice: Но многие
  rationale: «Но» естественно передаёт контраст с противодействием и арестом в предыдущем контексте; «многие» сохраняет неопределённое количественное значение.
- source_word: τῶν ἀκουσάντων τὸν λόγον
  choice: из слышавших слово
  rationale: Причастная конструкция передана естественно по-русски; «слово» сохраняет обычное библейское соответствие λόγος, при этом сноска поясняет, что здесь имеется в виду апостольская весть.
- source_word: ἐπίστευσαν
  choice: поверили
  rationale: Прямой и богословски не перегруженный перевод πιστεύω, сохраняющий простоту греческого глагола.
- source_word: ἐγενήθη ὁ ἀριθμός
  choice: число … достигло
  rationale: По-русски это естественный способ выразить наступивший численный итог; он не предполагает точного механизма роста.
- source_word: τῶν ἀνδρῶν
  choice: мужчин
  rationale: ἀνήρ обычно обозначает мужчину, а не людей вообще; гендерно конкретное значение сохранено.
- source_word: ὡς χιλιάδες πέντε
  choice: примерно пяти тысяч
  rationale: ὡς перед числом выражает приблизительность; «примерно» ясно и естественно передаёт этот оттенок.
theological_decisions:
- issue: Гендерно конкретный подсчёт в τῶν ἀνδρῶν
  choice: «число мужчин»
  alternative: «число людей» или «число верующих»
  rationale: Греческий текст использует ἀνδρῶν, обычно означающее мужчин. Перевод сохраняет эту конкретность, но не делает вывода, будто женщин не было среди всей общины.
- issue: Значение λόγος в данном контексте
  choice: «слово» с пояснением в сноске
  alternative: «весть»
  rationale: «Слово» формально сохраняет лексическую форму оригинала и привычно для библейского регистра; сноска предупреждает возможное непонимание и указывает на апостольскую проповедь.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционным библейским звучанием. Синтаксис сделан ясным и естественным, при этом сохранены контраст, приблизительность числа и гендерная конкретность оригинала.
