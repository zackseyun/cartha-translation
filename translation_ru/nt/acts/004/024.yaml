  text: οἱ δὲ ἀκούσαντες ὁμοθυμαδὸν ἦραν φωνὴν πρὸς τὸν θεὸν καὶ εἶπαν· Δέσποτα, ⸀σὺ ὁ ποιήσας τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/024.yaml
  text: When they heard this[a], they lifted their voices together to God and said, “Master, you are the one who made heaven and earth and sea[b], and everything in them,”
translation:
  language: ru
  text: 'Услышав это, они единодушно возвысили голос к Богу и сказали: «Владыка[a], Ты — Тот, Кто сотворил небо, землю, море и всё, что в них,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господин». Греческое слово Δέσποτα подчёркивает полную власть и отличается от κύριος («Господь»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: услышав это
  rationale: Аористное причастие имеет временное значение; «это» естественно восполняет подразумеваемый из контекста предмет услышанного.
- source_word: ὁμοθυμαδόν
  choice: единодушно
  rationale: Передаёт согласованность и внутреннее единство общей молитвы, не сводя выражение лишь к одновременности.
- source_word: ἦραν φωνήν
  choice: возвысили голос
  rationale: Сохраняет единственное число греческого φωνή и образ единого голоса собравшихся; по-русски выражение звучит естественно и торжественно.
- source_word: πρὸς τὸν θεόν
  choice: к Богу
  rationale: В контексте молитвы обозначает направленность обращения к Богу.
- source_word: Δέσποτα
  choice: Владыка
  rationale: Передаёт обращение к обладающему высшей властью и сохраняет отличие δεσπότης от обычного κύριος («Господь»).
- source_word: σὺ ὁ ποιήσας
  choice: Ты — Тот, Кто сотворил
  rationale: Передаёт эмфатическое местоимение и определительное причастие, особо указывающие на Бога как Творца.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν
  choice: небо, землю, море
  rationale: Естественная русская форма традиционной формулы творения; повторение союзов в греческом не требуется для сохранения смысла.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: всё, что в них
  rationale: Кратко и полно охватывает всё находящееся в небе, на земле и в море.
theological_decisions:
- issue: Передача Δέσποτα как обращения к Богу
  choice: Владыка
  alternative: Господин; Владыка Господь; Господь
  rationale: «Владыка» естественно выражает абсолютную власть, не добавляет отсутствующего в греческом второго титула и не смешивает δεσπότης с κύριος.
translation_notes:
  register: Современный литературный русский с dignified молитвенным звучанием. Единственное число «голос» сохраняет образ общего, единодушного обращения. Конечная запятая оставлена, поскольку стих продолжается в следующем предложении молитвы.
