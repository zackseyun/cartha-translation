  source_fidelity: 'Текст точно передаёт греческий оригинал: временное «Услышав это» соответствует ἀκούσαντες; «единодушно» адекватно передаёт ὁμοθυμαδόν; единственное «голос» обоснованно сохраняет συλλективный образ ἦραν φωνήν. «К Богу» естественно выражает направление молитвенного обращения πρὸς τὸν θεόν. Формула творения и «всё, что в них» полны по смыслу.'
