  source_fidelity: Основной текст точно передаёт синтаксическую связь с Богом из предыдущего стиха, посредство Святого Духа, библейский оборот «устами Давида» и значение παῖς как «слуга». Неустойчивое и синтаксически затруднительное чтение «нашего отца» не выдано за бесспорный текст и сохранено в примечании. «Бушевали», «народы и племена», «замышляли тщетное» адекватно передают образный параллелизм ἐφρύαξαν / ἔθνη и ἐμελέτησαν κενά.
