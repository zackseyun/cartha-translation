  text: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃ διὰ ⸂πνεύματος ἁγίου⸃ στόματος Δαυὶδ παιδός σου εἰπών· Ἱνατί ἐφρύαξαν ἔθνη καὶ λαοὶ ἐμελέτησαν κενά;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/025.yaml
  text: 'who[a], through the Holy Spirit, by the mouth of David your servant, said: ‘Why did the nations rage[b], and the peoples devise vain things?’'
translation:
  language: ru
  text: 'который[a] через Святого Духа устами Давида, Твоего слуги, сказал: «Почему бушевали народы и племена замышляли[b] тщетное?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях введение в цитату читается так: «который через Святого Духа устами нашего отца Давида, Твоего слуги, сказал».'
    reason: textual_variant
  - marker: b
    text: 'Или: «размышляли о тщетном». Греческий глагол может означать «размышлять», а в данном контексте — «замышлять».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃
  choice: который
  rationale: Относительное местоимение естественно связывает стих с обращением к Богу в предыдущем контексте. Текстуально спорное «нашего отца» не включено в основной текст, но отражено в примечании.
- source_word: διὰ πνεύματος ἁγίου
  choice: через Святого Духа
  rationale: διά с родительным падежом обозначает посредство или действие через кого-либо; перевод сохраняет личное упоминание Святого Духа.
- source_word: στόματος Δαυὶδ
  choice: устами Давида
  rationale: Сохраняется понятная по-русски библейская формула пророческой речи через человека.
- source_word: παιδός σου
  choice: Твоего слуги
  rationale: παῖς может означать ребёнка или слугу; применительно к Давиду в формуле цитирования естественно значение «слуга».
- source_word: εἰπών
  choice: сказал
  rationale: Причастие вводит цитату и по-русски естественно передаётся личной формой глагола.
- source_word: Ἱνατί
  choice: Почему
  rationale: Прямой и естественный эквивалент вопросительного слова.
- source_word: ἐφρύαξαν
  choice: бушевали
  rationale: Глагол передаёт бурное, вызывающее сопротивление; «бушевали» сохраняет образную силу, не сводя смысл только к политическому мятежу.
- source_word: ἔθνη
  choice: народы
  rationale: В цитате из псалма речь идёт о народах вообще, а не специально о язычниках как религиозной категории.
- source_word: λαοὶ
  choice: племена
  rationale: Слово во множественном числе передано отдельно от ἔθνη, чтобы сохранить поэтический параллелизм без неестественного повтора «народы и народы».
- source_word: ἐμελέτησαν
  choice: замышляли
  rationale: В контексте враждебного противостояния глагол обозначает обдумывание или составление замысла; длительная форма «замышляли» также сохраняет оттенок мысленного занятия.
- source_word: κενά
  choice: тщетное
  rationale: Субстантивированное единственное «тщетное» передаёт пустоту и обречённость замысла и звучит естественно в поэтической цитате.
theological_decisions:
- issue: Текстуальная форма введения цитаты
  choice: В основном тексте опущено текстуально спорное выражение «нашего отца», а связь с Богом выражена словом «который».
  alternative: Включить чтение «наш отец Давид, Твой слуга» в основной текст.
  rationale: Фраза τοῦ πατρὸς ἡμῶν текстуально неустойчива и в форме SBLGNT синтаксически трудна. Примечание сохраняет вариант, не превращая спорную деталь в бесспорный основной текст.
- issue: Значение ἐμελέτησαν в цитате из Псалма 2
  choice: замышляли
  alternative: размышляли
  rationale: Враждебный контекст поддерживает значение намеренного замысла, однако примечание сохраняет более буквальный оттенок размышления и не устраняет лексическую многозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием, уместным для молитвы и цитаты из псалма. Местоимение «Твоего» написано с прописной буквы как уважительная форма обращения к Богу; синтаксис остаётся прозрачным для современного читателя.
