  yaml_path: translation/nt/acts/004/005.yaml
  text: And it happened that on the next day their rulers and elders and scribes were gathered together in Jerusalem,[a]
translation:
  language: ru
  text: На следующий день их правители, старейшины и книжники собрались[a] в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были собраны»; греческий глагол имеет страдательную форму.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: На следующий день… собрались
  rationale: Греческая повествовательная формула вводит следующее событие. В современном русском отдельное «И случилось» здесь тяжеловесно, поэтому её функция естественно передана построением всего предложения.
- source_word: ἐπὶ τὴν αὔριον
  choice: На следующий день
  rationale: Устойчивое обозначение дня, следующего за описанными ранее событиями.
- source_word: συναχθῆναι
  choice: собрались
  rationale: Естественно передаёт совместное собрание названных групп; примечание отмечает страдательную форму греческого глагола.
- source_word: αὐτῶν
  choice: их
  rationale: Сохраняет присутствующее в греческом тексте соотнесение с контекстом, не уточняя неоднозначный антецедент.
- source_word: τοὺς ἄρχοντας
  choice: правители
  rationale: Обозначает представителей властной верхушки и не сужает значение до какой-либо конкретной должности.
- source_word: τοὺς πρεσβυτέρους
  choice: старейшины
  rationale: В данном институциональном контексте речь идёт о признанных руководителях общины, а не просто о пожилых мужчинах.
- source_word: τοὺς γραμματεῖς
  choice: книжники
  rationale: Традиционный и точный русский термин для признанного сословия знатоков и толкователей Писания и закона.
- source_word: ἐν Ἰερουσαλήμ
  choice: в Иерусалиме
  rationale: Прямое и естественное обозначение места.
theological_decisions:
- issue: К кому относится αὐτῶν («их»)
  choice: Сохранить местоимение «их», не конкретизируя его референт.
  alternative: Опустить местоимение либо истолковать его как «иудейские правители».
  rationale: В греческом местоимение выражено, однако его антецедент определяется контекстом и в самом стихе прямо не назван. Перевод сохраняет эту особенность, не внося более узкого толкования.
translation_notes:
  register: Современный литературный русский язык; фраза построена естественно и сдержанно. Термины «правители», «старейшины» и «книжники» сохраняют институциональный и исторический характер перечисления.
