  source_fidelity: Перевод точно передаёт временное указание, перечисление трёх групп, место и выраженное в греческом тексте соотнесение αὐτῶν («их»). Повествовательная формула Ἐγένετο δὲ не воспроизведена отдельным русским оборотом, но её нарративная функция естественно передана началом события «На следующий день… собрались»; добавление «И случилось» в современном литературном русском было бы неоправданно тяжеловесным. «Собрались» передаёт событийный смысл пассивного συναχθῆναι без неестественного принудительного оттенка, который могло бы создать «были собраны».
