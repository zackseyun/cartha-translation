  verdict: revise
  source_fidelity: 'Смысл передан в целом точно: временно-обстоятельственный оборот ἐν τῷ, «рука», исцеление, «знамения и чудеса», посредство имени и παῖς как «Служитель» сохранены. Однако исходная синтаксическая связь в греческом ставит «знамения и чудеса» после исцеления как параллельные результаты простирания руки; русская перестановка с «через имя» допустима, но менее прозрачна.'
  naturalness: «В то время как» несколько тяжеловесно для краткой молитвенной фразы; «когда» естественнее и сохраняет одновременное обстоятельство. «Совершаются знамения и чудеса» литературно и понятно. Сноска с «Дитяти» архаична и стилистически не соответствует современному литературному русскому; «ребёнка» — современная нейтральная альтернатива.
  terminology: «Знамения и чудеса» удачно. «Святой Служитель Иисус» обоснован как передача παῖς с сохранением возможной аллюзии на Исаию; прописная буква здесь допустима в титульно-мессианском употреблении. Альтернативное значение следует сохранить в сноске без архаизации и без чрезмерно уверенного утверждения об аллюзии.
