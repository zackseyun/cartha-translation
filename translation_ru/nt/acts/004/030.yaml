  text: while you stretch out your hand for healing[a], and signs and wonders are done through the name of your holy servant Jesus.
translation:
  language: ru
  text: когда Ты простираешь Свою руку для исцеления и когда через имя Твоего святого Служителя Иисуса совершаются знамения и чудеса.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твоего святого ребёнка Иисуса». Греческое слово παῖς может означать «ребёнок» или «слуга, служитель»; в данном контексте «Служитель» предпочтительно, поскольку возможно отсылает к образу Служителя Господа у Исаии.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ ... ἐκτείνειν
  choice: в то время как Ты простираешь
  rationale: Оборот ἐν τῷ с инфинитивом выражает сопутствующее, одновременное действие. Такой перевод естественно передаёт продолжение молитвы и сохраняет временно-обстоятельственный смысл.
- source_word: τὴν χεῖρά σου
  choice: Свою руку
  rationale: Сохраняет библейский образ Божьей руки как выражение Его действия и силы; возвратное местоимение естественно для русского синтаксиса.
- source_word: εἰς ἴασιν
  choice: для исцеления
  rationale: Передаёт значение цели конструкции εἰς с винительным падежом и существительное ἴασις без лишнего уточнения.
- source_word: σημεῖα καὶ τέρατα
  choice: знамения и чудеса
  rationale: Устойчивое и понятное библейское сочетание, точно отражающее оба греческих существительных без добавления слова «чудесные».
- source_word: γίνεσθαι
  choice: совершаются
  rationale: В сочетании со знамениями и чудесами современное русское «совершаются» звучит естественно и передаёт их осуществление, не называя отдельного человеческого исполнителя.
- source_word: διὰ τοῦ ὀνόματος
  choice: через имя
  rationale: Буквально и естественно передаёт διά с родительным падежом, сохраняя присущую выражению смысловую ёмкость — посредство, действенность и власть имени — без поясняющей вставки.
- source_word: τοῦ ἁγίου παιδός σου Ἰησοῦ
  choice: Твоего святого Служителя Иисуса
  rationale: παῖς допускает значения «слуга/служитель» и «дитя». В Деяниях 3–4 контекст и отзвук образа Служителя из Исаии поддерживают значение «Служитель»; прописная буква подчёркивает титульно-мессианское употребление, не внося отдельного догматического утверждения.
theological_decisions:
- issue: Передача παῖς применительно к Иисусу
  choice: Служитель
  alternative: Дитя
  rationale: В данном контексте «Служитель» лучше сохраняет вероятную связь с образом Служителя Господа у Исаии и параллельным употреблением в Деян. 3:13, 26. Поскольку лексически возможно и значение «дитя», оно указано в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимения, обращённые к Богу, и мессиански-титульное «Служитель» написаны с прописной буквы. Порядок частей слегка перестроен ради ясной связи оборота «через имя» со знамениями и чудесами.
