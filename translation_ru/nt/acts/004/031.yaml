  text: καὶ δεηθέντων αὐτῶν ἐσαλεύθη ὁ τόπος ἐν ᾧ ἦσαν συνηγμένοι, καὶ ἐπλήσθησαν ἅπαντες ⸂τοῦ ἁγίου πνεύματος⸃, καὶ ἐλάλουν τὸν λόγον τοῦ θεοῦ μετὰ παρρησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/031.yaml
  text: And when they had prayed[a], the place in which they were gathered was shaken[b], and they were all filled with the Holy Spirit and were speaking the word of God with boldness.
translation:
  language: ru
  text: После того как они помолились, место, где они собрались[a], сотряслось. Все они исполнились Святого Духа и говорили слово Божье со смелостью[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «где они были собраны»; греческая конструкция подчёркивает, что они находились там вместе, собравшись.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «уверенно», «открыто», «бесстрашно». Греческое слово обозначает свободную, прямую речь без страха.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεηθέντων αὐτῶν
  choice: после того как они помолились
  rationale: Генитив абсолютный с аористным причастием задаёт предшествующий временной фон. Такая формулировка естественна по-русски и передаёт совместную молитву без тяжеловесного «вознесли моление».
- source_word: ἐσαλεύθη
  choice: сотряслось
  rationale: Аорист пассивного залога обозначает физическое сотрясение места. «Сотряслось» ясно и естественно передаёт силу σαλεύω.
- source_word: ὁ τόπος
  choice: место
  rationale: Речь идёт о физическом месте собрания; простое «место» точно и естественно.
- source_word: ἐν ᾧ ἦσαν συνηγμένοι
  choice: где они собрались
  rationale: Относительное придаточное определяет место. Основной текст звучит естественно, а сноска сохраняет оттенок состояния, выраженный сочетанием ἦσαν с перфектным причастием.
- source_word: ἐπλήσθησαν ἅπαντες
  choice: все они исполнились
  rationale: «Исполнились» сохраняет смысл наполнения и традиционную для русского библейского языка формулу, оставаясь понятным современному читателю; «все они» передаёт усиленное ἅπαντες.
- source_word: τοῦ ἁγίου πνεύματος
  choice: Святого Духа
  rationale: Генитив после πίμπλημι естественно передаётся русским родительным падежом при «исполнились»; заглавные буквы отражают личный божественный референт в контексте.
- source_word: ἐλάλουν
  choice: говорили
  rationale: Русский глагол несовершенного вида передаёт длительный характер греческого имперфекта, не добавляя прямо не выраженного значения начала действия.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: слово Божье
  rationale: Это естественная современная форма устойчивого библейского выражения, обозначающего возвещаемую Божью весть, без сведения λόγος только к абстрактному «сообщению».
- source_word: μετὰ παρρησίας
  choice: со смелостью
  rationale: В данном контексте παρρησία означает открытую, бесстрашную речь. «Со смелостью» понятно современному читателю и не несёт архаического оттенка слова «дерзновение».
theological_decisions:
- issue: Передача исполнения Святым Духом
  choice: все они исполнились Святого Духа
  alternative: все они были наполнены Святым Духом
  rationale: Выбранная формулировка сохраняет характерную для Луки речь об исполнении Духом и не уточняет сверх текста ни механизм действия, ни принадлежность события к какой-либо конфессиональной схеме.
- issue: Вид глагола ἐλάλουν
  choice: говорили
  alternative: стали говорить
  rationale: Несовершенный вид передаёт продолжающееся возвещение; вариант «стали говорить» вносил бы начинательный оттенок, которого форма сама по себе не требует.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис разделён на два предложения ради ясности; при этом последовательность событий и повторяющийся союзный ход оригинала сохранены по смыслу. Формы «исполнились Святого Духа» и «слово Божье» поддерживают достоинство и узнаваемость библейского регистра без излишней архаизации.
