    reason: alternative_reading
lexical_decisions:
- source_word: διαπονούμενοι
  choice: негодуя
  rationale: Причастие передаёт сильное раздражение и недовольство властей; «негодуя» естественно и выразительно, не ослабляя и не преувеличивая эмоцию.
- source_word: διὰ τὸ διδάσκειν αὐτοὺς
  choice: на то, что они учат
  rationale: διά с субстантивированным инфинитивом выражает причину; личная конструкция по-русски естественна и сохраняет местоименную отсылку к ранее названным Петру и Иоанну.
- source_word: τὸν λαὸν
  choice: народ
  rationale: λαός обозначает народ как совокупность людей, а не просто случайную толпу.
- source_word: καταγγέλλειν
  choice: возвещают
  rationale: Глагол означает публично провозглашать; «возвещают» соответствует достоинству и публичному характеру речи.
- source_word: ἐν τῷ Ἰησοῦ
  choice: в Иисусе
  rationale: 'Прямой перевод сохраняет неоднозначность греческого оборота: воскресение может мыслиться как явленное на Иисусе, сосредоточенное в нём или осуществляемое через него.'
- source_word: ἀνάστασιν τὴν ἐκ νεκρῶν
  choice: воскресение из мёртвых
  rationale: Формулировка точно передаёт восстание из числа умерших и звучит естественно в современном литературном русском языке.
theological_decisions:
- issue: Значение ἐν τῷ Ἰησοῦ при возвещении воскресения
  choice: Сохранено буквальное «в Иисусе», указывающее на воскресение как явленное или сосредоточенное в Иисусе.
  alternative: «на примере Иисуса» или «через Иисуса»
  rationale: Предлог ἐν допускает близкие, но не тождественные оттенки. Основной текст не устраняет эту смысловую открытость, а примечание поясняет важнейшую альтернативу.
- issue: Объём выражения «воскресение из мёртвых»
  choice: Фраза оставлена достаточно широкой, чтобы охватывать воскресение Иисуса и общую надежду воскресения, подтверждённую в нём.
  alternative: Ограничить смысл исключительно воскресением самого Иисуса либо исключительно будущим всеобщим воскресением.
  rationale: Греческая формулировка в данном контексте способна вызывать обе взаимосвязанные идеи, поэтому перевод не сужает её неоправданно.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным регистром. «Негодуя» передаёт сильное раздражение без разговорного оттенка; синтаксис продолжает зависимую причастную конструкцию предыдущего стиха.
