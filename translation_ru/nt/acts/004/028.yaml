lexical_decisions:
- source_word: ποιῆσαι
  choice: чтобы совершить
  rationale: Аористный инфинитив продолжает конструкцию предыдущего стиха и выражает цель или результат. «Совершить» естественно передаёт осуществление действий, не добавляя значения сверх контекста.
- source_word: ὅσα
  choice: всё, чему
  rationale: Средний род множественного числа имеет широкий, совокупный охват. Такая конструкция передаёт значение «всё то, что» и позволяет сохранить связь с инфинитивом γενέσθαι.
- source_word: χείρ
  choice: рука
  rationale: Сохранён конкретный библейский образ руки как обозначения силы и действия Бога; замена на «сила» устранила бы исходную метафору.
- source_word: βουλή
  choice: замысел
  rationale: βούλη обозначает обдуманное намерение или решение. «Замысел» звучит естественно и достойно, сохраняя целенаправленность без узкоконфессиональной окраски.
- source_word: προώρισεν
  choice: предопределили
  rationale: Глагол προορίζω означает определить заранее. Русское «предопределили» сохраняет временную предшественность и сильный смысл исходного глагола; множественное число согласовано с однородными подлежащими «рука» и «замысел» по нормам современного русского языка.
- source_word: γενέσθαι
  choice: произойти
  rationale: В данном контексте γίνομαι относится к осуществлению событий. «Произойти» передаёт событийное значение естественнее, чем буквальное «быть».
theological_decisions:
- issue: Передача προώρισεν в контексте Божьего владычества и человеческой ответственности
  choice: предопределили
  alternative: заранее определили; заранее решили
  rationale: Исходный глагол прямо указывает на предварительное определение. Основной текст сохраняет эту сильную формулировку, но не делает выводов о более широкой богословской системе и не снимает напряжения между Божьим замыслом и ответственностью действующих лиц. Менее терминологические соответствия приведены в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением библейского образа «Твоя рука». Синтаксис намеренно несколько торжественный, но понятный; формулировка не разрешает богословское напряжение, присутствующее в исходном тексте.
