  text: чтобы совершить всё, что Твоя рука и Твой замысел предопределили произойти[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заранее определили»; или: «заранее решили». Греческий глагол указывает на предварительное определение.'
