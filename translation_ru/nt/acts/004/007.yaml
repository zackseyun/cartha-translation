base_translation:
  language: en
  yaml_path: translation/nt/acts/004/007.yaml
  text: And after setting them in the midst[a], they began asking, “By what power or in what name did you do this?”
translation:
  language: ru
  text: 'Поставив их посреди, они стали спрашивать: «Какой силой или чьим именем вы это сделали?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они спрашивали» или «они расспрашивали». Греческий имперфект может подчёркивать продолжавшийся расспрос, а не его начало.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσαντες
  choice: Поставив
  rationale: Аористное причастие обозначает действие, предшествующее расспросу; деепричастие естественно и точно передаёт эту последовательность.
- source_word: ἐν τῷ μέσῳ
  choice: посреди
  rationale: Сохраняет пространственный смысл выражения и не добавляет толкование «перед собой».
- source_word: ἐπυνθάνοντο
  choice: стали спрашивать
  rationale: Имперфект допускает инхоативное понимание — начало продолжавшегося расспроса; возможная альтернатива отмечена в сноске.
- source_word: Ἐν ποίᾳ δυνάμει
  choice: Какой силой
  rationale: Творительный падеж естественно передаёт инструментальное значение ἐν, а «сила» непосредственно соответствует δύναμις, не подменяя её понятием власти.
- source_word: ἢ ἐν ποίῳ ὀνόματι
  choice: или чьим именем
  rationale: Вопросительное ποίῳ буквально означает «каким», однако в русском применительно к имени естественно спросить «чьим именем»; сохраняется библейская идея действия от имени некоторого лица.
- source_word: ἐποιήσατε τοῦτο
  choice: вы это сделали
  rationale: Простое прошедшее время точно передаёт аорист и сохраняет широкий референт местоимения «это», не поясняя его внутри текста.
- source_word: ὑμεῖς
  choice: вы
  rationale: Явное местоимение сохранено и благодаря порядку слов получает естественное смысловое ударение в вопросе.
theological_decisions:
- issue: Передавать ли δύναμις как «сила» или истолковывать как «власть»
  choice: сила
  alternative: власть
  rationale: δύναμις обычно означает силу или могущество, тогда как следующий оборот об имени уже выражает представительство и полномочие. «Сила» сохраняет различие между двумя частями вопроса.
- issue: Передавать ли ἐν ποίῳ ὀνόματι буквально как «каким именем»
  choice: чьим именем
  alternative: каким именем
  rationale: Русское «чьим именем» естественно выражает действие по поручению или с призыванием имени, не уточняя, какой именно оттенок подразумевается; буквальное «каким именем» здесь звучит неестественно.
translation_notes:
  register: Современный литературный русский язык, сдержанный и понятный. Судебно-допросная обстановка передана без добавочного пояснения; порядок слов сохраняет акцент на «вы».
