revisions:
- from: Ведь человеку, над которым произошло это знамение исцеления, было больше сорока лет.[a]
  to: Ибо человеку, с которым произошло это знамение исцеления, было больше сорока лет.[a]
  rationale: Заменён только неидиоматичный предлог в передаче ἐφ’ ὃν. «С которым произошло» сохраняет событийную формулировку γεγόνει и не вводит явно совершившего действие деятеля. «Ибо» ясно выражает пояснительную связь γάρ в литературном библейском регистре.
