    rationale: В русском «произойти над кем-либо» обычно не употребляется о событии, затрагивающем человека; оборот звучит пространственно и может быть неверно понят. «С которым произошло» естественно выражает отношение события к этому человеку и не усиливает вопрос о деятеле.
