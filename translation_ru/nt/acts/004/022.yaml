source:
  edition: SBLGNT
  text: ἐτῶν γὰρ ἦν πλειόνων τεσσεράκοντα ὁ ἄνθρωπος ἐφ’ ὃν ⸀γεγόνει τὸ σημεῖον τοῦτο τῆς ἰάσεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/022.yaml
  text: For the man on whom this sign of healing had happened was more than forty years old[a].
translation:
  language: ru
  text: Ибо человеку, с которым произошло это знамение исцеления, было больше сорока лет.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это исцеляющее знамение»; или: «это чудо исцеления».'
    reason: Лексико-синтаксическая связь σημεῖον τῆς ἰάσεως допускает как буквальное «знамение исцеления», так и более пояснительные варианты.
lexical_decisions:
- source_word: ἐτῶν ... πλειόνων τεσσεράκοντα
  choice: было больше сорока лет
  rationale: Генитивная конструкция с πλειόνων и τεσσεράκοντα идиоматически обозначает возраст; выбран естественный современный русский оборот.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит пояснение и обоснование предыдущего утверждения; «ведь» естественно передаёт эту связь по-русски.
- source_word: ὁ ἄνθρωπος
  choice: человеку
  rationale: Речь идёт о конкретном мужчине, уже известном из контекста; русское «человеку» здесь естественно и точно.
- source_word: ἐφ’ ὃν
  choice: над которым
  rationale: ἐπί с винительным указывает на человека, в отношении которого совершилось событие; «над которым произошло» сохраняет направленность конструкции и звучит литературно.
- source_word: γεγόνει
  choice: произошло
  rationale: Плюсквамперфект γίνομαι обозначает уже совершившееся событие. «Произошло» сохраняет событийную формулировку и не добавляет явно не названного деятеля.
- source_word: τὸ σημεῖον τοῦτο
  choice: это знамение
  rationale: «Знамение» сохраняет смысл σημεῖον как значимого свидетельствующего действия, не сводя его лишь к чуду.
- source_word: τῆς ἰάσεως
  choice: исцеления
  rationale: ἴασις означает исцеление или излечение; родительный падеж точно воспроизводит греческую связь существительных.
theological_decisions:
- issue: Передача σημεῖον в контексте чудесного исцеления
  choice: знамение
  alternative: чудо
  rationale: «Знамение» сохраняет у Луки свидетельствующий и откровенный характер события, тогда как «чудо» прежде всего подчёркивает его сверхъестественность.
- issue: Залог и подразумеваемый деятель в γεγόνει
  choice: произошло
  alternative: было совершено
  rationale: В греческом стоит γίνομαι, а не явная пассивная форма глагола «совершать». Выбор не вводит более определённого указания на деятеля, чем даёт сам стих.
translation_notes:
  register: Современный литературный русский язык с dignified библейским регистром. Порядок слов немного перестроен ради естественности; причинно-пояснительная связь γὰρ сохранена частицей «ведь».
