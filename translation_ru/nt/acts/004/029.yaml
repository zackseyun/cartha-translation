  text: καὶ τὰ νῦν, κύριε, ἔπιδε ἐπὶ τὰς ἀπειλὰς αὐτῶν καὶ δὸς τοῖς δούλοις σου μετὰ παρρησίας πάσης λαλεῖν τὸν λόγον σου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/029.yaml
  text: And now[a], Lord, look upon their threats and grant your servants to speak your word with all boldness,
translation:
  language: ru
  text: И ныне, Господи, обрати взор на их угрозы и дай твоим рабам[a] со всей смелостью говорить твоё слово.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слугам» или «служителям». Греческое слово δοῦλος обозначает человека, принадлежащего господину и находящегося у него в подчинении; здесь оно выражает смиренное служение Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τὰ νῦν
  choice: И ныне
  rationale: Сохраняет переход от обращения к Писанию и описания событий к непосредственной просьбе; выражение естественно для молитвенной речи и не архаично.
- source_word: κύριε
  choice: Господи
  rationale: Звательная форма естественна в русском обращении к Богу и соответствует новозаветному молитвенному употреблению κύριος.
- source_word: ἔπιδε ἐπὶ
  choice: обрати взор на
  rationale: Передаёт просьбу обратить внимание на угрозы, сохраняя зрительный образ греческого глагола; выражение звучит достойно и понятно современному читателю.
- source_word: τὰς ἀπειλὰς αὐτῶν
  choice: их угрозы
  rationale: Прямо и ясно передаёт множественное число и принадлежность угроз противникам.
- source_word: δὸς
  choice: дай
  rationale: Сохраняет прямое значение и повелительную форму греческого глагола; в русской молитве «дай» звучит естественно и не снижает регистра.
- source_word: τοῖς δούλοις σου
  choice: твоим рабам
  rationale: «Рабы» прямо передаёт принадлежность господину и полное подчинение, заключённые в δοῦλος. В русском библейском контексте это понятное обозначение смиренного служения Богу, тогда как «слуги» может слишком сближать образ с наёмной или домашней службой.
- source_word: μετὰ παρρησίας πάσης
  choice: со всей смелостью
  rationale: Передаёт бесстрашную, открытую речь и сохраняет усиление πάσης.
- source_word: λαλεῖν τὸν λόγον σου
  choice: говорить твоё слово
  rationale: Сохраняет обычное значение λαλεῖν и библейски значимое «слово», не усиливая глагол до более интерпретирующего «провозглашать».
theological_decisions:
- issue: Передача δοῦλος применительно к молящимся верующим
  choice: твоим рабам
  alternative: твоим слугам / твоим служителям
  rationale: Выбрано более прямое соответствие, сохраняющее идею принадлежности Богу и подчинения Ему. Сноска указывает более мягкие контекстуальные варианты, не устраняя заложенную в греческом слове напряжённость.
translation_notes:
  register: Современный литературный русский язык с достойным молитвенным звучанием. Избегаются архаизмы вроде «воззри» и чрезмерно церковнославянский синтаксис. Местоимения, относящиеся к Богу, даны со строчной буквы в соответствии с обычной современной издательской нормой; «Господи» пишется с прописной как форма именования в прямом обращении.
