  yaml_path: translation/nt/acts/004/033.yaml
  text: And with great power the apostles were giving their testimony about the resurrection of the Lord Jesus[a], and great favor was upon them all.
translation:
  language: ru
  text: И с великой силой апостолы свидетельствовали о воскресении Господа Иисуса, и великая благодать[a] была на всех них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великое благоволение было ко всем ним». Греческое χάρις может означать как «благодать», так и «благоволение»; в данном контексте оно может указывать на милостивое присутствие Бога, на доброе отношение к верующим или сохранять оба оттенка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμει μεγάλῃ
  choice: с великой силой
  rationale: Творительный передаёт дательный образа действия или средства; «сила» естественна для δύναμις у Луки и не сводит смысл исключительно к чудесам.
- source_word: ἀπεδίδουν τὸ μαρτύριον
  choice: свидетельствовали
  rationale: Естественный русский эквивалент сочетания «давали свидетельство»; несовершенный вид передаёт продолженное или повторявшееся действие имперфекта.
- source_word: τῆς ἀναστάσεως
  choice: о воскресении
  rationale: Родительный указывает на содержание свидетельства; предложная конструкция ясна и естественна по-русски.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Господа Иисуса
  rationale: Сохраняет титул κύριος и однозначно связывает воскресение с Иисусом.
- source_word: χάρις μεγάλη
  choice: великая благодать
  rationale: «Благодать» сохраняет широкий и богословски насыщенный диапазон χάρις; возможное значение благоволения отмечено в сноске.
- source_word: ἐπὶ πάντας αὐτούς
  choice: на всех них
  rationale: Сохраняет пространственный образ того, что пребывало на всей общине, и подчёркивает всеобщность.
theological_decisions:
- issue: Значение χάρις и источник благодати или благоволения
  choice: великая благодать была на всех них
  alternative: великое благоволение было ко всем ним
  rationale: Греческий текст не называет источник χάρις. Основной вариант сохраняет привычное библейское значение «благодать», а сноска удерживает возможность благоволения к общине, не ограничивая его явно ни Богом, ни людьми.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сжатое «свидетельствовали» предпочтено буквальному, но тяжеловесному «давали свидетельство». Маркер сноски поставлен после всего утверждения о χάρις, к которому относится примечание.
