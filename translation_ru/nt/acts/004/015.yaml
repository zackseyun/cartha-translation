lexical_decisions:
- source_word: κελεύσαντες
  choice: приказав
  rationale: Аористное причастие обозначает действие, предшествующее основному; «приказав» естественно передаёт властное распоряжение.
- source_word: δὲ
  choice: Но
  rationale: Частица обозначает мягкий контраст и переход от открытого разбирательства к закрытому обсуждению.
- source_word: ἔξω τοῦ συνεδρίου
  choice: выйти из зала совета
  rationale: В контексте речь идёт об удалении Петра и Иоанна из присутствия собравшегося правящего совета; добавление «зала» ясно передаёт пространственный смысл ἔξω, не создавая впечатления выхода из состава совета.
- source_word: ἀπελθεῖν
  choice: выйти
  rationale: Инфинитив дополняет κελεύσαντες и вместе с ἔξω естественно передаётся русским «выйти».
- source_word: συνέβαλλον
  choice: стали совещаться
  rationale: Имперфект описывает начавшееся и продолжавшееся обсуждение; в данном контексте глагол означает совместно обсуждать или обдумывать вопрос.
- source_word: πρὸς ἀλλήλους
  choice: друг с другом
  rationale: Естественное русское выражение взаимного обсуждения, сохраняющее реципрокность греческой конструкции.
