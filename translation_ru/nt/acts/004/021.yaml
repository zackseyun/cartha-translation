  text: οἱ δὲ προσαπειλησάμενοι ἀπέλυσαν αὐτούς, μηδὲν εὑρίσκοντες τὸ πῶς ⸀κολάσωνται αὐτούς, διὰ τὸν λαόν, ὅτι πάντες ἐδόξαζον τὸν θεὸν ἐπὶ τῷ γεγονότι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/021.yaml
  text: So after further threatening them[a], they released them, finding no way to punish them because of the people, since everyone was glorifying God for what had happened.
translation:
  language: ru
  text: Тогда они, ещё раз пригрозив им[a], отпустили их, так и не найдя, как их наказать, — из-за народа, потому что все прославляли Бога за случившееся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пригрозив им ещё сильнее»; греческое слово может указывать на новые либо усиленные угрозы в дополнение к уже высказанным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαπειλησάμενοι
  choice: ещё раз пригрозив им
  rationale: 'Приставка προσ- передаёт добавочное или повторное действие: власти присоединили новые угрозы к уже высказанным. Формулировка естественна по-русски и сохраняет связь с предшествующим контекстом.'
- source_word: ἀπέλυσαν
  choice: отпустили их
  rationale: В данном контексте ἀπολύω означает освободить задержанных, позволив им уйти; «отпустили» естественно для повествования о действиях властей.
- source_word: μηδὲν εὑρίσκοντες τὸ πῶς κολάσωνται αὐτούς
  choice: так и не найдя, как их наказать
  rationale: Оборот буквально указывает, что власти не нашли, каким образом могли бы подвергнуть их наказанию. «Так и не найдя» естественно передаёт безрезультатность поисков, не добавляя отсутствующего в тексте юридического основания.
- source_word: διὰ τὸν λαόν
  choice: из-за народа
  rationale: 'διά с винительным падежом выражает причину: реакция народа не позволяла властям наказать апостолов. «Народ» шире, чем «толпа», и соответствует λαός.'
- source_word: πάντες
  choice: все
  rationale: Сохраняет обобщающий смысл πάντες и естественно отсылает к людям, упомянутым в контексте.
- source_word: ἐδόξαζον τὸν θεόν
  choice: прославляли Бога
  rationale: «Прославляли» сохраняет характерный для Луки богословский язык δοξάζω; несовершенный вид передаёт продолжавшееся действие имперфекта.
- source_word: ἐπὶ τῷ γεγονότι
  choice: за случившееся
  rationale: Оборот обозначает основание прославления Бога — совершившееся событие. «За случившееся» кратко и естественно сохраняет этот смысл.
