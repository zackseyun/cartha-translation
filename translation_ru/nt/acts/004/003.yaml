source:
  edition: SBLGNT
  text: καὶ ἐπέβαλον αὐτοῖς τὰς χεῖρας καὶ ἔθεντο εἰς τήρησιν εἰς τὴν αὔριον, ἦν γὰρ ἑσπέρα ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/003.yaml
  text: And they laid hands on them and put them in custody until the next day[b][a], for it was already evening.
translation:
  language: ru
  text: Они схватили их[a] и заключили под стражу до следующего дня[b], потому что уже наступил вечер.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наложили на них руки»; здесь этот греческий оборот означает враждебный захват или задержание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поместили под охрану». Греческий текст говорит о содержании под стражей, не уточняя, где именно их держали.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον αὐτοῖς τὰς χεῖρας
  choice: схватили их
  rationale: Греческий оборот буквально означает «наложили на них руки», но в данном враждебном контексте выражает насильственное задержание. «Схватили» естественно и точно передаёт смысл, не создавая возможной в русском языке ассоциации с обрядовым возложением рук.
- source_word: ἔθεντο εἰς τήρησιν
  choice: заключили под стражу
  rationale: τήρησις обозначает содержание под охраной или стражей, не уточняя конкретного места заключения. Такой перевод передаёт официальное задержание, не добавляя отсутствующей в тексте тюрьмы.
- source_word: εἰς τὴν αὔριον
  choice: до следующего дня
  rationale: Фраза имеет временное значение; этот вариант естественен для повествования и точно передаёт отсрочку до следующего дня.
- source_word: ἦν γὰρ ἑσπέρα ἤδη
  choice: потому что уже наступил вечер
  rationale: γάρ вводит объяснение отсрочки, а ἑσπέρα прямо указывает на вечер. «Наступил вечер» звучит естественно по-русски и не заменяет время суток более расплывчатым «было уже поздно».
