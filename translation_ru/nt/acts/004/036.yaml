  text: ⸀Ἰωσὴφ δὲ ὁ ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων, ὅ ἐστιν μεθερμηνευόμενον υἱὸς παρακλήσεως, Λευίτης, Κύπριος τῷ γένει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/036.yaml
  text: Joseph[a], who was called Barnabas by the apostles—which translated means son of encouragement—a Levite, a native of Cyprus,
translation:
  language: ru
  text: А Иосиф, прозванный апостолами Варнавой, что в переводе означает «сын ободрения»[a], левит, киприот по происхождению,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сын увещания», «сын утешения» или «сын поддержки». Греческое слово может означать ободрение, побуждение или утешение.'
    reason: Лексический диапазон слова παράκλησις нельзя полностью передать одним русским соответствием.
lexical_decisions:
- source_word: Ἰωσὴφ
  choice: Иосиф
  rationale: Общепринятая русская форма библейского личного имени.
- source_word: δὲ
  choice: А
  rationale: Передаёт мягкий переход к новому лицу и примеру, не создавая сильного противопоставления.
- source_word: ὁ ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων
  choice: прозванный апостолами Варнавой
  rationale: Причастие обозначает данное или употреблявшееся прозвание; ἀπό указывает на апостолов как источник именования. «Прозванный» естественно отличает это имя от имени Иосиф.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: что в переводе означает
  rationale: Ясно и естественно передаёт авторское пояснение значения семитского имени.
- source_word: υἱὸς παρακλήσεως
  choice: сын ободрения
  rationale: «Ободрение» достаточно широко охватывает поддержку и воодушевление, не сводя παράκλησις исключительно к утешению или увещанию; значимые альтернативы сохранены в сноске.
- source_word: Λευίτης
  choice: левит
  rationale: Точное и общепонятное обозначение принадлежности к колену Левия.
- source_word: Κύπριος τῷ γένει
  choice: родом с Кипра
  rationale: Естественно передаёт происхождение, выраженное дательным τῷ γένει, без чрезмерно точного утверждения о месте рождения.
theological_decisions:
- issue: Смысл παρακλήσεως в толковании имени Варнава
  choice: В основном тексте — «ободрения»
  alternative: «увещания», «утешения» или «поддержки»
  rationale: Греческое слово допускает как побуждение и наставление, так и утешение и поддержку. Контекст стиха не требует выбора одного узкого богословского оттенка, поэтому основной перевод остаётся широким, а варианты отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет незавершённость стиха и конечную запятую, поскольку предложение продолжается в следующем стихе. Кавычки выделяют авторское толкование имени.
