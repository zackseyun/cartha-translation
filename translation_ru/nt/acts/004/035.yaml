  text: καὶ ἐτίθουν παρὰ τοὺς πόδας τῶν ἀποστόλων· διεδίδετο δὲ ἑκάστῳ καθότι ἄν τις χρείαν εἶχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/035.yaml
  text: and they were laying them at the apostles’ feet[b][a], and it was being distributed to each one according as anyone had need.
translation:
  language: ru
  text: и клали вырученные средства[a] к ногам апостолов[b], а их распределяли между всеми по мере нужды каждого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте объект при глаголах не назван; из предыдущего стиха ясно, что речь идёт о выручке от продажи имущества.
    reason: cross_reference
  - marker: b
    text: 'Или: «перед апостолами». Буквально: «к ногам апостолов»; этот образ указывает на передачу выручки в их распоряжение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτίθουν
  choice: клали
  rationale: Имперфект передаёт продолжавшееся или повторявшееся действие; в русском повествовании несовершенный вид естественно выражает этот аспект.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: к ногам апостолов
  rationale: Сохраняет конкретный образ греческого выражения и одновременно подразумеваемую передачу средств под попечение и надзор апостолов.
- source_word: διεδίδετο
  choice: давали
  rationale: Греческий имперфект пассивного залога описывает регулярное распределение. Неопределённо-личная русская конструкция естественно сохраняет неуказанного исполнителя действия.
- source_word: ἑκάστῳ
  choice: каждому
  rationale: Точно передаёт дательный падеж и индивидуальный характер распределения.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: столько, сколько ему было нужно
  rationale: Естественно по-русски выражает соответствие размера помощи нужде каждого, передаваемое καθότι с неопределённой конструкцией.
- source_word: χρείαν
  choice: нужно
  rationale: Передаёт обычное значение нужды или необходимости современным и понятным языком.
theological_decisions:
- issue: Следует ли явно назвать подразумеваемый объект глаголов
  choice: В первом предложении уточнить «вырученное», а во втором не повторять объект, передав распределение неопределённо-личной конструкцией.
  alternative: Оставить объект грамматически невыраженным либо прямо назвать «деньги» в обеих частях.
  rationale: В греческом объект восстанавливается из предыдущего стиха как выручка от проданного. Русское «клали» без дополнения здесь звучало бы обрывочно, тогда как «вырученное» обеспечивает ясность, не сужая смысл до наличных денег; во второй части естественная русская конструкция не требует повторения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Несовершенный вид сохраняет повторяемость действий; конкретный образ «к ногам апостолов» оставлен в основном тексте.
