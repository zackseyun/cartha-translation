    rationale: Фраза «что что-либо из принадлежавшего ему — его собственное» перегружена, а причастие прошедшего времени «принадлежавшего» может читаться как указание на прежнюю, а не наличную принадлежность. Русское «не называл ничего из своего имущества своим» естественно передаёт отсутствие притязания на частное обладание, не усиливая текст до юридического отказа от собственности.
