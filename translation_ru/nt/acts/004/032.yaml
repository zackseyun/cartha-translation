id: ACT.4.32
reference: Acts 4:32
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τοῦ δὲ πλήθους τῶν πιστευσάντων ἦν ⸀καρδία καὶ ⸀ψυχὴ μία, καὶ οὐδὲ εἷς τι τῶν ὑπαρχόντων ⸀αὐτῷ ἔλεγεν ἴδιον εἶναι, ἀλλ’ ἦν αὐτοῖς ⸀πάντα κοινά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/032.yaml
  text: The multitude of those who had believed were of one heart and soul[a], and not even one of them said that anything belonging to him was his own[b], but all things were held in common among them.
translation:
  language: ru
  text: У множества уверовавших было одно сердце и одна душа, и ни один из них не называл ничего из своего имущества своим, но всё у них было общим.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλήθους
  choice: множества
  rationale: Передаёт значение большого числа людей и сохраняет собирательную форму греческого текста.
- source_word: τῶν πιστευσάντων
  choice: уверовавших
  rationale: Субстантивированное причастие естественно передаёт людей, пришедших к вере; контекстуальная предшествующая завершённость выражена самой формой «уверовавших».
- source_word: καρδία καὶ ψυχὴ μία
  choice: одно сердце и одна душа
  rationale: Сохраняет оба образа и подчёркнутое единство, не сводя выражение к толкованию вроде «были полностью едины».
- source_word: οὐδὲ εἷς
  choice: ни один из них
  rationale: Передаёт эмфатическое отрицание и естественно вводит последующую распределительную конструкцию в единственном числе.
- source_word: τι τῶν ὑπαρχόντων αὐτῷ
  choice: что что-либо из принадлежавшего ему
  rationale: Сохраняет широкий смысл имущества или вещей, принадлежащих каждому человеку, без неоправданного сужения до конкретного вида собственности.
- source_word: ἔλεγεν ἴδιον εἶναι
  choice: не говорил, что … — его собственное
  rationale: Близко следует формулировке источника и передаёт противопоставление личного и общего, не усиливая значение до юридического заявления или притязания.
- source_word: πάντα κοινά
  choice: всё у них было общим
  rationale: Естественно и формально передаёт греческую именную конструкцию, сохраняя её описательный характер.
theological_decisions:
- issue: Общий характер имущества в иерусалимской общине
  choice: Стих описывает, что верующие не считали принадлежавшее им исключительно своим и что всё у них было общим.
  alternative: «Они владели всем совместно» либо ослабленное «они охотно делились друг с другом».
  rationale: Перевод сохраняет напряжение между наличием вещей, принадлежавших отдельным людям, и отношением к ним как к общим, не превращая описание ни в позднейшую экономическую доктрину, ни в расплывчатое утверждение о щедрости.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским ритмом. Начальное δέ не передано отдельным союзом: здесь оно служит мягкой связкой повествования, а русское «же» создавало бы ненужное противопоставление. Архаизмы и конфессионально окрашенные формулы не использованы.'
