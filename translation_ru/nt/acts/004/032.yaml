review_pass:
  verdict: revise
  source_fidelity: 'Начальная часть точно передаёт Τοῦ δὲ πλήθους τῶν πιστευσάντων: «У множества уверовавших было одно сердце и одна душа». Финальное «но всё у них было общим» адекватно передаёт ἀλλ’ ἦν αὐτοῖς πάντα κοινά и не навязывает позднейшей модели общего владения. Однако «что что-либо из принадлежавшего ему — его собственное» стилистически и синтаксически тяжеловесно; форма «принадлежавшего» также может неуместно вызвать оттенок прошедшей принадлежности. Более прямое «не называл ничего из своего имущества своим» сохраняет смысл ἔλεγεν ἴδιον εἶναι и распределительное единственное число.'
  naturalness: Текст в целом литературен и понятен. Требуется небольшая правка средней части для естественного современного русского синтаксиса и устранения повторного, неуклюжего выражения «принадлежавшего ему — его собственное».
  terminology: «Уверовавшие», «сердце», «душа», «имущество» и «общее» уместны в современном литературном библейском регистре. «Своим» в исправленном тексте передаёт ἴδιον без излишней юридизации или конфессиональной окраски.
  issues:
