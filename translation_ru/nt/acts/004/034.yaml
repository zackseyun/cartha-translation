  text: οὐδὲ γὰρ ἐνδεής τις ⸀ἦν ἐν αὐτοῖς· ὅσοι γὰρ κτήτορες χωρίων ἢ οἰκιῶν ὑπῆρχον, πωλοῦντες ἔφερον τὰς τιμὰς τῶν πιπρασκομένων
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/034.yaml
  text: For there was not even any needy person among them[a], for as many as were owners of fields or houses were selling them and bringing the proceeds of what was sold.
translation:
  language: ru
  text: 'Ибо среди них не было ни одного нуждающегося: все, у кого были поля или дома, продавали их и приносили деньги, вырученные от продажи.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Ибо ... не было ни одного
  rationale: «Ибо» сохраняет пояснительную связь γάρ с предыдущим высказыванием, а «ни одного» естественно передаёт усиление οὐδέ в русском отрицательном предложении.
- source_word: ἐνδεής
  choice: нуждающегося
  rationale: Передаёт состояние нужды, не сужая значение до устойчивой социальной категории «бедный».
- source_word: τις ἦν ἐν αὐτοῖς
  choice: среди них не было ни одного
  rationale: Естественная русская экзистенциальная конструкция, сохраняющая значение неопределённого τις.
- source_word: ὅσοι
  choice: все, у кого
  rationale: Передаёт весь обозначенный относительным местоимением класс лиц, не распространяя утверждение за его пределы.
- source_word: κτήτορες χωρίων ἢ οἰκιῶν ὑπῆρχον
  choice: у кого были поля или дома
  rationale: Идиоматично передаёт обладание собственностью; «поля» соответствует участкам земли в данном контексте, а «дома» сохраняет конкретное значение οἰκίαι.
- source_word: πωλοῦντες ἔφερον
  choice: продавали их и приносили
  rationale: Несовершенный вид обоих русских глаголов передаёт повторяющееся или обычное действие, выраженное имперфектом ἔφερον и связанным с ним причастием.
- source_word: τὰς τιμὰς τῶν πιπρασκομένων
  choice: деньги, вырученные от продажи
  rationale: В контексте речь идёт о полученной при продаже сумме. Такой оборот естественнее буквального «цены проданного» и не добавляет сведений о назначении денег.
theological_decisions:
- issue: Масштаб продажи имущества
  choice: «все, у кого были поля или дома, продавали их»
  alternative: «владельцы полей или домов продавали всё своё имущество»
  rationale: Текст охватывает названную группу владельцев, но не говорит, что каждый продал всё имущество целиком; перевод не должен превращать повторяющуюся практику в требование полного отказа от собственности.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис сглажен без утраты причинной связи и повторяющегося характера действий; двоеточие естественно вводит пояснение второй части стиха.
