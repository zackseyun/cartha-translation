id: ACT.4.18
reference: Acts 4:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ καλέσαντες αὐτοὺς παρήγγειλαν ⸀τὸ καθόλου μὴ φθέγγεσθαι μηδὲ διδάσκειν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/018.yaml
  text: And after calling them in[a], they ordered them not to speak at all nor teach in the name of Jesus.
translation:
  language: ru
  text: И, призвав их, приказали им вовсе не говорить[a] и не учить во имя Иисуса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вообще ничего не говорить и не учить во имя Иисуса».'
    reason: 'Лексико-синтаксический вариант: усилительное τὸ καθόλου можно передать как относящееся непосредственно к содержанию речи — «ничего не говорить».'
lexical_decisions:
- source_word: καλέσαντες αὐτοὺς
  choice: призвав их
  rationale: Аористное причастие обозначает действие, предшествующее основному глаголу. «Призвав их» естественно для сцены официального разбирательства и не добавляет отсутствующего в греческом тексте уточнения «внутрь».
- source_word: παρήγγειλαν
  choice: приказали им
  rationale: Глагол передаёт властное распоряжение; «приказали» ясно сохраняет его силу в современном русском языке.
- source_word: τὸ καθόλου
  choice: вовсе не
  rationale: Оборот усиливает полный характер запрета. «Вовсе не» звучит естественно и передаёт категоричность.
- source_word: μὴ φθέγγεσθαι
  choice: не говорить
  rationale: φθέγγομαι означает говорить, произносить или издавать речь; нейтральное «говорить» здесь точно и естественно.
- source_word: μηδὲ διδάσκειν
  choice: и не учить
  rationale: μηδέ присоединяет второе действие, также охваченное отрицанием; русская конструкция «не… и не…» ясно передаёт совокупный запрет.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: во имя Иисуса
  rationale: Фраза указывает на связь речи и учения с именем Иисуса и может включать основание или авторитет этого имени. Традиционное и понятное «во имя Иисуса» сохраняет эту смысловую ёмкость.
theological_decisions:
- issue: Объём запрета свидетельствовать об Иисусе
  choice: Категорический запрет как говорить, так и учить во имя Иисуса
  alternative: Запрет только на публичное возвещение об Иисусе
  rationale: Сочетание τὸ καθόλου с двумя отрицательными инфинитивами выражает широкий и усиленный запрет. Перевод не сужает его до одного лишь публичного возвещения, которого греческий текст прямо не уточняет.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис краткий и ясный; властный характер распоряжения и полнота запрета сохранены без конфессиональных уточнений.
