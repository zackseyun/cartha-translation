  verdict: approve
  source_fidelity: 'Перевод точно передаёт последовательность действий («призвав их»), властный характер παρήγγειλαν («приказали»), усиленный полный запрет τὸ καθόλου («вовсе не») и два координированных инфинитива: «не говорить и не учить». Оборот «во имя Иисуса» сохраняет традиционно употребительное и семантически ёмкое соответствие ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ, не сужая его лишь до темы речи или только до вопроса полномочия.'
  naturalness: Фраза краткая, грамматически ясная и естественная для современного литературного русского с умеренным библейским регистром. Конструкция «не говорить и не учить» хорошо выражает общий запрет, а «вовсе не» естественно усиливает отрицание.
  terminology: «Приказали», «говорить», «учить» и «во имя Иисуса» последовательно и понятно передают ключевые элементы греческого текста. Имя «Иисус» оформлено нормативно. Сноска корректно отмечает допустимый способ связать усиление τὸ καθόλου непосредственно с объектом речи, не выдавая вариант за иной смысл текста.
