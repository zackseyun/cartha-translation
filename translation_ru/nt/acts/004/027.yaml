id: ACT.4.27
reference: Acts 4:27
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: συνήχθησαν γὰρ ἐπ’ ἀληθείας ⸂ἐν τῇ πόλει ταύτῃ⸃ ἐπὶ τὸν ἅγιον παῖδά σου Ἰησοῦν, ὃν ἔχρισας, Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος σὺν ἔθνεσιν καὶ λαοῖς Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/027.yaml
  text: For truly in this city Herod and Pontius Pilate[a], together with the Gentiles and the peoples of Israel, were gathered against your holy servant Jesus, whom you anointed[b],
translation:
  language: ru
  text: Ибо поистине в этом городе Ирод и Понтий Пилат вместе с язычниками и народами Израиля[b] собрались против Твоего святого Слуги[a] Иисуса, Которого Ты помазал,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святого Дитя». Греческое παῖς может означать как слугу, так и ребёнка; здесь «Слуга» предпочтительно ввиду вероятной связи с образом Слуги Господня у Исаии.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «народами Израиля». В греческом тексте слово «народы» стоит во множественном числе и, вероятно, обозначает различные группы израильского народа.'
    reason: source_form
lexical_decisions:
- source_word: συνήχθησαν
  choice: собрались
  rationale: Передаёт завершённое совместное выступление. Русская возвратная форма естественна и не уточняет сверх текста, кто был действующей причиной их собрания.
- source_word: γὰρ
  choice: ибо
  rationale: Связывает утверждение с предшествующей цитатой и её применением; форма уместна в торжественной молитвенной речи.
- source_word: ἐπ’ ἀληθείας
  choice: поистине
  rationale: Естественно передаёт наречное значение «действительно, истинно» и сохраняет эмфатическую силу выражения.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: в этом городе
  rationale: Сохраняет прямое указание на город, который из контекста понимается как Иерусалим, не добавляя его названия в текст.
- source_word: ἐπὶ τὸν
  choice: против
  rationale: При глаголе совместного собрания предлог с винительным падежом выражает враждебную направленность.
- source_word: τὸν ἅγιον παῖδά σου
  choice: Твоего святого Слугу
  rationale: «Слуга» сохраняет вероятную связь с образом Слуги Господня у Исаии. Прописная буква служит средством почтительного оформления титульного обозначения Иисуса, а не добавлением нового значения.
- source_word: ὃν ἔχρισας
  choice: Которого Ты помазал
  rationale: Буквально и ясно передаёт χρίω, сохраняя мессианское звучание и смысл Божьего посвящения без замены глагола существительным «Мессия».
- source_word: Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος
  choice: Ирод и Понтий Пилат
  rationale: Стандартная русская передача имён и естественное воспроизведение парной связи τε καὶ.
- source_word: σὺν ἔθνεσιν
  choice: вместе с язычниками
  rationale: В противопоставлении Израилю ἔθνη обозначает нееврейские народы; «язычники» ясно передаёт этот этнорелигиозный контраст.
- source_word: καὶ λαοῖς Ἰσραήλ
  choice: и народами Израиля
  rationale: Сохраняет необычное множественное число λαοῖς и не сводит выражение к единственному числу.
theological_decisions:
- issue: Значение παῖς применительно к Иисусу
  choice: Слуга
  alternative: дитя; Сын
  rationale: Контекст молитвы, употребление слова в Деяниях 3:13, 26; 4:27, 30 и вероятный фон пророчеств Исаии поддерживают значение «Слуга». Вариант «Сын» богословски возможен в более широком контексте Нового Завета, но для самого слова здесь слишком истолковывающий.
- issue: Значение ἔθνη в сочетании с Израилем
  choice: язычники
  alternative: народы
  rationale: Сопоставление с группами Израиля указывает на неевреев, а не только на политические нации; выбранный вариант делает этот контраст понятным.
- issue: Пассивная форма συνήχθησαν и возможная божественная причинность
  choice: собрались
  alternative: были собраны
  rationale: Русская возвратная форма сохраняет смысл совместного собрания, не утверждая явно, что Бог непосредственно собрал противников, и тем самым не снимает напряжение между человеческими действиями и Божьим замыслом, раскрываемое в следующем стихе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. «Ибо» и «поистине» соответствуют торжественному контексту, оставаясь понятными. Порядок слов сделан естественным для русского языка; необычное множественное число «народами Израиля» сохранено и пояснено в сноске. Написание местоимений, обращённых к Богу, и титульного обозначения «Слуга» с прописной буквы выдерживает традиционный почтительный русский библейский стиль.
