- from: Освободившись, они пришли к своим[a] и рассказали всё, что сказали им первосвященники и старейшины.
  to: После того как их отпустили, они пришли к своим[a] и рассказали всё, что сказали им первосвященники и старейшины.
  rationale: Замена «Освободившись» на «После того как их отпустили» устраняет возможное активное или возвратное прочтение и воспроизводит страдательное, предшествующее основному действию значение греческого причастия. Сноска уточнена, чтобы пояснять идиому, не отождествляя её референт с одной конкретной группой.
