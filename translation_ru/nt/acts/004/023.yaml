review_pass:
  verdict: revise
  source_fidelity: 'Деепричастие «освободившись» способно подразумевать, что они освободились сами, тогда как Ἀπολυθέντες — страдательная форма: их отпустили. Безлично-пассивное придаточное точно передаёт это значение и предшествование действию «пришли». Остальные соответствия исходному тексту точны: «к своим» сохраняет неопределённый референт τοὺς ἰδίους, «всё, что», «им», «первосвященники и старейшины» адекватны.'
  naturalness: «После того как их отпустили, они пришли к своим...» — естественная современная литературная русская фраза. «Рассказали всё, что ... сказали им» также звучит гладко и не нуждается в искусственном плюсквамперфекте.
  terminology: '«Первосвященники» и «старейшины» — нормативные и контекстуально точные обозначения данных групп. В пояснении к «своим» не следует включать «единоверцев» как обязательное значение: это сужает намеренно неопределённое греческое выражение.'
  issues:
  - severity: medium
    issue: «Освободившись» неявно меняет страдательную форму исходника.
    rationale: Русское возвратное деепричастие может читаться как действие самих Петра и Иоанна («освободились»), тогда как греческое Ἀπολυθέντες означает, что их отпустили другие. Следует явно выразить пассивное значение.
  - severity: low
    issue: Сноска чрезмерно конкретизирует «своих» словом «единоверцам».
    rationale: τοὺς ἰδίους обозначает собственный круг людей, но само по себе не называет этот круг единоверцами. Сноска должна оставлять пояснение открытым.
  revised_text: После того как их отпустили, они пришли к своим[a] и рассказали всё, что сказали им первосвященники и старейшины.
  revised_footnotes:
