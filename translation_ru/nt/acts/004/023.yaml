  text: Ἀπολυθέντες δὲ ἦλθον πρὸς τοὺς ἰδίους καὶ ἀπήγγειλαν ὅσα πρὸς αὐτοὺς οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/023.yaml
  text: After they were released[a], they went to their own people and reported all that the chief priests and the elders had said to them.
translation:
  language: ru
  text: После того как их отпустили, они пришли к своим[a] и рассказали всё, что сказали им первосвященники и старейшины.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к своим»; то есть к людям из их круга, например к товарищам или близким.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπολυθέντες
  choice: Освободившись
  rationale: 'Аористное страдательное причастие указывает на действие, предшествующее основному: их отпустили из-под стражи. Русское деепричастие естественно передаёт эту временную связь.'
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Слабая повествовательная связка; последовательность событий уже ясно передана деепричастным оборотом, поэтому отдельное «же» или «и» сделало бы фразу тяжелее.
- source_word: ἦλθον
  choice: они пришли
  rationale: ἔρχομαι допускает значения «приходить» и «идти» в зависимости от точки зрения. Здесь естественное русское выражение «пришли к своим» представляет прибытие к группе учеников.
- source_word: πρὸς τοὺς ἰδίους
  choice: к своим
  rationale: Субстантивированное τοὺς ἰδίους буквально означает «к своим» и обозначает близкий круг или общину, не уточняя её состав. Краткое русское выражение сохраняет эту неоднозначность.
- source_word: ἀπήγγειλαν
  choice: рассказали
  rationale: Глагол означает сообщить или передать сведения. «Рассказали» здесь звучит естественно и передаёт подробное сообщение обо всём сказанном.
- source_word: ὅσα
  choice: всё, что
  rationale: Передаёт полный объём сообщённого содержания.
- source_word: πρὸς αὐτοὺς
  choice: им
  rationale: При λέγω конструкция πρός с винительным обычно обозначает адресата речи; дательный падеж естественно передаёт это по-русски.
- source_word: οἱ ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся обозначение представителей высшей храмовой и священнической власти; множественное число не означает одновременного существования нескольких действующих верховных первосвященников.
- source_word: οἱ πρεσβύτεροι
  choice: старейшины
  rationale: В данном общественно-религиозном контексте речь идёт о признанных руководителях народа, а не просто о пожилых мужчинах.
- source_word: εἶπαν
  choice: сказали
  rationale: Русский совершенный вид и порядок придаточных естественно показывают, что слова властей предшествовали рассказу; форма «сказали» не требует искусственного плюсквамперфекта.
