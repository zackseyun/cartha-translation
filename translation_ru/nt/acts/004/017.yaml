  to: Но чтобы это не распространялось дальше среди народа, пригрозим им, чтобы они впредь никому не говорили в связи с этим именем.
  rationale: Исправлены значение и референт выражения ἐπὶ τῷ ὀνόματι τούτῳ, устранена ненужная богословски окрашенная капитализация «Этого», а невыраженный субъект διανεμηθῇ сохранён без уточняющего добавления. Прямой перевод «пригрозим» оставлен без сноски, поскольку он точно выражает ἀπειλησώμεθα.
