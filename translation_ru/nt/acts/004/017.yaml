source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα μὴ ἐπὶ πλεῖον διανεμηθῇ εἰς τὸν λαόν, ⸀ἀπειλησώμεθα αὐτοῖς μηκέτι λαλεῖν ἐπὶ τῷ ὀνόματι τούτῳ μηδενὶ ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/017.yaml
  text: But so that it may not spread any further among the people, let us warn them not to speak any longer to anyone in this name.
translation:
  language: ru
  text: Но чтобы это не распространялось дальше среди народа, пригрозим им, чтобы они впредь никому не говорили в связи с этим именем.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διανεμηθῇ
  choice: весть об этом не распространялась
  rationale: Глагол буквально обозначает распространение; подразумеваемый из контекста предмет распространения передан как «весть об этом», чтобы русская фраза была ясной без чрезмерного уточнения.
- source_word: ἐπὶ πλεῖον
  choice: дальше
  rationale: Передаёт сравнительную идею дальнейшего распространения за нынешние пределы.
- source_word: εἰς τὸν λαόν
  choice: среди народа
  rationale: Естественно обозначает распространение в народной среде; «народ» сохраняет широкое обозначение иудейской общественности.
- source_word: ἀπειλησώμεθα
  choice: пригрозим им
  rationale: Прямо передаёт значение угрозы и властного запугивания, уместное в контексте решения совета.
- source_word: μηκέτι λαλεῖν
  choice: чтобы они впредь… не говорили
  rationale: '«Впредь» сохраняет временную силу μηκέτι: запрет действует с этого момента.'
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: от имени Этого
  rationale: Оборот передаёт речь на основании авторитета и имени упомянутого лица; указательное местоимение сохраняет уклончивое «этого» в речи властей.
- source_word: μηδενὶ ἀνθρώπων
  choice: никому
  rationale: Краткий и естественный русский эквивалент общего запрета говорить какому-либо человеку.
theological_decisions:
- issue: Сила глагола ἀπειλησώμεθα в решении совета
  choice: пригрозим им
  alternative: строго предупредим их
  rationale: Греческий глагол прямо выражает угрозу, а судебно-принудительный контекст подтверждает более сильную формулировку; смягчение до обычного предупреждения могло бы скрыть напряжённость сцены.
- issue: Значение выражения ἐπὶ τῷ ὀνόματι τούτῳ
  choice: от имени Этого
  alternative: об этом имени
  rationale: Предлог ἐπί с дательным здесь допускает связь с основанием или авторитетом имени. «От имени» естественно передаёт эту связь, не вводя в сам стих имя Иисуса, которое совет намеренно не произносит.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Формулировка «весть об этом» делает подразумеваемый субъект распространения явным; «пригрозим» сохраняет принудительный характер решения. Заглавная буква в «Этого» помогает обозначить конкретного ранее названного Иисуса, не заменяя намеренно уклончивое указательное выражение совета.
