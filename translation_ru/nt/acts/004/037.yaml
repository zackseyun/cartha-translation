id: ACT.4.37
reference: Acts 4:37
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὑπάρχοντος αὐτῷ ἀγροῦ πωλήσας ἤνεγκεν τὸ χρῆμα καὶ ἔθηκεν ⸀παρὰ τοὺς πόδας τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/037.yaml
  text: Since he owned a field[b][a], he sold it and brought the money and laid it at the apostles’ feet.
translation:
  language: ru
  text: У него было поле; он продал его, принёс деньги и положил их у ног апостолов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπάρχοντος αὐτῷ ἀγροῦ
  choice: У него было поле
  rationale: Генитив абсолютный задаёт фоновое обстоятельство, а конструкция с ὑπάρχω выражает принадлежность. Русская конструкция «у него было» естественна и не усиливает причинный оттенок, который в греческом не обязателен.
- source_word: ἀγροῦ
  choice: поле
  rationale: ἀγρός обозначает поле или участок земли; «поле» — прямой и достаточно широкий эквивалент.
- source_word: πωλήσας
  choice: он продал его
  rationale: Аористное причастие обозначает действие, предшествующее главным глаголам. Личная форма естественно передаёт в русском последовательность событий.
- source_word: ἤνεγκεν
  choice: принёс
  rationale: В данном контексте φέρω означает доставить или принести что-либо адресатам.
- source_word: τὸ χρῆμα
  choice: деньги
  rationale: χρῆμα здесь означает деньги, полученные от продажи. «Деньги» сохраняет прямоту текста; «выручка» было бы допустимым, но более истолковывающим вариантом.
- source_word: ἔθηκεν
  choice: положил
  rationale: τίθημι означает «класть, помещать»; с выражением «у ног» глагол «положил» сохраняет конкретный образ.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: у ног апостолов
  rationale: Перевод сохраняет физический образ передачи денег в распоряжение апостолов, не сводя его лишь к абстрактному «отдал».
theological_decisions:
- issue: Следует ли сохранять конкретный образ представления денег апостолам
  choice: «положил их у ног апостолов»
  alternative: «отдал их апостолам»
  rationale: Конкретное выражение передаёт и само действие, и передачу дара в распоряжение апостолов, не добавляя специальных экклезиологических выводов.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное. Точка с запятой естественно отделяет фоновое обстоятельство от последовательности действий. Местоимение «их» согласовано с русским множественным существительным «деньги».
