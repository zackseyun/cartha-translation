  text: οὐ δυνάμεθα γὰρ ἡμεῖς ἃ εἴδαμεν καὶ ἠκούσαμεν μὴ λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/020.yaml
  text: For we are not able not to speak about what we have seen and heard[a].
translation:
  language: ru
  text: Ведь мы не можем не говорить о том, что видели и слышали[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь мы не в силах молчать о том, что видели и слышали».'
    reason: Лексико-стилистический вариант, идиоматически передающий греческую конструкцию невозможности не говорить.
lexical_decisions:
- source_word: οὐ δυνάμεθα
  choice: мы не можем
  rationale: Передаёт прямо выраженную неспособность, а не просто нежелание или отказ.
- source_word: γὰρ
  choice: ведь
  rationale: Естественно для современного русского языка вводит обоснование предшествующего утверждения.
- source_word: ἡμεῖς
  choice: мы
  rationale: Явное местоимение сохранено; дополнительное усиление вроде «мы сами» в русском было бы чрезмерным.
- source_word: ἃ
  choice: о том, что
  rationale: В сочетании с русским «говорить» естественно обозначает содержание свидетельства.
- source_word: εἴδαμεν καὶ ἠκούσαμεν
  choice: видели и слышали
  rationale: Русское прошедшее время естественно передаёт аористы и сохраняет свидетельский характер высказывания.
- source_word: μὴ λαλεῖν
  choice: не говорить
  rationale: В конструкции «не можем не говорить» сохраняются отрицание и смысл невозможности молчать без стилистической тяжеловесности.
theological_decisions:
- issue: Высказывание апостолов выражает неспособность молчать или лишь твёрдое нежелание подчиниться.
  choice: Апостолы говорят, что не могут не говорить.
  alternative: Апостолы лишь заявляют, что не станут молчать.
  rationale: Конструкция οὐ δυνάμεθα ... μὴ λαλεῖν непосредственно выражает невозможность воздержаться от речи; перевод не ослабляет её до решения или намерения.
translation_notes:
  register: Современный литературный русский язык. Формулировка естественна, dignified без архаизмов; двойное отрицание нормативно и близко передаёт структуру греческого текста.
