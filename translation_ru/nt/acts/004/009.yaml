  text: εἰ ἡμεῖς σήμερον ἀνακρινόμεθα ἐπὶ εὐεργεσίᾳ ἀνθρώπου ἀσθενοῦς, ἐν τίνι οὗτος ⸀σέσωσται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/009.yaml
  text: If we are being examined today concerning a good deed done to a sick man[b][a], by what means this man has been healed—
translation:
  language: ru
  text: Если нас сегодня допрашивают по поводу доброго дела, оказанного немощному человеку, — каким образом этот человек был исцелён,[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был спасён» или «стал здоров». Греческий глагол может означать спасение, избавление или исцеление; здесь ближайший контекст указывает на физическое исцеление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακρινόμεθα
  choice: нас… допрашивают
  rationale: Глагол обозначает судебное или официальное разбирательство с расспросами. «Допрашивают» естественно передаёт правовой контекст, не утверждая прямо, что уже идёт формальный суд.
- source_word: ἐπὶ εὐεργεσίᾳ
  choice: из-за доброго дела
  rationale: 'ἐπί с дательным указывает на основание или повод разбирательства; эта формулировка сохраняет иронию: апостолов допрашивают из-за благодеяния.'
- source_word: ἀνθρώπου ἀσθενοῦς
  choice: для немощного человека
  rationale: ἀσθενής указывает здесь на телесную слабость или недуг. «Немощный» охватывает состояние хромого человека, не называя его просто больным и не добавляя более узкого диагноза.
- source_word: ἐν τίνι
  choice: как
  rationale: Оборот может обозначать средство или действующую силу. Русское «как» сохраняет широту вопроса, не предрешая ответ «кем» до упоминания Иисуса в следующем стихе.
- source_word: σέσωσται
  choice: был исцелён
  rationale: Перфект σῴζω здесь непосредственно относится к телесному восстановлению человека. «Был исцелён» естественно выражает этот смысл, а более широкое значение спасения отмечено в сноске.
theological_decisions:
- issue: Значение σέσωσται в контексте исцеления
  choice: был исцелён
  alternative: был спасён; стал здоров
  rationale: Ближайший контекст говорит о восстановлении прежде хромого человека, поэтому основной текст передаёт физическое исцеление. Вместе с тем смысловая связь σῴζω со спасением не устраняется, а сохраняется в примечании.
translation_notes:
  register: Современный литературный русский язык с официально-судебным оттенком. Конечное тире сохраняет незавершённость условного придаточного и переход к продолжению речи в следующем стихе.
