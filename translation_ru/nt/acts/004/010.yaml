- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: которого вы распяли
  rationale: Прямо сохраняет обвинение, обращённое к слушателям.
- source_word: ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν
  choice: которого Бог воскресил из мёртвых
  rationale: Сохраняет явное действие Бога и утверждение о воскресении Иисуса.
- source_word: ἐν τούτῳ
  choice: именно благодаря Ему
  rationale: Демонстративное местоимение естественно соотносится с только что названным Иисусом и имеет инструментальное значение; возможная отсылка именно к имени сохранена в примечании.
- source_word: οὗτος παρέστηκεν ἐνώπιον ὑμῶν
  choice: этот человек стоит перед вами
  rationale: Передаёт наблюдаемое нынешнее состояние, выраженное греческим перфектом.
- source_word: ὑγιής
  choice: исцелён
  rationale: В контексте совершённого исцеления естественно обозначает восстановленное телесное здоровье; более буквальные варианты отмечены в примечании.
theological_decisions:
- issue: Передача Χριστοῦ как титула или как части имени
  choice: Мессии
  alternative: Христа
  rationale: Перед руководителями Израиля титульное значение остаётся заметным; «Мессия» ясно передаёт смысл греческого Χριστός, не превращая его в фамильную часть имени.
- issue: Референт выражения ἐν τούτῳ
  choice: благодаря Ему
  alternative: этим именем
  rationale: Греческое указательное местоимение может указывать на самого Иисуса либо более узко на Его только что названное имя. Основной текст выбирает естественную личную отсылку, а подлинная неоднозначность сохранена в сноске.
- issue: Формулировка воскресения
  choice: которого Бог воскресил из мёртвых
  alternative: которого Бог поднял из числа мёртвых
  rationale: Обычная русская библейская формулировка точно сохраняет божественное действие и не добавляет объяснений сверх исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной апостольской речи. Синтаксис слегка перестроен ради естественности и ясного различения двух близких оборотов ἐν τῷ ὀνόματι и ἐν τούτῳ; обвинение и контраст между распятием людьми и воскресением Богом сохранены.
