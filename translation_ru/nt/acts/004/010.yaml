  text: γνωστὸν ἔστω πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραὴλ ὅτι ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου, ὃν ὑμεῖς ἐσταυρώσατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, ἐν τούτῳ οὗτος παρέστηκεν ἐνώπιον ὑμῶν ὑγιής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/010.yaml
  text: let it be known to all of you and to all the people of Israel that in the name of Jesus the Messiah the Nazarene[a], whom you crucified[c][b], whom God raised from the dead—by this name this man stands before you healthy.
translation:
  language: ru
  text: то пусть всем вам и всему народу Израиля будет известно, что во имя Иисуса Мессии из Назарета[a], которого вы распяли и которого Бог воскресил из мёртвых, этот человек стоит перед вами здоровым благодаря Ему[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисуса Христа из Назарета». Греческое Χριστός можно передать титулом «Мессия» или, в более привычном употреблении как части имени, словом «Христос».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «благодаря этому имени». Греческое ἐν τούτῳ может относиться к самому Иисусу или более узко — к Его имени, упомянутому перед этим.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «целым», «невредимым» или «здоровым». Греческое ὑγιής обозначает телесную целость или восстановленное здоровье.'
    reason: lexical_alternative
