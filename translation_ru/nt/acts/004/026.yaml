  source_fidelity: 'Текст точно передаёт структуру и смысл греческого оригинала: «цари» отличены от «правителей», γῆ передано в широком смысле как «земля», враждебное κατὰ последовательно отражено словом «против». «Выступили» приемлемо передаёт deliberate stance παρέστησαν в контексте цитаты из Псалма 2, не приписывая более сильного значения вооружённого восстания. «Собрались вместе» естественно передаёт συνήχθησαν ἐπὶ τὸ αὐτό.'
