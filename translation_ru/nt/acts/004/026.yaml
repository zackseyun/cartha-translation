id: ACT.4.26
reference: Acts 4:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: παρέστησαν οἱ βασιλεῖς τῆς γῆς καὶ οἱ ἄρχοντες συνήχθησαν ἐπὶ τὸ αὐτὸ κατὰ τοῦ κυρίου καὶ κατὰ τοῦ χριστοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/026.yaml
  text: The kings of the earth took their stand[a], and the rulers were gathered together against the Lord and against his Messiah.
translation:
  language: ru
  text: 'Цари земли выступили,

    и правители собрались вместе

    против Господа

    и против Его Помазанника[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мессии» или «Христа»; греческое слово Христос означает «Помазанник».'
    reason: Указывает основные способы передачи титула χριστός и поясняет его значение в цитате из Псалма 2.
lexical_decisions:
- source_word: παρέστησαν
  choice: выступили
  rationale: Передаёт не просто физическое положение, а намеренное выступление в противостоянии; при этом не усиливает греческий текст до однозначного «восстали» или «ополчились».
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: цари земли
  rationale: Сохраняет точный политический титул и широкий, всемирный смысл γῆ в цитате из Псалма 2.
- source_word: οἱ ἄρχοντες
  choice: правители
  rationale: Современное и достаточно широкое обозначение власть имущих, естественно параллельное слову «цари».
- source_word: συνήχθησαν ἐπὶ τὸ αὐτό
  choice: собрались вместе
  rationale: Сохраняет пассивно-возвратную форму и значение совместного, согласованного действия.
- source_word: κατὰ
  choice: против
  rationale: Прямо передаёт враждебную направленность в обоих повторениях предлога.
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: Традиционное и контекстуально точное обозначение Бога в цитате из Писания.
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: Его Помазанника
  rationale: В цитате из Псалма 2 слово χριστός функционирует как титул и буквально обозначает того, кого помазал Господь; местоимение сохраняет связь с «Господом».
theological_decisions:
- issue: Передача Χριστός в цитате из Псалма 2
  choice: Помазанник
  alternative: Мессия; Христос
  rationale: «Помазанник» непосредственно передаёт значение греческого χριστός и сохраняет ветхозаветный контекст цитаты, не превращая титул без пояснения в имя собственное. В сноске отмечены привычные титульные соответствия.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом поэтической цитаты. Порядок строк подчёркивает параллелизм, а прописные буквы в «Господа» и «Его Помазанника» соответствуют русской библейской издательской традиции.
