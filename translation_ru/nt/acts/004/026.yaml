  terminology: «Господь» верно передаёт κύριος в данном библейском контексте. «Его Помазанник» особенно удачно сохраняет буквальный титульный смысл χριστός и связь с псалмовой цитатой; сноска корректно указывает варианты «Мессия» и «Христос». Прописные буквы соответствуют принятой русской библейской издательской традиции.
