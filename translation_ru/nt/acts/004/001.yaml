lexical_decisions:
- source_word: Λαλούντων δὲ αὐτῶν
  choice: Когда они говорили
  rationale: Родительный самостоятельный оборот естественно передан придаточным времени. Частица δέ здесь обозначает развитие повествования и не требует отдельного русского слова.
- source_word: πρὸς τὸν λαὸν
  choice: с народом
  rationale: λαός означает собравшийся народ; сочетание «говорили с народом» естественно по-русски и не сужает значение до «толпы».
- source_word: ἐπέστησαν αὐτοῖς
  choice: к ним подошли
  rationale: Глагол может обозначать приближение или внезапное появление. «Подошли» сохраняет нейтральность самого глагола и не вносит прямо не выраженного значения враждебного столкновения.
- source_word: οἱ ἱερεῖς
  choice: священники
  rationale: В греческом тексте стоит ἱερεῖς, а не ἀρχιερεῖς, поэтому речь именно о священниках, без указания на первосвященнический ранг.
- source_word: ὁ στρατηγὸς τοῦ ἱεροῦ
  choice: начальник храмовой стражи
  rationale: Так передаётся должность начальника, отвечавшего за порядок и охрану на территории храма. Формально буквальное «начальник храма» в современном русском неясно и может быть понято неверно.
- source_word: οἱ Σαδδουκαῖοι
  choice: саддукеи
  rationale: Устоявшееся русское название этой иудейской религиозно-политической группы.
theological_decisions:
- issue: Возможный оттенок враждебности в прибытии храмовых властей
  choice: Нейтральное «к ним подошли»
  alternative: «набросились на них» или «выступили против них»
  rationale: Дальнейший контекст показывает противодействие, однако сам глагол здесь прежде всего описывает приближение или внезапное появление. Нейтральная формулировка сохраняет напряжение повествования, не усиливая его преждевременно.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанное. Синтаксис сохраняет временную связь двух действий, а названия должностей и групп переданы понятно для обычного читателя.
