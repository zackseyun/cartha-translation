- source_word: δεόμενος τοῦ θεοῦ
  choice: молившийся Богу
  rationale: Естественно передаёт обращённую к Богу просьбу в контексте благочестия Корнилия.
- source_word: διὰ παντός
  choice: постоянно
  rationale: Обозначает устойчивую регулярность, не обязательно непрерывное действие каждое мгновение.
