lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: жил человек
  rationale: Оборот естественно вводит нового участника повествования. «Жил человек» передаёт неопределённость τις и мягкий переход δέ без искусственного начального союза.
- source_word: ἐν Καισαρείᾳ
  choice: в Кесарии
  rationale: Прямое обозначение места с традиционной русской формой топонима.
- source_word: ὀνόματι Κορνήλιος
  choice: по имени Корнилий
  rationale: Естественная русская передача греческой конструкции с дательным ὀνόματι.
- source_word: ἑκατοντάρχης
  choice: центурион
  rationale: Точный и общеупотребительный исторический термин для римского военного начальника данного ранга.
- source_word: ἐκ σπείρης
  choice: из когорты
  rationale: σπεῖρα здесь обозначает римское воинское подразделение; «когорта» исторически точнее более общих вариантов.
- source_word: τῆς καλουμένης Ἰταλικῆς
  choice: называемой Италийской
  rationale: Сохраняет значение причастия καλουμένης и передаёт название подразделения без добавления отсутствующих в тексте подробностей.
