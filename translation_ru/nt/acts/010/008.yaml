  text: И, всё им объяснив, он послал их в Иоппию.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξηγησάμενος
  choice: всё им объяснив
  rationale: 'Аористное причастие обозначает действие, предшествующее главному глаголу: Корнилий подробно изложил посланцам случившееся. «Объяснив» естественно звучит по-русски и передаёт не просто сообщение, а обстоятельное изложение.'
- source_word: ἅπαντα
  choice: всё
  rationale: Форма среднего рода множественного числа означает всю совокупность относящихся к делу обстоятельств; русское «всё» кратко и естественно передаёт полноту сообщения.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж обозначает адресатов объяснения; русское «им» точно передаёт эту синтаксическую роль.
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Простой и точный эквивалент глагола со значением отправления людей с поручением; более официальное «отправил» также возможно, но здесь не требуется.
- source_word: εἰς τὴν Ἰόππην
  choice: в Иоппию
  rationale: Предлог εἰς обозначает направление к месту назначения. В русском языке движение в город естественно выражается сочетанием «в Иоппию».
