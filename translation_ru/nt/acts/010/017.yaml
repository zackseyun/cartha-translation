source:
  edition: SBLGNT
  text: Ὡς δὲ ἐν ἑαυτῷ διηπόρει ὁ Πέτρος τί ἂν εἴη τὸ ὅραμα ὃ εἶδεν, ⸀ἰδοὺ οἱ ἄνδρες οἱ ἀπεσταλμένοι ⸀ὑπὸ τοῦ Κορνηλίου διερωτήσαντες τὴν οἰκίαν ⸀τοῦ Σίμωνος ἐπέστησαν ἐπὶ τὸν πυλῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/017.yaml
  text: While Peter was inwardly perplexed as to what the vision that he had seen might mean[a], behold, the men who had been sent by Cornelius, having asked directions to Simon’s house[b], stood at the gate.
translation:
  language: ru
  text: Пока Пётр в недоумении размышлял про себя, что могло означать увиденное им видение[a], — вот, посланные Корнилием люди, разузнав, где находится дом Симона, остановились у ворот[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что это могло быть за видение». Греческий текст допускает такой более буквальный перевод, хотя в данном контексте, вероятно, имеется в виду смысл или значение видения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «у входа». Греческое слово может обозначать ворота либо входную часть дома.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Пока
  rationale: Передаёт временную связь и естественно вводит одновременное развитие событий; лёгкая повествовательная связь δέ понятна из построения фразы.
- source_word: ἐν ἑαυτῷ διηπόρει
  choice: в недоумении размышлял
  rationale: Сочетание передаёт внутреннее, продолжавшееся замешательство Петра и не ослабляет διηπόρει до простого «думал».
- source_word: τί ἂν εἴη
  choice: что могло означать
  rationale: По контексту речь, вероятно, о значении видения; модальность ἄν сохранена словом «могло». Более буквальное «что это могло быть» отмечено в сноске.
- source_word: τὸ ὅραμα ὃ εἶδεν
  choice: увиденное им видение
  rationale: Естественно и компактно передаёт относительную конструкцию, сохраняя прямое указание на видение, которое Пётр видел.
- source_word: ἰδοὺ
  choice: вот
  rationale: Сохраняет указательный повествовательный маркер и живость внезапного перехода к прибывшим людям.
- source_word: οἱ ἄνδρες οἱ ἀπεσταλμένοι ὑπὸ τοῦ Κορνηλίου
  choice: посланные Корнилием люди
  rationale: Передаёт мужскую группу без тяжеловесной относительной конструкции и сохраняет пассивное значение причастия.
- source_word: διερωτήσαντες τὴν οἰκίαν τοῦ Σίμωνος
  choice: разузнав, где находится дом Симона
  rationale: Глагол подразумевает расспросы или наведение справок; русская формулировка ясно передаёт, что они выяснили местонахождение дома, а не расспрашивали сам дом.
- source_word: ἐπέστησαν ἐπὶ τὸν πυλῶνα
  choice: остановились у ворот
  rationale: Передаёт прибытие и занятие места у входа естественным русским выражением; диапазон значения πυλών пояснён в сноске.
theological_decisions:
- issue: Предмет недоумения Петра в выражении τί ἂν εἴη
  choice: что могло означать видение
  alternative: что это могло быть за видение
  rationale: Контекст поддерживает вопрос о смысле или значении видения, но греческая фраза допускает более буквальное понимание; напряжение сохранено сноской, без догматического уточнения содержания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной повествовательной интонацией. «Вот» сохраняет библейскую выразительность, а «разузнав, где находится» звучит естественно для обычного современного читателя. Синтаксис не перегружен, при этом последовательность действий исходного текста сохранена.
