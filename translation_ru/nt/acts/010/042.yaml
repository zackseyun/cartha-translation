  text: καὶ παρήγγειλεν ἡμῖν κηρύξαι τῷ λαῷ καὶ διαμαρτύρασθαι ὅτι ⸀οὗτός ἐστιν ὁ ὡρισμένος ὑπὸ τοῦ θεοῦ κριτὴς ζώντων καὶ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/042.yaml
  text: And he commanded us to proclaim to the people and to testify solemnly that this is the one appointed by God as judge of the living and the dead[a].
translation:
  language: ru
  text: И Он повелел нам возвестить народу и торжественно засвидетельствовать, что именно Он поставлен Богом судьёй живых и мёртвых.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «определён Богом быть судьёй живых и мёртвых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλεν
  choice: повелел
  rationale: Передаёт авторитетное поручение, не смягчая его до простого наставления.
- source_word: κηρύξαι
  choice: возвестить
  rationale: Выражает публичное провозглашение и не ограничивает смысл современной ассоциацией с проповедью как жанром.
- source_word: τῷ λαῷ
  choice: народу
  rationale: Сохраняет буквальную референцию текста без добавления прямо не названного «Израиля».
- source_word: διαμαρτύρασθαι
  choice: торжественно засвидетельствовать
  rationale: Сохраняет как значение свидетельства, так и усиленную серьёзность глагола.
- source_word: οὗτός
  choice: именно Он
  rationale: Естественно по-русски передаёт указательное и эмфатическое значение применительно к Иисусу.
- source_word: ὁ ὡρισμένος
  choice: поставлен
  rationale: Передаёт совершившееся Божье назначение и сохраняющийся статус; формулировка ясна и естественна в данном сочетании.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: Богом
  rationale: Точно передаёт действующее лицо при пассивной форме.
- source_word: κριτὴς
  choice: Судьёй
  rationale: Естественно оформляет именную часть сказуемого и сохраняет судебный смысл.
- source_word: ζώντων καὶ νεκρῶν
  choice: живых и мёртвых
  rationale: Точная, торжественная и устоявшаяся передача, охватывающая всех людей.
theological_decisions:
- issue: Божественное назначение Иисуса Судьёй
  choice: поставлен Богом Судьёй живых и мёртвых
  alternative: определён Богом быть Судьёй живых и мёртвых
  rationale: Перевод прямо сохраняет утверждение стиха о Божьем назначении Иисуса Судьёй всех людей, не развивая его в более поздние догматические формулы.
translation_notes:
  register: Современный литературный русский язык с достоинством и торжественностью апостольского свидетельства. Заглавные буквы в «Он» и «Судьёй» помогают ясно обозначить Иисуса и Его уникальную роль, не добавляя отсутствующих в тексте титулов.
