lexical_decisions:
- source_word: φωνὴ
  choice: был к нему голос
  rationale: Безартиклевое существительное обозначает вновь прозвучавший небесный голос; русская конструкция естественно передаёт направленность речи к Петру.
- source_word: πάλιν ἐκ δευτέρου
  choice: снова, во второй раз
  rationale: Сохранены оба элемента несколько избыточного и эмфатического греческого оборота.
- source_word: Ἃ
  choice: То, что
  rationale: Средний род множественного числа имеет обобщающее значение; русское «то, что» естественно передаёт совокупный объект.
- source_word: ἐκαθάρισεν
  choice: очистил
  rationale: Аорист указывает на совершённое решительное действие Бога; «очистил» сохраняет смысл ритуальной чистоты.
- source_word: σὺ μὴ κοίνου
  choice: ты не считай нечистым
  rationale: Явное «ты» сохраняет акцент на Петре, а «не считай нечистым» естественно выражает запрет признавать осквернённым то, что Бог очистил.
theological_decisions:
- issue: Передача языка ритуальной чистоты в видении Петра
  choice: не считай нечистым
  alternative: не объявляй обыденным; не считай осквернённым
  rationale: κοινόω здесь противопоставлено καθαρίζω и в контексте категорий чистоты означает считать или объявлять осквернённым, непригодным как чистое. Буквальное русское «обыденным» не передаёт этого смысла без пояснения; при этом сноска сохраняет лексическую особенность слова.
translation_notes:
  register: Современный литературный русский язык с торжественной, но ясной синтаксической формой. Повтор πάλιν ἐκ δευτέρου сохранён, а терминология чистоты передана понятно для широкого читателя с буквальной альтернативой в сноске.
