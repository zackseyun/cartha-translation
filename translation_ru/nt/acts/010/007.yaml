    text: 'Или: «двоих из своих домашних рабов». Греческое οἰκέται обозначает зависимых членов дома, служивших хозяину, и может прямо указывать на рабов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἀπῆλθεν
  choice: Когда … ушёл
  rationale: 'Оборот вводит временную последовательность: уход ангела предшествует действиям Корнилия. Простая конструкция с «когда» естественна для современного русского языка.'
- source_word: ὁ ἄγγελος ὁ λαλῶν αὐτῷ
  choice: ангел, говоривший с ним
  rationale: В контексте видения речь идёт о небесном посланнике. Причастный оборот сохраняет определительную функцию греческого причастия и не переуточняет длительность речи.
- source_word: φωνήσας
  choice: Корнилий позвал
  rationale: Имя Корнилия восстановлено из контекста как подразумеваемое подлежащее, чтобы русская фраза была ясной. «Позвал» естественно передаёт призыв находящихся рядом людей; действие продолжается в следующем стихе.
- source_word: δύο τῶν οἰκετῶν
  choice: двоих своих домашних слуг
  rationale: οἰκέτης обозначает человека, несущего зависимую службу в доме, вплоть до раба. «Домашние слуги» сохраняет бытовой контекст и звучит естественно, а возможное значение «рабы» отмечено в сноске.
- source_word: στρατιώτην εὐσεβῆ
  choice: одного благочестивого воина
  rationale: «Воин» соответствует военному контексту римского сотника, а «благочестивый» передаёт εὐσεβής как почтительную религиозную преданность без добавления более узкого обозначения «боящийся Бога».
- source_word: τῶν προσκαρτερούντων αὐτῷ
  choice: из тех, кто постоянно находился при нём
  rationale: «Из тех» передаёт партитивную конструкцию, а «постоянно находился при нём» сохраняет оттенок регулярной и преданной готовности прислуживать, не повторяя слово «слуга».
theological_decisions:
- issue: Значение ἄγγελος в данном контексте
  choice: ангел
  alternative: посланник
  rationale: Ближайший контекст описывает сверхъестественное видение Корнилия, поэтому здесь имеется в виду небесный ангел, а не обычный человеческий посланник.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified повествовательным строем. Имя Корнилия добавлено из непосредственного контекста ради устранения неясности подразумеваемого подлежащего; смысловых или конфессиональных уточнений не внесено.
