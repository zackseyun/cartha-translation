  text: When the angel who was speaking to him had gone away[a], he called two of his household servants and a devout soldier from among those attending him.
translation:
  language: ru
  text: Когда ангел, говоривший с ним, ушёл, Корнилий позвал двоих своих домашних слуг[a] и одного благочестивого солдата из числа тех, кто постоянно был при нём.
  philosophy: optimal-equivalence
  footnotes:
