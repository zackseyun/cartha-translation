  text: καὶ θεωρεῖ τὸν οὐρανὸν ἀνεῳγμένον καὶ ⸀καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ⸀ἀρχαῖς καθιέμενον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/011.yaml
  text: and he sees heaven opened[a], and something like a large sheet descending, being lowered by its four corners to the earth[c][b],
translation:
  language: ru
  text: 'и видит, что небо раскрылось[a] и что спускается нечто[b], похожее на большое полотно: его опускают на землю за четыре угла[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «раскрылся небосвод». Греческое слово может означать как небо в религиозном смысле, так и видимое небо.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «какой-то предмет» или «какой-то сосуд». Греческое выражение намеренно остаётся неопределённым.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «за четыре края».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: видит
  rationale: Простое настоящее время сохраняет живость повествования Луки; «созерцает» звучало бы архаично и придавало бы глаголу лишний оттенок.
- source_word: οὐρανὸν ἀνεῳγμένον
  choice: небо раскрылось
  rationale: В контексте откровения «небо» передаёт как пространственный, так и религиозный смысл οὐρανός. Предикативная конструкция естественнее по-русски, чем буквальное «видит небо раскрытым».
- source_word: καταβαῖνον
  choice: спускается
  rationale: Настоящее время передаёт продолжающееся движение и согласуется с живым повествовательным настоящим.
- source_word: σκεῦός τι
  choice: нечто
  rationale: Сочетание намеренно неопределённо; «сосуд» или «предмет» чрезмерно конкретизировали бы вид и назначение увиденного.
- source_word: ὡς ὀθόνην μεγάλην
  choice: похожее на большое полотно
  rationale: «Полотно» естественно передаёт широкое значение ὀθόνη без неподтверждённого уточнения материала; оборот сохраняет сравнительный характер ὡς.
- source_word: τέσσαρσιν ἀρχαῖς
  choice: за четыре угла
  rationale: Хотя ἀρχή здесь может обозначать края или концы, применительно к полотну по-русски наиболее естественно сказать «четыре угла».
- source_word: καθιέμενον
  choice: его опускают
  rationale: Личная неопределённая конструкция естественно передаёт пассивное причастие и сохраняет различие между общим движением вниз и тем, что предмет опускают.
- source_word: ἐπὶ τῆς γῆς
  choice: на землю
  rationale: При глаголе движения сочетание указывает направление вниз, к земле; русский винительный падеж передаёт это естественно.
theological_decisions:
- issue: Значение οὐρανός в видении
  choice: небо
  alternative: небосвод
  rationale: «Небо» сохраняет присущую греческому слову смысловую широту и уместно в сцене божественного откровения; «небосвод» сузил бы смысл до видимого пространства над землёй.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным тоном, соответствующим описанию видения. Синтаксис сделан естественным для русского: греческая конструкция с винительным падежом и причастием передана придаточными с «что», а два обозначения движения сохранены без искусственной тяжеловесности.'
