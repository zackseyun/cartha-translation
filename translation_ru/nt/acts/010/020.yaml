  text: ἀλλὰ ἀναστὰς κατάβηθι καὶ πορεύου σὺν αὐτοῖς μηδὲν διακρινόμενος, ⸀ὅτι ἐγὼ ἀπέσταλκα αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/020.yaml
  text: But get up[a], go down, and go with them, doubting nothing, because I have sent them.
translation:
  language: ru
  text: Но встань, спустись и иди с ними, ни в чём не сомневаясь[a], потому что Я послал их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не делая никакого различия». Греческое выражение может означать как отсутствие сомнений или колебаний, так и отказ проводить различие; второй смысл может перекликаться с темой отношений между иудеями и язычниками в этой главе.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт противопоставление прежнему недоумению Петра и переход к прямому повелению.
- source_word: ἀναστὰς
  choice: встань
  rationale: Аористное причастие употреблено в последовательности повелений; «встань» естественно и кратко передаёт побуждение немедленно действовать.
- source_word: κατάβηθι
  choice: спустись
  rationale: Сохраняет направление движения вниз с крыши, где находился Пётр.
- source_word: πορεύου σὺν αὐτοῖς
  choice: иди с ними
  rationale: Естественно передаёт повеление отправиться вместе с пришедшими людьми.
- source_word: μηδὲν διακρινόμενος
  choice: ни в чём не сомневаясь
  rationale: В ближайшем контексте выражение указывает на устранение сомнений и колебаний Петра; формулировка также сохраняет значение сомнения, возможное у διακρίνω.
- source_word: ὅτι
  choice: потому что
  rationale: 'Ясно передаёт причинную связь: Пётр должен пойти, поскольку этих людей послал Дух.'
- source_word: ἐγὼ ἀπέσταλκα αὐτούς
  choice: Я послал их
  rationale: Явное ἐγώ передано местоимением «Я», а совершенный вид «послал» естественно выражает завершённое действие с актуальным результатом.
theological_decisions:
- issue: Значение μηδὲν διακρινόμενος в связи с принятием язычников
  choice: 'В основном тексте: «ни в чём не сомневаясь»'
  alternative: «не делая никакого различия»
  rationale: Ближайший контекст подчёркивает недоумение и возможное колебание Петра, тогда как тема всей главы допускает смысл отказа от различения между иудеями и язычниками. Альтернативный смысл сохранён в сноске, чтобы не устранять намеренно эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с краткой, естественной последовательностью повелений. Заглавное «Я» указывает на говорящего Бога и одновременно помогает передать подчёркнутое греческое ἐγώ. Сноска поставлена непосредственно после двусмысленного выражения, а не после «встань».
