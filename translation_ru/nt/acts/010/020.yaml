  source_fidelity: Текст точно передаёт последовательность повелений ἀναστὰς κατάβηθι καὶ πορεύου и направление κατάβηθι («спустись»). «Ни в чём не сомневаясь» естественно передаёт основной контекстуальный смысл μηδὲν διακρινόμενος — не колебаться/не медлить; причинное «потому что Я послал их» верно отражает ὅτι ἐγὼ ἀπέσταλκα αὐτούς. Смысловой оттенок совершенного ἀπέσταλκα не требует в русском специального перфектного оформления.
  naturalness: 'Фраза краткая, ясная и литературно естественная для современного русского: «Но встань, спустись и иди с ними…». Деепричастный оборот согласован с подразумеваемым адресатом и не создаёт двусмысленности.'
  terminology: «Сомневаясь» уместно для ближайшего контекста недоумения Петра. Альтернативное значение διακρίνω, связанное с проведением различия, корректно сохранено в сноске без догматического сужения. «Иудеи и язычники» — нейтральные и точные историко-контекстуальные обозначения. Заглавное «Я» соответствует принятому русскому библейскому оформлению прямой речи Бога.
