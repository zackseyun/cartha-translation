id: ACT.10.24
reference: Acts 10:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸂τῇ δὲ⸃ ἐπαύριον ⸀εἰσῆλθεν εἰς τὴν Καισάρειαν. ὁ δὲ Κορνήλιος ἦν προσδοκῶν αὐτοὺς συγκαλεσάμενος τοὺς συγγενεῖς αὐτοῦ καὶ τοὺς ἀναγκαίους φίλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/024.yaml
  text: On the next day he entered Caesarea[a]. Now Cornelius was expecting them and had called together his relatives and close friends.
translation:
  language: ru
  text: На следующий день он вошёл в Кесарию.[a] А Корнилий ждал их, созвав своих родственников и близких друзей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте глагол «вошёл» стоит в единственном числе, а далее употреблено местоимение множественного числа «их». Вероятно, Пётр выделен как главный участник, тогда как Корнилий ожидал и его спутников.
    reason: textual_variant
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: На следующий день
  rationale: Естественно передаёт временное выражение и последовательность повествования; частица δέ отдельно не переводится, поскольку переход ясен из контекста.
- source_word: εἰσῆλθεν
  choice: он вошёл
  rationale: Сохранено единственное число греческого аориста; местоимение «он» указывает на Петра как главного участника движения.
- source_word: Καισάρειαν
  choice: Кесарию
  rationale: Устоявшаяся русская форма названия города с требуемым винительным падежом.
- source_word: ὁ δὲ Κορνήλιος
  choice: А Корнилий
  rationale: «А» естественно отмечает мягкую смену фокуса повествования без усиленного противопоставления.
- source_word: ἦν προσδοκῶν αὐτούς
  choice: ждал их
  rationale: Передаёт продолженное ожидание, выраженное перифрастическим имперфектом, и сохраняет множественное число αὐτούς.
- source_word: συγκαλεσάμενος
  choice: созвав
  rationale: Деепричастие кратко и естественно передаёт предшествующее действие аористного причастия, не превращая его в отдельное главное событие.
- source_word: τοὺς συγγενεῖς αὐτοῦ
  choice: своих родственников
  rationale: Современное и точное обозначение родных и родственников; возвратное «своих» естественно соотносится с подлежащим Корнилием.
- source_word: τοὺς ἀναγκαίους φίλους
  choice: близких друзей
  rationale: В сочетании с φίλους прилагательное ἀναγκαίους означает близких, тесно связанных друзей, а не буквально «необходимых».
theological_decisions:
- issue: Единственное число εἰσῆλθεν при последующем множественном αὐτούς
  choice: Сохранены «он вошёл» и «ждал их»
  alternative: «Они вошли» либо «ждал его»
  rationale: 'Так сохраняется грамматическая напряжённость исходного текста: Пётр выделен как главный действующий участник, но Корнилий ожидает всю прибывающую группу.'
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное. Сохранена смена фокуса через «А Корнилий» и формальная особенность числа без искусственного выравнивания.
