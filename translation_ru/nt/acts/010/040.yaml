  source_fidelity: «Его Бог воскресил на третий день» точно передаёт божественное действие ἤγειρεν и временное обстоятельство τῇ τρίτῃ ἡμέρᾳ. Начальная позиция «Его» естественно воспроизводит выделение, создаваемое вынесенным τοῦτον, хотя русское личное местоимение не передаёт указательность буквально; это надлежащим образом пояснено в сноске. «Дал ему явиться» удачно передаёт ἔδωκεν αὐτὸν ἐμφανῆ γενέσθαι как предоставление/осуществление явления, не превращая конструкцию в более сильное «заставил» и не сводя её к одному лишь физическому свойству видимости.
  naturalness: Текст звучит ясно, современно и литературно. Инверсия «Его Бог воскресил» уместна в торжественно-повествовательном библейском регистре и не создаёт двусмысленности. «Дал ему явиться» естественно по-русски и лучше буквального, но тяжеловесного «дал ему стать видимым».
  terminology: «Бог воскресил» — установленная и точная русская формулировка для воскресения; «на третий день» также нормативно. Сноска b корректно сохраняет буквальный оттенок «стать видимым» и альтернативу «сделал его явным», не навязывая богословской интерпретации.
