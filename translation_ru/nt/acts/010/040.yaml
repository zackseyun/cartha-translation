lexical_decisions:
- source_word: τοῦτον
  choice: Его
  rationale: Вынесенное в начало указательное местоимение подчёркивает именно ранее названного Иисуса. В русском начальная позиция «Его» сохраняет это выделение естественнее, чем буквальное «этого».
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Прямое обозначение подлежащего; артикль в русском не передаётся.
- source_word: ἤγειρεν
  choice: воскресил
  rationale: В контексте воскресения ἐγείρω означает поднять из мёртвых; «воскресил» ясно и естественно передаёт действие Бога, не добавляя деталей.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: на третий день
  rationale: Дательный времени естественно передаётся устойчивым русским выражением «на третий день», без уточнения способа счёта дней.
- source_word: ἔδωκεν
  choice: дал
  rationale: Сохраняет явную семантику δίδωμι и конструкцию предоставления/осуществления возможности, не усиливая её до однозначного «заставил».
- source_word: αὐτὸν
  choice: ему
  rationale: Русская конструкция «дал ему явиться» требует дательного падежа и относится к Иисусу.
- source_word: ἐμφανῆ γενέσθαι
  choice: явиться
  rationale: Естественно передаёт становление явным или видимым после воскресения. Буквальное «стать видимым» по-русски звучит так, будто изменилось физическое свойство тела, тогда как «явиться» сохраняет смысл проявления перед свидетелями.
theological_decisions:
- issue: Действие Бога в воскресении Иисуса
  choice: Бог воскресил
  alternative: Бог поднял из мёртвых
  rationale: Текст прямо называет Бога действующим лицом воскресения. «Воскресил» сохраняет это утверждение кратко и без богословских добавлений.
- issue: Явление воскресшего Иисуса
  choice: дал ему явиться
  alternative: сделал его видимым
  rationale: Формулировка сохраняет различие между воскресением и последующим явлением, а также необычную конструкцию с ἔδωκεν, не решая сверх текста вопрос о точном оттенке дозволения или причинения.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Начальное «Его» передаёт акцент греческого τοῦτον без неестественного «этого». «Дал ему явиться» сохраняет необычную образность оригинала, но остаётся понятным обычному читателю.
