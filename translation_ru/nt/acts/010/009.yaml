revisions:
- from: На следующий день, когда они были в пути и уже приближались к городу, Пётр около шестого часа[a] поднялся на крышу дома помолиться.
  to: На следующий день, когда те люди были в пути и приближались к городу, Пётр около шестого часа поднялся на крышу дома, чтобы помолиться.
  rationale: Убрано не выраженное в оригинале усиление «уже»; «они» заменено на «те люди» для более точной передачи ἐκείνων. Сноска сохранена и слегка отредактирована стилистически. Маркер [a] следует поставить после слов «шестого часа» в основном тексте.
