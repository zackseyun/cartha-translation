  text: Τῇ δὲ ἐπαύριον ὁδοιπορούντων ἐκείνων καὶ τῇ πόλει ἐγγιζόντων ἀνέβη Πέτρος ἐπὶ τὸ δῶμα προσεύξασθαι περὶ ὥραν ἕκτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/009.yaml
  text: On the next day[a], while those men were traveling and drawing near to the city, Peter went up on the housetop to pray, about the sixth hour.
translation:
  language: ru
  text: На следующий день, когда те люди были в пути и приближались к городу, Пётр около шестого часа поднялся на крышу дома, чтобы помолиться.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: На следующий день
  rationale: Естественно передаёт временное выражение; лёгкая связующая функция δέ в русском повествовании не требует отдельного слова.
- source_word: ὁδοιπορούντων ἐκείνων
  choice: когда они были в пути
  rationale: Передаёт одновременность генитивного абсолютного оборота; местоимение естественно отсылает к посланным Корнилием людям из контекста.
- source_word: καὶ τῇ πόλει ἐγγιζόντων
  choice: и уже приближались к городу
  rationale: Сохраняет второе одновременное действие; «уже» естественно выражает достижение стадии приближения, не меняя основного смысла.
- source_word: ἀνέβη
  choice: поднялся
  rationale: Обычный русский глагол движения вверх, подходящий для выхода на плоскую крышу.
- source_word: ἐπὶ τὸ δῶμα
  choice: на крышу дома
  rationale: Ясно обозначает доступную плоскую крышу жилого дома и звучит естественнее, чем архаичное «на кровлю».
- source_word: προσεύξασθαι
  choice: помолиться
  rationale: Инфинитив цели; совершенный вид естественно соответствует целостно представленному намерению.
- source_word: περὶ ὥραν ἕκτην
  choice: около шестого часа
  rationale: Сохраняет исходный способ отсчёта времени и приблизительность περί; пояснение вынесено в сноску.
theological_decisions: []
