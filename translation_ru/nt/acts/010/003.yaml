id: ACT.10.3
reference: Acts 10:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἶδεν ἐν ὁράματι φανερῶς ὡσεὶ ⸀περὶ ὥραν ἐνάτην τῆς ἡμέρας ἄγγελον τοῦ θεοῦ εἰσελθόντα πρὸς αὐτὸν καὶ εἰπόντα αὐτῷ· Κορνήλιε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/003.yaml
  text: He saw clearly in a vision[a], about the ninth hour of the day, an angel of God coming in to him and saying to him[b], “Cornelius.”
translation:
  language: ru
  text: 'Он ясно[b] увидел в видении, около девятого часа дня[a], как к нему вошёл ангел Божий и сказал ему: «Корнилий!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть примерно в три часа дня по современному исчислению времени.
    reason: cultural_note
  - marker: b
    text: 'Или: «явственно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: увидел
  rationale: Аорист ὁράω передаёт завершённое событие повествования; «увидел» естественно и сохраняет конкретность зрительного восприятия.
- source_word: ἐν ὁράματι
  choice: в видении
  rationale: ὅραμα обозначает сверхъестественное видение; нейтральное «в видении» не уточняет его природу сверх сказанного в тексте.
- source_word: φανερῶς
  choice: ясно
  rationale: Наречие подчёркивает отчётливость и несомненность увиденного. «Ясно» кратко и естественно; возможный вариант отмечен в сноске.
- source_word: ὡσεὶ περὶ ὥραν ἐνάτην τῆς ἡμέρας
  choice: около девятого часа дня
  rationale: Сохранён древний способ отсчёта часов, а сочетание ὡσεὶ и περὶ передано словом «около». Современный временной эквивалент дан в сноске.
- source_word: ἄγγελον τοῦ θεοῦ
  choice: ангел Божий
  rationale: В контексте видения ἄγγελος означает небесного посланника. Традиционное и понятное русское сочетание «ангел Божий» точно передаёт родительный оборот.
- source_word: εἰσελθόντα πρὸς αὐτὸν
  choice: как к нему вошёл
  rationale: Причастие εἰσελθόντα выражает вхождение в присутствие Корнилия. Русская придаточная конструкция естественнее буквального причастного оборота и сохраняет движение внутрь.
- source_word: καὶ εἰπόντα αὐτῷ
  choice: и сказал ему
  rationale: Второе согласованное причастие естественно преобразовано в однородное сказуемое внутри придаточной конструкции, без изменения последовательности действий.
- source_word: Κορνήλιε
  choice: Корнилий
  rationale: Передана звательная функция формы Κορνήλιε; в современном русском имя употребляется в форме именительного падежа, а обращение обозначено пунктуацией.
theological_decisions:
- issue: Природа ἄγγελος в данном контексте
  choice: небесный ангел
  alternative: человек-посланник
  rationale: Видение и определение «Божий» в ближайшем контексте указывают на сверхъестественного вестника; дополнительных богословских характеристик перевод не вводит.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан естественным для русского: греческие причастия переданы придаточной конструкцией. Исторический способ обозначения времени сохранён в основном тексте и пояснён в сноске.'
