lexical_decisions:
- source_word: τοῦτο
  choice: Это
  rationale: Указательное местоимение отсылает ко всему только что описанному действию; русское «это» естественно сохраняет такую отсылку.
- source_word: δὲ
  choice: и
  rationale: Здесь δέ служит мягкой повествовательной связкой; союз «и» естественно соединяет повторение видения с последующим поднятием предмета.
- source_word: ἐγένετο
  choice: произошло
  rationale: Передаёт событийное значение γίνομαι в нейтральном современном повествовательном стиле.
- source_word: ἐπὶ τρίς
  choice: трижды
  rationale: Точно и естественно выражает троекратное повторение действия.
- source_word: εὐθὺς
  choice: тотчас
  rationale: Сохраняет значение немедленности и соответствует достоинству библейского повествования, не будучи непонятным современному читателю.
- source_word: ἀνελήμφθη
  choice: было поднято
  rationale: Сохраняет страдательный залог и направленное вверх движение, не уточняя неназванного деятеля.
- source_word: τὸ σκεῦος
  choice: вместилище
  rationale: σκεῦος — широкое обозначение сосуда, вместилища или предмета. «Вместилище» сохраняет идею содержащего предмета и не подменяет употреблённое здесь слово более конкретным «полотно».
- source_word: εἰς τὸν οὐρανόν
  choice: на небо
  rationale: Естественно передаёт направленное движение и сохраняет свойственную οὐρανός возможность понимать слово как небо или небесную сферу.
theological_decisions:
- issue: Значение οὐρανός в видении Петра
  choice: небо
  alternative: видимое небо; небесная сфера
  rationale: Русское «небо», как и греческое οὐρανός, допускает оба оттенка. Контекст видения предполагает небесную сферу, однако перевод не устраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким и достойным повествовательным строем. Формулировка сохраняет пассив греческого текста, лексическую широту σκεῦος и неоднозначность οὐρανός.
