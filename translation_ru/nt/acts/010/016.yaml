  text: Это произошло трижды, и тотчас этот предмет[a] был поднят на небо[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сосуд»; с учётом описания в стихе 11 — «полотно». Греческое слово имеет широкое значение: сосуд, предмет или утварь.'
