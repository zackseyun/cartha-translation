source:
  edition: SBLGNT
  text: Μήτι τὸ ὕδωρ ⸂δύναται κωλῦσαί⸃ τις τοῦ μὴ βαπτισθῆναι τούτους οἵτινες τὸ πνεῦμα τὸ ἅγιον ἔλαβον ⸀ὡς καὶ ἡμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/047.yaml
  text: Surely no one can withhold the water so that these people should not be baptized[b][a], can they? For they have received the Holy Spirit just as we have.
translation:
  language: ru
  text: Разве может кто-нибудь отказать этим людям в воде для крещения — им, получившим Святого Духа так же, как и мы?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μήτι
  choice: Разве
  rationale: Частица вводит риторический вопрос, предполагающий отрицательный ответ; «разве» естественно передаёт эту силу по-русски.
- source_word: τὸ ὕδωρ
  choice: в воде для крещения
  rationale: Определённое выражение указывает на воду, предназначенную для крещения; добавление «для крещения» делает связь ясной без изменения смысла.
- source_word: δύναται κωλῦσαί τις
  choice: может кто-нибудь отказать
  rationale: κωλύω здесь означает воспрепятствовать или не допустить; при объекте «вода» русское «отказать в воде» естественно выражает недопущение к водному крещению.
- source_word: τοῦ μὴ βαπτισθῆναι
  choice: для крещения этим людям
  rationale: Конструкция обозначает предотвращаемое действие — не дать этим людям креститься. Русская формулировка сохраняет эту связь и избегает тяжеловесного буквального оборота.
- source_word: τούτους οἵτινες
  choice: этим людям, которые
  rationale: «Людям» естественно обозначает группу лиц, а относительное местоимение сохраняет характеристику группы через получение Духа.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Святого Духа
  rationale: Устоявшееся современное русское обозначение, сохраняющее личностный и богословский смысл выражения.
- source_word: ἔλαβον
  choice: получили
  rationale: Совершенный вид передаёт завершённое получение Духа, имеющее значение для настоящего довода Петра.
- source_word: ὡς καὶ ἡμεῖς
  choice: так же, как и мы
  rationale: Формулировка ясно сохраняет прямое сопоставление их опыта с опытом говорящего и его группы.
theological_decisions:
- issue: Соотношение получения Святого Духа и водного крещения
  choice: Текст прямо говорит, что эти люди уже получили Святого Духа, и это служит основанием не препятствовать их водному крещению.
  alternative: Сформулировать стих так, чтобы временная и логическая последовательность получения Духа и крещения была неясна.
  rationale: Греческий текст представляет получение Духа как уже совершившееся событие и как довод в пользу последующего крещения; перевод сохраняет эту повествовательную и богословскую напряжённость, не навязывая конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; риторический вопрос звучит естественно и достойно. Формулировка остаётся одним предложением, как в греческом тексте, и сохраняет причинно-аргументативную связь между получением Духа и допущением к крещению.
