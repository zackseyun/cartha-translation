  terminology: «Господин» допустимо как почтительное обращение к небесному вестнику и не навязывает христологического смысла; строчная буква уместна в этом контексте. «Милостыни» передаёт греческое множественное число ἐλεημοσύναι; сноска удачно поясняет, что речь прежде всего о помощи нуждающимся.
