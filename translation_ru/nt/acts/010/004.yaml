  source_fidelity: 'Начало стиха передано в целом точно: ἀτενίσας — «пристально посмотрел», а ἔμφοβος γενόμενος — «испугавшись». Однако в заключительной фразе исходное «вознеслись как памятование перед Богом» заменено на «вознеслись к Богу и стали напоминанием о тебе»: это ослабляет ἔμπροσθεν τοῦ θεοῦ («перед Богом») и добавляет отсутствующее в тексте «о тебе». Также «Ангел ответил» вводит существительное, которого в данном стихе нет: греческий текст повторяет лишь «он сказал ему».'
