  text: But he stared at him[a], and becoming afraid, said, “What is it, Lord?” And he said to him, “Your prayers and your acts of mercy have gone up as a memorial before God.”
translation:
  language: ru
  text: 'Он пристально посмотрел на него и, испугавшись, сказал: «Что это, господин?» Тот сказал ему: «Твои молитвы и милостыни[a] вознеслись как памятование перед Богом».'
