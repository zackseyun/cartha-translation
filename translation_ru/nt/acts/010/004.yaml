lexical_decisions:
- source_word: ἀτενίσας
  choice: пристально посмотрел
  rationale: Передаёт сосредоточенный, неотрывный взгляд естественным современным русским языком.
- source_word: ἔμφοβος γενόμενος
  choice: испугавшись
  rationale: Сохраняет значение перехода в состояние страха, не усиливая его до ужаса.
- source_word: Τί ἐστιν
  choice: Что такое?
  rationale: Краткий и естественный вопрос о происходящем или о цели явления.
- source_word: κύριε
  choice: Господин
  rationale: В данном контексте это почтительное обращение к ангелу; вариант сохраняет уважительный тон, не превращая реплику Корнилия в однозначное исповедание божественности собеседника.
- source_word: προσευχαί
  choice: молитвы
  rationale: Прямое и обычное соответствие греческому слову.
- source_word: ἐλεημοσύναι
  choice: милостыня
  rationale: В контексте обозначает благотворительные пожертвования нуждающимся; русское собирательное единственное число звучит естественно.
- source_word: ἀνέβησαν
  choice: вознеслись
  rationale: Сохраняет образ восхождения молитв и даров к Богу, включая его жертвенные ассоциации.
- source_word: εἰς μνημόσυνον
  choice: стали напоминанием о тебе
  rationale: Передаёт значение того, что молитвы и милостыня привели к памятованию Корнилия перед Богом, не вводя в основной текст более специальный культовый термин.
- source_word: ἔμπροσθεν τοῦ θεοῦ
  choice: к Богу
  rationale: В сочетании с «вознеслись» естественно выражает направленность и пребывание перед Богом; значение Божьего присутствия раскрывается всей фразой.
theological_decisions:
- issue: Сила обращения κύριε к небесному вестнику
  choice: Господин
  alternative: Господи
  rationale: Непосредственный собеседник далее определяется как ангел (Деян. 10:7). «Господин» передаёт почтительное обращение, сохраняя контекстуальную неоднозначность и не приписывая Корнилию здесь явного христологического исповедания.
- issue: Смысл εἰς μνημόσυνον перед Богом
  choice: стали напоминанием о тебе
  alternative: как памятная жертва перед Богом
  rationale: Фраза перекликается с языком памятной части приношения, однако сам стих прямо не называет молитвы и милостыню жертвой. Выбранный вариант сохраняет идею памятования Богом без излишнего уточнения механизма.
translation_notes:
  register: Современный литературный русский язык с dignified narrative register. Причастные конструкции упрощены ради естественности. Подлежащее второй реплики названо прямо («Ангел»), поскольку русское «он» после двух мужских участников могло бы быть двусмысленным; личность говорящего ясна из ближайшего контекста.
