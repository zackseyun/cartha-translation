  text: προσέταξεν ⸀δὲ αὐτοὺς ⸂ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ βαπτισθῆναι⸃. τότε ἠρώτησαν αὐτὸν ἐπιμεῖναι ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/048.yaml
  text: So he ordered them to be baptized in the name of Jesus the Messiah[a]. Then they asked him to remain for some days.
translation:
  language: ru
  text: И он велел крестить их во имя Иисуса, Мессии[a]. Тогда они попросили его остаться у них на несколько дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в более традиционной передаче: «Иисуса Христа».'
    reason: Альтернативная традиционная передача титула Χριστός.
lexical_decisions:
- source_word: προσέταξεν
  choice: велел
  rationale: Глагол передаёт властное распоряжение; «велел» ясно и естественно выражает эту силу в современном русском языке, не создавая излишне официального оттенка.
- source_word: δὲ
  choice: И
  rationale: Здесь частица продолжает повествование, а не обозначает резкое противопоставление. Союз «и» естественно связывает этот поступок Петра с предшествующими событиями.
- source_word: ἐν τῷ ὀνόματι
  choice: во имя
  rationale: Устоявшееся библейское выражение сохраняет смысловую широту греческой фразы, которая может включать власть, принадлежность и исповедание, не сводя её лишь к одному толкованию.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός здесь сохраняет титульный смысл — «Помазанник, Мессия». Форма «Иисуса Мессии» грамматически естественна по-русски и не превращает титул в фамилию.
- source_word: βαπτισθῆναι
  choice: крестить их
  rationale: Греческий страдательный инфинитив вместе с местоимением αὐτούς естественно передаётся русской конструкцией «велел крестить их»; она сохраняет крещение как действие, совершаемое над ними, и не уточняет способ обряда сверх текста.
- source_word: τότε
  choice: Тогда
  rationale: Наречие обозначает следующий момент в последовательности событий; «тогда» точно и естественно передаёт повествовательный переход.
- source_word: ἠρώτησαν
  choice: попросили
  rationale: В данном контексте глагол означает просьбу, а не вопрос. «Попросили» ясно передаёт значение без усиления настойчивости.
- source_word: ἐπιμεῖναι
  choice: остаться у них
  rationale: Глагол означает продолжить пребывание. Добавление естественного по-русски «у них» выражает очевидное из контекста место пребывания, не меняя смысла.
- source_word: ἡμέρας τινάς
  choice: на несколько дней
  rationale: Фраза указывает на неопределённый, ограниченный срок. «На несколько дней» звучит естественно и не задаёт точного количества.
theological_decisions:
- issue: Передача Χριστοῦ в формуле крещения
  choice: Мессии
  alternative: Христа
  rationale: В сочетании с именем Иисуса слово сохраняет исповедальный титульный смысл «Мессия». Традиционная форма «Христос» также возможна и приведена в сноске, чтобы не скрывать сложившийся вариант передачи.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис краткий и ясный; сохранены повествовательная последовательность, властный характер распоряжения и титульное значение слова «Мессия».
