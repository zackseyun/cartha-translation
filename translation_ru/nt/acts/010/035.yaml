base_translation:
  language: en
  yaml_path: translation/nt/acts/010/035.yaml
  text: but in every nation the one who fears him and does what is righteous is acceptable to him[a][b][c].
translation:
  language: ru
  text: но в каждом народе тот, кто боится Его и поступает праведно, угоден Ему[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «творит праведность»; возможно также: «поступает справедливо».'
