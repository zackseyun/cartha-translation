  - marker: b
    text: 'Или: «принят Им».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’
  choice: но
  rationale: Естественно передаёт противопоставление предыдущему утверждению о нелицеприятии Бога.
- source_word: ἐν παντὶ ἔθνει
  choice: в каждом народе
  rationale: Сохраняет распределительное значение παντί и обычное значение ἔθνος, не сводя его к современному государству или узко понимаемой этнической группе.
- source_word: ὁ φοβούμενος αὐτὸν
  choice: тот, кто боится Его
  rationale: Передаёт субстантивированное причастие и сохраняет библейское понятие благоговейного страха перед Богом без гендерного ограничения.
- source_word: καὶ ἐργαζόμενος δικαιοσύνην
  choice: и поступает праведно
  rationale: Естественная современная русская передача деятельного поведения; сохраняет нравственный смысл δικαιοσύνη, не сужая его до одного отдельного поступка.
- source_word: δεκτὸς αὐτῷ ἐστιν
  choice: угоден Ему
  rationale: Передаёт предикативное δεκτός как благоприятную оценку и принятие Богом. Возможная более буквальная передача отмечена в сноске.
theological_decisions:
- issue: Говорит ли стих о заслуженном делами спасении или характеризует людей, которых Бог принимает независимо от их народа
  choice: Сохранена прямая связь между страхом Божьим, праведными поступками и тем, что человек угоден Богу, без дополнительного догматического объяснения.
  alternative: «Заслуживает принятия Богом» либо интерпретирующее «тем самым показывает спасительную веру».
  rationale: Греческий текст утверждает, что такой человек δεκτός Богу, но не употребляет языка заслуги и не объясняет в этом стихе отношение данного утверждения к более широкой сотериологии.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Местоимение «Его/Ему» написано с прописной буквы по принятой русской библейской традиции; синтаксис остаётся доступным широкому читателю.
