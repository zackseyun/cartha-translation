  yaml_path: translation/nt/acts/010/019.yaml
  text: While Peter was still pondering the vision, the Spirit said to him, “Look, men are seeking you.”
translation:
  language: ru
  text: 'Пока Пётр размышлял о видении, Дух сказал ему: «Вот, тебя ищут мужчины».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διενθυμουμένου
  choice: размышлял
  rationale: Глагол передаёт продолжающееся углублённое обдумывание. Несовершенный вид естественно выражает длительность; отдельное «всё ещё» в греческом прямо не обозначено.
- source_word: περὶ τοῦ ὁράματος
  choice: о видении
  rationale: Сохраняет предложную конструкцию и ясно называет предмет размышления.
- source_word: τὸ πνεῦμα
  choice: Дух
  rationale: В контексте Деяний речь идёт о Божьем Духе; прописная буква передаёт этот референт, не добавляя отсутствующего в данном стихе определения «Святой».
- source_word: εἶπεν αὐτῷ
  choice: сказал ему
  rationale: Прямой и естественный эквивалент греческой конструкции.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Современный русский указательный маркер, привлекающий внимание без архаического оттенка.
- source_word: ἄνδρες
  choice: люди
  rationale: В данном сообщении речь о нескольких мужчинах, однако русское «мужчины» перед дверью звучало бы менее естественно; «люди» идиоматично обозначает пришедших, не отрицая их пола.
- source_word: ζητοῦντές σε
  choice: тебя ищут
  rationale: Естественная русская передача поиска конкретного человека; порядок слов сохраняет акцент на адресате.
theological_decisions:
- issue: Референт τὸ πνεῦμα
  choice: Дух как Божий Дух, говорящий Петру
  alternative: неопределённый дух или внутреннее побуждение
  rationale: Контекст Деян 10 изображает Духа как действующего и говорящего субъекта, направляющего Петра. Перевод не добавляет слово «Святой», которого здесь нет.
- issue: Передача ἄνδρες
  choice: люди
  alternative: мужчины
  rationale: Греческое слово указывает на лиц мужского пола, но в этой реплике современное русское «люди» является естественным обозначением пришедших. Сноска сохраняет точную гендерную информацию исходного слова.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным тоном. «Вот» передаёт Ἰδοὺ без архаизации; синтаксис рассчитан на естественное чтение вслух.
