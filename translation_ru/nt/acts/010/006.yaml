  text: οὗτος ξενίζεται παρά τινι Σίμωνι βυρσεῖ, ᾧ ἐστιν οἰκία παρὰ θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/006.yaml
  text: He is lodging with a certain Simon[a], a tanner, whose house is by the sea.
translation:
  language: ru
  text: Он гостит у некоего Симона, кожевника, чей дом находится у моря.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ξενίζεται
  choice: гостит
  rationale: Форма ξενίζω здесь означает, что Пётр принят как гость и временно живёт у кого-либо; «гостит» естественно и кратко передаёт этот смысл.
- source_word: παρά τινι
  choice: у некоего
  rationale: παρά с дательным указывает на пребывание у человека, а τις сохраняет неопределённость; «у некоего» точно и естественно передаёт сочетание.
- source_word: Σίμωνι
  choice: Симона
  rationale: Имя передано в традиционной русской библейской форме и поставлено в требуемом управлением родительном падеже.
- source_word: βυρσεῖ
  choice: кожевника
  rationale: βυρσεύς обозначает ремесленника, который обрабатывает шкуры и выделывает кожу; «кожевник» — точный и понятный современный эквивалент.
- source_word: ᾧ ἐστιν οἰκία
  choice: чей дом находится
  rationale: Относительная конструкция указывает, что дом принадлежит Симону; формулировка сохраняет структуру связи и естественно звучит по-русски.
- source_word: παρὰ θάλασσαν
  choice: у моря
  rationale: παρά с винительным выражает близость к морю; «у моря» лаконично и идиоматично передаёт местоположение.
- source_word: οὗτος
  choice: Он
  rationale: Указательное местоимение отсылает к Петру; в современном русском контексте естественно употребить личное местоимение.
