id: ACT.10.43
reference: Acts 10:43
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τούτῳ πάντες οἱ προφῆται μαρτυροῦσιν, ἄφεσιν ἁμαρτιῶν λαβεῖν διὰ τοῦ ὀνόματος αὐτοῦ πάντα τὸν πιστεύοντα εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/043.yaml
  text: All the prophets testify about him that everyone who believes in him receives forgiveness of sins through his name[a].
translation:
  language: ru
  text: 'О Нём свидетельствуют все пророки: каждый, кто верит в Него, получает прощение грехов через Его имя.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτῳ
  choice: о Нём
  rationale: Дательный падеж при μαρτυροῦσιν обозначает того, о ком даётся свидетельство; по-русски естественно «свидетельствовать о Нём».
- source_word: πάντες οἱ προφῆται
  choice: все пророки
  rationale: Передаёт универсальный характер пророческого свидетельства; речь идёт о пророках и их свидетельстве в Писании.
- source_word: μαρτυροῦσιν
  choice: свидетельствуют
  rationale: Точно и естественно сохраняет доказательный оттенок греческого глагола.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: прощение грехов
  rationale: Устоявшийся и понятный перевод новозаветного выражения, сохраняющий смысл освобождения от вины грехов.
- source_word: λαβεῖν
  choice: получает
  rationale: Инфинитив выражает содержание свидетельства пророков; личная форма в русском языке естественно передаёт общее утверждение.
- source_word: διὰ τοῦ ὀνόματος αὐτοῦ
  choice: через Его имя
  rationale: Сохраняет библейскую идиому и значение посредства, не добавляя толкования об авторитете или власти.
- source_word: πάντα τὸν πιστεύοντα
  choice: каждый, кто верит
  rationale: Мужской род причастия имеет обобщающее и распределительное значение; русский оборот относится ко всякому человеку без ограничения по полу.
- source_word: εἰς αὐτόν
  choice: в Него
  rationale: При πιστεύω предлог εἰς обозначает направленную на личность веру и доверие; «верить в Него» — естественный русский эквивалент.
theological_decisions:
- issue: Связь прощения, имени Иисуса и веры
  choice: Каждый верующий в Иисуса получает прощение грехов через Его имя.
  alternative: Доктринально расширить формулировку, объяснив механизм спасения.
  rationale: Перевод сохраняет прямо выраженную в тексте связь между Иисусом, верой и прощением, не привнося конфессиональных уточнений.
- issue: Обобщающее мужское причастие
  choice: каждый, кто верит
  alternative: каждый мужчина, который верит
  rationale: Греческая форма здесь родовая, а не исключающая женщин; «каждый, кто верит» точно передаёт всеобщий охват.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Заглавные буквы в местоимениях, относящихся к Иисусу, применены как уважительная издательская норма; двоеточие ясно вводит содержание пророческого свидетельства.
