base_translation:
  language: en
  yaml_path: translation/nt/acts/010/029.yaml
  text: Therefore I came without objection when I was sent for[a]. So I ask[b], for what reason did you send for me?
translation:
  language: ru
  text: 'Поэтому, когда за мной послали, я пришёл без возражений[a]. Итак, спрашиваю: по какой причине вы послали за мной?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «без колебаний». Буквально греческое слово означает «без возражений» или «не споря».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «зачем вы послали за мной?» Буквально: «по какой причине вы послали за мной?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего объяснения; усилительный оттенок καί естественно включён в связность русской фразы.
- source_word: ἀναντιρρήτως
  choice: без возражений
  rationale: 'Сохраняет основной смысл: не противясь и не оспаривая; это точнее греческого выражения, чем одно лишь «без колебаний».'
- source_word: ἦλθον
  choice: я пришёл
  rationale: Прямое и естественное соответствие аористу ἔρχομαι в данном контексте.
- source_word: μεταπεμφθείς
  choice: когда за мной послали
  rationale: Естественно передаёт пассивное причастие со значением «быть вызванным через посланных» и сохраняет связь с повторением того же глагольного корня далее.
- source_word: πυνθάνομαι οὖν
  choice: Итак, спрашиваю
  rationale: Передаёт значение вопроса или выяснения и переходную функцию οὖν.
- source_word: τίνι λόγῳ
  choice: по какой причине
  rationale: Сохраняет более полную формулировку греческого текста, не сокращая её до «зачем» или «почему».
- source_word: μετεπέμψασθέ με
  choice: вы послали за мной
  rationale: Точно передаёт значение «послать за кем-либо, вызвать» и сохраняет лексический повтор с первой частью стиха.
