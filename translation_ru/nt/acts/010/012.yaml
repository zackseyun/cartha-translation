lexical_decisions:
- source_word: ἐν ᾧ
  choice: В нём
  rationale: Относительное местоимение отсылает к большому полотну из предыдущего стиха; местоименное выражение естественно передаёт местное значение.
- source_word: ὑπῆρχεν
  choice: находились
  rationale: Имперфект ὑπάρχω обозначает наличие внутри увиденного предмета; «находились» сохраняет этот смысл без более сильного толкования «содержались».
- source_word: πάντα
  choice: всевозможные
  rationale: В сочетании с перечисленными разрядами животных слово выражает широкий, всеохватный состав; «всевозможные» по-русски естественнее, чем буквальное «все четвероногие».
- source_word: τὰ τετράποδα
  choice: четвероногие животные
  rationale: Прямое и понятное обозначение животных на четырёх ногах без книжного термина «четвероногие существа».
- source_word: ἑρπετὰ τῆς γῆς
  choice: пресмыкающиеся по земле
  rationale: Передаёт широкое значение ἑρπετά — ползающие существа — и сохраняет связь с землёй, не сужая слово до современной зоологической категории рептилий.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: небесные птицы
  rationale: В контексте перечня πετεινά естественно означает птиц, а τοῦ οὐρανοῦ указывает на воздушную, небесную сферу их обитания.
- source_word: καὶ ... καὶ
  choice: перечисление через запятую и союз «и»
  rationale: Нормальный русский синтаксис списка ясно передаёт координацию трёх групп, не воспроизводя механически каждый греческий союз.
