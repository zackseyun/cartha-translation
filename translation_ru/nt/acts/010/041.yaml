  text: οὐ παντὶ τῷ λαῷ ἀλλὰ μάρτυσι τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ, ἡμῖν, οἵτινες συνεφάγομεν καὶ συνεπίομεν αὐτῷ μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/041.yaml
  text: not to all the people[a], but to witnesses who had been chosen beforehand by God—to us[b], who ate and drank with him after he rose from the dead.
translation:
  language: ru
  text: не всему народу, а свидетелям, заранее избранным[a] Богом, — нам, тем, кто ел и пил с ним после того, как он воскрес[b] из мёртвых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заранее назначенным Богом».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «после того, как он был воскрешён из мёртвых». Греческий текст здесь естественно передаётся словами «он воскрес из мёртвых», хотя в других местах Нового Завета употребляется страдательная формулировка.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ παντὶ τῷ λαῷ
  choice: не всему народу
  rationale: Передаёт охват отрицания и сохраняет противопоставление всему народу и ограниченному кругу свидетелей.
- source_word: μάρτυσι
  choice: свидетелям
  rationale: Обычное и ясное русское обозначение тех, кто лично видел событие и может о нём свидетельствовать.
- source_word: τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ
  choice: заранее избранным Богом
  rationale: Перфектное страдательное причастие указывает на совершённый прежде Божий выбор, сохраняющий значение в описываемый момент; «избранным» естественно в данном контексте, а значение назначения отмечено в сноске.
- source_word: ἡμῖν
  choice: нам
  rationale: Дательное местоимение поясняет, кто именно является этими свидетелями; тире естественно передаёт приложение.
- source_word: οἵτινες
  choice: тем, кто
  rationale: Оборот естественно вводит характеристику названной группы свидетелей и избегает тяжёлого русского «нам, которые».
- source_word: συνεφάγομεν καὶ συνεπίομεν αὐτῷ
  choice: кто ел и пил с ним
  rationale: Сохраняет конкретное указание на совместную трапезу и тем самым на телесную реальность встречи после воскресения.
- source_word: μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: после того, как он воскрес из мёртвых
  rationale: Темпоральная конструкция с непереходным ἀναστῆναι естественно передаётся личной формой «воскрес»; устойчивое «из мёртвых» сохраняет исходный образ.
theological_decisions:
- issue: Формулировка воскресения в ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: после того, как он воскрес из мёртвых
  alternative: после того, как он был воскрешён из мёртвых
  rationale: Греческая форма здесь естественно выражает «он воскрес». Такой перевод не отрицает Божьего действия, ясно выраженного в других местах, но не подменяет формулировку данного стиха иной.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Структура противопоставления сохранена; приложение «нам» выделено тире. Местоимения, относящиеся к Иисусу, даны со строчной буквы по нормам современного русского повествовательного текста, без добавления отсутствующего в греческом конфессионального маркирования.
