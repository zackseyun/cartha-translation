source:
  edition: SBLGNT
  text: Καὶ ὁ Κορνήλιος ἔφη· Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας ⸀ἤμην τὴν ⸀ἐνάτην προσευχόμενος ἐν τῷ οἴκῳ μου, καὶ ἰδοὺ ἀνὴρ ἔστη ἐνώπιόν μου ἐν ἐσθῆτι λαμπρᾷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/030.yaml
  text: And Cornelius said, “Four days ago, up to this hour, I was praying at the ninth hour in my house, and behold, a man stood before me in bright clothing.”
translation:
  language: ru
  text: 'Корнилий сказал: «Четыре дня назад, в этот самый час, я молился у себя дома — в девятом часу[a]. И вот, передо мной стоял человек в сияющей одежде».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть около трёх часов дня.
    reason: cultural_note
lexical_decisions:
- source_word: ἔφη
  choice: сказал
  rationale: Аорист вводит прямую речь; простое прошедшее время естественно для русского повествования.
- source_word: Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας
  choice: Четыре дня назад, в этот самый час
  rationale: Так передан греческий временной оборот, указывающий на тот же час четырьмя днями ранее, без неестественной для русского буквальности.
- source_word: ἤμην ... προσευχόμενος
  choice: я молился
  rationale: Перифрастический имперфект обозначает продолжавшееся в тот момент действие; русский несовершенный вид передаёт его естественно.
- source_word: τὴν ἐνάτην
  choice: в девятом часу
  rationale: Сохранён древний способ обозначения времени; современный эквивалент дан в сноске.
- source_word: ἐν τῷ οἴκῳ μου
  choice: у себя дома
  rationale: Естественное современное русское обозначение места, соответствующее физическому значению οἶκος.
- source_word: ἰδοὺ
  choice: И вдруг
  rationale: Передаёт внезапность и живость повествовательного указателя, не прибегая к архаичному «вот» или «се».
- source_word: ἀνὴρ
  choice: человек
  rationale: В данном контексте речь идёт о фигуре в человеческом облике; русское «человек» звучит естественно и не устраняет последующего раскрытия его ангельской природы.
- source_word: ἔστη ἐνώπιόν μου
  choice: передо мной предстал
  rationale: Передаёт появление и занятие положения перед Корнилием; выражение естественно для возвышенного современного русского повествования.
- source_word: ἐν ἐσθῆτι λαμπρᾷ
  choice: в сияющей одежде
  rationale: Сохраняет зрительный образ яркой, блистающей одежды, выраженный прилагательным λαμπρός.
theological_decisions:
- issue: Обозначение времени τὴν ἐνάτην
  choice: в девятом часу
  alternative: около трёх часов дня
  rationale: Основной текст сохраняет исторический способ счёта часов и не подменяет его современной системой; пояснение вынесено в сноску.
- issue: Обозначение явившейся фигуры словом ἀνὴρ
  choice: человек
  alternative: мужчина
  rationale: Перевод сохраняет описание видимого человеческого облика, не добавляя в этот стих прямого определения «ангел» и не разрешая повествовательное напряжение раньше текста.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Архаизмы исключены; историческое обозначение часа сохранено и разъяснено в сноске.
