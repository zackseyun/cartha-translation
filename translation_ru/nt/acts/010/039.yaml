  text: καὶ ⸀ἡμεῖς μάρτυρες πάντων ὧν ἐποίησεν ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων ⸀καὶ Ἰερουσαλήμ· ὃν καὶ ἀνεῖλαν κρεμάσαντες ἐπὶ ξύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/039.yaml
  text: And we are witnesses of all that he did both in the land of the Jews and in Jerusalem[a]. They also put him to death by hanging him on a tree.
translation:
  language: ru
  text: И мы — свидетели всего, что Он сделал в земле иудеев и в Иерусалиме. Его убили, повесив Его на дереве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на деревянном столбе»; по смыслу: «на кресте». В греческом тексте буквально сказано «на дереве», вероятно, с отсылкой ко Второзаконию 21:23.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυρες
  choice: свидетели
  rationale: Обычное и точное обозначение тех, кто свидетельствует об увиденном; здесь речь об апостольском свидетельстве.
- source_word: πάντων ὧν ἐποίησεν
  choice: всего, что Он сделал
  rationale: Передаёт обобщающее значение πάντων и естественно звучит по-русски.
- source_word: ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων
  choice: по всей земле иудеев
  rationale: χώρα обозначает землю, область или территорию; выражение не сводится однозначно к официальному названию римской провинции. Предлог «по» естественно сочетается с описанием всей совершённой там деятельности; «всей» эксплицирует подразумеваемый охват, уже выраженный πάντων.
- source_word: Ἰουδαίων
  choice: иудеев
  rationale: Сохраняет возможный этнорелигиозный смысл и связь с обозначением соответствующей земли, не сужая его категорически до «жителей Иудеи».
- source_word: καὶ Ἰερουσαλήμ
  choice: и в Иерусалиме
  rationale: Повтор предлога необходим для ясного и естественного русского синтаксиса.
- source_word: ἀνεῖλαν
  choice: убили
  rationale: Прямо и точно передаёт значение ἀναιρέω в данном контексте; оборот «предали смерти» был бы более формальным, но менее непосредственным.
- source_word: κρεμάσαντες
  choice: повесив
  rationale: Деепричастие сохраняет форму и связь аористного причастия с главным глаголом, обозначая способ совершения казни.
- source_word: ἐπὶ ξύλου
  choice: на дереве
  rationale: Сохраняет лексический выбор ξύλον («дерево; древесина»), вероятную связь с Второзаконием 21:23 и не заменяет исходное слово истолковывающим «крест».
theological_decisions:
- issue: Передача ξύλου в контексте распятия
  choice: на дереве
  alternative: на кресте; на деревянном столбе
  rationale: В греческом употреблено ξύλον, а не σταυρός. «На дереве» сохраняет исходный образ и вероятную аллюзию на Второзаконие 21:23, не устраняя связь с распятием, ясную из контекста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Местоимение «Он» написано с прописной буквы по устойчивой русской библейской традиции; синтаксис остаётся ясным для широкого круга читателей.
