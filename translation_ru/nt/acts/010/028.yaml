  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἔφη τε πρὸς αὐτούς· Ὑμεῖς ἐπίστασθε ὡς ἀθέμιτόν ἐστιν ἀνδρὶ Ἰουδαίῳ κολλᾶσθαι ἢ προσέρχεσθαι ἀλλοφύλῳ· κἀμοὶ ὁ θεὸς ἔδειξεν μηδένα κοινὸν ἢ ἀκάθαρτον λέγειν ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/028.yaml
  text: And he said to them[a], “You yourselves know how unlawful it is for a Jewish man to associate with or visit a foreigner[b]; but God has shown me to call no person common or unclean.”
translation:
  language: ru
  text: 'И сказал им: «Вы сами знаете, что иудею не дозволено общаться с иноплеменником[a] или приходить к нему. Но мне Бог показал, что ни одного человека нельзя называть скверным или нечистым[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человеком из другого народа». По контексту речь идёт о неиудее; возможен перевод: «язычником».'
    reason: lexical_alternative
  - marker: b
    text: «Скверным» передаёт κοινός, а «нечистым» — отличное от него ἀκάθαρτος; оба слова относятся к категориям ритуальной чистоты.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη τε πρὸς αὐτούς
  choice: И сказал им
  rationale: τέ слегка связывает фразу с повествованием; простое «И» естественно сохраняет эту связь, не уточняя последовательность сверх греческого текста.
- source_word: Ὑμεῖς ἐπίστασθε
  choice: Вы сами знаете
  rationale: Явно выраженное ὑμεῖς придаёт местоимению смысловое ударение, переданное словом «сами».
- source_word: ὡς ἀθέμιτόν ἐστιν
  choice: что ... не дозволено
  rationale: ἀθέμιτος обозначает недозволенное, противоречащее принятой норме или обычаю; формулировка не сводит сказанное к простой невежливости и вместе с тем не приписывает ему точной ссылки на закон.
- source_word: ἀνδρὶ Ἰουδαίῳ
  choice: иудею
  rationale: Русское существительное естественно передаёт мужчину-иудея в единственном числе и сохраняет обобщающий характер высказывания.
- source_word: κολλᾶσθαι
  choice: сближаться с
  rationale: Глагол буквально выражает присоединение или тесную связь; «сближаться» передаёт социальное общение и сохраняет более сильный оттенок, чем нейтральное «общаться».
- source_word: ἢ προσέρχεσθαι
  choice: или приходить к нему
  rationale: В данном контексте προσέρχεσθαι означает приходить к человеку, в том числе в его дом; дополнение «к нему» естественно раскрывает подразумеваемое направление.
- source_word: ἀλλοφύλῳ
  choice: иноплеменником
  rationale: Слово означает человека из другого народа или племени. «Иноплеменник» точно передаёт этот смысл, не подменяя его более богословски нагруженным термином «язычник».
- source_word: κἀμοὶ ὁ θεὸς ἔδειξεν
  choice: Но мне Бог показал
  rationale: Хотя κἀμοί буквально значит «и мне», контекстуальное противопоставление принятой норме естественно передаётся союзом «но»; порядок слов сохраняет ударение на «мне».
- source_word: μηδένα ... ἄνθρωπον
  choice: ни одного человека
  rationale: ἄνθρωπος здесь относится к любому человеку, а не только к мужчине; формулировка сохраняет универсальность отрицания.
- source_word: κοινὸν
  choice: осквернённым
  rationale: В контексте категорий ритуальной чистоты κοινός означает не просто «обычный», а профанированный или осквернённый. Русское «осквернённый» понятно читателю и не сливается с последующим «нечистым».
- source_word: ἢ ἀκάθαρτον
  choice: или нечистым
  rationale: ἀκάθαρτος — обычное обозначение ритуальной нечистоты; отдельный перевод сохраняет различие между двумя греческими терминами.
- source_word: λέγειν
  choice: называть
  rationale: 'Инфинитив зависит от показанного Богом содержания: Пётр не должен считать или объявлять какого-либо человека осквернённым либо нечистым; «называть» формально сохраняет глагол речи.'
theological_decisions:
- issue: Статус иудейской нормы об общении с иноплеменниками
  choice: «не дозволено»
  alternative: «противозаконно» или «неприлично»
  rationale: Перевод сохраняет силу ἀθέμιτος как запрета принятой нормой, но не утверждает сверх текста, что речь непременно идёт о прямом предписании письменного Закона; более слабое «неприлично» превратило бы вопрос в этикет.
- issue: Применение видения к людям
  choice: «ни одного человека нельзя называть осквернённым или нечистым»
  alternative: Ограничить вывод пищевыми категориями или передать его только как запрет сторониться язычников
  rationale: Греческий текст прямо переносит категории κοινός и ἀκάθαρτος на ἄνθρωπος. Перевод сохраняет этот богословски значимый переход, не расширяя и не сужая его.
- issue: Различие κοινός и ἀκάθαρτος
  choice: «осквернённым или нечистым»
  alternative: Передать оба слова одним понятием «нечистым»
  rationale: Два отдельных русских слова сохраняют парность и смысловое различие терминов языка чистоты, не пытаясь исчерпывающе систематизировать их отношение.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Иудей» и «иноплеменник» уместны для историко-религиозного контекста; синтаксис остаётся ясным для обычного читателя. Все примечания отмечены в основном тексте.
