  text: καὶ ἐξέστησαν οἱ ἐκ περιτομῆς πιστοὶ ⸀ὅσοι συνῆλθαν τῷ Πέτρῳ, ὅτι καὶ ἐπὶ τὰ ἔθνη ἡ δωρεὰ τοῦ ⸂ἁγίου πνεύματος⸃ ἐκκέχυται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/045.yaml
  text: And the believers from the circumcision who had come with Peter were astonished[c][b][a], because the gift of the Holy Spirit had been poured out even on the Gentiles.
translation:
  language: ru
  text: И верующие из числа обрезанных[a], пришедшие вместе с Петром, изумились, потому что дар Святого Духа был излит[c] даже на язычников[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обрезанные верующие». Буквально: «верующие из обрезания».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «также на язычников». Греческое слово может выражать простое добавление, но здесь, вероятно, подчёркивает неожиданность: «даже на язычников».'
    reason: lexical_alternative
  - marker: c
    text: 'Греческая форма указывает на завершённое действие с сохраняющимся результатом; возможно также перевести: «излит».'
    reason: aspectual_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: изумились
  rationale: Глагол передаёт сильное удивление; «изумились» естественно звучит в современном литературном русском и сохраняет интенсивность выражения.
- source_word: οἱ ἐκ περιτομῆς πιστοὶ
  choice: верующие из числа обрезанных
  rationale: Формулировка сохраняет греческое обозначение группы, связанной с обрезанием, и в данном контексте указывает на верующих иудеев, не сводя выражение лишь к физическому признаку.
- source_word: ὅσοι συνῆλθαν τῷ Πέτρῳ
  choice: пришедшие вместе с Петром
  rationale: Оборот естественно передаёт сопровождение Петра и уточняет, какие именно верующие имеются в виду.
- source_word: καὶ ἐπὶ τὰ ἔθνη
  choice: даже на язычников
  rationale: В контексте Деян 10 τὰ ἔθνη обозначает неиудеев; «даже» передаёт добавочное значение καί и подчёркнутое рассказом удивление.
- source_word: ἡ δωρεὰ
  choice: дар
  rationale: Краткий и общепонятный эквивалент δωρεά, обозначающего свободно данный дар.
- source_word: τοῦ ἁγίου πνεύματος
  choice: Святого Духа
  rationale: Устоявшаяся современная и межконфессионально нейтральная передача греческого родительного оборота.
- source_word: ἐκκέχυται
  choice: был излит
  rationale: Совершенный вид и страдательная конструкция передают совершившееся излияние; примечание отмечает сохраняющийся результат, выраженный греческим перфектом.
theological_decisions:
- issue: Значение ἔθνη в контексте принятия Духа
  choice: язычники
  alternative: народы
  rationale: Здесь противопоставлены верующие иудеи и неиудеи, поэтому «язычники» точнее обозначает референт, не внося дополнительного конфессионального толкования.
- issue: Видо-временное значение ἐκκέχυται
  choice: был излит
  alternative: излит
  rationale: Греческий перфект представляет излияние как завершённое действие с наличным результатом. Русское «был излит» ясно передаёт завершённость в повествовании, а продолжающееся следствие сохранено в примечании.
- issue: Функция καί перед ἐπὶ τὰ ἔθνη
  choice: даже
  alternative: также
  rationale: Оба значения грамматически возможны, однако реакция присутствующих делает оттенок неожиданности особенно вероятным; альтернативное добавочное прочтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для широкого читателя; буквальная групповая формула об обрезании сохранена в понятной форме, а реальные лексические и аспектуальные альтернативы вынесены в сноски.
