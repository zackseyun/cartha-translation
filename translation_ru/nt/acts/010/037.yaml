lexical_decisions:
- source_word: ὑμεῖς οἴδατε
  choice: Вы сами знаете
  rationale: Явное местоимение ὑμεῖς при уже выраженном в глаголе лице имеет усилительное значение; «вы сами» естественно передаёт этот акцент.
- source_word: τὸ γενόμενον ῥῆμα
  choice: что произошло
  rationale: В сочетании с γενόμενον слово ῥῆμα может обозначать не только слово или весть, но и дело, событие. Такая формулировка естественна по-русски и сохраняет событийный смысл, а лексическая неоднозначность отмечена в сноске.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: по всей Иудее
  rationale: κατά с родительным падежом выражает распространение по всей области; русский оборот точно и естественно передаёт географический охват.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: начавшись в Галилее
  rationale: Оборот передаёт исходную точку описываемого хода событий. Русское «в Галилее» здесь естественнее буквального «от Галилеи», не устраняя при этом указания на начало.
- source_word: μετὰ τὸ βάπτισμα
  choice: после крещения
  rationale: μετά с винительным падежом имеет временное значение; используется общепринятый и контекстуально ясный термин «крещение».
- source_word: ὃ ἐκήρυξεν Ἰωάννης
  choice: которое возвещал Иоанн
  rationale: κηρύσσω обозначает публичное провозглашение. «Возвещал» сохраняет этот смысл и грамматически допускает, что Иоанн призывал к крещению, не превращая выражение в указание лишь на совершение обряда.
theological_decisions:
- issue: Значение ῥῆμα в кратком изложении Петра
  choice: Передано контекстуально как «что произошло», с альтернативой в сноске.
  alternative: «слово» или «весть, распространившаяся по всей Иудее»
  rationale: Контекст охватывает известные слушателям события, связанные с Иисусом, но семантика ῥῆμα допускает также смысл слова или вести. Основной текст остаётся естественным, а сноска сохраняет подлинную неоднозначность.
- issue: Синтаксическая связь ἀρξάμενος
  choice: 'По смыслу отнесено к происходившему: «начавшись в Галилее».'
  alternative: 'Передать отдельной конструкцией: «а началось всё в Галилее»'
  rationale: Причастие мужского рода синтаксически не согласуется прямо с формой среднего рода ῥῆμα, однако явно указывает, что описываемое берёт начало в Галилее. Перевод не вводит дополнительного богословского субъекта и отмечает неровность в сноске.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю, с умеренно торжественным библейским звучанием. Сохранено продолжение предложения запятой, поскольку стих синтаксически переходит к следующему.
