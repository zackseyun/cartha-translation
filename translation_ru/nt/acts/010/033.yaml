  text: ἐξαυτῆς οὖν ἔπεμψα πρὸς σέ, σύ τε καλῶς ἐποίησας παραγενόμενος. νῦν οὖν πάντες ἡμεῖς ἐνώπιον τοῦ θεοῦ πάρεσμεν ἀκοῦσαι πάντα τὰ προστεταγμένα σοι ὑπὸ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/033.yaml
  text: So I sent for you at once[a], and you did well to come. Now then[b], we are all here before God to hear everything that has been commanded to you by the Lord.
translation:
  language: ru
  text: Итак, я сразу же послал за тобой[a], и ты хорошо сделал, что пришёл. Теперь же все мы здесь, перед Богом, чтобы услышать всё, что повелено тебе Господом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «немедленно»; «без промедления».'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте — «Господом». В данном контексте, вероятно, имеется в виду Иисус, хотя возможно и более общее понимание: речь идёт о Боге.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: сразу же
  rationale: Наречное выражение означает немедленность действия. «Сразу же» естественно звучит по-русски и ясно передаёт, что Корнилий не медлил.
- source_word: οὖν
  choice: поэтому
  rationale: Первое οὖν связывает отправку посланцев с предшествующим рассказом Корнилия и передаёт следствие.
- source_word: ἔπεμψα πρὸς σέ
  choice: послал за тобой
  rationale: Буквально выражение означает «послал к тебе», но в данном контексте речь идёт о посланцах, отправленных пригласить Петра. Русское «послал за тобой» точно и естественно передаёт этот смысл.
- source_word: σύ τε καλῶς ἐποίησας παραγενόμενος
  choice: и ты хорошо сделал, что пришёл
  rationale: Передаёт одобрение поступка Петра и естественно выражает смысл сопутствующего причастия παραγενόμενος.
- source_word: νῦν οὖν
  choice: теперь же
  rationale: Сочетание вводит переход от рассказа к цели собрания. Частица «же» сохраняет связность и подчёркивает наступивший момент.
- source_word: πάντες ἡμεῖς
  choice: все мы
  rationale: Сохраняется выраженное в греческом тексте ударение на всей собравшейся группе.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: перед Богом
  rationale: Кратко и торжественно передаёт осознанное пребывание в Божьем присутствии.
- source_word: πάρεσμεν
  choice: мы здесь
  rationale: Глагол означает «присутствовать, находиться здесь»; такой перевод естественен для современной русской речи.
- source_word: ἀκοῦσαι
  choice: чтобы услышать
  rationale: Инфинитив выражает цель собрания; «услышать» прямо передаёт исходный глагол.
- source_word: πάντα τὰ προστεταγμένα σοι
  choice: всё, что повелено тебе
  rationale: Сохраняются и полнота («всё»), и властный характер данных Петру указаний. Безличная форма естественно передаёт греческое страдательное причастие.
- source_word: ὑπὸ τοῦ κυρίου
  choice: Господом
  rationale: Сохраняет прямо названный в греческом тексте титул, не уточняя его референта сверх сказанного автором.
theological_decisions:
- issue: К кому относится титул τοῦ κυρίου («Господом»)
  choice: В основном тексте оставлено «Господом» без добавления имени.
  alternative: Понимать как «Богом» в связи с непосредственно предшествующим выражением «перед Богом» либо уточнить как «Господом Иисусом».
  rationale: Греческий текст содержит только титул κύριος. В контексте Деяний 10 он, вероятно, относится к Иисусу, однако прямого уточнения здесь нет. Перевод сохраняет исходную формулировку и её богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Синтаксис прост и понятен, при этом сохранены авторитетный оттенок слова «повелено», коллективное ударение «все мы» и намеренная неопределённость титула «Господь».
