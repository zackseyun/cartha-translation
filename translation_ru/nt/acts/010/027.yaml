base_translation:
  language: en
  yaml_path: translation/nt/acts/010/027.yaml
  text: And talking with him[a], he entered and found many gathered together.
translation:
  language: ru
  text: Беседуя с ним, Пётр вошёл и увидел, что там собралось много людей.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и находит многих собравшихся». В греческом здесь употреблено историческое настоящее («находит»), придающее повествованию живость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνομιλῶν αὐτῷ
  choice: Беседуя с ним
  rationale: Причастие настоящего времени обозначает действие, происходящее одновременно со входом; «беседуя» естественно передаёт взаимный характер разговора.
- source_word: εἰσῆλθεν
  choice: Пётр вошёл
  rationale: Аорист обозначает следующее событие повествования. Имя «Пётр» восполняет подразумеваемое подлежащее ради ясности русского текста.
- source_word: εὑρίσκει
  choice: увидел, что там
  rationale: Историческое настоящее передано русским прошедшим временем, естественным для повествования; в данном контексте «увидел, что там» яснее, чем буквальное «нашёл».
- source_word: συνεληλυθότας πολλούς
  choice: собралось много людей
  rationale: 'Перфектное причастие указывает на уже наступившее состояние: многие люди собрались и находились там вместе.'
