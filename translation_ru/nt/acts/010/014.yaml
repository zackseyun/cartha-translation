base_translation:
  language: en
  yaml_path: translation/nt/acts/010/014.yaml
  text: But Peter said, “By no means, Lord, because I have never eaten anything common and unclean.”
translation:
  language: ru
  text: 'Но Пётр сказал: «Ни в коем случае, Господи! Ведь я никогда не ел ничего осквернённого и нечистого».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: Ни в коем случае
  rationale: Передаёт решительный отказ Петра естественным и современным русским выражением.
- source_word: κύριε
  choice: Господи
  rationale: Форма обращения уместна в контексте небесного видения и сохраняет возможное признание говорящего как Господа.
- source_word: κοινὸν
  choice: осквернённого
  rationale: В данном контексте слово означает не просто «обычное», а ритуально непригодное, лишённое священной чистоты; «осквернённое» ясно передаёт этот смысл по-русски.
- source_word: ἀκάθαρτον
  choice: нечистого
  rationale: Прямо передаёт категорию ритуальной нечистоты пищи.
- source_word: ὅτι
  choice: ведь
  rationale: Естественно вводит названное Петром основание его отказа, не делая причинную связь чрезмерно жёсткой.
theological_decisions:
- issue: Связь определений κοινὸν καὶ ἀκάθαρτον
  choice: осквернённого и нечистого
  alternative: осквернённого или нечистого
  rationale: Сохранён засвидетельствованный в SBLGNT союз καί («и»), без замены на богословски или стилистически более привычное «или».
translation_notes:
  register: Современный литературный русский язык; реплика звучит решительно, но достойно. Термины чистоты переданы понятно для обычного читателя с сохранением ритуально-религиозного смысла.
