- source_word: αὐτῶν
  choice: те
  rationale: Указывает на ранее названных людей и одновременно позволяет различить их и тех, кто их слышал, не добавляя в текст слова «язычники».
- source_word: λαλούντων
  choice: говорили
  rationale: 'Прямое и естественное соответствие причастию от λαλέω в конструкции со значением восприятия: «слышали, как… говорили».'
- source_word: γλώσσαις
  choice: языками
  rationale: Сохраняет традиционный библейский оборот и не сводит значение однозначно к известным человеческим языкам; возможное понимание поясняется в сноске.
- source_word: μεγαλυνόντων
  choice: возвеличивали
  rationale: Близко передаёт значение μεγαλύνω — признавать и провозглашать величие — и сохраняет библейскую лексику хвалы.
- source_word: τὸν θεόν
  choice: Бога
  rationale: Прямое соответствие дополнению в винительном падеже.
- source_word: τότε
  choice: тогда
  rationale: Кратко и естественно обозначает переход к следующему событию.
- source_word: ἀπεκρίθη
  choice: ответил
  rationale: Сохраняет обычное значение ἀποκρίνομαι, хотя непосредственно перед этим вопрос не приводится.
- source_word: Πέτρος
  choice: Пётр
  rationale: Устоявшаяся русская форма имени.
