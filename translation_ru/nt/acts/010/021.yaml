  text: So Peter went down to the men and said[a], “Look, I am the one you are looking for. Why are you here?”
translation:
  language: ru
  text: 'Пётр спустился к мужчинам и сказал: «Вот, я тот, кого вы ищете. По какой причине вы здесь?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβὰς δὲ
  choice: Пётр спустился
  rationale: Аористное причастие передано личной формой, естественной для русского повествования; «спустился» сохраняет направление движения с верхней части дома вниз. δέ обозначает продолжение рассказа и отдельно не переводится.
- source_word: πρὸς τοὺς ἄνδρας
  choice: к этим людям
  rationale: πρός с винительным обозначает движение к посетителям. Указательное «этим» естественно связывает их с уже упомянутыми в контексте людьми; «людям» не акцентирует пол без смысловой необходимости.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: «Вот» — естественный современный русский указательный маркер, привлекающий внимание к говорящему без архаичности.
- source_word: ἐγώ εἰμι ὃν ζητεῖτε
  choice: я тот, кого вы ищете
  rationale: Передаёт усиленное ἐγώ и относительную конструкцию ясно и идиоматично.
- source_word: τίς ἡ αἰτία δι’ ἣν πάρεστε
  choice: По какой причине вы пришли?
  rationale: «По какой причине» сохраняет выраженное существительное αἰτία, а «пришли» естественно передаёт присутствие посетителей как результат их прибытия в данном контексте.
