  verdict: revise
  source_fidelity: 'В черновике верно переданы нисхождение Петра, обращение к посетителям и самоидентификация. Однако «этим людям» добавляет указательность, которой нет в греческом тексте, и сглаживает συγκεκριенное ἄνδρας («мужчины»). «Вы пришли» обозначает совершившееся прибытие, тогда как πάρεστε — форма настоящего времени: «вы здесь/находитесь здесь».'
  naturalness: «По какой причине вы здесь?» — современная литературная и естественная для сдержанной прямой речи формулировка; она сохраняет явное «причина» (αἰτία), не делая фразу тяжеловесной.
  terminology: Богословски значимых терминов нет. «Мужчинам» точно передаёт ἄνδρας в данном контексте, где посланцы Корнилия названы мужчинами.
  issues:
