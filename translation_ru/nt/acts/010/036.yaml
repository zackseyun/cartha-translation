  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τὸν λόγον ⸀ὃν ἀπέστειλεν τοῖς υἱοῖς Ἰσραὴλ εὐαγγελιζόμενος εἰρήνην διὰ Ἰησοῦ Χριστοῦ· οὗτός ἐστιν πάντων κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/036.yaml
  text: the message that he sent to the sons of Israel[c][b][a], proclaiming peace through Jesus the Messiah—he is Lord of all.
translation:
  language: ru
  text: Он послал сынам Израиля[a] весть, возвещая мир через Иисуса Мессию[b]. Именно Он — Господь всех[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «детям Израиля»; выражение означает народ Израиля.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «через Иисуса Христа»; греческое Χριστός означает «Мессия», то есть «Помазанник».'
    reason: alternative_reading
  - marker: c
    text: 'В греческом тексте стоит усилительное указательное местоимение: «этот — Господь всех».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν λόγον
  choice: весть
  rationale: В данном контексте λόγος обозначает переданное Богом содержание благой вести, а не отдельное слово. «Весть» естественно передаёт этот смысл по-русски.
- source_word: ὃν ἀπέστειλεν
  choice: Он послал
  rationale: Относительная конструкция преобразована в самостоятельное предложение ради ясного и естественного русского синтаксиса; подразумеваемый из контекста субъект — Бог.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: сынам Израиля
  rationale: Сохраняется буквальный образ греческого выражения, которое служит традиционным обозначением израильского народа.
- source_word: εὐαγγελιζόμενος
  choice: возвещая
  rationale: Глагол означает провозглашение благой вести. «Возвещая» сохраняет торжественный, но понятный современному читателю регистр.
- source_word: εἰρήνην
  choice: мир
  rationale: 'Прямой русский эквивалент, сохраняющий возможную полноту смысла: примирение, благополучие и восстановленные отношения.'
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: через Иисуса Мессию
  rationale: διά с родительным передаёт посредничество, а Χριστός здесь имеет силу титула и потому переведено как «Мессия».
- source_word: οὗτός
  choice: Именно Он
  rationale: Так естественно по-русски передаётся усилительное указание на только что названного Иисуса без неуклюжего «этот» или «этот человек».
- source_word: πάντων κύριος
  choice: Господь всех
  rationale: Передаёт универсальность господства без сужения значения πάντων; «Господь» сохраняет богословский вес κύριος.
theological_decisions:
- issue: Значение Χριστοῦ в сочетании Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессию
  alternative: Иисуса Христа
  rationale: В этой речи Χριστός сохраняет титульное мессианское значение. Перевод титула делает его смысл прозрачным, не добавляя конфессионального толкования.
- issue: Передача κύριος в πάντων κύριος
  choice: Господь всех
  alternative: Владыка всех
  rationale: «Господь» сохраняет как значение власти, так и богословскую насыщенность утверждения о всеобщем господстве Иисуса.
- issue: Усилительная сила οὗτός
  choice: Именно Он — Господь всех
  alternative: Он — Господь всех
  rationale: «Именно Он» сохраняет акцент греческого указательного местоимения на Иисусе, не усиливая утверждение сверх текста.
- issue: Субъект εὐαγγελιζόμενος
  choice: Бог возвещает мир, посылая весть
  alternative: весть возвещает мир
  rationale: Причастие стоит в именительном падеже и грамматически относится к подразумеваемому субъекту ἀπέστειλεν, то есть к Богу; перевод не переносит действие на «весть».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сделан самостоятельным и ясным для чтения стиха вне ближайшего контекста; при этом сохранены титульное значение Χριστός, усиление οὗτός и универсальность πάντων.
