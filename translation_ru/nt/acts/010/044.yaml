source:
  edition: SBLGNT
  text: Ἔτι λαλοῦντος τοῦ Πέτρου τὰ ῥήματα ταῦτα ἐπέπεσε τὸ πνεῦμα τὸ ἅγιον ἐπὶ πάντας τοὺς ἀκούοντας τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/044.yaml
  text: While Peter was still speaking these words[a], the Holy Spirit fell upon all those hearing the word.
translation:
  language: ru
  text: Пётр ещё говорил эти слова, когда Святой Дух сошёл[a] на всех, кто слушал слово.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «пал на всех».'
    reason: Греческое ἐπέπεσε буквально передаёт яркий образ «пал на»; основной текст употребляет естественное в русском библейском контексте «сошёл на».
lexical_decisions:
- source_word: Ἔτι λαλοῦντος τοῦ Πέτρου
  choice: Пётр ещё говорил… когда
  rationale: Генитив абсолютный с причастием настоящего времени выражает продолжающееся действие, одновременное с главным событием; такая конструкция естественна для современного русского языка.
- source_word: τὰ ῥήματα ταῦτα
  choice: эти слова
  rationale: Прямо передаёт указание на произносимые Петром слова и сохраняет отличие ῥήματα от последующего λόγος.
- source_word: ἐπέπεσε
  choice: сошёл
  rationale: В контексте действия Святого Духа это естественный и достойный русский эквивалент образного греческого глагола «пал/обрушился на»; менее резок, но сохраняет направленность действия на людей.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Святой Дух
  rationale: Устоявшееся современное русское обозначение, точно передающее греческое выражение.
- source_word: ἐπὶ πάντας τοὺς ἀκούοντας
  choice: на всех, кто слушал
  rationale: Передаёт ἐπί с винительным и настоящее причастие, обозначающее людей, слушавших в тот самый момент.
- source_word: τὸν λόγον
  choice: слово
  rationale: Сохраняет близкое соответствие λόγος и его богословско-повествовательную многозначность; в контексте ясно, что речь идёт о возвещаемом Петром слове.
theological_decisions:
- issue: Образ действия Святого Духа в ἐπέπεσε
  choice: Святой Дух сошёл на всех
  alternative: Святой Дух пал на всех
  rationale: «Сошёл» естественно описывает в русском библейском регистре наступившее действие Духа, не добавляя учения о его механизме; буквальное «пал» звучит применительно к Святому Духу неестественно и может вызвать ложные ассоциации.
- issue: Значение λόγος в контексте проповеди
  choice: слово
  alternative: весть
  rationale: «Слово» сохраняет лексическую и богословскую ёмкость исходного текста, тогда как «весть» яснее обозначает проповедь, но несколько сужает возможный смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Порядок придаточного и главного предложений сделан естественным для русского; повтор «слова… слово» намеренно сохраняет различие и связь ῥήματα и λόγος.
