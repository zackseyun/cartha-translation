  rationale: Причастие обозначает предшествующее обращение громким голосом к находившимся в доме. Добавление «хозяев» естественно передаёт подразумеваемых адресатов, не отождествляя их с конкретным лицом.
- source_word: ἐπυνθάνοντο
  choice: спросили
  rationale: Имперфект может обозначать развёртывавшийся расспрос, но в данном повествовательном контексте естественное русское «спросили» достаточно передаёт действие.
- source_word: εἰ
  choice: здесь ли
  rationale: Частица вводит косвенный общий вопрос; русская конструкция с «ли» точно и естественно передаёт эту функцию.
- source_word: Σίμων ὁ ἐπικαλούμενος Πέτρος
  choice: Симон, которого называют Петром
  rationale: Формулировка сохраняет оба имени и настоящее пассивное значение причастия, не превращая «Пётр» в фамилию или прозвище без явного основания.
- source_word: ἐνθάδε
  choice: здесь
  rationale: Прямой и естественный современный эквивалент указания на место.
- source_word: ξενίζεται
  choice: остановился
  rationale: В контексте вопроса о местонахождении гостя естественно по-русски; оттенок проживания у принимающей стороны раскрыт в сноске.
