id: ACT.10.22
reference: Acts 10:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Κορνήλιος ἑκατοντάρχης, ἀνὴρ δίκαιος καὶ φοβούμενος τὸν θεὸν μαρτυρούμενός τε ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων, ἐχρηματίσθη ὑπὸ ἀγγέλου ἁγίου μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ καὶ ἀκοῦσαι ῥήματα παρὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/022.yaml
  text: They said[a], “Cornelius, a centurion, a righteous man and one who fears God, and who is well spoken of by the whole nation of the Jews[e][d][c][b], was divinely instructed by a holy angel to summon you to his house and to hear words from you.”
translation:
  language: ru
  text: 'Они сказали: «Корнилий — сотник, человек праведный и боящийся Бога; о нём хорошо отзывается весь иудейский народ[a]. Он получил от святого ангела указание[b] позвать тебя[c] в свой дом и услышать от тебя слова[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «весь народ иудеев». Здесь «народ» означает группу людей, а не современное политическое государство.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий глагол указывает на сообщение свыше; возможные переводы: «получил наставление», «получил божественное указание» или, в других контекстах, «был предупреждён».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «послать за тобой», «вызвать тебя».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «услышать, что ты скажешь»; буквально: «услышать слова от тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: сотник
  rationale: Устоявшееся русское обозначение римского военного начальника, соответствующее историческому термину; слово «римский» не добавлено, поскольку его нет в данном стихе.
- source_word: ἀνὴρ δίκαιος
  choice: человек праведный
  rationale: Сохраняет нравственно-религиозный смысл δίκαιος и естественно характеризует Корнилия по-русски.
- source_word: φοβούμενος τὸν θεόν
  choice: боящийся Бога
  rationale: Сохраняет библейскую формулировку и возможный социально-религиозный оттенок обозначения язычника, почитавшего Бога Израиля, не превращая его в позднейшую догматическую категорию.
- source_word: μαρτυρούμενος
  choice: о нём хорошо отзывается
  rationale: Передаёт благоприятное свидетельство и хорошую репутацию естественным современным русским выражением.
- source_word: ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων
  choice: весь иудейский народ
  rationale: ἔθνος здесь обозначает этнорелигиозный народ, а не современное национальное государство.
- source_word: ἐχρηματίσθη
  choice: получил ... повеление
  rationale: В контексте глагол обозначает сообщение или указание сверхъестественного происхождения; формулировка сохраняет получение указания Корнилием и прямо названного посредника — ангела.
- source_word: ἀγγέλου ἁγίου
  choice: от святого ангела
  rationale: Передаёт и существительное, и явно выраженное определение ἁγίου.
- source_word: μεταπέμψασθαί σε
  choice: позвать тебя
  rationale: Естественно передаёт значение «послать за кем-либо, вызвать», не добавляя избыточного «чтобы ты пришёл».
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: в свой дом
  rationale: Возвратное местоимение ясно соотносит дом с Корнилием, а «дом» сохраняет конкретное значение οἶκος.
- source_word: ἀκοῦσαι ῥήματα παρὰ σοῦ
  choice: услышать от тебя слова
  rationale: Сохраняет множественное ῥήματα и не уточняет содержание как проповедь или формальное послание.
theological_decisions:
- issue: Описание благочестия Корнилия без добавления выводов о его заветном статусе или спасении
  choice: человек праведный и боящийся Бога
  alternative: человек благочестивый
  rationale: Выбранная формулировка сохраняет два отдельных определения греческого текста и присущее повествованию богословское напряжение, не вводя более поздних конфессиональных категорий.
- issue: Характер небесного сообщения Корнилию
  choice: получил от святого ангела повеление
  alternative: получил через святого ангела Божье указание
  rationale: Основной текст ясно передаёт авторитетное небесное указание, но не добавляет отсутствующее в греческом тексте прямое слово «Божье».
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Синтаксис разделён точкой с запятой и отдельным предложением, чтобы длинная цепочка определений оставалась понятной. Библейское выражение «боящийся Бога» сохранено намеренно; архаизмы и конфессионально окрашенные добавления исключены.
