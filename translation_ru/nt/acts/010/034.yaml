lexical_decisions:
- source_word: Ἀνοίξας ... τὸ στόμα
  choice: начал говорить
  rationale: Буквально «открыв уста»; это устойчивое вводное выражение, обозначающее начало речи. В современном русском буквальная передача звучала бы избыточно архаично, тогда как «начал говорить» естественно передаёт его функцию.
- source_word: δὲ
  choice: Тогда
  rationale: Частица отмечает переход к следующему событию повествования; «тогда» естественно связывает слова Петра с предшествующей сценой.
- source_word: Ἐπ’ ἀληθείας
  choice: действительно
  rationale: Выражение подчёркивает истинность и несомненность осознания Петра; «действительно» естественно в сочетании с «понимаю».
- source_word: καταλαμβάνομαι
  choice: Теперь я ... понимаю
  rationale: Средняя форма настоящего времени здесь выражает постижение или осознание. «Понимаю» точно передаёт смысл, а «теперь» в контексте раскрывает подразумеваемый момент нового осознания, не превращая его в отдельное утверждение исходного текста.
- source_word: προσωπολήμπτης
  choice: нелицеприятен
  rationale: Слово обозначает того, кто судит или относится к людям с пристрастием, по их внешнему положению или статусу. Русское библейское слово «нелицеприятен» ёмко и точно выражает отсутствие пристрастия.
- source_word: ὁ θεός
  choice: Бог
  rationale: Стандартная и контекстуально однозначная передача θεός.
theological_decisions:
- issue: Утверждение о Божьем отношении к людям
  choice: Бог нелицеприятен
  alternative: Бог никому не оказывает предпочтения
  rationale: Выбранная формулировка сохраняет характеристику Бога и не уточняет сверх текста, в каком именно смысле проявляется Его беспристрастие. Смысл редкого русского слова пояснён в сноске.
