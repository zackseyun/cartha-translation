lexical_decisions:
- source_word: πέμψον οὖν εἰς Ἰόππην
  choice: Итак, пошли в Иоппию
  rationale: «Итак» естественно передаёт логико-повествовательную связь οὖν, а «пошли в Иоппию» — направленное действие аористного императива с εἰς.
- source_word: μετακάλεσαι
  choice: позови
  rationale: Глагол означает велеть позвать человека к себе; «позови» передаёт это естественно и без излишне официального оттенка слова «вызови».
- source_word: Σίμωνα ὃς ἐπικαλεῖται Πέτρος
  choice: Симона, которого называют Петром
  rationale: Формулировка ясно передаёт второе имя, сохраняя пассивную форму и не добавляя значения фамилии или прозвища.
- source_word: ξενίζεται
  choice: гостит
  rationale: Глагол указывает, что Пётр принят кем-то как гость; «гостит» кратко и естественно сохраняет этот смысл.
- source_word: ἐν οἰκίᾳ Σίμωνος βυρσέως
  choice: в доме кожевника Симона
  rationale: Сохранены и прямое указание на дом, и ремесло хозяина; порядок слов естественен для современного русского языка.
- source_word: παρὰ θάλασσαν
  choice: у моря
  rationale: Краткий идиоматичный эквивалент пространственного значения παρά с винительным падежом.
