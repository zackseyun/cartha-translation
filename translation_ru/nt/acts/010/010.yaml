base_translation:
  language: en
  yaml_path: translation/nt/acts/010/010.yaml
  text: He became very hungry and wanted to eat[a]; but while they were preparing it[b], a trance came over him.
translation:
  language: ru
  text: Он сильно проголодался и хотел поесть[a]. Пока они готовили еду, его охватил транс[b].
  philosophy: optimal-equivalence
  footnotes:
