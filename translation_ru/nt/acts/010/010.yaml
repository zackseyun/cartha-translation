lexical_decisions:
- source_word: ἐγένετο δὲ πρόσπεινος
  choice: Он сильно проголодался
  rationale: Передаёт наступление состояния, выраженное ἐγένετο, и усиленное значение πρόσπεινος; естественно звучит в современном русском повествовании.
- source_word: ἤθελεν γεύσασθαι
  choice: хотел поесть
  rationale: В данном контексте γεύομαι означает принятие пищи, хотя буквально может означать «вкусить».
- source_word: παρασκευαζόντων δὲ αὐτῶν
  choice: Но пока готовили еду
  rationale: Генитив абсолютный обозначает одновременное действие. Субъект оставлен неопределённым, как допускает русский язык, а подразумеваемый объект «еда» восполнен из контекста.
- source_word: ἐγένετο ἐπ’ αὐτὸν
  choice: на него сошло
  rationale: Передаёт внезапное наступление переживания и сохраняет образ конструкции с ἐπί.
- source_word: ἔκστασις
  choice: исступление
  rationale: Русское «исступление» передаёт состояние выхода за пределы обычного восприятия и в контексте вводит видение, не сводя термин к простому изумлению.
theological_decisions:
- issue: Характер состояния Петра, обозначенного словом ἔκστασις
  choice: исступление
  alternative: транс; экстаз; изумление
  rationale: Последующий рассказ показывает, что речь идёт об изменённом состоянии, связанном с откровением. «Исступление» сохраняет библейскую торжественность и смысл выхода из обычного состояния, не вводя поздней мистической доктрины; сноска сохраняет допустимую альтернативу «транс».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формулировка проста и понятна; подлинная смысловая широта γεύομαι и ἔκστασις сохранена в сносках.
