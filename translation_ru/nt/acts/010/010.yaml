  source_fidelity: Первая часть точно передаёт наступление сильного голода и желание поесть. «Пока они готовили еду» воспроизводит одновременность генитива абсолютного и сохраняет указание на действующих лиц. Для ἔκστασις в данном контексте нужен термин, прямо обозначающий изменённое состояние, предшествующее видению.
  naturalness: «Сильно проголодался» и «хотел поесть» естественны для современного литературного русского. «На него сошло исступление» звучит архаично и в современном употреблении обычно вызывает ассоциации с неистовством или утратой самообладания, что неточно. «Его охватил транс» ясно и естественно в повествовательном контексте.
  terminology: «Транс» адекватно передаёт ἔκστασις в Деян 10:10 как состояние, связанное с видением, не навязывая богословского истолкования. «Исступление» лучше не использовать в основном тексте из-за современного смыслового сдвига. Лексическая альтернатива «экстаз» уместна в сноске.
