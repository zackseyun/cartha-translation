source:
  edition: SBLGNT
  text: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ, ὡς ἔχρισεν αὐτὸν ὁ θεὸς πνεύματι ἁγίῳ καὶ δυνάμει, ὃς διῆλθεν εὐεργετῶν καὶ ἰώμενος πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου, ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/038.yaml
  text: 'Jesus of Nazareth: how God anointed him with the Holy Spirit and with power[a]; he went about doing good and healing all who were oppressed by the devil[c][b], because God was with him.'
translation:
  language: ru
  text: 'Иисуса из Назарета: как Бог помазал его Святым Духом и силой; он ходил повсюду, делая добро и исцеляя всех, кого угнетал дьявол, потому что Бог был с ним.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ
  choice: Иисуса из Назарета
  rationale: Оборот указывает на происхождение Иисуса. «Из Назарета» непосредственно передаёт ἀπό и естественно звучит по-русски; винительный падеж сохранён, поскольку стих синтаксически продолжает предыдущий контекст.
- source_word: ὡς
  choice: как
  rationale: Здесь ὡς вводит сообщение о том, что произошло с Иисусом. «Как» сохраняет пояснительно-повествовательный характер греческой конструкции и не сводит её к простому союзу «что».
- source_word: ἔχρισεν
  choice: помазал
  rationale: Прямое соответствие χρίω сохраняет библейскую и мессианскую многозначность, не подменяя её пояснениями «назначил Мессией» или «наделил силой».
- source_word: πνεύματι ἁγίῳ καὶ δυνάμει
  choice: Святым Духом и силой
  rationale: Творительный падеж передаёт инструментальное значение дательных форм. «Святой Дух» понимается как личное именование, а отдельное «силой» сохраняет различение двух элементов фразы.
- source_word: διῆλθεν
  choice: ходил повсюду
  rationale: Передаёт странствующее служение и движение Иисуса с места на место естественным современным русским выражением.
- source_word: εὐεργετῶν
  choice: делая добро
  rationale: Кратко и естественно передаёт благотворное действие без неоправданного сужения смысла до материальной помощи.
- source_word: ἰώμενος
  choice: исцеляя
  rationale: Прямой и обычный в данном контексте русский эквивалент глагола исцеления.
- source_word: πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου
  choice: всех, кого угнетал дьявол
  rationale: Придаточная конструкция естественно передаёт людей, находившихся под тяжёлым владычеством дьявола, не уточняя сверх текста характер их страданий.
- source_word: ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ
  choice: потому что Бог был с ним
  rationale: «Потому что» ясно выражает причинное значение ὅτι, а формулировка о присутствии Бога сохранена без богословского расширения.
theological_decisions:
- issue: Помазание Иисуса и его миссия
  choice: Сохранить глагол «помазал» без доктринального пересказа.
  alternative: «Назначил Мессией» или «наделил силой».
  rationale: Текст говорит о помазании Иисуса Святым Духом и силой. Буквенный образ несёт мессианский смысл, но сам стих не раскрывает его посредством добавочного титула.
- issue: Личностное значение πνεύματι ἁγίῳ
  choice: «Святым Духом» с прописных букв.
  alternative: «святым духом» как безличной духовной силой.
  rationale: В Деяниях это выражение обычно обозначает Святого Духа; кроме того, «Дух» и «сила» здесь названы раздельно, поэтому сводить их к одному безличному могуществу не следует.
- issue: Причинная связь слов «Бог был с ним» со служением Иисуса
  choice: Сохранить прямое причинное утверждение.
  alternative: Ослабить до простого сопутствующего обстоятельства либо истолковать как исчерпывающее объяснение личности Иисуса.
  rationale: ὅτι указывает основание действенного служения Иисуса, однако стих не даёт повода ни устранять эту причинность, ни делать из неё выводы, выходящие за рамки формулировки.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Начальный винительный падеж намеренно сохранён: Деян 10:38 синтаксически продолжает предыдущий стих. Строчные местоимения «его», «он», «ним» соответствуют нейтральной современной издательской норме и не несут богословского умаления.'
