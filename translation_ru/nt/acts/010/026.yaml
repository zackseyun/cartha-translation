  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ⸂ἤγειρεν αὐτὸν⸃ λέγων· Ἀνάστηθι· καὶ ἐγὼ αὐτὸς ἄνθρωπός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/026.yaml
  text: But Peter raised him up[a], saying, “Stand up[c][b]; I too am a man.”
translation:
  language: ru
  text: 'Но Пётр поднял его[a] и сказал: «Встань[b]. Я и сам человек».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помог ему подняться».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Поднимись».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν αὐτὸν
  choice: поднял его
  rationale: Передаёт обычное значение ἐγείρω и естественно описывает действие Петра по отношению к лежащему у его ног Корнилию, не уточняя сверх текста, помог ли он ему подняться или поднял сам.
- source_word: Ἀνάστηθι
  choice: Встань
  rationale: Прямое и естественное повеление подняться на ноги в непосредственном контексте.
- source_word: καὶ ἐγὼ αὐτὸς
  choice: Я и сам
  rationale: Сохраняет включительное καί и усилительное αὐτός, подчёркивая, что Пётр принадлежит к той же человеческой категории.
- source_word: ἄνθρωπός εἰμι
  choice: человек
  rationale: Точно передаёт ἄνθρωπος как указание на общую человеческую природу; добавление «всего лишь» было бы истолкованием, отсутствующим в греческом тексте.
- source_word: δὲ
  choice: Но
  rationale: Выражает мягкое противопоставление поступку Корнилия в предыдущем стихе и исправляющей реакции Петра.
theological_decisions:
- issue: Ответ Петра на почтительное падение Корнилия к его ногам
  choice: Пётр велит Корнилию встать и обосновывает это тем, что сам является человеком.
  alternative: Понимать слова лишь как проявление личной скромности Петра либо прямо формулировать на их основе более широкое учение о поклонении.
  rationale: Перевод сохраняет ясное противопоставление между оказанной Петру чрезвычайной почестью и его общей с Корнилием человечностью, но не добавляет доктринальных выводов, которых стих прямо не формулирует.
translation_notes:
  register: Современный литературный русский язык; краткая прямая речь звучит естественно и достойно. Порядок «Я и сам человек» сохраняет смысловое ударение греческого καὶ ἐγὼ αὐτός без тяжеловесного буквализма.
