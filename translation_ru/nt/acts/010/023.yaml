  text: εἰσκαλεσάμενος οὖν αὐτοὺς ἐξένισεν. Τῇ δὲ ἐπαύριον ⸀ἀναστὰς ἐξῆλθεν σὺν αὐτοῖς, καί τινες τῶν ἀδελφῶν τῶν ἀπὸ Ἰόππης συνῆλθον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/023.yaml
  text: So he invited them in and gave them lodging[a]. The next day he got up and went out with them[b], and some of the brothers from Joppa went with him.
translation:
  language: ru
  text: Итак, он пригласил их войти и предоставил им ночлег[a]. На следующий день он встал и отправился с ними, и некоторые из братьев из Иоппии пошли вместе с ним[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оказал им гостеприимство», «принял их как гостей»; греческий глагол здесь подразумевает размещение гостей на ночлег.'
    reason: lexical_alternative
  - marker: b
    text: Слово «братьев» передаёт мужское множественное число греческого ἀδελφῶν; в раннехристианской речи оно иногда могло обозначать единоверцев в более широком смысле, то есть братьев и сестёр.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσκαλεσάμενος
  choice: пригласил их войти
  rationale: Причастие среднего залога передаёт побуждение войти внутрь; эта формулировка естественна по-русски и сохраняет конкретное действие.
- source_word: οὖν
  choice: итак
  rationale: Обозначает повествовательное следствие из предшествующего разговора, не придавая связи чрезмерно строгого логического характера.
- source_word: ἐξένισεν
  choice: предоставил им ночлег
  rationale: В данном контексте ξενίζω обозначает гостеприимство с размещением на ночлег; перевод ясно выражает конкретное действие.
- source_word: Τῇ δὲ ἐπαύριον
  choice: на следующий день
  rationale: Естественная русская формула временно́й последовательности.
- source_word: ἀναστὰς ἐξῆλθεν
  choice: встал и отправился
  rationale: Сохраняется последовательность действий, а контекст путешествия позволяет естественно передать ἐξῆλθεν как начало пути, не сливая оба глагола в один.
- source_word: σὺν αὐτοῖς
  choice: с ними
  rationale: Кратко и точно передаёт совместное движение.
- source_word: τινες τῶν ἀδελφῶν
  choice: некоторые из братьев
  rationale: Сохраняет неопределённость τινες и мужскую форму ἀδελφῶν, не исключая более широкого раннехристианского употребления термина, отмеченного в сноске.
- source_word: τῶν ἀπὸ Ἰόππης
  choice: в Иоппии
  rationale: Греческая конструкция буквально указывает на братьев «из Иоппии»; по контексту речь о находившихся там членах общины, и местная формулировка звучит естественно по-русски.
- source_word: συνῆλθον αὐτῷ
  choice: пошли вместе с ним
  rationale: В контексте глагол обозначает сопровождение Петра в путь; формулировка ясна и идиоматична.
theological_decisions:
- issue: Передача ἀδελφῶν в церковном контексте, где термин потенциально может иметь более широкое значение
  choice: братьев
  alternative: братьев и сестёр; верующих
  rationale: Основной текст сохраняет грамматически мужское множественное число источника. Возможное обобщённое обозначение единоверцев не устраняется, а отмечается в сноске.
translation_notes:
  register: Современный литературный русский язык с простым, достойным повествовательным ритмом. «Предоставил им ночлег» конкретизирует древнее гостеприимство без архаизации; «Иоппия» соответствует традиционной русской форме топонима.
