  yaml_path: translation/nt/acts/010/013.yaml
  text: 'And a voice came to him: “Get up[a], Peter; kill and eat.”'
translation:
  language: ru
  text: 'И голос обратился к нему: «Встань, Пётр, заколи[a] и ешь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принеси в жертву». Глагол может обозначать жертвоприношение, но в этом видении, вероятнее всего, речь идёт о том, чтобы заколоть животное для еды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: раздался
  rationale: В сочетании с φωνή глагол обозначает появление или звучание голоса; «раздался» естественно передаёт событийность выражения.
- source_word: φωνὴ
  choice: голос
  rationale: В контексте откровения речь идёт о членораздельном голосе, а не просто о звуке.
- source_word: πρὸς αὐτόν
  choice: обращённый к нему
  rationale: При глаголах речи πρός с винительным указывает на адресата; такая формулировка ясно передаёт, что голос обращался к Петру.
- source_word: Ἀναστάς
  choice: встань
  rationale: Аористное причастие употреблено в значении последовательного повеления перед следующими императивами.
- source_word: Πέτρε
  choice: Пётр
  rationale: Передан звательный падеж имени Πέτρος; в современном русском отдельной звательной формы у имени нет.
- source_word: θῦσον
  choice: заколи
  rationale: В видении речь идёт об умерщвлении животного ради еды. «Заколи» сохраняет более конкретный оттенок убоя и потенциальную жертвенную окраску глагола лучше, чем общее «убей».
- source_word: φάγε
  choice: ешь
  rationale: Прямое повеление от ἐσθίω естественно передаётся русским императивом «ешь».
- source_word: καὶ
  choice: И
  rationale: Начальное καί продолжает повествовательную последовательность и сохранено обычным русским союзом.
theological_decisions:
- issue: Следует ли передавать θῦσον языком жертвоприношения
  choice: В основном тексте — «заколи»
  alternative: «принеси в жертву» или «убей»
  rationale: Контекст требует умерщвления животного для еды, а не явно культового действия. «Заколи» не навязывает жертвенное толкование, но лучше общего «убей» сохраняет возможный жертвенный оттенок исходного глагола; явная альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая повелительная реплика сохранена. «Раздался обращённый к нему голос» звучит достойно и ясно обозначает адресата. Форма «Пётр» соответствует современной русской библейской традиции.
