  text: καὶ φησί· Κορνήλιε, εἰσηκούσθη σου ἡ προσευχὴ καὶ αἱ ἐλεημοσύναι σου ἐμνήσθησαν ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/031.yaml
  text: And he said[a], ‘Cornelius, your prayer has been heard, and your alms have been remembered before God.’
translation:
  language: ru
  text: 'И он сказал: «Корнилий, твоя молитва услышана, и твои милостыни[a] были вспомянуты перед Богом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дела милосердия», «дары нуждающимся». Греческое слово обозначает милосердную помощь нуждающимся — как дары, так и дела.'
    reason: Лексическая альтернатива поясняет традиционное слово «милостыни» и широту значения греческого ἐλεημοσύναι.
lexical_decisions:
- source_word: φησί
  choice: сказал
  rationale: Историческое настоящее в греческом повествовании естественно передаётся по-русски прошедшим временем.
- source_word: Κορνήλιε
  choice: Корнилий
  rationale: Использована традиционная русская форма личного имени в звательном обращении.
- source_word: εἰσηκούσθη
  choice: услышана
  rationale: Краткая страдательная форма сохраняет пассив и передаёт, что молитва была принята и услышана.
- source_word: ἡ προσευχὴ
  choice: твоя молитва
  rationale: Сохранены единственное число и обычное значение слова προσευχή.
- source_word: αἱ ἐλεημοσύναι
  choice: твои милостыни
  rationale: «Милостыни» точно и традиционно обозначают конкретные дары или дела милосердия в пользу нуждающихся; сноска поясняет это слово современному читателю.
- source_word: ἐμνήσθησαν ἐνώπιον τοῦ θεοῦ
  choice: Бог вспомнил о
  rationale: Естественная русская конструкция передаёт семитизированный греческий оборот «были вспомянуты перед Богом». Активная форма делает явного по смыслу субъекта грамматически выраженным, не добавляя идеи заслуги.
theological_decisions:
- issue: Значение милостынь Корнилия
  choice: «милостыни» с пояснительной сноской
  alternative: «дела милосердия» или «благотворительные дары»
  rationale: Перевод сохраняет конкретный смысл помощи нуждающимся, но не выводит из стиха учения о заслуге или основании спасения.
- issue: Язык Божьего памятования
  choice: «Бог вспомнил о твоих милостынях»
  alternative: «твои милостыни были вспомянуты перед Богом»
  rationale: Сохранён библейский образ памятования, тогда как буквальная страдательная конструкция звучала бы по-русски неестественно и могла бы пониматься как упоминание милостынь кем-то третьим.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Традиционный термин «милостыни» сохранён ради точности, а его значение раскрыто в сноске.
