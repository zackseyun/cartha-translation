  text: And when Peter entered[a], Cornelius met him and fell at his feet and paid him homage.
translation:
  language: ru
  text: Когда Пётр вошёл, Корнилий встретил его, пал к его ногам и поклонился ему.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воздал ему почести». Греческий глагол может означать поклонение либо падение ниц как знак глубокого почтения — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον
  choice: Когда Пётр вошёл
  rationale: Греческая повествовательная конструкция естественно передаётся временным придаточным; простой вид завершённого действия соответствует аористному инфинитиву, а отдельная передача δέ по-русски не требуется.
- source_word: συναντήσας αὐτῷ
  choice: встретил его
  rationale: Естественно и кратко передаёт действие Корнилия при входе Петра.
- source_word: πεσὼν ἐπὶ τοὺς πόδας
  choice: пал к его ногам
  rationale: Сохраняет физический жест глубокого почтения и звучит достойно в современном литературном русском.
- source_word: προσεκύνησεν
  choice: поклонился ему
  rationale: Глагол обозначает поклонение или земной поклон как выражение почтения в зависимости от контекста. Русское «поклонился» сохраняет эту смысловую широту, не решая заранее, считал ли Корнилий Петра божественным адресатом поклонения.
theological_decisions:
- issue: Значение προσκυνέω по отношению к Петру
  choice: поклонился ему
  alternative: поклонился ему как Богу / воздал ему почести
  rationale: Контекст следующего стиха показывает, что Пётр отвергает этот жест, поскольку сам является человеком. Основной перевод сохраняет серьёзность действия, но не навязывает более узкое богословское толкование; возможное значение «поклонение» отмечено в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Пал к его ногам» предпочтено более разговорному «упал», а «поклонился» сохраняет подлинную лексическую неоднозначность προσκυνέω.
