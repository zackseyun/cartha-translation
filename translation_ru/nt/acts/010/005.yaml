  text: καὶ νῦν πέμψον ⸂ἄνδρας εἰς Ἰόππην⸃ καὶ μετάπεμψαι Σίμωνά ⸂τινα ὃς ἐπικαλεῖται Πέτρος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/005.yaml
  text: And now send men to Joppa and summon a certain Simon who is called Peter[a].
translation:
  language: ru
  text: А теперь пошли людей в Иоппию и пошли за неким Симоном, которого называют Петром[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…пошли за Симоном, известным как Пётр».'
    reason: Передаёт допустимую альтернативную формулировку имени, которым известен Симон; основное чтение сохраняет τινα («неким»).
lexical_decisions:
- source_word: καὶ νῦν
  choice: А теперь
  rationale: Сохраняет связь с предыдущей речью и естественно передаёт переход к непосредственному повелению.
- source_word: πέμψον
  choice: пошли
  rationale: Прямой и естественный русский императив, соответствующий аористу повелительного наклонения второго лица единственного числа.
- source_word: ἄνδρας
  choice: людей
  rationale: В данном контексте речь идёт о посланных мужчинах, однако русское «людей» естественно при глаголе «пошли» и не добавляет не выраженного в тексте значения «вестников».
- source_word: εἰς Ἰόππην
  choice: в Иоппию
  rationale: Обычная русская передача направления к городу; использована традиционная русская форма топонима.
- source_word: μετάπεμψαι
  choice: позови
  rationale: Передаёт значение «пошли за ним, чтобы он пришёл» естественным современным русским языком, не усиливая оттенок принудительного вызова.
- source_word: Σίμωνά τινα
  choice: Симона
  rationale: Русский язык обычно не требует буквального воспроизведения неопределённого τινα перед личным именем; личность далее уточняется вторым именем. Альтернативный оттенок отражён в сноске.
- source_word: ὃς ἐπικαλεῖται Πέτρος
  choice: которого называют Петром
  rationale: Точно и естественно передаёт имя, которым этот Симон известен, без устаревшего «прозывается».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным, прямым повелением. Формулировка сохраняет повествовательную связь и избегает как архаизмов, так и излишне официального «вызови».
