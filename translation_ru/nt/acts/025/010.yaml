  source_fidelity: 'Основной текст в целом точно передаёт юридический контекст: βῆμα — «суд», Καίσαρος — «кесаря», а «где мне и надлежит быть судимым» адекватно выражает надлежащую юрисдикцию. «Я ни в чём не поступил несправедливо с иудеями» верно передаёт οὐδὲν ἠδίκησα Ἰουδαίους, хотя несколько более эксплицитно, чем греческое выражение.'
  naturalness: Текст звучит естественно на современном литературном русском. Формула «стою перед судом кесаря» уместна в судебно-повествовательном регистре; «иудеи» исторически и контекстуально оправдано.
