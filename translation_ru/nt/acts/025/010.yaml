  text: εἶπεν δὲ ὁ Παῦλος· ⸂Ἐπὶ τοῦ βήματος Καίσαρος ἑστώς⸃ εἰμι, οὗ με δεῖ κρίνεσθαι. Ἰουδαίους οὐδὲν ⸀ἠδίκησα, ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/010.yaml
  text: But Paul said[a], “I am standing before Caesar’s tribunal, where I ought to be judged. I have done no wrong to the Jews[c][b], as you yourself know very well.”
translation:
  language: ru
  text: 'Но Павел сказал: «Я стою перед судом кесаря[a], где мне и надлежит быть судимым. Я ни в чём не поступил несправедливо с иудеями[b], как ты и сам прекрасно знаешь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед трибуналом кесаря». Греческое βῆμα обозначает официальное судейское место или трибунал.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я ничем не обидел иудеев».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βῆμα
  choice: суд
  rationale: В данном контексте слово обозначает официальный судебный орган или место отправления суда; «суд» естественно и ясно передаёт юридический смысл по-русски.
- source_word: Καίσαρος
  choice: кесаря
  rationale: Сохраняет исторический римский титул и близко следует греческому тексту.
- source_word: ἑστώς εἰμι
  choice: я стою
  rationale: Передаёт подчёркнутое греческой перифрастической конструкцией нынешнее юридическое положение Павла и сохраняет образ стояния перед судом.
- source_word: οὗ
  choice: где
  rationale: Естественно по-русски отсылает к суду как к надлежащей инстанции разбирательства.
- source_word: δεῖ
  choice: надлежит
  rationale: Выражает должную юридическую необходимость и компетенцию суда, не сводя смысл к личной обязанности Павла.
- source_word: κρίνεσθαι
  choice: быть судимым
  rationale: Близко передаёт пассивную форму и юридический смысл греческого глагола.
- source_word: Ἰουδαίους
  choice: иудеями
  rationale: Прямой исторически уместный эквивалент; контекст не требует сужать значение до жителей Иудеи или только руководителей.
- source_word: οὐδὲν ἠδίκησα
  choice: я ни в чём не поступил несправедливо
  rationale: Сохраняет морально-юридическую силу ἀδικέω и грамматическое отношение к иудеям, оставаясь понятным современному читателю.
- source_word: ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις
  choice: как ты и сам прекрасно знаешь
  rationale: «И сам» передаёт эмфатическое καὶ σὺ, а «прекрасно знаешь» естественно выражает усиленное знание и сравнительную форму κάλλιον в данном идиоматическом контексте.
