  yaml_path: translation/nt/acts/025/019.yaml
  text: Rather[a], they had certain disputes with him about their own religion and about a certain Jesus who had died, whom Paul claimed to be alive.
translation:
  language: ru
  text: Но у них были с ним некоторые споры по поводу их собственной религии[a] и по поводу некоего Иисуса, который умер, а Павел утверждал, что Он жив.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их собственного суеверия». Греческое слово может нейтрально обозначать религию или, в устах стороннего наблюдателя, иметь неодобрительный оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματα
  choice: разногласия по некоторым вопросам
  rationale: Слово обозначает спорные вопросы, а не нейтральные расспросы; сочетание естественно по-русски передаёт предмет разбирательства.
- source_word: δέ
  choice: но
  rationale: Передаёт противопоставление ожидавшихся уголовных обвинений тому, что обвинители фактически обсуждали.
- source_word: περὶ τῆς ἰδίας δεισιδαιμονίας
  choice: об их собственной религии
  rationale: δεισιδαιμονία может быть нейтральным обозначением религии или нести оттенок неодобрения. Основной вариант не усиливает неодобрение, а «собственной» сохраняет дистанцированную позицию Феста.
- source_word: καὶ περί τινος Ἰησοῦ
  choice: и о некоем Иисусе
  rationale: «Некоем» сохраняет неопределённую и отстранённую манеру, в которой Фест упоминает Иисуса.
- source_word: τεθνηκότος
  choice: который умер
  rationale: Естественно передаёт совершившуюся смерть и создаёт ясный контраст с утверждением, что Иисус жив.
- source_word: ὃν ἔφασκεν ὁ Παῦλος ζῆν
  choice: но о котором Павел утверждал, что он жив
  rationale: «Утверждал» передаёт φάσκω как изложение заявления Павла с точки зрения Феста, без оценки его истинности; добавленное «но» естественно выражает заложенный в содержании контраст смерти и жизни.
theological_decisions:
- issue: Передача δεισιδαιμονία в речи Феста
  choice: религия
  alternative: суеверие
  rationale: «Религия» не привносит более резкого современного уничижительного смысла, чем непременно требует греческое слово; возможный неодобрительный оттенок отмечен в сноске.
- issue: Формулировка утверждения о воскресении
  choice: Павел утверждал, что он жив
  alternative: Павел говорил, что он жив
  rationale: Формулировка сохраняет перспективу Феста, который пересказывает позицию Павла, и не превращает его слова в прямое утверждение рассказчика или в отрицание воскресения.
translation_notes:
  register: Современный литературный русский язык с умеренно официальным оттенком, соответствующим речи римского наместника. Сохранены дистанцированное «некоем Иисусе» и смысловая напряжённость между смертью Иисуса и утверждением Павла, что Он жив.
