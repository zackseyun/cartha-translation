  terminology: «Их собственной религии» адекватно передаёт τῆς ἰδίας δεισιδαιμονίας, а сноска корректно сохраняет возможность более неодобрительного «суеверия». «Некоем Иисусе» удачно отражает отстранённость τις; «Павел утверждал, что Он жив» передаёт ἔφασκεν ... ζῆν без конфессионального переосмысления.
