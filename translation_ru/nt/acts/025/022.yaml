base_translation:
  language: en
  yaml_path: translation/nt/acts/025/022.yaml
  text: Then Agrippa said to Festus[a], “I myself would like to hear the man.” “Tomorrow,” he says[c][b], “you will hear him.”
translation:
  language: ru
  text: 'Тогда Агриппа сказал Фесту: «Я и сам хотел бы послушать этого человека». «Завтра, — говорит он, — услышишь его[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «услышишь от него», то есть услышишь, что он сам скажет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας δὲ πρὸς τὸν Φῆστον
  choice: Тогда Агриппа сказал Фесту
  rationale: δέ обозначает продвижение повествования; подразумеваемый глагол речи естественно восполнен по-русски конструкцией «сказал Фесту».
- source_word: Ἐβουλόμην
  choice: хотел бы
  rationale: Имперфект βούλομαι здесь естественно передаёт вежливо выраженное желание; буквальное «я хотел» по-русски может ошибочно звучать как желание, оставшееся в прошлом.
- source_word: καὶ αὐτὸς
  choice: и сам
  rationale: Сочетание допускает как присоединительный оттенок «тоже», так и усилительный «сам»; «и сам» естественно сохраняет оба оттенка.
- source_word: τοῦ ἀνθρώπου ἀκοῦσαι
  choice: послушать этого человека
  rationale: Генитив при ἀκούω обозначает того, кого слушают; «послушать» в русском языке яснее указывает на желание лично услышать речь Павла.
- source_word: φησίν
  choice: говорит он
  rationale: Сохранено историческое настоящее греческого текста, придающее рассказу живость.
- source_word: ἀκούσῃ αὐτοῦ
  choice: услышишь его
  rationale: Будущая форма с генитивом может обозначать непосредственное слушание человека; краткая формулировка сохраняет широту оригинала.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с естественным диалогом и сохранением исторического настоящего. «Этого человека» уместно для уже известного участникам разговора Павла; «и сам» сохраняет неоднозначность καὶ αὐτός.
