  text: Итак, Фест, прибыв в провинцию[a], через три дня поднялся из Кесарии в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вступив в управление провинцией». Греческое выражение может указывать на прибытие Феста в провинцию и, по смыслу контекста, на начало его управления ею.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Итак
  rationale: Передаёт связь с предшествующим повествованием и естественно вводит следующий эпизод.
- source_word: ἐπιβὰς τῇ ἐπαρχείᾳ
  choice: прибыв в провинцию
  rationale: Сохраняет временное значение причастия и прямой смысл прибытия Феста в провинцию, не превращая подразумеваемое вступление в должность в основной текст.
- source_word: ἐπαρχείᾳ
  choice: провинцию
  rationale: Обозначает римскую административную провинцию; это исторически точный и понятный современному читателю термин.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: через три дня
  rationale: Естественно по-русски передаёт временную последовательность, выраженную μετά с винительным падежом.
- source_word: ἀνέβη
  choice: отправился
  rationale: В русском основном тексте естественно обозначает путь в Иерусалим; буквальное «поднялся» могло бы неоправданно выдвинуть на первый план физический подъём.
- source_word: εἰς Ἱεροσόλυμα
  choice: в Иерусалим
  rationale: Обычное русское обозначение направления движения к городу.
- source_word: ἀπὸ Καισαρείας
  choice: из Кесарии
  rationale: Точно передаёт исходный пункт движения, выраженный предлогом ἀπό.
- source_word: Φῆστος
  choice: Фест
  rationale: Устоявшаяся русская передача имени римского наместника.
