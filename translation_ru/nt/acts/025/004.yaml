  yaml_path: translation/nt/acts/025/004.yaml
  text: Festus therefore answered that Paul was being kept in Caesarea, and that he himself was about to leave shortly.
translation:
  language: ru
  text: Фест ответил, что Павел содержится под стражей в Кесарии, а сам он вскоре намерен туда отправиться.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηρεῖσθαι
  choice: содержится под стражей
  rationale: В данном судебно-административном контексте передаёт значение нахождения Павла под охраной точнее, чем общее «находится» или буквальное «содержится».
- source_word: εἰς Καισάρειαν
  choice: в Кесарии
  rationale: Несмотря на формальное направление, конструкция при глаголе удержания по смыслу указывает на место содержания; такое употребление εἰς возможно вместо ἐν.
- source_word: μέλλειν ἐν τάχει ἐκπορεύεσθαι
  choice: вскоре намерен туда отправиться
  rationale: Передаёт близкое намерение Феста выехать; «туда» естественно уточняет подразумеваемое направление — Кесарию.
