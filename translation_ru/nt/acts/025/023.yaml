  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τῇ οὖν ἐπαύριον ἐλθόντος τοῦ Ἀγρίππα καὶ τῆς Βερνίκης μετὰ πολλῆς φαντασίας καὶ εἰσελθόντων εἰς τὸ ἀκροατήριον σύν ⸀τε χιλιάρχοις καὶ ἀνδράσιν τοῖς κατ’ ⸀ἐξοχὴν τῆς πόλεως καὶ κελεύσαντος τοῦ Φήστου ἤχθη ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/023.yaml
  text: So on the next day, Agrippa and Bernice came with great pomp and entered the audience hall with both the military tribunes and the prominent men of the city, and at Festus's command Paul was brought in.
translation:
  language: ru
  text: На следующий день Агриппа и Вереника прибыли с большой пышностью[a] и вошли в зал для слушаний вместе с военными трибунами и видными людьми города[b]. По приказу Феста привели Павла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с большой торжественностью»; «с блеском и показной роскошью».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с влиятельными мужами города».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ οὖν ἐπαύριον
  choice: На следующий день
  rationale: Естественная русская передача обстоятельства времени; οὖν выражает переход в повествовании и не требует отдельного слова в данном контексте.
- source_word: ἐλθόντος
  choice: прибыли
  rationale: Личная форма естественно передаёт греческое причастие в конструкции genitivus absolutus; «прибыли» уместно для официального появления.
- source_word: Ἀγρίππα ... Βερνίκης
  choice: Агриппа и Вереника
  rationale: Использованы традиционные русские формы библейских имён.
- source_word: μετὰ πολλῆς φαντασίας
  choice: с большой пышностью
  rationale: В данном контексте φαντασία обозначает внешнюю торжественность, блеск и демонстративность публичного появления.
- source_word: εἰσελθόντων εἰς τὸ ἀκροατήριον
  choice: вошли в зал для слушаний
  rationale: ἀκροατήριον — помещение, предназначенное для официального слушания; перевод ясен современному читателю и не навязывает более узкое судебное значение.
- source_word: σύν τε χιλιάρχοις
  choice: вместе с военными трибунами
  rationale: χιλίαρχοι в римской административно-военной обстановке обозначает высокопоставленных командиров; «военные трибуны» исторически точно и понятно из контекста.
- source_word: ἀνδράσιν τοῖς κατ’ ἐξοχὴν τῆς πόλεως
  choice: видными людьми города
  rationale: κατ’ ἐξοχήν указывает на общественную известность и высокое положение; формулировка остаётся современной и передаёт множественное ἀνδράσιν без архаизма «мужи».
- source_word: κελεύσαντος τοῦ Φήστου
  choice: По приказу Феста
  rationale: Краткая и естественная передача genitivus absolutus, сохраняющая официальный характер распоряжения.
- source_word: ἤχθη ὁ Παῦλος
  choice: привели Павла
  rationale: Пассивная форма ἤχθη показывает, что Павла ввели или доставили по распоряжению; русская неопределённо-личная конструкция звучит естественнее буквального пассива.
