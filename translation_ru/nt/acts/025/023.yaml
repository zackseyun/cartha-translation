  source_fidelity: 'Текст точно передаёт последовательность и основные элементы греческого оригинала: прибытие Агриппы и Вереники на следующий день, их подчеркнуто пышное появление, вход в помещение для слушаний вместе с военными трибунами и видными горожанами, а также распоряжение Феста привести Павла. Неопределённо-личное «привели Павла» адекватно передаёт пассивное ἤχθη.'
