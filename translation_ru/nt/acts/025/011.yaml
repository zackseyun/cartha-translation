base_translation:
  language: en
  yaml_path: translation/nt/acts/025/011.yaml
  text: If[a], then, I am doing wrong and have done anything deserving death, I do not refuse to die. But if there is nothing to the things these men are accusing me of, no one can hand me over to them as a favor. I appeal to Caesar.
translation:
  language: ru
  text: Итак, если я поступаю неправедно и совершил что-либо, заслуживающее смерти, я не отказываюсь умереть. Но если ни одно из обвинений, которые эти люди выдвигают против меня, не имеет оснований, никто не может выдать меня им в угоду[a]. Я апеллирую к кесарю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никто не может уступить меня им как услугу». Греческий глагол означает передать или уступить кого-либо в качестве одолжения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶ
  choice: совершаю преступление
  rationale: Настоящее время сохранено; в судебном контексте глагол обозначает противоправное деяние, но перевод не уточняет конкретного обвинения.
- source_word: ἄξιον θανάτου πέπραχά τι
  choice: сделал что-либо заслуживающее смерти
  rationale: Перфект передан результативным прошедшим «сделал», а τι — неопределённым «что-либо»; выражение сохраняет как юридическую, так и оценочную силу.
- source_word: οὐ παραιτοῦμαι τὸ ἀποθανεῖν
  choice: не отказываюсь умереть
  rationale: Прямо передаёт значение отказа или уклонения и условную готовность Павла принять смертную казнь.
- source_word: οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου
  choice: обвинения этих людей против меня беспочвенны
  rationale: Естественная русская формулировка передаёт отсутствие оснований или содержания у обвинений, не добавляя конкретного вердикта.
- source_word: χαρίσασθαι
  choice: выдать меня им в угоду
  rationale: Передаёт одновременно фактическую передачу обвиняемого и оттенок уступки в пользу обвинителей.
- source_word: Καίσαρα ἐπικαλοῦμαι
  choice: Я требую суда кесаря
  rationale: В данном юридическом контексте это формула обращения к императорской судебной инстанции; «требую суда кесаря» ясно передаёт правовой смысл, не предполагая личного обращения к правителю.
- source_word: μὲν οὖν ... δὲ
  choice: Итак, если... Но если
  rationale: Сохраняет последовательность и контраст двух условных частей рассуждения.
theological_decisions:
- issue: Судебный смысл согласия умереть и обращения к кесарю
  choice: Условно признана правомерность смерти в случае действительной вины, при одновременном отрицании права выдать Павла обвинителям без оснований.
  alternative: Считать слова лишь риторическими, не допускающими правомерности смертного приговора.
  rationale: Греческий текст формулирует реальное условие и отказ уклоняться от смерти, однако стих имеет прежде всего юридическую направленность и не превращён в общее учение о смертной казни.
translation_notes:
  register: Современный литературный русский язык с достоинством судебной речи. «Кесарь» сохраняет привычное библейское обозначение римского императора; синтаксис сделан естественным без устранения условности аргумента.
