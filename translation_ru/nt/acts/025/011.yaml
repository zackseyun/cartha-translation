    rationale: Русское «преступление» прямо задаёт уголовно-правовую квалификацию, которой исходный глагол сам по себе не specifies. Более широкое «поступаю неправедно» сохраняет морально-правовую неопределённость оригинала.
  - severity: medium
    issue: «Я требую суда кесаря» для Καίσαρα ἐπικαλοῦμαι
    rationale: Греческое выражение является формулой апелляции к кесарю; «требую суда» объясняет предполагаемое следствие, но заменяет речевой акт. «Я апеллирую к кесарю» ближе к источнику и естественно по-русски.
  - severity: low
    issue: Необособленное определение в «сделал что-либо заслуживающее смерти»
    rationale: Запятая необходима; глагол «совершил» также лучше соответствует судебному регистру.
