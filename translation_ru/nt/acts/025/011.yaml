revisions:
- from: Итак, если я совершаю преступление и сделал что-либо заслуживающее смерти, то не отказываюсь умереть. Но если обвинения этих людей против меня беспочвенны, никто не может выдать меня им в угоду[a]. Я требую суда кесаря.
  to: Итак, если я поступаю неправедно и совершил что-либо, заслуживающее смерти, я не отказываюсь умереть. Но если ни одно из обвинений, которые эти люди выдвигают против меня, не имеет оснований, никто не может выдать меня им в угоду[a]. Я апеллирую к кесарю.
