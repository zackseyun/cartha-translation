review_pass:
  verdict: revise
  source_fidelity: В первой части «совершаю преступление» несколько сужает ἀδικῶ, которое может обозначать более широко «поступать неправедно / быть виновным в неправом деле». Формула «Я требую суда кесаря» передаёт общий юридический смысл, но менее точно отражает техническое ἐπικαλοῦμαι («апеллирую»). Остальные смысловые связи, включая условное принятие смерти при виновности и недопустимость уступки обвиняемым, переданы верно.
  naturalness: Текст в целом литературен, но «сделал что-либо заслуживающее смерти» требует обособления и звучит менее естественно, чем «совершил что-либо, заслуживающее смерти». «Апеллирую к кесарю» — ясная современная юридическая формула в данном контексте.
  terminology: «Кесарь» уместно сохраняет библейско-историческое обозначение римского императора. «В угоду им» удачно передаёт прагматический оттенок χαρίσασθαι; сноска сохраняет значение уступки/передачи как услуги. «Поступаю неправедно» избегает неоправданного сведения исходного глагола к конкретному уголовному составу.
  issues:
