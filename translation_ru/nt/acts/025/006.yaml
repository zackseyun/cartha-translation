lexical_decisions:
- source_word: Διατρίψας δὲ ἐν αὐτοῖς
  choice: Проведя у них
  rationale: Деепричастная конструкция естественно передаёт предшествующее действие; «у них» в данном контексте означает пребывание среди ранее упомянутых людей.
- source_word: ἡμέρας οὐ πλείους ὀκτὼ ἢ δέκα
  choice: не больше восьми или десяти дней
  rationale: Формулировка сохраняет отрицательную сравнительную конструкцию и присущую греческому тексту приблизительность, не превращая срок в точное число.
- source_word: καταβὰς εἰς Καισάρειαν
  choice: он спустился в Кесарию
  rationale: Сохранён обычный географический оборот о движении из Иерусалима вниз, в Кесарию; причастие передано личной формой ради естественного русского синтаксиса.
- source_word: τῇ ἐπαύριον
  choice: на следующий день
  rationale: Ясная и современная передача устойчивого временного выражения.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: занял место в судейском кресле
  rationale: βῆμα обозначает официальное место судьи, связанное с отправлением суда; выбранная формулировка передаёт не просто действие сидения, а вступление в судебную роль.
- source_word: ἐκέλευσεν τὸν Παῦλον ἀχθῆναι
  choice: приказал привести Павла
  rationale: Кратко и естественно передаёт официальный приказ и пассивный инфинитив ἀχθῆναι; направление внутрь судебного помещения остаётся подразумеваемым, как и в греческом.
