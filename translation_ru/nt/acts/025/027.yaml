  text: ἄλογον γάρ μοι δοκεῖ πέμποντα δέσμιον μὴ καὶ τὰς κατ’ αὐτοῦ αἰτίας σημᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/027.yaml
  text: For it seems unreasonable to me[a], when sending a prisoner, not also to indicate the charges against him.
translation:
  language: ru
  text: Ведь мне кажется неразумным отправлять узника, не указав также обвинений против него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не обозначив также, в чём его обвиняют».'
    reason: Лексическая альтернатива для σημᾶναι и τὰς κατ’ αὐτοῦ αἰτίας; передаёт значение «обозначить/сообщить» и раскрывает содержание обвинений.
lexical_decisions:
- source_word: ἄλογον
  choice: неразумным
  rationale: Передаёт оценку действия как лишённого разумного основания; в административно-правовом контексте звучит естественнее, чем более резкие «нелепым» или «абсурдным».
- source_word: δοκεῖ μοι
  choice: мне кажется
  rationale: Сохраняет личную и несколько осторожную оценку, выраженную греческой конструкцией.
- source_word: πέμποντα
  choice: отправляя
  rationale: Деепричастие передаёт обстоятельственное отношение причастия к подразумеваемому субъекту первого лица.
- source_word: δέσμιον
  choice: узника
  rationale: Естественное и достойное обозначение человека, содержащегося под стражей; «заключённого» также возможно, но несколько сильнее ассоциируется с уже вынесенным приговором.
- source_word: μὴ καὶ
  choice: не указать также
  rationale: '«Также» сохраняет добавочное значение καί: вместе с отправкой узника должны быть сообщены и обвинения.'
- source_word: τὰς κατ’ αὐτοῦ αἰτίας
  choice: выдвинутые против него обвинения
  rationale: В судебном контексте αἰτίαι обозначает обвинения или предъявляемые пункты обвинения; добавление «выдвинутые» делает русскую формулировку естественной, не меняя смысла.
- source_word: σημᾶναι
  choice: указать
  rationale: Передаёт значение «сообщить, обозначить» и естественно сочетается с официальным изложением обвинений; более конкретное «перечислить» было бы излишне узким.
