lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественно передаёт временную и последовательную связь в повествовании.
- source_word: συλλαλήσας
  choice: посоветовавшись
  rationale: Аористное причастие обозначает предшествующее обсуждение; выбранное слово естественно передаёт совещательный характер разговора.
- source_word: μετὰ τοῦ συμβουλίου
  choice: с советом
  rationale: Существительное обозначает совещательный орган; притяжательное «своим» в греческом тексте прямо не выражено.
- source_word: ἀπεκρίθη
  choice: ответил
  rationale: Сохраняет обычное повествовательное значение и уместный официальный тон.
- source_word: Καίσαρα
  choice: кесаря
  rationale: Сохраняет римский титул и историко-правовой контекст; традиционная русская форма в новозаветном повествовании.
- source_word: ἐπικέκλησαι
  choice: ты потребовал суда
  rationale: Перфект среднего залога употреблён в юридическом смысле обращения к юрисдикции кесаря; формулировка ясно выражает апелляцию, не предполагая современную систему обжалования во всех деталях.
- source_word: ἐπὶ Καίσαρα
  choice: к кесарю
  rationale: Передаёт движение к той власти, к которой Павел обратился; юридический оттенок явки перед императорским судом пояснён в сноске.
- source_word: πορεύσῃ
  choice: отправишься
  rationale: Будущее время глагола движения передано прямо, без не выраженного в греческом пассивного «будешь отправлен».
