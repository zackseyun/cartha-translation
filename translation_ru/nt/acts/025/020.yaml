base_translation:
  language: en
  yaml_path: translation/nt/acts/025/020.yaml
  text: And since I was at a loss about the investigation concerning these matters[b][a], I asked whether he wanted to go to Jerusalem and be judged there concerning them.
translation:
  language: ru
  text: Не зная, как разобраться в этих вопросах[a], я спросил, хочет ли он отправиться в Иерусалим и там предстать перед судом по этим вопросам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «недоумевая относительно разбирательства по этим вопросам».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и там быть судимым по этим вопросам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπορούμενος
  choice: не зная, как разобраться
  rationale: Причастие передаёт затруднение и неуверенность Феста; деепричастно-описательная конструкция естественна по-русски и сохраняет причинный оттенок контекста.
- source_word: τὴν περὶ τούτων ζήτησιν
  choice: как разобраться в этих вопросах
  rationale: ζήτησις может обозначать исследование, разбирательство или спорный вопрос. Русская конструкция естественно передаёт затруднение Феста относительно рассмотрения названных дел, не превращая фразу в техническое обозначение следствия.
- source_word: ἔλεγον εἰ βούλοιτο
  choice: я спросил, хочет ли он
  rationale: Хотя ἔλεγον буквально означает «я говорил», последующий косвенный вопрос с εἰ функционально требует «спросил»; βούλοιτο передано обычным современным «хочет ли».
- source_word: πορεύεσθαι εἰς Ἱεροσόλυμα
  choice: отправиться в Иерусалим
  rationale: «Отправиться» естественно передаёт движение к месту и соответствует достойному повествовательному регистру.
- source_word: κἀκεῖ κρίνεσθαι περὶ τούτων
  choice: и там предстать перед судом по этому делу
  rationale: В данном юридическом контексте пассивное κρίνεσθαι означает подвергнуться судебному разбирательству. «Предстать перед судом» по-русски естественнее буквального «быть судимым» и не утверждает заранее виновность.
