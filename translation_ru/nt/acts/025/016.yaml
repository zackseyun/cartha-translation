base_translation:
  language: en
  yaml_path: translation/nt/acts/025/016.yaml
  text: To them I answered that it is not the custom of the Romans to hand over any man before the accused has the accusers face to face and receives an opportunity for a defense concerning the charge[a][b].
translation:
  language: ru
  text: Я ответил им, что у римлян не принято выдавать человека в угоду кому-либо[a], прежде чем обвиняемый предстанет перед обвинителями лицом к лицу и получит возможность защищаться по этому обвинению.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выдавать человека в качестве одолжения»; греческий глагол может означать передачу человека ради удовлетворения чьей-либо просьбы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθος
  choice: принято
  rationale: Передаёт установившийся обычай или практику и естественно звучит в русском юридико-административном контексте.
- source_word: Ῥωμαίοις
  choice: у римлян
  rationale: Дательный множественного числа обозначает римлян как носителей данной судебной практики; русская конструкция «у римлян не принято» точна и естественна.
- source_word: χαρίζεσθαί
  choice: выдавать ... в угоду кому-либо
  rationale: Глагол означает предоставить или отдать кого-либо как услугу другой стороне; перевод сохраняет и судебный смысл передачи, и оттенок удовлетворения чужой просьбы.
- source_word: τινα ἄνθρωπον
  choice: человека
  rationale: ἄνθρωπος в этом правовом контексте обозначает любого человека; русское существительное сохраняет форму источника без неестественного «какого-либо человека».
- source_word: ὁ κατηγορούμενος
  choice: обвиняемый
  rationale: Субстантивированное причастие обозначает человека, против которого выдвинуто обвинение; это точный и общеупотребительный юридический эквивалент.
- source_word: κατὰ πρόσωπον
  choice: лицом к лицу
  rationale: Сохраняет образность греческой идиомы и ясно выражает непосредственную очную встречу сторон.
- source_word: τόπον ... ἀπολογίας λάβοι
  choice: получит возможность защищаться
  rationale: τόπος здесь означает возможность, а ἀπολογία — защиту в ответ на обвинение; глагольная русская конструкция звучит естественно.
- source_word: περὶ τοῦ ἐγκλήματος
  choice: от предъявленного обвинения
  rationale: ἔγκλημα — юридическое обвинение; конструкция согласована с естественным русским выражением «защищаться от обвинения».
