translation_notes:
  register: Современный литературный русский язык с умеренно официальным судебным регистром. Синтаксис сохраняет последовательность условий оригинала, но избегает тяжеловесной буквальности. Оттенок χαρίζομαι не сводится к нейтральной передаче и отражён словами «в угоду кому-либо» и сноской.
