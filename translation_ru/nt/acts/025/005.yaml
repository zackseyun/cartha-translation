    text: 'Или: «пусть влиятельные люди среди вас»; греческое слово может обозначать как тех, кто способен или имеет возможность что-либо сделать, так и людей влиятельных либо облечённых властью.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «если в этом человеке есть что-либо неподобающее»; греческое слово может означать любой проступок или нечто недолжное, а не обязательно уже установленное преступление.'
    reason: lexical_clarification
lexical_decisions:
- source_word: Οἱ οὖν
  choice: Итак, пусть…
  rationale: οὖν продолжает рассуждение и вводит практический вывод; русское «итак» естественно передаёт эту связь, а субстантивированное οἱ раскрывается далее вместе с δυνατοί.
- source_word: ἐν ὑμῖν ... δυνατοὶ
  choice: те из вас, кто имеет возможность
  rationale: Дυνατοί допускает значения «способные», «имеющие возможность», а также «влиятельные, обладающие властью». Основной текст сохраняет непосредственный смысл способности или возможности участвовать в поездке, не вводя без необходимости социальный статус; неоднозначность отмечена в сноске.
- source_word: φησίν
  choice: не выражено отдельно
  rationale: Это вставное «говорит он», обозначающее принадлежность речи Фесту. В русском внутри уже оформленной прямой речи отдельное воспроизведение было бы тяжеловесным и не добавляло бы содержания.
- source_word: συγκαταβάντες
  choice: сойдут со мной
  rationale: Глагол обозначает совместное движение вниз. «Сойдут» сохраняет принятую географическую перспективу пути из Иерусалима в Кесарию, а «со мной» передаёт приставку συν- и подразумеваемое сопровождение Феста.
- source_word: εἴ τί ἐστιν ἐν τῷ ἀνδρὶ ἄτοπον
  choice: если за этим человеком есть что-либо предосудительное
  rationale: Формулировка сохраняет условность εἴ, неопределённость τί и широкий смысл ἄτοπον — чего-либо неподобающего или дурного, — не усиливая его до доказанного преступления. Оборот «за этим человеком» естественнее буквального «в этом человеке» в данном юридическом контексте.
- source_word: κατηγορείτωσαν αὐτοῦ
  choice: обвинят его
  rationale: Повелительная форма третьего лица передана конструкцией с «пусть» в начале предложения; «обвинят его» кратко и точно передаёт юридическое κατηγορέω, не добавляя деталей о форме предъявления обвинений.
