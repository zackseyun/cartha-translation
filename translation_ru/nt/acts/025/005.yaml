base_translation:
  language: en
  yaml_path: translation/nt/acts/025/005.yaml
  text: Therefore[a], let those among you who are able go down with me, and if there is anything wrong in the man[b], let them accuse him.
translation:
  language: ru
  text: Итак, пусть те из вас, кто имеет возможность[a], сойдут со мной и, если этот человек в чём-либо виновен[b], обвинят его.
  philosophy: optimal-equivalence
  footnotes:
