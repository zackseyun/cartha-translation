  text: But when Paul appealed to be kept in custody for the decision of the Emperor[a], I ordered that he be kept in custody until I send him to Caesar.
translation:
  language: ru
  text: Но когда Павел подал апелляцию с просьбой оставить его под стражей до решения императора[a], я распорядился держать его под стражей, пока не отправлю его к кесарю.
