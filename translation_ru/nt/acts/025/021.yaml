    text: 'В греческом тексте: «Августейшего» (Σεβαστός) — императорский титул, соответствующий латинскому Augustus («Август»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεσαμένου
  choice: потребовал
  rationale: В данном римском судебном контексте средний залог обозначает официальное обращение к высшей власти. «Потребовал» естественно связывается с последующим инфинитивом «оставить»; юридический смысл апелляции ясен из контекста, без добавления отсутствующего в этом стихе дополнения.
- source_word: τηρηθῆναι / τηρεῖσθαι
  choice: оставить под стражей / держать под стражей
  rationale: τηρέω здесь относится к официальному содержанию заключённого. Русские выражения передают правовой смысл и естественно варьируются согласно синтаксису двух конструкций.
- source_word: διάγνωσιν
  choice: решения
  rationale: Слово обозначает судебное рассмотрение, ведущее к определению или решению. «Решение» не сужает значение до самого слушания и не предполагает непременно обвинительного приговора.
- source_word: Σεβαστοῦ
  choice: императора
  rationale: Субстантивированное Σεβαστός здесь является императорским титулом, греческим соответствием латинского Augustus. «Император» точно и понятно передаёт референт в основном тексте, а историческая форма титула отмечена в сноске.
- source_word: ἀναπέμψω
  choice: отправлю
  rationale: В контексте означает отправку Павла к вышестоящей императорской власти. «Отправлю» естественно передаёт действие без неуместного буквального пространственного оттенка «вверх».
- source_word: πρὸς Καίσαρα
  choice: к кесарю
  rationale: Καῖσαρ употреблено как традиционный императорский титул. «К кесарю» сохраняет историческую формулировку и отличие от Σεβαστός в первой части стиха.
