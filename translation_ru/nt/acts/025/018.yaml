lexical_decisions:
- source_word: περὶ οὗ σταθέντες οἱ κατήγοροι
  choice: Обступив его, обвинители
  rationale: В данном контексте περί с винительным при ἵστημι естественно передаёт расположение обвинителей вокруг Павла; причастие аориста обозначает сопутствующее действие. Такой перевод точнее синтаксически, чем понимание περὶ οὗ как отдельного «о нём».
- source_word: οὐδεμίαν αἰτίαν ἔφερον
  choice: не предъявили ни одного обвинения
  rationale: Судебное сочетание означает предъявление обвинения; формулировка сохраняет юридический оттенок и усиленное отрицание οὐδεμίαν.
- source_word: ὧν ἐγὼ ὑπενόουν
  choice: в тех… какие я предполагал
  rationale: Передаёт соотнесённость родительного относительного местоимения с αἰτίαν и ретроспективное ожидание Феста, выраженное имперфектом ὑπενόουν, без неестественного русского продолженного прошедшего.
- source_word: πονηρῶν
  choice: злодеяниях
  rationale: В судебном контексте слово обозначает дурные или преступные деяния, но не обязательно формально определённые составы преступления; примечание сохраняет более широкую возможность.
