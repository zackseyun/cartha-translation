  text: Ἡμερῶν δὲ διαγενομένων τινῶν Ἀγρίππας ὁ βασιλεὺς καὶ Βερνίκη κατήντησαν εἰς Καισάρειαν ἀσπασάμενοι τὸν Φῆστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/013.yaml
  text: After some days had passed[a], King Agrippa and Bernice arrived at Caesarea to greet Festus.
translation:
  language: ru
  text: Через несколько дней царь Агриппа и Вереника прибыли в Кесарию, чтобы приветствовать Феста.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἡμερῶν δὲ διαγενομένων τινῶν
  choice: Через несколько дней
  rationale: Генитив абсолютный задаёт временной фон. Естественная русская формулировка передаёт, что прошло некоторое число дней; слабое связующее δέ отдельно не выражено, чтобы не утяжелять повествование.
- source_word: Ἀγρίππας ὁ βασιλεὺς
  choice: царь Агриппа
  rationale: В русском библейском и историческом употреблении титул βασιλεύς естественно передаётся словом «царь» перед именем.
- source_word: Βερνίκη
  choice: Вереника
  rationale: Устоявшаяся русская библейская передача греческого имени Βερνίκη.
- source_word: κατήντησαν εἰς Καισάρειαν
  choice: прибыли в Кесарию
  rationale: Глагол обозначает прибытие к месту назначения, а εἰς — направление движения; по-русски естественно «прибыли в».
- source_word: ἀσπασάμενοι τὸν Φῆστον
  choice: чтобы приветствовать Феста
  rationale: Причастие передано целевой конструкцией, естественной в данном контексте; «приветствовать» сохраняет общий смысл, не добавляя явно не выраженного оттенка официального почтения.
- source_word: Φῆστον
  choice: Феста
  rationale: Устоявшаяся русская форма имени Фест в винительном падеже.
