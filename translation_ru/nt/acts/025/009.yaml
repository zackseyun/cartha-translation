  source_fidelity: 'Нужна безопасная правка. «Предстать перед моим судом» не вполне передаёт κριθῆναι: греческий текст говорит именно о судебном разбирательстве над Павлом, а не только о его явке. «По этим обвинениям» несколько сужает нейтральное περὶ τούτων («по этим делам/вопросам»), хотя обвинительный контекст несомненен. «Ответил Павлу» точнее сохраняет ἀποκριθείς, чем «спросил».'
