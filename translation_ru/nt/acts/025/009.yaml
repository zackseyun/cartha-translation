  text: ὁ Φῆστος δὲ ⸂θέλων τοῖς Ἰουδαίοις⸃ χάριν καταθέσθαι ἀποκριθεὶς τῷ Παύλῳ εἶπεν· Θέλεις εἰς Ἱεροσόλυμα ἀναβὰς ἐκεῖ περὶ τούτων ⸀κριθῆναι ἐπ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/009.yaml
  text: But Festus[a], wanting to do the Jews a favor, answered Paul and said[c][b], “Do you want to go up to Jerusalem and there be judged before me concerning these things?”
translation:
  language: ru
  text: 'Но Фест, желая оказать иудеям услугу, ответил Павлу: «Хочешь ли ты отправиться в Иерусалим и там быть судимым передо мной по этим делам?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «быть судимым передо мной по этому делу». Под «иудеями» здесь подразумеваются обвинители и руководители, добивавшиеся суда над Павлом, а не все иудеи без различия.'
    reason: Лексическая альтернатива и контекстуальное пояснение
lexical_decisions:
- source_word: θέλων
  choice: желая
  rationale: Причастие настоящего времени передаёт мотив, которым Фест руководствовался в тот момент, не усиливая оттенок намерения.
- source_word: τοῖς Ἰουδαίοις
  choice: иудеям
  rationale: Сохраняет широкий этнорелигиозный термин оригинала; в данном контексте речь идёт об иудейских обвинителях и руководителях, добивавшихся суда над Павлом.
- source_word: χάριν καταθέσθαι
  choice: оказать … услугу
  rationale: Естественно передаёт идиому со значением сделать одолжение или добиться расположения, не приписывая Фесту более явно корыстный мотив.
- source_word: ἀποκριθεὶς … εἶπεν
  choice: спросил
  rationale: В русском повествовании единый глагол естественно вводит непосредственно следующую вопросительную реплику; буквальное «ответив, сказал» звучало бы тяжеловесно.
- source_word: Θέλεις
  choice: Хочешь ли ты
  rationale: Прямо передаёт вопрос о желании Павла и сохраняет уважительно-официальный, но понятный современный строй речи.
- source_word: εἰς Ἱεροσόλυμα ἀναβὰς
  choice: отправиться в Иерусалим
  rationale: Естественная русская передача движения в Иерусалим; буквальное «подняться» здесь могло бы ошибочно восприниматься лишь как указание на рельеф.
- source_word: περὶ τούτων
  choice: по этим обвинениям
  rationale: Контекст судебного разбирательства ясно определяет предмет указательного выражения; выбор делает фразу естественной по-русски, оставаясь в пределах контекста.
- source_word: κριθῆναι ἐπ’ ἐμοῦ
  choice: предстать перед моим судом
  rationale: Передаёт судебное значение пассивного κρίνω и конструкцию, указывающую на Феста как на председательствующего представителя власти, не утверждая, что он единолично вынесет приговор.
theological_decisions:
- issue: Возможность антииудейского обобщения слова τοῖς Ἰουδαίοις
  choice: Сохранить в основном тексте «иудеям», понимая его контекстуально как указание на обвинителей и руководителей, ведущих дело против Павла.
  alternative: «иудейским руководителям» или «иудейским обвинителям»
  rationale: Оригинал употребляет широкий термин, поэтому перевод не сужает его молча. Смысловое ограничение следует из ближайшего повествовательного контекста и отмечается в сноске.
- issue: Объём судебной роли Феста в выражении ἐπ’ ἐμοῦ
  choice: «перед моим судом»
  alternative: «быть судимым мною»
  rationale: Выбранная формулировка сохраняет возможность понимать Феста как председательствующего представителя римской власти, не разрешая неоднозначность в пользу исключительно личного вынесения им решения.
translation_notes:
  register: Современный литературный русский язык с достоинством судебно-повествовательного контекста. Синтаксис упрощён по сравнению с греческой цепочкой причастий, но логика мотива и вопроса сохранена. Единственный маркер сноски [a] помещён в основном тексте.
