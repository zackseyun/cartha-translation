  terminology: «Иудеи» корректно сохраняет термин Ἰουδαῖοι; контекстуальная сноска уместно уточняет, что имеются в виду участники обвинения, а не все иудеи. «Оказать услугу» хорошо передаёт χάριν καταθέσθαι. «По этим делам» сохраняет широту περὶ τούτων.
