  yaml_path: translation/nt/acts/025/014.yaml
  text: And as they stayed there many days[a], Festus laid before the king the matters concerning Paul, saying[b], “There is a certain man left behind by Felix as a prisoner,”
translation:
  language: ru
  text: 'Когда же они пробыли там несколько дней, Фест представил царю дело, касающееся Павла, сказав: «Есть один человек, которого Феликс оставил в заключении».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλείους ἡμέρας
  choice: немало дней
  rationale: В данном временном обороте сравнительная форма естественно передаёт продолжительное пребывание; «немало дней» звучит современно и не навязывает строгого сравнения.
- source_word: διέτριβον
  choice: они пробыли там
  rationale: Глагол обозначает пребывание или проведение времени в данном месте; прошедшее совершенное «пробыли» естественно в придаточном с ὡς.
- source_word: ἀνέθετο
  choice: изложил царю
  rationale: Средняя форма означает представить вопрос другому лицу для рассмотрения; «изложил царю» сохраняет больше, чем простое «сообщил».
- source_word: τὰ κατὰ τὸν Παῦλον
  choice: дело Павла
  rationale: В контексте судебного разбирательства субстантивированный оборот указывает на относящееся к Павлу дело; единственное число по-русски ясно и естественно.
- source_word: Ἀνήρ τίς ἐστιν
  choice: Есть здесь один человек
  rationale: Оборот вводит конкретного, прежде не названного человека. «Один человек» естественнее буквального «некий муж», а «здесь» эксплицирует подразумеваемое наличие узника у Феста.
- source_word: καταλελειμμένος ὑπὸ Φήλικος
  choice: которого Феликс оставил
  rationale: Перфектное страдательное причастие выражает действие Феликса с сохраняющимся результатом; русское придаточное передаёт это без тяжеловесности.
- source_word: δέσμιος
  choice: под стражей
  rationale: Существительное означает узника; в сочетании с «оставил» идиоматическое «под стражей» точно передаёт продолжающееся положение заключённого.
