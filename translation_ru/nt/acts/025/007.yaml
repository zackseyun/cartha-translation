    text: 'Или: «встали вокруг него».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενομένου δὲ αὐτοῦ
  choice: Когда он прибыл
  rationale: Генитив абсолютный обозначает временное обстоятельство. Такой перевод естественно передаёт последовательность событий, сохраняя местоимение оригинала.
- source_word: περιέστησαν αὐτόν
  choice: обступили его
  rationale: Глагол обозначает, что обвинители встали вокруг Павла. «Обступили» естественно передаёт физическое расположение и возможный оттенок давления, не превращая его в явно насильственное действие.
- source_word: οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι
  choice: иудеи, пришедшие из Иерусалима
  rationale: В данном контексте Ἰουδαῖοι обозначает иудейских обвинителей из Иерусалима; географическое происхождение уже выражено отдельно. Нейтральное «пришедшие» звучит по-русски естественнее буквального «сошедшие».
- source_word: πολλὰ καὶ βαρέα αἰτιώματα
  choice: много тяжких обвинений
  rationale: αἰτιώματα — официальные обвинения, а βαρέα подчёркивает их серьёзность или тяжесть. Формулировка сохраняет оба смысловых компонента.
- source_word: καταφέροντες
  choice: предъявляя
  rationale: В судебном контексте причастие означает выдвижение или предъявление обвинений. «Предъявляя» точно и естественно сочетается с существительным «обвинения».
- source_word: ἃ οὐκ ἴσχυον ἀποδεῖξαι
  choice: которых не могли доказать
  rationale: Оборот с ἰσχύω выражает способность, а ἀποδείκνυμι — доказательство. Имперфект указывает на их неспособность доказать обвинения в ходе разбирательства; русское «не могли» передаёт это без излишнего уточнения.
