    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτούμενοι χάριν κατ’ αὐτοῦ
  choice: просили его сделать им одолжение во вред Павлу
  rationale: Оборот αἰτεῖν χάριν передан естественным русским выражением «просить сделать одолжение»; κατ’ αὐτοῦ в данном контексте имеет враждебную направленность, которую выражает «во вред Павлу». Имя Павла, ясное из контекста, устраняет неестественное нагромождение местоимений.
- source_word: ὅπως μεταπέμψηται αὐτὸν εἰς Ἰερουσαλήμ
  choice: распорядиться, чтобы Павла доставили в Иерусалим
  rationale: ὅπως вводит содержание просьбы, а средний залог μεταπέμψηται указывает на то, что Фест должен организовать перемещение Павла, а не доставлять его лично. Формулировка сохраняет также целевую окраску конструкции с сослагательным наклонением.
- source_word: ἐνέδραν ποιοῦντες
  choice: Тем временем они готовили засаду
  rationale: Причастный оборот обозначает сопутствующее скрытое действие. «Готовили засаду» естественно в современном русском и не утверждает, что нападение уже началось.
- source_word: ἀνελεῖν αὐτὸν
  choice: чтобы убить его
  rationale: В данном контексте ἀναιρέω прямо означает лишение жизни; «убить» точно и не добавляет правовой квалификации вроде «убийства» или «казни».
- source_word: κατὰ τὴν ὁδόν
  choice: по дороге
  rationale: Обычное русское обозначение действия во время пути; соответствует замыслу нападения при перевозке Павла.
