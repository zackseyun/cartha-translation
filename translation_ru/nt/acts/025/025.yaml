  text: ἐγὼ δὲ ⸀κατελαβόμην μηδὲν ἄξιον ⸂αὐτὸν θανάτου⸃ πεπραχέναι, ⸀αὐτοῦ δὲ τούτου ἐπικαλεσαμένου τὸν Σεβαστὸν ἔκρινα ⸀πέμπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/025.yaml
  text: But I found that he had done nothing deserving death; and because he himself appealed to the Emperor[a], I decided to send him.
translation:
  language: ru
  text: Я же установил, что он не совершил ничего, заслуживающего смерти; но поскольку он сам обратился с апелляцией к императору[a], я решил отправить его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к Августу». Греческий титул Σεβαστός здесь обозначает римского императора.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελαβόμην
  choice: я установил
  rationale: В судебном контексте глагол обозначает вывод, к которому Фест пришёл после рассмотрения дела; «установил» естественно передаёт результат оценки, не превращая его в формальный приговор.
- source_word: μηδὲν ἄξιον ... θανάτου
  choice: ничего, заслуживающего смерти
  rationale: Формулировка близко передаёт отсутствие поступка, за который полагалась бы смерть, и не вводит более узкий термин «смертная казнь».
- source_word: αὐτὸν θανάτου πεπραχέναι
  choice: он не сделал ничего, заслуживающего смерти
  rationale: Греческая конструкция с винительным падежом и инфинитивом естественно передана русским придаточным изъяснительным.
- source_word: πεπραχέναι
  choice: не сделал
  rationale: Широкий по значению глагол πράσσω здесь относится к совершённым действиям; «сделал» сохраняет эту широту и судебный оттенок получает из контекста.
- source_word: αὐτοῦ δὲ τούτου ἐπικαλεσαμένου
  choice: А поскольку он сам потребовал суда
  rationale: Генитив абсолютный передаёт обстоятельство, послужившее основанием решения Феста; «он сам» сохраняет эмфазу αὐτοῦ ... τούτου.
- source_word: ἐπικαλεσαμένου
  choice: потребовал суда
  rationale: В римском правовом контексте речь идёт об обращении к высшей императорской юрисдикции. Такая формулировка яснее по-русски, чем буквальное «воззвал к».
- source_word: τὸν Σεβαστόν
  choice: императора
  rationale: Σεβαστός — греческий эквивалент титула Augustus и здесь обозначает действующего римского императора, а не исторического Октавиана Августа.
- source_word: ἔκρινα
  choice: я решил
  rationale: Глагол выражает официальное процедурное решение Феста; «решил» естественно звучит в современном русском языке.
- source_word: πέμπειν
  choice: отправить его
  rationale: Местоимение «его» восстанавливает подразумеваемый из контекста объект инфинитива и необходимо для ясного русского синтаксиса.
