lexical_decisions:
- source_word: ἐνεφάνισάν
  choice: изложили ему свои обвинения
  rationale: В данном судебном контексте глагол означает доведение дела до сведения правителя и несёт оттенок обвинения, но сам по себе не обязательно обозначает формальное предъявление обвинительного заключения.
- source_word: τε
  choice: И
  rationale: Соединительная частица связывает стих с предшествующим повествованием; естественно передаётся русским союзом «и».
- source_word: οἱ ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся русское обозначение группы представителей высшего иерусалимского священства во множественном числе.
- source_word: οἱ πρῶτοι τῶν Ἰουδαίων
  choice: знатнейшие из иудеев
  rationale: Передаёт значение влиятельных, видных представителей народа и сохраняет конструкцию со значением части от целого.
- source_word: κατὰ τοῦ Παύλου
  choice: против Павла
  rationale: Предлог κατά с родительным падежом здесь выражает направленность обвинения против Павла.
- source_word: παρεκάλουν
  choice: настойчиво просили
  rationale: Имперфект указывает на продолжавшуюся или повторявшуюся просьбу; сочетание передаёт настойчивость, не усиливая её до мольбы.
