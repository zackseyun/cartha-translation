  source_fidelity: 'Смысл в целом передан верно: речь идёт о том, что иерусалимские первосвященники и влиятельные иудеи довели до Феста дело, направленное против Павла, и продолжали обращаться к нему с просьбой. Однако «свои обвинения» несколько конкретизирует греческий глагол: ἐνεφάνισαν в этом контексте означает представить/довести дело до сведения власти и не обязательно само по себе называет обвинения как уже сформулированный предмет.'
