  text: ⸂τοῦ Παύλου ἀπολογουμένου⸃ ὅτι Οὔτε εἰς τὸν νόμον τῶν Ἰουδαίων οὔτε εἰς τὸ ἱερὸν οὔτε εἰς Καίσαρά τι ἥμαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/008.yaml
  text: 'Paul made his defense: “I have sinned in nothing against either the law of the Jews[a], or the temple, or Caesar.”'
translation:
  language: ru
  text: 'Павел защищался: «Я ничем не согрешил[a] ни против закона иудеев, ни против храма, ни против кесаря».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не совершил никакого правонарушения».'
    reason: 'Лексическая альтернатива: в судебном контексте ἥμαρτον может означать совершение проступка или правонарушения.'
lexical_decisions:
- source_word: τοῦ Παύλου ἀπολογουμένου
  choice: Павел же защищался
  rationale: Оборот обозначает судебную защиту Павла. Самостоятельная русская конструкция естественно передаёт греческий генитив абсолютный и связь с предшествующими обвинениями.
- source_word: ὅτι
  choice: двоеточие и прямая речь
  rationale: Союз вводит содержание защиты; в современном русском прямая речь после двоеточия передаёт это естественнее, чем буквальное «что».
- source_word: νόμον τῶν Ἰουδαίων
  choice: закона иудеев
  rationale: Сохраняет генитивную конструкцию и не сужает значение до исключительно этнического или религиозного оттенка.
- source_word: ἱερόν
  choice: храма
  rationale: В данном контексте слово обозначает Иерусалимский храм или храмовый комплекс, а не только внутреннее святилище.
- source_word: Καίσαρα
  choice: кесаря
  rationale: Сохранён употреблённый в греческом титул римского правителя, а не заменён более истолковывающим словом «император».
- source_word: τι ἥμαρτον
  choice: ни в чём не согрешил
  rationale: Передаёт всеохватность отрицания и сохраняет связь ἁμαρτάνω с понятием греха, не теряя уместного здесь смысла правонарушения.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: ни ... ни ... ни
  rationale: Трёхчастное отрицание естественно и точно воспроизводится повторяющимся русским союзом «ни».
theological_decisions:
- issue: Юридический или нравственный оттенок ἥμαρτον
  choice: не согрешил
  alternative: не совершил никакого правонарушения
  rationale: Контекст судебный, однако греческий глагол сохраняет более широкую нравственную семантику. Основной текст не сводит заявление Павла к узкотехническому юридическому термину, а сноска отмечает контекстуально допустимую альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством судебной речи. Частица «же» поддерживает связь с предшествующим рассказом об обвинениях. «Кесарь» сохранён как традиционный новозаветный титул; синтаксис краток и понятен широкому читателю.
