  text: περὶ οὗ ἀσφαλές τι γράψαι τῷ κυρίῳ οὐκ ἔχω· διὸ προήγαγον αὐτὸν ἐφ’ ὑμῶν καὶ μάλιστα ἐπὶ σοῦ, βασιλεῦ Ἀγρίππα, ὅπως τῆς ἀνακρίσεως γενομένης σχῶ τί ⸀γράψω·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/026.yaml
  text: Concerning him I have nothing definite to write to my lord[a]. Therefore I have brought him before you all, and especially before you, King Agrippa, so that, after the examination has taken place[b], I may have something to write.
translation:
  language: ru
  text: Об этом человеке мне нечего определённого написать моему господину[a]. Поэтому я представил его перед всеми вами, и особенно перед тобой, царь Агриппа, чтобы после того, как состоится разбирательство[b], мне было что написать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более явно: «императору». В греческом тексте сказано «моему господину»; в данном официальном контексте это титул римского императора.'
    reason: alternative_reading
  - marker: b
    text: Слово «разбирательство» можно также перевести как «слушание» или «расследование»; речь идёт о судебном рассмотрении дела Павла.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλές τι
  choice: нечего определённого
  rationale: Прилагательное ἀσφαλής обозначает нечто надёжное, достоверное или определённое. В официально-правовом контексте Фест говорит, что у него нет ясных и твёрдых сведений для письменного доклада.
- source_word: γράψαι
  choice: написать
  rationale: Аористный инфинитив прямо обозначает составление письменного сообщения.
- source_word: τῷ κυρίῳ
  choice: моему господину
  rationale: κύριος здесь является обращением или титулом римского императора, а не богословским наименованием. Перевод сохраняет буквальное значение слова, а сноска поясняет референта.
- source_word: διὸ
  choice: поэтому
  rationale: Союз вводит логическое следствие из предыдущего утверждения.
- source_word: προήγαγον
  choice: я привёл его сюда
  rationale: Глагол означает вывести или представить человека перед собравшимися. «Сюда» естественно передаёт направленность действия в данной сцене.
- source_word: ἐφ’ ὑμῶν
  choice: к вам всем
  rationale: Множественное ὑμῶν обозначает всех присутствующих и сохраняет противопоставление последующему единственному числу в обращении к Агриппе.
- source_word: καὶ μάλιστα ἐπὶ σοῦ
  choice: и особенно к тебе
  rationale: μάλιστα выделяет Агриппу среди более широкой аудитории.
- source_word: βασιλεῦ Ἀγρίππα
  choice: царь Агриппа
  rationale: Титул и имя переданы прямо; форма русского обращения совпадает с именительным падежом.
- source_word: ὅπως
  choice: чтобы
  rationale: Союз выражает цель предпринятого действия.
- source_word: τῆς ἀνακρίσεως γενομένης
  choice: после разбирательства
  rationale: ἀνάκρισις обозначает рассмотрение, допрос или судебное исследование дела. Временное значение генитивной абсолютной конструкции естественно передано предлогом «после».
- source_word: σχῶ τί γράψω
  choice: мне было что написать
  rationale: Русская идиома точно и естественно передаёт сочетание «иметь» с косвенным вопросом о содержании будущего письма.
theological_decisions:
- issue: Передача κύριος в небогословском имперском контексте
  choice: моему господину
  alternative: императору
  rationale: В данном стихе κύριος относится к римскому императору, а не к Богу или Мессии. Основной текст сохраняет лексическое значение титула, тогда как сноска ясно называет подразумеваемого адресата.
translation_notes:
  register: Современный литературный русский язык с умеренно официальным оттенком, соответствующим речи римского наместника. Синтаксис упрощён до естественной русской формы без утраты логической связи, различия между множественным «вам всем» и единственным «тебе», а также юридического характера сцены.
