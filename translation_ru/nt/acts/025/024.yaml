  terminology: Имена «Фест» и «Агриппа» переданы нормативно. «Иудеи» сохраняет этническо-политическое обозначение оригинала; примечание верно предупреждает, что собирательная формула Феста не является утверждением о каждом иудее. Формула «не должен больше жить» адекватно передаёт δεῖν ... ζῆν μηκέτι, не подменяя её прямой формулой казни.
