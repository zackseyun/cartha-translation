source:
  edition: SBLGNT
  text: καί φησιν ὁ Φῆστος· Ἀγρίππα βασιλεῦ καὶ πάντες οἱ συμπαρόντες ἡμῖν ἄνδρες, θεωρεῖτε τοῦτον περὶ οὗ ⸀ἅπαν τὸ πλῆθος τῶν Ἰουδαίων ⸀ἐνέτυχόν μοι ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε, ⸀βοῶντες μὴ δεῖν ⸂αὐτὸν ζῆν⸃ μηκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/024.yaml
  text: And Festus says[a], “King Agrippa, and all the men present with us, you see this man, about whom the whole body of the Jews petitioned me, both in Jerusalem and here[b], shouting that he ought no longer to live.”
translation:
  language: ru
  text: 'И Фест говорит: «Царь Агриппа и все присутствующие с нами мужчины, вы видите этого человека, о котором всё множество иудеев[a] обращалось ко мне с прошением и в Иерусалиме, и здесь, крича, что он не должен больше жить[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «всё множество иудеев» передаёт собирательную и обобщающую формулировку Феста; оно не обязательно означает каждого иудея без исключения.
    reason: collective_rhetoric
  - marker: b
    text: 'Или: «ему не следует больше жить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: говорит
  rationale: Историческое настоящее сохраняет живость повествования Луки и допустимо в современном русском рассказе.
- source_word: συμπαρόντες ἡμῖν ἄνδρες
  choice: все мужчины, присутствующие здесь с нами
  rationale: Передаёт совместное присутствие и сохраняет явно мужское обращение ἄνδρες; «здесь» естественно уточняет ситуацию собрания.
- source_word: θεωρεῖτε τοῦτον
  choice: вы видите этого человека
  rationale: Естественно передаёт указание Феста на стоящего перед собранием Павла без архаичного «се».
- source_word: περὶ οὗ
  choice: из-за него
  rationale: В данном контексте речь идёт не просто о теме разговора, а о человеке, ставшем предметом прошения; русский оборот естественно связывает последующее действие с Павлом.
- source_word: ἅπαν τὸ πλῆθος τῶν Ἰουδαίων
  choice: всё множество иудеев
  rationale: Сохраняет усиление ἅπαν и собирательное значение πλῆθος, не подменяя названную в греческом тексте группу более узким обозначением руководителей.
- source_word: ἐνέτυχόν μοι
  choice: обращалось ко мне с прошением
  rationale: Передаёт официальное обращение с просьбой в судебно-административной обстановке и согласуется в числе с собирательным существительным «множество».
- source_word: ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε
  choice: и в Иерусалиме, и здесь
  rationale: Русская парная конструкция точно передаёт греческое τε…καί и противопоставляет оба места обращения.
- source_word: βοῶντες
  choice: крича
  rationale: Сохраняет значение громкого, настойчивого возглашения, не ослабляя его до нейтрального «говоря».
- source_word: μὴ δεῖν αὐτὸν ζῆν μηκέτι
  choice: что он не должен больше жить
  rationale: Сохраняет модальную силу δεῖν и отрицание продолжения жизни, не превращая высказывание в техническую формулу смертного приговора.
theological_decisions:
- issue: Упоминание иудеев в контексте враждебного судебного требования
  choice: Сохранить «иудеев» и собирательное выражение «всё множество»
  alternative: иудейские вожди; все иудеи
  rationale: Греческий текст прямо называет τῶν Ἰουδαίων, поэтому группу нельзя без текстового основания сужать до руководителей. Вместе с тем πλῆθος — собирательное обозначение, а речь Феста носит обобщающий характер и не обязательно утверждает участие каждого иудея без исключения.
- issue: Характер требования смерти Павла
  choice: он не должен больше жить
  alternative: ему не следует больше жить; он должен умереть
  rationale: Выбранная формулировка сохраняет напряжение модальной конструкции δεῖν и прямое отрицание дальнейшей жизни, не усиливая её до отсутствующего в тексте глагола «умереть».
translation_notes:
  register: Современный литературный русский язык с достоинством официальной речи. Историческое настоящее «говорит» сохраняет повествовательную живость оригинала; обращение и юридическая лексика остаются понятными без канцелярской тяжеловесности.
