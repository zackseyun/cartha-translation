  text: περὶ οὗ γενομένου μου εἰς Ἱεροσόλυμα ἐνεφάνισαν οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τῶν Ἰουδαίων, αἰτούμενοι κατ’ αὐτοῦ ⸀καταδίκην·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/015.yaml
  text: Concerning him[a], when I arrived in Jerusalem, the chief priests and the elders of the Jews informed me, asking for a sentence of condemnation against him.
translation:
  language: ru
  text: Когда я прибыл в Иерусалим, первосвященники и старейшины иудеев обратились ко мне по его делу и просили вынести ему обвинительный приговор[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «просили осудить его»; возможно также: «просили признать его виновным».'
    reason: Лексема καταδίκη обозначает судебное осуждение и допускает передачу как самого осуждения, так и обвинительного решения суда.
lexical_decisions:
- source_word: περὶ οὗ
  choice: по его делу
  rationale: Оборот указывает на Павла как на предмет обращения к Фесту. «По его делу» естественно звучит в русском административно-судебном контексте и ясно передаёт связь с рассматриваемым лицом.
- source_word: γενομένου μου εἰς Ἱεροσόλυμα
  choice: когда я прибыл в Иерусалим
  rationale: Родительный самостоятельный оборот с γίνομαι и εἰς обозначает прибытие; временное придаточное естественно передаёт его функцию по-русски.
- source_word: ἐνεφάνισαν
  choice: обратились ко мне
  rationale: В данном юридико-административном контексте глагол означает официальное обращение к представителю власти с изложением дела. Такой перевод избегает неестественного непереходного «сообщили мне о нём» и не добавляет прямо не названных обвинений.
- source_word: οἱ ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся русское обозначение ведущих представителей храмового священства во множественном числе.
- source_word: οἱ πρεσβύτεροι τῶν Ἰουδαίων
  choice: старейшины иудеев
  rationale: Сохраняет значение родительного определения и традиционный исторический термин без лишнего уточнения.
- source_word: αἰτούμενοι
  choice: просили
  rationale: Передаёт сопутствующую просьбу или ходатайство без усиления до требования.
- source_word: κατ’ αὐτοῦ καταδίκην
  choice: вынести ему обвинительный приговор
  rationale: Передаёт направленное против Павла ходатайство о судебном осуждении. «Обвинительный приговор» ясно выражает юридический характер καταδίκη на современном русском языке.
