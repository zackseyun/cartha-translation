    issue: «встав рядом» для ἐπιστάς
    rationale: Форма «встав» в русском обычно предполагает подъём из сидячего или лежачего положения. Греческое причастие здесь описывает занятие позиции рядом с Павлом; «стал рядом со мной» передаёт это без добавочного смысла.
  - severity: low
    issue: «увидел его» для εἰς αὐτόν
    rationale: «Увидел» сообщает лишь факт восприятия, тогда как предлог εἰς выражает направление взгляда. «Посмотрел на него» точнее сохраняет этот компонент.
