  yaml_path: translation/nt/acts/022/013.yaml
  text: He came to me[a], and standing by me said to me, ‘Brother Saul, receive your sight.’ And in that very hour I received my sight and looked at him.
translation:
  language: ru
  text: 'Он подошёл ко мне и, став рядом со мной, сказал мне: «Брат Савл, прозри!» И в тот же час я прозрел и посмотрел на него.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν πρὸς ἐμέ
  choice: Он подошёл ко мне
  rationale: Передаёт направленное движение к Павлу естественным русским глаголом; аористное причастие уместно преобразовано в личную форму для плавности повествования.
- source_word: ἐπιστάς
  choice: встав рядом
  rationale: Сохраняет значение занятия положения возле Павла и естественно связывается с последующей речью.
- source_word: Σαοὺλ ἀδελφέ
  choice: Брат Савл
  rationale: Сохраняет обращение ἀδελφέ как выражение братской принадлежности; имя передано в принятой русской библейской форме «Савл».
- source_word: ἀνάβλεψον
  choice: прозри
  rationale: В контексте предшествующей слепоты глагол означает восстановление зрения. «Прозри» кратко, ясно и стилистически достойно передаёт повеление.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: в тот же час
  rationale: Передаёт подчёркнутое совпадение времени, не заменяя исходный образ более общим наречием «сразу».
- source_word: ἀνέβλεψα εἰς αὐτόν
  choice: я прозрел и увидел его
  rationale: Повтор «прозрел» связывает исполнение с повелением, а «увидел его» естественно выражает направленность зрения на Ананию.
- source_word: εἶπέν μοι
  choice: сказал мне
  rationale: Явно передаёт дательный μοι, обозначающий адресата речи.
