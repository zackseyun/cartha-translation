base_translation:
  language: en
  yaml_path: translation/nt/acts/022/008.yaml
  text: And I answered[a], ‘Who are you, Lord?’ And he said to me, ‘I am Jesus the Nazarene[b], whom you are persecuting.’
translation:
  language: ru
  text: 'Я ответил: «Кто ты, Господи[a]?» И он сказал мне: «Я Иисус Назарянин[b], которого ты преследуешь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «господин». Греческое κύριε может быть как титулом «Господь», так и почтительным обращением.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Иисус Назорей»; также возможно: «Иисус из Назарета».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθην
  choice: Я ответил
  rationale: Аорист депонентного ἀποκρίνομαι естественно передаётся совершенным видом «ответил»; местоимение сохраняет явное ἐγώ.
- source_word: Τίς εἶ
  choice: Кто Ты
  rationale: Прямая и естественная передача вопросительного местоимения с глаголом-связкой; связка в русском настоящем времени опускается.
- source_word: κύριε
  choice: Господи
  rationale: Звательная форма естественно передаёт обращение κύριε и сохраняет возможность понимания как титула, не устраняя контекстуальную неоднозначность.
- source_word: εἶπέν τε πρὸς ἐμέ
  choice: Он сказал мне
  rationale: Идиоматическая русская передача λέγω с πρὸς ἐμέ; связь τε передана последовательностью предложений без тяжеловесного дополнительного союза.
- source_word: Ἐγώ εἰμι
  choice: Я
  rationale: В русском именная конструкция самоидентификации естественно выражается «Я Иисус…» без глагола-связки в настоящем времени; явное ἐγώ сохранено.
- source_word: Ἰησοῦς
  choice: Иисус
  rationale: Использована устоявшаяся русская форма личного имени.
- source_word: ὁ Ναζωραῖος
  choice: Назарянин
  rationale: Понятное современному читателю обозначение Иисуса по связи с Назаретом; формально более близкое «Назорей» сохранено в примечании.
- source_word: ὃν σὺ διώκεις
  choice: Которого ты преследуешь
  rationale: «Преследуешь» передаёт враждебное гонение, выраженное διώκω; настоящее время сохраняет продолжающийся характер действия, а явное σὺ отражено местоимением «ты».
theological_decisions:
- issue: Значение κύριε в обращении Савла
  choice: Господи
  alternative: господин
  rationale: Основной текст сохраняет традиционное титульное прочтение «Господи», но примечание указывает, что до узнавания говорящего слово могло быть почтительным обращением «господин»; тем самым христологическое напряжение не снимается искусственно.
- issue: Передача ὁ Ναζωραῖος
  choice: Назарянин
  alternative: Назорей; Иисус из Назарета
  rationale: Выбор делает географическую связь понятной без введения конфессионального толкования; возможная титульная форма исходного слова сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с достойной, но не архаичной интонацией. Заглавные буквы в местоимениях «Ты» и «Которого» отражают традиционное русское почтительное оформление прямого обращения к Иисусу, не добавляя отсутствующих в источнике смысловых пояснений.
