  text: οἱ δὲ σὺν ἐμοὶ ὄντες τὸ μὲν φῶς ⸀ἐθεάσαντο τὴν δὲ φωνὴν οὐκ ἤκουσαν τοῦ λαλοῦντός μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/009.yaml
  text: Those who were with me saw the light[a], but they did not hear the voice of the one speaking to me.
translation:
  language: ru
  text: Те, кто был со мной, увидели свет, но не услышали голоса того, кто говорил со мной.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не поняли голоса». Сравните Деян 9:7, где сказано, что спутники Павла слышали голос или звук. Возможно, они слышали звук, но не понимали его речи.'
    reason: Сохраняет допустимую смысловую возможность ἀκούω и поясняет кажущееся расхождение с параллельным рассказом, не внося согласование в основной текст.
lexical_decisions:
- source_word: οἱ δὲ σὺν ἐμοὶ ὄντες
  choice: Те, кто был со мной
  rationale: Естественно передаёт субстантивированную причастную конструкцию, не добавляя отсутствующего в греческом слова «мужчины»; δέ выражено последующим противопоставлением «но».
- source_word: τὸ μὲν φῶς
  choice: свет
  rationale: Прямое соответствие φῶς; конструкция μέν...δέ передана противопоставлением «увидели свет, но…» без добавления не выраженного здесь определения «яркий».
- source_word: ἐθεάσαντο
  choice: увидели
  rationale: Передаёт фактическое зрительное восприятие естественным современным русским глаголом, не приписывая намеренного всматривания.
- source_word: τὴν δὲ φωνὴν
  choice: голоса
  rationale: Хотя φωνή может означать и «звук», зависимое определение «Того, кто говорил со мной» указывает здесь на голос личного говорящего.
- source_word: οὐκ ἤκουσαν
  choice: не услышали
  rationale: Сохраняет основное значение ἀκούω и не снимает в основном тексте напряжение с Деян 9:7; возможное значение «не поняли» отмечено в сноске.
- source_word: τοῦ λαλοῦντός μοι
  choice: Того, кто говорил со мной
  rationale: Естественная русская передача причастия настоящего времени, обозначающего действие говорящего; прописная буква уместна как уважительное указание на божественного Говорящего, не называя Его вопреки форме оригинала.
theological_decisions:
- issue: Кажущееся расхождение с Деян 9:7 о том, слышали ли спутники Павла голос
  choice: 'В основном тексте: «не услышали голоса Того, кто говорил со мной»'
  alternative: «не поняли голоса» или услышали звук, но не поняли говорящего
  rationale: Наиболее прямое прочтение ἀκούω и φωνή сохранено в тексте. Семантическая возможность слышать звук, не понимая речи, указана в сноске, чтобы не устранять толкованием реальное повествовательное напряжение.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Порядок слов естественен для русской речи; контраст μέν...δέ передан союзом «но». Маркер сноски поставлен после всего утверждения, к которому относится пояснение.
