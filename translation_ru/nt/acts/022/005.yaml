  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὡς καὶ ὁ ἀρχιερεὺς μαρτυρεῖ μοι καὶ πᾶν τὸ πρεσβυτέριον· παρ’ ὧν καὶ ἐπιστολὰς δεξάμενος πρὸς τοὺς ἀδελφοὺς εἰς Δαμασκὸν ἐπορευόμην ἄξων καὶ τοὺς ἐκεῖσε ὄντας δεδεμένους εἰς Ἰερουσαλὴμ ἵνα τιμωρηθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/005.yaml
  text: as also the high priest and the whole council of elders can testify for me. From them I also received letters to the brothers in Damascus[a], and I was traveling there to bring also those who were there, bound, to Jerusalem so that they might be punished.
translation:
  language: ru
  text: Это могут подтвердить и первосвященник, и весь совет старейшин. От них я получил также письма к братьям в Дамаске[a] и направлялся туда, чтобы привести в Иерусалим также тех, кто находился там, связанными, дабы они были наказаны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к братьям и сёстрам». В греческом тексте буквально «к братьям», но в некоторых контекстах это слово может обозначать более широкий круг людей.'
    reason: 'Лексическая альтернатива: мужское множественное ἀδελφοί иногда употребляется применительно ко всей общине.'
lexical_decisions:
- source_word: ὡς καὶ
  choice: Это могут подтвердить и
  rationale: Оборот вводит подтверждение предыдущих слов Павла; самостоятельная русская фраза естественно передаёт сравнительно-подтвердительную силу выражения.
- source_word: ὁ ἀρχιερεὺς
  choice: первосвященник
  rationale: Устоявшееся русское обозначение высшего священнического лица в данном историческом контексте.
- source_word: μαρτυρεῖ μοι
  choice: могут подтвердить
  rationale: В контексте речь о доступном свидетельстве в подтверждение заявления Павла; множественное число согласовано с двумя однородными субъектами в русском предложении.
- source_word: πᾶν τὸ πρεσβυτέριον
  choice: весь совет старейшин
  rationale: Передаёт коллегиальный орган, а не просто совокупность пожилых людей, и избегает неясного церковного термина «пресвитерий».
- source_word: παρ’ ὧν
  choice: От них
  rationale: Естественно отсылает одновременно к первосвященнику и совету старейшин.
- source_word: ἐπιστολὰς
  choice: письма
  rationale: Сохраняет основное значение слова; официальный характер писем понятен из контекста и не добавляется в текст.
- source_word: πρὸς τοὺς ἀδελφοὺς
  choice: к братьям
  rationale: Сохраняет мужскую форму греческого текста и групповое обращение, не конкретизируя без необходимости, что речь именно о единоплеменниках или членах синагоги.
- source_word: εἰς Δαμασκὸν ἐπορευόμην
  choice: направлялся туда
  rationale: Передаёт незавершённое движение в прошлом, выраженное имперфектом; «туда» естественно отсылает к Дамаску.
- source_word: ἄξων
  choice: чтобы привести
  rationale: Будущее причастие при глаголе движения выражает цель поездки.
- source_word: καὶ τοὺς ἐκεῖσε ὄντας
  choice: и находившихся там
  rationale: Сохраняет добавочное καί и обозначает людей, находившихся в Дамаске.
- source_word: δεδεμένους
  choice: в оковах
  rationale: Передаёт состояние задержанных и сохраняет образ физического связывания, не уточняя конкретный вид оков.
- source_word: ἵνα τιμωρηθῶσιν
  choice: дабы они были наказаны
  rationale: Передаёт целевое значение ἵνα и пассивную форму, не уточняя не названную в тексте меру наказания.
theological_decisions:
- issue: Объём значения ἀδελφοί в данном контексте
  choice: к братьям
  alternative: к братьям и сёстрам; к единоплеменникам
  rationale: Основной текст сохраняет грамматически мужское обозначение группы. Возможность более широкого референта отмечена в сноске, а вероятная принадлежность адресатов к иудейской общине не превращена в явное толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной защитительной речи. Синтаксис сделан естественным для устного свидетельства; «дабы» сохраняет умеренно торжественный регистр, не становясь архаичным. Неуточнённые детали правового статуса писем и вида наказания не добавлены.
