  text: καὶ νῦν τί μέλλεις; ἀναστὰς βάπτισαι καὶ ἀπόλουσαι τὰς ἁμαρτίας σου ἐπικαλεσάμενος τὸ ὄνομα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/016.yaml
  text: And now why are you waiting? Rise[a], be baptized, and wash away your sins[b], calling on his name.
translation:
  language: ru
  text: И теперь чего ты медлишь? Встань, крестись и омой свои грехи, призывая его имя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «призвав его имя»; греческая причастная конструкция не уточняет окончательно, выражает ли призывание средство, сопутствующее или предшествующее действие.'
    reason: alternative_reading
lexical_decisions:
- source_word: τί μέλλεις
  choice: чего ты медлишь?
  rationale: Вопросительное выражение с μέλλω здесь естественно передаёт побуждение не откладывать действие. Русское «чего ты медлишь?» сохраняет краткость, настойчивость и оттенок упрёка.
- source_word: ἀναστὰς
  choice: встань
  rationale: Аористное причастие сопутствующего действия по-русски естественно передать отдельным повелением перед последующими императивами.
- source_word: βάπτισαι
  choice: крестись
  rationale: Аористный медиальный императив требует от адресата принять крещение; «крестись» — прямое, естественное и традиционно понятное русское соответствие без уточнения совершающего обряд.
- source_word: ἀπόλουσαι
  choice: омой
  rationale: Медиальная форма обозначает омытие, устранение нечистоты. В сочетании с «грехи» глагол «омой» сохраняет образ исходного текста и его грамматическую обращённость к адресату.
- source_word: τὰς ἁμαρτίας σου
  choice: свои грехи
  rationale: Возвратное «свои» естественно по-русски соотносит грехи с подлежащим повелительных форм и точно передаёт σου.
- source_word: ἐπικαλεσάμενος
  choice: призвав
  rationale: Деепричастие близко воспроизводит аористное причастие, не определяя окончательно, обозначает ли оно средство, сопутствующее действие или предшествующее действие.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: его имя
  rationale: Перевод сохраняет местоимение αὐτοῦ и не заменяет его контекстуально подразумеваемым титулом «Господь».
theological_decisions:
- issue: Связь крещения, омытия грехов и призывания его имени
  choice: Сохранены последовательность двух повелений и причастная конструкция без уточнения точной причинно-средственной связи.
  alternative: Передать «омой свои грехи, призывая его имя» либо «омой свои грехи тем, что призовёшь его имя», тем самым явнее связав призывание с омовением.
  rationale: Греческий текст координирует βάπτισαι и ἀπόλουσαι, после чего ставит ἐπικαλεσάμενος. Синтаксис допускает более одного понимания связи; перевод не должен решать спорный вопрос о том, какой именно элемент представлен средством омытия грехов.
translation_notes:
  register: Современный литературный русский язык с кратким, настойчивым ритмом прямой речи. «Крестись» и «омой» сохраняют библейскую выразительность, оставаясь понятными обычному читателю. Маркер сноски поставлен после всей конструкции, к которой относится синтаксическая неоднозначность.
