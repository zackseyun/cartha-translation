  text: ὃς ταύτην τὴν ὁδὸν ἐδίωξα ἄχρι θανάτου, δεσμεύων καὶ παραδιδοὺς εἰς φυλακὰς ἄνδρας τε καὶ γυναῖκας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/004.yaml
  text: I persecuted this Way to the death[a], binding and delivering both men and women into prisons[b],
translation:
  language: ru
  text: Я преследовал этот Путь вплоть до смерти[a], связывая и передавая в тюрьмы и мужчин, и женщин.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «до смерти». Это выражение указывает на смертоносный размах преследования.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην τὴν ὁδὸν
  choice: этот Путь
  rationale: В Деяниях ὁδός служит узнаваемым обозначением христианского движения; прописная буква передаёт это употребление, сохраняя буквальный образ пути.
- source_word: ἐδίωξα
  choice: Я преследовал
  rationale: В контексте глагол означает враждебное преследование верующих; русский глагол естественно передаёт как длительное гонение, так и активную погоню.
- source_word: ἄχρι θανάτου
  choice: вплоть до смерти
  rationale: Фраза указывает на смертельный размах гонений, но сама по себе не утверждает однозначно, что Павел лично убивал преследуемых.
- source_word: δεσμεύων
  choice: связывая
  rationale: Сохранён конкретный образ буквального связывания, а не дано более истолковывающее «арестовывая».
- source_word: παραδιδοὺς εἰς φυλακὰς
  choice: бросая в тюрьмы
  rationale: В данном контексте сочетание означает передачу людей под стражу и заключение; эта русская формулировка естественна и сохраняет направленность εἰς.
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: и мужчин, и женщин
  rationale: Парная конструкция подчёркивает, что преследование распространялось на обе группы.
theological_decisions:
- issue: Следует ли передавать ἡ ὁδός как обычное существительное или как условное название христианского движения
  choice: «этот Путь» с прописной буквы
  alternative: «этот путь»; «это движение»
  rationale: В Деяниях «Путь» неоднократно выступает обозначением христианской веры и сообщества. Прописная буква отмечает это значение, не вводя более поздней конфессиональной терминологии.
- issue: Означает ли ἄχρι θανάτου прямое признание в личном убийстве
  choice: 'Сохранить выражение степени и предела: «вплоть до смерти»'
  alternative: «предавал смерти»
  rationale: Греческая фраза описывает крайний, смертоносный характер преследования, но не уточняет здесь непосредственную роль говорящего в причинении смерти.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной защитительной речи. «Путь» сохранён как краткое узнаваемое название движения; синтаксис сделан естественным для русского без устранения смысловой напряжённости фразы ἄχρι θανάτου.
