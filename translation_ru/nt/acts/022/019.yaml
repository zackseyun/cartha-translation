source:
  edition: SBLGNT
  text: κἀγὼ εἶπον· Κύριε, αὐτοὶ ἐπίστανται ὅτι ἐγὼ ἤμην φυλακίζων καὶ δέρων κατὰ τὰς συναγωγὰς τοὺς πιστεύοντας ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/019.yaml
  text: And I said[a], ‘Lord[b], they themselves know that in every synagogue I was imprisoning and beating those who believe in you.’
translation:
  language: ru
  text: 'А я сказал: «Господи, они сами знают, что я по синагогам[a] заключал в тюрьму и избивал тех, кто верит в Тебя[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из синагоги в синагогу». Греческое выражение имеет распределительный смысл и указывает на повторявшиеся действия в разных синагогах.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «полагается на Тебя», «доверяет Тебе».'
    reason: alternative_reading
lexical_decisions:
- source_word: κἀγὼ εἶπον
  choice: А я сказал
  rationale: κἀγώ — стяжение καὶ ἐγώ; сочетание «А я» естественно передаёт связь с предшествующей речью и лёгкое ударение на местоимении. Аорист εἶπον передан обычным русским прошедшим временем.
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма κύριος обращена к Иисусу в видении Павла. «Господи» сохраняет уважительное обращение и христологическую значимость, не уточняя её сверх текста.
- source_word: αὐτοὶ ἐπίστανται
  choice: они сами знают
  rationale: '«Сами» сохраняет эмфатическую силу αὐτοί: Павел указывает, что его прежнее поведение известно этим людям непосредственно.'
- source_word: ἤμην φυλακίζων καὶ δέρων
  choice: заключал в тюрьму и избивал
  rationale: Перифрастическая конструкция с имперфектом выражает продолжавшееся или обычное в прошлом действие. Русские формы несовершенного вида естественно передают эту повторяемость.
- source_word: κατὰ τὰς συναγωγάς
  choice: по синагогам
  rationale: 'κατά с винительным падежом имеет здесь распределительное значение: действия совершались в разных синагогах. Русское «по синагогам» кратко и естественно сохраняет этот смысл.'
- source_word: τοὺς πιστεύοντας ἐπὶ σέ
  choice: тех, кто верит в Тебя
  rationale: Описательная конструкция звучит по-русски естественнее субстантивированного причастия и сохраняет направленность веры на Иисуса; настоящее время передаёт продолжающееся состояние.
theological_decisions:
- issue: Передача κύριος в обращении к Иисусу
  choice: Господи
  alternative: Учитель; Владыка
  rationale: «Господи» является естественным русским соответствием обращения κύριε и сохраняет богословское напряжение повествования, не сводя титул лишь к значению светского почтения.
- issue: Значение πιστεύω ἐπί с винительным падежом
  choice: верит в Тебя
  alternative: полагается на Тебя; доверяет Тебе
  rationale: «Верить в» сохраняет привычную и достаточно широкую формулировку, не ограничивая смысл одним интеллектуальным признанием или только доверием.
- issue: Характер прежнего преследования Павлом верующих
  choice: заключал в тюрьму и избивал
  alternative: бывало, заключал в тюрьму и избивал
  rationale: Несовершенный вид русских глаголов передаёт длительное и повторяющееся действие без добавления отсутствующих в тексте временных уточнений.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прямой речи. Синтаксис упрощён до естественного русского порядка слов, но эмфаза αὐτοί, повторяемость действий и распределительное значение κατὰ τὰς συναγωγάς сохранены. Местоимение «Тебя» написано с прописной буквы как принятое в русском религиозном обращении, без изменения смысла исходного текста.
