  source_fidelity: 'Текст точно передаёт основные элементы греческого оригинала: κἀγώ — «А я», эмфазу αὐτοί — «они сами», перипрастический имперфект с повторяемым характером действий — «заключал в тюрьму и избивал», а также распределительное κατὰ τὰς συναγωγάς — «по синагогам». «Тех, кто верит в Тебя» адекватно передаёт τοὺς πιστεύοντας ἐπὶ σέ, не сужая смысл веры до одного интеллектуального согласия.'
