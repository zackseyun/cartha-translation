  terminology: «Господи» является точной и традиционно естественной передачей Κύριε в данном обращении к Иисусу. «Заключал в тюрьму», «избивал» и «верит в Тебя» терминологически нейтральны и не содержат излишней интерпретации. Прописное «Тебя» соответствует принятому русскому религиозному оформлению и не меняет смысла.
