id: ACT.22.30
reference: Acts 22:30
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον βουλόμενος γνῶναι τὸ ἀσφαλὲς τὸ τί κατηγορεῖται ⸀ὑπὸ τῶν Ἰουδαίων ἔλυσεν ⸀αὐτόν, καὶ ἐκέλευσεν ⸀συνελθεῖν τοὺς ἀρχιερεῖς καὶ ⸀πᾶν τὸ ⸀συνέδριον, καὶ καταγαγὼν τὸν Παῦλον ἔστησεν εἰς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/030.yaml
  text: But on the next day[a], wanting to know for certain what he was being accused of by the Jews, he released him and ordered the chief priests and the whole council to assemble; and bringing Paul down[b], he set him before them.
translation:
  language: ru
  text: На следующий день, желая доподлинно узнать, в чём иудеи обвиняют Павла[a], тысяченачальник освободил его от уз и приказал собраться первосвященникам и всему совету[b]. Затем он вывел Павла вниз и поставил перед ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «обвиняется иудеями». В данном контексте имеются в виду обвинители Павла, а не все иудеи без различия.'
    reason: lexical_alternative
  - marker: b
    text: То есть синедриону — высшему иудейскому совету в Иерусалиме.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: На следующий день
  rationale: Естественно передаёт временной дательный оборот; δέ здесь обозначает лёгкий переход в повествовании и не требует отдельного противительного союза.
- source_word: βουλόμενος γνῶναι τὸ ἀσφαλές
  choice: желая доподлинно узнать
  rationale: Передаёт намерение тысяченачальника и стремление установить достоверные обстоятельства.
- source_word: τὸ τί κατηγορεῖται ὑπὸ τῶν Ἰουδαίων
  choice: в чём иудеи обвиняют Павла
  rationale: Русская активная конструкция естественнее греческой пассивной и ясно выражает содержание обвинения; имя Павла устраняет неясность местоимения без изменения смысла.
- source_word: ἔλυσεν αὐτόν
  choice: освободил его от уз
  rationale: λύω буквально связано с развязыванием и здесь указывает на снятие уз, а не обязательно на полное освобождение из-под стражи.
- source_word: ἐκέλευσεν συνελθεῖν
  choice: приказал собраться
  rationale: Точно передаёт властное распоряжение и инфинитив совместного собрания.
- source_word: τοὺς ἀρχιερεῖς
  choice: первосвященникам
  rationale: Устоявшееся русское обозначение ведущих представителей священнической власти во множественном числе.
- source_word: πᾶν τὸ συνέδριον
  choice: всему совету
  rationale: Передаёт πᾶν и значение συνέδριον как иудейского правящего совета; историческое название пояснено в сноске.
- source_word: καταγαγὼν τὸν Παῦλον
  choice: вывел Павла вниз
  rationale: Сохраняет пространственное направление κατά, вероятно из крепости Антония к месту заседания, не уточняя маршрут сверх текста.
- source_word: ἔστησεν εἰς αὐτούς
  choice: поставил перед ними
  rationale: 'Естественно передаёт каузативное значение: тысяченачальник представил Павла собравшимся.'
theological_decisions:
- issue: Значение Ἰουδαίων в контексте обвинения Павла
  choice: иудеи
  alternative: иудейские вожди; жители Иудеи
  rationale: Основной текст сохраняет прямое лексическое значение, не сужая обозначение до руководителей. Сноска уточняет, что по контексту речь идёт об обвинителях Павла, а не обо всех иудеях без исключения.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис слегка упрощён ради ясности; исторические реалии сохранены и кратко пояснены в сносках.
