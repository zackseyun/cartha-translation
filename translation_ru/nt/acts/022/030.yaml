  source_fidelity: 'Переданы все основные элементы греческого текста: временное указание, цель тысяченачальника установить достоверные обстоятельства обвинения, снятие уз, приказ первосвященникам и всему совету собраться, приведение Павла вниз и его представление перед собранием. «Освободил его от уз» удачно передаёт λύω в данном контексте, не создавая ложного впечатления, что Павла окончательно отпустили из-под стражи.'
  naturalness: 'Текст звучит естественно на современном литературном русском. «Желая доподлинно узнать» и «поставил перед ними» соответствуют официально-повествовательному регистру. Явное «тысяченачальник» допустимо: оно проясняет подразумеваемый греческим глаголом субъект из ближайшего контекста.'
  terminology: «Первосвященники», «иудеи» и «совет» переданы последовательно и без конфессионально окрашенной интерпретации. Сноска к «совету» корректно идентифицирует синедрион, а сноска к «иудеям» надлежащим образом ограничивает контекстуальный референт обвинителями, не подменяя основной текст более узким толкованием.
