  yaml_path: translation/nt/acts/022/028.yaml
  text: But the tribune answered[a], “I acquired this citizenship for a large sum.” But Paul said[b], “But I was even born with it.”
translation:
  language: ru
  text: 'Тысяченачальник ответил: «Я приобрёл это гражданство за большие деньги». Павел же сказал: «А я и родился гражданином».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «А я и рождён»; слово «гражданином» подразумевается из контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: тысяченачальник
  rationale: Исторически точное и привычное для русского библейского текста обозначение римского военного трибуна, командира крупного подразделения.
- source_word: πολλοῦ κεφαλαίου
  choice: за большие деньги
  rationale: Естественно передаёт идиоматическое указание на значительную денежную сумму без излишне буквального воспроизведения конструкции.
- source_word: πολιτείαν
  choice: гражданство
  rationale: В данном контексте речь идёт о юридическом статусе римского гражданина.
- source_word: ἐκτησάμην
  choice: приобрёл
  rationale: Сохраняет общее значение получения во владение; денежный способ приобретения уже выражен оборотом «за большие деньги».
- source_word: καὶ γεγέννημαι
  choice: А я родился гражданином
  rationale: 'Естественно восполняет подразумеваемое из контекста гражданство и передаёт контраст: Павел обладал им от рождения.'
- source_word: δέ
  choice: же / а
  rationale: В первой реплике связка естественно опускается по-русски, а при ответе Павла контраст передан сочетанием «же» в авторской ремарке и «а» в прямой речи.
- source_word: ἔφη
  choice: сказал
  rationale: Нейтральный современный эквивалент обычного глагола речи.
theological_decisions: []
