id: ACT.22.14
reference: Acts 22:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὁ θεὸς τῶν πατέρων ἡμῶν προεχειρίσατό σε γνῶναι τὸ θέλημα αὐτοῦ καὶ ἰδεῖν τὸν δίκαιον καὶ ἀκοῦσαι φωνὴν ἐκ τοῦ στόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/014.yaml
  text: And he said[a], ‘The God of our fathers has appointed you to know his will, to see the Righteous One[b], and to hear a voice from his mouth,’
translation:
  language: ru
  text: 'Он же сказал: «Бог наших отцов предназначил тебя[a] познать Его волю, увидеть Праведника[b] и услышать голос из Его уст».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избрал тебя». Греческий глагол может означать избрание или назначение человека для определённой задачи.'
    reason: lexical_alternative
  - marker: b
    text: '«Праведник» — титул Иисуса; возможный перевод: «Справедливый».'
    reason: alternative_reading
lexical_decisions:
- source_word: προεχειρίσατό
  choice: предназначил
  rationale: Глагол προχειρίζομαι обозначает избрание или назначение человека для определённой задачи. «Предназначил» естественно вводит три последующих инфинитива цели и не приписывает приставке обязательного временного значения.
- source_word: γνῶναι
  choice: познать
  rationale: Аористный инфинитив γινώσκω допускает значение вступления в знание. «Познать» здесь передаёт направленность призвания и звучит естественно в торжественной речи.
- source_word: τὸ θέλημα αὐτοῦ
  choice: Его волю
  rationale: «Воля» сохраняет широкий смысл θέλημα и является ясным современным соответствием, не сужая его до «замысла» или «желания».
- source_word: ἰδεῖν
  choice: увидеть
  rationale: Прямое и современное соответствие глаголу ὁράω; более возвышенное «узреть» было бы стилистически архаичным.
- source_word: τὸν δίκαιον
  choice: Праведника
  rationale: В книге Деяний выражение функционирует как обозначение Иисуса. Субстантивированная форма «Праведник» сохраняет значение δίκαιος и титульную функцию.
- source_word: ἀκοῦσαι φωνὴν
  choice: услышать голос
  rationale: Хотя φωνή не имеет артикля, русский язык не располагает артиклями и естественно передаёт оборот как «услышать голос». Последующее «из Его уст» указывает на членораздельную речь, а не просто звук.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: из Его уст
  rationale: Сохранён конкретный образ греческого выражения. «Уста» в современном литературном библейском регистре звучит достойно и подчёркивает непосредственность услышанной речи.
- source_word: Ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Бог наших отцов
  rationale: Передаёт явное πατέρων и сохраняет традиционную заветную формулу, связывающую Павла с наследием Израиля.
theological_decisions:
- issue: Передавать ли τὸν δίκαιον как христологический титул или как обычное описание
  choice: «Праведник» с прописной буквы как титульное обозначение Иисуса
  alternative: «праведный» или «праведник» со строчной буквы; «Справедливый»
  rationale: В Деяниях это выражение устойчиво относится к Иисусу (ср. Деян 3:14; 7:52). Прописная буква обозначает титульную функцию, не добавляя нового содержания.
- issue: Следует ли обобщить «наших отцов» как «наших предков»
  choice: Сохранено «наших отцов»
  alternative: «наших предков»
  rationale: πατέρων прямо означает «отцов», а формула имеет значимый библейский и заветный оттенок. «Предки» возможно по смыслу, но менее точно сохраняет форму источника.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены конкретный образ «из Его уст» и заветная формула «Бог наших отцов»; архаизмы вроде «узреть» избегаются.
