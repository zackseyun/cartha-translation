lexical_decisions:
- source_word: κραυγαζόντων
  choice: кричали
  rationale: Причастие настоящего времени описывает продолжающееся действие толпы; «кричали» естественно передаёт громкие возгласы без излишнего уточнения.
- source_word: τε
  choice: и
  rationale: Частица связывает первое действие с последующими; по-русски эта связь естественно выражается перечислением с союзом «и» перед последним элементом.
- source_word: αὐτῶν
  choice: они / своими
  rationale: Родительный субъект при причастиях передан личной конструкцией «они», а принадлежность одежд выражена возвратным притяжательным местоимением «своими».
- source_word: ῥιπτούντων
  choice: размахивали
  rationale: В сочетании с одеждами глагол допускает как буквальное бросание, так и возбуждённое размахивание ими. В основном тексте выбрано естественное для описанной сцены «размахивали», а неоднозначность сохранена в сноске.
- source_word: τὰ ἱμάτια
  choice: своими одеждами
  rationale: Множественное ἱμάτια может обозначать одежду или верхние одежды. Общее «одеждами» не вводит большей конкретности, чем позволяет греческий текст.
- source_word: κονιορτόν
  choice: пыль
  rationale: Прямое и обычное соответствие существительному со значением пыли.
- source_word: βαλλόντων
  choice: бросали
  rationale: Нейтрально передаёт повторяющееся энергичное действие и сохраняет параллелизм перечисления.
- source_word: εἰς τὸν ἀέρα
  choice: в воздух
  rationale: Естественное и точное соответствие греческому предложному обороту.
