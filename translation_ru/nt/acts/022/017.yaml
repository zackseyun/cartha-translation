  text: Ἐγένετο δέ μοι ὑποστρέψαντι εἰς Ἰερουσαλὴμ καὶ προσευχομένου μου ἐν τῷ ἱερῷ γενέσθαι με ἐν ἐκστάσει
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/017.yaml
  text: And it happened to me that[a], after I had returned to Jerusalem and while I was praying in the temple, I fell into a trance[b],
translation:
  language: ru
  text: 'После того как я вернулся в Иерусалим, со мной случилось следующее: когда я молился в храме[a], я впал в транс[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово ἱερόν обозначает весь храмовый комплекс или его дворы, а не только внутреннее святилище.
    reason: cultural_note
  - marker: b
    text: 'Или: «оказался в трансе». Буквально греческий оборот означает «стать в состоянии исступления»; это идиоматическое обозначение вхождения в необычное состояние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: со мной случилось так
  rationale: Передаёт повествовательную формулу и личную вовлечённость Павла естественным современным русским языком.
- source_word: ὑποστρέψαντι εἰς Ἰερουσαλήμ
  choice: когда я вернулся в Иерусалим
  rationale: Аористное причастие обозначает возвращение, предшествующее главному событию; придаточное времени по-русски звучит естественно, а последовательность ясна из контекста.
- source_word: καὶ προσευχομένου μου
  choice: и молился
  rationale: Форма обозначает действие, происходившее одновременно с главным событием; в сочетании с «когда» русский несовершенный вид передаёт его длительность.
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: Обычное и понятное обозначение храмового комплекса; более точный пространственный смысл указан в сноске.
- source_word: γενέσθαι με ἐν ἐκστάσει
  choice: я вошёл в исступление
  rationale: Оборот γίνομαι ἐν обозначает вхождение в состояние. «Войти в исступление» сохраняет образ состояния изменённого восприятия и не добавляет объяснения его природы.
theological_decisions:
- issue: Характер переживания Павла (ἐκστάσει)
  choice: исступление
  alternative: транс; состояние видения
  rationale: «Исступление» — традиционно понятный русский эквивалент библейского ἔκστασις, обозначающий необычное состояние восприятия. Перевод не определяет его механизм и не привносит дополнительных богословских утверждений.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис сделан ясным и естественным; слово «исступление» сохраняет достоинство регистра и смысловую открытость исходного текста.
