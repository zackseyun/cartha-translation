  naturalness: «Со мной случилось так, что» тяжеловесно и не вполне естественно для современного литературного русского. Формула «со мной случилось следующее:» естественна в повествовании Павла; последующий синтаксис прозрачен.
  terminology: '«Транс» — современный и нейтральный эквивалент ἔκστασις в данном контексте. «Исступление» возможно как традиционный библейский термин, но в современном русском часто обозначает сильное, неконтролируемое возбуждение и потому может неверно направить понимание. Сноска не должна утверждать, что человек непременно «получает видение»: в самом стихе это не сказано.'
