language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ ἑκατοντάρχης προσελθὼν ⸂τῷ χιλιάρχῳ ἀπήγγειλεν⸃ λέγων· ⸀Τί μέλλεις ποιεῖν; ὁ γὰρ ἄνθρωπος οὗτος Ῥωμαῖός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/026.yaml
  text: When the centurion heard this[a], he went to the commander and reported it, saying[b], “What are you about to do? For this man is a Roman citizen.”
translation:
  language: ru
  text: 'Услышав это, сотник подошёл к командиру и доложил: «Что ты собираешься делать?[a] Ведь этот человек — римский гражданин».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Что ты намерен сделать?» либо «Что ты сейчас сделаешь?» Греческое выражение может указывать и на намерение, и на действие, которое вот-вот произойдёт.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «этот человек — римлянин». В данном контексте имеется в виду, что он обладает римским гражданством.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Услышав это
  rationale: Аористное причастие обозначает обстоятельство, предшествующее основному действию; такой оборот естественен по-русски. Местоимение «это» восстанавливает подразумеваемое содержание из контекста.
- source_word: ἑκατοντάρχης
  choice: сотник
  rationale: Традиционный и точный русский эквивалент названия римского военного чина ἑκατοντάρχης; понятен в библейском повествовании.
- source_word: προσελθὼν
  choice: подошёл к
  rationale: Передаёт направленное приближение к вышестоящему командиру и естественно связывает последовательные действия.
- source_word: τῷ χιλιάρχῳ
  choice: к командиру
  rationale: В данном контексте χιλίαρχος — римский старший офицер, командовавший когортой; «командир» понятно современному читателю и не требует специального знания римских чинов.
- source_word: ἀπήγγειλεν
  choice: доложил
  rationale: Глагол означает сообщение сведений; «доложил» особенно уместно для обращения подчинённого военного к начальнику.
- source_word: λέγων
  choice: 'доложил:'
  rationale: Греческое причастие вводит прямую речь. В русском двоеточие после глагола речи передаёт эту связь естественнее буквального «говоря».
- source_word: Τί μέλλεις ποιεῖν;
  choice: Что ты собираешься делать?
  rationale: μέλλω с инфинитивом может выражать как намерение, так и близость действия. Основной текст естественно передаёт намерение, а примечание сохраняет оттенок непосредственной предстоящей ситуации.
- source_word: ὁ γὰρ ἄνθρωπος οὗτος
  choice: Ведь этот человек
  rationale: γάρ здесь обосновывает тревожный вопрос; «ведь» естественно выражает пояснительно-причинную связь. ἄνθρωπος передано нейтральным «человек».
- source_word: Ῥωμαῖός ἐστιν
  choice: римский гражданин
  rationale: Буквально — «римлянин», но в юридическом контексте речь идёт о статусе римского гражданства. Явное обозначение гражданства предотвращает ошибочное понимание как этнической или географической принадлежности.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Военная субординация естественно выражена глаголом «доложил». Термин «сотник» сохраняет привычную библейскую точность, тогда как более редкий специальный чин χιλίαρχος передан доступным словом «командир».
