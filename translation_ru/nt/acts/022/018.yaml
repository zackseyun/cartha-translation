source:
  edition: SBLGNT
  text: καὶ ἰδεῖν αὐτὸν λέγοντά μοι· Σπεῦσον καὶ ἔξελθε ἐν τάχει ἐξ Ἰερουσαλήμ, διότι οὐ παραδέξονταί ⸀σου μαρτυρίαν περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/018.yaml
  text: and I saw him saying to me[a], ‘Hurry and get out of Jerusalem quickly, because they will not accept your testimony about me.’
translation:
  language: ru
  text: 'и увидел Его, и Он сказал мне: «Поспеши, скорее выйди из Иерусалима, потому что они не примут[a] твоего свидетельства обо Мне».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не воспримут».'
    reason: Лексема παραδέχομαι допускает оттенок благосклонного принятия или восприятия свидетельства.
lexical_decisions:
- source_word: ἰδεῖν
  choice: увидел
  rationale: Хотя в греческом стоит инфинитив, он продолжает зависимую конструкцию предыдущего стиха. Личная форма естественно передаёт повествование по-русски.
- source_word: αὐτὸν λέγοντά μοι
  choice: Его, и Он сказал мне
  rationale: Греческое причастие относится к местоимению «Его». Сочинительная конструкция звучит естественно на современном русском и сохраняет местоименное обозначение говорящего, не подставляя отсутствующие в стихе слова «Господь» или «Иисус».
- source_word: Σπεῦσον
  choice: Поспеши
  rationale: Аористный императив выражает настоятельное побуждение; «Поспеши» передаёт срочность без архаичности.
- source_word: ἔξελθε ἐν τάχει
  choice: скорее выйди
  rationale: «Выйди» сохраняет направленность движения наружу, а «скорее» передаёт ἐν τάχει и вместе с «Поспеши» отражает двойное усиление срочности.
- source_word: ἐξ Ἰερουσαλήμ
  choice: из Иерусалима
  rationale: Предлог ἐξ обозначает движение из города; русский предлог «из» точно и естественно передаёт это значение.
- source_word: διότι
  choice: потому что
  rationale: Союз прямо вводит причину повеления.
- source_word: οὐ παραδέξονταί
  choice: не примут
  rationale: В данном контексте παραδέχομαι означает принять или благосклонно воспринять свидетельство. «Не примут» кратко и естественно сохраняет это значение.
- source_word: σου μαρτυρίαν
  choice: твоего свидетельства
  rationale: μαρτυρία обозначает свидетельство как провозглашаемое сообщение; родительный падеж обусловлен русским управлением при отрицании.
- source_word: περὶ ἐμοῦ
  choice: обо Мне
  rationale: περί с родительным падежом обозначает предмет свидетельства. «Обо Мне» — естественный современный эквивалент.
theological_decisions:
- issue: Кого обозначает местоимение αὐτόν
  choice: Сохранить местоимение «Его» и последующее «Он»
  alternative: Заменить местоимение словами «Господа» или «Иисуса»
  rationale: Из ближайшего контекста ясно, кто говорит, однако сам стих употребляет местоимение. Перевод не добавляет отсутствующего титула или имени и не устраняет контекстуальную связь.
translation_notes:
  register: Современный литературный русский язык с dignified, но не архаичным звучанием. Повтор срочности в «Поспеши, скорее выйди» намеренно сохраняет греческое усиление. Заглавные буквы в местоимениях «Его», «Он», «Мне» следуют принятой русской библейской издательской традиции и не заменяют местоимение толковательным титулом.
