  text: ὅτι ἔσῃ μάρτυς αὐτῷ πρὸς πάντας ἀνθρώπους ὧν ἑώρακας καὶ ἤκουσας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/015.yaml
  text: For you will be a witness for him to all people of what you have seen and heard[a][b].
translation:
  language: ru
  text: Потому что ты будешь Его свидетелем перед всеми людьми — свидетелем того, что ты видел и слышал.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «свидетелем Ему»; греческий дательный падеж может здесь означать как свидетельство о Нём и в Его пользу, так и отношение свидетеля к Нему.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Потому что
  rationale: Союз вводит объяснение поручения в предыдущем контексте; «потому что» естественно передаёт причинно-пояснительную связь.
- source_word: ἔσῃ μάρτυς
  choice: ты будешь свидетелем
  rationale: Будущее время передано прямо, а μάρτυς обозначает человека, свидетельствующего на основании увиденного и услышанного.
- source_word: αὐτῷ
  choice: Его
  rationale: Притяжательная конструкция «Его свидетелем» естественна по-русски и передаёт свидетельство в Его пользу или о Нём; неоднозначность греческого дательного отмечена в сноске.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: перед всеми людьми
  rationale: πρός указывает на тех, к кому будет обращено свидетельство. «Перед всеми людьми» естественно обозначает широкую аудиторию, а «людьми» не ограничивает смысл мужчинами.
- source_word: ὧν ἑώρακας καὶ ἤκουσας
  choice: того, что ты видел и слышал
  rationale: Родительное относительное местоимение выражает содержание свидетельства. Русская парная формула точно и естественно передаёт личный опыт, лежащий в его основе.
theological_decisions:
- issue: Значение αὐτῷ в поручении Павлу
  choice: «Его свидетелем» — свидетельствующим о Господе и в Его пользу
  alternative: «свидетелем Ему» или «свидетелем для Него»
  rationale: Контекст связывает поручение с Господом/Иисусом, однако дательный падеж допускает близкие оттенки отношения и пользы. Основной текст остаётся естественным по-русски, а сноска сохраняет грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Повтор «свидетелем» после тире выбран ради естественной связи с содержанием свидетельства и устранения тяжеловесной конструкции «свидетелем… о том».
