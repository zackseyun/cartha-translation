id: ACT.22.6
reference: Acts 22:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐγένετο δέ μοι πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ περὶ μεσημβρίαν ἐξαίφνης ἐκ τοῦ οὐρανοῦ περιαστράψαι φῶς ἱκανὸν περὶ ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/006.yaml
  text: It happened that as I was traveling and drawing near to Damascus[a], about noon, suddenly a bright light from heaven flashed around me,
translation:
  language: ru
  text: Когда же я был в пути и приближался к Дамаску, около полудня внезапно с неба вокруг меня вспыхнул яркий свет[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сильный свет». Греческое выражение может подчёркивать величину или интенсивность света.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι πορευομένῳ
  choice: Когда же я был в пути
  rationale: Русская временная конструкция естественно передаёт событийное Ἐγένετο с дательным μοι и продолжающееся действие причастия πορευομένῳ; «же» сохраняет мягкую связующую силу δέ.
- source_word: καὶ ἐγγίζοντι τῇ Δαμασκῷ
  choice: и приближался к Дамаску
  rationale: Передаёт продолжающееся приближение к месту назначения и управление дательным при ἐγγίζω естественной русской конструкцией.
- source_word: περὶ μεσημβρίαν
  choice: около полудня
  rationale: Точно и естественно передаёт приблизительное указание времени.
- source_word: ἐξαίφνης
  choice: внезапно
  rationale: Сохраняет резкость и неожиданность события.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: с неба
  rationale: В данном контексте сохраняет указание на небесный источник света и звучит естественно по-русски.
- source_word: περιαστράψαι
  choice: вокруг меня вспыхнул
  rationale: Глагол с приставкой περί обозначает свет, охвативший человека вокруг; «вспыхнул» передаёт внезапное начало, выраженное аористом и усиленное ἐξαίφνης.
- source_word: φῶς ἱκανὸν
  choice: яркий свет
  rationale: В контексте ἱκανός указывает на значительную силу или величину света; «яркий свет» естественно выражает его интенсивность, не исключая альтернативы «сильный свет».
- source_word: περὶ ἐμέ
  choice: вокруг меня
  rationale: Прямо сохраняет пространственный смысл выражения.
theological_decisions:
- issue: Значение οὐρανός в выражении ἐκ τοῦ οὐρανοῦ
  choice: с неба
  alternative: с небосвода
  rationale: Контекст откровения и словоупотребление в Деяниях допускают и предполагают небесный, а не только метеорологический источник; обычное русское «с неба» сохраняет эту смысловую широту без дополнительного доктринального уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном, подходящим для устного свидетельства Павла. Маркер сноски поставлен непосредственно после слов, к которым относится лексическая альтернатива.
