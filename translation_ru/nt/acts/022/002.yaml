  yaml_path: translation/nt/acts/022/002.yaml
  text: 'But when they heard that he was addressing them in the Hebrew language[a], they became even more quiet. And he said:'
translation:
  language: ru
  text: 'Услышав же, что он обращается к ним на еврейском языке[a], они притихли ещё больше. И он сказал:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «на арамейском языке». В греческом тексте сказано «на еврейском языке», но в данном контексте это выражение может обозначать местную семитскую речь Иудеи.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Услышав же
  rationale: Аористное причастие передаёт обстоятельство времени, а частица δὲ — мягкий переход в повествовании; эта конструкция естественна для современного литературного русского.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: на еврейском языке
  rationale: Основной текст сохраняет прямое обозначение греческого оригинала, не подменяя его возможным историческим референтом — арамейским языком.
- source_word: προσεφώνει αὐτοῖς
  choice: он обращается к ним
  rationale: Глагол обозначает направленную к слушателям речь; настоящее время по-русски естественно передаёт повествовательный исторический презенс и сохраняет живость оригинала.
- source_word: μᾶλλον παρέσχον ἡσυχίαν
  choice: они притихли ещё больше
  rationale: Греческая идиома буквально говорит, что слушатели «предоставили больше тишины»; русское «притихли ещё больше» естественно передаёт усиление тишины.
- source_word: καὶ φησίν
  choice: 'И он сказал:'
  rationale: Историческое настоящее φησίν передано обычным для русского повествования прошедшим временем; двоеточие вводит последующую речь Павла.
theological_decisions:
- issue: Какой язык обозначен выражением τῇ Ἑβραΐδι διαλέκτῳ
  choice: 'В основном тексте: «на еврейском языке»'
  alternative: «на арамейском языке»
  rationale: Греческий текст прямо употребляет обозначение «еврейский», хотя в данном историческом контексте оно может относиться к местной семитской речи Иудеи, то есть к арамейскому. Неопределённость сохраняется посредством сноски.
translation_notes:
  register: Современный литературный русский с естественным, но достойным повествовательным ритмом. Формулировка «притихли ещё больше» понятна широкому кругу читателей и передаёт сравнительное усиление без буквалистской неестественности.
