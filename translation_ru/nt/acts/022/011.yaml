source:
  edition: SBLGNT
  text: ὡς δὲ οὐκ ἐνέβλεπον ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου, χειραγωγούμενος ὑπὸ τῶν συνόντων μοι ἦλθον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/011.yaml
  text: And since I could not see because of the brightness of that light[a], I came into Damascus being led by the hand by those who were with me.
translation:
  language: ru
  text: А так как я не мог видеть из-за сияния того света[a], меня за руку привели в Дамаск те, кто был со мной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «из-за славы того света».'
    reason: Лексическая альтернатива для δόξα, которое буквально означает «слава», но здесь описывает ослепительное сияние света.
lexical_decisions:
- source_word: ὡς δὲ
  choice: И поскольку
  rationale: ὡς передаёт обстоятельство с причинным оттенком, а δέ продолжает повествование; сочетание «И поскольку» естественно связывает потерю зрения с необходимостью идти при посторонней помощи.
- source_word: οὐκ ἐνέβλεπον
  choice: я не мог видеть
  rationale: В данном контексте ἐμβλέπω означает способность видеть, а не просто смотреть на что-либо; несовершенный вид отражает продолжавшееся состояние.
- source_word: ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου
  choice: из-за сияния того света
  rationale: Предлог ἀπό здесь указывает на причину, а δόξα — на ослепительное сияние света. «Сияние» сохраняет образ необыкновенного света и звучит естественнее, чем буквальная «слава», которая приведена в сноске.
- source_word: χειραγωγούμενος
  choice: ведомый за руку
  rationale: Причастие прямо обозначает ведение человека за руку; перевод сохраняет эту наглядную подробность и одновременность действия с приходом в Дамаск.
- source_word: ὑπὸ τῶν συνόντων μοι
  choice: теми, кто был со мной
  rationale: Формулировка близко передаёт значение σύνειμι «быть вместе, сопровождать», не уточняя сверх текста характер отношений между этими людьми.
- source_word: ἦλθον εἰς Δαμασκόν
  choice: я пришёл в Дамаск
  rationale: Обычная современная русская конструкция с глаголом движения естественно передаёт направленность εἰς к месту назначения.
theological_decisions:
- issue: Передача δόξα в контексте небесного явления
  choice: сияние
  alternative: слава
  rationale: В этом предложении δόξα обозначает видимое ослепительное излучение света, ставшее причиной потери зрения. «Сияние» ясно передаёт непосредственный смысл, а сноска сохраняет богословски значимую буквальную возможность «слава».
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Синтаксис сохраняет причинную связь и причастную конструкцию оригинала; «ведомый за руку» несколько приподнято, но ясно и точно.
