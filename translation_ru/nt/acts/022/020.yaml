  text: καὶ ὅτε ⸀ἐξεχύννετο τὸ αἷμα Στεφάνου τοῦ μάρτυρός σου, καὶ αὐτὸς ἤμην ἐφεστὼς καὶ συνευδοκῶν ⸀καὶ φυλάσσων τὰ ἱμάτια τῶν ἀναιρούντων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/020.yaml
  text: And when the blood of Stephen your witness was being poured out[a], I myself was standing by and approving, and guarding the cloaks of those who were killing him.
translation:
  language: ru
  text: И когда проливалась кровь Стефана, твоего свидетеля[a], я и сам стоял рядом, одобрял это и стёрёг одежду тех, кто убивал его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мученика». Греческое слово может означать «свидетель», а в христианском употреблении стало особенно обозначать того, кто умирает за своё свидетельство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεχύννετο
  choice: проливалась
  rationale: Имперфект пассивного залога передаёт продолжавшееся действие, а «проливалась» сохраняет образ излияния крови и естественно звучит по-русски.
- source_word: αἷμα
  choice: кровь
  rationale: Прямое и обычное соответствие в данном контексте.
- source_word: μάρτυρός
  choice: свидетеля
  rationale: Основное значение μάρτυς — «свидетель». Позднейшее значение «мученик» уместно отметить в сноске, не подменяя им исходный смысл в основном тексте.
- source_word: ἐφεστὼς
  choice: стоял рядом
  rationale: Передаёт присутствие Павла непосредственно при происходившем, не приписывая обороту дополнительного смысла.
- source_word: συνευδοκῶν
  choice: одобрял это
  rationale: Причастие выражает согласие и активное одобрение; добавленное «это» естественно восполняет подразумеваемый объект в русском языке.
- source_word: φυλάσσων
  choice: охранял
  rationale: Передаёт конкретное действие по присмотру за оставленной одеждой.
- source_word: ἱμάτια
  choice: одежду
  rationale: Русское собирательное единственное число естественно передаёт множественное ἱμάτια; более узкое «плащи» могло бы неоправданно конкретизировать вид верхней одежды.
- source_word: ἀναιρούντων
  choice: убивал
  rationale: Нейтрально и прямо передаёт значение «лишать жизни», не добавляя юридической или нравственной квалификации.
- source_word: αὐτὸς
  choice: я и сам
  rationale: Сохраняет эмфатический характер местоимения и естественно звучит в русском повествовании.
theological_decisions:
- issue: Передача μάρτυς применительно к Стефану
  choice: свидетель
  alternative: мученик
  rationale: В основном тексте сохранено исходное значение «свидетель», тогда как возникшее в христианском употреблении значение «мученик» отмечено в сноске. Это позволяет не вносить позднейший церковный термин в текст и одновременно сохраняет значимую связь с насильственной смертью Стефана.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно торжественным звучанием. Структура греческого предложения сохранена без тяжеловесной буквальности; строчная форма «твоего» не навязывает конфессиональную практику написания местоимений с прописной буквы.
