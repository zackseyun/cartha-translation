  yaml_path: translation/nt/acts/022/027.yaml
  text: So the tribune came up and said to him[a], “Tell me, are you a Roman?” And he said[b], “Yes.”
translation:
  language: ru
  text: 'Тогда тысяченачальник подошёл к нему и спросил: «Скажи мне, ты римский гражданин?» Тот ответил: «Да».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθὼν
  choice: подошёл
  rationale: Аористное причастие указывает, что начальник приблизился к Павлу перед вопросом; в русском повествовании естественно передать его личной формой глагола.
- source_word: δὲ
  choice: тогда
  rationale: Частица обозначает продвижение повествования, а не резкое противопоставление. «Тогда» естественно связывает действие с предшествующим контекстом.
- source_word: χιλίαρχος
  choice: тысяченачальник
  rationale: Термин обозначает римского военного офицера, командовавшего когортой. «Тысяченачальник» — укоренившееся и достаточно понятное русское соответствие, сохраняющее историческую специфику должности.
- source_word: εἶπεν αὐτῷ
  choice: спросил
  rationale: Буквально «сказал ему», но вслед за формулой речи стоит прямой вопрос; «спросил» естественно передаёт функцию высказывания, а адресат уже выражен сочетанием «к нему».
- source_word: Λέγε μοι
  choice: Скажи мне
  rationale: Прямое соответствие повелительной форме с дательным местоимением; звучит естественно по-русски.
- source_word: σὺ
  choice: ты
  rationale: Явно выраженное греческое местоимение сохраняется; в данном вопросе русская конструкция позволяет услышать его смысловое выделение без добавления «сам».
- source_word: Ῥωμαῖος
  choice: римский гражданин
  rationale: Субстантивированное прилагательное в контексте обозначает именно юридический статус римского гражданина. Буквальное «римлянин» в современном русском может быть понято лишь как указание на происхождение или место жительства.
- source_word: ὁ δὲ ἔφη
  choice: Павел ответил
  rationale: Греческое «он же сказал» вводит ответ. Имя Павла восстанавливает референта естественным для русского способом и устраняет возможную неясность после упоминания тысяченачальника.
- source_word: Ναί
  choice: Да
  rationale: Краткий прямой эквивалент утвердительного ответа без смыслового расширения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Юридический смысл Ῥωμαῖος раскрыт непосредственно как «римский гражданин», поэтому культурная сноска не требуется. Исторический титул χιλίαρχος сохранён как «тысяченачальник» без обобщения до «командира».
