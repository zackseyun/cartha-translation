lexical_decisions:
- source_word: Ἁνανίας
  choice: Анания
  rationale: Традиционная русская форма библейского личного имени.
- source_word: δέ
  choice: не выражено отдельным словом
  rationale: Частица обозначает мягкий переход; в современном русском связность естественно передаётся без вводного «же» или временного «тогда».
- source_word: τις ἀνὴρ
  choice: некий человек
  rationale: Передаёт введение конкретного, но прежде не названного мужчины; имя далее естественно присоединено оборотом «по имени».
- source_word: εὐλαβὴς κατὰ τὸν νόμον
  choice: благочестивый и живший по Закону
  rationale: Передаёт религиозную ревностность Анании, определяемую его соответствием Закону, и звучит естественно по-русски.
- source_word: μαρτυρούμενος
  choice: пользовался доброй славой
  rationale: Пассивное причастие указывает на благоприятное свидетельство окружающих; выбранная формулировка ясно передаёт хорошую репутацию.
- source_word: ὑπὸ πάντων τῶν κατοικούντων Ἰουδαίων
  choice: у всех живших там иудеев
  rationale: Сохраняет всеобщность πάντων и передаёт κατοικούντων с подразумеваемым из контекста местом проживания.
theological_decisions:
- issue: Значение Ἰουδαίων
  choice: иудеев
  alternative: жителей Иудеи
  rationale: Здесь речь идёт об иудейской общине Дамаска, а не о географическом происхождении из Иудеи; при этом примечание сохраняет лексическую альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. «Закон» написан с прописной буквы как обозначение Моисеева Закона. Синтаксис завершён как самостоятельный стих, хотя в греческом тексте предложение продолжается далее.
