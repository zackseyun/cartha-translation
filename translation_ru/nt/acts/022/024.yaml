  text: ἐκέλευσεν ⸂ὁ χιλίαρχος εἰσάγεσθαι αὐτὸν⸃ εἰς τὴν παρεμβολήν, ⸀εἴπας μάστιξιν ἀνετάζεσθαι αὐτὸν ἵνα ἐπιγνῷ δι’ ἣν αἰτίαν οὕτως ἐπεφώνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/024.yaml
  text: The tribune ordered him to be brought into the barracks[a], saying that he should be examined by scourging[b], so that he might find out for what reason they were shouting against him like this.
translation:
  language: ru
  text: Тысяченачальник велел отвести Павла в казармы[a] и приказал допросить его с применением бичевания[b], чтобы он выяснил, по какой причине люди так кричали против него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в военный лагерь» или «в крепость». Здесь имеется в виду место размещения римских воинов в Иерусалиме.'
    reason: cultural_note
  - marker: b
    text: 'Или: «допросить, бичуя». Греческий текст соединяет понятие допроса с прямо указанным средством — бичеванием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: тысяченачальник
  rationale: Исторически точный и укоренённый в русском библейском языке термин для римского военного трибуна; он передаёт воинское звание, не сводя его к общему «начальник».
- source_word: παρεμβολή
  choice: казармы
  rationale: В данном иерусалимском контексте слово обозначает место размещения римских воинов, вероятно в крепости Антония; «казармы» естественно передаёт функциональный смысл.
- source_word: εἰσάγεσθαι αὐτόν
  choice: отвести Павла
  rationale: Пассивный инфинитив означает, что воины должны были увести его внутрь. Имя «Павла» вместо местоимения устраняет возможную неясность в отдельно читаемом стихе.
- source_word: μάστιξιν ἀνετάζεσθαι
  choice: допросить его под бичеванием
  rationale: Сочетание сохраняет как следственный смысл ἀνετάζω, так и прямо названный способ — бичевание; речь идёт о допросе с применением телесного истязания.
- source_word: ἵνα ἐπιγνῷ
  choice: чтобы выяснить
  rationale: Естественно передаёт цель начальника — установить причину происходящего.
- source_word: δι’ ἣν αἰτίαν
  choice: по какой причине
  rationale: Сохраняет значение причины и не вводит более узкое юридическое понятие формального обвинения.
- source_word: οὕτως ἐπεφώνουν αὐτῷ
  choice: люди так кричали против него
  rationale: Имперфект передаёт продолжавшийся крик, а «против него» сохраняет враждебную направленность αὐτῷ в данном контексте.
