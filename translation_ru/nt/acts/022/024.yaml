translation_notes:
  register: 'Современный литературный русский язык с умеренно формальным, повествовательным звучанием. «Тысяченачальник» сохраняет историческую специфику должности; «под бичеванием» передаёт суровость римского допроса без смягчения. Порядок сносок исправлен относительно английского консультационного слоя: примечание о казармах относится к [a], а о допросе под бичеванием — к [b].'
