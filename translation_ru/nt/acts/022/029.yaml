base_translation:
  language: en
  yaml_path: translation/nt/acts/022/029.yaml
  text: Therefore those who were about to examine him withdrew from him at once[b][a], and the tribune also became afraid when he realized that he was a Roman citizen and that he had bound him.
translation:
  language: ru
  text: Поэтому те, кто собирался допрашивать его[a], сразу отошли от него. Испугался и тысяченачальник[b], узнав, что Павел — римский гражданин и что он сам уже связал Павла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с учётом контекста: «допрашивать его бичеванием». Греческий глагол может обозначать официальный допрос, а предыдущий стих поясняет, каким способом его намеревались проводить.'
    reason: lexical_alternative
  - marker: b
    text: То есть римский военный начальник, по должности командовавший примерно тысячей воинов, хотя фактическая численность подразделения могла быть иной.
    reason: cultural_note
lexical_decisions:
- source_word: εὐθέως οὖν
  choice: Поэтому … сразу
  rationale: «Поэтому» передаёт вывод из предыдущей реплики Павла, а «сразу» — немедленность реакции; такое распределение естественно для современного русского повествования.
- source_word: ἀπέστησαν ἀπ’ αὐτοῦ
  choice: отошли от него
  rationale: Передаёт прекращение намеченного действия и физическое отступление без излишне буквального «отступили прочь».
- source_word: οἱ μέλλοντες αὐτὸν ἀνετάζειν
  choice: те, кто собирался допрашивать его
  rationale: Конструкция с μέλλω указывает на ближайшее намерение. «Допрашивать» соответствует официальному разбирательству; конкретный способ допроса, ясный из контекста, вынесен в сноску.
- source_word: χιλίαρχος
  choice: тысяченачальник
  rationale: Традиционный и достаточно прозрачный русский термин для римского военного начальника такого ранга; культурная реалия пояснена в сноске.
- source_word: ἐφοβήθη
  choice: испугался
  rationale: Аорист обозначает наступившую реакцию страха после осознания правового положения Павла.
- source_word: ἐπιγνοὺς
  choice: узнав
  rationale: Естественно выражает приобретённое понимание обстоятельства, вызвавшего страх.
- source_word: Ῥωμαῖός ἐστιν
  choice: тот — римский гражданин
  rationale: В контексте речь идёт именно о юридическом статусе, поэтому «римский гражданин» точнее простого «римлянин».
- source_word: αὐτὸν ἦν δεδεκώς
  choice: он связал его
  rationale: Передаёт совершившееся действие с сохраняющимся результатом, не добавляя причинительной идеи «велел связать», которой греческая форма прямо не выражает.
