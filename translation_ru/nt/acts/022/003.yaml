source:
  edition: SBLGNT
  text: ⸀Ἐγώ εἰμι ἀνὴρ Ἰουδαῖος, γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας, ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ παρὰ τοὺς πόδας Γαμαλιήλ, πεπαιδευμένος κατὰ ἀκρίβειαν τοῦ πατρῴου νόμου, ζηλωτὴς ὑπάρχων τοῦ θεοῦ καθὼς πάντες ὑμεῖς ἐστε σήμερον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/003.yaml
  text: I am a Jewish man[a], born in Tarsus of Cilicia, but brought up in this city at the feet of Gamaliel, educated according to the strictness of the law of our fathers[b], being zealous for God just as all of you are today.
translation:
  language: ru
  text: Я — иудей, родившийся в Тарсе Киликийском, но выросший в этом городе у ног Гамалиила[a], получивший строгое образование по отеческому Закону[b] и исполненный ревности о Боге, как и все вы сегодня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «у ног Гамалиила» означает, что Павел учился у него как у наставника.
    reason: cultural_note
  - marker: b
    text: 'Или: «по Закону предков».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ Ἰουδαῖος
  choice: иудей
  rationale: В современном русском «иудей» естественно передаёт этнорелигиозную принадлежность; мужской род формы и последующих причастий в данном контексте указывает на мужчину без тяжеловесного «мужчина-иудей».
- source_word: γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας
  choice: родившийся в Тарсе Киликийском
  rationale: Передаёт место рождения и принадлежность Тарса к Киликии краткой, естественной русской географической формой.
- source_word: ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ
  choice: но выросший в этом городе
  rationale: Глагол обозначает воспитание и взросление; «но» сохраняет противопоставление места рождения месту, где Павел вырос.
- source_word: παρὰ τοὺς πόδας Γαμαλιήλ
  choice: у ног Гамалиила
  rationale: Сохранён яркий образ ученичества у наставника; его культурное значение разъяснено в сноске.
- source_word: πεπαιδευμένος κατὰ ἀκρίβειαν
  choice: тщательно наставленный
  rationale: Естественно передаёт серьёзность, точность и строгость полученного обучения, не делая русскую фразу громоздкой.
- source_word: τοῦ πατρῴου νόμου
  choice: в отеческом Законе
  rationale: «Отеческий» сохраняет идею унаследованного от предков закона и риторическую связь Павла со слушателями; прописная буква обозначает конкретный Закон в иудейском контексте.
- source_word: ζηλωτὴς ὑπάρχων τοῦ θεοῦ
  choice: исполненный ревности о Боге
  rationale: Передаёт сильное религиозное рвение и избегает возможной политической ассоциации слова «зелот».
- source_word: καθὼς πάντες ὑμεῖς ἐστε σήμερον
  choice: как и все вы сегодня
  rationale: Сохраняет прямое риторическое отождествление Павла с нынешним усердием его слушателей.
theological_decisions:
- issue: Передача πατρῴου νόμου и общей религиозной традиции Павла со слушателями
  choice: отеческий Закон
  alternative: Закон предков
  rationale: «Отеческий Закон» сохраняет наследственный и общинный оттенок выражения, не добавляя к тексту конфессионального толкования; допустимая лексическая альтернатива приведена в сноске.
- issue: Передача образного выражения παρὰ τοὺς πόδας Γαμαλιήλ
  choice: у ног Гамалиила
  alternative: под руководством Гамалиила
  rationale: Буквальный образ исторически и богословски нейтрален, а его смысл достаточно ясно раскрывается краткой культурной сноской.
- issue: Характер ревности в ζηλωτὴς τοῦ θεοῦ
  choice: ревность о Боге
  alternative: ревностная преданность Богу
  rationale: Выбранная формулировка сохраняет напряжённость понятия «ревность» и не сводит его заранее к более мягкому понятию преданности или к политическому зелотству.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной защитительной речи. Причастная структура сохраняет последовательность греческой фразы, но остаётся понятной; архаизмы вроде «ревнитель по Боге» исключены.
