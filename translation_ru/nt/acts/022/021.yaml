  text: καὶ εἶπεν πρός με· Πορεύου, ὅτι ἐγὼ εἰς ἔθνη μακρὰν ἐξαποστελῶ σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/021.yaml
  text: And he said to me[a], ‘Go, because I will send you far away to the Gentiles.’
translation:
  language: ru
  text: 'И Он сказал мне: «Иди, потому что Я пошлю тебя далеко, к язычникам[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «к народам».
    reason: Лексическая альтернатива для εἰς ἔθνη.
lexical_decisions:
- source_word: εἶπεν πρός με
  choice: сказал мне
  rationale: Оборот λέγω с πρός и винительным падежом вводит прямую речь, обращённую к собеседнику; «сказал мне» естественно и точно передаёт повествовательную формулу.
- source_word: Πορεύου
  choice: Иди
  rationale: Настоящее повелительное от πορεύομαι здесь употреблено как прямое повеление отправиться; краткое «иди» соответствует силе и стилю греческого текста.
- source_word: ὅτι
  choice: потому что
  rationale: 'Союз вводит основание повеления: Павел должен идти, потому что будет послан далеко.'
- source_word: ἐγὼ
  choice: Я
  rationale: Явно выраженное греческое местоимение подчёркивает действующего субъекта; в русской прямой речи это сохраняется личным местоимением «Я».
- source_word: εἰς ἔθνη
  choice: к язычникам
  rationale: В контексте Деяний речь идёт о неевреях, а не просто о политических государствах; «к язычникам» передаёт историко-религиозное противопоставление, тогда как буквальная возможность «к народам» отмечена в сноске.
- source_word: μακρὰν
  choice: далеко
  rationale: Наречие обозначает пространственную удалённость и естественно передаётся русским «далеко».
- source_word: ἐξαποστελῶ σε
  choice: Я пошлю тебя
  rationale: Будущее время ἐξαποστέλλω означает послать или отправить; «пошлю тебя» ясно передаёт действие без избыточного уточнения подразумеваемого поручения.
theological_decisions:
- issue: Передача ἔθνη в контексте апостольской миссии
  choice: язычникам
  alternative: народам
  rationale: В данном контексте ἔθνη обозначает неевреев как адресатов миссии Павла. «Язычникам» сохраняет существенное для Деяний различие между иудеями и неевреями, не добавляя конфессионального толкования; более буквальное «народам» дано как допустимая лексическая альтернатива.
translation_notes:
  register: Современный литературный русский язык; прямая, ясная и dignified повествовательная речь. Прописные «Он», «Я» в прямой речи отражают традиционное уважительное оформление речи Господа, не меняя смысла исходного текста.
