    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: слушали
  rationale: Имперфект обозначает продолжавшееся действие; в русском контексте несовершенный вид естественно передаёт длительность.
- source_word: ἄχρι τούτου τοῦ λόγου
  choice: до этих слов
  rationale: λόγος здесь указывает на сказанное Павлом, ставшее поводом для реакции; русское «до этих слов» естественно и не сводит выражение к одному отдельному слову.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: подняли крик
  rationale: Выражение обозначает громкий совместный возглас; «подняли крик» сохраняет образ и звучит естественно по-русски.
- source_word: Αἶρε ἀπὸ τῆς γῆς τὸν τοιοῦτον
  choice: Долой такого с лица земли!
  rationale: Враждебный императив требует устранить Павла; идиоматическое «долой» передаёт силу выкрика, а «с лица земли» — ἀπὸ τῆς γῆς и подразумеваемое требование смерти.
- source_word: οὐ γὰρ καθῆκεν αὐτὸν ζῆν
  choice: Ему не должно жить!
  rationale: καθῆκεν выражает должное или подобающее. Формулировка сохраняет нормативный смысл и прямую связь с инфинитивом ζῆν, не добавляя внешнего субъекта, который должен запретить ему жить.
