  text: They were listening to him up to this statement, and they raised their voices, saying, “Take such a man away from the earth, for it was not fitting for him to live.”
translation:
  language: ru
  text: 'Его слушали до этих слов, а затем подняли крик: «Долой такого с земли![a] Ему не следует жить!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Уберите такого с земли!»'
