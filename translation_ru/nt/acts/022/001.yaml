  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες
  choice: Мужи
  rationale: Звательная форма прямо обозначает мужчин, к которым обращается Павел. «Мужи» сохраняет этот смысл и торжественный характер публичной речи; слово слегка возвышенное, но понятное в современном литературном русском.
- source_word: ἀδελφοὶ
  choice: братья
  rationale: В составе обращения слово передано прямо и без расширения; контекст указывает на мужчин из числа слушателей.
- source_word: πατέρες
  choice: отцы
  rationale: Буквальный эквивалент сохраняет выражение почтения к старшим или уважаемым мужчинам, не превращая их без достаточных оснований в официальных «старейшин».
- source_word: ἀκούσατέ
  choice: выслушайте
  rationale: Повелительная форма означает призыв внимательно принять последующую речь. «Выслушайте» естественнее для русского публичного обращения, чем изолированное «услышьте».
- source_word: ἀπολογίας
  choice: защиту
  rationale: Здесь речь о защитительной речи или обоснованном ответе, а не об извинении. Краткое «защиту» ясно передаёт судебно-публичный оттенок.
- source_word: νυνὶ
  choice: теперь
  rationale: Слово подчёркивает непосредственность предстоящей защитительной речи.
- source_word: πρὸς ὑμᾶς
  choice: с которой я… обращаюсь к вам
  rationale: Так естественно по-русски выражена направленность защитительной речи к слушателям без искусственного оборота «защиту к вам».
