  text: εἶπον δέ· Τί ποιήσω, κύριε; ὁ δὲ κύριος εἶπεν πρός με· Ἀναστὰς πορεύου εἰς Δαμασκόν, κἀκεῖ σοι λαληθήσεται περὶ πάντων ὧν τέτακταί σοι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/010.yaml
  text: Then I said[a], ‘What should I do, Lord?’ And the Lord said to me, ‘Get up and go into Damascus[b], and there you will be told about everything that has been appointed for you to do.’
translation:
  language: ru
  text: 'Я сказал: «Что мне делать, Господь?» Господь же сказал мне: «Встань и иди в Дамаск. Там тебе скажут обо всём, что тебе назначено[a] сделать».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что тебе поручено сделать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ποιήσω
  choice: Что мне делать
  rationale: Делиберативный аорист конъюнктива выражает просьбу указать дальнейшее действие; современная русская формулировка естественно передаёт этот смысл без добавления модального оттенка.
- source_word: κύριε / ὁ ... κύριος
  choice: Господь / Господь
  rationale: В контексте рассказа о дороге в Дамаск титул относится к Иисусу; «Господь» сохраняет христологическую силу повествования.
- source_word: Ἀναστὰς πορεύου
  choice: Встань и иди
  rationale: Причастие Ἀναστὰς имеет сопутствующую императивную силу и образует последовательность двух действий.
- source_word: εἰς Δαμασκόν
  choice: в Дамаск
  rationale: Предлог εἰς обозначает направленное движение; по-русски «иди в Дамаск» естественно передаёт движение в город.
- source_word: κἀκεῖ σοι λαληθήσεται
  choice: Там тебе скажут
  rationale: Будущее страдательное с дательным лицом естественно передаётся русской неопределённо-личной конструкцией.
- source_word: περὶ πάντων ὧν τέτακταί σοι ποιῆσαι
  choice: обо всём, что тебе назначено сделать
  rationale: Формулировка сохраняет всеохватность πάντων, результативное состояние перфекта τέτακται и дательный σοι, не уточняя прямо, кем назначено.
theological_decisions:
- issue: Сила τέτακταί в связи с Божьим руководством и призванием Павла
  choice: что тебе назначено сделать
  alternative: что тебе поручено сделать
  rationale: «Назначено» сохраняет смысл уже установленного порядка действий и подразумеваемую божественную пассивную конструкцию, не вводя более жёсткой системы предопределения, чем выражает сам текст.
translation_notes:
  register: Современный литературный русский язык; синтаксис прямой и ясный, тон достойный. Повтор «Господь» сохранён вслед за греческим текстом. Стилистически тяжёлое буквальное страдательное «будет сказано тебе» передано естественным «тебе скажут».
