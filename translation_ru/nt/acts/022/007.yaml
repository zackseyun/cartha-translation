base_translation:
  language: en
  yaml_path: translation/nt/acts/022/007.yaml
  text: I fell to the ground and heard a voice saying to me, ‘Saul, Saul, why are you persecuting me?’
translation:
  language: ru
  text: 'Я упал на землю и услышал голос, говоривший мне: «Савл, Савл, почему ты преследуешь меня?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσά
  choice: Я упал
  rationale: Аорист от πίπτω обозначает завершённое событие; простая форма прошедшего времени естественна по-русски.
- source_word: τε
  choice: отдельно не переведено
  rationale: Частица связывает фразу с предшествующим повествованием; отдельная передача сделала бы русский текст тяжеловесным, тогда как связь сохраняется последовательностью действий и союзом «и».
- source_word: εἰς τὸ ἔδαφος
  choice: на землю
  rationale: В сочетании с глаголом падения это естественный русский эквивалент, точно обозначающий поверхность, на которую упал говорящий.
- source_word: ἤκουσα φωνῆς
  choice: услышал голос
  rationale: Родительный падеж при ἀκούω естественно передаётся в русском винительным прямого объекта; последующая речь показывает, что φωνή означает именно голос.
- source_word: λεγούσης μοι
  choice: говоривший мне
  rationale: Причастие настоящего времени описывает одновременное действие голоса, а μοι сохраняется как «мне».
- source_word: Σαοὺλ Σαούλ
  choice: Савл, Савл
  rationale: Сохраняются традиционная русская библейская форма имени, повтор и прямое обращение.
- source_word: τί
  choice: почему
  rationale: В вопросе о совершаемом действии τί выражает вопрос о причине.
- source_word: με
  choice: Меня
  rationale: Прямое дополнение сохранено без поясняющего расширения; прописная буква соответствует современной русской библейской издательской норме для обращения Христа к Себе.
- source_word: διώκεις
  choice: преследуешь
  rationale: В данном контексте διώκω означает враждебное гонение; русское настоящее время сохраняет незавершённый, продолжающийся характер действия.
theological_decisions:
- issue: Отождествление говорящего с тем, против кого направлены действия Савла
  choice: Сохранить прямое «Меня» без пояснения
  alternative: «Моих последователей» или «Мой народ»
  rationale: Греческий текст прямо ставит местоимение первого лица и тем самым сохраняет богословски значимую связь между говорящим и преследуемыми верующими; перевод не должен её разъяснять или ослаблять.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис близок к исходному, но естественен для устного повествования. Восклицательный знак после повторного обращения передаёт настойчивость обращения, не добавляя нового содержания.
