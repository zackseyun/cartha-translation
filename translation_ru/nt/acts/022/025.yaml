lexical_decisions:
- source_word: προέτειναν αὐτὸν τοῖς ἱμᾶσιν
  choice: его растянули, закрепив ремнями
  rationale: Передаёт как физическое растягивание Павла при подготовке к бичеванию, так и использование ремней; формулировка естественна для современного русского языка.
- source_word: ἑστῶτα
  choice: стоявшему рядом
  rationale: Причастие указывает на находившегося поблизости центуриона; «рядом» естественно передаёт сценическую близость.
- source_word: ἑκατόνταρχον
  choice: центуриону
  rationale: Точный и общепонятный термин для римского военного чина; он яснее привязывает должность к римскому контексту, чем «сотник».
- source_word: ἄνθρωπον Ῥωμαῖον
  choice: римского гражданина
  rationale: Буквально сочетание означает «римского человека/римлянина», но в данном юридическом возражении существенен защищённый законом статус римского гражданина. Буквальная форма отмечена в сноске.
- source_word: ἀκατάκριτον
  choice: не осуждённого
  rationale: 'Сохраняет юридический смысл: человек ещё не был признан виновным судебным решением.'
- source_word: ἔξεστιν ὑμῖν
  choice: Разве вам позволено
  rationale: Передаёт вопрос о законности действия и естественную для контекста риторическую силу, не превращая вопрос в категорическое утверждение.
- source_word: μαστίζειν
  choice: бичевать
  rationale: Обозначает суровое телесное наказание плетью; «бичевать» точно и уместно в dignified biblical register без чрезмерной архаичности.
