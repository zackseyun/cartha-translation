  text: καὶ ὁ καρδιογνώστης θεὸς ἐμαρτύρησεν αὐτοῖς ⸀δοὺς τὸ πνεῦμα τὸ ἅγιον καθὼς καὶ ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/008.yaml
  text: And God[a], who knows the heart, bore witness to them by giving them the Holy Spirit just as he did to us,
translation:
  language: ru
  text: И Бог[a], знающий сердца, засвидетельствовал им, дав им Святого Духа, как и нам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог, Сердцеведец».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καρδιογνώστης
  choice: знающий сердца
  rationale: Редкое составное слово обозначает того, кто знает человеческие сердца, то есть внутреннюю жизнь людей. Причастный оборот естественен в современном русском и сохраняет значение божественного свойства.
- source_word: θεὸς
  choice: Бог
  rationale: Обычный русский эквивалент; καρδιογνώστης выступает как характеристика Бога.
- source_word: ἐμαρτύρησεν
  choice: засвидетельствовал им
  rationale: 'Передаёт судебно-доказательный оттенок μαρτυρέω: Бог подтвердил принятие этих людей явным действием.'
- source_word: αὐτοῖς
  choice: им
  rationale: Сохраняет местоимение оригинала; его отнесённость к язычникам определяется контекстом, а не уточняется внутри стиха.
- source_word: δοὺς
  choice: дав им
  rationale: 'Аористное причастие указывает, каким действием Бог засвидетельствовал им: дарованием Святого Духа. Повтор местоимения делает русскую связь ясной.'
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Святого Духа
  rationale: Устоявшееся современное наименование, стоящее в винительном падеже после «дав».
- source_word: καθὼς καὶ ἡμῖν
  choice: как и нам
  rationale: 'Сохраняет лаконичное сравнение и эллипсис греческого текста: подразумевается «дал».'
theological_decisions:
- issue: Божественное свидетельство через дар Святого Духа
  choice: Бог засвидетельствовал им, дав им Святого Духа
  alternative: Бог подтвердил, что принимает их, дав им Святого Духа
  rationale: Выбранный вариант сохраняет образ свидетельства и не добавляет сформулированного вывода о принятии, хотя он следует из контекста.
- issue: Одинаковое дарование Духа «им» и «нам»
  choice: как и нам
  alternative: так же, как дал Его и нам
  rationale: Краткая формулировка сохраняет эллиптичность и богословскую напряжённость оригинала, не уточняя сверх текста этнический или заветный статус групп.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. «Знающий сердца» понятно широкому читателю; более буквальное и традиционное «Сердцеведец» сохранено в сноске.
