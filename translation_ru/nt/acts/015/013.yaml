    reason: cultural_note
lexical_decisions:
- source_word: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς
  choice: Когда они умолкли
  rationale: Оборот μετά с субстантивированным инфинитивом обозначает время после завершения действия. Русское «когда они умолкли» естественно передаёт последовательность событий и прекращение речи.
- source_word: ἀπεκρίθη
  choice: в ответ сказал
  rationale: Глагол означает «ответил, откликнулся». В данном контексте Иаков реагирует на предшествующие выступления; сочетание «в ответ сказал» звучит по-русски естественнее, чем буквальное «ответил, говоря».
- source_word: Ἰάκωβος
  choice: Иаков
  rationale: Использована устоявшаяся русская библейская форма имени Ἰάκωβος.
- source_word: λέγων
  choice: сказал
  rationale: Причастие вводит прямую речь и естественно включается в русскую личную глагольную конструкцию «в ответ сказал».
- source_word: Ἄνδρες ἀδελφοί
  choice: Братья
  rationale: Сочетание двух мужских звательных форм представляет собой торжественное обращение к мужчинам-собратьям. Буквальное «мужи, братья» в современном русском искусственно; «братья» сохраняет адресатов и достоинство речи, а буквальная форма отмечена в сноске.
- source_word: ἀκούσατέ μου
  choice: выслушайте меня
  rationale: Аористный императив призывает внимательно принять последующую речь. «Выслушайте меня» точнее передаёт просьбу дать говорящему слово, чем более общее «послушайте меня».
theological_decisions:
- issue: Мужское обращение Ἄνδρες ἀδελφοί на собрании
  choice: Братья
  alternative: Мужи, братья; братья и сёстры
  rationale: Греческий текст содержит две грамматически мужские формы и не выражает явно обращение «братья и сёстры», поэтому инклюзивное расширение не внесено. При этом современное «Братья» естественно передаёт обращение к мужчинам-собратьям, а формальная особенность оригинала сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной речи. Греческая конструкция «ответил, говоря» преобразована в естественное «в ответ сказал»; архаичное «мужи, братья» вынесено в сноску.
