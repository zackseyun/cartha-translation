  text: ἀπέχεσθαι εἰδωλοθύτων καὶ αἵματος καὶ ⸀πνικτῶν καὶ πορνείας· ἐξ ὧν διατηροῦντες ἑαυτοὺς εὖ πράξετε. ἔρρωσθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/029.yaml
  text: to abstain from food sacrificed to idols[a], from blood, from what has been strangled, and from sexual immorality. If you keep yourselves from these things, you will do well[d][c][b]. Farewell.
translation:
  language: ru
  text: воздерживаться от пищи, принесённой в жертву идолам[a], от крови, от мяса задушенных животных[b] и от сексуальной безнравственности[c]. Если будете воздерживаться от всего этого, хорошо поступите. Будьте здоровы[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от идоложертвенного», то есть от пищи, принесённой в жертву идолам.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от задушенного»; то есть от мяса животных, убитых удушением.'
    reason: lexical_alternative
  - marker: c
    text: Греческое слово имеет широкое значение; некоторые толкователи понимают его здесь более конкретно, в связи с запретами книги Левит.
    reason: alternative_reading
  - marker: d
    text: 'Или: «Прощайте». Греческое выражение было обычной формулой завершения письма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθαι
  choice: воздерживаться
  rationale: Точно и естественно передаёт содержание предписания и сочетается с родительным падежом в перечне.
- source_word: εἰδωλοθύτων
  choice: принесённого в жертву идолам
  rationale: Сохраняет широкую субстантивированную форму греческого слова, не ограничивая её прямо словом «пища» или «мясо», хотя в контексте прежде всего подразумевается жертвенная пища.
- source_word: αἵματος
  choice: крови
  rationale: Прямой перевод; контекст запрета не требует добавлять в основной текст толкование о способе употребления.
- source_word: πνικτῶν
  choice: удавленины
  rationale: Краткое и понятное обозначение мяса животных, убитых удушением; лексическая широта отмечена в сноске.
- source_word: πορνείας
  choice: сексуальной распущенности
  rationale: Передаёт широкое значение термина современным литературным русским языком, не сужая его до одного конкретного проступка.
- source_word: ἐξ ὧν διατηροῦντες ἑαυτούς
  choice: Если будете хранить себя от этого
  rationale: Условная формулировка естественно передаёт обстоятельственное причастие; «хранить себя» сохраняет оттенок осмотрительной самозащиты.
- source_word: εὖ πράξετε
  choice: хорошо поступите
  rationale: Передаёт одобрение правильного образа действий, не придавая выражению значения материального преуспевания.
- source_word: ἔρρωσθε
  choice: Будьте здоровы
  rationale: Передаёт принятую формулу завершения письма и одновременно сохраняет её буквальный оттенок пожелания здоровья.
theological_decisions:
- issue: Значение πορνεία в постановлении апостолов
  choice: сексуальная распущенность
  alternative: блуд; незаконный брак или запрещённые в Лев 18 союзы
  rationale: Сам стих не ограничивает термин определённым видом полового нарушения. Основной текст сохраняет его широкое лексическое значение, а более узкое контекстуальное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством эпистолярного наставления. Перечень передан компактно; традиционно-библейская «удавленина» сохранена ради точности и узнаваемости, но пояснена. Заключительная формула звучит естественно по-русски и сохраняет семантику греческого пожелания.
