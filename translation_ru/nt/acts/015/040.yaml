  text: Παῦλος δὲ ἐπιλεξάμενος Σιλᾶν ἐξῆλθεν παραδοθεὶς τῇ χάριτι τοῦ ⸀κυρίου ὑπὸ τῶν ἀδελφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/040.yaml
  text: But Paul chose Silas and departed[b][a], having been commended by the brothers to the grace of the Lord.
translation:
  language: ru
  text: Павел же выбрал Силу и отправился в путь, а братья поручили его благодати Господа.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вверили его» или «препоручили его благодати Господа».'
    reason: lexical_alternative
  - marker: b
    text: Слово «братья» в этом контексте может обозначать всю общину верующих, включая женщин.
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: же
  rationale: Передаёт мягкое противопоставление Павла Варнаве в предыдущем стихе без чрезмерного усиления.
- source_word: ἐπιλεξάμενος
  choice: выбрал
  rationale: Естественно передаёт предшествующий отъезду личный выбор Павла.
- source_word: Σιλᾶν
  choice: Силу
  rationale: Принятая русская форма имени Σιλᾶς в винительном падеже.
- source_word: ἐξῆλθεν
  choice: отправился в путь
  rationale: В повествовании о путешествии глагол означает выступить или отправиться; этот вариант естественен по-русски.
- source_word: παραδοθεὶς
  choice: вверенный
  rationale: Сохраняет образ передачи Павла под благодатную опеку Господа и не сводит выражение только к церемониальному напутствию.
- source_word: τῇ χάριτι
  choice: благодати
  rationale: Сохраняет богословски значимое существительное χάρις, не заменяя его толкованием вроде «милостивой заботы».
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: Передаёт κύριος традиционным титулом и не уточняет референта сверх исходного текста.
- source_word: ὑπὸ τῶν ἀδελφῶν
  choice: братьями
  rationale: Формально передаёт мужской род множественного числа; возможный более широкий общинный смысл пояснён в сноске.
theological_decisions:
- issue: К кому относится титул «Господь»
  choice: Господа
  alternative: Господа Иисуса; Бога
  rationale: В греческом тексте референт прямо не уточнён, поэтому перевод сохраняет исходную степень неопределённости.
- issue: Объём значения ἀδελφῶν
  choice: братьями
  alternative: братьями и сёстрами; верующими
  rationale: Основной текст сохраняет грамматическую форму источника, а возможное обозначение всей общины поясняется в примечании.
- issue: Смысл παραδοθεὶς в данном контексте
  choice: вверенный
  alternative: порученный; препорученный
  rationale: Форма допускает значение передачи под чью-либо заботу; выбранный вариант сохраняет эту образность и связь с благодатью Господа.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Оборот «отправился в путь» естественно передаёт начало путешествия; «вверенный благодати» намеренно сохраняет необычный, богословски насыщенный образ оригинала.
