  text: ἀνθρώποις παραδεδωκόσι τὰς ψυχὰς αὐτῶν ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/026.yaml
  text: men who have given up their lives for the name of our Lord Jesus the Messiah[a][b].
translation:
  language: ru
  text: людьми, которые ради имени нашего Господа Иисуса Мессии рисковали жизнью[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «предавшими свои жизни»; это греческое выражение означает, что они сознательно подвергли себя смертельной опасности.'
    reason: lexical_alternative
  - marker: b
    text: 'По-гречески: «Иисуса Христа»; слово Χριστός — титул, означающий «Мессия», то есть «Помазанник».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνθρώποις
  choice: людьми
  rationale: Форма дательного падежа согласуется с построением предыдущего стиха; речь идёт о Варнаве и Павле, поэтому русское «людьми» точно и естественно.
- source_word: παραδεδωκόσι
  choice: которые подвергали… смертельной опасности
  rationale: Перфектное причастие от παραδίδωμι буквально описывает передачу или предание жизни, но в данном сочетании означает сознательно подвергать себя опасности погибнуть. Такой перевод передаёт силу выражения, не утверждая, будто они уже умерли.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: свою жизнь
  rationale: 'Здесь ψυχή означает земную жизнь, а не нематериальную душу. Единственное число в русском естественно при распределительном значении: каждый подвергал опасности собственную жизнь.'
- source_word: ὑπὲρ
  choice: ради
  rationale: Предлог с родительным выражает причину и преданность делу; «ради» естественно передаёт значение «за / ради» в этом контексте.
- source_word: τοῦ ὀνόματος
  choice: имени
  rationale: Сохранён библейский образ «имени», включающий личность, власть и честь Иисуса; более пояснительный перевод сузил бы смысл.
- source_word: τοῦ κυρίου ἡμῶν
  choice: нашего Господа
  rationale: «Господь» сохраняет обычное новозаветное обращение и христологический вес титула; порядок слов соответствует современному литературному русскому.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός здесь остаётся титулом со значением «Мессия», а не фамилией или частью личного имени. Русская форма «Иисуса Мессии» сохраняет это значение.
theological_decisions:
- issue: Смысл παραδεδωκόσι τὰς ψυχὰς αὐτῶν
  choice: подвергали свою жизнь смертельной опасности
  alternative: предавшие свои жизни
  rationale: Греческое выражение сильнее простого «рисковали», но не обязательно означает фактическую смерть. Выбранный вариант сохраняет готовность встретить смертельную опасность, не снимая напряжения и не утверждая лишнего.
- issue: Передача Χριστοῦ в титульной последовательности
  choice: Мессии
  alternative: Христа
  rationale: Χριστός означает «Помазанник», то есть «Мессия», и в данном официальном титуле сохраняет смысл титула. Вариант «Христос» традиционен, но для многих современных читателей воспринимается скорее как часть имени.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Формулировка остаётся частью предложения, начатого в предыдущем стихе. Выражение «ради имени» намеренно сохранено как ёмкий библейский оборот; буквальность παραδίδωμι вынесена в примечание.
