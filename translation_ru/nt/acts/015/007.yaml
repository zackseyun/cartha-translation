  text: πολλῆς δὲ ⸀ζητήσεως γενομένης ἀναστὰς Πέτρος εἶπεν πρὸς αὐτούς· Ἄνδρες ἀδελφοί, ὑμεῖς ἐπίστασθε ὅτι ἀφ’ ἡμερῶν ἀρχαίων ⸂ἐν ὑμῖν ἐξελέξατο ὁ θεὸς⸃ διὰ τοῦ στόματός μου ἀκοῦσαι τὰ ἔθνη τὸν λόγον τοῦ εὐαγγελίου καὶ πιστεῦσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/007.yaml
  text: And after much debate had taken place[a], Peter stood up and said to them, “Brothers[c][b], you know that from ancient days God chose among you that through my mouth the Gentiles should hear the word of the gospel and believe.”
translation:
  language: ru
  text: 'После долгого обсуждения Пётр встал и сказал им: «Братья[a], вы знаете, что уже давно[b] Бог избрал среди вас меня, чтобы через мои уста язычники[c] услышали слово Евангелия и уверовали».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мужи братья». Это обращение имеет форму мужского рода, но могло употребляться как принятое обращение к собранию или его представителям.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от древних дней»; возможно также: «с первых дней».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «народы». Здесь имеются в виду нееврейские народы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῆς ... ζητήσεως γενομένης
  choice: после долгого обсуждения
  rationale: Родительный абсолют обозначает предшествующее обстоятельство. «Обсуждение» передаёт серьёзное разбирательство и расхождение мнений, не усиливая без необходимости оттенок враждебного спора.
- source_word: ἀναστὰς
  choice: встал
  rationale: Конкретно и естественно передаёт действие Петра перед его речью.
- source_word: Ἄνδρες ἀδελφοί
  choice: братья
  rationale: Это обычное обращение к членам общины. «Братья» сохраняет форму мужского рода и семейный оттенок, тогда как буквальное «мужи братья» в современном русском звучит неестественно.
- source_word: ἐπίστασθε
  choice: вы знаете
  rationale: Прямо передаёт знание, уже имеющееся у слушателей.
- source_word: ἀφ’ ἡμερῶν ἀρχαίων
  choice: уже давно
  rationale: В контексте речь идёт о более раннем, известном собранию событии, а не о глубокой древности; выражение естественно по-русски. Более буквальная форма отмечена в сноске.
- source_word: ἐν ὑμῖν ἐξελέξατο ὁ θεός
  choice: Бог сделал выбор среди вас
  rationale: Греческий текст не выражает отдельного прямого дополнения «меня». Такая формулировка сохраняет связь выбора с Петром, раскрываемую словами «через мои уста», но не добавляет отсутствующее местоимение.
- source_word: διὰ τοῦ στόματός μου
  choice: через мои уста
  rationale: Сохраняет яркий греческий образ Петра как того, через чью речь прозвучала весть.
- source_word: τὰ ἔθνη
  choice: язычники
  rationale: В контексте Иерусалимского собора имеются в виду нееврейские народы. «Язычники» ясно передаёт это противопоставление; более широкое значение указано в сноске.
- source_word: τὸν λόγον τοῦ εὐαγγελίου
  choice: слово Евангелия
  rationale: Сохраняет формальную структуру выражения Луки и остаётся понятным в современном литературном русском.
- source_word: πιστεῦσαι
  choice: уверовать
  rationale: Передаёт вступление в веру после слышания Евангелия и естественно сочетается с библейским контекстом, не добавляя объекта веры, которого здесь нет.
theological_decisions:
- issue: Мужское обращение Ἄνδρες ἀδελφοί к собранию
  choice: Братья
  alternative: Мужи братья; братья и сёстры
  rationale: Основной текст сохраняет грамматически мужскую форму и общинно-родственный характер обращения. Возможная более широкая представленность аудитории отмечена в сноске, а не внесена в текст.
- issue: Не выраженный прямо объект глагола ἐξελέξατο
  choice: Бог сделал выбор среди вас
  alternative: Бог избрал среди вас меня
  rationale: Контекст ясно связывает выбор с Петром, однако местоимения «меня» в греческом тексте нет. Выбранная конструкция сохраняет эту эллиптичность и не превращает контекстуальный вывод в явное содержание текста.
- issue: Значение τὰ ἔθνη в контексте принятия неевреев
  choice: язычники
  alternative: народы
  rationale: Вопрос собора касается участия неевреев в Божьем народе; «язычники» сохраняет существенное для отрывка различие между евреями и неевреями.
translation_notes:
  register: Современный литературный русский с достоинством публичной апостольской речи. Синтаксис сделан естественным для чтения вслух; сохранены образ «через мои уста», термин «Евангелие» и эллиптичность фразы о Божьем выборе.
