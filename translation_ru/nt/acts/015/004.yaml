    rationale: Конструкция «их приняли церковь, апостолы и пресвитеры» менее плавна для современного литературного русского, чем «церковь, апостолы и старейшины приняли их».
  - severity: low
    issue: Термин «пресвитеры» стилистически и конфессионально маркирован.
    rationale: Хотя термин этимологически точен, «старейшины» — привычное нейтральное русское библейское соответствие πρεσβύτεροι и яснее обозначает признанных руководителей общины.
  - severity: low
    issue: Сноска называет «вместе с ними» буквальным соответствием.
    rationale: Непосредственное русское соответствие греческому μετ’ αὐτῶν — «с ними»; «вместе с ними» является естественным основным переводом, но сноску точнее сформулировать как «Греч. “с ними”».
