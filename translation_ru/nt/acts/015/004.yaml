revisions:
- from: Когда они прибыли в Иерусалим, их приняли церковь, апостолы и пресвитеры. Они рассказали обо всём, что Бог совершил вместе с ними.[a]
  to: Когда они прибыли в Иерусалим, церковь, апостолы и старейшины приняли их, и они рассказали обо всём, что Бог совершил вместе с ними.[a]
  rationale: Правка улучшает естественность русской фразы и заменяет стилистически маркированное «пресвитеры» на нейтральное библейское «старейшины». Союз «и» явно передаёт связь, выраженную τε. Формулировка «Бог совершил вместе с ними» и сноска сохраняют многозначность μετ’ αὐτῶν, не навязывая инструментального или локативного истолкования.
