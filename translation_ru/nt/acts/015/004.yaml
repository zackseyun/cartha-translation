  yaml_path: translation/nt/acts/015/004.yaml
  text: When they arrived in Jerusalem[a], they were welcomed by the church and the apostles and the elders, and they reported all that God had done with them.
translation:
  language: ru
  text: Когда они прибыли в Иерусалим, церковь, апостолы и старейшины приняли их, и они рассказали обо всём, что Бог совершил вместе с ними.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «что Бог совершил через них» или «что Бог совершил среди них». Греч. «с ними».'
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενοι δὲ εἰς Ἱεροσόλυμα
  choice: Когда они прибыли в Иерусалим
  rationale: Аористное причастие задаёт обстоятельство времени, предшествующее основным действиям; эта конструкция естественно передаётся придаточным времени. Слабая связка δέ отдельно не выражена.
- source_word: παρεδέχθησαν ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων
  choice: их приняли церковь, апостолы и пресвитеры
  rationale: Глагол обозначает благожелательный приём. Активная русская конструкция звучит естественнее пассивной и сохраняет все три названные группы.
- source_word: ἐκκλησίας
  choice: церковь
  rationale: В данном контексте речь идёт о местной общине верующих; слово «церковь» является обычным и понятным русским соответствием.
- source_word: πρεσβυτέρων
  choice: пресвитеры
  rationale: В церковном контексте слово обозначает признанных руководителей общины, а не просто пожилых мужчин. «Пресвитеры» точно передаёт термин, не уточняя устройство служения сверх текста.
- source_word: ἀνήγγειλάν τε ὅσα
  choice: Они рассказали обо всём
  rationale: ἀναγγέλλω здесь означает сообщить или поведать о произошедшем; отдельное предложение делает русский текст ясным, а ὅσα передано как «обо всём».
- source_word: ὁ θεὸς ἐποίησεν
  choice: Бог совершил
  rationale: Широкое значение ποιέω сохранено глаголом «совершил», уместным для описания Божьих деяний и не добавляющим конкретики.
- source_word: μετ’ αὐτῶν
  choice: вместе с ними
  rationale: μετά с родительным падежом буквально выражает совместность. Такой перевод сохраняет открытую формулировку и не сводит её исключительно к значению «через них» или «среди них».
theological_decisions:
- issue: Характер участия Павла и Варнавы в Божьем действии, выраженный μετ’ αὐτῶν
  choice: Бог совершил вместе с ними
  alternative: Бог совершил через них / Бог совершил среди них
  rationale: Основным действующим лицом остаётся Бог, а миссионеры связаны с Его действием. Буквальная совместность сохраняет богословскую сдержанность и многозначность греческой фразы.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис разделён на два предложения ради естественности; содержание и последовательность греческого текста сохранены.
