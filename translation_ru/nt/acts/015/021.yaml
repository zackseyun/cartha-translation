    reason: lexical_alternative
lexical_decisions:
- source_word: Μωϋσῆς
  choice: Моисей
  rationale: Общепринятая русская форма имени; личное имя сохранено, как в греческом тексте.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительно-обосновывающую связь с предшествующим суждением естественно для современного русского языка.
- source_word: ἐκ γενεῶν ἀρχαίων
  choice: с давних времён
  rationale: Естественно передаёт временное значение идиомы и подчёркивает давность установившейся практики; буквальное «с древних поколений» по-русски звучит неестественно.
- source_word: κατὰ πόλιν
  choice: в каждом городе
  rationale: Передаёт распределительное значение κατά с существительным в единственном числе.
- source_word: τοὺς κηρύσσοντας αὐτὸν
  choice: те, кто возвещает Моисея
  rationale: «Возвещает» сохраняет значение публичного провозглашения у κηρύσσω, а прямое упоминание Моисея удерживает исходную метонимию, не подменяя её толкованием.
- source_word: ἔχει
  choice: есть
  rationale: В русской безлично-локативной конструкции естественно выражает продолжающееся наличие возвещающих; временная протяжённость уже обозначена словами «с давних времён».
- source_word: ἐν ταῖς συναγωγαῖς
  choice: в синагогах
  rationale: Точно и естественно обозначает обычное место публичного чтения.
- source_word: κατὰ πᾶν σάββατον
  choice: каждую субботу
  rationale: Передаёт регулярную повторяемость распределительного оборота.
- source_word: ἀναγινωσκόμενος
  choice: его читают
  rationale: Русская неопределённо-личная конструкция естественно передаёт пассивный смысл причастия и сохраняет местоименную отсылку к Моисею.
theological_decisions:
- issue: Метонимическое употребление имени Моисея
  choice: Сохранить «Моисея» и «его» в основном тексте.
  alternative: Заменить на «закон Моисея» или «писания Моисея».
  rationale: Греческий текст прямо называет Моисея и говорит о его возвещении и чтении, метонимически подразумевая связанные с ним писания или закон. Сохранение этой формы не вносит уточнение, отсутствующее в источнике.
- issue: Связь причастия ἀναγινωσκόμενος с первой частью стиха
  choice: Передать отдельной поясняющей частью после двоеточия, не вводя явного причинного союза.
  alternative: «Поскольку его читают…» или «когда его читают…».
  rationale: Причастие допускает смысловую связь с предшествующим утверждением, но греческий текст не выражает её отдельным причинным или временным союзом; двоеточие сохраняет пояснительность без чрезмерного уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формулировка сохраняет необычную для современного читателя метонимию оригинала, разъясняя её в сноске; буквальный, но неестественный оборот «с древних поколений» заменён идиоматическим «с давних времён».
