  source_fidelity: 'Смысл в целом передан верно: речь о людях, вышедших из среды отправителей, которые своими словами вызвали смятение у адресатов, не имея на это указаний. Однако «мы же им ничего не поручали» передаёт διαστέλλομαι менее точно: это глагол распоряжения/указания, а не поручения или задания. Перестройка с деепричастием ясно связывает отсутствие указаний именно с этими людьми, не вводя отсутствующего в греческом уступительного союза.'
  naturalness: «Некоторые из нашей среды, выйдя от нас» и «встревожили вас своими словами» звучат естественно в современном литературном русском. «Привели ваши души в смятение» сохраняет библейски уместный регистр и различает два близких, но не тождественных действия греческого текста.
