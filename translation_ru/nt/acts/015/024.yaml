  text: ἐπειδὴ ἠκούσαμεν ὅτι τινὲς ἐξ ἡμῶν ⸀ἐξελθόντες ἐτάραξαν ὑμᾶς λόγοις ἀνασκευάζοντες τὰς ψυχὰς ⸀ὑμῶν οἷς οὐ διεστειλάμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/024.yaml
  text: Since we have heard that some went out from us and troubled you with words[a], unsettling your souls, to whom we gave no instructions[b],
translation:
  language: ru
  text: Поскольку мы услышали, что некоторые из нашей среды, выйдя от нас, встревожили вас своими словами и привели ваши души[a] в смятение, не получив от нас никаких указаний[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. «души»; здесь имеются в виду люди в их внутренней жизни, а не только их эмоции.
    reason: lexical_clarification
  - marker: b
    text: 'Или: «не получив от нас повеления»; букв. «которым мы не давали указаний».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: Поскольку
  rationale: Передаёт причинное основание последующего заявления и естественно звучит в современном русском письменно-повествовательном стиле.
- source_word: ἠκούσαμεν
  choice: мы услышали
  rationale: Простой прошедший вид естественно передаёт получение сообщения, последствия которого актуальны для письма.
- source_word: τινὲς ἐξ ἡμῶν ἐξελθόντες
  choice: некоторые, выйдя от нас
  rationale: Сохраняет и происхождение этих людей из иерусалимской среды, и сам факт их ухода, не превращая ἐξ ἡμῶν в утверждение о полном представительстве общины.
- source_word: ἐτάραξαν
  choice: смутили
  rationale: Передаёт причинённое беспокойство и внутреннее замешательство в краткой и достойной русской форме.
- source_word: λόγοις
  choice: своими словами
  rationale: Сохраняет инструментальное значение дательного падежа и не уточняет содержание сказанного сверх греческого текста.
- source_word: ἀνασκευάζοντες
  choice: привели … в смятение
  rationale: Передаёт здесь значение глубокого расстройства и дестабилизации, не навязывая буквальный образ разрушения или опустошения.
- source_word: τὰς ψυχὰς ὑμῶν
  choice: ваши души
  rationale: Сохраняет лексическую прозрачность ψυχή и указывает на внутреннее существо людей, а не только на их эмоции.
- source_word: οἷς οὐ διεστειλάμεθα
  choice: мы же им ничего не поручали
  rationale: Ясно отрицает выдачу этим людям поручения или полномочий; самостоятельная русская конструкция устраняет неясность местоименной связи, не добавляя причинного или уступительного союза.
theological_decisions:
- issue: Следует ли прямо обозначить отсутствие полномочий от иерусалимской общины
  choice: мы же им ничего не поручали
  alternative: которым мы не давали никаких указаний / мы им этого не повелевали
  rationale: Греческий текст прямо отрицает, что эти люди получили соответствующее распоряжение. Перевод сохраняет этот институционально значимый смысл, но не добавляет сведений о статусе самих людей.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достойным тоном соборного письма. Тире отмечают вставное уточнение об отсутствии поручения и сохраняют незавершённость синтаксиса стиха, продолжающегося далее.
