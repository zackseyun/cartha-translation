revisions:
- from: Поскольку мы услышали, что некоторые, выйдя от нас, смутили вас своими словами и привели ваши души[a] в смятение, — мы же им ничего не поручали[b], —
  to: Поскольку мы услышали, что некоторые из нашей среды, выйдя от нас, встревожили вас своими словами и привели ваши души[a] в смятение, не получив от нас никаких указаний[b],
  rationale: Исправлено неточное «поручали» на «указания» и устранена вставная конструкция с «же», которая вносила дополнительный контраст. Деепричастный оборот «не получив от нас» естественно по-русски выражает греческое относительное определение и однозначно соотносится с упомянутыми людьми. Сноска к «душам» смягчена, чтобы не навязывать спорное лексическое ограничение.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:50:13Z'
