  text: ἀλλὰ διὰ τῆς χάριτος τοῦ κυρίου Ἰησοῦ πιστεύομεν σωθῆναι καθ’ ὃν τρόπον κἀκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/011.yaml
  text: But through the grace of the Lord Jesus we believe that we will be saved[b][a], just as they also will be.
translation:
  language: ru
  text: Но мы верим, что спасёмся благодатью Господа Иисуса — точно так же, как и они.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «верим спастись благодатью Господа Иисуса таким же образом, как и они». В греческом тексте время спасения и глагол при словах «и они» прямо не выражены.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт сильное противопоставление предыдущему утверждению о непосильном иге и естественно звучит по-русски.
- source_word: διὰ τῆς χάριτος
  choice: благодатью
  rationale: Творительный падеж естественно передаёт значение средства у διά с родительным, не ослабляя роли благодати в спасении.
- source_word: χάριτος
  choice: благодать
  rationale: Устоявшееся и точное обозначение незаслуженной Божьей милости, действующей ко спасению.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Господа Иисуса
  rationale: Родительный падеж связывает благодать с Господом Иисусом как с её источником; титул κύριος передан традиционно и ясно.
- source_word: πιστεύομεν
  choice: мы верим
  rationale: Передаёт убеждённость говорящих и вводит содержание веры без добавления не выраженных в тексте понятий.
- source_word: σωθῆναι
  choice: что спасёмся
  rationale: Личная форма естественна в современном русском; будущее время соответствует контексту ожидаемого окончательного спасения, тогда как буквальная инфинитивная конструкция отмечена в сноске.
- source_word: καθ’ ὃν τρόπον
  choice: точно так же, как
  rationale: Ясно и естественно передаёт сравнение по образу или способу.
- source_word: κἀκεῖνοι
  choice: и они
  rationale: 'Сохраняет καί («и/также») и направление сравнения: «мы» спасаемся так же, как «они»; отсутствующий глагол не добавляется в основной текст.'
theological_decisions:
- issue: Направление сравнения в словах Петра
  choice: Спасение «нас», то есть верующих из иудеев, сопоставлено со спасением «их», то есть язычников.
  alternative: «Они спасутся так же, как и мы».
  rationale: Греческий порядок и синтаксис ставят «мы» субъектом πιστεύομεν и сравнивают способ нашего спасения с их спасением. Это сохраняет значимый для контекста акцент, не требующий от язычников сначала стать иудеями.
- issue: Спасение благодатью
  choice: Спасение совершается благодатью Господа Иисуса.
  alternative: Расширить формулировку позднейшими конфессиональными выражениями о соотношении веры, благодати и дел.
  rationale: Перевод передаёт прямо сказанное в стихе и не добавляет богословских формул, отсутствующих в исходном тексте.
- issue: Временная отнесённость σωθῆναι
  choice: В основном тексте употреблено будущее «спасёмся».
  alternative: «Спасаемся» или буквальное «верим спастись».
  rationale: Инфинитив сам по себе не маркирует время так же, как русская личная форма, однако контекст и традиционное понимание допускают ожидаемое спасение. Формальная неоднозначность исходной конструкции сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской речи. Формулировка проста для чтения вслух; тире подчёркивает неожиданное направление сравнения. Архаизмы вроде «благодатию» и тяжеловесное «посредством благодати» не использованы.
