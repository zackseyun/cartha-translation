  text: Therefore we have sent Judas and Silas[b][a], who themselves will report the same things by word of mouth.
translation:
  language: ru
  text: Итак, мы послали Иуду и Силу, которые и сами устно сообщат то же самое.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «через» или «посредством слова»; то есть устно, наряду с письмом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεστάλκαμεν
  choice: мы послали
  rationale: Русское прошедшее время естественно передаёт совершившуюся отправку; актуальность её результата ясна из контекста письма, тогда как буквальное воспроизведение греческого перфекта по-русски было бы неестественным.
- source_word: οὖν
  choice: Итак
  rationale: Выражает вывод и переход от принятого решения к отправке представителей.
- source_word: Ἰούδαν καὶ Σιλᾶν
  choice: Иуду и Силу
  rationale: Использованы устойчивые русские формы библейских имён в винительном падеже.
- source_word: καὶ αὐτοὺς
  choice: которые и сами
  rationale: 'Сохраняет усилительный оттенок αὐτούς: посланники лично подтвердят содержание письма.'
- source_word: διὰ λόγου
  choice: на словах
  rationale: Естественное русское выражение для устного сообщения, противопоставленного письменному посланию.
- source_word: ἀπαγγέλλοντας
  choice: сообщат
  rationale: Причастие передано личной формой будущего времени, естественно обозначающей предстоящее действие посланников.
- source_word: τὰ αὐτά
  choice: то же самое
  rationale: Прямо сохраняет отсылку к содержанию письменного решения, не заменяя её более толковательным словом «весть» или «решение».
