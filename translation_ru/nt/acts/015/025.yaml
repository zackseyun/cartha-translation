lexical_decisions:
- source_word: ἔδοξεν ἡμῖν
  choice: мы… сочли нужным
  rationale: Естественно передаёт коллективное взвешенное решение, не усиливая его до приказа или безусловного властного постановления.
- source_word: γενομένοις ὁμοθυμαδόν
  choice: придя к единодушию
  rationale: Сохраняет как идею достигнутого согласия, выраженную причастием γενομένοις, так и значение единодушия в ὁμοθυμαδόν.
- source_word: ἐκλεξαμένοις ἄνδρας
  choice: избрать мужей
  rationale: Русский инфинитив естественно включается в конструкцию «сочли нужным… избрать и послать»; «мужей» точно отражает указание на взрослых мужчин.
- source_word: πέμψαι πρὸς ὑμᾶς
  choice: послать их к вам
  rationale: Местоимение «их» ясно отсылает к избранным мужам и делает русскую фразу естественной.
- source_word: σὺν τοῖς ἀγαπητοῖς ἡμῶν
  choice: вместе с нашими возлюбленными
  rationale: Передаёт сопровождение, теплоту и достоинство обращения без ослабления ἀγαπητοῖς.
- source_word: Βαρναβᾷ καὶ Παύλῳ
  choice: Варнавой и Павлом
  rationale: Использованы традиционные русские формы библейских имён в требуемом творительном падеже.
theological_decisions:
- issue: Коллективный совещательный тон письма Иерусалимского собрания
  choice: мы… сочли нужным
  alternative: мы решили
  rationale: Выбранная формулировка сохраняет оттенок совместного одобрения и рассуждения в ἔδοξεν ἡμῖν, не приписывая фразе более категоричную властность, чем выражено в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством официального письма. Начальное «то» сохраняет синтаксическую связь с предшествующим стихом; конечная запятая указывает на продолжение предложения в следующем стихе.
