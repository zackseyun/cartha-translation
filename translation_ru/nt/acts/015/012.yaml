    text: 'Или: «среди народов». Здесь, в контексте Иерусалимского собора, под «народами» подразумеваются язычники, то есть неевреи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐσίγησεν
  choice: умолкло
  rationale: Аорист передаёт наступление тишины как событие; «умолкло» естественно и сохраняет динамику повествования.
- source_word: πᾶν τὸ πλῆθος
  choice: всё собрание
  rationale: В контексте совещания в Иерусалиме речь идёт о собравшихся участниках; «собрание» точнее передаёт обстановку, чем «толпа».
- source_word: ἤκουον
  choice: стало слушать
  rationale: Имперфект выражает продолжающееся внимательное слушание; сочетание с «умолкло» естественно описывает переход к этому действию.
- source_word: Βαρναβᾶ καὶ Παύλου
  choice: Варнаву и Павла
  rationale: Имена переданы в принятой русской библейской форме и поставлены в винительный падеж при глаголе «слушать».
- source_word: ἐξηγουμένων
  choice: которые рассказывали
  rationale: Причастие означает подробное изложение или повествование; «рассказывали» не вносит оттенка истолкования, возможного у «объясняли».
- source_word: ὅσα
  choice: какие
  rationale: В сочетании с «знамения и чудеса» передаёт содержание рассказа и множественное значение греческого относительного местоимения без добавления более широкого ряда деяний.
- source_word: ἐποίησεν ὁ θεὸς
  choice: Бог совершил
  rationale: Сохраняется Бог как грамматический субъект и главный деятель; «совершил» естественно сочетается со знамениями и чудесами.
- source_word: σημεῖα καὶ τέρατα
  choice: знамения и чудеса
  rationale: Устоявшаяся и точная передача характерной для Луки пары, не требующая поясняющего добавления «чудесные».
- source_word: ἐν τοῖς ἔθνεσιν
  choice: среди язычников
  rationale: В контексте Иерусалимского собора обозначает неевреев; «язычники» — ясный и традиционный русский эквивалент, тогда как буквальное «народы» сохраняется в примечании.
- source_word: δι’ αὐτῶν
  choice: через них
  rationale: 'διά с родительным падежом обозначает посредство: Бог действует через Варнаву и Павла.'
theological_decisions:
- issue: Божественное действие в апостольской миссии
  choice: Бог представлен совершающим знамения и чудеса через Варнаву и Павла.
  alternative: Представить Варнаву и Павла главными совершителями знамений и чудес.
  rationale: ὁ θεὸς является подлежащим при ἐποίησεν, а δι’ αὐτῶν указывает на Варнаву и Павла как на посредников. Перевод сохраняет эту синтаксическую и богословскую расстановку акцентов.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для широкого читателя; традиционные термины «знамения и чудеса» и «язычники» сохранены. Маркер примечания поставлен после относящегося ко всему заключительному обороту предложения.
