  text: Παῦλος δὲ ἠξίου, τὸν ἀποστάντα ἀπ’ αὐτῶν ἀπὸ Παμφυλίας καὶ μὴ συνελθόντα αὐτοῖς εἰς τὸ ἔργον, μὴ ⸀συμπαραλαμβάνειν τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/038.yaml
  text: But Paul insisted that they should not take along this man[a], who had withdrawn from them from Pamphylia and had not gone with them to the work.
translation:
  language: ru
  text: Но Павел настаивал, чтобы не брать с собой этого человека, который ушёл от них из Памфилии[a] и не пошёл с ними на этом деле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покинул их в Памфилии». Греческое причастие означает «уйти», «отделиться»; в данном контексте оно может звучать более резко: «оставил их» или «бросил их». Два оборота с «от/из» могут обозначать как уход от спутников, так и Памфилию как место, откуда он ушёл.'
    reason: Лексическая и синтаксическая неоднозначность.
lexical_decisions:
- source_word: ἠξίου
  choice: настаивал
  rationale: Имперфект ἀξιόω в контексте разногласия выражает твёрдую позицию Павла, а не простое предпочтение.
- source_word: ἀποστάντα
  choice: покинул их
  rationale: Передаёт основное значение отделения или ухода, не усиливая его до однозначного обвинения в дезертирстве.
- source_word: ἀπ’ αὐτῶν ἀπὸ Παμφυλίας
  choice: покинул их в Памфилии
  rationale: Два оборота с ἀπό обозначают отделение от спутников и географическую точку ухода; по-русски естественно выразить последнее как место события.
- source_word: μὴ συνελθόντα αὐτοῖς
  choice: не пошёл с ними
  rationale: Естественно передаёт отсутствие дальнейшего совместного пути и участия.
- source_word: εἰς τὸ ἔργον
  choice: на дело
  rationale: Сохраняет конкретное обозначение порученного труда, не вводя более интерпретирующее слово «миссия».
- source_word: μὴ συμπαραλαμβάνειν τοῦτον
  choice: чтобы не брать с собой того
  rationale: Передаёт зависимый инфинитив с отрицанием и указательную силу τοῦτον без неестественной резкости.
