- from: Но Павел настаивал, чтобы не брать с собой того, кто покинул их в Памфилии[a] и не пошёл с ними на дело.
  to: Но Павел настаивал, чтобы не брать с собой этого человека, который ушёл от них из Памфилии[a] и не пошёл с ними на этом деле.
