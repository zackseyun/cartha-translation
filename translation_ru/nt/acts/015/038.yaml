    issue: Географический оборот в основном тексте передан как «в Памфилии».
    rationale: В греческом стоит ἀπὸ Παμφυλίας («из Памфилии»), параллельно ἀπ’ αὐτῶν («от них»). Локативный перевод возможен как сглаживание, но не сохраняет явно выраженное направление ухода.
  - severity: low
    issue: «На дело» стилистически двусмысленно в современном русском.
    rationale: Хотя буквально близко к εἰς τὸ ἔργον, фраза может ассоциироваться с криминальным «пойти на дело». «На этом деле» сохраняет смысл порученного труда и снимает эту ассоциацию.
