  source_fidelity: '«Павел настаивал» точно передаёт силу ἠξίου в контексте спора. Однако «покинул их в Памфилии» интерпретирует δεύτεое ἀπό как указание на место действия, тогда как ἀπὸ Παμφυλίας естественнее сохранить как исходный пункт ухода: «из Памфилии».'
  naturalness: Предлагаемая формулировка остаётся современной и литературной. «Ушёл от них из Памфилии» звучит естественно и не приписывает Марку более тяжёлого проступка, чем выражает основной текст.
  terminology: «На этом деле» сохраняет конкретный характер τὸ ἔργον и в данном контексте яснее, чем «на дело», которое в современном русском может вызвать нежелательную бытовую ассоциацию. Указательное «этого человека» передаёт τοῦτον без чрезмерного усиления.
  issues:
