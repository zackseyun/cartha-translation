base_translation:
  language: en
  yaml_path: translation/nt/acts/015/019.yaml
  text: Therefore I judge that we should not trouble those from among the Gentiles who are turning to God[b][a],
translation:
  language: ru
  text: Поэтому я считаю[b], что не следует создавать трудности тем из язычников, кто обращается к Богу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тем из народов, кто обращается к Богу». Здесь греческое слово «народы» обозначает неевреев, то есть язычников.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «я прихожу к выводу, что не следует создавать трудности»; возможно также: «я решаю не создавать трудностей».'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующих слов Иакова естественным современным русским союзом.
- source_word: ἐγὼ κρίνω
  choice: я считаю
  rationale: Сохраняет явно выраженное первое лицо и передаёт обдуманное суждение Иакова без излишне судебного оттенка русского «я сужу».
- source_word: μὴ παρενοχλεῖν
  choice: не следует затруднять
  rationale: Передаёт содержание решения и значение причинения затруднений; безличная конструкция естественна по-русски и не добавляет отсутствующего в греческом подлежащего «мы».
- source_word: τοῖς ἀπὸ τῶν ἐθνῶν
  choice: обращающихся … из язычников
  rationale: Сохраняет личную отнесённость к людям, происходящим из нееврейских народов, а не к народам как отвлечённой категории.
- source_word: ἐθνῶν
  choice: язычников
  rationale: В данном иудео-христианском контексте обозначает неевреев; «язычники» — понятный и традиционно точный русский эквивалент, тогда как буквальное «народы» здесь менее ясно.
- source_word: ἐπιστρέφουσιν
  choice: обращающихся
  rationale: Причастие настоящего времени передаёт происходящее обращение к Богу; русский глагол сохраняет образ перемены направления и не требует технического термина «конверсия».
- source_word: ἐπὶ τὸν θεόν
  choice: к Богу
  rationale: Естественно передаёт направленность обращения к Богу.
theological_decisions:
- issue: Личное суждение Иакова или формулировка общего решения
  choice: «я считаю, что не следует затруднять»
  alternative: «я считаю, что нам не следует затруднять» / «я решаю не затруднять»
  rationale: Греческий текст прямо сохраняет личное ἐγὼ κρίνω, но инфинитивная конструкция не называет деятеля. Безличное «не следует» выражает практическую рекомендацию собранию, не добавляя местоимения «мы» и не сводя её к частному действию одного Иакова.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной речи. Формулировка близка к греческому синтаксису, но избегает неестественного «я сужу» и сохраняет неоднозначность подразумеваемого деятеля при инфинитиве.
