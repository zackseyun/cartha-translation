  naturalness: Фраза с тире («благую весть — слово Господа») тяжеловесна и семантически неудачна. Перестройка с личными формами глаголов делает современный литературный русский яснее и естественнее.
  terminology: «Павел», «Варнава», «Антиохия», «Господь» и устойчивое для Деяний «слово Господа» переданы верно. «Возвещали» уместно передаёт εὐαγγελιζόμενοι в данном контексте; отдельное добавление «благая весть» не требуется, поскольку прямой объект в греческом — «слово Господа».
