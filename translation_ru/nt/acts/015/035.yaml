  to: А Павел и Варнава оставались в Антиохии[a]. Вместе со многими другими они учили слову Господа[c] и возвещали его[b].
  rationale: Перевод перестроен так, чтобы «вместе со многими другими» ясно относилось к обоим видам служения, а «слово Господа» оставалось содержанием как учения, так и возвещения. Местоимение «его» во второй части не добавляет нового референта, а по-русски естественно воспроизводит единый греческий объект. Сноски сохранены; маркеры перенесены к соответствующим словам.
