  text: Παῦλος δὲ καὶ Βαρναβᾶς διέτριβον ἐν Ἀντιοχείᾳ διδάσκοντες καὶ εὐαγγελιζόμενοι μετὰ καὶ ἑτέρων πολλῶν τὸν λόγον τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/035.yaml
  text: But Paul and Barnabas stayed in Antioch[a], teaching and proclaiming the good news of the word of the Lord[c][b], with many others also.
translation:
  language: ru
  text: А Павел и Варнава оставались в Антиохии[a]. Вместе со многими другими они учили слову Господа[c] и возвещали его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проводили время в Антиохии». Греческий глагол подчёркивает, что они оставались там некоторое время.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «проповедовали Евангелие». Греческий глагол означает возвещать добрую весть.'
    reason: lexical_alternative
  - marker: c
    text: '«Слово Господа» — обычное для книги Деяний обозначение Господней вести; возможен перевод: «весть Господа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβον
  choice: оставались
  rationale: Имперфект передаёт продолжительное пребывание в Антиохии; «оставались» естественно выражает длительность, не уточняя её меру.
- source_word: διδάσκοντες
  choice: уча
  rationale: Деепричастие сохраняет сопутствующее и продолжающееся действие по отношению к пребыванию Павла и Варнавы.
- source_word: εὐαγγελιζόμενοι
  choice: возвещая благую весть
  rationale: Передаёт смысл объявления доброй вести ясным современным языком, не сводя глагол к узкому церковному термину.
- source_word: μετὰ καὶ ἑτέρων πολλῶν
  choice: вместе со многими другими
  rationale: 'Сохраняет смысл совместного служения и добавочную силу καί: помимо Павла и Варнавы участвовали многие другие.'
- source_word: τὸν λόγον
  choice: слово
  rationale: Сохраняет характерное для Деяний выражение «слово Господа» и литературную связь с другими его употреблениями; тире ясно показывает, что это содержание благой вести.
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: Титул κύριος передан традиционным и нейтральным «Господь» без уточнения референта сверх сказанного в греческом тексте.
theological_decisions:
- issue: Кого обозначает «Господь» в выражении «слово Господа»
  choice: Сохранено нейтральное «Господа» без дополнительного уточнения.
  alternative: «слово Господа Иисуса» либо более общее «Божья весть»
  rationale: В Деяниях κύριος нередко относится к Иисусу, однако сам стих не даёт имени и не требует снять возможную смысловую широту титула.
- issue: Связь «слова Господа» с обучением и возвещением благой вести
  choice: Тире оформляет «слово Господа» как содержание возвещаемой благой вести, не исключая его связи с обучением.
  alternative: «уча слову Господа и возвещая его как благую весть»
  rationale: Греческий общий объект следует после двух причастий и может относиться к обоим; более развёрнутый вариант искусственно распределил бы объект и добавил отсутствующие местоимения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Благая весть» понятнее широкой аудитории, чем исключительно церковное «Евангелие», а «слово Господа» сохраняет устойчивую лексику Деяний. Порядок слов перестроен для естественного русского синтаксиса; «вместе со многими другими» поставлено перед вторым деепричастием, при этом фраза не утверждает, будто другие участвовали только в возвещении, а не в учении.
