  yaml_path: translation/nt/acts/015/030.yaml
  text: So[a], after being sent off, they went down to Antioch, and after gathering the multitude[c][b], they delivered the letter.
translation:
  language: ru
  text: Итак, когда их отпустили[a], они спустились[b] в Антиохию и, собрав общину[c], передали письмо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будучи отпущены» или «после того как их отослали». Греческое причастие может обозначать официальное отпущение или отправление.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сошли». Глагол указывает на движение вниз — вероятно, из расположенного выше Иерусалима в Антиохию.'
    reason: cultural_note
  - marker: c
    text: 'Или: «множество» или «собрание». В контексте речь, вероятно, идёт о собранной группе верующих в Антиохии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολυθέντες
  choice: получив разрешение отправиться в путь
  rationale: Причастие указывает на то, что посланники были официально отпущены после собрания в Иерусалиме. Формулировка естественна по-русски и сохраняет оттенок разрешённого отправления, не добавляя прямо отсутствующего в слове значения «посланы».
- source_word: κατῆλθον
  choice: спустились
  rationale: Глагол сохраняет направительное значение движения вниз, соответствующее пути из расположенного выше Иерусалима в Антиохию.
- source_word: συναγαγόντες
  choice: собрали
  rationale: Аористное причастие обозначает действие, предшествующее передаче письма; русский деепричастный оборот здесь был бы менее плавным, поэтому последовательность передана личными глаголами.
- source_word: τὸ πλῆθος
  choice: всех верующих
  rationale: В контексте речь идёт о собранной общине в Антиохии. «Всех верующих» понятно современному читателю и передаёт коллективный референт, тогда как буквальное «множество» по-русски звучало бы неестественно; уточнение вынесено в сноску как контекстуальное.
- source_word: ἐπέδωκαν
  choice: передали
  rationale: Глагол обозначает вручение или официальную передачу письма собравшимся; «передали» естественно и точно в данном контексте.
- source_word: ἐπιστολήν
  choice: письмо
  rationale: Обычный современный русский эквивалент без излишне церковного оттенка слова «послание».
