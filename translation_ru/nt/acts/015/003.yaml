  text: οἱ μὲν οὖν προπεμφθέντες ὑπὸ τῆς ἐκκλησίας διήρχοντο τήν ⸀τε Φοινίκην καὶ Σαμάρειαν ἐκδιηγούμενοι τὴν ἐπιστροφὴν τῶν ἐθνῶν, καὶ ἐποίουν χαρὰν μεγάλην πᾶσι τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/003.yaml
  text: So then[a], having been sent on their way by the church, they passed through both Phoenicia and Samaria, describing in detail the conversion of the Gentiles[b], and they brought great joy to all the brothers.
translation:
  language: ru
  text: Итак, отправленные церковью в путь, они проходили и через Финикию, и через Самарию, подробно рассказывая об обращении язычников[a] и доставляя великую радость всем братьям[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «о повороте язычников».'
    reason: lexical_alternative
  - marker: b
    text: Слово «братья» здесь, вероятно, относится ко всем верующим, включая женщин.
    reason: lexical_alternative
lexical_decisions:
- source_word: προπεμφθέντες
  choice: церковь помогла им отправиться в путь
  rationale: Передаёт дорожный оттенок προπέμπω — община не просто послала их, а содействовала их дальнейшему пути, — не уточняя, шла ли речь о сопровождении или материальном обеспечении.
- source_word: ἐκκλησίας
  choice: церковь
  rationale: В контексте Деяний слово обозначает местную христианскую общину; «церковь» — естественный и устоявшийся русский эквивалент.
- source_word: διήρχοντο
  choice: они прошли через
  rationale: Передаёт продолжительное путешествие через названные области и естественно звучит в повествовании.
- source_word: τήν τε Φοινίκην καὶ Σαμάρειαν
  choice: через Финикию и Самарию
  rationale: Союзная конструкция тесно связывает обе области; в русском простое «и» выражает это естественнее, чем тяжеловесное «как… так и».
- source_word: ἐκδιηγούμενοι
  choice: подробно рассказывая
  rationale: 'Сохраняет усиленный смысл глагола: они не просто упоминали событие, а обстоятельно о нём рассказывали.'
- source_word: τὴν ἐπιστροφὴν τῶν ἐθνῶν
  choice: об обращении язычников
  rationale: «Обращение» ясно передаёт религиозный поворот к Богу, а «язычники» в данном контексте обозначает неевреев; буквальная образность поворота отмечена в сноске.
- source_word: ἐποίουν χαρὰν μεγάλην
  choice: доставили великую радость
  rationale: Естественно передаёт причинное значение греческого оборота ποιέω с существительным, сохраняя выраженную степень радости.
- source_word: πᾶσι τοῖς ἀδελφοῖς
  choice: всем братьям
  rationale: Сохраняет грамматически мужскую форму исходного текста; вероятный более широкий круг верующих, включая женщин, пояснён в сноске.
theological_decisions:
- issue: Значение ἐπιστροφή применительно к включению язычников
  choice: обращение
  alternative: поворот
  rationale: «Обращение» понятно обозначает их поворот к Богу вследствие благовестия, не уточняя сверх текста ни порядок, ни внутренний механизм этого события; буквальный вариант сохраняется в примечании.
- issue: Объём значения ἀδελφοί в христианской общине
  choice: братья
  alternative: братья и сёстры / верующие
  rationale: Основной текст сохраняет мужскую форму источника, а сноска сообщает, что в данном контексте слово, вероятно, охватывает всех единоверцев, включая женщин.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для русского: пассивный причастный оборот преобразован в личную конструкцию, при этом связь действия с церковью и оттенок содействия дальнейшему пути сохранены.'
