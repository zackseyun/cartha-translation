    rationale: Форма «впервые» может утверждать, что это было первым вообще обращением Бога к язычникам, тогда как в речи Иакова πρῶτον естественно обозначает первоначальный этап описываемого события. «Сначала» сохраняет последовательностный смысл.
  - severity: medium
    issue: «обратил внимание на» для ἐπεσκέψατο
    rationale: Это выражение передаёт лишь внимание и утрачивает оттенок действенного посещения/вмешательства; кроме того, связь с целью «чтобы взять» становится слабой. «Посетил» сохраняет традиционный и исходный образ.
  - severity: medium
    issue: «народ для Своего имени» для τῷ ὀνόματι αὐτοῦ
    rationale: В современном русском конструкция звучит неясно и может быть понята как цель ради имени. «Народ, носящий Его имя» ясно передаёт принадлежность и идентификацию, сохраняя образ имени.
