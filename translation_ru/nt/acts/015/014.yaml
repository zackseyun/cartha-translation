  verdict: revise
  source_fidelity: «Впервые» чрезмерно легко воспринимается как утверждение о первом в истории обращении Бога к язычникам; πρῶτον здесь отмечает первоначальный этап описываемого действия. «Обратил внимание на» ослабляет деятельный смысл ἐπεσκέψατο и плохо сочетается с последующим целевым «чтобы взять». Формула «для Своего имени» буквальна, но по-русски не вполне ясно передаёт принадлежность народа Божьему имени.
  naturalness: Исправленный вариант сохраняет современный литературный строй, но оставляет уместную библейскую торжественность. «Посетил» — устойчивая библейская передача Божьего целенаправленного обращения; «носящий Его имя» естественно выражает смысл заключительной формулы.
  terminology: Сохранены «Симеон» и «язычники» согласно греческой форме имени и контекстуальному значению ἔθνη. «Народ» передаёт λαός без этнического сужения. «Носящий Его имя» передаёт τῷ ὀνόματι αὐτοῦ без конфессионального истолкования.
