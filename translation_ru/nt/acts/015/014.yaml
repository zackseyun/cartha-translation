  text: Συμεὼν ἐξηγήσατο καθὼς πρῶτον ὁ θεὸς ἐπεσκέψατο λαβεῖν ἐξ ἐθνῶν ⸀λαὸν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/014.yaml
  text: Simeon has recounted how God first visited the Gentiles to take from them a people for his name[a][b][c].
translation:
  language: ru
  text: Симеон рассказал, как Бог сначала посетил язычников, чтобы взять из них народ, носящий Его имя[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Симон». Здесь Иаков употребляет форму имени «Симеон».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из народов».'
    reason: lexical_alternative
  - marker: c
    text: То есть народ, принадлежащий Богу и связанный с Его именем.
    reason: cultural_note
lexical_decisions:
- source_word: Συμεὼν
  choice: Симеон
  rationale: Сохранена именно форма имени, употреблённая Иаковом в этом стихе, без унификации с более привычным «Симон».
- source_word: ἐξηγήσατο
  choice: рассказал
  rationale: Глагол обозначает изложение событий; «рассказал» естественно передаёт краткое напоминание о только что прозвучавшем свидетельстве.
- source_word: καθὼς
  choice: как
  rationale: После глагола сообщения слово вводит содержание рассказа и одновременно сохраняет оттенок образа действия.
- source_word: πρῶτον
  choice: впервые
  rationale: Передаёт начало Божьего действия среди язычников; в русском контексте это естественнее буквального «сначала».
- source_word: ἐπεσκέψατο
  choice: обратил внимание на
  rationale: Глагол подразумевает деятельное, заботливое обращение Бога к людям. Такой перевод понятен современному читателю и не сводит выражение к обычному посещению.
- source_word: λαβεῖν
  choice: чтобы взять
  rationale: Сохранены целевое значение инфинитива и прямой смысл глагола без добавления толкования вроде «собрать».
- source_word: ἐξ ἐθνῶν
  choice: из язычников
  rationale: В контексте Деян 15 речь идёт о неевреях; предлог ἐξ передан прямо как «из».
- source_word: λαὸν
  choice: народ
  rationale: Слово сохраняет библейское значение сообщества, принадлежащего Богу, и не ограничивает его этнической группой.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: для Своего имени
  rationale: Сохранена богословски значимая библейская формула, выражающая принадлежность Богу и связь с Его именем.
theological_decisions:
- issue: Передача ἐξ ἐθνῶν как указания на народы или язычников
  choice: из язычников
  alternative: из народов
  rationale: В непосредственном контексте обсуждается принятие неевреев; «язычники» ясно сохраняет противопоставление иудеев и неиудеев, не утверждая при этом их религиозную практику.
- issue: Следует ли раскрывать τῷ ὀνόματι αὐτοῦ как «для Себя»
  choice: для Своего имени
  alternative: для Себя
  rationale: Буквенная формула сохраняет заветную образность и богословское напряжение исходного выражения; пояснение даётся в сноске, а не встраивается в текст.
- issue: Степень конкретизации ἐπεσκέψατο
  choice: обратил внимание на
  alternative: посетил
  rationale: Выбранное выражение передаёт целенаправленную Божью заботу, не создавая в современном русском ложного впечатления о буквальном кратком визите.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и библейской образности. Порядок фразы сделан естественным для русского языка; местоимение «Своего» соотнесено с подлежащим «Бог».
