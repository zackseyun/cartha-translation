  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τότε ἔδοξε τοῖς ἀποστόλοις καὶ τοῖς πρεσβυτέροις σὺν ὅλῃ τῇ ἐκκλησίᾳ ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν πέμψαι εἰς Ἀντιόχειαν σὺν ⸀τῷ Παύλῳ καὶ Βαρναβᾷ, Ἰούδαν τὸν ⸀καλούμενον Βαρσαββᾶν καὶ Σιλᾶν, ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/022.yaml
  text: 'Then it seemed good to the apostles and the elders, together with the whole church, to choose men from among them and send them to Antioch with Paul and Barnabas: Judas, who was called Barsabbas, and Silas, men who were leading among the brothers.'
translation:
  language: ru
  text: 'Тогда апостолы и пресвитеры вместе со всей церковью сочли за благо выбрать из своей среды мужей и послать их в Антиохию с Павлом и Варнавой: Иуду, называемого Варсавой, и Силу — мужей, занимавших ведущее положение среди братьев.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мужей, бывших руководителями среди братьев».'
    reason: lexical_alternative
  - marker: b
    text: Слово «братья» здесь, вероятно, относится ко всей общине верующих, включая женщин.
    reason: cultural_note
lexical_decisions:
- source_word: ἔδοξε
  choice: сочли за благо
  rationale: Передаёт коллективное обдуманное решение, не превращая выражение в формальный административный термин.
- source_word: πρεσβυτέροις
  choice: пресвитеры
  rationale: Устоявшееся и понятное русское обозначение руководителей раннехристианской общины.
- source_word: σὺν ὅλῃ τῇ ἐκκλησίᾳ
  choice: вместе со всей церковью
  rationale: Сохраняет участие всей иерусалимской общины, выраженное предлогом σύν.
- source_word: ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν
  choice: выбрать из своей среды мужей
  rationale: Естественно передаёт выбор делегатов из числа самой общины и сохраняет явно мужское ἄνδρας.
- source_word: πέμψαι εἰς Ἀντιόχειαν
  choice: послать их в Антиохию
  rationale: Прямой и естественный русский эквивалент.
- source_word: καλούμενον Βαρσαββᾶν
  choice: называемого Варсавой
  rationale: Сохраняет описательную силу причастия καλούμενον.
- source_word: ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς
  choice: мужей, занимавших ведущее положение среди братьев
  rationale: Передаёт признанное лидерство без превращения причастия в название формальной должности.
- source_word: ἀδελφοῖς
  choice: братьев
  rationale: Сохраняет грамматически мужскую форму оригинала; вероятный широкий общинный смысл пояснён в сноске.
theological_decisions:
- issue: Степень участия всей церкви в решении
  choice: Апостолы и пресвитеры принимают решение вместе со всей церковью.
  alternative: Решение приняли только апостолы и пресвитеры, а церковь лишь присутствовала.
  rationale: Оборот σὺν ὅλῃ τῇ ἐκκλησίᾳ естественнее всего включает всю церковь в коллективное решение, но перевод не навязывает определённую модель церковного устройства.
- issue: Объём значения ἀδελφοῖς
  choice: В основном тексте — «братьев», с пояснением вероятного собирательного смысла.
  alternative: «братьев и сестёр» или «верующих».
  rationale: Так сохраняется мужская форма исходного текста и одновременно отмечается, что в раннехристианской речи слово могло обозначать общину верующих в целом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис разделён на два предложения ради ясности; повтор «они выбрали» эксплицирует подразумеваемое действие причастия, не меняя его участников.
