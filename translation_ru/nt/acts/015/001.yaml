  yaml_path: translation/nt/acts/015/001.yaml
  text: And some men came down from Judea and were teaching the brothers[a], “Unless you are circumcised according to the custom of Moses, you cannot be saved.”
translation:
  language: ru
  text: 'Некоторые, придя из Иудеи, учили братьев[a]: «Если вы не будете обрезаны по обычаю Моисея, то не сможете спастись».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братьев и сестёр»; в греческом тексте стоит слово «братьев», которое здесь, вероятно, обозначает всю общину верующих.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί τινες
  choice: Некоторые
  rationale: Καί продолжает повествование, но в современном русском отдельное «И» здесь необязательно; τινες естественно передаётся как «некоторые» без добавления отсутствующего в греческом существительного.
- source_word: κατελθόντες ἀπὸ τῆς Ἰουδαίας
  choice: придя из Иудеи
  rationale: Причастие обозначает предшествующее прибытие из Иудеи. Пространственное «сошли» в русском возможно, но «придя» звучит естественнее и не утрачивает существенного смысла.
- source_word: ἐδίδασκον
  choice: учили
  rationale: Имперфект указывает на продолжавшееся действие; русская форма прошедшего времени в данном контексте естественно описывает такое обучение.
- source_word: τοὺς ἀδελφοὺς
  choice: братьев
  rationale: Сохраняется мужская форма греческого существительного; вероятное включение всей общины пояснено в сноске.
- source_word: Ἐὰν μὴ περιτμηθῆτε
  choice: Если вы не примете обрезание
  rationale: Условная конструкция передана естественным русским оборотом. «Примете обрезание» ясно выражает пассивный смысл и звучит литературнее, чем буквальное «будете обрезаны».
- source_word: τῷ ἔθει τῷ Μωϋσέως
  choice: по обычаю Моисея
  rationale: ἔθος означает установившийся обычай или практику; дательный оборот естественно передаётся предлогом «по» без истолковывающего расширения.
- source_word: οὐ δύνασθε σωθῆναι
  choice: не сможете спастись
  rationale: Передаёт заявленную невозможность спасения и сохраняет сотериологический смысл σωθῆναι в контексте спора.
theological_decisions:
- issue: Значение σωθῆναι в споре об обрезании
  choice: спастись
  alternative: получить избавление
  rationale: Контекст касается необходимости обрезания для спасения, а не только избавления от конкретной опасности; формулировка сохраняет богословскую остроту утверждения, не подтверждая его истинность голосом рассказчика.
- issue: Объём значения ἀδελφοὺς
  choice: братьев
  alternative: братьев и сестёр; верующих
  rationale: Основной текст сохраняет грамматически мужское обозначение исходника, а вероятный собирательный смысл для общины отмечается в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Синтаксис упрощён до естественной русской формы, при этом сохранены условие, требование обрезания по Моисееву обычаю и категоричность заявления о спасении.
