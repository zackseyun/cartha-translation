id: ACT.15.9
reference: Acts 15:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ⸀οὐθὲν διέκρινεν μεταξὺ ἡμῶν τε καὶ αὐτῶν, τῇ πίστει καθαρίσας τὰς καρδίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/009.yaml
  text: And he made no distinction between us and them[a], having cleansed their hearts by faith.
translation:
  language: ru
  text: И не сделал никакого различия между нами и ими, очистив их сердца верой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через веру». Греческий дательный падеж может обозначать средство или орудие действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐθὲν διέκρινεν
  choice: не сделал никакого различия
  rationale: Естественная русская идиома точно передаёт отрицание какого-либо различения между двумя группами.
- source_word: μεταξὺ ἡμῶν τε καὶ αὐτῶν
  choice: между нами и ими
  rationale: Прямо передаёт сопоставление двух групп; сочетание τε ... καὶ по-русски естественно выражается союзом «и».
- source_word: τῇ πίστει
  choice: верой
  rationale: 'Творительный падеж передаёт инструментальное значение греческого дательного: очищение совершается посредством веры.'
- source_word: καθαρίσας
  choice: очистив
  rationale: Деепричастие сохраняет связь аористного причастия с главным глаголом, не уточняя сверх текста точную временную последовательность.
- source_word: τὰς καρδίας αὐτῶν
  choice: их сердца
  rationale: «Сердца» сохраняет библейское обозначение внутреннего человека и естественно звучит по-русски.
theological_decisions:
- issue: Значение πίστις
  choice: вера
  alternative: доверие; верность
  rationale: В данном контексте πίστις естественно означает веру как средство, посредством которого Бог очистил сердца; оснований выбирать «верность» здесь нет.
- issue: Связь очищения с верой
  choice: очистив их сердца верой
  alternative: очистив их сердца через веру
  rationale: Инструментальное прочтение дательного τῇ πίστει наиболее естественно; вариант «через веру» передаёт ту же синтаксическую возможность и отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены библейские слова «сердца» и «вера», а синтаксис сделан естественным без устранения инструментального оттенка греческого дательного.
