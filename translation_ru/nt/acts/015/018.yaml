  source_fidelity: «известны издревле» точно передаёт краткую безглагольную конструкцию γνωστὰ ἀπ’ αἰῶνος, не добавляя ни субъекта знания, ни догматического уточнения о вечном предведении. Множественное «известны» допустимо для греческого γνωστά и хорошо согласуется с подразумеваемыми «этими делами/этим».
