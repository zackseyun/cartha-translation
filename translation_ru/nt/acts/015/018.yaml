  text: известны издревле[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях текст пространнее: «известны от вечности» или «Который возвещает это издревле».'
    reason: textual_variant
lexical_decisions:
- source_word: γνωστὰ
  choice: известны
  rationale: Предикативное прилагательное в безглагольной конструкции; «известны» прямо передаёт форму и не добавляет значения «возвещены» или усиления «хорошо известны».
- source_word: ἀπ’
  choice: из-
  rationale: В составе русского наречия «издревле» естественно передаёт исходную точку во времени, выраженную ἀπό.
- source_word: αἰῶνος
  choice: древле
  rationale: В сочетании с ἀπό обозначает давнее, древнее время. «Издревле» сохраняет краткость греческой фразы и не усиливает её до однозначного «от вечности».
theological_decisions:
- issue: Временной охват знания в краткой фразе
  choice: Передать как «известны издревле», не уточняя, кому именно известны и не разворачивая фразу в утверждение о вечном предведении.
  alternative: «известны от вечности»; «Который возвещает это издревле»
  rationale: 'Текст SBLGNT предельно краток: γνωστὰ ἀπ’ αἰῶνος. Перевод сохраняет безглагольность, множественное число и временную неопределённость, тогда как более пространные чтения отражены в сноске.'
translation_notes:
  register: Краткая, несколько торжественная формулировка, соответствующая цитатному контексту. Наречие «издревле» литературно и понятно современному читателю; строчная буква обусловлена тем, что стих продолжает предложение предыдущего стиха.
