lexical_decisions:
- source_word: διήρχετο
  choice: проходил
  rationale: Имперфект передаёт продолжавшееся путешествие по названным областям; «проходил через» естественно выражает движение через их территорию.
- source_word: δὲ
  choice: не передано отдельным словом
  rationale: Здесь δέ служит слабой повествовательной связкой. В русском продолжение рассказа естественно выражается без отдельного союза; начальное «и» было бы возможно, но звучало бы тяжелее вне более широкого контекста.
- source_word: Συρίαν
  choice: Сирию
  rationale: Общепринятое русское название области.
- source_word: Κιλικίαν
  choice: Киликию
  rationale: Общепринятое русское название области.
- source_word: ἐπιστηρίζων
  choice: укрепляя
  rationale: Причастие обозначает сопутствующее путешествию действие — поддержку, благодаря которой общины становились твёрже; «укрепляя» сохраняет широту значения, не сводя его лишь к ободрению.
- source_word: ἐκκλησίας
  choice: церкви
  rationale: В данном контексте слово обозначает местные христианские общины; «церкви» — ясный, естественный и традиционно узнаваемый русский эквивалент.
