  text: ἀναγνόντες δὲ ἐχάρησαν ἐπὶ τῇ παρακλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/031.yaml
  text: And when they had read it[a], they rejoiced because of its encouragement.
translation:
  language: ru
  text: Прочитав послание, они обрадовались тому, что оно их ободрило.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они обрадовались этому ободрению». Греческое слово может также означать «наставление» или «утешение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγνόντες
  choice: Прочитав послание
  rationale: Аористное причастие обозначает действие, предшествующее главному глаголу. Объект подразумевается из предыдущего стиха; «послание» естественно и ясно передаёт контекст.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Частица обозначает лёгкое продолжение повествования; в современном русском связь естественно передаётся без отдельного союза.
- source_word: ἐχάρησαν
  choice: они обрадовались
  rationale: Передаёт активное значение формы и естественно звучит в современном литературном русском.
- source_word: ἐπὶ τῇ παρακλήσει
  choice: тому, что оно их ободрило
  rationale: Предлог ἐπί с дательным указывает на основание радости, а παράκλησις здесь естественно понимать как ободрение, которое принесло содержание послания. Формулировка сохраняет причинный смысл.
