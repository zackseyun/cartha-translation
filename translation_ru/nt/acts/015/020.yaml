  text: ἀλλὰ ἐπιστεῖλαι αὐτοῖς τοῦ ⸀ἀπέχεσθαι τῶν ἀλισγημάτων τῶν εἰδώλων καὶ τῆς πορνείας καὶ ⸀τοῦ πνικτοῦ καὶ τοῦ αἵματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/020.yaml
  text: but to write to them to abstain from the pollutions of idols[a], and from sexual immorality, and from what has been strangled[c][b], and from blood.
translation:
  language: ru
  text: а написать им, чтобы они воздерживались от осквернений, связанных с идолами[a], от половой безнравственности[b], от мяса удавленных животных[c] и от крови.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осквернений от идолов». Некоторые переводы понимают это уже — как «идоложертвенную пищу», однако греческое выражение здесь имеет более широкое значение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «блуда». Греческое слово может обозначать половую безнравственность вообще; некоторые понимают его здесь более узко — как запрещённые половые союзы.'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «удавленного» — то есть мяса животного, из которого при забое не была должным образом выпущена кровь.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιστεῖλαι
  choice: написать
  rationale: В контексте решения Иерусалимского совета глагол означает передать письменное предписание; «написать» естественно и сохраняет эпистолярный смысл.
- source_word: ἀπέχεσθαι
  choice: воздерживались от
  rationale: Передаёт значение сознательно сторониться или не употреблять нечто и естественно звучит в перечне предписаний.
- source_word: ἀλισγημάτων τῶν εἰδώλων
  choice: осквернения, связанного с идолами
  rationale: Сохраняет более широкое значение культового осквернения и не сужает выражение до одной лишь пищи, принесённой в жертву идолам.
- source_word: πορνείας
  choice: разврата
  rationale: Современное и достаточно широкое обозначение половой безнравственности, не ограничивающее термин только добрачными отношениями.
- source_word: τοῦ πνικτοῦ
  choice: мяса удавленных животных
  rationale: В греческом буквально сказано «удавленного»; явное упоминание мяса делает подразумеваемый пищевой смысл понятным русскому читателю.
- source_word: τοῦ αἵματος
  choice: крови
  rationale: Кратко и прямо передаёт греческое выражение, не добавляя в основной текст толкования о способе употребления.
theological_decisions:
- issue: Объём запрета, связанного с идолами
  choice: «осквернения, связанного с идолами»
  alternative: «идоложертвенной пищи»
  rationale: ἀλισγημάτων τῶν εἰδώλων шире специального обозначения идоложертвенного; перевод сохраняет эту широту, а возможное более узкое понимание отмечено в сноске.
- issue: Значение πορνεία в апостольском постановлении
  choice: «разврата» в широком смысле
  alternative: «блуда» или «запрещённых половых союзов»
  rationale: Основной текст не решает спор о том, обозначает ли слово всякую половую безнравственность или, в данном контексте, конкретно запрещённые союзы.
- issue: Характер перечисленных предписаний
  choice: Передать их как простые требования воздерживаться
  alternative: Истолковать как временные правила совместной трапезы либо как постоянно обязательные нормы
  rationale: Стих перечисляет требования, но сам не определяет продолжительность и полный богословский статус постановления.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Причастная конструкция «связанного с идолами» естественно передаёт неопределённую связь греческого родительного падежа. В основном тексте подразумеваемое «мясо» раскрыто ради понятности, а буквальная форма сохранена в сноске.
