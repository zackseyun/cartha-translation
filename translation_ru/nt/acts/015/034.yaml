  yaml_path: translation/nt/acts/015/034.yaml
  text: But[a] it seemed good to Silas to remain there.
translation:
  language: ru
  text: Но Сила решил остаться там.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот стих отсутствует в древнейших греческих рукописях, в том числе в папирусе 74 (III век), Синайском и Ватиканском кодексах (IV век), а также в ранних коптских переводах. Он присутствует в византийской традиции большинства рукописей, в некоторых более поздних рукописях александрийского и западного типов, а также в латинской и сирийской традициях. Вероятно, поздний переписчик добавил его, чтобы объяснить, почему в стихе 40 Сила всё ещё находился в Антиохии и смог отправиться с Павлом, хотя в стихе 33 говорится, что он и Иуда ушли.
    reason: textual_critical
lexical_decisions:
- source_word: ἔδοξε … τῷ Σίλᾳ
  choice: Сила решил
  rationale: Безличная греческая конструкция с дательным лицом идиоматически означает, что Сила счёл это правильным или принял такое решение. Естественное русское «Сила решил» точно передаёт смысл без тяжеловесной кальки «Силе показалось хорошим».
- source_word: ἐπιμεῖναι
  choice: остаться
  rationale: Инфинитив передаёт продолжение пребывания в данном месте; в этом контексте современное русское «остаться» естественнее, чем «пребывать».
- source_word: αὐτοῦ
  choice: там
  rationale: Здесь слово употреблено как наречие места и отсылает к Антиохии.
- source_word: δέ
  choice: Но
  rationale: Союз обозначает контраст с предшествующим сообщением об уходе посланных; «но» ясно и естественно выражает эту связь.
