  text: νῦν οὖν τί πειράζετε τὸν θεόν, ἐπιθεῖναι ζυγὸν ἐπὶ τὸν τράχηλον τῶν μαθητῶν ὃν οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς ἰσχύσαμεν βαστάσαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/010.yaml
  text: Now then[c][b][a], why are you testing God by putting a yoke on the neck of the disciples that neither our fathers nor we have been able to bear?
translation:
  language: ru
  text: Так зачем же вы теперь испытываете Бога, возлагая на шею учеников ярмо[a], которое не смогли нести ни наши предки, ни мы?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Ярмо» — образ навязываемой обязанности или бремени; в данном контексте речь идёт о требованиях, возлагаемых на учеников.
    reason: cultural_note
lexical_decisions:
- source_word: νῦν οὖν
  choice: Так зачем же вы теперь
  rationale: Передаёт выводное οὖν и временное νῦν естественным для современного русского вопросительным оборотом.
- source_word: τί πειράζετε τὸν θεόν
  choice: зачем же вы испытываете Бога
  rationale: В риторическом вопросе τί передано как «зачем», а πειράζετε сохраняет значение испытания Бога без добавочного толкования.
- source_word: ἐπιθεῖναι
  choice: возлагая
  rationale: Деепричастный оборот естественно выражает, каким действием они испытывают Бога, и сочетается с образом ярма.
- source_word: ζυγὸν
  choice: ярмо
  rationale: Сохраняет яркую метафору наложенной обязанности или бремени; «ярмо» в русском языке естественно сочетается с глаголами «возлагать» и «нести».
- source_word: ἐπὶ τὸν τράχηλον τῶν μαθητῶν
  choice: на шею учеников
  rationale: Прямо сохраняет телесный образ оригинала; «ученики» — обычный русский эквивалент μαθηταί в Деяниях.
- source_word: οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς
  choice: ни наши предки, ни мы
  rationale: В данном историческом контексте πατέρες обозначает прежние поколения народа; «предки» ясно передаёт этот смысл в современном русском.
- source_word: ἰσχύσαμεν βαστάσαι
  choice: не смогли нести
  rationale: Передаёт отсутствие способности и сохраняет образ несения ярма; аорист не требует явно выраженного русского перфекта.
theological_decisions:
- issue: Смысл метафоры «ярмо»
  choice: Метафора сохранена без уточнения, какие именно требования составляют ярмо.
  alternative: Передать как «Моисеев закон», «обрезание» или обобщённо как «бремя требований».
  rationale: Контекст связан с требованиями к ученикам из язычников, однако сам стих оставляет образ более общим; конкретизация в основном тексте неоправданно разрешила бы сохраняемое оригиналом напряжение.
- issue: Значение «испытывать Бога»
  choice: Сохранена формулировка «испытываете Бога».
  alternative: «Искушаете Бога» или «подвергаете Бога испытанию».
  rationale: «Искушаете» в современном русском может ошибочно подразумевать склонение к греху, тогда как «испытываете» точнее и нейтральнее передаёт πειράζετε.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранены риторический вопрос и метафора ярма; синтаксис сделан естественным без конфессиональной конкретизации.
