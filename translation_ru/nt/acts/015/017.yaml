  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅπως ἂν ἐκζητήσωσιν οἱ κατάλοιποι τῶν ἀνθρώπων τὸν κύριον, καὶ πάντα τὰ ἔθνη ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς, λέγει ⸀κύριος ποιῶν ⸀ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/017.yaml
  text: so that the remnant of mankind may seek the Lord[a], even all the Gentiles on whom my name has been called, says the Lord[c][b], who does these things
translation:
  language: ru
  text: «чтобы остаток человечества искал Господа, и все язычники[a], которые названы Моим именем[b], — говорит Господь, совершающий это».[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все народы». Греческое ἔθνη может означать как народы вообще, так и язычников, то есть неевреев; в данном контексте речь идёт о принятии неевреев.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «над которыми было призвано Моё имя». Этот оборот указывает на принадлежность Господу.'
    reason: lexical_alternative
  - marker: c
    text: Эти слова перекликаются с Ам. 9:12 в форме, отражённой в греческом переводе Писаний, где говорится о народах, носящих имя Господа.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπως ἂν
  choice: чтобы
  rationale: Естественно передаёт целевое или результативное значение оборота с сослагательным наклонением.
- source_word: ἐκζητήσωσιν
  choice: искали
  rationale: Передаёт основное значение глагола «искать» без избыточного усиления, которое приставка ἐκ- здесь не обязательно требует выражать отдельно.
- source_word: οἱ κατάλοιποι τῶν ἀνθρώπων
  choice: оставшиеся люди
  rationale: Сохраняет значение тех, кто остался, и передаёт ἄνθρωποι как общее обозначение людей, а не только мужчин.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Обычный и стилистически уместный русский эквивалент κύριος в пророческой цитате.
- source_word: πάντα τὰ ἔθνη
  choice: все язычники
  rationale: В контексте Иерусалимского собора речь идёт о людях нееврейского происхождения; вариант «все народы» сохранён в сноске, поскольку ἔθνη допускает оба значения.
- source_word: ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς
  choice: которые названы Моим именем
  rationale: Естественно по-русски передаёт семитизированный греческий оборот, обозначающий принадлежность и отождествление с Божьим именем; буквальная образность отмечена в сноске.
- source_word: λέγει κύριος
  choice: говорит Господь
  rationale: Сохраняет настоящее время и традиционную формулу пророческого возвещения.
- source_word: ποιῶν ταῦτα
  choice: совершающий всё это
  rationale: Причастный оборот отнесён к Господу; настоящее время сохраняет действующую Божью волю, а «всё это» естественно передаёт множественное ταῦτα.
theological_decisions:
- issue: Значение ἔθνη в контексте принятия неевреев
  choice: все язычники
  alternative: все народы
  rationale: Контекст Деяний 15 делает акцент на включении неевреев, однако более широкое значение «народы» не исключено и потому дано в сноске.
- issue: Смысл формулы о Божьем имени
  choice: которые названы Моим именем
  alternative: над которыми было призвано Моё имя
  rationale: Основной текст ясно передаёт принадлежность Господу, не сводя выражение к формальному наименованию; буквальная конструкция сохранена в сноске.
- issue: Кого обозначает οἱ κατάλοιποι τῶν ἀνθρώπων
  choice: оставшиеся люди
  alternative: остаток человечества
  rationale: Выбранное выражение сохраняет общий, не мужской по смыслу охват и не усиливает богословский термин «остаток» сверх формы греческой фразы.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой цитаты. Синтаксис слегка приподнят, но остаётся понятным; архаизмы и конфессионально окрашенные формулировки не используются.
