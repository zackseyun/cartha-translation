  text: ἐξανέστησαν δέ τινες τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων πεπιστευκότες, λέγοντες ὅτι δεῖ περιτέμνειν αὐτοὺς παραγγέλλειν τε τηρεῖν τὸν νόμον Μωϋσέως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/005.yaml
  text: But some of those from the party of the Pharisees who had believed stood up[a], saying that it is necessary to circumcise them and to command them to keep the law of Moses.
translation:
  language: ru
  text: 'Но некоторые из уверовавших, принадлежавших к фарисейскому течению[a], встали и сказали: «Их необходимо обрезать и повелеть им соблюдать закон Моисея».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «фарисейской партии» или «фарисейской секты». Греческое слово обозначает признанную группу или направление и не имеет здесь позднейшего технического значения «ересь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξανέστησαν
  choice: поднялись
  rationale: В контексте собрания глагол обозначает, что участники встали, чтобы выступить; «поднялись» естественно передаёт повествовательное действие без усиления тона.
- source_word: τινες
  choice: некоторые
  rationale: Неопределённое местоимение во множественном числе; перевод не добавляет отсутствующего в греческом указания на пол.
- source_word: τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων
  choice: из принадлежавших к фарисейскому течению
  rationale: Здесь αἵρεσις означает признанное направление или группу внутри иудаизма, а не «ересь» в позднейшем богословском смысле. «Течение» естественно для современного русского языка и не несёт лишней отрицательной оценки.
- source_word: πεπιστευκότες
  choice: уверовавших
  rationale: 'Перфектное причастие указывает на совершившееся уверование с сохраняющимся результатом. Глагольная передача сохраняет напряжение текста: эти люди уверовали, но продолжали настаивать на обрезании язычников и соблюдении ими закона.'
- source_word: λέγοντες
  choice: и сказали
  rationale: В русском повествовании сочинённая форма естественнее буквального причастия «говоря» и нейтрально вводит содержание речи.
- source_word: δεῖ
  choice: необходимо
  rationale: Безлично выражает необходимость, не уточняя её источник, как и греческий текст.
- source_word: περιτέμνειν αὐτούς
  choice: их необходимо обрезать
  rationale: Прямая передача инфинитивной конструкции; местоимение относится к обращённым из язычников, упомянутым в контексте.
- source_word: παραγγέλλειν
  choice: повелеть
  rationale: Передаёт властный характер требования. «Наставить» было бы слабее, а «приказать» в современном русском могло бы звучать излишне резко.
- source_word: τε τηρεῖν
  choice: и повелеть им соблюдать
  rationale: Связка τε соединяет два требования, а τηρέω в отношении закона означает его соблюдение.
- source_word: τὸν νόμον Μωϋσέως
  choice: закон Моисея
  rationale: Прямая и общепонятная передача греческой родительной конструкции.
theological_decisions:
- issue: Значение αἵρεσις применительно к фарисеям
  choice: фарисейское течение
  alternative: фарисейская партия / фарисейская секта
  rationale: Слово обозначает религиозное направление или группу и не должно передаваться как «ересь», поскольку это привнесло бы более поздний технический смысл и отрицательную оценку.
- issue: Смысл πεπιστευκότες
  choice: уверовавших
  alternative: ставших верующими / верующих
  rationale: Глагольная форма сохраняет утверждение текста, что эти фарисеи действительно уверовали, не снимая напряжения между их верой и требованием обрезания и соблюдения закона для язычников.
- issue: Связь двух инфинитивов после δεῖ
  choice: «Их необходимо обрезать и повелеть им соблюдать…»
  alternative: «Необходимо обрезывать их и предписывать им соблюдать…»
  rationale: 'Сохраняются два связанных требования: совершить над ними обрезание и дать им обязательное предписание соблюдать закон. Формулировка не уточняет сверх текста, кто именно должен выполнить эти действия.'
translation_notes:
  register: 'Современный литературный русский язык, ясный и достойный по тону. Синтаксис слегка перестроен ради естественности: греческие причастия переданы определительным оборотом и личной формой. Архаизмы и позднейший негативный смысл слова «ересь» исключены.'
