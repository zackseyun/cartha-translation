lexical_decisions:
- source_word: ποιήσαντες ... χρόνον
  choice: Пробыв там некоторое время
  rationale: Греческая идиома буквально означает «проведя время». Деепричастная конструкция естественно передаёт предшествующее пребывание; «там» добавлено из контекста пребывания в Антиохии.
- source_word: δὲ
  choice: не передано отдельно
  rationale: Слабый повествовательный связующий элемент; в современном русском переход естественно выражается последовательностью фраз без обязательного «и» или «затем».
- source_word: ἀπελύθησαν
  choice: были ... отпущены
  rationale: В данном контексте глагол обозначает, что община мирно проводила посланников и позволила им отправиться обратно; «отпущены» сохраняет страдательную форму и не подразумевает освобождения из-под стражи.
- source_word: μετ’ εἰρήνης
  choice: с миром
  rationale: Устойчивое и естественное русское выражение, передающее мирное прощание и благожелательность общины.
- source_word: ἀπὸ τῶν ἀδελφῶν
  choice: братьями[a]
  rationale: Сохраняется грамматически мужская форма оригинала; сноска поясняет вероятное включение всей общины верующих.
- source_word: πρὸς τοὺς ἀποστείλαντας αὐτούς
  choice: к тем, кто их послал
  rationale: Субстантивированное причастие обозначает людей, ранее пославших этих делегатов. Русское прошедшее время ясно выражает предшествующее действие; «обратно» не добавлено, поскольку его нет в греческом тексте.
theological_decisions:
- issue: Инклюзивное значение ἀδελφοί
  choice: братьями
  alternative: братьями и сёстрами; верующими
  rationale: Форма оригинала грамматически мужская, но в контексте, вероятно, обозначает всю общину верующих. Основной текст сохраняет форму источника, а возможный инклюзивный смысл отмечен в сноске.
