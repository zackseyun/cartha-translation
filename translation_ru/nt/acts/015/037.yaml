base_translation:
  language: en
  yaml_path: translation/nt/acts/015/037.yaml
  text: But Barnabas wanted to take along also John[a], who was called Mark.
translation:
  language: ru
  text: Но Варнава хотел взять с собой и Иоанна, называемого Марком.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иоанна, которого также звали Марком».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βαρναβᾶς
  choice: Варнава
  rationale: Традиционная и общепринятая русская форма личного имени.
- source_word: δὲ
  choice: Но
  rationale: Передаёт мягкое противопоставление намерения Варнавы предложению Павла в предыдущем контексте.
- source_word: ἐβούλετο
  choice: хотел
  rationale: Естественно передаёт выраженное имперфектом желание или намерение Варнавы, не усиливая оттенок обдуманного решения.
- source_word: συμπαραλαβεῖν
  choice: взять с собой
  rationale: Точно и естественно передаёт значение совместного взятия человека в путь.
- source_word: καὶ
  choice: и
  rationale: 'В позиции перед дополнением имеет присоединительное значение: Варнава хотел взять также Иоанна; русское «и Иоанна» естественно сохраняет этот акцент.'
- source_word: Ἰωάννην
  choice: Иоанна
  rationale: Традиционная русская форма личного имени, поставленная в винительном падеже по синтаксису предложения.
- source_word: τὸν καλούμενον Μᾶρκον
  choice: называемого Марком
  rationale: Причастный оборот сохраняет форму и смысл греческого выражения, указывающего на другое имя Иоанна, без внесения отсутствующего в самом обороте слова «также».
- source_word: Μᾶρκον
  choice: Марком
  rationale: Традиционная русская форма имени в творительном падеже после «называемого».
