  text: Μετὰ δέ τινας ἡμέρας εἶπεν ⸂πρὸς Βαρναβᾶν Παῦλος⸃· Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα τοὺς ⸀ἀδελφοὺς κατὰ ⸂πόλιν πᾶσαν⸃ ἐν αἷς κατηγγείλαμεν τὸν λόγον τοῦ κυρίου, πῶς ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/036.yaml
  text: After some days[a], Paul said to Barnabas, “Let us return now and visit the brothers in every city where we proclaimed the word of the Lord, and see how they are.”
translation:
  language: ru
  text: 'Через несколько дней Павел сказал Варнаве: «Давай же вернёмся и навестим братьев[a] во всех городах, где мы возвещали слово Господа, и узнаем, как они поживают».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братьев и сестёр». В греческом тексте употреблено слово «братья», которое может обозначать всю общину верующих, включая женщин.'
    reason: Лексическая альтернатива и пояснение возможного собирательного значения.
lexical_decisions:
- source_word: Μετὰ δέ τινας ἡμέρας
  choice: Через несколько дней
  rationale: Оборот μετά с винительным обозначает последующее время; перевод сохраняет неопределённость промежутка и естественно звучит по-русски.
- source_word: εἶπεν πρὸς Βαρναβᾶν Παῦλος
  choice: Павел сказал Варнаве
  rationale: Прямо передаёт говорящего, адресата и нейтральный глагол речи.
- source_word: Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα
  choice: Давай вернёмся и навестим
  rationale: Причастие вместе с увещательным сослагательным наклонением естественно передаётся совместным побуждением. «Давай» соответствует обращению к одному Варнаве, а «навестим» сохраняет оттенок заботливого посещения.
- source_word: τοὺς ἀδελφοὺς
  choice: братьев
  rationale: Сохраняется мужской род родственного обозначения в греческом тексте; вероятный собирательный смысл, охватывающий всю общину, отмечен в сноске.
- source_word: κατὰ πόλιν πᾶσαν
  choice: во всех городах
  rationale: 'Передаёт распределительное значение конструкции κατά: каждый город, где они прежде служили.'
- source_word: ἐν αἷς κατηγγείλαμεν
  choice: где мы возвещали
  rationale: «Возвещали» отражает публичное провозглашение, выраженное καταγγέλλω, и сохраняет достойный современный регистр.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: слово Господа
  rationale: Традиционно и точно передаёт λόγος как провозглашаемую весть и κύριος как «Господь».
- source_word: πῶς ἔχουσιν
  choice: как они поживают
  rationale: Естественно передаёт идиому о состоянии людей и выраженный контекстом личный интерес.
theological_decisions:
- issue: Значение ἀδελφοί применительно к христианской общине
  choice: братьев с пояснительной сноской
  alternative: братьев и сестёр; верующих
  rationale: Основной текст сохраняет выраженную в греческом мужскую форму, не отрицая вероятного включения женщин в обозначаемую общину.
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка; Господин
  rationale: «Господь» соответствует новозаветному религиозному употреблению и не вводит дополнительного толкования.
translation_notes:
  register: Современный литературный русский язык с естественной прямой речью. «Давай» уместно при обращении Павла к одному собеседнику и выражает совместное побуждение без канцелярской тяжеловесности; остальная лексика сохраняет достойный библейский регистр.
