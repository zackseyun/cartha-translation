  naturalness: Русский текст литературный и ясный. «После того как ... возникли» точнее передаёт обстоятельственное предшествование генитива абсолютного, чем менее определённое «Тогда».
  terminology: «Апостолы» и «старейшины» переданы последовательно и уместно. «Немалые разногласия и споры» естественно сохраняет литоту и различие между στάσις и ζήτησις.
