  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: γενομένης ⸀δὲ στάσεως καὶ ζητήσεως οὐκ ὀλίγης τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτοὺς ἔταξαν ἀναβαίνειν Παῦλον καὶ Βαρναβᾶν καί τινας ἄλλους ἐξ αὐτῶν πρὸς τοὺς ἀποστόλους καὶ πρεσβυτέρους εἰς Ἰερουσαλὴμ περὶ τοῦ ζητήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/002.yaml
  text: And after no small dissension and debate had arisen between Paul and Barnabas and them[c][b][a], they appointed Paul and Barnabas and some others from among them to go up to the apostles and elders in Jerusalem about this issue.
translation:
  language: ru
  text: После того как между Павлом и Варнавой, с одной стороны, и теми людьми — с другой, возникли немалые[a] разногласия и споры, было решено, что Павел и Варнава вместе с несколькими другими из их числа отправятся в Иерусалим[b] к апостолам и старейшинам по этому вопросу.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не малые». В греческом употреблена литота, подчёркивающая серьёзность разногласий и споров.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «подняться в Иерусалим» — обычное греческое выражение о пути в Иерусалим.'
    reason: cultural_note
  - marker: c
    text: 'Или: «об этом деле»; «по этому спорному вопросу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης δὲ
  choice: возникли ... Тогда
  rationale: Генитив абсолютный задаёт обстоятельство, предшествующее главному действию; разделение на два предложения естественно для современного русского и сохраняет ход повествования.
- source_word: στάσεως καὶ ζητήσεως
  choice: разногласия и споры
  rationale: Первое слово обозначает серьёзное противостояние, второе — словесное обсуждение или прение; сочетание передаёт и остроту конфликта, и его дискуссионный характер.
- source_word: οὐκ ὀλίγης
  choice: немалые
  rationale: Русское «немалые» естественно сохраняет греческую литоту и подчёркивает серьёзность разногласий.
- source_word: τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτούς
  choice: между Павлом и Варнавой, с одной стороны, и теми людьми — с другой
  rationale: Конструкция обозначает стороны спора. «Те люди» отсылает к пришедшим из Иудеи в предыдущем стихе, не усиливая оттенок враждебности.
- source_word: ἔταξαν
  choice: было решено
  rationale: Безличная формулировка передаёт организованное общее решение и не вводит в основной текст подлежащее, прямо не названное в греческом.
- source_word: ἀναβαίνειν
  choice: отправятся в Иерусалим
  rationale: Так естественно по-русски передаётся устойчивое употребление глагола «подниматься» применительно к пути в Иерусалим; буквальный образ отмечен в сноске.
- source_word: τινας ἄλλους ἐξ αὐτῶν
  choice: вместе с несколькими другими из их числа
  rationale: Фраза указывает на дополнительных представителей, избранных из местной общины, не уточняя их пол сверх сказанного в источнике.
- source_word: τοὺς ἀποστόλους καὶ πρεσβυτέρους
  choice: апостолам и старейшинам
  rationale: Сохранены признанные обозначения служения и руководителей в повествовании Деяний.
- source_word: περὶ τοῦ ζητήματος τούτου
  choice: чтобы обсудить с ними этот вопрос
  rationale: Передаёт цель обращения к апостолам и старейшинам по поводу спорного вопроса; русский инфинитив делает связь естественной, не предрешая исход обсуждения.
theological_decisions:
- issue: Кто участвовал в споре
  choice: Павел и Варнава противопоставлены «тем людям», то есть пришедшим из Иудеи в предыдущем стихе
  alternative: 'Передать менее явно: «у Павла и Варнавы произошли с ними немалые разногласия»'
  rationale: Явное обозначение двух сторон проясняет греческий синтаксис и ближайшую повествовательную отсылку, не добавляя богословских выводов.
- issue: Характер решения общины
  choice: Безличное «было решено»
  alternative: «они назначили» или «братья решили»
  rationale: Так сохраняется факт упорядоченного назначения делегации, но не вводится прямо не названный субъект и не преувеличивается формальная структура церковного управления.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Синтаксис упрощён без утраты противопоставления сторон; неоднозначный субъект ἔταξαν не конкретизирован. Все примечания отмечены в основном тексте.
