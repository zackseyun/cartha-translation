revisions:
- from: Между Павлом и Варнавой, с одной стороны, и теми людьми — с другой, возникли немалые[a] разногласия и споры. Тогда было решено, что Павел и Варнава вместе с несколькими другими из их числа отправятся в Иерусалим[b] к апостолам и старейшинам, чтобы обсудить с ними этот вопрос.[c]
  to: После того как между Павлом и Варнавой, с одной стороны, и теми людьми — с другой, возникли немалые[a] разногласия и споры, было решено, что Павел и Варнава вместе с несколькими другими из их числа отправятся в Иерусалим[b] к апостолам и старейшинам по этому вопросу.[c]
  rationale: Устранено добавленное целевое действие «обсудить с ними»; «по этому вопросу» прямо передаёт περὶ τοῦ ζητήματος τούτου. Начальный оборот уточнён в соответствии с временно-обстоятельственной функцией γενομένης δέ. Примечание о «восхождении» в Иерусалим очищено от не требуемого источником исторического уточнения.
