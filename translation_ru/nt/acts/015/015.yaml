lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Обычный соединительный союз, вводящий дальнейшее подтверждение слов Иакова.
- source_word: τούτῳ
  choice: с этим
  rationale: Дательный падеж указательного местоимения отсылает к сказанному ранее; сочетание «с этим согласуются» естественно по-русски и сохраняет широкий референт.
- source_word: συμφωνοῦσιν
  choice: согласуются
  rationale: Форма настоящего времени обозначает соответствие или согласие; «согласуются» естественно описывает соответствие пророческих слов предшествующему свидетельству.
- source_word: οἱ λόγοι
  choice: слова
  rationale: Здесь имеются в виду зафиксированные пророческие изречения; прямое и понятное соответствие.
- source_word: τῶν προφητῶν
  choice: пророков
  rationale: Родительный падеж передаёт принадлежность или источник пророческих слов без ненужного уточнения.
- source_word: καθὼς
  choice: как
  rationale: Вводит подтверждающую цитату из Писания; «как написано» — естественная и точная русская формула.
- source_word: γέγραπται
  choice: написано
  rationale: Перфект пассивного залога употреблён как устойчивая формула введения цитаты из Писания; русское «написано» сохраняет её силу.
theological_decisions:
- issue: Референт τούτῳ в речи Иакова
  choice: Нейтральное «с этим», относящееся к предшествующему утверждению или событию без его конкретизации.
  alternative: «с обращением язычников», «со словами Петра» или «с этим Божьим замыслом»
  rationale: Греческий текст оставляет референт достаточно широким. Перевод не сужает его до одной богословской интерпретации.
translation_notes:
  register: Современный литературный русский язык; фраза звучит естественно и сохраняет достоинство формулы введения пророческой цитаты. Синтаксическое выдвижение «с этим» вслед за союзом передаёт акцент греческого текста без искусственной буквальности.
