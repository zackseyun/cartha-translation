  text: Μετὰ ταῦτα ἀναστρέψω καὶ ἀνοικοδομήσω τὴν σκηνὴν Δαυὶδ τὴν πεπτωκυῖαν καὶ τὰ ⸀κατεσκαμμένα αὐτῆς ἀνοικοδομήσω καὶ ἀνορθώσω αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/016.yaml
  text: After these things I will return[a], and I will rebuild the fallen tent of David; I will rebuild its ruins, and I will restore it[b],
translation:
  language: ru
  text: После этого Я вернусь и заново воздвигну павший шатёр Давида[a]; вновь выстрою то, что в нём разрушено, и восстановлю его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скинию Давида». Греческое слово может означать шатёр или скинию.'
    reason: lexical_alternative
  - marker: b
    text: «Шатёр Давида» — пророческий образ восстановления, связанного с родом или царством Давида.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: После этого
  rationale: Естественный современный русский оборот, передающий временной переход; множественное ταῦτα в данном выражении по-русски идиоматично передаётся единственным «этого».
- source_word: ἀναστρέψω
  choice: Я возвращусь
  rationale: В контексте цитаты глагол означает возвращение; будущее время и первое лицо божественного обещания сохранены.
- source_word: ἀνοικοδομήσω
  choice: заново воздвигну / отстрою
  rationale: Оба русских соответствия передают повторное строительство; лексическое варьирование избегает тяжёлого повтора, присутствующего в греческом, не меняя смысла.
- source_word: σκηνὴν Δαυὶδ
  choice: шатёр Давида
  rationale: «Шатёр» прямо и естественно передаёт σκηνή и сохраняет пророческую метафору, не подменяя её толкованием как династии или царства.
- source_word: τὴν πεπτωκυῖαν
  choice: павший
  rationale: 'Передаёт результирующее состояние совершенного причастия: шатёр пал и остаётся поверженным.'
- source_word: τὰ κατεσκαμμένα αὐτῆς
  choice: его развалины
  rationale: Собирательно и естественно передаёт то, что было разрушено или снесено.
- source_word: ἀνορθώσω
  choice: восстановлю
  rationale: Передаёт приведение павшего сооружения в прежнее, исправное состояние; буквальное «выпрямлю» здесь менее естественно.
- source_word: αὐτήν
  choice: его
  rationale: Местоимение отсылает к «шатру»; русское согласование требует мужского рода.
theological_decisions:
- issue: Метафорический смысл выражения «шатёр Давида»
  choice: Сохранить метафору в основном тексте.
  alternative: 'Передать толковательно: «дом Давида», «династия Давида» или «царство Давида».'
  rationale: Греческий текст сохраняет пророческий образ. Его вероятная связь с линией или царством Давида отмечена в сноске, но не навязана основному тексту.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой цитаты. Синтаксис ясен для широкого читателя; метафора оригинала сохранена. Все маркеры сносок присутствуют в основном тексте.
