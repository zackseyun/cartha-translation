  naturalness: Предлагаемая формула «отправили с ними письмо такого содержания» естественна в современном литературном русском и ясно выражает функцию греческого идиоматического оборота. Формула адреса и приветствия сохранена в официально-письменном регистре.
  terminology: «Апостолы», «братья-пресвитеры», «братья», «язычники» и географические названия переданы последовательно. «Братья-пресвитеры» сохраняет предпочтительное синтаксическое понимание, при этом альтернативное членение отмечено в сноске без догматического предпочтения.
