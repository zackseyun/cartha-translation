  text: γράψαντες διὰ χειρὸς ⸀αὐτῶν· Οἱ ἀπόστολοι καὶ οἱ ⸀πρεσβύτεροι ἀδελφοὶ τοῖς κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν ἀδελφοῖς τοῖς ἐξ ἐθνῶν χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/023.yaml
  text: 'Having written by their hand: “The apostles and the elder brothers[a], to the brothers from among the Gentiles in Antioch and Syria and Cilicia[c][b], greetings.”'
translation:
  language: ru
  text: 'Они отправили с ними[a] письмо такого содержания: «Апостолы и братья-пресвитеры[b] приветствуют братьев[c] из язычников в Антиохии, Сирии и Киликии».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «написав через их руку»; этот оборот может означать «отправив с ними» или «передав через них».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «апостолы и пресвитеры, братья». Греческое выражение наиболее естественно позволяет связывать слово «братья» с «пресвитерами» как обозначение одной группы.'
    reason: alternative_reading
  - marker: c
    text: Слово «братья» здесь, вероятно, относится ко всей общине верующих, включая женщин.
    reason: lexical_alternative
lexical_decisions:
- source_word: γράψαντες
  choice: Они написали
  rationale: Аористное причастие обозначает составление письма и связано с действием предыдущего контекста. В русском отдельная личная форма звучит естественнее, не меняя последовательности действий.
- source_word: διὰ χειρὸς αὐτῶν
  choice: и передали через них
  rationale: Буквально «через их руку»; в данном контексте оборот указывает на посредничество названных посланников, доставляющих письмо. Перевод передаёт функцию идиомы, а буквальный образ отмечен в сноске.
- source_word: ἀπόστολοι
  choice: апостолы
  rationale: Устоявшееся и контекстуально точное обозначение признанных посланников-руководителей Иерусалимской общины.
- source_word: πρεσβύτεροι ἀδελφοὶ
  choice: братья-пресвитеры
  rationale: Такое сочетание сохраняет наиболее естественную синтаксическую связь двух слов как обозначений одной группы и не превращает πρεσβύτεροι в бытовое «старшие». Возможная пунктуационная трактовка «пресвитеры, братья» дана в сноске.
- source_word: ἀδελφοῖς
  choice: братьям
  rationale: Сохраняется мужская форма исходного текста. В обращении к христианской общине слово, вероятно, включает также верующих женщин; это пояснено в сноске.
- source_word: τοῖς ἐξ ἐθνῶν
  choice: из язычников
  rationale: Передаёт происхождение адресатов из нееврейских народов без добавления богословских уточнений.
- source_word: κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν
  choice: живущим в Антиохии, Сирии и Киликии
  rationale: κατά с винительным здесь обозначает местонахождение или распределение адресатов по названным местам. Добавленное «живущим» естественно выражает эту связь по-русски.
- source_word: χαίρειν
  choice: Приветствуем вас!
  rationale: В начале письма это традиционная эпистолярная формула приветствия, а не повеление радоваться.
theological_decisions:
- issue: Состав группы, обозначенной πρεσβύτεροι ἀδελφοὶ
  choice: братья-пресвитеры
  alternative: пресвитеры, братья
  rationale: Отсутствие второго артикля позволяет естественно понимать ἀδελφοὶ как приложение к πρεσβύτεροι, то есть как одну группу. При этом пунктуационно-аппозитивное прочтение остаётся возможным и вынесено в сноску.
- issue: Объём значения ἀδελφοῖς при обращении к общине
  choice: братьям
  alternative: братьям и сёстрам
  rationale: Основной текст сохраняет грамматически мужскую форму оригинала, а вероятный инклюзивный охват всей общины, включая женщин, разъясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством официального письма. «Братья-пресвитеры» сохраняет церковно-исторический термин и одновременно отражает тесную связь существительных в греческом. Формула «Приветствуем вас!» естественна для русского письма. Маркер [c] поставлен после всей формулы приветствия, поскольку поясняет адресное слово «братьям» внутри цитаты.
