lexical_decisions:
- source_word: ἐγένετο
  choice: возникло
  rationale: Естественно вводит новое событие и сохраняет повествовательную динамику глагола γίνομαι.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: В русском повествовании мягкая связка δέ естественно передаётся последовательностью фраз; отдельное «и» здесь утяжелило бы начало.
- source_word: παροξυσμὸς
  choice: острое разногласие
  rationale: Передаёт сильное столкновение между Павлом и Варнавой, не сводя его к внутреннему раздражению и не усиливая до прямо не названной ссоры.
- source_word: ὥστε
  choice: столь… что
  rationale: Ясно передаёт конструкцию степени и результата с ὥστε и инфинитивом.
- source_word: ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων
  choice: они расстались друг с другом
  rationale: Естественная русская конечная конструкция после «столь… что», точно выражающая взаимное разделение.
- source_word: τόν τε Βαρναβᾶν
  choice: Варнава
  rationale: τε вводит первую из двух последующих линий действия, продолжение которой следует в ст. 40; двоеточие естественно показывает результат разделения.
- source_word: παραλαβόντα τὸν Μᾶρκον
  choice: взял с собой Марка
  rationale: Передаёт значение «взять с собой» у παραλαμβάνω и не добавляет полного имени «Иоанн Марк», которого в данном стихе нет.
- source_word: ἐκπλεῦσαι εἰς Κύπρον
  choice: отплыл на Кипр
  rationale: «Отплыл» сохраняет значение отправления морем, а «на Кипр» является нормативным русским обозначением направления к острову.
theological_decisions:
- issue: Изображение конфликта между апостольскими сотрудниками
  choice: острое разногласие
  alternative: резкая ссора / сильное раздражение
  rationale: Перевод прямо сохраняет серьёзность конфликта, не смягчая его ради гармонизации и не приписывая участникам нравственную оценку, отсутствующую в тексте.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Формулировка dignified и общепонятна; двоеточие связывает разделение с первым из последовавших действий. Конечная запятая сохранена в соответствии с предоставленным фрагментом, который синтаксически продолжается следующим стихом.
