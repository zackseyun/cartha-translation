  terminology: «Святой Дух» и «бремя» удачны. «Предписания» в основном тексте — нейтральное и ясное обозначение конкретных пунктов следующего стиха; прилагательное «необходимых» сохраняет ἐπάναγκες, не определяя богословски природу или длительность требований.
