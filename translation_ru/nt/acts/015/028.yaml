  source_fidelity: 'В целом смысл передан верно: совместное одобрение Святым Духом и авторами письма, отказ возлагать дополнительное бремя и исключение для необходимых предписаний сохранены. Однако «никакого иного бремени» менее точно передаёт μηδὲν πλέον («никакого дальнейшего/большего бремени») и может намекать на уже названное иное бремя. Оборот «сочли правильным» допустим, но несколько слабее передаёт устойчивую формулу ἔδοξεν, чем «решили».'
