  yaml_path: translation/nt/acts/015/028.yaml
  text: For it seemed good to the Holy Spirit and to us to place on you no greater burden than these necessary things:[a][b]
translation:
  language: ru
  text: Ведь Святой Дух и мы решили не возлагать на вас никакого дальнейшего бремени, кроме этих необходимых предписаний:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Святому Духу и нам было угодно». Греческое выражение может употребляться как формула принятого решения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кроме этих необходимых вещей», «кроме этих обязательных требований» или «кроме этих существенных положений».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν
  choice: сочли правильным
  rationale: Передаёт формулу обдуманного и одобренного решения; в сочетании «Святой Дух и мы сочли» по-русски звучит естественнее, чем буквальное «показалось угодным», и не сводит решение к субъективному впечатлению.
- source_word: τῷ πνεύματι τῷ ἁγίῳ καὶ ἡμῖν
  choice: Святой Дух и мы
  rationale: Русская конструкция с подлежащими в именительном падеже естественно передаёт греческие дательные при ἔδοξεν и сохраняет параллельное участие Святого Духа и собрания в одобрении решения.
- source_word: μηδὲν πλέον
  choice: никакого иного
  rationale: В сочетании с «бременем» выражает отсутствие дополнительных обязательств сверх перечисляемых далее; «иного» естественно подводит к исключению с πλὴν.
- source_word: ἐπιτίθεσθαι ὑμῖν βάρος
  choice: возлагать на вас … бремени
  rationale: Сохраняет метафору возлагаемой тяжести и нормативный оттенок обязательств. Родительный падеж обусловлен отрицанием и нормативен для литературного русского языка.
- source_word: πλὴν
  choice: кроме
  rationale: Ясно вводит исключение после отрицательной конструкции.
- source_word: τούτων τῶν ἐπάναγκες
  choice: следующего необходимого
  rationale: Субстантивированное «необходимое» сохраняет неопределённость природы требований, а «следующего» естественно указывает вперёд на перечень в следующем стихе.
theological_decisions:
- issue: Соотношение Святого Духа и решения собрания
  choice: «Святой Дух и мы сочли правильным»
  alternative: «Святому Духу и нам было угодно» / «Святой Дух и мы решили»
  rationale: Формулировка сохраняет личную роль Святого Духа и совместное одобрение решения, не превращая слова ни в простую риторику человеческого согласия, ни в утверждение о безличном влиянии.
- issue: Обязательная сила постановления для верующих из язычников
  choice: «не возлагать … никакого иного бремени, кроме следующего необходимого»
  alternative: «не налагать никаких требований, кроме этих обязательных предписаний»
  rationale: Перевод сохраняет ограниченный объём постановления и напряжение между образом бремени и необходимостью перечисляемых требований, не вводя позднейших систематических выводов о законе и благодати.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. «Бремя» сохраняет исходную метафору и остаётся общеупотребительным. Порядок «Святой Дух и мы» воспроизводит акцент оригинала; двоеточие указывает на перечень в следующем стихе.
