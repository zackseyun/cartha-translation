  text: Ἰούδας τε καὶ Σιλᾶς, καὶ αὐτοὶ προφῆται ὄντες, διὰ λόγου πολλοῦ παρεκάλεσαν τοὺς ἀδελφοὺς καὶ ἐπεστήριξαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/032.yaml
  text: Judas and Silas[a], who were themselves prophets, encouraged the brothers at length and strengthened them.
translation:
  language: ru
  text: Иуда и Сила, будучи пророками, пространной речью ободрили братьев[a] и укрепили их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братьев и сестёр»; в греческом тексте стоит слово «братьев», которое может обозначать всю общину верующих.'
    reason: 'Лексическая альтернатива: возможное включительное употребление ἀδελφοὺς.'
lexical_decisions:
- source_word: Ἰούδας τε καὶ Σιλᾶς
  choice: Иуда и Сила
  rationale: Переданы традиционные русские формы личных имён; τε καὶ естественно выражено простым соединительным союзом «и».
- source_word: καὶ αὐτοὶ προφῆται ὄντες
  choice: сами будучи пророками
  rationale: Сохраняет причастную конструкцию и эмфатическое αὐτοὶ («сами»), не превращая фоновое пояснение в отдельное утверждение.
- source_word: διὰ λόγου πολλοῦ
  choice: долгой беседой
  rationale: Оборот буквально указывает на пространную речь. «Долгой беседой» естественно передаёт продолжительное устное наставление в данном контексте.
- source_word: παρεκάλεσαν
  choice: ободрили
  rationale: Передаёт контекстуальное значение утешительного и увещательного наставления, оставаясь понятным современному читателю.
- source_word: τοὺς ἀδελφοὺς
  choice: братьев
  rationale: Сохраняет грамматически мужскую форму греческого текста; возможный охват всей общины пояснён в сноске.
- source_word: ἐπεστήριξαν
  choice: укрепили их
  rationale: Точно передаёт значение утверждения и укрепления людей, сохраняя отличие от предшествующего «ободрили».
theological_decisions:
- issue: Охват существительного ἀδελφοὺς в контексте христианской общины
  choice: братьев
  alternative: братьев и сестёр; верующих
  rationale: Основной текст сохраняет мужскую форму оригинала, не исключая того, что в раннехристианском употреблении она могла обозначать всю общину, включая женщин; эта неоднозначность отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Формулировка сохраняет параллельные действия «ободрили» и «укрепили», а также подчёркнутое «сами».
