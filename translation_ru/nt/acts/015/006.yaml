  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Συνήχθησάν ⸀τε οἱ ἀπόστολοι καὶ οἱ πρεσβύτεροι ἰδεῖν περὶ τοῦ λόγου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/006.yaml
  text: So the apostles and the elders gathered together to consider this matter[a][b].
translation:
  language: ru
  text: Апостолы и старейшины собрались, чтобы рассмотреть этот вопрос.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сошлись»; буквально греческая форма может быть передана как «были собраны». В данном контексте она означает, что участники собрались вместе.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чтобы посмотреть относительно этого слова». Здесь «слово» означает обсуждаемый вопрос или дело.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνήχθησάν
  choice: собрались
  rationale: Аорист пассивной формы συνάγω здесь естественно описывает совместное собрание группы; возвратное русское «собрались» передаёт событие без неестественного «были собраны».
- source_word: τε
  choice: не выражено отдельно
  rationale: Частица слегка связывает стих с предшествующим повествованием. В русском эта связь достаточно ясно следует из контекста, а отдельное «итак» могло бы придать слишком сильный оттенок вывода.
- source_word: οἱ ἀπόστολοι
  choice: апостолы
  rationale: Устоявшееся и контекстуально точное обозначение признанных апостольских руководителей.
- source_word: οἱ πρεσβύτεροι
  choice: старейшины
  rationale: Слово обозначает признанных руководителей общины, а не просто пожилых мужчин; «старейшины» не навязывает устройство более поздних церковных институтов.
- source_word: ἰδεῖν
  choice: рассмотреть
  rationale: Буквально «увидеть», но в данной конструкции инфинитив выражает цель обсуждения и исследования вопроса. «Рассмотреть» естественно передаёт совещательный смысл, не предполагая заранее принятого решения.
- source_word: περὶ τοῦ λόγου τούτου
  choice: этот вопрос
  rationale: В контексте λόγος относится к предмету возникшего спора. «Этот вопрос» ясно передаёт смысл, тогда как буквальное «об этом слове» в современном русском вводило бы в заблуждение.
theological_decisions:
- issue: Институциональный оттенок πρεσβύτεροι на Иерусалимском собрании
  choice: «старейшины» без уточнения более поздней церковной должности
  alternative: «пресвитеры» как техническое название позднейшего церковного сана
  rationale: Текст говорит о признанных руководителях Иерусалимской общины, но сам по себе не определяет более позднюю конфессиональную систему церковного управления.
- issue: Совещательная цель собрания
  choice: «чтобы рассмотреть этот вопрос»
  alternative: «чтобы решить этот вопрос»
  rationale: ἰδεῖν указывает на принятие вопроса к рассмотрению; перевод не должен преждевременно представлять исход как уже предрешённый.
translation_notes:
  register: Современный литературный русский язык; краткая и достойная повествовательная формулировка. «Старейшины» сохраняет исторический оттенок без конфессиональной конкретизации, а «рассмотреть этот вопрос» естественно передаёт греческую идиому.
