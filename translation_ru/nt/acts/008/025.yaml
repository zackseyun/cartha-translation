  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διαμαρτυράμενοι καὶ λαλήσαντες τὸν λόγον τοῦ κυρίου ⸀ὑπέστρεφον εἰς ⸀Ἱεροσόλυμα, πολλάς τε κώμας τῶν Σαμαριτῶν ⸀εὐηγγελίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/025.yaml
  text: So[a], after they had solemnly testified and spoken the word of the Lord, they were returning to Jerusalem[b], and were proclaiming the good news in many Samaritan villages.
translation:
  language: ru
  text: Итак, засвидетельствовав и возвестив слово Господа, они возвращались в Иерусалим и благовествовали во многих самарянских селениях.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαμαρτυράμενοι
  choice: засвидетельствовав
  rationale: Передаёт серьёзный, настойчивый характер свидетельства, не сужая значение до предупреждения; совершенный вид уместен для предшествующего обстоятельства.
- source_word: λαλήσαντες
  choice: возвестив
  rationale: В сочетании с прямым дополнением «слово Господа» естественное русское «возвестив» передаёт публичное произнесение вести без лишнего уточнения её содержания.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: слово Господа
  rationale: Сохраняет традиционную и богословски ёмкую передачу λόγος, не заменяя её более толковательным «весть».
- source_word: ὑπέστρεφον
  choice: возвращались
  rationale: Несовершенный вид отражает длительный характер греческого имперфекта.
- source_word: Ἱεροσόλυμα
  choice: Иерусалим
  rationale: Общепринятая русская форма названия города.
- source_word: πολλάς τε κώμας τῶν Σαμαριτῶν
  choice: во многих самарянских селениях
  rationale: Естественно по-русски передаёт селения самарян; «селения» соответствует κώμας и не создаёт излишне сельскохозяйственного оттенка.
- source_word: εὐηγγελίζοντο
  choice: благовествовали
  rationale: Устоявшийся и понятный русский библейский глагол, передающий возвещение благой вести; несовершенный вид сохраняет имперфективность формы.
theological_decisions:
- issue: Подразумеваемое подлежащее
  choice: Сохранено местоимение «они» без называния действующих лиц.
  alternative: Прямо назвать Петра и Иоанна.
  rationale: Из ближайшего контекста понятны Пётр и Иоанн, однако греческий стих имён не повторяет; перевод не добавляет их в основной текст.
- issue: Связь возвращения и благовестия
  choice: Два имперфекта переданы однородными сказуемыми «возвращались… и благовествовали».
  alternative: Представить благовестие как завершённое до возвращения или как пояснение возвращения.
  rationale: Греческий текст допускает понимание этих действий как разворачивавшихся в одном повествовательном отрезке; параллельная передача сохраняет аспект и не устанавливает более узкую хронологию.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис сделан естественным и ясным; сохранены «слово Господа» и «благовествовали» как понятные русскому читателю библейские выражения.
