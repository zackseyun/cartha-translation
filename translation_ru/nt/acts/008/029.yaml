id: ACT.8.29
reference: Acts 8:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἶπεν δὲ τὸ πνεῦμα τῷ Φιλίππῳ· Πρόσελθε καὶ κολλήθητι τῷ ἅρματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/029.yaml
  text: Then the Spirit said to Philip[a], “Go over and join this chariot.”
translation:
  language: ru
  text: 'Тогда Дух сказал Филиппу: «Подойди и держись рядом с этой колесницей[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Подойди и присоединись к этой колеснице».'
    reason: Лексема κολλάομαι буквально выражает присоединение или тесное прикрепление; в данном контексте возможен как акцент на присоединении, так и на движении рядом.
lexical_decisions:
- source_word: εἶπεν
  choice: сказал
  rationale: Аорист λέγω в повествовании естественно передаётся глаголом «сказал», особенно перед прямой речью.
- source_word: δὲ
  choice: тогда
  rationale: Здесь δέ продолжает последовательность событий, не выражая сильного противопоставления; «тогда» естественно передаёт развитие повествования.
- source_word: τὸ πνεῦμα
  choice: Дух
  rationale: Сохранено исходное выражение без добавления слова «Святой»; в контексте Деяний речь идёт о Божьем Духе, поэтому употреблена прописная буква.
- source_word: τῷ Φιλίππῳ
  choice: Филиппу
  rationale: Дательный падеж обозначает адресата речи; имя передано в принятой русской форме.
- source_word: Πρόσελθε
  choice: подойди
  rationale: Императив προσέρχομαι обозначает движение к находящемуся поблизости объекту; «подойди» точно и естественно передаёт смысл.
- source_word: κολλήθητι
  choice: держись рядом с
  rationale: κολλάομαι передаёт тесное присоединение или нахождение вплотную. В отношении движущейся колесницы «держись рядом с» естественно выражает требуемое близкое следование, не сводя действие к одноразовому приближению.
- source_word: τῷ ἅρματι τούτῳ
  choice: с этой колесницей
  rationale: ἅρμα обозначает колесницу или повозку; «колесница» соответствует историческому контексту и устойчивому русскому словоупотреблению. Указательное τούτῳ передано словом «этой».
theological_decisions:
- issue: Кого обозначает τὸ πνεῦμα
  choice: «Дух» как личный Божий Дух
  alternative: неуточнённое духовное побуждение
  rationale: В Деяниях «Дух», дающий верующим прямые указания, последовательно выступает как личный Божий Дух. При этом перевод не добавляет отсутствующее в данной фразе определение «Святой».
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Формулировка прямой речи краткая и повелительная; «колесница» сохраняет исторический и библейский регистр без архаизации синтаксиса.
