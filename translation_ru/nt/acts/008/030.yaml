  text: προσδραμὼν δὲ ὁ Φίλιππος ἤκουσεν αὐτοῦ ἀναγινώσκοντος ⸂Ἠσαΐαν τὸν προφήτην⸃ καὶ εἶπεν· Ἆρά γε γινώσκεις ἃ ἀναγινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/030.yaml
  text: So Philip ran up and heard him reading Isaiah the prophet[a], and said, “Do you really understand what you are reading?”
translation:
  language: ru
  text: 'Филипп подбежал и услышал, что тот читает пророка Исаию. Он спросил: «Понимаешь ли ты то, что читаешь?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Действительно ли ты понимаешь то, что читаешь?» Греческие частицы придают вопросу Филиппа дополнительную выразительность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδραμὼν
  choice: подбежал
  rationale: Аористное причастие προστρέχω передаёт быстрое движение к колеснице; «подбежал» сохраняет живость повествования и естественно звучит по-русски.
- source_word: δὲ
  choice: связь передана последовательностью повествования без отдельного союза
  rationale: δέ обозначает переход к следующему действию; в современном русском такая связь естественно выражается порядком предложений.
- source_word: ἤκουσεν αὐτοῦ ἀναγινώσκοντος
  choice: услышал, что тот читает
  rationale: Конструкция ἀκούω с родительным причастия указывает, что Филипп услышал человека в процессе чтения. Чтение вслух подразумевается ситуацией, но прямо в греческом не выражено.
- source_word: Ἠσαΐαν τὸν προφήτην
  choice: пророка Исаию
  rationale: Естественный русский порядок слов точно обозначает читаемую книгу или текст пророка Исаии.
- source_word: εἶπεν
  choice: спросил
  rationale: Хотя буквальное значение — «сказал», последующая прямая вопросительная реплика делает «спросил» наиболее естественной передачей речевого действия.
- source_word: Ἆρά γε
  choice: ли; усилительный оттенок отмечен в сноске
  rationale: Сочетание частиц придаёт вопросу подчёркнутый, испытующий оттенок. В основном тексте естественная русская вопросительная конструкция с «ли» не перегружает реплику, а оттенок сохранён в сноске.
- source_word: γινώσκεις
  choice: понимаешь
  rationale: В контексте речь идёт об осмыслении читаемого, а не просто о знании или узнавании.
- source_word: ἃ ἀναγινώσκεις
  choice: то, что читаешь
  rationale: Относительное местоимение обозначает содержание читаемого, а настоящее время передаёт продолжающееся действие.
