  source_fidelity: 'Текст точно передаёт последовательность действий: Филипп быстро приблизился, услышал человека за чтением пророка Исаии и обратился к нему с вопросом. «Подбежал» удачно отражает προσδραμών; «услышал, что тот читает» передаёт конструкцию ἤκουσεν αὐτοῦ ἀναγινώσκοντος, не добавляя явно не выраженного слова «вслух». «Понимаешь ли ты то, что читаешь?» верно передаёт смысл γινώσκεις и ἃ ἀναγινώσκεις.'
