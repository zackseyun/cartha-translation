  text: ἡ δὲ περιοχὴ τῆς γραφῆς ἣν ἀνεγίνωσκεν ἦν αὕτη· Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ ⸀κείραντος αὐτὸν ἄφωνος, οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/032.yaml
  text: 'The passage of Scripture that he was reading was this: “Like a sheep he was led to slaughter[a], and like a lamb before the one shearing it is silent[b], so he does not open his mouth.”'
translation:
  language: ru
  text: 'Отрывок из Писания, который он читал, был таким: «Как овцу, его вели на заклание[a], и как ягнёнок безмолвен перед стригущим его[b], так он не открывает уст своих».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на убой».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «перед стригущим»; буквально: «перед тем, кто стриг его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιοχὴ τῆς γραφῆς
  choice: отрывок из Писания
  rationale: В данном контексте περιοχή обозначает определённый фрагмент священного текста; «отрывок из Писания» естественно и точно передаёт смысл.
- source_word: ἀνεγίνωσκεν
  choice: читал
  rationale: Русская конструкция «который он читал» в контексте передаёт продолженное действие имперфекта без тяжеловесного «был читающим».
- source_word: Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη
  choice: Как овца, он был ведён на заклание
  rationale: Сохранены сравнение, страдательный залог и движение к умерщвлению; «заклание» уместно в возвышенной библейской цитате и остаётся понятным.
- source_word: ἀμνὸς
  choice: ягнёнок
  rationale: Сохраняется отличие от более общего πρόβατον («овца»).
- source_word: ἐναντίον τοῦ κείραντος αὐτὸν ἄφωνος
  choice: безмолвен перед стригущим его
  rationale: Передаёт причастную конструкцию буквально и при этом сохраняет поэтическую плавность; «безмолвен» отражает ἄφωνος.
- source_word: οὐκ ἀνοίγει τὸ στόμα αὐτοῦ
  choice: он не открывает уст своих
  rationale: Сохранено настоящее время греческой цитаты; «уста» соответствует достоинству и поэтическому регистру цитаты из Писания.
theological_decisions:
- issue: Мессианское применение цитаты из Исайи 53 к Иисусу в контексте
  choice: Сохранить буквальную форму сравнения, не называя Иисуса непосредственно в этом стихе
  alternative: Явно обозначить страдающего раба как Иисуса
  rationale: Сам стих приводит текст Писания, тогда как его христологическое истолкование развивается в последующем контексте; перевод не должен заранее разрешать эту связь поясняющей вставкой.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным регистром внутри цитаты из Писания. «Вот» естественно вводит указательное αὕτη, не добавляя отсутствующего временного маркера. Все сноски отмечены в основном тексте.
