id: ACT.8.14
reference: Acts 8:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ οἱ ἐν Ἱεροσολύμοις ἀπόστολοι ὅτι δέδεκται ἡ Σαμάρεια τὸν λόγον τοῦ θεοῦ, ἀπέστειλαν πρὸς ⸀αὐτοὺς Πέτρον καὶ Ἰωάννην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/014.yaml
  text: When the apostles in Jerusalem heard that Samaria had received the word of God, they sent Peter and John to them,
translation:
  language: ru
  text: Когда апостолы, находившиеся в Иерусалиме, услышали, что Самария приняла слово Божье, они послали к ним Петра и Иоанна.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Когда ... услышали
  rationale: Аористное причастие обозначает обстоятельство, предшествующее главному действию; конструкция с «когда» естественна по-русски. Частица δέ здесь лишь продолжает повествование и не требует отдельного слова.
- source_word: οἱ ἐν Ἱεροσολύμοις ἀπόστολοι
  choice: апостолы, находившиеся в Иерусалиме
  rationale: Передаёт местонахождение апостолов без двусмысленного впечатления, будто речь идёт об особой группе «иерусалимских апостолов».
- source_word: δέδεκται
  choice: приняла
  rationale: Перфект δέχομαι выражает состоявшийся приём слова с сохраняющимся результатом; русский совершенный вид естественно передаёт это в повествовании.
- source_word: ἡ Σαμάρεια
  choice: Самария
  rationale: 'Сохранена греческая метонимия: название местности обозначает её жителей.'
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: слово Божье
  rationale: Сохраняет ключевое новозаветное выражение и его богословскую ёмкость, оставаясь понятным современному читателю.
- source_word: ἀπέστειλαν πρὸς αὐτοὺς
  choice: они послали к ним
  rationale: Прямо и естественно передаёт простое прошедшее действие и направление.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: Петра и Иоанна
  rationale: Употреблены традиционные русские формы библейских имён в требуемом винительном падеже.
theological_decisions:
- issue: Метонимическое употребление названия «Самария»
  choice: Самария приняла слово Божье
  alternative: самаряне приняли слово Божье
  rationale: Греческий текст называет Самарию, используя название места собирательно. Сохранение метонимии точнее отражает форму источника и не сужает её до специально уточнённой группы.
- issue: Передача λόγος
  choice: слово Божье
  alternative: Божья весть
  rationale: «Слово Божье» сохраняет устойчивое библейское выражение и богословскую многозначность оригинала, не сводя λόγος исключительно к понятию сообщения.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским регистром. Порядок слов слегка адаптирован ради естественности; запятые вокруг причастного оборота соответствуют русской норме. «Божье» выбрано как современная литературная форма, менее архаичная, чем «Божие».
