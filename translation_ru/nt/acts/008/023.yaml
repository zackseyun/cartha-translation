base_translation:
  language: en
  yaml_path: translation/nt/acts/008/023.yaml
  text: For I see that you are in the gall of bitterness and the bond of unrighteousness[a][b].
translation:
  language: ru
  text: Ведь я вижу, что ты исполнен горькой желчи и находишься в узах неправедности[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также можно перевести: «в оковах беззакония» или «в цепях несправедливости».'
    reason: lexical_alternative
  - marker: b
    text: «Горькая желчь» — яркая метафора, вероятно перекликающаяся с ветхозаветным образом ядовитой горечи (ср. Второзаконие 29:18 по Септуагинте).
    reason: cross_reference
lexical_decisions:
- source_word: εἰς
  choice: исполнен… и скован
  rationale: В сочетании с ὁρῶ σε ὄντα предлог описывает состояние Симона. По-русски это естественно передаётся не единообразным предлогом, а оборотами, подходящими к каждой из двух метафор.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит основание предшествующего увещания; «ведь» естественно сохраняет пояснительно-причинную связь.
- source_word: χολὴν πικρίας
  choice: исполнен горькой желчи
  rationale: Сохранён яркий образ желчи и возможный отзвук Второзакония 29:18 по Септуагинте. «Горькая желчь» звучит по-русски естественнее буквального «желчь горечи», не сводя метафору просто к озлобленности.
- source_word: σύνδεσμον ἀδικίας
  choice: скован неправедностью
  rationale: σύνδεσμος обозначает то, что связывает или сковывает, а ἀδικία — неправедность, беззаконие либо несправедливость. Формулировка сохраняет образ нравственной несвободы.
- source_word: ὁρῶ
  choice: я вижу
  rationale: Сохранено прямое значение глагола, которое в данном контексте также естественно выражает распознавание состояния человека.
- source_word: σε ὄντα
  choice: что ты
  rationale: Винительный падеж с причастием после ὁρῶ естественно передан русским придаточным изъяснительным.
theological_decisions:
- issue: Метафорическое описание духовно-нравственного состояния Симона
  choice: 'Сохранены два резких образа: горькая желчь и скованность неправедностью.'
  alternative: 'Передать толковательно: «ты полон ядовитой горечи и находишься в плену греха».'
  rationale: Греческий текст метафоричен и не даёт развёрнутого догматического объяснения. Выбранный перевод сохраняет образность и напряжение, не уточняя сверх текста природу этого состояния.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис естественный, но ключевые метафоры оригинала сохранены; архаическое «ибо» заменено на «ведь».
