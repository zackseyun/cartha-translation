  verdict: revise
  source_fidelity: 'Смысл передан в целом верно: γάρ сохранён как причинно-пояснительное «ведь», ὁρῶ σε ὄντα естественно передано придаточным, а оба резких образа не сведены к отвлечённому «греху». Однако «скован неправедностью» несколько меняет конструкцию σύνδεσμον ἀδικίας: образ «уз/связи неправедности» превращается в утверждение, что неправедность выступает орудием, которым Симона сковали. Более близкое и столь же естественное «находишься в узах неправедности» сохраняет метафору и оставляет её связь с εἰς более прозрачной.'
  naturalness: «Ведь я вижу, что ты…» — естественный современный литературный русский. «Исполнен горькой желчи» понятно и сохраняет намеренно необычный, библейски насыщенный образ. «Находишься в узах неправедности» звучит достойно и ясно, без ненужной архаизации.
  terminology: «Неправедность» адекватно передаёт ἀδικία в данном нравственном контексте, не навязывая более узкое «беззаконие» или социально окрашенную «несправедливость». «Узы» точно передают σύνδεσμος как то, что связывает. Примечание о возможной перекличке с Второзаконием 29:18 LXX следует сохранить как осторожное, а не как утверждение о прямой цитате.
