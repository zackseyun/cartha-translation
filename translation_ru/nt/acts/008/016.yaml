  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀οὐδέπω γὰρ ἦν ἐπ’ οὐδενὶ αὐτῶν ἐπιπεπτωκός, μόνον δὲ βεβαπτισμένοι ὑπῆρχον εἰς τὸ ὄνομα τοῦ ⸀κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/016.yaml
  text: For he had not yet fallen upon any of them[b][a]; they had only been baptized into the name of the Lord Jesus.
translation:
  language: ru
  text: Ведь Он ещё не сошёл ни на кого из них; они были только крещены во имя Господа Иисуса.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в имя Господа Иисуса».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέπω
  choice: ещё не
  rationale: 'Естественно передаёт временное значение: до того момента действие не произошло.'
- source_word: ἐπ’ οὐδενὶ αὐτῶν
  choice: ни на кого из них
  rationale: Сохраняет сочетание ἐπί с дательным и пространственный образ схождения Духа на людей.
- source_word: ἐπιπεπτωκός
  choice: сошёл
  rationale: В контексте Духа глагол ἐπιπίπτω буквально содержит образ падения или обрушения на кого-либо, но по-русски «сошёл на» естественно и точно передаёт явление, не создавая нежелательного оттенка случайного падения.
- source_word: μόνον
  choice: только
  rationale: Ясно выражает ограничение и контраст между уже совершившимся крещением и ещё не произошедшим схождением Духа.
- source_word: βεβαπτισμένοι ὑπῆρχον
  choice: были только крещены
  rationale: Передаёт перифрастическую конструкцию, обозначающую состояние как результат ранее совершённого крещения, и звучит естественно по-русски.
- source_word: εἰς τὸ ὄνομα
  choice: во имя
  rationale: Это устойчивое и понятное русское выражение в контексте крещения; более буквальное «в имя» сохранено в примечании.
- source_word: κυρίου Ἰησοῦ
  choice: Господа Иисуса
  rationale: Точно передаёт титул κύριος и имя Ἰησοῦ в естественной русской форме.
theological_decisions:
- issue: Подразумеваемое подлежащее при ἐπιπεπτωκός
  choice: Местоимение «Он», отсылающее к Святому Духу в предыдущем стихе
  alternative: Повторить «Святой Дух» либо перестроить фразу без явного подлежащего
  rationale: В греческом подлежащее не повторено, поскольку оно ясно из непосредственного контекста. Русское личное местоимение сохраняет эту связность, не добавляя нового толкования.
- issue: Формулировка крещения с εἰς τὸ ὄνομα
  choice: «во имя Господа Иисуса»
  alternative: «в имя Господа Иисуса»
  rationale: Устойчивое русское «во имя» не навязывает вывода о позднейших спорах относительно формулы или богословия крещения; буквальная предложная форма отмечена отдельно.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. «Сошёл на» сохраняет образ движения Духа и звучит естественнее буквального «пал на». Заглавное «Он» ясно отсылает к Святому Духу, названному в предыдущем стихе.
