  yaml_path: translation/nt/acts/008/011.yaml
  text: And they paid attention to him because for a considerable time he had amazed them with his magic arts[a][b].
translation:
  language: ru
  text: А они обращали на него внимание, потому что он в течение долгого времени приводил их в изумление своими магическими искусствами.[a][b]
  philosophy: optimal-equivalence
