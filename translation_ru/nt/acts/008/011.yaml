    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: слушали
  rationale: В данном контексте προσέχω с дательным обозначает внимать человеку, прислушиваться к нему. «Слушали» естественно по-русски передаёт направленное и продолжающееся внимание.
- source_word: αὐτῷ
  choice: его
  rationale: Дательный объект при προσέχω в русском естественно передаётся прямым дополнением при глаголе «слушать».
- source_word: διὰ τὸ ἱκανῷ χρόνῳ
  choice: потому, что ... уже долгое время
  rationale: διά с субстантивированным инфинитивом выражает причину, а ἱκανῷ χρόνῳ — значительную продолжительность. «Уже долгое время» звучит естественно и сохраняет смысл длительности.
- source_word: ταῖς μαγείαις
  choice: своими магическими искусствами
  rationale: μαγεῖαι обозначает магические занятия или практики. Формулировка не уточняет, были ли они обманом, оккультной деятельностью или сочетанием того и другого; притяжательное «своими» ясно из контекста.
- source_word: ἐξεστακέναι
  choice: изумлял
  rationale: Перфектный инфинитив ἐξίστημι указывает на произведённое и сохранявшееся впечатление сильного изумления. В сочетании с длительным периодом русский несовершенный вид естественно выражает повторявшееся или продолжавшееся воздействие.
- source_word: αὐτούς
  choice: их
  rationale: Прямое дополнение при ἐξεστακέναι, относящееся к ранее упомянутым людям.
theological_decisions:
- issue: Характер занятий Симона, обозначенных словом μαγείαις
  choice: магическими искусствами
  alternative: колдовством; магией
  rationale: Перевод сохраняет описание магических практик, но не определяет сверх сказанного в стихе, были ли они обманными приёмами, оккультной деятельностью или тем и другим.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю. Начальное «А» передаёт связующее δέ. Порядок слов сохраняет причинную структуру греческого текста без излишней буквальности.
