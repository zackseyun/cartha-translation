source:
  edition: SBLGNT
  text: ᾧ προσεῖχον ⸀πάντες ἀπὸ μικροῦ ἕως μεγάλου λέγοντες· Οὗτός ἐστιν ἡ Δύναμις τοῦ θεοῦ ἡ ⸀καλουμένη Μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/010.yaml
  text: They all paid attention to him[a], from the least to the greatest, saying, “This man is the power of God that is called Great.”
translation:
  language: ru
  text: 'Все они, от мала до велика, внимательно слушали его и говорили: «Этот человек — сила Божья, которую называют Великой».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Это — Великая сила Божья». Греческое выражение допускает более компактную передачу как титула.'
    reason: alternative_reading
lexical_decisions:
- source_word: ᾧ προσεῖχον
  choice: внимательно слушали его
  rationale: В контексте выступлений Симона προσέχω означает направлять на него пристальное внимание и внимать его словам; такой перевод естественен по-русски и не подразумевает преданности.
- source_word: πάντες
  choice: все они
  rationale: Передаёт всеохватность явного греческого πάντες и естественно обозначает жителей, упомянутых в контексте.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: от мала до велика
  rationale: Устойчивое русское выражение сохраняет меризм и охватывает людей любого общественного положения.
- source_word: λέγοντες
  choice: и говорили
  rationale: Передаёт одновременное с основным действием причастие естественной русской сочинительной конструкцией.
- source_word: Οὗτός
  choice: этот человек
  rationale: Указательное местоимение относится к Симону; «этот человек» ясно и естественно передаёт личное отнесение.
- source_word: ἡ Δύναμις τοῦ θεοῦ
  choice: та сила Божья
  rationale: Сохраняет определённый и близкий к титульному характер выражения, не превращая слова толпы в утверждение повествователя.
- source_word: ἡ καλουμένη Μεγάλη
  choice: которую называют Великой
  rationale: Передаёт пассивное значение καλουμένη и сохраняет «Великой» как наименование силы, не устраняя необычность исходной формулировки.
theological_decisions:
- issue: Передавать ли слова толпы как формальный божественный титул или как описание Симона
  choice: 'Сохранить прямое утверждение толпы: «Этот человек — та сила Божья, которую называют Великой»'
  alternative: «Это так называемая Великая сила Божья»
  rationale: Греческий текст сообщает мнение людей о Симоне, не подтверждая его со стороны повествователя. Основной перевод сохраняет личное указание Οὗτός и титулоподобную конструкцию, а примечание отмечает допустимую более компактную передачу.
translation_notes:
  register: Современный литературный русский язык; тон ясный и достойный. Устойчивое «от мала до велика» сохраняет образность оригинала. Необычная титулоподобная формула намеренно не сглажена полностью.
