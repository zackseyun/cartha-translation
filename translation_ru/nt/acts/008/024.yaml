  text: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν· Δεήθητε ὑμεῖς ὑπὲρ ἐμοῦ πρὸς τὸν κύριον ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ ὧν εἰρήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/024.yaml
  text: But Simon answered[a], “You pray to the Lord for me, so that nothing of what you have said may come upon me.”
translation:
  language: ru
  text: 'Но Симон сказал в ответ: «Вы помолитесь Господу обо мне, чтобы со мной не случилось ничего из сказанного вами».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: сказал в ответ
  rationale: Греческая идиома вводит ответную реплику; по-русски «сказал в ответ» естественно передаёт оба элемента без тяжеловесного удвоения.
- source_word: δὲ
  choice: Но
  rationale: Передаёт мягкий контраст между обличением Петра и ответом Симона.
- source_word: Δεήθητε
  choice: помолитесь
  rationale: В контексте это просьба к Петру и Иоанну ходатайствовать перед Господом; совершенный вид уместно передаёт аористный императив как конкретное настоятельное действие.
- source_word: ὑμεῖς
  choice: Вы
  rationale: Отдельное местоимение в греческом подчёркивает, что молиться должны именно собеседники Симона; русское выраженное «вы» сохраняет этот акцент.
- source_word: ὑπὲρ ἐμοῦ
  choice: обо мне
  rationale: Естественное русское управление при глаголе «молиться», выражающее ходатайство за Симона.
- source_word: πρὸς τὸν κύριον
  choice: Господу
  rationale: Русский дательный при «молиться» естественно передаёт направленность молитвы к Господу.
- source_word: ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ
  choice: чтобы со мной не случилось ничего
  rationale: Передаёт желаемое предотвращение грозящего Симону последствия; «случилось со мной» звучит современно и естественно, сохраняя неблагоприятный смысл контекста.
- source_word: ὧν εἰρήκατε
  choice: из того, о чём вы сказали
  rationale: Сохраняет соотнесённость с произнесённым предупреждением и естественно передаёт генитивную относительную конструкцию.
theological_decisions:
- issue: Кого обозначает τὸν κύριον
  choice: Господь
  alternative: Бог; Господь Иисус
  rationale: Греческий текст не уточняет референта. Перевод «Господь» сохраняет исходную степень определённости и не снимает возможную богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Реплика сохраняет акцент на «вы» и просьбу о ходатайстве, не добавляя оценки искренности Симона. Буквальное «да не придёт на меня» уступило более естественному «чтобы со мной не случилось», при сохранении смысла грозящего суда.
