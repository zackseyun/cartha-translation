base_translation:
  language: en
  yaml_path: translation/nt/acts/008/033.yaml
  text: In his humiliation justice was taken away from him[b][a]. Who will recount his generation? For his life is taken from the earth.
translation:
  language: ru
  text: В унижении Его лишили правосудия[b]. Кто расскажет о Его поколении[a]? Ведь Его жизнь отнимается от земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о Его потомках»; или: «о Его современниках». Греческое слово «поколение» сохраняет неоднозначность цитаты из Ис 53.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Он был лишён суда».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώσει
  choice: в Его унижении
  rationale: Существительное обозначает состояние униженности или умаления. Формулировка сохраняет образ исходного текста и не уточняет сверх него характер страдания.
- source_word: κρίσις
  choice: правосудие
  rationale: В данном контексте слово указывает на справедливое судебное разбирательство или должную справедливость, которой Он был лишён. В сноске сохранён более формальный вариант «суд».
- source_word: ἤρθη
  choice: было у Него отнято
  rationale: Пассивная форма передаёт удаление или лишение; добавление «у Него» естественно выражает это по-русски и сохраняет αὐτοῦ.
- source_word: γενεὰν
  choice: поколении
  rationale: «Поколение» сохраняет лексическую и толковательную неоднозначность цитаты из Ис 53 и не сводит её ни к потомкам, ни к современникам.
- source_word: διηγήσεται
  choice: расскажет
  rationale: Глагол означает подробно повествовать или излагать; «расскажет» естественно звучит в русском риторическом вопросе.
- source_word: αἴρεται
  choice: забирают
  rationale: Настоящее время греческого пассива создаёт живую картину происходящего. Неопределённо-личная русская конструкция естественно передаёт пассив, не называя действующее лицо.
- source_word: γῆς
  choice: земли
  rationale: В сочетании с отнятием жизни «земля» обозначает земной мир и соответствует образу исходного текста.
- source_word: ζωὴ
  choice: жизнь
  rationale: В контексте страданий Раба речь непосредственно идёт о физической жизни.
theological_decisions:
- issue: Значение выражения «Его поколение»
  choice: Сохранить в основном тексте неоднозначное «Его поколение».
  alternative: «Его потомки» или «Его современники».
  rationale: Фраза из Ис 53 допускает разные толкования. Основной текст не разрешает эту богословски значимую трудность, а возможные значения вынесены в сноску.
- issue: Значение κρίσις
  choice: Перевести как «правосудие».
  alternative: «Суд».
  rationale: Контекст позволяет понимать слово как справедливость или справедливое судебное разбирательство, которого страдалец был лишён. Более буквальная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. Синтаксис сохраняет поэтическую сжатость и риторический вопрос; неоднозначные места не подвергаются конфессиональному истолкованию.
