  text: προσεῖχον ⸀δὲ οἱ ὄχλοι τοῖς λεγομένοις ὑπὸ τοῦ Φιλίππου ὁμοθυμαδὸν ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/006.yaml
  text: And the crowds with one accord paid close attention to what was being said by Philip[b][a], as they heard him and saw the signs that he was doing.
translation:
  language: ru
  text: Толпы же единодушно[b] внимали[a] тому, что говорил Филипп, слыша и видя знамения, которые он совершал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обращали пристальное внимание на»; «прислушивались к».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все вместе»; греческое слово подчёркивает их общий, согласный отклик.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: внимали
  rationale: Глагол передаёт направленное и продолжительное внимание; несовершенный вид «внимали» естественно отражает имперфект.
- source_word: δὲ
  choice: же
  rationale: Мягкая повествовательная связка без подчёркнутого противопоставления.
- source_word: οἱ ὄχλοι
  choice: толпы
  rationale: Сохраняет множественное число и обозначение собравшихся групп людей.
- source_word: τοῖς λεγομένοις ὑπὸ τοῦ Φιλίππου
  choice: тому, что говорил Филипп
  rationale: Естественно передаёт содержание речи и выраженную конструкцией ὑπό принадлежность действия Филиппу, не превращая её в более истолковывающее «проповедь».
- source_word: ὁμοθυμαδὸν
  choice: единодушно
  rationale: Передаёт общий, согласный отклик собравшихся, а не просто одновременность их действий.
- source_word: ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν
  choice: слыша и видя
  rationale: 'В данной конструкции αὐτούς естественно понимать как винительный субъект инфинитивов, то есть толпы: они слышали и видели. Русские деепричастия ясно соотносятся с подлежащим «толпы».'
- source_word: τὰ σημεῖα
  choice: знамения
  rationale: Традиционное и точное библейское соответствие, сохраняющее значение знака и не добавляющее поясняющего «чудесные».
- source_word: ἃ ἐποίει
  choice: которые он совершал
  rationale: «Совершал» естественно сочетается со «знамениями», а несовершенный вид передаёт продолжающееся действие имперфекта.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно библейской лексикой. «Внимали» и «знамения» сохраняют достоинство стиля, оставаясь понятными; синтаксис сделан плавным и не снимает смыслового акцента на единодушной реакции толп.
