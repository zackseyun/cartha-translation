  verdict: approve
  source_fidelity: 'Текст точно передаёт основной смысл SBLGNT: толпы единодушно уделяли внимание словам Филиппа, слыша и видя совершаемые им знамения. Несовершенный характер προσεῖχον и ἐποίει удачно отражён формами «внимали» и «совершал». Формулировка «слыша и видя» обоснованно не уточняет объект при «слыша»: αὐτούς в данном месте текстологически и синтаксически непрост, тогда как английское audit-решение «heard him» вводит единственное число, которого в данном тексте SBLGNT нет.'
