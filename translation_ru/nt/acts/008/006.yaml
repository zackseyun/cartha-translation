  terminology: «Единодушно» точно передаёт ὁμοθυμαδόν; «знамения» является уместным традиционным соответствием σημεῖα без добавления толкования «чудесные». «Внимали» хорошо передаёт προσέχω в контексте внимательного, длительного отклика.
