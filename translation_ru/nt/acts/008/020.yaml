source:
  edition: SBLGNT
  text: Πέτρος δὲ εἶπεν πρὸς αὐτόν· Τὸ ἀργύριόν σου σὺν σοὶ εἴη εἰς ἀπώλειαν ὅτι τὴν δωρεὰν τοῦ θεοῦ ἐνόμισας διὰ χρημάτων κτᾶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/020.yaml
  text: But Peter said to him[a], “May your silver perish with you[b], because you thought you could acquire the gift of God with money.”
translation:
  language: ru
  text: 'Но Пётр сказал ему: «Серебро твоё да погибнет вместе с тобой, потому что ты подумал, будто дар Божий можно приобрести за деньги».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀργύριόν
  choice: серебро
  rationale: Буквальное значение — «серебро», в данном контексте также обозначающее деньги. Конкретный образ сохранён, а последующее διὰ χρημάτων естественно передано как «за деньги».
- source_word: σὺν σοὶ
  choice: вместе с тобой
  rationale: Прямо и естественно передаёт связь участи серебра с участью Симона в суровом высказывании Петра.
- source_word: εἴη εἰς ἀπώλειαν
  choice: да погибнет
  rationale: Оптатив выражает пожелание или суровое провозглашение; конструкция «да погибнет» сохраняет эту силу, не превращая фразу в простое предсказание и не уточняя её как формулу вечного осуждения.
- source_word: δωρεὰν τοῦ θεοῦ
  choice: дар Божий
  rationale: Естественное и краткое соответствие, сохраняющее противопоставление дара покупке.
- source_word: ἐνόμισας
  choice: ты подумал
  rationale: Прямо передаёт значение «думать, полагать» и соответствует резкому обращению Петра.
- source_word: διὰ χρημάτων
  choice: за деньги
  rationale: В русском языке это наиболее естественный способ обозначить плату как средство приобретения.
- source_word: κτᾶσθαι
  choice: можно приобрести
  rationale: Передаёт приобретение или получение во владение, не усиливая само по себе коммерческий оттенок сверх уже выраженного словами «за деньги».
- source_word: δὲ
  choice: но
  rationale: Передаёт контраст между просьбой Симона в предыдущем стихе и ответом Петра.
theological_decisions:
- issue: Характер слов Петра о гибели Симона и его серебра
  choice: 'Суровое пожелание или провозглашение гибели: «да погибнет вместе с тобой»'
  alternative: Простое предсказание гибели либо более определённая формула вечного осуждения
  rationale: Оптатив εἴη лучше сохраняется как пожелание или импрекация. Перевод передаёт суровость слов, но не вносит более конкретного учения об окончательном осуждении, чем выражено в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной конструкцией «да погибнет». Слово «серебро» сохраняет конкретный образ оригинала; «за деньги» звучит естественно и ясно. Подстрочные примечания не требуются.
