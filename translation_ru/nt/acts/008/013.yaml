  text: ὁ δὲ Σίμων καὶ αὐτὸς ἐπίστευσεν, καὶ βαπτισθεὶς ἦν προσκαρτερῶν τῷ Φιλίππῳ, θεωρῶν τε ⸂σημεῖα καὶ δυνάμεις μεγάλας γινομένας⸃ ἐξίστατο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/013.yaml
  text: And Simon himself also believed[a], and after being baptized he continued with Philip, and as he saw signs and great works of power happening, he was amazed.
translation:
  language: ru
  text: Сам Симон тоже поверил и, приняв крещение, постоянно оставался с Филиппом. Видя совершающиеся знамения и великие проявления силы[a], он изумлялся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великие чудеса». Греческое слово может обозначать как проявления силы, так и чудесные деяния.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: и сам
  rationale: 'Передаёт одновременно добавочное значение καί и эмфатическое значение αὐτός: даже сам Симон также откликнулся.'
- source_word: ἐπίστευσεν
  choice: поверил
  rationale: Прямо передаёт аорист πιστεύω, не решая за читателя вопрос о характере или подлинности веры Симона.
- source_word: βαπτισθεὶς
  choice: приняв крещение
  rationale: Естественно по-русски передаёт предшествующее действие аористного страдательного причастия без добавления богословской оценки.
- source_word: ἦν προσκαρτερῶν τῷ Φιλίππῳ
  choice: неотступно следовал за Филиппом
  rationale: Передаёт длительность перифрастического имперфекта и устойчивую привязанность Симона к Филиппу; дательный понимается как указание на лицо, возле которого он постоянно оставался.
- source_word: θεωρῶν
  choice: видя
  rationale: Сохраняет причастный строй и указывает на продолжающееся наблюдение, вызвавшее изумление.
- source_word: σημεῖα
  choice: знамения
  rationale: Традиционный и понятный библейский термин, сохраняющий указующий, свидетельствующий оттенок слова.
- source_word: δυνάμεις μεγάλας
  choice: великие проявления силы
  rationale: Сохраняет связь δυνάμεις с силой и не сводит выражение безоговорочно к более узкому понятию чудес.
- source_word: γινομένας
  choice: совершающиеся
  rationale: Передаёт происходящие на глазах Симона события и согласуется сразу со знамениями и проявлениями силы.
- source_word: ἐξίστατο
  choice: изумлялся
  rationale: Имперфект передан как продолжавшееся состояние сильного удивления.
theological_decisions:
- issue: Определяет ли ἐπίστευσεν подлинность обращения Симона
  choice: поверил
  alternative: искренне уверовал / лишь заявил о вере
  rationale: Греческий текст утверждает, что Симон поверил, но сам по себе этот глагол здесь не разрешает дальнейший повествовательный и богословский вопрос о качестве его веры.
- issue: Следует ли δυνάμεις прямо толковать как чудеса
  choice: проявления силы
  alternative: чудеса
  rationale: Более буквальное выражение сохраняет смысл могущественных деяний и не устраняет лексическую широту термина.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Предложение разделено на две части ради естественного русского ритма; длительность действий сохранена формами «неотступно следовал» и «изумлялся».
