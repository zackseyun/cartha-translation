  yaml_path: translation/nt/acts/008/015.yaml
  text: who came down and prayed for them so that they might receive the Holy Spirit[a][b].
translation:
  language: ru
  text: которые, сойдя, помолились о них, чтобы они приняли Святого Духа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵτινες
  choice: которые
  rationale: Относительное местоимение продолжает фразу предыдущего стиха и относится к Петру и Иоанну; «которые» естественно передаёт эту связь.
- source_word: καταβάντες
  choice: придя туда
  rationale: Аористное причастие обозначает действие, предшествующее молитве. В данном контексте буквальное направление «сойдя» по-русски звучало бы неестественно без пояснения, поэтому выбрано идиоматическое «придя туда».
- source_word: προσηύξαντο
  choice: помолились
  rationale: Аорист προσεύχομαι прямо обозначает совершённое действие молитвы; возвратная по форме греческая конструкция не требует особой передачи.
- source_word: περὶ αὐτῶν
  choice: о них
  rationale: περί с родительным при глаголе молитвы обозначает тех, за кого молятся; русское «помолились о них» сохраняет ход исходной фразы и ходатайственный смысл.
- source_word: ὅπως
  choice: чтобы
  rationale: Союз вводит цель молитвы; «чтобы» естественно сохраняет целевое значение.
- source_word: λάβωσιν
  choice: они приняли
  rationale: Аорист сослагательного наклонения после ὅπως выражает предполагаемое достижение цели. В русском придаточном с «чтобы» форма прошедшего времени передаёт это значение без добавления оттенка неуверенности.
- source_word: πνεῦμα ἅγιον
  choice: Святого Духа
  rationale: В контексте Деяний речь идёт о Божьем Святом Духе; прописные буквы ясно указывают на этот контекстуальный референт, не добавляя отсутствующего в греческом тексте пояснения.
theological_decisions:
- issue: Следует ли понимать πνεῦμα ἅγιον как безличный или неопределённый «святой дух» либо как Божьего Святого Духа
  choice: Святого Духа
  alternative: святого духа
  rationale: В ближайшем повествовательном контексте Деяний выражение обозначает обещанного верующим Божьего Духа. Такое написание передаёт контекстуальный смысл, не развивая его в конфессиональное толкование.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Причастная конструкция «придя туда» сохраняет последовательность действий и естественно связывает этот стих с предыдущим; «туда» восполняет подразумеваемое направление движения к месту, названному в контексте.
