lexical_decisions:
- source_word: ἦν τε ὑποστρέφων
  choice: Он возвращался
  rationale: Сочетание ἦν с причастием настоящего времени передаёт продолжавшееся действие в прошлом. «Возвращался» сохраняет этот видовой оттенок и не добавляет отсутствующего в греческом тексте указания «домой»; слабое связующее τέ естественно не выражено отдельно.
- source_word: καθήμενος
  choice: сидя
  rationale: Деепричастие естественно передаёт позу человека во время пути и одновременность действий.
- source_word: ἐπὶ τοῦ ἅρματος αὐτοῦ
  choice: в своей колеснице
  rationale: Хотя ἐπί с родительным падежом буквально может означать «на», по-русски о человеке, едущем в таком транспортном средстве, естественно сказать «в колеснице». Возвратное «своей» однозначно относит колесницу к подлежащему.
- source_word: ἀνεγίνωσκεν
  choice: читал
  rationale: Имперфект обозначает продолжавшееся действие. Сам глагол в данном контексте не требует добавления «вслух», поэтому это культурно вероятное понимание вынесено в примечание.
- source_word: τὸν προφήτην Ἠσαΐαν
  choice: пророка Исаию
  rationale: Такой порядок слов близок к греческому и при этом естественен для современного русского языка. Он может обозначать как самого пророка, так и его книгу; эта присущая формулировке метонимия не устраняется поясняющим добавлением.
