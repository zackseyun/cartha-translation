translation_notes:
  register: Современный литературный русский язык с простым повествовательным синтаксисом. Сохранены длительность возвращения и чтения, а также естественная для исходной формулировки возможность понимать под «пророком Исаией» его книгу. Выражение «возвращался домой» не использовано, поскольку «домой» следует из контекста, но отсутствует в данном стихе.
