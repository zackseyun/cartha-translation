  yaml_path: translation/nt/acts/008/028.yaml
  text: And he was returning[a], seated in his chariot[b], and was reading Isaiah the prophet.
translation:
  language: ru
  text: Он возвращался, сидя в своей колеснице, и читал[a] пророка Исаию[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В древности часто читали вслух, поэтому возможно понимание «читал вслух», хотя сам греческий глагол здесь прямо этого не выражает.
