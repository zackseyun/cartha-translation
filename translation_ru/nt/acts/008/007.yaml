  yaml_path: translation/nt/acts/008/007.yaml
  text: For many who had unclean spirits[a], they came out crying with a loud voice; and many who were paralyzed and lame were healed.
translation:
  language: ru
  text: Ведь из многих одержимых нечистыми духами нечистые духи выходили с громким криком[a], и многие парализованные и хромые были исцелены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «громко крича»; греческое причастие естественнее всего относится к нечистым духам, которые выходили.'
    reason: лексическая и синтаксическая альтернатива
lexical_decisions:
- source_word: πολλοὶ γὰρ τῶν ἐχόντων πνεύματα ἀκάθαρτα
  choice: Ведь из многих одержимых нечистыми духами
  rationale: γάρ передано как «ведь», чтобы сохранить пояснительную связь с предыдущим стихом. Генитивная конструкция с τῶν ἐχόντων естественно передаётся через «из многих», а «одержимых» ясно и кратко обозначает людей, у которых были нечистые духи.
- source_word: πνεύματα ἀκάθαρτα
  choice: нечистыми духами
  rationale: «Нечистые духи» — точное и устойчивое в библейском повествовании обозначение духовных существ; оно сохраняет религиозно-культовую окраску ἀκάθαρτα.
- source_word: βοῶντα φωνῇ μεγάλῃ
  choice: с громким криком
  rationale: Оборот естественно передаёт и громкость, и крик; по согласованию греческое причастие относится к нечистым духам.
- source_word: ἐξήρχοντο
  choice: те выходили
  rationale: Местоимение «те» возвращает читателя к нечистым духам и устраняет возможную неясность русского синтаксиса. Несовершенный вид «выходили» отражает имперфект и повторяющийся характер происходившего.
- source_word: παραλελυμένοι
  choice: парализованные
  rationale: Передаёт состояние, выраженное перфектным страдательным причастием, современным и понятным словом.
- source_word: χωλοὶ
  choice: хромые
  rationale: Традиционное и точное обозначение людей с нарушением способности ходить.
- source_word: ἐθεραπεύθησαν
  choice: исцелялись
  rationale: «Исцеляться» соответствует θεραπεύω в данном контексте, а несовершенный вид естественно согласуется с повествованием о множестве происходивших исцелений.
theological_decisions:
- issue: Кто кричал и выходил
  choice: Нечистые духи выходили с громким криком.
  alternative: Одержимые люди кричали, когда духи выходили.
  rationale: Средний род множественного числа βοῶντα грамматически согласуется с πνεύματα ἀκάθαρτα, поэтому наиболее естественно относить крик к духам. Формулировка сохраняет это чтение, а сноска отмечает возможное синтаксическое восприятие.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка избегает тяжёлого буквального калькирования, но сохраняет пояснительное γάρ, референт причастия и аспектуальную окраску имперфекта.
