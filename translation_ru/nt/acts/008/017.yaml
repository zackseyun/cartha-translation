lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественно передаёт временную и последовательную связь с предшествующими событиями.
- source_word: ἐπετίθεσαν τὰς χεῖρας ἐπ’ αὐτούς
  choice: они возлагали на них руки
  rationale: Устойчивое русское соответствие жесту возложения рук; несовершенный вид отражает имперфект греческого глагола.
- source_word: καὶ ἐλάμβανον
  choice: и те получали
  rationale: Местоимение «те» ясно отличает получавших Духа от апостолов, возлагавших руки; несовершенный вид сохраняет аспект греческого имперфекта без добавления значения начала действия.
- source_word: πνεῦμα ἅγιον
  choice: Святого Духа
  rationale: В контексте Деяний выражение обозначает Божьего Святого Духа; форма винительного падежа естественна после «получали».
theological_decisions:
- issue: Личное или неопределённое понимание πνεῦμα ἅγιον
  choice: Святого Духа
  alternative: святой дух
  rationale: Контекст Луки — Деяний указывает на обещанного Божьего Духа; написание с прописных букв ясно передаёт референт, не добавляя утверждений сверх текста.
- issue: Передача двух греческих имперфектов
  choice: возлагали… получали
  alternative: возложили… получили
  rationale: Оба несовершенных вида сохраняют аспектуальную параллель исходного текста и допускают повторяющееся или разворачивающееся действие, не сводя его к однократному завершённому событию.
translation_notes:
  register: Современный литературный русский язык с традиционным, но понятным библейским оборотом «возлагать руки». Местоимение «те» устраняет возможную неясность относительно того, кто получал Святого Духа.
