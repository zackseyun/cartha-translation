base_translation:
  language: en
  yaml_path: translation/nt/acts/008/026.yaml
  text: An angel of the Lord spoke to Philip[a], saying[b], “Get up and go south to the road that goes down from Jerusalem to Gaza.” This is a deserted road.
translation:
  language: ru
  text: 'Ангел Господа сказал Филиппу: «Встань и иди на юг[a] к дороге, ведущей из Иерусалима в Газу». Эта дорога безлюдна[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в полдень». Греческое выражение может указывать как направление — «на юг», так и время — «в полдень».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Это пустыня»; возможно, речь идёт о дороге через пустынную местность, а не о том, что сама дорога безлюдна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγγελος δὲ κυρίου
  choice: А ангел Господа
  rationale: Частица δέ передана естественным повествовательным союзом «а». Сочетание «ангел Господа» сохраняет значение небесного посланника и не уточняет его личность сверх сказанного в тексте.
- source_word: ἐλάλησεν πρὸς Φίλιππον λέγων
  choice: обратился к Филиппу со словами
  rationale: Естественно объединяет личную форму λαλέω и вводящий прямую речь причастный оборот λέγων, не утрачивая смысла обращения к Филиппу.
- source_word: Ἀνάστηθι καὶ πορεύου
  choice: Встань и иди
  rationale: Прямо и естественно передаёт два повеления и побуждение к немедленному действию.
- source_word: κατὰ μεσημβρίαν
  choice: на юг
  rationale: При глаголе движения наиболее вероятно указание направления. Реальная возможность временного значения «в полдень» сохранена в сноске.
- source_word: ἐπὶ τὴν ὁδὸν
  choice: к дороге
  rationale: Предлог с винительным падежом обозначает движение к названному пути; русский вариант не создаёт лишнего впечатления, будто Филипп уже вышел непосредственно на дорогу.
- source_word: τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν
  choice: ведущей из Иерусалима в Газу
  rationale: «Ведущей» естественно описывает маршрут. Буквальное «спускающейся» возможно, но в русском здесь звучит тяжелее; направление от возвышенного Иерусалима не меняется.
- source_word: αὕτη ἐστὶν ἔρημος
  choice: Эта дорога безлюдна
  rationale: Женский род αὕτη и ἔρημος допускает отнесение к ὁδός. «Безлюдна» передаёт значение пустынного, малопосещаемого пути, а альтернативное понимание местности как пустыни отмечено в сноске.
theological_decisions:
- issue: Кого обозначает выражение «ангел Господа»
  choice: Неопределённый небесный посланник, принадлежащий Господу или посланный Им, без дальнейшего отождествления
  alternative: Особая фигура «Ангела Господня»
  rationale: Греческий текст называет посланника ангелом Господа, но сам по себе не требует более узкой богословской идентификации.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным тоном. Причастная конструкция при вводе прямой речи преобразована в естественное «обратился… со словами». Подлинные смысловые неоднозначности κατὰ μεσημβρίαν и ἔρημος сохранены в сносках.
