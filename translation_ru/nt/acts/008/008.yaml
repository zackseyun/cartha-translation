lexical_decisions:
- source_word: ἐγένετο
  choice: была
  rationale: 'В сочетании с существительным в именительном падеже глагол имеет здесь экзистенциальное значение: в городе возникло и присутствовало состояние великой радости. Русское «была» естественно передаёт эту конструкцию.'
- source_word: δὲ
  choice: И
  rationale: Частица продолжает повествование, не выражая обязательного противопоставления; союз «и» естественно связывает стих с предыдущими событиями.
- source_word: πολλὴ χαρά
  choice: великая радость
  rationale: При отвлечённом существительном πολλή обозначает высокую степень; «великая радость» сохраняет интенсивность и звучит естественно и достойно.
- source_word: ἐν τῇ πόλει ἐκείνῃ
  choice: в том городе
  rationale: Оборот указывает на конкретный город, упомянутый в ближайшем контексте; «в том городе» точно передаёт предлог, существительное и указательное местоимение.
