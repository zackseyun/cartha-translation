translation:
  language: ru
  text: Благочестивые мужчины похоронили Стефана[a] и устроили по нему великое оплакивание[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приготовили Стефана к погребению» или «унесли Стефана, чтобы похоронить»; греческий глагол может подчёркивать обращение с телом, а не только само погребение.'
