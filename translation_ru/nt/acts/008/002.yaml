    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκόμισαν
  choice: похоронили
  rationale: В контексте речь идёт о том, как после смерти поступили с телом Стефана. «Похоронили» естественно передаёт итог действия, тогда как греческий глагол может также акцентировать перенесение тела или подготовку к погребению.
- source_word: δέ
  choice: же
  rationale: Частица обозначает мягкий переход и некоторое противопоставление предыдущему рассказу; постпозитивное «же» сохраняет это без чрезмерно сильного контраста.
- source_word: ἄνδρες εὐλαβεῖς
  choice: благочестивые мужи
  rationale: ἄνδρες имеет мужской род и обозначает мужчин; εὐλαβεῖς выражает религиозное благоговение и набожность. «Благочестивые мужи» соответствует торжественному повествовательному регистру.
- source_word: ἐποίησαν
  choice: совершили
  rationale: В сочетании с существительным оплакивания глагол имеет ослабленное значение. «Совершили» естественно указывает на публичное действие или обряд скорби.
- source_word: κοπετὸν μέγαν
  choice: великое оплакивание
  rationale: κοπετός обозначает скорбное оплакивание, часто внешне и вслух выраженное; μέγαν подчёркивает его силу и масштаб.
- source_word: ἐπ’ αὐτῷ
  choice: по нему
  rationale: При глаголах и существительных скорби ἐπί с дательным указывает на человека, которого оплакивают; русское «по нему» идиоматично передаёт это отношение.
