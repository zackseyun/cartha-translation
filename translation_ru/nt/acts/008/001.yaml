base_translation:
  language: en
  yaml_path: translation/nt/acts/008/001.yaml
  text: Saul was approving of his execution. And on that day a great persecution arose against the church in Jerusalem[a], and they were all scattered throughout the regions of Judea and Samaria, except the apostles.
translation:
  language: ru
  text: Савл же одобрял то, что его предали смерти.[a] В тот день началось великое гонение на церковь в Иерусалиме, и все, кроме апостолов, были рассеяны по областям Иудеи и Самарии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его умерщвление»; возможные более окрашенные варианты: «его убийство» или «его казнь». Греческое слово обозначает акт лишения жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σαῦλος δὲ ἦν συνευδοκῶν
  choice: Савл же одобрял
  rationale: Имя передано традиционной русской формой; конструкция ἦν с причастием выражает продолжавшееся или сопутствующее одобрение. Частица δέ естественно передана как «же», связывая стих с предшествующим рассказом.
- source_word: τῇ ἀναιρέσει αὐτοῦ
  choice: его убийство
  rationale: ἀναίρεσις обозначает лишение жизни, умерщвление. «Убийство» сохраняет значение действия и в русском звучит естественнее, чем «умерщвление»; сноска отмечает менее оценочные варианты.
- source_word: Ἐγένετο δὲ ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: В тот день началось
  rationale: В данном контексте ἐγένετο вводит возникновение гонения; «началось» ясно и естественно передаёт наступление события, не добавляя отдельного временного маркера сверх «в тот день».
- source_word: διωγμὸς μέγας
  choice: жестокое гонение
  rationale: μέγας здесь характеризует масштаб и суровость преследования. «Жестокое гонение» — естественное современное русское сочетание, сохраняющее усиление.
- source_word: ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις
  choice: на церковь в Иерусалиме
  rationale: В контексте враждебного действия ἐπί передано предлогом «на» при слове «гонение»; определительная группа естественно сокращена до «церковь в Иерусалиме».
- source_word: πάντες δὲ διεσπάρησαν
  choice: и все ... рассеялись
  rationale: Сохранены всеобщность πάντες и пассивно-результативный смысл вынужденного рассеяния, естественно выраженный русским возвратным глаголом.
- source_word: κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας
  choice: по областям Иудеи и Самарии
  rationale: χώρας означает территории или области; «по областям» кратко и ясно передаёт географическое распространение.
- source_word: πλὴν τῶν ἀποστόλων
  choice: кроме апостолов
  rationale: πλήν прямо обозначает исключение. Оборот помещён рядом со словом «все», чтобы объём утверждения был сразу ясен.
theological_decisions:
- issue: Характер смерти Стефана в выражении ἀναιρέσει αὐτοῦ
  choice: его убийство
  alternative: его умерщвление; то, что его предали смерти; его казнь
  rationale: «Убийство» прямо передаёт акт лишения жизни и естественно звучит по-русски. Однако греческое существительное само по себе прежде всего называет предание смерти; поэтому сноска сохраняет менее оценочные варианты и не делает «казнь» единственно возможным толкованием.
- issue: Объём πάντες («все»)
  choice: все, кроме апостолов
  alternative: все верующие, кроме апостолов; все остальные
  rationale: Перевод сохраняет выразительное «все» и явное исключение, данное самим текстом, не добавляя отсутствующее существительное «верующие» и не превращая формулировку в безусловно буквальную универсалию.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён без утраты связности: исключение «кроме апостолов» поставлено непосредственно после «все». Маркер сноски [a] стоит сразу после выражения, к которому относится.'
