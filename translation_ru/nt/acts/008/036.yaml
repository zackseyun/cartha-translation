base_translation:
  language: en
  yaml_path: translation/nt/acts/008/036.yaml
  text: And as they were going along the road, they came to some water, and the eunuch says, “Look, water! What prevents me from being baptized?”
translation:
  language: ru
  text: 'Когда они ехали по дороге, они оказались у воды, и евнух говорит: «Вот вода! Что мешает мне креститься?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἐπορεύοντο κατὰ τὴν ὁδόν
  choice: Когда они продолжали путь
  rationale: Естественно передаёт одновременность действий и движение по дороге без ненужного буквального повтора «по дороге».
- source_word: ἦλθον ἐπί τι ὕδωρ
  choice: подъехали к какой-то воде
  rationale: В контексте поездки на колеснице «подъехали» естественно передаёт достижение водоёма; τι сохраняется как неопределённое «какой-то».
- source_word: φησιν
  choice: говорит
  rationale: Сохраняет историческое настоящее греческого текста, делая сцену живой.
- source_word: Ἰδοὺ ὕδωρ
  choice: Вот вода!
  rationale: Кратко и естественно передаёт указательное восклицание ἰδού.
- source_word: τί κωλύει με βαπτισθῆναι
  choice: Что мешает мне креститься?
  rationale: Передаёт пассивный инфинитив βαπτισθῆναι естественной русской возвратной формой, обычной для принятия крещения.
theological_decisions:
- issue: Значение βαπτισθῆναι
  choice: креститься
  alternative: быть крещённым
  rationale: Русское «креститься» здесь означает принять крещение и не уточняет сверх текста ни способ, ни богословские условия крещения.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанно торжественное. Историческое настоящее «говорит» сохранено вслед за греческим текстом.
