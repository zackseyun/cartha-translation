  text: καὶ ἐκέλευσεν στῆναι τὸ ἅρμα, καὶ κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος, καὶ ἐβάπτισεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/038.yaml
  text: And he ordered the chariot to stop[a], and both Philip and the eunuch went down into the water, and he baptized him.
translation:
  language: ru
  text: И он велел остановить колесницу. Затем оба — Филипп и евнух — сошли в воду[a], и Филипп крестил его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к воде»; однако греческий предлог обычно обозначает движение внутрь, в данном случае — в воду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: велел
  rationale: Передаёт властное распоряжение естественным современным русским словом, не придавая фразе излишней официальности.
- source_word: στῆναι τὸ ἅρμα
  choice: остановить колесницу
  rationale: При колеснице как объекте инфинитив означает привести её в неподвижное состояние; по-русски естественно сказать «остановить колесницу».
- source_word: ἅρμα
  choice: колесница
  rationale: Прямой и традиционный эквивалент, сохраняющий исторический колорит.
- source_word: κατέβησαν
  choice: сошли
  rationale: Естественно передаёт движение вниз к воде и в неё; направление уточняется оборотом с εἰς.
- source_word: ἀμφότεροι ... ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος
  choice: оба — Филипп и евнух
  rationale: Сохраняет явное подчёркивание того, что в воду сошли оба названных участника.
- source_word: εἰς τὸ ὕδωρ
  choice: в воду
  rationale: Предлог εἰς обычно обозначает движение внутрь; «в воду» точно и естественно передаёт направленность.
- source_word: εὐνοῦχος
  choice: евнух
  rationale: Сохраняет прямое значение слова и лексическую преемственность повествования, не заменяя его более общим «сановник».
- source_word: ἐβάπτισεν αὐτόν
  choice: Филипп крестил его
  rationale: «Крестил» — устоявшийся нейтральный эквивалент βαπτίζω. Повтор имени Филиппа естественно устраняет возможную для русского читателя местоименную неясность, не меняя смысла.
theological_decisions:
- issue: Следует ли формулировкой определять способ крещения
  choice: Сохранить движение «в воду» и употребить нейтральный глагол «крестил».
  alternative: Перевести βαπτίζω как «погрузил» либо ослабить εἰς до «к воде».
  rationale: Греческий текст сообщает, что оба сошли в воду и Филипп крестил евнуха, но сам по себе данный стих не требует вводить конфессиональное уточнение способа крещения.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и достойное. Частица «затем» естественно связывает последовательные действия. Тире выделяет поясняющее называние двух участников. Маркер сноски поставлен непосредственно после спорного оборота.
