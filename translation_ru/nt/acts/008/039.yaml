lexical_decisions:
- source_word: ἀνέβησαν ἐκ τοῦ ὕδατος
  choice: вышли из воды
  rationale: Передаёт направленное движение вверх и наружу естественным русским выражением, не уточняя способ крещения.
- source_word: πνεῦμα κυρίου
  choice: Дух Господа
  rationale: В контексте Луки — Деяний выражение естественно обозначает Божьего Духа как действующего субъекта; прописная буква отражает это понимание.
- source_word: ἥρπασεν
  choice: внезапно унёс
  rationale: Глагол ἁρπάζω выражает резкое, внезапное удаление. «Внезапно унёс» сохраняет силу и сверхъестественный характер действия, оставаясь естественным в современном русском.
- source_word: οὐκ εἶδεν αὐτὸν οὐκέτι
  choice: больше его не видел
  rationale: Точно и естественно передаёт прекращение видения Филиппа с этого момента.
- source_word: ὁ εὐνοῦχος
  choice: евнух
  rationale: Прямое соответствие греческому существительному и сохранение связи с предыдущим повествованием.
- source_word: ἐπορεύετο τὴν ὁδὸν αὐτοῦ
  choice: продолжал свой путь
  rationale: Имперфект передаёт продолжающееся движение, а выражение ὁδὸν αὐτοῦ относится к пути или путешествию.
- source_word: χαίρων
  choice: радуясь
  rationale: Деепричастие сохраняет глагольный характер причастия и обозначает состояние, сопровождавшее дальнейший путь евнуха.
theological_decisions:
- issue: Следует ли понимать πνεῦμα κυρίου как Святого Духа или как безличную силу
  choice: 'Личная божественная деятельность: «Дух Господа»'
  alternative: «дух от Господа» как безличная сила
  rationale: В книгах Луки и Деяний это выражение обычно относится к Божьему Духу, который действует лично и властно; перевод не добавляет слова «Святой», отсутствующего в данном стихе.
- issue: Насколько явно передавать внезапный и чудесный характер ἥρπασεν
  choice: «внезапно унёс Филиппа»
  alternative: «восхитил Филиппа» или «унёс Филиппа»
  rationale: Контекст указывает на божественное вмешательство, а наречие «внезапно» передаёт заложенный в глаголе оттенок резкого удаления без архаичного «восхитил».
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Синтаксис разделён на два предложения ради естественности; причинный γάρ передан смысловой связью последовательности без отдельного «потому что», поскольку в русском буквальное причинное соединение здесь звучит неестественно.
