  source_fidelity: 'Текст в целом верно передаёт греческий оригинал: «вышли из воды», «Дух Господа», «евнух больше его не видел» и «продолжал свой путь, радуясь» соответствуют исходному тексту. Однако γάρ, вводящее пояснение во второй части стиха, в черновике никак не отражено; простое сочинительное «и» меняет связь высказываний. Наречие «внезапно» допустимо как передача оттенка ἥρπασεν, но это эксплицитное добавление, поэтому безопаснее оставить силу глагола в «унёс», а оттенок резкости сохранить в сноске.'
