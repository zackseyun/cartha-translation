  text: Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον, καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάρειαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/040.yaml
  text: But Philip was found at Azotus[a], and as he passed through, he was proclaiming the good news to all the cities until he came to Caesarea.
translation:
  language: ru
  text: Филипп же оказался в Азоте[a] и, проходя через все города, возвещал Благую Весть, пока не пришёл в Кесарию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «был найден в Азоте»; возможно также: «появился в Азоте». В контексте эти слова могут подразумевать внезапное перенесение Филиппа Богом, но прямо этого не утверждают.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: же
  rationale: Передаёт мягкий повествовательный переход и лёгкое противопоставление предыдущему стиху без чрезмерно сильного русского «но».
- source_word: εὑρέθη
  choice: оказался
  rationale: Естественно передаёт результирующее нахождение Филиппа в Азоте и не уточняет способ его перемещения; буквальная форма «был найден» по-русски могла бы ошибочно подразумевать поиски.
- source_word: εἰς Ἄζωτον
  choice: в Азоте
  rationale: При εὑρέθη предлог εἰς обозначает результирующее местонахождение; русский предложный оборот звучит естественно.
- source_word: διερχόμενος
  choice: проходя оттуда
  rationale: Передаёт одновременное движение через местность; «оттуда» делает маршрут естественным по-русски, не добавляя конкретного направления.
- source_word: εὐηγγελίζετο
  choice: возвещал Благую Весть
  rationale: Передаёт длительное или повторяющееся действие имперфекта и смысл глагола доступным современным языком, без узкого церковного жаргона.
- source_word: τὰς πόλεις πάσας
  choice: во всех городах
  rationale: Русская локативная конструкция естественно выражает возвещение в каждом городе по пути.
- source_word: ἕως τοῦ ἐλθεῖν αὐτὸν
  choice: пока не пришёл
  rationale: Естественно передаёт временной предел продолжавшегося действия.
- source_word: εἰς Καισάρειαν
  choice: в Кесарию
  rationale: Передаёт направление движения к месту назначения.
theological_decisions:
- issue: Следует ли прямо истолковать εὑρέθη как чудесное появление или сверхъестественное перенесение Филиппа
  choice: Нейтральное «оказался» в основном тексте
  alternative: «появился» или буквальное «был найден»
  rationale: Контекст подразумевает действие Бога, однако сама форма εὑρέθη не объясняет способ перемещения. «Оказался» сохраняет эту недосказанность и при этом звучит естественно по-русски.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. «Благая Весть» понятна широкому читателю; синтаксис сохраняет последовательность и длительность действий исходного текста.
