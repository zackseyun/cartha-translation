lexical_decisions:
- source_word: Οἱ μὲν οὖν
  choice: Итак, те
  rationale: «Итак» передаёт выводно-переходную функцию οὖν; μέν здесь служит организации повествования и не требует отдельного русского соответствия.
- source_word: διασπαρέντες
  choice: кто был рассеян
  rationale: Пассивное причастие указывает на людей, которых рассеяло начавшееся гонение; придаточная конструкция естественнее для современного русского языка, чем субстантивированное «рассеянные».
- source_word: διῆλθον
  choice: ходили из места в место
  rationale: Глагол в данном контексте обозначает передвижение по разным местам, а не однократное прохождение через одну местность.
- source_word: εὐαγγελιζόμενοι
  choice: благовествуя
  rationale: Русский глагол сохраняет значение провозглашения Благой вести и передаёт сопутствующее действие причастия.
- source_word: τὸν λόγον
  choice: слово
  rationale: Сохранено краткое лукино обозначение христианской вести без добавления отсутствующего в стихе определения «Божье»; смысл пояснён в сноске.
theological_decisions:
- issue: Передача сочетания εὐαγγελιζόμενοι τὸν λόγον
  choice: благовествуя слово
  alternative: возвещая Благую весть
  rationale: Выбранный вариант сохраняет и смысл глагола «благовествовать», и прямое дополнение «слово», не сводя одно из них к подразумеваемому значению. Сноска разъясняет референт слова, не добавляя его в основной текст.
translation_notes:
  register: Современный литературный русский с умеренно библейским, но понятным словом «благовествуя». Оборот «ходили из места в место» естественно передаёт странствующий характер действия.
