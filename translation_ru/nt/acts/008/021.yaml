id: ACT.8.21
reference: Acts 8:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐκ ἔστιν σοι μερὶς οὐδὲ κλῆρος ἐν τῷ λόγῳ τούτῳ, ἡ γὰρ καρδία σου οὐκ ἔστιν εὐθεῖα ⸀ἔναντι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/021.yaml
  text: You have neither part nor share in this matter, because your heart is not right before God.
translation:
  language: ru
  text: Нет тебе ни доли, ни участия в этом деле, потому что сердце твоё неправо перед Богом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μερὶς οὐδὲ κλῆρος
  choice: ни доли, ни участия
  rationale: 'Сохраняет парное усиление оригинала: μερίς обозначает долю или часть, а κλῆρος — удел, долю или право участия. Русское «участие» естественно передаёт смысл в данном контексте, не вводя буквальное, но здесь неясное «жребий».'
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: в этом деле
  rationale: λόγος здесь указывает не просто на произнесённое слово, а на обсуждаемое дело — получение и передачу дара Божьего; «в этом деле» естественно передаёт контекстуальный смысл.
- source_word: ἡ καρδία σου οὐκ ἔστιν εὐθεῖα
  choice: сердце твоё неправо
  rationale: Сохраняет библейский образ сердца как центра намерений и внутреннего состояния; «неправо» передаёт отрицание εὐθεῖα — прямого, правильного, честного состояния.
- source_word: ἔναντι τοῦ θεοῦ
  choice: перед Богом
  rationale: Устойчивое и точное русское соответствие выражению о Божьей оценке и присутствии.
theological_decisions:
- issue: Характер отсутствующей у Симона доли
  choice: «ни доли, ни участия в этом деле»
  alternative: «ни части, ни жребия в этом слове»
  rationale: Перевод не определяет сверх текста, идёт ли речь о спасении, церковном положении или служении; он сохраняет непосредственную связь с обсуждаемым делом и не превращает κλῆρος в специальный догматический термин.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Инверсия «сердце твоё» сохраняет достоинство и ритм фразы, оставаясь понятной современному читателю.
