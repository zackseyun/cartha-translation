  text: ὁ δὲ εἶπεν· Πῶς γὰρ ἂν δυναίμην ἐὰν μή τις ⸀ὁδηγήσει με; παρεκάλεσέν τε τὸν Φίλιππον ἀναβάντα καθίσαι σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/031.yaml
  text: And he said[a], “How could I[b], unless someone guides me?” Then he urged Philip to come up and sit with him.
translation:
  language: ru
  text: 'Он ответил: «Как же я смогу, если меня никто не направит?» И попросил Филиппа подняться и сесть с ним.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πῶς γὰρ ἂν δυναίμην
  choice: Как же я могу понять
  rationale: Потенциальный оптатив с ἄν передаёт невозможность понять без посторонней помощи. Глагол «понять» восполняется из непосредственного контекста вопроса о понимании читаемого и делает русскую реплику естественной.
- source_word: ἐὰν μή τις ὁδηγήσει με
  choice: если кто-нибудь не наставит меня
  rationale: ὁδηγέω буквально означает «вести, направлять», а здесь относится к направлению в понимании Писания. «Наставит» сохраняет идею руководства и не сужает её до простого объяснения.
- source_word: παρεκάλεσέν
  choice: попросил
  rationale: В данном повествовательном контексте παρακαλέω обозначает настойчивую или учтивую просьбу. Русское «попросил» звучит естественно и не придаёт реплике чрезмерной настойчивости.
- source_word: τε
  choice: И
  rationale: Частица τε легко связывает последовательные действия; нейтральное «и» естественно передаёт эту повествовательную связь.
- source_word: ἀναβάντα
  choice: подняться
  rationale: Причастие от ἀναβαίνω сохраняет пространственный образ подъёма в колесницу, известную из контекста.
- source_word: καθίσαι σὺν αὐτῷ
  choice: сесть рядом с ним
  rationale: Сочетание σύν с дательным буквально означает совместность; в сцене внутри колесницы естественное русское выражение «рядом с ним» ясно передаёт расположение участников.
- source_word: Φίλιππον
  choice: Филиппа
  rationale: Имя передано в традиционной русской библейской форме.
theological_decisions:
- issue: Смысл требуемого руководства при чтении Писания
  choice: наставит меня
  alternative: объяснит мне
  rationale: Выбранное слово сохраняет более широкий образ ὁδηγέω — вести и направлять — и не превращает стих в категорическое утверждение о единственно возможном способе понимания Писания.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной повествовательной интонацией. Контекстуально подразумеваемое «понять» выражено явно ради естественности вопроса; образ руководства сохранён глаголом «наставит».
