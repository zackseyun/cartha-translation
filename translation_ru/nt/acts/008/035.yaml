source:
  edition: SBLGNT
  text: ἀνοίξας δὲ ὁ Φίλιππος τὸ στόμα αὐτοῦ καὶ ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/035.yaml
  text: Then Philip opened his mouth[a], and beginning from this Scripture[b], he proclaimed the good news about Jesus to him.
translation:
  language: ru
  text: Тогда Филипп заговорил и, начав с этого места Писания, возвестил ему благую весть об Иисусе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνοίξας ... τὸ στόμα αὐτοῦ
  choice: начал говорить
  rationale: Греческая идиома буквально означает «открыв свои уста», но в современном русском естественно передаётся как начало речи. Буквальная калька здесь звучала бы архаично и избыточно.
- source_word: δὲ
  choice: Тогда
  rationale: Частица отмечает развитие повествования; «тогда» естественно связывает ответ Филиппа с предшествующим вопросом.
- source_word: ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης
  choice: начав с этого места Писания
  rationale: Предлог ἀπό обозначает исходную точку объяснения. Добавление «места» естественно в русском и указывает на процитированный отрывок, не лишая γραφή значения Священного Писания.
- source_word: γραφῆς
  choice: Писания
  rationale: В данном контексте слово обозначает священный текст; прописная буква передаёт это общепринятое значение.
- source_word: εὐηγγελίσατο
  choice: возвестил ... благую весть
  rationale: Передаёт значение провозглашения доброй вести и сохраняет евангельскую окраску глагола, оставаясь понятным современному читателю.
- source_word: αὐτῷ
  choice: ему
  rationale: Сохраняет местоименную форму оригинала; из контекста ясно, что речь идёт об эфиопском сановнике.
- source_word: τὸν Ἰησοῦν
  choice: об Иисусе
  rationale: При εὐαγγελίζομαι винительный падеж указывает на содержание возвещаемой вести. Русская конструкция «благая весть об Иисусе» ясно и естественно передаёт этот смысл.
theological_decisions:
- issue: Смысл εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν
  choice: «возвестил ему благую весть об Иисусе» — Иисус является содержанием и центром возвещения
  alternative: «проповедал ему Иисуса»
  rationale: Выбранный вариант точно передаёт греческую конструкцию на естественном современном русском, не сводя её к конфессиональной формуле и не добавляя богословских уточнений.
translation_notes:
  register: Современный литературный русский, ясный и достойный повествовательный стиль. Идиома «открыл уста» передана по смыслу, чтобы избежать ненужной архаики; «благая весть» сохраняет смысловую связь с εὐαγγελίζομαι.
