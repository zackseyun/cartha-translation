base_translation:
  language: en
  yaml_path: translation/nt/acts/008/012.yaml
  text: But when they believed Philip as he proclaimed the good news about the kingdom of God and the name of Jesus the Messiah[a], they were being baptized, both men and women.
translation:
  language: ru
  text: Но когда они поверили Филиппу, возвещавшему благую весть о Царстве Божьем и об имени Иисуса Мессии[a], то крестились — и мужчины, и женщины.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисуса Христа». Греческое Χριστός здесь передано словом «Мессия», чтобы сохранить значение титула.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Но когда
  rationale: ὅτε вводит временное придаточное, а δέ обозначает мягкий контраст с предшествующим рассказом; «Но когда» естественно передаёт оба значения.
- source_word: ἐπίστευσαν τῷ Φιλίππῳ
  choice: поверили Филиппу
  rationale: Дательный падеж при πιστεύω здесь означает, что люди поверили Филиппу как вестнику, а не уверовали в него как объект спасительной веры.
- source_word: εὐαγγελιζομένῳ
  choice: возвещавшему благую весть
  rationale: Причастие настоящего времени характеризует совершаемое Филиппом возвещение; выражение сохраняет значение доброй вести и звучит достойно и понятно.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: о Царстве Божьем
  rationale: περί с родительным обозначает предмет возвещения; «Царство Божье» — ясное и устоявшееся соответствие.
- source_word: τοῦ ὀνόματος Ἰησοῦ Χριστοῦ
  choice: об имени Иисуса Мессии
  rationale: Сохранено слово «имя», которое может указывать на личность, власть и явленную идентичность; Χριστός передано как титул «Мессия».
- source_word: ἐβαπτίζοντο
  choice: стали креститься
  rationale: 'Имперфект выражает разворачивавшееся или повторявшееся действие: по мере отклика люди принимали крещение. Русская конструкция естественнее буквального «были крещаемы», при этом контекстуальная процессуальность сохраняется.'
- source_word: ἄνδρες τε καὶ γυναῖκες
  choice: и мужчины, и женщины
  rationale: Парная конструкция τε…καί подчёркивает включение обеих групп; русское повторение «и» естественно передаёт этот акцент.
theological_decisions:
- issue: Передача Χριστοῦ в сочетании Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  alternative: Иисуса Христа
  rationale: В контексте Χριστός сохраняет смысл мессианского титула. «Мессия» делает этот титульный смысл явным, не превращая слово в подобие фамилии; традиционный вариант указан в сноске.
- issue: Значение выражения «имя Иисуса Мессии»
  choice: Сохранить буквальную формулировку «об имени»
  alternative: Перефразировать как «об Иисусе Мессии» или «о власти Иисуса Мессии»
  rationale: Греческое ὄνομα допускает смысл личности, власти или явленной идентичности. Сохранение исходной метафоры не устраняет эту содержательную многозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формулировка предназначена для чтения обычным современным читателем; синтаксис упрощён без утраты аспектуальных и богословски значимых оттенков.
