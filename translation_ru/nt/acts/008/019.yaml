  variant: modern literary Russian
source:
  edition: SBLGNT
  text: λέγων· Δότε κἀμοὶ τὴν ἐξουσίαν ταύτην ἵνα ᾧ ἐὰν ἐπιθῶ τὰς χεῖρας λαμβάνῃ πνεῦμα ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/019.yaml
  text: saying[a], “Give me also this authority, so that anyone on whom I lay my hands may receive the Holy Spirit.”
translation:
  language: ru
  text: 'и сказал: «Дайте и мне эту власть, чтобы всякий, на кого я возложу руки, получал Святого Духа».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «силу». Греческое слово может означать власть, право, полномочие или способность действовать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: и сказал
  rationale: Греческое причастие продолжает действие предыдущего стиха и вводит прямую речь; в современном русском повествовании естественно передать его личной формой с союзом.
- source_word: Δότε κἀμοί
  choice: Дайте и мне
  rationale: Императив множественного числа обращён к Петру и Иоанну, а κἀμοί подчёркивает желание Симона получить то же самое.
- source_word: ἐξουσίαν
  choice: власть
  rationale: Слово обозначает право, полномочие или власть действовать; «власть» сохраняет отличие от слов, непосредственно обозначающих силу.
- source_word: ἵνα ᾧ ἐὰν
  choice: чтобы всякий, на кого
  rationale: Передаёт целевое значение ἵνα и неопределённо-обобщающий смысл относительной конструкции с ἐάν.
- source_word: ἐπιθῶ τὰς χεῖρας
  choice: я возложу руки
  rationale: «Возложить руки» — естественное и устойчивое русское выражение, сохраняющее конкретный образ греческого текста.
- source_word: λαμβάνῃ
  choice: получал
  rationale: 'Несовершенный вид естественно выражает повторяемый предполагаемый результат: это должно происходить со всяким, на кого Симон возложит руки.'
- source_word: πνεῦμα ἅγιον
  choice: Святого Духа
  rationale: Контекст Деяний ясно указывает на Божьего Святого Духа; винительный падеж обусловлен глаголом «получал».
theological_decisions:
- issue: Следует ли понимать безартиклевое πνεῦμα ἅγιον неопределённо как «святого духа»
  choice: Святого Духа
  alternative: святого духа
  rationale: Отсутствие артикля в греческом не требует неопределённого смысла. В данном повествовательном контексте речь идёт о Божьем Святом Духе; строчные буквы внесли бы чуждую контексту неоднозначность.
- issue: Передаёт ли ἐξουσία прежде всего действенную силу или предоставленное право действовать
  choice: власть
  alternative: силу
  rationale: Контекст подразумевает действенность, однако лексема ἐξουσία обычно акцентирует власть, право или полномочие. Перевод «власть» не превращает просьбу Симона в утверждение о самостоятельном контроле над Святым Духом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Порядок «Дайте и мне» естественно передаёт включительное ударение κἀμοί. Фраза «всякий, на кого» сохраняет обобщённость, а «получал» — предполагаемый повторяемый результат.
