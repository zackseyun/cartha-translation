  source_fidelity: Перевод точно передаёт греческий текст. «Дайте и мне эту власть» адекватно отражает Δότε κἀμοὶ τὴν ἐξουσίαν ταύτην, а конструкция «чтобы всякий, на кого я возложу руки, получал...» сохраняет целевой характер ἵνα и обобщённую неопределённость ᾧ ἐὰν. «Святого Духа» верно передаёт πνεῦμα ἅγιον в данном контексте.
  naturalness: Текст звучит естественно на современном литературном русском и сохраняет сдержанный повествовательный библейский регистр. «И сказал» является нормальной русской передачей вводного причастия λέγων в связном повествовании. «Возложу руки» — устойчивое и понятное выражение.
  terminology: «Власть» — удачный основной эквивалент для ἐξουσίαν и не смешивает её без необходимости с «силой». Сноска корректно фиксирует допустимую альтернативу и кратко объясняет семантический диапазон. Написание «Святой Дух» соответствует контексту Деяний и не навязывает неоправданной неоднозначности.
