source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἐπορεύθη, καὶ ἰδοὺ ἀνὴρ Αἰθίοψ εὐνοῦχος δυνάστης ⸀Κανδάκης βασιλίσσης Αἰθιόπων, ὃς ἦν ἐπὶ πάσης τῆς γάζης αὐτῆς, ὃς ἐληλύθει προσκυνήσων εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/027.yaml
  text: So he got up and went[a]. And behold, an Ethiopian man, a eunuch, a high official of Candace, queen of the Ethiopians, who was over all her treasury, had come to Jerusalem to worship[b],
translation:
  language: ru
  text: Он встал и пошёл. И вот, эфиоп, евнух[a], сановник Кандаки[b], царицы эфиопов, который ведал всей её казной и прибыл в Иерусалим, чтобы поклониться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «придворный». Греческое слово может обозначать дворцового служащего, хотя здесь, вероятно, употреблено в буквальном смысле.'
    reason: lexical_alternative
  - marker: b
    text: «Кандаки», возможно, не личное имя, а династический титул царицы.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναστὰς ἐπορεύθη
  choice: встал и пошёл
  rationale: Передаёт последовательность действий аористного причастия и основного глагола естественным современным русским повествованием.
- source_word: ἰδοὺ
  choice: и вот
  rationale: Сохраняет явный повествовательный маркер привлечения внимания и характерную для Луки живость.
- source_word: ἀνὴρ Αἰθίοψ
  choice: эфиоп
  rationale: В русском существительное «эфиоп» уже однозначно обозначает мужчину; добавление «мужчина» было бы неестественно избыточным.
- source_word: εὐνοῦχος
  choice: евнух
  rationale: Передаёт основное буквальное значение слова; должностной статус отдельно выражен словом δυνάστης. Более широкое возможное значение отмечено в сноске.
- source_word: δυνάστης
  choice: сановник
  rationale: Естественно обозначает высокопоставленного носителя власти при царском дворе, не приписывая ему самостоятельного правления.
- source_word: Κανδάκης βασιλίσσης Αἰθιόπων
  choice: Кандаки, царицы эфиопов
  rationale: Сохраняет греческую форму имени или титула и множественный этноним; возможность династического титула отмечена в сноске.
- source_word: ἐπὶ πάσης τῆς γάζης αὐτῆς
  choice: ведавший всей её казной
  rationale: Передаёт административную ответственность, выраженную ἐπὶ, и институциональное значение γάζα.
- source_word: ἐληλύθει
  choice: приезжал
  rationale: Плюсквамперфект описывает предшествующее прибытие; русская форма несовершенного прошедшего здесь естественно обозначает состоявшуюся поездку, после которой персонаж уже возвращается, не добавляя этого прямо в стих.
- source_word: προσκυνήσων εἰς Ἰερουσαλήμ
  choice: в Иерусалим для поклонения
  rationale: Будущее причастие передано как цель поездки; формулировка естественна и сохраняет культовый смысл προσκυνέω.
theological_decisions:
- issue: Следует ли понимать εὐνοῦχος буквально или обобщённо как придворную должность
  choice: В основном тексте — «евнух»
  alternative: «придворный» или «дворцовый служащий»
  rationale: Буквальное значение лексически первично и сохраняет возможную повествовательную значимость телесного и общественного положения этого человека. Его высокий служебный ранг уже обозначен словом «сановник», поэтому обобщение создало бы смысловое дублирование.
- issue: Является ли Κανδάκη личным именем или династическим титулом
  choice: В основном тексте сохранено «Кандаки» без уточняющего толкования
  alternative: «кандаки» как титул царицы
  rationale: Форма исходного текста допускает традиционное восприятие как имени, тогда как исторические сведения указывают на титул; неоднозначность не разрешена молча и отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским повествовательным тоном. «И вот» сохраняет луканский маркер внимания; «сановник» понятно передаёт высокий придворный ранг. Все сноски имеют соответствующие маркеры в основном тексте.
