    text: 'Или: «переходя из дома в дом». Греческое выражение имеет распределительный смысл и указывает на повторяющееся посещение разных домов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλυμαίνετο
  choice: разорял
  rationale: Глагол передаёт продолжающееся жестокое опустошение и причинение тяжкого вреда; «разорял» сохраняет его силу и несовершенный вид, не сводя действие к общему «преследовал».
- source_word: ἐκκλησίαν
  choice: церковь
  rationale: В данном контексте речь идёт о сообществе верующих; «церковь» — естественное и устойчивое русское соответствие.
- source_word: κατὰ τοὺς οἴκους
  choice: в один дом за другим
  rationale: Передаёт распределительное значение κατά с множественным числом и повторяемость вторжений в разные дома.
- source_word: εἰσπορευόμενος
  choice: входил
  rationale: Причастная конструкция естественно развёрнута в однородное сказуемое; несовершенный вид передаёт продолжавшиеся и повторявшиеся действия.
- source_word: σύρων
  choice: силой уводил
  rationale: Передаёт принудительный характер σύρω и удаление людей из домов без неестественного для современного русского буквального «волочил».
- source_word: ἄνδρας καὶ γυναῖκας
  choice: мужчин и женщин
  rationale: Сохраняет подчёркнутый текстом охват обеих групп без стилистически избыточной добавки.
- source_word: παρεδίδου
  choice: передавал
  rationale: Несовершенный вид сохраняет повторяемость действия, а глагол передаёт выдачу людей властям или страже.
- source_word: εἰς φυλακήν
  choice: в тюрьму
  rationale: Прямо и естественно обозначает направление передачи людей для заключения.
theological_decisions:
- issue: Степень тяжести действий Савла до обращения
  choice: разорял церковь
  alternative: преследовал церковь
  rationale: Выбран сильный глагол, соответствующий λυμαίνομαι и изображённому в стихе систематическому насилию, без привнесения более поздней богословской оценки личности Савла.
translation_notes:
  register: Современный литературный русский язык с серьёзным повествовательным тоном. Причастия оригинала развёрнуты в последовательность однородных глаголов несовершенного вида, чтобы естественно передать длительность и повторяемость действий.
