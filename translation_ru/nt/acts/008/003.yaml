base_translation:
  language: en
  yaml_path: translation/nt/acts/008/003.yaml
  text: But Saul was ravaging the church[a], entering house after house; dragging off both men and women[b], he was handing them over to prison.
translation:
  language: ru
  text: 'А Савл разорял[a] церковь: входя в дома один за другим[b], он волочил мужчин и женщин и передавал их под стражу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жестоко преследовал»; греческий глагол выражает разорение и жестокое причинение вреда.'
