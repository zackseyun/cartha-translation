  text: Ἀνὴρ δέ τις ὀνόματι Σίμων προϋπῆρχεν ἐν τῇ πόλει μαγεύων καὶ ⸀ἐξιστάνων τὸ ἔθνος τῆς Σαμαρείας, λέγων εἶναί τινα ἑαυτὸν μέγαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/009.yaml
  text: A certain man named Simon had previously been in the city practicing magic and astonishing the people of Samaria[a], saying that he himself was someone great[b],
translation:
  language: ru
  text: А один человек по имени Симон уже был в этом городе, занимался магией[a] и изумлял народ Самарии, заявляя, что он — важная персона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «занимался колдовством». Греческий глагол означает занятие магическими искусствами.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «что он сам есть некто великий»; возможен перевод: «что он — великий человек».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: А один человек
  rationale: «Человек» здесь естественно передаёт ἀνήρ применительно к конкретному мужчине; δέ мягко вводит нового участника повествования, а τις сохраняет неопределённость.
- source_word: ὀνόματι Σίμων
  choice: по имени Симон
  rationale: Естественная русская передача дательного ὀνόματι с личным именем.
- source_word: προϋπῆρχεν
  choice: и прежде находился
  rationale: Передаёт предшествование, выраженное προϋπάρχω в имперфекте, не уточняя сверх текста ни длительность, ни постоянное проживание.
- source_word: ἐν τῇ πόλει
  choice: в этом городе
  rationale: Артикль отсылает к уже упомянутому в контексте городу; указательное «этом» естественно выражает такую анафору по-русски.
- source_word: μαγεύων
  choice: занимался магией
  rationale: Современная и понятная передача занятия магическими искусствами без добавления оценки их источника.
- source_word: ἐξιστάνων
  choice: изумлял
  rationale: Передаёт каузативный смысл «приводить в изумление» и продолжающийся характер действия.
- source_word: τὸ ἔθνος τῆς Σαμαρείας
  choice: народ Самарии
  rationale: В данном контексте ἔθνος обозначает население Самарии как общность; «народ» звучит естественнее политически окрашенной «нации».
- source_word: λέγων
  choice: говоря о себе
  rationale: Сохраняет нейтральный глагол речи, а добавление «о себе» естественно вводит содержание возвратной конструкции ἑαυτόν.
- source_word: εἶναί τινα ἑαυτὸν μέγαν
  choice: что он — некто великий
  rationale: «Некто великий» сохраняет неопределённое τινα, значение величия или важности в μέγαν и самовозвеличивающий характер высказывания.
theological_decisions:
- issue: Характер деятельности Симона
  choice: занимался магией
  alternative: занимался колдовством
  rationale: Стих говорит о магических практиках, но сам по себе не определяет их метафизический источник и не называет их обманом; перевод не добавляет такой оценки.
- issue: Самоопределение Симона
  choice: что он — некто великий
  alternative: что он великий человек
  rationale: Выбранная формулировка сохраняет необычную неопределённость греческого τινα и не уточняет, в каком именно смысле Симон считал себя великим.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Двоеточие делает связь между прежним присутствием Симона в городе и описанием его деятельности ясной, не меняя содержания. Формулировка «некто великий» намеренно сохраняет оттенок неопределённого, но притязательного самовозвеличивания.
