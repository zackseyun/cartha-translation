    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: когда ... увидел
  rationale: Аористное причастие имеет здесь временное значение; придаточное с «когда» естественно передаёт последовательность событий.
- source_word: δὲ
  choice: же
  rationale: Частица обозначает переход к реакции Симона и лёгкое противопоставление предыдущему повествованию; русское «же» передаёт это без чрезмерного усиления.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν
  choice: через возложение рук
  rationale: διά с родительным падежом обозначает средство; традиционное и понятное выражение «возложение рук» точно передаёт греческую конструкцию.
- source_word: τῶν ἀποστόλων
  choice: апостолов
  rationale: Родительный падеж сохраняет связь с возложением рук и не делает апостолов конечным источником дара.
- source_word: δίδοται
  choice: даётся
  rationale: Настоящее страдательное передано настоящим временем, естественным в косвенном наблюдении после глагола прошедшего времени и сохраняющим форму исходного текста.
- source_word: τὸ πνεῦμα
  choice: Дух
  rationale: Греческий текст говорит просто «Дух»; прописная буква указывает на ясный из контекста личный референт, не добавляя в основной текст слова «Святой».
- source_word: προσήνεγκεν
  choice: предложил
  rationale: В данном контексте глагол означает предложение или предоставление платы; «предложил» ясно передаёт намерение Симона.
- source_word: αὐτοῖς
  choice: им
  rationale: Естественно передаёт косвенное дополнение и указывает на апостолов.
- source_word: χρήματα
  choice: деньги
  rationale: Наиболее прямое и современное соответствие существительному в значении денежных средств.
theological_decisions:
- issue: Референт τὸ πνεῦμα
  choice: Дух, то есть Святой Дух
  alternative: Святой Дух
  rationale: В греческом тексте стоит только «Дух», а ближайший контекст ясно указывает на Святого Духа. Краткая форма сохранена в основном тексте, а явное наименование дано в сноске.
- issue: Средство и источник дарования Духа
  choice: через возложение рук апостолов даётся Дух
  alternative: апостолы дают Святого Духа возложением рук
  rationale: Формулировка сохраняет страдательный залог и значение средства у διά, не называя апостолов конечным источником Духа и не навязывая сакраментального либо антисакраментального вывода.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным строем. Конструкция «Когда же Симон увидел...» естественно передаёт греческое причастие и связующую частицу; богословская неоднозначность в вопросе о средстве и конечном источнике дарования Духа не устраняется.
