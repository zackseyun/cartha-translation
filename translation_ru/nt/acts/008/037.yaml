  language: en
  yaml_path: translation/nt/acts/008/037.yaml
  text: And Philip[a] said, “If you believe with all your heart, you may.” And he answered and said, “I believe that Jesus is the Messiah, the Son of God.”
translation:
  language: ru
  text: 'Филипп[a] сказал: «Если веришь всем сердцем, можно». Он ответил: «Верю, что Иисус Христос — Сын Божий».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот стих отсутствует в наиболее ранних греческих рукописях, в том числе в папирусах III века, а также в Синайском и Ватиканском кодексах IV века и в ранних коптских переводах. Он присутствует в византийской рукописной традиции большинства и в латинской традиции; его также приводят ранние христианские авторы, в частности Ириней и Киприан, в конце II века. Многие исследователи считают эти слова ранней формулой исповедания веры при крещении, позднее вошедшей в текст повествования Деяний.
    reason: textual_critical
lexical_decisions:
- source_word: ἔξεστιν
  choice: можно
  rationale: Безличное «можно» естественно передаёт разрешение совершить подразумеваемое из контекста крещение и не придаёт фразе излишне юридического оттенка.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: всем сердцем
  rationale: Сохраняет библейский образ сердца как средоточия внутренней жизни и передаёт полноту искренней веры естественным русским выражением.
- source_word: Πιστεύω
  choice: Верю
  rationale: В исповедальном контексте передаёт признание того, кем является Иисус, не сводя смысл только к интеллектуальному согласию.
- source_word: τὸν Ἰησοῦν Χριστόν
  choice: Иисус Христос
  rationale: Греческое сочетание с единым артиклем выступает здесь как обозначение личности, являющейся подлежащим косвенного высказывания; перевод сохраняет имя и титул в привычной русской форме.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: Сын Божий
  rationale: Традиционное и ясное русское соответствие христологическому титулу; именная конструкция с тире естественно передаёт греческий оборот с винительным падежом и инфинитивом.
theological_decisions:
- issue: Синтаксическая связь слов Ἰησοῦν Χριστόν и υἱὸν τοῦ θεοῦ
  choice: «Иисус Христос — Сын Божий»
  alternative: «Иисус — Христос, Сын Божий»
  rationale: В греческом тексте τὸν Ἰησοῦν Χριστόν представляет собой цельное обозначение лица, а τὸν υἱὸν τοῦ θεοῦ — именную часть при εἶναι. Поэтому перевод не превращает Χριστόν в отдельное второе сказуемое.
translation_notes:
  register: Современный литературный русский язык с краткой, естественной диалогической формой. «Тот ответил» устраняет тяжеловесное буквальное «ответив же, сказал», сохраняя смену говорящего. Тире в исповедании соответствует нормам русского именного предложения.
