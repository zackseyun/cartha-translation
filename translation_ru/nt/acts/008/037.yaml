  source_fidelity: 'Основной перевод точно передаёт византийский греческий текст: условие «если веришь всем сердцем», разрешение, а также исповедание Иисуса Христа Сыном Божьим. Безличное «можно» уместно сохраняет подразумеваемый из контекста предмет разрешения — крещение. Однако «Тот ответил» звучит несколько отстранённо и менее естественно, чем обычное русское «Он ответил».'
  naturalness: Современный литературный регистр в целом выдержан. «Если веришь всем сердцем, можно» кратко и естественно для диалога. Замена «Тот ответил» на «Он ответил» улучшает плавность речи без потери смысла.
  terminology: '«Иисус Христос» и «Сын Божий» — точные и устоявшиеся соответствия. Не следует перестраивать исповедание так, чтобы «Христос» становился отдельным сказуемым: данная формулировка адекватно выражает греческое отождествление Иисуса Христа с Сыном Божьим. Текстологическая сноска требует уточнения, поскольку в английском аудиторском следе прямо отмечено свидетельство Иринея и Киприана в конце II века.'
