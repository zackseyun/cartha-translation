  text: Φίλιππος δὲ κατελθὼν εἰς ⸀τὴν πόλιν τῆς Σαμαρείας ἐκήρυσσεν αὐτοῖς τὸν χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/005.yaml
  text: Philip went down to the city of Samaria and proclaimed the Messiah to them[a][b].
translation:
  language: ru
  text: Филипп же, спустившись в город Самарии[a][b], возвещал им Мессию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в один из городов Самарии». Греческое выражение можно понимать как указание либо на определённый город в Самарии, либо на один из городов Самарийской области.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «в город Самарию».'
    reason: previous_rendering
lexical_decisions:
- source_word: δὲ
  choice: же
  rationale: Слабая повествовательная связка; «же» естественно продолжает рассказ, не придавая ей сильного противительного смысла.
- source_word: κατελθὼν
  choice: пришёл
  rationale: Аористное причастие передано личной формой как предшествующее главному действию. Направление «вниз» в русском здесь не выражено отдельно, поскольку «спустился в город» может звучать как указание на рельеф самого города; пространственный оттенок греческого глагола не меняет сути сообщения.
- source_word: τὴν πόλιν τῆς Σαμαρείας
  choice: в город Самарии
  rationale: Сохраняется определённость существительного с артиклем и родительный оборот. Формулировка допускает понимание Самарии как области либо как названия города; альтернативное неопределённое понимание отмечено в сноске.
- source_word: ἐκήρυσσεν
  choice: возвещал
  rationale: Передаёт публичное провозглашение вести и сохраняет длительный характер имперфекта без узкоцерковного оттенка слова «проповедовал».
- source_word: αὐτοῖς
  choice: его жителям
  rationale: Местоименная отсылка естественно раскрыта по-русски как указание на людей в городе; это устраняет неясное «им» после формы «Самарии».
- source_word: τὸν χριστόν
  choice: Мессию
  rationale: 'Артикль и контекст возвещения указывают на титульное значение: речь идёт об обещанном Помазаннике, а не об имени собственном.'
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном контексте слово употреблено как титул возвещаемого Помазанника. «Мессия» ясно сохраняет это значение, тогда как «Христос» в современном русском часто воспринимается как часть имени.
- issue: Определённость выражения τὴν πόλιν τῆς Σαμαρείας
  choice: город Самарии
  alternative: один из городов Самарии
  rationale: Основной текст следует определённой форме греческого выражения, но не устраняет реальную возможность понимать его как некий город Самарийской области; она вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Возвещал» выбрано вместо более конфессионально окрашенного «проповедовал». Синтаксис сделан естественным для русского, а смысловая неоднозначность названия Самарии сохранена с помощью сносок.
