base_translation:
  language: en
  yaml_path: translation/nt/acts/008/034.yaml
  text: Then the eunuch answered Philip and said[a], “I ask you, about whom does the prophet say this—about himself or about someone else?”
translation:
  language: ru
  text: 'Тогда евнух спросил Филиппа: «Прошу тебя, о ком пророк говорит это — о самом себе или о ком-то другом?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: Тогда ... спросил
  rationale: Причастие ἀποκριθείς в сочетании с глаголом речи образует обычную повествовательную формулу. По-русски единый глагол «спросил» естественно передаёт и речевой отклик, и вопросительный характер последующей реплики; δέ обозначено переходом «тогда».
- source_word: ὁ εὐνοῦχος
  choice: евнух
  rationale: Сохранено конкретное обозначение персонажа, а не обобщённое «сановник» или «чиновник».
- source_word: τῷ Φιλίππῳ
  choice: Филиппа
  rationale: Дательный адресата естественно передан русским управлением глагола «спросил».
- source_word: Δέομαί σου
  choice: Прошу тебя
  rationale: Выражение передаёт почтительную, настойчивую просьбу. «Прошу тебя» в современном русском звучит естественно и сохраняет большую силу, чем нейтральное «скажи».
- source_word: περὶ τίνος
  choice: о ком
  rationale: Точно и естественно передаёт вопрос о лице, к которому относится пророческое высказывание.
- source_word: ὁ προφήτης λέγει τοῦτο
  choice: пророк говорит это
  rationale: Сохранены настоящее время и указательное местоимение, отсылающее к только что прочитанному месту Писания.
- source_word: περὶ ἑαυτοῦ ἢ περὶ ἑτέρου τινός
  choice: о самом себе или о ком-то другом
  rationale: «Самом» ясно подчёркивает возвратность ἑαυτοῦ, а «о ком-то другом» естественно передаёт неопределённое ἑτέρου τινός.
