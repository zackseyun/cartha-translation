  text: μετανόησον οὖν ἀπὸ τῆς κακίας σου ταύτης, καὶ δεήθητι τοῦ ⸀κυρίου εἰ ἄρα ἀφεθήσεταί σοι ἡ ἐπίνοια τῆς καρδίας σου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/022.yaml
  text: Therefore repent of this wickedness of yours[a], and pray to the Lord, if perhaps the intent of your heart may be forgiven you.
translation:
  language: ru
  text: 'Итак, покайся в этом своём злодеянии и помолись Господу: может быть, тебе простится намерение твоего сердца[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помысел твоего сердца».'
    reason: Лексема ἐπίνοια может означать намерение, замысел, мысль или помысел.
lexical_decisions:
- source_word: μετανόησον
  choice: покайся
  rationale: Аористный императив призывает к решительному покаянию; «покайся» естественно и ёмко передаёт нравственно-духовный смысл.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предшествующего обличения Петра и звучит естественно в современном русском повествовании.
- source_word: ἀπὸ τῆς κακίας σου ταύτης
  choice: в этом своём зле
  rationale: κακία здесь обозначает нравственное зло; русское управление «покаяться в» естественнее буквального «покаяться от», а «своём» сохраняет личную направленность σου.
- source_word: δεήθητι
  choice: помолись
  rationale: Передаёт настоятельное обращение с просьбой к Господу, не внося избыточно архаичного оттенка.
- source_word: τοῦ κυρίου
  choice: Господу
  rationale: Традиционное и контекстуально уместное соответствие κύριος; перевод не уточняет без необходимости, относится ли это обозначение здесь к Иисусу или к Богу.
- source_word: εἰ ἄρα
  choice: может быть
  rationale: Сохраняет условность и осторожность формулировки, не превращая прощение ни в гарантию, ни в невозможность.
- source_word: ἀφεθήσεταί σοι
  choice: тебе простится
  rationale: Сохраняет пассивную конструкцию и подразумеваемое Божье действие без добавления субъекта.
- source_word: ἡ ἐπίνοια
  choice: намерение
  rationale: В контексте речь идёт не просто о возникшей мысли, а о внутреннем замысле или намерении Симона; возможное более нейтральное значение отмечено в сноске.
- source_word: τῆς καρδίας σου
  choice: твоего сердца
  rationale: Формально соответствует генитиву и сохраняет библейское представление о сердце как средоточии внутренних намерений.
theological_decisions:
- issue: Степень уверенности в возможности прощения
  choice: Пётр велит Симону покаяться и молиться в надежде на прощение, но не гарантирует исход.
  alternative: Представить прощение как гарантированное после покаяния либо как маловероятное или невозможное.
  rationale: Оборот εἰ ἄρα намеренно выражает осторожную возможность; «может быть» сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формулировка краткая и доступная; двоеточие естественно связывает повеление молиться с содержанием надежды, выраженной осторожным «может быть».
