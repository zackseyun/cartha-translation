  text: ἐγνώρισάς μοι ὁδοὺς ζωῆς, πληρώσεις με εὐφροσύνης μετὰ τοῦ προσώπου σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/028.yaml
  text: You made known to me the paths of life[b][a]; you will fill me with gladness with your presence.
translation:
  language: ru
  text: Ты дал мне познать пути жизни; Ты исполнишь меня радостью пред лицом Твоим[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Твоём присутствии»; буквально: «с Твоим лицом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισάς μοι
  choice: Ты дал мне познать
  rationale: Передаёт аорист и каузативный смысл γνωρίζω естественным литературным русским языком, сохраняя местоимение μοι как «мне».
- source_word: ὁδοὺς ζωῆς
  choice: пути жизни
  rationale: 'Сохраняет множественное число и допускает присущую греческому сочетанию широту: пути, характеризуемые жизнью или ведущие к ней.'
- source_word: πληρώσεις με εὐφροσύνης
  choice: Ты исполнишь меня радостью
  rationale: Передаёт будущее время πληρώσεις и родительный содержания после глагола наполнения; «радость» естественно выражает εὐφροσύνη в возвышенном контексте.
- source_word: μετὰ τοῦ προσώπου σου
  choice: пред лицом Твоим
  rationale: Сохраняет образ лица и одновременно естественно передаёт смысл пребывания в Божьем присутствии.
theological_decisions:
- issue: Образ Божьего лица как обозначение присутствия
  choice: пред лицом Твоим
  alternative: в Твоём присутствии
  rationale: Формулировка сохраняет исходный образ и его богословскую насыщенность, оставаясь понятной в современном литературном русском языке; она не уточняет сверх текста характер этого присутствия.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным регистром, уместным для цитаты из Псалтири. Местоимения, обращённые к Богу, написаны с прописной буквы как издательская норма данного проекта.
