base_translation:
  language: en
  yaml_path: translation/nt/acts/002/012.yaml
  text: And they all were amazed and perplexed[a], saying to one another, “What does this mean?”
translation:
  language: ru
  text: 'И все они изумлялись и недоумевали, говоря друг другу: «Что это значит?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Чем это хочет быть?» Это греческий идиоматический оборот со значением «Что это значит?» или «Каков смысл этого?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: изумлялись
  rationale: Глагол передаёт сильное изумление; форма имперфекта указывает на продолжавшуюся реакцию. «Изумлялись» естественно передаёт и значение, и длительность.
- source_word: δὲ
  choice: И
  rationale: Здесь частица служит мягкой повествовательной связкой, а не выражает сильное противопоставление.
- source_word: πάντες
  choice: все они
  rationale: Сохраняет явный охват всей упомянутой группы и естественно звучит по-русски.
- source_word: διηπόρουν
  choice: недоумевали
  rationale: Передаёт состояние растерянности и неспособности понять происходящее; имперфект отражён глаголом несовершенного вида.
- source_word: ἄλλος πρὸς ἄλλον
  choice: друг другу
  rationale: Естественная современная русская передача взаимного выражения.
- source_word: λέγοντες
  choice: говоря
  rationale: Прямо и нейтрально передаёт причастие, вводящее содержание речи.
- source_word: Τί θέλει τοῦτο εἶναι;
  choice: Что это значит?
  rationale: Греческий оборот τί θέλει + инфинитив идиоматически спрашивает о смысле или значении происходящего. Буквальная передача была бы неестественна по-русски.
