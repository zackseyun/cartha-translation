base_translation:
  language: en
  yaml_path: translation/nt/acts/002/036.yaml
  text: Therefore let all the house of Israel know for certain that God has made him both Lord and Messiah—this Jesus whom you crucified[a][b].
translation:
  language: ru
  text: Итак, пусть весь дом Израиля твёрдо знает, что Бог сделал этого Иисуса, Которого вы распяли, и Господом, и Мессией[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христом». Греческое Χριστός здесь передано словом «Мессия», поскольку в речи Петра, обращённой к Израилю, оно употреблено как титул.'
    reason: alternative_reading
  - marker: b
    text: Слова «Бог сделал этого Иисуса и Господом, и Мессией» в контексте говорят о возвышении Иисуса и Его публичном утверждении в этих ролях, а не описывают изменение Его природы.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλῶς
  choice: твёрдо
  rationale: Передаёт уверенность и несомненность знания; сочетание «твёрдо знает» естественно для современного литературного русского языка.
- source_word: οὖν
  choice: итак
  rationale: Ясно обозначает вывод из предшествующего рассуждения Петра о воскресении и возвышении Иисуса.
- source_word: γινωσκέτω
  choice: пусть ... знает
  rationale: Сохраняет побудительную силу греческого императива третьего лица и его обращённость ко всему Израилю как единому целому.
- source_word: πᾶς οἶκος Ἰσραήλ
  choice: весь дом Израиля
  rationale: Сохраняет библейское собирательное выражение, обозначающее народ Израиля в целом.
- source_word: κύριον
  choice: Господом
  rationale: Передаёт титул и возвышенную власть Иисуса, а также сохраняет связь с предшествующей цитатой о Господе.
- source_word: Χριστόν
  choice: Мессией
  rationale: В обращении к дому Израиля слово употреблено как титул; «Мессия» непосредственно передаёт его смысл.
- source_word: ἐποίησεν
  choice: сделал
  rationale: Сохраняет прямую лексическую силу глагола, не заменяя её толкованием «назначил»; контекстуальный смысл пояснён в сноске.
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: этого Иисуса
  rationale: Сохраняет указательную и эмфатическую силу греческой конструкции.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: Которого вы распяли
  rationale: Прямо и естественно передаёт обвинительный акцент на участии слушателей в распятии Иисуса.
theological_decisions:
- issue: Смысл слов «Бог сделал Его и Господом, и Мессией»
  choice: Сохранена прямая формулировка «сделал», а в сноске указано на возвышение и явное утверждение Иисуса в этих достоинствах.
  alternative: Перевести «поставил» или «назначил», либо понять слова как изменение сущности Иисуса.
  rationale: Греческий глагол ἐποίησεν следует передать без преждевременного толкования. В контексте речь идёт о Божьем деянии в воскресении и возвышении Иисуса; текст сам по себе не требует вывода об изменении Его природы.
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Здесь слово явно выступает титулом в речи, обращённой к Израилю, поэтому «Мессия» лучше раскрывает его значение, а традиционный вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской формулы «дом Израиля». Синтаксис торжественный, но понятный; прописные местоимения по отношению к Иисусу использованы в соответствии с распространённой русской библейской традицией.
