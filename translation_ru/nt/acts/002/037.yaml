source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ κατενύγησαν ⸂τὴν καρδίαν⸃, εἶπόν τε πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους· Τί ⸀ποιήσωμεν, ἄνδρες ἀδελφοί;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/037.yaml
  text: When they heard this[a], they were pierced to the heart, and they said to Peter and the rest of the apostles, “What should we do[b], brothers?”
translation:
  language: ru
  text: 'Услышав это, они были пронзены в самое сердце[a] и сказали Петру и остальным апостолам: «Что нам делать, братья[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они были глубоко потрясены». Греческое выражение рисует образ пронзённого сердца и обозначает острое внутреннее потрясение или обличение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мужи братья». Это принятое обращение могло, в зависимости от состава аудитории, относиться как к мужчинам, так и ко всей группе, включая женщин.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Услышав это
  rationale: Аористное причастие передаёт обстоятельство, вызвавшее последующую реакцию. Местоимение «это» естественно отсылает к предшествующей речи Петра. Частица δέ здесь обозначает переход в повествовании и не требует отдельного перевода.
- source_word: κατενύγησαν τὴν καρδίαν
  choice: они были пронзены в самое сердце
  rationale: Сохранён яркий образ внутреннего пронзения, выражающий острое потрясение и осознание услышанного. «В самое сердце» звучит естественно по-русски и не уточняет без необходимости, было ли главным оттенком раскаяние, скорбь или тревога.
- source_word: εἶπόν τε
  choice: и сказали
  rationale: Перевод сохраняет значение глагола «сказать», не заменяя его более толковательным «спросили»; частица τε передана сочинительной связью.
- source_word: πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους
  choice: Петру и остальным апостолам
  rationale: Слово λοιπούς указывает на апостолов, оставшихся помимо отдельно названного Петра; «остальным» точно и естественно передаёт это соотношение.
- source_word: Τί ποιήσωμεν
  choice: Что нам делать
  rationale: Совещательное сослагательное наклонение выражает вопрос о должном образе действий. Русская конструкция с дательным субъектом естественно передаёт этот оттенок.
- source_word: ἄνδρες ἀδελφοί
  choice: братья
  rationale: Краткое обращение «братья» сохраняет родственный характер обращения и избегает неестественного буквального сочетания «мужи братья». Полная форма и возможный охват аудитории отмечены в сноске.
theological_decisions:
- issue: Характер внутренней реакции слушателей
  choice: Сохранить метафору пронзённого сердца
  alternative: «они глубоко расстроились» или «они почувствовали угрызения совести»
  rationale: Более объяснительные варианты либо ослабляют образ, либо однозначно называют реакцию раскаянием. Греческий текст описывает сильное внутреннее потрясение, не устраняя всех возможных оттенков.
- issue: Род и охват обращения ἄνδρες ἀδελφοί
  choice: «братья» в основном тексте с пояснением в сноске
  alternative: «братья и сёстры» или буквальное «мужи братья»
  rationale: Греческая форма грамматически мужская, поэтому инклюзивное расширение не внесено непосредственно в текст. Вместе с тем формульное обращение в контексте может охватывать всю собравшуюся общину, что отмечено без догматического разрешения вопроса.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и выразительной метафоры оригинала. Синтаксис краткий и устный, соответствующий непосредственной реакции слушателей; архаичное «мужи братья» вынесено в примечание.
