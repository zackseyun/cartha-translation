id: ACT.2.46
reference: Acts 2:46
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν τε προσκαρτεροῦντες ὁμοθυμαδὸν ἐν τῷ ἱερῷ, κλῶντές τε κατ’ οἶκον ἄρτον, μετελάμβανον τροφῆς ἐν ἀγαλλιάσει καὶ ἀφελότητι καρδίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/046.yaml
  text: And day by day[a], continuing together with one purpose in the temple courts, and breaking bread from house to house, they were sharing meals with gladness and simplicity of heart[d][c][b],
translation:
  language: ru
  text: Изо дня в день они единодушно продолжали собираться во дворах храма[a], преломляли хлеб по домам[b] и принимали пищу[c] с ликованием и простотой сердца[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в храме». Греческое слово обозначает весь храмовый комплекс, а не только внутреннее святилище.'
    reason: cultural_note
  - marker: b
    text: «Преломляли хлеб» может означать обычные совместные трапезы; некоторые также видят здесь указание на Вечерю Господню.
    reason: alternative_reading
  - marker: c
    text: 'Или: «вкушали пищу».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «с искренностью сердца»; возможно также: «с щедростью сердца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: изо дня в день
  rationale: Дистрибутивное выражение передаёт регулярность и повторяемость действия; по-русски звучит естественно и несколько выразительнее, чем «ежедневно».
- source_word: προσκαρτεροῦντες
  choice: продолжали собираться
  rationale: Причастие настоящего времени обозначает постоянство и упорное продолжение действия. Глагол «собираться» естественно сочетается с указанием места, хотя сам смысл совместности также поддерживается контекстом и словом ὁμοθυμαδόν.
- source_word: ὁμοθυμαδόν
  choice: единодушно
  rationale: Кратко и естественно передаёт единство намерения и настроя, не ограничивая смысл одной лишь физической совместностью.
- source_word: ἐν τῷ ἱερῷ
  choice: во дворах храма
  rationale: ἱερόν обозначает весь храмовый комплекс, а не внутреннее святилище; такая формулировка ясно передаёт доступное для собраний пространство.
- source_word: κλῶντές ... ἄρτον
  choice: преломляли хлеб
  rationale: Сохранено устойчивое выражение Луки, допускающее как обычную совместную трапезу, так и возможный евхаристический оттенок.
- source_word: κατ’ οἶκον
  choice: по домам
  rationale: 'Передаёт дистрибутивный смысл κατά: действие совершалось в разных домах, а не только у каждого в собственном доме.'
- source_word: μετελάμβανον τροφῆς
  choice: принимали пищу
  rationale: Точно передаёт продолжающееся участие в трапезе, не добавляя к глаголу отсутствующего в нём прямого значения раздачи или совместного владения.
- source_word: ἐν ἀγαλλιάσει
  choice: с ликованием
  rationale: ἀγαλλίασις обозначает сильную, торжествующую радость; «ликование» сохраняет эту интенсивность лучше нейтральной «радости».
- source_word: ἀφελότητι καρδίας
  choice: простотой сердца
  rationale: 'Близко к греческому выражению и сохраняет его смысловую широту: цельность, искренность, отсутствие притворства и расчёта.'
theological_decisions:
- issue: Обозначает ли «преломление хлеба» исключительно Вечерю Господню
  choice: Сохранить широкое выражение «преломляли хлеб» в контексте трапезы, не называя действие прямо таинством.
  alternative: Истолковать выражение только как обычную трапезу либо прямо перевести его как совершение Вечери Господней.
  rationale: В книгах Луки это выражение может обозначать обычную совместную еду и одновременно иметь евхаристический оттенок. Упоминание пищи поддерживает значение трапезы, но не устраняет возможной богослужебной связи; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; традиционное выражение «преломляли хлеб» сохранено ради его узнаваемости и намеренной смысловой открытости.
