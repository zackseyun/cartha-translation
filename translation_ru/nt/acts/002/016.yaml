lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт противопоставление и исправляет ошибочное понимание толпы в предыдущем контексте.
- source_word: τοῦτό ἐστιν
  choice: это и есть
  rationale: Естественная русская конструкция отождествления, сохраняющая указание на происходящее; частица «и» подчёркивает соответствие, не добавляя нового смысла.
- source_word: τὸ εἰρημένον
  choice: то, что было сказано
  rationale: Передаёт субстантивированное страдательное причастие и сохраняет пассивную форму высказывания.
- source_word: διὰ τοῦ προφήτου
  choice: через пророка
  rationale: Предлог διά с родительным падежом обозначает посредничество; «через» ясно сохраняет роль пророка как проводника вести.
- source_word: Ἰωήλ
  choice: Иоиля
  rationale: Употреблена традиционная русская библейская форма имени Иоиль в требуемом родительном падеже.
theological_decisions:
- issue: Пророческое посредничество в διὰ τοῦ προφήτου Ἰωήλ
  choice: через пророка Иоиля
  alternative: пророком Иоилем
  rationale: «Через» сохраняет различие между источником вести и пророком как её посредником, не навязывая более детальной теории вдохновения, чем выражено в тексте.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная, с традиционной русской формой имени «Иоиль». Маркер сноски помещён непосредственно после двоеточия, предваряющего последующую цитату.
