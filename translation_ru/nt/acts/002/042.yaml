  text: And they were devoting themselves to the apostles' teaching and the fellowship[c][b][a], to the breaking of bread and the prayers.
translation:
  language: ru
  text: Они постоянно посвящали себя учению апостолов, общению[a], преломлению хлеба[b] и молитвам[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
