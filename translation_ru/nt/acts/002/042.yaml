  - marker: b
    text: «Преломление хлеба» может означать совместные трапезы вообще; многие понимают, что здесь оно включает и Вечерю Господню.
    reason: alternative_reading
  - marker: c
    text: 'Возможно: «определённым молитвам»; определённый артикль может указывать на принятые времена или формы молитвы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δὲ προσκαρτεροῦντες
  choice: они неотступно следовали
  rationale: Перифрастический имперфект выражает продолжительное, привычное действие в прошлом, а προσκαρτερέω — постоянство и твёрдую приверженность. «Неотступно следовали» естественно передаёт оба оттенка.
- source_word: τῇ διδαχῇ τῶν ἀποστόλων
  choice: учению апостолов
  rationale: «Учение» — естественный современный эквивалент διδαχή; родительный падеж указывает прежде всего на учение, которое преподавали апостолы.
- source_word: τῇ κοινωνίᾳ
  choice: пребывали в общении
  rationale: κοινωνία охватывает общность жизни, участие и взаимное общение. Добавление «пребывали» по смыслу распространяет значение προσκαρτεροῦντες на следующий однородный член и делает русский синтаксис ясным, не сужая понятие до материальной помощи или таинства.
- source_word: τῇ κλάσει τοῦ ἄρτου
  choice: преломлении хлеба
  rationale: Сохранён устойчивый оборот Луки — Деяний без уточнения, идёт ли речь об общей трапезе, Вечере Господней или о практике, включавшей и то и другое.
- source_word: ταῖς προσευχαῖς
  choice: молитвах
  rationale: Множественное число передаёт повторяющуюся или совокупную молитвенную практику. Определённый артикль может указывать на установленные молитвы или их принятые времена и формы; эта возможность отмечена в сноске.
theological_decisions:
- issue: Следует ли понимать κλάσις τοῦ ἄρτου исключительно как Вечерю Господню
  choice: Сохранено более широкое «преломление хлеба»
  alternative: «Вечеря Господня», «евхаристия» или общие трапезы, включавшие Вечерю Господню
  rationale: Само выражение допускает как обычную совместную трапезу, так и особое воспоминание о Господе. Более узкий перевод внёс бы в основной текст вывод, которого формулировка однозначно не требует.
- issue: Следует ли сужать κοινωνία до материального обмена или сакраментального общения
  choice: Выбрано широкое «общение»
  alternative: «совместное участие», «общность», «разделение имущества» или «причастие»
  rationale: В контексте слово обозначает совместную жизнь и участие верующих, которые могли иметь и духовное, и материальное выражение. Широкий перевод сохраняет эту смысловую ёмкость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Неотступно» передаёт постоянство без архаического «пребывали в учении»; повтор «пребывали» введён для ясного и естественного присоединения κοινωνία. Термины намеренно не конфессионализированы.
