    rationale: Русская формулировка способна обозначать совместное действие вставания, а не положение Петра среди/вместе с одиннадцатью. «Стоя вместе с одиннадцатью» яснее передаёт синтаксическую связь греческого причастия с σύν.
  - severity: low
    issue: Пунктуация и порядок слов в обращении
    rationale: После «Иерусалима» в греческом следует не завершение реплики, а две связанные повелительные конструкции. Запятая и порядок «Да будет это вам известно» дают более естественное и связное русское обращение.
  revised_text: 'Пётр же, стоя вместе с одиннадцатью, возвысил голос и обратился к ним: «Мужи иудейские и все жители Иерусалима, да будет это вам известно, и внимайте моим словам».'
