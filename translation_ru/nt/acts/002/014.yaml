  text: Σταθεὶς δὲ ⸀ὁ Πέτρος σὺν τοῖς ἕνδεκα ἐπῆρεν τὴν φωνὴν αὐτοῦ καὶ ἀπεφθέγξατο αὐτοῖς· Ἄνδρες Ἰουδαῖοι καὶ οἱ κατοικοῦντες Ἰερουσαλὴμ ⸀πάντες, τοῦτο ὑμῖν γνωστὸν ἔστω καὶ ἐνωτίσασθε τὰ ῥήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/014.yaml
  text: 'But Peter[a], standing with the eleven, raised his voice and declared to them: “Men of Judea and all who dwell in Jerusalem, let this be known to you[b], and give ear to my words.”'
translation:
  language: ru
  text: 'Пётр же, стоя вместе с одиннадцатью, возвысил голос и обратился к ним: «Мужи иудейские и все жители Иерусалима, да будет это вам известно, и внимайте моим словам».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σταθεὶς δὲ ὁ Πέτρος
  choice: Пётр же, встав
  rationale: Аористное причастие передаёт действие, вводящее сцену; «встав» естественно по-русски. Частица δέ обозначает переход и лёгкое противопоставление насмешникам предыдущего стиха.
- source_word: σὺν τοῖς ἕνδεκα
  choice: вместе с одиннадцатью
  rationale: Сохраняет значение совместного выступления Петра с остальными одиннадцатью апостолами.
- source_word: ἐπῆρεν τὴν φωνὴν αὐτοῦ
  choice: возвысил голос
  rationale: Естественное русское соответствие идиоме публичной громкой речи; сохраняет достоинство повествования.
- source_word: ἀπεφθέγξατο αὐτοῖς
  choice: обратился к ним
  rationale: Глагол обозначает отчётливое, весомое публичное высказывание; «обратился» вводит речь без избыточного истолкования её как непременно пророческой.
- source_word: Ἄνδρες Ἰουδαῖοι
  choice: Мужи иудейские
  rationale: Сохраняет явно мужское обращение ἄνδρες и иудейскую идентичность адресатов; формула уместна для торжественной публичной речи.
- source_word: οἱ κατοικοῦντες Ἰερουσαλὴμ πάντες
  choice: все жители Иерусалима
  rationale: Передаёт всех проживающих в Иерусалиме естественнее для современного русского языка, чем буквальное «все живущие».
- source_word: τοῦτο ὑμῖν γνωστὸν ἔστω
  choice: Да будет вам известно это
  rationale: Сохраняет формальную императивную конструкцию ἔστω и объявительный характер фразы.
- source_word: ἐνωτίσασθε τὰ ῥήματά μου
  choice: внимайте моим словам
  rationale: Передаёт не просто слушание, а требование внимательно услышать; «моим словам» прямо соответствует τὰ ῥήματά μου.
theological_decisions:
- issue: Гендерная определённость обращения Ἄνδρες
  choice: Мужи иудейские
  alternative: Иудеи; народ иудейский
  rationale: В исходном тексте употреблено явно мужское ἄνδρες; нейтрализация устранила бы присутствующую в тексте особенность обращения.
- issue: Возможный оттенок вдохновенной или торжественной речи в ἀπεφθέγξατο
  choice: обратился к ним
  alternative: возгласил им; провозгласил им
  rationale: Контекст допускает весомую публичную речь, однако сам глагол здесь не требует внесения в перевод прямого утверждения о пророческом вдохновении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром публичной библейской речи. Формы «мужи иудейские», «да будет» и «внимайте» торжественны, но понятны; архаические или конфессионально маркированные обороты не вводятся.
