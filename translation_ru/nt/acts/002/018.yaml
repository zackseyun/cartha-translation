  text: καί γε ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου ἐν ταῖς ἡμέραις ἐκείναις ἐκχεῶ ἀπὸ τοῦ πνεύματός μου, καὶ προφητεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/018.yaml
  text: Even on my male servants and my female servants in those days I will pour out from my Spirit[b][a], and they will prophesy.
translation:
  language: ru
  text: И даже на Моих рабов и рабынь в те дни Я изолью от Духа Моего[a], и они будут пророчествовать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из Духа Моего». Греческий предлог буквально означает «от, из».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καί γε
  choice: и даже
  rationale: Сочетание частиц усиливает мысль; «и даже» естественно передаёт присоединительное и кульминационное значение.
- source_word: ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου
  choice: на Моих рабов и рабынь
  rationale: «Рабы и рабыни» сохраняет явное различение мужского и женского рода и подчёркивает низкое общественное положение названных людей.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: в те дни
  rationale: Прямой и естественный перевод временного оборота с указательным местоимением.
- source_word: ἐκχεῶ
  choice: Я изолью
  rationale: Передаёт будущее время и метафору обильного излияния.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: от Моего Духа
  rationale: Сохраняет значение предлога ἀπό — «от, из» — и не сводит конструкцию к простому родительному падежу.
- source_word: προφητεύσουσιν
  choice: они будут пророчествовать
  rationale: Прямо и ясно передаёт будущее время глагола προφητεύω, сохраняя библейский термин.
theological_decisions:
- issue: Передача δοῦλος/δούλη в контексте излияния Духа на людей низкого общественного положения
  choice: рабы / рабыни
  alternative: слуги / служанки
  rationale: Основные значения допускают оба варианта, но здесь парные формы и смысловое расширение круга получателей дара делают социальную несвободу и низкий статус особенно заметными; «рабы / рабыни» точнее сохраняет эту силу текста.
- issue: Передача ἀπὸ τοῦ πνεύματός μου
  choice: от Моего Духа
  alternative: Моего Духа
  rationale: Выбранный вариант явно передаёт ἀπό и сохраняет образ излияния, исходящего от Божьего Духа, не разрешая сверх текста вопрос о партитивном оттенке.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Инверсия «в те дни Я изолью» сохраняет смысловой акцент и остаётся естественной; гендерная пара «рабов и рабынь» передана без тяжеловесного уточнения «мужчин/женщин».
