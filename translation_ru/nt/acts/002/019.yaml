source:
  edition: SBLGNT
  text: καὶ δώσω τέρατα ἐν τῷ οὐρανῷ ἄνω καὶ σημεῖα ἐπὶ τῆς γῆς κάτω, αἷμα καὶ πῦρ καὶ ἀτμίδα καπνοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/019.yaml
  text: 'And I will give wonders in the heaven above and signs on the earth below: blood and fire and a cloud of smoke.'
translation:
  language: ru
  text: 'И явлю чудеса на небе вверху и знамения на земле внизу: кровь, огонь и облако дыма[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «испарение дыма» или «дымная мгла».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δώσω
  choice: явлю
  rationale: Буквально глагол означает «дам», однако по-русски сочетание «дам чудеса» неестественно. «Явлю» сохраняет смысл того, что Бог произведёт и покажет эти чудесные знамения, не сужая значение до простого зрительного показа.
- source_word: τέρατα
  choice: чудеса
  rationale: Слово обозначает необычайные, внушающие трепет явления; «чудеса» естественно образует традиционную библейскую пару со «знамениями» и не ограничивает речь исцелениями.
- source_word: ἐν τῷ οὐρανῷ ἄνω
  choice: на небе вверху
  rationale: Сохраняется пространственное и космическое противопоставление неба вверху земле внизу.
- source_word: σημεῖα
  choice: знамения
  rationale: «Знамения» передаёт смысл значимых указаний, а не просто необычных событий, и соответствует библейскому регистру.
- source_word: ἐπὶ τῆς γῆς κάτω
  choice: на земле внизу
  rationale: В противопоставлении небу γῆ означает землю как нижнюю часть космической пары, а не отдельную местность.
- source_word: αἷμα
  choice: кровь
  rationale: Прямой перевод сохраняет конкретный и яркий пророческий образ.
- source_word: πῦρ
  choice: огонь
  rationale: Прямой перевод сохраняет образ стихии в перечне знамений.
- source_word: ἀτμίδα καπνοῦ
  choice: облако дыма
  rationale: ἀτμίς может обозначать пар, испарение или дымку. «Облако дыма» естественно по-русски передаёт видимую массу дыма; более буквальная форма отмечена в сноске.
theological_decisions:
- issue: Передача космических мест в цитате из Иоиля
  choice: небо вверху … земля внизу
  alternative: небосвод вверху … суша внизу
  rationale: Контекст изображает космические пророческие знамения. Пара «небо — земля» сохраняет широту образа и не сводит его к погодным явлениям или локальной местности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Явлю» выбрано вместо формально буквального, но неестественного «дам чудеса»; пара «чудеса и знамения» сохраняет привычный и понятный библейский регистр.
