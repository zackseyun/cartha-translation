id: ACT.2.5
reference: Acts 2:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ⸀ἐν Ἰερουσαλὴμ κατοικοῦντες Ἰουδαῖοι, ἄνδρες εὐλαβεῖς ἀπὸ παντὸς ἔθνους τῶν ὑπὸ τὸν οὐρανόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/005.yaml
  text: There were Jews living in Jerusalem[b][a], devout men from every nation under heaven.
translation:
  language: ru
  text: В Иерусалиме жили иудеи[a] — благочестивые мужи из всех народов под небом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жители Иудеи». Здесь, ввиду слов «из всех народов под небом», вероятнее более широкое этнорелигиозное значение: «иудеи».'
    reason: alternative_reading
  - marker: b
    text: «Под небом» — библейское выражение со значением «по всему миру».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: жили
  rationale: δέ служит мягкой повествовательной связкой; в естественном русском отдельное «же» или «и» здесь необязательно. Глагольная конструкция передаёт наличие жителей без искусственного оборота «были живущие».
- source_word: ἐν Ἰερουσαλὴμ κατοικοῦντες
  choice: В Иерусалиме жили
  rationale: κατοικοῦντες обозначает проживание, а не кратковременное пребывание. Такой порядок слов естественен для русского повествования.
- source_word: Ἰουδαῖοι
  choice: иудеи
  rationale: 'В данном контексте слово имеет широкое этнорелигиозное значение: эти люди происходили из разных народов, но были иудеями.'
- source_word: ἄνδρες εὐλαβεῖς
  choice: благочестивые мужи
  rationale: ἄνδρες — определённо мужское обозначение, а εὐλαβεῖς характеризует почтительное к Богу благочестие. «Мужи» сохраняет достоинство библейского повествования и пол исходного обозначения.
- source_word: ἀπὸ παντὸς ἔθνους
  choice: из всех народов
  rationale: Греческое единственное число с πᾶς имеет распределительное значение. По-русски «из всех народов» звучит естественнее буквального «из каждого народа» и не требует понимать фразу как строгую статистическую всеобщность.
- source_word: τῶν ὑπὸ τὸν οὐρανόν
  choice: под небом
  rationale: Сохранена библейская идиома, означающая весь обитаемый мир; пояснение вынесено в сноску.
theological_decisions:
- issue: Значение Ἰουδαῖοι
  choice: иудеи
  alternative: жители Иудеи
  rationale: Указание на происхождение «из всех народов под небом» благоприятствует этнорелигиозному, а не узко региональному значению.
- issue: Передача ἄνδρες
  choice: мужи
  alternative: люди
  rationale: Исходное существительное имеет мужское значение; нейтральное «люди» устранило бы присутствующую в греческом тексте гендерную определённость.
- issue: Объём выражения «из всех народов под небом»
  choice: сохранить всеобъемлющую библейскую формулу
  alternative: со всего известного мира
  rationale: Перевод не ограничивает выражение заранее географией Римской империи, но сноска поясняет его идиоматический характер, не превращая риторическую всеобщность в техническое утверждение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Синтаксис упрощён по сравнению с буквальным «были… живущие», при этом сохранены смысл проживания, мужское обозначение ἄνδρες и идиома «под небом». Все маркеры сносок размещены непосредственно после относящихся к ним слов.
