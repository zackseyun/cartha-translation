  source_fidelity: 'Основной смысл передан верно: προϊδών — «предвидя», речь идёт о воскресении Мессии, ᾅδης корректно объяснён как область/мир мёртвых, а «плоть ... не увидела тления» точно передаёт образный оборот εἶδεν διαφθοράν. Однако двойное οὔτε ... οὔτε требует явного русского соответствия «ни ... ни», а сноска a неточно называет вариант «в гадесе» буквальным, хотя в греческом стоит εἰς («в/внутрь, к» в зависимости от конструкции).'
