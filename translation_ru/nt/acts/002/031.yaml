  text: προϊδὼν ἐλάλησεν περὶ τῆς ἀναστάσεως τοῦ χριστοῦ ὅτι ⸂οὔτε ἐγκατελείφθη⸃ εἰς ⸀ᾅδην ⸀οὔτε ἡ σὰρξ αὐτοῦ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/031.yaml
  text: 'Foreseeing this[a], he spoke about the resurrection of the Messiah: that he was neither abandoned to Hades[d][c][b], nor did his flesh see decay.'
translation:
  language: ru
  text: 'Предвидя это, он сказал о воскресении Мессии: что ни он не был оставлен в мире мёртвых[a], ни плоть его не увидела тления[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не был оставлен в Аиде». Греческое слово ᾅδης означает мир мёртвых, а не обязательно место окончательного наказания. Возможен также перевод: «не был оставлен миру мёртвых».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не увидела разложения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδὼν
  choice: Предвидя это
  rationale: Аористное причастие выражает предшествующее прозрение Давида; «это» естественно восполняется из контекста.
- source_word: ἐλάλησεν περὶ τῆς ἀναστάσεως
  choice: он сказал о воскресении
  rationale: Передаёт речь о конкретном предмете естественным современным русским языком.
- source_word: τοῦ χριστοῦ
  choice: Мессии
  rationale: В доводе Петра, основанном на Писании, Χριστός выступает прежде всего как титул обещанного Помазанника.
- source_word: οὔτε ἐγκατελείφθη εἰς ᾅδην
  choice: не был оставлен в мире мёртвых
  rationale: ἐγκαταλείπω означает «оставлять, покидать», а ᾅδης здесь обозначает область мёртвых; русское «в» естественно передаёт смысл пребывания после смерти, возможный в конструкции с εἰς.
- source_word: ἡ σὰρξ αὐτοῦ
  choice: плоть Его
  rationale: Сохраняет конкретный телесный смысл σάρξ и связь с цитируемым псалмом.
- source_word: εἶδεν διαφθοράν
  choice: не увидела тления
  rationale: Сохраняет семитизированный оборот оригинала; «тление» обозначает разложение тела и уместно в возвышенном библейском регистре.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Здесь слово подчёркнуто функционирует как титул ожидаемого Помазанника в пророческом толковании псалма.
- issue: Передача ᾅδης
  choice: мир мёртвых
  alternative: ад
  rationale: Так сохраняется значение области умерших без отождествления с окончательным местом наказания.
- issue: Передача σάρξ
  choice: плоть
  alternative: тело
  rationale: Оригинал говорит о физической плоти; буквальная передача сохраняет телесную направленность утверждения о воскресении.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Мир мёртвых» понятнее транслитерации «гадес» и точнее традиционного «ад»; инверсия «плоть Его» сохраняет достоинство цитатного контекста.
