revisions:
- from: 'Мужи братья,[a] позвольте мне со всей откровенностью сказать вам о патриархе Давиде: он умер и был похоронен, и его гробница находится у нас до сего дня.'
  to: 'Мужи, братья! Я могу прямо сказать вам о патриархе Давиде: он и умер, и был погребён, и гробница его находится среди нас по сей день.'
  rationale: Revision corrects the shift introduced by «позвольте мне», retains the paired emphasis of the two καί, and renders the communal-local expression ἐν ἡμῖν more directly. It preserves the explicit double masculine vocative and its lexical alternative without adding an unmarked ethnic interpretation to the footnote.
  reviewer_model: gpt-5.6-terra
