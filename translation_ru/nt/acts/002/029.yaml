review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys David's death, burial, continuing tomb, and the title «патриарх». However, «позвольте мне» recasts the impersonal expression ἐξὸν εἰπεῖν (“it is permissible/free for me to say”) as a request directed to the audience. The correlative καὶ … καὶ is also better retained as «и … и». «Среди нас» more directly represents ἐν ἡμῖν than «у нас».
  naturalness: The proposed revision retains a dignified public-speaking register while using clear modern Russian. «Мужи, братья!» is necessarily marked/archaizing because it preserves the Greek double masculine vocative; punctuation makes it readable as a formal double address. «По сей день» is more current than «до сего дня».
  terminology: «Патриарх Давид» and «гробница» are appropriate. The note should not define the address as referring to «соплеменникам», since that contextual identification is not part of the lexical meaning of Ἄνδρες ἀδελφοί. It should describe it more neutrally as a formal address to the assembled audience.
  issues:
  - severity: medium
    issue: «Позвольте мне» changes ἐξὸν εἰπεῖν into an imperative/request to the hearers.
    rationale: The Greek expresses the speaker's freedom or entitlement to speak, not a request that the audience grant permission.
  - severity: low
    issue: The correlative force of καὶ ἐτελεύτησεν καὶ ἐτάφη is not explicit.
    rationale: «Он и умер, и был погребён» naturally preserves the paired emphasis without undue literalism.
  - severity: low
    issue: The footnote adds «соплеменникам» as though it were encoded by the Greek address.
    rationale: The historical setting may support this description, but the phrase itself is simply a formal double vocative; the note should avoid presenting contextual inference as lexical content.
  revised_text: 'Мужи, братья! Я могу прямо сказать вам о патриархе Давиде: он и умер, и был погребён, и гробница его находится среди нас по сей день.'
  revised_footnotes:
  - marker: a
    text: 'Или: «Братья». Буквально по-гречески: «Мужи, братья» — формальное двойное обращение к собравшимся.'
    reason: lexical_alternative
  revision_rationale: Revision corrects the shift introduced by «позвольте мне», retains the paired emphasis of the two καί, and renders the communal-local expression ἐν ἡμῖν more directly. It preserves the explicit double masculine vocative and its lexical alternative without adding an unmarked ethnic interpretation to the footnote.
