  text: Ἄνδρες ἀδελφοί, ἐξὸν εἰπεῖν μετὰ παρρησίας πρὸς ὑμᾶς περὶ τοῦ πατριάρχου Δαυίδ, ὅτι καὶ ἐτελεύτησεν καὶ ἐτάφη, καὶ τὸ μνῆμα αὐτοῦ ἔστιν ἐν ἡμῖν ἄχρι τῆς ἡμέρας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/029.yaml
  text: Men[a], brothers, I may speak to you with boldness about the patriarch David, that he both died and was buried, and his tomb is among us to this day.
translation:
  language: ru
  text: 'Мужи, братья! Я могу прямо сказать вам о патриархе Давиде: он и умер, и был погребён, и гробница его находится среди нас по сей день.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Мужи братья
  rationale: Оба звательных обращения сохранены, как в греческом тексте. «Мужи» передаёт явную мужскую форму ἄνδρες, а «братья» — ἀδελφοί; отсутствие союза соответствует оригиналу и сохраняет торжественную форму обращения.
- source_word: ἐξὸν εἰπεῖν
  choice: позвольте мне… сказать
  rationale: Идиома выражает допустимость и свободу говорить, а не простую способность. Такая русская формулировка естественно передаёт вежливое риторическое утверждение о праве говорить откровенно.
- source_word: μετὰ παρρησίας
  choice: со всей откровенностью
  rationale: παρρησία обозначает открытую, свободную и смелую речь. «Со всей откровенностью» хорошо сочетается с русской речевой формулой «позвольте мне сказать» и подчёркивает прямоту высказывания.
- source_word: περὶ τοῦ πατριάρχου Δαυίδ
  choice: о патриархе Давиде
  rationale: Сохранён обычный титул «патриарх» без добавления отсутствующего в оригинале притяжательного местоимения «наш».
- source_word: καὶ ἐτελεύτησεν καὶ ἐτάφη
  choice: он умер и был похоронен
  rationale: Повтор καί подчёркивает оба факта; в современном русском естественное перечисление с «и» передаёт это без тяжеловесной конструкции «как… так и».
- source_word: τὸ μνῆμα αὐτοῦ
  choice: его гробница
  rationale: μνῆμα здесь означает известное место погребения. «Гробница» точнее передаёт сохраняющийся и узнаваемый погребальный объект, чем «могила».
- source_word: ἔστιν ἐν ἡμῖν
  choice: находится у нас
  rationale: Выражение указывает на наличие гробницы в местности или среде говорящего и слушателей. «У нас» естественно сохраняет одновременно местный и общинный оттенок.
- source_word: ἄχρι τῆς ἡμέρας ταύτης
  choice: до сего дня
  rationale: Устойчивая, понятная и уместно возвышенная русская формула, передающая непрерывное существование гробницы вплоть до момента речи.
theological_decisions:
- issue: Передача двойного обращения Ἄνδρες ἀδελφοί с учётом грамматического рода
  choice: Мужи братья
  alternative: Братья; братья и сёстры
  rationale: В греческом прямо употреблены два звательных слова мужского рода. Основной текст сохраняет их оба и не вводит женщин в явную форму обращения, тогда как примечание поясняет возможный естественный перевод без снятия историко-грамматической особенности.
translation_notes:
  register: Современный литературный русский с умеренно торжественным оттенком, соответствующим публичной речи Петра. Архаизирующее «мужи» сохранено только там, где оно необходимо для двойного обращения; остальной синтаксис сделан естественным и ясным.
