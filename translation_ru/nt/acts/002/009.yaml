lexical_decisions:
- source_word: Πάρθοι
  choice: парфяне
  rationale: Общепринятое русское название древнего народа; сохраняет этноним исходного текста.
- source_word: Μῆδοι
  choice: мидяне
  rationale: Традиционное и понятное русское название народа Мидии.
- source_word: Ἐλαμῖται
  choice: эламиты
  rationale: Устоявшееся русское название жителей Элама.
- source_word: οἱ κατοικοῦντες
  choice: жители
  rationale: Субстантивированное причастие обозначает людей, проживающих в названных областях; «жители» естественно и кратко передаёт этот смысл.
- source_word: τὴν Μεσοποταμίαν
  choice: Месопотамии
  rationale: Общепринятое русское географическое название, поставленное в родительном падеже после слова «жители».
- source_word: Ἰουδαίαν
  choice: Иудеи
  rationale: Традиционное русское название исторической области; здесь это географическое, а не этнорелигиозное обозначение.
- source_word: τε καὶ
  choice: и
  rationale: В перечне естественный русский союз «и» сохраняет связь между названиями; возможный лёгкий добавочный оттенок отмечен в сноске.
- source_word: Καππαδοκίαν
  choice: Каппадокии
  rationale: Устоявшаяся русская форма названия области.
- source_word: Πόντον
  choice: Понта
  rationale: Устоявшаяся русская форма названия исторической области.
- source_word: τὴν Ἀσίαν
  choice: Азии
  rationale: Сохраняет название исходного текста; историческое значение как римской провинции разъяснено в сноске.
