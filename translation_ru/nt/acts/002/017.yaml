id: ACT.2.17
reference: Acts 2:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἔσται ἐν ταῖς ἐσχάταις ἡμέραις, λέγει ὁ θεός, ἐκχεῶ ἀπὸ τοῦ πνεύματός μου ἐπὶ πᾶσαν σάρκα, καὶ προφητεύσουσιν οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν, καὶ οἱ νεανίσκοι ὑμῶν ὁράσεις ὄψονται, καὶ οἱ πρεσβύτεροι ὑμῶν ⸀ἐνυπνίοις ἐνυπνιασθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/017.yaml
  text: And it will be in the last days[a], says God, that I will pour out from my Spirit on all flesh, and your sons and your daughters will prophesy, and your young men will see visions[b], and your old men will dream dreams.
translation:
  language: ru
  text: «И будет в последние дни, — говорит Бог, — изолью от Духа Моего[a] на всякую плоть[b], и будут пророчествовать ваши сыновья и ваши дочери, и ваши юноши будут видеть видения, и ваши старики будут видеть сны».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «изолью от Духа Моего». Предлог ἀπό передаёт источник излияния.'
    reason: Поясняет необычную для русского предложную конструкцию, сохраняя её в основном тексте и не подменяя вариантом без предлога.
  - marker: b
    text: 'Или: «на всех людей». Выражение «всякая плоть» — пророческое обозначение людей.'
    reason: Раскрывает идиоматическое значение πᾶσα σάρξ, не устраняя образное выражение из основного текста.
lexical_decisions:
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: в последние дни
  rationale: Устоявшееся и естественное эсхатологическое выражение, точно передающее временную формулу греческого текста без уточнения её продолжительности.
- source_word: λέγει ὁ θεός
  choice: говорит Бог
  rationale: Сохраняет настоящее время пророческой формулы цитирования и её торжественное звучание.
- source_word: ἐκχεῶ
  choice: изолью
  rationale: Сохраняет конкретную метафору обильного излияния и естественно звучит в современной литературной русской речи.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: от Моего Духа
  rationale: Передаёт предлог ἀπό («от, из») точнее традиционного беспредложного оборота; прописная буква указывает на очевидного в контексте референта — Божьего Духа.
- source_word: ἐπὶ πᾶσαν σάρκα
  choice: на всякую плоть
  rationale: Сохраняет пророческий образ и связь с книгой Иоиля; смысл идиомы как обозначения людей пояснён в сноске.
- source_word: προφητεύσουσιν
  choice: будут пророчествовать
  rationale: Прямой и общепонятный эквивалент, не ослабляющий пророческого значения глагола.
- source_word: οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν
  choice: ваши сыновья и ваши дочери
  rationale: Сохраняет повтор притяжательного местоимения и подчёркнутое включение обоих полов.
- source_word: οἱ νεανίσκοι ὑμῶν ὁράσεις ὄψονται
  choice: ваши юноши будут видеть видения
  rationale: Передаёт мужской род и возрастную категорию существительного, а также смысл греческой однокоренной конструкции естественным русским выражением.
- source_word: οἱ πρεσβύτεροι ὑμῶν
  choice: ваши старики
  rationale: В противопоставлении юношам речь идёт о возрасте, а не о должности старейшины; современное слово «старики» делает это различие ясным.
- source_word: ἐνυπνίοις ἐνυπνιασθήσονται
  choice: будут видеть сны
  rationale: Естественно передаёт однокоренную греческую конструкцию и сохраняет параллелизм с выражением «видеть видения».
theological_decisions:
- issue: Объём значения выражения ἐπὶ πᾶσαν σάρκα
  choice: Сохранить в основном тексте «на всякую плоть».
  alternative: на всех людей; на всё человечество
  rationale: Буквальный пророческий образ сохраняет межтекстовую связь и широту обещания, а сноска раскрывает его идиоматический человеческий референт, не сужая круг заранее.
- issue: Референт πνεῦμα в словах Бога
  choice: «Моего Духа» с прописной буквы
  alternative: «моего духа» со строчной буквы
  rationale: Контекст прямо представляет Дух как Божий Дух, изливаемый Богом; прописная буква ясно передаёт этот референт, не добавляя конфессионально специфического толкования.
- issue: Значение предлога ἀπό при излиянии Духа
  choice: «от Моего Духа»
  alternative: «Мой Дух»; «Духа Моего»
  rationale: Необычная формулировка сохраняет исходный предлог и допускаемую им оттеночную идею исходящего от Духа дара, не делая вывода о делимости Духа; более привычный русский вариант дан в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественным пророческим ритмом. Сохранены параллельные конструкции и повтор «ваши». Архаизмы вроде «отроки» и потенциально должностное «старейшины» не использованы; «старики» ясно выражает возрастной контраст с юношами.
