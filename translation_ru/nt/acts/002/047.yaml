  text: αἰνοῦντες τὸν θεὸν καὶ ἔχοντες χάριν πρὸς ὅλον τὸν λαόν. ὁ δὲ κύριος προσετίθει τοὺς σῳζομένους καθ’ ἡμέραν ⸂ἐπὶ τὸ αὐτό⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/047.yaml
  text: praising God and having favor with all the people[a]. And the Lord was adding day by day those who were being saved to them.
translation:
  language: ru
  text: восхваляя Бога и пользуясь расположением всего народа. Господь же изо дня в день присоединял к ним[a] тех, кто спасался.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вместе» или «в одном месте». Греческое выражение ἐπὶ τὸ αὐτό допускает эти значения.'
    reason: alternative_reading
lexical_decisions:
- source_word: αἰνοῦντες τὸν θεόν
  choice: восхваляя Бога
  rationale: Причастие настоящего времени передаёт продолжающееся действие общины; «восхваляя» естественно и достойно звучит по-русски.
- source_word: ἔχοντες χάριν πρὸς ὅλον τὸν λαόν
  choice: пользуясь расположением всего народа
  rationale: Оборот означает, что община пользовалась благосклонностью окружающего народа, а не сама оказывала ему милость.
- source_word: ὁ δὲ κύριος
  choice: Господь же
  rationale: '«Же» естественно передаёт переход δέ и сохраняет повествовательное противопоставление: община действовала, но присоединял Господь.'
- source_word: προσετίθει
  choice: изо дня в день присоединял
  rationale: Несовершенный вид глагола вместе с обстоятельством времени передаёт повторяющееся, продолжающееся действие.
- source_word: τοὺς σῳζομένους
  choice: тех, кто спасался
  rationale: Формулировка сохраняет процессуальное значение причастия настоящего времени и не превращает его в статичное обозначение «спасённые».
- source_word: καθ’ ἡμέραν
  choice: изо дня в день
  rationale: 'Естественно передаёт распределительное значение: действие повторялось каждый день.'
- source_word: ἐπὶ τὸ αὐτό
  choice: к ним
  rationale: В сочетании с «присоединял» контекст указывает на присоединение к уже существующей общине; местоимение не вводит отсутствующее в греческом слово «число». Возможные пространственно-собирательные значения сохранены в сноске.
theological_decisions:
- issue: Вид и богословское значение τοὺς σῳζομένους
  choice: тех, кто спасался
  alternative: спасённых; тех, кто был спасён
  rationale: Настоящее страдательное причастие представляет спасение в процессе. Перевод сохраняет эту перспективу, не решая тем самым более широких богословских вопросов о порядке спасения.
- issue: Значение ἐπὶ τὸ αὐτό
  choice: к ним
  alternative: вместе; в одном месте
  rationale: При προσετίθει наиболее вероятен смысл присоединения людей к общине, однако сам оборот допускает значение совместности или нахождения в одном месте; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Начальная строчная буква сохранена, поскольку стих продолжает синтаксическую конструкцию предыдущего контекста.
