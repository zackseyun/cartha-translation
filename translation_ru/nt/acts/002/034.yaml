  text: οὐ γὰρ Δαυὶδ ἀνέβη εἰς τοὺς οὐρανούς, λέγει δὲ αὐτός· Εἶπεν ⸀ὁ κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/034.yaml
  text: For David did not ascend into the heavens[a], but he himself says, ‘The Lord said to my Lord, “Sit at my right hand,”’
translation:
  language: ru
  text: 'Ведь Давид не взошёл на небеса[a], но он сам говорит: «Сказал Господь Господу моему: „Сядь по правую руку от меня“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Псалом 109:1 по нумерации Септуагинты и русской синодальной традиции (110:1 по еврейской нумерации). В еврейском тексте первое обозначение Господа передаёт Божье имя YHWH: «YHWH сказал Господу моему».'
    reason: Уточняет источник цитаты, различие нумерации и то, что в еврейском тексте первое обозначение соответствует имени YHWH, тогда как в греческом тексте в обоих случаях употреблено κύριος.
lexical_decisions:
- source_word: ἀνέβη
  choice: взошёл
  rationale: Аорист ἀναβαίνω обозначает восхождение; «взошёл» естественно звучит по-русски и сохраняет библейскую образность.
- source_word: εἰς τοὺς οὐρανούς
  choice: на небеса
  rationale: Сохраняется множественное число греческого текста и привычное русское библейское выражение.
- source_word: λέγει δὲ αὐτός
  choice: но он сам говорит
  rationale: «Но» передаёт лёгкое противопоставление δέ, а «сам» сохраняет усилительное значение αὐτός; настоящее время вводит действующее слово Писания.
- source_word: ὁ κύριος
  choice: Господь
  rationale: Основной текст следует греческому κύριος; связь первого слова с именем YHWH в еврейском тексте псалма пояснена в сноске.
- source_word: τῷ κυρίῳ μου
  choice: Господу моему
  rationale: Сохраняет повтор κύριος и мессианскую силу цитаты, не сводя значение к нейтральному «господину».
- source_word: Κάθου
  choice: Сядь
  rationale: Прямой и естественный русский императив, соответствующий повелению занять почётное место.
- source_word: ἐκ δεξιῶν μου
  choice: по правую руку от Меня
  rationale: Устойчивое русское выражение для места чести и власти, точно передающее идиоматический смысл конструкции.
theological_decisions:
- issue: Передача двух употреблений κύριος в цитате из Псалма 109:1 по нумерации Септуагинты (110:1 по еврейской нумерации)
  choice: 'Оба переданы как «Господь»: «Сказал Господь Господу моему».'
  alternative: «Сказал Яхве Господу моему» или типографическое различение первого «ГОСПОДЬ».
  rationale: В греческом исходном тексте в обоих случаях стоит κύριος. Основной текст сохраняет эту форму и заложенную в ней риторическую связь, а то, что первое слово соответствует имени YHWH в еврейском псалме, вынесено в сноску.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Инверсия «не Давид взошёл» сохраняет смысловой акцент греческого οὐ γὰρ Δαυὶδ; прописная буква в «Меня» отражает прямую речь Бога в цитате.
