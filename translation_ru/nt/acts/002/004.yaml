lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: исполнились
  rationale: Аорист пассива от πίμπλημι обозначает наполнение; «исполнились Святого Духа» — естественная для возвышенного повествования русская формулировка, передающая внезапно наступившее состояние.
- source_word: πάντες
  choice: все они
  rationale: Передаёт полноту всей присутствующей группы; местоимение делает русское предложение ясным и плавным.
- source_word: πνεύματος ἁγίου
  choice: Святого Духа
  rationale: В контексте Деяний речь идёт о конкретном Божьем Духе, который далее выступает действующим лицом; родительный падеж обусловлен глаголом «исполнились».
- source_word: ἤρξαντο λαλεῖν
  choice: начали говорить
  rationale: Точно передаёт начинательное значение ἤρξαντο с инфинитивом и естественно звучит по-русски.
- source_word: ἑτέραις γλώσσαις
  choice: на иных языках
  rationale: «Языках» сохраняет основное значение γλῶσσαι в данном контексте, а «иных» передаёт отличие от обычной речи и не опережает дальнейшее пояснение повествования.
- source_word: καθὼς
  choice: как
  rationale: Кратко и естественно вводит способ или меру речи, определяемую действием Духа.
- source_word: ἐδίδου
  choice: давал
  rationale: Несовершенный вид русского глагола передаёт продолженное действие греческого имперфекта.
- source_word: ἀποφθέγγεσθαι
  choice: высказываться
  rationale: Передаёт способность произносить связную, явную речь и позволяет избежать тяжёлого повтора «говорить… говорить»; при этом не сужает смысл до пророчества.
- source_word: αὐτοῖς
  choice: им
  rationale: Естественно передаёт дательный падеж получателей даруемой Духом способности речи.
theological_decisions:
- issue: Личный божественный референт выражения πνεύματος ἁγίου
  choice: Святого Духа
  alternative: святого духа
  rationale: Контекст Деян. 2 представляет Духа как обещанного Божьего Духа и как действующего субъекта, дающего людям способность говорить; прописные буквы обозначают конкретного референта без добавления догматических уточнений.
- issue: 'Значение γλώσσαις: языки или языки как особый вид речи'
  choice: на иных языках
  alternative: иными языками
  rationale: Русское «на иных языках» понятно современному читателю и согласуется с Деян. 2:6–11, где слушатели узнают свои языки. Сноска сохраняет лексическую широту греческого слова и не навязывает более узкого богословского толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Исполнились» и «иных» сохраняют достоинство стиля, оставаясь понятными; архаичное «провещевать» заменено современным «высказываться».
