base_translation:
  language: en
  yaml_path: translation/nt/acts/002/006.yaml
  text: And when this sound occurred[a], the crowd came together and was bewildered[b], because each one was hearing them speaking in his own dialect.
translation:
  language: ru
  text: Когда раздался этот звук, собралась толпа и пришла в замешательство, потому что каждый слышал, как они говорили на его собственном наречии[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на его собственном языке». Греческое слово может обозначать как язык, так и местное наречие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης δὲ τῆς φωνῆς ταύτης
  choice: Когда раздался этот звук
  rationale: Генитив абсолютный передаёт временное обстоятельство. φωνή здесь естественно понимать как слышимый «звук»; глагол «раздался» идиоматичен по-русски и не уточняет природу явления сверх текста.
- source_word: συνῆλθε τὸ πλῆθος
  choice: собрался народ
  rationale: συνέρχομαι обозначает схождение людей в одном месте, а πλῆθος — множество людей. «Собрался народ» звучит естественно и достойно в современном русском повествовании.
- source_word: συνεχύθη
  choice: пришёл в замешательство
  rationale: Пассивная форма συγχέω описывает смятение и растерянность собравшихся; выражение сохраняет силу оригинала без чрезмерной драматизации.
- source_word: ἤκουον εἷς ἕκαστος
  choice: каждый слышал
  rationale: «Каждый» сохраняет подчёркнуто распределительное значение εἷς ἕκαστος. Русский несовершенный вид «слышал» естественно передаёт длительность или повторяемость имперфекта.
- source_word: τῇ ἰδίᾳ διαλέκτῳ
  choice: на его родном наречии
  rationale: διάλεκτος может обозначать язык или местную форму речи. «Родное наречие» сохраняет регионально-языковой оттенок слова и согласуется с распределительным единственным числом «каждый».
- source_word: λαλούντων αὐτῶν
  choice: как они говорили
  rationale: Оборот естественно передаёт причастную конструкцию и сохраняет местоименную отсылку оригинала, не уточняя без основания, кто именно говорил.
theological_decisions:
- issue: Распределительная конструкция и род местоимения
  choice: каждый слышал ... на его родном наречии
  alternative: каждый слышал ... на своём родном наречии
  rationale: Форма «его» яснее показывает, что наречие принадлежит каждому слушателю, а не говорящим. Мужской род обусловлен грамматическим согласованием с обобщающим «каждый» и не ограничивает группу только мужчинами.
- issue: Характер языкового явления
  choice: родное наречие
  alternative: родной язык
  rationale: Перевод не решает богословски, шла ли речь о самостоятельных языках или региональных разновидностях речи. «Наречие» ближе к διάλεκτος, а сноска сохраняет более широкую лексическую возможность.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Сохранены распределительное «каждый», длительный оттенок имперфекта и неоднозначность слова διάλεκτος. Архаизмы и конфессионально окрашенные уточнения не используются.
