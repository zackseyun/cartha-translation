  text: ὅτι οὐκ ἐγκαταλείψεις τὴν ψυχήν μου εἰς ⸀ᾅδην, οὐδὲ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/027.yaml
  text: because you will not abandon my soul to Hades[c][b][a], nor will you let your Holy One see decay.
translation:
  language: ru
  text: потому что Ты не оставишь моей души в мире мёртвых[a] и не дашь Твоему Святому[b] увидеть тление[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. «в Аиде», то есть в мире мёртвых; в еврейском тексте цитируемого псалма стоит «шеол».
    reason: alternative_reading
  - marker: b
    text: 'Или: «Твоему верному».'
    reason: lexical_alternative
  - marker: c
    text: То есть телесное разложение.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκαταλείψεις
  choice: не оставишь
  rationale: Передаёт будущее время и смысл оставления кого-либо в определённом месте или состоянии; естественно и точно по-русски.
- source_word: τὴν ψυχήν μου
  choice: моей души
  rationale: Сохраняет образность цитируемого псалма и допустимую многозначность ψυχή («душа», «жизнь», «я сам»), не превращая выражение в техническое утверждение об устроении человека.
- source_word: εἰς ᾅδην
  choice: в царстве мёртвых
  rationale: Функционально передаёт ᾅδης как мир или область умерших, избегая современного понимания слова «ад» исключительно как места окончательного наказания. При глаголе «оставить» русское «в» естественно передаёт пребывание, подразумеваемое греческой конструкцией.
- source_word: δώσεις
  choice: не дашь
  rationale: Сохраняет форму греческой идиомы διδόναι с инфинитивом, которая здесь означает «допустить, позволить»; выражение ясно в современном русском языке.
- source_word: τὸν ὅσιόν σου
  choice: Твоему Святому
  rationale: ὅσιος обозначает святого, благочестивого или верного Богу человека. «Святому» сохраняет мессианское звучание в контексте Деян 2; прописная буква отражает отнесение слов к Иисусу в ближайшем контексте.
- source_word: ἰδεῖν διαφθοράν
  choice: увидеть тление
  rationale: Близко передаёт греческую идиому и сохраняет традиционно понятное библейское обозначение телесного разложения; сноска уточняет физический смысл.
theological_decisions:
- issue: Передача ᾅδης в цитате о воскресении
  choice: царство мёртвых
  alternative: ад; шеол; могила
  rationale: «Царство мёртвых» выражает значение греческого термина в данном контексте, не отождествляя его без пояснения с геенной или окончательным наказанием. Сноска сохраняет сведения о греческом слове и еврейском фоне цитаты.
- issue: Христологическое отнесение τὸν ὅσιόν σου
  choice: Твоему Святому
  alternative: Твоему верному; Твоему благочестивому
  rationale: Пётр далее прямо относит слова псалма к воскресению Иисуса. Перевод сохраняет как лексическое значение, так и христологическую силу контекста, а сноска отмечает реальную альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. Местоимения, обращённые к Богу, написаны с прописной буквы. «Царство мёртвых» выбрано ради ясности, а формально более близкие термины сохранены в сноске.
