lexical_decisions:
- source_word: ἕως ἂν
  choice: пока не
  rationale: Сочетание указывает на будущий предел времени; конструкция «пока не» естественно передаёт это значение по-русски и сохраняет связь с предшествующим контекстом.
- source_word: θῶ
  choice: Я не положу
  rationale: Форма от τίθημι буквально означает «класть, помещать». В сочетании с образом подножия «положу» точно и естественно передаёт действие, не заменяя метафору толкованием.
- source_word: τοὺς ἐχθρούς σου
  choice: врагов Твоих
  rationale: Прямой перевод сохраняет личный и царский контекст противостояния в цитате из псалма.
- source_word: ὑποπόδιον
  choice: к подножию
  rationale: «Подножие» — традиционное и понятное обозначение опоры для ног; предлог «к» в конструкции «положить к подножию» создаёт естественную русскую формулировку, при этом несколько ослабляет буквальную предикативность греческого оборота, что отмечено в сноске.
- source_word: τῶν ποδῶν σου
  choice: ног Твоих
  rationale: Родительный падеж близко воспроизводит греческую конструкцию и сохраняет конкретный образ подножия, принадлежащего ногам адресата.
theological_decisions:
- issue: Образ царского покорения в цитате из Псалма 109:1 по нумерации Септуагинты и русской традиции (Псалом 110:1 в еврейской/западной нумерации)
  choice: Сохранён конкретный образ врагов у подножия ног.
  alternative: «пока Я полностью не покорю Твоих врагов»
  rationale: Буквенный образ несёт царский и мессианский смысл исходного псалма. Его не следует заменять разъясняющим пересказом, который заранее сводит метафору к одному толкованию.
translation_notes:
  register: Современный литературный русский с возвышенностью, уместной для прямой цитаты из Писания. Местоимения, относящиеся к адресату Божьей речи, написаны с прописной буквы. Основной текст сохраняет образ подножия; буквальная предикативная конструкция вынесена в сноску.
