  yaml_path: translation/nt/acts/002/003.yaml
  text: And tongues like fire appeared to them, being divided, and it came to rest on each one of them[a].
translation:
  language: ru
  text: И явились им разделяющиеся языки, как будто из огня, и опустились на каждого из них.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «разделённые языки, словно огненные» или «языки, как будто из огня». Греческая фраза подчёркивает и видимый облик явления, и его распределение среди присутствующих. Глагол «опустились» в оригинале стоит в единственном числе; это может представлять явление как единое целое, хотя относится к распределённым языкам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθησαν αὐτοῖς
  choice: явились им
  rationale: Передаёт видимое проявление естественным русским оборотом, без неуклюжей пассивной конструкции «были увидены».
- source_word: διαμεριζόμεναι
  choice: они разделялись
  rationale: Сохраняет причастное значение процесса или распределения, не уточняя сверх текста, разделялись ли языки сами или распределялись между присутствующими.
- source_word: γλῶσσαι
  choice: языки
  rationale: Сохраняет зримый образ языков пламени и одновременно лексическую связь с последующей речью на иных языках; перевод «пламя» устранил бы эту многозначность.
- source_word: ὡσεὶ πυρός
  choice: словно огненные
  rationale: 'Ясно выражает сравнение, а не тождество: явление было подобно огню, но текст не называет его буквальным огнём.'
- source_word: ἐκάθισεν
  choice: по одному опустилось
  rationale: Единственное число греческого глагола сохранено формой «опустилось»; добавленное «по одному» естественно связывает собирательно осмысленное явление с каждым присутствующим и передаёт образ остановившегося на человеке знамения.
- source_word: ἐφ’ ἕνα ἕκαστον αὐτῶν
  choice: на каждого из них
  rationale: Сохраняет подчёркнуто индивидуальное распределение среди всех присутствующих.
theological_decisions:
- issue: Природа явления в Пятидесятницу
  choice: «языки, словно огненные» — видимое явление, уподобленное огню
  alternative: «языки пламени» как буквальный огонь или «языки» только в значении человеческих языков
  rationale: ὡσεὶ обозначает сравнение, а γλῶσσαι сохраняет как зрительный образ, так и связь с последующим даром речи; перевод не должен превращать знамение ни в буквальный огонь, ни исключительно в метафору языков.
- issue: Единственное число ἐκάθισεν при множественном γλῶσσαι
  choice: 'сохранить единственное число: «по одному опустилось»'
  alternative: 'согласовать по смыслу во множественном числе: «опустились»'
  rationale: Греческая форма единственного числа может представлять распределённое явление как единое целое. Сохранение грамматического напряжения не устраняет подлинную особенность исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка «словно огненные» понятна широкой аудитории и сохраняет сравнение; точка с запятой облегчает чтение сложной греческой конструкции.
