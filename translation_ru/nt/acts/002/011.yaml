  text: Ἰουδαῖοί τε καὶ προσήλυτοι, Κρῆτες καὶ Ἄραβες, ἀκούομεν λαλούντων αὐτῶν ταῖς ἡμετέραις γλώσσαις τὰ μεγαλεῖα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/011.yaml
  text: both Jews and proselytes[a], Cretans and Arabs—we hear them speaking in our own languages the mighty works of God.
translation:
  language: ru
  text: иудеи и прозелиты, критяне и арабы — мы слышим, как они говорят на наших родных языках[a] о великих делах Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «на наших наречиях». Греческое слово может означать «язык» или «наречие»; здесь контекст указывает на понятные человеческие языки.
    reason: Лексическая многозначность γλώσσαις; контекстуальное уточнение значения в повествовании о Пятидесятнице.
lexical_decisions:
- source_word: Ἰουδαῖοί
  choice: иудеи
  rationale: В контексте перечня народов и групп это этнорелигиозное обозначение еврейского народа, а не только жителей Иудеи.
- source_word: τε καὶ
  choice: и
  rationale: Русское «и» естественно связывает иудеев с прозелитами; более буквальная парная конструкция здесь звучала бы тяжеловесно.
- source_word: προσήλυτοι
  choice: прозелиты
  rationale: Точный и устоявшийся термин для неевреев, принявших иудаизм; он конкретнее общего слова «обращённые».
- source_word: Κρῆτες
  choice: критяне
  rationale: Устоявшееся русское название жителей Крита.
- source_word: Ἄραβες
  choice: арабы
  rationale: Естественное современное русское название соответствующего народа.
- source_word: ἀκούομεν
  choice: мы слышим
  rationale: Передаёт настоящее время и непосредственное восприятие говорящих.
- source_word: λαλούντων αὐτῶν
  choice: как они говорят
  rationale: Естественно передаёт зависимый причастный оборот после глагола слухового восприятия, не добавляя значения провозглашения, которого само λαλέω не требует.
- source_word: ταῖς ἡμετέραις γλώσσαις
  choice: на наших языках
  rationale: В ближайшем контексте речь идёт о языках, понятных многонациональной толпе; притяжательное «наших» сохраняет подчёркнутое ἡμετέραις.
- source_word: τὰ μεγαλεῖα
  choice: о великих делах
  rationale: Выражение обозначает великие, могущественные деяния. Конструкция с «говорят о» естественна по-русски и не сужает смысл до какого-либо одного вида Божьих действий.
- source_word: τοῦ θεοῦ
  choice: Бога
  rationale: Родительный падеж сохраняет связь великих дел с Богом как их совершителем.
theological_decisions:
- issue: Значение γλώσσαις в повествовании о Пятидесятнице
  choice: понятные человеческие языки
  alternative: экстатические или нечеловеческие «языки»
  rationale: Ближайший контекст подчёркивает, что представители разных народов слышат речь каждый на понятном ему языке. Основной текст передаёт этот контекстуальный смысл, а сноска сохраняет лексическую альтернативу, не перенося в стих более поздние споры о глоссолалии.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Сохранена структура перечисления и выразительное тире перед реакцией собравшихся. Термин «прозелиты» оставлен ради точности; сноска поставлена непосредственно после «языках», к слову, которое она поясняет.
