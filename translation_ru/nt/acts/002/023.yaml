id: ACT.2.23
reference: Acts 2:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τοῦτον τῇ ὡρισμένῃ βουλῇ καὶ προγνώσει τοῦ θεοῦ ⸀ἔκδοτον διὰ ⸀χειρὸς ἀνόμων προσπήξαντες ἀνείλατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/023.yaml
  text: this man[a], delivered up according to the determined plan and foreknowledge of God[b], you killed by nailing him to a cross through the hands of lawless men.
translation:
  language: ru
  text: Этого человека, преданного согласно определённому замыслу и предведению Бога, вы убили[b], пригвоздив ко кресту руками беззаконников[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «рукой беззаконников»; единственное число «рука» употреблено собирательно.
    reason: Передача греческого единственного числа и образа опосредованного действия.
  - marker: b
    text: 'Или: «предали смерти».'
    reason: Допустимый более формальный вариант передачи ἀνείλατε.
lexical_decisions:
- source_word: τοῦτον
  choice: этого человека
  rationale: Указательное местоимение относится к Иисусу и подчёркивает того, о ком Пётр только что говорил. «Этого человека» сохраняет указательную силу и естественно звучит по-русски.
- source_word: τῇ ὡρισμένῃ βουλῇ
  choice: согласно определённому замыслу
  rationale: ὡρισμένῃ обозначает установленное, определённое, а βουλή — замысел, решение или намерение. «Согласно» естественно передаёт основание или соответствие, выраженное дательным падежом, не превращая Божий замысел в непосредственное орудие действия.
- source_word: καὶ προγνώσει
  choice: и предведению
  rationale: πρόγνωσις означает знание заранее. «Предведение» — точный и уместный в библейском контексте русский термин; он сохраняет отличие от «замысла».
- source_word: τοῦ θεοῦ
  choice: Бога
  rationale: Родительный падеж относится и к «замыслу», и к «предведению».
- source_word: ἔκδοτον
  choice: преданного
  rationale: ἔκδοτον означает отданного или преданного в чужие руки. Краткое причастие сохраняет пассивный смысл, не уточняя сверх текста, кто именно предал его.
- source_word: διὰ χειρὸς ἀνόμων
  choice: руками беззаконников
  rationale: 'διά с родительным выражает опосредованное действие: слушатели несут ответственность, хотя казнь совершили другие. «Руками» естественно по-русски; ἀνόμων передано как «беззаконников», без добавленного отождествления с конкретной группой.'
- source_word: προσπήξαντες
  choice: пригвоздив ко кресту
  rationale: Глагол означает прикрепить или пригвоздить; контекст требует явного указания на распятие. Деепричастие сохраняет связь этого действия с главным обвинением.
- source_word: ἀνείλατε
  choice: вы убили
  rationale: ἀναιρέω здесь прямо означает убить, лишить жизни. Формулировка сохраняет силу обращения Петра и ответственность слушателей.
theological_decisions:
- issue: Соотношение Божьего замысла и человеческой ответственности
  choice: 'Сохранены одновременно определённый замысел и предведение Бога, а также прямое обвинение слушателей: «вы убили».'
  alternative: Ослабить либо определённость Божьего замысла, либо ответственность слушателей, приписав действие только беззаконникам.
  rationale: Греческий текст намеренно утверждает обе стороны и не объясняет их систематическое соотношение; перевод не должен устранять это напряжение.
- issue: Кто такие ἄνομοι
  choice: беззаконники
  alternative: язычники или римляне
  rationale: В контексте возможна отсылка к римским исполнителям казни, однако сам стих их прямо не называет. Более широкое слово сохраняет смысл и не устраняет возможную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксис сохраняет длинное обвинительное построение исходного текста, а порядок слов выделяет «этого человека» и прямое «вы убили».
