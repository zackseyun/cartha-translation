base_translation:
  language: en
  yaml_path: translation/nt/acts/002/041.yaml
  text: So those who received his word were baptized[a], and about three thousand souls were added on that day.
translation:
  language: ru
  text: Итак, те, кто принял его слово, крестились, и в тот день прибавилось около трёх тысяч душ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человек» или «людей». Греческое слово «души» здесь является обычным способом обозначения людей при подсчёте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποδεξάμενοι
  choice: принял
  rationale: Глагол обозначает положительное принятие возвещённого слова. «Принял» естественно по-русски и не усиливает значение до более истолковывающего «уверовал».
- source_word: λόγον
  choice: слово
  rationale: В контексте речь идёт о возвещённой Петром вести; «слово» сохраняет лексическую связь с греческим λόγος и остаётся понятным в библейском повествовании.
- source_word: ἐβαπτίσθησαν
  choice: крестились
  rationale: Русская возвратная форма естественно передаёт греческий страдательный аорист, не уточняя способ крещения и не привнося учения о его действии.
- source_word: προσετέθησαν
  choice: прибавилось
  rationale: Передаёт включение в растущее число общины, сохраняя неуказанным объект присоединения, как и в греческом тексте.
- source_word: ψυχαὶ
  choice: душ
  rationale: Формально передаёт ψυχαί и сохраняет библейский способ счёта людей; примечание предупреждает ошибочное прочтение как специального антропологического утверждения.
- source_word: ὡσεὶ τρισχίλιαι
  choice: около трёх тысяч
  rationale: «Около» естественно и точно выражает приблизительность, обозначенную ὡσεί.
- source_word: οἱ μὲν οὖν
  choice: Итак, те, кто
  rationale: Передаёт вывод и переход к следующему событию после речи Петра, оставаясь естественным для современного русского повествования.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: в тот день
  rationale: Обычное и точное русское выражение времени в данном контексте.
theological_decisions:
- issue: Следует ли явно указать, к кому или к чему прибавились крестившиеся
  choice: 'Объект оставлен невыраженным: «прибавилось»'
  alternative: «присоединилось к ним» или «прибавилось к церкви»
  rationale: В самом стихе объект при προσετέθησαν не назван. Контекст указывает на общину верующих, но явное добавление «к ним» или «к церкви» внесло бы в перевод отсутствующую в стихе конкретизацию.
- issue: Антропологический смысл ψυχαί
  choice: В основном тексте — «душ», с пояснением «людей» в сноске
  alternative: «человек» или «людей»
  rationale: Так сохраняется образ греческого текста, но сноска поясняет, что здесь это обычное обозначение людей при подсчёте, а не утверждение только о нематериальной части человека.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским звучанием. Синтаксис упрощён до естественной конструкции «те, кто», при этом сохранены последовательность повествования, приблизительность числа и невыраженный объект глагола «прибавилось».
