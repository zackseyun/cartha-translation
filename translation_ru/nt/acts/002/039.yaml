  text: ὑμῖν γάρ ἐστιν ἡ ἐπαγγελία καὶ τοῖς τέκνοις ὑμῶν καὶ πᾶσι τοῖς εἰς μακρὰν ὅσους ἂν προσκαλέσηται κύριος ὁ θεὸς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/039.yaml
  text: For the promise is for you and for your children and for all who are far off[b][a], as many as the Lord our God calls.
translation:
  language: ru
  text: Ибо это обещание — для вас, для ваших детей и для всех, кто далеко[a], — для всех, кого призовёт Господь, наш Бог[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всем находящимся вдали». Выражение может указывать на географическую удалённость, на удалённость от народа завета или на то и другое одновременно.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «скольких бы ни призвал Господь, наш Бог». Эти слова определяют круг тех, для кого предназначено обещание; грамматически их можно теснее связать с непосредственно предшествующим выражением «всем, кто далеко».'
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: Ведь
  rationale: Передаёт пояснительную связь с призывом Петра в предыдущем стихе и естественно звучит в современном русском языке.
- source_word: ἡ ἐπαγγελία
  choice: обещание
  rationale: Греческое существительное обозначает само обещание; перевод не подменяет его обещанным даром, хотя ближайший контекст говорит о даре Святого Духа.
- source_word: τοῖς τέκνοις ὑμῶν
  choice: вашим детям
  rationale: Сохраняет прямой семейный смысл τέκνα и не ограничивает речь определённым возрастом.
- source_word: πᾶσι τοῖς εἰς μακράν
  choice: всем, кто далеко
  rationale: Естественно передаёт образ удалённости, не решая, имеется ли в виду географическая, заветная или одновременно обе формы отдалённости.
- source_word: ὅσους ἂν προσκαλέσηται
  choice: всем, кого призовёт
  rationale: Передаёт неопределённо-всеохватное значение конструкции ὅσους ἂν с сослагательным наклонением. Возвратное «к Себе» не добавлено, поскольку оно не выражено явно.
- source_word: κύριος ὁ θεὸς ἡμῶν
  choice: Господь, наш Бог
  rationale: Сохраняет божественный титул κύριος и приложение ὁ θεὸς ἡμῶν; запятые делают эту связь ясной по-русски.
theological_decisions:
- issue: Кого обозначают находящиеся далеко
  choice: Оставлено широкое выражение «всем, кто далеко».
  alternative: Иудеи рассеяния; язычники; люди, удалённые географически и/или в отношении завета.
  rationale: Сам стих не сужает значение до одной группы, поэтому перевод сохраняет смысловую открытость выражения.
- issue: Характер Божьего призвания
  choice: «всех, кого призовёт Господь» без догматического уточнения механизма призвания.
  alternative: Неотразимое действенное призвание; общий призыв или приглашение.
  rationale: Греческий текст утверждает зависимость круга получателей от Божьего призвания, но в этом месте не раскрывает, каким образом действует такое призвание.
- issue: Объём уточнения ὅσους ἂν προσκαλέσηται
  choice: Через тире фраза представлена как итоговое уточнение круга названных получателей.
  alternative: Отнести её синтаксически только к словам «всем, кто далеко».
  rationale: Греческая конструкция допускает тесную связь с непосредственно предшествующей группой, но также имеет обобщающую силу. Русская пунктуация сохраняет итоговый характер фразы, не вводя отдельного богословского вывода.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формула «обещание дано» выбрана как естественный русский эквивалент конструкции ἡ ἐπαγγελία ἐστίν + дательный падеж. Порядок перечисления сохранён, а тире помогает читателю воспринять заключительную фразу как пояснение.
