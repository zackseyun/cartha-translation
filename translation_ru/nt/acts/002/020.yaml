  text: ὁ ἥλιος μεταστραφήσεται εἰς σκότος καὶ ἡ σελήνη εἰς αἷμα πρὶν ⸀ἢ ⸀ἐλθεῖν ἡμέραν κυρίου τὴν μεγάλην καὶ ἐπιφανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/020.yaml
  text: The sun will be turned into darkness[a], and the moon into blood, before the great and glorious day of the Lord comes.
translation:
  language: ru
  text: Солнце обратится во тьму, и луна — в кровь, прежде чем наступит великий и славный[a] День Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «явный» или «заметный».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστραφήσεται
  choice: обратится
  rationale: Будущая пассивная форма передаёт переход в иное состояние; русское «обратится во тьму» естественно для возвышенной пророческой речи и не уточняет механизм изменения.
- source_word: εἰς σκότος
  choice: во тьму
  rationale: Предлог εἰς с винительным указывает на итоговое состояние; «во тьму» сохраняет образ перехода.
- source_word: εἰς αἷμα
  choice: в кровь
  rationale: Сохранён резкий буквальный образ греческого текста без истолковывающего смягчения вроде «станет кроваво-красной».
- source_word: πρὶν ἢ ἐλθεῖν
  choice: прежде чем наступит
  rationale: Оборот обозначает событие, предшествующее наступлению другого; применительно ко дню по-русски естественно «наступит».
- source_word: ἡμέραν κυρίου
  choice: День Господа
  rationale: Сохранено устойчивое пророческое выражение о решающем Божьем явлении и действии; оно не смешивается с обозначением воскресного дня.
- source_word: μεγάλην
  choice: великий
  rationale: Прямой и стилистически уместный эквивалент μέγας в пророческом контексте.
- source_word: ἐπιφανῆ
  choice: славный
  rationale: Слово допускает значения «явный, заметный, блистательный». «Славный» естественно передаёт возвышенный оттенок контекста, а смысловая неоднозначность отмечена в сноске.
theological_decisions:
- issue: Передача пророческого выражения ἡμέραν κυρίου в цитате из Иоиля
  choice: День Господа
  alternative: Господень день
  rationale: «День Господа» ясно сохраняет ветхозаветную формулу о Божьем вмешательстве и суде и меньше допускает смешение с позднейшим обозначением воскресенья.
- issue: Передача ἐπιφανῆ в эсхатологическом контексте
  choice: славный
  alternative: явный; достославный; заметный
  rationale: Греческое прилагательное может подчёркивать как явленность и заметность, так и великолепие. Основной текст требует естественного русского эквивалента, но альтернативный смысл нельзя устранять, поэтому он вынесен в сноску.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим звучанием. Эллипсис «луна — в кровь» естественно воспроизводит параллелизм оригинала. Заглавная буква в выражении «День Господа» подчёркивает его характер как устойчивого библейского обозначения, не добавляя отдельного толкования.
