  text: οὐ γὰρ ὡς ὑμεῖς ὑπολαμβάνετε οὗτοι μεθύουσιν, ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/015.yaml
  text: For these are not drunk[a], as you suppose, for it is the third hour of the day.
translation:
  language: ru
  text: 'Эти люди не пьяны, как вы думаете: ведь сейчас третий час дня[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть около девяти часов утра по иудейскому счёту времени.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ γὰρ
  choice: не … ведь
  rationale: Отрицание передано прямо, а пояснительно-аргументирующая функция γάρ выражена русским «ведь» во второй части фразы и общей структурой предложения; повтор «ведь … ведь» был бы тяжеловесен.
- source_word: ὡς ὑμεῖς ὑπολαμβάνετε
  choice: как вы думаете
  rationale: Естественно передаёт значение «полагать, предполагать» и сохраняет прямое обращение к слушателям.
- source_word: οὗτοι
  choice: эти люди
  rationale: Указательное значение сохранено; добавление родового слова «люди» необходимо для естественного современного русского и не уточняет пол или состав группы.
- source_word: μεθύουσιν
  choice: пьяны
  rationale: В контексте настоящее время обозначает приписываемое им состояние опьянения, а не процесс напивания.
- source_word: ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας
  choice: ведь сейчас третий час дня
  rationale: «Ведь» сохраняет пояснительную силу второго γάρ; «сейчас» естественно выражает временную соотнесённость ἔστιν, а традиционная система отсчёта времени оставлена в основном тексте.
- source_word: ὥρα τρίτη
  choice: третий час
  rationale: Сохраняет древний способ обозначения времени; современный приблизительный эквивалент вынесен в сноску.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясной аргументативной связью. Двоеточие естественно оформляет пояснение, вводимое вторым γάρ; формула «третий час дня» сохраняет исторический колорит без ущерба для понимания благодаря сноске.
