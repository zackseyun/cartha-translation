  text: καὶ τὰ κτήματα καὶ τὰς ὑπάρξεις ἐπίπρασκον καὶ διεμέριζον αὐτὰ πᾶσιν καθότι ἄν τις χρείαν εἶχεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/045.yaml
  text: And they were selling their property and possessions and distributing them to all[a], as anyone had need.
translation:
  language: ru
  text: Они продавали свои владения и имущество[a] и распределяли всё между всеми — по мере нужды каждого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «земли и имущество» или «владения и пожитки». Два греческих слова, вероятно, обозначают разные виды собственности: κτήματα часто относится к владениям, в том числе земельным, а ὑπάρξεις — к имуществу вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήματα
  choice: земли
  rationale: Слово часто обозначает владения, особенно земельную собственность; «земли» естественно отличает его от более общего ὑπάρξεις.
- source_word: ὑπάρξεις
  choice: имущество
  rationale: Обозначает то, чем человек владеет, — имущество или пожитки; здесь передано общим словом, дополняющим «земли».
- source_word: ἐπίπρασκον
  choice: продавали
  rationale: Имперфект передаёт продолжавшееся или повторявшееся в прошлом действие, а не одну завершённую продажу.
- source_word: διεμέριζον
  choice: распределяли
  rationale: В данном контексте глагол обозначает разделение и раздачу среди членов общины сообразно их нуждам.
- source_word: αὐτά
  choice: вырученное
  rationale: Формально местоимение означает «это/их» и отсылает к названным владениям; по контексту продажи естественно подразумевается полученное от неё. Конкретизация делает русскую фразу ясной, не уточняя форму вырученного.
- source_word: πᾶσιν
  choice: между всеми
  rationale: Дательный множественного числа обозначает получателей в рамках описываемой общины; сочетание естественно при глаголе «распределяли».
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: смотря по тому, кто в чём нуждался
  rationale: Передаёт соразмерность распределения индивидуальной нужде и неопределённо-условный оттенок ἄν τις.
theological_decisions:
- issue: Характер совместного пользования благами у верующих
  choice: Стих описывает продолжавшуюся или повторявшуюся продажу владений и распределение сообразно нуждам.
  alternative: Понимать стих как утверждение полной отмены частной собственности или как универсальное предписание всем христианам.
  rationale: Имперфекты описывают практику, но сам текст не утверждает ни полного исчезновения частного владения, ни всеобщей нормативности такого устройства. Перевод сохраняет описательный характер высказывания.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное. Имперфективные формы «продавали» и «распределяли» сохраняют повторяющийся или продолжавшийся характер действий. Формулировка не превращает описание практики общины в экономическую доктрину.
