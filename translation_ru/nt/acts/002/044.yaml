base_translation:
  language: en
  yaml_path: translation/nt/acts/002/044.yaml
  text: And all the believers were together and had all things in common,[a]
translation:
  language: ru
  text: А все верующие были вместе и всё у них было общее.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «находились в одном месте». Греческое выражение может означать совместное пребывание или собрание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: все
  rationale: Сохраняет охват всей группы и естественно определяет субстантивированное причастие «верующие».
- source_word: δὲ
  choice: А
  rationale: Передаёт мягкое продолжение повествования без выраженного противопоставления; в русском рассказе «а» естественно связывает этот стих с предыдущим.
- source_word: οἱ πιστεύοντες
  choice: верующие
  rationale: Настоящее причастие с артиклем обозначает сообщество тех, кто верит; существительное «верующие» звучит естественно и сохраняет групповую идентичность.
- source_word: ἦσαν ἐπὶ τὸ αὐτό
  choice: были вместе
  rationale: Передаёт идиоматическое значение совместного пребывания или собрания, не сводя выражение исключительно к физическому местонахождению.
- source_word: εἶχον
  choice: у них было
  rationale: Естественная русская конструкция обладания; несовершенный вид «было» соответствует продолжительному или обычному состоянию в повествовании.
- source_word: ἅπαντα κοινά
  choice: всё у них было общее
  rationale: Ясно и по-русски естественно передаёт общность имущества или владения, не добавляя идеи обязательного экономического порядка.
theological_decisions:
- issue: Характер общей жизни верующих
  choice: Стих описывает, что у верующих всё было общим.
  alternative: Понимать стих как предписание обязательной экономической системы для всех христианских общин.
  rationale: Греческий текст сообщает о существовавшем положении дел, но не формулирует повеления или универсальной нормы; перевод сохраняет описательный характер высказывания.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная. Сохранена возможная пространственная и общинная многозначность выражения ἐπὶ τὸ αὐτό посредством сноски.
