  text: προφήτης οὖν ὑπάρχων, καὶ εἰδὼς ὅτι ὅρκῳ ὤμοσεν αὐτῷ ὁ θεὸς ἐκ καρποῦ τῆς ὀσφύος ⸀αὐτοῦ καθίσαι ἐπὶ ⸂τὸν θρόνον⸃ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/030.yaml
  text: Therefore[a], being a prophet and knowing that God had sworn to him with an oath to seat one from the fruit of his loins on his throne,
translation:
  language: ru
  text: Итак, будучи пророком и зная, что Бог торжественно поклялся ему посадить на его престол одного из его потомков[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из плода его чресл».'
    reason: Сохраняет конкретный генеалогический образ оригинала, который в основном тексте естественно передан словом «потомков».
lexical_decisions:
- source_word: προφήτης
  choice: пророком
  rationale: Стандартное и точное обозначение человека, говорящего по Божьему откровению.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предшествующего рассуждения о Давиде и естественно связывает этот стих с контекстом.
- source_word: ὑπάρχων
  choice: будучи
  rationale: Сохраняет обстоятельную причастную конструкцию и не делает её причинное значение более определённым, чем в греческом.
- source_word: εἰδὼς
  choice: зная
  rationale: Сохраняет параллельную причастную структуру греческого предложения и звучит естественно по-русски.
- source_word: ὅρκῳ ὤμοσεν
  choice: поклялся ему клятвой
  rationale: Передаёт и существительное, и глагол оригинала, сохраняя торжественную усиленность формулы, хотя в русском она намеренно звучит библейски.
- source_word: ἐκ καρποῦ τῆς ὀσφύος αὐτοῦ
  choice: одного из его потомков
  rationale: Естественно передаёт идиому о физическом происхождении; буквальный телесный образ сохранён в примечании.
- source_word: καθίσαι
  choice: посадить
  rationale: 'Передаёт каузативный смысл: Бог возведёт потомка на престол, а не просто позволит ему сидеть.'
- source_word: ἐπὶ τὸν θρόνον αὐτοῦ
  choice: на его престол
  rationale: Естественная русская формула возведения на царство; местоимение сохранено, не устраняя формально возможную неоднозначность, хотя контекст указывает на престол Давида.
theological_decisions:
- issue: Мессианское царское обещание Давиду
  choice: Сохранено династическое обещание о потомке и престоле без вставки слова «Мессия».
  alternative: «Посадить Мессию на его престол»
  rationale: В контексте Пётр относит обещание к Иисусу, однако сам стих формулирует его как клятву о потомке Давида. Перевод позволяет ближайшему контексту раскрыть христологическое применение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Причастная структура сохранена. Оборот «поклялся клятвой» намеренно воспроизводит усиление оригинала; лексически архаичный образ «плод чресл» вынесен в примечание.
