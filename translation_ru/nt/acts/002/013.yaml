lexical_decisions:
- source_word: ἕτεροι
  choice: другие
  rationale: Прилагательное употреблено самостоятельно и обозначает другую группу среди присутствующих; «другие» естественно передаёт этот смысл.
- source_word: δὲ
  choice: же
  rationale: Частица отмечает противопоставление предшествующей реакции; русское «же» передаёт контраст без излишнего усиления.
- source_word: διαχλευάζοντες
  choice: насмехались
  rationale: Причастие выражает презрительную насмешку; личная глагольная форма звучит по-русски естественно и ясно.
- source_word: ἔλεγον
  choice: говорили
  rationale: Имперфект указывает на продолжавшуюся или повторявшуюся речь; несовершенный вид «говорили» сохраняет этот аспект.
- source_word: ὅτι
  choice: прямая речь
  rationale: Союз вводит содержание высказывания; в современном русском прямая речь здесь естественна.
- source_word: Γλεύκους
  choice: сладкого вина
  rationale: γλεῦκος обозначает сладкое свежее вино или виноградный напиток; «сладкое вино» точно передаёт основной лексический признак и понятно современному читателю.
- source_word: μεμεστωμένοι εἰσίν
  choice: напились
  rationale: Перифрастическая конструкция описывает состояние людей, переполненных вином; «напились» естественно выражает подразумеваемое обвинение в опьянении, хотя буквально сказано «наполнены».
