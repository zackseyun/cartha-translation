  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на своём наречии, в котором мы родились».'
    reason: Сохраняется возможность передать διάλεκτος как «наречие», а ἐν ᾗ ἐγεννήθημεν — буквальным придаточным предложением; форма «мы родились» воспроизводит множественное число греческого текста.
lexical_decisions:
- source_word: πῶς
  choice: как же
  rationale: Передаёт вопросительное удивление, выраженное контекстом и греческим πῶς, естественно для современного русского языка.
- source_word: ἡμεῖς … ἕκαστος
  choice: каждый из нас
  rationale: Сохраняет выразительное местоимение ἡμεῖς и распределительное значение ἕκαστος.
- source_word: ἀκούομεν
  choice: слышит
  rationale: В русском сказуемое естественно согласуется с распределительным подлежащим «каждый» в единственном числе.
- source_word: τῇ ἰδίᾳ διαλέκτῳ ἡμῶν
  choice: свой родной язык
  rationale: διάλεκτος допускает значения «язык» и «наречие»; определение «родной» кратко передаёт уточнение ἐν ᾗ ἐγεννήθημεν, а «свой» отражает ἰδίᾳ.
- source_word: ἐν ᾗ ἐγεννήθημεν
  choice: родной
  rationale: В контексте речь идёт о языке места рождения и происхождения; сжатая передача звучит естественно, а буквальная форма сохранена в примечании.
