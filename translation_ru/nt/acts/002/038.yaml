source:
  edition: SBLGNT
  text: Πέτρος δὲ ⸂πρὸς αὐτούς· Μετανοήσατε⸃, καὶ βαπτισθήτω ἕκαστος ὑμῶν ⸀ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν ⸀τῶν ἁμαρτιῶν ⸀ὑμῶν, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/038.yaml
  text: And Peter said to them[a], “Repent, and let each of you be baptized in the name of Jesus the Messiah for the forgiveness of your sins[b], and you will receive the gift of the Holy Spirit.”
translation:
  language: ru
  text: 'Пётр же сказал им: «Покайтесь, и пусть каждый из вас крестится во имя Иисуса Мессии для прощения ваших грехов[a], и вы получите дар Святого Духа».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «для прощения ваших грехов» непосредственно передаёт греческий текст. Толкователи по-разному понимают, как именно крещение связано здесь с прощением; перевод не разрешает этот спор сверх сказанного в тексте.
    reason: theological_ambiguity
lexical_decisions:
- source_word: Μετανοήσατε
  choice: Покайтесь
  rationale: Кратко и естественно передаёт аористный повелительный призыв к решительному покаянию, включая перемену мысли и нравственный поворот.
- source_word: βαπτισθήτω ἕκαστος ὑμῶν
  choice: пусть каждый из вас крестится
  rationale: Сохраняет повелительную силу формы третьего лица, пассивно-возвратный смысл и распределительное ударение выражения «каждый из вас».
- source_word: ἐπὶ τῷ ὀνόματι
  choice: во имя
  rationale: Устоявшийся и естественный русский эквивалент, не сужающий возможные оттенки основания, власти или исповедания.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: В контексте речи Петра Χριστός сохраняет значение титула; «Мессия» ясно передаёт его смысл и естественно оформляется по-русски без артикля.
- source_word: εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: для прощения ваших грехов
  rationale: Прямо и идиоматично передаёт целевую или результирующую направленность εἰς, не разрешая богословский спор о точном отношении крещения к прощению.
- source_word: λήμψεσθε τὴν δωρεὰν
  choice: вы получите дар
  rationale: Естественно передаёт будущее обещание и значение δωρεά без избыточного уточнения «безвозмездный».
- source_word: τοῦ ἁγίου πνεύματος
  choice: Святого Духа
  rationale: Нормативное современное русское наименование, сохраняющее личностный и богословский смысл.
theological_decisions:
- issue: Отношение крещения к прощению в εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: Передать как «для прощения ваших грехов» без добавочного толкования.
  alternative: «чтобы ваши грехи были прощены» или «вследствие прощения ваших грехов»
  rationale: Греческая формулировка связывает крещение с прощением, но сама по себе не излагает подробно характер этой связи; перевод сохраняет эту богословскую напряжённость.
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: В непосредственном контексте Деян 2 титульный, мессианский смысл остаётся выраженным; «Мессия» делает его прозрачным, не привнося отдельного вероучительного вывода.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Частица «же» сохраняет связность повествования; синтаксис сделан понятным для обычного читателя без устранения смысловой неоднозначности.
