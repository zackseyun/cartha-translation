  text: καὶ ἔσται πᾶς ὃς ⸀ἐὰν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/021.yaml
  text: And it shall be that everyone who calls on the name of the Lord will be saved[a].
translation:
  language: ru
  text: 'И будет: каждый, кто призовёт имя Господа, будет спасён[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякий, кто призовёт имя Господа». Эти слова перекликаются с Иоил. 2:32, где «Господь» — Яхве; в Деяниях Пётр приводит эту цитату в своём возвещении об Иисусе.'
    reason: Альтернативная передача универсальной конструкции и пояснение ветхозаветного источника без устранения возможной богословской многозначности.
lexical_decisions:
- source_word: ἔσται
  choice: будет
  rationale: Будущее время εἰμί передано краткой формулой «и будет», сохраняющей торжественное звучание пророческой цитаты и остающейся естественной в современном русском языке.
- source_word: πᾶς ὃς ἐὰν
  choice: каждый, кто
  rationale: Конструкция выражает всеобщее неопределённое условие. «Каждый, кто» естественно передаёт универсальный охват; возможный вариант «всякий, кто» звучит несколько более традиционно.
- source_word: ἐπικαλέσηται
  choice: призовёт
  rationale: В сочетании с «именем» глагол означает обращение к Господу с упованием, в том числе в молитве и поклонении. «Призовёт» сохраняет библейскую идиому без разъясняющей парафразы.
- source_word: τὸ ὄνομα
  choice: имя
  rationale: Существительное сохранено буквально как часть устойчивого библейского выражения «призвать имя», несущего богословские и богослужебные оттенки.
- source_word: κυρίου
  choice: Господа
  rationale: κύριος передано традиционным и точным соответствием «Господь». Родительный падеж обусловлен выражением «имя Господа»; перевод не уточняет референта сверх греческого текста.
- source_word: σωθήσεται
  choice: будет спасён
  rationale: Будущее страдательное σῴζω передано стандартным русским выражением, сохраняющим как смысл избавления, так и более широкий смысл спасения.
theological_decisions:
- issue: К кому относится «Господь» в цитате из Иоиля, употреблённой в Деяниях
  choice: Сохранить в основном тексте «Господа», не уточняя референта.
  alternative: В исходном контексте Иоиля — Яхве; в христологическом контексте речи Петра возможна отнесённость цитаты к Иисусу.
  rationale: Греческий текст говорит «Господа» и не требует от перевода однозначно разрешать референцию. Цитата восходит к Иоилю 2:32, где имеется в виду Яхве, однако Пётр приводит её в возвещении об Иисусе. Формулировка сохраняет эту намеренную богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным регистром пророческой цитаты. Синтаксис краток и понятен; традиционная формула «призвать имя Господа» сохранена ради точности и межтекстовой связи.
