lexical_decisions:
- source_word: Φρυγίαν τε καὶ Παμφυλίαν
  choice: Фригию и Памфилию
  rationale: Стандартные русские формы географических названий; τε καὶ естественно передано союзом «и» в перечне.
- source_word: Αἴγυπτον
  choice: Египет
  rationale: Общепринятое русское название страны.
- source_word: τὰ μέρη τῆς Λιβύης τῆς κατὰ Κυρήνην
  choice: области Ливии близ Кирены
  rationale: μέρη обозначает части или области, а оборот κατά с названием места соотносит их с Киреной. «Близ Кирены» естественно передаёт региональную близость, не вводя точных политических границ.
- source_word: οἱ ἐπιδημοῦντες Ῥωμαῖοι
  choice: римлян, временно живущих здесь
  rationale: ἐπιδημοῦντες указывает на людей, временно находящихся в данном месте. Такая передача сохраняет этот смысл и не делает их постоянными жителями Иерусалима.
