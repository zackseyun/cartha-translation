  text: τοῦτον τὸν Ἰησοῦν ἀνέστησεν ὁ θεός, οὗ πάντες ἡμεῖς ἐσμεν μάρτυρες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/032.yaml
  text: God raised up this Jesus[a], of whom we all are witnesses.
translation:
  language: ru
  text: Этого Иисуса Бог воскресил, и все мы — Его свидетели.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: Этого Иисуса
  rationale: Указательное местоимение τοῦτον имеет выделительную и отсылочную силу, указывая именно на только что названного Иисуса; русский порядок слов сохраняет это ударение естественно.
- source_word: ἀνέστησεν
  choice: воскресил
  rationale: В данном контексте переходный аорист ἀνίστημι означает, что Бог возвратил Иисуса к жизни. «Воскресил» прямо и естественно передаёт смысл воскресения и сохраняет Бога как действующее лицо.
- source_word: ὁ θεός
  choice: Бог
  rationale: Явно выраженное подлежащее передано без добавлений.
- source_word: οὗ
  choice: этого
  rationale: Родительное относительное местоимение связано со словом μάρτυρες. По-русски буквальное «свидетели которого» могло бы быть понято как свидетельство об Иисусе вообще; «свидетели этого» естественно указывает на только что названное событие воскресения, не добавляя его повторно.
- source_word: πάντες ἡμεῖς
  choice: все мы
  rationale: Так сохраняются выраженность местоимения и эмфатический охват всей названной группы.
- source_word: ἐσμεν μάρτυρες
  choice: мы — свидетели
  rationale: Именная конструкция сохраняет существительное μάρτυρες и в современном русском звучит ясно и достойно.
theological_decisions:
- issue: Формулировка воскресения
  choice: Бог воскресил
  alternative: Бог поднял / Бог воздвиг
  rationale: Контекст однозначно относится к воскресению из мёртвых. «Воскресил» передаёт это прямо, сохраняя утверждение текста о Боге как действующем лице и не привнося дополнительного догматического объяснения.
- issue: Предмет свидетельства апостолов
  choice: свидетели этого
  alternative: свидетели Его / свидетели которого
  rationale: Греческое οὗ грамматически допускает отнесение к Иисусу, тогда как смысл в контексте сосредоточен на Его воскресении. Русское «этого» сохраняет связь с предшествующим утверждением и не сужает свидетельство до искусственно уточнённой формулы.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и легко воспринимаемая формулировка. Инверсия «Этого Иисуса Бог воскресил» сохраняет эмфатическое указание греческого текста. Тире в именной части подчёркивает свидетельское утверждение без архаизации.
