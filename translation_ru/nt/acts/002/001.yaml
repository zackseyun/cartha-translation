  text: Καὶ ἐν τῷ συμπληροῦσθαι τὴν ἡμέραν τῆς πεντηκοστῆς ἦσαν ⸂πάντες ὁμοῦ⸃ ἐπὶ τὸ αὐτό,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/001.yaml
  text: And when the day of Pentecost had fully come[a], they were all together in one place.
translation:
  language: ru
  text: Когда день Пятидесятницы уже наступил[a], все они были вместе в одном месте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда день Пятидесятницы исполнялся»; букв. «когда день Пятидесятницы достигал полноты».'
    reason: Греческий оборот ἐν τῷ συμπληροῦσθαι допускает процессуальный оттенок «исполняться, достигать полноты», тогда как основной текст передаёт естественное по-русски результативное понимание.
lexical_decisions:
- source_word: συμπληροῦσθαι
  choice: наступал
  rationale: В конструкции ἐν τῷ с инфинитивом выражено время происходящего действия. «Когда наступал день» естественно по-русски передаёт приближение дня к полноте или завершению, не превращая оборот исключительно в указание на уже достигнутый результат.
- source_word: πεντηκοστῆς
  choice: Пятидесятницы
  rationale: «Пятидесятница» — закрепившееся русское название иудейского праздника, обозначенного греческим Πεντηκοστή.
- source_word: πάντες
  choice: все они
  rationale: Передаёт полноту ранее названной группы и естественно восстанавливает подразумеваемый в греческом субъект.
- source_word: ὁμοῦ
  choice: вместе
  rationale: Сохраняет основное значение совместного пребывания.
- source_word: ἐπὶ τὸ αὐτό
  choice: в одном месте
  rationale: Передаёт пространственный оттенок идиомы и не дублирует значение ὁμοῦ.
theological_decisions:
- issue: К кому относится подразумеваемое подлежащее при ἦσαν
  choice: все они были
  alternative: все были
  rationale: Местоимение «они» естественно связывает стих с ранее упомянутой группой, не уточняя её состав сверх того, что допускает контекст.
- issue: Временной оттенок συμπληροῦσθαι
  choice: когда наступал день
  alternative: когда день полностью наступил
  rationale: Сохранён процессуальный оттенок настоящего инфинитива и не навязано исключительно результативное понимание оборота.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное. Сочетание «все они были вместе в одном месте» сохраняет различие между ὁμοῦ и ἐπὶ τὸ αὐτό, хотя в русском оно слегка избыточно.
