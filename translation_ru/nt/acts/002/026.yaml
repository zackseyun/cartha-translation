id: ACT.2.26
reference: Acts 2:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διὰ τοῦτο ηὐφράνθη ⸂ἡ καρδία μου⸃ καὶ ἠγαλλιάσατο ἡ γλῶσσά μου, ἔτι δὲ καὶ ἡ σάρξ μου κατασκηνώσει ἐπ’ ἐλπίδι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/026.yaml
  text: Because of this my heart was glad[a], and my tongue rejoiced; moreover, even my flesh will dwell in hope.
translation:
  language: ru
  text: Поэтому возрадовалось моё сердце и возликовал мой язык; и даже плоть моя будет обитать в надежде[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тело моё будет покоиться в надежде».'
    reason: 'Лексическая альтернатива: «тело» яснее передаёт телесный смысл σάρξ, а «будет покоиться» отражает распространённое контекстуальное понимание κατασκηνώσει.'
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: поэтому
  rationale: Кратко и естественно передаёт причинно-следственную связь; в русском поэтическом контексте звучит яснее, чем более тяжеловесное «по этой причине».
- source_word: ηὐφράνθη ἡ καρδία μου
  choice: возрадовалось моё сердце
  rationale: Сохраняет библейский образ сердца как внутреннего человека и возвышенный оттенок радости, не превращая пассивную форму в неестественную русскую конструкцию.
- source_word: ἠγαλλιάσατο ἡ γλῶσσά μου
  choice: возликовал мой язык
  rationale: Передаёт усиленную, восторженную радость и сохраняет буквальный поэтический образ языка как выражающего хвалу.
- source_word: ἔτι δὲ καὶ
  choice: и даже
  rationale: Естественно передаёт продолжение мысли и усилительное выделение следующего утверждения.
- source_word: ἡ σάρξ μου
  choice: плоть моя
  rationale: Сохраняет буквальное антропологическое значение σάρξ и не вносит этического смысла «греховной природы»; порядок слов поддерживает поэтический регистр.
- source_word: κατασκηνώσει
  choice: будет обитать
  rationale: Сохраняет образ пребывания или поселения, не сужая его до интерпретирующего «будет покоиться».
- source_word: ἐπ’ ἐλπίδι
  choice: в надежде
  rationale: Естественная русская передача сферы или основания безопасного пребывания, без добавления отсутствующих в тексте пояснений.
theological_decisions:
- issue: Передача σάρξ в контексте цитаты, связанной с воскресением
  choice: плоть моя
  alternative: тело моё
  rationale: Здесь σάρξ обозначает телесное существование, а не «греховную природу». «Плоть» точнее сохраняет лексику источника, тогда как «тело» допустимо как разъясняющая альтернатива.
- issue: Смысл κατασκηνώσει ἐπ’ ἐλπίδι
  choice: будет обитать в надежде
  alternative: будет покоиться в надежде
  rationale: Основной текст сохраняет образ надёжного пребывания и не сводит его заранее к покою в смерти; связь с воскресением раскрывается последующим контекстом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, поэтическим звучанием, соответствующим цитате из Псалтири. Параллелизм «сердце — язык — плоть» сохранён.
