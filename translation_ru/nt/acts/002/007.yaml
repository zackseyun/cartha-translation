base_translation:
  language: en
  yaml_path: translation/nt/acts/002/007.yaml
  text: And they were astonished and amazed[a], saying, “Look, are not all these who are speaking Galileans?”
translation:
  language: ru
  text: 'Они изумлялись и поражались, говоря: «Вот[a], разве не все эти говорящие — галилеяне?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Посмотрите».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: были поражены
  rationale: Имперфект передаёт продолжавшееся состояние сильного изумления. «Были поражены» естественно звучит по-русски и сохраняет интенсивность глагола, не прибегая к более идиоматическому «были вне себя».
- source_word: δὲ
  choice: (не выражено отдельно)
  rationale: Здесь δέ — слабая повествовательная связка. В современном русском продолжение повествования естественно передаётся без отдельного союза.
- source_word: καὶ
  choice: и
  rationale: Союз соединяет две одновременные реакции и сохраняет их накопительный характер.
- source_word: ἐθαύμαζον
  choice: удивлялись
  rationale: Глагол обозначает удивление, восхищённое недоумение; нейтральное современное «удивлялись» ясно передаёт основной смысл и не дублирует буквально предшествующий глагол.
- source_word: λέγοντες
  choice: говоря
  rationale: Причастие вводит прямую речь и в данном контексте естественно передаётся русским деепричастием.
- source_word: Οὐχ
  choice: разве ... не
  rationale: Отрицательная вопросительная форма предполагает утвердительный ответ; конструкция «разве ... не» естественно сохраняет это ожидание по-русски.
- source_word: ἰδοὺ
  choice: Посмотрите
  rationale: Частица привлекает внимание собеседников. «Посмотрите» — современный и ясный эквивалент; более краткое «вот» отмечено в сноске.
- source_word: πάντες οὗτοί
  choice: все эти
  rationale: Передаёт всю названную группу без добавления отсутствующего в греческом слова «мужчины» или «люди».
- source_word: οἱ λαλοῦντες
  choice: говорящие
  rationale: Субстантивированное причастие настоящего времени обозначает тех, кто говорит в данный момент; русское причастие сохраняет эту форму и аспект.
- source_word: Γαλιλαῖοι
  choice: галилеяне
  rationale: Обычное русское обозначение жителей или уроженцев Галилеи, без внесения подразумеваемых оценок их образования, речи или положения.
theological_decisions:
- issue: Подразумеваемая социальная или региональная окраска слова Γαλιλαῖοι
  choice: Сохранено простое региональное обозначение «галилеяне».
  alternative: «необразованные галилеяне» или пояснение об их говоре и происхождении
  rationale: Сам стих сообщает лишь об удивлении галилейскому происхождению говорящих, но не объясняет его причины. Уточнение социального статуса, образования или акцента внесло бы в перевод контекстуальный вывод, которого нет в тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Два глагола реакции сохранены, но разведены лексически как «были поражены и удивлялись», чтобы передать накопительность греческого выражения без неестественного русского повтора.
