  text: ἑτέροις τε λόγοις πλείοσιν διεμαρτύρατο, καὶ παρεκάλει ⸀αὐτοὺς λέγων· Σώθητε ἀπὸ τῆς γενεᾶς τῆς σκολιᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/040.yaml
  text: And with many other words he solemnly testified and kept urging them[a], saying, “Be saved from this crooked generation.”
translation:
  language: ru
  text: 'И многими другими словами он настойчиво свидетельствовал и убеждал их, говоря: «Будьте спасены от этого развращённого поколения».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Спаситесь от этого развращённого поколения». Греческий глагол стоит в страдательном залоге («будьте спасены»), хотя призыв, обращённый к слушателям, предполагает их отклик.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἑτέροις τε λόγοις πλείοσιν
  choice: многими другими словами
  rationale: Естественно передаёт и ἑτέροις («другими»), и πλείοσιν («многими»), обозначая продолжение пространной речи Петра.
- source_word: διεμαρτύρατο
  choice: настойчиво свидетельствовал
  rationale: Передаёт усиленный, серьёзный характер свидетельства; «торжественно» здесь могло бы создать неуместный оттенок церемониальности.
- source_word: παρεκάλει
  choice: убеждал
  rationale: В данном призывном контексте передаёт побуждающую силу παρακαλέω; несовершенный вид русского глагола вместе с контекстом отражает продолжительность действия.
- source_word: Σώθητε
  choice: Спаситесь
  rationale: Русская возвратная форма является естественным соответствием пассивно-побудительной греческой формы и может обозначать принятие спасения, не обязательно самостоятельное самоспасение. Богословское напряжение поясняется в сноске.
- source_word: ἀπὸ τῆς γενεᾶς
  choice: от ... поколения
  rationale: Сохраняет разделительное значение ἀπό и обычное значение γενεά как современного Петру поколения людей.
- source_word: σκολιᾶς
  choice: развращённого
  rationale: В нравственном контексте ясно передаёт переносное значение «искривлённого, извращённого»; буквальное «кривого» применительно к поколению в современном русском звучит менее естественно.
theological_decisions:
- issue: Залог и человеческая роль в Σώθητε
  choice: Спаситесь
  alternative: Будьте спасены
  rationale: Греческая форма — аорист повелительного наклонения страдательного залога. Буквальное «будьте спасены» точнее формально, но в русском звучит тяжеловесно и неестественно. «Спаситесь» сохраняет реальный призыв к отклику, однако может быть понято активнее греческого; поэтому сноска прямо указывает на страдательный залог и сохраняет напряжение между призывом и получением спасения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет последовательность двух речевых действий Петра и вводную формулу «говоря». Термин «поколение» оставлен ради лексической точности и библейского образа.
