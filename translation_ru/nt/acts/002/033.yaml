source:
  edition: SBLGNT
  text: τῇ δεξιᾷ οὖν τοῦ θεοῦ ὑψωθεὶς τήν τε ἐπαγγελίαν τοῦ ⸂πνεύματος τοῦ ἁγίου⸃ λαβὼν παρὰ τοῦ πατρὸς ἐξέχεεν τοῦτο ⸀ὃ ⸀ὑμεῖς βλέπετε καὶ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/033.yaml
  text: Therefore[a], having been exalted to the right hand of God, and having received from the Father the promise of the Holy Spirit[b], he has poured out this that you yourselves are seeing and hearing.
translation:
  language: ru
  text: Итак, вознесённый к месту по правую руку Бога[a] и получивший от Отца обетование Святого Духа[b], Он излил то, что вы сами видите и слышите.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возвышенный правой рукой Бога». Греческий дательный падеж может указывать либо на положение — «по правую руку Бога», либо на средство действия — «правой рукой Бога».'
    reason: alternative_reading
  - marker: b
    text: 'Возможны также переводы: «обещанный Святой Дух» или «обетование о Святом Духе». Греческое выражение может указывать как на самого Духа, обещанного в качестве дара, так и на обещание, относящееся к Святому Духу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δεξιᾷ τοῦ θεοῦ
  choice: к правой руке Бога
  rationale: Дательный падеж при ὑψωθείς естественно передаёт направление и положение у Божьей правой руки, согласуясь с темой воцарения и последующей цитатой из Пс 109:1; инструментальное понимание сохранено в сноске.
- source_word: οὖν
  choice: Итак
  rationale: Передаёт логический вывод из предшествующего рассуждения Петра, оставаясь естественным для современной русской речи.
- source_word: ὑψωθεὶς
  choice: вознесённый
  rationale: Передаёт аористное пассивное причастие и контекст возвышения Иисуса Богом; в русском библейском контексте «вознесённый» естественно соединяет пространственный и прославляющий смысл.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου
  choice: обещанного Святого Духа
  rationale: Идиоматически выражает понимание Духа как обещанного дара, который Сын получает от Отца и изливает; формально возможное понимание «обетование о Святом Духе» сохранено в сноске.
- source_word: λαβὼν παρὰ τοῦ πατρὸς
  choice: получивший от Отца
  rationale: Сохраняет предшествование действия главному глаголу и значение источника у παρά с родительным падежом.
- source_word: ἐξέχεεν
  choice: излил
  rationale: Совершенный вид естественно передаёт завершённое действие аориста, результат которого присутствующие непосредственно наблюдают.
- source_word: τοῦτο ὃ ὑμεῖς βλέπετε καὶ ἀκούετε
  choice: то, что вы сами видите и слышите
  rationale: Сохраняет неопределённость указательного местоимения τοῦτο, не добавляя слов «дар» или «Дух», а «сами» передаёт эмфазу явно выраженного ὑμεῖς.
theological_decisions:
- issue: 'Значение τῇ δεξιᾷ τοῦ θεοῦ: место возвышения или средство возвышения'
  choice: к правой руке Бога
  alternative: правой рукой Бога
  rationale: Контекст речи и следующая далее цитата Пс 109:1 поддерживают образ вознесения и воцарения у Божьей правой руки. Однако греческий дательный допускает инструментальное понимание, поэтому оно отмечено в сноске.
- issue: Значение τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου
  choice: обещанного Святого Духа
  alternative: обетование о Святом Духе
  rationale: Последующее «излил то» лучше согласуется с пониманием Святого Духа как обещанного дара. При этом родительный оборот допускает и значение обещания, относящегося к Духу, что сохранено в сноске без устранения синтаксической неоднозначности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Причастная конструкция сохраняет связь зависимых действий с главным глаголом, но остаётся понятной обычному читателю. Местоимение «Он» написано с прописной буквы согласно распространённой русской библейской издательской практике.
