  source_fidelity: 'В основном перевод точно передаёт цитату: εἰς αὐτόν — «о Нём», ἐνώπιόν μου — «перед собой», διὰ παντός — «всегда», а образ правой стороны сохранён. Однако ἵνα μὴ σαλευθῶ содержит целевую конструкцию с аористным сослагательным страдательным залогом; «и потому я не поколеблюсь» превращает её в будущее утверждение и несколько меняет синтаксическое отношение. «Чтобы мне не поколебаться» передаёт его точнее и естественно по-русски.'
