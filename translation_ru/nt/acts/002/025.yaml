base_translation:
  language: en
  yaml_path: translation/nt/acts/002/025.yaml
  text: For David says concerning him, ‘I kept seeing the Lord before me continually, because he is at my right hand, so that I may not be shaken.’
translation:
  language: ru
  text: 'Ведь Давид говорит о Нём: «Я всегда видел[a] перед собой Господа[b], потому что Он по правую руку от меня, чтобы мне не поколебаться».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я всегда предвидел Господа». Греческий глагол в некоторых контекстах может означать «предвидеть», однако здесь окружающие слова скорее указывают на то, что говорящий постоянно видел Господа перед собой.'
    reason: lexical_alternative
  - marker: b
    text: Пётр цитирует Псалом 15:8 (16:8 в иной нумерации). В еврейском тексте псалма здесь стоит Божье имя, традиционно передаваемое как «ГОСПОДЬ».
    reason: cross_reference
lexical_decisions:
- source_word: λέγει εἰς αὐτόν
  choice: говорит о Нём
  rationale: В формуле введения цитаты εἰς αὐτόν означает речь о ком-либо, а не прямое обращение к нему.
- source_word: Προορώμην
  choice: я всегда видел перед собой
  rationale: Имперфект передаёт продолжающееся или привычное действие; вместе с διὰ παντός фраза естественно означает, что говорящий постоянно держал Господа перед своим взором. Значение «предвидел» сохранено в примечании как возможная лексическая альтернатива.
- source_word: κύριον
  choice: Господа
  rationale: Передаёт греческое κύριον без внесения в основной текст более конкретного толкования референта.
- source_word: ἐνώπιόν μου
  choice: перед собой
  rationale: Естественное русское выражение, сохраняющее пространственно-образный смысл оригинала.
- source_word: διὰ παντός
  choice: всегда
  rationale: Кратко и естественно передаёт значение постоянства и непрерывности.
- source_word: ἐκ δεξιῶν μού
  choice: по правую руку от меня
  rationale: Устойчивое русское соответствие образу пребывания с правой стороны, подразумевающему близость и поддержку.
- source_word: ἵνα μὴ σαλευθῶ
  choice: и потому я не поколеблюсь
  rationale: Естественно передаёт целевое или результативное отношение и сохраняет метафору утраты устойчивости, не уточняя её богословски.
theological_decisions:
- issue: Кого обозначает «Господь» в цитате из псалма в употреблении Петра
  choice: Сохранить «Господь» без уточняющей идентификации
  alternative: «ГОСПОДЬ» как передача еврейского божественного имени либо явное отождествление с Мессией
  rationale: Пётр применяет псалом христологически, однако греческий текст самой цитаты содержит κύριον. Перевод сохраняет эту формулировку и не снимает богословское напряжение толковательным уточнением.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. Синтаксис сделан естественным для широкого читателя; местоимения, относящиеся к Господу, написаны с прописной буквы согласно распространённой русской библейской традиции.
