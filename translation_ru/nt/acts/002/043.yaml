- from: И всякую душу охватил страх[a], и через апостолов совершалось много чудес и знамений.
  to: И каждого охватывал страх[a], и через апостолов происходило много чудес и знамений.
  rationale: Исправлен вид первого глагола для передачи греческого имперфекта; избрана более естественная русская конструкция для «каждой души». Второй глагол заменён на «происходило», что точнее соответствует γίνομαι в данном контексте. Сноска упрощена, чтобы сохранить лексическую альтернативу без неточного буквального пояснения.
