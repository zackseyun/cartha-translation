  text: ⸀Ἐγίνετο δὲ πάσῃ ψυχῇ φόβος, πολλά ⸀τε τέρατα καὶ σημεῖα διὰ τῶν ἀποστόλων ἐγίνετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/043.yaml
  text: And fear came upon every soul[a], and many wonders and signs were being done through the apostles.
translation:
  language: ru
  text: И каждого охватывал страх[a], и через апостолов происходило много чудес и знамений.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех охватывал трепет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγίνετο ... φόβος
  choice: охватил страх
  rationale: Так естественно по-русски передаётся возникновение и распространение состояния, выраженное имперфектом γίνομαι с φόβος; оборот сохраняет динамику греческой фразы.
- source_word: δὲ
  choice: И
  rationale: Здесь частица продолжает повествование, не обозначая явного противопоставления.
- source_word: πάσῃ ψυχῇ
  choice: всякую душу
  rationale: Сохраняет буквальный образ греческого выражения «каждой душе» и его торжественное звучание, оставаясь понятным по-русски.
- source_word: φόβος
  choice: страх
  rationale: Прямое соответствие, сохраняющее возможное сочетание испуга и благоговейного трепета и не сужающее смысл до одного лишь восхищения.
- source_word: πολλά
  choice: много
  rationale: Естественно передаёт количественное значение применительно к паре существительных.
- source_word: τέρατα
  choice: чудес
  rationale: Передаёт поразительный, вызывающий изумление характер деяний и сохраняет отличие от «знамений».
- source_word: σημεῖα
  choice: знамений
  rationale: Передаёт указующую и свидетельствующую функцию необычных деяний в устойчивой библейской паре «чудеса и знамения».
- source_word: διὰ τῶν ἀποστόλων
  choice: через апостолов
  rationale: Сохраняет значение посредничества или орудия при διά с родительным падежом, не представляя апостолов непременно конечным источником действий.
- source_word: ἐγίνετο
  choice: совершалось
  rationale: Передаёт длительный или повторяющийся характер имперфекта и естественно сочетается с чудесами и знамениями; единственное число согласуется с русской конструкцией «много ...».
theological_decisions:
- issue: Оттенок φόβος как реакции на действия через апостолов
  choice: страх
  alternative: трепет; благоговейный трепет
  rationale: «Страх» сохраняет полноту и напряжённость исходного слова, которое в данном контексте может включать как испуг, так и благоговение; перевод не разрешает эту неоднозначность за читателя.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Образ «всякую душу» сохранён из греческого текста, а более идиоматичный вариант дан в сноске.
