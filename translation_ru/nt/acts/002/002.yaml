lexical_decisions:
- source_word: ἐγένετο
  choice: раздался
  rationale: В сочетании с ἦχος естественно передаёт возникновение слышимого явления, не утяжеляя фразу буквальным «произошёл».
- source_word: ἄφνω
  choice: внезапно
  rationale: Точно и в современном литературном регистре передаёт неожиданность события.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: с неба
  rationale: Сохраняет указание на небесный источник; «с неба» естественнее по-русски, чем «из неба», и не сводит οὐρανός лишь к атмосфере.
- source_word: ἦχος
  choice: шум
  rationale: В данном сравнении с сильным движущимся ветром «шум» естественно обозначает слышимое явление, не конкретизируя его как гул или рёв.
- source_word: ὥσπερ
  choice: словно от
  rationale: 'Ясно сохраняет сравнительный характер высказывания: речь идёт о шуме, подобном шуму ветра, а не обязательно о наличии самого ветра.'
- source_word: φερομένης
  choice: несущегося
  rationale: Передаёт движение воздуха, буквально мыслимого как несомый или движущийся, и звучит естественно в сочетании с «ветром».
- source_word: πνοῆς
  choice: ветра
  rationale: В контексте силы, движения и слышимого шума это наиболее подходящее значение слова, которое также может обозначать дуновение или дыхание.
- source_word: βιαίας
  choice: сильного
  rationale: Передаёт мощь и напор βίαιος без возможной для русского «яростного/неистового» персонификации или оттенка разрушительного насилия.
- source_word: ἐπλήρωσεν
  choice: наполнил
  rationale: Сохраняет «шум» грамматическим субъектом действия, как и в греческом тексте.
- source_word: ὅλον τὸν οἶκον
  choice: весь дом
  rationale: Прямо и естественно передаёт полноту, выраженную ὅλον.
- source_word: οὗ ἦσαν καθήμενοι
  choice: где они сидели
  rationale: Точно и без стилистической тяжеловесности передаёт относительное придаточное и продолженное состояние.
theological_decisions:
- issue: Природа явления, сравниваемого с ветром
  choice: 'Сохранено сравнение: «шум, словно от несущегося сильного ветра»'
  alternative: Понимать текст как утверждение, что дом наполнил буквальный сильный ветер
  rationale: ὥσπερ вводит сравнение. Перевод не превращает образное сопоставление в утверждение о буквальном присутствии ветра и тем самым сохраняет сдержанность исходного текста.
