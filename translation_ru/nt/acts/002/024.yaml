  text: ὃν ὁ θεὸς ἀνέστησεν λύσας τὰς ὠδῖνας τοῦ θανάτου, καθότι οὐκ ἦν δυνατὸν κρατεῖσθαι αὐτὸν ὑπ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/024.yaml
  text: whom God raised up[a], having loosed the pains of death[b], because it was not possible for him to be held by it.
translation:
  language: ru
  text: Его Бог воскресил, разрешив муки смерти[a], потому что смерть не могла удержать Его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может также означать «родовые муки» или «схватки»; возможен образ смерти, чьи муки были разрешены.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Ему невозможно было быть удерживаемым ею»; местоимение наиболее естественно относится к смерти.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: Его
  rationale: 'Относительное местоимение отсылает к Иисусу в предыдущем стихе. Начальная позиция «Его» сохраняет связь с предшествующей фразой и контраст: люди предали Его смерти, а Бог воскресил.'
- source_word: ἀνέστησεν
  choice: воскресил
  rationale: В данном контексте глагол обозначает возвращение Иисуса из мёртвых. «Воскресил» — естественный современный русский эквивалент, сохраняющий действие Бога без избыточного пояснения.
- source_word: λύσας
  choice: освободив
  rationale: Причастие от λύω передаёт освобождение, развязывание или прекращение удерживающей силы. «Освободив» естественно сочетается по-русски с последующим образом смерти, удерживающей Иисуса.
- source_word: τὰς ὠδῖνας τοῦ θανάτου
  choice: от мук смерти
  rationale: ὠδῖνας означает сильные муки и может особо обозначать родовые муки. Основной текст передаёт понятный в контексте смысл, а более конкретный образ родовых мук сохранён в сноске.
- source_word: καθότι
  choice: потому что
  rationale: Союз вводит причину и естественно передаётся современным русским «потому что».
- source_word: οὐκ ἦν δυνατὸν
  choice: не могла
  rationale: Греческая безличная конструкция буквально означает «не было возможно». В русском личная конструкция со «смертью» звучит естественно и сохраняет смысл невозможности.
- source_word: κρατεῖσθαι
  choice: удержать
  rationale: Страдательный инфинитив выражает пребывание во власти или хватке. Русское «удержать» ясно сохраняет образ власти смерти.
- source_word: ὑπ’ αὐτοῦ
  choice: смерть ... удержать
  rationale: Местоимение наиболее естественно относится к θανάτου, то есть к смерти. Повтор существительного необходим для ясного и естественного русского синтаксиса; буквальная местоименная форма отмечена в сноске.
theological_decisions:
- issue: К чему относится ὑπ’ αὐτοῦ
  choice: 'К смерти: «смерть не могла удержать Его»'
  alternative: Буквально «Он не мог быть удерживаем ею»; формально возможно искать иной мужской референт
  rationale: Ближайший и смыслово связный антецедент — θάνατος («смерть», мужского рода по-гречески). Фраза объясняет воскресение тем, что смерть не могла продолжать удерживать Иисуса.
- issue: Значение ὠδῖνας
  choice: «муки» в основном тексте
  alternative: «родовые муки», «схватки»
  rationale: Слово может обозначать именно родовые муки, но также сильные страдания вообще. Основной вариант естественен в контексте смерти, а конкретная образность и возможная межтекстовая перекличка сохраняются в сноске.
- issue: Связь λύσας с Иисусом
  choice: «освободив Его от мук смерти»
  alternative: 'Более буквально: «разрешив муки смерти»'
  rationale: В греческом объект при причастии прямо не повторён, однако по смыслу действие относится к Иисусу. Добавление местоимения делает фразу грамматически естественной по-русски, не меняя действующих лиц и не вводя отдельного доктринального вывода.
translation_notes:
  register: Современный литературный русский язык, ясный и достоинственный. Повтор «Его» и замена греческой безличной конструкции на личную обеспечивают естественность, а сноски сохраняют лексическую образность и буквальную синтаксическую форму.
