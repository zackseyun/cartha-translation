  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἄνδρες Ἰσραηλῖται, ἀκούσατε τοὺς λόγους τούτους. Ἰησοῦν τὸν Ναζωραῖον, ἄνδρα ⸂ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ⸃ εἰς ὑμᾶς δυνάμεσι καὶ τέρασι καὶ σημείοις οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς ἐν μέσῳ ὑμῶν, ⸀καθὼς αὐτοὶ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/022.yaml
  text: 'Men of Israel[a], hear these words: Jesus the Nazarene, a man attested to you by God with miracles and wonders and signs that God did through him in your midst[b], just as you yourselves know—'
translation:
  language: ru
  text: 'Мужи Израиля, выслушайте эти слова: Иисуса Назарянина[a], человека, которого Бог засвидетельствовал перед вами могущественными деяниями[b], чудесами и знамениями, совершёнными Богом через Него среди вас, как вы и сами знаете, —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «Иисуса из Назарета»; греческое Ναζωραῖος допускает как обозначение происхождения, так и форму прозвания «Назорей».
    reason: lexical_alternative
  - marker: b
    text: Или «силами» либо «чудесами»; греческое δυνάμεσι буквально указывает на проявления силы и в этом контексте может обозначать чудотворные деяния.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Мужи Израиля
  rationale: Сохраняет явно мужскую форму обращения ἄνδρες и указание на принадлежность к Израилю. Выражение возвышенное, но понятное современному читателю и естественнее, чем буквальное «мужчины-израильтяне».
- source_word: ἀκούσατε τοὺς λόγους τούτους
  choice: выслушайте эти слова
  rationale: Императив призывает аудиторию обратить внимание; «выслушайте» естественно передаёт этот призыв, а «эти слова» сохраняет λόγους без замены на более толковательное «весть».
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Иисуса Назарянина
  rationale: «Назарянин» — естественное русское обозначение человека, связанного с Назаретом, и сохраняет описательно-титульный характер Ναζωραῖος.
- source_word: ἄνδρα
  choice: человека
  rationale: В данном синтаксическом окружении русское «человека» естественно передаёт взрослого мужчину и ясно утверждает подлинную человечность Иисуса; вариант «мужа» здесь звучал бы излишне архаично и мог бы быть понят как указание на семейное положение.
- source_word: ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ εἰς ὑμᾶς
  choice: которого Бог засвидетельствовал перед вами
  rationale: Передаёт публичное подтверждение или удостоверение со стороны Бога. «Перед вами» естественно выражает направленность свидетельства к слушателям, не смешивая её с последующим ἐν μέσῳ ὑμῶν.
- source_word: δυνάμεσι καὶ τέρασι καὶ σημείοις
  choice: могущественными деяниями, чудесами и знамениями
  rationale: Сохраняет трёхчастную формулу и значение проявлений силы в δυνάμεσι. «Могущественные деяния» точнее удерживает лексическую образность, чем обобщающее «чудеса», которое также сделало бы первое и второе существительные почти неразличимыми.
- source_word: οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς
  choice: совершёнными Богом через Него
  rationale: Ясно сохраняет Бога как действующего субъекта, а Иисуса — как посредника действия, что прямо выражено сочетанием ὁ θεὸς и δι’ αὐτοῦ.
- source_word: ἐν μέσῳ ὑμῶν
  choice: среди вас
  rationale: Естественный современный русский эквивалент пространственно-общественного выражения «посреди вас».
- source_word: καθὼς αὐτοὶ οἴδατε
  choice: как вы и сами знаете
  rationale: Частица «и» вместе с «сами» передаёт эмфатическое αὐτοὶ и апелляцию к собственному знанию слушателей.
theological_decisions:
- issue: Христологическая формулировка ἄνδρα
  choice: Сохранить прямое обозначение Иисуса как человека
  alternative: Опустить существительное или заменить его местоимением
  rationale: Греческий текст прямо называет Иисуса ἄνδρα. Такая передача сохраняет утверждение Его подлинной человечности, не делая выводов, отрицающих или уменьшающих Его божественность.
- issue: Действующее лицо в описании знамений
  choice: Назвать Бога совершителем деяний, действующим через Иисуса
  alternative: Представить Иисуса единственным грамматическим субъектом деяний
  rationale: В греческом ὁ θεὸς является явным субъектом, а δι’ αὐτοῦ обозначает посредничество Иисуса. Формулировка сохраняет именно напряжение и распределение ролей данного стиха, не сглаживая их на основании более широкой христологии Нового Завета.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским обращением «Мужи Израиля». Синтаксическая незавершённость и конечное тире сохранены, поскольку винительный оборот с именем Иисуса продолжается в следующем стихе. Местоимение «Него» написано с прописной буквы по устойчивой русской библейской издательской традиции, без добавления богословского содержания.
