id: 2TI.1.16
reference: 2 Timothy 1:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: δῴη ἔλεος ὁ κύριος τῷ Ὀνησιφόρου οἴκῳ, ὅτι πολλάκις με ἀνέψυξεν, καὶ τὴν ἅλυσίν μου οὐκ ἐπαισχύνθη·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/016.yaml
  text: May the Lord grant mercy to the household of Onesiphorus[a], because he often refreshed me and was not ashamed of my chain.
translation:
  language: ru
  text: Да дарует Господь милость дому Онисифора, потому что он часто приносил мне облегчение и не стыдился моей цепи[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моего заключения»; буквально: «моей цепи».'
    reason: 'Лексическая альтернатива: конкретная цепь может метонимически обозначать заключение.'
lexical_decisions:
- source_word: δῴη
  choice: да дарует
  rationale: Аорист оптатива выражает молитвенное пожелание; конструкция «да дарует» естественно и достойно передаёт этот оттенок по-русски.
- source_word: ἔλεος
  choice: милость
  rationale: Обычное и уместное обозначение Божьего милосердного благоволения в молитвенном пожелании.
- source_word: ὁ κύριος
  choice: Господь
  rationale: Сохраняет божественный титул исходного текста, не уточняя его референта сверх сказанного по-гречески.
- source_word: τῷ Ὀνησιφόρου οἴκῳ
  choice: дому Онисифора
  rationale: В данном контексте «дом» означает семью или домочадцев, а не только здание; русское выражение сохраняет этот социальный смысл.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно вводит причину молитвенного пожелания.
- source_word: πολλάκις
  choice: часто
  rationale: Кратко и естественно передаёт неоднократность действия.
- source_word: ἀνέψυξεν
  choice: приносил мне облегчение
  rationale: Передаёт значение освежения, отрады и облегчения в понятной современной русской форме, не сужая его только до словесного ободрения.
- source_word: τὴν ἅλυσίν μου
  choice: моей цепи
  rationale: Сохраняет единственное число и конкретный образ цепи, которая метонимически указывает на заключение Павла.
- source_word: οὐκ ἐπαισχύνθη
  choice: не стыдился
  rationale: Точно передаёт морально-социальный смысл греческого глагола и естественно звучит по-русски.
theological_decisions:
- issue: Кого обозначает титул «Господь» в благословении Павла
  choice: Оставить «Господь» без дополнительного уточнения
  alternative: Явно отнести титул к Богу Отцу или к Господу Иисусу
  rationale: Греческий текст содержит только ὁ κύριος и сам по себе не называет референта; перевод сохраняет эту богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного пожелания. «Дом Онисифора» сохраняет библейский социальный смысл семьи и домочадцев; «приносил мне облегчение» понятно современному читателю и передаёт образный смысл ἀναψύχω.
