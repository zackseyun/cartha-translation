  text: ὑπόμνησιν ⸀λαβὼν τῆς ἐν σοὶ ἀνυποκρίτου πίστεως, ἥτις ἐνῴκησεν πρῶτον ἐν τῇ μάμμῃ σου Λωΐδι καὶ τῇ μητρί σου Εὐνίκῃ, πέπεισμαι δὲ ὅτι καὶ ἐν σοί.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/005.yaml
  text: having been reminded of the sincere faith in you, which first lived in your grandmother Lois and your mother Eunice, I am persuaded that it is also in you.
translation:
  language: ru
  text: Вспоминая об искренней вере, живущей в тебе, — той, что прежде жила в твоей бабушке Лоиде и твоей матери Евнике, — я убеждён, что она живёт и в тебе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπόμνησιν λαβών
  choice: Вспоминая
  rationale: Греческое выражение буквально связано с получением напоминания или воспоминанием; в данном контексте естественное русское деепричастие передаёт обращение памяти Павла к вере Тимофея, не предполагая обязательно внешнего напоминания.
- source_word: ἀνυποκρίτου πίστεως
  choice: искреннюю веру
  rationale: ἀνυπόκριτος означает неподдельный, непритворный; «искренняя» ясно и естественно передаёт смысл в современном русском языке.
- source_word: ἐνῴκησεν
  choice: жила
  rationale: Глагол означает «поселиться, обитать»; применительно к вере русское «жила» сохраняет образ внутреннего, устойчивого присутствия без неестественной буквальности.
- source_word: μάμμῃ
  choice: бабушке
  rationale: Прямое родственное обозначение; выбран обычный современный русский эквивалент.
- source_word: πέπεισμαι
  choice: я убеждён
  rationale: Перфект выражает сохраняющуюся уверенность говорящего; «убеждён» точно передаёт это состояние.
theological_decisions:
- issue: Характер присутствия веры у Лоиды, Евники и Тимофея
  choice: Сохранён образ веры, которая «жила» в людях
  alternative: 'Передать как простое обладание верой: «они верили»'
  rationale: Исходный текст персонифицирует веру посредством ἐνοικέω; перевод сохраняет этот образ и не сводит его к отвлечённому утверждению.
- issue: Уверенность Павла относительно веры Тимофея
  choice: «я убеждён, что она живёт и в тебе»
  alternative: «я уверен, что и ты веришь»
  rationale: Сохранены как степень уверенности πέπεισμαι, так и эллиптическая связь с образом живущей веры, без добавления богословских выводов.
translation_notes:
  register: 'Современный литературный русский язык с уважительным, но доступным библейским регистром. Традиционные русские формы имён: Лоида и Евника. Повтор «живёт в тебе» отражает начало и конец греческой фразы, хотя по-русски создаёт заметный повтор.'
