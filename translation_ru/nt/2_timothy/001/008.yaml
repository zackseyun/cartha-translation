  source_fidelity: 'Основной смысл передан верно: запрет стыдиться свидетельства о Господе и Павла, призыв совместно переносить страдания в связи с Евангелием и указание на Божью силу сохранены. Однако «полагаясь на силу Бога» добавляет способ действия, которого κατά δύναμιν θεοῦ прямо не выражает; ближе и нейтральнее «по силе Бога».'
  naturalness: «Итак, не стыдись … и меня» понятна, но «ни меня» точнее воспроизводит отрицательное присоединение μηδέ и естественнее в современном литературном русском. «Раздели страдания за Благую Весть» допустимо; термин «Евангелие» более устойчив для данного жанра и регистра.
