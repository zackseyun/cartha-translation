source:
  edition: SBLGNT
  text: Μὴ οὖν ἐπαισχυνθῇς τὸ μαρτύριον τοῦ κυρίου ἡμῶν μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ, ἀλλὰ συγκακοπάθησον τῷ εὐαγγελίῳ κατὰ δύναμιν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/008.yaml
  text: Therefore, do not be ashamed of the testimony about our Lord, nor of me, his prisoner, but suffer hardship with the gospel according to the power of God,
translation:
  language: ru
  text: Итак, не стыдись свидетельства о нашем Господе[a] и ни меня, Его узника, но раздели страдания за Евангелие[b] по силе Бога[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свидетельства нашего Господа». Греческий родительный падеж может указывать как на свидетельство о Господе, так и на свидетельство, исходящее от Него.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «раздели страдания ради Евангелия». Греческий глагол подразумевает совместное участие в страдании и тяготах.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «сообразно силе Бога»; «силой Бога». Греческое выражение может указывать на меру, соответствие или средство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ οὖν
  choice: Итак, не
  rationale: οὖν выражает вывод из предшествующего наставления; «итак» естественно сохраняет логическую связь, а μή с аористным сослагательным передаёт запрещение.
- source_word: ἐπαισχυνθῇς
  choice: стыдись
  rationale: Глагол означает испытывать стыд или из-за стыда отступать; «не стыдись» — естественная и контекстуально точная формулировка.
- source_word: τὸ μαρτύριον τοῦ κυρίου ἡμῶν
  choice: свидетельства о нашем Господе
  rationale: 'μαρτύριον обозначает свидетельство, а родительный падеж, вероятнее всего, объективен: речь идёт о свидетельстве, предметом которого является Господь. Подлинная неоднозначность отмечена в сноске.'
- source_word: μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ
  choice: и меня, Его узника
  rationale: После отрицания μηδέ естественно передаётся как «и» в конструкции «не… и…». «Его узника» сохраняет принадлежность или тесную связь заключения Павла с Господом, не сводя её лишь к причине заключения.
- source_word: συγκακοπάθησον
  choice: раздели страдания
  rationale: Сложный глагол содержит идею совместного участия в тяготах и страданиях. «Раздели страдания» ясно и естественно передаёт совместность, не уточняя не названного прямо соучастника.
- source_word: τῷ εὐαγγελίῳ
  choice: за Благую Весть
  rationale: Дательный падеж при συγκακοπάθησον выражает сжатую смысловую связь. По-русски «страдания за Благую Весть» естественно передаёт страдание в связи с её провозглашением; более буквальная связь отмечена в сноске.
- source_word: κατὰ δύναμιν θεοῦ
  choice: полагаясь на силу Бога
  rationale: κατά с винительным может обозначать соответствие, меру или действующую основу. В данном призыве русская формулировка естественно выражает Божью силу как основание способности страдать, а более формальный вариант сохранён в сноске.
theological_decisions:
- issue: Связь «свидетельства» с «нашим Господом»
  choice: 'объектный родительный: «свидетельство о нашем Господе»'
  alternative: 'субъектный родительный: «свидетельство нашего Господа»'
  rationale: Контекст призывает Тимофея не стыдиться христианского свидетельства, сосредоточенного на Господе, и не стыдиться Павла. Однако греческая форма допускает и понимание свидетельства, исходящего от Господа, поэтому оно указано в сноске.
- issue: Смысл выражения «Его узник»
  choice: сохранить притяжательную связь с Господом
  alternative: «узник ради Него» или «заключённый за Него»
  rationale: αὐτοῦ обозначает принадлежность или связь с Господом. «Его узник» сохраняет богословское напряжение выражения, не ограничивая смысл только причиной заключения.
- issue: Характер участия в страдании
  choice: «раздели страдания за Благую Весть»
  alternative: «страдай вместе с Благой Вестью»
  rationale: Греческий глагол подчёркивает совместное участие, тогда как дательный τῷ εὐαγγελίῳ буквально сближает страдание с Благой Вестью. Основной текст передаёт естественный русский смысл, а необычная формальная связь отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и увещевательным тоном. «Благая Весть» употреблена как понятное современному читателю обозначение εὐαγγέλιον. Заглавное «Его» соответствует принятому благоговейному издательскому регистру, не меняя смысла исходного текста.
