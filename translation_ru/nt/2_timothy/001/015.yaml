  text: Οἶδας τοῦτο ὅτι ἀπεστράφησάν με πάντες οἱ ἐν τῇ Ἀσίᾳ, ὧν ἐστιν Φύγελος καὶ Ἑρμογένης.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/015.yaml
  text: 'You know this: all those in Asia turned away from me[b][a], among whom are Phygelus and Hermogenes.'
translation:
  language: ru
  text: Ты знаешь, что все в Асии[a] отвернулись от меня[b]; среди них Фигелл и Ермоген.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «Асия» — римская провинция на западе Малой Азии, а не современная часть света Азия.
    reason: cultural_note
  - marker: b
    text: 'Или: «оставили меня», «покинули меня». Буквально греческий текст говорит: «отвернулись от меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδας τοῦτο ὅτι
  choice: Ты знаешь, что
  rationale: В русском языке содержание знания естественно вводится союзом «что»; отдельное «это» было бы избыточным и менее плавным.
- source_word: ἀπεστράφησάν με
  choice: отвернулись от меня
  rationale: Передаёт образ и relationalный смысл греческого глагола, не усиливая его до однозначного «покинули» или «предали».
- source_word: πάντες οἱ ἐν τῇ Ἀσίᾳ
  choice: все находящиеся в Асии
  rationale: Сохраняет широкое πάντες и допускаемое контекстом ограничение круга лиц, не добавляя его в текст.
- source_word: Ἀσίᾳ
  choice: Асии
  rationale: Традиционная русская библейская форма названия римской провинции; пояснение дано в сноске.
- source_word: ὧν ἐστιν
  choice: среди них
  rationale: 'Естественно передаёт партитивное значение: названные лица принадлежат к упомянутой группе.'
- source_word: Φύγελος καὶ Ἑρμογένης
  choice: Фигелл и Ермоген
  rationale: Имена переданы в принятых русских библейских формах.
theological_decisions:
- issue: Объём выражения «все находящиеся в Асии»
  choice: Сохранено неуточнённое «все» с подразумеваемыми контекстом границами группы.
  alternative: Понять как буквально каждого христианина или жителя провинции либо явно добавить «все мои сторонники».
  rationale: Греческое πάντες имеет широкую силу, но контекст может ограничивать круг лиц. Перевод не абсолютизирует и не смягчает высказывание поясняющей вставкой.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. «Находящиеся» сохраняет структуру оригинала, а форма «Асия» отличает древнюю провинцию от современной Азии. Все маркеры сносок помещены непосредственно после соответствующих слов.
