base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/007.yaml
  text: For God did not give us a spirit of cowardice[b][a], but of power and love and self-control.
translation:
  language: ru
  text: Ведь Бог дал нам не дух[a] трусости[b], а дух силы, любви и самообладания[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может означать «дух» или внутренний настрой; здесь оно описывает нечто, даруемое Богом.
    reason: theological_ambiguity
  - marker: b
    text: 'Или: «боязливости», «малодушия»; имеется в виду трусливый страх, а не чувство страха вообще.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «здравомыслия», «самодисциплины».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Ведь ... не
  rationale: γάρ поясняет предыдущее увещание; современное русское «ведь» естественно передаёт эту связь, а отрицание ставится при противопоставляемом дополнении.
- source_word: ἔδωκεν ἡμῖν ὁ θεὸς
  choice: Бог дал нам
  rationale: Аорист передан простым прошедшим временем; дательный ἡμῖν естественно выражен местоимением «нам».
- source_word: πνεῦμα
  choice: дух
  rationale: Русское «дух» сохраняет качественный смысл — внутренний настрой или образ действия — и вместе с тем не исключает возможной связи со Святым Духом.
- source_word: δειλίας
  choice: трусости
  rationale: δειλία обозначает не страх вообще, а постыдную боязливость, поэтому «трусость» точно передаёт сильную отрицательную окраску слова.
- source_word: δυνάμεως
  choice: силы
  rationale: В данном ряду «сила» — прямое и естественное соответствие δύναμις, обозначающему действенную способность или могущество.
- source_word: ἀγάπης
  choice: любви
  rationale: Обычное и точное современное соответствие ἀγάπη.
- source_word: σωφρονισμοῦ
  choice: самообладания
  rationale: Слово включает владение собой, дисциплинированность и здравость суждения; «самообладание» ясно передаёт его этический смысл, а более широкий диапазон отмечен в сноске.
- source_word: ἀλλὰ
  choice: а
  rationale: В русской отрицательно-противительной конструкции «не ... а ...» союз «а» естественнее всего передаёт сильное противопоставление.
theological_decisions:
- issue: Референт πνεῦμα
  choice: «дух» без уточнения, что это непосредственно титул Святого Духа
  alternative: «Дух» как прямое указание на Святого Духа
  rationale: Отсутствие артикля и зависимые родительные определения благоприятствуют качественному смыслу — духу или настрою, который даёт Бог. Однако русский текст и сноска сохраняют возможность связи со Святым Духом, не разрешая неоднозначность категорически.
- issue: Повтор слова «дух» во второй части
  choice: «а дух силы, любви и самообладания»
  alternative: «а силы, любви и самообладания»
  rationale: Повтор, подразумеваемый эллиптической греческой конструкцией, делает русское противопоставление ясным и показывает, что все три родительных определения характеризуют один «дух».
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественная без архаизмов. «Ведь» естественно связывает стих с предшествующим увещанием, а конструкция «не ... а ...» ясно передаёт греческое противопоставление.
