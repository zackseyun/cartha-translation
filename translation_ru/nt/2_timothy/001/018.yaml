base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/018.yaml
  text: May the Lord grant him to find mercy from the Lord on that day—and you know better how much he served in Ephesus[a][b][c].
translation:
  language: ru
  text: Пусть Господь даст ему обрести милость от Господа[a] в тот день[b]. А ты лучше знаешь, как много он послужил в Эфесе[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у Господа». Греческий оборот может указывать на источник милости или подчёркивать обретение милости у Господа.'
    reason: lexical_alternative
  - marker: b
    text: «Тот день» — распространённое в Новом Завете обозначение грядущего дня Божьего суда или оправдания.
    reason: cross_reference
  - marker: c
    text: 'Или: «всё, чем он послужил»; «какие услуги он оказал». Греческое выражение обобщает объём его служения в Эфесе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη αὐτῷ ὁ κύριος
  choice: Пусть Господь даст ему
  rationale: Аорист оптатива выражает молитвенное пожелание. Конструкция «пусть… даст» естественно передаёт его в современном русском языке.
- source_word: εὑρεῖν ἔλεος
  choice: обрести милость
  rationale: Сохраняет греческий образ и привычное библейское словоупотребление, оставаясь понятным современному читателю.
- source_word: παρὰ κυρίου
  choice: у Господа
  rationale: При родительном падеже παρά может указывать как на источник, так и на пребывание при ком-либо. Русское «обрести милость у Господа» естественно и не сужает выражение исключительно до значения источника.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: в тот день
  rationale: Естественная русская передача временного оборота; сохраняет эсхатологический намёк без поясняющей вставки.
- source_word: ὅσα ... διηκόνησεν
  choice: сколько он послужил
  rationale: ὅσα обобщает объём и множество оказанных услуг, а διακονέω здесь обозначает служение или практическую помощь. Формулировка сохраняет краткость и смысл степени.
- source_word: βέλτιον σὺ γινώσκεις
  choice: ты знаешь лучше
  rationale: Сохраняет сравнительное значение βέλτιον, не добавляя отсутствующего в греческом тексте объекта сравнения.
theological_decisions:
- issue: К кому относится повторённое κύριος
  choice: Оба раза переведено словом «Господь» без уточнения личности.
  alternative: Первое упоминание понимать как Христа, а второе — как Отца; либо оба — как Христа.
  rationale: Греческий текст не проводит явного различия, поэтому перевод сохраняет повтор и богословскую неоднозначность.
- issue: Значение выражения «тот день»
  choice: Сохранено «в тот день» без истолковывающего дополнения.
  alternative: «в день суда» или «в последний день».
  rationale: Выражение, вероятно, указывает на грядущий день суда или оправдания, однако сам текст не называет его прямо.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Порядок второй части слегка перестроен ради естественного русского акцента; повтор слова «Господь» сохранён. Все примечания отмечены в основном тексте.
