base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the will of God, according to the promise of the life that is in Messiah Jesus,
translation:
  language: ru
  text: Павел, апостол Мессии Иисуса[a] по воле Бога, согласно обещанию жизни в Мессии Иисусе,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа Иисуса»; во втором случае: «Христе Иисусе».'
    reason: Альтернативная традиционная передача титула Χριστός; формы приведены с учётом падежа в каждом из двух вхождений.
lexical_decisions:
- source_word: Παῦλος
  choice: Павел
  rationale: Устоявшаяся русская форма личного имени.
- source_word: ἀπόστολος
  choice: апостол
  rationale: Сохраняет закрепившееся в раннехристианском контексте значение уполномоченного посланника и самообозначение Павла.
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: Иисуса Мессии / Иисусе Мессии
  rationale: Χριστός передано как титул «Мессия», а порядок слов адаптирован к естественной современной русской речи.
- source_word: διὰ θελήματος θεοῦ
  choice: по воле Бога
  rationale: Естественно передаёт основание и божественное уполномочивание, выраженные διά с родительным падежом.
- source_word: κατ’ ἐπαγγελίαν
  choice: согласно обещанию
  rationale: Сохраняет значение соответствия или соотнесённости, не превращая оборот в однозначное указание цели.
- source_word: ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ
  choice: жизни в Иисусе Мессии
  rationale: Кратко и естественно передаёт жизнь, определяемую оборотом ἐν Χριστῷ Ἰησοῦ, без добавления отсутствующего в исходном тексте пояснения.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В приветствии слово сохраняет различимую силу титула; вариант «Христос» отмечен в сноске как традиционная русская передача.
- issue: Связь κατ’ ἐπαγγελίαν с апостольством Павла
  choice: согласно обещанию
  alternative: ради обещания / для возвещения обещания
  rationale: Выбрана формулировка, сохраняющая широкое значение соответствия и не сужающая оборот до цели служения.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет форму начальной части эпистолярного приветствия. Запятая в конце показывает, что предложение продолжается в следующем стихе.
