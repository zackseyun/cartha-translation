reference: 2 Timothy 1:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Χάριν ἔχω τῷ θεῷ, ᾧ λατρεύω ἀπὸ προγόνων ἐν καθαρᾷ συνειδήσει, ὡς ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν ἐν ταῖς δεήσεσίν μου, νυκτὸς καὶ ἡμέρας
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/003.yaml
  text: I thank God[a], whom I serve as my ancestors did with a clean conscience[c][b], as I constantly remember you in my prayers night and day.
translation:
  language: ru
  text: Я благодарю Бога, Которому служу[a], как и мои предки[b], с чистой совестью, и непрестанно вспоминаю тебя[c] в своих молитвах ночью и днём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Которому поклоняюсь». Греческий глагол может обозначать религиозное служение или поклонение Богу.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от предков»; возможно также: «следуя вере предков». Выражение подчёркивает преемственность служения Богу.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «имею непрестанное воспоминание о тебе в моих молениях».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω τῷ θεῷ
  choice: Я благодарю Бога
  rationale: Греческий оборот χάριν ἔχω с дательным падежом идиоматически означает выражение благодарности; русский оборот передаёт это прямо и естественно.
- source_word: ᾧ λατρεύω
  choice: Которому служу
  rationale: λατρεύω обозначает религиозное служение Богу и может включать поклонение. «Служу» сохраняет широту значения, не сводя его только к богослужебному поклонению.
- source_word: ἀπὸ προγόνων
  choice: как и мои предки
  rationale: Буквально «от предков»; в контексте выражение указывает на преемственность служения Богу с верой предков. Выбранный вариант естественен по-русски и не превращает предание предков в основание служения.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: с чистой совестью
  rationale: Предложное сочетание выражает образ служения; «с чистой совестью» — устойчивый и ясный современный русский оборот.
- source_word: ὡς
  choice: и
  rationale: Здесь ὡς свободно связывает благодарение с постоянным молитвенным воспоминанием. Сочинительная связь по-русски сохраняет близость двух мыслей, не навязывая более узкого причинного или временного толкования.
- source_word: ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν
  choice: непрестанно вспоминаю тебя
  rationale: Буквально говорится о постоянном воспоминании о Тимофее. Глагольная формулировка передаёт смысл естественно и сохраняет оттенок постоянства.
- source_word: ἐν ταῖς δεήσεσίν μου
  choice: в своих молитвах
  rationale: δέησις точнее обозначает молитву-просьбу, однако «в своих молитвах» здесь звучит естественно и достаточно полно передаёт контекст молитвенного обращения.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: ночью и днём
  rationale: Прямой и естественный русский эквивалент выражения, обозначающего постоянную регулярность.
theological_decisions:
- issue: Связь служения Павла с верой его предков в ἀπὸ προγόνων
  choice: «как и мои предки» — служение Павла представлено в преемственности с их служением Богу
  alternative: «по преданию предков» или буквальное «от предков»
  rationale: Фраза подчёркивает преемственность, но сама по себе не утверждает, что предание является основанием или нормой служения. Перевод не противопоставляет веру Павла вере Израиля и не добавляет частного конфессионального вывода.
- issue: Объём значения λατρεύω
  choice: «служу»
  alternative: «поклоняюсь»
  rationale: Глагол относится к священному, обращённому к Богу служению и способен включать поклонение. «Служу» оставляет этот диапазон открытым.
- issue: Логическая функция ὡς
  choice: нейтральная сочинительная связь
  alternative: причинное «потому что», временное «когда» или сравнительное «как»
  rationale: Контекст допускает оттенок обстоятельства или содержания благодарения, но не требует однозначно причинной либо временной связи. Русская формулировка избегает её догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского письма. Синтаксис сделан ясным для обычного читателя; сохранены преемственность с верой предков и смысл священного служения без конфессионального уточнения.
