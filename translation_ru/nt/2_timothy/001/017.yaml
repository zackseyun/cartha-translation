  footnotes:
  - marker: a
    text: 'Или: «придя в Рим»; возможно также: «находясь в Риме». Греческое причастие γενόμενος допускает несколько способов передачи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: но
  rationale: Естественный противительный союз, противопоставляющий поведение Онисифора упомянутому ранее отступничеству других.
- source_word: γενόμενος ἐν Ῥώμῃ
  choice: оказавшись в Риме
  rationale: 'Деепричастный оборот близко передаёт аористное причастие и сохраняет неоднозначность: речь может идти как о прибытии в Рим, так и просто о пребывании там.'
- source_word: σπουδαίως
  choice: усердно
  rationale: Передаёт серьёзность, настойчивость и приложенные усилия без избыточного усиления.
- source_word: ἐζήτησέν με
  choice: он разыскивал меня
  rationale: В данном контексте несовершенный вид по-русски естественно обозначает продолжительный целенаправленный поиск, завершившийся находкой.
- source_word: καὶ εὗρεν
  choice: и нашёл
  rationale: Прямо передаёт завершившийся результат поиска; объект «меня» естественно подразумевается из предыдущего глагола.
