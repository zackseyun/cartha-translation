  source_fidelity: «Но, оказавшись в Риме, он усердно разыскивал меня и нашёл—» точно передаёт противительный союз ἀλλά, обстоятельственный оттенок γενόμενος ἐν Ῥώμῃ, усиленный поиск σπουδαίως ἐζήτησέν με и его результат καὶ εὗρεν. «Оказавшись в Риме» удачно сохраняет допустимую широту греческого выражения, не сводя его однозначно ни к прибытию, ни к простому пребыванию.
  naturalness: Фраза естественна для современного литературного русского. «Усердно разыскивал» хорошо сочетается с последующим «нашёл»; опущение повторного «меня» после «нашёл» нормативно и не создаёт неясности. Конечное тире уместно, поскольку синтаксическая мысль продолжается в следующем стихе.
  terminology: Имя города передано в нормативной форме «Рим». Специальных богословских терминов в стихе нет. Регистр соответствует посланию и не содержит ненужной архаизации.
