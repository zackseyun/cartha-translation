  text: ὑποτύπωσιν ἔχε ὑγιαινόντων λόγων ὧν παρ’ ἐμοῦ ἤκουσας ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/013.yaml
  text: Hold to the pattern of sound words that you heard from me[c][b][a], in the faith and love that are in Messiah Jesus.
translation:
  language: ru
  text: Держись образца здравых слов, которые ты слышал от меня, в вере[a] и любви во Мессии Иисусе[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в верности и любви»; греческое слово может означать также верность или доверие.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно и другое понимание: «здравых слов, которые ты слышал от меня, о вере и любви во Мессии Иисусе». Греческая конструкция может описывать либо то, как Тимофею следует держаться образца, либо содержание услышанных слов.'
    reason: alternative_reading
  - marker: c
    text: 'Традиционный перевод: «во Христе Иисусе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτύπωσιν
  choice: образца
  rationale: Существительное обозначает образец, очертание или модель, которой следует руководствоваться. «Образец» естественно передаёт нормативный характер выражения, не сужая его до простого «конспекта».
- source_word: ἔχε
  choice: держись
  rationale: Буквально глагол означает «имей», но повелительная форма здесь призывает сохранять и не оставлять данный образец. «Держись» ясно и естественно передаёт эту силу.
- source_word: ὑγιαινόντων λόγων
  choice: здравых слов
  rationale: ὑγιαίνω буквально связано со здоровьем и метафорически указывает на здравость, особенно применительно к учению. «Здравых» сохраняет метафору, а «слов» передаёт λόγων без замены на более истолковывающее «учение».
- source_word: ὧν παρ’ ἐμοῦ ἤκουσας
  choice: которые ты слышал от меня
  rationale: 'παρά с родительным падежом обозначает источник: слова были услышаны от Павла. Относительное предложение естественно относится к «словам».'
- source_word: ἐν πίστει
  choice: с верой
  rationale: Предлог ἐν здесь естественно выражает образ действия или сферу, в которой Тимофей должен держаться образца. «С верой» идиоматично по-русски; возможные значения «верность» и «доверие» сохранены в примечании.
- source_word: καὶ ἀγάπῃ
  choice: и любовью
  rationale: ἀγάπη прямо передаётся словом «любовь».
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: во Мессии Иисусе
  rationale: Предложная группа характеризует названные веру и любовь как находящиеся в Мессии Иисусе. Краткая русская конструкция сохраняет связь без добавления отсутствующего в греческом пояснения.
- source_word: Χριστῷ Ἰησοῦ
  choice: Мессии Иисусе
  rationale: Χριστός сохраняет здесь титульный смысл «Мессия». Традиционный вариант «Христе Иисусе» указан в примечании.
theological_decisions:
- issue: Синтаксическая связь ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ
  choice: 'Фраза описывает, как Тимофей должен держаться образца: с верой и любовью во Мессии Иисусе.'
  alternative: 'Фраза может относиться к содержанию здравых слов: это слова о вере и любви во Мессии Иисусе.'
  rationale: Порядок слов допускает обе синтаксические связи. Увещевательный ход мысли несколько благоприятствует пониманию веры и любви как образа действия, но альтернативное чтение не исключено и вынесено в примечание.
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В сочетании с именем Иисуса слово сохраняет различимый титульный смысл. «Мессия» передаёт значение титула, тогда как традиционная форма отмечена в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Здравых слов» намеренно сохраняет греческую метафору здоровья и буквальное значение λόγων; остальной синтаксис сделан естественным и понятным для современного читателя.
