lexical_decisions:
- source_word: εἰς ὃ
  choice: для которой
  rationale: Оборот отсылает к Благой Вести из предыдущего стиха и указывает, ради какого служения Павел был назначен. Женский род местоимения естественно согласуется с «Благой Вестью» в русском контексте.
- source_word: ἐτέθην
  choice: я и был поставлен
  rationale: В сочетании с названиями служений пассив τίθημι означает назначение или поставление, а не физическое помещение. Частица «и» передаёт лёгкое усиление, создаваемое явным ἐγώ.
- source_word: κῆρυξ
  choice: глашатаем
  rationale: «Глашатай» передаёт смысл официально уполномоченного публичного вестника точнее, чем церковно окрашенное «проповедник».
- source_word: ἀπόστολος
  choice: апостолом
  rationale: В самоописании Павла это устойчивое обозначение его признанного служения, поэтому традиционный термин точен и естественен.
- source_word: διδάσκαλος
  choice: учителем
  rationale: Прямое и естественное соответствие обычному значению слова διδάσκαλος.
theological_decisions:
- issue: Передавать ли κῆρυξ традиционным словом «проповедник» или более лексически точным «глашатай»
  choice: глашатай
  alternative: проповедник
  rationale: «Глашатай» сохраняет идею официально уполномоченного публичного провозвестника и не сводит слово к более позднему церковному пониманию роли проповедника.
- issue: Определить ли референт εἰς ὃ как Благую Весть из предыдущего контекста
  choice: для которой
  alternative: для чего / к чему
  rationale: Ближайший смысловой референт — «Благая Весть» в 1:10; такая передача сохраняет обратную связь с контекстом, не добавляя нового богословского содержания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. «Поставлен» естественно для назначения на служение; «глашатай» несколько возвышенно, но понятно и сохраняет официальный оттенок κῆρυξ. Союз «и» перед сказуемым ненавязчиво отражает акцент явного местоимения ἐγώ.
