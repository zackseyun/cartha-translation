  text: δι’ ἣν αἰτίαν ἀναμιμνῄσκω σε ἀναζωπυρεῖν τὸ χάρισμα τοῦ θεοῦ, ὅ ἐστιν ἐν σοὶ διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/006.yaml
  text: For this reason I remind you to rekindle the gift of God that is in you through the laying on of my hands[a].
translation:
  language: ru
  text: По этой причине я напоминаю тебе вновь разжечь дар Божий, который пребывает в тебе через возложение моих рук[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «раздуть пламя». Греческий глагол рисует образ огня, который снова разжигают до яркого пламени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: По этой причине
  rationale: Естественное причинно-связующее выражение, сохраняющее связь с предшествующим контекстом.
- source_word: ἀναμιμνῄσκω
  choice: я напоминаю
  rationale: Настоящее время передано прямо и естественно; глагол вводит последующий инфинитив как содержание напоминания.
- source_word: σε ἀναζωπυρεῖν
  choice: тебе вновь разжечь
  rationale: Глагол содержит образ огня, который нужно снова привести к сильному горению. Формулировка сохраняет как значение возобновления, так и метафору пламени.
- source_word: τὸ χάρισμα τοῦ θεοῦ
  choice: дар Божий
  rationale: Передаёт χάρισμα как дар, данный Богом, не добавляя отсутствующего в тексте уточнения «духовный».
- source_word: ὅ ἐστιν ἐν σοὶ
  choice: который пребывает в тебе
  rationale: Сохраняет утверждение о присутствии дара в Тимофее; «пребывает» звучит естественно и достойно в современном литературном русском.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου
  choice: через возложение моих рук
  rationale: Сохраняет устойчивое библейское обозначение возложения рук и инструментальное значение διά с родительным падежом.
theological_decisions:
- issue: Связь дара с действием Павла
  choice: через возложение моих рук
  alternative: посредством возложения моих рук
  rationale: Формулировка сохраняет прямое указание текста на передачу или опосредование дара через возложение рук Павла, не вводя более разработанного сакраментального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Синтаксис близок к греческому, но естественен для обычного читателя; метафора огня и богословская неоднозначность выражения «через возложение моих рук» сохранены.
