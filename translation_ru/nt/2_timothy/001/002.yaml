id: 2TI.1.2
reference: 2 Timothy 1:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τιμοθέῳ ἀγαπητῷ τέκνῳ· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/002.yaml
  text: 'To Timothy[a], beloved child: grace, mercy, and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: ru
  text: 'Тимофею, любимому сыну[a]: благодать, милость и мир от Бога Отца и Мессии[b] Иисуса, нашего Господа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «любимому дитяти» или «любимому ребёнку». Греческое слово не уточняет пол и здесь обозначает близкие отношения духовного родства.'
    reason: lexical_clarification
  - marker: b
    text: 'Или: «Христа Иисуса». Греческий титул Χριστός означает «Мессия», то есть «Помазанник».'
    reason: alternative_rendering
lexical_decisions:
- source_word: ἀγαπητῷ
  choice: любимому
  rationale: Передаёт тёплое и весомое обращение без излишней архаичности; по-русски естественно сочетается со словом «сыну».
- source_word: τέκνῳ
  choice: сыну
  rationale: Греческое слово буквально шире и означает «дитя, ребёнок», но в обращении к известному адресату-мужчине русское «сыну» естественно выражает метафору духовного родства. Более буквальное значение отмечено в сноске.
- source_word: χάρις
  choice: благодать
  rationale: Устоявшийся и точный эквивалент характерного для Павла слова, сохраняющий его богословскую насыщенность.
- source_word: ἔλεος
  choice: милость
  rationale: Прямой современный эквивалент, сохраняющий этот элемент приветствия отдельно от благодати и мира.
- source_word: εἰρήνη
  choice: мир
  rationale: Точный и традиционный эквивалент, способный передать как отсутствие вражды, так и полноту благополучия.
- source_word: θεοῦ πατρὸς
  choice: Бога Отца
  rationale: В греческом тексте при слове «Отец» нет местоимения «наш», поэтому оно не добавлено.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Передаёт значение греческого титула Χριστός, а не только его традиционную транслитерацию. Вариант «Христа» дан в сноске.
- source_word: κυρίου
  choice: Господа
  rationale: Сохраняет значение власти и христологическую весомость титула κύριος.
theological_decisions:
- issue: Передача Χριστοῦ Ἰησοῦ
  choice: Мессии Иисуса
  alternative: Христа Иисуса
  rationale: Χριστός здесь сохраняет значение титула, поэтому в основном тексте передано его значение «Мессия». Традиционная форма «Христос» указана в сноске; порядок слов оригинала сохранён.
- issue: Передача метафоры τέκνον применительно к Тимофею
  choice: сыну
  alternative: дитяти; ребёнку
  rationale: «Сын» естественно для современного русского обращения к Тимофею и выражает духовное родство, не утверждая биологического происхождения. Более широкий объём греческого слова сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского приветствия. Двоеточие сохраняет форму адреса и следующего за ним благословения. Не добавлено отсутствующее в греческом местоимение «наш» при словах «Бог Отец»; «нашего» относится только к «Господу» согласно тексту.
