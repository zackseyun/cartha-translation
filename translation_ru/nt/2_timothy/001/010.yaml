source:
  edition: SBLGNT
  text: φανερωθεῖσαν δὲ νῦν διὰ τῆς ἐπιφανείας τοῦ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃, καταργήσαντος μὲν τὸν θάνατον φωτίσαντος δὲ ζωὴν καὶ ἀφθαρσίαν διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/010.yaml
  text: but has now been revealed through the appearing of our Savior Jesus the Messiah[a], who indeed abolished death and brought life and incorruptibility to light through the gospel[b],
translation:
  language: ru
  text: а теперь она открыта через явление нашего Спасителя Иисуса Мессии[a], который упразднил смерть и через Евангелие вывел на свет жизнь и нетление[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисуса Христа». Греческое Χριστός может употребляться как титул («Мессия») или как обозначение, близкое к имени («Христос»).'
    reason: alternative_reading
  - marker: b
    text: 'Или: «бессмертие». Греческое слово подчёркивает неподверженность тлению и разрушению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθεῖσαν
  choice: она была явлена
  rationale: Причастие относится к благодати из предыдущего стиха. В русском тексте личная конструкция с местоимением ясно сохраняет эту связь и страдательное значение.
- source_word: ἐπιφανείας
  choice: явление
  rationale: Передаёт видимое историческое явление Спасителя и сохраняет связь с традиционной новозаветной лексикой без малопонятной транслитерации «эпифания».
- source_word: σωτῆρος
  choice: Спасителя
  rationale: Устоявшаяся и точная передача христологического титула.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός здесь сохраняет силу титула после обозначения «нашего Спасителя»; «Мессия» передаёт значение греческого слова, тогда как вариант «Христос» указан в сноске.
- source_word: καταργήσαντος
  choice: упразднил
  rationale: Передаёт решительную победу над смертью, не уточняя сверх текста, что смерть уже совершенно перестала существовать.
- source_word: φωτίσαντος
  choice: явил свету
  rationale: Естественно передаёт образ выведения на свет, то есть раскрытия того, что прежде не было явлено.
- source_word: ζωὴν
  choice: жизнь
  rationale: Прямая передача слова с сохранением его спасительного и эсхатологического смысла без поясняющего расширения.
- source_word: ἀφθαρσίαν
  choice: нетление
  rationale: Точно выражает неподверженность тлению и органично звучит в паре со словом «жизнь»; более привычный вариант «бессмертие» сохранён в сноске.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: через Евангелие
  rationale: Сохраняет инструментальное значение διά и использует общепонятный, устоявшийся термин.
- source_word: μὲν ... δὲ
  choice: упразднил ... и ... явил
  rationale: Русская пара однородных сказуемых естественно передаёт сопоставление двух взаимодополняющих действий без тяжеловесной конструкции «с одной стороны… с другой стороны».
theological_decisions:
- issue: Значение Χριστοῦ в сочетании Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  alternative: Иисуса Христа
  rationale: В данном окружении титульный смысл остаётся заметным; сноска сохраняет традиционную передачу, при которой Χριστός функционирует как устойчивое именоподобное обозначение.
- issue: Сила καταργήσαντος применительно к смерти
  choice: упразднил смерть
  alternative: лишил смерть силы
  rationale: Формулировка сохраняет сильное утверждение текста о решительной победе, но сама по себе не разрешает напряжение между уже совершённым действием и продолжающимся присутствием смерти.
- issue: Значение ἀφθαρσίαν
  choice: нетление
  alternative: бессмертие
  rationale: «Нетление» точнее удерживает смысл неподверженности порче и распаду; распространённая смысловая альтернатива дана в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранена синтаксическая связь с предыдущим стихом посредством «она», относящегося к благодати; лексическое сближение «явлена — явление» отражает повторяющуюся образность исходного текста. Запятая в конце показывает продолжение предложения.
