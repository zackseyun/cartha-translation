base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/014.yaml
  text: Guard the good deposit through the Holy Spirit who dwells in us[a][b].
translation:
  language: ru
  text: Храни то доброе, что тебе доверено[a], через Святого Духа, живущего в нас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доброе, доверенное тебе на хранение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с помощью Святого Духа, обитающего в нас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν καλὴν παραθήκην
  choice: доброе вверенное тебе
  rationale: παραθήκη обозначает нечто переданное на хранение. Субстантивированное выражение «вверенное тебе» естественно по-русски передаёт смысл доверенного достояния, не уточняя его как «Евангелие» или «служение»; «доброе» непосредственно отражает καλὴν.
- source_word: φύλαξον
  choice: Храни
  rationale: Повелительная форма требует деятельно и бдительно оберегать доверенное. «Храни» звучит естественно и сохраняет образ принятого на хранение.
- source_word: διὰ πνεύματος ἁγίου
  choice: силой Святого Духа
  rationale: διά с родительным падежом выражает средство или посредничество. «Силой» ясно передаёт инструментальный смысл в современном русском, не превращая Духа лишь в безличное средство.
- source_word: τοῦ ἐνοικοῦντος ἐν ἡμῖν
  choice: живущего в нас
  rationale: Причастие настоящего времени обозначает продолжающееся пребывание. «Живущего в нас» понятно современному читателю и не вводит специальной богословской терминологии.
- source_word: ἐν ἡμῖν
  choice: в нас
  rationale: Сохраняется прямое значение греческого выражения и исходное местоимение без сужения круга подразумеваемых лиц.
theological_decisions:
- issue: Что обозначает «доброе вверенное тебе»
  choice: Референт оставлен неуточнённым.
  alternative: Евангельская весть, доверенная Тимофею; либо порученное ему служение.
  rationale: Контекст указывает на апостольское благовестие и доверенное достояние, однако сама греческая формулировка компактна и не называет референт прямо.
- issue: Значение διά в выражении о Святом Духе
  choice: 'Средство или действующая сила: «силой Святого Духа».'
  alternative: 'Посредничество или личная деятельность: «через Святого Духа».'
  rationale: Обе формулировки допустимы при διά с родительным. Основной текст делает инструментальный смысл ясным, а примечание сохраняет близкую к форме оригинала альтернативу.
- issue: Кого охватывает «нас»
  choice: Местоимение «нас» сохранено без пояснения.
  alternative: Павел и Тимофей в частности; либо верующие вообще.
  rationale: Текст не требует сужать или расширять круг лиц, поэтому богословская открытость оригинала сохраняется.
translation_notes:
  register: Современный литературный русский с достоинством библейского наставления. Выражение «вверенное тебе» понятно без архаизма «предание» и сохраняет метафору доверенной ценности; причастный оборот остаётся компактным.
