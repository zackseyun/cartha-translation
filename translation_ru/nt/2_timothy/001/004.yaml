lexical_decisions:
- source_word: ἐπιποθῶν
  choice: жаждая
  rationale: Причастие настоящего времени передаёт сильное личное желание. «Жаждая» сохраняет эмоциональную силу греческого слова и естественно звучит в современном литературном русском.
- source_word: σε ἰδεῖν
  choice: увидеть тебя
  rationale: Инфинитив прямо обозначает предмет желания; перевод сохраняет простую и естественную конструкцию оригинала.
- source_word: μεμνημένος
  choice: вспоминая
  rationale: Перфектное причастие указывает на сохраняющееся в памяти воспоминание; «вспоминая» естественно передаёт эту продолжающуюся мысль в русском контексте.
- source_word: σου τῶν δακρύων
  choice: твои слёзы
  rationale: Родительный оборот относится к слезам Тимофея. Прямой перевод не уточняет обстоятельства плача, которых текст не сообщает.
- source_word: ἵνα
  choice: чтобы
  rationale: Союз допускает оттенок цели или ожидаемого результата; русское «чтобы» сохраняет связь между встречей и полнотой радости, не устраняя эту смысловую гибкость.
- source_word: χαρᾶς
  choice: радости
  rationale: Родительный падеж при глаголе наполнения естественно передаётся русской конструкцией «исполниться радости».
- source_word: πληρωθῶ
  choice: исполниться
  rationale: Аорист пассивного залога в сослагательном наклонении передан инфинитивом после «чтобы». «Исполниться радости» — краткое, литературное и традиционно понятное выражение без идеи самореализации.
