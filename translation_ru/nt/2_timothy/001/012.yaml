source:
  edition: SBLGNT
  text: δι’ ἣν αἰτίαν καὶ ταῦτα πάσχω, ἀλλ’ οὐκ ἐπαισχύνομαι, οἶδα γὰρ ᾧ πεπίστευκα, καὶ πέπεισμαι ὅτι δυνατός ἐστιν τὴν παραθήκην μου φυλάξαι εἰς ἐκείνην τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/012.yaml
  text: For this reason I also suffer these things[a], but I am not ashamed, for I know whom I have believed[c][b], and I am convinced that he is able to guard my deposit until that day.
translation:
  language: ru
  text: По этой причине я и терплю всё это, но не стыжусь, потому что знаю, кому доверился[a], и убеждён, что он способен сохранить мой залог[b] до того дня[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Кого уверовал»; возможно также: «Кому поверил».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мой залог», то есть нечто, отданное на хранение. Речь может идти либо о том, что было вверено Павлу, либо о том, что Павел вверил Богу.'
    reason: alternative_reading
  - marker: c
    text: То есть до будущего дня окончательного Божьего суда и восстановления справедливости.
    reason: cross_reference
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: По этой причине
  rationale: Естественно передаёт причинную связь с предыдущим контекстом и сохраняет указательный характер выражения.
- source_word: καὶ ταῦτα πάσχω
  choice: я и терплю эти страдания
  rationale: «Терплю» передаёт продолжающееся страдание, а «эти страдания» естественно выражает ταῦτα, не конкретизируя их сверх текста.
- source_word: ἀλλ’ οὐκ ἐπαισχύνομαι
  choice: но не стыжусь
  rationale: Прямой и современный русский эквивалент, обозначающий отношение Павла к своим страданиям.
- source_word: οἶδα γὰρ ᾧ πεπίστευκα
  choice: потому что знаю, Кому доверился
  rationale: «Знаю» передаёт настоящее состояние знания; «доверился» естественно выражает личное упование, возможное при πιστεύω с дательным, и сохраняет личный объект без его явного именования.
- source_word: πέπεισμαι
  choice: убеждён
  rationale: Передаёт устойчивую, сложившуюся уверенность, выраженную греческим перфектом.
- source_word: δυνατός ἐστιν
  choice: Он способен
  rationale: Сохраняет акцент на способности подразумеваемого личного субъекта; прописная буква обозначает обычное русское местоименное указание на Бога, не добавляя имени в текст.
- source_word: τὴν παραθήκην μου
  choice: вверенное мне
  rationale: 'Передаёт образ ценности, отданной на хранение, и в основном тексте выбирает грамматически и контекстуально возможное понимание: доверенное Павлу. Иная направленность доверения отмечена в сноске.'
- source_word: φυλάξαι
  choice: сохранить
  rationale: В сочетании с вверенной ценностью «сохранить» звучит естественно и включает смысл охраны и сбережения.
- source_word: εἰς ἐκείνην τὴν ἡμέραν
  choice: до того дня
  rationale: Естественно передаёт направленность к будущему эсхатологическому дню, не раскрывая её в основном тексте.
theological_decisions:
- issue: Кого обозначают ᾧ и подразумеваемое подлежащее δυνατός ἐστιν
  choice: Личность не названа; сохранены «Кому» и «Он».
  alternative: Явно назвать Бога или Христа Иисуса.
  rationale: Греческий текст в этом предложении не называет референта, хотя контекст указывает на Бога, познанного во Христе. Перевод не уточняет больше оригинала.
- issue: Значение τὴν παραθήκην μου
  choice: «вверенное мне» с указанием другой трактовки в сноске.
  alternative: «то, что я вверил Ему» — жизнь, душу или окончательное спасение Павла.
  rationale: παραθήκη обозначает нечто переданное на хранение, а местоимение μου допускает спор о направлении вверения. Основная формулировка учитывает близкую параллель в 2 Тим 1:14, но сноска сохраняет реальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достойный. Синтаксис остаётся близким к греческой аргументации, но избегает неестественного калькирования. Все три примечания обозначены в основном тексте.
