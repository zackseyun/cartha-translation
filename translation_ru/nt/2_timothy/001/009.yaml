reference: 2 Timothy 1:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τοῦ σώσαντος ἡμᾶς καὶ καλέσαντος κλήσει ἁγίᾳ, οὐ κατὰ τὰ ἔργα ἡμῶν ἀλλὰ κατὰ ἰδίαν πρόθεσιν καὶ χάριν, τὴν δοθεῖσαν ἡμῖν ἐν Χριστῷ Ἰησοῦ πρὸ χρόνων αἰωνίων,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/009.yaml
  text: who saved us and called us with a holy calling[a], not according to our works but according to his own purpose and grace, which was given to us in Messiah Jesus before eternal ages[d][c][b],
translation:
  language: ru
  text: спасшего нас и призвавшего святым призванием[a] — не по нашим делам, а по Своему замыслу и благодати, данной нам в Иисусе Мессии[b] прежде вековых времён[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «призвавшего к святому призванию» либо «призвавшего посредством святого призвания». Греческий дательный допускает разные оттенки смысла.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционный вариант: «во Христе Иисусе». Здесь Χριστός передано как титул «Мессия».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «прежде вечных времён», «прежде начала веков»; по смыслу более свободно: «прежде начала времени».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σώσαντος
  choice: спасшего
  rationale: Аористное причастие от σῴζω; «спасшего» сохраняет прямой сотериологический смысл и синтаксическую связь с предшествующим упоминанием Бога.
- source_word: καλέσαντος
  choice: призвавшего
  rationale: Причастие параллельно σώσαντος; «призвавшего» естественно передаёт богословски значимый мотив Божьего призвания у Павла.
- source_word: κλήσει ἁγίᾳ
  choice: святым призванием
  rationale: Творительный падеж естественно воспроизводит греческий дательный, не вынуждая однозначно выбирать между значениями средства, образа действия и направленности призвания.
- source_word: οὐ κατὰ τὰ ἔργα ἡμῶν
  choice: не по нашим делам
  rationale: «Не по нашим делам» близко передаёт κατά с винительным как основание или мерило и сохраняет ключевой павловский термин «дела».
- source_word: ἰδίαν πρόθεσιν
  choice: Своему замыслу
  rationale: «Замысел» естественно и точно передаёт πρόθεσις как Божье намерение; возвратное «Своему» указывает на субъект, Бога, без добавления нового содержания.
- source_word: χάριν
  choice: благодати
  rationale: «Благодать» — укоренившийся и семантически ёмкий русский эквивалент χάρις в данном павловском контексте.
- source_word: τὴν δοθεῖσαν ἡμῖν
  choice: данной нам
  rationale: Женский род причастия показывает, что определение относится непосредственно к «благодати»; краткая конструкция сохраняет это согласование.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Иисусе Мессии
  rationale: Χριστός передан смысловым титулом «Мессия», а русская последовательность «Иисусе Мессии» звучит естественно и сохраняет титулярную функцию.
- source_word: πρὸ χρόνων αἰωνίων
  choice: прежде вековых времён
  rationale: Формулировка сохраняет необычное сочетание χρόνων αἰωνίων и его временную трансцендентность, оставаясь понятной в литературном русском языке.
theological_decisions:
- issue: Титул или имя в Χριστῷ Ἰησοῦ
  choice: в Иисусе Мессии
  alternative: во Христе Иисусе
  rationale: Перевод «Мессия» раскрывает значение Χριστός как титула и не сводит его к непрозрачной части имени.
- issue: Синтаксическая сила κλήσει ἁγίᾳ
  choice: святым призванием
  alternative: к святому призванию; посредством святого призвания
  rationale: Греческий дательный допускает несколько оттенков. Русский творительный сохраняет часть этой неоднозначности, не фиксируя исключительно цель или средство.
- issue: Смысл πρὸ χρόνων αἰωνίων
  choice: прежде вековых времён
  alternative: прежде начала времён; прежде вечных времён
  rationale: Выбранный вариант не превращает образное и несколько напряжённое греческое выражение в однозначное философское утверждение «до начала времени».
translation_notes:
  register: Современный литературный русский с достоинством библейского регистра. Сохранена причастная связь с контекстом стиха 8; тире облегчает длинную синтаксическую конструкцию. Прописная буква в «Своему» служит традиционной русской формой почтительного указания на Бога, не меняя смысла исходного текста.
