  source_fidelity: Перевод точно передаёт оба аористных причастия, отрицательное основание «не по нашим делам», противопоставление Божьему собственному замыслу и благодати, а также связь «данной нам» именно с «благодатью». «Святым призванием» удачно сохраняет допустимую в греческом дательном неоднозначность. «Прежде вековых времён» — несколько возвышенная, но понятная и близкая к греческой формула, не навязывающая более узкое истолкование «до начала времени».
