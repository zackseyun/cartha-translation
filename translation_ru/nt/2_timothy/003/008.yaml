  source_fidelity: 'Основной смысл передан точно: сравнительная конструкция, имена, противопоставление Моисею/истине и состояние умственной испорченности сохранены. Однако «не выдержавшие испытания в вере» несколько смещает περὶ τὴν πίστιν («относительно/в отношении веры») к сфере личной веры и делает испытание чрезмерно явным событием. ἀδόκιμοι обозначает не выдержавших проверки, непригодных или не одобренных в отношении веры.'
