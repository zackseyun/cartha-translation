  text: ὃν τρόπον δὲ Ἰάννης καὶ Ἰαμβρῆς ἀντέστησαν Μωϋσεῖ, οὕτως καὶ οὗτοι ἀνθίστανται τῇ ἀληθείᾳ, ἄνθρωποι κατεφθαρμένοι τὸν νοῦν, ἀδόκιμοι περὶ τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/008.yaml
  text: Just as Jannes and Jambres opposed Moses[a], so also these men oppose the truth—men corrupted in mind[b], disqualified regarding the faith.
translation:
  language: ru
  text: Как Ианний и Иамврий противились Моисею[a], так и эти люди противятся истине — люди с развращённым умом, несостоятельные в отношении веры[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воспротивились Моисею»; далее соответственно: «восстают против истины».'
    reason: lexical_alternative
  - marker: b
    text: «Вера» здесь, вероятно, означает христианскую веру или апостольскую весть, а не только личное доверие.
    reason: cross_reference
lexical_decisions:
- source_word: ὃν τρόπον δὲ
  choice: Как
  rationale: Сравнительный оборот естественно передаётся русским «как»; δέ здесь лишь слегка развивает мысль и не требует отдельного вводного слова.
- source_word: Ἰάννης καὶ Ἰαμβρῆς
  choice: Ианний и Иамврий
  rationale: Использованы традиционные русские формы имён, узнаваемые в библейской литературе.
- source_word: ἀντέστησαν / ἀνθίστανται
  choice: противились / противятся
  rationale: 'Сохраняется лексическая параллель и различие видовременных форм: прошлое действие в первом случае и продолжающееся противодействие во втором.'
- source_word: Μωϋσεῖ
  choice: Моисею
  rationale: Традиционная русская форма имени в дательном падеже при глаголе «противиться».
- source_word: οὕτως καὶ οὗτοι
  choice: так и эти люди
  rationale: Передаёт соотносительную конструкцию «как… так и» и ясно обозначает контекстуальных референтов.
- source_word: τῇ ἀληθείᾳ
  choice: истине
  rationale: Сохраняет широкое значение греческого выражения, не сужая его непосредственно до Евангелия или апостольского учения.
- source_word: ἄνθρωποι κατεφθαρμένοι τὸν νοῦν
  choice: люди с повреждённым умом
  rationale: Причастие совершенного вида описывает наступившее состояние; оборот естественно передаёт винительный отношения τὸν νοῦν.
- source_word: ἀδόκιμοι περὶ τὴν πίστιν
  choice: не выдержавшие испытания в вере
  rationale: ἀδόκιμοι буквально связано с испытанием и неодобрением; формулировка сохраняет образ проверки и допускает смысл непригодности или несостоятельности.
theological_decisions:
- issue: Значение «истины» и «веры»
  choice: Оставить широкие формулировки «истине» и «в вере».
  alternative: Уточнить как «истине Евангелия» и «христианской вере/апостольскому учению».
  rationale: Контекст указывает на христианскую весть и вероучение, однако сам греческий текст не даёт таких уточняющих слов; перевод сохраняет его ёмкость и напряжение.
- issue: Смысл ἀδόκιμοι применительно к вере
  choice: «не выдержавшие испытания в вере»
  alternative: «непригодные для веры», «несостоятельные в вере», «отвергнутые в отношении веры»
  rationale: Выбранный вариант передаёт оценочный смысл неуспешного испытания, не утверждая сверх текста, кем именно они отвергнуты или дисквалифицированы.
- issue: Передача ἄνθρωποι
  choice: «люди»
  alternative: «мужчины»
  rationale: Русское «люди» естественно обозначает упомянутых лжеучителей и не превращает грамматически мужскую форму в ненужное утверждение об их поле.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис разделён на два предложения ради ясности; повтор «люди» сохраняет пояснительную функцию ἄνθρωποι. Все сноски отмечены в основном тексте.
