  terminology: '«Истина» и «вера» сохранены без конфессионального сужения, что верно. «Ианний и Иамврий», «Моисею» и «противятся» уместны. Для ἀδόκιμοι предпочтительно «несостоятельные в отношении веры»: это сохраняет оценочный смысл без добавления конкретного образа отдельного испытания и не смешивает «веру» с субъективной верой.'
