  text: Τοῦτο δὲ γίνωσκε ὅτι ἐν ἐσχάταις ἡμέραις ἐνστήσονται καιροὶ χαλεποί·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/001.yaml
  text: 'But know this: in the last days difficult times will come[a].'
translation:
  language: ru
  text: 'Но знай: в последние дни наступят тяжёлые времена[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «опасные времена»; возможны также варианты «трудные времена» или «суровые времена». Греческое прилагательное может обозначать то, что трудно переносить, опасно или мучительно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: это (передано конструкцией «знай:» с последующим пояснением)
  rationale: Указательное местоимение предвосхищает содержание придаточной части с ὅτι. В современном русском двоеточие после «знай» естественно передаёт эту связь без обязательного отдельного «это».
- source_word: δὲ
  choice: Но
  rationale: Частица обозначает лёгкое противопоставление или переход от предыдущего контекста; «но» сохраняет этот поворот, не делая его чрезмерно резким.
- source_word: γίνωσκε
  choice: знай
  rationale: Форма настоящего времени повелительного наклонения, 2-е лицо единственного числа. «Знай» кратко и естественно выражает призыв осознавать указанную реальность.
- source_word: ὅτι
  choice: ':'
  rationale: Союз вводит содержание того, что Тимофею следует знать. В русском языке двоеточие после «знай» передаёт эту функцию естественнее, чем конструкция «знай, что» при сохранении начального указания.
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: в последние дни
  rationale: Сохранена устойчивая эсхатологическая формула без уточнения её временных границ.
- source_word: ἐνστήσονται
  choice: наступят
  rationale: Будущая форма ἐνίστημι здесь означает, что определённые периоды настанут или сделаются наличными. «Наступят» естественно сочетается со словом «времена».
- source_word: καιροὶ
  choice: времена
  rationale: καιρός обозначает период или пору, а не просто хронологическое время; множественное «времена» естественно передаёт это значение в данном сочетании.
- source_word: χαλεποί
  choice: тяжёлые
  rationale: Прилагательное может обозначать трудное, мучительное, опасное или суровое. «Тяжёлые» звучит естественно в современном русском и сохраняет широкую семантику, включая тягостность и суровость.
theological_decisions:
- issue: Значение выражения «последние дни»
  choice: Сохранить выражение «в последние дни», не ограничивая его только кратким периодом непосредственно перед возвращением Христа.
  alternative: Понимать его либо исключительно как заключительный период перед концом, либо шире — как уже начавшуюся эсхатологическую эпоху.
  rationale: Греческий текст не уточняет здесь временной объём выражения. Буквально-естественный перевод сохраняет богословскую напряжённость и не навязывает определённую эсхатологическую систему.
translation_notes:
  register: Современный литературный русский язык, краткий и достойный библейского регистра. Порядок слов естественен для русской речи; двоеточие сохраняет указание вперёд, выраженное Τοῦτο и ὅτι. Маркер сноски поставлен непосредственно после словосочетания, к которому относится.
