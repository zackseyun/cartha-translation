source:
  edition: SBLGNT
  text: πονηροὶ δὲ ἄνθρωποι καὶ γόητες προκόψουσιν ἐπὶ τὸ χεῖρον, πλανῶντες καὶ πλανώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/013.yaml
  text: But evil people and impostors will go on from bad to worse[b][a], deceiving and being deceived.
translation:
  language: ru
  text: А злые люди и обманщики[a] будут становиться всё хуже[b], обманывая других и сами подвергаясь обману.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «обманщики», также может означать «шарлатаны» и в некоторых контекстах иметь оттенок колдовства или знахарства.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «будут продвигаться к худшему».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ
  choice: злые
  rationale: Передаёт нравственную испорченность людей, а не просто их низкое качество или неумелость.
- source_word: δὲ
  choice: А
  rationale: Естественно выражает противопоставление предшествующему наставлению о Тимофее.
- source_word: ἄνθρωποι
  choice: люди
  rationale: Множественное число здесь имеет общий смысл и не ограничивает речь мужчинами.
- source_word: γόητες
  choice: обманщики
  rationale: Передаёт значение мошенников и вводящих в заблуждение людей, не утверждая без достаточного контекстуального основания, что речь именно о колдунах.
- source_word: προκόψουσιν ἐπὶ τὸ χεῖρον
  choice: будут становиться всё хуже
  rationale: Естественно по-русски передаёт ироническую идею продвижения в худшую сторону.
- source_word: πλανῶντες
  choice: обманывая других
  rationale: Передаёт продолжающееся активное действие; добавление «других» ясно обозначает объект, подразумеваемый формой глагола.
- source_word: πλανώμενοι
  choice: сами обманываясь
  rationale: 'Сохраняет пассивно-возвратный смысл: те, кто обманывает, одновременно сами находятся во власти обмана.'
theological_decisions:
- issue: Общий или исключительно мужской смысл ἄνθρωποι
  choice: люди
  alternative: мужчины
  rationale: Контекст говорит о людях определённого нравственного типа, а не специально о лицах мужского пола.
- issue: Смысл γόητες
  choice: обманщики
  alternative: шарлатаны; самозванцы; колдуны
  rationale: Слово может иметь оттенки шарлатанства, мошенничества и в некоторых контекстах магии, однако здесь центральна тема обмана; перевод не должен необоснованно усиливать оккультный оттенок.
- issue: Залог πλανώμενοι
  choice: сами обманываясь
  alternative: заблуждаясь
  rationale: Выбранный вариант сохраняет возможность внешнего источника обмана и не сводит форму к чисто внутренней ошибке.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и ясная, с сохранением контраста и параллелизма двух причастий. Маркер сноски поставлен непосредственно после выражения, поясняющего как направление ухудшения, так и многозначность γόητες.
