id: 2TI.3.14
reference: 2 Timothy 3:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: σὺ δὲ μένε ἐν οἷς ἔμαθες καὶ ἐπιστώθης, εἰδὼς παρὰ ⸀τίνων ἔμαθες,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/014.yaml
  text: But as for you[a], remain in what you learned and became convinced of, knowing from whom you learned it[b],
translation:
  language: ru
  text: А ты оставайся в том, чему научился и в чём утвердился[b], зная, от кого[a] ты этому научился.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «от кого» в единственном числе, то есть об одном человеке; это нередко понимают как указание на Павла. Принятое здесь множественное чтение может указывать шире — на учителей Тимофея.'
    reason: textual_variant
  - marker: b
    text: 'Или: «в чём удостоверился».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: А ты
  rationale: Явно выраженное местоимение подчёркивает противопоставление Тимофея людям, описанным выше; «А ты» естественно передаёт этот контраст по-русски.
- source_word: μένε
  choice: оставайся
  rationale: Настоящее повелительное наклонение призывает постоянно держаться усвоенного; «оставайся» также сохраняет образ, заданный сочетанием с ἐν.
- source_word: ἐν οἷς
  choice: в том, чему… и в чём…
  rationale: Единственное обобщающее «том» естественно передаёт греческое множественное относительное местоимение, обозначающее содержание учения; смена относительной формы обусловлена русским управлением глаголов.
- source_word: ἔμαθες
  choice: научился
  rationale: Аорист указывает на полученное прежде наставление; возвратный глагол в современном русском естественно выражает усвоение знания.
- source_word: ἐπιστώθης
  choice: утвердился
  rationale: Передаёт достижение уверенности и прочной убеждённости в усвоенном, не вводя менее вероятного значения «тебе было вверено».
- source_word: εἰδὼς
  choice: зная
  rationale: Деепричастие сохраняет компактность и не определяет чрезмерно точно обстоятельственный или причинный оттенок греческого причастия.
- source_word: παρὰ τίνων
  choice: от кого
  rationale: παρά с родительным обозначает источник; русская форма «от кого» естественна и не называет учителей, которых сам стих не уточняет.
- source_word: ἔμαθες
  choice: ты этому научился
  rationale: Повтор глагола сохранён, а местоимение «этому» ясно отсылает к содержанию наставления без добавления новой мысли.
theological_decisions:
- issue: Кого обозначает παρὰ τίνων
  choice: Не уточнять личности учителей; передать множественное чтение нейтральным «от кого».
  alternative: В некоторых рукописях стоит единственное число, которое нередко относят к Павлу.
  rationale: SBLGNT следует множественному чтению, а сам стих не называет учителей. Нейтральная передача сохраняет открытость ссылки и не сужает её до одного человека.
- issue: Значение ἐπιστώθης
  choice: «в чём утвердился» — внутренняя убеждённость в истинности усвоенного.
  alternative: «в чём был удостоверен»; менее вероятно — «что было тебе вверено».
  rationale: В паре с «научился» и при общем объекте речь, вероятнее всего, идёт об уверенности Тимофея в принятом учении, но лексическая альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Контрастное «А ты» и повелительное «оставайся» естественны для наставления; синтаксис сохраняет повтор «научился», значимый в греческом тексте.
