  source_fidelity: 'Русский текст точно передаёт смысл греческого оригинала: отрицание будущего продвижения (ἀλλ’ οὐ προκόψουσιν ἐπὶ πλεῖον), будущую явность их неразумия для всех и сопоставление с «теми людьми» из предыдущего стиха. Раскрытие эллипсиса повтором «безрассудство» оправдано и не добавляет нового смысла.'
