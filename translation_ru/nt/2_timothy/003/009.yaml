  terminology: «Безрассудство» адекватно передаёт ἄνοια как интеллектуально-нравственную несостоятельность, не навязывая узкой богословской интерпретации. «Тех людей» корректно сохраняет указательную отсылку ἐκείνων; сноска правомерно уточняет ближайший контекст — Ианния и Иамврия.
