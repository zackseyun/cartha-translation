id: 2TI.3.9
reference: 2 Timothy 3:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ προκόψουσιν ἐπὶ πλεῖον, ἡ γὰρ ἄνοια αὐτῶν ἔκδηλος ἔσται πᾶσιν, ὡς καὶ ἡ ἐκείνων ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/009.yaml
  text: But they will not advance any further[a], for their foolishness will be plain to everyone[b], as that of those men also became.
translation:
  language: ru
  text: Но дальше они не продвинутся[a], потому что их безрассудство станет очевидно всем, как стало очевидно и безрассудство тех людей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не достигнут большего успеха».'
    reason: lexical_alternative
  - marker: b
    text: То есть Ианния и Иамврия, упомянутых в предыдущем стихе.
    reason: cross_reference
lexical_decisions:
- source_word: προκόψουσιν
  choice: продвинутся
  rationale: Глагол означает «продвигаться, идти вперёд, преуспевать». В данном контексте «продвинутся» сохраняет образ движения вперёд, не придавая деятельности лжеучителей положительной оценки.
- source_word: ἐπὶ πλεῖον
  choice: дальше
  rationale: Оборот означает «дальше, в большей мере». Вместе с отрицанием естественно передаётся как «дальше не продвинутся».
- source_word: ἄνοια
  choice: безрассудство
  rationale: Слово обозначает отсутствие здравого понимания, неразумие или глупость. «Безрассудство» передаёт здесь одновременно интеллектуальную и нравственную несостоятельность.
- source_word: ἔκδηλος
  choice: очевидно
  rationale: Прилагательное означает «явный, очевидный». В русском именная конструкция «станет очевидно» естественно согласуется с дальнейшим повтором подразумеваемого слова.
- source_word: πᾶσιν
  choice: всем
  rationale: Дательный множественного числа прямо и естественно передаётся русским «всем», сохраняя широкий охват исходного выражения.
- source_word: ὡς καὶ ἡ ἐκείνων ἐγένετο
  choice: как стало очевидно и безрассудство тех людей
  rationale: В греческом предложении ἡ эллиптически указывает на ранее названное «безрассудство», а ἐκείνων — на упомянутых ранее людей. Повтор существительного устраняет неестественную для русского двусмысленность конструкции и сохраняет сравнение; «и» передаёт καί.
theological_decisions:
- issue: К кому относится ἐκείνων («тех людей»)
  choice: Сохранить в основном тексте указательное «тех людей», а в сноске связать его с Ианнием и Иамврием из предыдущего стиха.
  alternative: Понимать это как более общую отсылку к прежним лжеучителям.
  rationale: Ближайший контекст 2 Тим 3:8 прямо называет Ианния и Иамврия. Однако основной текст не подменяет местоименную отсылку именами, тем самым сохраняя форму и анафорическую связь оригинала.
translation_notes:
  register: 'Современный литературный русский язык с ясным, сдержанным и достойным звучанием. Порядок частей слегка перестроен ради естественности: «дальше» вынесено перед подлежащим. Эллипсис греческого текста раскрыт повтором слова «безрассудство», а указательное «тех людей» сохранено.'
