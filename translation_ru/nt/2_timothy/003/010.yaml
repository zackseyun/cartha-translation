id: 2TI.3.10
reference: 2 Timothy 3:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Σὺ δὲ ⸀παρηκολούθησάς μου τῇ διδασκαλίᾳ, τῇ ἀγωγῇ, τῇ προθέσει, τῇ πίστει, τῇ μακροθυμίᾳ, τῇ ἀγάπῃ, τῇ ὑπομονῇ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/010.yaml
  text: But you have closely followed my teaching[a], conduct, purpose, faith, patience, love, endurance,
translation:
  language: ru
  text: Ты же внимательно следовал моему учению, моему образу жизни, моей цели, вере[a], терпению, любви и стойкости,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верности». Греческое слово здесь может означать как веру, так и верность.'
    reason: alternative_reading
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Ты же
  rationale: Местоимение передаёт эмфатическое Σὺ, а частица «же» сохраняет противопоставление предшествующему описанию порочных людей.
- source_word: παρηκολούθησάς
  choice: внимательно следовал
  rationale: Глагол выражает близкое знакомство и последовательное следование; перевод сохраняет как внимательное наблюдение, так и практическое подражание, не сводя смысл лишь к одному из них.
- source_word: μου
  choice: моему / моей
  rationale: Притяжательное местоимение естественно связано с перечисляемыми сторонами учения и жизни Павла; в русском оно повторено там, где это помогает ясности и плавности.
- source_word: διδασκαλίᾳ
  choice: учению
  rationale: «Учение» — естественный и достаточно широкий современный эквивалент без излишне технического оттенка.
- source_word: ἀγωγῇ
  choice: образу жизни
  rationale: Словосочетание ясно передаёт манеру поведения и весь уклад жизни, подразумеваемые ἀγωγή.
- source_word: προθέσει
  choice: цели
  rationale: В контексте речь идёт об устойчивой жизненной направленности Павла; «цель» звучит естественно и ёмко.
- source_word: πίστει
  choice: вере
  rationale: Основной перевод сохраняет обычное значение πίστις — «вера»; возможное значение «верность» вынесено в примечание, поскольку контекст допускает оба понимания.
- source_word: μακροθυμίᾳ
  choice: терпению
  rationale: Слово обозначает терпеливое отношение, в том числе к людям и провокациям. «Терпение» понятно современному читателю и не архаично.
- source_word: ἀγάπῃ
  choice: любви
  rationale: Прямой и естественный эквивалент ἀγάπη в современном русском языке.
- source_word: ὑπομονῇ
  choice: стойкости
  rationale: «Стойкость» передаёт устойчивое перенесение испытаний и позволяет отличить ὑπομονή от уже названной μακροθυμία — «терпения».
theological_decisions:
- issue: Значение πίστις в перечне качеств Павла
  choice: вера
  alternative: верность
  rationale: В данном перечне πίστις может обозначать как веру и доверие Богу, так и верность, надёжность. Основной текст не отказывается от привычного значения «вера», а примечание сохраняет реальную смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достойным, но не архаичным звучанием. Повтор притяжательных форм ограничен первыми элементами перечня ради ясности; далее их отношение к Павлу естественно понимается из структуры фразы. Конечная запятая сохранена, поскольку стих продолжается в следующем предложении исходного текста.
