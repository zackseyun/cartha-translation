lexical_decisions:
- source_word: προδόται
  choice: предатели
  rationale: Слово обозначает тех, кто предаёт или вероломно поступает; «предатели» естественно и весомо звучит в перечне пороков.
- source_word: προπετεῖς
  choice: безрассудные
  rationale: Слово характеризует людей, действующих опрометчиво и необдуманно; «безрассудные» передаёт этот смысл современным литературным языком.
- source_word: τετυφωμένοι
  choice: надменные
  rationale: Перфектное страдательное причастие от τυφόομαι буквально связано с образом «раздутости», а по смыслу указывает на самомнение и гордость; естественное русское соответствие — «надменные».
- source_word: φιλήδονοι
  choice: любящие удовольствия
  rationale: Сложное прилагательное означает любовь к удовольствиям; причастная конструкция сохраняет параллель с последующим φιλόθεοι.
- source_word: μᾶλλον ἢ
  choice: больше, чем
  rationale: Сравнительная конструкция может обозначать превосходящую степень привязанности или предпочтение; «больше, чем» сохраняет сравнительный оттенок, не превращая его однозначно в полное взаимоисключение.
- source_word: φιλόθεοι
  choice: любящие Бога
  rationale: Сложное прилагательное означает любовь к Богу; в русском объект «Бога» после общего причастия позволяет избежать тяжеловесного повтора и сохраняет риторический контраст.
theological_decisions:
- issue: Передача противопоставления φιλήδονοι μᾶλλον ἢ φιλόθεοι
  choice: «любящие удовольствия больше, чем Бога»
  alternative: «любящие удовольствия, а не Бога»
  rationale: Греческое μᾶλλον ἢ допускает сравнительное прочтение «больше, чем» и выражает неверно расставленное предпочтение. Выбранный вариант сохраняет напряжение исходного текста и не усиливает его до безусловного отрицания всякой любви к Богу.
- issue: Передача образности τετυφωμένοι
  choice: «надменные» с буквальным пояснением в сноске
  alternative: «раздувшиеся от гордости»
  rationale: В основном тексте «надменные» звучит естественно и точно передаёт нравственный смысл, а сноска сохраняет метафору и результативный оттенок греческого перфекта.
translation_notes:
  register: Современный литературный русский язык; краткий ритм перечня пороков сохранён. Параллель двух греческих сложных прилагательных передана общей конструкцией «любящие удовольствия больше, чем Бога», чтобы избежать неестественного повтора при сохранении контраста.
