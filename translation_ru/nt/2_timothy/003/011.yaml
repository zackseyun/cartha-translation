  text: τοῖς διωγμοῖς, τοῖς παθήμασιν, οἷά μοι ἐγένετο ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις, οἵους διωγμοὺς ὑπήνεγκα· καὶ ἐκ πάντων με ἐρρύσατο ὁ κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/011.yaml
  text: the persecutions[a], the sufferings, such as happened to me in Antioch, in Iconium, in Lystra—what persecutions I endured[b]; and from them all the Lord rescued me.
translation:
  language: ru
  text: гонениям, страданиям, которые постигли меня в Антиохии, в Иконии, в Листре, — какие гонения я перенёс! И от всех них избавил меня Господь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вероятнее всего, здесь имеется в виду Господь Иисус, хотя в греческом тексте сказано только «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: διωγμοῖς / διωγμούς
  choice: гонениям / гонения
  rationale: «Гонения» естественно передаёт целенаправленное преследование и притеснение Павла из-за его служения; повтор существительного сохраняет риторическую структуру греческого текста.
- source_word: παθήμασιν
  choice: страданиям
  rationale: «Страдания» сохраняет широкий смысл πάθημα и не сводит пережитое только к внешним бедствиям.
- source_word: οἷά μοι ἐγένετο
  choice: которые постигли меня
  rationale: Такой оборот естественен по-русски и передаёт события, выпавшие на долю Павла, не уточняя их характер сверх сказанного в источнике.
- source_word: ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις
  choice: в Антиохии, в Иконии, в Листре
  rationale: Названия мест переданы в принятой русской библейской форме; повтор предлога сохраняет последовательность и ритм оригинала.
- source_word: οἵους διωγμοὺς ὑπήνεγκα
  choice: какие гонения я перенёс!
  rationale: «Какие» сохраняет качественно-восклицательную силу οἵους, а «перенёс» кратко и естественно передаёт стойкое претерпевание, выраженное ὑπήνεγκα.
- source_word: ἐκ πάντων
  choice: от всех них
  rationale: Местоимение ясно отсылает к перечисленным гонениям и страданиям; выражение естественно передаёт избавление от всех этих опасностей.
- source_word: ἐρρύσατο
  choice: избавил
  rationale: «Избавил» передаёт спасение из опасности и не сужает глагол до исключительно духовного спасения.
- source_word: ὁ κύριος
  choice: Господь
  rationale: Сохранён данный в греческом тексте титул без добавления имени и без преждевременного устранения неоднозначности его референта.
theological_decisions:
- issue: Кого обозначает «Господь»
  choice: В основном тексте оставить «Господь».
  alternative: «Господь Иисус»
  rationale: В контексте посланий Павла титул, вероятнее всего, относится к Иисусу, однако в греческом тексте стоит только ὁ κύριος. Перевод не добавляет отсутствующее имя, а пояснение сохраняет контекстуальную вероятность.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранена форма продолжения перечня из предыдущего стиха, повтор географического предлога и эмоциональное усиление во фразе «какие гонения я перенёс!». Союз «И» перед заключительной частью отражает καί, не сглаживая резкого перехода от пережитых гонений к избавлению.
