  yaml_path: translation/nt/2_timothy/003/016.yaml
  text: Every Scripture is God-breathed and profitable for teaching[a], for reproof, for correction[c][b], and for training in righteousness.
translation:
  language: ru
  text: Всё Писание[a] богодухновенно и полезно[b] для наставления, для обличения, для исправления и для воспитания в праведности[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всякое Писание». Греческое πᾶσα γραφή можно понимать собирательно («всё Писание») или распределительно («всякое Писание»).'
    reason: alternative_reading
  - marker: b
    text: 'Возможно и другое построение фразы: «Всякое богодухновенное Писание также полезно для наставления, для обличения, для исправления и для воспитания в праведности».'
    reason: alternative_reading
  - marker: c
    text: Греческое слово δικαιοσύνη в некоторых контекстах может означать также «справедливость»; здесь речь, вероятнее всего, идёт о формировании праведного образа жизни.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα γραφὴ
  choice: Всё Писание
  rationale: В данном контексте γραφή означает священное Писание, а не любой письменный текст. Сочетание без артикля допускает как собирательное понимание («всё Писание»), так и распределительное («каждое [место] Писания»); в основном тексте выбран наиболее естественный по-русски собирательный вариант, а неоднозначность отмечена в сноске.
- source_word: θεόπνευστος
  choice: богодухновенно
  rationale: Это ёмкое и укоренившееся русское соответствие, непосредственно передающее смысл сложного греческого слова — «от Бога / Божьим дыханием» — и не уточняющее механизм вдохновения.
- source_word: ὠφέλιμος
  choice: полезно
  rationale: Современное и точное обозначение того, что приносит пользу и служит перечисленным далее целям.
- source_word: πρὸς διδασκαλίαν
  choice: для наставления
  rationale: «Наставление» охватывает передачу учения и обучение, сохраняя естественный и достойный русский регистр без излишне узкого конфессионального оттенка слова «доктрина».
- source_word: ἐλεγμόν
  choice: для обличения
  rationale: «Обличение» передаёт выявление ошибки или вины и хорошо сочетается с последующим исправлением.
- source_word: ἐπανόρθωσιν
  choice: для исправления
  rationale: Слово обозначает приведение в правильное состояние, восстановление правильного порядка; «исправление» кратко и естественно передаёт этот смысл.
- source_word: παιδείαν τὴν ἐν δικαιοσύνῃ
  choice: для воспитания в праведности
  rationale: παιδεία здесь включает длительное формирование, обучение и дисциплину; «воспитание» естественно передаёт формирование праведного образа жизни.
- source_word: δικαιοσύνῃ
  choice: праведности
  rationale: В этом контексте речь идёт прежде всего о нравственном формировании и правильной жизни; «праведность» точнее «справедливости», хотя последняя возможна в иных контекстах употребления δικαιοσύνη.
theological_decisions:
- issue: Синтаксическая связь θεόπνευστος и ὠφέλιμος с πᾶσα γραφή
  choice: 'Оба прилагательных поняты как сказуемые: «Всё Писание богодухновенно и полезно».'
  alternative: «Всякое богодухновенное Писание также полезно…»
  rationale: Предикативное прочтение естественно воспринимает оба прилагательных как параллельные характеристики Писания и лучше согласуется с ходом мысли к следующему стиху. Грамматически возможное определительное прочтение сохранено в сноске, чтобы не устранять подлинную синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Термины «богодухновенно», «обличение» и «праведность» сохранены как точные и общеупотребительные в библейском контексте; синтаксис остаётся ясным для современного читателя.
