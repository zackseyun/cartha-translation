  text: которые всегда учатся, но никогда не могут прийти к познанию истины[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к полному познанию истины». Греческое слово может означать более полное или глубокое знание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε μανθάνοντα
  choice: всегда учатся
  rationale: Настоящее причастие передаёт продолжающееся, повторяющееся обучение; личная форма естественна в современном русском внутри придаточного определительного.
- source_word: καὶ μηδέποτε
  choice: но никак не
  rationale: В данном резком смысловом противопоставлении καί естественно передать противительным «но», а μηδέποτε — сочетанием «никак не», подчёркивающим неизменную неспособность достичь цели.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: к познанию истины
  rationale: Предлог εἰς обозначает направленность к достижению, а ἐπίγνωσις здесь допускает естественное русское «познание»; возможный оттенок полноты отмечен в сноске.
- source_word: ἐλθεῖν δυνάμενα
  choice: могут прийти
  rationale: Сохраняется образ прибытия к цели и значение способности; форма согласуется с женским множественным антецедентом предыдущего стиха через «которые».
theological_decisions:
- issue: Оттенок значения ἐπίγνωσις
  choice: познание
  alternative: полное познание
  rationale: Слово может подразумевать более полное или глубокое знание, однако контекст прежде всего противопоставляет постоянное обучение действительному достижению истины. Основной текст не усиливает значение без необходимости, а возможный оттенок сохраняется в сноске.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Начальное «которые» сохраняет синтаксическую связь с женщинами, упомянутыми в предыдущем стихе; запятая и «но» делают противопоставление естественным по-русски.
