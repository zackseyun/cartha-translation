lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно вводит целевое придаточное и сохраняет связь с предшествующим утверждением стиха 16.
- source_word: ἄρτιος
  choice: вполне пригоден
  rationale: Передаёт значение соответствия своему назначению, подготовленности и способности к служению, не создавая возможного впечатления нравственного безгрешия, которое могло бы возникнуть при переводе «совершенен».
- source_word: ὁ τοῦ θεοῦ ἄνθρωπος
  choice: Божий человек
  rationale: Сохраняет грамматически мужское число и устойчивое библейское обозначение; в данном контексте оно прежде всего может относиться к служителю Бога, но не исключает более широкого применения.
- source_word: πρὸς πᾶν ἔργον ἀγαθόν
  choice: ко всякому доброму делу
  rationale: «Ко» естественно выражает направленность и готовность, а «всякому» сохраняет распределительное значение πᾶν.
- source_word: ἐξηρτισμένος
  choice: подготовлен
  rationale: Перфектное пассивное причастие обозначает достигнутое состояние полной готовности или оснащённости; «подготовлен» ясно и естественно сочетается с «ко всякому доброму делу».
theological_decisions:
- issue: Гендерно маркированное выражение ὁ τοῦ θεοῦ ἄνθρωπος
  choice: Божий человек
  alternative: человек Бога / принадлежащий Богу человек
  rationale: Греческое выражение стоит в мужском роде и единственном числе и, вероятно, воспроизводит известное библейское наименование. Перевод сохраняет эту форму, не ограничивая применение текста только мужчинами.
- issue: Соотношение ἄρτιος и ἐξηρτισμένος
  choice: вполне пригоден, подготовлен
  alternative: совершенен, вполне подготовлен
  rationale: 'Два близких выражения сохранены раздельно: первое характеризует пригодность человека, второе — его состояние готовности. Это избегает как неоправданного учения о безгрешном совершенстве, так и потери смыслового усиления.'
translation_notes:
  register: Современный литературный русский язык с библейски узнаваемым выражением «Божий человек». Синтаксис краткий и достоинственный; «вполне пригоден» употреблено в значении полной подготовленности к назначению, а не безгрешного совершенства.
