source:
  edition: SBLGNT
  text: ἄστοργοι, ἄσπονδοι, διάβολοι, ἀκρατεῖς, ἀνήμεροι, ἀφιλάγαθοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/003.yaml
  text: without natural affection[a], irreconcilable, slanderous, without self-control, savage, without love for what is good[c][b],
translation:
  language: ru
  text: лишённые родственной любви, непримиримые[a], клеветники[b], не владеющие собой, жестокие, не любящие добра[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не желающие примирения»; возможно также: «нарушающие перемирие».'
    reason: lexical_alternative
  - marker: b
    text: Здесь греческое слово διάβολοι означает «клеветники», а не относится к дьяволу.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ненавидящие добро».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄστοργοι
  choice: лишённые родственной любви
  rationale: Слово обозначает отсутствие естественной привязанности, особенно ожидаемой между родными; перевод сохраняет семейный оттенок и остаётся понятным современному читателю.
- source_word: ἄσπονδοι
  choice: непримиримые
  rationale: Речь о людях, не желающих примиряться или соглашаться на мир; «непримиримые» естественно передаёт это значение, не сужая его до нарушения уже заключённого перемирия.
- source_word: διάβολοι
  choice: клеветники
  rationale: Во множественном числе и в перечне пороков слово обозначает людей, возводящих обвинения и клевету, а не дьявола; существительное хорошо согласуется с другими обозначениями людей в контексте.
- source_word: ἀκρατεῖς
  choice: не владеющие собой
  rationale: Передаёт отсутствие власти над собственными желаниями и порывами ясным современным языком.
- source_word: ἀνήμεροι
  choice: жестокие
  rationale: Слово описывает необузданных, свирепых, лишённых кротости людей; «жестокие» звучит естественно и достойно в современном русском перечне пороков.
- source_word: ἀφιλάγαθοι
  choice: не любящие добра
  rationale: Перевод сохраняет отрицательную, а не усиленную до активной ненависти, форму греческого сложного слова и его направленность на добро.
theological_decisions:
- issue: Значение διάβολοι в перечне пороков
  choice: «клеветники» — нарицательное обозначение порочного поведения
  alternative: «дьяволы» или «дьявольские»
  rationale: Форма множественного числа в данном синтаксическом окружении характеризует людей и их поведение. Перевод как «дьяволы» создал бы необоснованное представление об онтологическом или демоническом обозначении.
- issue: Степень отрицания в ἀφιλάγαθοι
  choice: «не любящие добра»
  alternative: «ненавидящие добро»
  rationale: Греческое слово непосредственно отрицает любовь к добру; более сильное понимание как активной ненависти возможно по смыслу, но не должно без необходимости подменять форму оригинала.
translation_notes:
  register: Современный литературный русский язык; краткий, ритмичный перечень нравственных характеристик. Причастные обороты использованы там, где однословный эквивалент был бы либо неточен, либо стилистически устарел. Все примечания отмечены в основном тексте.
