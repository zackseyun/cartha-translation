  text: καὶ ὅτι ἀπὸ βρέφους ⸀ἱερὰ γράμματα οἶδας, τὰ δυνάμενά σε σοφίσαι εἰς σωτηρίαν διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/015.yaml
  text: and that from infancy you have known the sacred writings[b][a], which are able to make you wise for salvation through faith in Messiah Jesus.
translation:
  language: ru
  text: и что ты с младенчества знаешь священные писания[a], которые могут умудрить тебя ко спасению через веру в Мессию Иисуса.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «священные письмена»; возможен также традиционный перевод: «Священное Писание». Греческое выражение буквально означает «священные письмена (писания)».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «через веру, которая в Мессии Иисусе».'
    reason: literal_syntactic_alternative
lexical_decisions:
- source_word: ἀπὸ βρέφους
  choice: с младенчества
  rationale: βρέφος обозначает совсем маленького ребёнка, даже младенца; «с младенчества» точно и естественно передаёт эту мысль.
- source_word: ἱερὰ γράμματα
  choice: священные писания
  rationale: Буквально — «священные письмена/писания». Строчная буква сохраняет нетехнический характер греческого выражения, при этом из контекста ясно, что речь идёт о почитаемых священных текстах.
- source_word: οἶδας
  choice: знаешь
  rationale: Хотя форма перфектная, οἶδα имеет настоящее значение; сочетание «с младенчества знаешь» естественно выражает знание, приобретённое давно и сохраняющееся теперь.
- source_word: τὰ δυνάμενά σε σοφίσαι
  choice: которые могут умудрить тебя
  rationale: Причастная конструкция относится к «писаниям»; «могут умудрить» прямо передаёт способность сообщить мудрость.
- source_word: εἰς σωτηρίαν
  choice: ко спасению
  rationale: εἰς выражает цель или направленность; «ко спасению» сохраняет этот оттенок и соответствует достоинству библейского регистра.
- source_word: διὰ πίστεως
  choice: через веру
  rationale: διά с родительным выражает средство; здесь πίστις естественнее всего означает веру человека.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Мессию Иисуса
  rationale: При существительном «вера» греческое ἐν указывает на объект и сферу веры; русское «в Мессию Иисуса» звучит естественно. Χριστός передан как титул «Мессия».
theological_decisions:
- issue: Χριστός как титул или традиционное имяобразное обозначение
  choice: Мессия Иисус
  alternative: Христос Иисус
  rationale: Χριστός сохраняет значение титула «Мессия»; перевод не сводит его к привычному, но менее прозрачному для современного читателя обозначению.
- issue: Значение πίστεως τῆς ἐν Χριστῷ Ἰησοῦ
  choice: через веру в Мессию Иисуса
  alternative: через верность Мессии Иисуса
  rationale: В данной конструкции наиболее естественна субъектная вера, направленная на Мессию Иисуса. Менее вероятное понимание как верности самого Мессии сохранено в примечании.
- issue: Статус ἱερὰ γράμματα
  choice: священные писания
  alternative: Священное Писание
  rationale: Греческое выражение стоит без артикля и буквально обозначает священные письменные тексты; перевод избегает без необходимости превращать его в позднейший технический термин.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранена синтаксическая связь с предшествующим контекстом посредством начального «и что». Формулировки понятны современному читателю без конфессионально специфической терминологии.
