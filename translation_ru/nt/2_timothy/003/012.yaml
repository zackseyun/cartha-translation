source:
  edition: SBLGNT
  text: καὶ πάντες δὲ οἱ θέλοντες ⸂ζῆν εὐσεβῶς⸃ ἐν Χριστῷ Ἰησοῦ διωχθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/012.yaml
  text: And indeed[a], all who want to live godly in Messiah Jesus will be persecuted.
translation:
  language: ru
  text: Да и все, кто хочет жить благочестиво в Мессии Иисусе[a], будут гонимы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во Христе Иисусе».'
    reason: Традиционная русская передача титула Χριστός; она сохраняет привычную форму, тогда как основной текст раскрывает значение титула как «Мессия».
lexical_decisions:
- source_word: καὶ … δὲ
  choice: Да и
  rationale: Сочетание связывает стих с предыдущей мыслью и одновременно придаёт утверждению подтверждающий оттенок; «да и» естественно передаёт обе функции без сильного противопоставления.
- source_word: πάντες οἱ θέλοντες
  choice: все, кто хочет
  rationale: Артикль с причастием образует обозначение группы людей; формулировка сохраняет всеобщий охват πάντες и волевой смысл θέλω.
- source_word: ζῆν εὐσεβῶς
  choice: жить благочестиво
  rationale: Наречие εὐσεβῶς описывает жизнь, посвящённую Богу и согласную с почитанием Его; «благочестиво» точно и уместно в современном литературном русском.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  rationale: Предлог ἐν указывает на сферу жизни и единение с Иисусом; Χριστός здесь сохраняет силу титула, поэтому передано как «Мессия», а не истолковано как часть имени.
- source_word: διωχθήσονται
  choice: будут гонимы
  rationale: Будущее страдательного залога прямо выражает неизбежность враждебного преследования; «будут гонимы» кратко, точно и достойно по регистру.
theological_decisions:
- issue: Передача Χριστός как титула или как традиционной именной формы
  choice: Мессия Иисус
  alternative: Христос Иисус
  rationale: В данном сочетании Χριστός можно слышать как титул Помазанника. Основной текст делает этот смысл явным, а традиционная форма сохранена в сноске, поскольку в русском христианском употреблении она широко известна и также лексически допустима.
- issue: Смысл ἐν Χριστῷ Ἰησοῦ
  choice: сохранена формула «в Мессии Иисусе» без поясняющей парафразы
  alternative: в единении с Мессией Иисусом
  rationale: Греческое ἐν допускает оттенки сферы, принадлежности и единения. Буквенная предложная конструкция сохраняет эту богословскую многозначность, не сводя её к одному толкованию.
translation_notes:
  register: Современный литературный русский с кратким, торжественно-нейтральным синтаксисом. «Да и» передаёт связующе-подтверждающий характер καὶ … δὲ; «будут гонимы» сохраняет библейскую выразительность, оставаясь понятным современному читателю.
