source:
  edition: SBLGNT
  text: ἐκ τούτων γάρ εἰσιν οἱ ἐνδύνοντες εἰς τὰς οἰκίας καὶ ⸀αἰχμαλωτίζοντες γυναικάρια σεσωρευμένα ἁμαρτίαις, ἀγόμενα ἐπιθυμίαις ποικίλαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/006.yaml
  text: For among these are those who slip into households and capture little women burdened with sins[a], led along by various desires[c][b],
translation:
  language: ru
  text: К их числу принадлежат те, кто вкрадывается в дома и пленяет[a] слабых женщин[b], обременённых грехами[c] и увлекаемых всевозможными желаниями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также: «захватывает в плен»; греческий глагол содержит образ пленения.'
    reason: lexical_alternative
  - marker: b
    text: В греческом употреблено уменьшительное слово с пренебрежительным оттенком; речь в контексте идёт об уязвимых женщинах, а не о женщинах вообще.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «нагруженных грехами»; форма слова указывает на накопившееся бремя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτων
  choice: к их числу принадлежат
  rationale: Оборот указывает, что названные далее люди входят в ранее описанную группу; такая формулировка естественна по-русски и сохраняет эту связь.
- source_word: ἐνδύνοντες εἰς τὰς οἰκίας
  choice: вкрадывается в дома
  rationale: «Вкрадывается» передаёт скрытное, вкрадчивое проникновение, выраженное глаголом; «дома» сохраняет прямое значение οἰκίας и подразумеваемую домашнюю среду.
- source_word: αἰχμαλωτίζοντες
  choice: пленяет
  rationale: Сохраняется образ захвата в плен и подчинения, присущий греческому глаголу.
- source_word: γυναικάρια
  choice: слабых женщин
  rationale: Контекстуально передаёт уничижительное обозначение уязвимой группы женщин, не распространяя характеристику на женщин вообще; буквальный уменьшительно-пренебрежительный оттенок пояснён в сноске.
- source_word: σεσωρευμένα ἁμαρτίαις
  choice: обременённых грехами
  rationale: Передаёт накопившееся состояние и образ тяжести множества грехов, выраженные перфектным страдательным причастием.
- source_word: ἀγόμενα ἐπιθυμίαις ποικίλαις
  choice: увлекаемых всевозможными желаниями
  rationale: Страдательная форма сохранена, а «увлекаемых» естественно выражает подчинённость направляющему воздействию желаний; «всевозможными» передаёт ποικίλαις без излишнего уточнения их природы.
theological_decisions:
- issue: Уничижительный характер γυναικάρια
  choice: слабых женщин
  alternative: женщинок; легковерных женщин
  rationale: Перевод обозначает нравственно и духовно уязвимую группу в данном контексте, но не превращает высказывание в обобщение обо всех женщинах. Сноска сохраняет формальную особенность греческого слова.
- issue: Образ пленения в αἰχμαλωτίζοντες
  choice: пленяет
  alternative: подчиняет; захватывает в плен
  rationale: «Пленяет» сохраняет метафору захвата пленников и господства над ними, не сводя смысл к одному лишь убеждению или обольщению.
- issue: Смысл ἐπιθυμίαις
  choice: желаниями
  alternative: страстями; вожделениями
  rationale: Греческое слово допускает широкий спектр желаний и в данном окружении имеет отрицательную окраску. Нейтральное по словарному объёму «желаниями» позволяет контексту создать эту оценку, не сужая смысл до сексуального вожделения.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким, но общедоступным библейским регистром. Причастные конструкции сохраняют плотность и параллелизм греческой фразы; лексика не архаична. Запятая исходного фрагмента заменена точкой, поскольку стих представляет завершённое русское предложение.
