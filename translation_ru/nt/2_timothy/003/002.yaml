  text: ἔσονται γὰρ οἱ ἄνθρωποι φίλαυτοι, φιλάργυροι, ἀλαζόνες, ὑπερήφανοι, βλάσφημοι, γονεῦσιν ἀπειθεῖς, ἀχάριστοι, ἀνόσιοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/002.yaml
  text: For people will be lovers of self[a], lovers of money, boastful, arrogant, slanderous, disobedient to parents, ungrateful, unholy,
translation:
  language: ru
  text: Ведь люди будут любящими себя, любящими деньги, хвастливыми, надменными, злословящими[a], непослушными родителям, неблагодарными, нечестивыми,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «клеветниками», «богохульниками» или «оскорбляющими других». Греческое слово может обозначать речь, бесчестящую как людей, так и Бога.'
    reason: 'Лексическая неоднозначность βλάσφημοι: объект злословия в данном перечне прямо не указан.'
lexical_decisions:
- source_word: ἔσονται
  choice: будут
  rationale: Форма будущего времени глагола εἰμί; «будут» естественно передаёт связочное значение и согласуется с продолжением перечня.
- source_word: γὰρ
  choice: ведь
  rationale: Союз вводит объяснение предшествующего утверждения; «ведь» естественно сохраняет эту связь в современном русском.
- source_word: οἱ ἄνθρωποι
  choice: люди
  rationale: Грамматически мужской род здесь имеет обобщённое значение и относится к людям вообще, а не только к мужчинам.
- source_word: φίλαυτοι
  choice: самолюбивыми
  rationale: Передаёт порочную сосредоточенность любви на себе и сохраняет краткий ритм перечня.
- source_word: φιλάργυροι
  choice: сребролюбивыми
  rationale: Точно передаёт любовь к деньгам и сохраняет словесную параллель с «самолюбивыми»; слово понятно в возвышенном современном религиозном регистре.
- source_word: ἀλαζόνες
  choice: хвастливыми
  rationale: Обозначает людей, склонных выставлять себя напоказ и похваляться; прилагательное естественно вписывается в перечень.
- source_word: ὑπερήφανοι
  choice: надменными
  rationale: Передаёт отрицательный смысл высокомерия яснее, чем потенциально нейтральное «гордыми».
- source_word: βλάσφημοι
  choice: злоречивыми
  rationale: Греческое слово обозначает оскорбительную, порочащую речь как против людей, так и против Бога. «Злоречивыми» сохраняет широту значения; возможные конкретизации указаны в сноске.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: непокорными родителям
  rationale: Естественно передаёт отказ слушаться родителей; дательный падеж сохранён русским управлением.
- source_word: ἀχάριστοι
  choice: неблагодарными
  rationale: Прямой и ясный современный эквивалент отсутствия благодарности.
- source_word: ἀνόσιοι
  choice: нечестивыми
  rationale: Передаёт отсутствие должного почтения к святому и нравственно-религиозную порочность, не сводя значение только к внешней непочтительности.
theological_decisions:
- issue: Обобщённое значение οἱ ἄνθρωποι
  choice: люди
  alternative: мужчины; человеческие существа
  rationale: Контекст не ограничивает описание мужчинами; «люди» естественно передаёт общий охват.
- issue: Смысл βλάσφημοι в перечне пороков
  choice: злоречивыми
  alternative: клеветниками; богохульниками; оскорбляющими других
  rationale: Исходное слово может относиться к речи, бесчестящей как людей, так и Бога. Основной вариант сохраняет эту неоднозначность, а сноска раскрывает диапазон.
translation_notes:
  register: Современный литературный русский с кратким, ритмичным рядом прилагательных. «Сребролюбивыми» и «нечестивыми» сохраняют достойный библейский регистр, оставаясь понятными обычному читателю. Маркер сноски помещён при «злоречивыми», к которому относится лексическая альтернатива.
