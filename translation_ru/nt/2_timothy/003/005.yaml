lexical_decisions:
- source_word: ἔχοντες
  choice: у которых есть
  rationale: Причастие продолжает характеристику людей из предыдущего контекста; относительная конструкция естественна по-русски и сохраняет связь с ними.
- source_word: μόρφωσιν
  choice: вид
  rationale: Слово обозначает форму или внешнее выражение; «вид» естественно передаёт внешнюю сторону и сохраняет противопоставление силе.
- source_word: εὐσεβείας
  choice: благочестия
  rationale: В Пастырских посланиях слово обозначает почтительную к Богу жизнь; «благочестие» является точным и достойным русским соответствием.
- source_word: τὴν δὲ δύναμιν αὐτῆς
  choice: но силы его
  rationale: Сохранены противительный союз, понятие действенной силы и местоименная связь с благочестием без уточнения природы этой силы.
- source_word: ἠρνημένοι
  choice: они отреклись
  rationale: Перфектное причастие выражает сложившуюся вследствие прежнего отказа позицию; личная форма естественна по-русски и передаёт результативность.
- source_word: καὶ τούτους ἀποτρέπου
  choice: От таких отворачивайся
  rationale: Возвратный императив передаёт призыв самому держаться в стороне; «от таких» ясно отсылает к описанным людям.
theological_decisions:
- issue: Противопоставление внешнего благочестия и его действенной реальности
  choice: «вид благочестия, но силы его они отреклись»
  alternative: «обличье благочестия, но отвергают его силу»
  rationale: Перевод сохраняет широкое значение «силы», не сводя её исключительно к чудесам, нравственному преображению или действию Святого Духа.
translation_notes:
  register: Современный литературный русский язык с библейской торжественностью; синтаксис сделан естественным, а богословская многозначность слова «сила» сохранена.
