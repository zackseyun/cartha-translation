    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: речь
  rationale: В контексте ложного учения и пустых разговоров речь идёт о высказываниях и учении этих людей, а не об одном отдельном слове. «Речь» сохраняет широту греческого слова и естественно звучит по-русски.
- source_word: αὐτῶν
  choice: их
  rationale: Прямо передаёт притяжательный родительный падеж.
- source_word: ὡς γάγγραινα
  choice: словно гангрена
  rationale: «Гангрена» — точное название разрушительного заболевания, лежащего в основе метафоры; «словно» ясно обозначает сравнение.
- source_word: νομὴν ἕξει
  choice: будет распространяться
  rationale: Буквально выражение означает, что нечто «получит простор/ход»; в сочетании с образом гангрены оно передаёт разрушительное распространение. Выбранный вариант естественен и не перегружает текст пояснением.
- source_word: ὧν ἐστιν
  choice: К ним относятся
  rationale: 'Естественно передаёт частичный смысл конструкции: названные люди принадлежат к только что упомянутой группе.'
- source_word: Ὑμέναιος
  choice: Именей
  rationale: Традиционная и узнаваемая русская форма греческого личного имени.
- source_word: Φίλητος
  choice: Филит
  rationale: Традиционная и узнаваемая русская форма греческого личного имени.
theological_decisions:
- issue: Смысл метафоры болезни
  choice: Ложная речь изображена как разрушительно распространяющаяся гангрена.
  alternative: 'Передать идиому более буквально: «будет иметь простор» или «получит ход».'
  rationale: Так сохраняются медицинский образ и предупреждение о пагубном распространении учения, но текст не уточняет сверх сказанного, каким именно образом оно воздействует на общину.
translation_notes:
  register: Современный литературный русский язык с ясной, но сохраняющей достоинство формулировкой. Единственное число «речь» сохраняет грамматическую форму греческого λόγος; имена даны в традиционных русских библейских формах.
