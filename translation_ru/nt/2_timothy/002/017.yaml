base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/017.yaml
  text: and their talk will spread like gangrene[a]. Among them are Hymenaeus and Philetus[b],
translation:
  language: ru
  text: И их речь[a] будет распространяться[b], как гангрена. Среди них — Именей и Филит.
  philosophy: optimal-equivalence
  footnotes:
