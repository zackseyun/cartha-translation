  text: οὐδεὶς στρατευόμενος ἐμπλέκεται ταῖς τοῦ βίου πραγματείαις, ἵνα τῷ στρατολογήσαντι ἀρέσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/004.yaml
  text: No one serving as a soldier gets entangled in the affairs of ordinary life[a], so that he may please the one who enlisted him.
translation:
  language: ru
  text: Никто, находясь на военной службе, не связывает себя делами повседневной жизни, чтобы угодить тому, кто призвал его на службу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδεὶς
  choice: Никто
  rationale: Отрицательное неопределённое местоимение передано естественным русским соответствием, сохраняющим всеобщий характер утверждения.
- source_word: στρατευόμενος
  choice: находясь на военной службе
  rationale: Причастие настоящего времени обозначает продолжающееся несение военной службы; формулировка сохраняет военный образ и естественно звучит по-русски.
- source_word: ἐμπλέκεται
  choice: не запутывается
  rationale: Глагол выражает вовлечение, которое связывает и мешает свободно действовать; «запутывается» сохраняет образную силу исходного слова.
- source_word: ταῖς τοῦ βίου πραγματείαις
  choice: в делах житейских
  rationale: πραγματείαι обозначает дела, занятия или деловые заботы, а βίος — повседневную земную жизнь и средства к существованию. Формулировка кратка, понятна и сохраняет контраст с военной службой.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно передаёт целевое значение союза.
- source_word: τῷ στρατολογήσαντι
  choice: тому, кто призвал его на службу
  rationale: Причастие от στρατολογέω означает того, кто набрал или зачислил человека на военную службу. Перевод не вводит отсутствующего в тексте конкретного воинского звания.
- source_word: ἀρέσῃ
  choice: угодить
  rationale: Инфинитив после «чтобы» естественно передаёт цель, выраженную аористом сослагательного наклонения.
theological_decisions:
- issue: Границы военной метафоры
  choice: Сохранить прямой образ воина, не позволяющего житейским делам связать себя, чтобы угодить призвавшему его на службу.
  alternative: Истолковать выражение непосредственно как наставление о приоритетах церковного служения.
  rationale: Исходный текст выражает наставление через военную метафору; перевод сохраняет сам образ и не подменяет его богословским применением.
- issue: Значение выражения τοῦ βίου πραγματείαις
  choice: «в делах житейских»
  alternative: «в гражданских занятиях»
  rationale: Первый вариант ближе сохраняет широту слов «дела/занятия жизни», тогда как второй яснее подчёркивает военный контраст, но несколько усиливает толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Военная метафора сохранена; синтаксис сделан естественным для современного читателя без конфессионально окрашенных уточнений.
