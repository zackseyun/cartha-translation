    text: 'Или: «тех, кто выступает против него». В греческом тексте объект противодействия прямо не назван; контекст может указывать на слугу Господа и его учение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в надежде, что Бог даст им покаяние». Греческий оборот выражает осторожную возможность или надежду.'
