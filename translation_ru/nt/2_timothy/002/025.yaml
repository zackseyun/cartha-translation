lexical_decisions:
- source_word: ἐν πραΰτητι
  choice: с кротостью
  rationale: Оборот обозначает образ действия. «С кротостью» естественно и точно передаёт мягкость и самообладание, не подразумевая слабости.
- source_word: παιδεύοντα
  choice: исправлять
  rationale: В данном контексте глагол означает наставление, направленное на исправление заблуждающихся, а не карательное наказание.
- source_word: τοὺς ἀντιδιατιθεμένους
  choice: тех, кто противится
  rationale: Причастие обозначает людей, занимающих противную позицию. Греческий текст не называет объект противодействия, поэтому он не добавлен в основной текст.
- source_word: μήποτε δώῃ αὐτοῖς ὁ θεὸς
  choice: не дарует ли им Бог
  rationale: Вопросительная русская конструкция естественно сохраняет осторожную надежду и неопределённость, выраженные μήποτε с сослагательным наклонением, а «дарует» уместно передаёт δίδωμι в этом контексте.
- source_word: μετάνοιαν
  choice: покаяние
  rationale: «Покаяние» — устоявшийся и точный русский эквивалент, включающий перемену внутренней направленности, а не только интеллектуальную перемену мнения.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: ведущее к познанию истины
  rationale: εἰς выражает цель или результат, а ἐπίγνωσις — достижение подлинного распознания и знания истины.
theological_decisions:
- issue: Божественное действие и человеческое покаяние
  choice: Сохранено прямое указание на Бога как на Того, кто может даровать покаяние, вместе с выраженной в μήποτε неопределённостью.
  alternative: Передать фразу либо как безусловное действие Бога, либо так, чтобы покаяние выглядело исключительно человеческим достижением.
  rationale: Греческий текст связывает дарование покаяния с Богом, но не объясняет здесь соотношение Божьего действия и человеческой ответственности; перевод не разрешает эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формулировка сохраняет синтаксическую связь с повелением предыдущего стиха и потому начинается со строчной буквы.
