  text: 'The saying is trustworthy: for if we died with him[c][b][a], we will also live with him.'
translation:
  language: ru
  text: 'Верно это слово[a]: ведь если мы умерли вместе с Ним[b], то вместе с Ним и будем жить[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Верно это изречение»; возможны также переводы: «Это слово заслуживает доверия» или «Это утверждение достоверно».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «если мы вместе умерли»; греческий сложный глагол выражает совместную смерть со Христом.'
    reason: lexical_alternative
  - marker: c
    text: Будущее «будем жить вместе с Ним» может указывать на жизнь со Христом после воскресения, на участие в Его жизни или на оба смысла.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: верно
  rationale: Предикативное прилагательное характеризует λόγος как истинное и заслуживающее доверия; краткая формула «верно это слово» естественна для современного литературного русского языка.
- source_word: ὁ λόγος
  choice: это слово
  rationale: В пастырских посланиях сочетание πιστὸς ὁ λόγος служит формулой, указывающей на достоверное изречение. «Слово» сохраняет традиционную широту λόγος, не сводя его непременно к пословице или цитате.
- source_word: εἰ γὰρ
  choice: ведь если
  rationale: «Если» передаёт условие εἰ, а «ведь» — пояснительную силу γάρ и естественно связывает формулу с последующим высказыванием.
- source_word: συναπεθάνομεν
  choice: мы умерли вместе с Ним
  rationale: Аорист передан прошедшим временем; приставка συν- выражает совместность. Местоимение восполняет подразумеваемого участника — Христа — из контекста.
- source_word: καὶ
  choice: и
  rationale: В конструкции «то вместе с Ним и будем жить» частица «и» естественно выражает соответствие второй части первой и передаёт присоединительное значение καί.
- source_word: συζήσομεν
  choice: вместе с Ним и будем жить
  rationale: Будущее время сохранено, а συν- передано сочетанием «вместе с Ним». Формулировка не уточняет сверх текста характер этой жизни.
theological_decisions:
- issue: Подразумеваемый участник в глаголах с συν-
  choice: В обоих случаях явно передать «вместе с Ним», имея в виду Христа.
  alternative: 'Оставить совместность или её участника невыраженными: «если мы умерли, то и будем жить».'
  rationale: Хотя отдельного дополнения в греческом тексте нет, оба сложных глагола выражают совместное участие, а христоцентричный контекст указывает на Христа. В русском явное «с Ним» делает смысл понятным, не вводя нового богословского утверждения.
- issue: Временной и богословский охват жизни со Христом
  choice: Сохранить широкую формулировку «будем жить», не определяя, идёт ли речь только о будущем воскресении, об участии в жизни Христа или об обоих аспектах.
  alternative: Однозначно истолковать как будущую жизнь после воскресения либо как нынешнюю духовную жизнь.
  rationale: Форма будущего времени поддерживает будущую направленность, но сама строка не раскрывает характер жизни. Перевод сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с кратким, ритмически уравновешенным построением. Заглавное «Ним» употреблено как почтительное указание на Христа. Маркер [a] поставлен после всей формулы «Верно это слово», [b] — непосредственно при первом глаголе совместного действия, [c] — при утверждении о будущей жизни.
