id: 2TI.2.20
reference: 2 Timothy 2:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐν μεγάλῃ δὲ οἰκίᾳ οὐκ ἔστιν μόνον σκεύη χρυσᾶ καὶ ἀργυρᾶ ἀλλὰ καὶ ξύλινα καὶ ὀστράκινα, καὶ ἃ μὲν εἰς τιμὴν ἃ δὲ εἰς ἀτιμίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/020.yaml
  text: In a large house there are not only gold and silver vessels[a], but also wooden and earthenware ones, and some are for honor[b], but others for dishonor.
translation:
  language: ru
  text: 'В большом же доме есть сосуды не только золотые и серебряные, но и деревянные и глиняные[a]: одни — для чести, а другие — для бесчестия[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть сделанные из обожжённой глины.
    reason: cultural_note
  - marker: b
    text: 'Или: «одни — для почётного употребления, а другие — для непочётного». Буквально: «для чести… для бесчестия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ οἰκίᾳ
  choice: в большом доме
  rationale: Прилагательное μέγας здесь естественно передаётся как указание на размер дома; «большой дом» сохраняет образ и не вносит значения величия или знатности.
- source_word: δὲ
  choice: же
  rationale: Частица «же» мягко передаёт связующий и слегка контрастный характер δέ, не превращая его в выраженный временной переход.
- source_word: σκεύη
  choice: сосуды
  rationale: «Сосуды» сохраняет широкий предметный и метафорический смысл σκεύη и подходит к перечислению материалов лучше, чем более узкие «посуда» или «утварь».
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  choice: золотые и серебряные
  rationale: Прилагательные обозначают материал, из которого сделаны сосуды; такое выражение естественно по-русски.
- source_word: ξύλινα καὶ ὀστράκινα
  choice: деревянные и глиняные
  rationale: ὀστράκινος обозначает сделанное из обожжённой глины. «Глиняные» точно и понятно современному читателю.
- source_word: ἃ μὲν ... ἃ δὲ ...
  choice: одни ... а другие ...
  rationale: Русская соотносительная конструкция ясно сохраняет противопоставление μέν…δέ.
- source_word: εἰς τιμήν ... εἰς ἀτιμίαν
  choice: для чести ... для бесчестия
  rationale: Буквальная пара сохраняет абстрактные существительные и намеренно не сводит образ только к практическому различию видов употребления.
theological_decisions:
- issue: Следует ли истолковывать τιμή и ἀτιμία как виды употребления сосудов или сохранять значения чести и бесчестия
  choice: для чести ... для бесчестия
  alternative: для почётного употребления ... для непочётного употребления
  rationale: Греческий текст использует абстрактные существительные «честь» и «бесчестие». Их сохранение не снимает риторическую и богословскую напряжённость образа перед следующим стихом.
translation_notes:
  register: Современный литературный русский язык с ясной, но достойной библейской ритмикой. Частица «же» сохраняет связь с предшествующим рассуждением; двоеточие делает перечисление и его смысловое разделение естественными для русского читателя.
