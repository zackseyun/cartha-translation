  text: καὶ ἃ ἤκουσας παρ’ ἐμοῦ διὰ πολλῶν μαρτύρων, ταῦτα παράθου πιστοῖς ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/002.yaml
  text: And what you heard from me in the presence of many witnesses[a], entrust these things to faithful men[b], who will be competent to teach others also.
translation:
  language: ru
  text: И то, что ты слышал от меня в присутствии многих свидетелей[a], доверь верным людям[b], которые будут способны учить и других.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед многими свидетелями»; возможно также: «через многих свидетелей». Греческий оборот допускает эти понимания, но вероятнее всего речь идёт о наставлении, данном публично, в присутствии свидетелей.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческие слова стоят в мужском роде. Слово, переведённое «людям», может употребляться в общем значении; возможен также перевод: «верным мужчинам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: то, что
  rationale: Передаёт содержание услышанного как объект глагола и естественно звучит по-русски.
- source_word: ἤκουσας
  choice: ты слышал
  rationale: Аорист указывает на прежнее получение Тимофеем наставления Павла; в русском уместно прошедшее время несовершенного вида.
- source_word: παρ’ ἐμοῦ
  choice: от меня
  rationale: При ἀκούω сочетание παρά с родительным падежом обозначает источник услышанного.
- source_word: διὰ πολλῶν μαρτύρων
  choice: в присутствии многих свидетелей
  rationale: διά с родительным допускает значение посредничества или сопутствующих обстоятельств; в контексте вероятнее публичное наставление при многих свидетелях. Неоднозначность отмечена в сноске.
- source_word: ταῦτα
  choice: то
  rationale: Русское местоимение соотносится с предшествующим «то, что»; буквальное повторение «это» сделало бы фразу тяжеловесной.
- source_word: παράθου
  choice: доверь
  rationale: Императив παρατίθημι означает передать нечто на ответственное хранение или попечение; «доверь» сохраняет оттенок вверения.
- source_word: πιστοῖς
  choice: верным
  rationale: πιστός может означать верность и надёжность; «верным» сохраняет обе смысловые возможности.
- source_word: ἀνθρώποις
  choice: людям
  rationale: ἄνθρωπος способен обозначать человека вообще. Русское «людям» естественно передаёт это значение, не утверждая без достаточных оснований, что речь исключительно о мужчинах; грамматическая форма пояснена в сноске.
- source_word: οἵτινες
  choice: которые
  rationale: Естественное русское относительное местоимение; качественный оттенок раскрывается последующим описанием.
- source_word: ἱκανοὶ ἔσονται
  choice: будут способны
  rationale: Сохраняет будущее время ἔσονται и передаёт ἱκανός как достаточную способность к порученному делу.
- source_word: ἑτέρους
  choice: других
  rationale: Кратко и естественно передаёт объект обучения без добавления отсутствующего в греческом существительного.
theological_decisions:
- issue: Круг лиц в πιστοῖς ἀνθρώποις
  choice: верным людям
  alternative: верным мужчинам
  rationale: Хотя согласование в греческом имеет мужской род, множественное ἄνθρωποι может употребляться родово и обозначать людей. Перевод «людям» сохраняет эту реальную смысловую возможность, а форма оригинала указана в сноске.
- issue: Связь многих свидетелей с наставлением Павла
  choice: в присутствии многих свидетелей
  alternative: через многих свидетелей
  rationale: Оборот διὰ πολλῶν μαρτύρων допускает более одного синтаксического понимания. Контекст лучше поддерживает публичное наставление при свидетелях, однако возможное значение посредничества не исключается и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинный. Синтаксис близок к структуре оригинала, но избегает неестественного повторения указательных местоимений. Союз «И» сохранён как связь с предыдущим наставлением.
