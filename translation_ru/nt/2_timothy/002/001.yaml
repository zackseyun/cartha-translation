lexical_decisions:
- source_word: Σὺ οὖν
  choice: Итак, ты
  rationale: Явное местоимение передаёт смысловое выделение адресата, а «итак» сохраняет вывод или переход от предшествующего наставления.
- source_word: τέκνον μου
  choice: дитя моё
  rationale: τέκνον означает «дитя, ребёнок», а не обязательно «сын»; выбранная форма сохраняет тёплое духовное обращение и соответствует возвышенному, но понятному регистру.
- source_word: ἐνδυναμοῦ
  choice: укрепляйся
  rationale: Русский возвратный императив естественно передаёт продолжающееся принятие силы и не сводит повеление к самодостаточному «будь сильным».
- source_word: ἐν τῇ χάριτι
  choice: в благодати
  rationale: Сохранён предлог «в», чтобы не устранять возможное совмещение значений сферы и средства, присутствующее в греческом ἐν.
- source_word: χάριτι
  choice: благодати
  rationale: «Благодать» — естественный и богословски ёмкий русский эквивалент χάρις в данном контексте.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: которая — в Мессии Иисусе
  rationale: Определительная конструкция связывает благодать с Мессией Иисусом; тире делает сжатую греческую связь яснее по-русски, не добавляя отдельного глагольного утверждения.
- source_word: Χριστῷ
  choice: Мессии
  rationale: Передано значение титула Χριστός — «Мессия»; традиционный вариант «Христос» указан в примечании.
theological_decisions:
- issue: Залог и источник силы в ἐνδυναμοῦ
  choice: укрепляйся
  alternative: будь силён; обретай силу
  rationale: Форма допускает средне-страдательное понимание, при котором Тимофей принимает укрепление. Возвратный русский глагол сохраняет эту воспринимающую направленность, не уточняя источник сверх сказанного далее.
- issue: Значение ἐν перед τῇ χάριτι
  choice: в благодати
  alternative: благодатью; посредством благодати
  rationale: Буквальное «в» сохраняет напряжение между сферой пребывания и средством укрепления, не ограничивая выражение одним инструментальным значением.
- issue: Передача титула Χριστός
  choice: Мессия Иисус
  alternative: Христос Иисус
  rationale: «Мессия» раскрывает значение греческого титула, тогда как традиционная форма «Христос» остаётся допустимым вариантом и приводится в примечании.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Обращение «дитя моё» сохраняет нежность и родовое значение τέκνον; конструкция «в благодати» намеренно оставлена несколько ёмкой ради неоднозначности греческого предлога.
