source:
  edition: SBLGNT
  text: οἵτινες περὶ τὴν ἀλήθειαν ἠστόχησαν, ⸀λέγοντες ἀνάστασιν ἤδη γεγονέναι, καὶ ἀνατρέπουσιν τήν τινων πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/018.yaml
  text: who have gone astray from the truth[a], saying that the resurrection has already happened[e][d][c][b], and are upsetting the faith of some.
translation:
  language: ru
  text: которые уклонились от истины[a], утверждая, что воскресение уже произошло[b], и подрывают веру некоторых[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «промахнулись в отношении истины»; «отступили от истины».'
    reason: lexical_alternative
  - marker: b
    text: То есть они утверждали, что ожидаемое воскресение уже осталось в прошлом; точный характер их учения в этом стихе не объясняется.
    reason: cross_reference
  - marker: c
    text: 'Или: «опрокидывают»; «разрушают».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: которые
  rationale: Естественно вводит определительное придаточное, относящееся к упомянутым ранее лжеучителям; возможный качественный оттенок не требует отдельного выражения.
- source_word: περὶ τὴν ἀλήθειαν ἠστόχησαν
  choice: уклонились от истины
  rationale: 'Передаёт идиоматический смысл ἀστοχέω с περί: промахнуться относительно истины, отойти от неё. Формулировка естественна по-русски и сохраняет образ отклонения.'
- source_word: λέγοντες
  choice: утверждая
  rationale: Причастие сообщает содержание и характер их заблуждения. «Утверждая» в данном контексте точнее передаёт выдвигаемое ими учение, не уточняя сверх текста, является ли оборот средством или сопутствующим действием.
- source_word: ἀνάστασιν
  choice: воскресение
  rationale: Хотя существительное в греческом без артикля, контекст указывает на известное читателям эсхатологическое воскресение; русский язык не требует выражать определённость артиклем.
- source_word: ἤδη γεγονέναι
  choice: уже произошло
  rationale: Перфектный инфинитив обозначает событие, которое, по их утверждению, уже совершилось и имеет нынешнее значение.
- source_word: ἀνατρέπουσιν
  choice: подрывают
  rationale: Настоящее время передаёт продолжающееся действие. «Подрывают» естественно выражает разрушительное воздействие на веру, не утверждая непременно её полного уничтожения.
- source_word: τήν τινων πίστιν
  choice: веру некоторых
  rationale: Сохраняет обычное и богословски нейтральное соответствие πίστις — «вера» и неопределённость τινων — «некоторых».
theological_decisions:
- issue: Смысл утверждения «воскресение уже произошло»
  choice: Сохранить само ложное утверждение о том, что воскресение уже совершилось.
  alternative: Уточнить, что речь шла лишь о духовном воскресении или об отрицании будущего телесного воскресения.
  rationale: Стих не раскрывает точного устройства этого учения. Перевод не должен добавлять конкретную богословскую реконструкцию.
- issue: Значение πίστις
  choice: вера
  alternative: доверие
  rationale: «Вера» здесь естественна, традиционно понятна и не сужает значение до одного психологического оттенка.
translation_notes:
  register: Современный литературный русский язык; сжатый, достойный и понятный синтаксис. Сохранена единая относительная конструкция с двумя сказуемыми. Формулировка не конкретизирует природу ложного учения сверх греческого текста.
