  source_fidelity: 'Основной текст точно передаёт греческий смысл: οἵτινες введено относительным «которые»; ἠστόχησαν περὶ τὴν ἀλήθειαν естественно передано как «уклонились от истины»; причастие λέγοντες сохранено как «утверждая». Формулировка «воскресение уже произошло» корректно передаёт ἀνάστασιν ἤδη γεγονέναι, не добавляя реконструкции ложного учения. «Подрывают веру некоторых» соответствует настоящему времени ἀνατρέπουσιν и неопределённому τινων.'
  naturalness: Текст звучит естественно в современном литературном русском языке. Соединение «которые уклонились … и подрывают …» сохраняет единую относительную конструкцию оригинала и хорошо читается в составе контекста предыдущего стиха.
  terminology: «Истина», «воскресение» и «вера» — точные, нейтральные и устоявшиеся соответствия. Они не навязывают конкретной конфессиональной интерпретации. Сноски уместно фиксируют лексические альтернативы и осторожно поясняют, что стих не определяет характер ошибочного учения.
