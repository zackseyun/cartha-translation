base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/019.yaml
  text: 'Nevertheless[a], the firm foundation of God stands, having this seal: “The Lord knows those who are his,” and[b], “Let everyone who names the name of the Lord depart from unrighteousness.”'
translation:
  language: ru
  text: 'Однако твёрдое Божье основание стоит, и на нём эта печать: «Господь знает своих», и: «Пусть всякий, называющий имя Господа, отступит от неправедности[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякий, призывающий имя Господа». Буквально по-гречески: «называющий имя Господа»; этот оборот может означать призывание Господа или открытое исповедание верности Ему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέντοι
  choice: Однако
  rationale: Передаёт сильный противительный переход от сказанного ранее о ложном учении; звучит естественно и сохраняет риторический вес.
- source_word: στερεὸς θεμέλιος τοῦ θεοῦ
  choice: твёрдое Божье основание
  rationale: Сохраняет метафору устойчивого основания и формально не уточняет, выражает ли родительный падеж прежде всего принадлежность, происхождение или характеристику.
- source_word: ἕστηκεν
  choice: стоит
  rationale: 'Передаёт результирующее состояние, выраженное перфектом: основание прочно установлено и продолжает стоять.'
- source_word: ἔχων τὴν σφραγῖδα ταύτην
  choice: несёт на себе такую печать
  rationale: Естественно по-русски сохраняет образ печати как знака принадлежности, подлинности или удостоверения; возможность значения надписи отмечена в сноске.
- source_word: Ἔγνω κύριος
  choice: Господь знает
  rationale: В цитатной формуле аорист имеет непреходящую, общеистинную силу; настоящее время естественно выражает постоянное знание Господа.
- source_word: τοὺς ὄντας αὐτοῦ
  choice: Своих
  rationale: Кратко и естественно передаёт принадлежность Господу, заложенную в греческом обороте «тех, кто Его».
- source_word: Ἀποστήτω
  choice: Да отступит
  rationale: Передаёт решительный характер повеления и сохраняет торжественный, библейский регистр без архаической тяжеловесности.
- source_word: ἀπὸ ἀδικίας
  choice: от неправедности
  rationale: Сохраняет широкий нравственно-религиозный смысл ἀδικία — неправота, зло и неправедное поведение, — не сужая его только до юридической несправедливости или лжи.
- source_word: πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου
  choice: всякий, называющий имя Господа
  rationale: Сохраняет заметный повтор «называющий имя» и открытость идиомы, которая может подразумевать призывание имени или исповедание верности Господу.
theological_decisions:
- issue: Кого обозначает «Господь» в двух изречениях на печати
  choice: В обоих случаях оставить просто «Господь», не уточняя референта.
  alternative: Истолковать оба употребления как указание только на Бога Отца, только на Христа либо различить референтов в двух частях.
  rationale: Греческий текст употребляет κύριος без явного уточнения. Ветхозаветная цитатная основа и её христианское применение создают богословскую многослойность, которую перевод не должен устранять.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис и ключевые образы оригинала сохранены, но фраза построена естественно для обычного современного читателя. Местоимение «Своих» написано с прописной буквы по принятой русской религиозной издательской норме.
