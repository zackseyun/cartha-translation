id: 2TI.2.22
reference: 2 Timothy 2:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τὰς δὲ νεωτερικὰς ἐπιθυμίας φεῦγε, δίωκε δὲ δικαιοσύνην, πίστιν, ἀγάπην, εἰρήνην μετὰ τῶν ἐπικαλουμένων τὸν κύριον ἐκ καθαρᾶς καρδίας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/022.yaml
  text: But flee youthful desires[a], and pursue righteousness, faith, love, and peace[c][b], together with those who call on the Lord from a pure heart.
translation:
  language: ru
  text: А юношеских желаний[a] избегай; стремись же к праведности[b], вере[c], любви и миру вместе с теми, кто призывает Господа от чистого сердца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «юношеских страстей». Греческое выражение может обозначать вообще желания, характерные для молодости, а не только сексуальное влечение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «справедливости». Греческое слово может иметь как нравственный, так и общественно-правовой оттенок.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «верности». Греческое слово в зависимости от контекста может означать веру, доверие или верность.'
    reason: alternative_reading
lexical_decisions:
- source_word: νεωτερικὰς ἐπιθυμίας
  choice: юношеских желаний
  rationale: Сочетание обозначает желания, характерные для молодости, и не ограничивается только сексуальными влечениями. Русское «юношеские желания» сохраняет эту широту.
- source_word: φεῦγε
  choice: избегай
  rationale: Греческий императив выражает постоянное решительное уклонение. «Избегай» естественно по-русски в сочетании с родительным падежом и не ослабляет практический призыв.
- source_word: δίωκε
  choice: стремись
  rationale: В этическом наставлении глагол означает деятельно и настойчиво добиваться чего-либо. «Стремись» передаёт направленное продолжительное действие и образует ясный контраст с «избегай».
- source_word: δικαιοσύνην
  choice: праведности
  rationale: «Праведность» сохраняет обычное новозаветное значение δικαιοσύνη как нравственной правильности; возможный оттенок справедливости отмечен в сноске.
- source_word: πίστιν
  choice: вере
  rationale: «Вера» — основное и контекстуально уместное соответствие πίστις; в перечне добродетелей возможно также значение верности, сохранённое в сноске.
- source_word: ἀγάπην
  choice: любви
  rationale: Прямое, естественное и устойчивое соответствие ἀγάπη.
- source_word: εἰρήνην
  choice: миру
  rationale: Прямое и естественное соответствие εἰρήνη в перечне качеств, к которым следует стремиться.
- source_word: μετὰ τῶν ἐπικαλουμένων τὸν κύριον
  choice: вместе с теми, кто призывает Господа
  rationale: μετά с родительным выражает совместность; «вместе с» ясно показывает общинный характер наставления. «Призывает Господа» естественно передаёт религиозное обращение к Господу.
- source_word: ἐκ καθαρᾶς καρδίας
  choice: от чистого сердца
  rationale: Предлог ἐκ указывает на внутренний источник обращения. Русское выражение «от чистого сердца» одновременно близко к форме оригинала и идиоматично.
theological_decisions:
- issue: Объём значения «юношеских желаний»
  choice: Широкий круг желаний и страстей, характерных для молодости, без сведения только к сексуальному влечению
  alternative: Преимущественно сексуальные страсти
  rationale: Само греческое сочетание имеет широкое значение, а контекст наставления о характере и поведении не требует его сужения.
- issue: Значение δικαιοσύνη в перечне добродетелей
  choice: «Праведность» в основном тексте
  alternative: «Справедливость»
  rationale: В данном нравственном перечне «праведность» передаёт широкое значение правильной жизни перед Богом и людьми, тогда как возможный общественно-правовой оттенок «справедливости» сохранён в сноске.
- issue: Значение πίστις в перечне добродетелей
  choice: «Вера» в основном тексте
  alternative: «Верность»
  rationale: Форма допускает оба оттенка. «Вера» сохраняет основное новозаветное соответствие, а этическое значение «верность» указано в сноске без устранения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и наставительным звучанием. Порядок «избегай — стремись» сохраняет резкий риторический контраст оригинала; точка с запятой делает длинное повеление удобным для чтения. Сноски стоят непосредственно после соответствующих слов и сохраняют реальные лексические альтернативы.
