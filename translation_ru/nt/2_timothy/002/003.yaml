translation:
  language: ru
  text: Раздели тяготы, как хороший солдат Мессии Иисуса[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Переноси тяготы вместе со мной, как хороший солдат Христа Иисуса».'
    reason: 'Лексическая альтернатива: приставка συν- в глаголе указывает на совместное перенесение страданий; контекст может подразумевать «со мной», хотя в самом стихе эти слова прямо не выражены.'
  - marker: b
    text: Греч. «Христа Иисуса»; здесь Χριστός передано как титул «Мессия».
    reason: Альтернативная передача христологического титула.
lexical_decisions:
- source_word: συγκακοπάθησον
  choice: Прими свою долю страданий
  rationale: Аорист, действительный залог, повелительное наклонение, 2-е лицо единственного числа. Приставка συν- указывает на участие в общих страданиях. Формулировка передаёт как повеление, так и идею совместной участи, не добавляя отсутствующего в данном стихе прямого указания «со мной».
- source_word: ὡς
  choice: как
  rationale: Сравнительная частица, вводящая образ, в соответствии с которым Тимофей должен переносить страдания.
- source_word: καλὸς
  choice: добрый
  rationale: В сочетании со словом «воин» обозначает достойного, исправного, заслуживающего одобрения человека. «Добрый воин» — естественное и возвышенное русское выражение.
- source_word: στρατιώτης
  choice: воин
  rationale: Передаёт обычное значение греческого слова и сохраняет метафорический характер высказывания; в данном возвышенном контексте звучит естественнее, чем «солдат».
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь сохраняет значение титула, поэтому переведено как «Мессия», а не просто воспроизведено как традиционная часть имени.
- source_word: Ἰησοῦ
  choice: Иисуса
  rationale: Общепринятая русская форма личного имени в родительном падеже, согласованная с греческой конструкцией.
theological_decisions:
- issue: Передача Χριστοῦ Ἰησοῦ
  choice: Мессии Иисуса
  alternative: Христа Иисуса
  rationale: Греческое Χριστός в этой конструкции можно воспринимать как титул или как устойчивое именование. Основной текст сохраняет смысл титула «Мессия», а традиционный русский вариант приведён в примечании.
- issue: Подразумеваемый участник совместных страданий
  choice: Не уточнять, с кем именно Тимофей разделяет страдания
  alternative: «Переноси тяготы вместе со мной»
  rationale: Приставка συν- выражает совместность, однако местоимение «со мной» в греческом тексте стиха отсутствует. Основной перевод сохраняет эту недосказанность, а контекстуально вероятное уточнение дано как вариант.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Воин» сохраняет достоинство военной метафоры. Формулировка «прими свою долю страданий» естественно выражает участие в общей тяжёлой участи, не устраняя неоднозначность относительно того, с кем именно она разделяется.
