  source_fidelity: Основное выражение «Прими свою долю страданий» передаёт общую идею, но добавляет отсутствующее в греческом притяжательное «свою долю» и несколько ослабляет значение συγκακοπάθησον — разделить/перенести страдания в общей участи. «Раздели тяготы» точнее сохраняет повеление, значение κακοπαθέω и совместный оттенок приставки συν-, не называя участника совместности. «Как хороший солдат Мессии Иисуса» передаёт ὡς καλὸς στρατιώτης Χριστοῦ Ἰησοῦ без смысловых добавлений.
