  text: и чтобы они, придя в себя, освободились от западни дьявола, будучи захваченными им живыми, чтобы исполнять его волю.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будучи захваченными им живыми, чтобы исполнять волю Того». Некоторые относят «Того» не к дьяволу, а к Богу.'
    reason: alternative_reading
  - marker: b
    text: 'Греческий глагол можно передать более общо как «взятые в плен» или «захваченные», но его значение конкретнее: «захваченные живыми».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνανήψωσιν
  choice: придя в себя
  rationale: Глагол буквально связан с протрезвлением и переносно означает возвращение к здравому восприятию. Русское «прийти в себя» естественно передаёт восстановление ясности мысли в контексте покаяния и освобождения от заблуждения.
- source_word: παγίδος
  choice: западни
  rationale: «Западня» естественно передаёт образ скрытой ловушки, в которую дьявол заманивает и удерживает человека.
- source_word: διαβόλου
  choice: дьявола
  rationale: В данном контексте слово употреблено как личное обозначение дьявола, а не в общем значении «клеветник».
- source_word: ἐζωγρημένοι
  choice: захватил их живыми
  rationale: ζωγρέω конкретно обозначает захват живьём. Личная конструкция с «который захватил их» звучит по-русски яснее тяжёлого страдательного причастного оборота и сохраняет результат предшествующего захвата.
- source_word: ὑπ’ αὐτοῦ
  choice: который захватил их
  rationale: Местоимение естественнее всего относится к ближайшему предшествующему существительному «дьявола»; относительное предложение устраняет неестественную для русского языка цепочку местоимений.
- source_word: εἰς τὸ ἐκείνου θέλημα
  choice: ради своей воли
  rationale: Формулировка сохраняет направленно-целевую силу εἰς и не добавляет отсутствующего в греческом тексте глагола «исполнять». Неоднозначность референта ἐκείνου отмечена в сноске.
theological_decisions:
- issue: К кому относится ἐκείνου в выражении εἰς τὸ ἐκείνου θέλημα
  choice: 'К дьяволу: «ради своей воли»'
  alternative: 'К Богу: захваченные дьяволом должны освободиться для исполнения Божьей воли'
  rationale: Ближайший и синтаксически наиболее естественный референт — дьявол, непосредственно упомянутый перед этим. Однако греческая конструкция допускает и традиционно обсуждаемое отнесение ἐκείνου к Богу, поэтому альтернативу следует сохранить в сноске.
translation_notes:
  register: Современный литературный русский язык с ясной, но достойной библейского текста формулировкой. «Придя в себя» передаёт метафору протрезвления без архаизма; «вырвались из западни» естественно выражает исход из состояния пленения. Маркеры сносок поставлены после всего спорного оборота, к которому относятся обе поясняющие сноски.
