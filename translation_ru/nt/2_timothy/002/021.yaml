source:
  edition: SBLGNT
  text: ἐὰν οὖν τις ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων, ἔσται σκεῦος εἰς τιμήν, ἡγιασμένον, ⸀εὔχρηστον τῷ δεσπότῃ, εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/021.yaml
  text: Therefore[a], if anyone cleanses himself from these things, he will be a vessel for honor, sanctified, useful to the Master[b], prepared for every good work.
translation:
  language: ru
  text: Итак, если кто очистит себя от всего этого, тот будет сосудом для почётного употребления[a], освящённым[b], полезным Владыке и приготовленным ко всякому доброму делу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сосудом в чести»; возможно также: «сосудом, достойным чести».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сделанным святым»; также возможно: «отделённым для особого служения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Итак, если
  rationale: «Если» передаёт условие, а «итак» — вывод из предшествующего рассуждения.
- source_word: τις
  choice: кто
  rationale: Неопределённое местоимение имеет обобщающий смысл; конструкция «если кто» естественна для современного литературного русского языка.
- source_word: ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων
  choice: очистит себя от этого
  rationale: Сохраняет возвратность действия и отсылку к непосредственно предшествующему контексту, не уточняя сверх текста, относится ли указание прежде всего к людям, поступкам или всему названному ранее.
- source_word: σκεῦος
  choice: сосуд
  rationale: «Сосуд» сохраняет образ большого дома и домашней утвари из предыдущего стиха; «орудие» ослабило бы связь с этим образом.
- source_word: εἰς τιμήν
  choice: для почётного употребления
  rationale: Передаёт противопоставление предметам для почётного и непочётного употребления в 2:20. Более буквальная формулировка отмечена в сноске.
- source_word: ἡγιασμένον
  choice: освящённым
  rationale: Причастие совершенного вида передаёт состояние, возникшее в результате освящения, и сохраняет богословскую связь со святостью.
- source_word: εὔχρηστον τῷ δεσπότῃ
  choice: полезным Владыке
  rationale: «Полезным» ясно передаёт пригодность к служению, а «Владыке» сохраняет значение власти δεσπότης и вероятную отсылку к Богу, не устраняя образ хозяина дома.
- source_word: εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον
  choice: приготовленным ко всякому доброму делу
  rationale: Сохраняет широкий охват πᾶν и устойчивое новозаветное выражение «доброе дело».
theological_decisions:
- issue: Обобщающий характер единственного числа
  choice: если кто очистит себя… тот будет
  alternative: если человек очистит себя… он будет
  rationale: Греческий текст говорит о любом человеке в единственном числе. Русская соотносительная конструкция «если кто… тот» естественно передаёт эту обобщённость без необоснованного ограничения по полу.
- issue: Значение εἰς τιμήν в образе сосудов
  choice: для почётного употребления
  alternative: в чести / достойным чести
  rationale: Контекст предыдущего стиха противопоставляет назначение сосудов, поэтому основной текст выражает функциональный оттенок, а сноска сохраняет более буквальную возможность.
- issue: Значение ἡγιασμένον
  choice: освящённым
  alternative: сделанным святым / отделённым для Бога
  rationale: «Освящённым» сохраняет как идею святости, так и посвящённость особому служению, не сводя значение только к нравственному очищению или только к назначению.
- issue: Передача δεσπότης
  choice: Владыке
  alternative: хозяину / господину
  rationale: Слово обозначает обладающего властью хозяина. «Владыке» уместно при вероятном божественном референте, но сохраняет властный оттенок домашнего образа.
translation_notes:
  register: Современный литературный русский язык с dignified biblical register. Сохранён образ сосуда и Владыки; архаичная формула «сосуд в чести» вынесена в сноску. Союз «и» перед последним определением делает длинный ряд признаков естественным по-русски, не меняя его синтаксического отношения к слову «сосуд».
