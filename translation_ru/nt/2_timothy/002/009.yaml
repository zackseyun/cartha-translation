base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/009.yaml
  text: for which I am suffering hardship[a], even to the point of chains, as a criminal[b]. But the word of God is not bound.
translation:
  language: ru
  text: За эту весть[a] я терплю страдания — вплоть до оков, как преступник[b]. Но слово Божье не сковано.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в этой вести»; возможно также: «из-за этой вести». Греческое выражение, вероятно, относится к благой вести, упомянутой в предыдущем стихе.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «как злодей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: За эту весть
  rationale: Относительное выражение, вероятнее всего, отсылает к благой вести в предыдущем стихе и в данном контексте указывает на причину страданий. Повтор слова «весть» делает эту связь ясной по-русски, не исключая более буквального понимания, отмеченного в сноске.
- source_word: κακοπαθῶ
  choice: я терплю страдания
  rationale: Передаёт продолжающееся тяжёлое испытание, выраженное формой настоящего времени, естественным современным русским языком.
- source_word: μέχρι δεσμῶν
  choice: вплоть до оков
  rationale: Сохраняет конкретный образ уз или цепей и обозначает крайнюю степень страдания, включающую заключение.
- source_word: ὡς κακοῦργος
  choice: как преступник
  rationale: В контексте заключения слово обозначает человека, которого считают совершившим преступление; вариант «злодей» был бы более оценочным и менее судебным.
- source_word: ἀλλὰ
  choice: Но
  rationale: Кратко и выразительно передаёт резкое противопоставление между оковами Павла и несвязанностью Божьего слова.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: слово Божье
  rationale: Сохраняет широту греческого выражения, не сводя его однозначно ни к Писанию, ни только к проповеди благой вести.
- source_word: οὐ δέδεται
  choice: не сковано
  rationale: Передаёт состояние несвязанности и сохраняет метафорическую перекличку с «оковами»; совершенный вид «сковано» естественно выражает результативное состояние.
theological_decisions:
- issue: Значение выражения «слово Божье»
  choice: Сохранено широкое выражение «слово Божье».
  alternative: «благая весть от Бога» или «Писание»
  rationale: Ближайший контекст особенно указывает на проповедуемую благую весть, однако само греческое выражение шире. Перевод не устраняет эту смысловую широту.
- issue: Связь ἐν ᾧ с предыдущим стихом
  choice: В основном тексте выражение понято причинно и отнесено к вести из предыдущего стиха.
  alternative: 'Сферическое значение: «в которой»'
  rationale: Контекст страданий и заключения естественно поддерживает смысл «за эту весть», но грамматическая форма допускает оттенок «в которой», поэтому он сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Слова «оковы» и «сковано» сохраняют намеренную словесную перекличку исходного текста, оставаясь понятными широкому кругу читателей.
