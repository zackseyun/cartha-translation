id: 2TI.2.10
reference: 2 Timothy 2:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διὰ τοῦτο πάντα ὑπομένω διὰ τοὺς ἐκλεκτούς, ἵνα καὶ αὐτοὶ σωτηρίας τύχωσιν τῆς ἐν Χριστῷ Ἰησοῦ μετὰ δόξης αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/010.yaml
  text: For this reason I endure everything for the sake of the elect[c][b][a], so that they also may obtain the salvation that is in Messiah Jesus with eternal glory.
translation:
  language: ru
  text: Поэтому я всё переношу ради избранных[a], чтобы и они обрели спасение в Мессии Иисусе[b] вместе с вечной славой[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избранников». Греческое ἐκλεκτούς означает избранных, выбранных.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционный перевод: «во Христе Иисусе». Греческое Χριστός означает «Мессия», «Помазанник».'
    reason: alternative_rendering
  - marker: c
    text: 'Буквально: «со славой вечной». Эта фраза может пониматься как относящаяся к спасению либо ко всему действию обретения спасения.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь с предшествующим контекстом кратко и естественно.
- source_word: πάντα ὑπομένω
  choice: я всё переношу
  rationale: Сохраняет всеохватность πάντα и значение стойкого перенесения страданий в ὑπομένω.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: ради избранных
  rationale: διά с винительным выражает действие ради пользы названной группы; «избранных» прямо передаёт богословски значимое ἐκλεκτούς без конфессионального толкования.
- source_word: ἵνα καὶ αὐτοὶ
  choice: чтобы и они
  rationale: «Чтобы» сохраняет целевое значение ἵνα, а «и они» — добавочное и умеренно эмфатическое значение καὶ αὐτοί.
- source_word: σωτηρίας τύχωσιν
  choice: обрели спасение
  rationale: τυγχάνω с родительным означает получить или обрести; выбранная формулировка естественна по-русски и не добавляет представления о достижении спасения собственными заслугами.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: спасение в Мессии Иисусе
  rationale: Предложная конструкция определяет спасение и сохраняет характерный для Павла язык пребывания или сферы «в» Мессии, не разворачивая его в пояснительный парафраз.
- source_word: Χριστῷ
  choice: Мессии
  rationale: Χριστός сохраняет здесь смысл титула; «Мессия» передаёт его лексическое содержание, тогда как традиционное «Христос» отмечено в сноске.
- source_word: μετὰ δόξης αἰωνίου
  choice: вместе с вечной славой
  rationale: μετά с родительным выражает сопровождение; формулировка показывает, что вечная слава сопутствует спасению, не превращая её в отдельный объект глагола.
theological_decisions:
- issue: Передача ἐκλεκτούς
  choice: избранных
  alternative: избранников; тех, кого Бог избрал
  rationale: Прилагательное обозначает избранных и несёт самостоятельную богословскую нагрузку. Прямой перевод сохраняет напряжение текста и не уточняет ни основание, ни порядок, ни механизм избрания.
- issue: Передача Χριστῷ как титула
  choice: Мессии
  alternative: Христе
  rationale: В сочетании Χριστῷ Ἰησοῦ титул остаётся семантически значимым. «Мессия Иисус» выявляет исходное значение титула; традиционный русский вариант приведён в сноске.
- issue: Связь μετὰ δόξης αἰωνίου
  choice: вечная слава сопровождает обретаемое спасение
  alternative: обрести спасение и вечную славу как два грамматически равноправных объекта
  rationale: Греческое μετά с родительным выражает сопровождение, а не вводит второй прямой объект. При этом линейная связь фразы с глаголом и всей группой «обрели спасение» остаётся возможной и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского высказывания. «Всё переношу» звучит естественно и весомо; порядок слов сохраняет последовательность мысли оригинала. Богословски нагруженные слова не заменены пояснительными пересказами.
