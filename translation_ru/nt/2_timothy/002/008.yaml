source:
  edition: SBLGNT
  text: Μνημόνευε Ἰησοῦν Χριστὸν ἐγηγερμένον ἐκ νεκρῶν, ἐκ σπέρματος Δαυίδ, κατὰ τὸ εὐαγγέλιόν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/008.yaml
  text: Remember Jesus the Messiah[a], raised from the dead, descended from David[b], according to my gospel.
translation:
  language: ru
  text: Помни Иисуса Мессию[a], воскрешённого из мёртвых, потомка Давида[b], согласно моей Благой Вести.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисуса Христа». Греческий титул Χριστός можно передать как «Христос» или «Мессия»; здесь «Мессия» подчёркивает значение титула, особенно рядом с указанием на происхождение от Давида.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «из семени Давида».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημόνευε
  choice: Помни
  rationale: Настоящее повелительное наклонение выражает продолжающееся наставление — постоянно держать в памяти; русское «помни» естественно и сохраняет повелительную силу.
- source_word: Ἰησοῦν Χριστόν
  choice: Иисуса Мессию
  rationale: Χριστός здесь имеет титульный смысл, особенно в сочетании с упоминанием происхождения от Давида; форма «Иисуса Мессию» естественно передаёт греческую конструкцию без добавления отсутствующего артикля.
- source_word: ἐγηγερμένον
  choice: воскрешённого
  rationale: Перфектное страдательное причастие представляет Иисуса как воскрешённого и пребывающего живым; страдательная форма также сохраняет указание на совершённое над ним действие.
- source_word: ἐκ νεκρῶν
  choice: из мёртвых
  rationale: Устоявшаяся и точная русская передача выражения в контексте воскресения.
- source_word: ἐκ σπέρματος Δαυίδ
  choice: потомка Давида
  rationale: Буквально σπέρμα означает «семя», но здесь обозначает родовое происхождение; «потомка Давида» точно и естественно передаёт смысл.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: согласно моей Благой Вести
  rationale: κατά выражает соответствие — «согласно»; притяжательное «моей» сохранено прямо, а «Благая Весть» передаёт смысл εὐαγγέλιον понятным современным языком.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Связь с Давидом подчёркивает титульное, мессианское значение слова; примечание сохраняет традиционный вариант.
- issue: Залог и результат ἐγηγερμένον
  choice: воскрешённого
  alternative: воскресшего
  rationale: Страдательная форма греческого причастия указывает на действие, совершённое над Иисусом, а перфект подразумевает сохраняющийся результат.
- issue: Смысл выражения «моя Благая Весть»
  choice: Сохранить притяжательную форму без поясняющей вставки
  alternative: Благая Весть, которую я возвещаю
  rationale: Текст буквально говорит «моей»; он не утверждает, что Павел возвещает иную Благую Весть, но такое истолкование не следует вносить в основной текст.
translation_notes:
  register: Современный литературный русский язык, краткий и торжественный апостольский призыв. «Благая Весть» выбрана как прозрачная смысловая передача εὐαγγέλιον; все причастные определения согласованы с винительным «Иисуса Мессию».
