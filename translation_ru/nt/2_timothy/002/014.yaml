  text: Ταῦτα ὑπομίμνῃσκε, διαμαρτυρόμενος ἐνώπιον τοῦ ⸀κυρίου, μὴ λογομαχεῖν, ⸀ἐπ’ οὐδὲν χρήσιμον, ἐπὶ καταστροφῇ τῶν ἀκουόντων.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/014.yaml
  text: Keep reminding them of these things[a], solemnly charging them before the Lord not to quarrel about words[b], which is useful for nothing and leads to the ruin of those who hear.
translation:
  language: ru
  text: 'Об этом постоянно напоминай, торжественно предостерегая их перед Господом[a], чтобы они не спорили о словах: это не приносит никакой пользы[b], а ведёт к разрушению слушающих.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «Господь» здесь не уточняет, имеется ли в виду непосредственно Господь Иисус или Бог в более общем смысле.
    reason: alternative_reading
  - marker: b
    text: 'Или: «ни к чему полезному не ведёт».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: Об этом
  rationale: Форма среднего рода множественного числа отсылает к предшествующему наставлению; по-русски собирательное «об этом» звучит естественнее буквального «об этих вещах».
- source_word: ὑπομίμνῃσκε
  choice: постоянно напоминай
  rationale: Настоящее повелительное наклонение передаёт продолжающееся или повторяющееся действие.
- source_word: διαμαρτυρόμενος
  choice: торжественно призывая их
  rationale: Причастие выражает настойчивое и solemnное увещание; местоимение «их» восстановлено из контекста как подразумеваемое дополнение.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: перед Господом
  rationale: Сохранён обычный оборот, обозначающий действие в присутствии Господа и под его свидетельством, без уточнения референта титула.
- source_word: μὴ λογομαχεῖν
  choice: не спорить о словах
  rationale: Глагол обозначает словесные препирательства или споры вокруг слов; выбран естественный современный русский оборот с отрицательной окраской.
- source_word: ἐπ’ οὐδὲν χρήσιμον
  choice: это не приносит никакой пользы
  rationale: Фраза подчёркивает полное отсутствие полезного результата; «это» относится к спору о словах.
- source_word: ἐπὶ καταστροφῇ
  choice: а лишь губит
  rationale: Передан резкий смысл пагубного результата, при этом русский глагол позволяет избежать тяжеловесного буквального «к разрушению».
- source_word: τῶν ἀκουόντων
  choice: слушающих
  rationale: Субстантивированное причастие настоящего времени кратко и естественно обозначает тех, кто слышит эти споры.
theological_decisions:
- issue: К кому относится κύριος
  choice: Господом
  alternative: Богом; Господом Иисусом
  rationale: Основной греческий текст содержит титул «Господь» без дальнейшего уточнения. Перевод сохраняет эту подлинную неоднозначность и не сужает референт.
- issue: Характер «гибели» слушающих
  choice: губит слушающих
  alternative: ведёт к разрушению слушающих
  rationale: καταστροφή обозначает серьёзный пагубный итог, но сама по себе не требует истолковывать его как окончательную вечную погибель; поэтому перевод сохраняет силу выражения без такого догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством пастырского наставления. Синтаксис сделан ясным для обычного читателя; сохранены настойчивость повеления, резкость предупреждения и неоднозначность титула «Господь».
