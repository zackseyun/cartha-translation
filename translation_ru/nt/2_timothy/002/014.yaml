  source_fidelity: 'Смысл в целом передан верно: продолжающееся напоминание, торжественное предостережение перед Господом, бесплодность словесных споров и их пагубный итог сохранены. Однако «губит слушающих» несколько сдвигает конструкцию результата ἐπὶ καταστροφῇ в сторону прямого активного действия. «Ведут к разрушению слушающих» точнее сохраняет значение последствия и не приписывает καταστροφή более узкий богословский смысл.'
