  terminology: '«Господь» корректно сохраняет неоднозначный титул κύριος. Сноска a в черновике неудачна: она вводит утверждение о рукописном варианте «перед Богом», которого нет в предоставленном критическом тексте и который не отражён в английском аудите. Следует ограничить её действительной референциальной неоднозначностью титула.'
