source:
  edition: SBLGNT
  text: σπούδασον σεαυτὸν δόκιμον παραστῆσαι τῷ θεῷ, ἐργάτην ἀνεπαίσχυντον, ὀρθοτομοῦντα τὸν λόγον τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/015.yaml
  text: Be diligent to present yourself approved to God[a], a worker with no need to be ashamed, rightly handling the word of truth.
translation:
  language: ru
  text: Старайся предстать перед Богом прошедшим проверку и одобренным — работником, которому нечего стыдиться и который верно обращается со словом истины.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верно преподаёт слово истины»; букв.: «прямо разрезает слово истины».'
    reason: 'Лексическая альтернатива: редкий глагол ὀρθοτομέω допускает буквальное образное прочтение и контекстуальное понимание как верное преподавание или обращение со словом.'
lexical_decisions:
- source_word: σπούδασον
  choice: старайся
  rationale: Повелительная форма призывает к усердному, целенаправленному усилию. «Старайся» естественно звучит по-русски и не ослабляет призыва до субъективного «сделай всё возможное».
- source_word: σεαυτὸν
  choice: себя
  rationale: Возвратное местоимение является дополнением при παραστῆσαι и прямо передаётся словом «себя».
- source_word: δόκιμον
  choice: достойным одобрения
  rationale: Прилагательное обозначает того, кто выдержал проверку и признан годным. Формулировка «достойным одобрения» передаёт оценку со стороны Бога и звучит естественнее, чем двусмысленное «испытанным».
- source_word: παραστῆσαι
  choice: представить
  rationale: Инфинитив выражает цель при σπούδασον. «Представить себя Богу» сохраняет образ человека, предстающего перед Богом для оценки или служения, не сужая смысл до одного лишь «стоять перед».
- source_word: τῷ θεῷ
  choice: Богу
  rationale: 'Дательный падеж при παραστῆσαι естественно передаётся русским дательным: «представить себя Богу».'
- source_word: ἐργάτην
  choice: работником
  rationale: Слово сохраняет образ трудящегося и понятно современному читателю; «делатель» звучало бы архаично.
- source_word: ἀνεπαίσχυντον
  choice: которому нечего стыдиться
  rationale: Передаёт не просто внутреннее отсутствие стыда, а отсутствие основания быть пристыженным из-за качества своей работы.
- source_word: ὀρθοτομοῦντα
  choice: который правильно обращается
  rationale: Редкий глагол буквально связан с действием «резать прямо», а в контексте обозначает верное и точное обращение с возвещаемым словом. Широкая формулировка не ограничивает смысл только преподаванием; буквальный образ и более узкая альтернатива сохранены в примечании.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: со словом истины
  rationale: Сохраняется греческая родительная конструкция и характерное для Павловых посланий выражение; при этом оно остаётся понятным современному русскому читателю.
theological_decisions:
- issue: Значение ὀρθοτομοῦντα в контексте служения Тимофея
  choice: правильно обращается со словом истины
  alternative: 'верно преподаёт слово истины; буквально: прямо разрезает слово истины'
  rationale: Причастие, вероятно, говорит о точном и верном обращении с евангельской вестью, но само по себе не ограничивает действие только преподаванием. Основной текст сохраняет широкий смысл, а примечание показывает как более узкое толкование, так и буквальный образ, не устраняя лексическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского наставления. Синтаксис сделан плавным и понятным; архаизмы вроде «делатель» исключены. Тире выделяет пояснительное наименование «работником», а придаточные естественно связывают две характеристики работника.
