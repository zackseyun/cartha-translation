  text: εἰ ὑπομένομεν, καὶ συμβασιλεύσομεν· εἰ ⸀ἀρνησόμεθα, κἀκεῖνος ἀρνήσεται ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/012.yaml
  text: If we endure[a], we will also reign with him; if we deny him, he also will deny us.
translation:
  language: ru
  text: Если остаёмся стойкими, то и царствовать будем вместе с Ним; если отречёмся от Него[a], то и Он отречётся от нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если отвергнем Его, то и Он отвергнет нас».'
    reason: 'Лексическая альтернатива для ἀρνέομαι: глагол допускает значения «отрекаться» и «отвергать»; примечание показывает диапазон смысла, сохраняя повтор в обеих частях.'
lexical_decisions:
- source_word: ὑπομένομεν
  choice: остаёмся стойкими
  rationale: Глагол ὑπομένω обозначает стойкость и выдержку перед лицом испытаний или страданий. Формулировка естественна для современного русского языка и не вводит более узкого богословского термина.
- source_word: συμβασιλεύσομεν
  choice: царствовать будем вместе с Ним
  rationale: Сложный глагол означает «царствовать вместе». Выбор «царствовать», а не более общего «править», сохраняет царскую образность; местоимение восполняет подразумеваемого из контекста Христа.
- source_word: ἀρνησόμεθα
  choice: отречёмся от Него
  rationale: ἀρνέομαι может означать отрицание, отвержение или отречение. «Отречёмся» естественно передаёт личное отречение от Христа и позволяет сохранить повтор того же глагола в ответной части высказывания.
- source_word: κἀκεῖνος
  choice: то и Он
  rationale: 'Сочетание καὶ ἐκεῖνος выражает ответное соответствие: «и Он», «Он, в Свою очередь». Русское «то и Он» сохраняет параллелизм условной конструкции.'
- source_word: ἀρνήσεται ἡμᾶς
  choice: отречётся от нас
  rationale: Повтор «отречётся» сохраняет намеренный лексический и риторический параллелизм греческого текста.
theological_decisions:
- issue: Характер предупреждения во второй условной части
  choice: 'Передать как прямое и серьёзное предупреждение: «если отречёмся от Него, то и Он отречётся от нас».'
  alternative: Истолковать отречение лишь как лишение награды либо ослабить условие как чисто гипотетическое.
  rationale: Греческий текст формулирует сбалансированное условное высказывание и не уточняет последствия сверх самого предупреждения. Перевод сохраняет его строгость и богословское напряжение, не решая споры об отступничестве, стойкости святых или награде.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная условная конструкция сохраняет параллелизм изречения. Форма «остаёмся стойкими» понятна широкому читателю, а «царствовать» удерживает царскую образность оригинала. Местоимения, относящиеся ко Христу, написаны с прописной буквы в соответствии с распространённым русским библейским регистром.
