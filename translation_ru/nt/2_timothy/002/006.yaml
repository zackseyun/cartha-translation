  text: The hardworking farmer must be the first to receive a share of the crops[a].
translation:
  language: ru
  text: Усердно трудящийся земледелец должен первым получить долю урожая[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Трудящийся земледелец должен первым вкушать плоды».'
    reason: 'Лексическая альтернатива: «вкушать плоды» более непосредственно передаёт образное значение μεταλαμβάνειν и καρποί; основной текст яснее выражает участие в урожае на современном русском языке.'
lexical_decisions:
- source_word: κοπιῶντα (κοπιάω)
  choice: усердно трудящийся
  rationale: Причастие обозначает напряжённый, требующий усилий труд. Такой перевод передаёт длительный характер и интенсивность работы, оставаясь естественным для современного русского языка.
- source_word: γεωργὸν (γεωργός)
  choice: земледелец
  rationale: Слово обозначает человека, который возделывает землю. «Земледелец» точно соответствует сельскохозяйственному образу и звучит в современном литературном русском языке естественно и достойно.
- source_word: δεῖ
  choice: должен
  rationale: Передаёт выраженную в греческом тексте необходимость или обязанность кратко и без ослабления смысла.
- source_word: πρῶτον
  choice: первым
  rationale: По наиболее естественному синтаксическому прочтению наречие указывает на первенство земледельца в получении доли урожая, а не только на то, что труд должен предшествовать участию в плодах.
- source_word: τῶν καρπῶν (καρπός)
  choice: урожая
  rationale: В контексте труда земледельца множественное «плоды» обозначает произведённый землёй урожай. Единственное собирательное «урожай» ясно и естественно передаёт этот смысл по-русски.
- source_word: μεταλαμβάνειν (μεταλαμβάνω)
  choice: получить долю
  rationale: Глагол с родительным падежом означает участие или получение части чего-либо. «Получить долю» ясно выражает партитивный смысл, не привнося специальных богословских ассоциаций.
theological_decisions:
- issue: Смысл образного утверждения о земледельце
  choice: Тот, кто усердно трудится, должен первым участвовать в плодах своего труда.
  alternative: Земледелец должен прежде потрудиться и лишь затем пользоваться урожаем.
  rationale: 'Порядок слов и синтаксис греческого текста наиболее естественно связывают πρῶτον с μεταλαμβάνειν: речь идёт о первенстве в получении доли. Менее вероятное прочтение понимает πρῶτον как указание на то, что труд должен происходить прежде вкушения плодов.'
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, пословичная и достойная. Сельскохозяйственный образ сохранён, а менее прозрачное буквальное «приобщаться к плодам» вынесено в примечание.
