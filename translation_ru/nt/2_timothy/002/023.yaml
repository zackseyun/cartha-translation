id: 2TI.2.23
reference: 2 Timothy 2:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τὰς δὲ μωρὰς καὶ ἀπαιδεύτους ζητήσεις παραιτοῦ, εἰδὼς ὅτι γεννῶσι μάχας·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/023.yaml
  text: But refuse foolish and ignorant controversies[b][a], knowing that they produce quarrels.
translation:
  language: ru
  text: А глупых и невежественных споров[a] избегай, зная, что они порождают[b] ссоры.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «вопросов», «рассуждений»; греческое слово может обозначать исследование или обсуждение, но здесь, вероятно, имеются в виду споры, вызывающие раздоры.
    reason: lexical_alternative
  - marker: b
    text: Буквально «рождают»; это образное выражение означает, что такие споры вызывают ссоры.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς
  choice: глупых
  rationale: Передаёт отсутствие здравого смысла и сохраняет нравственно-интеллектуальную оценку исходного слова без излишне резкого или разговорного оттенка.
- source_word: ἀπαιδεύτους
  choice: невежественных
  rationale: Слово указывает на отсутствие обучения, наставления или воспитания; применительно к спорам «невежественных» естественно обозначает их неосведомлённый, непросвещённый характер.
- source_word: ζητήσεις
  choice: споров
  rationale: Хотя существительное может означать вопросы или исследования, в данном контексте речь идёт о спорных рассуждениях, ведущих к ссорам.
- source_word: παραιτοῦ
  choice: избегай
  rationale: Средний императив призывает не принимать участия и уклоняться от таких споров; «избегай» ясно и естественно передаёт этот смысл.
- source_word: εἰδὼς
  choice: зная
  rationale: Деепричастная форма сохраняет структуру греческого причастия и указывает на основание повеления.
- source_word: γεννῶσι
  choice: порождают
  rationale: Сохраняет метафору рождения, но в современном русском естественно выражает причинный смысл.
- source_word: μάχας
  choice: ссоры
  rationale: В этом контексте слово обозначает словесные и межличностные столкновения, а не обязательно физическую борьбу.
- source_word: δὲ
  choice: А
  rationale: Передаёт мягкое противопоставление предыдущему наставлению и естественно звучит в русском связном тексте.
theological_decisions:
- issue: Характер запрещаемых обсуждений
  choice: Передать ζητήσεις как «споры», не распространяя запрет на всякие вопросы и исследования.
  alternative: «вопросы» или «рассуждения»
  rationale: Контекст и результат — ссоры — указывают на конфликтные, бесплодные споры, однако примечание сохраняет более широкие лексические возможности.
translation_notes:
  register: Современный литературный русский язык с краткой, наставительной интонацией. Начальное «А» передаёт связь и мягкий контраст с предыдущим стихом; порядок слов сохраняет смысловой акцент на отвергаемых спорах.
