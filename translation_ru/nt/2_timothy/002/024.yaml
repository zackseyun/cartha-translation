  text: δοῦλον δὲ κυρίου οὐ δεῖ μάχεσθαι, ἀλλὰ ἤπιον εἶναι πρὸς πάντας, διδακτικόν, ἀνεξίκακον,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/024.yaml
  text: And the Lord’s servant must not quarrel[a], but must be gentle toward everyone, able to teach, patient when wronged,
translation:
  language: ru
  text: Слуга[a] Господа не должен вступать в ссоры, а должен быть доброжелателен ко всем, уметь учить и терпеливо переносить обиды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «раб Господа». Греческое слово δοῦλος, в зависимости от контекста, может означать «слуга» или «раб».
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλον (δοῦλος)
  choice: служитель
  rationale: В данном наставлении слово обозначает человека, служащего Господу; «служитель» естественно передаёт эту роль по-русски, тогда как буквальное «раб» сохранено в примечании как значимая лексическая альтернатива.
- source_word: κυρίου (κύριος)
  choice: Господа
  rationale: Родительный падеж естественно передаёт греческое сочетание δοῦλον κυρίου; «Господь» является обычным соответствием κύριος в этом контексте.
- source_word: οὐ δεῖ
  choice: не должен
  rationale: Оборот выражает необходимость и обязательное требование; отрицательная конструкция «не должен» ясно передаёт его предписывающую силу.
- source_word: μάχεσθαι (μάχομαι)
  choice: ссориться
  rationale: В контексте наставления прежде всего имеется в виду склонность к словесным распрям, а не физическая борьба.
- source_word: ἤπιον (ἤπιος)
  choice: мягким
  rationale: Слово описывает кроткое, незлобивое обращение с людьми и противопоставлено склонности ссориться; «мягким» звучит естественно в сочетании «со всеми».
- source_word: πρὸς πάντας
  choice: со всеми
  rationale: Передаёт направленность поведения по отношению ко всем людям и естественно сочетается с русским прилагательным «мягкий».
- source_word: διδακτικόν (διδακτικός)
  choice: способным учить
  rationale: Прилагательное означает пригодность и умение наставлять, а не готовность самому учиться.
- source_word: ἀνεξίκακον (ἀνεξίκακος)
  choice: терпеливо переносить обиды
  rationale: Редкое слово обозначает способность с терпением переносить причинённое зло или дурное обращение, не отвечая раздражением; развёрнутая передача понятна современному читателю.
theological_decisions:
- issue: Передача δοῦλος в наставлении о служении
  choice: служитель
  alternative: раб
  rationale: В стихе на первом плане поведение человека, служащего Господу, поэтому «служитель» ясно передаёт функциональный смысл. Вариант «раб» точнее отражает социальную образность греческого слова и потому сохранён в примечании, не устраняя смыслового напряжения.
- issue: Передача κύριος
  choice: Господь
  alternative: господин
  rationale: В обращённом к христианскому служителю наставлении κύριος относится к Господу; традиционное и контекстуально уместное русское соответствие — «Господь».
translation_notes:
  register: Современный литературный русский язык с ясным наставительным тоном. Синтаксический параллелизм греческого ряда качеств сохранён настолько, насколько это естественно по-русски; значение редкого ἀνεξίκακος раскрыто глагольным оборотом.
