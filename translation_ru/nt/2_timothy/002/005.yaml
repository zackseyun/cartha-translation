  text: And if anyone also competes as an athlete[a], he is not crowned unless he competes according to the rules.
translation:
  language: ru
  text: И если кто-либо состязается, он не получает венца, если не состязается по правилам[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «законно», «надлежащим образом». В контексте состязания греческое наречие, вероятнее всего, означает соблюдение установленных правил.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθλῇ / ἀθλήσῃ
  choice: участвует в состязании / состязается
  rationale: Обе формы глагола ἀθλέω передают образ атлетического состязания. Однокоренные русские выражения сохраняют лексическую связь и ясно передают спортивную метафору.
- source_word: τις
  choice: кто-либо
  rationale: Неопределённое местоимение имеет обобщённое значение; «кто-либо» естественно передаёт его без ненужного указания на пол.
- source_word: στεφανοῦται
  choice: увенчивается
  rationale: Глагол означает возложение венка на победителя. «Увенчивается» кратко сохраняет образ награждения, не уточняя природу награды за пределами текста.
- source_word: νομίμως
  choice: по правилам
  rationale: В контексте состязания наречие указывает на законный, надлежащий порядок участия; «по правилам» ясно и естественно передаёт этот смысл современному читателю.
- source_word: καὶ
  choice: и
  rationale: Передаёт добавление ещё одного примера к образам ближайшего контекста.
- source_word: δὲ
  choice: и
  rationale: Частица обозначает мягкий переход к следующему примеру; в сочетании δὲ καὶ естественно передаётся одним русским союзом «и».
theological_decisions:
- issue: Смысл венца
  choice: Сохранить образ победителя, которого увенчивают, не уточняя духовное значение награды.
  alternative: Истолковать венец прямо как эсхатологическую награду или одобрение служителя.
  rationale: Греческий текст использует спортивную аналогию, но в самом стихе не определяет, какую именно духовную реальность обозначает венец.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная по тону. Спортивная метафора и повтор однокоренных слов сохранены, а неоднозначность образа венца не устранена толкованием.
