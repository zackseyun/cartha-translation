  yaml_path: translation/nt/2_timothy/002/013.yaml
  text: If we are faithless[a], he remains faithful[b], for he cannot deny himself.
translation:
  language: ru
  text: Если мы неверны[a], Он остаётся верен[b]. Отречься от Себя Он не может.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если мы не верим» или «если мы не храним верность». Греческий глагол допускает значения неверия и неверности.'
