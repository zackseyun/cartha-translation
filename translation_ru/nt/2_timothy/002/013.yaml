  - marker: b
    text: 'Или: «остаётся достойным доверия». «Верен» сохраняет контраст со словами «мы неверны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπιστοῦμεν
  choice: мы неверны
  rationale: Глагол может обозначать как неверие, так и неверность. «Мы неверны» естественно по-русски и сохраняет смысловой и словесный контраст с πιστός, а примечание указывает на возможное значение «не верим».
- source_word: πιστὸς
  choice: верен
  rationale: «Верен» сохраняет прямой контраст с «неверны» и передаёт постоянство; возможное значение «достоин доверия» отмечено в сноске.
- source_word: μένει
  choice: остаётся
  rationale: Точно и естественно передаёт продолжающееся постоянство.
- source_word: ἀρνήσασθαι
  choice: отречься
  rationale: «Отречься от Себя» — естественное и сильное русское выражение, передающее отказ или отречение, а не простое словесное отрицание.
- source_word: ἑαυτὸν
  choice: от Себя
  rationale: Возвратное местоимение относится к «Он»; форма с предлогом необходима при русском глаголе «отречься».
- source_word: οὐ δύναται
  choice: не может
  rationale: Кратко и точно выражает невозможность, а не только нежелание.
theological_decisions:
- issue: Смысл Божьей верности перед лицом человеческой неверности
  choice: Текст утверждает неизменную верность Бога, основанную на том, что Он не может отречься от Себя, но не уточняет, проявляется ли здесь прежде всего спасение, исполнение обещаний или исполнение предупреждений о суде.
  alternative: Понимать эту верность исключительно как обещание спасти неверных либо исключительно как верность угрозе суда.
  rationale: Греческий текст сохраняет богословское напряжение и не определяет здесь конкретный исход Божьей верности; перевод не сужает смысл до одной конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным построением. Заглавные буквы в «Он» и «Себя» ясно обозначают отнесённость к Богу. Союз «ведь» естественно передаёт пояснительно-причинную связь между двумя частями, не добавляя отдельного богословского вывода.
