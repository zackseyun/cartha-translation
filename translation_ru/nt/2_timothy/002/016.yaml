    rationale: После «заходить в» естественнее ожидать винительный падеж при значении движения; кроме того, оборот звучит шероховато. Следует передать ἐπὶ πλεῖον προκόπτειν как дальнейшее продвижение по пути нечестия.
  - severity: low
    issue: «Непочтительных пустословий» стилистически тяжеловесно
    rationale: Смысл допустим, но «нечестивых пустословий» более естественно сочетается в современном литературном русском и сохраняет противопоставление святому, присущее βεβήλους.
  revised_text: А нечестивых пустословий[a] избегай, потому что они будут всё дальше продвигаться по пути нечестия.
