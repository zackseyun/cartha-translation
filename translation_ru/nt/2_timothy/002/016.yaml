review_pass:
  verdict: revise
  source_fidelity: 'В целом переданы повеление избегать речи, её двойная характеристика и отрицательное дальнейшее развитие. Однако «предающиеся им» добавляет отношение к пустословиям, которого греческий текст не выражает: подразумеваемое множественное подлежащее следует оставить столь же неуточнённым. Оборот «заходить в нечестии» также неудачен грамматически и менее точно передаёт движение к большей степени ἀσέβεια.'
  naturalness: «Непочтительных пустословий» понятно, но сочетание несколько тяжеловесно для современного русского. «Нечестивых пустословий» естественнее в данном религиозно-нравственном регистре. «Они будут всё дальше продвигаться по пути нечестия» литературно, ясно передаёт отрицательное «продвижение» и не создаёт ложной конструкции управления.
  terminology: «Нечестие» удачно передаёт ἀσέβεια и сохраняет религиозно-нравственный смысл. Для βεβήλους «нечестивых» здесь приемлемо как обозначение речи, чуждой святому; это не сводит термин к простой бессодержательности. «Пустословий» точно передаёт κενοφωνίας.
  issues:
