  text: τὰς δὲ βεβήλους κενοφωνίας περιΐστασο· ἐπὶ πλεῖον γὰρ προκόψουσιν ἀσεβείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/016.yaml
  text: But avoid profane empty talk[a], for they will advance further into ungodliness,
translation:
  language: ru
  text: А нечестивых пустословий[a] избегай, потому что они будут всё дальше продвигаться по пути нечестия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «безбожной болтовни», «пустой болтовни» или «пустых речей».'
    reason: Лексическое сочетание βεβήλους κενοφωνίας допускает разные способы передать одновременно противоположность святому и бессодержательность речи.
lexical_decisions:
- source_word: βεβήλους
  choice: непочтительных
  rationale: Передаёт религиозно-нравственный оттенок того, что лишено святости и не чтит Бога, не сужая значение до обыденности.
- source_word: κενοφωνίας
  choice: пустословий
  rationale: Естественное русское соответствие для речи, пустой по содержанию и не имеющей подлинной ценности.
- source_word: περιΐστασο
  choice: избегай
  rationale: Средний императив призывает держаться в стороне и не вовлекаться; «избегай» кратко и естественно передаёт этот смысл.
- source_word: ἐπὶ πλεῖον
  choice: всё дальше
  rationale: Передаёт нарастание и дальнейшее продвижение, естественно сочетаясь с русским оборотом «заходить в».
- source_word: προκόψουσιν
  choice: будут … заходить
  rationale: Сохраняет образ продвижения, здесь направленного к худшему, и звучит естественно в контексте нравственного упадка.
- source_word: ἀσεβείας
  choice: нечестии
  rationale: «Нечестие» сохраняет направленный против должного почтения к Богу религиозно-нравственный смысл ἀσέβεια.
- source_word: δὲ
  choice: А
  rationale: Обозначает переход с оттенком противопоставления предыдущему наставлению, не утяжеляя русскую фразу.
theological_decisions:
- issue: Описывает ли предупреждение лишь бесполезную речь или также речь, лишённую почтения к святому
  choice: «непочтительных пустословий» сохраняет и пустоту речи, и её религиозно-нравственную порочность.
  alternative: «пустой болтовни» — естественнее разговорно, но ослабляет βεβήλους; «безбожной болтовни» сильнее и может чрезмерно конкретизировать смысл.
  rationale: Сочетание βεβήλους κενοφωνίας характеризует речь одновременно как пустую и противоположную святому; последующее ἀσεβείας подтверждает религиозно-нравственную направленность предупреждения.
- issue: К кому относится подразумеваемое подлежащее προκόψουσιν
  choice: «предающиеся им» делает естественным русский переход к множественному числу, не называя конкретную группу.
  alternative: «они» буквальнее сохраняет невыраженное подлежащее, но в изолированном стихе имеет неясный референт; безличное «это ведёт» устраняет личный субъект исходного текста.
  rationale: Греческая форма имеет невыраженное подлежащее во множественном числе, вероятно людей, вовлечённых в такую речь. Формулировка оставляет круг лиц обобщённым и не превращает речь в грамматический субъект.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Пустословие» общеупотребительно и ёмко; «непочтительный» удерживает связь с отсутствием почтения к святому. Оборот «всё дальше заходить в нечестии» передаёт отрицательное продвижение без искусственной кальки.
