  to: А нечестивых пустословий[a] избегай, потому что они будут всё дальше продвигаться по пути нечестия.
  rationale: Устранено невыраженное в оригинале уточнение субъекта («предающиеся им»). Перестроена заключительная часть, чтобы естественно и точно передать отрицательное продвижение ἐπὶ πλεῖον προκόψουσιν ἀσεβείας. Слово «нечестивых» делает характеристику речи более естественной по-русски, сохраняя религиозно-нравственную силу βεβήλους.
