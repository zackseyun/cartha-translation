    rationale: προκόψουσιν имеет лишь невыраженное подлежащее во множественном числе. Формулировка «предающиеся им» конкретизирует, что речь идёт именно о людях, вовлечённых в эти разговоры, тогда как в контексте подразумеваются их распространители/названные ранее лица; такую конкретизацию лучше не вносить.
  - severity: medium
