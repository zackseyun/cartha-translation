reference: 2 Timothy 4:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: κήρυξον τὸν λόγον, ἐπίστηθι εὐκαίρως ἀκαίρως, ἔλεγξον, ἐπιτίμησον, παρακάλεσον, ἐν πάσῃ μακροθυμίᾳ καὶ διδαχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/002.yaml
  text: Preach the word[a]; be ready in season and out of season; reprove, rebuke, exhort[c][b], with all patience and teaching.
translation:
  language: ru
  text: Проповедуй слово; будь готов[a] вовремя и не вовремя[b]; обличай, укоряй, увещевай[c] — со всем терпением и наставлением.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будь настойчив»; греческий глагол может означать готовность, присутствие рядом или настойчивость.'
    reason: lexical_alternative
  - marker: b
    text: То есть независимо от того, благоприятно время или нет.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ободряй», «настойчиво призывай».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κήρυξον
  choice: проповедуй
  rationale: Императив κηρύσσω обозначает публичное провозглашение. «Проповедуй» естественно для пастырского поручения и сохраняет вес исходного глагола.
- source_word: τὸν λόγον
  choice: слово
  rationale: В контексте речь идёт о возвещаемом апостольском слове, однако греческий текст не уточняет его как «Евангелие» или «Писание»; буквальная широта выражения сохранена.
- source_word: ἐπίστηθι
  choice: будь готов
  rationale: Императив может выражать готовность, присутствие и настойчивость. «Будь готов» естественно сочетается с последующей парой наречий и не устраняет возможный оттенок настойчивости, отмеченный в сноске.
- source_word: εὐκαίρως ἀκαίρως
  choice: вовремя и не вовремя
  rationale: Краткая уравновешенная формула передаёт требование действовать независимо от того, кажутся ли обстоятельства подходящими.
- source_word: ἔλεγξον
  choice: обличай
  rationale: Глагол включает выявление неправоты с целью исправления; «обличай» сохраняет этот смысл и отличается от следующего, более резкого повеления.
- source_word: ἐπιτίμησον
  choice: укоряй
  rationale: «Укоряй» передаёт прямое строгое порицание, оставаясь понятным в современном русском языке и не приобретая современного значения запрета, которое могло бы возникнуть у «запрещай».
- source_word: παρακάλεσον
  choice: увещевай
  rationale: В этом ряду служебных повелений слово обозначает настойчивый призыв, при этом может включать ободрение. «Увещевай» сохраняет оба оттенка лучше, чем более узкие варианты.
- source_word: ἐν πάσῃ μακροθυμίᾳ
  choice: со всем терпением
  rationale: μακροθυμία указывает на продолжительное терпение по отношению к людям; современная формулировка передаёт полноту πάσῃ без архаизма «долготерпение».
- source_word: καὶ διδαχῇ
  choice: и наставлением
  rationale: Существительное διδαχή обозначает обучение или наставление, сопровождающее перечисленные действия. Форма существительного сохранена, чтобы не сужать его до одного отдельного действия.
theological_decisions:
- issue: Объём значения выражения «слово»
  choice: Сохранено «слово» без поясняющего расширения.
  alternative: «весть», «Евангелие» или «Писание»
  rationale: Контекст связывает поручение и с Писанием, и с апостольским возвещением, но сам λόγος здесь прямо не ограничен одним из этих значений.
- issue: Оттенок παρακάλεσον
  choice: «увещевай» с примечанием об альтернативных оттенках
  alternative: «ободряй» или «настойчиво призывай»
  rationale: Глагол способен выражать как настойчивый призыв, так и ободрение; основной текст и сноска вместе сохраняют эту смысловую широту.
translation_notes:
  register: Современный литературный русский язык с достоинством пастырского поручения. Сохранены краткие параллельные императивы оригинала; «укоряй» выбрано вместо потенциально двусмысленного для современного читателя «запрещай», а «терпение» — вместо архаичного «долготерпение».
