id: 2TI.4.10
reference: 2 Timothy 4:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Δημᾶς γάρ με ⸀ἐγκατέλιπεν ἀγαπήσας τὸν νῦν αἰῶνα, καὶ ἐπορεύθη εἰς Θεσσαλονίκην, Κρήσκης εἰς Γαλατίαν, Τίτος εἰς Δαλματίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/010.yaml
  text: For Demas deserted me[a], having loved the present age, and went to Thessalonica; Crescens to Galatia, Titus to Dalmatia.
translation:
  language: ru
  text: Ведь Димас оставил меня, полюбив нынешний век[a], и ушёл в Фессалонику; Крискент — в Галатию, Тит — в Далматию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нынешний мир». Буквально греческое слово обозначает нынешний век или эпоху.'
    reason: Лексическая альтернатива для αἰών; примечание сохраняет возможную передачу «мир», не устраняя временного значения.
lexical_decisions:
- source_word: γάρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующим призывом Павла и естественно звучит в современном русском тексте.
- source_word: ἐγκατέλιπεν
  choice: оставил меня
  rationale: Передаёт серьёзный, нравственно отрицательный характер ухода Димаса, но не добавляет прямого утверждения об отступничестве от веры.
- source_word: ἀγαπήσας
  choice: полюбив
  rationale: Деепричастие сохраняет форму и смысловую связь греческого аористного причастия с оставлением Павла, не фиксируя эту связь исключительно как причинную.
- source_word: τὸν νῦν αἰῶνα
  choice: нынешний век
  rationale: Сохраняет временной и нравственный оттенок αἰών и не создаёт впечатления, будто речь непременно идёт о физическом мире.
- source_word: ἐπορεύθη
  choice: ушёл
  rationale: Естественно обозначает отправление Димаса в названное место и хорошо согласуется с контекстом его ухода от Павла.
- source_word: Θεσσαλονίκην
  choice: Фессалонику
  rationale: Устоявшаяся русская форма названия города с требуемым направительным винительным падежом.
- source_word: Κρήσκης
  choice: Крискент
  rationale: Устоявшаяся русская библейская передача личного имени.
- source_word: Γαλατίαν
  choice: Галатию
  rationale: Устоявшаяся русская форма названия области.
- source_word: Τίτος
  choice: Тит
  rationale: Устоявшаяся русская форма личного имени.
- source_word: Δαλματίαν
  choice: Далматию
  rationale: Устоявшаяся русская форма названия области.
theological_decisions:
- issue: Следует ли передать уход Димаса как явное отступничество от веры или только как оставление Павла
  choice: «оставил меня» — с отрицательной нравственной окраской, но без прямого утверждения об окончательном отступничестве
  alternative: «отрёкся от веры» или иная усиленная формулировка, прямо обозначающая апостасию
  rationale: Стих связывает поступок Димаса с любовью к нынешнему веку, однако прямо говорит об оставлении Павла, а не формулирует окончательный приговор его вере.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Эллипсис в двух последних частях («Крискент — …, Тит — …») сохраняет краткость греческого перечисления и остаётся ясным по глаголу «ушёл».
