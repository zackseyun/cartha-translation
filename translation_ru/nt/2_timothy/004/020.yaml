base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/020.yaml
  text: Erastus remained in Corinth[a], but I left Trophimus sick in Miletus.
translation:
  language: ru
  text: Эраст остался в Коринфе, а Трофима я оставил больным в Милете.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔραστος
  choice: Эраст
  rationale: Личное имя передано в традиционной русской библейской форме.
- source_word: ἔμεινεν
  choice: остался
  rationale: Аорист μένω в данном путевом сообщении обозначает пребывание или оставание в определённом месте; «остался» естественно передаёт этот смысл.
- source_word: ἐν Κορίνθῳ
  choice: в Коринфе
  rationale: Обычное местное значение ἐν с названием города.
- source_word: Τρόφιμον
  choice: Трофима
  rationale: Личное имя передано в традиционной русской библейской форме и поставлено в винительный падеж согласно синтаксису.
- source_word: δὲ
  choice: а
  rationale: Частица выражает мягкое сопоставление двух путевых сообщений; русское «а» сохраняет его без излишне сильного противопоставления.
- source_word: ἀπέλιπον
  choice: я оставил
  rationale: Форма первого лица единственного числа аориста ἀπολείπω прямо указывает на говорящего; местоимение выражено для естественности и ясности русского противопоставления.
- source_word: ἐν Μιλήτῳ
  choice: в Милете
  rationale: Обычное местное значение ἐν с названием города; использована нормативная русская форма топонима.
- source_word: ἀσθενοῦντα
  choice: больным
  rationale: Причастие настоящего времени характеризует состояние Трофима в момент, когда Павел его оставил; творительный предикативный естественно передаёт эту связь.
