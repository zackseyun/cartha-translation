source:
  edition: SBLGNT
  text: λοιπὸν ἀπόκειταί μοι ὁ τῆς δικαιοσύνης στέφανος, ὃν ἀποδώσει μοι ὁ κύριος ἐν ἐκείνῃ τῇ ἡμέρᾳ, ὁ δίκαιος κριτής, οὐ μόνον δὲ ἐμοὶ ἀλλὰ καὶ πᾶσιν τοῖς ἠγαπηκόσι τὴν ἐπιφάνειαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/008.yaml
  text: From now on the crown of righteousness is laid up for me[a], which the Lord, the righteous judge, will award to me on that day—and not only to me, but also to all who have loved his appearing.
translation:
  language: ru
  text: Отныне для меня хранится венец праведности[a], который в тот день вручит мне Господь, праведный Судья, — и не только мне, но и всем, кто возлюбил Его явление.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «венец справедливости». Греческое слово может означать как праведность, так и, в некоторых контекстах, справедливость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λοιπὸν
  choice: А теперь
  rationale: В контексте завершённого поприща слово указывает на то, что отныне остаётся впереди; «А теперь» естественно передаёт переход и временной оттенок.
- source_word: ἀπόκειταί
  choice: уготован
  rationale: Передаёт состояние чего-то отложенного и сохраняемого для человека, не сводя образ к простому ожиданию.
- source_word: ὁ τῆς δικαιοσύνης στέφανος
  choice: венец праведности
  rationale: Сохраняет форму греческого генитивного сочетания и не решает однозначно, является ли праведность основанием награды, её содержанием или характеристикой оправдания.
- source_word: δικαιοσύνης
  choice: праведности
  rationale: «Праведность» — наиболее естественный и традиционно понятный эквивалент в данном контексте; возможный оттенок справедливости отмечен в сноске.
- source_word: ἀποδώσει
  choice: даст
  rationale: Глагол означает воздать или вручить причитающееся; нейтральное «даст» естественно по-русски и не привносит исключительно карательного оттенка.
- source_word: κύριος
  choice: Господь
  rationale: Прямой эквивалент титула; контекст явления и суда указывает на Христа, но это не разворачивается в поясняющий пересказ.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: в тот день
  rationale: Естественное русское выражение, сохраняющее эсхатологическую значимость формулы.
- source_word: ὁ δίκαιος κριτής
  choice: праведный Судья
  rationale: Сохраняет приложение и характеризует Господа как судящего праведно; прописная буква уместна для титульного обозначения Господа.
- source_word: πᾶσιν τοῖς ἠγαπηκόσι
  choice: всем, кто возлюбил
  rationale: Совершенный вид передаёт устойчивую любовь, возникшую ранее и сохраняющую своё значение к настоящему.
- source_word: ἐπιφάνειαν
  choice: явление
  rationale: Прямо передаёт идею зримого обнаружения или появления, не сужая её до более общего «пришествия».
- source_word: αὐτοῦ
  choice: Его
  rationale: Сохраняет местоименную отсылку к Господу; прописная буква соответствует принятому русскому благоговейному оформлению.
theological_decisions:
- issue: Значение выражения «венец праведности»
  choice: Генитивное сочетание сохранено без однозначного истолкования.
  alternative: Венец за праведность; венец, состоящий в праведности; венец оправдания или справедливого воздаяния.
  rationale: Греческая конструкция допускает несколько смысловых отношений, поэтому перевод не должен устранять заложенную в ней неоднозначность.
- issue: Кого обозначает «Господь»
  choice: В основном тексте сохранён титул «Господь»; по контексту речь идёт об Иисусе Христе.
  alternative: Бог в более общем смысле.
  rationale: Упоминание Его явления и роль эсхатологического Судьи в контексте Пастырских посланий указывают на Христа, однако исходный текст использует именно титул, а не имя.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Уготован» сохраняет возвышенный, но понятный регистр; синтаксис сделан плавным, а неоднозначность выражения «венец праведности» сохранена.
