  text: ἔσται γὰρ καιρὸς ὅτε τῆς ὑγιαινούσης διδασκαλίας οὐκ ἀνέξονται, ἀλλὰ κατὰ τὰς ⸂ἰδίας ἐπιθυμίας⸃ ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους κνηθόμενοι τὴν ἀκοήν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/003.yaml
  text: For the time will come when they will not put up with sound teaching[a], but according to their own desires they will heap up teachers for themselves[b], having itching ears.
translation:
  language: ru
  text: Ибо придёт время, когда они не будут терпеть здравого учения[a], но, следуя собственным желаниям, будут набирать себе множество учителей, с зудящим слухом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будут выносить здравого учения»; буквально: «здорового учения».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «испытывая зуд в слухе». Это образ тяги слышать то, что хочется; причастный оборот может описывать сопутствующее состояние или побуждение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρὸς
  choice: время
  rationale: В данном предсказании καιρός обозначает грядущий период или момент; «придёт время» естественно и точно передаёт ἔσται… καιρός.
- source_word: τῆς ὑγιαινούσης διδασκαλίας
  choice: здравого учения
  rationale: Причастие ὑγιαινούσης буквально означает «здоровое» и метафорически указывает на верное, благотворное учение. «Здравое учение» сохраняет метафору и привычно звучит по-русски.
- source_word: οὐκ ἀνέξονται
  choice: не станут терпеть
  rationale: ἀνέχομαι означает «выносить, терпеть, мириться с чем-либо»; эта формулировка передаёт сознательное нежелание принимать такое учение.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας
  choice: следуя собственным желаниям
  rationale: Оборот выражает норму, по которой выбираются учителя. «Желания» сохраняет широкое значение ἐπιθυμίαι и не сужает его до сексуальной похоти.
- source_word: ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους
  choice: будут набирать себе всё больше и больше учителей
  rationale: ἐπισωρεύω рисует накопление, буквально складывание в кучу. Русская формулировка естественно передаёт избыточное умножение учителей и сохраняет возвратную направленность ἑαυτοῖς.
- source_word: κνηθόμενοι τὴν ἀκοήν
  choice: лишь бы те услаждали их слух
  rationale: Идиома буквально говорит о «зудящем слухе» и описывает тягу слышать приятное и желанное. Перевод раскрывает понятный в контексте образ, не превращая причастие в однозначно причинное придаточное.
theological_decisions:
- issue: Передача διδασκαλία в контексте Пастырских посланий
  choice: учение
  alternative: доктрина
  rationale: «Учение» точно передаёт содержание наставления и понятно широкому кругу читателей; «доктрина» звучит более технически и может привнести конфессиональный оттенок.
- issue: Смысл κνηθόμενοι τὴν ἀκοήν
  choice: лишь бы те услаждали их слух
  alternative: потому что у них зуд в ушах; имея зудящий слух
  rationale: Греческое причастие допускает смысл сопутствующего состояния или мотива, не фиксируя строго причинную связь. Основной текст естественно раскрывает идиому, а сноска сохраняет её буквальный образ и неоднозначность связи.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Подлежащее «люди» добавлено для естественности русского текста при подразумеваемом греческом субъекте. Образ накопления передан живым оборотом «всё больше и больше», а непривычная буквальная идиома вынесена в сноску.
