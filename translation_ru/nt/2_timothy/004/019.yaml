  text: Greet Prisca and Aquila[a], and the household of Onesiphorus.
translation:
  language: ru
  text: Приветствуй Приску[a] и Акилу, а также домашних Онисифора.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: По-гречески «Приска»; в других местах она также названа Прискиллой (например, Деян. 18:2, 18, 26).
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄσπασαι
  choice: Приветствуй
  rationale: Аористный императив среднего залога от ἀσπάζομαι здесь выражает обычное эпистолярное поручение передать приветствие. «Приветствуй» естественно и точно сохраняет повелительную форму.
- source_word: Πρίσκαν
  choice: Приску
  rationale: Греческий текст содержит форму Πρίσκαν от имени Πρίσκα, поэтому передано именно «Приску», а не более знакомое «Прискиллу».
- source_word: Ἀκύλαν
  choice: Акилу
  rationale: Традиционная и узнаваемая русская передача личного имени Ἀκύλας.
- source_word: τὸν Ὀνησιφόρου οἶκον
  choice: домашних Онисифора
  rationale: В приветствии οἶκος обозначает не здание, а людей, принадлежащих к дому или домочадцев. «Домашних» естественно передаёт этот социальный смысл, не ограничивая его только кровными родственниками.
