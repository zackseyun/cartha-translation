id: 2TI.4.21
reference: 2 Timothy 4:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Σπούδασον πρὸ χειμῶνος ἐλθεῖν. Ἀσπάζεταί σε Εὔβουλος καὶ Πούδης καὶ Λίνος καὶ Κλαυδία καὶ οἱ ἀδελφοὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/021.yaml
  text: Make every effort to come before winter. Eubulus sends greetings to you[a], and so do Pudens and Linus and Claudia and all the brothers.
translation:
  language: ru
  text: Постарайся прийти до зимы. Тебя приветствуют Еввул, Пуд, Лин и Клавдия, а также все братья.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все братья и сёстры». В греческом тексте стоит слово «братья», но здесь оно может обозначать более широкий круг верующих.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σπούδασον
  choice: Постарайся
  rationale: Аористный императив σπουδάζω выражает настойчивое старание и срочность. «Постарайся» естественно передаёт призыв приложить все усилия; близость зимы сохраняет оттенок безотлагательности.
- source_word: πρὸ χειμῶνος
  choice: до зимы
  rationale: Предлог πρό с родительным падежом обозначает время, предшествующее сезону; «до зимы» — краткий и естественный русский эквивалент.
- source_word: ἐλθεῖν
  choice: прийти
  rationale: Инфинитив дополняет Σπούδασον и обозначает прибытие Тимофея к Павлу. «Прийти» сохраняет ориентацию движения к говорящему.
- source_word: Ἀσπάζεταί σε
  choice: Тебя приветствуют
  rationale: В эпистолярном контексте ἀσπάζομαι передаёт приветствие через автора письма. Русское «тебя приветствуют» звучит естественно; единственное число греческого сказуемого перед первым именем закономерно передано множественным числом для всего составного подлежащего.
- source_word: Εὔβουλος
  choice: Еввул
  rationale: Традиционная русская библейская передача личного имени.
- source_word: Πούδης
  choice: Пуд
  rationale: Традиционная русская форма имени, восходящего к латинскому Pudens.
- source_word: Λίνος
  choice: Лин
  rationale: Традиционная русская библейская форма личного имени.
- source_word: Κλαυδία
  choice: Клавдия
  rationale: Устоявшаяся русская форма личного имени Claudia.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: все братья
  rationale: Греческий текст буквально употребляет существительное мужского рода во множественном числе. Основной текст сохраняет эту форму, не исключая возможности, что речь идёт обо всей общине верующих.
theological_decisions:
- issue: Значение ἀδελφοί применительно к христианской общине
  choice: все братья
  alternative: все братья и сёстры; все верующие
  rationale: Форма исходного текста мужского рода сохранена в основном переводе. Поскольку в раннехристианском употреблении ἀδελφοί могло обозначать смешанную общину, возможное инклюзивное значение отмечено в сноске, а не устранено или утверждено безоговорочно.
translation_notes:
  register: Современный литературный русский язык с естественным эпистолярным звучанием и уважением к традиционным русским формам библейских имён. Структура второго предложения слегка перестроена ради плавности, без изменения состава приветствующих.
