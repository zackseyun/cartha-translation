  text: But I sent Tychicus to Ephesus[a].
translation:
  language: ru
  text: А Тихика я послал в Эфес.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «И Тихика я послал в Эфес» или «Тихика же я послал в Эфес»; греческая частица δέ может обозначать простое продолжение мысли, переход или лёгкое противопоставление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τυχικὸν
  choice: Тихика
  rationale: Личное имя Τυχικός стоит в винительном падеже; передано в принятой русской библейской форме «Тихик» с падежным окончанием.
- source_word: δὲ
  choice: А
  rationale: Частица δέ обозначает переход или лёгкое противопоставление. Русское «а» естественно передаёт эту связь, не усиливая её до резкого «но».
- source_word: ἀπέστειλα
  choice: я послал
  rationale: Аорист действительного залога, первое лицо единственного числа. Простое прошедшее время «послал» естественно передаёт совершившееся действие, не добавляя значения результата, которого сама форма не требует.
- source_word: εἰς
  choice: в
  rationale: При названии города предлог εἰς указывает направление; по-русски это естественно выражается конструкцией «в Эфес».
- source_word: Ἔφεσον
  choice: Эфес
  rationale: Название города передано в общепринятой русской библейской форме; после предлога направления «в» форма винительного падежа совпадает с именительным.
