  text: ⸀ῥύσεταί με ὁ κύριος ἀπὸ παντὸς ἔργου πονηροῦ καὶ σώσει εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/018.yaml
  text: The Lord will rescue me from every evil deed and will bring me safely into his heavenly kingdom[a]. To him be the glory forever and ever[c][b]. Amen.
translation:
  language: ru
  text: Господь избавит меня от всякого злого дела и благополучно приведёт меня в своё небесное Царство[a]. Ему слава во веки веков[b]. Аминь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «спасёт в своё небесное Царство».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в века веков».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥύσεταί
  choice: избавит
  rationale: Глагол ῥύομαι означает избавление или спасение от угрожающей опасности; «избавит» естественно сочетается с оборотом «от всякого злого дела» и не обещает непременно избавления от физической смерти.
- source_word: ἀπὸ παντὸς ἔργου πονηροῦ
  choice: от всякого злого дела
  rationale: 'Передаёт собирательное παντός, обычное значение ἔργον («дело») и нравственную окраску πονηροῦ, сохраняя при этом неоднозначность: речь может идти и о чужом злодействе, и о всяком злом деле вообще.'
- source_word: σώσει εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον
  choice: благополучно приведёт меня в своё небесное Царство
  rationale: Оборот передаёт как спасительное сохранение в σώσει, так и направленность/вхождение, выраженные εἰς; по-русски он звучит естественнее буквального «спасёт в».
- source_word: ᾧ ἡ δόξα
  choice: Ему слава
  rationale: Краткая и естественная русская форма славословия, сохраняющая именную конструкцию греческого текста.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  rationale: Устоявшийся, понятный и стилистически достойный русский эквивалент семитизированной греческой формулы бесконечной длительности.
- source_word: ἀμήν
  choice: Аминь
  rationale: Традиционная русская транслитерация литургического подтверждения.
theological_decisions:
- issue: Соотношение нынешнего избавления и окончательного спасения
  choice: Первая часть говорит об избавлении от всякого злого дела, а вторая — об окончательном и безопасном вхождении в небесное Царство.
  alternative: Понимать обещание как гарантию избавления Павла от казни или иной физической смерти.
  rationale: Сочетание ῥύσεταί, σώσει и указания на небесное Царство позволяет сохранить уверенность Павла в Божьем избавлении, не превращая её в обещание избежать мученической смерти.
- issue: Объём выражения «всякое злое дело»
  choice: Сохранена широкая формулировка без уточнения, чьё именно это дело.
  alternative: Передать как избавление только от собственных греховных поступков либо только от злодейств других людей.
  rationale: Греческий оборот сам по себе не называет деятеля, поэтому перевод не должен искусственно сужать значение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского славословия. «Благополучно приведёт» выбрано вместо неестественного буквального «спасёт в»; «во веки веков» сохранено как широко понятная высокая формула. Местоимение «своё» дано со строчной буквы по современной русской орфографической норме.
