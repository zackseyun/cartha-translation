  text: Ἐν τῇ πρώτῃ μου ἀπολογίᾳ οὐδείς μοι ⸀παρεγένετο, ἀλλὰ πάντες με ⸀ἐγκατέλιπον— μὴ αὐτοῖς λογισθείη—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/016.yaml
  text: At my first defense no one stood with me[a], but all deserted me[c][b]. May it not be counted against them.
translation:
  language: ru
  text: При моей первой защите никто не явился поддержать меня[a] — все меня оставили. Пусть это не вменится им[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «никто не явился ко мне» или «никто не был рядом со мной»; по смыслу — никто не явился поддержать Павла при его защите.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Да не будет это поставлено им в вину».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολογίᾳ
  choice: защите
  rationale: В данном судебном контексте слово обозначает официальную защитительную речь или выступление перед властями; «защита» естественно и кратко передаёт юридический смысл.
- source_word: πρώτῃ
  choice: первой
  rationale: Прямо передаёт начальную стадию или первый случай судебной защиты, не уточняя сверх текста, было ли это отдельным слушанием.
- source_word: οὐδείς μοι παρεγένετο
  choice: никто не выступил в мою поддержку
  rationale: Глагол буквально указывает на прибытие или присутствие рядом; в судебной ситуации выражение означает, что никто не явился поддержать Павла. Перевод передаёт и присутствие, и поддержку.
- source_word: ἐγκατέλιπον
  choice: оставили
  rationale: Слово означает покинуть человека в трудном положении. «Оставили» сохраняет серьёзность поступка, звучит естественно и не усиливает текст до более эмоционального «предали».
- source_word: μὴ αὐτοῖς λογισθείη
  choice: Пусть это не вменится им
  rationale: Пассивный оптатив с μή выражает пожелание или молитвенную просьбу. «Не вменится» сохраняет образ занесения поступка на чей-либо счёт и уместно звучит в возвышенном, но современном русском регистре.
theological_decisions:
- issue: Тон заключительного пожелания Павла в адрес оставивших его
  choice: «Пусть это не вменится им» как молитвенное пожелание о невменении вины
  alternative: «Да не будет это поставлено им в вину»
  rationale: Оптатив λογισθείη с μή естественно выражает пожелание, а не простое утверждение. Формулировка сохраняет мотив прощения и невменения, не уточняя, кем именно и в каком окончательном смысле поступок не должен быть вменён.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным судебно-молитвенным регистром. Тире передаёт резкий контраст ἀλλά. Формулировки избегают архаизмов, кроме понятного в данном контексте глагола «вмениться», сохраняющего важный смысловой образ.
