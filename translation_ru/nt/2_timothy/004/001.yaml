  source_fidelity: 'Основная смысловая структура передана верно: торжественное поручение совершается перед Богом и Мессией Иисусом, будущим Судьёй живых и мёртвых; затем следуют Его явление и Царство как элементы формулы поручения. Однако «будет судить» сглаживает добавочное значение μέλλω («предстоит», «намеревается/должен в будущем» в зависимости от контекста). Безопаснее передать его как «Которому предстоит судить» и сохранить простое будущее в сноске. «Готов судить» не является удачной нейтральной альтернативой для μέλλω.'
