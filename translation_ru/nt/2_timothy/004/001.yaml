source:
  edition: SBLGNT
  text: ⸀Διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς, ⸀καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/001.yaml
  text: 'I solemnly charge you before God and Messiah Jesus[a], who is about to judge the living and the dead[b], and by his appearing and his kingdom:'
translation:
  language: ru
  text: 'Торжественно поручаю тебе перед Богом и Мессией Иисусом, Которому предстоит судить живых и мёртвых[a], — Его явлением и Его царством[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Который будет судить живых и мёртвых».'
    reason: μέλλω с инфинитивом может выражать предстоящее действие или общее будущее; основной текст сохраняет оттенок предстояния.
  - marker: b
    text: 'Возможно также: «и Его явление, и Его царство»; в греческом синтаксическая связь этих слов оставлена менее явной.'
    reason: Винительные формы «явление» и «царство» можно понимать как продолжение формулы торжественного поручения либо как более свободно присоединённые однородные элементы.
lexical_decisions:
- source_word: Διαμαρτύρομαι
  choice: Заклинаю тебя
  rationale: В контексте торжественного поручения глагол выражает настоятельное, solemnное увещание; местоимение «тебя» восполняет подразумеваемый из контекста объект и естественно по-русски предваряет следующие повеления.
- source_word: ἐνώπιον
  choice: перед
  rationale: Кратко и естественно передаёт смысл присутствия и свидетельства Бога и Мессии Иисуса.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Мессией Иисусом
  rationale: Χριστός здесь сохраняет значение титула; «Мессия» передаёт его иудейско-мессианский смысл, не превращая в часть имени.
- source_word: τοῦ μέλλοντος κρίνειν
  choice: Который будет судить
  rationale: μέλλω с инфинитивом допускает как оттенок предстоящего действия, так и более общее будущее значение. В данном эсхатологическом высказывании «будет судить» звучит естественно и не навязывает сильной временной непосредственности.
- source_word: ζῶντας καὶ νεκρούς
  choice: живых и мёртвых
  rationale: Устоявшаяся и точная передача субстантивированных форм, сохраняющая всеобщий охват суда.
- source_word: ἐπιφάνειαν
  choice: явлением
  rationale: «Явление» непосредственно передаёт видимое обнаружение или пришествие в эсхатологическом контексте, не добавляя лишнего толкования.
- source_word: βασιλείαν
  choice: Царством
  rationale: «Царство» — обычное и контекстуально уместное соответствие, способное обозначать и царскую власть, и её область.
theological_decisions:
- issue: Передача Χριστός как титула
  choice: Мессией Иисусом
  alternative: Христом Иисусом
  rationale: В торжественном описании будущего Судьи титульное значение остаётся заметным; «Мессия» сохраняет его явно.
- issue: Временная сила μέλλω
  choice: будет судить
  alternative: готов судить / которому предстоит судить
  rationale: Греческая конструкция может обозначать предстоящее будущее без указания точного срока. Основной текст избегает преувеличенного оттенка немедленности, а более буквальная возможность отмечена в сноске.
- issue: Синтаксическая связь καὶ τὴν ἐπιφάνειαν...
  choice: 'понимать как продолжение формулы заклятия: «Его явлением и Его Царством»'
  alternative: 'простое присоединение: «и Его явление, и Его Царство»'
  rationale: Винительные формы естественно понимать как дополнительные основания торжественного заклятия, хотя греческая связь выражена не вполне явно; двусмысленность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. «Заклинаю» передаёт силу апостольского поручения; прописные буквы в «Который» и «Царством» соответствуют принятому русскому религиозному оформлению, не меняя смысла оригинала.
