  text: καὶ ἀπὸ μὲν τῆς ἀληθείας τὴν ἀκοὴν ἀποστρέψουσιν, ἐπὶ δὲ τοὺς μύθους ἐκτραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/004.yaml
  text: and they will turn away their hearing from the truth[b][a], and turn aside to myths.
translation:
  language: ru
  text: и отвратят свой слух[a] от истины, а обратятся к мифам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уши»; греч. «слух».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «басням».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθείας
  choice: истины
  rationale: Определённая форма и контекст указывают на признанную истину, но перевод не сужает значение до «Евангелия» или «здравого учения».
- source_word: ἀκοὴν
  choice: слух
  rationale: Передаёт греческое существительное со значением способности или действия слышать и сохраняет образ сознательного отказа слушать.
- source_word: ἀποστρέψουσιν
  choice: отвратят
  rationale: Глагол выражает активное отворачивание; сочетание «отвратят слух от» близко передаёт греческую конструкцию и звучит достойно по-русски.
- source_word: μύθους
  choice: мифам
  rationale: Прямой современный эквивалент для вымышленных или спекулятивных повествований; «басням» возможно, но может ассоциироваться с литературным жанром.
- source_word: ἐκτραπήσονται
  choice: обратятся
  rationale: Естественно передаёт направленное движение к мифам и допускаемое формой средне-непереходное значение, не уточняя внешнюю причинность.
- source_word: ἀπὸ μὲν ... ἐπὶ δὲ
  choice: от ... а ... к
  rationale: 'Противительный союз «а» и предлоги направления сохраняют резкий контраст: прочь от истины — к мифам.'
theological_decisions:
- issue: Смысл выражения «истина» в контексте
  choice: истина
  alternative: здравое учение; евангельская истина
  rationale: Контекст связывает истину с апостольским учением, однако сам стих использует более широкое слово; перевод сохраняет его богословскую широту.
- issue: Агент действия при ἐκτραπήσονται
  choice: обратятся
  alternative: будут обращены; уклонятся
  rationale: Средне-пассивная форма допускает разные оттенки; возвратный русский глагол сохраняет неоднозначность и не вводит явно внешнего деятеля.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. «Отвратят слух» несколько торжественнее разговорной речи, но ясно и точно сохраняет исходный образ; параллелизм «от истины… к мифам» подчёркнут союзом «а».
