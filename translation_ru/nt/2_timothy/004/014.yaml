  text: Ἀλέξανδρος ὁ χαλκεὺς πολλά μοι κακὰ ἐνεδείξατο— ⸀ἀποδώσει αὐτῷ ὁ κύριος κατὰ τὰ ἔργα αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/014.yaml
  text: Alexander the metalworker showed me many evils[c][b][a]; the Lord will repay him according to his works.
translation:
  language: ru
  text: Александр, мастер по металлу[a], причинил мне много зла[b]. Господь воздаст ему по его делам[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «медник»; возможно также: «мастер по меди или бронзе».'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «проявил по отношению ко мне много злого».'
    reason: lexical_alternative
  - marker: c
    text: 'В некоторых рукописях: «Пусть Господь воздаст ему по его делам».'
    reason: textual_variant
lexical_decisions:
- source_word: χαλκεὺς
  choice: мастер по металлу
  rationale: Слово обозначает ремесленника, работающего с металлом, часто с медью или бронзой. Общее выражение не уточняет металл сверх того, что позволяет контекст, и понятно современному читателю.
- source_word: πολλά μοι κακὰ ἐνεδείξατο
  choice: причинил мне много зла
  rationale: Греческий оборот буквально говорит о проявлении по отношению к Павлу многих злых вещей. По-русски выбран естественный оборот, сохраняющий множественность и нравственную окраску κακά.
- source_word: ἀποδώσει
  choice: воздаст
  rationale: Будущее время ἀποδίδωμι выражает воздаяние за содеянное. «Воздаст» кратко и точно передаёт судебно-нравственный оттенок.
- source_word: κύριος
  choice: Господь
  rationale: Определённое обозначение Господа передано в соответствии с устойчивым русским библейским употреблением.
- source_word: κατὰ τὰ ἔργα αὐτοῦ
  choice: по его делам
  rationale: Формулировка близка к греческому тексту, естественна по-русски и сохраняет связь воздаяния с совершёнными делами.
theological_decisions:
- issue: Передавать ли ἀποδώσει как утверждение о будущем воздаянии или как пожелание
  choice: Господь воздаст ему
  alternative: Пусть Господь воздаст ему
  rationale: В основном тексте SBLGNT стоит будущее изъявительное ἀποδώσει, поэтому перевод передаёт утверждение, а не молитву-проклятие. Вариант некоторых рукописей сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Основной текст избегает неестественной кальки «показал мне много зол», но сохраняет её смысл в сноске; традиционное «медник» также приведено как допустимая более узкая передача.
