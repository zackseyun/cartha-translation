source:
  edition: SBLGNT
  text: ὁ δὲ κύριός μοι παρέστη καὶ ἐνεδυνάμωσέν με, ἵνα δι’ ἐμοῦ τὸ κήρυγμα πληροφορηθῇ καὶ ⸀ἀκούσωσιν πάντα τὰ ἔθνη, καὶ ἐρρύσθην ἐκ στόματος λέοντος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/017.yaml
  text: But the Lord stood by me and strengthened me[a], so that through me the proclamation might be fully accomplished and all the Gentiles might hear[b], and I was rescued from the lion’s mouth.
translation:
  language: ru
  text: Но Господь был рядом со мной и укрепил меня, чтобы через меня проповедь была возвещена во всей полноте и чтобы её услышали все народы[a], и я был избавлен из пасти льва[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все язычники». Греческое ἔθνη может означать как «народы», так и «язычники»; здесь, вероятно, имеются в виду нееврейские народы, которые услышат Благую весть.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «из пасти льва» может образно означать избавление от смертельной опасности, а не спасение от буквального льва.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ κύριός
  choice: Но Господь
  rationale: δέ передаёт противопоставление предыдущему стиху, а κύριος — традиционным и контекстуально уместным словом «Господь» без уточнения референта.
- source_word: μοι παρέστη
  choice: был рядом со мной
  rationale: Передаёт не только присутствие, но и поддерживающее участие; это естественное выражение на современном русском.
- source_word: ἐνεδυνάμωσέν με
  choice: укрепил меня
  rationale: Сохраняет смысл дарования силы и соответствует возвышенному, но понятному библейскому регистру.
- source_word: ἵνα δι’ ἐμοῦ
  choice: чтобы через меня
  rationale: Сохраняет целевое значение ἵνα и посредническо-инструментальный смысл διά с родительным падежом.
- source_word: τὸ κήρυγμα πληροφορηθῇ
  choice: проповедь была совершена во всей полноте
  rationale: '«Проповедь» охватывает провозглашение вести, а оборот «совершена во всей полноте» передаёт многозначность πληροφορέω: полностью исполнить, довести до полноты, осуществить.'
- source_word: ἀκούσωσιν πάντα τὰ ἔθνη
  choice: её услышали все народы
  rationale: Местоимение естественно обозначает проповедь. «Все народы» сохраняет широкий этнический смысл ἔθνη; возможное значение «все язычники» отмечено в сноске.
- source_word: ἐρρύσθην
  choice: я был избавлен
  rationale: Точно передаёт спасение от опасности и естественно сочетается с библейским образом пасти льва.
- source_word: ἐκ στόματος λέοντος
  choice: из пасти льва
  rationale: Русское «пасть» является естественным соответствием στόμα применительно ко льву и сохраняет образ без его истолкования.
theological_decisions:
- issue: Кого обозначает «Господь»
  choice: Оставлено просто «Господь»
  alternative: Иисус Христос конкретно; Бог в более общем смысле
  rationale: Контекст допускает отнесение к воскресшему Христу, однако сам стих не уточняет референта, поэтому перевод не должен делать это за автора.
- issue: Смысл выражения «из пасти льва»
  choice: Образ сохранён буквально
  alternative: Нерон; сатана; буквальная казнь зверями; общее обозначение смертельной опасности
  rationale: Текст не определяет конкретного референта образа; буквальная передача сохраняет историческую и богословскую неоднозначность.
- issue: Значение πάντα τὰ ἔθνη
  choice: «все народы» в основном тексте
  alternative: «все язычники»
  rationale: ἔθνη допускает оба значения. «Народы» ближе сохраняет широту греческой формулировки, тогда как вероятный миссионерский акцент на неевреях указан в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся близким к греческому развитию мысли, но избегает неестественных калек. Образы и смысловые неоднозначности сохранены.
