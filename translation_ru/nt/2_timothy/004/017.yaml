- from: Но Господь был рядом со мной и укрепил меня, чтобы через меня проповедь была совершена во всей полноте и её услышали все народы[a]; и я был избавлен из пасти льва[b].
  to: Но Господь был рядом со мной и укрепил меня, чтобы через меня проповедь была возвещена во всей полноте и чтобы её услышали все народы[a], и я был избавлен из пасти льва[b].
  rationale: Исправлен только неестественный русский способ выразить πλήροφορηθῇ и согласована временно-модальная формулировка пояснения в сноске. Альтернативное значение ἔθνη и образ «пасти льва» сохранены без конфессионального или исторического истолкования.
