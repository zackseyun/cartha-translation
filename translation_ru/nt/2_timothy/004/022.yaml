  text: Ὁ ⸀κύριος μετὰ τοῦ πνεύματός σου. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/022.yaml
  text: The Lord be with your spirit[a]. Grace be with you all.
translation:
  language: ru
  text: Господь да будет с твоим духом.[a] Благодать да будет со всеми вами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь единственное число: «с твоим духом», а далее — множественное: «со всеми вами».'
    reason: Уточнение грамматического перехода от личного обращения к группе адресатов.
lexical_decisions:
- source_word: κύριος
  choice: Господь
  rationale: Обычный новозаветный эквивалент титула κύριος; в заключительном благословении Павла, вероятнее всего, относится к Иисусу, но перевод не уточняет референта сверх греческого текста.
- source_word: μετά + genitive
  choice: да будет с
  rationale: В греческом глагол опущен, однако формула благословения подразумевает пожелание; русское «да будет с» естественно и точно передаёт этот смысл.
- source_word: πνεύματός
  choice: духом
  rationale: Местоимение «твоим» указывает на дух Тимофея; строчная буква сохраняет наиболее естественное прочтение и не отождествляет слово прямо со Святым Духом.
- source_word: σου
  choice: твоим
  rationale: 'Сохранено единственное число: первая часть обращена лично к Тимофею.'
- source_word: χάρις
  choice: Благодать
  rationale: Устоявшийся и содержательно точный эквивалент χάρις в заключительной Павловой формуле.
- source_word: ὑμῶν
  choice: со всеми вами
  rationale: Форма множественного числа передана явно; «всеми» делает заметным переход от личного обращения к более широкому кругу адресатов, не изменяя смысла.
theological_decisions:
- issue: Кого обозначает «Господь»
  choice: Титул сохранён без добавления имени; в контексте, вероятнее всего, имеется в виду Господь Иисус.
  alternative: Общее указание на Бога.
  rationale: Павловы заключительные благословения обычно употребляют «Господь» применительно к Иисусу, однако сам стих имени не называет, поэтому перевод сохраняет исходную степень определённости.
- issue: Переход от единственного числа к множественному
  choice: Первая фраза обращена к Тимофею лично, вторая — ко всем связанным с посланием адресатам.
  alternative: Понимать обе фразы как обращённые только к Тимофею.
  rationale: Греческий текст отчётливо различает единственное σου и множественное ὑμῶν; этот переход следует сохранить.
translation_notes:
  register: Современный литературный русский язык с достоинством заключительного благословения. Частица «да» передаёт подразумеваемое пожелание; архаические формы и конфессионально специфические добавления исключены.
