  yaml_path: translation/nt/2_timothy/004/011.yaml
  text: Luke alone is with me. Pick up Mark and bring him with you, for he is useful to me for ministry.
translation:
  language: ru
  text: Со мной только Лука. Возьми Марка и приведи его с собой, ведь он полезен мне для служения.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для помощи». Греческое слово διακονία может обозначать служение или помощь в широком смысле; здесь, вероятно, имеется в виду труд служения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λουκᾶς
  choice: Лука
  rationale: Устоявшаяся русская форма личного имени.
- source_word: μόνος
  choice: один
  rationale: 'Передаёт исключительность: из спутников с Павлом остался только Лука; в сочетании «остался один Лука» звучит естественно по-русски.'
- source_word: μετ’ ἐμοῦ
  choice: со мной остался
  rationale: Предлог μετά с родительным означает совместное пребывание; перестройка фразы с глаголом «остался» естественно выражает текущую ситуацию, подразумеваемую контекстом.
- source_word: Μᾶρκον
  choice: Марка
  rationale: Устоявшаяся русская форма личного имени в требуемом падеже.
- source_word: ἀναλαβὼν
  choice: возьми
  rationale: 'Причастие обозначает действие, предшествующее повелению ἄγε: Тимофей должен взять Марка с собой, а затем привести к Павлу.'
- source_word: ἄγε
  choice: приведи
  rationale: Повелительная форма ἄγω в данном контексте означает привести человека к говорящему; объект восстанавливается из упоминания Марка.
- source_word: μετὰ σεαυτοῦ
  choice: с собой
  rationale: Естественная русская передача сопровождения применительно к адресату повеления.
- source_word: γάρ μοι
  choice: потому что он ... мне
  rationale: γάρ вводит основание просьбы, а μοι указывает, кому Марк полезен.
- source_word: εὔχρηστος
  choice: полезен
  rationale: Точно и понятно передаёт значение пригодности и пользы без лишнего уточнения.
- source_word: εἰς διακονίαν
  choice: в служении
  rationale: Передаёт направленность пользы Марка применительно к служению; сохраняет возможную широту διακονία и не превращает её в название формальной должности.
theological_decisions:
- issue: Значение διακονία в описании пользы Марка
  choice: служение
  alternative: помощь; дело служения
  rationale: «Служение» соответствует вероятному контексту труда Павла, но остаётся достаточно широким и не обозначает конкретной церковной должности. Сноска отмечает более общее значение исходного слова.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. «Со мной остался один Лука» естественнее буквального «только Лука со мной» и сохраняет акцент на том, что Лука — единственный оставшийся спутник. Последовательность «возьми ... и приведи» отражает отношение греческого причастия к главному повелению.
