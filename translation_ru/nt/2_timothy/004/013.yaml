base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/013.yaml
  text: When you come[a], bring the cloak that I left in Troas with Carpus, and the books[b], especially the parchments.
translation:
  language: ru
  text: Когда придёшь, принеси плащ[b], который я оставил в Троаде у Карпа, а также книги[a], особенно пергаменты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свитки»; греческое слово может обозначать свитки и другие письменные материалы.'
    reason: lexical_alternative
  - marker: b
    text: Некоторые понимают слово «плащ» как футляр или обёртку для книг, однако его обычное значение — верхняя одежда.
    reason: lexical_alternative
lexical_decisions:
- source_word: φαιλόνην
  choice: плащ
  rationale: Обычное и наиболее вероятное значение — верхняя одежда, плащ; предложенное значение «футляр для книг» менее убедительно и отмечено в сноске.
- source_word: ἀπέλιπον
  choice: я оставил
  rationale: Прямо передаёт аорист ἀπολείπω и естественно звучит по-русски.
- source_word: παρὰ Κάρπῳ
  choice: у Карпа
  rationale: παρά с дательным здесь указывает на нахождение вещи у человека, вероятно на хранении или в его доме.
- source_word: ἐρχόμενος
  choice: когда пойдёшь
  rationale: Деепричастие имеет обстоятельственное временное значение при повелительном φέρε; в русском контексте просьбы принести вещи естественно «когда пойдёшь».
- source_word: φέρε
  choice: принеси
  rationale: Повелительная форма φέρω в этом контексте означает доставить предметы говорящему.
- source_word: τὰ βιβλία
  choice: книги
  rationale: βιβλία обозначает письменные материалы или книги, нередко в форме свитков; физический формат не уточняется, поэтому альтернатива вынесена в сноску.
- source_word: μάλιστα
  choice: особенно
  rationale: Передаёт выделение пергаментов среди прочих письменных материалов.
- source_word: τὰς μεμβράνας
  choice: пергаменты
  rationale: μεμβράναι — письменные материалы из обработанной кожи; «пергаменты» является точным и устоявшимся соответствием.
