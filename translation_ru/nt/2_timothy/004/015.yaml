base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/015.yaml
  text: You also must beware of him[a], for he strongly opposed our words.
translation:
  language: ru
  text: Остерегайся его и ты, потому что он сильно противился нашим словам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нашей вести»; «нашему учению». В греческом: «нашим словам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: его
  rationale: Относительное местоимение относится к Александру из предыдущего стиха; в русском естественно передать его личным местоимением.
- source_word: καὶ σὺ
  choice: и ты
  rationale: Сохраняет присоединительное значение καί и смысловое выделение Тимофея посредством σὺ.
- source_word: φυλάσσου
  choice: остерегайся
  rationale: Настоящее повелительное среднего залога выражает личную и продолжающуюся осмотрительность; «остерегайся» естественно передаёт предупреждение.
- source_word: λίαν
  choice: очень сильно
  rationale: Наречие усиливает глагол; сочетание передаёт высокую степень противодействия на современном русском языке.
- source_word: ἀντέστη
  choice: противился
  rationale: Аорист ἀνθίστημι означает активное сопротивление или выступление против; «противился» сохраняет эту силу и естественно сочетается с дательным падежом.
- source_word: τοῖς ἡμετέροις λόγοις
  choice: нашим словам
  rationale: Буквально и без неоправданного сужения передаёт λόγοι, которое в контексте может обозначать сказанное, весть или учение.
theological_decisions:
- issue: Объём значения «нашим словам»
  choice: Сохранено буквальное «нашим словам» без уточнения характера речи.
  alternative: «нашей вести», «нашему учению» или «нашим свидетельским показаниям»
  rationale: Греческая фраза не определяет однозначно, идёт ли речь о проповеди, учении либо судебном свидетельстве; перевод сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык; прямое и серьёзное наставление. Порядок «и ты» сохраняет акцент оригинала, а формулировка «нашим словам» — его смысловую неоднозначность.
