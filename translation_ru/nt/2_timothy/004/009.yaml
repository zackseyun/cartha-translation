  text: Σπούδασον ἐλθεῖν πρός με ταχέως·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/009.yaml
  text: Make every effort to come to me quickly[a].
translation:
  language: ru
  text: Приложи все усилия, чтобы прийти ко мне поскорее[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Постарайся скорее прийти ко мне»; также возможно: «Приложи все усилия, чтобы быстро прийти ко мне».'
    reason: Лексическое значение ταχέως допускает оттенки «скоро» и «быстро», а σπούδασον можно передать более кратко как «постарайся».
lexical_decisions:
- source_word: Σπούδασον
  choice: Приложи все усилия
  rationale: Аористный императив σπουδάζω выражает усердие, старание и целенаправленное усилие, а не только быстроту. Такой перевод сохраняет это значение и не сливает его со значением ταχέως.
- source_word: ἐλθεῖν
  choice: чтобы прийти
  rationale: Инфинитив ἔρχομαι зависит от σπούδασον; при πρός με естественный русский перевод — «прийти ко мне». Союз «чтобы» делает конструкцию современной и плавной.
- source_word: πρός με
  choice: ко мне
  rationale: Предлог πρός с винительным падежом обозначает движение к лицу; «ко мне» точно и естественно передаёт направление.
- source_word: ταχέως
  choice: поскорее
  rationale: Наречие допускает значения быстроты и скорого наступления. В данном призыве «поскорее» естественно передаёт срочность, сохраняя её отдельно от выраженного в σπούδασον усердия.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; личная просьба передана ясно, достойно и без архаизмов. Различие между усердным усилием (Σπούδασον) и срочностью (ταχέως) сохранено.
