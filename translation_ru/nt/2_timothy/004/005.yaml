source:
  edition: SBLGNT
  text: σὺ δὲ νῆφε ἐν πᾶσιν, κακοπάθησον, ἔργον ποίησον εὐαγγελιστοῦ, τὴν διακονίαν σου πληροφόρησον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/005.yaml
  text: But as for you[a], keep a clear head in all things, endure hardship, do the work of an evangelist[c][b], fully carry out your ministry.
translation:
  language: ru
  text: Но ты во всём сохраняй трезвость ума[a], переноси тяготы[b], совершай труд благовестника, полностью исполни своё служение[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будь рассудителен», «сохраняй ясность ума» или «будь трезв». Греческий глагол буквально означает «быть трезвым», но в Новом Завете употребляется образно — о ясности мысли, самообладании и стойкости.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «терпи лишения» или «переноси страдания».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «доведи своё служение до полной меры». Греческий глагол выражает полное осуществление порученного дела.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Но ты
  rationale: Местоимение σὺ выражает личное усиление, а δέ противопоставляет Тимофея людям, описанным выше. «Но ты» естественно и кратко передаёт оба оттенка по-русски.
- source_word: νῆφε
  choice: сохраняй трезвость ума
  rationale: Глагол буквально связан с трезвостью, но в Новом Завете употребляется образно — о ясности мысли, самообладании и стойкости. Выражение сохраняет исходный образ и ясно передаёт его смысл современному читателю.
- source_word: ἐν πᾶσιν
  choice: во всём
  rationale: Фраза наиболее естественно относится к νῆφε и выражает всеохватность, не уточняя без основания, имеются ли в виду любые обстоятельства, дела или моменты.
- source_word: κακοπάθησον
  choice: переноси страдания
  rationale: Императив призывает принимать страдания и стойко проходить через них. «Переноси» передаёт не только наличие тягот, но и требуемую выдержку.
- source_word: ἔργον ποίησον
  choice: совершай дело
  rationale: Естественно передаёт греческое сочетание и сохраняет повелительную силу. Несовершенный вид русского императива уместно выражает продолжающуюся обязанность.
- source_word: εὐαγγελιστοῦ
  choice: благовестника
  rationale: Слово обозначает человека, возвещающего Благую весть. «Благовестник» — точный, укоренённый и понятный в библейском контексте русский эквивалент.
- source_word: τὴν διακονίαν σου
  choice: своё служение
  rationale: В контексте порученного Тимофею труда по возвещению и наставлению «служение» точнее общего слова «служба». Возвратное «своё» естественно при обращённом к Тимофею императиве.
- source_word: πληροφόρησον
  choice: исполни до конца
  rationale: Глагол здесь передаёт полное осуществление поручения. Добавление «до конца» ясно выражает полноту исполнения и не сводит фразу к формальному выполнению.
theological_decisions:
- issue: Характер поручения Тимофею в слове διακονία
  choice: «служение»
  alternative: «служба» или «дело служения»
  rationale: Ближайший контекст говорит о порученной Тимофею работе по возвещению вести и исполнению пастырского долга. «Служение» отражает этот контекст, не связывая текст с какой-либо особой церковной должностью.
- issue: Значение πληροφόρησον
  choice: «исполни своё служение до конца»
  alternative: «полностью исполни своё служение»
  rationale: Перевод сохраняет идею полного доведения поручения до исполнения, не решая сверх текста, относится ли акцент прежде всего к полноте объёма или к завершению во времени.
translation_notes:
  register: Современный литературный русский язык с ясным, личным и торжественно-наставительным тоном. Синтаксис сохраняет последовательность четырёх повелений оригинала; лексика понятна обычному читателю и не вводит конфессионально специфических толкований.
