base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/006.yaml
  text: For I am already being poured out as a drink offering[b][a], and the time of my departure has come.
translation:
  language: ru
  text: Ведь меня уже изливают как жертвенное возлияние[a], и время моего ухода[b] настало.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я уже изливаюсь». Греческий глагол обозначает излияние возлияния и вызывает образ жертвенного приношения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «освобождения» или «разрешения». Здесь «уход» — образное обозначение смерти.'
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: изливаюсь как возлияние
  rationale: Средне-пассивная форма настоящего времени передаёт происходящее действие, а добавление «как возлияние» ясно сохраняет культовый образ жертвенного излияния, заключённый в греческом глаголе.
- source_word: ἤδη
  choice: уже
  rationale: Указывает, что изображаемое действие уже происходит, подчёркивая близость смерти Павла.
- source_word: γὰρ
  choice: ведь
  rationale: Естественно передаёт пояснительную связь с предыдущими словами, не превращая её в более жёсткую причинную конструкцию.
- source_word: καιρός
  choice: время
  rationale: В данном контексте обозначает наступивший решающий момент; обычное русское «время» естественно в сочетании «время… настало».
- source_word: ἀναλύσεώς
  choice: ухода
  rationale: Сохраняет эвфемистический образ смерти как отбытия и не сводит многозначный термин к буквальному «развязыванию» или «освобождению».
- source_word: ἐφέστηκεν
  choice: настало
  rationale: 'Передаёт результативное значение перфекта: время уже пришло и теперь налицо.'
theological_decisions:
- issue: Метафорическое описание близкой смерти Павла
  choice: 'Сохранены два образа: Павел уже «изливается как возлияние», а время его «ухода» настало.'
  alternative: 'Передать смысл прямо: «я уже приношу себя в жертву, и мне пришло время умереть».'
  rationale: Прямой парафраз устранил бы жертвенную метафору σπένδομαι и эвфемистическую, допускающую разные образные оттенки лексику ἀνάλυσις. Контекст указывает на близкую смерть, но перевод не должен заменять образы их толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Возлияние» — необходимый библейский культовый термин; пояснение в сноске делает образ доступным. Порядок маркеров приведён в нормальную последовательность [a], [b].
