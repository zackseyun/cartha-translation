base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/007.yaml
  text: I have fought the good fight[a], I have finished the race, I have kept the faith.
translation:
  language: ru
  text: Я достойно сражался, свой бег завершил, веру сохранил.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сохранил верность»; или: «остался верен». Греческое τὴν πίστιν может означать как веру, которую он сохранил, так и верность, которую он сохранил до конца.'
    reason: alternative_reading
lexical_decisions:
- source_word: καλὸν ἀγῶνα
  choice: в доброй борьбе
  rationale: ἀγών обозначает борьбу, состязание или бой; «борьба» естественно передаёт сочетание атлетического и боевого образов, а καλός — нравственную оценку «добрая».
- source_word: ἠγώνισμαι
  choice: я сражался
  rationale: Глагол ἀγωνίζομαι образует с существительным ἀγών выразительную фигуру однокоренного повтора. По-русски точно воспроизвести её без тяжеловесности трудно; «сражался в… борьбе» сохраняет силу образа и завершённость действия.
- source_word: δρόμον
  choice: бег
  rationale: δρόμος может означать бег, дистанцию или поприще. «Свой бег» ясно сохраняет атлетическую метафору и естественно обозначает жизненное служение, доведённое до конца.
- source_word: τετέλεκα
  choice: завершил
  rationale: Перфект τελέω указывает на доведение до конца с сохраняющимся результатом. Русский совершенный вид естественно передаёт эту завершённость.
- source_word: πίστιν
  choice: веру
  rationale: πίστις здесь допускает как предметное значение веры, так и оттенок верности. Основной текст сохраняет традиционное и лексически прямое «веру», не уточняя сверх меры её референт.
- source_word: τετήρηκα
  choice: сохранил
  rationale: τηρέω означает хранить, соблюдать, оберегать. «Сохранил» естественно сочетается с «веру» и оставляет открытыми оттенки удержания веры и верности ей.
theological_decisions:
- issue: Значение τὴν πίστιν
  choice: сохранил веру
  alternative: сохранил верность; остался верен
  rationale: Артикль может указывать на веру как на принятую и хранимую христианскую веру, однако πίστις способно обозначать также верность. Поэтому основной текст не добавляет поясняющего «христианскую», а возможный смысл верности отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным трёхчастным ритмом. Во второй и третьей частях местоимение опущено ради естественности и риторической плотности; значение первого лица однозначно задаётся глагольными формами.
