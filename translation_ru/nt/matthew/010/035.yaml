  text: ἦλθον γὰρ διχάσαι ἄνθρωπον κατὰ τοῦ πατρὸς αὐτοῦ καὶ θυγατέρα κατὰ τῆς μητρὸς αὐτῆς καὶ νύμφην κατὰ τῆς πενθερᾶς αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/035.yaml
  text: For I came to set a man against his father[a], and a daughter against her mother, and a daughter-in-law against her mother-in-law[b],
translation:
  language: ru
  text: Ибо Я пришёл поставить мужчину против его отца[a], дочь — против её матери и невестку — против её свекрови[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разделить мужчину с его отцом». Греческое ἄνθρωπος означает «человек» или «мужчина»; в этом семейном ряду оно не называет его прямо сыном.'
    reason: lexical_alternative
  - marker: b
    text: Греческое νύμφη может также означать «невеста», но здесь оно означает «невестка», поскольку противопоставлено πενθερά, «свекрови».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: Я пришёл
  rationale: Аорист ἔρχομαι здесь говорит о пришествии и миссии Иисуса; русское прошедшее время передаёт это естественно.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит пояснение к предыдущему высказыванию; «ведь» естественно сохраняет пояснительную связь.
- source_word: διχάσαι
  choice: настроить … против
  rationale: Глагол означает разделить или вызвать разделение; повторяющиеся обороты κατά с родительным падежом выражают противостояние, поэтому выбранный оборот ясно передаёт конфликт между близкими.
- source_word: ἄνθρωπον
  choice: сына
  rationale: Буквально существительное означает «человека/мужчину», однако в паре «против отца» и в параллельном месте Мих 7:6 речь идёт о сыне; «сына» естественно обозначает семейное отношение, не меняя смысла данной сцены.
- source_word: κατὰ τοῦ πατρὸς αὐτοῦ
  choice: против отца
  rationale: κατά с родительным падежом выражает направленное противостояние; в русском притяжательное местоимение не требуется, поскольку родство ясно из конструкции.
- source_word: θυγατέρα
  choice: дочь
  rationale: Прямой и естественный эквивалент формы единственного числа.
- source_word: κατὰ τῆς μητρὸς αὐτῆς
  choice: против матери
  rationale: Сохраняется повторяющаяся конструкция противостояния; притяжательное местоимение по-русски избыточно.
- source_word: νύμφην
  choice: невестку
  rationale: νύμφη может означать невесту или невестку, но сочетание с πενθερά здесь требует значения родства по браку.
- source_word: κατὰ τῆς πενθερᾶς αὐτῆς
  choice: против свекрови
  rationale: πενθερά означает мать мужа или жены; при слове «невестка» современное русское «свекровь» точно и естественно называет мать мужа.
theological_decisions:
- issue: Характер заявленной миссии Иисуса
  choice: Сохранить резкое утверждение о разделении членов семьи как результате Его прихода, не добавляя объяснения мотива или оценки этого конфликта.
  alternative: Смягчить фразу, представив семейный конфликт лишь как непреднамеренное следствие верности Иисусу.
  rationale: Греческий текст прямо употребляет целевой инфинитив διχάσαι. Перевод должен сохранять богословское напряжение, но не внушать без текстового основания, будто семейная вражда сама по себе является высшим благом.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. «Настроить … против» передаёт не отвлечённое разделение, а межличностное противостояние. Синтаксический параллелизм трёх семейных пар сохранён.
