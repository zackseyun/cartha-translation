source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ἀνεκτότερον ἔσται γῇ Σοδόμων καὶ Γομόρρων ἐν ἡμέρᾳ κρίσεως ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/015.yaml
  text: Truly I say to you[c][b][a], it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that town.
translation:
  language: ru
  text: 'Истинно говорю вам: земле Содома и Гоморры[b] будет легче[a] в день суда, чем тому городу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет более терпимо».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Содому и Гоморре». Буквально: «земле Содома и Гоморры».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Истинно
  rationale: В начальной формуле Иисуса передаёт торжественное заверение естественным и понятным современным русским словом, не превращая ἀμήν в непрозрачную транслитерацию.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Близко передаёт прямую речевую формулу и сохраняет её торжественный характер.
- source_word: ἀνεκτότερον
  choice: будет легче
  rationale: Естественная русская сравнительная конструкция передаёт значение «будет более выносимо, терпимо»; буквальное «будет терпимее» здесь звучит менее естественно.
- source_word: γῇ Σοδόμων καὶ Γομόρρων
  choice: земле Содома и Гоморры
  rationale: Сохраняет конкретное обозначение территории и грамматическую связь родительного падежа названий с γῇ, не сводя выражение без пояснения только к названиям городов.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: в день суда
  rationale: Точно и естественно передаёт указание на будущий день суда, не добавляя подробностей о его характере.
- source_word: τῇ πόλει ἐκείνῃ
  choice: тому городу
  rationale: Обычное русское соответствие πόλις; указательное местоимение отсылает к городу, отвергнувшему посланников в ближайшем контексте.
theological_decisions:
- issue: Характер «дня суда»
  choice: Передан как будущий день суда без дальнейшего догматического уточнения.
  alternative: Понимать выражение как более общее время суда.
  rationale: Контекст и формулировка естественно указывают на будущий Божий суд, однако перевод не вводит отсутствующей в стихе эсхатологической схемы.
- issue: Сравнительная тяжесть суда
  choice: Сохранено прямое сравнение участи земли Содома и Гоморры с участью отвергшего вестников города.
  alternative: Развернуть смысл как указание на разные степени наказания.
  rationale: Текст подразумевает различие в переносимости суда, но не объясняет его природу; перевод сохраняет это напряжение без богословского разъяснения.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Формула «Истинно говорю вам» сохраняет библейскую торжественность, а «будет легче» избегает тяжеловесной буквальности. Порядок слов слегка приспособлен к русской речи при сохранении акцента исходного сравнения.
