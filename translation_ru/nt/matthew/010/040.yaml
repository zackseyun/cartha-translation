id: MAT.10.40
reference: Matthew 10:40
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὁ δεχόμενος ὑμᾶς ἐμὲ δέχεται, καὶ ὁ ἐμὲ δεχόμενος δέχεται τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/040.yaml
  text: The one who receives you receives me[a], and the one who receives me receives the one who sent me.
translation:
  language: ru
  text: Кто принимает вас, тот принимает Меня[a], а кто принимает Меня, тот принимает Пославшего Меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приветствует», «принимает с радушием»; греческий глагол может означать принять человека, признать его или оказать ему гостеприимство — особенно когда речь идёт о приёме посланника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δεχόμενος
  choice: Кто принимает
  rationale: Субстантивированное причастие настоящего времени выражает обобщённое лицо. Конструкция «кто… тот…» естественна для современного литературного русского языка и сохраняет общий смысл.
- source_word: δέχομαι / δέχεται
  choice: принимает
  rationale: 'Повтор одного и того же глагола сохраняет намеренную смысловую цепь: принять учеников — значит принять Иисуса, а принять Иисуса — значит принять Пославшего Его. «Принимать» охватывает как гостеприимный приём, так и признание посланника.'
- source_word: ὑμᾶς
  choice: вас
  rationale: Местоимение второго лица множественного числа относится к ученикам Иисуса; русская форма однозначно передаёт число.
- source_word: ἐμέ
  choice: Меня
  rationale: Прямое дополнение первого лица единственного числа, относящееся к Иисусу. Прописная буква соответствует принятой русской библейской издательской традиции.
- source_word: τὸν ἀποστείλαντά με
  choice: Пославшего Меня
  rationale: Субстантивированное аористное причастие передано естественной русской причастной конструкцией без добавления слова «Отец», которого нет в греческом тексте.
theological_decisions:
- issue: Кто подразумевается под Пославшим Иисуса
  choice: Пославшего Меня
  alternative: Отца, пославшего Меня
  rationale: Контекст и богословие Евангелия от Матфея указывают на Отца, однако сам греческий текст говорит только «Пославший Меня». Перевод не делает подразумеваемое уточнение явным и сохраняет формулировку источника.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Симметрическая конструкция и тройное повторение «принимает» сохранены. Причастие «Пославшего» несколько возвышенно, но естественно для библейского регистра и точно передаёт греческую форму.
