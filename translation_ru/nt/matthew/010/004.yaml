base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/004.yaml
  text: Simon the Cananaean[a], and Judas Iscariot[b], who also betrayed him.
translation:
  language: ru
  text: Симон Кананит[a] и Иуда Искариот, который и предал Его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Симон Ревнитель». Греческое Кананит, вероятно, передаёт арамейское или еврейское обозначение, традиционно понимаемое как «ревнитель».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «который и выдал Его». Греческий глагол имеет более широкое значение «передавать, выдавать», хотя применительно к Иуде контекстуально означает предательство.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καναναῖος
  choice: Кананит
  rationale: Передано традиционной русской транслитерацией греческого обозначения, восходящего, вероятно, к арамейскому или еврейскому слову со значением «ревнитель». Это сохраняет форму исходного текста, не подменяя её толкованием.
- source_word: Ἰσκαριώτης
  choice: Искариот
  rationale: Устоявшаяся русская передача личного прозвания.
- source_word: παραδοὺς
  choice: предал
  rationale: В контексте Иуды глагол обозначает вероломную передачу Иисуса врагам; «предал» естественно передаёт эту контекстуальную силу. Более широкое буквальное значение отмечено в сноске.
- source_word: ὁ καὶ παραδοὺς αὐτόν
  choice: который и предал Его
  rationale: Субстантивированное причастие передано естественным русским определительным придаточным. Частица καί сохранена словом «и».
theological_decisions:
- issue: Передавать ли παραδοὺς нейтральным «выдал/передал» или контекстуально окрашенным «предал»
  choice: предал
  alternative: выдал Его
  rationale: В перечне апостолов Иуда определяется через известный из дальнейшего повествования вероломный поступок, поэтому «предал» точно передаёт контекстуальный смысл. При этом более широкое значение греческого глагола сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейского перечня. Имена переданы в привычной русской форме; местоимение «Его» написано с прописной буквы по устойчивой русской библейской традиции. Подлинная лексическая широта παραδίδωμι и возможное значение прозвания Καναναῖος отражены в сносках.
