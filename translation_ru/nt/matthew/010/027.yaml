  source_fidelity: 'Основной смысл и образная антитеза переданы точно: ὃ λέγω ὑμῖν / ὃ ... ἀκούετε сохранены как два параллельных предметных оборота; «во тьме — при свете» не заменено истолкованием; κηρύξατε передано уместным «провозглашайте»; «с крыш» естественно передаёт ἐπὶ τῶν δωμάτων. Однако оборот «что слышите на ухо» в современном русском звучит неестественно и может быть ошибочно понят как способ слухового восприятия, а не как частное сообщение. «Что вам говорят на ухо» естественно выражает смысл греческой идиомы εἰς τὸ οὖς, не устраняя образ уха и не добавляя содержательного истолкования.'
