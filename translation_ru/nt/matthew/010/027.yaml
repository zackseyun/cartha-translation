  text: ὃ λέγω ὑμῖν ἐν τῇ σκοτίᾳ, εἴπατε ἐν τῷ φωτί· καὶ ὃ εἰς τὸ οὖς ἀκούετε, κηρύξατε ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/027.yaml
  text: What I tell you in the darkness[a], say in the light; and what you hear in the ear[b], proclaim on the housetops.
translation:
  language: ru
  text: Что Я говорю вам во тьме[a], говорите при свете; и что вам говорят на ухо[b], провозглашайте с крыш.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «втайне… открыто»; греческий текст сохраняет образы: «во тьме… при свете».'
    reason: lexical_alternative
  - marker: b
    text: То есть услышанное в частном порядке следует объявлять публично. Плоские крыши древних домов были заметными возвышенными местами, откуда можно было обращаться к людям.
    reason: cultural_note
lexical_decisions:
- source_word: ὃ λέγω ὑμῖν
  choice: Что Я говорю вам
  rationale: Естественно передаёт субстантивированное относительное местоимение и прямое наставление, сохраняя настоящее время.
- source_word: ἐν τῇ σκοτίᾳ
  choice: во тьме
  rationale: Сохраняет образ и его противопоставление свету; вариант «втайне» передаёт смысл, но устраняет метафору.
- source_word: εἴπατε ἐν τῷ φωτί
  choice: говорите при свете
  rationale: Императив передан побудительной формой; «при свете» естественно по-русски сохраняет образ публичности и контраст с тьмой.
- source_word: εἰς τὸ οὖς ἀκούετε
  choice: слышите на ухо
  rationale: Русская идиома «слышать на ухо» сохраняет образ частного сообщения без добавления отсутствующего в греческом глагола «шептать».
- source_word: κηρύξατε
  choice: провозглашайте
  rationale: Передаёт публичное, открытое объявление и не сужает смысл до формальной проповеди.
- source_word: ἐπὶ τῶν δωμάτων
  choice: с крыш
  rationale: По-русски так естественнее передаётся объявление, исходящее с плоских крыш древних домов; сам культурный образ сохранён.
theological_decisions:
- issue: Передавать ли образы тьмы, света, уха и крыш буквально или заменить их истолкованием о тайном и публичном
  choice: Сохранить образный язык в основном тексте.
  alternative: «Что говорю вам втайне, говорите открыто; что вам шепчут, объявляйте всем».
  rationale: Греческий текст строится на ярких противопоставленных образах. Их сохранение не устраняет подразумеваемого перехода от частного наставления к открытому возвещению и не сводит многозначную риторику к поясняющему пересказу.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и риторической образности оригинала. Заглавная буква в местоимении «Я» обозначает говорящего Иисуса по принятой русской библейской традиции; синтаксис остаётся ясным и пригодным для публичного чтения.
