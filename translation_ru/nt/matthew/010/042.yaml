id: MAT.10.42
reference: Matthew 10:42
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν ποτίσῃ ἕνα τῶν μικρῶν τούτων ποτήριον ψυχροῦ μόνον εἰς ὄνομα μαθητοῦ, ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/042.yaml
  text: And whoever gives one of these little ones even a cup of cold water in the name of a disciple[a], truly I say to you[b], he will certainly not lose his reward.
translation:
  language: ru
  text: 'И кто напоит одного из этих малых[a] хотя бы чашей холодной воды потому что тот — ученик[b], истинно говорю вам: он ни в коем случае не лишится своей награды.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Эти малые» в данном контексте, вероятно, обозначают смиренных или незначительных в глазах людей последователей Иисуса, но само выражение не исключает и буквального значения — детей.
    reason: Сохранение неоднозначности референта μικρῶν.
  - marker: b
    text: 'Буквальнее: «во имя ученика». Греческий оборот указывает, что поступок совершается с учётом того, что получатель является учеником.'
    reason: Формальная альтернатива для εἰς ὄνομα μαθητοῦ.
lexical_decisions:
- source_word: ὃς ἂν
  choice: кто
  rationale: Сочетание относительного местоимения с ἄν имеет неопределённо-обобщающий смысл; русское «кто» естественно вводит общее условие.
- source_word: ποτίσῃ
  choice: напоит
  rationale: Глагол означает «дать пить, напоить». Русское «напоит ... чашей холодной воды» точно и естественно передаёт конкретное действие.
- source_word: ἕνα τῶν μικρῶν τούτων
  choice: одного из этих малых
  rationale: «Малых» сохраняет образную широту μικρῶν и не ограничивает его ни детьми, ни какой-либо заранее определённой группой учеников.
- source_word: ποτήριον ψυχροῦ
  choice: чашей холодной воды
  rationale: Прилагательное ψυχροῦ употреблено субстантивированно; в контексте подразумевается холодная вода. Творительный падеж естественен при русском глаголе «напоить».
- source_word: μόνον
  choice: хотя бы
  rationale: В контексте слово подчёркивает малость дара — всего одну чашу холодной воды. «Хотя бы» естественно выражает этот ограничительный смысл.
- source_word: εἰς ὄνομα μαθητοῦ
  choice: потому, что тот — ученик
  rationale: Оборот указывает, что помощь оказана с учётом статуса получателя как ученика. Указательное «тот» устраняет возможную двусмысленность русского местоимения; более формальная передача дана в примечании.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: истинно говорю вам
  rationale: Устойчивая торжественная формула передаёт заверительный и авторитетный характер высказывания Иисуса, оставаясь понятной современному читателю.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: ни в коем случае не лишится
  rationale: Сочетание οὐ μή выражает усиленное отрицание; выбранная формулировка ясно сохраняет категоричность обещания.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: своей награды
  rationale: В данном контексте μισθός означает воздаяние или награду, а не буквальную заработную плату. Возвратное местоимение естественно соотносит награду с совершающим поступок.
theological_decisions:
- issue: Кого обозначают «эти малые»
  choice: Сохранено широкое выражение «эти малые» без сведения его только к детям.
  alternative: «Эти незначительные ученики» или исключительно «дети».
  rationale: Контекст говорит о принятии учеников, однако само выражение сохраняет образ малости и допускает оттенки низкого положения, слабости или незначительности. Перевод не должен устранять эту смысловую широту.
- issue: Смысл εἰς ὄνομα μαθητοῦ
  choice: 'Передано как причина помощи: получателю дают воду потому, что он ученик.'
  alternative: Буквальное «во имя ученика» или «как ученику».
  rationale: Греческий оборот связывает поступок с признанием получателя учеником. Основной текст передаёт эту функцию понятно, а буквальная форма сохранена в примечании без добавления конфессиональных оттенков.
- issue: Характер обещанной награды
  choice: Сохранено общее слово «награда» без пояснения её вида, времени или способа получения.
  alternative: Конкретизация как земного воздаяния, небесной награды или спасения.
  rationale: Стих не уточняет природу μισθός; конкретизация разрешила бы богословский вопрос, оставленный текстом открытым.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной евангельской интонацией. Формула «истинно говорю вам» сохранена как достоинственная и широко понятная; архаизмы и конфессионально окрашенные уточнения исключены.
