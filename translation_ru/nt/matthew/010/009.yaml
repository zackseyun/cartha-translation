lexical_decisions:
- source_word: μὴ κτήσησθε
  choice: Не приобретайте
  rationale: κτάομαι означает «приобретать, обзаводиться». Такой перевод сохраняет отличие от простого запрета «не берите с собой» и передаёт направленность действия на себя, выраженную средней формой.
- source_word: χρυσὸν
  choice: золота
  rationale: Прямое обозначение золота; в данном перечне подразумеваются золотые деньги.
- source_word: ἄργυρον
  choice: серебра
  rationale: Прямое обозначение серебра; в контексте подразумеваются серебряные деньги.
- source_word: χαλκὸν
  choice: меди
  rationale: χαλκός может обозначать медь или бронзу; в перечне денежных металлов «медь» естественно передаёт монеты малой стоимости, а вариант «бронза» отмечен в сноске.
- source_word: εἰς τὰς ζώνας ὑμῶν
  choice: для своих поясов
  rationale: ζώνη — пояс, служивший также местом хранения денег. Формулировка близко передаёт εἰς и не вводит пояснение прямо в основной текст.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясной, достойной и близкой к оригиналу формулировкой. Повтор «ни… ни… ни…» воспроизводит трёхчастный греческий перечень; культурная деталь о хранении денег вынесена в сноску.
