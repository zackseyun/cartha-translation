  yaml_path: translation/nt/matthew/010/009.yaml
  text: Do not acquire gold or silver or copper for your belts[b][a],
translation:
  language: ru
  text: Не приобретайте ни золота, ни серебра, ни меди[a] для ношения в своих поясах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бронзы».'
