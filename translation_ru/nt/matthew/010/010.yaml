id: MAT.10.10
reference: Matthew 10:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μὴ πήραν εἰς ὁδὸν μηδὲ δύο χιτῶνας μηδὲ ὑποδήματα μηδὲ ⸀ῥάβδον· ἄξιος γὰρ ὁ ἐργάτης τῆς τροφῆς ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/010.yaml
  text: do not take a traveler's bag for the road[a], or two tunics, or sandals, or a staff; for the worker is worthy of his food.
translation:
  language: ru
  text: не берите с собой в дорогу ни дорожной сумы, ни двух хитонов, ни сандалий, ни посоха[a], потому что работник достоин своей пищи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Некоторые понимают эти слова как запрет брать запасной посох, особенно с учётом Мк. 6:8, где посох взять разрешается.
    reason: alternative_reading
lexical_decisions:
- source_word: πήραν
  choice: дорожной сумы
  rationale: Слово обозначает суму, которую брали в путь, в частности для припасов; сочетание естественно передаёт назначение предмета и исторический контекст.
- source_word: εἰς ὁδὸν
  choice: с собой в дорогу
  rationale: Идиоматически передаёт предметы, которые берут для путешествия; добавление «с собой» естественно в русском синтаксисе.
- source_word: δύο χιτῶνας
  choice: двух хитонов
  rationale: «Хитон» исторически точно обозначает основную нательную одежду той эпохи и понятен современному читателю.
- source_word: ὑποδήματα
  choice: сандалий
  rationale: В данном историческом контексте речь идёт об обуви, привязываемой к ноге; «сандалии» конкретнее общего слова «обувь».
- source_word: ῥάβδον
  choice: посоха
  rationale: Здесь слово естественно обозначает посох путника. Перевод сохраняет прямой запрет Матфея и не согласовывает его искусственно с Мк. 6:8.
- source_word: ἄξιος
  choice: достоин
  rationale: Сохраняет оценочный смысл греческого слова и характерную библейскую формулировку, оставаясь понятным современному читателю.
- source_word: ὁ ἐργάτης
  choice: работник
  rationale: Нейтрально и ясно передаёт человека, который трудится, не вводя специальной церковной терминологии.
- source_word: τῆς τροφῆς αὐτοῦ
  choice: пропитания
  rationale: Передаёт конкретный смысл пищи и средств питания, при этом естественно сочетается по-русски с формулой «работник достоин»; местоимение αὐτοῦ можно не выражать отдельно, поскольку принадлежность подразумевается.
theological_decisions:
- issue: Возможное согласование с параллельным рассказом о разрешённом дорожном снаряжении
  choice: Сохранить в основном тексте запрет брать посох.
  alternative: Понять запрет как относящийся лишь к запасному посоху, особенно с учётом Мк. 6:8.
  rationale: Греческий текст Матфея прямо включает ῥάβδον в перечень запрещённых предметов. Напряжение между параллельными рассказами следует сохранить, а не устранять посредством перевода.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Дорожная сума» и «хитон» сохраняют историческую конкретность; синтаксис остаётся ясным и естественным.
