id: MAT.10.24
reference: Matthew 10:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν διδάσκαλον οὐδὲ δοῦλος ὑπὲρ τὸν κύριον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/024.yaml
  text: A disciple is not above the teacher[b][a], nor a slave above his master.
translation:
  language: ru
  text: Ученик не выше учителя, и раб не выше своего господина.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуга не выше своего хозяина». Греческие слова δοῦλος и κύριος здесь описывают отношения подчинённого и его господина или хозяина.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: ученик
  rationale: Передаёт не только обучение, но и личную связь с наставником, естественную для евангельского контекста.
- source_word: ὑπέρ
  choice: выше
  rationale: С винительным падежом выражает превосходство по положению; русское «выше» кратко и естественно сохраняет сравнение.
- source_word: διδάσκαλος
  choice: учитель
  rationale: Прямое и общеупотребительное соответствие, не смешивающее эту роль с господином раба во второй части.
- source_word: δοῦλος
  choice: раб
  rationale: В паре с κύριος обозначает подчинённое и несвободное положение точнее, чем более широкое «слуга».
- source_word: κύριος
  choice: господин
  rationale: В данной социальной аналогии означает хозяина или господина раба, а не божественный титул.
- source_word: αὐτοῦ
  choice: своего
  rationale: Русское возвратное притяжательное местоимение ясно относит господина к подлежащему «раб».
- source_word: οὐδέ
  choice: и … не
  rationale: Естественно связывает в русском языке второе отрицательное сопоставление с первым.
theological_decisions:
- issue: Передача δοῦλος в социальной аналогии
  choice: раб
  alternative: слуга
  rationale: Сопоставление δοῦλος и κύριος подчёркивает зависимый статус; «раб» сохраняет эту силу, не превращая образ в более мягкие отношения служения.
- issue: Передача κύριος в небожественном контексте
  choice: господин
  alternative: Господь; хозяин
  rationale: Здесь слово относится к человеческому superior в паре «раб — господин», поэтому божественный титул «Господь» был бы неуместен. «Господин» также сохраняет перекличку с традиционной формой изречения.
translation_notes:
  register: Современный литературный русский язык; афористичная параллельная структура оригинала сохранена. Формулировка «не выше» передаёт положение и превосходство, не уточняя их природу сверх сказанного в греческом тексте.
