lexical_decisions:
- source_word: εἰσερχόμενοι
  choice: Входя
  rationale: Причастие настоящего времени во множественном числе употреблено обстоятельственно при повелительном глаголе; деепричастие естественно передаёт одновременность действий.
- source_word: δὲ
  choice: не передано отдельно
  rationale: Это слабая связующая частица; в русском связь с предыдущей мыслью достаточно выражена самой конструкцией, а отдельное «же» звучало бы излишне подчёркнуто.
- source_word: οἰκίαν
  choice: в дом
  rationale: Слово может обозначать как дом, так и домашних, но глагол входа прежде всего указывает на место; метонимический смысл сохраняется далее и поясняется в сноске.
- source_word: ἀσπάσασθε
  choice: приветствуйте
  rationale: Аористный императив второго лица множественного числа выражает прямое предписание; «приветствуйте» — ясный и современный эквивалент.
- source_word: αὐτήν
  choice: его
  rationale: Местоимение женского рода единственного числа согласуется в греческом с οἰκίαν. В русском род меняется согласно слову «дом», но сохраняется буквальное указание на дом, вероятно метонимически обозначающий живущих в нём.
theological_decisions:
- issue: Метонимическое приветствие дома или явное указание на его обитателей
  choice: Сохранить в основном тексте выражение «приветствуйте его»
  alternative: «приветствуйте домашних» / «приветствуйте живущих в нём»
  rationale: Греческое αὐτήν прямо отсылает к οἰκίαν. Сохранение этой метонимии уважает форму исходного текста и не устраняет его смысловую особенность; вероятный социальный референт поясняется в сноске.
translation_notes:
