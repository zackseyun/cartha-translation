id: MAT.10.38
reference: Matthew 10:38
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ὃς οὐ λαμβάνει τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθεῖ ὀπίσω μου, οὐκ ἔστιν μου ἄξιος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/038.yaml
  text: And whoever does not take up his cross and follow after me is not worthy of me[a][b].
translation:
  language: ru
  text: И кто не берёт свой крест[a] и не идёт вслед за Мной[b], тот Меня недостоин.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его крест». Греческая форма мужского рода единственного числа употреблена обобщённо: каждый ученик должен взять собственный крест.'
    reason: lexical_alternative
  - marker: b
    text: 'Или короче: «следует за Мной». Греческое выражение более явно рисует движение вслед за Иисусом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: кто
  rationale: В обобщённой относительной конструкции русское «кто» естественно передаёт значение «всякий, кто», не добавляя отсутствующего в греческом тексте слова.
- source_word: λαμβάνει
  choice: берёт
  rationale: В сочетании с «крестом» глагол означает принятие и несение креста; русское «берёт свой крест» сохраняет конкретный образ и звучит естественно.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: свой крест
  rationale: Возвратное притяжательное местоимение «свой» в русском точно соотносит крест с каждым названным лицом и естественнее буквального «его крест» в этой конструкции.
- source_word: ἀκολουθεῖ ὀπίσω μου
  choice: идёт вслед за Мной
  rationale: Так передано не только значение ἀκολουθεῖ «следует», но и явное пространственно-образное уточнение ὀπίσω μου «позади/вслед за Мной».
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: тот Меня недостоин
  rationale: Русская конструкция «недостоин Меня» прямо передаёт ἄξιος с родительным местоимения и сохраняет торжественную оценочную силу высказывания.
theological_decisions:
- issue: Образ взятия креста в ученичестве
  choice: 'Сохранён конкретный образ: «берёт свой крест».'
  alternative: Истолковать как «принимает страдания» или «отрекается от себя».
  rationale: Греческий текст называет крест непосредственно. Абстрактный пересказ сузил бы историческую и богословскую многозначность образа, связанную с позором, страданием и возможной смертью ради следования за Иисусом.
- issue: Смысл ἀκολουθεῖ ὀπίσω μου
  choice: 'Передано более полно: «идёт вслед за Мной».'
  alternative: Краткое «следует за Мной».
  rationale: Полная формулировка сохраняет образ ученика, идущего позади Иисуса, не превращая его в дополнительное толкование.
- issue: Обобщённое мужское единственное число αὐτοῦ
  choice: Передано русским возвратным «свой», относящимся к каждому человеку в обобщённой конструкции.
  alternative: Буквальное «его».
  rationale: «Свой» грамматически точно указывает на крест самого названного человека и не меняет обобщённого охвата греческого высказывания.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной формой. Написание «Мной» с прописной буквы соответствует распространённой русской библейской традиции при местоименной отсылке к Иисусу. Порядок «тот Меня недостоин» сохраняет выразительный акцент на личном отношении ко Христу.
