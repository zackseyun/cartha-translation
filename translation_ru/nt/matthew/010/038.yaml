  source_fidelity: 'Текст точно передаёт структуру и смысл греческого оригинала: обобщённое «кто», два соединённых отрицательных действия, образ личного креста, уточнённое следование «вслед за Мной» и заключительную оценку «Меня недостоин». Русское «свой крест» корректно передаёт референциальную связь αὐτοῦ с обобщённым субъектом, не вводя гендерного ограничения.'
