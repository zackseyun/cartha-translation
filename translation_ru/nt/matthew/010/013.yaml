id: MAT.10.13
reference: Matthew 10:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐὰν μὲν ᾖ ἡ οἰκία ἀξία, ἐλθάτω ἡ εἰρήνη ὑμῶν ἐπ’ αὐτήν· ἐὰν δὲ μὴ ᾖ ἀξία, ἡ εἰρήνη ὑμῶν ⸀πρὸς ὑμᾶς ἐπιστραφήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/013.yaml
  text: And if the house is worthy[a], let your peace come upon it; but if it is not worthy[c][b], let your peace return to you.
translation:
  language: ru
  text: И если дом достоин[a], пусть ваш мир придёт на него; если же он недостоин[b], пусть ваш мир вернётся к вам[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «семья», «домашние»; греческое слово может означать жилище и, шире, живущих в нём людей.
    reason: lexical_alternative
  - marker: b
    text: Здесь «достоин» означает, что дом подходит для принятия посланников и их мира, а не то, что его обитатели нравственно безгрешны.
    reason: cultural_note
  - marker: c
    text: Или «обратится к вам».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: дом
  rationale: Прямой и естественный эквивалент; в данном контексте слово может обозначать как жилище, так и живущих в нём людей, поэтому эта широта отмечена в сноске.
- source_word: ἀξία
  choice: достоин
  rationale: Сохраняет оценочный смысл греческого слова, не сужая его до одной лишь готовности принять вестников. В контексте речь идёт о пригодности дома принять посланников и их приветствие мира.
- source_word: ἐλθάτω
  choice: пусть… придёт
  rationale: Передаёт повелительную форму и направленное движение без превращения фразы в простое пожелание.
- source_word: εἰρήνη
  choice: мир
  rationale: Обычный эквивалент εἰρήνη, сохраняющий также подразумеваемый семитский оттенок благополучия и благословения.
- source_word: ἐπ’ αὐτήν
  choice: на него
  rationale: Передаёт направительный смысл ἐπί с винительным и сохраняет образ мира, приходящего на дом; местоимение согласовано с русским словом «дом».
- source_word: πρὸς ὑμᾶς
  choice: к вам
  rationale: Передаёт основное направительное значение предлога; значение возвращения уже выражено глаголом.
- source_word: ἐπιστραφήτω
  choice: пусть… вернётся
  rationale: Естественно передаёт повелительную форму и смысл обратного движения мира к ученикам.
- source_word: μὲν … δὲ
  choice: если…; если же…
  rationale: Ясно и естественно передаёт сопоставление двух условий в современном русском языке.
theological_decisions:
- issue: Природа выражения «ваш мир»
  choice: Сохранено буквальное «ваш мир», который может прийти на дом или вернуться к ученикам.
  alternative: «Ваше приветствие мира»; «мир, который вы возвещаете»; «ваше благословение».
  rationale: Греческий текст представляет мир как конкретно действующее благословение, связанное с миссией учеников, но не объясняет механизм этого действия. Перевод сохраняет образ и богословское напряжение, не сводя мир ни к простой формуле приветствия, ни к механически передаваемой силе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет параллелизм и условное противопоставление оригинала; образ мира, приходящего на дом и возвращающегося к ученикам, оставлен без рационализирующего пояснения в основном тексте.
