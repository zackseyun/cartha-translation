  text: καὶ ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς ἀχθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/018.yaml
  text: And you will be brought before governors and kings because of me[b][a], as a testimony to them and to the Gentiles.
translation:
  language: ru
  text: И из-за Меня вас поведут к правителям и царям, чтобы это стало свидетельством для них[b] и для народов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «язычников».'
    reason: lexical_alternative
  - marker: b
    text: 'В контексте возможно также понимание: «против них», хотя сам греческий дательный падеж этого прямо не выражает.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἡγεμόνας ... καὶ βασιλεῖς
  choice: к правителям и царям
  rationale: После глагола движения ἐπί с винительным указывает на доставление к властям для разбирательства. «Правители» естественно передаёт широкий смысл ἡγεμόνες, не ограничивая его конкретным титулом.
- source_word: ἀχθήσεσθε
  choice: вас поведут
  rationale: Будущее страдательное от ἄγω. «Поведут» сохраняет образ ведения под стражей, не добавляя прямо не выраженного насилия.
- source_word: ἕνεκεν ἐμοῦ
  choice: из-за Меня
  rationale: Оборот обозначает причину. Современное «из-за Меня» ясно показывает, что преследование связано с Иисусом, хотя по-русски может иметь отрицательную окраску, уместную в данном контексте.
- source_word: εἰς μαρτύριον
  choice: чтобы вы свидетельствовали
  rationale: Передача существительного глагольной конструкцией естественна по-русски и выражает целевое либо результативное значение εἰς, не уточняя содержание свидетельства.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный местоимения естественно относится к правителям и царям. Нейтральное «им» не решает, служит ли свидетельство для них благовестием или свидетельством против них.
- source_word: τοῖς ἔθνεσιν
  choice: другим народам
  rationale: В данном контексте ἔθνη может обозначать нееврейские народы. «Другим народам» понятно современному читателю и сохраняет национальный смысл слова без конфессионально окрашенного термина «язычники».
theological_decisions:
- issue: Смысл μαρτύριον αὐτοῖς
  choice: нейтральное «свидетельствовали им»
  alternative: «свидетельство против них»
  rationale: Сам дательный падеж αὐτοῖς не выражает явно направленности против адресатов. Нейтральный перевод сохраняет напряжение между свидетельством как возвещением и свидетельством, которое может обличать отвергнувших его.
- issue: Референт τοῖς ἔθνεσιν
  choice: «другим народам»
  alternative: «язычникам»
  rationale: В Евангелии от Матфея слово часто обозначает народы вне Израиля, но буквальное значение «народы» остаётся живым. Выбор не вводит отрицательных современных ассоциаций слова «язычники» и отмечает вероятное противопоставление Израилю посредством «другим».
translation_notes:
  register: Современный литературный русский язык с ясным, достойным синтаксисом. Порядок маркеров соответствует словам, к которым относятся примечания. Формулировка избегает архаичного «наместники» и потенциально уничижительного в современной речи «язычники» в основном тексте.
