review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: будущее пассивное «вас поведут», причина «из-за Меня» и адресаты свидетельства сохранены. Однако «другим народам» добавляет отсутствующее в греческом тексте ограничение «другим». Передача εἰς μαρτύριον как «чтобы вы свидетельствовали» допустима, но переводит существительное в личное действие учеников и несколько сужает формулировку оригинала, где само приведение пред властей становится свидетельством.'
  naturalness: «И из-за Меня вас поведут к правителям и царям» звучит естественно в современном литературном русском. Формула «чтобы это стало свидетельством для них и для народов» столь же естественна и точнее сохраняет синтаксическую и смысловую открытость оригинала.
  terminology: «Правители» приемлемо для ἡγεμόνες, хотя «правители и цари» охватывает широкий административный смысл без анахронизма. «Народы» сохраняет буквальное значение ἔθνη; примечание указывает на контекстуально вероятное «язычники». «Для них» не навязывает ни благоприятного, ни обвинительного значения дательного αὐτοῖς; альтернативное «против них» оставлено в примечании.
  issues:
  - severity: medium
    issue: Добавлено слово «другим» в выражении «другим народам».
    rationale: В τοῖς ἔθνεσιν нет соответствия «другим». Хотя контекст может предполагать народы вне Израиля, это не следует вводить в основной текст без оговорки.
  - severity: low
    issue: 'εἰς μαρτύριον передано как личное действие: «чтобы вы свидетельствовали».'
    rationale: Греческий текст употребляет существительное «свидетельство» и допускает, что само судебное приведение служит свидетельством. Сохранение существительного лучше передаёт форму и не сужает смысл.
  revised_text: И из-за Меня вас поведут к правителям и царям, чтобы это стало свидетельством для них[b] и для народов[a].
