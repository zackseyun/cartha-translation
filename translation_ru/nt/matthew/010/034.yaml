  text: Μὴ νομίσητε ὅτι ἦλθον βαλεῖν εἰρήνην ἐπὶ τὴν γῆν· οὐκ ἦλθον βαλεῖν εἰρήνην ἀλλὰ μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/034.yaml
  text: Do not think that I came to bring peace on the earth[a]; I did not come to bring peace[b], but a sword.
translation:
  language: ru
  text: Не думайте, что Я пришёл принести мир на землю[a]. Я пришёл не мир принести, а меч[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий аорист «пришёл» может также передаваться с оттенком сохраняющегося результата: «Я пришёл и остаюсь здесь».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «меч». В контексте этот образ указывает на разделение, а не на одобрение насилия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Не думайте
  rationale: Аорист конъюнктива с μή выражает запрещение; эта формулировка естественна по-русски и прямо передаёт смысл.
- source_word: ἦλθον
  choice: Я пришёл
  rationale: Простой прошедший вид глагола естественно вводит высказывание о цели прихода Иисуса; возможный оттенок «Я пришёл и теперь здесь» отмечен в сноске.
- source_word: βαλεῖν
  choice: принести
  rationale: Хотя основной образ βάλλω — «бросать», в данном сочетании «принести» ясно и естественно передаёт значение внесения мира или меча в земную действительность.
- source_word: εἰρήνην
  choice: мир
  rationale: Обычное и точное соответствие εἰρήνη, сохраняющее повтор исходного текста.
- source_word: ἐπὶ τὴν γῆν
  choice: на землю
  rationale: Передаёт широкий смысл γῆ как земли, а не ограниченной территории; по-русски естественнее без определённого артикля, которого русский язык не имеет.
- source_word: ἀλλὰ μάχαιραν
  choice: а меч
  rationale: Противопоставление естественно выражено конструкцией «не мир, а меч»; конкретный образ μάχαιρα сохранён, а не заменён толкованием.
theological_decisions:
- issue: Следует ли заменить образ меча толкованием «разделение»
  choice: Сохранить в основном тексте конкретный образ «меч»
  alternative: «разделение»
  rationale: В греческом тексте прямо стоит μάχαιραν. Ближайший контекст показывает разделяющее действие прихода Иисуса, но перевод не должен устранять напряжённость метафоры или превращать её в призыв к насилию.
translation_notes:
  register: Современный литературный русский язык с достоинством и прямотой исходного изречения. Местоимение «Я» написано с прописной буквы в соответствии с распространённой русской библейской традицией. Повтор «принести мир» сохранён ради риторического контраста; во второй части использована естественная русская конструкция «не мир, а меч».
