  text: μὴ οὖν ⸀φοβεῖσθε· πολλῶν στρουθίων διαφέρετε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/031.yaml
  text: Therefore[a], do not be afraid; you are worth more than many sparrows.
translation:
  language: ru
  text: 'Поэтому не бойтесь: вы ценнее многих воробьёв.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν φοβεῖσθε
  choice: Поэтому не бойтесь
  rationale: οὖν выражает вывод из предшествующих слов о заботе Отца, а μὴ с императивом φοβεῖσθε передаёт запрет; эта формулировка естественна и сохраняет логическую связь.
- source_word: πολλῶν στρουθίων
  choice: множества воробьёв
  rationale: В ближайшем контексте στρουθία обозначает воробьёв; родительный падеж после сравнительного значения διαφέρετε передаёт объект сравнения.
- source_word: διαφέρετε
  choice: ценнее
  rationale: В данном контексте глагол означает превосходство по ценности или значимости, а не просто отличие. «Ценнее» кратко и естественно передаёт сравнительный смысл.
- source_word: ὑμεῖς
  choice: вы
  rationale: Явно выраженное местоимение подчёркивает учеников в сопоставлении с воробьями; в русском языке это подчёркивание сохраняется наличием «вы».
theological_decisions:
- issue: Сравнительная ценность учеников и воробьёв в словах Иисуса
  choice: вы ценнее множества воробьёв
  alternative: вы превосходите множество воробьёв
  rationale: Перевод сохраняет мысль о большей ценности учеников и, следовательно, об особой Божьей заботе о них, не отрицая при этом Божьей заботы о животных.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Двоеточие естественно показывает, что вторая часть обосновывает призыв не бояться.
