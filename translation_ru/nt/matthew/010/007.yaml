  text: πορευόμενοι δὲ κηρύσσετε λέγοντες ὅτι Ἤγγικεν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/007.yaml
  text: And as you go[a], proclaim, saying[c][b], ‘The kingdom of heaven has drawn near.’
translation:
  language: ru
  text: 'И по пути возвещайте: «Приблизилось[a] Царство Небесное[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стало близко», «уже близко». Греческая форма перфекта указывает на наступившую близость, которая остаётся актуальной.'
    reason: lexical_alternative
  - marker: b
    text: Матфей обычно употребляет выражение «Царство Небесное» там, где в других Евангелиях нередко встречается «Царство Божье».
    reason: cross_reference
lexical_decisions:
- source_word: πορευόμενοι
  choice: по пути
  rationale: 'Причастие настоящего времени обозначает действие, сопровождающее повеление: возвещать следует во время пути. Оборот «по пути» естественен в современном русском и не превращает причастие в отдельное повеление.'
- source_word: δὲ
  choice: и
  rationale: Слабая соединительная частица связывает наставление с предыдущими словами, не выражая заметного противопоставления.
- source_word: κηρύσσετε
  choice: возвещайте
  rationale: Глагол означает публичное, авторитетное провозглашение. «Возвещайте» сохраняет этот смысл и уместный торжественный регистр, не сужая действие до церковной проповеди.
- source_word: λέγοντες
  choice: ':'
  rationale: Причастие вводит содержание возвещения. В естественном русском его функцию перед двоеточием и прямой речью передаёт сама конструкция, без тяжеловесного «возвещайте, говоря».
- source_word: ὅτι
  choice: прямая речь
  rationale: После λέγοντες союз вводит содержание сообщения; по-русски оно естественно оформляется как прямая речь без отдельного эквивалента союза.
- source_word: ἤγγικεν
  choice: приблизилось
  rationale: Совершенный вид передаёт наступившее приближение; сохраняющаяся актуальность результата разъяснена в сноске, поскольку одной русской глагольной формой греческий перфект полностью не воспроизводится.
- source_word: ἡ βασιλεία
  choice: Царство
  rationale: 'Традиционный и понятный эквивалент сохраняет смысловую широту: и царственное правление, и область царства. Прописная буква уместна как обозначение Божьего Царства.'
- source_word: τῶν οὐρανῶν
  choice: Небесное
  rationale: Естественная русская форма устойчивого матфеевского выражения; она сохраняет его отличие от формулы «Царство Божье», не прибегая к буквальному и неестественному «Царство небес».
theological_decisions:
- issue: Значение выражения «Царство Небесное»
  choice: Сохранено «Царство Небесное» без замены на «Царство Божье» или «владычество Бога».
  alternative: «Царство Божье»; «небесное владычество»
  rationale: Формулировка Матфея должна оставаться различимой. Слово «Царство» не исключает динамического смысла царствования и не навязывает толкования только как территории.
- issue: Аспект ἤγγικεν
  choice: «Приблизилось» с пояснением о сохраняющейся актуальности наступившей близости.
  alternative: «Близко»; «стало близко»; «приблизилось и теперь близко»
  rationale: Так сохраняется утверждение о наступившей близости, но в основной текст не вводится разъясняющий парафраз и не разрешается более широкое богословское напряжение между настоящим и будущим Царства.
translation_notes:
  register: Современный литературный русский с ясным, сдержанно-торжественным звучанием. Оборот «по пути» устраняет неестественную причастную конструкцию, а двоеточие естественно передаёт функцию λέγοντες. Порядок «Царство Небесное» соответствует устойчивому русскому употреблению.
