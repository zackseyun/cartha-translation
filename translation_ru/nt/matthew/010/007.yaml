  source_fidelity: 'Текст точно передаёт греческий оригинал: πορευόμενοι естественно передано обстоятельственным оборотом «по пути», κηρύσσετε — «возвещайте», а содержание, вводимое λέγοντες ὅτι, корректно оформлено двоеточием и прямой речью. «Приблизилось» адекватно передаёт перфект ἤγγικεν как уже совершившееся приближение; сноска уместно поясняет сохраняющуюся актуальность результата.'
  naturalness: Фраза звучит естественно в современном литературном русском, сохраняя сдержанно-торжественный библейский регистр. «И по пути возвещайте» не перегружено буквальной причастной конструкцией, а двоеточие после «возвещайте» идиоматично вводит провозглашаемое содержание.
  terminology: «Царство Небесное» — устойчивая, понятная и терминологически точная передача матфеевского выражения ἡ βασιλεία τῶν οὐρανῶν. Она не гармонизирует текст с «Царством Божьим» и не навязывает узкого понимания βασιλεία. Сноска b корректно отмечает характерное словоупотребление Матфея.
