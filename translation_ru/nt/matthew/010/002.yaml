id: MAT.10.2
reference: Matthew 10:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τῶν δὲ δώδεκα ἀποστόλων τὰ ὀνόματά ἐστιν ταῦτα· πρῶτος Σίμων ὁ λεγόμενος Πέτρος καὶ Ἀνδρέας ὁ ἀδελφὸς ⸀αὐτοῦ, Ἰάκωβος ὁ τοῦ Ζεβεδαίου καὶ Ἰωάννης ὁ ἀδελφὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/002.yaml
  text: 'These are the names of the twelve apostles: first[a], Simon who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother,'
translation:
  language: ru
  text: 'Вот имена двенадцати апостолов: первый[a] — Симон, называемый Петром, и Андрей, его брат; Иаков, сын Зеведея, и Иоанн, его брат.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «первый» может указывать на особое положение среди двенадцати, а не только на место в перечне.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: не передано отдельным словом
  rationale: Частица обозначает мягкий переход к перечислению. В русском начало «Вот имена…» естественно передаёт переход без добавления временного значения.
- source_word: δώδεκα ἀποστόλων
  choice: двенадцати апостолов
  rationale: «Апостолы» — устоявшееся и точное обозначение признанной группы посланных Иисусом учеников.
- source_word: τὰ ὀνόματά ἐστιν ταῦτα
  choice: Вот имена
  rationale: Естественная современная русская конструкция, сохраняющая указательное значение ταῦτα.
- source_word: πρῶτος
  choice: первый
  rationale: Слово непосредственно обозначает первого в перечислении, при этом возможный оттенок первенства не исключается и отмечен в сноске.
- source_word: ὁ λεγόμενος Πέτρος
  choice: называемый Петром
  rationale: Формально и естественно передаёт причастную конструкцию, указывающую другое имя Симона.
- source_word: ὁ ἀδελφὸς αὐτοῦ
  choice: его брат
  rationale: 'В обоих случаях речь идёт о родном брате: сначала Симона, затем Иакова.'
- source_word: ὁ τοῦ Ζεβεδαίου
  choice: сын Зеведея
  rationale: Греческая родительная конструкция подразумевает сыновство; по-русски оно естественно выражается явно.
theological_decisions:
- issue: Значение πρῶτος применительно к Симону Петру
  choice: «первый» в основном тексте, прежде всего как начало списка
  alternative: «первый» в смысле наиболее видного или первенствующего среди двенадцати
  rationale: Контекст представляет перечень имён и не требует утверждения о власти или должностном первенстве. Сноска сохраняет возможный оттенок особого положения, не превращая его в конфессиональный вывод.
translation_notes:
  register: Современный литературный русский язык; ясный, сдержанно-торжественный библейский регистр. Тире после «первый» облегчает чтение перечня и не добавляет смыслового ранга.
