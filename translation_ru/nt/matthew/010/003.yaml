  text: Φίλιππος καὶ Βαρθολομαῖος, Θωμᾶς καὶ Μαθθαῖος ὁ τελώνης, Ἰάκωβος ὁ τοῦ Ἁλφαίου καὶ ⸀Θαδδαῖος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/003.yaml
  text: Philip and Bartholomew[a], Thomas and Matthew the tax collector, James the son of Alphaeus and Thaddaeus,
translation:
  language: ru
  text: Филипп и Варфоломей, Фома и Матфей, сборщик налогов, Иаков, сын Алфея, и Фаддей[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «Леввей» (или «Леввей, прозванный Фаддеем»); в соответствующем месте списков апостолов у Луки назван «Иуда, сын Иакова».'
    reason: textual_variant
lexical_decisions:
- source_word: Φίλιππος
  choice: Филипп
  rationale: Общепринятая русская форма имени, сохраняющая узнаваемость новозаветного персонажа.
- source_word: Βαρθολομαῖος
  choice: Варфоломей
  rationale: Устоявшаяся русская форма личного имени.
- source_word: Θωμᾶς
  choice: Фома
  rationale: Устоявшаяся русская новозаветная форма имени.
- source_word: Μαθθαῖος
  choice: Матфей
  rationale: Устоявшаяся русская форма имени апостола.
- source_word: ὁ τελώνης
  choice: сборщик налогов
  rationale: Современная и ясная передача названия человека, собиравшего налоги и пошлины; традиционное «мытарь» менее понятно современному читателю.
- source_word: Ἰάκωβος
  choice: Иаков
  rationale: Устоявшаяся русская библейская форма имени, соответствующая новозаветной традиции.
- source_word: ὁ τοῦ Ἁλφαίου
  choice: сын Алфея
  rationale: Греческая родительная конструкция обозначает отцовство; явное указание родства естественно и понятно по-русски.
- source_word: Ἁλφαίου
  choice: Алфей
  rationale: Устоявшаяся русская форма личного имени; падеж выражен в сочетании «сын Алфея».
- source_word: Θαδδαῖος
  choice: Фаддей
  rationale: Основной текст SBLGNT читает Θαδδαῖος; использована традиционная русская форма имени, а варианты отражены в сноске.
- source_word: καὶ
  choice: и
  rationale: Сохраняет простую сочинительную структуру греческого перечня.
theological_decisions:
- issue: Идентификация последнего апостола в данном фрагменте списка
  choice: Фаддей
  alternative: Леввей; Иуда, сын Иакова
  rationale: Основной греческий текст SBLGNT содержит Θαδδαῖος, поэтому в основном тексте стоит «Фаддей». Иные рукописные чтения и соответствующее имя в списках Луки не гармонизируются, а открыто приводятся в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением традиционных и узнаваемых форм библейских имён. «Сборщик налогов» предпочтён архаичному «мытарь». Пунктуация делает приложение к имени Матфея ясным, не нарушая ритма перечня.
