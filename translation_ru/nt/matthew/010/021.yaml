id: MAT.10.21
reference: Matthew 10:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: παραδώσει δὲ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/021.yaml
  text: And brother will hand over brother to death[a], and a father his child, and children will rise up against parents and put them to death.
translation:
  language: ru
  text: Брат выдаст[a] брата на смерть, и отец — своего ребёнка; дети восстанут против родителей и убьют их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предаст»; в контексте вероломства этот глагол может также означать «предаст».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: выдаст
  rationale: Глагол означает передачу человека в руки враждебной стороны, здесь — с последующей смертью. «Выдаст» естественно передаёт конкретное действие и не сводит смысл исключительно к личному предательству.
- source_word: ἀδελφὸς ... ἀδελφὸν
  choice: брат ... брата
  rationale: Сохранены мужской род и выразительный повтор исходного текста; единственное число имеет обобщающий характер.
- source_word: εἰς θάνατον
  choice: на смерть
  rationale: 'Оборот выражает итог или цель выдачи: человека отдают так, что это ведёт к его смерти.'
- source_word: πατὴρ τέκνον
  choice: отец — своего ребёнка
  rationale: τέκνον обозначает ребёнка без указания пола; «своего» естественно обозначает родственную связь, подразумеваемую греческим текстом.
- source_word: ἐπαναστήσονται
  choice: восстанут против
  rationale: Сохраняется яркий образ открытого враждебного выступления, без сужения смысла до политического мятежа.
- source_word: τέκνα ... γονεῖς
  choice: дети ... родителей
  rationale: Оба слова имеют широкий, не ограниченный мужским полом смысл, который точно передают русские соответствия.
- source_word: θανατώσουσιν αὐτούς
  choice: убьют их
  rationale: Глагол означает причинить смерть или предать смерти. «Убьют» ясно и естественно передаёт активное действие детей; местоимение относится к родителям.
theological_decisions:
- issue: Родовые и обобщающие обозначения членов семьи
  choice: Сохранить «брат» для ἀδελφός, а более широкие τέκνα и γονεῖς передать как «дети» и «родители»
  alternative: Передать ἀδελφός гендерно-нейтрально как «близкий родственник» или «один из детей в семье»
  rationale: В первой паре исходный текст прямо называет брата, тогда как названия детей и родителей не ограничены полом. Такое различение сохраняет точный объём каждого греческого слова.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. Тире восполняет пропущенный во второй части глагол и сохраняет параллелизм греческой фразы. Лексика понятна широкому читателю и не содержит конфессионально окрашенных уточнений.
