  terminology: «Отречься от», «Отец» и «на небесах» уместны в русском библейском регистре. Заглавные буквы в местоимениях и слове «Отец» являются последовательной издательской конвенцией и не изменяют смысла. Генерическое «люди» не сужает ἀνθρώπων до лиц мужского пола.
