id: MAT.10.33
reference: Matthew 10:33
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅστις ⸂δ’ ἂν⸃ ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, ἀρνήσομαι ⸂κἀγὼ αὐτὸν⸃ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/033.yaml
  text: But whoever denies me before men[b][a], I also will deny him before my Father who is in heaven.
translation:
  language: ru
  text: А кто отречётся от Меня перед людьми, от того и Я отрекусь перед Моим Отцом, Который на небесах.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις δ’ ἂν
  choice: А кто
  rationale: Передаёт обобщающее условие и противопоставление предыдущему стиху естественной русской конструкцией.
- source_word: ἀρνήσηταί με
  choice: отречётся от Меня
  rationale: Русское «отречься от» точно выражает публичный отказ признать связь или принадлежность и сохраняет личный объект.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: перед людьми
  rationale: «Перед» передаёт значение присутствия и публичности, а «людьми» естественно выражает родовое значение ἀνθρώπων без сужения смысла до одних мужчин.
- source_word: ἀρνήσομαι κἀγὼ αὐτὸν
  choice: от того и Я отрекусь
  rationale: Повтор того же глагола сохраняет строгую взаимность высказывания; конструкция «от того» грамматически соотносится с обобщающим «кто», а «и Я» передаёт усиление κἀγώ.
- source_word: ἔμπροσθεν τοῦ πατρός μου
  choice: перед Моим Отцом
  rationale: Прямо и естественно передаёт присутствие перед Отцом и личное отношение, выраженное μου.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: Который на небесах
  rationale: Сохраняет множественное число οὐρανοῖς в принятом и естественном русском библейском выражении.
theological_decisions:
- issue: Взаимность отречения
  choice: «отречётся от Меня — от того и Я отрекусь»
  alternative: «не признает Меня — того и Я не признаю»
  rationale: Одинаковый русский глагол в обеих частях сохраняет намеренный параллелизм и богословскую напряжённость исходного текста, не уточняя сверх текста характер окончательного результата.
- issue: Обобщающее значение ἀνθρώπων и соотнесение αὐτόν
  choice: «перед людьми — от того»
  alternative: «перед мужчинами — от него»
  rationale: В данном контексте ἄνθρωποι означает людей вообще. Русское «люди» точно передаёт этот охват, а «от того» сохраняет грамматическое соответствие неопределённому «кто».
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; сохранены контраст, публичный характер отречения и строгая зеркальность двух частей. Заглавные буквы в местоимениях, относящихся ко Христу, соответствуют принятой русской библейской издательской традиции.
