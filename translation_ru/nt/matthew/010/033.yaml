  source_fidelity: Текст точно передаёт обобщённо-условную конструкцию ὅστις δ’ ἄν («А кто»), публичный аспект ἔμπροσθεν («перед») и родовое значение τῶν ἀνθρώπων («людьми»). «Отречётся от Меня» и «от того и Я отрекусь» последовательно воспроизводят один и тот же глагол ἀρνέομαι и его намеренную взаимную параллельность. «На небесах» корректно сохраняет множественное число οὐρανοῖς.
