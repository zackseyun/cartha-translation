reference: Matthew 10:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀παραδῶσιν ὑμᾶς, μὴ μεριμνήσητε πῶς ἢ τί λαλήσητε· δοθήσεται γὰρ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τί ⸀λαλήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/019.yaml
  text: But when they hand you over[a], do not worry about how or what you should speak[b], for what you should speak will be given to you in that hour.
translation:
  language: ru
  text: 'Когда же вас предадут, не тревожьтесь о том, как или что сказать: в тот час вам будет дано, что сказать.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Когда же
  rationale: Передаёт неопределённое будущее событие и мягкий переход δέ; в данном контексте естественнее, чем более обобщённое «всякий раз, когда».
- source_word: παραδῶσιν ὑμᾶς
  choice: вас предадут
  rationale: «Предадут» естественно передаёт передачу властям в враждебном судебном контексте, не сводя смысл к личному предательству.
- source_word: μὴ μεριμνήσητε
  choice: не тревожьтесь
  rationale: Передаёт запрет мучительно беспокоиться о предстоящем ответе; современно и достойно по стилю.
- source_word: πῶς ἢ τί λαλήσητε
  choice: как или что сказать
  rationale: Сохраняет различие между способом и содержанием речи и союз «или» греческого текста; инфинитив естественно выражает косвенный вопрос по-русски.
- source_word: δοθήσεται γὰρ ὑμῖν
  choice: вам будет дано
  rationale: Сохраняет будущую пассивную конструкцию и не называет прямо подразумеваемого деятеля.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: в тот час
  rationale: Близко к форме источника, ясно указывает на своевременность даруемых слов и сохраняет уместный библейский регистр.
- source_word: τί λαλήσητε
  choice: что сказать
  rationale: Естественная русская формулировка, повторяющая содержание предшествующего косвенного вопроса без стилистически тяжёлого «что говорить».
theological_decisions:
- issue: Подразумеваемый деятель в δοθήσεται
  choice: Сохранить безлично-пассивное «вам будет дано»
  alternative: «Бог даст вам» или «Дух даст вам»
  rationale: В этом стихе деятель прямо не назван; следующий стих поясняет действие Духа. Перевод сохраняет сдержанность и последовательность исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сделан естественным для устной и письменной речи; богословски значимый пассив сохранён. Смысловые примечания не требуются, поэтому маркеры в основном тексте отсутствуют.
