translation:
  language: ru
  text: А лучше идите к потерянным овцам дома Израиля[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к овцам дома Израиля, которые потерялись».'
    reason: 'Лексико-синтаксическая альтернатива: перестановка зависимых определений сохраняет образ и связь овец с домом Израиля, не навязывая значение отделения.'
lexical_decisions:
- source_word: πορεύεσθε
  choice: идите
  rationale: Форма повелительного наклонения во множественном числе; «идите» естественно передаёт прямое поручение в данном контексте.
- source_word: δὲ μᾶλλον
  choice: а идите лучше
  rationale: Сочетание выражает противопоставление предыдущему запрету и перенаправляет учеников к иной группе; «а… лучше» сохраняет и контраст, и сравнительно-предпочтительный оттенок μᾶλλον.
- source_word: πρὸς
  choice: к
  rationale: При глаголе движения предлог указывает направление к адресатам миссии.
- source_word: τὰ πρόβατα τὰ ἀπολωλότα
  choice: к потерянным овцам
  rationale: Сохраняется явный образ овец; причастие от ἀπόλλυμι в пастырской метафоре естественно передаётся как «потерянным», без сужения смысла до физической гибели.
- source_word: οἴκου Ἰσραήλ
  choice: дома Израиля
  rationale: Библейское выражение «дом Израиля» сохраняет корпоративный и заветный смысл греческой родительной конструкции.
theological_decisions:
- issue: Метафорическое описание Израиля
  choice: Сохранить выражение «потерянные овцы дома Израиля» как метафору.
  alternative: «израильтяне, сбившиеся с пути»
  rationale: Образ овец присутствует непосредственно в греческом тексте и несёт ветхозаветные пастырские ассоциации; его не следует заменять толкованием.
- issue: Связь родительного оборота οἴκου Ἰσραήλ с образом овец
  choice: Основной текст допускает естественное понимание «потерянные овцы, принадлежащие дому Израиля».
  alternative: «овцы, потерянные из дома Израиля»
  rationale: Греческая конструкция допускает оттенок происхождения или отделения, поэтому альтернативу следует сохранить в примечании, не делая её единственным прочтением.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и узнаваемой библейской образности. Начальное «а» предполагает связь с предыдущим стихом и передаёт контраст δέ; порядок слов сделан естественным для русского языка.
