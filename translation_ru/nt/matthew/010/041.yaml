id: MAT.10.41
reference: Matthew 10:41
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δεχόμενος προφήτην εἰς ὄνομα προφήτου μισθὸν προφήτου λήμψεται, καὶ ὁ δεχόμενος δίκαιον εἰς ὄνομα δικαίου μισθὸν δικαίου λήμψεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/041.yaml
  text: The one who receives a prophet in the name of a prophet will receive a prophet’s reward[b][a], and the one who receives a righteous man in the name of a righteous man will receive a righteous man’s reward.
translation:
  language: ru
  text: Кто принимает пророка во имя пророка[a], тот получит награду пророка; и кто принимает праведника во имя праведника[b], тот получит награду праведника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что он пророк»; или: «как пророка». Буквально: «во имя пророка».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «потому что он праведник»; или: «как праведника». Буквально: «во имя праведника».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεχόμενος
  choice: кто принимает
  rationale: Субстантивированное причастие настоящего времени выражает общее условие; русская конструкция «кто принимает… тот» естественно передаёт этот смысл и сохраняет повторяющуюся структуру.
- source_word: προφήτην
  choice: пророка
  rationale: Прямое соответствие греческому дополнению, сохраняющее обозначение признанного служения.
- source_word: εἰς ὄνομα προφήτου
  choice: во имя пророка
  rationale: Буквальная формулировка сохраняет повтор и смысловую связь с другими новозаветными выражениями об имени; возможный идиоматический смысл пояснён в сноске.
- source_word: μισθὸν προφήτου
  choice: награду пророка
  rationale: 'Родительная конструкция сохраняет неоднозначность: это может быть награда, получаемая пророком, либо награда, соответствующая принятию пророка.'
- source_word: λήμψεται
  choice: получит
  rationale: Естественная передача будущего времени без излишней разговорности.
- source_word: δίκαιον
  choice: праведника
  rationale: Субстантивированное прилагательное мужского рода естественно и точно передаётся русским существительным «праведник».
- source_word: εἰς ὄνομα δικαίου
  choice: во имя праведника
  rationale: Сохраняет точный параллелизм первой части и исходный образ; идиоматические варианты вынесены в сноску.
- source_word: μισθὸν δικαίου
  choice: награду праведника
  rationale: Сохраняет параллелизм и не устраняет неоднозначность родительного падежа.
theological_decisions:
- issue: Значение оборота εἰς ὄνομα с родительным падежом
  choice: Сохранить в основном тексте формулу «во имя», пояснив её возможный смысл в сносках.
  alternative: «потому что он пророк / праведник» или «как пророка / праведника»
  rationale: Оборот, вероятно, означает принятие человека с признанием его статуса или именно по причине этого статуса. Буквальная передача сохраняет богословскую выразительность и повтор исходного текста, не навязывая одного толкования.
- issue: Смысл выражений μισθὸν προφήτου и μισθὸν δικαίου
  choice: «награду пророка» и «награду праведника»
  alternative: «такую же награду, как пророк / праведник»
  rationale: Греческий родительный допускает более одного смыслового отношения. Краткая русская конструкция сохраняет эту неопределённость, не утверждая прямо, что принимающий непременно получает ту же награду, что и принятый.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достойным библейского текста звучанием. Коррелятивная конструкция «кто… тот» делает длинное греческое предложение ясным, а повтор «во имя» и синтаксический параллелизм обеих частей сохранены.
