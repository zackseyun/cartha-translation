  yaml_path: translation/nt/matthew/010/032.yaml
  text: Therefore everyone who confesses me before men[b][a], I also will confess before my Father who is in heaven.
translation:
  language: ru
  text: Итак, всякого, кто признает Меня перед людьми, признаю и Я перед Моим Отцом, Который на небесах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и Я признаю в нём»; греческое выражение может означать признание этого человека или признание в отношении него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Итак, всякого, кто
  rationale: Обобщающая конструкция охватывает каждого человека, отвечающего указанному условию; «итак» сохраняет выводную связь с предыдущей речью.
- source_word: ὁμολογήσει
  choice: исповедует
  rationale: Глагол обозначает открытое признание Иисуса и верности Ему. «Исповедует» сохраняет публичный и словесный оттенок, а также позволяет передать повтор того же глагола во второй части стиха.
- source_word: ἐν ἐμοὶ
  choice: Меня
  rationale: При ὁμολογέω предложная конструкция имеет объектное значение; по-русски естественно сказать «исповедует Меня», не воспроизводя предлог механически.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: перед людьми
  rationale: «Перед» передаёт значение присутствия и публичности, а «людьми» естественно выражает родовое значение греческого ἀνθρώπων без ограничения только мужчинами.
- source_word: ὁμολογήσω κἀγὼ
  choice: и Я исповедую
  rationale: Повтор «исповедую» сохраняет намеренную взаимность формулировки; «и Я» передаёт усиленное κἀγώ. Русское настоящее совершенного вида естественно выражает будущее действие.
- source_word: ἐν αὐτῷ
  choice: его подразумеваемый объект в форме «всякого»
  rationale: Русская конструкция «всякого… и Я исповедую» естественно удерживает объект во второй части без повторного местоимения. Буквальное «в нём» здесь было бы неясно и неидиоматично.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: Моим Отцом, Который на небесах
  rationale: Формулировка сохраняет личное «Моим Отцом» и множественное οὐρανοῖς, естественно передаваемое по-русски устойчивым выражением «на небесах».
theological_decisions:
- issue: Публичное исповедание Иисуса и ответное исповедание человека Иисусом
  choice: Передать обещание прямо как взаимное исповедание, сохранив один и тот же глагол в обеих частях.
  alternative: Уточнить как «признает Меня» и «признаю его» либо прямо связать вторую часть с последним судом.
  rationale: Стих подчёркивает соответствие двух действий, но сам по себе не уточняет время и обстоятельства исполнения обещания. Перевод не должен вносить отсутствующую в тексте систематическую трактовку.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Заглавные местоимения при обращении к Иисусу использованы согласно принятой русской библейской традиции; синтаксис сделан естественным без устранения лексической взаимности исходного текста.
