id: MAT.10.11
reference: Matthew 10:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε, ἐξετάσατε τίς ἐν αὐτῇ ἄξιός ἐστιν· κἀκεῖ μείνατε ἕως ἂν ἐξέλθητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/011.yaml
  text: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
translation:
  language: ru
  text: В какой бы город или селение вы ни вошли, разузнайте[a], кто там достоин[b], и оставайтесь там, пока не уйдёте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «расспросите»; «тщательно выясните».'
    reason: lexical_alternative
  - marker: b
    text: «Достоин» здесь, вероятно, означает человека, подходящего или готового принять посланников, а не того, кто заслужил Божье благоволение.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε
  choice: В какой бы город или селение вы ни вошли
  rationale: Русская уступительно-неопределённая конструкция «в какой бы… ни» естественно передаёт неопределённое относительное предложение с ἄν; «вошли» сохраняет направительное значение εἰς, а «город или селение» различает πόλις и κώμη.
- source_word: ἐξετάσατε
  choice: разузнайте
  rationale: Глагол обозначает целенаправленное выяснение посредством расспросов или проверки. «Разузнайте» звучит естественно и передаёт больше, чем простое «узнайте», не приобретая излишне официального оттенка слова «расследуйте».
- source_word: τίς ἐν αὐτῇ ἄξιός ἐστιν
  choice: кто там достоин
  rationale: «Кто там» естественно соотносит человека с упомянутым населённым пунктом. «Достоин» сохраняет оценочное значение ἄξιος и присущую выражению смысловую напряжённость, не подменяя его толкованием «подходит» или «готов принять».
- source_word: κἀκεῖ μείνατε
  choice: и оставайтесь там
  rationale: «И… там» передаёт оба элемента κἀκεῖ (καί + ἐκεῖ), а «оставайтесь» точно выражает продолжительное пребывание, предписанное μείνατε.
- source_word: ἕως ἂν ἐξέλθητε
  choice: пока не уйдёте
  rationale: Выражение естественно передаёт временной предел будущего пребывания. «Уйдёте» сохраняет контекстуальную неопределённость относительно того, имеется ли в виду уход из дома или из населённого пункта.
theological_decisions:
- issue: Значение слова ἄξιος («достоин») в наставлении посланникам
  choice: Сохранить в основном тексте «достоин», а контекстуальное значение пояснить в сноске.
  alternative: 'Передать толковательно: «подходит» или «готов вас принять».'
  rationale: В данном контексте слово, вероятно, указывает на человека, подходящего или расположенного принять посланников, однако греческое ἄξιος сохраняет оценочный оттенок. Буквально близкий перевод не сводит его ни к одной интерпретации и не связывает с заслуживанием Божьего благоволения.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и ненарочито архаичным звучанием. Конструкция «в какой бы… ни» идиоматична; «разузнайте» понятно передаёт тщательность поиска; «достоин» сохраняет лексическую и богословскую неоднозначность исходного текста.
