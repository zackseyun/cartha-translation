  text: προσέχετε δὲ ἀπὸ τῶν ἀνθρώπων· παραδώσουσιν γὰρ ὑμᾶς εἰς συνέδρια, καὶ ἐν ταῖς συναγωγαῖς αὐτῶν μαστιγώσουσιν ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/017.yaml
  text: But beware of people[a], for they will hand you over to councils, and in their synagogues they will flog you.
translation:
  language: ru
  text: 'Но остерегайтесь людей: они передадут вас судебным советам и будут бичевать вас в их синагогах.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέχετε
  choice: остерегайтесь
  rationale: Форма повелительного наклонения во множественном числе предупреждает об исходящей от людей опасности; «остерегайтесь» естественно передаёт эту предостерегающую силу.
- source_word: δὲ
  choice: Но
  rationale: Частица обозначает мягкое противопоставление или переход к предостережению в контексте.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: людей
  rationale: При προσέχω предлог ἀπό указывает на источник опасности. ἄνθρωποι здесь имеет обобщённое значение и не ограничивает преследователей мужчинами.
- source_word: παραδώσουσιν
  choice: будут отдавать вас под суд
  rationale: Глагол означает передачу властям; в сочетании с местными советами формулировка «отдавать под суд» естественно выражает юридический контекст, не привнося значения предательства.
- source_word: συνέδρια
  choice: местных советов
  rationale: Множественное число обозначает местные органы управления и суда, а не обязательно иерусалимский Синедрион. Добавление «местных» делает этот смысл ясным, не превращая термин в название конкретного учреждения.
- source_word: συναγωγαῖς
  choice: синагогах
  rationale: Речь идёт о конкретной иудейской среде и местах собрания; «синагога» — общеупотребительное и прозрачное соответствие.
- source_word: αὐτῶν
  choice: своих
  rationale: Русское возвратное притяжательное местоимение естественно соотносит синагоги с теми же людьми, которые будут совершать наказание.
- source_word: μαστιγώσουσιν
  choice: бичевать
  rationale: Глагол обозначает телесное наказание ударами плети. «Бичевать» сохраняет серьёзный судебно-карательный оттенок и уместно в современном литературном библейском тексте.
theological_decisions:
- issue: Обобщённое значение ἀνθρώπων
  choice: людей
  alternative: мужчин
  rationale: Грамматически существительное мужского рода, но в данном контексте оно обозначает людей как возможных преследователей вообще, без смыслового ограничения по полу.
- issue: Характер συνέδρια
  choice: местные советы
  alternative: синедрионы
  rationale: Форма множественного числа указывает на местные судебно-управленческие органы; передача техническим названием могла бы ошибочно связать все случаи с великим Синедрионом в Иерусалиме.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сохранён компактным; двоеточие ясно передаёт основание предостережения, выраженное греческим γάρ. Архаичное «внемлите» и узкоконфессиональная терминология исключены.
