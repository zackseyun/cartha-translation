review_pass:
  verdict: revise
  source_fidelity: 'В целом смысл передан верно: сохранены предостережение, обобщённое «людей», передача властям, множественное число судебных органов и наказание в синагогах. Однако «отдавать вас под суд местных советов» менее точно передаёт παραδώσουσιν εἰς συνέδρια: греческий текст говорит о передаче самих учеников советам/судебным органам, а не о помещении «под суд» как процессе. Определение «местных» допустимо по контексту множественного числа, но является добавленной конкретизацией и не необходимо.'
  naturalness: Исходный русский текст в целом литературный, но сочетание «под суд местных советов» тяжеловесно и не вполне естественно. «Передадут вас судебным советам» короче, естественнее и точнее отражает направление передачи. «В их синагогах» ясно передаёт αὐτῶν без оттенка личной собственности, который может появляться у «своих».
  terminology: «Остерегайтесь», «людей», «синагогах» и «бичевать» уместны для современного литературного библейского регистра. «Судебным советам» сохраняет институциональный оттенок συνέδρια и их юридическую функцию, не отождествляя их с иерусалимским Синедрионом.
  issues:
  - severity: medium
    issue: «будут отдавать вас под суд местных советов»
    rationale: Формулировка преобразует «передадут вас советам» в более узкое выражение о предании суду и создаёт неестественную конструкцию. Следует прямо передать передачу людей судебным органам.
  - severity: low
    issue: «местных»
    rationale: Слово не выражено непосредственно в тексте. Множественное число συνέδρια действительно исключает автоматическое отождествление с одним великим Синедрионом, однако нейтральное «судебным советам» передаёт это без добавочной локальной спецификации.
  - severity: low
    issue: «в своих синагогах»
    rationale: Возвратное местоимение возможно, но «в их синагогах» прозрачнее передаёт αὐτῶν как принадлежность или связь с теми людьми, о которых идёт речь.
  revised_text: 'Но остерегайтесь людей: они передадут вас судебным советам и будут бичевать вас в их синагогах.'
