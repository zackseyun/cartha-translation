  rationale: Исправлена конструкция при παραδίδωμι, чтобы сохранить прямой смысл передачи учеников судебным советам. Убрано невыраженное уточнение «местных»; юридико-институциональный смысл συνέδρια передан словами «судебным советам». Остальные ключевые элементы и будущее значение обоих глаголов сохранены.
