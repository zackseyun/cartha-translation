reference: Matthew 10:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τούτους τοὺς δώδεκα ἀπέστειλεν ὁ Ἰησοῦς παραγγείλας αὐτοῖς λέγων· Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε καὶ εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/005.yaml
  text: Jesus sent out these twelve, instructing them, saying, “Do not go on the road to the Gentiles, and do not enter a town of the Samaritans.”
translation:
  language: ru
  text: 'Этих двенадцать Иисус послал, дав им такое наставление: «Не идите по дороге к язычникам[a] и не входите ни в один город самарян[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «на путь язычников». Греческое выражение буквально связано с дорогой или путём и, вероятно, означает движение в сторону территории язычников.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ни в один самарянский город».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτους τοὺς δώδεκα
  choice: этих двенадцать
  rationale: Передаёт указательное местоимение, артикль и числительное без добавления отсутствующего в греческом слова «учеников».
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Естественно передаёт отправление с поручением; миссионный характер действия ясен из контекста и не требует более узкого слова «уполномочил».
- source_word: παραγγείλας αὐτοῖς λέγων
  choice: дав им такое наставление
  rationale: Естественная русская конструкция передаёт предваряющее речевое действие и директивную силу παραγγέλλω, не воспроизводя тяжеловесно два причастия подряд.
- source_word: Εἰς ὁδὸν ἐθνῶν
  choice: по дороге к язычникам
  rationale: Сохраняет образ дороги и вероятную направленность к территории неевреев; неоднозначность греческого сочетания отмечена в сноске.
- source_word: ἐθνῶν
  choice: язычникам
  rationale: В данном иудейском контексте обозначает неевреев; это устойчивое и понятное русское соответствие.
- source_word: μὴ ἀπέλθητε
  choice: не идите
  rationale: Прямо и естественно передаёт запрет, выраженный μή с аористом сослагательного наклонения.
- source_word: εἰς πόλιν Σαμαριτῶν
  choice: ни в один город самарян
  rationale: По-русски ясно выражает запрет входить в какой-либо город, принадлежащий самарянам, сохраняя именную конструкцию греческого текста.
- source_word: μὴ εἰσέλθητε
  choice: не входите
  rationale: Точно передаёт действие входа и форму запрета.
theological_decisions:
- issue: Объём и временной характер запрета идти к язычникам и входить в города самарян
  choice: Передать как прямое указание, данное двенадцати при этом конкретном отправлении, не добавляя пояснений о его длительности.
  alternative: Сформулировать запрет так, будто речь идёт о всеобщем и постоянном исключении язычников и самарян.
  rationale: Сам стих выражает сильный запрет в рамках данного поручения, но не утверждает его вечный характер. Перевод сохраняет напряжение и не вносит богословского вывода извне.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Оборот «дав им такое наставление» устраняет неестественное для русского нагромождение причастий, сохраняя директивный характер речи. Термин «язычники» употреблён в традиционном библейском значении «неевреи».
