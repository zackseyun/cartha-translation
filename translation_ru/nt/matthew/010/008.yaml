  text: ἀσθενοῦντας θεραπεύετε, ⸂νεκροὺς ἐγείρετε⸃, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε· δωρεὰν ἐλάβετε, δωρεὰν δότε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/008.yaml
  text: Heal the sick[a], raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.
translation:
  language: ru
  text: Больных исцеляйте, мёртвых воскрешайте[b], прокажённых очищайте[a], бесов изгоняйте. Даром получили — даром давайте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «людей с кожными заболеваниями». Библейское слово, традиционно переводимое как «прокажённые», могло обозначать не только современную лепру (болезнь Хансена), но и другие серьёзные заболевания кожи.'
    reason: cultural_note
  - marker: b
    text: Некоторые рукописи не содержат слов «мёртвых воскрешайте».
    reason: textual_variant
lexical_decisions:
- source_word: ἀσθενοῦντας
  choice: больных
  rationale: В контексте исцелений причастие обозначает больных людей; краткая субстантивированная форма естественна по-русски.
- source_word: θεραπεύετε
  choice: исцеляйте
  rationale: В данном перечне чудесных действий глагол означает исцелять; этот вариант менее клиничен, чем «лечите», и точно передаёт контекст.
- source_word: νεκροὺς
  choice: мёртвых
  rationale: В сочетании со следующим глаголом речь идёт об умерших людях; форма сохраняет краткость греческого текста.
- source_word: ἐγείρετε
  choice: воскрешайте
  rationale: Здесь глагол означает поднимать из мёртвых, поэтому «воскрешайте» яснее обычного «поднимайте».
- source_word: λεπροὺς
  choice: прокажённых
  rationale: Традиционный и краткий эквивалент, понятный в евангельском контексте; примечание поясняет, что библейский термин мог охватывать более широкий круг кожных заболеваний.
- source_word: καθαρίζετε
  choice: очищайте
  rationale: «Очищайте» сохраняет как телесный, так и обрядовый оттенок глагола, который был бы утрачен при переводе «исцеляйте».
- source_word: δαιμόνια
  choice: бесов
  rationale: Прямой, общеупотребительный в русском библейском контексте эквивалент обозначения злых духов.
- source_word: ἐκβάλλετε
  choice: изгоняйте
  rationale: Точно передаёт принудительное удаление в контексте изгнания бесов.
- source_word: δωρεὰν
  choice: даром
  rationale: Наречие означает «без платы, бесплатно»; повтор «даром… даром» сохраняет выразительный параллелизм оригинала.
- source_word: ἐλάβετε
  choice: получили
  rationale: Форма прошедшего времени естественно передаёт аорист и указывает на уже полученное учениками, не добавляя отсутствующего в греческом объектного местоимения.
- source_word: δότε
  choice: давайте
  rationale: Прямой перевод повелительной формы; повтор наречия перед глаголом сохраняет структуру и акцент оригинала.
theological_decisions:
- issue: Сфера действия повелений о чудесах
  choice: Передать все глаголы как прямые повеления Двенадцати в рамках данного наставления.
  alternative: Истолковать отдельные действия метафорически либо ограничить их позднейшими церковными практиками.
  rationale: Греческий текст содержит ряд конкретных повелительных форм множественного числа. Перевод не должен ни ослаблять историческую силу поручения, ни самостоятельно расширять его применение за пределы контекста.
translation_notes:
  register: Современный литературный русский язык с кратким, энергичным рядом повелений. Сохранены параллелизм и повтор «даром», а также намеренно более ёмкое «очищайте», передающее телесный и обрядовый смысл. Маркер примечания поставлен непосредственно после слова, которое он поясняет.
