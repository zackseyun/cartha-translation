id: MAT.10.26
reference: Matthew 10:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Μὴ οὖν φοβηθῆτε αὐτούς· οὐδὲν γάρ ἐστιν κεκαλυμμένον ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/026.yaml
  text: Therefore, do not fear them, for nothing is covered that will not be revealed, and hidden that will not be made known.
translation:
  language: ru
  text: Итак, не бойтесь их. Ведь нет ничего сокрытого, что не откроется, и ничего тайного, что не станет известно.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὖν φοβηθῆτε αὐτούς
  choice: Итак, не бойтесь их
  rationale: «Итак» естественно передаёт выводное οὖν, а «не бойтесь их» прямо и ясно воспроизводит запрет с указанием на тех, о ком говорится в контексте.
- source_word: κεκαλυμμένον
  choice: сокрытого
  rationale: Причастие от καλύπτω обозначает то, что покрыто или скрыто; субстантивированное «сокрытого» сохраняет образ и хорошо сочетается с последующим «откроется».
- source_word: ἀποκαλυφθήσεται
  choice: откроется
  rationale: Передаёт пассивное значение «будет открыто/раскрыто» без добавления явно названного деятеля.
- source_word: κρυπτὸν
  choice: тайного
  rationale: Отражает параллельное понятие скрытого, неизвестного, при этом избегает неестественного повтора «скрытого».
- source_word: γνωσθήσεται
  choice: станет известно
  rationale: Естественно передаёт пассивное «будет узнано/станет известным» и сохраняет безличность исходной формулировки.
theological_decisions:
- issue: Неуказанный деятель в будущих пассивных формах
  choice: Сохранить безличные конструкции «откроется» и «станет известно»
  alternative: «Бог откроет» и «Бог сделает известным»
  rationale: Греческий текст не называет деятеля; перевод не должен прямо вводить Бога как грамматически выраженный субъект, хотя контекст допускает такое понимание.
- issue: Всеобщность утверждения
  choice: «нет ничего… и ничего…»
  alternative: Сузить утверждение до конкретных дел гонителей
  rationale: Оригинал сформулирован универсально; контекстуальное применение не следует вносить в сам текст как ограничение.
translation_notes:
  register: Современный литературный русский язык; фраза звучит просто и весомо. Параллелизм греческого текста сохранён, при этом опущенная во второй части связка естественно восполнена словом «ничего».
