  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου· ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/022.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: ru
  text: И все будут ненавидеть вас за Моё имя.[a] Но тот, кто выстоит до конца,[b] будет спасён.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за Моего имени».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кто останется стойким до конца».'
    reason: lexical_alternative
  - marker: c
    text: «Будет спасён» можно также понять как «будет избавлен» или «будет спасён от опасности» — в зависимости от понимания контекста.
    reason: alternative_reading
  - marker: d
    text: 'Буквально: «Но выстоявший до конца — именно он будет спасён».'
    reason: source_emphasis
lexical_decisions:
- source_word: ἔσεσθε μισούμενοι ὑπὸ πάντων
  choice: все будут ненавидеть вас
  rationale: Греческая перифрастическая конструкция обозначает будущее состояние. Активная формулировка естественна для современного русского языка и сохраняет всеобщий охват πάντων.
- source_word: διὰ τὸ ὄνομά μου
  choice: за Моё имя
  rationale: διά с винительным указывает на причину. Формулировка сохраняет библейский образ имени как обозначения личности, власти и принадлежности Иисусу, не заменяя его толкованием.
- source_word: ὁ δὲ ὑπομείνας
  choice: Но тот, кто выстоит
  rationale: ὑπομένω в контексте гонений означает стойко перенести испытания, не отступив. «Выстоит» звучит естественно и передаёт стойкость без внесения поздней богословской терминологии.
- source_word: εἰς τέλος
  choice: до конца
  rationale: Передаёт достижение конечного предела и естественно сочетается с глаголом «выстоит».
- source_word: οὗτος
  choice: тот, кто … будет
  rationale: Указательное местоимение в греческом возобновляет и подчёркивает подлежащее. В основном тексте его отдельное повторение опущено ради естественного русского синтаксиса, а исходное усиление отражено в примечании.
- source_word: σωθήσεται
  choice: будет спасён
  rationale: Сохраняет широкий смысл σῴζω — спасение, избавление или освобождение — и не ограничивает высказывание только физическим избавлением либо заранее заданной догматической схемой.
theological_decisions:
- issue: Связь стойкости до конца со спасением
  choice: Сохранить широкую формулировку «будет спасён», не уточняя характер спасения и не формулируя доктрину о стойкости.
  alternative: «будет избавлен» или явное уточнение, что речь идёт о конечном эсхатологическом спасении
  rationale: Стих связывает стойкость во время гонений со спасением, но сам по себе не разрешает все вопросы о временном избавлении, конечном спасении и богословском учении о стойкости. Перевод должен сохранить эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок слов и активная конструкция выбраны ради ясности и естественности; образ «имени» и богословская широта глагола «спасти» сохранены.
