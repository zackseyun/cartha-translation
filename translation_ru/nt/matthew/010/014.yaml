  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν μὴ δέξηται ὑμᾶς μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν, ἐξερχόμενοι ⸀ἔξω τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/014.yaml
  text: And whoever does not receive you or listen to your words[a], as you go out of that house or that town[c][b], shake off the dust from your feet.
translation:
  language: ru
  text: А если кто не примет вас и не послушает ваших слов[a], то, выходя из того дома или из того города[b], отряхните пыль со своих ног.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и не услышит ваших слов».'
    reason: lexical_alternative
  - marker: b
    text: Слово «город» здесь может обозначать и сравнительно небольшое поселение.
    reason: lexical_alternative
  - marker: c
    text: Отряхнуть пыль с ног означало символически отмежеваться от тех, кто отверг посланников и их весть, и указывало на суд.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ ὃς ἂν μὴ
  choice: А если кто не
  rationale: Сочетание относительного местоимения с ἄν имеет неопределённо-условный смысл. «А если кто не» естественно передаёт связь с контекстом и условие, за которым следует повеление.
- source_word: δέξηται ὑμᾶς
  choice: не примет вас
  rationale: Глагол обозначает как гостеприимный приём посланников, так и благожелательное принятие их миссии; «примет» сохраняет обе стороны смысла.
- source_word: μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν
  choice: и не послушает ваших слов
  rationale: В данном контексте ἀκούω подразумевает не просто физически услышать, а выслушать обращённую к человеку весть. «Послушает» передаёт внимательное восприятие, не добавляя обязательного смысла повиновения.
- source_word: ἐξερχόμενοι ἔξω
  choice: выходя из
  rationale: Причастный оборот описывает сопутствующее главному повелению действие — уход из названного места. «Выходя из» близко сохраняет пространственный образ оригинала.
- source_word: τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης
  choice: из того дома или из того города
  rationale: Повтор предлога делает русскую фразу ясной, а «того» передаёт указательное значение ἐκείνης применительно к конкретному дому или городу. «Город» — обычное соответствие πόλις, которое в древнем контексте не обязательно подразумевает крупный населённый пункт.
- source_word: ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν
  choice: отряхните пыль со своих ног
  rationale: «Отряхните» естественно передаёт энергичное удаление пыли, а возвратное «своих» однозначно соотносит ноги с адресатами повеления.
theological_decisions:
- issue: Символическое действие в отношении отвергших посланников и их слова
  choice: Сохранить конкретное повеление «отряхните пыль со своих ног», не истолковывая его в основном тексте.
  alternative: Добавить формулировку из параллельных мест, например «во свидетельство против них», либо прямо назвать действие знаком суда.
  rationale: Сам этот стих содержит только повеление совершить символическое действие и не разъясняет его словами. Такое решение сохраняет образ и не вносит в основной текст толкование или формулировку из параллельных мест.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, но общедоступным звучанием. Синтаксис сохраняет условную структуру оригинала; конкретный символический образ оставлен без поясняющей вставки в основном тексте.
