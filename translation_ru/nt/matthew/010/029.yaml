  text: οὐχὶ δύο στρουθία ἀσσαρίου πωλεῖται; καὶ ἓν ἐξ αὐτῶν οὐ πεσεῖται ἐπὶ τὴν γῆν ἄνευ τοῦ πατρὸς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/029.yaml
  text: Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father[a][b].
translation:
  language: ru
  text: Разве двух воробьёв не продают за ассарий?[a] И всё же ни один из них не упадёт на землю без вашего Отца.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ассарий — мелкая римская медная монета очень низкой стоимости.
    reason: cultural_note
  - marker: b
    text: 'Или: «помимо вашего Отца». Эти слова могут подразумевать его знание, заботу или волю, но греческий текст не уточняет, что именно.'
    reason: alternative_reading
lexical_decisions:
- source_word: στρουθία
  choice: воробьёв
  rationale: В данном изречении слово естественно и традиционно обозначает воробьёв; более общее «маленьких птиц» менее конкретно.
- source_word: ἀσσαρίου
  choice: за один ассарий
  rationale: Сохранено историческое название конкретной мелкой римской медной монеты; её ценность поясняется в сноске.
- source_word: πωλεῖται
  choice: продают
  rationale: Русская неопределённо-личная конструкция естественно передаёт греческий пассив настоящего времени.
- source_word: ἓν ἐξ αὐτῶν
  choice: ни один из них
  rationale: В сочетании с отрицанием это идиоматично передаёт партитивное выражение и подчёркивает, что исключений нет.
- source_word: πεσεῖται ἐπὶ τὴν γῆν
  choice: не упадёт на землю
  rationale: Прямой и естественный русский эквивалент будущего времени и направления движения.
- source_word: ἄνευ τοῦ πατρὸς ὑμῶν
  choice: без вашего Отца
  rationale: Близко передаёт ἄνευ и сохраняет неопределённость греческой фразы, не добавляя явно знания, воли или позволения Отца.
- source_word: οὐχὶ ... ;
  choice: Разве не ...?
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ.
- source_word: καὶ
  choice: И всё же
  rationale: 'Выражает контекстуальное противопоставление: несмотря на ничтожную цену воробьёв, ни один не падает без Отца.'
theological_decisions:
- issue: Смысл выражения «без вашего Отца» применительно к Божьему провидению
  choice: Сохранена широкая и неоднозначная формулировка «без вашего Отца».
  alternative: «без ведома вашего Отца» или «без воли вашего Отца»
  rationale: Греческий текст утверждает отношение Отца к происходящему, но не уточняет, идёт ли речь именно о знании, воле, позволении или заботе; перевод не должен сужать это богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. «Ассарий» сохраняет историческую конкретность, а сноска делает термин понятным. Порядок маркеров привязан к соответствующим местам русского текста.
