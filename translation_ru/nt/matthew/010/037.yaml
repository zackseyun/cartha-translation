  text: ὁ φιλῶν πατέρα ἢ μητέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος· καὶ ὁ φιλῶν υἱὸν ἢ θυγατέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/037.yaml
  text: The one who loves father or mother more than me is not worthy of me[a], and the one who loves son or daughter more than me is not worthy of me.
translation:
  language: ru
  text: Кто любит отца или мать больше, чем Меня[a], тот Меня недостоин; и кто любит сына или дочь больше, чем Меня, тот Меня недостоин.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выше Меня». Греческое выражение означает любить кого-либо, отдавая ему предпочтение перед Иисусом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: кто любит
  rationale: Субстантивированное причастие настоящего времени обозначает всякого человека, для которого характерно это действие. Конструкция «кто любит» естественна в современном русском языке и сохраняет обобщённый смысл.
- source_word: πατέρα ἢ μητέρα
  choice: отца или мать
  rationale: Родственные наименования переданы прямо, без добавления притяжательного местоимения, которого нет в греческом тексте.
- source_word: ὑπὲρ ἐμέ
  choice: больше, чем Меня
  rationale: В данном сравнительном контексте ὑπέρ указывает на превосходящую любовь и предпочтение одного лица Иисусу. Такой перевод ясен и идиоматичен.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: тот Меня недостоин
  rationale: Русская конструкция с родительным падежом естественно и точно передаёт сочетание ἄξιος с μου, не добавляя идей принадлежности или пригодности.
- source_word: καὶ
  choice: и
  rationale: Простой соединительный союз сохраняет параллельное построение двух частей стиха.
- source_word: υἱὸν ἢ θυγατέρα
  choice: сына или дочь
  rationale: Родственные наименования переданы непосредственно и без отсутствующего в оригинале притяжательного местоимения.
theological_decisions:
- issue: Требование Иисуса и любовь к ближайшим родственникам
  choice: Сохранено требование любить Иисуса больше, чем самых близких членов семьи.
  alternative: Ослабить высказывание до «любит Меня не так же сильно» либо истолковать его как требование ненавидеть семью.
  rationale: Греческий текст устанавливает сравнительный приоритет и выносит резкий вердикт о недостоинстве. Перевод не отрицает ценности семейной любви, но и не смягчает требование высшей верности Иисусу.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-сдержанный. Повтор «тот Меня недостоин» сохраняет риторический параллелизм оригинала; местоимение «Меня» написано с прописной буквы согласно распространённой русской библейской издательской норме.
