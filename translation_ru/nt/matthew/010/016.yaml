id: MAT.10.16
reference: Matthew 10:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἰδοὺ ἐγὼ ἀποστέλλω ὑμᾶς ὡς πρόβατα ἐν μέσῳ λύκων· γίνεσθε οὖν φρόνιμοι ὡς οἱ ὄφεις καὶ ἀκέραιοι ὡς αἱ περιστεραί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/016.yaml
  text: Look, I am sending you out as sheep in the midst of wolves; therefore be wise as the snakes and innocent as the doves.
translation:
  language: ru
  text: Вот, Я посылаю вас, как овец посреди волков. Поэтому будьте благоразумны, как змеи, и чисты, как голуби.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Естественный для современного литературного русского маркер привлечения внимания, сохраняющий торжественную выразительность греческого текста.
- source_word: ἀποστέλλω
  choice: посылаю
  rationale: Прямо передаёт действие и миссионное поручение без добавления отсутствующего в оригинале уточнения «на служение» или «в путь».
- source_word: ὡς πρόβατα ἐν μέσῳ λύκων
  choice: как овец посреди волков
  rationale: Сохраняет образ, уязвимость посланных и буквальное пространственное выражение ἐν μέσῳ.
- source_word: φρόνιμοι
  choice: благоразумны
  rationale: Передаёт практическую рассудительность и осмотрительность, не сводя смысл только к интеллектуальной мудрости или хитрости.
- source_word: οἱ ὄφεις
  choice: змеи
  rationale: Обычное современное название; родовой образ в русском не требует определённого артикля.
- source_word: ἀκέραιοι
  choice: чисты
  rationale: В данном нравственном противопоставлении означает внутреннюю неиспорченность и отсутствие злого умысла; «безыскусны» архаично, а «невинны» может ошибочно звучать как отсутствие вины вообще.
- source_word: αἱ περιστεραί
  choice: голуби
  rationale: Естественная русская форма родового сравнения, сохраняющая общеизвестный образ незлобивости.
theological_decisions:
- issue: Соотношение благоразумия и нравственной чистоты
  choice: 'Сохранены два взаимно ограничивающих повеления: «благоразумны» и «чисты».'
  alternative: Передать φρόνιμοι как «хитры», что могло бы приписать ученикам одобряемую лукавость.
  rationale: Текст призывает сочетать практическую осмотрительность с отсутствием злого умысла, не разрешая напряжение в пользу наивности или обмана.
translation_notes:
  register: Современный литературный русский с достоинством прямой речи Иисуса. Синтаксис близок к греческому, но естественен по-русски; заглавная «Я» соблюдает традиционную русскую издательскую норму для речи Христа.
