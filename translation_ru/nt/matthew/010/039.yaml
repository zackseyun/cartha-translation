id: MAT.10.39
reference: Matthew 10:39
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ εὑρὼν τὴν ψυχὴν αὐτοῦ ἀπολέσει αὐτήν, καὶ ὁ ἀπολέσας τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/039.yaml
  text: The one who finds his life will lose it[a], and the one who loses his life for my sake will find it.
translation:
  language: ru
  text: Кто обретает свою жизнь, тот потеряет её[a], а кто потеряет свою жизнь ради Меня, тот обретёт её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «душу» — в обеих частях стиха. Греческое слово ψυχή может означать и «жизнь», и «душу»; в данном контексте речь прежде всего о потере и обретении жизни в следовании за Иисусом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εὑρὼν
  choice: кто обретает
  rationale: Субстантивированное причастие обозначает всякого человека, к которому относится изречение. Конструкция «кто… тот» естественна для современного русского языка и сохраняет обобщающий смысл.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: свою жизнь
  rationale: В контексте ученичества ψυχή означает прежде всего жизнь человека, которую он стремится сохранить или готов потерять. Возвратное «свою» естественно передаёт соотнесённость жизни с субъектом.
- source_word: ἀπολέσει
  choice: потеряет
  rationale: Здесь ἀπόλλυμι выражает утрату; этот вариант сохраняет прямое противопоставление глаголу «обретёт» и парадоксальную форму изречения.
- source_word: ὁ ἀπολέσας
  choice: кто потеряет
  rationale: Хотя греческое причастие стоит в аористе, в обобщающем изречении русское будущее время естественно согласуется с главным глаголом и передаёт условно-обобщающий смысл.
- source_word: ἕνεκεν ἐμοῦ
  choice: ради Меня
  rationale: Предлог обозначает причину или мотив. «Ради Меня» кратко и естественно выражает личную верность Иисусу.
- source_word: εὑρήσει
  choice: обретёт
  rationale: Повтор того же русского глагола, что и в первой части, сохраняет намеренную словесную симметрию εὑρών / εὑρήσει; «обретёт» здесь звучит естественнее, чем буквальное «найдёт жизнь».
- source_word: αὐτήν
  choice: её
  rationale: Местоимение относится к существительному «жизнь» и сохраняет явный повтор референта в обеих частях.
theological_decisions:
- issue: Передача ψυχή в парадоксе ученичества
  choice: жизнь
  alternative: душа
  rationale: Речь идёт о стремлении сохранить или готовности отдать собственную жизнь ради Иисуса, а не прежде всего о противопоставлении тела и нематериальной души. При этом примечание сохраняет более широкий традиционный вариант «душа».
translation_notes:
  register: Современный литературный русский язык с достоинством афористического изречения. Парная конструкция «кто… тот» и повтор «обретает/обретёт — потеряет/потеряет» сохраняют риторическую симметрию и парадокс оригинала; заглавная буква в «Меня» следует принятой русской библейской орфографии.
