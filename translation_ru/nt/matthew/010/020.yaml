  text: οὐ γὰρ ὑμεῖς ἐστε οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τοῦ πατρὸς ὑμῶν τὸ λαλοῦν ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/020.yaml
  text: For it is not you who are speaking[b][a], but the Spirit of your Father speaking in you.
translation:
  language: ru
  text: Ведь не вы говорите, а Дух вашего Отца говорит в вас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через вас». В греческом тексте: «в вас»; в данном контексте это может также подразумевать речь, звучащую через учеников.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Ведь не
  rationale: Частица γάρ объясняет предыдущее заверение; «ведь» естественно передаёт эту пояснительную связь.
- source_word: ὑμεῖς ἐστε οἱ λαλοῦντες
  choice: вы будете говорить
  rationale: Конструкция подчёркивает, что говорящими будут не сами ученики. Будущее время по-русски естественно обусловлено контекстом предстоящего свидетельства, хотя греческая форма настоящего времени буквально означает «вы говорите / являетесь говорящими».
- source_word: ἀλλὰ
  choice: но
  rationale: Передаёт прямое и сильное противопоставление.
- source_word: τὸ πνεῦμα τοῦ πατρὸς ὑμῶν
  choice: Дух вашего Отца
  rationale: Сохраняет порядок и содержание греческого выражения; «небесного» в этом стихе отсутствует. Заглавные буквы указывают на Бога как референта, не добавляя нового смысла.
- source_word: τὸ λαλοῦν
  choice: будет говорить
  rationale: Повтор личной глагольной формы звучит по-русски ясно и сохраняет действие причастия, относящегося к Духу.
- source_word: ἐν ὑμῖν
  choice: в вас
  rationale: Это наиболее прямое соответствие ἐν ὑμῖν; возможный смысл действия «через вас» не подменяет основное чтение и вынесен в примечание.
theological_decisions:
- issue: Передавать ли ἐν ὑμῖν как пребывание/действие «в вас» или как посредничество «через вас»
  choice: в вас
  alternative: через вас
  rationale: Прямое значение предлога ἐν — «в». Контекст речи учеников допускает инструментальный оттенок «через вас», но основной текст сохраняет неоднозначность и богословское напряжение оригинала.
translation_notes:
  register: Современный литературный русский язык, ясный и dignified библейский регистр без архаизмов. Повтор «говорить» намеренно сохраняет риторический контраст оригинала. Маркер примечания поставлен непосредственно после спорного выражения.
