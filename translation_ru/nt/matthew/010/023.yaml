source:
  edition: SBLGNT
  text: ὅταν δὲ διώκωσιν ὑμᾶς ἐν τῇ πόλει ταύτῃ, φεύγετε εἰς τὴν ⸀ἑτέραν· ἀμὴν γὰρ λέγω ὑμῖν, οὐ μὴ τελέσητε τὰς πόλεις ⸀τοῦ Ἰσραὴλ ἕως ⸀ἂν ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/023.yaml
  text: But whenever they persecute you in this city[a], flee to the next one. For truly I say to you[c][b], you will certainly not finish going through the cities of Israel until the Son of Man comes.
translation:
  language: ru
  text: 'Когда же вас будут преследовать в этом городе, бегите в другой город[a]. Истинно говорю вам: вы ни в коем случае не успеете обойти города Израиля[b], прежде чем придёт Сын Человеческий[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «в другой»; слово «город» подразумевается из предыдущей части фразы.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не закончите города Израиля». Перевод «не успеете обойти» делает явным подразумеваемое в контексте посещение городов во время проповеди.'
    reason: lexical_alternative
  - marker: c
    text: Слова «прежде чем придёт Сын Человеческий» намеренно оставлены без уточнения. Их связывают с оправданием Иисуса после воскресения, приходом для суда или Его окончательным возвращением.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: когда
  rationale: В сочетании с будущим временем в русском языке естественно передаёт неопределённую будущую ситуацию; повторяемость или возможность события здесь выражается контекстом.
- source_word: διώκωσιν
  choice: будут преследовать
  rationale: В контексте наставления посланникам глагол обозначает враждебное преследование, а не просто погоню.
- source_word: πόλει ταύτῃ
  choice: в этом городе
  rationale: Сохраняет указательное значение ταύτῃ и непосредственность наставления.
- source_word: φεύγετε
  choice: бегите
  rationale: Повелительная форма передаёт настоятельное требование покинуть место преследования; современное русское «бегите» здесь естественнее, чем более книжное «бегите прочь» или «спасайтесь бегством».
- source_word: εἰς τὴν ἑτέραν
  choice: в другой
  rationale: Существительное «город» подразумевается из предыдущей части фразы; «в другой» сохраняет эту эллиптическую конструкцию и не навязывает строго последовательного значения «следующий».
- source_word: ἀμὴν
  choice: истинно
  rationale: Передаёт торжественную формулу, вводящую авторитетное высказывание Иисуса, в привычном и понятном русском библейском регистре.
- source_word: οὐ μὴ τελέσητε
  choice: вы ни в коем случае не успеете обойти
  rationale: «Ни в коем случае не» передаёт усиленное отрицание οὐ μή. Глагол «успеете» вместе с «прежде чем» естественно выражает незавершённость действия к обозначенному будущему моменту, а «обойти» делает явным подразумеваемое перемещение по городам.
- source_word: τὰς πόλεις τοῦ Ἰσραήλ
  choice: города Израиля
  rationale: Прямая и естественная передача сочетания с родительным падежом без уточнения, означает ли «Израиль» землю или народ.
- source_word: ἕως ἂν ἔλθῃ
  choice: прежде чем придёт
  rationale: В отрицательной конструкции естественно передаёт будущую временную границу, выраженную ἕως ἄν с сослагательным наклонением.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшаяся передача титула, сохраняющая его буквальную форму и богословские ассоциации.
theological_decisions:
- issue: Значение слов о приходе Сына Человеческого
  choice: Сохранить формулировку «прежде чем придёт Сын Человеческий», не уточняя событие.
  alternative: Истолковать приход как воскресение и оправдание Иисуса, суд над Иерусалимом либо окончательное возвращение Христа.
  rationale: Греческий текст не определяет однозначно, к какому именно событию относится этот приход. Перевод сохраняет присущую тексту эсхатологическую открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан естественным для широкого читателя; формула «Истинно говорю вам» и титул «Сын Человеческий» сохранены как узнаваемые библейские выражения. Толкование спорного «прихода» в основной текст не внесено.
