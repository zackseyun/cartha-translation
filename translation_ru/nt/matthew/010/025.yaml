  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀρκετὸν τῷ μαθητῇ ἵνα γένηται ὡς ὁ διδάσκαλος αὐτοῦ, καὶ ὁ δοῦλος ὡς ὁ κύριος αὐτοῦ. εἰ τὸν οἰκοδεσπότην Βεελζεβοὺλ ⸀ἐπεκάλεσαν, πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/025.yaml
  text: It is enough for the disciple that he become like his teacher[a], and the slave like his master. If they called the master of the house Beelzebul, how much more those of his household.
translation:
  language: ru
  text: Довольно ученику стать таким, как его учитель, и рабу — таким, как его господин. Если хозяина дома назвали Веельзевулом[a], то тем более — его домашних.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Традиционная вариантная форма имени — «Веельзевув».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρκετὸν
  choice: Довольно
  rationale: Кратко и естественно передаёт предикативное значение достаточности.
- source_word: μαθητῇ
  choice: ученику
  rationale: Сохраняет смысл личного ученичества, а не только академического обучения.
- source_word: ἵνα γένηται
  choice: стать
  rationale: Инфинитив естественно передаёт конструкцию достаточности с ἵνα и не уточняет без необходимости оттенок цели или результата.
- source_word: διδάσκαλος
  choice: учитель
  rationale: Точно соответствует паре «ученик — учитель» и не смешивается с κύριος.
- source_word: δοῦλος
  choice: раб
  rationale: В противопоставлении κύριος обозначена зависимость раба от господина; более мягкое «слуга» ослабило бы социальную иерархию.
- source_word: κύριος
  choice: господин
  rationale: Здесь слово употреблено в бытовом отношении к рабу, а не как явный титул «Господь».
- source_word: οἰκοδεσπότην
  choice: хозяина дома
  rationale: Передаёт как принадлежность к дому, так и власть главы хозяйства.
- source_word: Βεελζεβοὺλ
  choice: Веельзевул
  rationale: Следует греческой форме SBLGNT и её принятой русской передаче.
- source_word: ἐπεκάλεσαν
  choice: назвали
  rationale: В контексте означает дать кому-либо оскорбительное наименование.
- source_word: πόσῳ μᾶλλον
  choice: тем более
  rationale: Естественный русский эквивалент аргумента от большего к меньшему.
- source_word: οἰκιακοὺς
  choice: домашних
  rationale: Охватывает всех принадлежащих к дому людей, не ограничивая значение рабами или родственниками.
theological_decisions:
- issue: Передача κύριος в бытовой аналогии
  choice: господин
  alternative: Господь; хозяин
  rationale: Непосредственная пара с δοῦλος задаёт социально-бытовой смысл. «Господь» внесло бы явный титульный оттенок, которого форма сама по себе здесь не требует.
- issue: Передача δοῦλος
  choice: раб
  alternative: слуга
  rationale: Контраст с господином подчёркивает подчинённое правовое и социальное положение; «раб» точнее сохраняет напряжение образа.
- issue: Подразумеваемое дополнение после πόσῳ μᾶλλον
  choice: то тем более — его домашних
  alternative: то насколько же больше назовут так его домашних
  rationale: Греческий текст эллиптичен; русская конструкция с тире сохраняет эту сжатость и не добавляет прямо отсутствующий глагол.
translation_notes:
  register: Современный литературный русский с достоинством и ясностью. Эллипсис заключительной части сохранён посредством тире; параллелизм «ученик — учитель» и «раб — господин» оставлен явным.
