  choice: волосы на голове
  rationale: Современное и естественное русское выражение, точно обозначающее волосы головы.
- source_word: πᾶσαι
  choice: все
  rationale: Сохраняет подчёркнутую полноту исходного текста.
- source_word: ἠριθμημέναι εἰσίν
  choice: сосчитаны
  rationale: Греческая перифрастическая форма перфекта страдательного залога выражает совершённое действие с сохраняющимся результатом; краткая страдательная форма естественно передаёт состояние в настоящем.
