reference: Matthew 10:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι· ⸁φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον ⸀καὶ ψυχὴν ⸁καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/028.yaml
  text: And do not fear those who kill the body but are not able to kill the soul. Rather[a], fear the one who is able to destroy both soul and body in Gehenna.
translation:
  language: ru
  text: И не бойтесь тех, кто убивает тело, но не может убить душу. А лучше бойтесь того, кто может и душу, и тело погубить в геенне[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в аду». Греческое слово «геенна» происходит от названия долины Еннома и употребляется как обозначение места окончательного суда.'
    reason: Лексическая альтернатива и историко-культурное пояснение.
lexical_decisions:
- source_word: φοβεῖσθε
  choice: не бойтесь / бойтесь
  rationale: Повтор одного глагола сохраняет прямое противопоставление исходного текста и силу предостережения.
- source_word: ἀπὸ τῶν ἀποκτεννόντων
  choice: тех, кто убивает
  rationale: Субстантивированное причастие обозначает общий класс людей; по-русски естественно передаётся придаточным предложением.
- source_word: σῶμα
  choice: тело
  rationale: Прямой и общепонятный эквивалент, сохраняющий противопоставление душе.
- source_word: ψυχήν
  choice: душу
  rationale: В явном противопоставлении телу слово обозначает нематериальную сторону человека; вариант «жизнь» размыл бы это противопоставление.
- source_word: μὴ δυναμένων ἀποκτεῖναι
  choice: не может убить
  rationale: Передаёт неспособность совершить действие; согласование в единственном числе естественно при русском относительном местоимении «кто» после «тех».
- source_word: μᾶλλον
  choice: лучше
  rationale: 'В конструкции «бойтесь лучше» естественно выражает корректирующее противопоставление: бояться следует не первых, а второго.'
- source_word: τὸν δυνάμενον
  choice: Того, кто может
  rationale: Сохраняет субстантивированное обозначение без добавления имени референта. Прописная буква ненавязчиво отражает наиболее вероятную отсылку к Богу, не вводя её прямо в текст.
- source_word: ἀπολέσαι
  choice: погубить
  rationale: Передаёт решительное уничтожение или гибель в суде, не уточняя метафизический характер наказания сверх сказанного.
- source_word: ἐν γεέννῃ
  choice: в геенне
  rationale: Транслитерация сохраняет конкретный греческий термин и его иудейский исторический фон; привычный эквивалент поясняется в сноске.
theological_decisions:
- issue: Кто назван способным погубить душу и тело в геенне
  choice: «Того, кто может» — без прямого называния
  alternative: 'Прямо указать: «Бога»; либо понимать как сатану'
  rationale: Контекст наиболее естественно указывает на Бога как обладающего окончательной судебной властью, однако греческий текст прямо не называет референта. Формулировка сохраняет эту особенность текста.
- issue: Передача γέεννα
  choice: геенна
  alternative: ад
  rationale: «Геенна» сохраняет исходный термин, связанный с долиной Еннома и образом окончательного суда; «ад» дан как понятный традиционный эквивалент в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-сдержанный. Синтаксический параллелизм «не бойтесь… бойтесь» сохранён; термин «геенна» пояснён без перегрузки основного текста.
