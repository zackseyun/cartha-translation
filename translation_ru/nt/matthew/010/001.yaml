  text: Καὶ προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ ἔδωκεν αὐτοῖς ἐξουσίαν πνευμάτων ἀκαθάρτων ὥστε ἐκβάλλειν αὐτὰ καὶ θεραπεύειν πᾶσαν νόσον καὶ πᾶσαν μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/001.yaml
  text: And calling his twelve disciples to himself[a], he gave them authority over unclean spirits[c][b], to cast them out and to heal every disease and every sickness.
translation:
  language: ru
  text: И, призвав к себе двенадцать своих учеников, Он дал им власть над нечистыми духами[a], чтобы изгонять их и исцелять всякую болезнь и всякий недуг[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полномочие над нечистыми духами». Греческое слово может обозначать власть, полномочие или способность, силу.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально употреблены два близких слова: «всякую болезнь и всякую немощь»; они охватывают различные болезни и телесные недуги.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: призвав к себе
  rationale: Аористное причастие среднего залога передаёт предшествующее или сопутствующее основной ситуации действие и идею призыва к себе; русское деепричастие сохраняет компактность греческой конструкции.
- source_word: τοὺς δώδεκα μαθητὰς αὐτοῦ
  choice: двенадцать Своих учеников
  rationale: μαθητής в евангельском контексте естественно передаётся словом «ученик»; «Своих» ясно связывает учеников с Иисусом и соответствует нормам русского письма при обозначении принадлежности действующему лицу.
- source_word: ἔδωκεν
  choice: дал
  rationale: Прямой и немаркированный эквивалент δίδωμι, не добавляющий оттенков торжественного дарования.
- source_word: ἐξουσίαν
  choice: власть
  rationale: ἐξουσία обозначает полномочие и право действовать, здесь полученные от Иисуса, а не только безличную силу.
- source_word: πνευμάτων ἀκαθάρτων
  choice: над нечистыми духами
  rationale: Родительный падеж при ἐξουσία естественно выражает объект власти; «нечистые духи» — точное и узнаваемое соответствие евангельскому выражению.
- source_word: ὥστε
  choice: чтобы
  rationale: ὥστε с инфинитивами допускает оттенки цели и результата; русское «чтобы» естественно передаёт предоставленную возможность и назначение власти, не вводя громоздкой конструкции.
- source_word: ἐκβάλλειν αὐτά
  choice: изгонять их
  rationale: В контексте нечистых духов ἐκβάλλω означает удалять или изгонять; местоимение прямо отсылает к духам.
- source_word: θεραπεύειν
  choice: исцелять
  rationale: В данном контексте θεραπεύω означает исцелять больных; выбран привычный, но современно понятный библейский термин.
- source_word: πᾶσαν νόσον
  choice: всякую болезнь
  rationale: νόσος обозначает болезнь или заболевание; «болезнь» сохраняет общий медицинский смысл.
- source_word: πᾶσαν μαλακίαν
  choice: всякий недуг
  rationale: μαλακία здесь означает телесную слабость, немощь или заболевание; «недуг» сохраняет различие со словом νόσος, не сужая значение до одного вида болезни.
theological_decisions:
- issue: Характер данной ученикам способности
  choice: Иисус дал ученикам власть над нечистыми духами
  alternative: Иисус дал ученикам силу против нечистых духов
  rationale: «Власть» лучше отражает ἐξουσία как предоставленное полномочие, сохраняя мысль о том, что источник этого полномочия — Иисус, без добавления дальнейших догматических выводов.
- issue: Соотношение цели и результата в ὥστε с инфинитивом
  choice: чтобы изгонять их и исцелять
  alternative: так что они могли изгонять их и исцелять
  rationale: Греческая конструкция может сочетать целевой и результативный оттенки. Основной текст использует естественное русское обозначение назначения данной власти, а примечание сохраняет альтернативный оттенок результата или возможности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис следует греческой последовательности, но остаётся естественным для русского читателя. Парное выражение «болезнь и недуг» сохраняет лексическое различие νόσος и μαλακία; двусмысленность ἐξουσία пояснена в сноске.
