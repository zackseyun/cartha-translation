  text: καὶ ἐχθροὶ τοῦ ἀνθρώπου οἱ οἰκιακοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/036.yaml
  text: And a man's enemies will be those of his own household[a].
translation:
  language: ru
  text: И враги человеку — его домашние.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и врагами человека станут его домочадцы».'
    reason: 'Лексико-синтаксическая альтернатива: греческое οἰκιακοί означает людей, принадлежащих к дому или домашнему кругу.'
lexical_decisions:
- source_word: καὶ
  choice: и
  rationale: Простой сочинительный союз сохраняет связь с предыдущим высказыванием, не добавляя причинного или усилительного оттенка.
- source_word: ἐχθροὶ
  choice: враги
  rationale: Субстантивированное прилагательное во множественном числе обозначает людей, враждебных человеку; «враги» — естественный и точный русский эквивалент.
- source_word: τοῦ ἀνθρώπου
  choice: человеку
  rationale: Родительный принадлежности при именном сказуемом естественно передаётся русской конструкцией «враги человеку». Слово «человек» сохраняет обобщённое значение греческого ἄνθρωπος.
- source_word: οἱ οἰκιακοὶ αὐτοῦ
  choice: его домашние
  rationale: οἰκιακοί обозначает принадлежащих к дому, то есть членов домашнего круга, а не само жилище. «Его домашние» кратко и естественно передаёт этот смысл и местоимение αὐτοῦ.
theological_decisions:
- issue: Обобщённое значение ἀνθρώπου и грамматический род
  choice: человеку
  alternative: у человека / человеку — члены его семьи
  rationale: Русское «человек» грамматически мужского рода, но в таком изречении имеет общеупотребительное родовое значение. Это сохраняет форму и широту исходного выражения без искусственного сужения смысла до взрослого мужчины.
- issue: Объём понятия οἰκιακοί
  choice: домашние
  alternative: члены семьи / домочадцы
  rationale: «Домашние» допускает более широкий круг живущих в доме людей, как и греческое слово, тогда как «члены семьи» может неоправданно ограничить смысл кровным или юридическим родством.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой исходного изречения. «Домашние» звучит естественно и достойно; порядок слов сохраняет смысловое ударение на ближайшем окружении человека.
