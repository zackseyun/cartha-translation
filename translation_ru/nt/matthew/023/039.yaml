  variant: modern literary Russian
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, οὐ μή με ἴδητε ἀπ’ ἄρτι ἕως ἂν εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/039.yaml
  text: For I tell you[a], from now on you will certainly not see me until you say[b], ‘Blessed is he who comes in the name of the Lord.’
translation:
  language: ru
  text: 'Ибо говорю вам: отныне вы точно не увидите Меня, пока не скажете: «Благословен Грядущий во имя Господа!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Цитата из Псалма 117:26 (в иной нумерации — 118:26).
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Говорю вам
  rationale: 'Естественная для современного русского языка формула прямого обращения. Связующая сила γάρ передана контекстуально: русское «ведь» здесь могло бы неуместно ослабить торжественность утверждения.'
- source_word: οὐ μή ... ἴδητε
  choice: точно не увидите
  rationale: Сочетание οὐ μή с аористом конъюнктива выражает усиленное отрицание; «точно не увидите» передаёт уверенность утверждения современно и без архаизма.
- source_word: ἀπ’ ἄρτι
  choice: отныне
  rationale: Кратко и точно обозначает период, начинающийся с настоящего момента; слово сохраняет достойный библейский регистр и понятно современному читателю.
- source_word: ἕως ἂν εἴπητε
  choice: пока не скажете
  rationale: Естественно передаёт будущий предел действия и не уточняет время или обстоятельства исполнения.
- source_word: Εὐλογημένος
  choice: Благословен
  rationale: Сохраняет значение и узнаваемую формулировку цитаты из Псалма 117:26 по русской нумерации.
- source_word: ὁ ἐρχόμενος
  choice: Грядущий
  rationale: Субстантивированное причастие передано ёмко и с сохранением традиционного псаломского звучания. Формулировка не определяет сама по себе конкретный момент пришествия.
- source_word: ἐν ὀνόματι κυρίου
  choice: во имя Господа
  rationale: Точно воспроизводит предложную конструкцию и сохраняет установившееся библейское выражение.
theological_decisions:
- issue: Будущее видение Иисуса и произнесение благословения
  choice: 'Сохранено неопределённое указание на будущее: «пока не скажете»'
  alternative: Уточнить это как второе пришествие, будущее покаяние Израиля либо иное конкретное событие
  rationale: Греческий текст устанавливает предел отсутствия видения, но не называет точного исторического или эсхатологического события; перевод не должен разрешать эту напряжённость за текст.
- issue: Возможный титульный оттенок ὁ ἐρχόμενος
  choice: Грядущий
  alternative: тот, кто приходит / идущий
  rationale: Контекст цитаты допускает узнаваемый мессианский оттенок, но перевод сохраняет форму цитаты и не добавляет отдельного доктринального пояснения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Прописные «Меня» и «Грядущий» следуют принятому русскому религиозному письму; смысловая неоднозначность срока исполнения сохранена.
