  text: ὑμεῖς δὲ μὴ κληθῆτε· Ῥαββί, εἷς γάρ ἐστιν ὑμῶν ὁ ⸀διδάσκαλος, πάντες δὲ ὑμεῖς ἀδελφοί ἐστε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/008.yaml
  text: But you are not to be called ‘Rabbi,’ for one is your teacher[b][a], and you are all brothers.
translation:
  language: ru
  text: А вас пусть не называют «равви»[a], ведь учитель у вас один, а вы все — братья[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Равви» — еврейское почтительное обращение к учителю. Транслитерация сохраняет иудейскую обстановку и не смешивает этот титул со словом «учитель» далее в стихе.
    reason: lexical_alternative
  - marker: b
    text: Греческое ἀδελφοί имеет форму мужского рода и буквально означает «братья»; в данном контексте слово может обозначать учеников как единое сообщество.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κληθῆτε
  choice: пусть вас не называют
  rationale: Передаёт запретительную конструкцию с пассивным залогом и не заменяет её утверждением о том, как ученики называют самих себя.
- source_word: Ῥαββί
  choice: равви
  rationale: Сохраняет переданный в греческом тексте еврейский титул и историческую обстановку, не сливая его со словом διδάσκαλος далее в стихе.
- source_word: εἷς
  choice: один
  rationale: Прямо передаёт указание на единственность, не усиливая его добавочным словом «только».
- source_word: ὑμῶν ὁ διδάσκαλος
  choice: учитель у вас
  rationale: Естественно выражает отношение учителя к ученикам; порядок слов позволяет сохранить акцент на том, что учитель один.
- source_word: πάντες δὲ ὑμεῖς ἀδελφοί ἐστε
  choice: а вы все — братья
  rationale: Сохраняет коллективное ударение πάντες и семейную метафору мужского множественного ἀδελφοί.
theological_decisions:
- issue: Запрещает ли Иисус любые человеческие почётные титулы без исключения или обличает стремление к статусу среди учеников
  choice: Сохранён прямой запрет без расширения его до всеобщего правила о любых титулах.
  alternative: Истолковать фразу либо как абсолютный запрет всех подобных обращений, либо лишь как осуждение лицемерного честолюбия.
  rationale: Сам греческий текст формулирует запрет и его основание, но не определяет все возможные последующие применения.
- issue: Следует ли писать «учитель» с прописной буквы как прямое обозначение Христа
  choice: 'Строчная буква: «учитель».'
  alternative: «Учитель» с прописной буквы.
  rationale: В греческом письме данного источника такое богословское различие регистром не выражено; строчная буква сохраняет формулировку без дополнительного толкования личности единственного учителя.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Конструкция «пусть вас не называют» сохраняет пассивную направленность запрета; тире естественно подчёркивает равное братское положение всех учеников.
