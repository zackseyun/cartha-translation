  text: ὥστε μαρτυρεῖτε ἑαυτοῖς ὅτι υἱοί ἐστε τῶν φονευσάντων τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/031.yaml
  text: So you testify against yourselves that you are sons of those who murdered the prophets[a].
translation:
  language: ru
  text: Тем самым вы свидетельствуете против самих себя, что вы — сыновья тех, кто убил пророков.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свидетельствуете самим себе». Греческое выражение можно передать более буквально так, однако в контексте это свидетельство изобличает их самих.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Тем самым
  rationale: Передаёт вывод из предшествующих слов и естественно связывает признание собеседников с вытекающим из него свидетельством.
- source_word: μαρτυρεῖτε
  choice: свидетельствуете
  rationale: Сохраняет судебно-обличительный оттенок греческого глагола и хорошо сочетается с контекстом самоизобличения.
- source_word: ἑαυτοῖς
  choice: против самих себя
  rationale: Буквально дательный падеж допускает «самим себе», но в данном контексте свидетельство изобличает говорящих; выбранный вариант естественно выражает эту прагматическую силу.
- source_word: ὅτι
  choice: что
  rationale: Вводит содержание свидетельства, а не его причину.
- source_word: υἱοί
  choice: сыновья
  rationale: Сохраняет прямо выраженный мужской род, семейный образ и риторическую связь как с происхождением, так и с нравственной солидарностью.
- source_word: τῶν φονευσάντων
  choice: тех, кто убивал
  rationale: Передаёт виновное лишение жизни без стилистически тяжёлого «умерщвлял»; русский несовершенный вид естественно описывает исторически повторявшееся деяние этой группы.
- source_word: τοὺς προφήτας
  choice: пророков
  rationale: Прямо и ясно обозначает известную категорию Божьих посланников.
theological_decisions:
- issue: Следует ли передать υἱοί буквально как «сыновья» или истолковать шире как «потомки».
  choice: сыновья
  alternative: потомки
  rationale: «Сыновья» сохраняет семейную метафору исходного текста и напряжение между реальным происхождением и нравственным уподоблением предкам, не сводя смысл только к генеалогии.
translation_notes:
  register: Современный литературный русский язык; тон прямой, обличительный и достойный. Тире перед именной частью подчёркивает обвинительный вывод, не добавляя нового смысла.
