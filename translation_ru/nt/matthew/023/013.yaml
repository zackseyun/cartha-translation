source:
  edition: SBLGNT
  text: Οὐαὶ ⸀δὲ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κλείετε τὴν βασιλείαν τῶν οὐρανῶν ἔμπροσθεν τῶν ἀνθρώπων· ὑμεῖς γὰρ οὐκ εἰσέρχεσθε, οὐδὲ τοὺς εἰσερχομένους ἀφίετε ⸀εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/013.yaml
  text: But woe to you[a], scribes and Pharisees, hypocrites! For you shut the kingdom of heaven before people; for you do not enter[c][b], nor do you allow those who are entering to enter.
translation:
  language: ru
  text: 'Горе вам, книжники и фарисеи, лицемеры! Ведь вы закрываете перед людьми Царство Небесное: сами не входите и тем, кто входит[a], войти не позволяете.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тем, кто стремится войти». Греческое причастие может обозначать как входящих, так и тех, кто пытается войти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: Горе вам
  rationale: Сохраняет силу пророческого обличения и естественно звучит в русском библейском регистре.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Устоявшееся и точное обозначение знатоков и толкователей Писания в евангельском контексте.
- source_word: ὑποκριταί
  choice: лицемеры
  rationale: Передаёт нравственно-религиозное притворство, подразумеваемое греческим словом.
- source_word: κλείετε
  choice: закрываете
  rationale: Сохраняет образ преграждённого доступа к Царству без усиления значения до «запираете».
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: Небесное Царство
  rationale: Естественный современный русский эквивалент характерного для Матфея выражения; не вводит искусственного богословского отличия от «Царства Божьего».
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: перед людьми
  rationale: Передаёт образ того, что доступ людям преграждают; ἀνθρώπων имеет обобщённое, а не только мужское значение.
- source_word: τοὺς εἰσερχομένους
  choice: тем, кто входит
  rationale: Сохраняет видовое значение причастия настоящего времени и не сводит его однозначно к одной лишь попытке войти.
- source_word: ἀφίετε εἰσελθεῖν
  choice: войти не позволяете
  rationale: Ясно передаёт конструкцию разрешения с инфинитивом и сохраняет повтор корня «входить/войти», присутствующий в греческом.
theological_decisions:
- issue: Значение выражения βασιλεία τῶν οὐρανῶν
  choice: Небесное Царство
  alternative: Царство небес
  rationale: Выбран современный и привычный русский эквивалент. Он сохраняет матфеевскую формулу, не превращая её в отдельную от «Царства Божьего» богословскую категорию.
- issue: Смысл τοὺς εἰσερχομένους
  choice: тем, кто входит
  alternative: тем, кто пытается войти
  rationale: Греческое причастие допускает представление о процессе входа или стремлении войти. Основной текст сохраняет более формальную неопределённость, а возможное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейского обличения. Синтаксис сделан естественным для русского языка, при этом сохранены параллелизм «сами не входите — другим войти не позволяете», образ закрытого доступа и неоднозначность причастия настоящего времени.
