  text: 'Тогда Иисус обратился к толпам и к своим ученикам:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Временное наречие обозначает следующий момент в повествовании; «тогда» кратко и естественно передаёт эту последовательность.
- source_word: ὁ Ἰησοῦς
  choice: Иисус
  rationale: Определённый артикль при личном имени обычен для греческого повествования и по-русски отдельно не передаётся.
- source_word: ἐλάλησεν
  choice: обратился
  rationale: Глагол означает «говорить»; при указании двух групп слушателей русское «обратился к» естественно передаёт направленную к ним речь, не добавляя её содержания.
- source_word: τοῖς ὄχλοις
  choice: к народу
  rationale: Форма множественного числа обозначает собравшиеся массы людей. В данном контексте русское собирательное «народ» звучит естественнее буквального «толпам» и сохраняет отличие от учеников.
- source_word: καὶ
  choice: и
  rationale: Простой соединительный союз связывает две группы слушателей.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: к Своим ученикам
  rationale: Дательный падеж и притяжательное местоимение переданы естественной русской конструкцией; «Своим» указывает на принадлежность учеников подлежащему — Иисусу.
