  source_fidelity: «Тогда» верно передаёт Τότε, а «Иисус» — ὁ Ἰησοῦς. Однако τοῖς ὄχλοις стоит во множественном числе; собирательное «народу» сглаживает это различие без необходимости. «Обратился к» допустимо для ἐλάλησεν τοῖς, хотя более интерпретативно, чем «говорил/сказал».
