id: MAT.23.3
reference: Matthew 23:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πάντα οὖν ὅσα ⸀ἐὰν εἴπωσιν ὑμῖν ⸂ποιήσατε καὶ τηρεῖτε⸃, κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε, λέγουσιν γὰρ καὶ οὐ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/003.yaml
  text: Therefore[a], do and keep everything they tell you, but do not do according to their works, for they say and do not do.
translation:
  language: ru
  text: Итак, делайте и соблюдайте всё, что они вам скажут; но не поступайте так, как они[a], потому что они говорят, но не делают.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «по делам же их не делайте».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα οὖν ὅσα ἐὰν
  choice: Итак, … всё, что
  rationale: 'Сочетание πάντα с ὅσα ἐὰν имеет всеохватный смысл: «всё, что бы ни». Союз οὖν передан как выводное «итак».'
- source_word: εἴπωσιν ὑμῖν
  choice: они вам скажут
  rationale: Передаёт обычное значение λέγω без усиления до формального «научат» или «предпишут».
- source_word: ποιήσατε καὶ τηρεῖτε
  choice: делайте и соблюдайте
  rationale: 'Сохраняются два отдельных повеления: ποιέω — совершать, делать; τηρέω — соблюдать, хранить. «Соблюдайте» естественно в контексте предписаний.'
- source_word: κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε
  choice: но не поступайте так, как они
  rationale: κατά с винительным обозначает образец или соответствие. Эта формулировка естественна по-русски и передаёт запрет следовать их примеру; более буквальная конструкция приведена в сноске.
- source_word: λέγουσιν γὰρ καὶ οὐ ποιοῦσιν
  choice: потому что они говорят, но не делают
  rationale: Сохраняет краткий антитетический характер фразы и повтор глагола ποιέω через «делайте / не делают». Греческое καί здесь по смыслу выражает резкое несоответствие, естественно передаваемое русским «но».
theological_decisions:
- issue: Следует ли уточнять, что речь идёт об учении книжников и фарисеев и о Моисеевом седалище из предыдущего стиха
  choice: Оставить предмет их слов неуточнённым, как в греческом тексте данного стиха.
  alternative: «Всё, чему они вас учат» или «всё, что они говорят вам с Моисеева седалища».
  rationale: Контекст называет говорящих, но сам стих не повторяет этих уточнений. Их добавление могло бы преждевременно истолковать объём повеления.
- issue: Сохранять ли буквальную конструкцию κατὰ τὰ ἔργα αὐτῶν
  choice: Передать её естественным русским выражением «не поступайте так, как они», отметив буквальную форму в сноске.
  alternative: «По делам же их не делайте».
  rationale: Буквальная калька неестественна в современном русском. Выбранная формулировка сохраняет смысл следования образцу, не вводя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Ритм наставления и заключительный контраст сохранены; архаичная калька вынесена в сноску.
