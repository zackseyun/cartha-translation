  source_fidelity: 'Текст точно передаёт все основные элементы греческого оригинала: выводное οὖν («Итак»), всеохватное πάντα ὅσα ἐὰν («всё, что»), два повеления ποιήσατε καὶ τηρεῖτε («делайте и соблюдайте»), запрет следовать образцу их дел и заключительное противопоставление слов и дел. Будущее «скажут» естественно передаёт сослагательное εἴπωσιν в обобщённо-условном обороте.'
