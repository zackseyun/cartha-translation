  text: ἀμὴν λέγω ὑμῖν, ⸀ἥξει ⸂ταῦτα πάντα⸃ ἐπὶ τὴν γενεὰν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/036.yaml
  text: Truly I say to you[b][a], all these things will come upon this generation.
translation:
  language: ru
  text: 'Истинно говорю вам: всё это постигнет это поколение.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение «это поколение» иногда понимают также как «эти люди» или как более широкое неверующее поколение, однако буквально по-гречески: «это поколение».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Истинно
  rationale: В синоптической формуле это слово вводит торжественное и авторитетное утверждение; «истинно» естественно сохраняет его силу в современном литературном русском.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямой перевод глагола настоящего времени с местоимением в дательном падеже; сохраняет торжественную формулу речи.
- source_word: ἥξει
  choice: постигнет
  rationale: Буквально глагол выражает приход или наступление. В сочетании с последствиями суда и людьми, которых они настигнут, «постигнет» звучит естественно и передаёт направленность ἐπί с винительным падежом.
- source_word: ταῦτα πάντα
  choice: всё это
  rationale: Передаёт совокупное значение греческого среднего множественного числа и естественно отсылает к перечисленному ранее. Более формальное «все эти вещи» по-русски неуместно.
- source_word: ἐπὶ τὴν γενεὰν ταύτην
  choice: это поколение
  rationale: При глаголе «постигнет» значение предлога ἐπί выражено управлением прямым дополнением; «это поколение» наиболее прямо передаёт γενεὰν ταύτην.
theological_decisions:
- issue: К кому или к чему относится выражение γενεὰν ταύτην
  choice: это поколение
  alternative: эти люди; более широкое неверующее поколение; нынешний век
  rationale: Прямой перевод сохраняет временную силу и подлинную неоднозначность выражения, не навязывая определённую эсхатологическую или конфессиональную трактовку.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным строем фразы. Двоеточие после вводной формулы естественно отделяет авторитетное утверждение от его содержания.
