id: MAT.23.16
reference: Matthew 23:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, ὁδηγοὶ τυφλοὶ οἱ λέγοντες· Ὃς ἂν ὀμόσῃ ἐν τῷ ναῷ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ χρυσῷ τοῦ ναοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/016.yaml
  text: Woe to you[a], blind guides, who say, ‘Whoever swears by the temple, it is nothing[b]; but whoever swears by the gold of the temple is bound.’
translation:
  language: ru
  text: 'Горе вам, слепые поводыри! Вы говорите: «Кто поклянётся храмом, это ничего не значит[a], а кто поклянётся золотом храма, тот связан клятвой[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «это ничто»; смысл в том, что такую клятву считали необязательной.'
    reason: Пояснение эллиптического выражения.
  - marker: b
    text: 'Буквально: «тот обязан» или «тот должен»; подразумевается обязанность, возникшая вследствие клятвы.'
    reason: Сохранение сведения о краткости и неоднозначности греческой формулировки.
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: Горе вам
  rationale: Сохраняет форму пророческого обличения и её судебно-предостерегающую силу; выражение естественно и узнаваемо в литературном русском языке.
- source_word: ὁδηγοὶ τυφλοί
  choice: слепые поводыри
  rationale: Точно передаёт образ тех, кто ведёт других, сам не видя пути. «Поводыри» здесь выразительнее и ближе к метафоре, чем общее «руководители».
- source_word: οἱ λέγοντες
  choice: Вы говорите
  rationale: Греческий определённый причастный оборот передан отдельным предложением, чтобы избежать тяжеловесного «говорящие» и сохранить прямое обращение.
- source_word: Ὃς ἂν ὀμόσῃ
  choice: Кто поклянётся
  rationale: Неопределённо-относительная конструкция с ἄν и сослагательным наклонением выражает общее условие; русский будущий совершенного вида передаёт его естественно.
- source_word: ἐν τῷ ναῷ
  choice: храмом
  rationale: 'Хотя ἐν буквально может означать «в», в контексте формулы клятвы речь идёт о том, чем клянутся. Творительный падеж — естественная русская форма: «поклясться храмом».'
- source_word: οὐδέν ἐστιν
  choice: для того это ничего не значит
  rationale: Передаёт краткое эллиптическое выражение как утверждение о недействительности такой клятвы, не вводя более специальной юридической терминологии.
- source_word: χρυσῷ τοῦ ναοῦ
  choice: золотом храма
  rationale: Прямо сохраняет противопоставление самого храма и принадлежащего храму золота.
- source_word: ὀφείλει
  choice: связан клятвой
  rationale: Глагол означает, что человек обязан или находится под обязательством. Контекстуальное дополнение делает эллиптическую греческую формулировку ясной по-русски, не уточняя способ исполнения обязательства.
theological_decisions:
- issue: Эллиптические выражения о действительности клятвы
  choice: Первое выражение передано как «это ничего не значит», второе — как «связан клятвой».
  alternative: 'Буквально и столь же эллиптически: «это ничто… тот обязан».'
  rationale: Иисус обличает казуистическое различение между якобы необязательной и обязательной клятвой. Русская формулировка проясняет подразумеваемую обязательность, но не добавляет учения о природе или допустимости клятв.
- issue: Значение ἐν при глаголе клятвы
  choice: «поклянётся храмом»
  alternative: «поклянётся в храме»
  rationale: Контраст с «золотом храма» показывает, что названы предметы, которыми клянутся, а не место произнесения клятвы.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественно-обличительного «Горе вам». Тяжеловесный причастный оборот заменён отдельным предложением. Формулировка остаётся понятной обычному читателю и сохраняет риторический контраст оригинала.
