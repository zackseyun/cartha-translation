lexical_decisions:
- source_word: φιλοῦσι
  choice: любят
  rationale: Настоящее время φιλέω здесь передаёт сильное пристрастие к почётному положению; прямое «любят» естественно звучит по-русски и сохраняет обличительную силу слов Иисуса.
- source_word: δὲ
  choice: не передано отдельным словом
  rationale: Частица δέ мягко продолжает описание из предыдущего стиха. В русском связность естественно выражается без отдельного союза; «но» создало бы излишне сильное противопоставление.
- source_word: πρωτοκλισίαν
  choice: почётные места
  rationale: Слово обозначает наиболее почётное место для возлежания за трапезой. Передача во множественном числе естественна в русском при описании привычного поведения в разных случаях и ясно выражает социальный статус.
- source_word: ἐν τοῖς δείπνοις
  choice: на пирах
  rationale: В данном контексте δεῖπνον указывает на торжественные совместные трапезы, где статус был публично заметен. «На пирах» кратко и естественно передаёт эту обстановку.
- source_word: πρωτοκαθεδρίας
  choice: лучшие места
  rationale: Слово обозначает места высшего ранга и первенства. «Лучшие места» понятно современному читателю, а примечание уточняет, что речь идёт именно о почётном статусе, а не об удобстве.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: в синагогах
  rationale: Прямая и естественная передача места действия; русский язык не требует выражать греческий артикль.
