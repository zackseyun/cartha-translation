  text: Они любят почётное место на пирах[a] и первые места в синагогах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть самое почётное место за столом. На торжественных трапезах древнего мира места распределялись по общественному положению участников.
