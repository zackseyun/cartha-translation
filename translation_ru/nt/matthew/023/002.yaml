translation:
  language: ru
  text: 'говоря: «Книжники и фарисеи сидят на кафедре Моисея[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заняли кафедру Моисея» или «сели на кафедру Моисея». Греческий аорист может обозначать занятие этого места, а в данном контексте также передавать продолжающееся пребывание на нём. «Кафедра Моисея» — образ учительского авторитета, связанного с Моисеем.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: говоря
  rationale: Причастие настоящего времени сохраняет синтаксическую связь с предыдущим стихом и вводит прямую речь Иисуса.
- source_word: Ἐπὶ τῆς Μωϋσέως καθέδρας
  choice: на Моисеевом седалище
  rationale: Предлог ἐπί с родительным здесь обозначает место или положение; «седалище» сохраняет метафору признанного учительного авторитета, связанного с Моисеем.
- source_word: ἐκάθισαν
  choice: воссели
  rationale: Аорист καθίζω допускает как нейтральное указание на занятие места, так и оттенок вступления в авторитетное положение. «Воссели» естественно передаёт завершённое занятие места, не добавляя явно выраженной в греческом возвратности.
- source_word: οἱ γραμματεῖς
  choice: книжники
  rationale: Традиционный и точный русский термин для признанных знатоков и толкователей Закона в евангельском контексте.
- source_word: οἱ Φαρισαῖοι
  choice: фарисеи
  rationale: Общепринятое русское наименование данной религиозной группы.
theological_decisions:
- issue: Передавать ли ἐκάθισαν нейтрально («сидят») или как занятие авторитетного положения
  choice: воссели
  alternative: сидят; уселись
  rationale: «Воссели» сохраняет аорист и возможный оттенок занятия Моисеева учительного места, однако не утверждает однозначно ни самовольного присвоения власти, ни её божественного одобрения. Вариант «уселись» был бы слишком явно неодобрительным.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской дикцией. «Моисеево седалище» сохраняет историко-культурную метафору; «воссели» передаёт возможную смысловую напряжённость без разговорной или конфессионально окрашенной оценки.
