  text: μωροὶ καὶ τυφλοί, τίς γὰρ μείζων ἐστίν, ὁ χρυσὸς ἢ ὁ ναὸς ὁ ⸀ἁγιάσας τὸν χρυσόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/017.yaml
  text: 'You fools and blind men, for which is greater: the gold, or the temple that sanctified the gold?'
translation:
  language: ru
  text: 'Глупцы и слепцы! Что же больше: золото или храм[b], освятивший золото[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделавший золото святым».'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово ναός может обозначать собственно храмовое святилище.
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ καὶ τυφλοί
  choice: Глупцы и слепцы!
  rationale: Оба прилагательных стоят в звательном употреблении и образуют резкое прямое обращение. «Глупцы» и «слепцы» естественно и лаконично передают параллелизм оригинала.
- source_word: τίς γὰρ μείζων ἐστίν
  choice: Что же больше
  rationale: Вопрос сопоставляет два названных предмета. Частица «же» естественно передаёт пояснительно-аргументативную функцию γάρ в русском контексте.
- source_word: ὁ χρυσὸς
  choice: золото
  rationale: Речь идёт о конкретном золоте храма, однако русский язык в таком сопоставлении не требует отдельного показателя определённости.
- source_word: ὁ ναὸς
  choice: храм
  rationale: «Храм» — ясное и привычное соответствие; примечание сохраняет более узкое возможное значение «святилище».
- source_word: ὁ ἁγιάσας τὸν χρυσόν
  choice: освятивший золото
  rationale: Причастие прошедшего времени формально отражает аорист ἁγιάσας и сохраняет культовый смысл передачи золоту священного статуса.
theological_decisions:
- issue: Передача культового глагола ἁγιάζω
  choice: освятивший
  alternative: сделавший золото святым
  rationale: «Освятивший» сохраняет религиозно-культовый регистр и не уточняет сверх текста, каким именно образом храм сообщает золоту священный статус.
- issue: Временное значение аористного причастия ἁγιάσας
  choice: освятивший
  alternative: освящающий
  rationale: Прошедшее причастие близко передаёт форму греческого аориста и представляет освящение золота как состоявшийся результат; возможное обобщённое значение не исключается контекстом.
translation_notes:
  register: Современный литературный русский язык с достоинством и сохранением резкости обличения. Риторическая краткость и повтор слова «золото» воспроизводят структуру греческого текста.
