source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ⸀παρομοιάζετε τάφοις κεκονιαμένοις, οἵτινες ἔξωθεν μὲν φαίνονται ὡραῖοι ἔσωθεν δὲ γέμουσιν ὀστέων νεκρῶν καὶ πάσης ἀκαθαρσίας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/027.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you are like whitewashed tombs, which outwardly appear beautiful[b], but inwardly are full of dead people's bones and every kind of uncleanness.
translation:
  language: ru
  text: 'Горе вам, книжники и фарисеи, лицемеры! Ибо вы подобны выбеленным гробницам[a]: снаружи они кажутся красивыми, а внутри полны костей умерших и всякой нечистоты[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гробницам, выбеленным известью».'
    reason: lexical_alternative
  - marker: b
    text: Слово «нечистота» здесь может включать как ритуальную нечистоту, так и нравственную испорченность.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαὶ
  choice: Горе
  rationale: Сохраняет силу пророческого обличения и объявления суда; междометное «увы» звучало бы мягче.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Традиционное и точное обозначение знатоков и толкователей Писания в данном историческом контексте.
- source_word: Φαρισαῖοι
  choice: фарисеи
  rationale: Общепринятое русское наименование этой религиозной группы.
- source_word: ὑποκριταί
  choice: лицемеры
  rationale: В контексте обозначает религиозно-нравственное притворство; это естественный и ясный русский эквивалент.
- source_word: παρομοιάζετε
  choice: вы подобны
  rationale: Передаёт прямое уподобление естественно и с достоинством, не вводя лишней пассивной конструкции.
- source_word: τάφοις κεκονιαμένοις
  choice: побелённым гробницам
  rationale: «Гробницы» передаёт образ устроенных мест погребения, а «побелённым» — покрытие известью или побелкой.
- source_word: ἔξωθεν μὲν ... ἔσωθεν δὲ
  choice: снаружи ... а внутри
  rationale: Ясно и риторически естественно сохраняет противопоставление внешнего вида и внутреннего состояния.
- source_word: φαίνονται ὡραῖοι
  choice: кажутся красивыми
  rationale: Сохраняет акцент на видимости, а не на подлинном качестве.
- source_word: γέμουσιν
  choice: полны
  rationale: Кратко и идиоматично передаёт значение «быть наполненным».
- source_word: ὀστέων νεκρῶν
  choice: костей мёртвых
  rationale: Естественно передаёт родительную конструкцию и ясно указывает на человеческие останки.
- source_word: πάσης ἀκαθαρσίας
  choice: всякой нечистоты
  rationale: Широкое слово сохраняет одновременно возможные значения ритуальной нечистоты и нравственной скверны.
theological_decisions:
- issue: Смысл ἀκαθαρσία в метафоре
  choice: Передать широко как «нечистота»
  alternative: «ритуальная нечистота» или «нравственная скверна»
  rationale: Образ гробниц вызывает представление о ритуальном осквернении, тогда как обличительный контекст также подразумевает внутреннюю нравственную испорченность. Широкая передача сохраняет обе стороны.
translation_notes:
  register: Современный литературный русский язык с торжественной обличительной интонацией. Синтаксис сохраняет резкий контраст между внешней красотой и внутренней нечистотой; устаревшие либо узкоконфессиональные формулировки не используются.
