lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет обычную соединительную связь с предшествующим обличением.
- source_word: ὑμεῖς
  choice: вы
  rationale: Отдельно выраженное местоимение сохраняет греческое эмфатическое обращение; в русском ударение передаётся порядком слов «И вы».
- source_word: πληρώσατε
  choice: наполните
  rationale: Аористный императив второго лица множественного числа передан повелительной формой; глагол сохраняет образ наполнения до предела.
- source_word: τὸ μέτρον
  choice: меру
  rationale: Буквальная передача сохраняет метафору определённого количества, достигающего предела, не добавляя в основной текст слова «грехов».
- source_word: τῶν πατέρων ὑμῶν
  choice: ваших отцов
  rationale: Сохраняет буквальную родственную лексику и риторическую связь с предыдущими стихами; по контексту речь идёт о предках.
theological_decisions:
- issue: Повеление или предсказание в словах Иисуса
  choice: 'Повелительная форма с иронически-обличительным, судебным оттенком: «наполните»'
  alternative: «вы наполняете» или «вы наполните» как предсказание
  rationale: Форма πληρώσατε грамматически является аористным повелительным наклонением, поэтому перевод сохраняет повеление и не сводит напряжённую риторику к простому предсказанию.
- issue: Что именно составляет «меру отцов»
  choice: Не уточнять в основном тексте, сохранив метафору
  alternative: «доведите до полноты меру грехов ваших отцов»
  rationale: Слово «грехов» подразумевается контекстом накопленной вины, но отсутствует в греческом тексте; пояснение вынесено в сноску.
translation_notes:
