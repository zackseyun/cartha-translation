id: MAT.23.19
reference: Matthew 23:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀τυφλοί, τί γὰρ μεῖζον, τὸ δῶρον ἢ τὸ θυσιαστήριον τὸ ἁγιάζον τὸ δῶρον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/019.yaml
  text: Blind men[a], for which is greater[b], the gift or the altar that sanctifies the gift?
translation:
  language: ru
  text: 'Слепые! Что же больше: дар или жертвенник, освящающий дар?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τυφλοί
  choice: Слепые!
  rationale: Субстантивированное прилагательное во множественном числе передаёт прямое обличительное обращение без добавления слова «безумные», которого в этом стихе нет.
- source_word: τί γὰρ μεῖζον
  choice: Что же больше
  rationale: Сохраняет сравнительный вопрос; частица «же» естественно передаёт пояснительно-аргументативную функцию γάρ в русском контексте.
- source_word: τὸ δῶρον
  choice: дар
  rationale: Прямое соответствие δῶρον; в храмовом контексте слово обозначает приношение, но более буквальное «дар» сохраняет лексику исходного текста.
- source_word: θυσιαστήριον
  choice: жертвенник
  rationale: Традиционное и точное обозначение культового алтаря в библейском русском языке.
- source_word: τὸ ἁγιάζον
  choice: освящающий
  rationale: Причастие сохраняет грамматическую связь с жертвенником и культово-богословский смысл ἁγιάζω — сообщать святость.
theological_decisions:
- issue: Культовый смысл ἁγιάζω в отношении жертвенника и дара
  choice: освящающий дар
  alternative: делающий дар святым; посвящающий дар Богу
  rationale: «Освящающий» сохраняет утверждение, что жертвенник сообщает дару святость, не сводя смысл только к церемониальному посвящению и не расширяя текст словами «Богу».
translation_notes:
  register: Современный литературный русский с сохранением достоинства и краткости обличительной речи. «Жертвенник» выбран вместо разговорного «алтарь» ради точности храмово-жертвенного контекста; синтаксис сделан естественным, но близким к греческому.
