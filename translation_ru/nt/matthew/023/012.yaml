id: MAT.23.12
reference: Matthew 23:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅστις δὲ ὑψώσει ἑαυτὸν ταπεινωθήσεται, καὶ ὅστις ταπεινώσει ἑαυτὸν ⸀ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/012.yaml
  text: But whoever exalts himself will be humbled[b][a], and whoever humbles himself will be exalted.
translation:
  language: ru
  text: Но кто возвышает себя, тот будет унижен[a], а кто смиряет себя, тот будет возвышен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет низведён… будет вознесён».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: кто… тот
  rationale: Неопределённое относительное местоимение вводит общее, афористическое утверждение; русская конструкция «кто… тот» естественно передаёт этот смысл.
- source_word: δὲ
  choice: но
  rationale: Передаёт лёгкое противопоставление предшествующему контексту.
- source_word: ὑψώσει ἑαυτόν
  choice: возвышает себя
  rationale: Греческое будущее в афористическом высказывании по-русски естественно передаётся настоящим временем; «возвышает себя» сохраняет смысл самовозвеличивания и лексическую связь с последующим пассивом.
- source_word: ταπεινωθήσεται
  choice: будет унижен
  rationale: Будущее страдательного залога сохранено без указания действующего лица; «унижен» передаёт понижение положения, а не обязательно приобретение добродетели смирения.
- source_word: καὶ
  choice: а
  rationale: В симметричной русской конструкции союз «а» естественно выражает сопоставление двух противоположных исходов.
- source_word: ταπεινώσει ἑαυτόν
  choice: смиряет себя
  rationale: Передаёт добровольное самоумаление; настоящее время уместно для общего принципа.
- source_word: ὑψωθήσεται
  choice: будет возвышен
  rationale: Сохраняет будущее время, страдательный залог и словесную параллель с «возвышает себя».
theological_decisions:
- issue: Кто совершает действия, выраженные страдательным залогом
  choice: Сохранить страдательные формы, не называя действующее лицо
  alternative: «Бог унизит… Бог возвысит»
  rationale: Греческий текст прямо не называет деятеля. Такая передача сохраняет возможный намёк на Божье действие, не превращая его в явное утверждение.
- issue: Родовая отнесённость изречения
  choice: Передать универсальный смысл конструкцией «кто… тот» без родового местоимения
  alternative: «Всякий, кто возвышает самого себя…»
  rationale: Греческая форма мужского рода единственного числа имеет обобщающий смысл. Русская конструкция «кто… тот» естественно охватывает любого человека и не требует пояснительной сноски.
- issue: Смысл ταπεινωθήσεται
  choice: «будет унижен»
  alternative: «будет смирён» или «будет низведён»
  rationale: «Будет унижен» сохраняет противопоставление возвышению и допускает как утрату высокого положения, так и переживание унижения, не уточняя способ действия.
translation_notes:
  register: Современный литературный русский язык; краткая, уравновешенная афористическая конструкция. Лексический параллелизм «возвышает — возвышен» сохранён, а пассивные формы не раскрывают подразумеваемого деятеля.
