  text: Вот, ваш дом оставляется вам опустошённым[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваш храм»; выражение «ваш дом» может относиться именно к храму, хотя греческий текст не ограничивает его этим значением.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Вот
  rationale: Естественная для современного литературного русского формула торжественного указания, сохраняющая силу греческого призыва обратить внимание.
- source_word: ἀφίεται
  choice: оставляется
  rationale: Настоящее время страдательного залога передано без уточнения действующего лица; форма сохраняет как значение оставления, так и оттенок оставления в распоряжении адресатов.
- source_word: ὑμῖν
  choice: вам
  rationale: Дательный падеж сохранён и не сводится к более толковательному «для вас».
- source_word: ὁ οἶκος ὑμῶν
  choice: ваш дом
  rationale: Буквальное и при этом естественное соответствие, не сужающее возможный референт до храма, Иерусалима или народа.
- source_word: ἔρημος
  choice: пустым
  rationale: В данном сочетании слово естественно выражает оставленность и запустение дома; «опустошённым» могло бы сильнее подразумевать уже совершённое разрушительное действие.
theological_decisions:
- issue: Референт выражения «ваш дом»
  choice: Сохранено широкое выражение «ваш дом».
  alternative: «ваш храм», «Иерусалим» или «дом Израиля»
  rationale: Контекст допускает прежде всего храм и Иерусалим, однако греческий текст оставляет образ более широким; перевод не устраняет эту смысловую многозначность.
- issue: Характер состояния, обозначенного ἔρημος
  choice: «пустым»
  alternative: «опустошённым», «заброшенным» или «покинутым»
  rationale: Выбор сохраняет состояние оставленности, не утверждая сверх текста конкретный способ или стадию грядущего суда.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксис намеренно близок к греческому, но остаётся понятным обычному читателю; архаическое «се» не используется.
