  text: δεσμεύουσιν ⸀δὲ φορτία ⸀βαρέα καὶ ἐπιτιθέασιν ἐπὶ τοὺς ὤμους τῶν ἀνθρώπων, ⸂αὐτοὶ δὲ τῷ⸃ δακτύλῳ αὐτῶν οὐ θέλουσιν κινῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/004.yaml
  text: They tie up heavy burdens and lay them on the shoulders of men[a], but they themselves are unwilling to move them with their finger.
translation:
  language: ru
  text: Они связывают тяжёлые бремена и возлагают их на плечи людей, а сами не хотят и пальцем пошевелить, чтобы сдвинуть их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσμεύουσιν
  choice: связывают
  rationale: Передаёт образ связывания или увязывания груза и сохраняет конкретность греческого глагола.
- source_word: φορτία βαρέα
  choice: тяжёлые бремена
  rationale: Сохраняет как буквальный образ тяжёлой ноши, так и метафорическую силу обременительных требований; «бремена» звучит достойно и понятно в библейском контексте.
- source_word: ἐπιτιθέασιν ἐπὶ τοὺς ὤμους
  choice: возлагают их на плечи
  rationale: Точно сохраняет телесный образ помещения ноши на плечи и естественно звучит по-русски.
- source_word: τῶν ἀνθρώπων
  choice: людей
  rationale: В данном контексте ἄνθρωποι обозначает людей вообще; русское «людей» прямо и естественно передаёт родовое значение без необходимости в примечании.
- source_word: αὐτοὶ δὲ
  choice: а сами
  rationale: Передаёт подчёркнутое противопоставление между тем, что они делают другим, и собственным отказом участвовать.
- source_word: τῷ δακτύλῳ αὐτῶν
  choice: и пальцем
  rationale: Русское устойчивое выражение «и пальцем не пошевелить» естественно передаёт мысль о нежелании приложить даже малейшее усилие.
- source_word: οὐ θέλουσιν κινῆσαι αὐτά
  choice: не хотят ... их пошевелить
  rationale: «Не хотят» сохраняет значение волевого отказа в θέλουσιν, а «пошевелить» соответствует κινῆσαι и сочетается с русским идиоматическим оборотом.
theological_decisions:
- issue: Буквальное или метафорическое понимание бремён
  choice: Сохранить конкретный образ «тяжёлых бремён», не уточняя их референт.
  alternative: Прямо назвать их религиозными предписаниями или законническими требованиями.
  rationale: Контекст подразумевает налагаемые книжниками и фарисеями требования, однако сам стих не называет их прямо; сохранение метафоры не сужает смысл и не вносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Бремена» сохраняет образ и торжественность, а оборот «не хотят и пальцем их пошевелить» остаётся естественным и общепонятным.
