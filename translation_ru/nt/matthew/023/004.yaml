  source_fidelity: 'Первая часть точно передаёт образ связывания тяжёлых нош и возложения их на плечи людей; «людей» верно отражает родовое значение ἀνθρώπων. Во второй части «не хотят» хорошо передаёт волевой характер οὐ θέλουσιν. Однако в исходной формулировке инструментальное τῷ δακτύλῳ αὐτῶν и объект κινῆσαι αὐτά синтаксически сливаются недостаточно ясно: можно ошибочно прочесть «их» как дополнение к устойчивому обороту «пальцем пошевелить».'
