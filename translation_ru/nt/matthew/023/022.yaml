source:
  edition: SBLGNT
  text: καὶ ὁ ὀμόσας ἐν τῷ οὐρανῷ ὀμνύει ἐν τῷ θρόνῳ τοῦ θεοῦ καὶ ἐν τῷ καθημένῳ ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/022.yaml
  text: And whoever swears by heaven swears by the throne of God and by the one seated upon it[a].
translation:
  language: ru
  text: И всякий, кто клянётся небом, клянётся престолом Бога и тем, кто восседает на нём.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тем, кто сидит на нём».'
    reason: Лексический вариант перевода τῷ καθημένῳ.
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: тот, кто клянётся
  rationale: Субстантивированное причастие аориста употреблено обобщённо; настоящее время по-русски естественно передаёт общий принцип.
- source_word: ἐν
  choice: небом / престолом / Тем, Кто
  rationale: В формулах клятвы ἐν с дательным передаёт основание или предмет клятвы; русский творительный падеж после «клясться» выражает это идиоматично.
- source_word: οὐρανῷ
  choice: небом
  rationale: В данном религиозном контексте речь идёт о небесах как о месте Божьего престола, а не просто о видимом небе.
- source_word: ὀμνύει
  choice: клянётся
  rationale: Настоящее время выражает общую истину и естественно сохраняется в русском.
- source_word: θρόνῳ τοῦ θεοῦ
  choice: престолом Бога
  rationale: Передаёт явную родительную конструкцию и сохраняет торжественное звучание.
- source_word: τῷ καθημένῳ
  choice: Тем, Кто восседает
  rationale: Глагол «восседает» естественно связан с образом престола и передаёт продолжающееся пребывание на нём; прописная буква указывает на очевидного из контекста божественного референта, не заменяя иносказательное выражение словом «Бог».
- source_word: ἐπάνω αὐτοῦ
  choice: на нём
  rationale: Местоимение относится к престолу; «на нём» точно передаёт положение восседающего, не создавая смысла пространственного отделения «над ним».
theological_decisions:
- issue: Кого обозначает выражение «Тем, Кто восседает на нём»
  choice: Бога, восседающего на престоле, при сохранении описательного обозначения
  alternative: Неопределённое «тем, кто сидит на нём» без типографического указания на божественного референта
  rationale: Непосредственное упоминание «престола Бога» ясно устанавливает референта. Перевод сохраняет иносказательную форму исходного текста и не подменяет её прямым словом «Бог».
translation_notes:
  register: Современный литературный русский язык с достойным, ясным библейским регистром. «Восседает» сохраняет образ престола, не становясь архаичным; повтор «клянётся» передаёт риторическую структуру греческого текста.
