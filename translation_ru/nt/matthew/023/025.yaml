id: MAT.23.25
reference: Matthew 23:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι καθαρίζετε τὸ ἔξωθεν τοῦ ποτηρίου καὶ τῆς παροψίδος, ἔσωθεν δὲ γέμουσιν ἐξ ἁρπαγῆς καὶ ⸀ἀκρασίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/025.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you clean the outside of the cup and the dish, but inside they are full of greed and self-indulgence.
translation:
  language: ru
  text: Горе вам, книжники и фарисеи, лицемеры! Вы очищаете чашу и блюдо снаружи, а внутри они полны награбленного и невоздержанности.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полны грабежа (или алчности) и потворства себе». Греческие слова допускают как оттенок хищнического присвоения, так и значение необузданности, отсутствия самообладания.'
    reason: Лексические оттенки ἁρπαγή и ἀκρασία не исчерпываются одним русским соответствием.
lexical_decisions:
- source_word: Οὐαὶ
  choice: Горе вам
  rationale: Сохраняет силу пророческого обличения и естественно звучит в русском библейском контексте.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Устоявшееся и точное обозначение знатоков и толкователей Писания в евангельском контексте.
- source_word: Φαρισαῖοι
  choice: фарисеи
  rationale: Общепринятое русское наименование этой религиозной группы.
- source_word: ὑποκριταί
  choice: лицемеры
  rationale: Передаёт нравственно-религиозное притворство и сохраняет обличительную силу обращения.
- source_word: καθαρίζετε
  choice: очищаете
  rationale: Передаёт действие καθαρίζω и уместно для контекста ритуальной и внешней чистоты.
- source_word: τὸ ἔξωθεν
  choice: снаружи
  rationale: Естественно выражает пространственное противопоставление ἔξωθεν и ἔσωθεν.
- source_word: ποτηρίου
  choice: чаша
  rationale: Точный, общеупотребительный и стилистически достойный эквивалент названия сосуда.
- source_word: παροψίδος
  choice: блюдо
  rationale: Достаточно широкое русское название столового сосуда, не вносящее излишней конкретизации.
- source_word: ἔσωθεν
  choice: внутри
  rationale: Сохраняет прямое противопоставление внешней и внутренней стороны сосудов.
- source_word: γέμουσιν
  choice: они полны
  rationale: Сохраняет множественное число греческого глагола и относит сказуемое к чаше и блюду вместе.
- source_word: ἁρπαγῆς
  choice: награбленного
  rationale: Передаёт сильный предметно-результативный оттенок хищнического присвоения и естественно сочетается с образом наполненных сосудов; не ослабляет слово до одной лишь внутренней жадности.
- source_word: ἀκρασίας
  choice: невоздержанности
  rationale: Передаёт отсутствие власти над желаниями, распущенность и потворство себе без неоправданного сужения к одной конкретной форме излишеств.
theological_decisions:
- issue: К чему грамматически относится внутренняя нечистота
  choice: 'Сохранить образ сосудов: «внутри они полны»'
  alternative: «а внутри вы полны»
  rationale: Греческий глагол стоит во множественном числе и непосредственно продолжает образ чаши и блюда. Явное отнесение сказуемого к самим руководителям было бы разъясняющей интерпретацией.
- issue: Характер ἁρπαγή
  choice: «награбленного»
  alternative: «жадности» или «грабежа»
  rationale: Так сохраняется возможность понимать слово как добычу, полученную хищническим присвоением, что хорошо соответствует метафоре содержимого сосудов и не устраняет этическую направленность обличения.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и обличительной силы евангельской речи. Устоявшиеся термины «книжники», «фарисеи», «лицемеры» сохранены; синтаксис сделан ясным и естественным. Маркер сноски помещён после всей пары спорных слов.
