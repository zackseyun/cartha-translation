  text: καί· Ὃς ⸀ἂν ὀμόσῃ ἐν τῷ θυσιαστηρίῳ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ δώρῳ τῷ ἐπάνω αὐτοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/018.yaml
  text: And[a], ‘Whoever swears by the altar, it is nothing[b]; but whoever swears by the gift on top of it is obligated.’
translation:
  language: ru
  text: 'И: «Кто поклянётся жертвенником — это ничего не значит[a], а кто поклянётся даром[b] на нём, тот обязан».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть, согласно учению, которое осуждает Иисус, клятва жертвенником «ничего не значит» и не считается обязательной.
    reason: cultural_note
  - marker: b
    text: 'Или: «приношением». Греческое слово может обозначать дар, принесённый Богу в храме.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: И ещё
  rationale: Связывает эту цитату с предыдущей в ряду осуждаемых наставлений; «И ещё» естественно передаёт продолжение перечисления.
- source_word: Ὃς ἂν ... ὀμόσῃ / ὃς δ’ ἂν ... ὀμόσῃ
  choice: Кто поклянётся ... а кто поклянётся
  rationale: Сочетание относительного местоимения с ἄν и аористом сослагательного наклонения выражает общее неопределённое условие; эта русская конструкция сохраняет его смысл.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: жертвенником
  rationale: При глаголе клятвы ἐν обозначает то, чем клянутся; русский творительный падеж естественно передаёт эту формулу.
- source_word: θυσιαστήριον
  choice: жертвенник
  rationale: Точный и традиционно понятный термин для храмового места принесения жертв.
- source_word: οὐδέν ἐστιν
  choice: это ничего не значит
  rationale: Передаёт утверждение, что такая клятва якобы не имеет силы, и звучит естественнее буквального «это ничто».
- source_word: ἐν τῷ δώρῳ
  choice: даром
  rationale: δῶρον прямо означает дар, принесённый Богу; храмовый контекст позволяет сохранить основной лексический эквивалент.
- source_word: τῷ ἐπάνω αὐτοῦ
  choice: лежащим на нём
  rationale: Передаёт расположение дара на жертвеннике и однозначно связывает местоимение с жертвенником.
- source_word: ὀφείλει
  choice: тот обязан
  rationale: Сохраняет правовую и нравственную обязательность клятвы, не добавляя отсутствующего в греческом тексте дополнения.
theological_decisions:
- issue: Неуказанное содержание обязательства в формуле клятвы
  choice: «тот обязан» без поясняющего дополнения
  alternative: «обязан исполнить клятву» / «связан своей клятвой»
  rationale: В греческом тексте объект при ὀφείλει не выражен. Контекст указывает на обязательность клятвы, но перевод сохраняет лаконичность и не делает подразумеваемое явным.
translation_notes:
  register: Современный литературный русский язык; речь краткая и афористичная. Формула «поклянётся жертвенником» естественна для русского языка, а «тот обязан» намеренно сохраняет недосказанность оригинала.
