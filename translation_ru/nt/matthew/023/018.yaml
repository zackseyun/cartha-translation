- from: 'И ещё: «Кто поклянётся жертвенником — это ничего не значит[a], а кто поклянётся даром, лежащим на нём[b], тот обязан».'
  to: 'И: «Кто поклянётся жертвенником — это ничего не значит[a], а кто поклянётся даром[b] на нём, тот обязан».'
  rationale: Исправлено добавочное «ещё», которого нет в греческом καί. Лексическая сноска перенесена к «даром» и сокращена так, чтобы альтернативный вариант относился именно к δῶρον; смысл фразы и сохранённая в оригинале недосказанность при «тот обязан» не изменены.
