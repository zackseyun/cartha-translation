  terminology: «Жертвенник» — точный термин для θυσιαστήριον. «Дар» корректно передаёт δῶρον; сноска уместно отмечает вариант «приношение». Формула «тот обязан» намеренно сохраняет лаконичную, эллиптическую формулировку греческого текста.
