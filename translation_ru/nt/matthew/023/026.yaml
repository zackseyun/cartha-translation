  text: Φαρισαῖε τυφλέ, καθάρισον πρῶτον τὸ ἐντὸς τοῦ ποτηρίου ⸂καὶ τῆς παροψίδος⸃, ἵνα γένηται καὶ τὸ ἐκτὸς ⸀αὐτοῦ καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/026.yaml
  text: Blind Pharisee[a], first clean the inside of the cup and the dish, so that its outside also may become clean.
translation:
  language: ru
  text: Слепой фарисей! Сначала очисти изнутри чашу и блюдо[a], чтобы и внешняя сторона стала чистой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых древних рукописях слова «и блюдо» отсутствуют.
    reason: textual_variant
lexical_decisions:
- source_word: Φαρισαῖε τυφλέ
  choice: Слепой фарисей!
  rationale: Форма обращения в единственном числе передана кратко и резко; «слепой» сохраняет метафору духовной слепоты без её разъяснения.
- source_word: καθάρισον πρῶτον
  choice: Сначала очисти
  rationale: Аористный императив выражает решительное действие, а πρῶτον — его смысловой и временной приоритет.
- source_word: τὸ ἐντὸς τοῦ ποτηρίου καὶ τῆς παροψίδος
  choice: чашу и блюдо изнутри
  rationale: Естественная русская конструкция сохраняет конкретный образ двух сосудов; «блюдо» достаточно широко передаёт παροψίς как сосуд для подачи пищи.
- source_word: ἵνα γένηται καὶ τὸ ἐκτὸς αὐτοῦ καθαρόν
  choice: чтобы и снаружи они стали чистыми
  rationale: «Стали» передаёт результативное значение γένηται, а множественное число естественно согласует чашу и блюдо, несмотря на формально единственное αὐτοῦ в греческом тексте.
theological_decisions:
- issue: Конкретный образ сосудов или явное нравственное толкование
  choice: Сохранить образ очищения чаши и блюда изнутри и снаружи.
  alternative: 'Передать смысл прямо: «сначала очисти свою внутреннюю жизнь…»'
  rationale: Греческий текст оставляет нравственный смысл в форме метафоры; его явное раскрытие ослабило бы образ и добавило толкование.
- issue: Число местоименного отнесения в заключительной части
  choice: Употребить множественное число «они стали чистыми».
  alternative: 'Следовать единственному числу αὐτοῦ: «оно стало чистым».'
  rationale: В греческом αὐτοῦ формально стоит в единственном числе и может обобщённо относиться к сосуду или образу, но в русском после двух однородных существительных единственное число создаёт неясность. Множественное число сохраняет очевидное отнесение к чаше и блюду.
translation_notes:
  register: Современный литературный русский язык; обращение намеренно резкое, но не просторечное. Конкретная бытовая метафора сохранена без богословского разъяснения в основном тексте.
