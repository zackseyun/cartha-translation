  source_fidelity: 'Основной образ и повеление переданы верно: обращение остаётся резким, очищение относится к внутренней части чаши и блюда, а γένηται передано результативным «стали чистыми». Однако αὐτοῦ и τὸ ἐκτός стоят в единственном числе. Русское «они» — понятная стилистическая адаптация после двух существительных, но заменяет намеренно/текстуально возможное единичное отнесение; нейтральнее передать внешний аспект без введения множественного местоимения.'
  naturalness: «Слепой фарисей!» и «Сначала очисти чашу и блюдо изнутри» естественны для современного литературного русского. Перестановка «изнутри» перед дополнением немного яснее показывает, что очищение относится к внутренней стороне обоих сосудов. Формулировка «чтобы и внешняя сторона стала чистой» естественна и не вынуждает переводчика выбирать между единственным числом греческого местоимения и русским согласованием с двумя предметами.
  terminology: «Фарисей», «очисти», «чаша» и «блюдо» адекватны. «Блюдо» — хороший широкий эквивалент παροψίς. Текстологическая сноска уместна, поскольку слова «и блюдо» заключены в критическом тексте в скобки; якорь следует поставить непосредственно после вариативных слов.
