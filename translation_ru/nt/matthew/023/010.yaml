review_pass:
  verdict: approve
  source_fidelity: 'Текст точно передаёт все основные элементы греческого оригинала: μηδέ как продолжающее ряд «И не», пассивное κληθῆτε через естественное русское «не называйтесь», титульное καθηγηταί/καθηγητής как «наставники/Наставник», причинное ὅτι и эмфатическую единственность εἷς. Формула «один у вас Наставник — Мессия» сохраняет смысл: единственный наставник адресатов есть Мессия.'
  naturalness: Фраза звучит как современный литературный русский с уместной возвышенной интонацией прямого наставления. «И не называйтесь наставниками» допустимо и естественно в данном титульном, страдательном значении; не требует искусственного развёртывания вроде «не позволяйте называть себя».
  terminology: «Наставник» удачно передаёт καθηγητής, сохраняя различие с διδάσκαλος в соседних стихах. «Мессия» точно передаёт ὁ χριστός как титул; сноска с традиционным вариантом «Христос» поставлена к нужному слову и корректно классифицирована как лексический вариант. Заглавная буква в единственном «Наставник» контекстуально оправдана как отсылка к Мессии и не создаёт смыслового расхождения.
