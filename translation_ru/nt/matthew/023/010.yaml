id: MAT.23.10
reference: Matthew 23:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μηδὲ κληθῆτε καθηγηταί, ⸂ὅτι καθηγητὴς ὑμῶν ἐστιν εἷς⸃ ὁ χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/010.yaml
  text: Do not be called instructors, for you have one instructor, the Messiah[a].
translation:
  language: ru
  text: И не называйтесь наставниками, потому что один у вас Наставник — Мессия[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос».'
    reason: Лексический вариант передачи титула ὁ χριστός.
lexical_decisions:
- source_word: μηδὲ
  choice: И не
  rationale: Связка продолжает ряд запретов в предшествующем контексте; по-русски «И не» естественно сохраняет эту связь.
- source_word: κληθῆτε
  choice: называйтесь
  rationale: Пассивная форма обозначает принятие наименования или почётного титула; возвратная конструкция естественна в русском запрете.
- source_word: καθηγηταί / καθηγητής
  choice: наставниками / Наставник
  rationale: Слово обозначает того, кто направляет и наставляет. «Наставник» сохраняет отличие от διδάσκαλος («учитель») в ближайшем контексте и звучит естественно как титул.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит основание запрета; «потому что» ясно передаёт причинную связь.
- source_word: ὑμῶν ἐστιν εἷς
  choice: один у вас Наставник
  rationale: Русский порядок слов сохраняет смысл принадлежности и акцент на единственности Наставника, не устраняя возможный оттенок греческой конструкции.
- source_word: ὁ χριστός
  choice: Мессия
  rationale: С артиклем слово здесь выступает как титул; перевод «Мессия» передаёт его значение и иудейский мессианский контекст.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном месте это явно титул единственного Наставника, поэтому его смысл передан переводом; традиционный вариант указан в сноске.
- issue: Единственность наставника
  choice: один у вас Наставник
  alternative: ваш Наставник — один
  rationale: Выбранная формулировка сохраняет эмфазу εἷς и не превращает высказывание в более широкое догматическое объяснение.
translation_notes:
  register: Современный литературный русский язык с достойной, ясной интонацией прямого наставления. Заглавная буква в «Наставник» указывает на мессианский титул в данном контексте, а не вводит отдельный термин.
