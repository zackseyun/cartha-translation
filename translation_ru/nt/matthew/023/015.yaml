  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν ποιῆσαι ἕνα προσήλυτον, καὶ ὅταν γένηται ποιεῖτε αὐτὸν υἱὸν γεέννης διπλότερον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/015.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! Because you travel over sea and land to make one convert, and when he becomes one[b], you make him twice as much a son of Gehenna as yourselves.
translation:
  language: ru
  text: Горе вам, книжники и фарисеи, лицемеры! Вы странствуете по морю и суше, чтобы сделать хотя бы одного человека прозелитом[a], а когда он становится прозелитом, делаете его сыном геенны, вдвое худшим, чем вы сами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть человеком, обратившимся в иудаизм.
    reason: lexical_explanation
  - marker: b
    text: 'Или: «сыном ада».'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: Горе вам
  rationale: Сохраняет силу пророческого обличения и естественно звучит в прямом обращении.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Традиционное и точное обозначение признанных знатоков и толкователей Писания и Закона в данном историческом контексте.
- source_word: Φαρισαῖοι
  choice: фарисеи
  rationale: Общепринятое русское наименование этой иудейской религиозной группы.
- source_word: ὑποκριταί
  choice: лицемеры
  rationale: Передаёт нравственно-религиозное притворство, осуждаемое в контексте.
- source_word: περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν
  choice: обходите море и сушу
  rationale: Сохраняет образ всеохватных и настойчивых странствий, оставаясь понятным по-русски.
- source_word: ποιῆσαι ἕνα προσήλυτον
  choice: сделать одного человека прозелитом
  rationale: «Прозелит» точно передаёт исторически конкретный смысл обращения в иудаизм; слово пояснено в сноске для современного читателя.
- source_word: ὅταν γένηται
  choice: когда он им становится
  rationale: Естественно восполняет подразумеваемое существительное и сохраняет мужской род и единственное число греческого текста.
- source_word: υἱὸν γεέννης
  choice: сыном геенны
  rationale: Сохраняет семитский оборот и конкретный термин γεέννα, не заменяя его без пояснения более общим словом «ад».
- source_word: διπλότερον ὑμῶν
  choice: вдвое большим ... чем вы сами
  rationale: Передаёт сравнительную силу διπλότερον и прямо связывает её с образом «сына геенны», не добавляя в основной текст слова «хуже».
theological_decisions:
- issue: Передача γεέννα
  choice: геенна
  alternative: ад
  rationale: В греческом тексте стоит конкретный термин с иудейским историческим и эсхатологическим фоном. Транслитерация сохраняет этот фон, а привычный эквивалент приводится в сноске.
- issue: Передача идиомы υἱὸν γεέννης
  choice: сын геенны
  alternative: тот, кто обречён на геенну
  rationale: Буквальный семитский образ сохраняет резкость и богословское напряжение высказывания; разъясняющая передача была бы более интерпретирующей.
- issue: Мужской род единственного числа после προσήλυτον
  choice: когда он им становится, делаете его
  alternative: когда такой человек становится прозелитом, делаете этого человека
  rationale: Мужской род и единственное число соответствуют грамматической форме оригинала и естественны в русском контексте.
translation_notes:
  register: Современный литературный русский язык с достоинством и обличительной силой оригинала. Исторические термины «книжники», «фарисеи», «прозелит» и «геенна» сохранены; менее знакомые из них кратко пояснены в сносках. Синтаксис сделан ясным, но образ «сын геенны» намеренно не сглажен.
