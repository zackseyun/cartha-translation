revisions:
- from: Горе вам, книжники и фарисеи, лицемеры! Вы обходите море и сушу, чтобы сделать одного человека прозелитом[a], а когда он им становится, делаете его вдвое большим сыном геенны[b], чем вы сами.
  to: Горе вам, книжники и фарисеи, лицемеры! Вы странствуете по морю и суше, чтобы сделать хотя бы одного человека прозелитом[a], а когда он становится прозелитом, делаете его сыном геенны, вдвое худшим, чем вы сами[b].
  rationale: Исправлена русская идиоматичность без изменения смысла. Образ «сын геенны» сохранён, а сравнительная степень διπλότερον передана естественным русским выражением «вдвое худшим». Сноска о геенне ограничена альтернативным чтением и не навязывает дополнительного истолкования.
