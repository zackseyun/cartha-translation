review_pass:
  verdict: revise
  source_fidelity: 'Смысл и основные соответствия оригиналу в целом сохранены: «горе», «книжники», «фарисеи», «лицемеры», странствия по морю и суше, прозелит и «геенна» переданы верно. Однако сочетание «вдвое большим сыном геенны» по-русски может восприниматься буквально и неестественно передаёт сравнительную силу διπλότερον. Более естественная передача должна сохранить образ «сына геенны», выражая усиление через «вдвое худшим».'
  naturalness: 'Текст в целом литературен, но «обходите море и сушу» несколько двусмысленно: по-русски это может означать обходить вокруг, а не странствовать через разные местности. «Странствуете по морю и суше» яснее и естественнее. Формула «вдвое большим сыном» требует исправления.'
  terminology: Исторические термины «книжники», «фарисеи», «прозелит» и «геенна» уместны. Сноска о прозелите полезна. В сноске b утверждение, что геенна является «образом места окончательного осуждения», излишне интерпретирует термин и выходит за пределы необходимого лексического пояснения; достаточно сохранить вариант «ад», как в английском аудите.
  issues:
  - severity: medium
    issue: «вдвое большим сыном геенны»
    rationale: Русское «большой сын» обычно говорит о возрасте, росте или значительности, а не о степени принадлежности к образу «сын геенны». Формула неестественна и затуманивает сравнительное διπλότερον ὑμῶν.
  - severity: low
    issue: «обходите море и сушу»
    rationale: Глагол «обходить» может означать двигаться вокруг чего-либо. «Странствуете по морю и суше» точнее передаёт широкие путешествия и современнее звучит.
  - severity: medium
    issue: Интерпретирующее пояснение в сноске b
    rationale: Фраза об «окончательном осуждении» добавляет богословское истолкование, которого нет в самой лексической сноске английского аудита. Альтернативный перевод следует дать без такого уточнения.
