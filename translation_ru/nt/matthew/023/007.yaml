  yaml_path: translation/nt/matthew/023/007.yaml
  text: and greetings in the marketplaces, and to be called by men, ‘Rabbi.’
translation:
  language: ru
  text: и приветствия на рыночных площадях, и чтобы люди называли их «Равви».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπασμούς
  choice: приветствия
  rationale: Передаёт публичные почтительные приветствия, которых любили удостаиваться книжники и фарисеи, не добавляя отсутствующего в стихе уточнения о почётности.
- source_word: ἀγοραῖς
  choice: площадях
  rationale: В данном контексте ἀγορά обозначает общественную рыночную площадь как место публичной жизни; «на площадях» естественно по-русски и соответствует множественному числу.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: люди
  rationale: В конструкции с пассивным инфинитивом обозначает действующих лиц. «Чтобы люди называли их» звучит современно и точно, не сужая ἄνθρωποι до мужчин.
- source_word: Ῥαββί
  choice: Равви
  rationale: Сохраняется традиционная транслитерация почётного обращения к учителю; заглавная буква уместна в прямом обращении после двоеточия.
theological_decisions:
- issue: Оттенок осуждения в перечне любимых знаков почёта
  choice: Не добавлять слова «почётные» или «особые» к приветствиям
  alternative: «почётные приветствия»
  rationale: Осуждающий смысл ясен из ближайшего контекста, тогда как сам греческий текст этого стиха содержит только ἀσπασμούς; эксплицирование могло бы сузить значение.
- issue: Передача ἄνθρωποι
  choice: «люди»
  alternative: «мужчины» / «мужи»
  rationale: Греческое слово здесь имеет общее значение «люди» и не указывает специально на лиц мужского пола; богословски значимое ограничение отсутствует.
translation_notes:
  register: Современный литературный русский, сохраняющий достоинство и синтаксическую связь с продолжающимся перечнем предыдущего стиха. Формулировка «чтобы люди называли их» естественнее буквального пассивного оборота «быть называемыми людьми»; двоеточие ясно вводит присваиваемое обращение.
