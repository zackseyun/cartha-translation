lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: кто клянётся
  rationale: Субстантивированное причастие имеет обобщающее значение; эта формулировка естественна для современного русского языка и не вводит ненужного указания на пол.
- source_word: ἐν τῷ ναῷ
  choice: храмом
  rationale: Хотя ἐν буквально означает «в», в формуле клятвы оно указывает на то, чем клянутся; русский творительный падеж естественно передаёт это значение.
- source_word: ναῷ
  choice: храм
  rationale: В данном контексте ναός обозначает храм, точнее храмовое святилище; «храм» ясно и естественно согласуется с окружающими стихами.
- source_word: ὀμνύει
  choice: клянётся
  rationale: Настоящее время выражает общий принцип; русский глагол кратко и естественно передаёт смысл.
- source_word: ἐν αὐτῷ
  choice: им
  rationale: Как и ранее, ἐν относится к формуле клятвы; творительный падеж передаёт объект, которым клянутся, а местоимение отсылает к храму.
- source_word: τῷ κατοικοῦντι αὐτόν
  choice: Тем, Кто обитает в нём
  rationale: Субстантивированное причастие относится к Богу. Формулировка сохраняет образ Божьего обитания в храме, а прописные буквы ясно обозначают подразумеваемого Референта без добавления нового содержания.
theological_decisions:
- issue: Кто обитает в храме
  choice: «Тем, Кто обитает в нём» относится к Богу
  alternative: «тем, кто обитает в нём» без прописных букв
  rationale: В контексте Иисус показывает, что клятва храмом затрагивает Бога, чьё присутствие связано с храмом. Прописные буквы лишь обозначают ясный из контекста референт и не устраняют богословское напряжение образа Божьего обитания.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет параллелизм и юридико-назидательный характер высказывания. «И им, и Тем» естественно подчёркивает оба объекта клятвы.
