id: MAT.23.23
reference: Matthew 23:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον, καὶ ἀφήκατε τὰ βαρύτερα τοῦ νόμου, τὴν κρίσιν καὶ ⸂τὸ ἔλεος⸃ καὶ τὴν πίστιν· ⸀ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/023.yaml
  text: 'Woe to you[a], scribes and Pharisees, hypocrites! For you tithe mint and dill and cumin, and have neglected the weightier matters of the law: justice and mercy and faith. These you ought to have done, without neglecting the others.'
translation:
  language: ru
  text: 'Горе вам, книжники и фарисеи, лицемеры! Вы отдаёте десятину с мяты, укропа и тмина, но пренебрегли более весомым в Законе: справедливостью, милостью и верностью[a]. Это надлежало исполнять, не пренебрегая и тем.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верой». Греческое слово может означать веру, доверие или верность; в этом этическом контексте многие понимают его как верность.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: Горе вам
  rationale: Сохраняет формулу пророческого обличения и угрозы суда; «увы» было бы здесь чрезмерно мягким.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Устоявшееся и точное обозначение знатоков и толкователей Писания в евангельском контексте.
- source_word: ὑποκριταί
  choice: лицемеры
  rationale: Передаёт этический, а не буквальный театральный смысл слова в данном обличении.
- source_word: ἀποδεκατοῦτε
  choice: отдаёте десятину
  rationale: Ясно и естественно передаёт уплату или отделение десятой части, сохраняя религиозно-правовой оттенок.
- source_word: ἡδύοσμον / ἄνηθον / κύμινον
  choice: мята / укроп / тмин
  rationale: Обычные современные русские названия перечисленных трав и пряности.
- source_word: ἀφήκατε
  choice: пренебрегли
  rationale: По контексту означает оставить без исполнения, упустить должное; глагол поддерживает связь с заключительным μὴ ἀφιέναι.
- source_word: τὰ βαρύτερα τοῦ νόμου
  choice: более весомым в Законе
  rationale: Сохраняет метафору веса и одновременно естественно выражает сравнительно большую значимость требований Закона.
- source_word: κρίσιν
  choice: справедливостью
  rationale: В этической триаде речь идёт о справедливом отношении и осуществлении правосудия, а не просто о вынесении суждения.
- source_word: ἔλεος
  choice: милостью
  rationale: Устоявшийся библейский эквивалент, передающий милосердие к другому.
- source_word: πίστιν
  choice: верностью
  rationale: В ряду практических требований Закона «справедливость, милость и верность» наиболее естественно обозначает надёжность и верность обязательствам; многозначность слова отмечена в сноске.
- source_word: ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ἀφιέναι
  choice: Это надлежало исполнять, не пренебрегая и тем
  rationale: Передаёт обязанность соблюдать более важное без отказа от упомянутой десятины и сохраняет противопоставление «это — то».
theological_decisions:
- issue: Значение πίστις в этической триаде
  choice: верность
  alternative: вера
  rationale: Непосредственный контекст перечисляет практические требования Закона, поэтому «верность» лучше согласуется со справедливостью и милостью. Однако πίστις способно означать также веру или доверие, и эта подлинная неоднозначность сохранена в сноске.
- issue: Соотношение главных требований Закона и десятины
  choice: Сохранено одновременное утверждение обеих обязанностей с приоритетом более весомого
  alternative: Представить десятину как отменённую или, напротив, как равную по значимости справедливости, милости и верности
  rationale: Греческое предложение прямо осуждает пренебрежение более важным, но заключает, что и другое не следовало оставлять; перевод не разрешает эту напряжённость сверх сказанного.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого обличения. Сохранены традиционные и широко понятные библейские термины «книжники», «фарисеи», «десятина» и «Закон»; синтаксис сделан естественным для современного читателя.
