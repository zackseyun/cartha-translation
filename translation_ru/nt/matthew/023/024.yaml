  text: Blind guides[a], straining out the gnat but swallowing the camel!
translation:
  language: ru
  text: Слепые поводыри, отцеживающие комара[a], но проглатывающие верблюда!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выцеживающие комара». Греческий глагол означает процеживание жидкости, чтобы удалить из неё постороннюю примесь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδηγοὶ
  choice: поводыри
  rationale: Слово обозначает тех, кто ведёт других. «Поводыри» естественно сочетается со словом «слепые» и сохраняет резкую метафору духовных руководителей.
- source_word: τυφλοί
  choice: слепые
  rationale: Прямо сохраняет яркий метафорический упрёк, указывающий на неспособность верно видеть и направлять.
- source_word: διϋλίζοντες
  choice: отцеживающие
  rationale: Глагол означает процеживание жидкости с целью удалить из неё посторонний предмет. «Отцеживающие» передаёт именно удаление комара, а не просто действие процеживания.
- source_word: τὸν κώνωπα
  choice: комара
  rationale: κώνωψ — мелкое насекомое, комар или мошка. «Комар» — точный, общеупотребительный русский эквивалент, хорошо сохраняющий контраст размеров.
- source_word: τὴν δὲ κάμηλον
  choice: но … верблюда
  rationale: «Верблюд» прямо передаёт κάμηλος, а «но» выражает контраст δέ между тщательным удалением малого и проглатыванием огромного.
- source_word: καταπίνοντες
  choice: проглатывающие
  rationale: Передаёт значение полного заглатывания и сохраняет гиперболический образ без лишней разговорной окраски.
theological_decisions:
- issue: Метафорическая сила образов ритуальной нечистоты
  choice: Сохранить конкретный образ удаления нечистого мелкого насекомого из жидкости и проглатывания нечистого верблюда.
  alternative: Передать смысл отвлечённо как внимание к малым проступкам при пренебрежении большими.
  rationale: Сила упрёка основана на намеренно абсурдном контрасте. Конкретные образы сохраняют как тему нечистоты, так и несоразмерность поведения, не сводя текст к толкованию.
translation_notes:
  register: Современный литературный русский язык с сохранением резкого, афористичного и гиперболического тона. Причастные обороты отражают греческую конструкцию; «поводыри» усиливает внутренний образ слепых людей, ведущих других.
