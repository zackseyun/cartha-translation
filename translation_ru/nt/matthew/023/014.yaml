source:
  edition: robinson-pierpont-2005-byzantine
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κατεσθίετε τὰς οἰκίας τῶν χηρῶν, καὶ προφάσει μακρὰ προσευχόμενοι· διὰ τοῦτο λήψεσθε περισσότερον κρίμα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/014.yaml
  text: Woe[a] to you, scribes and Pharisees, hypocrites! For you devour widows' houses, and as a pretext make long prayers; therefore you will receive greater condemnation.
translation:
  language: ru
  text: Горе вам, книжники и фарисеи, лицемеры! Вы разоряете дома вдов и под предлогом подолгу молитесь. За это вы получите более суровое осуждение.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот стих отсутствует в наиболее ранних греческих рукописях, в том числе в Синайском и Ватиканском кодексах IV века, а также в ранних коптских переводах. Он сохранился в большинстве византийских рукописей, древнелатинских переводах, Вульгате и сирийской традиции. Вероятно, позднейшие переписчики добавили его для согласования с похожими словами в Мк. 12:40 и Лк. 20:47. В рукописях, где этот стих присутствует, он располагается либо перед стихом 13, либо после него.
    reason: textual_critical
lexical_decisions:
- source_word: κατεσθίετε τὰς οἰκίας τῶν χηρῶν
  choice: разоряете вдов
  rationale: Буквально «пожираете дома вдов»; в данном контексте это образ хищнической эксплуатации, ведущей к утрате вдовами имущества. Естественная русская формулировка передаёт смысл метафоры без неясного буквализма.
- source_word: προφάσει μακρὰ προσευχόμενοι
  choice: напоказ подолгу молитесь
  rationale: πρόφασις обозначает предлог или притворное прикрытие; наречное «напоказ» естественно передаёт неискреннюю публичную демонстрацию благочестия. μακρά указывает на продолжительность молитв.
- source_word: περισσότερον
  choice: более суровое
  rationale: При κρίμα сравнительная степень означает усиленную меру неблагоприятного судебного решения, поэтому «более суровое» яснее буквального «большее».
- source_word: κρίμα
  choice: осуждение
  rationale: В контексте грядущего наказания слово означает не нейтральное разбирательство, а обвинительный приговор или осуждение.
- source_word: Οὐαὶ ὑμῖν
  choice: Горе вам
  rationale: Устоявшаяся и точная русская передача пророческого возгласа скорби и суда.
theological_decisions:
- issue: Степень осуждения
  choice: «более суровое осуждение» сохраняет сравнительную степень
  alternative: «осуждение» без сравнительного определения
  rationale: Текст прямо утверждает различие в тяжести осуждения; перевод не сглаживает это богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достойной библейской интонацией. «Книжники», «фарисеи», «лицемеры» сохранены как общеупотребительные библейские термины; синтаксис упрощён для ясности без устранения обвинительной силы текста.
