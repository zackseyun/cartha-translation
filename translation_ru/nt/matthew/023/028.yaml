id: MAT.23.28
reference: Matthew 23:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς ἔξωθεν μὲν φαίνεσθε τοῖς ἀνθρώποις δίκαιοι, ἔσωθεν δέ ⸂ἐστε μεστοὶ⸃ ὑποκρίσεως καὶ ἀνομίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/028.yaml
  text: In the same way[a], you also outwardly appear righteous to people, but inwardly you are full of hypocrisy and lawlessness.
translation:
  language: ru
  text: Так и вы внешне кажетесь людям праведными, а внутри полны лицемерия и беззакония.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Так и вы
  rationale: Естественно передаёт сопоставление с образом побелённых гробниц в предыдущем стихе и сохраняет краткость греческой конструкции.
- source_word: ἔξωθεν μὲν … ἔσωθεν δέ
  choice: внешне … а внутри
  rationale: Сохраняет резкое противопоставление внешнего впечатления и внутренней действительности; союз «а» естественно передаёт контраст μέν…δέ.
- source_word: φαίνεσθε τοῖς ἀνθρώποις δίκαιοι
  choice: кажетесь людям праведными
  rationale: «Кажетесь» передаёт воспринимаемый людьми образ, не утверждая подлинной праведности; «людям» естественно выражает обобщённое значение ἀνθρώποις.
- source_word: μεστοὶ
  choice: полны
  rationale: Краткий и прямой эквивалент прилагательного со значением наполненности.
- source_word: ὑποκρίσεως
  choice: лицемерия
  rationale: Точно передаёт нравственно-религиозную неискренность и соответствует обличительному контексту.
- source_word: ἀνομίας
  choice: беззакония
  rationale: Сохраняет связь с нарушением закона, присущую ἀνομία, и не сводит значение к общему понятию зла.
theological_decisions:
- issue: Обозначает ли δίκαιοι подлинную праведность или лишь впечатление праведности
  choice: Праведность лишь в восприятии людей
  alternative: Утверждение подлинной праведности
  rationale: Глагол φαίνεσθε и противопоставление внутреннему лицемерию и беззаконию показывают, что речь идёт о внешнем впечатлении, а не о действительном нравственном состоянии.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и обличительно-торжественная. Синтаксический параллелизм «внешне … а внутри» сохранён.
