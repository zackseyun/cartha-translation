  text: καὶ πατέρα μὴ καλέσητε ὑμῶν ἐπὶ τῆς γῆς, εἷς γάρ ἐστιν ⸂ὑμῶν ὁ πατὴρ⸃ ὁ ⸀οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/009.yaml
  text: And call no man on earth your father[a], for one is your Father[b], the heavenly One.
translation:
  language: ru
  text: И никого на земле не называйте своим отцом[a], потому что один у вас Отец Небесный[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И отцом своим не называйте никого на земле».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «потому что один у вас Отец — Небесный»; или: «потому что один у вас Отец, Который на небесах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα μὴ καλέσητε ὑμῶν
  choice: отцом своим не называйте никого
  rationale: Передаёт запрет с μή и аористом сослагательного наклонения, а также предикативное значение «называть кого-либо своим отцом». Добавленное «никого» естественно выражает подразумеваемый объект, не внося существующего только в английском слова «man».
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Естественный русский эквивалент пространственной сферы, противопоставленной небесному.
- source_word: εἷς
  choice: один
  rationale: Сохраняет прямую формулировку греческого текста и её исключительный смысл без усиления словом «только».
- source_word: ὑμῶν ὁ πατήρ
  choice: один у вас Отец
  rationale: Естественно передаёт принадлежность, выраженную родительным ὑμῶν, и сохраняет личное отношение учеников к Отцу.
- source_word: ὁ οὐράνιος
  choice: Небесный
  rationale: Субстантивированное прилагательное передано таким же кратким наименованием; оно соотнесено с «Отец» и сохраняет несколько необычную, выразительную форму оригинала.
theological_decisions:
- issue: Объём запрета Иисуса
  choice: Сохранить прямой запрет называть кого-либо на земле своим отцом, не добавляя толкования о духовном титуле.
  alternative: Уточнить в тексте «духовным отцом» либо смягчить запрет как гиперболу.
  rationale: Греческая формулировка категорична, но сам стих не разъясняет её соотношение с обычным обозначением родного отца. Перевод сохраняет эту богословскую напряжённость и оставляет толкование контексту.
- issue: Значение ὁ οὐράνιος
  choice: Небесный
  alternative: Отец Небесный; Который на небесах
  rationale: Выбранный вариант ближе всего передаёт субстантивированное прилагательное, не превращая его без необходимости ни в повтор существительного, ни в придаточное места.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Порядок слов «отцом своим» сохраняет смысловую связь с титулом, не звуча архаично; прописные буквы в «Отец» и «Небесный» показывают, что речь идёт о Боге. Тире естественно оформляет пояснительное наименование.
