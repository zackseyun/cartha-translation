id: MAT.23.34
reference: Matthew 23:34
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἰδοὺ ἐγὼ ἀποστέλλω πρὸς ὑμᾶς προφήτας καὶ σοφοὺς καὶ γραμματεῖς· ⸀ἐξ αὐτῶν ἀποκτενεῖτε καὶ σταυρώσετε, καὶ ἐξ αὐτῶν μαστιγώσετε ἐν ταῖς συναγωγαῖς ὑμῶν καὶ διώξετε ἀπὸ πόλεως εἰς πόλιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/034.yaml
  text: Therefore, look, I am sending to you prophets and wise men and scribes. Some of them you will kill and crucify, and some of them you will flog in your synagogues and persecute from city to city.
translation:
  language: ru
  text: 'Поэтому вот: Я посылаю к вам пророков, мудрецов и книжников. Одних из них вы убьёте и распнёте, а других будете бичевать в ваших синагогах и преследовать из города в город.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь с предшествующим обличением без добавочного толкования.
- source_word: ἰδοὺ
  choice: вот
  rationale: Сохраняет призыв обратить внимание; современно и естественно по-русски.
- source_word: ἀποστέλλω
  choice: посылаю
  rationale: Настоящее время исходного текста сохранено; глагол также удерживает смысл поручения и направления.
- source_word: σοφούς
  choice: мудрецов
  rationale: Обозначает мудрых людей как категорию и естественно сочетается с «пророками» и «книжниками».
- source_word: γραμματεῖς
  choice: книжников
  rationale: Устоявшееся и исторически уместное обозначение знатоков и учителей Писания.
- source_word: μαστιγώσετε
  choice: будете бичевать
  rationale: Точно передаёт телесное наказание плетью и сохраняет серьёзность выражения.
- source_word: διώξετε ἀπὸ πόλεως εἰς πόλιν
  choice: будете… преследовать из города в город
  rationale: Сохраняет длительный характер гонений и пространственную последовательность исходного выражения.
theological_decisions:
- issue: 'Говорящий заявляет: «Я посылаю»'
  choice: Сохранено прямое «Я посылаю» с прописной буквой в речи Иисуса
  alternative: «Я пошлю» или безличная формулировка
  rationale: Греческий текст содержит эмфатическое ἐγὼ и настоящее ἀποστέλλω; перевод не ослабляет личное притязание говорящего и не разъясняет его богословски.
- issue: Распределение действий между посланниками
  choice: «Одних… а других…»
  alternative: 'Повторить буквально: «из них… и из них…»'
  rationale: Естественно передаёт партитивное ἐξ αὐτῶν в обеих частях, не утверждая, что группы непременно полностью различны.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан ясным для обычного читателя; традиционные термины «книжники», «синагоги», «бичевать» сохранены как точные и широко понятные. Двоеточие после «вот» подчёркивает вводящий характер ἰδοὺ без архаичного «се».
