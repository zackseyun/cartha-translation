lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт противопоставление стремлению к почётному положению и титулам в предшествующем контексте.
- source_word: μείζων
  choice: больший
  rationale: Сохраняет сравнительную форму греческого текста и естественно обозначает того, кто занимает более высокое положение среди адресатов; в контексте она может иметь значение превосходной степени.
- source_word: ὑμῶν (первое)
  choice: среди вас
  rationale: 'Естественно передаёт партитивный генитив: больший из числа адресатов.'
- source_word: ἔσται
  choice: будет
  rationale: Прямое и современное соответствие будущему времени глагола εἰμί.
- source_word: ὑμῶν (второе)
  choice: вам
  rationale: При διάκονος дательный по-русски естественно выражает отношение служения к адресатам.
- source_word: διάκονος
  choice: слугой
  rationale: Здесь слово обозначает того, кто служит другим, а не церковную должность; «слуга» сохраняет социальную остроту противопоставления величия и служения.
theological_decisions:
- issue: Соотношение величия и служения в учении Иисуса
  choice: «больший среди вас будет вам слугой»
  alternative: «величайший среди вас будет вашим служителем»
  rationale: 'Выбранный вариант сохраняет парадокс обращения статуса: занимающий более высокое положение должен оказаться слугой остальных. Он не вводит позднейшего значения церковной должности и не смягчает социальную силу слова διάκονος.'
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. «Слугой» предпочтено более церковному «служителем», чтобы передать обычное, нетехническое значение διάκονος. Сравнительное «больший» оставлено в основном тексте ради формальной особенности и неоднозначности оригинала; естественное суперлативное понимание пояснено в сноске.
