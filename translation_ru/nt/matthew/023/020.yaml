id: MAT.23.20
reference: Matthew 23:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ οὖν ὀμόσας ἐν τῷ θυσιαστηρίῳ ὀμνύει ἐν αὐτῷ καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/020.yaml
  text: Therefore[a], the one who swears by the altar swears by it and by everything on it.
translation:
  language: ru
  text: Итак, кто клянётся жертвенником, тот клянётся и им, и всем, что на нём.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὖν ὀμόσας
  choice: Итак, кто клянётся
  rationale: Субстантивированное причастие имеет обобщающее значение («тот, кто» / «кто»), а οὖν выражает вывод из предшествующего рассуждения. Настоящее время естественно передаёт общее правило по-русски.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: жертвенником
  rationale: 'При ὀμνύω предлог ἐν входит в формулу клятвы и передаётся русским творительным падежом: «клясться чем-либо». θυσιαστήριον — «жертвенник».'
- source_word: ὀμνύει
  choice: тот клянётся
  rationale: Настоящее время сохраняет характер общего утверждения; указательное «тот» делает соотношение частей фразы ясным и естественным.
- source_word: ἐν αὐτῷ
  choice: им
  rationale: Местоимение относится к жертвеннику; творительный падеж соответствует русской конструкции «клясться чем-либо».
- source_word: καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ
  choice: и всем, что на нём
  rationale: Выражение обозначает всё находящееся на жертвеннике и шире единственного «дара» из ближайшего контекста. Формулировка сохраняет эту обобщённость без ненужного уточнения.
theological_decisions:
- issue: Что подразумевается под «всем, что на нём»
  choice: Общее указание на всё находящееся на жертвеннике без уточнения, что речь только о дарах или приношениях.
  alternative: «всеми приношениями на нём» или пространственное «всем, что над ним»
  rationale: Греческая формулировка шире упомянутого ранее дара и не называет одни лишь приношения. Перевод сохраняет объём и некоторую открытость исходного выражения.
translation_notes:
  register: Современный литературный русский язык, сдержанный и ясный. «Жертвенник» сохраняет традиционную библейскую терминологию, оставаясь понятным; синтаксис передаёт логический вывод и параллелизм оригинала.
