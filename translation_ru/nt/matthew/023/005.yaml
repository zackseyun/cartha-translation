  text: πάντα δὲ τὰ ἔργα αὐτῶν ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις· πλατύνουσι ⸀γὰρ τὰ φυλακτήρια αὐτῶν καὶ μεγαλύνουσι τὰ ⸀κράσπεδα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/005.yaml
  text: But they do all their works to be seen by people[b][a], for they widen their phylacteries and enlarge their tassels.
translation:
  language: ru
  text: 'Все свои дела они делают напоказ людям: расширяют свои тфилины[a] и увеличивают кисти на одежде[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Тфилины — небольшие кожаные коробочки с отрывками из Писания, которые некоторые иудеи носят во исполнение таких предписаний, как Второзаконие 6:8.
    reason: cultural_note
  - marker: b
    text: 'Или: «бахрому». Ср. Числа 15:38–39, где предписаны кисти по краям одежды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα δὲ τὰ ἔργα αὐτῶν ποιοῦσιν
  choice: Все свои дела они делают
  rationale: Передаёт полноту πάντα и естественно воспроизводит сочетание ἔργα… ποιοῦσιν; δὲ в данном контексте не требует отдельного русского союза.
- source_word: πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις
  choice: напоказ людям
  rationale: Естественно и кратко выражает цель действия — добиться, чтобы люди увидели их поступки.
- source_word: πλατύνουσι
  choice: расширяют
  rationale: Сохраняет конкретный образ увеличения ширины предметов.
- source_word: φυλακτήρια
  choice: тфилины
  rationale: Современный точный термин для носимых кожаных коробочек с отрывками Писания; примечание поясняет его читателю.
- source_word: μεγαλύνουσι
  choice: удлиняют
  rationale: В сочетании с кистями естественно передаёт демонстративное увеличение их размера, не меняя сути γενικού 'делают большими'.
- source_word: κράσπεδα
  choice: кисти на одежде
  rationale: В данном иудейском контексте речь идёт о предписанных Торой кистях, а не просто о кайме или краях ткани.
theological_decisions:
- issue: Передача иудейских религиозных предметов без привнесения полемической окраски
  choice: Точные названия «тфилины» и «кисти на одежде» с культурными пояснениями
  alternative: «Молитвенные коробочки» и «бахрома»
  rationale: Критика направлена на показное увеличение этих предметов, а не на сами предписанные религиозные обычаи.
translation_notes:
  register: Современный литературный русский язык; формулировка сдержанная и ясная. «Напоказ людям» естественно передаёт целевую конструкцию, а специальные культурные реалии пояснены в сносках.
