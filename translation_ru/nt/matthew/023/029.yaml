  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι οἰκοδομεῖτε τοὺς τάφους τῶν προφητῶν καὶ κοσμεῖτε τὰ μνημεῖα τῶν δικαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/029.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites, because you build the tombs of the prophets and decorate the monuments of the righteous[b],
translation:
  language: ru
  text: Горе вам, книжники и фарисеи, лицемеры, потому что вы строите гробницы пророков и украшаете надгробия праведников[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «памятники праведникам». Греческое слово может обозначать гробницы, надгробные сооружения или памятники.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ
  choice: Горе
  rationale: Сохраняет характерное для пророческой речи возвещение суда и звучит естественно в данном обличении.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Устоявшееся и точное обозначение знатоков и толкователей Закона в иудейской среде.
- source_word: Φαρισαῖοι
  choice: фарисеи
  rationale: Общепринятое русское наименование религиозной группы.
- source_word: ὑποκριταί
  choice: лицемеры
  rationale: Естественно передаёт нравственное и религиозное притворство в контексте обличения.
- source_word: ὅτι
  choice: потому что
  rationale: 'Явно передаёт причинное значение союза: далее названа причина возвещения горя.'
- source_word: οἰκοδομεῖτε
  choice: строите
  rationale: Передаёт настоящее время без необоснованного уточнения, будто речь непременно идёт о восстановлении.
- source_word: τοὺς τάφους τῶν προφητῶν
  choice: гробницы пророкам
  rationale: Дательный принадлежности в русском естественно выражает, кому посвящены или принадлежат возводимые гробницы, сохраняя смысл греческого родительного.
- source_word: κοσμεῖτε
  choice: украшаете
  rationale: Прямо и понятно передаёт приведение объекта в украшенный вид.
- source_word: τὰ μνημεῖα
  choice: надгробия
  rationale: Сохраняет погребальный смысл и одновременно отличает этот термин от ранее употреблённого τάφους — «гробницы».
- source_word: τῶν δικαίων
  choice: праведников
  rationale: Кратко передаёт субстантивированное прилагательное и сохраняет традиционную библейскую нравственно-богословскую лексику.
theological_decisions:
- issue: Передача δικαίων вне павловского контекста
  choice: праведников
  alternative: справедливых; праведных людей
  rationale: В данном контексте речь о людях прошлого, почитаемых как верные Богу и нравственно праведные; слово «праведники» сохраняет эту категорию, не привнося более узкого догматического толкования.
translation_notes:
  register: Современный литературный русский с сохранением торжественно-пророческой силы обличения. Синтаксис оформлен одним законченным предложением; парные греческие термины τάφους и μνημεῖα различены как «гробницы» и «надгробия».
