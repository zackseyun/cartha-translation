  text: καὶ λέγετε· Εἰ ⸀ἤμεθα ἐν ταῖς ἡμέραις τῶν πατέρων ἡμῶν, οὐκ ἂν ⸁ἤμεθα ⸂αὐτῶν κοινωνοὶ⸃ ἐν τῷ αἵματι τῶν προφητῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/030.yaml
  text: and you say[a], ‘If we had been living in the days of our fathers[b], we would not have been partners with them in the blood of the prophets.’
translation:
  language: ru
  text: 'и говорите: «Если бы мы жили во времена наших отцов, то не были бы с ними причастны[a] к крови пророков[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не были бы их соучастниками»; греческое слово может обозначать совместное участие, в данном контексте — виновную сопричастность.'
    reason: lexical_alternative
  - marker: b
    text: То есть не участвовали бы вместе с ними в пролитии крови пророков и не разделяли бы их вину.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγετε
  choice: говорите
  rationale: Настоящее время и второе лицо множественного числа переданы прямым обращением; форма естественна в контексте обличительной речи.
- source_word: Εἰ ἤμεθα
  choice: Если бы мы жили
  rationale: Имперфект εἰμί в нереальном условии относится к гипотетической ситуации в прошлом; русский оборот передаёт это естественно.
- source_word: ἐν ταῖς ἡμέραις
  choice: во времена
  rationale: Передаёт временную идиому «в дни, во время» современным литературным русским языком без изменения смысла.
- source_word: τῶν πατέρων ἡμῶν
  choice: наших отцов
  rationale: Сохраняет конкретное значение πατέρων и связь с предшествующими поколениями, не заменяя его более общим словом «предки».
- source_word: οὐκ ἂν ἤμεθα
  choice: то не были бы
  rationale: Условная частица «бы» передаёт аподосис нереального условия; «то» делает русскую конструкцию ясной, не добавляя нового содержания.
- source_word: αὐτῶν κοινωνοὶ
  choice: не были бы вместе с ними причастны
  rationale: κοινωνοί обозначает совместное участие или сопричастность. Формулировка сохраняет широту греческого слова и не усиливает его до однозначного «пособники».
- source_word: ἐν τῷ αἵματι
  choice: к крови
  rationale: Сохранён конкретный образ крови и не внесено в основной текст поясняющее «к пролитию», хотя именно участие в пролитии крови подразумевается контекстом.
- source_word: τῶν προφητῶν
  choice: пророков
  rationale: Прямой и общепринятый эквивалент προφητῶν.
theological_decisions:
- issue: Степень виновной сопричастности в выражении κοινωνοὶ ἐν τῷ αἵματι
  choice: «вместе с ними причастны к крови пророков»
  alternative: «были бы их соучастниками в пролитии крови пророков»
  rationale: Основной текст сохраняет и значение совместного участия, и метафорически насыщенный образ крови, не сводя выражение к более явному толкованию о соучастии в убийстве. Смысл кровопролития пояснён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис прямой речи сохранён; выражение «к крови пророков» намеренно оставляет конкретный образ оригинала, а возможная неясность снимается сноской.
