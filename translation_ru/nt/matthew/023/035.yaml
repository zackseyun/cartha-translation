  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅπως ἔλθῃ ἐφ’ ὑμᾶς πᾶν αἷμα δίκαιον ἐκχυννόμενον ἐπὶ τῆς γῆς ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου, ὃν ἐφονεύσατε μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/035.yaml
  text: so that upon you may come all the righteous blood being poured out on the earth[a], from the blood of righteous Abel to the blood of Zechariah son of Berechiah[b], whom you murdered between the sanctuary and the altar.
translation:
  language: ru
  text: чтобы на вас пришла вся праведная кровь, проливаемая на земле[a], — от крови праведного Авеля до крови Захарии, сына Варахии[b], которого вы убили между святилищем и жертвенником.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в стране». Греческое слово может означать как землю вообще, так и определённую землю или страну.'
    reason: lexical_alternative
  - marker: b
    text: Кого именно следует понимать под «Захарией, сыном Варахии», остаётся спорным. Одни связывают его с пророком Захарией, другие — с Захарией, сыном Иодая (2 Пар. 24:20–22). Перевод следует греческому тексту в его нынешнем виде.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: чтобы
  rationale: Передаёт целевое или результативное значение союза в связи с предшествующим обличением, не устраняя присущего конструкции смыслового напряжения.
- source_word: ἔλθῃ ἐφ’ ὑμᾶς
  choice: на вас пала
  rationale: Естественная русская формулировка сохраняет образ крови и вины, настигающей адресатов, а также значение ἐπί с винительным.
- source_word: πᾶν αἷμα δίκαιον
  choice: вся праведная кровь
  rationale: 'Сохраняет метонимическое употребление: кровь названа праведной как кровь праведных людей. Не добавляется отсутствующее в греческом тексте слово «невинная».'
- source_word: ἐκχυννόμενον
  choice: проливаемая
  rationale: Причастие настоящего времени передаёт продолжающийся или обобщённый характер пролития крови и согласуется с русским библейским образом «проливать кровь».
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Основной перевод допускает широкий смысл «на земле»; возможный более узкий смысл «в этой земле/стране» отмечен в сноске.
- source_word: ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου
  choice: от крови праведного Авеля
  rationale: Естественно передаёт родительную конструкцию и определение δίκαιος.
- source_word: ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου
  choice: до крови Захарии, сына Варахии
  rationale: Точно передаёт диапазон ἀπό...ἕως и сохраняет имя отца согласно греческому тексту.
- source_word: ὃν ἐφονεύσατε
  choice: которого вы убили
  rationale: Глагол φονεύω содержит нравственно обвинительный оттенок. В данном прямом обвинении «убили» звучит по-русски естественно и достаточно сильно; значение умышленного неправедного лишения жизни ясно из контекста.
- source_word: μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου
  choice: между святилищем и жертвенником
  rationale: «Святилище» отражает более узкое значение ναός — храмовое здание или собственно священную часть, а не весь храмовый комплекс; θυσιαστήριον передано как «жертвенник».
theological_decisions:
- issue: Кого обозначает Захария, сын Варахии
  choice: Имя и отчество сохранены в точном соответствии с греческим текстом без гармонизации.
  alternative: Отождествить его либо с пророком Захарией, сыном Варахии, либо с Захарией, сыном Иодая, из 2 Пар 24:20–22.
  rationale: Историческая идентификация остаётся спорной. Перевод не должен молча исправлять или согласовывать исходный текст; вопрос вынесен в сноску.
- issue: Смысл прихода праведной крови на адресатов
  choice: 'Сохранён образ: кровь «падёт» на них, без поясняющей вставки о наказании или вине.'
  alternative: 'Передать истолковательно: «чтобы на вас легла вина за всю праведную кровь» или «чтобы вы понесли наказание».'
  rationale: Греческий текст использует образное выражение и не называет прямо ни вину, ни наказание; буквальный образ сохраняет богословскую напряжённость и не сужает смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены метафора праведной крови, аспект причастия настоящего времени и различие между святилищем и всем храмовым комплексом. Порядок слов сделан естественным для русского языка; тире ясно вводит диапазон «от… до…».
