  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ⸀ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυναγαγεῖν τὰ τέκνα σου, ὃν τρόπον ⸂ὄρνις ἐπισυνάγει⸃ τὰ νοσσία ⸀αὐτῆς ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/037.yaml
  text: Jerusalem[a], Jerusalem, the one who kills the prophets and stones those sent to her—how often I wanted to gather your children together, the way a hen gathers her chicks under her wings[b], and you were not willing!
translation:
  language: ru
  text: Иерусалим, Иерусалим, убивающий пророков и побивающий камнями посланных к тебе, — сколько раз Я хотел собрать твоих детей, как птица[a] собирает своих птенцов под свои крылья, но вы не захотели?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как курица собирает своих цыплят под свои крылья». Греческое слово может обозначать птицу вообще, но в этом контексте может иметься в виду курица-наседка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: Иерусалим, Иерусалим
  rationale: Сохранены прямое обращение, повтор и скорбно-обличительная интонация.
- source_word: ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα
  choice: убивающий пророков и побивающий камнями
  rationale: Субстантивированные причастия переданы русскими причастными оборотами, сохраняющими характеристику олицетворённого города; мужской род согласован с русским названием «Иерусалим».
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: посланных к тебе
  rationale: Пассивное причастие сохранено, а третье лицо естественно переведено вторым лицом внутри прямого обращения.
- source_word: ποσάκις ἠθέλησα
  choice: Сколько раз Я хотел
  rationale: Передаёт повторность и реальное волеизъявление без усиления до предопределения или ослабления до одного лишь чувства.
- source_word: ἐπισυναγαγεῖν τὰ τέκνα σου
  choice: собрать твоих детей
  rationale: Сохраняются образ детей Иерусалима и значение собирания вместе без пояснительной конкретизации.
- source_word: ὃν τρόπον ὄρνις ἐπισυνάγει τὰ νοσσία αὐτῆς
  choice: как птица собирает своих птенцов
  rationale: ὄρνις может обозначать птицу вообще либо курицу; основной текст сохраняет более широкое лексическое значение, а контекстуальная конкретизация отмечена в сноске. Повтор глагола ἐπισυνάγω отражён словом «собирает».
- source_word: ὑπὸ τὰς πτέρυγας
  choice: под крылья
  rationale: Естественный русский образ, буквально соответствующий греческому выражению.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: но вы не захотели
  rationale: Противительный смысл естественно выражен союзом «но»; множественное число сохранено и соотносится с детьми/жителями Иерусалима.
theological_decisions:
- issue: Противопоставление воли Иисуса и нежелания адресатов
  choice: «Я хотел… но вы не захотели»
  alternative: «Я вознамерился… но вы воспротивились» или эмоциональное «Я жаждал»
  rationale: Обе формы θέλω переданы однокоренными словами, чтобы сохранить прямое волевое противопоставление, не разрешая богословский вопрос о соотношении божественной воли и человеческой ответственности.
- issue: Кого обозначают «твои дети»
  choice: Сохранить «твоих детей» без пояснения в основном тексте
  alternative: «твоих жителей» или «твой народ»
  rationale: Буквальный образ олицетворённого города не сужает референт и не навязывает толкование.
- issue: Образ ὄρνις
  choice: «птица» в тексте с указанием «курица» как контекстуальной альтернативы в сноске
  alternative: «курица» в основном тексте
  rationale: Греческое слово допускает общее значение «птица», хотя материнский образ птенцов под крыльями естественно вызывает образ наседки; неоднозначность сохранена явно.
translation_notes:
  register: Современный литературный русский язык с достоинством и эмоциональной силой плача. Синтаксис остаётся близким к греческому, но естественным по-русски. Заглавная буква в «Я» следует принятой русской библейской орфографической традиции.
