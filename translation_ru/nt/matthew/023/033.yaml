  terminology: «Суд геенны» сохраняет родительное сочетание κρίσεως τῆς γεέννης без доктринальных добавлений. Сноска уместно даёт привычный эквивалент «ад», не подменяя им основной термин. Маркер поставлен непосредственно после «геенны» и соответствует содержанию сноски.
