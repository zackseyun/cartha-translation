  text: ὄφεις γεννήματα ἐχιδνῶν, πῶς φύγητε ἀπὸ τῆς κρίσεως τῆς γεέννης;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/033.yaml
  text: You snakes[a], offspring of vipers! How will you escape from the judgment of Gehenna?
translation:
  language: ru
  text: Змеи, порождения гадюк! Как вам избежать суда геенны[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «суда ада». По-гречески: «геенны».'
    reason: Указывает распространённый смысловой эквивалент, сохраняя в основном тексте исходный термин.
lexical_decisions:
- source_word: ὄφεις
  choice: змеи
  rationale: Прямое обращение-обличение; современное и естественное русское соответствие, сохраняющее образ.
- source_word: γεννήματα ἐχιδνῶν
  choice: порождения гадюк
  rationale: Передаёт значение «рождённые/произведённые гадюками» и структуру сочетания существительного с родительным падежом; звучит резко и достойно.
- source_word: πῶς φύγητε
  choice: как вам избежать
  rationale: Сохраняет риторический вопрос и направленность к будущему, не сводя выражение исключительно к способности («как вы можете») или простому предсказанию («как вы избежите»).
- source_word: κρίσεως
  choice: суда
  rationale: Передаёт широкое судебное значение κρίσις, не усиливая его до более узкого «осуждения».
- source_word: γεέννης
  choice: геенны
  rationale: Транслитерация сохраняет историко-иудейскую и эсхатологическую специфику греческого термина, не подменяя её более широким понятием «ад».
theological_decisions:
- issue: Передача γέεννα
  choice: геенна
  alternative: ад
  rationale: «Геенна» сохраняет термин исходного текста и его особые исторические ассоциации; распространённый смысловой эквивалент «ад» указан в сноске.
- issue: Связь κρίσεως и γεέννης
  choice: суд геенны
  alternative: осуждение на адские муки
  rationale: Сохранено компактное родительное сочетание оригинала без добавления отсутствующих в тексте слов и без преждевременного снятия смысловой напряжённости.
translation_notes:
  register: Современный литературный русский язык; обличительный и торжественный тон сохранён без архаизации. Формула «порождения гадюк» предпочтена более традиционному «порождения ехиднины», которое для современного читателя архаично и может быть неверно понято.
