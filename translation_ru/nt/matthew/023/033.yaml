  source_fidelity: «Змеи, порождения гадюк!» точно передаёт два обращения ὄφεις, γεννήματα ἐχιδνῶν, сохраняя различие между общим «змеи» и конкретным «гадюки». «Как вам избежать суда геенны?» естественно выражает риторический вопрос πῶς φύγητε и не сужает κρίσις до «осуждения». Термин «геенна» обоснованно сохранён.
