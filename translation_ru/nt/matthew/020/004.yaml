  text: καὶ ἐκείνοις εἶπεν· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ἀμπελῶνα, καὶ ὃ ἐὰν ᾖ δίκαιον δώσω ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/004.yaml
  text: And he said to them[a], ‘You also go into the vineyard, and whatever is right I will give you.’
translation:
  language: ru
  text: 'И он сказал им: «И вы идите в виноградник, и я дам вам то, что будет справедливым».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что будет правильным»; или: «то, что будет по справедливости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνοις
  choice: им
  rationale: Дательный падеж множественного числа указывает на работников, упомянутых в предыдущем контексте; местоимение естественно по-русски.
- source_word: εἶπεν
  choice: он сказал
  rationale: Обычная передача глагола λέγω при введении прямой речи.
- source_word: Ὑπάγετε
  choice: идите
  rationale: Повелительная форма во множественном числе передаёт прямое приглашение-повеление отправиться в виноградник.
- source_word: καὶ ὑμεῖς
  choice: и вы
  rationale: 'Сохраняет включительное и эмфатическое значение: эти люди также должны пойти, как и нанятые ранее.'
- source_word: ἀμπελῶνα
  choice: виноградник
  rationale: Прямой и общепринятый русский эквивалент ἀμπελών.
- source_word: ὃ ἐὰν ᾖ δίκαιον
  choice: то, что будет справедливо
  rationale: Передаёт неопределённо-относительную конструкцию и этическое значение δίκαιον, не сводя его только к юридической правоте или субъективной выгоде.
- source_word: δώσω ὑμῖν
  choice: я дам вам
  rationale: Сохраняет прямое значение δίδωμι «давать»; контекст оплаты остаётся понятен без замены глаголом «заплачу».
theological_decisions:
- issue: Передача δίκαιον в контексте вознаграждения за труд
  choice: справедливо
  alternative: правильно; по справедливости
  rationale: «Справедливо» естественно для контекста оплаты и сохраняет нравственный смысл греческого слова, не уточняя заранее конкретный размер вознаграждения.
translation_notes:
  register: Современный литературный русский язык с простой, достойной повествовательной формой. Порядок «И вы идите» сохраняет смысловое выделение καὶ ὑμεῖς; формулировка «дам вам» следует греческому глаголу, не добавляя прямо не выраженное «заплачу».
