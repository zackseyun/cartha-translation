source:
  edition: SBLGNT
  text: οὐχ οὕτως ⸀ἔσται ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν μέγας γενέσθαι ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/026.yaml
  text: It shall not be so among you[a]. But whoever wants to become great among you shall be your servant,
translation:
  language: ru
  text: Но среди вас так не будет[a]. Напротив, кто хочет стать великим среди вас, будет вам слугой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Среди вас это не так». В греческом тексте стоит форма будущего времени («будет»), которая здесь может выражать то, как не должно быть среди последователей Иисуса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ οὕτως ἔσται ἐν ὑμῖν
  choice: Но среди вас пусть будет не так
  rationale: Греческое будущее ἔσται здесь имеет нормативную направленность. Русское «пусть будет не так» естественно передаёт предписание Иисуса и не сводит форму к простому описанию настоящего.
- source_word: ἀλλ’ ὃς ἂν θέλῃ
  choice: Напротив, кто хочет
  rationale: Сочетание ὃς ἂν с сослагательным наклонением выражает обобщённое условие; «кто хочет» ясно и естественно передаёт волевое значение θέλῃ.
- source_word: μέγας γενέσθαι
  choice: стать великим
  rationale: «Стать» сохраняет значение перехода в состояние, выраженное γενέσθαι, а не заменяет его статичным «быть».
- source_word: διάκονος
  choice: слугой
  rationale: В данном контексте слово означает того, кто служит другим. «Слуга» сохраняет конкретный образ служения, не создавая ошибочной ассоциации с поздней церковной должностью диакона.
- source_word: ὑμῶν
  choice: вам
  rationale: Дательный оборот «быть вам слугой» идиоматично передаёт родительный отношения ὑμῶν и ясно указывает, кому человек служит.
theological_decisions:
- issue: Природа величия среди последователей Иисуса
  choice: Передать слова как нормативное противопоставление мирской иерархии, сохранив конкретный образ слуги
  alternative: Понять διάκονος как церковную должность «диакон» либо заменить образ служения общим призывом к смирению
  rationale: Контекст противопоставляет господство правителей порядку среди учеников. Перевод не вводит более позднюю церковную терминологию и не ослабляет парадокс величия через служение.
translation_notes:
  register: Современный литературный русский язык; тон ясный и достойный. Конструкция «пусть будет» передаёт нормативную силу будущего времени естественнее буквального «не будет», а «напротив» отчётливо вводит противопоставление.
