id: MAT.20.32
reference: Matthew 20:32
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ στὰς ὁ Ἰησοῦς ἐφώνησεν αὐτοὺς καὶ εἶπεν· Τί θέλετε ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/032.yaml
  text: And Jesus stopped[a], called them, and said, “What do you want me to do for you?”
translation:
  language: ru
  text: 'Иисус остановился, позвал их и сказал: «Что вы хотите, чтобы я сделал для вас?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более формально: «Чего вы желаете, чтобы я сделал для вас?»'
    reason: Лексическая альтернатива для θέλετε и всей конструкции вопроса.
lexical_decisions:
- source_word: στὰς
  choice: остановился
  rationale: Аористное причастие от ἵστημι перед основным глаголом обозначает, что Иисус прекратил движение. Личная форма естественно передаёт последовательность действий по-русски.
- source_word: ἐφώνησεν
  choice: позвал
  rationale: Глагол φωνέω здесь означает, что Иисус обратился к слепым, призывая их к себе. «Позвал» звучит естественно и не добавляет излишней официальности, свойственной слову «призвал».
- source_word: αὐτοὺς
  choice: их
  rationale: Местоимение относится к двум слепым, упомянутым в ближайшем контексте.
- source_word: θέλετε
  choice: хотите
  rationale: θέλω выражает желание или волю; «хотите» — прямой и естественный современный эквивалент.
- source_word: ποιήσω
  choice: чтобы я сделал
  rationale: Аорист конъюнктива после θέλετε передаёт содержание желания. Русская конструкция с «чтобы» точно и естественно отражает эту связь.
- source_word: ὑμῖν
  choice: для вас
  rationale: Дательный падеж имеет здесь значение лица, в чью пользу совершается действие; «для вас» ясно передаёт этот смысл.
theological_decisions:
- issue: Тон вопроса Иисуса
  choice: «Что вы хотите, чтобы я сделал для вас?»
  alternative: «Чего вы желаете, чтобы я сделал для вас?»
  rationale: Основной вариант сохраняет прямой личный вопрос и сострадательное внимание Иисуса, не придавая речи архаичной или искусственно возвышенной окраски.
translation_notes:
  register: Современный литературный русский язык; повествование сдержанное и ясное. Местоимение «я» оставлено со строчной буквы согласно общим нормам русского языка, без внесения конфессиональной типографской традиции.
