  text: Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/018.yaml
  text: Look[a], we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and scribes, and they will condemn him to death[c][b],
translation:
  language: ru
  text: «Вот, мы поднимаемся в Иерусалим, и Сын Человеческий[a] будет передан[b] первосвященникам и книжникам, и они осудят Его на смерть».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Сын Человеческий» — характерное самообозначение Иисуса; возможно, оно перекликается с Дан 7:13–14.
    reason: cross_reference
  - marker: b
    text: 'Или: «будет выдан». В более узком контексте этот глагол может означать «будет предан».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Естественный для современного литературного русского языка указательно-побудительный маркер, сохраняющий функцию привлечения внимания без архаизации.
- source_word: ἀναβαίνομεν
  choice: мы поднимаемся
  rationale: Сохраняет настоящее время и образ восхождения в Иерусалим, обусловленный географией и традиционным представлением о пути к городу.
- source_word: Ἱεροσόλυμα
  choice: Иерусалим
  rationale: Устоявшаяся русская форма названия города.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшееся евангельское самообозначение Иисуса, сохраняющее возможную связь с Дан 7:13–14.
- source_word: παραδοθήσεται
  choice: будет предан
  rationale: Передаёт будущий пассив и переход во власть противников; в русском языке допускает требуемую контекстом широту, не ограничивая значение исключительно предательством Иуды.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: первосвященникам
  rationale: Устоявшийся русский эквивалент для множественного числа, обозначающего высших представителей священнической власти.
- source_word: γραμματεῦσιν
  choice: книжникам
  rationale: Традиционный и по-прежнему понятный прямой эквивалент названия знатоков и толкователей Закона.
- source_word: κατακρινοῦσιν
  choice: осудят
  rationale: Точно и естественно передаёт судебное вынесение обвинительного решения.
- source_word: θανάτῳ
  choice: на смерть
  rationale: Идиоматическое русское выражение для смертного приговора.
theological_decisions:
- issue: Передача христологического обозначения ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  alternative: Человек / Сын человека
  rationale: Устоявшаяся титульная форма сохраняет характерное самообозначение Иисуса и возможный отзвук Дан 7, не сводя выражение к общему обозначению человека.
- issue: Смысл παραδοθήσεται
  choice: будет предан
  alternative: будет выдан / будет передан / будет предан кем-либо
  rationale: Форма сохраняет богословскую и повествовательную напряжённость пассива и не называет не указанного здесь деятеля; примечание поясняет, что греческий глагол шире узкого значения «будет предан изменником».
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Вот» избегает архаичного «се», а «поднимаемся» сохраняет образ восхождения к Иерусалиму. Прописная буква в местоимении «Его» следует распространённой русской библейской издательской норме.
