  text: καὶ ἐξελθὼν περὶ τρίτην ὥραν εἶδεν ἄλλους ἑστῶτας ἐν τῇ ἀγορᾷ ἀργούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/003.yaml
  text: And going out about the third hour[b][a], he saw others standing idle in the marketplace.
translation:
  language: ru
  text: Выйдя около третьего часа[a], он увидел других, стоявших без дела[b] на рыночной площади.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «примерно в девять утра». Дневные часы отсчитывались от восхода солнца.'
    reason: cultural_note
  - marker: b
    text: 'Или: «без работы». Греческое слово указывает, что в тот момент они не работали.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: выйдя
  rationale: Деепричастие естественно передаёт предшествующее основному действию значение аористного причастия, не утяжеляя повествование.
- source_word: περὶ τρίτην ὥραν
  choice: около третьего часа
  rationale: Сохраняет древний способ отсчёта времени и приблизительность, выраженную περί; современный временной эквивалент дан в примечании.
- source_word: εἶδεν
  choice: увидел
  rationale: Прямой и естественный эквивалент глагола ὁράω в повествовательном контексте.
- source_word: ἄλλους
  choice: других
  rationale: Субстантивированное прилагательное передано без добавления слова «мужчин», отсутствующего в греческом тексте.
- source_word: ἑστῶτας
  choice: стоявших
  rationale: Передаёт статическое значение перфектного причастия и согласуется с «других».
- source_word: ἀγορᾷ
  choice: на рыночной площади
  rationale: ἀγορά обозначала общественную площадь и место торговли; сочетание ясно передаёт античную обстановку и не сужает значение до современного рынка.
- source_word: ἀργούς
  choice: без дела
  rationale: Передаёт отсутствие работы в данной сцене естественным современным русским языком, не вводя современную социально-экономическую категорию «безработных».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением библейского обозначения времени. Синтаксис краткий и повествовательный; выражение «без дела» здесь нейтрально описывает положение работников, а не осуждает их как ленивых.
