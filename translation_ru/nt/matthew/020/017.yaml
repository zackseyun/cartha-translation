  text: ⸂Καὶ ἀναβαίνων ὁ⸃ Ἰησοῦς εἰς Ἱεροσόλυμα παρέλαβεν τοὺς δώδεκα ⸀μαθητὰς κατ’ ἰδίαν, ⸂καὶ ἐν τῇ ὁδῷ⸃ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/017.yaml
  text: And as Jesus was going up to Jerusalem, he took the twelve disciples aside by themselves, and on the way he said to them,
translation:
  language: ru
  text: 'Когда Иисус поднимался в Иерусалим, Он отвёл двенадцать учеников в сторону и по дороге сказал им:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνων
  choice: поднимался
  rationale: Настоящее причастие обозначает действие, происходящее одновременно с παρέλαβεν. «Поднимался» естественно передаёт движение вверх к расположенному на высоте Иерусалиму и традиционный способ говорить о пути в этот город.
- source_word: εἰς Ἱεροσόλυμα
  choice: в Иерусалим
  rationale: При обозначении направления к городу εἰς естественно передаётся по-русски предлогом «в» с винительным падежом.
- source_word: παρέλαβεν
  choice: отвёл
  rationale: Глагол означает взять с собой или увести; вместе с κατ’ ἰδίαν здесь речь идёт об отделении учеников от остальных для частного разговора. «Отвёл ... в сторону» естественно выражает весь оборот.
- source_word: τοὺς δώδεκα μαθητὰς
  choice: двенадцать учеников
  rationale: Перевод сохраняет присутствующее в греческом тексте μαθητάς, а «ученики» является точным и устоявшимся соответствием в евангельском контексте.
- source_word: κατ’ ἰδίαν
  choice: в сторону
  rationale: В сочетании с «отвёл» передаёт пространственную обособленность и частный характер последующего разговора без тяжеловесного повтора «отдельно, наедине».
- source_word: ἐν τῇ ὁδῷ
  choice: по дороге
  rationale: Естественное современное русское выражение, сохраняющее обстановку путешествия.
- source_word: εἶπεν αὐτοῖς
  choice: сказал им
  rationale: Прямое и нейтральное соответствие обычному глаголу речи λέγω; двоеточие указывает на продолжение высказывания в следующем стихе.
