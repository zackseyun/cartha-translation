  source_fidelity: 'Текст точно передаёт временное значение ἐλθόντες («Когда пришли»), указание на работников, нанятых первыми (οἱ πρῶτοι в контексте притчи), их ожидание большей платы и итоговое распределение: каждому по динарию. «Но и они» уместно выражает контекстуально явный контраст между ожиданием и полученным, сохраняя эмфазу καὶ αὐτοί.'
