id: MAT.20.10
reference: Matthew 20:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸂καὶ ἐλθόντες⸃ οἱ πρῶτοι ἐνόμισαν ὅτι ⸀πλεῖον λήμψονται· καὶ ἔλαβον ⸂τὸ ἀνὰ δηνάριον καὶ αὐτοί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/010.yaml
  text: When the first ones came[a], they thought they would receive more[b], but they too received a denarius each.
translation:
  language: ru
  text: Когда пришли нанятые первыми, они подумали, что получат больше, но и они получили по одному динарию.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Динарий был обычной платой работнику за один день.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντες
  choice: когда пришли
  rationale: Аористное причастие имеет временное значение; придаточное естественно передаёт последовательность событий по-русски.
- source_word: οἱ πρῶτοι
  choice: нанятые первыми
  rationale: Субстантивированное выражение обозначает работников, нанятых первыми в контексте притчи; добавление «нанятые» ясно восстанавливает подразумеваемое без изменения смысла.
- source_word: ἐνόμισαν
  choice: они подумали
  rationale: Передаёт предположение и ожидание работников, не превращая его в уверенность.
- source_word: πλεῖον
  choice: больше
  rationale: Кратко и естественно передаёт сравнительное значение применительно к размеру платы.
- source_word: λήμψονται
  choice: получат
  rationale: Будущее время сохраняется в русском косвенном высказывании после глагола прошедшего времени и выражает их ожидание.
- source_word: τὸ ἀνὰ δηνάριον
  choice: по одному динарию
  rationale: Предлог ἀνά выражает распределительное значение; «по одному динарию» естественно передаёт плату каждому.
- source_word: καὶ αὐτοί
  choice: но и они
  rationale: Контекстуальное «но» выявляет противопоставление ожидания результату, а «и они» сохраняет акцент на равной плате.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; ясная повествовательная конструкция, умеренно формальный и достойный библейского текста регистр. Подразумеваемые работники названы «нанятыми» на основании ближайшего контекста притчи.
