  text: ὁ δὲ ὄχλος ἐπετίμησεν αὐτοῖς ἵνα σιωπήσωσιν· οἱ δὲ μεῖζον ⸀ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/031.yaml
  text: But the crowd rebuked them so that they would be silent[a]. Yet they cried out all the more, saying, “Lord, have mercy on us[b], Son of David.”
translation:
  language: ru
  text: 'Но толпа стала их одёргивать, чтобы они замолчали. Они же закричали ещё сильнее[a]: «Господи, помилуй нас, Сын Давида[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ещё громче». Сравнительная форма греческого слова может указывать как на усиление крика вообще («ещё сильнее»), так и непосредственно на его громкость.'
    reason: lexical_alternative
  - marker: b
    text: «Сын Давида» — мессианский титул, а не только указание на происхождение.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ὄχλος
  choice: толпа
  rationale: Современное и естественное обозначение собравшегося множества людей; точнее передаёт повествовательную ситуацию, чем более книжное «народ» или «множество».
- source_word: ἐπετίμησεν αὐτοῖς
  choice: стала одёргивать их
  rationale: Передаёт резкое порицание и попытку заставить замолчать, сохраняя значение ἐπιτιμάω и звуча естественно по-русски.
- source_word: ἵνα σιωπήσωσιν
  choice: требуя, чтобы они замолчали
  rationale: Передаёт целевое значение конструкции ἵνα и естественно связывает его с резким воздействием толпы.
- source_word: μεῖζον ἔκραξαν
  choice: закричали ещё сильнее
  rationale: 'Сохраняет сравнительное усиление μεῖζον, не сводя его исключительно к громкости: речь может идти как о большей силе и настойчивости крика, так и о его большей громкости.'
- source_word: Κύριε
  choice: Господи
  rationale: Естественная русская форма прямого обращения, сохраняющая как уважительное обращение к Иисусу, так и возможный христологический оттенок κύριος.
- source_word: ἐλέησον ἡμᾶς
  choice: помилуй нас
  rationale: Точное, краткое и укоренённое в современном библейском русском языке соответствие просьбе о милости.
- source_word: υἱὸς Δαυίδ
  choice: Сын Давида
  rationale: Буквально сохраняет царский и мессианский титул, не сводя его к нейтральному обозначению происхождения.
theological_decisions:
- issue: Мессианский титул υἱὸς Δαυίδ
  choice: Сын Давида
  alternative: потомок Давида
  rationale: В Евангелии от Матфея выражение несёт мессианскую и царскую нагрузку; буквальный перевод сохраняет её, не добавляя толкования в основной текст.
- issue: Значение κύριος в обращении к Иисусу
  choice: Господи
  alternative: Учитель / господин
  rationale: «Господи» сохраняет одновременно уважительное обращение и возможный христологический смысл, тогда как альтернативы преждевременно сужают значение.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксис сделан естественным для устного повествования; реплика сохраняет греческий порядок обращения и просьбы. Формулировка «ещё сильнее» намеренно удерживает неоднозначность μεῖζον.
