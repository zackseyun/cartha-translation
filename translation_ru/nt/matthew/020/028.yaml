  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὥσπερ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/028.yaml
  text: just as the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: ru
  text: подобно тому, как Сын Человеческий пришёл не для того, чтобы ему служили, но чтобы служить и отдать свою жизнь как выкуп за многих[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с более явным указанием на замещение: «как выкуп вместо многих».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ
  choice: подобно тому как
  rationale: Передаёт сравнение с предшествующим наставлением и естественно звучит в современном русском языке.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшаяся передача самоназвания Иисуса, сохраняющая титульное значение и связь с Дан 7.
- source_word: οὐκ ἦλθεν
  choice: пришёл не
  rationale: Аорист передан простым прошедшим временем без добавления отсутствующих в греческом тексте обстоятельств.
- source_word: διακονηθῆναι
  choice: чтобы Ему служили
  rationale: Ясно передаёт пассивный инфинитив и сохраняет лексический параллелизм со следующим глаголом.
- source_word: ἀλλὰ διακονῆσαι
  choice: но чтобы служить
  rationale: Сохраняет прямой контраст активного и пассивного служения обычными современными словами.
- source_word: καὶ δοῦναι
  choice: и отдать
  rationale: В сочетании с жизнью русский глагол «отдать» естественно передаёт добровольную отдачу, не добавляя идеи насильственной передачи.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: Свою жизнь
  rationale: В данном контексте ψυχή означает жизнь, отдаваемую в смерти, а не только нематериальную душу.
- source_word: λύτρον
  choice: выкуп
  rationale: Передаёт цену освобождения и остаётся понятным современному читателю; конструкция «как выкуп» сохраняет предикативную функцию слова.
- source_word: ἀντὶ πολλῶν
  choice: за многих
  rationale: Естественная русская формулировка, допускающая значение действия ради других; более явный заместительный оттенок ἀντί сохранён в сноске.
theological_decisions:
- issue: Смысл ἀντί в выражении о выкупе
  choice: «за многих» в основном тексте с пояснением «вместо многих» в сноске
  alternative: «вместо многих»
  rationale: Предлог ἀντί может выражать обмен или замещение. Основная формулировка естественна по-русски и не устраняет заместительный смысл, а сноска явно сохраняет эту существенную грань.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю. Сохранены достоинство речи, параллелизм «чтобы Ему служили — чтобы служить» и традиционно узнаваемый титул «Сын Человеческий».
