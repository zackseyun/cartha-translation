  source_fidelity: 'Перевод точно передаёт структуру и смысл греческого текста: деепричастие «подозвав их» естественно выражает προσκαλεσάμενος; «Вы знаете» верно передаёт настоящее по смыслу οἴδατε. «Правители языческих народов» уместно отражает οἱ ἄρχοντες τῶν ἐθνῶν в данном контексте, а оба местоимения «ними» сохраняют отсылку к народам. «Господствуют над» и «властвуют над» передают два параллельных, усиленных глагола κατακυριεύουσιν и κατεξουσιάζουσιν без неоправданного усиления до насилия.'
  naturalness: Текст звучит как современный литературный русский с допустимым для библейского повествования возвышенным оттенком. «Подозвав их» и параллельная конструкция «господствуют над ними ... властвуют над ними» ясны и естественны. Слово «вельможи» несколько книжное, но не архаично до степени, нарушающей современное восприятие, и хорошо подходит к социально-политическому регистру высказывания.
