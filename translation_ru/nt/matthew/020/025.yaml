  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς προσκαλεσάμενος αὐτοὺς εἶπεν· Οἴδατε ὅτι οἱ ἄρχοντες τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/025.yaml
  text: But Jesus[a], calling them to himself, said, “You know that the rulers of the Gentiles lord it over them[b], and their great men exercise authority over them.”
translation:
  language: ru
  text: 'Иисус же, подозвав их, сказал: «Вы знаете, что правители языческих народов господствуют над ними, и вельможи властвуют над ними».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: подозвав их
  rationale: Аористное причастие среднего залога передаёт действие Иисуса, который зовёт учеников к себе; «подозвав» естественно выражает это по-русски без избыточного уточнения.
- source_word: Οἴδατε
  choice: Вы знаете
  rationale: οἶδα имеет перфектную форму, но настоящее значение; «вы знаете» точно и идиоматично.
- source_word: ἄρχοντες
  choice: правители
  rationale: Слово обозначает тех, кто управляет; «правители» ясно передаёт политический контекст.
- source_word: τῶν ἐθνῶν
  choice: языческих народов
  rationale: В данном иудейском контексте ἔθνη обозначает нееврейские народы. Формулировка «языческие народы» сохраняет и этнический, и контекстуальный смысл, не ограничивая выражение современным значением слова «язычники».
- source_word: κατακυριεύουσιν
  choice: господствуют над
  rationale: Глагол выражает сильное, контекстуально неодобрительное осуществление господства; русский глагол «господствуют» сохраняет эту окраску.
- source_word: οἱ μεγάλοι
  choice: вельможи
  rationale: Субстантивированное прилагательное обозначает влиятельных и высокопоставленных людей. «Вельможи» кратко и достойно передаёт социально-политическую значимость, хотя имеет слегка возвышенную окраску.
- source_word: κατεξουσιάζουσιν
  choice: властвуют над
  rationale: Глагол означает осуществлять власть над кем-либо, с возможным оттенком подавления. «Властвуют над» сохраняет параллелизм с «господствуют над» и не усиливает смысл до прямого насилия.
- source_word: αὐτῶν
  choice: ними
  rationale: Оба местоимения естественно соотносятся с народами, над которыми правят; повтор «над ними» сохраняет греческий параллелизм.
theological_decisions:
- issue: Значение ἐθνῶν в иудейском контексте речи Иисуса
  choice: языческих народов
  alternative: народов; язычников
  rationale: Выражение указывает на нееврейские народы, однако перевод «языческих народов» яснее показывает референт и избегает сведения многозначного ἔθνη только к религиозной характеристике.
- issue: Передача οἱ μεγάλοι
  choice: вельможи
  alternative: знатные; высокопоставленные люди
  rationale: Греческая форма обозначает видных, могущественных лиц в структуре власти. «Вельможи» сохраняет социально-политический смысл и грамматически мужскую форму, не вводя конкретной должности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским достоинством. Синтаксический параллелизм оригинала сохранён; архаизирующие конструкции и конфессионально окрашенные толкования не добавлены.
