  text: καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν εἰς τὸ ἐμπαῖξαι καὶ μαστιγῶσαι καὶ σταυρῶσαι, καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/019.yaml
  text: and they will hand him over to the Gentiles to mock and flog and crucify[a], and on the third day he will be raised.
translation:
  language: ru
  text: и предадут его язычникам, чтобы те над ним насмеялись, бичевали и распяли его, а на третий день он будет воскрешён[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воскреснет». Греческий глагол имеет страдательную форму («будет воскрешён»), обычную для речи о воскресении; она может подразумевать действие Бога.'
    reason: alternative_reading
lexical_decisions:
- source_word: παραδώσουσιν
  choice: предадут
  rationale: Глагол означает передачу человека во власть других; «предадут» естественно передаёт этот смысл в контексте враждебных властей, не сводя его только к личному предательству.
- source_word: τοῖς ἔθνεσιν
  choice: язычникам
  rationale: В иудейском контексте предсказания о страданиях речь идёт о неевреях, в частности о римских властях; «язычникам» сохраняет традиционное и контекстуально точное обозначение.
- source_word: εἰς τὸ ἐμπαῖξαι
  choice: чтобы те над ним насмеялись
  rationale: Оборот с εἰς и инфинитивом выражает цель или ожидаемый результат. Добавленное «те» делает русское предложение ясным, не меняя референции.
- source_word: μαστιγῶσαι
  choice: бичевали
  rationale: «Бичевали» точно обозначает судебное телесное наказание плетью и остаётся понятным в современном литературном русском.
- source_word: σταυρῶσαι
  choice: распяли
  rationale: Прямой и общеупотребительный русский эквивалент глагола «распять»; объект естественно восстанавливается из контекста.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: на третий день
  rationale: Естественная русская передача временного дательного оборота без добавления отсутствующего в тексте уточнения.
- source_word: ἐγερθήσεται
  choice: будет воскрешён
  rationale: Будущее страдательного залога сохранено явно; такая формулировка допускает подразумеваемое действие Бога и не превращает пассивную форму в возвратную.
theological_decisions:
- issue: Залог глагола воскресения
  choice: будет воскрешён
  alternative: воскреснет
  rationale: Греческая форма стоит в будущем страдательном залоге. Пассивный перевод сохраняет формулировку и возможный оттенок Божьего действия, не разрешая шире представленный в Писании вопрос о действующей стороне.
translation_notes:
  register: Современный литературный русский с ясным синтаксисом и сдержанно-библейским достоинством. Местоимения, относящиеся к Иисусу, даны со строчной буквы в соответствии с обычной современной издательской практикой и формой исходного текста.
