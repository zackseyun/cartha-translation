lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: сжалился над ними
  rationale: Причастие передаёт глубокое сострадание. Русское «сжалился над ними» естественно выражает эмоциональную силу слова; объект сострадания ясен из контекста.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Здесь δέ лишь мягко продолжает повествование. В русском связь естественно передаётся последовательностью фраз без искусственного «но» или «же».
- source_word: ἥψατο
  choice: прикоснулся
  rationale: В данном рассказе об исцелении глагол обозначает физическое прикосновение; управление «прикоснулся к» естественно для русского языка.
- source_word: τῶν ὀμμάτων αὐτῶν
  choice: к их глазам
  rationale: Греческий родительный падеж обусловлен управлением глагола ἅπτομαι; русское соответствие требует дательного с предлогом «к».
- source_word: εὐθέως
  choice: тотчас
  rationale: Слово подчёркивает немедленный результат действия Иисуса. «Тотчас» сохраняет временную точность и достойный повествовательный регистр.
- source_word: ἀνέβλεψαν
  choice: прозрели
  rationale: В контексте исцеления слепых глагол означает обретение или восстановление зрения. «Прозрели» кратко и ясно передаёт именно физическое исцеление, не исключая лексической альтернативы, отмеченной в сноске.
- source_word: ἠκολούθησαν αὐτῷ
  choice: последовали за ним
  rationale: Формулировка сохраняет как буквальное движение вслед за Иисусом, так и возможный повествовательный оттенок следования ученика, не утверждая большего, чем сказано в тексте.
theological_decisions:
- issue: Характер результата исцеления в ἀνέβλεψαν
  choice: реальное и немедленное обретение зрения
  alternative: менее определённое «подняли глаза» или «стали видеть»
  rationale: Сочетание εὐθέως и ἀνέβλεψαν в контексте чуда указывает на непосредственное исцеление от слепоты, однако буквальная лексическая возможность отмечена в сноске.
- issue: Смысл ἠκολούθησαν αὐτῷ
  choice: последовали за ним
  alternative: стали его учениками
  rationale: Текст сообщает, что исцелённые пошли вслед за Иисусом; возможный оттенок ученичества сохранён, но не превращён в прямое утверждение об их постоянном статусе.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным библейским звучанием. Местоимение «ним» написано со строчной буквы как обычная грамматическая отсылка, без введения конфессиональной типографской особенности. Точка с запятой передаёт тесную связь прикосновения с немедленным исцелением, не дробя стих на самостоятельные высказывания.
