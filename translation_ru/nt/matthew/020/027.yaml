  text: καὶ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν εἶναι πρῶτος ⸀ἔσται ὑμῶν δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/027.yaml
  text: And whoever wants to be first among you will be your slave[a].
translation:
  language: ru
  text: И кто из вас хочет быть первым, будет вашим рабом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слугой». Греческое слово δοῦλος сильнее слова, употреблённого в предыдущем стихе, и часто обозначает раба или несвободного слугу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: кто … хочет
  rationale: Сочетание относительного местоимения с ἄν и сослагательным наклонением выражает общее неопределённое условие; по-русски естественно передаётся конструкцией «кто … хочет».
- source_word: ἐν ὑμῖν
  choice: из вас
  rationale: В контексте положения внутри общины русское «из вас» естественно выражает принадлежность к группе и стремление занять в ней первое место.
- source_word: εἶναι πρῶτος
  choice: быть первым
  rationale: Прямо и ясно передаёт стремление к высшему положению.
- source_word: ἔσται
  choice: будет
  rationale: Сохраняет форму будущего времени греческого текста и его контекстуальную нормативную силу, не заменяя её явно модальным «должен быть».
- source_word: ὑμῶν
  choice: вашим
  rationale: 'Передаёт родительный падеж как отношение к остальным ученикам: такой человек будет их рабом.'
- source_word: δοῦλος
  choice: рабом
  rationale: δοῦλος сильнее употреблённого в предыдущем стихе διάκονος и обычно обозначает раба либо несвободного слугу; «рабом» сохраняет риторическое усиление.
theological_decisions:
- issue: Передача δοῦλος в изречении об ученичестве
  choice: рабом
  alternative: слугой
  rationale: Здесь противопоставлены стремление к первенству и предельное самоуничижение в служении. Перевод «рабом» сохраняет более сильный смысл δοῦλος и не сглаживает усиление по сравнению с предыдущим стихом.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная и достойная формулировка. Порядок слов сохраняет акцент на желании быть первым и последующем парадоксальном перевороте положения.
