source:
  edition: SBLGNT
  text: ⸂καὶ ἐλθόντες⸃ οἱ περὶ τὴν ἑνδεκάτην ὥραν ἔλαβον ἀνὰ δηνάριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/009.yaml
  text: And those who came about the eleventh hour received a denarius each[a].
translation:
  language: ru
  text: Пришедшие же около одиннадцатого часа получили по динарию[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Динарий — римская серебряная монета; обычно такова была плата наёмному работнику за день труда.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: же
  rationale: Связывает этот эпизод с предыдущим повествованием и по-русски естественно отмечает переход к первой группе получающих плату, не добавляя строгой временной последовательности.
- source_word: ἐλθόντες
  choice: пришедшие
  rationale: Причастная форма естественно передаёт аористное причастие и относится к работникам, пришедшим в указанное время.
- source_word: οἱ περὶ τὴν ἑνδεκάτην ὥραν
  choice: около одиннадцатого часа
  rationale: Сохраняет приблизительность временного обозначения περὶ и не добавляет отсутствующего в данной фразе глагола «нанятые».
- source_word: ἔλαβον
  choice: получили
  rationale: В контексте выдачи платы точно и естественно передаёт получение денег.
- source_word: ἀνὰ
  choice: по
  rationale: Русская распределительная конструкция «по динарию» ясно выражает, что каждый получил один динарий.
- source_word: δηνάριον
  choice: динарию
  rationale: Сохраняет историческое название монеты, не подменяя его приблизительной современной стоимостью.
