  source_fidelity: «Пришедшие же около одиннадцатого часа получили по динарию» точно передаёт участников, приблизительное временное указание περὶ τὴν ἑνδεκάτην ὥραν, получение платы и распределительное ἀνὰ δηνάριον. «Же» допустимо передаёт повествовательную связь καὶ, не создавая ложной временной последовательности.
