    text: Слово «чаша» сохраняет распространённый в Библии образ назначенной человеку участи, часто связанной со страданием.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Иисус же ответил
  rationale: Естественно передаёт греческую повествовательную формулу; частица «же» отражает мягкий переход или противопоставление δέ, а избыточное для современного русского «ответив, сказал» не воспроизводится буквально.
- source_word: Οὐκ οἴδατε τί αἰτεῖσθε
  choice: Вы не знаете, чего просите
  rationale: Сохраняет прямое значение οἴδατε «знаете», не заменяя его более толковательным «понимаете»; русское управление «просить чего» здесь естественно передаёт содержание просьбы.
- source_word: δύνασθε πιεῖν
  choice: Можете ли вы испить
  rationale: Передаёт вопрос о способности или готовности; «испить» сохраняет возвышенный, но понятный регистр и устойчивую библейскую метафору.
- source_word: τὸ ποτήριον
  choice: чашу
  rationale: Сохраняет исходную метафору назначенной участи, особенно страдания, не сводя её в основном тексте к одному истолкованию.
- source_word: ὃ ἐγὼ μέλλω πίνειν
  choice: которую Мне предстоит испить
  rationale: «Предстоит» естественно выражает направленность μέλλω к будущему и оттенок грядущей участи, не усиливая неоправданно значение непосредственной близости.
- source_word: λέγουσιν αὐτῷ· Δυνάμεθα
  choice: 'Они сказали Ему: «Можем»'
  rationale: Историческое настоящее передано обычным для русского повествования прошедшим временем; краткий ответ сохраняет лексическую связь с предыдущим вопросом.
theological_decisions:
- issue: Метафорический смысл «чаши»
  choice: Сохранить слово «чаша» в основном тексте без поясняющей подстановки
  alternative: «чашу страданий» или «страдание, которое Мне предстоит перенести»
  rationale: Образ намеренно ёмок и в контексте указывает на грядущую участь и страдания Иисуса. Прямое разъяснение в основном тексте сузило бы его богословскую многозначность.
- issue: Оттенок μέλλω
  choice: «Мне предстоит испить»
  alternative: «Я скоро испью» или «Я намерен испить»
  rationale: Выбранный вариант сохраняет будущую направленность и серьёзность назначенной участи, не делая спорного акцента исключительно на скором времени либо личном намерении.
