base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/022.yaml
  text: But Jesus answered and said[a], “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to him, “We are able.”
translation:
  language: ru
  text: 'Иисус же ответил: «Вы не знаете, чего просите. Можете ли вы испить чашу, которую Мне предстоит испить?[a]» Они сказали Ему: «Можем».'
  philosophy: optimal-equivalence
  footnotes:
