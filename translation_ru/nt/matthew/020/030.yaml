  source_fidelity: 'Перевод точно передаёт все основные элементы греческого текста: вводный маркер ἰδού («И вот»), двух слепых у дороги, их реакцию на известие о проходящем Иисусе и напряжённый возглас. «Закричали» адекватно передаёт ἔκραξαν; опущенное как отдельная форма λέγοντες естественно включено в прямую речь. Перестановка «Сын Давида» перед просьбой не меняет синтаксической функции титула как обращения и делает фразу естественной по-русски.'
