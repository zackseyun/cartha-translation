source:
  edition: SBLGNT
  text: καὶ ἰδοὺ δύο τυφλοὶ καθήμενοι παρὰ τὴν ὁδόν, ἀκούσαντες ὅτι Ἰησοῦς παράγει, ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/030.yaml
  text: And behold, two blind men sitting by the road, when they heard that Jesus was passing by, cried out, saying, “Lord, have mercy on us, Son of David.”
translation:
  language: ru
  text: 'И вот, двое слепых, сидевших у дороги, услышав, что мимо проходит Иисус, закричали: «Господи, Сын Давида, помилуй нас!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: И вот
  rationale: Сохраняет указательную функцию маркера и повествовательную живость, оставаясь естественным для современного литературного русского языка.
- source_word: δύο τυφλοὶ
  choice: двое слепых
  rationale: Собирательное числительное естественно обозначает двух мужчин; субстантивированное «слепых» звучит по-русски яснее, чем тяжеловесное «двое слепых мужчин».
- source_word: καθήμενοι παρὰ τὴν ὁδόν
  choice: сидевших у дороги
  rationale: Точно и естественно передаёт положение людей рядом с дорогой.
- source_word: ἀκούσαντες ὅτι Ἰησοῦς παράγει
  choice: услышав, что мимо проходит Иисус
  rationale: Деепричастная конструкция сохраняет последовательность действий, а «мимо проходит» идиоматично передаёт παράγει.
- source_word: ἔκραξαν λέγοντες
  choice: закричали
  rationale: «Закричали» передаёт интенсивность κράζω; отдельное «говоря» в русском избыточно, поскольку далее прямо следует содержание возгласа.
- source_word: Κύριε
  choice: Господи
  rationale: Русская звательная форма естественна в прямом почтительном обращении и сохраняет возможный христологический вес κύριος.
- source_word: ἐλέησον ἡμᾶς
  choice: помилуй нас
  rationale: Устойчивое, точное и понятное русское выражение просьбы о сострадательной помощи.
- source_word: υἱὸς Δαυίδ
  choice: Сын Давида
  rationale: Сохраняет буквальную форму и узнаваемое мессианское титулование, не сводя выражение только к происхождению.
theological_decisions:
- issue: Значение κύριος в обращении к Иисусу
  choice: Господи
  alternative: Господин / Учитель
  rationale: В сочетании с титулом «Сын Давида» обращение имеет почтительный и мессианский оттенок. «Господи» сохраняет эту силу, не утверждая сверх того, что выражено контекстом.
- issue: Мессианская функция υἱὸς Δαυίδ
  choice: Сын Давида
  alternative: потомок Давида
  rationale: Буквальная традиционная форма сохраняет титульный, царско-мессианский смысл выражения в Евангелии от Матфея.
- issue: Порядок слов в возгласе
  choice: Господи, Сын Давида, помилуй нас!
  alternative: Господи, помилуй нас, Сын Давида!
  rationale: Греческая пунктуация допускает связь «Сын Давида» с обращением, хотя форма υἱός синтаксически примечательна. Русский порядок объединяет оба обращения и звучит естественно, не меняя содержания просьбы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис упрощён лишь там, где буквальное воспроизведение «закричали, говоря» было бы неестественным; повествовательная живость и мессианская терминология сохранены.
