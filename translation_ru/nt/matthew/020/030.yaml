  terminology: «Господи» обоснованно сохраняет почтительный вес Κύριε, не навязывая более узкого богословского толкования. «Сын Давида» точно сохраняет традиционный титул и его мессианские коннотации. «Помилуй нас» является устойчивым и понятным соответствием ἐλέησον ἡμᾶς.
