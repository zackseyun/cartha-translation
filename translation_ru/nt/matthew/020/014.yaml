  text: ἆρον τὸ σὸν καὶ ὕπαγε· θέλω δὲ τούτῳ τῷ ἐσχάτῳ δοῦναι ὡς καὶ σοί·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/014.yaml
  text: Take what is yours and go[a]. But I want to give to this last man the same as to you.
translation:
  language: ru
  text: Возьми своё и уходи. Я же хочу дать этому последнему столько же, сколько и тебе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἆρον
  choice: Возьми
  rationale: Аористный императив от αἴρω здесь представляет прямое повеление забрать принадлежащее работнику; «возьми» естественно и сохраняет краткость оригинала.
- source_word: τὸ σὸν
  choice: своё
  rationale: Субстантивированное местоименное выражение означает принадлежащее адресату. «Своё» по-русски естественно и не добавляет прямо не названного слова «плата».
- source_word: ὕπαγε
  choice: уходи
  rationale: В данном контексте императив ὑπάγω служит распоряжением удалиться. «Уходи» точнее передаёт оттенок отпуска, чем нейтральное «иди», не усиливая его до грубого «убирайся».
- source_word: θέλω δὲ
  choice: Я же хочу
  rationale: θέλω выражает волю хозяина, а постпозитивное δέ — мягкое противопоставление. Конструкция «я же хочу» звучит естественно и сохраняет контраст.
- source_word: τούτῳ τῷ ἐσχάτῳ
  choice: этому последнему
  rationale: Мужской субстантивированный ἐσχάτῳ относится к конкретному работнику. Русское «этому последнему» сохраняет мужской личный референт без избыточного добавления слова «работнику» или «человеку».
- source_word: δοῦναι
  choice: дать
  rationale: Инфинитив δίδωμι имеет общее значение «дать». Хотя речь идёт о расчёте с работниками, «дать» сохраняет лексику оригинала и акцент на воле хозяина.
- source_word: ὡς καὶ σοί
  choice: столько же, сколько и тебе
  rationale: Сравнительная конструкция указывает на равную величину дара. Русская формулировка ясно и идиоматично передаёт подразумеваемое равенство.
theological_decisions:
- issue: Передача мужского личного референта в τούτῳ τῷ ἐσχάτῳ
  choice: этому последнему
  alternative: этому последнему работнику
  rationale: Формы греческого текста имеют мужской род и обозначают отдельного работника. Русская субстантивация «последнему» сохраняет это указание, не вводя отсутствующее в стихе существительное.
translation_notes:
  register: Современный литературный русский язык; речь хозяина передана прямо и с достоинством. Синтаксис близок к греческому, но сравнительная конструкция оформлена естественно для русского языка.
