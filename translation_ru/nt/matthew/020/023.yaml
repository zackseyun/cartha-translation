revisions:
- from: 'Он сказал им: «Чашу Мою вы действительно будете пить, но дать вам сесть по правую и по левую руку от Меня — не в Моей власти[a]; эти места предназначены тем, для кого они приготовлены Моим Отцом».'
  to: 'Он сказал им: «Чашу Мою вы действительно будете пить, но дать сесть по правую и по левую руку от Меня — не Мне; эти места предназначены тем, для кого их приготовил Мой Отец».[a]'
  rationale: Исправление заменяет интерпретирующее «не в Моей власти» на более близкое к оригиналу «не Мне», не разрешая содержащегося в высказывании богословского напряжения. Также устранено необязательное «вам», способное вызвать стилистическую двусмысленность. Сохранённая сноска поясняет необычную для современного русского эллиптическую конструкцию и привязана к завершённому высказыванию.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:58:16Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основная смысловая структура передана верно: будущее «будете пить», образ чаши, контраст с почётными местами и приготовление Отцом сохранены. Однако «не в Моей власти» сдвигает οὐκ ἔστιν ἐμὸν δοῦναι от значения «не Мне давать / не Моё дать» к утверждению об отсутствии силы или полномочий. Это толкование уже, чем греческая формулировка.'
  naturalness: «Дать вам сесть по правую и по левую руку» понятно, но в русском может создать впечатление, что каждому из собеседников предлагаются оба места. Более естественная и менее эксплицитная формула — «дать сесть по правую и по левую руку от Меня — не Мне».
  terminology: «Чаша» сохранена без преждевременного истолкования. Формула «не Мне» точнее сохраняет богословскую и синтаксическую сдержанность оригинала, чем «не в Моей власти». Личные местоимения с прописной буквы сохранены в соответствии с регистром проекта.
  issues:
  - severity: medium
    issue: «не в Моей власти»
    rationale: Выражение добавляет конкретный смысл недостатка власти, тогда как греческое ἐμὸν δοῦναι буквально говорит о том, что дать это «не Моё / не Мне». Следует сохранить исходную недоговорённость без доктринального уточнения.
  - severity: low
    issue: Явное «вам» при «дать ... сесть»
    rationale: В греческом при инфинитиве получатель не назван. Контекст допускает обращение к двум ученикам, но русское «вам ... по правую и по левую руку» стилистически двусмысленно; безличнее сформулированный инфинитив точнее и естественнее.
  revised_text: 'Он сказал им: «Чашу Мою вы действительно будете пить, но дать сесть по правую и по левую руку от Меня — не Мне; эти места предназначены тем, для кого их приготовил Мой Отец».[a]'
