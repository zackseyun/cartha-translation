  text: ⸀λέγει αὐτοῖς· Τὸ μὲν ποτήριόν μου ⸀πίεσθε, τὸ δὲ καθίσαι ἐκ δεξιῶν μου καὶ ἐξ ⸀εὐωνύμων οὐκ ἔστιν ⸀ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/023.yaml
  text: He said to them[a], “You will indeed drink my cup, but to sit at my right and at my left is not mine to grant[b], but it is for those for whom it has been prepared by my Father.”
translation:
  language: ru
  text: 'Он сказал им: «Чашу Мою вы действительно будете пить, но дать сесть по правую и по левую руку от Меня — не Мне; эти места предназначены тем, для кого их приготовил Мой Отец».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не Моё дать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Он сказал им
  rationale: Греческий исторический презенс естественно передан прошедшим временем, обычным для русского повествования.
- source_word: Τὸ μὲν ποτήριόν μου πίεσθε
  choice: Чашу Мою вы действительно будете пить
  rationale: Сохранён образ чаши без истолкования в основном тексте; «действительно» передаёт утвердительную силу μὲν перед последующим противопоставлением.
- source_word: καθίσαι ἐκ δεξιῶν μου καὶ ἐξ εὐωνύμων
  choice: сесть по правую и по левую руку от Меня
  rationale: Естественный для литературного русского оборот, обозначающий почётные места рядом с Иисусом.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: дать вам сесть … не в Моей власти
  rationale: Передаёт смысл «не Мне принадлежит дать», сохраняя прямоту и богословское напряжение высказывания без поясняющей гармонизации.
- source_word: ἀλλ’ οἷς ἡτοίμασται
  choice: эти места предназначены тем, для кого они приготовлены
  rationale: Восполнен подразумеваемый член эллиптической греческой конструкции; перфект ἡτοίμασται передан как завершённое приготовление с сохраняющимся результатом.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: Моим Отцом
  rationale: Прямо передан деятель пассивной конструкции; не добавлено отсутствующее в греческом слово «одним».
theological_decisions:
- issue: Христологический смысл слов οὐκ ἔστιν ἐμὸν δοῦναι
  choice: 'Прямо передать: «не в Моей власти», не добавляя оговорок.'
  alternative: «Не Мне дать это независимо от Отца» или иная поясняющая гармонизация.
  rationale: Исходный текст оставляет напряжение между словами Иисуса и властью Отца; перевод не должен разрешать его посредством отсутствующих в греческом уточнений.
translation_notes:
  register: Современный литературный русский язык; речь торжественная, но понятная. Метафора чаши сохранена, синтаксический эллипсис раскрыт ровно настолько, насколько требуется для ясности.
