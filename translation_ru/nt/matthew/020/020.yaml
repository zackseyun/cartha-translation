lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественная временная связка, последовательно вводящая следующее событие.
- source_word: προσῆλθεν αὐτῷ
  choice: к Нему подошла
  rationale: Передаёт направленное приближение к Иисусу; «подошла» точнее выражает движение, чем более общее «пришла».
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: мать сыновей Зеведея
  rationale: Прямо и ясно сохраняет родительную конструкцию оригинала и способ обозначения женщины.
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: вместе со своими сыновьями
  rationale: Передаёт сопровождение; возвратное «своими» естественно указывает на сыновей матери.
- source_word: προσκυνοῦσα
  choice: поклонилась Ему
  rationale: Русское «поклонилась» сохраняет как телесный жест, так и оттенок глубокого почтения, не навязывая исключительно культового значения. Дательный объект «Ему» естественно проясняет направленность действия из контекста.
- source_word: καὶ αἰτοῦσά τι παρ’ αὐτοῦ
  choice: и стала о чём-то просить
  rationale: Передаёт неопределённое τι («о чём-то») и просьбу, обращённую к Иисусу. Конструкция «стала просить» естественно воспроизводит сопутствующее действие причастия.
theological_decisions:
- issue: Значение προσκυνοῦσα по отношению к Иисусу
  choice: поклонилась Ему
  alternative: поклонялась Ему; пала перед Ним ниц; воздала Ему почтение
  rationale: Глагол προσκυνέω может обозначать земной поклон, почтительное преклонение или религиозное поклонение. Основной перевод сохраняет смысловую широту и не разрешает богословское напряжение сверх того, что требует данный контекст.
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным повествовательным стилем. Формы «Нему» и «Ему» написаны с прописной буквы в соответствии с принятой в русском библейском тексте почтительной традицией; синтаксис слегка сглажен ради естественности без утраты содержания оригинала.
