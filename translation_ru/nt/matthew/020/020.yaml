  source_fidelity: В целом лексические соответствия верны, включая неопределённое τι и широкий смысл προσκυνέω. Однако «поклонилась ... и стала ... просить» превращает два одновременных причастия настоящего времени (προσκυνοῦσα καὶ αἰτοῦσά) в последовательные, причём «стала просить» добавляет не выраженное в греческом начало действия.
  naturalness: 'Текст естественен, но деепричастная конструкция точнее передаёт греческую связь действий и остаётся литературно естественной: «кланяясь ... и прося ...».'
  terminology: «Мать сыновей Зеведея» и почтительные формы «Нему/Ему» уместны для данного регистра. «Кланяясь» сохраняет смысловую широту προσκυνέω; сноска должна не ограничивать жест именно «земным поклоном», которого текст специально не уточняет.
  issues:
  - severity: medium
    issue: Видо-временная и синтаксическая передача причастий
    rationale: προσκυνοῦσα и αἰτοῦσά — координированные причастия настоящего времени, описывающие сопровождающие действия. «Поклонилась ... и стала просить» делает их последовательными завершённым и начинательным действиями.
  - severity: low
    issue: Сноска чрезмерно конкретизирует жест
    rationale: Формулировка «земной поклон» может обозначать более определённую физическую форму поклона, чем требует προσκυνέω. Нейтральное «поклон в знак почтения» лучше сохраняет диапазон значения.
