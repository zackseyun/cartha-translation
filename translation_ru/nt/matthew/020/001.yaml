  source_fidelity: 'В черновике точно переданы γάρ, ἡ βασιλεία τῶν οὐρανῶν, раннее утро, наём работников и виноградник. Однако ἀνθρώπῳ в сочетании ἀνθρώπῳ οἰκοδεσπότῃ не имеет отдельного соответствия: «хозяину дома» передаёт οἰκοδεσπότῃ, но опускает явное «человеку». Английская контрольная версия также намеренно сохраняет это уточнение: “a man, a master of a house.”'
