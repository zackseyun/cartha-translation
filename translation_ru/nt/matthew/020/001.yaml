id: MAT.20.1
reference: Matthew 20:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὁμοία γάρ ἐστιν ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐξῆλθεν ἅμα πρωῒ μισθώσασθαι ἐργάτας εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/001.yaml
  text: For the kingdom of heaven is like a man, a master of a house, who went out early in the morning to hire workers for his vineyard.
translation:
  language: ru
  text: Ведь Царство Небесное подобно человеку — хозяину дома, который вышел рано утром нанять работников в свой виноградник.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: хозяину дома
  rationale: Сочетание буквально обозначает человека — хозяина дома; в современном русском слово «хозяин» уже подразумевает человека, поэтому отдельное «человеку» было бы тяжеловесным и неестественным.
- source_word: ἅμα πρωῒ
  choice: рано утром
  rationale: Естественно передаёт выход в самые ранние утренние часы без излишней конкретизации времени.
- source_word: μισθώσασθαι ἐργάτας
  choice: нанять работников
  rationale: Инфинитив цели и трудовые отношения переданы прямо и понятно.
- source_word: ἀμπελῶνα
  choice: виноградник
  rationale: Обычный и точный русский эквивалент.
theological_decisions:
- issue: Связь притчи с предшествующим высказыванием через γάρ
  choice: Ведь
  alternative: Ибо
  rationale: «Ведь» сохраняет пояснительно-причинную связь с предыдущим контекстом и звучит естественно в современной литературной речи.
- issue: Формула ἡ βασιλεία τῶν οὐρανῶν
  choice: Царство Небесное
  alternative: Царство небес
  rationale: Устоявшаяся русская библейская формула, точно передающая смысл без конфессионального уточнения.
translation_notes:
  register: Современный литературный русский язык; dignified, ясная повествовательная фраза без архаизмов. Формальная структура оригинала сохранена там, где она естественна по-русски.
