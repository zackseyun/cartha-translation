    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: Они ответили
  rationale: Историческое настоящее передано прошедшим временем, естественным для русского повествования; глагол «ответили» ясно выражает реплику на заданный ранее вопрос.
- source_word: Ὅτι
  choice: Никто нас не нанял
  rationale: В данном ответе ὅτι вводит причину; по-русски она естественно выражается без отдельного союза «потому что».
- source_word: οὐδεὶς
  choice: никто
  rationale: Прямой и стилистически нейтральный русский эквивалент.
- source_word: ἐμισθώσατο
  choice: не нанял
  rationale: Глагол означает нанять для работы; русское прошедшее время естественно передаёт отсутствие найма до этого момента.
- source_word: λέγει
  choice: Он сказал
  rationale: Историческое настоящее передано прошедшим временем ради последовательного и естественного русского повествования.
- source_word: Ὑπάγετε
  choice: идите
  rationale: Прямое повеление направиться к месту работы.
- source_word: καὶ ὑμεῖς
  choice: И вы
  rationale: Сохраняет включение этой группы наряду с работниками, посланными прежде.
- source_word: ἀμπελῶνα
  choice: виноградник
  rationale: Обычный и точный русский эквивалент.
