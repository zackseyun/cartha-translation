id: MAT.20.21
reference: Matthew 20:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· Τί θέλεις; λέγει αὐτῷ· Εἰπὲ ἵνα καθίσωσιν οὗτοι οἱ δύο υἱοί μου εἷς ἐκ δεξιῶν ⸀σου καὶ εἷς ἐξ εὐωνύμων σου ἐν τῇ βασιλείᾳ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/021.yaml
  text: And he said to her[a], “What do you want?” She said to him, “Command that these two sons of mine may sit, one at your right and one at your left[c][b], in your kingdom.”
translation:
  language: ru
  text: 'Он спросил её: «Чего ты хочешь?» Она ответила Ему: «Скажи[a], чтобы эти два моих сына сели — один справа от Тебя, другой слева — в Твоём Царстве[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Повели». Буквально употреблён глагол «скажи», который в данном контексте выражает просьбу распорядиться.'
    reason: lexical_alternative
  - marker: b
    text: Слово «Царство» может также обозначать «царствование» или «царскую власть».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλεις
  choice: Чего ты хочешь?
  rationale: Прямо и естественно передаёт вопрос о том, с какой просьбой пришла женщина; сохраняет простоту греческой фразы.
- source_word: Εἰπὲ
  choice: Скажи
  rationale: Сохраняет основное значение глагола λέγω и в конструкции «скажи, чтобы…» естественно передаёт просьбу распорядиться, не подменяя глагол более толковательным «даруй».
- source_word: ἵνα καθίσωσιν
  choice: чтобы … сели
  rationale: Передаёт содержание просьбы и назначение мест без излишнего добавления идеи одной лишь возможности или разрешения.
- source_word: οὗτοι οἱ δύο υἱοί μου
  choice: эти два моих сына
  rationale: Сохраняет указательное местоимение οὗτοι и личное μου, оставаясь естественным по-русски.
- source_word: εἷς ἐκ δεξιῶν σου καὶ εἷς ἐξ εὐωνύμων σου
  choice: один справа от Тебя, другой слева
  rationale: Ясно и симметрично передаёт пространственное расположение, не добавляя отсутствующего в греческом тексте слова «рука».
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: в Твоём Царстве
  rationale: «Царство» — естественный и традиционный эквивалент βασιλεία; он допускает как значение царской области, так и смысл царствования.
theological_decisions:
- issue: Характер мест справа и слева от Иисуса в Его царстве
  choice: Передать просьбу пространственно и в царском контексте, не уточняя, о земной или небесной стадии Царства идёт речь.
  alternative: Истолковать это непосредственно как земное мессианское царство или как окончательное небесное Царство.
  rationale: Греческий текст говорит о местах справа и слева в Царстве Иисуса, но не определяет эсхатологическую схему; перевод сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык; прямая речь звучит естественно и достойно. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией. Тире подчёркивают параллельность почётных мест справа и слева.
