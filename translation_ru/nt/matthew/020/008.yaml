  source_fidelity: 'Смысл в целом передан точно: временной оборот, хозяин виноградника, управляющий, распоряжение позвать работников и порядок выплаты сохранены. Историческое настоящее λέγει обоснованно передано словом «говорит». Однако «закончив первыми» неудачно: по-русски это может значить, что первыми заканчивают работу, а не что порядок выплаты доходит до первых.'
