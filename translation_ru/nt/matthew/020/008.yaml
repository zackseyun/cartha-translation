source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης λέγει ὁ κύριος τοῦ ἀμπελῶνος τῷ ἐπιτρόπῳ αὐτοῦ· Κάλεσον τοὺς ἐργάτας καὶ ἀπόδος ⸀αὐτοῖς τὸν μισθὸν ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/008.yaml
  text: When evening came, the master of the vineyard says to his steward, ‘Call the workers and pay them their wages, beginning with the last and ending with the first.’
translation:
  language: ru
  text: 'Когда наступил вечер, хозяин виноградника говорит своему управляющему: «Позови работников и выплати им плату, начав с последних и дойдя до первых».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: Когда наступил вечер
  rationale: Естественно и точно передаёт генитив абсолютный со значением времени.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: хозяин виноградника
  rationale: В контексте притчи κύριος обозначает владельца или хозяина; этот вариант естественнее буквального «господин виноградника» и не вносит явного божественного титула.
- source_word: τῷ ἐπιτρόπῳ αὐτοῦ
  choice: своему управляющему
  rationale: ἐπίτροπος здесь — доверенное лицо, ведающее делами хозяина; «управляющий» ясно передаёт функцию.
- source_word: ἀπόδος αὐτοῖς τὸν μισθόν
  choice: выдай им плату
  rationale: ἀποδίδωμι в данном контексте означает выплатить причитающееся, а μισθός — заработок или плата; формулировка звучит естественно по-русски.
- source_word: ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων
  choice: начав с последних и закончив первыми
  rationale: Передаёт порядок выплаты и делает подразумеваемое конечное действие ясным без изменения смысла.
theological_decisions:
- issue: Историческое настоящее λέγει
  choice: говорит
  alternative: сказал
  rationale: Сохранено настоящее время греческого повествования, оживляющее сцену; русский язык допускает такое историческое настоящее.
- issue: Значение κύριος в притче
  choice: хозяин
  alternative: господин
  rationale: Выбор отражает непосредственную роль владельца виноградника и не навязывает читателю отождествление персонажа с Господом, хотя притчевое богословское значение остаётся открытым.
translation_notes:
  register: Современный литературный русский язык; речь естественная, ясная и достойная. Сохранено историческое настоящее «говорит». Прямая речь оформлена русскими кавычками.
