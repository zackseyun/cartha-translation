base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/033.yaml
  text: They said to him[a], “Lord, let our eyes be opened.”
translation:
  language: ru
  text: 'Они сказали Ему: «Господи[a], пусть откроются наши глаза».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господин».'
    reason: Лексема κύριος в обращении может выражать как признание господства, так и почтительное «господин».
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Они сказали Ему
  rationale: Историческое настоящее естественно передано русским прошедшим временем в повествовательном контексте; дательный αὐτῷ обозначает адресата речи.
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма κύριος при обращении к Иисусу передана традиционным и литературно естественным «Господи», сохраняющим как почтительность, так и возможное признание Его власти.
- source_word: ἵνα ἀνοιγῶσιν
  choice: пусть откроются
  rationale: Конструкция ἵνα с пассивным аористом сослагательного наклонения выражает содержание просьбы. Русская конструкция с «пусть» звучит естественно и сохраняет направленность просьбы, а возвратная форма «откроются» допускает подразумеваемого совершающего действие.
- source_word: οἱ ὀφθαλμοὶ ἡμῶν
  choice: наши глаза
  rationale: Сочетание существительного с родительным местоимением естественно передаётся русским притяжательным местоимением.
theological_decisions:
- issue: Значение κύριος в обращении к Иисусу
  choice: Господи
  alternative: Господин / учитель
  rationale: «Господи» соответствует обычному значению κύριος и контексту обращения к Иисусу, не вынуждая читателя сводить обращение только к светской вежливости. Вместе с тем возможный менее насыщенный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; речь краткая, почтительная и естественная. Сохранена пассивная направленность греческой просьбы без уточнения действующего лица.
