  yaml_path: translation/nt/matthew/020/005.yaml
  text: So they went away. Going out again about the sixth and ninth hour[a], he did likewise.
translation:
  language: ru
  text: И они ушли. Выйдя снова около шестого и девятого часа[a], он поступил так же.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
