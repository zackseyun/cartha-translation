    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ ἀπῆλθον
  choice: И они пошли
  rationale: Местоимение указывает на работников из предыдущего стиха; δέ передано нейтральным повествовательным союзом «и», а ἀπῆλθον — естественным современным «пошли».
- source_word: πάλιν
  choice: снова
  rationale: Прямо выражает повторение действия и естественно звучит в современном русском повествовании.
- source_word: ἐξελθὼν
  choice: Выйдя
  rationale: Деепричастие сохраняет структуру греческого аористного причастия и передаёт действие, предшествующее главному.
- source_word: περὶ ἕκτην καὶ ἐνάτην ὥραν
  choice: около шестого и девятого часа
  rationale: Сохраняет культурно-исторический способ исчисления времени; περὶ передано словом «около». Современные соответствия разъяснены в сноске.
- source_word: ἐποίησεν ὡσαύτως
  choice: он поступил так же
  rationale: Естественная русская передача семантически лёгкого ποιέω вместе с ὡσαύτως; отсылка к предыдущему действию сохраняется без лишнего уточнения.
