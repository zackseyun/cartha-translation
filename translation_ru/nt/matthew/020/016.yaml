  text: οὕτως ἔσονται οἱ ἔσχατοι πρῶτοι καὶ οἱ πρῶτοι ⸀ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/016.yaml
  text: So the last will be first[a], and the first last.
translation:
  language: ru
  text: Так[a] последние станут первыми, а первые — последними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Таким образом».'
    reason: Лексическая альтернатива для οὕτως.
lexical_decisions:
- source_word: οὕτως
  choice: Так
  rationale: Передаёт вывод, следующий из притчи, кратко и естественно для современного русского языка; греческое слово допускает также более развёрнутое «таким образом».
- source_word: ἔσονται
  choice: станут
  rationale: Будущая форма глагола εἰμί в этом изречении указывает на перемену положения; «станут» естественно передаёт будущий результат, не уточняя его природу.
- source_word: οἱ ἔσχατοι
  choice: последние
  rationale: Артикль с прилагательным употреблён субстантивированно. «Последние» сохраняет лаконичность и не сужает смысл до социальной малозначительности.
- source_word: πρῶτοι
  choice: первыми
  rationale: Творительный падеж после «станут» естественно выражает именную часть сказуемого и сохраняет противопоставление «последние — первые».
- source_word: καὶ
  choice: а
  rationale: В русском симметричном противопоставлении «а» звучит естественнее буквального «и»; оно связывает две части одной формулы, не добавляя причинного или исключающего смысла.
- source_word: οἱ πρῶτοι
  choice: первые
  rationale: Субстантивированное прилагательное прямо соответствует параллельному «последние» и сохраняет сбалансированное построение изречения.
- source_word: ἔσχατοι
  choice: последними
  rationale: Творительный падеж после подразумеваемого «станут» завершает зеркальную формулу и сохраняет значение положения или порядка без дополнительного толкования.
theological_decisions:
- issue: Характер переворота, выраженного словами «последние» и «первые»
  choice: Передать изречение как краткую формулу переворота, не уточняя, относится ли она к очередности, положению, награде или спасению.
  alternative: Истолковать слова как указание исключительно на социальный переворот, различие наград среди учеников или порядок спасения.
  rationale: Греческий текст не сужает область применения изречения; перевод должен сохранить его смысловую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная и симметричная формулировка. «А» служит естественному русскому противопоставлению, а тире обозначает опущенное во второй части «станут».
