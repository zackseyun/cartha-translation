id: MAT.20.13
reference: Matthew 20:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸂ἑνὶ αὐτῶν εἶπεν⸃· Ἑταῖρε, οὐκ ἀδικῶ σε· οὐχὶ δηναρίου συνεφώνησάς μοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/013.yaml
  text: But answering[a], he said to one of them, ‘Friend, I am not wronging you[b]. Did you not agree with me for a denarius?’
translation:
  language: ru
  text: 'Но он сказал в ответ одному из них: «Друг, я не поступаю с тобой несправедливо. Разве не за динарий ты договорился со мной?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Динарий — обычная римская серебряная монета; его часто платили работнику за один день труда.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: сказал в ответ
  rationale: Естественно передаёт причастную конструкцию, вводящую ответ хозяина, без тяжеловесного буквального «отвечая, сказал».
- source_word: ἑνὶ αὐτῶν
  choice: одному из них
  rationale: 'Передаёт дательный единственного числа с партитивным родительным: хозяин обращается к одному человеку из группы.'
- source_word: Ἑταῖρε
  choice: Друг
  rationale: Наиболее естественное современное обращение; в данном контексте оно может звучать сдержанно и не обязательно выражает близость.
- source_word: οὐκ ἀδικῶ σε
  choice: я не поступаю с тобой несправедливо
  rationale: Передаёт личную направленность ἀδικέω и значение несправедливого обращения, сохраняя настоящее время.
- source_word: οὐχὶ
  choice: Разве не
  rationale: Естественно оформляет риторический вопрос, предполагающий утвердительный ответ.
- source_word: δηναρίου
  choice: за динарий
  rationale: Сохраняет историческое название монеты и передаёт родительный цены.
- source_word: συνεφώνησάς μοι
  choice: ты договорился со мной
  rationale: Точно и естественно обозначает достигнутое ранее соглашение об оплате.
theological_decisions: []
