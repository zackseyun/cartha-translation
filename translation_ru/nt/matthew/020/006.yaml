base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/006.yaml
  text: And about the eleventh hour he went out and found others standing there[a], and he says to them[b], ‘Why have you been standing here idle all day?’
translation:
  language: ru
  text: Около одиннадцатого часа он вышел и нашёл других, стоявших,[a] и говорит им:[b] «Почему вы стоите здесь без дела весь день?»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть примерно в пять часов вечера. Буквально: «около одиннадцатого часа».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и сказал им». В греческом тексте употреблено историческое настоящее: «говорит».'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἑνδεκάτην
  choice: А около одиннадцатого часа
  rationale: περί с винительным передаёт приблизительность. Сохранение древнего счёта часов поддерживает временную структуру притчи; современный эквивалент поясняется в сноске.
- source_word: ἐξελθὼν εὗρεν
  choice: он вышел и нашёл
  rationale: Аористное причастие обозначает действие, предшествующее εὗρεν; в естественном русском повествовании последовательность ясно передаётся двумя однородными глаголами.
- source_word: ἄλλους ἑστῶτας
  choice: других, стоявших там
  rationale: ἄλλους употреблено субстантивно и не требует добавления «работников» или «людей»; перфектное причастие указывает на состояние стояния.
- source_word: καὶ λέγει αὐτοῖς
  choice: и говорит им
  rationale: Сохранён исторический презенс λέγει, придающий рассказу живость.
- source_word: Τί ὧδε ἑστήκατε
  choice: Почему вы… стоите здесь
  rationale: В вопросе τί имеет значение «почему», а перфект ἑστήκατε выражает продолжающееся состояние; русское настоящее время звучит естественно и передаёт этот смысл.
- source_word: ὅλην τὴν ἡμέραν ἀργοί
  choice: весь день… без дела
  rationale: Обстоятельственная конструкция «стоять без дела» естественно передаёт ἀργοί как отсутствие деятельности, не привнося современного социально-экономического понятия безработицы.
