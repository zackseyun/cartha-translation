  text: Καὶ ἀκούσαντες οἱ δέκα ἠγανάκτησαν περὶ τῶν δύο ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/024.yaml
  text: And when the ten heard it, they became indignant about the two brothers.
translation:
  language: ru
  text: Услышав это, десять учеников вознегодовали на двух братьев.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: услышав это
  rationale: Естественный русский деепричастный оборот; местоимение «это» явно отсылает к предшествующей просьбе, хотя в греческом объект подразумевается.
- source_word: οἱ δέκα
  choice: десять учеников
  rationale: В контексте речь идёт о десяти остальных учениках; добавление «учеников» делает выражение естественным и не меняет референта.
- source_word: ἠγανάκτησαν
  choice: вознегодовали
  rationale: Передаёт сильное недовольство и возмущение; слово литературное, но понятное современному читателю.
- source_word: περὶ τῶν δύο ἀδελφῶν
  choice: на двух братьев
  rationale: В данном контексте περί обозначает направленность негодования по отношению к двум братьям; русский оборот «негодовать на кого-либо» наиболее естественен.
