  text: Καὶ ἐκπορευομένων αὐτῶν ἀπὸ Ἰεριχὼ ἠκολούθησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/029.yaml
  text: And as they were going out from Jericho[a], a large crowd followed him.
translation:
  language: ru
  text: Когда они выходили из Иерихона[a], за Ним последовала большая толпа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда они покидали Иерихон».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένων
  choice: когда они выходили
  rationale: Генитив множественного числа причастия настоящего времени употреблён в обстоятельственном временном обороте; несовершенный вид «выходили» естественно передаёт развёртывающееся действие.
- source_word: ἀπὸ Ἰεριχὼ
  choice: из Иерихона
  rationale: Предлог ἀπό обозначает движение от места; по-русски при глаголе «выходить» естественно сказать «из Иерихона».
- source_word: ἠκολούθησεν
  choice: последовала
  rationale: Аорист ἀκολουθέω обозначает следование за кем-либо. Форма женского рода согласуется с русским существительным «толпа».
- source_word: αὐτῷ
  choice: за Ним
  rationale: Дательный падеж после русского «следовать» передаётся конструкцией «за» с творительным. Единственное число сохранено и указывает в контексте на Иисуса, несмотря на предшествующее множественное «они».
- source_word: ὄχλος πολύς
  choice: большая толпа
  rationale: Сочетание обозначает многочисленную толпу; «большая толпа» ясно и естественно звучит в современном русском языке.
theological_decisions:
- issue: К кому относится местоимение единственного числа αὐτῷ после оборота во множественном числе
  choice: Толпа последовала за Иисусом («за Ним»).
  alternative: Толпа последовала за всей группой («за ними»).
  rationale: Греческий текст намеренно переходит от множественного «они выходили» к единственному «за ним последовала», выделяя Иисуса как центрального участника. Этот переход сохранён.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Заглавная буква в «Ним» ясно указывает на Иисуса и сохраняет местоимение единственного числа; порядок слов остаётся естественным для русского языка.
