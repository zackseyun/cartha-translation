  text: ⸀λέγοντες· Οὗτοι οἱ ἔσχατοι μίαν ὥραν ἐποίησαν, καὶ ἴσους ⸂αὐτοὺς ἡμῖν⸃ ἐποίησας τοῖς βαστάσασι τὸ βάρος τῆς ἡμέρας καὶ τὸν καύσωνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/012.yaml
  text: saying[a], ‘These last worked one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’
translation:
  language: ru
  text: 'говоря: «Эти последние проработали один час, а ты поставил их наравне с нами[a], переносившими тяготу дня и палящий зной».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ты обошёлся с ними так же, как с нами».'
    reason: Лексическая альтернатива для ἴσους … ἐποίησας, допускающей акцент не на статусе равенства, а на одинаковом обращении.
lexical_decisions:
- source_word: λέγοντες
  choice: говоря
  rationale: Причастие настоящего времени продолжает синтаксическое движение предыдущего стиха; русское деепричастие сохраняет эту связь.
- source_word: Οὗτοι οἱ ἔσχατοι
  choice: эти последние
  rationale: Кратко сохраняет противопоставление работникам, нанятым последними; референт ясен из контекста притчи.
- source_word: μίαν ὥραν ἐποίησαν
  choice: проработали всего один час
  rationale: В сочетании с обозначением времени ποιέω означает провести это время за работой. «Всего» естественно передаёт возмущённый акцент на одном часе, выраженный контекстом и начальной позицией слов.
- source_word: ἴσους αὐτοὺς ἡμῖν ἐποίησας
  choice: ты поставил их наравне с нами
  rationale: Естественная русская передача конструкции «сделал их равными нам», сохраняющая смысл уравнивания без добавления оценки справедливости.
- source_word: τοῖς βαστάσασι
  choice: переносившими
  rationale: Передаёт как несение тяжести, так и длительное терпение тягот работы; причастная форма соответствует греческому причастию.
- source_word: τὸ βάρος τῆς ἡμέρας
  choice: тяготу дня
  rationale: Сохраняет образ тяжёлого бремени полного рабочего дня и звучит естественно в современном литературном русском.
- source_word: τὸν καύσωνα
  choice: палящий зной
  rationale: καύσων обозначает сильный, обжигающий жар; сочетание передаёт его интенсивность.
theological_decisions:
- issue: Жалоба работников на уравнивание в притче
  choice: Передать протест прямо, не называя поступок хозяина несправедливым.
  alternative: Добавить формулировку, прямо подчёркивающую несправедливое обращение.
  rationale: Греческий текст сообщает жалобу работников, но не включает в неё явной авторской оценки; богословское напряжение притчи следует сохранить.
translation_notes:
  register: Современный литературный русский, понятный широкому читателю, с умеренно возвышенной библейской выразительностью. «Тягота дня» и «палящий зной» сохраняют образность оригинала без архаизации.
