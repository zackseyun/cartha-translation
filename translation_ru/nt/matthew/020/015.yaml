  text: Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am good?[a]
translation:
  language: ru
  text: Разве я не вправе распоряжаться тем, что принадлежит мне, как хочу? Или твой глаз завистлив оттого, что я добр?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Или твой глаз зол оттого, что я добр?» Выражение «злой глаз» — греческая идиома, обозначающая зависть или недовольство чужой щедростью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστίν
  choice: не вправе
  rationale: Передаёт значение дозволенности и законного права в естественной для современного русского риторической формулировке.
- source_word: ὃ θέλω ποιῆσαι
  choice: поступить… так, как хочу
  rationale: Ясно выражает личное волеизъявление, сохраняя действие ποιῆσαι и значение θέλω.
- source_word: ἐν τοῖς ἐμοῖς
  choice: со своим добром
  rationale: Обозначает принадлежащее хозяину имущество; «добро» естественно в контексте притчи и одновременно подготавливает словесное противопоставление его доброте.
- source_word: ὁ ὀφθαλμός σου πονηρός
  choice: твой глаз зол
  rationale: Сохраняет буквальный образ греческой идиомы и её противопоставление доброте хозяина; вероятный смысл зависти поясняется в сноске.
- source_word: ἀγαθός
  choice: добр
  rationale: Сохраняет широкое значение прилагательного и явный контраст между «злым» глазом и добрым хозяином, не сужая смысл до одной лишь щедрости.
theological_decisions:
- issue: Следует ли раскрывать идиому ὁ ὀφθαλμός σου πονηρός непосредственно в основном тексте
  choice: 'Сохранить образ: «твой глаз зол»'
  alternative: «ты завидуешь» или «ты недоволен тем, что я щедр»
  rationale: Буквальный образ сохраняет риторическое и богословское напряжение между злым глазом работника и добротой хозяина; сноска делает вероятный идиоматический смысл доступным современному читателю.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Формулировка «не вправе» естественнее буквального «не позволено ли мне», а образ «глаз зол» намеренно сохранён и пояснён сноской.
