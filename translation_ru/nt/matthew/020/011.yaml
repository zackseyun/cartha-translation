  text: 'Получив плату, они стали роптать на хозяина дома:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: Получив плату
  rationale: Аористное причастие обозначает действие, предшествующее основному глаголу. В греческом объект не выражен, но из контекста ясно, что речь о полученной плате; его добавление делает русский текст естественным.
- source_word: δὲ
  choice: не передано отдельно
  rationale: Здесь δέ служит мягкой повествовательной связкой. В русском последовательность естественно выражена деепричастным оборотом без отдельного союза.
- source_word: ἐγόγγυζον
  choice: стали роптать
  rationale: Имперфект допускает как длительное, так и начинательное понимание. «Стали роптать» естественно передаёт начало недовольного ворчания после получения платы.
- source_word: κατὰ
  choice: на
  rationale: В сочетании «роптать на кого-либо» русский предлог «на» естественно передаёт направленность недовольства против человека.
- source_word: τοῦ οἰκοδεσπότου
  choice: хозяина дома
  rationale: Передаёт составное значение οἰκοδεσπότης — хозяин или глава дома и хозяйства — и остаётся понятным современному читателю.
