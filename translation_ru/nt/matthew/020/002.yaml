id: MAT.20.2
reference: Matthew 20:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸂συμφωνήσας δὲ⸃ μετὰ τῶν ἐργατῶν ἐκ δηναρίου τὴν ἡμέραν ἀπέστειλεν αὐτοὺς εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/002.yaml
  text: After agreeing with the workers for one denarius for the day[a], he sent them into his vineyard.
translation:
  language: ru
  text: Договорившись с работниками о динарии за день[a], он послал их в свой виноградник.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Динарий был обычной платой наёмному работнику за день труда.
    reason: cultural_note
lexical_decisions:
- source_word: συμφωνήσας
  choice: Договорившись
  rationale: 'Аористное причастие обозначает действие, предшествующее основному: хозяин сначала условился с работниками, а затем послал их в виноградник.'
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Здесь δέ служит слабой повествовательной связкой; в русском предложении последовательность естественно передаётся деепричастным оборотом без отдельного союза.
- source_word: ἐργατῶν
  choice: с работниками
  rationale: Современное и нейтральное обозначение нанятых для труда людей, уместное в контексте виноградника.
- source_word: ἐκ δηναρίου
  choice: о динарии
  rationale: Передаёт согласованный размер платы и сохраняет название древней монеты, не подменяя его современным денежным эквивалентом.
- source_word: τὴν ἡμέραν
  choice: за день
  rationale: Естественно выражает плату за день работы, не добавляя отсутствующего в греческом тексте уточнения о полном рабочем дне.
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Прямое и естественное соответствие повествовательному глаголу.
- source_word: ἀμπελῶνα
  choice: виноградник
  rationale: Обычное и точное русское соответствие.
- source_word: αὐτοῦ
  choice: свой
  rationale: Русское возвратное притяжательное местоимение ясно указывает, что виноградник принадлежит подлежащему — хозяину.
