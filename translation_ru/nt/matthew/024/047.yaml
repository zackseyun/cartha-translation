  text: ἀμὴν λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/047.yaml
  text: Truly I say to you that he will appoint him over all his possessions[a].
translation:
  language: ru
  text: 'Истинно говорю вам: он поставит его над всем своим имуществом[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «над всем, что у него есть».'
    reason: Лексическая альтернатива, более буквально раскрывающая τοῖς ὑπάρχουσιν αὐτοῦ.
lexical_decisions:
- source_word: ἀμὴν
  choice: Истинно
  rationale: Передаёт торжественное и авторитетное введение к словам Иисуса; одиночное ἀμὴν здесь не следует удваивать.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямо передаёт греческую формулу и сохраняет её торжественный характер, оставаясь естественной по-русски.
- source_word: ὅτι
  choice: ':'
  rationale: В современном русском содержание после формулы «Истинно говорю вам» естественно вводится двоеточием; отдельный союз «что» не требуется.
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: над всем своим имуществом
  rationale: Предлог ἐπί с дательным после καθίστημι обозначает сферу вверенной ответственности, а субстантивированное τοῖς ὑπάρχουσιν — всё принадлежащее хозяину. Вариант «над всем, что у него есть» дан в сноске.
- source_word: καταστήσει
  choice: поставит
  rationale: В данном контексте означает назначение на положение управляющего; «поставит над» естественно и точно передаёт административный смысл.
- source_word: αὐτόν
  choice: его
  rationale: Местоимение мужского рода единственного числа отсылает к верному и благоразумному рабу из предшествующего контекста.
theological_decisions:
- issue: Характер награды и вверенной ответственности со стороны господина
  choice: Высказывание передано прямо как назначение над всем имуществом господина.
  alternative: Истолковать его непосредственно как церковную власть или как небесную награду последнего времени.
  rationale: Сам стих говорит о расширении ответственности в рамках притчи. Перевод не должен встраивать в текст дальнейшую экклезиологическую или эсхатологическую систематизацию.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной евангельской формулы. «Имущество» понятно широкому читателю и уместно в контексте управления хозяйством; синтаксис краткий и dignified.
