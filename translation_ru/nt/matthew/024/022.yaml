source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ἐκολοβώθησαν αἱ ἡμέραι ἐκεῖναι, οὐκ ἂν ἐσώθη πᾶσα σάρξ· διὰ δὲ τοὺς ἐκλεκτοὺς κολοβωθήσονται αἱ ἡμέραι ἐκεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/022.yaml
  text: And if those days had not been cut short[a], no flesh would have been saved; but for the sake of the elect[b], those days will be cut short.
translation:
  language: ru
  text: И если бы те дни не были сокращены[a], ни один человек не спасся бы; но ради избранных те дни будут сокращены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не были укорочены… будут укорочены». Греческий глагол означает сокращение или урезание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολοβώθησαν / κολοβωθήσονται
  choice: не были сокращены / будут сокращены
  rationale: Глагол κολοβόω передаёт сокращение или урезание продолжительности. «Сокращены» естественно применительно к дням и сохраняет временной смысл без лишней образности.
- source_word: οὐκ ἂν ἐσώθη
  choice: никто ... не спасся бы
  rationale: Контрфактическая конструкция передана условным наклонением. «Не спасся бы» сохраняет широкий смысл σῴζω, тогда как «не выжил бы» однозначно ограничило бы его физическим выживанием.
- source_word: πᾶσα σάρξ
  choice: никто из людей
  rationale: Буквально «всякая плоть», но при отрицании это библейская идиома со значением «ни один человек». В современном русском «никто из людей» понятно и не создаёт ложного впечатления, будто речь идёт о веществе тела.
- source_word: διὰ δὲ τοὺς ἐκλεκτούς
  choice: но ради избранных
  rationale: «Ради» естественно передаёт значение основания или блага при διά с винительным падежом. «Избранные» сохраняет обозначение группы без уточнения её состава.
- source_word: αἱ ἡμέραι ἐκεῖναι
  choice: те дни
  rationale: Прямо и естественно передаёт указательное выражение.
- source_word: καὶ εἰ μὴ
  choice: И если бы ... не
  rationale: Сохраняет сочинительную связь и явную условную форму греческого текста.
theological_decisions:
- issue: Кого обозначают «избранные» в эсхатологической речи
  choice: Сохранить слово «избранные» без поясняющего расширения.
  alternative: «избранный народ Бога», «верующие», «верный остаток»
  rationale: Сам стих не определяет полный состав этой группы; уточнение разрешило бы богословский вопрос за пределами текста.
- issue: Значение σῴζω в данном контексте
  choice: Передать как «спастись», сохранив возможность непосредственного смысла сохранения жизни.
  alternative: «выжить», «остаться в живых»
  rationale: Контекст указывает на физическое спасение во время бедствия, однако более узкие варианты устранили бы присущую глаголу смысловую широту.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизации. Идиома πᾶσα σάρξ раскрыта как «никто из людей», а богословски значимое σῴζω сохранено через «спастись».
