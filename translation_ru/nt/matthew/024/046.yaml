  text: μακάριος ὁ δοῦλος ἐκεῖνος ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ⸂οὕτως ποιοῦντα⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/046.yaml
  text: Blessed is that servant whom his lord, when he comes, will find doing so.
translation:
  language: ru
  text: Блажен тот раб, которого господин, придя, застанет поступающим так.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: Блажен
  rationale: Традиционное и точное библейское соответствие, выражающее состояние одобрения и благополучия, а не просто эмоциональное счастье.
- source_word: δοῦλος
  choice: раб
  rationale: Сохраняет социальную и риторическую силу греческого слова в образе раба, находящегося под властью господина.
- source_word: κύριος
  choice: господин
  rationale: Внутри притчи обозначает владельца и начальника раба; строчная буква сохраняет прямой смысл образа, не устраняя возможной связи с Господом.
- source_word: ἐλθών
  choice: придя
  rationale: Естественно передаёт обстоятельственное причастие, действие которого предшествует обнаружению.
- source_word: εὑρήσει οὕτως ποιοῦντα
  choice: застанет поступающим так
  rationale: Русское «застанет» естественно выражает смысл «найдёт в процессе действия», а конструкция сохраняет длительный характер причастия ποιοῦντα.
theological_decisions:
- issue: Относится ли κύριος прямо к Господу Иисусу или к господину в образе?
  choice: «господин» со строчной буквы
  alternative: «Господь»
  rationale: Непосредственный уровень притчи говорит о господине раба, тогда как контекстуальная отсылка ко Христу остаётся доступной без типографического навязывания толкования.
translation_notes:
  register: Современный литературный русский язык с dignified библейским регистром. Лаконичная структура оригинала сохранена; порядок слов слегка адаптирован ради естественности.
