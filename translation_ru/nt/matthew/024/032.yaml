  - severity: medium
    issue: Синтаксис второго признака
    rationale: 'В формулировке «её ветвь уже становится мягкой и распускаются листья» листья становятся самостоятельным субъектом. В греческом ὁ κλάδος αὐτῆς является субъектом γένηται и ἐκφύῃ: ветвь становится нежной и выпускает листья.'
