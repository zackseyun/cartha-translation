  terminology: «Притча» сохраняет евангельский термин παραβολή; сноска может предложить «сравнение» или «урок» как контекстуальные альтернативы. «Смоковница», «ветвь» и «лето» уместны. Сноска к θέρος корректно сохраняет возможную, но здесь маловероятную связь с жатвой.
