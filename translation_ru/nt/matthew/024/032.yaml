  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ἤδη ὁ κλάδος αὐτῆς γένηται ἁπαλὸς καὶ τὰ φύλλα ἐκφύῃ, γινώσκετε ὅτι ἐγγὺς τὸ θέρος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/032.yaml
  text: 'Learn the parable from the fig tree: as soon as its branch becomes tender and puts out leaves[c][b][a], you know that summer is near.'
translation:
  language: ru
  text: 'На примере смоковницы усвойте притчу[a]: когда её ветвь уже становится нежной и выпускает листья[b], вы знаете, что лето[c] близко.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поймите сравнение»; «извлеките урок».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пускает листья».'
    reason: lexical_alternative
  - marker: c
    text: Греческое θέρος обычно означает «лето», а в некоторых контекстах может обозначать пору жатвы; здесь образ смоковницы указывает прежде всего на время года.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: у смоковницы
  rationale: Предлог ἀπό с родительным падежом обозначает источник, из которого следует извлечь знание. По-русски сочетание «взять урок у смоковницы» естественно передаёт эту связь; δέ имеет слабую связующую функцию и не требует отдельного слова «теперь».
- source_word: μάθετε
  choice: возьмите… урок
  rationale: Аорист повелительного наклонения выражает прямое побуждение научиться на данном примере. В сочетании с παραβολή естественный русский оборот «возьмите урок» сохраняет побудительную силу.
- source_word: τὴν παραβολήν
  choice: такой урок
  rationale: Здесь παραβολή обозначает поучительное сравнение, которое сразу раскрывается в образе сезонных изменений смоковницы. «Урок» звучит естественно по-русски, а более буквальные варианты отмечены в сноске.
- source_word: ὅταν ἤδη
  choice: когда… уже
  rationale: ὅταν вводит общее временное условие, а ἤδη подчёркивает наступление наблюдаемого изменения. «Когда… уже» сохраняет оба компонента без усиления до строго мгновенного «как только».
- source_word: ὁ κλάδος αὐτῆς γένηται ἁπαλὸς
  choice: её ветвь уже становится мягкой
  rationale: γένηται обозначает изменение состояния, а ἁπαλός — мягкость или нежность молодой, оживающей ветви. «Становится мягкой» близко передаёт образ и понятно современному читателю.
- source_word: καὶ τὰ φύλλα ἐκφύῃ
  choice: и распускаются листья
  rationale: ἐκφύω означает произрастать, пускать или выводить наружу новые листья. Русское «распускаются листья» естественно описывает наблюдаемое весеннее явление.
- source_word: γινώσκετε
  choice: вы знаете
  rationale: 'Форма настоящего времени второго лица множественного числа выражает общее знание, а не повеление: по этим признакам люди знают о близости лета.'
- source_word: ἐγγὺς τὸ θέρος
  choice: лето близко
  rationale: В образе смоковницы θέρος прежде всего обозначает лето. Краткий русский порядок слов естественно передаёт именную конструкцию со значением близости.
theological_decisions:
- issue: Смысл образа смоковницы
  choice: Смоковница передана как наблюдаемый сезонный пример без прямого символического отождествления.
  alternative: Истолковать смоковницу в самом переводе как символ Израиля.
  rationale: Сам стих формулирует сравнение между видимыми признаками и распознаванием близости события, но не называет символический референт смоковницы. Перевод сохраняет образ и не предрешает более широкое эсхатологическое толкование.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и естественным синтаксисом. Оборот «возьмите… урок» делает поучительное сравнение понятным обычному читателю, а сноска сохраняет связь с традиционным термином «притча». Единственное число «ветвь» следует греческому тексту; образ не снабжён конфессионально обусловленным символическим толкованием.
