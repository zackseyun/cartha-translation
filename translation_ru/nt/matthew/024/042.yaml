  source_fidelity: 'Текст точно передаёт все элементы греческого оригинала: выводное οὖν («Итак»), продолжающееся повеление γρηγορεῖτε («бодрствуйте»), причинное ὅτι, незнание конкретного дня и титул ὁ κύριος ὑμῶν («ваш Господь»). Будущее «придёт» является естественной русской передачей настоящего ἔρχεται в данном эсхатологическом контексте; примечание прозрачно отмечает форму оригинала и допустимый вариант «приходит».'
