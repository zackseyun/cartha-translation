  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε ποίᾳ ⸀ἡμέρᾳ ὁ κύριος ὑμῶν ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/042.yaml
  text: Therefore stay awake[c][b][a], because you do not know on what day your Lord is coming.
translation:
  language: ru
  text: Итак, бодрствуйте[a], потому что не знаете, в какой день придёт ваш Господь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не спите», «будьте бдительны».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «приходит». В греческом употреблена форма настоящего времени; по смыслу также возможно: «придёт».'
    reason: alternative_reading
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: бодрствуйте
  rationale: Настоящее повелительное наклонение во множественном числе призывает к постоянной бдительности. «Бодрствуйте» сохраняет образ бодрствования и естественно звучит в современном литературном русском.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предшествующего наставления ясно и естественно.
- source_word: ὅτι
  choice: потому что
  rationale: Вводит основание повеления; современная и прозрачная причинная связь.
- source_word: οὐκ οἴδατε
  choice: не знаете
  rationale: Прямо передаёт отрицательную форму глагола знания без неоправданного усиления.
- source_word: ποίᾳ ἡμέρᾳ
  choice: в какой день
  rationale: Естественно передаёт дательный времени и сохраняет неизвестность конкретного дня.
- source_word: ὁ κύριος ὑμῶν
  choice: ваш Господь
  rationale: Идиоматично передаёт сочетание артикля с притяжательным местоимением и сохраняет титул κύριος.
- source_word: ἔρχεται
  choice: придёт
  rationale: В русском эсхатологическом контексте будущее время естественнее всего выражает предстоящее пришествие. Греческая форма настоящего времени отмечена в сноске, чтобы не скрывать её выразительную напряжённость.
theological_decisions:
- issue: Эсхатологическое значение настоящего времени ἔρχεται
  choice: В основном тексте — «придёт», с указанием греческого настоящего времени в сноске.
  alternative: «приходит»
  rationale: Русское «приходит» здесь может ошибочно восприниматься как обозначение повторяющегося действия. «Придёт» ясно передаёт контекст, а сноска сохраняет грамматическую форму оригинала и связанную с ней живую ожидаемость, не устанавливая точных сроков.
translation_notes:
  register: Современный литературный русский, краткий и назидательный синтаксис. «Бодрствуйте» сохраняет метафору и достоинство речи, оставаясь понятным широкому читателю.
