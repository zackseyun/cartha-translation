  terminology: «Господь» последовательно передаёт κύριος и соответствует новозаветному регистру. Формулировка «ваш Господь» идиоматична и точно отражает греческое сочетание с притяжательным местоимением. Сноска a даёт уместные лексические альтернативы, а сноска b корректно фиксирует значимость настоящего времени без догматического уточнения сроков.
