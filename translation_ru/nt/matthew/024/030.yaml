source:
  edition: SBLGNT
  text: καὶ τότε φανήσεται τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου ἐν ⸀τῷ οὐρανῷ, καὶ τότε κόψονται πᾶσαι αἱ φυλαὶ τῆς γῆς καὶ ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ μετὰ δυνάμεως καὶ δόξης πολλῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/030.yaml
  text: And then the sign of the Son of Man will appear in heaven[a], and then all the tribes of the earth will mourn[c][b], and they will see the Son of Man coming on the clouds of heaven with power and great glory.
translation:
  language: ru
  text: И тогда на небе[a] явится знамение Сына Человеческого, и тогда все племена земли[b] будут скорбеть и увидят Сына Человеческого, идущего на облаках небесных[c] с силой и великой славой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в небесах». Греческое слово οὐρανός может означать как небо в небесно-космическом смысле, так и видимое небо.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все племена страны». Греческое γῆ может означать как всю землю, так и определённую землю или страну.'
    reason: alternative_reading
  - marker: c
    text: Выражение «идущего на облаках небесных» перекликается с Дан 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: φανήσεται
  choice: явится
  rationale: Будущая форма здесь имеет непереходное значение «станет видимым, появится»; «явится» естественно передаёт видимое проявление и сохраняет возвышенный контекст.
- source_word: τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: знамение Сына Человеческого
  rationale: «Знамение» точно передаёт σημεῖον и уместно в эсхатологическом контексте. Родительный оборот сохранён без уточнения, относится ли знамение к Сыну Человеческому или им является.
- source_word: ἐν τῷ οὐρανῷ
  choice: на небе
  rationale: Русское «на небе» естественно охватывает небесную сферу и видимое небо; возможный смысл «в небесах» отмечен в сноске.
- source_word: κόψονται
  choice: будут скорбеть
  rationale: Средняя форма κόπτω в данном употреблении означает оплакивание или скорбь. Перевод передаёт смысл, не навязывая конкретный жест биения себя в грудь.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: все племена земли
  rationale: «Племена» непосредственно передаёт φυλαί и сохраняет библейско-пророческую образность; «земли» в космическом контексте по умолчанию понимается универсально, при сохранении альтернативы в сноске.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: на облаках небесных
  rationale: Прямой и естественный перевод, сохраняющий отсылку к Дан 7:13 и пространственный оттенок ἐπί.
- source_word: μετὰ δυνάμεως καὶ δόξης πολλῆς
  choice: с силой и великой славой
  rationale: Сохраняется греческая структура, в которой определение πολλῆς непосредственно относится к «славе».
theological_decisions:
- issue: Значение выражения «знамение Сына Человеческого»
  choice: Сохранён неоднозначный родительный оборот «знамение Сына Человеческого».
  alternative: «знамение, принадлежащее Сыну Человеческому» или «знамение — сам Сын Человеческий»
  rationale: Греческая конструкция не позволяет однозначно выбрать между этими толкованиями, поэтому перевод не разрешает спорный эсхатологический вопрос.
- issue: Объём значения γῆ
  choice: В основном тексте употреблено «земли» в смысле всей земли.
  alternative: «страны» или «этой земли»
  rationale: Космический и апокалиптический контекст поддерживает универсальное понимание, однако возможная отсылка к земле Израиля сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Знамение», «Сын Человеческий» и «облака небесные» сохраняют межтекстовые связи и достоинство апокалиптической речи; синтаксис при этом остаётся ясным для современного читателя.
