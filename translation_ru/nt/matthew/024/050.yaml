  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/050.yaml
  text: the master of that slave will come on a day he does not expect and at an hour he does not know[b][a],
translation:
  language: ru
  text: то господин того раба придёт в день, которого он не ожидает, и в час, которого он не знает.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хозяин того слуги». Греческое κύριος может означать «господин» или «хозяин»; здесь это человек, стоящий над рабом в притче.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «слуги». Греческое δοῦλος обозначает человека, находящегося в несвободном служебном подчинении; здесь выбран перевод «раб», поскольку такой статус существенен для образа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξει
  choice: придёт
  rationale: Будущая форма ἥκω обозначает приход или прибытие; «придёт» естественно передаёт неожиданное возвращение господина.
- source_word: ὁ κύριος
  choice: господин
  rationale: Внутри притчи слово обозначает человека, обладающего властью над рабом, а не употребляется непосредственно как божественный титул.
- source_word: τοῦ δούλου
  choice: раба
  rationale: δοῦλος обозначает человека в несвободном, подчинённом положении; в данной паре «господин — раб» этот статус существенен.
- source_word: ἐκείνου
  choice: этого
  rationale: Указательное местоимение отсылает к конкретному рабу, о котором говорится в предшествующем контексте.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: в день, когда тот не ожидает
  rationale: Сохраняются временная конструкция и неопределённость дня; «тот» ясно относит ожидание к рабу и избегает двусмысленности русского местоимения «он».
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: в час, которого тот не знает
  rationale: Формулировка сохраняет параллель «день — час» и прямое значение γινώσκω — «знать».
theological_decisions:
- issue: Значение κύριος в бытовом контексте притчи
  choice: господин
  alternative: Господь; хозяин
  rationale: Непосредственно речь идёт о стоящем над рабом человеке внутри притчи. «Господь» преждевременно превращало бы слово в явный божественный титул, хотя притча имеет более широкое эсхатологическое значение.
- issue: Передача δοῦλος
  choice: раб
  alternative: слуга; раб-слуга
  rationale: В контексте явно выраженного отношения κύριος—δοῦλος слово «раб» точнее сохраняет несвободный социальный статус, не смягчая образ.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и риторического параллелизма исходного текста. Союз «то» отражает продолжение условной конструкции предыдущего стиха. Для ясности дважды употреблено «тот», поскольку субъект глаголов — раб, а не господин.
