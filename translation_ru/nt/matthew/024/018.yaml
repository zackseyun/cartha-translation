  text: καὶ ὁ ἐν τῷ ἀγρῷ μὴ ἐπιστρεψάτω ὀπίσω ἆραι ⸂τὸ ἱμάτιον⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/018.yaml
  text: And let the one in the field not turn back to take his cloak[a].
translation:
  language: ru
  text: Тот, кто находится в поле, пусть не возвращается за своей верхней одеждой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своей одеждой»; возможно: «своим плащом».'
    reason: Лексема ἱμάτιον может обозначать одежду вообще, верхнюю одежду или плащ.
lexical_decisions:
- source_word: ὁ ἐν τῷ ἀγρῷ
  choice: тот, кто будет в поле
  rationale: Субстантивированное сочетание обозначает любого человека, находящегося в поле. Такая передача сохраняет единственное число и обобщающий смысл, не ограничивая речь мужчинами.
- source_word: μὴ ἐπιστρεψάτω ὀπίσω
  choice: пусть не возвращается
  rationale: Аористный императив с μή выражает запрет, а ὀπίσω вместе с ἐπιστρέφω — возвращение назад. В русском глагол «возвращаться» уже передаёт это значение без избыточного «назад».
- source_word: ἆραι
  choice: взять
  rationale: Инфинитив выражает цель предполагаемого возвращения; «взять» прямо и естественно передаёт αἴρω в данном контексте.
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: свою верхнюю одежду
  rationale: ἱμάτιον обычно обозначает верхнее одеяние. Возвратное «свою» естественно соотносит одежду с действующим лицом и передаёт αὐτοῦ.
theological_decisions:
- issue: Обобщающее значение субстантивированного артикля мужского рода
  choice: тот, кто будет в поле
  alternative: находящийся в поле; мужчина в поле
  rationale: Грамматический мужской род здесь имеет обобщающее значение. Выбранная формулировка не сужает круг адресатов до мужчин и сохраняет индивидуальную направленность предупреждения.
translation_notes:
  register: Современный литературный русский язык; срочность запрета сохранена конструкцией «пусть не возвращается». Будущее «будет в поле» естественно в русском контексте предстоящих событий и не меняет временной отнесённости греческой именной конструкции.
