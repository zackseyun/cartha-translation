source:
  edition: SBLGNT
  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/019.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a].
translation:
  language: ru
  text: Горе же беременным и кормящим грудью в те дни!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ
  choice: горе
  rationale: Сохраняет сильное пророческое восклицание, выражающее бедствие и скорбь; естественно для библейского, но понятного современного русского языка.
- source_word: δὲ
  choice: же
  rationale: Передаёт мягкий переход от предшествующего наставления, не усиливая его до резкого противопоставления.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: беременным
  rationale: Естественно передаёт греческую идиому ἐν γαστρὶ ἔχω («быть беременной») и сохраняет субстантивированную форму без ненужного добавления существительного.
- source_word: ταῖς θηλαζούσαις
  choice: кормящим грудью
  rationale: Точно и естественно передаёт действие θηλάζω; подразумеваемый ребёнок не уточняется, как и в греческом тексте.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: в те дни
  rationale: Прямое и идиоматичное временное выражение в современном русском языке.
theological_decisions:
- issue: Референт субстантивированных причастий женского рода
  choice: Передать как «беременным и кормящим грудью», без добавления слова «женщинам».
  alternative: «беременным женщинам и женщинам, кормящим грудью»
  rationale: Греческие формы женского рода однозначно указывают на женщин, однако русские субстантивированные прилагательное и причастие выражают это естественно и без добавления отсутствующего существительного. В центре остаётся их особенно уязвимое положение в дни бедствия.
translation_notes:
  register: 'Современный литературный русский язык с достоинством и краткостью оригинала. Порядок слов сохраняет переходное «же», а конечный восклицательный знак передаёт силу οὐαί. Стих не нуждается в примечании: вариант с явным словом «женщинам» является стилистическим развёртыванием, а не существенной смысловой альтернативой.'
