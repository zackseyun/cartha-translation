  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔγνωσαν ἕως ἦλθεν ὁ κατακλυσμὸς καὶ ἦρεν ἅπαντας, οὕτως ἔσται ⸀καὶ ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/039.yaml
  text: And they did not know until the flood came and swept them all away; so also will be the coming of the Son of Man.
translation:
  language: ru
  text: И они не знали, пока не пришёл потоп и не унёс их всех; так же будет и с пришествием Сына Человеческого.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: ничего не поняли
  rationale: В контексте речь не о полном отсутствии сведений, а о том, что люди не осознали происходящего и грядущего суда; естественная русская передача сохраняет смысл греческого выражения.
- source_word: ἦρεν ἅπαντας
  choice: унёс всех
  rationale: ἦρεν буквально допускает значение «взял/унёс»; в сочетании с потопом «унёс всех» звучит естественно и не добавляет образа «смёл», которого нет в самом глаголе.
- source_word: παρουσία
  choice: пришествие
  rationale: Устоявшийся и точный новозаветный термин для прибытия или явления Сына Человеческого.
- source_word: υἱοῦ τοῦ ἀνθρώπου
  choice: Сына Человеческого
  rationale: Сохраняется традиционная титульная форма, узнаваемая русским читателем и соответствующая греческому тексту.
theological_decisions:
- issue: Характер незнания людей перед потопом
  choice: ничего не поняли
  alternative: не знали
  rationale: Выбор передаёт отсутствие осознания без утверждения, будто у людей вовсе не было предупреждения; при этом текст не уточняет причины их состояния.
- issue: Сопоставление потопа с пришествием Сына Человеческого
  choice: так будет и пришествие
  alternative: также будет пришествие
  rationale: 'Сохранена частица καί: пришествие уподобляется внезапному наступлению потопа, без добавочного толкования о том, какой именно аспект сравнения является главным.'
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и понятная формулировка. Пунктуация сохраняет две связанные части сравнения.
