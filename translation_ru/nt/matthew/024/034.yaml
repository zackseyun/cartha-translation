  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα ταῦτα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/034.yaml
  text: Truly I tell you that this generation will certainly not pass away until all these things happen[a].
translation:
  language: ru
  text: 'Истинно говорю вам: это поколение ни в коем случае не пройдёт, пока всё это не произойдёт[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «этот народ» или «этот род». Греческое слово может пониматься шире, однако здесь наиболее прямая передача — «поколение».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Истинно
  rationale: В формуле ἀμὴν λέγω ὑμῖν слово выражает торжественное заверение; «истинно» естественно и достойно передаёт эту силу по-русски.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямая и естественная передача обращения Иисуса, сохраняющая форму настоящего времени.
- source_word: ὅτι
  choice: двоеточие
  rationale: Греческий союз вводит содержание высказывания; в современном русском после формулы «говорю вам» это естественно выражается двоеточием без отдельного слова «что».
- source_word: οὐ μὴ παρέλθῃ
  choice: не пройдёт
  rationale: В сочетании с категорическим контекстом русская форма будущего времени передаёт решительное отрицание; усиление также поддерживается торжественной вводной формулой.
- source_word: ἡ γενεὰ αὕτη
  choice: это поколение
  rationale: «Поколение» — наиболее прямое контекстуальное соответствие γενεά; оно сохраняет эсхатологическую напряжённость фразы и не навязывает спорного толкования.
- source_word: ἕως ἂν
  choice: пока
  rationale: 'В данном отрицательном предложении «пока» естественно обозначает будущий предел: поколение не пройдёт до наступления названных событий.'
- source_word: πάντα ταῦτα
  choice: всё это
  rationale: Естественная русская передача греческого среднего множественного числа, относящегося ко всей совокупности перечисленных событий.
- source_word: γένηται
  choice: не произойдёт
  rationale: В контексте событий γίνομαι означает «происходить»; форма будущего времени естественно согласуется с русской конструкцией после «пока».
theological_decisions:
- issue: Значение выражения ἡ γενεὰ αὕτη в эсхатологической речи
  choice: Передать как «это поколение» без истолковывающего расширения.
  alternative: «этот народ» или «этот род»
  rationale: Основной вариант непосредственно передаёт обычное значение γενεά и сохраняет спорность того, к кому именно относится выражение, не внося в текст определённую эсхатологическую схему.
translation_notes:
  register: Современный литературный русский язык; торжественная формула сохранена без архаизации. Порядок слов «это поколение не пройдёт» звучит естественно и ясно, а двоеточие после вводной формулы соответствует русской письменной норме.
