    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς γὰρ
  choice: Ведь как
  rationale: «Ведь» передаёт пояснительную силу γάρ, а «как» сохраняет сравнительное значение ὡς и связь с предыдущим стихом.
- source_word: ἦσαν ... τρώγοντες καὶ πίνοντες
  choice: люди ели и пили
  rationale: Перифрастическая конструкция описывает продолжавшиеся обычные действия. Слово «люди» естественно выражает подразумеваемый субъект во множественном числе, не сужая его значения.
- source_word: ἐν ταῖς ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ
  choice: в те дни перед потопом
  rationale: Естественная современная временная формулировка; «потоп» сохраняет узнаваемую связь с повествованием о Ное.
- source_word: γαμοῦντες καὶ γαμίζοντες
  choice: женились и выдавали замуж
  rationale: 'Сохранено различие двух греческих глаголов: вступление в брак и выдача другого человека замуж. Формулировка передаёт исторический брачный уклад без дополнительной нравственной оценки.'
- source_word: ἄχρι ἧς ἡμέρας
  choice: вплоть до того дня, когда
  rationale: Ясно обозначает предел продолжавшихся действий и естественно вводит решающее событие.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: Ной вошёл в ковчег
  rationale: Прямой и традиционно узнаваемый перевод; «ковчег» сохраняет межтекстовую связь с книгой Бытия.
theological_decisions:
- issue: Следует ли представить перечисленные занятия как греховное излишество или как обычную жизнь перед внезапным судом
  choice: Действия переданы нейтрально как обычные занятия людей
  alternative: Добавить оттенок невоздержанности или нравственной беспечности
  rationale: Сами греческие причастия не содержат явной отрицательной оценки. В контексте подчёркнута продолжающаяся повседневная жизнь перед внезапным событием, поэтому дополнительное осуждение не внесено.
- issue: Направленность значения γαμίζοντες
  choice: выдавали замуж
  alternative: были выдаваемы замуж; женили и выдавали замуж
  rationale: Активная форма наиболее непосредственно допускает каузативное значение «отдавать в брак». При этом возможная интерпретация как вступления в устроенный другими брак отмечена в сноске, чтобы не устранять лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Перечень намеренно звучит нейтрально и ритмично. Запятая в конце сохранена, поскольку стих синтаксически продолжается в Мф. 24:39.
