  text: καὶ τότε σκανδαλισθήσονται πολλοὶ καὶ ἀλλήλους παραδώσουσιν καὶ μισήσουσιν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/010.yaml
  text: And then many will fall away[b][a], and they will betray one another and hate one another.
translation:
  language: ru
  text: И тогда многие отпадут[a], и будут предавать друг друга[b] и ненавидеть друг друга.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «преткнутся», «будут введены в соблазн» или «возмутятся».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будут выдавать друг друга».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: тогда
  rationale: Прямо и естественно передаёт временную последовательность в речи Иисуса.
- source_word: σκανδαλισθήσονται
  choice: отпадут
  rationale: В контексте гонений глагол указывает на серьёзное отступление под давлением, а не просто на мимолётную обиду; при этом сноска сохраняет более буквальные возможные оттенки.
- source_word: πολλοὶ
  choice: многие
  rationale: Субстантивированное прилагательное прямо и естественно передаётся словом «многие».
- source_word: ἀλλήλους
  choice: друг друга
  rationale: Сохраняет взаимный характер обоих действий и звучит естественно по-русски.
- source_word: παραδώσουσιν
  choice: будут предавать
  rationale: В контексте вражды и преследования передаёт вероломный характер передачи другого человека в руки преследователей; более буквальный вариант дан в сноске.
- source_word: μισήσουσιν
  choice: будут ненавидеть
  rationale: Прямо передаёт будущее время и значение активной враждебности.
- source_word: καὶ τότε ... καὶ ... καὶ ...
  choice: И тогда ... и ... и ...
  rationale: Повтор союзов сохраняет связь с предшествующей речью и нарастающий ритм греческой фразы.
theological_decisions:
- issue: Значение σκανδαλισθήσονται в контексте эсхатологических гонений
  choice: отпадут
  alternative: преткнутся; соблазнятся; возмутятся
  rationale: «Отпадут» сохраняет серьёзность описанного отступления, но не уточняет сверх текста, от чего именно или в каком догматическом смысле отпадут. Сноска отражает образность и неоднозначность греческого глагола.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным и ритмически последовательным построением. Слово «отпадут» слегка возвышенное, но понятное и уместное в библейском контексте; подлинная широта значения пояснена в сноске.
