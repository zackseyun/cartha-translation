  text: ἐγερθήσεται γὰρ ἔθνος ἐπὶ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, καὶ ἔσονται ⸀λιμοὶ καὶ σεισμοὶ κατὰ τόπους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/007.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom[b], and there will be famines and earthquakes in various places.
translation:
  language: ru
  text: Ведь восстанет народ против народа и царство против царства, и будут голод и землетрясения в разных местах[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «местами»; греческий оборот имеет распределительный смысл — в различных местах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: восстанет
  rationale: Форма будущего времени в сочетании с ἐπί передаёт начало враждебного выступления; «восстанет против» естественно по-русски и не привносит указания на того, кто якобы побуждает к действию.
- source_word: γὰρ
  choice: ведь
  rationale: Частица поясняет предшествующее высказывание; «ведь» сохраняет связь с контекстом и звучит естественнее отдельного «ибо» в современном литературном русском.
- source_word: ἔθνος
  choice: народ
  rationale: Здесь обозначает крупную этнополитическую общность. «Народ» сохраняет коллективный смысл, не ограничивая его современным государством и не придавая значения «язычники».
- source_word: ἐπὶ ἔθνος
  choice: против народа
  rationale: ἐπί с винительным падежом в данном враждебном сочетании означает направленность против кого-либо.
- source_word: βασιλεία
  choice: царство
  rationale: В параллели с «народом» слово обозначает политическое владение или государство под царской властью; «царство» сохраняет исторический и апокалиптический регистр.
- source_word: ἔσονται
  choice: будут
  rationale: Экзистенциальное употребление εἰμί естественно передаётся русским «будут».
- source_word: λιμοὶ
  choice: голод
  rationale: Греческое множественное число обозначает случаи тяжёлой нехватки пищи; русское собирательное «голод» в перечислении звучит естественно и не ослабляет смысла.
- source_word: σεισμοὶ
  choice: землетрясения
  rationale: В данном контексте σεισμός означает землетрясение; множественное число сохранено.
- source_word: κατὰ τόπους
  choice: в разных местах
  rationale: 'Оборот имеет распределительное значение: события происходят в различных местах, а не в одном определённом месте.'
theological_decisions:
- issue: Объём значения ἔθνος в эсхатологическом высказывании о столкновениях
  choice: народ
  alternative: нация
  rationale: «Народ» лучше сохраняет широкий этнополитический смысл греческого слова и параллелизм с «царством», не навязывая современного понятия национального государства.
- issue: Залоговая сила ἐγερθήσεται
  choice: восстанет против
  alternative: будет поднят против
  rationale: В данном обороте форма описывает возникновение враждебного действия. Перевод не превращает её в явный божественный пассив и не добавляет не названного в тексте деятеля.
- issue: Число существительного λιμοί
  choice: голод
  alternative: случаи голода
  rationale: Русское «голод» обычно употребляется собирательно для подобных бедствий. Такой перевод не утверждает ни одного глобального голода, ни специально разделённых событий.
translation_notes:
  register: Современный литературный русский с сохранением торжественной краткости и параллелизма исходного высказывания. «Ведь» поддерживает пояснительную связь с контекстом; «восстанет народ против народа и царство против царства» сохраняет ритм греческой конструкции.
