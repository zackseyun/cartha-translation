  text: διὰ τοῦτο καὶ ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ⸂οὐ δοκεῖτε ὥρᾳ⸃ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/044.yaml
  text: For this reason[a], you also must be ready, because the Son of Man is coming at an hour you do not expect.
translation:
  language: ru
  text: Поэтому и вы будьте готовы, потому что Сын Человеческий придёт в час, когда вы этого не ожидаете.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в час, которого вы не предполагаете». Греческий глагол может означать «думать», «полагать» или, по смыслу контекста, «ожидать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Оборот указывает на предыдущее наставление и выражает вывод; «поэтому» естественно и ясно передаёт эту связь.
- source_word: καὶ ὑμεῖς
  choice: и вы
  rationale: Сочетание καί с явным местоимением подчёркивает, что призыв относится также к ученикам; «и вы» сохраняет это включающее ударение.
- source_word: γίνεσθε ἕτοιμοι
  choice: будьте готовы
  rationale: Настоящее повелительное наклонение призывает пребывать в состоянии готовности. По-русски «будьте готовы» звучит естественно и не сужает смысл до однократного приготовления.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит основание повеления, поэтому причинное «потому что» здесь яснее, чем книжное «ибо».
- source_word: ᾗ οὐ δοκεῖτε ὥρᾳ
  choice: в час, когда вы этого не ожидаете
  rationale: Дательный оборот имеет временное значение. В данном предупреждении δοκεῖτε естественно передаётся как «ожидаете», хотя буквально глагол может означать «думаете» или «полагаете».
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшийся буквальный перевод титула сохраняет его ветхозаветные ассоциации и христологическую значимость без поясняющего перефразирования.
- source_word: ἔρχεται
  choice: придёт
  rationale: Греческое настоящее здесь относится к будущему событию. Русское настоящее «приходит» в этой конструкции звучало бы неестественно, тогда как «придёт» ясно передаёт будущую направленность.
theological_decisions:
- issue: Передача христологического титула ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  alternative: Человеческий Сын / Человек
  rationale: Традиционный буквальный вариант сохраняет форму титула, его вероятную связь с Дан 7 и богословскую многозначность, не подменяя её толкованием.
- issue: Временная форма ἔρχεται
  choice: придёт
  alternative: приходит
  rationale: Хотя греческий текст использует настоящее время с живой, вероятно футуральной функцией, русский контекст требует будущего времени; это не меняет утверждения о грядущем пришествии.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Синтаксис сохранён близким к греческому, но временное настоящее ἔρχεται передано естественным русским будущим временем. Маркер сноски помещён непосредственно после выражения, к которому относится лексическая альтернатива.
