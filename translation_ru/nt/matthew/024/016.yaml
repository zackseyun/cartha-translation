lexical_decisions:
- source_word: τότε
  choice: тогда
  rationale: Краткое и естественное обозначение следующего момента в последовательности событий.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: те, кто будет в Иудее
  rationale: Субстантивированное предложное сочетание обозначает людей, находящихся в Иудее; будущее время по-русски естественно в контексте предстоящих событий.
- source_word: Ἰουδαίᾳ
  choice: Иудее
  rationale: Общепринятое русское название историко-географической области.
- source_word: φευγέτωσαν
  choice: пусть бегут
  rationale: Третье лицо множественного числа настоящего императива; русская конструкция с «пусть» прямо и естественно передаёт повеление, сохраняя его настоятельность.
- source_word: ἐπὶ τὰ ὄρη
  choice: в горы
  rationale: При глаголе движения ἐπί с винительным указывает направление; «в горы» — естественное русское выражение, не ослабляющее ὄρη до «холмов».
theological_decisions:
- issue: Сила повеления в эсхатологическом предупреждении
  choice: 'Прямое повеление: «пусть бегут»'
  alternative: «должны бежать»
  rationale: Форма сохраняет грамматическое повеление и срочность наставления, не превращая его в отвлечённое утверждение о необходимости и не добавляя эсхатологического толкования.
