  to: Кто же тот верный и благоразумный раб[a], которого господин[b] поставил над домашними слугами, чтобы давать им пищу в положенное время?
  rationale: 'Исправлены две небольшие, но безопасные смысловые неточности: οἰκετεία уточнена как «домашние слуги», а ἐν καιρῷ — как «в положенное время». Начальное «Кто же» естественно передаёт риторико-выводную функцию ἄρα. Сноски и их привязки сохранены.'
