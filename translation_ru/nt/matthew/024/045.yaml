source:
  edition: SBLGNT
  text: Τίς ἄρα ἐστὶν ὁ πιστὸς δοῦλος καὶ φρόνιμος ὃν κατέστησεν ὁ ⸀κύριος ἐπὶ τῆς ⸀οἰκετείας αὐτοῦ τοῦ ⸀δοῦναι αὐτοῖς τὴν τροφὴν ἐν καιρῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/045.yaml
  text: Who then is the faithful and wise slave[b][a], whom the master has appointed over his household to give them their food at the proper time?
translation:
  language: ru
  text: Кто же тот верный и благоразумный раб[a], которого господин[b] поставил над домашними слугами, чтобы давать им пищу в положенное время?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуга». Греческое слово обозначает человека, находящегося во власти господина; здесь «раб» полнее сохраняет силу этого образа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Господь». В непосредственном образе домашнего уклада греческое слово переведено как «господин».'
    reason: alternative_reading
lexical_decisions:
- source_word: Τίς ἄρα
  choice: Итак, кто
  rationale: Передаёт вопросительное τίς и выводно-продолжительную силу ἄρα естественным современным русским оборотом.
- source_word: πιστὸς
  choice: верный
  rationale: Сохраняет смысл надёжности и преданности при исполнении поручения.
- source_word: δοῦλος
  choice: раб
  rationale: В образе господина и подвластного ему человека слово «раб» точнее сохраняет сильный социальный смысл δοῦλος; более мягкий вариант отмечен в сноске.
- source_word: φρόνιμος
  choice: благоразумный
  rationale: Передаёт практическую мудрость, рассудительность и умение поступать сообразно обстоятельствам.
- source_word: κατέστησεν
  choice: поставил
  rationale: Естественно выражает назначение на ответственное положение и делегирование полномочий.
- source_word: κύριος
  choice: господин
  rationale: В непосредственном контексте домашнего уклада обозначает господина раба; возможное титульное прочтение сохранено в сноске.
- source_word: οἰκετείας
  choice: домашними
  rationale: Греческое слово обозначает домашних, то есть людей, принадлежащих к дому, а не просто хозяйство как имущество.
- source_word: τοῦ δοῦναι
  choice: чтобы давать
  rationale: 'Ясно передаёт целевое значение артиклевого инфинитива: именно для этого раб поставлен над домашними.'
- source_word: τροφὴν
  choice: пищу
  rationale: Точно и без неоправданного уточнения передаёт значение еды или пропитания.
- source_word: ἐν καιρῷ
  choice: вовремя
  rationale: Естественно выражает предоставление пищи в надлежащее, подходящее время.
theological_decisions:
- issue: Передача κύριος в бытовом образе господина и раба
  choice: господин
  alternative: Господь
  rationale: На поверхностном уровне притчи речь идёт о господине дома. Перевод «господин» сохраняет социальный образ, не устраняя возможной более широкой отсылки к Господу, которая указана в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис вопроса сохранён, но сделан естественным для русского; лексика образа не смягчает историческое отношение господина и раба.
