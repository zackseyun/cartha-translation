  text: ἔσται γὰρ τότε θλῖψις μεγάλη οἵα οὐ γέγονεν ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν οὐδ’ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/021.yaml
  text: For then there will be great tribulation[a], such as has not happened from the beginning of the world until now, and never will happen again.
translation:
  language: ru
  text: Ибо тогда будет великая скорбь[a], какой не было от начала мира доныне и никогда не будет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великое бедствие» или «великое страдание». Греческое слово может обозначать тяжёлое бедствие, страдание, притеснение или сильное давление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ τότε
  choice: Ибо тогда
  rationale: «Ибо» передаёт пояснительную связь γάρ с предшествующим предупреждением, а «тогда» — временное указание τότε.
- source_word: ἔσται
  choice: будет
  rationale: В сочетании с подлежащим θλῖψις естественно передаётся русской конструкцией «будет великая скорбь».
- source_word: θλῖψις μεγάλη
  choice: великая скорбь
  rationale: θλῖψις обозначает тяжёлое бедствие, страдание, притеснение или состояние крайней тесноты. «Великая скорбь» сохраняет силу выражения и его библейско-эсхатологический оттенок, оставаясь понятной современному читателю.
- source_word: οἵα
  choice: какой
  rationale: Относительное местоимение вводит качественное сравнение и подчёркивает беспримерность описываемого бедствия.
- source_word: οὐ γέγονεν
  choice: не было
  rationale: Перфект γίνομαι здесь описывает то, чего до настоящего момента никогда не бывало; по-русски «не было» естественно и точно в сочетании со «скорбью».
- source_word: ἀπ’ ἀρχῆς κόσμου
  choice: от начала мира
  rationale: κόσμος непосредственно означает «мир»; оборот сохраняет исходную временную формулировку без пояснительного расширения «творения».
- source_word: ἕως τοῦ νῦν
  choice: доныне
  rationale: Краткий литературный эквивалент временного выражения «до настоящего времени».
- source_word: οὐδ’ οὐ μὴ γένηται
  choice: и уже никогда не будет
  rationale: οὐ μή с аористом сослагательного наклонения выражает усиленное отрицание будущего. «Уже никогда» передаёт как категоричность, так и неповторимость сравнительно с описанным событием.
theological_decisions:
- issue: Передача эсхатологически значимого θλῖψις
  choice: великая скорбь
  alternative: великое бедствие; великое страдание
  rationale: Традиционное и понятное выражение сохраняет библейские созвучия и тяжесть исходного слова, но само по себе не закрепляет конкретную конфессиональную схему толкования.
- issue: Категоричность заключительного отрицания
  choice: и уже никогда не будет
  alternative: и не будет; и впредь не случится
  rationale: Формулировка отражает усиленное οὐ μή и сохраняет абсолютный характер высказывания, не уточняя природу или хронологию события сверх греческого текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Ибо» и «доныне» слегка возвышенны, но общеупотребительны и обеспечивают краткость. Синтаксис естественен для русского и сохраняет пояснительную связь, сравнение и усиленное отрицание оригинала.
