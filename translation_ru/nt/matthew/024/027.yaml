  yaml_path: translation/nt/matthew/024/027.yaml
  text: For just as the lightning comes from the east and is seen as far as the west[a], so will the coming of the Son of Man be.
translation:
  language: ru
  text: Ведь как молния появляется на востоке и видна до самого запада, таково будет пришествие[a] Сына Человеческого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «присутствие». Греческое слово παρουσία может означать «присутствие» или «прибытие», но здесь по контексту речь идёт о будущем пришествии Сына Человеческого.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Ведь как
  rationale: «Ведь» естественно передаёт пояснительное γάρ, а «как» вводит сравнение, соответствующее ὥσπερ.
- source_word: ἡ ἀστραπή
  choice: молния
  rationale: Обычное и точное обозначение молнии как природного явления в данном сравнении.
- source_word: ἐξέρχεται ἀπὸ ἀνατολῶν
  choice: вспыхивает на востоке
  rationale: Буквально речь идёт о том, что молния «выходит с востока», однако такое сочетание неестественно по-русски. «Вспыхивает на востоке» ясно передаёт возникновение молнии в восточной части неба, сохраняя исходную пространственную картину.
- source_word: φαίνεται ἕως δυσμῶν
  choice: видна до самого запада
  rationale: Передаёт пассивное значение φαίνεται и протяжённость, выраженную ἕως, подчёркивая видимость от одного края неба до другого.
- source_word: οὕτως ἔσται
  choice: так будет и
  rationale: Сохраняет будущую форму и вторую часть сопоставления; частица «и» делает русскую сравнительную конструкцию естественной.
- source_word: παρουσία
  choice: пришествие
  rationale: В данном эсхатологическом контексте слово обозначает будущее прибытие или явление Сына Человеческого. «Пришествие» — ясный и укоренённый русский эквивалент, а возможное значение «присутствие» отмечено в сноске.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Сына Человеческого
  rationale: Сохраняет традиционное титульное выражение и его связь с ветхозаветным образом, не подменяя его толкованием.
theological_decisions:
- issue: Передача παρουσία в эсхатологическом изречении
  choice: пришествие
  alternative: присутствие; прибытие
  rationale: Сравнение с открыто видимой молнией указывает здесь на будущее явление Сына Человеческого. «Пришествие» передаёт событийный смысл, не вводя узкой эсхатологической схемы; более широкая лексическая возможность «присутствие» сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формулировка остаётся понятной без специальной богословской подготовки; титул «Сын Человеческий» и термин «пришествие» сохранены как укоренённые библейские выражения.
