id: MAT.24.29
reference: Matthew 24:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Εὐθέως δὲ μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς, καὶ οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ, καὶ αἱ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/029.yaml
  text: But immediately after the tribulation of those days[a], the sun will be darkened, and the moon will not give its light, and the stars will fall from heaven[b], and the powers of the heavens will be shaken.
translation:
  language: ru
  text: Но сразу после скорби тех дней солнце померкнет, и луна не даст своего света, и звёзды упадут с неба[a], и силы небес[b] поколеблются.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с небосвода».'
    reason: Лексема οὐρανός здесь может обозначать как небо в возвышенном смысле, так и видимый небосвод.
  - marker: b
    text: Выражение «силы небес» может относиться к космическим силам, небесным телам или небесным властям; греческая формулировка сохраняет широкое значение.
    reason: Сноска сохраняет смысловую неоднозначность αἱ δυνάμεις τῶν οὐρανῶν и не навязывает единственного толкования.
lexical_decisions:
- source_word: Εὐθέως δὲ
  choice: Но сразу
  rationale: «Сразу» ясно передаёт временную непосредственность Εὐθέως, а «но» отмечает переход с оттенком противопоставления, выраженным δὲ.
- source_word: μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων
  choice: после скорби тех дней
  rationale: Формулировка сохраняет связь родительного оборота с θλῖψις и передаёт тяжёлое бедствие словом «скорбь», привычным для возвышенной библейской речи и понятным современному читателю.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: солнце померкнет
  rationale: Естественная русская формулировка точно передаёт наступление тьмы; буквальное пассивное «будет затемнено» звучало бы тяжеловесно и могло бы излишне выдвинуть на первый план внешнего деятеля.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: луна не даст своего света
  rationale: Сохраняется исходный образ луны, не дающей собственного света, без сведения выражения к простому «не будет светить».
- source_word: οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ
  choice: звёзды упадут с неба
  rationale: «Упадут» прямо передаёт будущее действие, а «с неба» является естественным русским соответствием пространственного значения οὐρανός в данной фразе.
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: силы небес
  rationale: Относительно буквальное выражение сохраняет широту δύναμεις и множественное τῶν οὐρανῶν, не отождествляя силы исключительно с небесными существами, светилами или безличными космическими силами.
- source_word: σαλευθήσονται
  choice: поколеблются
  rationale: Передаёт сильное потрясение или приведение в движение и сохраняет торжественный пророческий регистр.
theological_decisions:
- issue: Характер космических знамений в апокалиптической речи
  choice: Сохранить космические образы без поясняющего истолкования.
  alternative: Представить их либо как исключительно буквальные астрономические события, либо как исключительно символическое описание политических и судебных потрясений.
  rationale: Греческий текст не разрешает эту пророческо-апокалиптическую напряжённость; перевод не должен навязывать одну эсхатологическую систему.
- issue: Значение выражения «силы небес»
  choice: Сохранить широкое и неоднозначное выражение.
  alternative: Уточнить его как небесных существ, небесные тела или космические силы.
  rationale: δύναμεις допускает несколько соотносимых значений, а контекст сам по себе не требует выбрать одно из них.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксический параллелизм и повтор союза «и» сохранены как важная черта исходного текста. Формы «померкнет» и «поколеблются» естественны для русского языка, понятны широкому читателю и не снижают достоинства речи.
