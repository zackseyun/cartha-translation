  text: But the one who endures to the end will be saved[a][b].
translation:
  language: ru
  text: Но кто выстоит до конца, тот будет спасён[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до самого конца».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будет избавлен». Греческая форма может быть переведена как «будет спасён» или «будет избавлен»; контекст не требует ограничивать смысл одним из этих значений.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт мягкое противопоставление предшествующим словам об отступлении и охлаждении любви.
- source_word: ὁ ... ὑπομείνας
  choice: кто выстоит
  rationale: Субстантивированное причастие обозначает человека, который стойко переносит испытания; относительная конструкция естественна для современного русского языка.
- source_word: ὑπομείνας (ὑπομένω)
  choice: выстоит
  rationale: Передаёт стойкость и продолжение верности под давлением, не придавая выражению специального конфессионального оттенка.
- source_word: εἰς τέλος
  choice: до конца
  rationale: Кратко и естественно обозначает продолжение вплоть до конечного предела; возможный вариант «до самого конца» отмечен в сноске.
- source_word: οὗτος
  choice: тот
  rationale: Коррелятивная конструкция «кто..., тот...» сохраняет указательное и резюмирующее ударение греческого οὗτος без неестественного буквализма.
- source_word: σωθήσεται
  choice: будет спасён
  rationale: Сохраняет широкий смысл σῴζω — спасение или избавление — и не сужает его заранее до одного вида спасения.
theological_decisions:
- issue: Смысл σωθήσεται в эсхатологическом контексте стойкости
  choice: будет спасён
  alternative: будет избавлен
  rationale: Формулировка не уточняет, идёт ли речь исключительно об окончательном эсхатологическом спасении, об избавлении в испытаниях или о том и другом; неоднозначность исходного текста сохранена.
translation_notes:
  register: Современный литературный русский язык; ясная и торжественная, но не архаичная формулировка. Конструкция «кто..., тот...» естественно сохраняет эмфазу οὗτος.
