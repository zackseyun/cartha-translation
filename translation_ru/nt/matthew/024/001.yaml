- from: Выйдя из храма[a], Иисус направился прочь. К нему подошли ученики, чтобы показать ему здания храма.
  to: Иисус вышел из храма[a] и уходил, когда к нему подошли его ученики, чтобы показать ему храмовые здания.
  rationale: Редакция заменяет совершенный оборот «направился прочь» формой «уходил», чтобы отразить имперфект ἐπορεύετο, и восстанавливает явно выраженное в греческом «его» при слове «ученики». Сноска корректно объясняет широкое значение ἱερόν и сохраняет различие с внутренним святилищем без богословского истолкования.
