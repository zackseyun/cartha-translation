  terminology: «Храм» в основном тексте уместен для ἱερόν при наличии поясняющей сноски. «Храмовые здания» ясно передаёт τὰς οἰκοδομὰς τοῦ ἱεροῦ и не ограничивает значение внутренним святилищем.
