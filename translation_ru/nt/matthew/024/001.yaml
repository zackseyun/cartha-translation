  text: Καὶ ἐξελθὼν ὁ Ἰησοῦς ⸂ἀπὸ τοῦ ἱεροῦ ἐπορεύετο⸃, καὶ προσῆλθον οἱ μαθηταὶ αὐτοῦ ἐπιδεῖξαι αὐτῷ τὰς οἰκοδομὰς τοῦ ἱεροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/001.yaml
  text: And Jesus went out from the temple and was going away[a], and his disciples came to show him the buildings of the temple.
translation:
  language: ru
  text: Иисус вышел из храма[a] и уходил, когда к нему подошли его ученики, чтобы показать ему храмовые здания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово ἱερόν означает весь храмовый комплекс с его дворами и постройками, а не только внутреннее святилище.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: выйдя
  rationale: 'Аористное причастие обозначает действие, предшествующее основному: Иисус сначала вышел, а затем направился прочь. Русское деепричастие естественно передаёт эту связь.'
- source_word: ἱεροῦ
  choice: из храма
  rationale: Ἱερόν обозначает весь храмовый комплекс, а не только внутреннее святилище. В основном тексте употреблено привычное и ясное «храм», а уточнение вынесено в сноску.
- source_word: ἐπορεύετο
  choice: направился прочь
  rationale: Имперфект передаёт движение Иисуса от храма. «Направился прочь» естественно по-русски выражает удаление, не сводя два последовательных действия — выход и дальнейший путь — к одному.
- source_word: προσῆλθον
  choice: подошли
  rationale: В данном пространственном контексте «подошли» точно и естественно передаёт приближение учеников к Иисусу.
- source_word: ἐπιδεῖξαι
  choice: чтобы показать
  rationale: Инфинитив выражает цель, поэтому конструкция с «чтобы» ясно передаёт синтаксическую связь.
- source_word: οἰκοδομὰς
  choice: здания
  rationale: Здесь слово обозначает построенные сооружения храмового комплекса; «здания» — прямой и понятный эквивалент.
- source_word: τοῦ ἱεροῦ
  choice: храма
  rationale: Родительный падеж указывает, что здания относятся к храмовому комплексу. Повтор слова «храм» сохраняет формулировку и акцент греческого текста.
theological_decisions:
- issue: Передача различия между ἱερόν и ναός
  choice: храм
  alternative: храмовый комплекс / территория храма
  rationale: В стихе употреблено ἱερόν — весь храмовый комплекс, а не только внутреннее святилище, для которого обычно служит ναός. В основном тексте сохранено традиционное и естественное «храм», а значимое лексическое уточнение дано в сноске без внесения конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достойный повествовательный стиль. Местоимения, относящиеся к Иисусу, набраны со строчной буквы в соответствии с нейтральной современной орфографической практикой.
