  text: καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ὑποκριτῶν θήσει· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/051.yaml
  text: and will cut him in two and assign his place with the hypocrites[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: ru
  text: и рассечёт его надвое[a], и определит ему долю с лицемерами[b]. Там будет плач и скрежет зубов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, передавая смысл менее буквально: «сурово накажет его». Греческий глагол буквально означает «рассечь надвое».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «положит его долю вместе с лицемерами»; то есть назначит ему их участь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διχοτομήσει
  choice: рассечёт его надвое
  rationale: Сохраняет прямое и сильное значение греческого глагола — «разрезать, рассечь надвое», не подменяя образ общим указанием на суровое наказание.
- source_word: μέρος
  choice: долю
  rationale: Передаёт буквальное значение «часть, доля, удел» и в данном контексте допускает естественное понимание назначенной участи, не сводя её только к месту.
- source_word: ὑποκριτῶν
  choice: лицемерами
  rationale: Обычный русский эквивалент, сохраняющий характерную для Евангелия от Матфея тему внешней праведности и внутренней ложности.
- source_word: ἐκεῖ
  choice: там
  rationale: Кратко и естественно указывает на только что названную участь среди лицемеров.
- source_word: κλαυθμὸς
  choice: плач
  rationale: Точно и последовательно передаёт устойчивую формулу Матфея.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: скрежет зубов
  rationale: Устоявшийся, яркий и точный русский эквивалент повторяющегося выражения Матфея.
theological_decisions:
- issue: Следует ли смягчать διχοτομήσει, передавая его как общее указание на суровое наказание
  choice: 'Сохранить конкретный образ: «рассечёт его надвое»'
  alternative: «сурово накажет его»
  rationale: Прямое значение глагола конкретно и образно; следующий оборот уже описывает назначенную виновному участь. Буквальная передача сохраняет силу предупреждения, не навязывая толкования природы наказания.
- issue: Как передать τὸ μέρος αὐτοῦ ... θήσει
  choice: «определит ему долю с лицемерами»
  alternative: «определит ему место среди лицемеров»
  rationale: «Доля» сохраняет многозначность μέρος — часть, удел или участь — и судебный оттенок назначения, не уточняя сверх текста, идёт ли речь прежде всего о месте или судьбе.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сильный конкретный образ исходного текста сохранён; традиционные выражения «лицемеры», «плач» и «скрежет зубов» поддерживают межтекстовую последовательность в Евангелии от Матфея.
