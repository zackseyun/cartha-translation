  text: καὶ διὰ τὸ πληθυνθῆναι τὴν ἀνομίαν ψυγήσεται ἡ ἀγάπη τῶν πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/012.yaml
  text: And because lawlessness will be multiplied[b][a], the love of many will grow cold.
translation:
  language: ru
  text: И из-за того, что беззаконие умножится[a], любовь многих охладеет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за умножения беззакония»; возможно также: «из-за роста беззакония».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «любовь многих станет холодной».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ πληθυνθῆναι
  choice: оттого, что … умножится
  rationale: Оборот διά с субстантивированным инфинитивом выражает причину. Будущее по контексту и глагольная форма сохранены естественным русским придаточным предложением.
- source_word: ἀνομίαν
  choice: беззаконие
  rationale: Слово обозначает пренебрежение законом или его нарушение, особенно Божьего закона. «Беззаконие» точно, понятно и сохраняет богословскую прозрачность термина.
- source_word: ψυγήσεται
  choice: охладеет
  rationale: Форма передаёт метафору утраты сердечного тепла. «Охладеет» — естественный и dignified русский эквивалент без излишне буквального пассива.
- source_word: ἀγάπη
  choice: любовь
  rationale: Прямой и общепринятый эквивалент, сохраняющий широту значения без уточнения характера или адресата любви.
- source_word: τῶν πολλῶν
  choice: многих
  rationale: Передаёт широкую, но неопределённую группу и не превращает выражение в статистическое «большинство».
theological_decisions:
- issue: К кому относятся слова «любовь многих»
  choice: 'Оставить группу неопределённой: «любовь многих».'
  alternative: «Любовь верующих» или «любовь большинства людей».
  rationale: Греческое τῶν πολλῶν прямо не уточняет, имеются ли в виду ученики, люди вообще или смешанная группа; перевод сохраняет эту богословскую неопределённость.
translation_notes:
  register: Современный литературный русский язык; формулировка звучит естественно и торжественно, сохраняя причинную связь, метафору охлаждения и неопределённый охват выражения τῶν πολλῶν.
