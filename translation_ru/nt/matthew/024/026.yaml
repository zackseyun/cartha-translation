review_pass:
  verdict: approve
  source_fidelity: Текст точно передаёт условно-следственную связь ἐὰν οὖν, неопределённое «вам скажут», два параллельных сообщения с ἰδού, а также два запрета. «В пустыне» адекватно покрывает ἐρήμῳ; «во внутренних комнатах» передаёт ταμείοις без неоправданного усиления до тайных помещений или кладовых. Не выраженный объект в «не верьте» сохраняет отсутствие объекта у πιστεύσητε.
  naturalness: Формулировка естественна для современного литературного русского с библейски достойным, но не архаичным регистром. Тире после прямой речи и точка с запятой ясно оформляют две параллельные ситуации. Русское настоящее «Он в...» не нуждается в связке.
  terminology: «Пустыня» и «внутренние комнаты» уместны и последовательны. Местоимение «Он» корректно восполняет подразумеваемое подлежащее, не добавляя в основной текст титул «Мессия» или имя. Прописная буква соответствует контекстуальному русскому библейскому употреблению и не меняет смысла.
