id: MAT.24.26
reference: Matthew 24:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐὰν οὖν εἴπωσιν ὑμῖν· Ἰδοὺ ἐν τῇ ἐρήμῳ ἐστίν, μὴ ἐξέλθητε· Ἰδοὺ ἐν τοῖς ταμείοις, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/026.yaml
  text: Therefore[a], if they say to you, ‘Look, he is in the wilderness,’ do not go out; ‘Look[c][b], he is in the inner rooms,’ do not believe it.
translation:
  language: ru
  text: 'Итак, если вам скажут: «Вот, Он в пустыне», — не выходите; «Вот, Он во внутренних комнатах», — не верьте.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Итак, если
  rationale: οὖν связывает предостережение с предыдущими словами как вывод, а ἐὰν вводит условную ситуацию; сочетание естественно передаёт обе функции.
- source_word: εἴπωσιν ὑμῖν
  choice: вам скажут
  rationale: Форма третьего лица множественного числа имеет неопределённый смысл и не указывает на конкретную группу.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Современный и естественный указательно-побудительный эквивалент, сохраняющий непосредственность ἰδού без архаизации.
- source_word: ἐν τῇ ἐρήμῳ
  choice: в пустыне
  rationale: ἔρημος обозначает пустынную, безлюдную местность; «в пустыне» — привычный и достаточно широкий библейский эквивалент.
- source_word: ἐστίν
  choice: Он
  rationale: Русская именная конструкция местонахождения в настоящем времени не требует глагола-связки. Местоимение восполняет подразумеваемое из контекста подлежащее, не добавляя титула.
- source_word: μὴ ἐξέλθητε
  choice: не выходите
  rationale: Запрет с μή и аористом сослагательного наклонения передан прямой отрицательной формой повелительного наклонения; глагол сохраняет значение движения наружу.
- source_word: ἐν τοῖς ταμείοις
  choice: во внутренних комнатах
  rationale: ταμεῖον может обозначать внутреннюю, отдельную или кладовую комнату. Основной вариант передаёт внутреннее и закрытое пространство, не усиливая значение до «тайных покоев».
- source_word: μὴ πιστεύσητε
  choice: не верьте
  rationale: В русском языке объект веры может естественно оставаться невыраженным и пониматься как только что приведённое утверждение; это не вынуждает выбирать между «этому» и «им».
theological_decisions:
- issue: Подразумеваемое подлежащее ἐστίν
  choice: Передано местоимением «Он» без добавления имени или титула.
  alternative: «Мессия там»; «Он там».
  rationale: Контекст указывает на заявленное местонахождение Иисуса/Мессии, однако в самой фразе титул отсутствует. Местоимение необходимо для естественного русского синтаксиса, а добавление титула чрезмерно уточнило бы текст.
- issue: Объект μὴ πιστεύσητε
  choice: 'Оставлен невыраженным: «не верьте».'
  alternative: «не верьте этому»; «не верьте им».
  rationale: Греческий текст не называет объекта. Русская конструкция позволяет сохранить эту неопределённость, не решая, относится ли запрет прежде всего к сообщению или к сообщающим.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизмов. Сохранены две параллельные реплики без добавления отсутствующего в греческом союза «или»; точка с запятой делает их структуру ясной. Прописное «Он» служит традиционно понятным указанием на контекстуального референта, не вводя в текст дополнительного титула.
