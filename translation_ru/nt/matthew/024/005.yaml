source:
  edition: SBLGNT
  text: πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες· Ἐγώ εἰμι ὁ χριστός, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/005.yaml
  text: For many will come in my name[a], saying, ‘I am the Messiah,’ and they will lead many astray.
translation:
  language: ru
  text: 'Ведь многие придут под именем Моим[a] и будут говорить: «Я — Мессия», — и многих введут в заблуждение.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во имя Моё». Греческое выражение может указывать на выступление от имени Иисуса, с притязанием на Его авторитет или имя.'
    reason: Сохранение смысловой широты выражения ἐπὶ τῷ ὀνόματί μου.
lexical_decisions:
- source_word: πολλοὶ
  choice: многие
  rationale: Естественная и точная передача количественного прилагательного в данном контексте.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующим предостережением и звучит естественно в современном русском.
- source_word: ἐλεύσονται
  choice: придут
  rationale: Обычная русская передача будущей формы ἔρχομαι.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: под Моим именем
  rationale: Сохраняет возможный смысл выступления от имени Иисуса или присвоения Его имени; русское «во имя Моё» могло бы сильнее подразумевать подлинное поручение.
- source_word: λέγοντες
  choice: будут говорить
  rationale: Передаёт сопутствующее действие причастия без добавления оценочного оттенка слова «утверждать».
- source_word: Ἐγώ εἰμι ὁ χριστός
  choice: Я — Мессия
  rationale: Здесь χριστός употреблено как титул мессианского претендента; «Мессия» ясно передаёт титулярный смысл.
- source_word: πλανήσουσιν
  choice: введут в заблуждение
  rationale: Передаёт каузативный смысл πλανάω — заставить заблуждаться, обмануть или сбить с верного пути.
- source_word: πολλοὺς
  choice: многих
  rationale: Лаконичная и естественная передача субстантивированного объекта без ненужного добавления «людей».
theological_decisions:
- issue: Передача титула Χριστός в ложном мессианском заявлении
  choice: Мессия
  alternative: Христос
  rationale: 'Артикль и контекст указывают на титул: претенденты заявляют, что каждый из них — ожидаемый Мессия, а не употребляют «Христос» как имя.'
- issue: Смысл выражения ἐπὶ τῷ ὀνόματί μου
  choice: под Моим именем
  alternative: во имя Моё
  rationale: Греческое выражение допускает оттенки притязания на имя, авторитет или идентичность Иисуса. Основной вариант не представляет ложных претендентов как действительно посланных Им.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно торжественный. Прописное «Моим» следует принятой русской библейской традиции при местоименной отсылке к Иисусу. Пунктуация оформляет прямую речь естественно и не устраняет повтор «многие… многих», присутствующий в греческом тексте.
