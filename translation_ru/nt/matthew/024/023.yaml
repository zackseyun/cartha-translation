  text: τότε ἐάν τις ὑμῖν εἴπῃ· Ἰδοὺ ὧδε ὁ χριστός, ἤ· Ὧδε, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/023.yaml
  text: Then if anyone says to you[a], ‘Look, here is the Messiah!’ or[b], ‘There he is!’ do not believe it.
translation:
  language: ru
  text: 'Тогда, если кто-нибудь скажет вам: «Смотрите, Мессия здесь!» — или: «Он здесь!» — не верьте.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Сохраняет временную связь с предшествующей частью эсхатологической речи и естественно звучит по-русски.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: если кто-нибудь скажет вам
  rationale: Передаёт условную конструкцию и неопределённый субъект без сужения круга возможных говорящих.
- source_word: Ἰδοὺ
  choice: Смотрите
  rationale: Современный и естественный призыв обратить внимание; сохраняет указательную силу греческого слова без архаичного оттенка.
- source_word: ὧδε
  choice: здесь
  rationale: Прямой русский эквивалент наречия места в первой реплике.
- source_word: ὁ χριστός
  choice: Мессия
  rationale: 'Артикль и контекст ложных заявлений об идентичности и местонахождении указывают на титульное значение: ожидаемый Помазанник.'
- source_word: ἤ· Ὧδε
  choice: 'или: «Он там!»'
  rationale: Греческая реплика эллиптична и буквально вновь указывает на место. По-русски подразумеваемые подлежащее и связка восстановлены для ясности, а «там» естественно выражает противопоставленное указание со стороны передающего речь рассказчика.
- source_word: μὴ πιστεύσητε
  choice: не верьте
  rationale: Естественно передаёт запрет; дополнение в русском не требуется, поскольку объект веры ясен из приведённых утверждений.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Здесь слово функционирует как титул ожидаемого избавителя, а не как имя-подобное обозначение Иисуса. «Мессия» ясно сохраняет этот смысл, не добавляя конфессионального толкования.
- issue: Референт запрета «не верьте»
  choice: Не уточнять объект
  alternative: не верьте этому / не верьте ему
  rationale: 'Греческий текст не выражает дополнения. Русское «не верьте» естественно сохраняет открытость: запрет относится к прозвучавшему заявлению, не навязывая исключительно личный или пропозициональный объект.'
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Эллипсис второй реплики слегка развёрнут ради естественности, но без изменения смысла; богословская напряжённость предупреждения сохранена.
