  source_fidelity: Текст точно передаёт греческое καὶ πολλοὶ ψευδοπροφῆται ἐγερθήσονται καὶ πλανήσουσιν πολλούς. «Лжепророки» соответствует ψευδοπροφῆται; «восстанут» в данном контексте естественно передаёт их появление/выступление, не навязывая представления о воскресении; «многих введут в заблуждение» передаёт широкий каузативный смысл πλανήσουσιν.
  naturalness: Фраза звучит естественно и литературно по-русски, сохраняя сжатый, торжественный библейский регистр. Сочетание «многих введут в заблуждение» современно и ясно.
