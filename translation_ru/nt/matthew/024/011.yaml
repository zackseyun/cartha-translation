id: MAT.24.11
reference: Matthew 24:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ψευδοπροφῆται ἐγερθήσονται καὶ πλανήσουσιν πολλούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/011.yaml
  text: And many false prophets will arise and will lead many astray[a][b].
translation:
  language: ru
  text: И многие лжепророки восстанут и многих введут в заблуждение[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обманут многих».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будут воздвигнуты».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: многие
  rationale: Прямой и естественный количественный эквивалент, сохраняющий неопределённый широкий охват греческого слова.
- source_word: ψευδοπροφῆται
  choice: лжепророки
  rationale: Устоявшееся русское библейское обозначение людей, которые ложно выдают себя за пророков или пророчествуют ложь.
- source_word: ἐγερθήσονται
  choice: восстанут
  rationale: Передаёт контекстуальное значение появления и выступления таких людей, не сводя форму к буквальному физическому вставанию; возможное более явное пассивное прочтение отмечено в сноске.
- source_word: πλανήσουσιν
  choice: введут в заблуждение
  rationale: Естественно передаёт каузативный смысл πλανάω — заставить ошибаться, сбить с верного пути — без неоправданного уточнения характера заблуждения.
- source_word: πολλούς
  choice: многих
  rationale: Прямой субстантивированный объект глагола; в русском языке слово естественно обозначает многих людей без добавления существительного.
- source_word: καὶ ... καὶ
  choice: И ... и
  rationale: Сохраняет последовательное соединение двух будущих действий и накопительный характер предупреждения.
theological_decisions:
- issue: Характер заблуждения, выраженного глаголом πλανήσουσιν
  choice: Общее предупреждение о том, что лжепророки введут многих в заблуждение.
  alternative: Уточнить заблуждение как исключительно вероучительное, нравственное или эсхатологическое.
  rationale: Греческий глагол имеет широкий смысл и сам по себе не определяет ни способ, ни конкретную область заблуждения; перевод сохраняет эту широту.
- issue: Залог и оттенок значения ἐγερθήσονται
  choice: Основной текст передаёт контекстуальный смысл «восстанут», то есть появятся и выступят.
  alternative: «Будут воздвигнуты».
  rationale: Форма грамматически пассивна, однако в данном контексте может функционировать идиоматически со значением возникновения или появления. Сноска сохраняет возможность более формального пассивного прочтения, не утверждая, кем они будут воздвигнуты.
translation_notes:
  register: Современный литературный русский с достоинством библейского изложения. «Лжепророки» сохраняет узнаваемую библейскую лексику, а выражение «введут в заблуждение» ясно для современного читателя и не сужает смысл до одной разновидности обмана.
