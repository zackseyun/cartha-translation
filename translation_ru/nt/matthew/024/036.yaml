lexical_decisions:
- source_word: Περὶ δὲ
  choice: Но о
  rationale: Предлог περί с родительным падежом вводит тему («о»), а δέ обозначает переход с лёгким оттенком противопоставления; сочетание «Но о» естественно передаёт обе функции.
- source_word: τῆς ἡμέρας ἐκείνης καὶ ὥρας
  choice: том дне и часе
  rationale: Оба существительных зависят от περί, а указательное местоимение относится к сочетанию в целом. Формулировка сохраняет конкретность указанного времени и звучит естественно по-русски.
- source_word: οὐδεὶς οἶδεν
  choice: никто не знает
  rationale: οὐδείς выражает всеобщее отрицание, а οἶδα здесь имеет настоящее значение «знать».
- source_word: οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν
  choice: ни небесные ангелы
  rationale: οὐδέ присоединяет к общему отрицанию ещё одну группу с усилительным смыслом. «Небесные ангелы» естественно передаёт родительный оборот τῶν οὐρανῶν.
- source_word: οὐδὲ ὁ υἱός
  choice: ни Сын
  rationale: Фраза однородна предыдущему отрицательному элементу и прямо включает Сына в число не знающих. Определённый артикль указывает на признанный титул, поэтому употреблена прописная буква.
- source_word: εἰ μὴ
  choice: только
  rationale: После отрицательного утверждения εἰ μή вводит исключение. В перестроенной ради естественности русской фразе «только» ясно выражает исключительность знания Отца.
- source_word: ὁ πατὴρ μόνος
  choice: знает только Отец
  rationale: μόνος ограничивает знание одним Отцом. Повтор глагола делает русское предложение ясным и естественным, не меняя смысла греческой конструкции.
theological_decisions:
- issue: Христологический смысл слов «ни Сын»
  choice: Сохранить слова «ни Сын» в основном тексте без смягчения и поясняющей вставки.
  alternative: Опустить эти слова вслед за частью рукописной традиции или перефразировать их, ослабив утверждение о незнании Сына.
  rationale: Текст SBLGNT содержит οὐδὲ ὁ υἱός. Перевод сохраняет присущую тексту богословскую напряжённость и не разрешает её путём опущения либо толковательного пересказа.
translation_notes:
  register: Современный литературный русский язык с ясной, dignified синтаксической структурой. Точка с запятой позволяет естественно передать исключительную конструкцию εἰ μὴ ὁ πατὴρ μόνος без двусмысленного оборота «кроме одного Отца».
