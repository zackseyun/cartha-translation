  text: τότε ⸂δύο ἔσονται⸃ ἐν τῷ ἀγρῷ, ⸀εἷς παραλαμβάνεται καὶ ⸁εἷς ἀφίεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/040.yaml
  text: Then two men will be in the field; one is taken and one is left.
translation:
  language: ru
  text: 'Тогда двое мужчин будут в поле: одного возьмут[a], а другого оставят.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возьмут с собой». Сам по себе этот глагол не уточняет, берут ли человека для спасения или для суда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Кратко и естественно передаёт временную связь с предшествующим эсхатологическим контекстом.
- source_word: δύο ἔσονται
  choice: двое мужчин будут
  rationale: Собирательное числительное «двое» естественно для лиц мужского пола; мужской род последующих εἷς… εἷς и параллель с женщинами в следующем стихе указывают на двух мужчин, хотя существительное в греческом не выражено.
- source_word: ἐν τῷ ἀγρῷ
  choice: в поле
  rationale: Прямая и естественная передача обстоятельства места без добавочной образности.
- source_word: εἷς … εἷς
  choice: одного … другого
  rationale: В русском противопоставление «одного… другого» естественнее буквального повтора «один… один» и ясно сохраняет соотношение двух лиц.
- source_word: παραλαμβάνεται
  choice: возьмут
  rationale: Неопределённо-личная активная конструкция естественно передаёт греческий пассив; глагол не уточняет сам по себе, берут ли человека для спасения или для суда.
- source_word: ἀφίεται
  choice: оставят
  rationale: Нейтрально передаёт пассивное значение в данном контексте; варианты «оставят позади» и «покинут» добавляли бы нежелательные смысловые оттенки.
theological_decisions:
- issue: Означает ли παραλαμβάνεται взятие для спасения или для суда
  choice: Сохранить нейтральное «возьмут» и пояснить неоднозначность в сноске
  alternative: «заберут на суд» или «возьмут с собой в безопасное место»
  rationale: Ближайший контекст допускает разные толкования, а сам глагол не разрешает вопрос; перевод не должен предрешать эсхатологическую интерпретацию.
- issue: Следует ли явно обозначить мужской пол двух лиц
  choice: «двое мужчин»
  alternative: «двое»
  rationale: Хотя существительное «мужчины» в греческом не выражено, формы εἷς… εἷς стоят в мужском роде, а следующий стих даёт параллельный пример с женщинами; явное обозначение сохраняет различие исходного текста.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и торжественно-нейтральный. Формы будущего времени естественно передают сценическое настоящее греческого текста в контексте будущих событий.
