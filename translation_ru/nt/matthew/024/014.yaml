  text: καὶ κηρυχθήσεται τοῦτο τὸ εὐαγγέλιον τῆς βασιλείας ἐν ὅλῃ τῇ οἰκουμένῃ εἰς μαρτύριον πᾶσιν τοῖς ἔθνεσιν, καὶ τότε ἥξει τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/014.yaml
  text: And this good news of the kingdom will be proclaimed throughout the whole world as a testimony to all the nations[c][b][a], and then the end will come.
translation:
  language: ru
  text: И эта радостная весть о Царстве[a] будет провозглашена по всему миру[b] как свидетельство всем народам[c], и тогда придёт конец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Евангелие Царства».'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «по всему обитаемому миру».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «всем племенам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθήσεται
  choice: будет провозглашена
  rationale: Будущее страдательное от κηρύσσω передаёт публичное, открытое возвещение. «Будет провозглашена» сохраняет эту силу и не сужает смысл до церковной проповеди.
- source_word: εὐαγγέλιον
  choice: Радостная весть
  rationale: Основное значение слова — благая, радостная весть. Современное и понятное выражение сохраняет смысл без обязательного обращения к церковному термину «Евангелие».
- source_word: τῆς βασιλείας
  choice: о Царстве
  rationale: Хотя греческий текст буквально допускает «весть Царства», в русском языке естественнее выразить объективный оттенок родительного падежа как содержание вести — «о Царстве». Заглавная буква указывает на Божье Царство, очевидное из контекста Матфея.
- source_word: ἐν ὅλῃ τῇ οἰκουμένῃ
  choice: по всему миру
  rationale: οἰκουμένη обозначает обитаемый мир. «По всему миру» естественно передаёт универсальный охват, не ограничивая выражение Римской империей.
- source_word: εἰς μαρτύριον
  choice: как свидетельство
  rationale: Оборот допускает оттенок цели или результата. «Как свидетельство» сохраняет обе возможности и не уточняет, будет ли оно свидетельством за слушающих или против них.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: для всех народов
  rationale: ἔθνη здесь широко обозначает народы мира, а не обязательно язычников в противопоставлении иудеям. Предлог «для» естественно сочетается со «свидетельством», сохраняя направленность к народам.
- source_word: ἥξει τὸ τέλος
  choice: придёт конец
  rationale: Прямое и естественное соответствие греческому выражению; оно не вводит дополнительной схемы относительно характера или времени конца.
theological_decisions:
- issue: Всеобщий охват οἰκουμένη и ἔθνη в эсхатологическом изречении
  choice: «по всему миру» и «для всех народов»
  alternative: «по всей обитаемой земле» и «для всех племён»
  rationale: Перевод сохраняет заявленный универсальный охват, но не решает спор о точных географических пределах, историческом исполнении или эсхатологическом расписании.
- issue: Связь εὐαγγέλιον с Царством
  choice: «Радостная весть о Царстве»
  alternative: «Евангелие Царства»
  rationale: Выбранная формулировка ясно передаёт содержание вести и остаётся доступной современному читателю, не устраняя библейского понятия Божьего Царства.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизации. «Радостная весть» выбрана вместо менее прозрачного для части читателей церковного термина; традиционный вариант сохранён в сноске. Все маркеры сносок размещены непосредственно после соответствующих выражений.
