- from: И эта Радостная весть о Царстве[a] будет провозглашена по всему миру[b] как свидетельство для всех народов[c], и тогда придёт конец.
  to: И эта радостная весть о Царстве[a] будет провозглашена по всему миру[b] как свидетельство всем народам[c], и тогда придёт конец.
  rationale: 'Исправлена адресная связь «свидетельства» со «всеми народами», уточнена лексическая сноска к οἰκουμένη и нормализовано написание нарицательного выражения. Остальные решения сохранены: «о Царстве» — естественная русская передача генитива содержания; «по всему миру» сохраняет широкий охват без определения его исторических границ; «придёт конец» не добавляет эсхатологической схемы.'
