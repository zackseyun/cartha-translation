  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν προσῆλθον αὐτῷ οἱ μαθηταὶ κατ’ ἰδίαν λέγοντες· Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον τῆς σῆς παρουσίας ⸀καὶ συντελείας τοῦ αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/003.yaml
  text: As he was sitting on the Mount of Olives[a], the disciples came to him privately, saying, “Tell us, when will these things be[b], and what will be the sign of your coming and of the end of the age?”
translation:
  language: ru
  text: 'Когда он сидел на Масличной горе, ученики подошли к нему наедине и спросили: «Скажи нам, когда это произойдёт и какое будет знамение твоего пришествия[a] и конца века[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «присутствия» или «прибытия».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «завершения века (эпохи)»; традиционно: «конца света».'
    reason: alternative_reading
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: Когда он сидел
  rationale: Генитив абсолютный передан естественным временным придаточным; несовершенный вид сохраняет длительный характер действия.
- source_word: ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: на Масличной горе
  rationale: Устоявшееся русское географическое название точно и естественно передаёт греческое выражение.
- source_word: προσῆλθον αὐτῷ
  choice: подошли к нему
  rationale: Передаёт направленное движение к Иисусу и естественно звучит в повествовании.
- source_word: κατ’ ἰδίαν
  choice: наедине
  rationale: Кратко и ясно передаёт разговор отдельно от других.
- source_word: λέγοντες
  choice: и спросили
  rationale: В русском ввод прямой вопрос глаголом «спросили» естественнее буквального «говоря»; вопросительная форма последующей речи сохраняет значение.
- source_word: Εἰπὸν ἡμῖν
  choice: Скажи нам
  rationale: Естественная передача аористного повелительного наклонения без добавления оттенков, отсутствующих в греческом.
- source_word: πότε ταῦτα ἔσται
  choice: когда это произойдёт
  rationale: Идиоматично передаёт будущность ἔσται и указание на ранее сказанное; буквальное «когда это будет» также возможно, но менее точно обозначает событие в данном контексте.
- source_word: σημεῖον
  choice: знамение
  rationale: Устоявшийся и стилистически достойный русский эквивалент в эсхатологическом контексте.
- source_word: παρουσίας
  choice: пришествия
  rationale: В вопросе о будущем событии «пришествие» естественно передаёт значение появления или прибытия, не устраняя возможный буквальный оттенок присутствия, отмеченный в сноске.
- source_word: συντελείας τοῦ αἰῶνος
  choice: конца века
  rationale: Сохраняет различие между αἰών («век», «эпоха») и κόσμος («мир») и не усиливает греческий текст до утверждения о гибели физического мира.
theological_decisions:
- issue: Эсхатологическое значение παρουσία
  choice: пришествие
  alternative: присутствие; прибытие
  rationale: Контекст направленного в будущее вопроса поддерживает «пришествие», однако лексическая широта слова не скрыта и представлена в сноске.
- issue: Значение συντέλεια τοῦ αἰῶνος
  choice: конец века
  alternative: завершение века (эпохи); традиционно — конец света
  rationale: Основной текст следует греческому выражению и не отождествляет αἰών с физическим миром; вариант «завершение» сохраняет оттенок доведения до полноты.
- issue: Связь двух родительных определений после σημεῖον
  choice: одно знамение пришествия и конца века
  alternative: отдельные знамения каждого события
  rationale: Единственное число σημεῖον и согласованные родительные конструкции сохранены без решения вопроса о том, понимаются ли события как полностью совпадающие.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Строчные местоимения в отношении Иисуса соответствуют современной нейтральной орфографической практике. Маркеры сносок поставлены непосредственно после выражений, к которым они относятся; их расположение исправляет очевидное несоответствие между маркерами и текстами сносок в консультационном английском слое.
