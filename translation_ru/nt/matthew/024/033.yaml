  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ⸂πάντα ταῦτα⸃, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/033.yaml
  text: So also you[a], when you see all these things, know that it is near, at the doors.
translation:
  language: ru
  text: 'Так и вы, когда увидите всё это, знайте: близко — у самых дверей.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он близок». В греческом тексте подлежащее прямо не названо.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Так и вы
  rationale: Передаёт сопоставление с примером о смоковнице и сохраняет акцент на учениках без избыточного развёртывания.
- source_word: ὅταν ἴδητε
  choice: когда увидите
  rationale: Естественно передаёт будущее временное значение конструкции ὅταν с аористом сослагательного наклонения; вариант «всякий раз, когда» придал бы нежелательную повторяемость.
- source_word: πάντα ταῦτα
  choice: всё это
  rationale: Естественное современное русское соответствие, охватывающее совокупность названных признаков; буквальное «все эти вещи» здесь тяжеловесно.
- source_word: γινώσκετε
  choice: знайте
  rationale: Сохраняет прямую повелительную силу формы и не добавляет оттенков «поймите» или «распознайте».
- source_word: ἐγγύς ἐστιν
  choice: близко
  rationale: Русская безлично-эллиптическая формулировка позволяет не вводить отсутствующее в греческом тексте подлежащее и тем самым сохраняет неоднозначность.
- source_word: ἐπὶ θύραις
  choice: у самых дверей
  rationale: Сохраняет множественное число θύραις и естественно передаёт идиому предельной близости.
theological_decisions:
- issue: Не выраженное явно подлежащее при ἐγγύς ἐστιν
  choice: 'Оставить подлежащее невыраженным: «близко»'
  alternative: «Он близко» или «это близко»
  rationale: Греческий текст не уточняет, идёт ли речь лично о Сыне Человеческом либо о грядущем событии, суде или завершении. Русская эллиптическая конструкция сохраняет эту подлинную неоднозначность, не разрешая её богословски.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и понятная формулировка. Тире подчёркивает пояснительный образ «у самых дверей», не добавляя нового смыслового субъекта.
