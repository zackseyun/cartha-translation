base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/037.yaml
  text: For just as the days of Noah were[a], so the coming of the Son of Man will be.
translation:
  language: ru
  text: Ведь каковы были дни Ноя, таким будет и пришествие[a] Сына Человеческого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «присутствие». Греческое слово может означать «присутствие» или «прибытие»; в данном контексте оно относится к будущему пришествию Сына Человеческого.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ … οὕτως
  choice: как … так
  rationale: Сохраняет соотносительную конструкцию и ясную связь между днями Ноя и будущим пришествием.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующим высказыванием и естественно звучит в начале русского предложения.
- source_word: αἱ ἡμέραι τοῦ Νῶε
  choice: было во дни Ноя
  rationale: Греческая первая часть сравнения эллиптична; добавление «было» минимально восполняет подразумеваемое сказуемое, а «во дни Ноя» сохраняет dignified biblical register without being obscure.
- source_word: ἔσται
  choice: будет
  rationale: Прямо передаёт будущее время глагола εἰμί, не добавляя толкования.
- source_word: παρουσία
  choice: пришествие
  rationale: В данном эсхатологическом контексте слово обозначает будущее явление или прибытие Сына Человеческого; «пришествие» ясно передаёт событийный смысл и сохраняет значимый библейский термин.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Сына Человеческого
  rationale: Сохраняет устойчивое именование Иисуса и его связь с ветхозаветным образом, не заменяя его толковательным эквивалентом.
theological_decisions:
- issue: Передача παρουσία в эсхатологическом изречении
  choice: пришествие
  alternative: присутствие; прибытие
  rationale: Контекст указывает на будущее пришествие Сына Человеческого, поэтому «пришествие» лучше всего передаёт событийный характер слова. Возможное значение «присутствие» сохранено в примечании, чтобы не скрывать широту греческой лексемы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Оборот «во дни Ноя» выбран как понятный и традиционный; конструкция «как … так» естественно передаёт греческое сопоставление.
