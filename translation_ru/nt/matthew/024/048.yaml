base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/048.yaml
  text: But if that wicked servant says in his heart[b][a], ‘My master is delaying,’
translation:
  language: ru
  text: 'Но если тот злой слуга[a] скажет в своём сердце: «Мой господин[b] задерживается»,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тот злой раб». Греческое слово δοῦλος может означать как слугу, так и раба — в зависимости от контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мой хозяин»; также возможно: «мой господь». Греческое слово κύριος обозначает того, кто обладает властью; здесь оно употреблено в обстановке домашнего хозяйства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Но если
  rationale: Передаёт условный смысл ἐὰν с аористом сослагательного наклонения и лёгкое противопоставление, выраженное δέ.
- source_word: εἴπῃ
  choice: скажет
  rationale: В русском условном предложении совершенный вид естественно передаёт возможное действие, обозначенное аористом сослагательного наклонения.
- source_word: ὁ κακὸς δοῦλος ἐκεῖνος
  choice: тот злой слуга
  rationale: «Злой» естественно выражает нравственную оценку κακός; «слуга» подходит бытовому контексту притчи, а «тот» сохраняет указательное ἐκεῖνος.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: в своём сердце
  rationale: Сохраняет библейскую метафору внутренней мысли; возвратное «своём» нормативно соотносит сердце с подлежащим.
- source_word: Χρονίζει
  choice: задерживается
  rationale: Передаёт продолжающуюся или воспринимаемую задержку без добавления причины и без уточнения срока.
- source_word: μου ὁ κύριος
  choice: мой господин
  rationale: В русском «господин» естественно обозначает хозяина слуги и одновременно сохраняет лексическую связь κύριος с обращением «Господь», не навязывая её в основном тексте.
theological_decisions:
- issue: Передача κύριος в бытовом плане притчи при возможном более широком мессианском отнесении
  choice: господин
  alternative: хозяин; Господь
  rationale: «Господин» соответствует непосредственным отношениям слуги и его начальствующего в доме, но не устраняет возможный богословский отзвук притчи. Строчное написание отражает речь персонажа на сюжетном уровне.
- issue: Передача δοῦλος
  choice: слуга
  alternative: раб
  rationale: В данном контексте на первом плане порученная домашняя служба и поведение персонажа. При этом «раб» остаётся подлинной лексической возможностью и отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Сохранена метафора «в сердце», а порядок слов сделан естественным для русского. Все варианты в сносках отмечены в основном тексте.
