source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/004.yaml
  text: And Jesus answered them[a], “See that no one leads you astray.”
translation:
  language: ru
  text: 'Иисус ответил им: «Смотрите, чтобы никто не ввёл вас в заблуждение[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не обманул вас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν αὐτοῖς
  choice: ответил им
  rationale: Сочетание причастия ἀποκριθείς с εἶπεν представляет собой обычную повествовательную формулу ответа. Естественное русское «ответил им» передаёт и ответный характер реплики, и акт речи, не воспроизводя тяжеловесное «ответив, сказал им».
- source_word: Βλέπετε
  choice: Смотрите
  rationale: Императив настоящего времени здесь призывает быть настороже. «Смотрите» естественно вводит придаточное с «чтобы» и сохраняет образность греческого глагола βλέπω; варианты «берегитесь» и «будьте осторожны» были бы несколько более истолковывающими.
- source_word: μή τις
  choice: чтобы никто не
  rationale: μή с конъюнктивом после императива выражает предотвращение нежелательного действия. Русская конструкция «смотрите, чтобы никто не…» ясно и естественно передаёт эту функцию.
- source_word: πλανήσῃ
  choice: не ввёл вас в заблуждение
  rationale: Глагол πλανάω может обозначать обман, введение в заблуждение и увод с верного пути. Выражение «ввести в заблуждение» сохраняет широкую смысловую направленность предупреждения и хорошо сочетается с конструкцией «смотрите, чтобы».
theological_decisions:
- issue: Характер предупреждения в πλανήσῃ
  choice: общее предупреждение против введения в заблуждение и увода с верного пути
  alternative: 'более узкое указание на обман: «обманул вас»'
  rationale: В контексте предстоящих ложных притязаний речь может идти не только об интеллектуальном обмане, но и об увлечении за ложным руководством. «Ввёл вас в заблуждение» не сводит смысл лишь к усвоению неверной информации и сохраняет широту греческого слова.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная повествовательная формулировка. «Смотрите» сохраняет прямоту предупреждения, а «ввёл вас в заблуждение» звучит естественно без конфессионально окрашенной терминологии.
