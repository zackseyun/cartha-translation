lexical_decisions:
- source_word: ὅπου ἐὰν ᾖ
  choice: Где бы ни было
  rationale: Сочетание ὅπου с ἐάν и сослагательным ᾖ имеет неопределённо-относительное значение; оборот «где бы ни было» естественно передаёт смысл «где бы ни находилось».
- source_word: πτῶμα
  choice: мёртвое тело
  rationale: πτῶμα обозначает павшее, безжизненное тело. «Мёртвое тело» точно и естественно в современном русском и не ограничивает образ трупом животного, как могло бы слово «падаль».
- source_word: συναχθήσονται
  choice: соберутся
  rationale: Хотя форма грамматически пассивная, в данном контексте она естественно передаётся возвратно-непереходным глаголом «соберутся», без навязывания внешнего действующего лица.
- source_word: ἀετοί
  choice: стервятники
  rationale: ἀετός обычно означает орла, но может обозначать крупных хищных птиц; при мёртвом теле образ птиц-падальщиков делает «стервятники» наиболее ясным контекстуальным соответствием. Буквальная лексическая альтернатива сохранена в сноске.
theological_decisions:
- issue: Толкование образа в изречении
  choice: Передать образ прямо, не определяя, что именно символизируют мёртвое тело и птицы.
  alternative: Истолковать изречение как указание на неизбежный суд, очевидность пришествия Сына Человеческого, разрушение Иерусалима или римские знамёна.
  rationale: Сам греческий текст не называет символического значения образов; перевод должен сохранить смысловую и эсхатологическую напряжённость, не внося определённую схему толкования.
translation_notes:
  register: Современный литературный русский язык; краткая, образная и достойная формулировка. Оборот «где бы ни было» сохраняет неопределённость исходной конструкции, а сноска — реальную лексическую неоднозначность названия птиц.
