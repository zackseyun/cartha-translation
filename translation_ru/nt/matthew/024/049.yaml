lexical_decisions:
- source_word: ἄρξηται τύπτειν
  choice: начнёт бить
  rationale: Сочетание ἄρξηται с инфинитивом передаёт начало действия; «начнёт бить» естественно сохраняет также возможный оттенок неоднократного насилия.
- source_word: τοὺς συνδούλους αὐτοῦ
  choice: своих товарищей-рабов
  rationale: Сύνδουλος буквально обозначает того, кто вместе с другим является рабом одного господина. «Товарищи-рабы» сохраняет общий подчинённый статус и яснее современному читателю, чем редкое «сорабы».
- source_word: ἐσθίῃ δὲ καὶ πίνῃ
  choice: а сам будет есть и пить
  rationale: Настоящие формы сослагательного наклонения в условной конструкции описывают продолжающееся поведение. «А сам» естественно выражает слабое противопоставление δέ между насилием над другими и собственным разгулом, не превращая его в резкий контраст.
- source_word: μετὰ τῶν μεθυόντων
  choice: с пьяницами
  rationale: Субстантивированное причастие обозначает людей, для которых характерно пьянство; «пьяницы» кратко и естественно передаёт этот смысл в литературном русском языке.
theological_decisions:
- issue: Передача слова σύνδουλος, относящегося к группе δοῦλος
  choice: товарищи-рабы
  alternative: товарищи-слуги
  rationale: В образе господского дома существен общий статус полной подчинённости одному господину. Перевод «рабы» сохраняет социальную и нравственную силу метафоры, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с достоинством притчевого предостережения. Союз «а» и местоимение «сам» обеспечивают естественную связь внутри продолжающегося условного периода; конечная запятая сохранена, поскольку стих синтаксически продолжается в Мф 24:50.
