  text: Ὅταν οὖν ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου ⸀ἑστὸς ἐν τόπῳ ἁγίῳ, ὁ ἀναγινώσκων νοείτω,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/015.yaml
  text: So when you see the abomination of desolation spoken of through Daniel the prophet standing in a holy place—let the reader understand—[a][b]
translation:
  language: ru
  text: Итак, когда вы увидите «мерзость запустения»[b], о которой сказано через пророка Даниила, стоящую на святом месте[a] (пусть читающий поймёт),
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «в святом месте». Контекст может вызывать ассоциацию с храмом, однако греческий текст не называет его прямо.'
    reason: alternative_reading
  - marker: b
    text: 'Также возможно: «опустошающая мерзость» или «мерзость, вызывающая запустение»; выражение отсылает к книге Даниила.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Итак, когда
  rationale: Передаёт будущую временную обусловленность ὅταν с сослагательным наклонением и одновременно сохраняет переходно-выводное значение οὖν.
- source_word: ἴδητε
  choice: увидите
  rationale: Прямой и естественный эквивалент формы ὁράω; множественное число сохраняет обращение к слушателям.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: «мерзость запустения»
  rationale: Формально сохраняет греческую конструкцию и узнаваемую отсылку к книге Даниила, не снимая неоднозначности родительного падежа.
- source_word: τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου
  choice: о которой было сказано через пророка Даниила
  rationale: Относительная конструкция естественна по-русски; «через» передаёт διά с родительным как посредничество в пророческой речи.
- source_word: ἑστὸς
  choice: стоящую
  rationale: Прямо передаёт причастие от ἵστημι и грамматически согласуется с русским существительным женского рода «мерзость», не уточняя природу референта.
- source_word: ἐν τόπῳ ἁγίῳ
  choice: на святом месте
  rationale: Русское «на месте» здесь идиоматичнее буквального «в месте»; отсутствие артикля не требует ни неопределённого, ни определённого артикля в русском и потому не вынуждает конкретизировать храм.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: читающий да поймёт
  rationale: Сохраняет краткость, книжно-пророческий регистр и повелительную силу формы νοείτω.
theological_decisions:
- issue: Определённость τόπῳ ἁγίῳ и возможная отсылка к храму
  choice: на святом месте
  alternative: на Святом месте / в святилище
  rationale: Греческая фраза без артикля может обозначать святое место, вероятно вызывая храмовые ассоциации, но сама по себе не требует прямо называть святилище. Основной текст сохраняет эту широту.
- issue: Смысл выражения βδέλυγμα τῆς ἐρημώσεως
  choice: мерзость запустения
  alternative: опустошающая мерзость / мерзость, вызывающая запустение
  rationale: Формальная передача сохраняет связь с Даниилом и не решает однозначно, является ли запустение характеристикой, результатом или связанной с мерзостью реальностью.
- issue: Посредничество в пророческой речи
  choice: сказано через пророка Даниила
  alternative: сказано пророком Даниилом
  rationale: «Через» точнее сохраняет διά и допускает представление о Данииле как посреднике пророческого слова, не добавляя явного субъекта речи.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены традиционно узнаваемое выражение «мерзость запустения» и лаконичная вставка «читающий да поймёт», при этом синтаксис остаётся доступным современному читателю.
