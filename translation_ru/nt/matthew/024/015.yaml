  terminology: «Мерзость запустения» — удачное традиционно узнаваемое соответствие βδέλυγμα τῆς ἐρημώσεως и сохраняет отсылку к Даниилу. «На святом месте» естественно по-русски; не следует превращать его в прямое утверждение о храме. Сноска к этой фразе может отметить вариант «в святом месте» и храмовую ассоциацию без излишней конкретизации.
