- from: Итак, когда увидите «мерзость запустения», о которой было сказано через пророка Даниила, стоящую на святом месте[a], — читающий да поймёт! —[b]
  to: Итак, когда вы увидите «мерзость запустения»[b], о которой сказано через пророка Даниила, стоящую на святом месте[a] (пусть читающий поймёт),
  rationale: Перенесён якорь лексической сноски непосредственно к Даниилову выражению, а вставная ремарка читателю оформлена естественной для современного русского скобочной конструкцией. Сноска о святом месте устранена от повтора основного текста и сохраняет осторожность относительно храмовой интерпретации. Смысл, регистр и исходная неоднозначность не изменены.
