  source_fidelity: 'Основной смысл передан точно: сохранены временно-условное «когда», связь с предыдущей речью («итак»), традиционная Даниилова формула, посредническое «через пророка Даниила», образ «стоящей» и побудительная ремарка читателю. Однако лексическую сноску о «мерзости запустения» следует привязать к самому выражению, а не к заключительной ремарке читателю.'
