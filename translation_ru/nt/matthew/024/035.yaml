  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσεται, οἱ δὲ λόγοι μου οὐ μὴ παρέλθωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/035.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: ru
  text: Небо и земля пройдут, но Мои слова никогда не пройдут.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: небо
  rationale: В сочетании с γῆ обозначает небеса как часть сотворённого мира; естественная русская пара — «небо и земля».
- source_word: ἡ γῆ
  choice: земля
  rationale: В устойчивом космическом сочетании означает землю, а не отдельную страну или сушу.
- source_word: παρελεύσεται
  choice: пройдут
  rationale: Передаёт будущее прекращение нынешнего порядка и сохраняет повтор одного и того же греческого глагола в обеих частях стиха.
- source_word: δὲ
  choice: но
  rationale: Ясно выражает противопоставление преходящего неба и земли непреходящим словам Иисуса.
- source_word: οἱ λόγοι μου
  choice: Мои слова
  rationale: Прямо и естественно передаёт речь и провозглашённое учение Иисуса без неоправданного сужения до отдельных изречений.
- source_word: οὐ μὴ παρέλθωσιν
  choice: ни в коем случае не пройдут
  rationale: Сочетание οὐ μή с аористом сослагательного наклонения выражает усиленное отрицание; выбранная формулировка отчётливо передаёт его силу в современном русском языке.
theological_decisions:
- issue: Сила утверждения Иисуса о непреходящем характере Его слов
  choice: 'Передать как категорическое противопоставление: сотворённый порядок пройдёт, а слова Иисуса ни в коем случае не пройдут.'
  alternative: «Мои слова никогда не пройдут» или более истолковательное указание на их вечность и божественный авторитет.
  rationale: Текст содержит усиленное отрицание и сам по себе делает весомое утверждение о непреложности слов Иисуса. Перевод сохраняет эту силу, не добавляя доктринальных выводов, которых стих прямо не формулирует.
translation_notes:
  register: Современный литературный русский язык, торжественный, но доступный. Заглавная буква в «Мои» следует принятой русской библейской орфографической традиции при прямой речи Иисуса. Повтор «пройдут … не пройдут» намеренно сохраняет лексическую связь греческих форм παρέρχομαι.
