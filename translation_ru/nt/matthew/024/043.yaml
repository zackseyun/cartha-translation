  source_fidelity: 'Перевод точно передаёт условное рассуждение: обращённое к слушателям «Но знайте», нереальное условие («если бы… знал»), указание на ночную стражу, бодрствование и недопущение проникновения в дом. «В какую стражу ночи» корректно раскрывает временное значение ποίᾳ φυλακῇ. «Взломать свой дом» естественно передаёт контекстуальный смысл διορυχθῆναι, а буквальный образ сохранён в сноске.'
