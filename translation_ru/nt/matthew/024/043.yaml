id: MAT.24.43
reference: Matthew 24:43
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐκεῖνο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ φυλακῇ ὁ κλέπτης ἔρχεται, ἐγρηγόρησεν ἂν καὶ οὐκ ἂν εἴασεν διορυχθῆναι τὴν οἰκίαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/043.yaml
  text: 'But know this: if the master of the house had known in what watch the thief was coming[b][a], he would have stayed awake and would not have let his house be broken into.'
translation:
  language: ru
  text: 'Но знайте: если бы хозяин дома знал, в какую стражу ночи[a] придёт вор, он бодрствовал бы и не дал бы взломать свой дом[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ночь делили на отдельные периоды, называвшиеся стражами.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «прокопать» — то есть проникнуть внутрь, проделав пролом в стене или другой части дома.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνο δὲ γινώσκετε
  choice: Но знайте
  rationale: Передаёт переход, обозначенный δέ, и прямое побуждение γινώσκετε; по-русски звучит естественно и сохраняет связь с предшествующим наставлением.
- source_word: ὁ οἰκοδεσπότης
  choice: хозяин дома
  rationale: Точно и понятно передаёт главу или распорядителя дома, не вводя современного юридического оттенка слова «домовладелец».
- source_word: ποίᾳ φυλακῇ
  choice: в какую стражу ночи
  rationale: Сохраняет древнее обозначение части ночи и при этом явно выражает временное значение φυλακή.
- source_word: ὁ κλέπτης ἔρχεται
  choice: придёт вор
  rationale: Настоящее ἔρχεται в косвенном вопросе относится к предполагаемому приходу; русское будущее естественно передаёт этот смысл внутри нереального условия.
- source_word: ἐγρηγόρησεν ἂν
  choice: он бодрствовал бы
  rationale: Сохраняет образ ночного бодрствования и условную модальность конструкции с ἄν.
- source_word: οὐκ ἂν εἴασεν
  choice: не дал бы
  rationale: Краткий и естественный русский эквивалент со значением «не позволил бы, не допустил бы».
- source_word: διορυχθῆναι τὴν οἰκίαν αὐτοῦ
  choice: взломать свой дом
  rationale: Передаёт контекстуальный смысл проникновения в дом с целью кражи; буквальный образ прокапывания стены сохранён в сноске.
theological_decisions:
- issue: Образ хозяина дома
  choice: хозяин дома
  alternative: домовладелец; глава дома
  rationale: Это бытовой образ в сравнении, а не богословский титул. Выбранный вариант сохраняет социально-бытовой смысл без современных правовых ассоциаций.
- issue: Образ проникновения в дом
  choice: взломать свой дом
  alternative: прокопать дом; проломить стену дома
  rationale: Идиоматический перевод ясно сообщает смысл кражи со взломом, тогда как буквальная строительная деталь древнего жилья указана в сноске и не превращена в излишне конкретное толкование основного текста.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет наставительный тон, нереальное условие и ночной образ. «Стража ночи» намеренно оставлена как культурно окрашенное выражение и пояснена в сноске.
