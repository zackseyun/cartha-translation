source:
  edition: SBLGNT
  text: καὶ ἀποστελεῖ τοὺς ἀγγέλους αὐτοῦ μετὰ ⸀σάλπιγγος μεγάλης, καὶ ἐπισυνάξουσιν τοὺς ἐκλεκτοὺς αὐτοῦ ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρων οὐρανῶν ἕως ⸀τῶν ἄκρων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/031.yaml
  text: And he will send out his angels with a loud trumpet[a], and they will gather his chosen ones from the four winds[d][c][b], from one end of the heavens to the other.
translation:
  language: ru
  text: И Он пошлёт Своих ангелов с громким звуком трубы[a], и они соберут Его избранных с четырёх ветров[b] — от одного края небес до другого[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с великой трубой»; возможно также: «под громкий звук трубы».'
    reason: lexical_alternative
  - marker: b
    text: «Четыре ветра» — образное обозначение всех направлений, самых отдалённых мест.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «от краёв небес до их краёв», то есть от одного крайнего предела до другого.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: пошлёт
  rationale: Будущее время глагола ἀποστέλλω передаёт целенаправленное посылание; «пошлёт» естественно и точно звучит по-русски.
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: Своих ангелов
  rationale: В эсхатологическом контексте ἄγγελοι означает небесных ангелов, а не человеческих посланников. Возвратное «Своих» ясно соотносит их с действующим лицом.
- source_word: μετὰ σάλπιγγος μεγάλης
  choice: с громким звуком трубы
  rationale: μετά с родительным обозначает сопровождение, σάλπιγξ — трубу, а μεγάλη допускает смысл величия или силы звучания. Основной вариант естественно выражает слышимый трубный сигнал, а более буквальная форма отмечена в сноске.
- source_word: ἐπισυνάξουσιν
  choice: соберут
  rationale: Глагол означает собрать вместе; по-русски «соберут» уже передаёт это значение без избыточного удвоения.
- source_word: τοὺς ἐκλεκτοὺς αὐτοῦ
  choice: Его избранных
  rationale: «Избранных» непосредственно передаёт ἐκλεκτούς и не уточняет сверх текста основание или богословский механизм избрания.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: с четырёх ветров
  rationale: Сохранён библейский образ четырёх ветров как обозначение всех направлений; его идиоматический смысл пояснён в сноске.
- source_word: ἀπ’ ἄκρων οὐρανῶν ἕως τῶν ἄκρων αὐτῶν
  choice: от одного края небес до другого
  rationale: Естественная русская формулировка передаёт меризм, охватывающий всю протяжённость, и сохраняет множественное число «небес».
theological_decisions:
- issue: Передача ἐκλεκτούς в эсхатологическом контексте
  choice: Его избранных
  alternative: Его избранников
  rationale: Форма «избранных» сохраняет лексический смысл и привычна для библейской речи, не вводя конфессионального толкования о характере избрания.
- issue: Пространственный охват собирания
  choice: с четырёх ветров — от одного края небес до другого
  alternative: со всех сторон света, от края до края
  rationale: Сохранена космическая образность оригинала, а не подставлено более узкое географическое истолкование.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Заглавные буквы в местоимениях «Он», «Своих», «Его» используются как традиционный русский способ указать на Сына Человеческого; тире показывает, что заключительная фраза развивает и поясняет образ четырёх ветров.
