base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/002.yaml
  text: But he answered and said to them[a], “Do you not see all these things? Truly I tell you, not one stone here will be left upon another that will not be thrown down.”
translation:
  language: ru
  text: 'Он же сказал им в ответ: «Разве вы не видите всё это? Истинно говорю вам: не останется здесь камня на камне — всё будет разрушено».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не останется здесь камня на камне, который не будет разрушен». Греческий глагол может обозначать разрушение, снос или разборку сооружения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: сказал им в ответ
  rationale: Естественно передаёт сочетание причастия и личной формы глагола, сохраняя значение ответа без тяжеловесного буквального повтора «ответив, сказал».
- source_word: Οὐ βλέπετε
  choice: Разве вы не видите
  rationale: Риторический вопрос с οὐ ожидает согласия; «разве не видите» ясно и естественно передаёт эту силу.
- source_word: ταῦτα πάντα
  choice: всё это
  rationale: Естественный русский эквивалент среднего множественного числа, указывающего на упомянутые храмовые строения.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Истинно говорю вам
  rationale: Сохраняет торжественную формулу Иисуса и её традиционно узнаваемое, но понятное современному читателю звучание.
- source_word: οὐ μὴ ἀφεθῇ
  choice: не останется
  rationale: Категорическое отрицание οὐ μή передано естественным русским будущим в конструкции «не останется… камня на камне», которая сама подчёркивает полноту разрушения.
- source_word: ὧδε
  choice: здесь
  rationale: Прямо передаёт указание на место — храмовый комплекс в непосредственном контексте.
- source_word: λίθος ἐπὶ λίθον
  choice: камня на камне
  rationale: Устойчивое русское выражение точно передаёт греческий оборот и образ полного разрушения.
- source_word: ὃς οὐ καταλυθήσεται
  choice: всё будет разрушено
  rationale: Местоименная конструкция буквально относится к каждому камню, который будет сброшен или разобран. По-русски итоговая обобщающая фраза избегает неестественного «который не будет разрушен» и ясно сохраняет смысл полной разборки сооружения.
theological_decisions:
- issue: Характер предсказания Иисуса о храме
  choice: Конкретное предсказание полного физического разрушения храмовых строений
  alternative: Преимущественно символическое высказывание о суде или привязка к определённой эсхатологической системе
  rationale: Образ камней и их разрушения имеет прямой архитектурный смысл. Перевод сохраняет его, не добавляя не выраженной в стихе доктринальной схемы.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Традиционная формула «Истинно говорю вам» сохранена как узнаваемая и точная; синтаксис финальной части слегка перестроен ради естественности, а буквальная форма дана в сноске.
