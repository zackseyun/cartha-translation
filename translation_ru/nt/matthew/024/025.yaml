lexical_decisions:
- source_word: ἰδού
  choice: Вот
  rationale: Естественный и достойный русский указательный маркер, привлекающий внимание к сказанному; здесь уместнее буквального «смотрите».
- source_word: προείρηκα
  choice: предупредил заранее
  rationale: Перфект передаёт совершённое заранее сообщение, сохраняющее значение для слушателей; в контексте предостережения естественно русское «предупредил».
- source_word: ὑμῖν
  choice: вас
  rationale: При глаголе «предупредил» адресат естественно оформляется винительным падежом, хотя в греческом стоит дательный при глаголе речи.
