  text: But all these things are the beginning of birth pains[a].
translation:
  language: ru
  text: Но всё это — начало родовых мук[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родовых схваток». Греческое слово обозначает боли при родах и служит здесь образом начальной стадии грядущих бедствий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα … ταῦτα
  choice: всё это
  rationale: Сочетание охватывает все ранее названные события; «всё это» естественно и точно передаёт греческую конструкцию.
- source_word: δὲ
  choice: но
  rationale: Частица обозначает мягкий контраст и переход от перечисления событий к их оценке.
- source_word: ἀρχὴ
  choice: начало
  rationale: Слово указывает на начальную стадию последующего процесса, а не на его завершение.
- source_word: ὠδίνων
  choice: родовых мук
  rationale: Сохраняется буквальный образ мучительных схваток при родах; выражение понятно в современном литературном русском языке.
theological_decisions:
- issue: Метафорический смысл ὠδίνων
  choice: Сохранить образ родовых мук.
  alternative: «страдания», «бедствия» или «родовые схватки»
  rationale: Образ представляет названные потрясения как начало разворачивающегося мучительного процесса. Перевод не сводит метафору к общим бедствиям и не навязывает ей более узкую эсхатологическую схему.
translation_notes:
  register: Современный, лаконичный и достойный русский язык. Тире помогает естественно оформить именную конструкцию; метафора оригинала сохранена.
