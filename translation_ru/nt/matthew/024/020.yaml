lexical_decisions:
- source_word: προσεύχεσθε
  choice: молитесь
  rationale: Настоящее повелительное второго лица множественного числа естественно передаётся русским «молитесь»; возможная длительность действия остаётся подразумеваемой.
- source_word: δὲ
  choice: но
  rationale: Передаёт мягкий контраст с предшествующим предупреждением и сохраняет естественную связь рассуждения.
- source_word: ἵνα μὴ γένηται ἡ φυγὴ ὑμῶν
  choice: чтобы вам не пришлось бежать
  rationale: Естественная современная передача содержания молитвы и событийного значения γένηται; выражение сохраняет смысл вынужденного бегства, не предполагая успешного спасения.
- source_word: χειμῶνος
  choice: зимой
  rationale: Краткая и идиоматичная передача родительного времени.
- source_word: μηδὲ σαββάτῳ
  choice: или в субботу
  rationale: После отрицательной конструкции μηδέ естественно передаётся как «или»; дательный времени σαββάτῳ — как «в субботу». Русский язык не выражает различия между определённым и неопределённым артиклем, поэтому форма естественно допускает как конкретное, так и обобщённое понимание.
theological_decisions:
- issue: Определённость σαββάτῳ
  choice: в субботу
  alternative: в день субботний
  rationale: В греческом существительное употреблено без артикля, однако русский язык грамматически не маркирует это различие. Основной вариант сохраняет смысл без искусственного уточнения; альтернативная формулировка дана в сноске как более традиционная, а не как иное учение.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Конструкция «вам не пришлось бежать» звучит естественнее буквального «ваше бегство не произошло» и сохраняет событийный характер греческого выражения.
