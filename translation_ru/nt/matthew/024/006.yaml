id: MAT.24.6
reference: Matthew 24:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μελλήσετε δὲ ἀκούειν πολέμους καὶ ἀκοὰς πολέμων· ὁρᾶτε, μὴ θροεῖσθε· δεῖ ⸀γὰρ γενέσθαι, ἀλλ’ οὔπω ἐστὶν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/006.yaml
  text: And you are going to hear of wars and reports of wars. See that you are not alarmed[a], for it must happen, but the end is not yet.
translation:
  language: ru
  text: Вам предстоит услышать о войнах и о вестях о войнах[a]. Смотрите, не пугайтесь, потому что это должно произойти, но это ещё не конец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слухах о войнах». Греческое выражение может обозначать вести, сообщения или слухи.'
    reason: Лексическая неоднозначность ἀκοὰς πολέμων.
lexical_decisions:
- source_word: μελλήσετε
  choice: вам предстоит
  rationale: Будущее время μέλλω с инфинитивом передаёт ожидаемое предстоящее событие; этот оборот сохраняет перспективное значение и естественно звучит по-русски.
- source_word: ἀκούειν
  choice: услышать о
  rationale: В данном сочетании речь идёт о получении сведений, а не только о непосредственном восприятии звука.
- source_word: πολέμους
  choice: войнах
  rationale: πόλεμος обычно означает войну, а не отдельную битву или всякий конфликт вообще.
- source_word: ἀκοὰς πολέμων
  choice: вестях о войнах
  rationale: ἀκοή здесь может означать дошедшее известие, сообщение или слух. «Вести» сохраняют широту значения и не предполагают, что сообщение обязательно недостоверно.
- source_word: ὁρᾶτε
  choice: смотрите
  rationale: Императив вводит предостережение; «смотрите» естественно передаёт призыв быть внимательными к следующему запрету.
- source_word: μὴ θροεῖσθε
  choice: не пугайтесь
  rationale: θροέομαι обозначает испуг, тревогу или смятение. Выбранная формулировка ясна современному читателю и передаёт предостережение без усиления до ужаса или паники.
- source_word: δεῖ γὰρ γενέσθαι
  choice: потому что это должно произойти
  rationale: δεῖ выражает необходимость, а γενέσθαι — наступление события. Местоимение «это» естественно отсылает к только что названному, не добавляя более определённого перечня.
- source_word: ἀλλ’ οὔπω ἐστὶν τὸ τέλος
  choice: но это ещё не конец
  rationale: Фраза близко передаёт греческую конструкцию и подчёркивает, что упомянутые события сами по себе ещё не являются концом.
theological_decisions:
- issue: Эсхатологическое значение τὸ τέλος
  choice: конец
  alternative: завершение; окончательное свершение
  rationale: Общее слово «конец» сохраняет широту греческого выражения и не связывает стих с какой-либо конкретной эсхатологической схемой.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанно-достоинственное. Оборот «вам предстоит» сохраняет оттенок ожидаемого будущего, а «вести» не приписывают сообщениям недостоверность.
