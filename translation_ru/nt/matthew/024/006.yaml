  terminology: «Войны» точно передаёт πολέμους; «вести о войнах» удачно сохраняет широту ἀκοαί, не предполагая недостоверности сообщений. «Конец» оставлен широким и не нагружен конфессиональной эсхатологической терминологией. Сноска корректно представляет «слухи» как лексическую альтернативу и её якорь [a] расположен непосредственно после соответствующего выражения.
