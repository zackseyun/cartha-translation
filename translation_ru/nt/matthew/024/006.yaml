  source_fidelity: 'Перевод точно передаёт основные элементы греческого текста: перспективное μελλήσετε («вам предстоит»), получение известий через ἀκούειν, различение между πολέμους и ἀκοὰς πολέμων, предостережение ὁρᾶτε μὴ θροεῖσθε, необходимость δεῖ γενέσθαι и ещё-не-наступление конца. Местоимение «это» в двух последних частях естественно отсылает к названным событиям и не навязывает их более точной интерпретации.'
