  source_fidelity: Черновик в целом верно передаёт запрет спускаться с крыши и цель этого действия. Однако «Кто будет на крыше» сдвигает настоящее причастное обозначение («тот, кто находится на крыше») в будущее, а «то, что в его доме» не передаёт направления/изъятия, выраженного ἐκ («из дома»).
  naturalness: Фраза понятна и литературна, но «Тот, кто на крыше» точнее по времени и столь же естественно. «Вещи из своего дома» яснее выражает, что речь о попытке забрать вещи, и избегает несколько тяжеловесного сочетания «то, что в его доме».
  terminology: «Крыша» — удачный современный эквивалент δῶμα при культурной сноске. «Дом» сохраняет конкретный пространственный смысл οἰκία. Возвратное «своего» естественно соотносит дом с субъектом и не меняет обобщённого мужского единственного числа исходного текста.
