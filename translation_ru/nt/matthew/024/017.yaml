lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: кто будет на крыше
  rationale: Субстантивированное сочетание обозначает человека, находящегося на крыше; по-русски придаточная конструкция звучит естественно и сохраняет обобщённый смысл единственного числа.
- source_word: δώματος
  choice: крыше
  rationale: δώμα здесь означает верхнюю, обычно плоскую и пригодную для использования крышу дома; пояснение культурной реалии вынесено в сноску.
- source_word: μὴ καταβάτω
  choice: пусть не спускается
  rationale: Форма передаёт настоятельное запрещение; конструкция с «пусть не» естественно сохраняет повелительную силу и движение вниз.
- source_word: ἆραι
  choice: взять
  rationale: Инфинитив выражает цель спуска; «взять» прямо передаёт αἴρω без дополнительного толкования.
- source_word: τὰ ἐκ τῆς οἰκίας αὐτοῦ
  choice: то, что в его доме
  rationale: Греческое выражение эллиптически указывает на находящиеся в доме вещи. Русская формулировка ясна и не сужает значение до конкретной категории имущества.
- source_word: οἰκίας
  choice: доме
  rationale: В контексте спуска с крыши имеется в виду физическое строение, поэтому «дом» точнее, чем более эмоционально окрашенные варианты.
- source_word: αὐτοῦ
  choice: его
  rationale: Сохранено мужское местоимение единственного числа, соответствующее грамматической форме и обобщённому представителю в исходном тексте.
theological_decisions:
- issue: Обобщённое мужское единственное число
  choice: Сохранить «его» при обобщённом «кто»
  alternative: «своём» или множественное «их»
  rationale: Исходный текст использует мужское единственное число как обобщённое обозначение человека. «Его» сохраняет эту форму, не придавая ей особого богословского смысла.
translation_notes:
  register: Современный литературный русский язык; краткая и настоятельная формулировка. «Крыша» общеупотребительна, а культурно-архитектурная особенность объяснена в сноске.
