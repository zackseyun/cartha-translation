  text: Let the one on the housetop not go down to take the things out of his house,[a]
translation:
  language: ru
  text: Тот, кто на крыше[a], пусть не спускается, чтобы взять вещи из своего дома.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Речь идёт о плоской крыше дома, которую часто использовали как дополнительное пространство.
