  text: Τότε παραδώσουσιν ὑμᾶς εἰς θλῖψιν καὶ ἀποκτενοῦσιν ὑμᾶς, καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων τῶν ἐθνῶν διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/009.yaml
  text: Then they will hand you over to affliction and kill you[c][b][a], and you will be hated by all the nations because of my name.
translation:
  language: ru
  text: Тогда вас отдадут на страдания[a] и убьют, и все народы[b] будут ненавидеть вас за Моё имя[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на гонения» или «на бедствие». Греческое слово может означать скорбь, притеснение и тяжёлые испытания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все язычники», однако в данном контексте вероятнее имеется в виду совокупность народов.'
    reason: lexical_alternative
  - marker: c
    text: То есть за принадлежность Иисусу и верность Ему — за то, что представляет Его имя.
    reason: lexical_explanation
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Кратко и естественно передаёт временную последовательность в речи Иисуса.
- source_word: παραδώσουσιν ὑμᾶς
  choice: вас отдадут
  rationale: Передаёт вручение людей во власть враждебных сил, не добавляя отсутствующего в контексте оттенка личного предательства.
- source_word: εἰς θλῖψιν
  choice: на мучения
  rationale: В данном контексте обозначает угнетение, страдания и преследование; это естественное русское выражение сохраняет тяжесть смысла, не превращая слово в узкий эсхатологический термин.
- source_word: ἀποκτενοῦσιν ὑμᾶς
  choice: убьют
  rationale: Прямо и без лишней юридической или нравственной конкретизации передаёт значение глагола.
- source_word: ἔσεσθε μισούμενοι
  choice: будут ненавидеть вас
  rationale: Естественная русская активная конструкция точно передаёт греческое перифрастическое будущее пассивного смысла.
- source_word: ὑπὸ πάντων τῶν ἐθνῶν
  choice: все народы
  rationale: Передаёт всеобщий масштаб вражды; в этом контексте значение «народы» вероятнее, чем этнически противопоставленное «язычники».
- source_word: διὰ τὸ ὄνομά μου
  choice: за Моё имя
  rationale: Сохраняет библейский образ имени как обозначения личности Иисуса и верности Ему, не сводя его к пояснительному пересказу.
theological_decisions:
- issue: Значение θλῖψις в эсхатологической речи
  choice: мучения
  alternative: скорбь; гонения; бедствие
  rationale: Выбор охватывает реальные страдания и притеснение учеников, сохраняя серьёзность контекста, но не навязывая слову специальную схему последних времён.
- issue: Значение ἔθνη
  choice: народы
  alternative: язычники
  rationale: Сочетание «все народы» здесь естественно указывает на всемирный масштаб ненависти; более узкое противопоставление иудеев и язычников контекстом не требуется.
- issue: Смысл выражения «за Моё имя»
  choice: сохранён образ имени
  alternative: за верность Мне
  rationale: Буквальный образ богословски содержателен и понятен, а примечание раскрывает его смысл без подмены текста толкованием.
translation_notes:
  register: 'Современный литературный русский язык, ясный и достойный по тону. Синтаксис сделан естественным для русского: греческая пассивная конструкция передана активной без изменения участников действия. Прописная буква в «Моё» следует принятому благоговейному издательскому регистру.'
