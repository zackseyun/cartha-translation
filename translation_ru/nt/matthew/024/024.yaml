  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται, καὶ δώσουσιν σημεῖα μεγάλα καὶ τέρατα ὥστε ⸀πλανῆσαι εἰ δυνατὸν καὶ τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/024.yaml
  text: For false messiahs and false prophets will arise[a], and they will perform great signs and wonders so as to lead astray, if possible[c][b], even the elect.
translation:
  language: ru
  text: Ведь появятся лжемессии[a] и лжепророки и будут совершать великие знамения и чудеса, чтобы, если возможно[c], ввести в заблуждение[b] даже избранных.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лжехристы». В составе греческого слова употреблён титул «Христос»; здесь он передан словом «мессии», поскольку обозначает притязание на мессианский статус, а не имя.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «сбить с пути». Глагол может означать «обмануть», «ввести в заблуждение» или «увести с правильного пути».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «если бы это было возможно». По-гречески сказано просто «если возможно», без явного уточнения богословского следствия.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: появятся
  rationale: В данном контексте форма ἐγείρω идиоматически означает появление людей на исторической сцене; «появятся» естественно по-русски и не создаёт ненужной ассоциации с воскресением.
- source_word: ψευδόχριστοι
  choice: лжемессии
  rationale: Χριστός здесь употреблено как титул, поэтому «мессии» передаёт смысл точнее, чем «христы»; приставка ψευδο- естественно передана элементом «лже-».
- source_word: ψευδοπροφῆται
  choice: лжепророки
  rationale: Прямой и устойчивый русский эквивалент греческого сложного существительного.
- source_word: δώσουσιν
  choice: будут совершать
  rationale: Хотя основное значение δίδωμι — «давать», в сочетании со знамениями и чудесами русский язык требует идиоматического «совершать».
- source_word: σημεῖα μεγάλα
  choice: великие знамения
  rationale: «Знамения» сохраняет указательную и свидетельствующую сторону σημεῖα, не сводя слово просто к чудесам; μεγάλα передано как «великие».
- source_word: τέρατα
  choice: чудеса
  rationale: В сочетании «знамения и чудеса» слово обозначает поразительные сверхъестественные явления и звучит естественно в современном литературном русском.
- source_word: ὥστε πλανῆσαι
  choice: чтобы… ввести в заблуждение
  rationale: Конструкция с ὥστε и инфинитивом допускает оттенок цели или предполагаемого результата; русское «чтобы» естественно передаёт направленность действий, не уточняя её сверх текста.
- source_word: πλανῆσαι
  choice: ввести в заблуждение
  rationale: Выражение передаёт как обман, так и побуждение уклониться от истины; это естественнее для русского контекста, чем буквальное «увести с пути».
- source_word: εἰ δυνατὸν
  choice: если возможно
  rationale: Прямо сохраняет краткую условную формулировку греческого текста и не превращает её в явно контрфактическую.
- source_word: καὶ τοὺς ἐκλεκτούς
  choice: даже избранных
  rationale: καί имеет усилительное значение «даже», а «избранные» — точный, устойчивый и понятный эквивалент ἐκλεκτοί.
theological_decisions:
- issue: Передача ψευδόχριστοι как мессианского титула
  choice: лжемессии
  alternative: лжехристы
  rationale: В этом предупреждении речь идёт о людях, ложно присваивающих себе мессианский статус. «Лжемессии» сохраняет титульный и иудейский контекст слова, не превращая Χριστός в личное имя.
- issue: Смысл условия εἰ δυνατὸν применительно к избранным
  choice: если возможно
  alternative: если бы это было возможно
  rationale: Греческий текст не выражает контрфактический оттенок явно. Формулировка «если возможно» сохраняет богословское напряжение и не решает за читателя вопрос о возможности окончательного обольщения избранных.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Сложные слова «лжемессии» и «лжепророки» естественны и сохраняют параллелизм оригинала. Порядок «если возможно» помещён перед сказуемым внутри целевого оборота для ясности; все примечания отмечены в основном тексте.
