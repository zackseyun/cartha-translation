lexical_decisions:
- source_word: δύο ἀλήθουσαι
  choice: Две женщины будут молоть
  rationale: Субстантивированное причастие настоящего времени женского рода множественного числа прямо указывает на двух женщин. Будущее время в русском естественно передаёт сцену в рамках пророческого контекста.
- source_word: ἐν τῷ μύλῳ
  choice: на мельнице
  rationale: μύλος может обозначать мельницу или мельничный камень; «на мельнице» естественно описывает место и занятие, не уточняя без необходимости устройство.
- source_word: μία παραλαμβάνεται
  choice: одну возьмут
  rationale: Неопределённо-личная форма по-русски естественно передаёт греческий пассив; «возьмут» сохраняет неуточнённым, означает ли это спасение или суд.
- source_word: καὶ μία ἀφίεται
  choice: а другую оставят
  rationale: В парной русской конструкции «одну… а другую…» естественно выражает сопоставление. «Оставят» непосредственно передаёт ἀφίεται, не усиливая его до «бросят» или «покинут».
theological_decisions:
- issue: Следует ли уточнять, что молоть будут именно женщины
  choice: Явно назвать женщин
  alternative: «Двое будут молоть»
  rationale: Форма ἀλήθουσαι грамматически женского рода, поэтому указание на женщин является частью смысла исходного текста.
- issue: Следует ли истолковать взятие и оставление как спасение или суд
  choice: Сохранить нейтральные формулировки «возьмут» и «оставят»
  alternative: Уточнить, что одну возьмут для спасения или суда
  rationale: Сам стих не определяет однозначно богословское значение каждого действия; перевод не должен устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная парная конструкция. Женский род передан явно, а богословская неоднозначность действий сохранена.
