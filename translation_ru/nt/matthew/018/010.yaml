  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὁρᾶτε μὴ καταφρονήσητε ἑνὸς τῶν μικρῶν τούτων, λέγω γὰρ ὑμῖν ὅτι οἱ ἄγγελοι αὐτῶν ἐν οὐρανοῖς διὰ παντὸς βλέπουσι τὸ πρόσωπον τοῦ πατρός μου τοῦ ἐν ⸀οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/010.yaml
  text: See that you do not despise one of these little ones[c][b][a], for I tell you that their angels in heaven continually see the face of my Father who is in heaven.
translation:
  language: ru
  text: 'Смотрите, не презирайте ни одного из этих малых[a], ибо говорю вам: их ангелы[b] на небесах всегда видят лицо Моего Отца, Который на небесах[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не смотрите свысока ни на одного из этих малых». Слово «малые» может указывать не только на детей, но и на тех, кто мал или незначителен в глазах людей.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «их ангелы» может означать ангелов, связанных с этими малыми или представляющих их; сам по себе этот стих не решает всех вопросов об ангелах-хранителях.
    reason: alternative_reading
  - marker: c
    text: 'В греческом тексте в обоих случаях буквально: «на небесах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε μὴ καταφρονήσητε
  choice: Смотрите, не презирайте
  rationale: «Смотрите» сохраняет форму призыва к бдительности, после которого следует запрет; «не презирайте» точно передаёт отношение пренебрежения и признания другого незначительным.
- source_word: ἑνὸς τῶν μικρῶν τούτων
  choice: ни одного из этих малых
  rationale: В контексте запрета естественная русская конструкция «ни одного» передаёт греческое «одного из». «Малые» не сужает значение только до детей и сохраняет возможную связь со смиренными и незначительными в глазах людей.
- source_word: λέγω γὰρ ὑμῖν
  choice: потому что говорю вам
  rationale: Передаёт объяснительную силу γάρ и сохраняет характерную формулу речи Иисуса без ненужного усиления.
- source_word: οἱ ἄγγελοι αὐτῶν
  choice: их ангелы
  rationale: Прямо сохраняет притяжательное отношение исходного текста, не определяя, идёт ли речь об индивидуальных ангелах-хранителях или об иной связи ангелов с «малыми».
- source_word: ἐν οὐρανοῖς
  choice: на небесах
  rationale: Естественное русское библейское выражение, сохраняющее множественное число греческого οὐρανοῖς.
- source_word: διὰ παντὸς
  choice: всегда
  rationale: Кратко и естественно передаёт устойчивое значение «постоянно, во всякое время».
- source_word: βλέπουσι τὸ πρόσωπον
  choice: видят лицо
  rationale: Сохраняет образ непосредственного доступа к Богу и не заменяет его толкованием.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: Моего Отца, Который на небесах
  rationale: Сохраняет личное «Моего Отца» и отдельное определение Его небесного пребывания.
theological_decisions:
- issue: Значение выражения «их ангелы»
  choice: Оставить буквальное «их ангелы», не уточняя характер этой связи.
  alternative: Перевести или истолковать как «ангелы-хранители, приставленные к каждому из них».
  rationale: Стих указывает на связь ангелов с «малыми», но сам по себе не устанавливает подробного учения об индивидуальном ангеле-хранителе у каждого человека.
- issue: Кого обозначают «эти малые»
  choice: Сохранить широкое обозначение «эти малые».
  alternative: Сузить до «этих детей» или раскрыть как «смиренных верующих».
  rationale: Контекст Матфея 18 включает ребёнка как наглядный пример и распространяет образ малости на учеников; исходное выражение не следует искусственно ограничивать одной группой.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и краткости евангельского наставления. «Малые» выбрано вместо более разговорного «маленькие», чтобы не ограничивать смысл возрастом; прописные буквы в местоименных и относительных формах при обращении к Богу соответствуют принятому русскому библейскому регистру.
