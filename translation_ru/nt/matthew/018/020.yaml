source:
  edition: SBLGNT
  text: οὗ γάρ εἰσιν δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι ἐν μέσῳ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/020.yaml
  text: For where two or three are gathered in my name[a], there I am in their midst.
translation:
  language: ru
  text: Ведь где двое или трое собраны во имя Моё, там Я среди них.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗ
  choice: где
  rationale: Передаёт придаточное места без более широкого оттенка, который могло бы внести «везде, где».
- source_word: γάρ
  choice: ведь
  rationale: Естественно сохраняет пояснительную связь с предшествующим контекстом.
- source_word: δύο ἢ τρεῖς
  choice: двое или трое
  rationale: При обозначении людей собирательные числительные звучат естественно в современном русском языке.
- source_word: συνηγμένοι
  choice: собраны
  rationale: Передаёт перфектное пассивное причастие и состояние людей, оказавшихся вместе, не уточняя, кем именно они собраны.
- source_word: εἰς τὸ ἐμὸν ὄνομα
  choice: во имя Моё
  rationale: Устойчивое и понятное русское выражение, сохраняющее связь собрания с именем Иисуса, но не сводящее её к одной интерпретации — цели, власти или верности.
- source_word: ἐκεῖ
  choice: там
  rationale: 'Сохраняет соотносительную конструкцию греческого текста: «где… там».'
- source_word: εἰμι
  choice: Я
  rationale: В русской именной конструкции настоящего времени связка «есть» обычно опускается; утверждение присутствия сохраняется естественно и прямо.
- source_word: ἐν μέσῳ αὐτῶν
  choice: среди них
  rationale: Точно и естественно передаёт нахождение посреди собравшихся; буквальное «посреди них» также возможно, но несколько сильнее подчёркивает пространственный образ.
theological_decisions:
- issue: Христологический смысл присутствия Иисуса среди собравшихся учеников
  choice: Передать прямое утверждение «там Я среди них», не определяя способ этого присутствия.
  alternative: «Там Я присутствую среди них» либо конфессионально уточнённое понимание присутствия.
  rationale: Греческий текст утверждает присутствие Иисуса, но не раскрывает его метафизический способ и не привязывает его к позднейшей конфессиональной формулировке.
translation_notes:
  register: Современный литературный русский язык с краткой, dignified формулировкой. Инверсия «во имя Моё» сохраняет узнаваемость библейского оборота, оставаясь понятной современному читателю. Заглавные буквы в местоимениях, относящихся к Иисусу, использованы как издательская норма благоговейного регистра, а не как смысловое добавление.
