  source_fidelity: 'Смысл греческого текста в целом передан точно: сохранены условность ἐὰν γένηται εὑρεῖν, торжественная формула ἀμὴν λέγω ὑμῖν, прямое сравнение μᾶλλον ἢ и указание на девяносто девять, не сбившихся с пути. Однако «случится ему найти» неудачно для современного литературного русского; естественный порядок слов — «ему случится её найти».'
