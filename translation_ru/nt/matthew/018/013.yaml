  terminology: «Истинно говорю вам» — уместная торжественная передача ἀμὴν λέγω ὑμῖν. Образ овцы сохраняется местоимением женского рода без ненужного добавления слова «овца», отсутствующего в данном греческом стихе. Богословских уточнений перевод не привносит.
