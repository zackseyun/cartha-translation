  to: 'И если ему случится её найти[a], истинно говорю вам: он радуется ей больше, чем девяноста девяти, которые не заблудились.'
  rationale: 'Исправлены только две стилистические точки: порядок слов в условном обороте и современная сочетаемость глагола «радоваться». Условный оттенок греческого ἐὰν γένηται εὑρεῖν сохранён, как и прямое сопоставление радости о найденной овце с радостью о девяноста девяти. Сноска остаётся привязанной к обороту, для которого предлагает естественный лексический вариант.'
