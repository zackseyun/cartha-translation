id: MAT.18.13
reference: Matthew 18:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐὰν γένηται εὑρεῖν αὐτό, ἀμὴν λέγω ὑμῖν ὅτι χαίρει ἐπ’ αὐτῷ μᾶλλον ἢ ἐπὶ τοῖς ἐνενήκοντα ἐννέα τοῖς μὴ πεπλανημένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/013.yaml
  text: And if he happens to find it[a], truly I tell you[b], he rejoices over it more than over the ninety-nine that have not gone astray.
translation:
  language: ru
  text: 'И если ему случится её найти[a], истинно говорю вам: он радуется ей больше, чем девяноста девяти, которые не заблудились.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если ему доведётся найти её».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз сохраняет ход притчи и естественно связывает стих с предыдущим.
- source_word: ἐὰν γένηται εὑρεῖν αὐτό
  choice: если случится ему найти её
  rationale: Оборот с ἐὰν, γένηται и инфинитивом выражает условность и оттенок случившегося события; формулировка передаёт этот оттенок без сведения смысла к простому «если найдёт».
- source_word: ἀμὴν λέγω ὑμῖν
  choice: истинно говорю вам
  rationale: Традиционная, понятная современному читателю передача торжественной и подчёркнутой формулы речи Иисуса.
- source_word: χαίρει ἐπ’ αὐτῷ
  choice: радуется о ней
  rationale: Глагол χαίρω передаёт сильную радость, а сочетание с ἐπί обозначает её предмет; местоимение согласовано с подразумеваемой овцой.
- source_word: μᾶλλον ἢ
  choice: больше, чем
  rationale: Прямо сохраняет сравнительный смысл, не создавая впечатления, будто радость о девяноста девяти полностью исключена.
- source_word: τοῖς ἐνενήκοντα ἐννέα
  choice: о девяноста девяти
  rationale: Как и в греческом тексте, слово «овцах» не повторяется, поскольку ясно подразумевается из контекста.
- source_word: τοῖς μὴ πεπλανημένοις
  choice: которые не заблудились
  rationale: Передаёт результативный смысл перфектного причастия и естественно соответствует образу овец, сбившихся с пути.
theological_decisions:
- issue: Смысл сравнения радости пастуха
  choice: Сохранено прямое утверждение, что пастух радуется найденной овце больше, чем девяноста девяти незаблудившимся.
  alternative: Смягчить сравнение, чтобы оно не воспринималось как предпочтение одной овцы другим.
  rationale: Сравнительная конструкция μᾶλλον ἢ выражена прямо. Перевод сохраняет напряжение высказывания, но не добавляет вывода, будто пастух не заботится об остальных или считает их менее ценными.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формула «истинно говорю вам» сохранена как узнаваемая торжественная конструкция; остальная фраза избегает архаизмов. Местоимение «её» относится к подразумеваемой овце.
