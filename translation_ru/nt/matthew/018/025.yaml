  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι ἐκέλευσεν αὐτὸν ὁ ⸀κύριος πραθῆναι καὶ τὴν ⸀γυναῖκα καὶ τὰ τέκνα καὶ πάντα ὅσα ⸀ἔχει καὶ ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/025.yaml
  text: But since he was unable to repay[a], the master ordered that he be sold, along with his wife and children and all that he had[b], and that payment be made.
translation:
  language: ru
  text: Но так как ему нечем было уплатить, господин приказал продать его, его жену, детей и всё его имущество[a], и уплатить долг.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть продать должника и его семью, а имущество обратить в деньги, чтобы полученными средствами уплатить долг.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι
  choice: Но так как ему нечем было уплатить
  rationale: 'Генитив абсолютный передаёт обстоятельство причины: должник не располагал средствами для уплаты. Русская конструкция «ему нечем было уплатить» естественно и точно выражает это, не превращая фразу в утверждение о неспособности вообще.'
- source_word: ἐκέλευσεν
  choice: приказал
  rationale: Глагол обозначает властное распоряжение; «приказал» соответствует положению господина в рассказе.
- source_word: ὁ κύριος
  choice: господин
  rationale: Внутри притчи слово обозначает хозяина и властного начальника раба, а не выступает здесь прямым божественным титулом. «Господин» сохраняет лексическую связь с κύριος и звучит естественно в данном контексте.
- source_word: πραθῆναι
  choice: продать его
  rationale: 'Пассивный инфинитив после глагола приказания естественно передаётся по-русски активным инфинитивом при неопределённом исполнителе: господин приказал, чтобы должника продали.'
- source_word: τὴν γυναῖκα καὶ τὰ τέκνα
  choice: его жену, детей
  rationale: Притяжательное местоимение, хотя и не выражено отдельно в греческом, однозначно следует из контекста; перед «детьми» его можно не повторять.
- source_word: πάντα ὅσα ἔχει
  choice: всё его имущество
  rationale: Фраза охватывает всё, чем он владел. «Всё его имущество» точнее показывает отличие имущества от уже перечисленных членов семьи.
- source_word: καὶ ἀποδοθῆναι
  choice: чтобы уплатить долг
  rationale: Второй пассивный инфинитив указывает на цель продажи — произвести уплату. Слово «долг» явно дано ближайшим контекстом притчи и делает русский текст понятным.
theological_decisions:
- issue: Передача κύριος в контексте притчи
  choice: господин
  alternative: хозяин; Господь
  rationale: Речь идёт о человеческом господине внутри повествования. Строчная буква и слово «господин» не навязывают прямого отождествления персонажа с Богом, но сохраняют социальную и лексическую силу κύριος.
- issue: Объём приказа о продаже семьи
  choice: продать должника, его жену, детей и имущество
  alternative: понимать продажу только как обращение взыскания на имущество
  rationale: Грамматика координирует самого должника, жену, детей и всё, что он имеет, как объекты продажи; суровость этой картины следует сохранить, не смягчая её.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанный повествовательный стиль. Сохранена суровая социальная реальность притчи; архаизмы и конфессионально окрашенные уточнения не добавлены.
