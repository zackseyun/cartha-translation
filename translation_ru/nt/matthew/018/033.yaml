  text: οὐκ ἔδει καὶ σὲ ἐλεῆσαι τὸν σύνδουλόν σου, ὡς κἀγὼ σὲ ἠλέησα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/033.yaml
  text: Should you not also have had mercy on your fellow slave[a], as I also had mercy on you?
translation:
  language: ru
  text: Разве не следовало и тебе проявить милосердие к своему собрату по рабству[a], как и я проявил милосердие к тебе?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «товарищу по служению», «такому же слуге». Греческое слово σύνδουλος обозначает раба, принадлежащего тому же господину; вариант «собрат по рабству» сохраняет здесь значение общего несвободного положения.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔδει
  choice: Разве не следовало
  rationale: Безличное ἔδει выражает нравственную необходимость; риторическая конструкция с «разве не» естественно передаёт укор.
- source_word: καὶ σὲ
  choice: и тебе
  rationale: «И» сохраняет сопоставление между милостью господина и ожидаемой милостью раба; дательный падеж обусловлен русской конструкцией «следовало тебе».
- source_word: ἐλεῆσαι / ἠλέησα
  choice: смилостивиться / смилостивился
  rationale: Одинаковый русский глагол сохраняет намеренный повтор ἐλεάω и передаёт не просто жалость, а действенную милость в контексте прощённого долга.
- source_word: τὸν σύνδουλόν σου
  choice: над своим собратом-рабом
  rationale: «Собрат-раб» передаёт как общий рабский статус, выраженный σύν-, так и принадлежность обоих одному господину, не смягчая значение до простого наёмного слуги.
- source_word: ὡς κἀγὼ
  choice: как и я
  rationale: Сохраняет прямое сравнение и усилительное καί в κἀγώ.
theological_decisions:
- issue: Передача термина σύνδουλος из группы δοῦλος
  choice: собрат-раб
  alternative: товарищ по служению; такой же слуга
  rationale: В притче важен зависимый, несвободный статус обоих людей перед одним господином. Основной вариант сохраняет этот смысл, а сноска отмечает более традиционные, но несколько смягчающие варианты.
- issue: Передача ἐλεάω
  choice: смилостивиться над
  alternative: пожалеть; проявить милость к; помиловать
  rationale: «Смилостивиться» сохраняет этико-богословскую весомость милости и одинаково естественно употребляется в обеих частях сравнения, не сводя действие лишь к чувству жалости или юридическому помилованию.
translation_notes:
  register: Современный литературный русский язык с достоинством притчевой речи. Риторический укор передан естественно; повтор глагола сохранён. Составное слово «собрат-раб» несколько маркировано, но понятно из контекста и точнее передаёт σύνδουλος, чем смягчённое «слуга».
