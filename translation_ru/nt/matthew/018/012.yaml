id: MAT.18.12
reference: Matthew 18:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τί ὑμῖν δοκεῖ; ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα καὶ πλανηθῇ ἓν ἐξ αὐτῶν, οὐχὶ ⸀ἀφήσει τὰ ἐνενήκοντα ἐννέα ἐπὶ τὰ ὄρη ⸀καὶ πορευθεὶς ζητεῖ τὸ πλανώμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/012.yaml
  text: What do you think? If a man has a hundred sheep[a], and one of them goes astray[c][b], will he not leave the ninety-nine on the mountains and go and seek the one going astray?
translation:
  language: ru
  text: Как вы думаете? Если у человека сто овец и одна из них заблудится[a], разве он не оставит девяносто девять в горах[b] и не пойдёт искать заблудившуюся[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отобьётся от стада»; греческий глагол может означать «заблудиться», «блуждать», а в некоторых контекстах — «быть введённым в заблуждение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на горах»; речь может идти о горах или холмистой местности.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «блуждающую» или «сбивающуюся с пути»; традиционно: «потерявшуюся».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: Как вы думаете?
  rationale: Естественный современный русский оборот, сохраняющий прямое обращение к слушателям и приглашение рассудить.
- source_word: ἐὰν γένηταί τινι ἀνθρώπῳ
  choice: Если у человека сто овец
  rationale: Оборот с γίνομαι и дательным передаёт обладание или возникшее обстоятельство. Русская конструкция «у человека» естественна и сохраняет единственное число.
- source_word: ἑκατὸν πρόβατα
  choice: сто овец
  rationale: Прямое и идиоматичное соответствие числительному и существительному.
- source_word: πλανηθῇ ἓν ἐξ αὐτῶν
  choice: одна из них заблудится
  rationale: πλανάω допускает значения «заблудиться», «блуждать» и «быть введённым в заблуждение». В образе овцы «заблудится» естественно и не уточняет причину или виновность.
- source_word: οὐχὶ ἀφήσει
  choice: разве он не оставит
  rationale: Частица οὐχί предполагает утвердительный ответ; «разве… не» передаёт риторический характер вопроса, а будущее время соответствует ἀφήσει.
- source_word: τὰ ἐνενήκοντα ἐννέα
  choice: девяносто девять
  rationale: Стандартная передача числительного; подразумеваемое «овец» легко восстанавливается из контекста.
- source_word: ἐπὶ τὰ ὄρη
  choice: в горах
  rationale: Передаёт горную местность естественным русским выражением, не ослабляя ὄρη до неопределённой сельской местности.
- source_word: καὶ πορευθεὶς ζητεῖ
  choice: и не пойдёт искать
  rationale: Причастие πορευθείς естественно передано личной формой в последовательности действий; ζητεῖ — инфинитивом «искать». Повтор отрицания требуется русской конструкцией «разве не… и не…».
- source_word: τὸ πλανώμενον
  choice: заблудившуюся
  rationale: Сохраняет связь с πλανηθῇ и образ овцы. Субстантивированное причастие в греческом буквально обозначает ту, которая блуждает или сбилась с пути.
theological_decisions:
- issue: Родовое значение ἀνθρώπῳ
  choice: у человека
  alternative: у кого-нибудь
  rationale: «У человека» сохраняет форму единственного числа и обобщённый характер примера, не делая пол владельца овец значимой частью смысла.
- issue: Оттенок πλανάω в метафоре овцы
  choice: заблудится / заблудившуюся
  alternative: отобьётся / блуждающую / будет введена в заблуждение
  rationale: Выбор сохраняет как буквальный пастушеский образ, так и возможный переносный нравственный смысл, не приписывая действию внешнего виновника и не заменяя πλανάω более сильной лексикой погибели.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным регистром. Риторический вопрос сохранён; синтаксис сделан естественным для устной речи Иисуса. Все сноски привязаны к соответствующим словам основного текста.
