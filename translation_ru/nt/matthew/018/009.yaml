id: MAT.18.9
reference: Matthew 18:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ ὀφθαλμός σου σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν μονόφθαλμον εἰς τὴν ζωὴν εἰσελθεῖν, ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/009.yaml
  text: And if your eye causes you to stumble[a], tear it out and throw it away from you. It is better for you to enter into life with one eye than, having two eyes[b], to be thrown into the Gehenna of fire.
translation:
  language: ru
  text: И если твой глаз вводит тебя в грех[a], вырви его и отбрось от себя. Лучше тебе с одним глазом войти в жизнь, чем с двумя глазами быть брошенным в огненную геенну[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «становится для тебя причиной преткновения». Греческий глагол может означать, что кто-либо или что-либо заставляет человека споткнуться, пасть или согрешить.'
    reason: lexical_alternative
  - marker: b
    text: «Геенна» — обозначение места окончательного суда; традиционно переводится словом «ад».
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: вводит тебя в грех
  rationale: В данном предостерегающем контексте глагол обозначает побуждение к падению или греху. Естественное русское выражение передаёт смысл, а примечание сохраняет исходный образ преткновения.
- source_word: ἔξελε
  choice: вырви
  rationale: Сильный императив и резкий гиперболический образ требуют энергичного, но естественного современного русского глагола.
- source_word: βάλε ἀπὸ σοῦ
  choice: отбрось от себя
  rationale: Передаёт решительное удаление и сохраняет компонент удаления «от себя».
- source_word: καλόν σοί ἐστιν
  choice: лучше тебе
  rationale: Сравнительная конструкция с ἤ требует значения предпочтительности, а не просто нравственной оценки «хорошо».
- source_word: μονόφθαλμον
  choice: с одним глазом
  rationale: Естественнее для современного русского, чем «одноглазым», при сохранении телесного образа.
- source_word: εἰς τὴν ζωὴν
  choice: войти в жизнь
  rationale: Не добавляет отсутствующего в греческом тексте определения «вечную», сохраняя эсхатологическую ёмкость выражения.
- source_word: βληθῆναι
  choice: быть брошенным
  rationale: Точно передаёт пассивный инфинитив и остаётся ясным в современном русском.
- source_word: γέενναν τοῦ πυρός
  choice: огненную геенну
  rationale: Сохраняет особый термин γέεννα, а генитив огня естественно передаётся русским прилагательным без ослабления образа.
theological_decisions:
- issue: Передача γέεννα
  choice: геенна
  alternative: ад
  rationale: Транслитерация сохраняет конкретный иудейский термин и не сводит его без пояснения к более широкому позднейшему понятию «ад».
- issue: Передача εἰς τὴν ζωήν
  choice: в жизнь
  alternative: в вечную жизнь
  rationale: Хотя контекст имеет эсхатологическую направленность, определение «вечную» в греческом тексте отсутствует.
- issue: Смысл σκανδαλίζει
  choice: вводит тебя в грех
  alternative: становится для тебя причиной преткновения
  rationale: Контекст говорит о нравственном падении; основной текст формулирует это ясно для современного читателя, а примечание сохраняет метафорическую широту греческого глагола.
translation_notes:
  register: Современный литературный русский язык; фраза звучит прямо и торжественно, сохраняет резкость гиперболы и симметрию противопоставления. Термин «геенна» оставлен в основном тексте и кратко объяснён в примечании.
