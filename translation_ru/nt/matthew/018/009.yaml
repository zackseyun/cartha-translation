  source_fidelity: 'Перевод точно передаёт структуру и смысл греческого текста: условное предупреждение, сильные повеления «вырви» и «отбрось», сравнительное «лучше тебе», «войти в жизнь» без добавления «вечную», а также пассивное «быть брошенным». «Огненная геенна» естественно передаёт γέενναν τοῦ πυρός, не подменяя специфический термин словом «ад». «Вводит тебя в грех» является контекстуально обоснованным выбором для σκανδαλίζει; сноска надлежащим образом сохраняет более широкий образ преткновения.'
