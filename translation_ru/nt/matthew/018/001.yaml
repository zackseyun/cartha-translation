  yaml_path: translation/nt/matthew/018/001.yaml
  text: At that time the disciples came to Jesus, saying, “Who then is greater in the kingdom of heaven?”
translation:
  language: ru
  text: 'В тот час ученики подошли к Иисусу и спросили: «Кто же больше в Царстве Небесном?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: В тот час
  rationale: Прямо передаёт временное указание, сохраняя связь с предшествующим повествованием.
- source_word: προσῆλθον ... τῷ Ἰησοῦ
  choice: подошли к Иисусу
  rationale: Естественное современное русское соответствие глаголу προσέρχομαι с дательным дополнением.
- source_word: λέγοντες
  choice: и спросили
  rationale: Вводит последующий прямой вопрос естественным для русского повествования способом; вопросительное содержание явно выражено следующей репликой.
- source_word: Τίς ἄρα μείζων ἐστὶν
  choice: Кто же больше
  rationale: Сохраняет сравнительную степень μείζων («больше»), не заменяя её превосходной («величайший»); частица ἄρα передана словом «же».
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: в Небесном Царстве
  rationale: Естественная и достоинственная русская передача матфеевского выражения «Царство небес»; прилагательное избегает тяжеловесности конструкции «Царство небес» в данном вопросе.
theological_decisions:
- issue: Сравнительная или превосходная степень в вопросе учеников
  choice: «Кто же больше»
  alternative: «Кто же самый великий / величайший»
  rationale: Греческий текст имеет сравнительную форму μείζων. Хотя в контексте она может выполнять элативную или превосходную функцию, перевод сохраняет формальную неоднозначность и не усиливает её до явного превосходного значения.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная повествовательная формулировка. Прямая речь оформлена русскими кавычками. Богословски значимая сравнительная форма сохранена.
