  text: ὅστις οὖν ταπεινώσει ἑαυτὸν ὡς τὸ παιδίον τοῦτο, οὗτός ἐστιν ὁ μείζων ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/004.yaml
  text: Therefore, whoever humbles himself like this child, he is the greatest in the kingdom of heaven.
translation:
  language: ru
  text: Итак, всякий, кто смирит себя, как этот ребёнок, тот и есть величайший в Царстве Небесном.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις
  choice: кто
  rationale: 'Естественно передаёт обобщённое относительное местоимение: речь идёт о всяком, кто исполнит названное условие.'
- source_word: ταπεινώσει ἑαυτόν
  choice: смирит себя
  rationale: Сохраняет возвратность и активное значение греческого выражения, не сводя его лишь к внутреннему чувству скромности.
- source_word: ὡς τὸ παιδίον τοῦτο
  choice: уподобившись этому ребёнку
  rationale: Передаёт сравнительное ὡς естественным русским оборотом и сохраняет указание на присутствующего ребёнка.
- source_word: ὁ μείζων
  choice: величайший
  rationale: В данном контексте форма сравнительной степени употреблена со значением высшей степени; русский суперлатив передаёт это естественно.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Небесное Царство
  rationale: Устойчивое, ясное и современное русское обозначение матфеевского выражения; смысловой родительный передан прилагательным.
theological_decisions:
- issue: Основание величия в Небесном Царстве
  choice: Сохранена прямая связь между добровольным смирением и статусом величайшего.
  alternative: Ослабить утверждение до «будет считаться великим».
  rationale: Греческий текст прямо говорит οὗτός ἐστιν ὁ μείζων — «тот и есть величайший»; смягчение не имеет текстового основания.
- issue: Смысл уподобления ребёнку
  choice: Не уточнять, в каком именно качестве человек подобен ребёнку.
  alternative: Добавить «станет таким же смиренным, как этот ребёнок».
  rationale: Текст связывает уподобление с действием «смирит себя», но не приписывает ребёнку отвлечённое качество в явной форме; перевод сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Конструкция «тот и есть» сохраняет эмфатическое οὗτός и соответствует восстановленному акценту консультационного английского текста. Маркеры сносок не требуются.
