source:
  edition: SBLGNT
  text: πεσὼν οὖν ὁ σύνδουλος ⸀αὐτοῦ παρεκάλει αὐτὸν λέγων· Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/029.yaml
  text: So his fellow slave fell down and pleaded with him[a], saying, ‘Be patient with me, and I will repay you.’
translation:
  language: ru
  text: 'Тогда его товарищ, такой же раб, пал перед ним и стал умолять его: «Прояви ко мне терпение, и я отдам тебе долг».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσών
  choice: пал перед ним
  rationale: Причастие передаёт телесный жест униженной мольбы; добавление «перед ним» естественно выражает направленность жеста в русском контексте.
- source_word: οὖν
  choice: тогда
  rationale: Здесь частица продолжает повествование и обозначает следующее действие; «тогда» звучит естественнее буквального «итак».
- source_word: σύνδουλος
  choice: товарищ по рабству
  rationale: Слово обозначает раба того же господина. Выражение сохраняет указание на общее рабское положение и при этом ясно для современного русского читателя.
- source_word: παρεκάλει
  choice: стал умолять
  rationale: Имперфект описывает продолжавшуюся настойчивую просьбу; конструкция «стал умолять» передаёт и начало, и длительность действия.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: Потерпи меня
  rationale: В долговом контексте это естественная русская просьба дать отсрочку и проявить терпение к должнику.
- source_word: ἀποδώσω
  choice: я всё тебе отдам
  rationale: Глагол означает вернуть причитающееся; в контексте долга «отдам» звучит естественно, а «всё» отражает подразумеваемую полную выплату, заявленную должником.
theological_decisions:
- issue: Передача рабского статуса в σύνδουλος
  choice: товарищ по рабству
  alternative: товарищ по службе; другой раб
  rationale: Выбранный вариант не смягчает социальную реальность греческого δοῦλος и подчёркивает, что оба персонажа принадлежат одному господину, не привнося конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством притчевого повествования. Реплика краткая и устная; архаизмы вроде «долготерпи» и канцелярское «сослужитель» исключены.
