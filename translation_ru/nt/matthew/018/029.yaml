- from: 'Тогда товарищ его по рабству пал перед ним и стал умолять: «Потерпи меня, и я всё тебе отдам».'
  to: 'Тогда его товарищ, такой же раб, пал перед ним и стал умолять его: «Прояви ко мне терпение, и я отдам тебе долг».'
  rationale: Исправлена неидиоматичная просьба о терпении, устранено невыраженное «всё» и сглажена передача σύνδουλος. Имперфект παρεκάλει естественно передан конструкцией «стал умолять», а долговой контекст позволяет явно назвать то, что будет возвращено, долгом.
