  naturalness: «И сказал» допустимо в традиционно-библейском повествовательном стиле, однако для современного литературного русского естественнее «Он сказал». Оборот «ни в коем случае не войдёте» сохраняет сильное отрицание в более нейтральном литературном регистре. Сноску об отрицании следует поставить непосредственно после отрицательного глагола, к которому она относится.
