  text: καὶ εἶπεν· Ἀμὴν λέγω ὑμῖν, ἐὰν μὴ στραφῆτε καὶ γένησθε ὡς τὰ παιδία, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/003.yaml
  text: And he said[a], “Truly I say to you, unless you turn and become like children[c][b], you will certainly not enter the kingdom of heaven.”
translation:
  language: ru
  text: 'Он сказал: «Истинно говорю вам: если не обратитесь[a] и не станете как дети, то ни в коем случае не войдёте[b] в Царство Небесное».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если не будете обращены». Греческая форма допускает как возвратное, так и пассивное понимание.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «никогда не войдёте». В греческом тексте употреблено усиленное отрицание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Истинно
  rationale: Передаёт формулу торжественного и авторитетного утверждения естественным для современного русского библейским языком.
- source_word: στραφῆτε
  choice: обратитесь
  rationale: 'Форма допускает возвратное или пассивное понимание: «обратитесь» либо «будете обращены». «Обратитесь» кратко передаёт решительный поворот, не превращая слово в узкий богословский термин.'
- source_word: γένησθε
  choice: станете
  rationale: 'Естественно выражает изменение состояния и сохраняет координацию двух глаголов: «обратитесь и станете».'
- source_word: ὡς τὰ παιδία
  choice: как дети
  rationale: Артикль обозначает детей как известный класс и в контексте может перекликаться с поставленным перед учениками ребёнком; по-русски обобщённое «как дети» звучит естественно и не приписывает детям конкретных качеств.
- source_word: οὐ μὴ εἰσέλθητε
  choice: ни за что не войдёте
  rationale: Передаёт усиленное греческое отрицание οὐ μή ясно и идиоматично, без архаического оборота.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: Царство Небесное
  rationale: Устоявшаяся и точная русская передача характерного для Матфея выражения; сохраняет его богословскую и литературную узнаваемость.
theological_decisions:
- issue: Значение στραφῆτε как языка обращения
  choice: обратитесь
  alternative: будете обращены; изменитесь
  rationale: Сохраняется призыв к решительной перемене направления, но не уточняется её механизм и не вводится конфессионально нагруженная формула.
- issue: Какие качества детей подразумеваются
  choice: как дети
  alternative: как малые дети; как эти дети
  rationale: Сам стих не называет невинность, смирение, доверчивость или иное отдельное качество. Перевод сохраняет эту смысловую открытость.
- issue: Сила отрицания οὐ μή
  choice: ни за что не войдёте
  alternative: никогда не войдёте; вовсе не войдёте
  rationale: Формулировка сохраняет категоричность предупреждения, не делая «никогда» самостоятельным временным уточнением.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сохранён компактным; «Истинно говорю вам» и «Царство Небесное» оставлены как понятные устойчивые формулы. Местоимение «Он» не добавлено, поскольку подлежащее ясно из контекста и отсутствует в данном греческом отрезке.
