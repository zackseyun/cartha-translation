  text: λέγει αὐτῷ ὁ Ἰησοῦς· Οὐ λέγω σοι ἕως ἑπτάκις ἀλλὰ ἕως ἑβδομηκοντάκις ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/022.yaml
  text: Jesus says to him[a], “I do not say to you, up to seven times, but up to seventy times seven.
translation:
  language: ru
  text: 'Иисус говорит ему: «Не говорю тебе: до семи раз, но до семидесяти семи раз[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до семидесяти раз по семь».'
    reason: Греческое выражение ἑβδομηκοντάκις ἑπτά можно понять и как «семьдесят семь раз», и как «семьдесят раз по семь».
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Иисус говорит ему
  rationale: Настоящее время «говорит» сохраняет характерное для греческого повествования историческое настоящее; местоимение «ему» передаёт αὐτῷ, не заменяя его именем Петра.
- source_word: Οὐ λέγω σοι
  choice: Не говорю тебе
  rationale: Прямо передаёт отрицание, настоящее время и дательный адресата; по-русски естественно вводит далее названный предел.
- source_word: ἕως ἑπτάκις
  choice: до семи раз
  rationale: В контексте счёта ἕως обозначает предел, а ἑπτάκις — частоту действия.
- source_word: ἀλλὰ ἕως
  choice: но до
  rationale: «Но» ясно передаёт противопоставление двух названных пределов; повтор «до» следует повтору ἕως в греческом тексте.
- source_word: ἑβδομηκοντάκις ἑπτά
  choice: до семидесяти семи
  rationale: Выбран синтаксически возможный смысл «семьдесят семь раз»; слово «раз» не повторено, поскольку оно естественно подразумевается после «до семи раз». Альтернативное понимание сохранено в сноске.
theological_decisions:
- issue: Неоднозначное числовое выражение в наставлении Иисуса о прощении
  choice: до семидесяти семи
  alternative: до семидесяти раз по семь
  rationale: Греческое ἑβδομηκοντάκις ἑπτά допускает оба понимания. Основной текст выбирает «семьдесят семь», а сноска сохраняет традиционный альтернативный разбор, не превращая высказывание в толкование о точном пределе прощения.
translation_notes:
  register: Современный литературный русский язык; речь краткая и dignified, без архаизмов. Историческое настоящее сохранено. Двоеточие естественно оформляет содержание слов «не говорю тебе».
