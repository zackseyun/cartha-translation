  text: Οὕτως καὶ ὁ πατήρ μου ὁ ⸀οὐράνιος ποιήσει ὑμῖν ἐὰν μὴ ἀφῆτε ἕκαστος τῷ ἀδελφῷ αὐτοῦ ἀπὸ τῶν καρδιῶν ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/035.yaml
  text: So also my heavenly Father will do to you[b][a], if each of you does not forgive his brother from your hearts.
translation:
  language: ru
  text: Так и мой небесный Отец поступит с вами, если каждый из вас не простит своего брата от всего сердца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Брата» — мужской род и единственное число в греческом тексте. В данном обращении это слово употреблено обобщённо и не ограничивает требование прощения только мужчинами.
    reason: cultural_note
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Так и
  rationale: Кратко и естественно вводит вывод из предшествующей притчи, сохраняя сравнительно-следственную связь.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: Отец Мой Небесный
  rationale: Сохраняет притяжательное «Мой» и прилагательное οὐράνιος; порядок слов соответствует достойному и привычному русскому библейскому регистру.
- source_word: ποιήσει ὑμῖν
  choice: поступит с вами
  rationale: Естественный русский оборот отсылает к тому, как господин поступил с рабом в притче, не уточняя сверх текста характер суда.
- source_word: ἐὰν μὴ
  choice: если ... не
  rationale: Прямо передаёт отрицательное условие без смыслового смягчения.
- source_word: ἀφῆτε
  choice: простит
  rationale: В контексте личной вины и образа долга ἀφίημι означает прощение.
- source_word: ἕκαστος
  choice: каждый из вас
  rationale: Ясно передаёт распределительное значение единственного числа применительно ко всей группе слушателей.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: своего брата
  rationale: Возвратное «своего» естественно по-русски соотносит брата с каждым слушателем; «брата» сохраняет мужской род и единственное число греческого выражения.
- source_word: ἀπὸ τῶν καρδιῶν ὑμῶν
  choice: от всего сердца
  rationale: Это естественный русский способ выразить искреннее, внутреннее прощение. Единственное число имеет распределительный смысл при «каждый из вас», а «всего» входит в устойчивый русский оборот и не вводит отдельного богословского утверждения.
theological_decisions:
- issue: Сила и объём предупреждения
  choice: 'Прямое предупреждение: «Отец Мой Небесный поступит с вами»'
  alternative: Смягчающее «будет относиться к вам так же» либо пояснение о конкретном виде окончательного суда
  rationale: Греческий текст торжественно соотносит Божье действие с развязкой притчи, но в самом стихе не формулирует систематическое учение о точной категории суда.
- issue: Значение ἀδελφῷ
  choice: «своего брата» с пояснением представительного смысла в сноске
  alternative: «брата или сестру», «другого верующего»
  rationale: Основной текст сохраняет грамматически мужское единственное число источника, а сноска предотвращает неоправданное ограничение смысла только родственниками-мужчинами.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка остаётся понятной без архаизмов; предупреждение не смягчено и не дополнено конфессиональным толкованием.
