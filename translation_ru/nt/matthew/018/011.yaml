  text: Ἦλθεν γὰρ ὁ υἱὸς τοῦ ἀνθρώπου σῶσαι τὸ ἀπολωλός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/011.yaml
  text: For the Son[a] of Man came to save the lost.
translation:
  language: ru
  text: Ибо Сын Человеческий пришёл спасти погибшее.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот стих отсутствует в наиболее ранних греческих рукописях, включая Синайский и Ватиканский кодексы IV века, а также в ранних коптских переводах, но присутствует в Кодексе Безы V века, византийской традиции большинства рукописей и латинской Вульгате. Вероятно, позднейшие переписчики добавили его для согласования с Лк. 19:10.
    reason: textual_critical
lexical_decisions:
- source_word: ἀπολωλός (ἀπόλλυμι)
  choice: погибшее
  rationale: Субстантивированное причастие перфекта среднего/активного по форме, среднего рода единственного числа, обозначает то, что оказалось погибшим или потерянным. «Погибшее» сохраняет грамматическое число и род греческого выражения, его собирательность и оттенок гибельного состояния, не сужая смысл до одного конкретного лица.
- source_word: σῶσαι (σῴζω)
  choice: спасти
  rationale: Обычное и естественное соответствие в контексте избавления от гибели; сохраняет сотериологическую ёмкость греческого глагола.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшаяся в русском библейском языке передача титула, понятная современному читателю и сохраняющая его межтекстовые связи.
- source_word: γάρ
  choice: ибо
  rationale: Передаёт пояснительно-причинную связь с предшествующим контекстом; «ибо» здесь остаётся естественным для достоинства библейского повествования.
theological_decisions:
- issue: Объект спасения выражен формой среднего рода единственного числа
  choice: погибшее
  alternative: погибших
  rationale: Греческое τὸ ἀπολωλός буквально представляет объект как «погибшее/потерянное». Перевод не заменяет эту форму явным множественным обозначением людей и тем самым сохраняет образную и грамматическую неоднозначность текста.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционным библейским звучанием. Краткий синтаксис оригинала сохранён; «пришёл спасти» звучит естественно, а «погибшее» намеренно удерживает собирательную форму среднего рода.
