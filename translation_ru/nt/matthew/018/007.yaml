  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐαὶ τῷ κόσμῳ ἀπὸ τῶν σκανδάλων· ἀνάγκη ⸀γὰρ ἐλθεῖν τὰ σκάνδαλα, πλὴν οὐαὶ τῷ ⸀ἀνθρώπῳ δι’ οὗ τὸ σκάνδαλον ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/007.yaml
  text: Woe to the world because of stumbling blocks[a]; for it is necessary that the stumbling blocks come[b], but woe to the man through whom the stumbling block comes.
translation:
  language: ru
  text: Горе миру из-за соблазнов[a]! Ведь соблазны неизбежно придут, но горе тому человеку[b], через которого приходит соблазн.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «препятствий», «ловушек», «поводов ко греху». Греческое σκάνδαλον обозначает то, что заставляет человека споткнуться; в переносном смысле — повод к согрешению, оскорбление или ловушку.'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте здесь стоит существительное мужского рода в единственном числе; в данном контексте оно обозначает любого человека, через которого приходит такой соблазн.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαί
  choice: горе
  rationale: Сохраняет пророческую силу осуждения и повтор в обеих частях стиха.
- source_word: κόσμῳ
  choice: миру
  rationale: Передаёт широкий смысл человеческого мира, затронутого злом, без сужения до физического творения или отдельных людей.
- source_word: ἀπὸ τῶν σκανδάλων
  choice: из-за соблазнов
  rationale: Предлог ἀπό здесь указывает на причину бедствия; «из-за» естественно передаёт эту связь по-русски.
- source_word: σκάνδαλα / σκάνδαλον
  choice: соблазны / соблазн
  rationale: «Соблазн» в русском библейском и современном употреблении может обозначать то, что побуждает человека согрешить или становится для него духовной ловушкой. Различие множественного и единственного числа сохранено.
- source_word: ἀνάγκη γὰρ ἐλθεῖν
  choice: ведь … неизбежно придут
  rationale: Естественно выражает заявленную в греческом необходимость, не уточняя её основания; γάρ передано словом «ведь».
- source_word: ἐλθεῖν … ἔρχεται
  choice: придут … приходит
  rationale: Сохраняет повтор одного глагольного образа и различие форм числа.
- source_word: πλήν
  choice: но
  rationale: Ясно передаёт резкий переход от неизбежности соблазнов к ответственности человека, через которого приходит соблазн.
- source_word: ἀνθρώπῳ
  choice: тому человеку
  rationale: Сохраняет мужской род и единственное число исходного выражения; указательное «тому» естественно в русской конструкции «горе тому человеку».
- source_word: δι’ οὗ
  choice: через которого
  rationale: Передаёт человека как посредника или действующее лицо, через которое приходит соблазн.
theological_decisions:
- issue: Характер необходимости в ἀνάγκη γὰρ ἐλθεῖν τὰ σκάνδαλα
  choice: «соблазны неизбежно придут» — необходимость утверждается, но её основание не уточняется
  alternative: «соблазнам надлежит прийти» или «соблазны должны прийти»
  rationale: Греческий текст говорит о необходимости, но прямо не связывает её ни с Божьим предопределением, ни только с практической неизбежностью. Перевод сохраняет это напряжение и не вводит дополнительного объяснения.
- issue: Обобщающее значение ἀνθρώπῳ
  choice: В основном тексте сохранено «тому человеку», а обобщающее значение пояснено в сноске
  alternative: «тому, через кого» или «всякому человеку»
  rationale: Форма источника — мужской род, единственное число, но предостережение имеет обобщающий характер. Сноска позволяет сохранить обе особенности без расширения основного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Традиционное «горе» сохраняет пророческий тон; синтаксис сделан ясным и естественным. Повтор «придут / приходит» воспроизводит риторику оригинала.
