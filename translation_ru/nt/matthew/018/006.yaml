  source_fidelity: 'Текст точно передаёт основные элементы греческого оригинала: широкий смысл σκανδαλίσῃ сохранён в «соблазнит» и раскрыт сноской; «эти малые» не сведены только к детям; πιστεύοντες εἰς ἐμέ передано прямо; μύλος ὀνικός разъяснён как крупный жернов, приводимый ослом; καταποντισθῇ и πέλαγος τῆς θαλάσσης адекватно отражены словами «утопили» и «в открытом море». Гипотетически-сравнительная сила συμφέρει αὐτῷ сохранена в «тому было бы лучше».'
