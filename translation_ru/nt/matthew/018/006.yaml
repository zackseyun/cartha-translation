id: MAT.18.6
reference: Matthew 18:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὃς δ’ ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν τούτων τῶν πιστευόντων εἰς ἐμέ, συμφέρει αὐτῷ ἵνα κρεμασθῇ μύλος ὀνικὸς ⸀εἰς τὸν τράχηλον αὐτοῦ καὶ καταποντισθῇ ἐν τῷ πελάγει τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/006.yaml
  text: But whoever causes one of these little ones who believe in me to stumble[c][b][a], it is better for him that a donkey millstone be hung around his neck and that he be drowned in the open sea.
translation:
  language: ru
  text: А кто соблазнит одного из этих малых, верующих в Меня,[a] тому было бы лучше, чтобы ему повесили на шею жернов, который вращает осёл,[b] и утопили его в открытом море.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заставит одного из этих малых, верующих в Меня, согрешить» либо «станет причиной его отпадения». Греческий глагол может означать побуждение ко греху, духовное преткновение или отпадение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ослиный жернов» — большой жернов, который вращал осёл, в отличие от небольшого ручного жернова.'
    reason: cultural_note
  - marker: c
    text: 'Или: «в морской пучине». Греческое выражение указывает на открытое море, вдали от берега.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: соблазнит
  rationale: Глагол может обозначать побуждение ко греху, духовное преткновение или отпадение. «Соблазнит» сохраняет традиционную метафору и её смысловую широту; пояснение дано в сноске.
- source_word: μικρῶν τούτων
  choice: этих малых
  rationale: Формулировка не ограничивает речь только детьми и может охватывать смиренных или уязвимых учеников; ближайший контекст с ребёнком при этом сохраняется.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: верующих в Меня
  rationale: Прямо и естественно передаёт причастный оборот и личный объект веры.
- source_word: συμφέρει αὐτῷ
  choice: тому было бы лучше
  rationale: Естественно передаёт сравнительный смысл пользы или предпочтительности в суровом гипотетическом предупреждении.
- source_word: μύλος ὀνικὸς
  choice: жернов, который вращает осёл
  rationale: Явно передаёт, что речь идёт не о небольшом ручном жернове, а о крупном жернове, приводимом в движение ослом.
- source_word: καταποντισθῇ
  choice: утопили его
  rationale: Передаёт пассивное погружение в воду с гибельным исходом и естественно сочетается с конструкцией всего предложения.
- source_word: ἐν τῷ πελάγει τῆς θαλάσσης
  choice: в открытом море
  rationale: πέλαγος обозначает морской простор вдали от берега; «в открытом море» лексически точнее, чем выражение только о глубине.
theological_decisions:
- issue: Кого обозначают «эти малые»
  choice: Сохранено широкое обозначение «этих малых, верующих в Меня» без сведения его исключительно к детям.
  alternative: «одного из этих детей, верующих в Меня»
  rationale: Ребёнок присутствует в непосредственном контексте как наглядный пример, однако определение «верующих в Меня» допускает более широкий круг учеников, считающихся малыми или уязвимыми.
- issue: Диапазон значения σκανδαλίζω
  choice: «соблазнит» с пояснением возможных смыслов в сноске
  alternative: «склонит ко греху»
  rationale: Более узкий вариант мог бы преждевременно свести предупреждение только к совершению греха, тогда как греческий глагол также допускает духовное преткновение и отпадение.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Местоимение «Меня» применительно к Иисусу написано с прописной буквы по устойчивой русской издательской норме. Конструкция слегка упрощена синтаксически, чтобы длинное предупреждение звучало естественно, не ослабляя его резкости.
