  text: πεσὼν οὖν ὁ δοῦλος προσεκύνει αὐτῷ λέγων· ⸀Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ πάντα ⸂ἀποδώσω σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/026.yaml
  text: So the slave fell down before him and kept pleading[a], saying, ‘Be patient with me, and I will repay you everything.’
translation:
  language: ru
  text: 'Тогда раб пал перед ним ниц и стал кланяться ему, говоря: «Потерпи меня, и я всё тебе верну».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν
  choice: пал перед ним ниц
  rationale: Аористное причастие обозначает физическое действие, предшествующее просьбе; выражение «пал ниц» естественно передаёт полное смиренное простирание.
- source_word: οὖν
  choice: тогда
  rationale: Частица связывает поступок раба с вынесенным в предыдущем стихе решением и естественно продолжает повествование.
- source_word: δοῦλος
  choice: раб
  rationale: В притче существенны зависимое положение и полная подвластность персонажа господину; «раб» точнее сохраняет социальный смысл δοῦλος, чем более мягкое «слуга».
- source_word: προσεκύνει αὐτῷ
  choice: умолял его
  rationale: В данном контексте несовершенный вид глагола описывает продолжающееся униженное моление перед человеком; телесная поза уже выражена словами «пал перед ним ниц».
- source_word: λέγων
  choice: (вводит прямую речь после «умолял»)
  rationale: Отдельное «говоря» по-русски было бы тяжеловесно; содержание причастия естественно передано прямой речью после глагола «умолял».
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: Потерпи меня
  rationale: Просьба означает проявить долготерпение и отсрочить взыскание; краткая формулировка естественна для современной русской речи и сохраняет образ должника.
- source_word: πάντα
  choice: всё
  rationale: Нейтрально и полно передаёт всеохватное обещание возвратить долг.
- source_word: ἀποδώσω σοι
  choice: я всё тебе отдам
  rationale: В долговом контексте ἀποδίδωμι означает вернуть причитающееся. «Отдам» естественно сочетается со словом «всё» и ясно подразумевает возврат долга.
theological_decisions:
- issue: Значение προσκυνέω по отношению к господину-человеку
  choice: Передано как униженное моление с простиранием ниц
  alternative: «поклонялся ему» или «поклонялся ему как Богу»
  rationale: Внутри притчи речь идёт о почтительном простирании раба перед земным господином. Перевод не должен без необходимости придавать действию значение религиозного поклонения, но примечание сохраняет более широкий диапазон греческого глагола.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Раб» сохраняет социальную остроту исходного текста; «пал перед ним ниц» передаёт позу без неестественного буквального синтаксиса. Имперфект προσεκύνει отражён продолженным действием «умолял».
