  text: ἐὰν δὲ μὴ ἀκούσῃ, παράλαβε μετὰ σοῦ ἔτι ἕνα ἢ δύο, ἵνα ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν σταθῇ πᾶν ῥῆμα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/016.yaml
  text: But if he does not listen[a], take one or two others with you[b], so that by the mouth of two or three witnesses every matter may be established.
translation:
  language: ru
  text: Но если он не послушает, возьми с собой ещё одного или двух, чтобы устами двух или трёх свидетелей было подтверждено всякое дело.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, передавая смысл юридического оборота: «чтобы всякое дело было подтверждено показаниями двух или трёх свидетелей». Это отсылка ко Второзаконию 19:15.'
    reason: lexical_alternative; cross_reference
lexical_decisions:
- source_word: ἀκούσῃ
  choice: не послушает
  rationale: В контексте увещевания глагол означает не просто услышать звук, а внять сказанному; «не послушает» естественно передаёт отказ прислушаться.
- source_word: παράλαβε μετὰ σοῦ ἔτι ἕνα ἢ δύο
  choice: возьми с собой ещё одного или двух
  rationale: Передаёт повелительную силу παράλαβε, сопровождение в μετὰ σοῦ и добавочное значение ἔτι, не уточняя сверх текста, кто именно должен пойти.
- source_word: ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν
  choice: устами двух или трёх свидетелей
  rationale: Сохраняет семитский юридический оборот и узнаваемую связь со Второзаконием 19:15; смысл оборота пояснён в сноске.
- source_word: σταθῇ
  choice: было подтверждено
  rationale: В юридическом контексте пассивная форма ἵστημι говорит об установлении или подтверждении дела; «было подтверждено» звучит естественно и сохраняет сослагательно-целевое значение.
- source_word: πᾶν ῥῆμα
  choice: всякое дело
  rationale: Буквально выражение связано со «словом», но в юридической формуле обозначает всякий разбираемый вопрос или дело; этот выбор сохраняет широту смысла и не сужает его до обвинения.
theological_decisions:
- issue: Ветхозаветная юридическая аллюзия в контексте исправления члена общины
  choice: Сохранить формулу «устами двух или трёх свидетелей» и передать πᾶν ῥῆμα как «всякое дело».
  alternative: «Чтобы всякое слово устояло при двух или трёх свидетелях» либо «чтобы всякое обвинение подтвердилось показаниями двух или трёх свидетелей».
  rationale: Такой перевод сохраняет аллюзию на Второзаконие 19:15 и её юридическую силу, не ограничивая смысл только обвинением и не устраняя библейский образ «уст».
translation_notes:
  register: Современный литературный русский язык с умеренно сохранённой библейской юридической образностью. «Не послушает» понятно обычному читателю, а «устами свидетелей» сохраняет достоинство и межтекстовую связь; менее буквальный смысл дан в сноске.
