source:
  edition: SBLGNT
  text: ἰδόντες ⸀οὖν οἱ σύνδουλοι αὐτοῦ τὰ γενόμενα ἐλυπήθησαν σφόδρα, καὶ ἐλθόντες διεσάφησαν τῷ κυρίῳ ἑαυτῶν πάντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/031.yaml
  text: Therefore[a], when his fellow slaves saw what had happened, they were deeply grieved[b], and they came and reported to their lord everything that had happened.
translation:
  language: ru
  text: Тогда другие рабы, увидев происшедшее, сильно огорчились и, придя к своему господину[a], подробно рассказали ему обо всём происшедшем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хозяину».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: не выражено отдельным словом
  rationale: В данном контексте частица обозначает переход к следствию и развитию повествования; в естественном русском эта связь ясно передаётся последовательностью предложений без отдельного «поэтому».
- source_word: σύνδουλοι
  choice: товарищи-рабы
  rationale: Сложное слово обозначает людей, находящихся в рабстве у того же господина. Такой перевод сохраняет общий подневольный статус, существенный для притчи.
- source_word: τὰ γενόμενα / πάντα τὰ γενόμενα
  choice: что произошло / обо всём случившемся
  rationale: Естественно передаёт субстантивированные формы γίνομαι и сохраняет усиление πάντα во втором случае.
- source_word: ἐλυπήθησαν σφόδρα
  choice: сильно опечалились
  rationale: Передаёт скорбь или глубокое огорчение, выраженные λυπέω, и усилительное значение σφόδρα.
- source_word: ἐλθόντες
  choice: они пришли
  rationale: Причастие предшествующего действия естественно развёрнуто в отдельное личное предложение.
- source_word: διεσάφησαν
  choice: подробно рассказали
  rationale: Глагол означает сообщить или разъяснить обстоятельства подробно; наречие сохраняет эту смысловую составляющую.
- source_word: τῷ κυρίῳ ἑαυτῶν
  choice: своему господину
  rationale: Строчная форма «господин» указывает на человеческого властителя в притче и сохраняет основное значение κύριος.
theological_decisions:
- issue: Передача слова семейства δοῦλος в социальной обстановке притчи
  choice: товарищи-рабы
  alternative: товарищи-слуги
  rationale: Здесь важен общий подневольный статус персонажей у одного господина; более мягкое «слуги» может скрыть эту сторону исходного слова.
- issue: Передача κύριος применительно к человеческому властителю
  choice: господин
  alternative: хозяин
  rationale: «Господин» сохраняет лексическую связь с κύριος, а строчная буква и контекст не позволяют принять это за прямое именование Бога.
translation_notes:
  register: Современный литературный русский, ясный и достойный повествовательный стиль. Длинное греческое предложение разделено на два для естественности; повтор τὰ γενόμενα сохранён вариативно, а точное значение διεσάφησαν передано сочетанием «подробно рассказали».
