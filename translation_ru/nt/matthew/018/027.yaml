  text: σπλαγχνισθεὶς δὲ ὁ κύριος τοῦ δούλου ἐκείνου ἀπέλυσεν αὐτόν, καὶ τὸ δάνειον ἀφῆκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/027.yaml
  text: Then the master of that slave[a], moved with compassion[b], released him and forgave him the debt.
translation:
  language: ru
  text: Тогда господин того раба, сжалившись над ним, отпустил его и простил ему долг.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «заём» или «ссуду».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: сжалившись над ним
  rationale: Причастие передаёт глубокое сострадание; русское «сжалившись над ним» естественно выражает и чувство, и его направленность на раба.
- source_word: δὲ
  choice: тогда
  rationale: В данном месте частица обозначает переход к следующему событию повествования; «тогда» ясно и естественно передаёт последовательность.
- source_word: ὁ κύριος τοῦ δούλου ἐκείνου
  choice: господин того раба
  rationale: Внутри притчи κύριος обозначает земного господина раба, а не прямой божественный титул. «Господин» естественно сочетается с «раб» и сохраняет отношение власти.
- source_word: ἀπέλυσεν αὐτόν
  choice: отпустил его
  rationale: Глагол может означать освобождение или разрешение уйти. «Отпустил его» не уточняет сверх текста, шла ли речь о заключении, задержании или лишь об угрозе наказания.
- source_word: τὸ δάνειον
  choice: долг
  rationale: Хотя существительное буквально обозначает заём или ссуду, в контексте прощения речь идёт об обязательстве вернуть полученное; современное русское «долг» звучит естественно и точно передаёт функцию слова здесь.
- source_word: ἀφῆκεν αὐτῷ
  choice: простил ему
  rationale: Сочетание с финансовым объектом означает отпустить, простить или отменить обязательство. «Простил ему долг» сохраняет финансовый смысл и важную для Матфея лексику прощения.
theological_decisions:
- issue: Возможное понимание κύριος как прямого божественного титула
  choice: господин
  alternative: Господь
  rationale: Непосредственный персонаж — господин раба в притче. Строчная буква и слово «господин» не навязывают прямого отождествления с Богом, но и не устраняют богословскую аналогию притчи.
- issue: Социальный статус δοῦλος
  choice: раб
  alternative: слуга
  rationale: В контексте долга, власти и угрозы продажи зависимое положение персонажа существенно; «раб» передаёт его конкретнее, чем смягчающее «слуга».
- issue: Финансовое и богословское звучание ἀφίημι
  choice: простил ему долг
  alternative: отменил его долг
  rationale: «Простил» уместно для денежного обязательства и сохраняет связь с ключевой для главы темой прощения, не превращая образную сцену в прямое догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Синтаксис краткий и ясный; «сжалившись над ним» естественнее буквального «исполнившись сострадания». Единственная сноска сохраняет более узкое значение τὸ δάνειον.
