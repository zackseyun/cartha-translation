id: MAT.18.8
reference: Matthew 18:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ χείρ σου ἢ ὁ πούς σου σκανδαλίζει σε, ἔκκοψον ⸀αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν εἰσελθεῖν εἰς τὴν ζωὴν ⸂κυλλὸν ἢ χωλόν⸃, ἢ δύο χεῖρας ἢ δύο πόδας ἔχοντα βληθῆναι εἰς τὸ πῦρ τὸ αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/008.yaml
  text: And if your hand or your foot causes you to stumble[a], cut it off and throw it away from you. It is better for you to enter into life maimed or lame than, having two hands or two feet, to be thrown into the eternal fire.
translation:
  language: ru
  text: Если же твоя рука или нога заставляет тебя спотыкаться[a], отсеки её и отбрось от себя. Лучше тебе войти в жизнь увечным или хромым, чем с двумя руками или двумя ногами быть брошенным в вечный огонь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вводит тебя в грех». Греческий глагол буквально передаёт образ того, как кого-либо заставляют споткнуться.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίζει
  choice: заставляет тебя спотыкаться
  rationale: Сохраняет греческий образ преткновения и падения, не сводя его без пояснения к одному лишь значению «вводит в грех».
- source_word: ἔκκοψον
  choice: отсеки
  rationale: Передаёт резкий и конкретный повелительный характер глагола применительно к руке или ноге.
- source_word: βάλε ἀπὸ σοῦ
  choice: отбрось от себя
  rationale: Естественно выражает как решительное действие, так и удаление отсечённой части прочь от себя.
- source_word: καλόν σοί ἐστιν
  choice: лучше тебе
  rationale: В конструкции сравнения с ἢ прилагательное καλόν имеет сравнительный смысл.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: войти в жизнь
  rationale: Сохраняет краткость исходного выражения и его эсхатологическую весомость без добавления отсутствующего в этой фразе слова «вечную».
- source_word: κυλλὸν
  choice: увечным
  rationale: Обозначает телесное увечье или лишение части тела и непосредственно соответствует образу отсечённой руки.
- source_word: χωλόν
  choice: хромым
  rationale: Прямой и современный эквивалент в контексте повреждения или утраты ноги.
- source_word: ἔχοντα
  choice: с двумя руками или двумя ногами
  rationale: Русская конструкция с предлогом «с» естественно передаёт греческое причастие обладания, не утяжеляя фразу.
- source_word: βληθῆναι
  choice: быть брошенным
  rationale: Точно передаёт страдательный инфинитив и сохраняет силу образа.
- source_word: τὸ πῦρ τὸ αἰώνιον
  choice: вечный огонь
  rationale: В контексте суда αἰώνιος естественно означает «вечный»; формулировка ясна и не добавляет конфессионального толкования.
theological_decisions:
- issue: Передача σκανδαλίζει как нравственно истолкованного «вводит в грех» или с сохранением метафоры преткновения
  choice: заставляет тебя спотыкаться
  alternative: вводит тебя в грех
  rationale: Исходный текст сохраняет метафору спотыкания; нравственный смысл поясняется в сноске, а не подменяет образ в основном тексте.
- issue: Значение слова «жизнь» в εἰς τὴν ζωὴν
  choice: сохранить «жизнь» без уточнения
  alternative: вечная жизнь
  rationale: Контекст придаёт слову эсхатологический смысл, однако в самой греческой фразе при ζωή нет определения «вечная».
- issue: Характер повеления об отсечении части тела
  choice: сохранить буквальную резкость формулировки
  alternative: перефразировать как образный призыв решительно устранить повод ко греху
  rationale: Перевод не должен заранее разрешать вопрос о гиперболическом характере высказывания или смягчать его суровый образ.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественно-сдержанным синтаксисом. Формы «отсеки» и «отбрось» сохраняют силу повелений без архаизации; метафора спотыкания оставлена в основном тексте, а её нравственный смысл указан в сноске.
