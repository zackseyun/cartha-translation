base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/034.yaml
  text: And in anger his master handed him over to the torturers until he should pay all that was owed[a][b].
translation:
  language: ru
  text: И, разгневавшись, его господин[a] отдал его истязателям[b], пока тот не выплатит всё, что был должен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господь». Греческое κύριος может иметь оба значения; здесь, внутри притчи, речь идёт о господине раба.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «мучителям»; менее точно: «тюремщикам». Греческое слово обозначает тех, кто подвергает человека мучениям или истязаниям, а не просто стражей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: разгневавшись
  rationale: Аористное причастие употреблено обстоятельственно. Деепричастие естественно передаёт предшествующее главному действию состояние и сохраняет эмоционально-причинную связь.
- source_word: κύριος
  choice: господин
  rationale: Внутри притчи слово обозначает господина данного раба. Строчное «господин» сохраняет отношение власти в повествовании, не превращая слово непосредственно в божественный титул.
- source_word: παρέδωκεν
  choice: отдал
  rationale: Глагол означает передачу человека во власть других; «отдал» звучит естественно и сохраняет судебно-карательный смысл контекста.
- source_word: βασανισταῖς
  choice: истязателям
  rationale: Существительное обозначает тех, кто подвергает истязанию или мучению, а не просто обычных тюремных стражей. «Истязатели» точно сохраняет суровость греческого слова.
- source_word: ἕως οὗ
  choice: пока ... не
  rationale: Обычная русская конструкция для обозначения временного предела, ожидаемого в будущем относительно главного действия.
- source_word: ἀποδῷ
  choice: не выплатит
  rationale: В данном долговом контексте ἀποδίδωμι означает уплатить или возместить причитающееся. Совершенный вид передаёт достижение предполагаемого предела.
- source_word: πᾶν τὸ ὀφειλόμενον
  choice: всё, что был должен
  rationale: Формулировка близко передаёт субстантивированное причастие со значением всей причитавшейся суммы, не добавляя отсутствующее в греческом существительное «долг».
theological_decisions:
- issue: Следует ли переводить κύριος титулом «Господь»
  choice: господин
  alternative: Господь
  rationale: Здесь κύριος обозначает человеческого господина раба внутри притчи. Такой перевод сохраняет непосредственный повествовательный смысл, не отрицая богословского применения притчи и не отождествляя персонажа с Богом прямо в основном тексте.
- issue: Степень суровости значения βασανισταῖς
  choice: истязателям
  alternative: мучителям; тюремщикам
  rationale: «Истязателям» сохраняет прямое значение слова и суровость предупреждения. Более слабое «тюремщикам» неоправданно смягчило бы текст, тогда как перевод не должен заранее разрешать более широкие вопросы о характере суда.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим притчевому и судебному контексту. Синтаксис краток и ясен; «истязатели» намеренно сохраняет суровую лексику оригинала.
