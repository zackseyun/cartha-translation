  text: τότε προσκαλεσάμενος αὐτὸν ὁ κύριος αὐτοῦ λέγει αὐτῷ· Δοῦλε πονηρέ, πᾶσαν τὴν ὀφειλὴν ἐκείνην ἀφῆκά σοι, ἐπεὶ παρεκάλεσάς με·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/032.yaml
  text: Then his master summoned him and said to him[a], ‘Wicked slave[b], I forgave you all that debt because you pleaded with me.’
translation:
  language: ru
  text: 'Тогда господин вызвал его и сказал ему: «Злой раб[a]! Я простил[b] тебе весь тот долг, потому что ты умолял меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуга». Греческое δοῦλος может обозначать как слугу, так и раба; здесь слово «раб» подчёркивает зависимость от господина, существенную для притчи.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «списал тебе весь тот долг». Греческий глагол может означать как «простить», так и освободить от долга или отменить его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественно передаёт временную последовательность событий в повествовании.
- source_word: προσκαλεσάμενος αὐτόν
  choice: позвал его
  rationale: Причастие обозначает, что господин вызвал раба к себе; «позвал» звучит естественно и не ослабляет его властного положения.
- source_word: ὁ κύριος αὐτοῦ
  choice: господин
  rationale: В контексте притчи речь идёт о хозяине раба, а не об употреблении κύριος как божественного титула.
- source_word: Δοῦλε πονηρέ
  choice: Злой раб
  rationale: δοῦλος здесь указывает на зависимое положение человека по отношению к господину, а πονηρός выражает нравственное осуждение.
- source_word: πᾶσαν τὴν ὀφειλὴν ἐκείνην
  choice: весь тот долг
  rationale: Точно и естественно передаёт как полноту прощённого долга, так и указательное значение ἐκείνην.
- source_word: ἀφῆκά σοι
  choice: Я простил тебе
  rationale: «Простил» сохраняет намеренное наложение образа отмены долга на тему нравственного прощения; коммерческий смысл пояснён в сноске.
- source_word: ἐπεὶ παρεκάλεσάς με
  choice: потому что ты умолял меня
  rationale: Передаёт причинную связь и настойчивую просьбу должника без добавления отсутствующих в тексте деталей.
theological_decisions:
- issue: Передача δοῦλος в отношениях господина и зависимого человека
  choice: раб
  alternative: слуга
  rationale: Имущественная и властная зависимость существенна для сюжета притчи; «слуга» мог бы чрезмерно смягчить эту связь. Возможный более мягкий эквивалент указан в сноске.
- issue: Передача ἀφίημι в контексте долга
  choice: простил
  alternative: списал / отменил
  rationale: Непосредственно имеется в виду освобождение от долга, однако глагол одновременно связывает финансовый образ притчи с темой прощения. «Простил» сохраняет эту богословскую многозначность, а долговое значение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, ясной повествовательной фразой и торжественно-нравственным звучанием прямой речи. Историческое настоящее λέγει передано прошедшим временем в соответствии с естественной русской повествовательной нормой.
