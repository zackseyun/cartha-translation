    rationale: Помимо расчёта по обязательствам, это выражение обычно означает «отомстить». Хотя контекст ограничивает смысл, безопаснее избрать финансово однозначную передачу συνᾶραι λόγον.
  - severity: low
    issue: Неестественная форма «было уподоблено»
    rationale: Русская аналитическая пассивная конструкция звучит тяжеловесно. «Уподоблено» сохраняет пассивно-сравнительный характер оригинала и лучше соответствует регистру.
  - severity: low
    issue: Порядок слов в названии
    rationale: «Царство Небесное» является естественной русской библейской формой для ἡ βασιλεία τῶν οὐρανῶν.
