  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ ὃς ἠθέλησεν συνᾶραι λόγον μετὰ τῶν δούλων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/023.yaml
  text: For this reason the kingdom of heaven has become like a king who wanted to settle accounts with his slaves[a][b].
translation:
  language: ru
  text: Поэтому Царство Небесное уподоблено царю, который захотел потребовать отчёта у своих рабов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «слугами»; греческое δοῦλοι обозначает людей, находящихся в подчинённом, несвободном положении.
    reason: alternative_reading
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь притчи с предшествующим учением и естественно звучит по-русски.
- source_word: ὡμοιώθη
  choice: было уподоблено
  rationale: Сохраняет пассивную форму аориста и явный характер сравнения, не сводя выражение к более общему «подобно».
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Небесное Царство
  rationale: Естественная и узнаваемая русская передача характерного для Матфея выражения о Божьем царствовании.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: царю
  rationale: βασιλεῖ уточняет ἀνθρώπῳ; по-русски одного слова «царю» достаточно, тогда как «человеку-царю» звучало бы неестественно.
- source_word: ἠθέλησεν
  choice: захотел
  rationale: Прямо и современно передаёт волю или намерение царя, не усиливая значение до окончательного решения.
- source_word: συνᾶραι λόγον
  choice: свести счёты
  rationale: 'Передаёт устойчивое финансовое значение греческого оборота: проверить расчёты и потребовать отчёта по обязательствам.'
- source_word: μετὰ τῶν δούλων αὐτοῦ
  choice: со своими рабами
  rationale: Слово «рабы» ясно передаёт подневольный статус δοῦλοι под властью царя, существенный для дальнейшего развития притчи.
theological_decisions:
- issue: Передача δοῦλος в царско-хозяйственном контексте притчи
  choice: рабы
  alternative: слуги
  rationale: Власть царя над этими людьми, долговые обязательства и последующая возможность продажи подчёркивают несвободный статус. Вариант «слуги» возможен по функции, но ослабляет эту сторону значения.
- issue: Форма сравнения Царства
  choice: было уподоблено
  alternative: подобно
  rationale: Пассивная формулировка сохраняет грамматическое напряжение оригинала и не превращает ὡμοιώθη в простую связку настоящего времени.
translation_notes:
  register: Современный литературный русский с достоинством притчевого повествования. «Свести счёты» употреблено в прямом финансовом смысле; контекст следующего стиха устраняет возможное переносное понимание. Заглавные буквы в «Небесное Царство» поддерживают привычную русскую библейскую норму.
