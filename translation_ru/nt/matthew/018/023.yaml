review_pass:
  verdict: revise
  source_fidelity: 'Смысловой каркас передан верно: Διὰ τοῦτο — «Поэтому», царский образ и рабы сохранены. Однако «было уподоблено» в русском языке тяжеловесно и создаёт неоправданное впечатление о завершённом внешнем акте уподобления; форма «уподоблено» лучше передаёт сравнительную формулу. «Свести счёты» допускает устойчивое переносное значение мести, поэтому в данном стихе предпочтительнее недвусмысленно финансовое «потребовать отчёта».'
  naturalness: «Небесное Царство» понятно, но обычный и более естественный для современного литературного библейского русского порядок слов — «Царство Небесное». «Потребовать отчёта у своих рабов» ясно выражает начало финансовой проверки и не вызывает посторонних ассоциаций.
  terminology: '«Рабы» обоснованно передаёт δοῦλοι в царско-долговом контексте. Сноска корректно отмечает допустимый функциональный вариант «слуги», но её формулировку следует согласовать с формой греческого слова: в тексте стоит δοῦλοι, не δοῦλοι как лемма; приводимая форма при этом допустима как цитата из текста. Термин «Царство Небесное» сохраняет традиционную матфеевскую формулу без доктринального расширения.'
  issues:
