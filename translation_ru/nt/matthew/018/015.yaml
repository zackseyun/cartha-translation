id: MAT.18.15
reference: Matthew 18:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἁμαρτήσῃ ⸂εἰς σὲ⸃ ὁ ἀδελφός σου, ⸀ὕπαγε ἔλεγξον αὐτὸν μεταξὺ σοῦ καὶ αὐτοῦ μόνου. ἐάν σου ἀκούσῃ, ἐκέρδησας τὸν ἀδελφόν σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/015.yaml
  text: But if your brother sins against you[a], go and reprove him between you and him alone. If he listens to you[c][b], you have gained your brother.
translation:
  language: ru
  text: Если же твой брат[b] согрешит против тебя[a], пойди и обличи его[c] наедине. Если он тебя послушает, ты приобрёл своего брата.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях слова «против тебя» отсутствуют: «Если же твой брат согрешит…»'
    reason: textual_variant
  - marker: b
    text: Слово «брат» здесь стоит в мужском роде и единственном числе; в данном контексте оно может обозначать и другого ученика Иисуса.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «укажи ему на его вину».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτήσῃ
  choice: согрешит
  rationale: Аорист конъюнктива после ἐὰν выражает общее условие; «согрешит» естественно сохраняет нравственно-религиозный смысл глагола.
- source_word: εἰς σέ
  choice: против тебя
  rationale: Так передаётся направленность проступка против собеседника; спорность наличия слов отражена в сноске.
- source_word: ἀδελφός σου
  choice: твой брат
  rationale: Сохранены мужской род и единственное число греческого выражения; возможное более широкое контекстуальное значение отмечено в сноске.
- source_word: ὕπαγε
  choice: пойди
  rationale: Краткий и естественный русский императив, вводящий требуемое действие.
- source_word: ἔλεγξον
  choice: обличи
  rationale: Глагол передаёт выявление проступка и указание человеку на его вину, не усиливая смысл до сурового осуждения.
- source_word: μεταξὺ σοῦ καὶ αὐτοῦ μόνου
  choice: наедине
  rationale: Естественно по-русски выражает требование разговора без посторонних, содержащееся в греческой фразе.
- source_word: ἀκούσῃ
  choice: послушает тебя
  rationale: Передаёт не просто физическое слышание, а благожелательное принятие сказанного, не доводя смысл до безусловного повиновения.
- source_word: ἐκέρδησας
  choice: ты приобрёл
  rationale: Сохраняет метафору приобретения в κερδαίνω и не добавляет прямо не выраженного значения «вернул».
theological_decisions:
- issue: Следует ли передавать ἀδελφός инклюзивно
  choice: твой брат
  alternative: брат или сестра; единоверец
  rationale: Основной текст сохраняет грамматически мужскую форму источника, а возможное более широкое применение к ученикам Иисуса поясняется в сноске.
- issue: Текстологический статус εἰς σέ
  choice: включить «против тебя» в основной текст
  alternative: 'опустить: «если твой брат согрешит»'
  rationale: SBLGNT включает эти слова; более краткое чтение существенно влияет на охват наставления и поэтому приводится в сноске.
- issue: Смысл приобретения брата
  choice: ты приобрёл своего брата
  alternative: ты вернул своего брата
  rationale: Выбранный вариант сохраняет метафору оригинала и не решает скрытую в ней смысловую напряжённость добавлением идеи возвращения.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным звучанием. «Обличи» сохраняет библейскую нравственную точность, а «наедине» устраняет неестественную кальку и ясно передаёт исключение посторонних.
