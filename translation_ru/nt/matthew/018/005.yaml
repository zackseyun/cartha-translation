base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/005.yaml
  text: And whoever receives one such child in my name receives me[a][b].
translation:
  language: ru
  text: И кто примет одного такого ребёнка во имя Моё, тот принимает Меня[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «радушно примет». Греческий глагол может означать «принять», «радушно принять» или «оказать гостеприимство».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «одного такого ребёнка»; в греческом тексте этого стиха нет прилагательного «маленький».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: кто
  rationale: Сочетание относительного местоимения с ἐάν выражает общее неопределённое условие; конструкция «кто… тот» естественно передаёт этот смысл по-русски.
- source_word: δέξηται / δέχεται
  choice: примет / принимает
  rationale: 'Повтор одного русского глагола сохраняет явное соответствие двух частей: принять ребёнка — значит принять Иисуса. Различие вида и времени естественно передаёт греческие аористный конъюнктив и настоящее время.'
- source_word: ἓν παιδίον τοιοῦτο
  choice: одного такого ребёнка
  rationale: Перевод сохраняет числительное и указание на ребёнка такого рода, связанное с ребёнком из ближайшего контекста. Прилагательное «маленький» не добавлено, поскольку в этом стихе его нет.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: во имя Моё
  rationale: Устойчивая и достаточно широкая формулировка передаёт действие, совершаемое в связи с именем, властью или принадлежностью Иисусу, не сводя выражение к одной трактовке.
- source_word: ἐμὲ
  choice: Меня
  rationale: Личное местоимение прямо сохраняет сильное отождествление принятия ребёнка с принятием самого Иисуса; конечная позиция придаёт ему естественное смысловое ударение.
theological_decisions:
- issue: Представительное отождествление ребёнка с Иисусом
  choice: Принять такого ребёнка во имя Иисуса — значит принять самого Иисуса.
  alternative: Смягчить высказывание до мысли, что таким поступком человек лишь оказывает честь Иисусу.
  rationale: Повтор δέχομαι при смене прямого дополнения с ребёнка на «Меня» создаёт прямое соответствие. Перевод сохраняет его, не добавляя отсутствующих в тексте сакраментальных или церковных выводов.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Порядок «кто… тот» делает общее условие ясным, а форма «во имя Моё» сохраняет узнаваемую библейскую формулу без архаизации остального предложения.
