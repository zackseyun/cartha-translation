  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὕτως οὐκ ἔστιν θέλημα ⸀ἔμπροσθεν τοῦ πατρὸς ⸀ὑμῶν τοῦ ἐν οὐρανοῖς ἵνα ἀπόληται ⸀ἓν τῶν μικρῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/014.yaml
  text: In the same way, it is not the will of your Father in heaven that even one of these little ones should perish.
translation:
  language: ru
  text: Так и ваш Небесный Отец не желает, чтобы погиб[a] хотя бы один из этих малых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потерялся». Греческий глагол может означать как «погибнуть», так и «потеряться»; непосредственный контекст рассказа о заблудившейся овце поддерживает второй оттенок.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Так и
  rationale: Естественно связывает вывод с предшествующим рассказом о заблудившейся овце и передаёт сопоставительное значение.
- source_word: οὐκ ἔστιν θέλημα ἔμπροσθεν τοῦ πατρὸς ὑμῶν
  choice: ваш Небесный Отец не желает
  rationale: Естественная русская передача идиоматического оборота о воле, существующей «пред» Отцом; смысл сохраняется без тяжеловесного буквального выражения «нет воли пред Отцом».
- source_word: τοῦ ἐν οὐρανοῖς
  choice: Небесный
  rationale: Краткая и привычная в современном литературном русском передача определения «Который на небесах».
- source_word: ἵνα ἀπόληται
  choice: чтобы погиб
  rationale: Передаёт серьёзность возможного исхода; глагол также допускает контекстуальное значение «потерялся», которое сохранено в сноске.
- source_word: ἓν τῶν μικρῶν τούτων
  choice: хотя бы один из этих малых
  rationale: «Хотя бы один» естественно подчёркивает единичность в отрицательном контексте, а «малых» не ограничивает смысл только детьми и сохраняет возможное обозначение незначительных или уязвимых учеников.
theological_decisions:
- issue: Значение ἀπόληται в связи с предшествующим рассказом о заблудившейся овце
  choice: погиб
  alternative: потерялся
  rationale: Глагол может указывать как на гибель, так и на утрату или состояние потерянности. Основной текст сохраняет более сильное предостережение, а сноска — оттенок, подсказанный непосредственным контекстом.
translation_notes:
  register: Современный литературный русский язык; формулировка проста и достойна по тону. «Небесный Отец» естественно передаёт греческое определение, а «эти малые» сохраняет метафорическую широту выражения.
