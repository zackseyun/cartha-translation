lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: подозвав
  rationale: 'Причастие аориста передаёт предшествующее действие: Иисус позвал ребёнка к Себе; «подозвав» естественно и точно выражает это по-русски.'
- source_word: παιδίον
  choice: ребёнка
  rationale: Нейтральное современное соответствие, сохраняющее значение малолетнего человека без ненужного уточнения пола или возраста.
- source_word: ἔστησεν
  choice: поставил
  rationale: Каузативный переходный аорист от ἵστημι здесь означает, что Иисус поставил ребёнка в определённое место, а не просто велел ему встать.
- source_word: ἐν μέσῳ αὐτῶν
  choice: посреди них
  rationale: 'Краткое и естественное соответствие пространственному выражению: среди собравшихся учеников.'
