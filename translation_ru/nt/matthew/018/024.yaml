  text: ἀρξαμένου δὲ αὐτοῦ συναίρειν ⸀προσηνέχθη ⸂αὐτῷ εἷς⸃ ὀφειλέτης μυρίων ταλάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/024.yaml
  text: And when he began to settle accounts[a], one debtor who owed ten thousand talents was brought to him.
translation:
  language: ru
  text: Когда он начал сводить счёты, к нему привели одного должника, который задолжал десять тысяч талантов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Талант был очень крупной денежно-весовой единицей; «десять тысяч талантов» в условиях притчи означает невообразимо огромный долг.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξαμένου δὲ αὐτοῦ
  choice: Когда он начал
  rationale: Родительный самостоятельный оборот задаёт временной фон главного действия; современная русская конструкция естественно передаёт это значение.
- source_word: συναίρειν
  choice: сводить счёты
  rationale: В данном финансовом контексте глагол означает проверять и приводить в порядок расчёты; выражение сохраняет бухгалтерский образ притчи.
- source_word: προσηνέχθη αὐτῷ
  choice: к нему привели
  rationale: Аорист страдательного залога указывает, что должника привели другие; активная неопределённо-личная конструкция естественна по-русски и сохраняет смысл пассива.
- source_word: εἷς ὀφειλέτης
  choice: одного должника
  rationale: Сохранено явно выраженное εἷς, вводящее один конкретный случай среди подлежащих расчёту.
- source_word: μυρίων ταλάντων
  choice: десять тысяч талантов
  rationale: Передано буквальное числовое значение μύριοι и сохранена историческая денежно-весовая единица без спорного пересчёта в современную валюту.
