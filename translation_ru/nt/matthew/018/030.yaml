  text: ὁ δὲ οὐκ ἤθελεν, ἀλλὰ ἀπελθὼν ἔβαλεν αὐτὸν εἰς φυλακὴν ἕως ⸀οὗ ἀποδῷ τὸ ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/030.yaml
  text: But he was not willing[a]; instead[c][b], he went away and threw him into prison until he should pay what was owed.
translation:
  language: ru
  text: Но тот не захотел[a], а пошёл и бросил его в тюрьму[b], пока тот не выплатит долг[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отказался»; буквально: «не захотел».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «посадил его в тюрьму»; греческий глагол выражен резче — буквально: «бросил его в тюрьму».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «пока тот не выплатит сумму долга»; буквально: «пока не отдаст то, что должно быть уплачено».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Но тот
  rationale: Субстантивированное ὁ отсылает к первому рабу, а δέ вводит противопоставление; «Но тот» естественно сохраняет обе функции.
- source_word: οὐκ ἤθελεν
  choice: не захотел
  rationale: Передаёт волевой оттенок θέλω и в данном контексте звучит естественнее буквального «не был согласен», не усиливая выражение до однозначного «отказался».
- source_word: ἀλλὰ
  choice: а
  rationale: После отрицания русская конструкция «не захотел, а…» ясно и естественно выражает сильное противопоставление.
- source_word: ἀπελθὼν
  choice: пошёл
  rationale: Аористное причастие передано личной формой, сохраняя последовательность действий без тяжеловесного деепричастного оборота.
- source_word: ἔβαλεν αὐτὸν εἰς φυλακήν
  choice: бросил его в темницу
  rationale: «Бросил» сохраняет резкость βάλλω, а «темница» в притчевом повествовании звучит достойно и понятно, не будучи непонятным архаизмом.
- source_word: ἕως οὗ
  choice: пока не
  rationale: Естественно передаёт временной предел заключения в русском языке.
- source_word: ἀποδῷ
  choice: не отдаст
  rationale: После «пока не» совершенный вид передаёт ожидаемое полное исполнение обязательства; ἀποδίδω здесь означает возвратить или уплатить должное.
- source_word: τὸ ὀφειλόμενον
  choice: всё, что должен
  rationale: Передаёт субстантивированное причастие «то, что причитается/что он должен» и естественно связывается с глаголом «отдать».
