source:
  edition: SBLGNT
  text: Πάλιν ⸀ἀμὴν λέγω ὑμῖν ὅτι ἐὰν δύο ⸂συμφωνήσωσιν ἐξ ὑμῶν⸃ ἐπὶ τῆς γῆς περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται, γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/019.yaml
  text: Again[a], truly I tell you, if two of you agree on earth about any matter they ask for[c][b], it will be done for them by my Father in heaven.
translation:
  language: ru
  text: 'И ещё истинно говорю вам: если двое из вас на земле придут к согласию относительно любого дела, о котором они попросят[a], это будет исполнено для них Моим Отцом, Который на небесах[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В ближайшем контексте Иисус говорит об исправлении согрешившего и о власти общины (18:15–18), хотя формулировка этого стиха сама по себе широко говорит о согласии относительно просьбы.
    reason: cross_reference
  - marker: b
    text: 'Буквально: «на небесах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: И ещё
  rationale: Передаёт присоединение нового торжественного высказывания к предыдущему наставлению; по-русски естественнее, чем буквальное «снова».
- source_word: ἀμὴν λέγω ὑμῖν
  choice: истинно говорю вам
  rationale: Сохраняет торжественную и подчёркнутую силу устойчивой формулы Иисуса в понятном современном русском языке.
- source_word: ἐὰν δύο συμφωνήσωσιν ἐξ ὑμῶν
  choice: если двое из вас… согласятся
  rationale: συμφωνέω обозначает согласие; «двое из вас» естественно передаёт ἐξ ὑμῶν.
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Точно и естественно передаёт земную сферу в соотнесении с Отцом на небесах.
- source_word: περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται
  choice: просить о чём бы то ни было
  rationale: Передаёт широту παντὸς πράγματος и неопределённость конструкции с ἐάν; объединение согласия и просьбы делает сложную греческую конструкцию естественной по-русски, не сужая её смысла.
- source_word: γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου
  choice: то это совершит для них Мой Отец
  rationale: Активная русская конструкция ясно передаёт результат и исходящее от Отца действие; «совершит» ближе к γίνομαι, чем добавляющее идею дара «даст».
- source_word: τοῦ ἐν οὐρανοῖς
  choice: Который на небесах
  rationale: Сохраняет грамматическое множественное число οὐρανοῖς и традиционно понятное, достойное русское выражение.
theological_decisions:
- issue: Объём обещания в контексте
  choice: Передать высказывание широко, не добавляя в основной текст ограничений относительно церковной дисциплины, молитвы или Божьей воли.
  alternative: Прямо ограничить обещание решениями общины либо истолковать его как безусловное обещание исполнения любых молитвенных просьб.
  rationale: Ближайший контекст говорит об исправлении согрешившего и власти общины (18:15–18), а αἰτέω указывает на просьбу, вероятно обращённую к Богу. Однако сам стих не формулирует дополнительных ограничений; перевод сохраняет широту слов и напряжение с контекстом.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Сохранено «истинно» как узнаваемая формула особого утверждения; избегнуты как архаичное «аминь, говорю вам», так и конфессионально нагруженные пояснения в основном тексте.
