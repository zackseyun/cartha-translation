  text: ἀμὴν λέγω ὑμῖν, ὅσα ⸀ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ⸀ἐν οὐρανῷ καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ⸁ἐν οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/018.yaml
  text: Truly I tell you[a], whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.
translation:
  language: ru
  text: 'Истинно говорю вам: всё, что вы свяжете на земле, будет уже связано на небе, и всё, что вы развяжете на земле, будет уже развязано на небе.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен более традиционный перевод: «будет связано на небе… будет развязано на небе». Однако греческое сочетание будущей формы глагола с причастием перфекта может указывать на состояние, уже установленное на небе.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Истинно
  rationale: Слово вводит торжественное и авторитетное утверждение. «Истинно» ясно передаёт его функцию в современном русском тексте; транслитерация «аминь» здесь менее прозрачна.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Естественная русская формула прямого обращения, сохраняющая настоящее время и авторитетный тон высказывания.
- source_word: ὅσα ἐὰν
  choice: всё, что
  rationale: Передаёт неопределённо-обобщающее значение конструкции и её широкий охват без стилистической тяжеловесности.
- source_word: δήσητε
  choice: свяжете
  rationale: Сохраняет основную метафору глагола δέω и не сужает смысл до одного лишь юридического «запретите».
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Естественно передаёт пространственное противопоставление земли и неба.
- source_word: ἔσται δεδεμένα
  choice: будет уже связано
  rationale: Сочетание будущей формы εἰμί с причастием перфекта обозначает будущее состояние как результат совершившегося действия. Частица «уже» помогает передать эту временную и результативную соотнесённость, не делая русский текст неестественным.
- source_word: ἐν οὐρανῷ
  choice: на небе
  rationale: Современное и естественное русское обозначение небесной, божественной сферы в противопоставлении земле.
- source_word: λύσητε
  choice: развяжете
  rationale: Сохраняет образную противоположность «свяжете — развяжете» и не ограничивает значение только разрешением или освобождением.
- source_word: ἔσται λελυμένα
  choice: будет уже развязано
  rationale: Параллельно первой части передаёт будущее состояние, возникшее в результате уже совершившегося действия.
theological_decisions:
- issue: Временной и богословский смысл формулы о связывании и развязывании
  choice: «будет уже связано / будет уже развязано на небе»
  alternative: «будет связано / будет развязано на небе»
  rationale: Греческая конструкция ἔσται с перфектным страдательным причастием допускает понимание будущего состояния как результата предшествующего действия. Перевод сохраняет возможную мысль о соответствии земного решения тому, что уже установлено на небе, но не закрепляет какую-либо конфессиональную теорию церковной власти.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Сохранены парная метафора «связать — развязать», обращение во множественном числе и смысловая напряжённость между земным действием и небесной действительностью.
