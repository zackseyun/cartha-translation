  source_fidelity: 'Текст точно передаёт все основные элементы греческого оригинала: торжественную формулу ἀμὴν λέγω ὑμῖν, обобщающее ὅσα ἐὰν, параллельные образы «свяжете — развяжете», противопоставление земли и неба, а также конструкцию ἔσται с перфектными страдательными причастиями. «Будет уже связано / будет уже развязано» является допустимой и ясной русской передачей результативного состояния, выраженного греческой конструкцией, не выдавая спорный оттенок за единственно возможный.'
