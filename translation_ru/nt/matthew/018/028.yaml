source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ ὁ δοῦλος ἐκεῖνος εὗρεν ἕνα τῶν συνδούλων αὐτοῦ ὃς ὤφειλεν αὐτῷ ἑκατὸν δηνάρια, καὶ κρατήσας αὐτὸν ἔπνιγεν λέγων· ⸀Ἀπόδος εἴ τι ὀφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/028.yaml
  text: But when that slave went out[a], he found one of his fellow slaves who owed him a hundred denarii, and seizing him, he began choking him, saying[b], ‘Pay back whatever you owe.’
translation:
  language: ru
  text: 'Но когда тот раб вышел, он нашёл одного из своих товарищей по рабству, который был должен ему сто динариев[b]. Схватив его, он стал душить его, говоря: «Верни всё, что должен!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Верни, если ты что-нибудь должен».'
    reason: lexical_alternative
  - marker: b
    text: Динарий обычно соответствовал дневной плате наёмного работника или воина.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλος
  choice: раб
  rationale: Передаёт несвободное положение человека и обусловленную им власть господина; более мягкое «слуга» здесь скрыло бы важную для притчи социальную реальность.
- source_word: ἐξελθὼν δὲ
  choice: Но тот раб, выйдя
  rationale: Деепричастная конструкция естественно передаёт предшествующее действие аориста, а «но» сохраняет повествовательный переход и контраст.
- source_word: συνδούλων
  choice: товарищей-рабов
  rationale: Сохраняет как значение совместного положения, выраженное σύν-, так и смысл δοῦλος; необычность составного обозначения оправдана необходимостью не смягчать социальный статус.
- source_word: ὤφειλεν
  choice: был должен
  rationale: Естественное современное обозначение денежного долга; форма также передаёт продолжительное состояние, выраженное имперфектом.
- source_word: ἑκατὸν δηνάρια
  choice: сто динариев
  rationale: Историческое название денежной единицы сохраняет культурную среду и контраст с огромным долгом в предыдущей части притчи.
- source_word: κρατήσας
  choice: схватив
  rationale: Передаёт резкое и силовое физическое действие.
- source_word: ἔπνιγεν
  choice: стал душить
  rationale: Передаёт начавшееся и разворачивающееся насильственное действие, выраженное имперфектом.
- source_word: λέγων
  choice: говорил
  rationale: Сохраняет сопутствующее продолжающееся действие без добавления толкования вроде «требовал».
- source_word: Ἀπόδος
  choice: Верни
  rationale: Краткий повелительный глагол естественно звучит как резкое требование возвратить долг.
- source_word: εἴ τι ὀφείλεις
  choice: всё, что должен
  rationale: Идиоматично передаёт неопределённое «если что-нибудь / сколько бы ни был должен», не превращая выражение в указание на точно названную сумму; буквальная конструкция отмечена в сноске.
theological_decisions:
- issue: Передача δοῦλος в повествовании притчи
  choice: раб / товарищи-рабы
  alternative: слуга / товарищи по службе
  rationale: В сцене существенны несвободное положение, принадлежность господину и принуждение. «Раб» точнее сохраняет эту социальную и повествовательную напряжённость, не вводя конфессионального толкования.
- issue: Неопределённость εἴ τι ὀφείλεις
  choice: всё, что должен
  alternative: если что-нибудь должен
  rationale: Основной текст передаёт угрожающее неопределённое требование естественным русским выражением, а не устраняет его, называя конкретную сумму предметом требования. Более буквальная синтаксическая форма дана в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, напряжённым повествованием. Сохранены исторический термин «динарий», резкость насилия и несвободный статус персонажей. Местоимение «ты» в требовании опущено как естественно подразумеваемое русской формой глагола.
