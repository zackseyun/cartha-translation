id: MAT.18.21
reference: Matthew 18:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τότε προσελθὼν ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, ποσάκις ἁμαρτήσει εἰς ἐμὲ ὁ ἀδελφός μου καὶ ἀφήσω αὐτῷ; ἕως ἑπτάκις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/021.yaml
  text: Then Peter came up to him and said[a], “Lord, how many times will my brother sin against me, and I forgive him? Up to seven times?”
translation:
  language: ru
  text: 'Тогда Пётр подошёл к Нему и сказал: «Господи, сколько раз мой брат[a] согрешит против меня, и я прощу его? До семи раз?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мой брат или сестра»; по-гречески буквально «мой брат» (мужской род, единственное число), но в данном контексте это выражение может шире обозначать другого ученика.'
    reason: Лексическая альтернатива и пояснение возможного контекстуального объёма значения.
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Передаёт временно-последовательный переход и естественно продолжает повествование.
- source_word: προσελθὼν αὐτῷ
  choice: подошёл к Нему
  rationale: Причастная конструкция обозначает приближение Петра к Иисусу; в русском естественно передана личной формой глагола.
- source_word: ὁ Πέτρος εἶπεν
  choice: Пётр ... сказал
  rationale: Сохраняет обычный глагол речи εἶπεν, не заменяя его более истолковывающим «спросил».
- source_word: Κύριε
  choice: Господи
  rationale: Традиционная и современно понятная форма обращения, сохраняющая уважительный и возможный богословский смысл κύριος.
- source_word: ποσάκις
  choice: сколько раз
  rationale: Речь идёт о числе повторений, что подтверждается последующим предложением предела — семи раз.
- source_word: ἁμαρτήσει εἰς ἐμὲ
  choice: согрешит против меня
  rationale: Сохраняет будущее время ἁμαρτήσει и направленность проступка, выраженную εἰς ἐμέ.
- source_word: ὁ ἀδελφός μου
  choice: мой брат
  rationale: Точно передаёт мужской род и единственное число исходного выражения, не исключая более широкого контекстуального употребления.
- source_word: καὶ ἀφήσω αὐτῷ
  choice: и я прощу его
  rationale: ἀφίημι в данном нравственном контексте означает прощение; будущее время и сочинительная связь сохранены.
- source_word: ἕως ἑπτάκις
  choice: До семи раз?
  rationale: Передаёт предлагаемый Петром верхний предел без усиления или поясняющего истолкования.
theological_decisions:
- issue: Контекстуальный объём значения ἀδελφός
  choice: В основном тексте — «мой брат».
  alternative: «мой брат или сестра»; «мой единоверец»; «другой ученик»
  rationale: Греческая форма стоит в мужском роде и единственном числе. Она может обозначать любого члена общины учеников, однако расширительный смысл не следует незаметно подставлять в основной текст; он отмечен в сноске.
- issue: Модальность прощения в вопросе Петра
  choice: 'Сохранена форма будущего времени: «и я прощу его».'
  alternative: «и я должен его прощать»; «мне прощать его»
  rationale: В исходном тексте стоит будущее ἀφήσω, а не явно выраженная конструкция долженствования. Несколько необычное напряжение вопроса сохранено без добавления модального значения.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис по возможности сохраняет последовательность греческих будущих форм и не добавляет отсутствующего в источнике долженствования. Местоимение «Нему» написано с прописной буквы согласно устойчивой русской библейской издательской практике.
