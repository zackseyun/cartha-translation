  text: ἐὰν δὲ παρακούσῃ αὐτῶν, εἰπὸν τῇ ἐκκλησίᾳ· ἐὰν δὲ καὶ τῆς ἐκκλησίας παρακούσῃ, ἔστω σοι ὥσπερ ὁ ἐθνικὸς καὶ ὁ τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/017.yaml
  text: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like the Gentile and the tax collector.
translation:
  language: ru
  text: Если же он откажется прислушаться к ним, скажи об этом общине[a]. А если он откажется прислушаться и к общине, пусть будет для тебя как язычник и сборщик налогов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «церковь»; или: «собрание». Греч. экклесиа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσῃ
  choice: откажется слушать
  rationale: В данном контексте слово означает не простую неспособность услышать, а отказ прислушаться. Этот перевод естественно передаёт волевой оттенок, не усиливая его до прямого «не подчинится».
- source_word: εἰπὸν
  choice: скажи об этом
  rationale: 'Императив вводит следующий шаг: сообщить общине о деле. Местоименное «об этом» естественно восполняет подразумеваемый из контекста предмет сообщения, не добавляя новых подробностей.'
- source_word: ἐκκλησίᾳ / ἐκκλησίας
  choice: общине / общину
  rationale: ἐκκλησία здесь обозначает собранное сообщество. «Община» понятно современному читателю и не навязывает позднейших институциональных или конфессиональных смыслов; традиционный вариант «церковь» и более буквальное «собрание» сохранены в сноске.
- source_word: ἔστω σοι
  choice: пусть будет для тебя
  rationale: Сохраняет повелительную конструкцию и личный дательный σοι, не превращая выражение в более истолковательное «считай его» или «обращайся с ним».
- source_word: ὥσπερ
  choice: как
  rationale: Прямо и естественно передаёт сравнение, не превращая его в поясняющую формулу.
- source_word: ὁ ἐθνικὸς
  choice: язычник
  rationale: В иудейском контексте обозначает человека из народов вне заветного сообщества. «Язычник» — традиционный и понятный русский эквивалент, хотя он может включать религиозный оттенок; в данном контексте этот оттенок уместен и не требует поясняющей перифразы.
- source_word: ὁ τελώνης
  choice: сборщик налогов
  rationale: Передаёт профессию понятным современным выражением. Определённый артикль имеет обобщённо-представительное значение и не требует отдельного указательного элемента в русском.
theological_decisions:
- issue: Передача ἐκκλησία в наставлении Иисуса о разбирательстве внутри сообщества
  choice: община
  alternative: церковь; собрание
  rationale: «Община» сохраняет смысл сообщества, к которому следует обратиться, и не вносит в текст конкретную позднейшую модель церковного устройства. Возможные переводы отмечены в сноске.
- issue: Смысл отношения к человеку, отказавшемуся слушать общину
  choice: пусть будет для тебя как язычник и сборщик налогов
  alternative: обращайся с ним как с язычником и сборщиком налогов; считай его посторонним
  rationale: Сохранены сравнение и личное «для тебя». Текст не превращён в развёрнутую процедурную формулу и не уточняет сверх сказанного, какие именно действия должны последовать.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Повтор «откажется слушать» намеренно сохранён как структурный элемент стиха; подразумеваемый объект после «скажи» выражен естественным русским оборотом «об этом».
