base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/008.yaml
  text: But what did you go out to see? A man dressed in soft clothes? Look[b][a], those who wear soft clothes are in the houses of kings.
translation:
  language: ru
  text: Но что вы вышли посмотреть? Человека, одетого в мягкие одежды?[a] Вот, те, кто носит мягкие одежды, находятся в домах царей.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одетого в изысканные одежды». Греческое выражение буквально говорит о «мягких» одеждах и подразумевает тонкую, роскошную одежду.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «находятся во дворцах царей». Буквально: «находятся в домах царей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт противопоставление и продолжает ряд риторических вопросов Иисуса естественным современным русским союзом.
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: на что вы вышли посмотреть
  rationale: Сохраняет вопросительное τί и цель выхода, выраженную инфинитивом ἰδεῖν; конструкция естественна по-русски и поддерживает риторический повтор.
- source_word: ἄνθρωπον
  choice: на человека
  rationale: Точно передаёт существительное в единственном числе; непосредственный контекст указывает на Иоанна, но имя здесь не подставляется.
- source_word: ἐν μαλακοῖς ἠμφιεσμένον
  choice: одетого в мягкие одежды
  rationale: Сохраняет буквальный образ «мягких» вещей/одежд и значение причастия «одетый», не сводя подразумеваемую роскошь к единственно возможному толкованию.
- source_word: ἰδοὺ
  choice: Вот
  rationale: Современный и достойный русский указательно-побудительный эквивалент, сохраняющий риторическое привлечение внимания без архаизма «се».
- source_word: οἱ τὰ μαλακὰ φοροῦντες
  choice: те, кто носит мягкие одежды
  rationale: Передаёт субстантивированное причастие и обычное ношение; повтор «мягкие одежды» сохраняет лексическую связь с предыдущим вопросом.
- source_word: ἐν τοῖς οἴκοις τῶν βασιλέων εἰσίν
  choice: живут в царских домах
  rationale: «Царские дома» близко отражает буквальное «дома царей» и звучит естественнее; «живут» контекстуально передаёт нахождение людей при царских дворах, тогда как буквальное «находятся» здесь тяжелее.
