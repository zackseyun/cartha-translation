  text: ἀμὴν λέγω ὑμῖν, οὐκ ἐγήγερται ἐν γεννητοῖς γυναικῶν μείζων Ἰωάννου τοῦ βαπτιστοῦ· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τῶν οὐρανῶν μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/011.yaml
  text: Truly I say to you[a], among those born of women no one greater than John the Baptist has arisen[c][b]; yet the least in the kingdom of heaven is greater than he.
translation:
  language: ru
  text: 'Истинно говорю вам: среди рождённых женщинами[a] не появлялся никто, превосходящий Иоанна Крестителя[b]; но тот, кто меньше в Царстве Небесном[c], превосходит его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «среди рождённых женщинами» — семитский оборот, означающий «среди людей».
    reason: cultural_note
  - marker: b
    text: Греческий глагол может также означать «был воздвигнут» или «возник». Здесь, вероятнее всего, имеется в виду появление человека на исторической сцене, а не воскресение.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «меньший». В греческом употреблена сравнительная форма; в данном контексте она может обозначать того, кто занимает меньшее или наименьшее положение в Царстве Небесном.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Истинно говорю вам
  rationale: Передаёт торжественную авторитетную формулу естественным и узнаваемым литературным русским языком; «аминь» в повествовательной речи было бы менее прозрачно.
- source_word: οὐκ ἐγήγερται
  choice: не восставал
  rationale: Сохраняет образное значение появления или выступления на исторической сцене и не сужает смысл до простого рождения; возможная неоднозначность отмечена в сноске.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: среди рождённых женщинами
  rationale: Сохраняет семитскую форму выражения, понятную в контексте как обозначение людей.
- source_word: μείζων Ἰωάννου τοῦ βαπτιστοῦ
  choice: никто больше Иоанна Крестителя
  rationale: Естественно воспроизводит отрицательную сравнительную конструкцию, не уточняя, в каком именно отношении Иоанн назван великим.
- source_word: ὁ δὲ μικρότερος
  choice: но меньший
  rationale: Сохраняет сравнительную форму греческого μικρότερος и её некоторую смысловую открытость; она может обозначать меньшего по положению или наименьшего.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: в Царстве Небесном
  rationale: Устоявшаяся и естественная русская передача характерного для Матфея выражения, без неидиоматичного буквального множественного числа «небес».
- source_word: μείζων αὐτοῦ ἐστιν
  choice: больше его
  rationale: Прямо сохраняет парадоксальное сравнение и не вводит толкования основания этого превосходства.
theological_decisions:
- issue: Соотношение величия Иоанна и положения меньшего в Царстве
  choice: Оставить парадоксальное утверждение без пояснения, в каком отношении меньший в Царстве больше Иоанна.
  alternative: Объяснить превосходство как преимущество эпохи нового завета, положение в истории спасения или личный духовный статус.
  rationale: Сам стих не раскрывает основания сравнения; его уточнение внесло бы в перевод определённое богословское толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формула «Истинно говорю вам» и выражение «рождённые женщинами» сохраняют текстуру исходного изречения; синтаксис остаётся ясным для обычного современного читателя.
