  text: ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/015.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: ru
  text: У кого есть уши, пусть слышит.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто имеет уши, пусть слышит». В греческом употреблено обобщающее выражение в единственном числе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: У кого есть
  rationale: Субстантивированное сочетание артикля с причастием имеет обобщающее значение. Русская конструкция «у кого есть» естественно передаёт обращение к любому человеку, не вводя неуклюжее «тот, кто имеет».
- source_word: ὦτα
  choice: уши
  rationale: Греческое слово стоит во множественном числе; «уши» формально точно и сохраняет идиому, призывающую к внимательному восприятию.
- source_word: ἀκουέτω
  choice: пусть слышит
  rationale: Форма третьего лица единственного числа настоящего времени повелительного наклонения естественно передаётся как «пусть слышит». Глагол «слышать» сохраняет смысловую широту оригинала, включая не только восприятие, но и внимательное принятие сказанного.
theological_decisions:
- issue: Обобщающее выражение в мужском роде единственного числа
  choice: У кого есть уши, пусть слышит.
  alternative: Кто имеет уши, да услышит.
  rationale: Перевод сохраняет единственное число сказуемого и общий смысл греческой конструкции, но избегает архаичного «да услышит» и тяжеловесного «имеет уши». Богословская открытость призыва ко всякому слушателю не сужается.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная и достойная формулировка. Сохранена традиционная библейская идиома «уши — слышать», без архаизма «да услышит».
