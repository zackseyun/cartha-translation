  text: πάντες γὰρ οἱ προφῆται καὶ ὁ νόμος ἕως Ἰωάννου ἐπροφήτευσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/013.yaml
  text: For all the prophets and the Law prophesied until John[a].
translation:
  language: ru
  text: Ведь все пророки и Закон пророчествовали до Иоанна[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вплоть до Иоанна»; или: «до времени Иоанна». Эти слова могут представлять Иоанна как завершение пророческого свидетельства или как рубеж, обозначающий переход к новому этапу.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: все
  rationale: Определяет пророков как целую совокупность; «все» — естественное и точное соответствие.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительно-обосновывающую связь с предыдущей мыслью и естественно звучит в современном русском языке.
- source_word: οἱ προφῆται
  choice: пророки
  rationale: Обычное русское обозначение тех, кто пророчески возвещает Божье слово.
- source_word: ὁ νόμος
  choice: Закон
  rationale: Здесь имеется в виду признанный корпус Писания — Тора, а не закон вообще; прописная буква помогает обозначить это без добавления толкования.
- source_word: ἕως Ἰωάννου
  choice: до Иоанна
  rationale: 'Передаёт временной предел и сохраняет неоднозначность: Иоанн может пониматься либо как завершение пророческого свидетельства, либо как рубеж перехода.'
- source_word: ἐπροφήτευσαν
  choice: пророчествовали
  rationale: Прямо передаёт аорист глагола προφητεύω и сохраняет олицетворение, при котором не только пророки, но и Закон пророчествовал.
theological_decisions:
- issue: Следует ли понимать ὁ νόμος как закон вообще или как название корпуса Писания
  choice: Закон
  alternative: закон
  rationale: Сочетание с пророками указывает на Писание Израиля, поэтому прописная буква ясно передаёт каноническую отсылку.
- issue: Включает ли выражение ἕως Ἰωάννου Иоанна в пророческую эпоху или обозначает её конечную границу
  choice: до Иоанна
  alternative: вплоть до Иоанна; до времени Иоанна
  rationale: Греческая формулировка не устраняет этой неоднозначности; основной перевод не навязывает одно богословское решение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. «Ведь» естественно передаёт пояснительное γὰρ; порядок «пророки и Закон» сохранён по греческому тексту, как и намеренное олицетворение Закона.
