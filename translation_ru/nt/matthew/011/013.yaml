  source_fidelity: '«Ведь все пророки и Закон пророчествовали до Иоанна[a]» точно передаёт все основные элементы греческого текста: πάντες, пояснительное γάρ, пару «пророки и Закон», временную границу ἕως Ἰωάννου и глагол ἐπροφήτευσαν. Олицетворённое употребление «Закон пророчествовал» сохранено без сглаживания.'
  naturalness: Фраза естественна для современного литературного русского языка и при этом сохраняет уместное библейское достоинство. «Ведь» хорошо передаёт пояснительную функцию γάρ в данном контексте; «пророчествовали» при общем подлежащем «пророки и Закон» звучит намеренно образно, как и в оригинале.
  terminology: «Пророки» и «Закон» выбраны последовательно и уместно. Прописная буква в слове «Закон» ясно обозначает отсылку к корпусу Писания, не превращая её в избыточное толкование. Передача «до Иоанна» сохраняет исходную неоднозначность относительно того, включён ли Иоанн как кульминация или обозначает рубеж.
