id: MAT.11.29
reference: Matthew 11:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς καὶ μάθετε ἀπ’ ἐμοῦ, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/029.yaml
  text: Take my yoke upon you and learn from me[a], because I am gentle and humble in heart, and you will find rest for your souls.
translation:
  language: ru
  text: Возьмите на себя Моё ярмо и учитесь у Меня, потому что Я кроток и смирен сердцем[a], и вы обретёте покой для своих душ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мягок и смирен в сердце».'
    reason: Лексически возможная более буквальная передача πραΰς и τῇ καρδίᾳ; основной вариант звучит естественнее и сохраняет библейский регистр.
lexical_decisions:
- source_word: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς
  choice: Возьмите на себя Моё ярмо
  rationale: Передаёт повеление принять ярмо на себя и сохраняет центральный конкретный образ, не сводя его к отвлечённому подчинению.
- source_word: μάθετε ἀπ’ ἐμοῦ
  choice: учитесь у Меня
  rationale: Естественно передаёт как обучение у Иисуса, так и следование Ему в качестве учеников.
- source_word: ὅτι
  choice: потому что
  rationale: 'Союз имеет здесь пояснительно-причинное значение: качества Иисуса объясняют, почему у Него следует учиться.'
- source_word: πραΰς
  choice: кроток
  rationale: «Кроток» выражает мягкость и отсутствие суровости, не подразумевая слабости; слово понятно и укоренено в библейском русском языке.
- source_word: ταπεινὸς τῇ καρδίᾳ
  choice: смирен сердцем
  rationale: Сохраняет характеристику внутреннего расположения и краткую форму греческого выражения.
- source_word: εὑρήσετε ἀνάπαυσιν
  choice: вы обретёте покой
  rationale: Будущее время сохраняет обещание, а «обрести покой» естественно и передаёт библейскую образность отдыха и успокоения.
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: для своих душ
  rationale: Идиоматично передаёт дательный падеж и сохраняет ψυχή как «душа», то есть внутреннюю жизнь и личность человека.
theological_decisions:
- issue: 'Самоописание Иисуса: πραΰς ... καὶ ταπεινὸς τῇ καρδίᾳ'
  choice: Я кроток и смирен сердцем
  alternative: Я мягок и смирен в сердце
  rationale: Основной вариант сохраняет личное самоописание Иисуса, внутренний характер смирения и напряжение между Его властью и кротостью, не истолковывая эти качества как слабость.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским, но не архаичным звучанием. Метафора ярма и слово «души» сохранены. Местоимение «вы» добавлено перед будущим сказуемым ради ясного и плавного русского синтаксиса.
