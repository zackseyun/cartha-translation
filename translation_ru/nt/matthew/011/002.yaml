  text: Ὁ δὲ Ἰωάννης ἀκούσας ἐν τῷ δεσμωτηρίῳ τὰ ἔργα τοῦ χριστοῦ πέμψας ⸀διὰ τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/002.yaml
  text: When John heard in prison about the works of the Messiah[a], he sent word through his disciples
translation:
  language: ru
  text: Иоанн, услышав в темнице о делах Мессии[a], послал через своих учеников весть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа».'
    reason: Сохраняется традиционная передача титула Χριστός как допустимый вариант.
lexical_decisions:
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Частица обозначает переход в повествовании; в современном русском он естественно передаётся самим началом нового предложения без добавления временного «тогда» или противительного «но».
- source_word: ἀκούσας
  choice: услышав
  rationale: Деепричастие естественно передаёт предшествующее действие аористного причастия и сохраняет компактность греческой конструкции.
- source_word: ἐν τῷ δεσμωτηρίῳ
  choice: в темнице
  rationale: Передаёт место заключения в понятном и достойном библейском регистре; в контексте ясно, что Иоанн находился в заключении.
- source_word: τὰ ἔργα
  choice: о делах
  rationale: «Дела» сохраняет широкое значение ἔργα, охватывающее совершённые Иисусом могущественные деяния и прочие проявления его служения.
- source_word: τοῦ χριστοῦ
  choice: Мессии
  rationale: Здесь Χριστός употреблено как титул Помазанника, а не как личное имя; «Мессия» ясно передаёт его смысл и иудейский контекст.
- source_word: πέμψας
  choice: послал
  rationale: Глагол означает отправление людей; адресат и содержание поручения раскрываются в следующем стихе, поэтому их не следует полностью вносить из последующего контекста.
- source_word: διὰ τῶν μαθητῶν αὐτοῦ
  choice: послал к нему своих учеников
  rationale: По засвидетельствованному чтению SBLGNT διά с родительным может обозначать посредство, однако в естественном русском отправление поручения через учеников выражено конструкцией с «послал»; «к нему» лишь делает понятным направление действия, заданное последующим вопросом, но не добавляет его содержание.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном контексте слово функционирует как титул ожидаемого Помазанника; перевод «Мессия» сохраняет смысл титула. Традиционный вариант «Христос» дан в примечании.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. «Темница» выбрана вместо разговорного «тюрьма». Синтаксис остаётся кратким и подготавливает прямую речь следующего стиха.
