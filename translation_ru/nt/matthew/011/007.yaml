  text: Τούτων δὲ πορευομένων ἤρξατο ὁ Ἰησοῦς λέγειν τοῖς ὄχλοις περὶ Ἰωάννου· Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/007.yaml
  text: 'As these men were going away[b][a], Jesus began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed being shaken by the wind?”'
translation:
  language: ru
  text: 'Когда они уходили, Иисус начал говорить народу об Иоанне: «На что вы ходили смотреть в пустыню? На тростник, колеблемый ветром?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτων δὲ πορευομένων
  choice: Когда они уходили
  rationale: Родительный самостоятельный оборот обозначает одновременное действие. Местоимение естественно отсылает к ученикам Иоанна из предыдущего контекста, не добавляя отсутствующего в греческом существительного.
- source_word: ἤρξατο ὁ Ἰησοῦς λέγειν
  choice: Иисус начал говорить
  rationale: Сохраняется начинательное значение конструкции ἄρχομαι с инфинитивом; «говорить» естественно вводит последующую речь.
- source_word: τοῖς ὄχλοις
  choice: народу
  rationale: Хотя в греческом стоит множественное число, в данном повествовательном контексте русское собирательное «народу» звучит естественно и обозначает собравшихся людей.
- source_word: περὶ Ἰωάννου
  choice: об Иоанне
  rationale: Предлог περί с родительным обозначает тему речи.
- source_word: Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι;
  choice: На что вы ходили смотреть в пустыню?
  rationale: Τί понимается как вопрос «что?», а не «зачем?». Оборот «на что ... смотреть» естественно связывает вопрос с последующим винительным κάλαμον и передаёт целенаправленное наблюдение, выраженное θεάσασθαι.
- source_word: κάλαμον
  choice: на тростник
  rationale: Обычное значение κάλαμος — «тростник»; предлог «на» обусловлен русским управлением глагола «смотреть».
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: колеблемый ветром
  rationale: Страдательное причастие сохраняет образ тростника, приводимого в движение ветром, и формально соответствует греческой конструкции.
theological_decisions:
- issue: Кого обозначает Τούτων («они»)
  choice: Сохранено местоименное указание «они»
  alternative: «ученики Иоанна» или «эти люди»
  rationale: Предыдущий контекст позволяет распознать учеников Иоанна, но сам стих их прямо не называет; местоимение сохраняет способ выражения оригинала без лишней экспликации.
- issue: Подразумеваемый смысл образа колеблемого тростника
  choice: Образ оставлен без пояснения в тексте
  alternative: Передать как прямое указание на непостоянство или нерешительность
  rationale: Риторический вопрос, вероятно, предполагает отрицательный ответ и противопоставляет Иоанна чему-то неустойчивому, однако перевод не должен превращать образ в однозначное толкование.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Риторическая форма и образность оригинала сохранены; архаичные «толпы», «узреть» и чрезмерно разговорные обороты избегаются.
