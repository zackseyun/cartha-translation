  text: ἀπὸ δὲ τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ ἕως ἄρτι ἡ βασιλεία τῶν οὐρανῶν βιάζεται, καὶ βιασταὶ ἁρπάζουσιν αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/012.yaml
  text: But from the days of John the Baptist until now[a], the kingdom of heaven suffers violence, and violent men seize it.
translation:
  language: ru
  text: Но со дней Иоанна Крестителя и доныне Небесное Царство подвергается насилию, и люди, прибегающие к насилию, захватывают его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Небесное Царство с силой прокладывает себе путь, и люди, действующие силой, овладевают им». Греческий глагол, переведённый как «подвергается насилию», допускает также среднее (непереходное) понимание.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ δὲ
  choice: Но со
  rationale: ἀπό обозначает исходный момент, а δέ — мягкий переход или противопоставление. «Но со» естественно передаёт оба элемента без чрезмерного усиления контраста.
- source_word: τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ
  choice: дней Иоанна Крестителя
  rationale: Сохраняет греческий временной оборот и традиционное, понятное современному читателю наименование Иоанна.
- source_word: ἕως ἄρτι
  choice: и доныне
  rationale: Кратко и литературно передаёт непрерывность от дней Иоанна до настоящего момента речи.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Небесное Царство
  rationale: Устоявшийся русский эквивалент характерного для Матфея выражения; обозначает царство или царствование, связанное с небесами, без добавочного толкования.
- source_word: βιάζεται
  choice: подвергается насилию
  rationale: Пассивное понимание грамматически возможно и согласуется с последующим упоминанием совершающих насилие. Подлинная неоднозначность глагола сохранена в сноске.
- source_word: βιασταὶ
  choice: люди, прибегающие к насилию
  rationale: Передаёт лиц, действующих силой или насильственно, естественнее русского «насильники», которое имеет более узкое современное значение. Существительное мужского рода множественного числа не обязательно ограничивает группу только мужчинами.
- source_word: ἁρπάζουσιν αὐτήν
  choice: захватывают его
  rationale: «Захватывают» сохраняет значение силового овладения, а местоимение согласовано с русским словом «Царство».
theological_decisions:
- issue: Значение βιάζεται применительно к Небесному Царству
  choice: 'В основном тексте — пассивное: «подвергается насилию»'
  alternative: 'Среднее или непереходное: «с силой прокладывает себе путь»'
  rationale: Греческая форма допускает оба понимания. Пассивное чтение хорошо связано с последующим «захватывают», однако альтернативное чтение имеет серьёзные языковые основания, поэтому оно вынесено в сноску, а не устранено.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Формулировка избегает архаичного «восхищают» и двусмысленного в современном русском слова «насильники». Сноска сохраняет известную лексико-грамматическую неоднозначность стиха.
