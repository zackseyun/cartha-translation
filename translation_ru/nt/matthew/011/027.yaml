  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/027.yaml
  text: All things have been handed over to me by my Father[a], and no one knows the Son except the Father[b], nor does anyone know the Father except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: ru
  text: Всё передано Мне Моим Отцом, и никто не знает Сына, кроме Отца, и Отца не знает никто, кроме Сына и того, кому Сын пожелает открыть Отца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα
  choice: Всё
  rationale: Субстантивированное среднее множественное число имеет всеобъемлющий смысл; русское «всё» естественно передаёт его без уточнения области.
- source_word: μοι παρεδόθη ὑπὸ τοῦ πατρός μου
  choice: передано Мне Моим Отцом
  rationale: Аорист пассива παραδίδωμι обозначает совершившуюся передачу; краткая пассивная конструкция сохраняет направление действия от Отца к Сыну.
- source_word: ἐπιγινώσκει
  choice: знает
  rationale: В данном контексте глагол выражает глубокое личное знание, однако усилитель «в полной мере» не обязателен лексически и мог бы чрезмерно конкретизировать смысл.
- source_word: εἰ μὴ
  choice: кроме
  rationale: После отрицания это естественный русский способ передать исключение.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: тому, кому Сын пожелает Его открыть
  rationale: βούληται сохраняет волевую инициативу Сына, а «открыть» естественно передаёт ἀποκαλύψαι; местоимение «Его» недвусмысленно относится к Отцу.
theological_decisions:
- issue: Характер взаимного знания Отца и Сына
  choice: «знает» без добавления «в полной мере»
  alternative: «знает в полной мере» / «истинно знает»
  rationale: Исключительность взаимного знания ясно выражена самой конструкцией «никто… кроме»; перевод не вводит спорное лексическое усиление, сохраняя глубину и богословское напряжение текста.
- issue: Волевая инициатива Сына в откровении
  choice: «кому Сын пожелает… открыть»
  alternative: «кому Сын захочет открыть» / «кому Сын изберёт открыть»
  rationale: «Пожелает» передаёт βούληται как реальное волеизъявление, не сводя его к мимолётному желанию и не добавляя идеи избрания, которой глагол сам по себе не требует.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены параллелизм двух отрицательных высказываний, титульные прописные «Отец» и «Сын» и исключительный характер взаимного знания. Местоимения, относящиеся к божественным Лицам, написаны с прописной буквы согласно устойчивой русской библейской традиции.
