  terminology: «Больные проказой очищаются» удачно сохраняет и уважительное обозначение людей, и смысл καθαρίζονται, включающий очищение, а не только исцеление. «Бедным возвещается благая весть» верно отражает πτωχοὶ εὐαγγελίζονται как пассивное возвещение им. В сноске допустимо «Евангелие» как традиционный лексический вариант, но основную формулировку следует согласовать со строчной буквой.
