  text: τυφλοὶ ἀναβλέπουσιν καὶ χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται καὶ κωφοὶ ἀκούουσιν, ⸀καὶ νεκροὶ ἐγείρονται καὶ πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/005.yaml
  text: The blind receive sight and the lame walk[a], lepers are cleansed and the deaf hear[b], and the dead are raised and the poor have good news proclaimed to them.
translation:
  language: ru
  text: Слепые прозревают, хромые ходят, больные проказой очищаются, глухие слышат, мёртвые воскрешаются, и бедным возвещается благая весть.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедным проповедуется Евангелие». Греческий глагол имеет пассивную форму: бедным возвещается благая весть.'
    reason: lexical_alternative
  - marker: b
    text: Этот перечень перекликается с Ис 35:5–6 и 61:1 и указывает на знамения, связанные с делами Мессии.
    reason: cross_reference
lexical_decisions:
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: слепые прозревают
  rationale: «Прозревают» естественно и ёмко передаёт восстановление или обретение зрения в контексте исцелений.
- source_word: χωλοὶ περιπατοῦσιν
  choice: хромые ходят
  rationale: Сохраняет краткость и параллельное построение греческого перечня.
- source_word: λεπροὶ καθαρίζονται
  choice: больные проказой очищаются
  rationale: Описательное обозначение людей звучит современно и уважительно, а «очищаются» сохраняет как телесный, так и обрядовый оттенок καθαρίζονται.
- source_word: κωφοὶ ἀκούουσιν
  choice: глухие слышат
  rationale: В сочетании с ἀκούουσιν слово κωφοί однозначно обозначает глухих; простой глагол сохраняет лаконизм исходного текста.
- source_word: νεκροὶ ἐγείρονται
  choice: мёртвые воскресают
  rationale: В русском библейском и литературном употреблении «воскресают» естественно передаёт пассивное ἐγείρονται в контексте возвращения умерших к жизни, не уточняя названного деятеля.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: бедным возвещается Благая весть
  rationale: Безлично-пассивная конструкция сохраняет бедных как получателей возвещения и передаёт словесный смысл εὐαγγελίζονται без позднейшего профессионального жаргона.
theological_decisions:
- issue: Значение εὐαγγελίζονται и связь с термином «Евангелие»
  choice: бедным возвещается Благая весть
  alternative: бедным проповедуется Евангелие
  rationale: Выбранный вариант сохраняет пассивную направленность действия и мессианский мотив благой вести, не сужая выражение до позднейшего технического церковного значения.
- issue: Мессианское исполнение пророчеств Исаии
  choice: Не добавлять в основной текст формулу об исполнении пророчества
  alternative: 'Явно указать: «во исполнение пророчества Исаии»'
  rationale: Перечень несомненно перекликается с Ис 35:5–6 и 61:1, однако сам стих лишь называет деяния; пояснение поэтому вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством и ритмической краткостью евангельского перечня. Избегается стигматизирующее существительное «прокажённые»; формула «больные проказой» остаётся понятной без отождествления древней категории кожных болезней с точным современным диагнозом. Маркеры обеих сносок присутствуют в основном тексте.
