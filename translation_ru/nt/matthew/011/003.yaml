  text: 'сказал Ему: «Ты ли Тот, Кто должен прийти[a], или нам ожидать другого?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Грядущий»; буквально: «Тот, кто приходит». В данном контексте греческое выражение может употребляться как мессианское именование.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: и сказали Ему
  rationale: Хотя εἶπεν формально стоит в единственном числе («сказал ему»), по-русски при продолжении рассказа естественно согласовать сказуемое с посланными учениками, упомянутыми в предыдущем стихе; союз «и» передаёт повествовательную связь.
- source_word: Σὺ εἶ
  choice: Ты ли
  rationale: Частица «ли» естественно оформляет прямой вопрос и сохраняет акцент, создаваемый явно выраженным местоимением σύ.
- source_word: ὁ ἐρχόμενος
  choice: Тот, Кто должен прийти
  rationale: Субстантивированное причастие имеет буквальный смысл «приходящий / тот, кто приходит», но в контексте обозначает ожидаемую мессианскую фигуру. Формулировка сохраняет титульный оттенок, не подменяя выражение словом «Мессия».
- source_word: ἢ
  choice: или
  rationale: Обычный разделительный союз, вводящий альтернативу.
- source_word: ἕτερον
  choice: другого
  rationale: Передаёт значение «другого, иного» без добавления отсутствующего в греческом существительного.
- source_word: προσδοκῶμεν
  choice: нам ожидать
  rationale: 'Вопросительное употребление формы настоящего времени имеет совещательный оттенок: «следует ли нам ожидать». Русская конструкция с дательным субъектом кратка и естественна.'
theological_decisions:
- issue: Мессианский и титульный оттенок ὁ ἐρχόμενος
  choice: Тот, Кто должен прийти
  alternative: Грядущий; Тот, Кто приходит; ожидаемый Мессия
  rationale: Контекст поддерживает понимание выражения как обозначения ожидаемой мессианской фигуры, однако греческий текст прямо не употребляет слово «Мессия». Выбранный вариант сохраняет связь с буквальным образом прихода и не снимает исходную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Заглавные буквы в «Тот, Кто» подчёркивают титульное употребление в вопросе, не вводя отдельного лексического значения.
