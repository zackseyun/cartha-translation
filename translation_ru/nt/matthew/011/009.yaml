  source_fidelity: 'Текст точно передаёт риторическую последовательность греческого оригинала: контрастное «Но», вопрос о предмете выхода, краткий вопрос «Пророка?», утвердительное «Да, говорю вам» и намеренно нераскрытое «больше, чем пророка». «Что вы ходили смотреть?» верно сохраняет τί как вопрос о том, что именно шли увидеть, а не подменяет его вопросом о причине («зачем»).'
