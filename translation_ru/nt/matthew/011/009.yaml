  terminology: «Пророк» — точное и общеупотребительное соответствие προφήτης. Формула «говорю вам» хорошо соответствует λέγω ὑμῖν по регистру. Перевод не конкретизирует, в чём именно Иоанн «больше, чем пророк», и потому не навязывает богословского истолкования.
