id: MAT.11.9
reference: Matthew 11:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε⸂; προφήτην ἰδεῖν⸃; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/009.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: ru
  text: Но что вы ходили смотреть? Пророка? Да, говорю вам, и больше, чем пророка.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «того, кто больше пророка». Буквально: «больше пророка».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт противопоставление предшествующему риторическому вопросу и естественно звучит по-русски.
- source_word: τί ἐξήλθατε
  choice: что вы ходили
  rationale: Сохраняет вопрос о том, что именно люди вышли увидеть, а не заменяет его причинным «зачем»; глагол движения в контексте естественно передан как «ходили».
- source_word: ἰδεῖν
  choice: смотреть
  rationale: Инфинитив цели; в сочетании «ходили смотреть» это современная и естественная русская формулировка.
- source_word: προφήτην
  choice: пророка
  rationale: В риторическом вопросе винительный падеж без артикля естественно передаётся формой «пророка» без дополнительных определений.
- source_word: ναί
  choice: Да
  rationale: Прямой утвердительный ответ на риторический вопрос.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Близко передаёт устойчивую речевую формулу и сохраняет её достоинство и непосредственность.
- source_word: καὶ περισσότερον προφήτου
  choice: и больше, чем пророка
  rationale: Сохраняет сравнительную конструкцию и намеренно не добавляет отсутствующее в греческом тексте слово «того» или характеристику «великого».
theological_decisions:
- issue: Статус Иоанна Крестителя по отношению к пророкам
  choice: «больше, чем пророка»
  alternative: «того, кто больше пророка»
  rationale: Сжатая формулировка сохраняет эллиптичность и богословское напряжение греческого текста, не поясняя здесь, в каком именно смысле Иоанн превосходит категорию пророка.
translation_notes:
  register: Современный литературный русский язык; риторическая последовательность и лаконичность оригинала сохранены. Формула «что вы ходили смотреть?» несколько выразительнее разговорного «зачем вы ходили?», но точнее отражает τί и предмет вопроса.
