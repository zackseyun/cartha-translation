  text: καὶ εἰ θέλετε δέξασθαι, αὐτός ἐστιν Ἠλίας ὁ μέλλων ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/014.yaml
  text: And if you are willing to accept it[b][a], he is Elijah who is to come.
translation:
  language: ru
  text: И если вы готовы это принять[a], он и есть Илия, который должен прийти[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если вы желаете это принять».'
    reason: lexical_alternative
  - marker: b
    text: То есть Иисус отождествляет Иоанна Крестителя с обещанным предтечей, который должен был прийти как Илия; ср. Мал. 4:5; Мф. 17:10–13.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет простую связь с предыдущим высказыванием, не уточняя логическое отношение сверх греческого текста.
- source_word: εἰ θέλετε δέξασθαι
  choice: если вы готовы это принять
  rationale: Сочетание θέλετε с инфинитивом выражает готовность или желание принять сказанное. Местоимение «это» естественно восполняет подразумеваемый объект — утверждение Иисуса об Иоанне.
- source_word: αὐτός
  choice: он и есть
  rationale: Местоимение отсылает к Иоанну Крестителю; частица «и» в конструкции «он и есть» естественно передаёт возможный акцент αὐτός, не прибегая к тяжеловесному «он сам».
- source_word: ἐστιν Ἠλίας
  choice: есть Илия
  rationale: Прямая идентификационная формулировка сохранена без ослабления до «подобен Илии» или «исполняет роль Илии».
- source_word: ὁ μέλλων ἔρχεσθαι
  choice: которому надлежало прийти
  rationale: 'Передаёт ожидаемое в пророчестве пришествие с естественной для русской ретроспективной временной перспективой: Иисус говорит о том, кто уже пришёл. Формулировка не сужает смысл до непосредственного намерения.'
theological_decisions:
- issue: Отождествление Иоанна Крестителя с Илиёй
  choice: «он и есть Илия»
  alternative: «он исполняет роль Илии» / «он подобен Илии»
  rationale: Греческий текст прямо говорит αὐτός ἐστιν Ἠλίας. Перевод сохраняет силу этого отождествления и условный призыв принять его, не разрешая возникающее богословское напряжение посредством поясняющего перефразирования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Готовы это принять» звучит естественно и передаёт не просто желание, а восприимчивость к утверждению Иисуса. «Которому надлежало прийти» сохраняет пророческий оттенок без архаизации всего стиха.
