  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/026.yaml
  text: Yes[a], Father, because this was pleasing in your sight.
translation:
  language: ru
  text: Да[a], Отец, потому что так было угодно Тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Именно так, Отец, ибо таково было Твоё благоволение».'
    reason: 'Лексико-синтаксическая альтернатива: ναί может иметь усилительный оттенок, а εὐδοκία — передаваться существительным «благоволение».'
lexical_decisions:
- source_word: ναί
  choice: Да
  rationale: Прямое и естественное выражение согласия в контексте молитвенного обращения.
- source_word: ὁ πατήρ
  choice: Отец
  rationale: Именительный с артиклем употреблён как обращение; форма «Отец» естественна и сохраняет достоинство речи без архаического «о Отче».
- source_word: ὅτι
  choice: потому что
  rationale: 'Передаёт причинный смысл: говорящий подтверждает сказанное на основании того, что такой образ действия угоден Отцу.'
- source_word: οὕτως
  choice: так
  rationale: Отсылает к описанному в предыдущем стихе образу действия и сохраняет нарочитую краткость греческого текста.
- source_word: εὐδοκία ἐγένετο
  choice: было угодно
  rationale: Естественная русская конструкция, передающая благоволение или одобрение, не усиливая значение до предопределённого замысла.
- source_word: ἔμπροσθέν σου
  choice: Тебе
  rationale: В сочетании «было угодно Тебе» естественно передаёт идиоматический смысл «пред Тобою / в Твоих глазах», избегая неестественной буквальности.
theological_decisions:
- issue: Следует ли передавать εὐδοκία как указание на Божье постановление или как Его благоволение
  choice: «было угодно Тебе» — выражение благоволения и одобрения
  alternative: «таково было Твоё благоволение» или «так было благо в Твоих глазах»
  rationale: Греческий оборот подчёркивает, что описанный образ действия был угоден Отцу, но сам по себе не требует более сильного значения «предвечный замысел» или «постановление».
translation_notes:
  register: Современный литературный русский язык с молитвенно-достойным, но не архаическим звучанием. Местоимение «Тебе» написано с прописной буквы как традиционная форма почтительного обращения к Богу; это редакционное решение, не отдельное значение греческого текста.
