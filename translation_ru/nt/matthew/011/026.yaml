  source_fidelity: «Да, Отец, потому что так было угодно Тебе» точно передаёт утвердительное ναί, обращение ὁ πατήρ, причинное ὅτι, анафорическое οὕτως и идиоматический смысл εὐδοκία ἐγένετο ἔμπροσθέν σου. Оборот «было угодно Тебе» не навязывает значения предопределённого постановления и сохраняет смысл Божьего благоволения.
  naturalness: Фраза естественна для современного литературного русского и уместна в молитвенном контексте. «Отец» как прямое обращение имеет достойное, не чрезмерно архаичное звучание; «потому что» ясно выражает причинную связь.
