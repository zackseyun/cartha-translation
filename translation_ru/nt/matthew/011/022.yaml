  text: πλὴν λέγω ὑμῖν, Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/022.yaml
  text: But I tell you[a], it will be more tolerable for Tyre and Sidon on the day of judgment than for you.
translation:
  language: ru
  text: 'Но говорю вам: Тиру и Сидону будет легче[a] в день суда, чем вам.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет легче перенести».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Но
  rationale: Передаёт сильное противопоставление предшествующему обличению естественным современным русским союзом.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Сохраняет прямую и торжественную формулу обращения без ненужного усиления.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: Тиру и Сидону
  rationale: Дательный падеж естественно передаёт лиц, для которых суд окажется сравнительно легче.
- source_word: ἀνεκτότερον
  choice: легче
  rationale: В безличной конструкции «будет легче» естественно выражает сравнительную степень переносимости; буквальная идея выносимости отмечена в сноске.
- source_word: ἔσται
  choice: будет
  rationale: Точно передаёт будущее время связочного глагола.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: в День суда
  rationale: Передаёт время будущего судебного события; прописная буква ясно указывает на признанное эсхатологическое событие, не добавляя деталей.
- source_word: κρίσεως
  choice: суда
  rationale: Сохраняет широкий судебный смысл κρίσις и не сужает его до одного лишь осуждения.
- source_word: ἢ ὑμῖν
  choice: чем вам
  rationale: Кратко и точно завершает сравнение, сохраняя множественное число адресатов, выраженное контекстом.
theological_decisions:
- issue: Характер грядущего суда
  choice: в День суда
  alternative: в день суда
  rationale: Контекст указывает на известное эсхатологическое судебное событие; перевод не уточняет его природу или исход сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, торжественная и понятная. «День суда» сохраняет библейский регистр, а «будет легче» звучит естественнее, чем калькированное «будет терпимее».
