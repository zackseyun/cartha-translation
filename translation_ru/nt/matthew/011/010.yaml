base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/010.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face, who will prepare your way before you.’'
translation:
  language: ru
  text: 'Это тот, о ком написано: «Вот, Я посылаю Моего вестника перед лицом Твоим[a], и он приготовит путь Твой пред Тобою».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более естественно: «перед Тобою». Греческий текст сохраняет в цитате конкретное выражение «перед лицом Твоим».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν
  choice: Он — тот
  rationale: Передаёт указательное отождествление с естественным для современного русского языка акцентом.
- source_word: περὶ οὗ γέγραπται
  choice: о ком написано
  rationale: Естественно передаёт περί с родительным и традиционную формулу ссылки на Писание в перфекте пассива.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Сохраняет привлекающую внимание пророческую формулу и звучит современно и достойно.
- source_word: ἀποστέλλω
  choice: посылаю
  rationale: Настоящее время сохраняет живость цитаты и в русском может иметь предстоящую направленность.
- source_word: ἄγγελόν
  choice: вестника
  rationale: В контексте речь идёт об Иоанне как человеческом посланнике; «вестник» сохраняет смысл ἄγγελος без ошибочной ассоциации исключительно с небесным ангелом.
- source_word: πρὸ προσώπου σου
  choice: перед лицом Твоим
  rationale: Сохраняет конкретный образ греческой цитаты и отличается от последующего ἔμπροσθέν σου.
- source_word: κατασκευάσει
  choice: приготовит
  rationale: Точно и естественно передаёт будущее действие подготовки.
- source_word: τὴν ὁδόν σου
  choice: путь Твой
  rationale: «Путь» сохраняет как дорожный образ, так и возможный метафорический оттенок.
- source_word: ἔμπροσθέν σου
  choice: пред Тобою
  rationale: Передаёт пространственное «перед тобой» и сохраняет торжественный регистр цитаты, не сливая выражение с πρὸ προσώπου σου.
theological_decisions:
- issue: Два сходных пространственных оборота в цитате
  choice: 'Сохранены оба: «перед лицом Твоим» и «пред Тобою»'
  alternative: 'Сгладить до одного выражения, например: «впереди Тебя»'
  rationale: Греческий текст содержит два отдельных оборота — πρὸ προσώπου σου и ἔμπροσθέν σου; их сохранение передаёт структуру и усиление цитаты, не устраняя напряжение ради стилистической гладкости.
- issue: Значение ἄγγελος применительно к Иоанну
  choice: вестник
  alternative: ангел
  rationale: Контекст прямо отождествляет фигуру с человеческим предтечей; выбор отражает широкий смысл греческого слова, не привнося представление о небесной природе.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным регистром библейской цитаты. Заглавные местоимения в цитате помогают ясно обозначить обращение к Мессии; архаизирующее «пред Тобою» ограничено цитатой и служит различению двух близких греческих оборотов.
