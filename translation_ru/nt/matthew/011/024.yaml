  text: πλὴν λέγω ὑμῖν ὅτι γῇ Σοδόμων ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/024.yaml
  text: But I tell you that it will be more tolerable for the land of Sodom on the day of judgment than for you[a].
translation:
  language: ru
  text: 'Но говорю вам: земле Содома будет легче[a] в день суда, чем тебе.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет легче перенести».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Но
  rationale: Здесь слово вводит резкое противопоставление предыдущему высказыванию; «но» естественно передаёт эту функцию по-русски.
- source_word: λέγω ὑμῖν
  choice: говорю тебе
  rationale: В контексте Иисус обращается к Капернауму как к олицетворённому городу. Хотя греческое ὑμῖν формально имеет множественное число, по смыслу адресат затем обозначен единственным σοί; русское единственное число сохраняет цельность прямого обращения.
- source_word: γῇ Σοδόμων
  choice: земле Содомской
  rationale: Передаёт явно названную γῇ («земля, область») и сохраняет приподнятый пророческий строй без сведения выражения лишь к названию города.
- source_word: ἀνεκτότερον
  choice: легче
  rationale: В данном контексте сравнительное наречное сказуемое означает, что участь будет легче переносить; краткое русское «легче» естественно и ясно.
- source_word: ἔσται
  choice: будет
  rationale: Прямо передаёт простое будущее связочного глагола.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: в день суда
  rationale: Точно и естественно обозначает время грядущего суда, не добавляя конфессиональной терминологии.
- source_word: ἢ σοί
  choice: чем тебе
  rationale: Сохраняет единственное число σοί и прямое пророческое обращение к олицетворённому Капернауму.
theological_decisions:
- issue: Число адресата в λέγω ὑμῖν и σοί
  choice: 'Передать обращение в единственном числе: «говорю тебе… чем тебе»'
  alternative: «говорю вам… чем тебе» или поясняющее «чем вам, жители города»
  rationale: В греческом тексте есть напряжение между множественным ὑμῖν и единственным σοί. Контекст олицетворённого обращения к городу позволяет по-русски согласовать формулу обращения с последующим σοί, не вводя в текст пояснение о жителях; само прямое обращение и его судебная сила сохранены.
- issue: Характер сравнения на суде
  choice: «земле Содомской будет легче»
  alternative: «земля Содомская получит более лёгкий приговор»
  rationale: Исходный текст говорит о сравнительной переносимости участи, но не уточняет форму или меру приговора. Перевод не конкретизирует то, что оставлено неуточнённым.
translation_notes:
  register: Современный литературный русский с кратким, торжественным пророческим звучанием. Инверсия «земле Содомской будет легче» сохраняет акцент исходного сравнения и остаётся понятной обычному читателю.
