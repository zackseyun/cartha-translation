  source_fidelity: 'Текст точно передаёт все основные элементы греческого оригинала: приглашение «Придите ко Мне», всеобщность обращения, активное значение οἱ κοπιῶντες («кто трудится»), состояние πεφορτισμένοι («обременён») и широкое обещание ἀναπαύσω ὑμᾶς («дам вам покой»). Единственное число «обременён» после собирательного «кто» грамматически нормативно и не меняет множественного охвата греческого обращения.'
  naturalness: Формулировка естественна для современного литературного русского и сохраняет уместный возвышенный регистр. «Дам вам покой» ясно и идиоматично; оно не сводит обещание лишь к физическому отдыху.
  terminology: «Покой» удачно передаёт ἀναπαύσω широко, не навязывая конкретно духовное, эмоциональное либо эсхатологическое толкование. Сноска корректно отмечает возможные оттенки «дать отдохнуть» и «освежить/подкрепить». Заглавные буквы в речи Христа являются допустимой издательской конвенцией.
