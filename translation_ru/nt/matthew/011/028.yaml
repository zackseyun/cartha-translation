  text: Δεῦτε πρός με πάντες οἱ κοπιῶντες καὶ πεφορτισμένοι, κἀγὼ ἀναπαύσω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/028.yaml
  text: Come to me[a], all who labor and are burdened[b], and I will give you rest.
translation:
  language: ru
  text: Придите ко Мне все, кто трудится и обременён, и Я дам вам покой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дам вам отдохнуть»; возможен также смысл «освежу вас». Глагол может означать дать кому-либо покой, отдых или подкрепление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε πρός με
  choice: Придите ко Мне
  rationale: Идиоматическое приглашение с обозначением движения к говорящему; форма множественного числа соответствует обращению ко всем приглашённым.
- source_word: πάντες
  choice: все
  rationale: Сохраняет всеобщий охват приглашения без дополнительного усиления.
- source_word: οἱ κοπιῶντες
  choice: кто трудится
  rationale: 'Передаёт активное значение причастия: речь о тех, кто тяжело трудится и утомляется; настоящее время сохраняет продолжающийся характер действия.'
- source_word: πεφορτισμένοι
  choice: обременён
  rationale: Передаёт состояние, возникшее вследствие возложения бремени и продолжающееся теперь; единственное число согласовано с русским относительным местоимением «кто» при собирательном обращении «все».
- source_word: κἀγὼ
  choice: и Я
  rationale: Сохраняет явное подлежащее и умеренное смысловое выделение говорящего.
- source_word: ἀναπαύσω ὑμᾶς
  choice: дам вам покой
  rationale: 'Естественно передаёт каузативный смысл глагола: дать отдохновение или покой, не сужая обещание до одного физического либо эмоционального состояния.'
theological_decisions:
- issue: Характер обещанного покоя в ἀναπαύσω
  choice: «дам вам покой» без уточнения природы покоя
  alternative: «дам вам отдохнуть»; «освежу вас»
  rationale: Сам стих не определяет однозначно, является ли покой духовным, эсхатологическим, душевным или физическим. Широкая формулировка сохраняет эту смысловую и богословскую ёмкость.
translation_notes:
  register: Современный литературный русский язык; обращение звучит прямо, торжественно и понятно. Заглавные буквы в «Мне» и «Я» отражают принятую русскую издательскую практику для речи Христа, не изменяя смысла исходного текста.
