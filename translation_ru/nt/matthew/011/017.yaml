  text: ⸀λέγουσιν· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκόψασθε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/017.yaml
  text: They say[a], ‘We played the flute for you, and you did not dance; we sang a lament[c][b], and you did not mourn.’
translation:
  language: ru
  text: 'Они говорят: «Мы играли вам на свирели, а вы не плясали; мы пели плач, а вы не били себя в грудь[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть не стали скорбеть. Бить себя в грудь было принятым выражением глубокой скорби и плача по умершему.
    reason: cultural_note
lexical_decisions:
- source_word: λέγουσιν
  choice: Они говорят
  rationale: Настоящее время сохраняет живость речи детей внутри сравнения.
- source_word: Ηὐλήσαμεν
  choice: мы играли вам на свирели
  rationale: Глагол обозначает игру на духовом инструменте — флейте или свирели; «свирель» естественно передаёт образ детской игры и не сводит значение к музыке вообще.
- source_word: ὠρχήσασθε
  choice: вы не плясали
  rationale: Глагол означает танцевать; «плясали» здесь естественно сочетается с весёлой игрой на свирели.
- source_word: ἐθρηνήσαμεν
  choice: мы пели плач
  rationale: Глагол относится к исполнению скорбного, часто погребального плача и сохраняет параллель с музыкальным действием в первой строке.
- source_word: ἐκόψασθε
  choice: вы не били себя в грудь
  rationale: Средняя форма в контексте скорби указывает на ритуальный жест оплакивания. Перевод сохраняет конкретный образ исходного текста, а примечание поясняет его смысл.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением ритмического параллелизма двух реплик. «Плясали» выбрано вместо более нейтрального «танцевали» ради естественного сочетания со свирелью; конкретный жест скорби сохранён в основном тексте и пояснён в сноске.
