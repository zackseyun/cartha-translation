  source_fidelity: Текст точно передаёт настоящее λέγουσιν, две аористные реплики и противопоставительный параллелизм. «Играть на свирели» адекватно передаёт αὐλέω как игру на духовом инструменте; «пели плач» сохраняет характер θρηνέω как исполняемого скорбного плача. «Не били себя в грудь» обоснованно передаёт ἐκόψασθε в его контекстуальном значении жеста траура.
