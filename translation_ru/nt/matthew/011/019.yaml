id: MAT.11.19
reference: Matthew 11:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἦλθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγουσιν· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, τελωνῶν φίλος καὶ ἁμαρτωλῶν. καὶ ἐδικαιώθη ἡ σοφία ἀπὸ τῶν ⸀ἔργων αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/019.yaml
  text: The Son of Man came eating and drinking[a], and they say, ‘Look, a glutton and a drunkard[b], a friend of tax collectors and sinners!’ And wisdom was justified by her works.
translation:
  language: ru
  text: 'Сын Человеческий пришёл, ел и пил, а они говорят: «Вот обжора и пьяница, друг сборщиков налогов и грешников!» И мудрость была оправдана[a] своими делами[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «правота мудрости была подтверждена».'
    reason: 'Лексическая альтернатива: в данном контексте ἐδικαιώθη может означать, что мудрость была признана или показана правой.'
  - marker: b
    text: 'В некоторых рукописях: «своими детьми» вместо «своими делами».'
    reason: Текстуальный вариант τέκνων вместо ἔργων, совпадающий по смысловой форме с параллельным местом в Лк. 7:35.
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Сохраняет общепринятое библейское наименование, его семитский фон и богословскую многозначность без истолковывающего парафраза.
- source_word: ἐσθίων καὶ πίνων
  choice: ел и пил
  rationale: Прямо передаёт обычное поведение, противопоставленное в контексте аскетическому образу жизни Иоанна, не усиливая смысл до «пировал».
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Естественно и выразительно вводит обвинительный возглас в современном русском языке.
- source_word: φάγος καὶ οἰνοπότης
  choice: обжора и пьяница
  rationale: Передаёт оба уничижительных обвинения, а не нейтральное указание на еду и употребление вина.
- source_word: τελωνῶν φίλος καὶ ἁμαρτωλῶν
  choice: друг сборщиков налогов и грешников
  rationale: Сохраняет социально-религиозную силу обвинения; «сборщики налогов» понятнее современному читателю, чем исторически традиционное «мытари».
- source_word: ἐδικαιώθη
  choice: была оправдана
  rationale: Формально сохраняет пассивную форму и связь с более широким библейским употреблением δικαιόω; более разъясняющий смысл указан в сноске.
- source_word: ἡ σοφία
  choice: мудрость
  rationale: Сохраняет олицетворённое выражение без отождествления мудрости с Иисусом, Божьим замыслом или иной конкретной реальностью.
- source_word: ἀπὸ τῶν ἔργων αὐτῆς
  choice: своими делами
  rationale: Передаёт ἔργων как «делами» и естественно выражает средство или основание, по которому правота мудрости становится явной.
theological_decisions:
- issue: Значение «мудрости» в заключительной фразе
  choice: Сохранить олицетворённое слово «мудрость» без дополнительного истолкования.
  alternative: Прямо отождествить мудрость с Иисусом или со спасительным замыслом Бога.
  rationale: Сам текст не уточняет это отождествление; буквальная образность сохраняет богословское напряжение и допускаемую оригиналом многозначность.
- issue: Текст заключительной фразы
  choice: Следовать чтению SBLGNT ἔργων — «делами» — в основном тексте.
  alternative: Чтение τέκνων — «детьми».
  rationale: Предоставленный греческий источник содержит ἔργων; известный вариант τέκνων сохраняется в сноске.
- issue: Связь заключительной фразы с предшествующим обвинением
  choice: Передать καί как «и», не добавляя явно противительного значения.
  alternative: «Но» или «однако».
  rationale: Греческий союз сам по себе не требует противительного истолкования.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. «Сын Человеческий» сохранён как установленный титул; «сборщики налогов» выбрано вместо архаичного «мытари». Обвинения переданы резко, как в оригинале. Маркеры сносок поставлены при тех выражениях, к которым они фактически относятся.
