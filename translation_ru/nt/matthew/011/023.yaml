source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ᾅδου ⸀καταβήσῃ· ὅτι εἰ ἐν Σοδόμοις ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ⸀ἔμεινεν ἂν μέχρι τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/023.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had happened in Sodom, it would have remained until today.
translation:
  language: ru
  text: И ты, Капернаум, неужели до неба вознесёшься? Сойдёшь в Аид[a]. Ведь если бы в Содоме были совершены те великие дела, что совершены в тебе, он сохранился бы до сего дня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в мир мёртвых». В греческом тексте — «Аид», не геенна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καφαρναούμ
  choice: Капернаум
  rationale: Использована устоявшаяся русская форма библейского топонима.
- source_word: μὴ ἕως οὐρανοῦ ὑψωθήσῃ;
  choice: неужели до неба вознесёшься?
  rationale: Частица μή с формой будущего времени передана как риторический вопрос, предполагающий отрицательный ответ; сохранены образ возвышения и пассивно-возвратная форма.
- source_word: ἕως ᾅδου καταβήσῃ
  choice: До Аида сойдёшь
  rationale: Глагол καταβαίνω прямо передан как «сойти», а ᾅδης — транслитерацией «Аид», чтобы не смешивать его с геенной и не сужать значение до более позднего представления об аде.
- source_word: δυνάμεις
  choice: дела силы
  rationale: Выражение сохраняет одновременно смысл конкретных деяний и проявленной в них силы, не сводя слово исключительно к современному понятию «чудеса».
- source_word: γενόμεναι ἐν σοί
  choice: совершены в тебе
  rationale: Сохранено обращение к городу как к собеседнику и локальное значение ἐν.
- source_word: ἐγενήθησαν
  choice: были совершены
  rationale: В русском условном предложении эта форма естественно выражает нереальное условие в прошлом и согласуется с «делами силы».
- source_word: ἔμεινεν ἂν
  choice: он сохранился бы
  rationale: Единственное число отнесено к Содому как городу; «сохранился бы» естественно передаёт продолжение существования города в нереальном следствии.
- source_word: μέχρι τῆς σήμερον
  choice: до сего дня
  rationale: Устойчивое и понятное выражение современного литературного русского языка, сохраняющее временную границу оригинала.
theological_decisions:
- issue: Передача ᾅδης
  choice: Аид
  alternative: мир мёртвых; ад
  rationale: «Аид» сохраняет термин исходного греческого текста и его отличие от геенны. Слово «ад» могло бы привнести более узкое позднее значение; пояснительная сноска даёт смысловой эквивалент.
- issue: Риторический характер первой фразы
  choice: неужели до неба вознесёшься?
  alternative: ты не вознесёшься до неба
  rationale: Вопросительная форма сохраняет синтаксическую и риторическую напряжённость греческого текста, не превращая её в прямое отрицательное утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Формы «вознесёшься», «сойдёшь» и «до сего дня» общеупотребительны и сохраняют достоинство речи; необычное, но прозрачное выражение «дела силы» выбрано ради смысловой полноты δυνάμεις.
