source:
  edition: SBLGNT
  text: Τότε ⸀ἤρξατο ὀνειδίζειν τὰς πόλεις ἐν αἷς ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ, ὅτι οὐ μετενόησαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/020.yaml
  text: Then he began to reproach the cities in which most of his mighty works had been done[a], because they did not repent.
translation:
  language: ru
  text: Тогда Он начал укорять города, в которых произошло больше всего Его могущественных дел[a], за то, что они не покаялись.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чудес»; или: «деяний силы» (греч. δυνάμεις).'
    reason: 'Лексическая альтернатива: слово обозначает проявления силы и в данном контексте относится к чудесным деяниям Иисуса.'
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественный временной указатель, вводящий следующий этап повествования.
- source_word: ἤρξατο ὀνειδίζειν
  choice: начал укорять
  rationale: Сохраняет начинательное значение ἤρξατο и передаёт ὀνειδίζειν как порицание без усиления до формального осуждения.
- source_word: τὰς πόλεις ἐν αἷς
  choice: города, в которых
  rationale: Точно и естественно передаёт существительное и относительный оборот.
- source_word: ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ
  choice: совершилось большинство Его могущественных дел
  rationale: «Совершилось» соответствует событийной семантике γίνομαι, «большинство» сохраняет суперлатив πλεῖσται, а «могущественные дела» отражает связь δυνάμεις с силой, не сужая значение до категории чудес.
- source_word: ὅτι οὐ μετενόησαν
  choice: за то, что они не покаялись
  rationale: Оборот ясно обозначает причину укора; «не покаялись» естественно и богословски весомо передаёт μετανοέω в данном контексте.
theological_decisions:
- issue: Передача δυνάμεις в контексте чудес
  choice: могущественные дела
  alternative: чудеса; деяния силы
  rationale: Выбранный вариант сохраняет акцент греческого слова на силе и не сводит его к более узкому современному термину; допустимые альтернативы отмечены в сноске.
- issue: Передача μετενόησαν
  choice: не покаялись
  alternative: не изменили образ мыслей; не обратились
  rationale: «Покаялись» сохраняет нравственно-духовный смысл требуемого отклика на деяния Иисуса, не добавляя конфессиональной конкретизации.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Местоимение «Он» и притяжательное «Его» оформлены с прописной буквы как традиционное уважительное обозначение Иисуса; синтаксис остаётся близким к греческому, но звучит естественно по-русски.
