  text: ὁ γὰρ ζυγός μου χρηστὸς καὶ τὸ φορτίον μου ἐλαφρόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/030.yaml
  text: For my yoke is kind, and my burden is light.
translation:
  language: ru
  text: Ведь Моё ярмо доброе[a], и ноша Моя легка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благое», «мягкое»; греческое слово может также подразумевать, что ярмо удобно и не тягостно.'
    reason: Сохраняет смысловой диапазон χρηστός и отмечает, что его значение не тождественно последующему «лёгка».
lexical_decisions:
- source_word: ζυγός
  choice: ярмо
  rationale: Прямой и узнаваемый образ упряжи, сохраняющий метафору подчинения и ученичества.
- source_word: χρηστός
  choice: благое
  rationale: 'Передаёт основные оттенки греческого слова: доброе, благосклонное, не жестокое; не сводит его значение только к «лёгкому», поскольку далее лёгкость отдельно выражена словом ἐλαφρόν.'
- source_word: φορτίον
  choice: ноша
  rationale: Естественное русское обозначение переносимого бремени; сохраняет образ того, что человек несёт.
- source_word: ἐλαφρόν
  choice: легка
  rationale: Точно передаёт физическую метафору малого веса и её переносный смысл.
theological_decisions:
- issue: Характер ярма Иисуса
  choice: благое
  alternative: лёгкое / удобное
  rationale: Перевод сохраняет нравственный оттенок χρηστός и не устраняет напряжение между «ярмом» как обязательством и его благим характером. Вариант «лёгкое» также создал бы нежелательный повтор смысла ἐλαφρόν.
translation_notes:
  register: Современный литературный русский язык с сохранением традиционных и понятных библейских образов «ярмо» и «ноша». Инверсия «ноша Моя» поддерживает мерный, торжественный ритм, не делая фразу архаичной.
