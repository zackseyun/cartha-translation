  yaml_path: translation/nt/matthew/011/018.yaml
  text: For John came neither eating nor drinking[a], and they say, ‘He has a demon.’
translation:
  language: ru
  text: 'Ведь Иоанн пришёл, не ел и не пил, а они говорят: «В нём бес».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Он имеет беса»; возможный перевод: «Он одержим бесом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: пришёл
  rationale: Аорист ἔρχομαι обозначает появление Иоанна среди людей; «пришёл» прямо и естественно передаёт обычное значение глагола.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит пояснение к предыдущей мысли; «ведь» естественно передаёт эту связь в современном русском языке.
- source_word: μήτε ἐσθίων μήτε πίνων
  choice: не ел и не пил
  rationale: Парные причастия описывают аскетический образ жизни Иоанна. Перевод сохраняет сжатость и не добавляет хлеб и вино, не названные в греческом тексте этого стиха.
- source_word: καὶ λέγουσιν
  choice: а они говорят
  rationale: Настоящее время сохраняет живой, обобщающий характер обвинения. Противительный оттенок «а» естественно выражает контраст между поведением Иоанна и реакцией людей.
- source_word: Δαιμόνιον ἔχει
  choice: В нём бес
  rationale: Это естественный русский эквивалент идиомы «имеет демона», сохраняющий прямую форму обвинения и не смешивающий δαιμόνιον с дьяволом.
theological_decisions:
- issue: Передача обвинения Δαιμόνιον ἔχει
  choice: В нём бес
  alternative: Он одержим бесом
  rationale: Речь идёт о передаваемом обвинении, а не об утверждении повествователя. Выбранная формулировка близка к греческой идиоме и не усиливает её более истолковывающим термином «одержим».
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная, с сохранением живого настоящего времени в обвинении. Маркер сноски поставлен непосредственно после цитируемого обвинения.
