revisions:
- from: Когда Иисус закончил наставлять двенадцать Своих учеников[a], Он ушёл оттуда, чтобы учить и проповедовать в их городах[b].
  to: Когда Иисус закончил давать указания Своим двенадцати ученикам[a], Он ушёл оттуда, чтобы учить и проповедовать в их городах[b].
  rationale: Перевод διατάσσων уточнён с «наставлять» до «давать указания», чтобы передать распорядительный оттенок греческого глагола. Неоднозначность αὐτῶν и все остальные смысловые соответствия сохранены; примечание a стилистически выправлено.
