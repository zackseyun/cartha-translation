    issue: «Наставлять» для διατάσσων
    rationale: «Наставлять» может обозначать обучение или нравственное руководство вообще, тогда как διατάσσω в данном контексте выражает дачу указаний/распоряжений. «Давать указания» сохраняет естественность и лучше передаёт семантику без чрезмерного усиления.
  - severity: low
