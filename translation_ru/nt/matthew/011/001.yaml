  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς διατάσσων τοῖς δώδεκα μαθηταῖς αὐτοῦ, μετέβη ἐκεῖθεν τοῦ διδάσκειν καὶ κηρύσσειν ἐν ταῖς πόλεσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/001.yaml
  text: And when Jesus had finished instructing his twelve disciples[b][a], he went on from there to teach and preach in their cities.
translation:
  language: ru
  text: Когда Иисус закончил давать указания Своим двенадцати ученикам[a], Он ушёл оттуда, чтобы учить и проповедовать в их городах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отдавать повеления Своим двенадцати ученикам».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое выражение «в их городах» неоднозначно: речь может идти о городах учеников или, шире, о городах жителей той местности.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Когда
  rationale: Матфеева повествовательная формула вводит временной переход. Простое «когда» естественно передаёт её функцию в современном русском языке без тяжеловесного буквального «и случилось, когда».
- source_word: ἐτέλεσεν
  choice: закончил
  rationale: Глагол обозначает завершение наставления до последующего ухода Иисуса.
- source_word: διατάσσων
  choice: наставлять
  rationale: Причастие описывает авторитетные указания, данные ученикам в предшествующей речи. «Наставлять» естественно в контексте поручения, а более сильное «повелевать» сохранено в примечании.
- source_word: τοῖς δώδεκα μαθηταῖς αὐτοῦ
  choice: двенадцать Своих учеников
  rationale: «Ученики» — устоявшееся и точное соответствие μαθηταί в евангельском контексте; возвратное «Своих» естественно указывает на принадлежность при совпадении субъекта.
- source_word: μετέβη ἐκεῖθεν
  choice: Он ушёл оттуда
  rationale: Передаёт перемещение Иисуса из прежнего места и естественное продолжение повествования.
- source_word: τοῦ διδάσκειν καὶ κηρύσσειν
  choice: чтобы учить и проповедовать
  rationale: Артикулированные инфинитивы выражают цель; перевод сохраняет различие между обучением и публичным возвещением.
- source_word: ἐν ταῖς πόλεσιν αὐτῶν
  choice: в их городах
  rationale: Буквальная конструкция сохраняет неопределённость того, к кому относится местоимение αὐτῶν; πόλεις передано обычным словом «города».
theological_decisions:
- issue: К кому относится αὐτῶν в выражении ἐν ταῖς πόλεσιν αὐτῶν
  choice: Сохранить неоднозначное «в их городах».
  alternative: 'Уточнить: «в городах учеников», «в иудейских городах» или «в городах той местности».'
  rationale: Греческий текст прямо не называет референта местоимения. Перевод не должен устранять смысловую неопределённость посредством толкования.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным повествовательным тоном. Формула «Когда Иисус закончил…» звучит естественно, а «учить и проповедовать» сохраняет традиционную и понятную евангельскую лексику. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской практикой.
