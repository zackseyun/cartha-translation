  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ ἀκούετε καὶ βλέπετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/004.yaml
  text: And Jesus answered them[a], “Go and report to John what you hear and see:”
translation:
  language: ru
  text: 'Иисус ответил им[a]: «Пойдите и расскажите Иоанну, что вы слышите и видите:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «И Иисус, ответив, сказал им».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν αὐτοῖς
  choice: ответил им
  rationale: Обычная греческая повествовательная формула естественно передаётся по-русски одним глаголом «ответил»; адресат выражен местоимением «им».
- source_word: Πορευθέντες
  choice: Пойдите
  rationale: Предшествующее повелению сопутствующее причастие имеет здесь побудительную силу и обозначает действие, предшествующее сообщению.
- source_word: ἀπαγγείλατε
  choice: расскажите
  rationale: Глагол означает передать или сообщить полученные сведения; «расскажите» естественно звучит при указании адресата «Иоанну» и сохраняет смысл возвращения с сообщением.
- source_word: Ἰωάννῃ
  choice: Иоанну
  rationale: Дательный падеж обозначает адресата сообщения; имя передано в принятой русской библейской форме.
- source_word: ἃ ἀκούετε καὶ βλέπετε
  choice: что вы слышите и видите
  rationale: Сохраняются относительная конструкция, настоящее время и параллель слухового и зрительного восприятия.
theological_decisions:
- issue: Передача формулы ἀποκριθεὶς … εἶπεν
  choice: Иисус ответил им
  alternative: Иисус, отвечая, сказал им
  rationale: Сжатая передача соответствует нормам современного русского языка и не устраняет смысл ответа или введения прямой речи.
translation_notes:
  register: Современный литературный русский язык; ясная и достойная повествовательная речь без архаизации. Двоеточие в конце сохранено, поскольку высказывание продолжается в следующем стихе.
