  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ⸀ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/025.yaml
  text: At that time Jesus answered and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding[b], and revealed them to little children.”
translation:
  language: ru
  text: 'В то время Иисус сказал в ответ: «Славлю Тебя, Отец, Господь неба и земли, за то, что Ты скрыл это от мудрых и разумных и открыл младенцам[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «маленьким детям». Вероятно, здесь младенцы — образ людей, принимающих Божье откровение с детской простотой, однако сам образ в тексте не истолковывается.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: В то время
  rationale: Естественное русское соответствие временному обороту, сохраняющее связь с повествовательным контекстом.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: сказал в ответ
  rationale: Передаёт оба элемента греческой формулы и при этом звучит естественно по-русски, даже если непосредственно перед этим вопрос не приводится.
- source_word: Ἐξομολογοῦμαί σοι
  choice: Славлю Тебя
  rationale: В данном обращении глагол означает открытое признание, сопровождаемое хвалой или благодарением; «славлю» сохраняет возвышенный тон и не создаёт ложной ассоциации с исповеданием греха.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: Отец, Господь неба и земли
  rationale: Прямо сохраняет цепочку обращений и выражение Божьего владычества.
- source_word: ὅτι
  choice: за то, что
  rationale: В сочетании с русским «славлю» естественно вводит основание хвалы и сохраняет причинный оттенок.
- source_word: ἔκρυψας
  choice: Ты скрыл
  rationale: Прямо передаёт активную форму и сохраняет указанное в тексте действие Отца.
- source_word: ταῦτα ... αὐτά
  choice: это ... [это]
  rationale: Русское местоимение «это» сохраняет неопределённо-широкую отсылку греческого выражения; при втором глаголе дополнение естественно опущено во избежание тяжеловесного повтора.
- source_word: ἀπὸ σοφῶν καὶ συνετῶν
  choice: от мудрых и разумных
  rationale: Сохраняет субстантивированную пару качеств без добавления слова «людей» и без чрезмерного истолкования.
- source_word: ἀπεκάλυψας
  choice: открыл
  rationale: Обычное и точное русское библейское соответствие для раскрытия прежде сокрытого.
- source_word: νηπίοις
  choice: младенцам
  rationale: Сохраняет конкретный образ и метафорическую напряжённость греческого слова, не заменяя его толкованием вроде «смиренным».
theological_decisions:
- issue: Действие Бога в сокрытии и откровении
  choice: «Ты скрыл ... и открыл»
  alternative: «Ты допустил, чтобы это осталось скрытым ...»
  rationale: В греческом тексте Бог прямо выступает субъектом обоих активных глаголов. Перевод сохраняет эту богословскую напряжённость, не смягчая и не объясняя её посредством определённой доктринальной системы.
- issue: Значение νηπίοις
  choice: «младенцам» с пояснением в сноске
  alternative: «маленьким детям» или истолковательное «смиренным»
  rationale: Буквальное образное обозначение лучше сохраняет резкий контраст с «мудрыми и разумными»; сноска указывает на вероятное переносное употребление, не подменяя им основной текст.
- issue: Оттенок Ἐξομολογοῦμαί σοι
  choice: «Славлю Тебя»
  alternative: «Благодарю Тебя» или «исповедую Тебе»
  rationale: Контекст допускает хвалу, благодарение и открытое признание. Основной текст передаёт хвалебный тон, а сноска сохраняет реальную лексическую широту.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Местоимения при обращении к Богу написаны с прописной буквы в соответствии с распространённой русской издательской практикой. Лексическая многозначность Ἐξομολογοῦμαί σοι отражена в решениях, но отдельная сноска не добавлена, чтобы не перегружать единичный стих.
