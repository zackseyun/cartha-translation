id: MAT.11.21
reference: Matthew 11:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ἐγένοντο αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/021.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works done among you had taken place in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.
translation:
  language: ru
  text: Горе тебе, Хоразин! Горе тебе, Вифсаида! Ведь если бы в Тире и Сидоне совершились те могущественные дела[a], которые совершились среди вас, они давно бы покаялись во вретище и пепле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чудеса»; буквально — «деяния силы».'
    reason: Лексема δυνάμεις обозначает проявления силы и в евангельском контексте часто относится к чудесам.
lexical_decisions:
- source_word: Οὐαί σοι
  choice: Горе тебе
  rationale: Сохраняет одновременно пророческое обличение, скорбь и предупреждение о грядущем суде; по-русски естественно звучит как прямое обращение.
- source_word: Χοραζίν
  choice: Хоразин
  rationale: Устоявшаяся русская передача названия города.
- source_word: Βηθσαϊδά
  choice: Вифсаида
  rationale: Устоявшаяся русская передача названия города.
- source_word: ὅτι
  choice: Ведь
  rationale: Вводит основание предшествующего возгласа и естественно связывает части высказывания в современном русском языке.
- source_word: εἰ ... ἐγένοντο
  choice: если бы ... совершились
  rationale: Передаёт нереальное условие, относящееся к прошлому.
- source_word: αἱ δυνάμεις
  choice: могущественные дела
  rationale: Сохраняет связь существительного с силой и указывает на совершённые Иисусом деяния, не сводя значение только к современному понятию чуда.
- source_word: ἐν ὑμῖν
  choice: у вас
  rationale: Естественно обозначает события, происходившие среди жителей названных городов, а не внутри них.
- source_word: πάλαι ἂν ... μετενόησαν
  choice: они давно бы покаялись
  rationale: Передаёт как временное значение πάλαι, так и нереальное следствие с ἄν; «покаялись» точно и естественно выражает μετενόησαν в данном контексте.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: во вретище и пепле
  rationale: Сохраняет конкретный древний образ публичного скорбного покаяния и принятую русскую библейскую формулу.
theological_decisions:
- issue: Сопоставление Хоразина и Вифсаиды с Тиром и Сидоном
  choice: Сохранено как подлинное контрфактическое утверждение о более тяжкой ответственности городов, видевших могущественные дела Иисуса, но не покаявшихся.
  alternative: Понимать слова только как риторическое преувеличение без действительного сопоставления ответственности.
  rationale: Грамматика прямо выражает нереальное условие и его следствие. Перевод сохраняет силу сопоставления, не добавляя выводов о том, каким образом Иисусу известно гипотетическое поведение этих городов.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Названия городов даны в привычной русской библейской форме. Выражение «во вретище и пепле» намеренно сохраняет древний культурный образ; синтаксис при этом сделан ясным и естественным.
