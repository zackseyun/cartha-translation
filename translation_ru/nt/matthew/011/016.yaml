  text: But to what shall I compare this generation? It is like children sitting in the marketplaces[a], calling out to the others[b],
translation:
  language: ru
  text: 'Но с чем сравнить мне это поколение? Оно подобно детям, сидящим на площадях[a] и окликающим других[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на рыночных площадях». Греческое слово обозначает общественные площади, где торговали и собирались люди.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «других детей». В греческом тексте сказано просто «других»; из контекста сравнения понятно, что речь идёт о детях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίνι ... ὁμοιώσω
  choice: с кем сравнить Мне
  rationale: Дательный вопросительного местоимения обозначает объект сопоставления; по-русски риторический вопрос естественно передаётся инфинитивной конструкцией с «с кем». Заглавная буква в «Мне» указывает на говорящего Иисуса в принятом русском библейском оформлении, не меняя смысла.
- source_word: δὲ
  choice: Но
  rationale: Передаёт мягкий переход с оттенком противопоставления в ходе рассуждения.
- source_word: γενεὰν ταύτην
  choice: это поколение
  rationale: Сохраняет обычное значение γενεά — современное Иисусу поколение, не сужая его до отдельной возрастной группы.
- source_word: ὁμοία ἐστὶν
  choice: Оно подобно
  rationale: Достоинная и естественная русская формулировка, сохраняющая прямое сравнение.
- source_word: παιδίοις
  choice: детям
  rationale: Нейтрально передаёт обозначение детей без ненужного усиления уменьшительного оттенка.
- source_word: καθημένοις
  choice: сидящим
  rationale: Сохраняет одновременное описание положения детей.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: на площадях
  rationale: ἀγορά — общественное открытое пространство, служившее рынком и местом собраний; «на площадях» естественно по-русски и не создаёт образа современных торговых помещений.
- source_word: προσφωνοῦντα
  choice: окликающим
  rationale: Передаёт громкое обращение к находящимся поблизости людям и естественно подходит к изображённой сцене.
- source_word: τοῖς ἑτέροις
  choice: других
  rationale: Сохраняет неопределённость греческого выражения «других», не добавляя прямо отсутствующее существительное «детей».
