  text: καὶ μακάριός ἐστιν ὃς ⸀ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/006.yaml
  text: And blessed is the one who is not offended by me[a].
translation:
  language: ru
  text: И блажен тот, кто не преткнётся из-за Меня[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не соблазнится из-за Меня»; возможный смысл: «не отвернётся от Меня».'
    reason: Лексический диапазон σκανδαλισθῇ включает преткновение, соблазн и вызванное Иисусом отступление или неприятие.
lexical_decisions:
- source_word: μακάριος
  choice: блажен
  rationale: «Блажен» сохраняет религиозную весомость слова и естественно звучит в евангельском изречении о благословенном положении человека.
- source_word: ὃς ἐὰν μὴ
  choice: тот, кто не
  rationale: Передаёт обобщённо-условный смысл конструкции и сохраняет представительное единственное число.
- source_word: σκανδαλισθῇ
  choice: не преткнётся
  rationale: Сохраняет метафору препятствия, ведущего к колебанию или отпадению, не сводя смысл лишь к эмоциональной обиде.
- source_word: ἐν ἐμοί
  choice: из-за Меня
  rationale: В сочетании со σκανδαλίζω указывает на Иисуса как повод или основание преткновения; по-русски «из-за Меня» ясно и естественно выражает эту связь.
- source_word: καί
  choice: И
  rationale: Сохраняет связь изречения с предшествующим контекстом.
theological_decisions:
- issue: Смысл σκανδαλισθῇ по отношению к Иисусу
  choice: 'Сохранить в основном тексте образ преткновения: «не преткнётся из-за Меня».'
  alternative: «не соблазнится из-за Меня»; «не отвернётся от Меня»
  rationale: Греческое слово может охватывать неприятие, утрату доверия и отпадение. Образ преткновения сохраняет эту богословскую напряжённость, не ограничивая смысл простой эмоциональной обидой и не уточняя преждевременно конечный результат.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельского изречения. «Блажен» сохраняет узнаваемую форму макаризма; прописная буква в «Меня» соответствует принятому русскому библейскому оформлению речи Иисуса.
