base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/025.yaml
  text: And they came and woke him[a], saying, “Lord, save us! We are perishing!”
translation:
  language: ru
  text: 'Подойдя, они разбудили Его и сказали: «Господи, спаси нас[a]! Мы погибаем!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавь нас». Греческое σῶσον может означать как немедленное избавление от опасности, так и спасение в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: подойдя
  rationale: Аористное причастие от προσέρχομαι обозначает движение к Иисусу перед тем, как ученики Его разбудили. «Подойдя» естественно и точно передаёт последовательность действий.
- source_word: ἤγειραν
  choice: разбудили
  rationale: В данном контексте ἐγείρω означает пробудить спящего, а не «поднять» или «воскресить».
- source_word: λέγοντες
  choice: и сказали
  rationale: Причастие вводит прямую речь. В современном русском повествовании сочинённая конструкция звучит естественнее буквального «говоря» и не добавляет отсутствующего в греческом эмоционального оттенка.
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма κύριος передана традиционной и современной русской формой обращения «Господи», сохраняющей возможную христологическую значимость титула.
- source_word: σῶσον
  choice: спаси нас
  rationale: Аористный императив выражает настоятельную просьбу о немедленном избавлении от опасности. Объект «нас» подразумевается контекстом и следующим глаголом первого лица множественного числа.
- source_word: ἀπολλύμεθα
  choice: мы погибаем
  rationale: Настоящее время ἀπόλλυμι выражает происходящую или неминуемую гибель. «Погибаем» сохраняет срочность и широту значения лучше, чем более узкое «умираем».
theological_decisions:
- issue: Передача κύριος как обращения к Иисусу
  choice: Господи
  alternative: Учитель / господин
  rationale: «Господи» сохраняет как уважительное обращение, так и возможную более глубокую христологическую значимость, не сводя титул к одной интерпретации.
- issue: Выражение подразумеваемого объекта при σῶσον
  choice: спаси нас
  alternative: спаси
  rationale: В русском языке «спаси нас» естественно выражает очевидный из контекста объект; это подтверждается следующим «мы погибаем» и не вносит нового богословского содержания.
translation_notes:
  register: Современный литературный русский язык с ясным, кратким и достойным библейским звучанием. Прописная буква в местоимении «Его» следует принятой русской традиции уважительного обозначения Иисуса; прямая речь передаёт напряжённость без добавления эмоционально окрашенного глагола вроде «воскликнули».
