id: MAT.8.13
reference: Matthew 8:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς τῷ ἑκατοντάρχῃ· Ὕπαγε, ⸀ὡς ἐπίστευσας γενηθήτω σοι· καὶ ἰάθη ὁ ⸀παῖς ἐν τῇ ὥρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/013.yaml
  text: And Jesus said to the centurion[a], “Go; as you have believed, let it be done for you.” And the servant was healed in that hour.
translation:
  language: ru
  text: 'Иисус сказал сотнику: «Иди, и пусть будет тебе так, как ты поверил». И в тот же час слуга[a] исцелился.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «мальчик», или «ребёнок». Греческое слово παῖς может обозначать как слугу, так и юного человека; в данном контексте лучше подходит «слуга» — подчинённый сотника.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: сотнику
  rationale: Точный и привычный русский термин для римского военного начальника соответствующего ранга.
- source_word: Ὕπαγε
  choice: Иди
  rationale: Кратко и естественно передаёт повелительное наклонение глагола удаления без добавления отсутствующих в греческом тексте оттенков.
- source_word: ὡς ἐπίστευσας
  choice: как ты поверил
  rationale: Сохраняет глагольную и личную форму выражения, не заменяя её более отвлечённым оборотом «по вере твоей».
- source_word: γενηθήτω σοι
  choice: пусть будет тебе так
  rationale: Передаёт побудительную силу пассивного императива и естественно сочетается по-русски с предшествующим «как ты поверил».
- source_word: παῖς
  choice: слуга
  rationale: В контексте речи сотника о подчинённом это наиболее вероятное значение; возможные значения «мальчик» и «ребёнок» сохранены в сноске.
- source_word: ἰάθη
  choice: исцелился
  rationale: Естественно передаёт наступившее исцеление; русская возвратная форма здесь соответствует греческому страдательному значению без обязательного указания действующего лица.
- source_word: ἐν τῇ ὥρᾳ ἐκείνῃ
  choice: в тот же час
  rationale: Сохраняет образ часа и подчёркивает совпадение времени, не сужая выражение до точного мгновения.
theological_decisions:
- issue: Передача πιστεύω
  choice: поверил
  alternative: доверился; имел веру
  rationale: «Поверил» прямо передаёт личный глагольный акт веры и не превращает его в отвлечённое существительное.
- issue: Связь веры сотника с исполнением просьбы
  choice: пусть будет тебе так, как ты поверил
  alternative: по вере твоей да будет тебе
  rationale: Выбранная форма сохраняет связь ὡς с тем, как сотник поверил, не уточняя сверх текста ни меру веры, ни причинный механизм исцеления.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис умеренно близок к греческому, но естественен для обычного читателя; традиционное «по вере твоей» не использовано, чтобы сохранить глагольную форму оригинала.
