  source_fidelity: 'Перевод точно передаёт все основные элементы греческого текста: обращение к сотнику, повеление уйти, соответствие исполненного его вере и исцеление παῖς в тот же час. «Пусть будет тебе так, как ты поверил» сохраняет личную глагольную форму ὡς ἐπίστευσας и побудительную силу γενηθήτω σοι. «В тот же час» является естественной русской передачей ἐν τῇ ὥρᾳ ἐκείνῃ в данном повествовательном контексте.'
