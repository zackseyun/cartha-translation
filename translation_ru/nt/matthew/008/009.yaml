id: MAT.8.9
reference: Matthew 8:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ⸀ἐξουσίαν, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/009.yaml
  text: For I also am a man under authority[a], having soldiers under me. And I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: ru
  text: 'Ведь и я человек, подчинённый власти, и у меня есть воины, подчинённые мне. Я говорю одному: «Ступай», — и он идёт; другому: «Иди сюда», — и он приходит; а моему рабу[a]: «Сделай это», — и он делает.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуге».'
    reason: Лексема δοῦλος может передаваться как «раб» или, шире, «слуга»; основной вариант точнее отражает социальный статус в данном контексте.
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Ведь и
  rationale: 'Передаёт пояснительно-аргументирующую силу γάρ и сохраняет καί: сотник обосновывает сказанное, указывая, что он также находится в структуре власти.'
- source_word: ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν
  choice: я человек, подчинённый власти
  rationale: Естественно передаёт положение сотника в иерархии и не уточняет, чья именно это власть, поскольку источник этого не называет.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: у меня есть воины, подчинённые мне
  rationale: Ясно сохраняет параллель между властью над сотником и его властью над подчинёнными; «воины» соответствует военному контексту.
- source_word: λέγω τούτῳ· Πορεύθητι
  choice: 'говорю одному: «Ступай»'
  rationale: Русское «одному» естественно выражает индивидуализирующее τούτῳ в паре с «другому»; «ступай» передаёт краткий приказ отправиться.
- source_word: ἄλλῳ· Ἔρχου
  choice: 'другому: «Иди сюда»'
  rationale: «Иди сюда» — естественная современная русская команда, передающая направленное к говорящему ἔρχου без стилистически двусмысленного «приходи».
- source_word: τῷ δούλῳ μου
  choice: моему рабу
  rationale: δοῦλος в хозяйственно-правовом мире I века обычно обозначает раба, а не свободного наёмного слугу; основной текст сохраняет социальную реальность источника.
- source_word: Ποίησον τοῦτο, καὶ ποιεῖ
  choice: «Сделай это», — и он делает
  rationale: Сохраняет простую параллель приказа и немедленного исполнения, включая настоящее время греческих форм.
theological_decisions:
- issue: Смысл δοῦλος в примере сотника
  choice: раб
  alternative: слуга
  rationale: Контекст подчёркивает реальную подчинённость в структуре власти. «Раб» точнее передаёт обычное значение δοῦλος и не смягчает социальный статус; более широкое «слуга» отмечено как допустимый вариант.
- issue: Характер власти сотника
  choice: подчинённый власти
  alternative: находящийся под чьей-то властью
  rationale: Формулировка сохраняет намеренную неопределённость ὑπὸ ἐξουσίαν и аналогию делегированной власти, не добавляя отсутствующего в тексте субъекта власти.
translation_notes:
  register: Современный литературный русский язык с краткими, отчётливыми командами и сохранённым ритмическим параллелизмом греческого текста. «Ведь и я» передаёт ход рассуждения; «подчинённый» ясно обозначает вертикаль власти. Пунктуация адаптирована к нормам русской прямой речи.
