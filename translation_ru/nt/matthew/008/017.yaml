  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Αὐτὸς τὰς ἀσθενείας ἡμῶν ἔλαβεν καὶ τὰς νόσους ἐβάστασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[b][a], saying: “He himself took our sicknesses and carried our diseases.”'
translation:
  language: ru
  text: 'чтобы исполнилось сказанное через пророка Исаию: «Он Сам взял наши немощи[a] и понёс наши болезни[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «недуги»; греческое слово может означать слабости, немощи или болезни.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вынес наши болезни». Греческий глагол означает «нести, нести бремя».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: чтобы исполнилось
  rationale: Передаёт целевое/результативное значение ὅπως с аористом сослагательного наклонения и сохраняет характерную для Матфея формулу исполнения.
- source_word: τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου
  choice: сказанное через пророка Исаию
  rationale: Естественно передаёт субстантивированное причастие и διά с родительным как посредничество пророка.
- source_word: λέγοντος
  choice: не передано отдельным словом
  rationale: В русском двоеточие после формулы «сказанное через пророка Исаию» естественно вводит цитату; буквальное «говорящего» было бы тяжеловесным и двусмысленным.
- source_word: Αὐτὸς
  choice: Он Сам
  rationale: Сохраняет эмфатическое употребление местоимения.
- source_word: ἀσθενείας
  choice: немощи
  rationale: Охватывает слабости, недуги и болезненные состояния, сохраняя широту греческого слова и уместность в контексте исцелений.
- source_word: ἔλαβεν
  choice: взял
  rationale: Прямо передаёт λαμβάνω, не добавляя значения «унёс» или явно заместительного смысла.
- source_word: νόσους
  choice: болезни
  rationale: Точно и естественно передаёт обозначение телесных заболеваний.
- source_word: ἐβάστασεν
  choice: понёс
  rationale: Передаёт значение «нести, брать на себя» и сохраняет связь с образом Исайи 53:4, не устраняя его богословской напряжённости.
theological_decisions:
- issue: Цитата из Исайи 53:4 в контексте исцелений у Матфея
  choice: «немощи» и «болезни»
  alternative: «недуги» и «болезни»; либо более узкое медицинское «болезни» в обоих случаях
  rationale: Контекст у Матфея относится к телесным исцелениям, но ἀσθένεια шире строгого названия болезни. Формулировка не сводит цитату ни исключительно к медицине, ни к заранее заданному учению об искуплении.
- issue: Значение ἐβάστασεν
  choice: «понёс»
  alternative: «нёс» или «вынес»
  rationale: «Понёс» естественно выражает принятие бремени на себя и сохраняет традиционную связь с Исайей, не поясняя сверх сказанного, каким именно образом это произошло.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. «Он Сам» сохраняет акцент оригинала; двоеточие вместо отдельного перевода λέγοντος делает фразу естественной. Маркеры сносок стоят непосредственно после соответствующих слов.
