base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/033.yaml
  text: Then the herdsmen fled[a], and going away into the city, they reported everything, including what had happened to the demon-possessed men.
translation:
  language: ru
  text: Свинопасы же убежали и, придя в город, рассказали обо всём, в том числе о том, что произошло с одержимыми бесами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и [о] том, что касается одержимых бесами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ βόσκοντες
  choice: Пастухи же
  rationale: Субстантивированное причастие обозначает тех, кто пас стадо; «пастухи» естественно и кратко передаёт их роль. Частица δέ сохранена словом «же», отмечающим продолжение повествования.
- source_word: ἔφυγον
  choice: убежали
  rationale: Форма φεύγω означает бегство; «убежали» — прямой и естественный повествовательный эквивалент.
- source_word: ἀπελθόντες εἰς τὴν πόλιν
  choice: придя в город
  rationale: Аористное причастие передаёт действие, предшествующее сообщению. «Придя в город» естественно по-русски и сохраняет направленность εἰς.
- source_word: ἀπήγγειλαν πάντα
  choice: рассказали обо всём
  rationale: ἀπαγγέλλω здесь означает сообщить или рассказать, а πάντα охватывает всё случившееся; сочетание звучит естественно в современном русском повествовании.
- source_word: καὶ τὰ τῶν δαιμονιζομένων
  choice: в том числе о том, что произошло с одержимыми бесами
  rationale: Буквально эллиптическая фраза означает «и [о] том, что касается одержимых бесами». Основной текст раскрывает подразумеваемый событийный смысл, а сноска сохраняет формальную неоднозначность.
- source_word: δαιμονιζομένων
  choice: одержимыми бесами
  rationale: Причастие обозначает людей, находящихся под властью бесов. Устоявшееся русское выражение ясно передаёт реальность описанного состояния, не добавляя более точной доктринальной классификации.
theological_decisions:
- issue: Передача δαιμονιζομένων без внесения отсутствующих в тексте различий между видами демонического воздействия
  choice: одержимыми бесами
  alternative: страдавшими от бесов
  rationale: Выбранное выражение непосредственно и узнаваемо передаёт состояние персонажей в повествовании; при этом перевод не уточняет механизм или степень воздействия сверх значения исходного слова.
- issue: Смысл эллиптического оборота τὰ τῶν δαιμονιζομένων
  choice: то, что произошло с одержимыми бесами
  alternative: то, что касается одержимых бесами
  rationale: Контекст допускает событийное раскрытие оборота, однако греческий текст формально говорит шире — о делах или обстоятельствах, связанных с этими людьми. Более буквальная возможность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное. Слово «бесы» соответствует традиционной русской библейской лексике и остаётся понятным современному читателю. Сноска сохраняет эллиптичность и более широкий смысл греческого оборота.
