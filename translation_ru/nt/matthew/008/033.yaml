  source_fidelity: 'В целом смысл передан точно: βόσκοντες — люди, пасшие стадо; ἔφυγον — «убежали»; аористное причастие ἀπελθόντες естественно передано оборотом «придя в город»; ἀπήγγειλαν πάντα — «рассказали обо всём». Раскрытие τὰ τῶν δαιμονιζομένων как «то, что произошло с…» контекстуально оправдано, но сноска должна яснее сохранять более широкое значение греческого эллиптического выражения. «Пастухи» без уточнения может в русском вызвать представление о пастухах овец, хотя контекст прямо определяет их как пастухов свиней.'
