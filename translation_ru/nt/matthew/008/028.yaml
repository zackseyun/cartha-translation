id: MAT.8.28
reference: Matthew 8:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ πέραν εἰς τὴν χώραν τῶν ⸀Γαδαρηνῶν ὑπήντησαν αὐτῷ δύο δαιμονιζόμενοι ἐκ τῶν μνημείων ἐξερχόμενοι, χαλεποὶ λίαν ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/028.yaml
  text: And when he came to the other side[a], into the region of the Gadarenes, two demon-possessed men met him, coming out of the tombs[c][b], so extremely fierce that no one was able to pass along that road.
translation:
  language: ru
  text: Когда Он прибыл на другой берег, в область гадаринцев[a], навстречу Ему из гробниц вышли два человека, одержимые бесами. Они были настолько свирепы[b], что никто не мог пройти той дорогой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «гергесинцев» или «герасинцев» вместо «гадаринцев».'
    reason: textual_variant
  - marker: b
    text: 'Или: «настолько опасны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: когда Он прибыл
  rationale: Независимый родительный оборот естественно передан временным придаточным; «прибыл» уместно описывает достижение другого берега.
- source_word: τὸ πέραν
  choice: другой берег
  rationale: В данном контексте выражение обозначает противоположный берег озера.
- source_word: χώραν τῶν Γαδαρηνῶν
  choice: область гадаринцев
  rationale: χώρα означает область или территорию, а форма Γαδαρηνῶν в основном тексте SBLGNT обозначает её жителей.
- source_word: ὑπήντησαν αὐτῷ
  choice: навстречу Ему … вышли
  rationale: Русская конструкция естественно передаёт встречное движение, выраженное ὑπαντάω, и одновременно связывает его с последующим ἐξερχόμενοι.
- source_word: δύο δαιμονιζόμενοι
  choice: два человека, одержимые бесами
  rationale: Передача ясно выражает мужской референт и состояние под властью бесов, не превращая греческое причастие в специальный термин.
- source_word: ἐκ τῶν μνημείων ἐξερχόμενοι
  choice: из гробниц вышли
  rationale: μνημεῖον здесь обозначает место погребения; «гробницы» точно и понятно в современном русском.
- source_word: χαλεποὶ λίαν
  choice: настолько свирепы
  rationale: χαλεπός в контексте передаёт угрожающую свирепость или опасность, а λίαν усиливает признак; «настолько» также естественно вводит следствие.
- source_word: ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης
  choice: что никто не мог пройти той дорогой
  rationale: ὥστε выражает результат, ἰσχύω — практическую возможность, а διά с родительным указывает путь движения.
theological_decisions:
- issue: Передача бесовской одержимости
  choice: одержимые бесами
  alternative: находившиеся под властью бесов
  rationale: Выбранное выражение понятно современному читателю и сохраняет представленную в стихе реальность личного бесовского воздействия, не уточняя его механизм сверх смысла δαιμονιζόμενοι.
- issue: Разночтение в названии местности
  choice: гадаринцев
  alternative: гергесинцев или герасинцев
  rationale: Основной текст следует чтению Γαδαρηνῶν в SBLGNT, а значимые рукописные варианты указаны в сноске.
- issue: Смысл χαλεποί
  choice: свирепы
  alternative: опасны
  rationale: «Свирепы» сохраняет характеристику самих людей и объясняет невозможность пройти дорогой, не сводя слово исключительно к физическому насилию.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом и умеренно высоким библейским регистром. Местоимения, относящиеся к Иисусу, написаны с прописной буквы. Греческое длинное предложение разделено на два русских для естественности и ясности без изменения логической связи.
