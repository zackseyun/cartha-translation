  text: Когда Иисус пришёл в дом Петра, Он увидел, что тёща Петра лежит в лихорадке.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «увидел тёщу Петра, лежавшую с лихорадкой». Греческий текст говорит, что она находилась в лежачем положении и была в лихорадке; постель прямо не упомянута.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: когда Иисус пришёл
  rationale: Аористное причастие естественно передаёт предшествующее обстоятельство времени; конструкция с «когда» ясна и сохраняет временную связь.
- source_word: οἰκίαν Πέτρου
  choice: в дом Петра
  rationale: Прямо передаёт родительный падеж принадлежности и значение οἰκία; по-русски звучит естественно.
- source_word: πενθερὰν αὐτοῦ
  choice: тёща Петра
  rationale: πενθερά означает «тёща». Повтор имени устраняет возможную двусмысленность русского местоимения и ясно указывает, что речь идёт о тёще Петра, а не Иисуса.
- source_word: βεβλημένην
  choice: лежит
  rationale: Перфектное пассивное причастие здесь описывает состояние лежащего человека; «лежит» естественно по-русски и не добавляет отсутствующего в тексте упоминания постели.
- source_word: πυρέσσουσαν
  choice: в горячке
  rationale: Причастие обозначает продолжающееся лихорадочное состояние. «Лежать в горячке» — краткое, понятное и близкое по смыслу русское выражение.
theological_decisions:
- issue: К кому относится αὐτοῦ в выражении «его тёщу»
  choice: 'Уточнить: «тёща Петра»'
  alternative: «его тёща», что по-русски может быть ошибочно отнесено к Иисусу
  rationale: Синтаксис и контекст указывают на Петра. Уточнение сохраняет смысл исходного текста и не делает дополнительных богословских выводов.
translation_notes:
  register: Современный литературный русский язык, сдержанный повествовательный стиль. Местоимение «Он» оформлено с прописной буквы согласно распространённой русской библейской традиции; лексика остаётся понятной широкому читателю.
