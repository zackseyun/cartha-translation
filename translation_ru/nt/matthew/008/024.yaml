source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς μέγας ἐγένετο ἐν τῇ θαλάσσῃ, ὥστε τὸ πλοῖον καλύπτεσθαι ὑπὸ τῶν κυμάτων, αὐτὸς δὲ ἐκάθευδεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/024.yaml
  text: And behold[a], a great storm arose on the sea, so that the boat was being swamped by the waves[b]; but he was sleeping.
translation:
  language: ru
  text: И вот, на море поднялась сильная буря, так что волны захлёстывали лодку[a], а Он спал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лодка покрывалась волнами».'
    reason: Сноска сохраняет более буквальное пассивное значение καλύπτεσθαι — «быть покрываемой».
lexical_decisions:
- source_word: ἰδοὺ
  choice: и вот
  rationale: Сохраняет яркий указательный маркер и внезапность перехода, оставаясь естественным для современного литературного русского.
- source_word: σεισμὸς μέγας
  choice: сильная буря
  rationale: Хотя σεισμός буквально обозначает сотрясение и нередко землетрясение, морской контекст — море, лодка и волны — указывает на бурное волнение воды. «Сильная буря» ясно передаёт смысл без ложного образа землетрясения.
- source_word: ἐγένετο ἐν τῇ θαλάσσῃ
  choice: на море поднялась
  rationale: Естественная русская конструкция для начала бури; «на море» сохраняет исходное обозначение θάλασσα, не заменяя его географически уточняющим «озером».
- source_word: ὥστε
  choice: так что
  rationale: Передаёт следствие силы бури.
- source_word: τὸ πλοῖον
  choice: лодку
  rationale: В евангельском контексте небольшого судна на Галилейском море «лодка» естественнее, чем «корабль».
- source_word: καλύπτεσθαι ὑπὸ τῶν κυμάτων
  choice: волны захлёстывали лодку
  rationale: Передаёт продолжающееся действие пассивного инфинитива естественной русской активной конструкцией. «Захлёстывали» выражает покрытие лодки волнами, не утверждая однозначно, что она уже наполнялась водой.
- source_word: αὐτὸς δὲ ἐκάθευδεν
  choice: а Он спал
  rationale: «А» естественно подчёркивает контраст с бурей, а несовершенный вид «спал» передаёт продолжающееся действие. Местоимение с прописной буквы соответствует принятому благоговейному русскому библейскому употреблению.
theological_decisions:
- issue: Характер события, обозначенного словом σεισμός
  choice: Контекстуально передано как «буря».
  alternative: 'Буквально: «землетрясение» или «сильное сотрясение».'
  rationale: Это лексико-контекстуальное, а не конфессиональное решение. Морские образы в самом стихе показывают, что речь идёт о сильном волнении на море; «землетрясение» в русском создало бы не предусмотренный контекстом образ.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. «И вот» сохраняет повествовательную выразительность оригинала; порядок частей подчёркивает контраст между опасностью и сном Иисуса.
