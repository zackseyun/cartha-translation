  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσελθόντος δὲ αὐτοῦ
  choice: Когда Иисус вошёл
  rationale: Генитив абсолютный с аористным причастием естественно передан временным придаточным. Имя «Иисус» восстановлено из ближайшего контекста, чтобы по-русски избежать неясного начального «он».
- source_word: εἰς Καφαρναοὺμ
  choice: в Капернаум
  rationale: Использована традиционная и общепонятная русская форма названия города; при глаголе «вошёл» предлог передаёт движение внутрь.
- source_word: προσῆλθεν αὐτῷ
  choice: к нему подошёл
  rationale: «Подошёл» точно и естественно передаёт προσέρχομαι в повествовательном контексте.
- source_word: ἑκατόνταρχος
  choice: сотник
  rationale: Традиционный русский термин точно обозначает командира примерно ста воинов и сохраняет конкретность воинского звания.
- source_word: παρακαλῶν αὐτὸν
  choice: и стал просить его
  rationale: Конструкция передаёт сопутствующее действие и продолженный характер просьбы, не усиливая значение до безусловного «умолять».
