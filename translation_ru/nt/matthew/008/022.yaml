    rationale: В греческом оба случая представлены одним и тем же словом νεκρούς. Пара «мёртвым ... мертвецов» сохраняет общий корень, но заменяет второе слово другим существительным с более узким и стилистически окрашенным значением. «Мёртвым ... мёртвых» лучше сохраняет намеренную двусмысленность и риторический повтор.
  - severity: low
