  naturalness: «Предоставь мёртвым хоронить своих мёртвых» — естественная для современного литературного русского, ясная и сдержанная формулировка. Она несколько точнее передаёт конструкцию ἄφες ... θάψαι, чем «оставь мёртвым хоронить».
  terminology: «Мёртвые» сохраняет лексическое тождество обоих употреблений νεκρούς и не навязывает в основном тексте толкование «духовно мёртвые». Написание «Мной» допустимо в избранном уважительном оформлении.
