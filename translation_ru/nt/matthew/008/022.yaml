  text: ὁ δὲ Ἰησοῦς ⸀λέγει αὐτῷ· Ἀκολούθει μοι, καὶ ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/022.yaml
  text: But Jesus says to him[a], “Follow me, and leave the dead to bury their own dead.”
translation:
  language: ru
  text: 'Но Иисус говорит ему: «Следуй за Мной и предоставь мёртвым хоронить своих мёртвых».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Первое слово «мёртвым» часто понимают метафорически: те, кто духовно не откликается, могут хоронить физически умерших.'
    reason: Альтернативное толкование образного смысла первого употребления слова «мёртвые».
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт мягкое противопоставление просьбе ученика в предыдущем стихе, не усиливая его чрезмерно.
- source_word: λέγει
  choice: говорит
  rationale: Сохраняет историческое настоящее греческого повествования и его живость.
- source_word: Ἀκολούθει μοι
  choice: Следуй за Мной
  rationale: Естественно передаёт прямое повеление, включающее как следование за Иисусом, так и ученичество.
- source_word: ἄφες
  choice: оставь
  rationale: Передаёт призыв отказаться от этой заботы или обязанности; формулировка прямее, чем разрешительное «позволь».
- source_word: νεκρούς ... νεκρούς
  choice: мёртвым ... мертвецов
  rationale: 'Сохраняет повтор одного корня и намеренную смысловую напряжённость: первое употребление допускает метафорический смысл, второе обозначает умерших.'
- source_word: θάψαι
  choice: хоронить
  rationale: Инфинитив после «оставь» естественно воспроизводит греческую конструкцию.
- source_word: τοὺς ἑαυτῶν νεκρούς
  choice: своих мертвецов
  rationale: Возвратное «своих» сохраняет подчёркнутую соотнесённость ἑαυτῶν с подлежащим; «мертвецов» здесь естественнее по-русски, чем субстантивированное «своих мёртвых».
theological_decisions:
- issue: Толкование первого употребления слова «мёртвые»
  choice: В основном тексте сохранена формулировка «мёртвым ... своих мертвецов» без добавления «духовно».
  alternative: Первое слово прямо перевести как «духовно мёртвым», а второе — как обозначение физически умерших.
  rationale: Греческий текст повторяет одно и то же слово и не содержит уточнения «духовно». Сохранение словесной игры не устраняет намеренную богословскую напряжённость; вероятный метафорический смысл первого употребления отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык, прямой и торжественно-сдержанный. Историческое настоящее сохранено. Написание «Мной» выбрано как традиционное уважительное оформление местоимения, относящегося к Иисусу; смысловой неоднозначности оно не добавляет.
