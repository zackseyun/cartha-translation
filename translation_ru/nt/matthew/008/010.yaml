source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς ἐθαύμασεν καὶ εἶπεν τοῖς ἀκολουθοῦσιν· Ἀμὴν λέγω ὑμῖν, ⸂παρ’ οὐδενὶ τοσαύτην πίστιν ἐν τῷ Ἰσραὴλ⸃ εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/010.yaml
  text: When Jesus heard this[a], he marveled and said to those following him, “Truly I tell you[b], with no one in Israel have I found such faith.”
translation:
  language: ru
  text: 'Услышав это, Иисус удивился и сказал тем, кто шёл за ним: «Истинно говорю вам: ни у кого в Израиле Я не нашёл такой веры[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «столь великой веры».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Услышав это
  rationale: Аористное причастие передаёт обстоятельство, предшествующее основному действию. Местоимение «это» естественно отсылает к предшествующим словам сотника.
- source_word: ἐθαύμασεν
  choice: удивился
  rationale: Передаёт сильное удивление Иисуса без дополнительных толкований; это естественное и современное русское соответствие.
- source_word: τοῖς ἀκολουθοῦσιν
  choice: тем, кто шёл за ним
  rationale: Причастие обозначает людей, сопровождавших Иисуса в тот момент, а не обязательно формально определённую группу учеников.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Истинно говорю вам
  rationale: Сохраняет торжественную и подчёркнутую формулу Иисуса, оставаясь понятной в современном русском языке.
- source_word: παρ’ οὐδενὶ
  choice: ни у кого
  rationale: 'παρά с дательным здесь указывает на наличие качества у человека: такой веры Иисус не обнаружил ни у одного человека.'
- source_word: τοσαύτην πίστιν
  choice: такой веры
  rationale: Сохраняет πίστις как «вера», а τοσαύτην передаёт указание на исключительную степень; возможный более явный вариант отмечен в сноске.
- source_word: ἐν τῷ Ἰσραὴλ
  choice: в Израиле
  rationale: Прямо передаёт локативно-корпоративное выражение, относящееся к народу Израиля.
- source_word: εὗρον
  choice: Я не нашёл
  rationale: Русское прошедшее время естественно соответствует греческому аористу и сохраняет образ обнаружения веры у человека.
theological_decisions:
- issue: Передача πίστις
  choice: вера
  alternative: доверие
  rationale: В контексте имеется в виду уверенность сотника во власти Иисуса. «Вера» сохраняет широкий богословский и повествовательный смысл греческого слова, не сводя его только к психологическому доверию.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной речью. Формула «Истинно говорю вам» сохраняет библейскую весомость; повествовательная часть сформулирована естественно и без архаизмов.
