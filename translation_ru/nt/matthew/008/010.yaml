  source_fidelity: 'Текст точно передаёт греческий оригинал: обстоятельственное «Услышав это» соответствует ἀκούσας; «удивился» — ἐθαύμασεν; адресаты обозначены как люди, сопровождавшие Иисуса; формула «Истинно говорю вам» сохраняет торжественную эмфазу Ἀμὴν λέγω ὑμῖν. Оборот «ни у кого в Израиле Я не нашёл такой веры» верно выражает παρ’ οὐδενὶ, ἐν τῷ Ἰσραήλ, τοσαύτην πίστιν и εὗρον. Русское прошедшее время для аориста естественно и не вносит нового смыслового оттенка.'
  naturalness: Фраза звучит естественно на современном литературном русском. «Тем, кто шёл за ним» удачно избегает необоснованного отождествления сопровождавших людей с кругом учеников. Порядок слов в заключительном высказывании ясен и сохраняет риторическое ударение на исключительности веры.
  terminology: «Вера» — точное и устойчивое соответствие πίστις в данном контексте. «Израиль» сохранён без интерпретирующей замены на «народ Израиля». Формула речи Иисуса выдержана в умеренно торжественном, но понятном регистре.
