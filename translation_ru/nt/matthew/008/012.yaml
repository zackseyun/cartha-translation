  text: οἱ δὲ υἱοὶ τῆς βασιλείας ἐκβληθήσονται εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/012.yaml
  text: But the sons of the kingdom will be cast out into the outer darkness[c][b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: ru
  text: А сыны Царства[a] будут брошены во внешнюю тьму[b]. Там будет плач и скрежет зубов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья Царства»; так названы те, кого считали принадлежащими Царству и его законными наследниками.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во тьму снаружи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τῆς βασιλείας
  choice: сыны Царства
  rationale: 'Сохраняет греческий образ и его иронию: те, кого считали принадлежащими Царству и его законными наследниками, оказываются исключены. «Сыны» здесь — идиоматическое обозначение, а не указание исключительно на мужчин.'
- source_word: ἐκβληθήσονται
  choice: будут брошены
  rationale: Передаёт будущую пассивную форму и силу глагола ἐκβάλλω, не добавляя явно названного исполнителя действия.
- source_word: τὸ σκότος τὸ ἐξώτερον
  choice: внешняя тьма
  rationale: Сохраняет характерный для Матфея конкретный образ тьмы, находящейся снаружи, не заменяя его богословским толкованием.
- source_word: κλαυθμός
  choice: плач
  rationale: Обычное и точное русское соответствие, выражающее скорбь без неоправданного усиления.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: скрежет зубов
  rationale: Устоявшееся и точное русское выражение, сохраняющее образ греческого текста.
- source_word: δὲ
  choice: А
  rationale: Передаёт контраст с предыдущим стихом, где говорится о многих, пришедших с востока и запада.
- source_word: ἐκεῖ
  choice: Там
  rationale: Позиция в начале второго предложения сохраняет вынесенный вперёд локативный акцент греческой фразы.
theological_decisions:
- issue: Образ исключения и суда
  choice: Сохранить образы изгнания во внешнюю тьму, плача и скрежета зубов
  alternative: Передать толковательно как «ад» или «вечное наказание»
  rationale: Стих изображает суровый эсхатологический суд, однако сам греческий текст использует образный язык и не употребляет здесь слово «ад»; перевод не должен превращать образ в более широкое догматическое определение.
- issue: Передача υἱοὶ в идиоме υἱοὶ τῆς βασιλείας
  choice: сыны Царства
  alternative: дети Царства; наследники Царства; те, кому надлежало войти в Царство
  rationale: Формально близкий вариант сохраняет мужскую грамматическую форму, семитский характер идиомы и контраст между ожидаемой принадлежностью к Царству и фактическим исключением, а сноска разъясняет её представительное значение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Сыны Царства» намеренно сохраняет исходную идиому; остальной синтаксис прост и естественен. Написание «Царство» с прописной буквы указывает на Царство Божье, ясно подразумеваемое ближайшим контекстом.
