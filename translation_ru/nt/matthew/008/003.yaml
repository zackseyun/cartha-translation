  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο ⸀αὐτοῦ λέγων· Θέλω, καθαρίσθητι· καὶ εὐθέως ἐκαθαρίσθη αὐτοῦ ἡ λέπρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/003.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing[c][b]; be cleansed.” And immediately his leprosy was cleansed.
translation:
  language: ru
  text: 'И, протянув руку, Он прикоснулся к нему и сказал: «Хочу — очистись». И тотчас он очистился от проказы[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово λέπρα могло обозначать различные тяжёлые кожные заболевания, а не только болезнь Хансена, которую сегодня называют проказой.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «И тотчас его проказа была очищена».'
    reason: source_syntax
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: протянув руку
  rationale: Естественно передаёт предшествующее сопутствующее действие и сохраняет конкретный физический жест.
- source_word: ἥψατο αὐτοῦ
  choice: Он прикоснулся к нему
  rationale: ἅπτομαι с родительным падежом обычно означает «касаться»; это прямой и естественный смысл в данном контексте.
- source_word: Θέλω
  choice: Хочу
  rationale: Краткий ответ прямо соотносится с просьбой больного о желании Иисуса очистить его. Русское «хочу» сохраняет значение волеизъявления без добавления оттенка будущего времени.
- source_word: καθαρίσθητι
  choice: очистись
  rationale: Пассивный императив передан естественной русской формой, которая сохраняет как физический, так и ритуальный смысл очищения.
- source_word: εὐθέως
  choice: тотчас
  rationale: Передаёт мгновенность результата в современном, но достойном повествовательном регистре.
- source_word: ἐκαθαρίσθη αὐτοῦ ἡ λέπρα
  choice: он очистился от проказы
  rationale: Естественная русская формулировка сохраняет корень «очист-» и результат исцеления; буквальная структура греческого предложения отмечена в сноске.
- source_word: ἡ λέπρα
  choice: проказа
  rationale: Традиционный и узнаваемый эквивалент; сноска уточняет, что древний термин шире современного диагноза болезни Хансена.
theological_decisions:
- issue: Смысл очищения в καθαρίζω
  choice: В повелении и результате сохранить лексику очищения
  alternative: Передать словами «исцелись» и «исцелился»
  rationale: Греческий текст включает не только физическое исцеление, но и категорию чистоты; перевод «исцеление» сузил бы этот смысл.
- issue: Значение Θέλω в ответе Иисуса
  choice: «Хочу»
  alternative: «Я согласен» или «желаю»
  rationale: «Хочу» кратко и непосредственно отвечает на условие, высказанное больным, и не превращает волеизъявление в предсказание будущего.
- issue: Грамматический субъект заключительной фразы
  choice: Естественное русское «он очистился от проказы» с буквальной формой в сноске
  alternative: «Его проказа очистилась»
  rationale: В греческом подлежащим является «проказа», однако буквальная русская конструкция звучит неестественно и способна создать ложное впечатление, будто очистилась сама болезнь. Сноска сохраняет доступ к форме оригинала.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным повествовательным тоном. Местоимение «Он» написано с прописной буквы согласно принятому благоговейному библейскому регистру; речь остаётся простой и понятной.
