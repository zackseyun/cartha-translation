    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντι
  choice: когда он вошёл
  rationale: 'Аористное причастие в дательном падеже передаёт обстоятельство времени, предшествующее основному действию. В современном русском естественно преобразовать его в придаточное предложение: «когда он вошёл».'
- source_word: πλοῖον
  choice: лодку
  rationale: В повествовании о Галилейском море πλοῖον естественнее передать словом «лодка», а не «корабль». Русский язык не требует выражать различие между определённым и неопределённым артиклем.
- source_word: ἠκολούθησαν
  choice: последовали за ним
  rationale: Такой перевод передаёт непосредственное физическое следование и одновременно сохраняет возможный для Евангелия от Матфея оттенок ученичества.
- source_word: μαθηταὶ
  choice: ученики
  rationale: «Ученики» — естественное и устойчивое русское соответствие для обозначения тех, кто учился у Иисуса и следовал за ним.
- source_word: αὐτῷ ... αὐτῷ ... αὐτοῦ
  choice: он / за ним / его
  rationale: Все три местоимения относятся в контексте к Иисусу. Русский синтаксис требует передать первое местоимение как подлежащее придаточного предложения.
theological_decisions:
- issue: Возможный оттенок ученичества в ἀκολουθέω
  choice: последовали за ним
  alternative: пошли с ним
  rationale: Фраза описывает перемещение учеников, но глагол ἀκολουθέω у Матфея может также напоминать об их положении последователей Иисуса. Выбранный перевод сохраняет оба оттенка, не превращая их в явное богословское пояснение.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Местоимения, относящиеся к Иисусу, написаны со строчной буквы в соответствии с нейтральной современной нормой; инверсия «его ученики» звучит естественно и сохраняет связь учеников с Иисусом.
