  text: And when he got into the boat[b][a], his disciples followed him.
translation:
  language: ru
  text: Когда[b] он вошёл в лодку[a], его ученики последовали за ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте слово «лодка» употреблено без артикля; по контексту речь может идти как об уже известной лодке, так и просто о лодке.
    reason: lexical_alternative
