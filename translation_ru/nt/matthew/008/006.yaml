- source_word: Κύριε
  choice: Господи
  rationale: Традиционная и естественная русская форма прямого обращения к Иисусу сохраняет возможность как почтительного, так и более глубокого исповедального смысла.
- source_word: ὁ παῖς μου
  choice: мой слуга
  rationale: παῖς может обозначать слугу, мальчика или ребёнка. В контексте речи сотника и параллельного повествования наиболее вероятно значение «слуга», а неоднозначность отражена в сноске.
- source_word: βέβληται
  choice: лежит
  rationale: Перфект пассивного залога буквально указывает на состояние того, кто был повержен или уложен; русское «лежит» естественно передаёт результирующее состояние без неуместной буквальности.
- source_word: ἐν τῇ οἰκίᾳ
  choice: дома
  rationale: Нормальное современное русское соответствие локативному выражению в данном контексте.
- source_word: παραλυτικός
  choice: парализованный
  rationale: Передаёт состояние больного современным и понятным языком, не превращая определение в устаревающее существительное «расслабленный».
- source_word: δεινῶς βασανιζόμενος
  choice: ужасно мучится
  rationale: Сохраняет интенсивность δεινῶς и сильное значение βασανίζομαι, оставаясь естественным для описания тяжёлого физического страдания.
