lexical_decisions:
- source_word: Καταβάντος δὲ αὐτοῦ
  choice: Когда Он сошёл
  rationale: Родительный самостоятельный оборот с аористным причастием естественно передан временным придаточным. Частица δέ здесь служит мягкой связкой с предыдущим повествованием и не требует отдельного перевода.
- source_word: ἀπὸ τοῦ ὄρους
  choice: с горы
  rationale: Русское «с горы» точно и естественно передаёт движение вниз от места, где происходили предшествующие события.
- source_word: ἠκολούθησαν αὐτῷ
  choice: за Ним последовали
  rationale: Глагол ἀκολουθέω с дательным дополнением естественно передаётся русской конструкцией «последовать за кем-либо»; порядок слов сохраняет повествовательный акцент.
- source_word: ὄχλοι πολλοί
  choice: большие толпы народа
  rationale: Такой перевод естественно выражает множество людей и сохраняет образ толп; слово «народа» уточняет состав толп, не меняя смысла.
