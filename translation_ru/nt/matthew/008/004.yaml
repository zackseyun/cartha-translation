id: MAT.8.4
reference: Matthew 8:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ὅρα μηδενὶ εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ, καὶ προσένεγκον τὸ δῶρον ὃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/004.yaml
  text: And Jesus said to him[a], “See that you tell no one, but go, show yourself to the priest, and offer the gift that Moses commanded[b], as a testimony to them.”
translation:
  language: ru
  text: 'Иисус сказал ему: «Смотри, никому не говори, но пойди, покажись священнику и принеси дар, который повелел принести Моисей,[a] — им во свидетельство».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имеется в виду предписанный Моисеевым законом порядок для человека, очистившегося от проказы; см. Левит 14.
    reason: cross_reference
  - marker: b
    text: Выражение «им во свидетельство» может означать свидетельство, представленное священникам; некоторые также понимают его как свидетельство против тех, кто откажется поверить.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα μηδενὶ εἴπῃς
  choice: Смотри, никому не говори
  rationale: Ὅρα вводит настойчивое предостережение или повеление; оборот «Смотри, ... не говори» естественно передаёт эту силу в современном русском языке.
- source_word: ὕπαγε
  choice: пойди
  rationale: Простой императив движения; «пойди» естественно связывает повеление с последующими действиями.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: покажись священнику
  rationale: Лаконично передаёт возвратную конструкцию и сохраняет связь со священническим освидетельствованием очищенного человека.
- source_word: προσένεγκον τὸ δῶρον
  choice: принеси дар
  rationale: В культовом контексте προσφέρω означает принесение дара Богу; сочетание «принеси дар» сохраняет лексику оригинала и звучит естественно по-русски.
- source_word: ὃ προσέταξεν Μωϋσῆς
  choice: который повелел принести Моисей
  rationale: Добавление подразумеваемого «принести» устраняет в русском языке возможное впечатление, будто Моисей повелел сам дар, а не его принесение.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: им во свидетельство
  rationale: Формулировка сохраняет неуточнённый референт αὐτοῖς и открытый смысл μαρτύριον как свидетельства или подтверждения.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Иисус сказал ему
  rationale: Историческое настоящее естественно передано русским прошедшим временем в повествовательном контексте.
theological_decisions:
- issue: К кому относится αὐτοῖς и каков смысл εἰς μαρτύριον
  choice: Сохранить «им во свидетельство», не называя адресатов и не уточняя, благоприятное это свидетельство или свидетельство против них.
  alternative: «в доказательство священникам» или «во свидетельство против них»
  rationale: Греческий текст прямо не называет референта местоимения и не определяет направленность свидетельства; уточнение необоснованно снимало бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Во свидетельство» сохранено как естественный устойчивый оборот, позволяющий не устранять смысловую открытость оригинала.
