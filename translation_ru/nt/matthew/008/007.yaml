  text: ⸀καὶ λέγει ⸀αὐτῷ· Ἐγὼ ἐλθὼν θεραπεύσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/007.yaml
  text: And he says to him[a], “I will come and heal him.”
translation:
  language: ru
  text: 'И говорит ему[a]: «Я приду и исцелю его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мне прийти и исцелить его?» Некоторые толкователи на основании контекста понимают слова Иисуса как вопрос, однако сама греческая формулировка естественнее читается как утверждение.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет простой повествовательный переход, не добавляя явно не выраженного временного или причинно-следственного оттенка.
- source_word: λέγει
  choice: говорит
  rationale: Историческое настоящее передано настоящим временем, естественным для живого библейского повествования на русском языке.
- source_word: αὐτῷ
  choice: ему
  rationale: Дательный падеж при λέγει естественно передаётся русским «ему».
- source_word: Ἐγὼ
  choice: Я
  rationale: Отдельно выраженное греческое местоимение допускает некоторое смысловое выделение, которое в русском достаточно передаётся явным «Я».
- source_word: ἐλθὼν
  choice: приду и
  rationale: Аористное причастие обозначает действие, предшествующее или сопутствующее главному; русская конструкция с двумя однородными глаголами естественно передаёт последовательность действий.
- source_word: θεραπεύσω
  choice: исцелю
  rationale: В контексте чудесного исцеления «исцелю» точно, естественно и стилистически достойно передаёт θεραπεύω.
- source_word: αὐτόν
  choice: его
  rationale: Прямое дополнение мужского рода, относящееся к больному слуге, естественно передано местоимением «его».
theological_decisions:
- issue: Передавать ли слова Иисуса как утверждение или как вопрос
  choice: 'Утверждение: «Я приду и исцелю его»'
  alternative: 'Вопрос: «Мне прийти и исцелить его?» или «Разве Мне прийти и исцелить его?»'
  rationale: В греческом тексте нет вопросительной частицы, и сама формулировка естественнее читается как утверждение. Контекст позволяет некоторым толкователям понимать её как вопрос, поэтому этот вариант сохранён в примечании, но не внесён в основной текст.
translation_notes:
  register: Современный литературный русский язык с живым повествовательным настоящим. Формулировка краткая и достойная; «исцелю» сохраняет библейский регистр, оставаясь понятным современному читателю.
