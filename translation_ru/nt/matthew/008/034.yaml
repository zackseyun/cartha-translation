  text: καὶ ἰδοὺ πᾶσα ἡ πόλις ἐξῆλθεν εἰς ⸀ὑπάντησιν τῷ Ἰησοῦ, καὶ ἰδόντες αὐτὸν παρεκάλεσαν ὅπως μεταβῇ ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/034.yaml
  text: And behold[a], the whole city went out to meet Jesus, and when they saw him, they begged him to depart from their region.
translation:
  language: ru
  text: И вот, весь город вышел навстречу Иисусу и, увидев Его, умолял Его уйти из их края.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с их территории»; букв.: «от их границ».'
    reason: 'Лексическая альтернатива для ἀπὸ τῶν ὁρίων αὐτῶν: существительное может обозначать как границы, так и ограниченную ими территорию.'
lexical_decisions:
- source_word: ἰδοὺ
  choice: и вот
  rationale: Сохраняет функцию указателя внимания и повествовательную выразительность, оставаясь естественным для современного литературного русского языка.
- source_word: πᾶσα ἡ πόλις
  choice: весь город
  rationale: Передаёт собирательное обозначение жителей города без излишне буквального утверждения о каждом отдельном человеке.
- source_word: ἐξῆλθεν
  choice: вышел
  rationale: Прямо передаёт движение жителей из города; единственное число согласуется с собирательным выражением «весь город».
- source_word: εἰς ὑπάντησιν
  choice: навстречу
  rationale: Естественно и точно передаёт устойчивое греческое выражение о выходе для встречи с кем-либо.
- source_word: Ἰησοῦ
  choice: Иисусу
  rationale: Использована принятая русская форма личного имени в требуемом падеже.
- source_word: ἰδόντες αὐτὸν
  choice: увидев Его
  rationale: Деепричастный оборот кратко и естественно передаёт предшествующее обстоятельство аористного причастия.
- source_word: παρεκάλεσαν
  choice: стали умолять
  rationale: Передаёт настойчивость и силу просьбы в данном контексте лучше, чем нейтральное «просить».
- source_word: ὅπως μεταβῇ
  choice: Его уйти
  rationale: Инфинитивная конструкция после «умолять» естественно передаёт содержание просьбы, не добавляя причин или оценок.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: из их края
  rationale: Передаёт территориальное значение ὅρια естественным современным выражением; буквальный образ границ отмечен в сноске.
theological_decisions:
- issue: Причина просьбы жителей
  choice: 'Причина не названа: жители лишь умоляют Иисуса уйти.'
  alternative: Указать страх перед силой Иисуса, гнев из-за гибели свиней или общую тревогу.
  rationale: Греческий текст не объясняет мотив жителей, поэтому перевод сохраняет повествовательную и богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «И вот» сохраняет повествовательный акцент, а «стали умолять» — настойчивый характер просьбы. Мотив просьбы намеренно не уточняется.
