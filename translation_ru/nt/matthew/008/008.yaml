  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸂καὶ ἀποκριθεὶς⸃ ὁ ἑκατόνταρχος ἔφη· Κύριε, οὐκ εἰμὶ ἱκανὸς ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς· ἀλλὰ μόνον εἰπὲ λόγῳ, καὶ ἰαθήσεται ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/008.yaml
  text: And the centurion answered[a], “Lord, I am not worthy that you should come under my roof. But only speak a word[b], and my servant will be healed.”
translation:
  language: ru
  text: 'Сотник ответил: «Господи, я недостоин, чтобы Ты вошёл под мою крышу. Но только скажи слово[a] — и мой слуга[b] исцелится».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «скажи словом»; по смыслу также возможно: «скажи лишь слово».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мальчик», «ребёнок». Греческое слово может обозначать ребёнка, юношу или слугу — в зависимости от контекста.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἔφη
  choice: ответил
  rationale: Причастие ἀποκριθεὶς вместе с ἔφη образует обычную формулу введения ответной реплики. Одно русское «ответил» естественно передаёт её без избыточного «ответив, сказал».
- source_word: ἑκατόνταρχος
  choice: сотник
  rationale: Точный и закрепившийся в русской библейской речи термин для командира подразделения примерно в сто воинов; понятен современному читателю.
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма «Господи» сохраняет основное значение κύριος и возможную христологическую значимость обращения, не сводя его лишь к вежливому «господин».
- source_word: οὐκ εἰμὶ ἱκανὸς
  choice: я недостоин
  rationale: В данном обороте ἱκανός обозначает не просто способность, а достоинство или соответствие; «недостоин» естественно выражает смирение сотника.
- source_word: ὑπὸ τὴν στέγην
  choice: под мою крышу
  rationale: Сохранён образ греческого выражения, но употреблена современная и понятная русская формулировка, менее архаичная, чем «под мой кров».
- source_word: μόνον εἰπὲ λόγῳ
  choice: только скажи слово
  rationale: Фраза близко передаёт ограничительное μόνον и необычное сочетание εἰπὲ λόγῳ, оставаясь естественной по-русски. Буквенная особенность дательного падежа отмечена в сноске.
- source_word: ἰαθήσεται
  choice: исцелится
  rationale: Будущая пассивная форма ἰάομαι означает, что слуга получит исцеление; русское «исцелится» ясно и традиционно для рассказа о чуде.
- source_word: παῖς
  choice: слуга
  rationale: В контексте дома сотника и с учётом параллельного рассказа значение «слуга» наиболее вероятно, однако лексическая возможность значений «мальчик» или «ребёнок» сохранена в сноске.
theological_decisions:
- issue: Передача κύριος при обращении к Иисусу
  choice: Господи
  alternative: господин
  rationale: «Господи» сохраняет как уважительное обращение, так и возможный более глубокий смысл титула, не заставляя читателя заранее выбрать только светское понимание.
- issue: Значение παῖς
  choice: слуга
  alternative: мальчик; ребёнок
  rationale: Непосредственный и параллельный контекст поддерживает значение «слуга», но многозначность греческого слова подлинна и поэтому явно указана в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным евангельским звучанием. Образ «под мою крышу» сохранён без архаичного «под мой кров». Местоимение «Ты» написано с прописной буквы как уважительное обращение к Иисусу; это орфографическая особенность русского религиозного регистра, а не дополнительное толкование греческого текста.
