source:
  edition: SBLGNT
  text: καὶ ἰδοὺ λεπρὸς ⸀προσελθὼν προσεκύνει αὐτῷ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/002.yaml
  text: And behold[a], a leper came and bowed down before him, saying, “Lord, if you are willing, you are able to cleanse me.”
translation:
  language: ru
  text: 'И вот, человек, больной проказой, подошёл и поклонился Ему[a], говоря: «Господи, если Ты хочешь, Ты можешь меня очистить».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклонился Ему» в смысле «воздал Ему поклонение»; греческий глагол в зависимости от контекста может обозначать земной поклон, выражение почтения или поклонение.'
    reason: Лексическая альтернатива сохраняет смысловой диапазон προσκυνέω, не добавляя истолкование «как Богу».
lexical_decisions:
- source_word: ἰδοὺ
  choice: и вот
  rationale: Сохраняет функцию частицы, привлекающей внимание, и придаёт повествованию живость, оставаясь естественным для современного русского библейского повествования.
- source_word: λεπρὸς
  choice: человек, больной проказой
  rationale: Субстантивированное прилагательное обозначает человека с кожным заболеванием, традиционно называемым проказой. Такой перевод точен, понятен и не сводит личность человека к его болезни.
- source_word: προσελθὼν
  choice: подошёл
  rationale: Передаёт направленное приближение к Иисусу точнее, чем нейтральное «пришёл».
- source_word: προσεκύνει
  choice: поклонился Ему
  rationale: Глагол может обозначать земной поклон, выражение почтения или поклонение. Основной текст передаёт наблюдаемое почтительное действие, не устраняя более глубокую богословскую возможность; она отмечена в сноске.
- source_word: Κύριε
  choice: Господи
  rationale: Традиционная и естественная русская звательная форма обращения к Иисусу сохраняет как уважительное, так и возможное христологическое значение κύριος.
- source_word: ἐὰν θέλῃς
  choice: если Ты хочешь
  rationale: Естественно для современного русского языка и точно сохраняет условие, относящееся к воле Иисуса, а не к Его способности.
- source_word: δύνασαί
  choice: Ты можешь
  rationale: Ясно передаёт способность и власть совершить очищение; в данном контексте форма естественнее более тяжеловесного «Ты в силах».
- source_word: καθαρίσαι
  choice: очистить меня
  rationale: Сохраняет физические и ритуальные оттенки очищения при проказе, которые были бы утрачены при переводе «исцелить».
theological_decisions:
- issue: Значение προσκυνέω по отношению к Иисусу
  choice: поклонился Ему
  alternative: поклонился Ему как Богу / стал перед Ним на колени / пал ниц перед Ним
  rationale: Контекст несомненно описывает почтительное действие, однако сам глагол допускает диапазон от земного поклона и выражения почтения до поклонения. Перевод не должен преждевременно устранять эту богословскую неоднозначность.
- issue: Смысл обращения Κύριε
  choice: Господи
  alternative: Господин / Учитель
  rationale: «Господи» сохраняет уважительное обращение и возможный христологический вес слова, не сводя его к светскому «господин».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Заглавные местоимения при обращении к Иисусу соответствуют принятой русской религиозной письменной норме. Формулировка избегает архаизмов и излишней медицинской конкретизации древнего термина.
