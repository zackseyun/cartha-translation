  variant: modern literary Russian
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πολλοὶ ἀπὸ ἀνατολῶν καὶ δυσμῶν ἥξουσιν καὶ ἀνακλιθήσονται μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/011.yaml
  text: But I tell you that many will come from east and west and will recline at table with Abraham and Isaac and Jacob in the kingdom of heaven[a][b].
translation:
  language: ru
  text: 'Но говорю вам: многие придут с востока и запада и возлягут за столом вместе с Авраамом, Исааком и Иаковом в Царстве Небесном[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол «возлягут» отражает древний обычай располагаться полулёжа за праздничным столом.
    reason: cultural_note
  - marker: b
    text: Выражение «с востока и запада», вероятно, указывает на людей из далёких земель, в том числе из-за пределов Израиля.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Но говорю вам
  rationale: δέ обозначает мягкое противопоставление или переход по отношению к предыдущему высказыванию; «Но говорю вам» естественно передаёт этот поворот речи.
- source_word: πολλοὶ
  choice: многие
  rationale: Прилагательное употреблено субстантивированно; русское «многие» не требует добавления существительного и не уточняет состав группы сверх текста.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: с востока и запада
  rationale: Формы множественного числа идиоматически обозначают стороны света и соответствующие области; русский оборот сохраняет широкий географический смысл.
- source_word: ἥξουσιν
  choice: придут
  rationale: Будущая форма передаёт прибытие людей; «придут» естественно и точно в данном контексте.
- source_word: ἀνακλιθήσονται
  choice: возлягут за столом
  rationale: Глагол обозначает положение полулёжа, принятое во время трапезы. Формулировка сохраняет образ пира и одновременно проясняет, что речь идёт о совместной еде.
- source_word: μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: вместе с Авраамом, Исааком и Иаковом
  rationale: μετά с родительным падежом выражает совместность; добавление «вместе» естественно подчёркивает общение за одним столом, не расширяя смысла.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: в Небесном Царстве
  rationale: Это естественная русская передача характерного для Матфея выражения «Царство Небесное»; множественное число греческого οὐρανῶν является частью устойчивой формулы и не требует буквального «небес».
theological_decisions:
- issue: Образ пира и эсхатологическое общение
  choice: Сохранить образ трапезы в выражении «возлягут за столом».
  alternative: «сядут вместе» или «будут вместе»
  rationale: Текст говорит не просто о присутствии в Царстве, а изображает совместную праздничную трапезу. Передача этого образа сохраняет богословскую выразительность, не добавляя подробностей.
- issue: Кого обозначают «многие» с востока и запада
  choice: Оставить географическое выражение и не называть этих людей язычниками в основном тексте.
  alternative: «многие язычники придут с востока и запада»
  rationale: Контекст допускает и, вероятно, подразумевает включение людей из народов вне Израиля, однако в самом греческом тексте сказано только «многие». Перевод сохраняет эту импликацию, не превращая её в прямое утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Возлягут» — намеренно сохранённый культурно значимый глагол; пояснение вынесено в сноску. Имена переданы в традиционной русской форме, а «Небесное Царство» сохраняет узнаваемую формулу Матфея.
