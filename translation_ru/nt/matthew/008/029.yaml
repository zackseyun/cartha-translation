  text: καὶ ἰδοὺ ἔκραξαν λέγοντες· Τί ἡμῖν καὶ ⸀σοί, υἱὲ τοῦ θεοῦ; ἦλθες ὧδε πρὸ καιροῦ βασανίσαι ἡμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/029.yaml
  text: And behold[a], they cried out, saying, “What have we to do with you[b], Son of God? Have you come here before the appointed time to torment us?”
translation:
  language: ru
  text: 'И вот они закричали: «Что тебе до нас?[a] Сын Божий, Ты пришёл сюда мучить нас раньше назначенного времени?[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Что нам и тебе?» Возможен перевод: «Что общего у нас с тобой?»'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «раньше времени». Греческое слово может обозначать установленный срок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: И вот
  rationale: Сохраняет повествовательный переход и привлекающую внимание выразительность ἰδού, оставаясь естественным для современного русского языка.
- source_word: ἔκραξαν λέγοντες
  choice: они закричали
  rationale: Глагол κράζω передаёт громкий крик; отдельное «говоря» в русском здесь избыточно и утяжеляло бы фразу.
- source_word: Τί ἡμῖν καὶ σοί
  choice: Что тебе до нас
  rationale: Естественно передаёт семитизированную греческую идиому отчуждения и противостояния, не сводя её смысл только к вопросу о желании или намерении.
- source_word: υἱὲ τοῦ θεοῦ
  choice: Сын Божий
  rationale: Прямо передаёт обращение-титул; прописная буква соответствует его употреблению по отношению к Иисусу.
- source_word: ἦλθες ὧδε
  choice: Ты пришёл сюда
  rationale: Передаёт аорист ἦλθες и локальное значение ὧδε без добавления отсутствующих в тексте оттенков.
- source_word: πρὸ καιροῦ
  choice: раньше назначенного времени
  rationale: καιρός может обозначать установленный, надлежащий срок; «назначенного» передаёт подразумеваемый срок суда, не уточняя, кем и как он установлен.
- source_word: βασανίσαι ἡμᾶς
  choice: мучить нас
  rationale: «Мучить» естественно и достаточно сильно передаёт βασανίζω в контексте ожидаемого суда, не ограничивая значение физической пыткой.
theological_decisions:
- issue: Признание бесами личности Иисуса
  choice: Сын Божий
  alternative: сын Бога
  rationale: Текст содержит прямое обращение с христологическим титулом; перевод сохраняет его силу, ничего не добавляя к формулировке стиха.
- issue: Эсхатологический оттенок καιρός
  choice: раньше назначенного времени
  alternative: раньше времени
  rationale: Фраза подразумевает определённый срок будущего мучения или суда. «Назначенного» сохраняет этот оттенок, но не вводит разработанную эсхатологическую схему.
- issue: Смысл идиомы Τί ἡμῖν καὶ σοί
  choice: Что тебе до нас
  alternative: Что общего у нас с тобой
  rationale: Выбранная формулировка передаёт отталкивание и вызов, сохраняя некоторую открытость идиомы; примечание сообщает более буквальную альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «И вот» сохраняет живость повествования; опущено буквальное «говоря» как неестественное для русского. Все примечания отмечены в основном тексте.
