  text: καὶ ἥψατο τῆς χειρὸς αὐτῆς, καὶ ἀφῆκεν αὐτὴν ὁ πυρετός, καὶ ἠγέρθη καὶ διηκόνει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/015.yaml
  text: And he touched her hand, and the fever left her, and she got up and began serving him.
translation:
  language: ru
  text: Он коснулся её руки, и лихорадка оставила её. Она встала и стала служить ему.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «служила ему». Греческая форма может просто описывать продолжавшееся действие, хотя может также указывать на его начало.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥψατο
  choice: коснулся
  rationale: Средняя форма ἅπτω с родительным падежом означает прикосновение; «коснулся» естественно передаёт действие, не усиливая его до «взял за руку».
- source_word: τῆς χειρὸς αὐτῆς
  choice: её руки
  rationale: χείρ здесь означает «рука»; греческая конструкция с родительным падежом естественно сохраняется по-русски после глагола «коснуться».
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: горячка оставила её
  rationale: Сохранена олицетворённая греческая конструкция, в которой πυρετός является подлежащим, а ἀφίημι означает «оставлять, покидать».
- source_word: πυρετός
  choice: горячка
  rationale: Слово прямо обозначает лихорадочное состояние; «горячка» — понятное и уместное в библейском повествовании русское соответствие.
- source_word: ἠγέρθη
  choice: она встала
  rationale: 'Хотя форма морфологически пассивна, в данном контексте ἐγείρω употреблено в непереходном смысле: женщина поднялась после исцеления.'
- source_word: διηκόνει αὐτῷ
  choice: стала служить Ему
  rationale: διακονέω означает «служить, прислуживать»; имперфект допускает понимание начала и последующего продолжения действия. «Стала служить» естественно передаёт эту аспектуальную возможность.
theological_decisions:
- issue: Возможное богословское переосмысление ἠγέρθη как указания на воскресение
  choice: она встала
  alternative: она была поднята
  rationale: Непосредственный контекст описывает обычное вставание после исцеления; перевод не должен привносить сюда тему воскресения.
- issue: Аспектуальная сила имперфекта διηκόνει
  choice: стала служить Ему
  alternative: служила Ему
  rationale: Имперфект может описывать продолжающееся действие или его начало. Основной текст естественно передаёт возможный начинательный оттенок, а примечание сохраняет более нейтральное прочтение.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным строем. «Горячка» сохраняет краткость и образность исходного текста; местоимение «Ему» написано с прописной буквы согласно распространённой русской библейской издательской традиции.
