  text: ἦν δὲ μακρὰν ἀπ’ αὐτῶν ἀγέλη χοίρων πολλῶν βοσκομένη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/030.yaml
  text: A large herd of pigs was feeding some distance away from them[a].
translation:
  language: ru
  text: Вдали от них паслось большое стадо свиней.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «далеко от них».'
    reason: Слово μακράν допускает более сильное указание на удалённость, чем нейтральное «вдали».
lexical_decisions:
- source_word: ἦν δὲ
  choice: паслось
  rationale: Экзистенциальная конструкция с причастием естественно передаётся одним русским глаголом в прошедшем времени. Слабый повествовательный союз δέ отдельно не выражен, поскольку в данном стихе по-русски связность ясна без добавочного маркера.
- source_word: μακρὰν ἀπ’ αὐτῶν
  choice: вдали от них
  rationale: Передаёт пространственную удалённость естественным современным русским выражением; степень удалённости может пониматься как значительная, что отражено в сноске.
- source_word: ἀγέλη χοίρων πολλῶν
  choice: большое стадо свиней
  rationale: Согласование πολλῶν с χοίρων буквально выражает множество свиней, но по-русски при собирательном существительном естественно сказать «большое стадо свиней».
- source_word: βοσκομένη
  choice: паслось
  rationale: Причастие описывает стадо во время кормления. «Паслось» — краткое и естественное обозначение самостоятельного кормления животных, без внесения неявного пастуха.
