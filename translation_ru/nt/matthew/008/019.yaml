  text: καὶ προσελθὼν εἷς γραμματεὺς εἶπεν αὐτῷ· Διδάσκαλε, ἀκολουθήσω σοι ὅπου ἐὰν ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/019.yaml
  text: And one scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
translation:
  language: ru
  text: 'И один книжник, подойдя к Нему, сказал: «Учитель, я последую за Тобой, куда бы Ты ни пошёл[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «куда бы Ты ни удалился» / «куда бы Ты ни ушёл». Греческий глагол может более определённо означать уход или удаление, хотя здесь естественно понимать его просто как «идти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: подойдя
  rationale: Аористное причастие передаёт приближение книжника к Иисусу перед его словами; «подойдя» естественно и точно выражает эту последовательность.
- source_word: εἷς
  choice: один
  rationale: Числительное вводит отдельного участника повествования; сохранение слова «один» отражает греческую формулировку без добавления подразумеваемой принадлежности к группе.
- source_word: γραμματεὺς
  choice: книжник
  rationale: «Книжник» — устоявшееся и достаточно понятное обозначение знатока и толкователя Писания в евангельском контексте; более развёрнутые варианты были бы толкованием.
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Прямой перевод обращения διδάσκαλε сохраняет уважительный титул и не усиливает его до значения «Господин» или «Наставник».
- source_word: ἀκολουθήσω
  choice: я последую
  rationale: Будущее время выражает заявленное намерение; глагол сохраняет как буквальный смысл следования, так и возможный смысл ученичества.
- source_word: ὅπου ἐὰν
  choice: куда бы … ни
  rationale: Русская уступительно-неопределённая конструкция естественно передаёт неограниченное значение греческого сочетания «где бы ни / куда бы ни».
- source_word: ἀπέρχῃ
  choice: пошёл
  rationale: В данном контексте глагол обозначает движение к любому месту, куда направится Иисус. «Пошёл» звучит естественно; более буквальные оттенки удаления отмечены в сноске.
theological_decisions:
- issue: Передача διδάσκαλος как обращения к Иисусу
  choice: Учитель
  alternative: Наставник; Равви
  rationale: «Учитель» непосредственно передаёт лексическое значение титула, сохраняя уважительное обращение без внесения дополнительного христологического или конфессионального содержания.
translation_notes:
  register: Современный литературный русский язык с традиционным библейским термином «книжник». Местоимения, относящиеся к Иисусу в прямом обращении и повествовании, написаны с прописной буквы в соответствии с распространённой русской библейской издательской практикой.
