  text: ἕτερος δὲ τῶν ⸀μαθητῶν εἶπεν αὐτῷ· Κύριε, ἐπίτρεψόν μοι πρῶτον ἀπελθεῖν καὶ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/021.yaml
  text: Then another of the disciples said to him[a], “Lord[b], permit me first to go away and bury my father.”
translation:
  language: ru
  text: 'А другой из учеников сказал Ему: «Господи, позволь мне прежде пойти и похоронить моего отца[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эти слова могут означать просьбу как о немедленном погребении, так и, шире, об исполнении сыновнего долга до смерти отца; греческий текст этого не уточняет.
    reason: cultural_note
lexical_decisions:
- source_word: ἕτερος δὲ τῶν μαθητῶν
  choice: А другой из учеников
  rationale: Оборот обозначает ещё одного человека, принадлежащего к числу учеников; союз δέ передан мягким связующим «а», естественным для русского повествования и не создающим резкого противопоставления.
- source_word: Κύριε
  choice: Господи
  rationale: Традиционная и естественная русская форма прямого обращения к Иисусу, сохраняющая уважительный и возможный богословский смысл титула κύριος.
- source_word: ἐπίτρεψόν μοι
  choice: позволь мне
  rationale: Глагол выражает просьбу о разрешении; «позволь мне» звучит современно, уважительно и естественнее, чем более официальное «разреши мне».
- source_word: πρῶτον
  choice: прежде
  rationale: 'Передаёт приоритет действия: ученик просит сначала исполнить названное дело. В данном порядке слов «прежде» звучит литературно и ясно.'
- source_word: ἀπελθεῖν
  choice: пойти
  rationale: В контексте просьбы русский глагол «пойти» естественно подразумевает уход от Иисуса; отдельное «уйти и похоронить» могло бы излишне акцентировать удаление.
- source_word: θάψαι τὸν πατέρα μου
  choice: похоронить моего отца
  rationale: Прямо передаёт действие и объект, не уточняя, умер ли отец только что или речь идёт о более длительном исполнении сыновнего долга.
theological_decisions:
- issue: Смысл просьбы похоронить отца
  choice: Сохранить прямую просьбу позволить ученику пойти и похоронить отца, не уточняя время смерти.
  alternative: Понять слова либо как просьбу об отлучке ради немедленного погребения, либо как просьбу остаться дома до будущей смерти отца.
  rationale: Греческий текст не определяет, уже ли умер отец и насколько продолжительной предполагалась отсрочка; перевод не должен устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. «Господи» сохраняет принятую форму обращения, а «позволь мне» избегает ненужной канцелярской окраски. Местоимение «Ему» написано с прописной буквы в соответствии с распространённой русской библейской издательской нормой.
