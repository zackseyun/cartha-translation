lexical_decisions:
- source_word: οἱ δὲ δαίμονες
  choice: А бесы
  rationale: Частица δέ продолжает повествование с лёгким оттенком противопоставления; «а» естественно передаёт эту связь. «Бесы» — ясное и укоренившееся в русском библейском языке обозначение личных злых духов.
- source_word: παρεκάλουν
  choice: всё просили
  rationale: Имперфект указывает на продолжавшуюся или повторявшуюся просьбу; «всё просили» передаёт длительность естественно и без чрезмерного усиления.
- source_word: λέγοντες
  choice: двоеточие перед прямой речью
  rationale: В русском языке содержание причастия «говоря» естественно передаётся введением прямой речи без отдельного глагола, что устраняет тяжеловесность и сохраняет смысл.
- source_word: Εἰ ἐκβάλλεις ἡμᾶς
  choice: Если Ты изгоняешь нас
  rationale: Сохраняется условная форма Εἰ и настоящее время греческого глагола; «изгонять» точно и привычно для контекста изгнания бесов.
- source_word: ἀπόστειλον ἡμᾶς
  choice: пошли нас
  rationale: Кратко и прямо передаёт аористный императив с просьбой о немедленном действии.
- source_word: εἰς τὴν ἀγέλην τῶν χοίρων
  choice: в стадо свиней
  rationale: Естественное современное русское выражение, точно передающее направление движения и группу животных.
theological_decisions:
- issue: Обозначение злых духов
  choice: бесы
  alternative: демоны; злые духи
  rationale: «Бесы» сохраняет личностный и сверхъестественный характер действующих существ, не добавляя doctrинального пояснения; в современном русском библейском контексте слово понятно и не архаично.
- issue: Условная формулировка просьбы
  choice: Если Ты изгоняешь нас
  alternative: Раз Ты изгоняешь нас
  rationale: Буквальное условие сохраняет неоднозначность частицы Εἰ и не превращает высказывание в явно установленную причину.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Прописная буква в местоимениях «Его» и «Ты» следует принятой русской традиции уважительного обозначения Иисуса; синтаксис остаётся простым и доступным.
