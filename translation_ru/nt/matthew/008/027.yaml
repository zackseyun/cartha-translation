  text: And the men marveled[a], saying, “What sort of man is this, that even the winds and the sea obey him?”
translation:
  language: ru
  text: 'Люди же изумились и сказали: «Что это за человек[a], что даже ветры и море повинуются Ему?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Каков этот человек?» Греческое выражение спрашивает, что это за человек, какого он рода или какими качествами обладает.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄνθρωποι
  choice: Люди же
  rationale: Передаёт существительное ἄνθρωποι без добавления отсутствующего в стихе обозначения «ученики»; частица δέ отражена естественным для повествования «же».
- source_word: ἐθαύμασαν λέγοντες
  choice: изумились и говорили
  rationale: «Изумились» передаёт сильное удивление, а сочинительная конструкция естественно выражает в русском языке связь аориста с причастием λέγοντες.
- source_word: Ποταπός ἐστιν οὗτος
  choice: Что это за человек
  rationale: Естественный современный русский вопрос о том, к какому роду или качеству относится человек; он сохраняет удивление и не превращает вопрос в прямое утверждение о личности Иисуса.
- source_word: ὅτι
  choice: что
  rationale: Вводит основание удивлённого вопроса и сохраняет близкую к греческой смысловую связь без излишнего истолкования.
- source_word: καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα
  choice: даже ветры и море
  rationale: «Даже» естественно передаёт усилительную функцию καί, подчёркивая необычайный масштаб власти над природными силами.
- source_word: αὐτῷ ὑπακούουσιν
  choice: повинуются Ему
  rationale: Глагол «повиноваться» точно выражает послушание личной власти и сохраняет возвышенный, но понятный повествовательный регистр.
theological_decisions:
- issue: Христологическая сила вопроса
  choice: Сохранить вопрос открытым, одновременно ясно показав, что ветры и море повинуются Иисусу.
  alternative: Явно назвать Его власть божественной или свести реакцию людей лишь к удивлению чудом.
  rationale: Греческий текст подразумевает исключительную власть Иисуса над творением, но в самом стихе не формулирует догматический вывод; перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка остаётся понятной обычному читателю; местоимение «Ему» написано с прописной буквы согласно устойчивой русской библейской издательской традиции, не добавляя нового содержания.
