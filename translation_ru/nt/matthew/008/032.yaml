id: MAT.8.32
reference: Matthew 8:32
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑπάγετε. οἱ δὲ ἐξελθόντες ἀπῆλθον εἰς ⸂τοὺς χοίρους⸃· καὶ ἰδοὺ ὥρμησεν πᾶσα ἡ ⸀ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, καὶ ἀπέθανον ἐν τοῖς ὕδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/032.yaml
  text: And he said to them[a], “Go.” Then they came out and went into the pigs; and behold[c][b], the whole herd rushed down the steep bank into the sea and died in the waters.
translation:
  language: ru
  text: 'Он сказал им: «Идите». Они вышли и вошли в свиней. И вот, всё стадо бросилось с крутого склона в море и погибло в воде.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «утонуло». Буквально: «умерло в водах».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Идите
  rationale: Краткое повеление естественно звучит по-русски и сохраняет лаконичность греческого текста.
- source_word: ἐξελθόντες
  choice: вышли
  rationale: Причастие обозначает выход бесов из людей; в русском повествовании естественно передать его личной формой глагола.
- source_word: ἀπῆλθον εἰς τοὺς χοίρους
  choice: вошли в свиней
  rationale: По контексту речь идёт о переселении бесов в животных; «вошли» точно и естественно передаёт направленное движение внутрь.
- source_word: ἰδοὺ
  choice: и вот
  rationale: Сохраняет указательно-эмфатическую функцию маркера и оживляет повествование без архаизации.
- source_word: πᾶσα ἡ ἀγέλη
  choice: всё стадо
  rationale: Передаёт значение целокупности стада естественным современным русским выражением.
- source_word: ὥρμησεν
  choice: бросилось
  rationale: Передаёт внезапное и стремительное движение всего стада как единого целого.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: с крутого склона
  rationale: κρημνός может обозначать крутой склон, обрыв или крутой берег; основной текст не утверждает непременно отвесную скалу.
- source_word: τὴν θάλασσαν
  choice: море
  rationale: Прямо сохраняет греческое обозначение водоёма и традиционное русское название Галилейского моря.
- source_word: ἀπέθανον ἐν τοῖς ὕδασιν
  choice: погибло в воде
  rationale: Сохраняет прямо выраженное значение смерти, не конкретизируя её как утопление, хотя это подразумевается контекстом.
theological_decisions:
- issue: Степень конкретизации причины гибели стада
  choice: погибло в воде
  alternative: утонуло
  rationale: Греческий текст буквально сообщает, что стадо умерло в водах. Контекст указывает на утопление, но основной перевод не добавляет эту причинную конкретизацию.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified повествовательным стилем. Синтаксис несколько разгружен разделением греческой цепочки союзов на короткие предложения; «и вот» сохранено ради повествовательной выразительности.
