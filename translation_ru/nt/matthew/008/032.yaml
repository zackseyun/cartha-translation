  source_fidelity: 'Перевод точно передаёт последовательность и основные смысловые элементы греческого текста: краткое повеление, выход и вхождение в свиней, эмфатическое «и вот», гибель всего стада при стремительном движении с крутого склона в море. «Погибло в воде» не навязывает более конкретное «утонуло»; единственное число «в воде» естественно по-русски при греческом множественном τοῖς ὕδασιν.'
