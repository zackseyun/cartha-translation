  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Τί δειλοί ἐστε, ὀλιγόπιστοι; τότε ἐγερθεὶς ἐπετίμησεν τοῖς ἀνέμοις καὶ τῇ θαλάσσῃ, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/026.yaml
  text: And he said to them, “Why are you fearful, you of little faith?” Then, having risen, he rebuked the winds and the sea, and there was a great calm.
translation:
  language: ru
  text: 'Он сказал им: «Что вы так боязливы, маловеры?» Затем Он встал, запретил ветрам и морю — и наступил великий покой.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δειλοί
  choice: боязливы
  rationale: Передаёт не просто переживание страха, а проявленную робость; естественно звучит в вопросе и сохраняет укор.
- source_word: ὀλιγόπιστοι
  choice: маловеры
  rationale: Краткое обращение, соответствующее греческому прилагательному в звательной функции и сохраняющее связь недостатка веры со страхом.
- source_word: ἐγερθεὶς
  choice: встал
  rationale: Естественный русский эквивалент аористного причастия в данном повествовательном контексте.
- source_word: ἐπετίμησεν
  choice: запретил
  rationale: Традиционное и точное в данном контексте обозначение властного повеления ветрам и морю прекратиться.
- source_word: γαλήνη μεγάλη
  choice: великая тишина
  rationale: Сохраняет усиление μεγάλη и передаёт полное успокоение моря, не сводя выражение лишь к ослаблению бури.
theological_decisions:
- issue: Характер обращения ὀλιγόπιστοι
  choice: маловеры
  alternative: маловерные
  rationale: Сохранено прямое укоризненное обращение без добавочного истолкования степени или природы веры.
- issue: Одушевлённость ветров и моря при глаголе ἐπιτιμάω
  choice: запретил ветрам и морю
  alternative: приказал ветрам и морю утихнуть
  rationale: Сохраняется необычная и богословски значимая формулировка исходного текста без поясняющего дополнения «утихнуть».
translation_notes:
  register: Современный литературный русский язык с достоинством и повествовательной ясностью. Местоимение «Он» в авторской речи написано с прописной буквы согласно распространённой русской библейской издательской норме; синтаксис остаётся компактным и близким к греческой последовательности.
