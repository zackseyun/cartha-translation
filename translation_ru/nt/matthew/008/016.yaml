    text: 'Или: «многих, находившихся под воздействием бесов». Греческое причастие обозначает людей, испытывавших бесовское воздействие; «одержимых бесами» — традиционный краткий перевод.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Когда же настал вечер
  rationale: Независимый родительный оборот выражает время; такой перевод естественен по-русски и сохраняет союз δέ.
- source_word: προσήνεγκαν αὐτῷ
  choice: к нему привели
  rationale: В данном контексте προσφέρω означает доставить или привести людей к Иисусу; «привели» естественнее русского «принесли», поскольку речь идёт о группе людей.
- source_word: δαιμονιζομένους πολλούς
  choice: многих одержимых бесами
  rationale: Это краткий и общепонятный традиционный перевод причастия, обозначающего людей, находящихся под воздействием бесов; сноска сохраняет более широкую лексическую возможность.
- source_word: ἐξέβαλεν τὰ πνεύματα
  choice: изгнал духов
  rationale: ἐκβάλλω в контексте изгнания бесов означает «изгонять», а «духов» прямо передаёт объект τὰ πνεύματα, не добавляя отсутствующего в греческом определения «злых».
- source_word: λόγῳ
  choice: словом
  rationale: Творительный падеж естественно передаёт инструментальный дательный и подчёркивает власть произнесённого слова, не добавляя местоимения «своим».
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: всех больных
  rationale: Устойчивое греческое выражение означает тех, кто болен или нездоров; сжатое русское выражение ясно в контексте исцеления.
- source_word: ἐθεράπευσεν
  choice: исцелил
  rationale: Обычный евангельский эквивалент θεραπεύω, сохраняющий как телесный, так и повествовательный смысл исцеления.
theological_decisions:
- issue: Характер состояния, обозначенного δαιμονιζομένους, и духов в τὰ πνεύματα
  choice: 'Сохранить категорию бесовского воздействия: «одержимых бесами» и «духов»'
  alternative: «мучимых бесами» или психологизирующее толкование как душевной болезни
  rationale: Текст различает изгнание духов и исцеление больных, поэтому его собственные категории не следует сводить к психологическому диагнозу. При этом сноска отмечает, что греческое причастие не уточняет точную степень бесовского воздействия.
- issue: Значение λόγῳ
  choice: 'Передать инструментально: «словом»'
  alternative: «своим словом» или «одним словом»
  rationale: Так сохраняется акцент на власти повеления Иисуса без добавления притяжательного местоимения или усилительного «одним», которых нет в исходном тексте.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным евангельским звучанием. Структура греческого предложения и последовательность действий сохранены; местоимение «нему» не капитализировано, поскольку в исходном тексте почтительное графическое выделение отсутствует. Маркер сноски поставлен при выражении «одержимых бесами», к которому относится примечание.
