base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/016.yaml
  text: When evening came[a], they brought to him many who were demon-possessed; and he cast out the spirits with a word, and healed all who were sick.
translation:
  language: ru
  text: Когда же настал вечер, к нему привели многих одержимых бесами[a]; он словом изгнал духов и исцелил всех больных.
  philosophy: optimal-equivalence
  footnotes:
