  - severity: low
    issue: «Переправиться» конкретизирует ἀπελθεῖν.
    rationale: Хотя переправа подразумевается более широким контекстом, в самом стихе стоит общий глагол «уйти/отправиться». «Отправиться» передаёт его нейтральнее.
