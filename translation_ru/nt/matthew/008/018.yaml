  text: Ἰδὼν δὲ ὁ Ἰησοῦς ⸂πολλοὺς ὄχλους⸃ περὶ αὐτὸν ἐκέλευσεν ἀπελθεῖν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/018.yaml
  text: When Jesus saw many crowds around him, he gave orders to go to the other side.
translation:
  language: ru
  text: Увидев вокруг Себя многочисленные толпы, Иисус велел отправиться на другой берег.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὺς ὄχλους
  choice: множество народа
  rationale: Греческое выражение буквально имеет множественное число «многие толпы», но по-русски естественнее передать большое скопление людей собирательным выражением.
- source_word: ἐκέλευσεν
  choice: велел
  rationale: Передаёт властное распоряжение кратко и естественно, без избыточно буквального «отдал приказ».
- source_word: ἀπελθεῖν εἰς τὸ πέραν
  choice: переправиться на другой берег
  rationale: В контексте Галилейского моря τὸ πέραν означает противоположный берег; «переправиться» естественно выражает перемещение по воде.
theological_decisions:
- issue: Неуказанный исполнитель повеления при инфинитиве ἀπελθεῖν
  choice: 'сохранить невыраженный субъект: «велел переправиться»'
  alternative: «велел ученикам переправиться» или «велел им переправиться»
  rationale: В данном стихе адресаты прямо не названы; добавление «ученикам» устранило бы синтаксическую неопределённость оригинала.
translation_notes:
  register: Современный литературный русский язык; сдержанный повествовательный стиль. Заглавная буква в «Себя» соответствует принятому благоговейному русскому употреблению и не меняет содержания.
