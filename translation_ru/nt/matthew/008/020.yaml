source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/020.yaml
  text: And Jesus says to him[a], “Foxes have dens, and the birds of the sky have nests[d][c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: ru
  text: 'Иисус говорит ему: «У лис есть норы, и у птиц небесных — гнёзда, а Сыну Человеческому негде приклонить голову».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время сохраняет греческое историческое настоящее и естественно звучит в русском повествовании.
- source_word: ἀλώπεκες
  choice: лисы
  rationale: Прямой и общеупотребительный русский эквивалент.
- source_word: φωλεούς
  choice: норы
  rationale: В данном контексте естественно обозначает жилища лис; буквальное значение образа сохраняется.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: небесные птицы
  rationale: Естественная русская библейская формулировка, сохраняющая связь с οὐρανός без тяжеловесной конструкции «птицы неба».
- source_word: κατασκηνώσεις
  choice: гнёзда
  rationale: Контекстуально ясное обозначение птичьих мест обитания; более широкое значение «пристанища» здесь передано конкретным и естественным образом.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Сохраняет самообозначение Иисуса, традиционную форму титула и его возможные богословские и ветхозаветные связи, не сводя выражение к простой характеристике человека.
- source_word: οὐκ ἔχει ποῦ
  choice: негде
  rationale: Идиоматичный русский способ точно передать отрицательную конструкцию со значением отсутствия места.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: приклонить голову
  rationale: Естественное и достоинственное русское выражение, сохраняющее конкретный образ склонения головы для отдыха.
theological_decisions:
- issue: Передача самообозначения ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  alternative: Человек / Человеческий Сын
  rationale: Устоявшаяся передача сохраняет форму титула, его неоднозначность и возможную связь с Дан 7; альтернативы либо устраняют титульное звучание, либо неестественны по-русски.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской образностью. Синтаксис краткий и ясный; тире восполняет подразумеваемое сказуемое во второй части параллелизма. «Приклонить голову» сохраняет достоинство и узнаваемость выражения без архаизации всего стиха.
