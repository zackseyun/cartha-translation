  text: For the Son of Man is Lord of the Sabbath[a][b].
translation:
  language: ru
  text: Ибо Сын Человеческий — Господь субботы[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сын Человеческий властен над субботой».'
    reason: lexical_alternative
  - marker: b
    text: «Сын Человеческий» — характерное самообозначение Иисуса в Евангелиях. Более обобщённо это выражение можно передать как «человек», однако тогда ослабевает его вероятное значение как титула.
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: ведь
  rationale: Передаёт пояснительно-обосновывающую связь с предшествующим рассуждением и естественно звучит в современном русском.
- source_word: κύριος
  choice: Господин
  rationale: Сохраняет значение власти и господства; в конструкции с родительным падежом естественно передаёт κύριος τοῦ σαββάτου, не превращая её в более истолковывающее «властен над».
- source_word: τοῦ σαββάτου
  choice: субботы
  rationale: Родительный падеж непосредственно воспроизводит греческую конструкцию после κύριος и обозначает субботний день как установление.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Сохраняет характерное для Иисуса евангельское самообозначение и его вероятный межтекстовый, в том числе связанный с Дан 7, смысловой отзвук.
- source_word: ἐστιν
  choice: —
  rationale: В русском настоящем времени именная связка обычно опускается; тире ясно и естественно обозначает сказуемую связь.
theological_decisions:
- issue: Христологическая сила выражения κύριος ... τοῦ σαββάτου
  choice: «Сын Человеческий — Господин субботы» как сильное утверждение власти.
  alternative: «Сын Человеческий властен над субботой».
  rationale: Формулировка сохраняет вес титула и прямую связь с греческой конструкцией, не уточняя сверх текста, каким именно образом осуществляется эта власть.
- issue: Передача ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Титульное «Сын Человеческий».
  alternative: «человек» / «человеческий сын».
  rationale: Традиционная титульная форма сохраняет евангельскую и вероятную апокалиптическую многозначность, тогда как родовое обозначение человека её сглаживает.
translation_notes:
  register: Современный литературный русский, краткий и торжественный без архаизации. «Ведь» естественно связывает стих с предыдущим доводом; «Господин» пишется с прописной буквы как отнесённое к Иисусу титульное обозначение. Слово «суббота» оставлено со строчной буквы согласно нормам русского письма.
