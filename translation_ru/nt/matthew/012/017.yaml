base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[a], saying:'
translation:
  language: ru
  text: 'чтобы исполнилось сказанное через пророка Исаию[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «сказанное через пророка Исаию, говорящего». Последнее причастие вводит следующую далее цитату.'
    reason: Передача греческого причастия λέγοντος посредством русской пунктуации.
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно вводит целевое или результативное придаточное, не устраняя присущую конструкции смысловую неоднозначность.
- source_word: πληρωθῇ
  choice: исполнилось
  rationale: Передаёт аорист пассивного залога в формуле исполнения пророчества; русская конструкция с «чтобы» естественно выражает сослагательно-целевой оттенок.
- source_word: τὸ ῥηθὲν
  choice: сказанное
  rationale: Субстантивированное причастие передано кратко и естественно с сохранением пассивного смысла.
- source_word: διὰ
  choice: через
  rationale: 'При родительном падеже обозначает посредничество: пророк выступает проводником возвещённого слова.'
- source_word: Ἠσαΐου
  choice: Исаию
  rationale: Употреблена традиционная русская форма имени в требуемом после «через» винительном падеже.
- source_word: τοῦ προφήτου
  choice: пророка
  rationale: Сохранено данное в греческом тексте приложение к имени Исаии.
- source_word: λέγοντος
  choice: ':'
  rationale: Причастие вводит следующую прямую цитату; в современном русском эту функцию естественно и без смысловой потери передаёт двоеточие, избегая тяжеловесного «говорящего».
theological_decisions:
- issue: Посредническая роль пророка в формуле цитирования
  choice: через пророка Исаию
  alternative: пророком Исаией
  rationale: «Через» точнее сохраняет διά с родительным падежом и различие между источником вести и пророком как её посредником, не добавляя в основной текст прямого указания на Бога.
translation_notes:
  register: Современный литературный русский язык, краткая и торжественная формула исполнения пророчества. Порядок слов «через пророка Исаию» естественен по-русски и сохраняет посредническое значение διά.
