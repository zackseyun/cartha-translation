  variant: modern literary Russian
source:
  edition: SBLGNT
  text: κάλαμον συντετριμμένον οὐ κατεάξει καὶ λίνον τυφόμενον οὐ σβέσει, ἕως ἂν ἐκβάλῃ εἰς νῖκος τὴν κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/020.yaml
  text: He will not break a bruised reed[a], and he will not extinguish a smoldering wick[b], until he brings justice to victory.
translation:
  language: ru
  text: Надломленной трости Он не переломит, и тлеющего фитиля[a] не погасит, пока не приведёт справедливость к победе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дымящегося льна»; имеется в виду льняной фитиль светильника.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пока не приведёт суд к победе».'
    reason: alternative_reading
lexical_decisions:
- source_word: κάλαμον
  choice: трости
  rationale: κάλαμος обозначает тростник или трость; форма «трости» естественно передаёт образ из Ис 42:3.
- source_word: συντετριμμένον
  choice: надломленной
  rationale: Причастие описывает уже повреждённую, смятую трость, но не обязательно полностью сломанную; «надломленной» сохраняет различие с последующим «не переломит».
- source_word: κατεάξει
  choice: не переломит
  rationale: κατάγνυμι значит «ломать, переламывать»; глагол ясно и естественно завершает образ повреждённой трости.
- source_word: λίνον
  choice: фитиля
  rationale: Буквально слово обозначает лён, но здесь имеется в виду льняной фитиль светильника. «Фитиль» непосредственно передаёт понятный современному читателю предмет; буквальный образ отмечен в сноске.
- source_word: τυφόμενον
  choice: тлеющего
  rationale: Причастие описывает дымящийся, едва горящий фитиль, близкий к угасанию. «Тлеющего» естественно передаёт слабое остаточное горение.
- source_word: σβέσει
  choice: не погасит
  rationale: σβέννυμι означает гасить; «не погасит» — ясное и современное соответствие в контексте фитиля.
- source_word: ἕως ἂν
  choice: пока не
  rationale: Конструкция указывает на будущий предел и по-русски естественно передаётся сочетанием «пока не».
- source_word: ἐκβάλῃ
  choice: не приведёт
  rationale: Здесь ἐκβάλλω имеет смысл решительно довести или вывести к определённому исходу; вместе с εἰς νῖκος естественно переводится «приведёт … к победе».
- source_word: εἰς νῖκος
  choice: к победе
  rationale: Оборот выражает победный, успешный исход действия.
- source_word: τὴν κρίσιν
  choice: справедливость
  rationale: В контексте цитаты о Слуге κρίσις относится не только к судебному решению, но и к утверждению справедливого Божьего порядка. Возможное «суд» сохранено в сноске.
theological_decisions:
- issue: Передача κρίσις в цитате о Слуге
  choice: справедливость
  alternative: суд
  rationale: «Справедливость» передаёт широкий пророческий смысл установления правого порядка, не ограничивая выражение вынесением судебного приговора. Лексически возможное «суд» отмечено как альтернатива.
- issue: Степень буквальности образа λίνον
  choice: тлеющий фитиль
  alternative: дымящийся лён
  rationale: В греческом тексте буквально назван лён, служивший фитилём светильника. Основной перевод ясно называет подразумеваемый предмет, а сноска сохраняет буквальную форму образа.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой цитаты. Образы переданы ясно и без архаизмов; местоимение «Он» написано с прописной буквы как отсылка к ранее названному Слуге, без добавления имени или толкования.
