id: MAT.12.43
reference: Matthew 12:43
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὅταν δὲ τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ οὐχ εὑρίσκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/043.yaml
  text: When the unclean spirit goes out from the man[a], it passes through waterless places seeking rest, and does not find it.
translation:
  language: ru
  text: Когда же нечистый дух выходит из человека, он проходит по безводным местам[a], ища покоя, и не находит его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по сухим местам». Буквально: «по местам без воды».'
    reason: 'Лексическая альтернатива для ἀνύδρων: традиционное «сухим» возможно, тогда как основной текст сохраняет буквальный образ отсутствия воды.'
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Когда же
  rationale: Передаёт общее временное условие ὅταν и мягкую связующую силу δέ без добавления отдельного наречия «теперь».
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: нечистый дух
  rationale: Сохраняет буквальное обозначение источника и его связь с библейским языком ритуальной и нравственной нечистоты; слово «демон» было бы уточнением сверх греческого текста.
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: выходит из человека
  rationale: Настоящее время естественно выражает по-русски повторяющуюся или общую ситуацию, заданную ὅταν с аористом сослагательного наклонения. «Человек» точно и естественно передаёт родовое ἄνθρωπος.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: проходит по безводным местам
  rationale: «Проходит по» естественно передаёт движение через некоторую местность, а «безводным» сохраняет конкретный образ отсутствия воды.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: ища покоя
  rationale: Деепричастный оборот сохраняет одновременность поиска с движением; «покой» прямо передаёт ἀνάπαυσις без уточняющего толкования «место отдыха».
- source_word: καὶ οὐχ εὑρίσκει
  choice: и не находит его
  rationale: Союз «и» сохраняет καί, а местоимение «его» естественно восполняет по-русски подразумеваемый объект — покой.
theological_decisions:
- issue: Передача πνεῦμα в контексте изгнания злых духов
  choice: дух
  alternative: демон
  rationale: Хотя речь идёт о личном злом духе, источник употребляет πνεῦμα, а не δαιμόνιον; буквальный выбор сохраняет формулировку и богословскую образность текста.
- issue: Определённость τοῦ ἀνθρώπου
  choice: из человека
  alternative: из того человека
  rationale: Греческий артикль не требует указательного оттенка. Русское родовое «из человека» естественно передаёт участника обобщённой ситуации и не создаёт ссылки на конкретного ранее названного мужчину.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным евангельским регистром. Синтаксис близок к греческому, но естественен по-русски; подлинная образность «безводных мест» сохранена.
