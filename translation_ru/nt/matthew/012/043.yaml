  source_fidelity: 'Текст точно передаёт греческий оригинал: обобщённое условие Ὅταν передано «Когда», мягкая связка δέ — «же»; «нечистый дух», «выходит из человека», «проходит по безводным местам», «ища покоя» и «не находит его» соответствуют исходным словам и синтаксическим отношениям. Необязательное в греческом дополнение при «не находит» естественно восстановлено русским местоимением «его», относящимся к «покою».'
