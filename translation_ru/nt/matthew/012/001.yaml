id: MAT.12.1
reference: Matthew 12:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἐπορεύθη ὁ Ἰησοῦς τοῖς σάββασιν διὰ τῶν σπορίμων· οἱ δὲ μαθηταὶ αὐτοῦ ἐπείνασαν καὶ ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/001.yaml
  text: At that time Jesus went through the grainfields on the Sabbath[a], and his disciples became hungry and began to pluck heads of grain and eat.
translation:
  language: ru
  text: В то время Иисус шёл в субботу[a] через хлебные поля. Его ученики проголодались и стали срывать колосья и есть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в субботы»; множественное число в греческом языке здесь идиоматически обозначает субботний день.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: В то время
  rationale: Естественно передаёт повествовательный временной указатель; καιρός здесь обозначает время или случай, а не точный момент по часам.
- source_word: ἐπορεύθη
  choice: шёл
  rationale: Передаёт движение Иисуса через поля естественным русским глаголом, не придавая форме излишнего аспектуального значения.
- source_word: τοῖς σάββασιν
  choice: в субботу
  rationale: Формально множественное число является обычным греческим обозначением субботнего дня; русский перевод в единственном числе точно передаёт смысл контекста.
- source_word: διὰ τῶν σπορίμων
  choice: через хлебные поля
  rationale: σπόριμα — засеянные поля, прежде всего поля со злаками; «хлебные поля» понятно и естественно в современном литературном русском.
- source_word: οἱ δὲ μαθηταὶ αὐτοῦ
  choice: Его ученики
  rationale: δέ здесь служит мягким переходом, поэтому отдельное предложение без противительного союза естественно продолжает повествование.
- source_word: ἐπείνασαν
  choice: проголодались
  rationale: Глагол естественно выражает наступление голода и сохраняет возможный начинательный оттенок аориста.
- source_word: ἤρξαντο τίλλειν
  choice: стали срывать
  rationale: «Стали» естественно передаёт начало действия, а «срывать» точно описывает отделение колосьев рукой.
- source_word: στάχυας
  choice: колосья
  rationale: Прямой и общепонятный русский эквивалент для головок или колосьев зерновых растений.
- source_word: καὶ ἐσθίειν
  choice: и есть
  rationale: Сохраняет координацию двух инфинитивов после ἤρξαντο без ненужного повторения вспомогательного глагола.
theological_decisions:
- issue: Передача τοῖς σάββασιν
  choice: в субботу
  alternative: по субботам / в субботы
  rationale: Хотя греческая форма морфологически множественная, здесь это идиоматическое обозначение одного субботнего дня. Единственное число предотвращает ошибочное впечатление, будто речь идёт о неоднократных событиях.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. «Хлебные поля» употреблено в значении полей со злаками; «проголодались» сохраняет наступление состояния. Маркер сноски поставлен непосредственно после слова «субботу».
