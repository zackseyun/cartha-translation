  source_fidelity: 'Перевод точно передаёт греческий текст: εἰδὼς передано деепричастием «зная» без уточнения способа знания; ἐνθυμήσεις — нейтральным «мысли»; обобщающее Πᾶσα сохранено («всякое»); μερισθεῖσα καθ’ ἑαυτῆς адекватно выражено как «разделившееся само против себя». «Опустошается» передаёт ἐρημοῦται как процесс разорения, а «не устоит» естественно отражает οὐ σταθήσεται. Неоднозначность οἰκία сохранена через «дом» и сноску.'
