id: MAT.12.25
reference: Matthew 12:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰδὼς ⸀δὲ τὰς ἐνθυμήσεις αὐτῶν εἶπεν αὐτοῖς· Πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/025.yaml
  text: But knowing their thoughts[a], he said to them, “Every kingdom divided against itself is laid waste[c][b], and every city or house divided against itself will not stand.”
translation:
  language: ru
  text: 'Но он, зная их мысли[a], сказал им: «Всякое царство, разделившееся само против себя, опустошается[b], и всякий город или дом[c], разделившийся сам против себя, не устоит».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рассуждения»; возможно также: «намерения».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «приходит в запустение» или «разоряется».'
    reason: lexical_alternative
  - marker: c
    text: Слово «дом» здесь может также означать семью, домашних.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: зная
  rationale: Причастие передаёт знание или осознание; «зная» естественно сохраняет связь с главным глаголом и не уточняет, каким образом это знание было получено.
- source_word: δὲ
  choice: Но
  rationale: Частица обозначает мягкий переход с оттенком противопоставления; в данном контексте русское «но» естественно вводит ответ Иисуса.
- source_word: ἐνθυμήσεις
  choice: мысли
  rationale: Слово может обозначать мысли, внутренние рассуждения или намерения. «Мысли» — ясный современный эквивалент, не сужающий значение до одного вида внутренней деятельности.
- source_word: Πᾶσα βασιλεία
  choice: Всякое царство
  rationale: Сочетание имеет обобщающий характер и формулирует универсальный принцип.
- source_word: μερισθεῖσα καθ’ ἑαυτῆς
  choice: разделившееся само против себя
  rationale: Передаёт внутренний раскол и направленность частей единого целого друг против друга, сохраняя образ исходного текста.
- source_word: ἐρημοῦται
  choice: опустошается
  rationale: Глагол выражает превращение в пустынное, разорённое состояние; «опустошается» сохраняет серьёзность образа и допускает как процесс, так и результат разорения.
- source_word: πόλις ἢ οἰκία
  choice: город или дом
  rationale: «Город» прямо передаёт πόλις, а «дом» сохраняет широту οἰκία, которое может обозначать как строение, так и живущую в нём семью.
- source_word: οὐ σταθήσεται
  choice: не устоит
  rationale: 'Краткое и естественное русское выражение передаёт смысл: не сохранит прочности и существования.'
theological_decisions:
- issue: Природа знания Иисуса о внутренних мыслях оппонентов
  choice: Сказать лишь, что он знал их мысли, не объясняя способ этого знания.
  alternative: Уточнить, что он сверхъестественно знал их мысли, либо что он распознал их намерения по обстоятельствам.
  rationale: Греческий текст утверждает факт знания, но не объясняет его механизм; перевод не должен разрешать эту богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с лаконичным, афористичным построением. Повтор синтаксической конструкции сохранён как важная часть риторики стиха; формулировка не вводит объяснения источника знания Иисуса.
