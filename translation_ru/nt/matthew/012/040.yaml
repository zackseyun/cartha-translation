id: MAT.12.40
reference: Matthew 12:40
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἦν Ἰωνᾶς ἐν τῇ κοιλίᾳ τοῦ κήτους τρεῖς ἡμέρας καὶ τρεῖς νύκτας, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ καρδίᾳ τῆς γῆς τρεῖς ἡμέρας καὶ τρεῖς νύκτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/040.yaml
  text: For just as Jonah was in the belly of the sea creature three days and three nights[c][b][a], so the Son of Man will be in the heart of the earth three days and three nights.
translation:
  language: ru
  text: Ведь как Иона был во чреве морского существа[a] три дня и три ночи[b], так и Сын Человеческий будет в сердце земли[c] три дня и три ночи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «огромной рыбы». Греческое слово обозначает крупное морское существо и не является точным зоологическим термином.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «три дня и три ночи» иногда понимают как идиому, которая может включать части трёх дней; другие понимают его более строго.
    reason: alternative_reading
  - marker: c
    text: Выражение «в сердце земли» может относиться к погребению, могиле, глубинам земли или царству мёртвых; в основном тексте сохранена греческая метафора.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Ведь как
  rationale: «Ведь» естественно передаёт пояснительную силу γάρ, а «как» вводит сопоставление, соответствующее ὥσπερ.
- source_word: Ἰωνᾶς
  choice: Иона
  rationale: Традиционная и общепринятая русская форма библейского имени.
- source_word: ἐν τῇ κοιλίᾳ
  choice: во чреве
  rationale: Передаёт образ внутренности или утробы крупного существа и сохраняет достоинство библейского повествования; современному читателю слово понятно.
- source_word: τοῦ κήτους
  choice: морского существа
  rationale: κῆτος обозначает крупное морское существо и не требует более узкого зоологического определения «рыба» или «кит».
- source_word: τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: три дня и три ночи
  rationale: Прямо сохраняет повторённое в греческом тексте временное выражение, не решая в переводе вопрос о его хронологическом понимании.
- source_word: οὕτως
  choice: так и
  rationale: Естественно завершает русскую сравнительную конструкцию «как… так и…».
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшаяся русская передача мессианского самоназвания Иисуса, сохраняющая его библейские связи.
- source_word: ἔσται
  choice: будет
  rationale: Точно передаёт будущее время глагола εἰμί, не добавляя значения продолжительности.
- source_word: ἐν τῇ καρδίᾳ τῆς γῆς
  choice: в сердце земли
  rationale: Сохраняет метафору καρδία и намеренно не сводит её к одному из возможных толкований — могиле, погребению, глубинам земли или царству мёртвых.
theological_decisions:
- issue: Значение выражения «в сердце земли»
  choice: Метафора сохранена буквально без уточняющего истолкования.
  alternative: «в могиле», «в глубинах земли» или «в царстве мёртвых»
  rationale: Греческое выражение допускает обсуждение этих смыслов, но само по себе не устанавливает однозначно ни один из них.
- issue: Смысл выражения «три дня и три ночи»
  choice: В основном тексте сохранено буквальное временное выражение.
  alternative: Семитское счисление, включающее части трёх дней, или строго семьдесят два часа
  rationale: Перевод не должен заранее разрешать хронологический спор, которого формулировка стиха сама не разрешает.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Конструкция «как… так и…» ясна и естественна; «чрево» сохраняет традиционный образ без архаической перегруженности. Все спорные смысловые уточнения вынесены в примечания.
