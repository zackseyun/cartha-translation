  text: Καὶ μεταβὰς ἐκεῖθεν ἦλθεν εἰς τὴν συναγωγὴν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/009.yaml
  text: And departing from there, he went into their synagogue.
translation:
  language: ru
  text: Уйдя оттуда, Иисус вошёл в их синагогу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Не передано отдельным союзом
  rationale: В русском повествовании связь с предыдущим эпизодом естественно выражена последовательностью действий; начальное «и» здесь возможно, но утяжеляет фразу.
- source_word: μεταβὰς ἐκεῖθεν
  choice: Уйдя оттуда
  rationale: Деепричастная конструкция естественно передаёт предшествующее перемещение и значение удаления от прежнего места.
- source_word: ἦλθεν
  choice: вошёл
  rationale: В сочетании с εἰς τὴν συναγωγήν глагол обозначает направленное движение внутрь; «вошёл» ясно и естественно передаёт всю конструкцию.
- source_word: αὐτῶν
  choice: их
  rationale: Сохранено нейтральное притяжательное местоимение без уточнения его референта и без внесения полемического оттенка.
- source_word: συναγωγήν
  choice: синагогу
  rationale: Устоявшееся и точное русское обозначение иудейского места собрания и богослужения.
theological_decisions:
- issue: Референт выражения «их синагога»
  choice: их синагогу
  alternative: ту синагогу / синагогу фарисеев
  rationale: Греческий текст не уточняет референт αὐτῶν. Нейтральное «их» сохраняет исходную неоднозначность и не приписывает синагогу конкретной враждебной группе.
- issue: Явное называние субъекта
  choice: Иисус
  alternative: Он
  rationale: Хотя греческий субъект выражен формой глагола, русское «Иисус» естественно восстанавливает продолжающийся субъект повествования и устраняет возможную неясность без богословского истолкования.
translation_notes:
  register: Современный литературный русский язык; краткая, плавная и dignified повествовательная формулировка. Деепричастие сохраняет связь двух действий, а «вошёл» естественно передаёт движение внутрь с εἰς.
