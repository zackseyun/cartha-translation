  text: οἱ δὲ Φαρισαῖοι ἀκούσαντες εἶπον· Οὗτος οὐκ ἐκβάλλει τὰ δαιμόνια εἰ μὴ ἐν τῷ Βεελζεβοὺλ ἄρχοντι τῶν δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/024.yaml
  text: But when the Pharisees heard it[a], they said, “This man does not cast out demons except by Beelzebul, the ruler of the demons.”
translation:
  language: ru
  text: 'Но фарисеи, услышав об этом, сказали: «Этот человек изгоняет бесов не иначе как с помощью Веельзевула[a], повелителя бесов».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Веельзевул»; традиционная форма имени, соответствующая «Beelzebub», — «Веельзевув».'
    reason: Уточняет традиционный вариант передачи имени, сохраняя в основном тексте форму исходного греческого текста.
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт противопоставление положительной реакции народа в предыдущем стихе враждебной реакции фарисеев.
- source_word: ἀκούσαντες
  choice: услышав об этом
  rationale: Аористное причастие передано естественным русским деепричастным оборотом; подразумеваемый объект восстановлен из контекста.
- source_word: Οὗτος
  choice: Этот человек
  rationale: Сохраняет указательный и слегка пренебрежительный оттенок реплики, не усиливая его сверх текста.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: изгоняет бесов
  rationale: Прямое и естественное для русского библейского повествования обозначение изгнания злых духов.
- source_word: εἰ μὴ ἐν
  choice: не иначе как с помощью
  rationale: Ясно передаёт исключительность предполагаемого средства или посредничества, выраженную греческой конструкцией.
- source_word: Βεελζεβοὺλ
  choice: Веельзевул
  rationale: Передаёт форму имени Βεελζεβούλ в исходном греческом тексте и соответствует укоренившейся русской транслитерации.
- source_word: ἄρχοντι τῶν δαιμονίων
  choice: повелителя бесов
  rationale: Передаёт значение власти и главенства слова ἄρχων естественным современным русским выражением.
theological_decisions:
- issue: Враждебный оттенок указательного местоимения Οὗτος
  choice: Этот человек
  alternative: Он; этот
  rationale: Выбранный вариант передаёт пренебрежительный тон фарисеев, не добавляя богословской оценки.
- issue: Характер связи, выраженной ἐν τῷ Βεελζεβούλ
  choice: с помощью Веельзевула
  alternative: силой Веельзевула; посредством Веельзевула
  rationale: Формулировка сохраняет обвинение в посредничестве или содействии Веельзевула, не уточняя сверх греческого текста, идёт ли речь строго о силе, власти или непосредственном действии.
- issue: Титул ἄρχων применительно к бесам
  choice: повелитель бесов
  alternative: князь бесов; правитель бесов
  rationale: «Повелитель» ясно выражает приписываемое главенство и звучит естественно, не вводя дополнительной иерархической системы.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Реплика звучит ясно и естественно; оборот «не иначе как» сохраняет категоричность обвинения. Маркер сноски поставлен непосредственно после имени, к которому относится примечание.
