id: MAT.12.32
reference: Matthew 12:32
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ’ ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν ⸂τούτῳ τῷ⸃ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/032.yaml
  text: And whoever speaks a word against the Son of Man[a], it will be forgiven him; but whoever speaks against the Holy Spirit, it will not be forgiven him[c][b], neither in this age nor in the coming one.
translation:
  language: ru
  text: И всякому, кто скажет слово против Сына Человеческого, будет прощено; но тому, кто скажет что-либо против Святого Духа, не будет прощено ни в нынешнем веке, ни в грядущем.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς ἐὰν / ὃς δ’ ἂν
  choice: всякому, кто… но тому, кто
  rationale: Неопределённо-относительная конструкция выражает общее условие. Такое русское построение естественно и позволяет сохранить дательный αὐτῷ при сказуемом «будет прощено».
- source_word: εἴπῃ λόγον
  choice: скажет слово
  rationale: Сохраняет явное λόγον и торжественную, но понятную русскую формулировку; речь идёт о слове, направленном против Сына Человеческого.
- source_word: κατὰ
  choice: против
  rationale: При родительном падеже в данном контексте обозначает враждебно направленную речь; «против» точно и естественно в обеих частях стиха.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Сына Человеческого
  rationale: Устоявшаяся точная передача титула, сохраняющая его библейские и мессианские ассоциации.
- source_word: ἀφεθήσεται αὐτῷ / οὐκ ἀφεθήσεται αὐτῷ
  choice: будет прощено / не будет прощено
  rationale: Сохранена пассивная безличная конструкция оригинала и параллелизм двух частей; подразумевается прощение сказанного слова или проступка.
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: Святого Духа
  rationale: Нормативная современная русская передача личного наименования; порядок слов естественен для русского языка.
- source_word: οὔτε ἐν τούτῳ τῷ αἰῶνι
  choice: ни в нынешнем веке
  rationale: αἰών здесь обозначает временную эпоху, противопоставленную грядущей. «Нынешний век» яснее современному читателю, чем буквальное «этот век», и не превращает временной контраст в пространственный.
- source_word: οὔτε ἐν τῷ μέλλοντι
  choice: ни в грядущем
  rationale: Передаёт субстантивированное и эллиптическое μέλλοντι; существительное «веке» естественно подразумевается из предыдущей части, как и в греческом.
theological_decisions:
- issue: Временное противопоставление αἰών / μέλλων
  choice: ни в нынешнем веке, ни в грядущем
  alternative: ни в этом мире, ни в будущем мире; ни в нынешнем веке, ни в грядущем веке
  rationale: Оригинал противопоставляет настоящую и будущую эпохи, а не два пространственных мира. Эллипсис во второй части сохранён естественным для русского языка образом.
- issue: Характер непростительного проступка
  choice: Сохранить предупреждение о речи против Святого Духа без добавочного определения этого проступка
  alternative: Уточнить его как конкретное историческое обвинение или как окончательную нераскаянность
  rationale: Сам стих говорит о последствиях речи против Святого Духа, но не даёт исчерпывающего позднейшего богословского определения; перевод не должен разрешать эту напряжённость за текст.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной библейской торжественностью. Синтаксический параллелизм двух предупреждений сохранён. Слово «век» употреблено в значении эпохи; «грядущем» сохраняет эллипсис оригинала без ущерба ясности.
