  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ ἐκβάλλει ἀγαθά, καὶ ὁ πονηρὸς ἄνθρωπος ἐκ τοῦ πονηροῦ θησαυροῦ ἐκβάλλει πονηρά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/035.yaml
  text: The good man brings out good things from his good treasure[b][a], and the evil man brings out evil things from his evil treasure.
translation:
  language: ru
  text: Добрый человек из доброго сокровища выносит доброе[a], а злой человек из злого сокровища выносит злое.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В ближайшем контексте речь идёт о словах, поэтому «доброе» и «злое» здесь могут прежде всего означать добрые и злые слова.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγαθὸς
  choice: добрый
  rationale: Сохраняет нравственный смысл и повтор корня в сочетании «доброе», поддерживая параллелизм греческого текста.
- source_word: ἄνθρωπος
  choice: человек
  rationale: Естественный русский эквивалент родового ἄνθρωπος; подходит для обобщённого изречения и не требует отдельной гендерной оговорки.
- source_word: θησαυροῦ
  choice: сокровище
  rationale: Сохраняет метафору внутреннего запаса; «кладовая» была бы излишне конкретной.
- source_word: ἐκβάλλει
  choice: выносит
  rationale: Передаёт движение наружу и образ извлечения из сокровища, оставаясь естественным в данном афористическом построении.
- source_word: ἀγαθά
  choice: доброе
  rationale: Субстантивированное прилагательное среднего рода множественного числа передано обобщённым русским «доброе», без добавления отсутствующего в греческом существительного.
- source_word: πονηρὸς
  choice: злой
  rationale: Передаёт сильную нравственную противоположность слову ἀγαθός и естественно сочетается со словом «человек».
- source_word: πονηρά
  choice: злое
  rationale: Сохраняет симметрию с «доброе» и широту субстантивированного греческого прилагательного.
- source_word: ἐκ
  choice: из
  rationale: Точно и естественно обозначает источник того, что человек выносит.
theological_decisions:
- issue: Относится ли «доброе/злое» только к словам или также к поступкам
  choice: В основном тексте сохранено широкое «доброе/злое».
  alternative: Уточнить как «добрые/злые слова» ввиду ближайшего контекста о речи.
  rationale: В греческом тексте нет выраженного существительного; хотя контекст прежде всего касается речи, сужение смысла в основном тексте устранило бы подлинную широту формулировки.
translation_notes:
  register: Современный литературный русский язык с сохранением краткого, уравновешенного параллелизма и метафоры сокровища. «Человек» естественно передаёт обобщённое значение ἄνθρωπος, поэтому примечание о варианте «мужчина/человек» не требуется.
