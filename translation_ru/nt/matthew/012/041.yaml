  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἄνδρες Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/041.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the preaching of Jonah, and behold[b], something greater than Jonah is here.
translation:
  language: ru
  text: Мужчины Ниневии восстанут на суд вместе с этим поколением и осудят его, потому что они покаялись в ответ на проповедь Ионы[a]. И вот, здесь нечто большее, чем Иона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «они покаялись, услышав проповедь Ионы».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «здесь Тот, кто больше Ионы». В греческом употреблено выражение среднего рода, буквально: «нечто большее, чем Иона».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: жители Ниневии
  rationale: Буквально выражение обозначает «мужей-ниневитян». В современном русском «жители Ниневии» естественно называет ниневитян, выступающих как группа, и не создаёт ошибочного впечатления, будто речь намеренно ограничена только взрослыми мужчинами.
- source_word: ἀναστήσονται
  choice: поднимутся
  rationale: Передаёт буквальный образ вставания и сохраняет возможный оттенок воскресения в контексте последнего суда, не уточняя его сверх текста.
- source_word: ἐν τῇ κρίσει
  choice: на суд
  rationale: Естественное русское обозначение судебного события; в контексте речь идёт об эсхатологическом суде.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: вместе с этим поколением
  rationale: Сохраняет обычное значение μετά с родительным падежом — «с, вместе с»; противопоставление выражено последующим глаголом «осудят».
- source_word: κατακρινοῦσιν αὐτήν
  choice: осудят его
  rationale: Глагол означает вынесение обвинительного приговора, а местоимение относится к «этому поколению».
- source_word: μετενόησαν
  choice: покаялись
  rationale: В данном пророческом контексте слово обозначает покаянный отклик, а не просто перемену мнения.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: в ответ на проповедь Ионы
  rationale: Ясно передаёт направленный отклик на возвещение Ионы; εἰς здесь указывает на отношение покаяния к услышанной проповеди.
- source_word: ἰδοὺ
  choice: и вот
  rationale: Сохраняет торжественный указательный акцент и при этом звучит естественно в современном литературном русском.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: здесь нечто большее, чем Иона
  rationale: Средний род πλεῖον передан как «нечто большее», что сохраняет форму и смысловую широту греческого выражения и не сводит сравнение исключительно к двум лицам.
theological_decisions:
- issue: Отнесение πλεῖον Ἰωνᾶ к Иисусу и его служению
  choice: здесь нечто большее, чем Иона
  alternative: здесь Тот, кто больше Ионы
  rationale: 'Греческое πλεῖον стоит в среднем роде. Перевод «нечто большее» сохраняет грамматическую и богословскую напряжённость выражения: оно может указывать не только на личность Иисуса, но и на присутствующую в нём и его служении бо́льшую реальность.'
- issue: Передача ἄνδρες в выражении ἄνδρες Νινευῖται
  choice: жители Ниневии
  alternative: мужи Ниневии
  rationale: Хотя ἄνδρες имеет мужскую форму, всё выражение в контексте обозначает ниневитян как участников суда. «Жители Ниневии» естественно и точно передаёт референт, тогда как «мужи Ниневии» в современном русском архаично и может неоправданно сузить смысл до взрослых мужчин.
translation_notes:
  register: Современный литературный русский с торжественностью, уместной для судебного и пророческого контекста. Архаизмы устранены; синтаксис остаётся близким к греческому, но читается естественно. Неоднозначность среднего рода πλεῖον сохранена в основном тексте и пояснена в сноске.
