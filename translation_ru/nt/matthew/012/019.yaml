source:
  edition: SBLGNT
  text: οὐκ ἐρίσει οὐδὲ κραυγάσει, οὐδὲ ἀκούσει τις ἐν ταῖς πλατείαις τὴν φωνὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/019.yaml
  text: He will not quarrel or cry out[a], and no one will hear his voice in the streets.
translation:
  language: ru
  text: Он не станет спорить и не будет кричать[a], и никто не услышит его голоса на улицах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будет вступать в распри и громко восклицать, и никто не услышит его голоса на площадях».'
    reason: 'Лексические варианты для ἐρίσει, κραυγάσει и πλατείαις сохраняют более формальные оттенки: распря, громкий возглас и открытое общественное пространство.'
lexical_decisions:
- source_word: ἐρίσει
  choice: не станет спорить
  rationale: Глагол обозначает вступление в спор или распрю. «Не станет спорить» естественно звучит по-русски и передаёт неконфликтный образ Слуги, не подразумевая полного отказа от всякой словесной полемики.
- source_word: κραυγάσει
  choice: не будет кричать
  rationale: Глагол означает громко восклицать или кричать. Выбор сохраняет параллелизм и идею шумного публичного самоутверждения.
- source_word: ἀκούσει τις
  choice: никто не услышит
  rationale: Греческое отрицание с неопределённым местоимением естественно передаётся русским «никто не услышит».
- source_word: ἐν ταῖς πλατείαις
  choice: на улицах
  rationale: Слово обозначает широкие улицы или общественные пространства. «На улицах» — ясное и идиоматичное обозначение публичной среды; возможный более узкий вариант отмечен в сноске.
- source_word: φωνὴν αὐτοῦ
  choice: его голоса
  rationale: В данном контексте φωνή прямо обозначает голос; родительный падеж обусловлен управлением глагола «услышит».
- source_word: οὐκ…οὐδὲ…οὐδὲ
  choice: не станет… и не будет… и никто не…
  rationale: Последовательность отрицаний передана плавной современной русской конструкцией с сохранением их накопительного действия.
theological_decisions:
- issue: Связь с образом Слуги у Исаии и характер служения Мессии
  choice: Стих описывает Мессию как неконфликтного и не стремящегося к шумному публичному самоутверждению.
  alternative: 'Более формально: «не будет состязаться и вопить», с традиционным звучанием ветхозаветной цитаты.'
  rationale: Греческий текст характеризует образ действий Иисуса в исполнение Ис 42:2. Перевод сохраняет мягкость и отсутствие показной конфликтности, но не превращает стих в утверждение, будто Он вообще никогда не говорил публично и не вступал в споры.
translation_notes:
  register: Современный литературный русский язык; синтаксис простой и достоинственный. «Он» и «его» написаны со строчной буквы по общелитературной норме, без внесения конфессиональной орфографической маркировки.
