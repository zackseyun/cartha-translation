id: MAT.12.22
reference: Matthew 12:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τότε ⸂προσηνέχθη αὐτῷ δαιμονιζόμενος τυφλὸς καὶ κωφός⸃· καὶ ἐθεράπευσεν αὐτόν, ὥστε τὸν ⸀κωφὸν λαλεῖν καὶ βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/022.yaml
  text: Then a demon-possessed man[a], blind and mute, was brought to him; and he healed him, so that the mute man spoke and saw.
translation:
  language: ru
  text: Тогда к нему привели человека, одержимого бесом, слепого и немого[a]. Он исцелил его, так что немой стал говорить и видеть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глухого». Греческое слово может означать как глухого, так и немого; здесь контекст указывает на немоту, поскольку после исцеления человек стал говорить и видеть.'
    reason: Лексическая многозначность κωφός.
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественный временной указатель, вводящий следующее событие в повествовании.
- source_word: προσηνέχθη αὐτῷ
  choice: к нему привели
  rationale: Русская неопределённо-личная конструкция естественно передаёт греческий пассив, не называя не указанного в тексте деятеля.
- source_word: δαιμονιζόμενος
  choice: человека, одержимого бесом
  rationale: Ясно и естественно сохраняет прямое указание греческого текста на демоническое воздействие, не подменяя его клинической или расплывчатой формулировкой.
- source_word: τυφλὸς
  choice: слепого
  rationale: Прямой и общеупотребительный русский эквивалент.
- source_word: κωφός
  choice: немого
  rationale: Слово может обозначать глухого или немого, но последующее указание на то, что человек стал говорить, в данном контексте поддерживает значение «немой».
- source_word: ἐθεράπευσεν αὐτόν
  choice: Он исцелил его
  rationale: «Исцелил» точно и естественно передаёт θεραπεύω в контексте евангельского рассказа о чуде; местоимения сохраняют форму исходного текста.
- source_word: ὥστε
  choice: так что
  rationale: Передаёт фактический результат исцеления естественной русской конструкцией.
- source_word: τὸν κωφὸν λαλεῖν καὶ βλέπειν
  choice: немой стал говорить и видеть
  rationale: Субстантивированное прилагательное передано словом «немой»; «стал говорить и видеть» ясно выражает наступивший результат, не добавляя восстановления слуха, о котором здесь прямо не сказано.
theological_decisions:
- issue: Характер демонического воздействия
  choice: Сохранить прямую формулировку «одержимого бесом»
  alternative: «страдавшего душевной болезнью» или просто «больного»
  rationale: Греческий текст прямо связывает состояние человека с демоническим воздействием; перевод не должен устранять или натурализовать это утверждение.
- issue: Значение κωφός в данном контексте
  choice: «немой»
  alternative: «глухой»
  rationale: Лексически возможны оба значения, однако результат исцеления сформулирован как способность говорить и видеть, а не слышать и видеть. Альтернативное значение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Формулировка «одержимый бесом» понятна обычному читателю и сохраняет явную демоническую терминологию оригинала. Местоимение «нему» пишется со строчной буквы согласно современной нейтральной издательской норме.
