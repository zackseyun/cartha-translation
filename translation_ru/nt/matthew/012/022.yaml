  source_fidelity: 'Перевод точно передаёт структуру и содержание греческого текста: неопределённый агент при προσηνέχθη сохранён в форме «к нему привели»; δαιμονιζόμενος передано без натурализации; слепота и неспособность говорить переданы явно; результат исцеления включает и речь, и зрение. «Стал говорить и видеть» является естественным русским способом передать результативную конструкцию ὥστε ... λαλεῖν καὶ βλέπειν и не добавляет восстановления слуха.'
  naturalness: Текст звучит естественно на современном литературном русском, оставаясь сдержанным и пригодным для библейского повествования. Связка «Тогда ... Он исцелил его, так что...» ясна и плавна. Употребление «немой» в данном кратком повествовательном контексте нормативно и соответствует избранному регистру.
  terminology: «Одержимый бесом» точно сохраняет явную демоническую характеристику δαιμονιζόμενος. «Немой» обоснован контекстом, поскольку итог исцеления выражен через способность говорить; сноска надлежащим образом сохраняет лексическую возможность значения «глухой». Маркер [a] поставлен непосредственно после слова, к которому относится примечание.
