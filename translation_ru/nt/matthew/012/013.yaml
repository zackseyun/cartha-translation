  text: τότε λέγει τῷ ἀνθρώπῳ· Ἔκτεινόν ⸂σου τὴν χεῖρα⸃· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ὑγιὴς ὡς ἡ ἄλλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/013.yaml
  text: Then he says to the man[a], “Stretch out your hand.” And he stretched it out, and it was restored[b], healthy like the other one.
translation:
  language: ru
  text: 'Тогда он говорит человеку: «Протяни руку». Тот протянул её, и рука восстановилась[a] и стала такой же здоровой, как другая[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исцелилась»; греческий глагол подчёркивает восстановление до надлежащего состояния.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «здоровой, как другая»; под «другой» подразумевается другая рука этого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Передаёт последовательность событий и естественно связывает фразу с предыдущим повествованием.
- source_word: λέγει
  choice: говорит
  rationale: Сохраняет историческое настоящее греческого текста и живость повествования Матфея.
- source_word: τῷ ἀνθρώπῳ
  choice: человеку
  rationale: В контексте речь идёт о конкретном мужчине; русское «человеку» естественно и точно передаёт ἄνθρωπος без ненужного усиления указательным местоимением.
- source_word: Ἔκτεινόν σου τὴν χεῖρα
  choice: Протяни руку
  rationale: Прямое и естественное повеление; «руку» точно передаёт χεῖρα, а принадлежность в русском ясна из обращения и не требует обязательного «свою».
- source_word: ἐξέτεινεν
  choice: Тот протянул её
  rationale: «Тот» ясно указывает на человека, а «её» естественно восполняет подразумеваемое в греческом дополнение и сохраняет повтор глагола из повеления.
- source_word: ἀπεκατεστάθη
  choice: рука восстановилась
  rationale: Передаёт возвращение руки в надлежащее состояние, выраженное ἀποκαθίστημι, не сводя смысл только к общему понятию исцеления.
- source_word: ὑγιὴς ὡς ἡ ἄλλη
  choice: стала такой же здоровой, как другая
  rationale: Естественно передаёт состояние здоровья и сравнение с другой рукой; женский род ἡ ἄλλη подразумевает именно другую руку.
theological_decisions:
- issue: Характер описания чуда
  choice: Рука «восстановилась» и стала здоровой
  alternative: Рука «исцелилась» или «стала целой»
  rationale: Формулировка сохраняет значение возвращения к надлежащему состоянию в ἀπεκατεστάθη и не добавляет богословского истолкования сверх повествования.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Историческое настоящее сохранено. Местоимение, относящееся к Иисусу, написано со строчной буквы как обычное грамматическое местоимение, без привнесения конфессиональной типографской традиции.
