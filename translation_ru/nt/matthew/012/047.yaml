lexical_decisions:
- source_word: εἶπεν δέ τις αὐτῷ
  choice: Тогда кто-то сказал Ему
  rationale: δέ имеет мягкую связующую функцию; «тогда» естественно продолжает повествование, не создавая излишнего противопоставления. τις передано неопределённым «кто-то».
- source_word: Ἰδοὺ
  choice: не передано отдельным словом; непосредственное сообщение «Твоя мать…» выполняет функцию привлечения внимания
  rationale: В современном русском буквальные «вот» или «смотри» здесь могут звучать неестественно либо создавать нежелательную зрительную конкретизацию. Побудительная функция ἰδού сохраняется прямой репликой.
- source_word: ἡ μήτηρ σου
  choice: Твоя мать
  rationale: Прямое и естественное соответствие греческой притяжательной конструкции.
- source_word: οἱ ἀδελφοί σου
  choice: Твои братья
  rationale: ἀδελφοί в данном повествовательном контексте обозначает братьев Иисуса; «братья» сохраняет форму и не навязывает решения более широкого вопроса об их точной родственной связи.
- source_word: ἔξω ἑστήκασιν
  choice: стоят снаружи
  rationale: Перфект ἵστημι выражает наличное состояние — они заняли место и теперь стоят; ἔξω явно сохранено как «снаружи».
- source_word: ζητοῦντές σοι λαλῆσαι
  choice: хотят поговорить с Тобой
  rationale: В данном контексте ζητέω с инфинитивом естественно выражает намерение или желание. «Поговорить с Тобой» передаёт личное обращение современным литературным русским языком без добавления содержания разговора.
theological_decisions:
- issue: Текстологический статус Матфея 12:47
  choice: Стих включён в основной текст по предоставленному SBLGNT, а разночтение отмечено сноской.
  alternative: Опустить стих, поскольку он отсутствует в некоторых рукописях.
  rationale: Предоставленный греческий источник содержит стих, хотя отмечает его текстологическую неустойчивость. Включение со сноской сохраняет исходные данные и не скрывает значимое разночтение.
- issue: Значение οἱ ἀδελφοί применительно к семье Иисуса
  choice: «Твои братья» без уточнения характера родства.
  alternative: «Твои родственники» или толковательное уточнение степени родства.
  rationale: Греческое слово естественно переводится как «братья», но сам стих не определяет точную биологическую или иную семейную связь; перевод не должен разрешать этот богословски спорный вопрос.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской традиции. Формулировка избегает архаизмов и конфессионально обусловленных уточнений.
