id: MAT.12.2
reference: Matthew 12:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ· Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/002.yaml
  text: But when the Pharisees saw it[a], they said to him, “Look, your disciples are doing what is not lawful to do on the Sabbath.”
translation:
  language: ru
  text: 'Фарисеи же, увидев это, сказали Ему: «Вот, Твои ученики делают то, чего нельзя делать в субботу[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что не разрешено делать в субботу».'
    reason: Лексическая альтернатива для οὐκ ἔξεστιν, подчёркивающая значение дозволенности.
lexical_decisions:
- source_word: δὲ
  choice: же
  rationale: Постпозитивное «же» естественно передаёт контраст с предшествующим повествованием, не усиливая его сверх меры.
- source_word: ἰδόντες
  choice: увидев это
  rationale: Аористное причастие передано деепричастием; «это» естественно восполняет подразумеваемый объект — действия учеников.
- source_word: εἶπαν αὐτῷ
  choice: сказали Ему
  rationale: Нейтральная и прямая передача обычной формулы речи.
- source_word: Ἰδοὺ
  choice: Смотри
  rationale: Современное побуждение обратить внимание, сохраняющее указательную и обвинительную силу междометия без архаического оттенка.
- source_word: μαθηταί
  choice: ученики
  rationale: Устоявшийся и точный евангельский термин, сохраняющий отношение между учителем и учениками.
- source_word: ποιοῦσιν ... ποιεῖν
  choice: делают ... делать
  rationale: Повтор глагола ποιέω сохранён там, где это остаётся естественным по-русски.
- source_word: ὃ οὐκ ἔξεστιν
  choice: то, чего нельзя
  rationale: Передаёт значение отсутствия позволения и сохраняет неопределённость относительно того, идёт ли речь о прямом предписании Закона или о принятом толковании.
- source_word: ἐν σαββάτῳ
  choice: в субботу
  rationale: Естественное русское обозначение времени действия и соблюдаемого субботнего дня.
theological_decisions:
- issue: Характер возражения фарисеев
  choice: «чего нельзя делать» — формулировка в категории дозволенности без уточнения источника запрета
  alternative: «что не разрешено делать»; «что противозаконно делать»
  rationale: Стих сообщает обвинение, но сам по себе не определяет, основано ли оно непосредственно на Писании или на толковательной традиции; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельского повествования. Местоимения, относящиеся к Иисусу, написаны с прописной буквы по распространённой русской библейской издательской традиции; синтаксис краток и близок к структуре греческого текста.
