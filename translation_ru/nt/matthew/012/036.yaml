base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/036.yaml
  text: But I tell you that for every careless word that people speak[b][a], they will give an account on the day of judgment.
translation:
  language: ru
  text: 'Но говорю вам: за каждое праздное[a] слово, которое скажут люди, они дадут отчёт в день суда.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бесполезное», «пустое» или «необдуманное». Греческое слово может обозначать нечто бездейственное, бесплодное или произнесённое без должной ответственности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Но говорю вам
  rationale: Настоящее время и прямое обращение переданы естественно; δέ здесь слегка противопоставляет это предупреждение предшествующим словам.
- source_word: πᾶν ῥῆμα
  choice: всякое ... слово
  rationale: Единственное число с πᾶν имеет распределительное значение «всякое»; ῥῆμα обозначает произнесённое слово или высказывание.
- source_word: ἀργὸν
  choice: праздное
  rationale: Прилагательное означает «бездейственное, бесполезное, праздное». Русское «праздное слово» сохраняет образ речи, не приносящей доброго плода, и допускает подразумеваемую в контексте нравственную безответственность.
- source_word: ὃ λαλήσουσιν οἱ ἄνθρωποι
  choice: которое скажут люди
  rationale: Будущее время сохранено, а οἱ ἄνθρωποι передано родовым и гендерно нейтральным словом «люди».
- source_word: ἀποδώσουσιν περὶ αὐτοῦ λόγον
  choice: они дадут ответ
  rationale: Греческое сочетание обозначает необходимость отчитаться за сказанное. Русский оборот «дать ответ» естественен и сохраняет судебный оттенок; связь с каждым словом ясно выражена начальным оборотом «за всякое ... слово».
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: в день суда
  rationale: Устойчивое и точное обозначение времени окончательного судебного разбирательства; κρίσις передано как «суд».
theological_decisions:
- issue: Нравственный смысл ἀργόν
  choice: праздное
  alternative: необдуманное; бесполезное; пустое
  rationale: Перевод не ограничивает предупреждение только случайной оговоркой или только злонамеренной речью. Он сохраняет более широкий образ слов, которые бездейственны, бесплодны или произносятся без должной ответственности.
- issue: Характер ответственности в выражении ἀποδώσουσιν ... λόγον
  choice: дадут ответ
  alternative: дадут отчёт за него
  rationale: Формулировка сохраняет личную ответственность перед судом, не уточняя сверх текста ни меру вины, ни исход суда.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным судебным звучанием. Традиционно понятное выражение «праздное слово» сопровождено пояснением, чтобы сохранить широту греческого ἀργός.
