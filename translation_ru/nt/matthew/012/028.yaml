  text: εἰ δὲ ἐν πνεύματι θεοῦ ἐγὼ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/028.yaml
  text: But if I cast out the demons by the Spirit of God[b][a], then the kingdom of God has come upon you.
translation:
  language: ru
  text: Но если Я изгоняю бесов Духом Божьим[a], значит, Царство Божье достигло вас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Духе Божьем». Греческое выражение допускает оба понимания; в тексте оно передано как указание на средство или действующее посредство.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пришло к вам», «настигло вас». Греческий глагол подчёркивает, что Царство Божье достигло слушателей и явило себя в делах Иисуса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Но если
  rationale: Передаёт условие и лёгкое противопоставление, выраженное δέ, естественным современным русским оборотом.
- source_word: ἐν πνεύματι θεοῦ
  choice: Духом Божьим
  rationale: Творительный падеж естественно выражает средство или действующее посредство; вариант «в Духе Божьем» сохраняется в сноске ввиду допустимой неоднозначности ἐν с дательным.
- source_word: ἐγὼ
  choice: Я
  rationale: Отдельное греческое местоимение имеет смысловое ударение; прописная буква соответствует принятому русскому оформлению местоимений, относящихся к Иисусу, без добавления отдельного усилителя.
- source_word: ἐκβάλλω
  choice: изгоняю
  rationale: Обычный, ясный и стилистически достойный русский эквивалент в контексте изгнания бесов.
- source_word: τὰ δαιμόνια
  choice: бесов
  rationale: «Бесы» — традиционный и по-прежнему понятный русский эквивалент δαιμόνια; определённость греческого артикля здесь не требует отдельного выражения.
- source_word: ἄρα
  choice: значит
  rationale: Естественно обозначает логический вывод из условия.
- source_word: ἔφθασεν
  choice: уже достигло
  rationale: Передаёт достижение или прибытие к адресатам и настоящую результативность аориста; «уже» раскрывает заложенный в φθάνω оттенок фактического наступления, не сводя его к одной лишь близости.
- source_word: ἐφ’ ὑμᾶς
  choice: вас
  rationale: При глаголе «достигло» винительный без предлога естественно передаёт ἐπί с винительным и сохраняет образ Царства, дошедшего до слушателей.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Царство Божье
  rationale: Устоявшееся и понятное выражение, сохраняющее как царственное правление Бога, так и образ Его Царства.
theological_decisions:
- issue: Значение прихода Царства Божьего в связи с изгнанием бесов
  choice: Изгнание бесов Духом служит свидетельством того, что Царство Божье уже реально достигло слушателей Иисуса.
  alternative: Царство лишь приблизилось либо речь относится исключительно к будущему завершению.
  rationale: ἔφθασεν обозначает достижение или прибытие, а ход рассуждения связывает нынешние дела Иисуса с уже совершающимся вторжением Божьего царствования, не отрицая его будущей полноты.
- issue: Характер выражения «Дух Божий»
  choice: Сохранена личная отсылка к Духу Божьему как действующему посредством Иисуса.
  alternative: Безличная божественная сила.
  rationale: πνεύματι θεοῦ в данном контексте естественно обозначает Духа Божьего; написание с прописной буквы передаёт этот референт без добавления к тексту особого догматического пояснения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис краткий и аргументативный. «Бесов» выбрано как общеупотребительное библейское слово; «уже достигло вас» сохраняет силу греческого φθάνω и несколько необычный, намеренно яркий образ.
