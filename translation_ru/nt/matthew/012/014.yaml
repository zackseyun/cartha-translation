  text: ⸂ἐξελθόντες δὲ οἱ Φαρισαῖοι συμβούλιον ἔλαβον κατ’ αὐτοῦ⸃ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/014.yaml
  text: But the Pharisees went out and conspired against him, how they might destroy him.
translation:
  language: ru
  text: Но фарисеи, выйдя, стали совещаться против Него о том, как бы погубить Его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «убить Его», «предать Его смерти». Здесь греческий глагол может означать «погубить» или «убить»; в данном контексте он может подразумевать намерение убить.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: выйдя
  rationale: Аористное причастие передаёт действие, предшествующее совещанию; русское деепричастие естественно сохраняет последовательность.
- source_word: δὲ
  choice: но
  rationale: Передаёт повествовательный поворот и контраст между поступком Иисуса и враждебной реакцией фарисеев.
- source_word: οἱ Φαρισαῖοι
  choice: фарисеи
  rationale: Общепринятое русское наименование данной иудейской религиозной группы.
- source_word: συμβούλιον ἔλαβον
  choice: стали совещаться
  rationale: Естественно передаёт идиому «держать совет» и намеренное совместное обсуждение; враждебность ясно выражена последующими словами, поэтому не вводится более узкое «сговорились».
- source_word: κατ’ αὐτοῦ
  choice: против Него
  rationale: Предлог κατά с родительным падежом имеет здесь враждебное, направленное против Иисуса значение.
- source_word: ὅπως
  choice: как бы
  rationale: Передаёт содержание и целевую, совещательную направленность замысла.
- source_word: ἀπολέσωσιν
  choice: погубить
  rationale: Сохраняет более широкий смысл ἀπόλλυμι и одновременно в данном контексте допускает намерение убить, не сужая его без необходимости.
theological_decisions:
- issue: Степень конкретизации ἀπολέσωσιν
  choice: погубить
  alternative: убить; предать смерти
  rationale: Контекст указывает на смертельную враждебность, однако сам греческий глагол шире прямого обозначения убийства. Основной текст сохраняет эту смысловую широту, а более конкретные варианты приводятся в примечании.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Конструкция «стали совещаться против Него» близка к греческой идиоме, но остаётся понятной; прописная буква в местоимении следует распространённой русской библейской традиции.
