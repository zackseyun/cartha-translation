  terminology: '«Фарисеи» — нормативное русское наименование. Написание «Него/Его» с прописной буквы соответствует принятому библейскому регистру. Сноску следует исправить: утверждение, что греческое слово «буквально означает “погубить”», лексически неточно; это один из возможных русских эквивалентов, тогда как ἀπόλλυμι в контексте также может означать «убить» или «предать смерти».'
