  verdict: revise
  source_fidelity: «Выйдя» точно передаёт аористное причастие ἐξελθόντες, «но» уместно отражает δέ, а «против Него» сохраняет враждебную направленность κατ’ αὐτοῦ. «Погубить» является допустимым широким соответствием ἀπολέσωσιν и не преждевременно сужает его до прямого «убить». Однако «стали совещаться» несколько смещает завершённое συμβούλιον ἔλαβον («приняли совет / составили замысел») к началу процесса; в данном кратком повествовательном контексте это всё же приемлемо, но конструкцию следует сделать синтаксически яснее.
