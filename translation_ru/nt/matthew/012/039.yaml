  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/039.yaml
  text: But he answered and said to them[a], “An evil and adulterous generation seeks a sign[b], and no sign will be given to it except the sign of Jonah the prophet.”
translation:
  language: ru
  text: 'Но Он сказал им в ответ: «Злое и прелюбодейное[a] поколение ищет знамения, и знамение не будет дано ему, кроме знамения пророка Ионы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Прелюбодейное» может указывать не только на половую безнравственность, но и на неверность Богу и завету — в соответствии с пророческим образом духовного прелюбодеяния.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: сказал им в ответ
  rationale: Оборот сохраняет оба элемента греческой повествовательной формулы и при этом звучит естественно по-русски.
- source_word: Γενεὰ
  choice: поколение
  rationale: Слово обозначает современную Иисусу совокупность людей, получающую общую нравственную характеристику; «поколение» сохраняет собирательный смысл.
- source_word: πονηρὰ
  choice: злое
  rationale: Прямое и понятное обозначение нравственной испорченности без излишнего усиления.
- source_word: μοιχαλὶς
  choice: прелюбодейное
  rationale: Выбор сохраняет резкий образ прелюбодеяния и его возможный пророческий смысл — неверность завету, не сводя выражение только к толкованию «неверное».
- source_word: σημεῖον
  choice: знамение
  rationale: «Знамение» передаёт широкий смысл подтверждающего знака и не добавляет отсутствующего в греческом тексте определения «чудесное».
- source_word: ἐπιζητεῖ
  choice: ищет
  rationale: Прямой русский эквивалент; возможный оттенок настойчивого требования достаточно раскрывается контекстом и не требует усиления в основном тексте.
- source_word: δοθήσεται
  choice: не будет дано
  rationale: Точно передаёт будущее время и страдательный залог.
- source_word: αὐτῇ
  choice: ему
  rationale: Местоимение отсылает к слову «поколение» и естественно согласуется с ним в русском среднем роде.
- source_word: εἰ μὴ
  choice: кроме
  rationale: В отрицательной конструкции естественно выражает единственное исключение.
- source_word: τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου
  choice: знамения Ионы-пророка
  rationale: Сохраняет греческую последовательность имени и определения, оставляя содержание знамения неразъяснённым до последующего контекста.
theological_decisions:
- issue: Смысл определения «прелюбодейное»
  choice: Сохранить в основном тексте образное слово «прелюбодейное».
  alternative: «неверное»
  rationale: Греческое слово допускает связь как с буквальной половой безнравственностью, так и с пророческим образом неверности Богу и завету. Перевод не должен устранять эту смысловую напряжённость.
- issue: Природа «знамения Ионы»
  choice: Оставить выражение без поясняющего истолкования в основном тексте.
  alternative: «знамение, подобное пережитому Ионой»; «знамение, которым был сам Иона»
  rationale: Данный стих лишь вводит выражение, подробнее раскрываемое ближайшим контекстом; добавление конкретного толкования было бы преждевременным.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-библейским регистром. Местоимение «Он» написано с прописной буквы как традиционное указание на Иисуса. Синтаксис остаётся близким к греческому, но не воспроизводит его механически.
