id: MAT.12.42
reference: Matthew 12:42
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτήν· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/042.yaml
  text: The queen of the South will rise up in the judgment with this generation and will condemn it[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: ru
  text: Царица Юга[a] восстанет на суде вместе с этим поколением и осудит его, потому что она пришла от краёв земли послушать мудрость Соломона. И вот, здесь — нечто большее, чем Соломон[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имеется в виду царица Савская (3 Царств 10:1–13; 2 Паралипоменон 9:1–12), хотя Сава в греческом тексте прямо не упоминается.
    reason: cross_reference
  - marker: b
    text: 'Или: «здесь Тот, кто больше Соломона». В греческом употреблена форма среднего рода — буквально «нечто большее»; она может подчёркивать превосходящее величие, явленное в Иисусе и его служении.'
    reason: alternative_reading
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: Царица Юга
  rationale: Передаёт конструкцию с родительным падежом буквально и естественно. Уточнение «Савская» оставлено для примечания, поскольку в греческом тексте Савá прямо не названа.
- source_word: ἐγερθήσεται
  choice: восстанет
  rationale: Форма допускает оттенки «будет воскрешена» и «поднимется». «Восстанет» сохраняет связь как с воскресением, так и с выступлением на суде, не уточняя механизм.
- source_word: ἐν τῇ κρίσει
  choice: на суде
  rationale: Естественное русское выражение для определённого эсхатологического суда.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: вместе с этим поколением
  rationale: Сохраняет обычное значение μετά с родительным падежом — «с, вместе с», тогда как противопоставление выражено последующим глаголом «осудит».
- source_word: κατακρινεῖ αὐτήν
  choice: осудит его
  rationale: Глагол означает вынести осуждающий приговор; местоимение отнесено к слову «поколение».
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: от краёв земли
  rationale: Сохраняет образ чрезвычайно далёкого пути и звучит естественно по-русски.
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: послушать мудрость Соломона
  rationale: 'Инфинитив передаёт цель прихода. «Послушать мудрость» сохраняет метонимическую форму оригинала: речь о мудрых словах Соломона.'
- source_word: ἰδοὺ
  choice: И вот
  rationale: Передаёт торжественный указательный маркер, привлекающий внимание к следующему утверждению.
- source_word: πλεῖον Σολομῶνος
  choice: нечто большее, чем Соломон
  rationale: Средний род πλεῖον сохранён посредством «нечто большее», чтобы не сводить выражение только к мужскому личному обозначению и сохранить широту утверждения.
- source_word: ὧδε
  choice: здесь
  rationale: Прямое и естественное соответствие указанию на присутствующую здесь реальность.
theological_decisions:
- issue: Как передать средний род πλεῖον применительно к Иисусу
  choice: нечто большее, чем Соломон
  alternative: Тот, кто больше Соломона
  rationale: Греческая форма среднего рода может указывать не только на личность, но и на превосходящую Соломона реальность, присутствующую в Иисусе и его служении. Основной текст сохраняет эту грамматическую и богословскую напряжённость; личное прочтение отмечено в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Синтаксис близок к греческому, при этом фразы остаются естественными для обычного читателя.
