source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Τίς ⸀ἔσται ἐξ ὑμῶν ἄνθρωπος ὃς ἕξει πρόβατον ἕν, καὶ ἐὰν ἐμπέσῃ τοῦτο τοῖς σάββασιν εἰς βόθυνον, οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/011.yaml
  text: But he said to them[a], “Which man among you, if he has one sheep and it falls into a pit on the Sabbath[b], will not take hold of it and lift it out?”
translation:
  language: ru
  text: 'Он же сказал им: «Кто из вас, если у него есть одна овца и она в субботу упадёт в яму, не ухватит её и не вытащит?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίς ἔσται ἐξ ὑμῶν ἄνθρωπος
  choice: Кто из вас
  rationale: Естественно передаёт греческий риторический вопрос в современном русском языке; отдельное «человек» здесь было бы тяжеловесным, а мужской род сохраняется формами «имея» и подразумеваемого действующего лица.
- source_word: ἕξει πρόβατον ἕν
  choice: имея одну овцу
  rationale: Причастная конструкция естественно передаёт условную ситуацию; «одну» сохраняет явное числительное ἕν.
- source_word: ἐὰν ἐμπέσῃ τοῦτο
  choice: если она ... упадёт
  rationale: Передаёт реальное предполагаемое условие; местоимение согласовано с русским словом «овца».
- source_word: τοῖς σάββασιν
  choice: в субботу
  rationale: Греческое множественное число является идиоматическим обозначением дня субботы; русский единственный вариант звучит естественно в контексте спора о субботе.
- source_word: εἰς βόθυνον
  choice: в яму
  rationale: «Яма» — широкое и точное соответствие βόθυνος без необоснованного уточнения вида углубления.
- source_word: οὐχὶ κρατήσει αὐτὸ
  choice: не возьмёт её
  rationale: Отрицательная форма вопроса сохраняет ожидание утвердительного ответа; «возьмёт» в данном контексте естественно обозначает, что человек ухватит овцу.
- source_word: καὶ ἐγερεῖ
  choice: и не вытащит
  rationale: Контекстуально передаёт поднятие овцы из ямы; направление наружу ясно подразумевается образом ямы и естественно выражается русским глаголом.
theological_decisions:
- issue: Репрезентативная форма мужского рода
  choice: Кто из вас, имея
  alternative: Какой человек из вас
  rationale: Русская конструкция не устраняет предполагаемого единичного владельца-мужчину, но избегает неестественного буквального воспроизведения ἄνθρωπος.
- issue: Число в τοῖς σάββασιν
  choice: в субботу
  alternative: по субботам
  rationale: В данном единичном условном случае идиоматический греческий плюраль обозначает субботний день; «по субботам» могло бы ошибочно придать высказыванию повторительный смысл.
- issue: Значение ἐγερεῖ
  choice: вытащит
  alternative: поднимет
  rationale: Перевод делает явным подразумеваемое извлечение из ямы, не привнося богословски нагруженного смысла «воскресит».
translation_notes:
  register: Современный литературный русский язык; речь ясная, достойная и естественная. Риторический вопрос и ожидаемый утвердительный ответ сохранены. Союз «же» передаёт δὲ и связь с предшествующим спором.
