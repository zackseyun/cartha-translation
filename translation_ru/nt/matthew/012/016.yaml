lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой повествовательный союз, продолжающий предыдущее действие без добавления причинного или временного оттенка.
- source_word: ἐπετίμησεν
  choice: строго велел
  rationale: Глагол обозначает резкое предостережение или строгое распоряжение. В данном контексте последующее ἵνα μή раскрывает содержание запрета; сочетание «строго велел» естественно передаёт его силу, не предполагая непременно нравственного порицания адресатов.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж местоимения во множественном числе указывает на людей, к которым обращён запрет.
- source_word: ἵνα μὴ
  choice: не
  rationale: После глагола распоряжения конструкция вводит содержание запрета; по-русски естественно передаётся инфинитивом с «не».
- source_word: φανερὸν αὐτὸν ποιήσωσιν
  choice: не разглашать о Нём
  rationale: Оборот φανερὸν ποιέω означает сделать явным, известным или публичным. «Разглашать о Нём» естественно выражает запрет предавать огласке сведения об Иисусе, сохраняя личный объект αὐτόν.
theological_decisions:
- issue: Характер запрета Иисуса на огласку
  choice: Строгое распоряжение не предавать огласке сведения о Нём
  alternative: Предостережение или порицание адресатов
  rationale: Греческий текст ясно выражает настойчивый запрет, но не объясняет его богословскую причину. Перевод не добавляет мотивов и не представляет действие как нравственное порицание тех, к кому обращены слова.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. «Строго велел» передаёт силу ἐπετίμησεν, а «разглашать о Нём» — публичный характер φανερὸν ποιέω. Местоимение «Нём» написано с прописной буквы согласно распространённой русской библейской издательской традиции.
