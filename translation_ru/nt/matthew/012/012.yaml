  terminology: «Человек» верно передаёт обобщающее ἄνθρωπος без неоправданной гендерной конкретизации. «Ценнее» точно отражает контекстуальный смысл διαφέρει. «Делать добро» является естественным и близким соответствием καλῶς ποιεῖν. Конфессионально обусловленных добавлений нет.
