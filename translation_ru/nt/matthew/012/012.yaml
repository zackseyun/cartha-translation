id: MAT.12.12
reference: Matthew 12:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πόσῳ οὖν διαφέρει ἄνθρωπος προβάτου. ὥστε ἔξεστιν τοῖς σάββασιν καλῶς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/012.yaml
  text: How much more valuable[a], then, is a man than a sheep! So it is lawful to do good on the Sabbaths.
translation:
  language: ru
  text: Насколько же человек ценнее овцы! Поэтому по субботам разрешается делать добро.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόσῳ οὖν διαφέρει
  choice: Насколько же … ценнее
  rationale: 'Сочетание выражает риторическое сравнение с подразумеваемой оценкой: человек превосходит овцу по ценности. «Же» естественно передаёт выводное οὖν в русском вопросительно-восклицательном обороте.'
- source_word: ἄνθρωπος
  choice: человек
  rationale: В данном обобщающем сопоставлении с овцой слово обозначает человека как представителя человеческого рода; современное русское «человек» точно и естественно сохраняет это значение.
- source_word: ὥστε
  choice: Поэтому
  rationale: Передаёт вывод, следующий из сопоставления ценности человека и овцы.
- source_word: ἔξεστιν
  choice: разрешается
  rationale: Сохраняет правовой оттенок допустимости в споре о соблюдении субботы и звучит естественнее, чем более тяжеловесное «законно».
- source_word: τοῖς σάββασιν
  choice: по субботам
  rationale: Русский оборот во множественном числе естественно передаёт греческий идиоматический дательный множественного числа и относится к соблюдению субботы вообще.
- source_word: καλῶς ποιεῖν
  choice: делать добро
  rationale: Прямо и естественно передаёт устойчивое выражение о благом, благотворном поступке.
theological_decisions:
- issue: Характер разрешённого действия в субботу
  choice: делать добро
  alternative: делать то, что хорошо
  rationale: Формулировка сохраняет общий нравственный принцип и не сужает его до одного конкретного вида помощи.
- issue: Передача множественного числа σάββασιν
  choice: по субботам
  alternative: в субботу
  rationale: Русское множественное число одновременно естественно для общего правила и прозрачно отражает форму греческого текста, не вводя дополнительного толкования.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, ясная и достойная по тону. Восклицательный знак передаёт риторическую силу первой части. Архаизмы и конфессионально окрашенные формулы не используются.
