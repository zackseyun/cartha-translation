  source_fidelity: 'Текст точно передаёт аргумент от меньшего к большему: πόσῳ οὖν διαφέρει выражено как «Насколько же … ценнее», сравнительный генитив προβάτου — «овцы», а вывод ὥστε ἔξεστιν … καλῶς ποιεῖν — «Поэтому … разрешается делать добро». «По субботам» естественно передаёт общий/идиоматический характер греческого τοῖς σάββασιν, не создавая ложной привязки к одной конкретной субботе.'
