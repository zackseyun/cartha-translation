id: MAT.12.29
reference: Matthew 12:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἢ πῶς δύναταί τις εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ καὶ τὰ σκεύη αὐτοῦ ⸀ἁρπάσαι, ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν; καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/029.yaml
  text: Or how can someone enter the strong man's house and seize his goods[b][a], unless he first binds the strong man? And then he will plunder his house.
translation:
  language: ru
  text: Или как может кто-нибудь войти в дом сильного человека и захватить его имущество[a], если прежде не свяжет[b] сильного? И тогда он разграбит его дом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его пожитки»; греческое слово может обозначать сосуды, утварь, вещи или имущество в целом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не скрутит».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Или
  rationale: Сохраняет связь с предшествующим рассуждением и вводит альтернативный поясняющий образ.
- source_word: πῶς δύναταί τις
  choice: как может кто-нибудь
  rationale: Естественно передаёт риторический вопрос, модальность и неопределённость действующего лица.
- source_word: εἰσελθεῖν εἰς τὴν οἰκίαν
  choice: войти в дом
  rationale: Прямой и естественный перевод инфинитивной конструкции.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: сильного человека / сильного
  rationale: Субстантивированное прилагательное передано конкретным образом человека; при повторе опущено существительное во избежание тяжеловесности без утраты смысла.
- source_word: τὰ σκεύη αὐτοῦ
  choice: его имущество
  rationale: В контексте ограбления дома слово обозначает совокупность вещей или пожитков, а не только сосуды и утварь.
- source_word: ἁρπάσαι
  choice: захватить
  rationale: Передаёт насильственное завладение, сохраняя отличие от более полного разграбления, выраженного далее глаголом διαρπάσει.
- source_word: ἐὰν μὴ πρῶτον δήσῃ
  choice: если прежде не свяжет
  rationale: Сохраняет условие, временную последовательность и буквальный образ связывания.
- source_word: καὶ τότε
  choice: И тогда
  rationale: Передаёт соединительный элемент и последовательность действий.
- source_word: διαρπάσει
  choice: разграбит
  rationale: 'Отражает усиленное значение глагола: после обезвреживания хозяина грабитель опустошает дом.'
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: его дом
  rationale: Сохраняет конкретный образ дома, не подменяя его аллегорическим толкованием.
theological_decisions:
- issue: Мужской образ в сравнении
  choice: сильного человека
  alternative: сильного
  rationale: Конкретный мужской образ исходного текста сохранён, тогда как неопределённое τις естественно передано как «кто-нибудь».
- issue: Аллегорический смысл дома и имущества
  choice: Сохранить конкретный образ ограбления дома
  alternative: Передать толковательно как владение, царство или сферу власти
  rationale: Контекст допускает богословское применение к власти над демоническими силами, однако сам стих формулирует сравнение и не раскрывает его элементы внутри предложения.
translation_notes:
  register: Современный литературный русский язык с ясной, но достойной формулировкой. Риторическая структура и конкретный образ ограбления сохранены; «имущество» выбрано как наиболее естественное широкое соответствие в данном контексте.
