source:
  edition: SBLGNT
  text: εἰ δὲ ἐγνώκειτε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν, οὐκ ἂν κατεδικάσατε τοὺς ἀναιτίους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/007.yaml
  text: But if you had known what this means[b][a], ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.
translation:
  language: ru
  text: 'Но если бы вы знали, что значат эти слова: «Милости хочу, а не жертвы»[a], то не осудили бы невиновных[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Иисус цитирует Осию 6:6.
    reason: cross_reference
  - marker: b
    text: 'Или: «тех, кто не виноват».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκειτε
  choice: понимали
  rationale: В нереальном условии речь идёт не просто о знании текста, а о понимании его смысла; русская конструкция «если бы вы понимали… то не осудили бы» естественно передаёт контрфактический оттенок.
- source_word: τί ἐστιν
  choice: что значат слова
  rationale: Вводит смысл цитируемого места Писания; добавление «слова» делает русскую фразу ясной, не меняя содержания.
- source_word: ἔλεος
  choice: милости
  rationale: «Милость» точно и традиционно передаёт ἔλεος, сохраняя широту понятия — сострадание и милосердное отношение.
- source_word: θέλω
  choice: хочу
  rationale: Прямое и естественное соответствие θέλω; в составе библейской цитаты сохраняет краткость и силу противопоставления.
- source_word: θυσίαν
  choice: жертвы
  rationale: Точно передаёт единственное число θυσίαν и сохраняет культовый смысл.
- source_word: κατεδικάσατε
  choice: не осудили бы
  rationale: Передаёт судебную силу глагола и вместе с условной конструкцией выражает нереальное следствие в прошлом.
- source_word: ἀναιτίους
  choice: невиновных
  rationale: Естественное современное русское обозначение тех, на ком нет вины; хорошо сочетается с судебным глаголом «осудили».
theological_decisions:
- issue: Пророческое противопоставление милости и жертвы в цитате из Осии 6:6
  choice: «Милости хочу, а не жертвы»
  alternative: «Милосердия хочу, а не жертвы»
  rationale: Формулировка сохраняет резкое противопоставление греческого текста и приоритет милости, не превращая его в добавленное переводчиком утверждение о безусловной отмене жертвоприношений.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан естественным для русского; цитата сохраняет лаконичную пророческую форму.
