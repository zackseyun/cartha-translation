  text: καὶ ἐξίσταντο πάντες οἱ ὄχλοι καὶ ἔλεγον· Μήτι οὗτός ἐστιν ὁ υἱὸς Δαυίδ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/023.yaml
  text: And all the crowds were astonished and said[b][a], “Can this be the Son of David?”
translation:
  language: ru
  text: 'И весь народ изумлялся и говорил: «Неужели это Сын Давида?»[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Сын Давида» — мессианский титул, указывающий на обещанного царя-избавителя из рода Давида.
    reason: cross_reference
  - marker: b
    text: 'Или, с более буквальной передачей направленности вопроса: «Ведь это не Сын Давида?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: изумлялся
  rationale: Глагол передаёт сильное, продолжавшееся изумление в ответ на совершённое Иисусом исцеление; «изумлялся» естественно и выразительно звучит в современном русском.
- source_word: πάντες οἱ ὄχλοι
  choice: весь народ
  rationale: Хотя греческое ὄχλοι имеет форму множественного числа, сочетание πάντες οἱ ὄχλοι идиоматично обозначает всех собравшихся людей; буквальное «все толпы» в русском звучало бы неестественно.
- source_word: ἔλεγον
  choice: говорил
  rationale: Имперфект допускает значение продолжавшейся или повторявшейся речи. Собирательное «народ… говорил» естественно передаёт общую реакцию собравшихся.
- source_word: Μήτι
  choice: Неужели это
  rationale: Частица обычно вводит вопрос с ожиданием отрицательного ответа, но здесь выражает поражённое и нерешительное предположение. «Неужели» сохраняет эту неоднозначность, не превращая вопрос ни в уверенное признание, ни в категорическое отрицание.
- source_word: ὁ υἱὸς Δαυίδ
  choice: Сын Давида
  rationale: Сохранена буквальная форма мессианского титула, значимого в повествовании Матфея; она не заменена толкованием «Мессия».
theological_decisions:
- issue: Мессианский смысл выражения «Сын Давида»
  choice: Сохранить титул «Сын Давида» в основном тексте.
  alternative: «Мессия» или «обещанный наследник Давида»
  rationale: Греческий текст употребляет сам исторически и богословски насыщенный титул. Перевод не должен заранее раскрывать его посредством толкующего парафраза.
- issue: Направленность вопроса с Μήτι
  choice: Передать нерешительное предположение словом «неужели».
  alternative: «Ведь это не Сын Давида?»
  rationale: Форма вопроса предполагает склонность к отрицательному ответу, однако контекст допускает искреннее удивлённое предположение. Основной текст сохраняет напряжение, а примечание поясняет более буквальную силу частицы.
translation_notes:
  register: Современный литературный русский язык с естественным повествовательным ритмом. Собирательное «весь народ» предпочтено неидиоматичному «все толпы»; обращение к мессианскому титулу оформлено с прописной буквы.
