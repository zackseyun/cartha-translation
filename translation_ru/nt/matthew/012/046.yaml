  terminology: «Мать и братья» верно передаёт ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ. Сноска уместно отмечает более широкое возможное значение ἀδελφοί, не разрешая богословский вопрос о точной степени родства.
