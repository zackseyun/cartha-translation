  text: While he was still speaking to the crowds[a], behold, his mother and his brothers were standing outside, seeking to speak to him.
translation:
  language: ru
  text: Пока Он ещё говорил народу, вот, Его мать и братья[a] стояли снаружи, стремясь поговорить с Ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «близкие родственники», если понимать греческое слово ἀδελφοί шире; оно стоит здесь во множественном числе мужского рода, поэтому в основном тексте переведено как «братья».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ αὐτοῦ λαλοῦντος
  choice: Пока Он ещё говорил
  rationale: Оборот передаёт одновременность продолжающегося действия; δέ служит мягким повествовательным переходом и отдельно не выражено, чтобы не утяжелять русскую фразу.
- source_word: τοῖς ὄχλοις
  choice: с народом
  rationale: Хотя в греческом стоит множественное число, в современном русском собирательное «народ» естественно обозначает собравшихся слушателей; буквальное «с толпами» здесь звучало бы неестественно.
- source_word: ἰδοὺ
  choice: вот
  rationale: «Вот» сохраняет функцию указательного повествовательного маркера, привлекающего внимание к новому событию.
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: Его мать и братья
  rationale: Притяжательное местоимение естественно относится к обоим однородным членам. ἀδελφοί передано гендерно точно как «братья», без решения вопроса об их более точном родстве с Иисусом.
- source_word: εἱστήκεισαν ἔξω
  choice: стояли снаружи
  rationale: Форма ἵστημι описывает продолжающееся положение; «снаружи» не добавляет прямо не названного в стихе здания.
- source_word: ζητοῦντες αὐτῷ λαλῆσαι
  choice: желая поговорить с Ним
  rationale: В сочетании с инфинитивом ζητέω выражает намерение добиться разговора; «желая поговорить» звучит естественно и не вводит предположения о многократных безуспешных попытках.
theological_decisions:
- issue: Значение ἀδελφοί применительно к семье Иисуса
  choice: братья
  alternative: близкие родственники; братья и сёстры
  rationale: Форма ἀδελφοί — мужской род, множественное число, и на поверхности текста естественно означает «братья». Перевод не разрешает последующие богословские споры о точной степени родства этих людей с Иисусом.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным библейским звучанием. Местоимения, относящиеся к Иисусу, написаны с прописной буквы. Синтаксис сохраняет развитие греческого повествования, но избегает неестественной буквальности.
