  text: γεννήματα ἐχιδνῶν, πῶς δύνασθε ἀγαθὰ λαλεῖν πονηροὶ ὄντες; ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας τὸ στόμα λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/034.yaml
  text: Offspring of vipers[b][a], how can you speak good things when you are evil? For out of the overflow of the heart the mouth speaks.
translation:
  language: ru
  text: Порождения ехидн! Как вы можете говорить доброе, когда сами злы? Ведь от избытка сердца говорят уста.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь уста говорят из того, чем переполнено сердце».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεννήματα ἐχιδνῶν
  choice: Порождения ехидн
  rationale: «Порождения» передаёт значение того, что рождено или произведено, а «ехидн» сохраняет резкую метафору происхождения и характера. Выражение звучит возвышенно, но понятно современному читателю.
- source_word: πῶς δύνασθε
  choice: Как вы можете
  rationale: Естественная русская форма риторического вопроса, выражающего нравственную неспособность или вопиющее несоответствие.
- source_word: ἀγαθὰ λαλεῖν
  choice: говорить доброе
  rationale: Субстантивированное ἀγαθά передано собирательным «доброе», что точно и естественно по-русски.
- source_word: πονηροὶ ὄντες
  choice: если сами злы
  rationale: «Злы» сохраняет нравственную оценку πονηροί; «если» естественно выражает обстоятельственную связь причастного оборота, а «сами» подчёркивает контраст без изменения смысла.
- source_word: ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας
  choice: Ведь от избытка сердца
  rationale: «Избыток» охватывает значения изобилия и переполненности; «сердце» сохранено как библейское обозначение внутреннего человека.
- source_word: τὸ στόμα λαλεῖ
  choice: говорят уста
  rationale: «Уста» сохраняют образ органа речи и хорошо сочетаются с единственным числом собирательного «сердца»; русское согласование во множественном числе естественно.
theological_decisions:
- issue: Метафорическое значение καρδία
  choice: Сохранить «сердце» как обозначение внутреннего человека
  alternative: внутренний мир; ум
  rationale: Греческое слово включает мысли, волю и нравственную направленность, а не только чувства; традиционный образ не следует сужать толкованием.
- issue: Нравственная характеристика πονηροί
  choice: злы
  alternative: плохи; нечестивы
  rationale: «Злы» сохраняет прямую нравственную оценку, не ослабляя её до общего «плохи» и не добавляя более узкой религиозной характеристики «нечестивы».
- issue: Связь причастия πονηροὶ ὄντες с риторическим вопросом
  choice: если сами злы
  alternative: будучи злы; раз вы злы
  rationale: Условная формулировка естественна по-русски и сохраняет риторическую силу, не превращая обстоятельственную связь в однозначно причинную.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. «Порождения ехидн» и «уста» сохраняют достоинство и резкость исходного высказывания; синтаксис остаётся доступным обычному читателю.
