lexical_decisions:
- source_word: καὶ
  choice: и
  rationale: Прямо передаёт сочинительный союз и сохраняет связь с предшествующей частью цитаты.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: на Его имя
  rationale: При глаголе ἐλπίζω дательный падеж обозначает основание надежды. Оборот «надеяться на Его имя» естественен для русского библейского стиля и сохраняет смысл имени как представляющего личность и власть, не сводя его лишь к репутации.
- source_word: ἔθνη
  choice: народы
  rationale: В контексте цитаты из Исаии слово охватывает народы за пределами Израиля. «Народы» сохраняет ветхозаветный масштаб и не сужает значение до одного этнорелигиозного обозначения.
- source_word: ἐλπιοῦσιν
  choice: будут надеяться
  rationale: Будущее время действительного залога передано прямо; «надеяться» точнее сохраняет значение ἐλπίζω и оттенок обещанного будущего, чем более истолковывающее «доверятся».
theological_decisions:
- issue: Передача ἔθνη в мессианской цитате
  choice: народы
  alternative: язычники
  rationale: «Народы» сохраняет широкий горизонт пророческой цитаты и вместе с тем включает нееврейские народы. Вариант «язычники» контекстуально возможен, поэтому отмечен в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Заглавная буква в местоимении «Его» подчёркивает референцию к Мессии согласно принятой русской издательской традиции, не добавляя нового содержания.
