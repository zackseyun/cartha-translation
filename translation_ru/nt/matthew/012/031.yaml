id: MAT.12.31
reference: Matthew 12:31
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ τοῦ πνεύματος βλασφημία οὐκ ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/031.yaml
  text: Therefore I tell you[a], every sin and blasphemy will be forgiven people[b], but blasphemy against the Spirit will not be forgiven.
translation:
  language: ru
  text: 'Поэтому говорю вам: всякий грех и всякая хула простятся людям, но хула на Духа[a] не простится.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Святого Духа». Из ближайшего контекста ясно, что речь идёт о Святом Духе, хотя в самом этом стихе по-гречески сказано просто «Духа».'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего контекста и естественно звучит в современном русском языке.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Сохраняет прямое обращение и торжественную силу распространённой речевой формулы.
- source_word: πᾶσα ἁμαρτία καὶ βλασφημία
  choice: всякий грех и всякая хула
  rationale: Повтор «всякий/всякая» естественно передаёт распределительное значение πᾶσα применительно к обоим существительным. «Хула» точно выражает речь, направленную против божественного, и позволяет сохранить лексическую связь со второй частью стиха.
- source_word: ἀφεθήσεται τοῖς ἀνθρώποις
  choice: простятся людям
  rationale: Передаёт будущее страдательное значение ἀφίημι и дательный падеж получателей прощения без ограничения слова ἄνθρωποι мужчинами.
- source_word: ἡ δὲ τοῦ πνεύματος βλασφημία
  choice: но хула на Духа
  rationale: Родительный τοῦ πνεύματος понимается как обозначение объекта хулы. Конструкция «хула на» естественна по-русски и не создаёт впечатления, будто хула исходит от Духа.
- source_word: οὐκ ἀφεθήσεται
  choice: не простится
  rationale: Сохраняет страдательную форму и прямой контраст с обещанием прощения в первой части.
theological_decisions:
- issue: Передавать πνεύματος как «Духа» или «Святого Духа»
  choice: Духа
  alternative: Святого Духа
  rationale: В греческом тексте данного стиха стоит только τοῦ πνεύματος, без ἁγίου. Из ближайшего контекста ясно, что речь идёт о Святом Духе, однако основной текст сохраняет нерасширенную формулировку источника, а явное наименование приведено в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Хула» понятна в религиозном контексте, сохраняет смысловую точность и единообразие обеих частей стиха; конструкция «простятся людям» одновременно естественна и близка к грамматике источника.
