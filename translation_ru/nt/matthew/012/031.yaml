  source_fidelity: Перевод точно передаёт логический вывод διὰ τοῦτο («Поэтому»), прямое обращение, всеохватность πᾶσα, будущее страдательное значение ἀφεθήσεται и противопоставление, вводимое δέ. «Хула на Духа» корректно выражает подразумеваемую объектную функцию родительного τοῦ πνεύματος, не превращая его в субъекта хулы. Не добавлен эпитет «Святой», которого в данном греческом тексте нет.
  naturalness: Формулировка звучит естественно в современном литературном русском с уместным умеренно библейским регистром. «Всякий грех и всякая хула простятся людям» грамматически корректно и ясно; повторение «всякий/всякая» удачно сохраняет охват обоих существительных. «Хула» является несколько возвышенным, но общеупотребительным в религиозном контексте и здесь стилистически оправданным термином.
