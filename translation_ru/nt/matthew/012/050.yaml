lexical_decisions:
- source_word: ὅστις ... ἂν
  choice: кто
  rationale: Неопределённо-относительная конструкция с ἄν выражает открытое обобщённое условие; русское «кто» естественно передаёт значение «всякий, кто».
- source_word: γὰρ
  choice: ведь
  rationale: Сохраняет пояснительную связь с предыдущими словами Иисуса и звучит естественно в современном русском.
- source_word: ποιήσῃ
  choice: исполняет
  rationale: В сочетании с «воля» глагол ποιέω естественно передаётся как «исполнять»; это точнее и менее интерпретативно, чем «повинуется».
- source_word: τὸ θέλημα
  choice: волю
  rationale: Сохраняет богословски и контекстуально значимое понятие без пересказа.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: Моего Небесного Отца
  rationale: Естественное и достойное русское соответствие, передающее указание на Отца, пребывающего на небесах, без тяжеловесной конструкции.
- source_word: αὐτός
  choice: тот
  rationale: Коррелятивная конструкция «кто… тот» естественно передаёт эмфатическое αὐτός и выделяет именно исполняющего волю Отца.
- source_word: μου
  choice: Мне
  rationale: Дательный принадлежности в русском обороте «тот Мне брат» ясно передаёт отношение к Иисусу, выраженное греческим родительным местоимением.
- source_word: ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ
  choice: и брат, и сестра, и мать
  rationale: Повтор «и» сохраняет перечисление трёх отдельных семейных ролей и его риторическую выразительность.
- source_word: ἐστίν
  choice: нулевая связка в настоящем времени
  rationale: В современном русском настоящая связка «есть» обычно опускается; смысл настоящего времени сохраняется конструкцией «тот Мне…».
theological_decisions:
- issue: Грамматически мужской род в обобщённом высказывании
  choice: кто… тот Мне и брат, и сестра, и мать
  alternative: всякий, кто… он Мне брат, сестра и мать
  rationale: Русские «кто» и коррелятивное «тот» естественно сохраняют единственное число и грамматический мужской род, не ограничивая смысл мужчинами; включённость женщин явно выражена словами «сестра» и «мать».
- issue: Образ духовного родства
  choice: сохранить буквальные семейные наименования
  alternative: тот принадлежит к Моей семье
  rationale: Греческий текст намеренно перечисляет «брата, сестру и мать»; обобщающий пересказ ослабил бы образ и риторическую силу высказывания.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. «Ведь» поддерживает связь с предыдущим контекстом; «исполняет волю» сохраняет устойчивую библейскую формулировку. Конструкция «тот Мне и брат…» естественна и подчёркивает личное родство с Иисусом.
