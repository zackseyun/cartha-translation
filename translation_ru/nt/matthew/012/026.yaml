  text: καὶ εἰ ὁ Σατανᾶς τὸν Σατανᾶν ἐκβάλλει, ἐφ’ ἑαυτὸν ἐμερίσθη· πῶς οὖν σταθήσεται ἡ βασιλεία αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/026.yaml
  text: And if Satan casts out Satan[a], he is divided against himself[c][b]. How then will his kingdom stand?
translation:
  language: ru
  text: И если Сатана изгоняет Сатану, то он разделён против самого себя. Как же тогда устоит его царство?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ εἰ
  choice: И если
  rationale: Сохраняет соединительный καί и условное εἰ, передавая ход рассуждения из предыдущего контекста.
- source_word: ὁ Σατανᾶς / τὸν Σατανᾶν
  choice: сатана
  rationale: Устоявшаяся русская передача личного имени или титула; строчная буква соответствует современной русской орфографической норме для этого наименования.
- source_word: ἐκβάλλει
  choice: изгоняет
  rationale: Естественно и точно передаёт ἐκβάλλω в контексте изгнания бесов; не требует дополнительного лексического примечания.
- source_word: ἐφ’ ἑαυτὸν
  choice: сам с собой
  rationale: В сочетании с «разделился» это естественная русская идиома, выражающая внутренний раскол и противодействие себе.
- source_word: ἐμερίσθη
  choice: разделился
  rationale: Аорист пассивной формы допускает по-русски возвратную передачу; совершенный вид выражает возникший в условной ситуации раскол, не добавляя явно названного внешнего деятеля.
- source_word: πῶς οὖν
  choice: Как же тогда
  rationale: «Как» передаёт πῶς, а сочетание «же тогда» естественно выражает выводное οὖν в риторическом вопросе.
- source_word: σταθήσεται
  choice: устоит
  rationale: Сохраняет метафору стояния и одновременно передаёт смысл продолжения существования или прочности.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: его царство
  rationale: «Царство» естественно соответствует βασιλεία в образе внутренне разделённого владения; местоимение сохраняет отсылку к сатане.
theological_decisions:
- issue: Смысл саморазделения сатаны
  choice: 'Стих передан как доведение обвинения до абсурда: если сатана изгоняет сатану, он вступает во внутренний конфликт и его царство не может устоять.'
  alternative: Можно было развернуть мысль через образ «разделившегося дома» из ближайшего контекста.
  rationale: Сам греческий текст этого стиха прямо говорит о внутреннем разделении и неустойчивости царства сатаны; перевод не добавляет отсутствующий здесь образ дома.
- issue: Залог и временной оттенок ἐμερίσθη
  choice: «разделился»
  alternative: «оказался разделён сам против себя» или «разделён сам в себе»
  rationale: Русская возвратная форма сохраняет результативность аориста и логику гипотетического утверждения, не решая сверх текста вопрос о причине разделения.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, dignified и понятная. Синтаксис сохраняет условие, вывод и риторический вопрос оригинала. Лексические варианты английского консультационного слоя не вынесены в примечания, поскольку русские «изгоняет», «разделился» и «устоит» естественно охватывают контекстуальный смысл без существенной потери подлинной неоднозначности.
