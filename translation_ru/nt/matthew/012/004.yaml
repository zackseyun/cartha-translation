  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸂ἔφαγον, ὃ⸃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν οὐδὲ τοῖς μετ’ αὐτοῦ, εἰ μὴ τοῖς ἱερεῦσιν μόνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/004.yaml
  text: how he entered into the house of God and ate the bread of the Presence[a], which it was not lawful for him to eat, nor for those with him[b], but only for the priests?
translation:
  language: ru
  text: как он вошёл в дом Божий и там они ели[a] хлебы, положенные перед Богом[b], которые по закону нельзя было есть ни ему, ни тем, кто был с ним, а только священникам?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «он ел».'
    reason: textual_variant
  - marker: b
    text: 'Традиционное название — «хлебы предложения»: освящённые хлебы, которые полагали перед Богом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: как
  rationale: Естественно вводит содержание приведённого Иисусом примера с Давидом и сохраняет вопросительную форму контекста.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: вошёл в дом Божий
  rationale: Точно и естественно передаёт движение внутрь; «дом Божий» сохраняет формулировку греческого текста, не заменяя её контекстуальным уточнением «скиния».
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: хлебы, положенные перед Богом
  rationale: Передаёт культовый смысл хлебов, полагавшихся перед Богом, и остаётся понятным современному читателю. Традиционный термин отмечен в сноске.
- source_word: ἔφαγον
  choice: они ели
  rationale: Основной текст SBLGNT имеет форму множественного числа. Местоимение «они» необходимо в русском, чтобы множественное число не было ошибочно воспринято как продолжение действий одного Давида; вариант единственного числа дан в сноске.
- source_word: ὃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν
  choice: которые по закону нельзя было есть ему
  rationale: Сочетание «по закону нельзя было» ясно передаёт не просто бытовой запрет, а законно-культовую силу ἐξὸν в данном контексте.
- source_word: οὐδὲ τοῖς μετ’ αὐτοῦ
  choice: ни тем, кто был с ним
  rationale: Близко к греческой формулировке и естественно по-русски, без излишнего уточнения личности спутников.
- source_word: εἰ μὴ τοῖς ἱερεῦσιν μόνοις
  choice: а только священникам
  rationale: Естественно передаёт исключение εἰ μή и ограничительность μόνοις.
theological_decisions:
- issue: Законно-культовый характер запрета
  choice: «по закону нельзя было есть»
  alternative: «не разрешалось есть»
  rationale: Выбранная формулировка сохраняет связь запрета с установленным священным порядком, не превращая его в простое ситуативное разрешение или запрет.
- issue: Число и субъект глагола ἔφαγον
  choice: 'Основной текст: «они ели»'
  alternative: «он ел»
  rationale: Перевод следует форме множественного числа в предоставленном тексте SBLGNT. Разночтение с единственным числом существенно для непосредственного субъекта действия и поэтому отражено в сноске.
- issue: Обозначение священных хлебов
  choice: «хлебы, положенные перед Богом»
  alternative: «хлебы предложения»
  rationale: Описательная формулировка раскрывает культовый образ без привнесения конфессиональной терминологии; традиционное название сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. «Дом Божий» сохраняет сакральный регистр оригинала; конструкция «хлебы, положенные перед Богом» предпочтена архаичному и не вполне прозрачному для обычного читателя термину «хлебы предложения».
