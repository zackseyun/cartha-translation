source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς γνοὺς ἀνεχώρησεν ἐκεῖθεν. καὶ ἠκολούθησαν ⸀αὐτῷ πολλοί, καὶ ἐθεράπευσεν αὐτοὺς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/015.yaml
  text: But Jesus[a], knowing this, withdrew from there. And many followed him, and he healed them all,
translation:
  language: ru
  text: Но Иисус, узнав об этом[a], удалился оттуда. Многие последовали за Ним, и Он исцелил их всех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте не сказано прямо, о чём узнал Иисус; это понятно из предыдущего стиха.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: узнав об этом
  rationale: Аористное причастие указывает на осведомлённость, предшествующую удалению Иисуса и побуждающую к нему. Дополнение в греческом не выражено; «об этом» естественно отсылает к замыслу фарисеев в предыдущем стихе.
- source_word: ἀνεχώρησεν
  choice: удалился
  rationale: Глагол в данном контексте обозначает намеренный уход ввиду возникшей враждебности; «удалился» сохраняет этот оттенок, не приписывая Иисусу страха.
- source_word: ἐκεῖθεν
  choice: оттуда
  rationale: Краткая и естественная передача указания на движение прочь от места действия.
- source_word: ἠκολούθησαν αὐτῷ πολλοί
  choice: Многие последовали за Ним
  rationale: πολλοί означает «многие» и само по себе не требует добавления «толпы». Русский порядок слов звучит естественно и сохраняет смысл исходного текста.
- source_word: ἐθεράπευσεν
  choice: исцелил
  rationale: В евангельском контексте θεραπεύω обозначает исцеление больных; «исцелил» — ясный и устоявшийся русский эквивалент.
- source_word: αὐτοὺς πάντας
  choice: их всех
  rationale: Передаёт всеохватное значение πάντας и естественно связывает местоимение с упомянутыми ранее последователями.
theological_decisions:
- issue: Неявное дополнение при γνοὺς
  choice: «узнав об этом» — Иисус узнал о враждебном замысле, описанном в предыдущем стихе
  alternative: «узнав» без выраженного дополнения
  rationale: Греческий текст оставляет объект знания невыраженным. Контекстуальное «об этом» делает связь понятной по-русски, не уточняя сверх текста содержание замысла.
- issue: Оттенок ухода Иисуса
  choice: «удалился»
  alternative: «ушёл»
  rationale: Выбор сохраняет характер намеренного отступления в ответ на противодействие, но не предполагает страха или малодушия.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией; синтаксис остаётся естественным для современного читателя.
