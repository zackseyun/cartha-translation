revisions:
- from: 'Тогда он говорит: «Вернусь в мой дом, из которого вышел». И, придя, находит его пустым[a], выметенным и приведённым в порядок[b].'
  to: 'Тогда он говорит: «Я вернусь в свой дом, из которого вышел». И, придя, находит его незанятым[a], выметенным и приведённым в порядок[b].'
  rationale: Основной вариант для σχολάζοντα изменён на «незанятым», чтобы передать состояние доступности дома для возвращающегося духа; «пустым» сохранено как допустимая лексическая альтернатива в сноске. «Свой дом» делает фразу естественной по-русски без смысловой потери. Остальные элементы сохранены, поскольку они точно отражают греческий текст и не навязывают истолкования.
