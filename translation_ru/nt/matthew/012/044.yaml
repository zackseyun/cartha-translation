  text: τότε λέγει· ⸂Εἰς τὸν οἶκόν μου ἐπιστρέψω⸃ ὅθεν ἐξῆλθον· καὶ ἐλθὸν ⸀εὑρίσκει ⸀σχολάζοντα σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/044.yaml
  text: Then it says[a], ‘I will return to my house from which I came out,’ and when it comes, it finds it unoccupied, swept[b], and put in order.
translation:
  language: ru
  text: 'Тогда он говорит: «Я вернусь в свой дом, из которого вышел». И, придя, находит его незанятым[a], выметенным и приведённым в порядок[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пустым».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «украшенным» или «убранным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Кратко и естественно передаёт временной переход к следующему действию.
- source_word: λέγει
  choice: он говорит
  rationale: 'Подлежащее подразумевается из предыдущего контекста: это нечистый дух. Настоящее время сохранено как живое повествовательное настоящее.'
- source_word: Εἰς τὸν οἶκόν μου ἐπιστρέψω
  choice: Вернусь в мой дом
  rationale: Передаёт значение возвращения и сохраняет притязательное «мой дом», выраженное в греческом тексте.
- source_word: ὅθεν ἐξῆλθον
  choice: из которого вышел
  rationale: Сохраняет конкретный образ выхода из дома и естественно соотносится со словом «дом».
- source_word: ἐλθὸν
  choice: придя
  rationale: Деепричастие естественно передаёт предшествующее действие аористного причастия.
- source_word: εὑρίσκει
  choice: находит
  rationale: Сохраняет простое значение глагола и повествовательное настоящее.
- source_word: σχολάζοντα
  choice: пустым
  rationale: В применении к дому это наиболее естественное современное русское соответствие со значением «свободный, незанятый»; возможный оттенок «незанятый» отмечен в сноске.
- source_word: σεσαρωμένον
  choice: выметенным
  rationale: Передаёт завершённое действие и наличное состояние дома после уборки.
- source_word: κεκοσμημένον
  choice: приведённым в порядок
  rationale: Передаёт контекстуальное значение κοσμέω как упорядочивания, не исключая возможного значения украшения, указанного в сноске.
theological_decisions:
- issue: Метафорический смысл «дома» в изречении о возвращающемся нечистом духе
  choice: Сохранить слово «дом» без поясняющей замены на «человек» или «жизнь».
  alternative: «Вернусь к человеку, из которого вышел».
  rationale: Греческий текст сохраняет образ дома; его раскрытие в переводе было бы интерпретирующей парафразой.
translation_notes:
  register: Современный литературный русский язык; речь естественная и сдержанно-д dignified. Сохранены образ дома, притязание духа «мой дом» и живое повествовательное настоящее. Три согласованных определения передают состояние дома после возвращения духа.
