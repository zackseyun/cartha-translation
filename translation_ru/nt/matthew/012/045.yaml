id: MAT.12.45
reference: Matthew 12:45
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ ἑπτὰ ἕτερα πνεύματα πονηρότερα ἑαυτοῦ, καὶ εἰσελθόντα κατοικεῖ ἐκεῖ· καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων. οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/045.yaml
  text: Then it goes and brings with itself seven other spirits more evil than itself[a], and they enter and live there; and the last state of that man becomes worse than the first[b]. So it will be also with this evil generation.
translation:
  language: ru
  text: Тогда он идёт и берёт с собой семь других духов, злее себя, и они, войдя, поселяются там. И последнее состояние того человека становится хуже прежнего.[a] Так будет и с этим злым поколением.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «последнее того человека становится хуже первого»; это выражение означает, что его конечное состояние хуже первоначального.'
    reason: lexical_clarification
lexical_decisions:
- source_word: τότε πορεύεται
  choice: Тогда он идёт
  rationale: Настоящее время передаёт живое последовательное повествование; местоимение относится к нечистому духу из контекста.
- source_word: παραλαμβάνει μεθ’ ἑαυτοῦ
  choice: берёт с собой
  rationale: Естественно передаёт значение взятия спутников без избыточного буквального повтора возвратного местоимения.
- source_word: ἑπτὰ ἕτερα πνεύματα
  choice: семь других духов
  rationale: ἕτερα обозначает дополнительных духов и не обязательно подчёркивает различие по виду.
- source_word: πονηρότερα ἑαυτοῦ
  choice: злее себя
  rationale: Сравнительная форма кратко и естественно передаёт большую степень нравственного зла.
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: они, войдя, поселяются там
  rationale: Причастие сохраняет последовательность действий, а множественное число следует смысловому субъекту — семи духам; κατοικέω здесь означает постоянное обитание.
- source_word: τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου
  choice: последнее состояние того человека
  rationale: Греческая идиома обозначает конечное положение человека; «состояние» делает смысл ясным по-русски.
- source_word: χείρονα τῶν πρώτων
  choice: хуже прежнего
  rationale: Передаёт противопоставление конечного состояния первоначальному естественным русским сравнительным оборотом.
- source_word: οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ
  choice: Так будет и с этим злым поколением
  rationale: Сохраняет прямое применение образа к современному Иисусу поколению и повтор значения πονηρός.
theological_decisions:
- issue: Обозначение злых духов
  choice: духов
  alternative: бесов
  rationale: В данном предложении греческий текст содержит πνεύματα; контекст уже определяет их как нечистых, поэтому более конкретное «бесов» не требуется.
- issue: Передача ἀνθρώπου
  choice: того человека
  alternative: того мужчины
  rationale: Здесь ἄνθρωπος обозначает человека как представителя людей, а не подчёркивает мужской пол; русское «человек» точно и естественно.
- issue: Число сказуемого при κατοικεῖ
  choice: поселяются
  alternative: поселяется
  rationale: Хотя в SBLGNT напечатана форма единственного числа κατοικεῖ, по смыслу действуют вошедшие семь духов; перевод сохраняет смысловую согласованность, а формальная особенность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Берёт с собой» и «поселяются» звучат естественно, а «последнее состояние» ясно раскрывает греческую идиому. Маркер сноски поставлен после предложения, к которому относятся оба пояснения.
