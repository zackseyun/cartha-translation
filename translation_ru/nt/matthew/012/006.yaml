  text: 'Но говорю вам: здесь есть нечто большее, чем храм[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «здесь тот, кто больше храма»; возможно также: «здесь кто-то больше храма». В греческом употреблена форма среднего рода («большее»), поэтому референт прямо не назван.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «в этом месте».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Но говорю вам
  rationale: δέ обозначает мягкое противопоставление предшествующему рассуждению; формула «говорю вам» естественно передаёт прямое обращение.
- source_word: τοῦ ἱεροῦ
  choice: чем храм
  rationale: ἱερόν обычно обозначает храм в широком смысле, включая храмовый комплекс; «храм» — точный и естественный русский эквивалент.
- source_word: μεῖζόν
  choice: нечто большее
  rationale: Сравнительная форма среднего рода употреблена субстантивированно, а её референт прямо не назван; «нечто большее» сохраняет грамматическую неопределённость исходного текста.
- source_word: ὧδε
  choice: здесь
  rationale: Краткий и естественный эквивалент локативного наречия; возможное более развёрнутое значение отмечено в сноске.
theological_decisions:
- issue: Кого или что обозначает субстантивированное μεῖζόν среднего рода
  choice: нечто большее, чем храм
  alternative: кто-то больше храма; тот, кто больше храма
  rationale: Контекст указывает на Иисуса и его власть, однако греческий текст использует средний род и формально не называет референта. Основной текст сохраняет эту неоднозначность, не сводя выражение исключительно к личности или предмету.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная конструкция. Двоеточие естественно вводит содержание высказывания. Формулировка сохраняет необычность и богословскую напряжённость греческого среднего рода.
