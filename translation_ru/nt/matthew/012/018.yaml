  text: Ἰδοὺ ὁ παῖς μου ὃν ᾑρέτισα, ὁ ἀγαπητός μου ⸂εἰς ὃν⸃ εὐδόκησεν ἡ ψυχή μου· θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν, καὶ κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/018.yaml
  text: Behold[a], my servant whom I have chosen, my beloved in whom my soul has delighted. I will put my Spirit upon him[c][b], and he will proclaim justice to the nations.
translation:
  language: ru
  text: «Вот Мой Слуга, которого Я избрал, Мой Возлюбленный, которым довольна Моя душа[c]. Я возложу на Него Моего Духа, и Он возвестит народам[b] правосудие[a]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «суд».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «язычникам».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «к которому благоволит Моя душа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Естественный современный русский возглас, сохраняющий функцию привлечения внимания и возвышенный тон пророческой цитаты.
- source_word: παῖς
  choice: Слуга
  rationale: В контексте цитаты из песни о Слуге у Исаии слово обозначает Божьего слугу, а не просто ребёнка; перевод сохраняет ветхозаветную связь, не вводя отсутствующее здесь слово «Сын».
- source_word: ᾑρέτισα
  choice: которого Я избрал
  rationale: Передаёт завершённый и целенаправленный Божий выбор естественной русской конструкцией.
- source_word: ὁ ἀγαπητός μου
  choice: Мой Возлюбленный
  rationale: Сохраняет субстантивированное прилагательное, выражающее особую любовь и достоинство названного лица.
- source_word: εἰς ὃν εὐδόκησεν ἡ ψυχή μου
  choice: к которому благоволит Моя душа
  rationale: Сохраняет явное упоминание души и положительное значение εὐδοκέω, не сводя выражение к безличному одобрению.
- source_word: θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν
  choice: Я возложу на Него Моего Духа
  rationale: «Возложу ... на» точно и естественно передаёт образ дарования Духа для служения; прописная буква указывает на Божьего Духа.
- source_word: κρίσιν
  choice: правосудие
  rationale: В пророческом контексте слово обозначает явление Божьего справедливого порядка и правого суда; «правосудие» удерживает связь как со справедливостью, так и с судебным смыслом.
- source_word: τοῖς ἔθνεσιν
  choice: народам
  rationale: Передаёт широкий масштаб миссии среди народов; возможное контекстуальное значение «язычникам» отмечено в сноске.
- source_word: ἀπαγγελεῖ
  choice: возвестит
  rationale: Передаёт публичное и торжественное объявление, соответствующее пророческой речи.
theological_decisions:
- issue: Мессианский образ в παῖς
  choice: Перевести как «Слуга» в соответствии с контекстом пророчества Исаии.
  alternative: «отрок», «дитя», «сын»
  rationale: «Слуга» сохраняет образ избранного Божьего служителя и не привносит в это конкретное слово сыновнюю терминологию, хотя весь отрывок применяется к Иисусу.
- issue: Значение κρίσις в миссии Слуги
  choice: В основном тексте употребить «правосудие».
  alternative: «суд» или «справедливость»
  rationale: «Правосудие» передаёт установление и провозглашение Божьего справедливого порядка, сохраняя судебный оттенок слова; более буквальное «суд» дано в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным звучанием пророческой цитаты. Синтаксис остаётся ясным для широкого читателя; выражение «Моя душа» сохранено ради образности оригинала. Прописные буквы в местоимениях поддерживают принятый в русском библейском тексте почтительный регистр.
