- from: Или вы не читали в Законе, что по субботам священники в храме нарушают святость субботы[a] и остаются невиновными?[b]
  to: Или вы не читали в Законе, что по субботам священники в храме оскверняют субботу[a] и не виновны?[b]
  rationale: 'Правка заменяет отвлечённое «нарушают святость субботы» прямым эквивалентом «оскверняют субботу» и устраняет невыраженный в оригинале оттенок длительности в «остаются невиновными». Смысловой парадокс: оскверняют субботу, однако не несут вины, — сохранён без богословского сглаживания.'
