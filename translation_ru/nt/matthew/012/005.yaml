  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἢ οὐκ ἀνέγνωτε ἐν τῷ νόμῳ ὅτι τοῖς σάββασιν οἱ ἱερεῖς ἐν τῷ ἱερῷ τὸ σάββατον βεβηλοῦσιν καὶ ἀναίτιοί εἰσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/005.yaml
  text: Or have you not read in the Law that on the Sabbaths the priests in the temple profane the Sabbath and are guiltless?[a][b][c]
translation:
  language: ru
  text: Или вы не читали в Законе, что по субботам священники в храме оскверняют субботу[a] и не виновны?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нарушают субботу». Греческий глагол означает обращаться со святым как с обычным, несвятым.'
    reason: lexical_alternative
  - marker: b
    text: Речь идёт о предписанном Законом священническом служении по субботам (см. Чис. 28:9–10).
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Или
  rationale: Вводит ещё один довод из Писания и сохраняет риторическую связь с предыдущим рассуждением.
- source_word: οὐκ ἀνέγνωτε
  choice: вы не читали
  rationale: Естественная для современного русского языка риторическая формула, не требующая буквального воспроизведения греческого аориста.
- source_word: ἐν τῷ νόμῳ
  choice: в Законе
  rationale: Прописная буква показывает, что речь идёт о Моисеевом Законе как части Писания, а не о законе вообще.
- source_word: τοῖς σάββασιν
  choice: по субботам
  rationale: Естественно передаёт греческое множественное число и значение повторяющихся субботних дней.
- source_word: οἱ ἱερεῖς
  choice: священники
  rationale: Прямое обозначение храмовых священников, совершавших предписанное служение.
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: Естественный русский эквивалент; в данном контексте обозначает храмовый комплекс, а не только святилище.
- source_word: βεβηλοῦσιν
  choice: нарушают святость
  rationale: Передаёт смысл обращения со святым как с обычным и сохраняет сильное, провокационное звучание глагола, оставаясь понятным современному читателю.
- source_word: ἀναίτιοί εἰσιν
  choice: остаются невиновными
  rationale: Передаёт отсутствие вины или юридической ответственности, подчёркивая контраст с предшествующим сильным выражением.
theological_decisions:
- issue: Следует ли смягчать утверждение о том, что священники нарушают святость субботы
  choice: Сохранить сильную формулировку «нарушают святость субботы» вместе с «остаются невиновными»
  alternative: «нарушают субботний покой, но не виновны»
  rationale: Греческий текст намеренно соединяет внешне резкое описание совершаемого в субботу храмового служения с отсутствием вины. Перевод сохраняет это богословское и риторическое напряжение, не разрешая его за читателя.
translation_notes:
  register: Современный литературный русский язык, ясный и достоинственный. Оборот «по субботам» естественно сохраняет повторительное значение греческого множественного числа; выражение «нарушают святость» удерживает резкость исходного глагола без архаичного или неясного звучания.
