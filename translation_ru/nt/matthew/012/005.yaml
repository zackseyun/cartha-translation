  terminology: «Закон», «священники», «храм» и «по субботам» употреблены удачно. «Оскверняют» точнее передаёт βεβηλοῦσιν как обращение со святым как с обыденным; сноска отмечает более нейтральную альтернативу «нарушают субботу».
