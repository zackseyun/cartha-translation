  text: καὶ ἐκτείνας τὴν χεῖρα αὐτοῦ ἐπὶ τοὺς μαθητὰς αὐτοῦ εἶπεν· Ἰδοὺ ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/049.yaml
  text: And stretching out his hand toward his disciples[a], he said, “Behold[b], my mother and my brothers.”
translation:
  language: ru
  text: 'И, протянув руку к Своим ученикам, сказал: «Вот Моя мать и Мои братья[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «братья»; в греческом тексте употреблено существительное мужского рода во множественном числе, поэтому оно не расширено до «братья и сёстры».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτείνας
  choice: протянув
  rationale: 'Аористное причастие обозначает действие, сопровождающее главное: Иисус протягивает руку и затем говорит. Русское деепричастие передаёт эту последовательность естественно и точно.'
- source_word: τὴν χεῖρα αὐτοῦ
  choice: руку
  rationale: χείρ обычно означает «рука»; притяжательное местоимение в русском избыточно, поскольку субъект действия уже назван формой «протянув».
- source_word: ἐπὶ τοὺς μαθητὰς αὐτοῦ
  choice: к Своим ученикам
  rationale: ἐπί с винительным падежом здесь выражает направленность жеста. «К ученикам» звучит по-русски естественнее, чем буквальное «на учеников»; «Своим» сохраняет αὐτοῦ.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: ἰδού привлекает внимание и указывает на присутствующих. «Вот» кратко, естественно и сохраняет указательно-эмфатическую силу без излишней архаичности.
- source_word: ἡ μήτηρ μου
  choice: Моя мать
  rationale: Сохранён прямой термин родства и притяжательное местоимение.
- source_word: οἱ ἀδελφοί μου
  choice: Мои братья
  rationale: Сохранена грамматически мужская форма множественного числа и конкретная семейная метафора исходного текста; она не расширена до «братья и сёстры» и не обобщена как «родные».
theological_decisions:
- issue: Семейные термины в словах Иисуса о Его учениках
  choice: Сохранить конкретные слова «мать» и «братья»
  alternative: 'Передать обобщённо: «семья», «родные» или «братья и сёстры»'
  rationale: Иисус намеренно описывает учеников через конкретные отношения родства. Обобщение ослабило бы риторическую силу высказывания и внесло бы отсутствующее в греческой форме уточнение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Вот» предпочтено архаичному «се», а естественный порядок слов и деепричастный оборот сохраняют движение и выразительность сцены.
