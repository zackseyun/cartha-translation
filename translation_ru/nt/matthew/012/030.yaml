  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/030.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: ru
  text: Кто не со Мной, тот против Меня, и кто не собирает со Мной, тот рассеивает.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: кто не… тот
  rationale: Субстантивированное причастие обозначает любого человека, характеризуемого этим отношением. Русская соотносительная конструкция «кто… тот» естественно и точно передаёт обобщённое значение греческой формы.
- source_word: μετ’ ἐμοῦ
  choice: со Мной
  rationale: μετά с родительным падежом выражает совместность или принадлежность к одной стороне. Прямое «со Мной» сохраняет как отношение к Иисусу, так и подразумеваемое единение с Ним.
- source_word: κατ’ ἐμοῦ
  choice: против Меня
  rationale: κατά с родительным падежом здесь выражает противостояние; «против Меня» передаёт его кратко и ясно.
- source_word: συνάγων
  choice: собирает
  rationale: Глагол означает собирать воедино. Выбор сохраняет образную открытость текста, не уточняя без основания, идёт ли речь о стаде, урожае или людях.
- source_word: σκορπίζει
  choice: рассеивает
  rationale: Глагол обозначает рассеивание или разбрасывание. «Рассеивает» образует естественную смысловую антитезу с «собирает» и сохраняет переходность греческого глагола без добавления объекта.
- source_word: καὶ
  choice: и
  rationale: Союз соединяет два параллельных утверждения; «и» точно сохраняет их сложение без внесения противопоставительного оттенка.
theological_decisions:
- issue: Категоричность противопоставления в словах Иисуса
  choice: 'Сохранено безусловное противопоставление: не быть со Христом означает быть против Него; не собирать с Ним означает рассеивать.'
  alternative: Смягчить высказывание идиоматическим пересказом, допускающим нейтральную позицию.
  rationale: В греческом тексте обе параллельные части сформулированы категорично, без оговорок. Перевод сохраняет это напряжение, не выводя из него дополнительных конфессиональных положений.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмически параллельная конструкция. Заглавные буквы в местоимениях «Мной/Меня» соответствуют принятому благоговейному библейскому регистру. Архаичное «кто не со Мною» не используется.
