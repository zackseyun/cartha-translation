  source_fidelity: 'Текст точно передаёт все существенные элементы греческого оригинала: временную связку «Тогда», ответ, адресата, ограничительное «некоторые», обе группы, обращение «Учитель», волевое «мы хотим», источник «от тебя» и инфинитив «увидеть». «Знамение» уместно передаёт σημεῖον в данном евангельском контексте, не добавляя в основной текст слова «чудесное».'
  naturalness: Фраза звучит естественно в современном литературном русском с умеренной библейской окраской. Конструкция «хотим увидеть от тебя знамение» несколько книжная, но ясна, грамматична и хорошо соответствует жанру; замена на более разговорный оборот не требуется.
  terminology: «Книжники», «фарисеи», «Учитель» и «знамение» — точные, общеупотребительные в библейском русском обозначения. Строчная буква в местоимении «тебя» соответствует заявленной нейтральной современной типографике и не влияет на смысл. Сноска корректно отмечает возможный чудесный оттенок σημεῖον, сохраняя в основном тексте лексическую широту.
