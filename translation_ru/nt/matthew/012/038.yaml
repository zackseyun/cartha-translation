source:
  edition: SBLGNT
  text: Τότε ἀπεκρίθησαν ⸀αὐτῷ τινες τῶν γραμματέων καὶ Φαρισαίων λέγοντες· Διδάσκαλε, θέλομεν ἀπὸ σοῦ σημεῖον ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/038.yaml
  text: Then some of the scribes and Pharisees answered him[a], saying, “Teacher, we want to see a sign from you.”
translation:
  language: ru
  text: 'Тогда некоторые из книжников и фарисеев ответили ему: «Учитель, мы хотим увидеть от тебя знамение[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чудесное знамение». Греческое слово может обозначать знак, имеющий чудесное значение, но в основном тексте сохранено более широкое «знамение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественно обозначает переход к следующему событию в повествовании.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: ответили ему
  rationale: Сохраняет обычную для евангельского повествования формулу ответа, хотя непосредственно перед этим вопрос не приведён.
- source_word: τινες τῶν γραμματέων καὶ Φαρισαίων
  choice: некоторые из книжников и фарисеев
  rationale: «Некоторые» точно указывает на часть названных групп; «книжники» и «фарисеи» — устоявшиеся и понятные обозначения.
- source_word: λέγοντες
  choice: 'ответили ему:'
  rationale: В русском языке причастную конструкцию естественнее передать двоеточием перед прямой речью, не добавляя отдельного «говоря».
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Точно передаёт обращение к Иисусу без усиления значения до «Господин» или «Наставник».
- source_word: θέλομεν
  choice: мы хотим
  rationale: Прямое и современное выражение желания, соответствующее греческому глаголу.
- source_word: ἀπὸ σοῦ
  choice: от тебя
  rationale: 'Сохраняет значение источника: просители ожидают знамения, исходящего от Иисуса.'
- source_word: σημεῖον
  choice: знамение
  rationale: Устоявшийся русский библейский эквивалент, сохраняющий значение удостоверяющего знака и не вводящий прямо отсутствующее в слове определение «чудесное».
- source_word: ἰδεῖν
  choice: увидеть
  rationale: Прямо и естественно передаёт инфинитив со значением зрительного восприятия.
theological_decisions:
- issue: Характер ζητούμενου σημεῖον
  choice: знамение
  alternative: чудесное знамение
  rationale: В контексте подразумевается сверхъестественное подтверждение полномочий Иисуса, однако само греческое слово шире. Основной текст сохраняет эту широту, а возможное уточнение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Местоимения, относящиеся к Иисусу, даны со строчной буквы как обычные грамматические формы; речь остаётся уважительной без конфессионально обусловленной типографики.
