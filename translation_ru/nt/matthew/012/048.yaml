  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ ⸀λέγοντι αὐτῷ· Τίς ἐστιν ἡ μήτηρ μου, καὶ τίνες εἰσὶν οἱ ἀδελφοί μου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/048.yaml
  text: But he answered the one speaking to him[a], “Who is my mother, and who are my brothers?”
translation:
  language: ru
  text: 'Но он ответил тому, кто обращался к нему[a]: «Кто Моя мать и кто Мои братья?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более формально: «Но он, ответив, сказал тому, кто обращался к нему».'
    reason: Лексическая альтернатива, сохраняющая оба глагольных элемента ἀποκριθεὶς εἶπεν.
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Но он ответил
  rationale: Оборот ἀποκριθεὶς εἶπεν буквально означает «ответив, сказал» и отражает распространённую семитизированную формулу. В естественном современном русском глагол «ответил» передаёт её смысл без избыточного повтора; δέ передано союзом «но», обозначающим поворот в речи.
- source_word: τῷ λέγοντι αὐτῷ
  choice: тому, кто говорил с ним
  rationale: Субстантивированное причастие настоящего времени обозначает человека, обращавшегося к Иисусу. Такая передача сохраняет длительный характер действия и не добавляет содержания его слов.
- source_word: Τίς ἐστιν ἡ μήτηρ μου
  choice: Кто Моя мать
  rationale: Вопросительное местоимение просит указать личность; связка настоящего времени в русском естественно опускается. Прямой порядок слов сохраняет силу риторического вопроса.
- source_word: καὶ τίνες εἰσὶν οἱ ἀδελφοί μου
  choice: и кто Мои братья
  rationale: Множественное τίνες по-русски естественно передаётся неизменяемым «кто». ἀδελφοί сохранено как конкретное мужское родственное обозначение «братья», без расширения до «братьев и сестёр».
theological_decisions:
- issue: Риторический вопрос Иисуса о семейной принадлежности
  choice: Сохранить прямые вопросы без пояснительного расширения
  alternative: «Кого можно назвать Моей матерью и Моими братьями?»
  rationale: Следующий контекст раскрывает новое понимание родства, но данный стих лишь ставит вопрос. Перевод не должен заранее объяснять его или ослаблять возникающее богословское напряжение.
- issue: Родовое значение ἀδελφοί
  choice: «братья»
  alternative: «братья и сёстры» или «родные»
  rationale: В непосредственном повествовательном контексте речь идёт о представленных как родственники Иисуса братьях. Мужская форма исходного текста сохранена без необоснованного расширения значения.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Основной текст избегает буквальной глагольной избыточности греческой формулы, а более формальная передача дана в сноске. Прописные буквы в притяжательных местоимениях «Моя», «Мои» сохраняют традиционную уважительную издательскую норму в прямой речи Иисуса.
