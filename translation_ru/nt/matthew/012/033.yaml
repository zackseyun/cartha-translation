id: MAT.12.33
reference: Matthew 12:33
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἢ ποιήσατε τὸ δένδρον καλὸν καὶ τὸν καρπὸν αὐτοῦ καλόν, ἢ ποιήσατε τὸ δένδρον σαπρὸν καὶ τὸν καρπὸν αὐτοῦ σαπρόν· ἐκ γὰρ τοῦ καρποῦ τὸ δένδρον γινώσκεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/033.yaml
  text: Either make the tree good and its fruit good[a], or make the tree rotten and its fruit rotten[b]; for the tree is known by its fruit.
translation:
  language: ru
  text: Или сделайте дерево хорошим и плод его хорошим, или сделайте дерево гнилым и плод его гнилым[a], ведь дерево узнают по его плоду.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. σαπρός может также означать «испорченный», «негодный» или «плохой».
    reason: lexical_alternative
  - marker: b
    text: Повторённое «сделайте» может риторически означать «считайте» или «признайте таковым», однако в греческом тексте употреблено повелительное наклонение.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσατε
  choice: сделайте
  rationale: Аористный императив передан прямым повелительным наклонением, чтобы сохранить параллелизм и риторическую резкость; возможный смысл «считайте» не внесён в основной текст.
- source_word: δένδρον
  choice: дерево
  rationale: Прямой и естественный эквивалент, сохраняющий центральный образ.
- source_word: καλός
  choice: хороший
  rationale: Сохраняет широкое значение качества и нравственный оттенок, не сужая образ до физического здоровья.
- source_word: καρπός
  choice: плод
  rationale: Прямой и устойчивый эквивалент в метафорическом контексте.
- source_word: σαπρός
  choice: гнилой
  rationale: Передаёт яркий образ испорченности и применимо в русском языке как к дереву, так и к его плоду.
- source_word: ἐκ γὰρ τοῦ καρποῦ
  choice: ведь ... по его плоду
  rationale: «Ведь» естественно выражает пояснительное γάρ, а «по плоду» идиоматично передаёт основание распознавания, выраженное ἐκ.
- source_word: γινώσκεται
  choice: узнают
  rationale: Неопределённо-личная конструкция естественно передаёт греческий пассив в современном русском и означает распознавание дерева по плоду.
theological_decisions:
- issue: Сила повелительных форм в метафоре Иисуса
  choice: Сохранены прямые повелительные формы «сделайте»
  alternative: «Считайте дерево хорошим…» или условная конструкция
  rationale: Греческий текст дважды употребляет императив. Хотя он может иметь риторический смысл классификации или признания, перевод не снимает эту напряжённость толкованием.
translation_notes:
  register: Современный литературный русский язык; сохранены симметрия высказывания, повтор глагола и яркая метафора. Неопределённо-личное «узнают» звучит естественнее буквального пассива «познаётся».
