  text: ἐκ γὰρ τῶν λόγων σου δικαιωθήσῃ, καὶ ἐκ τῶν λόγων σου καταδικασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/037.yaml
  text: For by your words you will be justified[a], and by your words you will be condemned.
translation:
  language: ru
  text: Ведь по словам твоим ты будешь оправдан[a], и по словам твоим будешь осуждён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «признан правым»; возможно также: «признан невиновным». Греческий глагол может иметь судебный смысл — признать кого-либо правым на суде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: по
  rationale: В сочетании с родительным падежом здесь указывает на основание или свидетельство, по которому выносится суд; русское «по словам» естественно передаёт этот смысл.
- source_word: γάρ
  choice: ведь
  rationale: Вводит обоснование предшествующего предупреждения и естественно связывает стих с контекстом.
- source_word: λόγων
  choice: словам
  rationale: Множественное число относится к произнесённым словам; повтор сохранён ради параллелизма оригинала.
- source_word: σου
  choice: твоим
  rationale: Притяжательное местоимение относится к «словам» в обеих частях стиха; единственное число сохраняет обращение оригинала.
- source_word: δικαιωθήσῃ
  choice: ты будешь оправдан
  rationale: Будущая страдательная форма δικαιόω в противопоставлении осуждению имеет судебный смысл. «Оправдан» сохраняет как юридическую, так и более широкую библейскую окраску глагола.
- source_word: καταδικασθήσῃ
  choice: будешь осуждён
  rationale: Передаёт судебное значение будущей страдательной формы и сохраняет прямую антитезу к «оправдан».
theological_decisions:
- issue: Судебный смысл δικαιόω в связи со словами человека и судом
  choice: «ты будешь оправдан» — в смысле признан правым или невиновным на суде
  alternative: «будешь признан правым» или «будешь признан невиновным»
  rationale: Параллель с «будешь осуждён» ясно задаёт судебный контекст. Формулировка «оправдан» сохраняет смысловую широту греческого глагола и не вводит в стих развёрнутую догматическую систему.
translation_notes:
  register: Современный литературный русский язык; краткий, торжественный судебный параллелизм оригинала сохранён. «Ведь» естественно выражает пояснительную функцию γάρ, а повтор «по словам твоим» воспроизводит риторическую структуру греческого текста.
