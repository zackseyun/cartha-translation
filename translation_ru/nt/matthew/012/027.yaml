id: MAT.12.27
reference: Matthew 12:27
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ εἰ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο αὐτοὶ ⸂κριταὶ ἔσονται ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/027.yaml
  text: And if I cast out demons by Beelzebul[a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: ru
  text: И если Я изгоняю бесов силой Веельзевула[a], то чьей силой изгоняют их ваши сыновья? Поэтому они и будут вам судьями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. «Веельзевул»; традиционный вариант имени — «Веельзевуб».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν Βεελζεβοὺλ
  choice: силой Веельзевула
  rationale: Предлог ἐν здесь имеет инструментальное значение и указывает на приписываемую Иисусу силу или средство. «Силой Веельзевула» естественно передаёт этот смысл по-русски, не подразумевая пространственного значения «в».
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: изгоняю бесов
  rationale: В контексте экзорцизма ἐκβάλλω означает «изгонять», а δαιμόνια — злых духов; традиционное русское «бесов» остаётся понятным и уместным в библейском регистре.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: ваши сыновья
  rationale: Сохранён буквальный термин родства υἱοί. Он может обозначать людей из среды или последователей собеседников, однако сам греческий текст этого прямо не уточняет.
- source_word: ἐν τίνι
  choice: чьей силой
  rationale: Повторное ἐν также инструментально. Вопросительное τίνι допускает формальное «кем/чем», но в русском контексте противопоставления источника силы естественно звучит «чьей силой».
- source_word: διὰ τοῦτο
  choice: поэтому
  rationale: Кратко и ясно передаёт вывод, следующий из риторического вопроса.
- source_word: κριταὶ ἔσονται ὑμῶν
  choice: они и будут вам судьями
  rationale: 'Сохранена именная конструкция с будущим временем: именно действия «сыновей» разоблачают непоследовательность обвинителей. Частица «и» естественно подчёркивает следствие, не добавляя нового содержания.'
theological_decisions:
- issue: Форма и передача имени Βεελζεβούλ
  choice: Веельзевул
  alternative: Веельзевуб
  rationale: Передача следует форме Βεελζεβούλ в SBLGNT и принятой русской транслитерации «Веельзевул», не заменяя её знакомым вариантом, восходящим к иной форме имени.
- issue: Кого обозначают «ваши сыновья»
  choice: Сохранить буквальное «ваши сыновья»
  alternative: «ваши последователи» или «ваши люди»
  rationale: Контекст допускает понимание как представителей или учеников собеседников, но греческое οἱ υἱοὶ ὑμῶν сохраняет родственный образ. Перевод не должен без необходимости устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. «Бесы» и «изгонять» сохраняют привычный библейский словарь, оставаясь понятными современному читателю; синтаксис сделан естественным, а риторический параллелизм оригинала сохранён.
