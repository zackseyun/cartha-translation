  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐκ ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε ⸀ἐπείνασεν καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/003.yaml
  text: But he said to them[a], “Have you not read what David did when he was hungry, and those with him were hungry?”
translation:
  language: ru
  text: 'Он же сказал им: «Разве вы не читали, что сделал Давид, когда проголодались он и те, кто был с ним?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте глагол «проголодался» стоит в единственном числе и прямо относится к Давиду; затем эллиптически упомянуты и те, кто был с ним. Возможен также перевод: «когда Давид проголодался, а также те, кто был с ним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Он же
  rationale: Частица δέ мягко обозначает переход и ответ на предшествующее обвинение; «же» естественно передаёт эту связь, не усиливая её до резкого противопоставления.
- source_word: εἶπεν αὐτοῖς
  choice: сказал им
  rationale: Прямое и нейтральное соответствие греческому выражению.
- source_word: Οὐκ ἀνέγνωτε
  choice: Разве вы не читали
  rationale: Отрицательный риторический вопрос апеллирует к знакомству собеседников с Писанием; такая формулировка естественна в современном русском языке.
- source_word: τί ἐποίησεν
  choice: что сделал
  rationale: Передаёт простое историческое значение ποιέω без смыслового расширения.
- source_word: Δαυὶδ
  choice: Давид
  rationale: Устоявшаяся русская форма имени.
- source_word: ὅτε ἐπείνασεν
  choice: когда проголодался
  rationale: Аорист единственного числа прямо относится к Давиду; «проголодался» кратко и естественно передаёт наступление голода, не делая фразу архаичной.
- source_word: καὶ οἱ μετ’ αὐτοῦ
  choice: и те, кто был с ним
  rationale: Близко передаёт субстантивированное οἱ μετ’ αὐτοῦ и не уточняет характер отношений этих людей с Давидом.
theological_decisions:
- issue: Относится ли состояние голода только к Давиду или также к бывшим с ним людям
  choice: 'Основной текст сохраняет грамматическую незавершённость греческой фразы: «когда проголодался — и те, кто был с ним?»'
  alternative: «когда он и те, кто был с ним, проголодались»
  rationale: Глагол ἐπείνασεν стоит в единственном числе и явно относится к Давиду, тогда как καὶ οἱ μετ’ αὐτοῦ допускает подразумеваемое распространение ситуации на его спутников. Сноска сохраняет эту подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Риторический вопрос звучит естественно; тире помогает сохранить необычную координацию исходного текста, а сноска разъясняет грамматическую неоднозначность.
