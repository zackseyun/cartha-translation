  text: καὶ ἰδοὺ ⸀ἄνθρωπος χεῖρα ἔχων ξηράν. καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Εἰ ἔξεστι τοῖς σάββασιν ⸀θεραπεύειν; ἵνα κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/010.yaml
  text: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbaths?” so that they might accuse him.
translation:
  language: ru
  text: 'И вот, человек с иссохшей рукой. Они спросили Иисуса: «Позволено ли исцелять в субботу[a]?» — чтобы обвинить Его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в субботы»; греческое множественное число обычно обозначает субботние дни вообще.'
    reason: лексическая альтернатива и прозрачность грамматической формы оригинала
lexical_decisions:
- source_word: ἰδοὺ
  choice: и вот
  rationale: Передаёт указательно-повествовательную функцию слова, привлекающего внимание к появлению человека, и при этом звучит естественно в современном русском повествовании.
- source_word: ἄνθρωπος
  choice: человек
  rationale: В данном контексте обозначает конкретного мужчину; русское «человек» естественно и точно, без необходимости добавлять «мужчина».
- source_word: χεῖρα ἔχων ξηράν
  choice: с иссохшей рукой
  rationale: Идиоматически передаёт состояние поражённой, утратившей жизнеспособность или подвижность руки, не уточняя медицинский диагноз, которого греческий текст не называет.
- source_word: ἐπηρώτησαν αὐτόν
  choice: они спросили Иисуса
  rationale: Глагол передан нейтрально как «спросили»; имя «Иисуса» употреблено вместо местоимения ради ясности русского текста, поскольку в ближайшей фразе появляется ещё один мужчина.
- source_word: ἔξεστι
  choice: позволено ли
  rationale: Передаёт вопрос о допустимости действия согласно закону и звучит современнее, чем «законно ли», сохраняя правовой и религиозный смысл.
- source_word: τοῖς σάββασιν
  choice: в субботу
  rationale: Русский язык в общем вопросе о соблюдении субботы естественно использует единственное число; формальный греческий плюральный оборот отмечен в сноске.
- source_word: θεραπεύειν
  choice: исцелять
  rationale: Точно и естественно передаёт действие восстановления здоровья в евангельском контексте.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: чтобы обвинить Его
  rationale: Сохраняет целевое значение ἵνα и юридически-враждебный оттенок κατηγορέω, не добавляя конкретного обвинения.
theological_decisions:
- issue: Передача выражения о субботе в споре о допустимом по закону
  choice: в субботу
  alternative: по субботам / в субботы
  rationale: Греческий текст имеет дательный падеж множественного числа τοῖς σάββασιν, однако это обычный способ говорить о субботнем дне или субботах вообще. В русском вопрос «позволено ли исцелять в субботу?» естественно выражает общее правило; грамматическое число оригинала сохранено в сноске, чтобы не скрывать форму источника.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «И вот» сохраняет живость повествования, а «позволено ли» ясно передаёт вопрос о требованиях закона. Прямое «говоря» опущено как неестественное для современного русского; его функция выражена введением прямой речи. Местоимение «Его» оформлено с прописной буквы согласно распространённой русской библейской традиции.
