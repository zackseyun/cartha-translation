    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественная временная связка, обозначающая следующее событие повествования.
- source_word: ἀνήχθη
  choice: был возведён
  rationale: Сохраняет страдательный залог и оттенок движения вверх у ἀνάγω; в русском библейском повествовании звучит естественно и достойно.
- source_word: εἰς τὴν ἔρημον
  choice: в пустыню
  rationale: Обычное русское соответствие для безлюдной, пустынной местности; не уточняет её природный тип сверх греческого текста.
- source_word: ὑπὸ τοῦ πνεύματος
  choice: Духом
  rationale: Контекст крещения Иисуса указывает на Духа Божьего; прописная буква передаёт эту референцию, не добавляя отсутствующего здесь определения «Святым».
- source_word: πειρασθῆναι
  choice: чтобы ... искушал
  rationale: При дьяволе как действующем лице непосредственный контекст отдаёт предпочтение значению «искушать»; возможный смысл испытания отмечен в сноске.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: дьявол
  rationale: В данном контексте διάβολος служит обозначением личного противника; «дьявол» — ясное и общепринятое русское соответствие.
theological_decisions:
- issue: Кого обозначает τοῦ πνεύματος
  choice: Дух Божий / Святой Дух
  alternative: дух или человеческий дух
  rationale: Непосредственно перед этим Матфей говорит о Духе Божьем, сходящем на Иисуса при крещении; прописная буква сохраняет связь, не расширяя формулировку стиха.
- issue: Значение πειρασθῆναι
  choice: быть искушаемым
  alternative: быть испытанным
  rationale: Дьявол и последующие предложения склонить Иисуса к неверности поддерживают значение искушения, но широкий смысл греческого глагола не исключает оттенка испытания, поэтому он сохранён в сноске.
- issue: Синтаксическая связь деятеля при пассивном инфинитиве
  choice: «чтобы дьявол искушал Его»
  alternative: «чтобы быть искушаемым дьяволом»
  rationale: Активная перестройка естественнее для современного русского языка и точно сохраняет деятеля, цель и объект греческой пассивной конструкции, не меняя богословского содержания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Был возведён» сохраняет направительный оттенок оригинала; более тяжёлая последовательность двух пассивных конструкций устранена естественной русской перестройкой второй части.
