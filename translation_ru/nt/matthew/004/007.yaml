  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Πάλιν γέγραπται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/007.yaml
  text: 'Jesus said to him[b][a], “Again it is written: ‘You shall not put the Lord your God to the test.’”'
translation:
  language: ru
  text: 'Иисус сказал ему: «И ещё написано: „Не испытывай Господа, твоего Бога“».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не подвергай Господа, твоего Бога испытанию». Греческий глагол ἐκπειράζω означает «испытывать», «подвергать испытанию».'
    reason: lexical_alternative
  - marker: b
    text: Цитата из Второзакония 6:16. Греческое «Господь» отражает передачу Божьего имени в Септуагинте.
    reason: cross_reference
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Иисус сказал ему
  rationale: Естественная русская передача простой формулы введения прямой речи; дательный αὐτῷ передан местоимением «ему».
- source_word: Πάλιν
  choice: также
  rationale: В данном ответе наречие вводит другое, уравновешивающее место Писания; «также» естественно передаёт присоединительно-контрастную силу πάλιν и не создаёт впечатления, будто следующая цитата повторяет предыдущую.
- source_word: γέγραπται
  choice: Написано
  rationale: 'Традиционная и понятная формула ссылки на Писание, сохраняющая значение совершенного пассива: написанное остаётся авторитетным.'
- source_word: Οὐκ ἐκπειράσεις
  choice: Не испытывай
  rationale: Будущее изъявительное в цитате имеет запретительную силу. «Не испытывай» кратко и естественно передаёт ἐκπειράζω в значении проверки Бога вызывающим требованием доказательства.
- source_word: κύριον τὸν θεόν σου
  choice: Господа, Бога твоего
  rationale: Сохраняется греческое κύριον и пояснительное приложение τὸν θεόν σου. Порядок «Бога твоего» поддерживает возвышенный регистр библейской цитаты без архаической непонятности.
theological_decisions:
- issue: Передача κύριος в цитате о Боге Израиля
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Непосредственный греческий источник содержит κύριος, поэтому основной текст передаёт его как «Господь». Связь с божественным именем в еврейском тексте Второзакония отмечена в сноске, а не внесена типографически в основной текст.
- issue: Характер запрета ἐκπειράζω применительно к Богу
  choice: не испытывай
  alternative: не искушай; не подвергай испытанию
  rationale: «Не испытывай» сохраняет смысл проверки или требования доказательства и не сводит фразу к побуждению Бога ко греху, которое современный русский читатель может услышать в слове «искушай».
translation_notes:
  register: Современный литературный русский с достоинством библейской цитаты. Формула «Написано также» звучит естественно и передаёт ответную ссылку на Писание; инверсия «Бога твоего» ограничена цитатой и сохраняет торжественный оттенок.
