    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественно передаёт временно-последовательный переход к следующему событию.
- source_word: παραλαμβάνει
  choice: берёт
  rationale: Историческое настоящее сохранено ради живости повествования; в контексте глагол означает, что дьявол берёт Иисуса с собой.
- source_word: ὁ διάβολος
  choice: дьявол
  rationale: Здесь слово употреблено как обозначение личного противника; это устоявшийся и понятный русский эквивалент.
- source_word: εἰς τὴν ἁγίαν πόλιν
  choice: в святой город
  rationale: Передаёт направление движения и сохраняет данное в греческом тексте почётное обозначение Иерусалима.
- source_word: ἔστησεν
  choice: ставит
  rationale: 'Каузативное переходное значение: дьявол помещает Иисуса так, чтобы Он стоял; историческое настоящее согласовано с «берёт».'
- source_word: ἐπὶ τὸ πτερύγιον
  choice: на выступе
  rationale: πτερύγιον может обозначать выступающий край или высокую крайнюю точку; «выступ» естественно сохраняет архитектурную неопределённость слова.
- source_word: τοῦ ἱεροῦ
  choice: храмового комплекса
  rationale: ἱερόν обозначает всю территорию и совокупность храмовых сооружений, а не только внутреннее святилище.
theological_decisions:
- issue: Отождествление «святого города»
  choice: Сохранить в основном тексте выражение «святой город».
  alternative: Иерусалим
  rationale: Греческий текст использует почётное обозначение, а не имя города; его отождествление с Иерусалимом вынесено в сноску.
- issue: Точное значение πτερύγιον τοῦ ἱεροῦ
  choice: «выступ храмового комплекса»
  alternative: «вершина храма»; «крыло храма»; «самая высокая точка храмового комплекса»
  rationale: Точное место и архитектурная форма не установлены; перевод не должен без необходимости сводить значение к самой высокой точке.
translation_notes:
  register: Современный литературный русский язык с повествовательным историческим настоящим. Местоимение «Его» написано с прописной буквы согласно распространённой русской библейской издательской норме; синтаксис краткий и динамичный.
