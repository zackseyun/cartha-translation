base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/009.yaml
  text: And he said to him[a], “I will give you all these things, if you fall down and worship me.”
translation:
  language: ru
  text: 'И сказал ему: «Всё это я дам тебе, если ты, пав ниц, поклонишься мне[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «падёшь ниц передо мной» или «окажешь мне почтение». Греческий глагол может обозначать земной поклон, выражение почтения или поклонение; здесь контекст указывает на религиозное поклонение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз сохраняет последовательное течение повествования, не добавляя отсутствующего в греческом тексте временного оттенка.
- source_word: εἶπεν αὐτῷ
  choice: сказал ему
  rationale: Сохранены местоимения исходного текста; имена участников не добавляются.
- source_word: Ταῦτά σοι πάντα δώσω
  choice: Всё это я дам тебе
  rationale: «Всё это» естественно по-русски передаёт Ταῦτά πάντα и отсылает к царствам и их славе, показанным в предыдущем стихе; «дам тебе» прямо передаёт будущее время и дательный адресата.
- source_word: ἐὰν
  choice: если
  rationale: Прямо и естественно вводит условие.
- source_word: πεσὼν
  choice: пав ниц
  rationale: Передаёт предшествующее телесное действие и образ преклонения до земли без тяжеловесной буквальности «упав».
- source_word: προσκυνήσῃς μοι
  choice: поклонишься мне
  rationale: Русское «поклониться» сохраняет одновременно жест преклонения и религиозный смысл, который здесь определяется контекстом; возможная смысловая широта отмечена в сноске.
theological_decisions:
- issue: Значение προσκυνέω в требовании сатаны к Иисусу
  choice: поклонишься мне
  alternative: будешь поклоняться мне; почтишь меня земным поклоном
  rationale: В следующем стихе ответ Иисуса ясно помещает требование в область поклонения, принадлежащего Богу. При этом русское «поклонишься» не устраняет присущую греческому глаголу связь с телесным преклонением и не сводит требование к одному лишь политическому почтению.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Конструкция «пав ниц» выразительна и понятна, а «поклонишься мне» естественно сохраняет лексическую и богословскую напряжённость оригинала.
