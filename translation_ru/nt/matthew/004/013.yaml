source:
  edition: SBLGNT
  text: καὶ καταλιπὼν τὴν Ναζαρὰ ἐλθὼν κατῴκησεν εἰς Καφαρναοὺμ τὴν παραθαλασσίαν ἐν ὁρίοις Ζαβουλὼν καὶ Νεφθαλίμ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/013.yaml
  text: And leaving Nazara[a], he came and settled in Capernaum by the sea, in the region of Zebulun and Naphtali.
translation:
  language: ru
  text: Оставив Назару[a], Он пришёл в Капернаум, расположенный у моря, в землях Завулона и Неффалима, и поселился там.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'По-гречески: «Назара»; во многих переводах: «Назарет».'
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπὼν
  choice: оставив
  rationale: Аористное причастие передаёт действие, предшествующее основному глаголу; «оставив» естественно и точно сохраняет последовательность.
- source_word: Ναζαρὰ
  choice: Назару
  rationale: Передаёт именно форму Ναζαρά в исходном греческом тексте, а не более привычную форму «Назарет»; различие отмечено в сноске.
- source_word: ἐλθὼν
  choice: Он пришёл
  rationale: Аористное причастие естественно развёрнуто в личную глагольную форму, чтобы ясно передать последовательность действий по-русски.
- source_word: κατῴκησεν
  choice: поселился там
  rationale: Глагол обозначает обоснование или начало проживания; «поселился» передаёт это точнее, чем статическое «жил», а «там» естественно указывает на уже названный Капернаум.
- source_word: Καφαρναοὺμ
  choice: Капернаум
  rationale: Устоявшаяся русская форма географического названия.
- source_word: τὴν παραθαλασσίαν
  choice: расположенный у моря
  rationale: Определение относится к Капернауму; такой перевод ясно и естественно передаёт его местоположение у моря.
- source_word: ἐν ὁρίοις
  choice: в землях
  rationale: Множественное ὅρια здесь обозначает территорию или область; «в землях» кратко и естественно соответствует географическому контексту.
- source_word: Ζαβουλὼν
  choice: Завулона
  rationale: Устоявшаяся русская библейская форма имени колена и связанной с ним территории.
- source_word: Νεφθαλίμ
  choice: Неффалима
  rationale: Устоявшаяся русская библейская форма имени колена и связанной с ним территории.
