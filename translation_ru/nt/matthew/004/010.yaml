  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ὕπαγε, Σατανᾶ· γέγραπται γάρ· Κύριον τὸν θεόν σου προσκυνήσεις καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/010.yaml
  text: 'Then Jesus says to him, “Go away, Satan! For it is written: ‘You shall worship the Lord your God, and serve him only.’”'
translation:
  language: ru
  text: 'Тогда Иисус говорит ему: «Уйди, Сатана! Ибо написано: “Господу, Богу твоему, поклоняйся[a] и Ему одному служи[b]”».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «преклонись перед Господом, Богом твоим». Греческий глагол может обозначать поклон или падение ниц в знак почтения.'
    reason: lexical_alternative
  - marker: b
    text: Глагол, переведённый как «служи», может особо обозначать священное, религиозное служение Богу.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественно обозначает последовательность событий в повествовании.
- source_word: λέγει
  choice: говорит
  rationale: Историческое настоящее сохранено для передачи живости греческого повествования.
- source_word: Ὕπαγε
  choice: Отойди
  rationale: Передаёт повеление удалиться ясно и без архаического оттенка.
- source_word: Σατανᾶ
  choice: сатана
  rationale: Устоявшаяся передача имени или титула в форме обращения.
- source_word: γέγραπται
  choice: написано
  rationale: Устоявшаяся формула введения цитаты из Писания, отражающая результативное значение греческого перфекта.
- source_word: Κύριον τὸν θεόν σου
  choice: Господу, Богу твоему
  rationale: Дательный падеж в русском обусловлен глаголом «поклоняться»; приложение сохраняет связь титула «Господь» со словами «Бог твой».
- source_word: προσκυνήσεις
  choice: поклоняйся
  rationale: В контексте почитания Бога передаёт религиозный смысл глагола, сохраняя также образ преклонения.
- source_word: αὐτῷ μόνῳ
  choice: Ему одному
  rationale: 'Порядок слов ясно подчёркивает исключительность: служение должно быть обращено только к Богу.'
- source_word: λατρεύσεις
  choice: служи
  rationale: Сохраняет отличие от προσκυνήσεις и допускает присущий греческому слову смысл священного служения.
theological_decisions:
- issue: Различение προσκυνέω и λατρεύω
  choice: «поклоняйся» и «служи»
  alternative: Передать оба глагола словами с общим значением поклонения
  rationale: Греческий текст использует два разных, хотя и связанных глагола. Их различение сохраняет утверждение как о поклонении Богу, так и об исключительном служении Ему, не сужая и не расширяя смысл искусственно.
- issue: Объём значения προσκυνήσεις
  choice: 'Основной текст: «поклоняйся»; буквенный оттенок указан в сноске'
  alternative: «пади ниц перед» или «преклонись перед»
  rationale: «Поклоняйся» естественно в данном религиозном контексте, но сноска сохраняет телесный образ поклона или простирания, возможный в греческом глаголе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром библейской цитаты. Историческое настоящее «говорит» сохранено; обращение передано энергично, но без устаревшего «отойди прочь». Местоимение «Ему» написано с прописной буквы в рамках принятой русской библейской традиции.
