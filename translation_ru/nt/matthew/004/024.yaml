    rationale: Формула «находившихся под властью бесов» возможна по смыслу, но добавляет образ «власти», которого прямо нет в греческом. «Одержимых бесами» — устойчивое русское соответствие, а альтернативная менее техническая формулировка может быть дана в сноске.
  - severity: low
    issue: Неясная функция двоеточия в перечне
    rationale: После «страдавших различными болезнями и мучениями» двоеточие ошибочно создаёт впечатление, что далее следует расшифровка лишь этой части фразы. В греческом это единый ряд зависимых от «всех больных» определений.
  - severity: low
    issue: Вид глагола «приводили»
    rationale: Греческий аорист προσήνεγκαν в ряду завершённых повествовательных действий естественнее передать как «привели».
