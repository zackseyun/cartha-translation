  text: καὶ ἀπῆλθεν ἡ ἀκοὴ αὐτοῦ εἰς ὅλην τὴν Συρίαν· καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας ποικίλαις νόσοις καὶ βασάνοις ⸀συνεχομένους, δαιμονιζομένους καὶ σεληνιαζομένους καὶ παραλυτικούς, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/024.yaml
  text: And the report about him went out into all Syria[a], and they brought to him all who were sick, afflicted with various diseases and torments, those oppressed by demons, those having seizures, and paralytics[c][b], and he healed them.
translation:
  language: ru
  text: И весть о Нём разошлась по всей Сирии. К Нему привели всех больных, страдавших различными болезнями и мучениями, одержимых бесами[a], страдавших припадками[b] и парализованных, — и Он исцелил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «находившихся под властью бесов»; также возможно: «подвергавшихся бесовскому воздействию».'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово σεληνιαζομένους традиционно передавали как «страдавших эпилепсией»; буквально оно связано с представлением о воздействии луны.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκοὴ
  choice: весть
  rationale: Здесь слово означает то, что люди услышали об Иисусе, то есть распространившуюся весть, а не способность слышать.
- source_word: ἀπῆλθεν
  choice: разошлась
  rationale: Естественно передаёт метафору движения вести и её распространение, не меняя смысла на более отвлечённый.
- source_word: κακῶς ἔχοντας
  choice: больных
  rationale: Греческое идиоматическое выражение обозначает людей, которым нездоровится; «больных» ясно и естественно по-русски.
- source_word: ποικίλαις νόσοις καὶ βασάνοις συνεχομένους
  choice: страдавших различными болезнями и мучениями
  rationale: Сохраняет разнообразие болезней и интенсивность страдания, выраженную словами βασάνοις и συνεχομένους.
- source_word: δαιμονιζομένους
  choice: находившихся под властью бесов
  rationale: Передаёт реальность бесовского воздействия, но не превращает греческое причастие в более узкий современный технический термин.
- source_word: σεληνιαζομένους
  choice: страдавших припадками
  rationale: Понятно современному читателю обозначает проявление болезни, не утверждая предполагаемую связь с луной.
- source_word: παραλυτικούς
  choice: парализованных
  rationale: Точно и естественно обозначает людей, страдавших параличом.
- source_word: ἐθεράπευσεν
  choice: исцелил
  rationale: Обычное контекстуальное значение θεραπεύω; форма единственного числа относится к Иисусу.
theological_decisions:
- issue: Степень бесовского воздействия в δαιμονιζομένους
  choice: находившихся под властью бесов
  alternative: одержимых бесами
  rationale: Выбранная формулировка не устраняет сверхъестественный смысл, но и не навязывает более узкую классификацию, чем позволяет греческое слово; традиционный вариант приведён в сноске.
- issue: Передача σεληνιαζομένους и древней связи болезни с луной
  choice: страдавших припадками
  alternative: страдавших эпилепсией; буквально «подверженных влиянию луны»
  rationale: Основной текст сообщает наблюдаемое состояние понятным современным языком, а сноска сохраняет этимологическую и переводческую неоднозначность без утверждения древней причинной связи.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Двоеточие делает ясным, что следующие группы входят в общее обозначение «всех больных». Заглавные местоимения при упоминании Иисуса соответствуют распространённой русской библейской издательской практике.
