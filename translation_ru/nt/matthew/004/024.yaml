  verdict: revise
  source_fidelity: В целом переданы все смысловые элементы стиха. Однако «находившихся под властью бесов» несколько разворачивает греческое δαιμονιζομένους и менее прямо соответствует обычному значению причастия; «одержимых бесами» точнее и естественнее, при этом не снимает отмеченную в сноске лексическую широту. Аорист προσήνεγκαν в данном повествовательном ряду лучше передать совершенным видом «привели».
  naturalness: 'Двоеточие после «мучениями» неудачно: последующие группы не поясняют только «мучения», а продолжают перечисление людей, приведённых к Иисусу. Прямое однородное перечисление звучит естественнее. «Привели» также согласует вид с «разошлась» и «исцелил».'
  terminology: «Весть», «Сирия», «болезни», «мучения», «страдавшие припадками», «парализованные» и «исцелил» соответствуют современному литературному русскому и сохраняют регистр. Сноска к σεληνιαζομένους уместно сохраняет традиционный и буквальный аспекты слова, не утверждая древнюю этиологию.
