lexical_decisions:
- source_word: Ἀκούσας
  choice: Услышав
  rationale: Аористное причастие естественно передаёт действие, предшествующее основному глаголу; русское деепричастие сохраняет компактность и временную связь.
- source_word: δὲ
  choice: же
  rationale: Частица мягко обозначает переход в повествовании, не создавая сильного противопоставления.
- source_word: Ἰωάννης
  choice: Иоанн
  rationale: Традиционная и общепонятная русская форма библейского имени.
- source_word: παρεδόθη
  choice: был предан властям
  rationale: Сохраняет широкое значение пассивной формы παραδίδωμι — «быть переданным/выданным», а добавление «властям» естественно проясняет подразумеваемого получателя в контексте, не сводя значение исключительно к аресту.
- source_word: ἀνεχώρησεν
  choice: Иисус удалился
  rationale: «Удалился» передаёт уход в ответ на обстоятельства, не усиливая мотив до «бежал» или «отступил». Имя «Иисус» эксплицирует подразумеваемое из контекста подлежащее и устраняет возможную двусмысленность после упоминания Иоанна.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: в Галилею
  rationale: Нормальный современный русский способ передать направительное εἰς с названием области.
theological_decisions:
- issue: Передача παραδίδωμι применительно к Иоанну
  choice: был предан властям
  alternative: был арестован
  rationale: Основной текст сохраняет более широкое значение глагола и возможный повествовательный отзвук последующей передачи Иисуса, не утверждая сверх контекста; конкретное контекстуальное понимание «арестован» вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис краткий и ясный; частица «же» сохраняет лёгкую связующую функцию δέ.
