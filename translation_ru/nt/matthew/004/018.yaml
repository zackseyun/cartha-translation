base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/018.yaml
  text: As he was walking beside the Sea of Galilee[a], he saw two brothers, Simon who is called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.
translation:
  language: ru
  text: Идя вдоль Галилейского моря, Он увидел двух братьев — Симона, называемого Петром, и его брата Андрея, — забрасывавших сеть[a] в море, ведь они были рыбаками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бросковую сеть» — сеть, которую забрасывали при ловле рыбы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περιπατῶν δὲ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: Идя вдоль Галилейского моря
  rationale: Настоящее причастие передаёт действие, одновременное с εἶδεν; «идя вдоль» естественно выражает движение рядом с берегом. Частица δέ здесь служит повествовательному переходу и отдельно не переводится.
- source_word: εἶδεν
  choice: Он увидел
  rationale: Аорист передан простым повествовательным прошедшим временем; местоимение делает русского субъекта явным после деепричастного оборота.
- source_word: δύο ἀδελφούς
  choice: двух братьев
  rationale: Речь идёт о двух родных братьях-мужчинах, что далее подтверждено именами и уточнением родства.
- source_word: Σίμωνα τὸν λεγόμενον Πέτρον
  choice: Симона, называемого Петром
  rationale: Причастная конструкция сохранена естественным для литературного русского языка оборотом без превращения прозвища в уже установленное второе имя.
- source_word: Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ
  choice: его брата Андрея
  rationale: Порядок слов перестроен по нормам русского языка; αὐτοῦ соотнесено с Симоном.
- source_word: βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν
  choice: забрасывавших в море сеть[a]
  rationale: Настоящее причастие описывает занятие братьев в момент, когда Иисус их увидел. ἀμφίβληστρον обозначает бросковую рыболовную сеть; в тексте выбран понятный общий термин, а специфика дана в примечании.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: потому что они были рыбаками
  rationale: γάρ вводит пояснение; «потому что» ясно и естественно передаёт причинно-пояснительную связь. Мужской род соответствует названным лицам.
