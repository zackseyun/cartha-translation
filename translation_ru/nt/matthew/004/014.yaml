  text: ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/014.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled, saying:'
translation:
  language: ru
  text: 'чтобы исполнилось сказанное через пророка Исаию:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно вводит придаточное цели или результата и сохраняет целевую направленность греческой конструкции.
- source_word: πληρωθῇ
  choice: исполнилось
  rationale: Форма совершенного вида передаёт аорист, а возвратная форма естественно выражает греческий пассив; в Евангелии от Матфея это устойчивый язык исполнения Писания.
- source_word: τὸ ῥηθὲν
  choice: сказанное
  rationale: Субстантивированное причастие точно и естественно соответствует греческой конструкции «то, что было сказано».
- source_word: διὰ
  choice: через
  rationale: 'Сохраняет значение посредничества: пророк представлен как тот, через кого прозвучало слово.'
- source_word: Ἠσαΐου
  choice: Исаию
  rationale: Употреблена общепринятая русская форма имени в винительном падеже после предлога «через».
- source_word: τοῦ προφήτου
  choice: пророка
  rationale: Приложение сохранено явно и естественно встроено в русское словосочетание «через пророка Исаию».
- source_word: λέγοντος
  choice: ':'
  rationale: В русском языке функцию причастия, вводящего следующую прямую цитату, естественно передаёт двоеточие; добавление «говорящего» было бы тяжеловесным, а «который сказал» могло бы неуместно сместить акцент.
theological_decisions:
- issue: Формула исполнения Писания у Матфея
  choice: «чтобы исполнилось»
  alternative: «чтобы сбылось»
  rationale: Глагол «исполнилось» сохраняет характерный для Матфея мотив исполнения Писания и не расширяет его богословский смысл сверх текста.
- issue: Посредничество пророка
  choice: «сказанное через пророка Исаию»
  alternative: «сказанное пророком Исаией»
  rationale: Предлог «через» точнее сохраняет διά и оставляет открытым подразумеваемый высший источник пророческого слова, не добавляя его прямо.
translation_notes:
  register: Современный литературный русский, краткий и достойный библейского повествования. Порядок «пророка Исаию» естественен для русского языка. Двоеточие ясно вводит цитату следующего стиха без буквального и неестественного «говорящего».
