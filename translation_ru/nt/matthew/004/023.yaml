id: MAT.4.23
reference: Matthew 4:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ⸂ἐν ὅλῃ τῇ Γαλιλαίᾳ⸃, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν μαλακίαν ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/023.yaml
  text: And he went throughout all Galilee[a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness among the people.
translation:
  language: ru
  text: Иисус ходил по всей Галилее, учил в их синагогах, возвещал Добрую весть[a] о Царстве и исцелял всякую болезнь и всякий недуг среди народа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Евангелие Царства».'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: ходил
  rationale: Имперфект передаёт продолжительное странствование Иисуса по области; русское «ходил» естественно выражает повторяющееся передвижение.
- source_word: ἐν ὅλῃ τῇ Γαλιλαίᾳ
  choice: по всей Галилее
  rationale: При глаголе движения сочетание имеет распределительное значение и указывает на передвижение по всей области.
- source_word: διδάσκων
  choice: уча
  rationale: Деепричастие передаёт действие, одновременное с основным глаголом.
- source_word: συναγωγαῖς αὐτῶν
  choice: в их синагогах
  rationale: Сохранено притяжательное местоимение; «синагоги» — точное и общеупотребительное обозначение иудейских мест собрания.
- source_word: κηρύσσων
  choice: возвещая
  rationale: Передаёт публичное и авторитетное провозглашение, оставаясь естественным для современного литературного русского языка.
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: Добрую весть о Царстве
  rationale: «Добрая весть» прозрачно передаёт значение εὐαγγέλιον, а «о Царстве» естественно выражает смысловое содержание родительного τῆς βασιλείας без устранения связи вести с Царством.
- source_word: θεραπεύων
  choice: исцеляя
  rationale: В данном контексте глагол обозначает действительное исцеление.
- source_word: πᾶσαν νόσον
  choice: всякую болезнь
  rationale: Сохраняет первое πᾶσαν и различает νόσος от следующего μαλακίαν.
- source_word: πᾶσαν μαλακίαν
  choice: всякий недуг
  rationale: «Недуг» естественно обозначает болезненное состояние или немощь и позволяет сохранить парную всеохватную формулу.
- source_word: ἐν τῷ λαῷ
  choice: среди народа
  rationale: Идиоматично передаёт сферу, в которой происходили исцеления.
theological_decisions:
- issue: Передача εὐαγγέλιον τῆς βασιλείας
  choice: Добрая весть о Царстве
  alternative: Евангелие Царства
  rationale: Основной вариант непосредственно раскрывает лексическое значение εὐαγγέλιον и естественно указывает содержание вести. Традиционный вариант возможен, но для обычного современного читателя менее прозрачен.
- issue: Всеохватность πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: всякую болезнь и всякий недуг
  alternative: все болезни и недуги
  rationale: Повтор «всякую/всякий» сохраняет двойное πᾶσαν и подчёркнутую всеохватность формулировки, не добавляя утверждений сверх текста.
- issue: Явное называние подлежащего
  choice: Иисус
  alternative: он
  rationale: Греческое подлежащее подразумевается формой глагола и определяется ближайшим контекстом как Иисус. Имя делает отдельный русский стих ясным, не меняя его содержания.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены параллельные деепричастные конструкции и повтор «всякую/всякий». «Царство» написано с прописной буквы как обозначение Божьего Царства в данном контексте.
