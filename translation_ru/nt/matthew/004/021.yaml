review_pass:
  verdict: revise
  source_fidelity: В целом переданы движение, дополнительная пара братьев, их родство, пребывание в лодке с отцом, починка сетей и последовавший призыв. Однако «немного дальше» добавляет ограничение расстояния, которого нет ни в προβὰς, ни в ἐκεῖθεν.
  naturalness: Исправленный вариант сохраняет современный литературный русский и связный повествовательный ритм. Одно предложение с деепричастным оборотом и перечислением точнее отражает синтаксические связи оригинала, не становясь тяжеловесным.
  terminology: Имена «Иаков», «Иоанн», «Зеведей» нормативны для русской библейской традиции. «Лодка», «чинить сети» и «позвал их» точны в данном контексте. «Позвал» не разворачивает καλέω в доктринально окрашенное пояснение.
