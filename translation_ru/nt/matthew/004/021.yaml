source:
  edition: SBLGNT
  text: Καὶ προβὰς ἐκεῖθεν εἶδεν ἄλλους δύο ἀδελφούς, Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, ἐν τῷ πλοίῳ μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν καταρτίζοντας τὰ δίκτυα αὐτῶν, καὶ ἐκάλεσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/021.yaml
  text: And going on from there, he saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and he called them.
translation:
  language: ru
  text: Пройдя оттуда дальше, Он увидел ещё двух братьев — Иакова, сына Зеведея, и Иоанна, его брата, — в лодке с их отцом Зеведеем, чинивших свои сети; и Он позвал их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβὰς ἐκεῖθεν
  choice: Отойдя оттуда немного дальше
  rationale: Сочетание передаёт продолжение движения от прежнего места; «немного» естественно выражает идею дальнейшего продвижения, не задавая точного расстояния.
- source_word: εἶδεν
  choice: увидел
  rationale: Простое повествовательное значение ὁράω без усиления до «заметил».
- source_word: ἄλλους δύο ἀδελφούς
  choice: ещё двух братьев
  rationale: «Ещё» ясно указывает, что это другая пара братьев после ранее упомянутых Симона и Андрея.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: Иакова, сына Зеведея
  rationale: Генитивная конструкция обозначает происхождение; в русском её естественно раскрыть словом «сына».
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: его брата Иоанна
  rationale: Местоимение относится к Иакову; выбранный порядок слов естественен для современного русского повествования.
- source_word: ἐν τῷ πλοίῳ
  choice: в лодке
  rationale: В данном рыболовном контексте πλοῖον означает лодку, а не крупное судно.
- source_word: μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν
  choice: со своим отцом Зеведеем
  rationale: Передано сопровождение и общее для братьев родство; «своим» устраняет возможную двусмысленность.
- source_word: καταρτίζοντας τὰ δίκτυα αὐτῶν
  choice: чинили сети
  rationale: В рыболовном контексте καταρτίζω означает приводить сети в исправное состояние; «чинили» — точное и современное выражение.
- source_word: ἐκάλεσεν αὐτούς
  choice: Он позвал их
  rationale: Сохраняется простое значение καλέω; контекст сообщает, что речь идёт о призвании учеников, без добавления отсутствующего здесь «следовать за Ним».
theological_decisions:
- issue: Подразумеваемое призвание к ученичеству в ἐκάλεσεν
  choice: Он позвал их
  alternative: Он призвал их следовать за Ним
  rationale: Контекст ясно указывает на призвание к ученичеству, однако сам стих не называет его содержание. Перевод сохраняет лаконичность исходного текста и не добавляет пояснение внутрь стиха.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Длинное греческое предложение разделено на три русских без потери связей между участниками и действиями. Местоимение «Он» написано с прописной буквы в соответствии с распространённой русской библейской издательской практикой.
