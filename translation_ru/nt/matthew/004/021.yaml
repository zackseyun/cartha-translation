revisions:
- from: Отойдя оттуда немного дальше, Он увидел ещё двух братьев — Иакова, сына Зеведея, и его брата Иоанна. Они были в лодке со своим отцом Зеведеем и чинили сети. И Он позвал их.
  to: Пройдя оттуда дальше, Он увидел ещё двух братьев — Иакова, сына Зеведея, и Иоанна, его брата, — в лодке с их отцом Зеведеем, чинивших свои сети; и Он позвал их.
  rationale: Удалено не имеющее опоры в оригинале «немного». Порядок и синтаксис уточнены так, чтобы «его брата» однозначно относилось к Иакову, а нахождение в лодке и починка сетей — к обоим братьям. Смысл простого «позвал их» сохранён без добавления содержания призыва.
  reviewer_model: gpt-5.6-terra
