  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τότε ἀφίησιν αὐτὸν ὁ διάβολος, καὶ ἰδοὺ ἄγγελοι προσῆλθον καὶ διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/011.yaml
  text: Then the devil left him[a], and behold, angels came and were ministering to him.
translation:
  language: ru
  text: Тогда дьявол оставил Его, и вот, ангелы подошли и служили Ему.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ангелы пришли и служили Ему». Греческий глагол стоит в имперфекте и указывает на продолжавшееся действие.'
    reason: Альтернативная передача προσῆλθον и пояснение длительного значения имперфекта без добавления начинательного оттенка.
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественный повествовательный указатель последовательности событий.
- source_word: ἀφίησιν
  choice: оставил
  rationale: Историческое настоящее передано прошедшим временем, естественным для русского повествования; в контексте глагол означает, что дьявол удалился от Иисуса.
- source_word: ὁ διάβολος
  choice: дьявол
  rationale: В рассказе об искушении слово служит устойчивым обозначением сатаны; буквальное «клеветник» здесь затемнило бы референцию.
- source_word: ἰδοὺ
  choice: и вот
  rationale: Сохраняет маркер внезапного привлечения внимания и при этом звучит естественно в современном литературном русском.
- source_word: ἄγγελοι
  choice: ангелы
  rationale: Контекст указывает на небесных существ, а не на человеческих посланников.
- source_word: προσῆλθον
  choice: подошли
  rationale: Передаёт значение приближения точнее, чем общее «пришли», и естественно сочетается с последующим служением.
- source_word: διηκόνουν
  choice: служили
  rationale: Русская форма несовершенного вида передаёт продолжавшееся действие имперфекта; «служили» сохраняет широкий смысл заботы и служения без излишней конкретизации.
- source_word: αὐτῷ
  choice: Ему
  rationale: Дательный падеж ясно обозначает Иисуса как того, кому служили ангелы; прописная буква соответствует принятому достоинственному русскому библейскому регистру.
theological_decisions:
- issue: Передача διάβολος как личного обозначения в рассказе об искушении
  choice: дьявол
  alternative: клеветник
  rationale: В данном контексте это личное обозначение противника Иисуса. «Дьявол» обеспечивает ясность, не добавляя конфессионального толкования.
- issue: Характер служения ангелов
  choice: служили Ему
  alternative: прислуживали Ему
  rationale: Греческий текст не уточняет конкретный вид помощи. Более широкое «служили» сохраняет смысловую открытость и не сводит действие к бытовому обслуживанию.
translation_notes:
  register: Современный литературный русский с достоинственным библейским звучанием. Историческое настоящее передано прошедшим временем; частица «и вот» сохранена как выразительный повествовательный маркер.
