source:
  edition: SBLGNT
  text: Πάλιν παραλαμβάνει αὐτὸν ὁ διάβολος εἰς ὄρος ὑψηλὸν λίαν, καὶ δείκνυσιν αὐτῷ πάσας τὰς βασιλείας τοῦ κόσμου καὶ τὴν δόξαν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/008.yaml
  text: Again[a], the devil takes him to a very high mountain and shows him all the kingdoms of the world and their glory.
translation:
  language: ru
  text: И вновь дьявол берёт его на очень высокую гору и показывает ему все царства мира и их славу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их великолепие».'
    reason: Контекстуальный вариант для δόξα, подчёркивающий видимый блеск и величие царств.
lexical_decisions:
- source_word: Πάλιν
  choice: И вновь
  rationale: Передаёт повторение в последовательности искушений и естественно связывает этот эпизод с предыдущим.
- source_word: παραλαμβάνει
  choice: берёт
  rationale: Сохраняет историческое настоящее греческого повествования и не добавляет отсутствующих в тексте подробностей о способе перемещения.
- source_word: ὁ διάβολος
  choice: дьявол
  rationale: В данном контексте это устойчивое наименование противника; такой перевод ясен и общепринят в современном русском языке.
- source_word: εἰς ὄρος ὑψηλὸν λίαν
  choice: на очень высокую гору
  rationale: Предлог «на» естественно передаёт направленное движение к вершине или на гору, а «очень» сохраняет усилительное значение λίαν.
- source_word: δείκνυσιν
  choice: показывает
  rationale: Прямой и нейтральный эквивалент, сохраняющий историческое настоящее.
- source_word: πάσας τὰς βασιλείας
  choice: все царства
  rationale: Сохраняет всеохватность πάσας и политико-царственное значение βασιλείας.
- source_word: τοῦ κόσμου
  choice: мира
  rationale: Наиболее естественный русский эквивалент κόσμος в данном контексте.
- source_word: τὴν δόξαν αὐτῶν
  choice: их славу
  rationale: Сохраняет основное и богословски значимое значение δόξα, тогда как контекстуальное «великолепие» приведено в примечании.
theological_decisions:
- issue: Характер показа всех царств с очень высокой горы
  choice: Передать событие так, как оно изложено в повествовании, не уточняя способ показа.
  alternative: Истолковать показ как буквальный географический обзор либо как сверхъестественное видение.
  rationale: Греческий текст не объясняет, каким образом были показаны все царства мира; перевод сохраняет эту намеренную неопределённость.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно торжественным повествовательным звучанием. Историческое настоящее оригинала сохранено. Местоимения, относящиеся к Иисусу, даны со строчной буквы в соответствии с обычной современной орфографией и без внесения отсутствующего в греческом тексте графического разграничения.
