  text: οἱ δὲ εὐθέως ἀφέντες τὰ δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/020.yaml
  text: And they immediately left the nets and followed him.
translation:
  language: ru
  text: Они же тотчас оставили сети и последовали за Ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: же
  rationale: Частица мягко связывает предложение с предыдущим повествованием и слегка выделяет ответ учеников, не создавая резкого противопоставления.
- source_word: εὐθέως
  choice: тотчас
  rationale: Передаёт незамедлительность реакции и сохраняет достойный, естественный для библейского повествования регистр.
- source_word: ἀφέντες
  choice: оставили
  rationale: 'Аористное причастие обозначает действие, предшествующее основному: сначала они оставили сети, затем последовали. Сочинённая конструкция естественна по-русски и не усиливает смысл до «бросили» или «покинули навсегда».'
- source_word: τὰ δίκτυα
  choice: сети
  rationale: В контексте ясно, что речь идёт о рыболовных сетях; добавление «свои» или «рыболовные» не требуется и отсутствует в греческом тексте.
- source_word: ἠκολούθησαν αὐτῷ
  choice: последовали за Ним
  rationale: Естественно передаёт конструкцию ἀκολουθέω с дательным падежом и сохраняет как буквальное движение вслед за Иисусом, так и возникающий смысл ученичества.
theological_decisions:
- issue: Оттенок ученичества в ἠκολούθησαν αὐτῷ
  choice: последовали за Ним
  alternative: пошли за Ним
  rationale: «Последовали за Ним» сохраняет одновременно буквальный и ученический смысл, не делая богословский подтекст более явным, чем в исходном тексте.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным повествовательным звучанием. Порядок слов сохраняет акцент на немедленном отклике. Местоимение «Ним» написано с прописной буквы в соответствии с распространённой русской библейской издательской традицией.
