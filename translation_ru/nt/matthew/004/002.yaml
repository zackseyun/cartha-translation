lexical_decisions:
- source_word: νηστεύσας
  choice: постившись
  rationale: Деепричастие естественно передаёт предшествующее действие аористного причастия и сохраняет связь с главным глаголом.
- source_word: ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα
  choice: сорок дней и сорок ночей
  rationale: Винительный длительности передан естественной русской конструкцией без добавления предлога; сохраняется библейская ритмика.
- source_word: ὕστερον
  choice: потом
  rationale: Передаёт временную последовательность, явно выраженную в греческом тексте, не сливая её с причастным оборотом.
- source_word: ἐπείνασεν
  choice: почувствовал голод
  rationale: Естественная современная формулировка передаёт наступление голода после поста; она точнее в этом контексте, чем статическое «был голоден».
- source_word: καὶ
  choice: И
  rationale: Сохраняет простой повествовательный союз и связь с предыдущим стихом.
theological_decisions:
- issue: Подчёркивание подлинной человеческой потребности Иисуса после поста
  choice: Он потом почувствовал голод
  alternative: Он потом проголодался
  rationale: Формулировка ясно сообщает о реальном физическом голоде, не превращая это наблюдение в дополнительное догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык; тон простой и достойный. Местоимение «Он» написано с прописной буквы в соответствии с принятой русской библейской традицией, без добавления имени, отсутствующего в стихе.
