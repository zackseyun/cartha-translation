source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν κάτω· γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ καὶ ἐπὶ χειρῶν ἀροῦσίν σε, μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/006.yaml
  text: 'And he said to him[a], “If you are the Son of God, throw yourself down, for it is written: ‘He will command his angels concerning you,’ and ‘On their hands they will lift you up[b], lest you strike your foot against a stone.’”'
translation:
  language: ru
  text: 'И говорит Ему: «Если Ты Сын Божий, бросься вниз, ведь написано: “Ангелам Своим Он повелит о Тебе”, и: “На руках они понесут Тебя[a], чтобы Ты не ударился ногой о камень”».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поднимут Тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: говорит
  rationale: 'Историческое настоящее сохранено: по-русски оно естественно передаёт живость повествования и прямо соответствует греческой форме.'
- source_word: Εἰ
  choice: Если
  rationale: Сохраняет условную и испытующую силу реплики, не превращая её в утверждение.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: Сын Божий
  rationale: В контексте Матфея это титульное обозначение; русский язык естественно передаёт его без артикля, с прописных букв.
- source_word: βάλε σεαυτὸν κάτω
  choice: бросься вниз
  rationale: Современное и ясное соответствие повелительной форме с возвратным местоимением; передаёт намеренное падение с высоты.
- source_word: γέγραπται
  choice: написано
  rationale: Устоявшаяся русская формула цитирования Писания, сохраняющая результативное значение греческого перфекта.
- source_word: ἐντελεῖται
  choice: повелит
  rationale: Передаёт авторитетное распоряжение в будущем времени.
- source_word: περὶ σοῦ
  choice: о Тебе
  rationale: Прямое и естественное соответствие περί с родительным падежом.
- source_word: ἐπὶ χειρῶν
  choice: На руках
  rationale: Сохраняет образ поддержки на руках и значение ἐπί с родительным падежом.
- source_word: ἀροῦσίν σε
  choice: они понесут Тебя
  rationale: В данном образе αἴρω означает поднять и нести; «понесут» естественно сочетается с выражением «на руках».
- source_word: μήποτε προσκόψῃς
  choice: чтобы Ты не ударился
  rationale: Передаёт предупредительно-предохранительное значение μήποτε и конкретный образ удара ногой.
- source_word: πρὸς λίθον
  choice: о камень
  rationale: Идиоматическое русское выражение для удара о предмет; неопределённость греческого существительного не требует добавления указательности.
- source_word: τὸν πόδα σου
  choice: ногой
  rationale: Сохраняет единственное число и естественно звучит с русским глаголом «удариться».
theological_decisions:
- issue: Христологическая сила выражения «Сын Божий» в вызове искусителя
  choice: Титульное «Сын Божий»
  alternative: Родовое обозначение «сын Бога»
  rationale: В повествовательном контексте Матфея выражение служит признанным титулом; перевод сохраняет это значение, не добавляя к тексту дальнейших догматических пояснений.
- issue: Цитирование псалма дьяволом
  choice: Цитата передана без исправления или истолкования в основном тексте
  alternative: Добавить в текст пояснение о неверном применении Писания
  rationale: Греческий текст представляет слова как цитату искусителя; перевод сохраняет заложенное богословское напряжение и не вставляет комментарий в речь.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Историческое настоящее сохранено. Прописные буквы в местоимениях, относящихся к Богу и Сыну Божьему, применены последовательно в рамках принятого русского библейского регистра. Цитата оформлена внутри прямой речи; добавлен только один маркер [a], присутствующий и в основном тексте, и в сноске.
