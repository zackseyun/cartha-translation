  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοὶ ἀπὸ τῆς Γαλιλαίας καὶ Δεκαπόλεως καὶ Ἱεροσολύμων καὶ Ἰουδαίας καὶ πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/025.yaml
  text: And large crowds followed him from Galilee and the Decapolis and Jerusalem and Judea and beyond the Jordan[a].
translation:
  language: ru
  text: И за Ним последовали многочисленные толпы из Галилеи, Десятиградия, Иерусалима, Иудеи и с той стороны Иордана[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из Заиорданья».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: последовали
  rationale: Аорист ἀκολουθέω естественно передаётся повествовательной формой «последовали»; она сохраняет как буквальное следование за Иисусом, так и возможный оттенок возникающего интереса, не утверждая полного ученичества.
- source_word: ὄχλοι πολλοὶ
  choice: большие толпы
  rationale: Сочетание указывает на многочисленность и масштаб собравшихся; «большие толпы» — естественное современное русское выражение.
- source_word: ἀπὸ
  choice: из / с
  rationale: Предлог обозначает происхождение людей из перечисленных областей; перед названиями территорий естественно «из», а в обороте о противоположной стороне Иордана — «с».
- source_word: Γαλιλαίας
  choice: Галилеи
  rationale: Устоявшееся русское название области в форме родительного падежа после «из».
- source_word: Δεκαπόλεως
  choice: Десятиградия
  rationale: Устоявшееся русское географическое название области десяти городов; форма позволяет обычному читателю распознать смысл названия.
- source_word: Ἱεροσολύμων
  choice: Иерусалима
  rationale: Устоявшаяся русская форма названия города; греческая морфологическая множественность в русском не воспроизводится.
- source_word: Ἰουδαίας
  choice: Иудеи
  rationale: Устоявшееся русское название области.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: с той стороны Иордана
  rationale: Оборот передаёт пространственное значение «по ту сторону / за Иорданом» и вместе с подразумеваемым ἀπό указывает, откуда пришли толпы.
- source_word: καὶ ... καὶ ... καὶ
  choice: и ... и
  rationale: Завершающий союз сохраняет накопительный характер географического перечня, тогда как бессоюзное перечисление внутри ряда соответствует естественному русскому синтаксису.
