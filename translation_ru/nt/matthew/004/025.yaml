  naturalness: Фраза в целом звучит естественно в современном литературном русском. «Многочисленные толпы» точнее передаёт количественный смысл и столь же естественно в повествовательном регистре.
  terminology: «Десятиградие», «Галилея», «Иудея» и «Иерусалим» — устоявшиеся русские формы. «Заиорданье» в сноске является допустимым кратким географическим вариантом. Написание «Ним» соответствует заявленной библейской издательской норме.
