  text: οἱ δὲ εὐθέως ἀφέντες τὸ πλοῖον καὶ τὸν πατέρα αὐτῶν ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/022.yaml
  text: And they immediately left the boat and their father and followed him[a].
translation:
  language: ru
  text: Они же тотчас[a] оставили лодку и своего отца и последовали за Ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сразу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: же
  rationale: Частица мягко связывает стих с предшествующим повествованием; «же» естественно продолжает рассказ, не создавая сильного противопоставления.
- source_word: εὐθέως
  choice: тотчас
  rationale: Передаёт подчёркнутую незамедлительность реакции и сохраняет характерную для Матфея повествовательную выразительность.
- source_word: ἀφέντες
  choice: оставили
  rationale: Аористное причастие обозначает действие, предшествующее следованию; личная форма естественна по-русски и не усиливает смысл до окончательного отречения.
- source_word: τὸ πλοῖον
  choice: лодку
  rationale: В данном контексте рыболовное судно естественнее назвать лодкой, а не кораблём.
- source_word: τὸν πατέρα αὐτῶν
  choice: своего отца
  rationale: Возвратное притяжательное местоимение ясно соотносит отца с подлежащим и естественно звучит в современном русском языке.
- source_word: ἠκολούθησαν αὐτῷ
  choice: последовали за Ним
  rationale: Передаёт как буквальное движение вслед за Иисусом, так и возникающий в повествовании смысл ученичества.
- source_word: οἱ
  choice: они
  rationale: Субстантивированное артиклевое выражение отсылает к двум ранее названным братьям; по-русски требуется явное местоимение.
theological_decisions:
- issue: Ответ на призыв к ученичеству и расставание с отцом
  choice: Прямо передать немедленное оставление лодки и отца ради следования за Иисусом, не утверждая, что разлука непременно была окончательной.
  alternative: «покинули» или «отреклись от» с оттенком полного и постоянного разрыва
  rationale: Греческое ἀφέντες подчёркивает решительный уход в этот момент, но само по себе не определяет продолжительность разлуки и не требует более сильной богословской формулировки.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Тотчас» несколько возвышенно, но понятно и точно; местоимение «Ним» оформлено с традиционной прописной буквы при указании на Иисуса.
