  text: καὶ προσελθὼν ⸂ὁ πειράζων εἶπεν αὐτῷ⸃· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ ἵνα οἱ λίθοι οὗτοι ἄρτοι γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/003.yaml
  text: And the tempter came and said to him[a], “If you are the Son of God[b], tell these stones to become bread.”
translation:
  language: ru
  text: 'Искуситель подошёл к Нему и сказал: «Если Ты Сын Божий[a], скажи, чтобы эти камни стали хлебами[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Раз Ты Сын Божий». Греческое условие может выражать вызов, а не просто сомнение.'
    reason: alternative_reading
  - marker: b
    text: Греческое слово стоит во множественном числе и может означать отдельные хлебы или буханки.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: подойдя
  rationale: Деепричастие естественно передаёт предшествующее главному глаголу движение к Иисусу и сохраняет синтаксическую связь греческого аористного причастия.
- source_word: ὁ πειράζων
  choice: искуситель
  rationale: Субстантивированное причастие обозначает того, кто искушает; «искуситель» — ясное и устойчивое русское наименование в данном контексте.
- source_word: Εἰ
  choice: если
  rationale: Сохраняет форму греческого условия и не решает однозначно, выражает ли говорящий сомнение, предположение или вызывающую проверку.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: Сын Божий
  rationale: Предикативное безартиклевое υἱός здесь выражает известный христологический титул, а не принадлежность к неопределённому классу.
- source_word: εἰπὲ ἵνα
  choice: вели, чтобы
  rationale: Передаёт побудительно-результативную конструкцию естественным русским оборотом; в контексте речь имеет действенную силу, хотя сам глагол буквально означает «скажи».
- source_word: οἱ λίθοι οὗτοι
  choice: эти камни
  rationale: Прямо передаёт существительное и указательное местоимение.
- source_word: ἄρτοι
  choice: хлебами
  rationale: Сохраняет множественное число греческого ἄρτοι; русское «хлебами» может обозначать отдельные хлебы или буханки без громоздкого пояснения.
- source_word: γένωνται
  choice: стали
  rationale: Нейтрально и естественно передаёт значение γίνομαι «стать, сделаться».
theological_decisions:
- issue: Смысл условия Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: «Если Ты Сын Божий»
  alternative: «Раз Ты Сын Божий» / «Если Ты действительно Сын Божий»
  rationale: 'Простое «если» сохраняет неоднозначность греческой условной конструкции: это может быть не выражение сомнения, а провокационный вызов.'
- issue: Титул υἱὸς τοῦ θεοῦ
  choice: «Сын Божий»
  alternative: «сын Бога» / «один из сынов Бога»
  rationale: Контекст Евангелия от Матфея указывает на определённый титул Иисуса; перевод не добавляет толкования, но и не превращает титул в неопределённую характеристику.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Заглавные местоимения в обращении к Иисусу соответствуют распространённой русской издательской норме. «Вели, чтобы» выбрано как естественная передача речевого повеления; «хлебами» сохраняет заметное множественное число оригинала.
