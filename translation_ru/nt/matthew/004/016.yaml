  text: ὁ λαὸς ὁ καθήμενος ἐν ⸀σκοτίᾳ ⸂φῶς εἶδεν⸃ μέγα, καὶ τοῖς καθημένοις ἐν χώρᾳ καὶ σκιᾷ θανάτου φῶς ἀνέτειλεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/016.yaml
  text: The people sitting in darkness saw a great light[a], and on those sitting in the region and shadow of death, a light dawned.
translation:
  language: ru
  text: Народ, сидящий во тьме, увидел великий свет, и для тех, кто сидит в краю и тени смерти, взошёл свет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαὸς
  choice: народ
  rationale: Естественное собирательное обозначение людей; не сужает смысл до политической нации или отдельной этнической группы.
- source_word: καθήμενος / καθημένοις
  choice: сидящий / сидящими
  rationale: Сохраняет буквальный образ, параллелизм двух частей стиха и связь с пророческой цитатой из Исаии.
- source_word: σκοτίᾳ
  choice: тьме
  rationale: Передаёт как прямой, так и переносный смысл, не определяя тьму исключительно как духовную, нравственную или политическую.
- source_word: φῶς εἶδεν μέγα
  choice: увидел великий свет
  rationale: Аорист передан прошедшим временем; «великий свет» сохраняет возвышенный пророческий регистр и силу образа.
- source_word: χώρᾳ
  choice: стране
  rationale: В данном поэтическом контексте означает землю или область пребывания; «страна» звучит естественно и не обязана обозначать современное государство.
- source_word: σκιᾷ θανάτου
  choice: тени смерти
  rationale: Точно сохраняет явное θανάτου («смерти») и узнаваемый библейский образ, не заменяя его толкованием «глубокая тьма».
- source_word: ἀνέτειλεν
  choice: взошёл
  rationale: Глагол передаёт восход небесного светила; сочетание «взошёл свет» сохраняет исходную метафору и возвышенную естественность.
- source_word: αὐτοῖς
  choice: над сидящими
  rationale: Русская конструкция «свет взошёл над ними» естественно выражает направленность действия к людям; адресаты явно названы причастным оборотом.
theological_decisions:
- issue: Характер образов тьмы и света
  choice: Сохранить образы без уточнения их духовного, нравственного, политического или экзистенциального значения.
  alternative: Явно истолковать тьму как грех или неведение язычников, а свет — как спасительное откровение Мессии.
  rationale: Греческий текст в этом предложении не ограничивает многозначные пророческие образы одним толкованием; перевод не должен устранять эту богословскую ёмкость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксический параллелизм и повтор слова «свет» сохранены; архаичные формы и добавочные толкования исключены.
