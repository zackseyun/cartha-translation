base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/019.yaml
  text: And he says to them[a], “Come after me, and I will make you fishers of men.”
translation:
  language: ru
  text: 'И говорит им: «Идите за мной, и я сделаю вас ловцами людей».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время сохраняет греческий исторический презенс, естественный для евангельского повествования и допустимый в русском нарративе.
- source_word: Δεῦτε ὀπίσω μου
  choice: идите за мной
  rationale: Естественный русский призыв, передающий и побуждение Δεῦτε, и образ следования, выраженный ὀπίσω μου, без излишне буквального «идите позади меня».
- source_word: ποιήσω ὑμᾶς
  choice: я сделаю вас
  rationale: Прямо передаёт будущее действие Иисуса и сохраняет преобразующий смысл конструкции.
- source_word: ἁλιεῖς ἀνθρώπων
  choice: ловцами людей
  rationale: Сохраняет метафору рыболовства и общий смысл ἀνθρώπων — людей как человеческих существ; русское «людей» не требует гендерного уточнения.
theological_decisions:
- issue: Метафорический смысл ἁλιεῖς ἀνθρώπων
  choice: ловцами людей
  alternative: рыбаками, ловящими людей
  rationale: Краткая исходная метафора сохраняется без пояснительного расширения и без привнесения особого учения о характере будущего служения учеников.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Местоимения, относящиеся к Иисусу, даны со строчной буквы по обычным нормам современного русского издания; историческое настоящее сохранено.
