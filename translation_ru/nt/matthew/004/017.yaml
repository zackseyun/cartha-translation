  text: Ἀπὸ τότε ἤρξατο ὁ Ἰησοῦς κηρύσσειν καὶ λέγειν· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/017.yaml
  text: From that time Jesus began to proclaim[a], saying, “Repent[c][b], for the kingdom of heaven has drawn near.”
translation:
  language: ru
  text: 'С того времени Иисус начал проповедовать: «Покайтесь, потому что приблизилось Царство Небес[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Царство небес». В греческом стоит множественное число; это характерное для Евангелия от Матфея выражение, часто соответствующее формуле «Царство Бога» в других новозаветных контекстах. «Приблизилось» можно также перевести: «стало близко»; греческий перфект подчёркивает, что близость наступила и остаётся действительной.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: С того времени
  rationale: Передаёт временной переход и поворотный момент повествования без добавочного толкования.
- source_word: ἤρξατο
  choice: начал
  rationale: Прямой и естественный эквивалент глагола начала действия с последующим инфинитивом.
- source_word: κηρύσσειν καὶ λέγειν
  choice: 'проповедовать:'
  rationale: В данном контексте λέγειν вводит содержание возвещения. Двоеточие естественно передаёт эту связь по-русски и избегает тяжеловесного «проповедовать и говорить».
- source_word: Μετανοεῖτε
  choice: Покайтесь
  rationale: Повелительная форма передаёт призыв к решительной перемене мысли и жизни, сохраняя богословскую ёмкость исходного слова.
- source_word: ἤγγικεν
  choice: приблизилось
  rationale: 'Совершенный вид отражает греческий перфект: Царство стало близким, и эта близость остаётся действительной.'
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Небесное Царство
  rationale: Естественное для современного русского языка выражение, сохраняющее характерное для Матфея обозначение Божьего царственного правления.
theological_decisions:
- issue: Значение βασιλεία τῶν οὐρανῶν
  choice: Небесное Царство
  alternative: Царство Небес; Царство небес
  rationale: 'Формулировка сохраняет особое выражение Матфея и не сводит βασιλεία только к месту: в контексте оно может обозначать и царственное правление, и царство.'
- issue: Сила призыва Μετανοεῖτε
  choice: Покайтесь
  alternative: Обратитесь; измените образ мыслей
  rationale: «Покайтесь» охватывает нравственный и духовный поворот и не ограничивает смысл одной лишь интеллектуальной переменой.
- issue: Временной аспект ἤγγικεν
  choice: приблизилось
  alternative: близко; стало близко
  rationale: Выбор сохраняет напряжение между уже наступившей близостью Царства и его дальнейшим осуществлением, не разрешая его в пользу одной богословской схемы.
translation_notes:
  register: Современный литературный русский язык, ясный и достоинственный. «Проповедовать» здесь естественнее буквального «возвещать и говорить»; двоеточие вводит содержание проповеди. Заглавные буквы в выражении «Небесное Царство» помогают распознать устойчивое евангельское понятие, не добавляя конфессионально узкого толкования.
