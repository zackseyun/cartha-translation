    text: В греческом тексте употреблён предлог со значением «через»; в русском выражение «исходящим из уст Бога» естественно передаёт образ Божьего произнесённого слова.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ответил
  rationale: Греческое сочетание буквально означает «ответив, сказал», но в современном русском естественно и полно передаётся одним глаголом «ответил».
- source_word: Γέγραπται
  choice: Написано
  rationale: Устойчивая формула введения цитаты из Писания; краткая русская форма сохраняет смысл написанного, остающегося в силе.
- source_word: ἄρτῳ μόνῳ
  choice: одним хлебом
  rationale: Сохраняет прямое значение ἄρτος и естественное русское выражение, не расширяя «хлеб» до более общего «пища».
- source_word: ζήσεται ὁ ἄνθρωπος
  choice: будет жить человек
  rationale: Передаёт будущее время и обобщённое значение существительного ἄνθρωπος; речь идёт о человеке как представителе всего человечества.
- source_word: παντὶ ῥήματι
  choice: всяким словом
  rationale: «Слово» естественно обозначает здесь каждое Божье изречение; «всяким» также сохраняет форму и ритм библейской цитаты.
- source_word: ἐκπορευομένῳ
  choice: исходящим
  rationale: Причастие сохраняет образ слова, исходящего при Божьем произнесении, и формально соответствует греческому причастию.
- source_word: διὰ στόματος θεοῦ
  choice: через уста Бога
  rationale: Передаёт διά с родительным в его основном значении «через» и сохраняет образ слова, проходящего через Божьи уста, хотя по-русски привычнее «из уст Бога».
theological_decisions:
- issue: Обобщённое значение ὁ ἄνθρωπος
  choice: человек
  alternative: люди; всякий человек
  rationale: Единственное число и форма исходного текста сохранены, при этом русское «человек» естественно выражает общую истину обо всех людях, а не только о мужчине.
- issue: Образ речи Бога в διὰ στόματος θεοῦ
  choice: через уста Бога
  alternative: из уст Бога
  rationale: Выбран менее привычный, но более непосредственный эквивалент предлога διά; он не превращает метафору в отвлечённое указание на Божью волю или повеление.
translation_notes:
  register: Современный литературный русский язык с достоинством и узнаваемым ритмом цитаты из Писания. Синтаксическая избыточность «ответив, сказал» устранена, но образность ключевой фразы сохранена. Местоимение «он» дано со строчной буквы в соответствии с обычной современной повествовательной нормой.
