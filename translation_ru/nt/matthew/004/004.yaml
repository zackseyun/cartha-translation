  text: 'But he answered[a], “It is written: ‘Man will not live by bread alone[b], but by every word proceeding through the mouth of God.’”'
translation:
  language: ru
  text: 'Но он ответил: «Написано: „Не одним хлебом будет жить человек[a], но всяким словом, исходящим из уст Бога[b]“».'
