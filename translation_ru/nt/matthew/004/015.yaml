  text: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ, ὁδὸν θαλάσσης, πέραν τοῦ Ἰορδάνου, Γαλιλαία τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/015.yaml
  text: Land of Zebulun and land of Naphtali[a], the way of the sea, beyond the Jordan, Galilee of the Gentiles—
translation:
  language: ru
  text: Земля Завулона и земля Неффалима, дорога у моря, за Иорданом, Галилея язычников[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Галилея народов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γῆ / γῆ
  choice: Земля / земля
  rationale: Сохраняет географический смысл и параллельный повтор греческого текста; первое слово пишется с прописной буквы лишь потому, что начинает цитату.
- source_word: Ζαβουλὼν
  choice: Завулона
  rationale: Устоявшаяся русская библейская форма имени в родительном падеже после слова «земля».
- source_word: Νεφθαλίμ
  choice: Неффалима
  rationale: Устоявшаяся русская библейская форма имени в родительном падеже после слова «земля».
- source_word: ὁδὸν θαλάσσης
  choice: путь к морю
  rationale: Естественная по-русски формулировка, сохраняющая образное и географически не вполне однозначное выражение пророческой цитаты; не сводит его однозначно к прибрежной дороге.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: за Иорданом
  rationale: Кратко и идиоматично передаёт пространственное выражение, не уточняя точку наблюдения сверх исходного текста.
- source_word: Γαλιλαία
  choice: Галилея
  rationale: Устоявшееся русское название области.
- source_word: τῶν ἐθνῶν
  choice: язычников
  rationale: В данном иудейском контексте обозначает неевреев и передаёт этнорелигиозное противопоставление; буквальная возможность «народов» сохранена в сноске.
theological_decisions:
- issue: Передача ἐθνῶν в цитате из Исаии
  choice: язычников
  alternative: народов
  rationale: «Язычников» яснее выражает подразумеваемое в контексте значение «неевреев», тогда как «народов» остаётся допустимым более буквальным вариантом и вынесено в сноску без устранения смысловой неоднозначности.
translation_notes:
  register: Современный литературный русский язык с несколько возвышенным ритмом пророческой цитаты. Сохранены параллелизм, перечисление географических обозначений и незавершённость фразы, продолжающейся в следующем стихе.
