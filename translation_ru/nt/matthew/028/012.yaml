  text: καὶ συναχθέντες μετὰ τῶν πρεσβυτέρων συμβούλιόν τε λαβόντες ἀργύρια ἱκανὰ ἔδωκαν τοῖς στρατιώταις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/012.yaml
  text: And after gathering with the elders and taking counsel[a], they gave a considerable sum of silver to the soldiers,
translation:
  language: ru
  text: Собравшись со старейшинами и посоветовавшись, они дали солдатам значительную сумму серебряных денег[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «значительное количество серебра».'
    reason: 'Лексическая альтернатива: ἀργύρια может означать серебро как деньги, а ἱκανὰ указывает на значительное количество.'
lexical_decisions:
- source_word: συναχθέντες
  choice: собравшись
  rationale: Аористное причастие передаёт предшествующее основному действию совместное собрание; деепричастие звучит естественно и сохраняет последовательность действий.
- source_word: μετὰ τῶν πρεσβυτέρων
  choice: со старейшинами
  rationale: Предлог μετά с родительным падежом выражает совместность, а «старейшины» — обычное обозначение этой группы руководителей.
- source_word: συμβούλιόν τε λαβόντες
  choice: и посоветовавшись
  rationale: Устойчивое выражение означает совместно обсудить дело и принять решение; перевод не сводит его к простому получению совета.
- source_word: ἀργύρια ἱκανὰ
  choice: значительную сумму серебром
  rationale: ἀργύρια обозначает серебро как деньги, а ἱκανὰ — значительное количество. Такая формулировка естественна по-русски и сохраняет упоминание серебра.
- source_word: ἔδωκαν
  choice: они дали
  rationale: Прямой и нейтральный перевод формы аориста δίδωμι.
- source_word: τοῖς στρατιώταις
  choice: воинам
  rationale: στρατιώτης буквально означает воина или солдата; контекстуальную функцию охраны не следует подставлять вместо самого обозначения.
theological_decisions:
- issue: Кто подразумевается под подлежащим
  choice: «они» — первосвященники, упомянутые в предыдущем стихе
  alternative: неопределённая группа лиц
  rationale: Формы мужского рода множественного числа продолжают подлежащее из Мф. 28:11. Перевод сохраняет местоимение и не повторяет явно «первосвященники», поскольку греческий текст здесь их заново не называет.
translation_notes:
  register: Современный литературный русский язык; краткая деепричастная конструкция сохраняет движение греческой фразы, а «значительную сумму серебром» сочетает естественность с лексической точностью.
