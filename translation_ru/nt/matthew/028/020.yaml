  text: διδάσκοντες αὐτοὺς τηρεῖν πάντα ὅσα ἐνετειλάμην ὑμῖν· καὶ ἰδοὺ ἐγὼ μεθ’ ὑμῶν εἰμι πάσας τὰς ἡμέρας ἕως τῆς συντελείας τοῦ ⸀αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/020.yaml
  text: teaching them to keep all that I commanded you. And behold[a], I am with you all the days, until the end of the age.
translation:
  language: ru
  text: уча их соблюдать всё, что Я повелел вам. И вот, Я с вами во все дни до конца века[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «до завершения века», то есть эпохи; традиционный перевод: «до конца мира». Греческое αἰών здесь означает не физический мир как таковой.'
    reason: Уточнение значения греческого выражения и традиционной альтернативы.
lexical_decisions:
- source_word: διδάσκοντες
  choice: уча
  rationale: Причастие настоящего времени продолжает описание того, как следует приобретать учеников; «уча» прямо и естественно передаёт длительное действие.
- source_word: τηρεῖν
  choice: соблюдать
  rationale: Глагол означает хранить и исполнять заповеданное; «соблюдать» сохраняет обе стороны смысла и естественно сочетается с повелениями.
- source_word: πάντα ὅσα
  choice: всё, что
  rationale: Естественная русская передача оборота с сохранением его всеохватности.
- source_word: ἐνετειλάμην
  choice: Я повелел
  rationale: «Повелел» передаёт авторитетную силу ἐντέλλομαι, оставаясь литературным и понятным современному читателю.
- source_word: ἰδοὺ
  choice: И вот
  rationale: «И вот» сохраняет функцию торжественного указателя, привлекающего особое внимание к следующему обещанию.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: Я с вами
  rationale: Краткая и прямая русская формулировка точно передаёт обещание постоянного присутствия.
- source_word: πάσας τὰς ἡμέρας
  choice: во все дни
  rationale: Передаёт буквальный образ «всех дней» и подчёркивает непрерывное, повседневное присутствие; торжественный оттенок соответствует контексту.
- source_word: συντελείας
  choice: конца
  rationale: В данном эсхатологическом сочетании «конец» естественно передаёт завершение периода, не предполагая его внезапного обрыва.
- source_word: αἰῶνος
  choice: этого века
  rationale: «Век» передаёт αἰών как эпоху, а указательное «этого» помогает современному русскому читателю не принять слово за столетие.
theological_decisions:
- issue: Значение ἕως τῆς συντελείας τοῦ αἰῶνος
  choice: до конца этого века
  alternative: до завершения века; до конца мира
  rationale: Фраза указывает на завершение нынешней эпохи. Она не говорит непосредственно об уничтожении физического мира; выбранная передача сохраняет эсхатологический смысл и звучит естественно по-русски.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «И вот» и «во все дни» сохраняют возвышенность оригинала без устаревшего «се» и архаичного «до скончания века».
