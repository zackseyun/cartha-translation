  source_fidelity: 'Смысл исходного текста в целом передан точно: сохранены вводное «ἰδού», встреча Иисуса с женщинами, приветствие во множественном числе, их приближение, физическое прикосновение к Его ногам и προσκυνέω. Однако «обхватили Его ноги» может обозначать именно объятие ног, тогда как ἐκράτησαν αὐτοῦ τοὺς πόδας означает «ухватились/схватили Его за ноги».'
