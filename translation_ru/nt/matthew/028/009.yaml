base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/009.yaml
  text: And behold[a], Jesus met them, saying, “Greetings!” And they came up, took hold of his feet[b], and worshiped him.
translation:
  language: ru
  text: 'И вот, Иисус встретил их и сказал: «Радуйтесь!»[a] Они же, подойдя, ухватились за Его ноги и поклонились Ему[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Приветствую вас!» Греческое слово буквально означает «радуйтесь», но употреблялось и как обычное приветствие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пали ниц перед Ним» или «воздали Ему поклонение». Греческий глагол может означать земной поклон, почтительное преклонение или поклонение; в данном контексте возможно и последнее значение.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: и вот
  rationale: Сохраняет функцию привлечения внимания и живость повествования; это естественный и понятный русский библейско-литературный оборот.
- source_word: ὑπήντησεν
  choice: встретил
  rationale: Кратко и естественно передаёт встречу Иисуса с женщинами, не добавляя отсутствующего в глаголе направления движения.
- source_word: Χαίρετε
  choice: Радуйтесь!
  rationale: Сохраняет буквальную форму повелительного наклонения множественного числа и возможный оттенок радости, особенно значимый в контексте воскресения; при этом в примечании отмечена функция обычного приветствия.
- source_word: προσελθοῦσαι
  choice: подойдя
  rationale: Естественно передаёт предшествующее основным действиям приближение женщин к Иисусу.
- source_word: ἐκράτησαν αὐτοῦ τοὺς πόδας
  choice: обхватили Его ноги
  rationale: Передаёт крепкий физический контакт и естественно описывает жест припавших к ногам женщин; «схватили» могло бы звучать слишком резко.
- source_word: προσεκύνησαν αὐτῷ
  choice: поклонились Ему
  rationale: 'Сохраняет лексическую широту προσκυνέω: телесное преклонение, почитание или поклонение. Контекст допускает богослужебный смысл, который указан в примечании, но не навязан основным текстом.'
theological_decisions:
- issue: Значение προσκυνέω по отношению к воскресшему Иисусу
  choice: поклонились Ему
  alternative: поклонились Ему как Богу / воздали Ему поклонение
  rationale: Русское «поклонились» естественно сочетается с тем, что женщины обхватили ноги Иисуса, и сохраняет присущую греческому слову смысловую широту. В контексте Евангелия и воскресения действие может иметь значение религиозного поклонения, но основной текст не устраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. «И вот» сохраняет живость исходного текста; прописные местоимения по отношению к Иисусу соответствуют распространённой русской библейской издательской традиции, не меняя смысла.
