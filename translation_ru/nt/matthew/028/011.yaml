lexical_decisions:
- source_word: Πορευομένων δὲ αὐτῶν
  choice: Когда они были в пути
  rationale: Родительный самостоятельный оборот задаёт временной фон следующего события; такой перевод естественен по-русски и не уточняет не названное здесь место назначения. Частица δέ передана через переход к новой сцене, без отдельного противительного союза.
- source_word: ἰδού
  choice: и вот
  rationale: Сохраняет повествовательный маркер внимания и подчёркивает внезапное или примечательное развитие событий, оставаясь естественным в современном русском языке.
- source_word: τινες τῆς κουστωδίας
  choice: некоторые из стражников
  rationale: Речь идёт о части стражи, поставленной у гробницы; личная форма «стражники» ясно показывает, что в город пришли отдельные люди из отряда.
- source_word: ἐλθόντες εἰς τὴν πόλιν
  choice: пришли в город
  rationale: Аористное причастие обозначает действие, предшествующее сообщению; личная форма естественно передаёт последовательность событий по-русски.
- source_word: ἀπήγγειλαν
  choice: сообщили
  rationale: Глагол означает передать известие или донесение; «сообщили» точно и нейтрально передаёт официальный оттенок обращения к первосвященникам.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: первосвященникам
  rationale: Устоявшееся русское обозначение представителей высшего храмового руководства во множественном числе.
- source_word: ἅπαντα τὰ γενόμενα
  choice: обо всём, что произошло
  rationale: Передаёт усиленную полноту ἅπαντα и естественно выражает совокупность уже совершившихся событий.
