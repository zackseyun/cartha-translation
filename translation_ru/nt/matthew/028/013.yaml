    rationale: Причастие λέγοντες лексически обозначает речь («говоря», «сказав»), тогда как «велели» прямо называет действие приказа. Приказной оттенок уже однозначно выражен аористным императивом Εἴπατε («Скажите»). Более точное и столь же естественное соответствие — «и сказали».
