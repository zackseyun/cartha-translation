  text: λέγοντες· Εἴπατε ὅτι Οἱ μαθηταὶ αὐτοῦ νυκτὸς ἐλθόντες ἔκλεψαν αὐτὸν ἡμῶν κοιμωμένων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/013.yaml
  text: saying[a], “Say[b], ‘His disciples came by night and stole him while we were sleeping.’”
translation:
  language: ru
  text: 'и сказали: «Скажите: „Его ученики пришли ночью и украли его, пока мы спали“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: и велели
  rationale: Причастие вводит содержание указания. В русском контексте естественно передать его личной формой «велели», ясно выражающей, что это были наставления стражникам.
- source_word: Εἴπατε
  choice: Скажите
  rationale: Аористный императив второго лица множественного числа передан прямым повелением без смысловых добавлений.
- source_word: ὅτι
  choice: передано структурой прямой речи
  rationale: Союз вводит содержание речи; в современном русском его функцию естественно выражают двоеточие и кавычки.
- source_word: Οἱ μαθηταὶ αὐτοῦ
  choice: Его ученики
  rationale: Естественная русская передача греческой притяжательной конструкции; местоимение не требует конфессиональной капитализации.
- source_word: νυκτὸς
  choice: ночью
  rationale: Наречное употребление родительного падежа обозначает время прихода; «ночью» точно и естественно.
- source_word: ἐλθόντες
  choice: пришли
  rationale: Предшествующее действие аористного причастия естественно передано личной формой в последовательности «пришли… и украли».
- source_word: ἔκλεψαν
  choice: украли
  rationale: Прямая передача глагола со значением кражи.
- source_word: αὐτὸν
  choice: его
  rationale: Сохранено личное местоимение греческого текста без поясняющей замены на «его тело».
- source_word: ἡμῶν κοιμωμένων
  choice: пока мы спали
  rationale: Генитив абсолютный передан ясным временным придаточным, сохраняющим обстоятельственное значение.
theological_decisions:
- issue: Референт αὐτόν в вымышленном сообщении
  choice: Сохранить личное местоимение «его»
  alternative: «его тело»
  rationale: В греческом тексте стоит личное местоимение αὐτόν. Вариант «его тело» был бы разъясняющим добавлением; из контекста и без него ясно, что речь идёт об Иисусе.
translation_notes:
  register: Современный литературный русский язык; прямая речь оформлена ясно и естественно. Формулировка сохраняет характер приказа и не устраняет намеренную нелепость вымышленного показания спавших стражников.
