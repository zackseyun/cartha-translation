  text: οἱ δὲ λαβόντες ⸀τὰ ἀργύρια ἐποίησαν ὡς ἐδιδάχθησαν. Καὶ διεφημίσθη ὁ λόγος οὗτος παρὰ Ἰουδαίοις μέχρι τῆς σήμερον ⸀ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/015.yaml
  text: So they took the silver and did as they had been instructed[a]. And this story has been spread among the Jews to this day.
translation:
  language: ru
  text: Они же взяли серебро и поступили так, как их научили. И этот рассказ[a] ходит среди иудеев до сих пор.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сообщение». Греческое слово λόγος в этом контексте может означать рассказ, сообщение или изложение событий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: взяли
  rationale: Аористное причастие передано личной формой для естественной русской последовательности действий; «получили» также возможно, но «взяли» непосредственно продолжает сцену передачи денег.
- source_word: τὰ ἀργύρια
  choice: серебро
  rationale: Греческое множественное число обозначает серебро как деньги. Русское «серебро» сохраняет конкретный образ, не уточняя без необходимости вид монет.
- source_word: ἐποίησαν
  choice: поступили
  rationale: В данном контексте ποιέω означает исполнить указание, действовать соответствующим образом. «Поступили так» естественнее по-русски, чем буквальное «сделали».
- source_word: ὡς ἐδιδάχθησαν
  choice: так, как их научили
  rationale: Сохранено основное значение пассивной формы διδάσκω — «научить, наставить». Контекст показывает, что речь идёт о данных им указаниях, но перевод не сужает значение до «приказали».
- source_word: διεφημίσθη
  choice: распространился
  rationale: Глагол обозначает широкое распространение вести или сообщения. Добавление «сохраняется до сих пор» естественно выражает продолжающийся результат, заданный последующей временной фразой.
- source_word: ὁ λόγος οὗτος
  choice: этот рассказ
  rationale: λόγος здесь относится к изложенной ранее версии событий. «Рассказ» понятно и контекстуально уместно, однако не устраняет возможное значение «сообщение».
- source_word: παρὰ Ἰουδαίοις
  choice: среди иудеев
  rationale: παρά с дательным здесь означает распространение внутри сообщества. Строчная буква соответствует современной русской норме для названия народа.
- source_word: μέχρι τῆς σήμερον ἡμέρας
  choice: до сих пор
  rationale: Естественный современный русский эквивалент устойчивого выражения «до сего дня», относящегося ко времени автора.
theological_decisions:
- issue: Передача Ἰουδαίοις в потенциально полемическом повествовательном контексте
  choice: среди иудеев
  alternative: среди жителей Иудеи
  rationale: Здесь имеется в виду распространение рассказа в иудейском сообществе, а не только географически среди жителей Иудеи. Перевод не расширяет утверждение Матфея и не придаёт ему дополнительной антииудейской направленности.
- issue: Характер сообщения, обозначенного словом λόγος
  choice: рассказ
  alternative: сообщение
  rationale: Контекст указывает на распространяемую версию событий, однако само слово не определяет её жанр и не требует оценочного обозначения вроде «ложь» или «выдумка». Альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Архаическое «до сего дня» заменено на естественное «до сих пор»; конструкция с двумя сказуемыми ясно передаёт как распространение рассказа в прошлом, так и его сохранение ко времени автора.
