  text: πορευθέντες ⸀οὖν μαθητεύσατε πάντα τὰ ἔθνη, ⸀βαπτίζοντες αὐτοὺς εἰς τὸ ὄνομα τοῦ πατρὸς καὶ τοῦ υἱοῦ καὶ τοῦ ἁγίου πνεύματος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/019.yaml
  text: Therefore[a], go and make disciples of all the nations, baptizing them into the name of the Father and of the Son and of the Holy Spirit,
translation:
  language: ru
  text: Итак, идите и сделайте учениками все народы, крестя их во имя[a] Отца, Сына и Святого Духа,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в имя». Греческий предлог может подчёркивать вступление в отношения или отождествление.'
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες
  choice: идите
  rationale: Аористное причастие перед главным повелением μαθητεύσατε здесь естественно передаёт сопутствующее повеление; форма «идите» сохраняет силу поручения и звучит по-русски лучше, чем буквальное «пойдя».
- source_word: οὖν
  choice: итак
  rationale: Союз выражает вывод из заявления Иисуса о данной Ему власти в предыдущем стихе; «итак» ясно и естественно передаёт эту логическую связь.
- source_word: μαθητεύσατε
  choice: сделайте учениками
  rationale: 'Глагол имеет причинительное значение: привести людей к тому, чтобы они стали учениками. Выражение сохраняет это значение яснее, чем менее обычное переходное употребление «научите».'
- source_word: πάντα τὰ ἔθνη
  choice: все народы
  rationale: ἔθνη здесь обозначает народы в универсальном масштабе; перевод «язычники» неоправданно сузил бы поручение до неевреев.
- source_word: βαπτίζοντες
  choice: крестя
  rationale: Причастие связано с тем, как исполняется поручение делать учениками. «Крестя» обозначает установленное христианское действие, не предрешая спорный вопрос о способе его совершения.
- source_word: εἰς τὸ ὄνομα
  choice: во имя
  rationale: Русская формула «крестить во имя» идиоматична и сохраняет направленность εἰς — вступление в связь и отождествление с названным именем — лучше, чем неестественное буквальное «в имя».
- source_word: τοῦ πατρὸς
  choice: Отца
  rationale: В трёхчастной формуле это личный божественный титул; прописная буква уместна в современном русском библейском тексте.
- source_word: τοῦ υἱοῦ
  choice: Сына
  rationale: В координации с Отцом и Святым Духом слово выступает как божественный личный титул.
- source_word: τοῦ ἁγίου πνεύματος
  choice: Святого Духа
  rationale: Это обычное современное русское обозначение личного божественного референта в данной формуле.
theological_decisions:
- issue: Передача предлога εἰς в формуле крещения
  choice: во имя
  alternative: в имя; именем
  rationale: Буквальное «в имя» сохраняло бы направительное значение εἰς, но в современном русском звучит неестественно. «Во имя» является устойчивой формулой и может выражать вступление в отношение или принадлежность, тогда как «именем» скорее подчёркивало бы полномочие или средство. Примечание сохраняет семантическую особенность греческого текста.
- issue: Единственное число «имя» при Отце, Сыне и Святом Духе
  choice: сохранить единственное число и три личных титула без поясняющего расширения
  alternative: добавить явное богословское толкование единства или троичности
  rationale: Синтаксис текста сам соединяет три родительных определения с одним «именем». Перевод сохраняет эту напряжённую формулу, не разворачивая её в привнесённое догматическое объяснение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского поручения. Выбрано ясное «сделайте учениками», а не традиционное, но семантически двусмысленное «научите». Союз «итак» связывает поручение со стихом 18. Запятая в конце сохранена, поскольку предоставленный фрагмент продолжается в следующем стихе.
