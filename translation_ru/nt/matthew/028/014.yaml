  text: καὶ ἐὰν ἀκουσθῇ τοῦτο ⸀ἐπὶ τοῦ ἡγεμόνος, ἡμεῖς πείσομεν ⸀αὐτὸν καὶ ὑμᾶς ἀμερίμνους ποιήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/014.yaml
  text: And if this is heard by the governor, we will persuade him and keep you out of trouble.
translation:
  language: ru
  text: И если об этом услышит наместник[a], мы убедим его и избавим вас от неприятностей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если это дойдёт до сведения наместника».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сделаем так, что вам не о чем будет беспокоиться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκουσθῇ τοῦτο ἐπὶ τοῦ ἡγεμόνος
  choice: об этом услышит правитель
  rationale: 'Естественно передаёт идиоматический смысл греческой пассивной конструкции: дело станет известно правителю. Синтаксическая перестройка необходима для ясного современного русского языка.'
- source_word: ἡγεμόνος
  choice: правитель
  rationale: В контексте речь идёт о римском наместнике Пилате; «правитель» — ясное и достойное обозначение должности, не подменяющее её современным административным титулом.
- source_word: πείσομεν αὐτόν
  choice: мы убедим его
  rationale: Прямо сохраняет обычное значение πείθω и не уточняет без достаточного основания, каким именно способом первосвященники намеревались склонить правителя на свою сторону.
- source_word: ὑμᾶς ἀμερίμνους ποιήσομεν
  choice: избавим вас от неприятностей
  rationale: Передаёт результативную конструкцию буквально означающую «сделаем вас не имеющими забот». В контексте стражникам обещают оградить их от возможных последствий.
