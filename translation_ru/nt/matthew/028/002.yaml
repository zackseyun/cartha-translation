  source_fidelity: 'Перевод точно передаёт ἰδοὺ, μέγας σεισμός, причинное γάρ, сошествие ангела с неба, его приближение и отваливание камня. Однако «сел на него» передаёт действие совершенного вида, тогда как ἐκάθητο — имперфект, описывающий продолжающееся состояние: ангел сидел на камне.'
  naturalness: Текст в целом естественен для современного литературного русского языка и сохраняет сдержанно библейский регистр. «И сидел на нём» столь же естественно и лучше соответствует видовому значению оригинала.
  terminology: «Ангел Господень» уместно передаёт ἄγγελος κυρίου без богословского переосмысления. «Сильное землетрясение», «сошёл с неба» и «отвалил камень» точны и идиоматичны. Сноски не требуются.
