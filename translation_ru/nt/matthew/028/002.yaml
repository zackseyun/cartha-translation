id: MAT.28.2
reference: Matthew 28:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς ἐγένετο μέγας· ἄγγελος γὰρ κυρίου καταβὰς ἐξ οὐρανοῦ ⸀καὶ προσελθὼν ἀπεκύλισε τὸν ⸀λίθον καὶ ἐκάθητο ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/002.yaml
  text: And behold, there was a great earthquake, for an angel of the Lord had come down from heaven and came up and rolled away the stone and was sitting on it.
translation:
  language: ru
  text: И вот, произошло сильное землетрясение, потому что ангел Господень сошёл с неба, подошёл, отвалил камень и сидел на нём.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: и вот
  rationale: Сохраняет повествовательный сигнал внезапности и привлечения внимания, оставаясь естественным для современного литературного русского языка.
- source_word: σεισμὸς μέγας
  choice: сильное землетрясение
  rationale: Передаёт μέγας в данном контексте естественным русским сочетанием; «великое землетрясение» звучало бы архаично.
- source_word: ἄγγελος κυρίου
  choice: ангел Господень
  rationale: Традиционная и ясная передача неопределённой формы греческого текста без добавления артикля или имени.
- source_word: καταβὰς ἐξ οὐρανοῦ
  choice: сошёл с неба
  rationale: Точно передаёт направленное движение вниз из небесной сферы.
- source_word: προσελθὼν
  choice: подошёл
  rationale: Передаёт значение приближения; в русском однородная последовательность глаголов естественно выражает греческие причастия и личные формы.
- source_word: ἀπεκύλισε τὸν λίθον
  choice: отвалил камень
  rationale: «Отвалил» естественно описывает откатывание закрывавшего вход камня и сохраняет результативность действия.
- source_word: ἐκάθητο ἐπάνω αὐτοῦ
  choice: сел на него
  rationale: Греческий имперфект обозначает состояние сидения после действия; в последовательном русском повествовании «сел» звучит естественно, а место передано прямо.
theological_decisions:
- issue: Временная связь землетрясения и сошествия ангела
  choice: «произошло… потому что ангел… сошёл…» без добавления «уже»
  alternative: «произошло… потому что ангел… уже сошёл…»
  rationale: Форма καταβὰς сама по себе не требует русского плюсквамперфекта. Перевод сохраняет причинную связь γάρ и не навязывает точную временную реконструкцию событий.
- issue: Определённость ангела
  choice: «ангел Господень»
  alternative: «ангел Господа» или «Ангел Господень» как титул
  rationale: Строчная буква и отсутствие специального титульного оформления не отождествляют ангела с какой-либо особой богословской фигурой.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан плавным и доступным; причинное γάρ сохранено словом «потому что». Маркеры сносок не используются, поскольку текст не требует пояснения, необходимого для публикации.
