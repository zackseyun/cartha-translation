  yaml_path: translation/nt/matthew/028/004.yaml
  text: And from fear of him the guards shook and became like dead men[a].
translation:
  language: ru
  text: От страха перед ним стражники задрожали и стали как мёртвые[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделались словно мёртвые».'
    reason: Вариант передачи ἐγενήθησαν ὡς νεκροί; «словно» так же ясно сохраняет сравнительный характер выражения.
lexical_decisions:
- source_word: ἀπὸ δὲ τοῦ φόβου αὐτοῦ
  choice: От страха перед ним
  rationale: Предлог ἀπό с родительным обозначает здесь источник или причину реакции. Русское «от страха» естественно передаёт оба оттенка, а «перед ним» ясно выражает направленность страха на упомянутого ранее ангела.
- source_word: ἐσείσθησαν
  choice: задрожали
  rationale: Пассивная форма от σείω буквально допускает значение «были потрясены», но в данном контексте описывает телесную реакцию страха. «Задрожали» звучит естественно и сохраняет образ сотрясения.
- source_word: οἱ τηροῦντες
  choice: стражники
  rationale: Субстантивированное причастие буквально означает «те, кто сторожил». По контексту речь идёт о людях, поставленных охранять гробницу; «стражники» передаёт это кратко и точно.
- source_word: ἐγενήθησαν
  choice: стали
  rationale: Глагол γίνομαι обозначает переход в иное состояние, поэтому «стали» точнее простого «были».
- source_word: ὡς νεκροί
  choice: как мёртвые
  rationale: ὡς вводит сравнение, а не утверждает буквальную смерть стражников. «Как мёртвые» сохраняет эту смысловую границу и естественно передаёт форму мужского множественного числа.
theological_decisions:
- issue: К кому относится местоимение αὐτοῦ («ним»)
  choice: К ангелу, описанному в предыдущем стихе
  alternative: К небесному явлению в целом
  rationale: Ближайший личный референт — ангел Господень, чей вид описан непосредственно перед этим. Местоимение оставлено без поясняющей вставки, чтобы перевод не говорил больше исходного текста.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, повествовательная и выразительная. Сохранены причинная начальная конструкция и сравнение исходного текста без излишнего усиления страха до «ужаса».
