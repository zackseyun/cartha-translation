  yaml_path: translation/nt/matthew/028/016.yaml
  text: The eleven disciples went to Galilee[a], to the mountain where Jesus had directed them,
translation:
  language: ru
  text: Одиннадцать учеников пошли в Галилею, на гору, которую указал им Иисус[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на гору, назначенную Иисусом для них»; возможно также: «на гору, куда Иисус велел им прийти». Греческий глагол может означать «назначить», «указать» или «распорядиться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: δέ здесь служит мягкой связкой и обозначает переход в повествовании; русская последовательность предложений естественно передаёт эту функцию без добавления «тогда» или противопоставительного «но».
- source_word: οἱ ἕνδεκα μαθηταί
  choice: одиннадцать учеников
  rationale: Сохраняется конкретное число оставшихся учеников и обычное для Евангелий значение μαθηταί.
- source_word: ἐπορεύθησαν
  choice: пошли
  rationale: Нейтральный и естественный русский глагол движения, соответствующий повествовательному употреблению πορεύομαι.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: в Галилею
  rationale: Обычное русское обозначение движения в область.
- source_word: εἰς τὸ ὄρος
  choice: на гору
  rationale: ὄρος обозначает гору или возвышенность; контекст указывает на определённую гору, ранее названную Иисусом.
- source_word: οὗ
  choice: которую
  rationale: В русской конструкции относительное местоимение связывает гору с последующим указанием Иисуса; пространственный смысл греческого οὗ передан всей фразой.
- source_word: ἐτάξατο αὐτοῖς
  choice: указал им
  rationale: Передаёт предварительное определение места без излишнего усиления до формального назначения или приказа; допустимые оттенки отмечены в сноске.
- source_word: ὁ Ἰησοῦς
  choice: Иисус
  rationale: Традиционная русская форма имени.
theological_decisions:
- issue: Характер предварительного указания Иисуса
  choice: «указал им»
  alternative: «назначил им»; «велел им идти»
  rationale: Форма ἐτάξατο может передавать назначение, распоряжение или указание. Основной текст сохраняет повествовательный смысл определения места и не привносит более сильной идеи формального назначения либо приказа.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанное. Повтор предлога в сочетании «в Галилею, на гору» естественно передаёт последовательное уточнение места. Маркер сноски поставлен непосредственно после спорной глагольной фразы.
