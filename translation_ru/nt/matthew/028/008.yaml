    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθοῦσαι ταχὺ ἀπὸ τοῦ μνημείου
  choice: поспешно покинув гробницу
  rationale: Аористное причастие передаёт предшествующее действие, а ταχύ — поспешность. «Покинув гробницу» естественно и точно обозначает удаление женщин от места погребения.
- source_word: μετὰ φόβου καὶ χαρᾶς μεγάλης
  choice: со страхом и великой радостью
  rationale: Сохранено намеренное сочетание двух переживаний; φόβος не сведён исключительно ни к испугу, ни к благоговению.
- source_word: ἔδραμον
  choice: они побежали
  rationale: Форма от τρέχω обозначает именно бег и придаёт повествованию живую динамику.
- source_word: ἀπαγγεῖλαι
  choice: сообщить об этом
  rationale: Инфинитив выражает цель бега — передать ученикам известие. «Об этом» естественно восполняет подразумеваемое содержание сообщения из контекста, не уточняя его сверх текста.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: Его ученикам
  rationale: «Ученики» — устойчивый и точный евангельский эквивалент μαθηταί; αὐτοῦ в контексте относится к Иисусу.
theological_decisions:
- issue: Сочетание страха и радости в реакции женщин
  choice: со страхом и великой радостью
  alternative: с благоговейным трепетом и великой радостью
  rationale: Основной текст сохраняет смысловую напряжённость φόβος и не устраняет возможность как страха, так и благоговейного трепета.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и динамичное, без архаизмов. «Гробница» выбрана вместо потенциально неоднозначного современного «гроб». Местоимение «Его» написано с прописной буквы согласно распространённой русской библейской издательской норме.
