  text: οὐκ ἔστιν ὧδε, ἠγέρθη γὰρ καθὼς εἶπεν· δεῦτε ἴδετε τὸν τόπον ὅπου ⸀ἔκειτο·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/006.yaml
  text: He is not here[a], for he has been raised, just as he said. Come[b], see the place where he was lying.
translation:
  language: ru
  text: Его здесь нет, потому что он был воскрешён[a], как и сказал. Подойдите, посмотрите на место, где он лежал[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воскрес». Греческий глагол имеет пассивную форму — буквально «был воскрешён».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «где он был положен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: Его здесь нет
  rationale: Естественная русская конструкция со значением отсутствия в данном месте; местоимение восполняет ясного из контекста референта.
- source_word: ἠγέρθη
  choice: был воскрешён
  rationale: Передаёт пассивную форму греческого аориста и совершившееся событие, результат которого сохраняется.
- source_word: γὰρ
  choice: потому что
  rationale: Ясно выражает причинно-пояснительную связь с утверждением «Его здесь нет».
- source_word: καθὼς εἶπεν
  choice: как и говорил
  rationale: Передаёт соответствие события прежним словам Иисуса и естественно звучит по-русски.
- source_word: δεῦτε
  choice: Подойдите
  rationale: В контексте приглашения осмотреть место в гробнице глагол естественно передаёт призыв приблизиться.
- source_word: ἴδετε
  choice: посмотрите
  rationale: Передаёт повеление непосредственно осмотреть место без архаического оттенка.
- source_word: τὸν τόπον
  choice: место
  rationale: Прямое и естественное обозначение конкретного места, где находилось тело.
- source_word: ὅπου ἔκειτο
  choice: где он лежал
  rationale: Сохраняет статальное значение κεῖμαι и длительный фон несовершенного вида, не превращая выражение в явное описание действия погребения.
theological_decisions:
- issue: Залог и действующее лицо в утверждении о воскресении
  choice: был воскрешён
  alternative: воскрес
  rationale: Пассивная формулировка следует форме ἠγέρθη и сохраняет подразумеваемое действие Бога, не отрицая иных новозаветных способов говорить об участии самого Иисуса.
- issue: Смысл ὅπου ἔκειτο
  choice: где он лежал
  alternative: где он был положен
  rationale: Выбранный вариант сохраняет состояние, выраженное κεῖμαι, и не делает явным действие или действующее лицо, которых данная форма непосредственно не называет.
translation_notes:
  register: Современный литературный русский язык; ясный, достойный и неархаичный стиль. Сохранён пассивный залог ключевого утверждения и статальность заключительного оборота.
