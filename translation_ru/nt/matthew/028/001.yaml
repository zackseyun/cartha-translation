  source_fidelity: 'Основной текст точно передаёт греческий временной оборот в его выбранном значении: «После субботы» для ὀψὲ σαββάτων, «на рассвете первого дня недели» для τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων. Идиоматическое σαββάτων корректно передано единственным числом «субботы» и выражение μίαν σαββάτων — как «первого дня недели». «Пришли посмотреть на гробницу» адекватно передаёт ἦλθεν ... θεωρῆσαι τὸν τάφον; русское множественное число сказуемого нормативно при двух названных женщинах.'
