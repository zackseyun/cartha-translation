  text: Ὀψὲ δὲ σαββάτων, τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων, ἦλθεν ⸀Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία θεωρῆσαι τὸν τάφον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/001.yaml
  text: After the Sabbath[a], as it was dawning toward the first day of the week, Mary Magdalene and the other Mary came to look at the tomb.
translation:
  language: ru
  text: После субботы[a], на рассвете первого дня недели, Мария Магдалина и другая Мария пришли посмотреть на гробницу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Поздно в субботу, когда начинался первый день недели». Начальные греческие слова можно понять и как «после субботы», и как «поздно в субботу».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψὲ δὲ σαββάτων
  choice: После субботы
  rationale: ὀψέ с родительным падежом может обозначать время после события; в данном контексте выражение естественно указывает на время после окончания субботы. Формально множественное σαββάτων идиоматически обозначает субботу. Частица δέ не требует отдельного русского соответствия.
- source_word: τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων
  choice: на рассвете первого дня недели
  rationale: ἐπιφώσκω здесь естественно относится к наступлению дневного света, а μίαν σαββάτων — семитский оборот со значением «первый день недели». Сжатая русская формулировка ясно передаёт временное отношение, выраженное εἰς.
- source_word: ἦλθεν
  choice: пришли
  rationale: 'Греческое сказуемое стоит в единственном числе при составном подлежащем, однако современная русская норма требует множественного числа: пришли обе женщины.'
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Мария Магдалина
  rationale: Использована устоявшаяся русская форма имени и обозначения происхождения.
- source_word: ἡ ἄλλη Μαρία
  choice: другая Мария
  rationale: ἄλλη означает «другая»; перевод сохраняет повествовательное различение двух женщин без добавочной идентификации.
- source_word: θεωρῆσαι
  choice: посмотреть
  rationale: θεωρέω обозначает намеренное зрительное наблюдение. «Посмотреть» звучит естественно и не усиливает смысл до формального осмотра.
- source_word: τὸν τάφον
  choice: гробницу
  rationale: τάφος обозначает место погребения; «гробница» в современном русском языке ясно передаёт значение и не смешивается с гробом как погребальным ящиком.
theological_decisions:
- issue: Временное выражение в начале повествования о воскресении
  choice: Событие отнесено ко времени после субботы, на рассвете первого дня недели.
  alternative: «Поздно в субботу, когда начинался первый день недели».
  rationale: Выражение ὀψὲ σαββάτων допускает понимание как «после субботы» и как «поздно в субботу». Основной перевод следует первому пониманию с учётом следующего указания на рассвет, а подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно торжественный. Идиоматические греческие обозначения времени переданы естественно для широкого читателя; неоднозначность начального оборота вынесена в сноску.
