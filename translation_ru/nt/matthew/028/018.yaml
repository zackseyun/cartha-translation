  text: καὶ προσελθὼν ὁ Ἰησοῦς ἐλάλησεν αὐτοῖς λέγων· Ἐδόθη μοι πᾶσα ἐξουσία ἐν οὐρανῷ καὶ ἐπὶ ⸀τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/018.yaml
  text: And Jesus came near and spoke to them[a], saying[b], “All authority in heaven and on earth has been given to me.”
translation:
  language: ru
  text: 'Иисус подошёл к ним и сказал: «Мне дана[a] вся власть[b] на небе и на земле».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «была дана». Греческий аорист прямо указывает на совершившееся дарование; вариант в тексте подчёркивает сохраняющийся результат.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «полномочия». Здесь греческое слово означает власть, право распоряжаться и господствовать, а не просто силу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: подошёл к ним
  rationale: Аористное причастие указывает, что Иисус приблизился к ученикам перед тем, как заговорить. Личная форма естественна для современного русского языка и сохраняет пространственный смысл.
- source_word: ἐλάλησεν αὐτοῖς λέγων
  choice: сказал
  rationale: Сочетание личного глагола «говорить» с причастием «говоря» представляет обычную греческую формулу введения прямой речи. Одно русское «сказал» передаёт её естественно, без тяжеловесного повтора.
- source_word: Ἐδόθη μοι
  choice: Мне дана
  rationale: Сохранены пассивная форма и получатель действия. Краткое причастие «дана» естественно выражает совершившееся дарование с сохраняющимся результатом; более формальное «была дана» отмечено в сноске.
- source_word: πᾶσα
  choice: вся
  rationale: При абстрактном существительном в единственном числе слово выражает полноту, поэтому «вся» точнее, чем распределительное «каждая».
- source_word: ἐξουσία
  choice: власть
  rationale: В данном контексте слово означает законное право властвовать и распоряжаться, а не только силу или способность.
- source_word: ἐν οὐρανῷ
  choice: на небе
  rationale: Это естественное русское обозначение небесной сферы в устойчивой паре с землёй.
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Предлог с родительным падежом обозначает земную сферу; «на земле» является точным и идиоматичным соответствием.
theological_decisions:
- issue: Характер всеобщей власти Иисуса
  choice: «Мне дана вся власть на небе и на земле»
  alternative: «Я обладаю всей властью на небе и на земле»
  rationale: Пассив исходного текста сохранён, чтобы не устранять выраженную мысль о даровании власти воскресшему Иисусу. Перевод не уточняет явно, кем она дана, поскольку этого не уточняет сам стих.
- issue: Значение ἐξουσία
  choice: «власть»
  alternative: «сила»
  rationale: «Власть» сохраняет смысл правомочного господства; «сила» могла бы сузить высказывание до могущества или способности действовать.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-сдержанный. Греческая конструкция «заговорил с ними, говоря» естественно свёрнута до «сказал», тогда как пассивное «дана» и всеобщий охват небесной и земной сфер сохранены.
