  source_fidelity: 'Смысл передан точно: Иисус обращается к женщинам, велит им не бояться, пойти и передать Его братьям указание отправиться в Галилею, где они увидят Его. Однако «чтобы они шли в Галилею» неудачно: несовершенный вид «шли» может обозначать процесс, а не предстоящее отправление; кроме того, конструкция звучит менее естественно, чем с «отправились».'
