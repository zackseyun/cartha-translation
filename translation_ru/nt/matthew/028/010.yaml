  text: τότε λέγει αὐταῖς ὁ Ἰησοῦς· Μὴ φοβεῖσθε· ὑπάγετε ἀπαγγείλατε τοῖς ἀδελφοῖς μου ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν, κἀκεῖ με ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/010.yaml
  text: Then Jesus said to them[a], “Do not be afraid. Go, tell my brothers to go to Galilee[c][b], and there they will see me.”
translation:
  language: ru
  text: 'Тогда Иисус сказал им: «Не бойтесь. Идите и скажите Моим братьям[a], чтобы они отправились в Галилею. Там они увидят Меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «Мои братья» — ученики Иисуса; в греческом тексте употреблено существительное мужского рода во множественном числе.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественно обозначает последовательность событий в повествовании.
- source_word: λέγει αὐταῖς
  choice: сказал им
  rationale: Историческое настоящее передано русским прошедшим временем; местоимение сохраняет отсылку к женщинам из контекста без поясняющей вставки.
- source_word: Μὴ φοβεῖσθε
  choice: Не бойтесь
  rationale: Краткая и естественная передача греческого запрета в современном русском языке.
- source_word: ὑπάγετε ἀπαγγείλατε
  choice: Идите и скажите
  rationale: Два повелительных глагола переданы прямо и естественно; «скажите» выражает сообщение порученной вести без излишне официального оттенка.
- source_word: τοῖς ἀδελφοῖς μου
  choice: Моим братьям
  rationale: Сохраняется буквальное родственное обозначение мужского рода, а не заменяется толкованием «ученикам».
- source_word: ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν
  choice: чтобы они шли в Галилею
  rationale: Конструкция с ἵνα выражает содержание передаваемого повеления; «чтобы» естественно сохраняет косвенную форму поручения.
- source_word: κἀκεῖ με ὄψονται
  choice: Там они увидят Меня
  rationale: Передано прямое значение будущей формы ὁράω; «увидят» не сужает смысл до заранее предполагаемой встречи.
theological_decisions:
- issue: Кого Иисус называет «Моими братьями»
  choice: В основном тексте сохранено «Моим братьям»; контекстуальный референт пояснён в сноске как ученики Иисуса.
  alternative: Передать непосредственно как «Моим ученикам».
  rationale: Ближайший контекст указывает на учеников, однако замена образного родственного наименования словом «ученики» устранила бы значимый оттенок исходного текста.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-достоинным повествовательным регистром. Заглавные буквы в местоимениях «Моим», «Меня» применены как традиционный русский библейский издательский стиль.
