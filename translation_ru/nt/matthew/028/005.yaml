base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/005.yaml
  text: But the angel answered and said to the women[a], “Do not be afraid[b]; for I know that you are seeking Jesus who has been crucified.”
translation:
  language: ru
  text: 'В ответ ангел сказал женщинам: «Вы не бойтесь[a], ведь я знаю, что вы ищете Иисуса распятого[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте местоимение «вы» названо особо: слова утешения обращены именно к женщинам.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Иисуса, который был распят».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἄγγελος εἶπεν
  choice: Ангел же обратился и сказал
  rationale: Причастие ἀποκριθείς в сочетании с εἶπεν образует обычную повествовательную формулу. «Обратился… и сказал» естественно по-русски передаёт ответную речевую реакцию, не предполагая обязательно заданного вопроса; частица δέ передана постпозитивным «же» как мягкий переход.
- source_word: ταῖς γυναιξίν
  choice: к женщинам
  rationale: Дательный адресата при глаголе речи естественно передаётся конструкцией «к женщинам»; γυναιξίν здесь означает взрослых женщин, а не жён.
- source_word: Μὴ φοβεῖσθε ὑμεῖς
  choice: Вы не бойтесь
  rationale: Начальное «вы» естественно сохраняет выраженное в греческом тексте и потому эмфатическое ὑμεῖς, особо направляя успокоение к женщинам.
- source_word: οἶδα γὰρ ὅτι
  choice: ведь я знаю, что
  rationale: γάρ вводит основание для призыва не бояться; «ведь» ясно и естественно выражает эту пояснительную связь.
- source_word: Ἰησοῦν τὸν ἐσταυρωμένον
  choice: Иисуса распятого
  rationale: Субстантивированное перфектное страдательное причастие определяет Иисуса как распятого. Русское полное причастие сохраняет краткость и устойчивое значение совершившегося распятия.
- source_word: ζητεῖτε
  choice: вы ищете
  rationale: Настоящее время обозначает продолжающееся действие; русское «ищете» естественно передаёт его без ненужного смыслового уточнения.
theological_decisions:
- issue: Эмфатическое местоимение ὑμεῖς в утешении ангела
  choice: Сохранить акцент начальным «Вы не бойтесь» и пояснить его в сноске.
  alternative: «Не бойтесь»; «Не бойтесь, женщины»
  rationale: Греческое местоимение выражено явно и выделяет женщин как непосредственных адресатов утешения. Формулировка сохраняет этот акцент, не утверждая сверх текста, кого именно следует ему противопоставлять.
- issue: Значение τὸν ἐσταυρωμένον
  choice: «Иисуса распятого»
  alternative: «Иисуса, который был распят»; «Иисуса, которого распяли»
  rationale: Причастная формулировка сохраняет ёмкость греческого определения и не ослабляет сохраняющуюся значимость совершившегося распятия.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок «Ангел же» и определение «Иисуса распятого» сохраняют достоинство и близость к греческой форме, оставаясь понятными современному читателю.
