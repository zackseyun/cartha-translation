  text: καὶ ταχὺ πορευθεῖσαι εἴπατε τοῖς μαθηταῖς αὐτοῦ ὅτι Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἰδοὺ προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν, ἐκεῖ αὐτὸν ὄψεσθε· ἰδοὺ εἶπον ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/007.yaml
  text: And go quickly and tell his disciples, ‘He has been raised from the dead, and look, he is going ahead of you into Galilee. There you will see him.’ Look, I have told you.
translation:
  language: ru
  text: 'И скорее идите и скажите Его ученикам: «Он воскрес из мёртвых и вот, Он идёт впереди вас в Галилею; там вы Его увидите». Вот, я сказал вам.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταχὺ πορευθεῖσαι
  choice: скорее идите
  rationale: Передаёт наречие срочности и повелительную силу причастной конструкции естественным современным русским выражением.
- source_word: Ἠγέρθη ἀπὸ τῶν νεκρῶν
  choice: Он воскрес из мёртвых
  rationale: Греческая пассивная форма допускает оттенок «был воскрешён», однако русское «воскрес» является естественным и традиционным способом обозначить возвращение к жизни, не отрицая действия Бога.
- source_word: προάγει ὑμᾶς
  choice: идёт впереди вас
  rationale: 'Сохраняет пространственный смысл глагола: Иисус опережает учеников и направляется в Галилею прежде них.'
- source_word: ἰδοὺ
  choice: вот
  rationale: Естественно передаёт указательно-эмфатическую частицу в обоих случаях без архаического «се».
theological_decisions:
- issue: Грамматический залог в сообщении о воскресении
  choice: Он воскрес из мёртвых
  alternative: Он был воскрешён из мёртвых
  rationale: Выбрано идиоматичное русское выражение; оно сохраняет событие воскресения, тогда как явное указание на совершающего действие отсутствует и в греческом пассиве.
- issue: Значение προάγει
  choice: идёт впереди вас
  alternative: приведёт вас
  rationale: Контекст движения в Галилею поддерживает буквальное пространственное значение и не требует каузативного истолкования.
translation_notes:
  register: 'Современный литературный русский язык; речь ангела передана ясно и торжественно, без архаизмов. Повтор ἰδοὺ сохранён лишь в заключительной формуле: в первой позиции добавлено «уже», чтобы естественно подчеркнуть опережающее движение и избежать тяжёлого двойного «вот».'
