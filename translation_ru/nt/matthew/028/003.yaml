  text: ἦν δὲ ἡ εἰδέα αὐτοῦ ⸀ὡς ἀστραπὴ καὶ τὸ ἔνδυμα αὐτοῦ λευκὸν ὡς χιών.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/003.yaml
  text: His appearance was like lightning[a], and his clothing white as snow.
translation:
  language: ru
  text: Вид его был подобен молнии[a], а одежда его была бела, как снег.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «облик»; возможно также: «внешность».'
    reason: 'Лексическая вариативность εἰδέα: слово может обозначать вид, облик или внешность.'
lexical_decisions:
- source_word: δὲ
  choice: а
  rationale: Мягкая повествовательная связка; русское «а» естественно соединяет описание вида и одежды, не создавая резкого противопоставления.
- source_word: εἰδέα
  choice: вид
  rationale: Слово обозначает видимый внешний облик или наружность. «Вид» точно, естественно и не вносит дополнительного смысла.
- source_word: ὡς ἀστραπή
  choice: подобен молнии
  rationale: Сохраняет выраженное ὡς сравнение и передаёт образ естественным литературным русским языком.
- source_word: ἔνδυμα
  choice: одежда
  rationale: Общее обозначение одежды; перевод не уточняет её вид как «одеяние» или «риза», поскольку греческий текст этого не делает.
- source_word: λευκόν
  choice: бела
  rationale: Передаёт простое обозначение белого цвета без добавления не выраженной в тексте яркости.
- source_word: ὡς χιών
  choice: как снег
  rationale: Сохраняет второе сравнение, относящееся к белизне одежды.
theological_decisions:
- issue: К кому относятся αὐτοῦ
  choice: Местоимения переданы как «его» и в ближайшем контексте относятся к ангелу Господню из стиха 2.
  alternative: Явно заменить местоимения словом «ангела» либо понять их как указание на Иисуса.
  rationale: Ближайший антецедент — ангел Господень. Сохранение местоимений следует форме греческого текста и не добавляет отсутствующего в стихе существительного.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Эллипсис греческой второй части раскрыт повтором «была» ради ясности и естественности. Формы «бела» и «подобен» сохраняют достоинство стиля без архаизации.
