  yaml_path: translation/nt/matthew/028/017.yaml
  text: And when they saw him[a], they worshiped him, but some doubted.
translation:
  language: ru
  text: Увидев его, они поклонились ему, но некоторые усомнились[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заколебались» или «не решались». Греческое слово может обозначать не устойчивое неверие, а неуверенность или колебание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: увидев
  rationale: Аористное причастие передано естественным русским деепричастием, сохраняющим временную связь с последующими действиями.
- source_word: προσεκύνησαν
  choice: поклонились ему
  rationale: Глагол может обозначать земной поклон, почитание или поклонение. В контексте явления воскресшего Иисуса выражение «поклонились ему» естественно передаёт и действие, и его религиозный смысл, не устраняя лексическую многозначность.
- source_word: οἱ δὲ
  choice: но некоторые
  rationale: Сочетание употреблено эллиптически и противопоставляет часть упомянутой группы остальным; по-русски субъект необходимо выразить явно.
- source_word: ἐδίστασαν
  choice: усомнились
  rationale: Основной перевод сохраняет прямое значение сомнения, а возможный оттенок колебания или нерешительности отмечен в сноске.
theological_decisions:
- issue: Смысл προσκυνέω по отношению к воскресшему Иисусу
  choice: поклонились ему
  alternative: пали перед ним ниц; почтили его
  rationale: Контекст допускает поклонение, однако русский глагол «поклонились» сохраняет как физический, так и религиозный аспект греческого слова, не внося уточнения сверх текста.
- issue: Оттенок значения διστάζω
  choice: усомнились
  alternative: заколебались; не решались
  rationale: Греческое слово может указывать не на устойчивое неверие, а на колебание или неуверенность; эта напряжённость сохранена посредством сноски.
translation_notes:
  register: Современный литературный русский язык; краткая и естественная синтаксическая конструкция. Местоимения, относящиеся к Иисусу, даны со строчной буквы в соответствии с обычной современной издательской практикой и греческим текстом.
