  text: ⸀ἔφη αὐτοῖς ὁ Πιλᾶτος· Ἔχετε κουστωδίαν· ὑπάγετε ἀσφαλίσασθε ὡς οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/065.yaml
  text: Pilate said to them[a], “You have a guard. Go[b], make it secure as you know how.”
translation:
  language: ru
  text: 'Пилат сказал им: «У вас есть стража.[a] Идите и обеспечьте надёжную охрану гробницы, как умеете».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Возьмите стражу»; возможно также: «У вас есть своя стража». Греческую фразу можно понять либо как разрешение Пилата взять стражу, либо как указание на стражу, уже им доступную.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «насколько умеете».'
    reason: alternative_rendering
lexical_decisions:
- source_word: ἔφη αὐτοῖς ὁ Πιλᾶτος
  choice: Пилат сказал им
  rationale: Естественный для современного русского повествовательный порядок слов; ἔφη передано обычным глаголом речи «сказал», а дательный αὐτοῖς — «им».
- source_word: Ἔχετε
  choice: У вас есть
  rationale: Сохраняет прямое изъявительное значение формы ἔχετε и не устраняет контекстуальную неоднозначность между указанием на уже доступную стражу и разрешением взять её.
- source_word: κουστωδίαν
  choice: стража
  rationale: Греческое заимствование из латинского custodia обозначает караул или отряд охраны; «стража» — краткий, ясный и уместный русский эквивалент.
- source_word: ὑπάγετε
  choice: Идите
  rationale: Прямой и естественный перевод повелительной формы со значением отправления.
- source_word: ἀσφαλίσασθε
  choice: охраняйте гробницу
  rationale: В данном контексте глагол означает обеспечить надёжность и безопасность гробницы. Добавление явного объекта «гробницу» устраняет неестественное русское местоимение без изменения контекстуального смысла.
- source_word: ὡς οἴδατε
  choice: так, как умеете
  rationale: Передаёт действие согласно их собственному знанию и умению, не усиливая выражение до «как можно надёжнее».
theological_decisions:
- issue: Даёт ли Пилат римскую стражу или указывает на стражу, уже имевшуюся у религиозных руководителей
  choice: 'В основном тексте: «У вас есть стража»'
  alternative: '«Возьмите стражу»; возможно: «У вас есть своя стража»'
  rationale: Фраза Ἔχετε κουστωδίαν допускает как изъявительное, так и разрешительно-повелительное понимание. Основной текст сохраняет наиболее прямую грамматическую форму, а примечание — исторически значимые варианты.
- issue: Объект глагола ἀσφαλίσασθε
  choice: Явно назвать гробницу
  alternative: «обеспечьте охрану» или «сделайте её надёжной»
  rationale: Объект легко восстанавливается из предыдущего стиха; его явное выражение необходимо для естественного русского и не решает спорного богословского вопроса.
translation_notes:
  register: Современный литературный русский, ясный и сдержанно-достоинственный. Синтаксис речи естественен для повествования; спорная функция ἔχετε не сглажена. Все маркеры примечаний присутствуют в основном тексте.
