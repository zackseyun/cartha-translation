    rationale: Средний аористный императив означает принять меры, чтобы сделать объект надёжно защищённым/обеспечить его безопасность; длительное «охраняйте» скорее описывает несение караула.
  - severity: medium
    issue: Примечание b неудачно привязано и не является ясным вариантом отмеченного выражения.
    rationale: Маркер b поставлен после всей реплики, но текст примечания повторяет «Идите» и предлагает «обеспечьте охрану», не объясняя конкретного альтернативного перевода. Его лучше сделать вариантом заключительной формулы «как умеете» / «насколько умеете».
