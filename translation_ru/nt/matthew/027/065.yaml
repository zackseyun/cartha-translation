review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: Пилат обращается к ним, упоминает стражу и велит им отправиться обеспечить безопасность гробницы согласно их умению. Однако «охраняйте гробницу» несколько сужает ἀσφαλίσασθε, которое означает обеспечить/сделать надёжно защищённой, а не просто нести охрану. Кроме того, примечание b не соответствует месту маркера и не отражает указанного английского варианта: оно фактически предлагает иной перевод всего повеления, тогда как маркер стоит после заключительных слов.'
  naturalness: '«Пилат сказал им: „У вас есть стража. Идите и обеспечьте надёжную охрану гробницы, как умеете“» — естественный современный литературный русский. «Обеспечьте надёжную охрану» точнее передаёт результативный характер греческого глагола, не создавая неясного местоимения.'
  terminology: «Стража» подходит для κουστωδίαν. Альтернативы в примечании a следует сохранить, поскольку Ἔχετε допускает как изъявительное прочтение, так и разрешение/распоряжение. «Гробница» уместна как контекстуально восстановленный объект, хотя в самом стихе она не названа.
