  text: Τῇ δὲ ἐπαύριον, ἥτις ἐστὶν μετὰ τὴν παρασκευήν, συνήχθησαν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι πρὸς Πιλᾶτον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/062.yaml
  text: On the next day[a], which is after the day of Preparation, the chief priests and the Pharisees gathered before Pilate
translation:
  language: ru
  text: На следующий день[a], то есть после дня приготовления, первосвященники и фарисеи собрались у Пилата.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «На другой день, который был после приготовления». Греческое слово может обозначать день приготовления к субботе; перевод «пятница» был бы более истолковывающим, чем требует исходный текст.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: На следующий день
  rationale: Естественно передаёт временной переход; слабая связующая частица δέ отдельно не выражена, чтобы не перегружать русскую фразу.
- source_word: ἥτις ἐστὶν μετὰ τὴν παρασκευήν
  choice: то есть после дня приготовления
  rationale: ἥτις вводит пояснение; «то есть» ясно и естественно передаёт пояснительный характер придаточного.
- source_word: παρασκευήν
  choice: дня приготовления
  rationale: Сохраняет иудейское календарное обозначение дня перед субботой, не подменяя его более истолковывающим словом «пятница».
- source_word: συνήχθησαν
  choice: собрались
  rationale: Форма имеет здесь непереходное значение; «собрались» кратко и естественно передаёт совместное действие.
- source_word: οἱ ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся русское обозначение представителей высшего священства во множественном числе.
- source_word: οἱ Φαρισαῖοι
  choice: фарисеи
  rationale: Устоявшееся русское название этой иудейской религиозной группы.
- source_word: πρὸς Πιλᾶτον
  choice: у Пилата
  rationale: В сочетании с глаголом собрания πρός указывает на прибытие и собрание перед лицом Пилата; «у Пилата» естественно по-русски и не уточняет сверх текста официальный характер встречи.
- source_word: Πιλᾶτον
  choice: Пилата
  rationale: Устоявшаяся русская форма имени Πιλᾶτος.
