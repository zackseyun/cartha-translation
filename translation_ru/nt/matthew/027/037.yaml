  text: καὶ ἐπέθηκαν ἐπάνω τῆς κεφαλῆς αὐτοῦ τὴν αἰτίαν αὐτοῦ γεγραμμένην· Οὗτός ἐστιν Ἰησοῦς ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/037.yaml
  text: 'And they placed above his head the charge against him[a], written: “This is Jesus[b], the King of the Jews.”'
translation:
  language: ru
  text: 'И над Его головой поместили написанное обвинение против Него[a]: «Это Иисус, Царь иудеев[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обвинение против Него». Греческое слово αἰτία здесь употреблено в юридическом смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Царь жителей Иудеи». Греческое слово Ἰουδαίων в зависимости от контекста может означать как иудеев, так и жителей Иудеи.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέθηκαν
  choice: поместили
  rationale: 'Аорист ἐπιτίθημι обозначает конкретное действие: надпись поместили над головой Иисуса. «Поместили» естественно и точно передаёт пространственный смысл.'
- source_word: ἐπάνω τῆς κεφαλῆς αὐτοῦ
  choice: над Его головой
  rationale: ἐπάνω с родительным падежом указывает на положение выше головы, а не непосредственно на ней.
- source_word: τὴν αἰτίαν αὐτοῦ γεγραμμένην
  choice: надпись с предъявленным Ему обвинением
  rationale: Причастие γεγραμμένην сообщает, что обвинение было написано; по-русски сочетание «надпись с ... обвинением» ясно передаёт и материальную табличку, и судебный смысл αἰτία.
- source_word: Οὗτός ἐστιν Ἰησοῦς
  choice: Это Иисус
  rationale: Прямо передаёт указательное местоимение с глаголом-связкой и сохраняет краткость текста надписи.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: Царь иудеев
  rationale: «Царь» передаёт βασιλεύς как царский титул; «иудеев» является традиционным и контекстуально уместным обозначением народа в формуле обвинения.
theological_decisions:
- issue: Юридический смысл αἰτία
  choice: предъявленное Ему обвинение
  alternative: основание Его вины
  rationale: В сцене казни αἰτία обозначает официальное обвинение. Выбранная формулировка сохраняет юридический смысл, не добавляя богословского толкования.
- issue: Значение Ἰουδαίων в царском титуле
  choice: иудеев
  alternative: жителей Иудеи
  rationale: В формуле надписи речь идёт о царско-политическом титуле «Царь иудеев». При этом греческое слово допускает в иных контекстах территориальное понимание, что отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Структура предложения сохраняет последовательность греческого текста; формулировка надписи оставлена краткой и торжественной.
