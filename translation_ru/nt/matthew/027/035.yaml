  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σταυρώσαντες
  choice: Распяв
  rationale: 'Аористное причастие обозначает действие, предшествующее основному: сначала Иисуса распяли, затем разделили Его одежды. Русское деепричастие естественно и кратко передаёт эту последовательность.'
- source_word: δὲ
  choice: не передано отдельным словом
  rationale: Здесь δέ служит слабой повествовательной связкой. В русском продолжение рассказа естественно выражается без отдельного союза; добавление «и» перед деепричастным оборотом было бы стилистически тяжеловесно.
- source_word: διεμερίσαντο
  choice: разделили
  rationale: Глагол означает разделить между собой или распределить; «разделили» точно передаёт конкретное действие с одеждами.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: Его одежды
  rationale: ἱμάτια обозначает одежду или предметы одежды без обязательного ограничения только верхней одеждой. «Одежды» сохраняет несколько торжественный, но понятный современному читателю регистр.
- source_word: βάλλοντες κλῆρον
  choice: бросив жребий
  rationale: Устойчивое русское выражение «бросить жребий» естественно передаёт греческий оборот. Совершенный вид согласуется с распределением одежды по результату жеребьёвки, хотя форма причастия допускает и более буквальное описание сопутствующего действия.
theological_decisions:
- issue: Связь βάλλοντες κλῆρον с διεμερίσαντο
  choice: «разделили Его одежды, бросив жребий» — жеребьёвка представлена как способ распределения
  alternative: «разделили Его одежды, бросая жребий»
  rationale: Причастный оборот поясняет, каким образом были разделены одежды. Русское деепричастие сохраняет связь с главным действием, не внося дополнительных богословских выводов.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для повествования о страстях Христа. Прописное «Его» употреблено по принятой в русских библейских текстах уважительной норме; архаизмы исключены.
