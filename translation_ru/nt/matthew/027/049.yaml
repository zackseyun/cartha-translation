  text: οἱ δὲ λοιποὶ ⸀ἔλεγον· Ἄφες ἴδωμεν εἰ ἔρχεται Ἠλίας σώσων ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/049.yaml
  text: But the rest said[a], “Leave him alone[b]. Let us see whether Elijah is coming to save him.”
translation:
  language: ru
  text: 'А остальные говорили[a]: «Оставь![b] Посмотрим, идёт ли Илия спасти его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «А другие говорили».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Оставь». В контексте также возможно: «Не мешай!» или «Оставь его в покое!»'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: А остальные
  rationale: «Остальные» естественно обозначает оставшихся людей в противопоставлении только что упомянутому человеку; союз «а» передаёт повествовательный контраст δέ.
- source_word: ἔλεγον
  choice: говорили
  rationale: Несовершенный вид передаёт греческий имперфект и допускает как продолжающуюся, так и повторявшуюся речь, не вынуждая выбрать один оттенок.
- source_word: Ἄφες
  choice: Оставь!
  rationale: Краткий императив сохраняет отсутствие выраженного дополнения в греческом тексте. В контексте это призыв не вмешиваться или прекратить действие, но уточнение «его в покое» сделало бы подразумеваемый смысл явным.
- source_word: ἴδωμεν
  choice: Посмотрим
  rationale: 'Естественно передаёт побудительный конъюнктив первого лица множественного числа: говорящие предлагают подождать и увидеть, что произойдёт.'
- source_word: εἰ ἔρχεται
  choice: идёт ли
  rationale: Частица «ли» вводит косвенный вопрос, а настоящее время «идёт» сохраняет непосредственность греческого ἔρχεται, не заменяя её однозначным будущим «придёт».
- source_word: Ἠλίας
  choice: Илия
  rationale: Традиционная и общеупотребительная русская форма имени ветхозаветного пророка.
- source_word: σώσων αὐτόν
  choice: спасти его
  rationale: Будущее причастие выражает цель прихода. «Спасти» сохраняет обычное значение σῴζω и повествовательную иронию, а в данном контексте означает избавление от смерти на кресте.
theological_decisions:
- issue: Богословские оттенки глагола σῴζω в рассказе о распятии
  choice: спасти его
  alternative: избавить его; снять его с креста
  rationale: Реплика относится к ожидаемому видимому избавлению Иисуса от смерти. Слово «спасти» сохраняет лексическую связь и иронию повествования, не превращая речь наблюдателей в сформулированное учение о вечном спасении.
- issue: Прописная или строчная буква в местоимении αὐτόν
  choice: его
  alternative: Его
  rationale: В греческом тексте местоимение само по себе не выражает почтительного написания. Строчная буква сохраняет нейтральный повествовательный регистр и не добавляет конфессиональной типографской интерпретации.
translation_notes:
  register: Современный литературный русский язык с краткой, напряжённой репликой, соответствующей сцене распятия. Сохранены имперфект «говорили», невыраженное дополнение при Ἄφες и настоящее время ἔρχεται; формулировка остаётся понятной без архаизации.
