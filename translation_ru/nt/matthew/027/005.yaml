  text: καὶ ῥίψας τὰ ἀργύρια ⸂εἰς τὸν ναὸν⸃ ἀνεχώρησεν, καὶ ἀπελθὼν ἀπήγξατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/005.yaml
  text: And throwing the silver into the temple[a], he departed[b], and went and hanged himself.
translation:
  language: ru
  text: Бросив серебряные монеты в храм[a], он удалился и, уйдя, повесился.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в святилище». Греческое слово ναός часто обозначает собственно храмовое святилище, а не весь храмовый комплекс.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίψας
  choice: бросив
  rationale: Аористное причастие обозначает действие, предшествующее уходу; русское деепричастие естественно и точно передаёт последовательность без лишнего пояснения.
- source_word: τὰ ἀργύρια
  choice: серебряные монеты
  rationale: Форма множественного числа обозначает серебряные деньги, упомянутые в контексте. «Серебряные монеты» понятно современному читателю и не использует архаичное «сребреники».
- source_word: εἰς τὸν ναόν
  choice: в храм[a]
  rationale: «В храм» звучит естественно в основном тексте; более узкое значение ναός — храмовое святилище, а не весь храмовый комплекс — отмечено в сноске.
- source_word: ἀνεχώρησεν
  choice: он удалился
  rationale: Глагол означает уйти или удалиться; «удалился» сохраняет торжественно-сдержанный тон и позволяет отличить его от следующего глагола движения.
- source_word: ἀπελθών
  choice: а затем ушёл
  rationale: Отдельное действие движения сохранено, хотя в русском возникает намеренное смысловое повторение, присутствующее и в греческом тексте.
- source_word: ἀπήγξατο
  choice: повесился
  rationale: Средний залог указывает на действие над собой; в данном контексте наиболее естественное и общепринятое значение — самоубийство через повешение.
theological_decisions:
- issue: Узкое значение ναός по сравнению с обозначением всего храмового комплекса
  choice: В основном тексте — «храм», с уточнением «святилище» в сноске.
  alternative: святилище; храмовое святилище
  rationale: Так сохраняются и естественность русского повествования, и архитектурная точность греческого слова без привнесения богословского толкования.
- issue: Соотношение двух последовательных глаголов ухода
  choice: 'Сохранены оба движения: «удалился, а затем ушёл».'
  alternative: ушёл и повесился
  rationale: Греческий текст употребляет и ἀνεχώρησεν, и ἀπελθών. Несмотря на небольшую смысловую избыточность по-русски, перевод не устраняет эту особенность исходного текста.
translation_notes:
  register: Современный литературный русский язык со сдержанным повествовательным тоном. Архаичное «сребреники» заменено понятным выражением «серебряные монеты»; подлинное повторение двух глаголов ухода сохранено.
