source:
  edition: SBLGNT
  text: καὶ εὐθέως δραμὼν εἷς ἐξ αὐτῶν καὶ λαβὼν σπόγγον πλήσας τε ὄξους καὶ περιθεὶς καλάμῳ ἐπότιζεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/048.yaml
  text: And immediately one of them ran[a], took a sponge, filled it with sour wine, put it on a reed[b], and gave him a drink.
translation:
  language: ru
  text: И тотчас один из них побежал, взял губку, наполнил её кислым вином[a], насадил её на трость и давал ему пить[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «винным уксусом». Греческое слово может обозначать кислое вино или винный уксус.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий глагол имеет форму несовершенного вида: «давал ему пить» или «поил его»; в контексте возможно также понимание действия как попытки напоить его.'
    reason: aspectual_ambiguity
lexical_decisions:
- source_word: εὐθέως
  choice: тотчас
  rationale: Передаёт незамедлительность действия кратким и естественным для повествования словом.
- source_word: δραμὼν
  choice: побежал
  rationale: Аористное причастие естественно передано личной формой в последовательной цепи действий; сохраняется ощущение срочности.
- source_word: εἷς ἐξ αὐτῶν
  choice: один из них
  rationale: Прямой и идиоматичный эквивалент партитивного оборота.
- source_word: λαβὼν σπόγγον
  choice: взял губку
  rationale: Личная форма делает цепь аористных причастий естественной в современном русском повествовании.
- source_word: πλήσας τε ὄξους
  choice: наполнил её кислым вином
  rationale: ὄξος обозначает прокисшее вино или винный уксус; «кислое вино» яснее передаёт напиток и не вызывает современного представления о столовом уксусе.
- source_word: περιθεὶς καλάμῳ
  choice: насадил на трость
  rationale: Передаёт помещение губки на конец трости естественным русским выражением без добавления лишних деталей.
- source_word: ἐπότιζεν αὐτόν
  choice: стал поить его
  rationale: Несовершенный вид греческого глагола обозначает развёртывающееся или продолжавшееся действие; «стал поить» сохраняет этот аспект лучше, чем однократное «дал пить».
theological_decisions:
- issue: Характер напитка, поднесённого Иисусу
  choice: кислое вино
  alternative: уксус
  rationale: Греческое ὄξος допускает оба обозначения, однако речь идёт о кислом винном напитке; основной текст передаёт вероятный предмет, а примечание сохраняет традиционный лексический вариант.
- issue: Завершённость действия ἐπότιζεν
  choice: стал поить
  alternative: дал ему пить; пытался напоить
  rationale: Имперфект представляет действие в процессе, но сам по себе не решает однозначно, насколько успешно Иисус пил. Основной текст сохраняет процессуальность, а примечание отмечает возможные контекстуальные оттенки.
translation_notes:
  register: Современный литературный русский язык с лаконичным повествовательным ритмом. Цепь греческих причастий передана однородными личными формами. Местоимение «его» оставлено со строчной буквы, поскольку прописная буква была бы привнесённой редакционной конфессиональной нормой, не выраженной в греческом тексте.
