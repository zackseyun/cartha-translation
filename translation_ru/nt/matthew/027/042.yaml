  text: Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι· ⸀βασιλεὺς Ἰσραήλ ἐστιν, καταβάτω νῦν ἀπὸ τοῦ σταυροῦ καὶ πιστεύσομεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/042.yaml
  text: He saved others; he cannot save himself. He is the King of Israel; let him come down now from the cross[a], and we will believe in him.
translation:
  language: ru
  text: Других спас, а Себя спасти не может. Он Царь Израиля — пусть теперь сойдёт с креста[a], и мы поверим в Него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если Он Царь Израиля, пусть теперь сойдёт с креста, и мы поверим в Него». В некоторых переводах насмешка передана явной условной конструкцией, однако в греческом тексте титул утверждается прямо.'
    reason: Альтернативная передача подразумеваемого условного оттенка.
lexical_decisions:
- source_word: Ἄλλους ἔσωσεν
  choice: Других спасал
  rationale: Субстантивированное «других» сохраняет краткий контраст с «Себя». Русский несовершенный вид естественно передаёт насмешливую отсылку к известным прежним делам Иисуса, тогда как аорист констатирует их в целом.
- source_word: ἑαυτὸν οὐ δύναται σῶσαι
  choice: а Себя спасти не может
  rationale: Противительный союз «а» естественно выражает резкий контраст, заложенный в соположении фраз; порядок слов сохраняет акцент на «Себя».
- source_word: βασιλεὺς Ἰσραήλ
  choice: Он Царь Израиля
  rationale: Греческий текст прямо формулирует именную предикативную фразу без условного союза; титул передан традиционно и ясно.
- source_word: καταβάτω νῦν
  choice: пусть теперь сойдёт
  rationale: Конструкция с «пусть» естественно передаёт повелительное наклонение третьего лица, а «теперь» — νῦν и безотлагательность насмешливого требования.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: с креста
  rationale: Идиоматичный и точный русский эквивалент исходной предложной конструкции.
- source_word: πιστεύσομεν ἐπ’ αὐτόν
  choice: мы поверим в Него
  rationale: «Поверить в» с винительным падежом естественно передаёт направленную на личность веру, выраженную πιστεύω с ἐπί и винительным.
theological_decisions:
- issue: Передача насмешливого заявления о царском достоинстве Иисуса
  choice: Он Царь Израиля
  alternative: Если Он Царь Израиля
  rationale: 'В греческом тексте нет выраженного условия: титул утверждается прямо, хотя в контексте звучит насмешливо. Вставка «если» делала бы неявный смысл грамматически явным и тем самым сужала бы подлинную формальную напряжённость.'
translation_notes:
  register: Современный литературный русский язык; фраза краткая, резкая и достойная по тону, с сохранением насмешливой силы реплики. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией.
