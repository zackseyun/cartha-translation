  yaml_path: translation/nt/matthew/027/058.yaml
  text: He went to Pilate and asked for the body of Jesus[a]. Then Pilate ordered it to be given to him.
translation:
  language: ru
  text: Он пришёл к Пилату и попросил тело Иисуса. Тогда Пилат приказал выдать тело.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отдать его»; или: «передать его». Греческий инфинитив допускает здесь несколько близких по смыслу вариантов перевода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Он
  rationale: Указательное местоимение относится к Иосифу из Аримафеи, названному в предыдущем стихе; в связном русском повествовании естественно употребить личное местоимение.
- source_word: προσελθὼν
  choice: пришёл к
  rationale: Причастие обозначает предшествующее действие и движение к Пилату. «Пришёл к» естественно для современного повествования; «подойдя к» было бы более буквальным, но менее плавным.
- source_word: ᾐτήσατο
  choice: попросил
  rationale: Глагол означает просьбу предоставить нечто; прямое дополнение «тело Иисуса» ясно передаёт содержание просьбы.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: тело Иисуса
  rationale: Сохранено нейтральное и достойное «тело», без более клинического «труп».
- source_word: τότε
  choice: Тогда
  rationale: Передаёт последовательность событий в повествовании.
- source_word: ἐκέλευσεν
  choice: приказал
  rationale: Точно передаёт распоряжение представителя власти и естественно сочетается с инфинитивом.
- source_word: ἀποδοθῆναι
  choice: выдать тело
  rationale: Пассивный инфинитив обозначает санкционированную передачу тела. Русская безличная конструкция после «приказал» сохраняет невыраженного исполнителя; повтор слова «тело» устраняет неясность без добавления прямо не названного получателя.
