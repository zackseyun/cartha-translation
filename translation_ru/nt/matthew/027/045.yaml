base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/045.yaml
  text: From the sixth hour darkness came over all the land until the ninth hour[a][b].
translation:
  language: ru
  text: С шестого часа и до девятого часа всю землю окутывала тьма[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Шестой час — примерно полдень, а девятый — примерно три часа дня.
    reason: cultural_note
  - marker: b
    text: 'Или: «всю страну»; также возможно: «всю Землю». Греческое слово γῆ может означать и землю (страну), и Землю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ
  choice: С
  rationale: ἀπό обозначает начальную временную точку; мягкая связка δέ по-русски здесь естественно остаётся невыраженной, поскольку явного противопоставления нет.
- source_word: ἕκτης ὥρας
  choice: шестого часа
  rationale: Сохранена исходная система счёта времени; современный приблизительный эквивалент дан в сноске.
- source_word: σκότος
  choice: тьма
  rationale: Передаёт буквальную темноту и сохраняет краткость и выразительность греческого слова.
- source_word: ἐγένετο
  choice: покрыла… и продолжалась
  rationale: В сочетании с временными пределами передаёт наступление тьмы и её длительность естественным русским языком, не добавляя причины события.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: всю землю
  rationale: 'Русское «землю» сохраняет смысловую широту γῆ: это может означать как всю данную землю или страну, так и всю Землю; варианты разъяснены в сноске.'
- source_word: ἕως ὥρας ἐνάτης
  choice: до девятого часа
  rationale: Сохранено исходное обозначение времени, а приблизительный современный эквивалент вынесен в сноску.
theological_decisions:
- issue: Пространственный охват γῆ в сообщении о тьме
  choice: землю
  alternative: страну; всю Землю
  rationale: Греческое γῆ допускает местное и всеобщее понимание. Основной русский текст намеренно сохраняет эту неоднозначность, а сноска называет оба возможных прочтения, не решая вопрос о масштабе события.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Исторические обозначения часов сохранены в основном тексте; синтаксис сделан естественным для широкого круга читателей. Все маркеры сносок присутствуют в тексте.
