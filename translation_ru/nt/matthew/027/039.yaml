  text: οἱ δὲ παραπορευόμενοι ἐβλασφήμουν αὐτὸν κινοῦντες τὰς κεφαλὰς αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/039.yaml
  text: And those passing by were blaspheming him[a], shaking their heads[b],
translation:
  language: ru
  text: А проходившие мимо хулили Его[a], качая головами[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поносили Его». Греческий глагол может обозначать оскорбительную или злословящую речь, а не только хулу на Бога в узком смысле.'
    reason: lexical_alternative
  - marker: b
    text: Это был жест презрения и насмешки; ср. Пс. 21:8 (22:7).
    reason: cross_reference
lexical_decisions:
- source_word: οἱ δὲ
  choice: А проходившие
  rationale: δέ — мягкая повествовательная связка; «а» естественно продолжает рассказ, не создавая чрезмерно резкого противопоставления. Артикль с причастием передан субстантивированным оборотом.
- source_word: παραπορευόμενοι
  choice: проходившие мимо
  rationale: Причастие настоящего времени обозначает людей, проходивших возле места распятия; русский несовершенный вид сохраняет продолжающийся характер действия.
- source_word: ἐβλασφήμουν
  choice: хулили
  rationale: «Хулили» сохраняет сильное значение греческого глагола и его несовершенный вид, но в русском может обозначать как кощунственную речь, так и злословие или поношение человека.
- source_word: αὐτὸν
  choice: Его
  rationale: Прямое дополнение, относящееся к Иисусу; прописная буква соответствует принятому благоговейному оформлению местоимений, относящихся к Нему.
- source_word: κινοῦντες
  choice: качая
  rationale: Одновременное сопутствующее действие передано деепричастием; «качая головами» — естественное современное обозначение жеста презрения.
- source_word: τὰς κεφαλὰς αὐτῶν
  choice: головами
  rationale: Русская конструкция «качать головами» естественно передаёт греческое множественное число и подразумевает принадлежность голов действующим лицам без избыточного «своими».
theological_decisions:
- issue: Смысл βλασφημέω применительно к Иисусу в повествовании о Страстях
  choice: Сохранить в основном тексте сильное слово «хулили»
  alternative: поносили
  rationale: Греческий глагол сильнее общего обозначения насмешки. «Хулили» сохраняет лексику Матфея и возможный богословский оттенок, не утверждая переводом, что здесь обязательно имеется в виду только хула на Бога; более широкое значение поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим повествованию о Страстях. Несовершенные формы «проходившие», «хулили» и «качая» передают длительность и одновременность действий. Порядок слов остаётся естественным для русского и близким к структуре греческого текста.
