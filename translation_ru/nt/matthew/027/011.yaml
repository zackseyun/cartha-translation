  text: Ὁ δὲ Ἰησοῦς ⸀ἐστάθη ἔμπροσθεν τοῦ ἡγεμόνος· καὶ ἐπηρώτησεν αὐτὸν ὁ ἡγεμὼν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ Ἰησοῦς ⸀ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/011.yaml
  text: Jesus stood before the governor[a], and the governor questioned him, saying, “Are you the King of the Jews?” And Jesus said[b], “You say so.”
translation:
  language: ru
  text: 'Иисус же предстал перед правителем, и тот спросил Его: «Ты Царь иудеев[a]?» Иисус сказал: «Ты сам это говоришь[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Царь жителей Иудеи». Греческое слово может обозначать как иудеев в более широком смысле, так и жителей Иудеи, хотя здесь традиционное «иудеев» лучше соответствует политико-этническому контексту.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Ты так говоришь» или «Это ты говоришь». В греческом ответ краток и несколько недосказан.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐστάθη
  choice: предстал
  rationale: Форма ἵστημι здесь описывает положение Иисуса перед правителем; «предстал» естественно передаёт судебную обстановку, не добавляя явно выраженного принуждения.
- source_word: ἔμπροσθεν
  choice: перед
  rationale: Краткий и естественный эквивалент, уместный как для пространственного положения, так и для официального разбирательства.
- source_word: ἡγεμών
  choice: правитель
  rationale: Обозначает римского должностного правителя; «правитель» понятно современному читателю и не вводит более узкий исторический титул, которого нет в самом греческом слове.
- source_word: ἐπηρώτησεν
  choice: спросил
  rationale: В контексте суда вопрос имеет официальный характер, однако нейтральное «спросил» точнее сохраняет степень интенсивности глагола, чем более сильное «допросил».
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: Царь иудеев
  rationale: Устоявшееся и понятное обозначение заявленного царского статуса Иисуса в политическом обвинении; прописная буква отражает употребление выражения как титула в прямой речи.
- source_word: ἔφη
  choice: сказал
  rationale: Прямой нейтральный эквивалент глагола, вводящего ответ Иисуса; «ответил» контекстуально возможно, но несколько более истолковывающе.
- source_word: Σὺ λέγεις
  choice: Ты говоришь
  rationale: Близко передаёт краткую и эллиптическую греческую реплику, не превращая её ни в однозначное утверждение, ни в отрицание.
theological_decisions:
- issue: Смысл ответа Иисуса Σὺ λέγεις
  choice: Сохранена сдержанная и неоднозначная формулировка «Ты говоришь».
  alternative: «Да, это так» или «Ты верно сказал».
  rationale: Греческая реплика допускает косвенное, возможно квалифицированное подтверждение, однако не формулирует безоговорочного согласия с политической постановкой вопроса. Перевод сохраняет это напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Частица «же» передаёт греческое δέ и связывает стих с предшествующим повествованием. Повтор «правитель» сокращён до естественного местоименного «тот» без потери референта. Все примечания поставлены непосредственно после выражений, к которым относятся.
