base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/014.yaml
  text: And he did not answer him with even one word[b][a], so that the governor was greatly amazed.
translation:
  language: ru
  text: И Он не ответил ему ни единым словом, так что правитель весьма изумился.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: не ответил
  rationale: Аорист депонентного ἀποκρίνομαι имеет обычное значение «ответить»; русское «не ответил» прямо и естественно передаёт действие.
- source_word: αὐτῷ
  choice: ему
  rationale: Дательный падеж указывает на того, кому Иисус не ответил; в контексте это правитель Пилат.
- source_word: πρὸς οὐδὲ ἓν ῥῆμα
  choice: ни единым словом
  rationale: Выражение подчёркивает полное отсутствие ответа. «Ни единым словом» естественно и выразительно передаёт усиленное отрицание οὐδὲ ἕν, сохраняя ῥῆμα в значении «слово».
- source_word: ὥστε
  choice: так что
  rationale: Союз вводит следствие; «так что» точно и естественно выражает результат.
- source_word: θαυμάζειν
  choice: был ... удивлён
  rationale: Инфинитив в конструкции с ὥστε передаётся русской личной формой; «был удивлён» естественно обозначает возникшую реакцию правителя.
- source_word: τὸν ἡγεμόνα
  choice: правитель
  rationale: В данном римском административном контексте ἡγεμών обозначает Пилата как правителя провинции; «правитель» сохраняет принятую в русском библейском языке точность и достоинство.
- source_word: λίαν
  choice: чрезвычайно
  rationale: Наречие обозначает высокую степень; «чрезвычайно» ясно сохраняет сильное усиление.
