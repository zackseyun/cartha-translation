  text: διὸ ἐκλήθη ὁ ἀγρὸς ἐκεῖνος Ἀγρὸς Αἵματος ἕως τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/008.yaml
  text: Therefore that field has been called Field of Blood to this day.
translation:
  language: ru
  text: Поэтому то поле и по сей день называется Полем Крови.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь с предшествующим рассказом о покупке поля и происхождении его названия.
- source_word: ἐκλήθη
  choice: называется
  rationale: Хотя в греческом употреблён аорист пассивного залога («было названо»), сочетание с ἕως τῆς σήμερον указывает на название, сохранявшееся до времени автора; настоящее время естественно передаёт это по-русски.
- source_word: ὁ ἀγρὸς ἐκεῖνος
  choice: то поле
  rationale: Сохраняет обычное значение ἀγρός и повтор того же существительного в последующем названии.
- source_word: Ἀγρὸς Αἵματος
  choice: Полем Крови
  rationale: Прозрачно передаёт название с родительным αἵματος и сохраняет повтор слова «поле»; творительный падеж обусловлен русской конструкцией «называется».
- source_word: ἕως τῆς σήμερον
  choice: и по сей день
  rationale: Естественное современное русское выражение, обозначающее сохранение названия вплоть до времени повествователя.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Частица «и» в выражении «и по сей день» естественно подчёркивает продолжающееся употребление названия.
