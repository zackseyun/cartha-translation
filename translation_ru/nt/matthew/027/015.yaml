id: MAT.27.15
reference: Matthew 27:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Κατὰ δὲ ἑορτὴν εἰώθει ὁ ἡγεμὼν ἀπολύειν ἕνα τῷ ὄχλῳ δέσμιον ὃν ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/015.yaml
  text: At the feast the governor was accustomed to release to the crowd one prisoner[a], whom they wanted.
translation:
  language: ru
  text: Во время праздника[a] правитель обычно отпускал толпе одного узника — того, кого они хотели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на праздник».'
    reason: Лексико-синтаксический вариант передачи временного оборота Κατὰ ἑορτή.
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: Во время праздника
  rationale: Κατά с винительным падежом имеет здесь временное значение «во время / на праздник». Частица δέ лишь продолжает повествование и не требует отдельного слова в естественном русском тексте.
- source_word: εἰώθει
  choice: обычно отпускал
  rationale: Форма выражает обычное, повторявшееся в прошлом действие; «обычно отпускал» передаёт это естественнее, чем более тяжёлое «имел обыкновение отпускать».
- source_word: ὁ ἡγεμὼν
  choice: правитель
  rationale: В контексте речь идёт о римском провинциальном правителе; выбор сохраняет общий титул греческого текста, не вводя более узкое административное наименование.
- source_word: ἀπολύειν
  choice: отпускал
  rationale: Глагол означает освобождение из-под стражи; в сочетании с «узником» русское «отпускал» ясно и естественно.
- source_word: ἕνα τῷ ὄχλῳ δέσμιον
  choice: отпускал толпе одного узника
  rationale: Сохранены числительное «одного», значение δέσμιος как находящегося в заключении человека и дательный адресата τῷ ὄχλῳ без добавления отсутствующих в тексте слов «по просьбе» или «по выбору».
- source_word: ὃν ἤθελον
  choice: того, кого они хотели
  rationale: Оборот ясно связывает относительное местоимение с одним узником и сохраняет множественное число глагола, которым греческий текст обозначает людей, составляющих толпу.
