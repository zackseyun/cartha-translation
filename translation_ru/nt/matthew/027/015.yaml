  source_fidelity: «Во время праздника» точно передаёт временное значение Κατὰ ... ἑορτήν; привычное в прошлом действие εἰώθει отражено словом «обычно». «Правитель», «отпускал», «толпе», «одного узника» и относительное уточнение «того, кого они хотели» сохраняют смысл и синтаксические отношения греческого текста. Частица δέ может не передаваться отдельно в русском без смысловой потери.
  naturalness: Текст звучит естественно на современном литературном русском. Тире перед уточнением уместно и делает связь выбора толпы с узником ясной.
  terminology: «Узник» точно передаёт δέσμιος и соответствует сдержанному библейскому регистру. «Правитель» допустимо передаёт общий титул ἡγεμών, не навязывая более узкий административный титул. Сноска предлагает допустимый временной вариант, не создавая смысловой двусмысленности в основном тексте.
