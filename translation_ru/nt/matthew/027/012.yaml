  text: καὶ ἐν τῷ κατηγορεῖσθαι αὐτὸν ὑπὸ τῶν ἀρχιερέων ⸀καὶ πρεσβυτέρων οὐδὲν ἀπεκρίνατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/012.yaml
  text: And while he was being accused by the chief priests and elders[a], he answered nothing.
translation:
  language: ru
  text: И когда Его обвиняли первосвященники и старейшины, Он ничего не ответил.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он не дал никакого ответа».'
    reason: Лексически допустимая, несколько более свободная передача сочетания οὐδὲν ἀπεκρίνατο.
lexical_decisions:
- source_word: ἐν τῷ κατηγορεῖσθαι
  choice: когда … обвиняли Его
  rationale: Конструкция ἐν с субстантивированным инфинитивом выражает одновременность. Русская личная конструкция естественна и сохраняет временное отношение и смысл пассива.
- source_word: κατηγορεῖσθαι
  choice: обвиняли Его
  rationale: Глагол обозначает выдвижение обвинений; «обвиняли» точно и естественно передаёт продолжающееся действие в судебном контексте.
- source_word: ὑπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων
  choice: первосвященники и старейшины
  rationale: В Евангелиях ἀρχιερεῖς обозначает представителей высшего священнического руководства; традиционное русское «первосвященники» передаёт это значение без предположения о нескольких одновременно действующих верховных первосвященниках.
- source_word: οὐδὲν
  choice: ничего
  rationale: Сохраняется прямое объектное значение греческого слова, без замены более истолковывающей формулировкой.
- source_word: ἀπεκρίνατο
  choice: не ответил
  rationale: Аорист депонентного глагола естественно передаётся совершенным видом «ответил»; вместе с οὐδέν получается ясное «ничего не ответил».
- source_word: καὶ
  choice: И
  rationale: Союз продолжает повествование без добавления не выраженного в тексте противопоставления.
theological_decisions:
- issue: Молчание Иисуса перед обвинителями
  choice: 'Передать как прямое повествовательное сообщение: «Он ничего не ответил»'
  alternative: Усилить возможную связь с Исайей 53 формулировкой «Он не открыл уст»
  rationale: Стих сообщает факт молчания, но сам прямо не указывает на исполнение пророчества; перевод не должен вносить эту интерпретацию в основной текст.
translation_notes:
  register: Современный литературный русский язык; фраза звучит естественно и достойно. Местоимение «Его/Он» оформлено с прописной буквы в соответствии с принятой русской библейской издательской практикой.
