  text: ἔδωκαν αὐτῷ πιεῖν ⸀οἶνον μετὰ χολῆς μεμιγμένον· καὶ γευσάμενος οὐκ ⸀ἠθέλησεν πιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/034.yaml
  text: They gave him wine mixed with gall to drink[a], but after tasting it, he was unwilling to drink.
translation:
  language: ru
  text: Ему дали выпить вина, смешанного с желчью[a], но, попробовав его, он не захотел пить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово χολή может означать «желчь» или, шире, горькое вещество. Здесь сохранено слово «желчь», соответствующее формулировке Матфея; ср. близкий рассказ о страданиях в Мк. 15:23, где упоминается смирна.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν αὐτῷ πιεῖν
  choice: Ему дали выпить
  rationale: Передаёт конструкцию с δίδωμι и инфинитивом естественным современным русским языком, сохраняя прямое значение «дали».
- source_word: οἶνον
  choice: вина
  rationale: Обычное значение греческого слова — «вино»; контекст не требует более общего обозначения напитка.
- source_word: μετὰ χολῆς μεμιγμένον
  choice: смешанного с желчью
  rationale: Причастие μεμιγμένον прямо выражает смешивание, а χολή может означать собственно желчь или, шире, горькое вещество. В основном тексте сохранено конкретное «желчь».
- source_word: καὶ γευσάμενος
  choice: но, попробовав его
  rationale: Γεύομαι здесь означает «пробовать на вкус». Союз καί передан как «но», поскольку последующий отказ создаёт естественное противопоставление.
- source_word: οὐκ ἠθέλησεν πιεῖν
  choice: он не захотел пить
  rationale: Точно сохраняет значение волеизъявления у θέλω и не усиливает его до более категоричного «отказался».
theological_decisions:
- issue: Значение χολή и его связь с библейским повествованием о страданиях
  choice: желчь
  alternative: горькое вещество
  rationale: «Желчь» сохраняет лексическую конкретность Матфея и возможный ветхозаветный резонанс, тогда как сноска честно отмечает более широкое значение слова и отличие формулировки в Мк. 15:23.
translation_notes:
  register: Современный литературный русский язык; изложение естественное и сдержанно-достоинственное. Оборот «не захотел пить» сохраняет смысл волевого нежелания без избыточного усиления.
