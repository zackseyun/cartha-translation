base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/030.yaml
  text: And after spitting on him[b][a], they took the reed and kept striking his head.
translation:
  language: ru
  text: И, плюнув на Него, они взяли трость и били Его по голове.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «продолжали бить Его по голове». Греческий глагол стоит в имперфекте и может подчёркивать повторяющееся или продолжавшееся действие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπτύσαντες εἰς αὐτόν
  choice: плюнув на Него
  rationale: Аористное причастие обозначает действие, предшествующее основным глаголам; деепричастие естественно передаёт последовательность. При ἐμπτύω сочетание εἰς с винительным означает «плюнуть на кого-либо».
- source_word: ἔλαβον
  choice: взяли
  rationale: Прямое и контекстуально естественное соответствие аористу λαμβάνω.
- source_word: τὸν κάλαμον
  choice: трость
  rationale: κάλαμος означает тростник, трость или тростниковый жезл. «Трость» сохраняет связь с предметом, ранее вложенным в руку Иисуса, и не уточняет его как настоящий жезл.
- source_word: ἔτυπτον
  choice: стали бить
  rationale: Имперфект представляет побои как продолжавшееся или повторявшееся действие; конструкция «стали бить» естественна в русском повествовании и передаёт длительность, не задавая точного числа ударов.
- source_word: εἰς τὴν κεφαλὴν αὐτοῦ
  choice: Его по голове
  rationale: При τύπτω предлог εἰς указывает на цель ударов; по-русски это естественно выражается сочетанием «бить кого-либо по голове».
theological_decisions:
- issue: Изображение издевательства воинов над Иисусом
  choice: Передать унижение и продолжавшееся физическое насилие прямо, без смягчения и дополнений.
  alternative: «И, плюнув на Него, взяли трость и били Его по голове».
  rationale: Стих повествовательный и не требует конфессионального истолкования. Формулировка сохраняет конкретность действий и аспектуальную незавершённость ἔτυπτον, не усиливая сцену сверх греческого текста.
translation_notes:
  register: Современный литературный русский язык; ясная и сдержанно-достоинственная повествовательная речь. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с принятой русской библейской традицией.
