lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простая соединительная частица сохраняет последовательное течение повествования, не добавляя явно не выраженного временного оттенка.
- source_word: καθήμενοι
  choice: сидя
  rationale: Причастие настоящего времени от κάθημαι обозначает пребывание в сидячем положении и передаёт сопутствующее основному действию обстоятельство.
- source_word: ἐτήρουν
  choice: стерегли
  rationale: В данном контексте τηρέω означает не просто наблюдать, а нести стражу; русский глагол «стерегли» естественно передаёт это значение, а несовершенный вид — продолжительность действия, выраженную имперфектом.
- source_word: αὐτὸν
  choice: Его
  rationale: Прямое соответствие винительному местоимению, относящемуся к Иисусу; прописная буква следует принятой в русском библейском стиле форме почтительного написания.
- source_word: ἐκεῖ
  choice: там
  rationale: Наречие места естественно присоединено к деепричастному обороту, сохраняя указание на место всей сцены.
