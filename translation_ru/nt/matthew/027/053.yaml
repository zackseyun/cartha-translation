  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες ἐκ τῶν μνημείων μετὰ τὴν ἔγερσιν αὐτοῦ εἰσῆλθον εἰς τὴν ἁγίαν πόλιν καὶ ἐνεφανίσθησαν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/053.yaml
  text: And coming out of the tombs after his resurrection[c][b][a], they entered the holy city and appeared to many.
translation:
  language: ru
  text: И, выйдя из гробниц после Его воскресения[a], они вошли в святой город[b] и явились многим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен более плавный перевод: «После Его воскресения они вышли из гробниц, вошли в святой город и явились многим». В греческом тексте слова «после Его воскресения» стоят между «из гробниц» и «они вошли».'
    reason: alternative_reading
  - marker: b
    text: «Святой город» — Иерусалим.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθόντες
  choice: выйдя
  rationale: Деепричастие естественно передаёт предшествующее обстоятельственное действие аористного причастия и сохраняет его связь с основным глаголом.
- source_word: μνημείων
  choice: гробниц
  rationale: Слово обозначает места погребения; «гробницы» соответствует контексту открывшихся погребальных сооружений в предыдущем стихе.
- source_word: μετὰ τὴν ἔγερσιν αὐτοῦ
  choice: после Его воскресения
  rationale: μετά с винительным падежом имеет временное значение «после», а ἔγερσις здесь обозначает воскресение Иисуса. Прописная буква в «Его» помогает обозначить контекстуальный референт, не добавляя имени в основной текст.
- source_word: εἰσῆλθον
  choice: они вошли
  rationale: Простой повествовательный аорист естественно передаётся глаголом совершенного вида.
- source_word: τὴν ἁγίαν πόλιν
  choice: святой город
  rationale: Сохранено традиционное библейское обозначение Иерусалима без поясняющей вставки в основной текст.
- source_word: ἐνεφανίσθησαν
  choice: явились
  rationale: Форма означает, что они стали видимы другим; «явились» кратко и естественно передаёт это значение.
- source_word: πολλοῖς
  choice: многим
  rationale: Неопределённое субстантивированное множественное число передано без ненужного добавления «людям».
theological_decisions:
- issue: Связь слов «после Его воскресения» с выходом из гробниц и входом в город
  choice: 'Фраза поставлена непосредственно после «выйдя из гробниц», как в греческом тексте: выход и последующий вход в город происходят после воскресения Иисуса.'
  alternative: 'Можно сгладить порядок: «После Его воскресения они вышли из гробниц, вошли в святой город и явились многим».'
  rationale: Греческий порядок помещает временную фразу внутри причастного оборота перед основным глаголом. Перевод сохраняет синтаксическую связь и не пытается дополнительно согласовать хронологию с предыдущим стихом.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейского повествования. Конструкция с деепричастием близко отражает греческий синтаксис, оставаясь понятной; сноска предлагает более плавный вариант.
