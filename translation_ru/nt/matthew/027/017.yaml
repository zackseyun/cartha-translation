  text: συνηγμένων οὖν αὐτῶν εἶπεν αὐτοῖς ὁ Πιλᾶτος· Τίνα θέλετε ἀπολύσω ὑμῖν, ⸂Ἰησοῦν τὸν⸃ Βαραββᾶν ἢ Ἰησοῦν τὸν λεγόμενον χριστόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/017.yaml
  text: 'So when they had gathered together[a], Pilate said to them, “Which one do you want me to release to you: Jesus Barabbas[b], or Jesus who is called Messiah?”'
translation:
  language: ru
  text: 'Когда же они собрались, Пилат сказал им: «Кого вы хотите, чтобы я отпустил вам: Иисуса Варавву[a] или Иисуса, называемого Мессией[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «Варавву», без имени «Иисус».'
    reason: textual_variant
  - marker: b
    text: 'Или: «Христом». Греческий титул Христос здесь переведён словом «Мессия», поскольку он употреблён именно как титул.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνηγμένων οὖν αὐτῶν
  choice: Когда же они собрались
  rationale: Родительный самостоятельный оборот передан временным придаточным; перфектное значение указывает на собрание людей до вопроса Пилата, а частица οὖν сохраняется естественным русским «же» как связка с предшествующим повествованием.
- source_word: Τίνα θέλετε
  choice: Кого вы хотите
  rationale: Вопрос предполагает выбор между двумя лицами; русская конструкция естественно выражает это местоимением «кого».
- source_word: ἀπολύσω ὑμῖν
  choice: чтобы я отпустил вам
  rationale: В судебном контексте ἀπολύω означает освобождение заключённого, а не помилование; дательный ὑμῖν передан словом «вам».
- source_word: Ἰησοῦν τὸν Βαραββᾶν
  choice: Иисуса Варавву
  rationale: Перевод следует основному тексту SBLGNT, где перед Вараввой стоит имя Ἰησοῦν, и тем самым сохраняет выразительное противопоставление двух людей по имени Иисус.
- source_word: Ἰησοῦν τὸν λεγόμενον χριστόν
  choice: Иисуса, называемого Мессией
  rationale: Причастие λεγόμενον передано без добавления пренебрежительного оттенка, а χριστός — как титул «Мессия», а не как часть имени.
theological_decisions:
- issue: Передача титула χριστός
  choice: Мессия
  alternative: Христос
  rationale: В обороте «называемого χριστός» слово явно функционирует как титул. «Мессия» передаёт его значение и сохраняет мессианское утверждение, не превращая титул в фамильную часть имени; традиционный вариант указан в сноске.
- issue: Имя «Иисус» перед «Варавва»
  choice: Сохранено в основном тексте
  alternative: Варавва без имени «Иисус»
  rationale: Предоставленный греческий текст SBLGNT содержит Ἰησοῦν. Значимый рукописный вариант без этого имени отмечен в сноске без попытки скрыть текстологическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис ясен обычному читателю; сохранены повествовательная связка, судебный смысл глагола и противопоставление двух названных лиц.
