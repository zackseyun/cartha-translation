id: MAT.27.27
reference: Matthew 27:27
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τότε οἱ στρατιῶται τοῦ ἡγεμόνος παραλαβόντες τὸν Ἰησοῦν εἰς τὸ πραιτώριον συνήγαγον ἐπ’ αὐτὸν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/027.yaml
  text: Then the governor’s soldiers took Jesus into the praetorium and gathered the whole cohort around him[a][b].
translation:
  language: ru
  text: Тогда воины наместника отвели Иисуса в преторий[a] и собрали вокруг Него всю когорту[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в резиденцию наместника». Греческое слово обозначает официальную резиденцию или военный штаб римского наместника.'
    reason: lexical_alternative
  - marker: b
    text: «Когорта» — римский военный термин, обозначавший подразделение воинов; эти слова не обязательно означают, что там присутствовал каждый воин полного состава когорты.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественная временная связка, отмечающая следующий эпизод повествования.
- source_word: οἱ στρατιῶται τοῦ ἡγεμόνος
  choice: воины наместника
  rationale: Передаёт принадлежность солдат к римскому правителю; «наместник» — понятное и традиционно уместное обозначение провинциального правителя в данном контексте.
- source_word: παραλαβόντες τὸν Ἰησοῦν εἰς τὸ πραιτώριον
  choice: отвели Иисуса в преторий
  rationale: Деепричастная конструкция естественно развёрнута в однородное сказуемое; «отвели» передаёт взятие Иисуса с собой и перемещение внутрь.
- source_word: πραιτώριον
  choice: преторий
  rationale: Сохранён исторически конкретный римский термин; его значение поясняется в сноске.
- source_word: συνήγαγον ἐπ’ αὐτὸν
  choice: собрали вокруг Него
  rationale: В сочетании с глаголом собирания предлог выражает схождение к Иисусу и расположение вокруг Него.
- source_word: ὅλην τὴν σπεῖραν
  choice: всю когорту
  rationale: «Когорта» точно передаёт римский военный термин, а «всю» соответствует ὅλην; культурно-историческая оговорка дана в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с исторически точными терминами «преторий» и «когорта», разъяснёнными в сносках. Синтаксис сделан естественным для повествовательной прозы; местоимение «Него» оформлено с традиционной прописной буквы при указании на Иисуса.
