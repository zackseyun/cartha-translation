lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественный временной маркер, продолжающий последовательность событий.
- source_word: λέγει
  choice: говорит
  rationale: Историческое настоящее сохранено для передачи повествовательной живости греческого текста.
- source_word: αὐτῷ
  choice: Ему
  rationale: Сохраняется местоимение оригинала; его референт, Иисус, ясен из контекста.
- source_word: ὁ Πιλᾶτος
  choice: Пилат
  rationale: Артикль при личном имени в русском языке не передаётся.
- source_word: Οὐκ ἀκούεις
  choice: Разве Ты не слышишь
  rationale: Передаёт отрицательный вопрос и его побуждающе-удивлённый оттенок естественным современным русским выражением.
- source_word: πόσα
  choice: сколько всего
  rationale: Передаёт неопределённое множество выдвигаемых свидетельств, не добавляя отсутствующего в оригинале существительного «обвинений».
- source_word: σου … καταμαρτυροῦσιν
  choice: они свидетельствуют против Тебя
  rationale: Глагол имеет юридико-судебный смысл свидетельства против кого-либо; настоящее время сохраняет непосредственность сцены.
