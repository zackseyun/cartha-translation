  text: saying, “I have sinned by betraying innocent blood.” But they said, “What is that to us? You will see to it.”
translation:
  language: ru
  text: 'говоря: «Я согрешил, предав невинную кровь».[a] Они же сказали: «Что нам до этого? Сам смотри».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол также может означать «выдать» или «передать»; здесь он относится к предательской выдаче.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ты увидишь»; в данном контексте это резкое отстранение от ответственности: «сам смотри», «это твоё дело».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἥμαρτον
  choice: Я согрешил
  rationale: Греческий аорист передаёт признание совершённого греха; простое прошедшее время естественно и точно звучит по-русски.
- source_word: παραδοὺς
  choice: предав
  rationale: Причастие поясняет, в чём состоял грех Иуды. «Предав» соответствует контексту намеренной выдачи Иисуса и сохраняет причастную конструкцию оригинала.
- source_word: αἷμα ἀθῷον
  choice: невинную кровь
  rationale: Сохранён краткий библейский и юридико-нравственный оборот без добавления прямо не названного лица.
- source_word: Τί πρὸς ἡμᾶς;
  choice: Что нам до этого?
  rationale: Естественный русский эквивалент греческого оборота, которым собеседники отказываются считать случившееся своей заботой или ответственностью.
- source_word: σὺ ὄψῃ
  choice: Сам разбирайся
  rationale: 'Форма будущего времени от ὁράω употреблена как резкое идиоматическое отстранение: ответственность возлагается на Иуду. Буквальная образность и грамматическая форма отмечены в сноске.'
theological_decisions:
- issue: Следует ли прямо назвать Иисуса или невинного человека как того, чья кровь была предана
  choice: Сохранить выражение «невинную кровь» без поясняющего добавления
  alternative: «предав невинного человека на смерть»
  rationale: В греческом тексте лицо остаётся подразумеваемым. Добавление устранило бы лаконичность и библейско-правовой смысл выражения αἷμα ἀθῷον.
- issue: 'Как передать σὺ ὄψῃ: как буквальное будущее или как идиоматическое возложение ответственности'
  choice: 'В основном тексте передать функцию выражения: «Сам разбирайся»'
  alternative: «Ты увидишь» / «Сам смотри»
  rationale: Буквальное «ты увидишь» в современном русском скорее звучит как угроза или предсказание последствий, чего контекст не требует. Сноска сохраняет формальную неоднозначность греческого выражения.
translation_notes:
  register: Современный литературный русский язык; речь краткая и напряжённая. Библейский оборот «невинная кровь» сохранён, тогда как заключительная реплика передана естественным разговорным выражением, соответствующим её пренебрежительно-отстранённому тону.
