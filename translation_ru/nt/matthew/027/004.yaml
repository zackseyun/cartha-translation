  source_fidelity: 'Основной текст в целом точно передаёт греческий оригинал: «согрешил», «предав», «невинную кровь» сохраняют смысл и намеренную краткость αἷμα ἀθῷον без добавления имени Иисуса. «Что нам до этого?» верно передаёт dismissive Τί πρὸς ἡμᾶς;. Для σὺ ὄψῃ предпочтительнее «Сам смотри»: это естественная русская реплика, передающая резкое возложение ответственности, но не добавляющая к ней оттенок длительного “разбирательства”.'
