  yaml_path: translation/nt/matthew/027/018.yaml
  text: For he knew that they had handed him over because of envy[a].
translation:
  language: ru
  text: Ведь он знал, что они передали Его из зависти[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из ревности»; также: «по зависти».'
    reason: Лексическая альтернатива для διὰ φθόνον.
lexical_decisions:
- source_word: ᾔδει
  choice: он знал
  rationale: Прямо и естественно передаёт знание Пилата; подразумеваемый субъект восстанавливается из контекста.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предыдущим высказыванием естественным для современного русского языка способом.
- source_word: ὅτι
  choice: что
  rationale: Вводит содержание того, что было известно Пилату, а не отдельное придаточное причины.
- source_word: διὰ φθόνον
  choice: из зависти
  rationale: διά с винительным указывает на причину или побуждение, а φθόνος обозначает зависть и недоброжелательство к положению другого.
- source_word: παρέδωκαν
  choice: предали
  rationale: В данном судебном контексте означает, что Иисуса выдали властям. Русское «предали» лаконично выражает это действие, хотя может также нести оттенок измены.
- source_word: αὐτόν
  choice: Его
  rationale: Местоимение относится к Иисусу; прописная буква соответствует принятому достоинственному оформлению мессианского референта.
theological_decisions:
- issue: Мотив обвинителей Иисуса
  choice: Пилат знал, что они предали Иисуса из зависти.
  alternative: Пилат знал, что они предали Иисуса из ревности.
  rationale: «Зависть» точнее передаёт φθόνος как недоброжелательное чувство к чужому положению или успеху, не добавляя отсутствующего в тексте богословского объяснения.
translation_notes:
  register: Современный литературный русский язык; пояснительное γὰρ передано частицей «ведь». Формулировка краткая и достойная, с сохранением причинного акцента оригинала.
