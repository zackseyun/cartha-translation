  text: and they gave them for the potter's field[b][a], just as the Lord directed me.
translation:
  language: ru
  text: и отдали их за поле горшечника, как повелел[a] мне[b] Господь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приказал» или «указал».'
    reason: lexical_alternative
  - marker: b
    text: Матфей сохраняет в этой пророческой цитате или аллюзии форму первого лица «мне», не приспосабливая её к окружающему повествованию.
    reason: cross_reference
lexical_decisions:
- source_word: ἔδωκαν
  choice: отдали
  rationale: Аорист δίδωμι передан обычным глаголом «отдали». В данном контексте речь идёт о распоряжении серебряными монетами; вариант «заплатили» возможен по смыслу, но более истолкователен.
- source_word: αὐτὰ
  choice: их
  rationale: Местоимение среднего рода множественного числа отсылает к ранее упомянутым серебряным монетам; русское «их» сохраняет множественное число.
- source_word: εἰς τὸν ἀγρὸν
  choice: за поле
  rationale: Хотя εἰς обычно обозначает движение «в», при передаче денег в контексте приобретения выражение указывает, за что они были отданы. «За поле» естественно передаёт этот смысл по-русски.
- source_word: τοῦ κεραμέως
  choice: горшечника
  rationale: Родительный падеж сохраняется естественным русским сочетанием «поле горшечника», не уточняя сверх текста, принадлежало ли поле горшечнику прежде или было связано с ним иным образом.
- source_word: καθὰ
  choice: как
  rationale: Союз вводит соответствие распоряжению Господа. Русское «как» кратко и естественно сохраняет сравнительную связь.
- source_word: συνέταξέν
  choice: повелел
  rationale: Глагол συντάσσω здесь выражает властное распоряжение. «Повелел» точно, естественно для библейского контекста и сохраняет достоинство регистра; возможны также «приказал» и «указал».
- source_word: μοι
  choice: мне
  rationale: Дательное местоимение первого лица передано буквально, без согласования с окружающим повествованием или предполагаемым ветхозаветным источником.
- source_word: κύριος
  choice: Господь
  rationale: κύριος с артиклем обозначает Господа; традиционное написание с прописной буквы ясно передаёт божественное именование.
theological_decisions:
- issue: Первое лицо в пророческой цитате или аллюзии
  choice: Сохранить «мне» в соответствии с греческим текстом.
  alternative: Сгладить формулировку, приспособив её к повествовательному контексту или к ветхозаветному тексту.
  rationale: В SBLGNT прямо стоит μοι («мне»). Сохранение первого лица не устраняет напряжение, связанное с составным характером цитаты у Матфея, и не навязывает его объяснение.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным библейским звучанием. Начальное «и» сохранено как соответствие καί и как связь с предыдущим стихом. Формулировка не сглаживает необычное «мне».
