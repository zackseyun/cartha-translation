  text: Πρωΐας δὲ γενομένης συμβούλιον ἔλαβον πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ κατὰ τοῦ Ἰησοῦ ὥστε θανατῶσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/001.yaml
  text: When morning came[b][a], all the chief priests and the elders of the people took counsel against Jesus so as to put him to death.
translation:
  language: ru
  text: Когда же наступило утро[a], все первосвященники и старейшины народа провели совещание[b] против Иисуса, чтобы предать Его смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «На рассвете».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «собрались на совет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας δὲ γενομένης
  choice: Когда же наступило утро
  rationale: Генитив абсолютный выражает временной переход; «же» ненавязчиво передаёт переходное δέ. Формулировка естественна для современного литературного русского языка.
- source_word: συμβούλιον ἔλαβον
  choice: держали совет
  rationale: Сохранён совещательный характер действия без усиления до «сговаривались» и без преждевременного сведения смысла к уже принятому решению.
- source_word: πάντες
  choice: все
  rationale: Явно сохранён акцент на полноте названной группы руководителей.
- source_word: οἱ ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся обозначение представителей высшего священнического руководства; форма множественного числа здесь не означает одновременного существования нескольких действующих верховных первосвященников.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: старейшины народа
  rationale: Естественно и точно передаёт официальное обозначение народных руководителей.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: против Иисуса
  rationale: В данном враждебном контексте κατά с родительным падежом имеет направленный против кого-либо смысл, а не нейтральное значение «об Иисусе».
- source_word: ὥστε
  choice: чтобы
  rationale: В сочетании с инфинитивом обозначает намеченный результат или цель; русское «чтобы» естественно сохраняет эту смысловую широту.
- source_word: θανατῶσαι αὐτόν
  choice: предать Его смерти
  rationale: Передаёт намерение умертвить Иисуса в официально-судебном контексте, не сужая способ до конкретной процедуры казни.
theological_decisions:
- issue: Характер действий руководителей против Иисуса
  choice: 'Передать враждебное совещание, направленное на смерть Иисуса: «держали совет против Иисуса, чтобы предать Его смерти».'
  alternative: «Совещались об Иисусе» или усиленное «составили заговор против Иисуса».
  rationale: Греческий текст ясно выражает противодействие и смертельную цель, но сам по себе не требует дополнительного оттенка тайного заговора. Перевод сохраняет и враждебность, и целенаправленность, не усиливая их сверх исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим судебно-повествовательному контексту. Оборот «держали совет» слегка приподнят, но понятен и позволяет близко сохранить греческую идиому; альтернативный более нейтральный вариант дан в сноске.
