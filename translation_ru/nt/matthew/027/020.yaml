  text: Οἱ δὲ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι ἔπεισαν τοὺς ὄχλους ἵνα αἰτήσωνται τὸν Βαραββᾶν τὸν δὲ Ἰησοῦν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/020.yaml
  text: But the chief priests and the elders persuaded the crowds to ask for Barabbas[a], but to destroy Jesus.
translation:
  language: ru
  text: Но первосвященники и старейшины убедили толпы просить за Варавву, а Иисуса погубить.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предать Иисуса смерти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Союз обозначает контраст с предшествующим ходом повествования; «но» естественно передаёт это противопоставление.
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся русское обозначение представителей высшего иерусалимского священства; множественное число сохранено.
- source_word: πρεσβύτεροι
  choice: старейшины
  rationale: В данном контексте речь идёт о признанных руководителях народа, а не просто о пожилых мужчинах.
- source_word: ἔπεισαν
  choice: убедили
  rationale: Передаёт завершённое воздействие руководителей на собравшихся и естественно сочетается с инфинитивной конструкцией.
- source_word: τοὺς ὄχλους
  choice: народ
  rationale: Хотя греческое слово стоит во множественном числе и буквально означает «толпы», в современном русском «народ» естественно обозначает собравшуюся массу людей; значение не сводится ко всему еврейскому народу.
- source_word: ἵνα αἰτήσωνται
  choice: просить за
  rationale: После «убедили» инфинитив естественно передаёт содержание побуждения; «просить за Варавву» означает добиваться его освобождения и соответствует контексту выбора узника.
- source_word: τὸν Βαραββᾶν
  choice: Варавву
  rationale: Имя передано в традиционной русской библейской форме и поставлено в требуемый винительный падеж.
- source_word: τὸν δὲ Ἰησοῦν
  choice: а Иисуса
  rationale: Повторное δέ противопоставляет судьбу Иисуса просьбе за Варавву; русский союз «а» ясно и естественно выражает этот контраст.
- source_word: ἀπολέσωσιν
  choice: погубить
  rationale: Глагол означает причинить гибель, уничтожить; «погубить» сохраняет широту и силу греческого слова, не превращая его в специальный термин казни.
theological_decisions:
- issue: Передача ἀπολέσωσιν в контексте судебного разбирательства
  choice: погубить Иисуса
  alternative: предать Иисуса смерти
  rationale: Греческий глагол шире технического обозначения казни и буквально выражает причинение гибели. Основной текст сохраняет эту лексическую широту, а сноска поясняет конкретный смысл в данном повествовательном контексте.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской терминологией. Синтаксис краткий и контрастный; формулировка избегает впечатления, будто виновным объявляется весь еврейский народ, сохраняя при этом массовый характер собравшихся.
