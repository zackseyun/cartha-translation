  text: Τότε σταυροῦνται σὺν αὐτῷ δύο λῃσταί, εἷς ἐκ δεξιῶν καὶ εἷς ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/038.yaml
  text: Then two robbers are crucified with him[a], one on the right and one on the left.
translation:
  language: ru
  text: 'Тогда вместе с Ним распинают двух разбойников[a]: одного справа, а другого слева.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бандитов». Греческое слово может обозначать насильственных грабителей, а в некоторых контекстах также употребляться по отношению к участникам мятежей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественно обозначает следующий момент в последовательности повествования.
- source_word: σταυροῦνται
  choice: распинают
  rationale: Настоящее страдательное в греческом служит повествовательным настоящим. Русская неопределённо-личная форма сохраняет динамику и подразумеваемое страдательное значение.
- source_word: σὺν αὐτῷ
  choice: вместе с Ним
  rationale: Передаёт сопровождение; «вместе» естественно подчёркивает совместность казни.
- source_word: δύο λῃσταί
  choice: двух разбойников
  rationale: «Разбойники» передаёт значение людей, занимающихся насильственным грабежом, не сужая его до политических мятежников.
- source_word: εἷς ἐκ δεξιῶν καὶ εἷς ἐξ εὐωνύμων
  choice: одного справа, а другого слева
  rationale: Идиоматично передаёт пространственное противопоставление; «а другого» естественно по-русски выражает парную конструкцию.
theological_decisions:
- issue: Кем были λῃσταί
  choice: разбойники
  alternative: бандиты; мятежники
  rationale: Греческое слово может обозначать вооружённых или насильственных грабителей и в некоторых контекстах иметь связь с повстанческой деятельностью, однако сам стих не требует политически более узкого смысла.
translation_notes:
  register: Современный литературный русский язык, лаконичный повествовательный стиль. Местоимение «Ним» написано с прописной буквы в соответствии с распространённой русской библейской издательской практикой; это не добавляет смысла к греческому тексту.
