id: MAT.27.60
reference: Matthew 27:60
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἔθηκεν αὐτὸ ἐν τῷ καινῷ αὐτοῦ μνημείῳ ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ, καὶ προσκυλίσας λίθον μέγαν τῇ θύρᾳ τοῦ μνημείου ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/060.yaml
  text: and placed it in his own new tomb[a], which he had cut into the rock. And after rolling a large stone to the entrance of the tomb, he went away.
translation:
  language: ru
  text: и положил его в своей новой гробнице, которую высек в скале. Затем, привалив большой камень ко входу[a] в гробницу, он ушёл.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к двери гробницы». Греческое слово может означать как дверь, так и вход.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθηκεν
  choice: положил
  rationale: В контексте погребения глагол обозначает помещение тела в гробницу; «положил» естественно и сохраняет простой характер греческого выражения.
- source_word: καινῷ αὐτοῦ μνημείῳ
  choice: в своей новой гробнице
  rationale: μνημεῖον здесь означает высеченную в скале погребальную гробницу; καινῷ передано буквально как «новой», а αὐτοῦ — естественным русским притяжательным «своей».
- source_word: ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ
  choice: которую высек в скале
  rationale: λατομέω означает высекать или вырубать в камне. Русское «высек в скале» точно и естественно описывает устройство гробницы.
- source_word: προσκυλίσας λίθον μέγαν
  choice: привалив большой камень
  rationale: Причастие выражает действие, предшествующее уходу. «Привалив» идиоматично передаёт подкатывание камня к проёму и его установку у входа.
- source_word: τῇ θύρᾳ τοῦ μνημείου
  choice: ко входу в гробницу
  rationale: θύρα может обозначать дверь или вход. В контексте высеченной в скале гробницы «вход» яснее и не создаёт образа современной навесной двери.
- source_word: ἀπῆλθεν
  choice: он ушёл
  rationale: Краткое современное выражение точно передаёт простое повествовательное указание на уход.
