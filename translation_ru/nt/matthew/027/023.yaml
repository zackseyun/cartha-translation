lexical_decisions:
- source_word: ἔφη
  choice: сказал
  rationale: Аорист вводит отдельную реплику в повествовании; простое «сказал» естественно и не добавляет значения продолжительности или повторности.
- source_word: Τί γὰρ κακὸν ἐποίησεν;
  choice: Какое зло он сделал?
  rationale: Вопрос передаёт прямое возражение Пилата. Частица γάρ здесь имеет пояснительно-полемическую функцию, которая в русском естественно выражается самим контекстом вопроса; κακόν сохранено как «зло».
- source_word: περισσῶς
  choice: ещё сильнее
  rationale: Передаёт усиление реакции толпы, не сводя его исключительно к громкости голоса.
- source_word: ἔκραζον
  choice: продолжали кричать
  rationale: Имперфект выражает продолжающееся действие; сочетание «продолжали кричать» ясно передаёт эту аспектуальную окраску.
- source_word: λέγοντες
  choice: двоеточие перед прямой речью
  rationale: В русском повествовании содержание крика естественно вводится двоеточием; отдельное «говоря» было бы тяжеловесным и избыточным.
- source_word: Σταυρωθήτω
  choice: Пусть его распнут!
  rationale: Естественная современная русская формула требования, сохраняющая фокус на Иисусе как объекте казни и не называющая исполнителей.
- source_word: ὁ δὲ ... οἱ δὲ
  choice: Он же ... Но они ...
  rationale: Первое δέ передано повествовательным «же», второе — контрастным «но», чтобы ясно обозначить противостояние вопроса Пилата и ответа толпы.
theological_decisions:
- issue: Форма требования толпы о распятии
  choice: Пусть его распнут!
  alternative: Распни его! / Пусть он будет распят!
  rationale: Греческий текст употребляет страдательный императив третьего лица. Выбранная русская конструкция звучит современно, не называет конкретного исполнителя и сохраняет направленность требования на распятие Иисуса, не вводя богословского истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским тоном. Местоимения, относящиеся к Иисусу, даны со строчной буквы по общим нормам современного повествовательного текста. Формулировка избегает архаичного «да будет распят», но сохраняет смысл и форму требования толпы.
