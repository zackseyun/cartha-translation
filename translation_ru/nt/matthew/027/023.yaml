base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/023.yaml
  text: But he said[a], “What evil has he done?” But they cried out all the more, saying[b], “Let him be crucified.”
translation:
  language: ru
  text: 'Он же сказал: «Какое же зло он совершил[a]?» Но они кричали ещё сильнее: «Пусть его распнут[b]!»'
  philosophy: optimal-equivalence
  footnotes:
