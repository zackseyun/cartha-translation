  yaml_path: translation/nt/matthew/027/009.yaml
  text: Then what was spoken through Jeremiah the prophet was fulfilled[a], saying, ‘And they took the thirty pieces of silver, the price of the one who had been valued[b], whom they valued from among the sons of Israel,’
translation:
  language: ru
  text: 'Тогда исполнилось сказанное через пророка Иеремию[a], говорящего: «И взяли они тридцать сребреников — цену того, кому назначили цену, — того, кого оценили некоторые из сынов Израиля,»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Матфей приписывает это пророческое слово Иеремии. Формулировка наиболее близка к Захарии 11:12–13. Это объясняют по-разному: как составную цитату, как ссылку на собрание пророческих книг или как возникшую при передаче текста проблему.'
    reason: textual_variant
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественно передаёт временную последовательность повествования.
- source_word: ἐπληρώθη τὸ ῥηθὲν
  choice: исполнилось сказанное
  rationale: Сохраняет характерную для Матфея формулу исполнения пророчества и пассивно-результативный смысл.
- source_word: διὰ Ἰερεμίου τοῦ προφήτου
  choice: через пророка Иеремию
  rationale: Передаёт διά с родительным как посредничество пророка, не устраняя трудность атрибуции.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: тридцать сребреников
  rationale: Устоявшееся и понятное обозначение серебряных денежных единиц в библейском контексте.
- source_word: τὴν τιμὴν τοῦ τετιμημένου
  choice: цену Оценённого
  rationale: Сохраняет коммерческий смысл τιμή и повтор корня τιμάω; субстантивированное обозначение относится к конкретному лицу.
- source_word: ὃν ἐτιμήσαντο ἀπὸ υἱῶν Ἰσραήλ
  choice: которого оценили сыны Израиля
  rationale: Естественная русская формулировка сохраняет субъект «сыны Израиля» и повтор глагола «оценить»; трудная функция ἀπό отмечена в сноске.
theological_decisions:
- issue: Матфей приписывает изречение Иеремии, хотя словесно оно ближе всего к Захарии 11:12–13
  choice: Сохранить в основном тексте имя Иеремии
  alternative: Исправить на «Захарию» либо обобщить как «через пророка»
  rationale: Греческий текст прямо называет Иеремию; перевод не должен гармонизировать или молча разрешать историко-текстовую трудность.
- issue: Референт τοῦ τετιμημένου
  choice: Передать как личное обозначение «Оценённого»
  alternative: 'Передать отвлечённо: «того, кому назначили цену»'
  rationale: Греческая форма допускает личный референт и намеренное повторение τιμάω; выбранный вариант сохраняет напряжённую иронию «оценивания».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Сребреники» сохранены как общеизвестный библейский термин; синтаксис упрощён настолько, насколько возможно без устранения неоднозначности оригинала. Стих обрывается запятой, поскольку греческое предложение и цитата продолжаются в следующем стихе.
