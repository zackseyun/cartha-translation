  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς πᾶς ὁ λαὸς εἶπεν· Τὸ αἷμα αὐτοῦ ἐφ’ ἡμᾶς καὶ ἐπὶ τὰ τέκνα ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/025.yaml
  text: And all the people answered[a], “His blood be on us and on our children.”
translation:
  language: ru
  text: 'И весь народ ответил[a]: «Кровь Его — на нас и на детях наших».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть весь народ, собравшийся и говорящий в этой сцене; эти слова не следует понимать как возложение непреходящей вины на всех евреев во всех поколениях.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: ответил
  rationale: Причастие ἀποκριθείς в сочетании с εἶπεν идиоматически вводит ответ; по-русски естественно передать одним глаголом «ответил».
- source_word: πᾶς ὁ λαὸς
  choice: весь народ
  rationale: Сочетание πᾶς с существительным в единственном числе и артиклем имеет собирательное значение. «Весь народ» сохраняет прямое значение λαός и коллективную силу выражения, не превращая его в вневременное этническое утверждение.
- source_word: Τὸ αἷμα αὐτοῦ
  choice: Кровь Его
  rationale: Дословное и естественное выражение; в судебном контексте подразумевает ответственность за смерть, но это значение не разворачивается в основном тексте.
- source_word: ἐφ’ ἡμᾶς
  choice: на нас
  rationale: Греческая фраза не содержит выраженного глагола. Русская именная конструкция с тире естественно сохраняет эллипсис и силу принятия на себя ответственности, не добавляя толкования.
- source_word: ἐπὶ τὰ τέκνα ἡμῶν
  choice: и на детях наших
  rationale: τέκνα прямо означает «дети»; повтор предлога сохранён ради параллелизма. Форма «детях наших» поддерживает dignified biblical cadence without archaic vocabulary.
theological_decisions:
- issue: Возможное антиеврейское истолкование πᾶς ὁ λαὸς
  choice: 'Передать как относящееся ко всему собравшемуся в данной сцене народу: «весь народ», снабдив выражение поясняющей сноской.'
  alternative: «вся толпа» либо понимание как утверждения о всех евреях всех поколений
  rationale: В повествовании говорится о коллективном ответе собравшихся участников сцены. Перевод сохраняет обобщённую формулировку стиха, но не распространяет её на целый этнос и последующие поколения.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной интонацией. Эллиптическая конструкция «Кровь Его — на нас» сохраняет напряжённость и лаконизм греческого текста; местоимение после существительного придаёт достойное библейское звучание без чрезмерной архаизации.
