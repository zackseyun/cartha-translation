base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/061.yaml
  text: Mary Magdalene and the other Mary were there, sitting opposite the tomb.
translation:
  language: ru
  text: Там были Мария Магдалина и другая Мария; они сидели напротив гробницы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν δὲ ἐκεῖ
  choice: Там были
  rationale: Хотя греческое ἦν стоит в единственном числе, далее названы два однородных подлежащих; русское множественное число естественно передаёт смысл конструкции. Частица δέ обозначает мягкий повествовательный переход и не требует отдельного слова в русском тексте.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Мария Магдалина
  rationale: Устоявшаяся русская форма имени и обозначения женщины из Магдалы.
- source_word: ἡ ἄλλη Μαρία
  choice: другая Мария
  rationale: Сохраняет прямое различение между Марией Магдалиной и второй упомянутой Марией.
- source_word: καθήμεναι
  choice: они сидели
  rationale: Причастие настоящего времени описывает положение обеих женщин; личная форма делает русскую фразу естественной и сохраняет продолжающееся действие в рамках прошедшего повествования.
- source_word: ἀπέναντι
  choice: напротив
  rationale: Точно и естественно передаёт пространственное положение перед гробницей, на противоположной стороне или лицом к ней, не уточняя сверх сказанного.
- source_word: τοῦ τάφου
  choice: гробницы
  rationale: В контексте погребения Иисуса слово «гробница» точнее обозначает место погребения, чем более общее «могила», и не звучит архаично.
