  text: τότε ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, τὸν δὲ Ἰησοῦν φραγελλώσας παρέδωκεν ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/026.yaml
  text: Then he released Barabbas to them[a], but after flogging Jesus, he handed him over to be crucified.
translation:
  language: ru
  text: Тогда он отпустил им Варавву, а Иисуса, подвергнув бичеванию[a], отдал на распятие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «высекши Иисуса». Греческий глагол обозначает римское наказание — бичевание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Передаёт временную и последовательную связь в повествовании естественным современным русским языком.
- source_word: ἀπέλυσεν αὐτοῖς
  choice: отпустил им
  rationale: В судебном контексте глагол означает освобождение заключённого; дательный падеж указывает на тех, кому или ради кого его отпустили.
- source_word: τὸν Βαραββᾶν
  choice: Варавву
  rationale: Использована устоявшаяся русская форма личного имени.
- source_word: τὸν δὲ Ἰησοῦν
  choice: а Иисуса
  rationale: Союз «а» естественно выражает контраст между освобождением Вараввы и участью Иисуса.
- source_word: φραγελλώσας
  choice: подвергнув бичеванию
  rationale: Аористное причастие обозначает действие, предшествующее передаче Иисуса; формулировка сохраняет связь с конкретным римским наказанием и звучит достойно.
- source_word: παρέδωκεν
  choice: отдал
  rationale: В данном контексте означает передачу Иисуса для исполнения назначенной казни; дополнение восстанавливается из синтаксиса по-русски.
- source_word: ἵνα σταυρωθῇ
  choice: на распятие
  rationale: Кратко и естественно передаёт цель передачи — чтобы Иисус был распят.
theological_decisions:
- issue: Последовательность бичевания и передачи Иисуса на распятие
  choice: Сначала Иисус подвергнут бичеванию, затем отдан на распятие.
  alternative: Иисус был отдан, а бичевание произошло позднее.
  rationale: Аористное причастие φραγελλώσας наиболее естественно обозначает действие, предшествующее главному глаголу παρέδωκεν; перевод не добавляет предположений о деталях римской процедуры.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Подвергнув бичеванию» точнее указывает на официальное римское наказание, а сноска поясняет его характер. Контраст между Вараввой и Иисусом передан союзом «а».
