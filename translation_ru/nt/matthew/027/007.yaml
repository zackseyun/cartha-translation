  text: συμβούλιον δὲ λαβόντες ἠγόρασαν ἐξ αὐτῶν τὸν Ἀγρὸν τοῦ Κεραμέως εἰς ταφὴν τοῖς ξένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/007.yaml
  text: So after taking counsel[b][a], they bought the Potter’s Field with them as a burial place for foreigners.
translation:
  language: ru
  text: Посоветовавшись, они купили на эти деньги поле горшечника, чтобы хоронить там чужеземцев.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμβούλιον δὲ λαβόντες
  choice: Посоветовавшись
  rationale: Греческая идиома буквально означает «приняв совет / решение после совещания». Деепричастие естественно передаёт предшествующее совместное обсуждение; δέ в плавном русском повествовании отдельно не выражено.
- source_word: ἠγόρασαν
  choice: они купили
  rationale: Прямое и естественное соответствие аористу ἀγοράζω.
- source_word: ἐξ αὐτῶν
  choice: на эти деньги
  rationale: Формально — «из них»; местоимение среднего рода множественного числа отсылает к серебряным монетам из предыдущего контекста. В русском языке буквальное «из них» здесь неестественно, поэтому референт выражен ясно и без смыслового добавления.
- source_word: τὸν Ἀγρὸν τοῦ Κεραμέως
  choice: поле горшечника
  rationale: Естественная передача определительного генитива. Контекст не требует обязательного оформления сочетания как официального собственного имени.
- source_word: εἰς ταφὴν τοῖς ξένοις
  choice: чтобы хоронить там чужеземцев
  rationale: εἰς с существительным обозначает назначение поля. «Чужеземцы» передаёт ξένοι как людей не из этой местности и звучит уместно в повествовательном библейском регистре.
theological_decisions:
- issue: Референт αὐτῶν
  choice: 'Серебряные монеты, возвращённые Иудой: «на эти деньги»'
  alternative: 'Более формально: «на них»'
  rationale: Ближайший контекст однозначно указывает на серебро. Экспликация необходима для естественного русского и не привносит богословского толкования.
- issue: Значение τοῖς ξένοις
  choice: чужеземцев
  alternative: чужих / странников
  rationale: Слово может обозначать чужих, посторонних или иностранцев. В контексте места погребения вероятнее речь о людях не из этой местности; выбранный вариант сохраняет этот диапазон лучше, чем современное «незнакомцев».
translation_notes:
  register: Современный литературный русский; лаконичный, достойный повествовательный стиль. Синтаксис перестроен естественно для русского языка, при этом последовательность совещания, покупки и назначения поля сохранена.
