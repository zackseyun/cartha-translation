id: MAT.27.44
reference: Matthew 27:44
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τὸ δ’ αὐτὸ καὶ οἱ λῃσταὶ οἱ συσταυρωθέντες ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/044.yaml
  text: In the same way[b][a], even the robbers who had been crucified with him were insulting him.
translation:
  language: ru
  text: Так же[a] оскорбляли[b] его даже разбойники, распятые вместе с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то же самое». Греческий оборот означает, что они поступали с ним так же, как описанные перед этим люди.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поносили».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δ’ αὐτὸ
  choice: Так же
  rationale: Оборот τὸ αὐτό с δέ употреблён здесь наречно и отсылает к только что описанным насмешкам; «так же» естественно передаёт этот смысл по-русски.
- source_word: καὶ
  choice: даже
  rationale: 'В контексте καί имеет усилительное значение: к оскорблениям присоединились даже распятые рядом разбойники.'
- source_word: λῃσταὶ
  choice: разбойники
  rationale: Слово λῃστής обозначает разбойника или грабителя; выбранный вариант точен, понятен и не приписывает этим людям политической роли, которой текст прямо не называет.
- source_word: οἱ συσταυρωθέντες σὺν αὐτῷ
  choice: распятые вместе с ним
  rationale: Субстантивированное причастие определяет разбойников как распятых рядом с Иисусом и сохраняет пассивное значение исходного текста.
- source_word: ὠνείδιζον
  choice: оскорбляли
  rationale: Русский глагол несовершенного вида передаёт продолженное действие греческого имперфекта; «оскорбляли» ясно и естественно для современного читателя.
- source_word: αὐτόν
  choice: его
  rationale: Прямое дополнение относится к Иисусу; местоимение передано без смыслового расширения.
theological_decisions:
- issue: Согласование с рассказом Луки, где один из распятых преступников говорит иначе
  choice: Сохранить множественное число и отнести действие к разбойникам без оговорок
  alternative: Смягчить множественное число или уточнить, что оскорблял лишь один из них
  rationale: Греческий текст Матфея прямо называет «разбойников» во множественном числе и употребляет глагол во множественном числе. Перевод сохраняет напряжение между евангельскими повествованиями, не пытаясь скрыто согласовать их.
translation_notes:
  register: Современный литературный русский язык с ясной и сдержанно торжественной формулировкой. Местоимения, относящиеся к Иисусу, написаны со строчной буквы в соответствии с нейтральной современной орфографической практикой. Порядок слов подчёркивает усилительное «даже», не утяжеляя предложение.
