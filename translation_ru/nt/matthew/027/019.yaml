review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: временной генитив абсолютный, судебное βῆμα, предупреждение жены, характеристика δίκαιος и причинная связь сна сохранены. Однако «не делай ничего этому Праведнику» в современном русском синтаксически и стилистически неудачно: дательный падеж здесь звучит ненормативно без уточнения направленности действия. «Против» естественно передаёт в контексте судебного разбирательства предостережение не предпринимать ничего во вред этому человеку, не вводя нового доктринального содержания.'
  naturalness: «Жена послала ему сказать» возможно, но тяжеловесно и оставляет невыраженным носителя сообщения. «Его жена послала ему весть» естественно передаёт ἀπέστειλεν πρὸς αὐτόν и не конкретизирует способ доставки. Остальные элементы, включая «на судейском месте» и «много страдала во сне», приемлемы для современного литературного библейского регистра.
  terminology: «Праведник» обоснованно сохраняет многозначность δίκαιος; сноска корректно отмечает юридически возможное «невиновный человек». Написание с прописной буквы и «Него» соответствует заявленному библейскому регистру и не меняет переводческого значения.
  issues:
  - severity: medium
    issue: Неестественная конструкция «Не делай ничего этому Праведнику».
    rationale: В современном русском «делать что-либо кому-либо» без дополнения или предлога в таком значении звучит грамматически неполно. «Не делай ничего против этого Праведника» даёт нормативную и ясную формулировку, соответствующую судебному контексту идиомы Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ.
  - severity: low
    issue: Тяжеловесная формулировка «жена послала ему сказать».
    rationale: Она понятна, но менее естественна, чем «его жена послала ему весть», которая адекватно передаёт отправку сообщения, не утверждая, что жена говорила лично.
