  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ βήματος ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα· Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ, πολλὰ γὰρ ἔπαθον σήμερον κατ’ ὄναρ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/019.yaml
  text: While he was sitting on the judgment seat[a], his wife sent word to him, saying, “Have nothing to do with that righteous man[b], for I have suffered greatly today in a dream because of him.”
translation:
  language: ru
  text: 'Когда он сидел на судейском месте, его жена послала ему весть: «Не делай ничего против этого Праведника[a], потому что сегодня я много страдала во сне из-за Него».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «этому невиновному человеку». Греческое слово может означать «праведный», «справедливый», а в судебном контексте — «невиновный».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: Когда он сидел
  rationale: Родительный самостоятельный оборот с причастием настоящего времени обозначает одновременное, продолжающееся обстоятельство; русское «когда он сидел» передаёт его естественно.
- source_word: ἐπὶ τοῦ βήματος
  choice: на судейском месте
  rationale: В данном судебном контексте βῆμα — официальное место, с которого правитель вершил суд; этот вариант ясен и не сводит значение лишь к физическому возвышению.
- source_word: ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα
  choice: жена послала ему сказать
  rationale: Сочетание глагола отправления и причастия речи подразумевает передачу сообщения через посланника; русская конструкция кратка и естественна.
- source_word: Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ
  choice: Не делай ничего этому Праведнику
  rationale: Эллиптическая идиома предостерегает адресата от какого-либо участия во вред этому человеку. В судебной сцене «не делай ничего» точнее и естественнее передаёт направленность предупреждения, чем буквальное «пусть не будет ничего между тобой и…».
- source_word: τῷ δικαίῳ ἐκείνῳ
  choice: этому Праведнику
  rationale: 'δίκαιος сохраняет нравственно-судебную многозначность: «праведный», «справедливый», а в контексте суда также «невиновный». Основной текст сохраняет более широкое «Праведник», альтернативу поясняет сноска.'
- source_word: πολλὰ γὰρ ἔπαθον σήμερον κατ’ ὄναρ δι’ αὐτόν
  choice: потому что сегодня я много страдала во сне из-за Него
  rationale: πολλὰ ἔπαθον идиоматически означает сильное или многократное страдание; «много страдала» сохраняет интенсивность, а «во сне» и «из-за Него» прямо передают κατ’ ὄναρ и причинное διά с винительным.
theological_decisions:
- issue: Значение δίκαιος применительно к Иисусу
  choice: Праведник
  alternative: невиновный человек
  rationale: «Праведник» сохраняет характерную для Матфея нравственную оценку и не сводит слова жены Пилата лишь к юридическому оправданию. Вместе с тем судебный контекст допускает смысл «невиновный», поэтому он отмечен в сноске.
- issue: Направленность идиомы Μηδὲν σοὶ καὶ…
  choice: Не делай ничего этому Праведнику
  alternative: Не имей ничего общего с этим Праведником
  rationale: В контексте вынесения приговора речь, вероятнее всего, идёт о предостережении не причинять Ему вреда и не участвовать в деле против Него. Выбранная формулировка сохраняет практическую силу предупреждения, не вводя специального догматического толкования.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Заглавная буква в «Праведнику» и местоимении «Него» соответствует принятому русскому библейскому регистру и не устраняет лексической неоднозначности, пояснённой в сноске.
