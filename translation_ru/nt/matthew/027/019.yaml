  to: 'Когда он сидел на судейском месте, его жена послала ему весть: «Не делай ничего против этого Праведника[a], потому что сегодня я много страдала во сне из-за Него».'
  rationale: Исправлены две русские стилистико-синтаксические проблемы без изменения смысла. «Против этого Праведника» делает предупреждение нормативным и естественным по-русски, а «послала ему весть» прямо выражает отправку сообщения. Сноска сохранена и остаётся привязанной к δίκαιος.
