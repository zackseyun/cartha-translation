lexical_decisions:
- source_word: εἶχον
  choice: у них был
  rationale: Имперфект ἔχω с неопределённым подлежащим во множественном числе указывает, что власти держали этого человека под стражей; по-русски естественно передать это конструкцией «у них был».
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Слабый повествовательный соединительный элемент; в современном русском переход естественно передаётся без отдельного союза, тогда как «же» здесь звучало бы излишне маркированно.
- source_word: τότε
  choice: в то время
  rationale: Сохраняет явное временное значение наречия.
- source_word: δέσμιον
  choice: узник
  rationale: Обозначает человека, находящегося под стражей; «узник» ясно и уместно в судебном контексте.
- source_word: ἐπίσημον
  choice: известный
  rationale: Слово означает заметного, хорошо известного человека; контекст допускает дурную известность, но сам греческий термин не требует однозначно оценочного «печально известный».
- source_word: λεγόμενον
  choice: по имени
  rationale: Причастие вводит имя человека; русское «по имени» в данном контексте естественнее буквального «называемый».
- source_word: Ἰησοῦν Βαραββᾶν
  choice: Иисус Варавва
  rationale: Основной текст SBLGNT содержит личное имя Ἰησοῦν перед Βαραββᾶν, поэтому оба имени сохранены.
theological_decisions:
- issue: Полная форма имени Вараввы
  choice: 'В основном тексте: «Иисус Варавва»'
  alternative: Только «Варавва»
  rationale: Перевод следует представленному тексту SBLGNT, где стоит Ἰησοῦν Βαραββᾶν; более краткое чтение отражено в примечании как значимый текстовый вариант.
- issue: Оценочная окраска ἐπίσημον
  choice: известный
  alternative: печально известный
  rationale: 'Нейтральное значение сохраняет лексическую неоднозначность: дурная слава вероятна из контекста, но не выражена греческим словом однозначно.'
translation_notes:
  register: Современный литературный русский язык, ясный повествовательный стиль. Формулировка сохраняет временное указание, неопределённость субъекта и текстовый вариант имени; оценочная сила ἐπίσημον намеренно не усилена.
