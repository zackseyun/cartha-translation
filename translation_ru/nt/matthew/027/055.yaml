- from: Там было и много женщин, наблюдавших издали. Они пошли за Иисусом из Галилеи и служили Ему.[a]
  to: Там было много женщин, наблюдавших издали, которые последовали за Иисусом из Галилеи и служили Ему[a].
  rationale: Исправление заменяет потенциально разовое «пошли за» на «последовали за», восстанавливает связь характеристики с женщинами и переносит сноску к поясняемому глаголу. Смысл, временная последовательность и широта значения διακονέω сохранены.
