  text: Ἦσαν δὲ ἐκεῖ γυναῖκες πολλαὶ ἀπὸ μακρόθεν θεωροῦσαι, αἵτινες ἠκολούθησαν τῷ Ἰησοῦ ἀπὸ τῆς Γαλιλαίας διακονοῦσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/055.yaml
  text: There were many women there[a], watching from a distance, who had followed Jesus from Galilee[b], serving him.
translation:
  language: ru
  text: Там было много женщин, наблюдавших издали, которые последовали за Иисусом из Галилеи и служили Ему[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заботились о Нём»; греческий глагол может обозначать практическую помощь и поддержку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ ἐκεῖ
  choice: Там было и
  rationale: Имперфект ἦσαν передаёт наличие женщин на месте действия, ἐκεῖ — «там», а мягкий связующий δέ естественно выражен частицей «и» без усиления противопоставления.
- source_word: γυναῖκες πολλαὶ
  choice: много женщин
  rationale: Прямо и естественно передаёт количество и род.
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: наблюдавших издали
  rationale: Причастие θεωροῦσαι обозначает продолжающееся внимательное зрительное наблюдение, а ἀπὸ μακρόθεν — пространственную удалённость.
- source_word: αἵτινες ἠκολούθησαν τῷ Ἰησοῦ ἀπὸ τῆς Γαλιλαίας
  choice: Они пошли за Иисусом из Галилеи
  rationale: Отдельное предложение делает длинную греческую конструкцию ясной по-русски. «Пошли за Иисусом» сохраняет смысл следования за Ним, а «из Галилеи» — исходную географическую точку.
- source_word: διακονοῦσαι αὐτῷ
  choice: служили Ему
  rationale: «Служили» сохраняет широкий смысл πρακтической помощи и поддержки, не превращая описание в обозначение церковной должности.
theological_decisions:
- issue: Характер служения женщин (διακονοῦσαι)
  choice: служили Ему
  alternative: заботились о Нём / помогали Ему
  rationale: 'Формулировка сохраняет широту греческого глагола: речь может идти о практической заботе и поддержке, но текст не определяет это как формальное церковное служение.'
- issue: Следование женщин за Иисусом из Галилеи
  choice: пошли за Иисусом из Галилеи
  alternative: следовали за Иисусом от Галилеи
  rationale: Выбранный вариант естественно обозначает начавшееся ранее следование, приведшее женщин к месту распятия, не добавляя специальных богословских оттенков.
translation_notes:
  register: Современный литературный русский язык; синтаксис разделён на два предложения ради ясности, при сохранении логической связи и последовательности исходного текста. Местоимение «Ему» написано с прописной буквы в соответствии с принятым благоговейным библейским регистром.
