  text: Но Иисус снова громко воскликнул и испустил дух[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделал последний вздох». Буквально: «отпустил дух»; это выражение означает смерть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Частица продолжает повествование с лёгким оттенком противопоставления; «но» естественно передаёт переход от реакции окружающих к действию Иисуса.
- source_word: πάλιν
  choice: снова
  rationale: Прямо передаёт повторность действия и естественно звучит в современном русском.
- source_word: κράξας
  choice: воскликнул
  rationale: Глагол обозначает сильный, громкий возглас; наречие «громко» вместе с ним передаёт и значение глагола, и последующее указание на силу голоса.
- source_word: φωνῇ μεγάλῃ
  choice: громко
  rationale: Естественная русская передача дательного образа действия; сохраняет акцент на силе голоса без буквального и неестественного «великим голосом».
- source_word: ἀφῆκεν
  choice: испустил
  rationale: В сочетании с «дух» образует устойчивое русское выражение о смерти и при этом сохраняет образ исходного текста.
- source_word: τὸ πνεῦμα
  choice: дух
  rationale: Сохраняет основное лексическое значение πνεῦμα и богословскую многозначность; русская идиома «испустить дух» не требует притяжательного местоимения.
theological_decisions:
- issue: Передача выражения ἀφῆκεν τὸ πνεῦμα
  choice: испустил дух
  alternative: умер; сделал последний вздох; отдал дух
  rationale: «Испустил дух» — понятное и торжественное русское выражение, близкое к греческой формулировке. Оно не сводит πνεῦμα исключительно к дыханию и не добавляет оттенок добровольной передачи, который мог бы сильнее подразумеваться в варианте «отдал дух».
translation_notes:
  register: Современный литературный русский с торжественностью, соответствующей сцене. Синтаксис краток и естественен; традиционное выражение «испустил дух» остаётся понятным современному читателю.
