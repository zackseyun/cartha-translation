lexical_decisions:
- source_word: λαβὼν
  choice: взяв
  rationale: Аористное причастие передаёт действие, предшествующее основному глаголу; русская деепричастная конструкция естественно сохраняет греческую последовательность.
- source_word: σῶμα
  choice: тело
  rationale: Прямое соответствие греческому существительному; притяжательное местоимение в исходном тексте отсутствует, а из контекста ясно, что речь идёт о теле Иисуса.
- source_word: ἐνετύλιξεν
  choice: обернул
  rationale: Глагол означает «обернуть, окутать»; «обернул» естественно звучит в данном погребальном контексте.
- source_word: αὐτὸ
  choice: его
  rationale: Греческое местоимение среднего рода грамматически относится к слову σῶμα. В русском местоимение «его» согласуется с существительным мужского рода «тело» и сохраняет предметную отсылку без необходимости выбирать между английскими 'it' и 'him'.
- source_word: σινδόνι
  choice: льняным полотном
  rationale: Слово обозначает льняное полотно, в том числе используемое при погребении. Выбор не сужает значение до специального термина «плащаница».
- source_word: καθαρᾷ
  choice: чистым
  rationale: В контексте ткани καθαρός естественно передаётся словом «чистый», а не более отвлечённым «чистый/непорочный» в нравственном или культовом смысле.
- source_word: καὶ ... ὁ Ἰωσὴφ
  choice: И ... Иосиф
  rationale: Союз «и» сохраняет простое повествовательное продолжение, выраженное καί, без добавления временного оттенка «тогда».
