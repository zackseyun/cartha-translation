  text: Καὶ ἐλθόντες εἰς τόπον λεγόμενον Γολγοθᾶ, ὅ ἐστιν ⸂Κρανίου Τόπος λεγόμενος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/033.yaml
  text: And when they came to a place called Golgotha (which means Place of a Skull),[a]
translation:
  language: ru
  text: Придя на место, называемое Голгофой, что означает «Место черепа»,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «что называется Местом черепа». Греческая фраза поясняет название «Голгофа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: Придя
  rationale: Аористное причастие естественно передаёт предшествующее обстоятельство и сохраняет плавность повествования.
- source_word: τόπον
  choice: место
  rationale: Обычное значение τόπος; в русском после предлога и при последующем определении артиклевая неопределённость отдельно не выражается.
- source_word: λεγόμενον
  choice: называемое
  rationale: Причастие передаёт значение наименования и естественно сочетается со словом «место».
- source_word: Γολγοθᾶ
  choice: Голгофой
  rationale: Традиционная и общеупотребительная русская транслитерация топонима, поставленная в требуемом творительном падеже.
- source_word: ὅ ἐστιν
  choice: что означает
  rationale: Формула вводит пояснение значения семитского названия; такой перевод ясно передаёт её пояснительную функцию.
- source_word: Κρανίου Τόπος
  choice: Место черепа
  rationale: Сохраняется структура сочетания с родительным падежом; отсутствие артикля не требует в русском добавления определённости.
- source_word: λεγόμενος
  choice: опущено как подразумеваемое в пояснительной формуле
  rationale: Буквальное повторение «называется» было бы тяжеловесным; «что означает» естественно включает пояснительную функцию всей греческой формулы.
theological_decisions: []
