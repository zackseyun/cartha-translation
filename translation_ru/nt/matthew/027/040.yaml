lexical_decisions:
- source_word: λέγοντες
  choice: и говорили
  rationale: Причастие продолжает предшествующее повествование; в русском естественно передать его личной формой прошедшего времени.
- source_word: Ὁ καταλύων
  choice: Разрушающий
  rationale: Артикль с причастием употреблён как обращение; субстантивированное причастие сохраняет насмешливую формулировку и не добавляет модального оттенка.
- source_word: καταλύω
  choice: разрушать
  rationale: В отношении храма глагол обозначает разрушение или снос; «разрушать» звучит ясно и достойно.
- source_word: ναός
  choice: храм
  rationale: Хотя слово может точнее обозначать святилище, в данном обвинительном намёке естественный русский эквивалент — «храм».
- source_word: ἐν τρισὶν ἡμέραις
  choice: за три дня
  rationale: Русское «за три дня» естественно выражает срок, в течение которого действие должно быть завершено.
- source_word: οἰκοδομῶν
  choice: строящий его
  rationale: Греческий глагол буквально означает «строить»; местоимение «его» ясно восстанавливает объект. Возможный смысл повторного строительства отмечен в сноске.
- source_word: σῶσον σεαυτόν
  choice: Спаси Себя
  rationale: Прямая передача повеления с возвратным местоимением; прописная буква соответствует принятому благоговейному русскому оформлению местоимений, относящихся ко Христу.
- source_word: εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Если Ты Сын Бога
  rationale: Сохраняет условную насмешку и христологический титул без ослабления или дополнительного толкования.
- source_word: κατάβηθι
  choice: сойди
  rationale: Естественное русское повеление человеку, находящемуся выше говорящих.
- source_word: σταυρός
  choice: крест
  rationale: Стандартный и контекстуально точный эквивалент в повествовании о распятии.
theological_decisions:
- issue: Передача титула υἱὸς τοῦ θεοῦ в контексте насмешки
  choice: Сын Бога
  alternative: Божий Сын
  rationale: Формулировка прямо сохраняет титул и условный характер вызова, не подтверждая устами рассказчика насмешливую предпосылку и не ослабляя богословского содержания.
