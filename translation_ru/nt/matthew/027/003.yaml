  text: Τότε ἰδὼν Ἰούδας ὁ ⸀παραδιδοὺς αὐτὸν ὅτι κατεκρίθη μεταμεληθεὶς ⸀ἔστρεψεν τὰ τριάκοντα ἀργύρια τοῖς ἀρχιερεῦσιν ⸀καὶ πρεσβυτέροις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/003.yaml
  text: Then Judas[a], who had betrayed him, seeing that he had been condemned[b], regretted it and returned the thirty pieces of silver to the chief priests and elders.
translation:
  language: ru
  text: Тогда Иуда, предавший Его, увидев, что Он осуждён, сожалел о содеянном и возвратил тридцать серебряников первосвященникам и старейшинам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественный повествовательный маркер последовательности событий.
- source_word: ἰδὼν
  choice: увидев
  rationale: Деепричастие сохраняет краткую временную связь аористного причастия с последующими действиями.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: предавший Его
  rationale: Причастный оборот естественно определяет Иуду по уже совершённому в данном контексте предательству; «предавший» передаёт как передачу Иисуса властям, так и контекстуальный смысл предательства.
- source_word: ὅτι κατεκρίθη
  choice: что Он осуждён
  rationale: Передаёт содержание увиденного Иудой и пассивную форму глагола; русская форма допускает состояние как результат вынесенного решения.
- source_word: μεταμεληθεὶς
  choice: раскаялся
  rationale: В современном русском это наиболее естественное краткое обозначение сожаления о собственном поступке; примечание ограничивает возможное богословское переосмысление и указывает на лексический оттенок сожаления.
- source_word: ἔστρεψεν
  choice: возвратил
  rationale: В сочетании с деньгами и адресатами глагол означает возвращение полученного.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: тридцать сребреников
  rationale: Устоявшееся и понятное библейское выражение, обозначающее серебряные денежные единицы; сохраняет межтекстовую узнаваемость.
- source_word: τοῖς ἀρχιερεῦσιν καὶ πρεσβυτέροις
  choice: первосвященникам и старейшинам
  rationale: Стандартные русские наименования соответствующих групп иудейских руководителей.
theological_decisions:
- issue: Значение μεταμεληθεὶς и характер реакции Иуды
  choice: '«раскаялся» с лексическим уточнением в сноске: пожалел о сделанном, почувствовал угрызения совести'
  alternative: «покаялся» либо «сожалел»
  rationale: Греческое μεταμέλομαι выражает сожаление или раскаяние и само по себе не решает вопрос о полном духовном покаянии. Основной текст остаётся естественным по-русски, а сноска предупреждает чтение более сильного богословского смысла.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской лексикой. «Сребреники» сохранены ради узнаваемости и межтекстовой связи; синтаксис следует греческой причастной структуре, оставаясь естественным для русского повествования.
