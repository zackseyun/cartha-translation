revisions:
- from: Тогда Иуда, предавший Его, увидев, что Он осуждён, раскаялся[a] и возвратил тридцать сребреников первосвященникам и старейшинам.
  to: Тогда Иуда, предавший Его, увидев, что Он осуждён, сожалел о содеянном и возвратил тридцать серебряников первосвященникам и старейшинам.
  rationale: Исправление устраняет богословски более сильный оттенок «раскаялся» и передаёт μεταμεληθείς как сожаление о собственном поступке без предрешения характера покаяния Иуды. «Серебряников» сохраняет традиционную связь выражения, но менее архаично. Отдельная сноска более не нужна, поскольку основной текст уже передаёт требуемую семантическую осторожность.
