  text: καὶ πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ καὶ κάλαμον ⸂ἐν τῇ δεξιᾷ⸃ αὐτοῦ, καὶ γονυπετήσαντες ἔμπροσθεν αὐτοῦ ⸀ἐνέπαιξαν αὐτῷ λέγοντες· Χαῖρε, ⸀βασιλεῦ τῶν Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/029.yaml
  text: And after weaving a crown of thorns[a], they put it on his head, and a reed in his right hand; and kneeling before him, they mocked him, saying, “Hail, King of the Jews!”
translation:
  language: ru
  text: 'И, сплетя терновый венец, они возложили его Ему на голову, а в правую руку дали трость. Затем, преклонив перед Ним колени, они насмехались над Ним, говоря: «Радуйся, Царь иудеев![a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Царь жителей Иудеи». Греческое слово может обозначать иудеев или жителей Иудеи; здесь оно входит в насмешливый царский титул Иисуса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλέξαντες
  choice: сплетя
  rationale: Деепричастие естественно передаёт действие, предшествующее основному глаголу, и сохраняет образ плетения.
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: венец из колючих ветвей
  rationale: «Венец» соответствует предмету, пародирующему царский венец; «колючие ветви» естественно выражает материал и не создаёт впечатления, будто венец состоял лишь из отдельных шипов.
- source_word: ἐπέθηκαν ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: возложили его Ему на голову
  rationale: «Возложили» сохраняет торжественно-церемониальный оттенок сцены, здесь намеренно издевательский, оставаясь ясным современному читателю.
- source_word: κάλαμον
  choice: трость
  rationale: Буквально обозначает тростник или трость; «трость» сохраняет конкретный предмет и позволяет увидеть в нём пародию на царский скипетр, не называя его скипетром прямо.
- source_word: ἐν τῇ δεξιᾷ αὐτοῦ
  choice: в правую руку дали
  rationale: По-русски требуется выразить подразумеваемое помещение предмета в руку; «дали» передаёт смысл без тяжеловесной буквальности.
- source_word: γονυπετήσαντες ἔμπροσθεν αὐτοῦ
  choice: преклонив перед Ним колени
  rationale: Естественное и достойное русское выражение для коленопреклонения перед человеком; сохраняет пародию на почтение.
- source_word: ἐνέπαιξαν αὐτῷ
  choice: насмехались над Ним
  rationale: Точно передаёт продолженное издевательское действие в данном контексте.
- source_word: Χαῖρε
  choice: Да здравствует
  rationale: В форме обращения к царю это естественная русская формула торжественного приветствия, здесь звучащая издевательски; она лучше сохраняет функцию царской аккламации, чем обычное «Приветствую».
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: Царь иудеев
  rationale: Устоявшаяся и контекстуально точная передача насмешливого царского титула; форма звательного падежа в греческом передаётся обращением.
theological_decisions:
- issue: Передача издевательской царской аккламации без явного пояснения иронии
  choice: «Да здравствует Царь иудеев!»
  alternative: «Приветствуем Тебя, Царь иудеев!»
  rationale: Контекст уже ясно показывает насмешку. Формула «Да здравствует» сохраняет внешний вид торжественного царского приветствия и тем самым напряжение между издевательством воинов и истинным царским достоинством Иисуса, не объясняя его внутри текста.
- issue: Значение Ἰουδαίων в титуле
  choice: «иудеев»
  alternative: «жителей Иудеи»
  rationale: В формуле обвинения и царского титула слово обозначает народ в широком этнорелигиозном смысле, а не только жителей области Иудеи. «Иудеи» является точным и узнаваемым русским библейским обозначением.
translation_notes:
  register: 'Современный литературный русский язык с достоинством повествования. Синтаксис сделан естественным для русского: подразумеваемое действие с тростью выражено глаголом «дали», а последовательность действий — деепричастными оборотами. Прописные местоимения по отношению к Иисусу поддерживают принятый русский библейский регистр, не добавляя нового содержания.'
