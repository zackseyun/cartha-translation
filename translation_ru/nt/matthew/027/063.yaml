lexical_decisions:
- source_word: λέγοντες
  choice: говоря
  rationale: Деепричастие сохраняет связь причастной формы с предыдущим стихом.
- source_word: Κύριε
  choice: Господин
  rationale: В обращении к Пилату это почтительный светский титул; такой перевод не придаёт обращению смысла исповедания божественности.
- source_word: ἐμνήσθημεν
  choice: мы вспомнили
  rationale: Аорист передан естественным русским прошедшим временем и обозначает пришедшее им на память высказывание.
- source_word: ἐκεῖνος ὁ πλάνος
  choice: тот обманщик
  rationale: «Тот» сохраняет дистанцирующий оттенок указательного местоимения, а «обманщик» естественно передаёт враждебное πλάνος — того, кто вводит людей в заблуждение.
- source_word: ἔτι ζῶν
  choice: ещё при жизни
  rationale: Кратко и естественно обозначает, что слова были произнесены до смерти Иисуса.
- source_word: Μετὰ τρεῖς ἡμέρας
  choice: Спустя три дня
  rationale: Передаёт обычное значение μετά с винительным падежом — «после», не гармонизируя выражение с формулой «на третий день».
- source_word: ἐγείρομαι
  choice: я воскресну
  rationale: В контексте предсказания воскресения это наиболее естественная русская передача формы настоящего времени с будущей отнесённостью; залоговая неоднозначность греческой формы отмечена в сноске.
theological_decisions:
- issue: Передача цитируемого предсказания Иисуса о воскресении
  choice: Спустя три дня я воскресну
  alternative: Спустя три дня я буду воскрешён
  rationale: Русское «воскресну» ясно и естественно передаёт смысл в контексте, тогда как греческая форма ἐγείρομαι допускает среднее/непереходное и страдательное понимание. Сноска сохраняет эту неоднозначность, не решая молчаливо вопрос о залоге.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Светское обращение к Пилату передано словом «Господин», а уничижительное обозначение Иисуса — выражением «тот обманщик». Формула времени не сглажена до «на третий день».
