  source_fidelity: 'Основной смысл передан верно: λέγοντες связано с предыдущим стихом, Κύριε в обращении к Пилату естественно передано как «господин», ἐμνήσθημεν — прошедшим временем, πλάνος — как враждебное «обманщик», а μετά с винительным сохранено как «спустя три дня». Однако «ещё при жизни» в данном синтаксисе менее точно, чем «когда он был ещё жив»: греческое ἔτι ζῶν относится к субъекту глагола εἶπεν и прямо характеризует его как живого в момент речи. Сноска также неточно объясняет форму ἐγείρομαι: «меня воскрешают» — настоящее пассивное, но в контексте предсказания неудачно звучит как буквальный эквивалент; следует обозначить возможное будущее страдательное прочтение без искусственного настоящего времени по-русски.'
  naturalness: «Говоря» как деепричастное продолжение предыдущего стиха допустимо и литературно. «Господин» уместно как уважительное обращение к Пилату. Формулировка «тот обманщик, когда он был ещё жив, сказал» яснее связывает временной оборот с Иисусом и сохраняет естественный порядок русской фразы.
  terminology: «Воскресну» — естественная и контекстуально точная русская передача ἐγείρομαι; она не требует доктринального уточнения. Чтобы сохранить залоговую неоднозначность исходной формы, достаточно сноски с вариантом «буду воскрешён». «Спустя три дня» удачно не подменяет греческое «после трёх дней» формулой «на третий день».
