id: MAT.27.57
reference: Matthew 27:57
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης ἦλθεν ἄνθρωπος πλούσιος ἀπὸ Ἁριμαθαίας, τοὔνομα Ἰωσήφ, ὃς καὶ αὐτὸς ⸀ἐμαθητεύθη τῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/057.yaml
  text: When evening had come[a], a rich man from Arimathea came, named Joseph[b], who himself also had become a disciple of Jesus.
translation:
  language: ru
  text: Когда наступил вечер, пришёл богатый человек из Аримафеи по имени Иосиф, который и сам стал учеником Иисуса.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который и сам был сделан учеником Иисуса»; или: «который и сам был учеником Иисуса».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Когда наступил вечер
  rationale: Родительный самостоятельный оборот задаёт временной переход; эта формулировка естественно передаёт наступление вечера, а δέ не требует отдельного русского союза.
- source_word: ἦλθεν
  choice: пришёл
  rationale: Прямое и естественное повествовательное соответствие аористу ἔρχομαι.
- source_word: ἄνθρωπος πλούσιος
  choice: богатый человек
  rationale: Точно и нейтрально передаёт сочетание существительного с прилагательным.
- source_word: ἀπὸ Ἁριμαθαίας
  choice: из Аримафеи
  rationale: Предлог ἀπό обозначает происхождение или место, откуда человек пришёл.
- source_word: τοὔνομα Ἰωσήφ
  choice: по имени Иосиф
  rationale: Естественная русская форма представления имени, сохраняющая определительную функцию греческого выражения.
- source_word: ὃς καὶ αὐτὸς
  choice: который и сам
  rationale: 'Сочетание «и сам» сохраняет совокупный акцент καί и αὐτός: Иосиф также принадлежал к ученикам.'
- source_word: ἐμαθητεύθη τῷ Ἰησοῦ
  choice: стал учеником Иисуса
  rationale: Передаёт результативный смысл пассива μαθητεύω и отношение к Иисусу, не уточняя без основания, каким именно образом Иосиф был сделан учеником.
theological_decisions:
- issue: Значение ἐμαθητεύθη применительно к Иисусу
  choice: стал учеником Иисуса
  alternative: был сделан учеником Иисуса; был учеником Иисуса
  rationale: Пассивная форма допускает как вступление в ученичество, так и состояние принадлежности к ученикам. Основной перевод естественно передаёт результат, а примечание сохраняет возможный пассивный оттенок, не утверждая непременно непосредственного обучения самим Иисусом.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанно торжественное. Неестественная калька пассивной конструкции вынесена в примечание, а акцент ὃς καὶ αὐτὸς сохранён выражением «который и сам».
