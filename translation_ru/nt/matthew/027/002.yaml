  text: καὶ δήσαντες αὐτὸν ἀπήγαγον καὶ ⸀παρέδωκαν Πιλάτῳ τῷ ἡγεμόνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/002.yaml
  text: And after binding him[b][a], they led him away and handed him over to Pilate the governor.
translation:
  language: ru
  text: Связав Его, они отвели Его и передали Пилату, правителю.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δήσαντες
  choice: связав
  rationale: Аористное причастие обозначает действие, предшествующее основным глаголам; русское деепричастие естественно и точно передаёт эту последовательность.
- source_word: ἀπήγαγον
  choice: отвели
  rationale: Глагол означает «увести, отвести»; этот вариант сохраняет значение физического препровождения под стражей.
- source_word: παρέδωκαν
  choice: передали
  rationale: В данном судебном контексте речь идёт о передаче человека под власть и в распоряжение другого лица; «передали» звучит ясно и современно, не устраняя возможного богословского оттенка глагола.
- source_word: Πιλάτῳ
  choice: Пилату
  rationale: Имя передано в принятой русской библейской форме и поставлено в дательном падеже согласно греческому тексту.
- source_word: τῷ ἡγεμόνι
  choice: правителю
  rationale: ἡγεμών — общее обозначение правящего должностного лица. «Правитель» сохраняет широту греческого слова и не уточняет должность сверх исходного текста.
theological_decisions:
- issue: Передача значения παραδίδωμι в рассказе о страданиях
  choice: передали
  alternative: выдали
  rationale: «Передали» прежде всего выражает непосредственный юридический смысл — передачу Иисуса под власть Пилата, но не исключает более широкого богословского звучания слова в повествовании.
- issue: Передача титула ἡγεμών
  choice: правителю
  alternative: наместнику
  rationale: «Правитель» соответствует широкому значению греческого титула; «наместник» был бы более конкретной административной интерпретацией.
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная фраза сохраняет последовательность трёх действий и начальную присоединительную связь καί без обязательного отдельного «и» в русском стихе. Местоимение «Его» оформлено с прописной буквы по устойчивой русской библейской издательской традиции.
