  text: κέλευσον οὖν ἀσφαλισθῆναι τὸν τάφον ἕως τῆς τρίτης ἡμέρας, μήποτε ἐλθόντες οἱ μαθηταὶ ⸀αὐτοῦ κλέψωσιν αὐτὸν καὶ εἴπωσιν τῷ λαῷ· Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἔσται ἡ ἐσχάτη πλάνη χείρων τῆς πρώτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/064.yaml
  text: Therefore[a], order the tomb to be secured until the third day, lest his disciples come and steal him and say to the people[b], ‘He has been raised from the dead,’ and the last deception will be worse than the first.
translation:
  language: ru
  text: 'Итак, прикажи обеспечить надёжную защиту гробницы до третьего дня, чтобы Его ученики не пришли[a], не украли Его и не сказали народу: «Он был воскрешён из мёртвых»[b]. И тогда последний обман будет хуже первого.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях после слова «пришли» добавлено: «ночью». Здесь принят более краткий вариант текста.'
    reason: textual_variant
  - marker: b
    text: 'Возможный перевод: «Он воскрес из мёртвых». В греческом тексте употреблён страдательный залог.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κέλευσον
  choice: прикажи
  rationale: Аористный императив выражает требование решительного распоряжения со стороны Пилата; «прикажи» естественно передаёт официальную власть.
- source_word: οὖν
  choice: итак
  rationale: Сохраняет вывод из предшествующих слов и звучит естественно в современной русской речи.
- source_word: ἀσφαλισθῆναι τὸν τάφον
  choice: надёжно охранять гробницу
  rationale: Глагол означает обеспечить безопасность; в данном контексте охрана гробницы передаёт цель действия, не уточняя преждевременно способ, названный далее в повествовании.
- source_word: ἕως τῆς τρίτης ἡμέρας
  choice: до третьего дня
  rationale: Устойчивое и точное временное выражение, связанное с ранее упомянутым предсказанием.
- source_word: μήποτε
  choice: чтобы … не
  rationale: Естественно по-русски передаёт опасение и предупредительную цель.
- source_word: κλέψωσιν αὐτόν
  choice: не украли Его
  rationale: Сохраняет личное местоимение оригинала и не заменяет его толкованием «тело».
- source_word: τῷ λαῷ
  choice: народу
  rationale: λαός обозначает народ в целом, а не только находящуюся на месте толпу.
- source_word: Ἠγέρθη
  choice: Он был воскрешён
  rationale: Сохраняет страдательный залог греческого аориста и не называет подразумеваемого деятеля.
- source_word: ἡ ἐσχάτη πλάνη
  choice: последний обман
  rationale: В устах говорящих πλάνη обозначает предполагаемый ими обман; формулировка не подтверждает их оценку как позицию повествователя.
theological_decisions:
- issue: Передача утверждения о воскресении в прямой речи
  choice: Он был воскрешён из мёртвых
  alternative: Он воскрес из мёртвых
  rationale: Страдательная конструкция сохраняет форму Ἠγέρθη и обычную для Нового Завета возможность подразумевать Бога как Совершившего действие, не добавляя Его в текст явно.
- issue: Оценочное значение πλάνη
  choice: обман
  alternative: заблуждение
  rationale: Контекст предполагаемого похищения и последующего ложного заявления поддерживает «обман», однако это обвинение религиозных руководителей, а не авторское отрицание воскресения.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой официальной просьбы. «Гробница» ясно обозначает высеченное погребальное место; синтаксис упрощён без устранения логической связи и богословски значимого страдательного залога.
