id: MAT.27.31
reference: Matthew 27:31
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν χλαμύδα καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ καὶ ἀπήγαγον αὐτὸν εἰς τὸ σταυρῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/031.yaml
  text: And when they had mocked him[a], they stripped the cloak off him and put his own clothes on him, and led him away to crucify him.
translation:
  language: ru
  text: И, насмеявшись над Ним, они сняли с Него плащ[a], надели на Него Его одежду и повели Его, чтобы распять.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «накидку». Греческое слово χλαμύς обозначает верхнюю одежду, часто военный плащ; здесь это одежда, в которую Иисуса облачили, насмехаясь над Ним как над царём.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: насмеявшись
  rationale: Аорист обозначает завершённое издевательское осмеяние; деепричастная конструкция естественно передаёт временную связь с последующими действиями.
- source_word: ἐξέδυσαν αὐτὸν τὴν χλαμύδα
  choice: сняли с Него плащ
  rationale: Оборот означает, что с Иисуса сняли надетую на Него верхнюю одежду. «Сняли с Него» точно и естественно, тогда как «сорвали» добавляло бы не выраженную самим глаголом резкость.
- source_word: χλαμύδα
  choice: плащ
  rationale: χλαμύς — верхняя одежда, нередко военный плащ. «Плащ» сохраняет предметное значение слова и не превращает одежду в подлинное царское облачение.
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ
  choice: надели на Него Его одежду
  rationale: Передан контраст между снятым насмешливым облачением и принадлежавшей Иисусу одеждой; собирательное «одежда» звучит по-русски естественнее буквального множественного числа.
- source_word: ἀπήγαγον
  choice: повели Его
  rationale: Глагол обозначает, что находящегося под стражей человека уводят или ведут к месту назначения.
- source_word: εἰς τὸ σταυρῶσαι
  choice: чтобы распять
  rationale: Конструкция с εἰς и субстантивированным инфинитивом выражает цель; придаточное цели является прямым и естественным русским соответствием.
