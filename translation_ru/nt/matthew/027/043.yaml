base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/043.yaml
  text: He has trusted in God[a]; let God rescue him now, if he wants him, for he said[b], ‘I am the Son of God.’
translation:
  language: ru
  text: 'Он уповал на Бога; пусть Бог теперь избавит Его, если Он хочет Его[a], ведь Он сказал[b]: «Я — Сын Божий».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если Он благоволит к Нему». Формулировка отсылает к Пс 21:9, где особенно заметен смысл Божьего благоволения.'
    reason: alternative_reading
  - marker: b
    text: Эта насмешка близко воспроизводит Пс 21:9, связывая насмешки над Иисусом с образом страдающего праведника в этом псалме.
    reason: cross_reference
lexical_decisions:
- source_word: πέποιθεν ἐπὶ τὸν θεόν
  choice: уповал на Бога
  rationale: Перфект πέποιθεν обозначает утвердившееся доверие; русское «уповал» естественно передаёт стойкое доверие к Богу и сохраняет возвышенный, но понятный регистр.
- source_word: ῥυσάσθω νῦν
  choice: пусть Бог теперь избавит Его
  rationale: Аористный императив выражает насмешливый вызов немедленно спасти от опасности. Подлежащее «Бог» названо явно для ясности, поскольку оно подразумевается из предыдущей фразы.
- source_word: εἰ θέλει αὐτόν
  choice: если Он Ему угоден
  rationale: Буквально выражение допускает смысл «если Он хочет Его», однако в ясной аллюзии на Пс 21:9 по Септуагинте речь идёт о Божьем благоволении. «Если Он Ему угоден» естественно выражает этот смысл, не устраняя буквальную возможность, отмеченную в сноске.
- source_word: εἶπεν γὰρ
  choice: ведь Он сказал
  rationale: Аорист передан простым прошедшим временем; γάρ вводит основание насмешливого вызова и естественно передаётся словом «ведь».
- source_word: Θεοῦ εἰμι υἱός
  choice: Я — Сын Божий
  rationale: Безартиклевое именное сказуемое здесь имеет качественно-титульный смысл; контекст Евангелия от Матфея поддерживает определённое мессианское наименование, а не значение «один из сынов Бога».
theological_decisions:
- issue: Передача Θεοῦ εἰμι υἱός
  choice: Я — Сын Божий
  alternative: Я — Божий Сын; Я — сын Бога
  rationale: Фраза в повествовательном контексте Матфея воспроизводит признанный христологический титул. Вариант сохраняет его силу, не добавляя более поздних догматических формулировок.
- issue: Передача εἰ θέλει αὐτόν в свете Псалма 21:9
  choice: если Он Ему угоден
  alternative: если Он хочет Его
  rationale: Глагол θέλω сам по себе означает «хотеть, желать», но формулировка намеренно отсылает к Пс 21:9, где на первом плане Божье благоволение. Основной текст передаёт естественный смысл аллюзии, а буквальная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Заглавные местоимения в отношении Иисуса и Бога применены последовательно для ясности референции; фраза остаётся понятной обычному читателю.
