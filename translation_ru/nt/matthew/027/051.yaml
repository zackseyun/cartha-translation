base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/051.yaml
  text: And behold[a], the curtain of the temple was torn in two from top to bottom, and the earth shook, and the rocks were split.
translation:
  language: ru
  text: И вот, завеса храма[a] разорвалась сверху донизу надвое; земля содрогнулась, и скалы раскололись.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «завеса святилища». Греческое слово может обозначать завесу во внутренней части храма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: и вот
  rationale: Естественный для современного русского повествовательный маркер, сохраняющий внезапность и торжественное привлечение внимания.
- source_word: καταπέτασμα τοῦ ναοῦ
  choice: завеса святилища
  rationale: Καταπέτασμα обозначает завесу, а ναός здесь — собственно святилище, не весь храмовый комплекс; сочетание точно и понятно в данном контексте.
- source_word: ἐσχίσθη
  choice: разорвалась
  rationale: Естественный русский глагол для ткани; форма без названного деятеля сохраняет греческую пассивную перспективу, не уточняя причину события.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο
  choice: надвое сверху донизу
  rationale: Передаёт и результат разрыва, и подчёркнутое направление сверху вниз в естественном русском порядке слов.
- source_word: ἡ γῆ ἐσείσθη
  choice: земля содрогнулась
  rationale: Передаёт сильное сотрясение земли и торжественно-драматический регистр, не сужая значение до отдельного участка почвы.
- source_word: αἱ πέτραι ἐσχίσθησαν
  choice: скалы раскололись
  rationale: «Скалы» указывает на крупные каменные массы, а «раскололись» естественно передаёт действие σχίζω применительно к камню.
theological_decisions:
- issue: Смысл разрыва храмовой завесы
  choice: Передать событие прямо, не добавляя его богословского истолкования.
  alternative: Пояснить его как открытие доступа к Богу или как суд над храмовым устройством.
  rationale: Сам стих сообщает о знамении, но не истолковывает его; описательный перевод сохраняет богословскую напряжённость и не вносит комментарий в основной текст.
- issue: Неуказанный деятель при разрыве завесы
  choice: 'Сохранить формулировку без прямого указания деятеля: «разорвалась».'
  alternative: 'Перевести явно: «Бог разорвал».'
  rationale: Греческий пассив допускает понимание божественного действия, однако прямо деятеля не называет; перевод не должен устранять эту формальную сдержанность.
translation_notes:
  register: Современный литературный русский язык с торжественным повествовательным звучанием. Синтаксис остаётся ясным и энергичным; точка с запятой естественно разделяет храмовое знамение и последующие земные явления.
