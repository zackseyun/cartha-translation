id: MAT.27.46
reference: Matthew 27:46
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: περὶ δὲ τὴν ἐνάτην ὥραν ⸀ἀνεβόησεν ὁ Ἰησοῦς φωνῇ μεγάλῃ λέγων· ⸂Ἠλὶ ἠλὶ⸃ λεμὰ σαβαχθάνι; τοῦτ’ ἔστιν· Θεέ μου θεέ μου, ἱνατί με ἐγκατέλιπες;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/046.yaml
  text: About the ninth hour Jesus cried out with a loud voice[a], saying, “Eli, Eli, lema sabachthani?” that is, “My God, my God[b], why have you forsaken me?”
translation:
  language: ru
  text: 'Около девятого часа Иисус громко воскликнул[a]: «Или́, Или́, лема́ савахфани́?» — то есть: «Боже Мой, Боже Мой[b], почему Ты Меня оставил?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эти слова перекликаются с Псалмом 21:2 (22:1 по иной нумерации).
    reason: cross_reference
  - marker: b
    text: 'Или: «почему Ты Меня покинул?» Греческий глагол может передаваться и этим близким по смыслу выражением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἐνάτην ὥραν
  choice: Около девятого часа
  rationale: περί с винительным падежом указывает на приблизительное время; δέ здесь имеет лёгкую связующую функцию, которую нет необходимости передавать отдельным союзом.
- source_word: ἀνεβόησεν ... φωνῇ μεγάλῃ
  choice: громко воскликнул
  rationale: Сочетание выражает сильный, громкий возглас. Русское «громко воскликнул» естественно и сохраняет торжественно-трагический тон.
- source_word: λέγων
  choice: двоеточие перед прямой речью
  rationale: В русском языке содержание возгласа естественно вводится пунктуационно; отдельное «говоря» было бы тяжеловесным.
- source_word: Ἠλὶ ἠλὶ λεμὰ σαβαχθάνι
  choice: Или́, Или́, лема́ савахфани́?
  rationale: Сохранены переданные Матфеем семитские слова, за которыми следует их перевод. Ударения помогают современному читателю произнести незнакомую фразу.
- source_word: τοῦτ’ ἔστιν
  choice: то есть
  rationale: Кратко и точно вводит данное в греческом тексте объяснение-перевод.
- source_word: Θεέ μου θεέ μου
  choice: Боже Мой, Боже Мой
  rationale: Сохранены звательная форма, притяжательное местоимение и повтор, а также узнаваемая связь с Псалмом 21:2 по русской нумерации.
- source_word: ἱνατί
  choice: почему
  rationale: Прямой современный эквивалент вопросительного наречия.
- source_word: ἐγκατέλιπες
  choice: Ты Меня оставил
  rationale: Греческий аорист естественно передаётся русским прошедшим совершенного вида. «Оставил» сохраняет прямоту и псалмическое звучание, не добавляя толкования.
theological_decisions:
- issue: Связь возгласа Иисуса с Псалмом 22:1 (21:2 в принятой русской нумерации)
  choice: Передать слова как настоящий возглас оставленности, сохранив псалмическую формулировку и не объясняя богословское напряжение внутри перевода.
  alternative: Смягчить переживание оставленности либо представить слова лишь как указание на весь псалом.
  rationale: Греческий текст приводит возглас без поясняющей богословской оговорки. Перевод должен сохранять как его непосредственную силу, так и отсылку к псалму.
- issue: Сохранение семитского возгласа
  choice: Оставить транслитерированные семитские слова в основном тексте и затем дать приведённый Матфеем перевод.
  alternative: Дать только русский смысл фразы.
  rationale: Такова композиция самого исходного текста; она также объясняет последующее ошибочное восприятие имени «Или» окружающими.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим сцене. Синтаксис сделан естественным для прямой речи; семитская фраза сохранена и снабжена ударениями. Прописные буквы в местоимениях при обращении к Богу следуют принятому русскому библейскому регистру, не меняя смысла оригинала.
