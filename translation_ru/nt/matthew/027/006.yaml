id: MAT.27.6
reference: Matthew 27:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς λαβόντες τὰ ἀργύρια εἶπαν· Οὐκ ἔξεστιν βαλεῖν αὐτὰ εἰς τὸν κορβανᾶν, ἐπεὶ τιμὴ αἵματός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/006.yaml
  text: But the chief priests[a], taking the silver pieces, said, “It is not lawful to put them into the temple treasury[b], since they are the price of blood.”
translation:
  language: ru
  text: 'Первосвященники же, взяв серебряные монеты, сказали: «Нельзя класть их в храмовую сокровищницу[a], потому что это цена крови[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. «корван» — храмовая сокровищница или священная казна.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кровавые деньги».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся русское обозначение старших священнических властей; множественное число соответствует евангельскому употреблению.
- source_word: λαβόντες
  choice: взяв
  rationale: Деепричастие естественно передаёт предшествующее или сопутствующее действие аористного причастия.
- source_word: τὰ ἀργύρια
  choice: серебряные монеты
  rationale: Контекст указывает на конкретные деньги, ранее названные тридцатью серебряными монетами; перевод сохраняет вещественный смысл, не уточняя их тип.
- source_word: Οὐκ ἔξεστιν
  choice: нельзя
  rationale: Естественно и ясно выражает религиозно-правовую недопустимость, не вводя отсутствующего в тексте субъекта запрета.
- source_word: βαλεῖν
  choice: класть
  rationale: В контексте помещения денег в казну нейтральное «класть» точнее по-русски, чем буквальное «бросать».
- source_word: κορβανᾶν
  choice: храмовую сокровищницу
  rationale: Передаёт значение священной храмовой казны понятным современным языком; исходный термин сохранён в примечании.
- source_word: ἐπεὶ
  choice: потому что
  rationale: Прямо и естественно вводит названную священниками причину запрета.
- source_word: τιμὴ αἵματός
  choice: цена крови
  rationale: Сохраняет образную и богословски напряжённую формулировку греческого текста, не сводя её к одному толкованию.
theological_decisions:
- issue: Передача κορβανᾶν как названия священной казны
  choice: храмовую сокровищницу
  alternative: корван; храмовую казну
  rationale: Смысл термина раскрыт в основном тексте для современного читателя, а транслитерация дана в примечании без навязывания специального богословского толкования.
- issue: Передача τιμὴ αἵματός
  choice: цена крови
  alternative: кровавые деньги; плата за кровь
  rationale: 'Буквально-образная передача сохраняет неоднозначность: речь может восприниматься и как цена, связанная с предательством невинного человека, и как деньги, приведшие к его смерти. Более идиоматический вариант вынесен в примечание.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис краток и естественен; «первосвященники» сохраняет традиционно понятный термин, а «цена крови» — выразительность и напряжение оригинала.
