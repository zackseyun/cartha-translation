  text: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς· Τίνα θέλετε ἀπὸ τῶν δύο ἀπολύσω ὑμῖν; οἱ δὲ εἶπαν· ⸀Τὸν Βαραββᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/021.yaml
  text: But the governor answered them, “Which of the two do you want me to release for you?” And they said, “Barabbas.”
translation:
  language: ru
  text: 'Но наместник ответил им: «Кого из двоих вы хотите, чтобы я отпустил вам?» Они сказали: «Варавву».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ … εἶπεν αὐτοῖς
  choice: Но правитель спросил их
  rationale: Греческая конструкция буквально сочетает причастие «ответив» с глаголом «сказал». В данном контексте правитель обращается к толпе с вопросом, поэтому естественное русское «спросил их» передаёт речевой акт без тяжеловесного «ответив, сказал»; δέ отражено союзом «но» как мягкий поворот в повествовании.
- source_word: ὁ ἡγεμών
  choice: правитель
  rationale: В контексте речь идёт о римском наместнике Пилате. «Правитель» — понятное и традиционно уместное обозначение должностного лица; оно не подменяет титул именем.
- source_word: Τίνα … ἀπὸ τῶν δύο
  choice: Кого из этих двоих
  rationale: Τίνα относится к лицу и при выборе между двумя естественно передаётся словом «кого»; указательное «этих» ясно отсылает к двум уже представленным кандидатам и естественно выражает партитивную конструкцию ἀπὸ τῶν δύο.
- source_word: θέλετε
  choice: вы хотите
  rationale: Глагол выражает желание или предпочтение. Современное «хотите» сохраняет прямоту вопроса и не придаёт ему излишне возвышенного оттенка.
- source_word: ἀπολύσω ὑμῖν
  choice: чтобы я отпустил вам
  rationale: В юридическом контексте ἀπολύω означает освободить, отпустить. Конструкция с «чтобы» естественно передаёт первое лицо сослагательного наклонения после θέλετε, а «вам» сохраняет значение дательного ὑμῖν — освобождение по их выбору и в их пользу.
- source_word: οἱ δὲ εἶπαν
  choice: Они ответили
  rationale: Здесь δέ вводит ответ толпы как следующий ход диалога. Русское «ответили» естественно выражает связь с заданным вопросом без ненужного дополнительного союза.
- source_word: Τὸν Βαραββᾶν
  choice: Варавву
  rationale: Имя передано в принятой русской библейской форме «Варавва» и поставлено в винительный падеж, как требует синтаксис ответа на вопрос «кого?».
