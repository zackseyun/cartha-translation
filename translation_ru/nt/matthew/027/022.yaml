id: MAT.27.22
reference: Matthew 27:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Πιλᾶτος· Τί οὖν ποιήσω Ἰησοῦν τὸν λεγόμενον χριστόν; ⸀λέγουσιν πάντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/022.yaml
  text: Pilate said to them[a], “What then should I do with Jesus who is called Messiah?” They all said, “Let him be crucified.”
translation:
  language: ru
  text: 'Пилат спросил их: «Что же мне делать с Иисусом, которого называют Мессией[a]?» Все ответили: «Пусть его распнут!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христом».'
    reason: Альтернативная традиционная передача титула Χριστός.
lexical_decisions:
- source_word: Τί οὖν ποιήσω
  choice: Что же мне делать
  rationale: Аорист конъюнктива в совещательном вопросе естественно передаётся по-русски инфинитивной конструкцией «что мне делать»; частица «же» отражает выводно-связующее значение οὖν.
- source_word: Ἰησοῦν
  choice: с Иисусом
  rationale: Личное имя передано в принятой русской форме; предложно-творительная конструкция естественно выражает объект русского оборота «что делать с…».
- source_word: τὸν λεγόμενον χριστόν
  choice: которого называют Мессией
  rationale: Атрибутивное пассивное причастие передано относительным оборотом, а χριστός — смысловым титулом «Мессия», поскольку здесь это именование Иисуса, а не часть личного имени.
- source_word: λέγουσιν πάντες
  choice: Все ответили
  rationale: Историческое настоящее в русском повествовании естественно передаётся прошедшим временем; «ответили» ясно выражает реплику в диалоге, а «все» сохраняет силу πάντες.
- source_word: Σταυρωθήτω
  choice: Пусть его распнут
  rationale: Конструкция с «пусть» сохраняет повелительную силу третьего лица. Русское неопределённо-личное «распнут» естественно передаёт требование совершить над Иисусом распятие, не называя исполнителей.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В обороте «которого называют…» слово функционирует как титул. «Мессия» непосредственно передаёт его смысл и сохраняет иудейский контекст; традиционное «Христос» дано в сноске как допустимая передача.
translation_notes:
  register: Современный литературный русский язык; речь ясная и естественная, но сохраняет достоинство повествования. Восклицательный знак передаёт категоричность повелительного ответа толпы, не добавляя нового содержания.
