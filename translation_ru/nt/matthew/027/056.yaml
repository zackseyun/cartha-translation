lexical_decisions:
- source_word: ἐν αἷς
  choice: среди них
  rationale: Оборот указывает на женщин, упомянутых в предыдущем стихе; по-русски естественнее всего передать принадлежность к этой группе словами «среди них».
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Мария Магдалина
  rationale: Устоявшаяся и естественная русская форма имени с обозначением происхождения.
- source_word: Μαρία ἡ τοῦ Ἰακώβου καὶ Ἰωσὴφ μήτηρ
  choice: Мария, мать Иакова и Иосифа
  rationale: Приложение ясно передаёт идентификацию Марии через имена её сыновей и сохраняет структуру греческого текста.
- source_word: Ἰωσὴφ
  choice: Иосиф
  rationale: Основной текст SBLGNT читает Ἰωσήφ; вариант имени в других рукописях отмечен в сноске.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: мать сыновей Зеведея
  rationale: Прямая и естественная передача родительных отношений без добавления отсутствующего в греческом имени женщины.
