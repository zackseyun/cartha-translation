  text: among whom were Mary Magdalene[a], and Mary the mother of James and Joseph, and the mother of the sons of Zebedee.
translation:
  language: ru
  text: Среди них были Мария Магдалина, Мария, мать Иакова и Иосифа[a], и мать сыновей Зеведея.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых рукописях — «Иосия».
