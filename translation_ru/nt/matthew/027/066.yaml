  text: οἱ δὲ πορευθέντες ἠσφαλίσαντο τὸν τάφον σφραγίσαντες τὸν λίθον μετὰ τῆς κουστωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/066.yaml
  text: So they went and secured the tomb by sealing the stone with the guard.
translation:
  language: ru
  text: Они пошли и обезопасили гробницу, запечатав камень со стражей.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «запечатав камень вместе со стражей»; возможно также: «запечатали камень и выставили стражу». Греческая фраза кратка и может обозначать совместность или присутствие стражи, а не отдельное действие.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ πορευθέντες
  choice: Они пошли
  rationale: Причастие передано личной формой как сопутствующее действие; δέ служит продолжению повествования и не требует выраженного противопоставления.
- source_word: ἠσφαλίσαντο
  choice: обезопасили
  rationale: Глагол означает сделать объект защищённым, принять меры против вмешательства; «обезопасили» естественно передаёт это в данном контексте.
- source_word: τὸν τάφον
  choice: гробницу
  rationale: Речь идёт о месте погребения Иисуса; «гробница» ясно обозначает сооружение, а не гроб как предмет.
- source_word: σφραγίσαντες
  choice: запечатали
  rationale: Аористное причастие поясняет способ или сопутствующее действие; двоеточие сохраняет эту связь без тяжеловесного деепричастного оборота.
- source_word: τὸν λίθον
  choice: камень
  rationale: Сохранено прямое обозначение камня у входа без добавления отсутствующего в стихе уточнения.
- source_word: μετὰ τῆς κουστωδίας
  choice: при участии стражи
  rationale: μετά с родительным выражает совместность; формулировка указывает на вовлечённость стражи, не уточняя сверх текста, присутствовала ли она при запечатывании или была выставлена как отдельная мера.
theological_decisions:
- issue: Связь μετὰ τῆς κουστωδίας с запечатыванием и охраной гробницы
  choice: Стража участвовала или присутствовала при обеспечении неприкосновенности гробницы.
  alternative: Они запечатали камень и отдельно выставили стражу.
  rationale: Греческая фраза сжата и прямо выражает совместность, но не называет отдельным глаголом выставление стражи. Перевод сохраняет эту неоднозначность и не вводит дополнительную последовательность действий.
translation_notes:
  register: Современный литературный русский язык; лаконичный повествовательный стиль. «Гробница» выбрана вместо двусмысленного «гроб», а «при участии стражи» сохраняет синтаксическую и смысловую компактность оригинала.
