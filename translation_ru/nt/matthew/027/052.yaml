  text: καὶ τὰ μνημεῖα ἀνεῴχθησαν καὶ πολλὰ σώματα τῶν κεκοιμημένων ἁγίων ⸀ἠγέρθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/052.yaml
  text: And the tombs were opened[a], and many bodies of the saints who had fallen asleep were raised,
translation:
  language: ru
  text: И гробницы открылись, и многие тела усопших святых были воскрешены,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Обычный соединительный союз сохраняет последовательную координацию повествования, не приписывая ей более узкого временного значения.
- source_word: τὰ μνημεῖα
  choice: гробницы
  rationale: Слово обозначает места погребения; «гробницы» естественно передаёт смысл и лучше согласуется с тем, что они открылись.
- source_word: ἀνεῴχθησαν
  choice: открылись
  rationale: Греческая пассивная форма передаёт совершившееся открытие; русская возвратная конструкция естественна и не добавляет действующего лица или механизма.
- source_word: πολλὰ σώματα
  choice: многие тела
  rationale: Сохраняет нейтральное значение σῶμα и не вводит более резкого слова «трупы».
- source_word: τῶν κεκοιμημένων
  choice: усопших
  rationale: Причастие буквально связано со сном и здесь является устойчивым обозначением умерших; «усопших» сохраняет этот образ в естественной для русского библейского регистра форме.
- source_word: ἁγίων
  choice: святых
  rationale: Субстантивированное прилагательное обозначает Божьих святых людей без дополнительного уточнения их личности.
- source_word: ἠγέρθησαν
  choice: были воскрешены
  rationale: Пассив ἐγείρω в контексте умерших означает поднятие к жизни; форма «были воскрешены» сохраняет пассивность и не уточняет дальнейшую природу их возвращения к жизни.
theological_decisions:
- issue: Характер события, выраженного ἠγέρθησαν
  choice: были воскрешены
  alternative: восстали; были подняты
  rationale: В русском «были подняты» звучит физически и не передаёт ясно контекст смерти, а «восстали» может представлять форму как активную. «Были воскрешены» точно выражает пассивное возвращение к жизни, не решая вопроса о том, было ли оно окончательным воскресением или временным оживлением.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. «Усопших» сохраняет метафору сна без необходимости в сноске; синтаксический параллелизм двух пассивных событий следует греческому тексту.
