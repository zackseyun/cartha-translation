lexical_decisions:
- source_word: τινὲς δὲ τῶν ἐκεῖ ἑστηκότων
  choice: Некоторые же из стоявших там
  rationale: Сохраняет неопределённую группу, лёгкий повествовательный переход δὲ и наглядное указание на людей, стоявших на месте событий.
- source_word: ἀκούσαντες
  choice: услышав это
  rationale: Деепричастие естественно передаёт предшествующее действие; «это» восполняет подразумеваемый объект — предшествующий возглас Иисуса.
- source_word: ἔλεγον
  choice: говорили
  rationale: Несовершенный вид передаёт длительный либо повторявшийся характер речи, не усиливая его до «твердили».
- source_word: Ἠλίαν φωνεῖ
  choice: зовёт Илию
  rationale: Прямо и естественно передаёт конструкцию с личным дополнением, не уточняя сверх текста, призывает ли он Илию прийти или обращается к нему.
- source_word: οὗτος
  choice: Он
  rationale: В русской прямой речи местоимение звучит естественно; указательная сила οὗτος несущественно ослаблена ради отсутствия искусственного или чрезмерно пренебрежительного оттенка у «этот».
theological_decisions:
- issue: Передаёт ли реплика действительное обращение Иисуса к Илии или восприятие стоявших рядом
  choice: 'Оформить слова как прямую речь наблюдателей: «Он зовёт Илию»'
  alternative: «Этот человек взывает к Илии»
  rationale: Греческий текст сообщает мнение услышавших возглас людей. Перевод не подтверждает их толкование и не объясняет его в основном тексте.
translation_notes:
  register: Современный литературный русский язык; повествование сдержанное и ясное. «Зовёт Илию» сохраняет смысловую открытость глагола φωνεῖ и не добавляет предлога или пояснения, отсутствующего в греческом тексте.
