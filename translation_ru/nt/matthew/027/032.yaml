  text: Ἐξερχόμενοι δὲ εὗρον ἄνθρωπον Κυρηναῖον ὀνόματι Σίμωνα· τοῦτον ἠγγάρευσαν ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/032.yaml
  text: And as they were going out[a], they found a man of Cyrene named Simon[b]. They compelled him to carry his cross.
translation:
  language: ru
  text: Когда они выходили, они встретили человека из Кирены по имени Симон. Его принудили нести крест Иисуса.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его крест»; местоимение относится к Иисусу.'
    reason: Уточнение явной замены местоимения его контекстуальным референтом.
lexical_decisions:
- source_word: Ἐξερχόμενοι δὲ
  choice: Когда они выходили
  rationale: Причастие настоящего времени передаёт одновременное обстоятельство времени; δέ служит мягкой связкой повествования и не требует отдельного выражения по-русски.
- source_word: εὗρον
  choice: встретили
  rationale: В данном повествовательном контексте естественное русское соответствие εὑρίσκω — «встретили»; буквальное «нашли» могло бы ошибочно подразумевать поиски.
- source_word: ἄνθρωπον Κυρηναῖον
  choice: киринеянина
  rationale: Прилагательное Κυρηναῖον указывает на происхождение из Кирены; субстантивированное «киринеянина» кратко и естественно.
- source_word: ὀνόματι Σίμωνα
  choice: по имени Симон
  rationale: Стандартная передача греческого оборота с дательным ὀνόματι.
- source_word: τοῦτον ἠγγάρευσαν
  choice: Его принудили
  rationale: ἀγγαρεύω обозначает властное принуждение к службе или повинности; «принудили» сохраняет принудительный характер действия, а местоимение естественно передаёт τοῦτον.
- source_word: ἵνα ἄρῃ
  choice: нести
  rationale: Оборот ἵνα с конъюнктивом выражает цель; русский инфинитив естественно передаёт её, а «нести» соответствует действию в контексте шествия.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: крест Иисуса
  rationale: Контекст однозначно относит αὐτοῦ к Иисусу. Явное имя устраняет неизбежную для русского выражения «его крест» ложную привязку к ближайшему Симону.
theological_decisions:
- issue: К кому относится αὐτοῦ («его»)
  choice: 'К Иисусу; в тексте: «крест Иисуса»'
  alternative: «его крест» с сохранением формальной местоименной неоднозначности
  rationale: В контексте Симона принуждают нести крест осуждённого Иисуса. Русское «его» после упоминания Симона создало бы существенно более сильную и не предусмотренную контекстом двусмысленность, поэтому референт назван явно; это не вводит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинный. «Киринянин» употреблено как общепонятное обозначение уроженца или жителя Кирены; «принудили» сохраняет оттенок властного принуждения.
