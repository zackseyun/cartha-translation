  source_fidelity: В целом смысл передан точно. Однако ὄχλος — именно собравшаяся «толпа», а не «народ» как этническое или общественное целое. Кроме того, «Смотрите сами» в современном русском прежде всего означает «судите/решайте сами» или «посмотрите сами» и недостаточно передаёт контекстуальное возложение дальнейшего дела на толпу в ὑμεῖς ὄψεσθε.
  naturalness: Деепричастный оборот, «ничего не добивается» и «поднимается волнение» естественны для современного литературного повествования. «Перед толпой» точнее и не менее естественно, чем «перед народом».
  terminology: «Невиновен в этой крови» сохраняет намеренно образный оборот αἵματος τούτου; сноска корректно поясняет идиому, не подтверждая заявление Пилата. «Сами разбирайтесь» естественно передаёт идиоматическое будущее ὄψεσθε («сами смотрите/позаботьтесь об этом»), не превращая его в богословское или юридическое утверждение переводчика.
