  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Πιλᾶτος ὅτι οὐδὲν ὠφελεῖ ἀλλὰ μᾶλλον θόρυβος γίνεται λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας ⸀ἀπέναντι τοῦ ὄχλου λέγων· Ἀθῷός εἰμι ἀπὸ τοῦ ⸀αἵματος τούτου· ὑμεῖς ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/024.yaml
  text: So when Pilate saw that he was gaining nothing[a], but rather that a riot was developing, he took water and washed his hands before the crowd, saying, “I am innocent of this blood[c][b]; you yourselves will see to it.”
translation:
  language: ru
  text: 'Пилат, увидев, что ничего не добивается, а, напротив, поднимается волнение[a], взял воду, вымыл руки перед толпой и сказал: «Я невиновен в этой крови[b]. Сами разбирайтесь[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начинается беспорядок»; возможно также: «начинается мятеж».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «невиновен от этой крови». Речь идёт о непричастности к смерти и об отсутствии ответственности за неё.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Смотрите сами» или «Сами за это отвечайте»; буквально: «Вы сами увидите».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πιλᾶτος
  choice: Пилат, увидев
  rationale: Деепричастная конструкция естественно передаёт аористное причастие и продолжение повествования; δέ здесь не требует обязательного противительного союза.
- source_word: οὐδὲν ὠφελεῖ
  choice: ничего не добивается
  rationale: Передаёт безрезультатность действий Пилата, подразумеваемую греческой безличной формулировкой «ничто не помогает / не приносит пользы».
- source_word: ἀλλὰ μᾶλλον θόρυβος γίνεται
  choice: что, напротив, начинается беспорядок
  rationale: θόρυβος допускает значения «шум, смятение, беспорядок, мятеж»; «беспорядок» сохраняет нарастание общественного волнения, не усиливая его однозначно до полноценного бунта. Настоящее γίνεται передано как развивающееся действие.
- source_word: λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας
  choice: взял воду, вымыл руки
  rationale: Последовательность действий передана естественными русскими глаголами; средний залог отражён возвратным по смыслу действием самого Пилата.
- source_word: ἀπέναντι τοῦ ὄχλου
  choice: перед народом
  rationale: Выражает публичность жеста. «Народ» в данном повествовательном контексте звучит естественнее, чем «толпа», не устраняя значение собравшегося множества.
- source_word: Ἀθῷός εἰμι ἀπὸ τοῦ αἵματος τούτου
  choice: Я невиновен в этой крови
  rationale: Сохранён образный семитизированный оборот греческого текста; «невиновен» ясно передаёт заявление об отсутствии вины и ответственности, не подтверждая его истинность голосом переводчика.
- source_word: ὑμεῖς ὄψεσθε
  choice: Смотрите сами
  rationale: Краткий русский идиоматический оборот передаёт буквальное «вы увидите» и контекстуальное «разбирайтесь / отвечайте сами»; «сами» отражает эмфатическое ὑμεῖς.
theological_decisions:
- issue: Заявление Пилата о невиновности
  choice: 'Оставлено как собственное заявление Пилата: «Я невиновен в этой крови».'
  alternative: «Я не отвечаю за эту кровь» или «Я невиновен в смерти этого человека».
  rationale: 'Прямая речь сохраняет нравственное и повествовательное напряжение: текст сообщает попытку Пилата снять с себя ответственность, но перевод не утверждает, что он действительно невиновен.'
- issue: Перенос ответственности в словах ὑμεῖς ὄψεσθε
  choice: «Смотрите сами».
  alternative: «Отвечайте за это сами» или буквально «Вы увидите».
  rationale: Выбранный оборот сохраняет некоторую неоднозначность между буквальным зрением и идиоматическим распоряжением самим позаботиться о деле, не делая идею юридической ответственности более явной, чем в греческом.
translation_notes:
  register: Современный литературный русский язык, сдержанный и повествовательно ясный. Образ «эта кровь» сохранён ради близости к греческому тексту и его богословско-нравственной напряжённости; пояснение вынесено в сноску.
