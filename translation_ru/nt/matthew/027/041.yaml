base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/041.yaml
  text: Likewise[a], the chief priests also, mocking him with the scribes and elders, were saying,
translation:
  language: ru
  text: 'Так же[a] и первосвященники, насмехаясь вместе с книжниками и старейшинами над Ним, говорили:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Подобным образом и первосвященники, насмехаясь вместе с книжниками и старейшинами над Ним, говорили».'
    reason: 'Лексико-синтаксическая альтернатива: ὁμοίως может быть передано как «подобным образом».'
lexical_decisions:
- source_word: ὁμοίως
  choice: Так же
  rationale: Наречие связывает насмешки религиозных руководителей с предшествующими издевательствами; раздельное написание сохраняет сравнительное значение «таким же образом».
- source_word: καὶ
  choice: и
  rationale: 'Частица имеет добавочное значение: к ранее упомянутым насмешникам присоединяются первосвященники и другие руководители.'
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся русское обозначение представителей высшего священнического руководства; форма множественного числа не означает одновременного существования нескольких действующих первосвященников.
- source_word: ἐμπαίζοντες
  choice: насмехались над Ним
  rationale: Причастие обозначает язвительную насмешку. В русском естественно передать его личной формой при сохранении одновременности с речью; объект «Ним» ясен из контекста.
- source_word: μετὰ τῶν γραμματέων καὶ πρεσβυτέρων
  choice: вместе с книжниками и старейшинами
  rationale: μετά с родительным падежом здесь выражает совместное участие; «вместе с» не сводит присутствие книжников и старейшин к простому наблюдению.
- source_word: γραμματέων
  choice: книжниками
  rationale: Традиционный и точный термин для знатоков и толкователей Писания в евангельском контексте.
- source_word: πρεσβυτέρων
  choice: старейшинами
  rationale: Передаёт статус признанных руководителей народа, а не просто пожилых мужчин.
- source_word: ἔλεγον
  choice: говоря
  rationale: В сочетании с личной формой «насмехались» деепричастие естественно вводит содержание продолжающейся насмешки; двоеточие показывает, что речь следует в следующем стихе.
theological_decisions:
- issue: Кто участвует в насмешке
  choice: Первосвященники, книжники и старейшины представлены совместно насмехающимися над Иисусом.
  alternative: Первосвященники насмехаются лишь в присутствии книжников и старейшин.
  rationale: μετά с родительным падежом естественнее всего указывает здесь на соучастие, хотя греческая конструкция грамматически ставит первосвященников в центр высказывания.
translation_notes:
  register: Современный литературный русский язык с сохранением традиционной библейской терминологии. Формулировка dignified и доступная; синтаксис перестроен естественно для русского, при этом сохранены сравнительное значение ὁμοίως, совместное участие трёх групп и длительный характер насмешки.
