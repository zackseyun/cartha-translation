  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὁ δὲ ἑκατόνταρχος καὶ οἱ μετ’ αὐτοῦ τηροῦντες τὸν Ἰησοῦν ἰδόντες τὸν σεισμὸν καὶ τὰ ⸀γενόμενα ἐφοβήθησαν σφόδρα λέγοντες· Ἀληθῶς ⸂θεοῦ υἱὸς⸃ ἦν οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/054.yaml
  text: When the centurion and those with him who were guarding Jesus saw the earthquake and the things that had happened[a], they were greatly afraid and said[c][b], “Truly this was the Son of God.”
translation:
  language: ru
  text: 'Когда сотник и его спутники, охранявшие Иисуса, увидели землетрясение и всё, что произошло, они очень испугались и сказали: «Поистине, это был Сын Божий[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сыном Бога». В греческом выражение «Сын Божий» употреблено без артикля; в данном контексте основной перевод понимает его как титул, соответствующий тому, как Матфей представляет Иисуса.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἑκατόνταρχος
  choice: сотник
  rationale: Традиционный и понятный русский термин для римского офицера, командовавшего подразделением примерно из ста воинов.
- source_word: τηροῦντες
  choice: охранял
  rationale: В контексте казни глагол означает несение охраны, а не простое наблюдение. Единственное число обусловлено русской конструкцией «те, кто».
- source_word: ἰδόντες
  choice: когда ... увидели
  rationale: Аористное причастие естественно передано придаточным времени, связанным с главным действием.
- source_word: σεισμόν
  choice: землетрясение
  rationale: Прямое и контекстуально уместное значение σεισμός.
- source_word: τὰ γενόμενα
  choice: всё, что произошло
  rationale: Передаёт совокупность случившихся событий и не ограничивает выражение одним землетрясением.
- source_word: ἐφοβήθησαν σφόδρα
  choice: очень испугались
  rationale: Естественно передаёт наступивший сильный страх и усилительное σφόδρα.
- source_word: Ἀληθῶς
  choice: Поистине
  rationale: Сохраняет торжественную уверенность высказывания, не уточняя степень богословского понимания говорящих.
- source_word: θεοῦ υἱὸς
  choice: Сыном Божьим
  rationale: В контексте Евангелия от Матфея выражение естественно воспринимается как титул Иисуса. Отсутствие артикля допускает обсуждение качественного или неопределённого оттенка, поэтому альтернативу вынесено в сноску.
- source_word: οὗτος
  choice: Он
  rationale: В русском прямая реплика с местоимением «Он» звучит естественнее буквального «этот», при этом ясно указывает на Иисуса.
theological_decisions:
- issue: Передача θεοῦ υἱὸς в признании сотника и его спутников
  choice: Сыном Божьим
  alternative: сыном бога
  rationale: Матфеев контекст поддерживает титульное прочтение, однако безартиклевая греческая конструкция формально не исключает неопределённого или качественного понимания. Основной текст следует повествовательной христологии Матфея, а сноска сохраняет подлинную неоднозначность выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным тоном. Синтаксис упрощён без потери состава действующих лиц и последовательности событий; богословская неоднозначность θεοῦ υἱὸς сохранена в сноске.
