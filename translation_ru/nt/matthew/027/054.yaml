  to: 'Когда сотник и его спутники, охранявшие Иисуса, увидели землетрясение и всё, что произошло, они очень испугались и сказали: «Поистине, это был Сын Божий[a]».'
  rationale: Правка сохраняет исходный смысл и неоднозначность безартиклевого θεοῦ υἱός, но делает обозначение группы при сотнике грамматически ясным и естественным по-русски. «Это был» передаёт οὗτος в обычной русской форме. Исправлены пунктуация и написание в сноске.
