  source_fidelity: 'Смысл в целом передан точно: сохранены сотник, находившиеся с ним стражи, землетрясение, совокупность происшедшего, сильный страх и исповедальное высказывание. Однако конструкция «те, кто вместе с ним охранял Иисуса» формально ставит глагол в единственное число и несколько размывает множественного участника греческого причастия τηροῦντες. «Это был» естественно передаёт οὗτος, сохраняя указательность без неестественного русского «этот».'
