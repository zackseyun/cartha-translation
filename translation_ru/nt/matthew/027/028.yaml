  text: καὶ ἐκδύσαντες αὐτὸν ⸂χλαμύδα κοκκίνην περιέθηκαν αὐτῷ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/028.yaml
  text: And after stripping him[a], they put a scarlet cloak on him,
translation:
  language: ru
  text: И, раздев его, они накинули на него алый плащ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «алую мантию». Греческое слово обозначает верхнюю одежду или плащ, нередко короткий военный плащ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδύσαντες
  choice: раздев
  rationale: 'Аористное причастие передаёт действие, предшествующее основному: сначала Иисуса раздели, затем на Него накинули плащ. Краткая деепричастная конструкция естественна по-русски.'
- source_word: χλαμύδα
  choice: плащ
  rationale: χλαμύς обозначает верхнюю одежду, часто короткий плащ, связанный с военными или должностными лицами. «Плащ» точно и естественно передаёт предмет, не усиливая без необходимости царскую символику.
- source_word: κοκκίνην
  choice: алый
  rationale: κόκκινος обозначает яркий красный, алый цвет. «Алый» сохраняет конкретность и выразительность греческого слова.
- source_word: περιέθηκαν αὐτῷ
  choice: накинули на него
  rationale: περιτίθημι с дательным падежом означает поместить или надеть что-либо на человека. «Накинули на него» естественно сочетается с плащом и сохраняет оттенок помещения одежды вокруг тела.
- source_word: καὶ
  choice: И
  rationale: Прямо сохраняет греческую повествовательную связь с предшествующим стихом.
theological_decisions:
- issue: Характер одежды в сцене издевательского облачения
  choice: алый плащ
  alternative: алая мантия
  rationale: «Плащ» сохраняет основное лексическое значение χλαμύς и не привносит более сильных царских ассоциаций, чем допускают само слово и контекст. Возможное «мантия» отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; повествование звучит кратко и достойно. Местоимения, относящиеся к Иисусу, даны со строчной буквы как нейтральная современная орфографическая практика, не добавляющая к исходному тексту конфессионального оформления.
