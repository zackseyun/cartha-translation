lexical_decisions:
- source_word: διαπεράσαντες
  choice: переправившись
  rationale: Аористное причастие обозначает действие, предшествующее основному; русское деепричастие естественно передаёт переправу через водное пространство, не уточняя средство передвижения.
- source_word: ἦλθον
  choice: они прибыли
  rationale: В сочетании с указанием места назначения «прибыли» естественно передаёт завершённое движение и прибытие, выраженное аористом ἔρχομαι.
- source_word: ἐπὶ τὴν γῆν
  choice: к земле
  rationale: Сохраняет значение γῆ «земля, суша» и направительное значение конструкции после плавания, не заменяя его более толковательным «к берегу».
- source_word: εἰς Γεννησαρέτ
  choice: Геннисаретской
  rationale: Передаёт прибытие к суше в области Геннисарета; определительная форма по-русски естественно связывает название местности со словом «земля».
- source_word: Γεννησαρέτ
  choice: Геннисарет
  rationale: Традиционная и узнаваемая русская передача географического названия.
