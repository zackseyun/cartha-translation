base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/031.yaml
  text: Immediately Jesus stretched out his hand[a], took hold of him, and said to him, “You of little faith, why did you doubt?”
translation:
  language: ru
  text: 'Иисус тотчас протянул руку, схватил его и сказал ему: «Маловерный! Почему ты усомнился[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заколебался». Греческий глагол может означать сомнение, колебание или нерешительность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: тотчас
  rationale: Передаёт немедленность действия и сохраняет повествовательную динамику; естественно звучит в современном литературном русском.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Лёгкая переходная связь естественно передаётся последовательностью фразы; отдельное «же» здесь утяжелило бы русский текст.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: протянул руку
  rationale: Естественный русский эквивалент, сохраняющий конкретный образ и последовательность действия.
- source_word: ἐπελάβετο αὐτοῦ
  choice: подхватил его
  rationale: В данном контексте передаёт решительное схватывание человека, начинающего тонуть, не добавляя лишних подробностей.
- source_word: λέγει αὐτῷ
  choice: сказал ему
  rationale: Русское повествование требует естественного прошедшего времени; историческое настоящее греческого текста не создаёт здесь смыслового различия.
- source_word: Ὀλιγόπιστε
  choice: Маловерный
  rationale: Краткое прямое обращение, сохраняющее связь с верой и обозначающее недостаток веры, а не полное неверие.
- source_word: εἰς τί
  choice: почему
  rationale: Естественный современный русский эквивалент вопросительного оборота.
- source_word: ἐδίστασας
  choice: усомнился
  rationale: Передаёт основное значение в контексте, тогда как примечание сохраняет возможный оттенок колебания или нерешительности.
theological_decisions:
- issue: Смысл обращения Ὀλιγόπιστε
  choice: Маловерный
  alternative: У тебя мало веры
  rationale: Сохраняется прямое обращение и акцент на недостаточности веры без усиления до полного неверия.
- issue: Смысл ἐδίστασας
  choice: усомнился
  alternative: заколебался
  rationale: Основной текст использует привычное обозначение сомнения, а примечание сохраняет подлинную лексическую широту греческого глагола.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Реплика звучит непосредственно, без архаического «о» и без конфессионально окрашенных добавлений.
