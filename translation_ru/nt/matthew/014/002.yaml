reference: Matthew 14:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ εἶπεν τοῖς παισὶν αὐτοῦ· Οὗτός ἐστιν Ἰωάννης ὁ βαπτιστής· αὐτὸς ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ διὰ τοῦτο αἱ δυνάμεις ἐνεργοῦσιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/002.yaml
  text: And he said to his servants[a], “This is John the Baptist. He has been raised from the dead, and for this reason these powers are at work in him.”
translation:
  language: ru
  text: 'И сказал своим слугам: «Это Иоанн Креститель. Он был воскрешён из мёртвых, и потому в нём действуют эти силы[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чудодейственные силы»; по смыслу возможно также: «чудеса». Буквально в греческом тексте — «силы»: речь идёт о сверхъестественной силе, проявляющейся в могущественных деяниях.'
    reason: Лексическая альтернатива для αἱ δυνάμεις и пояснение сохранённой неоднозначности.
lexical_decisions:
- source_word: παισὶν
  choice: слугам
  rationale: В данном контексте παῖς обозначает слуг или приближённых Ирода. «Слугам» естественно передаёт социальное отношение, не уточняя придворный ранг.
- source_word: ὁ βαπτιστής
  choice: Креститель
  rationale: Устоявшееся и понятное русское наименование Иоанна, соответствующее его роли совершающего крещение.
- source_word: ἠγέρθη
  choice: был воскрешён
  rationale: Сохранён пассивный залог греческой формы, без подразумеваемого утверждения, что Иоанн воскрес собственной силой.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: из мёртвых
  rationale: Точное и укоренившееся русское соответствие выражению о возвращении к жизни из числа умерших.
- source_word: διὰ τοῦτο
  choice: и потому
  rationale: Передаёт причинно-следственную связь естественным современным русским оборотом.
- source_word: αἱ δυνάμεις
  choice: эти силы
  rationale: «Силы» сохраняет широту значения δύναμεις и не сводит слово исключительно к чудесам как событиям; указательное «эти» естественно отсылает к известиям о деяниях Иисуса в ближайшем контексте.
- source_word: ἐνεργοῦσιν
  choice: действуют
  rationale: Передаёт активное, действенное проявление сил без излишней экспликации.
- source_word: ἐν αὐτῷ
  choice: в нём
  rationale: Сохраняет прямое значение предлога ἐν и образ сил, действующих в человеке; вариант «через него» был бы более толковательным.
theological_decisions:
- issue: Характер возвращения Иоанна к жизни
  choice: Он был воскрешён из мёртвых
  alternative: Он воскрес из мёртвых
  rationale: Пассивная формулировка следует грамматике ἠγέρθη и не разрешает сверх текста вопрос о действующем лице; всё высказывание остаётся мнением Ирода.
- issue: Значение δυνάμεις
  choice: в нём действуют эти силы
  alternative: через него совершаются чудеса
  rationale: Основной текст сохраняет существительное «силы» и локативное «в нём», не превращая проявляемую сверхъестественную силу непосредственно в совершаемые чудеса.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис прост и пригоден для публичного чтения; пассивная конструкция намеренно сохранена ради точности исходной грамматики.
