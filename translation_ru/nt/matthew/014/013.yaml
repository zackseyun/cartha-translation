  text: ⸂Ἀκούσας δὲ⸃ ὁ Ἰησοῦς ἀνεχώρησεν ἐκεῖθεν ἐν πλοίῳ εἰς ἔρημον τόπον κατ’ ἰδίαν· καὶ ἀκούσαντες οἱ ὄχλοι ἠκολούθησαν αὐτῷ πεζῇ ἀπὸ τῶν πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/013.yaml
  text: When Jesus heard this[a], he withdrew from there by boat to a desolate place by himself. But when the crowds heard[b], they followed him on foot from the towns.
translation:
  language: ru
  text: Услышав об этом, Иисус удалился оттуда на лодке в безлюдное место[a], чтобы побыть одному. Но, услышав об этом, толпы последовали за Ним пешком из городов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в пустынное место» или «в уединённое место». Греческое выражение означает необитаемую или удалённую местность, не обязательно песчаную пустыню.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из городков». Греческое слово может обозначать город или городок в зависимости от контекста и масштаба поселения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας δὲ
  choice: Услышав об этом
  rationale: Аористное причастие передаёт предшествующее обстоятельство; δέ обозначает развитие повествования и не требует сильного противительного союза. «Об этом» естественно отсылает к предшествующей вести, не уточняя её заново.
- source_word: ἀνεχώρησεν
  choice: удалился
  rationale: Сохраняет оттенок сознательного ухода в сторону, свойственный ἀναχωρέω, но не приписывает Иисусу не названной в тексте причины.
- source_word: ἐν πλοίῳ
  choice: на лодке
  rationale: Естественно обозначает способ передвижения и соответствует небольшому судну в данном повествовательном контексте.
- source_word: εἰς ἔρημον τόπον
  choice: в безлюдное место
  rationale: ἔρημος здесь означает прежде всего необитаемое, уединённое место, а не обязательно песчаную пустыню.
- source_word: κατ’ ἰδίαν
  choice: чтобы побыть одному
  rationale: Передаёт уединение Иисуса естественным современным русским выражением. Формулировка показывает направленность ухода, не уточняя его более глубокую причину.
- source_word: οἱ ὄχλοι
  choice: толпы людей
  rationale: Сохраняет множественное число и массовый характер группы, избегая архаичного «множества народа».
- source_word: ἠκολούθησαν αὐτῷ
  choice: последовали за Ним
  rationale: Прямо передаёт физическое следование в данном контексте без добавления специального богословского смысла.
- source_word: πεζῇ
  choice: пешком
  rationale: Ясный и идиоматичный эквивалент способа передвижения по суше.
- source_word: ἀπὸ τῶν πόλεων
  choice: из городов
  rationale: πόλις обозначает населённый городской центр и в зависимости от масштаба может соответствовать как городу, так и небольшому городу или городку.
theological_decisions:
- issue: Причина удаления Иисуса
  choice: 'Передать действие нейтрально: «удалился… чтобы побыть одному»'
  alternative: Уточнить, что Он отступил ради безопасности, скорби или молитвы
  rationale: Стих связывает уход Иисуса с услышанной вестью и указывает на уединение, но прямо не называет Его мотив; перевод не должен устранять эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом и сдержанно возвышенным библейским регистром. Местоимение «Ним» написано с прописной буквы согласно распространённой русской библейской традиции; синтаксис остаётся доступным обычному читателю.
