source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης προσῆλθον αὐτῷ οἱ ⸀μαθηταὶ λέγοντες· Ἔρημός ἐστιν ὁ τόπος καὶ ἡ ὥρα ἤδη παρῆλθεν· ἀπόλυσον τοὺς ὄχλους, ἵνα ἀπελθόντες εἰς τὰς κώμας ἀγοράσωσιν ἑαυτοῖς βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/015.yaml
  text: When evening came[a], the disciples came to him and said, “The place is deserted, and the hour is already late. Send the crowds away[b], so that they may go into the villages and buy food for themselves.”
translation:
  language: ru
  text: 'Когда наступил вечер, ученики подошли к Нему и сказали: «Место безлюдное[a], и уже поздно[b]. Отпусти народ, чтобы они пошли в селения и купили себе еды».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Это пустынное место».'
    reason: Лексема ἔρημος может описывать безлюдное, пустынное или удалённое место; вариант отражает более буквальную традиционную формулировку.
  - marker: b
    text: 'Буквально: «час уже прошёл».'
    reason: Основной текст передаёт идиоматический смысл греческого выражения, а примечание сохраняет его буквальный образ.
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: Когда наступил вечер
  rationale: Генитив абсолютный обозначает временной переход; эта формулировка естественна для современного русского повествования. Частица δέ не требует отдельного вводного слова.
- source_word: προσῆλθον αὐτῷ
  choice: подошли к Нему
  rationale: Передаёт обычное контекстуальное значение προσέρχομαι — приблизиться, подойти к кому-либо.
- source_word: οἱ μαθηταὶ
  choice: ученики
  rationale: Определённость известной группы ясна из контекста; притяжательное «Его» в греческом тексте отсутствует.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: Место здесь безлюдное
  rationale: ἔρημος указывает на отсутствие населения и поселений поблизости; «безлюдное» не создаёт лишнего представления о песчаной пустыне. «Здесь» естественно передаёт ситуативный смысл ὁ τόπος, не меняя содержания.
- source_word: ἡ ὥρα ἤδη παρῆλθεν
  choice: уже поздно
  rationale: Буквально выражение означает «час уже прошёл», но в данном контексте это идиоматическое указание на позднее время.
- source_word: ἀπόλυσον τοὺς ὄχλους
  choice: Отпусти людей
  rationale: ἀπολύω здесь означает отпустить или распустить собравшихся. Русское «людей» естественно обозначает собравшийся народ и не вносит отрицательной окраски, возможной у слова «толпы».
- source_word: ἵνα ἀπελθόντες
  choice: чтобы они пошли
  rationale: Причастие в целевой конструкции естественно развёрнуто по-русски в личную форму без потери последовательности предполагаемых действий.
- source_word: εἰς τὰς κώμας
  choice: по селениям
  rationale: κώμη означает небольшое поселение или селение; множественное число сохранено. Предлог «по» естественно выражает поиск пищи в окрестных селениях, не добавляя слова «ближайшим», которого нет в оригинале.
- source_word: ἀγοράσωσιν ἑαυτοῖς βρώματα
  choice: купили себе еды
  rationale: Сохраняет значение покупки пищи для себя и звучит естественно в современной русской речи.
