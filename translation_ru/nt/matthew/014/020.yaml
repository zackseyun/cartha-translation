  text: And they all ate and were satisfied[a], and they picked up twelve full baskets of the leftover pieces.
translation:
  language: ru
  text: Все ели и насытились, а затем собрали двенадцать полных корзин оставшихся кусков.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: ели
  rationale: Аорист в повествовательной последовательности естественно передаётся русским прошедшим временем; несовершенный вид в сочетании «ели и насытились» идиоматичен и описывает трапезу как процесс.
- source_word: πάντες
  choice: все
  rationale: Сохраняет всеобщий охват и не требует добавлять явно подразумеваемое местоимение.
- source_word: ἐχορτάσθησαν
  choice: насытились
  rationale: Естественно передаёт полное утоление голода и соответствует пассивному по форме греческому глаголу без тяжеловесного русского пассива.
- source_word: ἦραν
  choice: собрали
  rationale: В контексте оставшейся пищи αἴρω означает подобрать и собрать; это естественнее буквального «подняли».
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: оставшиеся куски
  rationale: Передаёт то, что осталось в избытке от разломанных кусков, без неестественной конструкции «остаток кусков».
- source_word: δώδεκα κοφίνους πλήρεις
  choice: двенадцать полных корзин
  rationale: Сохраняет число, предмет и указание на наполненность корзин в естественном русском порядке слов.
theological_decisions:
- issue: Описание результата чудесного насыщения
  choice: насытились
  alternative: наелись досыта
  rationale: «Насытились» точно и достойно передаёт полную сытость, не добавляя богословского толкования и не ослабляя масштаб чуда.
translation_notes:
  register: Современный литературный русский; краткая повествовательная фраза. Тире подчёркивает итог сбора и позволяет естественно передать предикативное πλήρεις без добавления отсутствующего в греческом глагола.
