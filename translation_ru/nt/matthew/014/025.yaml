  text: τετάρτῃ δὲ φυλακῇ τῆς νυκτὸς ⸀ἦλθεν πρὸς ⸀αὐτοὺς περιπατῶν ἐπὶ ⸂τὴν θάλασσαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/025.yaml
  text: And in the fourth watch of the night he came to them[b][a], walking on the sea.
translation:
  language: ru
  text: А в четвёртую стражу ночи[b] Он пришёл к ним, идя по морю.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «идя по поверхности моря». Иногда выражение понимают как «идя у моря», однако контекст убедительно указывает на движение по самой воде.'
    reason: alternative_reading
  - marker: b
    text: «Четвёртая стража ночи» — последняя ночная стража, приблизительно с трёх до шести часов утра по римской системе.
    reason: cultural_note
lexical_decisions:
- source_word: τετάρτῃ ... φυλακῇ τῆς νυκτός
  choice: в четвёртую стражу ночи
  rationale: Дательный падеж обозначает время действия. «Стража» сохраняет историческое деление ночи и в русском библейском повествовании звучит понятно и достойно.
- source_word: δὲ
  choice: А
  rationale: Здесь δέ — лёгкая повествовательная связка; «А» естественно продолжает рассказ, не придавая союзу излишне сильного значения.
- source_word: ἦλθεν πρὸς αὐτούς
  choice: Он пришёл к ним
  rationale: Сочетание ἔρχομαι с πρός и винительным падежом выражает движение к ученикам; «пришёл к ним» прямо и естественно передаёт эту направленность.
- source_word: περιπατῶν
  choice: идя
  rationale: Причастие настоящего времени обозначает действие, одновременное с основным. Деепричастие «идя» естественнее по-русски, чем буквальное «шагая» или более тяжёлое «к ним, проходя».
- source_word: ἐπὶ τὴν θάλασσαν
  choice: по морю
  rationale: При глаголе движения ἐπί с винительным обозначает передвижение по поверхности. Русское «идя по морю» ясно передаёт движение по воде и сохраняет θάλασσα как «море», не заменяя его географическим уточнением «озеро».
theological_decisions:
- issue: Чудесное передвижение Иисуса по воде
  choice: идя по морю
  alternative: идя у моря / вдоль моря
  rationale: Синтаксис и ближайший контекст указывают на движение по поверхности воды, а не вдоль берега. Перевод сохраняет прямой смысл греческого текста, не ослабляя и не усиливая его чудесный характер.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Прописное «Он» употреблено как русская издательская конвенция для ясного указания на Иисуса, без добавления нового смыслового содержания. Слово «стража» оставлено в основном тексте ради исторической точности и объяснено в сноске.
