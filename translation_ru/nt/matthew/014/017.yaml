  source_fidelity: «Они же сказали Ему» верно передаёт οἱ δὲ λέγουσιν αὐτῷ, включая слабое связующее/контрастивное δέ и историческое настоящее в естественном русском прошедшем времени. «У нас здесь только пять хлебов и две рыбы» точно передаёт отрицательно-исключительную конструкцию οὐκ ἔχομεν ὧδε εἰ μὴ без смысловой потери.
