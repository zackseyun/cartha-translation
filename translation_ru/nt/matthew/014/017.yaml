  text: οἱ δὲ λέγουσιν αὐτῷ· Οὐκ ἔχομεν ὧδε εἰ μὴ πέντε ἄρτους καὶ δύο ἰχθύας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/017.yaml
  text: But they said to him[a], “We have nothing here except five loaves and two fish.”
translation:
  language: ru
  text: 'Они же сказали Ему: «У нас здесь только пять хлебов и две рыбы».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «У нас здесь нет ничего, кроме пяти хлебов и двух рыб».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Они же
  rationale: Артикль указывает на ранее названных учеников, а δέ выражает лёгкое противопоставление предыдущему повелению Иисуса; «же» естественно передаёт эту связь.
- source_word: λέγουσιν αὐτῷ
  choice: сказали Ему
  rationale: Греческое историческое настоящее в русском повествовании естественно передаётся прошедшим временем; местоимение относится к Иисусу.
- source_word: Οὐκ ἔχομεν ὧδε εἰ μὴ
  choice: У нас здесь только
  rationale: После отрицания εἰ μή имеет исключительное значение. Положительная русская конструкция с «только» ясно и естественно передаёт общий смысл выражения.
- source_word: πέντε ἄρτους
  choice: пять хлебов
  rationale: ἄρτος обозначает хлеб или отдельную хлебную лепёшку/буханку; традиционное и понятное русское «пять хлебов» сохраняет счётность исходного выражения без излишней конкретизации формы.
- source_word: δύο ἰχθύας
  choice: две рыбы
  rationale: ἰχθύας — множественное число слова «рыба»; русская форма после числительного естественна и точна.
