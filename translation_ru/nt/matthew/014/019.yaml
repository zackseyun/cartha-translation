  text: καὶ κελεύσας τοὺς ὄχλους ἀνακλιθῆναι ἐπὶ ⸂τοῦ χόρτου⸃, λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας, ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κλάσας ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους οἱ δὲ μαθηταὶ τοῖς ὄχλοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/019.yaml
  text: And after ordering the crowds to recline on the grass[a], he took the five loaves and the two fish, looked up to heaven, blessed, and after breaking the loaves he gave them to the disciples, and the disciples to the crowds.
translation:
  language: ru
  text: И, велев собравшимся людям расположиться на траве, Он взял пять хлебов и две рыбы, поднял взгляд к небу, благословил[a], разломил хлебы и дал их ученикам, а ученики — собравшимся людям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «произнёс благословение». В греческом тексте объект глагола «благословил» не указан; возможно также, что подразумевается: «благословил Бога» или «благословил хлебы и рыбу».'
    reason: alternative_reading
lexical_decisions:
- source_word: κελεύσας
  choice: велев
  rationale: Деепричастная конструкция естественно передаёт предшествующее главному действию распоряжение и сохраняет его властный характер.
- source_word: τοὺς ὄχλους
  choice: народу
  rationale: В данном эпизоде собирательное «народ» звучит естественнее буквального множественного «толпам», при этом обозначает собравшихся людей.
- source_word: ἀνακλιθῆναι
  choice: расположиться
  rationale: Глагол указывает на принятую при трапезе позу полулёжа; «расположиться» передаёт эту обстановку без неестественного для современного русского «возлечь».
- source_word: ἐπὶ τοῦ χόρτου
  choice: на траве
  rationale: Прямо передаёт место и не добавляет отсутствующего у Матфея определения «зелёной».
- source_word: τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας
  choice: пять хлебов и две рыбы
  rationale: «Хлебы» сохраняет счётность отдельных хлебных лепёшек или буханок и традиционно понятно в контексте; «две рыбы» прямо передаёт множественное число.
- source_word: ἀναβλέψας εἰς τὸν οὐρανόν
  choice: посмотрел на небо
  rationale: Естественная современная передача движения взгляда вверх, к небу.
- source_word: εὐλόγησεν
  choice: произнёс благословение
  rationale: Греческий глагол не называет объекта. Такая формулировка не приписывает благословение ни пище, ни Богу и естественно описывает молитвенное действие перед трапезой.
- source_word: κλάσας
  choice: затем разломил хлебы
  rationale: Передаёт действие, предшествующее раздаче; объект восстанавливается из ближайшего контекста.
- source_word: ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους
  choice: дал их ученикам
  rationale: Местоимение ясно относится к разломленным хлебам и устраняет тяжёлый повтор.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: а ученики — народу
  rationale: 'Тире естественно сохраняет греческий эллипсис: глагол «дали» подразумевается из предыдущей части.'
theological_decisions:
- issue: Неуказанный объект εὐλόγησεν
  choice: произнёс благословение
  alternative: благословил пищу / благословил Бога
  rationale: В греческом тексте после «благословил» нет выраженного объекта. Основной текст сохраняет эту неопределённость, а примечание сообщает обе основные возможности, не разрешая богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Избегаются архаизмы «возлечь» и «воззреть», но сохраняется конкретное «хлебы». Местоимение «Он» написано с прописной буквы как устойчивое русское оформление обращения к Иисусу, без добавления толкования.
