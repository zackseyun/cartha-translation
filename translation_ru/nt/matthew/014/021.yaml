base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/021.yaml
  text: Those who ate were about five thousand men[a], besides women and children.
translation:
  language: ru
  text: Тех, кто ел, было около пяти тысяч мужчин, не считая женщин и детей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: Евших
  rationale: Субстантивированное причастие настоящего времени обозначает тех, кто ел. Русское «евших» естественно передаёт эту группу без излишнего уточнения вида; лёгкое повествовательное δέ отдельно не выражено, поскольку по-русски здесь связка была бы ненужной.
- source_word: ἦσαν
  choice: было
  rationale: Имперфект εἰμί входит в простое сообщение о численности; безлично-количественная русская конструкция «было около пяти тысяч» звучит естественно.
- source_word: ἄνδρες
  choice: мужчин
  rationale: ἀνήρ здесь означает лиц мужского пола, а не людей вообще, что подтверждается отдельным упоминанием женщин и детей.
- source_word: ὡσεὶ
  choice: около
  rationale: Передаёт приблизительность числа ясно и естественно для современного русского языка.
- source_word: πεντακισχίλιοι
  choice: пяти тысяч
  rationale: Прямое обозначение количества с требуемой русской падежной формой после «около».
- source_word: χωρὶς
  choice: не считая
  rationale: Предлог с родительным падежом указывает, что женщины и дети не включены в названное число; «не считая» делает это недвусмысленным и естественным по-русски.
- source_word: γυναικῶν
  choice: женщин
  rationale: В данном контексте γυνή означает женщин, а не жён, поскольку брачные отношения не подразумеваются.
- source_word: παιδίων
  choice: детей
  rationale: Естественный русский эквивалент παιδίον во множественном числе без неоправданного сужения до малолетних детей.
theological_decisions:
- issue: Гендерно-конкретное обозначение при подсчёте смешанной толпы
  choice: Передать ἄνδρες как «мужчин» и сохранить указание, что женщины и дети в число не входили.
  alternative: Передать как «людей» или «человек».
  rationale: Греческий текст конкретно называет мужчин и затем отдельно упоминает женщин и детей. Обобщение «людей» стёрло бы значимую деталь исходного текста.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная повествовательная формулировка. Конструкция «Евших было…» сохраняет акцент исходного предложения на числе участников трапезы.
