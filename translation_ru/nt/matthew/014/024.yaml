base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/024.yaml
  text: But the boat was already many stadia from the land[a], being battered by the waves[c][b], for the wind was against it.
translation:
  language: ru
  text: А лодка была уже на много стадиев[a] от берега, и её били волны, потому что дул встречный ветер.
  philosophy: optimal-equivalence
