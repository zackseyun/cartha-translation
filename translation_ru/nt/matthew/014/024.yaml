lexical_decisions:
- source_word: πλοῖον
  choice: лодка
  rationale: В контексте переправы по Галилейскому озеру современное русское «лодка» естественно передаёт судно, не создавая впечатления большого корабля.
- source_word: ἤδη
  choice: уже
  rationale: 'Прямо передаёт временной оттенок: к этому моменту лодка уже находилась далеко от берега.'
- source_word: σταδίους πολλοὺς
  choice: во многих стадиях
  rationale: Сохранена древняя мера расстояния, как в греческом тексте; её значение поясняется в сноске.
- source_word: ἀπὸ τῆς γῆς
  choice: от берега
  rationale: Хотя буквально γῆ означает «земля, суша», в данном водном контексте русское «берег» точно и естественно выражает пространственное противопоставление.
- source_word: ἀπεῖχεν
  choice: была… от
  rationale: Русская конструкция с указанием расстояния естественно передаёт пространственное значение глагола ἀπέχω.
- source_word: βασανιζόμενον ὑπὸ τῶν κυμάτων
  choice: волны били её
  rationale: Причастие βασανιζόμενον буквально выражает мучительное, тяжёлое воздействие; в морском контексте эта активная конструкция ясно передаёт, что лодку с силой ударяли волны.
- source_word: ἐναντίος
  choice: встречный
  rationale: О ветре «встречный» — точный и идиоматичный русский эквивалент со значением направленного против движения.
- source_word: δὲ
  choice: А
  rationale: Передаёт мягкий переход и контраст между Иисусом на суше и положением лодки без чрезмерно резкого противопоставления.
- source_word: γάρ
  choice: потому что
  rationale: 'Ясно передаёт причинно-пояснительную связь: волны били лодку из-за встречного ветра.'
theological_decisions: []
