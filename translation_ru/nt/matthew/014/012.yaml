  text: καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ἦραν τὸ ⸀πτῶμα καὶ ἔθαψαν ⸀αὐτόν, καὶ ἐλθόντες ἀπήγγειλαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/012.yaml
  text: And his disciples came[a], took the body, and buried him; then they went and reported it to Jesus.
translation:
  language: ru
  text: Его ученики пришли, взяли тело[a] и похоронили его, а затем пришли к Иисусу и сообщили ему об этом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «труп». Греческое слово обозначает мёртвое тело.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: пришли
  rationale: Причастие от προσέρχομαι вводит действие учеников после смерти Иоанна. «Пришли» естественно передаёт приближение в данном контексте, не придавая повествованию излишне формального оттенка.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: его ученики
  rationale: Сохранён обычный новозаветный термин «ученики» и местоименная форма оригинала. По ближайшему контексту речь идёт об учениках Иоанна Крестителя.
- source_word: ἦραν
  choice: забрали
  rationale: Глагол αἴρω может означать «поднять», «взять», «унести». В контексте погребения «забрали» естественно выражает, что ученики взяли тело, чтобы похоронить его, не добавляя способ переноски.
- source_word: πτῶμα
  choice: тело
  rationale: Слово обозначает мёртвое тело. В русском повествовании «тело» звучит естественно и достойно; более резкое «труп» указано в примечании как лексическая альтернатива.
- source_word: ἔθαψαν αὐτόν
  choice: похоронили его
  rationale: Прямо передаёт значение θάπτω, не добавляя отсутствующей в стихе подробности о гробнице.
- source_word: ἐλθόντες
  choice: а затем пошли
  rationale: Причастие обозначает следующее действие и движение к Иисусу. Русская личная форма делает последовательность событий естественной.
- source_word: ἀπήγγειλαν
  choice: сообщили об этом
  rationale: Глагол означает «сообщить, известить». Местоимение «об этом» естественно обозначает подразумеваемое содержание сообщения — случившееся с Иоанном.
- source_word: τῷ Ἰησοῦ
  choice: Иисусу
  rationale: Использована традиционная и общепринятая русская форма имени Ἰησοῦς.
theological_decisions:
- issue: Кого обозначает выражение «его ученики»
  choice: Формулировка «его ученики» сохранена; в контексте это ученики Иоанна Крестителя.
  alternative: Явно сказать «ученики Иоанна».
  rationale: Ближайший контекст однозначно указывает на Иоанна, однако местоименная формулировка точнее сохраняет структуру греческого текста и не вносит пояснение непосредственно в основной текст.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное. «Тело» предпочтено более резкому «труп», а последовательность греческих причастий передана естественными личными формами.
