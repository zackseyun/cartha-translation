lexical_decisions:
- source_word: γενεσίοις δὲ γενομένοις τοῦ Ἡρῴδου
  choice: Когда же праздновали день рождения Ирода
  rationale: Оборот обозначает наступившее празднование дня рождения. Русская безличная конструкция естественно передаёт обстоятельство времени и событийный характер выражения; «же» сохраняет повествовательный переход δέ.
- source_word: ὠρχήσατο
  choice: танцевала
  rationale: Глагол прямо означает исполнение танца; несовершенный вид естественен по-русски для действия, на фоне которого сообщается его результат.
- source_word: ἡ θυγάτηρ τῆς Ἡρῳδιάδος
  choice: дочь Иродиады
  rationale: Точно передаёт родительную связь, не добавляя отсутствующего в тексте имени дочери.
- source_word: ἐν τῷ μέσῳ
  choice: посреди гостей
  rationale: Буквально «посреди / в середине». Добавление «гостей» ясно выражает наиболее вероятную сценическую ситуацию, а сноска сохраняет буквальную возможность.
- source_word: ἤρεσεν τῷ Ἡρῴδῃ
  choice: понравилась Ироду
  rationale: Естественная современная русская передача ἀρέσκω с дательным падежом без дополнительной оценки характера танца.
- source_word: Ἡρῴδου / Ἡρῴδῃ
  choice: Ирод / Ироду
  rationale: Устоявшаяся русская форма библейского имени с требуемым падежным оформлением.
