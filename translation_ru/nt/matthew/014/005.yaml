  text: καὶ θέλων αὐτὸν ἀποκτεῖναι ἐφοβήθη τὸν ὄχλον, ὅτι ὡς προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/005.yaml
  text: And wanting to kill him[a], he feared the crowd[b], because they regarded him as a prophet.
translation:
  language: ru
  text: И хотя он хотел убить его[a], он боялся толпы, потому что люди считали его пророком.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «желая убить его, он боялся толпы»; в контексте причастие можно понимать уступительно: «хотя он хотел убить его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: хотя он хотел
  rationale: Причастие выражает сопутствующее желание, которое в контексте противопоставлено страху перед народом; уступительная передача естественно раскрывает связь частей фразы, не устраняя формальную альтернативу, отмеченную в сноске.
- source_word: ἀποκτεῖναι
  choice: убить
  rationale: Прямое современное соответствие инфинитиву; «казнить» добавило бы юридический оттенок, а «убить как преступление» — не выраженную самим глаголом нравственно-правовую оценку.
- source_word: ἐφοβήθη
  choice: боялся
  rationale: Естественная русская передача φοβέομαι с винительным дополнением; несовершенный вид уместно описывает состояние, препятствовавшее намерению.
- source_word: τὸν ὄχλον
  choice: народа
  rationale: В данном общественном контексте «народ» звучит естественнее, чем «толпа», и обозначает собравшихся людей как группу, реакции которой опасались.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит причину страха и прямо передаётся причинной конструкцией.
- source_word: ὡς προφήτην
  choice: пророком
  rationale: Творительный падеж после «считать» естественно передаёт оценку Иоанна как пророка, не предполагая лишь внешнего сходства.
- source_word: αὐτὸν εἶχον
  choice: люди считали его
  rationale: Оборот ἔχω с предикативным винительным означает «считать, принимать за». Слово «люди» ясно выражает подразумеваемое множественное подлежащее, относящееся к собирательному «народ».
theological_decisions:
- issue: Не названные в стихе субъект и объект, определяемые по контексту
  choice: Сохранить местоимения «он» и «его»
  alternative: Назвать Ирода и Иоанна
  rationale: Греческий текст употребляет местоимения, а личности ясны из ближайшего контекста. Сохранение местоимений не вносит в стих пояснений сверх источника.
- issue: Смысловая связь причастия θέλων с глаголом ἐφοβήθη
  choice: 'Передать уступительно: «хотя он хотел»'
  alternative: 'Формально: «желая убить его, он боялся народа»'
  rationale: Контекст показывает напряжение между желанием убить и страхом перед народом. Уступительная конструкция ясно и естественно передаёт эту связь; более буквальная синтаксическая возможность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Сохранены местоимения оригинала и напряжение между желанием Ирода и его страхом; «народ» выбрано как естественное контекстуальное соответствие ὄχλος.
