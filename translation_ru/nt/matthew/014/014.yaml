base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/014.yaml
  text: And when he went ashore[a], he saw a large crowd[b], and he had compassion on them and healed their sick.
translation:
  language: ru
  text: Выйдя на берег[a], Иисус увидел большую толпу. Он проникся к ним состраданием и исцелил тех из них, кто был болен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «выйдя». По контексту речь, вероятно, идёт о том, что Иисус вышел из лодки на берег.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: выйдя на берег
  rationale: Причастие буквально означает «выйдя», однако в контексте прибытия Иисуса на лодке естественное русское выражение «выйдя на берег» ясно передаёт подразумеваемое действие.
- source_word: εἶδεν
  choice: увидел
  rationale: Прямое и естественное соответствие аористу глагола ὁράω.
- source_word: πολὺν ὄχλον
  choice: большую толпу
  rationale: Передаёт количественное значение πολύς и обычное значение ὄχλος современным литературным русским языком.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοῖς
  choice: сжалился над людьми
  rationale: Глагол выражает глубокое сострадание. «Сжалился» естественно и ёмко передаёт как внутреннее чувство, так и милосердный отклик; «над людьми» устраняет в русском неясность местоимения после упоминания толпы.
- source_word: ἐθεράπευσεν
  choice: исцелил
  rationale: В данном контексте θεραπεύω обозначает физическое исцеление; «исцелил» является точным и привычным библейским выражением без архаичности.
- source_word: τοὺς ἀρρώστους αὐτῶν
  choice: тех из них, кто был болен
  rationale: 'Развёрнутая формулировка естественнее русского субстантивированного «их больных» и сохраняет смысл: больные люди из этой толпы.'
theological_decisions:
- issue: Передача эмоционального отклика Иисуса
  choice: Он сжалился над людьми
  alternative: Он проникся к ним состраданием
  rationale: Выбранная формулировка сохраняет глубокое милосердие, выраженное σπλαγχνίζομαι, и его связь с последующим исцелением, не усиливая и не ослабляя богословский акцент текста.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Имя «Иисус» употреблено вместо местоимения в начале отдельного стиха для естественной референции; второе предложение избегает перегруженной цепочки союзов и сохраняет причинно-смысловую последовательность греческого текста.
