  text: Ὁ γὰρ Ἡρῴδης κρατήσας τὸν Ἰωάννην ἔδησεν ⸀αὐτὸν καὶ ⸂ἐν φυλακῇ ἀπέθετο⸃ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/003.yaml
  text: For Herod had arrested John[a], bound him, and put him in prison because of Herodias, the wife of Philip his brother,
translation:
  language: ru
  text: Ведь Ирод схватил Иоанна[a], связал его и заключил в темницу из-за Иродиады, жены своего брата Филиппа,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «схватив Иоанна… поместил его в темницу».'
    reason: 'Лексико-синтаксическая альтернатива для κρατήσας и ἐν φυλακῇ ἀπέθετο: сохраняет форму деепричастного оборота и более буквальное значение «схватив».'
lexical_decisions:
- source_word: γὰρ
  choice: Ведь
  rationale: Передаёт пояснительную связь с предыдущим стихом и естественно вводит предысторию событий.
- source_word: κρατήσας
  choice: схватил
  rationale: Передаёт решительное взятие Иоанна под стражу, не сводя значение исключительно к юридически оформленному аресту.
- source_word: ἔδησεν
  choice: связал
  rationale: Сохраняет конкретное значение глагола δέω, не уточняя без основания, были ли использованы цепи или иные узы.
- source_word: ἐν φυλακῇ ἀπέθετο
  choice: заключил в темницу
  rationale: Естественно и ясно передаёт помещение под стражу; «темница» поддерживает достоинство библейского повествовательного регистра, оставаясь понятным современному читателю.
- source_word: διὰ Ἡρῳδιάδα
  choice: из-за Иродиады
  rationale: Передаёт причинное значение διά с винительным падежом без добавления мотива, прямо не указанного в стихе.
- source_word: τὴν γυναῖκα
  choice: жены
  rationale: В данном родственном обозначении γυνή означает супругу.
- source_word: Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: своего брата Филиппа
  rationale: Ясно указывает, что Филипп был братом Ирода, и естественно воспроизводит приложение исходного текста.
theological_decisions:
- issue: Историко-нравственная характеристика отношений Иродиады и Филиппа
  choice: «Иродиады, жены своего брата Филиппа» без добавочной оценки
  alternative: «Иродиады, жены брата его Филиппа» или формулировка с явным указанием на незаконность союза
  rationale: Этот стих лишь определяет Иродиаду через её супружескую связь с Филиппом; нравственная оценка прямо появляется в следующем стихе, поэтому её не следует предварять переводческой вставкой.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным регистром. «Ведь» естественно связывает стих с предшествующим рассказом; «темница» выбрана как понятное и достойное контекста слово. Конечная запятая сохранена, поскольку предложение продолжается в следующем стихе.
