  text: ὁ δὲ εἶπεν· Ἐλθέ. καὶ καταβὰς ἀπὸ τοῦ ⸀πλοίου Πέτρος περιεπάτησεν ἐπὶ τὰ ὕδατα ⸂καὶ ἦλθεν⸃ πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/029.yaml
  text: And he said[a], “Come.” So Peter got down from the boat, walked on the water, and came toward Jesus.
translation:
  language: ru
  text: 'Он сказал: «Иди». Пётр сошёл с лодки и, идя по воде, направился к Иисусу.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθέ
  choice: Иди
  rationale: Аористный императив ἔρχομαι выражает краткий прямой призыв. В данном контексте естественное русское «Иди» передаёт повеление Петру двигаться к Иисусу; «Подойди» могло бы сильнее предполагать достижение цели.
- source_word: καταβὰς ἀπὸ τοῦ πλοίου
  choice: вышел из лодки
  rationale: Причастие καταβάς буквально указывает на движение вниз, прочь от лодки. Русское «вышел из лодки» естественно описывает действие, не перегружая фразу буквальным «спустившись».
- source_word: πλοίου
  choice: лодки
  rationale: В галилейском повествовательном контексте πλοῖον уместно передать современным словом «лодка», а не более крупным и книжным «корабль».
- source_word: περιεπάτησεν
  choice: пошёл
  rationale: Здесь περιπατέω означает идти пешком. Глагол «пошёл» естественно передаёт начало и развитие движения после выхода из лодки, не добавляя отдельной видовой фазы, отсутствующей в греческом.
- source_word: ἐπὶ τὰ ὕδατα
  choice: по воде
  rationale: Русское устойчивое выражение «идти по воде» естественно передаёт движение по её поверхности; множественное число греческого ὕδατα в русском здесь не требуется.
- source_word: καὶ ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: и направился к Иисусу
  rationale: Сочетание ἦλθεν с πρός обозначает движение в сторону Иисуса, не обязательно утверждая, что Пётр уже достиг его. «Направился к» сохраняет эту направленность и естественно звучит по-русски.
- source_word: δὲ
  choice: не выражено отдельным союзом
  rationale: Частица δέ служит мягкой повествовательной связкой. В русском после прямого продолжения диалога отдельное «и» или «тогда» необязательно и могло бы утяжелить начало стиха.
theological_decisions:
- issue: Характер движения Петра к Иисусу
  choice: направился к Иисусу
  alternative: подошёл к Иисусу
  rationale: Греческое πρός выражает направленность движения и само по себе не требует понимать действие как завершённое прибытием. Выбранная формулировка сохраняет повествовательное напряжение и не вводит более определённый итог.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная повествовательная фраза. Синтаксис причастного оборота преобразован в последовательность личных глаголов ради естественности, при сохранении порядка событий.
