lexical_decisions:
- source_word: ἐπιγνόντες αὐτὸν οἱ ἄνδρες τοῦ τόπου ἐκείνου
  choice: жители той местности узнали Его
  rationale: ἐπιγινώσκω в данном повествовательном контексте означает узнать Иисуса. Хотя ἄνδρες буквально значит «мужчины», здесь они выступают как представители местного населения; «жители» естественно передаёт смысл выражения без тяжеловесности.
- source_word: ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην
  choice: разослали весть по всей округе
  rationale: У ἀπέστειλαν в греческом тексте не выражено дополнение. По контексту подразумевается рассылка вести или посланников; русский оборот «разослали весть» ясно и естественно передаёт подразумеваемое сообщение. περίχωρος — окружающая местность, то есть «округа».
- source_word: προσήνεγκαν αὐτῷ
  choice: К Нему принесли
  rationale: В данном контексте προσφέρω означает доставить людей к Иисусу, а не совершить приношение.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: всех больных
  rationale: κακῶς ἔχειν — устойчивое выражение со значением «быть больным, нездоровым»; «всех больных» кратко и естественно передаёт его смысл.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; ясный, повествовательный и достойный стиль. Длинная греческая конструкция разделена на два предложения ради естественного русского синтаксиса. Заглавные местоимения при указании на Иисуса сохранены как принятая в русском библейском стиле форма.
