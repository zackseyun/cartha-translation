  text: καὶ ⸀ἀναβάντων αὐτῶν εἰς τὸ πλοῖον ἐκόπασεν ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/032.yaml
  text: And when they got into the boat[a], the wind ceased.
translation:
  language: ru
  text: И когда они вошли в лодку[a], ветер стих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «когда они поднялись в лодку».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет простую повествовательную связь с предыдущим событием, не добавляя более узкого временного значения слова «тогда».
- source_word: ἀναβάντων αὐτῶν εἰς τὸ πλοῖον
  choice: когда они вошли в лодку
  rationale: Родительный самостоятельный оборот естественно передан придаточным времени. Хотя ἀναβαίνω буквально означает движение вверх, в сочетании с εἰς τὸ πλοῖον по-русски естественно сказать «вошли в лодку».
- source_word: πλοῖον
  choice: лодку
  rationale: В данном евангельском контексте речь идёт о сравнительно небольшом судне на Галилейском море; современное «лодка» точнее и естественнее, чем «корабль».
- source_word: ἐκόπασεν
  choice: стих
  rationale: Кратко и идиоматично передаёт прекращение или утихание ветра, не привнося образ постепенного процесса.
- source_word: ὁ ἄνεμος
  choice: ветер
  rationale: Прямое соответствие греческому подлежащему; русский язык не требует отдельной передачи артикля.
theological_decisions:
- issue: Подразумеваемая власть Иисуса над природой
  choice: Передать событие прямо, без богословского пояснения в основном тексте.
  alternative: Добавить формулировку, особо подчёркивающую чудесную власть Иисуса.
  rationale: Стих сообщает, что после их входа в лодку ветер стих. Богословское значение раскрывается контекстом, поэтому перевод не должен вводить отсутствующее в греческом тексте объяснение причинной связи.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, естественная и достойная. Союз «И» сохраняет повествовательную связь, а «ветер стих» звучит привычно без архаизации.
