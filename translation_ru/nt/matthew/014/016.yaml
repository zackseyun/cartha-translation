  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐ χρείαν ἔχουσιν ἀπελθεῖν· δότε αὐτοῖς ὑμεῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/016.yaml
  text: But Jesus said to them[a], “They have no need to go away; you yourselves give them something to eat.”
translation:
  language: ru
  text: 'Но Иисус сказал им: «Им незачем уходить. Вы сами дайте им поесть».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт мягкое противопоставление предложению учеников отпустить народ.
- source_word: εἶπεν αὐτοῖς
  choice: сказал им
  rationale: Естественная и точная передача повествовательной формулы с косвенным дополнением.
- source_word: Οὐ χρείαν ἔχουσιν ἀπελθεῖν
  choice: Им незачем уходить
  rationale: Современная идиоматическая передача греческой конструкции «не имеют нужды уйти» без изменения смысла.
- source_word: δότε αὐτοῖς ὑμεῖς φαγεῖν
  choice: Вы сами дайте им поесть
  rationale: «Вы сами» сохраняет эмфазу эксплицитного ὑμεῖς; «дайте им поесть» естественно передаёт конструкцию δίδωμι с инфинитивом φαγεῖν.
theological_decisions:
- issue: Акцент на роли учеников в повелении Иисуса
  choice: «Вы сами дайте им поесть»
  alternative: «Дайте им поесть»
  rationale: Отдельно выраженное местоимение ὑμεῖς имеет эмфатическую силу; перевод сохраняет этот акцент, не добавляя толкования.
translation_notes:
  register: Современный литературный русский язык; реплика краткая, естественная и достойная по тону. «Незачем» передаёт отсутствие необходимости, а не запрет; «поесть» является обычной современной передачей значения φαγεῖν в данной конструкции.
