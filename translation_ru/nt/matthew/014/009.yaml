base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/009.yaml
  text: And the king[a], though grieved, because of his oaths and those dining with him[b], commanded it to be given.
translation:
  language: ru
  text: Царь опечалился, но из-за своих клятв и тех, кто возлежал с ним за столом[a], приказал дать[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть тех, кто участвовал с ним в пире. В то время за столом обычно располагались полулёжа.
    reason: cultural_note
  - marker: b
    text: В греческом тексте не названо, что именно царь приказал дать; имеется в виду то, о чём просили в предыдущем стихе.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπηθεὶς
  choice: опечалился, но
  rationale: Аористное страдательное причастие передаёт возникшую печаль; союз «но» естественно выражает подразумеваемое уступительное противопоставление последующему приказу.
- source_word: ὁ βασιλεὺς
  choice: царь
  rationale: Прямое и контекстуально уместное соответствие βασιλεύς.
- source_word: διὰ τοὺς ὅρκους
  choice: из-за своих клятв
  rationale: διά с винительным обозначает причину; «своих» ясно указывает на ранее данные царём клятвы.
- source_word: τοὺς συνανακειμένους
  choice: гостей, возлежавших с ним за столом
  rationale: Передаёт как совместную трапезу, так и исторически характерную позу участников пира; «гостей» естественно для русского повествования.
- source_word: ἐκέλευσεν
  choice: приказал
  rationale: Точно передаёт властное распоряжение, выраженное κελεύω.
- source_word: δοθῆναι
  choice: дать просимое
  rationale: Сохраняет пассивно-безличный смысл инфинитива и делает понятной подразумеваемую связь с просьбой из предыдущего контекста, не называя сам предмет просьбы.
