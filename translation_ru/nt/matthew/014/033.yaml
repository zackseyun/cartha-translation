base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/033.yaml
  text: Then those in the boat worshiped him[a], saying[b], “Truly you are the Son of God.”
translation:
  language: ru
  text: 'Тогда находившиеся в лодке поклонились Ему[a] и сказали: «Воистину Ты — Сын Божий[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пали перед Ним ниц», «почтили Его». Греческий глагол обозначает почтение, выраженное поклоном или падением ниц, и в этом контексте может означать поклонение.'
    reason: lexical_alternative
  - marker: b
    text: 'Также возможно: «Божий Сын». Отсутствие артикля перед словом «Бог» в греческом здесь не означает «один из сыновей Бога»; в контексте выражение имеет силу титула.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: Тогда те, кто
  rationale: δέ — мягкая повествовательная связка; «тогда» естественно передаёт развитие событий, а субстантивированное οἱ обозначает находившихся в лодке людей.
- source_word: ἐν τῷ πλοίῳ
  choice: был в лодке
  rationale: Обычное и естественное русское обозначение местонахождения людей в лодке; единственное число πλοίῳ сохранено.
- source_word: προσεκύνησαν αὐτῷ
  choice: поклонились Ему
  rationale: προσκυνέω обозначает поклонение, выраженное поклоном или падением ниц, и может иметь смысл почитания или богопоклонения. Русское «поклонились» сохраняет как внешнее действие, так и религиозную силу контекста, не снимая лексической многозначности.
- source_word: λέγοντες
  choice: и сказали
  rationale: Греческое причастие сопутствующего действия естественно передаётся в русском личной формой с союзом; буквальное «говоря» здесь звучало бы менее естественно.
- source_word: Ἀληθῶς
  choice: Воистину
  rationale: Передаёт торжественное и исповедальное утверждение; в современном литературном русском это слово возвышенно, но понятно.
- source_word: θεοῦ υἱὸς
  choice: Сын Божий
  rationale: Безартиклевая греческая конструкция в данном контексте имеет качественно-определённую силу и функционирует как титул; русский традиционный порядок слов естественно передаёт выражение без неопределённого смысла.
- source_word: εἶ
  choice: Ты —
  rationale: Русское настоящее время допускает нулевую связку; тире ясно оформляет именную часть сказуемого и сохраняет торжественный акцент.
theological_decisions:
- issue: Смысл προσκυνέω по отношению к Иисусу
  choice: «поклонились Ему» с пояснением о возможном смысле поклонения
  alternative: «поклонились Ему как Богу» / «почтили Его»
  rationale: Контекст власти Иисуса над морем и последующего исповедания придаёт действию религиозный вес, однако сам глагол может обозначать и телесное падение ниц или выражение глубокого почтения. Основной текст сохраняет эту подлинную многозначность, а примечание раскрывает диапазон.
- issue: Определённость θεοῦ υἱὸς
  choice: «Сын Божий»
  alternative: «сын Бога» / «один из сыновей Бога»
  rationale: Отсутствие артикля при θεοῦ не делает выражение неопределённым. В этом исповедальном контексте словосочетание имеет титульную, качественно-определённую силу; вариант с неопределённым значением исказил бы греческий синтаксис и контекст.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным исповедальным тоном. «Воистину» и «Сын Божий» уместны для торжественной реплики, тогда как синтаксис основного повествования остаётся простым и понятным. Заглавные местоимения в обращении к Иисусу использованы согласно принятой русской библейской издательской норме.
