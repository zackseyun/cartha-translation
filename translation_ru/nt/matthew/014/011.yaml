lexical_decisions:
- source_word: ἠνέχθη
  choice: принесли
  rationale: Аорист пассивного залога от φέρω. Неопределённо-личная русская конструкция естественно передаёт греческий пассив в повествовании, не называя исполнителей действия.
- source_word: ἡ κεφαλὴ αὐτοῦ
  choice: его голову
  rationale: Прямой перевод без эвфемизма; винительный падеж обусловлен естественной русской неопределённо-личной конструкцией.
- source_word: ἐπὶ πίνακι
  choice: на блюде
  rationale: πίναξ обозначает плоское блюдо или поднос для подачи пищи. «На блюде» естественно и точно звучит в данном контексте; возможный вариант отмечен в сноске.
- source_word: ἐδόθη
  choice: отдали
  rationale: Аорист пассивного залога от δίδωμι. Неопределённо-личное «отдали» сохраняет отсутствие названного деятеля и образует естественную русскую последовательность с «принесли».
- source_word: τῷ κορασίῳ
  choice: девушке
  rationale: κοράσιον означает девочку или молодую девушку. В данном повествовательном контексте «девушке» — ясный, современный и неархаичный вариант.
- source_word: ἤνεγκεν
  choice: она отнесла её
  rationale: Аорист активного залога от φέρω. «Отнесла» естественно описывает передачу головы матери; местоимение «её» грамматически согласуется со словом «голову» и восполняет подразумеваемое в греческом дополнение.
- source_word: τῇ μητρὶ αὐτῆς
  choice: своей матери
  rationale: Возвратно-притяжательное «своей» в русском однозначно связывает мать с подлежащим «она», то есть с девушкой, как и греческое αὐτῆς.
