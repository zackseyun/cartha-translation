lexical_decisions:
- source_word: ὅθεν
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь с предшествующим повествованием естественным современным русским союзным наречием.
- source_word: μετὰ ὅρκου
  choice: поклялся
  rationale: Значение обстоятельства клятвы естественно объединено по-русски с глаголом обещания; это избегает тяжеловесного «пообещал с клятвой» и сохраняет силу заверения.
- source_word: ὡμολόγησεν αὐτῇ δοῦναι
  choice: он поклялся дать ей
  rationale: В данном контексте ὁμολογέω обозначает твёрдое обещание; дательный αὐτῇ и инфинитив δοῦναι прямо переданы как «дать ей».
- source_word: ὃ ἐὰν αἰτήσηται
  choice: всё, чего она ни попросит
  rationale: Русская конструкция с «ни» естественно передаёт неопределённо-относительное придаточное и открытый характер будущей просьбы.
