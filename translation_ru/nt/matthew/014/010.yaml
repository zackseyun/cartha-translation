translation:
  language: ru
  text: И он послал обезглавить Иоанна в темнице[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И, послав, он обезглавил Иоанна в темнице». В греческом тексте аористное причастие стоит перед основным глаголом. Такая формулировка приписывает действие правителю, хотя казнь совершается через посланных им исполнителей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет простой повествовательный союз и связь с предшествующим контекстом, не добавляя более узкого временного или причинного оттенка.
- source_word: πέμψας
  choice: послав людей
  rationale: 'Аористное причастие обозначает предшествующее действие: субъект кого-то послал, после чего казнь была совершена. Добавление «людей» естественно для русского языка и ясно передаёт подразумеваемых исполнителей, не превращая выражение в более толковательное «приказал».'
- source_word: ἀπεκεφάλισεν
  choice: обезглавил
  rationale: Точно передаёт значение ἀποκεφαλίζω. Активная форма сохраняет греческое приписывание действия субъекту, хотя контекст и оборот с πέμψας указывают на исполнение через посланных людей.
- source_word: τὸν Ἰωάννην
  choice: Иоанна
  rationale: Передаёт прямо названное имя без добавления отсутствующего в стихе уточнения «Крестителя».
- source_word: ἐν τῇ φυλακῇ
  choice: в темнице
  rationale: Дигнифицированное, но понятное современному читателю обозначение места заключения; конкретная локативная конструкция сохранена.
theological_decisions:
- issue: Кто непосредственно совершил казнь
  choice: «он обезглавил» с предваряющим «послав людей»
  alternative: «он приказал обезглавить»
  rationale: Греческий главный глагол грамматически приписывает действие субъекту, тогда как причастие πέμψας подразумевает посредников. Перевод сохраняет это напряжение и не заменяет действие толкованием о приказе.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Темница» выбрана вместо разговорного «тюрьма»; синтаксис остаётся ясным. Формулировка не утверждает, что Ирод лично исполнил казнь, но сохраняет активное приписывание действия субъекту, как в греческом тексте.
