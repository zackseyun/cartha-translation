    text: 'Или: «разошлёт собравшихся людей».'
    reason: 'Лексическая альтернатива для ἀπολύσῃ τοὺς ὄχλους: «разошлёт» подчёркивает отправление людей прочь.'
  revision_rationale: Исправление восстанавливает силу ἠνάγκασεν и делает передачу ἀπολύσῃ τοὺς ὄχλους более естественной по-русски. Синтаксис сохраняет временную границу ἕως οὗ с будущей по отношению к основному действию перспективой, а «идти впереди Него» прямо передаёт προάγειν αὐτόν.
