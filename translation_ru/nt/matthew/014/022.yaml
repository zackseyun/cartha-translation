source:
  edition: SBLGNT
  text: Καὶ εὐθέως ⸀ἠνάγκασεν τοὺς μαθητὰς ἐμβῆναι ⸀εἰς πλοῖον καὶ προάγειν αὐτὸν εἰς τὸ πέραν, ἕως οὗ ἀπολύσῃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/022.yaml
  text: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], until he should dismiss the crowds.
translation:
  language: ru
  text: И тотчас Он заставил учеников сесть в лодку и идти впереди Него на другой берег, пока Он не отпустит собравшихся людей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разошлёт собравшихся людей».'
    reason: 'Лексическая альтернатива для ἀπολύσῃ τοὺς ὄχλους: «разошлёт» подчёркивает отправление людей прочь.'
lexical_decisions:
- source_word: εὐθέως
  choice: тотчас
  rationale: Передаёт незамедлительность действия и быстрый переход повествования; это естественное литературное русское слово.
- source_word: ἠνάγκασεν
  choice: настоял, чтобы
  rationale: Передаёт сильное побуждение или настойчивое требование, не добавляя отсутствующего в тексте указания на физическое принуждение. Более буквальное «заставил» возможно, но в современном русском способно прозвучать жёстче греческого в данном контексте.
- source_word: τοὺς μαθητάς
  choice: ученики
  rationale: Определённость известной группы ясна из контекста; притяжательное «Его» в греческом прямо не выражено.
- source_word: ἐμβῆναι εἰς πλοῖον
  choice: сели в лодку
  rationale: Естественно передаёт посадку в лодку в современном русском языке.
- source_word: πλοῖον
  choice: лодку
  rationale: Контекст указывает на конкретную лодку; в русском определённость передаётся контекстом без артикля.
- source_word: προάγειν αὐτόν
  choice: отправились ... раньше Него
  rationale: Передаёт смысл ухода вперёд, прежде Иисуса, и звучит естественнее буквального «предшествовали Ему».
- source_word: εἰς τὸ πέραν
  choice: на другой берег
  rationale: Обычное и ясное русское соответствие выражению об противоположной стороне водоёма.
- source_word: ἕως οὗ ἀπολύσῃ
  choice: пока Он не отпустит
  rationale: Русская конструкция «пока не» естественно обозначает будущую границу действия относительно главного глагола.
- source_word: ἀπολύσῃ τοὺς ὄχλους
  choice: отпустит толпы
  rationale: Сохраняет значение отправления собравшихся людей прочь и грамматически выраженное множественное число.
theological_decisions: []
translation_notes:
  register: Современный литературный, повествовательный и сдержанно-достоинственный русский язык. Местоимение «Он» сохраняет отсутствие имени Иисуса в самом греческом стихе, где действующее лицо ясно из контекста. Заглавная буква следует принятой русской библейской норме для местоимения, относящегося к Иисусу.
