revisions:
- from: И тотчас Он настоял, чтобы ученики сели в лодку и отправились на другой берег раньше Него, пока Он не отпустит толпы[a].
  to: И тотчас Он заставил учеников сесть в лодку и идти впереди Него на другой берег, пока Он не отпустит собравшихся людей[a].
  rationale: Исправление восстанавливает силу ἠνάγκασεν и делает передачу ἀπολύσῃ τοὺς ὄχλους более естественной по-русски. Синтаксис сохраняет временную границу ἕως οὗ с будущей по отношению к основному действию перспективой, а «идти впереди Него» прямо передаёт προάγειν αὐτόν.
