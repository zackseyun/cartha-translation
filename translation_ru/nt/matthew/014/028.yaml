  yaml_path: translation/nt/matthew/014/028.yaml
  text: And Peter answered him[a], “Lord, if it is you, command me to come to you on the waters.”
translation:
  language: ru
  text: 'Пётр же ответил Ему: «Господи, если это Ты, повели мне прийти к Тебе по воде[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по водам»; в греческом тексте стоит множественное число.'
    reason: Сохранение заметной особенности исходного выражения ἐπὶ τὰ ὕδατα при естественном русском основном тексте.
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ αὐτῷ ὁ Πέτρος εἶπεν
  choice: Пётр же ответил Ему
  rationale: Обычная повествовательная формула передана естественно по-русски; «же» сохраняет связь δέ с предшествующим рассказом, а дательный αὐτῷ — адресата ответа.
- source_word: Κύριε
  choice: Господи
  rationale: Традиционная и современно понятная русская форма прямого обращения, сохраняющая уважительный и возможный христологический смысл κύριος.
- source_word: εἰ σὺ εἶ
  choice: если это Ты
  rationale: Естественная русская формула установления личности; ударное σὺ отражено местоимением «Ты».
- source_word: κέλευσόν με ἐλθεῖν πρὸς σὲ
  choice: повели мне прийти к Тебе
  rationale: «Повели» передаёт властный характер κελεύω, а «прийти к Тебе» естественно выражает движение к Иисусу.
- source_word: ἐπὶ τὰ ὕδατα
  choice: по воде
  rationale: В данном контексте русское «идти/прийти по воде» звучит естественно и точно передаёт движение по поверхности воды; грамматическое множественное число греческого отмечено в сноске.
theological_decisions:
- issue: Смысл обращения κύριε к Иисусу
  choice: Господи
  alternative: Учитель; господин
  rationale: «Господи» не сводит обращение к простой вежливости и сохраняет возможный богословский вес, не определяя его сверх того, что допускает контекст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Заглавные буквы в местоимениях «Ему», «Ты», «Тебе» использованы в соответствии с устойчивой русской традицией почтительного обозначения Иисуса.
