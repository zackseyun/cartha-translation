lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: В то время
  rationale: Естественный русский временной оборот, точно передающий идиоматическое значение греческой предложной конструкции.
- source_word: ἤκουσεν
  choice: услышал
  rationale: Прямо передаёт аорист ἀκούω, не добавляя более интерпретирующего значения «узнал».
- source_word: Ἡρῴδης
  choice: Ирод
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: ὁ τετραάρχης
  choice: Ирод-тетрарх
  rationale: Сохраняет точный исторический титул и вместе с тем естественно оформляет его как приложение к имени по-русски.
- source_word: τὴν ἀκοὴν
  choice: молву
  rationale: В данном контексте существительное обозначает услышанное — распространяющиеся сведения или слух. «Молва» кратко и естественно передаёт этот смысл, не утверждая ни официального характера сообщения, ни его недостоверности.
- source_word: Ἰησοῦ
  choice: об Иисусе
  rationale: Родительный падеж после ἀκοή выражает содержание услышанного; по-русски это естественно передаётся сочетанием с предлогом «об».
