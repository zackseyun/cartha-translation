  text: καὶ ἀπολύσας τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος κατ’ ἰδίαν προσεύξασθαι. ὀψίας δὲ γενομένης μόνος ἦν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/023.yaml
  text: And after dismissing the crowds[a], he went up on the mountain by himself to pray. When evening came, he was there alone.
translation:
  language: ru
  text: Отпустив толпы, Он поднялся на гору один, чтобы помолиться. Когда наступил вечер, Он был там один.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολύσας τοὺς ὄχλους
  choice: Отпустив народ
  rationale: Аористное причастие передаёт действие, предшествующее основному; «отпустив» точно и естественно. Собирательное «народ» в современном русском обозначает собравшихся людей без неуместной архаичности, хотя греческое существительное стоит во множественном числе.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: поднялся на гору
  rationale: Передаёт направленное вверх движение и естественно звучит по-русски.
- source_word: κατ’ ἰδίαν
  choice: один
  rationale: В данном контексте выражение указывает, что Он удалился от других; краткое «один» сохраняет эту мысль и подготавливает повтор в конце стиха.
- source_word: προσεύξασθαι
  choice: чтобы помолиться
  rationale: Инфинитив цели естественно передаётся русским придаточным с «чтобы»; совершенный вид «помолиться» соответствует ограниченному целевому действию.
- source_word: ὀψίας δὲ γενομένης
  choice: Когда настал вечер
  rationale: Родительный самостоятельный оборот имеет временное значение; перевод сохраняет временной переход без тяжеловесности.
- source_word: μόνος ἦν ἐκεῖ
  choice: Он оставался там один
  rationale: «Оставался» естественно выражает состояние, продолжавшееся к наступлению вечера, не меняя смысла греческого ἦν; «там один» сохраняет и место, и подчёркнутое одиночество.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Местоимение «Он» написано с прописной буквы согласно распространённой русской библейской издательской традиции. Повтор слова «один» сохранён, поскольку он отражает разные, но взаимосвязанные формулировки κατ’ ἰδίαν и μόνος.
