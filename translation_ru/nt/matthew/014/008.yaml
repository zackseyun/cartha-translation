- from: 'А она, подученная своей матерью, говорит: «Дай мне здесь на блюде голову Иоанна Крестителя[a]».'
  to: 'А она, по наущению матери, говорит: «Дай мне здесь на блюде голову Иоанна Крестителя».'
  rationale: Заменено разговорно окрашенное «подученная своей матерью» на литературное «по наущению матери», точнее отражающее предшествующее побуждение. Удалены якорь и примечание, поскольку они не нужны для выбранного нормативного русского титула и формулируют «буквальное» значение неточно.
