  text: ἡ δὲ προβιβασθεῖσα ὑπὸ τῆς μητρὸς αὐτῆς· Δός μοι, φησίν, ὧδε ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/008.yaml
  text: And she, having been prompted by her mother, says, “Give me here on a platter the head of John the Baptizer.”
translation:
  language: ru
  text: 'А она, по наущению матери, говорит: «Дай мне здесь на блюде голову Иоанна Крестителя».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβιβασθεῖσα
  choice: подученная
  rationale: Причастие в пассиве указывает на предварительное побуждение и наставление со стороны матери. «Подученная» естественно передаёт этот оттенок в данном контексте, не превращая его в формальное распоряжение.
- source_word: ὑπὸ τῆς μητρὸς αὐτῆς
  choice: своей матерью
  rationale: ὑπό с родительным обозначает действующее лицо при пассивной конструкции; русское «своей матерью» ясно соотносит мать с девушкой.
- source_word: Δός μοι
  choice: Дай мне
  rationale: Прямое повеление естественно и точно передаёт аористный императив.
- source_word: φησίν
  choice: говорит
  rationale: Настоящее время сохраняет историческое настоящее греческого текста и его повествовательную живость.
- source_word: ὧδε
  choice: здесь
  rationale: Сохраняет дейктическое значение наречия и подчёркивает требование принести голову к месту пира.
- source_word: ἐπὶ πίνακι
  choice: на блюде
  rationale: В контексте пира πίναξ обозначает большое сервировочное блюдо; «на блюде» — естественное современное русское выражение.
- source_word: τὴν κεφαλὴν
  choice: голову
  rationale: Прямой перевод сохраняет намеренную жестокую конкретность рассказа.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Иоанна Крестителя
  rationale: «Иоанн Креститель» — естественное, общепонятное и укоренившееся русское наименование, при этом слово «Креститель» сохраняет деятельный смысл греческого βαπτιστής.
theological_decisions:
- issue: Передача титула βαπτιστής
  choice: Иоанна Крестителя
  alternative: Иоанна Крестящего
  rationale: Русское «Креститель» одновременно традиционно, естественно и семантически связано с совершаемым Иоанном действием. Вариант «Крестящий» прозрачнее как действующее причастие, но менее устойчив как титул.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейского повествования. Историческое настоящее передано формой «говорит». Реплика оставлена резкой и конкретной, как в греческом тексте.
