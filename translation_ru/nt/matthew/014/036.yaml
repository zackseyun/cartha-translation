base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/036.yaml
  text: And they begged him that they might only touch the fringe of his garment[b][a], and as many as touched it were healed.
translation:
  language: ru
  text: Они умоляли Его позволить им лишь прикоснуться к краю Его одежды[a]. И все, кто прикоснулся, исцелились[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к кайме», «к бахроме» или «к кисти»; греческое слово может обозначать край или бахрому одежды, возможно включая кисть.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «стали здоровы». Греческий глагол может также означать «были спасены» или «были избавлены», но здесь речь идёт о физическом исцелении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: просили
  rationale: Имперфект передаёт продолжавшуюся или неоднократную просьбу. В данном контексте «просили» звучит естественно; настойчивость поддерживается самой конструкцией и ситуацией.
- source_word: ἵνα μόνον ἅψωνται
  choice: чтобы им хотя бы прикоснуться
  rationale: ἵνα с конъюнктивом передаёт содержание просьбы, а μόνον подчёркивает, что они просили лишь о прикосновении. Русское «хотя бы» естественно выражает минимальность желаемого действия.
- source_word: τοῦ κρασπέδου
  choice: к краю
  rationale: κράσπεδον может обозначать край, кайму, бахрому или кисть одежды. «Край» сохраняет необходимую широту значения и не вводит чрезмерно конкретное толкование.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: Его одежды
  rationale: ἱμάτιον обозначает одежду, часто верхнюю; общее «одежда» точно и не уточняет без необходимости её вид.
- source_word: ὅσοι
  choice: все, кто
  rationale: Идиоматичное русское соответствие количественно-относительному ὅσοι, передающее, что исцеление получили все прикоснувшиеся.
- source_word: ἥψαντο
  choice: прикоснулся
  rationale: Средняя форма ἅπτω здесь имеет обычное значение «прикоснуться»; объект понятен из предыдущего предложения и в русском может не повторяться.
- source_word: διεσώθησαν
  choice: исцелились
  rationale: В непосредственном контексте телесных недугов διασῴζω означает полное избавление от болезни, то есть исцеление. При этом более широкий смысл глагола отмечен в сноске.
theological_decisions:
- issue: Значение διεσώθησαν в рассказе об исцелениях
  choice: исцелились
  alternative: были спасены; выздоровели; стали здоровы
  rationale: Контекст прямо указывает на физическое исцеление, поэтому «исцелились» передаёт актуальный здесь смысл, не превращая стих в недвусмысленное утверждение о духовном спасении. Более широкий диапазон исходного глагола сохранён в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для широкой аудитории; неоднозначность κράσπεδον и семантическая широта διασῴζω сохранены в сносках.
