id: MAT.14.30
reference: Matthew 14:30
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: βλέπων δὲ τὸν ἄνεμον ⸀ἰσχυρὸν ἐφοβήθη, καὶ ἀρξάμενος καταποντίζεσθαι ἔκραξεν λέγων· Κύριε, σῶσόν με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/030.yaml
  text: But seeing the strong wind[a], he became afraid, and beginning to sink, he cried out, saying, “Lord[b], save me.”
translation:
  language: ru
  text: 'Но, увидев сильный ветер[a], он испугался и, начав тонуть, закричал: «Господи, спаси меня[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бурный ветер».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «выручи меня». Греческий глагол может обозначать как избавление от непосредственной опасности, так и спасение в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπων δὲ
  choice: Но, увидев
  rationale: Оборот передаёт одновременное восприятие и контрастный поворот повествования; совершенный вид естественно звучит по-русски в последовательности событий.
- source_word: τὸν ἄνεμον ἰσχυρόν
  choice: сильный ветер
  rationale: 'Прямое и естественное соответствие: ἰσχυρός характеризует силу ветра, не требуя усиления до «яростного».'
- source_word: ἐφοβήθη
  choice: испугался
  rationale: Глагол передаёт наступление страха, а не только продолжающееся состояние.
- source_word: ἀρξάμενος καταποντίζεσθαι
  choice: начав тонуть
  rationale: Сохраняет начальную фазу действия и не преувеличивает её до уже совершившегося утопления.
- source_word: ἔκραξεν λέγων
  choice: закричал
  rationale: По-русски один глагол естественно передаёт громкий настойчивый возглас; буквальное «закричал, говоря» было бы тяжеловесным.
- source_word: Κύριε
  choice: Господи
  rationale: Обычная русская форма прямого обращения к Иисусу, сохраняющая смысл κύριος и его христологическую значимость.
- source_word: σῶσόν με
  choice: спаси меня
  rationale: Передаёт настоятельную просьбу об избавлении от непосредственной опасности и сохраняет более широкий смысловой диапазон σῴζω.
theological_decisions:
- issue: Передача κύριος при прямом обращении к Иисусу
  choice: Господи
  alternative: Учитель
  rationale: «Господи» точно и традиционно передаёт κύριος, не устраняя возможной христологической значимости обращения.
- issue: Передача σῴζω в ситуации непосредственной физической опасности
  choice: спаси меня
  alternative: выручи меня
  rationale: «Спаси» естественно для срочной просьбы об избавлении и одновременно сохраняет широкий семантический и богословский диапазон глагола.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, напряжённая и пригодная для публичного чтения. Причастные конструкции греческого текста переданы естественным русским синтаксисом без утраты последовательности действий.
