  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸂οἱ δὲ μαθηταὶ ἰδόντες αὐτὸν⸃ ἐπὶ ⸂τῆς θαλάσσης⸃ περιπατοῦντα ἐταράχθησαν λέγοντες ὅτι Φάντασμά ἐστιν, καὶ ἀπὸ τοῦ φόβου ἔκραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/026.yaml
  text: But when the disciples saw him walking on the sea[a], they were terrified, saying, “It is a ghost!” And they cried out from fear.
translation:
  language: ru
  text: 'Но ученики, увидев Его, идущего по морю, пришли в ужас и сказали: «Это призрак[a]!» — и от страха закричали.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «привидение»; «фантом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт лёгкий повествовательный контраст с предыдущим стихом и подчёркивает испуганную реакцию учеников.
- source_word: μαθηταὶ
  choice: ученики
  rationale: Определённая группа ясна из контекста; добавление «Его» не требуется.
- source_word: ἰδόντες αὐτὸν
  choice: увидев, что Он идёт
  rationale: Аористное причастие естественно передано деепричастной конструкцией; местоимение раскрыто через придаточное, чтобы по-русски ясно связать видение с действием.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: идёт по морю
  rationale: «По морю» близко передаёт движение по поверхности моря и звучит естественно в современном русском языке.
- source_word: ἐταράχθησαν
  choice: пришли в ужас
  rationale: В данном контексте глагол обозначает сильное потрясение и испуг; выражение сохраняет интенсивность, подтверждаемую последующим криком от страха.
- source_word: λέγοντες
  choice: и сказали
  rationale: Сопутствующее причастие естественно передаётся личной формой в последовательном русском повествовании.
- source_word: Φάντασμά ἐστιν
  choice: Это призрак!
  rationale: «Призрак» — ясный современный эквивалент для пугающего сверхъестественного явления, которое, как ошибочно решили ученики, они увидели.
- source_word: ἀπὸ τοῦ φόβου
  choice: от страха
  rationale: Точно и естественно выражает причину крика.
- source_word: ἔκραξαν
  choice: закричали
  rationale: Передаёт громкий возглас без излишнего уточнения его характера.
theological_decisions:
- issue: Характер φάντασμα в возгласе учеников
  choice: призрак
  alternative: видение; привидение
  rationale: Текст сообщает об испуганном истолковании увиденного учениками, а не утверждает существование или природу духов; основной вариант не вносит дополнительного догматического вывода.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным стилем. Заглавная буква в «Он» служит традиционной русской референциальной ясности, не добавляя содержания к греческому местоимению.
