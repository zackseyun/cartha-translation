revisions:
- from: 'Но ученики, увидев, что Он идёт по морю, пришли в ужас и сказали: «Это призрак[a]!» — и от страха закричали.'
  to: 'Но ученики, увидев Его, идущего по морю, пришли в ужас и сказали: «Это призрак[a]!» — и от страха закричали.'
  rationale: Минимальная правка восстанавливает более непосредственную передачу греческого сочетания «увидев Его, идущего по морю» и уточняет лексические альтернативы для φάντασμα. Остальные решения сохранены как точные, естественные и стилистически уместные.
