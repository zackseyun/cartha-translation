review_pass:
  verdict: revise
  source_fidelity: 'Смысл передан точно: ученики видят Иисуса, идущего по морю, пугаются, принимают Его за призрак и кричат от страха. Однако конструкция «увидев, что Он идёт» несколько ослабляет прямую связь греческого ἰδόντες αὐτὸν ... περιπατοῦντα («увидев Его, идущего») и заменяет одновременное действие придаточным с настоящим временем.'
  naturalness: Текст в целом естественен для современного литературного русского. Конструкция «увидев Его, идущего по морю» одновременно точнее к оригиналу и остаётся литературно естественной. Последовательность «сказали ... и ... закричали» допустима и ясно передаёт повествование.
  terminology: «Призрак» — удачный современный эквивалент φάντασμα; он передаёт испуганное предположение учеников, не утверждая ничего о природе духов. В сноске «привидение» хорошо; «видение» возможно, но менее близко к значению явившегося пугающего образа. «Фантом» точнее отражает один из лексических вариантов и не создаёт богословского вывода.
  issues:
  - severity: low
    issue: Связь «увидев, что Он идёт»
    rationale: 'Греческий текст прямо характеризует увиденного: ученики увидели Его «идущим по морю». Формулировка «увидев Его, идущего по морю» сохраняет эту синтаксическую и смысловую связь точнее.'
  - severity: low
    issue: Вариант в сноске «видение»
    rationale: «Видение» в русском чаще обозначает переживание или зрительный образ, тогда как φάντασμα здесь обозначает кажущееся явление/призрака. «Фантом» лучше представляет данный лексический диапазон наряду с «привидением».
  revised_text: 'Но ученики, увидев Его, идущего по морю, пришли в ужас и сказали: «Это призрак[a]!» — и от страха закричали.'
