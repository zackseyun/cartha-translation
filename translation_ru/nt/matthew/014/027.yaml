base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/027.yaml
  text: But immediately Jesus spoke to them[a], saying, “Take courage; it is I. Do not be afraid.”
translation:
  language: ru
  text: 'Но Иисус тотчас обратился к ним: «Ободритесь! Это Я[a]. Не бойтесь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я есть». Здесь греческое выражение может быть обычным самообозначением, хотя в нём также можно услышать отзвук божественного самообозначения.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: тотчас
  rationale: Точно передаёт непосредственность действия и звучит естественно в современном литературном русском.
- source_word: δὲ
  choice: Но
  rationale: Передаёт лёгкое противопоставление страху учеников, описанному в предыдущем стихе.
- source_word: ἐλάλησεν αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: Иисус заговорил с ними
  rationale: Естественно объединяет личную форму и причастие речи, избегая тяжеловесного «заговорил… говоря» без потери смысла.
- source_word: Θαρσεῖτε
  choice: Ободритесь!
  rationale: Передаёт повеление обрести мужество и уверенность; понятно, достойно и уместно в ситуации страха.
- source_word: ἐγώ εἰμι
  choice: Это Я
  rationale: В данном повествовательном контексте выражение прежде всего служит самоидентификацией Иисуса; написание «Я» соответствует принятой русской практике в прямой речи Христа.
- source_word: μὴ φοβεῖσθε
  choice: Не бойтесь
  rationale: Прямой и естественный русский эквивалент запрета, не переуточняющий видовое значение греческой формы.
theological_decisions:
- issue: Следует ли передать ἐγώ εἰμι как обычную самоидентификацию или как явную формулу «Я есмь»
  choice: 'В основном тексте: «Это Я»'
  alternative: «Я есть»; традиционное «Я есмь»
  rationale: Ближайший контекст указывает на то, что Иисус успокаивает учеников, называя Себя. Сноска сохраняет буквальную форму и возможность услышать отзвук божественного самообозначения, не навязывая его как единственное толкование.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Синтаксис слегка сглажен ради естественности; краткие повелительные фразы сохраняют настойчивый утешительный тон оригинала.
