  text: ὁ δὲ εἶπεν· Φέρετέ μοι ⸂ὧδε αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/018.yaml
  text: But he said[a], “Bring them here to me.”
translation:
  language: ru
  text: 'Но он сказал: «Принесите их[a] сюда, ко мне».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть хлебы и рыбу, упомянутые в предыдущем стихе.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Частица δέ обозначает мягкое противопоставление ответу учеников в предыдущем стихе; «но» естественно передаёт эту связь.
- source_word: εἶπεν
  choice: сказал
  rationale: Аорист глагола λέγω здесь нейтрально вводит прямую речь; «сказал» не добавляет отсутствующего в самом глаголе оттенка приказания.
- source_word: Φέρετέ
  choice: Принесите
  rationale: Форма настоящего повелительного наклонения, 2-го лица множественного числа, требует принести названные предметы к говорящему; «принесите» точно и естественно передаёт действие.
- source_word: μοι
  choice: ко мне
  rationale: Дательный падеж личного местоимения указывает, к кому следует принести предметы; по-русски это естественно выражается сочетанием «ко мне».
- source_word: ὧδε
  choice: сюда
  rationale: Наречие места указывает направление к месту, где находится говорящий; при глаголе движения русское «сюда» точнее и естественнее буквального «здесь».
- source_word: αὐτούς
  choice: их
  rationale: Местоимение мужского рода во множественном числе контекстуально относится к хлебам и рыбам из предыдущего стиха; русское «их» сохраняет местоименную отсылку без избыточного уточнения в основном тексте.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая и властная реплика сохранена без архаизации. Местоимение, относящееся к Иисусу, написано со строчной буквы в соответствии с нейтральной современной издательской нормой. Маркер примечания поставлен после «их», поскольку пояснение относится именно к этому местоимению.
