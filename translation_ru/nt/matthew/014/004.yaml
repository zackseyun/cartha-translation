  text: ἔλεγεν γὰρ ⸂αὐτῷ ὁ Ἰωάννης⸃· Οὐκ ἔξεστίν σοι ἔχειν αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/004.yaml
  text: For John had been saying to him[a], “It is not lawful for you to have her.”
translation:
  language: ru
  text: 'Ведь Иоанн говорил ему: «Тебе нельзя иметь её».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты не имеешь права иметь её».'
    reason: Лексическая альтернатива для Οὐκ ἔξεστίν σοι, подчёркивающая оттенок законного права или дозволенности.
lexical_decisions:
- source_word: ἔλεγεν
  choice: говорил
  rationale: Имперфект передаёт продолжавшееся или повторявшееся действие в прошлом; русское «говорил» естественно сохраняет эту незавершённость без избыточного уточнения.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит поясняющее основание к предшествующему повествованию; «ведь» естественно передаёт эту связь в современном русском.
- source_word: αὐτῷ
  choice: ему
  rationale: Дательный падеж обозначает адресата речи и прямо передаётся русским «ему».
- source_word: ὁ Ἰωάννης
  choice: Иоанн
  rationale: Источник называет говорящего просто Иоанном; ближайший контекст уже устанавливает его личность.
- source_word: Οὐκ ἔξεστίν σοι
  choice: тебе нельзя
  rationale: Оборот выражает отсутствие позволения или законного права. «Тебе нельзя» — естественная и достаточно сильная русская формулировка, не сводящая смысл лишь к субъективной оценке «неправильно».
- source_word: ἔχειν
  choice: иметь
  rationale: Сохранён прямой глагольный образ источника; в контексте речь идёт о том, чтобы иметь эту женщину как жену, но сам греческий текст здесь не добавляет слова «жена».
- source_word: αὐτήν
  choice: её
  rationale: Местоимение прямо отсылает к Иродиаде; поясняющее существительное не требуется.
theological_decisions:
- issue: Характер запрета в обличении Иоанна
  choice: «Тебе нельзя иметь её»
  alternative: «Тебе не позволено иметь её» / «Ты не имеешь права иметь её»
  rationale: ἔξεστιν обозначает позволительность и законность. Выбранная формулировка сохраняет категорический нравственно-правовой запрет, не добавляя прямой ссылки на конкретную норму закона.
translation_notes:
  register: Современный литературный русский язык; речь краткая, достойная и понятная. Имперфект передан нейтральным «говорил», а не более толковательным «не раз говорил». Местоимение «её» оставлено без добавления «как жену», чтобы не расширять явную формулировку источника.
