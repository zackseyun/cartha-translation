  text: ἤδη ⸀δὲ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/010.yaml
  text: And already the axe is laid at the root of the trees[a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: ru
  text: И уже топор лежит у корней деревьев.[a] Поэтому всякое дерево, не приносящее доброго плода, срубают и бросают в огонь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «топор уже приставлен к корням деревьев».'
    reason: Глагол κεῖται может обозначать как положение предмета («лежит»), так и его установленность или готовность к действию; предлог πρός допускает образ топора у корней или направленного к ним.
lexical_decisions:
- source_word: ἤδη δὲ
  choice: Уже и
  rationale: Передаёт временную неотложность ἤδη и мягкую связующую функцию δέ без излишнего противопоставления.
- source_word: ἡ ἀξίνη
  choice: топор
  rationale: Обычное современное русское обозначение орудия рубки, ясно сохраняющее образ суда.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: лежит у корней деревьев
  rationale: Прямо передаёт κεῖται («лежит, находится») и естественно выражает положение топора в непосредственной близости к корням; множественное «у корней» согласуется с «деревьев» и естественно по-русски.
- source_word: πᾶν οὖν δένδρον
  choice: Поэтому всякое дерево
  rationale: «Поэтому» ясно передаёт вывод, выраженный οὖν; «всякое» сохраняет всеобщность πᾶν.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: не приносящее доброго плода
  rationale: Русская идиома требует «приносить плод»; причастная конструкция сохраняет характеристику дерева, а «доброго» передаёт καλόν в нравственно-оценочном контексте.
- source_word: ἐκκόπτεται
  choice: срубают
  rationale: Неопределённо-личная форма естественно передаёт греческий страдательный залог, а «срубают» точно соответствует образу дерева.
- source_word: εἰς πῦρ βάλλεται
  choice: бросают в огонь
  rationale: Современная и ясная передача страдательной конструкции и направленности εἰς; определённый артикль перед πῦρ отсутствует, но русский образ естественно звучит как «в огонь».
theological_decisions:
- issue: Смысл образа огня
  choice: Сохранён образ «в огонь» без толкования
  alternative: Уточнить как эсхатологический суд, временный суд или адский огонь
  rationale: Текст несомненно говорит о суде, но не конкретизирует здесь природу огня; перевод не должен сужать богословский смысл.
- issue: Временная перспектива суда
  choice: «Уже» сохраняет близость и начавшуюся готовность суда
  alternative: Передать усиленно как «вот уже» или «уже сейчас»
  rationale: ἤδη указывает на непосредственность, но добавочное усиление могло бы превысить выраженное в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с ясным, строгим и образным звучанием. Синтаксис сохраняет последовательность греческого текста; «добрый плод» поддерживает библейский нравственный образ, не добавляя толкования.
