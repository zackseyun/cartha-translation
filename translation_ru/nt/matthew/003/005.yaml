    rationale: «Стали» добавляет значение начала процесса, которого имперфект ἐξεπορεύετο сам по себе не выражает. Простое «выходили» позволяет передать продолжающееся или повторяющееся действие, не сужая аспект.
  - severity: low
    issue: Неудачная конструкция с «жители ... всей Иудеи»
    rationale: Добавленное «жители» оправдано для раскрытия метонимии, но ряд родительных форм звучит громоздко. Предлоги «из» делают отношения происхождения ясными и идиоматичными.
