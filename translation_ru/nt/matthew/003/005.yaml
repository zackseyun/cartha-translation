  source_fidelity: «Стали выходить» прежде всего обозначает начало действия и потому неудачно передаёт имперфект ἐξεπορεύετο, описывающий происходивший/повторявшийся приток людей. Формулировка «выходили люди» сохраняет метонимическое употребление географических названий и лучше отражает видовую неопределённость оригинала.
  naturalness: Исходное «жители Иерусалима, всей Иудеи и всей окрестности Иордана» грамматически возможно, но тяжеловесно и создаёт не вполне гладкое управление. «Люди из Иерусалима, из всей Иудеи и из всей области вокруг Иордана» естественно для современного литературного русского.
  terminology: Иерусалим, Иудея и Иордан переданы нормативно. «Область вокруг Иордана» точно передаёт περίχωρος τοῦ Ἰορδάνου без ненужного уточнения границ региона. Сноска уместно поясняет обобщающий объём выражений с πᾶσα.
