  text: τότε ἐξεπορεύετο πρὸς αὐτὸν Ἱεροσόλυμα καὶ πᾶσα ἡ Ἰουδαία καὶ πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/005.yaml
  text: Then Jerusalem[a], all Judea, and all the region around the Jordan were going out to him[c][b],
translation:
  language: ru
  text: Тогда к нему выходили люди из Иерусалима, из всей Иудеи и из всей области вокруг Иордана.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражения «всей Иудеи» и «всей области вокруг Иордана» подчёркивают широкий отклик людей из этих мест, но не обязательно означают каждого отдельного жителя.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественный временной связующий элемент, соотносящий отклик народа с предшествующим описанием служения Иоанна.
- source_word: ἐξεπορεύετο
  choice: стали выходить
  rationale: Форма имперфекта передаёт разворачивавшееся и продолжавшееся в прошлом действие; русское сочетание сохраняет этот аспект без тяжеловесности.
- source_word: πρὸς αὐτόν
  choice: к нему
  rationale: При глаголе движения πρός с винительным обозначает направленность к человеку; местоимение относится к Иоанну.
- source_word: Ἱεροσόλυμα καὶ πᾶσα ἡ Ἰουδαία καὶ πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου
  choice: жители Иерусалима, всей Иудеи и всей окрестности Иордана
  rationale: Названия мест в греческом тексте метонимически обозначают людей, выходивших к Иоанну. Добавление «жители» делает это естественным по-русски, а повтор «всей» сохраняет широкий географический охват.
theological_decisions:
- issue: Объём географических обобщений с πᾶσα
  choice: Сохранить широкие выражения «всей Иудеи» и «всей окрестности Иордана», пояснив их обычный обобщающий характер в сноске.
  alternative: Передать как «люди из Иерусалима, Иудеи и окрестностей Иордана», ослабив повтор πᾶσα.
  rationale: Греческий текст риторически подчёркивает широкий отклик на служение Иоанна, но не требует понимания, будто вышел буквально каждый житель.
translation_notes:
  register: Современный литературный русский язык; формулировка dignified и доступная. Метонимия географических названий раскрыта словом «жители», а длительный характер имперфекта передан сочетанием «стали выходить».
