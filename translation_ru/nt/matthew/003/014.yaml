  text: ὁ δὲ ⸀Ἰωάννης διεκώλυεν αὐτὸν λέγων· Ἐγὼ χρείαν ἔχω ὑπὸ σοῦ βαπτισθῆναι, καὶ σὺ ἔρχῃ πρός με;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/014.yaml
  text: But John kept trying to prevent him[a], saying, “I need to be baptized by you, and do you come to me?”
translation:
  language: ru
  text: 'Но Иоанн пытался удержать Его[a], говоря: «Мне нужно принять крещение от Тебя, а Ты приходишь ко мне?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иоанн удерживал Его». Греческая форма глагола может указывать на продолжавшееся или неоднократное действие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκώλυεν
  choice: удерживал
  rationale: Имперфект передаёт продолжавшуюся или предпринимавшуюся попытку воспрепятствовать; русское «удерживал» естественно сохраняет длительный аспект, не утверждая, что Иоанну удалось остановить Иисуса.
- source_word: λέγων
  choice: говоря
  rationale: Деепричастие сохраняет тесную связь между попыткой Иоанна удержать Иисуса и объясняющими её словами.
- source_word: χρείαν ἔχω
  choice: мне нужно
  rationale: Естественная современная передача идиомы «иметь нужду» без архаической тяжеловесности.
- source_word: ὑπὸ σοῦ
  choice: от Тебя
  rationale: При пассивном инфинитиве оборот обозначает личного совершителя действия; в русском сочетание «принять крещение от Тебя» звучит естественнее буквального «быть крещённым Тобой».
- source_word: βαπτισθῆναι
  choice: принять крещение
  rationale: Передаёт пассивный смысл крещения, не уточняя способ его совершения и не внося конфессиональных особенностей.
- source_word: καὶ σὺ ἔρχῃ πρός με;
  choice: а Ты приходишь ко мне?
  rationale: Союз «а» естественно выражает риторическое противопоставление, заложенное в καί и контексте, без добавочного толкования.
- source_word: δὲ
  choice: Но
  rationale: Передаёт контраст между приходом Иисуса для крещения и возражением Иоанна.
theological_decisions:
- issue: Возражение Иоанна против крещения Иисуса
  choice: Слова переданы как признание Иоанном собственной нужды принять крещение от Иисуса и как недоумение перед обратной ситуацией.
  alternative: Прямо объяснить возражение безгрешностью Иисуса либо исключительно превосходством Его положения.
  rationale: Сам стих не раскрывает полностью основание возражения; перевод сохраняет богословское напряжение и не добавляет отсутствующего в тексте объяснения.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской традиции. Формулировка избегает как архаизма «воспрещал», так и чрезмерно разговорного выражения.
