  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ, καὶ διακαθαριεῖ τὴν ἅλωνα αὐτοῦ καὶ συνάξει τὸν σῖτον αὐτοῦ εἰς τὴν ⸀ἀποθήκην, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/012.yaml
  text: His winnowing fork is in his hand[a], and he will thoroughly clear his threshing floor and gather his wheat into the storehouse[b], but the chaff he will burn up with unquenchable fire.
translation:
  language: ru
  text: В Его руке — веяльная лопата[a]; Он тщательно очистит Своё гумно и соберёт Свою пшеницу в житницу[b], а мякину сожжёт неугасимым огнём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лопата для веяния».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «зернохранилище».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: лопата для веяния
  rationale: Орудие, которым подбрасывали обмолоченное зерно, чтобы отделить его от мякины. Этот вариант точен и понятен современному читателю; возможное «веяльная лопата» менее естественно.
- source_word: διακαθαριεῖ
  choice: полностью очистит
  rationale: 'Передаёт усилительное значение составного глагола: гумно будет очищено окончательно и целиком.'
- source_word: ἅλωνα
  choice: гумно
  rationale: Традиционный и точный русский термин для площадки, где молотили и веяли зерно; контекст делает его понятным.
- source_word: σῖτον
  choice: пшеницу
  rationale: Хотя слово может обозначать зерно шире, в противопоставлении мякине естественно и конкретно означает пшеницу.
- source_word: ἀποθήκην
  choice: житницу
  rationale: Обозначает помещение для хранения зерна и естественно соответствует земледельческому образу; более общее «хранилище» менее образно.
- source_word: ἄχυρον
  choice: мякину
  rationale: В контексте веяния обозначает отделяемые от зерна лёгкие растительные остатки; «мякина» точнее контекстуального «солома».
- source_word: κατακαύσει
  choice: сожжёт
  rationale: Совершенный вид и приставочная форма естественно передают полное уничтожение огнём, выраженное усиленным греческим глаголом.
- source_word: πυρὶ ἀσβέστῳ
  choice: неугасимым огнём
  rationale: Творительный падеж передаёт средство действия, а «неугасимый» сохраняет смысл огня, который невозможно погасить.
- source_word: οὗ
  choice: у Него
  rationale: Относительное местоимение связывает стих с Грядущим из предыдущего контекста; русская конструкция «у Него в руке» естественно передаёт принадлежность.
theological_decisions:
- issue: Образ суда через отделение пшеницы от мякины
  choice: Сохранён конкретный земледельческий образ и будущие действия без расшифровки символов в основном тексте.
  alternative: Прямо назвать пшеницу и мякину праведными и нечестивыми.
  rationale: Сам стих оставляет высказывание в форме метафоры; перевод не должен устранять её напряжение или добавлять конфессиональное толкование.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Слова «гумно», «житница» и «мякина» сохраняют точность земледельческого образа; сноски поясняют основные лексические альтернативы. Местоимения, относящиеся к Мессии, написаны с прописной буквы в соответствии с принятой русской библейской традицией.
