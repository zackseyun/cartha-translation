review_pass:
  verdict: revise
  source_fidelity: 'Основная передача греческого текста точна: партитивное «многие из фарисеев и саддукеев», движение к крещению Иоанна, резкое «Порождения гадюк» и «грядущий гнев» верно отражают исходник. Однако «что надо бежать» добавляет модальный оттенок необходимости, которого в инфинитиве φυγεῖν нет; следует сохранить прямую мысль о бегстве.'
  naturalness: «Увидев же, что ... приходят» и «Порождения гадюк» приемлемы в современном литературном русском с пророчески-обличительным регистром. Конструкция «предупредил вас, что надо бежать» звучит естественно, но именно за счёт добавления смысла; «предупредил вас бежать» достаточно ясна и ближе к тексту.
  terminology: Названия групп переданы нормативно. «Гадюки» адекватно передаёт ἐχίδναι, а «гнев» сохраняет смысл ὀργή, не подменяя его судом или наказанием. Текстологическое утверждение в сноске о некоторых рукописях не обосновано предоставленным аппаратом и не требуется для перевода SBLGNT, поэтому его следует удалить.
