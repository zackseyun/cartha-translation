  - severity: medium
    issue: Сноска a содержит непроверяемое текстологическое утверждение об отсутствии «его» в некоторых рукописях.
    rationale: В представленном тексте SBLGNT стоит αὐτοῦ; без данных критического аппарата не следует вводить текстологическую сноску. Кроме того, заявленная альтернатива «к его крещению» не улучшает ясность русского текста.
  revised_text: 'Увидев же, что многие из фарисеев и саддукеев приходят на его крещение, он сказал им: «Порождения гадюк! Кто предупредил вас бежать от грядущего гнева?»'
