  text: Ἰδὼν δὲ πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων ἐρχομένους ἐπὶ τὸ βάπτισμα ⸀αὐτοῦ εἶπεν αὐτοῖς· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/007.yaml
  text: But when he saw many of the Pharisees and Sadducees coming for his baptism[a], he said to them, “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: ru
  text: 'Увидев же, что многие из фарисеев и саддукеев приходят на его крещение, он сказал им: «Порождения гадюк! Кто предупредил вас бежать от грядущего гнева?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Увидев же
  rationale: Деепричастная конструкция естественно передаёт аористное причастие, а «же» сохраняет мягкий повествовательный переход δέ.
- source_word: πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: многие из фарисеев и саддукеев
  rationale: 'Конструкция с родительным падежом имеет партитивный смысл: речь идёт о многих представителях этих групп, а не обязательно обо всех.'
- source_word: ἐρχομένους ἐπὶ τὸ βάπτισμα αὐτοῦ
  choice: приходят на его крещение
  rationale: Формулировка сохраняет движение к крещению Иоанна и не утверждает прямо, что пришедшие действительно были им крещены.
- source_word: Γεννήματα ἐχιδνῶν
  choice: Порождения гадюк
  rationale: «Порождения» передаёт γεννήματα во множественном числе, а «гадюк» — образ ядовитых змей без архаичного и двусмысленного в современном русском слова «ехидн».
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: Кто предупредил вас
  rationale: В сочетании с призывом бежать глагол имеет значение не простого показа, а настоятельного предупреждения.
- source_word: φυγεῖν ἀπὸ
  choice: бежать от
  rationale: Сохраняется непосредственный образ бегства, выраженный φυγεῖν, без ослабления до отвлечённого «избежать».
- source_word: τῆς μελλούσης ὀργῆς
  choice: грядущего гнева
  rationale: «Грядущий» передаёт приближающийся, ожидаемый характер μελλούσης, а «гнев» сохраняет силу и богословскую напряжённость ὀργή.
theological_decisions:
- issue: Кого охватывает обличение
  choice: многие из фарисеев и саддукеев
  alternative: фарисеи и саддукеи вообще
  rationale: Партитивная греческая конструкция указывает на многих представителей этих групп и не даёт оснований распространять характеристику без различия на каждого их члена.
- issue: Смысл ὀργή
  choice: гнев
  alternative: суд; наказание
  rationale: «Гнев» прямо передаёт ὀργή и сохраняет эсхатологическую и личностно-богословскую напряжённость текста, не сводя её лишь к последствиям или судебной процедуре.
- issue: Намерение пришедших
  choice: приходят на его крещение
  alternative: приходят к нему креститься
  rationale: Греческий текст сообщает, что они направлялись к крещению Иоанна, но в этом стихе прямо не утверждает ни их окончательного намерения принять крещение, ни самого факта крещения.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой выразительностью. «Порождения гадюк» сохраняет резкость обращения без архаизма; порядок слов и частица «же» поддерживают достоинство повествования. Прямая речь оформлена естественно для современной русской пунктуации.
