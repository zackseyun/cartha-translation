  rationale: Убраны необоснованная текстологическая сноска и соответствующий маркер [a]. Формулировка вопроса исправлена так, чтобы не добавлять «надо», сохраняя инфинитив φυγεῖν и образ бегства. Лексические альтернативы для образного обращения и грядущего гнева сохранены; их маркеры перенесены к соответствующим словам.
