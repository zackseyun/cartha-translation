id: MAT.3.4
reference: Matthew 3:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: αὐτὸς δὲ ὁ Ἰωάννης εἶχεν τὸ ἔνδυμα αὐτοῦ ἀπὸ τριχῶν καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, ἡ δὲ τροφὴ ⸂ἦν αὐτοῦ⸃ ἀκρίδες καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/004.yaml
  text: John himself wore clothing made of camel’s hair and a leather belt around his waist[c][b][a], and his food was locusts and wild honey.
translation:
  language: ru
  text: Сам Иоанн носил одежду из верблюжьего волоса и кожаный пояс на талии[a], а пищей ему служили саранча и дикий мёд.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Одежда Иоанна напоминает об облике пророка Илии (4 Цар. 1:8); это важный фон для того, как Матфей представляет Иоанна.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτὸς δὲ ὁ Ἰωάννης
  choice: Сам Иоанн
  rationale: Эмфатическое αὐτός передано словом «сам»; слабый связующий оттенок δέ естественно выражается построением фразы без отдельного вводного слова.
- source_word: εἶχεν τὸ ἔνδυμα αὐτοῦ
  choice: носил одежду
  rationale: Буквально εἶχεν означает «имел», однако в описании одежды естественное русское «носил» точно передаёт продолжающееся состояние и не создаёт двусмысленности.
- source_word: ἀπὸ τριχῶν καμήλου
  choice: из верблюжьего волоса
  rationale: Предлог ἀπό здесь указывает на материал; «верблюжий волос» — точное и естественное обозначение материала одежды.
- source_word: ζώνην δερματίνην
  choice: кожаный пояс
  rationale: ζώνη обозначает пояс, а δερματίνη уточняет, что он был сделан из кожи.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: на талии
  rationale: Так естественно по-русски передаётся расположение пояса; «на чреслах» было бы неоправданно архаичным.
- source_word: ἡ δὲ τροφὴ ἦν αὐτοῦ
  choice: а пищей ему служили
  rationale: Формулировка сохраняет именную конструкцию оригинала и при этом звучит естественно; δέ передано противительно-присоединительным «а».
- source_word: ἀκρίδες
  choice: саранча
  rationale: Основное лексическое значение — съедобное насекомое, саранча; оснований заменять его названием растения нет.
- source_word: μέλι ἄγριον
  choice: дикий мёд
  rationale: Прямое и устойчивое соответствие, обозначающее мёд, добытый в дикой природе.
theological_decisions:
- issue: Пророческий аскетизм и сходство с Илиёй
  choice: Передать внешность и пищу Иоанна прямо, а связь с Илиёй отметить в сноске.
  alternative: Внести в основной текст формулировку, явно называющую Иоанна подобным Илии.
  rationale: Греческий текст лишь описывает одежду и пищу Иоанна. Возможная отсылка к 4 Цар 1:8 важна, но не должна превращаться в добавленное толкование внутри перевода.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования; избегаются архаизмы «чресла» и тяжеловесное буквальное «имел одежду». Слово «саранча» сохраняет конкретное значение оригинала.
