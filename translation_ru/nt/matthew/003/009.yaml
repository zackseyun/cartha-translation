  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ μὴ δόξητε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/009.yaml
  text: And do not presume to say among yourselves[a], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: ru
  text: 'И не вздумайте говорить между собой[a]: «Наш отец — Авраам». Ведь говорю вам: Бог может из этих камней воздвигнуть детей Аврааму.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорить про себя». Греческое выражение может обозначать как внутреннюю речь, так и разговор людей между собой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δόξητε
  choice: не вздумайте
  rationale: Запрет с μή и аористом сослагательного наклонения предостерегает от принятия самоуверенной ложной установки; «не вздумайте» естественно передаёт строгость предостережения, не сводя его к нейтральному «не думайте».
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: говорить между собой
  rationale: Множественное возвратное выражение допускает как внутреннюю речь, так и разговор внутри группы. Основной текст естественно передаёт групповое значение, а сноска сохраняет вторую возможность.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: Наш отец — Авраам
  rationale: Естественная современная русская формулировка сохраняет притязание на происхождение от Авраама и связанную с ним уверенность в особом положении.
- source_word: λέγω γὰρ ὑμῖν
  choice: Ведь говорю вам
  rationale: «Ведь» передаёт пояснительное γάρ, а «говорю вам» сохраняет торжественную формулу исходного текста.
- source_word: δύναται
  choice: может
  rationale: В современном русском «может» ясно и естественно выражает способность и силу Бога без стилистической тяжеловесности.
- source_word: ἐκ τῶν λίθων τούτων
  choice: из этих камней
  rationale: Точно сохраняет исходный образ и значение ἐκ.
- source_word: ἐγεῖραι
  choice: воздвигнуть
  rationale: Передаёт значение создания или появления потомков и сохраняет библейскую выразительность глагола, не утверждая здесь смысл воскресения.
- source_word: τέκνα
  choice: детей
  rationale: Гендерно нейтрально обозначает детей или потомков; «сыновей» неоправданно сужало бы значение.
- source_word: τῷ Ἀβραάμ
  choice: Аврааму
  rationale: Дательный падеж естественно сохраняет отношение этих детей к Аврааму как к праотцу; контекст проясняет смысл потомства.
theological_decisions:
- issue: Значение происхождения от Авраама в предостережении Иоанна
  choice: Стих отвергает уверенность в том, что физического происхождения от Авраама самого по себе достаточно перед Богом, но не отрицает исторического отцовства Авраама по отношению к Израилю.
  alternative: Понимать слова лишь как риторическую гиперболу без критики упования на происхождение либо как утверждение о замещении этнического Израиля.
  rationale: Формулировка прямо обличает самоуверенную опору на родословие, однако сам стих не высказывает более широких выводов о замещении и не даёт оснований вносить их в перевод.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. «Не вздумайте» передаёт резкость обличения; «воздвигнуть» сохраняет образность и повышенный регистр, не делая фразу архаичной.
