source:
  edition: SBLGNT
  text: ⸂βαπτισθεὶς δὲ⸃ ὁ Ἰησοῦς ⸂εὐθὺς ἀνέβη⸃ ἀπὸ τοῦ ὕδατος· καὶ ἰδοὺ ⸀ἠνεῴχθησαν οἱ οὐρανοί, καὶ εἶδεν ⸀πνεῦμα θεοῦ καταβαῖνον ὡσεὶ ⸀περιστερὰν ἐρχόμενον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/016.yaml
  text: And when Jesus was baptized[a], he immediately came up from the water. And behold, the heavens were opened[c][b], and he saw the Spirit of God descending like a dove and coming upon him.
translation:
  language: ru
  text: Когда Иисус был крещён, он тотчас поднялся из воды[a]. И вот, небеса раскрылись, и он увидел Духа Божьего, нисходящего, словно голубь, и приближающегося к нему[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднялся от воды»; греческий предлог ἀπό означает «от», хотя по-русски здесь естественно сказать «из воды».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «идущего (или приходящего) на него». Греческий глагол обозначает приход или движение к цели; сам по себе он не означает специально «опускаться» или «садиться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαπτισθεὶς δὲ ὁ Ἰησοῦς
  choice: Крестившись, Иисус
  rationale: Аористное страдательное причастие обозначает действие, предшествующее главному глаголу. Русское деепричастие естественно передаёт последовательность, не добавляя избыточного временного уточнения; страдательный смысл крещения в русском возвратном глаголе сохраняется по норме употребления.
- source_word: εὐθὺς
  choice: тотчас
  rationale: Передаёт немедленность действия в ясном, литературном и несколько возвышенном повествовательном регистре.
- source_word: ἀνέβη ἀπὸ τοῦ ὕδατος
  choice: поднялся из воды
  rationale: Глагол передаёт движение вверх, а сочетание естественно звучит по-русски. Поскольку ἀπό буквально означает «от», а не обязательно «изнутри», точность предлога отмечена в сноске.
- source_word: ἰδοὺ
  choice: И вот
  rationale: Сохраняет функцию указания на внезапное и значимое событие, оставаясь естественным для современного русского повествования.
- source_word: ἠνεῴχθησαν οἱ οὐρανοί
  choice: небеса раскрылись
  rationale: Сохраняется множественное число οἱ οὐρανοί и библейский образ; русская возвратная форма естественно передаёт греческий пассив без тяжеловесного «были раскрыты».
- source_word: πνεῦμα θεοῦ
  choice: Духа Божьего
  rationale: Точно передаёт определительное сочетание и в данном контексте естественно указывает на Божьего Духа, не заменяя выражение более истолковывающим титулом «Святой Дух».
- source_word: καταβαῖνον ὡσεὶ περιστερὰν
  choice: нисходящего, словно голубь
  rationale: Причастие сохраняет процесс движения вниз, а «словно» ясно выражает сравнение, не отождествляя Духа с голубем буквально.
- source_word: ἐρχόμενον ἐπ’ αὐτόν
  choice: опускающегося на него
  rationale: Естественно передаёт направленное движение к Иисусу и на него. Поскольку ἐρχόμενον буквально означает «идущего/приходящего», а не специально «опускающегося», это уточняется в сноске.
theological_decisions:
- issue: Следует ли переводить πνεῦμα θεοῦ как общий дух или как Божьего Духа
  choice: Духа Божьего
  alternative: духа от Бога
  rationale: Контекст крещения указывает на Божьего Духа, однако перевод сохраняет собственную формулировку греческого текста и не подставляет более определённое выражение «Святой Дух».
- issue: Описывает ли ὡσεὶ περιστερὰν подобие или буквальное превращение Духа в голубя
  choice: словно голубь
  alternative: в виде голубя
  rationale: ὡσεὶ является показателем сравнения. Формулировка сохраняет открытым вопрос, относится ли образ к виду или характеру нисхождения, и не утверждает буквального тождества.
- issue: К кому относится подлежащее εἶδεν («увидел»)
  choice: он увидел
  alternative: Иоанн увидел
  rationale: В ближайшей грамматической связи подлежащим естественно является Иисус. Имя не подставляется, чтобы не устранять местоименную форму оригинала и не усиливать толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «И вот», «небеса» и «нисходящего» сохраняют торжественность и образность, оставаясь понятными. Местоимения о Боге и Иисусе даны со строчной буквы в соответствии с обычной современной редакционной практикой и регистром исходного текста.
