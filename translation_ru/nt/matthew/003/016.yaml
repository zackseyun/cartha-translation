- from: Крестившись, Иисус тотчас поднялся из воды[a]. И вот, небеса раскрылись, и он увидел Духа Божьего, нисходящего, словно голубь, и опускающегося на него[b].
  to: Когда Иисус был крещён, он тотчас поднялся из воды[a]. И вот, небеса раскрылись, и он увидел Духа Божьего, нисходящего, словно голубь, и приближающегося к нему[b].
  rationale: Страдательный залог βαπτισθείς восстановлен в основной строке. «Опускающегося на него» заменено на «приближающегося к нему», чтобы не вносить дополнительного значения и при этом сохранить направленность движения; сноска прозрачно отмечает более буквальное значение сочетания с ἐπί. Остальные решения соответствуют греческому тексту и современному литературному русскому.
