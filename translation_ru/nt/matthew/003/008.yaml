  text: ποιήσατε οὖν καρπὸν ἄξιον τῆς μετανοίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/008.yaml
  text: Therefore[a], produce fruit worthy of repentance.
translation:
  language: ru
  text: Итак, принесите плод, достойный покаяния.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плод, соответствующий покаянию».'
    reason: Передаёт оттенок соответствия, возможный у ἄξιον с родительным падежом, без предположения о заслуге.
lexical_decisions:
- source_word: ποιήσατε
  choice: принесите
  rationale: Аористный повелительный глагол во множественном числе выражает настоятельный призыв к действию. В русском языке сочетание «принести плод» естественно передаёт образ, хотя буквально ποιέω означает «делать, производить».
- source_word: οὖν
  choice: итак
  rationale: Связывает повеление с предшествующим обличением и передаёт вывод или следствие естественным современным русским словом.
- source_word: καρπὸν
  choice: плод
  rationale: 'Сохранён метафорический коллективный единственный падеж: речь идёт о видимом результате, проявляющемся в поступках.'
- source_word: ἄξιον
  choice: достойный
  rationale: Прямо передаёт ἄξιος с родительным падежом, сохраняя при этом возможный смысл соответствия покаянию.
- source_word: μετανοίας
  choice: покаяния
  rationale: Устоявшийся, точный и естественный русский эквивалент, обозначающий внутреннюю перемену и обращение, к которым призывает Иоанн.
theological_decisions:
- issue: Смысл выражения καρπὸν ἄξιον τῆς μετανοίας
  choice: Плод, соответствующий подлинному покаянию и служащий его видимым проявлением
  alternative: Плод, заслуживающий или приобретающий покаяние
  rationale: Сочетание ἄξιος с родительным падежом здесь обозначает соответствие и уместность, а не заслугу. Формулировка сохраняет нравственное требование текста, не представляя дела причиной или ценой покаяния.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости, повелительной силы и традиционного библейского образа плода. «Итак» звучит естественнее, чем более тяжеловесное «поэтому» в данном кратком призыве.
