  text: Ἐν δὲ ταῖς ἡμέραις ἐκείναις παραγίνεται Ἰωάννης ὁ βαπτιστὴς κηρύσσων ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/001.yaml
  text: In those days John the Baptist came[a], preaching in the wilderness of Judea[b],
translation:
  language: ru
  text: В те дни пришёл Иоанн Креститель[a][b], проповедуя в Иудейской пустыне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иоанн Крестящий».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «явился»; в греческом тексте употреблено историческое настоящее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ἐκείναις
  choice: В те дни
  rationale: Предложная конструкция выражает время. Частица δέ здесь служит мягким повествовательным переходом и не требует отдельного перевода союзом или наречием.
- source_word: παραγίνεται
  choice: пришёл
  rationale: Историческое настоящее естественно передано русским прошедшим временем; глагол вводит Иоанна в повествование без оттенка чудесного появления.
- source_word: Ἰωάννης ὁ βαπτιστὴς
  choice: Иоанн Креститель
  rationale: Традиционная и понятная русская форма имени и устойчивого прозвания; буквальный смысл прозвания пояснён в сноске.
- source_word: κηρύσσων
  choice: и стал проповедовать
  rationale: Причастие обозначает действие Иоанна при его появлении. Личная глагольная конструкция звучит по-русски естественно, а «стал» передаёт начало описываемого служения, не добавляя его содержания.
- source_word: ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
  choice: в Иудейской пустыне
  rationale: ἔρημος означает безлюдную, пустынную местность, а не обязательно песчаную пустыню; «Иудейская пустыня» — естественное русское географическое обозначение.
theological_decisions:
- issue: Передача прозвания βαπτιστής
  choice: Креститель
  alternative: Крестящий
  rationale: «Креститель» — укоренившееся русское прозвание Иоанна. Вариант «Крестящий» яснее показывает деятельное значение греческого слова, поэтому указан в сноске; выбор не решает вопрос о способе или богословском значении крещения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для обычного читателя; историческое настоящее передано прошедшим временем. Все маркеры сносок размещены непосредственно после поясняемых выражений.
