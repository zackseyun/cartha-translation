  source_fidelity: 'Греческое κηρύσσων — настоящее действительное причастие, описывающее сопутствующее действие при παραγίνεται: Иоанн появляется/приходит, проповедуя. В черновике «и стал проповедовать» добавляет значение начала действия, которого в оригинале нет. «Пришёл» допустимо передаёт историческое настоящее παραγίνεται в русском повествовании.'
  naturalness: «В те дни пришёл Иоанн Креститель, проповедуя в Иудейской пустыне» — естественная для современного литературного русского, сдержанно библейская конструкция. Она сохраняет связь между появлением Иоанна и его проповедью без лишнего оттенка.
  terminology: «Иоанн Креститель» — нормативное и общеупотребительное русское прозвание для Ἰωάννης ὁ βαπτιστής. «Иудейская пустыня» корректно передаёт географическое τῇ ἐρήμῳ τῆς Ἰουδαίας; слово «пустыня» не следует уточнять так, будто речь обязательно идёт о песчаной местности. Сноска об историческом настоящем должна быть привязана к «пришёл», а не к географическому выражению, согласно смыслу английского аудиторского следа.
