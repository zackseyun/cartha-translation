  rationale: Причастная конструкция «проповедуя» непосредственно передаёт κηρύσσων и устраняет невыраженное в оригинале значение начала проповеди. Сноска об историческом настоящем перенесена к «пришёл», то есть к παραγίνεται, и приведена в соответствие с английским аудиторским решением. Сноска к титулу сохранена.
