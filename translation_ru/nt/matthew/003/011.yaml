id: MAT.3.11
reference: Matthew 3:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν ⸂ὑμᾶς βαπτίζω⸃ ἐν ὕδατι εἰς μετάνοιαν· ὁ δὲ ὀπίσω μου ἐρχόμενος ἰσχυρότερός μού ἐστιν, οὗ οὐκ εἰμὶ ἱκανὸς τὰ ὑποδήματα βαστάσαι· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ ⸂καὶ πυρί⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/011.yaml
  text: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I, whose sandals I am not worthy to carry[c][b]. He himself will baptize you in the Holy Spirit and fire.
translation:
  language: ru
  text: Я крещу вас в воде для покаяния[a], но тот, кто идёт за мной, сильнее меня; я недостоин нести его сандалии. Он сам будет крестить вас в Святом Духе и огне[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крещу вас водой к покаянию». Предлог ἐν может здесь передавать как сферу («в воде»), так и средство («водой»), а εἰς — направленность или цель; фраза сама по себе не уточняет полностью связь покаяния с крещением.'
    reason: lexical_alternative
  - marker: b
    text: Образ огня может указывать на очищение или на суд; греческая формулировка не устраняет этой смысловой напряжённости, а ближайший контекст помогает её осмыслить.
    reason: alternative_reading
lexical_decisions:
- source_word: βαπτίζω / βαπτίσει
  choice: крещу / будет крестить
  rationale: Устоявшийся русский глагол сохраняет ритуальный смысл, не уточняя способ совершения крещения сверх сказанного в тексте.
- source_word: ἐν ὕδατι
  choice: в воде
  rationale: Передаёт конструкцию с ἐν близко к форме оригинала и сохраняет параллель с последующим «в Святом Духе и огне»; инструментальное понимание отмечено в сноске.
- source_word: εἰς μετάνοιαν
  choice: для покаяния
  rationale: Кратко передаёт направленность или целевое значение εἰς, не определяя однозначно временную либо причинную связь между покаянием и крещением.
- source_word: ὁ δὲ ὀπίσω μου ἐρχόμενος
  choice: но Идущий за мной
  rationale: Сохраняет субстантивированное причастие и последовательность служений; прописная буква уместна как обозначение конкретного ожидаемого Лица.
- source_word: ἰσχυρότερός μού
  choice: сильнее меня
  rationale: Прямой, современный и естественный перевод сравнительной формы без архаизации.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: я недостоин
  rationale: В формуле смирения «недостоин» естественно передаёт контекстуальное значение ἱκανός — пригодности или достаточности для низкого служения.
- source_word: τὰ ὑποδήματα βαστάσαι
  choice: нести Его сандалии
  rationale: βαστάσαι означает «нести», а не «снимать»; «сандалии» точно передаёт предмет древней обуви.
- source_word: αὐτὸς
  choice: Он Сам
  rationale: Сохраняет эмфатическое противопоставление служению Иоанна.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: в Святом Духе
  rationale: Сохраняет параллельную конструкцию с ἐν; «Святой Дух» передаёт личностного референта в данном контексте.
- source_word: καὶ πυρί
  choice: и огне
  rationale: Буквальная координация сохраняет открытым вопрос о том, означает ли огонь очищение, суд или оба образных аспекта.
theological_decisions:
- issue: Значение выражения «в Святом Духе и огне»
  choice: Сохранить буквальную формулировку без пояснения в основном тексте.
  alternative: «в Святом Духе и очищающем огне» или «в Святом Духе и огне суда»
  rationale: Греческий текст не называет функцию огня прямо; ближайший контекст допускает связь с судом, тогда как сам образ может нести и очистительный оттенок. Перевод не должен устранять эту напряжённость.
- issue: Референт πνεύματι ἁγίῳ
  choice: «Святой Дух»
  alternative: «святой дух» или «святая духовная сила»
  rationale: В контексте Матфея выражение естественно относится к Святому Духу; добавление идеи безличной силы выходило бы за пределы текста.
- issue: Связь крещения и покаяния в εἰς μετάνοιαν
  choice: «для покаяния» с пояснением диапазона значения в сноске
  alternative: «к покаянию» или интерпретирующее указание, что крещение вызывает либо только символизирует покаяние
  rationale: εἰς выражает направленность или цель, но сама фраза не исчерпывает богословскую связь крещения с покаянием.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан естественным для широкого читателя; сохранены параллелизм конструкций «в воде» / «в Святом Духе и огне», эмфаза «Он Сам» и неоднозначность образа огня.
