  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν ⸂πρὸς αὐτόν⸃· Ἄφες ἄρτι, οὕτως γὰρ πρέπον ἐστὶν ἡμῖν πληρῶσαι πᾶσαν δικαιοσύνην. τότε ἀφίησιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/015.yaml
  text: But Jesus answered him[a], “Permit it for now, for in this way it is fitting for us to fulfill all righteousness.” Then he permitted him.
translation:
  language: ru
  text: 'Но Иисус сказал ему в ответ: «Пусть пока будет так, ведь так нам подобает исполнить всю праведность[a]». Тогда Иоанн позволил ему креститься.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всю справедливость». Греческое слово может означать как праведность, так и справедливость; здесь «праведность» лучше соответствует характерному для Матфея акценту на исполнении Божьей воли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: Но Иисус сказал ему в ответ
  rationale: Оборот ἀποκριθεὶς… εἶπεν естественно передаётся по-русски как «сказал в ответ», а δέ обозначает противопоставление возражению Иоанна в предыдущем стихе.
- source_word: Ἄφες ἄρτι
  choice: Пусть пока будет так
  rationale: ἀφίημι здесь означает разрешить или не препятствовать, а не «простить»; ἄρτι указывает на настоящий момент и допускает временной оттенок. Русская формулировка естественно передаёт просьбу Иисуса позволить совершиться крещению сейчас.
- source_word: οὕτως γὰρ
  choice: ведь так
  rationale: οὕτως указывает на названный способ действия — крещение Иисуса Иоанном; γάρ вводит основание просьбы.
- source_word: πρέπον ἐστὶν ἡμῖν
  choice: нам подобает
  rationale: «Подобает» сохраняет значение нравственной и ситуативной уместности, оставаясь понятным в современном литературном русском языке.
- source_word: πληρῶσαι
  choice: исполнить
  rationale: «Исполнить» сохраняет характерный для Матфея смысл осуществления Божьего замысла и лучше соответствует русской библейской речи, чем буквальное «наполнить».
- source_word: πᾶσαν δικαιοσύνην
  choice: всю праведность
  rationale: Формулировка сохраняет широту греческого выражения и его связь с исполнением праведной воли Бога, не сужая смысл до отдельных требований закона.
- source_word: τότε ἀφίησιν αὐτόν
  choice: Тогда Иоанн позволил ему креститься
  rationale: Историческое настоящее передано русским прошедшим временем. Имена действия и участников раскрыты из непосредственного контекста, чтобы избежать неясной цепочки местоимений; смысл состоит в том, что Иоанн согласился крестить Иисуса.
theological_decisions:
- issue: Значение выражения πᾶσαν δικαιοσύνην
  choice: Широкое указание на исполнение праведной воли Бога посредством крещения Иисуса Иоанном
  alternative: Исполнение всех требований закона или осуществление всей справедливости
  rationale: Контекст говорит о надлежащем в данный момент действии, не сводя выражение к юридическому соблюдению закона. Перевод «праведность» сохраняет характерную для Матфея богословскую широту, а возможное значение «справедливость» отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Подобает» сохраняет достоинство речи без архаизации; «Пусть пока будет так» передаёт разрешительный смысл повеления естественнее буквального «оставь теперь».
