  text: οὗτος γάρ ἐστιν ὁ ῥηθεὶς ⸀διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/003.yaml
  text: 'For this is the one spoken of through Isaiah the prophet[a], saying: “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: ru
  text: 'Ведь именно о нём было сказано через пророка Исаию: «Голос взывающего в пустыне[b]: „Приготовьте путь Господу[a], сделайте прямыми его тропы“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В Ис 40:3 еврейский текст здесь содержит личное имя Бога YHWH (Яхве); поэтому возможно: «приготовьте путь Яхве».'
    reason: alternative_reading
  - marker: b
    text: 'Возможно иное пунктуационное членение: «Голос взывающего: „В пустыне приготовьте путь Господу…“».'
    reason: textual_punctuation_ambiguity
lexical_decisions:
- source_word: οὗτος γάρ ἐστιν
  choice: Ибо это тот
  rationale: Сохраняет пояснительную функцию γάρ и указательную силу οὗτος, относящегося к Иоанну Крестителю.
- source_word: ὁ ῥηθεὶς διὰ Ἠσαΐου τοῦ προφήτου
  choice: о ком было сказано через пророка Исаию
  rationale: 'Передаёт субстантивированное пассивное причастие и сохраняет διά с оттенком посредничества: Бог изрекает слова через пророка.'
- source_word: Φωνὴ βοῶντος
  choice: Голос взывающего
  rationale: «Взывающего» передаёт сильное публичное провозглашение без излишне архаичного «вопиющего»; родительная конструкция оригинала сохранена.
- source_word: ἐν τῇ ἐρήμῳ
  choice: в пустыне
  rationale: Естественное русское обозначение безлюдной пустынной местности, соответствующее контексту служения Иоанна и цитате из Исаии.
- source_word: Ἑτοιμάσατε τὴν ὁδὸν κυρίου
  choice: Приготовьте путь Господу
  rationale: Императив передан прямо; дательный «Господу» естественно выражает приготовление пути для Господа, сохраняя значение греческого κυρίου.
- source_word: εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ
  choice: сделайте прямыми его тропы
  rationale: Сохраняет дорожную метафору, множественное число τρίβους и личное местоимение αὐτοῦ; порядок слов естественен для современного русского языка.
theological_decisions:
- issue: Передача κυρίου в цитате из Ис 40:3, где еврейский текст содержит имя YHWH
  choice: Господу
  alternative: Яхве
  rationale: Основной текст следует греческому κυρίου и обычной русской передаче «Господь», а еврейский фон с Божьим именем отмечен в сноске, не устраняя межтекстовое напряжение.
- issue: К чему относится оборот «в пустыне»
  choice: 'к взывающему: «Голос взывающего в пустыне»'
  alternative: 'к повелению: «Голос взывающего: „В пустыне приготовьте путь…“»'
  rationale: В греческом тексте Матфея оборот наиболее естественно относится к βοῶντος и соответствует непосредственному описанию Иоанна, однако древние рукописи не имели современной пунктуации, а еврейский текст Ис 40:3 допускает иное членение; альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой цитаты. Избегается архаичное «глас вопиющего»; кавычки разграничивают внешнюю цитату и слова возгласа. Местоимение «его» оставлено со строчной буквы согласно современной нейтральной норме.
