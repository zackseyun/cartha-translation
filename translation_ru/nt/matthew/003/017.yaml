  text: καὶ ἰδοὺ φωνὴ ἐκ τῶν οὐρανῶν λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/017.yaml
  text: And behold[a], a voice from the heavens said, “This is my beloved Son[b], with whom I am well pleased.”
translation:
  language: ru
  text: 'И вот, голос с небес произнёс: «Это Мой возлюбленный Сын, Которым Я доволен».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «в Котором Я благоволил».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: И вот
  rationale: Передаёт вводный указательный оборот, привлекающий внимание к знаменательному событию, естественно и торжественно для современного русского текста.
- source_word: φωνὴ
  choice: голос
  rationale: В контексте обозначает членораздельный голос, поскольку далее следует прямая речь.
- source_word: ἐκ τῶν οὐρανῶν
  choice: с небес
  rationale: Сохраняет множественное число греческого οὐρανῶν и при этом является естественным русским выражением.
- source_word: λέγουσα
  choice: произнёс
  rationale: Причастие вводит содержание речи; личная форма устраняет неестественную конструкцию «голос… говорящий» и согласуется со словом «голос».
- source_word: Οὗτός ἐστιν
  choice: Это
  rationale: Естественно передаёт прямое указание и отождествление; в русском именном предложении связка настоящего времени не требуется.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: Мой возлюбленный Сын
  rationale: Сохраняет сыновнее именование и значение ἀγαπητός — «любимый, возлюбленный» — в возвышенном, но понятном регистре.
- source_word: ἐν ᾧ εὐδόκησα
  choice: Которым Я доволен
  rationale: Естественно передаёт греческий оборот с εὐδοκέω как выражение благоволения и одобрения, не приписывая аористу избыточного аспектуального значения.
theological_decisions:
- issue: Сыновство Иисуса в небесном провозглашении
  choice: Мой возлюбленный Сын
  alternative: Мой любимый Сын
  rationale: Перевод прямо сохраняет сыновнее именование и особую любовь, выраженные в греческом тексте, не добавляя объяснения о природе или способе этого сыновства.
- issue: Оборот ἐν ᾧ εὐδόκησα
  choice: Которым Я доволен
  alternative: в Котором Моё благоволение
  rationale: Основной текст передаёт смысл божественного одобрения естественным современным русским языком; более буквальный и торжественный вариант приведён в примечании, чтобы сохранить возможный оттенок пребывающего благоволения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «И вот» и «возлюбленный» сохраняют торжественность, а синтаксис остаётся ясным для обычного читателя. Местоимения, относящиеся к Богу и Христу в прямой речи, написаны с прописной буквы согласно распространённой русской библейской издательской традиции.
