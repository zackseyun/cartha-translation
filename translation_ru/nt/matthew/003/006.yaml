  text: καὶ ἐβαπτίζοντο ἐν τῷ Ἰορδάνῃ ⸀ποταμῷ ὑπ’ αὐτοῦ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/006.yaml
  text: and they were being baptized by him in the Jordan River[a], confessing their sins.
translation:
  language: ru
  text: И крестились[a] у него в реке Иордане, исповедуя свои грехи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были крещены им»; греческая форма может подчёркивать продолжавшееся или повторявшееся действие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβαπτίζοντο
  choice: крестились
  rationale: Русская возвратная форма естественно передаёт обряд, совершаемый над людьми Иоанном; несовершенный вид отражает длительное или повторяющееся действие, не уточняя способ крещения.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: в реке Иордане
  rationale: Предлог ἐν имеет здесь локативное значение, а ποταμῷ прямо называет Иордан рекой; форма «в реке Иордане» естественна для современного литературного русского языка.
- source_word: ὑπ’ αὐτοῦ
  choice: у него
  rationale: В сочетании с русским «крестились» оборот «у него» идиоматично обозначает служителя крещения и сохраняет местоименную отсылку к Иоанну, не заменяя её именем.
- source_word: ἐξομολογούμενοι
  choice: исповедуя
  rationale: Деепричастие передаёт одновременность с основным действием и выражает открытое признание проступков в контексте покаяния.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: свои грехи
  rationale: Возвратное притяжательное местоимение естественно соотносит грехи с подлежащим; множественное число сохраняет греческую форму.
- source_word: καὶ
  choice: и
  rationale: Простой соединительный союз сохраняет связь с предшествующим повествованием.
theological_decisions:
- issue: Терминология и способ крещения
  choice: крестились
  alternative: погружались; омывались
  rationale: Глагол βαπτίζω здесь обозначает установленный обряд, но сам стих не формулирует способ его совершения. «Крестились» сохраняет термин и не привносит конфессионального вывода.
- issue: Залог и роль Иоанна
  choice: крестились у него
  alternative: были крещены им
  rationale: Форма «у него» естественна по-русски и ясно указывает, что крещение совершал Иоанн, при этом не делает фразу излишне тяжеловесной. Альтернатива точнее формально выражает страдательный залог, но звучит менее плавно.
translation_notes:
  register: Современный литературный русский язык с естественным библейским достоинством. Несовершенный вид «крестились» сохраняет повествовательную длительность; порядок слов остаётся плавным и понятным.
