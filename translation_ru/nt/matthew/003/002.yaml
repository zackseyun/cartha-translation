lexical_decisions:
- source_word: καὶ λέγων
  choice: и говорил
  rationale: Причастная конструкция продолжает повествование предыдущего стиха. В русском связное личное сказуемое звучит естественнее буквального «и говоря», не добавляя более узкого смысла «проповедовал» или «провозглашал».
- source_word: Μετανοεῖτε
  choice: Покайтесь
  rationale: Настоящее повелительное наклонение во втором лице множественного числа призывает к решительной и продолжающейся переориентации мышления и жизни. «Покайтесь» — естественный и укоренившийся русский библейский эквивалент; примечание предохраняет его от сужения до одного лишь чувства вины или сожаления.
- source_word: γὰρ
  choice: потому что
  rationale: Союз вводит основание призыва. «Потому что» ясно и естественно передаёт причинную связь в современной русской речи.
- source_word: ἤγγικεν
  choice: приблизилось
  rationale: 'Перфект ἐγγίζω указывает на совершившееся приближение с сохраняющимся результатом: Царство уже подошло близко. Русское совершенное «приблизилось» сохраняет этот смысл.'
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Небесное Царство
  rationale: Передаёт характерное для Матфея выражение естественной и традиционно понятной русской формой, сохраняя смысл царствования и царства без замены авторской формулировки на истолковывающее «Божье правление».
theological_decisions:
- issue: Смысл призыва μετανοεῖτε
  choice: Покайтесь
  alternative: Измените образ мыслей
  rationale: Глагол включает глубокую перемену мышления и жизненной направленности, а не только переживание вины. Основной текст сохраняет ёмкое русское «покайтесь», а примечание поясняет широту призыва, не сводя его ни к одной эмоции, ни только к интеллектуальной перемене.
- issue: Выражение «Царство Небес»
  choice: Небесное Царство
  alternative: Царство небес; Божье царствование
  rationale: Сохраняется особая формулировка Матфея и присущая слову βασιλεία напряжённость между царским правлением и царством. Перевод не подменяет её синоптическим выражением «Царство Божье».
translation_notes:
  register: Современный литературный русский язык с достоинством краткого пророческого воззвания. Традиционные библейские слова сохранены там, где они остаются понятными, а возможное смысловое сужение разъяснено в примечаниях.
