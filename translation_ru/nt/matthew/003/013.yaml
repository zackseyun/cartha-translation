id: MAT.3.13
reference: Matthew 3:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τότε παραγίνεται ὁ Ἰησοῦς ἀπὸ τῆς Γαλιλαίας ἐπὶ τὸν Ἰορδάνην πρὸς τὸν Ἰωάννην τοῦ βαπτισθῆναι ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/013.yaml
  text: Then Jesus comes from Galilee to the Jordan[a], to John[c][b], to be baptized by him.
translation:
  language: ru
  text: Тогда Иисус приходит из Галилеи к Иордану, к Иоанну, чтобы принять от него крещение.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы быть крещённым им».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Кратко и естественно передаёт временной указатель и последовательность повествования.
- source_word: παραγίνεται
  choice: приходит
  rationale: Сохраняет историческое настоящее греческого текста и придаёт рассказу живость; по контексту обозначает прибытие.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: из Галилеи
  rationale: Предлог ἀπό обозначает исходный пункт движения; по-русски естественно «из Галилеи».
- source_word: ἐπὶ τὸν Ἰορδάνην
  choice: к Иордану
  rationale: ἐπί с винительным падежом при глаголе движения обозначает направленность к месту; название реки без добавления «река» понятно из контекста.
- source_word: πρὸς τὸν Ἰωάννην
  choice: к Иоанну
  rationale: πρός с винительным обозначает движение к человеку. Титул «Креститель» не добавлен, поскольку его нет в этом стихе.
- source_word: τοῦ βαπτισθῆναι
  choice: чтобы принять крещение
  rationale: Артиклевый инфинитив выражает цель. Русская конструкция с «чтобы» ясно передаёт целевое значение; «принять крещение» естественнее буквального пассивного «быть крещённым».
- source_word: ὑπ’ αὐτοῦ
  choice: от него
  rationale: ὑπό с родительным обозначает действующее лицо при пассиве. При выражении «принять крещение» нормативная русская сочетаемость требует «от него».
theological_decisions:
- issue: Историческое настоящее παραγίνεται
  choice: Настоящее время «приходит»
  alternative: Прошедшее время «пришёл»
  rationale: Настоящее время сохраняет повествовательную живость оригинала и остаётся естественным для русского библейского рассказа.
- issue: Обозначение Иоанна
  choice: Только «Иоанн»
  alternative: «Иоанн Креститель»
  rationale: В данном стихе употреблено только имя; добавление титула было бы контекстуальным пояснением, а не переводом текста.
- issue: Передача пассивного βαπτισθῆναι
  choice: «принять от него крещение»
  alternative: «быть крещённым им»
  rationale: Выбран естественный русский оборот, сохраняющий и цель прихода, и роль Иоанна как совершающего крещение, без дополнительного богословского истолкования.
translation_notes:
  register: Современный литературный русский язык с живым повествовательным настоящим. Синтаксис сохраняет последовательность двух ориентиров движения — к Иордану и к Иоанну, — но остаётся понятным и достойным по стилю.
