  - marker: b
    text: 'Буквально: «упали на своё лицо»; «пали ниц» — естественное русское обозначение положения лицом к земле.'
    reason: lexical_alternative
  - marker: c
    text: То есть испытали очень сильный страх; греческое наречие σφόδρα усиливает значение глагола.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: когда… услышали это
  rationale: Аористное причастие передано естественным для современного русского языка придаточным времени. Местоимение «это» обозначает подразумеваемый из контекста голос, прозвучавший в предыдущем стихе.
- source_word: οἱ μαθηταὶ
  choice: ученики
  rationale: Устойчивое и контекстуально точное обозначение учеников Иисуса в Евангелиях.
- source_word: ἔπεσαν ἐπὶ πρόσωπον αὐτῶν
  choice: пали ниц
  rationale: Русское выражение естественно передаёт падение лицом к земле и сохраняет возвышенный повествовательный регистр, не добавляя отдельного толкования жеста.
- source_word: ἐφοβήθησαν σφόδρα
  choice: сильно испугались
  rationale: Глагол передаёт наступивший страх, а наречие σφόδρα — его высокую степень. Формулировка ясна современному читателю и не уточняет природу страха сверх сказанного в тексте.
theological_decisions:
- issue: Характер реакции учеников на небесный голос
  choice: Сохранены телесное падение ниц и сильный страх без определения этой реакции исключительно как поклонения, благоговения или ужаса.
  alternative: Истолковать падение прежде всего как поклонение либо страх прежде всего как ужас перед богоявлением.
  rationale: Греческий текст сообщает о позе учеников и сильном страхе, но не даёт реакции однозначной богословской квалификации.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельского повествования. «Пали ниц» сохраняет традиционно узнаваемую, но понятную современному читателю формулу; «сильно испугались» звучит естественно и точно передаёт интенсивность.
