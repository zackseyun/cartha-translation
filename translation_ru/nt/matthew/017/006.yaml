  text: Когда ученики услышали это[a], они пали ниц[b] и сильно испугались[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «услышав»; слово «это» подразумевает голос из предыдущего стиха.'
