  edition: SBLGNT
  text: Καὶ καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων· Μηδενὶ εἴπητε τὸ ὅραμα ἕως οὗ ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ⸀ἐγερθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/009.yaml
  text: And as they were coming down from the mountain[a], Jesus commanded them, saying[b], “Tell the vision to no one until the Son of Man is raised from the dead.”
translation:
  language: ru
  text: 'Когда они спускались с горы, Иисус велел им: «Не говорите никому о видении[a], пока Сын Человеческий не будет воскрешён из мёртвых[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о том, что вы видели». В греческом тексте — «видение».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из среды мёртвых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους
  choice: когда они спускались с горы
  rationale: Генитивный абсолют с причастием настоящего времени обозначает действие, происходящее одновременно с последующим; эта формулировка естественна по-русски и сохраняет длительный характер спуска.
- source_word: ἐνετείλατο αὐτοῖς
  choice: велел им
  rationale: Глагол выражает обязательное повеление. «Велел» передаёт его силу естественно и без излишней канцелярской тяжеловесности.
- source_word: λέγων
  choice: ':'
  rationale: В русском языке причастие «говоря» при введении прямой речи здесь звучало бы избыточно; двоеточие естественно выполняет ту же дискурсивную функцию.
- source_word: Μηδενὶ εἴπητε
  choice: Никому не рассказывайте
  rationale: Запрет передавать другим увиденное естественно выражается глаголом «рассказывать»; начальная позиция «никому» сохраняет акцент отрицания.
- source_word: τὸ ὅραμα
  choice: об этом видении
  rationale: «Видение» прямо передаёт ὅραμα и сохраняет возможный оттенок сверхъестественного откровения, не сводя выражение лишь к нейтральному «увиденному».
- source_word: ἕως οὗ
  choice: пока ... не
  rationale: Русская конструкция «пока не» идиоматично обозначает временной предел запрета.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Сохранено традиционное и узнаваемое наименование, передающее греческое выражение и его библейские ассоциации без парафраза.
- source_word: ἐκ νεκρῶν
  choice: из мёртвых
  rationale: Это естественное русское библейское выражение для воскресения; буквальный пространственно-групповой оттенок отмечен в сноске.
- source_word: ἐγερθῇ
  choice: не будет воскрешён
  rationale: Будущее страдательное выражение после «пока не» естественно по-русски передаёт аористный пассивный конъюнктив и сохраняет неуказанную в самом стихе действующую силу.
theological_decisions:
- issue: Страдательный залог в высказывании о воскресении
  choice: не будет воскрешён из мёртвых
  alternative: не воскреснет из мёртвых
  rationale: Греческая форма страдательная. Перевод сохраняет этот залог и связанную с ним возможность подразумеваемого Божьего действия, не называя действующего прямо.
- issue: Характер увиденного на горе
  choice: видение
  alternative: то, что вы видели
  rationale: Прямой эквивалент сохраняет откровенный или сверхъестественный оттенок ὅραμα и не решает за читателя, как именно соотнести «видение» с реальностью события.
translation_notes:
  register: Современный литературный русский язык с ясной, dignified библейской интонацией. Синтаксис упрощён там, где буквальное сохранение греческого причастия «говоря» было бы неестественно; ключевые богословски значимые выражения и страдательный залог сохранены.
