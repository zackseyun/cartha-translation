  text: ἔτι αὐτοῦ λαλοῦντος ἰδοὺ νεφέλη φωτεινὴ ἐπεσκίασεν αὐτούς, καὶ ἰδοὺ φωνὴ ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα· ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/005.yaml
  text: While he was still speaking[a], behold, a bright cloud overshadowed them, and behold, a voice from the cloud said, “This is my beloved Son, with whom I am well pleased[c][b]; listen to him.”
translation:
  language: ru
  text: 'Он ещё говорил, и вот сияющее облако осенило их[a], и вот из облака раздался голос: «Это Мой возлюбленный Сын, которым Я доволен. Слушайте Его[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Осенило» может перекликаться с библейским языком явления Божьего присутствия.
    reason: cross_reference
  - marker: b
    text: 'Или: «Внимайте Ему». Греческое повеление может означать не только слышать, но и принимать услышанное к исполнению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: Он ещё говорил, когда
  rationale: Генитив абсолютный обозначает одновременное действие; формулировка естественна по-русски и сохраняет оттенок того, что речь была прервана.
- source_word: ἰδοὺ
  choice: вот
  rationale: Повторено дважды вслед за греческим текстом как указательный маркер, привлекающий внимание и усиливающий драматизм сцены.
- source_word: νεφέλη φωτεινὴ
  choice: светлое облако
  rationale: Прямо передаёт φωτεινή как «светлое, сияющее», не превращая образ в истолкование.
- source_word: ἐπεσκίασεν
  choice: осенило
  rationale: Сохраняет образ покрывающего присутствия и возможный библейский теофанический оттенок; «покрыло тенью» плохо сочетается со светлым облаком.
- source_word: φωνὴ ἐκ τῆς νεφέλης λέγουσα
  choice: из облака раздался голос
  rationale: Естественная русская конструкция передаёт источник голоса; содержание речи вводится двоеточием без тяжеловесного «говорящий».
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: Мой возлюбленный Сын
  rationale: Передаёт сыновство и значение ἀγαπητός без внесения дополнительной догматической терминологии.
- source_word: ἐν ᾧ εὐδόκησα
  choice: которым Я доволен
  rationale: Естественно передаёт благоволение в формуле божественного провозглашения, сохраняя относительную конструкцию.
- source_word: ἀκούετε αὐτοῦ
  choice: Слушайте Его
  rationale: Передаёт длительный императив и смысл внимательного, действенного слушания, не усиливая его до явного «повинуйтесь».
theological_decisions:
- issue: Провозглашение личности Иисуса
  choice: Это Мой возлюбленный Сын, которым Я доволен
  alternative: Это Мой Сын, Возлюбленный, в котором Моё благоволение
  rationale: Выбранный вариант прямо сохраняет отцовское именование Иисуса Сыном, любовь и благоволение, но не вводит в основной текст позднейшую догматическую лексику.
- issue: Смысл повеления ἀκούετε αὐτοῦ
  choice: Слушайте Его
  alternative: Услышьте Его; повинуйтесь Ему
  rationale: Греческий глагол допускает смысл слушания с принятием и следованием; «слушайте» сохраняет эту широту, тогда как «повинуйтесь» сужает её до толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Частица «вот» сохраняет оба ἰδού; тире помогает первому вхождению звучать естественно. Местоимения, относящиеся к Богу и Его Сыну, написаны с прописной буквы по принятой русской библейской издательской традиции.
