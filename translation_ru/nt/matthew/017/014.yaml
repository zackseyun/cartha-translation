lexical_decisions:
- source_word: Καὶ ἐλθόντων
  choice: Когда они подошли
  rationale: Генитив абсолютный с аористным причастием передаёт временное обстоятельство и подразумевает множественное число действующих лиц из контекста. В русском отдельное «и» перед придаточным было бы избыточно.
- source_word: πρὸς τὸν ὄχλον
  choice: к народу
  rationale: ὄχλος обозначает собравшуюся массу людей. «К народу» естественно и достойно звучит в данном повествовательном контексте; более буквальное «к толпе» возможно, но может иметь нежелательный сниженный оттенок.
- source_word: προσῆλθεν αὐτῷ ἄνθρωπος
  choice: к Нему подошёл человек
  rationale: προσέρχομαι выражает приближение к кому-либо; «подошёл» точно и естественно передаёт действие. ἄνθρωπος здесь обозначает конкретного мужчину, однако русское «человек» в таком повествовательном употреблении сохраняет смысл без неестественного подчёркивания пола.
- source_word: γονυπετῶν αὐτόν
  choice: и преклонил перед Ним колени
  rationale: Причастие описывает коленопреклонённое положение или действие человека перед Иисусом. Русская глагольная конструкция естественно передаёт сопутствующее действие и сохраняет оттенок почтения.
theological_decisions:
- issue: Выражает ли γονυπετῶν поклонение в строго богословском смысле
  choice: преклонил перед Ним колени
  alternative: поклонился Ему
  rationale: Исходное слово непосредственно описывает телесное действие — становление на колени. Выбранный перевод не исключает почтения, но и не навязывает вывод о культовом поклонении.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом и умеренно возвышенной библейской интонацией. Местоимение, относящееся к Иисусу, написано с прописной буквы по принятой русской библейской традиции.
