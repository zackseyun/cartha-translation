  text: καὶ ⸂προσῆλθεν ὁ Ἰησοῦς καὶ ἁψάμενος αὐτῶν⸃ εἶπεν· Ἐγέρθητε καὶ μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/007.yaml
  text: And Jesus came near and touched them and said[a], “Get up[c][b], and do not be afraid.”
translation:
  language: ru
  text: 'Иисус подошёл, прикоснулся к ним и сказал: «Встаньте и не бойтесь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσῆλθεν
  choice: подошёл
  rationale: Глагол προσέρχομαι обозначает приближение или движение к кому-либо; «подошёл» естественно передаёт это в данном повествовательном контексте.
- source_word: ἁψάμενος αὐτῶν
  choice: прикоснулся к ним
  rationale: Причастие от ἅπτω с родительным падежом означает прикосновение. Личная форма делает русскую фразу плавной, не добавляя не указанного в греческом тексте упоминания руки.
- source_word: εἶπεν
  choice: сказал
  rationale: Прямое и нейтральное соответствие стандартному глаголу речи λέγω.
- source_word: Ἐγέρθητε
  choice: Встаньте
  rationale: В контексте ученики лежат ничком, поэтому повеление призывает их подняться. «Встаньте» ясно и естественно, хотя может несколько сильнее обозначать итоговое вертикальное положение, чем греческий глагол.
- source_word: μὴ φοβεῖσθε
  choice: не бойтесь
  rationale: Обычное современное русское выражение для запрета или ободряющего призыва не испытывать страха; оно не навязывает более узкое значение «перестаньте бояться».
- source_word: καὶ
  choice: и
  rationale: Союз сохраняет простую последовательность действий и связь двух повелений без добавления временных или причинных оттенков.
theological_decisions:
- issue: Передача ободряющего повеления Иисуса без добавочной пастырской или вероучительной конкретизации
  choice: «Встаньте и не бойтесь»
  alternative: «Поднимитесь и не страшитесь»
  rationale: Выбранная формулировка прямо передаёт физическое повеление и успокоение учеников, сохраняя краткость и не добавляя отсутствующих в оригинале объяснений.
translation_notes:
  register: Современный литературный русский язык; повествование звучит естественно и достойно. Синтаксис греческого причастного оборота преобразован в однородные сказуемые, что нормативно для русского и сохраняет последовательность действий.
