  text: Τότε προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ κατ’ ἰδίαν εἶπον· Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/019.yaml
  text: Then the disciples came to Jesus privately and said[a], “Why were we not able to cast it out?”
translation:
  language: ru
  text: 'Тогда ученики подошли к Иисусу наедине и спросили: «Почему мы не смогли изгнать его[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое местоимение может относиться либо к демону, либо к мальчику; по-русски в обоих случаях — «его».
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественный временной маркер, продолжающий последовательность событий.
- source_word: προσελθόντες
  choice: подойдя
  rationale: Деепричастие сохраняет подчинённую форму аористного причастия и естественно звучит по-русски.
- source_word: οἱ μαθηταὶ
  choice: ученики
  rationale: Устоявшееся и понятное обозначение учеников Иисуса в евангельском контексте.
- source_word: τῷ Ἰησοῦ
  choice: к Иисусу
  rationale: Дательный падеж при προσέρχομαι передан нормативной русской конструкцией «подойти к».
- source_word: κατ’ ἰδίαν
  choice: наедине
  rationale: Кратко и естественно передаёт разговор без посторонних; контекст ясно связывает выражение с Иисусом и учениками.
- source_word: εἶπον
  choice: спросили
  rationale: Хотя буквально глагол означает «сказали», прямая речь является вопросом, поэтому функциональное русское соответствие «спросили» звучит естественнее.
- source_word: Διὰ τί
  choice: Почему
  rationale: Обычное современное выражение вопроса о причине.
- source_word: ἡμεῖς
  choice: мы
  rationale: Сохраняет явно выраженное греческое местоимение и его лёгкий смысловой акцент.
- source_word: οὐκ ἠδυνήθημεν
  choice: не смогли
  rationale: Естественно и точно выражает неспособность совершить действие в данном случае.
- source_word: ἐκβαλεῖν
  choice: изгнать
  rationale: Устоявшийся, современный и достойный глагол для изгнания демона; передаёт значение удаления силой.
- source_word: αὐτό
  choice: его
  rationale: Русское местоимение не может сохранить средний род греческой формы без выбора рода. По ближайшему повествовательному смыслу объектом изгнания является демон, который по-русски мужского рода; возможная отсылка к мальчику отмечена в сноске.
theological_decisions:
- issue: Референт местоимения αὐτό в контексте изгнания демона
  choice: 'Основной текст понимает местоимение как указание на демона: «его».'
  alternative: Местоимение может указывать на мальчика; по-русски это также было бы «его».
  rationale: Глагол ἐκβάλλω в данном контексте естественнее всего относится к демону как объекту изгнания. Однако грамматически местоимение среднего рода может соотноситься и с παιδίον («ребёнок»), поэтому подлинная неоднозначность сообщается в сноске. В русском оба референта требуют формы «его», так что различие нельзя показать одним лишь местоимением.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Конструкция «подойдя… наедине, спросили» сохраняет структуру исходного предложения без неестественной буквальности; традиционное «изгнать» уместно в контексте экзорцизма.
