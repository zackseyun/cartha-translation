  text: ἐπάραντες δὲ τοὺς ὀφθαλμοὺς αὐτῶν οὐδένα εἶδον εἰ μὴ ⸀αὐτὸν Ἰησοῦν μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/008.yaml
  text: And lifting up their eyes[a], they saw no one except Jesus alone.
translation:
  language: ru
  text: Подняв глаза, они не увидели никого, кроме одного лишь Иисуса.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч. буквально: «кроме самого Иисуса одного». Усилительное местоимение и слово «одного» вместе подчёркивают исключительность: они видели только Иисуса.'
    reason: лексическое усиление и более буквальная альтернатива
lexical_decisions:
- source_word: ἐπάραντες
  choice: Подняв
  rationale: Аористное причастие обозначает действие, предшествующее основному; деепричастие естественно сохраняет последовательность и краткость греческой конструкции.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Здесь δέ служит слабой повествовательной связкой; в современном русском продолжение естественно передаётся без отдельного союза.
- source_word: τοὺς ὀφθαλμοὺς αὐτῶν
  choice: глаза
  rationale: Конкретное телесное выражение сохранено; принадлежность очевидна из подлежащего «они» и не требует тяжеловесного «свои глаза».
- source_word: οὐδένα εἶδον
  choice: они никого не увидели
  rationale: Передаёт простой аорист ὁράω и отрицательное местоимение ясным современным русским оборотом.
- source_word: εἰ μὴ
  choice: кроме
  rationale: После отрицания сочетание имеет исключительное значение «кроме», а не условное «если не».
- source_word: αὐτὸν Ἰησοῦν μόνον
  choice: одного Иисуса
  rationale: Русское «одного Иисуса» естественно и выразительно передаёт усиленную исключительность сочетания местоимения с μόνον, не создавая неестественного «самого Иисуса одного».
theological_decisions:
- issue: Иисус как единственный оставшийся видимым после видения
  choice: «кроме одного Иисуса» с пояснением усиления в сноске
  alternative: «кроме Иисуса»; «кроме одного лишь Иисуса»
  rationale: Формулировка сохраняет повествовательный акцент на том, что Моисей и Илия больше не видны, но не добавляет к сцене богословских выводов, которых стих прямо не формулирует.
translation_notes:
  register: Современный литературный русский, сдержанный и повествовательно естественный. Деепричастный оборот сохраняет структуру исходного текста; усиленная исключительность вынесена в естественную формулировку основного текста и уточнена сноской.
