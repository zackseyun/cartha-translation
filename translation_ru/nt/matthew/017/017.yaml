  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ⸂μεθ’ ὑμῶν ἔσομαι⸃; ἕως πότε ἀνέξομαι ὑμῶν; φέρετέ μοι αὐτὸν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/017.yaml
  text: But Jesus answered[a], “O unbelieving and perverse generation[c][b], how long will I be with you? How long will I bear with you? Bring him here to me.”
translation:
  language: ru
  text: 'Иисус же сказал в ответ: «О неверующее и развращённое поколение, долго ли Мне ещё быть с вами? Долго ли Мне ещё терпеть вас? Приведите его сюда, ко Мне».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Иисус же сказал в ответ
  rationale: Передаёт обычную греческую формулу ответа естественным русским оборотом; «же» сохраняет переходно-противительный оттенок δέ.
- source_word: Ὦ γενεὰ
  choice: О ... поколение!
  rationale: Частица «О» и восклицательная интонация сохраняют торжественный тон скорби и упрёка; «поколение» непосредственно соответствует γενεά.
- source_word: ἄπιστος
  choice: неверующее
  rationale: В ближайшем контексте речь идёт о недостатке веры; вариант сохраняет основной смысл, не сужая его до неверности обязательствам.
- source_word: διεστραμμένη
  choice: развращённое
  rationale: Передаёт состояние нравственной и духовной искажённости, выраженное перфектным пассивным причастием, и звучит естественно в современном литературном русском.
- source_word: ἕως πότε μεθ’ ὑμῶν ἔσομαι
  choice: Долго ли Мне ещё быть с вами?
  rationale: Естественный русский риторический вопрос, точно передающий ἕως πότε и будущее значение без искусственного синтаксиса.
- source_word: ἕως πότε ἀνέξομαι ὑμῶν
  choice: Долго ли Мне ещё терпеть вас?
  rationale: «Терпеть вас» здесь кратко и непосредственно передаёт значение ἀνέχομαι — выносить, сносить, терпеть.
- source_word: φέρετέ μοι αὐτὸν ὧδε
  choice: Приведите его сюда, ко Мне
  rationale: Поскольку речь идёт о мальчике, русское «приведите» естественнее буквального «принесите»; «сюда, ко Мне» сохраняет и ὧδε, и дательное μοι.
theological_decisions:
- issue: Смысл ἄπιστος в упрёке Иисуса
  choice: неверующее
  alternative: неверное
  rationale: Контекст подчёркивает недостаток веры, однако перевод не уточняет, к кому именно внутри сцены относится упрёк, и тем самым сохраняет широту обращения.
- issue: Адресат выражения «поколение» и местоимения «вы»
  choice: не конкретизировать в тексте
  alternative: явно отнести упрёк только к ученикам или ко всей толпе
  rationale: Греческий текст использует общее обращение и множественное число, не устанавливая однозначно более узкого адресата.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и пророчески-обличительного тона. Прописное «Мне» соответствует принятой русской религиозной орфографической традиции, не добавляя толкования. Архаизмы и разговорные выражения устранены.
