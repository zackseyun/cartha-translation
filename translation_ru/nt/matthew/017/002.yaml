  text: καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν, καὶ ἔλαμψεν τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, τὰ δὲ ἱμάτια αὐτοῦ ⸀ἐγένετο λευκὰ ὡς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/002.yaml
  text: And he was transfigured before them[a], and his face shone like the sun, and his clothes became white as the light.
translation:
  language: ru
  text: 'И Он преобразился перед ними[a]: лицо Его засияло, как солнце, а одежды стали белыми, как свет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изменился внешне».'
    reason: Лексическая альтернатива для μετεμορφώθη, раскрывающая буквальный смысл без отказа от точного традиционного термина в основном тексте.
lexical_decisions:
- source_word: μετεμορφώθη
  choice: преобразился
  rationale: Устоявшееся и точное обозначение видимой перемены облика; передаёт смысл аориста пассивной формы, не добавляя к тексту объяснения природы события.
- source_word: ἔμπροσθεν αὐτῶν
  choice: перед ними
  rationale: Прямо передаёт пространственное значение и указывает, что событие произошло у них на глазах.
- source_word: ἔλαμψεν
  choice: засияло
  rationale: Естественно передаёт начало яркого сияния, описанное аористом λάμπω.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: лицо Его
  rationale: В данном контексте πρόσωπον означает физическое лицо Иисуса; порядок слов сохраняет торжественный, но понятный регистр.
- source_word: ὡς ὁ ἥλιος
  choice: как солнце
  rationale: Ясно сохраняет выраженное ὡς сравнение.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: одежды
  rationale: «Одежды» естественно обозначает предметы одежды во множественном числе и соответствует возвышенному повествовательному регистру.
- source_word: ἐγένετο λευκὰ
  choice: стали белыми
  rationale: Передаёт изменение состояния; единственное число греческого глагола при подлежащем среднего рода во множественном числе является обычной грамматической конструкцией и по-русски естественно выражается множественным числом.
- source_word: ὡς τὸ φῶς
  choice: как свет
  rationale: Сохраняет образное сравнение со светом, не заменяя его пояснительным прилагательным вроде «сияющими».
theological_decisions:
- issue: Обозначение события преображения
  choice: преобразился
  alternative: изменился внешне
  rationale: «Преобразился» точно описывает явленную ученикам перемену облика и соответствует исторически сложившемуся названию события, не уточняя сверх текста, в чём состояла природа этой перемены.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор союзов сглажен двоеточием и противопоставительным «а» ради естественного русского синтаксиса. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с принятым в русском библейском стиле уважительным оформлением.
