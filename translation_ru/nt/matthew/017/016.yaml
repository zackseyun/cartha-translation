  text: καὶ προσήνεγκα αὐτὸν τοῖς μαθηταῖς σου, καὶ οὐκ ἠδυνήθησαν αὐτὸν θεραπεῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/016.yaml
  text: And I brought him to your disciples[a], and they were not able to heal him.
translation:
  language: ru
  text: Я привёл его к Твоим ученикам, и они не смогли его исцелить.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσήνεγκα
  choice: привёл
  rationale: В данном контексте προσφέρω означает привести человека к кому-либо. «Привёл» естественно передаёт движение одушевлённого лица мужского пола.
- source_word: μαθηταῖς σου
  choice: к Твоим ученикам
  rationale: μαθητής в Евангелиях обозначает ученика и последователя учителя; дательный падеж после προσήνεγκα передаётся конструкцией с «к».
- source_word: οὐκ ἠδυνήθησαν
  choice: не смогли
  rationale: Форма δύναμαι выражает отсутствие способности или возможности. «Не смогли» естественно и точно передаёт завершившуюся неудачей попытку.
- source_word: θεραπεῦσαι
  choice: исцелить
  rationale: В контексте рассказа о страдающем мальчике θεραπεύω означает исцелить; этот выбор не уточняет способ исцеления сверх сказанного в стихе.
- source_word: καὶ ... καὶ
  choice: и ... но
  rationale: Первое καί связывает высказывание с предыдущей речью и по-русски естественно остаётся невыраженным в начале самостоятельной цитаты; второе καί в контексте фактической неудачи учеников естественно передаётся противительным «но», не добавляя причинного объяснения.
- source_word: αὐτόν
  choice: его
  rationale: Местоимение относится к сыну говорящего и прямо передаётся русским «его».
theological_decisions:
- issue: Характер неудачи учеников
  choice: Передать только их неспособность исцелить мальчика.
  alternative: Уточнить, что они не смогли изгнать беса, либо объяснить неудачу неверием.
  rationale: Сам стих говорит лишь о том, что ученики не смогли его исцелить; причины и более конкретное описание не следует вносить из окружающего контекста.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Местоимение «Твоим» написано с прописной буквы как традиционное уважительное обращение к Иисусу; грамматически текст не требует такого написания.
