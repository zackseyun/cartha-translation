lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Передаёт временной переход и момент, когда ученики пришли к пониманию.
- source_word: συνῆκαν
  choice: поняли
  rationale: 'Естественно передаёт аорист συνίημι: ученики уяснили смысл сказанного.'
- source_word: οἱ μαθηταὶ
  choice: ученики
  rationale: Общепринятое и точное обозначение последователей Иисуса в евангельском повествовании.
- source_word: ὅτι
  choice: что
  rationale: Вводит содержание того, что поняли ученики, а не причинное придаточное.
- source_word: περὶ
  choice: об
  rationale: С родительным падежом обозначает предмет речи; это естественный русский эквивалент.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Иоанне Крестителе
  rationale: Устоявшееся русское наименование Иоанна; при этом буквальная функциональная передача титула отмечена в сноске.
- source_word: εἶπεν αὐτοῖς
  choice: Он говорил им
  rationale: Передаёт предшествовавшую речь Иисуса естественно для русского контекста; местоимение с прописной буквы соответствует принятому благоговейному русскому библейскому регистру, не добавляя нового референта.
theological_decisions:
- issue: Отождествление образа Илии в ближайшем контексте
  choice: Стих прямо сообщает, что ученики поняли слова Иисуса как относящиеся к Иоанну Крестителю.
  alternative: Расширить текст пояснением, что Иоанн и есть обещанный Илия.
  rationale: Повествователь явно называет референта, но перевод не должен выходить за пределы стиха и дополнительно определять характер этого отождествления.
translation_notes:
