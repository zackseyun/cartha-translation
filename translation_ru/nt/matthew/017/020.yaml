source:
  edition: SBLGNT
  text: ὁ δὲ ⸀λέγει αὐτοῖς· Διὰ τὴν ⸀ὀλιγοπιστίαν ὑμῶν· ἀμὴν γὰρ λέγω ὑμῖν, ἐὰν ἔχητε πίστιν ὡς κόκκον σινάπεως, ἐρεῖτε τῷ ὄρει τούτῳ· ⸂Μετάβα ἔνθεν⸃ ἐκεῖ, καὶ μεταβήσεται, καὶ οὐδὲν ἀδυνατήσει ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/020.yaml
  text: But he says to them[a], “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move[c][b], and nothing will be impossible for you.”
translation:
  language: ru
  text: 'Он говорит им: «Из-за вашего маловерия.[a] Истинно говорю вам: если у вас будет вера величиной с горчичное зерно,[b] то вы скажете этой горе: „Перейди отсюда туда“, — и она перейдёт; и не будет для вас ничего невозможного».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за недостатка вашей веры». Греческое слово указывает скорее на малую или недостаточную веру, чем на полное неверие.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «если будете иметь веру как горчичное зерно». Сравнение указывает на нечто очень малое.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: говорит
  rationale: Историческое настоящее сохранено, поскольку оно придаёт повествованию живость и естественно звучит в русском библейском рассказе.
- source_word: Διὰ τὴν ὀλιγοπιστίαν ὑμῶν
  choice: Из-за вашего маловерия
  rationale: ὀλιγοπιστία обозначает недостаточную, малую веру, а не непременно полное неверие; «маловерие» точно и естественно передаёт это различие.
- source_word: ἀμὴν
  choice: Истинно
  rationale: Вводит торжественное и авторитетное утверждение; «истинно говорю вам» — ясная и устойчивая русская формула.
- source_word: πίστιν
  choice: вера
  rationale: В данном контексте речь идёт о доверии Божьей силе; «вера» сохраняет основной смысл, не сужая его до конфессионального толкования.
- source_word: ὡς κόκκον σινάπεως
  choice: с горчичное зерно
  rationale: Русская сравнительная конструкция естественно передаёт образ крайне малого размера и не превращает сравнение в утверждение о качестве семени.
- source_word: Μετάβα ἔνθεν ἐκεῖ
  choice: Перейди отсюда туда
  rationale: «Перейди» передаёт повеление переместиться из одного места в другое и сохраняет связь с тем же глаголом в следующей фразе.
- source_word: μεταβήσεται
  choice: она перейдёт
  rationale: 'Будущая форма имеет непереходное значение: гора сама переместится; повтор «перейдёт» сохраняет лексическую связь оригинала.'
- source_word: οὐδὲν ἀδυνατήσει ὑμῖν
  choice: не будет для вас ничего невозможного
  rationale: Это естественная русская передача греческой идиомы, выражающей отсутствие невозможного для адресатов.
theological_decisions:
- issue: Значение πίστις в контексте чуда
  choice: вера
  alternative: доверие
  rationale: Контекст указывает на недостаточное доверие учеников Божьей силе, однако существительное «вера» сохраняет широту греческого слова и не навязывает частного богословского истолкования.
- issue: Характер обещания «ничего невозможного»
  choice: Сохранить без поясняющего ограничения
  alternative: Добавить явную оговорку о Божьей воле или предназначении
  rationale: Сам стих формулирует обещание без такой оговорки. Перевод сохраняет его напряжение и не вносит отсутствующее в тексте конфессиональное объяснение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Историческое настоящее и повтор глагола «перейти» сохранены ради повествовательной выразительности и лексической связи оригинала; синтаксис сделан понятным обычному читателю.
