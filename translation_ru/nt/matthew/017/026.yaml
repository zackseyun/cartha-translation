  text: ⸂εἰπόντος δέ⸃· Ἀπὸ τῶν ἀλλοτρίων, ἔφη αὐτῷ ὁ Ἰησοῦς· Ἄρα γε ἐλεύθεροί εἰσιν οἱ υἱοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/026.yaml
  text: When he said[a], “From strangers,” Jesus said to him[c][b], “Then the sons are free.”
translation:
  language: ru
  text: 'Когда же Пётр ответил: «С посторонних», — Иисус сказал ему: «Значит, сыновья свободны[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сыновья освобождены от уплаты». Буквально: «сыновья свободны»; в контексте имеется в виду, что они не обязаны платить этот налог.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντος δέ
  choice: Когда же Пётр ответил
  rationale: Генитив абсолютный обозначает обстоятельство времени, а δέ — переход в повествовании. Имя Петра восстановлено из непосредственного контекста для естественности русского текста; «ответил» уместно, поскольку реплика является ответом на вопрос Иисуса.
- source_word: ἀπὸ τῶν ἀλλοτρίων
  choice: С посторонних
  rationale: ἀλλότριοι противопоставлены собственным сыновьям царя и обозначают не принадлежащих к его дому. «Посторонние» передаёт именно это отношение, не внося нежелательного этнического смысла слова «иностранцы».
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Иисус сказал ему
  rationale: Прямое и естественное соответствие обычной повествовательной формуле с φημί.
- source_word: Ἄρα γε
  choice: Значит
  rationale: Частицы вводят вывод из ответа Петра; «значит» ясно и естественно выражает логическое следствие.
- source_word: ἐλεύθεροί
  choice: свободны
  rationale: Сохраняется основное и более широкое значение прилагательного. В данном контексте свобода подразумевает освобождение от уплаты налога, но перевод «не обязаны платить» чрезмерно сузил бы формулировку.
- source_word: οἱ υἱοί
  choice: сыновья
  rationale: Сохраняется явно мужское обозначение и семейно-правовое противопоставление сыновей царя посторонним.
theological_decisions:
- issue: Смысл свободы сыновей по отношению к царскому налогу
  choice: сыновья свободны
  alternative: сыновья освобождены от налога
  rationale: Буквальная формулировка сохраняет как непосредственный смысл налоговой льготы, так и более широкое богословское звучание сыновства, не сводя высказывание исключительно к налоговой обязанности.
- issue: Передача οἱ υἱοί в обобщающем сравнении
  choice: сыновья
  alternative: дети
  rationale: В греческом тексте употреблено конкретное слово «сыновья», а образ строится на их отношении к царю. Нейтрализация как «дети» ослабила бы исходную формулировку и возможный мотив сыновства.
translation_notes:
  register: Современный литературный русский язык с естественным порядком слов и сохранением достоинства библейской речи. «Посторонние» выбрано вместо потенциально этнически окрашенного «чужеземцы». Имя Петра эксплицировано из контекста, чтобы избежать неясного русского «когда же он сказал».
