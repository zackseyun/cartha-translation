reference: Matthew 17:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν τῷ Ἰησοῦ· Κύριε, καλόν ἐστιν ἡμᾶς ὧδε εἶναι· εἰ θέλεις, ⸀ποιήσω ὧδε τρεῖς σκηνάς, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ ⸂Ἠλίᾳ μίαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/004.yaml
  text: 'Then Peter answered and said to Jesus[a], “Lord, it is good for us to be here. If you wish, I will make three shelters here: one for you, one for Moses, and one for Elijah.”'
translation:
  language: ru
  text: 'Тогда Пётр сказал Иисусу: «Господи, хорошо нам здесь быть. Если хочешь, я поставлю здесь три шатра[a]: один для Тебя, один для Моисея и один для Илии».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кущи», «скинии» или «палатки».'
    reason: Греческое σκηνάς обозначает временные жилища или укрытия и может вызывать ассоциацию с праздником Кущей, хотя сам стих прямо эту связь не устанавливает.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν
  choice: Тогда Пётр сказал
  rationale: Греческая формула буквально сочетает «ответив» и «сказал», однако здесь она вводит реплику, не обязательно являющуюся ответом на вопрос. Естественная русская повествовательная формула «тогда… сказал» передаёт развитие рассказа без тяжеловесного «ответил и сказал».
- source_word: Κύριε
  choice: Господи
  rationale: Традиционная и по-прежнему понятная русская форма прямого обращения от «Господь» сохраняет как уважительный, так и возможный богословский вес титула.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: хорошо нам здесь быть
  rationale: Естественная русская конструкция близко передаёт греческий оборот с инфинитивом и не уточняет сверх текста, почему именно здесь хорошо.
- source_word: εἰ θέλεις
  choice: если хочешь
  rationale: Передаёт желание или волю адресата просто, уважительно и естественно для современной русской прямой речи.
- source_word: ποιήσω
  choice: я поставлю
  rationale: Для временных шатров русское «поставлю» естественнее буквального «сделаю» и не предполагает капитального строительства, как могло бы «построю».
- source_word: σκηνάς
  choice: шатра
  rationale: «Шатёр» обозначает временное укрытие и сохраняет образ палатки или кущи; это понятнее современному читателю, чем церковнославянизм «кущи», и менее конфессионально нагружено, чем «скинии».
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: один для Тебя, один для Моисея и один для Илии
  rationale: Повторение «один» сохраняет распределительный акцент греческого текста. Прописная буква в местоимении следует принятому в русском библейском регистре почтительному обращению к Иисусу.
theological_decisions:
- issue: Передача κύριος при обращении к Иисусу
  choice: Господи
  alternative: Учитель / Владыка
  rationale: «Господи» сохраняет широкий диапазон титула — от почтительного обращения до богословского исповедания — и не сводит его лишь к роли наставника.
- issue: Возможная связь σκηναί с праздником Кущей
  choice: шатры в основном тексте с примечанием об альтернативах
  alternative: кущи / скинии / палатки
  rationale: Сам стих прямо не называет праздник, поэтому основной текст не утверждает эту связь. Примечание сохраняет лексические варианты и возможные библейские ассоциации.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис прямой и доступный; устаревшие «кущи» и «скинии» вынесены в примечание. Сохранены оба указания «здесь» из греческого текста и трёхкратное распределение «один».
