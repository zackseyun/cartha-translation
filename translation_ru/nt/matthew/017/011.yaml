  text: ὁ ⸀δὲ ἀποκριθεὶς ⸀εἶπεν· Ἠλίας μὲν ⸀ἔρχεται καὶ ἀποκαταστήσει πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/011.yaml
  text: He answered[a], “Elijah indeed is coming and will restore all things.”
translation:
  language: ru
  text: 'Он ответил: «Илия действительно придёт и восстановит всё.[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Илия действительно приходит и восстановит всё». Греческий глагол стоит в настоящем времени, но здесь имеет значение, направленное в будущее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Он ответил
  rationale: 'Сочетание причастия с личной формой глагола естественно передаётся по-русски одним глаголом «ответил»: это сохраняет значение ответа и не создаёт избыточного «ответив, сказал».'
- source_word: Ἠλίας
  choice: Илия
  rationale: Использована традиционная русская форма библейского имени.
- source_word: μέν
  choice: действительно
  rationale: Передаёт усиление и подготавливает контраст следующего стиха, не добавляя союза «с одной стороны», который без продолжения звучал бы неестественно.
- source_word: ἔρχεται
  choice: придёт
  rationale: Настоящее время греческого глагола в данном контексте имеет направленное в будущее значение; русское будущее время ясно и естественно передаёт ожидаемое пришествие.
- source_word: ἀποκαταστήσει
  choice: восстановит
  rationale: Прямо передаёт будущее действие, не уточняя, в чём именно состоит восстановление.
- source_word: πάντα
  choice: всё
  rationale: Сохраняет широкий, неуточнённый объём греческого среднего множественного числа и звучит естественнее современного русского «всё сущее» или «все вещи».
theological_decisions:
- issue: Характер и объём восстановительного дела Илии
  choice: «восстановит всё»
  alternative: «приведёт всё в должный порядок»
  rationale: Греческий текст говорит о восстановлении всеобъемлюще, но в этом стихе не определяет его точного характера или объекта. Широкая формулировка сохраняет богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная и достойная формулировка. Традиционная форма имени «Илия» сохранена. Маркер сноски поставлен после всего высказывания, к которому относится временная альтернатива.
