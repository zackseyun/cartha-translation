  text: But[a] this kind does not come out except by prayer and fasting.
translation:
  language: ru
  text: Но[a] этот род выходит только через молитву и пост.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот стих отсутствует в самых ранних греческих рукописях, включая Синайский и Ватиканский кодексы IV века, а также в ранних сирийских и коптских переводах. Он присутствует в большинстве византийских рукописей, в латинской традиции и в большинстве сирийских рукописей. Вероятно, позднейшие переписчики добавили его для согласования с Евангелием от Марка (9:29).
    reason: textual_critical
lexical_decisions:
- source_word: γένος
  choice: род
  rationale: В контексте речь идёт о разряде или разновидности духов; «род» сохраняет широкое значение греческого слова и естественно звучит в данном изречении.
- source_word: ἐκπορεύεται
  choice: выходит
  rationale: Глагол обозначает выход из одержимого человека; «выходит» прямо и естественно передаёт образ изгнания духа.
- source_word: εἰ μὴ
  choice: не иначе как
  rationale: В сочетании с отрицанием выражает исключительное условие. Оборот «не иначе как» сохраняет греческую конструкцию и подчёркивает, что названы необходимые средства.
- source_word: προσευχῇ καὶ νηστείᾳ
  choice: по молитве и посте
  rationale: Предлог ἐν здесь указывает на средство или сопровождающую духовную практику; традиционный, но понятный современному читателю оборот «по молитве и посте» передаёт оба существительных без добавочных толкований.
theological_decisions:
- issue: К чему относится «этот род»
  choice: Сохранено общее выражение «этот род» без поясняющего добавления «демонов».
  alternative: «Этот род демонов»
  rationale: В ближайшем контексте подразумевается нечистый дух, однако слово «демонов» отсутствует в греческом тексте. Сохранение эллипсиса не устраняет возможную смысловую напряжённость.
- issue: Характер связи молитвы и поста с выходом духа
  choice: Сохранена формулировка о средстве — «по молитве и посте».
  alternative: «только после молитвы и поста»
  rationale: Греческое ἐν не требует временного значения «после»; перевод не превращает духовные практики в строго заданную последовательность действий.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренным сохранением библейской фразеологии. «Не выходит иначе как» понятно современному читателю и близко к отрицательно-исключительной структуре оригинала; «по молитве и посте» сохраняет привычный библейский оборот без архаизации остальной фразы.
