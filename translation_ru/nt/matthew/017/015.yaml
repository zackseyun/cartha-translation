base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/015.yaml
  text: and saying[a], “Lord, have mercy on my son, because he is epileptic and suffers terribly; for he often falls into the fire and often into the water.”
translation:
  language: ru
  text: 'и сказал: «Господи, смилуйся над моим сыном: у него бывают приступы[a], и он тяжело страдает, ибо часто падает в огонь и часто — в воду».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово буквально связано с луной и было древним обозначением состояния, сопровождавшегося приступами. Перевод «страдает эпилепсией» был бы более определённым современным диагнозом.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: и сказал
  rationale: Греческое причастие продолжает предшествующее повествование; в современном русском конечная форма глагола естественно передаёт эту связь.
- source_word: Κύριε
  choice: Господи
  rationale: Устоявшееся и достойное русское обращение к Иисусу, сохраняющее значение κύριος.
- source_word: ἐλέησόν μου τὸν υἱόν
  choice: смилуйся над моим сыном
  rationale: Передаёт настойчивую просьбу о сострадательной помощи; υἱός конкретно означает «сын».
- source_word: σεληνιάζεται
  choice: у него бывают приступы
  rationale: Феноменологически передаёт наблюдаемое состояние, не утверждая древнее представление о влиянии луны и не навязывая точный современный диагноз.
- source_word: κακῶς πάσχει
  choice: тяжко страдает
  rationale: Естественно и выразительно передаёт усилительное значение κακῶς при πάσχει.
- source_word: πολλάκις
  choice: часто
  rationale: Прямой и естественный эквивалент; повтор сохранён в обеих параллельных частях.
- source_word: πίπτει εἰς τὸ πῦρ καὶ πολλάκις εἰς τὸ ὕδωρ
  choice: падает в огонь и часто — в воду
  rationale: Сохраняет конкретные образы, параллелизм и повторяемость опасных падений.
theological_decisions:
- issue: Передача σεληνιάζεται в контексте исцеления и изгнания духа
  choice: у него бывают приступы
  alternative: страдает эпилепсией; поражён луной
  rationale: Слова отца описывают состояние сына, но данный стих не даёт современного медицинского диагноза и не требует признания лунной причинности. Феноменологическая передача сохраняет смысл и не разрешает неоднозначность за текст.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Формулировка «смилуйся над моим сыном» звучит естественно как просьба о сострадательной помощи; повтор «часто» сохраняет настойчивый ритм греческого текста.
