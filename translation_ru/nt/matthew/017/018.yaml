  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς, καὶ ἐξῆλθεν ἀπ’ αὐτοῦ τὸ δαιμόνιον· καὶ ἐθεραπεύθη ὁ παῖς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/018.yaml
  text: And Jesus rebuked it[a], and the demon came out of him; and the boy was healed from that hour.
translation:
  language: ru
  text: Иисус запретил ему[a], и демон вышел из мальчика; с того часа мальчик был исцелён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: По контексту — демону; грамматически местоимение может относиться и к мальчику.
    reason: Уточнение неоднозначного референта греческого местоимения αὐτῷ.
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: запретил
  rationale: В контексте изгнания демона глагол обозначает властное порицание или запрещение. «Запретил» сохраняет силу речи Иисуса и является естественным библейским выражением по-русски, не сводя действие лишь к приказу.
- source_word: αὐτῷ
  choice: ему
  rationale: Местоимение передано местоимением, как в греческом тексте. Ближайший контекст указывает на демона как адресата, однако сама форма допускает соотнесение с мальчиком; неоднозначность отмечена в сноске.
- source_word: τὸ δαιμόνιον
  choice: демон
  rationale: Прямой современный эквивалент; вариант «нечистый дух» вводил бы определение, отсутствующее в данном стихе.
- source_word: ἐξῆλθεν ἀπ’ αὐτοῦ
  choice: вышел из мальчика
  rationale: Передаёт образное и конкретное выражение изгнания. Существительное «мальчик» вместо второго местоимения делает русскую фразу ясной и не создаёт ошибочного впечатления, будто демон вышел из самого себя.
- source_word: ἐθεραπεύθη
  choice: был исцелён
  rationale: Пассивная форма точно передаёт совершившееся исцеление, не ограничивая его только медицинским выздоровлением.
- source_word: ὁ παῖς
  choice: мальчик
  rationale: В повествовании речь идёт о сыне, поэтому «мальчик» точнее общего «ребёнок» и исключает контекстуально неподходящее значение «слуга».
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: с того часа
  rationale: Формально и понятно передаёт греческое временное выражение, обозначая, что исцеление наступило тогда и сохранилось.
theological_decisions:
- issue: К кому относится αὐτῷ в словах о запрете Иисуса
  choice: В основном тексте сохранено местоимение «ему»; по контексту адресатом является демон.
  alternative: Иисус запретил мальчику.
  rationale: Следующее сообщение о выходе демона убедительно указывает на демона как адресата. Вместе с тем греческое местоимение само по себе может относиться и к мальчику, поэтому формальная неоднозначность не скрыта, а отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис близок к греческому, но повтор слова «мальчик» устраняет неестественную для русского и вводящую в заблуждение цепочку местоимений.
