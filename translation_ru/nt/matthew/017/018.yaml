  terminology: «Демон» точно передаёт δαιμόνιον и не добавляет отсутствующего в оригинале определения «нечистый». «Мальчик» верно отражает контекстуальное значение παῖς. «Был исцелён» хорошо передаёт пассив ἐθεραπεύθη.
