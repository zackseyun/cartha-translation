review_pass:
  verdict: revise
  source_fidelity: Требуется уточнение передачи παραδίδοσθαι. «Будет предан» в современном русском прежде всего обозначает предательство и поэтому чрезмерно сужает значение греческого страдательного инфинитива («быть переданным / отданным»). «Будет передан» сохраняет пассив, не называет деятеля и не предрешает характер передачи. «Вскоре будет» приемлемо передаёт μέλλει как близкое предстоящее событие. Основной вариант для Συστρεφομένων лучше передать несовершенной ситуацией совместного пребывания, а альтернативой отметить процесс собирания.
  naturalness: Исправленный текст звучит естественно и литературно. «Были вместе в Галилее» не создаёт неестественного впечатления, будто речь непременно идёт о разовом завершённом собрании; оно также соответствует видовому значению греческого причастия.
  terminology: «Сын Человеческий» — необходимая устоявшаяся передача особого евангельского выражения. «Людей» точно и нейтрально передаёт ἀνθρώπων; образ «в руки людей» сохранён.
  issues:
  - severity: medium
    issue: «Будет предан» чрезмерно конкретизирует παραδίδοσθαι.
    rationale: Глагол παραδίδοσθαι означает быть переданным, отданным в чьи-либо руки; в данном контексте он может включать предательство, но сам по себе не ограничен им. Русское «предан» обычно прямо называет акт измены.
  - severity: low
    issue: «Когда они собрались» придаёт Συστρεφομένων оттенок завершённого разового действия.
    rationale: Греческое настоящее причастие в родительном самостоятельном обороте описывает сопутствующую ситуацию. «Когда они были вместе» лучше сохраняет эту открытость; вариант «когда они собирались вместе» следует дать в примечании.
  revised_text: 'Когда они были вместе в Галилее[a], Иисус сказал им: «Сын Человеческий вскоре будет передан в руки людей[b]».'
