  text: ⸀Συστρεφομένων δὲ αὐτῶν ἐν τῇ Γαλιλαίᾳ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μέλλει ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοσθαι εἰς χεῖρας ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/022.yaml
  text: While they were gathering together in Galilee[a], Jesus said to them[c][b], “The Son of Man is about to be delivered into the hands of men,”
translation:
  language: ru
  text: 'Когда они были вместе в Галилее[a], Иисус сказал им: «Сын Человеческий вскоре будет передан в руки людей[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда они собирались вместе в Галилее».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будет отдан».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συστρεφομένων
  choice: когда они собрались
  rationale: Причастие в родительном самостоятельном обороте описывает совместное пребывание или собирание учеников. Русское «когда они собрались» естественно передаёт коллективный смысл, не добавляя направления движения.
- source_word: δὲ
  choice: когда
  rationale: Связка δέ вместе с родительным самостоятельным оборотом естественно выражена временным придаточным; отдельное «же» по-русски здесь не требуется.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: в Галилее
  rationale: Прямое и естественное обозначение места.
- source_word: εἶπεν αὐτοῖς
  choice: Иисус сказал им
  rationale: Стандартная передача λέγω с косвенным дополнением, сохраняющая структуру исходного высказывания.
- source_word: Μέλλει
  choice: вскоре будет
  rationale: Передаёт направленность к близкому предстоящему событию без усиления идеи предопределённости.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшаяся буквальная передача самообозначения Иисуса, сохраняющая его библейские и богословские связи.
- source_word: παραδίδοσθαι
  choice: будет предан
  rationale: Сохраняет страдательный залог и допускает смысл как предательства, так и передачи во власть других, не ограничивая действие одним человеческим участником.
- source_word: εἰς χεῖρας
  choice: в руки
  rationale: Сохраняет понятную по-русски метафору исходного текста, не заменяя её толкованием «под власть».
- source_word: ἀνθρώπων
  choice: людей
  rationale: Естественно передаёт множественное ἀνθρώπων и сохраняет словесное сопоставление «Сын Человеческий — руки людей».
theological_decisions:
- issue: Передача ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  alternative: Человек
  rationale: Традиционная форма точно сохраняет особое евангельское самообозначение и его интертекстуальное звучание; более свободный вариант устранил бы эту многозначность.
- issue: Смысл παραδίδοσθαι в предсказании страданий
  choice: будет предан
  alternative: будет передан
  rationale: «Предан» сохраняет пассивную конструкцию и напряжение между предательством и передачей во власть людей; перевод не уточняет названного или подразумеваемого деятеля.
- issue: Оттенок μέλλει
  choice: вскоре будет
  alternative: предстоит быть
  rationale: «Вскоре будет» передаёт близость предстоящего события, не вводя более сильного утверждения о судьбе или необходимости.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельского повествования. Синтаксис сделан естественным для обычного читателя; традиционное «Сын Человеческий» и метафора «в руки людей» сохранены.
