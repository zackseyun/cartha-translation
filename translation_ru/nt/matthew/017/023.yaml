  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἀποκτενοῦσιν αὐτόν, καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθήσεται. καὶ ἐλυπήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/023.yaml
  text: and they will kill him[a], and on the third day he will be raised. And they were deeply grieved.
translation:
  language: ru
  text: и его убьют, и на третий день он будет воскрешён.[a] И они глубоко опечалились.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он воскреснет». В греческом глагол стоит в страдательном залоге: «будет воскрешён».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: его убьют
  rationale: Будущее действительного залога передано прямо и естественно. «Предадут смерти» было бы более официальным, а «убьют» не добавляет отсутствующего в глаголе оттенка юридической казни или убийства как правовой категории.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: на третий день
  rationale: Точно передаёт дательный времени и сохраняет обычную библейскую формулировку без поясняющего добавления.
- source_word: ἐγερθήσεται
  choice: будет воскрешён
  rationale: Форма будущего страдательного залога сохранена, поскольку она значима и допускает подразумеваемое действие Бога, не называя действующего лица прямо.
- source_word: ἐλυπήθησαν σφόδρα
  choice: глубоко опечалились
  rationale: «Опечалились» естественно передаёт сильную скорбь, а «глубоко» выражает усиление σφόδρα без архаичного или чрезмерно возвышенного звучания.
- source_word: καὶ … καὶ … καὶ
  choice: и … и … И
  rationale: Повтор союзов сохраняет простое последовательное построение греческого текста, не вводя дополнительного временного или причинного смысла.
theological_decisions:
- issue: Страдательный или действительный способ выражения воскресения
  choice: он будет воскрешён
  alternative: он воскреснет
  rationale: Греческий глагол стоит в будущем страдательного залога. Его сохранение передаёт формулировку источника и возможный оттенок Божьего действия, не устраняя допустимый идиоматический смысл «воскреснет».
translation_notes:
  register: Современный литературный русский язык; простая, ясная и достойная формулировка. Местоимения, относящиеся к Иисусу, даны со строчной буквы в соответствии с современной нейтральной орфографической практикой и без внесения конфессиональной особенности.
