id: MAT.17.1
reference: Matthew 17:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/001.yaml
  text: And after six days Jesus takes Peter[a], James, and John his brother[c][b], and leads them up onto a high mountain by themselves.
translation:
  language: ru
  text: Спустя шесть дней Иисус берёт с собой Петра, Иакова и его брата Иоанна и ведёт их на высокую гору, отдельно от других.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ἓξ
  choice: Спустя шесть дней
  rationale: Оборот μετά с винительным обозначает последование во времени. «Спустя шесть дней» естественно звучит по-русски и сохраняет связь с предшествующим повествованием.
- source_word: παραλαμβάνει
  choice: берёт с собой
  rationale: Глагол означает взять или повести кого-либо с собой. В русском дополнение «с собой» необходимо для ясной передачи этого оттенка.
- source_word: Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: Петра, Иакова и … Иоанна
  rationale: Использованы традиционные русские формы библейских личных имён.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: его брата Иоанна
  rationale: Приложение относится к Иоанну и в ближайшем контексте естественно указывает, что он брат Иакова. Русская конструкция сохраняет местоименную форму исходного текста и читается без искусственной тяжеловесности.
- source_word: ἀναφέρει
  choice: ведёт их
  rationale: В данном контексте глагол выражает направленное движение вверх. Идея подъёма уже естественно передаётся сочетанием «ведёт … на высокую гору».
- source_word: εἰς ὄρος ὑψηλὸν
  choice: на высокую гору
  rationale: Предлог εἰς обозначает цель движения; русское «на гору» идиоматично передаёт восхождение и место назначения.
- source_word: κατ’ ἰδίαν
  choice: отдельно от других
  rationale: Выражение означает уединение этой группы, а не то, что ученики идут без Иисуса. Такой перевод ясно передаёт отделённость от остальных и не создаёт ложного впечатления.
theological_decisions:
- issue: Историческое настоящее в евангельском повествовании
  choice: 'Сохранить настоящее время: «Иисус берёт … и ведёт»'
  alternative: 'Передать прошедшим временем: «Иисус взял … и повёл»'
  rationale: В греческом стоят формы настоящего времени παραλαμβάνει и ἀναφέρει, придающие рассказу живость. Историческое настоящее допустимо и естественно в современном русском повествовании, поэтому его сохранение точнее отражает форму оригинала.
translation_notes:
  register: Современный литературный русский язык; ясный и сдержанно-достоинный повествовательный стиль. Формулировка избегает церковнославянизмов и не добавляет конфессиональных толкований.
