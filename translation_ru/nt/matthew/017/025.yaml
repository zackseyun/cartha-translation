  text: λέγει· Ναί. καὶ ⸀ἐλθόντα εἰς τὴν οἰκίαν προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων· Τί σοι δοκεῖ, Σίμων; οἱ βασιλεῖς τῆς γῆς ἀπὸ τίνων λαμβάνουσιν τέλη ἢ κῆνσον; ἀπὸ τῶν υἱῶν αὐτῶν ἢ ἀπὸ τῶν ἀλλοτρίων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/025.yaml
  text: He said[a], “Yes.” And when he came into the house, Jesus spoke to him first, saying, “What do you think[b], Simon? From whom do the kings of the earth collect duties or poll tax—from their own sons or from others?”
translation:
  language: ru
  text: 'Он ответил: «Да». Когда он вошёл в дом, Иисус заговорил с ним первым: «Как ты думаешь, Симон? С кого цари земли взимают пошлины или подушный налог[a]: со своих сыновей или с посторонних[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «таможенные сборы или дань». Греческий текст различает τέλη — пошлины и различные сборы — и κῆνσος — подушный налог или дань.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с чужих». Имеются в виду те, кто не принадлежит к собственной семье царей, то есть посторонние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  choice: Да
  rationale: Простой утвердительный ответ; «Да» естественно и точно передаёт греческое слово.
- source_word: ἐλθόντα εἰς τὴν οἰκίαν
  choice: когда он вошёл в дом
  rationale: Причастный оборот относится к Петру; временное придаточное ясно передаёт его функцию, а местоимение сохраняет форму исходного текста.
- source_word: προέφθασεν αὐτὸν ... λέγων
  choice: Иисус заговорил с ним первым
  rationale: В данном контексте глагол означает, что Иисус опередил Петра и первым начал говорить; выбранная формулировка естественна по-русски.
- source_word: Τί σοι δοκεῖ
  choice: Как ты думаешь
  rationale: Обычное современное выражение, которым спрашивают мнение или суждение собеседника.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: земные цари
  rationale: Передаёт противопоставительный смысл выражения и не сужает γῆ до какой-либо определённой страны.
- source_word: τέλη
  choice: пошлины
  rationale: Слово обозначает косвенные сборы, пошлины или таможенные платежи и должно отличаться от следующего κῆνσον.
- source_word: κῆνσον
  choice: подушная подать
  rationale: Передаёт личный налог или дань, взимавшуюся с человека, сохраняя отличие от пошлин.
- source_word: υἱῶν αὐτῶν
  choice: своих сыновей
  rationale: Сохраняет конкретное семейное обозначение «сыновья» и принадлежность царям, важные для логики сравнения.
- source_word: ἀλλοτρίων
  choice: посторонних
  rationale: В контексте это люди, не принадлежащие к собственной семье царей; «посторонние» ясно передаёт контраст с их сыновьями.
theological_decisions:
- issue: Богословский смысл образа сыновей царя
  choice: Сохранено буквальное семейное обозначение «своих сыновей» без пояснения христологического вывода в основном тексте.
  alternative: своих детей; своих подданных
  rationale: Фраза непосредственно говорит об освобождении царских сыновей от сборов и подготавливает вывод следующего стиха. Буквальный перевод сохраняет богословское напряжение, не истолковывая его преждевременно.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным библейского повествования синтаксисом. Налоговые термины разграничены, семейная метафора сохранена без конфессионального истолкования.
