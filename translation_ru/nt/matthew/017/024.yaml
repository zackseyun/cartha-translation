  text: Ἐλθόντων δὲ αὐτῶν εἰς Καφαρναοὺμ προσῆλθον οἱ τὰ δίδραχμα λαμβάνοντες τῷ Πέτρῳ καὶ εἶπαν· Ὁ διδάσκαλος ὑμῶν οὐ τελεῖ τὰ δίδραχμα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/024.yaml
  text: When they came to Capernaum[a], those who collected the two-drachma tax came to Peter and said[b], “Does your teacher not pay the two-drachma tax?”
translation:
  language: ru
  text: 'Когда они пришли в Капернаум, к Петру подошли сборщики[a] налога в две драхмы[b] и спросили: «Разве ваш учитель не платит налог в две драхмы?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «те, кто получает две драхмы».'
    reason: lexical_alternative
  - marker: b
    text: То есть храмовый налог размером в две драхмы.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐλθόντων δὲ αὐτῶν
  choice: Когда они пришли
  rationale: Родительный самостоятельный оборот выражает временное обстоятельство. Такой перевод естественен по-русски; слабое переходное δέ отдельно не передаётся.
- source_word: Καφαρναοὺμ
  choice: Капернаум
  rationale: Использована устоявшаяся русская форма географического названия.
- source_word: προσῆλθον
  choice: подошли
  rationale: Глагол обозначает приближение к Петру; «подошли» точно и естественно передаёт движение.
- source_word: οἱ τὰ δίδραχμα λαμβάνοντες
  choice: сборщики налога в две драхмы
  rationale: Причастный оборот обозначает людей по их занятию. Контекстуальное «сборщики налога» яснее буквального «получающие две драхмы».
- source_word: δίδραχμα
  choice: налог в две драхмы
  rationale: Форма обозначает платеж размером в две драхмы. Слово «налог» раскрывает очевидный из контекста смысл, а размер платежа сохраняется.
- source_word: τῷ Πέτρῳ
  choice: к Петру
  rationale: Дательный падеж при глаголе приближения естественно передан конструкцией с предлогом «к».
- source_word: Ὁ διδάσκαλος ὑμῶν
  choice: ваш Учитель
  rationale: «Учитель» — точный и привычный в евангельском контексте эквивалент διδάσκαλος. Прописная буква указывает на употребление слова как обращения или устойчивого обозначения Иисуса, не меняя его значения.
- source_word: οὐ τελεῖ
  choice: Разве … не платит
  rationale: В данном контексте τελέω означает исполнение денежного обязательства, то есть уплату. Частица «разве» сохраняет отрицательную форму вопроса и подразумеваемое ожидание утвердительного ответа, не превращая его в утверждение.
theological_decisions:
- issue: Обозначает ли δίδραχμα монеты или обязательный платеж
  choice: В основном тексте — «налог в две драхмы»
  alternative: «две драхмы» или «двухдрахмовый сбор»
  rationale: Речь идёт не просто о получении монет, а о том, исполняет ли Иисус обязанность внести установленный платеж. Уточнение «налог» отражает контекст, не добавляя конфессионального толкования.
- issue: Прагматическая сила отрицательного вопроса οὐ τελεῖ
  choice: 'Сохранить отрицательный вопрос: «Разве … не платит?»'
  alternative: «Ваш Учитель ведь платит…?»
  rationale: Греческая конструкция, вероятно, предполагает утвердительный ответ, однако выбранная форма сохраняет вопрос и его оттенок ожидания, не разрешая неоднозначность чрезмерно явно.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная, без архаизмов. Повторение «налог в две драхмы» сохранено, поскольку оно соответствует повтору τὰ δίδραχμα в греческом тексте и подчёркивает предмет вопроса.
