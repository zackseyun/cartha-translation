  source_fidelity: 'Требуется исправление «удочку»: ἄγκιστρον означает «крючок», а не удочку (рыболовное удилище). Контекстуальное значение σκανδαλίσωμεν точнее и естественнее передано как предотвращение возмущения/оскорбления, при этом альтернативное образное значение сохранено в сноске. Остальная последовательность действий, «статир» и значение ἀντὶ ἐμοῦ καὶ σοῦ переданы верно.'
  naturalness: Предлагаемый текст звучит современно и литературно. «Забрось крючок» сохраняет конкретность оригинала; «первую рыбу, которая попадётся на крючок» ясно передаёт первую пойманную и поднятую рыбу. Конструкция «Открой ей рот» избегает несколько тяжёлого деепричастного оборота «Открыв ей рот».
  terminology: «Статир» сохранён как точное наименование монеты и снабжён культурной сноской. «За Меня и за себя» адекватно передаёт плату за Иисуса и Петра. Формулировка о том, чтобы не вызвать возмущения, не навязывает вывода об абсолютной обязанности платить налог.
