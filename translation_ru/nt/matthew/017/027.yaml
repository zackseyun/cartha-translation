source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ σκανδαλίσωμεν αὐτούς, πορευθεὶς ⸀εἰς θάλασσαν βάλε ἄγκιστρον καὶ τὸν ⸀ἀναβάντα πρῶτον ἰχθὺν ἆρον, καὶ ἀνοίξας τὸ στόμα αὐτοῦ εὑρήσεις στατῆρα· ἐκεῖνον λαβὼν δὸς αὐτοῖς ἀντὶ ἐμοῦ καὶ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/027.yaml
  text: But so that we may not offend them[a], go to the sea, cast in a hook, and take the first fish that comes up. And when you open its mouth, you will find a stater[b]. Take that and give it to them for me and for yourself.
translation:
  language: ru
  text: Но, чтобы не вызвать у них возмущения[a], пойди к морю, забрось крючок и вытащи первую рыбу, которая попадётся на крючок. Открой ей рот — и найдёшь статир[b]. Возьми его и отдай им за Меня и за себя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы не стать для них преткновением», «чтобы не дать им повода к преткновению».'
    reason: lexical_alternative
  - marker: b
    text: Статир — монета стоимостью примерно в четыре драхмы; её было достаточно, чтобы уплатить храмовый налог за двух человек.
    reason: cultural_note
lexical_decisions:
- source_word: σκανδαλίσωμεν
  choice: вводить их в соблазн
  rationale: Сохраняет образную силу греческого глагола и его контекстуальный смысл — не дать повода к преткновению или возмущению; возможное более прагматическое значение пояснено в сноске.
- source_word: θάλασσαν
  choice: к морю
  rationale: Передаёт исходное θάλασσα; речь идёт о Галилейском море, хотя географически это озеро.
- source_word: ἄγκιστρον
  choice: удочку
  rationale: В современном русском «закинь удочку» естественно передаёт ловлю на крючок, не предполагая сеть.
- source_word: τὸν ἀναβάντα πρῶτον ἰχθὺν
  choice: первую попавшуюся рыбу
  rationale: Естественно передаёт первую рыбу, которая попадётся на крючок и будет поднята из воды.
- source_word: ἆρον
  choice: вытащи
  rationale: В данном рыболовном контексте конкретно и естественно передаёт поднятие пойманной рыбы.
- source_word: στατῆρα
  choice: статир
  rationale: Сохраняет точное название монеты; её стоимость и назначение поясняются в сноске.
- source_word: ἀντὶ ἐμοῦ καὶ σοῦ
  choice: за Меня и за себя
  rationale: Идиоматично выражает плату за обоих, сохраняя значение ἀντί в данном контексте.
- source_word: πορευθεὶς
  choice: пойди
  rationale: Передаёт сопутствующее предварительное действие естественным русским повелительным оборотом.
- source_word: δὸς αὐτοῖς
  choice: отдай им
  rationale: Естественно относится к передаче монеты сборщикам в уплату налога.
theological_decisions:
- issue: Значение σκανδαλίζω в связи с уплатой храмового налога
  choice: Иисус велит заплатить, чтобы не дать сборщикам повода к соблазну или возмущению, не отменяя сказанного прежде о свободе сыновей.
  alternative: Иисус признаёт безусловную обязанность платить налог либо совершает чудо исключительно ради демонстрации силы.
  rationale: 'Связка ἵνα δὲ μὴ сохраняет напряжение с предшествующим утверждением о свободе сыновей: плата представлена как уступка ради других, а не как явное опровержение предыдущего довода.'
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Синтаксис сделан естественным для прямой речи; термин «статир» сохранён ради точности и пояснён. Прописная буква в «Меня» следует принятой русской библейской типографической традиции.
