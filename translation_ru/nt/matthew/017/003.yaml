  text: καὶ ἰδοὺ ⸀ὤφθη αὐτοῖς Μωϋσῆς καὶ Ἠλίας ⸂συλλαλοῦντες μετ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/003.yaml
  text: And behold[a], Moses and Elijah appeared to them, talking with him.
translation:
  language: ru
  text: И вот, им явились Моисей и Илия и беседовали с Ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: и вот
  rationale: Передаёт указательно-повествовательную силу частицы и внезапность увиденного естественным для современного русского языка оборотом.
- source_word: ὤφθη αὐτοῖς
  choice: им явились
  rationale: Формально пассивная форма ὁράω здесь естественно выражает видимое явление; русский глагол «явились» сохраняет событие появления и дательный обозначения свидетелей.
- source_word: Μωϋσῆς καὶ Ἠλίας
  choice: Моисей и Илия
  rationale: Устоявшиеся русские формы библейских имён.
- source_word: συλλαλοῦντες μετ’ αὐτοῦ
  choice: беседовали с Ним
  rationale: Причастие обозначает взаимное общение, разговор. «Беседовали» звучит естественно и достойно; форма множественного числа согласуется с Моисеем и Илиёй.
theological_decisions:
- issue: К кому относится αὐτοῦ
  choice: «с Ним» относится к Иисусу
  alternative: Прямо заменить местоимение именем «Иисус»
  rationale: Ближайший контекст преображения ясно указывает на Иисуса, однако местоимение сохранено вслед за греческим текстом; прописная буква соответствует принятому русскому библейскому употреблению.
- issue: Характер явления Моисея и Илии
  choice: Видимое явление без уточнения его способа
  alternative: «были увидены ими»
  rationale: Текст утверждает, что ученики увидели Моисея и Илию, но не объясняет природу или способ их присутствия; перевод не добавляет такого объяснения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «И вот» сохраняет живость повествования, а «беседовали» точнее передаёт взаимность разговора, чем нейтральное «говорили».
