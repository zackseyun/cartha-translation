  text: λέγω δὲ ὑμῖν ὅτι Ἠλίας ἤδη ἦλθεν, καὶ οὐκ ἐπέγνωσαν αὐτὸν ἀλλὰ ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν· οὕτως καὶ ὁ υἱὸς τοῦ ἀνθρώπου μέλλει πάσχειν ὑπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/012.yaml
  text: But I tell you that Elijah has already come[a], and they did not recognize him, but did to him whatever they wanted[c][b]. So also the Son of Man is about to suffer at their hands.
translation:
  language: ru
  text: 'Но говорю вам: Илия уже пришёл, и его не распознали[a], а поступили с ним, как хотели[b]. Так и Сыну Человеческому предстоит пострадать[c] от их рук.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не узнали его» или «не признали его». Греческое слово может означать, что они не поняли, кто он или какова его роль.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сделали с ним всё, что хотели» или «обращались с ним, как им хотелось». Греческий оборот выражает, что они поступили с ним по своей воле.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «будет страдать» или «должен пострадать». Греческий оборот указывает на предстоящее страдание; сам по себе он не уточняет степень его близости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Но говорю вам
  rationale: Сохраняет прямую формулу речи и контраст, выраженный δέ; оборот естественен для современного литературного русского языка.
- source_word: Ἠλίας ἤδη ἦλθεν
  choice: Илия уже пришёл
  rationale: Передаёт завершённость прихода и его актуальность в контексте без ненужного уточнения личности названного Илии.
- source_word: οὐκ ἐπέγνωσαν αὐτόν
  choice: его не узнали
  rationale: В данном контексте ἐπιγινώσκω обозначает неспособность распознать личность или роль; «не узнали» кратко и естественно сохраняет этот смысл.
- source_word: ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν
  choice: поступили с ним как хотели
  rationale: Естественно передаёт греческий идиоматический оборот и неограниченность действий, определяемых их собственной волей.
- source_word: οὕτως καὶ
  choice: Так и
  rationale: Ясно обозначает аналогию между участью Илии и предстоящими страданиями Сына Человеческого.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшееся русское соответствие титулу, сохраняющее его библейские ассоциации.
- source_word: μέλλει πάσχειν
  choice: предстоит пострадать
  rationale: Передаёт направленность к близкому будущему и предстоящее событие, не усиливая выражение до явной формулы божественной необходимости.
- source_word: ὑπ’ αὐτῶν
  choice: от их рук
  rationale: Естественный русский оборот, ясно выражающий их враждебную роль как действующих лиц.
theological_decisions:
- issue: Отождествление пришедшего Илии
  choice: В основном тексте сохранено имя «Илия» без поясняющей подстановки Иоанна Крестителя.
  alternative: Прямо назвать здесь Иоанна Крестителя.
  rationale: Ближайший контекст разъясняет референта, но сам данный стих называет Илию; перевод не должен заранее разрешать это средствами парафраза.
- issue: Смысл μέλλει применительно к страданию Сына Человеческого
  choice: «предстоит пострадать» как указание на грядущее страдание.
  alternative: «должен пострадать» или «обречён пострадать».
  rationale: μέλλει πάσχειν указывает на предстоящее событие, но эта фраза сама по себе не выражает столь сильной необходимости или предопределённости, как предложенные альтернативы.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан ясным и естественным; традиционные титул и имя сохранены. Формулировки не добавляют конфессионального толкования и сохраняют смысловую напряжённость текста.
