source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν οἱ ⸀μαθηταὶ λέγοντες· Τί οὖν οἱ γραμματεῖς λέγουσιν ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/010.yaml
  text: And the disciples asked him, saying, “Why then do the scribes say that Elijah must come first?”
translation:
  language: ru
  text: 'И ученики спросили Его: «Почему же книжники говорят, что Илия должен прийти прежде?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: спросили
  rationale: Аорист вводит прямой вопрос; «спросили» — естественный современный эквивалент без излишней формальности.
- source_word: οἱ μαθηταὶ
  choice: ученики
  rationale: Артикль указывает на уже известную из контекста группу. Притяжательное «Его ученики» не добавлено, поскольку его нет при существительном в греческом тексте.
- source_word: λέγοντες
  choice: двоеточие перед прямой речью
  rationale: В современном русском буквальное «говоря» здесь тяжеловесно; содержание причастия естественно передано оформлением прямой речи.
- source_word: Τί οὖν
  choice: Почему же
  rationale: В сочетании с λέγουσιν ὅτι вопросительное τί запрашивает основание утверждения; частица «же» передаёт связующее и выводное значение οὖν.
- source_word: οἱ γραμματεῖς
  choice: книжники
  rationale: Традиционный и точный русский термин для знатоков и толкователей Писания в евангельском контексте.
- source_word: λέγουσιν ὅτι
  choice: говорят, что
  rationale: Сохраняет настоящее время и придаточное, передающее содержание утверждения.
- source_word: Ἠλίαν
  choice: Илия
  rationale: Употреблена устоявшаяся русская форма библейского имени.
- source_word: δεῖ ἐλθεῖν
  choice: должен прийти
  rationale: Передаёт выраженную δεῖ необходимость кратко и естественно.
- source_word: πρῶτον
  choice: прежде
  rationale: В данном контексте обозначает предшествование во времени; «прежде» звучит естественно и сохраняет последовательность событий.
theological_decisions:
- issue: Смысл вопроса учеников о пришествии Илии
  choice: Вопрос передан без указания на то, принимают ли ученики учение книжников, оспаривают его или ожидают уточнения.
  alternative: Можно было бы придать вопросу оттенок недоверия либо прямо пояснить его связь с пророчеством Малахии.
  rationale: Греческий текст сам по себе сохраняет напряжение, разрешаемое лишь в следующих стихах; перевод не должен заранее привносить ответ или ветхозаветное пояснение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис прямой речи естественно передаёт λέγοντες; лексика «книжники», «Илия» сохраняет общепринятую библейскую терминологию.
