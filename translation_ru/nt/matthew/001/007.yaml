base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/007.yaml
  text: Solomon fathered Rehoboam[a], Rehoboam fathered Abijah, and Abijah fathered Asaph.
translation:
  language: ru
  text: Соломон родил Ровоама, Ровоам родил Авию, а Авия родил Асафа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых рукописях стоит «Аса» — имя царя Иудеи, упомянутого в 3 Царств 15 и 2 Паралипоменон 14–16; в используемом здесь греческом тексте стоит «Асаф».
    reason: textual_variant
lexical_decisions:
- source_word: ἐγέννησεν
  choice: родил
  rationale: В мужской родословной глагол γεννάω обозначает отцовство и происхождение. «Родил» — традиционное для библейских родословий, краткое и понятное современному русскому читателю выражение; контекст ясно показывает, что речь идёт об отце.
- source_word: δὲ
  choice: нулевая передача / «а»
  rationale: Здесь δέ служит слабой связкой между звеньями родословной, а не выражает противопоставление. Первое вхождение естественно не выражать отдельно, второе передать запятой, третье — союзом «а» для плавного русского синтаксиса.
- source_word: Σολομών
  choice: Соломон
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: Ῥοβοάμ
  choice: Ровоам
  rationale: Устоявшаяся русская форма библейского имени, сохраняющая связь с ветхозаветным персонажем.
- source_word: Ἀβιά
  choice: Авия
  rationale: Устоявшаяся русская форма имени иудейского царя, обеспечивающая узнаваемость и связь с Ветхим Заветом.
- source_word: Ἀσάφ
  choice: Асаф
  rationale: Основной текст следует предоставленному греческому чтению Ἀσάφ, не исправляя его молча на исторически ожидаемое имя Аса.
theological_decisions:
- issue: Следует ли согласовать родословную Матфея с ветхозаветным перечнем царей, передав Ἀσάφ как «Аса»
  choice: Сохранить «Асаф» в основном тексте
  alternative: Передать как «Аса»
  rationale: В предоставленном тексте SBLGNT стоит Ἀσάφ. Приоритет греческого источника требует сохранить это чтение, а вариант «Аса», совпадающий с именем царя Иудеи в 3 Царств 15 и 2 Паралипоменон 14–16, указать в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской родословной. Формула «родил» сохраняет лаконичный повтор оригинала и привычна в генеалогическом контексте. Маркер примечания поставлен непосредственно после спорного имени.
