  text: ⸀ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου ἐποίησεν ὡς προσέταξεν αὐτῷ ὁ ἄγγελος κυρίου καὶ παρέλαβεν τὴν γυναῖκα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/024.yaml
  text: Then Joseph[a], having awakened from sleep, did as the angel of the Lord commanded him and took his wife.
translation:
  language: ru
  text: Проснувшись ото сна, Иосиф сделал так, как повелел ему ангел Господа, и взял к себе свою жену[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принял свою жену»; греческий глагол может означать принятие человека к себе, в том числе в свой дом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου
  choice: Проснувшись, Иосиф
  rationale: Естественная русская передача обстоятельственного причастия и идиомы пробуждения ото сна; δέ выражает переход в повествовании и отдельно не переводится, поскольку последовательность ясно передана синтаксисом.
- source_word: ἐποίησεν ὡς
  choice: сделал так, как
  rationale: Передаёт соответствие поступка данному повелению и сохраняет прозрачную связь с греческой конструкцией.
- source_word: προσέταξεν
  choice: повелел
  rationale: Глагол обозначает властное распоряжение; «повелел» уместно в достойном библейском регистре и понятно современному читателю.
- source_word: ὁ ἄγγελος κυρίου
  choice: ангел Господа
  rationale: Точная и естественная передача греческого сочетания с родительным падежом; сохраняет традиционный библейский оборот без добавления определённости, не выраженной артиклем при κυρίου.
- source_word: παρέλαβεν
  choice: взял к себе
  rationale: Передаёт значение принятия человека к себе, вероятно в дом и семейную жизнь, не сводя глагол только к физическому действию.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: свою жену
  rationale: В данном брачно-правовом контексте γυνή означает «жена»; возвратное «свою» естественно по-русски при подлежащем «Иосиф».
theological_decisions:
- issue: Значение γυνή до супружеской близости
  choice: свою жену
  alternative: эту женщину
  rationale: Контекст помолвки в иудейской брачно-правовой среде позволяет Матфею называть Марию женой Иосифа, не подразумевая тем самым супружескую близость, которую стих 25 отдельно отрицает до рождения ребёнка.
- issue: Передача κύριος в выражении ἄγγελος κυρίου
  choice: ангел Господа
  alternative: ангел Яхве
  rationale: Перевод «Господь» непосредственно отражает κύριος в греческом тексте и сохраняет узнаваемый библейский оборот, не подменяя исходную форму реконструированным еврейским именем.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Причастная конструкция передана естественным деепричастием; «повелел» сохраняет достоинство и силу исходного глагола. Маркер сноски поставлен непосредственно после выражения, к которому относится.
