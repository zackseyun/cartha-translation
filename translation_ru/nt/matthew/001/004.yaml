  yaml_path: translation/nt/matthew/001/004.yaml
  text: Aram fathered Amminadab[a], and Amminadab fathered Nahshon, and Nahshon fathered Salmon.
translation:
  language: ru
  text: Арам родил Аминадава, Аминадав родил Наассона, Наассон родил Салмона.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀρὰμ
  choice: Арам
  rationale: Имя передано непосредственно по греческой форме Ἀράμ; русская форма «Арам» также привычна по родословиям Нового Завета.
- source_word: δὲ
  choice: нулевое соединение / «а»
  rationale: В родословии δέ последовательно продвигает перечень и не выражает сильного противопоставления. В первых двух звеньях естественный русский синтаксис допускает бессоюзную связь, а в последнем «а» сохраняет ритм перечисления.
- source_word: ἐγέννησεν
  choice: родил
  rationale: В мужской родословной глагол обозначает отцовство и происхождение. «Родил» — традиционная, краткая и понятная русская формула родословия, не утверждающая непременно непосредственную хронологическую смежность поколений сверх значения генеалогической записи.
- source_word: Ἀμιναδάβ
  choice: Аминадав
  rationale: Устойчивая русская библейская форма имени, соответствующая греческому Ἀμιναδάβ.
- source_word: Ναασσών
  choice: Наассон
  rationale: Форма близко передаёт греческое Ναασσών и соответствует укоренившейся русской новозаветной традиции.
- source_word: Σαλμών
  choice: Салмон
  rationale: Прямая и узнаваемая русская передача греческого имени Σαλμών.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский с сохранением лаконичной и ритмически повторяющейся формы родословия. Имена переданы в привычных русских библейских формах, сверенных с греческим текстом. Сноска об альтернативе «Рам», уместная для английской традиции, в русском тексте не нужна: форма «Арам» естественно отражает SBLGNT и общеупотребительна в русском Новом Завете.'
