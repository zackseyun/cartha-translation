  text: τέξεται δὲ υἱὸν καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν, αὐτὸς γὰρ σώσει τὸν λαὸν αὐτοῦ ἀπὸ τῶν ἁμαρτιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/021.yaml
  text: She will bear a son[a], and you shall call his name Jesus, for he will save his people from their sins.
translation:
  language: ru
  text: Она родит сына, и ты назовёшь его Иисусом[a], потому что он сам спасёт свой народ от их грехов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя Иисус — греческая форма, соответствующая еврейско-арамейскому имени Йешуа, которое в русской библейской традиции также передаётся как «Иисус Навин». Оно связано со значением «Яхве спасает». Слово «спасёт» поясняет это имя и передаёт игру слов оригинала.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέξεται
  choice: родит
  rationale: Будущая форма τίκτω в контексте рождения ребёнка; «родит» естественно и точно передаёт предсказание.
- source_word: δὲ
  choice: —
  rationale: Слабая связка δέ не выражена отдельно, поскольку по-русски продолжение речи естественно звучит без дополнительного союза.
- source_word: υἱὸν
  choice: сына
  rationale: Неопределённый по форме объект при глаголе рождения естественно передаётся по-русски как «сына».
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: ты назовёшь его
  rationale: Естественный современный русский эквивалент греко-семитской формулы наречения имени; сохраняет прямое обращение во втором лице.
- source_word: Ἰησοῦν
  choice: Иисусом
  rationale: Устоявшаяся русская форма новозаветного имени; творительный падеж требуется после «назовёшь».
- source_word: αὐτὸς
  choice: именно он
  rationale: Выражение передаёт явное ударение греческого местоимения и указывает на самого названного ребёнка как совершающего спасение.
- source_word: γὰρ
  choice: потому что
  rationale: Вводит основание для данного имени; «потому что» ясно и естественно передаёт объяснительную связь.
- source_word: σώσει
  choice: спасёт
  rationale: В сочетании с «от грехов» глагол σῴζω имеет прямой смысл спасения, лучше всего передаваемый словом «спасёт».
- source_word: τὸν λαὸν αὐτοῦ
  choice: свой народ
  rationale: Возвратное притяжательное местоимение естественно связывает народ с действующим лицом; перевод не сужает и не расширяет круг этого народа.
- source_word: ἀπὸ τῶν ἁμαρτιῶν αὐτῶν
  choice: от их грехов
  rationale: Сохраняются значение отделения у ἀπό, множественное число «грехов» и соотнесённость местоимения с народом как совокупностью людей.
theological_decisions:
- issue: Ударное αὐτός и роль Иисуса в спасении
  choice: именно он спасёт
  alternative: он спасёт
  rationale: Греческое местоимение выражено отдельно и имеет усилительный оттенок. «Именно он» сохраняет этот акцент, не добавляя объяснения о природе или способе спасения.
- issue: Объём выражения «свой народ»
  choice: свой народ
  alternative: народ Израиля / всех принадлежащих ему людей
  rationale: Сам стих не уточняет объём выражения. Перевод сохраняет его заветное звучание и не ограничивает народ Израилем, но и не расширяет явно до всего человечества.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и общедоступным синтаксисом. Местоимения, относящиеся к Иисусу, пишутся со строчной буквы по обычным нормам современного русского текста; это не несёт богословской оценки.
