id: MAT.1.20
reference: Matthew 1:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ ἐνθυμηθέντος ἰδοὺ ἄγγελος κυρίου κατ’ ὄναρ ἐφάνη αὐτῷ λέγων· Ἰωσὴφ υἱὸς Δαυίδ, μὴ φοβηθῇς παραλαβεῖν ⸀Μαρίαν τὴν γυναῖκά σου, τὸ γὰρ ἐν αὐτῇ γεννηθὲν ἐκ πνεύματός ἐστιν ἁγίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/020.yaml
  text: But as he was considering these things, behold, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.”
translation:
  language: ru
  text: 'Но пока он обдумывал это, и вот, ангел Господа явился ему во сне и сказал: «Иосиф, сын Давида! Не бойся принять Марию, свою жену[a], потому что то, что зачато в ней, — от Святого Духа».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «взять к себе Марию, свою жену». Греческое выражение означает принять её в свой дом как жену.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνθυμηθέντος
  choice: пока он обдумывал
  rationale: Передаёт продолжавшееся внутреннее размышление Иосифа, не представляя его решение уже окончательно принятым.
- source_word: ἰδοὺ
  choice: не выражено отдельным словом
  rationale: В современном русском повествовании внезапность появления естественно передаётся самим порядком событий; «вот» здесь звучало бы более архаично и утяжеляло фразу.
- source_word: ἄγγελος κυρίου
  choice: ангел Господа
  rationale: Отсутствие артикля при ἄγγελος не позволяет без необходимости превращать выражение в титул «Ангел Господень»; перевод сохраняет неопределённость участника и принадлежность Господу.
- source_word: κατ’ ὄναρ
  choice: во сне
  rationale: Естественное русское соответствие устойчивому греческому выражению.
- source_word: ἐφάνη
  choice: явился
  rationale: Обычное и уместное обозначение сверхъестественного явления в повествовательном контексте.
- source_word: υἱὸς Δαυίδ
  choice: сын Давида
  rationale: Сохраняет указание на происхождение Иосифа из рода Давида и возможный мессианский резонанс.
- source_word: μὴ φοβηθῇς
  choice: не бойся
  rationale: Прямой, современный и естественный русский запрет.
- source_word: παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: принять Марию, жену твою
  rationale: «Принять» передаёт введение Марии в дом и завершение брачного устройства, а приложение «жену твою» сохраняет уже обозначенный в греческом тексте её статус, не подразумевая нового заключения брака.
- source_word: τὸ ἐν αὐτῇ γεννηθὲν
  choice: зачатое в ней
  rationale: Субстантивированное причастие среднего рода передано без преждевременной конкретизации словом «ребёнок»; в данном внутриутробном контексте «зачатое» естественно выражает смысл γεννάω.
- source_word: ἐκ πνεύματός ἐστιν ἁγίου
  choice: от Святого Духа
  rationale: Предлог ἐκ указывает на источник или происхождение; русское «от» ясно и кратко сохраняет эту связь.
theological_decisions:
- issue: Значение κυρίου в выражении ἄγγελος κυρίου
  choice: Господа
  alternative: Господень; Яхве
  rationale: «Господа» непосредственно передаёт κύριος, не навязывая тексту определённую ветхозаветную теофаническую идентификацию и не подставляя тетраграмматон, отсутствующий в греческом тексте.
- issue: Референт πνεύματός ... ἁγίου
  choice: Святого Духа
  alternative: святого духа; силы Святого Духа
  rationale: Контекст повествования Матфея указывает на Божьего Святого Духа как источник зачатия; перевод не заменяет Духа безличной силой.
- issue: Брачный статус Марии в παραλαβεῖν ... τὴν γυναῖκά σου
  choice: принять Марию, жену твою
  alternative: взять Марию в жёны
  rationale: Греческое «жену твою» уже называет Марию женой Иосифа; основной текст сохраняет это напряжение с обручальным контекстом и не создаёт впечатления, будто её статус должен возникнуть только после этого действия.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Архаизирующее «се» и тяжеловесное «Ангел Господень» не используются. Инверсия «жену твою» сохранена умеренно ради точности и ясной связи с приложением; сноска поясняет брачно-бытовой смысл глагола.
