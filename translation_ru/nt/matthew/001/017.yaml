id: MAT.1.17
reference: Matthew 1:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Πᾶσαι οὖν αἱ γενεαὶ ἀπὸ Ἀβραὰμ ἕως Δαυὶδ γενεαὶ δεκατέσσαρες, καὶ ἀπὸ Δαυὶδ ἕως τῆς μετοικεσίας Βαβυλῶνος γενεαὶ δεκατέσσαρες, καὶ ἀπὸ τῆς μετοικεσίας Βαβυλῶνος ἕως τοῦ χριστοῦ γενεαὶ δεκατέσσαρες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/017.yaml
  text: So all the generations from Abraham to David were fourteen generations[a], and from David to the exile to Babylon fourteen generations[b], and from the exile to Babylon to the Messiah fourteen generations.
translation:
  language: ru
  text: Итак, от Авраама до Давида — всего четырнадцать поколений, от Давида до переселения в Вавилон — четырнадцать поколений, и от переселения в Вавилон до Мессии[a] — четырнадцать поколений.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа». Греческое слово χριστός означает «Помазанник» и здесь употреблено как титул.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσαι οὖν αἱ γενεαὶ
  choice: Итак, … всего … поколений
  rationale: οὖν вводит итог предшествующего перечня и передано словом «итак». В естественной русской конструкции Πᾶσαι передаётся наречием «всего», указывающим на полное число поколений в первом из трёх итоговых отрезков.
- source_word: γενεαὶ δεκατέσσαρες
  choice: четырнадцать поколений
  rationale: γενεά в данном родословном контексте обозначает последовательное поколение. Повтор сочетания сохранён во всех трёх частях ради формульного параллелизма оригинала.
- source_word: ἀπὸ … ἕως
  choice: от … до
  rationale: Обычная и точная русская конструкция для обозначения границ каждого отрезка родословия.
- source_word: μετοικεσίας Βαβυλῶνος
  choice: переселения в Вавилон
  rationale: μετοικεσία означает принудительное перемещение или переселение. Этот вариант близок к лексическому значению и сохраняет направленность к Вавилону, не сводя событие лишь к состоянию плена.
- source_word: τοῦ χριστοῦ
  choice: Мессии
  rationale: Артикль и положение в кульминации родословия показывают титульное употребление χριστός. «Мессия» передаёт смысл греческого титула, а не воспринимается здесь как личное имя.
- source_word: Ἀβραὰμ / Δαυὶδ / Βαβυλῶνος
  choice: Авраам / Давид / Вавилон
  rationale: Использованы устойчивые русские формы библейских имён и географического названия.
theological_decisions:
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном стихе слово употреблено как титул того, к кому ведёт родословие. «Мессия» ясно выражает титульный смысл; традиционная форма «Христос» указана в примечании как допустимый вариант.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной формульностью. Трёхчастный параллелизм и повтор «четырнадцать поколений» сохранены; тире помогают ясно оформить счётную конструкцию.
