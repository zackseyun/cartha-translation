source:
  edition: SBLGNT
  text: Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας, ἐξ ἧς ἐγεννήθη Ἰησοῦς ὁ λεγόμενος χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/016.yaml
  text: And Jacob fathered Joseph[a], the husband of Mary, from whom Jesus was born[b], who is called the Messiah.
translation:
  language: ru
  text: Иаков же стал отцом Иосифа, мужа Марии, от которой родился Иисус, называемый Мессией.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «называемый Христом».'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: же
  rationale: Частица слегка продвигает родословие и одновременно отмечает очередное звено; безударное «же» естественно передаёт эту связующую функцию без сильного противопоставления.
- source_word: ἐγέννησεν
  choice: стал отцом
  rationale: В родословии глагол обозначает отцовство и происхождение по мужской линии. «Стал отцом» ясно и современно, в отличие от архаичного «родил» применительно к мужчине или книжного «породил».
- source_word: τὸν ἄνδρα Μαρίας
  choice: мужа Марии
  rationale: При родительном падеже имени Марии ἀνήρ имеет ясное значение супруга.
- source_word: ἐξ ἧς
  choice: от которой
  rationale: Женский род единственного числа однозначно отсылает к Марии; перевод сохраняет эту грамматическую связь и значение ἐκ.
- source_word: ἐγεννήθη
  choice: родился
  rationale: Пассивная форма здесь естественно передаётся русским возвратным глаголом «родился» и сохраняет намеренный переход от отцовства Иосифа к рождению Иисуса от Марии.
- source_word: ὁ λεγόμενος
  choice: называемый
  rationale: Причастная конструкция кратко и естественно присоединяет общеизвестное титульное обозначение к имени Иисуса.
- source_word: χριστός
  choice: Мессией
  rationale: Здесь χριστός выступает как титул в формуле «называемый…», поэтому передаётся смысловым эквивалентом «Мессия», а не как ставшая именеподобной форма «Христос».
theological_decisions:
- issue: Передача Χριστός в формуле идентификации Иисуса
  choice: Мессией
  alternative: Христом
  rationale: Конструкция ὁ λεγόμενος χριστός представляет χριστός как титул. «Мессия» сохраняет его смысл, а сноска указывает традиционную альтернативу.
- issue: Смена родословной формулы при переходе к Иисусу
  choice: Иаков стал отцом Иосифа, но Иисус родился от Марии
  alternative: Формулировка, согласно которой Иосиф стал отцом Иисуса
  rationale: Греческий текст намеренно переходит от активного ἐγέννησεν к пассивному ἐγεννήθη и употребляет женское ἐξ ἧς, относящееся к Марии. Перевод сохраняет различие, не добавляя его богословского истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формула «стал отцом» понятна широкому читателю и последовательно передаёт мужские звенья родословия; «родился» подчёркивает смену конструкции в отношении Иисуса. Местоимение «которой» однозначно относится к Марии.
