  text: Σαλμὼν δὲ ἐγέννησεν τὸν ⸂Βόες ἐκ τῆς Ῥαχάβ, Βόες⸃ δὲ ἐγέννησεν τὸν ⸂Ἰωβὴδ ἐκ τῆς Ῥούθ, Ἰωβὴδ⸃ δὲ ἐγέννησεν τὸν Ἰεσσαί,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/005.yaml
  text: Salmon fathered Boaz by Rahab[a], and Boaz fathered Obed by Ruth, and Obed fathered Jesse,
translation:
  language: ru
  text: Салмон стал отцом Вооза от Рахав[a], Вооз стал отцом Овида от Руфи, а Овид стал отцом Иессея.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из Рахав»; так же далее: «из Руфи». Греческий текст употребляет ἐκ с именем каждой матери.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: стал отцом
  rationale: В родословной глагол обозначает мужское отцовство и происхождение по отцовской линии. Современное «стал отцом» звучит естественно и достойно, не прибегая к устаревшему «родил» или «породил».
- source_word: ἐκ
  choice: от
  rationale: Конструкция ἐκ с именем матери указывает на материнское происхождение. Русское «от Рахав / от Руфи» естественно сохраняет эту явную материнскую отсылку.
- source_word: δὲ
  choice: нулевая связка / «а»
  rationale: Здесь δέ мягко связывает звенья родословной, не выражая противопоставления. В русском повтор союза не обязателен; перед последним звеном «а» поддерживает плавное перечисление.
- source_word: Σαλμὼν
  choice: Салмон
  rationale: Устоявшаяся русская библейская форма имени, сохраняющая узнаваемость персонажа.
- source_word: Βόες
  choice: Вооз
  rationale: Устоявшаяся русская форма ветхозаветного имени; она обеспечивает межзаветную узнаваемость, хотя греческая форма передана иначе.
- source_word: Ῥαχάβ
  choice: Рахав
  rationale: Современная русская передача имени, близкая греческой форме и узнаваемая по ветхозаветному повествованию.
- source_word: Ἰωβὴδ
  choice: Овид
  rationale: Устоявшаяся русская библейская форма имени, связывающая новозаветную родословную с ветхозаветным персонажем.
- source_word: Ῥούθ
  choice: Руфь
  rationale: Устоявшаяся русская форма имени и названия соответствующей ветхозаветной книги; после предлога употреблён родительный падеж «Руфи».
- source_word: Ἰεσσαί
  choice: Иессей
  rationale: Устоявшаяся русская библейская форма; в конструкции «стал отцом» употреблён родительный падеж «Иессея».
theological_decisions:
- issue: Формула родословной и упоминание матерей
  choice: Сохранить отцовскую формулу «стал отцом» и прямые указания «от Рахав» и «от Руфи».
  alternative: Передать только «был отцом», сгладив функцию ἐκ, либо использовать более буквальное, но неестественное «породил … из Рахав».
  rationale: Греческий текст подчёркнуто называет матерей посредством ἐκ с родительным падежом. Перевод сохраняет как отцовскую линию родословной, так и необычное явное включение женщин, не добавляя богословского истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской родословной. Имена даны в привычных русских библейских формах. Избегнуты архаические «родил» и «породил»; синтаксис сделан плавным без затемнения повторяющейся структуры оригинала.
