  text: Ἰωσὴφ δὲ ὁ ἀνὴρ αὐτῆς, δίκαιος ὢν καὶ μὴ θέλων αὐτὴν ⸀δειγματίσαι, ἐβουλήθη λάθρᾳ ἀπολῦσαι αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/019.yaml
  text: And Joseph[a], her husband, being a righteous man and not wanting to expose her to public disgrace[c][b], intended to divorce her quietly.
translation:
  language: ru
  text: Иосиф же, её муж[a], будучи праведным и не желая выставлять её на позор[b], решил тайно развестись с ней[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «её обручённый». Греческое слово может означать «муж» или «мужчина»; здесь оно отражает юридически обязательный характер иудейского обручения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «публично её опозорить»; «сделать её публичным примером».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «тайно отпустить её». В данном контексте речь идёт о формальном расторжении юридически обязательного обручения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ αὐτῆς
  choice: её муж
  rationale: 'В данном контексте ἀνήρ обозначает мужа: обручение уже имело обязательную юридическую силу, что подтверждается намерением Иосифа расторгнуть отношения. В сноске сохранён вариант, поясняющий стадию обручения.'
- source_word: δίκαιος
  choice: праведен
  rationale: Слово сохраняет нравственный и библейско-богословский смысл δίκαιος, не сводя характеристику Иосифа лишь к законности или милосердию.
- source_word: δειγματίσαι
  choice: выставлять её на позор
  rationale: Передаёт идею открытого выставления человека с сопутствующим бесчестием; формулировка естественна для современного русского языка и не уточняет сверх текста конкретную процедуру.
- source_word: ἐβουλήθη
  choice: решил
  rationale: Передаёт обдуманное намерение или решение Иосифа ясным современным глаголом.
- source_word: λάθρᾳ
  choice: тайно
  rationale: Наречие непосредственно передаёт скрытый, непубличный характер предполагаемого действия.
- source_word: ἀπολῦσαι αὐτήν
  choice: развестись с ней
  rationale: В юридически обязательном обручении прекращение отношений требовало формального расторжения; «развестись» ясно передаёт эту силу современному читателю, тогда как буквальное «отпустить её» могло бы её скрыть.
- source_word: δὲ
  choice: же
  rationale: Мягко продолжает повествование и обозначает переход к реакции Иосифа без сильного противопоставления.
- source_word: ὢν καὶ μὴ θέλων
  choice: был праведен и не хотел
  rationale: Естественная русская конструкция сохраняет две связанные характеристики, составляющие фон принятого Иосифом решения.
theological_decisions:
- issue: Характеристика Иосифа словом δίκαιος
  choice: «был праведен» без уточнения, означала ли праведность прежде всего соблюдение закона, сострадание или их сочетание
  alternative: «был справедлив» либо толковательный перевод с акцентом исключительно на милосердии
  rationale: Греческий текст связывает праведность Иосифа с нежеланием опозорить Марию, но не объясняет это понятие однозначно. Перевод сохраняет нравственно-богословскую напряжённость текста.
- issue: Юридический статус Иосифа и Марии
  choice: В основном тексте употреблены «муж» и «развестись»
  alternative: «обручённый» и «расторгнуть обручение» либо буквальные «её мужчина» и «отпустить её»
  rationale: Формулировки оригинала и контекст иудейского обручения указывают на юридически обязательный союз, для прекращения которого требовалось формальное расторжение. Сноски сохраняют буквальные и контекстуальные альтернативы.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Порядок фразы слегка перестроен ради естественного русского синтаксиса; причинная связь передана словом «поэтому» как естественный смысл причастной конструкции, без устранения связи между праведностью, нежеланием опозорить Марию и решением Иосифа.
