  text: Ἰούδας δὲ ἐγέννησεν τὸν Φαρὲς καὶ τὸν Ζάρα ἐκ τῆς Θαμάρ, Φαρὲς δὲ ἐγέννησεν τὸν Ἑσρώμ, Ἑσρὼμ δὲ ἐγέννησεν τὸν Ἀράμ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/003.yaml
  text: Judah fathered Perez and Zerah by Tamar[a], Perez fathered Hezron, and Hezron fathered Aram.
translation:
  language: ru
  text: Иуда был отцом Фареса и Зары от Фамари; Фарес был отцом Есрома, а Есром — Арама[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых переводах используется форма «Рам»; она отражает иную традицию передачи имени. В данном греческом тексте стоит «Арам».
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδας
  choice: Иуда
  rationale: В родословии это имя патриарха Иуды; традиционная русская форма сохраняет связь с ветхозаветным персонажем.
- source_word: δὲ
  choice: ; / а
  rationale: Здесь частица служит мягкой связкой между звеньями родословия, а не выражает сильное противопоставление. В русском её функцию естественно передают пунктуация и союз «а».
- source_word: ἐγέννησεν
  choice: стал отцом
  rationale: В родословии глагол обозначает отцовство или происхождение по мужской линии. Выражение «стал отцом» точно и понятно современному читателю, тогда как буквальное «родил» применительно к мужчине звучит архаично.
- source_word: Φαρὲς
  choice: Фарес
  rationale: Устоявшаяся русская библейская форма имени, соответствующего древнееврейскому Перецу.
- source_word: Ζάρα
  choice: Зара
  rationale: Устоявшаяся русская библейская форма имени, соответствующего древнееврейскому Зерах.
- source_word: ἐκ τῆς Θαμάρ
  choice: которых родила Фамарь
  rationale: Оборот с ἐκ указывает на происхождение от названной матери. Такая формулировка естественно выражает это по-русски и сохраняет особо отмеченное в родословии имя женщины.
- source_word: Θαμάρ
  choice: Фамарь
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: Ἑσρώμ
  choice: Есром
  rationale: Устоявшаяся русская форма имени в новозаветном родословии, сохраняющая узнаваемость библейской традиции.
- source_word: Ἀράμ
  choice: Арам
  rationale: Основной текст следует непосредственно греческой форме Ἀράμ и не заменяет её формой «Рам» ради согласования с иной традицией передачи имени.
theological_decisions:
- issue: Следует ли согласовать последнее имя с распространённой ветхозаветной формой родословия
  choice: Арам
  alternative: Рам
  rationale: Предоставленный греческий текст содержит Ἀράμ, поэтому основной перевод передаёт «Арам». Вариант «Рам» отмечен в сноске для прозрачности и сопоставления с другими библейскими традициями.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского родословия. Вместо архаичного «родил» о мужчине употреблено естественное «стал отцом»; традиционные русские формы имён сохранены ради межтекстовой узнаваемости.
