source:
  edition: SBLGNT
  text: Ἀζὼρ δὲ ἐγέννησεν τὸν Σαδώκ, Σαδὼκ δὲ ἐγέννησεν τὸν Ἀχίμ, Ἀχὶμ δὲ ἐγέννησεν τὸν Ἐλιούδ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/014.yaml
  text: Azor fathered Zadok, Zadok fathered Achim, and Achim fathered Eliud.
translation:
  language: ru
  text: Азор родил Садока, Садок родил Ахима, а Ахим родил Елиуда.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀζώρ
  choice: Азор
  rationale: Личное имя передано традиционной русской библейской формой, соответствующей греческому написанию.
- source_word: δέ
  choice: а
  rationale: В родословии частица служит связкой между последовательными звеньями. Первые два употребления естественно передаются пунктуацией, а последнее — союзом «а», который сохраняет последовательную связь без выраженного противопоставления.
- source_word: ἐγέννησεν
  choice: родил
  rationale: В мужской родословной глагол обозначает порождение и генеалогическое происхождение. «Родил» — краткая, понятная и укоренённая в русском библейском стиле формулировка; она не требует уточнять, идёт ли речь непременно о непосредственном отцовстве.
- source_word: τὸν
  choice: отдельно не переводится
  rationale: Греческий артикль оформляет прямое дополнение перед именем собственным; в данной русской конструкции отдельного соответствия ему не требуется.
- source_word: Σαδώκ
  choice: Садок
  rationale: Использована традиционная русская библейская форма имени.
- source_word: Ἀχίμ
  choice: Ахим
  rationale: Имя транслитерировано в соответствии с традиционной русской библейской передачей.
- source_word: Ἐλιούδ
  choice: Елиуд
  rationale: Использована традиционная русская библейская форма имени.
theological_decisions:
- issue: Непосредственное или более широкое родословное отношение в ἐγέννησεν
  choice: Сохранить обычную генеалогическую формулу «родил» без добавления «стал предком» или «был отцом».
  alternative: «стал отцом» / «был предком»
  rationale: Греческая формула допускает употребление в родословной цепи и сама по себе не требует разрешать вопрос о наличии пропущенных поколений. Традиционная формула сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский с достоинством и ритмом родословной. Повтор формулы сохранён как значимая особенность исходного текста; архаичное «породил» не использовано.
