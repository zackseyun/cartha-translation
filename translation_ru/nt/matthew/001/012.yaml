id: MAT.1.12
reference: Matthew 1:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὴν μετοικεσίαν Βαβυλῶνος Ἰεχονίας ἐγέννησεν τὸν Σαλαθιήλ, Σαλαθιὴλ δὲ ἐγέννησεν τὸν Ζοροβαβέλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/012.yaml
  text: After the deportation to Babylon[a], Jeconiah fathered Shealtiel, and Shealtiel fathered Zerubbabel.
translation:
  language: ru
  text: После переселения в Вавилон[a] Иехония стал отцом Салафииля, а Салафииль стал отцом Зоровавеля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «после выселения в Вавилон». Греческое слово обозначает принудительное переселение народа в вавилонское изгнание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ
  choice: После
  rationale: μετά с винительным падежом обозначает временную последовательность; слабое связующее δέ естественно не выражать отдельно по-русски.
- source_word: τὴν μετοικεσίαν Βαβυλῶνος
  choice: переселения в Вавилон
  rationale: μετοικεσία означает переселение или выселение в изгнание. «Переселение» сохраняет традиционную для родословия формулировку, а сноска поясняет принудительный характер события.
- source_word: Ἰεχονίας
  choice: Иехония
  rationale: Употреблена узнаваемая русская библейская форма имени.
- source_word: ἐγέννησεν
  choice: стал отцом
  rationale: В родословии γεννάω обозначает отцовство или происхождение по мужской линии; эта современная формулировка не требует непосредственной биологической последовательности поколений.
- source_word: Σαλαθιήλ
  choice: Салафииль
  rationale: Употреблена традиционная и узнаваемая русская библейская форма имени.
- source_word: δὲ
  choice: а
  rationale: Связка отмечает переход к следующему звену родословия; русское «а» естественно соединяет параллельные формулы без значения противопоставления.
- source_word: Ζοροβαβέλ
  choice: Зоровавель
  rationale: Употреблена традиционная русская библейская форма имени.
theological_decisions:
- issue: Передача γεννάω в родословии
  choice: стал отцом
  alternative: родил; породил
  rationale: Формула сохраняет мужскую линию происхождения, но не навязывает более строгого утверждения о непосредственном биологическом отцовстве, чем допускает жанр родословия.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования; традиционные русские формы имён сохранены ради узнаваемости. Повтор формулы «стал отцом» передаёт строй родословия без архаичного «родил».
