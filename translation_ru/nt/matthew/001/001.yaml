translation:
  language: ru
  text: Книга родословия Иисуса Мессии[a], сына Давида, сына Авраама.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Книга происхождения Иисуса Мессии» или «Книга рождения Иисуса Мессии». Греческое слово γένεσις может иметь более широкий смысл происхождения или рождения, хотя «родословие» лучше соответствует следующему далее перечню предков. Традиционная передача титула «Мессия» — «Христос».'
    reason: alternative_reading
lexical_decisions:
- source_word: Βίβλος γενέσεως
  choice: Родословие
  rationale: В данном заголовке сочетание вводит следующий далее перечень предков. Естественное русское «Родословие» точно передаёт непосредственную функцию выражения, а более широкие значения γένεσις отмечены в сноске.
- source_word: Ἰησοῦ
  choice: Иисуса
  rationale: Стандартная русская форма имени в родительном падеже, обусловленном конструкцией исходного текста.
- source_word: χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь имеет силу титула — Помазанник, то есть Мессия, — а не фамилии. «Мессия» сохраняет иудейский царский контекст титула.
- source_word: υἱοῦ Δαυὶδ
  choice: сына Давида
  rationale: Буквальная и укоренённая библейская формула сохраняет мессианское значение; по контексту «сын» может означать потомка.
- source_word: υἱοῦ Ἀβραάμ
  choice: сына Авраама
  rationale: Буквальная генеалогическая формула сохраняет связь с Авраамом; здесь «сын» употреблено в широком смысле потомка.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В заголовке слово обозначает титул Иисуса. «Мессия» ясно передаёт смысл «Помазанник», не превращая титул в часть имени; традиционный вариант отмечен в сноске.
- issue: Значение Βίβλος γενέσεως
  choice: Родословие
  alternative: Книга происхождения; повествование о рождении
  rationale: Непосредственно за заголовком следует родословная, поэтому это наиболее ясное основное чтение. Однако диапазон значения γένεσις и возможный отзвук темы происхождения сохранены в сноске.
- issue: Значение «сын Давида, сын Авраама»
  choice: Сохранить «сын»
  alternative: потомок Давида, потомок Авраама
  rationale: Форма «сын» одновременно допускает генеалогический смысл «потомок» и сохраняет царско-мессианскую и заветную значимость выражений.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием заголовка. Опущено буквальное «Книга» перед «родословием», поскольку по-русски «Книга родословия» звучит архаично и менее естественно; смысл письменной записи здесь выражен самим заголовком. Повтор «сына» сохранён ради ритма и смысловой структуры оригинала.
