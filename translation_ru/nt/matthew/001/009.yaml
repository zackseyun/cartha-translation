  text: Ὀζίας δὲ ἐγέννησεν τὸν Ἰωαθάμ, Ἰωαθὰμ δὲ ἐγέννησεν τὸν Ἀχάζ, Ἀχὰζ δὲ ἐγέννησεν τὸν Ἑζεκίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/009.yaml
  text: Uzziah fathered Jotham[a], and Jotham fathered Ahaz, and Ahaz fathered Hezekiah,
translation:
  language: ru
  text: Озия стал отцом Иоафама, Иоафам стал отцом Ахаза, Ахаз стал отцом Езекии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὀζίας
  choice: Озия
  rationale: Использована традиционная русская библейская форма имени иудейского царя, соответствующая греческому Ὀζίας.
- source_word: δὲ
  choice: же / а / тире
  rationale: В родословной δέ служит слабой связкой, продвигающей перечисление. В первом звене передано словом «же», во втором естественно опущено с постановкой тире, в третьем передано союзом «а», чтобы сохранить связность без тяжеловесного однообразия.
- source_word: ἐγέννησεν
  choice: стал отцом / отцом
  rationale: Выражение «стал отцом» ясно и естественно передаёт генеалогическое значение γεννάω применительно к мужчине; в последующих звеньях глагол эллиптически опущен по нормам современного русского языка, при сохранении повторной структуры.
- source_word: Ἰωαθάμ
  choice: Иоафам
  rationale: Традиционная русская библейская форма имени царя Иудеи.
- source_word: Ἀχάζ
  choice: Ахаз
  rationale: Традиционная русская библейская форма имени, соответствующая греческому Ἀχάζ.
- source_word: Ἑζεκίαν
  choice: Езекия
  rationale: Традиционная русская библейская форма имени иудейского царя, соответствующая греческому Ἑζεκίας.
theological_decisions:
- issue: Генеалогическое значение γεννάω
  choice: 'Передано как прямое отцовство: «стал отцом»'
  alternative: «родил»; «был предком»
  rationale: Греческая формула прямо описывает мужскую линию родословия. «Стал отцом» сохраняет это значение и не расширяет его до более общего понятия предка, хотя древние родословия могут пропускать поколения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Традиционные формы имён обеспечивают узнаваемость; эллипсис во втором и третьем звеньях устраняет неестественную тяжеловесность, сохраняя смысл и ритм перечисления.
