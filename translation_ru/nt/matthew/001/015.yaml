id: MAT.1.15
reference: Matthew 1:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐλιοὺδ δὲ ἐγέννησεν τὸν Ἐλεάζαρ, Ἐλεάζαρ δὲ ἐγέννησεν τὸν Ματθάν, Ματθὰν δὲ ἐγέννησεν τὸν Ἰακώβ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/015.yaml
  text: Eliud fathered Eleazar, and Eleazar fathered Matthan, and Matthan fathered Jacob.
translation:
  language: ru
  text: Елиуд родил Елеазара, Елеазар родил Матфана, а Матфан родил Иакова.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλιοὺδ
  choice: Елиуд
  rationale: Имя передано в традиционной русской библейской форме, близкой к греческому написанию.
- source_word: δὲ
  choice: бессоюзная связь / «а»
  rationale: В родословной δέ служит слабым связующим элементом. Первые два вхождения естественно переданы соположением фраз, а последнее — союзом «а», который продолжает перечисление без выраженного противопоставления.
- source_word: ἐγέννησεν
  choice: родил
  rationale: В мужской родословной глагол обозначает отцовство или происхождение по линии предков. «Родил» сохраняет краткую повторяющуюся формулу греческого текста и традиционно понятно в данном контексте.
- source_word: τὸν
  choice: отдельно не переводится
  rationale: Артикль оформляет прямое дополнение перед именем собственным; в русском языке в этой конструкции он не имеет отдельного соответствия.
- source_word: Ἐλεάζαρ
  choice: Елеазар
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: Ματθάν
  choice: Матфан
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: Ἰακώβ
  choice: Иаков
  rationale: Использована устоявшаяся русская библейская форма имени, позволяющая отличать ветхозаветно-евангельское имя от современной формы «Яков».
theological_decisions:
- issue: Объём значения ἐγέννησεν в родословной
  choice: Сохранена формула «родил» без уточнения непосредственности родства
  alternative: «был отцом» или «стал предком»
  rationale: Генеалогическое употребление может описывать родословную связь, не всегда подчёркивая непосредственное поколение. Краткая формула не снимает эту возможную широту и не добавляет отсутствующих в тексте пояснений.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и ритмического повтора родословной. Имена даны в привычных русских библейских формах; архаическое «родил» здесь сохранено как ясная и компактная генеалогическая формула.
