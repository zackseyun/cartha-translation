  source_fidelity: Текст точно передаёт три последовательные генеалогические связи греческого оригинала. «Родил» в этой формуле адекватно передаёт ἐγέννησεν, не уточняя степень непосредственности родства сверх того, что выражено генеалогическим глаголом.
  naturalness: Фраза ясна и ритмична. Хотя «родил» в применении к мужчине имеет традиционно-библейскую окраску, в контексте родословной это устойчивое, понятное и литературно уместное выражение. Бессоюзное соединение первых звеньев и «а» перед последним естественно передают слабое последовательное δέ без неуместного противопоставления.
