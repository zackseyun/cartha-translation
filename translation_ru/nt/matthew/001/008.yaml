base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/008.yaml
  text: Asaph fathered Jehoshaphat[a], Jehoshaphat fathered Joram, and Joram fathered Uzziah.
translation:
  language: ru
  text: Асаф стал отцом Иосафата[a], Иосафат стал отцом Иорама, а Иорам стал отцом Озии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых рукописях — «Аса» вместо «Асаф»; имя «Аса» также соответствует имени иудейского царя в ветхозаветной родословной.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀσὰφ
  choice: Асаф
  rationale: В основном тексте сохранена форма имени, засвидетельствованная в SBLGNT; ожидаемая по ветхозаветной родословной форма «Аса» приведена в сноске.
- source_word: δὲ
  choice: стал / а
  rationale: Частица служит мягкой связкой между звеньями родословной; по-русски её не требуется механически воспроизводить в каждом предложении, а перед последним звеном естественно «а» без противопоставительного оттенка.
- source_word: ἐγέννησεν
  choice: стал отцом
  rationale: Современная, ясная и достойная формула родословия, передающая отцовскую линию без архаичного «родил» или тяжеловесного «породил».
- source_word: Ἰωσαφάτ
  choice: Иосафат
  rationale: Устоявшаяся русская библейская форма имени иудейского царя.
- source_word: Ἰωράμ
  choice: Иорам
  rationale: Устоявшаяся русская форма, соответствующая греческому Ἰωράμ.
- source_word: Ὀζίαν
  choice: Озия
  rationale: Устоявшаяся русская библейская форма имени иудейского царя; в винительном падеже — «Озии» после конструкции «стал отцом».
theological_decisions:
- issue: Следует ли согласовать Ἀσὰφ с ожидаемым историческим именем Аса
  choice: Сохранить «Асаф» в основном тексте, а «Аса» указать в сноске.
  alternative: Поставить «Аса» в основном тексте по ветхозаветной родословной и части рукописей.
  rationale: Приоритет отдан предоставленному греческому тексту, при этом текстовый и генеалогический вопрос не скрыт от читателя.
- issue: Передача повторяющейся конструкции δὲ ἐγέννησεν
  choice: Повторить «стал отцом» для каждого звена, связав последнее союзом «а».
  alternative: Использовать «родил» или оформить три бессоюзные части.
  rationale: Так сохраняются все звенья последовательности и достигается естественное звучание современной русской родословной без внесения доктринального толкования.
translation_notes:
  register: Современный литературный русский язык; ясный, сдержанный и достойный стиль. Устоявшиеся русские библейские формы имён использованы там, где они однозначны; необычная форма «Асаф» сохранена ради точности исходному греческому тексту.
