  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἀβραὰμ ἐγέννησεν τὸν Ἰσαάκ, Ἰσαὰκ δὲ ἐγέννησεν τὸν Ἰακώβ, Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/002.yaml
  text: Abraham fathered Isaac[a], and Isaac fathered Jacob, and Jacob fathered Judah and his brothers,
translation:
  language: ru
  text: Авраам стал отцом Исаака[a], Исаак стал отцом Иакова, а Иаков стал отцом Иуды и его братьев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родил». В родословии греческий глагол означает, что названный мужчина стал отцом или предком по отцовской линии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: стал отцом
  rationale: В родословии глагол обозначает мужское родительство и происхождение. «Стал отцом» ясно и естественно для современного русского языка, сохраняет отцовскую линию и не утверждает сверх текста, что во всех случаях речь непременно идёт о непосредственном поколении.
- source_word: δὲ
  choice: а
  rationale: Здесь δέ служит мягкой связкой между звеньями родословия, а не выражает сильное противопоставление. Русское «а» естественно передаёт последовательный переход от одного поколения к другому.
- source_word: Ἰούδαν
  choice: Иуды
  rationale: Речь идёт о ветхозаветном патриархе Иуде, сыне Иакова; употреблена устоявшаяся русская форма имени.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: его братьев
  rationale: Форма мужского рода обозначает братьев Иуды — других сыновей Иакова; перевод сохраняет и род, и отнесённость местоимения к Иуде.
- source_word: Ἀβραὰμ / Ἰσαὰκ / Ἰακώβ
  choice: Авраам / Исаак / Иаков
  rationale: Использованы общепринятые русские библейские формы личных имён.
theological_decisions:
- issue: Передача родословного глагола γεννάω
  choice: Последовательно переводить «стал отцом»
  alternative: Традиционное «родил» или более книжное «породил»
  rationale: Выбор сохраняет мужскую родословную направленность греческого текста, оставаясь понятным современному читателю. Он также не снимает возможную для библейских родословий неоднозначность между непосредственным отцовством и происхождением по линии предков.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского родословия. Повтор «стал отцом» сохранён ради ритма и структуры оригинала; архаичное для современного русского мужское «родил» вынесено в примечание.
