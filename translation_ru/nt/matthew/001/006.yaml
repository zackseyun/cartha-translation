id: MAT.1.6
reference: Matthew 1:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἰεσσαὶ δὲ ἐγέννησεν τὸν Δαυὶδ τὸν βασιλέα. Δαυὶδ ⸀δὲ ἐγέννησεν τὸν Σολομῶνα ἐκ τῆς τοῦ Οὐρίου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/006.yaml
  text: Jesse fathered David the king[a]. David fathered Solomon by the wife of Uriah,
translation:
  language: ru
  text: Иессей стал отцом царя Давида. Давид стал отцом Соломона от жены Урии[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «от [женщины] Урии»; это эллиптическое выражение означает «от жены Урии». Матфей здесь не называет Вирсавию по имени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: стал отцом
  rationale: В родословии γεννάω обозначает отцовство и происхождение по мужской линии. Выражение «стал отцом» естественно для современного русского языка и точнее передаёт смысл, чем архаичное «родил» применительно к мужчине.
- source_word: τὸν Δαυὶδ τὸν βασιλέα
  choice: царя Давида
  rationale: Приложение с артиклем особо указывает на царское достоинство Давида. Русский порядок слов «царя Давида» естественно сохраняет это определение.
- source_word: ἐκ τῆς τοῦ Οὐρίου
  choice: от жены Урии
  rationale: Греческое эллиптическое выражение буквально указывает на «[женщину] Урии»; слово «жена» подразумевается. Перевод сохраняет косвенное именование женщины через Урию и не подставляет отсутствующее в тексте имя Вирсавии.
- source_word: Ἰεσσαὶ
  choice: Иессей
  rationale: Традиционная и узнаваемая русская форма библейского имени.
- source_word: Δαυὶδ
  choice: Давид
  rationale: Традиционная русская форма имени.
- source_word: Σολομῶνα
  choice: Соломон
  rationale: Традиционная русская форма имени.
- source_word: Οὐρίου
  choice: Урия
  rationale: Традиционная русская форма имени; в родительном падеже — «Урии».
- source_word: δέ
  choice: не выражено отдельно
  rationale: Здесь δέ служит слабой связкой внутри последовательности родословия. В современном русском повтор союза не нужен, поскольку связь предложений ясна.
theological_decisions:
- issue: Косвенное упоминание Вирсавии у Матфея
  choice: Сохранить выражение «от жены Урии», не называя Вирсавию по имени.
  alternative: «от Вирсавии» или «от той, которая была женой Урии»
  rationale: Матфей намеренно определяет женщину через её отношение к Урии. Это сохраняет литературную и нравственную связь с повествованием 2 Царств и не устраняет напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для библейской родословной. Формула «стал отцом» ясна обычному читателю и избегает как архаизма «родил», так и менее точного обобщения «был предком».
