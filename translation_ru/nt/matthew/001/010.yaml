id: MAT.1.10
reference: Matthew 1:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἑζεκίας δὲ ἐγέννησεν τὸν Μανασσῆ, Μανασσῆς δὲ ἐγέννησεν τὸν ⸂Ἀμώς, Ἀμὼς⸃ δὲ ἐγέννησεν τὸν Ἰωσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/010.yaml
  text: Hezekiah fathered Manasseh[a], Manasseh fathered Amos, and Amos fathered Josiah.
translation:
  language: ru
  text: Езекия стал отцом Манассии, Манассия стал отцом Амоса[a], а Амос стал отцом Иосии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых переводах здесь стоит «Амон» — имя иудейского царя в 4 Царств 21; в греческом тексте Матфея стоит «Амос».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγέννησεν
  choice: стал отцом
  rationale: В родословии глагол обозначает мужское родительство и происхождение. «Стал отцом» — естественная и понятная современная формулировка без архаизма «родил» применительно к мужчине; она также допускает характерную для библейских родословий широту генеалогической связи.
- source_word: Ἑζεκίας
  choice: Езекия
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: Μανασσῆς
  choice: Манассия
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: Ἀμώς
  choice: Амос
  rationale: Основной текст SBLGNT читает Ἀμώς, поэтому имя передано как «Амос», без молчаливого согласования с именем царя Амона в книгах Царств и Паралипоменон.
- source_word: Ἰωσίας
  choice: Иосия
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: δέ
  choice: а; также передано пунктуацией
  rationale: В последовательности родословия δέ служит связкой, продвигающей перечень. Повторять союз при каждом имени по-русски необязательно; перед последним звеном «а» естественно связывает части предложения.
theological_decisions:
- issue: Различие между именем в греческом тексте Матфея и именем иудейского царя в Ветхом Завете
  choice: В основном тексте оставить «Амос» согласно Ἀμώς
  alternative: «Амон» — согласование с именем царя в 4 Царств 21 и 2 Паралипоменон 33
  rationale: Перевод следует представленному греческому тексту Матфея и не устраняет текстовое напряжение посредством молчаливой гармонизации. Знакомая читателю форма «Амон» отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; достоинство родословного перечня сохранено. Формула «стал отцом» выбрана как ясная и естественная для обычного читателя. Маркер сноски поставлен непосредственно после спорного имени.
