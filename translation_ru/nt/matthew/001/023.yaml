  text: Ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ· ὅ ἐστιν μεθερμηνευόμενον Μεθ’ ἡμῶν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/023.yaml
  text: Behold[a], the virgin will conceive and bear a son, and they will call his name Immanuel—which is translated[d][c][b], 'God with us.'
translation:
  language: ru
  text: '«Вот, дева[a] зачнёт и родит сына, и назовут Его Эммануилом[b]», что в переводе означает: «С нами Бог».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «молодая женщина».'
    reason: lexical_alternative
  - marker: b
    text: Имя также передают как «Иммануил» или «Еммануил».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Естественный русский указательно-восклицательный маркер, сохраняющий призыв обратить внимание и возвышенный тон пророческой цитаты.
- source_word: ἡ παρθένος
  choice: дева
  rationale: В контексте Матфея слово обозначает девственницу; «дева» ясно передаёт этот смысл и уместно звучит в пророческой цитате.
- source_word: ἐν γαστρὶ ἕξει
  choice: зачнёт
  rationale: Естественная передача греческого оборота «будет иметь во чреве», сохраняющая значение будущего времени.
- source_word: τέξεται υἱόν
  choice: родит Сына
  rationale: Прямая и естественная передача рождения сына; прописная буква указывает на Иисуса в данном контексте, не добавляя к тексту пояснений.
- source_word: καλέσουσιν τὸ ὄνομα αὐτοῦ
  choice: назовут Его
  rationale: Русская неопределённо-личная конструкция точно сохраняет неуказанный субъект греческого глагола во множественном числе и естественно передаёт формулу наречения имени.
- source_word: Ἐμμανουήλ
  choice: Эммануилом
  rationale: Транслитерация следует греческой форме имени и согласуется с данным далее толкованием его значения.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: что в переводе означает
  rationale: Ясная современная передача пояснительной конструкции без изменения её смысла.
- source_word: Μεθ’ ἡμῶν ὁ θεός
  choice: С нами Бог
  rationale: Точно и кратко передаёт значение имени, сохраняя порядок слов и богословскую весомость выражения без расширительного толкования.
theological_decisions:
- issue: Значение παρθένος в повествовании о зачатии Иисуса
  choice: дева
  alternative: молодая женщина
  rationale: В греческом тексте Матфея и в непосредственном повествовательном контексте παρθένος означает девственницу. Вариант «молодая женщина», обсуждаемый применительно к еврейскому тексту Ис 7:14, не является предпочтительным переводом греческого текста этого стиха.
- issue: Толкование имени Эммануил
  choice: С нами Бог
  alternative: добавить пояснение о воплощении
  rationale: Сам евангелист приводит значение имени. Перевод сохраняет его формулировку и богословское напряжение, не внося отсутствующего в стихе догматического пояснения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном, соответствующим пророческой цитате. Неопределённо-личное «назовут» сохраняет грамматическую неопределённость действующего лица.
