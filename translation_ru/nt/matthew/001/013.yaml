  text: Ζοροβαβὲλ δὲ ἐγέννησεν τὸν Ἀβιούδ, Ἀβιοὺδ δὲ ἐγέννησεν τὸν Ἐλιακίμ, Ἐλιακὶμ δὲ ἐγέννησεν τὸν Ἀζώρ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/013.yaml
  text: Zerubbabel fathered Abiud[a], Abiud fathered Eliakim, and Eliakim fathered Azor.
translation:
  language: ru
  text: Зоровавель стал отцом Авиуда[a], Авиуд стал отцом Елиакима, а Елиаким стал отцом Азора.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был отцом»; в библейских родословиях эта повторяющаяся формула может передавать родовую линию в сокращённом виде.'
    reason: Лексическая альтернатива и пояснение возможной генеалогической компрессии.
lexical_decisions:
- source_word: Ζοροβαβέλ
  choice: Зоровавель
  rationale: Устоявшаяся русская библейская форма имени исторического лица; она передаёт греческую форму с учётом традиционного русского употребления.
- source_word: δέ
  choice: — / а
  rationale: Здесь частица служит мягкой связкой, последовательно продвигающей родословие, а не выражает противопоставление. В русском её не требуется повторять в каждом звене; «а» перед последним звеном естественно передаёт продолжение ряда.
- source_word: ἐγέννησεν
  choice: был отцом
  rationale: В мужской родословной глагол обозначает отцовство и происхождение. Такая формулировка ясна и достойна по стилю, не архаична и, в отличие от «родил», естественна в современном русском применительно к мужчине.
- source_word: Ἀβιούδ
  choice: Авиуд
  rationale: Устоявшаяся русская библейская передача личного имени.
- source_word: Ἐλιακίμ
  choice: Елиаким
  rationale: Устоявшаяся русская библейская передача имени, соответствующая греческой форме.
- source_word: Ἀζώρ
  choice: Азор
  rationale: Прямая и принятая в русской библейской традиции передача греческого личного имени.
theological_decisions:
- issue: Передача γεννάω в родословии, где возможен пропуск поколений
  choice: был отцом
  alternative: стал отцом; был предком
  rationale: Повторяющаяся формула сохраняет прямой язык греческой родословной, но не добавляет специального утверждения о том, что каждое звено непременно представляет непосредственную смену поколений. «Был предком» слишком явно разрешило бы сохраняемую оригиналом неопределённость.
translation_notes:
  register: Современный литературный русский язык; ясная, ритмичная и достойная формула родословия без архаизма «родил» применительно к мужчине. Имена даны в устоявшихся русских библейских формах.
