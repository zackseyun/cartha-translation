lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Всё это
  rationale: Сочетание указывает на всю совокупность только что описанных событий; по-русски «всё это» естественно передаёт собирательное значение и акцент ὅλον. Частица δέ здесь служит переходом и не требует отдельного слова.
- source_word: γέγονεν
  choice: произошло
  rationale: Перфект γίνομαι обозначает совершившееся событие; «произошло» естественно для современного русского повествования.
- source_word: ἵνα πληρωθῇ
  choice: чтобы исполнилось
  rationale: Сохраняет конструкцию цели/результата и пассивный смысл формулы исполнения, не сводя её однозначно только к цели или только к следствию.
- source_word: τὸ ῥηθὲν
  choice: сказанное
  rationale: Субстантивированное страдательное причастие кратко и естественно передаётся русским «сказанное».
- source_word: ὑπὸ κυρίου
  choice: Господом
  rationale: Творительный падеж передаёт Господа как исходного деятеля речи без добавления отсутствующего в греческом слова «Бог».
- source_word: διὰ τοῦ προφήτου
  choice: через пророка
  rationale: Передаёт посредническое значение διά с родительным и сохраняет различие между Господом как источником речи и пророком как посредником.
- source_word: λέγοντος
  choice: который говорит
  rationale: Причастие грамматически согласуется с «пророком» и вводит последующую цитату; личная конструкция звучит по-русски яснее, чем буквальное «говорящего».
theological_decisions:
- issue: Участники пророческой речи
  choice: «сказанное Господом через пророка»
  alternative: «сказанное пророком от Господа»
  rationale: Греческий текст различает Господа как исходного говорящего (ὑπό) и пророка как посредника (διά); перевод сохраняет это различие, не развивая его в более широкую доктрину вдохновения.
- issue: Формула исполнения
  choice: «чтобы исполнилось»
  alternative: «и так исполнилось»
  rationale: ἵνα с сослагательным наклонением допускает оттенки цели и результата. «Чтобы» сохраняет присущую формуле целевую направленность и не устраняет богословское напряжение.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Формула «Господом через пророка» сохраняет структуру греческого текста; двоеточие естественно вводит цитату следующего стиха.
