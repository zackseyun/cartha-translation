source:
  edition: SBLGNT
  text: Τοῦ δὲ ⸀Ἰησοῦ χριστοῦ ἡ ⸀γένεσις οὕτως ἦν. ⸀μνηστευθείσης τῆς μητρὸς αὐτοῦ Μαρίας τῷ Ἰωσήφ, πρὶν ἢ συνελθεῖν αὐτοὺς εὑρέθη ἐν γαστρὶ ἔχουσα ἐκ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/018.yaml
  text: 'The birth of Jesus the Messiah happened in this way: when his mother Mary had been betrothed to Joseph[a], before they came together[c][b], she was found to be pregnant from the Holy Spirit.'
translation:
  language: ru
  text: 'Рождение Иисуса Мессии[a] произошло так: Его мать Мария была обручена с Иосифом[b], и прежде чем они сошлись[c], оказалось, что она беременна от Святого Духа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисуса Христа». Греческое Χριστός означает «Мессия», то есть Помазанник.'
    reason: lexical_alternative
  - marker: b
    text: Обручение было официальным, юридически признанным обязательством вступить в брак, более прочным, чем современная помолвка.
    reason: cultural_note
  - marker: c
    text: Выражение «сошлись» может подразумевать начало совместной супружеской жизни, включая супружескую близость.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένεσις
  choice: рождение
  rationale: В данном повествовательном контексте слово обозначает рождение Иисуса, хотя также может иметь более широкое значение «происхождение».
- source_word: Ἰησοῦ χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός здесь передано как значимый титул «Мессия», а не как фамилия или непрозрачное имя.
- source_word: οὕτως ἦν
  choice: произошло так
  rationale: Естественно вводит описание того, каким образом произошло событие.
- source_word: μνηστευθείσης
  choice: была обручена
  rationale: «Обручена» передаёт официальное и юридически значимое брачное обязательство, более прочное, чем современная помолвка.
- source_word: πρὶν ἢ συνελθεῖν αὐτούς
  choice: прежде чем они сошлись
  rationale: Сохранён сдержанный греческий оборот, который в контексте может подразумевать начало совместной супружеской жизни и её телесную сторону.
- source_word: εὑρέθη
  choice: оказалось
  rationale: Естественная русская передача обнаружившегося положения дел без уточнения того, кто именно это обнаружил.
- source_word: ἐν γαστρὶ ἔχουσα
  choice: беременна
  rationale: Современная и ясная передача идиомы, буквально означающей «имеющая во чреве».
- source_word: ἐκ πνεύματος ἁγίου
  choice: от Святого Духа
  rationale: Предлог ἐκ указывает на источник; контекст отсылает к Святому Духу как к определённому божественному Лицу.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В повествовательном введении слово сохраняет функцию титула. В примечании указана традиционная альтернативная передача.
- issue: Референт πνεύματος ἁγίου
  choice: Святой Дух
  alternative: святой дух
  rationale: В контексте рассказа Матфея выражение обозначает Святого Духа; отсутствие артикля в греческом само по себе не делает его неопределённым.
- issue: Смысл συνελθεῖν
  choice: сошлись
  alternative: стали жить вместе; вступили в супружескую близость
  rationale: Основной текст сохраняет эвфемистичность и некоторую широту оригинала, а примечание поясняет возможный супружеский смысл.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное, без архаизмов. Сдержанная формулировка «сошлись» сохраняет эвфемистичность и смысловую широту греческого выражения.
