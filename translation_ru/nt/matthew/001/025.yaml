  text: καὶ οὐκ ἐγίνωσκεν αὐτὴν ἕως οὗ ἔτεκεν ⸀υἱόν· καὶ ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/025.yaml
  text: And he did not know her until she gave birth to a son[c][b][a], and he called his name Jesus.
translation:
  language: ru
  text: И он не вступал с ней в супружескую близость[a], пока она не родила сына[b], и назвал его Иисусом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не знал её»; глагол «знать» употреблён как эвфемизм супружеской близости.'
    reason: lexical_alternative
  - marker: b
    text: Слово «пока» указывает, что было до рождения Иисуса, но само по себе не определяет, что произошло после.
    reason: alternative_reading
  - marker: c
    text: 'Буквальнее: «нарёк ему имя Иисус».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: не вступал с ней в супружескую близость
  rationale: В данном контексте γινώσκω — эвфемизм половых отношений. Ясная современная формулировка передаёт смысл без грубости; буквальный оборот сохранён в сноске.
- source_word: ἕως οὗ
  choice: пока … не
  rationale: 'Естественная русская передача временного предела: сказанное относится к периоду до рождения ребёнка, но сама конструкция не определяет, что происходило после.'
- source_word: ἔτεκεν
  choice: родила
  rationale: Обычная и точная современная передача глагола τίκτω.
- source_word: υἱόν
  choice: сына
  rationale: Существительное употреблено без артикля; перевод не добавляет отсутствующего в греческом тексте уточнения или особого акцента.
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν
  choice: назвал его Иисусом
  rationale: Идиоматическая русская передача семитизированного греческого оборота; более буквальная форма приведена в сноске.
- source_word: Ἰησοῦν
  choice: Иисусом
  rationale: «Иисус» — общепринятая русская форма имени в новозаветном контексте.
theological_decisions:
- issue: Подразумевает ли «пока» супружеские отношения после рождения Иисуса
  choice: Передать ἕως οὗ нейтрально конструкцией «пока … не», не утверждая ничего о последующем времени.
  alternative: Одни читатели заключают, что после рождения Иисуса супружеские отношения начались; другие считают, что эта фраза не указывает на последующую перемену.
  rationale: Греческое выражение устанавливает временной предел для сообщаемого здесь факта, но само по себе не решает вопрос о том, что было после рождения Иисуса.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанный. Эвфемистический смысл раскрыт без натурализма; богословски спорный вывод о последующем времени не внесён в основной текст. Местоимение «его» дано со строчной буквы согласно нейтральной современной орфографической практике.
