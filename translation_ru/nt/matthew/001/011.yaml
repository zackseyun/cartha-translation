  text: Ἰωσίας δὲ ἐγέννησεν τὸν Ἰεχονίαν καὶ τοὺς ἀδελφοὺς αὐτοῦ ἐπὶ τῆς μετοικεσίας Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/011.yaml
  text: Josiah fathered Jeconiah and his brothers at the time of the deportation to Babylon[a].
translation:
  language: ru
  text: Иосия стал отцом Иехонии и его братьев во время переселения в Вавилон[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во время изгнания в Вавилон». Греческое слово может обозначать принудительное переселение или изгнание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: стал отцом
  rationale: В родословной глагол обозначает отцовство или происхождение по мужской линии. «Стал отцом» естественно для современного русского языка и не вынуждает уточнять, было ли родство непосредственным во всех звеньях родословной.
- source_word: Ἰεχονίαν
  choice: Иехонии
  rationale: Употреблена закрепившаяся в русской библейской традиции форма имени «Иехония», здесь в родительном падеже после сочетания «стал отцом».
- source_word: ἀδελφοὺς αὐτοῦ
  choice: его братьев
  rationale: Греческое существительное стоит во множественном числе мужского рода; «братьев» точно и естественно передаёт его в данном контексте.
- source_word: ἐπὶ τῆς μετοικεσίας Βαβυλῶνος
  choice: во время переселения в Вавилон
  rationale: Предлог ἐπί с родительным падежом имеет здесь временное значение, а μετοικεσία обозначает насильственное перемещение или изгнание. «Переселение в Вавилон» сохраняет традиционно узнаваемую и достаточно широкую формулировку; принудительный характер пояснён в сноске.
- source_word: δὲ
  choice: отдельно не передано
  rationale: Частица служит слабой связкой внутри родословного перечня; отдельный русский эквивалент сделал бы фразу менее естественной, не добавив существенного смысла.
theological_decisions:
- issue: Возможное сокращение поколений в родословной Матфея
  choice: Передать формулу как «стал отцом», не разрешая в тексте историко-генеалогический вопрос
  alternative: Понимать γεννάω шире — как указание на предка, а не обязательно непосредственного отца
  rationale: Греческая формула допускает генеалогическое изложение с пропуском поколений. Перевод следует формулировке источника и сохраняет эту напряжённость, не добавляя гармонизирующего толкования.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и dignified, без архаического «родил». Имя дано в узнаваемой русской библейской форме. Маркер сноски расположен непосредственно после относящейся к ней фразы.
