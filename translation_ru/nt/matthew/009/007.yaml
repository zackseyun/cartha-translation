lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Обычный сочинительный союз сохраняет простой ход повествования и не добавляет отсутствующего в греческом тексте временного оттенка.
- source_word: ἐγερθεὶς
  choice: он встал
  rationale: Аористное причастие от ἐγείρω здесь имеет непереходное значение. Личная форма естественна для современного русского повествования и ясно передаёт завершённое действие.
- source_word: ἀπῆλθεν
  choice: пошёл
  rationale: Форма ἀπέρχομαι обозначает уход с данного места; в сочетании с направлением движения русское «пошёл» естественно передаёт это действие без книжного оттенка слова «удалился».
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: к себе домой
  rationale: Оборот передаёт движение к собственному жилищу исцелённого. «К себе домой» — естественное современное выражение, сохраняющее значение принадлежности, выраженное αὐτοῦ.
