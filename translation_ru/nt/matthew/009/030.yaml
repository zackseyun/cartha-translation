  yaml_path: translation/nt/matthew/009/030.yaml
  text: And their eyes were opened[a]. And Jesus sternly warned them, saying[b], “See that no one knows.”
translation:
  language: ru
  text: 'И глаза их открылись. Иисус строго предупредил их[a]: «Смотрите, чтобы никто не узнал[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «строго повелел им»; «сурово предостерёг их». Греческий глагол выражает сильное чувство и настойчивость предупреждения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Смотрите, пусть никто не знает». Что именно не должно стать известным, понятно из рассказа об исцелении, но прямо в греческом тексте не названо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνεῴχθησαν αὐτῶν οἱ ὀφθαλμοί
  choice: открылись их глаза
  rationale: Греческая пассивная форма выражает восстановление зрения традиционной библейской идиомой; русское возвратное «открылись» естественно передаёт это без добавления действующего лица.
- source_word: ἐνεβριμήθη αὐτοῖς
  choice: строго предупредил их
  rationale: Глагол передаёт сильное чувство и настойчивость распоряжения. В данном контексте запрета «строго предупредил» сохраняет силу выражения, не приписывая Иисусу более конкретной эмоции.
- source_word: λέγων
  choice: двоеточие перед прямой речью
  rationale: Причастие вводит содержание предупреждения; в современном русском его естественно передать синтаксически, без избыточного «говоря».
- source_word: Ὁρᾶτε
  choice: Смотрите, чтобы
  rationale: Императив вводит настоятельное предостережение; русская конструкция «смотрите, чтобы» естественно сохраняет побудительную силу.
- source_word: μηδεὶς γινωσκέτω
  choice: никто не узнал
  rationale: Отрицательный императив третьего лица передан через конструкцию «чтобы никто не узнал». Объект знания, не выраженный в греческом тексте, не добавлен.
theological_decisions:
- issue: Сила повеления Иисуса после исцеления
  choice: строго предупредил
  alternative: строго приказал; сурово предостерёг
  rationale: Перевод ясно передаёт настойчивый запрет, но не объясняет его мотив и не уточняет эмоциональное состояние Иисуса сверх того, что позволяет глагол.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор союза καί перед Иисусом передан частицей «же», чтобы избежать тяжеловесного «И», сохранив переход к следующему действию. Все добавления, способные устранить невыраженный объект γινωσκέτω, вынесены из основного текста.
