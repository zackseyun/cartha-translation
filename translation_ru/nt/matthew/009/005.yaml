  text: τί γάρ ἐστιν εὐκοπώτερον, εἰπεῖν· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/005.yaml
  text: 'For which is easier: to say[a], ‘Your sins are forgiven,’ or to say, ‘Get up and walk’?”'
translation:
  language: ru
  text: 'Ведь что легче: сказать[a]: «Твои грехи прощены», — или сказать: «Встань и ходи»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твои грехи были прощены». Греческая форма настоящего времени в страдательном залоге может обозначать состояние, возникшее в результате совершившегося действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ ἐστιν εὐκοπώτερον
  choice: Ведь что легче
  rationale: Вопрос τί с εὐκοπώτερον сопоставляет два варианта; «что легче» естественно по-русски, а «ведь» сохраняет пояснительную связь γάρ с предыдущей мыслью.
- source_word: εἰπεῖν
  choice: сказать
  rationale: Обычное значение инфинитива; одинаковый перевод в обеих частях сохраняет параллелизм.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Твои грехи прощены
  rationale: Настоящее пассивное ἀφίενταί здесь естественно передаётся кратким страдательным причастием со значением наличного результата, без уточнения времени совершения действия.
- source_word: ἁμαρτίαι
  choice: грехи
  rationale: Прямой и общепринятый эквивалент, не требующий метафорического расширения.
- source_word: Ἔγειρε
  choice: Встань
  rationale: В контексте исцеления повеление означает подняться; «встань» звучит естественно, ясно и достойно.
- source_word: καὶ περιπάτει
  choice: и ходи
  rationale: Настоящий императив указывает на последующее хождение; простая русская форма сохраняет смысл без избыточного уточнения.
- source_word: σου
  choice: твои
  rationale: Передаёт второе лицо единственного числа и непосредственное обращение.
theological_decisions:
- issue: Передача заявления Иисуса о прощении
  choice: Твои грехи прощены
  alternative: Твои грехи были прощены
  rationale: Греческая форма настоящего времени допускает понимание наличного состояния как результата. Основной перевод не уточняет момент прощения и тем самым не привносит дополнительного богословского вывода.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет риторический параллелизм оригинала. «Ведь» естественно выражает пояснительное γάρ, а «Встань и ходи» передаёт краткость и силу повеления.
