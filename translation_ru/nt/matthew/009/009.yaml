  source_fidelity: 'Перевод точно передаёт основные элементы греческого текста: движение Иисуса «оттуда», встречу с мужчиной, названным Матфеем, его положение у пункта взимания пошлин, призыв и немедленный ответ. «Уходя оттуда» является допустимой естественной передачей παράγων ἐκεῖθεν; контекстуально оно не вносит существенного дополнительного смысла. «Тот» однозначно относится к Матфею по смыслу последовательности действий.'
  naturalness: Текст звучит естественно на современном литературном русском языке. Деепричастный оборот, «по имени Матфей», «у места сбора пошлин» и краткая заключительная фраза читаются плавно. Сохранение исторического настоящего в «говорит ему» стилистически заметно, но оправдано оригиналом и пояснено сноской.
  terminology: «Место сбора пошлин» удачно передаёт τελώνιον без неуместной модернизации. «Следуй за Мной» точно сохраняет прямой характер повеления Ἀκολούθει μοι и не заменяет его интерпретирующей формулой об ученичестве. Имя «Матфей» нормативно для русской библейской традиции.
