source:
  edition: SBLGNT
  text: Καὶ παράγων ὁ Ἰησοῦς ἐκεῖθεν εἶδεν ἄνθρωπον καθήμενον ἐπὶ τὸ τελώνιον, Μαθθαῖον λεγόμενον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι· καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/009.yaml
  text: And as Jesus was passing on from there[a], he saw a man called Matthew sitting at the tax booth, and he says to him[c][b], “Follow me.” And he rose and followed him.
translation:
  language: ru
  text: 'Уходя оттуда, Иисус увидел человека по имени Матфей, сидевшего у места сбора пошлин, и говорит ему[a]: «Следуй за Мной». Тот встал и последовал за Ним.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сказал ему»; в греческом здесь употреблено историческое настоящее время («говорит»), придающее рассказу живость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων ... ἐκεῖθεν
  choice: уходя оттуда
  rationale: Причастие настоящего времени передаёт действие Иисуса при удалении из прежнего места; русский деепричастный оборот естественно сохраняет эту одновременность.
- source_word: ἄνθρωπον
  choice: человека
  rationale: Нейтральное обозначение конкретного человека; мужской пол и личность далее ясно выражены именем Матфей.
- source_word: καθήμενον ἐπὶ τὸ τελώνιον
  choice: сидевшего у места сбора пошлин
  rationale: Передаёт нахождение Матфея на месте взимания налогов, пошлин или дорожных сборов, не превращая вероятный пункт сбора в современное государственное учреждение.
- source_word: Μαθθαῖον λεγόμενον
  choice: по имени Матфей
  rationale: Естественный современный русский способ сообщить имя человека; соответствует значению «называемый Матфеем».
- source_word: λέγει αὐτῷ
  choice: говорит ему
  rationale: Сохранён исторический презенс греческого повествования, придающий сцене живость; допустимый русский вариант «сказал» отмечен в сноске.
- source_word: Ἀκολούθει μοι
  choice: Следуй за Мной
  rationale: Прямо передаёт повеление следовать за Иисусом, сохраняя как буквальное движение, так и контекст ученичества без поясняющей парафразы.
- source_word: ἀναστὰς
  choice: встал
  rationale: Кратко и естественно передаёт действие, непосредственно предшествующее следованию.
- source_word: ἠκολούθησεν αὐτῷ
  choice: последовал за Ним
  rationale: Сохраняет буквальный смысл и подразумеваемое вступление на путь ученика, не подменяя его толкованием.
theological_decisions:
- issue: Характер призыва Иисуса к Матфею
  choice: «Следуй за Мной» без поясняющего расширения
  alternative: «Стань Моим учеником»
  rationale: Контекст подразумевает призыв к ученичеству, однако исходный текст выражает его простым повелением следовать; перевод сохраняет эту ёмкость и не вводит дополнительной терминологии.
- issue: Немедленность ответа Матфея
  choice: «Тот встал и последовал за Ним»
  alternative: «Тот стал Его учеником»
  rationale: Последовательность действий сохранена буквально; богословское значение ответа не следует заменять объясняющей формулировкой.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Местоимения, относящиеся к Иисусу, написаны с прописной буквы по принятой русской библейской издательской традиции. Историческое настоящее сохранено как заметная повествовательная особенность оригинала.
