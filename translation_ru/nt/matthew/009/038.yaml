base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/038.yaml
  text: Therefore pray earnestly to the Lord of the harvest that he would send out workers into his harvest[a].
translation:
  language: ru
  text: Поэтому усердно просите Господа жатвы, чтобы Он послал работников на Свою жатву[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выслал» работников. Греческий глагол сильнее простого «послал», хотя здесь речь идёт о направлении работников на жатву.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεήθητε
  choice: горячо просите
  rationale: Глагол δέομαι в форме повелительного наклонения выражает настоятельную просьбу; сочетание «горячо просите» естественно передаёт и молитвенный контекст, и силу обращения.
- source_word: οὖν
  choice: Поэтому
  rationale: Союз указывает на вывод из предыдущих слов об обильной жатве и малом числе работников.
- source_word: τοῦ κυρίου τοῦ θερισμοῦ
  choice: Господина жатвы
  rationale: κύριος здесь обозначает того, кому принадлежит жатва и кто властен посылать работников. «Господин жатвы» сохраняет образ, не уточняя сверх текста личность референта.
- source_word: ὅπως
  choice: чтобы
  rationale: Вводит содержание и цель настоятельной просьбы; «чтобы» естественно в современном русском языке.
- source_word: ἐκβάλῃ
  choice: послал
  rationale: В данном контексте глагол означает направить работников на жатву. Основной перевод остаётся естественным, а более сильный оттенок греческого слова отмечен в сноске.
- source_word: ἐργάτας
  choice: работников
  rationale: Нейтральное современное обозначение тех, кто трудится на жатве; сохраняет прямой и метафорический смысл.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: на Свою жатву
  rationale: Русское «на жатву» естественно передаёт направление к делу жатвы, а «Свою» сохраняет αὐτοῦ и соотносится с Господином жатвы.
theological_decisions:
- issue: Кого обозначает выражение «Господин жатвы»
  choice: Не уточнять в переводе, идёт ли речь конкретно об Отце, об Иисусе или о Боге без дальнейшего разграничения.
  alternative: Явно назвать Отца или Иисуса.
  rationale: Сам стих не устанавливает референта точнее титула «Господин жатвы»; сохранение этого выражения не снимает заложенную в тексте богословскую открытость.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизмов. Образ жатвы сохранён. Прописные местоимения «Он», «Свою» употреблены как нормативный благоговейный издательский выбор; они не добавляют уточнения личности Господина жатвы.
