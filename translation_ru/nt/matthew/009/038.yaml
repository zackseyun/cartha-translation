  source_fidelity: 'Основной смысл передан верно: δεήθητε — настоятельная просьба в молитвенном контексте; οὖν — вывод; ὅπως ἐκβάλῃ — просьба о том, чтобы Господь направил работников; εἰς сохраняет направление «на жатву». Однако «Господин жатвы» сужает обычное библейское значение κύριος как титула «Господь» и расходится с английским аудиторским решением, намеренно сохраняющим «Lord».'
  naturalness: «Поэтому» и «на Свою жатву» естественны. «Горячо просите» возможно, но «усердно просите» точнее передаёт настойчивость δεήθητε без разговорно-эмоционального оттенка. Исправленная фраза остаётся современной литературной и пригодной для публичного чтения.
  terminology: '«Господь жатвы» сохраняет титул κύριος, его библейский регистр и богословскую неуточнённость референта. «Работники» удачно передаёт ἐργάτας. Сноску следует уточнить: «вытолкнул» создаёт неуместный физический образ, тогда как сильный оттенок ἐκβάλῃ лучше передаётся «выслал» с пояснением.'
