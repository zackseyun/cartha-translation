  text: οἱ δὲ Φαρισαῖοι ἔλεγον· Ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/034.yaml
  text: But the Pharisees were saying[a], “By the ruler of the demons he casts out the demons.”
translation:
  language: ru
  text: 'Но фарисеи говорили: «Он изгоняет бесов с помощью повелителя бесов».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт противопоставление восторженной реакции народа в предыдущем стихе враждебному объяснению фарисеев.
- source_word: οἱ Φαρισαῖοι
  choice: фарисеи
  rationale: Общепринятое русское название этой иудейской религиозной группы; определённость естественно передаётся контекстом без отдельного артикля.
- source_word: ἔλεγον
  choice: говорили
  rationale: Несовершенный вид русского глагола естественно передаёт имперфект, допускающий продолженное или повторявшееся высказывание.
- source_word: Ἐν τῷ ἄρχοντι
  choice: силой повелителя
  rationale: ἐν с дательным здесь имеет инструментальное значение. Оборот «силой» ясно и естественно передаёт приписываемый источник способности Иисуса изгонять бесов.
- source_word: ἄρχοντι
  choice: повелителя
  rationale: Слово обозначает начальствующего, правителя; «повелитель» в данном контексте естественно выражает власть над бесами, не внося монархического оттенка слова «князь».
- source_word: ἐκβάλλει
  choice: изгоняет
  rationale: Точный и общепонятный русский эквивалент в контексте изгнания бесов; настоящее время сохранено.
- source_word: τὰ δαιμόνια
  choice: бесов
  rationale: Передаёт δαιμόνια конкретным традиционным и по-прежнему понятным русским термином, не заменяя его более общим выражением «злые духи».
theological_decisions:
- issue: Источник силы, приписываемый Иисусу фарисеями
  choice: «силой повелителя бесов»
  alternative: «именем повелителя бесов» / «с помощью повелителя бесов»
  rationale: Инструментальное ἐν указывает на приписываемое средство или источник власти. «Силой» сохраняет обвинение, но не уточняет сверх сказанного, идёт ли речь о делегированной власти, содействии или иной форме действия.
- issue: Передача δαιμόνια
  choice: «бесы»
  alternative: «демоны» / «злые духи»
  rationale: «Бесы» точно и естественно передаёт сверхъестественных злых существ в библейском контексте; «злые духи» было бы менее лексически точным, поскольку в оригинале стоит δαιμόνια, а не πνεύματα.
translation_notes:
  register: 'Современный литературный русский язык, ясный и достойный по тону. Порядок слов перестроен ради естественности: подлежащее «Он» вынесено вперёд, а инструментальный оборот поставлен после сказуемого. Имперфект передан несовершенным видом «говорили» без искусственного «продолжали говорить».'
