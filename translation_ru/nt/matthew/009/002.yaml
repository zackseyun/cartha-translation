  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/002.yaml
  text: And behold[a], they brought to him a paralytic lying on a bed. And when Jesus saw their faith, he said to the paralytic, “Take courage, child[c][b]; your sins are forgiven.”
translation:
  language: ru
  text: 'И вот, к Нему несли парализованного, лежавшего на постели. Увидев их веру[a], Иисус сказал парализованному: «Мужайся, дитя! Твои грехи прощены[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Их веру» — форма множественного числа может относиться к парализованному вместе с теми, кто его принёс, или только к принёсшим его.
    reason: alternative_reading
  - marker: b
    text: 'Возможно также: «Твои грехи прощаются».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: и вот
  rationale: Сохраняет характерный для Матфея указательный маркер, оживляющий повествование, и при этом естественно звучит по-русски.
- source_word: προσέφερον
  choice: принесли
  rationale: В данном повествовательном контексте русское совершенное прошедшее естественно передаёт совершившееся действие; значение глагола здесь — доставить человека к Иисусу.
- source_word: παραλυτικὸν
  choice: парализованного
  rationale: Субстантивированное прилагательное передано без добавления слова «мужчина»; форма остаётся понятной и современной.
- source_word: ἐπὶ κλίνης βεβλημένον
  choice: лежавшего на постели
  rationale: Передаёт положение больного естественным русским оборотом; «постель» здесь надёжнее, чем более конкретное «циновка».
- source_word: πίστιν
  choice: веру
  rationale: Обычный и контекстуально точный эквивалент πίστις; доверие проявляется в поступке группы.
- source_word: Θάρσει
  choice: мужайся
  rationale: Краткое повеление с оттенком ободрения; сохраняет силу греческого императива и достоинство речи.
- source_word: τέκνον
  choice: дитя
  rationale: Передаёт ласковое обращение и не добавляет слово «сын», которого в греческом тексте нет; слегка возвышенный оттенок уместен в прямой речи Иисуса.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: твои грехи прощены
  rationale: Естественная русская пассивная формула сохраняет неуказанного деятеля и звучит как настоящее авторитетное провозглашение прощения.
- source_word: ἁμαρτίαι
  choice: грехи
  rationale: Стандартная передача конкретного множественного числа без поясняющей парафразы.
theological_decisions:
- issue: Значение τὴν πίστιν αὐτῶν
  choice: Сохранено множественное «их веру» без уточнения состава группы.
  alternative: Отнести веру только к принесшим больного либо только к самому парализованному.
  rationale: Местоимение во множественном числе относится более чем к одному человеку, однако сам текст не устанавливает прямо, включён ли в эту группу парализованный.
- issue: Сила провозглашения прощения
  choice: «Твои грехи прощены» — декларативное провозглашение с неуказанным деятелем.
  alternative: Развернуть фразу как прямое заявление о немедленном божественном действии либо уточнить, кто прощает.
  rationale: Греческий пассив не называет деятеля. Русский пассив сохраняет эту особенность и не вносит в перевод дополнительного богословского объяснения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис прост и доступен; «и вот», «мужайся» и «дитя» сохраняют выразительность и достоинство исходной речи без архаизации.
