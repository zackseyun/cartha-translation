id: MAT.9.35
reference: Matthew 9:35
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ὁ Ἰησοῦς τὰς πόλεις πάσας καὶ τὰς κώμας, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν ⸀μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/035.yaml
  text: And Jesus went throughout all the cities and villages[b][a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness.
translation:
  language: ru
  text: Иисус обходил все города и селения, учил в их синагогах, возвещал Благую весть о Царстве[a] и исцелял всякую болезнь и всякий недуг[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Евангелие Царства».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всякую болезнь и всякую немощь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: обходил
  rationale: Имперфект передаёт продолжавшееся странствование Иисуса по разным местам; «обходил» естественно выражает повторяющееся движение без лишнего уточнения.
- source_word: πόλεις πάσας καὶ τὰς κώμας
  choice: все города и селения
  rationale: Сохранено различие между более крупными городами и меньшими населёнными пунктами; «селения» звучит естественно и достойно в повествовательном контексте.
- source_word: διδάσκων
  choice: учил
  rationale: Причастный оборот передан однородным сказуемым ради естественного русского синтаксиса; длительный характер действия поддерживается формой несовершенного вида.
- source_word: συναγωγαῖς αὐτῶν
  choice: в их синагогах
  rationale: Сохранены исторический термин «синагоги» и местоимение αὐτῶν, относящееся к общинам упомянутых городов и селений.
- source_word: κηρύσσων
  choice: возвещал
  rationale: «Возвещал» передаёт публичный, вестнический оттенок κηρύσσω и при этом остаётся понятным современному читателю.
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: Благую весть о Царстве
  rationale: Передано основное значение εὐαγγέλιον понятным выражением «Благая весть»; генитив τῆς βασιλείας естественно выражен как «о Царстве», без уточнения, не данного в стихе.
- source_word: θεραπεύων
  choice: исцелял
  rationale: В контексте чудес Иисуса «исцелял» является наиболее естественным и точным соответствием.
- source_word: πᾶσαν νόσον
  choice: всякую болезнь
  rationale: Сохранены как всеохватность πᾶσαν, так и обычное значение νόσος — «болезнь».
- source_word: πᾶσαν μαλακίαν
  choice: всякий недуг
  rationale: «Недуг» понятно передаёт болезненную слабость или нездоровье и позволяет отличить μαλακία от стоящего рядом νόσος; вариант «немощь» отмечен в сноске.
theological_decisions:
- issue: Передача εὐαγγέλιον
  choice: Благая весть
  alternative: Евангелие
  rationale: Выбран прозрачный для современного читателя смысл слова, а традиционный церковный термин сохранён в сноске; богословское содержание возвещения не расширяется.
- issue: Связь τῆς βασιλείας с εὐαγγέλιον
  choice: о Царстве
  alternative: Царства
  rationale: Русское «о Царстве» естественно понимается как содержание вести, однако греческий родительный падеж сам по себе допускает более буквальную передачу «Царства», которая сохранена в сноске вместе с традиционным выражением.
- issue: Всеохватность πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: всякую болезнь и всякий недуг
  alternative: всякую болезнь и всякую немощь
  rationale: Повтор πᾶσαν отражён повтором «всякую/всякий», что сохраняет всеохватный характер утверждения, не превращая его в отдельное доктринальное пояснение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Греческие причастия переданы однородными глаголами несовершенного вида для естественности и сохранения длительного характера действий. Заглавные буквы в «Благая весть» и «Царство» подчёркивают их контекстуальное употребление как обозначений провозглашаемой Иисусом вести и Божьего Царства, не добавляя отсутствующего в греческом уточнения.
