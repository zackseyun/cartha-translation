  text: ἰδόντες δὲ οἱ ὄχλοι ⸀ἐφοβήθησαν καὶ ἐδόξασαν τὸν θεὸν τὸν δόντα ἐξουσίαν τοιαύτην τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/008.yaml
  text: But when the crowds saw it[a], they were afraid and glorified God[b], who had given such authority to men.
translation:
  language: ru
  text: Увидев это, толпы испугались[a] и прославили Бога, давшего такую власть людям[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исполнились благоговейного трепета». Греческий глагол буквально выражает страх, который в данном контексте может включать благоговейное изумление.'
    reason: lexical_alternative
  - marker: b
    text: 'Также можно перевести: «человеческим существам». Греческое слово во множественном числе может обозначать людей вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: увидев это
  rationale: Аористное причастие передано естественным русским деепричастным оборотом; «это» обозначает подразумеваемое из контекста исцеление и сопровождавшее его заявление о прощении.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Частица обозначает переход к реакции толп; в русском повествовании этот переход естественно передаётся самой сменой субъекта без обязательного «но» или «же».
- source_word: οἱ ὄχλοι
  choice: толпы
  rationale: Сохранено множественное число греческого существительного; слово понятно и уместно в современном литературном русском.
- source_word: ἐφοβήθησαν
  choice: испугались
  rationale: Сохранено прямое значение глагола φοβέομαι — страх; возможный оттенок благоговейного трепета не подменяет основного значения и отмечен в сноске.
- source_word: ἐδόξασαν
  choice: прославили
  rationale: Традиционное и современно понятное соответствие ключевому богословскому глаголу δοξάζω, сохраняющее его смысловую весомость.
- source_word: τὸν θεὸν
  choice: Бога
  rationale: Прямое дополнение при «прославили»; стандартная передача.
- source_word: τὸν δόντα
  choice: давшего
  rationale: Определительное аористное причастие, относящееся к Богу, естественно передано русским причастием и обозначает действие, предшествующее реакции толп.
- source_word: ἐξουσίαν
  choice: власть
  rationale: ἐξουσία означает полномочие и законное право действовать, а не только способность или силу; «власть» сохраняет эту смысловую связь с правом прощать грехи.
- source_word: τοιαύτην
  choice: такую
  rationale: Прямое и естественное соответствие указательному определению, относящемуся к «власти».
- source_word: τοῖς ἀνθρώποις
  choice: людям
  rationale: 'ἄνθρωποι здесь может обозначать людей как человеческих существ вообще. Русское «людям» точно передаёт это значение, не устраняя повествовательного напряжения: толпы говорят о власти, данной людям, реагируя на действие Иисуса.'
theological_decisions:
- issue: Передавать ли реакцию толп как страх или как благоговейный трепет
  choice: испугались
  alternative: исполнились благоговейного трепета
  rationale: Глагол непосредственно обозначает страх, хотя контекст прославления Бога допускает примесь благоговения. Основной текст сохраняет более прямое значение, а возможный оттенок указан в сноске.
- issue: Значение τοῖς ἀνθρώποις
  choice: людям
  alternative: человеку / людям мужского пола
  rationale: Множественное ἄνθρωποι способно представительно обозначать человечество или людей вообще. «Людям» сохраняет число и естественную широту греческого выражения, не решая дополнительно, считает ли толпа данную власть принадлежащей одному Иисусу или людям в более широком смысле.
translation_notes:
  register: Современный литературный русский язык с кратким, dignified повествовательным строем. Синтаксис близок к греческому, но естественен по-русски; богословски значимые «прославили» и «власть» сохранены без упрощения.
