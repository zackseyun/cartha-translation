lexical_decisions:
- source_word: Αὐτῶν δὲ ἐξερχομένων
  choice: Когда они выходили
  rationale: Генитив абсолютный передан естественным временным оборотом; δέ отмечает переход в повествовании и не требует отдельного перевода.
- source_word: ἰδοὺ
  choice: вот
  rationale: Сохраняет функцию привлечения внимания и живость повествования, оставаясь естественным для современного русского языка.
- source_word: προσήνεγκαν αὐτῷ
  choice: к Нему привели
  rationale: Передаёт движение человека к Иисусу и ясно отражает αὐτῷ; русский порядок слов звучит естественно.
- source_word: ἄνθρωπον
  choice: человека
  rationale: Нейтральное и точное обозначение человека; русский контекст не требует добавлять слово «мужчина».
- source_word: κωφὸν
  choice: немого
  rationale: Хотя κωφός может означать глухого или немого, в следующем стихе исцеление проявляется в том, что человек заговорил, поэтому здесь предпочтительно «немого».
- source_word: δαιμονιζόμενον
  choice: одержимого бесом
  rationale: Устойчиво и понятно передаёт состояние человека в евангельском повествовании, не уточняя сверх текста характер или степень бесовского воздействия.
theological_decisions:
- issue: Передача бесовского воздействия
  choice: одержимого бесом
  alternative: находившегося под властью беса; бесноватого
  rationale: Формулировка прямо сохраняет сверхъестественный характер описанного состояния, но не вводит дополнительных представлений о механизме такого воздействия.
- issue: Связь немоты с бесовским воздействием
  choice: два определения одного человека без явного утверждения причинности
  alternative: немого из-за беса
  rationale: Греческий текст называет человека немым и одержимым бесом, но в этом стихе грамматически не формулирует причинную связь; перевод её не добавляет.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Вот» сохраняет повествовательный акцент ἰδού; местоимение «Нему» написано с прописной буквы по принятой русской библейской традиции.
