  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐδὲ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή γε, ῥήγνυνται οἱ ἀσκοί, καὶ ὁ οἶνος ἐκχεῖται καὶ οἱ ἀσκοὶ ⸀ἀπόλλυνται· ἀλλὰ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς καινούς, καὶ ἀμφότεροι συντηροῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/017.yaml
  text: Nor do they put new wine into old wineskins. Otherwise[a], the wineskins burst, and the wine is spilled, and the wineskins are ruined. Rather, they put new wine into fresh wineskins, and both are preserved.
translation:
  language: ru
  text: И молодое вино не наливают в старые мехи. Иначе мехи разрываются, вино выливается, а мехи приходят в негодность. Напротив, молодое вино наливают в новые мехи[a], и сохраняются и вино, и мехи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте вино названо «молодым» (νέος), а мехи — «новыми» по состоянию (καινός).
    reason: Поясняет намеренно сохранённое различие двух греческих прилагательных.
lexical_decisions:
- source_word: οὐδὲ βάλλουσιν
  choice: И … не наливают
  rationale: οὐδέ связывает этот пример с предыдущим отрицательным высказыванием; для помещения вина в сосуд по-русски естественно «наливать», а не буквально «бросать».
- source_word: οἶνον νέον
  choice: молодое вино
  rationale: Устойчивое русское обозначение недавно приготовленного вина; оно естественно передаёт νέος и сохраняет отличие от прилагательного καινός при мехах.
- source_word: ἀσκοὺς παλαιούς
  choice: старые мехи
  rationale: «Мехи» — традиционное и точное обозначение кожаных сосудов; «старые» прямо передаёт παλαιούς.
- source_word: εἰ δὲ μή γε
  choice: Иначе
  rationale: Естественно выражает условное предупреждение и связь с последующими последствиями.
- source_word: ῥήγνυνται
  choice: прорываются
  rationale: Передаёт разрыв кожаных сосудов под давлением без неуместной буквальности.
- source_word: ἐκχεῖται
  choice: выливается
  rationale: Точно описывает непреднамеренную утрату вина после разрыва мехов.
- source_word: ἀπόλλυνται
  choice: приходят в негодность
  rationale: В данном предметном контексте глагол означает, что мехи испорчены и больше непригодны для использования.
- source_word: ἀλλὰ βάλλουσιν
  choice: наливают
  rationale: Противопоставление передано новой фразой; русская конструкция ясно выражает правильный способ действия без тяжеловесного «но вместо этого».
- source_word: ἀσκοὺς καινούς
  choice: новые мехи
  rationale: Естественный русский эквивалент для мехов, новых по состоянию и потому пригодных для молодого вина.
- source_word: ἀμφότεροι συντηροῦνται
  choice: сохраняется и то и другое
  rationale: Передаёт совместное сохранение вина и мехов; единственное число согласуется с русской конструкцией «и то и другое».
theological_decisions:
- issue: Различение νέος и καινός в одном стихе
  choice: Передать νέος как «молодое», а καινός как «новые»
  alternative: Передать оба прилагательных словом «новый»
  rationale: 'Так сохраняется лексическое различие исходного текста: вино молодое по времени изготовления, а мехи новые по состоянию. Перевод не навязывает аллегорического толкования образа.'
translation_notes:
  register: Современный литературный русский язык с общеупотребительным библейским словом «мехи». Синтаксис краткий и образный; богословское истолкование сравнения не добавляется.
