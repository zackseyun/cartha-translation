base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/011.yaml
  text: And when the Pharisees saw it[a], they were saying to his disciples, “Why does your teacher eat with tax collectors and sinners?”
translation:
  language: ru
  text: 'Увидев это[a], фарисеи говорили Его ученикам: «Почему ваш учитель ест со сборщиками налогов и грешниками?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «И, увидев, фарисеи говорили Его ученикам…» В греческом тексте не сказано прямо, что именно они увидели; из контекста ясно, что речь идёт о происходившей трапезе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: увидев это
  rationale: Аористное причастие передано естественным русским деепричастием. Местоимение «это» добавлено для ясности и указывает на происходящую в контексте трапезу; в греческом объект не выражен.
- source_word: ἔλεγον
  choice: говорили
  rationale: Несовершенный вид русского глагола передаёт имперфект и допускает продолженное либо повторявшееся высказывание, не усиливая его до «продолжали говорить».
- source_word: μαθηταῖς
  choice: ученикам
  rationale: Обычный и точный евангельский эквивалент, сохраняющий связь между учителем и учениками.
- source_word: Διὰ τί
  choice: Почему
  rationale: Естественная и точная передача вопроса о причине.
- source_word: τελωνῶν
  choice: сборщиками налогов
  rationale: Понятное современному читателю обозначение людей, собиравших налоги и пошлины; оно избегает устаревшего и менее прозрачного слова «мытари».
- source_word: ἁμαρτωλῶν
  choice: грешниками
  rationale: Прямой эквивалент, сохраняющий как нравственную, так и общественную маркированность названия группы без дополнительного толкования.
- source_word: ἐσθίει
  choice: ест
  rationale: Настоящее время и основное значение глагола сохранены; формулировка естественна в прямом вопросе.
- source_word: διδάσκαλος
  choice: Учитель
  rationale: Прямое и прозрачное обозначение роли Иисуса. Заглавная буква соответствует принятому русскому библейскому оформлению обращения к Нему, не меняя лексического смысла.
theological_decisions:
- issue: Следует ли явно обозначить объект глагола «увидев»
  choice: Добавлено «это», со сноской о невыраженном объекте
  alternative: «И, увидев, фарисеи говорили Его ученикам…»
  rationale: Греческое причастие ἰδόντες не имеет выраженного объекта, однако по контексту речь идёт о трапезе Иисуса со сборщиками налогов и грешниками. Русское «увидев это» звучит естественно, а сноска сохраняет формальную особенность источника.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранён несовершенный вид «говорили», отражающий имперфект ἔλεγον. Союз καί перед причастным оборотом не передан отдельным «и», поскольку в русском начале предложения «Увидев это» естественно продолжает повествование. Предлог «с» повторён перед однородными группами ради ясности и естественного звучания.
