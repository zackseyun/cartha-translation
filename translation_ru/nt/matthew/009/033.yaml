base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/033.yaml
  text: And when the demon had been cast out[a], the mute man spoke. And the crowds were amazed, saying, “Never has anything like this appeared in Israel.”
translation:
  language: ru
  text: 'Когда бес был изгнан, немой[a] заговорил. Толпы изумлялись, говоря: «Никогда ещё ничего подобного не бывало в Израиле».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глухой». Греческое слово может означать как глухого, так и немого; здесь контекст указывает прежде всего на немоту, поскольку сказано, что он заговорил.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβληθέντος
  choice: когда же был изгнан
  rationale: Аористное страдательное причастие в независимом родительном обороте обозначает действие, предшествующее главному; такая конструкция естественно передаётся временным придаточным.
- source_word: δαιμονίου
  choice: бес
  rationale: δαιμόνιον в евангельском повествовании об изгнании злых духов обозначает беса; это точный и привычный русский библейский термин.
- source_word: ἐλάλησεν
  choice: заговорил
  rationale: В данном контексте русское «заговорил» естественно передаёт факт обретения речи после изгнания беса, не утверждая сверх текста, что последовала продолжительная беседа.
- source_word: ὁ κωφός
  choice: немой
  rationale: κωφός может означать глухого или немого, но непосредственное продолжение «заговорил» указывает здесь прежде всего на немоту; неоднозначность отмечена в сноске.
- source_word: ἐθαύμασαν
  choice: изумлялся
  rationale: Глагол выражает сильное удивление; «изумлялся» звучит современно и достойно. Собирательное «народ» требует единственного числа.
- source_word: οἱ ὄχλοι
  choice: народ
  rationale: Хотя греческое слово стоит во множественном числе, в русском повествовании собравшиеся люди естественно обозначаются собирательным словом «народ».
- source_word: Οὐδέποτε
  choice: никогда ещё
  rationale: Сочетание ясно выражает беспрецедентность увиденного и естественно звучит в прямой речи.
- source_word: ἐφάνη οὕτως
  choice: ничего подобного не бывало
  rationale: Буквально выражение допускает «не являлось так» или «не было видно такого»; русская идиома «ничего подобного не бывало» естественно передаёт утверждение о беспрецедентности, не уточняя искусственно, идёт ли речь о явлении или видении.
- source_word: ἐν τῷ Ἰσραήλ
  choice: в Израиле
  rationale: Краткий стандартный эквивалент, способный обозначать как страну, так и народ Израиля без ненужного уточнения.
theological_decisions:
- issue: Значение κωφός в контексте исцеления и изгнания беса
  choice: немой
  alternative: глухой
  rationale: Семантически возможны оба значения, однако результат «заговорил» выделяет неспособность говорить. В сноске сохранено альтернативное значение, чтобы не скрывать лексическую неоднозначность.
- issue: Характер беспрецедентности в ἐφάνη οὕτως
  choice: ничего подобного не бывало
  alternative: ничего подобного не являлось / не было видно
  rationale: Греческая формулировка допускает оттенок появления или видимости. Русская идиома сохраняет общий смысл признания необычайности события, не превращая высказывание в более узкое богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Бес» сохраняет точность евангельского контекста, а «народ изумлялся» и «ничего подобного не бывало» понятны обычному читателю и не звучат архаично.
