review_pass:
  verdict: approve
  source_fidelity: Перевод точно передаёт смысл греческого текста. «Услышав это» естественно отражает аористное причастие ἀκούσας с подразумеваемым дополнением; «Он сказал» не добавляет оттенка «ответил». Противопоставление «здоровые — больные» корректно передаёт медицинский смысл οἱ ἰσχύοντες и οἱ κακῶς ἔχοντες, не превращая изречение в явное богословское толкование. Оборот «нуждаются во враче» адекватно передаёт χρείαν ἔχουσιν ἰατροῦ.
  naturalness: Фраза звучит естественно, кратко и литературно по-русски. Конструкция «Не здоровые нуждаются во враче, а больные» уместна для афористической, параллельной речи и ясно выражает контраст. Прописное «Он» соответствует заявленному библейскому регистру.
  terminology: «Врач» — современный нейтральный эквивалент ἰατρός; «здоровые» и «больные» образуют естественную медицинскую антитезу. Терминологических или богословски нагруженных добавлений нет.
