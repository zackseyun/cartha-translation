id: MAT.9.12
reference: Matthew 9:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/012.yaml
  text: But when he heard it[a], he said, “Those who are well have no need of a physician, but those who are sick do.”
translation:
  language: ru
  text: 'Услышав это, Он сказал: «Не здоровые нуждаются во враче, а больные».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: Услышав это
  rationale: Аористное причастие передаёт предшествующее обстоятельство; подразумеваемое дополнение естественно восстанавливается из предыдущего контекста как «это».
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Частица обозначает переход или лёгкое противопоставление; в русском оно уже естественно передаётся самой ответной репликой, а начальное «но» здесь утяжеляло бы фразу.
- source_word: εἶπεν
  choice: Он сказал
  rationale: Нейтрально и точно передаёт обычный глагол речи, не усиливая его до «ответил».
- source_word: Οὐ χρείαν ἔχουσιν
  choice: не … нуждаются
  rationale: Естественный русский эквивалент оборота «не имеют нужды»; управление «нуждаться во враче» сохраняет смысл без архаичности.
- source_word: οἱ ἰσχύοντες
  choice: здоровые
  rationale: Хотя глагол буквально связан с силой, в медицинском противопоставлении больным он идиоматически обозначает тех, кто здоров.
- source_word: ἰατροῦ
  choice: во враче
  rationale: «Врач» — точный, современный и стилистически нейтральный эквивалент ἰατρός.
- source_word: οἱ κακῶς ἔχοντες
  choice: больные
  rationale: Устойчивое выражение κακῶς ἔχειν в данном медицинском контексте означает «быть больным».
theological_decisions:
- issue: Метафорический или только физический смысл изречения
  choice: Сохранить прямой медицинский образ без явного пояснения его духовного применения.
  alternative: Истолковательно указать в самом стихе на духовную нужду грешников.
  rationale: Греческий текст формулирует медицинское изречение; его применение к грешникам раскрывается контекстом. Такой перевод сохраняет образ и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык; лаконичная, достойная и легко понятная формулировка. Местоимение «Он» написано с прописной буквы в соответствии с традиционным благоговейным библейским регистром.
