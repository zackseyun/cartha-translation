  text: τότε λέγει τοῖς μαθηταῖς αὐτοῦ· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/037.yaml
  text: Then he says to his disciples[a], “The harvest indeed is plentiful[b], but the workers are few.”
translation:
  language: ru
  text: 'Тогда он говорит[a] своим ученикам: «Жатвы много[b], а работников мало».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте употреблено историческое настоящее: «говорит». Возможный перевод по-русски: «сказал».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «Жатва обильна».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Кратко и естественно обозначает последовательность событий.
- source_word: λέγει
  choice: говорит
  rationale: Сохраняет историческое настоящее греческого повествования и его живость.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: своим ученикам
  rationale: «Ученикам» — устойчивое соответствие μαθηταῖς; «своим» естественно передаёт явное αὐτοῦ при совпадении действующего лица и обладателя.
- source_word: Ὁ μὲν ... οἱ δὲ
  choice: …а…
  rationale: Русский союз «а» естественно и достаточно ясно передаёт сопоставление μέν…δέ без тяжеловесной конструкции.
- source_word: θερισμός
  choice: жатва
  rationale: Сохраняет сельскохозяйственный образ и его традиционно понятное переносное значение.
- source_word: πολύς
  choice: много
  rationale: В сочетании «жатвы много» прямо передаёт количественное изобилие и звучит естественно по-русски.
- source_word: ἐργάται
  choice: работники
  rationale: Современное нейтральное слово для людей, занятых трудом; оно не сужает образ до конкретной профессии.
- source_word: ὀλίγοι
  choice: мало
  rationale: 'Прямо передаёт контраст с πολύς и образует естественную параллель: «много — мало».'
theological_decisions:
- issue: Переносный смысл образа жатвы
  choice: Сохранить образ жатвы без пояснения его миссионерского смысла в основном тексте.
  alternative: Раскрыть жатву как людей, готовых принять служение Иисуса.
  rationale: Сам стих оставляет образ нерасшифрованным; его конкретизация в переводе внесла бы толкование, отсутствующее в исходном тексте.
translation_notes:
  register: Современный литературный русский язык с краткой, ритмичной формулировкой. Строчная буква в местоимении «он» соответствует обычной современной орфографии и не добавляет в текст отсутствующего в греческом оригинале конфессионального оформления.
