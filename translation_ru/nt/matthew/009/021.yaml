  text: For she was saying to herself[a], “If only I touch his garment, I will be saved.”
translation:
  language: ru
  text: 'Ибо она говорила про себя: «Если я только прикоснусь к его одежде, то буду спасена[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исцелюсь»; также возможно: «стану здорова». В греческом тексте употреблён глагол со значением «буду спасена», который в данном контексте может обозначать и исцеление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: говорила
  rationale: Имперфект передаёт продолжающуюся или повторявшуюся внутреннюю речь; русское несовершенное прошедшее естественно сохраняет этот аспект.
- source_word: γὰρ
  choice: потому что
  rationale: Союз вводит объяснение в ходе повествования; «потому что» ясно передаёт причинно-пояснительную связь.
- source_word: ἐν ἑαυτῇ
  choice: про себя
  rationale: Естественное современное русское выражение для внутренней речи, сохраняющее рефлексивный смысл.
- source_word: Ἐὰν μόνον
  choice: если только
  rationale: 'Передаёт минимальное условие с усилительным акцентом: достаточно одного прикосновения.'
- source_word: ἅψωμαι
  choice: прикоснусь
  rationale: Аорист конъюнктива после ἐάν выражает будущее условие; совершенный вид в русском естественно обозначает единичное ожидаемое прикосновение.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: к его одежде
  rationale: ἱμάτιον обозначает одежду, часто верхнюю; общее «одежда» не вносит излишней конкретизации.
- source_word: σωθήσομαι
  choice: буду спасена
  rationale: Сохраняет основное и более широкое значение σῴζω, хотя в непосредственном контексте речь идёт об исцелении; контекстуальный смысл отмечен в сноске.
theological_decisions:
- issue: Передача σωθήσομαι в контексте телесного исцеления
  choice: буду спасена
  alternative: исцелюсь; стану здорова
  rationale: Греческий глагол σῴζω допускает значения спасения, избавления и исцеления. Буквально более широкая передача сохраняет возможный богословский оттенок, не устраняя очевидного из контекста смысла исцеления; этот смысл поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с естественной повествовательной связью и достойным библейским регистром. Формулировка сохраняет аспект внутренней речи и смысловую широту глагола σῴζω.
