translation:
  language: ru
  text: Иисус встал и пошёл за ним, и его ученики пошли за ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθεὶς
  choice: встал
  rationale: Аористное причастие от ἐγείρω здесь употреблено непереходно и обозначает, что Иисус поднялся, чтобы пойти за просителем. «Встал» естественно и точно передаёт движение без тяжеловесного «встав».
- source_word: ἠκολούθει
  choice: пошёл за ним
  rationale: Имперфект ἀκολουθέω обозначает следование за человеком. В данном повествовательном контексте «пошёл за ним» звучит естественнее, чем «следовал за ним», и сохраняет направление движения вслед за начальником из предыдущего стиха.
- source_word: αὐτῷ
  choice: за ним
  rationale: Дательный падеж при ἀκολουθέω передаётся по-русски конструкцией «идти за кем-либо»; местоимение относится к начальнику из предыдущего стиха.
- source_word: μαθηταὶ
  choice: ученики
  rationale: «Ученики» — устойчивое и точное соответствие μαθηταί в Евангелиях, сохраняющее отношения учителя и учеников.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: и ученики Его тоже
  rationale: 'В греческом после этой группы повторный глагол подразумевается. Русское «тоже» естественно сохраняет эллипсис: ученики также пошли за начальником вслед за Иисусом. Заглавная буква в «Его» помогает ясно отнести местоимение к Иисусу согласно принятой русской библейской традиции.'
