  text: Καὶ ⸀ἐμβὰς ⸀εἰς πλοῖον διεπέρασεν καὶ ἦλθεν εἰς τὴν ἰδίαν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/001.yaml
  text: And after getting into a boat[a], he crossed over and came to his own city.
translation:
  language: ru
  text: Войдя в лодку, он переправился и пришёл в свой город.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в родной город». Буквально: «в свой город»; в данном контексте, вероятно, речь идёт о Капернауме.'
    reason: Сохраняет возможную широту выражения ἰδίαν πόλιν и поясняет вероятный контекстуальный референт, не внося его в основной текст.
lexical_decisions:
- source_word: ἐμβὰς
  choice: войдя
  rationale: Аористное причастие обозначает действие, предшествующее основным глаголам; деепричастие естественно передаёт эту последовательность по-русски.
- source_word: πλοῖον
  choice: в лодку
  rationale: В контексте Галилейского моря общее обозначение судна естественно передаётся словом «лодка»; отсутствие артикля не требует определённости.
- source_word: διεπέρασεν
  choice: переправился
  rationale: Глагол обозначает переход или переправу с одной стороны на другую, особенно по воде; русский глагол сохраняет это направительное значение.
- source_word: ἦλθεν
  choice: пришёл
  rationale: Прямое и естественное соответствие ἔρχομαι в данном повествовательном контексте.
- source_word: τὴν ἰδίαν πόλιν
  choice: в свой город
  rationale: Сохраняет значение принадлежности или устойчивой связи с городом, не уточняя без основания, был ли это город рождения.
- source_word: Καὶ ... καὶ
  choice: И ... и
  rationale: Повтор союза сохраняет простую повествовательную связь и последовательность действий, характерную для текста Матфея.
theological_decisions:
- issue: Какой город назван «своим»
  choice: В основном тексте город не назван и передан нейтрально как «свой город».
  alternative: Понять выражение как указание на Капернаум либо перевести «родной город».
  rationale: Греческий текст не называет город. Контекст, вероятно, указывает на Капернаум как место служения и проживания Иисуса, однако перевод не должен вносить это уточнение в основной текст или превращать связь с городом в утверждение о месте рождения.
translation_notes:
  register: Современный литературный русский язык с простой и dignified повествовательной синтаксической структурой. Местоимения, относящиеся к Иисусу, пишутся со строчной буквы в соответствии с обычной современной орфографией и без введения конфессиональной стилистической маркировки.
