base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/027.yaml
  text: And as Jesus was passing on from there[a], two blind men followed him, crying out and saying, “Have mercy on us, Son of David.”
translation:
  language: ru
  text: 'Когда Иисус шел оттуда дальше, за Ним последовали двое слепых, громко взывая: «Помилуй нас, Сын Давида!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Сын Давида» — царский и мессианский титул, указывающий на Иисуса как на обещанного наследника из рода Давида.
    reason: cross_reference
lexical_decisions:
- source_word: παράγοντι ἐκεῖθεν τῷ Ἰησοῦ
  choice: Когда Иисус уходил оттуда
  rationale: 'Дательный абсолют с причастием настоящего времени передаёт сопутствующее действие: Иисус в это время покидал то место. «Уходил оттуда» естественно звучит по-русски и не превращает движение в простое прохождение мимо.'
- source_word: ἠκολούθησαν αὐτῷ
  choice: за Ним последовали
  rationale: Передаёт обычное повествовательное значение физического следования за Иисусом.
- source_word: δύο τυφλοὶ
  choice: двое слепых
  rationale: Мужской род и числительное указывают на двух мужчин; субстантивированное «слепых» естественно и уважительно в данном повествовательном контексте.
- source_word: κράζοντες καὶ λέγοντες
  choice: Они громко взывали
  rationale: κράζω выражает громкий, настойчивый крик, а λέγοντες вводит содержание речи. Единая русская конструкция устраняет неестественное «крича и говоря», сохраняя громкость и настойчивость обращения.
- source_word: Ἐλέησον ἡμᾶς
  choice: Помилуй нас
  rationale: Точная, устоявшаяся и стилистически достойная передача прямой просьбы о милосердной помощи.
- source_word: υἱὲ Δαυίδ
  choice: Сын Давида
  rationale: Сохраняет традиционный царско-мессианский титул, а не сводит его к пояснительному «потомок Давида».
theological_decisions:
- issue: Мессианское значение обращения «Сын Давида»
  choice: Сохранить в основном тексте титул «Сын Давида»
  alternative: 'Передать пояснительно: «обещанный потомок Давида» или «Мессия из рода Давида»'
  rationale: Греческий текст употребляет традиционный титул без встроенного пояснения. Буквальная форма сохраняет его царское и мессианское звучание, не добавляя толкование в слова персонажей.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным стилем. Причастная цепочка оригинала естественно перестроена в отдельное предложение; настойчивый характер просьбы сохранён глаголом «взывали». Местоимение «Ним» написано с прописной буквы согласно распространённой русской библейской издательской традиции.
