lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт лёгкое противопоставление предыдущему запрету Иисуса рассказывать о случившемся.
- source_word: ἐξελθόντες
  choice: выйдя
  rationale: Деепричастие естественно передаёт предшествующее основному действию событие, выраженное аористным причастием.
- source_word: διεφήμισαν
  choice: разнесли весть
  rationale: Передаёт широкое распространение сведений и звучит естественно в современном русском языке.
- source_word: αὐτόν
  choice: о Нём
  rationale: При русском выражении «разнести весть» прямое дополнение естественно передаётся предложным оборотом.
- source_word: ἐν ὅλῃ τῇ γῇ ἐκείνῃ
  choice: по всей той местности
  rationale: В данном локальном контексте γῆ обозначает местность или край; «по всей» передаёт распределительное значение оборота.
theological_decisions:
- issue: Географический охват γῆ
  choice: местность
  alternative: земля; край
  rationale: Контекст говорит о распространении вести в окружающей местности и не требует значения всей страны или земли; вариант сохраняет локальный масштаб.
translation_notes:
  register: Современный литературный русский язык; краткое и достойное повествование. Заглавная буква в местоимении «Нём» соответствует принятому русскому библейскому оформлению при указании на Иисуса.
