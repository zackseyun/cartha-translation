  yaml_path: translation/nt/matthew/009/031.yaml
  text: But after they went out[a], they spread the news about him throughout that whole region.
translation:
  language: ru
  text: Но выйдя, они разнесли весть о Нём по всей той местности.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по всему тому краю». Греческое γῆ может означать «земля», «край» или «местность».'
