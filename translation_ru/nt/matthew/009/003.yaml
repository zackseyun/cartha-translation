lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой повествовательный союз, сохраняющий связь с предыдущим эпизодом.
- source_word: ἰδού
  choice: вот
  rationale: Естественный современный русский указатель, передающий функцию привлечения внимания и оживляющий повествование.
- source_word: τινες τῶν γραμματέων
  choice: некоторые из книжников
  rationale: Точно передаёт неопределённую часть группы; «книжники» — традиционный и понятный евангельский термин для знатоков и толкователей Писания.
- source_word: εἶπαν ἐν ἑαυτοῖς
  choice: сказали про себя
  rationale: Сохраняет глагол речи и допускает внутреннее высказывание; контекст следующего стиха указывает на мысли, но сама греческая формула может обозначать внутреннюю либо непубличную речь.
- source_word: Οὗτος
  choice: Он
  rationale: В русском контексте местоимение звучит естественно; буквальное «этот» без существительного было бы стилистически резким и могло бы чрезмерно усиливать пренебрежительный оттенок.
- source_word: βλασφημεῖ
  choice: богохульствует
  rationale: Прямой и краткий русский эквивалент настоящего времени, передающий обвинение в речи, оскорбляющей Бога или посягающей на Его прерогативы.
theological_decisions:
- issue: Обвинение книжников в адрес Иисуса
  choice: «Он богохульствует»
  alternative: «Этот человек произносит хулу»
  rationale: Формулировка прямо сохраняет обвинение и повествовательное напряжение, не объясняя заранее, почему книжники считают прощение грехов богохульством и верно ли их суждение.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и лаконичности евангельского повествования. «И вот» передаёт внимание-направляющую силу καὶ ἰδού; «книжники» сохраняет устойчивую библейскую терминологию. Сноска оставляет неразрешённой неоднозначность ἐν ἑαυτοῖς.
