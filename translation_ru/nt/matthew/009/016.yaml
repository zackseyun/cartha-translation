  text: οὐδεὶς δὲ ἐπιβάλλει ἐπίβλημα ῥάκους ἀγνάφου ἐπὶ ἱματίῳ παλαιῷ· αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/016.yaml
  text: But no one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment, and a worse tear results.
translation:
  language: ru
  text: 'Но никто не ставит заплату из неусаженной ткани[a] на старую одежду: ведь заплата отрывается от одежды, и разрыв становится ещё больше.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из неваляной ткани»; греческое слово обозначает ткань, ещё не прошедшую валяние (усадочную обработку), поэтому такая заплата может дать усадку и оторваться от старой одежды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δὲ
  choice: Но никто
  rationale: Передаёт всеобщее отрицание и мягкий контраст с предшествующим контекстом естественным современным русским языком.
- source_word: ἐπιβάλλει ἐπίβλημα
  choice: не ставит заплату
  rationale: «Ставит заплату» — обычное русское выражение, сохраняющее общее значение «накладывает» без необязательного уточнения способа прикрепления.
- source_word: ῥάκους ἀγνάφου
  choice: из неусаженной ткани
  rationale: ἄγναφος обозначает ткань, ещё не прошедшую обработку; «неусаженная» ясно передаёт существенное для образа свойство — последующую усадку.
- source_word: ἐπὶ ἱματίῳ παλαιῷ
  choice: на старую одежду
  rationale: ἱμάτιον здесь допускает общее обозначение предмета одежды; перевод не сужает значение до плаща.
- source_word: αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου
  choice: ведь заплата потянет за собой ткань одежды
  rationale: Контекстуально передаёт отделяющее и повреждающее действие заплаты. «Ткань одежды» естественно выражает то, что заплата оттягивает часть старого материала, не превращая αἴρει в явно возвратное «оторвётся».
- source_word: καὶ χεῖρον σχίσμα γίνεται
  choice: и разрыв станет ещё больше
  rationale: Передаёт сравнительную степень χεῖρον и возникающее ухудшение повреждения естественной русской формулировкой.
