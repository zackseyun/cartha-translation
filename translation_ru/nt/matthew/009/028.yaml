source:
  edition: SBLGNT
  text: ἐλθόντι δὲ εἰς τὴν οἰκίαν προσῆλθον αὐτῷ οἱ τυφλοί, καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι; λέγουσιν αὐτῷ· Ναί, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/028.yaml
  text: When he entered the house[a], the blind men approached him, and Jesus said to them, “Do you believe that I am able to do this?” They said to him, “Yes[b], Lord.”
translation:
  language: ru
  text: 'Когда же он вошёл в дом[a], слепые подошли к нему, и Иисус говорит им: «Верите ли вы, что я могу это сделать?» Они отвечают ему: «Да, Господи[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда же он пришёл в дом, слепые пришли к нему».'
    reason: previous_rendering
  - marker: b
    text: 'Или: «господин». Греческое κύριε может быть почтительным обращением, но перевод «Господи» сохраняет и возможное признание власти Иисуса.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθόντι δὲ εἰς τὴν οἰκίαν
  choice: Когда же он вошёл в дом
  rationale: Аористное причастие задаёт временную последовательность, а δέ мягко продолжает повествование. «Вошёл в дом» естественно передаёт движение внутрь и избегает тяжеловесного буквального оборота.
- source_word: προσῆλθον αὐτῷ οἱ τυφλοί
  choice: слепые подошли к нему
  rationale: Субстантивированное οἱ τυφλοί естественно передаётся как «слепые»; из ближайшего контекста ясно, что речь идёт о двух мужчинах. «Подошли к нему» точно и без ненужного повтора передаёт προσέρχομαι.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Иисус говорит им
  rationale: Настоящее время сохраняет исторический презенс греческого повествования и его живость.
- source_word: Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι;
  choice: Верите ли вы, что я могу это сделать?
  rationale: Формулировка прямо передаёт вопрос о вере в способность Иисуса совершить подразумеваемое исцеление; «могу» естественно соответствует δύναμαι в современном русском языке.
- source_word: λέγουσιν αὐτῷ· Ναί
  choice: 'Они отвечают ему: «Да»'
  rationale: Хотя λέγουσιν буквально означает «говорят», в реплике-ответе русское «отвечают» звучит естественнее; настоящее время сохраняет исторический презенс.
- source_word: κύριε
  choice: Господи
  rationale: Звательная форма «Господи» традиционно и естественно передаёт прямое обращение κύριε к Иисусу, сохраняя как уважительное обращение, так и возможное признание его власти.
theological_decisions:
- issue: Значение κύριε в обращении к Иисусу
  choice: Господи
  alternative: господин
  rationale: Греческое слово допускает как почтительное «господин», так и более весомое «Господь». Основной текст сохраняет возможное признание власти Иисуса, а примечание отмечает более нейтральное значение, не превращая реплику в однозначно развитое христологическое исповедание.
- issue: Историческое настоящее λέγει / λέγουσιν
  choice: говорит / отвечают
  alternative: сказал / ответили
  rationale: Настоящее время сохраняет дискурсивную живость греческого текста. Для русского повествования такой переход после прошедшего времени допустим и понятен.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Местоимения, относящиеся к Иисусу, не получают внепредложной конфессиональной капитализации; начальное «я» внутри прямой речи также пишется по обычной русской норме. Историческое настоящее сохранено намеренно.
