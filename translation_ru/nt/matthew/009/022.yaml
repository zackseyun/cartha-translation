  text: ὁ δὲ Ἰησοῦς ⸀στραφεὶς καὶ ἰδὼν αὐτὴν εἶπεν· Θάρσει, θύγατερ· ἡ πίστις σου σέσωκέν σε. καὶ ἐσώθη ἡ γυνὴ ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/022.yaml
  text: But Jesus[a], turning and seeing her, said, “Take courage, daughter[d][c][b]; your faith has saved you.” And the woman was healed from that hour.
translation:
  language: ru
  text: 'Но Иисус, обернувшись и увидев её, сказал: «Ободрись, дочь! Твоя вера спасла тебя».[a] И с того часа женщина исцелилась.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твоя вера исцелила тебя»; греческий глагол может означать «спасать», «исцелять» или «делать здоровым».'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: обернувшись
  rationale: Деепричастие естественно передаёт предшествующее или сопутствующее действие и не уточняет направление сверх греческого текста.
- source_word: ἰδὼν
  choice: увидев
  rationale: Деепричастная форма сохраняет связь двух греческих причастий и естественно звучит по-русски.
- source_word: Θάρσει
  choice: Ободрись
  rationale: Передаёт призыв обрести мужество и уверенность; это современное и понятное обращение без добавочной интерпретации.
- source_word: θύγατερ
  choice: дочь
  rationale: Сохраняет буквальное родственное обращение и его оттенок теплоты, не добавляя слова «дорогая».
- source_word: πίστις
  choice: вера
  rationale: Основное русское соответствие в данном контексте; подразумевается доверие Иисусу, но слово «вера» сохраняет более широкий смысл.
- source_word: σέσωκέν σε
  choice: спасла тебя
  rationale: Греческое σῴζω может обозначать спасение, исцеление или восстановление. «Спасла» сохраняет широту слов Иисуса, тогда как последующая фраза прямо указывает на телесное исцеление.
- source_word: ἐσώθη
  choice: исцелилась
  rationale: В повествовательном заключении контекст прямо описывает прекращение болезни, поэтому «исцелилась» ясно передаёт конкретный результат.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: с того часа
  rationale: Близко передаёт временное выражение оригинала и сохраняет его торжественный библейский оттенок, оставаясь понятным современному читателю.
- source_word: γυνή
  choice: женщина
  rationale: Обычное контекстуальное соответствие, отсылающее к ранее упомянутой женщине.
theological_decisions:
- issue: Передача πίστις
  choice: вера
  alternative: доверие
  rationale: «Вера» сохраняет устойчивое богословское и лексическое значение термина, тогда как «доверие» выражает возможный контекстуальный оттенок, но несколько сужает его.
- issue: Передача σῴζω в прямой речи и повествовательном заключении
  choice: «спасла тебя» в словах Иисуса; «исцелилась» в заключении рассказчика
  alternative: «исцелила тебя» / «исцелилась» либо «сделала тебя здоровой» в обоих случаях
  rationale: 'Разные русские соответствия сохраняют смысловое напряжение оригинала: слова Иисуса допускают более широкий спасительный смысл, а заключение рассказчика называет непосредственный телесный результат.'
translation_notes:
  register: Современный литературный русский язык с достоинством и лёгкой библейской торжественностью. Синтаксис остаётся близким к греческой последовательности, но естественен для русского читателя. Местоимение «её» пишется со строчной буквы по обычной современной норме.
