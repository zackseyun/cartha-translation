  source_fidelity: 'Перевод точно передаёт структуру и смысл греческого текста: деепричастие «Увидев» отражает Ἰδών, «сжалился над ними» — ἐσπλαγχνίσθη περὶ αὐτῶν, а причинный союз «потому что» — ὅτι. «Измучены и повержены» сохраняет два различных образа ἐσκυλμένοι и ἐρριμμένοι, не сводя второй к одному лишь толковательному значению «беспомощны». Сравнение с овцами без пастуха передано полно и естественно.'
