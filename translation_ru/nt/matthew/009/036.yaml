  text: Ἰδὼν δὲ τοὺς ὄχλους ἐσπλαγχνίσθη περὶ αὐτῶν ὅτι ἦσαν ἐσκυλμένοι καὶ ἐρριμμένοι ⸀ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/036.yaml
  text: And when he saw the crowds[a], he had compassion on them, because they were harassed and cast down, like sheep without a shepherd.
translation:
  language: ru
  text: Увидев толпы, Он сжалился над ними, потому что они были измучены и повержены[a], словно овцы без пастуха.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «измучены и беспомощны». Греческие слова могут также пониматься более описательно: люди были изнурены и не могли сами о себе позаботиться.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ τοὺς ὄχλους
  choice: Увидев толпы
  rationale: Аористное причастие естественно передаётся русским деепричастием. δέ здесь служит слабой повествовательной связкой и не требует отдельного перевода союзом.
- source_word: ἐσπλαγχνίσθη περὶ αὐτῶν
  choice: Он сжалился над ними
  rationale: Глагол выражает глубокое сострадание; «сжалился» ясно и естественно передаёт его эмоциональную силу в современном литературном русском.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит причину сострадания Иисуса.
- source_word: ἐσκυλμένοι
  choice: измучены
  rationale: Причастие может описывать людей, которых тревожили, притесняли или довели до изнеможения. «Измучены» сохраняет широту значения и естественно сочетается с пастушеским образом.
- source_word: καὶ ἐρριμμένοι
  choice: и повержены
  rationale: Причастие от ῥίπτω буквально связано с бросанием или падением. «Повержены» сохраняет образ людей, оказавшихся в тяжёлом, подавленном состоянии, не сводя смысл только к беспомощности.
- source_word: ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα
  choice: словно овцы без пастуха
  rationale: «Словно» естественно вводит сравнение, а краткая конструкция «без пастуха» точно и ясно передаёт причастный оборот.
theological_decisions:
- issue: Передача сострадания Иисуса
  choice: Он сжалился над ними
  alternative: Он проникся к ним состраданием
  rationale: Выбранная формулировка передаёт глубокую жалость Иисуса без архаизации и без добавления богословского толкования.
- issue: Описание состояния толп
  choice: измучены и повержены
  alternative: измучены и беспомощны
  rationale: 'Основной текст сохраняет конкретную образность двух греческих причастий: люди изнурены и словно брошены наземь. Более толковательный смысл беспомощности отмечен в сноске, чтобы не устранять подлинную лексическую неоднозначность.'
translation_notes:
  register: Современный литературный русский, понятный широкой аудитории. Сохранены пастушеский образ и телесно-пространственная выразительность греческих причастий; местоимение «Он» оформлено с прописной буквы по устойчивой русской библейской норме.
