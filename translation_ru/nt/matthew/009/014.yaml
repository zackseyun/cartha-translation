id: MAT.9.14
reference: Matthew 9:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τότε προσέρχονται αὐτῷ οἱ μαθηταὶ Ἰωάννου λέγοντες· Διὰ τί ἡμεῖς καὶ οἱ Φαρισαῖοι νηστεύομεν ⸀πολλά, οἱ δὲ μαθηταί σου οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/014.yaml
  text: Then John's disciples came to him[a], saying, “Why do we and the Pharisees fast often, but your disciples do not fast?”
translation:
  language: ru
  text: 'Тогда к Нему подошли ученики Иоанна и спросили: «Почему мы и фарисеи часто постимся[a], а Твои ученики не постятся?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «много постимся»; греческое слово πολλά при глаголе «поститься» выражает частую или многократную практику.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественный временной маркер, вводящий следующее событие в повествовании.
- source_word: προσέρχονται αὐτῷ
  choice: к Нему подошли
  rationale: Передаёт движение к Иисусу и идиоматично звучит в современном русском повествовании.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: ученики Иоанна
  rationale: Естественно передаёт греческую конструкцию с родительным падежом.
- source_word: λέγοντες
  choice: и спросили
  rationale: В данном контексте причастие вводит прямой вопрос; русская сочинительная конструкция звучит естественнее буквального «говоря».
- source_word: Διὰ τί
  choice: Почему
  rationale: Прямой и естественный эквивалент вопроса о причине.
- source_word: ἡμεῖς καὶ οἱ Φαρισαῖοι
  choice: мы и фарисеи
  rationale: Сохраняет подчёркнутое местоимение первого лица и сопоставление двух групп.
- source_word: νηστεύομεν
  choice: постимся
  rationale: Стандартный русский термин для религиозного воздержания от пищи.
- source_word: πολλά
  choice: часто
  rationale: При глаголе νηστεύω слово употреблено наречно и указывает на повторяемость или частоту поста.
- source_word: οἱ δὲ μαθηταί σου
  choice: а Твои ученики
  rationale: Союз «а» естественно выражает сопоставительный контраст δέ без излишне резкого противопоставления.
- source_word: οὐ νηστεύουσιν
  choice: не постятся
  rationale: Настоящее время передаёт обычную практику, а не обязательно действие лишь в данный момент.
theological_decisions:
- issue: Характер вопроса о посте
  choice: Передать сравнение обычной религиозной практики двух групп с практикой учеников Иисуса.
  alternative: Истолковать вопрос как прямое обвинение учеников в нарушении обязательного предписания либо как указание на один конкретный день поста.
  rationale: Настоящее время глаголов и наречное πολλά указывают на повторяющуюся практику; текст сам по себе не определяет, был ли пост обязательным, и не ограничивает вопрос одним случаем.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Заглавные местоимения «Нему», «Твои» применены как традиционная русская орфографическая форма почтительного указания на Иисуса; смысловой неоднозначности это не добавляет.
