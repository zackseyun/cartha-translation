  text: ὅτε δὲ ἐξεβλήθη ὁ ὄχλος, εἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆς, καὶ ἠγέρθη τὸ κοράσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/025.yaml
  text: But when the crowd had been put outside[a], he went in and took her by the hand, and the girl rose.
translation:
  language: ru
  text: Когда же толпу вывели, Он вошёл, взял девочку за руку, и она встала[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «девочка была воскрешена». Греческая форма допускает как значение «встала», так и страдательное значение «была поднята»; в данном контексте последнее может передавать воскресительную окраску.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Когда же
  rationale: ὅτε вводит временное придаточное, а δέ обозначает мягкий повествовательный переход; сочетание «когда же» естественно передаёт обе функции.
- source_word: ἐξεβλήθη ὁ ὄχλος
  choice: толпу удалили
  rationale: Аорист страдательного залога от ἐκβάλλω здесь означает, что присутствующих вывели наружу. Неопределённо-личная русская конструкция сохраняет неуказанного деятеля и избегает неуместного оттенка изгнания бесов.
- source_word: εἰσελθὼν
  choice: Он вошёл
  rationale: Аористное причастие передаёт действие, предшествующее следующему действию; личная форма звучит естественно в современном русском повествовании.
- source_word: ἐκράτησεν τῆς χειρὸς αὐτῆς
  choice: взял девочку за руку
  rationale: κρατέω с родительным падежом означает «взяться, ухватиться, взять за»; русский оборот точно и естественно передаёт жест.
- source_word: ἠγέρθη
  choice: она встала
  rationale: Форма от ἐγείρω может иметь непереходное значение «встала» либо пониматься как страдательная «была поднята / воскрешена». Основной вариант естественен по-русски, а неоднозначность отмечена в сноске.
- source_word: τὸ κοράσιον
  choice: девочка
  rationale: κοράσιον обозначает девочку или юную девушку; «девочка» ясно и соответствует контексту.
theological_decisions:
- issue: Значение ἠγέρθη в рассказе о возвращении девочки к жизни
  choice: она встала
  alternative: девочка была воскрешена
  rationale: Основной перевод не уточняет деятеля сверх непосредственной сцены и естественно описывает результат. Сноска сохраняет возможное страдательное понимание греческой формы и её воскресительную окраску.
translation_notes:
  register: Современный литературный русский язык; краткий, ясный и достойный повествовательный стиль. Местоимение «Он» написано с прописной буквы в соответствии с принятой русской библейской традицией, без добавления имени, отсутствующего в данном стихе.
