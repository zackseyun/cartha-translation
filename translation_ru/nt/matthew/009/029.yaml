id: MAT.9.29
reference: Matthew 9:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τότε ἥψατο τῶν ὀφθαλμῶν αὐτῶν λέγων· Κατὰ τὴν πίστιν ὑμῶν γενηθήτω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/029.yaml
  text: Then he touched their eyes[a], saying, “According to your faith, let it be done for you.”
translation:
  language: ru
  text: 'Тогда он коснулся их глаз и сказал: «Да будет вам по вашей вере[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по вашему доверию». Греческое слово πίστις может означать «веру», «доверие», а в некоторых контекстах — «верность».'
    reason: 'Лексическая альтернатива: в данном контексте πίστις указывает на уверенность этих людей в способности Иисуса исцелить их.'
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Наречие обозначает следующий момент в повествовании; «тогда» кратко и естественно передаёт последовательность событий.
- source_word: ἥψατο
  choice: коснулся
  rationale: Средняя форма ἅπτω здесь обозначает физическое прикосновение; простой русский эквивалент не добавляет к тексту жеста возложения рук.
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: их глаз
  rationale: Родительный падеж при ἅπτομαι обозначает предмет прикосновения; в русском управление глагола «коснуться» также требует родительного падежа.
- source_word: λέγων
  choice: и сказал
  rationale: Причастие обозначает речь, сопровождающую действие. Сочинительная конструкция звучит по-русски естественнее буквального «говоря» и сохраняет последовательность сцены.
- source_word: Κατὰ τὴν πίστιν ὑμῶν
  choice: по вашей вере
  rationale: κατά с винительным выражает соответствие или меру. Традиционное и понятное «по вашей вере» не усиливает эту связь до прямой причинности.
- source_word: γενηθήτω ὑμῖν
  choice: да будет вам
  rationale: Аористный пассивный императив передаёт действенное повелительное изречение. Формула «да будет вам» сохраняет его силу, пассивную неопределённость и возвышенный, но понятный регистр.
theological_decisions:
- issue: Значение πίστις в изречении об исцелении
  choice: вера
  alternative: доверие
  rationale: В ближайшем контексте речь идёт о доверии слепых способности Иисуса исцелить их, однако «вера» остаётся точным, общеупотребительным библейским соответствием πίστις. Возможное значение «доверие» отмечено в сноске, без превращения веры в заслугу или механическую причину исцеления.
- issue: Связь веры с совершившимся исцелением
  choice: по вашей вере
  alternative: на основании вашей веры
  rationale: Греческое κατά выражает соответствие или меру и не требует более сильного причинного толкования. Перевод сохраняет богословское напряжение, не представляя веру ни заслугой, ни исключительно субъективным чувством.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной формулой «да будет вам», уместной для действенного изречения Иисуса. Местоимение «он» дано со строчной буквы в соответствии с обычной современной русской орфографией; синтаксис упрощён до естественной повествовательной конструкции без потери смысла греческого причастия.
