  source_fidelity: Перевод точно передаёт последовательность τότε, физическое прикосновение ἥψατο к глазам, а также изречение Κατὰ τὴν πίστιν ὑμῶν γενηθήτω ὑμῖν. Формула «Да будет вам по вашей вере» хорошо сохраняет соответствующий, а не чрезмерно причинный оттенок κατά и побудительно-действенную форму γενηθήτω.
  naturalness: Текст звучит естественно в современном литературном русском. «Коснулся их глаз и сказал» — нормальная повествовательная конструкция; умеренно возвышенное «Да будет вам» уместно для речи Иисуса и не воспринимается как искусственная архаизация.
