base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/010.yaml
  text: And as he was reclining at table in the house[a], behold[b], many tax collectors and sinners came and were reclining at table with Jesus and his disciples.
translation:
  language: ru
  text: И вот, когда Иисус возлежал за столом в доме[a], пришли многие сборщики налогов и грешники и возлегли за столом с Иисусом и его учениками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более привычно: «когда Иисус ел в доме». В греческом тексте буквально говорится о возлежании за столом — обычной в то время позе во время трапезы. В этом стихе не уточняется, кому принадлежал дом.'
    reason: lexical_alternative_and_ambiguity
lexical_decisions:
- source_word: Καὶ ἐγένετο αὐτοῦ ἀνακειμένου
  choice: Когда Иисус возлежал за столом
  rationale: Греческая конструкция служит повествовательным переходом и задаёт обстоятельство времени. Имя «Иисус» естественно проясняет местоименную отсылку по-русски, а «возлежал за столом» сохраняет историческую позу во время трапезы.
- source_word: ἐν τῇ οἰκίᾳ
  choice: в доме
  rationale: Сохраняет определённость места, не уточняя, кому принадлежал дом, поскольку в данном стихе это прямо не сказано.
- source_word: ἰδοὺ
  choice: и вот
  rationale: Передаёт привлекающий внимание повествовательный маркер естественным и выразительным русским оборотом.
- source_word: τελῶναι
  choice: сборщики налогов
  rationale: Современное и понятное обозначение людей, собиравших налоги и пошлины; контекст сохраняет связанную с ними общественную отчуждённость.
- source_word: ἁμαρτωλοὶ
  choice: грешники
  rationale: Субстантивированное прилагательное передано обычным русским религиозно-нравственным обозначением без дополнительного истолкования.
- source_word: ἐλθόντες
  choice: пришли
  rationale: Аористное причастие естественно передано личной формой глагола как предшествующее действие в повествовательной последовательности.
- source_word: συνανέκειντο
  choice: возлегли за столом вместе с
  rationale: Передаёт как принятую во время еды позу, так и совместную трапезу; совершенный вид по-русски естественно обозначает присоединение пришедших к находившимся за столом.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: его учениками
  rationale: «Ученики» — точное и устойчивое соответствие μαθηταί, сохраняющее отношения учителя и последователей.
theological_decisions:
- issue: Поза во время трапезы и совместное застолье
  choice: Сохранить выражение «возлежал/возлегли за столом».
  alternative: «ел/ели», «обедал/обедали»
  rationale: Так остаются видимыми историческая обстановка и значимый в контексте мотив совместной трапезы, без добавления богословских выводов.
- issue: Чей это дом
  choice: Не указывать владельца дома в основном тексте.
  alternative: «в своём доме», «в доме Матфея»
  rationale: Греческий текст данного стиха говорит лишь «в доме»; конкретизация потребовала бы контекстуального вывода, которого сам стих явно не выражает.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. «Возлежал за столом» намеренно сохраняет историческую конкретность, а «сборщики налогов» предпочтено более традиционному, но менее прозрачному слову «мытари».
