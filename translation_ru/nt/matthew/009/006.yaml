  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— τότε λέγει τῷ παραλυτικῷ· ⸀Ἐγερθεὶς ἆρόν σου τὴν κλίνην καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/006.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins”—then he says to the paralytic[a], “Get up, pick up your bed[b], and go to your house.”
translation:
  language: ru
  text: 'Но чтобы вы знали, что Сын Человеческий[a] имеет власть на земле прощать грехи, — затем Он говорит парализованному человеку: «Встань, возьми свою постель[b] и иди домой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сын человека». Здесь это устойчивое самообозначение Иисуса, вероятно перекликающееся с Дан 7:13.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «лежанку». Греческое слово может обозначать кровать, ложе или переносную подстилку для сна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: Но чтобы вы знали
  rationale: Сохраняет лёгкое противопоставление или переход, выраженный δέ, и целевое значение ἵνα; по-русски естественно продолжает незавершённую конструкцию прямой речи.
- source_word: ἐξουσίαν ἔχει
  choice: имеет власть
  rationale: ἐξουσία здесь означает законное полномочие и право, а не только способность или силу.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Традиционная форма сохраняет устойчивое самообозначение Иисуса и вероятную отсылку к Дан 7, не сводя выражение к пояснительному пересказу.
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Естественная передача пространственной сферы действия; сохраняет возможное напряжение между землёй и божественной прерогативой.
- source_word: ἀφιέναι ἁμαρτίας
  choice: прощать грехи
  rationale: В данном контексте ἀφίημι означает прощать или отпускать грехи; выбран ясный и устойчивый русский эквивалент.
- source_word: τότε λέγει
  choice: тут Он говорит
  rationale: «Тут» отмечает внезапный переход внутри высказывания, а настоящее время сохраняет повествовательную живость исторического настоящего λέγει.
- source_word: τῷ παραλυτικῷ
  choice: парализованному
  rationale: Передаёт субстантивированное прилагательное без добавления отсутствующего в греческом существительного; форма понятна в контексте.
- source_word: Ἐγερθεὶς
  choice: Встань
  rationale: Аористное причастие в последовательности повелений имеет императивную силу; «Встань» естественно и точно передаёт команду.
- source_word: ἆρόν
  choice: возьми
  rationale: В контексте подразумевает поднять и унести; «возьми» естественно сочетается с последующим движением домой.
- source_word: κλίνην
  choice: постель
  rationale: κλίνη может обозначать кровать, ложе или переносную подстилку; «постель» достаточно широко и не навязывает конкретную конструкцию.
- source_word: ὕπαγε εἰς τὸν οἶκόν σου
  choice: иди домой
  rationale: Естественная современная передача направления к собственному дому; сохраняет смысл, не воспроизводя неидиоматичное «в свой дом».
theological_decisions:
- issue: Христологический титул ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  alternative: Человеческий Сын / Человек
  rationale: Традиционный титул сохраняет его межтекстовую и богословскую насыщенность, включая вероятный отклик Дан 7, не разрешая однозначно заложенную в выражении напряжённость.
- issue: Характер ἐξουσία при прощении грехов
  choice: власть
  alternative: сила / право
  rationale: Текст утверждает полномочие Сына Человеческого прощать грехи, а не только способность совершить исцеление; «власть» удерживает оба оттенка правомочия и действенности.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским регистром. Заглавные буквы в титуле «Сын Человеческий» сохраняют его устойчивое употребление; местоимение «Он» оформлено по традиционной русской библейской норме. Многоточие и тире передают намеренно прерванную реплику Иисуса, после которой повествователь вставляет слова «тут Он говорит».
