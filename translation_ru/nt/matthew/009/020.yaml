  source_fidelity: 'Текст точно передаёт все основные элементы греческого оригинала: повествовательное «Καὶ ἰδού», длительное кровотечение в течение двенадцати лет, приближение сзади, прикосновение и γενитивную конструкцию «к краю Его одежды». «Краю» — допустимое нейтральное соответствие κράσπεδον; сноска надлежащим образом сохраняет возможность значений «бахрома» и «кисть».'
  naturalness: Фраза звучит естественно на современном литературном русском. Причастный оборот «двенадцать лет страдавшая кровотечением» ясен и не архаичен. «Подошла сзади» грамматически и контекстуально понятно; добавление «к Нему» было бы возможно, но не необходимо.
  terminology: «Кровотечение» точно и нейтрально передаёт αἱμορροοῦσα без неоправданной медицинской конкретизации. «Одежда» не сужает значение ἱμάτιον. Сноска корректно отмечает лексическую неопределённость κράσπεδον и осторожно связывает её с Чис. 15:38 и Втор. 22:12, не превращая возможную культурную аллюзию в утверждение основного текста.
