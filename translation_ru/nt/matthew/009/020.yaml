source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ γυνὴ αἱμορροοῦσα δώδεκα ἔτη προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/020.yaml
  text: And behold[b][a], a woman who had been suffering from bleeding for twelve years came up behind him and touched the fringe of his garment.
translation:
  language: ru
  text: И вот, женщина, двенадцать лет страдавшая кровотечением, подошла сзади и прикоснулась к краю[a] Его одежды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бахроме» или «кисти». Греческое слово может обозначать край одежды, в том числе кисть или бахрому, связанную с предписаниями Чис. 15:38 и Втор. 22:12.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: И вот
  rationale: Сохраняет связующую роль καί и яркий повествовательный маркер ἰδού, оставаясь естественным для современного русского языка.
- source_word: γυνὴ αἱμορροοῦσα δώδεκα ἔτη
  choice: женщина, двенадцать лет страдавшая кровотечением
  rationale: Передаёт длительное патологическое кровотечение и винительный продолжительности времени без оттенка острого внезапного приступа.
- source_word: προσελθοῦσα ὄπισθεν
  choice: подошла сзади
  rationale: Естественно передаёт приближение женщины к Иисусу со спины; русский контекст не требует добавлять местоименное дополнение.
- source_word: ἥψατο
  choice: прикоснулась
  rationale: Точно передаёт значение краткого физического касания в данном контексте, не усиливая его до хватания.
- source_word: τοῦ κρασπέδου
  choice: к краю
  rationale: κράσπεδον допускает значения края, каймы, бахромы или кисти одежды. Нейтральное «край» сохраняет предметную ясность, а возможное указание на кисть или бахрому отражено в сноске.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: Его одежды
  rationale: «Одежда» сохраняет общее значение ἱμάτιον и не конкретизирует без необходимости вид верхней одежды.
theological_decisions:
- issue: Возможная связь κράσπεδον с предписанными Законом кистями на краях одежды
  choice: В основном тексте употреблено нейтральное «край», а возможное значение «кисть» или «бахрома» вынесено в сноску.
  alternative: Передать κράσπεδον как «кисть», прямо выдвинув на первый план связь с Числами 15:38 и Второзаконием 22:12.
  rationale: Греческое слово допускает как общее обозначение края одежды, так и более конкретное указание на кисть или бахрому. Сам стих не раскрывает символическое значение, поэтому перевод не должен устранять лексическую неоднозначность или усиливать аллюзию.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. «И вот» сохраняет живость оригинала; медицинское «кровотечение» понятно современному читателю и не звучит архаично.
