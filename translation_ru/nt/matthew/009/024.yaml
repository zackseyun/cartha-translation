  text: ⸀ἔλεγεν· Ἀναχωρεῖτε, οὐ γὰρ ἀπέθανεν τὸ κοράσιον ἀλλὰ καθεύδει· καὶ κατεγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/024.yaml
  text: He was saying[a], “Go away, for the girl has not died, but is sleeping.” And they were laughing at him.
translation:
  language: ru
  text: 'Он говорил: «Уйдите, ведь девочка не умерла, а спит». А они смеялись над Ним.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «насмехались над Ним». Греческий глагол обозначает смех, выражающий насмешку.'
    reason: Лексическая альтернатива уточняет заложенный в глаголе оттенок осмеяния.
lexical_decisions:
- source_word: ἔλεγεν
  choice: Он говорил
  rationale: Имперфект передаёт продолжавшуюся или повторявшуюся речь; русское «говорил» естественно сохраняет этот видовой оттенок.
- source_word: Ἀναχωρεῖτε
  choice: Уйдите
  rationale: Повелительное наклонение во множественном числе обращено к присутствующим и требует, чтобы они удалились; «уйдите» звучит естественно и достаточно прямо.
- source_word: οὐ γὰρ ἀπέθανεν
  choice: ведь девочка не умерла
  rationale: Частица γάρ объясняет предшествующее повеление, а аорист ἀπέθανεν представляет смерть как событие; «ведь… не умерла» точно и естественно передаёт эту связь.
- source_word: τὸ κοράσιον
  choice: девочка
  rationale: κοράσιον обозначает девочку или юную девушку; по контексту «девочка» — наиболее естественный современный русский эквивалент.
- source_word: ἀλλὰ καθεύδει
  choice: а спит
  rationale: Настоящее время сохраняет непосредственное противопоставление смерти и сна без истолковывающего добавления «только».
- source_word: κατεγέλων αὐτοῦ
  choice: они смеялись над Ним
  rationale: Глагол обозначает насмешливый смех над кем-либо; имперфект передан формой несовершенного вида «смеялись», а буквальный образ смеха сохранён.
theological_decisions:
- issue: Слова Иисуса о том, что девочка не умерла, а спит
  choice: Сохранить буквальное «не умерла, а спит» без поясняющих добавлений.
  alternative: «Она только спит» или явное пояснение, что сон является образом смерти.
  rationale: Греческий текст оставляет вызывающее напряжение между смертью и сном и сам не разъясняет характер высказывания. Перевод не должен заранее разрешать эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык; речь краткая, прямая и достойная. Союз «ведь» естественно передаёт объяснительное γάρ. Местоимение «Ним» написано с прописной буквы в соответствии с традиционным уважительным оформлением речи об Иисусе.
