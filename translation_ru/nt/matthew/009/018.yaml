source:
  edition: SBLGNT
  text: Ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς ἰδοὺ ἄρχων εἷς ⸀ἐλθὼν προσεκύνει αὐτῷ λέγων ὅτι Ἡ θυγάτηρ μου ἄρτι ἐτελεύτησεν· ἀλλὰ ἐλθὼν ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν, καὶ ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/018.yaml
  text: While he was saying these things to them, look, a ruler came and bowed down before him, saying, “My daughter has just died. But come and lay your hand on her, and she will live.”
translation:
  language: ru
  text: 'Когда Он ещё говорил им всё это, и вот, пришёл некий начальник, поклонился Ему и сказал: «Моя дочь только что умерла. Но приди, возложи на неё руку — и она будет жить».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: вот
  rationale: Сохраняет повествовательный сигнал, привлекающий внимание, и естественно звучит в современном русском тексте.
- source_word: ἄρχων
  choice: начальник
  rationale: Передаёт общий статус руководителя без добавления отсутствующего в данном стихе уточнения о синагоге.
- source_word: προσεκύνει
  choice: поклонившись
  rationale: Передаёт жест глубокого почтения, не предрешая сам по себе, следует ли понимать его как религиозное поклонение.
- source_word: ἄρτι ἐτελεύτησεν
  choice: только что умерла
  rationale: Прямо и естественно передаёт сообщение о недавней смерти.
- source_word: ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν
  choice: возложи на неё руку
  rationale: Сохраняет единственное число и традиционно понятный жест возложения руки.
- source_word: ζήσεται
  choice: будет жить
  rationale: Сохраняет уверенное будущее время исходного текста.
theological_decisions:
- issue: Значение προσεκύνει
  choice: поклонившись Ему
  alternative: поклоняясь Ему
  rationale: Глагол допускает как почтительный земной поклон, так и поклонение; контекст не требует устранять эту смысловую широту в пользу более узкого богословского прочтения.
- issue: Статус ἄρχων
  choice: один начальник
  alternative: начальник синагоги
  rationale: Матфей в этом стихе не называет учреждение, которым он руководил; конкретизацию лучше не вносить из параллельных повествований.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской торжественностью. Инверсия сведена к минимуму; «вот» сохранено как выразительный повествовательный указатель. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно принятому русскому библейскому регистру.
