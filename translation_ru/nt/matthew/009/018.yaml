  source_fidelity: 'Смысл передан точно: речь продолжается, приходит правитель, оказывает Иисусу жест почтения и просит возложить руку на недавно умершую дочь. Однако «это» несколько сглаживает множественное Ταῦτα («это всё/эти слова»), а «подошёл» уже, чем ἐλθών («придя/пришёл»).'
  naturalness: Текст в целом литературен, но сочетание «вот, подошёл один начальник» звучит несколько калькированно. «И вот, пришёл некий начальник» естественнее для современного литературного русского при сохранении повествовательного сигнала ἰδού и неопределённости εἷς.
  terminology: '«Начальник» допустимо передаёт ἄρχων без не подтверждаемой в данном стихе конкретизации. «Поклонился Ему» сохраняет смысловую широту προσεκύνει: жест почтения не истолковывается заранее как исключительно богослужебное поклонение. «Возложи на неё руку» и «будет жить» точны.'
