id: MAT.9.13
reference: Matthew 9:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πορευθέντες δὲ μάθετε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν· οὐ γὰρ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/013.yaml
  text: 'But go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous[c][b][a], but sinners.'
translation:
  language: ru
  text: 'Пойдите же и узнайте, что значит: «Милости хочу, а не жертвы».[a] Ведь Я пришёл призвать не праведников, а грешников.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Цитата из Осии 6:6.
    reason: cross_reference
  - marker: b
    text: 'Возможно, имеются в виду те, кто считает себя праведным; по-гречески буквально: «праведников».'
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες δὲ μάθετε
  choice: Пойдите же и узнайте
  rationale: Причастие аориста вместе с повелительным μάθετε образует идиоматический призыв; такая передача естественна по-русски и сохраняет наставительно-обличительный тон.
- source_word: τί ἐστιν
  choice: что значит
  rationale: В данном контексте выражение требует понять смысл следующей цитаты; буквальное «что это» возможно, но менее естественно.
- source_word: Ἔλεος
  choice: милости
  rationale: «Милость» сохраняет этический и заветный оттенок цитаты из Осии и соответствует традиционно узнаваемому библейскому словоупотреблению.
- source_word: θέλω
  choice: хочу
  rationale: Прямая и точная передача волеизъявления; в составе узнаваемой цитаты звучит естественно и достойно.
- source_word: θυσίαν
  choice: жертвы
  rationale: Прямой эквивалент, сохраняющий единственное число и культовый смысл пророческого противопоставления.
- source_word: οὐ γὰρ ἦλθον καλέσαι
  choice: Ведь Я пришёл призвать не
  rationale: Передаёт объяснительное γὰρ, аорист ἦλθον как указание на миссию Иисуса и широкий смысл καλέσαι — призвать.
- source_word: δικαίους
  choice: праведников
  rationale: Субстантивированное прилагательное передано без уточнения, истинно ли эти люди праведны или лишь считают себя таковыми.
- source_word: ἁμαρτωλούς
  choice: грешников
  rationale: Стандартная передача, сохраняющая резкое противопоставление праведникам.
theological_decisions:
- issue: Смысл цитаты из Осии 6:6
  choice: Сохранить прямое противопоставление милости и жертвы
  alternative: Истолковать фразу либо как полное отрицание всяких жертв, либо как ослабленное ситуативное предпочтение
  rationale: Текст утверждает пророческий приоритет милости, но сам по себе не формулирует всеобъемлющее учение об отмене жертв.
- issue: Кого обозначают «праведники»
  choice: Оставить «праведников» без поясняющего перефразирования
  alternative: «Тех, кто считает себя праведным» или «самоправедных»
  rationale: Контекст допускает ироническое понимание, однако греческий текст прямо его не обозначает; неоднозначность следует сохранить.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным библейским регистром. «Милости хочу, а не жертвы» сохраняет лаконизм и узнаваемость цитаты; заглавное «Я» указывает на говорящего Христа согласно принятой русской библейской типографике.
