  text: And this report went out into all that region[a].
translation:
  language: ru
  text: И эта весть разошлась по всей той местности[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по всей той земле»; возможно также: «по всей той области». Греческое слово γῆ может означать землю, территорию или местность; здесь, вероятнее всего, имеется в виду окружающая область, а не вся земля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет простой повествовательный переход без добавления причинного или временного оттенка.
- source_word: ἐξῆλθεν
  choice: разошлась
  rationale: В контексте распространяющейся вести это естественный русский эквивалент буквального «вышла»; он сохраняет образ движения известия за пределы места события.
- source_word: ἡ φήμη αὕτη
  choice: весть об этом
  rationale: φήμη обозначает распространяющееся известие и не подразумевает его недостоверности, как могло бы современное слово «слух». Оборот «об этом» естественно отсылает ко всему только что описанному событию.
- source_word: εἰς ὅλην τὴν γῆν ἐκείνην
  choice: по всей той местности
  rationale: В данном локальном контексте γῆ означает окружающую территорию, а не всю землю; предлог «по» естественно передаёт распространение вести по всей местности.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткий повествовательный стих передан естественно и достойно. «Весть» избегает оттенка недостоверности, присущего слову «слух», а «местность» сохраняет локальный географический масштаб.
