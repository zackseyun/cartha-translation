  yaml_path: translation/nt/matthew/009/004.yaml
  text: And Jesus[a], knowing their thoughts, said, “Why are you thinking evil in your hearts?”
translation:
  language: ru
  text: 'Иисус, зная их мысли, сказал: «Почему вы помышляете злое в своих сердцах?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδὼς
  choice: зная
  rationale: Причастие передаёт осведомлённость Иисуса об их внутренних размышлениях; «зная» естественно и точно выражает это без дополнительного истолкования.
- source_word: ἐνθυμήσεις
  choice: мысли
  rationale: Существительное обозначает внутренние размышления или рассуждения; «мысли» — ясный и современный русский эквивалент.
- source_word: Ἱνατί
  choice: почему
  rationale: Вопросительное слово запрашивает причину или мотив; «почему» точно и естественно передаёт его значение.
- source_word: ἐνθυμεῖσθε
  choice: мыслите
  rationale: Глагол означает внутренне обдумывать или помышлять. «Мыслите» сохраняет смысловую связь с существительным «мысли» и хорошо сочетается с выражением «в сердцах».
- source_word: πονηρὰ
  choice: злое
  rationale: Субстантивированное прилагательное среднего рода множественного числа обозначает зло в их помыслах; русское собирательное «злое» сохраняет некоторую недосказанность исходного текста и не добавляет существительного.
- source_word: καρδίαις
  choice: сердцах
  rationale: «Сердца» сохраняют исходную библейскую метафору внутреннего человека, включая мысли и намерения, не сводя её только к разуму.
theological_decisions:
- issue: Осведомлённость Иисуса о невысказанных мыслях
  choice: Иисус, зная их мысли
  alternative: Иисус, распознав их мысли
  rationale: Текст утверждает знание Иисусом их внутренних размышлений, но не объясняет способ этого знания. Формулировка сохраняет христологическую значимость и не развивает её в отдельное доктринальное утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок фразы естественен для русского; метафора сердца сохранена. Маркеры сносок не использованы, поскольку выбранный вариант не требует пояснения.
