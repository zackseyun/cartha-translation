id: MAT.9.15
reference: Matthew 9:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ’ ὅσον μετ’ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/015.yaml
  text: And Jesus said to them[a], “The wedding attendants cannot mourn as long as the bridegroom is with them, can they? But days will come when the bridegroom is taken away from them[b], and then they will fast.”
translation:
  language: ru
  text: 'Иисус сказал им: «Разве могут друзья жениха скорбеть, пока жених с ними? Но придут дни, когда жених будет у них отнят[a], и тогда они будут поститься».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет удалён от них». Пассивная форма подразумевает не просто обычный уход.'
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τοῦ νυμφῶνος
  choice: друзья жениха
  rationale: Буквально «сыновья брачного чертога» — семитский оборот, обозначающий спутников жениха, участвующих в свадебном торжестве. «Друзья жениха» естественно передаёт эту роль по-русски и не создаёт неясного образа помещения.
- source_word: πενθεῖν
  choice: скорбеть
  rationale: Глагол означает скорбеть, горевать или оплакивать; «скорбеть» сохраняет смысловой контраст между свадебной радостью и постом.
- source_word: ἐφ’ ὅσον
  choice: пока
  rationale: 'Естественно и точно передаёт временную продолжительность: всё то время, когда жених находится с ними.'
- source_word: νυμφίος
  choice: жених
  rationale: Обычное современное русское обозначение жениха, сохраняющее свадебную метафору без истолковывающего расширения.
- source_word: ἀπαρθῇ
  choice: будет у них отнят
  rationale: Пассивная форма указывает не просто на уход, а на удаление жениха; «будет отнят» сохраняет возможный оттенок насильственного лишения и не поясняет его сверх текста.
- source_word: νηστεύσουσιν
  choice: будут поститься
  rationale: Прямая и естественная передача будущего времени глагола «поститься».
- source_word: Μὴ δύνανται ... ;
  choice: Разве могут ...?
  rationale: 'Вопрос с μή предполагает отрицательный ответ. Русская конструкция с «разве» естественно передаёт риторическую силу: не могут.'
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Но придут дни
  rationale: Точно воспроизводит обычный греческий оборот о будущем времени и сохраняет лёгкое противопоставление, выраженное δέ.
theological_decisions:
- issue: Возможное христологическое значение образа жениха
  choice: Сохранить образ «жениха» без прямого пояснения, что он обозначает Иисуса как мессианского жениха.
  alternative: Добавить истолковывающее указание на мессианскую роль Иисуса.
  rationale: Сам ответ Иисуса позволяет понять, с кем соотнесён образ, однако перевод не должен привносить богословское толкование, прямо не сформулированное в стихе.
- issue: Смысл пассивной формы ἀπαρθῇ
  choice: Передать как «будет у них отнят», сохранив оттенок внешнего или насильственного удаления.
  alternative: Передать нейтрально как «уйдёт от них» или «не будет с ними».
  rationale: Нейтральный «уход» ослабил бы грамматически выраженную пассивность и возможное предвосхищение смерти Иисуса; при этом перевод не уточняет, кем и каким образом жених будет отнят.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Идиома υἱοὶ τοῦ νυμφῶνος передана функционально как «друзья жениха»; буквальная калька была бы неестественной и неясной. Риторический вопрос сохранён посредством «разве». Единственная сноска отмечает значимую неоднозначность ἀπαρθῇ.
