  text: καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν τοῦ ἄρχοντος καὶ ἰδὼν τοὺς αὐλητὰς καὶ τὸν ὄχλον θορυβούμενον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/023.yaml
  text: And when Jesus came into the ruler's house and saw the flute players and the crowd making a commotion[c][b][a],
translation:
  language: ru
  text: Когда Иисус пришёл в дом начальника[a] и увидел флейтистов[b] и толпу, поднявшую шум[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «правителя»; согласно параллельным повествованиям — «начальника синагоги». Здесь Матфей называет его просто «начальником».'
    reason: alternative_reading
  - marker: b
    text: 'То есть музыкантов, участвовавших в траурном плаче: игра на флейтах была частью погребальных обычаев.'
    reason: cultural_note
  - marker: c
    text: 'Или: «толпу, находившуюся в смятении».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: когда Иисус пришёл
  rationale: Аористное причастие передано естественной русской временной конструкцией, сохраняющей последовательность событий.
- source_word: οἰκίαν
  choice: дом
  rationale: Прямое и контекстуально уместное соответствие, без дополнительного оттенка, который могло бы вносить слово «жилище».
- source_word: ἄρχοντος
  choice: правителя
  rationale: Сохраняет общее обозначение лица, наделённого властью, не добавляя взятого из параллельных повествований уточнения о синагоге.
- source_word: ἰδὼν
  choice: увидел
  rationale: Простая и естественная передача повествовательного причастия.
- source_word: αὐλητὰς
  choice: флейтистов
  rationale: Точно обозначает музыкантов, игравших на духовых инструментах типа флейты; культурный контекст погребального плача раскрыт в сноске.
- source_word: ὄχλον
  choice: толпу
  rationale: Обычное современное соответствие для ὄχλος в повествовательном контексте.
- source_word: θορυβούμενον
  choice: шумящую
  rationale: Передаёт продолжающийся громкий шум и смятение, не уточняя сверх текста характер выражаемых чувств.
theological_decisions:
- issue: Кем был хозяин дома
  choice: правителя
  alternative: начальника; начальника синагоги
  rationale: У Матфея употреблено широкое слово ἄρχων. Основной текст не следует искусственно согласовывать с более конкретным обозначением в параллельных рассказах.
translation_notes:
  register: Современный литературный русский язык с естественным синтаксисом и сдержанно-достоинным повествовательным тоном. Причастные конструкции оригинала переданы придаточным времени и однородным сказуемым. Все три примечания поставлены непосредственно после соответствующих слов, а не собраны в конце стиха.
