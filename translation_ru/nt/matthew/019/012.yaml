source:
  edition: SBLGNT
  text: εἰσὶν γὰρ εὐνοῦχοι οἵτινες ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνούχισαν ἑαυτοὺς διὰ τὴν βασιλείαν τῶν οὐρανῶν. ὁ δυνάμενος χωρεῖν χωρείτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/012.yaml
  text: For there are eunuchs who were born that way from their mother’s womb[a], and there are eunuchs who were made eunuchs by men, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of heaven[b]. The one able to accept this should accept it.
translation:
  language: ru
  text: Ведь есть евнухи, которые из материнской утробы родились такими; есть евнухи, которых люди сделали евнухами; и есть евнухи, которые сделали себя евнухами ради Царства Небесного[a]. Кто способен это принять, пусть примет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оскопили себя»; многие понимают эти слова образно — как добровольный отказ от брака ради Царства Небесного.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Кто может это вместить, пусть вместит».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχοι
  choice: евнухи
  rationale: Прямой русский эквивалент сохраняет повтор греческого слова во всех трёх категориях и не подменяет его толкованием «безбрачные».
- source_word: ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως
  choice: такими родились из утробы матери
  rationale: Передаёт яркий греческий оборот и значение врождённого состояния естественным современным русским языком.
- source_word: εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων
  choice: которых сделали евнухами люди
  rationale: Сохраняет словесную связь с существительным «евнухи» и пассивную конструкцию, не сужая выражение до анатомически более явного «оскопили».
- source_word: εὐνούχισαν ἑαυτοὺς
  choice: сами сделали себя евнухами
  rationale: Прямо передаёт провокационную формулировку оригинала, не решая в основном тексте, буквальна она или образна.
- source_word: διὰ τὴν βασιλείαν τῶν οὐρανῶν
  choice: ради Небесного Царства
  rationale: «Ради» ясно выражает цель или мотив; традиционное и понятное сочетание «Небесное Царство» соответствует формуле Матфея.
- source_word: ὁ δυνάμενος χωρεῖν χωρείτω
  choice: Кто способен это принять, пусть примет
  rationale: «Принять» естественно передаёт идиоматическое значение χωρέω как готовности вместить и усвоить трудное наставление, сохраняя повелительную силу заключения.
theological_decisions:
- issue: Буквальное или образное понимание εὐνούχισαν ἑαυτοὺς
  choice: В основном тексте сохранено буквальное лексическое выражение «сами сделали себя евнухами».
  alternative: «оскопили себя» или образное «отказались от брака / избрали безбрачие»
  rationale: Сам стих не разъясняет, следует ли понимать третью категорию буквально, гиперболически или как образ добровольного безбрачия. Перевод сохраняет эту напряжённость, а примечание сообщает основную альтернативу.
- issue: Смысл заключительного χωρεῖν
  choice: «принять»
  alternative: «вместить»
  rationale: «Принять» понятно современному читателю и передаёт готовность принять трудное слово; более буквальный вариант сохранён в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизации. Лексический повтор «евнухи / сделали евнухами» намеренно сохранён. Маркеры примечаний помещены непосредственно после тех выражений, к которым относятся.
