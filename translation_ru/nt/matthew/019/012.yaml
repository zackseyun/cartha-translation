  verdict: revise
  source_fidelity: 'Смысл и трёхчастная структура греческого текста в целом переданы точно: повтор εὐνοῦχοι сохранён, пассив во второй группе и возвратное действие в третьей не сглажены, а διὰ τὴν βασιλείαν передано как мотив («ради»). Заключительное χωρεῖν обоснованно передано «принять», с лексической альтернативой в примечании. Небольшая правка улучшает порядок слов и естественность русского текста, не меняя степени буквальности.'
  naturalness: '«Которых сделали евнухами люди» понятно, но в современном литературном русском естественнее активный порядок: «которых люди сделали евнухами». В первой группе «родились такими из утробы матери» несколько тяжеловесно; «такими родились от чрева матери» звучит гладко, но «чрево» имеет оттенок высокого библейского регистра. Для современного литературного варианта предпочтено «родились такими от рождения», однако это немного ослабляет образ источника. Поэтому сохранён образ «из материнской утробы» при более естественном порядке слов.'
  terminology: «Евнухи» — точный и последовательный эквивалент εὐνοῦχοι. «Сделали себя евнухами» сохраняет намеренно неразрешённую буквальность/образность εὐνούχισαν ἑαυτούς; примечание корректно сообщает вариант «оскопили себя» и распространённое образное понимание. «Царство Небесное» соответствует устойчивой формуле Матфея и не вносит конфессионального толкования. Маркеры примечаний стоят у надлежащих выражений.
