  text: Τότε ἀποκριθεὶς ὁ Πέτρος εἶπεν αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ἠκολουθήσαμέν σοι· τί ἄρα ἔσται ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/027.yaml
  text: Then Peter answered him, “Look, we have left everything and followed you. What then will there be for us?”
translation:
  language: ru
  text: 'Тогда Пётр ответил ему: «Вот, мы оставили всё и последовали за тобой. Что же тогда будет для нас?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: сказал ... в ответ
  rationale: Естественно передаёт семитизированную греческую конструкцию «ответив, сказал», сохраняя связь реплики Петра с предшествующими словами Иисуса.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Краткое и естественное указание, привлекающее внимание к поступку учеников; соответствует значению междометия.
- source_word: ἀφήκαμεν πάντα
  choice: мы оставили всё
  rationale: Прямо передаёт совершившееся оставление всего без добавления отсутствующих в тексте уточнений.
- source_word: ἠκολουθήσαμέν σοι
  choice: последовали за тобой
  rationale: Нормальная современная русская конструкция для ученичества и буквального следования; аорист передан совершенным видом.
- source_word: τί ἄρα ἔσται ἡμῖν
  choice: Что же нам за это будет?
  rationale: Передаёт вопрос о том, что достанется ученикам вследствие названного поступка; «же» отражает ἄρα, а «за это» естественно выражает подразумеваемую связь с оставлением всего и следованием.
theological_decisions:
- issue: Характер ожидаемого Петром воздаяния
  choice: Что же нам за это будет?
  alternative: Что же будет у нас? / Что же нам достанется?
  rationale: Формулировка сохраняет открытым содержание ожидаемого результата и не уточняет, является ли он наградой, положением или иным благом; добавленное «за это» лишь делает по-русски явной контекстуальную связь, не определяя вид воздаяния.
translation_notes:
  register: Современный литературный русский язык; реплика звучит прямо и разговорно, но сохраняет достоинство библейского повествования. Местоимения, обращённые к Иисусу, даны со строчной буквы в соответствии с обычной современной издательской практикой.
