  naturalness: «Тогда Пётр ответил ему» — естественная современная русская передача ἀποκριθεὶς ... εἶπεν без тяжеловесного удвоения «сказал ... в ответ». Вопрос звучит литературно и понятно.
  terminology: Имена, местоимения и ключевые выражения переданы последовательно. «Последовали за тобой» точно передаёт ἠκολουθήσαμέν σοι и не навязывает специального богословского истолкования.
