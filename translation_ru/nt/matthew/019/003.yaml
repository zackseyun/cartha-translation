source:
  edition: SBLGNT
  text: Καὶ προσῆλθον ⸀αὐτῷ Φαρισαῖοι πειράζοντες αὐτὸν καὶ ⸀λέγοντες· Εἰ ἔξεστιν ⸀ἀνθρώπῳ ἀπολῦσαι τὴν γυναῖκα αὐτοῦ κατὰ πᾶσαν αἰτίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/003.yaml
  text: And Pharisees came up to him[a], testing him and saying, “Is it lawful for a man to divorce his wife for any cause?”
translation:
  language: ru
  text: 'К Нему подошли фарисеи и, испытывая Его, спросили: «Позволено ли мужчине разводиться со своей женой по любой причине?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на любом основании»; возможно также: «по всякой причине». Греческое выражение передаёт широкий правовой вопрос о допустимых основаниях для развода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: подошли
  rationale: Передаёт направленное приближение к человеку естественным современным русским языком.
- source_word: πειράζοντες
  choice: испытывая
  rationale: Сохраняет широкий смысл проверки или испытания и не сужает его до искушения ко греху; враждебный оттенок определяется контекстом.
- source_word: ἔξεστιν
  choice: позволено ли
  rationale: Естественно выражает вопрос о допустимости действия в рамках религиозно-правового спора.
- source_word: ἀνθρώπῳ
  choice: мужчине
  rationale: Хотя слово может обозначать человека вообще, упоминание «своей жены» конкретизирует референта как мужчину или мужа.
- source_word: ἀπολῦσαι
  choice: разводиться
  rationale: В брачном контексте глагол имеет юридический смысл расторжения брака, а не просто буквального отсылания.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: со своей женой
  rationale: В контексте развода γυνή однозначно означает жену; возвратное «своей» естественно передаёт принадлежность при русском подлежащем.
- source_word: κατὰ πᾶσαν αἰτίαν
  choice: по любой причине
  rationale: Сохраняет широкий охват вопроса о допустимых основаниях развода и звучит естественно по-русски.
theological_decisions:
- issue: Передача вопроса о разводе без внесения поздней конфессиональной позиции
  choice: «Позволено ли мужчине разводиться со своей женой по любой причине?»
  alternative: «Законно ли мужу отпустить свою жену по всякому основанию?»
  rationale: Выбранный вариант сохраняет религиозно-правовой характер вопроса и его намеренно широкий охват, но не предрешает последующий ответ Иисуса и не вводит особой доктрины о разводе.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Заглавные местоимения «Нему», «Его» употреблены как традиционный русский знак почтения к Иисусу. Причастная конструкция источника естественно передана деепричастным оборотом и глаголом речи «спросили».
