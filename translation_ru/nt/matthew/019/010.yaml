  text: Λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Εἰ οὕτως ἐστὶν ἡ αἰτία τοῦ ἀνθρώπου μετὰ τῆς γυναικός, οὐ συμφέρει γαμῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/010.yaml
  text: His disciples said to him[a], “If that is the case of a man with his wife, it is not beneficial to marry.”
translation:
  language: ru
  text: 'Ученики сказали Ему: «Если таково положение мужчины с женой, то лучше не жениться».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если так обстоит дело между мужчиной и женой». Греческое выражение кратко и допускает значения «положение», «дело» или «обстоятельство».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν αὐτῷ
  choice: сказали Ему
  rationale: Настоящее время употреблено как историческое; в русском повествовании естественно прошедшее время.
- source_word: οἱ μαθηταί
  choice: ученики
  rationale: Устоявшееся и точное евангельское обозначение учеников Иисуса.
- source_word: Εἰ οὕτως ἐστὶν ἡ αἰτία
  choice: Если таково положение
  rationale: Передаёт условную конструкцию и широкое контекстуальное значение αἰτία — «положение, обстоятельство, дело», а не буквальную причинность.
- source_word: τοῦ ἀνθρώπου μετὰ τῆς γυναικός
  choice: мужчины с женой
  rationale: Сохраняет мужской референт ἀνθρώπου и брачное значение γυναικός; притяжательное местоимение в греческом не выражено.
- source_word: οὐ συμφέρει
  choice: лучше не
  rationale: 'Естественно передаёт в данном контексте оценку целесообразности и выгоды: вступать в брак при таком положении невыгодно или нецелесообразно.'
- source_word: γαμῆσαι
  choice: жениться
  rationale: В контексте речи о мужчине русский глагол «жениться» точнее общего «вступать в брак» и сохраняет гендерную перспективу оригинала.
theological_decisions:
- issue: Гендерная конкретность выражения ἀνθρώπου ... γυναικός
  choice: мужчины с женой
  alternative: человека с супругой; мужчины с его женой
  rationale: Контекст прямо описывает брак мужчины и женщины. Перевод не нейтрализует мужской референт, но и не добавляет отсутствующее в греческом притяжательное местоимение.
- issue: Смысл οὐ συμφέρει применительно к браку
  choice: лучше не жениться
  alternative: жениться невыгодно; не стоит жениться
  rationale: Фраза выражает практическую оценку учеников, а не богословский запрет на брак. «Лучше не» естественно по-русски сохраняет сравнительно-прагматический оттенок без превращения слов в повеление.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. «Таково положение» сохраняет компактность и некоторую неоднозначность греческого ἡ αἰτία; «лучше не жениться» звучит естественнее буквального «жениться не полезно».
