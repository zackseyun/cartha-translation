  text: But many who are first will be last[a], and the last first.
translation:
  language: ru
  text: Но многие из первых будут последними, а последние — первыми.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее и короче: «Но многие первые будут последними, и последние — первыми». Греческая фраза отличается предельной краткостью и звучит как пословица.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: многие
  rationale: Субстантивированное прилагательное обозначает широкую, не уточнённую группу; «многие» передаёт это кратко и естественно.
- source_word: δὲ
  choice: но
  rationale: Частица выражает мягкое противопоставление предыдущему рассуждению о награде и положении.
- source_word: ἔσονται
  choice: станут
  rationale: В сочетании с противопоставлением «первые — последние» русский глагол «станут» естественно выражает будущую перемену положения, не конкретизируя её характер.
- source_word: πρῶτοι
  choice: первые
  rationale: Сохраняет широкое значение первенства по положению или порядку и афористическую форму высказывания.
- source_word: ἔσχατοι
  choice: последние
  rationale: Прямо передаёт антитезу к «первым», не подменяя её более узким понятием «малейшие».
- source_word: καὶ
  choice: а
  rationale: В русском параллельном противопоставлении «а» естественнее, чем буквальное «и», и ясно передаёт контраст между двумя частями изречения.
theological_decisions:
- issue: Характер провозглашённой перемены
  choice: Сохранено общее высказывание о перемене положения или порядка.
  alternative: Уточнить, что речь идёт исключительно о спасении, награде учеников, общественном положении или ранге в грядущем Царстве.
  rationale: Сам стих не определяет точную сферу перемены; широкий афористический перевод сохраняет смысловую и богословскую напряжённость контекста.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, выразительная и понятная. Тире во второй части отмечает пропущенную, но подразумеваемую связку и сохраняет афористический ритм.
