  text: And large crowds followed him, and he healed them there.
translation:
  language: ru
  text: И за Ним последовали большие толпы людей, и Он исцелил их там.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: последовали
  rationale: 'Аорист ἀκολουθέω передаёт совершившееся в повествовании действие: люди пошли вслед за Иисусом. «Последовали» естественно звучит по-русски и не добавляет к контексту особого смысла ученичества.'
- source_word: αὐτῷ
  choice: за Ним
  rationale: При русском глаголе «последовать» лицо, за которым идут, естественно обозначается конструкцией «за» с творительным падежом.
- source_word: ὄχλοι πολλοί
  choice: большие толпы людей
  rationale: Буквально сочетание означает «многие толпы». Русское «большие толпы людей» естественно передаёт многочисленность собравшихся и яснее обозначает людей как участников действия.
- source_word: ἐθεράπευσεν
  choice: исцелил
  rationale: В евангельском контексте θεραπεύω обозначает восстановление здоровья; «исцелил» — точный, понятный и стилистически достойный русский эквивалент.
- source_word: αὐτούς
  choice: их
  rationale: Местоимение относится к толпам, то есть к составлявшим их людям; русское множественное «их» сохраняет эту соотнесённость.
- source_word: ἐκεῖ
  choice: там
  rationale: Простое наречие места точно сохраняет значение греческого ἐκεῖ.
- source_word: καὶ ... καὶ
  choice: И ... и
  rationale: Повтор союза сохраняет простое повествовательное соединение двух действий и не уточняет их логическую связь сверх сказанного в греческом тексте.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с простой евангельской повествовательной структурой. Прописные местоимения «Ним» и «Он» употреблены как принятая в русском библейском стиле уважительная графическая норма; богословского уточнения они не вносят.
