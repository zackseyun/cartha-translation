  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε τὰ παιδία καὶ μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/014.yaml
  text: But Jesus said[a], “Let the children come, and do not hinder them from coming to me[b], for the kingdom of heaven belongs to such as these.”
translation:
  language: ru
  text: 'Но Иисус сказал: «Пустите детей и не мешайте им приходить ко Мне, потому что таким принадлежит Царство Небесное».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ибо таких — Царство Небесное». Слово «таких» может относиться не только к присутствующим детям, но и к людям такого рода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφετε
  choice: Пустите
  rationale: 'В этом контексте повелительная форма ἀφίημι выражает разрешение: детям следует позволить подойти к Иисусу. «Пустите» кратко, естественно и передаёт живую прямую речь.'
- source_word: τὰ παιδία
  choice: детей
  rationale: παιδία обозначает детей, нередко малолетних; нейтральное «детей» не усиливает без необходимости оттенок уменьшительности.
- source_word: μὴ κωλύετε
  choice: не мешайте
  rationale: κωλύω значит «мешать, препятствовать, не допускать». «Не мешайте» естественно сочетается с инфинитивом «приходить» и не уточняет сверх текста характер препятствия.
- source_word: αὐτὰ ἐλθεῖν πρός με
  choice: им приходить ко Мне
  rationale: При κωλύω конструкция с инфинитивом естественно передаётся по-русски как «мешать кому-либо делать что-либо»; πρός με — «ко Мне».
- source_word: τῶν γὰρ τοιούτων
  choice: потому что таким принадлежит
  rationale: τοιούτων указывает не только на присутствующих детей, но и на людей такого рода. «Таким» сохраняет представительный смысл, не объясняя, какое именно качество имеется в виду.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Небесное Царство
  rationale: Это естественная современная русская передача характерного для Матфея выражения; она сохраняет смысл и достоинство речи без буквального, но тяжеловесного «Царство небес».
- source_word: ἐστὶν
  choice: принадлежит
  rationale: В сочетании с родительным τῶν ... τοιούτων глагол-связка выражает принадлежность. «Принадлежит» ясно передаёт смысл по-русски, тогда как буквальное «таких есть» невозможно, а «таковых есть» архаично.
theological_decisions:
- issue: Относится ли высказывание Иисуса только к буквальным детям или также к людям, подобным им
  choice: «таким принадлежит Небесное Царство»
  alternative: «Небесное Царство принадлежит этим детям»; либо «тем, кто подобен детям»
  rationale: 'Греческое τοιούτων имеет представительный характер: речь идёт о людях такого рода, однако текст не называет конкретного качества. «Таким» сохраняет как непосредственную связь с детьми, так и более широкую отнесённость, не разрешая богословское напряжение толкованием.'
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. «Пустите» и «не мешайте» понятны широкому читателю; местоимение «Мне» написано с прописной буквы в соответствии с распространённой русской библейской издательской традицией. Единственная сноска отмечена в основном тексте и сохраняет буквальную конструкцию и смысловую широту τοιούτων.
