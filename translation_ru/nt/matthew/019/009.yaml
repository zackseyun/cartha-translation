  text: λέγω δὲ ὑμῖν ⸀ὅτι ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ μὴ ἐπὶ πορνείᾳ καὶ γαμήσῃ ἄλλην μοιχᾶται ⸂καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/009.yaml
  text: But I tell you that whoever divorces his wife[a], except for sexual immorality, and marries another, commits adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: ru
  text: 'Но Я говорю вам: кто разведётся со своей женой, кроме случая сексуальной безнравственности[a], и женится на другой женщине, тот совершает прелюбодеяние; и тот, кто женится на разведённой женщине, совершает прелюбодеяние[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не по причине сексуальной безнравственности». Греческое выражение можно также передать более узко: «кроме блуда»; некоторые понимают его как «кроме сексуальной неверности».'
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых рукописях отсутствуют слова: «и тот, кто женится на разведённой женщине, совершает прелюбодеяние».'
    reason: textual_variant
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Но Я говорю вам
  rationale: Передаёт личное авторитетное высказывание Иисуса; δέ в контексте имеет мягкий противительный оттенок.
- source_word: ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ
  choice: кто разведётся со своей женой
  rationale: Неопределённо-относительная конструкция выражает общее условие, а ἀπολύω в брачном контексте означает развод.
- source_word: μὴ ἐπὶ πορνείᾳ
  choice: не по причине сексуальной распущенности
  rationale: Сохраняет отрицательную форму греческой конструкции и передаёт πορνεία шире, чем только супружеская измена, не сводя спорную оговорку к одному толкованию.
- source_word: καὶ γαμήσῃ ἄλλην
  choice: и женится на другой
  rationale: ἄλλην — форма женского рода; русская конструкция естественно подразумевает другую женщину.
- source_word: μοιχᾶται
  choice: совершает прелюбодеяние
  rationale: Ясный и традиционно понятный эквивалент глагола, обозначающего нарушение супружеской верности.
- source_word: καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: и кто женится на разведённой, тот совершает прелюбодеяние
  rationale: Артиклевая причастная конструкция передана обобщённо; перфектное страдательное причастие обозначает женщину, с которой развелись.
theological_decisions:
- issue: Значение πορνεία в оговорке об исключении
  choice: сексуальная распущенность
  alternative: блуд; сексуальная неверность; супружеская измена
  rationale: Греческое слово имеет более широкий диапазон, чем μοιχεία («прелюбодеяние»). Широкая формулировка не навязывает узкое конфессиональное понимание; возможные более узкие передачи отмечены в сноске.
- issue: Включение заключительной фразы καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: включить в основной текст со сноской
  alternative: опустить вслед за рукописями, в которых фраза отсутствует
  rationale: Предоставленный текст SBLGNT включает фразу как текстуально спорную; поэтому она переведена, а рукописное расхождение указано в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис остаётся близким к греческому, но понятен обычному читателю. Заглавное «Я» употреблено как русская издательская норма для речи Христа; термин «прелюбодеяние» сохранён как точный и широко узнаваемый.
