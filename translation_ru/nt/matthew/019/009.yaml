  source_fidelity: 'Основной смысл передан верно: ἀπολύσῃ отражено как развод, γυνή — как «жена», μοιχᾶται — как «совершает прелюбодеяние», а заключительная текстологически спорная фраза включена согласно SBLGNT. Однако «не по причине сексуальной распущенности» менее удачно передаёт исключительный характер μὴ ἐπὶ πορνείᾳ и слово «распущенность» может обозначать скорее устойчивую характеристику поведения, чем охватывающее понятие πορνεία.'
