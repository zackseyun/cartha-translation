  terminology: «Прелюбодеяние» — точный, устойчивый и уместный термин для μοιχᾶται. «Сексуальная безнравственность» сохраняет широкую семантику πορνεία и не предрешает спор о том, следует ли понимать её как блуд, супружескую неверность или иначе. Сноска сохраняет более узкие и интерпретационные варианты.
