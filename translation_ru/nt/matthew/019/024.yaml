  text: πάλιν δὲ λέγω ὑμῖν, εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸀τρυπήματος ῥαφίδος ⸀εἰσελθεῖν ἢ πλούσιον ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/024.yaml
  text: Again I tell you[b][a], it is easier for a camel to go through the eye of a needle than for a rich man to enter into the kingdom of God.
translation:
  language: ru
  text: 'И снова говорю вам: верблюду[a] легче пройти сквозь игольное ушко[b], чем богатому войти в Царство Бога.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Иногда вместо «верблюд» предлагали «канат», однако греческий текст здесь говорит о верблюде.
    reason: alternative_reading
  - marker: b
    text: 'Или: «сквозь ушко иглы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν δὲ λέγω ὑμῖν
  choice: И ещё говорю вам
  rationale: πάλιν передаёт повторение («ещё, снова»), а δέ служит мягкой связкой. Формула звучит естественно по-русски и сохраняет прямое обращение.
- source_word: εὐκοπώτερόν ἐστιν
  choice: легче
  rationale: Сравнительная форма с инфинитивами естественно передаётся русским сравнительным наречием «легче».
- source_word: κάμηλον
  choice: верблюду
  rationale: Греческий текст прямо называет верблюда; дательный падеж естественен в русской сравнительной конструкции с инфинитивом.
- source_word: διὰ τρυπήματος ῥαφίδος
  choice: сквозь игольное ушко
  rationale: Выражение обозначает отверстие швейной иглы. «Игольное ушко» — точный и устойчивый современный русский эквивалент.
- source_word: εἰσελθεῖν
  choice: пройти / войти
  rationale: 'Один и тот же греческий инфинитив передан по контексту: «пройти» через отверстие и «войти» в Царство. Это сохраняет смысл при естественном русском словоупотреблении.'
- source_word: ἢ πλούσιον
  choice: чем богатому
  rationale: Субстантивированное прилагательное мужского рода передано без добавления эмоционально окрашенного слова «богач»; форма «богатому» естественна и сохраняет грамматический образ.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: войти в Царство Бога
  rationale: Предлог εἰς с глаголом движения естественно передаётся как «войти в». «Царство Бога» прозрачно воспроизводит родительную конструкцию τοῦ θεοῦ и понятно современному читателю.
theological_decisions:
- issue: Образ верблюда и игольного ушка
  choice: Сохранена намеренно резкая гипербола с верблюдом и буквальным отверстием иглы.
  alternative: Толкование «игольного ушка» как названия городских ворот или замена верблюда канатом.
  rationale: Греческий текст даёт яркий образ крайней невозможности и не указывает ни на особые ворота, ни на техническую метафору. Смягчение образа внесло бы отсутствующее в источнике толкование.
translation_notes:
  register: Современный литературный русский язык с краткой, выразительной структурой исходного изречения. «Богатому» нейтральнее слова «богач», а «Царство Бога» прозрачно для широкого круга читателей. Образ не смягчён и не аллегоризирован.
