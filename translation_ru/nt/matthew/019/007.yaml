  text: λέγουσιν αὐτῷ· Τί οὖν Μωϋσῆς ἐνετείλατο δοῦναι βιβλίον ἀποστασίου καὶ ἀπολῦσαι ⸀αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/007.yaml
  text: They said to him[a], “Why then did Moses command to give a certificate of divorce and to send her away?”
translation:
  language: ru
  text: 'Они сказали Ему: «Почему же Моисей повелел дать разводное свидетельство и отпустить её[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и развестись с ней». Греческий глагол может означать «отпустить», а в данном контексте употребляется в значении развода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Они сказали Ему
  rationale: Историческое настоящее в греческом повествовании естественно передаётся русским прошедшим временем.
- source_word: Τί οὖν
  choice: Почему же
  rationale: В контексте выражение вводит возражение собеседников и имеет причинно-аргументативный смысл.
- source_word: Μωϋσῆς ἐνετείλατο
  choice: Моисей повелел
  rationale: Глагол означает приказание; важно сохранить формулировку оппонентов, которую Иисус уточняет в следующем стихе.
- source_word: δοῦναι βιβλίον ἀποστασίου
  choice: дать разводное свидетельство
  rationale: Устойчивое и понятное обозначение письменного документа о разводе, соответствующее юридическому контексту Втор 24:1.
- source_word: καὶ ἀπολῦσαι αὐτήν
  choice: и отпустить жену
  rationale: Буквально сохраняет образ удаления жены и одновременно в данном контексте обозначает развод; существительное «жену» естественно раскрывает референт местоимения.
theological_decisions:
- issue: Следует ли заранее согласовать слова собеседников с ответом Иисуса в следующем стихе
  choice: Сохранить «повелел»
  alternative: «позволил» или «разрешил»
  rationale: В этом стихе греческий текст прямо передаёт утверждение собеседников о повелении; заменять его разрешением означало бы преждевременно вносить уточнение из следующего стиха.
translation_notes:
  register: Современный литературный русский язык с ясной, но достойной библейской формулировкой. «Разводное свидетельство» сохраняет юридический характер документа; «отпустить жену» передаёт исходную идиому, а сноска поясняет её однозначный контекстуальный смысл.
