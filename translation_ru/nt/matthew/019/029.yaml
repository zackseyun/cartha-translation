  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ πᾶς ⸀ὅστις ἀφῆκεν ⸂οἰκίας ἢ⸃ ἀδελφοὺς ἢ ἀδελφὰς ἢ πατέρα ἢ μητέρα ἢ ⸂γυναῖκα ἢ⸃ τέκνα ἢ ⸀ἀγροὺς ἕνεκεν τοῦ ⸂ὀνόματός μου⸃, ⸀ἑκατονταπλασίονα λήμψεται καὶ ζωὴν αἰώνιον κληρονομήσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/029.yaml
  text: And everyone who has left houses or brothers or sisters or father or mother or wife or children or fields for the sake of my name will receive a hundredfold and will inherit eternal life[a].
translation:
  language: ru
  text: И всякий, кто оставил дома, братьев или сестёр, отца или мать, жену или детей или поля ради Моего имени, получит во сто крат и унаследует вечную жизнь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὅστις
  choice: всякий, кто
  rationale: 'Передаёт распределительное и обобщающее значение сочетания: обещание относится к каждому, кто соответствует названному условию.'
- source_word: ἀφῆκεν
  choice: оставил
  rationale: Нейтрально передаёт совершённый отказ или уход, не внося более сильного оттенка «бросил» или «отрёкся».
- source_word: οἰκίας
  choice: дома
  rationale: Сохраняет конкретное множественное число и имущественно-бытовой смысл рядом с полями.
- source_word: ἀδελφοὺς / ἀδελφὰς
  choice: братьев или сестёр
  rationale: Оба родственных обозначения переданы раздельно, как в греческом тексте.
- source_word: γυναῖκα
  choice: жену
  rationale: В перечне семейных отношений слово обозначает супругу, а не женщину вообще.
- source_word: ἀγρούς
  choice: поля
  rationale: Конкретно передаёт сельскохозяйственную землю без излишнего уточнения формы владения.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: ради Моего имени
  rationale: Сохраняет исходный образ имени как выражения личности, власти и исповедуемой принадлежности Иисусу.
- source_word: ἑκατονταπλασίονα
  choice: во сто крат больше
  rationale: Естественное для современного литературного русского выражение, сохраняющее количественную силу обещания.
- source_word: ζωὴν αἰώνιον κληρονομήσει
  choice: унаследует вечную жизнь
  rationale: Сохраняет метафору наследования и традиционно ясное выражение «вечная жизнь».
theological_decisions:
- issue: Значение γυνή в перечне оставляемых семейных связей
  choice: жену
  alternative: женщину
  rationale: Контекст семьи и домашнего хозяйства требует значения «жена» и не предполагает отказа от женщин вообще.
- issue: Передача ἕνεκεν τοῦ ὀνόματός μου
  choice: ради Моего имени
  alternative: ради Меня
  rationale: Сохранение слова «имя» удерживает богословски значимый исходный образ, не сводя его к поясняющему пересказу.
- issue: Передача ἑκατονταπλασίονα
  choice: во сто крат больше
  alternative: сторицей
  rationale: Выбранный вариант понятнее современному читателю и сохраняет количественную выразительность греческого слова; «сторицей» звучит более архаично.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Перечень сохранён без сглаживания напряжения, связанного с оставлением семьи и имущества. Местоимение «Моего» написано с прописной буквы как устойчивая русская библейская издательская норма.
