  text: ὁ δὲ εἶπεν αὐτῷ· Τί με ⸂ἐρωτᾷς περὶ τοῦ ἀγαθοῦ; εἷς ἐστιν ὁ ἀγαθός⸃· εἰ δὲ θέλεις ⸂εἰς τὴν ζωὴν εἰσελθεῖν⸃, ⸀τήρησον τὰς ἐντολάς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/017.yaml
  text: And he said to him[a], “Why do you ask me about what is good? One is good. But if you want to enter into life[b], keep the commandments.”
translation:
  language: ru
  text: 'Он сказал ему[a]: «Почему ты спрашиваешь Меня о том, что хорошо? Благ лишь Один. Если же хочешь войти в жизнь, соблюдай заповеди».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях, а также в параллельных местах, сказано: «Почему ты называешь Меня благим? Никто не благ, кроме одного Бога». В тексте Матфея по SBLGNT здесь стоит: «Почему ты спрашиваешь Меня о том, что хорошо? Благ лишь Один».'
    reason: textual_variant
lexical_decisions:
- source_word: Τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ
  choice: Почему ты спрашиваешь Меня о том, что хорошо?
  rationale: Средний род τοῦ ἀγαθοῦ передан как указание на то, что является хорошим, без согласования с параллельными местами у Марка и Луки.
- source_word: εἷς ἐστιν ὁ ἀγαθός
  choice: Благ лишь Один
  rationale: Субстантивированное ὁ ἀγαθός передано личной формой «Благ», а εἷς — «Один»; частица «лишь» естественно выражает исключительность, подразумеваемую конструкцией, не называя Бога прямо.
- source_word: εἰ δὲ θέλεις
  choice: Если же хочешь
  rationale: θέλεις естественно передаётся современным «хочешь», а δέ — лёгким противопоставлением «же».
- source_word: εἰς τὴν ζωὴν εἰσελθεῖν
  choice: войти в жизнь
  rationale: Сохранён образ вхождения в жизнь без добавления слова «вечную», которого в данном обороте нет.
- source_word: τήρησον τὰς ἐντολάς
  choice: соблюдай заповеди
  rationale: В сочетании с заповедями τηρέω естественно означает исполнять и соблюдать их; «заповеди» сохраняет религиозный вес ἐντολάς.
theological_decisions:
- issue: Связь высказывания Иисуса с благостью Бога и христологией
  choice: 'Сохранить чтение Матфея: вопрос о том, что хорошо, и утверждение «Благ лишь Один».'
  alternative: 'Согласовать с Марком и Лукой: «Почему ты называешь Меня благим? Никто не благ, кроме одного Бога».'
  rationale: Текст SBLGNT у Матфея отличается от формы синоптических параллелей. Перевод не превращает стих ни в отрицание благости Иисуса, ни в явное христологическое утверждение, которого эта формулировка сама по себе не делает.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. «Благ лишь Один» несколько возвышенно, но естественно для библейского контекста и сохраняет личный оттенок ὁ ἀγαθός. Местоимение «Меня» написано с прописной буквы по принятой русской библейской традиции.
