  source_fidelity: 'Смысл передан точно: временное «Услышав это» отражает ἀκούσαντες, «ученики» — οἱ μαθηταί, а «Кто же тогда может спастись?» хорошо передаёт выводное ἄρα и пассивное σωθῆναι в контексте спасения. Однако λέγοντες означает «говоря / сказали», а не специально «спросили». Хотя вопросительная реплика делает «спросили» понятным, это вносит не выраженный греческим глаголом оттенок речевого акта.'
