  yaml_path: translation/nt/matthew/019/025.yaml
  text: When the disciples heard this, they were greatly astonished and said, “Who then can be saved?”
translation:
  language: ru
  text: 'Услышав это, ученики были крайне изумлены и сказали: «Кто же тогда может спастись?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Услышав это
  rationale: Аористное причастие обозначает обстоятельство, предшествующее основной реакции; «это» естественно указывает на предыдущее высказывание Иисуса.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Частица обозначает продолжение или лёгкое противопоставление; в русском переход естественно передаётся начальным деепричастным оборотом.
- source_word: οἱ μαθηταὶ
  choice: ученики
  rationale: Устойчивое и контекстуально точное обозначение учеников Иисуса.
- source_word: ἐξεπλήσσοντο σφόδρα
  choice: были крайне изумлены
  rationale: Имперфект передаёт их продолжавшуюся реакцию, а σφόδρα — её высокую степень; формулировка сохраняет силу выражения и литературный регистр.
- source_word: λέγοντες
  choice: и спросили
  rationale: Причастие сопутствующей речи естественно передано личной формой; поскольку далее следует прямой вопрос, «спросили» по-русски точнее и естественнее буквального «говорили».
- source_word: Τίς ἄρα
  choice: Кто же тогда
  rationale: ἄρα выражает вывод из предыдущих слов и удивление; сочетание «же тогда» сохраняет оба оттенка.
- source_word: δύναται σωθῆναι
  choice: может спастись
  rationale: Передаёт способность и богословски весомое значение спасения, не уточняя способ или действующего субъекта сверх текста.
theological_decisions:
- issue: Значение σωθῆναι в контексте
  choice: спастись
  alternative: быть спасённым; получить избавление
  rationale: Контекст входа в Царство указывает на спасение в полном смысле. Русская возвратная форма «спастись» идиоматична и не утверждает, что человек спасает себя; богословская напряжённость вопроса сохраняется.
translation_notes:
  register: Современный литературный русский язык, ясный для широкого читателя. Сильное удивление учеников передано без архаизмов; вопрос звучит естественно и сохраняет выводное значение ἄρα.
