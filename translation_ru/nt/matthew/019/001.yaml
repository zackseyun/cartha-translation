source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, μετῆρεν ἀπὸ τῆς Γαλιλαίας καὶ ἦλθεν εἰς τὰ ὅρια τῆς Ἰουδαίας πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/001.yaml
  text: And it happened that when Jesus had finished these words[a], he departed from Galilee and came into the region of Judea beyond the Jordan.
translation:
  language: ru
  text: Когда Иисус закончил говорить эти слова, Он покинул Галилею и пришёл в пределы Иудеи, по другую сторону Иордана[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за Иорданом».'
    reason: Лексически возможный, более краткий перевод выражения πέραν τοῦ Ἰορδάνου.
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε ἐτέλεσεν
  choice: Когда ... закончил
  rationale: Греческая повествовательная формула вводит следующее событие после завершения речи. В современном русском её естественно передаёт придаточное времени без архаического «и случилось».
- source_word: τοὺς λόγους τούτους
  choice: говорить это
  rationale: Речь идёт о только что завершённом наставлении Иисуса. Такая формулировка естественнее буквального «закончил эти слова» и сохраняет связь с предшествующей речью.
- source_word: μετῆρεν ἀπὸ τῆς Γαλιλαίας
  choice: покинул Галилею
  rationale: Глагол обозначает уход или перемещение из одного места; «покинул» ясно и достойно передаёт направление движения.
- source_word: ἦλθεν εἰς τὰ ὅρια τῆς Ἰουδαίας
  choice: пришёл в пределы Иудеи
  rationale: ὅρια здесь обозначает территорию или область, а не только пограничную линию. «В пределы Иудеи» сохраняет географический оттенок греческого выражения.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: по другую сторону Иордана
  rationale: πέραν указывает на противоположную сторону реки относительно точки отсчёта; выбранная формулировка ясна и не уточняет направление сверх сказанного в тексте.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Архаическая калька «и случилось» опущена как неестественная для современного читателя; заглавное «Он» сохраняет принятый в русском библейском стиле уважительный регистр.
