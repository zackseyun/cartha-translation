  text: ἀκούσας δὲ ὁ νεανίσκος τὸν ⸀λόγον ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/022.yaml
  text: But when the young man heard this word[a], he went away grieving[c][b], for he had many possessions.
translation:
  language: ru
  text: Но услышав эти слова, юноша ушёл опечаленный, потому что у него было много имущества.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: услышав
  rationale: Деепричастие естественно передаёт предшествующее действие аористного причастия и сохраняет последовательность событий.
- source_word: δὲ
  choice: но
  rationale: Союз обозначает мягкое противопоставление между призывом Иисуса и отрицательной реакцией юноши.
- source_word: ὁ νεανίσκος
  choice: юноша
  rationale: Слово означает молодого мужчину; добавление «начальник» заимствовало бы сведения из параллельного рассказа, которых нет в данном стихе Матфея.
- source_word: τὸν λόγον
  choice: эти слова
  rationale: В контексте речь идёт о только что сказанном Иисусом. Русское множественное число идиоматично обозначает высказывание, не меняя смысла греческого единственного числа.
- source_word: ἀπῆλθεν
  choice: ушёл
  rationale: Обычный и естественный русский глагол ухода точно передаёт повествовательную форму.
- source_word: λυπούμενος
  choice: опечаленный
  rationale: Передаёт состояние печали, сопровождавшее его уход, без усиления значения.
- source_word: ἦν γὰρ ἔχων
  choice: потому что у него было
  rationale: Естественно передаёт продолжающееся состояние обладания, выраженное перифрастической конструкцией.
- source_word: κτήματα πολλά
  choice: много имущества
  rationale: κτήματα обозначает собственность или имущество, а πολλά подчёркивает его большое количество; собирательное «имущество» звучит по-русски естественно.
theological_decisions:
- issue: Следует ли называть юношу начальником на основании параллельного рассказа
  choice: Передать νεανίσκος только как «юноша»
  alternative: «молодой начальник»
  rationale: Греческий текст Матфея в этом стихе называет его лишь юношей; гармонизация с Лукой внесла бы отсутствующую здесь характеристику.
translation_notes:
  register: Современный литературный русский язык; фраза проста, естественна и сохраняет сдержанный повествовательный тон оригинала. «Эти слова» яснее в текущей русской речи, чем буквальное «это слово».
