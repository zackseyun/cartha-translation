reference: Matthew 19:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ εἶπεν· ⸀Ἕνεκα τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ ⸀κολληθήσεται τῇ γυναικὶ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/005.yaml
  text: and said[a], ‘For this reason a man will leave his father and mother and be joined to his wife, and the two will become one flesh.’
translation:
  language: ru
  text: 'и сказал: «Поэтому мужчина оставит отца и мать и прилепится[a] к своей жене, и двое станут одной плотью»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «соединится со своей женой», «будет крепко связан со своей женой». Греческий глагол означает тесную привязанность или соединение.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕνεκα τούτου
  choice: Поэтому
  rationale: Естественно и кратко передаёт причинно-следственное значение выражения в современном русском языке.
- source_word: καταλείψει
  choice: оставит
  rationale: Будущее время сохранено; глагол естественно передаёт уход из прежней семейной связи без архаичного оттенка.
- source_word: ἄνθρωπος
  choice: мужчина
  rationale: Хотя слово может означать человека вообще, здесь речь идёт именно о мужчине в паре с его женой.
- source_word: κολληθήσεται
  choice: прилепится
  rationale: Передаёт тесное и устойчивое присоединение; сохраняет образность греческого глагола и узнаваемую формулировку цитаты из Бытия.
- source_word: γυναικὶ αὐτοῦ
  choice: к своей жене
  rationale: В брачном контексте γυνή означает жену; возвратное «своей» естественно соотносит её с подлежащим.
- source_word: οἱ δύο
  choice: двое
  rationale: Сохраняет явно названных в греческом тексте двух участников и звучит естественно по-русски.
- source_word: εἰς σάρκα μίαν
  choice: станут одной плотью
  rationale: «Станут» передаёт результирующую направленность конструкции ἔσονται εἰς, а «одной плотью» сохраняет ёмкий библейский образ брачного единства.
theological_decisions:
- issue: Гендерно определённая формулировка цитаты о браке
  choice: мужчина ... своей жене
  alternative: человек ... своей супруге
  rationale: Контекст прямо описывает мужчину и его жену, поэтому гендерная определённость источника сохранена, а не нейтрализована.
- issue: Передача образа брачного единства
  choice: двое станут одной плотью
  alternative: двое будут одной плотью
  rationale: «Станут» яснее передаёт переход к новому единству, выраженный сочетанием ἔσονται εἰς, не объясняя образ сверх сказанного.
- issue: Вопросительная пунктуация
  choice: вопросительный знак после цитаты
  alternative: точка после цитаты
  rationale: В SBLGNT стих входит в начатый ранее вопрос и завершается греческим вопросительным знаком; вопрос относится ко всей конструкции «Разве вы не читали… и [Он] сказал…?», а не превращает цитируемое утверждение в самостоятельный вопрос.
translation_notes:
  register: Современный литературный русский с достоинством библейской цитаты. «Прилепится» слегка возвышенно, но понятно и точно сохраняет образ близкого, прочного соединения; сноска предлагает более нейтральные варианты. Союз «и» в начале сохранён, поскольку стих синтаксически продолжает предыдущий.
