id: MAT.19.26
reference: Matthew 19:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐμβλέψας δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Παρὰ ἀνθρώποις τοῦτο ἀδύνατόν ἐστιν, παρὰ δὲ θεῷ πάντα δυνατά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/026.yaml
  text: But Jesus looked at them and said to them[a], “With men this is impossible, but with God all things are possible.”
translation:
  language: ru
  text: 'Иисус же посмотрел на них и сказал им: «Для людей это невозможно, но для Бога всё возможно».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: посмотрел на них
  rationale: Глагол обозначает направленный на кого-либо взгляд. «Посмотрел на них» естественно по-русски и не усиливает значение до «пристально посмотрел».
- source_word: δὲ
  choice: же
  rationale: Частица обозначает мягкий переход или противопоставление; постпозитивное «же» сохраняет повествовательную связь без чрезмерно резкого контраста.
- source_word: εἶπεν αὐτοῖς
  choice: сказал
  rationale: Адресаты уже явно выражены в обороте «посмотрел на них», поэтому повтор «сказал им» в русском звучал бы тяжеловесно, хотя смысл дательного αὐτοῖς сохраняется контекстом.
- source_word: παρὰ ἀνθρώποις
  choice: для людей
  rationale: παρά с дательным указывает здесь на сферу или положение дел применительно к людям. «Для людей» естественно передаёт общий, а не гендерно ограниченный смысл ἀνθρώποις.
- source_word: τοῦτο
  choice: это
  rationale: Указательное местоимение отсылает к только что обсуждавшейся возможности спасения; нейтральное «это» сохраняет такую отсылку.
- source_word: ἀδύνατόν ἐστιν
  choice: невозможно
  rationale: Прямой и естественный русский эквивалент составного именного сказуемого.
- source_word: παρὰ δὲ θεῷ
  choice: но для Бога
  rationale: Повтор конструкции παρά с дательным передан параллельно обороту «для людей», а δέ выражено противительным союзом «но».
- source_word: πάντα δυνατά
  choice: всё возможно
  rationale: Идиоматичное русское выражение сохраняет всеохватность πάντα и афористическую краткость греческой фразы.
theological_decisions:
- issue: Обобщённое значение ἀνθρώποις
  choice: людей
  alternative: человеков / мужчин
  rationale: В данном противопоставлении Богу греческое множественное число обозначает человечество вообще. «Людей» точно и естественно передаёт этот смысл, не создавая ложного ограничения по полу.
- issue: Объём утверждения πάντα δυνατά
  choice: всё возможно
  alternative: Бог может всё
  rationale: Сохранена форма исходного текста без добавления прямого утверждения о способности Бога. Контекст ограничивает максиму обсуждаемым действием Бога, но перевод не должен молча сужать или расширять её.
translation_notes:
  register: Современный литературный русский язык, краткий и достойный повествовательный стиль. Синтаксический параллелизм «для людей — для Бога» сохраняет риторическое противопоставление оригинала.
