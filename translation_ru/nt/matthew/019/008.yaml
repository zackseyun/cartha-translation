  variant: modern literary Russian
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὅτι Μωϋσῆς πρὸς τὴν σκληροκαρδίαν ὑμῶν ἐπέτρεψεν ὑμῖν ἀπολῦσαι τὰς γυναῖκας ὑμῶν, ἀπ’ ἀρχῆς δὲ οὐ γέγονεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/008.yaml
  text: He said to them[a], “Because of your hardness of heart Moses permitted you to divorce your wives[c][b], but from the beginning it has not been so.”
translation:
  language: ru
  text: 'Он сказал им: «Из-за вашего жестокосердия Моисей разрешил вам развестись со своими жёнами[a], но с самого начала было не так[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отпустить своих жён»; в данном контексте речь идёт о разводе.'
    reason: lexical_alternative
  - marker: b
    text: То есть это разрешение не соответствовало первоначальному порядку творения.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει
  choice: Он сказал
  rationale: Греческий исторический презенс в русском повествовании естественно передаётся прошедшим временем.
- source_word: πρὸς τὴν σκληροκαρδίαν ὑμῶν
  choice: из-за жестокосердия вашего
  rationale: Передаёт причинное значение πρός с винительным и сохраняет библейский образ «жестокого сердца» в литературной форме.
- source_word: ἐπέτρεψεν
  choice: позволил
  rationale: Глагол обозначает разрешение или уступку, а не повеление и не одобрение.
- source_word: ἀπολῦσαι τὰς γυναῖκας ὑμῶν
  choice: разводиться с вашими жёнами
  rationale: В контексте брака ἀπολύω имеет юридический смысл развода; γυνή здесь означает жену.
- source_word: ἀπ’ ἀρχῆς
  choice: в начале
  rationale: Кратко и естественно сохраняет отсылку к первоначальному порядку творения.
- source_word: οὐ γέγονεν οὕτως
  choice: было не так
  rationale: Совершенная форма описывает сложившееся положение дел; русское «было не так» естественно выражает противопоставление первоначальному порядку.
theological_decisions:
- issue: Следует ли представить установление Моисея как повеление или разрешение
  choice: Моисей позволил вам
  alternative: Моисей повелел вам
  rationale: ἐπέτρεψεν означает разрешение, данное ввиду человеческого жестокосердия, а не положительное предписание.
- issue: Следует ли прямо пояснить, что речь идёт о замысле Бога при творении
  choice: но в начале было не так
  alternative: но изначально Божий замысел был иным
  rationale: Сохранена сдержанная формулировка греческого текста без внесения поясняющей богословской парафразы.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет достоинство библейской речи. Инверсия «жестокосердия вашего» поддерживает возвышенный регистр, не делая текст архаичным.
