  source_fidelity: 'Основной смысл передан точно: ἐπέτρεψεν выражено как разрешение, а не повеление; ἀπολῦσαι в брачном контексте верно передано как развод; «жёны» соответствует γυναῖκες. Однако «в начале» несколько менее точно передаёт ἀπ’ ἀρχῆς, чем «с самого начала», а «было не так» может звучать как простое описание прошлого, не столь ясно сохраняя противопоставление исходному положению.'
  naturalness: «Из-за жестокосердия вашего» допустимо в высоком библейском регистре, но для современного литературного русского естественнее «из-за вашего жестокосердия». «С самого начала было не так» — идиоматичнее и яснее, чем «в начале было не так».
