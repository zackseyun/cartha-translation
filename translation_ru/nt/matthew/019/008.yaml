  to: 'Он сказал им: «Из-за вашего жестокосердия Моисей разрешил вам развестись со своими жёнами[a], но с самого начала было не так[b]».'
  rationale: Правка сохраняет смысл греческого текста и его сдержанность, не добавляя богословских утверждений в основной текст. «С самого начала» точнее передаёт ἀπ’ ἀρχῆς; более обычный порядок слов улучшает современную литературную естественность. Якорь b перенесён к поясняемой заключительной клаузе.
