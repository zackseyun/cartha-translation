id: MAT.19.6
reference: Matthew 19:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ σὰρξ μία. ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/006.yaml
  text: So they are no longer two[a], but one flesh. Therefore, what God has joined together, man must not separate.
translation:
  language: ru
  text: Так что они уже не двое, но одна плоть. Итак, что Бог соединил, пусть человек[a] не разлучает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Слово «человек» здесь употреблено в обобщённом смысле: никто из людей не должен разлучать то, что соединил Бог.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Так что
  rationale: Передаёт следствие из предшествующего утверждения о том, что двое становятся одной плотью, и естественно звучит по-русски.
- source_word: οὐκέτι
  choice: уже не
  rationale: Точно и идиоматично выражает прекращение прежнего состояния.
- source_word: δύο
  choice: двое
  rationale: При отнесении к двум людям собирательное числительное «двое» естественнее русского «два» и сохраняет контраст с «одной плотью».
- source_word: σὰρξ μία
  choice: одна плоть
  rationale: Сохраняет прямую отсылку к языку книги Бытия и значимую библейскую метафору, не сводя её лишь к телесности.
- source_word: ὃ οὖν
  choice: Итак, что
  rationale: «Что» сохраняет неопределённо-обобщённое указание на созданное Богом единство, а «итак» передаёт выводное значение οὖν.
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Прямое и естественное соответствие греческому обозначению действующего лица.
- source_word: συνέζευξεν
  choice: соединил
  rationale: Передаёт действие связывания двоих в единство; русское совершенное прошедшее сохраняет завершённость действия и его актуальный результат.
- source_word: ἄνθρωπος
  choice: человек
  rationale: 'Русское «человек» точно передаёт единственное число и естественно имеет здесь обобщённое значение: никакой человек не вправе разрушать созданное Богом единство.'
- source_word: μὴ χωριζέτω
  choice: пусть … не разлучает
  rationale: Естественная современная русская форма запрета, сохраняющая силу греческого императива; «разлучает» соответствует контексту брака лучше, чем более общее «разделяет».
theological_decisions:
- issue: Обобщённое значение ἄνθρωπος в запрете, относящемся к браку
  choice: «человек» с пояснением об обобщённом смысле
  alternative: «никто» или «никакой человек»
  rationale: «Человек» формально близок исходному единственному числу и в русском языке естественно относится к любому человеку. Сноска устраняет возможность ошибочно понять его как указание только на мужчину.
- issue: Брачное единство в выражении σὰρξ μία и его связь с книгой Бытия
  choice: «одна плоть»
  alternative: «одно тело»
  rationale: «Одна плоть» сохраняет межтекстовую связь и богословски значимый образ, не добавляя толкования о точной природе брачного единства.
- issue: Референт среднего относительного местоимения ὃ
  choice: Сохранено широкое «что Бог соединил»
  alternative: «тех, кого Бог соединил» или «союз, который Бог создал»
  rationale: 'Широкая формулировка сохраняет грамматическую и смысловую ёмкость оригинала: речь может восприниматься как о соединённых людях и о самом созданном Богом единстве. Более явные варианты преждевременно разрешили бы эту напряжённость.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Так что» и «пусть … не разлучает» обеспечивают ясность и естественность, а традиционное выражение «одна плоть» сохраняет связь с книгой Бытия.
