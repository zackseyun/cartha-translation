review_pass:
  verdict: approve
  source_fidelity: 'Текст точно передаёт структуру и смысл греческого оригинала: ὥστε выражено как «Так что», οὐκέτι — «уже не», контраст δύο / σὰρξ μία сохранён в «не двое, но одна плоть». Широкое среднеродовое ὃ корректно передано словом «что», без преждевременного сведения референта только к людям или только к брачному союзу. «Бог соединил» адекватно передаёт συνέζευξεν, а запрет «пусть человек не разлучает» соответствует μὴ χωριζέτω.'
  naturalness: Формулировка естественна для современного литературного русского языка и при этом сохраняет сдержанный библейский регистр. «Двое» в данном контексте звучит нормативно и ясно; «одна плоть» — устоявшееся и необходимое библейское выражение. Повтор выводных связок «Так что» и «Итак» оправдан наличием ὥστε и οὖν в оригинале.
  terminology: «Одна плоть» верно сохраняет генеалогическую и смысловую связь с Быт. 2:24. «Человек» адекватно передаёт обобщённое ἄνθρωπος; сноска корректно поясняет, что это не ограничение по полу. Терминология не навязывает конфессионального толкования.
