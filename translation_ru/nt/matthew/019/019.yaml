    reason: Сохраняет отмеченное в оригинале различие между императивом Τίμα и будущим индикативом Ἀγαπήσεις, не меняя повелительного смысла контекста.
lexical_decisions:
- source_word: Τίμα
  choice: Почитай
  rationale: Передаёт повеление о должном почтении к родителям и сохраняет узнаваемую лексику Декалога; «уважай» было бы несколько слабее.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: отца и мать
  rationale: В русском контексте прямого обращения притяжательное местоимение можно естественно опустить; смысл «своих отца и мать» ясен из формулировки заповеди.
- source_word: Ἀγαπήσεις
  choice: люби
  rationale: Хотя в греческом стоит форма будущего времени, здесь она служит формой предписания в цитате из Торы. Русский императив естественно передаёт силу заповеди.
- source_word: τὸν πλησίον σου
  choice: ближнего твоего
  rationale: «Ближний» — точный и укоренившийся русский эквивалент πλησίον в библейском этическом контексте; местоимение сохранено для соответствия греческому тексту.
- source_word: ὡς σεαυτόν
  choice: как самого себя
  rationale: Кратко и точно сохраняет сравнение, не добавляя отсутствующего в греческом глагола.
theological_decisions:
- issue: Различие грамматических форм двух заповедей
  choice: 'Передать обе части как прямые повеления: «Почитай…» и «люби…»'
  alternative: «Почитай отца и мать, и будешь любить ближнего твоего, как самого себя»
  rationale: Греческий текст сочетает императив Τίμα с будущим индикативом Ἀγαπήσεις, поскольку цитирует формулировки заповедей. В современном русском императив во второй части яснее передаёт предписывающую силу, а формальное различие отмечено в сноске.
translation_notes:
  register: Современный литературный русский с достоинством и узнаваемой библейской лексикой. Кавычки показывают, что Иисус перечисляет отдельные заповеди; «твоего» сохранено как умеренно традиционная, но понятная форма.
