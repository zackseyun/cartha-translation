  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐ πάντες χωροῦσι τὸν λόγον ⸀τοῦτον ἀλλ’ οἷς δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/011.yaml
  text: But he said to them[a], “Not everyone can accept this word[b], but only those to whom it has been given.”
translation:
  language: ru
  text: 'Он же сказал им: «Не все способны принять эти слова[a], а лишь те, кому это дано[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это высказывание»; или: «это учение».'
    reason: lexical_alternative
  - marker: b
    text: Пассивная форма «это дано», вероятно, подразумевает Бога как дающего, но в греческом тексте действующее лицо прямо не названо.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: сказал
  rationale: Обычный повествовательный эквивалент аориста λέγω; естественно вводит прямую речь.
- source_word: Οὐ πάντες
  choice: не все
  rationale: Точно и естественно передаёт отрицание всеобщности, не подразумевая, что этого не может принять никто.
- source_word: χωροῦσι
  choice: способны принять
  rationale: В сочетании с λόγον глагол обозначает способность вместить, воспринять или принять сказанное; выбранная формулировка ясна современному читателю и сохраняет модальный оттенок.
- source_word: τὸν λόγον τοῦτον
  choice: эти слова
  rationale: Указывает на непосредственно предшествующее высказывание Иисуса. Русское множественное число «слова» идиоматично передаёт единое высказывание, выраженное греческим λόγος.
- source_word: ἀλλ’ οἷς
  choice: а лишь те, кому
  rationale: «Лишь» естественно выражает ограничительный смысл противопоставления с относительным оборотом.
- source_word: δέδοται
  choice: это дано
  rationale: Сохраняет перфектный пассив без добавления неназванного деятеля и передаёт дарованную способность с сохраняющимся результатом.
theological_decisions:
- issue: Кто является подразумеваемым деятелем в пассиве δέδοται
  choice: Сохранить безлично-пассивную формулировку «кому это дано», не называя дающего.
  alternative: «кому Бог дал такую способность»
  rationale: В контексте пассив, вероятно, подразумевает Бога, однако греческий текст прямо Его не называет. Сохранение пассива не устраняет заложенную в тексте богословскую неоднозначность.
- issue: К чему относится «эти слова»
  choice: Оставить отсылку к предшествующему высказыванию без уточнения в основном тексте.
  alternative: Уточнить как «это учение» или конкретно связать с безбрачием.
  rationale: λόγος может означать высказывание, речь или учение; сам стих не снимает полностью вопрос об объёме отсылки, поэтому конкретизацию лучше не вносить.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Формула «Он же сказал им» сохраняет лёгкое противопоставление δέ. «Способны принять» передаёт идиоматический смысл χωρέω, а не буквальный пространственный образ «вместить».
