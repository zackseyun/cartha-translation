  text: λέγει αὐτῷ· Ποίας; ὁ δὲ Ἰησοῦς ⸀εἶπεν· Τὸ Οὐ φονεύσεις, Οὐ μοιχεύσεις, Οὐ κλέψεις, Οὐ ψευδομαρτυρήσεις,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/018.yaml
  text: 'He says to him, “Which ones?” And Jesus said, “The: You shall not murder, you shall not commit adultery, you shall not steal, you shall not bear false witness,”'
translation:
  language: ru
  text: 'Он спросил Его: «Какие?» Иисус сказал: «Вот эти: не убивай, не прелюбодействуй, не кради, не лжесвидетельствуй,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποίας
  choice: Какие?
  rationale: Женская форма множественного числа соотносится с подразумеваемыми заповедями; краткий вопрос естественно передаёт греческий эллипсис.
- source_word: Τὸ
  choice: 'Вот эти:'
  rationale: Артикль перед перечислением употреблён субстантивированно и вводит ответ на вопрос о том, какие именно заповеди имеются в виду. Русское «Вот эти» передаёт функцию конструкции без неестественной кальки «Это:».
- source_word: Οὐ φονεύσεις
  choice: не убивай
  rationale: φονεύω означает совершить убийство; традиционная и современная русская формула «не убивай» уместна в цитате заповеди.
- source_word: Οὐ μοιχεύσεις
  choice: не прелюбодействуй
  rationale: Сохраняет конкретное значение μοιχεύω — нарушать супружескую верность — и библейский регистр.
- source_word: Οὐ κλέψεις
  choice: не кради
  rationale: Прямой, естественный эквивалент запрета кражи.
- source_word: Οὐ ψευδομαρτυρήσεις
  choice: не лжесвидетельствуй
  rationale: Передаёт не просто ложь вообще, а дачу ложного свидетельства, сохраняя юридико-заветный оттенок.
theological_decisions:
- issue: Форма ветхозаветных заповедей в речи Иисуса
  choice: Сохранены отдельные краткие запреты в повелительной форме единственного числа.
  alternative: 'Перевести будущим временем: «не будешь убивать…»'
  rationale: В греческом отрицание οὐ с будущим временем цитирует нормативные формулы Декалога; в современном русском заповедь естественнее и узнаваемее звучит как запрет с повелительным наклонением.
- issue: Значение φονεύσεις
  choice: не убивай
  alternative: не совершай убийства
  rationale: Выбор сохраняет традиционную формулу заповеди, не вводя дополнительного толкования о границах понятия убийства.
translation_notes:
  register: Современный литературный русский с достоинством прямой речи и узнаваемой формой Декалога. Настоящее историческое λέγει передано прошедшим временем для естественного русского повествования. Эллиптическое Τὸ раскрыто минимально как «Вот эти:».
