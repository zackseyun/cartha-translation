  text: Τότε ⸀προσηνέχθησαν αὐτῷ παιδία ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς καὶ προσεύξηται· οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/013.yaml
  text: Then children were brought to him so that he might lay his hands on them and pray[a]; but the disciples rebuked them.
translation:
  language: ru
  text: Тогда к Нему привели детей, чтобы Он возложил на них руки и помолился; ученики же укорили их.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Последнее слово «их» может относиться либо к детям, либо к тем, кто их привёл.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественно и кратко передаёт временную последовательность повествования.
- source_word: προσηνέχθησαν αὐτῷ παιδία
  choice: к Нему привели детей
  rationale: Русская активная неопределённо-личная конструкция естественно передаёт греческий аорист пассива, не называя тех, кто привёл детей.
- source_word: ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς
  choice: чтобы Он возложил на них руки
  rationale: Сохраняет значение цели, множественное число «руки» и библейски узнаваемый, но понятный современному читателю оборот.
- source_word: καὶ προσεύξηται
  choice: и помолился
  rationale: Передаёт глагол без добавления не выраженного в греческом дополнения «за них».
- source_word: οἱ δὲ μαθηταὶ
  choice: ученики же
  rationale: Частица «же» естественно выражает мягкое противопоставление δέ.
- source_word: ἐπετίμησαν αὐτοῖς
  choice: стали укорять их
  rationale: «Укорять» передаёт порицание; форма «стали укорять» звучит естественно в повествовании. Местоимение сохраняет неоднозначность референта.
theological_decisions:
- issue: К кому относится последнее αὐτοῖς
  choice: их
  alternative: детей; тех, кто привёл детей
  rationale: Греческое местоимение допускает оба референта. Русское «их» и сноска сохраняют подлинную неоднозначность, не разрешая её без достаточных оснований.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным евангельским регистром. Местоимение, относящееся к Иисусу, написано с прописной буквы согласно распространённой русской библейской традиции; синтаксис остаётся ясным и естественным.
