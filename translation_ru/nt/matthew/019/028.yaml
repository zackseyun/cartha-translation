  source_fidelity: 'Русский текст передаёт все существенные элементы греческого текста: торжественную формулу Ἀμήν, адресацию к последовавшим за Иисусом, эсхатологическую παλιγγενεσία, будущее восседание Сына Человеческого на престоле славы, двенадцать престолов и суд над двенадцатью коленами Израиля. «При обновлении» сохраняет отсутствие добавленного объекта вроде «всего творения» и уместно оставляет терминологическую широту оригинала.'
  naturalness: Фраза грамматически ясна и звучит как современный литературный русский с оправданно возвышенным библейским регистром. «Воссядет» и «престол» естественны в данном царственно-судебном контексте; причастный оборот «вы, последовавшие за Мной» хорошо выделяет адресатов обещания.
  terminology: «Сын Человеческий», «престол», «двенадцать колен Израиля» — точные и устойчивые библейские соответствия. «Судить» сохраняет основной смысл κρίνοντες; сноска корректно отмечает возможный управленческий оттенок, не подменяя им основной перевод. Сноска к «обновлению» адекватно отражает лексические альтернативы и контекстуально вероятный эсхатологический смысл.
