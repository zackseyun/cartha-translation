id: MAT.19.28
reference: Matthew 19:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ὑμεῖς οἱ ἀκολουθήσαντές μοι ἐν τῇ παλιγγενεσίᾳ, ὅταν καθίσῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ θρόνου δόξης αὐτοῦ, ⸀καθήσεσθε καὶ ⸀ὑμεῖς ἐπὶ δώδεκα θρόνους κρίνοντες τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/028.yaml
  text: And Jesus said to them[a], “Truly I say to you, you who have followed me will also sit on twelve thrones in the renewal, when the Son of Man sits on the throne of his glory[b], judging the twelve tribes of Israel.”
translation:
  language: ru
  text: 'Иисус сказал им: «Истинно говорю вам: при обновлении[a], когда Сын Человеческий воссядет на престоле славы Своей, вы, последовавшие за Мной, тоже сядете на двенадцати престолах и будете судить[b] двенадцать колен Израиля».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при возрождении», «в новом мире». Здесь имеется в виду, вероятнее всего, будущее обновление, связанное с царствованием Сына Человеческого, а не личное духовное возрождение.'
    reason: lexical_alternative
  - marker: b
    text: Слово «судить» здесь может также включать смысл правления или управления.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Истинно
  rationale: Сохраняет торжественную и авторитетную формулу введения изречения и естественно звучит в русском библейском регистре.
- source_word: ἀκολουθήσαντές μοι
  choice: вы, последовавшие за Мной
  rationale: Причастный оборот определяет адресатов по их следованию за Иисусом и прямо сохраняет личное дополнение μοι.
- source_word: παλιγγενεσίᾳ
  choice: при обновлении
  rationale: Передаёт идею возрождения или обновления, не добавляя отсутствующего в греческом тексте уточнения «всего»; контекст указывает на будущее эсхатологическое обновление.
- source_word: ὅταν καθίσῃ
  choice: когда ... воссядет
  rationale: Передаёт будущее событие; «воссядет» уместно для торжественного описания вступления на престол.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшаяся передача титула, сохраняющая его библейские и мессианские ассоциации.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: на престоле славы Своей
  rationale: Сохраняет генитивную конструкцию и возвышенный тон оригинала без сведения её к прилагательному.
- source_word: καθήσεσθε καὶ ὑμεῖς
  choice: вы ... тоже сядете
  rationale: «Тоже» передаёт καί и подчёркивает соответствие между воцарением Сына Человеческого и будущим положением учеников.
- source_word: ἐπὶ δώδεκα θρόνους
  choice: на двенадцати престолах
  rationale: Естественная русская передача положения на престолах.
- source_word: κρίνοντες
  choice: и будете судить
  rationale: Личная форма делает греческое причастие естественным по-русски, сохраняя основной смысл суда и не исключая оттенка управления.
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: двенадцать колен Израиля
  rationale: Точная и укоренённая в русской библейской речи передача племенных подразделений Израиля.
theological_decisions:
- issue: Значение παλιγγενεσία в данном контексте
  choice: будущее эсхатологическое обновление, связанное с воцарением Сына Человеческого
  alternative: личное возрождение; новый век; новый мир
  rationale: Ближайший контекст говорит о будущем престоле Сына Человеческого и роли учеников, а не об индивидуальном обращении. Формулировка не уточняет конкретную эсхатологическую схему.
- issue: Объём значения κρίνοντες
  choice: судить
  alternative: править; управлять
  rationale: Основной лексический смысл сохранён в тексте, а возможный более широкий оттенок осуществления власти отмечен в сноске, чтобы не снимать неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Слова «воссядет» и «престол» поддерживают царственный контекст, оставаясь понятными широкому читателю. Порядок частей предложения близок греческому и ясно связывает «при обновлении» с будущим обещанием.
