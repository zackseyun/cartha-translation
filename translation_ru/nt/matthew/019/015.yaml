  text: καὶ ἐπιθεὶς ⸂τὰς χεῖρας αὐτοῖς⸃ ἐπορεύθη ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/015.yaml
  text: And after laying his hands on them[a], he went on from there.
translation:
  language: ru
  text: И, возложив на них руки, Он ушёл оттуда.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет простую повествовательную связь с предыдущим эпизодом, не добавляя значения следствия или времени.
- source_word: ἐπιθεὶς
  choice: возложив
  rationale: Аористное причастие обозначает действие, предшествующее главному глаголу; русское деепричастие естественно передаёт эту последовательность.
- source_word: τὰς χεῖρας αὐτοῖς
  choice: на них руки
  rationale: 'Передаёт устойчивую конструкцию «возложить руки на кого-либо». Притяжательное местоимение в русском не требуется: принадлежность рук субъекту ясна из контекста.'
- source_word: ἐπορεύθη
  choice: Он ушёл
  rationale: В данном контексте глагол означает удаление из этого места. «Ушёл» звучит естественно и точно, без излишне высокого регистра.
- source_word: ἐκεῖθεν
  choice: оттуда
  rationale: Краткий и прямой современный эквивалент наречия места со значением исходной точки движения.
theological_decisions:
- issue: Характер возложения рук Иисусом
  choice: 'Сохранено буквальное описание физического действия: «возложив на них руки».'
  alternative: 'Передать смысл толковательно: «благословив их».'
  rationale: Греческий текст прямо называет возложение рук, тогда как благословение подразумевается контекстом. Основной текст не подменяет названное действие его предполагаемым смыслом.
translation_notes:
  register: Современный литературный русский язык; краткое, естественное и dignified повествование. Заглавная буква в «Он» употреблена как принятая в русской библейской традиции форма уважительного обозначения Иисуса, не меняющая смысла исходного текста.
