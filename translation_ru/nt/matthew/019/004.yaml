- from: 'Он ответил: «Разве вы не читали[a], что Тот, Кто сотворил их изначально[b], создал их мужчиной и женщиной?»'
  to: 'Он ответил: «Разве вы не читали[a], что Тот, Кто сотворил от начала[b], сделал их мужчиной и женщиной?»'
  rationale: 'Требуется точечная синтаксическая правка: местоимение «их» перенесено к глаголу «сделал», которому оно соответствует в оригинале. «Изначально» заменено на «от начала», чтобы яснее отразить ἀπ’ ἀρχῆς и аллюзию на Бытие, а «создал» заменено на «сделал» для различения κτίζω и ποιέω. Смысл и риторическая сила высказывания сохранены.'
