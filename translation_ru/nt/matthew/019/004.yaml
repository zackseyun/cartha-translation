  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Οὐκ ἀνέγνωτε ὅτι ὁ ⸀κτίσας ἀπ’ ἀρχῆς ἄρσεν καὶ θῆλυ ἐποίησεν αὐτοὺς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/004.yaml
  text: He answered, “Have you not read that from the beginning the one who created them made them male and female?”
translation:
  language: ru
  text: 'Он ответил: «Разве вы не читали[a], что Тот, Кто сотворил от начала[b], сделал их мужчиной и женщиной?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не читали ли вы…?»'
    reason: Лексико-стилистический вариант передачи отрицательного вопроса.
  - marker: b
    text: 'Буквально: «Тот, Кто сотворил от начала»; ὁ κτίσας также можно передать: «Творец».'
    reason: Сохраняет более буквальную передачу субстантивированного причастия и отмечает возможный вариант, не меняя синтаксической связи «от начала» с «сотворил».
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Он ответил
  rationale: Обычная греческая конструкция с причастием и личной формой глагола естественно передаётся одним русским глаголом; буквальное «ответив, сказал» было бы тяжеловесным.
- source_word: Οὐκ ἀνέγνωτε
  choice: Разве вы не читали
  rationale: Отрицательный вопрос выражает упрёк и обращение к известному собеседникам тексту Писания. Такая форма естественна для современного русского языка.
- source_word: ὁ κτίσας
  choice: Тот, Кто сотворил
  rationale: Передача сохраняет форму субстантивированного причастия и не превращает её без необходимости в титул «Творец».
- source_word: ἀπ’ ἀρχῆς
  choice: изначально
  rationale: Наречие естественно передаёт смысл «от начала» и сохраняет связь с повествованием о творении; его положение допускает связь с действием сотворения.
- source_word: ἄρσεν καὶ θῆλυ
  choice: мужчиной и женщиной
  rationale: Эта формулировка передаёт творческую пару мужского и женского пола в применении к людям и естественно сочетается по-русски с «создал их».
- source_word: ἐποίησεν αὐτούς
  choice: создал их
  rationale: Глагол «создал» ясно передаёт ἐποίησεν в контексте творения, а местоимение «их» сохраняет множественное число оригинала.
theological_decisions:
- issue: Связь высказывания с Бытие 1:27
  choice: Сохранить в основном тексте сотворённую пару «мужчиной и женщиной» без поясняющего богословского пересказа.
  alternative: «создал их мужского и женского пола»
  rationale: Иисус непосредственно обращается к рассказу о творении. Выбранная формулировка сохраняет человеческий и сотворённый характер пары, не добавляя выводов, которых сам стих прямо не формулирует.
- issue: Синтаксическая связь ἀπ’ ἀρχῆς
  choice: Передать как «сотворил их изначально», сохраняя связь выражения с действием творения.
  alternative: «в начале Тот, Кто сотворил их»
  rationale: Греческий порядок допускает некоторую синтаксическую напряжённость. Русская формулировка естественно связывает оборот с сотворением, не превращая его в отдельное временное вводное обстоятельство всего утверждения.
translation_notes:
  register: Современный литературный русский язык, с уважительным и ясным библейским звучанием. Обращение «вы» соответствует множественному числу. Прописная буква в «Кто» употреблена как русская издательская норма при обозначении Бога, не меняя синтаксиса исходного текста.
