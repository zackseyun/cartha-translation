  text: λέγει αὐτῷ ὁ νεανίσκος· ⸂Πάντα ταῦτα⸃ ⸀ἐφύλαξα· τί ἔτι ὑστερῶ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/020.yaml
  text: The young man says to him[a], “All these I have kept[b]. What do I still lack?”
translation:
  language: ru
  text: 'Юноша говорит ему: «Всё это я соблюдал. Чего мне ещё недостаёт?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: говорит
  rationale: Сохранено историческое настоящее греческого повествования; в русском библейском рассказе оно звучит естественно.
- source_word: αὐτῷ
  choice: ему
  rationale: Естественная передача дательного местоимения при глаголе речи.
- source_word: ὁ νεανίσκος
  choice: юноша
  rationale: Точно передаёт обозначение молодого мужчины, не привнося отсутствующее здесь указание на его положение.
- source_word: Πάντα ταῦτα
  choice: всё это
  rationale: Естественно относится ко всем только что названным заповедям.
- source_word: ἐφύλαξα
  choice: я соблюдал
  rationale: В контексте заповедей φυλάσσω означает «соблюдать». Прошедшее время передаёт аорист и утверждение о поведении до настоящего момента, не усиливая его дополнительной оценкой.
- source_word: τί ἔτι ὑστερῶ
  choice: Чего мне ещё недостаёт?
  rationale: Идиоматически передаёт вопрос об остающемся недостатке и сохраняет смысл ὑστερέω — «испытывать недостаток, не иметь, недоставать».
theological_decisions:
- issue: Самооценка соблюдения заповедей
  choice: Высказывание юноши передано прямо, без указания на одобрение, ошибочность или иронию.
  alternative: Можно было бы формулировкой намекнуть, что его заявление преувеличено или ошибочно.
  rationale: Греческий текст сам по себе просто сообщает утверждение юноши; его богословская оценка должна следовать из контекста, а не вноситься переводом.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным регистром. Формулировка лаконична и понятна; «соблюдал» естественно сочетается с заповедями, а «Чего мне ещё недостаёт?» сохраняет открытость вопроса.
