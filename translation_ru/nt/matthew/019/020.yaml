  source_fidelity: 'Текст точно передаёт греческий оригинал: «юноша» соответствует ὁ νεανίσκος, историческое настоящее «говорит» — λέγει, «всё это» — Πάντα ταῦτα, а «соблюдал» уместно передаёт ἐφύλαξα в контексте заповедей. Вопрос «Чего мне ещё недостаёт?» естественно и без лишней интерпретации выражает τί ἔτι ὑστερῶ; личная форма «мне» корректно отражает подразумеваемое в греческом «я».'
