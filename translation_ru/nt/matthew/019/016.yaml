  text: Καὶ ἰδοὺ εἷς προσελθὼν ⸂αὐτῷ εἶπεν⸃· ⸀Διδάσκαλε, τί ἀγαθὸν ποιήσω ἵνα ⸀σχῶ ζωὴν αἰώνιον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/016.yaml
  text: And behold[a], one who had come up to him said, “Teacher, what good thing must I do so that I may have eternal life?”
translation:
  language: ru
  text: 'И вот некто, подойдя к Нему, спросил: «Учитель, что доброго[a] мне сделать, чтобы иметь вечную жизнь?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «какое доброе дело мне совершить…?» Греческое выражение τί ἀγαθὸν может означать как «что доброе», так и, в сочетании с глаголом «делать», «какое доброе дело».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: И вот
  rationale: Сохраняет связующую силу καί и привлекающую внимание, оживляющую повествование функцию ἰδού; по-русски звучит естественно и достойно.
- source_word: εἷς
  choice: некто
  rationale: Передаёт неопределённое обозначение одного человека, не добавляя преждевременно сведений о его поле, возрасте или богатстве.
- source_word: προσελθὼν
  choice: подойдя
  rationale: 'Деепричастие естественно передаёт аористное причастие и последовательность действий: человек сначала подошёл, затем заговорил.'
- source_word: αὐτῷ εἶπεν
  choice: к Нему, спросил
  rationale: Местоимение передано явно; «спросил» соответствует форме следующей прямой речи и естественнее русского буквального «сказал» в данном контексте.
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Прямое и общепонятное соответствие обращению к наставнику, без лишних оттенков господства.
- source_word: τί ἀγαθὸν
  choice: что доброго
  rationale: Сохраняет субстантивированное и несколько открытое выражение греческого текста, которое может обозначать доброе дело или нечто доброе вообще.
- source_word: ποιήσω
  choice: мне сделать
  rationale: Естественно передаёт делиберативный аористный конъюнктив в русском вопросе, не усиливая его до категорического обязательства.
- source_word: ἵνα σχῶ
  choice: чтобы иметь
  rationale: Передаёт целевую связь ἵνα и прямое значение ἔχω — «иметь», не подменяя его более толковательным «обрести».
- source_word: ζωὴν αἰώνιον
  choice: вечную жизнь
  rationale: Устоявшееся, точное и понятное соответствие словосочетанию в данном контексте.
theological_decisions:
- issue: Следует ли уже в этом стихе назвать говорящего мужчиной, юношей или богатым человеком
  choice: некто
  alternative: один человек; один мужчина; богатый юноша
  rationale: εἷς само по себе здесь означает «один/некто». Дополнительные характеристики не следует вносить из дальнейшего контекста или параллельных повествований.
- issue: Как передать ориентированный на действие вопрос о вечной жизни
  choice: что доброго мне сделать, чтобы иметь вечную жизнь?
  alternative: какое доброе дело мне совершить, чтобы обрести вечную жизнь?
  rationale: Формулировка сохраняет вопрос говорящего о поступке и цели, не предрешая богословски отношение дел, заслуги и спасения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «И вот» сохраняет повествовательную выразительность, а «некто» — неопределённость оригинала. Местоимение «Нему» написано с прописной буквы согласно распространённой русской библейской издательской норме.
