  text: Ὁ δὲ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Ἀμὴν λέγω ὑμῖν ὅτι ⸂πλούσιος δυσκόλως⸃ εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/023.yaml
  text: Then Jesus said to his disciples[a], “Truly I say to you[b], a rich man will enter the kingdom of heaven with difficulty.”
translation:
  language: ru
  text: 'Тогда Иисус сказал своим ученикам: «Истинно говорю вам: богатый с трудом войдёт в Небесное Царство».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Тогда
  rationale: Передаёт переход и развитие повествования естественным для современного русского языка способом.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: своим ученикам
  rationale: Сохраняет явно выраженную принадлежность и естественно передаёт μαθηταί в евангельском контексте.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Истинно говорю вам
  rationale: Передаёт торжественную удостоверительную формулу Иисуса ясно, весомо и без ненужной транслитерации.
- source_word: πλούσιος
  choice: богатый
  rationale: Субстантивированное прилагательное мужского рода передано прилагательным в значении представительного отдельного человека; мужской род оригинала сохранён.
- source_word: δυσκόλως
  choice: с трудом
  rationale: Точно выражает затруднённость действия, не усиливая смысл до почти полной невозможности, которая подробнее раскрывается в следующем стихе.
- source_word: εἰσελεύσεται
  choice: войдёт
  rationale: Прямо и естественно передаёт форму будущего времени εἰσέρχομαι.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: Небесное Царство
  rationale: Устоявшаяся и понятная русская передача характерного для Матфея выражения; сохраняет понятие царства, а множественное число οὐρανῶν передаётся идиоматически.
theological_decisions:
- issue: Род субстантивированного прилагательного πλούσιος
  choice: богатый
  alternative: богатый человек
  rationale: Краткая форма сохраняет мужской род и обобщающий характер высказывания, не добавляя отсутствующего в греческом существительного.
- issue: Передача Ἀμὴν в формуле Иисуса
  choice: Истинно
  alternative: Аминь
  rationale: «Истинно» ясно передаёт удостоверительную и торжественную силу формулы в современной русской речи, не устраняя её весомости.
- issue: Степень затруднения в δυσκόλως
  choice: с трудом
  alternative: едва ли
  rationale: Выбрана передача способа действия без преждевременного превращения высказывания в утверждение о почти полной невозможности; напряжение развивается в следующем стихе.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельской речи. Синтаксис краткий и естественный; формула «Истинно говорю вам» сохраняет торжественность, а «с трудом» — смысловую меру греческого наречия.
