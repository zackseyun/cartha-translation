  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Εἰ θέλεις τέλειος εἶναι, ὕπαγε πώλησόν σου τὰ ὑπάρχοντα καὶ ⸀δὸς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/021.yaml
  text: Jesus said to him[a], “If you want to be perfect, go, sell your possessions and give to the poor, and you will have treasure in heaven; then come, follow me.”
translation:
  language: ru
  text: 'Иисус сказал ему: «Если хочешь быть совершенным[a], пойди, продай своё имущество и раздай бедным — и у тебя будет сокровище на небесах. Затем приди и следуй за Мной».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «цельным»; греческое слово может также означать «достигшим полноты» или «зрелым».'
    reason: Лексема τέλειος имеет диапазон значений «совершенный, полный, цельный, зрелый»; сноска сохраняет эту неоднозначность и предостерегает от неоправданно узкого прочтения.
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Иисус сказал ему
  rationale: Естественная русская передача обычной повествовательной формулы речи без добавления оттенков, отсутствующих в греческом тексте.
- source_word: τέλειος
  choice: совершенным
  rationale: Основное и контекстуально уместное соответствие, способное обозначать достигшего полноты или цельности; возможные оттенки раскрыты в сноске, чтобы не сводить слово только к безгрешности.
- source_word: ὕπαγε
  choice: пойди
  rationale: Прямой и естественный перевод повелительной формы, вводящей последующие действия.
- source_word: πώλησόν σου τὰ ὑπάρχοντα
  choice: продай своё имущество
  rationale: τὰ ὑπάρχοντα обозначает принадлежащее человеку имущество; выбранная формулировка кратка и естественна.
- source_word: δὸς πτωχοῖς
  choice: раздай бедным
  rationale: В русском языке «раздай бедным» естественно передаёт передачу вырученного или имущества нуждающимся; дополнение не уточняется сверх исходного текста.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: у тебя будет сокровище на небесах
  rationale: Сохранены будущее время, образ сокровища и множественное число οὐρανοῖς, которое по-русски естественно передаётся как «на небесах».
- source_word: δεῦρο
  choice: потом приходи
  rationale: Передаёт призыв прийти к Иисусу после исполнения предшествующих повелений; «потом» ясно выражает последовательность, заданную контекстом.
- source_word: ἀκολούθει μοι
  choice: следуй за Мной
  rationale: Точная и устоявшаяся передача евангельского призыва к ученичеству; прописная буква соответствует принятому русскому библейскому регистру.
theological_decisions:
- issue: Смысл τέλειος применительно к ученичеству
  choice: совершенным
  alternative: цельным; достигшим полноты; зрелым
  rationale: «Совершенным» непосредственно передаёт силу греческого слова и сохраняет требование полной преданности, не определяя само по себе, идёт ли речь о безгрешном совершенстве. Семантическая широта отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельского повествования. Повеления сформулированы ясно и естественно; тире подчёркивает связь между раздачей бедным и обещанием небесного сокровища. Местоимение «Мной» написано с прописной буквы по распространённой русской библейской традиции.
