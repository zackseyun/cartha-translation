  text: καὶ ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/046.yaml
  text: And these will go away into eternal punishment[a], but the righteous into eternal life.
translation:
  language: ru
  text: И эти уйдут на вечное наказание[a], а праведные — в вечную жизнь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наказание, длящееся целый век»; соответственно далее: «жизнь, длящаяся целый век». Значение прилагательного αἰώνιος в некоторых контекстах спорно, однако здесь одно и то же слово определяет и «наказание», и «жизнь», поэтому в основном тексте параллелизм сохранён словом «вечное» в обеих частях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελεύσονται
  choice: уйдут
  rationale: Будущая форма ἀπέρχομαι обозначает удаление, уход. «Уйдут» естественно звучит по-русски и сохраняет смысл движения без дополнительных толкований.
- source_word: οὗτοι
  choice: эти
  rationale: Указательное местоимение отсылает к ранее названной группе и кратко сохраняет противопоставление праведным.
- source_word: κόλασιν
  choice: наказание
  rationale: В контексте суда κόλασις означает наказание или кару; нейтральное и ясное «наказание» не привносит идеи исправительной меры.
- source_word: αἰώνιον
  choice: вечное / вечную
  rationale: Одно и то же прилагательное определяет и наказание, и жизнь. Одинаковая передача корнем «вечн-» сохраняет намеренный параллелизм греческого текста.
- source_word: δίκαιοι
  choice: праведные
  rationale: Субстантивированное прилагательное обозначает людей, характеризуемых как праведные. «Праведные» — естественный и устоявшийся русский эквивалент.
- source_word: ζωὴν
  choice: жизнь
  rationale: Прямой и контекстуально достаточный эквивалент ζωή.
- source_word: δὲ
  choice: а
  rationale: Частица выражает противопоставление двух групп и исходов. Русское «а» естественнее, чем усиленное «но», в данной симметричной конструкции.
theological_decisions:
- issue: Передача αἰώνιον в сочетаниях κόλασιν αἰώνιον и ζωὴν αἰώνιον
  choice: Передать αἰώνιον как «вечное» в обеих частях стиха
  alternative: «длящееся век» / «вековое» в обеих частях
  rationale: Одно прилагательное параллельно относится к наказанию и жизни, поэтому перевод не должен приписывать им разную продолжительность или природу. «Вечное» — естественная и лексически обоснованная передача в этом контексте; спорная альтернатива отмечена в сноске без разрешения богословского спора в основном тексте.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной структурой. Тире восполняет опущенный во второй части глагол и естественно передаёт греческий эллипсис. Союз «а» ясно и без излишнего усиления выражает контраст.
