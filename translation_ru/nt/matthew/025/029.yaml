id: MAT.25.29
reference: Matthew 25:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τῷ γὰρ ἔχοντι παντὶ δοθήσεται καὶ περισσευθήσεται· ⸂τοῦ δὲ⸃ μὴ ἔχοντος καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/029.yaml
  text: For to everyone who has[a], more will be given, and he will have an abundance; but from the one who does not have, even what he has will be taken away from him.
translation:
  language: ru
  text: Ведь всякому, кто имеет, будет дано, и он будет иметь с избытком[a]; а у того, кто не имеет, будет отнято даже то, что он имеет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и будет изобиловать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ γὰρ ἔχοντι παντὶ
  choice: Ведь всякому, кто имеет
  rationale: Дательный артиклевого причастия с παντί имеет субстантивированное и распределительное значение. «Всякому, кто имеет» сохраняет обобщённую форму единственного числа, а «ведь» естественно передаёт пояснительную связь γάρ с предыдущим высказыванием.
- source_word: δοθήσεται
  choice: будет дано
  rationale: Будущее страдательного залога от δίδωμι передано без указания действующего лица, как и в греческом тексте.
- source_word: καὶ περισσευθήσεται
  choice: и он будет иметь с избытком
  rationale: Форма περισσεύω обозначает состояние изобилия или избытка как результат получения. Русское выражение естественно в контексте и не добавляет отсутствующего в греческом тексте прямого дополнения.
- source_word: τοῦ δὲ μὴ ἔχοντος
  choice: а у того, кто не имеет
  rationale: Родительный артиклевого причастия связан с последующим ἀπ’ αὐτοῦ и обозначает того, от кого нечто отнимается. Формулировка сохраняет контраст и обобщённое единственное число.
- source_word: καὶ ὃ ἔχει
  choice: даже то, что он имеет
  rationale: 'καί употреблено усилительно: парадокс подчёркивается тем, что будет отнято даже уже имеющееся.'
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: будет отнято ... у того
  rationale: Будущее страдательного залога от αἴρω передаёт удаление или лишение; русская конструкция «отнять у кого-либо» естественно выражает значение ἀπό с родительным.
theological_decisions:
- issue: Обобщённое мужское единственное число в причастных конструкциях
  choice: 'Сохранить единственное число: «всякому, кто… он» и «у того, кто… он»'
  alternative: 'Передать множественным числом: «тем, кто имеет… у них»'
  rationale: Греческий текст использует грамматически мужские формы единственного числа с обобщённым значением. Русское единственное число сохраняет структуру и личную направленность изречения, не ограничивая его применение только мужчинами.
- issue: Неуказанный предмет обладания
  choice: Не уточнять, что именно человек «имеет» и получит в избытке
  alternative: Добавить по контексту «дары», «таланты», «имущество» или «верность»
  rationale: Греческое изречение намеренно не называет предмет обладания. Его конкретизация устранила бы смысловую широту и могла бы привнести богословское толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. «Ведь» сохраняет пояснительную связь со сказанным выше; повтор «имеет» намеренно удерживает формальную и смысловую параллель греческого текста. Маркер сноски поставлен непосредственно после выражения, к которому относится лексическая альтернатива.
