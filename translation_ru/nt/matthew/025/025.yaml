  text: καὶ φοβηθεὶς ἀπελθὼν ἔκρυψα τὸ τάλαντόν σου ἐν τῇ γῇ· ἴδε ἔχεις τὸ σόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/025.yaml
  text: And being afraid[a], I went away and hid your talent in the ground. Look, you have what is yours.
translation:
  language: ru
  text: Испугавшись, я ушёл и спрятал твой талант[a] в земле. Вот твоё.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Талант — крупная весовая и денежная единица; здесь речь не о природной способности.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθεὶς
  choice: испугавшись
  rationale: Деепричастие передаёт обстоятельственное употребление аористного причастия и прямо указывает на страх как мотив поступка, не истолковывая его как благоговение.
- source_word: ἀπελθὼν
  choice: ушёл
  rationale: Аористное причастие обозначает действие, предшествующее сокрытию. Русская последовательность «ушёл и спрятал» звучит естественно и сохраняет порядок действий.
- source_word: ἔκρυψα
  choice: спрятал
  rationale: Прямой эквивалент κρύπτω — «спрятать, скрыть». Значение «закопал» возможно по контексту, но точнее выражено последующим оборотом «в земле», а не самим глаголом.
- source_word: τὸ τάλαντόν σου
  choice: твой талант
  rationale: «Талант» — историческое название крупной весовой и денежной единицы. Термин сохраняет образный строй притчи; сноска предотвращает современное понимание слова как природной способности.
- source_word: ἐν τῇ γῇ
  choice: в земле
  rationale: В данном контексте γῆ обозначает землю как место, где было спрятано имущество; «в земле» — точное и естественное русское выражение.
- source_word: ἴδε
  choice: вот
  rationale: Указательное «вот» естественно передаёт призыв обратить внимание без архаического оттенка.
- source_word: ἔχεις τὸ σόν
  choice: твоё
  rationale: В сочетании «Вот твоё» естественно передаётся эллиптическое греческое выражение с акцентом на принадлежности господину. Более буквальное «у тебя то, что твоё» по-русски тяжеловесно, а «возьми своё» добавляет не выраженное в тексте повеление.
theological_decisions:
- issue: Значение τάλαντον в притче, которую нередко связывают с природными способностями
  choice: Сохранить в основном тексте исторический денежный термин «талант», пояснив его в сноске.
  alternative: «крупная сумма денег»
  rationale: В данном месте греческое слово обозначает высокоценную весовую и денежную единицу, а не природную одарённость. Сохранение исторического термина не навязывает позднейшего переносного смысла благодаря явному пояснению.
translation_notes:
  register: Современный литературный русский язык; речь слуги звучит прямо и естественно. Сохранены последовательность действий, заявленный мотив страха и сдержанная, несколько резкая формула возвращения имущества.
