  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε τὴν ἡμέραν οὐδὲ τὴν ⸀ὥραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/013.yaml
  text: Therefore[a], stay awake, because you do not know the day or the hour.
translation:
  language: ru
  text: Итак, бодрствуйте[a], потому что вы не знаете ни дня, ни часа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не спите»; «будьте бдительны». Греческая форма повеления подразумевает постоянное бодрствование.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: бодрствуйте
  rationale: Настоящее повелительное наклонение во множественном числе выражает постоянную бдительность. «Бодрствуйте» естественно для современного литературного русского языка и сохраняет образ бодрствования в контексте притчи.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предшествующей притчи и звучит естественно по-русски.
- source_word: ὅτι
  choice: потому что
  rationale: 'Ясно передаёт причинное значение союза: незнание времени служит основанием для повеления бодрствовать.'
- source_word: οὐκ οἴδατε
  choice: вы не знаете
  rationale: Прямо передаёт отрицательную форму глагола знания во втором лице множественного числа без смыслового расширения.
- source_word: τὴν ἡμέραν οὐδὲ τὴν ὥραν
  choice: ни дня, ни часа
  rationale: Русская конструкция «не знаете ни дня, ни часа» естественно и точно передаёт два однородных отрицательных элемента, не уточняя подразумеваемое событие.
theological_decisions:
- issue: Образ постоянной бдительности в повелении
  choice: бодрствуйте
  alternative: не спите; будьте бдительны
  rationale: Выбранный вариант сохраняет метафору бодрствования и призыв к постоянной готовности, не сводя его ни к буквальному отсутствию сна, ни к определённой эсхатологической схеме.
- issue: Смысл выражения «ни дня, ни часа»
  choice: сохранить выражение без поясняющего добавления
  alternative: ни дня, ни часа прихода Сына Человеческого; назначенного времени
  rationale: Хотя контекст указывает на грядущее пришествие и суд, сам стих не называет событие прямо. Перевод не добавляет отсутствующей в греческом тексте конкретизации.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и понятная формулировка. «Итак» обозначает вывод, а симметричное «ни дня, ни часа» сохраняет ритм и неопределённость исходного текста.
