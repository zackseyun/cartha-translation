  text: πότε δέ σε εἴδομεν ξένον καὶ συνηγάγομεν, ἢ γυμνὸν καὶ περιεβάλομεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/038.yaml
  text: And when did we see you as a stranger and take you in[c][b][a], or naked and clothe you?
translation:
  language: ru
  text: Когда же мы видели тебя странником[a] и приняли у себя[b], или нагим[c] и одели?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чужеземцем». Греческое слово может обозначать незнакомого, чужого или пришлого человека; здесь речь идёт о том, кто нуждается в гостеприимстве.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «собрали» или «приняли»; в данном контексте — оказали гостеприимство, приняв к себе.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «плохо одетым», «без достаточной одежды». Греческое слово может означать как полную наготу, так и нехватку необходимой одежды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: когда
  rationale: Естественное русское вопросительное наречие, передающее вопрос о времени.
- source_word: δέ
  choice: же
  rationale: Мягко связывает этот вопрос с предыдущим и поддерживает последовательность вопросов без излишне сильного противопоставления.
- source_word: ξένον
  choice: странником
  rationale: Передаёт человека чужого, незнакомого и нуждающегося в гостеприимстве; творительный падеж естественен после «видели тебя» в данном значении.
- source_word: συνηγάγομεν
  choice: приняли у себя
  rationale: В контексте гостеприимства глагол означает принять человека, дать ему место у себя; выражение сохраняет конкретный характер поступка и звучит естественно по-русски.
- source_word: γυμνὸν
  choice: нагим
  rationale: Сохраняет прямое значение греческого слова и традиционную для библейского регистра формулировку, не исключая контекстуального смысла нехватки одежды.
- source_word: περιεβάλομεν
  choice: одели
  rationale: 'Кратко и точно передаёт действие: дать человеку одежду или облачить его.'
theological_decisions:
- issue: Значение ξένος в описании дел милосердия
  choice: странник
  alternative: чужеземец
  rationale: «Странник» сохраняет акцент на незнакомом человеке, которому требуется гостеприимство, и не сужает значение до этнического или государственного происхождения.
- issue: Обращение к царю в притче
  choice: местоимение «тебя» со строчной буквы
  alternative: «Тебя» с прописной буквы
  rationale: Греческий текст не кодирует почтительную прописную букву; строчная форма не предрешает христологическое толкование и соответствует современной русской издательской практике.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. Формулировка остаётся ясной для широкого круга читателей; «нагим» сохраняет достоинство и краткость исходного выражения, а примечания раскрывают его смысловой диапазон.
