  source_fidelity: Текст точно передаёт последовательность τότε, обращение к группе «слева», повеление удалиться от говорящего, обращение «проклятые», направленность «в вечный огонь» и указание, что этот огонь приготовлен для дьявола и его ангелов. Смысловые элементы греческого текста не опущены и не расширены.
  naturalness: Фраза звучит естественно на современном литературном русском. «Тогда Он скажет и тем, кто слева» адекватно продолжает симметричную судебную сцену, а «Уйдите от Меня» передаёт повелительный и торжественный характер речи без архаизации.
  terminology: «Вечный огонь», «дьявол» и «ангелы» — устоявшиеся, понятные и контекстуально точные соответствия. «Проклятые» корректно передаёт субстантивированное страдательное причастие οἱ κατηραμένοι. Написание местоимений с прописной буквы является допустимой издательской библейской конвенцией и не влияет на смысл.
