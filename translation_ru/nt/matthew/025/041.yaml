  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων· Πορεύεσθε ἀπ’ ἐμοῦ ⸀οἱ κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/041.yaml
  text: Then he will also say to those on the left[a], ‘Go away from me, you cursed, into the eternal fire prepared for the devil and his angels.’
translation:
  language: ru
  text: 'Тогда Он скажет и тем, кто слева: «Уйдите от Меня, проклятые, в вечный огонь, приготовленный для дьявола и его ангелов».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Передаёт временную последовательность в сцене суда естественно и точно.
- source_word: ἐρεῖ
  choice: Он скажет
  rationale: Будущее время λέγω передано без добавления оттенков, которых нет в греческом тексте.
- source_word: τοῖς ἐξ εὐωνύμων
  choice: тем, кто слева
  rationale: Естественное современное выражение для группы, находящейся слева от Царя в ближайшем контексте.
- source_word: Πορεύεσθε ἀπ’ ἐμοῦ
  choice: Уйдите от Меня
  rationale: Императив вместе с предложным оборотом выражает удаление от говорящего; русский глагол «уйдите» ясно передаёт эту силу.
- source_word: οἱ κατηραμένοι
  choice: проклятые
  rationale: Субстантивированное причастие в звательной функции передано кратким и сильным обращением без архаизма.
- source_word: εἰς τὸ πῦρ τὸ αἰώνιον
  choice: в вечный огонь
  rationale: Предлог «в» сохраняет направленность εἰς, а «вечный» является обычным и контекстуально уместным соответствием αἰώνιον.
- source_word: τὸ ἡτοιμασμένον
  choice: приготовленный
  rationale: Передаёт результат предшествующего приготовления, выраженный перфектным пассивным причастием.
- source_word: τῷ διαβόλῳ
  choice: для дьявола
  rationale: В эсхатологическом контексте διάβολος выступает как устойчивое личное обозначение, а не как общее «клеветник».
- source_word: τοῖς ἀγγέλοις αὐτοῦ
  choice: его ангелов
  rationale: В данном контексте ἄγγελοι обозначает сверхъестественных существ, связанных с дьяволом, а не человеческих посланников.
theological_decisions:
- issue: Значение αἰώνιον в контексте суда
  choice: вечный
  alternative: длящийся век / вековой
  rationale: «Вечный» — прямое и традиционно понятное соответствие в данном эсхатологическом контексте; оно сохраняет силу текста, не добавляя отдельной богословской системы.
- issue: Референты διάβολος и ἄγγελοι
  choice: дьявол и его ангелы
  alternative: клеветник и его посланники
  rationale: Контекст последнего суда и устойчивое новозаветное словоупотребление указывают на дьявола и связанных с ним духовных существ.
translation_notes:
  register: Современный литературный русский язык; прямая речь звучит строго и торжественно, но без устаревшей лексики. Местоимение «Он» и формы «Меня» оформлены с прописной буквы согласно распространённой русской библейской издательской практике.
