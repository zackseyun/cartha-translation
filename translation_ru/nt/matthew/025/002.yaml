  text: πέντε δὲ ⸂ἐξ αὐτῶν ἦσαν⸃ ⸂μωραὶ καὶ πέντε φρόνιμοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/002.yaml
  text: And five of them were foolish, and five were wise.
translation:
  language: ru
  text: Пять из них были неразумными, а пять — разумными.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέντε
  choice: пять
  rationale: Прямой перевод количественного числительного; повтор сохранён, чтобы передать уравновешенное противопоставление греческого текста.
- source_word: δὲ
  choice: а
  rationale: Частица здесь связывает повествование и одновременно вводит распределение на две противопоставленные группы; русское «а» естественно передаёт этот мягкий контраст.
- source_word: ἐξ αὐτῶν
  choice: из них
  rationale: Партитивное выражение указывает на часть ранее названной группы; «из них» — точный и естественный русский эквивалент.
- source_word: ἦσαν
  choice: были
  rationale: Имперфект εἰμί употреблён как связка в описании; русское прошедшее время «были» соответствует контексту.
- source_word: μωραὶ
  choice: неразумными
  rationale: μωρός обозначает отсутствие здравого рассуждения. «Неразумными» сохраняет смысл и образует естественную контрастную пару с «разумными», не усиливая выражение до оскорбительного «глупыми».
- source_word: φρόνιμοι
  choice: разумными
  rationale: φρόνιμος означает разумный, рассудительный, благоразумный. В данном кратком противопоставлении «разумными» ясно и естественно соотносится с «неразумными».
theological_decisions: []
