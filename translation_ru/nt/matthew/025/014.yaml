id: MAT.25.14
reference: Matthew 25:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὥσπερ γὰρ ἄνθρωπος ἀποδημῶν ἐκάλεσεν τοὺς ἰδίους δούλους καὶ παρέδωκεν αὐτοῖς τὰ ὑπάρχοντα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/014.yaml
  text: For it is like a man going on a journey[a], who called his own slaves and entrusted his possessions to them.
translation:
  language: ru
  text: Ибо это подобно человеку, который, отправляясь в путь, позвал своих рабов[a] и доверил им своё имущество.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «слуг». Греческое слово δοῦλος может обозначать раба или слугу в зависимости от контекста; здесь выбрано «рабов», поскольку в притче заметны власть хозяина над ними и их зависимое положение.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: Ведь это подобно тому, как
  rationale: γάρ связывает сравнение с предшествующим наставлением, а ὥσπερ вводит уподобление. В русском добавлено «это» для естественного выражения подразумеваемой связи.
- source_word: ἄνθρωπος
  choice: человек
  rationale: В притче речь идёт о конкретном мужчине, однако обычное русское «человек» естественно обозначает здесь действующее лицо и не превращает его в обобщённое человечество.
- source_word: ἀποδημῶν
  choice: отправляясь в путь
  rationale: Причастие обозначает отъезд из дома в другое место; формулировка сохраняет смысл поездки, не уточняя без основания, что она была дальней или заграничной.
- source_word: ἐκάλεσεν
  choice: позвал
  rationale: Нейтральная и современная передача действия; «призвал» могло бы приобрести лишний религиозный оттенок, а «вызвал» — официальный.
- source_word: τοὺς ἰδίους δούλους
  choice: своих рабов
  rationale: δοῦλοι обозначает людей, находящихся во власти хозяина; в этой притче его собственность и полномочия особенно заметны. ἰδίους естественно передано притяжательным «своих».
- source_word: παρέδωκεν
  choice: доверил
  rationale: В данном контексте имущество передаётся под ответственность рабов, поэтому «доверил» точнее по смыслу, чем механическое «передал».
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: своё имущество
  rationale: Выражение означает всё принадлежавшее хозяину; «имущество» ясно и естественно для экономического контекста притчи.
theological_decisions:
- issue: Передача δοῦλος в контексте хозяйской власти
  choice: рабы
  alternative: слуги
  rationale: Выбрано «рабы», поскольку контекст подчёркивает власть хозяина и распоряжение его собственностью. Слово «слуги» возможно по функции, но может смягчить социальную зависимость, выраженную δοῦλος.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным тоном. Синтаксис сохраняет пояснительное сравнение и связь с предыдущим контекстом, не устраняя исходную эллиптичность чрезмерным уточнением.
