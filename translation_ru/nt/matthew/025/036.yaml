  text: γυμνὸς καὶ περιεβάλετέ με, ἠσθένησα καὶ ἐπεσκέψασθέ με, ἐν φυλακῇ ἤμην καὶ ἤλθατε πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/036.yaml
  text: I was naked and you clothed me[a]; I was sick and you visited me[b]; I was in prison and you came to me.
translation:
  language: ru
  text: Я был без одежды, и вы одели меня; был болен, и вы навестили меня[a]; был в тюрьме, и вы пришли ко мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «позаботились обо мне»; греческий глагол может обозначать посещение, совершаемое с заботой и участием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυμνὸς
  choice: наг
  rationale: Прямой и традиционный эквивалент со значением отсутствия одежды; в данном контексте может подразумеваться и нехватка необходимой одежды, однако параллельное «одели» поддерживает буквальную формулировку.
- source_word: περιεβάλετέ
  choice: одели
  rationale: Глагол περιβάλλω здесь означает надеть на человека одежду; «одели» кратко и естественно передаёт конкретное дело милосердия.
- source_word: ἠσθένησα
  choice: был болен
  rationale: Хотя ἀσθενέω может шире означать слабость, в ряду конкретных нужд наиболее вероятен смысл болезни.
- source_word: ἐπεσκέψασθέ
  choice: навестили
  rationale: Передаёт основное значение посещения; возможный оттенок заботы и попечения сохранён в сноске, а не внесён в основной текст как однозначное толкование.
- source_word: ἐν φυλακῇ
  choice: в тюрьме
  rationale: Естественное современное обозначение места заключения, соответствующее контексту.
- source_word: ἤλθατε πρός με
  choice: пришли ко мне
  rationale: Буквально и естественно передаёт простую греческую конструкцию, не добавляя отсутствующего в ней глагола «навестили».
theological_decisions:
- issue: Степень смыслового расширения при описании дел милосердия
  choice: 'Сохранены конкретные действия: «одели», «навестили», «пришли ко мне».'
  alternative: Передать ἐπεσκέψασθέ как «позаботились обо мне», а ἤλθατε πρός με как «пришли навестить меня».
  rationale: Греческий текст подчёркивает простые, осязаемые поступки. Расширительные формулировки могли бы сузить смысл или повторно внести идею посещения там, где сказано лишь о приходе.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достоинственным синтаксисом. Строчная буква в местоимениях «меня/мне» соответствует обычной современной орфографии и не вносит в исходный текст дополнительного конфессионального оформления.
