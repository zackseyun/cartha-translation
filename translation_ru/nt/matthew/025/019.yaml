  text: μετὰ δὲ ⸂πολὺν χρόνον⸃ ἔρχεται ὁ κύριος τῶν δούλων ἐκείνων καὶ συναίρει ⸂λόγον μετ’ αὐτῶν⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/019.yaml
  text: After a long time[a], the master of those slaves comes and settles accounts with them.
translation:
  language: ru
  text: Спустя долгое время господин тех рабов приходит и производит с ними расчёт.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческая идиома означает «сводит (урегулирует) с ними счета», то есть производит расчёт. Греческое κύριος может означать «господин», «хозяин» или «Господь», а δοῦλος — «раб» или «слуга».
    reason: Поясняет хозяйственно-расчётное значение идиомы и лексическую многозначность ключевых слов, избегая современного побочного значения выражения «сводить счёты».
lexical_decisions:
- source_word: μετὰ δὲ πολὺν χρόνον
  choice: Спустя долгое время
  rationale: Передаёт временное значение μετά с винительным; слабое связующее δέ естественно не выражать отдельно по-русски.
- source_word: ἔρχεται
  choice: возвращается
  rationale: Историческое настоящее сохранено. В контексте ухода господина и последующего расчёта естественное русское «возвращается» яснее передаёт подразумеваемое прибытие обратно, хотя буквально глагол означает «приходит».
- source_word: ὁ κύριος
  choice: господин
  rationale: В притче слово обозначает хозяина по отношению к рабам, а не прямо христологический титул «Господь».
- source_word: τῶν δούλων ἐκείνων
  choice: тех рабов
  rationale: «Рабы» сохраняет выраженный в хозяйственно-правовом контексте несвободный статус, который более мягкое «слуги» могло бы затушевать.
- source_word: συναίρει λόγον μετ’ αὐτῶν
  choice: требует у них отчёта
  rationale: Естественно передаёт идиому о сведении счетов и привлечении к отчёту; в данном контексте речь идёт о проверке доверенного имущества.
theological_decisions:
- issue: Передача κύριος в притче
  choice: господин
  alternative: Господь; хозяин
  rationale: Строчная буква и слово «господин» обозначают роль персонажа притчи, не навязывая прямого титульного отождествления, но и не устраняя возможного более широкого смысла притчи.
- issue: Передача δοῦλος
  choice: раб
  alternative: слуга
  rationale: В отношениях собственности и управления имуществом несвободный статус существенен; «слуга» сделал бы социальную реальность исходного слова менее явной.
- issue: Передача συναίρει λόγον
  choice: требует отчёта
  alternative: сводит с ними счёты; производит с ними расчёт
  rationale: «Требует отчёта» ясно выражает подотчётность и избегает современного побочного значения выражения «сводить счёты» — мстить.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Историческое настоящее сохранено для повествовательной живости. Выражение «сводит счёты» вынесено в примечание из-за распространённого значения «мстит»; основной текст передаёт смысл идиомы естественным русским оборотом.
