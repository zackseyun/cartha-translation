language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τότε ἐρεῖ ὁ βασιλεὺς τοῖς ἐκ δεξιῶν αὐτοῦ· Δεῦτε, οἱ εὐλογημένοι τοῦ πατρός μου, κληρονομήσατε τὴν ἡτοιμασμένην ὑμῖν βασιλείαν ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/034.yaml
  text: Then the King will say to those on his right[a], ‘Come, you who are blessed by my Father[b], inherit the kingdom prepared for you from the foundation of the world.’
translation:
  language: ru
  text: 'Тогда Царь скажет тем, кто справа от Него: «Придите, благословлённые Моим Отцом[a], наследуйте Царство, приготовленное для вас от основания мира[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «благословенные Отца Моего».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «со времени основания мира».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественно передаёт временную последовательность событий в сцене суда.
- source_word: ἐρεῖ
  choice: скажет
  rationale: Будущее время λέγω в формуле введения прямой речи естественно передаётся глаголом «скажет».
- source_word: ὁ βασιλεὺς
  choice: Царь
  rationale: Определённое обозначение эсхатологического Судьи; прописная буква уместна как у титульного наименования конкретного лица.
- source_word: τοῖς ἐκ δεξιῶν αὐτοῦ
  choice: тем, кто по правую руку от Него
  rationale: Сохраняет пространственный образ правой стороны и его оттенок почётного положения, оставаясь естественным для современного русского языка.
- source_word: Δεῦτε
  choice: Придите
  rationale: Кратко и торжественно передаёт повелительный призыв.
- source_word: οἱ εὐλογημένοι τοῦ πατρός μου
  choice: благословлённые Моим Отцом
  rationale: Перфектное страдательное причастие передано как сохраняющееся состояние, а родительный падеж — как указание на источник или деятеля благословения.
- source_word: κληρονομήσατε
  choice: наследуйте
  rationale: Сохраняет образ наследства и связанные с ним семейные и заветные оттенки, в отличие от общего «получите».
- source_word: τὴν ... βασιλείαν
  choice: Царство
  rationale: В сочетании с наследованием и приготовлением речь естественно понимается как об эсхатологическом Царстве, при этом слово не исключает смысла царствования.
- source_word: ἡτοιμασμένην ὑμῖν
  choice: приготовленное для вас
  rationale: Передаёт завершённость приготовления и его сохраняющийся результат без тяжеловесной конструкции.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: от основания мира
  rationale: Близко соответствует ἀπό и сохраняет устойчивый библейский образ основания мира.
theological_decisions:
- issue: Значение родительного τοῦ πατρός μου при εὐλογημένοι
  choice: «благословлённые Моим Отцом» — Отец представлен как источник или деятель благословения.
  alternative: 'Более буквально: «благословлённые Моего Отца».'
  rationale: Творительный падеж в современном русском ясно передаёт естественный смысл греческого родительного, не вводя дополнительного богословского содержания; буквальная форма отмечена в сноске.
- issue: Значение βασιλεία в контексте эсхатологического наследства
  choice: «Царство»
  alternative: «царствование» или «владычество»
  rationale: Сочетание с «наследуйте» и «приготовленное для вас» указывает прежде всего на наследуемое эсхатологическое Царство, не устраняя более широкого смысла Божьего правления.
- issue: Синтаксическая связь ἀπὸ καταβολῆς κόσμου
  choice: Фраза отнесена к «приготовленное для вас».
  alternative: Отнести временную фразу более свободно ко всему приглашению.
  rationale: Связь с ближайшим причастием ἡτοιμασμένην синтаксически наиболее естественна и не требует привнесения внешней доктринальной схемы.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Сохранены ключевые образы царя, наследства, Царства и основания мира. Местоимение «Него» и титул «Царь» написаны с прописной буквы как уважительные контекстуальные обозначения, без добавления конфессиональной интерпретации.
