  text: αἱ δὲ μωραὶ ταῖς φρονίμοις εἶπαν· Δότε ἡμῖν ἐκ τοῦ ἐλαίου ὑμῶν, ὅτι αἱ λαμπάδες ἡμῶν σβέννυνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/008.yaml
  text: But the foolish said to the wise[a], ‘Give us some of your oil, because our lamps are going out.’
translation:
  language: ru
  text: 'А неразумные сказали разумным: «Дайте нам немного вашего масла, потому что наши светильники[a] гаснут».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «факелы» (греч. λαμπάδες); слово может обозначать переносной горящий источник света, и образ в этой сцене понимают по-разному.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωραὶ
  choice: неразумные
  rationale: Субстантивированное прилагательное обозначает неразумных девушек из притчи и естественно противопоставляется слову «разумным».
- source_word: φρονίμοις
  choice: разумным
  rationale: В данном контексте слово указывает на практическую рассудительность и готовность; «разумным» сохраняет прямое противопоставление.
- source_word: Δότε
  choice: Дайте
  rationale: Аористный императив во множественном числе передан прямой просьбой-повелением.
- source_word: ἐκ τοῦ ἐλαίου ὑμῶν
  choice: немного вашего масла
  rationale: 'Предлог ἐκ с родительным имеет партитивный смысл: речь идёт о части имеющегося у них масла.'
- source_word: λαμπάδες
  choice: светильники
  rationale: Слово может обозначать переносной масляный светильник или факел; «светильники» естественно сочетается с упоминанием масла и сохраняет традиционно понятный образ.
- source_word: σβέννυνται
  choice: гаснут
  rationale: Настоящее время передаёт происходящий процесс угасания; краткое русское «гаснут» точно и естественно.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит причину просьбы и ясно передаётся современным русским оборотом.
theological_decisions: []
