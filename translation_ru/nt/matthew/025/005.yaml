  text: χρονίζοντος δὲ τοῦ νυμφίου ἐνύσταξαν πᾶσαι καὶ ἐκάθευδον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/005.yaml
  text: But while the bridegroom was delayed[b][a], they all became drowsy and fell asleep.
translation:
  language: ru
  text: Но пока жених задерживался[a], всех стало клонить ко сну, и они уснули.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пока жених долго не приходил».'
    reason: Лексический вариант для χρονίζοντος, подчёркивающий длительность ожидания без указания причины.
lexical_decisions:
- source_word: χρονίζοντος
  choice: пока … задерживался
  rationale: Настоящее причастие в родительном самостоятельном обороте обозначает сопутствующее затягивание ожидания; «пока … задерживался» естественно передаёт временную связь, не уточняя причину задержки.
- source_word: δὲ
  choice: Но
  rationale: 'Частица отмечает мягкий повествовательный поворот: ожидание жениха сменяется длительной задержкой и сном девушек.'
- source_word: τοῦ νυμφίου
  choice: жених
  rationale: Слово νυμφίος прямо обозначает жениха в свадебной сцене притчи; образ сохранён без внесения его богословского истолкования в текст.
- source_word: ἐνύσταξαν
  choice: стало клонить в сон
  rationale: Так передано наступление сонливости, предшествующее собственно сну; выражение естественно для современного русского языка и не смешивает два греческих глагола.
- source_word: πᾶσαι
  choice: всех их
  rationale: Форма женского рода относится ко всем десяти девушкам; конструкция ясно подчёркивает, что сонливость охватила каждую из них.
- source_word: ἐκάθευδον
  choice: уснули
  rationale: Перевод передаёт переход от сонливости к сну. Хотя греческий имперфект может также описывать продолжавшееся состояние («спали»), в данном сочетании естественная русская последовательность «клонило в сон — уснули» сохраняет развитие действия.
theological_decisions:
- issue: Образ жениха в притче
  choice: Сохранить повествовательное обозначение «жених» без явного христологического отождествления.
  alternative: Раскрыть образ пояснительным именованием или заменить его более общим обозначением.
  rationale: В более широком контексте Евангелия образ имеет богословский смысл, однако сам стих продолжает свадебную сцену притчи. Перевод сохраняет её образность и не подменяет текст толкованием.
- issue: Причина и характер задержки
  choice: Передать χρονίζοντος нейтрально как «задерживался».
  alternative: «Долго не приходил» или формулировка, подразумевающая внешнюю задержку.
  rationale: Греческий глагол сообщает о затягивании времени, но не объясняет, была ли задержка намеренной или вызванной внешними обстоятельствами.
translation_notes:
  register: Современный литературный русский язык, понятный широкой аудитории. Оборот «стало клонить в сон» естественно различает наступление сонливости и последующий сон; тон остаётся сдержанным и достойным.
