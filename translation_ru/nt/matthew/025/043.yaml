  text: ξένος ἤμην καὶ οὐ συνηγάγετέ με, γυμνὸς καὶ οὐ περιεβάλετέ με, ἀσθενὴς καὶ ἐν φυλακῇ καὶ οὐκ ἐπεσκέψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/043.yaml
  text: I was a stranger and you did not welcome me[a], naked and you did not clothe me[b], sick and in prison and you did not visit me.
translation:
  language: ru
  text: Я был странником, и вы не приняли меня[a]; был наг, и вы не одели меня; был болен и в тюрьме, и вы не навестили меня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не приютили меня», «не приняли меня у себя». Греческий глагол буквально означает «собирать», но здесь говорит о гостеприимном приёме странника.'
    reason: lexical_alternative
  - marker: b
    text: «Навестить» здесь может также означать «позаботиться», «оказать помощь», а не просто нанести обычный визит.
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένος
  choice: странник
  rationale: В данном перечне дел милосердия слово обозначает чужого человеку, нуждающегося в приёме и гостеприимстве. «Странник» естественно передаёт эту социальную уязвимость, не сужая значение до этнического «иностранец».
- source_word: συνηγάγετέ
  choice: приняли
  rationale: Хотя συνάγω буквально значит «собирать», в сочетании с ξένος глагол означает гостеприимно принять человека, дать ему место у себя. «Приняли» ясно и естественно передаёт смысл в современном русском языке.
- source_word: γυμνός
  choice: наг
  rationale: Слово может означать полную наготу или отсутствие достаточной одежды. Прямое «наг» сохраняет силу греческого выражения, а последующее «одели» проясняет нужду.
- source_word: περιεβάλετέ
  choice: одели
  rationale: Глагол буквально означает «облечь, надеть вокруг» и здесь обозначает снабжение одеждой. «Одели» — краткий и естественный русский эквивалент.
- source_word: ἀσθενής
  choice: болен
  rationale: Хотя слово может означать и общую слабость, в перечне конкретных нужд наиболее вероятен смысл физической болезни.
- source_word: ἐν φυλακῇ
  choice: в тюрьме
  rationale: Здесь φυλακή обозначает место заключения. «В тюрьме» — общеупотребительное и достаточно широкое соответствие.
- source_word: ἐπεσκέψασθέ
  choice: навестили
  rationale: Глагол обозначает посещение с участием и заботой, а не просто светский визит. «Навестили» сохраняет названное конкретное действие; оттенок заботы пояснён в сноске.
theological_decisions:
- issue: Оттенок милосердной заботы в ἐπεσκέψασθέ με
  choice: не навестили меня
  alternative: не позаботились обо мне
  rationale: Перевод «навестили» сохраняет конкретное действие греческого текста и не заменяет его более общим толкованием. При этом сноска отмечает присущий глаголу смысл заботливого участия.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и ритмически параллельным построением. Местоимение «меня» дано со строчной буквы по общим нормам современного русского текста, без внесения конфессиональной редакционной традиции.
