base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/007.yaml
  text: Then all those virgins got up and trimmed their lamps[a].
translation:
  language: ru
  text: Тогда все те девы встали и поправили свои светильники[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «факелы». Греческое слово λαμπάς может обозначать переносной светильник или факел; упоминание масла и подготовки допускает оба понимания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Передаёт временную последовательность событий естественным для современного русского повествования способом.
- source_word: ἠγέρθησαν
  choice: встали
  rationale: В данном контексте глагол означает, что девы поднялись после сна или отдыха; «встали» ясно и естественно, не навязывая возможного значения «были разбужены».
- source_word: πᾶσαι αἱ παρθένοι ἐκεῖναι
  choice: все те девы
  rationale: «Девы» сохраняет значение παρθένοι и соответствует контексту свадебной притчи; слово обладает библейской возвышенностью, оставаясь понятным современному читателю.
- source_word: ἐκόσμησαν
  choice: поправили
  rationale: κοσμέω означает привести в порядок, подготовить. Применительно к светильникам «поправили» естественно подразумевает необходимые действия с фитилём и маслом, не добавляя не названных в тексте подробностей.
- source_word: λαμπάδας
  choice: светильники
  rationale: λαμπάς может обозначать светильник или факел. Контекст масла и подготовки хорошо согласуется со «светильниками», но альтернативное значение отмечено в сноске.
- source_word: ἑαυτῶν
  choice: свои
  rationale: Русское возвратное притяжательное местоимение точно и естественно выражает принадлежность светильников самим девам без лишнего усиления.
