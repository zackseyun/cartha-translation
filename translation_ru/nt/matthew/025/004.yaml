  text: αἱ δὲ φρόνιμοι ἔλαβον ἔλαιον ἐν τοῖς ⸀ἀγγείοις μετὰ τῶν λαμπάδων ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/004.yaml
  text: But the wise took oil in their containers with their lamps[a].
translation:
  language: ru
  text: А разумные вместе со своими светильниками взяли масло в сосудах[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «факелами» вместо «светильниками»; греческое слово λαμπάς в зависимости от контекста может обозначать факел или светильник.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φρόνιμοι
  choice: разумные
  rationale: Передаёт практическую рассудительность и сохраняет противопоставление неразумным девушкам в контексте, не сводя смысл только к подготовленности.
- source_word: ἔλαβον
  choice: взяли
  rationale: В повествовательном контексте глагол означает, что они взяли масло с собой; значение «получили» здесь не подходит.
- source_word: ἔλαιον
  choice: масло
  rationale: Греческое слово обычно обозначает масло, нередко оливковое, но уточнение его вида отсутствует в тексте.
- source_word: ἀγγείοις
  choice: в сосудах
  rationale: ἀγγεῖον — общее обозначение вместилища; «сосуды» сохраняет эту неспецифичность, не задавая формы или материала.
- source_word: λαμπάδων
  choice: светильниками
  rationale: λαμπάς может обозначать светильник или факел. «Светильник» естественно сочетается с запасом масла, а возможное значение «факел» сохранено в примечании.
- source_word: ἑαυτῶν
  choice: своими
  rationale: Возвратное притяжательное местоимение естественно передаёт принадлежность светильников самим действующим лицам.
- source_word: μετὰ τῶν λαμπάδων ἑαυτῶν
  choice: вместе со своими светильниками
  rationale: 'μετά с родительным падежом выражает сопровождение: масло в сосудах было взято наряду со светильниками.'
