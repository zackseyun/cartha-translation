id: MAT.25.27
reference: Matthew 25:27
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἔδει ⸂σε οὖν⸃ βαλεῖν ⸂τὰ ἀργύριά⸃ μου τοῖς τραπεζίταις, καὶ ἐλθὼν ἐγὼ ἐκομισάμην ἂν τὸ ἐμὸν σὺν τόκῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/027.yaml
  text: Therefore[a], you should have deposited my money with the bankers, and when I came, I would have received what was mine with interest.
translation:
  language: ru
  text: Итак, тебе следовало отдать мои деньги банкирам, и тогда, вернувшись, я получил бы своё с процентами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδει
  choice: тебе следовало
  rationale: Имперфект безличного δεῖ указывает на то, что в прошлом надлежало сделать; эта формулировка естественно передаёт укор.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предшествующих слов господина и звучит естественно в современном русском.
- source_word: βαλεῖν
  choice: отдать
  rationale: В сочетании с банкирами глагол обозначает передачу денег им для хранения и приумножения; «отдать» сохраняет простоту образа, не вводя излишне современной банковской терминологии.
- source_word: τὰ ἀργύριά μου
  choice: мои деньги
  rationale: Множественное ἀργύρια может буквально означать серебро, но в данном хозяйственно-финансовом контексте функционально обозначает деньги.
- source_word: τοῖς τραπεζίταις
  choice: банкирам
  rationale: Упоминание процентов показывает, что речь идёт о людях, принимавших средства и пускавших их в оборот, а не только о менялах.
- source_word: ἐλθὼν ἐγὼ
  choice: вернувшись, я
  rationale: Аористное причастие передаёт действие, предшествующее получению денег; в контексте притчи приход господина является его возвращением.
- source_word: ἐκομισάμην ἂν
  choice: получил бы
  rationale: 'Средний залог и частица ἄν выражают нереализованный результат: господин получил бы обратно принадлежавшее ему.'
- source_word: τὸ ἐμὸν
  choice: своё
  rationale: Субстантивированное притяжательное местоимение означает принадлежащее говорящему; русское «своё» кратко и естественно сохраняет этот акцент.
- source_word: σὺν τόκῳ
  choice: с процентами
  rationale: В финансовом контексте τόκος означает доход, начисленный на переданные деньги; современное нейтральное соответствие — «проценты».
theological_decisions:
- issue: Финансовый образ притчи и возможная моральная оценка взимания процентов
  choice: Передать финансовые термины нейтрально как часть образного мира притчи.
  alternative: Использовать слово «лихва», тем самым связав стих с позднейшими богословско-нравственными спорами.
  rationale: Сам стих не формулирует общего одобрения или осуждения процентов; перевод не должен привносить такую оценку.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет вывод «итак» и условно-нереализованный результат «получил бы», не становясь буквалистским.
