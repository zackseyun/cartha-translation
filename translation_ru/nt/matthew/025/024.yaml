  text: προσελθὼν δὲ καὶ ὁ τὸ ἓν τάλαντον εἰληφὼς εἶπεν· Κύριε, ἔγνων σε ὅτι σκληρὸς εἶ ἄνθρωπος, θερίζων ὅπου οὐκ ἔσπειρας καὶ συνάγων ὅθεν οὐ διεσκόρπισας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/024.yaml
  text: Then the one who had received the one talent also came and said[a], ‘Lord, I knew that you are a hard man[b], reaping where you did not sow and gathering where you did not scatter.’
translation:
  language: ru
  text: 'Затем подошёл и тот, кто получил один талант, и сказал: «Господин, я знал, что ты суровый человек[a]: жнёшь там, где не сеял, и собираешь оттуда, где не рассыпал[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может означать также «жёсткий», «строгий» или «суровый».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «собираешь оттуда, где не рассыпал». Что именно не было рассыпано, в греческом тексте не названо; по земледельческому образу могут подразумеваться семена или зерно.'
    reason: source_clarity
lexical_decisions:
- source_word: προσελθὼν δὲ καὶ
  choice: Затем подошёл и
  rationale: «Затем» передаёт развитие повествования, «и» — добавление этого раба к уже подошедшим, а «подошёл» естественно передаёт προσελθών.
- source_word: ὁ τὸ ἓν τάλαντον εἰληφὼς
  choice: тот, кто получил один талант
  rationale: Артиклевый причастный оборот обозначает человека через полученное им; такая придаточная конструкция ясна и естественна по-русски. «Талант» сохраняет историческую денежно-весовую единицу и образ притчи.
- source_word: Κύριε
  choice: Господин
  rationale: Здесь это уважительное обращение раба к хозяину внутри притчи. «Господин» естественно для данного повествовательного контекста и не превращает обращение без необходимости в прямой божественный титул.
- source_word: ἔγνων σε ὅτι
  choice: я знал, что ты
  rationale: Греческая конструкция сообщает о знании характера собеседника. Буквальное «я знал тебя, что...» по-русски неестественно; придаточное с «что» точно и ясно передаёт смысл без добавочного толкования.
- source_word: σκληρὸς ἄνθρωπος
  choice: человек суровый
  rationale: «Суровый» передаёт жёсткость и строгость, но не усиливает обвинение до однозначного «жестокий». Неоднозначность слова отмечена в сноске.
- source_word: θερίζων ὅπου οὐκ ἔσπειρας
  choice: жнёшь там, где не сеял
  rationale: Сохраняется сельскохозяйственная образность и пара «жать — сеять».
- source_word: συνάγων ὅθεν οὐ διεσκόρπισας
  choice: собираешь оттуда, где не рассыпал
  rationale: «Оттуда» отражает исходное значение ὅθεν, а отсутствие названного дополнения сохраняет недосказанность греческого текста и не вводит прямо не упомянутое «зерно» или «семя».
theological_decisions:
- issue: Передача κύριος в обращении внутри притчи
  choice: Господин
  alternative: Господь; хозяин
  rationale: Говорящий обращается к своему хозяину как персонажу притчи. Контекстуальное «Господин» сохраняет уважительное обращение, не предрешая на уровне реплики вопрос о символическом отождествлении хозяина.
- issue: Оценка хозяина в речи раба
  choice: Обвинение передано как утверждение самого раба и не смягчено
  alternative: Использовать более осуждающее «жестокий» или более мягкое «строгий»
  rationale: Текст сообщает восприятие раба, не требуя от перевода ни подтвердить, ни опровергнуть его характеристику. «Суровый» сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством притчевой речи. Синтаксис сделан ясным для обычного читателя; сельскохозяйственный параллелизм и обвинительный характер слов раба сохранены.
