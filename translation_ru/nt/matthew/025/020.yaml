  text: καὶ προσελθὼν ὁ τὰ πέντε τάλαντα λαβὼν προσήνεγκεν ἄλλα πέντε τάλαντα λέγων· Κύριε, πέντε τάλαντά μοι παρέδωκας· ἴδε ἄλλα πέντε τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/020.yaml
  text: And the one who had received the five talents came forward and brought another five talents[a], saying, ‘Lord, you delivered five talents to me; look[b], I have gained another five talents.’
translation:
  language: ru
  text: 'Тот, кто получил пять талантов[a], подошёл и принёс ещё пять талантов, сказав: «Господин! Ты передал мне пять талантов. Вот, я приобрёл ещё пять талантов».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Талант — крупная мера веса и денежная единица.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: подошёл
  rationale: Передаёт направленное приближение слуги к господину и естественно звучит в сцене отчёта.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: тот, кто получил пять талантов
  rationale: Сохраняет определяющую причастную конструкцию и не добавляет отсутствующее в греческом слово «человек».
- source_word: τάλαντα
  choice: талантов
  rationale: Сохраняет исторический денежно-весовой термин; его значение пояснено в сноске.
- source_word: προσήνεγκεν
  choice: принёс
  rationale: Прямо и естественно передаёт принесение дополнительной суммы господину, без культового оттенка слова «предложил».
- source_word: ἄλλα πέντε τάλαντα
  choice: ещё пять талантов
  rationale: Естественно по-русски выражает дополнительное равное количество.
- source_word: Κύριε
  choice: Господин
  rationale: Внутри притчи это прямое обращение раба к хозяину; «Господин» передаёт социальное значение κύριος без преждевременного отождествления персонажа с Богом.
- source_word: παρέδωκας
  choice: передал
  rationale: Близко к основному значению παραδίδωμι и не делает подразумеваемое доверие явным содержанием глагола.
- source_word: ἴδε
  choice: вот
  rationale: Естественный русский указательно-побудительный эквивалент, привлекающий внимание к предъявляемому результату.
- source_word: ἐκέρδησα
  choice: приобрёл
  rationale: Передаёт получение прибыли или приращения; не вносит оттенка заработной платы, возможного у «заработал».
theological_decisions:
- issue: Передача κύριος в обращении внутри притчи
  choice: Господин
  alternative: Господи
  rationale: Непосредственный референт — хозяин рабов в притче. «Господин» сохраняет это значение и не устраняет возможный более широкий повествовательно-богословский резонанс самого образа.
translation_notes:
  register: Современный литературный русский язык; речь ясная и сдержанно-достойная. Повторы слова «талант» сохранены вслед за греческим текстом. Прямая речь оформлена естественно, а «вот» передаёт живой указательный характер ἴδε.
