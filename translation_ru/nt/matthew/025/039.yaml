  text: πότε δέ σε εἴδομεν ⸀ἀσθενοῦντα ἢ ἐν φυλακῇ καὶ ἤλθομεν πρός σε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/039.yaml
  text: And when did we see you sick or in prison and come to you?[a]
translation:
  language: ru
  text: Когда же мы видели Тебя больным или в тюрьме и пришли к Тебе?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «навестили Тебя». Буквально: «пришли к Тебе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: когда
  rationale: Естественное русское вопросительное наречие, точно передающее вопрос о времени.
- source_word: δέ
  choice: же
  rationale: Передаёт мягкую связку с предыдущими вопросами, не придавая ей сильного противительного значения.
- source_word: εἴδομεν
  choice: мы видели
  rationale: Форма прошедшего времени естественно звучит в русском прямом вопросе и сохраняет значение аориста.
- source_word: ἀσθενοῦντα
  choice: больным
  rationale: В данном контексте причастие обозначает физическую болезнь; вариант «слабым» был бы неоправданно широким.
- source_word: ἐν φυλακῇ
  choice: в тюрьме
  rationale: Ясное и общеупотребительное обозначение места заключения без внесения современных юридических разграничений.
- source_word: ἤλθομεν πρός σε
  choice: пришли к Тебе
  rationale: Прямо передаёт греческое выражение движения к человеку и не заменяет его более узким по смыслу глаголом «навестили».
theological_decisions:
- issue: Передавать ли ἤλθομεν πρός σε как «навестили Тебя» или более буквально как «пришли к Тебе»
  choice: пришли к Тебе
  alternative: навестили Тебя
  rationale: Греческий текст говорит буквально о приходе к человеку, а не употребляет специальный глагол со значением посещения. Основной текст сохраняет эту формулировку и её смысловую открытость, а идиоматический вариант вынесен в примечание.
translation_notes:
  register: Современный литературный русский язык; простая и достойная формулировка прямой речи. Местоимения, обращённые к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией.
