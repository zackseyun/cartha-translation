  source_fidelity: 'Текст точно передаёт греческий вопрос: πότε δέ отражено как «Когда же», εἴδομεν — «мы видели», ἀσθενοῦντα — «больным», ἐν φυλακῇ — «в тюрьме», а ἤλθομεν πρὸς σέ — «пришли к Тебе». Синтаксическая связь «видели ... и пришли» сохранена без добавления толкования.'
