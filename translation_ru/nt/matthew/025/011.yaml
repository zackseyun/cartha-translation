lexical_decisions:
- source_word: ὕστερον
  choice: Позже
  rationale: Передаёт временную последовательность кратко и естественно, без добавочного уточнения.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Слабая связка; переход в русском естественно передан начальным «Позже».
- source_word: ἔρχονται
  choice: пришли
  rationale: Греческое повествовательное настоящее передано обычным для русского рассказа прошедшим временем.
- source_word: καὶ
  choice: и
  rationale: 'Выражает присоединительное значение: вслед за первыми девушками приходят также остальные.'
- source_word: αἱ λοιπαὶ παρθένοι
  choice: остальные девушки
  rationale: В контексте свадебного шествия речь идёт о незамужних девушках; «девушки» звучит естественно в современном русском, а буквальное значение отмечено в сноске.
- source_word: λέγουσαι
  choice: и сказали
  rationale: Русская сочинительная конструкция естественно передаёт греческое причастие, вводящее прямую речь.
- source_word: Κύριε κύριε
  choice: Господи! Господи!
  rationale: Сохраняет повтор, настойчивость обращения и возможный богословский оттенок, не сводя κύριος исключительно к светскому «господин».
- source_word: ἄνοιξον ἡμῖν
  choice: Открой нам
  rationale: Сохраняет краткость греческого текста и не добавляет прямо не названное слово «дверь».
theological_decisions:
- issue: Смысл обращения κύριος в притче
  choice: Господи
  alternative: Господин; хозяин
  rationale: В непосредственной сцене возможно почтительное обращение к хозяину, однако у Матфея оно может одновременно иметь более глубокий богословский смысл. «Господи» сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с простой, dignified повествовательной формой. Реплика передаёт срочность повторным обращением и восклицательной пунктуацией; буквальные и контекстуальные альтернативы вынесены в сноски.
