  text: Ὅταν δὲ ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες ⸀οἱ ἄγγελοι μετ’ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/031.yaml
  text: But when the Son of Man comes in his glory[a], and all the angels with him, then he will sit on his glorious throne.
translation:
  language: ru
  text: Когда же Сын Человеческий придёт в Своей славе и с Ним — все ангелы, тогда Он сядет на престоле Своей славы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на Своём славном престоле».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Когда же
  rationale: Естественно передаёт будущую временную конструкцию и мягкий переход δέ, не придавая ей излишне резкого противопоставления.
- source_word: ἔλθῃ
  choice: придёт
  rationale: Аорист конъюнктива после ὅταν указывает на единичное будущее событие; в русском языке естественна форма будущего совершенного вида.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Сохраняет традиционное христологическое наименование и его связь с Дан 7, не заменяя титул толкованием.
- source_word: ἐν τῇ δόξῃ αὐτοῦ
  choice: в Своей славе
  rationale: «Слава» сохраняет библейскую образность явленного величия; возвратное «Своей» ясно соотносит славу с подлежащим.
- source_word: πάντες οἱ ἄγγελοι μετ’ αὐτοῦ
  choice: с Ним — все ангелы
  rationale: Сохраняет отсутствие притяжательного местоимения при «ангелах» в греческом тексте и естественно выражает сопровождение. Тире помогает читаемости инверсии.
- source_word: τότε καθίσει
  choice: тогда Он сядет
  rationale: Прямо передаёт последовательность и будущую активную форму, не добавляя толковательного «воссядет».
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: на престоле Своей славы
  rationale: Близко сохраняет генитивную конструкцию исходного текста и её библейское звучание, оставаясь понятным в современном литературном русском.
theological_decisions:
- issue: Христологический титул ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  alternative: Человек / Сын человека
  rationale: Традиционная титульная форма сохраняет межтекстовую связь с Дан 7 и судебно-мессианский контекст, не сводя выражение к общему обозначению человека.
- issue: Значение θρόνου δόξης αὐτοῦ
  choice: престол Своей славы
  alternative: Свой славный престол
  rationale: Формальная генитивная конструкция сохраняет возможный оттенок престола как места явления славы, тогда как атрибутивный вариант естественнее, но немного сильнее истолковывает связь существительных.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. «Престол» выбран вместо нейтрального «трон» ради устойчивого царственно-судебного контекста; синтаксис остаётся ясным для широкого читателя.
