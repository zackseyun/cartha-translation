review_pass:
  verdict: approve
  source_fidelity: Текст точно передаёт временно-будущую конструкцию Ὅταν δὲ ... ἔλθῃ («Когда же ... придёт»), титул ὁ υἱὸς τοῦ ἀνθρώπου, обстоятельство ἐν τῇ δόξῃ αὐτοῦ, сопровождение πάντες οἱ ἄγγελοι μετ’ αὐτοῦ и последующее τότε καθίσει. «На престоле Своей славы» близко воспроизводит θρόνου δόξης αὐτοῦ и не устраняет присущую греческому генитивному обороту образность.
  naturalness: Фраза литературна, ясна и соответствует возвышенному, но не архаизирующему библейскому регистру. Инверсия «и с Ним — все ангелы» допустима и выразительна; тире помогает прочитать эллиптическую конструкцию. «Престол» уместен в царственно-судебном контексте.
  terminology: «Сын Человеческий», «слава» и «престол» терминологически устойчивы и сохраняют библейские связи текста. Заглавные буквы в относящихся к Сыну Человеческому местоимениях являются редакционной конвенцией русского библейского стиля и не меняют смысла. Сноска корректно даёт идиоматический альтернативный вариант к основному более буквальному переводу; её направление закономерно обратное английскому аудиторскому следу, поскольку русский основной текст выбран более буквальным.
