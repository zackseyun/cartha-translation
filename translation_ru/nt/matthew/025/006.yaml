  text: μέσης δὲ νυκτὸς κραυγὴ γέγονεν· Ἰδοὺ ὁ ⸀νυμφίος, ἐξέρχεσθε εἰς ἀπάντησιν ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/006.yaml
  text: 'But at midnight a cry rang out: ‘Look[b][a], the bridegroom! Come out to meet him.’'
translation:
  language: ru
  text: 'Но в полночь раздался крик[a]: «Вот[b] жених! Выходите ему навстречу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «послышался крик».'
    reason: Лексическая альтернатива для κραυγὴ γέγονεν; греческое выражение сообщает о возникновении крика, что по-русски можно естественно передать несколькими близкими способами.
  - marker: b
    text: 'Или: «Смотрите: жених!»'
    reason: Лексическая альтернатива для ἰδού как призыва обратить внимание.
lexical_decisions:
- source_word: μέσης δὲ νυκτός
  choice: Но в полночь
  rationale: Родительная конструкция μέσης νυκτός идиоматически обозначает время — «в полночь»; δέ передано мягким противопоставительным «но», продолжающим повествование.
- source_word: κραυγὴ γέγονεν
  choice: раздался крик
  rationale: Глагол γίνομαι здесь сообщает о внезапном возникновении события. «Раздался крик» естественно по-русски передаёт и событие, и его слышимый характер, не воспроизводя буквально неестественное «крик произошёл».
- source_word: Ἰδοὺ
  choice: Вот
  rationale: ἰδού привлекает внимание к появлению жениха. «Вот» — краткий, современный и уместный для возгласа эквивалент; возможное «смотрите» отмечено в сноске.
- source_word: ὁ νυμφίος
  choice: жених
  rationale: νυμφίος обозначает жениха в свадебной обстановке; русское «жених» точно и естественно сохраняет образ притчи.
- source_word: ἐξέρχεσθε
  choice: Выходите
  rationale: Повелительная форма означает выход из того места, где находились ожидавшие; «выходите» естественно звучит как обращённый к ним призыв и не навязывает спорный выбор между русскими «идите» и «приходите».
- source_word: εἰς ἀπάντησιν αὐτοῦ
  choice: ему навстречу
  rationale: Устойчивая конструкция εἰς ἀπάντησιν означает движение для встречи с кем-либо. «Выходите ему навстречу» точно и идиоматично передаёт свадебно-процессионный контекст.
theological_decisions:
- issue: Притчевый референт слова νυμφίος
  choice: «жених» со строчной буквы, без поясняющего отождествления
  alternative: «Жених» с прописной буквы или явное отождествление с Христом
  rationale: Хотя в широком контексте притчи жених представляет Иисуса, сам стих остаётся на уровне образного повествования. Строчная буква сохраняет литературную форму и не вносит толкование непосредственно в текст.
translation_notes:
  register: Современный литературный русский язык с ясным, энергичным ритмом прямой речи. Формулировка сохраняет внезапность ночного возгласа и свадебный образ, избегая как архаичного «се», так и разговорно-сниженной лексики.
