  text: τότε ἀποκριθήσονται αὐτῷ οἱ δίκαιοι λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα καὶ ἐθρέψαμεν, ἢ διψῶντα καὶ ἐποτίσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/037.yaml
  text: Then the righteous will answer him[a], saying, ‘Lord, when did we see you hungry and feed you, or thirsty and give you drink?’
translation:
  language: ru
  text: 'Тогда праведники ответят Ему: «Господи, когда мы видели Тебя голодным и накормили Тебя, или жаждущим и напоили?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественно и кратко обозначает последовательность событий в речи.
- source_word: ἀποκριθήσονται αὐτῷ
  choice: ответят Ему
  rationale: Передаёт будущее время и дательный объект естественной русской конструкцией.
- source_word: οἱ δίκαιοι
  choice: праведники
  rationale: Субстантивированное прилагательное естественно передаётся традиционным и понятным существительным.
- source_word: λέγοντες
  choice: двоеточие перед прямой речью
  rationale: В русском языке содержание причастия естественно выражается введением прямой речи без избыточного «говоря».
- source_word: Κύριε
  choice: Господи
  rationale: Обычная русская звательная форма обращения к Господу, сохраняющая уважительный и христологический оттенок.
- source_word: πεινῶντα καὶ ἐθρέψαμεν
  choice: голодным и накормили
  rationale: Естественно передаёт объектное причастие и конкретное действие τρέφω.
- source_word: διψῶντα καὶ ἐποτίσαμεν
  choice: жаждущим и напоили
  rationale: «Жаждущим» сохраняет причастную форму оригинала, а «напоили» точно и естественно передаёт ποτίζω.
theological_decisions:
- issue: Передача κύριος при прямом обращении к Иисусу
  choice: Господи
  alternative: Учитель / господин
  rationale: «Господи» сохраняет как уважительное обращение, так и возможное христологическое звучание, не устраняя присущую контексту многозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Местоимения обращения к Иисусу написаны с прописной буквы по принятой русской религиозно-издательской норме. Причастие λέγοντες не воспроизведено отдельным словом, поскольку русское двоеточие естественно вводит прямую речь.
