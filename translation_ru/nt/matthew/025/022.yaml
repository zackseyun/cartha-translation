  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: προσελθὼν ⸀δὲ καὶ ὁ τὰ δύο ⸀τάλαντα εἶπεν· Κύριε, δύο τάλαντά μοι παρέδωκας· ἴδε ἄλλα δύο τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/022.yaml
  text: Then the one who had received the two talents also came forward and said[a], ‘Lord, you handed over to me two talents. Look[b], I gained two more talents.’
translation:
  language: ru
  text: 'Тогда подошёл и тот, кто получил два таланта[a], и сказал: «Господин[b], ты передал мне два таланта. Вот, я приобрёл ещё два таланта».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Талант — крупная мера веса и денежной стоимости, а не природная способность.
    reason: cultural_note
  - marker: b
    text: 'Или: «Господи». Греческое κύριος может означать как «Господь», так и уважительное обращение к господину или хозяину; здесь действие происходит в притче о господине и его слугах.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσελθὼν
  choice: подошёл
  rationale: Аористное причастие от προσέρχομαι обозначает приближение слуги к господину перед отчётом; «подошёл» естественно передаёт действие в русском повествовании.
- source_word: δὲ καὶ
  choice: тогда ... и
  rationale: Сочетание продолжает последовательность отчётов и добавляет второго слугу; «тогда» отмечает развитие повествования, а «и» — параллель с предыдущим случаем.
- source_word: ὁ τὰ δύο τάλαντα
  choice: тот, кто получил два таланта
  rationale: Субстантивированная конструкция определяет слугу по вверенной ему сумме. Глагол «получил» восстановлен из ближайшего контекста притчи и делает выражение естественным по-русски.
- source_word: Κύριε
  choice: Господин
  rationale: В звательном обращении внутри притчи κύριος обозначает хозяина слуги. «Господин» естественно передаёт непосредственную социальную ситуацию, не устраняя возможность более высокого звучания слова, отмеченную в сноске.
- source_word: παρέδωκας
  choice: ты передал мне
  rationale: παραδίδωμι буквально означает «передавать, вручать»; выбранный вариант сохраняет конкретный смысл передачи имущества, не подменяя его более толковательным «доверил».
- source_word: ἴδε
  choice: Вот
  rationale: Частица привлекает внимание к предъявляемому результату. «Вот» звучит естественно и сохраняет указательную силу греческого слова.
- source_word: ἄλλα δύο τάλαντα
  choice: ещё два таланта
  rationale: ἄλλα с числительным обозначает дополнительное равное количество; «ещё два» — современная и точная русская формулировка.
- source_word: ἐκέρδησα
  choice: я приобрёл
  rationale: κερδαίνω означает «приобрести, получить прибыль, выиграть». «Приобрёл» сохраняет общий смысл получения прироста и не уточняет сверх текста способ заработка.
theological_decisions:
- issue: Передача κύριος в обращении внутри притчи
  choice: Господин
  alternative: Господи
  rationale: В непосредственном сюжете слуга обращается к своему хозяину, поэтому «Господин» наиболее естественно для современного русского языка. Однако κύριος допускает традиционную передачу «Господь»; сноска сохраняет эту смысловую и богословскую многозначность, не навязывая отождествления.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным ритмом. Традиционный термин «талант» сохранён и пояснён; архаические формы обращения и излишне коммерческая лексика избегаются.
