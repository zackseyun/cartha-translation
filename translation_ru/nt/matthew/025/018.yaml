reference: Matthew 25:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ τὸ ἓν λαβὼν ἀπελθὼν ὤρυξεν ⸀γῆν καὶ ⸀ἔκρυψεν τὸ ἀργύριον τοῦ κυρίου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/018.yaml
  text: But the one who had received the one talent went away[a], dug in the ground, and hid his master's money.
translation:
  language: ru
  text: А тот, кто получил один талант, ушёл, выкопал яму в земле и спрятал деньги своего господина.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «серебро своего господина».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: А тот
  rationale: δέ противопоставляет этого слугу предыдущим; «А тот» естественно передаёт контраст и субстантивированную конструкцию.
- source_word: τὸ ἓν
  choice: один талант
  rationale: В греческом тексте стоит эллиптическое «один», отсылающее к таланту в Мф 25:15; существительное восстановлено для ясности.
- source_word: λαβὼν
  choice: кто получил
  rationale: Причастие обозначает предшествующее получение вверенной суммы; придаточное предложение звучит естественно по-русски.
- source_word: ἀπελθὼν
  choice: пошёл
  rationale: Передаёт последовательность действий и удаление слуги без излишне книжного оттенка.
- source_word: ὤρυξεν γῆν
  choice: выкопал яму в земле
  rationale: Греческое выражение буквально говорит о копании земли; яма подразумевается действием и необходима для естественного русского выражения.
- source_word: ἔκρυψεν
  choice: спрятал
  rationale: Прямой и общеупотребительный эквивалент κρύπτω в данном контексте.
- source_word: τὸ ἀργύριον
  choice: деньги
  rationale: ἀργύριον может означать серебро или деньги; в контексте вверенного капитала «деньги» яснее для современного читателя, а буквальный оттенок сохранён в сноске.
- source_word: τοῦ κυρίου αὐτοῦ
  choice: своего господина
  rationale: κύριος здесь обозначает хозяина слуги в мире притчи; «господин» сохраняет отношение власти и не превращает слово в прямой божественный титул.
theological_decisions:
- issue: Передача κύριος в притче при непосредственном человеческом референте
  choice: господин
  alternative: Господь; хозяин
  rationale: Внутри повествования речь непосредственно идёт о господине слуги. Строчная буква не навязывает прямого отождествления с божественным титулом, сохраняя при этом возможную символическую глубину притчи.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет контраст и последовательность греческих причастных конструкций, но выражен естественно для русского читателя.
