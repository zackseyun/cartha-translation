id: MAT.25.16
reference: Matthew 25:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀πορευθεὶς ὁ τὰ πέντε τάλαντα λαβὼν ἠργάσατο ἐν αὐτοῖς καὶ ⸀ἐκέρδησεν ἄλλα ⸀πέντε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/016.yaml
  text: The one who had received the five talents went and worked with them[b][a], and gained another five.
translation:
  language: ru
  text: Получивший пять талантов[a] пошёл, пустил их в дело и приобрёл ещё пять.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Талант — крупная денежно-весовая единица, а не природная способность.
    reason: cultural_note
lexical_decisions:
- source_word: πορευθεὶς
  choice: пошёл
  rationale: Аористное причастие передаёт предшествующее или сопутствующее действие; естественная русская личная форма сохраняет последовательность без добавления отсутствующего в греческом «тотчас».
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: получивший пять талантов
  rationale: Субстантивированное причастие определяет слугу через полученное им; русский оборот краток и не добавляет существительного, которого в этой фразе нет.
- source_word: τάλαντα
  choice: талантов
  rationale: Сохраняется традиционное обозначение крупной денежно-весовой единицы; примечание предупреждает современное понимание слова как природной способности.
- source_word: ἠργάσατο ἐν αὐτοῖς
  choice: пустил их в дело
  rationale: Оборот означает деятельное использование полученного капитала. Русская идиома естественно выражает это, не сужая смысл исключительно до торговли.
- source_word: ἐκέρδησεν
  choice: приобрёл
  rationale: Глагол означает получить прибыль или выгоду; «приобрёл» ясно передаёт результат и хорошо сочетается с «ещё пять».
- source_word: ἄλλα πέντε
  choice: ещё пять
  rationale: Естественно передаёт добавочное количество, подразумевая ещё пять талантов.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; изложение краткое и достойное. Выражение «пустил их в дело» передаёт активное использование денег ради прибыли, сохраняя некоторую широту греческого оборота.
