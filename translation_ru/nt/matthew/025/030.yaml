  text: καὶ τὸν ἀχρεῖον δοῦλον ἐκβάλετε εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/030.yaml
  text: And throw the worthless slave into the outer darkness[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: ru
  text: А негодного раба[a] выбросьте во внешнюю тьму. Там будет плач и скрежет зубов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слугу». Греческое δοῦλος может означать «слуга» или «раб»; в обстановке притчи существенна зависимость раба от господина.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀχρεῖον
  choice: негодного
  rationale: Передаёт оценку раба как не принёсшего пользы и не исполнившего своего назначения, сохраняя суровость приговора без архаичного «непотребного».
- source_word: δοῦλον
  choice: раба
  rationale: В контексте притчи отношения господина и зависимого от него человека выражены именно социально-правовым обозначением раба; современное русское «слуга» ослабило бы эту сторону образа.
- source_word: ἐκβάλετε
  choice: выбросьте
  rationale: Сильный повелительный глагол передаёт резкое и насильственное удаление; «выведите» было бы слишком мягким.
- source_word: σκότος τὸ ἐξώτερον
  choice: тьму внешнюю
  rationale: Сохраняет устойчивый матфеевский образ нахождения вне места света, радости и принятия, не добавляя его богословского истолкования.
- source_word: ἐκεῖ
  choice: Там
  rationale: Естественно и точно отсылает к только что названной внешней тьме.
- source_word: κλαυθμὸς
  choice: плач
  rationale: Обычное и точное русское соответствие в повторяющейся у Матфея формуле суда.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: скрежет зубов
  rationale: Устоявшееся русское выражение, сохраняющее образ сильного страдания и/или ярости, не выбирая между этими оттенками.
theological_decisions:
- issue: Характер образа суда в притче
  choice: Сохранены образы изгнания во внешнюю тьму, плача и скрежета зубов без поясняющего отождествления.
  alternative: Прямо назвать ад, окончательный суд либо временное или исключительно метафорическое отвержение.
  rationale: Греческий текст использует характерную для Матфея образность суда, но в самом стихе не даёт более узкого определения; перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством и выразительной суровостью. Порядок «тьму внешнюю» намеренно сохраняет узнаваемость библейской формулы; остальная фраза избегает архаизмов.
