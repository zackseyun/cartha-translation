lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественный временной указатель, связывающий притчу с предшествующим эсхатологическим наставлением.
- source_word: ὁμοιωθήσεται
  choice: будет подобно
  rationale: Естественно передаёт формулу притчевого сравнения по-русски; будущая форма сохранена, а пассивная форма греческого глагола отмечена в сноске.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Царство Небесное
  rationale: Устоявшаяся и понятная русская передача характерного для Матфея выражения.
- source_word: δέκα παρθένοις
  choice: десяти девам
  rationale: Слово «девы» сохраняет указание на молодых незамужних девушек и брачный контекст, не сводя значение исключительно к возрасту.
- source_word: αἵτινες
  choice: которые
  rationale: Естественно вводит описательное придаточное предложение.
- source_word: λαβοῦσαι
  choice: взяли
  rationale: Предшествующее действие аористного причастия естественно передано личной формой глагола.
- source_word: τὰς λαμπάδας ἑαυτῶν
  choice: свои светильники
  rationale: «Светильники» — традиционная и понятная передача; возвратное «свои» точно соотносит предметы с девами. Возможное значение «факелы» сохранено в сноске.
- source_word: ἐξῆλθον εἰς ὑπάντησιν
  choice: вышли встречать
  rationale: Кратко и естественно передаёт выход с целью встречи и приёма прибывающего.
- source_word: τοῦ νυμφίου
  choice: жениха
  rationale: Точно сохраняет свадебный образ и является обычным современным русским словом.
theological_decisions:
- issue: Формула притчевого сравнения
  choice: Царство Небесное будет подобно десяти девам
  alternative: Царство Небесное будет уподоблено десяти девам
  rationale: Основной текст использует естественную русскую формулу, не устраняя будущего времени. Формально пассивный характер греческого глагола сохранён как допустимая альтернатива в сноске.
- issue: Передача παρθένοις
  choice: девам
  alternative: девственницам; незамужним девушкам
  rationale: «Девы» сохраняет традиционную лексическую силу слова и уместно в свадебной обстановке, при этом не добавляет конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Девы» и «Царство Небесное» сохраняют достоинство и узнаваемость текста; синтаксис остаётся простым и доступным.
