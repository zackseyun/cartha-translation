  text: Τότε ὁμοιωθήσεται ἡ βασιλεία τῶν οὐρανῶν δέκα παρθένοις, αἵτινες λαβοῦσαι τὰς λαμπάδας ⸀ἑαυτῶν ἐξῆλθον εἰς ⸀ὑπάντησιν τοῦ νυμφίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/001.yaml
  text: Then the kingdom of heaven will be like ten virgins[c][b][a], who took their lamps and went out to meet the bridegroom.
translation:
  language: ru
  text: Тогда Царство Небесное будет подобно десяти девам[a], которые взяли свои светильники[b] и вышли встречать жениха.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет уподоблено десяти девам». В греческом тексте глагол стоит в страдательном залоге.'
