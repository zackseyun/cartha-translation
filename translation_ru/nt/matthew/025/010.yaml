    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι
  choice: Пока же они ходили покупать
  rationale: 'Генитив абсолютный передаёт одновременное действие, а инфинитив ἀγοράσαι — цель. Формулировка сохраняет отсутствие прямого дополнения: масло подразумевается контекстом, но в самом стихе не названо.'
- source_word: ὁ νυμφίος
  choice: жених
  rationale: Обычный и точный русский эквивалент в контексте свадьбы; он сохраняет образ притчи без внесения его истолкования в текст.
- source_word: αἱ ἕτοιμοι
  choice: те, кто был готов
  rationale: Субстантивированное прилагательное женского рода относится к готовым девушкам из контекста. По-русски естественно передать его без повторного называния персонажей.
- source_word: εἰσῆλθον μετ’ αὐτοῦ
  choice: вошли вместе с ним
  rationale: Точно и естественно передаёт совместный вход; «вместе» ясно выражает μετ’.
- source_word: εἰς τοὺς γάμους
  choice: на свадебный пир
  rationale: Множественное γάμοι может обозначать свадебное торжество в целом. В данном контексте «свадебный пир» ясно передаёт праздничную трапезу и естественно звучит по-русски.
- source_word: ἐκλείσθη ἡ θύρα
  choice: дверь закрылась
  rationale: Греческий аорист в пассивной форме сообщает о совершившемся закрытии двери, не называя действующее лицо. Русская возвратная конструкция сохраняет эту неопределённость и подчёркивает итог события.
theological_decisions:
- issue: Свадебные образы в притче
  choice: Сохранить обычные повествовательные образы «жених» и «свадебный пир», не раскрывая их богословское значение непосредственно в переводе.
  alternative: Добавить явное христологическое толкование жениха или передать праздник более конфессионально окрашенным выражением.
  rationale: Богословский смысл должен следовать из притчи и её контекста, а не вноситься переводчиком. Такое решение сохраняет образность и напряжённую окончательность сцены.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным повествовательным ритмом. Первое греческое сложное предложение разделено на два русских для естественности и читаемости без изменения последовательности событий. Маркер примечания помещён после выражения «свадебный пир», к которому относится лексическая альтернатива.
