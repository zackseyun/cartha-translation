  yaml_path: translation/nt/matthew/025/012.yaml
  text: But he answered[a], ‘Truly I tell you, I do not know you.’
translation:
  language: ru
  text: 'Но он ответил: «Истинно говорю вам: я вас не знаю[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я вас не признаю». Буквально по-гречески: «я вас не знаю»; в данном контексте это может означать отказ признать их своими.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Но он ответил
  rationale: Причастие с личной формой глагола представляет собой обычную повествовательную формулу; по-русски естественно передать её одним глаголом. «Но» сохраняет выраженное δέ противопоставление предыдущей просьбе.
- source_word: Ἀμὴν
  choice: Истинно
  rationale: В торжественной формуле Иисуса «Истинно» ясно передаёт подтверждающую силу Ἀμήν и соответствует современному литературному библейскому регистру.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямая и естественная передача греческого выражения, сохраняющая торжественность обращения.
- source_word: οὐκ οἶδα
  choice: не знаю
  rationale: Сохраняет основное значение οἶδα и не сводит заложенное в контексте отчуждение к одному лишь визуальному узнаванию.
- source_word: ὑμᾶς
  choice: вас
  rationale: Передаёт объект второго лица множественного числа — группу девушек в притче.
theological_decisions:
- issue: Смысл слов «я вас не знаю» в притче
  choice: Сохранить простую, но весомую в отношениях формулировку «я вас не знаю».
  alternative: «Я вас не признаю» / «У меня нет с вами отношений».
  rationale: В контексте выражение означает отказ признать пришедших своими и их исключение, однако греческий текст не разворачивает это в отдельное доктринальное утверждение. Буквальная формулировка сохраняет смысловую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для прямой речи в притче. Синтаксис естественный, при этом сохранена традиционная торжественная формула «Истинно говорю вам».
