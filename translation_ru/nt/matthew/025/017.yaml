  text: ⸀ὡσαύτως ὁ τὰ δύο ⸀ἐκέρδησεν ἄλλα δύο·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/017.yaml
  text: Likewise[a], the one with the two gained two more.
translation:
  language: ru
  text: Так же и тот, у кого было два, приобрёл ещё два.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Подобным образом тот, кто получил два, приобрёл ещё два».'
    reason: 'Лексико-синтаксический вариант: контекст позволяет развернуть эллиптическое выражение ὁ τὰ δύο, добавив подразумеваемое «получил».'
lexical_decisions:
- source_word: ὡσαύτως
  choice: Так же
  rationale: Наречие связывает действие этого слуги с действием предыдущего в ст. 16 и сохраняет сравнительное значение.
- source_word: ὁ τὰ δύο
  choice: тот, у кого было два
  rationale: Субстантивированная конструкция эллиптически обозначает слугу, связанного с двумя талантами из контекста; перевод сохраняет эту краткость, не добавляя отсутствующего здесь глагола «получил».
- source_word: ἐκέρδησεν
  choice: приобрёл
  rationale: В финансовом контексте глагол означает получение дополнительной прибыли; «приобрёл» передаёт результат, не сводя его к заработной плате.
- source_word: ἄλλα δύο
  choice: ещё два
  rationale: Сочетание обозначает два дополнительных предмета того же рода; по-русски это естественно передаётся словами «ещё два».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая, достойная формулировка сохраняет эллипсис греческого текста. Слово «таланта» не добавлено, поскольку в стихе оно подразумевается из контекста.
