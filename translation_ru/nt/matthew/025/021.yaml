id: MAT.25.21
reference: Matthew 25:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/021.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will appoint you over many things[b]. Enter into the joy of your master.’
translation:
  language: ru
  text: 'Господин[a] сказал ему: «Хорошо, добрый и верный раб![b] Ты был верен в малом — над многим тебя поставлю. Войди в радость своего господина».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хозяин». Греческое κύριος может также означать «Господь», однако здесь в непосредственном сюжете притчи речь идёт о господине раба.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «слуга». Греческое δοῦλος обозначает человека, находящегося в рабской зависимости, но в некоторых контекстах переводится как «слуга».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: сказал
  rationale: Обычная и естественная передача глагола речи φημί при введении прямой речи.
- source_word: κύριος
  choice: господин
  rationale: Внутри притчи слово обозначает господина раба; строчная буква и выбор «господин» сохраняют непосредственный сюжетный смысл, не устраняя возможного богословского соответствия.
- source_word: δοῦλε
  choice: раб
  rationale: Русское «раб» точно передаёт социальный статус, выраженный δοῦλος, и ясно соотносится с «господином». Более мягкое «слуга» дано как допустимая контекстуальная альтернатива в сноске.
- source_word: Εὖ
  choice: Хорошо
  rationale: Краткое одобрительное восклицание естественно передаёт наречие εὖ и не добавляет отсутствующего в греческом глагола.
- source_word: ἀγαθὲ
  choice: добрый
  rationale: Прямая передача положительной нравственной характеристики ἀγαθός в обращении.
- source_word: πιστέ / πιστός
  choice: верный / верен
  rationale: Сохраняется лексический повтор и значение надёжной преданности в обращении и последующей оценке.
- source_word: ἐπὶ ὀλίγα
  choice: в малом
  rationale: Естественное русское выражение для ограниченной сферы доверенной ответственности; нейтральное множественное число греческого допускает собирательное понимание.
- source_word: καταστήσω
  choice: поставлю
  rationale: В данном контексте καθίστημι означает назначение к более широкой ответственности; «поставлю» сохраняет образ и звучит естественно.
- source_word: ἐπὶ πολλῶν
  choice: над многим
  rationale: Передаёт расширение сферы управления и сохраняет противопоставление «в малом — над многим».
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: Войди в радость
  rationale: Сохраняет пространственную метафору греческого повеления и не сводит её только к толкованию «раздели радость».
theological_decisions:
- issue: Передача κύριος в притче, где господин может прообразно указывать на Бога или Христа
  choice: господин
  alternative: Господь
  rationale: Непосредственный уровень повествования описывает отношения раба и его господина. «Господин» не превращает возможный прообраз в прямой христологический титул, но и не препятствует богословскому прочтению притчи.
- issue: Передача δοῦλος в похвале персонажу притчи
  choice: раб
  alternative: слуга
  rationale: «Раб» точнее сохраняет статусную зависимость, выраженную греческим словом. «Слуга» возможно как более широкое и мягкое обозначение служащего, поэтому отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством притчевой речи. Синтаксис краткий и ясный; сохранены лексический повтор «верный — верен», контраст «в малом — над многим» и метафора вхождения в радость.
