  terminology: «Талант» следует сохранить как исторический денежно-весовой термин, с пояснением, что это не природная одарённость. «Возможности» для δύναμις в этом контексте удачнее, чем «способности», поскольку не провоцирует современную игру значений «таланта». Сноска о εὐθέως должна ясно описывать альтернативное отнесение наречия, а не создавать впечатление, будто это иной перевод уже завершённого предложения.
