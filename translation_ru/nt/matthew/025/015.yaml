  source_fidelity: 'Основной смысл передан верно: три суммы распределены между тремя слугами, мера распределения зависит от личной возможности каждого, а хозяин тотчас уезжает. «Отправился в путь» допустимо для ἀπεδήμησεν. Однако «по его способностям» во множественном числе менее точно передаёт τὴν ἰδίαν δύναμιν (ед. ч., личная способность/возможность) и в данном контексте стилистически нежелательно сближает это выражение с современным значением слова «талант».'
