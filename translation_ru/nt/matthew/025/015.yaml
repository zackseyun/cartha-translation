base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/015.yaml
  text: And to one he gave five talents[a], to another two, and to another one, to each according to his own ability[b]; and he went away immediately.
translation:
  language: ru
  text: Одному он дал пять талантов[a], другому — два, третьему — один, каждому — в соответствии с его собственными возможностями, и сразу же отправился в путь.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Талант — очень крупная мера веса и денежная единица; здесь речь не о природной способности или одарённости.
    reason: lexical_clarification
  - marker: b
    text: 'Возможен иной синтаксический разбор: «сразу же» может относиться к действию получившего пять талантов в следующем стихе.'
    reason: textual_syntactic_ambiguity
lexical_decisions:
- source_word: τάλαντα
  choice: талантов
  rationale: Сохранён исторический термин, обозначающий здесь крупную меру веса и денежную единицу, а не природную одарённость; примечание предотвращает современное неверное понимание.
- source_word: ᾧ μὲν ... ᾧ δὲ ... ᾧ δὲ
  choice: одному ... другому ... третьему
  rationale: Естественная русская распределительная конструкция ясно передаёт последовательное различение трёх получателей.
- source_word: ἕν
  choice: один
  rationale: Существительное «талант» подразумевается из предыдущих частей и не требует повторения.
- source_word: ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν
  choice: каждому по его способностям
  rationale: Передаёт распределительное единственное число и значение личной способности или меры сил, а не чудотворной силы.
- source_word: ἀπεδήμησεν
  choice: отправился в путь
  rationale: Глагол означает удалиться, уехать или отправиться в путешествие; выбранная формулировка естественно сохраняет оттенок отъезда.
- source_word: εὐθέως
  choice: сразу же
  rationale: Современный и ясный эквивалент наречия; в основном тексте оно отнесено к отъезду согласно предложенному делению стиха, а синтаксическая неоднозначность отмечена в сноске.
theological_decisions:
- issue: Значение талантов в притче
  choice: историческая денежно-весовая единица
  alternative: природные способности или дарования
  rationale: Контекст говорит о переданном имуществе; современное переносное значение русского слова «талант» не должно подменять прямой смысл греческого τάλαντον.
- issue: Соотнесение εὐθέως с соседними действиями
  choice: «сразу же» характеризует отъезд господина
  alternative: «сразу же» начинает следующее предложение и характеризует действие раба, получившего пять талантов
  rationale: Пунктуация в древних рукописях не решает вопрос однозначно. Порядок слов допускает связь с последующим причастием в следующем стихе, тогда как представленное деление и консультационный текст связывают наречие с отъездом; альтернативу следует сохранить в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Тире делает перечисление естественным и ясным; исторический термин сохранён ради точности и узнаваемости притчи.
