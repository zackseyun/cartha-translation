  text: καὶ στήσει τὰ μὲν πρόβατα ἐκ δεξιῶν αὐτοῦ τὰ δὲ ἐρίφια ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/033.yaml
  text: And he will place the sheep at his right hand[b][a], but the goats at the left.
translation:
  language: ru
  text: И поставит овец по правую сторону от себя[b], а козлят[a] — по левую.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «коз».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «справа от себя… слева»; это оборот со значением расположения по правую и по левую сторону.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσει
  choice: поставит
  rationale: Будущая форма ἵστημι с прямым дополнением означает «поставить, расположить»; этот выбор естественен по-русски и сохраняет образ суда и разделения.
- source_word: πρόβατα
  choice: овец
  rationale: Обычное обозначение овец; определённость группы передаётся контекстом и русским порядком слов без отдельного артикля.
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: по правую сторону от себя
  rationale: Конструкция ἐκ + родительный здесь идиоматически обозначает положение справа. Возвратное «от себя» ясно показывает, что стороны определяются относительно действующего лица.
- source_word: ἐρίφια
  choice: козлят
  rationale: ἐρίφια точнее обозначает молодых козлов или козлят. «Козлят» естественно передаёт возрастной оттенок и не стирает лексическое отличие исходного текста.
- source_word: ἐξ εὐωνύμων
  choice: по левую
  rationale: Идиома обозначает расположение слева; дополнение «сторону от себя» естественно подразумевается из параллельной первой части и не нуждается в повторении.
- source_word: μὲν ... δὲ
  choice: а
  rationale: Парная конструкция противопоставляет две группы; русское «а» передаёт это сопоставление естественнее, чем более резкое «но».
theological_decisions:
- issue: Передавать ли символическое значение правой и левой сторон прямо в переводе
  choice: 'Передать только пространственное расположение: «по правую сторону… по левую»'
  alternative: Развернуть как «на почётное место» и «на место осуждения»
  rationale: Греческий текст непосредственно описывает расположение групп. Его оценочный и богословский смысл раскрывается контекстом; добавление толкования в основной текст вышло бы за пределы сказанного.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим сцене суда. Синтаксис краткий и контрастный; тире во второй части естественно восполняет опущенное сказуемое и параллельную пространственную конструкцию.
