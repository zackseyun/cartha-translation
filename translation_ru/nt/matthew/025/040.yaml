  - severity: medium
    issue: «Меньших братьев» для τῶν ἐλαχίστων
    rationale: В современном русском «меньшие братья» легко понимаются как младшие по возрасту. Греческий суперлатив говорит о «наименьших» и не задаёт возрастного смысла.
