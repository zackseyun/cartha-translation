  text: καὶ ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον ἐποιήσατε ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων, ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/040.yaml
  text: And the King will answer them[a], ‘Truly I say to you, insofar as you did it to one of the least of these brothers of mine[b], you did it to me.’
translation:
  language: ru
  text: 'И Царь ответит им: «Истинно говорю вам: поскольку вы сделали это одному из этих наименьших братьев Моих[b], вы сделали это Мне».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Греческое слово передано как «братьев» в соответствии с формой мужского рода. Выражение «эти наименьшие братья Мои» может относиться непосредственно к ученикам Иисуса, к верующим вообще или, шире, к нуждающимся и уязвимым; перевод не решает этот спорный вопрос.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἐρεῖ
  choice: ответит
  rationale: Причастие вместе с будущей формой глагола речи естественно передаётся одним русским глаголом «ответит», сохраняя значение ответа без тяжеловесного «отвечая, скажет».
- source_word: ὁ βασιλεὺς
  choice: Царь
  rationale: «Царь» сохраняет явный царский титул; прописная буква уместна, поскольку в контексте так назван эсхатологический Судья.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Истинно говорю вам
  rationale: Устойчивая и понятная русская передача торжественной формулы; её буквальная форма отмечена в сноске [a].
- source_word: ἐφ’ ὅσον
  choice: то, что
  rationale: В данном контексте оборот соотносит конкретное сделанное для одного из названной группы с тем, что сделано Царю. Русское «то, что» естественно и не вводит количественного ограничения, возможного при «насколько».
- source_word: ἐποιήσατε
  choice: вы сделали
  rationale: Повтор глагола сохранён в обеих частях высказывания, поддерживая исходный параллелизм.
- source_word: ἑνὶ τούτων
  choice: одному из этих
  rationale: Сохраняется индивидуализирующая сила ἑνί и указательное τούτων.
- source_word: τῶν ἀδελφῶν μου τῶν ἐλαχίστων
  choice: этих меньших братьев Моих
  rationale: «Братьев» передаёт мужской род исходного множественного числа, а «меньших» сохраняет относительное значение суперлатива и не сужает его до одного лишь возраста, размера или общественного положения.
- source_word: ἐμοὶ
  choice: Мне
  rationale: Дательный падеж прямо сохраняет отождествление поступка по отношению к братьям с поступком по отношению к Царю.
theological_decisions:
- issue: Кого обозначают «эти меньшие братья Мои»
  choice: Сохранить выражение без уточнения круга лиц.
  alternative: Ученики или посланники Иисуса; верующие вообще; нуждающиеся и уязвимые в более широком смысле.
  rationale: Сам стих не разрешает этот экзегетический вопрос однозначно; буквальная формулировка сохраняет богословское напряжение и не навязывает конфессионального толкования.
- issue: Передача ἀδελφῶν
  choice: братьев
  alternative: братьев и сестёр; ближних
  rationale: Греческое слово имеет форму мужского рода во множественном числе. Расширяющая или нейтрализующая передача добавила бы толкование, особенно ввиду спорного референта выражения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Местоимения, относящиеся к Царю/Христу, написаны с прописной буквы. Маркер [a] поставлен после формулы, к которой относится примечание; [b] — после спорного выражения.
