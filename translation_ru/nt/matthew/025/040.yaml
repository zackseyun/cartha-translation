  naturalness: Предлагаемая формулировка сохраняет современный литературный русский и торжественный регистр. «Поскольку» естественно передаёт ἐφ’ ὅσον в данном контексте; «наименьших братьев» несколько возвышенно, но понятно и уместно для библейской речи.
  terminology: «Царь», «Истинно говорю вам», «братьев Моих» и дательный «Мне» сохранены. «Наименьших» точнее сохраняет суперлатив ἐλαχίστων, не сводя его к возрасту («младших») или к одному социальному признаку. Сноска сохраняет открытым спорный референт выражения.
