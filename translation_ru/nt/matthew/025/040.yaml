  to: 'И Царь ответит им: «Истинно говорю вам: поскольку вы сделали это одному из этих наименьших братьев Моих[b], вы сделали это Мне».'
  rationale: 'Исправлены две смысловые неточности: ἐφ’ ὅσον передано союзом «поскольку», а τῶν ἐλαχίστων — словом «наименьших». Добавленное «это» в первой части естественно воспроизводит подразумеваемый объект ποιέω и поддерживает параллелизм со второй частью. Сноска [b] сохранена у спорного выражения; несуществующая сноска [a] не вводится.'
