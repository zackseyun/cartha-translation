  text: ἐπείνασα γὰρ καὶ οὐκ ἐδώκατέ μοι φαγεῖν, ⸀ἐδίψησα καὶ οὐκ ἐποτίσατέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/042.yaml
  text: For I was hungry and you gave me nothing to eat[a]; I was thirsty and you gave me nothing to drink.
translation:
  language: ru
  text: Ведь Я был голоден, и вы не дали Мне поесть; Я хотел пить, и вы не дали Мне напиться.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείνασα
  choice: Я был голоден
  rationale: Аорист обозначает пережитое состояние; современная русская формулировка естественна и точно передаёт смысл.
- source_word: γὰρ
  choice: Ведь
  rationale: Передаёт пояснительно-причинную функцию γάρ в связи с предшествующим приговором, не создавая тяжеловесной конструкции.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: вы не дали Мне поесть
  rationale: Близко сохраняет греческую конструкцию «дать мне есть», но звучит естественно по-русски и удерживает личную направленность действия.
- source_word: ἐδίψησα
  choice: Я хотел пить
  rationale: Естественный современный русский способ выразить состояние жажды; сохраняет параллель с голодом без книжного «Я жаждал».
- source_word: ἐποτίσατέ με
  choice: вы не дали Мне напиться
  rationale: Передаёт контекстуальное значение ποτίζω «дать пить, напоить» и образует естественный смысловой параллелизм с «не дали Мне поесть».
theological_decisions:
- issue: Степень буквальности отрицательных формулировок о непредоставленной пище и питье
  choice: «не дали Мне поесть… не дали Мне напиться»
  alternative: «не дали Мне ничего поесть… не дали Мне ничего выпить»
  rationale: Выбранный вариант непосредственно отражает греческое отрицание глаголов и сохраняет личный акцент на помощи, не оказанной Иисусу, не добавляя отдельного эквивалента слову «ничего», которого в греческом тексте нет.
translation_notes:
  register: Современный литературный русский язык; ясный, dignified синтаксис с сохранением параллелизма двух частей. Местоимение «Мне» написано с прописной буквы согласно устойчивой русской библейской издательской традиции при обращении к Иисусу.
