source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/023.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’
translation:
  language: ru
  text: 'Его господин сказал ему: «Хорошо, добрый и верный раб[a]! В малом ты был верен — над многим тебя поставлю. Войди в радость своего господина».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуга». Греческое слово δοῦλος может в зависимости от контекста означать раба или слугу.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: сказал
  rationale: Естественная и точная передача повествовательной формулы, вводящей прямую речь.
- source_word: ὁ κύριος αὐτοῦ / τοῦ κυρίου σου
  choice: его господин / своего господина
  rationale: Внутри притчи κύριος обозначает хозяина раба; «господин» сохраняет социальную иерархию и не превращает слово непосредственно в титул «Господь».
- source_word: δοῦλε
  choice: раб
  rationale: В хозяйственном контексте отношений κύριος—δοῦλος слово прямо обозначает несвободного подчинённого; современное русское «раб» точнее сохраняет эту историческую реальность, чем более широкое «слуга».
- source_word: Εὖ
  choice: Хорошо
  rationale: Краткое одобрительное восклицание, соответствующее греческому наречию; не добавляет отсутствующего в оригинале глагола.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: добрый и верный
  rationale: Сохраняет оба обращения и повтор корня πιστ- далее в стихе через «верный / верен».
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: В малом ты был верен
  rationale: Естественный русский оборот, передающий верность в порученном небольшом деле; множественное среднего рода допускает собирательную передачу «в малом».
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: над многим тебя поставлю
  rationale: Передаёт назначение к более широкой ответственности и сохраняет параллельный контраст «в малом — над многим».
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: Войди в радость
  rationale: Формально и образно сохраняет движение внутрь, выраженное εἴσελθε εἰς, не сводя его к пояснительному «раздели радость».
theological_decisions:
- issue: Передача κύριος в притче о человеческом хозяине
  choice: господин
  alternative: Господь; хозяин
  rationale: Непосредственный референт в мире притчи — господин раба. Строчная буква и слово «господин» сохраняют повествовательный уровень, не устраняя возможного богословского приложения притчи.
- issue: Передача δοῦλος
  choice: раб
  alternative: слуга
  rationale: Греческое слово может охватывать значения «раб» и «слуга», однако парная связь с κύριος и распоряжение имуществом господина указывают на зависимого домашнего раба. Чтобы сохранить лексическую и социальную силу оригинала, основной текст использует «раб»; более мягкая контекстуальная возможность отмечена в сноске.
- issue: Образ «войти в радость господина»
  choice: сохранить образ буквально
  alternative: раздели радость своего господина
  rationale: Оригинал не уточняет, означает ли радость пир, участие в торжестве или более широкое состояние; буквальная образная формулировка сохраняет эту богословски значимую открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Синтаксический параллелизм «в малом — над многим» и повтор «верный — верен» сохранены; архаизмы и конфессионально маркированные расширения отсутствуют.
