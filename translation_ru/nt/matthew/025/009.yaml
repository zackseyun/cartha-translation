  text: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι· Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ ἡμῖν καὶ ὑμῖν· ⸀πορεύεσθε μᾶλλον πρὸς τοὺς πωλοῦντας καὶ ἀγοράσατε ἑαυταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/009.yaml
  text: But the wise answered[a], saying, ‘No, lest there not be enough for us and for you. Go instead to those who sell, and buy for yourselves.’
translation:
  language: ru
  text: 'Но разумные ответили: «Нет, иначе не хватит и нам, и вам.[a] Лучше пойдите к продавцам и купите себе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более формально: «нет, как бы не оказалось, что нам и вам никак не хватит». Греческое μήποτε с усиленным отрицанием выражает сильное опасение, что запаса окажется недостаточно.'
    reason: лексическая альтернатива
lexical_decisions:
- source_word: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι
  choice: Но разумные ответили
  rationale: Субстантивированное прилагательное передано без добавления отсутствующего в стихе существительного; сочетание «ответили, говоря» естественно свёрнуто в современную русскую формулу прямой речи.
- source_word: Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ
  choice: Нет! Боюсь, что не хватит
  rationale: Так переданы подразумеваемый отказ и сильное опасение недостатка; русское «боюсь» здесь выражает предостерегающий смысл μήποτε, а не приписывает говорящим отдельное психологическое состояние.
- source_word: ἡμῖν καὶ ὑμῖν
  choice: и нам, и вам
  rationale: Повтор союза естественно подчёркивает обе группы и передаёт дательные формы преимущества.
- source_word: πορεύεσθε μᾶλλον
  choice: Лучше пойдите
  rationale: μᾶλλον обозначает предпочтительную альтернативу; «лучше» естественно связывает совет с предшествующим отказом.
- source_word: πρὸς τοὺς πωλοῦντας
  choice: к продавцам
  rationale: Краткая русская передача субстантивированного причастия «к тем, кто продаёт» без добавления явно не названного объекта продажи.
- source_word: ἀγοράσατε ἑαυταῖς
  choice: купите себе
  rationale: Передаёт повелительное наклонение и возвратный дательный со значением приобретения для собственного пользования.
