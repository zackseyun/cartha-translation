  text: καὶ ⸀συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη, καὶ ἀφορίσει αὐτοὺς ἀπ’ ἀλλήλων, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/032.yaml
  text: And all the nations will be gathered before him[a], and he will separate them from one another, just as the shepherd separates the sheep from the goats[b],
translation:
  language: ru
  text: И соберутся перед Ним все народы[a], и Он отделит одних от других, как пастух отделяет овец от коз[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все племена»; греческое выражение πάντα τὰ ἔθνη буквально означает «все народы».'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово ἐρίφων может более конкретно означать козлят, то есть молодых коз.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθήσονται
  choice: соберутся
  rationale: Будущая пассивная форма συνάγω. Русское возвратное «соберутся» естественно передаёт пассивное значение без уточнения действующего лица.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: перед Ним
  rationale: Краткий и естественный эквивалент, сохраняющий сцену предстояния перед Судьёй.
- source_word: πάντα τὰ ἔθνη
  choice: все народы
  rationale: ἔθνη может означать «народы» или «языческие народы». Здесь «все народы» сохраняет широту выражения и не сужает его до одних язычников.
- source_word: ἀφορίσει
  choice: отделит
  rationale: Глагол обозначает разделение, отделение одной группы от другой; «отделит» ясно и непосредственно передаёт образ.
- source_word: αὐτοὺς ἀπ’ ἀλλήλων
  choice: одних от других
  rationale: Естественная русская формула взаимного разделения внутри собранной совокупности; местоимение мужского рода согласуется по смыслу с людьми, составляющими народы.
- source_word: ὥσπερ
  choice: как
  rationale: Естественно вводит сравнение; дополнительное усиление «подобно тому как» здесь не требуется.
- source_word: ὁ ποιμὴν
  choice: пастух
  rationale: В бытовом сравнении современное «пастух» звучит естественнее, чем церковно окрашенное «пастырь», и точно обозначает человека, разделяющего животных.
- source_word: τὰ πρόβατα
  choice: овец
  rationale: Сохраняется конкретный образ овец, а не более общее понятие стада.
- source_word: τῶν ἐρίφων
  choice: козлов
  rationale: В данном противопоставлении это естественное русское обозначение козьих животных; более узкое значение «козлята» отмечено в сноске.
theological_decisions:
- issue: Объём значения πάντα τὰ ἔθνη
  choice: все народы
  alternative: все язычники
  rationale: Перевод сохраняет лексическую широту и эсхатологический масштаб выражения, не навязывая толкование, согласно которому речь идёт только о нееврейских народах.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Заглавные местоимения «Ним», «Он» обозначают Сына Человеческого в ближайшем контексте. Сохранены пассивность первого глагола, всеобщий охват сцены и пастушеское сравнение.
