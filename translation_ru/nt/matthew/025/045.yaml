  to: 'Тогда Он ответит им: «Истинно говорю вам: в той мере, в какой вы не сделали этого для одного из этих наименьших[a], вы не сделали этого и для Меня».'
  rationale: Замена «поскольку» на «в той мере, в какой» передаёт мерное значение ἐφ’ ὅσον, не превращая его в однозначное причинное утверждение. «Наименьших» точнее отражает греческую превосходную степень и яснее функционирует как обозначение людей. Повтор «этого» во второй части сохраняет явный в греческом повтор глагола и русский параллелизм.
