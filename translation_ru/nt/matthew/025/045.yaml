  source_fidelity: 'Смысл в целом передан верно: будущий ответ, торжественная формула, единичный представитель группы и отрицательный параллелизм сохранены. Однако «поскольку» обычно выражает причину, тогда как ἐφ’ ὅσον прежде всего обозначает меру/степень («в той мере, в какой»); эту нюансировку следует сохранить.'
