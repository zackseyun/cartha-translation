id: MAT.25.45
reference: Matthew 25:45
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσεται αὐτοῖς λέγων· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον οὐκ ἐποιήσατε ἑνὶ τούτων τῶν ἐλαχίστων, οὐδὲ ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/045.yaml
  text: Then he will answer them[a], saying, ‘Truly I say to you, insofar as you did not do it for one of the least of these[b], neither did you do it for me.’
translation:
  language: ru
  text: 'Тогда Он ответит им: «Истинно говорю вам: в той мере, в какой вы не сделали этого для одного из этих наименьших[a], вы не сделали этого и для Меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «эти наименьшие» может относиться конкретно к ученикам Иисуса или, в более широком смысле, к униженным и нуждающимся; перевод сохраняет формулировку текста, не уточняя её.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественно обозначает последовательность событий в сцене суда.
- source_word: ἀποκριθήσεται αὐτοῖς λέγων
  choice: Он ответит им
  rationale: Передаёт будущую форму и адресата; причастие λέγων естественно включено в русскую формулу введения прямой речи без тяжеловесного «говоря».
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Истинно говорю вам
  rationale: Сохраняет торжественную и эмфатическую формулу Иисуса, оставаясь понятной современному читателю.
- source_word: ἐφ’ ὅσον
  choice: поскольку
  rationale: В данном отрицательном сопоставлении выражает соотнесённость поступка с отношением ко Христу; русский вариант естественен и не превращает выражение в отдельное причинное объяснение.
- source_word: οὐκ ἐποιήσατε
  choice: вы не сделали этого для
  rationale: Подразумеваемое дополнение восстанавливается из контекста предшествующих дел милосердия; «для» естественно обозначает действие ради человека.
- source_word: ἑνὶ τούτων τῶν ἐλαχίστων
  choice: для одного из этих меньших
  rationale: Сохраняет единичного представителя группы и суперлативное значение ἐλαχίστων, не уточняя спорный круг лиц.
- source_word: οὐδὲ ἐμοὶ ἐποιήσατε
  choice: то не сделали и для Меня
  rationale: Сохраняет отрицательный параллелизм и прямое отождествление отношения к «меньшим» с отношением ко Христу.
theological_decisions:
- issue: Кого обозначают «эти меньшие»
  choice: Фраза оставлена без уточнения состава группы.
  alternative: Понимать её либо специально как учеников и посланников Иисуса, либо шире — как униженных и нуждающихся.
  rationale: Сам стих утверждает отождествление отношения к ним с отношением к Иисусу, но не разрешает однозначно более широкий экзегетический спор.
translation_notes:
  register: Современный литературный русский язык с торжественным оттенком прямой речи. Местоимения, относящиеся ко Христу, написаны с прописной буквы согласно распространённой русской библейской издательской традиции; синтаксис упрощён без утраты смыслового параллелизма.
