  text: ⸂αἱ γὰρ⸃ μωραὶ λαβοῦσαι τὰς λαμπάδας αὐτῶν οὐκ ἔλαβον μεθ’ ἑαυτῶν ἔλαιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/003.yaml
  text: For the foolish[a], when they took their lamps, did not take oil with them.
translation:
  language: ru
  text: Ведь неразумные, взяв свои светильники[a], не взяли с собой масла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «факелы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ведь
  rationale: Союз поясняет предыдущее утверждение; «ведь» естественно передаёт эту связь в современном русском языке.
- source_word: μωραὶ
  choice: неразумные
  rationale: Субстантивированное прилагательное женского рода отсылает к девушкам из предыдущего контекста. «Неразумные» сохраняет характеристику и не повторяет существительное.
- source_word: λαβοῦσαι
  choice: взяв
  rationale: Аористное причастие обозначает действие, связанное с главным глаголом; русское деепричастие естественно сохраняет краткость и словесный параллелизм.
- source_word: λαμπάδας
  choice: светильники
  rationale: Обозначает переносные источники света, заправляемые маслом; возможное значение «факелы» сохранено в сноске.
- source_word: οὐκ ἔλαβον
  choice: не взяли
  rationale: 'Сохраняет повтор одного глагольного корня в λαβοῦσαι и ἔλαβον: «взяв… не взяли».'
- source_word: μεθ’ ἑαυτῶν
  choice: с собой
  rationale: Естественный русский эквивалент возвратного оборота.
- source_word: ἔλαιον
  choice: масла
  rationale: Прямое обозначение масла, предназначенного для поддержания огня.
