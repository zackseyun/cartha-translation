revisions:
- from: 'Тогда и они ответят: «Господи, когда мы видели тебя голодным, или жаждущим, или странником, или нагим, или больным, или в тюрьме — и не послужили тебе[a]?»'
  to: 'Тогда они тоже ответят: «Господи, когда мы видели тебя голодным или жаждущим, или странником, или без одежды, или больным, или в тюрьме — и не послужили тебе[a]?»'
  rationale: Правка делает русский текст современнее и естественнее, не изменяя смысла. «Они тоже» передаёт усилительное καὶ αὐτοί; «без одежды» передаёт γυμνός без архаизма; «послужили тебе» сохранено как наиболее широкий эквивалент διηκονήσαμέν σοι. Тире перед заключительным «и не послужили тебе» допустимо как интонационное выделение итоговой части вопроса.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:07:13Z'
