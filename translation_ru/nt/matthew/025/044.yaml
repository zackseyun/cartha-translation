  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται καὶ αὐτοὶ λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ καὶ οὐ διηκονήσαμέν σοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/044.yaml
  text: Then they too will answer, saying, ‘Lord, when did we see you hungry or thirsty or a stranger or naked or sick or in prison, and not serve you?’
translation:
  language: ru
  text: 'Тогда они тоже ответят: «Господи, когда мы видели тебя голодным или жаждущим, или странником, или без одежды, или больным, или в тюрьме — и не послужили тебе[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не позаботились о тебе» или «не помогли тебе» (греч. διακονέω).'
    reason: 'Лексическая альтернатива: глагол может обозначать служение, заботу или практическую помощь.'
lexical_decisions:
- source_word: τότε
  choice: тогда
  rationale: Передаёт временную последовательность в сцене суда естественным и точным русским наречием.
- source_word: ἀποκριθήσονται
  choice: ответят
  rationale: Будущая форма ἀποκρίνομαι прямо означает ответ на предшествующее высказывание.
- source_word: καὶ αὐτοὶ
  choice: и они
  rationale: Сохраняет подчёркнутое указание на то, что эта группа, подобно предыдущей, тоже отвечает.
- source_word: Κύριε
  choice: Господи
  rationale: Обычная русская звательная форма титула κύριος при прямом обращении к Иисусу.
- source_word: πεινῶντα ἢ διψῶντα
  choice: голодным, или жаждущим
  rationale: Предикативные причастия переданы естественными русскими обозначениями состояния; «жаждущим» сохраняет возвышенный, но понятный регистр.
- source_word: ξένον
  choice: странником
  rationale: Передаёт человека, чужого данной общине и нуждающегося в приёме, не сужая смысл до конкретной национальности.
- source_word: γυμνὸν
  choice: нагим
  rationale: Сохраняет прямую лексическую силу слова, которое в контексте может также подразумевать недостаток одежды.
- source_word: ἀσθενῆ
  choice: больным
  rationale: В перечне телесных и социальных нужд значение «больной» контекстуально наиболее вероятно, хотя само слово может также означать «слабый».
- source_word: ἐν φυλακῇ
  choice: в тюрьме
  rationale: Современное и понятное обозначение заключения, соответствующее контексту.
- source_word: διηκονήσαμέν σοι
  choice: не послужили тебе
  rationale: «Послужили» сохраняет широкий смысл практического служения и помощи, не ограничивая его церковным служением или одним лишь проявлением заботы.
theological_decisions:
- issue: Титул κύριος в обращении к Иисусу
  choice: Господи
  alternative: Учитель / господин
  rationale: «Господи» сохраняет уважительное обращение и возможный христологический оттенок, не усиливая его сверх того, что выражает текст.
- issue: Смысл διακονέω в заключительном вопросе
  choice: послужили тебе
  alternative: позаботились о тебе / оказали тебе помощь
  rationale: Выбранный вариант сохраняет связь между конкретными делами милосердия и служением Царю, а также широкий диапазон греческого глагола.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Местоимения второго лица оставлены со строчной буквы как часть современной издательской нормы; тире перед заключительной частью подчёркивает общий итог перечисления, не изменяя синтаксической связи.
