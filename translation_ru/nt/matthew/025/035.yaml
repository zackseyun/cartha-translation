id: MAT.25.35
reference: Matthew 25:35
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐπείνασα γὰρ καὶ ἐδώκατέ μοι φαγεῖν, ἐδίψησα καὶ ἐποτίσατέ με, ξένος ἤμην καὶ συνηγάγετέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/035.yaml
  text: For I was hungry and you gave me something to eat[a]; I was thirsty and you gave me something to drink; I was a stranger and you welcomed me,
translation:
  language: ru
  text: Ведь Я был голоден, и вы накормили Меня; Я жаждал, и вы напоили Меня; Я был чужим, и вы приняли Меня[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приютили Меня»; буквально глагол означает «собрали, свели вместе», но здесь речь идёт о гостеприимном приёме чужого человека.'
    reason: Лексическая альтернатива поясняет переносное контекстуальное значение συνάγω.
lexical_decisions:
- source_word: ἐπείνασα
  choice: Я был голоден
  rationale: Аорист передаёт пережитое в прошлом состояние; по-русски это естественнее и точнее, чем буквальное «Я голодал».
- source_word: γὰρ
  choice: Ведь
  rationale: Частица вводит объяснение предыдущего высказывания; «ведь» естественно сохраняет эту пояснительную связь.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: вы накормили Меня
  rationale: Конструкция «дать кому-либо есть» по смыслу означает предоставить пищу; глагол «накормили» передаёт это кратко и естественно.
- source_word: ἐδίψησα
  choice: Я жаждал
  rationale: Глагол обозначает испытываемую жажду; «жаждал» в данном прямом, физическом смысле ясно и литературно.
- source_word: ἐποτίσατέ με
  choice: вы напоили Меня
  rationale: ποτίζω означает дать пить; «напоили» сохраняет параллелизм с «накормили» и не уточняет напиток, не названный в греческом тексте.
- source_word: ξένος
  choice: чужим
  rationale: Здесь слово обозначает человека, не принадлежащего к привычному кругу и нуждающегося в приёме. «Чужим» не сужает значение до путешественника или иностранного гражданина.
- source_word: συνηγάγετέ με
  choice: вы приняли Меня
  rationale: Хотя основное значение συνάγω — «собирать», в сочетании с ξένος здесь имеется в виду гостеприимно принять человека. «Приняли» естественно передаёт этот смысл, не добавляя прямо не выраженного указания на дом.
theological_decisions:
- issue: Гостеприимство в выражении ξένος … συνηγάγετέ με
  choice: «Я был чужим, и вы приняли Меня»
  alternative: «Я был странником, и вы приютили Меня»
  rationale: Выбранный вариант сохраняет личный и нравственный смысл гостеприимного принятия, не ограничивая ξένος только путешественником и не привнося современные юридические или политические категории.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным ритмом. Повтор «Я» сохраняет торжественный параллелизм трёх частей. Местоимения, относящиеся к Христу, написаны с прописной буквы в соответствии с устойчивой русской библейской издательской традицией.
