  terminology: «Чужим» сохраняет широкое значение ξένος — человека вне привычного круга, а «приняли Меня» передаёт приём и гостеприимство без излишнего уточнения о доме. Прописное написание местоимения соответствует заявленной русской библейской редакционной норме. Сноска корректно привязана к «приняли Меня» и поясняет контекстуальное значение без догматических добавлений.
