  text: ἄρατε οὖν ἀπ’ αὐτοῦ τὸ τάλαντον καὶ δότε τῷ ἔχοντι τὰ δέκα τάλαντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/028.yaml
  text: Therefore take the talent from him and give it to the one who has the ten talents[a][b].
translation:
  language: ru
  text: Итак, заберите у него талант[a] и отдайте тому, у кого десять талантов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Талант — крупная единица веса и, соответственно, денежная сумма.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρατε
  choice: заберите
  rationale: Аористный императив множественного числа от αἴρω здесь выражает прямое повеление изъять нечто у человека. «Заберите» естественно передаёт и действие, и значение отделения, дополнительно выраженное ἀπ’ αὐτοῦ.
- source_word: οὖν
  choice: итак
  rationale: Союз отмечает вывод из предшествующего решения господина; «итак» ясно и естественно передаёт эту логическую связь.
- source_word: ἀπ’ αὐτοῦ
  choice: у него
  rationale: ἀπό с родительным обозначает отделение от ранее упомянутого раба. В сочетании «заберите у него» это наиболее естественная русская конструкция.
- source_word: τὸ τάλαντον
  choice: талант
  rationale: Сохранён исторический термин для крупной единицы веса и, соответственно, денежной суммы; пояснение предотвращает современное понимание слова как природной способности.
- source_word: δότε
  choice: отдайте
  rationale: Аористный императив множественного числа от δίδωμι. В контексте передачи изъятой суммы «отдайте» звучит по-русски естественнее, чем нейтральное «дайте», и сохраняет силу повеления.
- source_word: τῷ ἔχοντι
  choice: тому, у кого
  rationale: Субстантивированное причастие передано естественной современной русской конструкцией без добавления слова «человек» или «раб».
- source_word: τὰ δέκα τάλαντα
  choice: десять талантов
  rationale: Речь идёт о конкретных десяти талантах, уже упомянутых в повествовании. В русской конструкции с «у кого» определённость достаточно задаётся контекстом и не требует отдельного указательного слова.
theological_decisions:
- issue: Значение τάλαντον в контексте притчи
  choice: Исторический денежно-весовой термин «талант»
  alternative: крупная сумма денег
  rationale: Греческое слово обозначает крупную единицу веса и, по расширению значения, денежную сумму. Сохранение исторического термина не истолковывает его как врождённую способность и удерживает связь с образным миром притчи; культурное значение разъясняется в сноске.
translation_notes:
  register: 'Современный литературный русский язык с ясной повелительной формой и умеренно традиционной библейской терминологией. Отдельная сноска о возможном переводе ἄρατε не добавлена: русское «заберите у него» уже естественно объединяет значения «взять» и «отнять», поэтому такая альтернатива была бы искусственной.'
