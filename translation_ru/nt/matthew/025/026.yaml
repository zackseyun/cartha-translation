base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/026.yaml
  text: But his master answered and said to him[a], ‘Wicked and lazy servant[b], you knew that I reap where I did not sow and gather where I did not scatter?
translation:
  language: ru
  text: 'Но его господин ответил ему: «Злой и ленивый раб[a]! Ты знал, что я жну там, где не сеял, и собираю оттуда, где не рассеял?[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуга». Греческое слово δοῦλος обозначает раба, но в некоторых контекстах может переводиться как «слуга».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможен перевод как утверждение: «Ты знал, что я жну там, где не сеял, и собираю оттуда, где не рассеял». В древнегреческом тексте современная вопросительная пунктуация отсутствовала.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Но ... ответил
  rationale: Обычная повествовательная формула; «но» естественно передаёт лёгкое противопоставление δέ ответу раба в предыдущем стихе.
- source_word: ὁ κύριος αὐτοῦ
  choice: его господин
  rationale: В контексте притчи κύριος обозначает хозяина раба, а не непосредственно христологический титул. Русское «господин» сохраняет социальное отношение и звучит естественно.
- source_word: Πονηρὲ
  choice: злой
  rationale: Передаёт нравственное осуждение, выраженное πονηρός, а не просто неудовлетворительное качество.
- source_word: δοῦλε
  choice: раб
  rationale: В данном иерархическом хозяйственном контексте δοῦλος прямо обозначает раба. Более мягкое «слуга» возможно и отмечено в сноске.
- source_word: ὀκνηρέ
  choice: ленивый
  rationale: Современное и ясное соответствие слову ὀκνηρός, обозначающему нежелание действовать, леность.
- source_word: ᾔδεις ὅτι
  choice: ты знал, что
  rationale: Передаёт содержание предполагаемого знания раба. Формулировка допускает риторически-вопросительную интонацию по контексту.
- source_word: θερίζω ὅπου οὐκ ἔσπειρα
  choice: жну там, где не сеял
  rationale: Сохраняет земледельческую образность и временное соотношение настоящего и аориста.
- source_word: συνάγω ὅθεν οὐ διεσκόρπισα
  choice: собираю там, где не рассыпал
  rationale: Близко передаёт συνάγω и διασκορπίζω, не добавляя отсутствующего в греческом тексте слова «семя». Русское «там, где» естественно выражает пространственное отношение ὅθεν в этой образной паре.
theological_decisions:
- issue: Интонация последних слов господина
  choice: 'Риторический вопрос: «Ты знал, что я жну…?»'
  alternative: 'Утверждение: «Ты знал, что я жну…»'
  rationale: Греческая рукописная традиция не задаёт современной пунктуации, поэтому фразу можно понять и как утверждение, и как иронический риторический вопрос. Вопрос хорошо согласуется с тем, что господин обращает довод раба против него, но альтернативное прочтение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичной, достойной речью притчи. Земледельческая метафора сохранена без поясняющего добавления «семя»; обращение передано энергично, но без архаизмов.
