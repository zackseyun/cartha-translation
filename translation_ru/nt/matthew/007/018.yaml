source:
  edition: SBLGNT
  text: οὐ δύναται δένδρον ἀγαθὸν καρποὺς πονηροὺς ⸀ποιεῖν, οὐδὲ δένδρον σαπρὸν καρποὺς καλοὺς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/018.yaml
  text: A good tree cannot produce bad fruit[c][b][a], nor can a rotten tree produce good fruit.
translation:
  language: ru
  text: Хорошее дерево не может приносить плохие плоды, и гнилое дерево не может приносить хорошие плоды.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δένδρον ἀγαθόν
  choice: доброе дерево
  rationale: «Доброе» сохраняет основной оценочный смысл ἀγαθός, буквальный образ дерева и связь с нравственным распознаванием по плодам; «здоровое» было бы более толковательным.
- source_word: οὐ δύναται ... ποιεῖν
  choice: не может приносить
  rationale: δύναται выражает невозможность, а ποιεῖν в сочетании с καρπούς естественно передаётся по-русски как «приносить плоды».
- source_word: καρποὺς πονηρούς
  choice: плохие плоды
  rationale: πονηρός допускает значения «плохой», «злой», «негодный»; применительно к плодам «плохие» звучит естественно и сохраняет широкий отрицательный смысл.
- source_word: οὐδέ
  choice: и ... не может
  rationale: В русском параллельном отрицательном построении союз «и» естественно связывает вторую часть, сохраняя смысл οὐδέ без тяжеловесности конструкции «ни».
- source_word: δένδρον σαπρόν
  choice: гнилое дерево
  rationale: σαπρός обозначает гнилое, испорченное или разложившееся; «гнилое» ярко и буквально сохраняет образ.
- source_word: καρποὺς καλούς
  choice: хорошие плоды
  rationale: καλός здесь характеризует плоды как хорошие по качеству; это естественно противопоставляется «плохим плодам».
theological_decisions:
- issue: Характер невозможности в метафоре
  choice: 'Категорическая невозможность: «не может»'
  alternative: «обычно не приносит» или «не должно приносить»
  rationale: Греческое δύναται с отрицанием прямо выражает неспособность. Сильная формулировка сохраняется без добавления богословских выводов, выходящих за пределы самой метафоры.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, ясная и ритмически параллельная. Устойчивое русское сочетание «приносить плоды» передаёт греческое ποιεῖν καρπούς естественнее буквального «делать плоды».
