source:
  edition: SBLGNT
  text: Μὴ δῶτε τὸ ἅγιον τοῖς κυσίν, μηδὲ βάλητε τοὺς μαργαρίτας ὑμῶν ἔμπροσθεν τῶν χοίρων, μήποτε ⸀καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν καὶ στραφέντες ῥήξωσιν ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/006.yaml
  text: Do not give what is holy to dogs[a], and do not throw your pearls before pigs[d][c][b], lest they trample them under their feet and turn and tear you to pieces.
translation:
  language: ru
  text: Не давайте святыни псам и не бросайте вашего жемчуга перед свиньями, чтобы они не растоптали его ногами и, обернувшись, не растерзали вас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ἅγιον
  choice: святыни
  rationale: Субстантивированное прилагательное среднего рода обозначает в широком смысле нечто святое или посвящённое Богу. Русское «святыня» естественно и не сужает референт до учения, жертвы или иного конкретного предмета.
- source_word: τοῖς κυσίν
  choice: псам
  rationale: Сохраняет прямой образ и его резкость; форма «псам» соответствует приподнятому, но понятному библейскому регистру.
- source_word: βάλητε
  choice: бросайте
  rationale: Современный и точный эквивалент βάλλω, не требующий архаичного «мечите».
- source_word: τοὺς μαργαρίτας ὑμῶν
  choice: вашего жемчуга
  rationale: В русском языке «жемчуг» обычно употребляется как собирательное вещественное существительное; родительный падеж обусловлен отрицанием и естественен в данном контексте.
- source_word: ἔμπροσθεν τῶν χοίρων
  choice: перед свиньями
  rationale: Прямо сохраняет пространственный образ греческого текста.
- source_word: μήποτε
  choice: чтобы … не
  rationale: Естественно передаёт предупреждение о возможном нежелательном результате без книжного «дабы не».
- source_word: καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν
  choice: они не растоптали его ногами
  rationale: Передаёт интенсивный глагол καταπατέω и явное упоминание ног. Местоимение «его» согласовано с естественным русским собирательным «жемчугом».
- source_word: στραφέντες
  choice: затем, обернувшись
  rationale: Деепричастие сохраняет обстоятельственное значение аористного причастия и последовательность действий; «затем» делает эту последовательность ясной, не меняя смысла.
- source_word: ῥήξωσιν ὑμᾶς
  choice: не растерзали вас
  rationale: «Растерзать» естественно и выразительно передаёт насильственное разрывание, обозначенное ῥήγνυμι, без ослабления до общего «напасть».
theological_decisions:
- issue: Толкование образов святыни, псов, жемчуга и свиней
  choice: Сохранить образы без поясняющей расшифровки.
  alternative: Уточнить, что святыня и жемчуг — это священное учение или весть о Царстве, а псы и свиньи — враждебные ей люди.
  rationale: Сам стих не определяет референты метафор однозначно. Их экспликация сузила бы смысл и внесла в перевод конкретное толкование.
- issue: Связь двух предостерегаемых действий
  choice: 'Передать последовательность: свиньи растаптывают жемчуг, затем оборачиваются и растерзывают людей.'
  alternative: Передать два действия как строго параллельные без временного оттенка.
  rationale: Аористное причастие στραφέντες естественно допускает последовательное прочтение «обернувшись», при этом оба действия остаются частью единого предупреждения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Псам» и «святыня» сохраняют достоинство и силу афористической формы, оставаясь понятными современному читателю. Метафоры оставлены без конфессиональной или доктринальной расшифровки.
