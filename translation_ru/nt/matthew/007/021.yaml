  text: Οὐ πᾶς ὁ λέγων μοι· Κύριε κύριε εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν ⸀τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/021.yaml
  text: Not everyone who says to me[a], ‘Lord, Lord,’ will enter into the kingdom of heaven[b], but the one who does the will of my Father who is in heaven will enter.
translation:
  language: ru
  text: 'Не всякий, кто говорит мне: «Господи, Господи!», войдёт в Царство Небесное[a], но войдёт тот, кто исполняет волю моего Отца, который на небесах[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение буквально: «царство небес»; у Матфея оно характерно и в других контекстах соответствует выражению «Царство Бога».'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте «небеса» стоит во множественном числе.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ πᾶς ὁ λέγων μοι
  choice: Не всякий, кто говорит мне
  rationale: 'Сочетание οὐ πᾶς выражает частичное отрицание: «не всякий», а не «никто». Причастие настоящего времени естественно передано придаточным предложением, сохраняющим общий, повторяющийся характер действия.'
- source_word: Κύριε κύριε
  choice: Господи, Господи!
  rationale: Сохранены традиционное и контекстуально точное обращение «Господи» и его эмфатическое повторение.
- source_word: εἰσελεύσεται
  choice: войдёт
  rationale: Будущая форма εἰσέρχομαι естественно передаётся русским «войдёт»; отдельное выражение среднего залога здесь не требуется.
- source_word: εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: в Небесное Царство
  rationale: Устойчивое и понятное русское соответствие характерному для Матфея выражению «Царство небес»; направление передано предлогом «в» с винительным падежом.
- source_word: ἀλλ’ ὁ ποιῶν
  choice: но войдёт тот, кто исполняет
  rationale: Субстантивированное причастие передано конструкцией «тот, кто». Подразумеваемое сказуемое «войдёт» повторено ради ясности и естественности по-русски, не меняя смысла противопоставления.
- source_word: τὸ θέλημα
  choice: волю
  rationale: «Воля» сохраняет этическое и богословское содержание θέλημα, не сводя его лишь к желанию.
- source_word: τοῦ πατρός μου τοῦ ἐν τοῖς οὐρανοῖς
  choice: моего Отца, Который на небесах
  rationale: Переданы принадлежность и определительное отношение; русское «на небесах» естественно отражает греческое множественное число οὐρανοῖς.
theological_decisions:
- issue: Вхождение в Царство в связи с устным исповеданием и послушанием
  choice: Сохранено прямое противопоставление обращения к Иисусу как к Господу и исполнения воли Отца.
  alternative: Истолковать стих либо как учение о спасении делами, либо как утверждение достаточности одного устного исповедания.
  rationale: Сам стих подчёркивает различие между словами и исполнением воли Отца, но не излагает здесь целостного учения об оправдании или спасении; перевод не должен заранее разрешать эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизации. Названия «Небесное Царство» и «Отец» написаны с прописной буквы как контекстуальные наименования; местоимения, относящиеся к Иисусу и Отцу, не получают добавочной почтительной капитализации, отсутствующей в греческом тексте. Повтор «Господи, Господи» и явное второе «войдёт» сохраняют силу предупреждения и делают противопоставление ясным.
