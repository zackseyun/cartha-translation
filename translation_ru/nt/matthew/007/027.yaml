lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: полил дождь
  rationale: Естественное современное русское выражение для сильного дождя; оно передаёт начало и нисходящее движение осадков без буквальной тяжеловесности «дождь сошёл».
- source_word: ἦλθον οἱ ποταμοί
  choice: разлились реки
  rationale: ποταμοί буквально означает «реки», а глагольная передача «разлились» естественно выражает приход паводковых вод в данном контексте, сохраняя образ рек.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: подули ветры
  rationale: Прямая и естественная передача греческого выражения с сохранением множественного числа.
- source_word: προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ
  choice: обрушились на тот дом
  rationale: В контексте бури προσκόπτω обозначает сильный удар о дом; «обрушились на» передаёт напор ветров и направление действия естественнее буквального «ударились о».
- source_word: ἔπεσεν
  choice: он рухнул
  rationale: По-русски о доме «рухнул» ясно и сильно передаёт πίπτω; местоимение явно относится к дому.
- source_word: ἡ πτῶσις αὐτῆς μεγάλη
  choice: падение его было великим
  rationale: Сохраняет существительное, однокоренное греческому глаголу «пасть», и сдержанную итоговую формулу источника, не заменяя её толкованием вроде «катастрофическое разрушение».
theological_decisions:
- issue: Образ сурового суда в заключении притчи
  choice: падение его было великим
  alternative: его разрушение было катастрофическим
  rationale: Греческий текст подчёркивает величину падения дома, но прямо не раскрывает образ как эсхатологический суд. Перевод сохраняет силу предупреждения, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной повествовательной ритмикой. Повторяющееся греческое καί передано сочетанием начального «И», перечисления и отдельного итогового предложения, чтобы избежать неестественной перегруженности союзами.
