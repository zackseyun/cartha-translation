id: MAT.7.3
reference: Matthew 7:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ ἐν τῷ σῷ ὀφθαλμῷ δοκὸν οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/003.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: ru
  text: Почему же ты видишь соринку в глазу своего брата, а бревна в собственном глазу не замечаешь?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Соринка» может также означать щепку, соломинку или частицу мякины; «бревно» — деревянную балку или брус.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: почему
  rationale: В вопросительном сочетании с βλέπεις местоимение имеет идиоматическое значение причины и передаёт обличительную силу риторического вопроса.
- source_word: δὲ
  choice: же … а
  rationale: Частица обозначает переход и лёгкое противопоставление; русская конструкция «Почему же… а…» естественно передаёт обе функции.
- source_word: βλέπεις
  choice: видишь
  rationale: Сохраняет зрительный образ и лексически отличается от κατανοεῖς.
- source_word: κάρφος
  choice: соринку
  rationale: Слово обозначает малую сухую частицу, щепку или соломинку; «соринка» естественна в русском образе попадания в глаз и ясно противопоставлена бревну.
- source_word: ἀδελφοῦ
  choice: брата
  rationale: Сохранены мужской род и единственное число исходного текста без расширительного толкования.
- source_word: σῷ
  choice: собственном
  rationale: Передаёт эмфатическое противопоставление глазу брата.
- source_word: δοκόν
  choice: бревна
  rationale: δοκός — крупный деревянный брус или балка; «бревно» в современном русском ярко и естественно сохраняет намеренную гиперболу.
- source_word: οὐ κατανοεῖς
  choice: не замечаешь
  rationale: Передаёт отсутствие внимательного восприятия и сохраняет смысловое различие с «видишь».
- source_word: ὀφθαλμῷ
  choice: глазу
  rationale: Прямой и естественный эквивалент в данном конкретном образе.
theological_decisions:
- issue: Род термина родства ἀδελφοῦ
  choice: брата
  alternative: брата или сестры; ближнего
  rationale: Греческий текст имеет мужской род и единственное число. Формулировка сохранена без нейтрализации, хотя изречение применимо шире.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Риторический параллелизм и намеренно преувеличенный контраст сохранены; конструкция «Почему же… а…» звучит естественно и передаёт противопоставление.
