  text: ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς. μήτι συλλέγουσιν ἀπὸ ἀκανθῶν ⸀σταφυλὰς ἢ ἀπὸ τριβόλων σῦκα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/016.yaml
  text: You will recognize them by their fruits[a]. Do people gather grapes from thorns[b], or figs from thistles?
translation:
  language: ru
  text: По их плодам вы узнаете их[a]. Разве собирают виноград с терновника или инжир с чертополоха[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «По их плодам вы распознаете их».'
    reason: lexical_alternative
  - marker: b
    text: 'Вопрос предполагает отрицательный ответ: виноград не собирают с терновника, а инжир — с чертополоха.'
    reason: rhetorical_question
lexical_decisions:
- source_word: καρπῶν
  choice: плодам
  rationale: Сохранена явная форма множественного числа и конкретная сельскохозяйственная метафора; в контексте плоды указывают на наблюдаемые проявления и последствия, но перевод не сужает образ до «поступков» или «результатов».
- source_word: ἐπιγνώσεσθε
  choice: узнаете
  rationale: Будущая форма ἐπιγινώσκω здесь означает, что людей можно узнать или распознать по наблюдаемым признакам. «Узнаете» естественно по-русски и не привносит усиленного значения «полностью познаете».
- source_word: μήτι
  choice: разве
  rationale: Частица вводит риторический вопрос, предполагающий отрицательный ответ. Русское «разве» естественно передаёт это ожидание.
- source_word: συλλέγουσιν
  choice: собирают
  rationale: Обычный современный глагол для сбора плодов, сохраняющий сельскохозяйственный образ.
- source_word: ἀκανθῶν
  choice: терновника
  rationale: ἀκάνθαι обозначает колючие растения или терновые кусты. «Терновник» кратко и ясно противопоставлен винограду.
- source_word: σταφυλάς
  choice: виноград
  rationale: Естественный русский собирательный эквивалент греческого множественного числа при описании сбора виноградных ягод.
- source_word: τριβόλων
  choice: чертополоха
  rationale: Слово обозначает колючее сорное растение. «Чертополох» понятен современному читателю и сохраняет параллель между двумя видами колючих растений.
- source_word: σῦκα
  choice: инжир
  rationale: Естественный русский собирательный эквивалент для плодов смоковницы в данном вопросе.
- source_word: αὐτῶν / αὐτούς
  choice: их / их
  rationale: Оба местоимения отнесены к людям, о которых говорится в контексте; личная отсылка сохранена без поясняющей вставки.
theological_decisions:
- issue: Метафорическое значение «плодов» при распознавании людей
  choice: Сохранить слово «плоды», не раскрывая метафору непосредственно в тексте.
  alternative: «По их поступкам» или «по результатам их дел»
  rationale: Конкретный образ плодов важен для всего изречения и сохраняет богословскую и межтекстовую связь, тогда как поясняющие варианты неоправданно сужают его значение.
- issue: Степень знания, выраженная ἐπιγνώσεσθε
  choice: «узнаете»
  alternative: «распознаете» или «полностью узнаете»
  rationale: Контекст говорит о различении людей по свидетельствам их жизни. «Узнаете» сохраняет естественную широту глагола, а «полностью узнаете» приписывало бы ему спорное усилительное значение.
translation_notes:
  register: Современный литературный русский язык с кратким, ритмичным параллелизмом. Традиционно узнаваемый образ «плодов» сохранён, но порядок слов сделан естественным для современной речи. «Разве» ясно передаёт риторический характер вопроса.
