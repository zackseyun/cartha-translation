source:
  edition: SBLGNT
  text: καὶ τότε ὁμολογήσω αὐτοῖς ὅτι Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ’ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/023.yaml
  text: And then I will declare to them[a], ‘I never knew you; depart from me[b], you who practice lawlessness.’
translation:
  language: ru
  text: 'И тогда Я объявлю им: «Я никогда не знал вас[a]. Отойдите от Меня, творящие беззаконие[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я никогда не признавал вас». Греческое слово «знал» может обозначать личное признание и отношения, а не только осведомлённость.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «делающие беззаконие»; возможна более общая передача: «творящие зло».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τότε
  choice: И тогда
  rationale: Сохраняет как связь с предшествующим контекстом, так и временную последовательность.
- source_word: ὁμολογήσω
  choice: объявлю
  rationale: В судебно-эсхатологическом контексте передаёт открытое и недвусмысленное заявление; «признаюсь» могло бы ошибочно подразумевать признание вины.
- source_word: Οὐδέποτε
  choice: никогда
  rationale: Естественно и кратко передаёт абсолютное, усиленное отрицание.
- source_word: ἔγνων
  choice: знал
  rationale: 'Сохраняет прямую библейскую формулировку и её смысловую широту: речь может идти не просто об осведомлённости, а о личном признании и отношениях.'
- source_word: ἀποχωρεῖτε
  choice: Отойдите
  rationale: Передаёт повеление удалиться и соответствует торжественному тону, оставаясь понятным современному читателю.
- source_word: οἱ ἐργαζόμενοι
  choice: творящие
  rationale: Причастная конструкция естественно описывает людей по характерному для них действию и сохраняет сжатую силу оригинала.
- source_word: τὴν ἀνομίαν
  choice: беззаконие
  rationale: Сохраняет нравственно-правовой оттенок ἀνομία — пренебрежение Божьим законом или установленным порядком; это точнее общего «зло».
theological_decisions:
- issue: Смысл слов «Я никогда не знал вас»
  choice: Сохранено «Я никогда не знал вас» без поясняющего пересказа.
  alternative: «Я никогда не признавал вас» / «Я никогда не одобрял вас»
  rationale: Оригинал выражает знание в личностном и, возможно, судебном смысле, но не раскрывает его доктринально. Прямая формулировка сохраняет заложенную в тексте смысловую и богословскую напряжённость.
- issue: Сила слова ἀνομία
  choice: «беззаконие»
  alternative: «зло» / «нечестие»
  rationale: «Беззаконие» сохраняет связь с нарушением закона или Божьего порядка, не сужая смысл до какой-либо конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаичной библейской интонацией. Прописные местоимения при речи Иисуса следуют распространённой русской издательской традиции. «Творящие беззаконие» сохраняет лаконичность и риторическую силу исходной формулы.
