  text: Καὶ ἐγένετο ὅτε ⸀ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, ἐξεπλήσσοντο οἱ ὄχλοι ἐπὶ τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/028.yaml
  text: And it happened that when Jesus had finished these words[b][a], the crowds were astonished at his teaching.
translation:
  language: ru
  text: И вот, когда Иисус закончил говорить эти слова[a], толпы изумлялись его учению.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «эти высказывания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: И случилось, что, когда
  rationale: Сохранена греческая повествовательная формула перехода и вложенное временное придаточное, но выражение остаётся понятным на современном русском языке.
- source_word: ἐτέλεσεν
  choice: закончил
  rationale: Глагол обозначает доведение речи до конца; «закончил» естественно передаёт завершённость действия.
- source_word: τοὺς λόγους τούτους
  choice: эти слова
  rationale: «Слова» прямо и без добавочного толкования указывают на только что произнесённую речь; возможное значение «высказывания» отмечено в сноске.
- source_word: ἐξεπλήσσοντο
  choice: изумлялись
  rationale: Имперфект передаёт продолжавшуюся или общую реакцию собравшихся, а «изумлялись» сохраняет силу греческого глагола и достойный регистр.
- source_word: οἱ ὄχλοι
  choice: толпы людей
  rationale: Форма сохраняет множественное число греческого существительного, а добавление «людей» делает русское выражение естественнее и яснее.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: его учению
  rationale: При данном глаголе ἐπί с дательным указывает на предмет или основание изумления; русский дательный после «изумляться» передаёт это естественно.
theological_decisions:
- issue: На что указывают «эти слова»
  choice: Непосредственно предшествующее учение Иисуса названо «этими словами».
  alternative: «Эти высказывания» или поясняющее «эта проповедь».
  rationale: Перевод не вводит отсутствующее в греческом тексте название речи и сохраняет широкое значение λόγοι.
translation_notes:
  register: Современный литературный русский язык с ясной, но несколько торжественной повествовательной интонацией. Местоимение «его» оставлено со строчной буквы, поскольку греческий текст не кодирует конфессиональную практику почтительного написания с прописной.
