  source_fidelity: 'Смысл передан в целом верно: ἐτέλεσεν относится к завершению речи, τοὺς λόγους τούτους — к предшествующим словам, οἱ ὄχλοι сохранены во множественном числе, а ἐξεπλήσσοντο удачно передано несовершенным видом. Однако «И случилось, что, когда» — неестественная для современного литературного русского калька; повествовательную переходную формулу Καὶ ἐγένετο можно передать русским «И вот, когда» без утраты функции. Сочетание «закончил эти слова» также нуждается в более естественном оформлении.'
  naturalness: «И вот, когда Иисус закончил говорить эти слова» звучит естественно и литературно, сохраняя связь с завершаемой речью. «Толпы изумлялись его учению» — естественное соответствие греческому множественному числу и имперфекту. Добавление «людей» после «толпы» избыточно.
  terminology: Имя «Иисус», «учение» и строчное «его» уместны для нейтрального современного литературного регистра. «Эти слова» точно передаёт τοὺς λόγους τούτους; альтернативу «эти высказывания» допустимо оставить в сноске. Конфессионально окрашенные или интерпретирующие обозначения речи не вводятся.
