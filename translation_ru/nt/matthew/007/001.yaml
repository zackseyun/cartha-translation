  text: Do not judge[a], so that you may not be judged.
translation:
  language: ru
  text: Не судите[a], чтобы вас не судили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не осуждайте, чтобы вас не осудили». Греческий глагол в некоторых контекстах может означать «осуждать», однако «судить» имеет более широкий смысл и сохраняет повтор одного и того же слова в обеих частях стиха.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ κρίνετε
  choice: Не судите
  rationale: Μή с формой повелительного наклонения выражает запрет. «Не судите» естественно передаёт его в современном русском и сохраняет широкий смысл κρίνω.
- source_word: ἵνα μὴ
  choice: чтобы … не
  rationale: Оборот ἵνα с отрицанием и сослагательным наклонением выражает цель или следствие; русская конструкция «чтобы … не» естественно сохраняет эту связь.
- source_word: κριθῆτε
  choice: вас не судили
  rationale: Пассивная форма κρίνω передана тем же русским корнем, что и κρίνετε, благодаря чему сохраняются лексический повтор и риторическое равновесие оригинала. Местоимение «вас» естественно выражает значение второго лица множественного числа.
theological_decisions:
- issue: Объём значения κρίνω в запрете Иисуса
  choice: Сохранить более широкое «судить», не сужая смысл до «осуждать».
  alternative: Не осуждайте, чтобы и вас не осудили.
  rationale: В данном стихе κρίνω само по себе допускает широкий смысл, тогда как ближайший контекст уточняет характер запрещённого суда. Перевод «судить» сохраняет смысловое и богословское напряжение, не внося в текст преждевременного толкования.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Частица «и» в выражении «и вас» естественно подчёркивает ответное действие, подразумеваемое конструкцией оригинала.
