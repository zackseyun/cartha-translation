source:
  edition: SBLGNT
  text: ἢ πῶς ἐρεῖς τῷ ἀδελφῷ σου· Ἄφες ἐκβάλω τὸ κάρφος ⸀ἐκ τοῦ ὀφθαλμοῦ σου, καὶ ἰδοὺ ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/004.yaml
  text: Or how will you say to your brother[a], ‘Let me take the speck out of your eye,’ and behold[c][b], the beam is in your own eye?
translation:
  language: ru
  text: 'Или как ты скажешь своему брату[a]: «Позволь мне вынуть соринку из твоего глаза», — и вот: в твоём глазу — балка[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. «брату»; форма мужского рода в единственном числе может в общем смысле обозначать другого ученика.
    reason: cultural_note
  - marker: b
    text: 'Или: «бревно»; греч. δοκός — большой деревянный брус или балка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ πῶς ἐρεῖς
  choice: Или как скажешь
  rationale: Сохраняет соединительное ἢ, вопросительное πῶς и форму будущего времени ἐρεῖς, а также риторический характер вопроса.
- source_word: τῷ ἀδελφῷ σου
  choice: своему брату
  rationale: Точно передаёт мужской род и единственное число греческого выражения; русское «своему» естественно соотносит брата с подлежащим.
- source_word: Ἄφες ἐκβάλω
  choice: Дай я выну
  rationale: Передаёт идиоматическую просьбу о позволении и конкретное действие извлечения предмета из глаза естественным современным русским языком.
- source_word: τὸ κάρφος
  choice: соринку
  rationale: Краткое и привычное русское обозначение малого постороннего кусочка в глазу; сохраняет резкий контраст с δοκός.
- source_word: καὶ ἰδοὺ
  choice: и вот
  rationale: Естественный современный русский указательный оборот, привлекающий внимание к поразительному несоответствию.
- source_word: ἡ δοκὸς
  choice: бревно
  rationale: Передаёт крупный деревянный предмет и гиперболический контраст; в русском библейском и общеупотребительном образе звучит яснее, чем техническое «балка».
- source_word: ἐν τῷ ὀφθαλμῷ σοῦ
  choice: в твоём собственном глазу
  rationale: Сохраняет местное значение ἐν; «собственном» естественно подчёркивает контраст, явный из контекста.
theological_decisions:
- issue: Передача ἀδελφῷ в мужском роде
  choice: брату
  alternative: брату или сестре; ближнему; единоверцу
  rationale: Греческий текст употребляет существительное мужского рода в единственном числе. Основной текст сохраняет эту форму, не сужая и не расширяя её возможное представительное значение; пояснение вынесено в сноску.
- issue: Гиперболический контраст κάρφος / δοκός
  choice: соринка / бревно
  alternative: щепка / балка; соринка / балка
  rationale: Эта пара ясно сохраняет намеренно несоразмерный образ Иисуса и не ослабляет его риторическую силу.
translation_notes:
  register: Современный литературный русский язык с достойным, но не архаичным звучанием. «И вот» передаёт ἰδού без устаревшего «се»; «Дай я выну» естественно воспроизводит просьбу о позволении. Образная пара «соринка — бревно» понятна широкому читателю и сохраняет гиперболу.
