id: MAT.7.11
reference: Matthew 7:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὄντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς δώσει ἀγαθὰ τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/011.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him.
translation:
  language: ru
  text: Итак, если вы, будучи злы, умеете давать своим детям добрые дары, то тем более ваш Отец, Который на небесах[a], даст доброе[b] тем, кто просит у Него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более традиционно: «на небе». В греческом тексте употреблено множественное число: «на небесах».'
    reason: lexical_alternative
  - marker: b
    text: Некоторые переводы повторяют здесь «добрые дары», однако в греческом тексте сказано просто «доброе».
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ ὄντες
  choice: будучи злы
  rationale: Прямо передаёт причастную конструкцию и сохраняет резкость слов Иисуса, не усиливая её до «порочны» и не смягчая до «несовершенны».
- source_word: οἴδατε ... διδόναι
  choice: умеете давать
  rationale: В сочетании с инфинитивом οἴδατε обозначает практическое умение; по-русски естественно передаётся глаголом «умеете».
- source_word: δόματα ἀγαθὰ
  choice: добрые дары
  rationale: Сохраняет существительное δόματα («дары») и определение ἀγαθὰ («добрые»), звуча естественно и достойно.
- source_word: τοῖς τέκνοις ὑμῶν
  choice: своим детям
  rationale: τέκνα включает детей обоих полов; возвратное «своим» естественно при русском подлежащем «вы».
- source_word: πόσῳ μᾶλλον
  choice: то тем более
  rationale: Ясно выражает аргумент от меньшего к большему и естественно связывает части русского условного предложения.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: ваш Отец, Который на небесах
  rationale: Сохраняет слово «Отец» и отдельное локативное определение, а также передаёт множественное число οὐρανοῖς.
- source_word: δώσει ἀγαθὰ
  choice: даст доброе
  rationale: Передаёт субстантивированное ἀγαθὰ, не добавляя отсутствующее во второй части существительное δόματα («дары»).
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: тем, кто просит у Него
  rationale: Естественно передаёт субстантивированное причастие и его общий, не ограниченный единичным случаем смысл.
theological_decisions:
- issue: Смысл характеристики πονηροὶ ὄντες
  choice: будучи злы
  alternative: хотя вы грешны / будучи несовершенны
  rationale: Прямое описание сохраняет антропологическую напряжённость текста, не превращая его ни в развёрнутую формулу о человеческой природе, ни в смягчённое указание на несовершенство.
- issue: Форма выражения ὁ ἐν τοῖς οὐρανοῖς
  choice: Который на небесах
  alternative: Небесный Отец / Отец на небе
  rationale: Локативная конструкция и множественное число источника сохранены без превращения выражения в богословский титул.
- issue: Отсутствие δόματα во второй части
  choice: даст доброе
  alternative: даст добрые дары
  rationale: Перевод не восполняет существительное «дары» из первой части и тем самым сохраняет различие формулировок греческого текста.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Конструкция «если… то тем более» естественно передаёт ход сравнения; прописные местоимения «Который», «Него» соответствуют принятому благоговейному библейскому регистру.
