  text: καὶ πᾶς ὁ ἀκούων μου τοὺς λόγους τούτους καὶ μὴ ποιῶν αὐτοὺς ὁμοιωθήσεται ἀνδρὶ μωρῷ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν ἄμμον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/026.yaml
  text: And everyone who hears these words of mine and does not do them will be like a foolish man[a], who built his house on the sand.
translation:
  language: ru
  text: А всякий, кто слышит эти Мои слова и не исполняет их, уподобится неразумному человеку[a], который построил свой дом на песке.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «неразумному мужчине»; в греческом сравнении употреблено существительное мужского рода с обобщающим применением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀκούων
  choice: всякий, кто слышит
  rationale: Субстантивированное причастие настоящего времени имеет обобщающий смысл; этот вариант естественен для современного русского языка и сохраняет значение каждого представителя группы.
- source_word: μου τοὺς λόγους τούτους
  choice: эти Мои слова
  rationale: Сохраняются указательное выделение и принадлежность слов Иисусу; «слова» прямо передаёт λόγους.
- source_word: μὴ ποιῶν αὐτούς
  choice: не исполняет их
  rationale: В данном контексте ποιέω означает осуществлять услышанное на деле. «Исполняет» звучит естественнее буквального «делает их» и сохраняет практическую направленность выражения.
- source_word: ὁμοιωθήσεται
  choice: уподобится
  rationale: Будущая пассивная форма выражает сравнение; «уподобится» точно и достойно передаёт её без излишней тяжеловесности.
- source_word: ἀνδρὶ μωρῷ
  choice: неразумному человеку
  rationale: ἀνήρ обозначает мужчину, но здесь служит образом с обобщающим применением. «Человек» естественно для русского сравнительного оборота, а сноска сохраняет сведения о мужском роде оригинала. «Неразумный» передаёт μωρός без чрезмерно разговорного или оскорбительного оттенка.
- source_word: ὅστις
  choice: который
  rationale: Относительное местоимение вводит поясняющую часть сравнения; простое «который» достаточно.
- source_word: ᾠκοδόμησεν
  choice: построил
  rationale: Прямое и естественное соответствие аористу глагола «строить».
- source_word: αὐτοῦ τὴν οἰκίαν
  choice: свой дом
  rationale: Возвратно-притяжательное «свой» естественно соотносит дом с субъектом придаточного предложения; «дом» сохраняет образ физического строения.
- source_word: ἐπὶ τὴν ἄμμον
  choice: на песке
  rationale: Предлог с винительным обозначает основание, на котором построен дом; русское «на песке» естественно и ясно.
theological_decisions:
- issue: Мужской род в обобщающем сравнении
  choice: неразумному человеку[a]
  alternative: неразумному мужчине
  rationale: Греческое ἀνήρ формально обозначает мужчину, однако персонаж сравнения представляет всякого слушающего. Основной текст передаёт обобщающее применение естественным русским языком, а сноска сообщает о грамматически и лексически мужском образе оригинала, не устраняя его молча.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавная буква в «Мои» указывает на Иисуса как говорящего, не добавляя к тексту отдельного толкования. Формулировка сохраняет тесный параллелизм с предыдущим стихом и причинно-практическое противопоставление между слышанием и исполнением.
