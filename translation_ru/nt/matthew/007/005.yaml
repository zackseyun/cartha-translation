  text: ὑποκριτά, ἔκβαλε πρῶτον ⸂ἐκ τοῦ ὀφθαλμοῦ σοῦ τὴν δοκόν⸃, καὶ τότε διαβλέψεις ἐκβαλεῖν τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/005.yaml
  text: Hypocrite[a], first remove the beam from your eye[b], and then you will see clearly to remove the speck from your brother’s eye.
translation:
  language: ru
  text: Лицемер! Вынь прежде бревно из своего глаза, и тогда будешь ясно видеть, как вынуть соринку из глаза твоего брата.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποκριτά
  choice: Лицемер!
  rationale: Звательная форма единственного числа выражает прямое и резкое обличение; отдельное восклицание естественно передаёт его силу по-русски.
- source_word: ἔκβαλε
  choice: вынь
  rationale: Аористный императив ἐκβάλλω в образе инородного предмета в глазу естественно передаётся глаголом «вынуть».
- source_word: πρῶτον
  choice: прежде
  rationale: Указывает на первоочерёдность действия; «прежде» сохраняет последовательность и соответствует dignified biblical register.
- source_word: δοκόν
  choice: бревно
  rationale: δοκός обозначает крупный деревянный брус или балку. «Бревно» ясно сохраняет намеренно гиперболический контраст с соринкой и привычно в русском образном выражении.
- source_word: διαβλέψεις
  choice: будешь ясно видеть
  rationale: Передаёт усиленное значение διαβλέπω — видеть ясно, прозреть; конструкция также позволяет естественно присоединить инфинитив цели.
- source_word: ἐκβαλεῖν
  choice: как вынуть
  rationale: Инфинитив зависит от διαβλέψεις и указывает на действие, которое станет возможно при ясном зрении. «Как вынуть» естественно выражает практическую способность, не устраняя образ ясного видения.
- source_word: κάρφος
  choice: соринку
  rationale: κάρφος — малая сухая частица, щепка или соломинка. «Соринка» естественна для русского образа попадания в глаз и сохраняет резкий контраст с бревном.
- source_word: ἀδελφοῦ
  choice: брата
  rationale: Сохраняет мужской род и единственное число греческого ἀδελφός, а также отношение внутри общины, не заменяя его более общим понятием.
theological_decisions:
- issue: Значение ἀδελφοῦ как родственного или общинного обозначения
  choice: твоего брата
  alternative: другого человека; ближнего
  rationale: Греческий текст употребляет существительное мужского рода единственного числа «брат». Буквальная передача сохраняет общинное и личное измерение наставления без гендерной нейтрализации.
- issue: Связь διαβλέψεις с ἐκβαλεῖν
  choice: будешь ясно видеть, как вынуть
  alternative: сможешь вынуть; увидишь ясно, чтобы вынуть
  rationale: Формулировка сохраняет как усиленное зрительное значение διαβλέπω, так и подразумеваемую способность совершить последующее действие, не сводя выражение только к способности или только к цели.
translation_notes:
  register: 'Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис краткий и ясный; гиперболический контраст «бревно — соринка» сохранён. Стих не требует сносок: основные лексические альтернативы не создают существенной смысловой неопределённости для читателя.'
