  verdict: approve
  source_fidelity: Текст точно передаёт три параллельных повеления во множественном числе и следующие за ними будущие обещания. «Вам будет дано» сохраняет безлично-пассивную неопределённость греческого δοθήσεται ὑμῖν. «Вам откроют» — естественная русская неопределённо-личная передача ἀνοιγήσεται ὑμῖν; она не называет деятеля и подразумевает обычный в данном образе объект («дверь»), не добавляя его в текст.
  naturalness: Формулировка звучит естественно на современном литературном русском. Тире удачно поддерживают краткий ритмический параллелизм; «просите — ... ищите — ... стучите — ...» ясно и выразительно.
  terminology: «Просите», «ищите», «стучите» соответствуют обычному нейтрально-литературному регистру и не вносят конфессионально обусловленных толкований. Сноска корректно отмечает возможный контекстуальный оттенок длительности/повторяемости у греческих презентных императивов, не выдавая его за обязательное значение.
