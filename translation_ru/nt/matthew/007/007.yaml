id: MAT.7.7
reference: Matthew 7:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/007.yaml
  text: Ask[a], and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: ru
  text: Просите[a] — и вам будет дано; ищите — и найдёте; стучите — и вам откроют.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческие формы повелительного наклонения настоящего времени могут также подразумевать продолжающееся или повторяющееся действие: «Продолжайте просить… продолжайте искать… продолжайте стучать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἰτεῖτε
  choice: Просите
  rationale: Настоящее повелительное наклонение, 2-е лицо множественного числа. «Просите» естественно передаёт побуждение; возможный оттенок продолжительности отмечен в сноске.
- source_word: δοθήσεται ὑμῖν
  choice: вам будет дано
  rationale: Сохранены будущее время, страдательная конструкция и дательный ὑμῖν; подразумеваемый дающий не назван, как и в греческом тексте.
- source_word: ζητεῖτε
  choice: ищите
  rationale: Краткое и естественное повеление, сохраняющее как прямой, так и переносный смысл греческого глагола.
- source_word: εὑρήσετε
  choice: найдёте
  rationale: Будущее действительного залога передано естественной современной русской формой.
- source_word: κρούετε
  choice: стучите
  rationale: Глагол естественно обозначает стук с целью добиться, чтобы открыли; продолжительный оттенок формы отмечен в сноске.
- source_word: ἀνοιγήσεται ὑμῖν
  choice: вам откроют
  rationale: Русская неопределённо-личная конструкция естественно передаёт греческий страдательный залог, не называя действующего лица, и сохраняет значение ὑμῖν.
- source_word: καὶ
  choice: и
  rationale: Союз «и» сохраняет трёхчастный параллелизм и не добавляет явно не выраженного значения следствия.
theological_decisions:
- issue: Видовой оттенок трёх императивов настоящего времени
  choice: 'В основном тексте употреблены обычные повелительные формы: «просите», «ищите», «стучите».'
  alternative: «Продолжайте просить… искать… стучать» или «просите не переставая…»
  rationale: Греческий презенс допускает представление о продолжающемся или повторяющемся действии, однако сам по себе не требует развёрнутой передачи настойчивости. Сноска сохраняет эту возможность без её навязывания.
- issue: Неуказанный деятель в будущих пассивных формах
  choice: 'Деятель не назван: «вам будет дано» и «вам откроют».'
  alternative: Назвать Бога как дающего и открывающего.
  rationale: Контекст может подразумевать Бога, но греческий текст прямо его не называет; перевод сохраняет эту сдержанность и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с кратким, ритмичным трёхчастным параллелизмом. Тире естественно отделяет повеление от обещания; формы множественного числа соответствуют греческому тексту.
