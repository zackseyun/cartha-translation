id: MAT.7.14
reference: Matthew 7:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀ὅτι στενὴ ἡ πύλη καὶ τεθλιμμένη ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν, καὶ ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/014.yaml
  text: For the gate is narrow and the way that leads to life is hard, and few are those who find it.
translation:
  language: ru
  text: Потому что тесны ворота и труден путь, ведущий к жизни, и немногие находят его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στενή
  choice: тесны
  rationale: Передаёт пространственный образ узких, стеснённых ворот естественным современным русским словом.
- source_word: τεθλιμμένη
  choice: труден
  rationale: Причастие от θλίβω буквально связано со сдавливанием и стеснением, а применительно к пути выражает его тягостный, трудный характер; «труден» сохраняет смысл без неестественного русского оборота.
- source_word: ἡ ἀπάγουσα εἰς τὴν ζωήν
  choice: ведущий к жизни
  rationale: Естественно и точно передаёт направление пути и сохраняет богословски значимое слово «жизнь» без уточнения его смысла.
- source_word: ὀλίγοι ... οἱ εὑρίσκοντες αὐτήν
  choice: немногие находят его
  rationale: Сохраняет количественный акцент и образ нахождения пути; местоимение согласовано с русским словом «путь».
theological_decisions:
- issue: Характер пути к жизни
  choice: труден путь
  alternative: стеснён путь
  rationale: «Труден» передаёт переносный смысл τεθλιμμένη в контексте следования по пути, не сводя высказывание исключительно к физической узости и не добавляя конкретной причины трудности.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и понятная формулировка. Сохранён параллелизм образов ворот и пути.
