lexical_decisions:
- source_word: πᾶν δένδρον
  choice: всякое дерево
  rationale: πᾶν при существительном в единственном числе имеет распределительное значение. «Всякое дерево» естественно передаёт обобщённый, афористичный характер высказывания.
- source_word: μὴ ποιοῦν
  choice: не приносящее
  rationale: Причастие настоящего времени описывает характерное, продолжающееся действие. Хотя ποιέω буквально означает «делать, производить», по-русски о дереве естественно говорить, что оно «приносит плод».
- source_word: καρπὸν καλὸν
  choice: доброго плода
  rationale: καλός здесь обозначает плод хороший, качественный и в контексте нравственно положительный. «Добрый плод» сохраняет оценочный оттенок и звучит естественно в библейском афористическом высказывании.
- source_word: ἐκκόπτεται
  choice: срубают
  rationale: Греческая форма — страдательный залог настоящего времени. Русская неопределённо-личная конструкция естественно передаёт обобщённое действие над целым деревом.
- source_word: εἰς πῦρ βάλλεται
  choice: бросают в огонь
  rationale: Передаётся движение внутрь огня и страдательное значение греческого глагола посредством естественной русской неопределённо-личной конструкции. Определённость образа не уточняется сверх контекста.
theological_decisions:
- issue: Образ огня как суда
  choice: Сохранить образ срубленного дерева, брошенного в огонь, не уточняя точный референт огня.
  alternative: Прямо истолковать огонь как временный суд, окончательный эсхатологический суд или ад.
  rationale: Стих несомненно выражает предупреждение о суде посредством земледельческого образа, однако сам по себе не определяет точнее время и характер этого суда. Перевод сохраняет эту богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, афористичным звучанием. «Всякое дерево» и «добрый плод» сохраняют достоинство и образность текста, оставаясь понятными современному читателю; неопределённо-личные глаголы «срубают» и «бросают» звучат естественнее буквальных страдательных форм.
