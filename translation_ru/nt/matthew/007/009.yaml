  text: ἢ τίς ⸀ἐστιν ἐξ ὑμῶν ἄνθρωπος, ὃν ⸀αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον— μὴ λίθον ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/009.yaml
  text: Or what man is there among you whose son asks him for bread[a], and he will give him a stone?
translation:
  language: ru
  text: Или кто из вас, когда сын попросит у него хлеба, подаст ему камень?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: Или
  rationale: Связывает этот риторический пример с предыдущей мыслью и естественно передаёт ход рассуждения.
- source_word: τίς ἐστιν ἐξ ὑμῶν ἄνθρωπος
  choice: кто из вас
  rationale: Естественная русская передача конструкции «кто из вас человек»; значение ἄνθρωπος сохраняется в указании на любого человека из числа слушателей без тяжеловесного буквализма.
- source_word: ὃν αἰτήσει ὁ υἱὸς αὐτοῦ
  choice: когда сын попросит у него
  rationale: Греческое относительное построение буквально указывает на человека, которого попросит его сын. В русском условно-временная конструкция ясно и естественно передаёт типичную ситуацию; будущее значение αἰτήσει сохранено совершенным видом «попросит».
- source_word: ἄρτον
  choice: хлеба
  rationale: Прямое и контекстуально точное соответствие; родительный падеж естественен после «попросит» при просьбе дать некоторое количество пищи.
- source_word: μὴ λίθον ἐπιδώσει αὐτῷ
  choice: подаст ему камень?
  rationale: Вопросительная форма в русском контексте естественно передаёт риторический вопрос, предполагающий отрицательный ответ. «Подаст» удачно выражает передачу конкретного предмета и сохраняет будущее значение.
theological_decisions:
- issue: Мужской репрезентативный образ
  choice: кто из вас … сын
  alternative: есть ли среди вас человек … его сын
  rationale: Слово «кто» в русском языке естественно охватывает любого из слушателей, а конкретный образ сына сохранён в соответствии с υἱός. Формулировка не вносит дополнительного гендерного обобщения и не утяжеляет речь.
- issue: Отрицательное ожидание риторического вопроса
  choice: подаст ему камень?
  alternative: неужели подаст ему камень?
  rationale: Частица μή указывает, что ожидается ответ «нет». В данном параллельном бытовом примере это ожидание достаточно ясно выражено самим риторическим вопросом; добавление «неужели» возможно, но усилило бы эмоциональную окраску.
translation_notes:
  register: Современный литературный русский язык; краткая, устная по характеру и dignified риторическая формулировка. Синтаксис упрощён без утраты участников действия, предметного контраста и ожидаемого отрицательного ответа.
