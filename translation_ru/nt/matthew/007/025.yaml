  source_fidelity: «Разлились реки» уточняет греческое ἦλθον («пришли») как выход рек из берегов; это вероятный образ в контексте бури, но всё же дополнительная конкретизация. «Обрушились на дом» может передавать προσέπεσαν, однако по-русски способно вызвать образ обрушения самих ветров, а не их удара о дом. «Налетели на тот дом» точнее передаёт направленное воздействие ветров и остаётся естественным. Остальные элементы, включая «полил дождь», «не упал» и «был основан на скале», в целом верны оригиналу.
