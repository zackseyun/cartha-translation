    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: полил дождь
  rationale: Передаёт нисхождение дождя естественным современным русским выражением, не ослабляя образ бури.
- source_word: ἦλθον οἱ ποταμοί
  choice: разлились реки
  rationale: Сохраняет основное значение ποταμοί («реки») и при этом ясно передаёт угрозу поднявшейся воды; буквальное «пришли реки» по-русски неестественно.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: подули ветры
  rationale: Прямой и естественный эквивалент греческого выражения.
- source_word: προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ
  choice: обрушились на тот дом
  rationale: В контексте бури передаёт сильное воздействие ветров на дом, сохраняя направленность греческого προσπίπτω — «налететь, обрушиться на».
- source_word: οὐκ ἔπεσεν
  choice: он не упал
  rationale: Сохраняет простой глагольный образ оригинала и не усиливает его более толковательным «не разрушился».
- source_word: τεθεμελίωτο
  choice: был основан
  rationale: 'Передаёт страдательное значение и предшествующее, уже достигнутое состояние: дом устоял, поскольку его основание было заложено ранее.'
- source_word: ἐπὶ τὴν πέτραν
  choice: на скале
  rationale: «Скала» непосредственно передаёт πέτρα и сохраняет образ прочного каменного основания без уточняющего толкования вроде «на скальном грунте».
theological_decisions:
- issue: Образ основания в притче
  choice: на скале
  alternative: на скальном основании
  rationale: Сохраняется обычный образ притчи без внесения в сам стих богословского отождествления скалы, которого здесь прямо нет.
translation_notes:
  register: Современный литературный русский язык; строй фразы сохраняет нарастающую последовательность бури, а союз «но» естественно подчёркивает контраст между ударом стихии и устойчивостью дома.
