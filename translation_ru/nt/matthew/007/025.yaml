  terminology: «Скала» точно передаёт πέτρα и не навязывает богословского истолкования образа. «Дом» корректно передаёт οἰκία как физическое строение. Сноска при «нахлынули реки» прозрачно отмечает, что ποταμοί буквально означает «реки», а не обязательно разлив или поток.
