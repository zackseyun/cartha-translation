  text: ⸀Προσέχετε ἀπὸ τῶν ψευδοπροφητῶν, οἵτινες ἔρχονται πρὸς ὑμᾶς ἐν ἐνδύμασι προβάτων ἔσωθεν δέ εἰσιν λύκοι ἅρπαγες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/015.yaml
  text: Beware of false prophets[a], who come to you in sheep’s clothing[c][b], but inwardly are ravenous wolves.
translation:
  language: ru
  text: 'Остерегайтесь лжепророков[a]: они приходят к вам в овечьей одежде[b], но внутри они — хищные волки.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Будьте настороже перед лжепророками».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в одеждах овец».'
    reason: literal_rendering
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: Остерегайтесь
  rationale: Сочетание настоящего повелительного προσέχετε с ἀπό призывает постоянно быть настороже перед названной опасностью. «Остерегайтесь» естественно передаёт и длительную бдительность, и предостерегающую силу выражения.
- source_word: ψευδοπροφητῶν
  choice: лжепророков
  rationale: Устоявшееся и точное обозначение тех, кто ложно выступает с пророческими притязаниями или выдаёт ложь за пророчество.
- source_word: οἵτινες ἔρχονται πρὸς ὑμᾶς
  choice: они приходят к вам
  rationale: οἵτινες вводит характеристику названных людей. В русском самостоятельное предложение после двоеточия звучит естественно и ясно раскрывает, как именно они представляют опасность.
- source_word: ἐν ἐνδύμασι προβάτων
  choice: в овечьей одежде
  rationale: Естественный русский образ, сохраняющий противопоставление безобидной внешности и опасной внутренней сущности. Греческое множественное число ἐνδύμασι не требует искусственного множественного числа в русском.
- source_word: ἔσωθεν δέ εἰσιν
  choice: но внутри они —
  rationale: «Но» ясно передаёт контраст δέ, а «внутри» сохраняет пространственно-образный смысл ἔσωθεν и противопоставляет его внешнему облику.
- source_word: λύκοι ἅρπαγες
  choice: хищные волки
  rationale: ἅρπαγες характеризует их как алчных, захватывающих добычу и губительных хищников. «Хищные волки» кратко и ярко сохраняет силу метафоры, не сводя её только к физическому голоду.
theological_decisions:
- issue: Характер предостережения о лжепророках
  choice: Передать образ как общее нравственно-духовное предостережение о людях, скрывающих опасную сущность под безобидной внешностью.
  alternative: Ограничить смысл позднейшей категорией еретических учителей или служителей определённого церковного устройства.
  rationale: Греческий текст говорит о лжепророках и раскрывает их обманчивость через контраст внешнего вида и внутренней сущности, но не вводит более поздних конфессиональных или институциональных категорий.
translation_notes:
  register: Современный литературный русский язык с краткой, выразительной синтаксической структурой. Двоеточие естественно вводит описание лжепророков; тире подчёркивает резкий контраст между внешностью и сущностью. Сохранён знакомый библейский образ без архаизмов и конфессиональных уточнений.
