  text: for he was teaching them as one having authority[a], and not as their scribes.
translation:
  language: ru
  text: ибо Он учил их как тот, кто имеет власть[a], а не как их книжники.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с властью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν γὰρ διδάσκων
  choice: потому что Он учил
  rationale: Описательная конструкция с имперфектом передаёт продолженное действие в прошлом; «потому что» естественно выражает пояснительное γάρ и связывает стих с изумлением слушателей в предыдущем стихе.
- source_word: αὐτούς
  choice: их
  rationale: Прямое дополнение относится к слушавшему Иисуса народу.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: как имеющий власть
  rationale: Формулировка близко передаёт греческую конструкцию и сохраняет акцент на том, что Иисус учил как человек, обладающий реальной властью; более идиоматичное «с властью» вынесено в примечание.
- source_word: καὶ οὐχ ὡς
  choice: а не как
  rationale: Русское противительное «а» естественно и ясно передаёт резкий контраст, выраженный греческим καὶ οὐχ.
- source_word: οἱ γραμματεῖς αὐτῶν
  choice: их книжники
  rationale: «Книжники» — устоявшееся и точное обозначение знатоков и толкователей Закона в евангельском контексте; местоимение «их» сохраняет αὐτῶν.
theological_decisions:
- issue: Характер власти Иисуса в учении
  choice: 'Описательно передать сравнение: «как имеющий власть».'
  alternative: Явно назвать эту власть божественной либо свести её к уверенной манере речи.
  rationale: Стих утверждает реальность власти Иисуса и противопоставляет Его книжникам, но сам по себе не разъясняет её богословское основание. Перевод сохраняет это напряжение без добавочного толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельского повествования. Местоимение «Он» написано с прописной буквы в соответствии с распространённой русской библейской традицией; синтаксис остаётся прозрачным для широкого круга читателей.
