  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ· Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/022.yaml
  text: Many will say to me on that day[a], ‘Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many mighty works in your name?’
translation:
  language: ru
  text: 'Многие скажут Мне в тот день: «Господи, Господи, разве не Твоим именем мы пророчествовали, не Твоим именем изгоняли бесов и не Твоим именем совершали множество чудес[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершали множество могущественных дел»; буквальнее: «совершали многие силы». В Евангелиях это выражение часто означает чудесные деяния.'
    reason: Лексическая широта слова δυνάμεις и его связь с понятием силы.
lexical_decisions:
- source_word: πολλοὶ
  choice: Многие
  rationale: Субстантивированное прилагательное передано без добавления слова «люди», которого нет в греческом тексте.
- source_word: ἐροῦσίν μοι
  choice: скажут Мне
  rationale: Прямо передаёт будущее время λέγω и дательный объект; форма естественна для современного русского языка.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: в тот день
  rationale: Сохраняет библейскую эсхатологическую формулу, не раскрывая её толкованием «в день суда».
- source_word: Κύριε κύριε
  choice: Господи, Господи!
  rationale: Повтор обращения передаёт настойчивость и сохраняет обычный и христологически значимый смысл κύριος.
- source_word: οὐ ... ἐπροφητεύσαμεν
  choice: Разве не ... мы пророчествовали
  rationale: Частица οὐ вводит вопрос, предполагающий утвердительный ответ; «разве не» естественно выражает это по-русски.
- source_word: τῷ σῷ ὀνόματι
  choice: Твоим именем
  rationale: Передаёт действие посредством имени и под его властью. Троекратное повторение сохранено ради риторического воздействия.
- source_word: δαιμόνια ἐξεβάλομεν
  choice: изгоняли бесов
  rationale: Устойчиво и понятно передаёт изгнание злых духов; «бесов» соответствует достоинству библейского регистра.
- source_word: δυνάμεις πολλὰς ἐποιήσαμεν
  choice: совершали множество чудес
  rationale: В евангельском контексте δύναμις часто обозначает чудесное проявление силы. Такой перевод естественнее буквального «дел силы», а лексическая широта отмечена в сноске.
theological_decisions:
- issue: Передача κύριος в обращении к Иисусу
  choice: Господи
  alternative: Учитель; Владыка
  rationale: «Господь» сохраняет как обычное значение титула, так и его христологическую весомость, не усиливая её пояснением.
- issue: Эсхатологический смысл выражения «в тот день»
  choice: в тот день
  alternative: в день суда
  rationale: Контекст указывает на окончательный суд, однако сам стих говорит лишь «в тот день»; перевод сохраняет намеренную неявность.
- issue: Значение δυνάμεις как чудесных деяний
  choice: чудес
  alternative: могущественных дел; дел силы
  rationale: «Чудес» естественно передаёт обычное евангельское употребление, а сноска сохраняет связь исходного слова с понятием силы.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены троекратный повтор «Твоим именем», единая нарастающая вопросительная конструкция и традиционное обращение «Господи». Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно русской религиозной издательской традиции.
