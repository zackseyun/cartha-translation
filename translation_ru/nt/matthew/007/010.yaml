  text: ⸀ἢ καὶ ⸂ἰχθὺν αἰτήσει⸃— μὴ ὄφιν ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/010.yaml
  text: Or if he asks for a fish—he will not give him a snake[b][a], will he?
translation:
  language: ru
  text: Или если он попросит рыбу — неужели тот даст ему змею?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: Или если
  rationale: Вводит второй пример в паре риторических вопросов; по-русски «Или если» естественно передаёт продолжение и не требует отдельно выражать καί.
- source_word: ἰχθὺν
  choice: рыбу
  rationale: Обычное значение существительного в винительном падеже; соответствует контексту еды.
- source_word: αἰτήσει
  choice: попросит
  rationale: Будущее время естественно сохраняется в русском условном примере; глагол с прямым дополнением ясно передаёт просьбу дать что-либо.
- source_word: μὴ
  choice: неужели
  rationale: Частица вводит вопрос, предполагающий отрицательный ответ; «неужели» естественно передаёт эту риторическую направленность.
- source_word: ὄφιν
  choice: змею
  rationale: Современное общеупотребительное соответствие; «змей» здесь звучал бы архаичнее и мог бы привнести лишние ассоциации.
- source_word: ἐπιδώσει
  choice: даст
  rationale: В данном контексте глагол означает дать или вручить; простое «даст» наиболее ясно и естественно.
- source_word: αὐτῷ
  choice: ему
  rationale: Дательный падеж обозначает косвенный объект и прямо передаётся русским «ему».
theological_decisions:
- issue: Риторическая сила вопроса
  choice: 'Передать вопрос как предполагающий отрицательный ответ: «неужели тот даст ему змею?»'
  alternative: 'Передать как простое отрицательное утверждение: «тот не даст ему змею»'
  rationale: μή в прямом вопросе указывает на ожидаемый отрицательный ответ. Вопросительная форма сохраняет ход аргумента Иисуса и не сглаживает его риторическую силу.
- issue: Ясность местоименных отсылок
  choice: Передать подразумеваемого отца словом «тот», а ребёнка — «ему»
  alternative: «неужели даст ему змею?»
  rationale: «Тот» естественно различает двух участников, не добавляя к греческому тексту богословского толкования; референт определяется предыдущим стихом.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Тире сохраняет резкий риторический переход, отмеченный в исходном тексте. Лексика намеренно общеупотребительная, без архаизации.
