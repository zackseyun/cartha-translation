  text: Πᾶς οὖν ὅστις ἀκούει μου τοὺς λόγους τούτους καὶ ποιεῖ αὐτούς, ⸀ὁμοιωθήσεται ἀνδρὶ φρονίμῳ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/024.yaml
  text: Therefore everyone who hears these words of mine and does them will be like a wise man who built his house on the rock[a][b].
translation:
  language: ru
  text: Итак, всякий, кто слышит эти Мои слова и исполняет их, будет подобен благоразумному мужчине, который построил свой дом на скале.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет уподоблен».'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте — «благоразумному мужчине»; слово ἀνήρ обозначает мужчину.
    reason: cultural_note
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Итак, всякий, кто
  rationale: Передаёт обобщающе-распределительное значение Πᾶς…ὅστις и выводный характер οὖν; «итак» естественно связывает стих с предшествующим учением.
- source_word: ἀκούει μου τοὺς λόγους τούτους
  choice: слышит эти Мои слова
  rationale: Прямо передаёт ἀκούει и λόγους, а местоименную принадлежность μου — естественной для русского языка конструкцией «Мои слова».
- source_word: καὶ ποιεῖ αὐτούς
  choice: и исполняет их
  rationale: В данном контексте ποιεῖ означает не просто совершение действия, а выполнение услышанных слов; «исполняет» естественно и точно сохраняет противопоставление слышания и действия.
- source_word: ὁμοιωθήσεται
  choice: уподобится
  rationale: Сохраняет будущую пассивно-сравнительную форму греческого глагола и не устраняет возможный оттенок «будет уподоблен».
- source_word: ἀνδρὶ φρονίμῳ
  choice: благоразумному человеку
  rationale: «Благоразумный» точно передаёт практическую рассудительность φρόνιμος. В русском «человек» естественно обозначает участника сравнения; грамматически мужской образ отмечен в сноске.
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: который построил свой дом
  rationale: «Построил» прямо передаёт глагол, а возвратное притяжательное «свой» является нормативным русским соответствием αὐτοῦ при совпадении владельца с подлежащим.
- source_word: ἐπὶ τὴν πέτραν
  choice: на скале
  rationale: Сохраняет конкретный образ πέτρα как прочной скальной основы, не добавляя отсутствующего в тексте слова «фундамент».
theological_decisions:
- issue: Грамматически мужской образ в сравнении
  choice: благоразумному человеку
  alternative: благоразумному мужчине
  rationale: Греческое ἀνήρ обозначает мужчину, однако в русской притчевой формулировке «человек» естественнее и не меняет всеобщего охвата начала стиха. Мужской характер исходного образа сохранён через грамматические формы и прямо указан в сноске.
- issue: Значение будущего пассива ὁμοιωθήσεται
  choice: уподобится
  alternative: будет уподоблен / будет подобен
  rationale: «Уподобится» сохраняет формальную связь с пассивно-сравнительной конструкцией и допускает как риторическое сравнение, так и оттенок оценки, не вынуждая выбрать только одно толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Мои» пишется с прописной буквы по устойчивой русской издательской традиции при указании на слова Иисуса. Синтаксис остаётся ясным для широкого читателя и близким к структуре греческого текста.
