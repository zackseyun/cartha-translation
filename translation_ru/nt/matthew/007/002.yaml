  source_fidelity: 'Смысл и параллельная структура греческого текста в целом переданы верно: сохраняются повтор «судить/судимы», образ «меры» и не названный деятель пассивных форм. Однако во второй части исходная формулировка «такой будет отмерено вам» грамматически несогласована: «такой» требует явно выраженного существительного «мерой».'
  naturalness: «Каким судом вы судите, таким судом будете судимы» и «какой мерой вы мерите, такой мерой будет отмерено вам» — литературные, ясные и афористичные формулировки. Они сохраняют допустимый библейский регистр без ненужной архаизации.
