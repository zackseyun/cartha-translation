  text: ἐν ᾧ γὰρ κρίματι κρίνετε κριθήσεσθε, καὶ ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/002.yaml
  text: For with the judgment by which you judge[a], you will be judged, and with the measure by which you measure, it will be measured to you.
translation:
  language: ru
  text: Ибо каким судом вы судите, таким судом будете судимы; и какой мерой вы мерите, такой мерой будет отмерено вам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «такой мерой отмерят вам в ответ». В греческом тексте слова «в ответ» прямо не выражены, хотя взаимный смысл подразумевается.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματι / κρίνετε / κριθήσεσθε
  choice: судом / судите / будете судимы
  rationale: Сохраняется однокоренной повтор греческого текста и широкий смысл κρίνομαι/κρίνω без сужения до осуждения.
- source_word: μέτρῳ / μετρεῖτε / μετρηθήσεται
  choice: мерой / мерите / будет отмерено
  rationale: Русская формулировка сохраняет образ меры, словесный повтор и афористический параллелизм оригинала.
- source_word: ἐν ᾧ ... ἐν ᾧ
  choice: каким ... таким; какой ... такой
  rationale: Соотносительная конструкция естественно передаёт значение средства или применяемого мерила и подчёркивает взаимность.
- source_word: γὰρ
  choice: ибо
  rationale: Союз передаёт объяснительную связь с предыдущим запретом и соответствует достоинству библейского регистра.
- source_word: μετρηθήσεται ὑμῖν
  choice: будет отмерено вам
  rationale: Безлично-пассивная конструкция сохраняет неуказанного деятеля и не добавляет отсутствующего в греческом наречия «обратно».
theological_decisions:
- issue: Кто совершает ответный суд
  choice: 'Деятель не назван: «будете судимы» и «будет отмерено вам»'
  alternative: «Бог будет судить вас» или «люди будут судить вас»
  rationale: Греческие пассивные формы не называют деятеля; перевод сохраняет открытость между подразумеваемым Божьим судом и более общим принципом соответствующего воздаяния.
translation_notes:
  register: Современный литературный русский с умеренно высоким, афористичным библейским регистром. Параллелизм двух частей и однокоренные повторы сохранены; архаичные обороты по возможности исключены.
