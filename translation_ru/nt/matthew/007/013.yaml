  source_fidelity: 'Основной перевод верно передаёт повеление, противопоставление узких и широких ворот/просторной дороги и исход «к гибели». Однако сноска c неверно утверждает, что греческое местоимение грамматически может относиться и к воротам, и к дороге: αὐτῆς — единственное число женского рода и может соотноситься с πύλη (ед. ч.), но не с ὁδός в форме ἡ ὁδός ἡ ἀπάγουσα без дополнительного основания; синтаксически и семантически наиболее вероятная отсылка — к πύλη. Русское «них» ясно отсылает к «воротам» и является удачным разрешением этой отсылки.'
