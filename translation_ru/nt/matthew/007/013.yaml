base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/013.yaml
  text: Enter through the narrow gate[a]. For wide is the gate and broad is the road that leads to destruction[c][b], and many are those who enter through it.
translation:
  language: ru
  text: Входите через тесные ворота. Ибо широки ворота и просторна дорога[a], ведущая к гибели[b], и многие входят через них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «широка дорога». Греческое εὐρύχωρος может означать «широкая» или «просторная».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к погибели» или «к разрушению». Греческое ἀπώλεια может означать гибель, погибель или разрушение и само по себе не уточняет природу этого исхода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσέλθατε
  choice: Входите
  rationale: Аористный повелительный глагол во 2-м лице множественного числа передан прямым и естественным призывом.
- source_word: διὰ τῆς στενῆς πύλης
  choice: через тесные ворота
  rationale: διά с родительным падежом обозначает движение через что-либо; русское «ворота» естественно употребляется во множественном числе, а «тесные» сохраняет пространственный образ и контраст с широкими воротами.
- source_word: ὅτι
  choice: Ведь
  rationale: Союз вводит поясняющее основание призыва; «ведь» естественно связывает предупреждение с повелением.
- source_word: πλατεῖα ἡ πύλη
  choice: широки ворота
  rationale: Сохранены вынесенное вперёд сказуемое и смысловой акцент греческой конструкции.
- source_word: εὐρύχωρος ἡ ὁδός
  choice: просторна дорога
  rationale: εὐρύχωρος означает «просторный, широкий»; «просторна» отличает это определение от πλατεῖα и передаёт образ дороги, не стесняющей движения.
- source_word: ἡ ἀπάγουσα
  choice: ведущая
  rationale: Причастие настоящего времени естественно передаётся русским причастием и сохраняет направленность дороги к её исходу.
- source_word: εἰς τὴν ἀπώλειαν
  choice: к гибели
  rationale: «Гибель» передаёт тяжесть ἀπώλεια, не уточняя сверх текста характер окончательного бедствия.
- source_word: πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς
  choice: и многие входят через них
  rationale: Сохранены акцент на множестве входящих и образ прохождения через ворота. Русское местоимение согласовано с естественным русским словом «ворота»; возможная грамматическая отсылка греческого местоимения к дороге отмечена в сноске.
theological_decisions:
- issue: Смысл ἀπώλεια в предупреждении Иисуса
  choice: гибель
  alternative: погибель; уничтожение; разрушение
  rationale: «Гибель» выражает катастрофический итог, но не навязывает тексту детального учения о природе этого исхода.
- issue: Отсылка αὐτῆς в заключительной фразе
  choice: к воротам
  alternative: к дороге
  rationale: Оборот «входить через» по смыслу прежде всего соотносится с воротами, однако обе возможные греческие антецедентные формы женского рода; неоднозначность не скрыта, а вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с краткими формами «широки» и «просторна», которые сохраняют риторический параллелизм и достоинство речи. Формулировка остаётся понятной обычному читателю; сноски фиксируют лексические варианты и подлинную неоднозначность местоимения.
