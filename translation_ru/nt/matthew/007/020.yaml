id: MAT.7.20
reference: Matthew 7:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἄρα γε ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/020.yaml
  text: So then[a], you will recognize them by their fruits.
translation:
  language: ru
  text: Итак[a], по их плодам вы узнаете их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Следовательно, именно по их плодам вы познаете их».'
    reason: Лексическая альтернатива для ἄρα γε и ἐπιγνώσεσθε, более буквально передающая усиление и возможный оттенок глагола познания.
lexical_decisions:
- source_word: ἄρα γε
  choice: Итак
  rationale: Сочетание вводит вывод из сказанного ранее, придавая ему лёгкое усиление. «Итак» естественно и ясно передаёт эту итоговую связь в современном русском языке.
- source_word: ἀπὸ
  choice: по
  rationale: В сочетании с глаголом узнавания предлог указывает на основание распознавания. Русское «по их плодам» идиоматично передаёт смысл «судя по плодам» и сохраняет образ исходного текста.
- source_word: καρπῶν
  choice: плодам
  rationale: Сохранено множественное число и метафорический образ, связывающий стих с ближайшим контекстом.
- source_word: αὐτῶν
  choice: их
  rationale: Притяжательное местоимение относится к «плодам» и естественно передаётся русским «их».
- source_word: ἐπιγνώσεσθε
  choice: вы узнаете
  rationale: Будущее время, второе лицо множественного числа. Здесь глагол означает распознавание людей на основании наблюдаемых признаков; «узнаете» передаёт это без лишнего истолкования.
- source_word: αὐτούς
  choice: их
  rationale: Местоимение относится к людям, о которых идёт речь в контексте; русское «их» точно и естественно.
theological_decisions:
- issue: Метафорическое употребление слова «плоды» при оценке людей
  choice: Сохранить метафору «плоды» без поясняющей замены.
  alternative: Их дела; результаты их поступков.
  rationale: Исходный текст говорит о плодах, продолжая образ ближайшего контекста. Его сохранение не сужает смысл до одного вида наблюдаемых проявлений и не вносит в текст дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и торжественно-нейтральная. Порядок слов сохраняет акцент на основании распознавания — «по их плодам».
