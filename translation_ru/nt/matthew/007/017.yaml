id: MAT.7.17
reference: Matthew 7:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὕτως πᾶν δένδρον ἀγαθὸν καρποὺς καλοὺς ποιεῖ, τὸ δὲ σαπρὸν δένδρον καρποὺς πονηροὺς ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/017.yaml
  text: So[a], every good tree produces good fruit[c][b], but the rotten tree produces bad fruit.
translation:
  language: ru
  text: Так[a] всякое хорошее дерево приносит хорошие плоды, а гнилое[b] дерево приносит плохие[c] плоды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Итак»; «Таким образом».'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово может также означать «испорченное», «разложившееся» или «негодное».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «злые» либо «негодные». Слово допускает нравственный оттенок, хотя в образе плодов естественно звучит «плохие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Так
  rationale: Передаёт вывод или сопоставление с предшествующим образом кратко и естественно; возможны также «итак» и «таким образом».
- source_word: πᾶν δένδρον
  choice: всякое ... дерево
  rationale: Сочетание πᾶν с существительным в единственном числе имеет распределительное значение и сохраняет обобщённый, пословичный характер высказывания.
- source_word: ἀγαθὸν
  choice: хорошее
  rationale: Передаёт общую положительную оценку дерева без добавления идеи физического здоровья или специального нравственного толкования.
- source_word: καρποὺς καλοὺς
  choice: хорошие плоды
  rationale: В данном образе καλός обозначает хорошие, качественные плоды; это естественнее по-русски, чем буквальное «красивые плоды».
- source_word: ποιεῖ
  choice: приносит
  rationale: Хотя ποιέω буквально означает «делает/производит», применительно к дереву и плодам нормативное русское выражение — «приносит плоды».
- source_word: τὸ δὲ
  choice: а
  rationale: Частица δέ противопоставляет два вида деревьев; русское «а» естественно выражает этот контраст без излишнего усиления.
- source_word: σαπρὸν
  choice: гнилое
  rationale: σαπρός означает гнилое, испорченное или негодное; «гнилое» конкретно и выразительно сохраняет образ дерева.
- source_word: καρποὺς πονηροὺς
  choice: плохие плоды
  rationale: πονηρός допускает значения «плохой», «злой», «негодный». В сельскохозяйственном образе «плохие плоды» звучит естественно, а нравственный оттенок раскрывается контекстом.
theological_decisions:
- issue: Нравственный или исключительно сельскохозяйственный смысл образа
  choice: Сохранить конкретный образ дерева и плодов, не поясняя его нравственное применение внутри самого стиха.
  alternative: 'Перевести истолковывающе: «нравственно испорченное дерево приносит злые плоды».'
  rationale: В контексте стих относится к распознаванию лжепророков, однако греческий текст формулирует образ, а не разъясняет его. Конкретная метафора сохраняет и нравственный подтекст, и образную форму.
translation_notes:
  register: Современный литературный русский язык с кратким, запоминающимся строением изречения. Повтор «хорошее — хорошие» сохранён ради простоты и ясного параллелизма; «приносит плоды» соответствует естественной русской сочетаемости.
