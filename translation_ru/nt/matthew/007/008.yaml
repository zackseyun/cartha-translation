  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει καὶ ὁ ζητῶν εὑρίσκει καὶ τῷ κρούοντι ⸀ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/008.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: ru
  text: Ведь всякий просящий получает, и ищущий находит, и стучащему отворят.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и стучащему будет открыто». В греческом тексте дверь прямо не названа — она подразумевается образом стука.'
    reason: лексическая альтернатива и пояснение невыраженного подлежащего
lexical_decisions:
- source_word: πᾶς
  choice: всякий
  rationale: Субстантивированная конструкция обозначает любого человека из названной группы; «всякий» естественно передаёт всеобщий охват и поддерживает ритм изречения.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующим призывом и естественно звучит в современном русском языке.
- source_word: ὁ αἰτῶν
  choice: просящий
  rationale: Причастие настоящего времени с артиклем выражает человека, который просит; русское причастие сохраняет обобщённый и продолжающийся характер действия.
- source_word: λαμβάνει
  choice: получает
  rationale: Прямое и стилистически нейтральное соответствие, сохраняющее краткость и параллелизм.
- source_word: ὁ ζητῶν
  choice: ищущий
  rationale: Сохраняет субстантивированную причастную конструкцию и ритмическую параллель с «просящий» и «стучащему».
- source_word: εὑρίσκει
  choice: находит
  rationale: Обычное контекстуальное значение глагола, соответствующее простоте и афористичности греческого текста.
- source_word: τῷ κρούοντι
  choice: стучащему
  rationale: Дательный падеж греческого причастия естественно передаётся русским дательным и сочетается с неопределённо-личным «отворят».
- source_word: ἀνοιγήσεται
  choice: отворят
  rationale: Греческая форма — будущее страдательного залога с невыраженным подлежащим. Русская неопределённо-личная конструкция естественно сохраняет отсутствие прямо названного объекта («двери») и подразумеваемого открывающего лица.
theological_decisions:
- issue: Охват и сила обещания
  choice: Общее заверение, выраженное всеобщими словами, без встроенного ограничения или уточнения того, как именно исполняется просьба.
  alternative: Понимать как безусловную гарантию получения любой конкретной просьбы в точности либо заранее ограничить обещание только определёнными духовными просьбами.
  rationale: Греческий текст говорит широко — «всякий просящий» — и не вводит ограничений в самом стихе. Перевод сохраняет эту широту и связанную с ней богословскую напряжённость, не разрешая её средствами перевода.
- issue: Неуказанный субъект при ἀνοιγήσεται
  choice: Сохранить отсутствие явно названной двери посредством «отворят».
  alternative: Добавить «дверь отворится» или «ему отворится».
  rationale: В греческом тексте дверь подразумевается образом стука, но прямо не названа. Добавление существительного сделало бы подразумеваемое явным; выбранная конструкция сохраняет лаконичность и неопределённость оригинала.
translation_notes:
  register: Современный литературный русский язык с кратким, запоминающимся параллелизмом. «Отворят» выбрано вместо более разговорного «откроют», поскольку оно естественно сочетается с образом двери и сохраняет достоинство библейского изречения без архаизации.
