source:
  edition: SBLGNT
  text: Πάντα οὖν ὅσα ⸀ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι, οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς· οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/012.yaml
  text: Therefore[a], in everything, whatever you want people to do for you, do the same for them; for this is the Law and the Prophets.
translation:
  language: ru
  text: Итак, во всём поступайте с людьми так, как хотите, чтобы они поступали с вами, ибо это — Закон и Пророки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα οὖν ὅσα
  choice: 'Итак, во всём: как'
  rationale: 'Πάντα в сочетании с ὅσα придаёт высказыванию всеобъемлющий смысл, а οὖν связывает его как вывод с предшествующим учением. Конструкция «Итак, во всём: как…» сохраняет и логическую связь, и универсальный охват.'
- source_word: ἐὰν θέλητε
  choice: хотите
  rationale: Частица ἐὰν в обобщающей относительной конструкции передаёт неопределённость и применимость к любому случаю; настоящее «хотите» естественно выражает это по-русски.
- source_word: ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι
  choice: чтобы люди поступали с вами
  rationale: После θέλητε союз ἵνα с сослагательным наклонением обозначает желаемое действие. «Поступали с вами» здесь естественнее буквального «делали вам» и точно передаёт межличностный смысл ποιεῖν с дательным.
- source_word: οἱ ἄνθρωποι
  choice: люди
  rationale: Существительное употреблено обобщённо и обозначает людей независимо от пола; «люди» сохраняет этот смысл без ненужного сужения.
- source_word: οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς
  choice: так и вы поступайте с ними
  rationale: Симметричная конструкция «как… так и…» передаёт οὕτως καί, а форма «поступайте» сохраняет повелительный и продолжающийся характер настоящего императива ποιεῖτε.
- source_word: οὗτος γάρ ἐστιν
  choice: ведь в этом —
  rationale: «Ведь» передаёт пояснительную функцию γάρ. Русская конструкция «в этом —» естественно выражает краткое отождествление, не превращая его в разъясняющий парафраз.
- source_word: ὁ νόμος καὶ οἱ προφῆται
  choice: Закон и Пророки
  rationale: Сохранена устойчивая формула, обозначающая две основные части священных Писаний; прописные буквы показывают, что речь идёт не об абстрактном законе и отдельных пророках.
theological_decisions:
- issue: Обобщённое значение ἄνθρωποι
  choice: люди
  alternative: мужчины; другие
  rationale: Контекст формулирует всеобщий принцип отношений между людьми, а не предписание, относящееся только к мужчинам.
- issue: Смысл формулы «Закон и Пророки»
  choice: Сохранить формулу без поясняющего парафраза
  alternative: всё нравственное учение Писания; сущность учения Закона и пророков
  rationale: Греческий текст использует традиционную и богословски значимую формулу. Её буквальное сохранение не сужает значение до одной лишь этики и оставляет читателю исходную смысловую напряжённость.
- issue: Связь правила с Законом и Пророками
  choice: ведь в этом — Закон и Пророки
  alternative: ведь таковы Закон и Пророки; в этом сущность Закона и Пророков
  rationale: Краткая эквивалентная конструкция οὗτος γάρ ἐστιν не уточняет, идёт ли речь о сущности, сумме или исполнении. Перевод не вводит отсутствующего в тексте толкования.
translation_notes:
  register: Современный литературный русский язык с ясной симметрией «как… так и…». Двоеточие подчёркивает, что далее раскрывается смысл выражения «во всём», а точка с запятой сохраняет плотную связь предписания с его обоснованием. Тон краткий, достоинственный и общеупотребительный.
