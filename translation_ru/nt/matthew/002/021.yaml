  text: So he rose, took the child and his mother, and entered the land of Israel.
translation:
  language: ru
  text: Встав, он взял ребёнка и его мать и вошёл в землю Израиля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: он
  rationale: Частица δέ обозначает продолжение повествования и не требует отдельной передачи в естественном русском контексте; последовательность выражена деепричастной конструкцией.
- source_word: ἐγερθεὶς
  choice: Встав
  rationale: 'Аористное причастие здесь имеет непереходное значение и обозначает действие, предшествующее основному: «встав».'
- source_word: παρέλαβε
  choice: взял
  rationale: В данном контексте παραλαμβάνω означает взять с собой; краткое «взял» естественно и сохраняет повторяющуюся формулу повествования.
- source_word: τὸ παιδίον
  choice: Младенца
  rationale: παιδίον обозначает маленького ребёнка. «Младенец» уместно в контексте рассказа о раннем детстве Иисуса и звучит естественно в русском библейском повествовании.
- source_word: τὴν μητέρα αὐτοῦ
  choice: Его мать
  rationale: Местоимение αὐτοῦ относится к Младенцу; прописная буква следует принятому русскому благоговейному написанию при указании на Христа, не меняя смысла исходного текста.
- source_word: εἰσῆλθεν
  choice: пришёл
  rationale: εἰσέρχομαι с εἰς может означать войти или прибыть в пределы территории. Для возвращения в страну русское «пришёл в землю» естественнее буквального «вошёл».
- source_word: εἰς γῆν Ἰσραήλ
  choice: в землю Израиля
  rationale: Сочетание передаёт географически-национальное обозначение страны и сохраняет формулировку греческого текста.
