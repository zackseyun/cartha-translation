source:
  edition: SBLGNT
  text: καὶ χρηματισθέντες κατ’ ὄναρ μὴ ἀνακάμψαι πρὸς Ἡρῴδην δι’ ἄλλης ὁδοῦ ἀνεχώρησαν εἰς τὴν χώραν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/012.yaml
  text: And having been warned in a dream not to return to Herod[b][a], they departed for their own country by another route.
translation:
  language: ru
  text: И, получив во сне предупреждение[a] не возвращаться к Ироду, они отправились в свою страну другим путём[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «получив во сне указание свыше». Греческая пассивная форма подразумевает предупреждение от Бога, хотя в этом стихе Бог прямо не назван.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по другой дороге».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισθέντες
  choice: получив предупреждение
  rationale: Пассивное причастие передаёт получение предупреждения или указания, в данном контексте — от Бога; формулировка естественна по-русски и не добавляет прямо не названного деятеля.
- source_word: κατ’ ὄναρ
  choice: во сне
  rationale: Устойчивое и естественное обозначение откровения, полученного во время сна.
- source_word: μὴ ἀνακάμψαι
  choice: не возвращаться
  rationale: Инфинитив с μή выражает содержание предупреждения; глагол означает возвращение назад в рамках путешествия.
- source_word: πρὸς Ἡρῴδην
  choice: к Ироду
  rationale: Предлог πρός с винительным падежом обозначает направленность к лицу.
- source_word: δι’ ἄλλης ὁδοῦ
  choice: другим путём
  rationale: ὁδός здесь обозначает путь или дорогу; творительный оборот краток, естественен и сохраняет конкретный смысл.
- source_word: ἀνεχώρησαν
  choice: отправились
  rationale: В повествовании о возвращении передаёт уход и начало пути без излишне сильного оттенка бегства или отступления.
- source_word: εἰς τὴν χώραν αὐτῶν
  choice: в свою страну
  rationale: χώρα может означать страну, землю или область; контекст возвращения волхвов домой поддерживает «в свою страну».
theological_decisions:
- issue: Подразумеваемый божественный источник предупреждения
  choice: 'В основном тексте сохранена безлично-пассивная идея: «получив… предупреждение», без добавления «от Бога».'
  alternative: «получив от Бога предупреждение» / «получив божественное предупреждение»
  rationale: Контекст и употребление χρηματίζω подразумевают божественный источник, однако в самом стихе Бог прямо не назван; примечание раскрывает импликацию, не превращая её в эксплицитное утверждение основного текста.
translation_notes:
  register: Современный литературный русский язык; повествовательная формулировка ясная и сдержанно торжественная. Порядок слов слегка перестроен ради естественности русского синтаксиса; все смысловые элементы греческого текста сохранены.
