id: MAT.2.11
reference: Matthew 2:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας τῆς μητρὸς αὐτοῦ, καὶ πεσόντες προσεκύνησαν αὐτῷ, καὶ ἀνοίξαντες τοὺς θησαυροὺς αὐτῶν προσήνεγκαν αὐτῷ δῶρα, χρυσὸν καὶ λίβανον καὶ σμύρναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/011.yaml
  text: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasures they offered him gifts: gold and frankincense and myrrh.'
translation:
  language: ru
  text: 'И, войдя в дом, они увидели ребёнка с Марией, Его матерью. Пав ниц, они поклонились Ему[a], а затем открыли свои сокровища и преподнесли Ему дары: золото, ладан и смирну.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол может означать как поклонение, так и выражение глубокого почтения — в зависимости от контекста.
    reason: Сохранение смыслового диапазона προσκυνέω и богословской неоднозначности.
lexical_decisions:
- source_word: οἰκίαν
  choice: дом
  rationale: Прямое и естественное обозначение жилого дома; не добавляет отсутствующих в греческом тексте подробностей.
- source_word: παιδίον
  choice: ребёнок
  rationale: Передаёт παιδίον без излишнего уточнения возраста или пола.
- source_word: μετὰ Μαρίας τῆς μητρὸς αὐτοῦ
  choice: с Марией, Его матерью
  rationale: Сохраняет значение μετά с родительным падежом и приложение, называющее Марию матерью ребёнка.
- source_word: πεσόντες
  choice: пав ниц
  rationale: Естественно по-русски передаёт телесное действие и позу глубокого почтения, предшествующие основному глаголу.
- source_word: προσεκύνησαν
  choice: поклонились
  rationale: Русский глагол естественно охватывает как благоговейное поклонение, так и выражение глубокого почтения, сохраняя контекстуальную многозначность греческого слова.
- source_word: θησαυροὺς αὐτῶν
  choice: свои сокровища
  rationale: Сохраняет образ ценностей или хранилищ ценностей, не конкретизируя их как сундуки.
- source_word: προσήνεγκαν αὐτῷ δῶρα
  choice: преподнесли Ему дары
  rationale: Передаёт торжественный акт поднесения даров без обязательного культового оттенка слова «приношения».
- source_word: λίβανον
  choice: ладан
  rationale: Точное и общепонятное русское название ароматической смолы frankincense.
- source_word: σμύρναν
  choice: смирну
  rationale: Традиционное и точное русское соответствие названию мирры.
theological_decisions:
- issue: Значение προσκυνέω по отношению к ребёнку Иисусу
  choice: поклонились Ему
  alternative: воздали Ему почести; поклонились Ему как Богу
  rationale: В данном контексте слово может обозначать почтительный земной поклон царственной особе либо поклонение в более сильном религиозном смысле. Русское «поклонились» сохраняет оба возможных оттенка, не разрешая богословское напряжение за читателя.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Длинная греческая цепь сочинительных конструкций разделена на два предложения ради ясности; последовательность действий сохранена. Заглавное написание местоимения «Ему» соответствует принятому благоговейному русскому библейскому регистру, не меняя содержания исходного текста.
