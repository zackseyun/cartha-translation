  source_fidelity: Перевод точно передаёт временное значение ἀκούσας («Услышав это»), титул и имя («царь Ирод»), реакцию ἐταράχθη («встревожился») и корпоративную метонимию πᾶσα Ἱεροσόλυμα («весь Иерусалим»). «Вместе с ним» корректно передаёт μετ’ αὐτοῦ. Союзное оформление естественно отражает переход δέ и присоединение καί без искусственного противопоставления.
