id: MAT.2.3
reference: Matthew 2:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ⸂ὁ βασιλεὺς Ἡρῴδης⸃ ἐταράχθη καὶ πᾶσα Ἱεροσόλυμα μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/003.yaml
  text: When King Herod heard this[a], he was troubled[b], and all Jerusalem with him.
translation:
  language: ru
  text: Услышав это, царь Ирод встревожился, а вместе с ним — и весь Иерусалим.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Весь Иерусалим» — название города вместо его жителей; выражение может иметь обобщающий или гиперболический характер.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: услышав это
  rationale: Аористное причастие имеет временное значение; местоимение «это» естественно передаёт подразумеваемое сообщение волхвов из ближайшего контекста.
- source_word: δὲ
  choice: а
  rationale: Слабый переходный союз δέ передан естественным русским связующим «а», обозначающим переход к реакции Ирода без усиленного противопоставления.
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: царь Ирод
  rationale: Обычная и естественная русская форма титула с именем, точно передающая βασιλεύς.
- source_word: ἐταράχθη
  choice: встревожился
  rationale: Глагол передаёт внутреннее смятение или тревогу; «встревожился» звучит естественно и не уточняет чрезмерно степень или характер реакции.
- source_word: πᾶσα Ἱεροσόλυμα
  choice: весь Иерусалим
  rationale: Сохранена греческая метонимия, при которой название города обозначает его жителей, без сужения значения до руководителей или иной группы.
- source_word: μετ’ αὐτοῦ
  choice: вместе с ним
  rationale: Прямо передаёт совместность, связывая тревогу Иерусалима с реакцией Ирода.
theological_decisions:
- issue: Объём значения πᾶσα Ἱεροσόλυμα
  choice: Корпоративное, метонимическое обозначение Иерусалима и его жителей
  alternative: Гиперболическое указание на многих жителей либо более узкая отсылка к руководящим кругам города
  rationale: Греческий текст называет город как целое. Перевод сохраняет эту формулировку и напряжение повествования, не вводя отсутствующего в тексте социологического уточнения.
translation_notes:
  register: Современный литературный русский язык; синтаксис плавный и понятный, при этом сохранены метонимия оригинала и его смысловая неоднозначность.
