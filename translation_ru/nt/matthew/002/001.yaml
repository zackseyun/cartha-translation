base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/001.yaml
  text: After Jesus was born in Bethlehem of Judea in the days of Herod the king[a], behold, wise men from the east arrived in Jerusalem,
translation:
  language: ru
  text: После того как Иисус родился в Вифлееме Иудейском во дни царя Ирода, и вот, с востока в Иерусалим прибыли маги[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мудрецы». Греческое слово обозначает учёных мужей с Востока, вероятно связанных с астрологией или придворной мудростью.'
    reason: lexical_clarification
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γεννηθέντος
  choice: После того как Иисус родился
  rationale: Родительный самостоятельный оборот задаёт предшествующее фоновое обстоятельство; такая формулировка естественно передаёт временную последовательность. Частица δέ здесь служит мягким повествовательным переходом и не требует отдельного слова.
- source_word: Βηθλέεμ τῆς Ἰουδαίας
  choice: в Вифлееме Иудейском
  rationale: Устоявшееся русское географическое наименование естественно отличает этот Вифлеем от других одноимённых мест.
- source_word: ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως
  choice: во дни царя Ирода
  rationale: Сохраняет историческую локализацию и умеренно библейскую повествовательную окраску греческого оборота, оставаясь понятным современному читателю.
- source_word: ἰδοὺ
  choice: вот
  rationale: Передаёт привлекающий внимание повествовательный маркер естественнее для современного русского языка, чем архаичное «се».
- source_word: μάγοι
  choice: маги
  rationale: Наиболее точно передаёт обозначение восточных учёных-звездочётов или придворных мудрецов, не превращая их в царей и не уточняя их число.
- source_word: ἀπὸ ἀνατολῶν
  choice: с востока
  rationale: Естественный русский эквивалент греческого множественного обозначения восточных краёв.
- source_word: παρεγένοντο εἰς Ἱεροσόλυμα
  choice: в Иерусалим прибыли
  rationale: Глагол выражает прибытие на место, а εἰς указывает направление; русский порядок слов позволяет сохранить акцент вводного «вот» на появлении новых действующих лиц.
theological_decisions:
- issue: Передача μάγοι без привнесения поздней традиции
  choice: маги
  alternative: мудрецы
  rationale: «Маги» формально точнее обозначает восточных учёных-звездочётов или придворных советников и не вносит поздние представления о том, что они были царями или что их было трое. Пояснение раскрывает смысл термина для современного читателя.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской повествовательной окраской. «Во дни» сохраняет достоинство и исторический тон, а «вот» понятно передаёт функцию ἰδοὺ. Пунктуация завершена точкой как для отдельного стиха, хотя синтаксически повествование продолжается в следующем стихе.
