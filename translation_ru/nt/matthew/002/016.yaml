id: MAT.2.16
reference: Matthew 2:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης ἰδὼν ὅτι ἐνεπαίχθη ὑπὸ τῶν μάγων ἐθυμώθη λίαν, καὶ ἀποστείλας ἀνεῖλεν πάντας τοὺς παῖδας τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς ἀπὸ διετοῦς καὶ κατωτέρω, κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/016.yaml
  text: Then Herod[a], seeing that he had been tricked by the magi, became very angry, and sending men, he killed all the boys in Bethlehem and in all its surrounding districts, from two years old and under[b], according to the time that he had determined from the magi.
translation:
  language: ru
  text: Тогда Ирод, увидев, что маги[b] его обманули[a], сильно разгневался и, послав людей, убил всех мальчиков в Вифлееме и во всех окрестностях Вифлеема — двух лет и младше, в соответствии со временем, которое он точно выяснил у магов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «над ним посмеялись» или «его выставили на посмешище».'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «волхвы». Греческое слово обозначает восточных мудрецов-звездочётов.'
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественная временная связка, передающая последовательность событий.
- source_word: ἰδὼν ὅτι
  choice: увидев, что
  rationale: Сохраняет образ восприятия из греческого текста и одновременно естественно вводит причину последующей реакции Ирода.
- source_word: ἐνεπαίχθη
  choice: его обманули
  rationale: В контексте слово указывает на то, что маги не вернулись и тем самым оставили Ирода в дураках; «обманули» ясно передаёт это современному читателю. Более буквальное значение отмечено в сноске.
- source_word: μάγων
  choice: маги
  rationale: Прямая передача историко-культурного термина для восточных мудрецов-звездочётов без замены его более широким обозначением.
- source_word: ἐθυμώθη λίαν
  choice: сильно разгневался
  rationale: Передаёт становление гнева и усилитель λίαν современным, но достойным литературным языком.
- source_word: ἀποστείλας
  choice: послав людей
  rationale: Причастный оборот передаёт предшествующее или сопутствующее действие; добавление «людей» ясно обозначает подразумеваемых исполнителей.
- source_word: ἀνεῖλεν
  choice: убил
  rationale: Прямой современный эквивалент со значением лишения жизни; конструкция с «послав людей» показывает действие через исполнителей.
- source_word: πάντας τοὺς παῖδας
  choice: всех мальчиков
  rationale: Контекст поиска ребёнка мужского пола и форма мужского рода указывают здесь именно на мальчиков, а не на детей обоих полов.
- source_word: ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς
  choice: в Вифлееме и во всех его окрестностях
  rationale: «Окрестности» естественно передаёт окружающую территорию, обозначенную словом ὅρια; местоимение относится к Вифлеему.
- source_word: ἀπὸ διετοῦς καὶ κατωτέρω
  choice: двух лет и младше
  rationale: Ясно и идиоматично обозначает включительный верхний возрастной предел.
- source_word: κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων
  choice: в соответствии со временем, которое он точно выяснил у магов
  rationale: Сохраняет значение соответствия у κατά и оттенок точного выяснения у ἀκριβόω, не превращая полученную информацию в решение самого Ирода.
theological_decisions:
- issue: Передача ἐνεπαίχθη
  choice: его обманули
  alternative: над ним посмеялись / его выставили на посмешище
  rationale: Контекстуальный вариант ясно описывает восприятие Иродом поступка магов, а сноска сохраняет более буквальный оттенок насмешки и не устраняет лексическую неоднозначность.
- issue: Передача μάγοι
  choice: маги
  alternative: волхвы / мудрецы
  rationale: «Маги» точнее сохраняет историко-культурную специфику исходного термина и не вносит позднейшие традиционные представления; знакомый русский вариант указан в сноске.
translation_notes:
  register: Современный литературный русский язык с прямым, сдержанным изложением. Сохранена последовательность греческой фразы, но возрастная формула и обозначение окрестностей переданы естественными русскими выражениями. Маркеры сносок поставлены непосредственно после слов, к которым относятся.
