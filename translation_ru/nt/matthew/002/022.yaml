  source_fidelity: 'Перевод точно передаёт последовательность и основные элементы греческого текста: известие о царствовании Архелая в Иудее вместо Ирода, страх идти туда, полученное во сне предостережение и уход в области Галилеи. Пассивный и не названный прямо источник в χρηματισθείς сохранён без неоправданного добавления «от Бога».'
