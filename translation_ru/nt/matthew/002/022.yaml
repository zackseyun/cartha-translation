id: MAT.2.22
reference: Matthew 2:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὅτι Ἀρχέλαος ⸀βασιλεύει τῆς Ἰουδαίας ἀντὶ ⸂τοῦ πατρὸς αὐτοῦ Ἡρῴδου⸃ ἐφοβήθη ἐκεῖ ἀπελθεῖν· χρηματισθεὶς δὲ κατ’ ὄναρ ἀνεχώρησεν εἰς τὰ μέρη τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/022.yaml
  text: But when he heard that Archelaus was reigning over Judea in place of his father Herod[a], he was afraid to go there. And after being warned in a dream, he withdrew to the regions of Galilee,
translation:
  language: ru
  text: Но, услышав, что в Иудее вместо своего отца Ирода царствует Архелай, он побоялся идти туда. Получив во сне предостережение[a], он удалился в пределы Галилеи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «получив указание»; употреблённый здесь глагол обычно подразумевает предостережение или наставление свыше.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ
  choice: Но, услышав
  rationale: Аористное причастие обозначает предшествующее обстоятельство, а δέ отмечает поворот повествования и препятствие прежнему намерению.
- source_word: βασιλεύει τῆς Ἰουδαίας
  choice: в Иудее ... царствует
  rationale: «Царствует» сохраняет царский оттенок βασιλεύω; предложное сочетание «в Иудее» естественно для современного русского языка.
- source_word: ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου
  choice: вместо своего отца Ирода
  rationale: ἀντί указывает на занятие места предшественника; «своего» недвусмысленно связывает отца с Архелаем.
- source_word: ἐφοβήθη ἐκεῖ ἀπελθεῖν
  choice: он побоялся идти туда
  rationale: Естественно передаёт страх как причину отказа направиться в Иудею, не усиливая его до ужаса.
- source_word: χρηματισθεὶς
  choice: получив ... предостережение
  rationale: Глагол в данном контексте обозначает полученное свыше предупреждение или указание, но греческий текст не называет действующее лицо.
- source_word: κατ’ ὄναρ
  choice: во сне
  rationale: Обычное и естественное русское соответствие матфеевскому выражению о получении откровения во время сна.
- source_word: ἀνεχώρησεν
  choice: он удалился
  rationale: Сохраняет оттенок целенаправленного ухода в ответ на опасность, а не просто нейтрального перемещения.
- source_word: εἰς τὰ μέρη τῆς Γαλιλαίας
  choice: в пределы Галилеи
  rationale: Передаёт множественное μέρη как территорию или области Галилеи и звучит естественно в литературном библейском повествовании.
theological_decisions:
- issue: Следует ли прямо назвать Бога источником предостережения
  choice: 'В основном тексте источник не назван: «получив во сне предостережение».'
  alternative: «Получив во сне предостережение от Бога» или «получив во сне Божье указание».
  rationale: В употреблении Матфея χρηματίζω обычно подразумевает сообщение свыше, однако в этом стихе субъект действия прямо не указан. Перевод сохраняет эту грамматическую сдержанность, а примечание поясняет подразумеваемый оттенок.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным регистром. Синтаксис остаётся ясным для широкого читателя; «царствует», «предостережение» и «пределы» сохраняют достоинство библейского стиля без архаизации.
