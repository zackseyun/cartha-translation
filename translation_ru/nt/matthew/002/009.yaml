  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες τοῦ βασιλέως ἐπορεύθησαν, καὶ ἰδοὺ ὁ ἀστὴρ ὃν εἶδον ἐν τῇ ἀνατολῇ προῆγεν αὐτούς, ἕως ἐλθὼν ⸀ἐστάθη ἐπάνω οὗ ἦν τὸ παιδίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/009.yaml
  text: After hearing the king[a], they went on their way, and behold, the star that they had seen in the east went before them until it came and stood over where the child was.
translation:
  language: ru
  text: Выслушав царя, они отправились в путь. И вот, звезда, которую они видели на востоке[a], шла впереди них, пока не пришла и не остановилась над тем местом, где был ребёнок.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при её восходе». Греческое выражение может обозначать как восток — область или направление, так и восход звезды.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες τοῦ βασιλέως
  choice: Выслушав царя
  rationale: Аористное причастие перед основным глаголом передаёт предшествующее действие; «выслушав» естественно выражает завершённое слушание царя, не добавляя его имени.
- source_word: ἐπορεύθησαν
  choice: они отправились в путь
  rationale: Передаёт повествовательное движение и отправление после встречи с царём естественным современным русским языком.
- source_word: ἰδοὺ
  choice: И вот
  rationale: Сохраняет указательный дискурсивный маркер и внезапное оживление повествования.
- source_word: ὁ ἀστήρ
  choice: звезда
  rationale: Прямое и обычное соответствие греческому существительному.
- source_word: ὃν εἶδον
  choice: которую они видели
  rationale: Сохраняет относительную конструкцию и естественно указывает на предшествующее наблюдение без необходимости вводить в русском языке плюсквамперфект.
- source_word: ἐν τῇ ἀνατολῇ
  choice: на востоке
  rationale: Естественное географическое прочтение многозначного выражения; астрономическое значение «при её восходе» сохранено в сноске.
- source_word: προῆγεν αὐτούς
  choice: шла впереди них
  rationale: Близко передаёт образ звезды, идущей впереди, не уточняя механизм её движения.
- source_word: ἕως ἐλθὼν ἐστάθη
  choice: пока не пришла и не остановилась
  rationale: Передаёт последовательность прибытия и остановки; женский род согласован со словом «звезда».
- source_word: ἐπάνω οὗ ἦν
  choice: над тем местом, где был
  rationale: Развёрнутая русская конструкция яснее и естественнее буквального «над тем, где», сохраняя пространственное отношение.
- source_word: τὸ παιδίον
  choice: Младенец
  rationale: В данном евангельском контексте традиционное и понятное обозначение маленького Иисуса; не добавляет уточнения имени, отсутствующего в стихе.
theological_decisions:
- issue: Значение ἐν τῇ ἀνατολῇ в рассказе о звезде
  choice: на востоке
  alternative: при её восходе
  rationale: Греческое выражение допускает как географический, так и астрономический смысл. Основной текст сохраняет привычное и естественное географическое прочтение, а подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «И вот» сохраняет повествовательную выразительность; синтаксис сделан ясным для обычного читателя без устранения лексической неоднозначности.
