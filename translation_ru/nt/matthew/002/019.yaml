  text: Τελευτήσαντος δὲ τοῦ Ἡρῴδου ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/019.yaml
  text: But after Herod died[a], behold, an angel of the Lord appears in a dream to Joseph in Egypt.
translation:
  language: ru
  text: После смерти Ирода — и вот, ангел Господа является Иосифу во сне в Египте.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τελευτήσαντος δὲ τοῦ Ἡρῴδου
  choice: После смерти Ирода
  rationale: Генитив абсолютный с аористным причастием передаёт предшествующее обстоятельство времени. Русская именная конструкция естественна и точно выражает смысл «после того как Ирод умер»; δέ здесь служит переходом в повествовании и не требует отдельного союза.
- source_word: ἰδοὺ
  choice: вот
  rationale: Сохраняет функцию выразительного указателя, привлекающего внимание, и звучит естественно в современном литературном русском.
- source_word: ἄγγελος κυρίου
  choice: ангел Господень
  rationale: Естественное и традиционно понятное русское соответствие без неоправданного уточнения тождества ангела. Русский язык не имеет артиклей, поэтому неопределённость греческого выражения нельзя напрямую передать формой существительного.
- source_word: φαίνεται
  choice: является
  rationale: Настоящее время сохраняет историческое настоящее греческого повествования и его живость.
- source_word: κατ’ ὄναρ
  choice: во сне
  rationale: Естественный русский эквивалент идиомы, обозначающей явление, пережитое во сне.
- source_word: τῷ Ἰωσὴφ
  choice: Иосифу
  rationale: Дательный падеж передаёт лицо, которому является ангел; использована устоявшаяся русская форма имени.
- source_word: ἐν Αἰγύπτῳ
  choice: в Египте
  rationale: Прямо передаёт место нахождения Иосифа.
theological_decisions:
- issue: Передача κύριος в выражении ἄγγελος κυρίου
  choice: Господень
  alternative: ангел Господа
  rationale: Прилагательное «Господень» естественно и достойно передаёт принадлежность или отношение к Господу, не добавляя конфессионального толкования.
- issue: Отсутствие артикля перед ἄγγελος
  choice: ангел Господень без сноски
  alternative: один из ангелов Господа / тот ангел Господень
  rationale: В русском нет артиклей, а отсутствие греческого артикля само по себе не требует ни числительного «один», ни указательного «тот». Формулировка сохраняет допустимую неопределённость и не отождествляет фигуру с особым «Ангелом Господним».
translation_notes:
  register: Современный литературный русский с библейской торжественностью. Тире после начального обстоятельства помогает естественно передать резкий ввод ἰδού; историческое настоящее сохранено.
