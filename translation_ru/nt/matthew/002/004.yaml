id: MAT.2.4
reference: Matthew 2:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ συναγαγὼν πάντας τοὺς ἀρχιερεῖς καὶ γραμματεῖς τοῦ λαοῦ ἐπυνθάνετο παρ’ αὐτῶν ποῦ ὁ χριστὸς γεννᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/004.yaml
  text: And gathering together all the chief priests and scribes of the people[a], he was inquiring of them where the Messiah was to be born.
translation:
  language: ru
  text: И, собрав всех первосвященников и книжников народа, он спрашивал у них, где должен родиться Мессия[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос».'
    reason: Сохраняет традиционную альтернативную передачу греческого титула Χριστός.
lexical_decisions:
- source_word: συναγαγὼν
  choice: собрав
  rationale: Аористное причастие обозначает действие, предшествующее основному; русское деепричастие естественно и точно передаёт последовательность.
- source_word: πάντας
  choice: всех
  rationale: Сохраняет полноту охвата, выраженную греческим прилагательным.
- source_word: ἀρχιερεῖς
  choice: первосвященников
  rationale: Устоявшееся обозначение высшего священнического руководства; множественное число не предполагает одновременного существования нескольких действующих верховных первосвященников.
- source_word: γραμματεῖς
  choice: книжников
  rationale: Прямой и традиционно понятный перевод названия знатоков и толкователей Закона без избыточного истолкования.
- source_word: τοῦ λαοῦ
  choice: народа
  rationale: Сохраняет простой родительный оборот оригинала и не добавляет отсутствующее в тексте этническое пояснение.
- source_word: ἐπυνθάνετο
  choice: спрашивал
  rationale: Несовершенный вид русского глагола передаёт длительный или развёртывающийся характер имперфекта; сочетание «спрашивал у них» естественно выражает получение сведений.
- source_word: παρ’ αὐτῶν
  choice: у них
  rationale: Предлог παρά при глаголе выяснения передаёт источник получаемых сведений; по-русски это естественно выражается сочетанием «спрашивал у них».
- source_word: ποῦ
  choice: где
  rationale: Прямое соответствие вопросительному наречию места.
- source_word: ὁ χριστὸς
  choice: Мессия
  rationale: В контексте ожидания обещанного иудейского царя χριστός функционирует как титул; «Мессия» сохраняет этот мессианский контекст и остаётся понятным современному читателю.
- source_word: γεννᾶται
  choice: должен родиться
  rationale: Настоящее страдательного залога в косвенном вопросе относится к ожидаемому, предсказанному рождению; эта русская конструкция естественно передаёт пророческое ожидание, не утверждая, что рождение уже происходит.
theological_decisions:
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Ирод спрашивает об ожидаемом помазанном правителе из иудейских пророчеств, поэтому «Мессия» ясно передаёт функцию титула. В сноске сохранён традиционный вариант «Христос».
- issue: Модальность в γεννᾶται
  choice: должен родиться
  alternative: родится
  rationale: Выбранная форма передаёт не обязанность Мессии, а ожидаемое согласно пророчеству место рождения; она сохраняет ориентированность вопроса на установленное пророчеством событие.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис близок к оригиналу, но естественен по-русски; несовершенный вид «спрашивал» сохраняет аспект имперфекта. Маркер сноски помещён непосредственно после слова, к которому относится.
