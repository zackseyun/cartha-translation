  source_fidelity: 'Текст точно передаёт синтаксис и смысл греческого оригинала: деепричастие «собрав» соответствует συναγαγών и обозначает предшествующее действие; «всех», «первосвященников», «книжников народа» сохраняют объём и состав собранной группы. «Спрашивал у них» удачно передаёт имперфект ἐπυνθάνετο с указанием источника сведений (παρ’ αὐτῶν). «Где должен родиться Мессия» естественно выражает косвенный вопрос об ожидаемом, пророчески определённом месте рождения; это не требует изменения на более категоричную или догматически нагруженную формулировку.'
