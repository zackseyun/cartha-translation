- from: '«Голос в Раме слышен: плач и великое рыдание; Рахиль плачет о детях своих и не хочет утешиться[a], потому что их нет[b]».'
  to: '«В Раме был слышен голос: плач и великое стенание; Рахиль плачет о своих детях и не хочет, чтобы её утешали[a], потому что их нет[b]».'
  rationale: Правка уточняет аористный пассив ἠκούσθη и пассивное значение παρακληθῆναι, не меняя образный и пророческий характер цитаты. Основное выражение «их нет» намеренно не конкретизирует характер утраты; сноска приведена к точной, естественной буквальной форме.
