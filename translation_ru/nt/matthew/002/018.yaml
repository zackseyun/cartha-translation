  text: Φωνὴ ἐν Ῥαμὰ ⸀ἠκούσθη, κλαυθμὸς καὶ ὀδυρμὸς πολύς· Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς, καὶ οὐκ ἤθελεν παρακληθῆναι ὅτι οὐκ εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/018.yaml
  text: 'A voice was heard in Ramah[a], weeping and great mourning: Rachel weeping for her children, and she was not willing to be comforted[c][b], because they are no more.'
translation:
  language: ru
  text: '«В Раме был слышен голос: плач и великое стенание; Рахиль плачет о своих детях и не хочет, чтобы её утешали[a], потому что их нет[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отказывается принять утешение».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «потому что их нет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Φωνὴ
  choice: Голос
  rationale: Передаёт обычное значение φωνή и сохраняет олицетворённый, пророческий тон цитаты.
- source_word: ἐν Ῥαμὰ
  choice: в Раме
  rationale: Предлог ἐν с названием места естественно передаётся как «в»; используется принятое русское написание топонима.
- source_word: ἠκούσθη
  choice: слышен
  rationale: Краткая русская конструкция естественно передаёт аорист страдательного залога «был услышан» и соответствует торжественному стилю цитаты.
- source_word: κλαυθμὸς καὶ ὀδυρμὸς πολύς
  choice: плач и великое рыдание
  rationale: Различает два близких существительных и сохраняет усиление πολύς без добавления отсутствующих в греческом оттенков.
- source_word: Ῥαχὴλ κλαίουσα
  choice: Рахиль плачет
  rationale: Личная глагольная форма звучит естественно по-русски и передаёт продолжающееся действие причастия настоящего времени.
- source_word: τὰ τέκνα αὐτῆς
  choice: о детях своих
  rationale: τέκνα означает детей без ограничения по полу; возвратное «своих» естественно соотносит их с Рахилью.
- source_word: οὐκ ἤθελεν παρακληθῆναι
  choice: не хочет утешиться
  rationale: Сохраняет значение нежелания у θέλω и естественно передаёт по-русски пассивный смысл принятия утешения, не усиливая его до категорического «отказывается».
- source_word: ὅτι οὐκ εἰσίν
  choice: потому что их нет
  rationale: Близко передаёт предельно краткое греческое выражение и сохраняет его намеренную недосказанность относительно смерти или отсутствия.
theological_decisions:
- issue: Образ Рахили в пророческой цитате
  choice: Сохранить Рахиль как материнскую фигуру цитаты без пояснения символики в основном тексте.
  alternative: Прямо назвать Рахиль образом матерей Израиля либо понимать её речь только буквально.
  rationale: Греческий текст не раскрывает типологическое значение образа; перевод не должен устранять эту богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной ритмикой пророческой цитаты. Формы «Рахиль», «в Раме» и «о детях своих» соответствуют устойчивому библейскому регистру, оставаясь понятными современному читателю.
