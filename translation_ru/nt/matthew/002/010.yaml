lexical_decisions:
- source_word: ἰδόντες
  choice: Увидев
  rationale: Аористное причастие ὁράω выражает обстоятельство, предшествующее главному действию; русское деепричастие естественно сохраняет эту связь.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Здесь δέ — слабая повествовательная связка. В русском продолжение рассказа естественно передаётся без отдельного союза, тогда как «но» создало бы излишне сильное противопоставление.
- source_word: τὸν ἀστέρα
  choice: звезду
  rationale: 'Определённость греческого артикля следует из контекста: речь идёт об уже упомянутой звезде; в русском отдельный показатель определённости не требуется.'
- source_word: ἐχάρησαν
  choice: они возликовали
  rationale: Форма χαίρω имеет активное значение «обрадоваться, возликовать»; «возликовали» сохраняет силу глагола и возвышенный, но понятный тон.
- source_word: χαρὰν μεγάλην
  choice: великой радостью
  rationale: Родственный винительный усиливает глагол. Творительный падеж естественно передаёт конструкцию, а «великая радость» сохраняет её выразительность.
- source_word: σφόδρα
  choice: передано общей усиленной формулировкой; пояснено в сноске
  rationale: Наречие предельно усиливает всё выражение. Буквальное добавление «чрезвычайно» к «великой радостью» звучит по-русски тяжеловесно, поэтому сила оригинала сохранена энергичным оборотом и отмечена в сноске.
