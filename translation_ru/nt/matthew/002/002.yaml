base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/002.yaml
  text: saying[b][a], “Where is the one who has been born king of the Jews? For we saw his star in the east and have come to pay him homage.”
translation:
  language: ru
  text: 'Они говорили: «Где Тот, кто родился царём иудеев? Ведь мы увидели его звезду на востоке[a] и пришли поклониться ему[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при его восходе». Греческое выражение может означать «на востоке» или относиться к восходу звезды.'
    reason: alternative_reading
  - marker: b
    text: Греческий глагол может означать как почтительное преклонение или воздание царских почестей, так и религиозное поклонение.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: Они спрашивали
  rationale: Причастие настоящего времени вводит прямую речь волхвов. Поскольку речь имеет форму вопроса, «спрашивали» естественно передаёт его функцию в русском повествовании.
- source_word: Ποῦ ἐστιν
  choice: Где
  rationale: Прямой вопрос о местонахождении; добавлять оттенок предположения или неуверенности нет оснований.
- source_word: ὁ τεχθεὶς
  choice: родившийся
  rationale: Субстантивированное страдательное причастие передано причастной формой, сохраняющей акцент на рождении и не добавляющей значения «новорождённый».
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: Царь иудеев
  rationale: Естественная современная передача царского титула, сохраняющая его политический и мессианский смысл. Прописная буква уместна как часть титульного обозначения в прямой речи.
- source_word: εἴδομεν γὰρ
  choice: Ведь мы увидели
  rationale: «Ведь» естественно выражает пояснительно-причинную функцию γάρ, а прошедшее время передаёт аорист εἴδομεν без ненужного усложнения.
- source_word: αὐτοῦ τὸν ἀστέρα
  choice: Его звезду
  rationale: Притяжательное значение местоимения передано прямо; природа самого небесного знамения остаётся неопределённой, как и в греческом тексте.
- source_word: ἐν τῇ ἀνατολῇ
  choice: на востоке
  rationale: Фраза допускает географическое значение «на востоке» и астрономическое «при восходе». Основной текст использует традиционное и контекстуально возможное значение, а подлинная неоднозначность отмечена в сноске.
- source_word: ἤλθομεν
  choice: пришли
  rationale: Русское совершенное прошедшее естественно передаёт завершённое действие, результат которого актуален в момент речи.
- source_word: προσκυνῆσαι αὐτῷ
  choice: поклониться Ему
  rationale: Русское «поклониться» может обозначать как почтительное преклонение перед царём, так и религиозное поклонение, поэтому хорошо сохраняет диапазон греческого προσκυνέω и богословское напряжение контекста.
theological_decisions:
- issue: Значение προσκυνῆσαι применительно к младенцу Иисусу
  choice: поклониться Ему
  alternative: воздать Ему царские почести; поклониться Ему как Богу
  rationale: В непосредственном контексте волхвы ищут Царя иудеев, поэтому возможен смысл царского почтения; вместе с тем глагол способен обозначать религиозное поклонение. Русское «поклониться» не вынуждает преждевременно выбрать только одно значение, а сноска прямо обозначает смысловой диапазон.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной прямой речью. Формулировка сохраняет причастную конструкцию «родившийся» и не вводит отсутствующего в оригинале уточнения «новорождённый». Местоимение «Его/Ему» написано с прописной буквы в соответствии с принятым благоговейным библейским регистром, без изменения смысла исходного текста.
