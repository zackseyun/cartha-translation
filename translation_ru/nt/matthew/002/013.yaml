id: MAT.2.13
reference: Matthew 2:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἀναχωρησάντων δὲ αὐτῶν ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ φεῦγε εἰς Αἴγυπτον, καὶ ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι· μέλλει γὰρ Ἡρῴδης ζητεῖν τὸ παιδίον τοῦ ἀπολέσαι αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/013.yaml
  text: After they had departed[a], behold, an angel of the Lord appeared to Joseph in a dream, saying, “Get up, take the child and his mother, and flee to Egypt, and stay there until I tell you[c][b]; for Herod is about to seek the child in order to destroy him.”
translation:
  language: ru
  text: 'После того как они ушли, и вот, ангел Господа явился Иосифу во сне и сказал: «Встань, возьми ребёнка и его мать и беги в Египет. Оставайся там, пока я не скажу тебе, потому что Ирод собирается искать ребёнка, чтобы погубить его[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть убить его.
    reason: Поясняет, что «погубить» (ἀπολέσαι) в данном контексте означает причинить смерть, сохраняя при этом образность основного текста.
lexical_decisions:
- source_word: Ἀναχωρησάντων δὲ αὐτῶν
  choice: Когда они ушли
  rationale: Родительный самостоятельный оборот обозначает действие, предшествующее явлению ангела. В контексте местоимение относится к ранее упомянутым мудрецам.
- source_word: ἰδοὺ
  choice: вот
  rationale: Сохраняет выразительный повествовательный сигнал, отмечающий внезапное вмешательство свыше, и при этом естественно звучит по-русски.
- source_word: ἄγγελος κυρίου
  choice: ангел Господа
  rationale: Отсутствие артикля не требует отождествления с единственным особым персонажем; конструкция передана без навязывания такого толкования. κύριος в данном сочетании обозначает Господа.
- source_word: φαίνεται κατ’ ὄναρ τῷ Ἰωσὴφ λέγων
  choice: явился Иосифу во сне и сказал
  rationale: Настоящее историческое φαίνεται естественно передано русским прошедшим временем, а причастие λέγων — личной формой для плавного современного повествования.
- source_word: Ἐγερθεὶς παράλαβε
  choice: Встань, возьми
  rationale: Хотя Ἐγερθεὶς формально является причастием, в последовательности повелений оно имеет побудительную силу. παράλαβε означает взять с собой.
- source_word: τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ
  choice: ребёнка и его мать
  rationale: Передаёт обычное значение παιδίον без неоправданного уточнения возраста; местоимение естественно относится к ребёнку.
- source_word: φεῦγε εἰς Αἴγυπτον
  choice: беги в Египет
  rationale: Глагол φεύγω выражает срочное бегство от опасности; «беги» сохраняет эту силу и звучит естественно.
- source_word: ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι
  choice: Оставайся там, пока я не скажу тебе
  rationale: Буквальное «будь там» в данном контексте означает продолжать оставаться; конструкция с ἕως ἂν задаёт неопределённый будущий предел.
- source_word: μέλλει γὰρ Ἡρῴδης ζητεῖν
  choice: потому что Ирод собирается искать
  rationale: μέλλει с инфинитивом выражает близкое намерение или предстоящее действие; «собирается» сохраняет этот оттенок.
- source_word: τοῦ ἀπολέσαι αὐτό
  choice: чтобы погубить его
  rationale: Оборот выражает цель поисков. ἀπόλλυμι буквально имеет значение «погубить, уничтожить», а в данном контексте подразумевает причинение смерти.
theological_decisions:
- issue: Определённость выражения ἄγγελος κυρίου
  choice: ангел Господа
  alternative: Ангел Господень
  rationale: Греческое выражение не имеет артикля, поэтому перевод не представляет явившегося ангела как обязательного единственного или особого «Ангела Господня»; при этом связь с Господом сохранена.
- issue: Редакционное выделение местоимений, относящихся к Иисусу
  choice: 'строчные буквы: «его»'
  alternative: 'прописные буквы: «Его»'
  rationale: Греческая графика не кодирует особого благоговейного написания местоимений. Строчная буква сохраняет нейтральность исходного текста и нормы современного русского повествования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским тоном. Синтаксис упрощён ровно настолько, чтобы речь оставалась ясной на слух; повествовательное «вот» и глагол «погубить» сохраняют выразительность греческого текста.
