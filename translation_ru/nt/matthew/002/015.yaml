  text: καὶ ἦν ἐκεῖ ἕως τῆς τελευτῆς Ἡρῴδου· ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος· Ἐξ Αἰγύπτου ἐκάλεσα τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/015.yaml
  text: and was there until the death of Herod[a], so that what was spoken by the Lord through the prophet might be fulfilled, saying[c][b], “Out of Egypt I called my son.”
translation:
  language: ru
  text: 'И оставался там до смерти Ирода, чтобы исполнилось сказанное Господом через пророка: «Из Египта Я призвал Моего сына».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: См. Ос. 11:1. У Осии эти слова первоначально относятся к Израилю как Божьему сыну; Матфей представляет возвращение Иисуса из Египта как исполнение этого места Писания.
    reason: cross_reference
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: оставался там
  rationale: Хотя буквально выражение означает «был там», в данном повествовательном контексте русский глагол «оставался» естественно передаёт продолженное пребывание, выраженное имперфектом.
- source_word: ἕως τῆς τελευτῆς Ἡρῴδου
  choice: до смерти Ирода
  rationale: τελευτή здесь обозначает смерть, конец жизни; именная конструкция точно и естественно воспроизводится по-русски.
- source_word: ἵνα πληρωθῇ
  choice: чтобы исполнилось
  rationale: Сохраняет характерную для Матфея формулу исполнения и не сводит её силу исключительно к цели либо исключительно к результату.
- source_word: τὸ ῥηθὲν ὑπὸ κυρίου διὰ τοῦ προφήτου
  choice: сказанное Господом через пророка
  rationale: Пассивная конструкция передана естественно; «Господом» указывает на первоисточник речи, а «через пророка» — на посредника.
- source_word: λέγοντος
  choice: ':'
  rationale: В современном русском двоеточие перед прямой цитатой естественнее буквального «говорящего» или тяжеловесного «который сказал», при этом функция причастия сохраняется.
- source_word: Ἐξ Αἰγύπτου
  choice: Из Египта
  rationale: Обычный и точный русский эквивалент ἐξ, сохраняющий исходное направление движения.
- source_word: ἐκάλεσα
  choice: Я призвал
  rationale: «Призвал» передаёт вызов откуда-либо и лучше соответствует контексту исхода, чем неоднозначное русское «позвал».
- source_word: τὸν υἱόν μου
  choice: Моего Сына
  rationale: Сохраняет конкретное значение υἱός и важную сыновнюю лексику цитаты; прописные буквы у местоимения и существительного отражают непосредственное применение цитаты к Иисусу в данном контексте.
theological_decisions:
- issue: Формула исполнения и цитирование Осии 11:1
  choice: Сохранить прямое утверждение Матфея об исполнении Писания без пояснения механизма исполнения в основном тексте.
  alternative: Передать цитату исключительно как прямое предсказание либо прямо назвать её типологическим повторением истории Израиля.
  rationale: Греческий текст утверждает исполнение, но сам по себе не формулирует теорию о том, каким именно образом оно осуществляется; примечание даёт необходимый ветхозаветный контекст, не снимая напряжения.
- issue: κύριος в формуле исполнения
  choice: Господь
  alternative: ГОСПОДЬ или Господь Бог
  rationale: Греческий текст содержит κύριος без добавления θεός; «Господь» точно передаёт форму SBLGNT, не добавляя отсутствующее слово.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по стилю. Формула исполнения сохранена близко к греческому тексту; громоздкое буквальное воспроизведение λέγοντος заменено нормативным двоеточием. Единственный маркер примечания [a] помещён после цитаты.
