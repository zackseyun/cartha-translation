source:
  edition: SBLGNT
  text: λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ πορεύου εἰς γῆν Ἰσραήλ, τεθνήκασιν γὰρ οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/020.yaml
  text: saying[a], “Get up, take the child and his mother, and go to the land of Israel, for those seeking the child’s life are dead.”
translation:
  language: ru
  text: 'говоря: «Встань, возьми ребёнка и его мать и отправляйся в землю Израиля, потому что те, кто искал смерти ребёнка, умерли».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ибо умерли те, кто искал жизни ребёнка». Это выражение означает: они хотели лишить ребёнка жизни.'
    reason: Сохраняет буквальную форму греческой идиомы τὴν ψυχὴν τοῦ παιδίου и поясняет её значение в контексте угрозы убийством.
lexical_decisions:
- source_word: λέγων
  choice: говоря
  rationale: Причастие настоящего времени связывает речь ангела с предыдущим стихом; русское «говоря» сохраняет эту синтаксическую связь.
- source_word: Ἐγερθεὶς
  choice: Встань
  rationale: Аористное причастие перед повелительным наклонением употреблено идиоматически; «Встань» естественно передаёт побуждение к действию.
- source_word: παράλαβε
  choice: возьми
  rationale: Здесь παραλαμβάνω означает взять кого-либо с собой; контекст ясно передаёт этот смысл без обязательного добавления «с собой».
- source_word: τὸ παιδίον
  choice: Младенца
  rationale: В повествовательном контексте речь идёт о маленьком ребёнке Иисусе; «Младенец» естественно и традиционно, хотя греческое слово само по себе может обозначать ребёнка шире.
- source_word: τὴν μητέρα αὐτοῦ
  choice: Его мать
  rationale: Точно и естественно передаёт притяжательное местоимение, относящееся к Младенцу.
- source_word: πορεύου
  choice: отправляйся
  rationale: Средний императив обозначает движение или путь; «отправляйся» в данном поручении звучит естественнее простого «иди».
- source_word: εἰς γῆν Ἰσραήλ
  choice: в землю Израиля
  rationale: Сохраняет географическое обозначение γῆ Ἰσραήλ и естественно звучит по-русски.
- source_word: τεθνήκασιν
  choice: умерли
  rationale: Перфект указывает на свершившуюся смерть с сохраняющимся результатом; по-русски «умерли» естественно выражает этот смысл.
- source_word: οἱ ζητοῦντες
  choice: те, кто искал
  rationale: Хотя форма причастия настоящего времени буквально означает «ищущие», после сообщения об их смерти русское прошедшее время естественно передаёт прекратившееся намерение.
- source_word: τὴν ψυχὴν τοῦ παιδίου
  choice: смерти Младенца
  rationale: Идиома «искать чью-либо жизнь» означает стремиться убить; «искал смерти» ясно передаёт смысл угрозы, а более формальная передача сохранена в сноске.
theological_decisions:
- issue: Значение ψυχή в контексте смертельной угрозы
  choice: смерти Младенца
  alternative: жизни Младенца
  rationale: Здесь ψυχή означает земную жизнь, а не нематериальную душу. Русская идиома «искать чьей-либо смерти» ясно выражает намерение убить, не привнося учения о душе.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Заглавные буквы в «Младенца» и «Его» служат традиционной русской референциальной ясности; синтаксис остаётся доступным обычному читателю.
