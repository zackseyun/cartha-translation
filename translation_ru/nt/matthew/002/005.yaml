  text: οἱ δὲ εἶπαν αὐτῷ· Ἐν Βηθλέεμ τῆς Ἰουδαίας· οὕτως γὰρ γέγραπται διὰ τοῦ προφήτου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/005.yaml
  text: And they said to him[a], “In Bethlehem of Judea[b], for thus it has been written through the prophet:”
translation:
  language: ru
  text: 'Они же сказали ему: «В Вифлееме Иудейском, ведь так написано через пророка:»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Они же
  rationale: Субстантивированное οἱ отсылает к первосвященникам и книжникам из предыдущего стиха; же передаёт мягкую связующую функцию δέ без усиления противопоставления.
- source_word: εἶπαν αὐτῷ
  choice: сказали ему
  rationale: Прямая и естественная передача λέγω с косвенным дополнением αὐτῷ.
- source_word: Ἐν Βηθλέεμ τῆς Ἰουδαίας
  choice: В Вифлееме Иудейском
  rationale: Родительный τῆς Ἰουδαίας уточняет, о каком Вифлееме идёт речь; русская форма с относительным прилагательным естественна и сохраняет различительную функцию определения.
- source_word: οὕτως γὰρ
  choice: ведь так
  rationale: γάρ обосновывает ответ, а οὕτως указывает вперёд на следующую цитату; сочетание «ведь так» естественно передаёт обе функции.
- source_word: γέγραπται
  choice: написано
  rationale: Русская формула «написано» идиоматично передаёт греческий перфект страдательного залога как устойчивую формулу цитирования Писания и подразумевает сохраняющуюся силу написанного.
- source_word: διὰ τοῦ προφήτου
  choice: через пророка
  rationale: διά с родительным обозначает посредничество; «через пророка» сохраняет пророка как посредника передачи, не уточняя сверх текста конечного деятеля.
theological_decisions:
- issue: Формула пророческого посредничества
  choice: через пророка
  alternative: пророком
  rationale: Вариант «через пророка» непосредственно отражает διά с родительным и сохраняет заложенную в тексте идею посредничества, не добавляя явного субъекта речи.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет краткость ответа и вводную формулу цитаты; двоеточие показывает, что пророческий текст следует в следующем стихе.
