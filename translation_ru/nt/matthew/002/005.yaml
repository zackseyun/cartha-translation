  source_fidelity: 'Текст точно передаёт все элементы греческого оригинала: οἱ δέ — «Они же», εἶπαν αὐτῷ — «сказали ему», Ἐν Βηθλέεμ τῆς Ἰουδαίας — «В Вифлееме Иудейском», а также обосновывающую формулу οὕτως γὰρ γέγραπται διὰ τοῦ προφήτου — «ведь так написано через пророка». Указательное «так» корректно направляет к следующей пророческой цитате. Видовая/результативная сила γέγραπται естественно выражена русской библейской формулой «написано».'
