  text: τότε ἐπληρώθη τὸ ῥηθὲν ⸀διὰ Ἰερεμίου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/017.yaml
  text: 'Then what was spoken through Jeremiah the prophet was fulfilled[a], saying:'
translation:
  language: ru
  text: 'Тогда исполнилось сказанное через пророка Иеремию:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Кратко и естественно передаёт временную последовательность в повествовании Матфея.
- source_word: ἐπληρώθη
  choice: исполнилось
  rationale: Сохраняет характерный для Матфея язык исполнения пророчества и пассивную форму греческого глагола.
- source_word: τὸ ῥηθὲν
  choice: сказанное
  rationale: Субстантивированное причастие естественно и точно передаётся русским причастием среднего рода.
- source_word: διὰ Ἰερεμίου τοῦ προφήτου
  choice: через пророка Иеремию
  rationale: Предлог «через» передаёт διά с родительным как указание на посредника речи; порядок слов естественен для современного русского языка.
- source_word: λέγοντος
  choice: двоеточие после вводной формулы
  rationale: Греческое причастие вводит содержание следующей цитаты. В русском языке эту функцию естественно выполняет двоеточие; буквальное «говорящего» было бы тяжеловесным и могло бы неясно соотноситься с Иеремией.
theological_decisions:
- issue: Формула исполнения пророчества у Матфея
  choice: «исполнилось сказанное»
  alternative: «произошло во исполнение сказанного»
  rationale: Выбранная формулировка прямо сохраняет утверждение Матфея об исполнении пророческого слова, не добавляя причинно-целевого оттенка, которого нет в данной форме греческого текста.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, торжественная и понятная. Двоеточие связывает стих с пророческой цитатой в следующем стихе.
