  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ νυκτὸς καὶ ἀνεχώρησεν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/014.yaml
  text: So he got up[a], took the child and his mother during the night, and departed for Egypt.
translation:
  language: ru
  text: Тогда он встал, взял ребёнка и его мать и ночью отправился в Египет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Тогда
  rationale: Слабый повествовательный союз продвигает рассказ и связывает действие Иосифа с предшествующим повелением; «тогда» естественно передаёт эту последовательность.
- source_word: ἐγερθεὶς
  choice: он встал
  rationale: Аористное причастие обозначает действие, предшествующее основному; личная форма звучит естественно в современном русском повествовании.
- source_word: παρέλαβε
  choice: взял
  rationale: В данном контексте глагол означает взять людей с собой; краткое «взял» ясно передаёт смысл в сочетании с дальнейшим движением.
- source_word: τὸ παιδίον
  choice: ребёнка
  rationale: Нейтральное современное соответствие, не добавляющее отсутствующего в греческом тексте особого акцента на возрасте.
- source_word: τὴν μητέρα αὐτοῦ
  choice: его мать
  rationale: Местоимение относится к ребёнку; русская формулировка сохраняет структуру и ясность исходного текста.
- source_word: νυκτὸς
  choice: ночью
  rationale: Родительный времени указывает, что действие происходило ночью; наречная форма естественна и точна по-русски.
- source_word: ἀνεχώρησεν
  choice: отправился
  rationale: Глагол обозначает уход или удаление к другому месту. «Отправился» передаёт целенаправленное движение, не усиливая мотив бегства сверх сказанного.
- source_word: εἰς Αἴγυπτον
  choice: в Египет
  rationale: Предлог εἰς обозначает движение к месту назначения; нормативное русское соответствие — «в Египет».
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык; повествовательная фраза проста и достойна по тону. Английская сноска не воспроизведена: её маркер стоит после «got up», тогда как текст сноски относится к варианту передачи εἰς Αἴγυπτον; в русском языке «в Египет» является прямым и естественным соответствием и не требует примечания.'
