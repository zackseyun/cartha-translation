  source_fidelity: 'Текст точно передаёт последовательность действий: Иосиф встал, взял ребёнка и его мать и отправился в Египет. «Тогда» допустимо передаёт слабый повествовательный δέ в данном контексте. «Ночью» соответствует νυκτός; его положение перед «отправился» естественно по-русски и не создаёт существенного смыслового сдвига.'
