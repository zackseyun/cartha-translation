id: MAT.2.23
reference: Matthew 2:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν κατῴκησεν εἰς πόλιν λεγομένην Ναζαρέτ, ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τῶν προφητῶν ὅτι Ναζωραῖος κληθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/023.yaml
  text: 'And he came and lived in a city called Nazareth[a], so that what was spoken through the prophets might be fulfilled: “He will be called a Nazarene.”'
translation:
  language: ru
  text: 'Придя, он поселился в городе, называемом Назарет[a], чтобы исполнилось сказанное через пророков: «Его назовут Назарянином».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Назорей». Точная пророческая основа слов «Его назовут Назарянином» остаётся предметом споров; возможно, Матфей обобщает темы нескольких пророков, а не цитирует одно конкретное место.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Придя
  rationale: Аористное причастие обозначает действие, предшествующее основному; русское деепричастие естественно и точно передаёт последовательность.
- source_word: κατῴκησεν
  choice: поселился
  rationale: Глагол κατοικέω здесь указывает на обретение места жительства. «Поселился» естественнее передаёт это значение, чем менее конкретное «жил», и не звучит архаично, как «обитал».
- source_word: εἰς πόλιν λεγομένην Ναζαρέτ
  choice: в городе, называемом Назарет
  rationale: При глаголе проживания εἰς естественно передаётся русским «в». πόλις переведено формально близким словом «город», а причастная конструкция сохранена без стилистической тяжеловесности.
- source_word: ὅπως πληρωθῇ
  choice: чтобы исполнилось
  rationale: Сохраняет целевую конструкцию и характерную для Матфея формулу исполнения пророчества, не устраняя присущую ей связь цели и результата.
- source_word: τὸ ῥηθὲν διὰ τῶν προφητῶν
  choice: сказанное через пророков
  rationale: Субстантивированное причастие естественно передано словом «сказанное»; «через» сохраняет посредническое значение διά с родительным падежом, а множественное число «пророков» — важную особенность текста.
- source_word: Ναζωραῖος
  choice: Назарянином
  rationale: В данном контексте это естественное русское обозначение человека, связанного с Назаретом. Более формальное «Назореем» оставлено в примечании из-за спорного пророческого фона выражения.
- source_word: κληθήσεται
  choice: Его назовут
  rationale: Русская неопределённо-личная конструкция естественно передаёт греческий страдательный залог и сохраняет пророческое будущее время.
theological_decisions:
- issue: Характер формулы исполнения при отсутствии одной точной ветхозаветной цитаты
  choice: Сохранить ссылку на пророков во множественном числе, не отождествляя её в основном тексте с каким-либо одним местом Писания.
  alternative: Понимать фразу как прямую ссылку на Ис 11:1, как тематическое обобщение пророчеств об уничижении Мессии или переводить Ναζωραῖος как «назирей».
  rationale: Греческий текст прямо говорит «через пророков» во множественном числе. Поэтому перевод не должен без достаточных текстовых оснований превращать формулу в цитату из одного конкретного пророка. «Назирей» обозначает иной термин и иной статус.
- issue: Передача Ναζωραῖος
  choice: Назарянин
  alternative: Назорей
  rationale: «Назарянин» ясно выражает связь с Назаретом и естественно звучит по-русски. Вариант «Назорей» формально ближе к греческой форме и может сохранять часть неоднозначности, поэтому указан в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно торжественный. Синтаксис сохраняет последовательность действий и формулу исполнения пророчества; архаизмы устранены, а реальная неоднозначность Ναζωραῖος вынесена в сноску.
