  text: καὶ πέμψας αὐτοὺς εἰς Βηθλέεμ εἶπεν· Πορευθέντες ⸂ἐξετάσατε ἀκριβῶς⸃ περὶ τοῦ παιδίου· ἐπὰν δὲ εὕρητε, ἀπαγγείλατέ μοι, ὅπως κἀγὼ ἐλθὼν προσκυνήσω αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/008.yaml
  text: And after sending them to Bethlehem[a], he said, “Go and search carefully for the child, and when you find him, report to me, so that I too may come and worship him.”
translation:
  language: ru
  text: 'И, послав их в Вифлеем, он сказал: «Пойдите и тщательно разузнайте о ребёнке. Когда найдёте его, сообщите мне, чтобы и я пришёл и поклонился ему[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воздал ему поклонение»; также возможно: «пал перед ним ниц». Греческий глагол может обозначать как поклонение, так и почтительное преклонение перед царственной особой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψας
  choice: послав
  rationale: Аористное причастие обозначает действие, предшествующее глаголу «сказал»; деепричастие естественно и кратко передаёт эту последовательность.
- source_word: Πορευθέντες
  choice: пойдите
  rationale: Причастие связано с повелением ἐξετάσατε; по-русски естественно передать его личной формой повелительного наклонения.
- source_word: ἐξετάσατε ἀκριβῶς
  choice: тщательно разузнайте
  rationale: Сочетание означает основательное и точное наведение справок. «Разузнайте» передаёт исследование и расспросы, не сводя действие лишь к физическому поиску.
- source_word: περὶ τοῦ παιδίου
  choice: о ребёнке
  rationale: Предлог περί при глаголе исследования указывает на предмет разысканий и сведений; «о ребёнке» сохраняет эту конструкцию и её смысл.
- source_word: παιδίου
  choice: ребёнке
  rationale: Нейтральное современное соответствие παιδίον без неоправданного уточнения возраста.
- source_word: ἐπὰν δὲ εὕρητε
  choice: когда найдёте
  rationale: Конструкция выражает ожидаемое условное событие; в данном поручении естественное русское «когда» не утверждает, что находка гарантирована.
- source_word: ἀπαγγείλατέ μοι
  choice: сообщите мне
  rationale: Глагол означает передать известие или донести результат; «сообщите» сохраняет оттенок обратного доклада.
- source_word: ὅπως
  choice: чтобы
  rationale: Передаёт целевое значение союза.
- source_word: κἀγὼ
  choice: и я
  rationale: 'Сохраняет включительное усиление: Ирод заявляет, что намерен сделать то же, что и волхвы.'
- source_word: ἐλθὼν προσκυνήσω αὐτῷ
  choice: пришёл и поклонился ему
  rationale: Причастие естественно координируется с личным глаголом. «Поклонился» сохраняет в русском неоднозначность между почтительным преклонением перед царём и религиозным поклонением.
theological_decisions:
- issue: Значение προσκυνήσω применительно к ребёнку Иисусу
  choice: поклонился ему
  alternative: воздал ему поклонение; пал перед ним ниц
  rationale: Греческий глагол допускает как религиозное поклонение, так и почтительное преклонение перед царственной особой. Русское «поклонился» лучше сохраняет эту намеренную лексическую широту, не устраняя богословского звучания контекста.
translation_notes:
  register: Современный литературный русский язык, ясный и dignified повествовательный стиль. «Разузнайте» выбрано вместо более канцелярского «проведите тщательное расследование», а «поклонился» сохраняет лексико-богословскую неоднозначность оригинала.
