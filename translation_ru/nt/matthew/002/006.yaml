source:
  edition: SBLGNT
  text: Καὶ σύ, Βηθλέεμ γῆ Ἰούδα, οὐδαμῶς ἐλαχίστη εἶ ἐν τοῖς ἡγεμόσιν Ἰούδα· ἐκ σοῦ γὰρ ἐξελεύσεται ἡγούμενος, ὅστις ποιμανεῖ τὸν λαόν μου τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/006.yaml
  text: And you[a], Bethlehem, land of Judah, are by no means least among the rulers of Judah[b]; for from you will come a ruler who will shepherd my people Israel.
translation:
  language: ru
  text: И ты, Вифлеем, земля Иудина, отнюдь не наименьшая среди правителей Иуды[a], потому что из тебя выйдет правитель, который будет пасти[b] мой народ, Израиль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вождей Иуды». Возможно, правители здесь представляют управляемые ими области или роды.'
    reason: lexical_alternative
  - marker: b
    text: «Пасти» здесь включает также смысл руководства и правления.
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆ Ἰούδα
  choice: земля Иудина
  rationale: Передаёт географическую принадлежность Вифлеема Иудее и сохраняет форму приложения, не сводя γῆ к почве или земле как веществу.
- source_word: οὐδαμῶς ἐλαχίστη
  choice: отнюдь не самый малый
  rationale: «Отнюдь не» сохраняет усиленное отрицание, а «самый малый» передаёт превосходную степень и контекстуальную оценку значимости.
- source_word: ἡγεμόσιν
  choice: правителей
  rationale: Прямо передаёт значение руководства и власти, не навязывая узкой должности вроде наместника. Необычное сопоставление города с правителями сохранено, а возможная метонимия пояснена в сноске.
- source_word: ἐξελεύσεται
  choice: выйдет
  rationale: Естественно сочетается с «из тебя» и близко передаёт буквальное пространственное значение ἐξέρχομαι, одновременно допуская смысл происхождения.
- source_word: ἡγούμενος
  choice: правитель
  rationale: Субстантивированное причастие обозначает того, кто ведёт и управляет; «правитель» сохраняет царственно-мессианский оттенок без добавления титула.
- source_word: ποιμανεῖ
  choice: будет пасти
  rationale: Сохраняет пастушеский образ ποιμαίνω и не сводит его только к политическому управлению; властный оттенок отмечен в сноске.
- source_word: λαόν μου τὸν Ἰσραήλ
  choice: мой народ Израиль
  rationale: Прямо и естественно передаёт заветную формулу и приложение «Израиль» без поясняющих добавлений.
theological_decisions:
- issue: Соотношение царской власти и пастырского образа в описании грядущего лица
  choice: «правитель, который будет пасти»
  alternative: «вождь, который будет править»
  rationale: Греческий текст соединяет управление и пастушество. Разные русские слова сохраняют оба измерения и не устраняют напряжение между царским и пастырским образами.
- issue: Написание обозначений грядущего правителя и местоимения Бога
  choice: 'Строчные буквы: «правитель», «мой»'
  alternative: 'Прописные буквы: «Правитель», «Мой»'
  rationale: В греческом тексте богословская капитализация не выражена; строчное написание не вносит конфессионально-редакционного толкования, при этом мессианский смысл остаётся в контексте.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис цитаты сохранён, но причинный союз передан естественным «потому что». Необычное «среди правителей Иуды» оставлено в основном тексте ради верности греческой форме и снабжено кратким пояснением.
