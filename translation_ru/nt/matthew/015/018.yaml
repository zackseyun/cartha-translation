  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τὰ δὲ ἐκπορευόμενα ἐκ τοῦ στόματος ἐκ τῆς καρδίας ἐξέρχεται, κἀκεῖνα κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/018.yaml
  text: But the things that come out of the mouth come from the heart[a], and those defile the man.
translation:
  language: ru
  text: Но то, что выходит из уст, исходит из сердца, и это оскверняет[a] человека.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «делает человека нечистым».'
    reason: Лексическая альтернатива для κοινοῖ, сохраняющая явную связь с темой чистоты и нечистоты.
lexical_decisions:
- source_word: τὰ ... ἐκπορευόμενα
  choice: то, что исходит
  rationale: Субстантивированное причастие среднего рода во множественном числе обозначает в совокупности всё исходящее из уст. Русская конструкция «то, что исходит» естественна и сохраняет обобщённый смысл.
- source_word: ἐκ τοῦ στόματος
  choice: из уст
  rationale: Передаёт телесный образ оригинала; «уста» здесь звучит достойно и естественно в библейском контексте, не будучи непонятным современному читателю.
- source_word: ἐκ τῆς καρδίας
  choice: из сердца
  rationale: «Сердце» сохраняет библейское обозначение внутреннего человека — его мыслей, намерений и нравственных побуждений — без поясняющего истолкования в основном тексте.
- source_word: ἐξέρχεται
  choice: выходит
  rationale: Сохраняет повторяющийся образ движения изнутри наружу и соответствует единственному числу греческого сказуемого при собирательно понимаемом подлежащем среднего рода множественного числа.
- source_word: κἀκεῖνα
  choice: и именно это
  rationale: Греческое κἀκεῖνα означает «и то/и те вещи» и подчёркнуто отсылает к исходящему из уст. «И именно это» ясно и естественно передаёт анафорическое и выделительное значение.
- source_word: κοινοῖ
  choice: оскверняет
  rationale: В контексте спора о чистоте глагол означает делать нечистым, осквернять. «Оскверняет» кратко сохраняет как нравственный, так и культовый оттенок; более буквальная альтернатива дана в сноске.
- source_word: τὸν ἄνθρωπον
  choice: человека
  rationale: В данном контексте ἄνθρωπος употреблено как родовое обозначение человека. Русское «человека» точно передаёт представительный единственный род и естественно включает любого человека без искусственного уточнения пола.
theological_decisions:
- issue: Источник осквернения человека
  choice: Осквернение исходит из сердца и проявляется в том, что выходит из уст.
  alternative: Понимать речь лишь как источник обрядовой нечистоты.
  rationale: Контекст противопоставляет внешнее попадание пищи в человека тому, что исходит из его внутреннего существа. Перевод сохраняет связь сердца, речи и осквернения, не сводя смысл исключительно к обрядовой категории и не расширяя его сверх текста.
- issue: Значение κοινόω в контексте чистоты
  choice: оскверняет
  alternative: делает нечистым
  rationale: Оба варианта лексически возможны. «Оскверняет» лучше сохраняет напряжение между языком ритуальной чистоты и нравственным содержанием высказывания, а прозрачная альтернатива приведена в сноске.
- issue: Родовое значение ἄνθρωπος
  choice: человека
  alternative: мужчину
  rationale: Артиклированное единственное число здесь имеет обобщённый, а не исключительно мужской смысл. Русское «человека» сохраняет грамматическое единственное число и не вносит отсутствующего ограничения по полу.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Пара «исходит — выходит» намеренно сохраняет повтор корня ἐκ- и образ движения изнутри наружу; «уста» поддерживает возвышенный, но понятный регистр.
