  text: Διὰ τί οἱ μαθηταί σου παραβαίνουσιν τὴν παράδοσιν τῶν πρεσβυτέρων; οὐ γὰρ νίπτονται τὰς χεῖρας ⸀αὐτῶν ὅταν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/002.yaml
  text: Why do your disciples break the tradition of the elders? For they do not wash their hands when they eat bread[a][b].
translation:
  language: ru
  text: Почему твои ученики нарушают предание старейшин? Ведь они не моют рук, когда едят хлеб[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Речь идёт об омовении рук, предписанном преданием старейшин, а не только об обычной гигиене.
    reason: cultural_note
  - marker: b
    text: 'Или: «когда принимают пищу»; греческое слово «хлеб» иногда может обозначать пищу или трапезу в целом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τί
  choice: Почему
  rationale: Естественная русская вопросительная форма, точно передающая вопрос о причине.
- source_word: παραβαίνουσιν
  choice: нарушают
  rationale: Передаёт нарушение авторитетного предания без излишне юридического или архаического оттенка.
- source_word: τὴν παράδοσιν
  choice: предание
  rationale: Обозначает унаследованное и передаваемое установление; «обычай» ослабило бы его авторитетный характер.
- source_word: τῶν πρεσβυτέρων
  choice: старейшин
  rationale: В контексте речь идёт о признанных авторитетах прошлого, а не просто о пожилых людях.
- source_word: νίπτονται τὰς χεῖρας αὐτῶν
  choice: не моют рук
  rationale: Естественная русская конструкция; νίπτω обозначает мытьё части тела, здесь рук.
- source_word: ὅταν
  choice: когда
  rationale: В сочетании с настоящим сослагательным выражает обычное, повторяющееся действие; по-русски это естественно передаётся словом «когда».
- source_word: ἄρτον
  choice: хлеб
  rationale: Сохраняет прямое значение греческого слова и не устраняет возможную метонимию «пища, трапеза».
- source_word: ἐσθίωσιν
  choice: едят
  rationale: Настоящее время естественно передаёт обычное действие в придаточном времени.
theological_decisions:
- issue: Характер омовения рук
  choice: В основном тексте оставить спор в рамках «предания старейшин», не называя омовение прямо ритуальным или гигиеническим.
  alternative: 'Перевести пояснительно: «не совершают обрядового омовения рук».'
  rationale: Сам стих связывает практику с преданием старейшин, но не даёт развёрнутого определения её характера; пояснение уместнее вынести в сноску.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified библейским звучанием. «Предание старейшин» сохраняет культурную и авторитетную окраску оригинала; буквальное «хлеб» оставлено в тексте, а более широкое значение отмечено в сноске.
