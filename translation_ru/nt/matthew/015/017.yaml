  verdict: revise
  source_fidelity: 'Смысл греческого текста в целом передан верно: риторический вопрос, обобщающее «всё, что входит в рот», движение в желудок и последующее удаление в ἀφεδρών сохранены. Однако «извергается» в современном русском обычно вызывает ассоциацию с рвотой или резким выбросом и потому неточно передаёт обычный процесс, описываемый в стихе. «Проходит в желудок» точнее передаёт χωρεῖ как дальнейшее прохождение содержимого.'
  naturalness: «Неужели вы не понимаете?» естественно и уместно передаёт укоризненный вопрос. Формулировка «выводится в отхожее место» литературна, физиологически ясна и не создаёт неверной ассоциации с рвотой. «Отхожее место» несколько книжно-архаично, но допустимо в достойном библейском регистре; сноска даёт понятный современный вариант.
  terminology: «Желудок» — точный выбор для κοιλία в данном контексте. «Отхожее место» адекватно ἀφεδρών; «уборная» уместна как лексический вариант в сноске. Не следует вводить в основной текст толковое утверждение об отмене пищевых предписаний, которого в этом стихе нет.
