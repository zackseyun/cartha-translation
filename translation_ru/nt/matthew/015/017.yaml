  text: ⸀οὐ νοεῖτε ὅτι πᾶν τὸ εἰσπορευόμενον εἰς τὸ στόμα εἰς τὴν κοιλίαν χωρεῖ καὶ εἰς ἀφεδρῶνα ἐκβάλλεται;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/017.yaml
  text: Do you not understand that everything entering into the mouth goes into the stomach and is expelled into the latrine?[a]
translation:
  language: ru
  text: Неужели вы не понимаете, что всё, что входит в рот, проходит в желудок и выводится в отхожее место?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…выводится в уборную»; ἀφεδρών может обозначать отхожее место, уборную или сток, связанный с ними.'
    reason: Лексическое значение ἀφεδρών допускает обозначение места испражнения; сноска сохраняет возможные русские эквиваленты без изменения основного смысла.
lexical_decisions:
- source_word: νοεῖτε
  choice: понимаете
  rationale: В данном контексте глагол обозначает умственное постижение сказанного Иисусом; «понимаете» естественно передаёт укоризненный вопрос.
- source_word: πᾶν τὸ εἰσπορευόμενον
  choice: всё, что входит
  rationale: Субстантивированное причастие среднего рода имеет обобщающий смысл и относится ко всему принимаемому в пищу.
- source_word: εἰς τὸ στόμα
  choice: в рот
  rationale: Предлог εἰς выражает движение внутрь; краткая русская формулировка точно сохраняет физический образ.
- source_word: κοιλίαν
  choice: желудок
  rationale: В контексте пищеварения κοιλία обозначает внутренний орган или пищеварительную полость; «желудок» ясно и естественно для современного читателя.
- source_word: χωρεῖ
  choice: поступает
  rationale: Здесь χωρέω описывает дальнейшее прохождение пищи; «поступает в желудок» звучит естественно и сохраняет направленность движения.
- source_word: ἀφεδρῶνα
  choice: отхожее место
  rationale: Слово обозначает место испражнения — уборную или отхожее место. Выбранный вариант точен, понятен и стилистически достоин.
- source_word: ἐκβάλλεται
  choice: извергается
  rationale: Страдательная форма описывает удаление содержимого из организма; «извергается» сохраняет силу глагола ἐκβάλλω без излишне грубой конкретизации.
theological_decisions:
- issue: Связь слов Иисуса с законами о ритуальной чистоте
  choice: Передать физиологическое утверждение прямо, не добавляя формулы об объявлении всей пищи чистой.
  alternative: Расширить перевод толкованием, согласно которому этим вся пища прямо объявляется чистой.
  rationale: Сам стих описывает пищеварительный процесс в рамках рассуждения о том, что оскверняет человека, но не содержит пояснительной формулы из Мк 7:19. Перевод не должен вносить её в текст Матфея.
translation_notes:
  register: Современный литературный русский язык с ясной, достоинственной лексикой. «Неужели» естественно передаёт укоризненный характер отрицательного вопроса; физиологическая прямота оригинала сохранена без просторечия.
