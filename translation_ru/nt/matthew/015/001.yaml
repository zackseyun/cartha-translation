lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Краткий временной указатель естественно вводит следующий эпизод и сохраняет ход повествования.
- source_word: προσέρχονται
  choice: приходят к
  rationale: Глагол передаёт движение к человеку; настоящее время сохраняет историческое настоящее греческого повествования.
- source_word: τῷ Ἰησοῦ
  choice: к Иисусу
  rationale: Дательный падеж при προσέρχομαι обозначает лицо, к которому подходят.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: из Иерусалима
  rationale: Предлог ἀπό обозначает место происхождения или отправления; перевод не добавляет предположения об официальном поручении.
- source_word: Φαρισαῖοι
  choice: фарисеи
  rationale: Устоявшееся русское наименование историко-религиозной группы.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Традиционный и узнаваемый евангельский термин; в данном контексте это знатоки и учители Закона, что пояснено в сноске.
- source_word: καὶ
  choice: и
  rationale: Сохраняет простое соединение двух групп и связь с последующим глаголом речи.
- source_word: λέγοντες
  choice: и говорят
  rationale: Естественно вводит прямую речь следующего стиха и сохраняет живое настоящее время, хотя греческая форма буквально является причастием «говоря».
theological_decisions:
- issue: Историческое настоящее
  choice: 'Сохранить настоящее время: «приходят… и говорят»'
  alternative: 'Передать прошедшим временем: «пришли… и сказали»'
  rationale: В греческом προσέρχονται стоит в историческом настоящем, а λέγοντες продолжает эту сцену; русский нарратив допускает такое настоящее и передаёт непосредственность рассказа.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельского повествования. Порядок слов «к Иисусу приходят из Иерусалима» сохраняет ясную связь места происхождения с обеими названными группами. Двоеточие естественно вводит прямую речь следующего стиха.
