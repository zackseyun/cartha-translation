id: MAT.15.14
reference: Matthew 15:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἄφετε αὐτούς· ⸂τυφλοί εἰσιν ὁδηγοὶ τυφλῶν⸃· τυφλὸς δὲ τυφλὸν ἐὰν ὁδηγῇ, ἀμφότεροι εἰς βόθυνον πεσοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/014.yaml
  text: Leave them alone[a]; they are blind guides of the blind. But if a blind man guides a blind man[c][b], both will fall into a pit.
translation:
  language: ru
  text: 'Оставьте их: они слепые поводыри слепых. Если же слепой ведёт слепого, оба упадут в яму[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в канаву»; греческое слово может обозначать также ров или углубление в земле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε αὐτούς
  choice: Оставьте их
  rationale: Императив ἄφετε здесь означает «оставьте, не трогайте», а не «простите». Краткая русская формулировка естественно передаёт повеление; подразумеваемое «в покое» ясно из контекста.
- source_word: τυφλοί
  choice: слепые
  rationale: Сохранена метафора духовной неспособности видеть и понимать без поясняющей вставки в основной текст.
- source_word: ὁδηγοὶ τυφλῶν
  choice: поводыри слепых
  rationale: «Поводырь» точно сохраняет образ человека, ведущего незрячего, и естественно сочетается с последующим условным высказыванием.
- source_word: τυφλὸς ... τυφλὸν
  choice: слепой ... слепого
  rationale: Субстантивированные прилагательные передают лаконичную форму греческой пословицы. Мужской род в русском здесь имеет обобщающий смысл.
- source_word: δὲ
  choice: же
  rationale: Частица «же» естественно отмечает переход к поясняющему предупреждению, не создавая чрезмерно резкого противопоставления.
- source_word: ἐὰν ὁδηγῇ
  choice: если ... ведёт
  rationale: Условная конструкция имеет общий, повторяемый смысл; настоящее время в русском естественно для пословичного утверждения.
- source_word: ἀμφότεροι
  choice: оба
  rationale: Прямо и кратко передаёт, что падение постигнет обоих участников.
- source_word: εἰς βόθυνον
  choice: в яму
  rationale: βόθυνος может обозначать яму, ров или канаву. «Яма» — широкое и наглядное соответствие, уместное в современном литературном русском.
- source_word: πεσοῦνται
  choice: упадут
  rationale: Естественно передаёт будущий результат общего условия.
theological_decisions:
- issue: Метафорический смысл слепоты
  choice: Сохранить слово «слепые» без толкования в основном тексте.
  alternative: «духовно слепые» или «невежественные вожди»
  rationale: Греческий текст выражает мысль посредством образа; пояснение сузило бы его смысл и ослабило бы риторическую силу.
- issue: Обобщающий мужской род в пословице
  choice: «слепой ведёт слепого»
  alternative: «один слепой человек ведёт другого»
  rationale: Русская форма естественно воспроизводит грамматически мужской единственный род греческого текста и воспринимается как обобщающая, а не как ограниченная только мужчинами.
- issue: Характер связи между двумя высказываниями
  choice: «Если же»
  alternative: «Но если»
  rationale: δέ допускает мягкое противопоставление или развитие мысли. «Же» здесь сохраняет связь с предшествующей характеристикой поводырей и вводит её следствие без усиления контраста.
translation_notes:
  register: Современный литературный русский с сохранением краткости и пословичной образности оригинала. «Поводыри» предпочтено более общему «вожди», поскольку оно поддерживает буквальный образ слепого, ведущего слепого. Пунктуация разделяет повеление и его обоснование, не добавляя отсутствующих в греческом пояснений.
