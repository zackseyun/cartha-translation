  verdict: approve
  source_fidelity: 'Текст точно передаёт греческий оригинал: «Оставьте их» соответствует ἄφετε αὐτούς в значении «оставьте/не вмешивайтесь»; образ «слепые поводыри слепых» сохранён без интерпретирующего раскрытия; условная пословичная конструкция и будущее следствие («оба упадут») воспроизведены верно. «В яму» является допустимым основным соответствием βόθυνος.'
  naturalness: Формулировка краткая, ясная и литературно естественная для современного русского. «Слепые поводыри слепых» сохраняет намеренно парадоксальный образ оригинала; «Если же слепой ведёт слепого» звучит как обобщённое пословичное высказывание.
  terminology: «Поводыри» удачно сохраняет конкретный образ ὁδηγοί, не заменяя его интерпретирующим «вожди» или «лидеры». «Слепые» оставлено метафорой, как в оригинале. Сноска к «яме» корректно отмечает допустимый вариант «канава» и не утверждает излишней лексической определённости.
