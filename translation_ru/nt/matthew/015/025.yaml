lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Частица обозначает мягкое противопоставление предшествующим словам Иисуса и подчёркивает настойчивость женщины.
- source_word: ἐλθοῦσα
  choice: она подошла
  rationale: Аористное причастие естественно передано личной формой; глагол сохраняет движение женщины к Иисусу.
- source_word: προσεκύνει αὐτῷ
  choice: преклонила перед Ним колени
  rationale: Глагол может означать земной поклон, выражение почтения или поклонение. Основной вариант ясно передаёт телесный жест благоговения, не определяя однозначно его богословский смысл.
- source_word: λέγουσα
  choice: и сказала
  rationale: Причастие вводит прямую речь и в современном русском естественно передаётся личной формой.
- source_word: Κύριε
  choice: Господи
  rationale: Традиционная и естественная русская звательная форма обращения κύριε к Иисусу, сохраняющая весомость титула и возможную смысловую глубину.
- source_word: βοήθει μοι
  choice: помоги мне
  rationale: Краткая форма повелительного наклонения передаёт прямоту и настоятельность просьбы.
theological_decisions:
- issue: Значение προσκυνέω по отношению к Иисусу
  choice: преклонила перед Ним колени
  alternative: поклонилась Ему
  rationale: Греческий глагол допускает как жест почтения, так и поклонение в религиозном смысле. Основной текст передаёт наблюдаемое телесное действие, а примечание сохраняет более сильный и богословски значимый вариант.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и эмоционально напряжённая. Местоимение «Ним» написано с прописной буквы в соответствии с распространённой русской библейской издательской практикой; восклицательный знак естественно передаёт настоятельность мольбы.
