  source_fidelity: 'Текст точно передаёт основные элементы греческого оригинала: δέ («Но») сохраняет оттенок поворота; ἐλθοῦσα естественно передано как «она подошла»; просьба «Господи, помоги мне» верно отражает Κύριε, βοήθει μοι. «Преклонила перед Ним колени» является допустимым контекстуальным способом передать προσεκύνει αὐτῷ, не навязывая богословское истолкование. Хотя греческий имперфект может оттенять продолжающееся действие, русская совершенная форма в последовательном повествовании здесь не искажает смысла.'
