  text: ⸂Ὁ λαὸς οὗτος⸃ τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/008.yaml
  text: This people honors me with their lips[a], but their heart is far from me.
translation:
  language: ru
  text: Этот народ чтит Меня устами, но сердце их далеко от Меня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ λαὸς οὗτος
  choice: Этот народ
  rationale: Сохраняет указательное οὗτος и коллективное значение λαός, а также естественно звучит в пророческой цитате.
- source_word: τοῖς χείλεσίν
  choice: устами
  rationale: Творительный падеж передаёт инструментальный дательный и сохраняет конкретный телесный образ; «устами» уместно в современном литературном библейском регистре.
- source_word: με
  choice: Меня
  rationale: Прямое дополнение при τιμᾷ; прописная буква соответствует принятому русскому оформлению местоимений, относящихся к Богу.
- source_word: τιμᾷ
  choice: чтит
  rationale: Точно передаёт значение проявления почтения и естественно сочетается с «устами».
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: но сердце их
  rationale: Сохраняет единственное число καρδία и коллективный образ внутреннего состояния всего народа; δέ передано противительным «но».
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: далеко от Меня
  rationale: Кратко и естественно передаёт пространственную метафору и подразумеваемое ею отчуждение, не усиливая толкование.
theological_decisions:
- issue: Коллективное единственное число «сердце» или распределительное множественное
  choice: 'Сохранить единственное число: «сердце их»'
  alternative: «их сердца»
  rationale: Греческое καρδία стоит в единственном числе и изображает народ как единое целое с общим внутренним расположением. Русская конструкция «сердце их» сохраняет эту риторическую особенность и остаётся понятной.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой цитаты. Формулировка «чтит Меня устами» сохраняет образность оригинала без архаизации; порядок «сердце их» выбран ради коллективного единственного числа и возвышенного, но понятного звучания.
