base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/015.yaml
  text: But Peter answered and said to him[a], “Explain this parable to us.”
translation:
  language: ru
  text: 'Пётр же сказал ему в ответ: «Объясни нам эту притчу».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Расскажи нам эту притчу»; или: «Разъясни нам эту притчу».'
    reason: Лексема φράζω допускает оттенки сообщения и прояснения смысла.
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: Пётр же сказал ему в ответ
  rationale: Греческая конструкция буквально сочетает причастие «ответив» с глаголом «сказал». Русское «сказал в ответ» естественно передаёт значение всей конструкции, а частица «же» отмечает переход в повествовании без чрезмерно сильного противопоставления.
- source_word: Φράσον
  choice: Объясни
  rationale: Императив от φράζω здесь означает сделать смысл понятным, разъяснить; «объясни» естественно соответствует просьбе истолковать образное высказывание.
- source_word: ἡμῖν
  choice: нам
  rationale: Дательный местоимения обозначает адресатов объяснения и естественно передаётся формой «нам».
- source_word: τὴν παραβολὴν ταύτην
  choice: эту притчу
  rationale: «Притча» сохраняет устойчивую евангельскую терминологию παραβολή, хотя в данном контексте речь может идти шире — об образном изречении; «эту» указывает на непосредственно предшествующие слова.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Греческая формула «ответив, сказал» передана естественным русским оборотом «сказал в ответ»; постпозитивное «же» сохраняет связность повествования.
