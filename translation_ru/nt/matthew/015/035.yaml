  source_fidelity: '«И, велев народу расположиться на земле» точно передаёт последовательность действий: деепричастие «велев» соответствует предшествующему аористному причастию παραγγείλας, адресат и повелительное содержание сохранены. «Расположиться» уместно передаёт ἀναπεσεῖν, не закрепляя спорно точную позу, а «на земле» верно отражает ἐπὶ τὴν γῆν.'
