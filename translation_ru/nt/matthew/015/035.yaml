  text: And after instructing the crowd to recline on the ground,[a]
translation:
  language: ru
  text: И, велев народу расположиться на земле,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сесть на землю». Греческий глагол может означать, что люди занимают места для еды, часто полулёжа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой повествовательный союз естественно связывает это действие с предшествующим контекстом.
- source_word: παραγγείλας
  choice: велев
  rationale: Деепричастная форма передаёт предшествующее действие аористного причастия и сохраняет распорядительную силу глагола без излишне резкого оттенка.
- source_word: τῷ ὄχλῳ
  choice: народу
  rationale: В данном повествовательном контексте это естественное современное обозначение собравшихся людей; дательный падеж указывает адресата распоряжения.
- source_word: ἀναπεσεῖν
  choice: расположиться
  rationale: Глагол обозначает принятие места и позы для трапезы, обычно сидя или полулёжа; «расположиться» звучит естественно по-русски и не навязывает одну точную позу.
- source_word: ἐπὶ τὴν γῆν
  choice: на земле
  rationale: Здесь γῆ означает поверхность земли, на которой размещается народ, а не мир или сушу в более широком смысле.
