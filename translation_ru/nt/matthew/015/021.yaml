  yaml_path: translation/nt/matthew/015/021.yaml
  text: And Jesus went out from there and withdrew to the region of Tyre and Sidon[a].
translation:
  language: ru
  text: И, выйдя оттуда, Иисус удалился в область Тира и Сидона.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отправился в пределы Тира и Сидона». Греческий глагол можно передать более нейтрально, однако «удалился» отражает его характерное употребление у Матфея.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Простой повествовательный союз сохраняет связь с предшествующим эпизодом и естественный ход греческого текста.
- source_word: ἐξελθὼν
  choice: выйдя
  rationale: Деепричастие естественно передаёт аористное причастие и обозначает действие, предшествующее основному глаголу.
- source_word: ἐκεῖθεν
  choice: оттуда
  rationale: Краткий и естественный русский эквивалент наречия, указывающего на отправную точку.
- source_word: ἀνεχώρησεν
  choice: удалился
  rationale: Передаёт характерное для Матфея значение ухода или отступления, не приписывая Иисусу прямо не названной причины и не усиливая смысл до «отступил» или «бежал».
- source_word: εἰς τὰ μέρη
  choice: в область
  rationale: Идиоматично обозначает движение в местность, связанную с названными городами, не утверждая непременно, что Иисус вошёл в сами города.
- source_word: Τύρου καὶ Σιδῶνος
  choice: Тира и Сидона
  rationale: Родительный падеж естественно связывает область с двумя финикийскими городами; употреблены традиционные русские формы топонимов.
theological_decisions:
- issue: Оттенок движения Иисуса в местность, связанную с язычниками
  choice: Передать ἀνεχώρησεν словом «удалился», не уточняя мотив.
  alternative: Более нейтральное «отправился» или более сильное «отступил».
  rationale: Глагол может подразумевать намеренный уход, особенно в словоупотреблении Матфея, однако причина движения в стихе не названа. «Удалился» сохраняет этот оттенок, не разрешая неоднозначность.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и повествовательный. «Область» понятно обычному читателю и сохраняет географическую обобщённость τὰ μέρη; «удалился» звучит достойно и не перегружено архаикой.
