  text: ἡ δὲ εἶπεν· Ναί, κύριε, καὶ γὰρ τὰ κυνάρια ἐσθίει ἀπὸ τῶν ψιχίων τῶν πιπτόντων ἀπὸ τῆς τραπέζης τῶν κυρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/027.yaml
  text: She said[a], “Yes, Lord[b], for even the little dogs eat from the crumbs that fall from their masters’ table.”
translation:
  language: ru
  text: 'Она сказала: «Да, Господи[b], ведь даже собачки[a] едят крошки, падающие со стола их хозяев».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собаки», «домашние собаки» или «щенки»; в греческом употреблена уменьшительная форма, вероятно указывающая на небольших домашних собак.'
    reason: lexical_alternative
  - marker: b
    text: Слово «Господи» можно понять и как почтительное обращение «господин», однако перевод сохраняет обычную для Евангелий передачу греческого κύριος.
    reason: alternative_reading
lexical_decisions:
- source_word: Ναί
  choice: Да
  rationale: Прямой и естественный ответ согласия; сохраняет то, что женщина принимает исходный образ и развивает его.
- source_word: κύριε
  choice: Господи
  rationale: Обычная форма прямого обращения к Иисусу в евангельском контексте; при этом греческое слово допускает и уважительное обращение без обязательного полного богословского смысла.
- source_word: καὶ γὰρ
  choice: ведь даже
  rationale: '«Ведь» передаёт обоснование, а «даже» — присоединительно-усилительный оттенок: женщина подтверждает свою мысль ссылкой на место собачек в приведённом образе.'
- source_word: κυνάρια
  choice: собачки
  rationale: Уменьшительная форма сохраняет греческий оттенок небольших, вероятно домашних, собак, не превращая его ни в нейтральное «собаки», ни в более узкое «щенки».
- source_word: ἐσθίει
  choice: едят
  rationale: При среднем роде множественного числа в греческом допустим глагол в единственном числе; по-русски требуется естественное согласование во множественном числе.
- source_word: ψιχίων
  choice: крошки
  rationale: Точно и естественно передаёт мелкие кусочки пищи в образе трапезы.
- source_word: τῶν πιπτόντων
  choice: падающие
  rationale: Причастный оборот кратко и естественно сохраняет значение настоящего причастия, относящегося к крошкам.
- source_word: τραπέζης
  choice: стола
  rationale: Прямое значение слова и центральная деталь бытового образа.
- source_word: τῶν κυρίων αὐτῶν
  choice: их хозяев
  rationale: Внутри образа слово обозначает владельцев домашних собак; «хозяев» естественно по-русски и сохраняет отношение принадлежности и власти.
theological_decisions:
- issue: Передача κύριε в обращении к Иисусу
  choice: Господи
  alternative: господин / сударь
  rationale: «Господи» сохраняет обычное евангельское обращение и возможную богословскую глубину, однако сноска отмечает, что в данном месте слово может быть понято и как почтительное обращение.
- issue: Передача уменьшительной формы κυνάρια
  choice: собачки
  alternative: собаки / домашние собаки / щенки
  rationale: Так сохраняется реальная уменьшительная форма греческого слова и не усиливается резкость метафоры; вместе с тем перевод не сужает значение до «щенков» и не устраняет напряжённость образа.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. «Ведь даже» естественно выражает объяснительную и усилительную силу καὶ γὰρ. Уменьшительное «собачки» сохраняет оттенок оригинала без излишней сентиментальности; «хозяева» естественно для бытового образа.
