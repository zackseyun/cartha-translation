    text: 'Или: «богохульство». Греческое слово может означать как злословие или клевету на людей, так и хулу на Бога — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ γὰρ τῆς καρδίας
  choice: Ведь из сердца
  rationale: «Ведь» естественно передаёт пояснительную силу γάρ, а «из сердца» сохраняет ἐκ и библейский образ сердца как источника нравственных решений и поступков.
- source_word: ἐξέρχονται
  choice: исходят
  rationale: Передаёт движение наружу и происхождение перечисленных зол из сердца; литературно и понятно в данном контексте.
- source_word: διαλογισμοὶ πονηροί
  choice: злые помыслы
  rationale: «Помыслы» охватывают мысли, рассуждения и намерения, не сужая значение до заранее продуманных козней.
- source_word: φόνοι
  choice: убийства
  rationale: Прямой современный эквивалент, сохраняющий множественное число и нравственную определённость греческого слова.
- source_word: μοιχεῖαι
  choice: супружеские измены
  rationale: Естественная современная передача нарушения супружеской верности; множественное число сохранено.
- source_word: πορνεῖαι
  choice: разврат
  rationale: В данном перечне собирательное русское существительное естественно обозначает широкий круг недозволенных половых отношений, не ограничивая слово только добрачной связью.
- source_word: κλοπαί
  choice: кражи
  rationale: Краткий и точный эквивалент с сохранением формы перечня.
- source_word: ψευδομαρτυρίαι
  choice: лжесвидетельства
  rationale: Сохраняет свидетельско-правовой оттенок и множественное число исходного слова.
- source_word: βλασφημίαι
  choice: злословие
  rationale: Греческое слово может обозначать порочащую или оскорбительную речь о людях, а также хулу на Бога. «Злословие» лучше сохраняет общий смысл в перечне человеческих пороков; возможное значение «богохульство» отмечено в сноске.
theological_decisions:
- issue: Объём значения βλασφημίαι в перечне пороков
  choice: злословие
  alternative: богохульство (хула)
  rationale: Контекст прямо не называет адресата речи, поэтому основной текст не ограничивает её только оскорблением Бога. Сноска сохраняет богословски значимую альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Перечень передан ритмично и без архаизмов; метафора сердца сохранена.
