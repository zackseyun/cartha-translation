  text: For out of the heart come evil thoughts[a], murders, adulteries, sexual immoralities, thefts, false testimonies, and blasphemies.
translation:
  language: ru
  text: Ведь из сердца исходят злые помыслы, убийства, супружеские измены, разврат, кражи, лжесвидетельства и злословие[a].
