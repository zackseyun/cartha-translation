  text: But he said[a], “Are you also still without understanding?”
translation:
  language: ru
  text: 'Но Он сказал: «Неужели и вы всё ещё не понимаете?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт мягкий контраст и переход к ответу Иисуса; в данном контексте естественнее русского «и».
- source_word: ὁ … εἶπεν
  choice: Он сказал
  rationale: Артикль употреблён местоименно и указывает на Иисуса; аорист εἶπεν передан обычной повествовательной формой.
- source_word: Ἀκμὴν
  choice: всё ещё
  rationale: Передаёт значение продолжающегося состояния — «до сих пор, всё ещё» — без неестественного удвоения временных наречий.
- source_word: καὶ ὑμεῖς
  choice: и вы
  rationale: 'Сохраняет включающий и слегка усилительный смысл: даже ученики остаются среди тех, кто не понимает.'
- source_word: ἀσύνετοί ἐστε
  choice: не понимаете
  rationale: Естественно передаёт недостаток понимания в данном контексте, не усиливая упрёк до морального обвинения в глупости.
theological_decisions:
- issue: Тон упрёка Иисуса ученикам
  choice: «Неужели и вы всё ещё не понимаете?»
  alternative: «Неужели и вы всё ещё неразумны?»
  rationale: Вопрос сохраняет явный упрёк и удивление продолжающимся непониманием учеников, но не превращает характеристику ἀσύνετοι в более суровое осуждение их личности.
translation_notes:
  register: Современный литературный русский язык; фраза звучит естественно и достойно. «Неужели» передаёт риторический и укоризненный оттенок вопроса, а «всё ещё» выражает Ἀκμήν.
