  - marker: b
    text: То есть предыдущее высказывание Иисуса.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественная повествовательная связка, передающая последовательность событий.
- source_word: προσελθόντες οἱ μαθηταὶ λέγουσιν αὐτῷ
  choice: ученики подошли к Нему и сказали
  rationale: Деепричастная конструкция и историческое настоящее переданы естественной русской повествовательной формой прошедшего времени.
- source_word: Οἶδας
  choice: Знаешь ли Ты
  rationale: Прямо передаёт вопрос, не добавляя более интерпретирующего оттенка «понимаешь ли».
- source_word: ἀκούσαντες τὸν λόγον
  choice: услышав эти слова
  rationale: В данном контексте λόγος обозначает предыдущее высказывание Иисуса; русское множественное «слова» звучит естественнее буквального «слово».
- source_word: ἐσκανδαλίσθησαν
  choice: возмутились
  rationale: Передаёт отрицательную реакцию фарисеев в данном контексте и сохраняет возможность оттенка «сочли соблазнительным», отмеченного в сноске.
theological_decisions:
- issue: Значение σκανδαλίζω в реакции фарисеев
  choice: возмутились
  alternative: соблазнились; были соблазнены; оскорбились
  rationale: Контекст описывает резкую отрицательную реакцию на слова Иисуса. «Возмутились» естественно по-русски и не превращает стих в утверждение об отпадении или нравственном падении; более буквальный образ сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык; достоинство библейского повествования сохранено без архаизации. Местоимения, относящиеся к Иисусу, написаны с прописной буквы по принятой русской библейской традиции.
