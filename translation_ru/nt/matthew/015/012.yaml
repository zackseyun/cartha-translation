base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/012.yaml
  text: Then the disciples came and said to him[b][a], “Do you know that the Pharisees were offended when they heard this word?”
translation:
  language: ru
  text: 'Тогда ученики подошли к Нему и сказали: «Знаешь ли Ты, что фарисеи, услышав эти слова[b], оскорбились[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возмутились»; буквальнее: «соблазнились».'
