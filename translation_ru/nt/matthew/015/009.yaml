  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/009.yaml
  text: But they worship me in vain[b][a], teaching as doctrines the commandments of men.
translation:
  language: ru
  text: Но тщетно они поклоняются Мне, преподавая человеческие предписания как учение.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «преподавая человеческие предписания как учения».'
    reason: alternative_reading
lexical_decisions:
- source_word: μάτην
  choice: тщетно
  rationale: Передаёт значение «напрасно, без пользы» и сохраняет торжественно-обличительный тон цитаты.
- source_word: δὲ
  choice: но
  rationale: Выражает лёгкое противопоставление и соответствует обличительному контексту.
- source_word: σέβονταί με
  choice: они поклоняются Мне
  rationale: σέβομαι при объекте, относящемся к Богу, естественно означает религиозное почитание, поклонение.
- source_word: διδάσκοντες
  choice: преподнося
  rationale: Причастие обозначает сопутствующий образ действия; «преподнося» естественно связывает тщетность поклонения с тем, чему и с каким статусом они учат.
- source_word: διδασκαλίας
  choice: как учение
  rationale: Предикативная передача показывает, что человеческим предписаниям придают статус авторитетного учения, не устраняя сжатости греческой конструкции.
- source_word: ἐντάλματα
  choice: предписания
  rationale: Слово обозначает установленные требования или заповеди; «предписания» сохраняет религиозно-нормативный смысл без смешения с Божьими заповедями.
- source_word: ἀνθρώπων
  choice: человеческие
  rationale: В данном контексте это родовое обозначение человеческого происхождения в противопоставлении божественному, а не указание на мужской пол.
theological_decisions:
- issue: Связь διδασκαλίας и ἐντάλματα ἀνθρώπων
  choice: преподнося человеческие предписания как учение
  alternative: уча учениям — человеческим предписаниям
  rationale: 'Основной вариант ясно передаёт наиболее вероятный смысл: предписания человеческого происхождения преподаются с авторитетом учения. Сноска сохраняет более буквальную и синтаксически сжатую возможность.'
- issue: Родовое значение ἀνθρώπων
  choice: человеческие
  alternative: людей
  rationale: Прилагательное естественно для современного русского языка и точно подчёркивает противопоставление человеческого происхождения божественному, не привнося гендерного значения.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. «Тщетно» сохраняет пророческий тон; «Мне» написано с прописной буквы по устойчивой русской библейской традиции. Порядок слов остаётся естественным, а сжатость греческой фразы поясняется только минимально.
