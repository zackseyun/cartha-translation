lexical_decisions:
- source_word: οὐ μὴ τιμήσει
  choice: тот уже может не почитать
  rationale: Усиленное отрицание οὐ μή в контексте переданного постановления означает снятие обязанности; «может не почитать» естественно передаёт разрешительный смысл, а «уже» подчёркивает освобождение от долга.
- source_word: τὸν πατέρα αὐτοῦ
  choice: своего отца
  rationale: Сохранено единственное число и прямо названный в греческом тексте отец без гармонизации с более широким контекстом.
- source_word: ἠκυρώσατε
  choice: упразднили
  rationale: Глагол означает лишить силы, сделать недействительным; «упразднили» сохраняет резкость обвинения и звучит естественно в современном литературном русском.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: слово Бога
  rationale: Перевод следует чтению SBLGNT λόγον, а не варианту ἐντολήν; конструкция «слово Бога» ясна и не вносит конфессионально окрашенной формулы.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: ради вашего предания
  rationale: διά с винительным здесь указывает на основание или то, чему отдано предпочтение; «ради» хорошо передаёт мысль, что Божье слово лишили силы в угоду их преданию.
theological_decisions:
- issue: Следует ли прямо выразить материальную поддержку родителей в значении τιμάω
  choice: Сохранить «почитать» в основном тексте и пояснить практический смысл в сноске.
  alternative: Перевести «содержать» или «заботиться».
  rationale: Глагол сохраняет связь с заповедью о почитании родителей, тогда как контекст позволяет услышать и обязанность практической, в том числе материальной, заботы.
- issue: Следует ли гармонизировать стих с контекстом или вариантным чтением
  choice: Передать «своего отца» и «слово Бога» по тексту SBLGNT.
  alternative: Расширить до «отца или мать» и/или принять чтение «заповедь Бога».
  rationale: Перевод следует указанному греческому тексту; значимый текстовый вариант вынесен в сноску.
translation_notes:
  register: Современный литературный русский язык с достойным, общедоступным звучанием. Начальное «тот» связывает фразу с условием предыдущего стиха. Маркеры сносок помещены непосредственно после соответствующих выражений.
