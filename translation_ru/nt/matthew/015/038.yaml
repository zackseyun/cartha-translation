  yaml_path: translation/nt/matthew/015/038.yaml
  text: Those who had eaten were four thousand men[a], besides women and children.
translation:
  language: ru
  text: А тех, кто ел, было четыре тысячи мужчин, не считая женщин и детей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: Евших же
  rationale: Субстантивированное причастие передаёт группу тех, кто ел; постпозитивное «же» естественно сохраняет мягкую связующую функцию δέ, не усиливая её до резкого противопоставления.
- source_word: ἦσαν
  choice: было
  rationale: Простая связка при указании численности; форма единственного числа естественна в русской конструкции с количественным сочетанием «четыре тысячи».
- source_word: τετρακισχίλιοι
  choice: четыре тысячи
  rationale: Прямое соответствие греческому количественному числительному.
- source_word: ἄνδρες
  choice: мужчин
  rationale: ἀνήρ здесь обозначает именно мужчин, а не людей вообще; это подтверждается отдельным упоминанием женщин и детей.
- source_word: χωρὶς
  choice: не считая
  rationale: В данном контексте χωρίς указывает, что женщины и дети не входят в названное число; «не считая» ясно и естественно выражает эту мысль.
- source_word: γυναικῶν καὶ παιδίων
  choice: женщин и детей
  rationale: Передаёт обе отдельно названные группы без необоснованного сужения γυνή до «жён» или παιδίον до «маленьких детей».
theological_decisions:
- issue: Указание пола в формуле подсчёта
  choice: Сохранить «мужчин» и отдельно упомянуть женщин и детей.
  alternative: Передать ἄνδρες как «людей».
  rationale: Греческий текст проводит явное различие между мужчинами, вошедшими в число четырёх тысяч, и дополнительно упомянутыми женщинами и детьми. Обобщение «людей» стёрло бы это различие.
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная формулировка сохраняет порядок и акцент исходного текста. «Евших» в данном контексте естественно относится к участникам только что завершившейся трапезы.
