id: MAT.15.22
reference: Matthew 15:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ Χαναναία ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα ⸀ἔκραζεν λέγουσα· Ἐλέησόν με, κύριε ⸀υἱὸς Δαυίδ· ἡ θυγάτηρ μου κακῶς δαιμονίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/022.yaml
  text: And behold[a], a Canaanite woman from those regions came out and was crying out, saying, “Have mercy on me, Lord, Son of David; my daughter is badly demon-possessed.”
translation:
  language: ru
  text: 'И вот, женщина-хананеянка, выйдя из тех краёв, кричала: «Помилуй меня, Господи, Сын Давида! Мою дочь жестоко мучит бес[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моя дочь тяжело одержима бесом».'
    reason: 'Лексическая альтернатива для δαιμονίζεται: греческий глагол указывает на власть или воздействие беса, не определяя точнее характер состояния.'
lexical_decisions:
- source_word: ἰδοὺ
  choice: И вот
  rationale: Сохраняет функцию указательного повествовательного маркера и живость внезапного появления женщины, оставаясь естественным для современного русского рассказа.
- source_word: Χαναναία
  choice: женщина-хананеянка
  rationale: Передаёт именно формулировку Матфея и связанные с ней исторические ассоциации; обозначение «сирофиникиянка» из параллельного места у Марка сюда не переносится.
- source_word: ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα
  choice: выйдя из тех краёв
  rationale: Естественно передаёт причастную конструкцию и территориальное значение ὅρια, сохраняя указание на упомянутую местность.
- source_word: ἔκραζεν
  choice: кричала
  rationale: Несовершенный вид русского глагола передаёт продолжительное или повторяющееся действие, выраженное греческим имперфектом.
- source_word: Ἐλέησόν με
  choice: Помилуй меня
  rationale: Устоявшаяся, ясная и стилистически достойная передача настойчивой просьбы о милости.
- source_word: κύριε
  choice: Господи
  rationale: Форма звательного обращения естественно передаёт κύριε; рядом с титулом «Сын Давида» она сохраняет возможную почтительную и мессианскую силу обращения.
- source_word: υἱὸς Δαυίδ
  choice: Сын Давида
  rationale: Буквально и понятно сохраняет давидический мессианский титул без его истолкования внутри текста.
- source_word: κακῶς δαιμονίζεται
  choice: Мою дочь жестоко мучит бес
  rationale: Передаёт тяжесть состояния и явную бесовскую обусловленность естественным русским языком, не уточняя сверх греческого текста точный характер власти беса над девочкой.
theological_decisions:
- issue: Сила обращения κύριε в сочетании с «Сын Давида»
  choice: Господи
  alternative: господин
  rationale: Сочетание с мессианским титулом допускает более глубокий смысл, чем простая вежливость. «Господи» сохраняет эту возможность, но само по себе не приписывает женщине полностью разработанного исповедания.
- issue: Характер состояния, обозначенного δαιμονίζεται
  choice: Мою дочь жестоко мучит бес
  alternative: моя дочь тяжело одержима бесом
  rationale: Глагол несомненно указывает на бесовское воздействие, но не описывает его механизм с той точностью, которую современный читатель может вкладывать в слово «одержима». Основной текст сохраняет бесовскую причинность и тяжесть мучения, а традиционная передача дана в сноске.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис сделан естественным: λέγουσα передано двоеточием, а имперфект сохранён формой «кричала». Обращения оформлены ясно и торжественно, без архаизма «Сын Давидов».'
