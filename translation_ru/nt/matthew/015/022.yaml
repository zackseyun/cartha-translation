  source_fidelity: 'Текст точно передаёт основные элементы греческого оригинала: указательный маркер «И вот», этноним «хананеянка», исход из тех мест, длительное/повторяющееся «кричала», обращение «Господи, Сын Давида» и тяжесть бесовского мучения дочери. Формулировка «жестоко мучит бес» адекватно передаёт κακῶς δαιμονίζεται, не утверждая сверх текста конкретный характер этого состояния.'
