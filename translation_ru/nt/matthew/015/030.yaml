translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное. Субстантивированные обозначения сохранены там, где они устойчивы и нейтральны в библейском повествовании («слепых», «хромых»), а для κυλλούς выбрана более уважительная описательная формулировка. Лексическая неоднозначность κωφούς не устранена молча, а отмечена в сноске.
