  text: καὶ προσῆλθον αὐτῷ ὄχλοι πολλοὶ ἔχοντες μεθ’ ἑαυτῶν ⸂κωφούς, τυφλούς, χωλούς, κυλλούς⸃, καὶ ἑτέρους πολλούς, καὶ ἔρριψαν αὐτοὺς παρὰ τοὺς πόδας ⸀αὐτοῦ, καὶ ἐθεράπευσεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/030.yaml
  text: And large crowds came to him[a], bringing with them the mute, the blind, the lame, the crippled, and many others, and they laid them at his feet[b], and he healed them.
translation:
  language: ru
  text: К Нему подошли большие толпы людей, приведя с собой немых[a], слепых, хромых, людей с увечьями[b] и многих других. Их положили у Его ног, и Он исцелил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глухих». Греческое слово κωφούς в зависимости от контекста может обозначать людей, которые не слышат, не говорят или имеют оба нарушения.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «людей с повреждёнными или недействующими конечностями». Греческое слово κυλλούς имеет широкий смысл и может указывать на увечье, деформацию или нарушение функции конечностей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: К Нему подошли
  rationale: Передаёт направленное приближение к Иисусу естественным русским повествовательным оборотом.
- source_word: ὄχλοι πολλοὶ
  choice: большие толпы людей
  rationale: Сохраняет множественное число ὄχλοι и естественно передаёт многочисленность собравшихся.
- source_word: ἔχοντες μεθ’ ἑαυτῶν
  choice: приведя с собой
  rationale: 'Контекстуально раскрывает буквальное «имея с собой»: толпы доставили к Иисусу нуждавшихся в исцелении людей.'
- source_word: κωφούς
  choice: глухонемых
  rationale: κωφός может обозначать глухого, немого либо человека с обоими нарушениями; основной текст компактно отражает широкий традиционный смысл, а примечание сохраняет лексическую неоднозначность.
- source_word: τυφλούς
  choice: слепых
  rationale: Прямое и общепонятное соответствие τυφλούς.
- source_word: χωλούς
  choice: хромых
  rationale: Точное, краткое и устойчивое соответствие χωλούς в перечне исцеляемых.
- source_word: κυλλούς
  choice: людей с увечьями
  rationale: κυλλός указывает на повреждённые, деформированные или недействующие конечности; описательное обозначение точно и менее уничижительно, чем субстантивированное «увечных».
- source_word: ἑτέρους πολλούς
  choice: многих других
  rationale: Естественно передаёт дополнительные группы людей сверх перечисленных.
- source_word: ἔρριψαν
  choice: положили
  rationale: Хотя глагол способен означать «бросили», в данном контексте «положили» передаёт действие без внесения не требуемой текстом жестокости.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: у Его ног
  rationale: Естественный русский эквивалент, сохраняющий пространственный образ греческого выражения.
- source_word: ἐθεράπευσεν αὐτούς
  choice: Он исцелил их
  rationale: Стандартно и точно передаёт действие Иисуса в евангельском повествовании.
