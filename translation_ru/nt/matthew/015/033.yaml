  yaml_path: translation/nt/matthew/015/033.yaml
  text: And the disciples said to him[c][b][a], “Where could we get enough bread in this desolate place to satisfy so large a crowd?”
translation:
  language: ru
  text: 'Ученики сказали[a] Ему: «Где нам в таком безлюдном месте[b] взять столько хлеба[c], чтобы досыта накормить такую толпу?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говорят»; здесь употреблено греческое историческое настоящее.'
    reason: translation_detail
  - marker: b
    text: 'Или: «в пустыне» / «в пустынном месте».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «столько хлебов», то есть столько буханок или лепёшек.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: сказали
  rationale: Греческое историческое настоящее в русском повествовании естественно передаётся прошедшим временем; буквальное «говорят» отмечено в сноске.
- source_word: μαθηταί
  choice: ученики
  rationale: Артикль указывает на уже известных из контекста учеников; добавлять отсутствующее в греческом тексте «Его» не требуется.
- source_word: Πόθεν ἡμῖν
  choice: где нам ... взять
  rationale: Идиоматическая русская конструкция точно передаёт вопрос об источнике или возможности достать необходимое.
- source_word: ἐν ἐρημίᾳ
  choice: в таком безлюдном месте
  rationale: Существительное обозначает пустынную, необитаемую местность; «месте» естественно восполняет подразумеваемую локативную идею, а «таком» связано с повторяющимся τοσοῦτος и данной ситуацией.
- source_word: ἄρτοι τοσοῦτοι
  choice: столько хлеба
  rationale: Хотя множественное число буквально означает «столько хлебов/буханок», собирательное «хлеба» звучит естественно по-русски и сохраняет количественный смысл.
- source_word: ὥστε χορτάσαι
  choice: чтобы досыта накормить
  rationale: Конструкция передаёт предполагаемый результат, а «досыта накормить» сохраняет значение полного насыщения, а не просто выдачи пищи.
- source_word: ὄχλον τοσοῦτον
  choice: такую толпу
  rationale: Естественно передаёт указание на величину присутствующей толпы без стилистически тяжёлого «столь многочисленную толпу».
