  text: Все поели и насытились, а затем собрали семь полных корзин оставшихся кусков[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «семь больших корзин, полных оставшихся кусков»; употреблённое здесь греческое слово σπυρίς может обозначать корзину большего размера, чем в некоторых других рассказах о насыщении народа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον πάντες
  choice: Все ели
  rationale: Передаёт простой аорист ἔφαγον и универсальный охват πάντες естественным современным русским выражением.
- source_word: ἐχορτάσθησαν
  choice: насытились
  rationale: Глагол обозначает, что люди наелись досыта; «насытились» кратко, естественно и сохраняет смысл полноты.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: оставшиеся куски
  rationale: Субстантивированное причастие τὸ περισσεῦον указывает на то, что осталось, а κλασμάτων — на куски еды, в контексте хлеба.
- source_word: ἦραν
  choice: собрали
  rationale: В контексте сбора остатков αἴρω естественно передаётся русским «собрали», без ненужной буквальности «подняли».
- source_word: ἑπτὰ σπυρίδας πλήρεις
  choice: семь полных корзин
  rationale: Сохраняет число и предикативное πλήρεις; общий термин «корзин» оставляет возможный нюанс размера для примечания.
