  text: ὁ γὰρ θεὸς ⸀εἶπεν· Τίμα τὸν πατέρα καὶ τὴν μητέρα, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/004.yaml
  text: For God said[a], ‘Honor your father and your mother,’ and, ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: ru
  text: 'Ведь Бог сказал: «Почитай отца и мать» — и: «Кто злословит отца или мать, тот должен быть предан смерти»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто проклинает отца или мать, тот непременно должен умереть».'
    reason: κακολογέω может означать «злословить», «поносить» или «проклинать»; θανάτῳ τελευτάτω — торжественная юридическая формула смертной кары, которую возможно передать без явного указания на исполнителя.
lexical_decisions:
- source_word: ὁ γὰρ θεὸς
  choice: Ведь Бог
  rationale: Частица γάρ вводит основание для довода Иисуса; «ведь» естественно передаёт пояснительно-причинную связь без излишнего усиления.
- source_word: εἶπεν
  choice: сказал
  rationale: Обычное значение λέγω при введении цитаты; оно не усиливается до «повелел», хотя первая цитата имеет форму заповеди.
- source_word: Τίμα
  choice: Почитай
  rationale: Глагол передаёт требование оказывать родителям подобающую честь и сохраняет вес традиционной формулировки заповеди.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: отца и мать
  rationale: Русская формулировка естественна и не нуждается в добавлении притяжательного местоимения, подразумеваемого содержанием заповеди.
- source_word: Ὁ κακολογῶν
  choice: Кто злословит
  rationale: «Злословит» передаёт речь, направленную во зло против родителей, и сохраняет диапазон между поношением и проклятием, не сужая его без необходимости.
- source_word: πατέρα ἢ μητέρα
  choice: отца или мать
  rationale: Сохраняется обобщённая конструкция оригинала без добавления отсутствующего притяжательного местоимения.
- source_word: θανάτῳ τελευτάτω
  choice: тот непременно должен умереть
  rationale: Формулировка сохраняет торжественный характер юридической формулы и её усиление, не делая исполнителя смертного приговора более явным, чем в греческом тексте.
theological_decisions:
- issue: Передача юридической формулы смертной кары θανάτῳ τελευτάτω
  choice: тот непременно должен умереть
  alternative: да будет предан смерти
  rationale: Выбранный вариант сохраняет строгость закона и эмфатическую силу формулы, но не вводит явно человеческого исполнителя казни, которого греческая конструкция прямо не называет.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. «Почитай» сохраняет узнаваемую форму заповеди, а «злословит» остаётся понятным и не сводит значение лишь к бытовому оскорблению.
