    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: спросил
  rationale: Греческий исторический презенс естественно передан русским прошедшим временем; с учётом следующего прямого вопроса глагол «спросил» точно выражает речевое действие.
- source_word: Πόσους ἄρτους
  choice: Сколько у вас хлебов
  rationale: ἄρτους обозначает считаемые хлебы, то есть отдельные буханки или лепёшки; русское «хлебов» сохраняет счётность и привычно для библейского повествования.
- source_word: ἔχετε
  choice: у вас
  rationale: Идиоматическая русская конструкция принадлежности «сколько у вас» естественно передаёт вопрос «сколько вы имеете».
- source_word: οἱ δὲ εἶπαν
  choice: Они ответили
  rationale: δέ здесь служит переходу к ответной реплике, а «ответили» естественно передаёт функцию εἶπαν в диалоге без избыточного союза.
- source_word: Ἑπτά
  choice: Семь
  rationale: Прямая передача числительного.
- source_word: ὀλίγα
  choice: несколько
  rationale: Передаёт неопределённое малое количество естественным современным русским языком.
- source_word: ἰχθύδια
  choice: маленьких рыбок
  rationale: Уменьшительная форма ἰχθύδια может указывать на небольшой размер рыб; русское сочетание сохраняет эту нюансировку.
