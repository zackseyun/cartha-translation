id: MAT.15.11
reference: Matthew 15:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐ τὸ εἰσερχόμενον εἰς τὸ στόμα κοινοῖ τὸν ἄνθρωπον, ἀλλὰ τὸ ἐκπορευόμενον ἐκ τοῦ στόματος τοῦτο κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/011.yaml
  text: It is not what enters into the mouth that defiles the man[b][a], but what comes out of the mouth—this defiles the man.
translation:
  language: ru
  text: Не то, что входит в уста, оскверняет человека[a], но то, что выходит из уст, — вот что оскверняет человека.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «делает человека нечистым». Греческий глагол может обозначать осквернение, то есть приведение в состояние нечистоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῖ
  choice: оскверняет
  rationale: В контексте спора о чистоте глагол означает, что человек становится нечистым; «оскверняет» естественно по-русски и сохраняет как религиозно-обрядовый, так и нравственный оттенок.
- source_word: τὸ εἰσερχόμενον εἰς τὸ στόμα
  choice: то, что входит в уста
  rationale: Субстантивированное причастие передано естественной относительной конструкцией; «входит в уста» сохраняет конкретный образ оригинала и соответствует возвышенному, но современному регистру.
- source_word: τὸ ἐκπορευόμενον ἐκ τοῦ στόματος
  choice: то, что выходит из уст
  rationale: Передаёт субстантивированное причастие и повтор пространственной образности исходного текста без излишней архаичности.
- source_word: ἄνθρωπον
  choice: человека
  rationale: Русское «человек» точно передаёт родовое значение ἄνθρωπος и не требует искусственного ограничения высказывания мужчинами.
- source_word: τοῦτο
  choice: вот что
  rationale: Явно сохраняет усилительный указательный элемент и естественно выделяет вторую часть противопоставления.
- source_word: οὐ ... ἀλλὰ
  choice: не то ... но то
  rationale: Сохраняет чёткую антитезу греческой конструкции в сжатой и достойной русской форме.
theological_decisions:
- issue: Значение языка чистоты в κοινόω
  choice: «оскверняет» с пояснением возможного смысла «делает нечистым»
  alternative: «делает человека нечистым»
  rationale: Основной вариант сохраняет одновременно обрядовую и нравственную силу высказывания, не сводя его ни к гигиене, ни исключительно к церемониальному статусу.
- issue: Родовое значение ἄνθρωπον
  choice: «человека»
  alternative: «мужчину» или «человека вообще» с отдельным примечанием
  rationale: В русском языке «человек» здесь естественно имеет обобщающее значение и точно отражает референт оригинала без ненужного конфессионального или гендерного уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Уста» выбраны вместо разговорного «рот», чтобы сохранить торжественность и параллелизм изречения; синтаксис остаётся ясным для обычного современного читателя.
