  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἀπεστάλην εἰ μὴ εἰς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/024.yaml
  text: But he answered[a], “I was sent only to the lost sheep of the house of Israel.”
translation:
  language: ru
  text: 'Но Он ответил[a]: «Я был послан только к потерянным овцам дома Израиля».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Я не был послан, кроме как к потерянным овцам дома Израиля».'
    reason: Лексико-синтаксический вариант, сохраняющий отрицательно-исключительную форму греческого Οὐκ ... εἰ μὴ.
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Но Он ответил
  rationale: Причастие ἀποκριθείς и личная форма εἶπεν образуют обычную греческую формулу ответа; по-русски она естественно и без смысловой потери передаётся одним глаголом «ответил». δέ выражает здесь лёгкое противопоставление и передано союзом «но».
- source_word: Οὐκ ἀπεστάλην
  choice: Я послан
  rationale: Аорист пассивного залога от ἀποστέλλω указывает на полученное поручение и миссию. Русская краткая форма «послан» естественно выражает сохраняющую силу поручения; буквальная отрицательная конструкция отражена в сноске.
- source_word: εἰ μὴ
  choice: только к
  rationale: В сочетании с предшествующим отрицанием εἰ μή вводит исключение и тем самым строго ограничивает сферу миссии. «Только к» естественно передаёт это ограничение по-русски.
- source_word: τὰ πρόβατα τὰ ἀπολωλότα
  choice: потерянным овцам
  rationale: Сохранён образ овец. Перфектное причастие ἀπολωλότα здесь означает оказавшихся потерянными или заблудившимися; «потерянным» сохраняет метафору и не усиливает её до окончательной гибели.
- source_word: οἴκου Ἰσραήλ
  choice: дома Израиля
  rationale: Сохранено библейское обозначение народа как «дома Израиля» без замены толкующим выражением «народ Израиля».
theological_decisions:
- issue: Границы миссии Иисуса в данном высказывании
  choice: Передать высказывание как прямое ограничение миссии адресатами из дома Израиля.
  alternative: Передать лишь первоочерёдность Израиля или добавить подразумеваемое последующее обращение к другим народам.
  rationale: Конструкция Οὐκ ... εἰ μὴ имеет явно ограничительный характер. Перевод сохраняет напряжение данного эпизода и не разрешает его за счёт более широкого канонического контекста.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и библейской образности. Местоимение «Он» написано с прописной буквы в соответствии с принятой русской библейской издательской традицией; формула «дом Израиля» сохранена как понятный устойчивый библеизм.
