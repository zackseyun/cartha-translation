id: MAT.15.20
reference: Matthew 15:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ταῦτά ἐστιν τὰ κοινοῦντα τὸν ἄνθρωπον, τὸ δὲ ἀνίπτοις χερσὶν φαγεῖν οὐ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/020.yaml
  text: These are the things that defile the man[b][a], but to eat with unwashed hands does not defile the man.
translation:
  language: ru
  text: Вот что оскверняет человека[a], а еда немытыми руками не оскверняет человека.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «делает человека нечистым». Греческий глагол может обозначать обрядовую нечистоту; здесь слово «оскверняет» сохраняет и этот фон, и более широкий смысл внутреннего осквернения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῦντα / κοινοῖ
  choice: оскверняет / не оскверняет
  rationale: В контексте спора о чистоте глагол означает делать человека нечистым; «осквернять» сохраняет как обрядовый фон, так и более широкий нравственный смысл.
- source_word: ἄνθρωπον
  choice: человека
  rationale: Единственное число с артиклем употреблено обобщённо. Русское «человека» естественно сохраняет представительное единственное число и относится к любому человеку.
- source_word: ἀνίπτοις χερσὶν
  choice: немытыми руками
  rationale: Естественная русская передача дательного оборота, ясно указывающая на обсуждаемое омовение рук.
- source_word: φαγεῖν
  choice: еда
  rationale: Субстантивированная передача инфинитива звучит по-русски естественно и сохраняет противопоставление тому, что действительно оскверняет.
- source_word: ταῦτά ἐστιν τὰ
  choice: Вот что
  rationale: Краткая и естественная современная конструкция, сохраняющая указательное выделение.
- source_word: δέ
  choice: а
  rationale: Союз выражает явное противопоставление; русское «а» здесь естественнее тяжёлого «но».
theological_decisions:
- issue: Значение κοινόω в споре об обрядовой чистоте
  choice: осквернять
  alternative: делать нечистым
  rationale: «Осквернять» удерживает связь с ритуальной нечистотой, не сужая смысл до одной обрядности, поскольку в контексте речь также идёт о внутреннем нравственном осквернении.
- issue: Обобщённое единственное число ἄνθρωπον
  choice: человека
  alternative: людей
  rationale: Сохранено единственное число оригинала и его общий смысл без превращения высказывания во множественное число.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, достоинственная и понятная. Повтор «человека» сохранён вслед за греческим текстом для ясности и смыслового акцента.
