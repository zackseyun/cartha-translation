id: MAT.15.29
reference: Matthew 15:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ μεταβὰς ἐκεῖθεν ὁ Ἰησοῦς ἦλθεν παρὰ τὴν θάλασσαν τῆς Γαλιλαίας, καὶ ἀναβὰς εἰς τὸ ὄρος ἐκάθητο ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/029.yaml
  text: And departing from there[a], Jesus came along the Sea of Galilee, and after going up on the mountain[b], he sat there.
translation:
  language: ru
  text: Покинув то место, Иисус пришёл к Галилейскому морю[a], затем поднялся на гору и сидел там[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пошёл вдоль Галилейского моря». Греческий предлог может обозначать как движение к месту у берега, так и движение вдоль берега.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сел там». Греческая форма может быть передана так в повествовательном контексте, однако «сидел» яснее сохраняет значение продолжавшегося состояния.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: покинув то место
  rationale: Аористное причастие обозначает действие, предшествующее основному; русское деепричастие естественно передаёт последовательность, а «то место» ясно выражает удаление от прежнего места.
- source_word: ἦλθεν
  choice: пришёл
  rationale: Обычное повествовательное значение ἔρχομαι; перевод сохраняет самостоятельный глагол движения без лишнего уточнения маршрута.
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: к Галилейскому морю
  rationale: παρά с винительным при глаголе движения может указывать на приближение к берегу или движение вдоль него. Основной текст естественно передаёт прибытие к морю, а возможное значение движения вдоль берега сохранено в примечании.
- source_word: ἀναβὰς εἰς τὸ ὄρος
  choice: поднялся на гору
  rationale: Сочетание ἀναβαίνω с εἰς естественно означает подъём на гору. Личный глагол вместо второго деепричастного оборота делает русское повествование плавным, сохраняя последовательность действий.
- source_word: ἐκάθητο ἐκεῖ
  choice: сидел там
  rationale: Имперфект ἐκάθητο прежде всего описывает продолжающееся положение сидя. «Сидел там» сохраняет этот несовершенный вид, не превращая форму без необходимости в начинательное «сел».
- source_word: ὁ Ἰησοῦς
  choice: Иисус
  rationale: Использована общепринятая русская форма имени.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. «Галилейское море» сохраняет традиционное библейское наименование. Местоимение после имени Иисуса не добавлено, чтобы не вносить отсутствующей в греческом тексте прописной формы.
