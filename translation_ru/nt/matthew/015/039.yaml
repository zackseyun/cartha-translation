  text: And after dismissing the crowds[a], he got into the boat and came to the region of Magadan.
translation:
  language: ru
  text: Отпустив народ, он сел в лодку и прибыл в область Магадана.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «Магдала» вместо «Магадан».'
