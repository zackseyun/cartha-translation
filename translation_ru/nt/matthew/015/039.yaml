lexical_decisions:
- source_word: ἀπολύσας
  choice: отпустив
  rationale: Аористное причастие обозначает действие, предшествующее основным глаголам; «отпустив» естественно передаёт то, что Иисус велел людям разойтись.
- source_word: τοὺς ὄχλους
  choice: народ
  rationale: Греческая форма множественного числа означает собравшиеся толпы; в данном контексте русское собирательное «народ» звучит естественно и не теряет смысла.
- source_word: ἐνέβη εἰς τὸ πλοῖον
  choice: сел в лодку
  rationale: Устойчивое и естественное русское выражение для посадки в небольшое судно; оно конкретно передаёт действие, не придавая ему оттенка современного официального «взошёл на борт».
- source_word: ἦλθεν
  choice: прибыл
  rationale: В повествовании о перемещении по воде «прибыл» ясно передаёт достижение места назначения и по-русски звучит естественнее буквального «пришёл».
- source_word: τὰ ὅρια
  choice: пределы
  rationale: Форма множественного числа может обозначать не только границы, но и прилегающую территорию; «пределы» сохраняет географический смысл и сочетается с названием местности.
- source_word: Μαγαδάν
  choice: Магадан
  rationale: Основной текст SBLGNT содержит Μαγαδάν; название передано традиционной русской транслитерацией и не заменено более известным разночтением.
theological_decisions:
- issue: Форма географического названия в конце стиха
  choice: Магадан
  alternative: Магдала
  rationale: Это текстологическое, а не догматическое различие. Основной текст следует чтению предоставленного греческого издания, а альтернативное чтение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Местоимение «он» дано со строчной буквы согласно обычной современной орфографии; изложение остаётся уважительным без внесения отсутствующей в греческом тексте конфессиональной маркировки.
