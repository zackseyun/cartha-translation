  text: ⸀ἔλαβεν τοὺς ἑπτὰ ἄρτους καὶ τοὺς ἰχθύας ⸀καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀ἐδίδου τοῖς ⸀μαθηταῖς οἱ δὲ μαθηταὶ ⸂τοῖς ὄχλοις⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/036.yaml
  text: He took the seven loaves and the fish[a], and after giving thanks he broke them and kept giving them to the disciples, and the disciples to the crowds.
translation:
  language: ru
  text: Он взял семь хлебов и рыбу и, воздав благодарность, преломил хлебы и раздавал пищу ученикам, а ученики — толпам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβεν
  choice: взял
  rationale: Естественно передаёт начало последовательности действий Иисуса с пищей.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: семь хлебов
  rationale: В данном рассказе ἄρτοι — отдельные хлебы; русское «семь хлебов» конкретно и естественно.
- source_word: τοὺς ἰχθύας
  choice: рыбу
  rationale: Русское собирательное единственное число естественно обозначает рыбу как пищу и не искажает греческую форму множественного числа по смыслу.
- source_word: εὐχαριστήσας
  choice: возблагодарил
  rationale: Передаёт благодарение без добавления отсутствующего в греческом тексте прямого дополнения; последовательность действий ясна благодаря ряду глаголов.
- source_word: ἔκλασεν
  choice: преломил их
  rationale: «Преломил» уместно для хлеба в возвышенном, но понятном библейском повествовании; местоимение восполняет подразумеваемый объект.
- source_word: ἐδίδου
  choice: стал раздавать
  rationale: Передаёт продолженное и повторяющееся действие несовершенного вида при распределении пищи.
- source_word: τοῖς μαθηταῖς
  choice: ученикам
  rationale: Дательный падеж прямо обозначает получателей; притяжательное «своим» не добавляется, поскольку его нет в греческом.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: а ученики — народу
  rationale: Сохраняет эллипсис второй части фразы. «Народу» естественно по-русски передаёт собравшиеся толпы в данном контексте.
theological_decisions:
- issue: Возможный евхаристический оттенок εὐχαριστήσας
  choice: Передать обычное действие благодарения словом «возблагодарил», не развивая сакраментальный смысл.
  alternative: Использовать подчёркнуто литургическую формулу или прямо указать, что Он благодарил Бога.
  rationale: Греческий текст сообщает о благодарении над пищей, не называя его объект и не формулируя сакраментального толкования. Перевод сохраняет возможный отзвук, но не навязывает его.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксис краткий и плавный; продолженность ἐδίδου выражена сочетанием «стал раздавать», а греческий эллипсис сохранён с помощью тире.
