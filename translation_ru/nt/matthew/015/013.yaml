id: MAT.15.13
reference: Matthew 15:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Πᾶσα φυτεία ἣν οὐκ ἐφύτευσεν ὁ πατήρ μου ὁ οὐράνιος ἐκριζωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/013.yaml
  text: But he answered and said[a], “Every plant that my heavenly Father did not plant will be uprooted.”
translation:
  language: ru
  text: 'Он же ответил: «Всякое растение, которое не посадил Мой Небесный Отец, будет вырвано с корнем».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всякое насаждение, которое не насадил Мой Небесный Отец, будет выкорчевано».'
    reason: 'Лексическая альтернатива: φυτεία может означать «растение» или «насаждение», а ἐκριζωθήσεται — «будет выкорчевано».'
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ответил
  rationale: Греческая повествовательная формула буквально сочетает «ответив, сказал», однако в современном русском естественно и полно передаётся одним глаголом «ответил».
- source_word: Πᾶσα φυτεία
  choice: всякое растение
  rationale: Единственное число с Πᾶσα имеет распределительное значение. φυτεία может обозначать как растение, так и насаждение; «всякое растение» естественно сочетается с последующим образом вырывания с корнем.
- source_word: ἐφύτευσεν
  choice: посадил
  rationale: Сохраняет прямой земледельческий образ и лексическую связь с φυτεία.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: Мой Небесный Отец
  rationale: Естественная и достойная русская формулировка, сохраняющая притяжательное местоимение и определение οὐράνιος.
- source_word: ἐκριζωθήσεται
  choice: будет вырвано с корнем
  rationale: Передаёт будущую пассивную форму и явный образ удаления растения вместе с корнем.
theological_decisions:
- issue: Метафорический референт выражения «всякое растение»
  choice: Сохранить открытый образ растения, не уточняя его референт.
  alternative: Передать как «всякое учение», «всякое предание» или «всякий человек».
  rationale: Греческий текст не определяет референт метафоры однозначно; конкретизация устранила бы намеренную смысловую открытость.
translation_notes:
  register: Современный литературный русский; речь краткая и торжественная, земледельческая метафора сохранена. Заглавные буквы в «Мой Небесный Отец» соответствуют принятому в русском библейском стиле почтительному оформлению.
