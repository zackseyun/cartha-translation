  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἔστιν καλὸν λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ βαλεῖν τοῖς κυναρίοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/026.yaml
  text: But he answered[a], “It is not right to take the children's bread and throw it to the little dogs.”
translation:
  language: ru
  text: 'Он же ответил: «Нехорошо взять хлеб у детей и бросить его собачкам[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «маленьким собакам», «домашним собакам»; в греческом употреблена уменьшительная форма, которая может подразумевать небольших или домашних собак, а не бродячих псов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ответил
  rationale: Сочетание причастия с личной формой глагола буквально означает «ответив, сказал», но по-русски естественно и точно передаётся одним глаголом «ответил».
- source_word: καλὸν
  choice: хорошо
  rationale: В данном обороте слово выражает уместность или правильность поступка. «Нехорошо» естественно передаёт отрицательную конструкцию οὐκ ἔστιν καλόν, не сводя её только к формальному запрету.
- source_word: λαβεῖν
  choice: взять
  rationale: Прямое значение инфинитива сохраняет образ того, как хлеб берут, чтобы затем бросить его собачкам.
- source_word: τὸν ἄρτον τῶν τέκνων
  choice: хлеб у детей
  rationale: «Хлеб» сохраняет предметный образ, τέκνα обозначает детей без указания пола, а конструкция «взять хлеб у детей» естественно выражает принадлежность, заданную родительным падежом.
- source_word: βαλεῖν
  choice: бросить
  rationale: Глагол передаёт конкретное и выразительное действие; более мягкое «дать» ослабило бы образ исходного текста.
- source_word: κυναρίοις
  choice: собачкам
  rationale: Уменьшительная форма κυνάρια передана русской уменьшительной формой «собачкам», которая может обозначать небольших или домашних собак, но сама по себе не требует значения «щенки».
theological_decisions:
- issue: Метафора о детях и собачках может быть истолкована как указание на разные группы людей и порядок служения.
  choice: Сохранить образы детей, хлеба и собачек без раскрытия их предполагаемых соответствий в основном тексте.
  alternative: Разъяснить метафору непосредственно в переводе, назвав подразумеваемые группы.
  rationale: Греческий текст этого стиха не называет референтов метафоры прямо. Сохранение образа оставляет его напряжение и неоднозначность для понимания в контексте.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и выразительная. «Он же ответил» передаёт противопоставительный оттенок δέ, а «собачкам» сохраняет уменьшительную форму оригинала без смягчающего толкования всей метафоры.
