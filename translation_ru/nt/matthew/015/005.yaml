  text: ὑμεῖς δὲ λέγετε· Ὃς ἂν εἴπῃ τῷ πατρὶ ἢ τῇ μητρί· Δῶρον ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/005.yaml
  text: But you say[a], ‘Whoever says to his father or his mother, “Whatever you would have benefited from me is a gift,”’
translation:
  language: ru
  text: 'А вы говорите: «Если кто скажет отцу или матери: „То, чем я мог бы тебе помочь, — дар“[a]…»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В контексте имеется в виду, что то, чем можно было поддержать родителей, объявлялось посвящённым Богу. Ср. Мк 7:11, где употреблено слово «корван».
    reason: 'Культурное пояснение: оно раскрывает контекстуальный смысл слова «дар», не добавляя «Богу» в основной текст Матфея.'
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: А вы говорите
  rationale: δὲ выражает противопоставление предшествующей заповеди; местоимение ὑμεῖς имеет смысловое ударение, естественно передаваемое сочетанием «а вы».
- source_word: Ὃς ἂν εἴπῃ
  choice: Если кто скажет
  rationale: Относительное местоимение с ἄν и аористом сослагательного наклонения выражает неопределённое общее условие. Такая формулировка естественна по-русски и сохраняет условную структуру, которая продолжается в следующем стихе.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: отцу или матери
  rationale: Дательный падеж обозначает адресатов речи. В русском притяжательное местоимение здесь не требуется.
- source_word: Δῶρον
  choice: дар Богу
  rationale: δῶρον буквально означает «дар» или «приношение»; в данном контексте речь идёт о посвящении Богу средств, которыми можно было поддержать родителей. Добавление «Богу» кратко раскрывает подразумеваемого получателя дара, не заимствуя термин «корван» из параллельного места Марка.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: То, чем я мог бы помочь тебе
  rationale: Передаёт неопределённость ὃ ἐὰν, источник помощи ἐξ ἐμοῦ и пассивное значение ὠφεληθῇς естественным современным русским языком. Единственное число «тебе» согласуется с обращением к каждому из родителей по отдельности.
theological_decisions:
- issue: Следует ли вводить в текст Матфея специальный термин «корван»
  choice: Сохранить слово «дар», пояснив посвящение Богу
  alternative: «корван» или «приношение»
  rationale: В тексте Матфея стоит δῶρον, а не κορβᾶν, употреблённое в Мк 7:11. Перевод сохраняет собственную лексику Матфея и не переносит в неё термин из параллельного повествования.
- issue: Как передать подразумеваемое посвящение дара
  choice: «дар Богу» в основном тексте
  alternative: буквальное «дар» без указания адресата
  rationale: В контексте спора простое русское «дар» может быть непонятно или воспринято как подарок родителю. Уточнение «Богу» передаёт культурно подразумеваемый смысл, не утверждая сверх текста подробностей о форме обета.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Эллиптическая фраза сохранена незавершённой многоточием, поскольку её грамматическое продолжение находится в Мф 15:6. Вложенные кавычки разграничивают слова Иисуса, правило оппонентов и формулу обращения к родителю.
