  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Сохраняет простой повествовательный союз без добавления временного или логического оттенка.
- source_word: προσκαλεσάμενος
  choice: подозвав
  rationale: 'Естественно передаёт аористное причастие среднего залога и направленность действия: Иисус зовёт собравшихся подойти или обратить к Нему внимание.'
- source_word: τὸν ὄχλον
  choice: народ
  rationale: В данном повествовательном контексте обозначает собравшихся людей; «народ» звучит естественно и достойно, тогда как «толпа» может в современном русском иметь нежелательный сниженный оттенок.
- source_word: εἶπεν αὐτοῖς
  choice: Он сказал им
  rationale: Прямое и естественное соответствие греческому выражению; прописная буква в местоимении следует принятой русской библейской издательской традиции.
- source_word: Ἀκούετε
  choice: Слушайте
  rationale: Передаёт повеление внимательно воспринимать речь, а не только физически слышать.
- source_word: συνίετε
  choice: понимайте
  rationale: Сохраняет призыв постигнуть смысл услышанного и параллельную форму двух повелительных глаголов.
