id: MAT.15.23
reference: Matthew 15:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἀπεκρίθη αὐτῇ λόγον. καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ⸀ἠρώτουν αὐτὸν λέγοντες· Ἀπόλυσον αὐτήν, ὅτι κράζει ὄπισθεν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/023.yaml
  text: But he did not answer her a word[a]. And his disciples came and kept asking him, saying, “Send her away[b], because she is crying out behind us.”
translation:
  language: ru
  text: 'Но Он не ответил ей ни слова. Тогда Его ученики подошли и стали просить Его: «Отошли её[a], ведь она кричит позади нас[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Отпусти её». Из слов учеников неясно, просят ли они исполнить её просьбу и затем отпустить её или просто отослать её прочь.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «следом за нами». Греческое выражение может обозначать как положение позади, так и следование за кем-либо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἀπεκρίθη αὐτῇ λόγον
  choice: не ответил ей ни слова
  rationale: 'Естественная русская идиома сохраняет усиленный смысл: Иисус вовсе ничего ей не ответил.'
- source_word: προσελθόντες
  choice: подошли
  rationale: Передаёт движение учеников к Иисусу точнее и естественнее, чем общее «пришли».
- source_word: ἠρώτουν
  choice: стали просить
  rationale: Имперфект допускает продолженное или настойчивое действие; конструкция передаёт его, не усиливая значение до «умоляли».
- source_word: Ἀπόλυσον
  choice: Отошли её
  rationale: Нейтрально передаёт «отпусти/отправь» и не уточняет, должны ли её просьбу сначала удовлетворить.
- source_word: κράζει
  choice: кричит
  rationale: Передаёт громкий, настойчивый зов без лишнего уточнения его содержания.
- source_word: ὄπισθεν ἡμῶν
  choice: позади нас
  rationale: Сохраняет основное пространственное значение; возможный смысл следования отмечен в сноске.
theological_decisions:
- issue: Намерение учеников в словах Ἀπόλυσον αὐτήν
  choice: «Отошли её» без уточнения способа
  alternative: «Исполни её просьбу и отпусти» или «Прогони её»
  rationale: Греческий текст не определяет, хотели ли ученики, чтобы Иисус удовлетворил просьбу женщины, или лишь удалил её. Нейтральная формулировка сохраняет повествовательную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; повествование звучит естественно и сдержанно. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно принятой русской библейской традиции.
