id: MAT.15.32
reference: Matthew 15:32
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ εἶπεν· Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον, ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν· καὶ ἀπολῦσαι αὐτοὺς νήστεις οὐ θέλω, μήποτε ἐκλυθῶσιν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/032.yaml
  text: Then Jesus called his disciples to him and said[a], “I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat. And I do not want to send them away hungry[d][c][b], lest they collapse on the way.”
translation:
  language: ru
  text: 'Тогда Иисус подозвал к себе учеников и сказал: «Я сострадаю этой толпе[a]: вот уже три дня они остаются со Мной, и им нечего есть. Я не хочу отпускать их голодными[b], чтобы они не обессилели в дороге[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мне жаль этих людей»; глагол выражает глубокое сострадание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не евшими» или «натощак»; речь идёт о том, что у них нет пищи, а не о религиозном посте.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не ослабели в пути»; возможен также смысл «не упали от изнеможения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: подозвал к себе
  rationale: 'Передаёт направленность среднего залога: Иисус призывает учеников приблизиться к Нему; выражение естественно для современного русского повествования.'
- source_word: Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον
  choice: Мне жаль этих людей
  rationale: Передаёт глубокое сострадание Иисуса естественным современным языком; «этих людей» здесь яснее и живее, чем повтор существительного «толпа» в прямой речи.
- source_word: ἤδη ἡμέραι τρεῖς προσμένουσίν μοι
  choice: вот уже три дня они остаются со Мной
  rationale: Сохраняет длительность и смысл продолжающегося пребывания рядом с Иисусом; «вот уже» естественно выражает ἤδη.
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: им нечего есть
  rationale: Прямой и идиоматичный русский эквивалент греческой конструкции.
- source_word: ἀπολῦσαι αὐτοὺς
  choice: отпускать их
  rationale: Соответствует ситуации, в которой собравшихся людей отпускают в путь.
- source_word: νήστεις
  choice: голодными
  rationale: В контексте обозначает людей без пищи, а не соблюдающих религиозный пост.
- source_word: μήποτε ἐκλυθῶσιν
  choice: чтобы они не обессилели
  rationale: Передаёт опасение предполагаемого результата и значение физического истощения без чрезмерного усиления до обязательной потери сознания.
- source_word: ἐν τῇ ὁδῷ
  choice: в дороге
  rationale: Естественное русское обозначение пути после того, как людей отпустят.
theological_decisions: []
