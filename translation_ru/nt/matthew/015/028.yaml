source:
  edition: SBLGNT
  text: τότε ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῇ· Ὦ γύναι, μεγάλη σου ἡ πίστις· γενηθήτω σοι ὡς θέλεις. καὶ ἰάθη ἡ θυγάτηρ αὐτῆς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/028.yaml
  text: Then Jesus answered her[a], “O woman, great is your faith[b]; let it be done for you as you desire.” And her daughter was healed from that hour.
translation:
  language: ru
  text: 'Тогда Иисус ответил ей: «Женщина, велика твоя вера![a] Пусть будет тебе, как ты желаешь». И с того часа[b] её дочь исцелилась.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «велико твоё доверие». Греческое πίστις может означать веру, доверие или верность; здесь основной перевод — «вера».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с того момента». Буквально по-гречески: «с того часа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественный повествовательный связующий элемент, соотносящий ответ Иисуса с предшествующим разговором.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτῇ
  choice: сказал ей в ответ
  rationale: Передаёт идиоматическое сочетание причастия ἀποκριθείς с глаголом речи, сохраняя адресата αὐτῇ без неестественного удвоения.
- source_word: Ὦ γύναι
  choice: О женщина
  rationale: Сохраняет прямое, подчёркнутое обращение; в данном контексте γύναι не выражает грубости.
- source_word: μεγάλη σου ἡ πίστις
  choice: велика твоя вера
  rationale: Сохраняет эмфатический порядок греческой фразы и звучит естественно в достойном современном русском регистре.
- source_word: πίστις
  choice: вера
  rationale: В контексте настойчивого обращения женщины к Иисусу обозначает её верящее упование; «вера» остаётся наиболее прямым и богословски ненагруженным соответствием.
- source_word: γενηθήτω σοι
  choice: пусть будет тебе
  rationale: Передаёт аористный пассивный императив и торжественно-действенную силу слов Иисуса.
- source_word: ὡς θέλεις
  choice: как ты желаешь
  rationale: «Желаешь» точно передаёт θέλεις и соответствует возвышенному, но понятному регистру.
- source_word: ἰάθη
  choice: исцелилась
  rationale: Естественно передаёт пассивную форму ἰάομαι в контексте чудесного исцеления.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: с того часа
  rationale: Сохраняет буквальный временной образ греческого текста; возможный смысл «с того момента» отмечен в сноске.
theological_decisions:
- issue: Передача πίστις в похвале Иисуса
  choice: вера
  alternative: доверие
  rationale: Здесь речь идёт о верящем уповании женщины на Иисуса. «Вера» точно сохраняет богословскую ёмкость πίστις, тогда как «доверие» допустимо как поясняющий оттенок, но несколько сужает выражение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет эмфазу оригинала, но остаётся понятным обычному читателю.
