  text: ὑποκριταί, καλῶς ἐπροφήτευσεν περὶ ὑμῶν Ἠσαΐας λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/007.yaml
  text: 'Hypocrites[a], Isaiah rightly prophesied about you, saying:'
translation:
  language: ru
  text: 'Лицемеры! Верно[a] пророчествовал о вас Исаия, говоря:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хорошо пророчествовал о вас».'
    reason: Лексическая альтернатива для καλῶς; маркер поставлен при слове «Верно», к которому относится примечание.
lexical_decisions:
- source_word: ὑποκριταί
  choice: Лицемеры!
  rationale: Форма звательного множественного числа передана прямым резким обращением; в современном русском восклицательный знак естественно выражает его обличительную силу.
- source_word: καλῶς
  choice: Верно
  rationale: Наречие характеризует пророчество Исаии как истинное и точно относящееся к слушателям. «Верно» естественнее современного русского «хорошо» в этом сочетании, при этом буквальная альтернатива сохранена в сноске.
- source_word: ἐπροφήτευσεν
  choice: пророчествовал
  rationale: Прямой русский эквивалент сохраняет пророческий регистр и связь Исаии с пророческим служением.
- source_word: περὶ ὑμῶν
  choice: о вас
  rationale: Обычная и естественная передача περί с родительным падежом, сохраняющая отнесённость пророчества к адресатам.
- source_word: Ἠσαΐας
  choice: Исаия
  rationale: Устоявшаяся русская библейская форма имени пророка.
- source_word: λέγων
  choice: 'говоря:'
  rationale: Причастие вводит следующую далее цитату; деепричастие с двоеточием кратко и естественно передаёт эту функцию.
theological_decisions:
- issue: Сила обращения Иисуса к фарисеям и книжникам
  choice: Прямое обличительное обращение «Лицемеры!»
  alternative: Смягчённое обозначение вроде «притворщики»
  rationale: ὑποκριταί в данном контексте является сильным нравственно-религиозным обвинением. Смягчение ослабило бы приговор Иисуса и связь с последующей цитатой из Исаии.
- issue: Смысл καλῶς применительно к пророчеству
  choice: «Верно пророчествовал» — пророчество истинно и уместно относится к адресатам
  alternative: «Хорошо пророчествовал»
  rationale: Перевод не утверждает отдельной богословской категории точности пророчества, а сохраняет контекстуальную оценку слов Исаии как верно описывающих собеседников Иисуса.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Краткость и резкость начального обращения сохранены; оборот «говоря:» оставлен как естественное введение последующей цитаты.
