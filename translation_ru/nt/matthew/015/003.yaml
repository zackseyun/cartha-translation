  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Διὰ τί καὶ ὑμεῖς παραβαίνετε τὴν ἐντολὴν τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/003.yaml
  text: But he answered and said to them[a], “Why do you also transgress the commandment of God for the sake of your tradition?”
translation:
  language: ru
  text: 'Он же сказал им в ответ: «Почему и вы нарушаете заповедь Бога ради вашего предания?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Он же сказал им в ответ
  rationale: Оборот с причастием и личной формой глагола передан естественным русским выражением, сохраняющим и значение ответа, и значение речи; частица δέ обозначена словом «же».
- source_word: Διὰ τί
  choice: Почему
  rationale: Прямой и естественный способ передать вопрос о причине.
- source_word: καὶ ὑμεῖς
  choice: и вы
  rationale: 'Сохраняет соотнесение с только что высказанным обвинением учеников: обвинители сами также нарушают заповедь.'
- source_word: παραβαίνετε
  choice: нарушаете
  rationale: Точно и понятно передаёт нарушение установленной заповеди без излишне архаичного оттенка слова «преступаете».
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: заповедь Бога
  rationale: «Заповедь» сохраняет библейский и заветный регистр ἐντολή, а конструкция с родительным падежом подчёркивает контраст с «вашим преданием».
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: ради вашего предания
  rationale: 'διά с винительным допускает причинно-мотивирующий оттенок; «ради» сохраняет остроту обвинения: предание получает приоритет перед Божьей заповедью. «Предание» точно обозначает передаваемое установление и не расширяет упрёк до осуждения всякой традиции.'
theological_decisions:
- issue: Противопоставление Божьей заповеди человеческому преданию
  choice: «заповедь Бога» и «ваше предание»
  alternative: «Божье повеление» и «ваш обычай»
  rationale: Выбранные слова сохраняют прямое противопоставление источников авторитета. Местоимение «ваше» ограничивает критику конкретным преданием собеседников, не превращая её в общее осуждение всякого предания.
- issue: Смысл διὰ с винительным
  choice: «ради вашего предания»
  alternative: «из-за вашего предания»
  rationale: «Ради» может обозначать основание и приоритет, ради которого нарушается заповедь, тогда как «из-за» сильнее подчёркивает простую причинность. Греческая конструкция допускает эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис естественный, но смысловые повторы и контраст оригинала сохранены; архаизмы не используются.
