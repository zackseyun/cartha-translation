source:
  edition: SBLGNT
  text: ὥστε ⸂τὸν ὄχλον⸃ θαυμάσαι βλέποντας κωφοὺς λαλοῦντας ⸂κυλλοὺς ὑγιεῖς⸃ ⸀καὶ χωλοὺς περιπατοῦντας καὶ τυφλοὺς βλέποντας· καὶ ἐδόξασαν τὸν θεὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/031.yaml
  text: so that the crowd marveled as they saw the mute speaking, the crippled made well, the lame walking, and the blind seeing; and they glorified the God of Israel.
translation:
  language: ru
  text: Так что народ изумлялся, видя, как немые говорят[a], увечные стали здоровыми[b], хромые ходят и слепые видят, и прославил Бога Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глухие говорят». Греческое слово может обозначать глухих или немых; здесь предпочтено «немые», поскольку непосредственно говорится о том, что они заговорили.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «увечные здоровы»; «искалеченные восстановлены». Речь идёт о людях с повреждёнными или искалеченными конечностями, которые стали здоровыми.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: так что
  rationale: Естественно передаёт следствие предшествующих исцелений.
- source_word: τὸν ὄχλον
  choice: народ
  rationale: В данном повествовательном контексте обозначает собравшихся людей; это естественнее по-русски, чем «толпа» в реакции на чудеса.
- source_word: θαυμάσαι
  choice: изумлялся
  rationale: Передаёт сильное удивление и согласуется с собирательным существительным «народ».
- source_word: βλέποντας
  choice: видя
  rationale: 'Сохраняет причастную связь: народ изумлялся тому, что наблюдал.'
- source_word: κωφοὺς λαλοῦντας
  choice: немые говорят
  rationale: κωφός допускает значения «глухой» и «немой», но λαλοῦντας указывает здесь прежде всего на восстановление речи.
- source_word: κυλλοὺς ὑγιεῖς
  choice: увечные исцелены
  rationale: κυλλός описывает людей с повреждёнными или искалеченными конечностями, а ὑγιής — их восстановленное здоровое состояние; русская формулировка ясно выражает результат исцеления.
- source_word: χωλοὺς περιπατοῦντας
  choice: хромые ходят
  rationale: Прямо и естественно передаёт контраст между прежним состоянием и восстановленной способностью ходить.
- source_word: τυφλοὺς βλέποντας
  choice: слепые видят
  rationale: Сохраняет лаконичный параллелизм греческого перечня.
- source_word: ἐδόξασαν
  choice: прославили
  rationale: Сохраняет значение воздания Богу славы, не ослабляя его до общего выражения похвалы.
- source_word: τὸν θεὸν Ἰσραήλ
  choice: Бога Израиля
  rationale: Точно воспроизводит традиционное библейское обозначение Бога, которому принадлежит Израиль.
theological_decisions:
- issue: Значение κωφούς в сочетании κωφοὺς λαλοῦντας
  choice: немые говорят
  alternative: глухие говорят
  rationale: Слово может относиться к глухоте или немоте, однако непосредственное противопоставление выражено глаголом «говорят», поэтому в тексте выбрано «немые»; неоднозначность отмечена в сноске.
- issue: Передача δοξάζω применительно к Богу
  choice: прославили Бога Израиля
  alternative: воздали славу Богу Израиля; восхвалили Бога Израиля
  rationale: «Прославили» естественно для современного литературного русского языка и сохраняет богословски весомый смысл признания Божьей славы.
- issue: Состояние κυλλοί после исцеления
  choice: увечные исцелены
  alternative: увечные стали здоровы; искалеченные восстановлены
  rationale: Формулировка передаёт результат, выраженный прилагательным ὑγιεῖς, не уточняя сверх текста характер повреждений или способ восстановления.
translation_notes:
  register: Современный литературный русский язык с лаконичным параллелизмом перечня чудес. «Народ» употреблено как собирательное существительное, поэтому сказуемое стоит в единственном числе; далее «люди» проясняет множественное действие в ἐδόξασαν. Термины о физических ограничениях выбраны по смыслу древнего текста, без привнесения конфессиональной терминологии.
