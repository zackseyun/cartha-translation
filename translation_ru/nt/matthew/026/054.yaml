base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/054.yaml
  text: How then would the Scriptures be fulfilled[a], that it must happen this way?
translation:
  language: ru
  text: Как же тогда исполнятся Писания[a], согласно которым это должно произойти так?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как же тогда могут исполниться Писания, что это должно произойти так?»'
    reason: Возможна более формальная передача риторической потенциальности πληρωθῶσιν и содержательного союза ὅτι.
lexical_decisions:
- source_word: πῶς οὖν
  choice: Как же тогда
  rationale: Передаёт риторический вопрос и логическую связь с предшествующими словами; частица «же» придаёт естественный русский вопросительный акцент.
- source_word: πληρωθῶσιν
  choice: исполнятся
  rationale: Будущая форма в риторическом вопросе естественно передаёт аористный пассивный конъюнктив после πῶς и подразумеваемую невозможность исполнения при ином ходе событий.
- source_word: αἱ γραφαὶ
  choice: Писания
  rationale: Устойчивое обозначение священных текстов Израиля; прописная буква показывает специальное референтное значение.
- source_word: ὅτι
  choice: согласно которым
  rationale: В данном синтаксическом контексте естественно вводит содержание свидетельства Писаний, не превращая ὅτι в явно причинный союз.
- source_word: οὕτως
  choice: именно так
  rationale: Указывает на данный образ развития событий; «именно» сохраняет эмфатическую силу οὕτως в контексте.
- source_word: δεῖ γενέσθαι
  choice: должно произойти
  rationale: Сохраняет безличную необходимость δεῖ и передаёт γενέσθαι современным естественным глаголом, не добавляя объяснения источника необходимости.
theological_decisions:
- issue: Характер необходимости, выраженной δεῖ
  choice: «должно произойти» без уточнения источника необходимости
  alternative: «должно произойти по Божьему замыслу»
  rationale: Связь с исполнением Писаний подразумевает божественную необходимость, однако греческий текст не формулирует это пояснение прямо.
- issue: Связь придаточного с Писаниями
  choice: «согласно которым»
  alternative: «что всё это должно произойти именно так»
  rationale: Этот вариант ясно передаёт содержательную функцию ὅτι и устраняет неестественную для русского языка двусмысленность конструкции, не добавляя нового богословского содержания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка остаётся понятной широкому читателю; архаизмы вроде «сбыться» или «надлежит совершиться» не используются.
