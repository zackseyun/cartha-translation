base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/017.yaml
  text: On the first day of Unleavened Bread[a], the disciples came to Jesus, saying[b], “Where do you want us to prepare for you to eat the Passover?”
translation:
  language: ru
  text: 'В первый день праздника Пресных хлебов[a] ученики подошли к Иисусу и сказали: «Где Ты хочешь, чтобы мы приготовили Тебе пасхальную трапезу[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст буквально говорит: «в первый день Пресных хлебов». Перевод сам по себе не разрешает обсуждаемый вопрос о хронологии пасхальных событий.'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «приготовили Тебе есть Пасху». Слово «Пасха» в этом контексте обозначает пасхальную трапезу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ πρώτῃ τῶν ἀζύμων
  choice: В первый день праздника Пресных хлебов
  rationale: Дательный времени передан естественным русским оборотом «в первый день». Мягкая связка δέ отдельно не выражена, поскольку в русском она здесь не нужна. Субстантивированное τῶν ἀζύμων обозначает праздничный период; слово «праздника» добавлено для ясности смысла.
- source_word: προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ
  choice: ученики подошли к Иисусу
  rationale: «Подошли» точно передаёт направленное движение προσέρχομαι и звучит естественно с дополнением «к Иисусу».
- source_word: λέγοντες
  choice: и сказали
  rationale: Сочинённая конструкция естественнее для современного русского повествования, сохраняя одновременную связь причастия с основным действием.
- source_word: Ποῦ θέλεις ἑτοιμάσωμέν σοι
  choice: Где Ты хочешь, чтобы мы приготовили для Тебя
  rationale: Конструкция с «чтобы» естественно передаёт вопрос с аористным сослагательным ἑτοιμάσωμεν; σοι сохранено как «для Тебя».
- source_word: φαγεῖν τὸ πάσχα
  choice: пасху
  rationale: В контексте приготовления к еде πάσχα обозначает пасхальную трапезу. По-русски «приготовить пасху» способно передать традиционное выражение без тяжеловесного буквального «приготовили для Тебя есть»; значение φαγεῖν раскрывается самим контекстом трапезы и поясняется в сноске.
theological_decisions:
- issue: Хронологическое выражение «первый день Пресных хлебов» и время пасхальной трапезы
  choice: Сохранено прямое указание «в первый день праздника Пресных хлебов» без хронологической гармонизации.
  alternative: «В день перед праздником Пресных хлебов» или «в первый день Пасхи».
  rationale: Греческий текст прямо говорит о первом дне Пресных хлебов; перевод не должен сам разрешать дискуссию о хронологии евангельских событий.
- issue: Значение τὸ πάσχα
  choice: «пасху» с пояснением, что здесь имеется в виду пасхальная трапеза.
  alternative: Основной текст «пасхальную трапезу».
  rationale: Так сохраняется традиционная широта слова πάσχα, которое может обозначать Пасху, пасхальную жертву или трапезу, тогда как контекст ясно указывает на еду.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Местоимение «Ты» в обращении к Иисусу написано с прописной буквы по принятой русской издательской традиции; это орфографический знак уважения, а не внесённое в текст богословское уточнение.
