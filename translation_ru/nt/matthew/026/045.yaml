id: MAT.26.45
reference: Matthew 26:45
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τότε ἔρχεται πρὸς τοὺς ⸀μαθητὰς καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἰδοὺ ἤγγικεν ἡ ὥρα καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/045.yaml
  text: Then he comes to the disciples and says to them[a], “Sleep on now and take your rest. Look, the hour has drawn near[c][b], and the Son of Man is being handed over into the hands of sinners.”
translation:
  language: ru
  text: 'Тогда Он приходит к ученикам и говорит им[a]: «Спите теперь и отдыхайте. Вот, приблизился час[b], и Сын Человеческий предаётся в руки грешников[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вы всё ещё спите и отдыхаете?» Греческую фразу можно понять как риторический вопрос; в основном тексте сохранены её неоднозначность и вероятная ирония.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «настал час»; «час близок».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «выдаётся»; «передаётся». Греческий глагол имеет более широкое значение, чем только «предаётся».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественная временная связка, обозначающая следующий момент повествования.
- source_word: ἔρχεται
  choice: приходит
  rationale: Сохранён исторический презенс, характерный для евангельского повествования и придающий ему непосредственность.
- source_word: πρὸς τοὺς μαθητάς
  choice: к ученикам
  rationale: πρός с винительным падежом обозначает движение к кому-либо; русское «к ученикам» передаёт это естественно.
- source_word: λέγει αὐτοῖς
  choice: говорит им
  rationale: Сохранён исторический презенс и прямое значение выражения.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: Спите теперь и отдыхайте
  rationale: Формально передаёт побудительную поверхность греческой фразы и сохраняет её вероятную иронию либо уступительный оттенок; возможное вопросительное понимание указано в сноске.
- source_word: ἰδοὺ
  choice: Вот
  rationale: Современный и вместе с тем торжественный русский способ привлечь внимание к последующему объявлению.
- source_word: ἤγγικεν ἡ ὥρα
  choice: приблизился час
  rationale: Передаёт перфект ἐγγίζω как наступившую близость часа, не сужая смысл до однозначного «настал».
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшееся русское наименование, сохраняющее важный для контекста титул.
- source_word: παραδίδοται
  choice: предаётся
  rationale: Русское «предаётся» способно обозначать передачу во власть и одновременно сохраняет оттенок предательства; более широкое значение пояснено в сноске.
- source_word: εἰς χεῖρας ἁμαρτωλῶν
  choice: в руки грешников
  rationale: Сохранён ясный и естественный в русском языке образ греческого выражения.
theological_decisions:
- issue: Сила Καθεύδετε ... καὶ ἀναπαύεσθε
  choice: «Спите теперь и отдыхайте» как внешне побудительная фраза с возможной иронией или уступительным смыслом
  alternative: «Вы всё ещё спите и отдыхаете?»
  rationale: Греческая формулировка допускает риторически-вопросительное понимание, но вопросительная пунктуация прямо не выражена. Основной текст сохраняет напряжение, а альтернативу сообщает сноска.
- issue: Значение παραδίδοται в контексте страстей
  choice: «предаётся»
  alternative: «выдаётся» или «передаётся»
  rationale: Выбор сохраняет как конкретный оттенок предательства, так и более широкую передачу во власть грешников, не ограничивая пассивную форму только действием Иуды.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельского повествования. Исторический презенс сохранён. Формулировка речи Иисуса не превращена однозначно в вопрос, чтобы удержать неоднозначность греческого текста.
