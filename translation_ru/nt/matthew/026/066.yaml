lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: Что вы думаете?
  rationale: Оборот с δοκέω и дательным ὑμῖν запрашивает мнение или решение собравшихся. Естественный русский вопрос сохраняет прямоту греческого текста; судебный оттенок передаётся контекстом.
- source_word: οἱ δὲ ἀποκριθέντες εἶπαν
  choice: Они ответили
  rationale: Сочетание причастия ἀποκριθέντες с εἶπαν естественно передаётся одним личным глаголом. δέ здесь служит лёгкой связкой и не требует отдельного союза в современном русском повествовании.
- source_word: ἔνοχος θανάτου
  choice: заслуживает смерти
  rationale: Выражение означает виновность или ответственность, влекущую смерть, и в данном контексте формулирует судебный вердикт. Выбранный вариант понятен современному читателю и не утверждает от лица переводчика действительную виновность Иисуса перед Богом.
- source_word: ἐστίν
  choice: Он …
  rationale: Греческая связка с подразумеваемым подлежащим передана русским местоимением и именным сказуемым, образующими прямое заключение суда.
theological_decisions:
- issue: Судебный характер приговора совета
  choice: Он заслуживает смерти
  alternative: Он повинен смерти; Он подлежит смерти
  rationale: Перевод передаёт вынесенное советом решение, не превращая его в богословское утверждение переводчика о виновности Иисуса. Смысловые варианты и юридическая сила выражения отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык; реплики оформлены как краткий диалог. Формулировка приговора ясная и торжественная, без излишней архаики и без привнесения конфессионального толкования.
