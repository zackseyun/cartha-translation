source:
  edition: SBLGNT
  text: Οἴδατε ὅτι μετὰ δύο ἡμέρας τὸ πάσχα γίνεται, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς τὸ σταυρωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/002.yaml
  text: You know that after two days the Passover is coming[a], and the Son of Man is being handed over to be crucified.
translation:
  language: ru
  text: Вы знаете, что через два дня будет Пасха, и Сын Человеческий будет выдан[a], чтобы Его распяли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет предан». Греческий глагол может обозначать предательство, но в более широком смысле означает «передать» или «выдать во власть».'
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδατε
  choice: Вы знаете
  rationale: Форма οἶδα имеет значение настоящего времени; обращение во множественном числе естественно передано как «вы знаете».
- source_word: μετὰ δύο ἡμέρας
  choice: через два дня
  rationale: μετά с винительным обозначает последующий момент времени; в современном русском «через два дня» точно и естественно передаёт смысл.
- source_word: τὸ πάσχα
  choice: Пасха
  rationale: πάσχα обозначает Пасху; добавление слова «праздник» в греческом тексте отсутствует и не требуется по-русски.
- source_word: γίνεται
  choice: будет
  rationale: В данном контексте γίνομαι указывает на наступление или совершение Пасхи. «Будет Пасха» звучит естественно и сохраняет временной смысл.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшаяся передача самоназвания Иисуса, сохраняющая его библейское и богословское звучание.
- source_word: παραδίδοται
  choice: будет предан
  rationale: Настоящее пассивное употреблено в предсказании близкого события. Русское «предан» сохраняет смысл передачи во власть других, хотя в контексте также может подразумеваться предательство; это отмечено в сноске.
- source_word: εἰς τὸ σταυρωθῆναι
  choice: на распятие
  rationale: Конструкция εἰς с субстантивированным инфинитивом выражает цель или результат; «на распятие» кратко и ясно передаёт назначение передачи.
theological_decisions:
- issue: Передача παραδίδοται в предсказании страстей
  choice: будет предан
  alternative: будет выдан / будет предан врагами
  rationale: Глагол шире понятия предательства и может означать передачу во власть. Формулировка не ограничивает действие одним лишь поступком Иуды и сохраняет напряжение между человеческим предательством и более широким преданием Иисуса на смерть.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-сдержанный. Синтаксис близок к греческому, но естественен для обычного читателя; традиционный титул «Сын Человеческий» сохранён.
