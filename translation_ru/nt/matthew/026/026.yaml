reference: Matthew 26:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐσθιόντων δὲ αὐτῶν λαβὼν ὁ Ἰησοῦς ⸀ἄρτον καὶ ⸀εὐλογήσας ἔκλασεν καὶ ⸂δοὺς τοῖς μαθηταῖς⸃ εἶπεν· Λάβετε φάγετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/026.yaml
  text: While they were eating[a], Jesus took bread, and after blessing it, he broke it and gave it to the disciples and said, “Take, eat[d][c][b]; this is my body.”
translation:
  language: ru
  text: 'Когда они ели[a], Иисус взял хлеб и, благословив[b], преломил его, дал ученикам и сказал: «Возьмите, ешьте[c]: это Моё тело»[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «В то время как они ели».'
    reason: lexical_alternative
  - marker: b
    text: То есть произнеся благословение; это также можно понимать как благодарение Богу над хлебом.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Возьмите и ешьте».'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально по-гречески: «это есть Моё тело». Некоторые понимают это как «это означает (или символизирует) Моё тело», однако перевод сохраняет формулировку исходного текста.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐσθιόντων δὲ αὐτῶν
  choice: Когда они ели
  rationale: Родительный самостоятельный оборот задаёт время происходящего. Такой перевод естественно передаёт одновременность действий; δέ здесь имеет слабую связующую силу и не требует отдельного противительного союза.
- source_word: λαβὼν
  choice: взял
  rationale: Предшествующее аористное причастие естественно передаётся по-русски личной формой глагола в последовательности действий.
- source_word: ἄρτον
  choice: хлеб
  rationale: ἄρτος обычно означает хлеб и в данном контексте может подразумевать хлебную лепёшку или каравай, однако нейтральное «хлеб» точнее и не добавляет невыраженной конкретики.
- source_word: εὐλογήσας
  choice: благословив
  rationale: Причастие передаёт произнесение благословения, не уточняя его грамматический объект. Перевод сохраняет эту сжатость и не отождествляет εὐλογέω с εὐχαριστέω.
- source_word: ἔκλασεν
  choice: преломил его
  rationale: Глагол означает «сломал, разломил». Местоимение «его» естественно восполняет подразумеваемое дополнение — хлеб; «преломил» уместно в контексте разделения хлеба и сохраняет достоинство речи.
- source_word: δοὺς τοῖς μαθηταῖς
  choice: дал ученикам
  rationale: Причастный оборот передан личной формой для плавного русского повествования. Артикль указывает на уже известных учеников; добавлять «Своим» нет необходимости.
- source_word: Λάβετε φάγετε
  choice: Возьмите, ешьте
  rationale: Два следующих подряд аористных повелительных глагола переданы без добавления союза, что сохраняет бессоюзие и выразительный ритм оригинала.
- source_word: τοῦτό ἐστιν
  choice: это
  rationale: В русском именном сказуемом настоящего времени связка «есть» обычно опускается. Формулировка «это Моё тело» прямо передаёт греческое ἐστιν, не заменяя его толкованиями «означает» или «символизирует».
- source_word: τὸ σῶμά μου
  choice: Моё тело
  rationale: σῶμα прямо означает «тело», а притяжательное местоимение передаёт μου. Прописная буква в «Моё» соответствует принятому уважительному оформлению слов Иисуса в данном русском издании.
theological_decisions:
- issue: Евхаристическая формула τοῦτό ἐστιν τὸ σῶμά μου
  choice: «это Моё тело» без толковательного расширения
  alternative: «это означает Моё тело» или «это символизирует Моё тело»
  rationale: В греческом тексте стоит простая связка ἐστιν. Прямой перевод сохраняет богословское напряжение высказывания и не закрепляет в основном тексте какую-либо определённую сакраментальную трактовку.
- issue: Смысл εὐλογήσας
  choice: «благословив» без названного объекта
  alternative: «поблагодарив Бога» или «благословив хлеб»
  rationale: Оригинал не называет дополнения при εὐλογήσας. Выбранная формулировка не решает за читателя, направлено ли действие прежде всего к Богу как благословение-хвала или описывает благословение над хлебом.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским ритмом. «Преломил» сохранено как понятное и уместное для разделения хлеба слово; архаические синтаксические конструкции сведены к минимуму. Бессоюзное «Возьмите, ешьте» передаёт ритм оригинала.
