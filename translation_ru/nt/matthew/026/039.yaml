  text: καὶ ⸀προελθὼν μικρὸν ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ προσευχόμενος καὶ λέγων· Πάτερ μου, εἰ δυνατόν ἐστιν, παρελθάτω ἀπ’ ἐμοῦ τὸ ποτήριον τοῦτο· πλὴν οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/039.yaml
  text: And going a little farther[a], he fell on his face, praying and saying, “My Father, if it is possible, let this cup pass from me; yet not as I will[b], but as you will.”
translation:
  language: ru
  text: 'И, отойдя немного дальше, Он пал лицом к земле[a] и, молясь, говорил: «Отец Мой! Если возможно, пусть минует Меня эта чаша[b]. Но не как Я хочу, а как Ты хочешь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пал ниц».'
    reason: lexical_alternative
  - marker: b
    text: «Чаша» — библейский образ назначенной доли, особенно страдания; ср. Матфея 20:22; 26:42.
    reason: cross_reference
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: отойдя немного дальше
  rationale: Причастие аориста обозначает движение вперёд на небольшое расстояние; «дальше» сохраняет сравнительный оттенок προ- и естественно звучит по-русски.
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ
  choice: Он пал лицом к земле
  rationale: Передаёт телесную позу полного простирания без архаизации; «к земле» естественно выражает смысл греческой идиомы.
- source_word: προσευχόμενος καὶ λέγων
  choice: и, молясь, говорил
  rationale: Сохраняет одновременность молитвы и речи, избегая тяжеловесного буквального сочетания «молясь и говоря».
- source_word: Πάτερ μου
  choice: Отец Мой
  rationale: Естественная русская форма обращения, сохраняющая личную близость и благоговейный регистр без добавочной эмоциональной окраски.
- source_word: εἰ δυνατόν ἐστιν
  choice: если возможно
  rationale: Точно и естественно передаёт условную формулу, не добавляя отсутствующего в греческом указательного местоимения.
- source_word: παρελθάτω ἀπ’ ἐμοῦ
  choice: пусть минует Меня
  rationale: Форма просьбы передаёт повелительное наклонение третьего лица, а глагол «минует» сохраняет образ прохождения чаши мимо молящегося.
- source_word: τὸ ποτήριον τοῦτο
  choice: эта чаша
  rationale: Сохранён буквальный библейский образ чаши, который в контексте обозначает назначенную долю, особенно предстоящее страдание.
- source_word: πλὴν
  choice: но
  rationale: Кратко и естественно вводит решительное ограничение предыдущей просьбы.
- source_word: οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ
  choice: не как Я хочу, а как Ты
  rationale: Передаёт реальное желание Иисуса и его подчинение Отцу, сохраняя выразительный греческий эллипсис во второй части.
theological_decisions:
- issue: Метафора чаши в молитве Иисуса
  choice: В основном тексте сохранён образ «эта чаша».
  alternative: это страдание; эта участь
  rationale: ποτήριον имеет метафорическое библейское значение назначенной доли, нередко страдания и суда. Прямой образ сохраняет межтекстовые связи и не сужает смысл толкованием.
- issue: Желание Иисуса в отношении воли Отца
  choice: «не как Я хочу, а как Ты»
  alternative: не по Моей воле, а по Твоей; не то, чего хочу Я, а то, чего хочешь Ты
  rationale: Такой перевод сохраняет личное волеизъявление Иисуса, его подчинение Отцу и синтаксическую напряжённость оригинала, не устраняя подлинную богословскую глубину текста.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным повествовательным регистром. Заглавные местоимения при обращении к Отцу и упоминании Иисуса соответствуют принятой русской библейской стилистике; эллипсис заключительной фразы сохранён как ясный и выразительный.
