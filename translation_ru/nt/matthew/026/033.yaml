source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Εἰ πάντες σκανδαλισθήσονται ἐν σοί, ⸀ἐγὼ οὐδέποτε σκανδαλισθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/033.yaml
  text: But Peter answered him[a], “Even if all fall away because of you, I will never fall away.”
translation:
  language: ru
  text: 'Но Пётр сказал ему в ответ: «Даже если все отступятся из-за тебя, я никогда не отступлюсь».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поколеблются»; «соблазнятся». Греческий глагол может означать преткнуться, поддаться соблазну или отступиться.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: Но Пётр сказал ему в ответ
  rationale: Причастие ἀποκριθείς с глаголом речи εἶπεν образует обычную повествовательную формулу «ответив, сказал»; по-русски естественно передать её как «сказал в ответ». δέ выражает лёгкое противопоставление предшествующим словам Иисуса и передано союзом «но».
- source_word: Εἰ πάντες
  choice: Даже если все
  rationale: Формальное условное εἰ в контексте подчёркнутого противопоставления Петра всем остальным имеет уступительный оттенок, естественно передаваемый сочетанием «даже если».
- source_word: σκανδαλισθήσονται / σκανδαλισθήσομαι
  choice: отступятся / отступлюсь
  rationale: В данном контексте глагол обозначает вызванную испытанием утрату верности и оставление Иисуса. «Отступиться» передаёт этот сильный смысл, не утверждая окончательности такого отпадения.
- source_word: ἐν σοί
  choice: из-за тебя
  rationale: При σκανδαλίζω сочетание ἐν с личным местоимением указывает на того, в связи с кем или из-за кого происходит преткновение; «из-за тебя» звучит ясно и естественно.
- source_word: ἐγὼ οὐδέποτε
  choice: я никогда
  rationale: Отдельно выраженное ἐγώ подчёркивает противопоставление Петра остальным, а οὐδέποτε является категорическим отрицанием во времени. Русская конструкция «я никогда» сохраняет оба акцента.
theological_decisions:
- issue: Смысл σκανδαλίζω в контексте неверности учеников
  choice: отступиться
  alternative: споткнуться; соблазниться; поколебаться
  rationale: Речь идёт не о физическом падении и не просто об эмоциональной обиде, а о нарушении верности Иисусу под давлением. При этом «отступиться» не решает заранее вопрос о временном или окончательном характере поступка.
translation_notes:
  register: Современный литературный русский язык; речь Петра звучит решительно и категорично. Синтаксис естественный, но сохраняет явное противопоставление между «все» и «я».
