  text: πάλιν ἐκ δευτέρου ἀπελθὼν προσηύξατο λέγων· Πάτερ μου, εἰ οὐ δύναται ⸀τοῦτο ⸀παρελθεῖν ἐὰν μὴ αὐτὸ πίω, γενηθήτω τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/042.yaml
  text: Again[a], a second time he went away and prayed, saying, “My Father, if this cannot pass unless I drink it[b], your will be done.”
translation:
  language: ru
  text: 'И снова, во второй раз, он отошёл и помолился: «Отец мой! Если это[a] не может миновать без того, чтобы я выпил его, пусть исполнится твоя воля».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть чаша страданий, упомянутая в предыдущем стихе; здесь по-гречески сказано только «это» и далее употреблено местоимение.
    reason: cross_reference
  - marker: b
    text: 'Возможный перевод: «Если невозможно, чтобы это миновало, если только я не выпью его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἐκ δευτέρου
  choice: И снова, во второй раз
  rationale: 'Сохранены оба указания на повторность: πάλιν («снова») и ἐκ δευτέρου («во второй раз»), хотя по-русски они отчасти избыточны.'
- source_word: ἀπελθὼν προσηύξατο
  choice: он отошёл и помолился
  rationale: Предшествующее аористное причастие передано сочинённой последовательностью действий, естественной для русского повествования.
- source_word: Πάτερ μου
  choice: Отец мой
  rationale: Прямо передаёт обращение с притяжательным местоимением, сохраняя сыновнюю близость без дополнительной эмоциональной окраски.
- source_word: εἰ οὐ δύναται τοῦτο παρελθεῖν
  choice: Если это не может миновать
  rationale: Сохранены отрицательная возможность, указательное местоимение и значение παρελθεῖν «миновать, пройти»; не добавлено отсутствующее в данном стихе слово «чаша».
- source_word: ἐὰν μὴ αὐτὸ πίω
  choice: пока я не выпью его
  rationale: В данном русском контексте конструкция «пока не» естественно выражает необходимое условие, передаваемое греческим ἐὰν μή; местоимение «его» отсылает к подразумеваемому содержимому образа чаши, не называя чашу прямо.
- source_word: γενηθήτω τὸ θέλημά σου
  choice: пусть исполнится твоя воля
  rationale: «Пусть исполнится» естественно передаёт повелительно-желательное значение формы γενηθήτω и сохраняет связь с формулировкой молитвы в Мф. 6:10.
theological_decisions:
- issue: Называть ли чашу прямо при переводе τοῦτο / αὐτό
  choice: В основном тексте оставить «это» и местоименную отсылку «его»
  alternative: «эта чаша… её»
  rationale: Из ближайшего контекста ясно, что речь идёт о чаше страданий, однако в самом стихе слово ποτήριον отсутствует. Прямое называние чаши перенесено в примечание, чтобы не устранять образную и грамматическую особенность исходного текста.
- issue: Передача молитвенного подчинения воле Отца
  choice: «пусть исполнится твоя воля»
  alternative: «да будет твоя воля»
  rationale: Выбран современный и понятный русский оборот, сохраняющий силу молитвенного пожелания и не ослабляющий добровольное принятие воли Отца.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимения, относящиеся к Иисусу и Отцу, не получают добавочной прописной буквы, которой нет в исходном тексте; прописная в слове «Отец» обусловлена началом прямой речи. Частичная избыточность «снова, во второй раз» намеренно сохранена вслед за греческим текстом.
