  text: καὶ ⸀λαβὼν ποτήριον καὶ εὐχαριστήσας ἔδωκεν αὐτοῖς λέγων· Πίετε ἐξ αὐτοῦ πάντες,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/027.yaml
  text: And having taken a cup and given thanks[a], he gave it to them, saying, “Drink from it[c][b], all of you,”
translation:
  language: ru
  text: 'И, взяв чашу и воздав благодарность, Он дал её им и сказал: «Пейте из неё все вы».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: взяв
  rationale: Аористное причастие обозначает действие, предшествующее главному глаголу; деепричастие естественно передаёт последовательность и сохраняет подчинённую конструкцию.
- source_word: ποτήριον
  choice: чашу
  rationale: В греческом существительное употреблено без артикля. В русском винительный падеж без дополнительных определителей не вынуждает выбирать между значениями «чашу» и контекстуально определённым «эту чашу», поэтому исходная неоднозначность сохраняется без сноски.
- source_word: εὐχαριστήσας
  choice: возблагодарив
  rationale: Передаёт благодарение как действие, предшествующее главному глаголу, не внося значения освящения или благословения предмета.
- source_word: ἔδωκεν
  choice: подал её
  rationale: В данном контексте «подал» естественно описывает передачу чаши ученикам; местоимение «её» явно отсылает к чаше и восполняет подразумеваемое греческое дополнение.
- source_word: αὐτοῖς
  choice: им
  rationale: Прямая и естественная передача дательного косвенного дополнения, относящегося к присутствующим ученикам.
- source_word: λέγων
  choice: и сказал
  rationale: Русская сочинительная конструкция естественнее буквального «говоря» и точно вводит прямую речь, не меняя содержания.
- source_word: Πίετε
  choice: Пейте
  rationale: Форма повелительного наклонения множественного числа прямо и естественно передаёт обращённое ко всей группе повеление.
- source_word: ἐξ αὐτοῦ
  choice: из неё
  rationale: Предлог ἐκ с родительным указывает на источник; женское местоимение согласуется с русским словом «чаша».
- source_word: πάντες
  choice: все вы
  rationale: Явно показывает, что πάντες относится ко всем адресатам повеления, а не к количеству содержимого чаши; постпозиция сохраняет акцент конца греческой фразы.
theological_decisions:
- issue: Возможные евхаристические или сакраментальные оттенки εὐχαριστήσας
  choice: возблагодарив
  alternative: благословив чашу; произнеся благодарственную молитву
  rationale: Глагол означает принесение благодарности. Выбранная формулировка сохраняет его прямой смысл и не привносит в повествование более позднюю специальную терминологию.
- issue: Сфера действия πάντες
  choice: все вы
  alternative: все; выпейте всё
  rationale: По синтаксису πάντες естественнее всего обозначает всех подразумеваемых субъектов повеления. Перевод не превращает слово в указание выпить всё содержимое и не делает дополнительных выводов о практике причастия.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Пара деепричастий передаёт параллельные греческие аористные причастия, а «подал» звучит естественно в сцене трапезы. Заглавное «Он» соответствует распространённой русской библейской издательской норме, не меняя смысла исходного текста.
