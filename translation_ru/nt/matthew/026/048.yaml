  naturalness: «Подал им знак» — естественное современное литературное выражение в данном повествовательном контексте. Формула «Кого я поцелую, это Он» компактна и ясно передаёт опознавательное значение αὐτός ἐστιν.
  terminology: «Предававший Его» уместно передаёт παραδιδοὺς в контексте Иуды; «схватите Его» хорошо передаёт κρατήσατε без неоправданного юридического уточнения. Альтернативное значение σημεῖον следует привязать к слову «знак», а не к формуле опознания.
