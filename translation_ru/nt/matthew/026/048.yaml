  text: ὁ δὲ παραδιδοὺς αὐτὸν ἔδωκεν αὐτοῖς σημεῖον λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/048.yaml
  text: The one betraying him had given them a sign[a], saying, “The one I kiss is he[b]; seize him.”
translation:
  language: ru
  text: 'А предававший Его подал им знак[а], сказав: «Кого я поцелую, это Он; схватите Его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: а
    text: 'Или: «сигнал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδιδοὺς
  choice: предававший
  rationale: В повествовании о страстях глагол означает не нейтральную передачу, а предательство Иуды; причастие настоящего времени передаёт его роль в разворачивающемся событии.
- source_word: ἔδωκεν αὐτοῖς σημεῖον
  choice: заранее условился с ними о знаке
  rationale: Буквально — «дал им знак». В данном контексте речь идёт о предварительно установленном опознавательном знаке; такой перевод естественно передаёт результативный аорист и функцию знака, не меняя его содержания.
- source_word: Ὃν ἂν φιλήσω
  choice: Кого я поцелую
  rationale: Неопределённо-относительная конструкция с ἄν и сослагательным наклонением указывает на человека, которого Иуда обозначит поцелуем.
- source_word: φιλήσω
  choice: поцелую
  rationale: Глагол прямо обозначает поцелуй как опознавательный жест; уточнение «приветствуя» в греческом тексте отсутствует.
- source_word: αὐτός ἐστιν
  choice: Тот и есть
  rationale: Краткая русская формула сохраняет указательно-опознавательный смысл и эмфатическое αὐτός.
- source_word: κρατήσατε
  choice: схватите
  rationale: Повелительная форма κρατέω здесь означает твёрдо взять под стражу или удержать; «схватите» сохраняет физическую силу глагола и не добавляет формально-правового оттенка слова «арестуйте».
theological_decisions:
- issue: Нравственный смысл παραδιδοὺς применительно к Иуде
  choice: предававший
  alternative: передававший Его
  rationale: Ближайший контекст ясно изображает поступок Иуды как предательство. Выбор передаёт повествовательную оценку, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык, сдержанный и повествовательно торжественный. Сохранена компактность прямой речи. Союз δέ передан как «А», без добавления отсутствующего в оригинале временного «теперь».
