  text: ὁ δὲ ἠρνήσατο ⸀ἔμπροσθεν πάντων λέγων· Οὐκ οἶδα τί λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/070.yaml
  text: But he denied it before them all[a], saying, “I do not know what you are saying.”
translation:
  language: ru
  text: 'Но он отрёкся перед всеми, сказав: «Не знаю, о чём ты говоришь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσατο
  choice: отрёкся
  rationale: В контексте рассказа глагол означает, что Пётр отверг прозвучавшее обвинение. Русское «отрёкся» естественно для этой сцены и не требует добавлять в основной текст отсутствующий в греческом прямой объект.
- source_word: ἔμπροσθεν πάντων
  choice: перед всеми
  rationale: Передаёт публичный характер отрицания и буквально соответствует значению выражения «в присутствии всех».
- source_word: λέγων
  choice: сказав
  rationale: Деепричастие естественно передаёт сопутствующее действие греческого причастия и сохраняет плавность повествования.
- source_word: Οὐκ οἶδα
  choice: Не знаю
  rationale: Прямой и естественный русский эквивалент отрицательной формы глагола «знать».
- source_word: τί λέγεις
  choice: о чём ты говоришь
  rationale: В данном контексте это естественная русская передача буквального «что ты говоришь», выражающая заявление Петра, будто он не понимает сказанного.
theological_decisions:
- issue: Характер отречения Петра
  choice: Пётр публично отвергает прозвучавшее обвинение, без уточнения подразумеваемого объекта глагола.
  alternative: «Он отрицал это» или «он отрёкся от Иисуса».
  rationale: В греческом тексте при ἠρνήσατο прямой объект отсутствует. Контекст показывает отрицание обвинения, но перевод не должен конкретизировать его сильнее исходного текста.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified и естественная повествовательная фраза. Местоимение «ты» уместно, поскольку Пётр отвечает одной служанке из предыдущего стиха.
