lexical_decisions:
- source_word: ὑμνήσαντες
  choice: пропев хвалебную песнь
  rationale: Аористное причастие от ὑμνέω обозначает предшествующее основному действию пение хвалы. «Пропев хвалебную песнь» естественно звучит по-русски и соответствует контексту пасхальной трапезы, не уточняя, какой именно текст или сколько псалмов было исполнено.
- source_word: ἐξῆλθον
  choice: они пошли
  rationale: В данном контексте ἐξέρχομαι описывает уход из места трапезы и движение к указанной цели. Русское «пошли» естественно передаёт это действие; буквальное «вышли» без обозначения исходного места звучало бы менее плавно.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: на Елеонскую гору
  rationale: Устоявшееся русское географическое название; предлог «на» естественно передаёт направительное εἰς применительно к горе.
- source_word: καὶ
  choice: И
  rationale: Сохраняет простой повествовательный союз и связь с предшествующим эпизодом, не добавляя отсутствующего в греческом тексте уточнения.
