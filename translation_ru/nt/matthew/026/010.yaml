  source_fidelity: 'Перевод точно передаёт синтаксис и смысл греческого текста: γνοὺς передано как «зная об этом» с допустимым контекстуальным восполнением, δέ — как «но», укоряющий вопрос Τί κόπους παρέχετε τῇ γυναικί — естественным «Зачем вы беспокоите эту женщину?», а εἰς ἐμέ — естественным в данном контексте «для Меня». Завершённость ἠργάσατο корректно выражена формой «сделала».'
