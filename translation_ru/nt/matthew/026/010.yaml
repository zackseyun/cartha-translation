  text: γνοὺς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Τί κόπους παρέχετε τῇ γυναικί; ἔργον γὰρ καλὸν ἠργάσατο εἰς ἐμέ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/010.yaml
  text: But Jesus[a], knowing this, said to them[b], “Why are you causing trouble for the woman? For she has done a beautiful work to me.
translation:
  language: ru
  text: 'Но Иисус, зная об этом, сказал им: «Зачем вы беспокоите эту женщину? Она ведь сделала для Меня прекрасное дело[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доброе дело».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: зная об этом
  rationale: Аористное причастие передаёт сопутствующее обстоятельство; «об этом» естественно восполняет подразумеваемый из контекста предмет знания — недовольство учеников.
- source_word: δὲ
  choice: но
  rationale: Частица обозначает мягкое противопоставление между возмущением учеников и ответом Иисуса.
- source_word: Τί κόπους παρέχετε τῇ γυναικί
  choice: Зачем вы беспокоите эту женщину?
  rationale: Сочетание κόπους παρέχετε означает причинять беспокойство или затруднения. Такой перевод естественен по-русски и сохраняет укоряющую силу вопроса.
- source_word: ἔργον καλὸν
  choice: прекрасное дело
  rationale: καλός выражает не только нравственную доброту, но также красоту, благородство и уместность поступка; «прекрасное дело» сохраняет эту широту значения.
- source_word: ἠργάσατο
  choice: сделала
  rationale: Завершённое действие естественно передаётся русским совершенным видом.
- source_word: εἰς ἐμέ
  choice: для Меня
  rationale: В данном контексте εἰς с обозначением лица естественно выражает направленность поступка на Иисуса и может быть передано как «для Меня».
theological_decisions:
- issue: Оценка поступка женщины
  choice: прекрасное дело
  alternative: доброе дело
  rationale: Основной вариант сохраняет эстетико-нравственную ёмкость καλός и не вводит учения о заслуге; более привычный вариант «доброе дело» указан в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. «Зачем вы беспокоите эту женщину?» звучит естественно и ясно, не ослабляя упрёка. Местоимение «эту» передаёт контекстуальную определённость греческого артикля.
