  terminology: «Прекрасное дело» хорошо передаёт оценочную и эстетико-нравственную широту καλόν. Сноска «доброе дело» уместно сохраняет распространённую лексическую альтернативу. Имена и регистр оформлены последовательно; написание «Меня» в речи об Иисусе соответствует принятой в данном переводе почтительной орфографии и не меняет смысла.
