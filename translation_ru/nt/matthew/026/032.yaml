    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: Но после того, как
  rationale: μετά с субстантивированным инфинитивом обозначает последующее время, а δέ здесь передаёт мягкое противопоставление предшествующему предсказанию об отпадении учеников.
- source_word: τὸ ἐγερθῆναί με
  choice: Я буду воскрешён
  rationale: Аористный инфинитив пассивного залога от ἐγείρω с με как логическим субъектом буквально выражает «после того, как Я буду воскрешён». Пассив сохранён, чтобы не устранять грамматически подразумеваемое, но не названное действующее лицо.
- source_word: προάξω
  choice: Я пойду впереди
  rationale: В данном контексте προάγω означает идти прежде или впереди кого-либо. Формулировка естественна по-русски и не добавляет обязательного значения «вести».
- source_word: ὑμᾶς
  choice: вас
  rationale: Местоимение второго лица множественного числа обозначает учеников, к которым обращается Иисус.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: в Галилею
  rationale: εἰς выражает направленное движение; по-русски естественная передача — «в Галилею».
theological_decisions:
- issue: Форма глагола воскресения в ἐγερθῆναί
  choice: после того, как Я буду воскрешён
  alternative: после того, как Я воскресну
  rationale: Пассивная форма оригинала сохранена, поскольку она может подразумевать действие Бога, не называя Его прямо. Вариант «воскресну» естественнее, но превращает пассивную конструкцию в непереходную.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Заглавное «Я» употреблено в прямой речи Иисуса согласно распространённой русской библейской традиции; синтаксис сохраняет лёгкое противопоставление и пассивную форму оригинала.
