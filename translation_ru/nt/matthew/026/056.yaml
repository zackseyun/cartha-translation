id: MAT.26.56
reference: Matthew 26:56
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῶσιν αἱ γραφαὶ τῶν προφητῶν. τότε οἱ μαθηταὶ πάντες ἀφέντες αὐτὸν ἔφυγον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/056.yaml
  text: But all this has happened so that the Scriptures of the prophets might be fulfilled[a]. Then all the disciples left him and fled.
translation:
  language: ru
  text: Но всё это произошло, чтобы исполнились Писания пророков. Тогда все ученики, оставив Его[a], бежали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покинув Его»; причастие ἀφέντες в этом контексте может иметь более сильный оттенок — оставить на произвол судьбы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Но всё это
  rationale: Естественно отсылает ко всей предшествующей ситуации и передаёт δέ как мягкое противопоставление или переход.
- source_word: γέγονεν
  choice: произошло
  rationale: Совершившееся событие выражено естественным русским глаголом; в данном контексте результативность перфекта ясна из связи с исполнением Писаний.
- source_word: ἵνα πληρωθῶσιν
  choice: чтобы исполнились
  rationale: Сохраняет целевое или результативное значение конструкции с ἵνα, не устраняя присущей ей смысловой напряжённости.
- source_word: αἱ γραφαὶ τῶν προφητῶν
  choice: Писания пророков
  rationale: «Писания» обозначает священные тексты, а краткий родительный оборот не уточняет сверх греческого текста, написаны они пророками или возвещены через них.
- source_word: τότε
  choice: Тогда
  rationale: Точно и естественно обозначает последующее событие повествования.
- source_word: οἱ μαθηταὶ πάντες
  choice: все ученики
  rationale: Передаёт подчеркнутую всеобщность πάντες без добавления отсутствующего в греческом притяжательного местоимения.
- source_word: ἀφέντες αὐτὸν
  choice: оставив Его
  rationale: Сохраняет причастную конструкцию и основной смысл «оставить»; возможный более сильный оттенок оставления на произвол судьбы отмечен в сноске.
- source_word: ἔφυγον
  choice: бежали
  rationale: Кратко и весомо передаёт повествовательный аорист от φεύγω в значении бегства.
theological_decisions:
- issue: Исполнение пророческих Писаний
  choice: чтобы исполнились Писания пророков
  alternative: чтобы сбылось написанное пророками
  rationale: Сохранена явная формула исполнения и множественное число «Писания», важные для Матфея; перевод не сводит родительный оборот к одному истолкованию.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным повествовательным ритмом. Заглавная буква в «Его» соответствует традиционному уважительному написанию при отнесении к Иисусу; смысл исходного текста от неё не зависит.
