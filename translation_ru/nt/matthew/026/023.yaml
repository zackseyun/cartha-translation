source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ὁ ἐμβάψας μετ’ ἐμοῦ ⸂τὴν χεῖρα ἐν τῷ τρυβλίῳ⸃ οὗτός με παραδώσει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/023.yaml
  text: He answered[b][a], “The one who dipped his hand with me in the bowl—this one will betray me.”
translation:
  language: ru
  text: 'Он ответил: «Тот, кто вместе со Мной опустил руку в блюдо, — тот Меня предаст[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выдаст Меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Он ответил
  rationale: Обычное греческое сочетание причастия с личной формой глагола естественно передаётся одним русским глаголом; буквальное «ответив, сказал» здесь тяжеловесно.
- source_word: Ὁ ἐμβάψας
  choice: Тот, кто … опустил
  rationale: Аористное причастие обозначает совершённое опознавательное действие. «Опустил» естественно сочетается с рукой и не добавляет отсутствующего в тексте указания на конкретную пищу или соус.
- source_word: μετ’ ἐμοῦ
  choice: вместе со Мной
  rationale: Передаёт значение совместности у μετά с родительным падежом и подчёркивает одновременное участие в общей трапезе.
- source_word: τὴν χεῖρα
  choice: руку
  rationale: В русском языке принадлежность руки действующему лицу очевидна из конструкции, поэтому притяжательное местоимение не требуется.
- source_word: ἐν τῷ τρυβλίῳ
  choice: в блюдо
  rationale: τρύβλιον обозначает сосуд для пищи — блюдо или миску. «Блюдо» является понятным и достаточно широким соответствием.
- source_word: οὗτός
  choice: тот
  rationale: Повтор указательного «тот» после придаточного сохраняет эмфатическую силу греческого οὗτός и естественно звучит по-русски.
- source_word: παραδώσει
  choice: предаст
  rationale: В контексте выдачи Иисуса глагол несёт смысл предательской передачи; «предаст» кратко и естественно передаёт этот контекстуальный оттенок.
theological_decisions:
- issue: Передача παραδίδωμι в контексте поступка Иуды
  choice: предаст
  alternative: выдаст / передаст в руки
  rationale: Глагол буквально может означать передачу или выдачу, но в данном повествовательном и межличностном контексте речь идёт о предательстве. Основной текст передаёт контекстуальный смысл, а более буквальная возможность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис прямой речи сохраняет эмфатический повтор «тот … тот». Местоимение «Мной/Меня» написано с прописной буквы в соответствии с распространённой русской библейской издательской нормой.
