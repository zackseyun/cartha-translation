  source_fidelity: 'Текст точно передаёт составной субъект («первосвященники… и весь совет»), продолжающийся поиск, судебную направленность свидетельства «против Иисуса» и целевую конструкцию: добиться его смерти. «Предать его смерти» — допустимое литературное соответствие θανατώσωσιν, не уточняющее способ смерти.'
  naturalness: Фраза грамматически и стилистически естественна для современного литературного русского с уместным возвышенно-судебным регистром. Постпозитивное «же» сдержанно передаёт δέ. «Лжесвидетельства» несколько книжно, но ясно, точно и уместно в данном контексте.
  terminology: «Первосвященники», «весь совет» и пояснение «Синедрион» употреблены последовательно и без ненужной конфессиональной интерпретации. Примечание к «лжесвидетельства» корректно отмечает более развернутый вариант перевода. Якоря [a] и [b] стоят после соответствующих слов и согласованы с примечаниями.
