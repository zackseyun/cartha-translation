source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς ⸀καὶ τὸ συνέδριον ὅλον ἐζήτουν ψευδομαρτυρίαν κατὰ τοῦ Ἰησοῦ ὅπως ⸂αὐτὸν θανατώσωσιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/059.yaml
  text: The chief priests and the whole council were seeking false testimony against Jesus so that they might put him to death[b][a],
translation:
  language: ru
  text: Первосвященники же и весь совет[a] искали лжесвидетельства[b] против Иисуса, чтобы предать его смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть весь Синедрион — иудейский руководящий совет.
    reason: cultural_note
  - marker: b
    text: 'Или: «ложных свидетельских показаний».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: же
  rationale: Постпозитивная частица естественно передаёт мягкий повествовательный переход, не усиливая его до резкого противопоставления.
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся обозначение представителей высшего священнического руководства; множественное число не означает, что все они одновременно занимали должность единственного действующего первосвященника.
- source_word: συνέδριον ὅλον
  choice: весь совет
  rationale: Понятный перевод названия иудейского руководящего совета; «весь» прямо передаёт ὅλον. Традиционное название «Синедрион» дано в примечании.
- source_word: ἐζήτουν
  choice: искали
  rationale: Несовершенный вид естественно передаёт продолжавшиеся и целенаправленные поиски.
- source_word: ψευδομαρτυρίαν
  choice: лжесвидетельства
  rationale: Слово точно и кратко передаёт ложное свидетельство в судебном контексте, не сводя значение к личности свидетеля.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: против Иисуса
  rationale: Передаёт направленность обвинительного свидетельства против Иисуса в судебном контексте.
- source_word: ὅπως
  choice: чтобы
  rationale: Естественно выражает цель последующих действий.
- source_word: αὐτὸν θανατώσωσιν
  choice: предать его смерти
  rationale: Сохраняет формальный оттенок намерения добиться смерти Иисуса, не конкретизируя способ и не добавляя более узкое понятие официальной казни.
theological_decisions:
- issue: Судебный характер намерения руководителей
  choice: Показан продолжительный поиск ложного свидетельства с целью предать Иисуса смерти.
  alternative: 'Можно было бы сказать: «искали ложных показаний, чтобы убить его».'
  rationale: Несовершенный вид ἐζήτουν и целевая конструкция ὅπως…θανατώσωσιν изображают сознательные, продолжавшиеся действия. Формулировка сохраняет нравственное и судебное напряжение текста, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством судебно-повествовательного контекста. Порядок «первосвященники же» сохраняет мягкий переход δὲ без добавления явного временного наречия. Местоимение «его» дано со строчной буквы согласно общим нормам современного русского текста.
