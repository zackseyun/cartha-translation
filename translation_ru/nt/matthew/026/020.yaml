  source_fidelity: Точно переданы временной оборот Ὀψίας δὲ γενομένης, совместность μετά с родительным падежом и πλήная форма τῶν δώδεκα μαθητῶν. «Возлёг за столом» корректно отражает ἀνέκειτο — возлежание во время трапезы, а не обычное сидение. Подлежащее «Иисус» обоснованно восстанавливается из ближайшего контекста.
