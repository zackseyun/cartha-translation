lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Когда настал вечер
  rationale: Независимый родительный оборот задаёт время действия. Формулировка естественна для современного русского языка и точно передаёт временное значение.
- source_word: ἀνέκειτο
  choice: возлёг за столом
  rationale: Глагол обозначает положение полулёжа за трапезой по древнему обычаю. «За столом» эксплицирует подразумеваемую обеденную обстановку, не меняя смысла.
- source_word: μετὰ
  choice: с
  rationale: Предлог с родительным падежом прямо выражает совместность; простое русское «с» точно и естественно.
- source_word: τῶν δώδεκα μαθητῶν
  choice: с двенадцатью учениками
  rationale: Основной текст SBLGNT содержит μαθητῶν, поэтому слово следует перевести. «Ученики» — точный и устоявшийся евангельский эквивалент μαθητής.
- source_word: подразумеваемое подлежащее ἀνέκειτο
  choice: Иисус
  rationale: В греческом подлежащее восстанавливается из контекста. Явное имя устраняет неестественную для отдельного русского стиха неопределённость, не добавляя нового участника.
