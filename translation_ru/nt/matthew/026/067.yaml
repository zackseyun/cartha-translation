  text: τότε ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ καὶ ἐκολάφισαν αὐτόν, οἱ δὲ ἐράπισαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/067.yaml
  text: Then they spat in his face and struck him with their fists[c][b][a], and others slapped him.
translation:
  language: ru
  text: Тогда они плюнули Ему в лицо и били Его кулаками[a], а другие давали Ему пощёчины[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ударяли Его»; греческий глагол обычно подразумевает удары кулаком.'
    reason: lexical_alternative
  - marker: b
    text: Греческий глагол обычно означает удары открытой ладонью.
    reason: lexical_clarification
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Наречие обозначает следующий момент повествования; «тогда» естественно и кратко передаёт последовательность событий.
- source_word: ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ
  choice: плюнули Ему в лицо
  rationale: Греческое выражение буквально описывает плевок, направленный прямо в лицо; русский оборот «плюнуть в лицо» естественно передаёт и действие, и его оскорбительный характер.
- source_word: ἐκολάφισαν αὐτόν
  choice: били Его кулаками
  rationale: Глагол κολαφίζω указывает на удары кулаком; выбранная формулировка конкретна, современна и не смягчает физическое насилие.
- source_word: οἱ δὲ ἐράπισαν
  choice: а другие давали Ему пощёчины
  rationale: Субстантивированное οἱ в сочетании с δέ обозначает другую часть участников, а ῥαπίζω обычно описывает удар открытой ладонью. Объект «Ему» восстановлен из ближайшего контекста.
- source_word: δέ
  choice: а
  rationale: Союз отмечает переход к другой группе и иному виду ударов; русское «а» естественно сохраняет это лёгкое противопоставление.
theological_decisions:
- issue: Описание унижения и физического насилия над Иисусом
  choice: 'Передать действия конкретно: плевок в лицо, удары кулаками и пощёчины.'
  alternative: Обобщить словами «издевались над Ним» или «избивали Его».
  rationale: Исходный текст намеренно перечисляет конкретные оскорбительные и насильственные действия; обобщение ослабило бы повествовательную силу стиха.
translation_notes:
  register: Современный литературный русский язык без архаизмов. Заглавная буква в местоимении «Ему» соответствует принятому благоговейному библейскому регистру. Формулировка сохраняет краткость, конкретность и суровость исходного повествования.
