  text: τότε ἤρξατο καταθεματίζειν καὶ ὀμνύειν ὅτι Οὐκ οἶδα τὸν ἄνθρωπον. καὶ ⸀εὐθέως ἀλέκτωρ ἐφώνησεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/074.yaml
  text: Then he began to curse and to swear[a], “I do not know the man.” And immediately a rooster crowed.
translation:
  language: ru
  text: 'Тогда он начал призывать проклятия и клясться[a]: «Я не знаю этого человека». И тотчас пропел петух.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начал навлекать проклятия и клясться». Вероятно, Пётр призывал проклятие на себя, чтобы подкрепить своё отречение.'
    reason: Поясняет значение καταθεματίζειν и вероятный самозаклятельный смысл, не утверждая прямо не названный в греческом тексте объект проклятия.
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественно передаёт последовательность событий в повествовании.
- source_word: ἤρξατο
  choice: начал
  rationale: Сохраняет начинательное значение конструкции с инфинитивами и подчёркивает усиление отречения.
- source_word: καταθεματίζειν
  choice: призывать проклятия
  rationale: Передаёт значение произнесения или навлечения проклятия, не сводя выражение к брани и не добавляя в основной текст прямо не выраженное дополнение «на себя».
- source_word: ὀμνύειν
  choice: клясться
  rationale: Обозначает принесение клятвы и естественно сочетается в русском с последующим прямым высказыванием.
- source_word: ὅτι
  choice: двоеточие и прямая речь
  rationale: Союз вводит содержание клятвенного заявления; по-русски оно ясно передаётся прямой речью.
- source_word: Οὐκ οἶδα
  choice: Я не знаю
  rationale: Прямо передаёт отрицание знания или знакомства.
- source_word: τὸν ἄνθρωπον
  choice: этого человека
  rationale: В данном контексте указательное «этого» звучит естественно и обозначает конкретного человека, о котором шла речь, хотя буквально стоит определённая группа «человека».
- source_word: καὶ εὐθέως
  choice: И тотчас
  rationale: Сохраняет немедленность исполнения предсказания и повествовательную связь.
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: пропел петух
  rationale: Устойчивое и естественное русское обозначение крика петуха; отсутствие артикля допускает обычную русскую конструкцию с постпозицией подлежащего.
theological_decisions:
- issue: Смысл καταθεματίζειν при отречении Петра
  choice: В основном тексте — «призывать проклятия», без явно названного объекта; в сноске указана вероятная самозаклятельная направленность.
  alternative: «проклинать» (в общем смысле), «навлекать на себя проклятия» или понимание как проклятия Иисуса
  rationale: Сочетание с ὀμνύειν указывает на усиленную клятву, вероятно с призыванием проклятия на себя в случае лжи. Однако греческий текст не называет объект явно, поэтому основной текст сохраняет эту недосказанность и не создаёт впечатления, будто Пётр проклинал Иисуса.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Призывать проклятия» точнее, чем разговорное «ругаться», а «клясться» естественно передаёт торжественное заверение. Маркер [a] поставлен непосредственно после сочетания, к которому относится пояснение.
