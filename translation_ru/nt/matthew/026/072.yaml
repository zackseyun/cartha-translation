  text: 'And again he denied it with an oath: “I do not know the man.”[a]'
translation:
  language: ru
  text: 'И снова он с клятвой отрёкся: «Я не знаю этого человека».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет простую повествовательную связь, не добавляя более выраженного временного оттенка.
- source_word: πάλιν
  choice: снова
  rationale: Естественно и прямо указывает на повторение отречения Петра.
- source_word: ἠρνήσατο
  choice: он отрёкся
  rationale: В данном контексте глагол обозначает отречение, то есть отрицание связи с Иисусом. Русское «отрёкся» передаёт это точнее и естественнее, чем общее «отрицал».
- source_word: μετὰ ὅρκου
  choice: поклявшись
  rationale: Передаёт сопровождающую отречение клятву и звучит естественно по-русски, не создавая впечатления официальной судебной присяги.
- source_word: ὅτι
  choice: ':'
  rationale: Греческий союз вводит содержание отречения; в русском прямая речь после двоеточия естественно передаёт ту же функцию.
- source_word: Οὐκ οἶδα
  choice: Я не знаю
  rationale: Прямо и без усиления передаёт отрицание знания.
- source_word: τὸν ἄνθρωπον
  choice: этого человека
  rationale: В русском указательное местоимение естественно обозначает уже упомянутого конкретного человека; слово «человека» сохраняет дистанцирующую формулировку Петра и не заменяет её именем Иисуса.
theological_decisions:
- issue: Обозначение Иисуса словами τὸν ἄνθρωπον в отречении Петра
  choice: «этого человека»
  alternative: «его» или «Иисуса»
  rationale: Сохранено явное слово «человек», передающее дистанцирование Петра. Замена на имя Иисуса или местоимение сгладила бы риторическую силу исходной формулировки.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и повествовательная. «Поклявшись» естественно передаёт клятву без оттенка официальной присяги, а «этого человека» сохраняет дистанцирующий характер слов Петра.
