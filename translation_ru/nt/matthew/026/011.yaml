  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/011.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: ru
  text: Ведь бедные всегда с вами, а Я — не всегда.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντοτε
  choice: всегда
  rationale: Естественно передаёт постоянную доступность и сохраняет повтор ключевого наречия в обеих частях стиха.
- source_word: γὰρ
  choice: ведь
  rationale: Обозначает объяснительную связь с предыдущим высказыванием; «ведь» звучит естественно в современной русской речи.
- source_word: τοὺς πτωχοὺς
  choice: бедные
  rationale: Субстантивированное прилагательное во множественном числе обозначает бедных людей как группу; русский эквивалент не требует поясняющего существительного.
- source_word: ἔχετε μεθ’ ἑαυτῶν
  choice: с вами
  rationale: Греческое сочетание означает присутствие рядом, а не владение. В первой части по-русски естественно опустить глагол «иметь» и выразить наличие именной конструкцией.
- source_word: ἐμὲ δὲ οὐ πάντοτε ἔχετε
  choice: а Я не всегда буду с вами
  rationale: Будущее время в русском естественно передаёт подразумеваемое ограничение дальнейшего физического присутствия Иисуса; «а» ясно выражает контраст, не делая его излишне резким.
theological_decisions:
- issue: Смысл противопоставления присутствия Иисуса и бедных
  choice: Сохранён временной контраст между постоянным присутствием бедных и ограниченным временем физического присутствия Иисуса среди учеников.
  alternative: Понять слова как умаление обязанности заботиться о бедных.
  rationale: Греческий текст противопоставляет продолжительность доступности, но не даёт основания считать заботу о бедных менее важной.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и понятная формулировка. Заглавная буква в «Я» следует принятой русской библейской типографической традиции для речи Иисуса. Синтаксическая асимметрия («бедные всегда с вами» / «Я не всегда буду с вами») необходима для естественного русского звучания и точно передаёт смысл греческого ἔχετε как присутствия, а не обладания.
