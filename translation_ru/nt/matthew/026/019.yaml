base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/019.yaml
  text: And the disciples did as Jesus had directed them[a], and they prepared the Passover.
translation:
  language: ru
  text: Ученики сделали так, как велел им Иисус, и приготовили Пасху[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
