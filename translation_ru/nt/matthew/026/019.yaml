lexical_decisions:
- source_word: ἐποίησαν
  choice: сделали всё так
  rationale: В сочетании с ὡς συνέταξεν глагол передаёт исполнение данных указаний; «сделали всё так» естественно выражает соответствие поручению, не добавляя нового содержания.
- source_word: οἱ μαθηταὶ
  choice: ученики
  rationale: Устоявшийся и точный русский эквивалент μαθηταί в Евангелиях.
- source_word: ὡς
  choice: так, как
  rationale: Передаёт значение соответствия образцу или указанию и естественно звучит по-русски.
- source_word: συνέταξεν
  choice: велел
  rationale: Передаёт авторитетное распоряжение Иисуса в данном контексте; форма прошедшего времени вместе с последовательностью повествования ясно показывает, что указание было дано ранее.
- source_word: ἡτοίμασαν
  choice: приготовили
  rationale: Прямой и идиоматичный эквивалент ἑτοιμάζω в контексте приготовления к празднованию.
- source_word: τὸ πάσχα
  choice: Пасху
  rationale: Сохраняет широту греческого πάσχα, которое может обозначать праздник, пасхальную трапезу или связанное с ней жертвенное животное; контекстуальная конкретизация вынесена в сноску.
- source_word: ὁ Ἰησοῦς
  choice: Иисус
  rationale: Традиционная русская форма имени, уместная в современном литературном переводе Библии.
theological_decisions:
- issue: Объём значения τὸ πάσχα
  choice: Пасху
  alternative: пасхальную трапезу; пасхального ягнёнка
  rationale: Контекст указывает на приготовления к пасхальной трапезе, однако греческое выражение не уточняет объект столь узко. Основной текст сохраняет смысловую широту оригинала, а сноска разъясняет вероятный контекстуальный смысл.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, повествовательная и dignified. Синтаксис «сделали всё так, как велел» естественно передаёт исполнение указаний, а термин «Пасха» сохраняет намеренную широту оригинала.
