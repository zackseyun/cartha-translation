  text: But when the disciples saw it[a], they were indignant, saying, “Why this waste?”
translation:
  language: ru
  text: 'Но ученики, увидев это, возмутились и сказали: «К чему такая трата?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: Увидев это
  rationale: Аористное причастие естественно передаётся русским деепричастием; «это» восполняет подразумеваемый из контекста поступок женщины.
- source_word: δὲ
  choice: связь передана сменой реакции без отдельного союза
  rationale: δέ обозначает лёгкий повествовательный переход или контраст. В русском начало «Увидев это» естественно вводит противопоставленную реакцию, тогда как «но, увидев» здесь звучало бы тяжеловесно.
- source_word: οἱ μαθηταὶ
  choice: ученики
  rationale: Обычное и точное евангельское обозначение μαθηταί; притяжательное «его» в греческом тексте отсутствует.
- source_word: ἠγανάκτησαν
  choice: возмутились
  rationale: Глагол выражает сильное неодобрение и негодование; «возмутились» естественно сохраняет этот оттенок в современном русском.
- source_word: λέγοντες
  choice: и сказали
  rationale: Сочинительная конструкция с личной формой звучит по-русски естественнее буквального «говоря» и сохраняет связь речи с возмущением учеников.
- source_word: Εἰς τί
  choice: К чему
  rationale: Передаёт вопрос о цели или смысле действия и сохраняет более буквальную направленность выражения, чем общее «зачем».
- source_word: ἡ ἀπώλεια αὕτη
  choice: такая трата
  rationale: В контексте израсходованного дорогого благовония ἀπώλεια означает напрасную трату. «Такая трата» естественно передаёт указательное αὕτη и неодобрительный тон.
