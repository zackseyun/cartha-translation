  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τότε λέγει ⸀αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/038.yaml
  text: Then he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch with me.”
translation:
  language: ru
  text: 'Тогда Он говорит им: «Душа Моя охвачена смертельной скорбью[a]». Останьтесь здесь и бодрствуйте[c] со Мной».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глубоко опечалена», «переполнена скорбью». Буквально: «до смерти»; то есть скорбь достигает смертельной степени.'
    reason: Передаёт лексический диапазон περίλυπος и поясняет идиоматическую силу ἕως θανάτου без неестественного временного прочтения.
  - marker: c
    text: 'Или: «не спите». Греческий глагол может означать и буквальное бодрствование, и бдительность.'
    reason: Сохраняет смысловую широту γρηγορεῖτε в непосредственном контексте.
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественно передаёт временную связь и последовательность событий.
- source_word: λέγει
  choice: говорит
  rationale: Сохранено историческое настоящее греческого текста, придающее повествованию живость.
- source_word: αὐτοῖς
  choice: им
  rationale: Прямое и естественное соответствие дательному косвенного объекта.
- source_word: Περίλυπός
  choice: объята глубокой скорбью
  rationale: Передаёт чрезвычайную силу печали и при этом естественно сочетается в русском языке с подлежащим «душа».
- source_word: ἡ ψυχή μου
  choice: Душа Моя
  rationale: Сохраняет явно употреблённое слово ψυχή и выражает глубокое внутреннее страдание Иисуса, не навязывая тексту специальной антропологической схемы.
- source_word: ἕως θανάτου
  choice: до самой смерти
  rationale: Передаёт предельную степень скорби и сохраняет сжатость исходного выражения; усилительная частица «самой» делает оборот естественным и весомым по-русски.
- source_word: μείνατε
  choice: Останьтесь
  rationale: Точно передаёт повеление оставаться в указанном месте и соответствует торжественному, но современному регистру.
- source_word: ὧδε
  choice: здесь
  rationale: Прямое естественное соответствие наречию места.
- source_word: γρηγορεῖτε
  choice: бодрствуйте
  rationale: Сохраняет одновременно значения физического бодрствования и бдительности; в контексте Гефсимании оба оттенка существенны.
- source_word: μετ’ ἐμοῦ
  choice: со Мной
  rationale: Прямо передаёт значение сопровождения и совместного пребывания.
theological_decisions:
- issue: Передача ψυχή в словах Иисуса
  choice: Душа Моя
  alternative: Я объят глубокой скорбью
  rationale: Сохранение существительного ψυχή позволяет услышать формулировку самого текста и полноту подлинного человеческого страдания Иисуса, не превращая выражение в техническое учение о составе человека.
- issue: Смысл γρηγορεῖτε в данном контексте
  choice: бодрствуйте
  alternative: не спите; оставайтесь начеку
  rationale: Глагол может обозначать как буквальное бодрствование, так и настороженную бдительность. Основной вариант сохраняет оба оттенка, а сноска ясно указывает буквальный смысл.
- issue: Сила выражения ἕως θανάτου
  choice: до самой смерти
  alternative: до такой степени, что могу умереть
  rationale: 'Краткий перевод сохраняет напряжённость и некоторую неоднозначность греческой фразы: она может обозначать и предельную, смертельную скорбь, и скорбь до точки смерти, не уточняя причинную связь.'
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной торжественностью. Историческое настоящее сохранено. Заглавные буквы в местоимениях, относящихся к Иисусу, соответствуют принятому русскому библейскому издательскому регистру; синтаксис остаётся ясным для обычного современного читателя.
