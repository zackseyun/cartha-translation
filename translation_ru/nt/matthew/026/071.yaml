base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/071.yaml
  text: But when he had gone out to the gateway, another woman saw him and says to those there, “This man was with Jesus the Nazarene.”
translation:
  language: ru
  text: 'Когда же он вышел к воротам, его увидела другая женщина и говорит находившимся там: «Этот человек был с Иисусом Назарянином».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυλών
  choice: ворота
  rationale: Здесь слово обозначает входные ворота или проход при дворе; «к воротам» естественно передаёт направление εἰς τὸν πυλῶνα без излишней архитектурной конкретизации.
- source_word: λέγει
  choice: говорит
  rationale: Сохранено историческое настоящее греческого текста, делающее рассказ более живым и соответствующее исходной форме.
- source_word: ἄλλη
  choice: другая женщина
  rationale: Женский род формы указывает на другую женщину; явное существительное необходимо для естественного русского текста и согласуется с контекстом.
- source_word: τοῦ Ναζωραίου
  choice: Назарянином
  rationale: Естественное русское обозначение Иисуса как происходящего из Назарета; сохраняет идентифицирующий характер эпитета.
