source:
  edition: SBLGNT
  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἀπελθὼν⸃ προσηύξατο ἐκ τρίτου τὸν αὐτὸν λόγον εἰπὼν ⸀πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/044.yaml
  text: And leaving them again[a], he went away and prayed a third time, saying the same thing again.
translation:
  language: ru
  text: И, снова оставив их, Он отошёл и в третий раз помолился, вновь сказав то же самое.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сказав вновь то же слово (изречение)».'
    reason: лексическая альтернатива для греч. τὸν αὐτὸν λόγον; основной текст передаёт значение без уточнения, что повтор был дословным.
lexical_decisions:
- source_word: ἀφεὶς αὐτοὺς
  choice: оставив их
  rationale: 'Причастие аориста передаёт сопутствующее предшествующее действие: Иисус оставляет учеников и отходит от них.'
- source_word: πάλιν ἀπελθὼν
  choice: снова… отошёл
  rationale: Первое πάλιν отмечает повторение ухода, а ἀπέρχομαι — движение прочь от учеников. Разнесение слов в русском предложении звучит естественно.
- source_word: προσηύξατο ἐκ τρίτου
  choice: помолился в третий раз
  rationale: Устойчивое современное выражение ясно передаёт третье совершение молитвы.
- source_word: τὸν αὐτὸν λόγον εἰπὼν
  choice: произнеся те же слова
  rationale: Единственное число λόγον здесь обозначает сказанное, то есть содержание или формулировку молитвы; русское множественное «слова» естественно передаёт повторение произнесённой молитвы.
- source_word: πάλιν
  choice: вновь
  rationale: Последнее πάλιν сохранено, несмотря на смысловую повторность, поскольку оно присутствует в SBLGNT и подчёркивает повторение сказанного.
theological_decisions:
- issue: Повторение молитвы Иисуса
  choice: Сохранены и третий случай молитвы, и указание на повторение тех же слов.
  alternative: Опустить последнее «вновь» как стилистически избыточное или передать λόγον как «то же самое».
  rationale: Греческий текст содержит два употребления πάλιν и прямо сообщает о повторении прежнего сказанного; перевод сохраняет этот акцент, не уточняя сверх текста степень дословности повторения.
translation_notes:
  register: Современный литературный русский язык с ясным, повествовательным и достойным звучанием. «Снова» и «вновь» различены стилистически, чтобы сохранить оба πάλιν без тяжёлой тавтологии. Местоимение «Он» написано с прописной буквы согласно принятой русской библейской издательской традиции.
