- source_word: εὐθέως
  choice: тотчас
  rationale: Передаёт незамедлительность действия и сохраняет напряжённый темп повествования без архаичности.
- source_word: προσελθὼν τῷ Ἰησοῦ
  choice: подойдя к Иисусу
  rationale: Естественно передаёт предшествующее главному глаголу приближение Иуды к Иисусу.
- source_word: Χαῖρε
  choice: Приветствую Тебя
  rationale: В данном контексте это обычная формула приветствия; выбранный вариант звучит достойно и современно, не превращая её в богословское восклицание.
- source_word: ῥαββί
  choice: Равви
  rationale: Сохраняет употреблённое в греческом тексте семитское обращение и его повествовательную окраску.
- source_word: κατεφίλησεν
  choice: поцеловал
  rationale: Основной текст передаёт само действие без излишней конкретизации, тогда как возможная усилительная или повторительная сила приставочного глагола отмечена в сноске.
- source_word: αὐτόν
  choice: Его
  rationale: Местоимение относится к Иисусу; прописная буква соответствует принятой русской библейской типографической традиции.
theological_decisions:
- issue: Смысл приветствия Χαῖρε
  choice: Приветствую Тебя
  alternative: Радуйся; здравствуй
  rationale: Здесь слово функционирует как общепринятое приветствие, а не как призыв к радости или особое исповедание. Ирония предательства сохраняется в самом повествовании.
- issue: Сила глагола κατεφίλησεν
  choice: поцеловал
  alternative: крепко поцеловал; стал целовать
  rationale: Глагол может выражать усиленное или повторное действие, однако степень этой нюансировки не вполне определённа. Неоднозначность сохранена посредством сноски, а не разрешена в основном тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Инверсия «И тотчас» сохраняет связность с предшествующим контекстом; обращение «Равви» оставлено без поясняющего перевода.
