base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/034.yaml
  text: Jesus said to him, “Truly I tell you, in this very night, before a rooster crows, you will deny me three times.”
translation:
  language: ru
  text: 'Иисус сказал ему: «Истинно говорю тебе: этой самой ночью[a], прежде чем пропоёт петух, ты трижды отречёшься от Меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сегодня ночью». Буквально: «этой ночью»; указательное местоимение подчёркивает именно эту ночь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Иисус сказал ему
  rationale: Естественный для современного русского повествования порядок слов; простая форма «сказал» не усиливает значение исходного глагола.
- source_word: Ἀμὴν λέγω σοι
  choice: Истинно говорю тебе
  rationale: Сохраняет торжественную утвердительную формулу Иисуса и прямое личное обращение, оставаясь понятным современному читателю.
- source_word: ἐν ταύτῃ τῇ νυκτί
  choice: этой самой ночью
  rationale: Естественная русская передача обстоятельства времени с сохранением усилительного оттенка указательного местоимения ταύτῃ.
- source_word: πρὶν ἀλέκτορα φωνῆσαι
  choice: прежде чем пропоёт петух
  rationale: Русская придаточная конструкция естественно передаёт греческий оборот с инфинитивом; «пропоёт» идиоматично обозначает крик петуха.
- source_word: τρὶς
  choice: трижды
  rationale: Краткое, современное и литературное русское соответствие, не имеющее здесь архаического оттенка.
- source_word: ἀπαρνήσῃ με
  choice: ты трижды отречёшься от Меня
  rationale: «Отречься от» точно и традиционно передаёт личное отрицание связи с Иисусом, не добавляя более сильного значения окончательного отвержения.
theological_decisions:
- issue: Передача вводной формулы Ἀμὴν λέγω σοι
  choice: Истинно говорю тебе
  alternative: Аминь, говорю тебе; уверяю тебя
  rationale: Выбранный вариант сохраняет торжественный и авторитетный характер слов Иисуса, но не привносит в основной текст специальных литургических ассоциаций.
- issue: Значение ἀπαρνήσῃ με
  choice: отречёшься от Меня
  alternative: откажешься от Меня; скажешь, что не знаешь Меня
  rationale: Формулировка сохраняет ёмкость греческого глагола и не конкретизирует заранее точную словесную форму будущего отрицания.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Формула «Истинно говорю тебе» слегка возвышенна, но ясна; «этой самой ночью» естественно сохраняет смысловое ударение исходного текста.
