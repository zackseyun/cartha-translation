translation:
  language: ru
  text: Когда Иисус был в Вифании, в доме Симона прокажённого[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Прокажённый» передаёт греческий эпитет, которым назван Симон; сам по себе этот эпитет не показывает, был ли он болен в то время или прежде.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γενομένου
  choice: Когда Иисус был
  rationale: Генитив абсолютный с γίνομαι задаёт временную обстановку. «Когда Иисус был» естественно передаёт эту функцию, не калькируя глагол как «оказался» или «пришёл».
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Здесь δέ служит мягкой связкой и обозначает переход в повествовании. В русском языке этот переход естественно передаётся началом придаточного времени; добавление «же» или «теперь» было бы излишним.
- source_word: ἐν Βηθανίᾳ
  choice: в Вифании
  rationale: Прямое обозначение места; использована традиционная русская форма топонима.
- source_word: ἐν οἰκίᾳ Σίμωνος
  choice: в доме Симона
  rationale: οἰκία здесь обозначает место действия, а родительный падеж передаёт принадлежность дома Симону.
- source_word: τοῦ λεπροῦ
  choice: прокажённого
  rationale: Сохранён краткий повествовательный эпитет. Он не уточняет ни современный медицинский диагноз, ни то, страдал ли Симон этой болезнью в тот момент.
theological_decisions:
- issue: Указывает ли эпитет Симона на его состояние во время события
  choice: Сохранить обозначение «Симона прокажённого», не уточняя времени и состояния
  alternative: «Симона, прежде бывшего прокажённым» или «Симона, страдавшего кожной болезнью»
  rationale: Греческий текст содержит только идентифицирующий эпитет и не сообщает, был ли Симон тогда болен, исцелён ранее или какое именно заболевание имеется в виду.
translation_notes:
  register: Современный литературный русский язык с традиционными библейскими именами и топонимами. Синтаксис сохраняет незавершённость стиха, который переходит в следующее предложение. Временное значение генитива абсолютного передано естественным придаточным с «когда».
