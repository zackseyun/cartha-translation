base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/052.yaml
  text: Then Jesus said to him[a], “Put your sword back in its place, for all who take up the sword will perish by the sword.”
translation:
  language: ru
  text: 'Тогда Иисус сказал ему: «Верни свой меч на место, потому что все, кто берётся за меч[a], погибнут от меча».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все, кто берёт меч»; выражение, вероятно, означает прибегать к вооружённому насилию, а не просто брать оружие в руку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественно передаёт временной переход к следующему событию повествования.
- source_word: λέγει αὐτῷ
  choice: сказал ему
  rationale: Историческое настоящее по-гречески естественно передаётся прошедшим временем в русском повествовании.
- source_word: Ἀπόστρεψον
  choice: Верни
  rationale: Повелительная форма требует немедленно возвратить оружие туда, где оно находилось; «верни» звучит ясно и естественно.
- source_word: τὴν μάχαιράν σου
  choice: свой меч
  rationale: μάχαιρα может обозначать нож, кинжал или короткий меч, но в данном контексте традиционное и ясное «меч» лучше всего сохраняет связь с последующим изречением. Возвратное «свой» естественно при совпадении владельца с адресатом повеления.
- source_word: εἰς τὸν τόπον αὐτῆς
  choice: на место
  rationale: Русское выражение «вернуть на место» идиоматично передаёт возвращение оружия туда, где оно должно находиться.
- source_word: πάντες γὰρ οἱ λαβόντες μάχαιραν
  choice: потому что все, кто берётся за меч
  rationale: Субстантивированное причастие имеет обобщающий смысл. «Берётся за меч» может обозначать не только физическое действие, но и обращение к вооружённому насилию; примечание сохраняет более буквальную возможность.
- source_word: ἐν μαχαίρῃ
  choice: от меча
  rationale: Инструментальное значение передано естественным русским оборотом, сохраняющим параллелизм изречения.
- source_word: ἀπολοῦνται
  choice: погибнут
  rationale: Будущая форма ἀπόλλυμι здесь означает гибель или смерть; «погибнут» сохраняет серьёзность и афористичность высказывания.
theological_decisions:
- issue: Объём высказывания Иисуса о мече
  choice: 'Передать как общее правило: «все, кто берётся за меч…»'
  alternative: Истолковать либо как безусловный запрет всякого применения силы, либо как предсказание, относящееся только к данной ситуации.
  rationale: Греческая обобщающая конструкция охватывает всех, кто действует таким образом. Перевод сохраняет широту изречения, не навязывая ему более узкой или конфессионально обусловленной трактовки.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и афористичным звучанием. Частица «и» в заключительной части подчёркивает закономерное соответствие между обращением к мечу и гибелью от меча, не добавляя новой богословской конкретизации.
