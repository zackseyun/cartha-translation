id: MAT.26.35
reference: Matthew 26:35
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πέτρος· Κἂν δέῃ με σὺν σοὶ ἀποθανεῖν, οὐ μή σε ⸀ἀπαρνήσομαι. ⸀ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/035.yaml
  text: Peter said to him[a], “Even if I must die with you, I will certainly not deny you.” Likewise all the disciples also said the same.
translation:
  language: ru
  text: 'Пётр сказал ему: «Даже если мне придётся умереть вместе с тобой, я ни за что не отрекусь от тебя[a]». То же самое сказали и все ученики.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никогда не отрекусь от тебя». В греческом тексте употреблено усиленное отрицание (οὐ μή).'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: сказал
  rationale: Историческое настоящее в греческом повествовании естественно передаётся русским прошедшим временем без изменения функции реплики.
- source_word: Κἂν δέῃ με
  choice: Даже если мне придётся
  rationale: κἄν выражает уступительное условие, а δέῃ — необходимость; выбранная формулировка естественна в современном русском языке.
- source_word: σὺν σοὶ ἀποθανεῖν
  choice: умереть вместе с тобой
  rationale: Передаёт как смерть, так и подчёркнутое совместное участие, выраженное σὺν σοὶ.
- source_word: οὐ μή … ἀπαρνήσομαι
  choice: я ни за что не отрекусь от тебя
  rationale: Оборот οὐ μή является усиленным отрицанием; «ни за что не» естественно и выразительно передаёт категоричность заявления Петра.
- source_word: ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν
  choice: То же самое сказали и все ученики
  rationale: Передаёт значение ὁμοίως и включительное καί без тяжеловесного буквального повтора «подобным образом».
theological_decisions:
- issue: Категоричность обещания Петра
  choice: «ни за что не отрекусь» как усиленное отрицание
  alternative: «никогда не отрекусь»
  rationale: Греческое οὐ μή подчёркивает уверенность Петра. Перевод сохраняет напряжение между его категоричным обещанием и последующим отречением, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык с естественной повествовательной формой. Местоимения, относящиеся к Иисусу, набраны со строчной буквы как нейтральная современная издательская норма; это не умаляет достоинства речи и не вносит конфессиональной маркировки.
