  source_fidelity: Перевод точно передаёт историческое настоящее λέγει естественным русским прошедшим временем, уступительно-условную конструкцию Κἂν δέῃ με, сопровождение σὺν σοί, эмфатическое отрицание οὐ μή и заключительное ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν. «То же самое сказали и все ученики» корректно выражает, что остальные ученики присоединились к словам Петра.
