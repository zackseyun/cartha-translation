  terminology: «Отречься» — точное и устоявшееся в данном контексте соответствие ἀπαρνέομαι. Передача οὐ μή оборотом «ни за что не» удачно сохраняет категоричность без привнесения толкования. Сноска уместно предлагает «никогда не отрекусь» как близкий вариант и верно объясняет греческое усиленное отрицание.
