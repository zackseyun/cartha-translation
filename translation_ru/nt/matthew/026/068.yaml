base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/068.yaml
  text: 'saying[a], “Prophesy to us, Messiah: who is it that struck you?”'
translation:
  language: ru
  text: 'и говорили: «Пророчествуй нам, Мессия[a]: кто тебя ударил?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческое Χριστός здесь употреблено как титул.'
    reason: Указать традиционную альтернативную передачу титула без устранения его мессианского значения.
lexical_decisions:
- source_word: λέγοντες
  choice: и говорили
  rationale: Причастие настоящего времени продолжает описание действий из предыдущего стиха. В современном русском повествовании личная форма с союзом естественнее буквального «говоря» и сохраняет связь с контекстом.
- source_word: Προφήτευσον
  choice: Прореки
  rationale: Аористный императив передаёт насмешливое требование пророчески назвать ударившего. «Прореки» сохраняет глагольную форму и иронию, не превращая реплику в пояснительный пересказ.
- source_word: ἡμῖν
  choice: нам
  rationale: Дательный падеж обозначает тех, кому предлагается сообщить пророчество; русское «нам» передаёт это прямо и естественно.
- source_word: χριστέ
  choice: Мессия
  rationale: Χριστός употреблено как обращение-титул. «Мессия» раскрывает титульное значение «Помазанник» и передаёт мессианскую направленность насмешки.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: кто тебя ударил?
  rationale: Субстантивированное причастие ὁ παίσας означает «тот, кто ударил». По-русски вопрос об установлении личности естественно и точно передаётся формой «кто тебя ударил?».
theological_decisions:
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Здесь слово стоит в звательном употреблении и явно функционирует как титул в насмешливом обращении, а не как часть устойчивого имени. «Мессия» сохраняет титульный смысл и напряжение сцены; вариант «Христос» отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; реплика краткая, резкая и насмешливая. Местоимение «тебя» написано со строчной буквы, поскольку в греческом тексте нет особой графической формы почтительного обращения, а говорящие издеваются над Иисусом.
