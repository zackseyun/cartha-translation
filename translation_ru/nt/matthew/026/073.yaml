  text: μετὰ μικρὸν δὲ προσελθόντες οἱ ἑστῶτες εἶπον τῷ Πέτρῳ· Ἀληθῶς καὶ σὺ ἐξ αὐτῶν εἶ, καὶ γὰρ ἡ λαλιά σου δῆλόν σε ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/073.yaml
  text: After a little while[a], those standing there came up and said to Peter, “Surely you also are one of them, for even your accent makes you evident.”
translation:
  language: ru
  text: 'Немного погодя стоявшие там подошли к Петру и сказали: «Верно, и ты из них, ведь даже твой говор выдаёт тебя[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоя речь обнаруживает тебя». Греческое слово λαλιά может означать речь, манеру говорить или говор (акцент).'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ μικρὸν
  choice: Немного погодя
  rationale: Естественное русское обозначение краткого промежутка времени; передаёт греческое выражение без излишней буквальности.
- source_word: δὲ
  choice: —
  rationale: Слабая повествовательная связка передана самим переходом к следующему действию; отдельный союз по-русски не требуется.
- source_word: προσελθόντες
  choice: подошли
  rationale: Точно и естественно передаёт движение людей к Петру.
- source_word: οἱ ἑστῶτες
  choice: стоявшие там
  rationale: Сохраняет причастную конструкцию и не превращает находившихся рядом людей в более истолковательное «окружающие».
- source_word: εἶπον τῷ Πέτρῳ
  choice: сказали Петру
  rationale: Прямой и естественный русский эквивалент греческой конструкции.
- source_word: Ἀληθῶς
  choice: Верно
  rationale: Передаёт уверенность говорящих и естественно звучит в контексте опознания и обвинения.
- source_word: καὶ σὺ
  choice: и ты
  rationale: Сохраняет акцент на принадлежности Петра к той же группе.
- source_word: ἐξ αὐτῶν
  choice: из них
  rationale: Краткое естественное выражение принадлежности к упомянутой группе.
- source_word: καὶ γὰρ
  choice: ведь даже
  rationale: «Ведь» вводит основание утверждения, а «даже» передаёт усилительную силу καί, не снимая возможной контекстуальной неоднозначности.
- source_word: ἡ λαλιά σου
  choice: твой говор
  rationale: «Говор» естественно обозначает характерную манеру произношения или местный акцент и при этом сохраняет широту значения λαλιά лучше, чем узкое «акцент».
- source_word: δῆλόν σε ποιεῖ
  choice: выдаёт тебя
  rationale: 'Идиоматично передаёт буквальное «делает тебя явным»: манера речи обнаруживает принадлежность Петра к группе.'
