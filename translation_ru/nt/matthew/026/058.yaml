  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ἠκολούθει αὐτῷ ἀπὸ μακρόθεν ἕως τῆς αὐλῆς τοῦ ἀρχιερέως, καὶ εἰσελθὼν ἔσω ἐκάθητο μετὰ τῶν ὑπηρετῶν ἰδεῖν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/058.yaml
  text: But Peter was following him from a distance[a], as far as the courtyard of the high priest. And after going inside[b], he sat with the officers to see the outcome.
translation:
  language: ru
  text: Пётр же следовал за Ним издали, до самого двора первосвященника. Войдя внутрь, он сидел вместе со служителями[a], чтобы увидеть, чем всё кончится[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «со слугами», «с прислужниками» или «со стражниками». Греческое ὑπηρέται может обозначать подчинённых служащих или сопровождающих должностных лиц; точный оттенок определяется контекстом.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чтобы увидеть конец». Здесь греческое τὸ τέλος, вероятно, означает исход происходящего с Иисусом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: следовал
  rationale: Имперфект изображает продолжающееся фоновое действие; русская форма прошедшего времени естественно передаёт его в данном повествовательном контексте.
- source_word: ἀπὸ μακρόθεν
  choice: издали
  rationale: Краткое и естественное современное соответствие, сохраняющее значение физической удалённости.
- source_word: ἕως τῆς αὐλῆς
  choice: до самого двора
  rationale: ἕως обозначает предел движения, а αὐλή здесь — внутренний двор при доме первосвященника.
- source_word: ἀρχιερέως
  choice: первосвященника
  rationale: Устоявшееся и точное соответствие ἀρχιερεύς в контексте евангельского повествования о Страстях.
- source_word: εἰσελθὼν ἔσω
  choice: войдя внутрь
  rationale: Деепричастная конструкция сохраняет предшествование этого действия основному глаголу, а ἔσω явно передаётся словом «внутрь».
- source_word: ἐκάθητο
  choice: сидел
  rationale: Имперфект указывает на продолжительное состояние; русское «сидел» передаёт его естественно и без избыточной конструкции.
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: вместе со служителями
  rationale: ὑπηρέται обозначает подчинённых служащих или сопровождающих должностных лиц; «служители» сохраняет широту значения и не уточняет без достаточных оснований, были ли они стражниками.
- source_word: ἰδεῖν
  choice: чтобы увидеть
  rationale: Инфинитив выражает цель; буквальное «увидеть» оставляет открытым оттенок наблюдения и выяснения.
- source_word: τὸ τέλος
  choice: чем всё кончится
  rationale: Идиоматическое русское выражение передаёт и буквальную идею конца, и контекстуальное значение исхода происходящего.
