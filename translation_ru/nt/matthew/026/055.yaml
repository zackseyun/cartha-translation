  text: ἐν ἐκείνῃ τῇ ὥρᾳ εἶπεν ὁ Ἰησοῦς τοῖς ὄχλοις· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με; καθ’ ⸀ἡμέραν ⸂ἐν τῷ ἱερῷ ἐκαθεζόμην διδάσκων⸃ καὶ οὐκ ἐκρατήσατέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/055.yaml
  text: At that hour Jesus said to the crowds[a], “Have you come out with swords and clubs to arrest me, as against a robber? Day after day I was sitting in the temple teaching[b], and you did not seize me.”
translation:
  language: ru
  text: 'В тот час Иисус сказал толпам: «Вы вышли с мечами и дубинами, чтобы схватить Меня, как на разбойника?[a] День за днём Я сидел в храме и учил, и вы не схватили Меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бандита»; в некоторых контекстах греческое слово λῃστής может также обозначать вооружённого мятежника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: В тот час
  rationale: Сохраняет временную конкретность и непосредственность греческого выражения, оставаясь естественным для современного русского языка.
- source_word: τοῖς ὄχλοις
  choice: толпам
  rationale: Передаёт форму множественного числа ὄχλοις без архаичного оттенка.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: словно разбойника
  rationale: Естественно передаёт обращение с Иисусом как с опасным преступником; «разбойник» шире, чем «вор», и не навязывает исключительно политического смысла.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: с мечами и дубинами
  rationale: «Мечи» — ясное соответствие μάχαιραι, а «дубины» передают использование ξύλα как оружия.
- source_word: συλλαβεῖν με
  choice: чтобы схватить Меня
  rationale: В контексте означает задержать или взять под стражу; «схватить» сохраняет физическую силу выражения и естественно звучит в вопросе.
- source_word: καθ’ ἡμέραν
  choice: День за днём
  rationale: Передаёт распределительное значение выражения и риторическое подчёркивание регулярности.
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: В данном контексте обозначает храмовый комплекс; обычное русское «в храме» ясно и не создаёт ненужной пространственной конкретизации.
- source_word: ἐκαθεζόμην διδάσκων
  choice: Я сидел в храме и учил
  rationale: Сохраняет длительный характер несовершенного вида и одновременность действия причастия; сидячее положение также соответствует обычной позе учителя.
- source_word: οὐκ ἐκρατήσατέ με
  choice: вы не схватили Меня
  rationale: Передаёт значение κρατέω — взять, удержать, схватить. Повтор русского глагола усиливает контраст между прежним бездействием и нынешним вооружённым задержанием.
theological_decisions:
- issue: Смысл λῃστής в риторическом вопросе Иисуса
  choice: разбойник
  alternative: бандит; мятежник
  rationale: λῃστής может обозначать вооружённого разбойника и в некоторых контекстах повстанца. Основной текст сохраняет широкий смысл опасного преступника, а примечание оставляет открытой возможную политическую окраску, не делая её обязательной.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Риторическое «Неужели» естественно выражает укор, заложенный в вопросе. Заглавная буква в местоимении «Меня» соответствует принятой русской библейской издательской традиции и не меняет смысла исходного текста.
