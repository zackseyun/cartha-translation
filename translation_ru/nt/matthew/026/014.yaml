  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τότε πορευθεὶς εἷς τῶν δώδεκα, ὁ λεγόμενος Ἰούδας Ἰσκαριώτης, πρὸς τοὺς ἀρχιερεῖς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/014.yaml
  text: Then one of the twelve[a], the one called Judas Iscariot, went to the chief priests,
translation:
  language: ru
  text: Тогда один из двенадцати[a], которого звали Иуда Искариот, пошёл к первосвященникам,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «один из Двенадцати».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественный русский повествовательный маркер, передающий переход к следующему событию.
- source_word: πορευθεὶς
  choice: пошёл
  rationale: Аористное причастие употреблено обстоятельственно; личная форма естественна по-русски и ясно передаёт движение к первосвященникам.
- source_word: εἷς τῶν δώδεκα
  choice: один из двенадцати
  rationale: Сохраняет партитивную конструкцию и не добавляет отсутствующей в греческом графической интерпретации названия группы.
- source_word: ὁ λεγόμενος
  choice: которого звали
  rationale: Естественно и точно передаёт идентифицирующую причастную конструкцию; буквальное «называемый» звучало бы тяжеловесно.
- source_word: Ἰούδας Ἰσκαριώτης
  choice: Иуда Искариот
  rationale: Традиционная и понятная русская передача имени и прозвания.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: к первосвященникам
  rationale: Предлог «к» передаёт направление движения, а «первосвященники» — старших представителей храмового священства, а не нескольких действующих верховных священников.
theological_decisions:
- issue: Передача обозначения группы τῶν δώδεκα
  choice: один из двенадцати
  alternative: один из Двенадцати
  rationale: Строчная буква не превращает числительное в явно оформленный титул, которого греческая графика сама по себе не устанавливает, при этом контекст сохраняет ясную отсылку к ближайшему кругу учеников.
translation_notes:
  register: Современный литературный русский язык; повествование звучит естественно и достойно. Запятая в конце сохранена, поскольку стих синтаксически продолжается далее.
