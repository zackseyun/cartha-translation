  source_fidelity: 'Текст точно передаёт все элементы греческого оригинала: временной маркер «Тогда», принадлежность Иуды к числу двенадцати, идентифицирующее «которого звали», имя и прозвание, а также направленное движение к первосвященникам. Русское «пошёл» — естественная передача обстоятельственного πορευθείς в данном повествовательном контексте.'
