  text: καὶ ἐσθιόντων αὐτῶν εἶπεν· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/021.yaml
  text: And while they were eating[a], he said, “Truly I tell you, one of you will betray me.”
translation:
  language: ru
  text: 'Когда они ели, он сказал: «Истинно говорю вам: один из вас предаст меня[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «передаст меня» или «выдаст меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: когда они ели
  rationale: Родительный самостоятельный оборот обозначает действие, происходящее одновременно с последующим высказыванием; перевод естественно передаёт это временное отношение.
- source_word: Ἀμὴν
  choice: истинно
  rationale: В начале речений Иисуса ἀμήν служит торжественным подтверждением истинности и авторитетности последующего высказывания; «истинно» сохраняет эту функцию в естественной русской форме.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямо и естественно передаёт распространённую формулу обращения, сохраняя настоящее время и адресата.
- source_word: εἷς ἐξ ὑμῶν
  choice: один из вас
  rationale: Точно и естественно передаёт партитивное выражение.
- source_word: παραδώσει
  choice: предаст
  rationale: Глагол буквально обозначает передачу кого-либо в чужую власть, но в данном повествовательном контексте такая передача совершается одним из ближайших учеников и носит характер предательства. Будущее время сохранено.
- source_word: με
  choice: меня
  rationale: Прямое дополнение, относящееся к Иисусу; расширение смысла не требуется.
theological_decisions:
- issue: Передача παραδώσει в контексте страстей
  choice: предаст
  alternative: передаст в руки / выдаст
  rationale: «Предаст» естественно выражает вероломный характер поступка ученика, тогда как примечание сохраняет более широкий и буквальный смысл греческого глагола, не устраняя его лексическую многозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной речью. Местоимения, относящиеся к Иисусу, даны со строчной буквы в соответствии с обычными нормами современного текста и без добавления отсутствующей в греческом оригинале конфессиональной маркировки.
