  text: But they were saying[a], “Not during the feast[b], lest there be an uproar among the people.”
translation:
  language: ru
  text: 'Но они говорили: «Не во время праздника, чтобы среди народа не начались волнения[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы среди народа не возникли беспорядки»; или: «чтобы среди народа не поднялся мятеж».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: они говорили
  rationale: Имперфект передаёт продолжавшееся обсуждение; форма «говорили» естественно сохраняет этот оттенок.
- source_word: δέ
  choice: Но
  rationale: Союз обозначает лёгкое противопоставление предыдущему замыслу и вводит оговорку участников совета.
- source_word: Μὴ ἐν τῇ ἑορτῇ
  choice: Только не во время праздника
  rationale: Эллиптический запрет передан естественной русской формулой; ἐν имеет временное значение, а ἑορτή в контексте обозначает праздник Пасхи.
- source_word: ἵνα μὴ
  choice: чтобы … не
  rationale: Передаёт цель — избежать нежелательного последствия — без излишне книжного оборота.
- source_word: θόρυβος
  choice: волнения
  rationale: Слово обозначает общественное волнение, беспорядок или смуту; множественное «волнения» идиоматично по-русски и не усиливает значение до непременно полномасштабного бунта.
- source_word: γένηται
  choice: начались
  rationale: В сочетании с «волнения» естественно выражает возникновение беспорядков.
- source_word: ἐν τῷ λαῷ
  choice: в народе
  rationale: Передаёт возникновение волнений среди собравшегося народа и сохраняет значение λαός.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясной повествовательной формой. «Только не» естественно передаёт краткую реплику в ходе совещания; «волнения» сохраняет диапазон значения θόρυβος, не преуменьшая и не преувеличивая угрозу общественных беспорядков.
