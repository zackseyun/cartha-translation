  text: καὶ ἐμνήσθη ὁ Πέτρος τοῦ ⸀ῥήματος Ἰησοῦ ⸀εἰρηκότος ὅτι Πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με, καὶ ἐξελθὼν ἔξω ἔκλαυσεν πικρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/075.yaml
  text: 'And Peter remembered the word Jesus had spoken: “Before a rooster crows[a], you will deny me three times.” And he went outside and wept bitterly.'
translation:
  language: ru
  text: 'И Пётр вспомнил сказанное Иисусом: «Прежде чем пропоёт петух, ты трижды отречёшься от Меня». Выйдя наружу, он горько заплакал.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμνήσθη
  choice: вспомнил
  rationale: Аористный депонент передаёт наступившее воспоминание; «вспомнил» естественно и точно выражает повествовательный смысл.
- source_word: ῥήματος
  choice: слова
  rationale: ῥῆμα обозначает сказанное слово или высказывание. В русском выражение «вспомнил слова Иисуса» звучит естественно; множественное число здесь идиоматически обозначает произнесённое высказывание.
- source_word: εἰρηκότος
  choice: 'Иисуса:'
  rationale: Содержание причастия «сказавшего» естественно передано конструкцией «слова Иисуса» с последующей прямой речью; факт произнесения ясен без тяжеловесного «которые сказал Иисус».
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: Прежде чем пропоёт петух
  rationale: Инфинитивная временная конструкция естественно передаётся придаточным времени. Безартиклевое ἀλέκτορα не требует в русском языке отдельного указания на неопределённость; форма «петух» обозначает событие петушиного крика.
- source_word: τρὶς
  choice: трижды
  rationale: «Трижды» — современное, краткое и стилистически достойное русское соответствие наречию τρίς.
- source_word: ἀπαρνήσῃ
  choice: отречёшься от Меня
  rationale: ἀπαρνέομαι в данном контексте означает отказ признать связь с Иисусом; «отречься от» точно передаёт смысл и естественно управляет родительным падежом.
- source_word: ἐξελθὼν ἔξω
  choice: Выйдя наружу
  rationale: Сочетание причастия движения и наречия сохраняется без неестественного удвоения; «наружу» ясно обозначает уход с места происходящего.
- source_word: ἔκλαυσεν πικρῶς
  choice: горько заплакал
  rationale: Устойчивое русское сочетание передаёт начало плача и его глубокую скорбную окраску без добавочного толкования.
theological_decisions:
- issue: Обозначение Иисуса только по имени
  choice: Иисуса
  alternative: Господа Иисуса
  rationale: В греческом тексте стоит только Ἰησοῦ; христологический титул не добавляется.
- issue: Смысл отречения Петра
  choice: отречёшься от Меня
  alternative: не признаешь Меня
  rationale: «Отречёшься» сохраняет сильный смысл ἀπαρνέομαι и не сводит действие лишь к словесному непризнанию.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён там, где буквальное воспроизведение греческих причастных конструкций было бы тяжеловесным; смысловая последовательность и напряжённость текста сохранены.
