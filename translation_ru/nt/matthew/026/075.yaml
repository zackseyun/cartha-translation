review_pass:
  verdict: revise
  source_fidelity: 'Нужно устранить небольшое формальное сглаживание: греческое ῥήματος стоит в единственном числе, а εἰρηκότος прямо характеризует это высказывание как сказанное Иисусом. Формулировка «вспомнил слова Иисуса» понятна в контексте прямой речи, но множественное число и родительный оборот несколько менее точно отражают исходную конструкцию. «Вспомнил сказанное Иисусом» естественно передаёт оба элемента без искусственной тяжеловесности. Остальные элементы верны: «прежде чем пропоёт петух», «трижды отречёшься от Меня», выход и горький плач соответствуют греческому тексту.'
  naturalness: Текст в целом написан современным литературным русским и сохраняет сдержанный повествовательный регистр. Оборот «Выйдя наружу, он горько заплакал» естественен; совершенный вид «заплакал» допустимо передаёт аористное повествовательное действие и не вносит существенного толкования.
  terminology: «Пётр», «Иисус», «отречёшься от Меня» и «горько заплакал» употреблены удачно. Написание «Меня» с прописной буквы последовательно следует принятому в переводе уважительному оформлению прямой речи Иисуса и не добавляет титула или доктринального содержания.
  issues:
  - severity: low
    issue: «слова Иисуса» вместо единственного ῥήματος с явным указанием на сказанное Иисусом
    rationale: Множественное число в русском возможно идиоматически, однако исходный текст говорит об одном высказывании и включает причастие εἰρηκότος («сказавшего»). Замена на «сказанное Иисусом» точнее и при этом вполне естественна.
  revised_text: 'И Пётр вспомнил сказанное Иисусом: «Прежде чем пропоёт петух, ты трижды отречёшься от Меня». Выйдя наружу, он горько заплакал.'
