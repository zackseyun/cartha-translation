  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/041.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: ru
  text: Бодрствуйте и молитесь, чтобы не войти в искушение[a]. Дух готов, но плоть слаба.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в испытание». Греческое слово может означать как побуждение ко греху, так и тяжёлое испытание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Бодрствуйте
  rationale: Повелительное наклонение множественного числа означает как физическое бодрствование в контексте сна учеников, так и духовную бдительность; «бодрствуйте» естественно сохраняет оба оттенка.
- source_word: προσεύχεσθε
  choice: молитесь
  rationale: Обычный и ясный русский эквивалент настоящего императива; в данном повелении форма естественно допускает продолженное действие.
- source_word: ἵνα μὴ εἰσέλθητε
  choice: чтобы вам не войти
  rationale: Сохраняет целевое значение конструкции ἵνα μή и образ вхождения, не заменяя его более толковательным «не впасть».
- source_word: πειρασμόν
  choice: искушение
  rationale: В ближайшем контексте речь идёт об опасности нравственного падения под давлением; при этом более широкий диапазон значения — «испытание» — отмечен в сноске.
- source_word: τὸ μὲν πνεῦμα πρόθυμον
  choice: Дух готов
  rationale: «Готов» передаёт πρόθυμος как внутреннюю готовность и решимость. Отсутствующая в греческом связка естественно подразумевается по-русски.
- source_word: ἡ δὲ σὰρξ ἀσθενής
  choice: но плоть слаба
  rationale: «Плоть» сохраняет библейский образ человеческой телесной немощи и не привносит более узкое толкование «греховная природа»; δέ передано противительным «но».
theological_decisions:
- issue: Референт πνεῦμα
  choice: человеческий дух / внутреннее расположение, «дух» со строчной буквы
  alternative: Святой Дух
  rationale: Контраст с плотью и контекст искренней готовности учеников при их фактической слабости указывают прежде всего на человеческий дух. Строчная буква не вносит в текст прямого указания на Святого Духа.
- issue: Передача σάρξ
  choice: «плоть»
  alternative: «тело» или «греховная природа»
  rationale: Здесь слово обозначает человеческую, в том числе телесную, немощь, а не специально сформулированное учение о «греховной природе». «Плоть» сохраняет метафору и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Формы множественного числа сохраняют обращение к ученикам; библейские образы «войти», «дух» и «плоть» не истолкованы сверх исходного текста.
