source:
  edition: SBLGNT
  text: ἢ δοκεῖς ὅτι οὐ ⸀δύναμαι παρακαλέσαι τὸν πατέρα μου, καὶ παραστήσει μοι ⸂ἄρτι πλείω⸃ δώδεκα λεγιῶνας ἀγγέλων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/053.yaml
  text: Or do you think that I cannot appeal to my Father[c][b][a], and he will at once place at my disposal more than twelve legions of angels?
translation:
  language: ru
  text: Или ты думаешь, что Я не могу попросить Моего Отца, и Он тотчас предоставит Мне в распоряжение более двенадцати легионов ангелов?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Легион — крупное подразделение римской армии; здесь этот образ подчёркивает огромную силу небесного воинства.
    reason: cultural_note
lexical_decisions:
- source_word: ἢ
  choice: Или
  rationale: Сохраняет связь с предшествующим упрёком и вводит риторическую альтернативу.
- source_word: δοκεῖς
  choice: ты думаешь
  rationale: Естественно передаёт прямой риторический вопрос в современном русском языке.
- source_word: οὐ δύναμαι
  choice: Я не могу
  rationale: Передаёт значение способности или возможности, не подменяя его нежеланием либо отсутствием разрешения.
- source_word: παρακαλέσαι
  choice: попросить
  rationale: В данном контексте обозначает обращение к Отцу с просьбой о помощи; это ясно и естественно, без излишне официального оттенка.
- source_word: τὸν πατέρα μου
  choice: Моего Отца
  rationale: Сохраняет личное сыновнее обращение; прописная буква соответствует русской библейской традиции при обозначении Бога.
- source_word: παραστήσει μοι
  choice: предоставит Мне
  rationale: Передаёт смысл размещения рядом и предоставления в распоряжение для помощи, не добавляя отсутствующий в греческом глагол «пошлёт».
- source_word: ἄρτι
  choice: тотчас
  rationale: Выражает немедленную доступность помощи; порядок слов учитывает вариант текста SBLGNT, не меняя смысла.
- source_word: πλείω δώδεκα
  choice: больше двенадцати
  rationale: Прямо и естественно передаёт сравнительную конструкцию с числительным.
- source_word: λεγιῶνας
  choice: легионов
  rationale: Сохраняет римский военный образ огромной организованной силы.
- source_word: ἀγγέλων
  choice: ангелов
  rationale: Контекст однозначно указывает на небесных существ, а не человеческих посланников.
theological_decisions:
- issue: Способность Иисуса обратиться за небесной помощью
  choice: «Я не могу попросить Моего Отца» в составе риторического вопроса
  alternative: Передача как нежелания просить или отсутствия разрешения
  rationale: δύναμαι означает способность или возможность. Риторический вопрос утверждает, что Иисус способен обратиться за подавляющей небесной помощью, и сохраняет напряжение между этой возможностью и добровольным принятием ареста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Местоимения «Я», «Он», «Мне» написаны с прописной буквы по принятой русской религиозной орфографии. Формулировка остаётся понятной без архаизмов; военный термин «легион» сохранён и пояснён в сноске.
