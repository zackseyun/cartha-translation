  text: And being deeply grieved[a], they began to say to him one by one, “Surely not I[b], Lord?”
translation:
  language: ru
  text: 'Глубоко опечаленные, они стали один за другим спрашивать Его: «Ведь не я, Господи?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческая частица μήτι вводит вопрос, на который ожидается отрицательный ответ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπούμενοι σφόδρα
  choice: глубоко опечаленные
  rationale: Причастие передаёт продолжающееся эмоциональное состояние учеников, а наречие σφόδρα усиливает его. Сочетание звучит естественно и сохраняет силу греческого выражения.
- source_word: ἤρξαντο λέγειν αὐτῷ
  choice: стали говорить Ему
  rationale: Передаёт начинательное значение конструкции и сохраняет буквальное значение λέγειν, не заменяя его глаголом «спрашивать».
- source_word: εἷς ἕκαστος
  choice: один за другим
  rationale: 'Естественно передаёт распределительное значение: каждый ученик обращался к Иисусу поочерёдно.'
- source_word: Μήτι ἐγώ εἰμι
  choice: Не я ли
  rationale: Русская отрицательная вопросительная конструкция кратко и естественно передаёт вопрос, предполагающий отрицательный ответ.
- source_word: κύριε
  choice: Господи
  rationale: Традиционная и живая русская звательная форма обращения «Господь» уместно сохраняет титульный и повествовательный вес κύριε применительно к Иисусу.
theological_decisions:
- issue: Передача κύριε в обращении к Иисусу
  choice: Господи
  alternative: господин / учитель
  rationale: Хотя κύριε в некоторых контекстах может быть вежливым обращением, здесь «Господи» сохраняет характерное для Матфея обозначение Иисуса и не сводит обращение к одной лишь учтивости.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским достоинством. Синтаксис остаётся ясным для широкого круга читателей; сохранены последовательность реплик и ожидающий отрицания характер вопроса.
