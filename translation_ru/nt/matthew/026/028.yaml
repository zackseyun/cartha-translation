  text: τοῦτο γάρ ἐστιν τὸ αἷμά ⸀μου ⸀τῆς διαθήκης τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/028.yaml
  text: For this is my blood of the covenant[b][a], which is poured out for many for the forgiveness of sins.
translation:
  language: ru
  text: Ибо это Моя кровь завета, которая проливается за многих[a] для прощения грехов.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради многих».'
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых рукописях: «Моя кровь нового завета».'
    reason: textual_variant
lexical_decisions:
- source_word: τοῦτο
  choice: это
  rationale: Передаёт указательное местоимение без добавления слова «чаша», которого в данной греческой фразе нет.
- source_word: γάρ
  choice: ведь
  rationale: Естественно для современного русского языка передаёт пояснительную связь с предшествующим повелением пить.
- source_word: τὸ αἷμά μου
  choice: Моя кровь
  rationale: Прямой перевод, сохраняющий жертвенные и заветные ассоциации слова αἷμα.
- source_word: τῆς διαθήκης
  choice: завета
  rationale: Следует тексту SBLGNT, где нет прилагательного καινῆς («нового»).
- source_word: περὶ πολλῶν
  choice: за многих
  rationale: В жертвенном контексте περί с родительным падежом выражает действие в пользу других; формулировка сохраняет смысл и возможную связь с образом раба Господня у Исаии.
- source_word: ἐκχυννόμενον
  choice: проливаемая
  rationale: Причастие согласовано с «кровь» и естественно передаёт настоящее пассивное причастие, сохраняя образ излияния крови.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: ради прощения грехов
  rationale: Ясно передаёт направленность или цель, выраженную εἰς, не сводя её исключительно к одной грамматической категории результата либо цели.
theological_decisions:
- issue: Наличие слова «нового» при слове «завета»
  choice: кровь завета
  alternative: кровь нового завета
  rationale: В основном тексте SBLGNT стоит τῆς διαθήκης без καινῆς. Более пространное чтение отражено в примечании, но не внесено в основной текст.
- issue: Смысл выражения περὶ πολλῶν в контексте искупления
  choice: за многих
  alternative: для многих; за всех
  rationale: Перевод сохраняет πολλῶν («многих») и не разрешает посредством расширительного перевода богословский спор об объёме искупления.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной традиционностью. «Ведь» естественно выражает пояснение; «проливаемая» сохраняет библейский жертвенный образ. Порядок маркеров приведён в соответствие с местами, к которым относятся примечания.
