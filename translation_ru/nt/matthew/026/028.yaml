revisions:
- from: Ведь это Моя кровь завета, проливаемая за многих[a] ради прощения грехов.[b]
  to: Ибо это Моя кровь завета, которая проливается за многих[a] для прощения грехов.[b]
  rationale: Перевод уточнён без добавления «чаша» или «нового» в основной текст. Относительное придаточное ясно передаёт причастие ἐκχυννόμενον, а «для прощения грехов» точно и естественно передаёт εἰς ἄφεσιν ἁμαρτιῶν. Маркеры примечаний остаются привязанными соответственно к «за многих» и к «кровь завета».
