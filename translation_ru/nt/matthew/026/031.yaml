source:
  edition: SBLGNT
  text: Τότε λέγει αὐτοῖς ὁ Ἰησοῦς· Πάντες ὑμεῖς σκανδαλισθήσεσθε ἐν ἐμοὶ ἐν τῇ νυκτὶ ταύτῃ, γέγραπται γάρ· Πατάξω τὸν ποιμένα, καὶ ⸀διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/031.yaml
  text: 'Then Jesus says to them[a], “You will all fall away because of me this night, for it is written: ‘I will strike the shepherd[c][b], and the sheep of the flock will be scattered.’”'
translation:
  language: ru
  text: 'Тогда Иисус говорит им: «В эту ночь вы все оставите Меня[a], потому что написано: „Поражу пастуха, и рассеются овцы стада“[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «преткнётесь из-за Меня»; также возможно: «соблазнитесь из-за Меня» или «отпадёте из-за Меня». Здесь контекст указывает на то, что ученики оставят Иисуса и разбегутся.'
    reason: lexical_alternative
  - marker: b
    text: Цитата из Захарии 13:7.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественно передаёт временной переход к следующему событию повествования.
- source_word: λέγει
  choice: говорит
  rationale: Сохраняет историческое настоящее греческого повествования и его живость.
- source_word: Πάντες ὑμεῖς
  choice: вы все
  rationale: Передаёт эмфатическое сочетание местоимения и слова «все».
- source_word: σκανδαλισθήσεσθε ἐν ἐμοὶ
  choice: оставите Меня
  rationale: В данном контексте речь идёт о предстоящем бегстве учеников; выражение естественно передаёт контекстуальный смысл, не приписывая ему окончательного отступничества.
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: в эту ночь
  rationale: Близко к форме оригинала и естественно в современном литературном русском языке.
- source_word: γέγραπται γάρ
  choice: потому что написано
  rationale: Передаёт формулу введения цитаты из Писания и логическую связь γάρ.
- source_word: Πατάξω τὸν ποιμένα
  choice: Поражу пастуха
  rationale: Сохраняет прямое значение глагола и пастушеский образ цитаты.
- source_word: διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης
  choice: рассеются овцы стада
  rationale: Сохраняет образ рассеяния и оба существительных оригинала — «овцы» и «стадо»; русский возвратный глагол естественно передаёт греческий пассив.
theological_decisions:
- issue: Значение σκανδαλισθήσεσθε в отношении Иисуса
  choice: Предсказание того, что ученики оставят Иисуса этой ночью
  alternative: «соблазнитесь из-за Меня», «преткнётесь обо Мне», «отпадёте из-за Меня»
  rationale: Ближайший контекст говорит о бегстве учеников, а цитата о рассеянии овец усиливает этот смысл. Формулировка не превращает временное оставление Иисуса в утверждение об окончательном отпадении.
- issue: Историческое настоящее λέγει
  choice: говорит
  alternative: сказал
  rationale: Настоящее время сохраняет повествовательную фактуру греческого текста, не меняя богословского содержания.
- issue: Субъект «Поражу» в цитате
  choice: Сохранено первое лицо без поясняющей вставки
  alternative: Я, Бог, поражу
  rationale: Оригинал оставляет субъект выраженным лишь формой глагола; добавление толкования внутри текста неоправданно разрешило бы напряжение цитаты.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием библейской цитаты. Историческое настоящее сохранено. Прописное «Меня» следует распространённой русской библейской орфографической традиции; синтаксис остаётся доступным обычному читателю.
