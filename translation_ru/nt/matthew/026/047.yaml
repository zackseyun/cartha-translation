base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/047.yaml
  text: And while he was still speaking[a], behold, Judas, one of the twelve, came, and with him a large crowd with swords and clubs[b], from the chief priests and elders of the people.
translation:
  language: ru
  text: И пока он ещё говорил, вот, пришёл Иуда, один из двенадцати, и с ним — большая толпа от первосвященников и старейшин народа[b], с мечами и дубинами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «палками». Греческое слово буквально обозначает деревянные предметы; здесь они, вероятно, служили дубинами.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный смысл: толпа была послана первосвященниками и старейшинами народа. Буквально по-гречески: «от первосвященников и старейшин народа».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: пока он ещё говорил
  rationale: Родительный самостоятельный оборот обозначает одновременное действие; «пока… ещё» естественно передаёт временное значение и ἔτι.
- source_word: ἰδοὺ
  choice: вот
  rationale: Сохраняет повествовательный указатель, придающий сцене живость и непосредственность, без добавления значения внезапности.
- source_word: Ἰούδας
  choice: Иуда
  rationale: Традиционная и общепонятная русская форма имени.
- source_word: εἷς τῶν δώδεκα
  choice: один из двенадцати
  rationale: Прямо передаёт партитивное выражение, не превращая числительное в дополнительный титул.
- source_word: ἦλθεν
  choice: пришёл
  rationale: Простой и естественный повествовательный эквивалент аориста ἔρχομαι.
- source_word: ὄχλος πολὺς
  choice: большая толпа
  rationale: Передаёт количественный смысл πολύς, не усиливая само существительное до более оценочного «толпа бунтовщиков» или «шайка».
- source_word: μετὰ μαχαιρῶν
  choice: с мечами
  rationale: Обычный широкий эквивалент μάχαιρα в контексте вооружённого задержания; не навязывает более узкий тип оружия.
- source_word: καὶ ξύλων
  choice: и дубинами
  rationale: В данном контексте множественное ξύλα обозначает деревянные предметы, используемые как оружие; «дубины» ясно передаёт их функцию.
- source_word: ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ
  choice: от первосвященников и старейшин народа
  rationale: Сохраняет выраженную предлогом ἀπό идею источника или происхождения, не добавляя отсутствующего в греческом тексте глагола «послать».
theological_decisions:
- issue: Следует ли прямо сказать, что толпа была послана религиозными руководителями
  choice: от первосвященников и старейшин народа
  alternative: посланная первосвященниками и старейшинами народа
  rationale: Контекст позволяет понимать толпу как действующую по поручению руководителей, однако ἀπό буквально обозначает источник, а отдельного глагола со значением «послать» в тексте нет. Основной текст сохраняет эту смысловую сдержанность, а возможное уточнение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской интонацией. Частица «вот» сохраняет выразительность ἰδού; местоимение «он» дано со строчной буквы в соответствии с нейтральной современной издательской практикой. Тире после «с ним» облегчает восприятие длинного предложения.
