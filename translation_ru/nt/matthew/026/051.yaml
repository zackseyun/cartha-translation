id: MAT.26.51
reference: Matthew 26:51
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἷς τῶν μετὰ Ἰησοῦ ἐκτείνας τὴν χεῖρα ἀπέσπασεν τὴν μάχαιραν αὐτοῦ καὶ πατάξας τὸν δοῦλον τοῦ ἀρχιερέως ἀφεῖλεν αὐτοῦ τὸ ὠτίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/051.yaml
  text: And behold[a], one of those with Jesus stretched out his hand, drew his sword, and struck the high priest’s slave, and cut off his ear.
translation:
  language: ru
  text: И вот, один из тех, кто был с Иисусом, протянул руку, выхватил свой меч, ударил раба первосвященника и отсёк ему ухо.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуге первосвященника».'
    reason: 'Лексическая альтернатива для δοῦλος: «раб» точнее передаёт статус, тогда как «слуга» подчёркивает функцию.'
lexical_decisions:
- source_word: ἰδοὺ
  choice: И вот
  rationale: Передаёт внезапность и повествовательную выразительность греческого указательного слова естественным для современного русского оборотом.
- source_word: εἷς τῶν μετὰ Ἰησοῦ
  choice: один из тех, кто был с Иисусом
  rationale: Точно передаёт партитивную конструкцию, не уточняя личность человека сверх сказанного в тексте.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: протянул руку
  rationale: Естественно передаёт предшествующее действие аористного причастия и сохраняет конкретное физическое движение.
- source_word: ἀπέσπασεν τὴν μάχαιραν αὐτοῦ
  choice: выхватил свой меч
  rationale: В данном контексте ἀποσπάω обозначает резкое извлечение оружия; «выхватил» передаёт движение естественно и выразительно, а «свой» ясно соотносит αὐτοῦ с действующим лицом.
- source_word: μάχαιραν
  choice: меч
  rationale: Обычный и достаточно точный русский эквивалент; более узкие варианты вроде «короткий меч» или «кинжал» неоправданно конкретизировали бы вид оружия.
- source_word: πατάξας
  choice: ударил
  rationale: Передаёт нанесение сильного удара оружием без архаизации.
- source_word: δοῦλον
  choice: раба
  rationale: Сохраняет конкретный социальный статус, выраженный словом δοῦλος, не смягчая его до общего «слуга».
- source_word: ἀρχιερέως
  choice: первосвященника
  rationale: Устоявшийся русский эквивалент для ἀρχιερεύς в данном иудейском контексте.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτίον
  choice: отсёк ему ухо
  rationale: Естественно выражает результат удара мечом и прямо передаёт греческий личный глагол ἀφεῖλεν.
- source_word: ὠτίον
  choice: ухо
  rationale: Уменьшительная форма здесь не требует значения «мочка уха»; нейтральное «ухо» не вносит лишней анатомической конкретизации.
theological_decisions:
- issue: Передача δοῦλος в социально конкретном повествовательном контексте
  choice: раб
  alternative: слуга
  rationale: Слово «раб» точнее сохраняет обозначенный греческим текстом зависимый социальный статус. Вариант «слуга» возможен как функциональное обозначение и указан в примечании, но в основном тексте мог бы смягчить социальную реальность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Последовательность действий передана личными глаголами для ясности и динамики; сохранены внезапность ἰδοὺ и конкретный социальный смысл δοῦλος.
