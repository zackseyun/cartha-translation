lexical_decisions:
- source_word: συνεβουλεύσαντο
  choice: сговорились
  rationale: Передаёт совместное тайное решение и злой умысел участников; естественно сочетается с последующим инфинитивным оборотом.
- source_word: δόλῳ
  choice: хитростью
  rationale: Сохраняет значение обмана, коварного способа действия, не сужая его только до скрытности.
- source_word: κρατήσωσιν
  choice: схватить
  rationale: В данном контексте означает взять под стражу, силой овладеть человеком; «схватить» ясно и естественно.
- source_word: ἀποκτείνωσιν
  choice: убить
  rationale: Прямой современный эквивалент со значением лишения жизни.
theological_decisions:
- issue: Целевая конструкция ἵνα с двумя глаголами в сослагательном наклонении
  choice: единая цель передана инфинитивами «схватить… и убить»
  alternative: «чтобы хитростью схватить Иисуса и убить Его»
  rationale: Русский инфинитив после «сговорились» естественно и точно выражает цель замысла; причинной или иной богословской интерпретации не добавляется.
translation_notes:
  register: Современный литературный русский язык; краткая, напряжённая повествовательная фраза. Местоимение при имени Иисуса не добавлено, поскольку русский синтаксис его не требует.
