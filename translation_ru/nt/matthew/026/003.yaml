source:
  edition: SBLGNT
  text: Τότε συνήχθησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ εἰς τὴν αὐλὴν τοῦ ἀρχιερέως τοῦ λεγομένου Καϊάφα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/003.yaml
  text: Then the chief priests and the elders of the people were gathered in the courtyard of the high priest[a], who was called Caiaphas[b],
translation:
  language: ru
  text: Тогда первосвященники и старейшины народа собрались[a] во дворе[b] первосвященника по имени Каиафа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «были собраны»; греческий глагол имеет форму страдательного залога.'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово может обозначать внутренний двор или двор при большой резиденции.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественный временной маркер, связывающий это событие с предшествующим повествованием.
- source_word: συνήχθησαν
  choice: собрались
  rationale: Греческая форма пассивна, но в русском возвратный глагол естественно передаёт совместное собрание; формально-пассивное «были собраны» могло бы излишне подчёркивать внешнего деятеля.
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся обозначение ведущих представителей священнической знати; множественное число не означает одновременного существования нескольких действующих носителей единственной должности.
- source_word: πρεσβύτεροι τοῦ λαοῦ
  choice: старейшины народа
  rationale: Прямо и естественно передаёт греческую генитивную конструкцию и обозначает признанных руководителей народа.
- source_word: εἰς τὴν αὐλὴν
  choice: во дворе
  rationale: При глаголе собрания εἰς указывает на место, куда они сошлись; αὐλή здесь естественно понимать как внутренний двор большой резиденции.
- source_word: τοῦ ἀρχιερέως
  choice: первосвященника
  rationale: Единственное число обозначает носителя должности в данном контексте.
- source_word: τοῦ λεγομένου Καϊάφα
  choice: по имени Каиафа
  rationale: Идиоматично по-русски идентифицирует первосвященника, сохраняя смысл греческого причастного оборота.
