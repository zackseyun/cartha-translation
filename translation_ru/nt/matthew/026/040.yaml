id: MAT.26.40
reference: Matthew 26:40
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἔρχεται πρὸς τοὺς μαθητὰς καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Οὕτως οὐκ ἰσχύσατε μίαν ὥραν γρηγορῆσαι μετ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/040.yaml
  text: And he comes to the disciples and finds them sleeping[a], and he says to Peter, “So[b], were you not able to stay awake with me for one hour?”
translation:
  language: ru
  text: 'И приходит Он к ученикам, и находит их спящими, и говорит Петру: «Так вы не смогли бодрствовать[a] со мной один час?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не спать».'
    reason: 'Лексическая альтернатива: γρηγορέω в непосредственном противопоставлении сну может обозначать буквально «не спать», тогда как «бодрствовать» сохраняет также оттенок бдительности.'
lexical_decisions:
- source_word: ἔρχεται
  choice: приходит
  rationale: Историческое настоящее сохранено ради повествовательной живости греческого текста; по-русски оно естественно в этой последовательности действий.
- source_word: πρὸς τοὺς μαθητὰς
  choice: к ученикам
  rationale: Предлог πρός при глаголе движения естественно передаётся русским «к».
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: находит их спящими
  rationale: Передана предикативная причастная конструкция и непосредственный контраст между сном учеников и последующим призывом бодрствовать.
- source_word: λέγει τῷ Πέτρῳ
  choice: говорит Петру
  rationale: Сохранено историческое настоящее; имя Πέτρος передано в принятой русской форме «Пётр».
- source_word: Οὕτως
  choice: Так
  rationale: В данном вопросе слово вводит вывод, удивление и мягкий укор; русское «так» сохраняет эту функцию без излишнего разъяснения.
- source_word: οὐκ ἰσχύσατε
  choice: вы не смогли
  rationale: ἰσχύω здесь обозначает способность или наличие сил. Форма «вы» сохраняет множественное число греческого глагола, хотя речь непосредственно обращена к Петру.
- source_word: μίαν ὥραν
  choice: один час
  rationale: Винительный падеж обозначает продолжительность времени; русская конструкция не требует предлога.
- source_word: γρηγορῆσαι
  choice: бодрствовать
  rationale: «Бодрствовать» передаёт как буквальное значение «не спать», очевидное из контекста, так и оттенок бдительности.
- source_word: μετ’ ἐμοῦ
  choice: со мной
  rationale: Прямо и естественно передано значение совместности.
theological_decisions:
- issue: Обращение к Петру при множественном числе глагола ἰσχύσατε
  choice: Сохранены единственный названный адресат («Петру») и обращение во множественном числе («вы не смогли»).
  alternative: Согласовать вопрос только с Петром в единственном числе либо пояснить, что он представляет всю группу.
  rationale: Греческий текст намеренно сочетает обращение к Петру с формой второго лица множественного числа. Перевод сохраняет эту напряжённость и не вводит отсутствующего в тексте пояснения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Исторические настоящие сохранены. Местоимение «Он» в начале предложения добавлено для ясного русского подлежащего и написано с прописной буквы как начало обозначения Иисуса в данном контексте; местоимение в прямой речи («мной») оставлено со строчной, поскольку греческий текст не кодирует особой почтительной капитализации.
