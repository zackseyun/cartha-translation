  text: And when Jesus had finished all these words[a], he said to his disciples,
translation:
  language: ru
  text: 'Когда Иисус закончил говорить всё это, Он сказал Своим ученикам:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Когда
  rationale: Матфеева переходная формула с семитским оттенком буквально допускает «И произошло, когда», однако в современном русском это звучит неестественно. «Когда» сохраняет временную и повествовательную функцию формулы без лишней тяжеловесности.
- source_word: ἐτέλεσεν
  choice: закончил говорить
  rationale: Глагол означает завершение действия; в сочетании с «все эти слова» по-русски естественно передать завершение речи как «закончил говорить».
- source_word: πάντας τοὺς λόγους τούτους
  choice: всё это
  rationale: В данном контексте выражение обозначает всю только что произнесённую речь. «Всё это» естественно по-русски и вместе с «говорить» сохраняет смысл греческого оборота, не создавая неуклюжего «закончил все эти слова».
- source_word: εἶπεν
  choice: сказал
  rationale: Прямой и нейтральный русский эквивалент повествовательной формы λέγω.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: Своим ученикам
  rationale: Возвратное притяжательное местоимение естественно передаёт явное αὐτοῦ, относящее учеников к подлежащему «Иисус»; «ученики» — устойчивый эквивалент μαθηταί.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык, ясный и достойный повествовательный стиль. Формула начала предложения передана идиоматически; прописные буквы в местоимениях, относящихся к Иисусу, соответствуют принятой русской библейской издательской традиции.
