  text: καὶ ἐλθὼν ⸂πάλιν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ βεβαρημένοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/043.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down.
translation:
  language: ru
  text: И, вернувшись, Он нашёл их спящими, ибо их глаза отяжелели.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их глаза были тяжёлыми».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: вернувшись
  rationale: Аористное обстоятельственное причастие означает приход Иисуса к ученикам; по контексту это возвращение к ним. Русское деепричастие сохраняет последовательность действий и звучит естественно.
- source_word: πάλιν
  choice: снова
  rationale: Передаёт повторность действия; естественно относится к тому, что Иисус вновь нашёл учеников спящими.
- source_word: εὗρεν
  choice: нашёл
  rationale: Обычное повествовательное значение εὑρίσκω; подразумеваемый субъект обозначен местоимением «Он» согласно нормам русского повествования.
- source_word: καθεύδοντας
  choice: спящими
  rationale: Передаёт продолжающееся состояние учеников в момент, когда Иисус их нашёл.
- source_word: ἦσαν γὰρ
  choice: потому что ... отяжелели
  rationale: γάρ вводит объяснение того, почему ученики спали; причинный союз «потому что» ясно и естественно выражает эту связь.
- source_word: αὐτῶν οἱ ὀφθαλμοὶ
  choice: глаза у них
  rationale: Естественная современная русская передача греческой конструкции принадлежности без книжной тяжеловесности.
- source_word: βεβαρημένοι
  choice: отяжелели
  rationale: Перфектное страдательное причастие описывает наступившее и сохраняющееся состояние тяжести век или глаз; «отяжелели» сохраняет образ и естественно связано со сном.
