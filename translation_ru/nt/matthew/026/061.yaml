source:
  edition: SBLGNT
  text: εἶπαν· Οὗτος ἔφη· Δύναμαι καταλῦσαι τὸν ναὸν τοῦ θεοῦ καὶ διὰ τριῶν ἡμερῶν ⸀οἰκοδομῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/061.yaml
  text: They said[a], “This man said[b], ‘I am able to destroy the temple of God and to build it in three days.’”
translation:
  language: ru
  text: 'Они сказали: «Этот человек сказал: „Я могу разрушить храм Божий[b] и за три дня[a] построить его“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение можно передать также: «в течение трёх дней». Оно указывает на совершение действия в пределах этого срока.'
    reason: lexical_alternative
  - marker: b
    text: В Ин 2:19–21 сказано, что, говоря о храме, Иисус имел в виду Своё тело.
    reason: cross_reference
lexical_decisions:
- source_word: εἶπαν
  choice: Они сказали
  rationale: Аорист передаёт свидетельское обвинение как единичное событие в повествовании; простое прошедшее время естественно по-русски.
- source_word: Οὗτος
  choice: Этот человек
  rationale: Указательное местоимение в обвинительной речи имеет заметную дейктическую, возможно пренебрежительную окраску; «этот человек» передаёт её естественнее, чем буквальное «этот».
- source_word: ἔφη
  choice: сказал
  rationale: Глагол нейтрально вводит приписываемые Иисусу слова; «сказал» не усиливает их до «заявил» или «утверждал».
- source_word: Δύναμαι
  choice: Я могу
  rationale: Современное и естественное выражение способности, точно передающее значение греческого глагола.
- source_word: καταλῦσαι
  choice: разрушить
  rationale: В отношении здания глагол означает разрушить или снести; «разрушить» соответствует враждебной формулировке обвинения.
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: храм Божий
  rationale: Передаёт ναός понятным общим словом «храм» и сохраняет торжественный, но естественный русский оборот для родительного τοῦ θεοῦ.
- source_word: διὰ τριῶν ἡμερῶν
  choice: за три дня
  rationale: С διά и родительным выражение обозначает временной промежуток, в пределах которого действие совершается; «за три дня» естественно передаёт завершение строительства в этот срок.
- source_word: οἰκοδομῆσαι
  choice: построить его
  rationale: Греческий глагол буквально означает «построить»; местоимение «его» по-русски ясно указывает на ранее названный храм, не добавляя толкования «восстановить».
theological_decisions:
- issue: К чему относится выражение «храм Божий» в обвинении
  choice: Передать обвинение непосредственно как слова о храме, не заменяя его в основном тексте телом Иисуса.
  alternative: Перевести или перефразировать выражение как прямое указание на тело Иисуса и воскресение.
  rationale: Матфей приводит показание обвинителей. Перевод должен сохранять форму их обвинения и не вносить в основной текст истолкование из Ин 2:19–21; связь можно отметить в сноске.
- issue: Значение временного выражения διὰ τριῶν ἡμερῶν
  choice: «за три дня» — завершение действия в пределах указанного срока.
  alternative: «через три дня» — действие после истечения трёх дней.
  rationale: Конструкция допускает временную нюансировку, но в сочетании с глаголом завершённого действия естественнее понимать её как срок, за который строительство будет окончено; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством судебно-повествовательной сцены. Вложенная прямая речь сохранена; формулировки ясны обычному читателю и не перегружены церковнославянизмами.
