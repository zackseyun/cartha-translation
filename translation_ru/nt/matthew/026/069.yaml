  text: Ὁ δὲ Πέτρος ⸂ἐκάθητο ἔξω⸃ ἐν τῇ αὐλῇ· καὶ προσῆλθεν αὐτῷ μία παιδίσκη λέγουσα· Καὶ σὺ ἦσθα μετὰ Ἰησοῦ τοῦ Γαλιλαίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/069.yaml
  text: Peter was sitting outside in the courtyard[a], and one servant girl came up to him, saying, “You also were with Jesus the Galilean.”
translation:
  language: ru
  text: 'Пётр же сидел снаружи, во дворе. К нему подошла одна служанка[a] и сказала: «И ты был с Иисусом Галилеянином».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «девушка-служанка»; возможно также: «рабыня». Греческое слово παιδίσκη может обозначать молодую служанку, в том числе рабыню.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: же
  rationale: Мягко передаёт переход и лёгкое сопоставление с происходящим внутри, не вводя отсутствующего в греческом тексте временного «тогда».
- source_word: ἐκάθητο ἔξω
  choice: сидел снаружи
  rationale: Имперфект передаёт продолжавшееся состояние; «снаружи» указывает на положение вне помещения, но во дворе.
- source_word: ἐν τῇ αὐλῇ
  choice: во дворе
  rationale: В данном контексте αὐλή обозначает внутренний двор резиденции первосвященника; по-русски естественно «во дворе».
- source_word: προσῆλθεν αὐτῷ
  choice: к нему подошла
  rationale: Точно и естественно передаёт физическое приближение.
- source_word: μία παιδίσκη
  choice: одна служанка[a]
  rationale: «Служанка» передаёт женский пол и служебное положение; μία сохранено как «одна», вводя конкретную участницу сцены. Возможный рабский статус отмечен в сноске.
- source_word: λέγουσα
  choice: и сказала
  rationale: Замена причастия личной формой создаёт естественное русское повествование без изменения последовательности действий.
- source_word: Καὶ σὺ
  choice: И ты
  rationale: Сохраняет καί и эмфатическое σὺ, выделяя Петра как ещё одного человека, связанного с Иисусом.
- source_word: ἦσθα μετὰ
  choice: был с
  rationale: Передаёт простое указание на совместное пребывание, не добавляя толкования о формальном ученичестве.
- source_word: Ἰησοῦ τοῦ Γαλιλαίου
  choice: Иисусом Галилеянином
  rationale: Сохраняет прозвище-обозначение происхождения, а не превращает его в более свободное «Иисусом из Галилеи».
