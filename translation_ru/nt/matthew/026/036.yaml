revisions:
- from: 'Тогда Иисус приходит с ними в место, называемое Гефсиманией, и говорит ученикам: «Посидите здесь, пока Я отойду туда и помолюсь».[a]'
  to: 'Тогда Иисус приходит с ними на место, называемое Гефсиманией, и говорит ученикам: «Посидите здесь, пока Я отойду туда и помолюсь».[a]'
  rationale: Исправлено только неестественное «в место» на нормативное в данном контексте «на место». Сноска уточнена, чтобы представить более буквальную временную конструкцию без неоправданного акцента на завершении молитвы. Смысл, историческое настоящее, широта χωρίον и различение «здесь/туда» сохранены.
  reviewer_model: gpt-5.6-terra
