  text: Τότε ἔρχεται μετ’ αὐτῶν ὁ Ἰησοῦς εἰς χωρίον λεγόμενον Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς· Καθίσατε αὐτοῦ ἕως οὗ ἀπελθὼν ⸂ἐκεῖ προσεύξωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/036.yaml
  text: Then Jesus comes with them to a place called Gethsemane[a], and he says to the disciples, “Sit here while I go over there and pray.”
translation:
  language: ru
  text: 'Тогда Иисус приходит с ними на место, называемое Гефсиманией, и говорит ученикам: «Посидите здесь, пока Я отойду туда и помолюсь».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Посидите здесь до тех пор, пока Я не уйду туда помолиться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Обычная временная связка, продолжающая последовательный рассказ.
- source_word: ἔρχεται
  choice: приходит
  rationale: Сохранено историческое настоящее греческого текста, придающее повествованию живость.
- source_word: μετ’ αὐτῶν
  choice: с ними
  rationale: Прямо передаёт значение совместного движения.
- source_word: χωρίον
  choice: место
  rationale: Слово обозначает место, участок или владение; «место» сохраняет широту значения и не привносит из Ин. 18:1 уточнение «сад».
- source_word: λεγόμενον Γεθσημανί
  choice: называемое Гефсиманией
  rationale: Естественная русская формула наименования места; имя собственное передано в принятой русской форме.
- source_word: λέγει
  choice: говорит
  rationale: Сохранено историческое настоящее в согласии с ἔρχεται.
- source_word: Καθίσατε αὐτοῦ
  choice: Посидите здесь
  rationale: Передаёт повеление сесть или оставаться сидящими в указанном месте; форма «посидите» естественно выражает временный характер действия.
- source_word: ἕως οὗ
  choice: пока
  rationale: Естественно вводит временную границу ожидания, не устраняя возможного оттенка «до тех пор, пока».
- source_word: ἀπελθὼν ἐκεῖ προσεύξωμαι
  choice: Я отойду туда и помолюсь
  rationale: Финитные глаголы естественно передают по-русски последовательность, выраженную аористным причастием и личной формой; «туда» сохраняет противопоставление слову «здесь».
theological_decisions:
- issue: Характер места Гефсимания
  choice: χωρίον переведено как «место»
  alternative: «сад»
  rationale: Матфей называет Гефсиманию лишь «местом»; вариант «сад» привнёс бы подробность из Ин. 18:1, которой нет в данном стихе.
- issue: Временное соотношение ухода Иисуса и ожидания учеников
  choice: «пока Я отойду туда и помолюсь»
  alternative: «до тех пор, пока Я, отойдя туда, не помолюсь»
  rationale: Основной вариант звучит естественно по-русски и сохраняет временную связь; примечание указывает более буквальное выражение конечной границы, не навязывая более узкого толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Историческое настоящее сохранено последовательно. Формулировка избегает церковнославянизмов и не называет Гефсиманию садом вопреки лексической широте Матфея.
