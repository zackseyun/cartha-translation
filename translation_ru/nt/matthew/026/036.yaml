review_pass:
  verdict: revise
  source_fidelity: Основной перевод верно передаёт историческое настоящее (ἔρχεται, λέγει), совместное движение, неопределённо широкое χωρίον, название Гефсимании, указательные «здесь/туда» и временную связь ἕως οὗ. Однако сочетание «прийти в место» в современном русском неудачно и может восприниматься как оборот «вместо».
  naturalness: «Прийти ... на место, называемое Гефсиманией» — естественная литературная формулировка без добавления значения «сад» или «имение». Основное «Посидите здесь, пока Я отойду туда и помолюсь» звучит плавно и соответствует повествовательному регистру.
  terminology: «Гефсимания» — принятая русская передача имени. «Место» сохраняется как перевод χωρίον и не привносит деталь из Ин. 18:1. Форму «помолюсь» следует сохранить; она передаёт προσεύξωμαι без конфессиональной окраски.
  issues:
  - severity: medium
    issue: Неестественное управление в «приходит с ними в место».
    rationale: В современном русском «в место» обычно читается как «вместо» либо требует более конкретного существительного. «На место» естественно обозначает прибытие к названной локации и не изменяет значения εἰς χωρίον.
  - severity: low
    issue: 'Сноска создаёт более сильное впечатление завершённости молитвы: «пока ... не помолюсь».'
    rationale: Греческое ἀπελθὼν ... προσεύξωμαι буквально сочетает предшествующее удаление с молитвой; русский вариант «не уйду туда помолиться» лучше отражает эту конструкцию, не делая завершение молитвы отдельной, чрезмерно подчеркнутой временной границей.
  revised_text: 'Тогда Иисус приходит с ними на место, называемое Гефсиманией, и говорит ученикам: «Посидите здесь, пока Я отойду туда и помолюсь».[a]'
