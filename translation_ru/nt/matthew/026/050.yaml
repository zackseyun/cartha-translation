  source_fidelity: Первая часть стиха и сноска точно передают обращение Ἑταῖρε и синтаксически сжатую, спорную фразу ἐφ’ ὃ πάρει. Однако в заключительной части «взяли Его под стражу» привносит юридически-административный оттенок, которого κρατέω само по себе не выражает. Кроме того, исходные два последовательных действия — наложили руки и схватили/задержали — следует передать без такого добавочного оттенка.
  naturalness: «Друг, делай то, для чего пришёл» — естественно для современного литературного русского и сохраняет сдержанность обращения. «Подошли, схватили Иисуса и удержали Его» звучит ясно и естественно, при этом позволяет передать оба близких по смыслу глагола оригинала.
  terminology: «Друг» уместно и не навязывает представления о близкой дружбе. Сноска корректно сохраняет вопросительное понимание спорной греческой фразы. Заглавное «Его» может быть сохранено как принятая библейская стилистическая конвенция.
