  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Ἑταῖρε, ἐφ’ ⸀ὃ πάρει. τότε προσελθόντες ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν καὶ ἐκράτησαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/050.yaml
  text: But Jesus said to him[a], “Friend, do what you came for.” Then they came up, laid hands on Jesus, and seized him.
translation:
  language: ru
  text: 'Но Иисус сказал ему: «Друг, делай то, для чего пришёл».[a] Тогда они подошли, схватили Иисуса и удержали Его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Друг, для чего ты пришёл?» Греческая фраза предельно кратка и может пониматься как вопрос.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Друг
  rationale: Естественное русское обращение, сохраняющее сдержанный тон; в данном контексте оно не обязательно выражает близкую дружбу.
- source_word: ἐφ’ ὃ πάρει
  choice: делай то, для чего пришёл
  rationale: Передаёт наиболее вероятный в контексте побудительно-разрешительный смысл предельно краткой греческой фразы, не скрывая в сноске возможности вопросительного понимания.
- source_word: προσελθόντες
  choice: подошли
  rationale: Естественно передаёт движение участников ареста к Иисусу и последовательность повествования.
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν
  choice: схватили Иисуса
  rationale: Ясно и современно передаёт идиому физического захвата; буквальное «возложили руки» по-русски могло бы получить неуместный религиозный оттенок.
- source_word: ἐκράτησαν αὐτόν
  choice: взяли Его под стражу
  rationale: В сочетании с предшествующим «схватили» передаёт переход от физического захвата к удержанию Иисуса без неестественного повтора.
- source_word: δὲ
  choice: Но
  rationale: Передаёт мягкий контраст и повествовательный переход от поступка Иуды к ответу Иисуса.
theological_decisions:
- issue: Смысл обращения и краткой реплики Иисуса Иуде
  choice: «Друг, делай то, для чего пришёл»
  alternative: «Друг, для чего ты пришёл?»
  rationale: Основной текст сохраняет сдержанный, допускающий действие смысл, не усиливая ни дружелюбие, ни осуждение. Поскольку греческая конструкция синтаксически сжата и может пониматься как вопрос, альтернативное прочтение дано в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Заглавное «Его» употреблено по принятой в русском библейском стиле традиции; лексика избегает архаизмов и двусмысленного буквального выражения «возложили руки».
