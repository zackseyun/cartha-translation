  text: βαλοῦσα γὰρ αὕτη τὸ μύρον τοῦτο ἐπὶ τοῦ σώματός μου πρὸς τὸ ἐνταφιάσαι με ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/012.yaml
  text: For when she poured this perfume on my body[b][a], she did it to prepare me for burial.
translation:
  language: ru
  text: Ведь эта женщина, вылив это благовонное масло на Моё тело, приготовила Меня к погребению.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для Моего погребения». Греческое выражение может быть передано более кратко, однако глагол включает смысл приготовления тела к погребению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσα
  choice: вылила
  rationale: Аористное причастие от βάλλω в данном контексте означает нанесение жидкого благовония; по-русски естественно передать его личной формой «вылила», включив в основное предложение.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит объяснение предыдущих слов Иисуса; «ведь» естественно передаёт эту пояснительно-причинную связь.
- source_word: μύρον
  choice: благовонное масло
  rationale: μύρον — ароматическое масло или мазь для помазания. «Благовонное масло» понятно современному читателю и, в отличие от одного слова «благовоние», ясно указывает на жидкое вещество.
- source_word: ἐπὶ τοῦ σώματός μου
  choice: на Моё тело
  rationale: ἐπί с родительным падежом здесь обозначает нанесение вещества на поверхность тела.
- source_word: πρὸς τὸ ἐνταφιάσαι με
  choice: чтобы приготовить Меня к погребению
  rationale: πρός с субстантивированным инфинитивом выражает цель, а ἐνταφιάζω включает смысл приготовления тела к погребению.
- source_word: ἐποίησεν
  choice: передано конструкцией всего предложения
  rationale: Буквальное «она сделала это» после упоминания того, что она вылила масло, звучало бы по-русски тяжеловесно. Перестройка предложения сохраняет действие и его цель без ненужного повтора.
- source_word: αὕτη
  choice: она
  rationale: Женщина уже однозначно названа в контексте; русское местоимение передаёт референцию естественно, тогда как «эта женщина» здесь было бы излишне подчёркнутым.
theological_decisions:
- issue: Значение ἐνταφιάζω в связи со смертью Иисуса
  choice: Поступок женщины представлен как приготовление Иисуса к погребению.
  alternative: «для Моего погребения» или «чтобы похоронить Меня»
  rationale: Глагол ἐνταφιάζω обозначает приготовление тела к погребению или предание погребению. Выбранный вариант сохраняет целевую конструкцию и предвосхищение погребения, не добавляя иных богословских выводов.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Благовонное масло» предпочтено церковному термину «миро», который не всем современным читателям понятен без пояснения. Перестройка причастной конструкции устраняет неестественный повтор «вылив… она сделала это».
