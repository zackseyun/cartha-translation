  text: τότε ὁ ἀρχιερεὺς διέρρηξεν τὰ ἱμάτια αὐτοῦ ⸀λέγων· Ἐβλασφήμησεν· τί ἔτι χρείαν ἔχομεν μαρτύρων; ἴδε νῦν ἠκούσατε τὴν ⸀βλασφημίαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/065.yaml
  text: Then the high priest tore his garments[a], saying, “He has blasphemed! What further need do we have of witnesses? See[b], now you have heard the blasphemy.”
translation:
  language: ru
  text: 'Тогда первосвященник разорвал на себе одежды[a] и сказал: «Он богохульствует! Зачем нам ещё свидетели? Вот, вы только что слышали это богохульство».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Разрывание одежды было публичным знаком потрясения, скорби или негодования.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественная повествовательная связка, точно передающая последовательность событий.
- source_word: ὁ ἀρχιερεὺς
  choice: первосвященник
  rationale: Общепринятое русское обозначение единственного носителя этой должности в данном иудейском контексте.
- source_word: διέρρηξεν τὰ ἱμάτια αὐτοῦ
  choice: разорвал на себе одежды
  rationale: Передаёт реальное действие и естественно по-русски указывает, что речь идёт о его собственной одежде; «одежды» сохраняет торжественный и культурно значимый оттенок.
- source_word: λέγων
  choice: и сказал
  rationale: В русском повествовании сочинительная конструкция звучит естественнее буквального причастного оборота и сохраняет одновременную связь действий.
- source_word: Ἐβλασφήμησεν
  choice: Он богохульствует
  rationale: Восклицательное настоящее передаёт непосредственную обвинительную оценку только что произнесённых слов; термин «богохульствует» сохраняет религиозно-правовой смысл.
- source_word: τί ἔτι χρείαν ἔχομεν μαρτύρων;
  choice: Зачем нам ещё свидетели?
  rationale: Краткое и естественное выражение по-русски точно передаёт вопрос о дальнейшей необходимости свидетелей и значение ἔτι.
- source_word: ἴδε νῦν
  choice: Вот, теперь
  rationale: «Вот» выполняет указательно-привлекающую функцию ἴδε, а «теперь» явно сохраняет νῦν.
- source_word: ἠκούσατε
  choice: вы сами слышали
  rationale: Прошедшее время соответствует завершённому непосредственному восприятию; «сами» передаёт доказательную силу обращения, не добавляя нового участника или события.
- source_word: τὴν βλασφημίαν
  choice: это богохульство
  rationale: Указательное «это» естественно отсылает к только что услышанным словам; «богохульство» сохраняет характер обвинения.
theological_decisions:
- issue: Обвинение, выраженное βλασφημέω / βλασφημία
  choice: Сохранить в прямой речи слова «богохульствует» и «богохульство» как формулировку первосвященника.
  alternative: «произнёс хулу» / «хульные слова»
  rationale: Текст сообщает религиозно-правовое обвинение первосвященника, а не обязательно подтверждает его устами повествователя. Прямая речь сохраняет это различие и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис прямой и понятный; сохранена юридически и богословски весомая лексика без архаизации. Английская сноска a в предоставленном материале, по-видимому, ошибочно сопоставлена с текстом о свидетелях; маркер поставлен у культурно значимого действия и снабжён соответствующим пояснением.
