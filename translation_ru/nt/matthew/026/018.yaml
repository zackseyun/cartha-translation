  naturalness: «У тебя я совершу Пасху вместе с Моими учениками» естественно и ясно в современном литературном библейском русском. Порядок слов не создаёт двусмысленности; «вместе» можно опустить как стилистически необязательное, но оно не искажает смысла.
  terminology: '«Учитель», «Пасха» и «ученики» удачны. Строчная буква в местоимении «моими» предпочтительна для современного литературного издания: прописная является конфессионально-традиционной типографикой, а не требованием исходного текста.'
