- from: 'Он сказал: «Пойдите в город к одному человеку и скажите ему: „Учитель говорит: ‘Моё время близко. У тебя я совершу пасхальную трапезу вместе с Моими учениками’“».'
  to: 'Он сказал: «Пойдите в город к одному человеку и скажите ему: „Учитель говорит: ‘Моё время близко. У тебя я совершу Пасху с моими учениками’“».'
  rationale: Заменено «совершу пасхальную трапезу» на «совершу Пасху», чтобы не добавлять к греческому тексту слово «трапеза» и сохранить идиоматическое, более широкое значение ποιῶ τὸ πάσχα. Местоимение «моими» приведено к нейтральной современной орфографической практике. Другие смысловые решения сохранены, включая «у тебя» как контекстуальное, но не чрезмерно конкретизированное соответствие πρὸς σέ.
