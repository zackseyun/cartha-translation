  text: ὁ δὲ εἶπεν· Ὑπάγετε εἰς τὴν πόλιν πρὸς τὸν δεῖνα καὶ εἴπατε αὐτῷ· Ὁ διδάσκαλος λέγει· Ὁ καιρός μου ἐγγύς ἐστιν· πρὸς σὲ ποιῶ τὸ πάσχα μετὰ τῶν μαθητῶν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/018.yaml
  text: He said[a], “Go into the city to a certain man and tell him, ‘The Teacher says, “My time is near[c][b]. I am keeping the Passover with you with my disciples.”’”
translation:
  language: ru
  text: 'Он сказал: «Пойдите в город к одному человеку и скажите ему: „Учитель говорит: ‘Моё время близко. У тебя я совершу Пасху с моими учениками’“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Пойдите
  rationale: Естественно передаёт повеление о движении без лишнего оттенка ухода или удаления.
- source_word: πρὸς τὸν δεῖνα
  choice: к одному человеку
  rationale: Указывает на конкретного, но намеренно не названного человека; выражение «к такому-то» возможно, но более разговорно.
- source_word: Ὁ διδάσκαλος
  choice: Учитель
  rationale: Точно и естественно передаёт διδάσκαλος как титул Иисуса, не смешивая его со значением κύριος.
- source_word: Ὁ καιρός μου ἐγγύς ἐστιν
  choice: Моё время близко
  rationale: Сохраняет широту καιρός и не уточняет сверх текста, идёт ли речь именно о смерти, трапезе или завершении служения.
- source_word: πρὸς σὲ
  choice: у тебя
  rationale: Близко к греческому выражению и естественно обозначает место или гостеприимство, не добавляя прямо отсутствующее в тексте слово «дом».
- source_word: ποιῶ τὸ πάσχα
  choice: совершу пасхальную трапезу
  rationale: Передаёт идиому ποιεῖν τὸ πάσχα как соблюдение Пасхи в данном контексте подготовки трапезы; будущее время естественно выражает ближайшее намерение.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: вместе с Моими учениками
  rationale: «Ученики» — устоявшийся и точный евангельский эквивалент μαθηταί; «вместе» делает связь с хозяином места синтаксически яснее.
theological_decisions:
- issue: Значение приближающегося καιρός Иисуса
  choice: Моё время близко
  alternative: Мой назначенный срок близок; Мой час близок
  rationale: Стих сообщает о близости значимого времени, но сам не определяет его объём. Широкая формулировка сохраняет повествовательное и богословское напряжение.
- issue: Значение ποιῶ τὸ πάσχα
  choice: совершу пасхальную трапезу
  alternative: совершу Пасху; отпраздную Пасху; соблюду Пасху
  rationale: Контекст непосредственно связан с приготовлением пасхальной трапезы, однако формулировка не должна сводить Пасху лишь к празднованию в современном смысле.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельского повествования. Прямая речь оформлена ясно; намеренная неопределённость лица и значения «времени» сохранена. Прописные буквы в местоимениях, относящихся к Иисусу, применены в соответствии с традиционным русским библейским регистром.
