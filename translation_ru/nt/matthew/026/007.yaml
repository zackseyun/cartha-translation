  text: προσῆλθεν αὐτῷ γυνὴ ⸂ἔχουσα ἀλάβαστρον μύρου⸃ βαρυτίμου καὶ κατέχεεν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ ἀνακειμένου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/007.yaml
  text: a woman came to him holding an alabaster jar of very costly perfume[b][a], and she poured it on his head as he was reclining at the table.
translation:
  language: ru
  text: К Нему подошла женщина с алебастровым сосудом, полным очень дорогого благовонного масла[a], и вылила это масло Ему на голову, когда Он возлежал за столом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с алебастровым сосудом очень дорогой благовонной мази». Греческое μύρον могло обозначать ароматическое масло или мазь.'
    reason: lexical_alternative
  - marker: b
    text: То есть занимал принятую в то время позу для трапезы.
    reason: cultural_note
lexical_decisions:
- source_word: προσῆλθεν αὐτῷ
  choice: К Нему подошла
  rationale: Передаёт направленное движение к человеку; «подошла» естественно звучит по-русски и соответствует контексту.
- source_word: γυνὴ
  choice: женщина
  rationale: В греческом тексте женщина здесь не названа и не описана; неопределённость сохраняется.
- source_word: ἔχουσα
  choice: с ... сосудом
  rationale: Русская конструкция с предлогом «с» естественно передаёт, что женщина принесла и держала сосуд, не прибегая к тяжеловесному причастию.
- source_word: ἀλάβαστρον μύρου
  choice: алебастровым сосудом, полным ... благовонного масла
  rationale: ἀλάβαστρον обозначает сосуд, обычно для благовоний, а μύρον — ароматическое масло или мазь. Формулировка ясна современному читателю и не сводит вещество к современным жидким духам.
- source_word: βαρυτίμου
  choice: очень дорогого
  rationale: Передаёт усиленное указание на высокую стоимость вещества.
- source_word: κατέχεεν
  choice: вылила
  rationale: Глагол означает лить или выливать на что-либо; совершенный вид уместно передаёт повествовательный аорист.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: Ему на голову
  rationale: Естественная русская конструкция точно передаёт место, куда было вылито масло.
- source_word: ἀνακειμένου
  choice: когда Он возлежал за столом
  rationale: Причастие указывает на принятую в то время позу во время трапезы. Добавление «за столом» делает подразумеваемую обстановку понятной без изменения смысла.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Возлежал» сохранено как точное и узнаваемое обозначение древней застольной позы; культурная реалия пояснена в сноске. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской практикой.
