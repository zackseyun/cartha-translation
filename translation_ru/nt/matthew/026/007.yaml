  source_fidelity: 'Перевод точно передаёт все основные элементы SBLGNT: женщина подошла к Иисусу, имея при себе алебастровый сосуд с весьма дорогим μύρον, вылила его Ему на голову, когда Он возлежал. «Полным ... масла» эксплицирует естественно подразумеваемое содержимое сосуда и не меняет смысла. «Когда» корректно передаёт сопутствующее обстоятельство, выраженное ἀνακειμένου.'
  naturalness: Текст звучит естественно на современном литературном русском. «Алебастровый сосуд» и «благовонное масло» понятны и уместны в умеренно возвышенном библейском регистре. «Возлежал за столом» точно и достаточно ясно описывает древнюю трапезную позу; сноска удачно снимает возможную неясность.
  terminology: «Благовонное масло» является удачной основной передачей μύρον, а сноска корректно сохраняет лексическую альтернативу «мазь». «Очень дорогого» адекватно передаёт βαρυτίμου. Неопределённое «женщина» сохранено; никаких конфессионально окрашенных интерпретаций не добавлено. Сноски привязаны к соответствующим словам и содержательно согласованы с английским аудит-трейлом.
