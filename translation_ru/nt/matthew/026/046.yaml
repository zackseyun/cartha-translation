id: MAT.26.46
reference: Matthew 26:46
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐγείρεσθε ἄγωμεν· ἰδοὺ ἤγγικεν ὁ παραδιδούς με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/046.yaml
  text: Get up, let us go. Look, my betrayer[a] is near.
translation:
  language: ru
  text: Вставайте, пойдём. Вот, приблизился тот, кто предаёт меня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тот, кто выдаёт (передаёт) меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: Вставайте
  rationale: Повелительное наклонение множественного числа обращено к ученикам; «вставайте» прямо, естественно и точно передаёт призыв подняться.
- source_word: ἄγωμεν
  choice: пойдём
  rationale: Увещевательное сослагательное наклонение первого лица множественного числа естественно передаётся формой совместного побуждения «пойдём».
- source_word: ἰδού
  choice: Вот
  rationale: Частица привлекает внимание к немедленно происходящему; «вот» сохраняет живость и срочность без архаического оттенка.
- source_word: ἤγγικεν
  choice: приблизился
  rationale: 'Перфект обозначает завершившееся приближение с актуальным результатом: этот человек уже близко. Русское «приблизился» естественно сохраняет и движение, и наступившую близость.'
- source_word: ὁ παραδιδούς με
  choice: тот, кто предаёт меня
  rationale: Субстантивированное причастие настоящего времени характеризует человека через совершаемое им действие. Эта формулировка сохраняет словесный характер греческого выражения и в контексте Страстей естественно передаёт предательство.
theological_decisions:
- issue: Передача παραδιδούς в контексте Страстей
  choice: тот, кто предаёт меня
  alternative: тот, кто выдаёт меня
  rationale: Глагол παραδίδωμι буквально может означать передачу или выдачу человека, а в данном контексте это действие является предательством. Основной текст передаёт контекстуальный смысл, а сноска сохраняет конкретное значение действия, не стирая многозначности.
translation_notes:
  register: Современная литературная русская речь с кратким, настойчивым ритмом прямой речи. «Вот» предпочтено более книжному «вот, уже» и архаическому «се»; порядок слов сохраняет драматическое выделение приближающегося предателя.
