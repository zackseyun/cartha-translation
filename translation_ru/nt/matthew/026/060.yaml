lexical_decisions:
- source_word: οὐχ εὗρον
  choice: не нашли ничего
  rationale: 'В греческом тексте дополнение не выражено и восстанавливается из контекста: искали свидетельство или обвинение против Иисуса. «Не нашли ничего» естественно передаёт отсутствие пригодного свидетельства, не уточняя подразумеваемый объект сверх исходного текста.'
- source_word: πολλῶν προσελθόντων ψευδομαρτύρων
  choice: хотя выступало много лжесвидетелей
  rationale: Родительный абсолют имеет здесь уступительное значение. «Лжесвидетели» сохраняет судебный контекст, а «выступало» естественно описывает явку свидетелей для дачи показаний.
- source_word: ὕστερον δὲ
  choice: Наконец
  rationale: ὕστερον указывает на последующий этап разбирательства, а δέ обозначает повествовательный поворот. В данном контексте «наконец» кратко и естественно передаёт оба оттенка, не подразумевая успешности показаний.
- source_word: προσελθόντες δύο
  choice: выступили двое
  rationale: В судебной обстановке προσέρχομαι означает выход свидетелей для дачи показаний; «выступили» звучит естественнее буквального «подошли». Постпозиция «двое» сохраняет смысловое выделение числа.
