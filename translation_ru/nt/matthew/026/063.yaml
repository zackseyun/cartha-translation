lexical_decisions:
- source_word: ἐσιώπα
  choice: продолжал молчать
  rationale: Имперфект передаёт продолжавшееся молчание; такой перевод естественно выражает длительный вид действия по-русски.
- source_word: ἀρχιερεὺς
  choice: первосвященник
  rationale: Устоявшееся и точное обозначение высшей иудейской священнической должности в данном судебном контексте.
- source_word: Ἐξορκίζω
  choice: заклинаю
  rationale: Здесь глагол обозначает торжественное обязывание ответить под клятвой, а не изгнание духов. «Заклинаю» кратко и точно передаёт формулу, хотя её клятвенный смысл поясняется в сноске.
- source_word: κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: живым Богом
  rationale: В сочетании с ἐξορκίζω оборот указывает на призывание живого Бога как основания торжественной клятвы; русская формула сохраняет эту силу.
- source_word: ἵνα ἡμῖν εἴπῃς
  choice: скажи нам
  rationale: После формулы заклинания конструкция выражает требуемое действие; повелительная форма звучит естественно и сохраняет прямоту требования.
- source_word: ὁ χριστὸς
  choice: Мессия
  rationale: Слово употреблено как титул ожидаемого Помазанника, а не как часть имени; «Мессия» ясно передаёт этот смысл в контексте вопроса первосвященника.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Сын Божий
  rationale: Сохранён определённый христологический титул без ослабления или богословского расширения.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Но Иисус
  rationale: δέ обозначает умеренное противопоставление предшествующим обвинениям; союз «но» естественно передаёт этот повествовательный поворот.
theological_decisions:
- issue: Передача Χριστός в прямом вопросе о мессианском статусе Иисуса
  choice: Мессия
  alternative: Христос
  rationale: В данном месте слово явно служит титулом ожидаемого Помазанника. Основной текст передаёт титульный смысл, а традиционный вариант сохраняется в сноске.
- issue: Сила формулы Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: 'Торжественное обязывание ответить под клятвой: «Заклинаю Тебя живым Богом»'
  alternative: «Обязываю Тебя клятвой перед живым Богом»
  rationale: Формула призывает Бога и имеет торжественную, близкую к судебной силу. Выбранный вариант сохраняет эту силу и не истолковывает выражение как простое распоряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством судебно-религиозной сцены. Продолженность молчания выражена явно; торжественная формула сохранена без излишней архаизации, а её возможная неясность пояснена в сноске.
