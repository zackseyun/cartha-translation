language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Σὺ εἶπας· πλὴν λέγω ὑμῖν, ἀπ’ ἄρτι ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου καθήμενον ἐκ δεξιῶν τῆς δυνάμεως καὶ ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/064.yaml
  text: Jesus said to him[a], “You have said so. But I tell you[c][b], from now on you will see the Son of Man seated at the right hand of Power and coming on the clouds of heaven.”
translation:
  language: ru
  text: 'Иисус сказал ему: «Ты сказал[a]. Но говорю вам[b]: отныне вы увидите Сына Человеческого, сидящим по правую руку от Силы[c] и грядущего на облаках небесных».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты сказал». Это греческое выражение служит идиоматическим утвердительным ответом.'
    reason: lexical_alternative
  - marker: b
    text: Ср. Дан 7:13 и Пс 109:1.
    reason: cross_reference
  - marker: c
    text: «Сила» — благоговейное иносказательное обозначение Бога.
    reason: cultural_note
lexical_decisions:
- source_word: Σὺ εἶπας
  choice: Ты сам сказал
  rationale: Сохраняет греческую форму идиоматического утвердительного ответа, не сводя её к безоговорочному «да» и не представляя уклонением.
- source_word: πλὴν
  choice: Но
  rationale: Естественно передаёт сильный переход к следующему торжественному заявлению.
- source_word: ἀπ’ ἄρτι
  choice: отныне
  rationale: Кратко и естественно обозначает начало нового положения вещей с этого момента, не ограничивая смысл мгновенным исполнением.
- source_word: ὄψεσθε
  choice: вы увидите
  rationale: Прямо и современно передаёт будущее время ὁράω; множественное число сохраняет переход от обращения к первосвященнику к обращению ко всем присутствующим.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Сына Человеческого
  rationale: Сохраняет укоренившееся самоназвание и его связь с Дан 7.
- source_word: καθήμενον
  choice: сидящего
  rationale: Прямая передача причастия; в сочетании с местом по правую руку выражает возвышенное положение и власть.
- source_word: ἐκ δεξιῶν
  choice: по правую руку
  rationale: Естественная русская библейская идиома, передающая почёт, близость и власть.
- source_word: τῆς δυνάμεως
  choice: Силы
  rationale: С заглавной буквы сохраняет благоговейное иносказательное обозначение Бога, не заменяя его более явным толкованием.
- source_word: ἐρχόμενον
  choice: грядущего
  rationale: Сохраняет торжественный библейский регистр и отсылку к Дан 7:13; современному читателю слово понятно.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: на облаках небесных
  rationale: Прозрачно передаёт предлог ἐπί и сохраняет образ и словесную связь с Дан 7:13.
theological_decisions:
- issue: Сила ответа Σὺ εἶπας первосвященнику
  choice: 'Утвердительный, но не сведённый к простому «да» ответ: «Ты сам сказал».'
  alternative: «Да» или уклончивое «Это говоришь ты».
  rationale: Фраза в контексте служит подтверждением, однако её особая форма значима и не должна исчезать или превращаться в уклонение.
- issue: Референт τῆς δυνάμεως
  choice: Сохранено благоговейное обозначение Бога «Сила».
  alternative: Явное «Бог» или толковательное «Всемогущий».
  rationale: Так сохраняются формулировка и сдержанность греческого текста без внесения пояснения непосредственно в перевод.
- issue: Временной охват слов «вы увидите»
  choice: Возвышение Сына Человеческого и Его пришествие оставлены соединёнными, как в греческом тексте.
  alternative: Отнести всё исключительно к ближайшему будущему либо исключительно ко Второму пришествию.
  rationale: Два причастия вместе зависят от «увидите»; перевод не разрешает спорную эсхатологическую хронологию за читателя.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Грядущего» и «по правую руку» сохраняют межтекстовые связи, оставаясь понятными; синтаксис не устраняет намеренную богословскую и временную напряжённость стиха.
