  naturalness: «Ты сказал» — естественное современное литературное соответствие с нужной сдержанностью. «Сидящим по правую руку от Силы» звучит по-русски естественнее, чем «сидящего по правую руку Силы», и сохраняет традиционный возвышенный оттенок.
