  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἀπὸ τότε ἐζήτει εὐκαιρίαν ἵνα αὐτὸν παραδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/016.yaml
  text: And from then on he was seeking an opportunity to hand him over[a].
translation:
  language: ru
  text: И с того времени он искал удобного случая, чтобы выдать Его[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предать Его». Греческий глагол буквально означает «передать» или «выдать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τότε
  choice: с того времени
  rationale: Естественно передаёт исходную временную точку и продолжение действия после неё.
- source_word: ἐζήτει
  choice: искал
  rationale: Несовершенный вид русского глагола передаёт длительное или повторяющееся действие, выраженное греческим имперфектом.
- source_word: εὐκαιρίαν
  choice: удобного случая
  rationale: Передаёт не просто возможность, а подходящий, благоприятный момент.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно выражает цель поисков Иуды.
- source_word: παραδῷ
  choice: выдать
  rationale: Русское «выдать» сохраняет основное значение передачи человека в чужие руки и в данном контексте естественно допускает смысл предательства, не подменяя глагол более узким толкованием.
- source_word: αὐτὸν
  choice: Его
  rationale: Местоимение относится к Иисусу; прописная буква соответствует принятому благоговейному русскому библейскому употреблению.
theological_decisions:
- issue: Передача παραδῷ в контексте поступка Иуды
  choice: выдать Его
  alternative: предать Его
  rationale: «Предать» прямо называет поступок предательством, тогда как греческий глагол имеет более широкое значение «передать, выдать». Основной текст сохраняет эту широту, а контекстуально верная альтернатива вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная и достойная формулировка. Сохранён длительный характер поисков и лексическая широта παραδίδωμι.
