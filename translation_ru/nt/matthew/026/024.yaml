source:
  edition: SBLGNT
  text: ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/024.yaml
  text: The Son of Man indeed goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been better for him if that man had not been born.
translation:
  language: ru
  text: Сын Человеческий уходит, как и написано о Нём, но горе тому человеку, через которого Сын Человеческий предаётся[a]. Лучше было бы тому человеку не родиться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «передаётся» или «выдаётся». Греческий глагол может означать как предательство, так и передачу кого-либо; здесь основное чтение учитывает вероломство Иуды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Сохраняется устоявшийся титул; сопоставление μὲν…δὲ естественно передано построением первой части и союзом «но».
- source_word: ὑπάγει
  choice: уходит
  rationale: Настоящее время и намеренно широкое значение глагола сохранены без явного истолкования как смерти, хотя в контексте подразумеваются предстоящие страдания.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: как и написано о Нём
  rationale: Обычная русская формула «написано» естественно передаёт перфект со значением сохраняющей силу записи; частица «и» подчёркивает соответствие Писанию.
- source_word: οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ
  choice: но горе тому человеку
  rationale: «Горе» сохраняет пророческую и судебную силу οὐαί, а «но» выражает контраст δέ.
- source_word: δι’ οὗ
  choice: через которого
  rationale: Передаёт посредническое значение διά с родительным падежом и не снимает личной ответственности действующего лица.
- source_word: παραδίδοται
  choice: предаётся
  rationale: В контексте поступка Иуды «предаётся» одновременно выражает передачу в руки противников и оттенок предательства; более буквальная альтернатива указана в сноске.
- source_word: καλὸν ἦν αὐτῷ
  choice: лучше было бы тому человеку
  rationale: Русская идиома естественно выражает подразумеваемую предпочтительность и контрфактический смысл всей конструкции.
- source_word: εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος
  choice: не родиться
  rationale: Инфинитивная русская конструкция после «лучше было бы» точно и естественно передаёт нереальное условие; повторное «тому человеку» сохраняет референта и избегает тяжеловесности.
theological_decisions:
- issue: Соотношение исполнения Писания и ответственности предателя
  choice: 'Сохранены оба утверждения: путь Сына Человеческого соответствует написанному, а человек, через которого Он предаётся, находится под приговором «горе».'
  alternative: Истолковать исполнение Писания так, будто оно устраняет ответственность Иуды, либо ослабить исполнение Писания ради подчёркивания исключительно человеческого действия.
  rationale: Греческий текст ставит эти положения рядом и не разрешает напряжение между ними; перевод также не добавляет такого разрешения.
- issue: Смысл высказывания о нерождении
  choice: 'Передано как суровое суждение: тому человеку лучше было бы не родиться.'
  alternative: Объявить фразу лишь риторической гиперболой или вывести из неё подробное учение о конечной участи Иуды.
  rationale: Перевод сохраняет тяжесть сказанного, но не добавляет систематических выводов, которых сам стих прямо не формулирует.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан ясным для широкого читателя; титул «Сын Человеческий» и формула «горе тому человеку» сохранены в традиционно узнаваемом виде.
