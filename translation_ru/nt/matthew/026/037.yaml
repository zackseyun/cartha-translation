  text: καὶ παραλαβὼν τὸν Πέτρον καὶ τοὺς δύο υἱοὺς Ζεβεδαίου ἤρξατο λυπεῖσθαι καὶ ἀδημονεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/037.yaml
  text: And taking Peter and the two sons of Zebedee with him[a], he began to be sorrowful and deeply distressed.
translation:
  language: ru
  text: И, взяв с собой Петра и двух сыновей Зеведея, он начал скорбеть и испытывать глубокую тревогу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «печалиться и томиться».'
    reason: Лексическая альтернатива для сочетания λυπεῖσθαι καὶ ἀδημονεῖν, сохраняющая оттенки скорби и мучительного внутреннего беспокойства.
lexical_decisions:
- source_word: παραλαβὼν
  choice: взяв с собой
  rationale: Причастие от παραλαμβάνω здесь означает, что Иисус взял избранных учеников с собой; русский оборот естественно передаёт совместное следование.
- source_word: τοὺς δύο υἱοὺς Ζεβεδαίου
  choice: двух сыновей Зеведея
  rationale: Сохранено прямое обозначение греческого текста; имена Иакова и Иоанна не добавляются.
- source_word: ἤρξατο
  choice: начал
  rationale: Передаёт явно выраженное начинательное значение глагола с зависимыми инфинитивами.
- source_word: λυπεῖσθαι
  choice: скорбеть
  rationale: Передаёт переживание глубокой печали и сохраняет торжественный, но понятный современному читателю регистр.
- source_word: ἀδημονεῖν
  choice: испытывать глубокую тревогу
  rationale: Передаёт сильное внутреннее смятение и мучительное беспокойство, отличая этот оттенок от λυπεῖσθαι и не усиливая его до отчаяния.
- source_word: καὶ ... καὶ
  choice: и ... и
  rationale: Простое сочинение сохраняет последовательное накопление деталей и двух эмоциональных состояний в греческом тексте.
theological_decisions:
- issue: Описание эмоционального состояния Иисуса
  choice: Прямо передать подлинные скорбь и глубокую тревогу
  alternative: Смягчить переживания либо усилить их до ужаса или отчаяния
  rationale: Оба греческих глагола описывают реальное и тяжёлое человеческое страдание Иисуса. Перевод не умаляет его эмоциональную уязвимость, но и не вкладывает в текст безысходность, которой лексика сама по себе не требует.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Местоимение «он» написано со строчной буквы как обычное грамматическое местоимение, без внесения конфессиональной издательской традиции.
