base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/029.yaml
  text: But I tell you[a], from now on I will certainly not drink from this fruit of the vine until that day when I drink it new with you in the kingdom of my Father.
translation:
  language: ru
  text: 'Но говорю вам: отныне Я уже не буду пить от этого плода виноградной лозы до того дня, когда буду пить его вновь с вами в Царстве Моего Отца.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по-новому»; буквально: «новым». Греческое прилагательное может указывать на новое качество; выражение также может подразумевать, что в грядущем Царстве Он будет пить это новым образом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Но говорю вам
  rationale: δέ обозначает здесь мягкий переход с оттенком противопоставления; «но» естественно связывает это изречение с предшествующими словами.
- source_word: οὐ μὴ πίω
  choice: Я уже не буду пить
  rationale: Сочетание οὐ μή с аористом сослагательного наклонения выражает усиленное отрицание в будущем. В сочетании с «отныне» русское «уже не буду» передаёт решительность утверждения без неестественного или чрезмерно разговорного усиления.
- source_word: ἀπ’ ἄρτι
  choice: отныне
  rationale: Кратко и достойно передаёт отсчёт времени от настоящего момента; слово понятно в современном литературном русском.
- source_word: ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου
  choice: от этого плода виноградной лозы
  rationale: Сохраняет буквальный образ греческого выражения, обозначающего содержимое чаши, и не заменяет его более истолковывающим словом «вино».
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: до того дня
  rationale: Сохраняет указание на определённый будущий день, выраженное местоимением ἐκείνης.
- source_word: ὅταν αὐτὸ πίνω
  choice: когда буду пить его
  rationale: ὅταν с сослагательным наклонением указывает на будущее событие; «его» отсылает к плоду лозы, то есть к содержимому чаши.
- source_word: καινὸν
  choice: новым
  rationale: Прямо передаёт прилагательное καινός и оставляет открытым, идёт ли речь о новом качестве или об обновлённом участии; возможный наречный оттенок пояснён в сноске.
- source_word: μεθ’ ὑμῶν
  choice: с вами
  rationale: Естественно и точно передаёт совместность действия.
- source_word: ἐν τῇ βασιλείᾳ τοῦ πατρός μου
  choice: в Царстве Моего Отца
  rationale: Сохраняет торжественность выражения и личное обозначение Бога как Отца Иисуса.
theological_decisions:
- issue: Следует ли прямо назвать содержимое чаши вином
  choice: В основном тексте сохранено выражение «плод виноградной лозы»
  alternative: вино
  rationale: В греческом тексте стоит γένημα τῆς ἀμπέλου, а не οἶνος. Сохранение образного выражения следует оригиналу и не вносит дополнительной сакраментальной или символической конкретизации.
- issue: Смысл καινὸν применительно к будущей трапезе
  choice: В основном тексте сохранено «новым»
  alternative: вновь; по-новому
  rationale: Прилагательное может указывать на новое качество, но контекст допускает и смысл возобновлённого питья. Перевод не устраняет эту неоднозначность, а отмечает её в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Местоимения, относящиеся к Иисусу и Отцу, написаны с прописной буквы согласно принятой русской библейской издательской традиции. Синтаксис по возможности следует греческому тексту, но остаётся естественным для чтения вслух.
