lexical_decisions:
- source_word: ἐδύνατο
  choice: можно было
  rationale: Имперфект δύναμαι с инфинитивами выражает нереализованную возможность в прошлом; безличная русская конструкция передаёт это естественно.
- source_word: γὰρ
  choice: ведь
  rationale: Сохраняет пояснительно-обосновывающую связь с предшествующей жалобой и естественно звучит в прямой речи.
- source_word: τοῦτο
  choice: это
  rationale: Нейтральное указательное местоимение сохраняет формулировку греческого текста и отсылает к ранее названному благовонию.
- source_word: πραθῆναι
  choice: продать
  rationale: Аористный пассивный инфинитив в сочетании с русским безличным «можно было» естественно передаётся активным инфинитивом без изменения смысла.
- source_word: πολλοῦ
  choice: за большие деньги
  rationale: Родительный цены означает высокую продажную цену; эта формулировка ясна и естественна в современном русском языке.
- source_word: δοθῆναι
  choice: деньги раздать
  rationale: Греческий пассивный инфинитив буквально означает «быть отданным». В русском добавление подразумеваемого объекта «деньги» ясно показывает, что бедным передали бы выручку, а не само благовоние.
- source_word: πτωχοῖς
  choice: бедным
  rationale: Субстантивированное прилагательное в дательном падеже обозначает нуждающихся людей и кратко передаётся русским «бедным».
