    issue: Необязательная заглавная буква в «Благая весть».
    rationale: Сочетание употреблено как нарицательное обозначение возвещаемой вести, а не как официальное название; строчное написание соответствует современному русскому употреблению.
  - severity: medium
    issue: «Будет рассказано» сужает λαληθήσεται.
    rationale: Греческое «будет сказано/будут говорить» шире, чем именно рассказ о событии. «Будет сказано и о том» передаёт его без добавочного оттенка повествовательности.
  - severity: medium
    issue: 'Сноска b: «как о памятнике ей».'
    rationale: «Памятник» в русском обычно обозначает материальный монумент и может исказить смысл μνημόσυνον. Нейтральное «как память о ней» сохраняет мемориальное значение.
