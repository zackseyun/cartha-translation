source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅπου ἐὰν κηρυχθῇ τὸ εὐαγγέλιον τοῦτο ἐν ὅλῳ τῷ κόσμῳ, λαληθήσεται καὶ ὃ ἐποίησεν αὕτη εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/013.yaml
  text: Truly I tell you, wherever this good news is proclaimed in the whole world, what this woman has done will also be spoken of in memory of her.
translation:
  language: ru
  text: 'Истинно говорю вам: где бы ни возвещалась эта благая весть[a] во всём мире, будет сказано и о том, что сделала эта женщина, — в память о ней[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это Евангелие».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будет сказано и о том, что она сделала, как память о ней».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Истинно
  rationale: Передаёт торжественное подтверждение, вводящее слова Иисуса; это естественная и укоренённая формула на литературном русском языке.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямо и естественно передаёт обращённую к слушателям формулу без ненужного усиления.
- source_word: ὅπου ἐὰν
  choice: где бы ни
  rationale: Сохраняет неопределённо-локативное значение греческой конструкции.
- source_word: κηρυχθῇ
  choice: возвещалась
  rationale: Передаёт публичное провозглашение и сохраняет пассивную форму; по-русски звучит шире и естественнее, чем узко церковное «проповедовалась».
- source_word: τὸ εὐαγγέλιον τοῦτο
  choice: эта Благая весть
  rationale: Непосредственно передаёт смысл εὐαγγέλιον доступным современным языком; традиционный вариант «это Евангелие» указан в сноске.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: во всём мире
  rationale: Точно и естественно выражает универсальный охват греческой фразы.
- source_word: λαληθήσεται
  choice: будет рассказано и о
  rationale: В сочетании с обозначением поступка естественный русский требует конструкции «рассказано о»; она передаёт будущую пассивную форму и не сужает смысл до формального возвещения.
- source_word: ὃ ἐποίησεν αὕτη
  choice: о том, что сделала эта женщина
  rationale: Относительное местоимение указывает на поступок, а αὕτη — на женщину из ближайшего контекста; явное «эта женщина» сохраняет указательную силу оригинала.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: в память о ней
  rationale: Естественно передаёт поминально-мемориальное значение выражения, не уточняя сверх текста, является ли речь о рассказе как памятнике или о сохранении памяти.
theological_decisions:
- issue: Передача εὐαγγέλιον
  choice: Благая весть
  alternative: Евангелие
  rationale: Выбор передаёт исходное лексическое значение понятным русским языком, не ослабляя его богословского содержания; традиционный термин сохранён как допустимая альтернатива.
- issue: Связь εἰς μνημόσυνον αὐτῆς с предшествующим высказыванием
  choice: — в память о ней
  alternative: как памятник ей
  rationale: Пунктуационное обособление сохраняет смысловую связь с будущим рассказом о поступке, не разрешая жёстко возможный оттенок цели или результата.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным регистром. Формула «Истинно говорю вам» сохраняет библейское достоинство; остальная фраза избегает архаизмов. Заглавные буквы в «Благая весть» обозначают конкретную возвещаемую весть и помогают воспринимать сочетание как цельный термин.
