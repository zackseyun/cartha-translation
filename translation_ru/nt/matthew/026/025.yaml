  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Ἰούδας ὁ παραδιδοὺς αὐτὸν εἶπεν· Μήτι ἐγώ εἰμι, ῥαββί; λέγει αὐτῷ· Σὺ εἶπας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/025.yaml
  text: Then Judas, the one betraying him, answered and said, “Surely I am not the one, Rabbi?” He said to him, “You have said so.”
translation:
  language: ru
  text: 'Тогда Иуда, который предавал Его, ответил: «Не я ли, Равви?» Иисус сказал ему: «Ты сам сказал».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: который предавал Его
  rationale: Причастие настоящего времени характеризует Иуду как совершающего предательство; конструкция с придаточным определительным естественна в современном русском языке.
- source_word: Μήτι ἐγώ εἰμι
  choice: Не я ли
  rationale: Частица μήτι предполагает отрицательный ответ; русская формула «Не я ли?» сохраняет притворное ожидание ответа «нет» и при этом звучит естественно.
- source_word: ῥαββί
  choice: Равви
  rationale: Сохранено традиционное обращение-транслитерация, соответствующее иудейскому контексту.
- source_word: Σὺ εἶπας
  choice: Ты сам сказал
  rationale: Буквально и идиоматично передаёт краткий, косвенно утвердительный ответ; «сам» подчёркивает местоимение σύ, стоящее в явном виде.
theological_decisions:
- issue: Степень прямоты ответа Иисуса
  choice: Ты сам сказал
  alternative: Да, это ты
  rationale: 'Ответ не превращён в прямое «да»: сохранена характерная для греческого текста косвенная формула и её смысловая напряжённость.'
- issue: Временная характеристика предательства
  choice: который предавал Его
  alternative: который собирался предать Его
  rationale: Настоящее причастие не следует без текстового основания заменять указанием лишь на будущее намерение.
translation_notes:
  register: Современный литературный русский, краткий и достойный повествовательный стиль. Избыточное для русского «ответив, сказал» передано естественным глаголом «спросил» по функции реплики; субъект заключительного ответа назван как Иисус для ясности.
