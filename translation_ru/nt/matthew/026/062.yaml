  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Οὐδὲν ἀποκρίνῃ; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/062.yaml
  text: And the high priest stood up and said to him[b][a], “Do you give no answer? What is it that these men are testifying against you?”
translation:
  language: ru
  text: 'Первосвященник встал и сказал Ему: «Ты ничего не отвечаешь? Что свидетельствуют против Тебя эти люди?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: встал
  rationale: Аористное причастие обозначает физическое действие первосвященника перед его словами; «встал» точно и естественно передаёт это действие.
- source_word: ὁ ἀρχιερεὺς
  choice: первосвященник
  rationale: Устоявшееся русское обозначение единственного носителя высшей священнической должности в данном контексте.
- source_word: εἶπεν αὐτῷ
  choice: сказал Ему
  rationale: Сохранено местоимение оригинала без замены его именем Иисуса.
- source_word: Οὐδὲν ἀποκρίνῃ;
  choice: Ты ничего не отвечаешь?
  rationale: Прямой вопрос естественно передаёт настоящее время и побуждение ответить, не превращая реплику в более свободное «Тебе нечего ответить?».
- source_word: τί
  choice: Что
  rationale: Простое вопросительное слово сохраняет прямую форму греческого вопроса и не добавляет лишней пояснительной конструкции.
- source_word: οὗτοί
  choice: они
  rationale: В контексте указательное местоимение относится к находящимся перед ними свидетелям; русское «они» звучит естественно, тогда как «эти» без существительного здесь стилистически шероховато.
- source_word: σου καταμαρτυροῦσιν
  choice: свидетельствуют против Тебя
  rationale: Передан юридический и враждебный смысл глагола καταμαρτυρέω; настоящее время сохранено.
theological_decisions: []
