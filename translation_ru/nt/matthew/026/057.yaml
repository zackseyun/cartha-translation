  text: Οἱ δὲ κρατήσαντες τὸν Ἰησοῦν ἀπήγαγον πρὸς Καϊάφαν τὸν ἀρχιερέα, ὅπου οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι συνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/057.yaml
  text: Those who had seized Jesus led him away to Caiaphas the high priest[a], where the scribes and the elders had gathered.
translation:
  language: ru
  text: Схватившие Иисуса отвели Его к первосвященнику Каиафе, где уже собрались книжники и старейшины.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «где были собраны книжники и старейшины». Греческую форму можно понять либо как страдательную («были собраны»), либо как обозначение самостоятельного действия («собрались»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ κρατήσαντες
  choice: Схватившие
  rationale: Субстантивированное причастие передаёт «те, кто схватил»; аорист указывает на действие, предшествующее основному. Частица δέ служит мягкой связкой повествования и не требует отдельного слова в естественном русском тексте.
- source_word: τὸν Ἰησοῦν
  choice: Иисуса
  rationale: Прямое и общепринятое воспроизведение имени в винительном падеже.
- source_word: ἀπήγαγον
  choice: отвели
  rationale: Глагол означает «увести/отвести» и в данном контексте описывает перемещение Иисуса под стражей без добавления излишне юридического оттенка.
- source_word: πρὸς Καϊάφαν
  choice: к Каиафе
  rationale: Предлог πρός с винительным обозначает движение к человеку; перевод не добавляет отсутствующего в тексте указания на дом или официальное разбирательство.
- source_word: τὸν ἀρχιερέα
  choice: первосвященнику
  rationale: Стандартное русское наименование должности ἀρχιερεύς в единственном числе применительно к Каиафе.
- source_word: ὅπου
  choice: где
  rationale: Прямой и естественный перевод наречия места.
- source_word: οἱ γραμματεῖς
  choice: книжники
  rationale: Устоявшийся и точный термин для знатоков и толкователей Писания в евангельском контексте.
- source_word: οἱ πρεσβύτεροι
  choice: старейшины
  rationale: Устоявшееся обозначение признанных руководителей и представителей народа в данном контексте.
- source_word: συνήχθησαν
  choice: уже собрались
  rationale: Аорист передаёт состоявшееся к моменту прибытия Иисуса собрание; «уже» естественно проясняет временное соотношение, подразумеваемое контекстом.
