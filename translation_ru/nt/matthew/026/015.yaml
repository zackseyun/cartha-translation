  text: εἶπεν· Τί θέλετέ μοι δοῦναι κἀγὼ ὑμῖν παραδώσω αὐτόν; οἱ δὲ ἔστησαν αὐτῷ τριάκοντα ἀργύρια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/015.yaml
  text: He said[a], “What are you willing to give me, and I will hand him over to you?” And they weighed out for him thirty pieces of silver.
translation:
  language: ru
  text: 'Он сказал: «Что вы готовы дать мне, и я передам Его вам[a]?» Они же отсчитали ему тридцать серебряных монет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предам Его вам». Греческий глагол может означать «передать», «выдать» или, в данном контексте, «предать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλετέ μοι δοῦναι
  choice: Что вы готовы дать мне
  rationale: Вопрос передаёт оттенок желания или готовности в контексте торга и естественно звучит по-русски.
- source_word: κἀγὼ ὑμῖν παραδώσω αὐτόν
  choice: если я предам Его вам
  rationale: Русское «предам» естественно передаёт действие Иуды в данном контексте; сноска сохраняет более широкое значение греческого глагола и менее интерпретирующую альтернативу.
- source_word: οἱ δὲ
  choice: Они же
  rationale: Частица «же» передаёт мягкий повествовательный переход δέ без чрезмерного противопоставления.
- source_word: ἔστησαν αὐτῷ
  choice: отсчитали ему
  rationale: В сочетании с денежной суммой глагол обозначает установление или выдачу оговорённой платы; «отсчитали» конкретно и естественно передаёт расчёт серебром, не утверждая взвешивания, прямо не выраженного в тексте.
- source_word: τριάκοντα ἀργύρια
  choice: тридцать серебряных монет
  rationale: ἀργύρια обозначает серебряные денежные единицы без указания номинала; «серебряные монеты» ясно и современно передаёт смысл, не добавляя конкретного достоинства.
theological_decisions:
- issue: Передача παραδώσω в предложении Иуды
  choice: предам Его вам
  alternative: передам Его вам
  rationale: В контексте тайной сделки Иуды «предам» является естественным русским обозначением поступка, однако παραδίδωμι лексически шире и может означать «передать» или «выдать»; эта неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и повествовательная. Местоимение «Его» применительно к Иисусу написано с прописной буквы согласно распространённой русской библейской традиции.
