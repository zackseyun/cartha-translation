- source_word: ὁμοίως
  choice: Так же было
  rationale: Передаёт повторение описанной в предыдущем стихе ситуации и естественно связывает краткую эллиптическую фразу с контекстом.
- source_word: καὶ ὁ δεύτερος καὶ ὁ τρίτος
  choice: и со вторым, и с третьим
  rationale: Сохраняет последовательность и субстантивное употребление порядковых числительных; слово «брат» не добавлено, поскольку оно лишь подразумевается из контекста.
- source_word: ἕως τῶν ἑπτά
  choice: вплоть до седьмого
  rationale: В контексте последовательности из семи братьев это естественно передаёт распространение той же участи на всю цепочку до последнего, не вводя отсутствующего в греческом тексте слова «всех».
