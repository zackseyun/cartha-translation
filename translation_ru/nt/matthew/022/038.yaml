  text: This is the great and first commandment[a].
translation:
  language: ru
  text: Это великая и первая заповедь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Это главная заповедь». Буквально в греческом тексте употреблены два определения: «великая и первая заповедь».'
    reason: лексическая альтернатива
lexical_decisions:
- source_word: αὕτη
  choice: Это
  rationale: Указательное местоимение отсылает к только что приведённой заповеди; «это» естественно передаёт такую анафорическую связь по-русски.
- source_word: ἐστὶν
  choice: есть (передано нулевой связкой)
  rationale: В современном русском языке связка настоящего времени обычно опускается; смысл простой глагольной связки полностью сохраняется.
- source_word: μεγάλη
  choice: великая
  rationale: Прилагательное обозначает величие и значимость заповеди. «Величайшая» было бы неоправданной заменой положительной степени превосходной.
- source_word: πρώτη
  choice: первая
  rationale: Прямо сохраняет значение первенства по порядку или рангу и не сводит два греческих определения к одному.
- source_word: ἐντολή
  choice: заповедь
  rationale: Обычное и точное соответствие в библейском и иудейском контексте Закона; сохраняет связь с обсуждением заповедей.
theological_decisions:
- issue: Соотношение определений μεγάλη и πρώτη
  choice: 'Оба определения переданы раздельно и сочинённо: «великая и первая заповедь».'
  alternative: «главная заповедь» или «величайшая и первая заповедь»
  rationale: Греческий текст содержит два согласованных определения в положительной степени. Их явная передача сохраняет риторическое напряжение между величием и первенством и не превращает μεγάλη в превосходную степень.
translation_notes:
  register: Современный литературный русский язык с сохранением достойного библейского регистра. Формулировка намеренно близка к структуре греческого текста; нулевая связка естественна для русского настоящего времени.
