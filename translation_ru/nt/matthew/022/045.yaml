  text: εἰ οὖν Δαυὶδ καλεῖ αὐτὸν κύριον, πῶς υἱὸς αὐτοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/045.yaml
  text: If[a], then, David calls him Lord, how is he his son?
translation:
  language: ru
  text: Итак, если Давид называет Его Господом, как же Он может быть его сыном?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с более явным указанием на контекст: «Итак, если Давид называет Мессию Господом, как же Мессия может быть его сыном?»'
    reason: Альтернативная, контекстуально развёрнутая передача подразумеваемого референта местоимения.
lexical_decisions:
- source_word: εἰ οὖν
  choice: итак, если
  rationale: Сохраняет условную силу εἰ и логический вывод οὖν; такой порядок слов естественен для современного русского языка и передаёт ход рассуждения.
- source_word: Δαυὶδ
  choice: Давид
  rationale: Традиционная русская форма библейского имени.
- source_word: καλεῖ
  choice: называет
  rationale: 'Передаёт значение «называет, именует» и сохраняет предикативный смысл: Давид называет Его Господом.'
- source_word: αὐτὸν
  choice: Его
  rationale: Местоимение отсылает к подразумеваемому из контекста Мессии; прописная буква уместна согласно русской библейской издательской традиции, не добавляя имени в основной текст.
- source_word: κύριον
  choice: Господом
  rationale: Сохраняет титул и отзвук Псалма 109:1 (110:1 по иной нумерации); «господином» ослабило бы христологическую и межтекстовую значимость.
- source_word: πῶς
  choice: как же
  rationale: «Как» прямо передаёт вопросительное наречие, а частица «же» естественно подчёркивает возникающее логическое затруднение.
- source_word: υἱὸς αὐτοῦ
  choice: его сыном
  rationale: Сохраняет буквальный образ сыновства и намеренное напряжение между происхождением от Давида и титулом «Господь»; вариант «потомком» был бы более истолковывающим.
- source_word: ἐστιν
  choice: может быть
  rationale: В риторическом вопросе русское «как же Он может быть» естественно выражает логическую несовместимость, подразумеваемую простым греческим ἐστιν, не разрешая её.
theological_decisions:
- issue: Мессианский и христологический смысл того, что Давид называет Его Господом
  choice: В основном тексте сохранены «Господом» и «его сыном» без явного добавления слова «Мессия».
  alternative: «Итак, если Давид называет Мессию Господом, как же Мессия может быть его сыном?»
  rationale: Греческий текст содержит местоимение αὐτόν, чей референт понятен из предшествующего контекста. Основной текст сохраняет исходную форму и богословское напряжение между Давидовым сыновством и превосходящим достоинством, а сноска разъясняет подразумеваемый референт.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Риторическая структура вопроса сохранена; формулировка не снимает намеренного богословского напряжения.
