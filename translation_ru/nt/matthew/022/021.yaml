  text: λέγουσιν ⸀αὐτῷ· Καίσαρος. τότε λέγει αὐτοῖς· Ἀπόδοτε οὖν τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/021.yaml
  text: They said to him[a], “Caesar’s.” Then he said to them, “Therefore render to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: ru
  text: 'Они ответили ему: «Кесаря». Тогда он сказал им: «Итак, отдайте[a] кесарю то, что принадлежит кесарю, и Богу — то, что принадлежит Богу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воздайте»; греческий глагол может означать «отдать обратно», «уплатить» или «отдать должное».'
    reason: Лексическая широта ἀποδίδωμι включает возвращение, уплату и исполнение должного; одно русское слово не передаёт всех оттенков.
lexical_decisions:
- source_word: λέγουσιν
  choice: ответили
  rationale: Греческое настоящее здесь является историческим; прошедшее время естественно для русского повествования. «Ответили» передаёт функцию реплики в данном вопросно-ответном контексте.
- source_word: Καίσαρος
  choice: Кесаря
  rationale: Родительный падеж непосредственно отвечает на подразумеваемый вопрос, чьи изображение и надпись находятся на монете.
- source_word: τότε λέγει
  choice: Тогда он сказал
  rationale: «Тогда» передаёт последовательность обмена репликами; историческое настоящее λέγει естественно передано русским прошедшим временем.
- source_word: Ἀπόδοτε
  choice: отдайте
  rationale: Глагол выражает передачу или возвращение того, что принадлежит другому либо ему причитается. «Отдайте» естественно по-русски и сохраняет эту смысловую широту; альтернативы отмечены в сноске.
- source_word: οὖν
  choice: Итак
  rationale: Слово вводит вывод из ответа собеседников и естественно связывает повеление с предшествующим рассуждением.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: кесарю то, что принадлежит кесарю
  rationale: Описательная конструкция ясно передаёт субстантивированный оборот с родительным падежом и сохраняет принадлежность как ключевую мысль.
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: Богу — то, что принадлежит Богу
  rationale: Формулировка сохраняет синтаксический и риторический параллелизм с первой частью; тире делает русскую фразу ясной без добавления толкования.
theological_decisions:
- issue: Соотношение обязанностей перед кесарем и Богом
  choice: Сохранено параллельное повеление без пояснения границ гражданской и божественной власти.
  alternative: Свести высказывание только к уплате налога либо представить его как безусловное одобрение государственной власти.
  rationale: Греческий текст различает принадлежащее кесарю и принадлежащее Богу, но сам по себе не разворачивает политическую теорию. Перевод сохраняет это различие и напряжение, не разрешая его за читателя.
translation_notes:
  register: Современный литературный русский язык с достойным, но не архаичным звучанием. Местоимение «он» набрано со строчной буквы по общелитературной норме. Повтор «принадлежит» сохраняет риторический параллелизм оригинала; «кесарь» оставлен как исторический титул.
