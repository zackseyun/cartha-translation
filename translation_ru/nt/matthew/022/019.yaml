lexical_decisions:
- source_word: ἐπιδείξατέ
  choice: Покажите Мне
  rationale: Повелительная форма передаёт требование предъявить предмет для осмотра и сохраняет зрительный оттенок глагола.
- source_word: τὸ νόμισμα
  choice: монету
  rationale: В данном контексте νόμισμα означает находящуюся в обращении монету; далее она конкретно названа динарием.
- source_word: τοῦ κήνσου
  choice: которой платят подать
  rationale: Оборот естественно выражает назначение монеты и сохраняет связь с римским имперским налогом; «подать» уместна в историческом контексте и понятна современному читателю.
- source_word: προσήνεγκαν
  choice: принесли
  rationale: Прямо и естественно передаёт повествовательное действие προσφέρω в данном контексте.
- source_word: δηνάριον
  choice: динарий
  rationale: Транслитерация сохраняет название конкретной римской монеты и историческую точность.
