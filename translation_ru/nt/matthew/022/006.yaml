  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἱ δὲ λοιποὶ κρατήσαντες τοὺς δούλους αὐτοῦ ὕβρισαν καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/006.yaml
  text: But the rest[a], seizing his slaves, mistreated them and killed them.
translation:
  language: ru
  text: А остальные, схватив его рабов[a], подвергли их издевательствам и убили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуг».'
    reason: Лексическая альтернатива для греческого δούλους, которое в данном контексте может обозначать как рабов, так и слуг царя.
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: А остальные
  rationale: «Остальные» обозначает оставшихся из ранее упомянутых приглашённых, а «а» передаёт мягкое противопоставление δέ их поведению в предыдущем стихе.
- source_word: κρατήσαντες
  choice: схватив
  rationale: 'Деепричастие естественно передаёт предшествующее сопутствующее действие аористного причастия: они сначала схватили рабов, а затем подвергли их издевательствам и убили.'
- source_word: τοὺς δούλους αὐτοῦ
  choice: его рабов
  rationale: «Рабы» прямо передаёт социальный статус, выраженный словом δοῦλος, тогда как возможное по контексту «слуги» приведено в сноске.
- source_word: ὕβρισαν
  choice: подвергли их издевательствам
  rationale: Глагол обозначает унизительное и жестокое обращение, а не только словесное оскорбление; выбранная формулировка сохраняет эту широту и естественно звучит по-русски.
- source_word: ἀπέκτειναν
  choice: убили
  rationale: Прямой и нейтральный эквивалент, не добавляющий юридического оттенка слова «убили преднамеренно» или стилистической тяжеловесности.
theological_decisions:
- issue: Передача δοῦλος в контексте притчи
  choice: рабы
  alternative: слуги
  rationale: В образном мире притчи речь идёт о принадлежащих царю посланниках; «рабы» сохраняет выраженный греческим словом социальный статус, не внося дополнительного богословского толкования. Более функциональное «слуги» остаётся допустимым контекстуальным вариантом и указано в сноске.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и повествовательно напряжённая. «Подвергли издевательствам» передаёт унизительное жестокое обращение шире, чем одно лишь словесное оскорбление.
