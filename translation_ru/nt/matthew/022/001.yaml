  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Сохраняет обычную повествовательную связь с предшествующим текстом, не добавляя временного оттенка.
- source_word: ἀποκριθεὶς
  choice: обратился
  rationale: Греческое «ответив» здесь служит распространённой повествовательной формулой, хотя непосредственно перед стихом вопрос не задан; русское «обратился» естественно передаёт речевую реакцию в данном контексте.
- source_word: ὁ Ἰησοῦς
  choice: Иисус
  rationale: Обычная русская передача имени; артикль перед личным именем отдельно не выражается.
- source_word: πάλιν
  choice: снова
  rationale: Прямо передаёт повторность речевого действия.
- source_word: εἶπεν
  choice: обратился
  rationale: В сочетании с последующим λέγων передаётся единым естественным русским оборотом, чтобы избежать тяжеловесного «сказал… говоря» при сохранении вводной формулы.
- source_word: ἐν παραβολαῖς
  choice: с притчами
  rationale: Передаёт способ и форму речи; по-русски оборот «обратился… с притчами» звучит естественнее буквального «в притчах».
- source_word: αὐτοῖς
  choice: к ним
  rationale: При русском глаголе «обратился» адресат естественно оформляется конструкцией «к ним».
- source_word: λέγων
  choice: говоря
  rationale: Сохраняет причастную формулу, вводящую последующую прямую речь.
theological_decisions:
- issue: Повествовательное значение ἀποκριθεὶς при отсутствии непосредственно предшествующего вопроса
  choice: В основном тексте передать «обратился», а буквальное «ответив» отметить в сноске
  alternative: «ответив» / «в ответ»
  rationale: Так сохраняется связь с греческой формулой без неестественного для современного русского намёка на явно заданный вопрос; сноска открыто фиксирует буквальную форму и её идиоматический характер.
translation_notes:
  register: Современный литературный русский язык; достоинство повествовательного стиля сохранено. Формулировка остаётся понятной обычному читателю, а сноска отмечает буквальную греческую конструкцию и её неоднозначность.
