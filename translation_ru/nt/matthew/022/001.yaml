  source_fidelity: В основном тексте «обратился» объединяет ἀποκριθείς и εἶπεν и тем самым не передаёт явно присутствующее значение «в ответ/ответив». Оборот «в ответ снова обратился к ним в притчах» сохраняет все существенные компоненты греческой формулы, а двоеточие естественно вводит содержание, которое в греческом оформлено λέγων.
  naturalness: Предлагаемая формулировка естественна для современного литературного русского и уместна в повествовательном библейском регистре. «В притчах» точнее и более идиоматично в данном контексте, чем «с притчами».
  terminology: «Притчи» — установленное и точное соответствие παραβολαί. Имя «Иисус» передано нормативно. «В ответ» передаёт повествовательную функцию ἀποκριθείς, не требуя подразумевать непосредственно заданный вопрос.
