  text: Διδάσκαλε, ποία ἐντολὴ μεγάλη ἐν τῷ νόμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/036.yaml
  text: Teacher[a], which commandment is greatest in the Law?
translation:
  language: ru
  text: Учитель, какая заповедь самая важная в Законе?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Естественное обращение к Иисусу, точно передающее обычное значение διδάσκαλος без лишнего оттенка господства.
- source_word: ποία
  choice: какая
  rationale: Вопросительное определение выделяет одну заповедь из совокупности заповедей Закона; по-русски здесь естественно «какая».
- source_word: ἐντολὴ
  choice: заповедь
  rationale: В контексте Писания и иудейского Закона «заповедь» точнее и привычнее, чем общее «повеление».
- source_word: μεγάλη
  choice: самая важная
  rationale: Хотя в греческом стоит положительная степень «великая», в данном вопросе она имеет контекстуальную силу ранжирования. Русское «какая заповедь великая» неестественно и может исказить смысл; «самая важная» ясно передаёт идиоматическое значение.
- source_word: ἐν τῷ νόμῳ
  choice: в Законе
  rationale: Здесь νόμος обозначает Закон Моисея, поэтому прописная буква помогает обозначить конкретный священный корпус и остаётся понятной современному читателю.
theological_decisions:
- issue: Передача положительной степени μεγάλη в вопросе о ранге заповедей
  choice: самая важная
  alternative: великая / величайшая
  rationale: Форма прилагательного положительная, однако конструкция по смыслу спрашивает о первенстве среди заповедей. «Самая важная» естественно передаёт этот сравнительный смысл, не привнося конфессионального толкования; «величайшая» возможна, но в современной речи звучит более возвышенно и менее непосредственно.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified и общепонятная формулировка. Обращение «Учитель» и написание «Закон» с прописной буквы сохраняют библейский контекст без архаизации.
