review_pass:
  verdict: approve
  source_fidelity: 'Текст точно передаёт структуру и смысл греческого оригинала: «А о» отражает переходное περὶ δέ; «о воскресении мёртвых» соответствует τῆς ἀναστάσεως τῶν νεκρῶν; риторическое «разве вы не читали» адекватно οὐκ ἀνέγνωτε. Формулировка «того, что сказал вам Бог» сохраняет и божественное авторство речи, и её обращённость к слушателям. Хотя τὸ ῥηθέν формально стоит в страдательной конструкции, русская активная перестройка не изменяет смысла. Двоеточие уместно перед продолжающейся в следующем стихе прямой речью.'
  naturalness: Перевод звучит естественно в современном литературном русском. Порядок слов и риторический вопрос ясны; «воскресение мёртвых» — устойчивая и понятная формулировка. Конечное двоеточие корректно сохраняет синтаксическую незавершённость цитаты.
  terminology: Термин «воскресение» точно передаёт ἀνάστασις в данном контексте. Субстантивированное «мёртвых» нормативно и соответствует традиционному, но не архаичному библейскому употреблению. «Бог» верно передаёт τοῦ θεοῦ без неоправданных богословских добавлений.
