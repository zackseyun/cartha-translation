  text: περὶ δὲ τῆς ἀναστάσεως τῶν νεκρῶν οὐκ ἀνέγνωτε τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/031.yaml
  text: Concerning the resurrection of the dead[a], have you not read what was spoken to you by God, saying,
translation:
  language: ru
  text: 'А о воскресении мёртвых разве вы не читали того, что сказал вам Бог:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ δὲ
  choice: А о
  rationale: Предлог περί с родительным вводит тему («о»), а δέ обозначает переход к следующему пункту; «А о» естественно передаёт этот переход, не превращая его в резкое противопоставление.
- source_word: τῆς ἀναστάσεως τῶν νεκρῶν
  choice: о воскресении мёртвых
  rationale: Сочетание прямо обозначает воскресение умерших как обсуждаемую тему; «воскресение мёртвых» — ясная и укоренившаяся русская формулировка.
- source_word: οὐκ ἀνέγνωτε
  choice: разве вы не читали
  rationale: Риторический вопрос подразумевает, что собеседники должны были прочитать и знать данный текст; русское «разве вы не читали» естественно передаёт эту силу аориста в контексте.
- source_word: τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ
  choice: того, что сказал вам Бог
  rationale: Активная русская конструкция ясно сохраняет как божественного говорящего, так и адресованность слов слушателям, избегая тяжеловесного «сказанного вам Богом».
- source_word: λέγοντος
  choice: ':'
  rationale: Причастие вводит прямую речь следующего стиха. В современном русском эту функцию естественно и полно выполняет двоеточие; добавление «говоря» было бы неидиоматичным.
theological_decisions:
- issue: Божественное авторство и обращённость Писания к слушателям
  choice: «что сказал вам Бог»
  alternative: «что было сказано вам Богом»
  rationale: 'Формулировка сохраняет утверждение греческого текста: Бог является говорящим, а древние слова Писания обращены и к нынешним слушателям Иисуса. Активный залог не добавляет отдельной теории богодухновенности и не ослабляет божественную субъектность.'
translation_notes:
  register: Современный литературный русский язык; тон ясный и достойный. «Мёртвых» употреблено в субстантивированном значении. Конечное двоеточие сохраняет незавершённость фразы и вводит цитату в Мф 22:32.
