id: MAT.22.10
reference: Matthew 22:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες οἱ δοῦλοι ἐκεῖνοι εἰς τὰς ὁδοὺς συνήγαγον πάντας ⸀οὓς εὗρον, πονηρούς τε καὶ ἀγαθούς· καὶ ἐπλήσθη ὁ ⸀γάμος ἀνακειμένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/010.yaml
  text: And those slaves went out into the roads and gathered everyone they found[a], both evil and good[c][b]; and the wedding hall was filled with guests reclining at the table.
translation:
  language: ru
  text: И те рабы вышли на дороги и собрали всех, кого нашли, — и злых, и добрых[a]. И зал свадебного пира[b] наполнился гостями, возлежавшими за столом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и плохих, и хороших».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «свадьба»; здесь, вероятно, имеется в виду свадебный пир или зал, где он проходил, поскольку сказано, что он наполнился пирующими.'
    reason: lexical_alternative
  - marker: c
    text: Во время торжественной трапезы гости обычно не сидели, а возлежали за столом.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλοι
  choice: рабы
  rationale: Прямо передаёт зависимое положение царских домочадцев и не смягчает социальный смысл греческого слова до «слуг».
- source_word: ὁδοὺς
  choice: дороги
  rationale: Обычное и широкое соответствие для общественных путей; контекст не требует сужения до городских улиц.
- source_word: συνήγαγον πάντας οὓς εὗρον
  choice: собрали всех, кого нашли
  rationale: Естественно по-русски передаёт действие и всеохватность выражения.
- source_word: πονηρούς τε καὶ ἀγαθούς
  choice: и злых, и добрых
  rationale: Сохраняет выраженное нравственное противопоставление и не ослабляет πονηρούς до нейтрального «плохих».
- source_word: γάμος
  choice: зал свадебного пира
  rationale: В данном обороте слово обозначает свадьбу или свадебное празднество метонимически как пространство, которое могут наполнить пирующие; «зал свадебного пира» делает образ понятным, а буквальная форма отмечена в сноске.
- source_word: ἐπλήσθη
  choice: наполнился
  rationale: Естественно передаёт пассивную идею достижения полноты в русском синтаксисе.
- source_word: ἀνακειμένων
  choice: гостями, возлежавшими за столом
  rationale: Передаёт принятую в древности позу участников торжественной трапезы; слово «гостями» ясно выражает подразумеваемых участников пира.
theological_decisions:
- issue: Нравственная характеристика собранных
  choice: и злых, и добрых
  alternative: и плохих, и хороших
  rationale: Выражение сохраняет сильный нравственный контраст греческого текста и всеохватность приглашения, не предрешая дальнейшего развития притчи.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. «Рабы» сохраняет историческую реальность исходного слова; конструкция «и злых, и добрых» удерживает нравственную остроту текста. Добавленные слова «зал» и «гостями» эксплицируют метонимию и подразумеваемых участников, не изменяя сцены.
