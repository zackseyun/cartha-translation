  text: For many are called[b][a], but few are chosen.
translation:
  language: ru
  text: Ибо много званых[a], но мало избранных[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приглашённых»; в контексте брачного пира слово может обозначать приглашённых на пир.'
