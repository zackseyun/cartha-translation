    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: много
  rationale: Субстантивированное прилагательное обозначает множество людей. Русское «много» естественно сочетается с родительным множественного числа и сохраняет краткий контраст с «мало».
- source_word: γάρ
  choice: ибо
  rationale: Союз вводит объяснение к предшествующему итогу притчи. «Ибо» точно передаёт пояснительную связь и соответствует краткому, торжественному характеру изречения.
- source_word: εἰσιν
  choice: выражено русской безглагольной конструкцией
  rationale: В настоящем времени русская конструкция «много званых» естественно опускает связку «есть», не изменяя смысла греческого εἰσιν.
- source_word: κλητοὶ
  choice: званых
  rationale: «Званые» непосредственно соответствует значению призванных или приглашённых и особенно уместно в контексте брачного пира. При этом слово сохраняет более широкий оттенок зова; вариант «приглашённых» указан в сноске.
- source_word: ὀλίγοι
  choice: мало
  rationale: «Мало» образует естественную и лаконичную антитезу слову «много», передавая смысл ὀλίγοι.
- source_word: δὲ
  choice: но
  rationale: Здесь δέ противопоставляет две части изречения; русский союз «но» ясно передаёт эту функцию.
- source_word: ἐκλεκτοί
  choice: избранных
  rationale: «Избранные» — точное и узнаваемое соответствие греческому прилагательному со значением «выбранные». Оно сохраняет богословскую напряжённость текста, не уточняя, кем и каким образом совершается избрание; более нейтральный лексический вариант дан в сноске.
theological_decisions:
- issue: Передача ἐκλεκτοί в высказывании, связанном с учением об избрании
  choice: избранных
  alternative: выбранных
  rationale: Греческое слово допускает оба соответствия. «Избранных» сохраняет традиционную и богословски значимую формулировку, но само по себе не определяет механизм или основание избрания. Сноска показывает прозрачное лексическое значение и не отдаёт предпочтения какой-либо конфессиональной системе.
- issue: Передача κλητοί в контексте притчи о брачном пире
  choice: званых
  alternative: приглашённых; призванных
  rationale: «Званых» естественно связано с приглашением на пир и одновременно сохраняет образ зова. Сноска отмечает явный контекстуальный вариант «приглашённых», не сводя смысл высказывания исключительно к бытовому приглашению.
translation_notes:
  register: Краткая, афористичная конструкция сохраняет параллелизм и противопоставление оригинала. «Ибо» придаёт фразе dignified библейское звучание, оставаясь понятным современному читателю; «званых» естественно поддерживает образ пира.
