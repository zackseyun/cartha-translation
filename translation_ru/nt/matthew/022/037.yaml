reference: Matthew 22:37
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἔφη αὐτῷ· Ἀγαπήσεις κύριον τὸν θεόν σου ἐν ὅλῃ ⸀τῇ καρδίᾳ σου καὶ ἐν ὅλῃ ⸁τῇ ψυχῇ σου καὶ ἐν ὅλῃ τῇ διανοίᾳ σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/037.yaml
  text: And he said to him[c][b][a], “You shall love the Lord your God with all your heart and with all your soul and with all your mind.”
translation:
  language: ru
  text: 'Он же сказал ему: «Люби Господа, Бога твоего, всем сердцем твоим, и всей душой твоей,[a] и всем разумом твоим.[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. ψυχή может также означать «жизнь» или «самого человека»; здесь «душа» сохраняет формулировку и всеохватный смысл заповеди.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пониманием».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: же
  rationale: Частица мягко продолжает повествование и здесь естественно передаётся русским постпозитивным «же», без усиления противопоставления.
- source_word: ἔφη
  choice: сказал
  rationale: Прямое и нейтральное соответствие глаголу φημί; не добавляет значения ответа, которого сам глагол явно не выражает.
- source_word: Ἀγαπήσεις
  choice: Люби
  rationale: Форма будущего времени в цитируемой заповеди имеет повелительную силу. Русский императив ясно и естественно передаёт эту функцию; буквальное «будешь любить» в современном русском может восприниматься как простое предсказание.
- source_word: κύριον τὸν θεόν σου
  choice: Господа, Бога твоего
  rationale: Сохраняет заветное наименование и приложение исходной фразы; порядок «Бога твоего» поддерживает достоинство и узнаваемость цитаты.
- source_word: ἐν ὅλῃ τῇ καρδίᾳ σου
  choice: всем сердцем твоим
  rationale: Русский творительный падеж идиоматично выражает полноту участия и соответствует функции ἐν в данной конструкции.
- source_word: ψυχῇ
  choice: душой
  rationale: «Душа» сохраняет различие элементов триады и традиционную формулировку, хотя ψυχή может обозначать также жизнь или самого человека.
- source_word: διανοίᾳ
  choice: разумом
  rationale: Передаёт мыслительную способность и понимание; в данном торжественном контексте естественнее и точнее, чем более широкое «ум».
theological_decisions:
- issue: Передача ветхозаветной заповеди в речи Иисуса
  choice: Сохранить трёхчастную формулу «сердцем… душой… разумом»
  alternative: Объединить эти понятия в обобщённое выражение о любви всем существом
  rationale: Греческий текст явно различает καρδία, ψυχή и διάνοια. Сохранение этой структуры не навязывает позднейшую антропологическую схему и не устраняет смысловое напряжение между взаимосвязанными понятиями.
- issue: Повелительное значение Ἀγαπήσεις
  choice: Передать императивом «Люби»
  alternative: «Будешь любить»
  rationale: Будущее изъявительное в цитате функционирует как заповедь. Императив передаёт эту силу без двусмысленности русского будущего времени.
translation_notes:
  register: Современный литературный русский с умеренно торжественным, библейски узнаваемым строем. Архаическое «возлюби» заменено ясным современным «люби»; местоимения после существительных сохраняют достоинство цитаты, оставаясь понятными.
