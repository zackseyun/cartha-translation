  text: 'И вторая подобна ей: «Люби ближнего своего, как самого себя».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δευτέρα
  choice: вторая
  rationale: Субстантивированное порядковое прилагательное без артикля в контексте обозначает вторую заповедь. По-русски определённая форма «вторая» естественна и не требует неопределённого артикля.
- source_word: δὲ
  choice: А
  rationale: Здесь δέ мягко продолжает и сопоставляет вторую заповедь с первой, не выражая сильного противопоставления.
- source_word: ὁμοία αὐτῇ
  choice: подобна ей
  rationale: Точно передаёт сравнение с первой заповедью и сохраняет возвышенный, но понятный регистр.
- source_word: Ἀγαπήσεις
  choice: Люби
  rationale: Будущее изъявительное в цитате из Лев 19:18 имеет повелительную силу. Русский императив естественно передаёт заповедь, не создавая двусмысленности обычного будущего «будешь любить».
- source_word: τὸν πλησίον σου
  choice: ближнего твоего
  rationale: Устойчиво и точно передаёт значение «твой ближний»; порядок слов сохраняет узнаваемый библейский регистр без архаизации грамматики.
- source_word: ὡς σεαυτόν
  choice: как самого себя
  rationale: Передаёт норму сравнения и ясно подчёркивает возвратное отношение местоимения к адресату.
theological_decisions:
- issue: Отношение второй заповеди к первой
  choice: А вторая подобна ей
  alternative: И вторая подобна ей / Есть и вторая, подобная ей
  rationale: Формулировка сохраняет мысль о сходстве второй заповеди с первой, не сливая их и не добавляя объяснения о точном характере их равенства.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Императив «Люби» выбран вместо формально близкого, но по-русски двусмысленного «будешь любить». Кавычки обозначают цитату заповеди.
