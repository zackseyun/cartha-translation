  text: And one of them, a lawyer, asked him a question, testing him.
translation:
  language: ru
  text: 'И один из них, знаток Закона[a], спросил Его, чтобы испытать Его:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «законоучитель». Греческое слово означает специалиста по иудейскому Закону.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой повествовательный союз связывает стих с предыдущим контекстом, не добавляя более определённого временного оттенка.
- source_word: ἐπηρώτησεν
  choice: спросил
  rationale: Естественно передаёт значение «спросить, задать вопрос»; дополнение «вопрос» по-русски избыточно, поскольку уже заключено в глаголе.
- source_word: εἷς ἐξ αὐτῶν
  choice: один из них
  rationale: Естественно и точно передаёт партитивное выражение и принадлежность говорящего к ранее упомянутой группе.
- source_word: νομικὸς
  choice: законоучитель
  rationale: В данном иудейском контексте речь идёт о знатоке и толкователе Моисеева закона, а не о современном юристе; примечание сохраняет прозрачность термина.
- source_word: πειράζων
  choice: испытывая Его
  rationale: Причастие передаёт сопутствующее действие и намерение проверить Иисуса; «искушая» могло бы неоправданно сузить смысл до склонения ко греху.
- source_word: αὐτόν
  choice: Его
  rationale: Местоимение относится к Иисусу; прописная буква соответствует принятому русскому библейскому регистру.
theological_decisions:
- issue: Смысл πειράζων по отношению к Иисусу
  choice: испытывая Его
  alternative: искушая Его
  rationale: Греческое слово допускает значения испытания, проверки и искушения. Контекст указывает на недоброжелательную проверку; выбранный вариант сохраняет этот оттенок, не утверждая более узкого смысла склонения ко злу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Законоучитель» точнее контекстуально, чем потенциально вводящее в заблуждение «юрист». Двоеточие в конце уместно, поскольку следующий стих содержит заданный вопрос.
