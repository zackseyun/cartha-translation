  text: τότε λέγει τοῖς δούλοις αὐτοῦ· Ὁ μὲν γάμος ἕτοιμός ἐστιν, οἱ δὲ κεκλημένοι οὐκ ἦσαν ἄξιοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/008.yaml
  text: Then he says to his servants[a], ‘The wedding feast is ready, but those who were invited were not worthy.’
translation:
  language: ru
  text: 'Тогда он говорит своим слугам: «Свадебный пир готов, но приглашённые[a] не были достойны».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «позванные». В контексте пира имеются в виду приглашённые на свадьбу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественно передаёт временную последовательность повествования.
- source_word: λέγει
  choice: говорит
  rationale: Сохраняет историческое настоящее греческого текста и его повествовательную живость.
- source_word: δούλοις
  choice: слугам
  rationale: В контексте притчи речь идёт о служителях царя; «слугам» звучит естественно и не выдвигает на первый план правовой статус рабов, несущественный для данного стиха.
- source_word: ὁ μὲν γάμος
  choice: свадебный пир
  rationale: В контексте приготовленной трапезы γάμος обозначает свадебное торжество или пир; частица μέν передана общей конструкцией противопоставления с «но».
- source_word: ἕτοιμός ἐστιν
  choice: готов
  rationale: Прямо и естественно передаёт именное сказуемое «готов».
- source_word: οἱ δὲ κεκλημένοι
  choice: приглашённые
  rationale: В контексте свадебного пира перфектное страдательное причастие от καλέω обозначает тех, кого пригласили; буквальная связь со значением «позвать» отмечена в сноске.
- source_word: οὐκ ἦσαν ἄξιοι
  choice: оказались недостойны
  rationale: Сохраняет оценочное значение ἄξιοι, а «оказались» естественно указывает на выявившуюся по ходу рассказа непригодность приглашённых, не уточняя её основание.
theological_decisions:
- issue: Возможный богословский оттенок κεκλημένοι («призванные»)
  choice: приглашённые
  alternative: позванные; призванные
  rationale: Непосредственный контекст ясно говорит о гостях, приглашённых на свадебный пир. Вариант «призванные» мог бы сильнее, чем требует стих, вызвать ассоциации с богословским понятием призвания; при этом более буквальная передача сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; повествовательное настоящее сохранено. Формулировка dignified и понятна широкому читателю, без конфессионально окрашенной терминологии.
