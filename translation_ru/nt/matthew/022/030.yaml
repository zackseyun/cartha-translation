source:
  edition: SBLGNT
  text: ἐν γὰρ τῇ ἀναστάσει οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ ὡς ἄγγελοι ⸀θεοῦ ἐν ⸀τῷ οὐρανῷ εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/030.yaml
  text: For in the resurrection they neither marry nor are given in marriage[a], but are like the angels of God in heaven.
translation:
  language: ru
  text: Ведь в воскресении[a] не женятся и не выходят замуж, но подобны ангелам Божьим на небесах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при воскресении».'
    reason: 'Лексико-синтаксическая альтернатива для ἐν τῇ ἀναστάσει: выражение может указывать на время воскресения либо на состояние воскресшей жизни.'
lexical_decisions:
- source_word: ἐν ... τῇ ἀναστάσει
  choice: при воскресении
  rationale: Предлог ἐν допускает как временное, так и обстоятельственное понимание. В современном русском «при воскресении» естественно вводит описание жизни воскресших; вариант «в воскресении» сохранён в сноске как более буквальный и способный обозначать состояние воскресшей жизни.
- source_word: γαμοῦσιν
  choice: женятся
  rationale: В данном парном выражении активный глагол обозначает вступление в брак со стороны мужчины; «женятся» естественно передаёт это в русском языке.
- source_word: γαμίζονται
  choice: выходят замуж
  rationale: Форма противопоставлена γαμοῦσιν и в брачном контексте обозначает вступление в брак со стороны женщины или выдачу замуж. Русское «выходят замуж» сохраняет различие между двумя греческими глаголами без неестественного пассива «их выдают замуж».
- source_word: ὡς
  choice: как
  rationale: 'Союз вводит сравнение, а не тождество: воскресшие уподобляются ангелам, но не называются ангелами.'
- source_word: ἄγγελοι θεοῦ
  choice: ангелы Божьи
  rationale: Передаёт присутствующий в тексте родительный θεοῦ естественным и достойным современным русским выражением.
- source_word: ἐν τῷ οὐρανῷ
  choice: на небесах
  rationale: В контексте речь идёт о небесной сфере пребывания ангелов, а не о видимом небе; множественное «на небесах» идиоматично в русском библейском регистре.
- source_word: γὰρ
  choice: ведь
  rationale: «Ведь» естественно выражает пояснительно-причинную связь с предшествующим утверждением и не утяжеляет русскую фразу.
- source_word: εἰσιν
  choice: пребывают
  rationale: Глагол буквально означает «есть/являются». «Пребывают» позволяет естественно завершить русское предложение и относит сравнение к состоянию воскресших, не утверждая их превращения в ангелов.
theological_decisions:
- issue: Характер уподобления ангелам
  choice: Воскресшие подобны ангелам в непосредственно названном контексте отсутствия брака; тождество с ангелами не утверждается.
  alternative: Понимать сравнение как указание на более общее ангельское состояние или превращение людей в ангелов.
  rationale: ὡς обозначает сравнение, а ближайший контекст задаёт его предмет — отсутствие заключения браков при воскресении. Перевод сохраняет сравнение, не расширяя его догматически.
- issue: Временное событие или состояние воскресшей жизни
  choice: Основной текст использует естественное русское «при воскресении», а сноска сохраняет возможное «в воскресении».
  alternative: Передать только как «в состоянии воскресения» или только как момент события.
  rationale: ἐν τῇ ἀναστάσει допускает временной и сферический оттенки; контекст описывает существование воскресших, поэтому неоднозначность не следует полностью устранять.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Парное «не женятся и не выходят замуж» ясно и естественно сохраняет различие греческих форм. «Ангелы Божьи» и «на небесах» поддерживают достоинство звучания без архаизации.
