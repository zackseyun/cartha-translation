  text: πάλιν ἀπέστειλεν ἄλλους δούλους λέγων· Εἴπατε τοῖς κεκλημένοις· Ἰδοὺ τὸ ἄριστόν μου ⸀ἡτοίμακα, οἱ ταῦροί μου καὶ τὰ σιτιστὰ τεθυμένα, καὶ πάντα ἕτοιμα· δεῦτε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/004.yaml
  text: Again he sent other slaves[a], saying, ‘Tell those who have been invited, “Look, I have prepared my dinner; my oxen and my fattened cattle have been slaughtered, and everything is ready[c][b]. Come to the wedding feast.”’
translation:
  language: ru
  text: 'Он снова послал других рабов[a], сказав: «Скажите приглашённым: „Вот, я приготовил обед: мои быки и откормленные животные уже заколоты, и всё готово. Приходите на свадебный пир[b]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуг». Греческое слово δοῦλος в зависимости от контекста может обозначать раба или слугу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на свадьбу», «на свадебные торжества». Греческое множественное число может обозначать всё свадебное празднование.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἀπέστειλεν
  choice: Он снова послал
  rationale: Естественно передаёт повторность действия и повествовательный аорист.
- source_word: ἄλλους δούλους
  choice: других рабов
  rationale: В царском хозяйстве притчи δοῦλοι обозначает зависимых людей, находящихся под властью хозяина; «рабы» точнее сохраняет социальную реальность, чем более широкое «слуги».
- source_word: λέγων
  choice: и велел
  rationale: В русском языке причастную конструкцию естественно передать личной формой; содержание далее имеет характер поручения.
- source_word: τοῖς κεκλημένοις
  choice: приглашённым
  rationale: Перфектное пассивное причастие указывает на людей, которым приглашение уже было дано и остаётся в силе.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Современный и выразительный русский указательный маркер, привлекающий внимание без архаизации.
- source_word: τὸ ἄριστόν μου ἡτοίμακα
  choice: я приготовил обед
  rationale: ἄριστον означает приготовленную трапезу, нередко дневную; «обед» сохраняет отличие от последующего упоминания свадебного торжества. Результативность перфекта ясна из контекста и слов «всё готово».
- source_word: οἱ ταῦροί μου καὶ τὰ σιτιστὰ
  choice: мои быки и откормленный скот
  rationale: «Быки» прямо передаёт ταῦροι, а собирательное «откормленный скот» не сужает субстантивированное σιτιστά до телят, не названных в греческом тексте.
- source_word: τεθυμένα
  choice: уже заколоты
  rationale: В контексте приготовления еды речь идёт о забое животных, а не о культовом жертвоприношении; «уже» подчёркивает наличный результат перфекта.
- source_word: δεῦτε εἰς τοὺς γάμους
  choice: Приходите на свадебный пир
  rationale: Императив передан прямым приглашением; множественное τὰ γάμοι может обозначать свадебные празднества или пир в целом.
theological_decisions:
- issue: Передача δοῦλος в притче о царском доме
  choice: рабы
  alternative: слуги
  rationale: «Рабы» сохраняет выраженную греческим словом зависимость от хозяина и не превращает персонажей в наёмных работников; сноска отмечает допустимый контекстуальный вариант.
- issue: Объём значения τοὺς γάμους
  choice: свадебный пир
  alternative: свадьба / свадебные торжества
  rationale: В контексте приготовленной трапезы «свадебный пир» звучит естественно, однако греческое множественное число может охватывать свадебное празднование в целом, что сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис прямой речи сделан естественным для русского повествования; архаизмы устранены. Лексическая и контекстуальная неоднозначность δοῦλος и τοὺς γάμους сохранена в сносках.
