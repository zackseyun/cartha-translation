source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἐδύνατο ⸂ἀποκριθῆναι αὐτῷ⸃ λόγον, οὐδὲ ἐτόλμησέν τις ἀπ’ ἐκείνης τῆς ἡμέρας ἐπερωτῆσαι αὐτὸν οὐκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/046.yaml
  text: And no one was able to answer him a word[a], nor did anyone dare from that day on to question him any longer.
translation:
  language: ru
  text: И никто не мог ответить Ему ни слова, и с того дня никто больше не осмеливался задавать Ему вопросы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδεὶς
  choice: никто
  rationale: Отрицательное местоимение обозначает полное отсутствие человека, способного ответить; «никто» — точное и естественное соответствие.
- source_word: ἐδύνατο
  choice: не мог
  rationale: Имперфект δύναμαι выражает неспособность ответить в описываемой ситуации; русское «не мог» естественно передаёт и значение, и прошедшее время.
- source_word: ἀποκριθῆναι αὐτῷ λόγον
  choice: ответить Ему ни слова
  rationale: Русская отрицательная идиома «не ответить ни слова» сохраняет явно выраженное λόγον и передаёт смысл невозможности дать даже краткий ответ без неестественного буквализма.
- source_word: οὐδὲ
  choice: ;
  rationale: Связь второго отрицательного сообщения с первым передана бессоюзным присоединением через точку с запятой; в русском это ясно и не создаёт тяжеловесного повторения «и никто» после уже начального «и никто».
- source_word: ἐτόλμησέν τις
  choice: никто уже не осмеливался
  rationale: В сочетании с отрицанием конструкция означает, что никто не решался сделать это; несовершенный вид по-русски естественно передаёт сохранявшееся с того дня положение.
- source_word: ἀπ’ ἐκείνης τῆς ἡμέρας
  choice: с того дня
  rationale: Фраза обозначает исходную временную точку для последующего положения; «с того дня» точно и идиоматично.
- source_word: ἐπερωτῆσαι αὐτὸν
  choice: задавать Ему вопросы
  rationale: В контексте речь идёт о дальнейшем обращении к Иисусу с вопросами, а не обязательно о формальном допросе; выбранная формулировка естественна и сохраняет контекст полемического расспрашивания.
- source_word: οὐκέτι
  choice: уже не
  rationale: Сочетание «уже не» передаёт прекращение дальнейших попыток с указанного момента.
theological_decisions:
- issue: Повествовательный смысл молчания оппонентов после ответа Иисуса
  choice: Исторически констатировать их неспособность ответить и отсутствие дальнейшей решимости задавать вопросы
  alternative: Прямо добавить в перевод указание на превосходство мудрости или власти Иисуса
  rationale: Контекст подразумевает победу Иисуса в споре, однако сам стих сообщает лишь, что никто не смог ответить и больше не осмеливался спрашивать; перевод не добавляет богословского вывода к прямому утверждению текста.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Ни слова» сохраняет греческую идиому естественным для русского способом; точка с запятой подчёркивает тесную связь двух итоговых утверждений.
