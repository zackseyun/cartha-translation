  yaml_path: translation/nt/matthew/022/020.yaml
  text: And he said to them[a], “Whose image is this, and whose inscription?”
translation:
  language: ru
  text: 'И он спросил их: «Чьё это изображение и чья надпись?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: спросил
  rationale: Греческий исторический презенс буквально означает «говорит», однако в современном русском повествовании естественнее прошедшее время. По содержанию реплика является вопросом, поэтому «спросил» точно передаёт речевое действие.
- source_word: αὐτοῖς
  choice: их
  rationale: Дательный падеж множественного числа обозначает адресатов речи; при глаголе «спросил» естественная русская конструкция требует винительного «их».
- source_word: Τίνος
  choice: чьё / чья
  rationale: Родительный вопросительного местоимения выражает принадлежность или связь. Согласованные формы «чьё» и «чья» естественно передают вопрос применительно к двум существительным разного рода.
- source_word: εἰκών
  choice: изображение
  rationale: В данном контексте речь идёт об изображении правителя на монете. «Изображение» точно, понятно и сохраняет обычное библейское соответствие εἰκών.
- source_word: αὕτη
  choice: это
  rationale: Указательное местоимение относится к εἰκών; форма «это» согласуется с русским существительным среднего рода «изображение».
- source_word: ἐπιγραφή
  choice: надпись
  rationale: Слово обозначает письменный текст на монете; «надпись» — точный и естественный современный русский эквивалент.
- source_word: καὶ
  choice: и
  rationale: 'Союз соединяет два однородных предмета вопроса: изображение и надпись.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная повествовательная формулировка. Повтор вопросительного местоимения соответствует нормам русского согласования и недвусмысленно относит вопрос о принадлежности и к изображению, и к надписи.
