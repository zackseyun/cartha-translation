  text: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς ὅλος ὁ νόμος ⸂κρέμαται καὶ οἱ προφῆται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/040.yaml
  text: On these two commandments hang the whole Law and the Prophets[a][b].
translation:
  language: ru
  text: На этих двух заповедях держатся весь Закон и Пророки.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть всё свидетельство Писания, обозначенное словами «Закон и Пророки», опирается на эти две заповеди.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς
  choice: На этих двух заповедях
  rationale: Предлог ἐν буквально может означать «в», однако в сочетании с κρέμαται русский оборот «держаться на» естественно передаёт образ опоры и зависимости.
- source_word: ὅλος ὁ νόμος
  choice: весь Закон
  rationale: ὅλος подчёркивает полноту; «весь Закон» естественно передаёт это значение. Прописная буква указывает на Тору как часть Писания, а не на закон вообще.
- source_word: κρέμαται
  choice: держатся
  rationale: Выбор сохраняет метафору κρέμαται («висят», «держатся») и одновременно звучит естественно по-русски. Множественное число согласуется с составным подлежащим «Закон и Пророки».
- source_word: καὶ οἱ προφῆται
  choice: и Пророки
  rationale: Фраза входит в устойчивое библейское обозначение «Закон и Пророки»; прописная буква помогает обозначить раздел Писания, не сводя выражение только к отдельным пророкам.
theological_decisions:
- issue: Значение формулы «Закон и Пророки»
  choice: Сохранено традиционное обозначение совокупного свидетельства Писания, которое держится на двух заповедях о любви
  alternative: Понимать выражение уже — только как нравственное учение законодательных и пророческих текстов
  rationale: У Матфея «Закон и Пророки» — устойчивая формула с широким каноническим смыслом. Перевод не заменяет её поясняющим словом «Писание» и не устраняет образ зависимости.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная формулировка. Оборот «держатся на» сохраняет исходную метафору и избегает неестественного буквального «висят в».
