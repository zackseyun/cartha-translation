revisions:
- from: 'И посылают к Нему своих учеников вместе с иродианами и говорят: «Учитель, мы знаем, что Ты правдив и истинно учишь пути Божьему и что Тебе нет дела до положения человека, ведь Ты не смотришь на лица людей[a].»'
  to: 'И посылают к Нему своих учеников вместе с иродианами и говорят: «Учитель, мы знаем, что Ты правдив, истинно учишь Божьему пути и ни с кем не считаешься, ведь Ты не смотришь на лица людей[a].»'
  rationale: Исправленное «ни с кем не считаешься» передаёт контекстуальный смысл греческого оборота без добавления конкретного социального критерия и без внушения, что Иисус безразличен к людям. Порядок слов в выражении о Божьем пути сделан более естественным для современного русского. Образная идиома сохранена в тексте и пояснена в сноске.
