reference: Matthew 22:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἀποστέλλουσιν αὐτῷ τοὺς μαθητὰς αὐτῶν μετὰ τῶν Ἡρῳδιανῶν ⸀λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ τὴν ὁδὸν τοῦ θεοῦ ἐν ἀληθείᾳ διδάσκεις, καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/016.yaml
  text: And they send to him their disciples along with the Herodians[a], saying, “Teacher, we know that you are true and teach the way of God in truth, and you do not care about anyone[b], for you do not look at the face of men.”
translation:
  language: ru
  text: 'И посылают к Нему своих учеников вместе с иродианами и говорят: «Учитель, мы знаем, что Ты правдив, истинно учишь Божьему пути и ни с кем не считаешься, ведь Ты не смотришь на лица людей[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть Ты не проявляешь пристрастия к людям и не судишь о них по внешности или положению.
    reason: Пояснение греческой идиомы «смотреть на лицо», обозначающей беспристрастное отношение.
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: посылают
  rationale: Сохранено историческое настоящее греческого повествования; в современном русском оно уместно и передаёт живость сцены.
- source_word: τοὺς μαθητὰς αὐτῶν
  choice: своих учеников
  rationale: «Ученики» — естественный и устойчивый евангельский эквивалент; возвратное «своих» ясно соотносит их с отправителями.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: вместе с иродианами
  rationale: Передаёт совместное участие группы, известной как приверженцы Ирода, без добавления неявного политического толкования.
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Прямое и современное обращение, соответствующее обычному значению слова.
- source_word: ἀληθὴς εἶ
  choice: Ты правдив
  rationale: В данном высказывании слово характеризует искренность и достоверность Иисуса; «правдив» по-русски естественнее, чем буквальное «истинен» о человеке.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: пути Божьему
  rationale: Сохраняет образ пути как Божьего образа жизни и воли, не сужая его до одного учения.
- source_word: ἐν ἀληθείᾳ
  choice: истинно
  rationale: 'Наречие естественно передаёт греческую предложную конструкцию и её смысл: учить в соответствии с истиной.'
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: Тебе нет дела до положения человека
  rationale: Контекст и следующая причинная фраза показывают не бессердечное безразличие к людям, а независимость от их общественного положения; перевод делает эту идиоматическую связь ясной.
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: ведь Ты не смотришь на лица людей
  rationale: Сохранён образный греческий оборот, а его смысл — беспристрастность — указан в сноске.
- source_word: ἀνθρώπων
  choice: людей
  rationale: Здесь множественное ἀνθρώπων обозначает людей вообще, а не исключительно мужчин; русский эквивалент передаёт референт точно и естественно.
theological_decisions:
- issue: Идиома о беспристрастности
  choice: Сохранить в основной строке образ «не смотришь на лица людей», пояснив смысл в сноске.
  alternative: «Ты нелицеприятен» или «Ты не судишь по внешности».
  rationale: Буквальный образ сохраняет текстуру оригинала и связь с формулировкой о положении человека, тогда как сноска предотвращает понимание фразы только как суждения о внешнем облике.
- issue: Значение οὐ μέλει σοι περὶ οὐδενός
  choice: «Тебе нет дела до положения человека».
  alternative: «Тебе нет дела ни до кого».
  rationale: 'Буквальная альтернатива по-русски могла бы приписать Иисусу равнодушие к людям. Последующее «не смотришь на лица» задаёт более узкий смысл: Его не склоняют статус, влияние или мнение человека.'
translation_notes:
  register: Современный литературный русский с достоинством евангельского повествования. Историческое настоящее сохранено. Заглавные местоимения при обращении к Иисусу употреблены по принятой русской библейской стилистике; «иродиане» оставлено как традиционное название группы.
