  choice: Передать утверждение без пояснительного добавления о состоянии патриархов после смерти
  alternative: Он Бог не мёртвых, а тех, кто жив перед Ним
  rationale: Греческий текст утверждает противопоставление мёртвых и живых, но не формулирует здесь подробного учения о промежуточном состоянии. Перевод сохраняет богословскую силу и напряжение аргумента, не разрешая их парафразом.
- issue: Повтор θεός во втором предложении
  choice: Он Бог не мёртвых, а живых
  alternative: Бог — Бог не мёртвых, а живых
  rationale: Источник явно повторяет слово θεός, поэтому в русском сохранено сказуемое «Бог»; местоимение «Он» вместо повторного подлежащего делает фразу естественной и не меняет референцию.
