- source_word: ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: Бог Авраама, Бог Исаака и Бог Иакова
  rationale: Повтор слова «Бог» сохранён в каждой части, как в греческом тексте, ради риторической выразительности; повтор союза перед каждым элементом по-русски был бы излишне тяжеловесен.
- source_word: οὐκ ἔστιν ὁ θεὸς νεκρῶν ἀλλὰ ζώντων
  choice: Он Бог не мёртвых, а живых
  rationale: Местоимение «Он» естественно отсылает к только что названному Богу. Русская конструкция сохраняет краткую антитезу и не добавляет отсутствующего в источнике пояснения.
- source_word: νεκρῶν
  choice: мёртвых
  rationale: Субстантивированное прилагательное во множественном числе естественно передаётся по-русски словом «мёртвых».
- source_word: ζώντων
  choice: живых
  rationale: Субстантивированное причастие передано симметрично словом «живых», что сохраняет лаконичное противопоставление.
