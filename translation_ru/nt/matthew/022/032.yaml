  register: Современный литературный русский язык с достоинством библейской цитаты. Сохранён трёхчастный повтор «Бог Авраама, Бог Исаака и Бог Иакова», но синтаксис не перегружен неестественным повтором союза. Маркер сноски помещён после всего второго предложения.
