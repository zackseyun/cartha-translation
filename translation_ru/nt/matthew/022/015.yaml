  source_fidelity: «Тогда фарисеи ушли и стали советоваться, как поймать его на словах» точно передаёт последовательность Τότε, повествовательную функцию πορευθέντες, значение συμβούλιον ἔλαβον и цель, вводимую ὅπως. «Поймать ... на словах» — естественная русская передача образного παγιδεύσωσιν ἐν λόγῳ без утраты враждебного замысла.
  naturalness: Текст звучит естественно на современном литературном русском. «Ушли и стали советоваться» не перегружено буквальным синтаксисом, а «поймать его на словах» — ясное и общеупотребительное выражение в данном контексте.
  terminology: «Фарисеи» — нормативное и узнаваемое обозначение. Нейтральное «стали советоваться» верно не переносит враждебную окраску в συμβούλιον ἔλαβον раньше, чем она выражена целью «поймать». Строчная буква в «его» соответствует заявленной нейтральной редакционной норме.
