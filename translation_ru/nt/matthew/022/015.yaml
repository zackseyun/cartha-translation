id: MAT.22.15
reference: Matthew 22:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τότε πορευθέντες οἱ Φαρισαῖοι συμβούλιον ἔλαβον ὅπως αὐτὸν παγιδεύσωσιν ἐν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/015.yaml
  text: Then the Pharisees went and took counsel how they might trap him in his words[a].
translation:
  language: ru
  text: Тогда фарисеи ушли и стали советоваться, как поймать его на словах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заманить его в ловушку тем, что он скажет».'
    reason: Лексический вариант, раскрывающий образ глагола παγιδεύσωσιν и возможное инструментальное значение ἐν λόγῳ.
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Кратко и естественно обозначает последовательность событий в повествовании.
- source_word: πορευθέντες
  choice: ушли
  rationale: Аористное причастие перед основным глаголом передаёт предшествующее действие; «ушли» естественно отражает удаление фарисеев для совещания.
- source_word: οἱ Φαρισαῖοι
  choice: фарисеи
  rationale: Устоявшееся современное русское обозначение этой религиозной группы.
- source_word: συμβούλιον ἔλαβον
  choice: стали советоваться
  rationale: Передаёт совещание и выработку плана, не внося в саму идиому избыточной враждебной окраски; злой умысел ясно выражен далее.
- source_word: ὅπως
  choice: как
  rationale: После глагола совещания естественно вводит содержание замысла, сохраняя его целевую направленность.
- source_word: αὐτὸν
  choice: его
  rationale: Прямое местоименное обозначение Иисуса; написание со строчной буквы соответствует нейтральной современной издательской норме.
- source_word: παγιδεύσωσιν
  choice: поймать
  rationale: В сочетании «поймать на словах» ясно передаёт образ заманивания в ловушку и враждебный умысел.
- source_word: ἐν λόγῳ
  choice: на словах
  rationale: Естественная русская конструкция для попытки уличить человека посредством его собственного высказывания; сохраняет некоторую широту греческого выражения.
theological_decisions:
- issue: Степень враждебности в выражении συμβούλιον ἔλαβον
  choice: 'Передать нейтрально: «стали советоваться», оставив враждебный умысел целевой части фразы.'
  alternative: «сговорились» или «замыслили»
  rationale: Само выражение обозначает совещание или принятие решения, тогда как злонамеренность недвусмысленно выражена глаголом «поймать».
- issue: Способ, которым фарисеи намеревались уловить Иисуса
  choice: «поймать его на словах»
  alternative: «заманить его в ловушку тем, что он скажет»
  rationale: Греческое ἐν λόγῳ допускает сжатое понимание «посредством речи / в высказывании». Основной текст сохраняет лаконичность, а примечание раскрывает возможный смысл.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Синтаксис остаётся близким к греческой последовательности, но звучит естественно; архаизмы «уловить» и «держали совет» не используются.
