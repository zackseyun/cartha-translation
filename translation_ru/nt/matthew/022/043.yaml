  yaml_path: translation/nt/matthew/022/043.yaml
  text: He said to them[a], “How then does David, in the Spirit, call him Lord[b], saying,”
translation:
  language: ru
  text: 'Он сказал им: «Как же Давид в Духе[a] называет Его Господом[b], говоря:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Духом». Греческое выражение допускает понимание как указание на сферу, в которой говорит Давид, так и на действие Духа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «господином». Греческое κύριος может означать «господин», «владыка» или служить титулом «Господь».'
