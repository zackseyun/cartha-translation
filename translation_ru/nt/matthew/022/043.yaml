lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Он сказал им
  rationale: Историческое настоящее передано естественным для русского повествования прошедшим временем; адресат сохранён.
- source_word: Πῶς οὖν
  choice: Как же
  rationale: «Как» сохраняет вопросительную силу πῶς, а частица «же» естественно передаёт логически-связующее οὖν.
- source_word: Δαυὶδ
  choice: Давид
  rationale: Использована традиционная русская форма библейского имени.
- source_word: ἐν πνεύματι
  choice: в Духе
  rationale: Формально сохраняет конструкцию с ἐν и её возможный оттенок сферы; заглавная буква отражает наиболее вероятную отсылку к Святому Духу.
- source_word: καλεῖ αὐτὸν κύριον
  choice: называет Его Господом
  rationale: Глагол «называет» естественно передаёт καλεῖ, а «Господом» сохраняет титул κύριος и связь с последующей цитатой из Псалма 109(110).
- source_word: λέγων
  choice: говоря
  rationale: Деепричастие прямо передаёт греческое причастие и вводит следующую цитату.
theological_decisions:
- issue: Референт πνεῦμα в выражении ἐν πνεύματι
  choice: Дух Святой
  alternative: дух Давида или его духовное состояние
  rationale: Контекст речи Давида в Писании делает отсылку к Святому Духу наиболее вероятной; при этом буквальное «в Духе» не уточняет способ воздействия сверх сказанного в греческом тексте.
- issue: Передача κύριος
  choice: Господь
  alternative: господин / владыка
  rationale: В мессианском аргументе и цитатном контексте «Господь» лучше сохраняет титульный и межтекстовый смысл, не устраняя заложенного в вопросе богословского напряжения.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и dignified. Заглавные буквы в «Духе», «Его» и «Господом» соответствуют традиционному русскому библейскому регистру. Двоеточие оставлено как переход к цитате в следующем стихе.
