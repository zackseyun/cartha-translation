  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες ἐθαύμασαν, καὶ ἀφέντες αὐτὸν ἀπῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/022.yaml
  text: And hearing this[a], they were amazed, and leaving him, they went away.
translation:
  language: ru
  text: Услышав это[a], они изумились и, оставив Его, ушли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда они услышали это, то удивились».'
    reason: Возможна развёрнутая передача греческого причастия временным придаточным; «удивились» — менее сильный, но допустимый эквивалент ἐθαύμασαν.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: услышав это
  rationale: Аористное действительное причастие передаёт действие, предшествующее основному; деепричастие естественно сохраняет греческую конструкцию. Местоимение «это» восполняет подразумеваемый из контекста объект.
- source_word: ἐθαύμασαν
  choice: они изумились
  rationale: θαυμάζω здесь обозначает сильное удивление; «изумились» ясно и естественно передаёт эту реакцию в современном литературном русском.
- source_word: ἀφέντες αὐτὸν
  choice: оставив Его
  rationale: Передаёт уход от Иисуса без добавления не выраженного прямо оттенка «оставив одного».
- source_word: ἀπῆλθαν
  choice: ушли
  rationale: Краткий естественный эквивалент ἀπέρχομαι, сохраняющий движение прочь и лаконичность повествования.
- source_word: καὶ ... καὶ
  choice: и ... и
  rationale: Первое καί передано союзом «и»; второе естественно выражено русской связью однородных действий без лишнего повторения союза.
theological_decisions: []
translation_notes:
  register: Современный литературный русский, ясный и сдержанно-достоинный. Заглавная буква в местоимении «Его» соответствует принятой русской библейской издательской традиции и не меняет смысла исходного текста.
