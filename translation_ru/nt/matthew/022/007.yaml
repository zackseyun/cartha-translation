source:
  edition: SBLGNT
  text: ⸂ὁ δὲ βασιλεὺς⸃ ὠργίσθη, καὶ πέμψας τὰ στρατεύματα αὐτοῦ ἀπώλεσεν τοὺς φονεῖς ἐκείνους καὶ τὴν πόλιν αὐτῶν ἐνέπρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/007.yaml
  text: But the king became angry, and he sent his troops, destroyed those murderers, and burned their city.
translation:
  language: ru
  text: Но царь разгневался и, послав свои войска, уничтожил тех убийц и сжёг их город.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθη
  choice: разгневался
  rationale: Точно передаёт наступление гнева и естественно звучит в современном литературном русском.
- source_word: τὰ στρατεύματα αὐτοῦ
  choice: свои войска
  rationale: Множественное греческое существительное обозначает вооружённые силы царя; возвратное «свои» ясно соотносит их с подлежащим.
- source_word: ἀπώλεσεν
  choice: уничтожил
  rationale: Передаёт сильное значение полного истребления в данном военном контексте.
- source_word: τοὺς φονεῖς ἐκείνους
  choice: тех убийц
  rationale: Сохраняет указательное значение ἐκείνους и прямое обозначение виновных.
- source_word: ἐνέπρησεν
  choice: сжёг
  rationale: Естественный русский эквивалент со значением предания города огню.
theological_decisions:
- issue: Связь последовательных действий царя
  choice: 'Однородные личные глаголы: «послал… уничтожил… сжёг»'
  alternative: 'Деепричастная конструкция: «послав свои войска, уничтожил…»'
  rationale: Греческое πέμψας формально является причастием, но в контексте выражает предшествующее действие. Однородная цепочка по-русски ясна, сохраняет последовательность и не добавляет богословского толкования.
translation_notes:
  register: Современный литературный русский; лаконичный, энергичный повествовательный стиль. Начальное δέ передано без отдельного «но», поскольку стих естественно продолжает контраст предыдущего контекста, а изолированное «но» здесь звучало бы тяжеловесно.
