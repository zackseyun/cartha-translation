  text: ἦσαν δὲ παρ’ ἡμῖν ἑπτὰ ἀδελφοί· καὶ ὁ πρῶτος ⸀γήμας ἐτελεύτησεν, καὶ μὴ ἔχων σπέρμα ἀφῆκεν τὴν γυναῖκα αὐτοῦ τῷ ἀδελφῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/025.yaml
  text: There were seven brothers among us[a]. The first married and died, and having no offspring[b], he left his wife to his brother.
translation:
  language: ru
  text: Было у нас семь братьев. Первый женился и умер бездетным[a], оставив жену своему брату[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не имея семени», то есть потомства.'
    reason: lexical_alternative
  - marker: b
    text: 'Имеется в виду обычай левиратного брака: брат умершего должен был жениться на вдове, чтобы продолжить род покойного; см. Второзаконие 25:5.'
    reason: cultural_note
lexical_decisions:
- source_word: παρ’ ἡμῖν
  choice: у нас
  rationale: Естественно передаёт присутствие в среде, о которой говорят саддукеи; русское «среди нас» также возможно, но здесь звучит тяжелее.
- source_word: ἑπτὰ ἀδελφοί
  choice: семь братьев
  rationale: В контексте левиратного брака речь явно идёт о родных братьях мужского пола.
- source_word: ὁ πρῶτος
  choice: первый
  rationale: Обозначает последовательность, не утверждая, что он был старшим по возрасту.
- source_word: γήμας ἐτελεύτησεν
  choice: женился и умер
  rationale: Естественная русская последовательность действий сохраняет предшествование брака смерти.
- source_word: μὴ ἔχων σπέρμα
  choice: умер бездетным
  rationale: В семейно-правовом контексте σπέρμα означает потомство; сжатая русская формулировка ясно передаёт смысл, не вводя неестественное «не имея семени».
- source_word: ἀφῆκεν τὴν γυναῖκα αὐτοῦ
  choice: оставив жену
  rationale: Причастный оборот естественно связывает это действие со смертью; речь о жене, оставшейся после его смерти, а не о разводе.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: своему брату
  rationale: Дательный падеж указывает, кому была оставлена вдова; «своему» устраняет возможную неясность принадлежности.
theological_decisions:
- issue: Следует ли прямо сказать в основном тексте, что брат должен был жениться на вдове
  choice: Сохранить подразумеваемый характер левиратного обычая и не добавлять «чтобы тот женился на ней».
  alternative: «оставив жену своему брату, чтобы тот женился на ней»
  rationale: Греческий текст прямо не содержит цели или глагола повторного брака; культурно-правовой фон лучше пояснить в сноске, не расширяя основной текст.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанный. «Бездетным» естественно передаёт отсутствие потомства, а буквальный образ сохранён в сноске. Союз δέ не воспроизведён отдельным начальным словом, поскольку здесь он лишь мягко связывает фразу с контекстом.
