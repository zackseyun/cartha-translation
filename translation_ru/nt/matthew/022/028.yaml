base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/028.yaml
  text: In the resurrection[a], then, whose wife of the seven will she be? For they all had her.
translation:
  language: ru
  text: Итак, при воскресении кому из семерых она будет женой? Ведь все они были на ней женаты.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ведь все имели её»; то есть все семеро поочерёдно были её мужьями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ ἀναστάσει
  choice: при воскресении
  rationale: 'Предлог ἐν с дательным обозначает обстоятельство или время: вопрос относится к будущему воскресению мёртвых. «При воскресении» естественно и точно передаёт этот смысл по-русски.'
- source_word: οὖν
  choice: итак
  rationale: Частица связывает вопрос с предшествующим рассказом и вводит вывод из него; «итак» сохраняет логическую связь и подходит к вопросительной реплике.
- source_word: τίνος τῶν ἑπτὰ
  choice: чьей … из семерых
  rationale: Родительный вопросительного местоимения указывает на брачную принадлежность, а τῶν ἑπτὰ задаёт круг выбора. Русская конструкция сохраняет оба элемента.
- source_word: γυνή
  choice: женой
  rationale: В данном брачном контексте γυνή означает именно «жена», а не просто «женщина».
- source_word: πάντες γὰρ ἔσχον αὐτήν
  choice: Ведь каждый из них был на ней женат
  rationale: Греческое выражение буквально говорит, что все «имели её», но в контексте речь о последовательном браке семи братьев с одной женщиной. Выбранная формулировка передаёт смысл ясно и естественно, не создавая в современном русском нежелательной двусмысленности.
theological_decisions:
- issue: Значение ἀνάστασις в вопросе саддукеев
  choice: Будущее воскресение мёртвых
  alternative: Неопределённое существование после смерти
  rationale: Контекст прямо посвящён отрицанию саддукеями воскресения и последующему ответу Иисуса на эту тему. Формулировка «при воскресении» сохраняет конкретный предмет спора, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; вопрос сформулирован естественно, но с сохранением логической частицы и конкретного указания на воскресение. Более буквальное «все имели её» вынесено в примечание из-за неестественного и потенциально двусмысленного звучания по-русски.
