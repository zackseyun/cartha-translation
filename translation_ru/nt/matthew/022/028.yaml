    rationale: πάντες означает «все» и относится к семи братьям как к группе. Хотя «каждый» может подразумевать совокупность, в русском он меняет акцент на распределительное единственное число и не столь точно соответствует исходнику.
  - severity: low
    issue: Порядок слов в первом вопросе тяжеловесен
    rationale: 'Конструкция «чьей женой из семерых она будет» формально понятна, но современному русскому естественнее передать τίνος дательным: «кому из семерых она будет женой?».'
  revised_text: Итак, при воскресении кому из семерых она будет женой? Ведь все они были на ней женаты.[a]
