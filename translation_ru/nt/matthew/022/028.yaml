  verdict: revise
  source_fidelity: 'Смысл передан в целом точно: речь идёт о воскресении и о том, кому из семи братьев женщина будет женой. Однако «каждый из них» ослабляет и грамматически преобразует греческое πάντες («все»), тогда как исходник прямо говорит о всех семерых.'
  naturalness: «Кому из семерых она будет женой?» — более естественная современная русская конструкция, чем «чьей женой из семерых она будет», и однозначно выражает требуемое отношение. «Все они были на ней женаты» звучит естественно и сохраняет множественность субъекта.
  terminology: «Воскресение» верно передаёт ἀνάστασις в данном контексте. «Женой» корректно передаёт γυνή в брачном контексте. Формулировка «были на ней женаты» — оправданная смысловая передача ἔσχον αὐτήν; буквальный оборот следует сохранить в примечании.
  issues:
