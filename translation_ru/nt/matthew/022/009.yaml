id: MAT.22.9
reference: Matthew 22:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πορεύεσθε οὖν ἐπὶ τὰς διεξόδους τῶν ὁδῶν, καὶ ὅσους ⸀ἐὰν εὕρητε καλέσατε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/009.yaml
  text: Therefore go to the street intersections[b][a], and invite to the wedding feast as many as you find.
translation:
  language: ru
  text: Итак, пойдите на перекрёстки дорог[a] и всех, кого найдёте, пригласите на свадебный пир[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к выходам дорог»; греческое выражение обозначает места, где дороги сходятся, расходятся или выходят в другие дороги.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на свадьбы»; греческое выражение здесь означает свадебное торжество или пир.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορεύεσθε
  choice: пойдите
  rationale: Повелительное наклонение передано естественной для современного русского языка формой, ясно выражающей прямое указание.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод и переход к действию, вытекающему из предыдущих слов; в данном контексте звучит естественнее, чем более книжное «поэтому».
- source_word: ἐπὶ τὰς διεξόδους τῶν ὁδῶν
  choice: на перекрёстки дорог
  rationale: Редкое выражение обозначает места выхода, разветвления или соединения дорог. «Перекрёстки дорог» понятно современному читателю и не вводит излишне узкой географической конкретизации.
- source_word: ὅσους ἐὰν εὕρητε
  choice: всех, кого найдёте
  rationale: 'Сохраняет неопределённость и широкий охват конструкции: пригласить следует всех встреченных.'
- source_word: καλέσατε
  choice: пригласите
  rationale: В контексте свадебного торжества глагол означает приглашение, а не просто зов или оклик.
- source_word: εἰς τοὺς γάμους
  choice: на свадебный пир
  rationale: Форма множественного числа здесь идиоматически обозначает свадебное торжество или пир, а не несколько свадеб.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык, ясный и dignified по тону. Синтаксис сохраняет последовательность двух повелений оригинала; лексические примечания отмечают реальную неоднозначность редкого пространственного выражения и идиоматического множественного числа γάμοι.
