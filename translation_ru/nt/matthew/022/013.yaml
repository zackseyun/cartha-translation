id: MAT.22.13
reference: Matthew 22:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τότε ⸂ὁ βασιλεὺς εἶπεν⸃ τοῖς διακόνοις· Δήσαντες αὐτοῦ πόδας καὶ χεῖρας ⸂ἐκβάλετε αὐτὸν⸃ εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/013.yaml
  text: Then the king said to the attendants[a], ‘Bind his feet and hands and throw him out into the outer darkness. In that place there will be weeping and gnashing of teeth.’
translation:
  language: ru
  text: 'Тогда царь сказал слугам: «Свяжите ему ноги и руки и выбросьте его во тьму внешнюю. Там будет плач и скрежет зубов».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественно передаёт временной переход к следующему событию повествования.
- source_word: ὁ βασιλεὺς
  choice: царь
  rationale: Прямо сохраняет царский образ притчи.
- source_word: τοῖς διακόνοις
  choice: слугам
  rationale: В контексте царского пира обозначает людей, прислуживающих царю; слово «служителям» могло бы вызвать ненужные церковные ассоциации.
- source_word: Δήσαντες
  choice: Свяжите
  rationale: Аористное причастие перед повелительным глаголом естественно передаётся в русском как первый однородный императив.
- source_word: αὐτοῦ πόδας καὶ χεῖρας
  choice: ему ноги и руки
  rationale: Сохранён греческий порядок «ноги и руки»; дательный с местоимением звучит по-русски естественнее буквального «его ноги и руки».
- source_word: ἐκβάλετε αὐτὸν
  choice: выбросьте его
  rationale: Передаёт резкое и насильственное удаление, выраженное ἐκβάλλω.
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: во тьму внешнюю
  rationale: Сохраняет узнаваемый матфеевский образ и его литературно-богословскую силу без истолковывающей вставки.
- source_word: ἐκεῖ ἔσται
  choice: Там будет
  rationale: Кратко и естественно сохраняет пространственный акцент и будущее время.
- source_word: ὁ κλαυθμὸς
  choice: плач
  rationale: Точно и традиционно передаёт скорбное плакание, не усиливая значение до вопля.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: скрежет зубов
  rationale: Устоявшийся и точный русский эквивалент, сохраняющий возможные оттенки муки и ярости.
theological_decisions:
- issue: Характер образа изгнания
  choice: Сохранить конкретный образ изгнания во внешнюю тьму без поясняющей идентификации.
  alternative: Прямо назвать ад или, напротив, свести образ лишь к удалению с пира.
  rationale: Греческий текст даёт яркий образ суда внутри притчи, но в самом стихе не истолковывает его уже и не отождествляет прямо с конкретной догматической категорией.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис прямой; сохранены греческий порядок «ноги и руки» и традиционно узнаваемые выражения «тьма внешняя», «плач и скрежет зубов».
