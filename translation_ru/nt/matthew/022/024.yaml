base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/024.yaml
  text: saying[a], “Teacher, Moses said, ‘If a man dies without having children, his brother shall marry his wife and raise up offspring for his brother.’”
translation:
  language: ru
  text: 'говоря: «Учитель, Моисей сказал: „Если мужчина умрёт, не оставив детей, то его брат должен жениться на его вдове[a] и продолжит род своего умершего брата“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или более формально: «исполнить по отношению к его жене обязанность деверя». Греческий глагол относится именно к левиратному браку: браку брата умершего с его бездетной вдовой ради продолжения рода умершего.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Естественное современное обращение к Иисусу как к наставнику; точно передаёт греческое слово.
- source_word: Ἐάν τις ἀποθάνῃ μὴ ἔχων τέκνα
  choice: Если мужчина умрёт, не оставив детей
  rationale: Передаёт конкретно мужской правовой случай и сохраняет широкое значение τέκνα — «дети», а не только «сыновья».
- source_word: ἐπιγαμβρεύσει
  choice: должен жениться на его вдове
  rationale: В контексте обозначает левиратный брак. «Должен» передаёт предписывающую силу будущего времени в цитируемом законе, а «вдова» естественно проясняет положение женщины после смерти мужа.
- source_word: ἀναστήσει σπέρμα
  choice: восстановить потомство
  rationale: Передаёт идиому о продолжении рода умершего без буквального и неестественного в данном контексте «воздвигнуть семя».
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: своему брату
  rationale: Дательный падеж указывает, что потомство юридически и родословно относится к умершему брату.
theological_decisions:
- issue: Гендерная форма правового примера
  choice: «Если мужчина умрёт… его брат»
  alternative: «Если кто-нибудь умрёт…»
  rationale: Моисеев закон здесь описывает конкретные мужские родственные роли; гендерно нейтральная передача ослабила бы эту особенность текста.
- issue: Отнесение потомства к умершему брату
  choice: «восстановить потомство своему брату»
  alternative: «родить детей от имени своего брата»
  rationale: Выбранная формулировка сохраняет юридико-родовой смысл и не добавляет отсутствующего в греческом уточнения «от имени».
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Синтаксис цитаты сохранён, но «вдова» употреблено вместо формального «жена», чтобы в русском контексте избежать неясности. Терминологическое содержание левиратного обычая вынесено в сноску.
