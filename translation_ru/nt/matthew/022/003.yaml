  text: καὶ ἀπέστειλεν τοὺς δούλους αὐτοῦ καλέσαι τοὺς κεκλημένους εἰς τοὺς γάμους, καὶ οὐκ ἤθελον ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/003.yaml
  text: And he sent his servants to call those who had been invited to the wedding feast[c][b][a], and they were unwilling to come.
translation:
  language: ru
  text: И послал он своих слуг[a] позвать приглашённых[b] на свадебный пир[c], но они не захотели прийти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рабов». Греческое слово может обозначать и слуг, и рабов; здесь подчеркнута их роль исполнителей царского поручения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «позвать позванных». В греческом тексте употреблены формы одного глагола; по смыслу речь идёт о тех, кто уже был приглашён.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «на свадебное празднество».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Аорист ἀποστέλλω прямо и естественно передаётся глаголом «послал»; более сильные варианты вроде «направил» или «отправил с поручением» здесь не требуются.
- source_word: δούλους
  choice: слуг
  rationale: δοῦλος может обозначать раба или слугу. В этой притче на первом плане их роль посланцев царя, поэтому «слуг» звучит естественно и не вносит лишнего акцента на правовом положении.
- source_word: καλέσαι
  choice: позвать
  rationale: Инфинитив выражает цель посылания. «Позвать» естественно для ситуации, когда ранее приглашённых зовут прийти на уже приготовленный пир.
- source_word: κεκλημένους
  choice: приглашённых
  rationale: Перфектное страдательное причастие указывает на тех, кого пригласили ранее. «Приглашённых» ясно передаёт смысл в контексте свадебного пира, хотя не сохраняет полностью повтор корня καλέω.
- source_word: εἰς τοὺς γάμους
  choice: на свадебный пир
  rationale: Множественное γάμοι в данном контексте обозначает свадебное празднество, особенно пир, а не только заключение брака.
- source_word: οὐκ ἤθελον ἐλθεῖν
  choice: они не захотели прийти
  rationale: Оборот с ἤθελον выражает нежелание. «Не захотели прийти» сохраняет акцент на воле приглашённых и не усиливает формулировку до «отказались».
theological_decisions:
- issue: Передача δοῦλος в притче
  choice: слуг
  alternative: рабов
  rationale: Контекст подчёркивает выполнение поручения царя, а не социально-правовой статус этих людей. Выбор «слуг» не устраняет возможное значение «рабы», которое указано в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным ритмом. Порядок слов «послал он» слегка возвышенный, но естественный для притчи. Формулировка сохраняет волевой оттенок последней части и поясняет лексическую неоднозначность в сносках.
