lexical_decisions:
- source_word: δὲ
  choice: же
  rationale: Передаёт мягкий переход и оттенок противопоставления предшествующему рассказу без чрезмерно резкого «но».
- source_word: Φαρισαῖοι
  choice: фарисеи
  rationale: Устоявшееся русское наименование этой иудейской религиозной группы.
- source_word: ἀκούσαντες
  choice: услышав
  rationale: Деепричастие естественно передаёт предшествующее обстоятельство, выраженное аористным причастием.
- source_word: ἐφίμωσεν
  choice: заставил … замолчать
  rationale: Передаёт контекстуальный смысл прекращения спора, сохраняя энергичность греческого глагола; буквальный образ намордника отмечен в сноске.
- source_word: Σαδδουκαίους
  choice: саддукеев
  rationale: Устоявшееся русское наименование этой иудейской религиозной группы.
- source_word: συνήχθησαν
  choice: собрались
  rationale: Естественно передаёт пассивную по форме глагольную конструкцию с непереходным значением.
- source_word: ἐπὶ τὸ αὐτό
  choice: вместе
  rationale: Сохраняет идиоматическое значение выражения, не уточняя без достаточных оснований ни место, ни цель собрания.
