base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/011.yaml
  text: But when the king came in to look at the guests reclining at the table[b][a], he saw there a man not dressed in wedding clothes.
translation:
  language: ru
  text: Когда же царь вошёл посмотреть на гостей, возлежавших за столом[b], он увидел там человека, на котором не было свадебной одежды[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человека, не одетого в свадебную одежду».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «возлежащих». На торжественных пирах гости обычно располагались возле стола полулёжа.'
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθὼν δὲ
  choice: Когда же … вошёл
  rationale: Аористное причастие обозначает действие, предшествующее основному глаголу; конструкция «когда же … вошёл» естественно передаёт развитие повествования и лёгкий поворот, выраженный δέ.
- source_word: ὁ βασιλεὺς
  choice: царь
  rationale: Обычное и контекстуально точное обозначение монарха в царской притче.
- source_word: θεάσασθαι
  choice: посмотреть
  rationale: Инфинитив цели указывает, зачем царь вошёл. «Посмотреть» передаёт внимательное обозрение, не усиливая значение до официальной «проверки».
- source_word: τοὺς ἀνακειμένους
  choice: возлежащих за столом гостей
  rationale: В контексте пира ἀνάκειμαι обозначает принятую в древности позу за трапезой. Добавление «гостей» ясно обозначает участников пира, а «возлежащих за столом» сохраняет историческую деталь.
- source_word: εἶδεν ἐκεῖ
  choice: увидел там
  rationale: Прямое и естественное соответствие простому повествовательному выражению.
- source_word: ἄνθρωπον
  choice: человека
  rationale: Здесь речь идёт об одном конкретном участнике притчи; русское «человека» естественно и не добавляет характеристик, отсутствующих в исходном тексте.
- source_word: οὐκ ἐνδεδυμένον ἔνδυμα γάμου
  choice: на котором не было свадебной одежды
  rationale: Передаёт наличное состояние, выраженное перфектным причастием, и сохраняет свадебный характер одежды. Формулировка естественна в современном русском языке и не уточняет сверх текста, был ли это один особый предмет одежды или наряд в целом.
theological_decisions:
- issue: Образ одежды на свадебном пире
  choice: Сохранить общее выражение «свадебная одежда», не объясняя его символическое значение внутри перевода.
  alternative: «праздничная одежда» или поясняющее истолкование символа
  rationale: Греческое ἔνδυμα γάμου буквально связывает одежду со свадьбой, но сам стих не раскрывает символику. Перевод сохраняет образ и богословское напряжение притчи, не навязывая толкования.
- issue: Поза участников пира
  choice: Сохранить упоминание возлежания и пояснить контекст словами «за столом гостей».
  alternative: Передать только как «гостей» или «сидевших за столом»
  rationale: Возлежание является реальной культурной деталью исходного текста; замена на сидение была бы понятнее современному читателю, но исторически менее точна.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Историческая деталь «возлежащих» сохранена и кратко пояснена в сноске; синтаксис остаётся доступным для обычного читателя.
