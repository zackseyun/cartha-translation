lexical_decisions:
- source_word: λέγων
  choice: говоря
  rationale: Причастие настоящего времени от λέγω вводит прямую речь Иисуса; буквальное «говоря» сохраняет связь с предшествующим контекстом стиха.
- source_word: Τί ὑμῖν δοκεῖ
  choice: Что вы думаете
  rationale: Обычный современный русский способ спросить о суждении или мнении собеседников.
- source_word: περὶ τοῦ χριστοῦ
  choice: о Мессии
  rationale: Χριστός здесь выступает как титул в иудейском мессианском обсуждении; «Мессия» естественно передаёт титульное значение.
- source_word: τίνος υἱός ἐστιν
  choice: Чей Он сын?
  rationale: Вопрос касается происхождения и династической принадлежности Мессии; местоимение отсылает к упомянутому Мессии.
- source_word: λέγουσιν αὐτῷ
  choice: Они отвечают Ему
  rationale: Хотя буквально λέγουσιν означает «говорят», в контексте ответа на вопрос русское «отвечают» естественно и не меняет содержания; историческое настоящее сохранено.
- source_word: Τοῦ Δαυίδ
  choice: Давида
  rationale: Греческий родительный представляет собой эллиптический ответ, где слово «сын» восстанавливается из вопроса; русский родительный «Давида» сохраняет эту краткость.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном месте слово употреблено как титул и предмет вопроса об ожидаемом потомке Давида, поэтому «Мессия» яснее передаёт его функцию; вариант «Христос» указан в сноске без устранения лексической неоднозначности.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Сохранены вводное причастие и историческое настоящее. Прописные буквы в местоимениях «Он», «Ему» отражают традиционную русскую библейскую орфографию, не добавляя отдельного толкования.
