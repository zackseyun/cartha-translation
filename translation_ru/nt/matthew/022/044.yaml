  text: ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/044.yaml
  text: The Lord said to my Lord[a], ‘Sit at my right hand until I put your enemies under your feet’?”
translation:
  language: ru
  text: '«Господь сказал моему Господу: „Сиди по правую руку от Меня, пока Я не положу Твоих врагов под Твои ноги“?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν
  choice: сказал
  rationale: Простая и естественная передача аориста λέγω в формуле цитирования.
- source_word: κύριος … τῷ κυρίῳ μου
  choice: Господь … моему Господу
  rationale: Греческий текст употребляет один и тот же титул κύριος для обоих лиц; повторение «Господь» сохраняет эту особенность и различает их посредством «моему».
- source_word: Κάθου
  choice: Сиди
  rationale: Естественный русский императив в контексте воцарения; точнее и прямее, чем описательное «воссядь».
- source_word: ἐκ δεξιῶν μου
  choice: по правую руку от Меня
  rationale: Устойчивый русский оборот, передающий почётное место рядом с говорящим.
- source_word: ἕως ἂν θῶ
  choice: пока Я не положу
  rationale: Передаёт ожидаемое будущее действие, выраженное ἕως ἂν с аористом конъюнктива.
- source_word: τοὺς ἐχθρούς σου
  choice: Твоих врагов
  rationale: Прямая, современная и стилистически нейтральная передача.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: под Твои ноги
  rationale: Следует непосредственно греческому тексту Матфея, не добавляя отсутствующий в нём образ подножия.
theological_decisions:
- issue: Два употребления κύριος в цитате из Псалма 109:1 (110:1)
  choice: «Господь сказал моему Господу»
  alternative: «Господь сказал моему господину» или «ГОСПОДЬ сказал моему Господу»
  rationale: В греческой цитате оба лица названы одним словом κύριος. Одинаковая передача сохраняет формулировку источника и напряжение аргумента Иисуса; написание «ГОСПОДЬ» внесло бы различение из еврейского текста, а «господину» ослабило бы титульную связь.
- issue: Образ покорения врагов
  choice: «положу Твоих врагов под Твои ноги»
  alternative: «сделаю Твоих врагов подножием для Твоих ног»
  rationale: Выбранный вариант буквально отражает греческую форму у Матфея и не подменяет её более развёрнутой формулировкой еврейского псалма.
translation_notes:
  register: Современный литературный русский с достоинством библейской цитаты. Заглавные местоимения «Меня», «Я», «Твоих», «Твои» использованы в рамках традиционного русского оформления прямой божественной речи; вопросительный знак относится ко всему вопросу Иисуса, частью которого является цитата.
