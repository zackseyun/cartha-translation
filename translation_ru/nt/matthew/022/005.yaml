  text: οἱ δὲ ἀμελήσαντες ἀπῆλθον, ⸀ὃς μὲν εἰς τὸν ἴδιον ἀγρόν, ⸁ὃς δὲ ⸀ἐπὶ τὴν ἐμπορίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/005.yaml
  text: But they paid no attention and went away[a], one to his own field, another to his business.
translation:
  language: ru
  text: 'Но они, не обратив внимания[a], ушли: один — на своё поле, другой — по своим торговым делам.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пренебрегли этим», «оставили это без внимания»; в контексте речь идёт о приглашении царя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμελήσαντες
  choice: не обратив внимания
  rationale: Причастие передаёт пренебрежение или отсутствие должного внимания. Русское выражение естественно звучит без названного объекта и тем самым сохраняет его подразумеваемый характер в греческом тексте.
- source_word: ἀπῆλθον
  choice: ушли
  rationale: Прямо и естественно передаёт удаление званых после призыва.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: один ... другой
  rationale: Естественно передаёт распределительную конструкцию и противопоставление μέν ... δέ.
- source_word: εἰς τὸν ἴδιον ἀγρόν
  choice: на своё поле
  rationale: «Поле» непосредственно соответствует ἀγρός, а «своё» сохраняет значение ἴδιον и акцент на личных занятиях.
- source_word: ἐπὶ τὴν ἐμπορίαν αὐτοῦ
  choice: по своим торговым делам
  rationale: Передаёт ἐμπορία как торговую, коммерческую деятельность, не сводя значение к товарам; выражение естественно в современном русском повествовании.
theological_decisions:
- issue: Подразумеваемый объект ἀμελήσαντες
  choice: 'Объект не назван в основном тексте: «не обратив внимания»; из контекста понятно, что речь идёт о приглашении царя.'
  alternative: «Пренебрегли приглашением» или «оставили приглашение без внимания».
  rationale: Греческий текст оставляет объект подразумеваемым. Перевод сохраняет эту особенность и не добавляет богословского истолкования, а сноска поясняет контекст.
translation_notes:
  register: Современный литературный русский язык; ясный и сдержанно-достойный повествовательный стиль. Двоеточие и тире естественно оформляют распределительную конструкцию «один ... другой».
