  text: Last of all[a], the woman died.
translation:
  language: ru
  text: Последней из всех умерла женщина.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «После всех умерла и женщина»; греческое выражение может означать «последней из всех», «после всех» или «наконец».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον … πάντων
  choice: Последней из всех
  rationale: 'Сочетание ὕστερον с πάντων передаёт итоговую последовательность: женщина умерла после всех ранее упомянутых братьев. Формулировка естественна по-русски и сохраняет соотнесённость со всеми участниками рассказа.'
- source_word: δὲ
  choice: не передано отдельным словом
  rationale: Слабый соединительный оттенок δέ естественно выражен переходом к последнему событию и не требует отдельного союза в русском тексте.
- source_word: ἀπέθανεν
  choice: умерла
  rationale: Прямо и без эвфемизма передаёт аорист ἀπέθανεν как завершившееся событие.
- source_word: ἡ γυνή
  choice: женщина
  rationale: γυνή допускает значения «женщина» и «жена». Здесь речь идёт об одной женщине, последовательно бывшей женой нескольких братьев, поэтому «женщина» точнее сохраняет греческую формулировку и не привязывает её к одному мужу.
