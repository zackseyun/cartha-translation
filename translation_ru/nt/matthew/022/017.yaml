  text: εἰπὸν οὖν ἡμῖν τί σοι δοκεῖ· ἔξεστιν δοῦναι κῆνσον Καίσαρι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/017.yaml
  text: Tell us, then, what do you think? Is it lawful to give the poll tax to Caesar, or not?
translation:
  language: ru
  text: 'Итак, скажи нам: что Ты думаешь? Позволительно ли давать подать кесарю или нет?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί σοι δοκεῖ
  choice: как ты думаешь
  rationale: Естественно передаёт вопрос о личном мнении собеседника, сохраняя обращение во втором лице единственного числа.
- source_word: ἔξεστιν
  choice: позволительно ли
  rationale: Передаёт вопрос о допустимости с возможным правовым и религиозным оттенком, не сводя его только к государственному закону.
- source_word: δοῦναι
  choice: давать
  rationale: Сохраняет буквальное значение «дать» и формулировку исходного текста, не заменяя её более интерпретирующим «платить».
- source_word: κῆνσον
  choice: подать
  rationale: Обозначает взимаемый римской властью налог; в данном контексте это ясное и стилистически уместное русское соответствие.
- source_word: Καίσαρι
  choice: кесарю
  rationale: Традиционное русское библейское обозначение римского императора, понятное в данном контексте.
theological_decisions:
- issue: Характер допустимости в ἔξεστιν
  choice: позволительно ли
  alternative: законно ли
  rationale: «Позволительно» сохраняет открытым вопрос, идёт ли речь о дозволенности по религиозному закону, совести или действующему праву.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейской речи. Перестройка «скажите нам: как ты думаешь» естественно сохраняет переход от обращения к группе во множественном числе к вопросу Иисусу в единственном числе.'
