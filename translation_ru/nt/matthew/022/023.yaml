id: MAT.22.23
reference: Matthew 22:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῃ τῇ ἡμέρᾳ προσῆλθον αὐτῷ Σαδδουκαῖοι, ⸀λέγοντες μὴ εἶναι ἀνάστασιν, καὶ ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/023.yaml
  text: On that day Sadducees came to him[a], saying there is no resurrection, and they questioned him.
translation:
  language: ru
  text: В тот день к Нему подошли саддукеи, которые говорят, что воскресения нет[a], и задали Ему вопрос.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «саддукеи, утверждающие, что воскресения нет».'
    reason: Лексико-синтаксический вариант передачи причастия λέγοντες.
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: В тот день
  rationale: Естественное русское обозначение времени, точно передающее греческий оборот.
- source_word: προσῆλθον αὐτῷ
  choice: к Нему подошли
  rationale: Передаёт движение к Иисусу; «подошли» естественно в повествовании и несколько точнее простого «пришли».
- source_word: Σαδδουκαῖοι
  choice: саддукеи
  rationale: Устоявшееся в русском языке название иудейской религиозно-политической группы.
- source_word: λέγοντες μὴ εἶναι ἀνάστασιν
  choice: которые говорят, что воскресения нет
  rationale: Причастный оборот может обозначать характерное убеждение саддукеев. Определительная конструкция по-русски естественна и сохраняет эту смысловую связь.
- source_word: ἀνάστασιν
  choice: воскресения
  rationale: Устоявшийся богословский и общеупотребительный эквивалент ἀνάστασις в данном контексте.
- source_word: ἐπηρώτησαν αὐτόν
  choice: задали Ему вопрос
  rationale: Естественно передаёт факт обращения с вопросом; не добавляет отсутствующего в самом глаголе оттенка допроса.
theological_decisions:
- issue: Передача отрицания воскресения саддукеями
  choice: которые говорят, что воскресения нет
  alternative: говоря, что воскресения нет
  rationale: Определительная конструкция ясно представляет отрицание воскресения как характерное убеждение саддукеев, а не как утверждение рассказчика. При этом она не уточняет природу воскресения сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинный. Местоимение, относящееся к Иисусу, написано с прописной буквы согласно распространённой русской библейской традиции; архаизмы и конфессионально окрашенные пояснения не добавлены.
