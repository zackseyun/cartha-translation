  source_fidelity: «В тот день» точно передаёт Ἐν ἐκείνῃ τῇ ἡμέρᾳ; «к Нему подошли» — προσῆλθον αὐτῷ. «Саддукеи, которые говорят, что воскресения нет» адекватно передаёт группу и характеристику, выраженную λέγοντες μὴ εἶναι ἀνάστασιν, без добавления богословских пояснений. «Задали Ему вопрос» является естественной русской передачей ἐπηρώτησαν αὐτόν; единственное число «вопрос» не меняет смысла глагола в данном контексте.
  naturalness: Текст звучит естественно на современном литературном русском языке. Относительное придаточное после «саддукеи» ясно и уместно; порядок слов плавный. Написание местоимений с прописной буквы последовательно соответствует заявленному библейскому регистру.
  terminology: «Саддукеи» — нормативное название группы; «воскресение» — точный и общеупотребительный эквивалент ἀνάστασις. Формулировка не предрешает спорных вопросов о характере воскресения.
