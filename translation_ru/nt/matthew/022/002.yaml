  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ, ὅστις ἐποίησεν γάμους τῷ υἱῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/002.yaml
  text: The kingdom of heaven was compared to a king who gave a wedding feast for his son[a][b].
translation:
  language: ru
  text: Царство Небесное было уподоблено царю, который устроил свадебный пир для своего сына[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Царство Небесное можно уподобить царю». Греческая форма буквально означает «было уподоблено» или «стало подобно»; вариант «можно уподобить» передаёт обычную формулу притчи, но добавляет модальный оттенок.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «свадьбы» (множественное число); так могли называть свадебные торжества или свадебный пир.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡμοιώθη
  choice: было уподоблено
  rationale: Аорист пассивного залога передан прямо и естественно; формулировка сохраняет совершившееся сопоставление и не вносит модального оттенка «можно уподобить».
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Царство Небесное
  rationale: Устоявшееся и понятное русское соответствие характерному для Матфея выражению; не заменяет его выражением «Царство Божье» и сохраняет возможность понимать как царствование, так и царство.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: царю
  rationale: 'В данном сочетании ἄνθρωπος с обозначением лица по положению естественно не выражать отдельно: по-русски «человеку-царю» было бы тяжеловесно и могло бы создать ложное противопоставление человеческого царя иному.'
- source_word: ὅστις
  choice: который
  rationale: Нейтрально и точно вводит действие царя без неоправданного усиления.
- source_word: ἐποίησεν γάμους
  choice: устроил свадебный пир
  rationale: Идиоматически передаёт сочетание ποιέω с множественным γάμους как устройство свадебного торжества, а не буквальное «сделал свадьбы».
- source_word: τῷ υἱῷ αὐτοῦ
  choice: для своего сына
  rationale: 'Передаёт дательный заинтересованного лица и сохраняет естественную русскую связь: пир устроен для сына.'
theological_decisions:
- issue: Выражение «Царство Небесное»
  choice: Сохранить характерную для Матфея формулировку «Царство Небесное».
  alternative: «Царство Божье» или «небесное царствование»
  rationale: Перевод не гармонизирует Матфея с иной новозаветной формулой и не сводит намеренно ёмкое βασιλεία только к процессу царствования.
- issue: Объект уподобления
  choice: Грамматически уподобить Царство царю, не перестраивая фразу так, будто оно уподобляется только пиру.
  alternative: «Царство Небесное подобно свадебному пиру…»
  rationale: Греческий текст непосредственно связывает ὡμοιώθη с ἀνθρώπῳ βασιλεῖ; возможное более широкое понимание всей последующей ситуации не следует заранее закреплять перефразировкой.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. «Устроил свадебный пир» естественно для широкого круга читателей; «было уподоблено» несколько торжественно, но сохраняет форму исходного текста. Все маркеры примечаний присутствуют в основном тексте.
