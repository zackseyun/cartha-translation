  text: γνοὺς δὲ ὁ Ἰησοῦς τὴν πονηρίαν αὐτῶν εἶπεν· Τί με πειράζετε, ὑποκριταί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/018.yaml
  text: But Jesus[a], knowing their evil intent, said, “Why are you testing me[b], hypocrites?”
translation:
  language: ru
  text: 'Но Иисус, зная их злой умысел[a], сказал: «Зачем вы испытываете Меня[b], лицемеры?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их порочность»; или: «их злобу».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Зачем вы искушаете Меня?» Греческий глагол может означать «испытывать», «проверять» или «искушать» — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: зная
  rationale: Аористное причастие от γινώσκω передаёт осведомлённость Иисуса об их намерении до Его ответа; «зная» кратко и естественно сохраняет эту связь.
- source_word: δὲ
  choice: но
  rationale: 'Частица обозначает здесь мягкое противопоставление: притворно уважительному обращению собеседников противопоставлено знание Иисусом их истинного умысла.'
- source_word: πονηρίαν
  choice: злой умысел
  rationale: В данном контексте слово указывает не только на порочность вообще, но и на злонамеренность вопроса, которым пытались уловить Иисуса.
- source_word: εἶπεν
  choice: сказал
  rationale: Обычная и стилистически нейтральная передача повествовательной формы глагола λέγω.
- source_word: Τί
  choice: что
  rationale: В русском вопрос «Что вы испытываете Меня?» естественно выражает укор и сохраняет близость к форме греческого τί; по смыслу он равнозначен вопросу «Зачем вы испытываете Меня?».
- source_word: πειράζετε
  choice: испытываете
  rationale: Глагол πειράζω может означать испытание, проверку или искушение. «Испытываете» сохраняет широту значения и уместно для попытки поставить Иисуса в ловушку.
- source_word: ὑποκριταί
  choice: лицемеры
  rationale: Устоявшийся и точный русский эквивалент для людей, которые изображают искренность, скрывая враждебное намерение.
theological_decisions:
- issue: Знание Иисусом внутреннего намерения противников
  choice: Иисус знает их злой умысел.
  alternative: Иисус распознаёт их порочность или злобу.
  rationale: Перевод сохраняет утверждение текста о точном знании Иисусом нравственно злого характера их замысла, не разворачивая его в более широкое догматическое положение.
- issue: Значение πειράζετε
  choice: испытываете
  alternative: искушаете
  rationale: Контекст говорит о попытке проверить Иисуса и уловить Его ответом; выбранное слово не исключает враждебного искушения, но и не сужает многозначность греческого глагола.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Синтаксис краток и близок к греческому оригиналу; традиционное «лицемеры» сохранено как общеупотребительное и понятное слово.
