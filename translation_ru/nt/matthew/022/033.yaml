lexical_decisions:
- source_word: ἀκούσαντες
  choice: услышав это
  rationale: Аористное действительное причастие относится к слову «народ» и передаёт предшествующее обстоятельство; «это» естественно восполняет подразумеваемый объект — предшествующий ответ Иисуса.
- source_word: οἱ ὄχλοι
  choice: народ
  rationale: Хотя в греческом стоит множественное число, в данном контексте современное русское собирательное «народ» естественно обозначает собравшихся людей и согласуется с традицией ясного повествования.
- source_word: ἐξεπλήσσοντο
  choice: изумлялся
  rationale: Имперфект передаёт продолжительную или живо изображённую реакцию; «изумлялся» сохраняет сильное удивление без избыточного усиления.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: Его учению
  rationale: ἐπί с дательным указывает на основание или повод изумления; русское управление «изумляться чему» кратко и естественно передаёт эту связь.
- source_word: καὶ
  choice: И
  rationale: Простой повествовательный союз сохраняет связь с предшествующим эпизодом.
