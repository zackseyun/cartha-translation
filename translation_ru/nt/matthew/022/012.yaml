  text: καὶ λέγει αὐτῷ· Ἑταῖρε, πῶς εἰσῆλθες ὧδε μὴ ἔχων ἔνδυμα γάμου; ὁ δὲ ἐφιμώθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/012.yaml
  text: And he says to him[a], ‘Friend, how did you come in here without a wedding garment?’ But he was speechless.
translation:
  language: ru
  text: 'И он говорит ему: «Друг, как ты вошёл сюда без свадебной одежды?» Но тот не мог ничего ответить.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, ближе к буквальному: «был вынужден замолчать». Греческий глагол буквально связан с надеванием намордника, а переносно означает «заставить умолкнуть», «заградить уста».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Друг
  rationale: Естественное русское обращение, которое в данном контексте сохраняет внешнюю учтивость и скрытый укор, не усиливая ни дружелюбия, ни враждебности.
- source_word: πῶς
  choice: как
  rationale: Передаёт вопрос о том, каким образом человек вошёл, не заменяя его вопросом о причине («почему»).
- source_word: εἰσῆλθες ὧδε
  choice: ты вошёл сюда
  rationale: Прямо передаёт завершённое действие входа и указание на данное место; формулировка естественна для современного русского языка.
- source_word: μὴ ἔχων
  choice: без
  rationale: Предложная конструкция естественно передаёт сопутствующее отсутствие требуемой одежды.
- source_word: ἔνδυμα γάμου
  choice: свадебная одежда
  rationale: Сохраняет связь одежды со свадебным пиром, не уточняя без достаточных оснований её вид как одеяние, плащ или особую накидку.
- source_word: ἐφιμώθη
  choice: не мог ничего ответить
  rationale: 'Передаёт контекстуальный результат: человек оказался неспособен ответить на вопрос. Более буквальный пассив и образное значение глагола отмечены в сноске.'
theological_decisions:
- issue: Тон обращения хозяина к гостю
  choice: Внешне учтивое, но укоряющее обращение «Друг»
  alternative: «Товарищ», «приятель» или более резкое обращение
  rationale: Греческое обращение допускает дистанцированный и иронический оттенок, однако само по себе не требует открытой враждебности; «Друг» сохраняет напряжение контекста без конфессионального истолкования.
- issue: Значение пассивной формы ἐφιμώθη
  choice: Контекстуальный результат «не мог ничего ответить» в основном тексте
  alternative: Более формальное «был заставлен замолчать» или образное «ему словно заградили уста»
  rationale: Вопрос предполагает ответ, но человек оказывается безответным. Основной текст передаёт этот смысл естественно, а пассивный и образный характер греческого глагола сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством притчевого повествования. Историческое настоящее в «говорит» сохранено вслед за греческим текстом; синтаксис остаётся ясным и разговорно естественным без стилистического упрощения.
