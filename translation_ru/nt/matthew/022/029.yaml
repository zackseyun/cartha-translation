  text: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/029.yaml
  text: But Jesus answered them[a], “You are mistaken, because you know neither the Scriptures nor the power of God.”
translation:
  language: ru
  text: 'Но Иисус ответил им: «Вы заблуждаетесь[a], потому что не знаете ни Писаний, ни силы Божьей».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вы ошибаетесь»; возможно также: «Вы введены в заблуждение».'
    reason: Лексема Πλανᾶσθε допускает значение пребывания в ошибке и пассивный оттенок введённости в заблуждение.
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Но Иисус ответил им
  rationale: Причастная формула с εἶπεν передаёт ответную реплику; δέ здесь уместно передано мягко-противительным «но». Русское «ответил им» естественно устраняет буквальную избыточность «отвечая, сказал им».
- source_word: Πλανᾶσθε
  choice: Вы заблуждаетесь
  rationale: Форма допускает оттенки пребывания в ошибке, уклонения с верного пути или введённости в заблуждение. «Заблуждаетесь» естественно для современного русского языка и не уточняет без достаточных оснований, внешним ли обманом вызвана ошибка.
- source_word: μὴ εἰδότες
  choice: потому что не знаете
  rationale: Отрицательный причастный оборот по смыслу указывает причину заблуждения; придаточное с «потому что» ясно и естественно выражает эту связь.
- source_word: τὰς γραφὰς
  choice: Писаний
  rationale: Множественное γραφαί в данном иудейском контексте обозначает священные писания. Заглавная буква помогает передать терминологическое употребление.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: ни силы Божьей
  rationale: Парная конструкция «ни... ни...» точно передаёт μὴ... μηδέ. «Сила Божья» — естественное русское соответствие выражению «сила Бога», сохраняющее его богословский вес.
theological_decisions:
- issue: Причина заблуждения саддукеев
  choice: Их заблуждение связано с незнанием как Писаний, так и силы Божьей.
  alternative: 'Передать причастный оборот как отдельное сопутствующее утверждение: «заблуждаетесь, не зная...»'
  rationale: μὴ εἰδότες естественно объясняет основание их ошибки. Перевод с «потому что» сохраняет причинную связь, не добавляя уточнений о характере Божьей силы.
- issue: Оттенок Πλανᾶσθε
  choice: «Вы заблуждаетесь» без указания на конкретного обманщика.
  alternative: «Вы обмануты» или «вас вводят в заблуждение».
  rationale: Греческая форма может пониматься как средняя или пассивная, однако контекст непосредственно подчёркивает ошибочность их позиции, а не источник внешнего обмана. Неопределённость отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным библейским регистром. Синтаксис упрощён до естественной русской ответной формулы; сохранены противопоставление, причинная связь и парная конструкция «ни... ни...».
