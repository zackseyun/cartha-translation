  text: While the Pharisees were gathered together, Jesus asked them,
translation:
  language: ru
  text: 'Когда фарисеи собрались, Иисус спросил их:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνηγμένων
  choice: собрались
  rationale: Генитив абсолютный задаёт обстоятельственный фон. Русское придаточное «когда фарисеи собрались» естественно передаёт предшествующее собранию действие без тяжеловесного «были собраны вместе».
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Частица обозначает мягкий переход в повествовании; в современном русском он естественно передаётся самой сменой эпизода, без обязательного «же» или «тогда».
- source_word: τῶν Φαρισαίων
  choice: фарисеи
  rationale: Общепринятое современное название религиозной группы; именительный падеж обусловлен преобразованием генитива абсолютного в придаточное предложение.
- source_word: ἐπηρώτησεν
  choice: спросил
  rationale: Нейтрально и естественно вводит вопрос Иисуса, не добавляя оттенка враждебного допроса.
- source_word: αὐτοὺς
  choice: их
  rationale: Прямое дополнение, отсылающее к только что упомянутым фарисеям.
- source_word: ὁ Ἰησοῦς
  choice: Иисус
  rationale: Имя подлежащего; греческий артикль перед личным именем в русском не передаётся.
