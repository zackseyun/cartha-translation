- from: 'А утром говорите: «Сегодня будет ненастье, потому что небо багровое и хмурое». Вид неба[a] вы умеете различать, а знамения времён различить не можете.[b][c]'
  to: 'А утром[c]: «Сегодня будет ненастье, потому что небо красное и хмурое». Вид неба[a] вы умеете различать, а знамения времён различить не можете.[b]'
