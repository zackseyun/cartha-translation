  text: καὶ πρωΐ· Σήμερον χειμών, πυρράζει γὰρ στυγνάζων ὁ οὐρανός. ⸀τὸ μὲν πρόσωπον τοῦ οὐρανοῦ γινώσκετε διακρίνειν, τὰ δὲ σημεῖα τῶν καιρῶν οὐ δύνασθε.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/003.yaml
  text: And in the morning[a], ‘Today, stormy weather, for the sky is red and overcast.’ You know how to discern the appearance of the sky[b], but you are not able to discern the signs of the times.
translation:
  language: ru
  text: 'А утром[c]: «Сегодня будет ненастье, потому что небо красное и хмурое». Вид неба[a] вы умеете различать, а знамения времён различить не можете.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лицо неба».'
    reason: lexical_alternative
  - marker: b
    text: «Знамения времён» — признаки значимости настоящего времени; выражение может включать мессианское значение дел Иисуса, но сам текст не ограничивает его этим.
    reason: alternative_reading
  - marker: c
    text: Слова второй половины стиха 2 и всего стиха 3 отсутствуют в некоторых ранних и значимых рукописях.
    reason: textual_variant
lexical_decisions:
- source_word: πρωΐ
  choice: утром
  rationale: Наречное обозначение времени; краткая и естественная передача, сохраняющая противопоставление предшествующему высказыванию о вечернем небе.
- source_word: χειμών
  choice: ненастье
  rationale: В данном контексте речь не о зиме как времени года, а о плохой, бурной погоде. «Ненастье» естественно для прогноза погоды и не уточняет сверх текста вид бури.
- source_word: πυρράζει
  choice: багровое
  rationale: Глагол обозначает красный, огненно-красный вид неба. «Багровое» звучит естественно применительно к небу и передаёт более насыщенный оттенок, не вводя образ буквального огня.
- source_word: στυγνάζων
  choice: хмурое
  rationale: Причастие описывает мрачный, тёмный или угрожающий вид неба. «Хмурое» сохраняет образ и метеорологический смысл.
- source_word: πρόσωπον τοῦ οὐρανοῦ
  choice: вид неба
  rationale: Буквально «лицо неба»; в контексте имеется в виду его видимая внешность. «Вид неба» ясно и естественно по-русски.
- source_word: γινώσκετε διακρίνειν
  choice: умеете различать
  rationale: Конструкция выражает приобретённую способность распознавать и оценивать. «Умеете различать» сохраняет и значение умения, и контраст с последующей неспособностью.
- source_word: σημεῖα
  choice: знамения
  rationale: Слово может обозначать признаки, свидетельства или чудесные знаки. «Знамения» сохраняет характерную для евангельского контекста религиозную и откровенную смысловую широту.
- source_word: καιρῶν
  choice: времён
  rationale: Здесь καιρός обозначает значимые периоды или моменты, а не погодные сезоны. Множественное «времён» сохраняет форму и богословскую открытость греческого выражения.
- source_word: οὐ δύνασθε
  choice: различить не можете
  rationale: Передаёт прямо выраженную неспособность; повтор глагола «различать» делает риторическое противопоставление ясным.
theological_decisions:
- issue: Смысл выражения «знамения времён»
  choice: Сохранить широкое выражение, не сводя его только к эсхатологическим знамениям.
  alternative: «знамения нынешнего времени» или «мессианские знамения века»
  rationale: Упрёк касается неспособности распознать духовное значение происходящего, включая дела Иисуса, однако греческая формулировка допускает также более широкое мессианское и эсхатологическое звучание.
- issue: Адресаты и подразумеваемый глагол во второй части
  choice: Сохранить прямое обращение во множественном числе и повторить «различить».
  alternative: 'Оставить глагол подразумеваемым: «а знамения времён — не можете»'
  rationale: В греческом инфинитив во второй части подразумевается из первой. Его повтор по-русски необходим для ясности и не меняет смысла.
translation_notes:
  register: Современный литературный русский язык с dignified библейской выразительностью. «Ненастье», «багровое и хмурое» передают народно понятный прогноз погоды без архаизации; «знамения времён» сохраняет богословскую насыщенность и неоднозначность исходного выражения.
