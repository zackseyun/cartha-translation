id: MAT.16.18
reference: Matthew 16:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/018.yaml
  text: And I also say to you that you are Peter[a], and on this rock I will build my church[b], and the gates of Hades will not prevail against it.
translation:
  language: ru
  text: 'Я же говорю тебе: ты — Пётр, и на этой скале[a] Я построю Мою церковь, и врата мира мёртвых[b] не одолеют её.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь игра слов: «Пётр» (Петрос) и «скала» (петра). Под «этой скалой» можно понимать самого Петра, исповедание Петра или Петра как исповедника и представителя апостолов.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «Аида», то есть мира мёртвых. Традиционный перевод: «ада».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ δέ
  choice: Я же
  rationale: Сочетание κἀγώ и δέ подчёркивает ответное высказывание Иисуса и допускает лёгкое сопоставление с только что сказанным Петром. «Я же» естественно передаёт это по-русски, не усиливая противопоставление.
- source_word: σοι λέγω
  choice: говорю тебе
  rationale: Прямое и литературно естественное соответствие λέγω с сохранением адресованности высказывания.
- source_word: Πέτρος
  choice: Пётр
  rationale: Использована традиционная русская форма имени; связь с последующим πέτρα поясняется в сноске.
- source_word: ἐπὶ ταύτῃ τῇ πέτρᾳ
  choice: на этой скале
  rationale: Передаёт пространственную метафору основания и указательное значение ταύτῃ, не определяя спорный референт выражения.
- source_word: οἰκοδομήσω
  choice: построю
  rationale: Сохраняет буквальную строительную метафору глагола οἰκοδομέω.
- source_word: μου τὴν ἐκκλησίαν
  choice: Мою церковь
  rationale: «Церковь» — понятное и укоренившееся русское обозначение принадлежащего Иисусу сообщества; притяжательное местоимение сохраняет μου.
- source_word: πύλαι ᾅδου
  choice: врата мира мёртвых
  rationale: ᾅδης обозначает мир или обитель умерших, а не обязательно место окончательного наказания. Такой перевод точнее традиционного «врата ада» и сохраняет образ врат.
- source_word: οὐ κατισχύσουσιν αὐτῆς
  choice: не одолеют её
  rationale: «Одолеть» естественно передаёт значение превосходства и победы, выраженное κατισχύω; местоимение относится к церкви.
theological_decisions:
- issue: К чему относится выражение «эта скала» (ταύτῃ τῇ πέτρᾳ)
  choice: 'Референт не уточняется: «на этой скале»'
  alternative: Пётр лично; исповедание Петра; Пётр как исповедник и представитель апостолов
  rationale: Греческий текст создаёт игру слов Πέτρος — πέτρα, но сам перевод не должен разрешать межтрадиционный спор. Формулировка сохраняет исходную неоднозначность и богословское напряжение.
- issue: Значение ᾅδης
  choice: мир мёртвых
  alternative: Аид; ад
  rationale: Этот термин обозначает область умерших и не тождествен геенне или окончательному наказанию. Ясный русский перевод предотвращает привнесение более поздних ассоциаций слова «ад».
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены строительная метафора и образ врат; спорные богословские вопросы не разрешены внутри перевода. Заглавные буквы в местоимениях «Я» и «Мою» следуют принятой русской благоговейной издательской норме.
