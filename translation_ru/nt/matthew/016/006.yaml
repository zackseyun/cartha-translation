  source_fidelity: 'Текст точно передаёт греческий оригинал: δέ передано ненавязчивым «же», εἶπεν αὐτοῖς — «сказал им», а два предостерегающих повеления Ὁρᾶτε καὶ προσέχετε сохранены как два глагола — «Смотрите, берегитесь». Родительный падеж в «берегитесь закваски» естественно выражает ἀπό. Образ ζύμη сохранён без преждевременного истолкования; названия групп переданы нормативно.'
