id: MAT.16.6
reference: Matthew 16:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ὁρᾶτε καὶ προσέχετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/006.yaml
  text: But Jesus said to them[a], “Watch out and beware of the leaven of the Pharisees and Sadducees.”
translation:
  language: ru
  text: 'Иисус же сказал им: «Смотрите, берегитесь закваски фарисеев и саддукеев».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: же
  rationale: Передаёт мягкий переход и оттенок противопоставления предшествующему контексту, не усиливая связь до резкого «но».
- source_word: εἶπεν αὐτοῖς
  choice: сказал им
  rationale: Прямое и естественное соответствие греческому выражению.
- source_word: Ὁρᾶτε
  choice: Смотрите
  rationale: В повелительной форме здесь служит предостережением; «смотрите» естественно вводит предупреждение и сохраняет отдельный глагол.
- source_word: προσέχετε ἀπὸ
  choice: берегитесь
  rationale: Русский глагол естественно выражает усиленное предостережение и нормативно сочетается с родительным падежом.
- source_word: ζύμης
  choice: закваски
  rationale: Сохраняет образ исходного текста и его библейские ассоциации, не подменяя метафору последующим объяснением.
- source_word: Φαρισαίων
  choice: фарисеев
  rationale: Устоявшееся русское название религиозной группы.
- source_word: Σαδδουκαίων
  choice: саддукеев
  rationale: Устоявшееся русское название религиозной группы.
theological_decisions:
- issue: Метафорический смысл ζύμη
  choice: Сохранить «закваска» без пояснения в основном тексте.
  alternative: Учение или влияние фарисеев и саддукеев.
  rationale: В данном стихе Иисус употребляет образ, смысл которого раскрывается позднее; преждевременная расшифровка устранила бы литературную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Двойное предупреждение Ὁρᾶτε καὶ προσέχετε сохранено как «Смотрите, берегитесь»; запятая естественно передаёт тесную связь двух повелений.
