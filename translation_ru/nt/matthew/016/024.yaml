  text: Τότε ὁ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Εἴ τις θέλει ὀπίσω μου ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/024.yaml
  text: Then Jesus said to his disciples[a], “If anyone wants to come after me, let him deny himself and take up his cross and follow me.”
translation:
  language: ru
  text: 'Тогда Иисус сказал Своим ученикам: «Если кто хочет идти за Мной, пусть отречётся от себя, возьмёт свой крест и следует за Мной».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественный повествовательный маркер последовательности событий, точно передающий греческое наречие.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: Своим ученикам
  rationale: «Ученики» — точный и устоявшийся эквивалент μαθηταί в евангельском контексте; возвратное «Своим» естественно соотносит их с подлежащим «Иисус».
- source_word: Εἴ τις θέλει
  choice: Если кто хочет
  rationale: Сохраняет условность, неопределённость и всеобщую применимость греческого выражения без искусственного обозначения пола.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: идти за Мной
  rationale: Передаёт пространственную метафору следования за учителем и не сводит оборот полностью к последующему ἀκολουθείτω; «идти» по-русски естественнее буквального «прийти позади».
- source_word: ἀπαρνησάσθω ἑαυτὸν
  choice: пусть отречётся от себя
  rationale: Сохраняет третье лицо повелительного наклонения и решительный характер аориста; «отречься от себя» — точное, традиционное и понятное выражение.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: возьмёт свой крест
  rationale: «Взять крест» естественно передаёт поднятие его для несения; «свой» ясно сохраняет индивидуализирующее значение αὐτοῦ.
- source_word: ἀκολουθείτω μοι
  choice: следует за Мной
  rationale: Настоящее повелительное наклонение выражает продолжающееся следование; русская конструкция с «пусть» допускает однородные формы «отречётся, возьмёт и следует», причём настоящее время у последнего глагола сохраняет длительный оттенок.
theological_decisions:
- issue: Всеобщий адресат при грамматически мужском единственном числе
  choice: «Если кто хочет… пусть отречётся от себя, возьмёт свой крест…»
  alternative: «Если кто-либо хочет… он должен отречься от самого себя…»
  rationale: Русское «кто» грамматически требует единственного числа мужского рода, но употребляется обобщённо и не ограничивает призыв мужчинами; отдельная гендерная сноска не нужна.
- issue: Смысл самоотречения
  choice: Сохранено открытое выражение «отречётся от себя»
  alternative: Поясняющие варианты вроде «откажется от собственных желаний» или «перестанет жить для себя»
  rationale: Греческий текст не уточняет объём или практическую форму самоотречения; перевод не должен сужать богословское напряжение толкованием.
- issue: Образ личного креста
  choice: «возьмёт свой крест»
  alternative: Разъяснительные варианты «примет свои страдания» или «будет готов умереть»
  rationale: Сохранён конкретный и богословски насыщенный образ σταυρός без сведения его к одному аспекту — страданию, смерти или жизненным трудностям.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельской речи. Прописные буквы в местоимениях «Своим», «Мной» соответствуют распространённой русской библейской издательской норме. Синтаксис краткий и доступный; подлинные метафоры самоотречения, креста и следования сохранены без поясняющего расширения.
