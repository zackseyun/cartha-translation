  text: Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ. καὶ καταλιπὼν αὐτοὺς ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/004.yaml
  text: An evil and adulterous generation seeks a sign[a], and no sign will be given to it except the sign of Jonah. And leaving them[b], he went away.
translation:
  language: ru
  text: Злое и прелюбодейное поколение[a] ищет знамения, и знамения ему не будет дано, кроме знамения Ионы[b]. И, оставив их, Он ушёл.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неверное поколение». Греческое слово буквально связано с прелюбодеянием и, вероятно, перекликается с пророческим образом неверности Богу.'
    reason: lexical_alternative
  - marker: b
    text: '«Знамение Ионы» поясняется в Мф. 12:39–40: как Иона был три дня и три ночи в чреве морского чудовища, так Сын Человеческий будет три дня и три ночи в сердце земли.'
    reason: cross_reference
lexical_decisions:
- source_word: Γενεὰ
  choice: поколение
  rationale: Передаёт обычное для Евангелия от Матфея значение γενεά — современное Иисусу поколение или совокупность людей — без замены более широким толкованием «народ».
- source_word: πονηρὰ
  choice: злое
  rationale: Прямо и естественно передаёт нравственную оценку πονηρά; вариант «лукавое» в современном русском мог бы неоправданно сузить смысл до хитрости или обмана.
- source_word: μοιχαλὶς
  choice: прелюбодейное
  rationale: Сохраняет резкую метафору греческого текста и возможный отзвук пророческой речи о неверности Богу, не подменяя образ толкованием.
- source_word: σημεῖον
  choice: знамение
  rationale: Передаёт знак, служащий подтверждением, и сохраняет традиционно понятный библейский термин, не добавляя отсутствующее в греческом тексте определение «чудесное».
- source_word: ἐπιζητεῖ
  choice: ищет
  rationale: Прямо передаёт настойчивый поиск; более сильное «требует» возможно по контексту, но не обязательно заложено в самом глаголе.
- source_word: οὐ δοθήσεται αὐτῇ
  choice: ему не будет дано
  rationale: Естественная русская форма будущего страдательного залога; местоимение согласовано с существительным «поколение» среднего рода.
- source_word: εἰ μὴ
  choice: кроме
  rationale: Ясно обозначает единственное исключение из предшествующего отрицания.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: знамение Ионы
  rationale: Сохраняет краткость и неоднозначность греческого родительного оборота, не включая его истолкование в основной текст.
- source_word: καταλιπὼν αὐτοὺς
  choice: оставив их
  rationale: Естественно передаёт предшествующее основному действию аористное причастие.
- source_word: ἀπῆλθεν
  choice: Он ушёл
  rationale: Современная и точная передача удаления Иисуса от собеседников; прописная буква помогает ясно обозначить подразумеваемого субъекта в отдельном стихе.
theological_decisions:
- issue: Смысл выражения «прелюбодейное поколение»
  choice: Сохранена метафора «прелюбодейное».
  alternative: 'Передать толковательно: «неверное поколение».'
  rationale: Выражение, вероятно, отсылает к пророческому образу неверности Богу, однако сам греческий текст использует лексику прелюбодеяния. Сохранение образа не сводит его заранее лишь к одному виду неверности.
- issue: Смысл «знамения Ионы»
  choice: Фраза сохранена без поясняющего дополнения в основном тексте.
  alternative: Прямо назвать смерть, пребывание во гробе и воскресение Иисуса.
  rationale: В Мф. 12:39–40 этот образ получает пояснение, но здесь формулировка остаётся краткой. Перевод не должен вносить развёрнутое толкование в слова данного стиха.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. «Поколение» предпочтено архаизирующему «род», а «злое» — потенциально сужающему смысл слову «лукавое». Синтаксис сохраняет лаконичность и резкий переход к уходу Иисуса.
