  yaml_path: translation/nt/matthew/016/025.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will find it.
translation:
  language: ru
  text: Ведь кто хочет спасти свою жизнь, тот потеряет её[a], а кто потеряет свою жизнь ради Меня, тот найдёт её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или во всём стихе: «душу»; греческое слово ψυχή в зависимости от контекста может означать жизнь, душу или самого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἐὰν / ὃς δ’ ἂν
  choice: Ведь кто... а кто...
  rationale: Неопределённо-относительная конструкция передана естественным русским «кто... тот». γάρ связывает изречение с предыдущим контекстом и передано как «ведь», а δέ обозначает контраст и передано союзом «а».
- source_word: θέλῃ
  choice: хочет
  rationale: Передаёт волю или желание простым и современным русским словом.
- source_word: ψυχὴν
  choice: жизнь
  rationale: В контексте ученичества и возможной смерти речь прежде всего о жизни человека; это значение также сохраняет парадокс «спасти — потерять — обрести». Более традиционное «душа» отмечено в сноске, поскольку греческое слово имеет более широкий диапазон значений.
- source_word: σῶσαι
  choice: спасти
  rationale: Сохраняет прямое значение глагола и выразительное противопоставление потере.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: потеряет / потеряет
  rationale: В данном контексте глагол означает утрату жизни. Русская конструкция «кто... тот» естественно допускает форму будущего времени в обеих частях общего условия.
- source_word: ἕνεκεν ἐμοῦ
  choice: ради Меня
  rationale: Кратко и естественно выражает причину и личную преданность Иисусу; прописная буква соответствует принятому русскому библейскому оформлению речи Христа.
- source_word: εὑρήσει
  choice: обретёт
  rationale: «Обретёт» естественно сочетается с «жизнью» и передаёт εὑρίσκω как нахождение того, что было потеряно, не вводя идеи заслуги или приобретения.
- source_word: αὐτοῦ / αὐτήν
  choice: свою / её
  rationale: Возвратное «свою» естественно соотносит жизнь с субъектом придаточной части, а «её» возвращает к существительному «жизнь».
theological_decisions:
- issue: Передача ψυχή в парадоксе об ученичестве
  choice: жизнь
  alternative: душа; сам человек
  rationale: Глаголы «спасти», «потерять» и «обрести» в контексте следования за Иисусом и угрозы смерти указывают прежде всего на жизнь, однако ψυχή может также обозначать душу или самого человека. Сноска сохраняет эту смысловую широту и не сводит выражение только к нематериальной душе.
translation_notes:
  register: Современный литературный русский язык с ясной симметрией двух частей изречения. Формула «кто... тот» сохраняет общий, применимый к каждому характер высказывания; «обретёт» придаёт фразе достоинство без архаизации.
