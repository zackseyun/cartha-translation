  text: οὔπω νοεῖτε, οὐδὲ μνημονεύετε τοὺς πέντε ἄρτους τῶν πεντακισχιλίων καὶ πόσους κοφίνους ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/009.yaml
  text: Do you still not understand[a], nor do you remember the five loaves for the five thousand[b], and how many baskets you gathered?
translation:
  language: ru
  text: Неужели вы всё ещё не понимаете и не помните о пяти хлебах для пяти тысяч и о том, сколько корзин вы собрали?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὔπω
  choice: до сих пор не
  rationale: 'В риторическом вопросе естественно передаёт временной оттенок οὔπω и усиливает упрёк: понимания всё ещё нет.'
- source_word: νοεῖτε
  choice: понимаете
  rationale: В контексте речь идёт об осмыслении значения прежнего чуда, а не о простом восприятии.
- source_word: οὐδὲ
  choice: и не
  rationale: Естественно соединяет в русском языке два однородных глагола под общим отрицанием.
- source_word: μνημονεύετε
  choice: помните
  rationale: Прямо обозначает воспоминание о предшествующем насыщении множества людей.
- source_word: τοὺς πέντε ἄρτους
  choice: о пяти хлебах
  rationale: «Хлебы» — точное и узнаваемое обозначение отдельных хлебов в повествовании; предлог «о» обусловлен русским управлением глагола «помнить» в данной конструкции.
- source_word: τῶν πεντακισχιλίων
  choice: для пяти тысяч
  rationale: 'Контекстуально раскрывает отношение родительного падежа: пять хлебов были использованы при насыщении пяти тысяч.'
- source_word: πόσους κοφίνους
  choice: сколько корзин
  rationale: Сохраняет конкретный образ и вопрос о числе собранных корзин.
- source_word: ἐλάβετε
  choice: собрали
  rationale: В контексте остатков пищи λαμβάνω обозначает их сбор в корзины; «собрали» ясно и естественно по-русски.
