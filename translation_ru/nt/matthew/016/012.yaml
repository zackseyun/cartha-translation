base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/012.yaml
  text: Then they understood that he had not said to beware of the leaven of bread[a], but of the teaching of the Pharisees and Sadducees.
translation:
  language: ru
  text: Тогда они поняли, что Он сказал им остерегаться не закваски хлеба[a], а учения фарисеев и саддукеев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «закваски хлебов». В греческом тексте здесь стоит существительное во множественном числе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественно обозначает момент, когда ученики наконец поняли смысл сказанного.
- source_word: συνῆκαν
  choice: они поняли
  rationale: Передаёт наступившее понимание без дополнительного истолкования.
- source_word: οὐκ εἶπεν προσέχειν
  choice: Он говорил им остерегаться не
  rationale: В контексте εἶπεν относится к смыслу прежних слов Иисуса; «остерегаться» естественно передаёт предупредительное значение προσέχειν. Местоимение «им» проясняет подразумеваемого адресата, а русское несовершенное «говорил» идиоматично в конструкции косвенного осмысления.
- source_word: ἀπὸ τῆς ζύμης
  choice: закваски
  rationale: «Закваска» сохраняет буквальный образ и его библейское метафорическое звучание.
- source_word: τῶν ἄρτων
  choice: хлебов
  rationale: Сохраняет грамматическое множественное число греческого текста; альтернативное понимание поясняется в сноске.
- source_word: ἀλλὰ ἀπὸ τῆς διδαχῆς
  choice: а учения
  rationale: «А» выражает противопоставление, а «учение» современно и точно передаёт διδαχή без излишней конфессиональной окраски.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: фарисеев и саддукеев
  rationale: Устоявшиеся русские наименования этих религиозных групп.
theological_decisions:
- issue: Метафорический смысл закваски
  choice: Сохранить образ «закваски» и данное самим стихом пояснение — «учения фарисеев и саддукеев».
  alternative: Раскрыть образ как «лицемерие», «заблуждение» или «испорченное учение».
  rationale: Сам стих отождествляет закваску с учением, но не даёт здесь дальнейшей нравственной характеристики; перевод не должен вносить её из параллельных мест.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная, с сохранением библейского образа. Прописное «Он» использовано как традиционная русская типографическая форма уважительного указания на Иисуса, не добавляющая смыслового истолкования.
