  yaml_path: translation/nt/matthew/016/010.yaml
  text: Or the seven loaves for the four thousand[a], and how many large baskets you picked up?
translation:
  language: ru
  text: Или вы не помните семи хлебов для четырёх тысяч и того, сколько больших корзин вы собрали?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И не помните семи хлебов для четырёх тысяч и того, сколько больших корзин вы собрали?»'
    reason: Союз οὐδὲ продолжает отрицательный вопрос предыдущего стиха; в зависимости от способа передачи связи он может быть переведён как «или» или «и не».
lexical_decisions:
- source_word: οὐδὲ
  choice: Или
  rationale: Союз продолжает ряд риторических вопросов из предыдущего стиха. «Или» естественно передаёт это продолжение по-русски; буквальное «ни» при отдельном чтении стиха звучало бы синтаксически незавершённо.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: о семи хлебах
  rationale: В контексте подразумевается глагол «помните» из предыдущего стиха, который в русском требует предложной конструкции «о семи хлебах».
- source_word: τῶν τετρακισχιλίων
  choice: для четырёх тысяч
  rationale: Родительный падеж обозначает связь хлебов с насыщением четырёх тысяч; конструкция «для четырёх тысяч» ясно и естественно передаёт эту связь.
- source_word: πόσας σπυρίδας
  choice: сколько больших корзин
  rationale: σπυρίς обозначает вместительную корзину и отличается от κόφινος в рассказе о другом насыщении; определение «больших» сохраняет это лексическое различие.
- source_word: ἐλάβετε
  choice: вы собрали
  rationale: В данном контексте речь идёт о сборе оставшихся кусков; «собрали» точно и естественно передаёт действие.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык. Синтаксически стих сохраняет связь с предыдущим вопросом, но остаётся понятным при отдельном чтении; повтор «о том» делает зависимость двух дополнений от подразумеваемого «помните» ясной.
