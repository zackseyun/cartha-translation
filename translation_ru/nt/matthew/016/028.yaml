id: MAT.16.28
reference: Matthew 16:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι εἰσίν τινες ⸂τῶν ὧδε ἑστώτων⸃ οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν τῇ βασιλείᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/028.yaml
  text: Truly I tell you[c][b][a], there are some standing here who will certainly not taste death until they see the Son of Man coming in his kingdom.
translation:
  language: ru
  text: 'Истинно говорю вам: некоторые из стоящих здесь ни в коем случае не вкусят смерти[a], пока не увидят Сына Человеческого, приходящего в Своём Царстве[c][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «точно не вкусят смерти»; в греческом употреблено усиленное отрицание.'
    reason: lexical_alternative
  - marker: b
    text: Слова о Сыне Человеческом, приходящем в Своём Царстве, могут относиться к преображению, воскресению и возвышению, суду над Иерусалимом или окончательному пришествию; сам текст не уточняет, какое именно событие имеется в виду.
    reason: alternative_reading
  - marker: c
    text: 'Или: «в Своём царствовании» или «в Своей царской власти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Истинно
  rationale: Передаёт торжественное заверение, вводящее авторитетное высказывание, естественно и достойно для современного русского языка.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Сохраняет настоящее время, прямое обращение и характерную формулу речи.
- source_word: ὅτι
  choice: передано двоеточием
  rationale: Союз вводит содержание высказывания; в русском после «говорю вам» это естественно выражается двоеточием.
- source_word: εἰσίν τινες τῶν ὧδε ἑστώτων
  choice: некоторые из стоящих здесь
  rationale: 'Ясно сохраняет партитивный смысл: речь идёт о части присутствующих.'
- source_word: οὐ μὴ γεύσωνται
  choice: ни в коем случае не вкусят
  rationale: Конструкция οὐ μή выражает усиленное отрицание; русский оборот передаёт его категоричность.
- source_word: γεύσωνται θανάτου
  choice: вкусят смерти
  rationale: Сохранена яркая и понятная библейская метафора, а не сведена к простому «умрут».
- source_word: ἕως ἂν ἴδωσιν
  choice: пока не увидят
  rationale: Естественно передаёт будущую временную границу, выраженную конструкцией ἕως ἄν с сослагательным наклонением.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Сына Человеческого
  rationale: Сохранено устойчивое самообозначение и титул с его библейскими и апокалиптическими ассоциациями.
- source_word: ἐρχόμενον
  choice: приходящего
  rationale: Прямо передаёт причастие, не добавляя отсутствующих в тексте идей силы, славы или суда.
- source_word: ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: в Своём Царстве
  rationale: «Царство» сохраняет конкретный традиционный образ, тогда как греческое βασιλεία допускает также смысл царствования или царской власти.
theological_decisions:
- issue: К какому событию относится пришествие Сына Человеческого в Его Царстве
  choice: Фраза переведена прямо, без отождествления с конкретным событием.
  alternative: Преображение; воскресение и возвышение; Пятидесятница; суд над Иерусалимом; окончательное пришествие.
  rationale: Греческий текст сам не уточняет событие, поэтому перевод сохраняет толковательную открытость и богословское напряжение.
- issue: Смысл βασιλεία
  choice: Царство
  alternative: царствование; царская власть
  rationale: Все эти значения лексически возможны, но «Царство» лучше сохраняет образность исходной фразы и не сужает её до отвлечённого понятия власти.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Сохранены метафора «вкусить смерть», титул «Сын Человеческий» и неоднозначность выражения о Царстве.
