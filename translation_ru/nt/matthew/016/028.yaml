  source_fidelity: 'Перевод точно передаёт все основные элементы греческого текста: торжественную формулу «Истинно говорю вам», партитивное «некоторые из стоящих здесь», усиленное οὐ μή, сохранённую метафору «вкусят смерти», будущую границу «пока не увидят», титул «Сын Человеческий» и причастный оборот «приходящего в Своём Царстве». Не добавлены отсутствующие в источнике признаки или толкования.'
  naturalness: Текст звучит как современный литературный русский с уместной библейской торжественностью. Формулировки «некоторые из стоящих здесь» и «ни в коем случае не вкусят смерти» несколько книжные, но ясные, естественные в данном регистре и оправданные стремлением сохранить структуру и эмфазу оригинала.
  terminology: «Сын Человеческий» и «Царство» переданы последовательно и пригодно для данного контекста. Написание «Своём Царстве» соответствует распространённой русской благоговейной орфографической конвенции и не меняет смысла. Сноски корректно отражают усиленное отрицание, возможный смысл βασιλεία и неразрешённость референта выражения о пришествии.
