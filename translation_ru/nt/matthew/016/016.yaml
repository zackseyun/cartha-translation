  text: ἀποκριθεὶς δὲ Σίμων Πέτρος εἶπεν· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ τοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/016.yaml
  text: Simon Peter answered[a], “You are the Messiah, the Son of the living God.”
translation:
  language: ru
  text: 'Симон Пётр ответил: «Ты — Мессия[a], Сын живого Бога».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческое Χριστός — передача еврейского титула «Мессия» («Помазанник»).'
    reason: Альтернативная традиционная передача мессианского титула.
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: ответил
  rationale: Причастие ἀποκριθείς вместе с εἶπεν образует обычную формулу введения ответной реплики. По-русски естественно передать её одним глаголом «ответил», без буквального и тяжеловесного «ответив, сказал».
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Частица обозначает слабый переход или продолжение повествования; в русском ход речи уже естественно передаётся конструкцией «Симон Пётр ответил».
- source_word: Σίμων Πέτρος
  choice: Симон Пётр
  rationale: Имена переданы в принятой русской библейской форме.
- source_word: Σὺ
  choice: Ты
  rationale: Явно выраженное греческое местоимение несёт смысловое ударение; русская конструкция «Ты — …» сохраняет этот акцент.
- source_word: ὁ χριστός
  choice: Мессия
  rationale: Здесь Χριστός употреблено как мессианский титул, а не как часть имени. «Мессия» ясно передаёт титульный смысл и иудейский контекст.
- source_word: ὁ υἱός
  choice: Сын
  rationale: Определённая форма указывает на конкретный титул; прописная буква уместна в русском религиозном тексте и не добавляет пояснений сверх исходной формулировки.
- source_word: τοῦ θεοῦ τοῦ ζῶντος
  choice: живого Бога
  rationale: Атрибутивное причастие ζῶντος естественно передаётся прилагательным «живого»; порядок слов соответствует нормальному русскому выражению и сохраняет качественное противопоставление живого Бога без его разъяснения.
theological_decisions:
- issue: Передача Χριστός как титула или как привычного имени
  choice: Мессия
  alternative: Христос
  rationale: В исповедании Петра слово обозначает обещанного Помазанника и функционирует как титул. Основной текст передаёт этот смысл словом «Мессия», а традиционное «Христос» сохранено в сноске как допустимый вариант.
- issue: Смысл выражения «Сын живого Бога»
  choice: Сын живого Бога
  alternative: не разворачивать выражение в позднейшие догматические формулы
  rationale: Формулировка сохраняет исповедальный и титульный характер греческого текста, не уточняя сверх него природу сыновства и тем самым не снимая присущую тексту богословскую ёмкость.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Тире после «Ты» естественно подчёркивает именную часть сказуемого и передаёт акцент явного греческого местоимения. Формулировка краткая, ясная и сохраняет торжественный характер исповедания.
