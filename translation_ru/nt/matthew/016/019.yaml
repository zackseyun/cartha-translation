  text: ⸀δώσω σοι τὰς ⸀κλεῖδας τῆς βασιλείας τῶν οὐρανῶν, καὶ ὃ ⸀ἐὰν δήσῃς ἐπὶ τῆς γῆς ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς, καὶ ὃ ⸁ἐὰν λύσῃς ἐπὶ τῆς γῆς ἔσται λελυμένον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/019.yaml
  text: I will give you the keys of the kingdom of heaven[a], and whatever you bind on earth will have been bound in heaven[c][b], and whatever you loose on earth will have been loosed in heaven.
translation:
  language: ru
  text: Я дам тебе ключи Царства Небесного[a]. Всё, что ты свяжешь на земле, будет уже связано на небесах[c][b], и всё, что ты развяжешь на земле, будет уже развязано на небесах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или буквально: «ключи Царства небес». Матфей часто употребляет это выражение.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно переводят: «будет связано… будет развязано». Греческая конструкция точнее допускает понимание: «будет уже связано… будет уже развязано».'
    reason: alternative_reading
  - marker: c
    text: Слова «связать» и «развязать» могут означать также запретить и разрешить либо возложить и снять обязательство; в переводе сохранён греческий образ.
    reason: cultural_note
lexical_decisions:
- source_word: δώσω σοι
  choice: Я дам тебе
  rationale: Будущее время и дательный адресата естественно передаются по-русски прямым обещанием «дам тебе».
- source_word: τὰς κλεῖδας
  choice: ключи
  rationale: Сохранён образ ключей без истолковывающего добавления об объёме или виде власти.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: Царства Небесного
  rationale: Это естественное и узнаваемое русское соответствие характерному для Матфея выражению; буквальная множественность слова «небеса» отмечена в сноске.
- source_word: ὃ ἐὰν
  choice: всё, что
  rationale: Естественно передаёт неопределённо-относительную конструкцию в обеих частях высказывания.
- source_word: δήσῃς
  choice: свяжешь
  rationale: Сохранён греческий образ связывания и его смысловая открытость, без замены на однозначное «запретишь».
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Обычное русское выражение, точно сохраняющее противопоставление земле и небесам.
- source_word: ἔσται δεδεμένον
  choice: будет уже связано
  rationale: Сочетание будущей формы εἰμί с перфектным страдательным причастием обозначает будущее состояние как результат совершившегося действия; «уже» помогает выразить эту предшествующую завершённость по-русски.
- source_word: λύσῃς
  choice: развяжешь
  rationale: «Развяжешь» сохраняет предметную метафору и симметрию со словом «свяжешь»; более истолковывающие значения отмечены в сноске.
- source_word: ἔσται λελυμένον
  choice: будет уже развязано
  rationale: Передано будущее результирующее состояние, выраженное будущей связкой и перфектным страдательным причастием.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: на небесах
  rationale: Естественно передаёт греческое множественное число и устойчивое русское обозначение небесной сферы.
theological_decisions:
- issue: Временной и видовой смысл формулы о связывании и развязывании
  choice: будет уже связано / будет уже развязано
  alternative: будет связано / будет развязано
  rationale: Греческая конструкция ἔσται с перфектным страдательным причастием допускает и поддерживает смысл состояния, уже достигнутого к рассматриваемому моменту. Перевод сохраняет эту грамматическую особенность, не утверждая сверх текста конкретной модели соотношения земного решения и небесной воли.
- issue: Смысл ключей Царства Небесного
  choice: Сохранить образ «ключи» без пояснения в основном тексте
  alternative: власть допускать и исключать; полномочия управителя
  rationale: Образ подразумевает полномочия, однако сам стих не раскрывает их в отвлечённых терминах. Буквенный образ позволяет избежать привнесения определённой церковной системы.
- issue: Смысл пары «связать — развязать»
  choice: Сохранить метафорическую пару
  alternative: запретить — разрешить; возложить — снять обязательство
  rationale: В контексте эти слова могут иметь нормативно-правовой оттенок, но перевод не должен сводить богатую и неоднозначную метафору к одному толкованию.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Обращение «тебе/ты» сохраняет единственное число греческого текста. Повтор «всё, что» и параллельное построение двух частей воспроизводят риторическую симметрию оригинала; метафоры не заменены конфессионально окрашенным толкованием.
