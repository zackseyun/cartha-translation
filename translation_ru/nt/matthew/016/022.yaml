  text: καὶ προσλαβόμενος αὐτὸν ὁ Πέτρος ἤρξατο ἐπιτιμᾶν αὐτῷ λέγων· Ἵλεώς σοι, κύριε· οὐ μὴ ἔσται σοι τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/022.yaml
  text: And Peter took him aside and began to rebuke him[a], saying, “Far be it from you, Lord; this will certainly not happen to you.”
translation:
  language: ru
  text: 'Пётр отвёл Его в сторону и стал упрекать Его[a], говоря: «Да минует Тебя это, Господи! Этого с Тобой никогда не случится».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стал строго выговаривать Ему». Выражение «Да минует Тебя это» передаёт краткую идиоматическую греческую формулу; также возможно: «Да будет милостиво к Тебе, Господи!» или «Боже упаси, Господи!»'
    reason: Сохраняет силу ἐπιτιμᾶν и неоднозначность эллиптического Ἵλεώς σοι, включая соответствующие английской аудиторской записи альтернативы.
lexical_decisions:
- source_word: προσλαβόμενος
  choice: отвёл Его в сторону
  rationale: Средний залог и контекст передают личное, вероятно отдельное от других обращение Петра к Иисусу; такой перевод естественно выражает эту сцену по-русски.
- source_word: ἤρξατο ἐπιτιμᾶν
  choice: начал возражать Ему
  rationale: ἤρξατο с инфинитивом передаёт начало действия. ἐπιτιμάω означает резкое порицание или выговор; в данном контексте «возражать» ясно передаёт дерзкое противодействие Петра, не создавая неестественного русского выражения «укорять Иисуса».
- source_word: Ἵλεώς σοι
  choice: Пощади Себя
  rationale: Эллиптическая идиома выражает пожелание избавления от предсказанной участи. «Пощади Себя» — традиционно понятный и контекстуально уместный русский эквивалент, не вводящий прямо слово «Бог», которого в греческом тексте нет.
- source_word: κύριε
  choice: Господи
  rationale: Форма звательного обращения к Иисусу естественно передаётся как «Господи» и сохраняет христологическую значимость κύριος.
- source_word: οὐ μὴ ἔσται σοι τοῦτο
  choice: Этого с Тобой ни за что не случится
  rationale: Сочетание οὐ μή с будущим временем выражает усиленное отрицание; «ни за что не случится» передаёт его силу современным литературным русским языком.
theological_decisions:
- issue: Передача протеста Петра без добавления отсутствующего в тексте субъекта «Бог»
  choice: Пощади Себя, Господи!
  alternative: Да будет милостиво к Тебе, Господи! / Боже упаси, Господи!
  rationale: Ἵλεώς σοι — подлинно неоднозначное эллиптическое выражение. Основной перевод передаёт пожелание избежать страдания, не вставляя явно Бога как действующее лицо; примечание сохраняет буквальную окраску и распространённую идиоматическую альтернативу.
- issue: Характер обращения Петра к Иисусу
  choice: начал возражать Ему
  alternative: начал укорять Его / начал строго выговаривать Ему
  rationale: Греческий глагол силён и показывает, что Пётр дерзко оспаривает сказанное Иисусом. «Возражать» звучит естественно в современном русском, а примечание сохраняет более резкие лексические возможности.
translation_notes:
  register: Современный литературный русский с уважительным написанием местоимений, относящихся к Иисусу. Реплика Петра звучит эмоционально и решительно; синтаксис остаётся простым и доступным.
