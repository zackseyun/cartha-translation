  yaml_path: translation/nt/matthew/016/005.yaml
  text: And when the disciples came to the other side[a], they had forgotten to take bread.
translation:
  language: ru
  text: Переправившись на другой берег, ученики забыли взять с собой хлеб.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθόντες
  choice: переправившись
  rationale: Аористное причастие передаёт действие, предшествующее основному; с учётом εἰς τὸ πέραν естественное русское «переправившись» ясно выражает переход на другой берег.
- source_word: οἱ μαθηταὶ
  choice: ученики
  rationale: Устойчивое и контекстуально точное обозначение учеников Иисуса в Евангелиях.
- source_word: εἰς τὸ πέραν
  choice: на другой берег
  rationale: Выражение означает прибытие на противоположную сторону водоёма; такой перевод естественен в данном повествовательном контексте.
- source_word: ἐπελάθοντο
  choice: забыли
  rationale: Глагол означает «забыть»; русская форма прошедшего времени в сочетании с предшествующим деепричастным оборотом естественно передаёт последовательность событий без искусственного плюсквамперфекта.
- source_word: ἄρτους
  choice: хлеб
  rationale: Хотя греческое слово стоит во множественном числе («хлебы», «лепёшки»), в современном русском для провизии естественно собирательное «хлеб».
- source_word: λαβεῖν
  choice: взять с собой
  rationale: Контекстуальное дополнение «с собой» естественно раскрывает смысл λαβεῖν при перемещении и не добавляет нового содержания.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная фраза. Деепричастный оборот сохраняет связь греческого причастия с главным глаголом. Лексическая множественность ἄρτους передана естественным русским собирательным существительным без сноски, поскольку смысл не меняется.
