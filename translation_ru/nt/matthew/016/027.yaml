  text: μέλλει γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/027.yaml
  text: For the Son of Man is about to come in the glory of his Father with his angels[b][a], and then he will repay each one according to his deed.
translation:
  language: ru
  text: Ведь Сыну Человеческому предстоит прийти[a] в славе Своего Отца со Своими ангелами, и тогда Он воздаст каждому по его делам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собирается прийти», «вот-вот придёт». Греческое выражение сохраняет оттенок предстоящего, надвигающегося события.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «по его делу (поступку)». В греческом стоит единственное число, употреблённое распределительно о делах и образе действий каждого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλει
  choice: должен вскоре
  rationale: Сочетание с инфинитивом указывает на предстоящее, ожидаемое действие и сохраняет оттенок близости, не сводя выражение к простому будущему времени.
- source_word: γὰρ
  choice: ведь
  rationale: Естественно вводит обоснование предыдущего высказывания и подходит современному литературному русскому.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшаяся передача самообозначения Иисуса, сохраняющая его межтекстовые связи.
- source_word: ἔρχεσθαι
  choice: прийти
  rationale: Нормальная передача инфинитива движения в эсхатологическом контексте.
- source_word: ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ
  choice: в славе Своего Отца
  rationale: Предлог «в» сохраняет образ явления в сфере и проявлении славы; родительное отношение передано прямо.
- source_word: μετὰ τῶν ἀγγέλων αὐτοῦ
  choice: со Своими ангелами
  rationale: Передаёт сопровождение и сохраняет притяжательное местоимение.
- source_word: καὶ τότε
  choice: и тогда
  rationale: Сохраняет как связку, так и временную последовательность.
- source_word: ἀποδώσει
  choice: воздаст
  rationale: Передаёт предоставление каждому того, что ему причитается, и сохраняет судебно-оценочный оттенок без уточнения, идёт ли речь только о награде или также о наказании.
- source_word: ἑκάστῳ
  choice: каждому
  rationale: Кратко и естественно сохраняет распределительное значение дательного падежа.
- source_word: κατὰ τὴν πρᾶξιν αὐτοῦ
  choice: по его делам
  rationale: В русском множественное «делам» естественно выражает совокупность поступков каждого человека; примечание отмечает формальное единственное число греческого текста.
theological_decisions:
- issue: Эсхатологический оттенок μέλλει при пришествии Сына Человеческого
  choice: 'Сохранить оттенок предстоящего и близкого действия: «должен вскоре прийти».'
  alternative: «придёт» или «собирается прийти»
  rationale: Греческое μέλλω с инфинитивом не следует сглаживать до простого будущего; перевод сохраняет временное напряжение текста, не разрешая споры о сроках исполнения.
- issue: Суд по делам
  choice: «воздаст каждому по его делам»
  alternative: «наградит каждого за то, что он сделал»
  rationale: «Воздаст» допускает как благоприятное, так и неблагоприятное воздаяние и не встраивает стих в заранее заданную систему учения о спасении и суде.
translation_notes:
  register: Современный литературный русский с достоинством библейского стиля. Заглавные буквы в местоимениях «Своего», «Своими», «Он» применены как принятая в русском религиозном письме форма почтительности; синтаксис остаётся ясным для широкого читателя.
