  text: οἱ δὲ εἶπαν· Οἱ μὲν Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἕτεροι δὲ Ἰερεμίαν ἢ ἕνα τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/014.yaml
  text: And they said[a], “Some say John the Baptist, others Elijah, and others Jeremiah or one of the prophets.”
translation:
  language: ru
  text: 'Они ответили: «Одни говорят, что Ты — Иоанн Креститель, другие — Илия, третьи — Иеремия или один из пророков».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Они ответили
  rationale: В контексте ответа на вопрос εἶπαν естественно передаётся русским «ответили»; δέ поддерживает ход повествования и не требует отдельного союза.
- source_word: Οἱ μὲν
  choice: Одни говорят
  rationale: μέν начинает распределительный ряд, который по-русски естественно выражается конструкцией «одни… другие… третьи»; подразумеваемое «что Ты» сохраняется эллиптически.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Иоанн Креститель
  rationale: Устоявшееся и понятное русское именование Иоанна, соответствующее βαπτιστής.
- source_word: ἄλλοι δὲ Ἠλίαν
  choice: другие — Илия
  rationale: Продолжение распределительного ряда; тире естественно восполняет опущенное сказуемое.
- source_word: ἕτεροι δὲ Ἰερεμίαν
  choice: а третьи — Иеремия
  rationale: ἕτεροι обозначает ещё одну группу; «третьи» ясно и естественно передаёт структуру перечисления.
- source_word: ἢ ἕνα τῶν προφητῶν
  choice: или один из пророков
  rationale: Сохраняется простая альтернатива без добавления отсутствующего в греческом слова «других».
theological_decisions:
- issue: Подразумеваемый объект отождествлений
  choice: 'В основном тексте сохранена эллиптическая форма: «Одни говорят: Иоанн Креститель…»'
  alternative: «Одни говорят, что Ты — Иоанн Креститель…»
  rationale: Греческий текст перечисляет ответы без явного повторения «что Ты». Контекст предыдущего вопроса делает смысл понятным, а примечание раскрывает возможную экспликацию.
translation_notes:
  register: Современный литературный русский язык; распределительная конструкция «одни… другие… третьи» передаёт греческую последовательность естественно и достойно. Эллипсис оригинала сохранён, но пояснён в примечании.
