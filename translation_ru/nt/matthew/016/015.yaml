  text: He says to them[a], “But who do you say that I am?”
translation:
  language: ru
  text: 'Он говорит им: «А вы кем считаете Меня?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: говорит
  rationale: Историческое настоящее сохраняет живость греческого повествования и естественно звучит по-русски.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж местоимения обозначает адресатов речи.
- source_word: Ὑμεῖς δὲ
  choice: А вы
  rationale: Выражает контраст между мнениями людей из предыдущего контекста и ответом самих учеников; явное Ὑμεῖς передано ударным «вы».
- source_word: τίνα με λέγετε εἶναι
  choice: кем считаете Меня
  rationale: Естественная русская передача греческой конструкции accusativus cum infinitivo после глагола речи; «считаете» здесь передаёт смысл «говорите/полагаете, что Я — кто» без добавления нового содержания.
theological_decisions:
- issue: Акцент на личном ответе учеников
  choice: «А вы кем считаете Меня?»
  alternative: «А вы за кого почитаете Меня?» / «А вы кем называете Меня?»
  rationale: Формулировка сохраняет противопоставление общественных мнений собственному суждению учеников и не предвосхищает исповедание Петра в следующем стихе.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная и достойная прямая речь. Заглавная буква в «Меня» следует принятому благоговейному оформлению местоимения, относящегося к Иисусу.
