  text: ⸂ἀποκριθεὶς δὲ⸃ ὁ Ἰησοῦς εἶπεν αὐτῷ· Μακάριος εἶ, Σίμων Βαριωνᾶ, ὅτι σὰρξ καὶ αἷμα οὐκ ἀπεκάλυψέν σοι ἀλλ’ ὁ πατήρ μου ὁ ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/017.yaml
  text: And Jesus answered him[a], “Blessed are you, Simon Bar-Jonah, because flesh and blood did not reveal this to you[c][b], but my Father who is in heaven did.”
translation:
  language: ru
  text: 'Иисус ответил ему: «Блажен ты, Симон Бар-Иона[a], потому что не плоть и кровь[b] открыли тебе это, а Мой Отец, который на небесах[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Симон, сын Ионы». «Бар-Иона» — сохранённая в греческом тексте арамейская форма со значением «сын Ионы».'
    reason: lexical_alternative
  - marker: b
    text: «Плоть и кровь» — устойчивый оборот, обозначающий людей или чисто человеческий источник.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «на небесах»; в греческом употреблено множественное число.'
    reason: lexical_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτῷ
  choice: Иисус сказал ему в ответ
  rationale: Конструкция с причастием и личной формой глагола передаёт ответ Иисуса. Русское «сказал ему в ответ» естественно выражает смысл без тяжеловесного «ответив, сказал»; δέ здесь продолжает повествование и не требует отдельного противительного союза.
- source_word: Μακάριος
  choice: Блажен
  rationale: «Блажен» сохраняет торжественный и богословский вес слова μακάριος и в данном изречении точнее, чем психологическое «счастлив» или нейтральное «удачлив».
- source_word: Σίμων Βαριωνᾶ
  choice: Симон бар-Иона
  rationale: Сохраняется представленная в греческом тексте арамейская форма отчества; её значение пояснено в сноске.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит основание, по которому Симон назван блаженным.
- source_word: σὰρξ καὶ αἷμα
  choice: плоть и кровь
  rationale: Сохранён образный семитский оборот, исключающий человеческий источник откровения; пояснение дано в сноске.
- source_word: ἀπεκάλυψέν σοι
  choice: открыли тебе это
  rationale: «Открыли» сохраняет смысл раскрытия прежде сокрытого. Местоимение «это» восполняет подразумеваемый из контекста объект — исповедание Симона.
- source_word: ἀλλ’ ὁ πατήρ μου
  choice: а мой Отец
  rationale: Союз «а» естественно передаёт резкое противопоставление человеческого и божественного источника.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: который на небесах
  rationale: Формулировка близко передаёт определительный оборот и сохраняет множественное число греческого οὐρανοῖς, естественное также для русского библейского регистра.
theological_decisions:
- issue: Источник исповедания Симона
  choice: «плоть и кровь» понимаются широко как человеческий источник, противопоставленный откровению Отца
  alternative: Оборот можно сузить до собственных рассуждений Симона либо до наставления других людей
  rationale: Текст утверждает божественный, а не человеческий источник данного знания, но не уточняет, какая именно человеческая возможность исключается; перевод сохраняет эту широту.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан естественным для устной речи Иисуса, при этом сохранены ключевые образы «блажен», «плоть и кровь» и «на небесах». Заглавная буква в слове «Отец» отмечает употребление как именования Бога; местоимение «мой» оставлено со строчной буквы по нормам современного русского текста.
