  text: ὁ δὲ στραφεὶς εἶπεν τῷ Πέτρῳ· Ὕπαγε ὀπίσω μου, Σατανᾶ· σκάνδαλον ⸂εἶ ἐμοῦ⸃, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/023.yaml
  text: But he turned and said to Peter[a], “Go behind me, Satan! You are a stumbling block to me, because you are not setting your mind on the things of God[b], but on the things of men.”
translation:
  language: ru
  text: 'Но Он, обернувшись, сказал Петру: «Иди позади Меня, Сатана![a] Ты для Меня — камень преткновения, потому что у тебя на уме не Божье, а человеческое».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционный перевод: «Отойди от Меня, Сатана!» Греческое выражение буквально означает «иди позади Меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: обернувшись
  rationale: Передаёт физический поворот Иисуса перед обращением к Петру и естественно звучит по-русски.
- source_word: Ὕπαγε ὀπίσω μου
  choice: Иди позади Меня
  rationale: Сохраняет пространственное значение ὀπίσω («позади») и повелительную силу ὕπαγε, не подменяя выражение привычным, но менее точным «отойди от Меня».
- source_word: Σατανᾶ
  choice: сатана
  rationale: Сохраняет традиционное имя/обозначение и резкость обращения, не разрешая вопрос, называет ли Иисус так самого Петра или указывает на его противодействующую роль.
- source_word: σκάνδαλον
  choice: камень преткновения
  rationale: Устойчивое русское выражение передаёт образ препятствия, о которое спотыкаются; здесь Пётр препятствует пути Иисуса.
- source_word: ἐμοῦ
  choice: для Меня
  rationale: Естественно обозначает того, для кого Пётр становится препятствием.
- source_word: φρονεῖς
  choice: у тебя на уме
  rationale: Передаёт не отдельную мысль, а устойчивую направленность мышления и забот.
- source_word: τὰ τοῦ θεοῦ
  choice: Божье
  rationale: Краткая субстантивированная форма сохраняет широкое и намеренно неуточнённое значение греческого выражения.
- source_word: τὰ τῶν ἀνθρώπων
  choice: человеческое
  rationale: Передаёт родовое значение ἀνθρώπων — то, что свойственно людям и определяется человеческими интересами, — сохраняя контраст с Божьим.
theological_decisions:
- issue: Смысл обращения «сатана» к Петру
  choice: Сохранить прямое обращение «сатана» без пояснения в основном тексте.
  alternative: Передать как «противник» либо уточнить, что Иисус обращается к сатане, действующему через Петра.
  rationale: Греческий текст оставляет напряжение между именем Сатаны и функцией противника; перевод не должен устранять эту неоднозначность.
- issue: Направление повеления Ὕπαγε ὀπίσω μου
  choice: «Иди позади Меня»
  alternative: «Отойди от Меня»
  rationale: Выбранная формулировка сохраняет мотив надлежащего места ученика позади Иисуса, одновременно оставаясь суровым отвержением попытки Петра направлять Его путь.
- issue: Контраст Божьего и человеческого
  choice: «не Божье, а человеческое»
  alternative: «не интересы Бога, а интересы людей»
  rationale: Широкая формулировка не сужает τὰ до интересов, планов или забот и сохраняет богословскую ёмкость исходного противопоставления.
translation_notes:
  register: Современный литературный русский язык с краткой, резкой прямой речью. «Камень преткновения» сохранён как понятный устойчивый библейский образ; «у тебя на уме» естественно передаёт направленность мышления без излишней церковнославянской окраски.
