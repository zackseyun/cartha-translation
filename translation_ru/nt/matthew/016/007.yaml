  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: А они
  rationale: Частица δέ мягко продолжает повествование; «а» естественно передаёт переход к реакции учеников, не усиливая противопоставление.
- source_word: διελογίζοντο
  choice: рассуждали
  rationale: Имперфект передаёт продолжавшееся обсуждение и обдумывание; «рассуждали» сохраняет этот оттенок и звучит естественно по-русски.
- source_word: ἐν ἑαυτοῖς
  choice: между собой
  rationale: Оборот указывает на обсуждение внутри группы учеников; это идиоматичный русский эквивалент.
- source_word: λέγοντες
  choice: двоеточие перед прямой речью
  rationale: Причастие вводит содержание рассуждений; в современном русском повествовании его естественно передать пунктуационно, без тяжеловесного «говоря».
- source_word: ὅτι
  choice: Это потому, что
  rationale: ὅτι вводит содержание их вывода. Контекст позволяет понимать реплику как объяснение слов Иисуса, однако формально возможно и простое сообщение; неоднозначность отмечена в сноске.
- source_word: Ἄρτους
  choice: хлеба
  rationale: Хотя греческое слово стоит во множественном числе («хлебы», «буханки»), здесь оно обозначает хлеб как дорожный запас; русский собирательный родительный звучит естественно.
- source_word: οὐκ ἐλάβομεν
  choice: мы не взяли с собой
  rationale: В контексте дороги λαμβάνω означает взять с собой припасы. Такой перевод точнее непосредственного «не взяли» раскрывает подразумеваемый смысл.
