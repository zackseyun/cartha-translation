  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τότε ⸀διεστείλατο τοῖς ⸀μαθηταῖς ἵνα μηδενὶ εἴπωσιν ὅτι αὐτός ⸀ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/020.yaml
  text: Then he strictly instructed the disciples to tell no one that he is the Messiah[a].
translation:
  language: ru
  text: Тогда Иисус строго велел ученикам никому не говорить, что Он — Мессия[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческое Χριστός — титул со значением «Помазанник».'
    reason: Альтернативная традиционная передача мессианского титула.
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественно и кратко обозначает последовательность событий в повествовании.
- source_word: διεστείλατο
  choice: строго велел
  rationale: Передаёт силу настоятельного распоряжения; современно и естественно по-русски, без дополнительного оттенка предупреждения об опасности.
- source_word: τοῖς μαθηταῖς
  choice: ученикам
  rationale: Определённость известной группы ясна из контекста; притяжательное местоимение добавлять не требуется.
- source_word: ἵνα μηδενὶ εἴπωσιν
  choice: никому не говорить
  rationale: Естественно передаёт содержание запрета, выраженного конструкцией ἵνα с сослагательным наклонением.
- source_word: αὐτός ἐστιν
  choice: Он —
  rationale: Явное греческое местоимение передано без искусственного усиления «Он Сам»; тире естественно связывает подлежащее с именной частью сказуемого.
- source_word: ὁ χριστός
  choice: Мессия
  rationale: Здесь Χριστός является титулом; «Мессия» сохраняет его смысл как обозначения Помазанника, а не превращает титул в имя.
theological_decisions:
- issue: Передача Χριστός как титула
  choice: Мессия
  alternative: Христос
  rationale: В данном контексте слово обозначает ожидаемого Помазанника и функционирует как титул. В основном тексте смысл титула раскрыт словом «Мессия», а традиционный вариант отмечен в сноске.
- issue: Явное называние Иисуса
  choice: Иисус
  alternative: Он
  rationale: Греческий текст использует подразумеваемое подлежащее при глаголе, но в русском отдельный стих с «Тогда Он» может быть менее самодостаточным. Имя восстанавливает ясную референцию без изменения смысла.
translation_notes:
  register: Современный литературный русский язык; краткая, строгая повествовательная фраза. Прописное «Он» соответствует принятому благоговейному библейскому регистру, не добавляя смыслового усиления греческому αὐτός.
