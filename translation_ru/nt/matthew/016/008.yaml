source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς ⸀εἶπεν· Τί διαλογίζεσθε ἐν ἑαυτοῖς, ὀλιγόπιστοι, ὅτι ἄρτους οὐκ ⸀ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/008.yaml
  text: But Jesus[a], knowing this, said, “Why are you discussing among yourselves, you of little faith, that you have no bread?”
translation:
  language: ru
  text: 'Но Иисус, поняв это, сказал: «Почему вы рассуждаете между собой, маловеры, о том, что не взяли с собой хлеба[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Почему вы рассуждаете между собой, маловеры, из-за того, что не взяли с собой хлеба?»'
    reason: Греческое ὅτι обычно вводит содержание рассуждений, но может пониматься и с причинным оттенком; οὐκ ἐλάβετε означает «не взяли».
lexical_decisions:
- source_word: γνοὺς
  choice: поняв это
  rationale: Аористное причастие обозначает предшествующее речи осознание Иисуса; дополнение «это» естественно восстанавливается из контекста.
- source_word: δὲ
  choice: но
  rationale: Передаёт лёгкое противопоставление и повествовательный переход к ответу Иисуса.
- source_word: Τί διαλογίζεσθε
  choice: почему вы рассуждаете
  rationale: Τί здесь употреблено в значении вопроса о причине, а διαλογίζεσθε обозначает обсуждение или обдумывание учениками.
- source_word: ἐν ἑαυτοῖς
  choice: между собой
  rationale: Естественно передаёт взаимное обсуждение внутри группы, не исключая оттенка внутреннего рассуждения.
- source_word: ὀλιγόπιστοι
  choice: маловеры
  rationale: Краткое прямое обращение сохраняет характерный для Матфея упрёк в недостатке веры и звучит достойно по-русски.
- source_word: ὅτι
  choice: о том, что
  rationale: Передаёт придаточное как содержание обсуждения, сохраняя синтаксическую связь с «рассуждаете».
- source_word: ἄρτους οὐκ ἐλάβετε
  choice: не взяли с собой хлеба
  rationale: Сохраняет значение λαμβάνω «взять» и контекстуально выражает, что ученики не захватили хлеб в путь; русский родительный после отрицания звучит естественно.
theological_decisions:
- issue: Сила упрёка ὀλιγόπιστοι
  choice: маловеры
  alternative: люди малой веры
  rationale: Выбранный вариант прямо указывает на недостаточную веру учеников в данной ситуации, не превращая упрёк в более широкое догматическое утверждение.
- issue: Связь придаточного с ὅτι
  choice: 'содержание обсуждения: «о том, что»'
  alternative: 'причина обсуждения: «из-за того, что»'
  rationale: Греческая конструкция допускает причинный оттенок, но связь с διαλογίζεσθε естественно понимается как указание на предмет их рассуждений; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; речь Иисуса передана прямо и сдержанно. «Маловеры» сохраняет лаконичность и силу обращения, а «не взяли с собой хлеба» остаётся близким к греческому выражению и понятным современному читателю.
