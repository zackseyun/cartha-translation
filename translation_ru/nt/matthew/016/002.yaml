base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/002.yaml
  text: But he answered and said to them[a], “When evening comes, you say, ‘Fair weather, for the sky is red.’
translation:
  language: ru
  text: 'Он же сказал им в ответ: «Когда наступает вечер, вы говорите: „Будет хорошая погода, потому что небо красное“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: сказал им в ответ
  rationale: Естественно передаёт обычную греческую формулу ответа, сохраняя и значение реакции на предшествующую речь, и глагол говорения.
- source_word: Ὀψίας γενομένης
  choice: Когда наступает вечер
  rationale: Передаёт временное значение генитивного абсолютного оборота и естественно звучит в современном русском языке.
- source_word: λέγετε
  choice: вы говорите
  rationale: Настоящее время обозначает привычное, повторяющееся высказывание.
- source_word: Εὐδία
  choice: Будет хорошая погода
  rationale: Существительное означает ясную, благоприятную погоду; будущее время естественно в русском погодном предсказании, основанном на вечернем небе.
- source_word: πυρράζει
  choice: красное
  rationale: Кратко и точно передаёт красный цвет неба; связка «есть» в русском настоящем времени опускается.
- source_word: οὐρανός
  choice: небо
  rationale: Русское «небо» естественно передаёт видимое небо в метеорологическом контексте и не требует примечания о различии между английскими sky и heaven.
