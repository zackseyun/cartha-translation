base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/011.yaml
  text: How do you not understand that I did not speak to you about bread? But beware of the leaven of the Pharisees and Sadducees[a][b].
translation:
  language: ru
  text: Как же вы не понимаете, что Я сказал вам не о хлебе? Но остерегайтесь закваски фарисеев и саддукеев[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «берегитесь закваски фарисеев и саддукеев».'
    reason: lexical_alternative
  - marker: b
    text: Здесь «закваска» — метафора; в следующем стихе она объясняется как учение фарисеев и саддукеев.
    reason: cross_reference
lexical_decisions:
- source_word: πῶς οὐ νοεῖτε
  choice: Как же вы не понимаете
  rationale: Риторический вопрос выражает упрёк за неспособность уловить смысл. Частица «же» естественно передаёт эту выразительность в современном русском языке, не превращая вопрос в прямое «почему».
- source_word: ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν
  choice: что Я говорил вам не о хлебе
  rationale: Хотя ἄρτων имеет форму множественного числа, в данном контексте русское собирательное «хлеб» звучит естественнее, чем «хлебы» или «буханки». Положение «не о хлебе» сохраняет смысловое ударение отрицания.
- source_word: προσέχετε
  choice: остерегайтесь
  rationale: Императив здесь служит предупреждением, а не просто призывом обратить внимание. «Остерегайтесь» естественно сочетается с родительным падежом и передаёт значение конструкции с ἀπό.
- source_word: δὲ
  choice: Но
  rationale: δέ обозначает лёгкое противопоставление и переход от исправления ошибочного понимания к подлинному предупреждению.
- source_word: ἀπὸ τῆς ζύμης
  choice: закваски
  rationale: При προσέχετε предлог ἀπό указывает, чего следует остерегаться. «Закваска» сохраняет образ источника и остаётся понятной современному читателю.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: фарисеев и саддукеев
  rationale: Использованы общепринятые русские наименования этих иудейских религиозных групп; родительный падеж передаёт принадлежность или характерную связь.
theological_decisions:
- issue: Метафорическое значение слова ζύμη
  choice: Сохранить в основном тексте метафору «закваска», не заменяя её словом «учение».
  alternative: «Но остерегайтесь учения фарисеев и саддукеев».
  rationale: В этом стихе употреблён образ, а его значение прямо разъясняется лишь в следующем стихе. Сохранение метафоры передаёт развитие мысли исходного текста и не вводит объяснение преждевременно.
translation_notes:
  register: Современный литературный русский язык с достойной, но общедоступной формулировкой. Заглавная буква в местоимении «Я» следует принятой русской библейской издательской традиции; синтаксис остаётся естественным и сохраняет упрекающую силу вопроса.
