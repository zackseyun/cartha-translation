source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφεληθήσεται ἄνθρωπος ἐὰν τὸν κόσμον ὅλον κερδήσῃ τὴν δὲ ψυχὴν αὐτοῦ ζημιωθῇ; ἢ τί δώσει ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/026.yaml
  text: For what will it profit a man if he gains the whole world but forfeits his life? Or what will a man give in exchange for his life?[a]
translation:
  language: ru
  text: Ведь какая польза человеку, если он приобретёт весь мир, но лишится собственной жизни? Или что человек даст в обмен на свою жизнь?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «своей души» в обоих случаях, где сказано «своей жизни». Греческое слово ψυχή может означать «жизнь», «самого человека» или «душу» — в зависимости от контекста.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Ведь какая польза
  rationale: τί вводит риторический вопрос, а γάρ связывает его с предшествующим наставлением и придаёт объяснительный оттенок. Такая формулировка естественна по-русски и сохраняет обе функции.
- source_word: ὠφεληθήσεται
  choice: какая польза человеку
  rationale: Будущая пассивная форма выражает полученную пользу или выгоду. Русская безличная конструкция передаёт смысл естественнее, чем буквальное «какую пользу получит».
- source_word: ἄνθρωπος
  choice: человек
  rationale: В данном обобщающем высказывании ἄνθρωπος обозначает любого человека; русское «человек» точно сохраняет эту родовую функцию.
- source_word: τὸν κόσμον ὅλον
  choice: весь мир
  rationale: Сохраняет всеохватность ὅλον и обычное значение κόσμος в данном контексте.
- source_word: κερδήσῃ
  choice: приобретёт
  rationale: Передаёт получение выгоды или обладание приобретённым и поддерживает экономический образ, противопоставленный утрате и обмену.
- source_word: τὴν δὲ ψυχὴν αὐτοῦ
  choice: но лишится собственной жизни
  rationale: ψυχή здесь может обозначать жизнь, самого человека или душу. «Жизнь» ясно выражает целостную личную утрату, а «собственной» естественно подчёркивает αὐτοῦ и контраст со всем миром.
- source_word: ζημιωθῇ
  choice: лишится
  rationale: Пассивная форма ζημιόω означает понести ущерб, утратить или лишиться. «Лишится» сохраняет результат утраты, не приписывая человеку прямо действие погубить себя.
- source_word: ἀντάλλαγμα
  choice: в обмен за
  rationale: Обозначает то, что даётся взамен. Выражение сохраняет коммерческий образ и не сужает его до специального значения выкупа.
- source_word: τῆς ψυχῆς αὐτοῦ
  choice: за свою жизнь
  rationale: Родительный падеж указывает, за что предлагается обмен; повторение «жизнь» сохраняет внутренний параллелизм стиха.
theological_decisions:
- issue: Значение ψυχή в высказывании об окончательной утрате
  choice: жизнь
  alternative: душа
  rationale: 'Контекст не требует жёсткого антропологического разделения тела и нематериальной души: ψυχή может охватывать жизнь и самого человека в его целостности. Основной текст сохраняет это широкое значение словом «жизнь», а традиционное и лексически допустимое «душа» приведено в сноске, чтобы не устранять смысловое и богословское напряжение.'
translation_notes:
  register: Современный литературный русский язык; риторическая форма звучит естественно и достойно. Сохранены объяснительное «ведь», экономические образы приобретения и обмена, а также лексическая неоднозначность ψυχή посредством сноски.
