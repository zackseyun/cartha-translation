source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ Φαρισαῖοι καὶ Σαδδουκαῖοι πειράζοντες ἐπηρώτησαν αὐτὸν σημεῖον ἐκ τοῦ οὐρανοῦ ἐπιδεῖξαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/001.yaml
  text: And the Pharisees and Sadducees came and[a], testing him, asked him to show them a sign from heaven.
translation:
  language: ru
  text: Фарисеи и саддукеи подошли к Иисусу и, испытывая Его[a], попросили показать им знак с неба.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «искушая Его»; возможно: «пытаясь поймать Его в ловушку».'
    reason: 'Лексическая альтернатива: πειράζω может обозначать испытание, искушение или, в данном контексте, попытку поставить человека в затруднительное положение.'
lexical_decisions:
- source_word: προσελθόντες
  choice: подошли
  rationale: Аористное причастие обозначает предшествующее главному действию приближение; «подошли» естественно передаёт направленное движение к Иисусу.
- source_word: Φαρισαῖοι
  choice: фарисеи
  rationale: Устоявшееся русское наименование религиозной группы.
- source_word: Σαδδουκαῖοι
  choice: саддукеи
  rationale: Устоявшееся русское наименование религиозной группы.
- source_word: πειράζοντες
  choice: испытывая Его
  rationale: Передаёт враждебно окрашенную проверку, но не усиливает текст до однозначного «пытаясь поймать Его в ловушку».
- source_word: ἐπηρώτησαν
  choice: попросили
  rationale: В конструкции с инфинитивом по-русски естественно означает просьбу совершить действие; оттенок вопроса здесь вторичен.
- source_word: σημεῖον
  choice: знамение
  rationale: Устоявшийся и точный библейский эквивалент, сохраняющий смысл знака, подтверждающего Божье действие, без явного добавления слова «чудо».
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: с неба
  rationale: Естественно передаёт источник или происхождение знамения.
- source_word: ἐπιδεῖξαι
  choice: показать
  rationale: Прямой и современный эквивалент инфинитива со значением предъявить или продемонстрировать.
theological_decisions:
- issue: Враждебный оттенок просьбы фарисеев и саддукеев
  choice: «испытывая Его»
  alternative: «искушая Его»; «пытаясь поймать Его в ловушку»
  rationale: '«Испытывая» сохраняет широту значения πειράζω и напряжённость повествования: намерение явно недоброжелательно, однако способ проверки не конкретизируется сверх греческого текста.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Местоимение «Его» уточняет референта греческого αὐτόν и соответствует принятому благоговейному русскому оформлению. Союзная конструкция перестроена естественно для русского синтаксиса без изменения последовательности событий.
