  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ ὁ Ἰησοῦς εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου ἠρώτα τοὺς μαθητὰς αὐτοῦ λέγων· ⸀Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι τὸν υἱὸν τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/013.yaml
  text: When Jesus came into the region of Caesarea Philippi[a], he was asking his disciples, saying[b], “Who do people say the Son of Man is?”
translation:
  language: ru
  text: 'Придя в окрестности Кесарии Филипповой, Иисус стал спрашивать Своих учеников: «Кем люди считают Сына Человеческого[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сын человека». «Сын Человеческий» — характерное самообозначение Иисуса; выражение может также перекликаться с Дан 7:13.'
    reason: lexical_and_intertextual_clarification
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: Придя
  rationale: Аористное причастие обозначает предшествующее действие и вводит новую сцену. В русском повествовании деепричастие естественно передаёт эту связь; δέ отдельно не выражено, поскольку здесь оно служит мягким переходом.
- source_word: εἰς τὰ μέρη
  choice: в окрестности
  rationale: Множественное μέρη идиоматически обозначает местность или территорию вокруг города, а не буквальные «части».
- source_word: Καισαρείας τῆς Φιλίππου
  choice: Кесарии Филипповой
  rationale: Устоявшаяся русская форма названия отличает этот город от других Кесарий и естественно передаёт греческое уточнение.
- source_word: ἠρώτα
  choice: стал спрашивать
  rationale: Имперфект указывает на разворачивающееся либо начавшееся действие; «стал спрашивать» естественно передаёт этот оттенок в новой сцене.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: Своих учеников
  rationale: Возвратное «Своих» ясно соотносит учеников с подлежащим Иисусом; «ученики» — точное и привычное евангельское обозначение μαθηταί.
- source_word: λέγων
  choice: ':'
  rationale: В русском языке причастие речи перед прямым вопросом естественно передаётся двоеточием; буквальное «говоря» было бы тяжеловесным и избыточным.
- source_word: Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι
  choice: Кем люди считают …?
  rationale: Эта современная русская конструкция естественно передаёт косвенное высказывание «кем люди говорят [его] быть», не ограничивая ἄνθρωποι мужчинами.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Сына Человеческого
  rationale: Устоявшееся русское выражение сохраняет характерное самообозначение Иисуса и его возможные межтекстовые связи, не сводя его смысл к одному толкованию.
theological_decisions:
- issue: Передача ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  alternative: сын человека; Человек
  rationale: Традиционная формула сохраняет одновременно семитский оборот, характерное самообозначение Иисуса и возможный отзвук Дан 7. Вариант «Человек» звучал бы более истолковательно и ослаблял бы словесную связь с исходным выражением.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён естественным для русского языка способом: λέγων передано двоеточием, а греческая конструкция с инфинитивом — вопросом «Кем люди считают…?». Местоимение «Своих» и мессианское самообозначение написаны с прописной буквы согласно распространённой русской библейской издательской норме.'
