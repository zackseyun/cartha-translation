  source_fidelity: 'Перевод точно передаёт основные элементы греческого текста: временной поворот «С того времени», начало нового этапа наставления, необходимость δεῖ без истолкования её источника, движение в Иерусалим, страдания «от» перечисленных групп, смерть и страдательный залог ἐγερθῆναι. «На третий день» соответствует τῇ τρίτῃ ἡμέρᾳ.'
  naturalness: Текст звучит как современный литературный русский с уместно возвышенным библейским регистром. «Начал открывать» естественно в данном контексте; «Ему надлежит» несколько книжно, но ясно и хорошо передаёт необходимость δεῖ.
