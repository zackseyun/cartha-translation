id: MAT.16.21
reference: Matthew 16:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ⸂ὁ Ἰησοῦς⸃ δεικνύειν τοῖς μαθηταῖς αὐτοῦ ὅτι δεῖ αὐτὸν ⸂εἰς Ἱεροσόλυμα ἀπελθεῖν⸃ καὶ πολλὰ παθεῖν ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/021.yaml
  text: From that time Jesus began to show his disciples that he must go to Jerusalem and suffer many things from the elders and chief priests and scribes[a], and be killed[c][b], and on the third day be raised.
translation:
  language: ru
  text: С того времени Иисус начал открывать Своим ученикам, что Ему надлежит пойти в Иерусалим, много пострадать от старейшин, первосвященников и книжников[a], быть убитым и на третий день быть воскрешённым[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «претерпеть многое от старейшин, первосвященников и книжников». Греческое выражение буквально означает «пострадать многое» или «претерпеть многое».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «воскреснуть». В греческом тексте употреблена страдательная форма: «быть воскрешённым».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: С того времени
  rationale: Передаёт временную точку отсчёта и отмечает новый этап повествования.
- source_word: ἤρξατο δεικνύειν
  choice: начал открывать
  rationale: «Открывать» естественно передаёт здесь значение сообщения и разъяснения ученикам, не сводя действие лишь к зрительному показу.
- source_word: δεῖ αὐτὸν
  choice: Ему надлежит
  rationale: Сохраняет сильное значение необходимости, не уточняя прямо её источник.
- source_word: εἰς Ἱεροσόλυμα ἀπελθεῖν
  choice: пойти в Иерусалим
  rationale: Естественная русская передача движения к месту назначения.
- source_word: πολλὰ παθεῖν
  choice: много пострадать
  rationale: Нормальная современная русская формулировка, передающая тяжесть и множественность предстоящих страданий.
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: от старейшин, первосвященников и книжников
  rationale: Прямо сохраняет ἀπό и традиционные, понятные наименования групп иудейского руководства.
- source_word: ἀποκτανθῆναι
  choice: быть убитым
  rationale: Точная и естественная передача страдательного инфинитива.
- source_word: τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι
  choice: на третий день быть воскрешённым
  rationale: Сохраняет страдательный залог греческого текста и временное указание.
theological_decisions:
- issue: Характер необходимости в δεῖ
  choice: Ему надлежит
  alternative: Ему нужно; Он должен
  rationale: Формулировка сохраняет вес необходимости, но не определяет её источник как Божий замысел, исполнение Писания или историческую неизбежность.
- issue: Залог ἐγερθῆναι
  choice: быть воскрешённым
  alternative: воскреснуть
  rationale: Греческая форма страдательная; её сохранение неявно оставляет место действию Бога и не устраняет богословское напряжение.
- issue: Связь ἀπό с последующими страданиями и убийством
  choice: В основном тексте «от» непосредственно связано со страданиями
  alternative: Понимать перечисленные группы как деятелей и в страданиях, и в убийстве
  rationale: Синтаксис допускает смысловую связь руководителей со всей цепочкой событий, но не требует явно повторять агент при «быть убитым».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Надлежит» несколько возвышенно, но понятно и уместно передаёт особую необходимость; названия «старейшины», «первосвященники» и «книжники» сохранены как установившиеся термины.
