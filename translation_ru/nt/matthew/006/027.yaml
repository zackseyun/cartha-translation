id: MAT.6.27
reference: Matthew 6:27
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται προσθεῖναι ἐπὶ τὴν ἡλικίαν αὐτοῦ πῆχυν ἕνα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/027.yaml
  text: And which of you[a], by being anxious, can add one cubit to his stature?
translation:
  language: ru
  text: И кто из вас, тревожась, может прибавить к сроку своей жизни один локоть?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «может прибавить к своему росту один локоть?» Греческое слово может означать как возраст или срок жизни, так и рост.'
    reason: alternative_reading
lexical_decisions:
- source_word: τίς δὲ ἐξ ὑμῶν
  choice: И кто из вас
  rationale: Оборот означает «кто из вас», а δέ здесь служит мягкой связкой с предыдущей мыслью; русское «И» естественно продолжает рассуждение.
- source_word: μεριμνῶν
  choice: тревожась
  rationale: Причастие передаёт состояние беспокойства и одновременно указывает на средство, которым человек якобы мог бы чего-то достичь.
- source_word: δύναται προσθεῖναι
  choice: может прибавить
  rationale: Сохраняется прямое значение способности и конкретный образ прибавления.
- source_word: ἐπὶ τὴν ἡλικίαν αὐτοῦ
  choice: к сроку своей жизни
  rationale: ἡλικία допускает значения «возраст/срок жизни» и «рост». В контексте заботы о жизни основным выбран смысл срока жизни, при этом подлинная лексическая неоднозначность сохранена в сноске.
- source_word: πῆχυν ἕνα
  choice: один локоть
  rationale: Локоть — буквальная мера длины в греческом тексте. Её сохранение передаёт намеренно конкретный образ измеряемого прибавления, даже если речь идёт о продолжительности жизни.
theological_decisions:
- issue: Значение ἡλικία в изречении
  choice: срок жизни
  alternative: рост
  rationale: Смысл «срок жизни» хорошо соответствует ближайшему контексту о заботе Бога о жизни и вопросу о бессилии тревоги продлить её. Однако «рост» лексически возможен и особенно естественно сочетается с мерой «локоть», поэтому этот вариант не устраняется, а приводится в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная. Сохранён библейский образ локтя, а неоднозначность ключевого греческого слова вынесена в сноску.
