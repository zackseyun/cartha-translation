    rationale: Глагол буквально описывает прорывание/прокапывание, вероятно, через стену дома. «Проникать внутрь» обозначает лишь результат действия и утрачивает способ проникновения. Замена на «не проламывают стены» естественна по-русски и сохраняет культурно-исторический образ без догматического или избыточного толкования.
