  text: θησαυρίζετε δὲ ὑμῖν θησαυροὺς ἐν οὐρανῷ, ὅπου οὔτε σὴς οὔτε βρῶσις ἀφανίζει, καὶ ὅπου κλέπται οὐ διορύσσουσιν οὐδὲ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/020.yaml
  text: But store up for yourselves treasures in heaven[a], where neither moth nor decay destroys[b], and where thieves do not break in and steal.
translation:
  language: ru
  text: Но собирайте себе сокровища на небе, где ни моль, ни порча[a] не уничтожают и где воры не проламывают стены[b] и не крадут.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ржавчина», «разъедание». Греческое слово буквально связано с поеданием и может обозначать разрушающую порчу или коррозию.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не прорывают» или «не прокапывают». Вероятно, речь о ворах, проламывавших или прорывавших стены домов.'
    reason: cultural_note
lexical_decisions:
- source_word: θησαυρίζετε
  choice: собирайте
  rationale: Настоящее повелительное наклонение передаёт продолжающееся, привычное действие; «собирайте сокровища» естественно сохраняет образ накопления.
- source_word: δὲ
  choice: но
  rationale: Союз выражает противопоставление запрету из предыдущего стиха.
- source_word: ὑμῖν
  choice: себе
  rationale: Дательный заинтересованного лица естественно передаётся возвратным местоимением и сохраняет значение «для себя».
- source_word: θησαυροὺς
  choice: сокровища
  rationale: Сохранены множественное число и повторяющийся в контексте образ сокровища.
- source_word: ἐν οὐρανῷ
  choice: на небе
  rationale: Обычный современный русский способ передать местное значение выражения без лишнего толкования.
- source_word: σὴς
  choice: моль
  rationale: Точное обозначение вредителя, уничтожающего хранившиеся ткани и одежду.
- source_word: βρῶσις
  choice: порча
  rationale: Греческое слово обозначает поедание или разъедающее разрушение; «порча» не сужает смысл исключительно до ржавчины и естественно сочетается с различными видами земного имущества.
- source_word: ἀφανίζει
  choice: уничтожают
  rationale: Передаёт значение исчезновения или гибели; множественное число требуется русским согласованием при однородных подлежащих «моль» и «порча».
- source_word: κλέπται
  choice: воры
  rationale: Прямой и общеупотребительный эквивалент.
- source_word: διορύσσουσιν
  choice: проникают внутрь
  rationale: Передаёт функцию действия в данном контексте естественным современным языком; буквальный образ прокапывания или проламывания стены сохранён в сноске.
- source_word: κλέπτουσιν
  choice: крадут
  rationale: Прямой и естественный эквивалент греческого глагола.
theological_decisions:
- issue: Смысл «сокровищ на небе»
  choice: Метафора сохранена без поясняющей вставки.
  alternative: небесные награды; духовные богатства
  rationale: Текст не уточняет устройство награды или заслуги; сохранение исходного образа не устраняет присущую ему богословскую открытость.
- issue: Объём значения βρῶσις
  choice: порча
  alternative: ржавчина; коррозия; тление
  rationale: Более широкое обозначение разрушения не ограничивает высказывание металлическими предметами и сохраняет общий контраст между уязвимым земным и неразрушимым небесным сокровищем.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости, параллелизма и достоинства евангельского наставления. Формулировка избегает архаичного «подкапывают» в основном тексте, но сохраняет культурный образ в сноске.
