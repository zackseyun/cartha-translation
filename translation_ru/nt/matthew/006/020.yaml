- from: Но собирайте себе сокровища на небе, где ни моль, ни порча[a] не уничтожают и где воры не проникают внутрь[b] и не крадут.
  to: Но собирайте себе сокровища на небе, где ни моль, ни порча[a] не уничтожают и где воры не проламывают стены[b] и не крадут.
  rationale: Исправление ограничено передачей διορύσσουσιν и связанной сноской. «Не проламывают стены» воспроизводит подразумеваемый в оригинале образ проникновения через стену и остаётся современным литературным русским. Остальные решения сохранены, поскольку они достаточно точно и естественно передают греческий текст и не сужают его богословский смысл.
