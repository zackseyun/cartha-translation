review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: сохранены противопоставление предыдущему стиху, продолжающееся повеление, возвратный дательный («себе»), множественное число «сокровища» и метафора небесного сокровища. Однако «проникают внутрь» слишком обобщает διορύσσουσιν и не передаёт характерный образ прорывания/проламывания стены, который важен для исходного выражения.'
  naturalness: Текст в целом современный и литературный. «На небе» возможно в данном контексте, хотя в русском оно несколько легче вызывает образ видимого неба; это не требует обязательной замены. Формулировка «не проламывают стены» естественна и ясна, при этом лучше сохраняет конкретный образ оригинала, чем «не проникают внутрь».
  terminology: «Сокровища», «моль», «порча», «воры» и «крадут» уместны. «Порча» — допустимое широкое соответствие βρῶσις; сноска корректно сохраняет варианты «ржавчина» и «разъедание». Богословская метафора не истолкована сверх текста.
