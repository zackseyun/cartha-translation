  text: καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ ⸀πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/013.yaml
  text: And do not lead us into temptation[b][a], but deliver us from evil.
translation:
  language: ru
  text: И не введи нас в искушение[a], но избавь нас от лукавого[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в испытание». Греческое слово может означать как искушение, так и испытание, тяжёлое переживание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «от зла». Греческое выражение можно понять лично («от лукавого») или безлично («от зла»).'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εἰσενέγκῃς
  choice: не введи
  rationale: Прямо передаёт молитвенную просьбу с μή и аористным сослагательным, не добавляя толкования «не допусти».
- source_word: πειρασμόν
  choice: искушение
  rationale: Естественный и укоренившийся русский эквивалент; возможное значение испытания сохранено в сноске.
- source_word: ῥῦσαι
  choice: избавь
  rationale: Передаёт просьбу о деятельном спасении и естественно звучит в современном литературном русском языке.
- source_word: τοῦ πονηροῦ
  choice: лукавого
  rationale: Субстантивированное прилагательное с артиклем допускает личное понимание — «лукавый»; подлинная неоднозначность между личным и безличным значением отмечена в сноске.
theological_decisions:
- issue: Значение τοῦ πονηροῦ
  choice: лукавого
  alternative: зла
  rationale: Греческая форма может быть мужского рода («лукавый», то есть злой) или среднего рода («зло»). В основном тексте принято личное понимание, а безличное сохранено как равноправная возможность в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и молитвенной краткости. Традиционная формулировка удержана там, где она остаётся ясной современному читателю; отсутствующее в SBLGNT славословие не добавлено.
