  text: Give us today our daily bread[a].
translation:
  language: ru
  text: Хлеб наш насущный дай нам сегодня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хлеб наш на сегодня», «хлеб наш на наступающий день» или «необходимый нам хлеб». Греческое прилагательное ἐπιούσιον встречается крайне редко, и его точное значение остаётся предметом споров.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτον (ἄρτος)
  choice: хлеб
  rationale: Сохраняет конкретный образ оригинала; хотя слово может шире обозначать пищу или пропитание, здесь предпочтителен прямой эквивалент.
- source_word: ἡμῶν
  choice: наш
  rationale: Притяжательное определение к слову «хлеб»; начальная позиция после существительного сохраняет достоинство и узнаваемый ритм молитвы.
- source_word: ἐπιούσιον (ἐπιούσιος)
  choice: насущный
  rationale: Редкое и спорное прилагательное. «Насущный» — закрепившийся русский эквивалент, способный передать хлеб, нужный для жизни, без устранения смысловой неоднозначности; основные альтернативы даны в сноске.
- source_word: δὸς (δίδωμι)
  choice: дай
  rationale: Прямая и естественная передача аористного повелительного наклонения в форме обращения к Богу.
- source_word: ἡμῖν
  choice: нам
  rationale: Прямая передача дательного падежа — адресата действия.
- source_word: σήμερον
  choice: сегодня
  rationale: Точно и естественно передаёт временное наречие, не прибегая к архаичному «на сей день».
theological_decisions:
- issue: Значение ἐπιούσιον в молитве Господней
  choice: насущный
  alternative: «на сегодня», «на наступающий день» или «необходимый нам»
  rationale: 'Греческое слово допускает несколько обоснованных толкований: хлеб на нынешний день, на грядущий день либо хлеб, необходимый для существования. Основной текст использует традиционный и ёмкий русский эквивалент, а подлинная лексическая неопределённость сохраняется в сноске.'
translation_notes:
  register: Современный литературный русский язык с dignified, молитвенным звучанием. Традиционное «хлеб наш насущный» сохранено как понятная и укоренённая формула; «сегодня» употреблено вместо архаичного «на сей день».
