id: MAT.6.34
reference: Matthew 6:34
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε εἰς τὴν αὔριον, ἡ γὰρ αὔριον μεριμνήσει ⸀αὑτῆς· ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/034.yaml
  text: Therefore do not worry about tomorrow[a], for tomorrow will worry about itself. Each day has enough trouble of its own.
translation:
  language: ru
  text: Итак, не тревожьтесь о завтрашнем дне, потому что завтрашний день сам будет тревожиться о себе. Каждому дню достаточно своих бед[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Каждому дню достаточно своего зла». Греческое слово может означать «зло», но здесь, вероятнее всего, имеются в виду беды или тяготы дня.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεριμνήσητε
  choice: не тревожьтесь
  rationale: В контексте Мф. 6:25–34 глагол обозначает тревожную заботу; этот вариант естественно передаёт повторяющуюся тему наставления.
- source_word: εἰς τὴν αὔριον
  choice: о завтрашнем дне
  rationale: Предлог с μεριμνάω указывает на предмет тревоги; по-русски это естественно выражается сочетанием «тревожиться о».
- source_word: ἡ αὔριον
  choice: завтрашний день
  rationale: Субстантивированное наречие с артиклем здесь персонифицировано; «завтрашний день» сохраняет этот образ.
- source_word: μεριμνήσει αὑτῆς
  choice: сам будет тревожиться о себе
  rationale: Сохранены повтор глагола, риторическая персонификация и возвратное значение αὑτῆς.
- source_word: ἀρκετὸν τῇ ἡμέρᾳ
  choice: каждому дню достаточно
  rationale: Дательный передан распределительно и естественно для русского языка, а ἀρκετόν — предикативом «достаточно».
- source_word: ἡ κακία αὐτῆς
  choice: своих бед
  rationale: В данном контексте κακία обозначает тяготы и неприятности дня; множественное «беды» звучит по-русски естественно, а «своих» передаёт принадлежность, выраженную αὐτῆς.
theological_decisions:
- issue: Значение κακία в заключительном изречении о тревоге
  choice: беды
  alternative: зло
  rationale: Контекст говорит о житейской тревоге и тяготах каждого дня, поэтому «беды» передаёт практический смысл. Возможное более буквальное значение «зло» сохранено в примечании, чтобы не устранить лексическую многозначность.
translation_notes:
  register: Современный литературный русский язык; тон краткий, наставительный и достойный. Повтор «тревожьтесь — будет тревожиться» намеренно сохраняет словесную связь и персонификацию оригинала.
