lexical_decisions:
- source_word: σοῦ δὲ ποιοῦντος
  choice: Но когда ты подаёшь
  rationale: Генитив абсолютный с δέ противопоставляет это наставление поведению, описанному ранее. По-русски конструкция естественно передаётся словами «Но когда ты…». В сочетании с ἐλεημοσύνην глагол ποιέω означает совершение благотворительного даяния; «подаёшь» ясно и кратко выражает этот смысл.
- source_word: ἐλεημοσύνην
  choice: нуждающимся
  rationale: Существительное обозначает милостыню, то есть помощь бедным и нуждающимся. В сочетании «подаёшь нуждающимся» смысл передан естественным современным языком, а буквальная лексическая альтернатива отмечена в сноске.
- source_word: μὴ γνώτω
  choice: пусть ... не знает
  rationale: Отрицательное повеление в третьем лице естественно передаётся конструкцией «пусть ... не знает», сохраняющей олицетворение рук.
- source_word: ἡ ἀριστερά σου
  choice: твоя левая рука
  rationale: Прямой перевод сохраняет яркий образ и параллелизм изречения.
- source_word: τί ποιεῖ ἡ δεξιά σου
  choice: что делает правая
  rationale: Настоящее время ποιεῖ передано настоящим временем «делает». Слово «рука» во второй части естественно опущено по-русски, но однозначно подразумевается и сохраняет параллель с левой рукой.
theological_decisions:
- issue: Смысл образа левой и правой руки
  choice: Сохранить метафору как предельно выразительный призыв не выставлять своё даяние напоказ.
  alternative: Передать образ пояснительно как общее наставление о смирении либо как безусловный запрет любой публичной благотворительности.
  rationale: Греческий текст использует олицетворение и гиперболу. Сохранение образа не сужает его до более строгого доктринального утверждения и не устраняет присущую изречению выразительность.
translation_notes:
  register: Современный литературный русский язык с обращением на «ты», соответствующим греческому единственному числу. Формулировка краткая и афористичная; традиционный образ рук сохранён. «Подаёшь нуждающимся» доступнее слова «милостыня», тогда как более буквальный вариант дан в сноске.
