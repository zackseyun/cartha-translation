  text: But when you give to the needy[a], do not let your left hand know what your right hand is doing,
translation:
  language: ru
  text: Но когда ты подаёшь нуждающимся[a], пусть твоя левая рука не знает, что делает правая,
  philosophy: optimal-equivalence
