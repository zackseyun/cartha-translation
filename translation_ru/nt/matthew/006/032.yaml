source:
  edition: SBLGNT
  text: πάντα γὰρ ταῦτα τὰ ἔθνη ⸀ἐπιζητοῦσιν· οἶδεν γὰρ ὁ πατὴρ ὑμῶν ὁ οὐράνιος ὅτι χρῄζετε τούτων ἁπάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/032.yaml
  text: For the Gentiles eagerly seek all these things; for your heavenly Father knows that you need all these things.
translation:
  language: ru
  text: Потому что всего этого настойчиво ищут язычники[a]; ведь ваш Небесный Отец знает, что вы нуждаетесь во всём этом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народы». Здесь греческое слово, вероятно, означает людей, не принадлежащих к народу завета.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: язычники
  rationale: В данном контексте речь идёт о людях вне народа завета, в противопоставлении ученикам Иисуса. «Язычники» естественно передаёт этот религиозно-социальный смысл; возможное более буквальное значение «народы» отмечено в сноске.
- source_word: ἐπιζητοῦσιν
  choice: настойчиво ищут
  rationale: Глагол ἐπιζητέω обозначает усиленное, усердное или упорное стремление к чему-либо. «Настойчиво ищут» передаёт эту силу без чрезмерного усиления.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: ваш Небесный Отец
  rationale: Естественная для современного русского языка передача определения ὁ οὐράνιος с сохранением личного обращения «ваш».
- source_word: οἶδεν
  choice: знает
  rationale: Хотя форма οἶδα исторически перфектная, здесь она имеет настоящее значение состояния знания.
- source_word: χρῄζετε
  choice: вы нуждаетесь
  rationale: Точно и естественно передаёт значение необходимости, сохраняя несколько более dignified регистр, чем разговорное «вам нужно».
- source_word: πάντα γὰρ ταῦτα ... τούτων ἁπάντων
  choice: всего этого ... во всём этом
  rationale: Сохранён повтор исходного текста, подчёркивающий совокупность перечисленных ранее житейских нужд; падежные формы соответствуют нормам русского языка.
- source_word: γὰρ ... γὰρ
  choice: потому что ... ведь
  rationale: Обе пояснительные связи сохранены, но переданы различными естественными русскими союзами, чтобы избежать тяжеловесного повтора «ибо ... ибо».
theological_decisions:
- issue: Значение τὰ ἔθνη в наставлении Иисуса
  choice: язычники
  alternative: народы; иноверцы
  rationale: Контекст противопоставляет учеников тем, кто не живёт в сознательном доверии Небесному Отцу. «Язычники» сохраняет историко-религиозное различие, не превращая его в безусловную нравственную оценку каждого нееврея.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет две пояснительные части стиха и смысловой повтор оригинала. Заглавные буквы в обращении «Небесный Отец» отражают устойчивую русскую библейскую практику.
