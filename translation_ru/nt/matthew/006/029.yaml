  text: λέγω δὲ ὑμῖν ὅτι οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/029.yaml
  text: But I tell you that not even Solomon in all his glory was clothed like one of these[a].
translation:
  language: ru
  text: 'Но говорю вам: даже Соломон во всей своей славе не был одет так, как один из этих цветов.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Но говорю вам
  rationale: δέ обозначает мягкое противопоставление предыдущему утверждению; конструкция с дательным ὑμῖν естественно передаётся как «говорю вам».
- source_word: οὐδὲ Σολομὼν
  choice: даже Соломон не
  rationale: Передаёт усиленное отрицание οὐδέ и подчёркивает, что сравнения не выдерживает даже прославленный своим великолепием царь.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: во всей своей славе
  rationale: δόξα здесь означает царское великолепие; «слава» сохраняет широкий смысл исходного слова и привычное библейское звучание.
- source_word: περιεβάλετο
  choice: одевался
  rationale: Форма среднего залога естественно допускает активное русское выражение «одевался»; оно передаёт образ одежды без неестественной пассивной конструкции.
- source_word: ὡς ἓν τούτων
  choice: так, как любой из этих цветов
  rationale: ἓν указывает на один отдельный предмет из упомянутых ранее полевых цветов. Слово «цветов» ясно восстанавливает подразумеваемый референт, а «любой» естественно выражает распределительный смысл сравнения.
theological_decisions:
- issue: Значение δόξα применительно к Соломону
  choice: «слава» в смысле царского великолепия
  alternative: «великолепие»
  rationale: Контекст говорит о внешнем блеске и роскошном одеянии Соломона, а не о божественной славе. При этом «слава» сохраняет лексическую широту греческого слова и не привносит дополнительного толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис сделан естественным для прямой речи; подразумеваемые в греческом «цветы» названы явно ради понятности в отдельном стихе.
