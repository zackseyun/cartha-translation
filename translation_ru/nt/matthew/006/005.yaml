source:
  edition: SBLGNT
  text: Καὶ ὅταν ⸂προσεύχησθε, οὐκ ἔσεσθε ὡς⸃ οἱ ὑποκριταί· ὅτι φιλοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς γωνίαις τῶν πλατειῶν ἑστῶτες προσεύχεσθαι, ⸀ὅπως φανῶσιν τοῖς ἀνθρώποις· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσι τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/005.yaml
  text: And whenever you pray[a], you shall not be like the hypocrites, because they love to stand and pray in the synagogues and on the corners of the broad streets, so that they may be seen by people. Truly I say to you[c][b], they have received their reward.
translation:
  language: ru
  text: 'И когда молитесь, не будьте как лицемеры: они любят молиться стоя в синагогах и на углах широких улиц[a], чтобы люди их видели. Истинно говорю вам: они уже получили свою награду[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на углах улиц». Буквально: «на углах широких улиц».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий глагол может иметь смысл получения причитающегося полностью: «они получили свою награду сполна».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν προσεύχησθε
  choice: когда молитесь
  rationale: Русское «когда» с глаголом несовершенного вида естественно передаёт общее, повторяющееся условие, выраженное ὅταν с настоящим сослагательным.
- source_word: οὐκ ἔσεσθε ὡς
  choice: не будьте как
  rationale: Будущее изъявительное имеет здесь запретительно-наставительный смысл; современное русское повелительное наклонение передаёт его ясно и без архаизации.
- source_word: ὑποκριταί
  choice: лицемеры
  rationale: Общепринятый и контекстуально точный эквивалент для людей, выставляющих благочестие напоказ.
- source_word: φιλοῦσιν
  choice: любят
  rationale: Сохраняет выраженную в греческом склонность и удовольствие от публичного поведения.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: в синагогах
  rationale: Сохраняет историческую конкретность иудейской обстановки.
- source_word: ἐν ταῖς γωνίαις τῶν πλατειῶν
  choice: на углах широких улиц
  rationale: 'Близко передаёт буквальный образ: πλατεῖαι — широкие улицы или общественные проезды; более привычное «на углах улиц» вынесено в примечание.'
- source_word: ἑστῶτες προσεύχεσθαι
  choice: молиться стоя
  rationale: Причастие указывает на положение во время молитвы; такой порядок слов естественен по-русски и не представляет само стояние отдельной целью.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις
  choice: чтобы показаться перед людьми
  rationale: Передаёт цель публичной молитвы и допускаемый глаголом оттенок появления на виду; ἀνθρώποις здесь обозначает людей вообще.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Истинно говорю вам
  rationale: Сохраняет торжественную формулу Иисуса в понятном современном литературном русском.
- source_word: ἀπέχουσι τὸν μισθὸν αὐτῶν
  choice: они уже получили свою награду
  rationale: «Уже получили» передаёт расчётный оттенок ἀπέχω — получение причитающегося; слово «полностью» не добавлено в основной текст, чтобы не делать подразумеваемый смысл излишне явным.
theological_decisions:
- issue: Характер предупреждения о награде
  choice: они уже получили свою награду
  alternative: они получили награду сполна
  rationale: Формулировка сохраняет мысль, что искомое человеческое признание уже стало их наградой, но не вводит сверх текста уточнение о том, что иной награды непременно не будет.
- issue: Значение τοῖς ἀνθρώποις
  choice: перед людьми
  alternative: перед мужчинами
  rationale: В данном контексте существительное обозначает людей вообще, а не только лиц мужского пола.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельского наставления. Синтаксис сделан естественным для широкого читателя; исторические реалии и выразительная формула «Истинно говорю вам» сохранены.
