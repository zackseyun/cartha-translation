  source_fidelity: 'Смысл в целом передан верно: повеление, три земледельческих действия, Божье попечение и риторическое сравнение сохранены. Однако «небесных птиц» в современном русском легко понимается как «небесные/неземные птицы», а союз «но» вводит отсутствующее в греческом противопоставление.'
  naturalness: Фраза в целом литературна, но «птиц в небе» естественнее обозначает птиц видимого неба в данном контексте. «А ваш Небесный Отец» сохраняет сопоставление без искусственного противопоставления.
  terminology: «Небесный Отец», «кормит» и «гораздо ценнее» уместны и точны. «В хранилища» допустимо для ἀποθήκας; опущенный объект при «собирают» естественно восстанавливается из контекста и не сужает значение до одного лишь урожая.
