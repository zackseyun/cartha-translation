source:
  edition: SBLGNT
  text: ἐμβλέψατε εἰς τὰ πετεινὰ τοῦ οὐρανοῦ ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν εἰς ἀποθήκας, καὶ ὁ πατὴρ ὑμῶν ὁ οὐράνιος τρέφει αὐτά· οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/026.yaml
  text: Look at the birds of the sky[a], that they do not sow or reap or gather into barns, and your heavenly Father feeds them[b]. Are you not of much more value than they are?
translation:
  language: ru
  text: 'Посмотрите на птиц в небе[a]: они не сеют, не жнут и не собирают в хранилища, а ваш Небесный Отец кормит их. Разве вы не гораздо ценнее их?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на птиц небес»; традиционно: «на птиц небесных».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψατε
  choice: Посмотрите на
  rationale: Аористный императив требует направить внимание на птиц; «посмотрите на» естественно и без лишнего усиления передаёт повеление.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: небесных птиц
  rationale: πετεινά означает птиц или летающих существ, а τοῦ οὐρανοῦ здесь указывает на видимое небо. Русское «небесные птицы» сохраняет образ и соответствует устойчивому литературному употреблению; возможный вариант отмечен в сноске.
- source_word: ὅτι
  choice: ': они'
  rationale: После призыва посмотреть ὅτι вводит наблюдаемое обстоятельство. Двоеточие и отдельное предложение естественно выражают эту связь по-русски, не вынуждая выбирать между строго причинным «потому что» и изъяснительным «что».
- source_word: οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν
  choice: не сеют, не жнут и не собирают урожай
  rationale: Сохранена последовательность земледельческих действий. Добавление «урожай» естественно обозначает подразумеваемый объект συνάγουσιν и делает фразу ясной по-русски.
- source_word: εἰς ἀποθήκας
  choice: в хранилища
  rationale: ἀποθήκη обозначает место хранения припасов или урожая. «Хранилища» шире, чем «амбары», и точно передаёт исходное значение.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: ваш Небесный Отец
  rationale: Сохраняет обращённое к слушателям «ваш», родственное наименование «Отец» и характеристику οὐράνιος. Прописные буквы соответствуют современному благоговейному библейскому регистру.
- source_word: τρέφει
  choice: кормит
  rationale: В данном контексте глагол прямо означает обеспечение пищей; «кормит» — наиболее простой и точный русский эквивалент.
- source_word: οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
  choice: Разве вы не гораздо ценнее их?
  rationale: Риторический вопрос предполагает утвердительный ответ. «Гораздо ценнее» естественно передаёт превосходство по ценности, выраженное μᾶλλον διαφέρετε, не объясняя его основание сверх сказанного в тексте.
theological_decisions:
- issue: Сравнительная ценность людей и птиц в доводе Иисуса
  choice: Текст утверждает, что слушатели Иисуса гораздо ценнее птиц, не называя основания этой большей ценности.
  alternative: Связать большую ценность людей непосредственно с образом Божьим или исключительно с заветными отношениями.
  rationale: Стих ясно выражает сравнение, но сам не формулирует его доктринального основания; перевод не должен добавлять такое объяснение.
- issue: Божье обеспечение птиц и человеческий труд
  choice: Сохранено прямое утверждение, что Отец кормит птиц, без вывода о ненужности человеческого труда.
  alternative: Разъяснить в тексте, что людям всё же следует трудиться и планировать.
  rationale: Такое разъяснение может быть верным в более широком контексте, но в данном стихе оно не высказано и ослабило бы напряжение образа.
translation_notes:
  register: Современный литературный русский с ясным, dignified библейским звучанием. Синтаксис упрощён двоеточием после повеления, при этом сохранены земледельческий образ, риторический вопрос и богословская недосказанность исходного текста.
