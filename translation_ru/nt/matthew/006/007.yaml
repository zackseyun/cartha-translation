  text: Προσευχόμενοι δὲ μὴ βατταλογήσητε ὥσπερ οἱ ἐθνικοί, δοκοῦσιν γὰρ ὅτι ἐν τῇ πολυλογίᾳ αὐτῶν εἰσακουσθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/007.yaml
  text: And when you pray[a], do not heap up empty words like the Gentiles[b], for they think that they will be heard because of their many words.
translation:
  language: ru
  text: А молясь, не нагромождайте пустых слов, как язычники[a], ведь они думают, что благодаря многословию будут услышаны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как люди из других народов». Здесь имеются в виду народы, не входящие в народ завета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσευχόμενοι δὲ
  choice: А молясь
  rationale: Причастие естественно передаёт обстоятельство, при котором действует запрет; δέ продолжает ряд наставлений и по-русски уместно выражено частицей «а».
- source_word: μὴ βατταλογήσητε
  choice: не нагромождайте пустых слов
  rationale: Редкий глагол, вероятно, обозначает пустую, механическую или многословную речь. Перевод сохраняет оттенки пустоты и избыточности, не представляя любой повтор в молитве предосудительным.
- source_word: ὥσπερ οἱ ἐθνικοί
  choice: как язычники
  rationale: В данном иудейском контексте слово обозначает людей из народов вне народа завета. «Язычники» — естественный и понятный русский эквивалент; буквальный оттенок пояснён в сноске.
- source_word: δοκοῦσιν
  choice: они думают
  rationale: Прямо и естественно передаёт их ошибочное представление.
- source_word: ἐν τῇ πολυλογίᾳ αὐτῶν
  choice: благодаря многословию
  rationale: Предложная конструкция указывает на основание, по которому они рассчитывают быть услышанными; «многословие» точно и лаконично передаёт πολυλογία.
- source_word: εἰσακουσθήσονται
  choice: будут услышаны
  rationale: Сохраняет пассивную форму и смысл благосклонного выслушивания, не усиливая его до обязательного получения ответа.
theological_decisions:
- issue: Запрещает ли Иисус всякое повторение в молитве или пустую многословную речь
  choice: «не нагромождайте пустых слов» — запрет пустого и рассчитанного на эффект многословия
  alternative: «не повторяйте одно и то же»; «не лепечите»
  rationale: Редкий глагол допускает оттенки бессодержательного повторения, лепета и многословия. Основной вариант не превращает стих в запрет всякой искренней повторной молитвы и сохраняет направленность критики на попытку добиться Божьего внимания количеством слов.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Нагромождайте пустых слов» выразительно передаёт редкий греческий глагол, а «благодаря многословию» сохраняет причинный смысл и ошибочную логику молящихся.
