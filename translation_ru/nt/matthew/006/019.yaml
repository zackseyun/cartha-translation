source:
  edition: SBLGNT
  text: Μὴ θησαυρίζετε ὑμῖν θησαυροὺς ἐπὶ τῆς γῆς, ὅπου σὴς καὶ βρῶσις ἀφανίζει, καὶ ὅπου κλέπται διορύσσουσιν καὶ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/019.yaml
  text: Do not store up for yourselves treasures on earth[a], where moth and decay destroy[b], and where thieves break in and steal.
translation:
  language: ru
  text: Не копите себе сокровищ на земле, где моль и тление уничтожают[a], и где воры вламываются[b] и крадут.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ржавчина уничтожает». Греческое слово может обозначать поедание, разъедание и вообще разрушительную порчу, а не только коррозию металла.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «прокапывают»; вероятно, имеются в виду воры, проламывающие стены домов, сложенные из сырцового кирпича.'
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ θησαυρίζετε
  choice: Не накапливайте
  rationale: Запрет с μή и формой настоящего времени передаёт повеление не заниматься накоплением; «накапливайте» естественно выражает идею собирания запасов.
- source_word: ὑμῖν
  choice: себе
  rationale: 'Дательный здесь имеет возвратный смысл: сокровища накапливаются для самих себя.'
- source_word: θησαυροὺς
  choice: сокровищ
  rationale: Прямое и достаточно широкое соответствие, охватывающее ценное имущество, а не только деньги.
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Естественное русское обозначение земной сферы в подразумеваемом противопоставлении небу.
- source_word: σὴς
  choice: моль
  rationale: Прямое соответствие; речь может идти о порче хранимой одежды и других ценностей.
- source_word: βρῶσις
  choice: тление
  rationale: Слово буквально связано с поеданием и может обозначать разъедающую порчу шире, чем одна лишь ржавчина; «тление» сохраняет широту и сочетается с книжным достоинством речи.
- source_word: ἀφανίζει
  choice: уничтожают
  rationale: Передаёт причинение исчезновения, гибели или полной порчи; множественное число естественно согласует два однородных действующих начала в русском.
- source_word: κλέπται
  choice: воры
  rationale: Прямое современное соответствие.
- source_word: διορύσσουσιν
  choice: подкапываются
  rationale: Сохраняет конкретный образ буквального прокапывания или проламывания стены, не сводя его к общему «проникают».
- source_word: κλέπτουσιν
  choice: крадут
  rationale: Прямое соответствие глаголу кражи.
theological_decisions:
- issue: Земная сфера в ἐπὶ τῆς γῆς
  choice: на земле
  alternative: на этой земле
  rationale: «На земле» ясно сохраняет противопоставление небесному в ближайшем контексте и не добавляет отсутствующего в греческом указательного оттенка.
- issue: Широта значения βρῶσις
  choice: тление
  alternative: ржавчина
  rationale: Греческое слово обозначает поедание или разъедающую порчу и не ограничено окислением металла. Выбор сохраняет обобщённую уязвимость земных сокровищ; традиционная конкретизация отмечена в сноске.
- issue: Образ διορύσσουσιν
  choice: подкапываются
  alternative: проникают
  rationale: Более конкретный вариант сохраняет культурно обусловленный образ воров, прокапывающих или проламывающих стену, без изменения богословского смысла.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Не накапливайте» понятно современному читателю; «тление» сохраняет смысловую широту и достоинство регистра. Конкретный образ «подкапываются» оставлен в тексте и разъяснён в сноске.
