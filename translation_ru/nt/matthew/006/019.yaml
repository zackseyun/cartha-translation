  to: Не копите себе сокровищ на земле, где моль и тление уничтожают[a], и где воры вламываются[b] и крадут.
  rationale: Исправление ограничено естественностью и точностью передачи способа проникновения воров. «Вламываются» передаёт результат и функцию διορύσσουσιν в современном русском, а сноска сохраняет буквальный образ. «Копите» делает запрет более естественным, не меняя значения. Сноски и их якоря сохранены и соответствуют словам, которые они поясняют.
