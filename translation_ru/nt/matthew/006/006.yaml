  text: σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/006.yaml
  text: But when you pray[a], go into your inner room, and after shutting your door, pray to your Father who is in secret; and your Father, who sees in secret[b], will reward you.
translation:
  language: ru
  text: Ты же, когда молишься, войди в свою внутреннюю комнату[a] и, закрыв дверь, помолись своему Отцу, пребывающему втайне; и твой Отец, видящий втайне, воздаст тебе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уединённую комнату», «кладовую»; традиционно: «клеть». Греческое слово обозначает внутреннее помещение, пригодное для уединения или хранения припасов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вознаградит тебя», «отплатит тебе». Греческий глагол может означать «отдать», «воздать» или «вознаградить» в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Ты же
  rationale: Местоимение с частицей δέ подчёркивает противопоставление лицемерам из предыдущего стиха; русское «ты же» естественно передаёт этот контраст.
- source_word: ὅταν προσεύχῃ
  choice: когда молишься
  rationale: Сочетание ὅταν с сослагательным наклонением обозначает общее, повторяющееся обстоятельство; настоящее время в русском естественно передаёт этот смысл.
- source_word: εἴσελθε εἰς τὸ ταμεῖόν σου
  choice: войди в свою внутреннюю комнату
  rationale: ταμεῖον обозначает внутреннее, уединённое помещение, нередко служившее кладовой. «Внутренняя комната» сохраняет пространственный и уединённый характер слова без вводящих в заблуждение современных ассоциаций.
- source_word: κλείσας τὴν θύραν σου
  choice: закрыв дверь
  rationale: Аористное причастие выражает действие, предшествующее молитве; русский деепричастный оборот ясно и естественно сохраняет последовательность.
- source_word: πρόσευξαι τῷ πατρί σου
  choice: помолись своему Отцу
  rationale: Передаёт повелительную форму и сохраняет данное в тексте прямое, личностное именование Бога без добавления слова «Небесному».
- source_word: τῷ ἐν τῷ κρυπτῷ
  choice: Который втайне
  rationale: Краткая формулировка сохраняет неоднозначность греческого выражения между сокрытым присутствием и нахождением в тайном месте.
- source_word: ὁ βλέπων ἐν τῷ κρυπτῷ
  choice: видящий тайное
  rationale: Естественная русская формулировка передаёт способность Отца видеть скрытое и поддерживает словесную связь с предшествующим «втайне».
- source_word: ἀποδώσει σοι
  choice: воздаст тебе
  rationale: «Воздаст» сохраняет диапазон значений ἀποδίδωμι — дать в ответ, отплатить, наградить — и не уточняет характер ответа сверх текста.
theological_decisions:
- issue: Значение повторённого выражения ἐν τῷ κρυπτῷ
  choice: «втайне» применительно к Отцу и «тайное» применительно к Его видению
  alternative: «в тайном месте» / «видящий втайне» / «видящий происходящее втайне»
  rationale: Перевод сохраняет контраст между сокрытой молитвой и публичной демонстрацией, не сводя выражение исключительно к физическому месту или только к образу действия.
- issue: Обозначение Бога словом πατήρ
  choice: Отец
  alternative: Небесный Отец
  rationale: В данном стихе стоит только «Отец»; добавление «Небесный» внесло бы формулировку из контекста, которой здесь нет.
- issue: Характер обещанного действия ἀποδώσει
  choice: воздаст
  alternative: вознаградит / отплатит
  rationale: Выбранное слово сохраняет положительный смысл контекста, не определяя заранее ни форму, ни время, ни природу Божьего ответа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Ты же» удерживает контраст, «помолись» звучит естественно, а «втайне» и «воздаст» сохраняют богословскую напряжённость и смысловую открытость оригинала.
