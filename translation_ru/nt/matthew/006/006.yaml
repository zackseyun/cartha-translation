  source_fidelity: 'Основной смысл передан точно: сохранены противопоставление «ты же», вход во внутреннее помещение, закрывание двери, обращение к Отцу и будущее Божье воздаяние. Однако повторенное ἐν τῷ κρυπτῷ в оригинале должно быть отражено более последовательно: «видящий тайное» превращает предложную конструкцию «в сокрытом/тайно» в прямой объект и тем самым несколько сужает формулировку.'
  naturalness: «Внутренняя комната» и «помолись» соответствуют современному литературному русскому. Формула «Отец, Который втайне» допустима в библейском регистре, но для ясности современного текста естественнее «Отец, пребывающий втайне»; это минимально эксплицирует подразумеваемое в русском сказуемое, не делая выражение чисто пространственным.
  terminology: '«Отец» передает πατήρ без добавления «Небесный». «Воздаст тебе» сохраняет широкий смысл ἀποδώσει, хотя имеет умеренно возвышенную окраску, уместную в данном регистре. В сноске a «традиционно: комнату» неточно как характеристика традиционного русского библейского перевода и не является содержательной альтернативой; ее следует заменить пояснением о традиционном «клеть».'
