  to: Ты же, когда молишься, войди в свою внутреннюю комнату[a] и, закрыв дверь, помолись своему Отцу, пребывающему втайне; и твой Отец, видящий втайне, воздаст тебе[b].
  rationale: Правка восстанавливает в русском тексте риторическое повторение ἐν τῷ κρυπτῷ и не превращает второе употребление в явно выраженный объект действия. «Пребывающему» служит минимальной русской синтаксической опорой для определения «втайне», сохраняя его смысловую открытость между сокрытым присутствием и тайным местом. Сноска a уточнена без изменения смысла стиха.
