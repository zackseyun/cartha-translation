  text: καὶ περὶ ἐνδύματος τί μεριμνᾶτε; καταμάθετε τὰ κρίνα τοῦ ἀγροῦ πῶς ⸂αὐξάνουσιν· οὐ κοπιῶσιν οὐδὲ νήθουσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/028.yaml
  text: 'And why are you anxious about clothing? Consider the lilies of the field[a], how they grow: they do not labor[c][b], nor do they spin.'
translation:
  language: ru
  text: 'И почему вы тревожитесь об одежде? Посмотрите, как растут полевые лилии[a]: они не трудятся и не прядут.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полевые цветы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ ἐνδύματος
  choice: об одежде
  rationale: Единственное число обозначает одежду как общую потребность, а не один конкретный предмет.
- source_word: τί μεριμνᾶτε
  choice: что вы тревожитесь?
  rationale: В данном вопросе τί имеет значение «почему», а μεριμνάω обозначает тревожную заботу; оборот естественно продолжает предшествующее наставление.
- source_word: καταμάθετε
  choice: посмотрите
  rationale: Императив призывает внимательно наблюдать и сделать вывод; «посмотрите» звучит естественно и не вносит лишнего усиления.
- source_word: τὰ κρίνα τοῦ ἀγροῦ
  choice: полевые лилии
  rationale: κρίνα прямо означает лилии, а τοῦ ἀγροῦ указывает на растения, растущие в поле; более широкое понимание отмечено в сноске.
- source_word: πῶς αὐξάνουσιν
  choice: как растут
  rationale: αὐξάνω здесь обозначает естественный рост растений.
- source_word: οὐ κοπιῶσιν
  choice: они не трудятся
  rationale: κοπιάω означает усердно или тяжело трудиться; «трудятся» сохраняет смысл и параллелизм.
- source_word: οὐδὲ νήθουσιν
  choice: и не прядут
  rationale: νήθω означает прясть нить; дополнение в русском не требуется.
theological_decisions:
- issue: Смысл μεριμνάω в наставлении Иисуса о Божьем обеспечении
  choice: тревожитесь
  alternative: заботитесь / беспокоитесь
  rationale: «Тревожитесь» передаёт беспокойную озабоченность, не превращая слова Иисуса в общий запрет разумной заботы.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Начальное «И» сохранено как связь с предыдущим высказыванием. Формулировка «что вы тревожитесь?» умеренно возвышенная, но понятная; двоеточие объединено с предшествующим оборотом в естественную русскую конструкцию.
