  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὅταν οὖν ποιῇς ἐλεημοσύνην, μὴ σαλπίσῃς ἔμπροσθέν σου, ὥσπερ οἱ ὑποκριταὶ ποιοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις, ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/002.yaml
  text: Therefore[a], whenever you give alms, do not sound a trumpet before you, as the hypocrites do in the synagogues and in the streets, so that they may be glorified by people. Truly I say to you[e][d][c][b], they have received their reward in full.
translation:
  language: ru
  text: 'Итак, когда подаёшь милостыню[a], не труби перед собой[b], как делают лицемеры в синагогах и на улицах, чтобы люди прославляли их[c]. Истинно говорю вам: они уже получили свою награду сполна[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помогаешь нуждающимся», «совершаешь дела милосердия». Греческое выражение обозначает благотворительную помощь.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не труби перед собой». Это может быть гиперболой или образным выражением, но в греческом тексте прямо упомянута труба.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «хвалили их», «почитали их». Греческий глагол буквально означает «прославлять».'
    reason: lexical_alternative
  - marker: d
    text: 'Выражение имеет оттенок коммерческой расписки: они уже получили всю причитающуюся им награду, и больше им ничего не положено.'
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Итак, когда
  rationale: «Когда» естественно передаёт неопределённо-временную конструкцию с сослагательным наклонением, обозначающую всякий подобный случай; «итак» сохраняет связь с предшествующим наставлением.
- source_word: ποιῇς ἐλεημοσύνην
  choice: подаёшь милостыню
  rationale: Устойчивое и понятное русское выражение для благотворительной помощи нуждающимся; оно передаёт греческую идиому, а не буквальное «делать милостыню».
- source_word: μὴ σαλπίσῃς ἔμπροσθέν σου
  choice: не труби перед собой
  rationale: Сохраняется буквальный и яркий образ трубы, не решая однозначно, следует ли понимать его как гиперболу, метафору или описание действия.
- source_word: οἱ ὑποκριταί
  choice: лицемеры
  rationale: Общепринятый русский эквивалент для людей, демонстрирующих благочестие напоказ.
- source_word: ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις
  choice: в синагогах и на улицах
  rationale: Точно и естественно обозначает религиозные собрания и публичное городское пространство.
- source_word: ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων
  choice: чтобы люди прославляли их
  rationale: Активная русская конструкция звучит естественно и сохраняет сильное значение δοξάζω; ἄνθρωποι здесь обозначает людей вообще.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Истинно говорю вам
  rationale: Традиционная, ясная и торжественная передача авторитетной формулы Иисуса без замены семитизма менее прозрачным заимствованием «аминь».
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: они уже получили свою награду сполна
  rationale: 'Передаёт коммерческий оттенок ἀπέχω: сумма получена полностью, и больше ничего не причитается.'
theological_decisions:
- issue: Кто выражает одобрение в ὑπὸ τῶν ἀνθρώπων
  choice: люди
  alternative: мужчины; другие
  rationale: Греческое слово употреблено обобщённо и не ограничивает наблюдателей мужчинами.
- issue: Сила глагола δοξασθῶσιν
  choice: прославляли
  alternative: хвалили; почитали
  rationale: Более сильное «прославляли» сохраняет лексику оригинала и риторическое напряжение между человеческим признанием и наградой, не сводя смысл к обычной похвале.
- issue: Характер награды
  choice: получили свою награду сполна
  alternative: имеют свою награду; получают свою плату
  rationale: Коммерческая идиома указывает на исчерпывающее получение причитающегося, однако перевод не уточняет сверх текста, от кого могла бы исходить иная награда.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранены традиционно узнаваемые «милостыня», «лицемеры», «Истинно говорю вам», но синтаксис остаётся естественным для современного читателя. Буквальный образ трубы и сильный глагол «прославляли» намеренно не сглажены.
