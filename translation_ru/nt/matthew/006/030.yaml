  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ δὲ τὸν χόρτον τοῦ ἀγροῦ σήμερον ὄντα καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ἀμφιέννυσιν, οὐ πολλῷ μᾶλλον ὑμᾶς, ὀλιγόπιστοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/030.yaml
  text: But if God so clothes the grass of the field[a], which is here today and tomorrow is thrown into an oven, will he not much more clothe you[b], you of little faith?
translation:
  language: ru
  text: Если же Бог так одевает полевую траву, которая сегодня есть, а завтра будет брошена в печь[a], то разве Он не тем более оденет вас, маловеры[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имеется в виду печь для выпечки; высохшую траву и другие полевые растения могли использовать как топливо.
    reason: cultural_note
  - marker: b
    text: 'Или: «люди малой веры». Греческое ὀλιγόπιστοι — прямое обращение с укором за недостаток доверия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Если же
  rationale: Частица δέ обозначает мягкий переход и лёгкое противопоставление; «же» естественно передаёт этот поворот мысли без излишне резкого «но».
- source_word: τὸν χόρτον τοῦ ἀγροῦ
  choice: полевую траву
  rationale: χόρτος обозначает траву или травянистую растительность. Собирательное «полевая трава» естественно по-русски и не сужает образ до цветов.
- source_word: σήμερον ὄντα
  choice: которая сегодня есть
  rationale: Буквальное значение причастия ὄντα — «существующая, имеющаяся». Такая формулировка сохраняет мысль о кратковременности травы, не добавляя отсутствующего в греческом глагола «растёт».
- source_word: αὔριον εἰς κλίβανον βαλλόμενον
  choice: а завтра будет брошена в печь
  rationale: κλίβανος — печь, прежде всего печь для выпечки, а не металлургическая печь. Будущая пассивная конструкция естественно передаёт соотнесённое с «завтра» настоящее страдательное причастие.
- source_word: οὕτως ἀμφιέννυσιν
  choice: так одевает
  rationale: ἀμφιέννυμι означает «одевать, облачать». «Одевает» сохраняет метафору Божьей заботы и связь с окружающим контекстом.
- source_word: οὐ πολλῷ μᾶλλον
  choice: то не гораздо ли больше
  rationale: Формулировка передаёт риторический вопрос и ход рассуждения от меньшего к большему.
- source_word: ὑμᾶς
  choice: оденет вас
  rationale: В греческом повтор глагола подразумевается; в русском он восстановлен ради ясности и естественности.
- source_word: ὀλιγόπιστοι
  choice: маловеры
  rationale: Это обращение во множественном числе с укоряющим оттенком. «Маловеры» кратко сохраняет прямое обращение и значение недостаточной веры.
theological_decisions:
- issue: Довод о Божьей заботе от меньшего к большему
  choice: 'Сохранён риторический вопрос: Бог тем более оденет учеников, если одевает недолговечную полевую траву.'
  alternative: Передать эту мысль как утвердительное предложение.
  rationale: Греческая конструкция с οὐ и завершающее обращение поддерживают именно риторический вопрос, усиливающий призыв доверять Богу, но не добавляющий иных богословских утверждений.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским достоинством. Синтаксис сохраняет развёрнутый условный период и риторическую силу оригинала; архаизмы устранены, а образ одежды и печи сохранён.
