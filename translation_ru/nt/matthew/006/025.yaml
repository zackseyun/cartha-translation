source:
  edition: SBLGNT
  text: Διὰ τοῦτο λέγω ὑμῖν· μὴ μεριμνᾶτε τῇ ψυχῇ ὑμῶν τί ⸀φάγητε, μηδὲ τῷ σώματι ὑμῶν τί ἐνδύσησθε· οὐχὶ ἡ ψυχὴ πλεῖόν ἐστι τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/025.yaml
  text: Therefore I tell you[a], do not worry about your life, what you will eat, or about your body, what you will wear. Is not life more than food, and the body than clothing?
translation:
  language: ru
  text: 'Поэтому говорю вам: не тревожьтесь о своей жизни — о том, что вам есть, — ни о своём теле — о том, во что одеться. Разве жизнь не больше, чем пища, и тело — чем одежда?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего наставления и сохраняет явную логическую связь.
- source_word: μεριμνᾶτε
  choice: не тревожьтесь
  rationale: Глагол обозначает тревожную, поглощающую заботу; этот вариант естественен в современном русском и не запрещает всякую разумную предусмотрительность.
- source_word: ψυχῇ / ψυχὴ
  choice: жизни / жизнь
  rationale: В контексте еды и телесных нужд ψυχή означает жизнь человека, а не специально нематериальную душу; сноска сохраняет возможную лексическую альтернативу.
- source_word: τί φάγητε
  choice: что вам есть
  rationale: Естественно передаёт содержание беспокойства о будущем пропитании без избыточного добавления будущего времени.
- source_word: σώματι / σῶμα
  choice: теле / тело
  rationale: Прямое обозначение физического тела в сопоставлении с одеждой.
- source_word: τί ἐνδύσησθε
  choice: во что одеться
  rationale: Современный и идиоматичный русский эквивалент, сохраняющий идею обеспечения себя одеждой.
- source_word: οὐχὶ
  choice: Разве ... не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ.
- source_word: πλεῖόν
  choice: больше
  rationale: Сохраняет широкое сравнительное значение, не сводя его исключительно к цене или достоинству.
- source_word: τροφῆς
  choice: пищи
  rationale: Точное и стилистически достойное общее обозначение того, что поддерживает жизнь.
- source_word: ἐνδύματος
  choice: одежды
  rationale: Естественное собирательное обозначение одежды, параллельное слову «пища».
theological_decisions:
- issue: Значение ψυχή в наставлении Иисуса
  choice: «жизнь»
  alternative: «душа»
  rationale: Ближайший контекст говорит о еде, теле и одежде, поэтому здесь ψυχή естественнее понимать как земную жизнь человека. Сноска сохраняет подлинную широту греческого слова и не навязывает антропологического толкования.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной интонацией. Сохранены логическая связь с предыдущим высказыванием, параллелизм частей стиха и риторическая форма заключительного вопроса.
