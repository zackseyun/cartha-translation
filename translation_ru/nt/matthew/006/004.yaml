  text: so that your giving to the poor may be in secret[b][a]; and your Father who sees in secret will reward you.
translation:
  language: ru
  text: чтобы твоя помощь бедным была в тайне; и твой Отец, видящий в тайне, воздаст тебе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наградит тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως ᾖ
  choice: чтобы… оставалась
  rationale: Передаёт цель, выраженную ὅπως с сослагательным наклонением, и естественно связывает стих с предшествующим наставлением.
- source_word: ἡ ἐλεημοσύνη
  choice: твоя помощь бедным
  rationale: Конкретно передаёт значение милостыни как материальной помощи нуждающимся, оставаясь понятным современному читателю.
- source_word: ἐν τῷ κρυπτῷ
  choice: в тайне / тайное
  rationale: Сохраняет повтор ключевого понятия сокрытости в обеих частях стиха; во второй части субстантивированное «тайное» звучит по-русски естественнее, чем буквальное повторение «в тайне» после глагола зрения.
- source_word: ὁ πατήρ σου
  choice: твой Отец
  rationale: Следует греческому тексту, где нет определения «Небесный», и сохраняет почтительное написание обозначения Бога с прописной буквы.
- source_word: ὁ βλέπων
  choice: видящий
  rationale: Кратко и естественно передаёт субстантивированное причастие настоящего времени без добавочного толкования.
- source_word: ἀποδώσει σοι
  choice: воздаст тебе
  rationale: Сохраняет широкое значение ответного воздаяния и не уточняет вид или время награды.
theological_decisions:
- issue: Характер Божьего воздаяния в ἀποδώσει
  choice: воздаст тебе
  alternative: наградит тебя
  rationale: «Воздаст» сохраняет смысл ответного действия и намеренно не определяет, будет ли воздаяние земным или вечным, материальным или духовным.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. «Помощь бедным» яснее устаревающего слова «милостыня» и точнее общего «благотворительность». Синтаксис сохраняет целевую связь с предыдущим стихом.
