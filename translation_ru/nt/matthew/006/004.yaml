  naturalness: «Чтобы твоя помощь бедным была в тайне; и твой Отец, видящий в тайне, воздаст тебе» — естественный литературный русский с уместным библейским регистром. Хотя «видящий в тайне» может быть стилистически менее разговорным, он сохраняет форму и повтор исходного текста без истолковывающей замены «видящий тайное».
  terminology: «Помощь бедным» удачно и ясно передаёт ἐλεημοσύνη как милостыню/подаяние нуждающимся, а не общую благотворительность. «Отец» с прописной буквы уместен в данном контексте. Альтернатива «наградит тебя» допустима, но основной вариант «воздаст тебе» лучше сохраняет широту ἀποδώσει.
