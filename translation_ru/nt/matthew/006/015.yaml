  text: ἐὰν δὲ μὴ ἀφῆτε τοῖς ⸀ἀνθρώποις, οὐδὲ ὁ πατὴρ ὑμῶν ἀφήσει τὰ παραπτώματα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/015.yaml
  text: But if you do not forgive people[a], neither will your Father forgive your trespasses.
translation:
  language: ru
  text: Но если вы не простите людей, то и ваш Отец не простит ваших проступков.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прегрешений»; также возможно: «нарушений».'
    reason: Лексема παραπτώματα допускает несколько близких по смыслу вариантов; примечание сохраняет её смысловой диапазон.
lexical_decisions:
- source_word: ἐὰν δὲ μὴ
  choice: Но если ... не
  rationale: ἐάν вводит условие, δέ противопоставляет его предыдущему утверждению, а μή выражает отрицание; современное русское «Но если ... не» естественно передаёт эту структуру.
- source_word: ἀφῆτε
  choice: прощаете
  rationale: В контексте межличностных проступков ἀφίημι означает «прощать». Настоящее время русского глагола в условной конструкции естественно передаёт греческий аорист конъюнктива, не превращая речь в указание на единственный случай.
- source_word: τοῖς ἀνθρώποις
  choice: людям
  rationale: ἄνθρωποι обозначает людей вообще, без указания только на мужчин; «людям» точно и естественно.
- source_word: οὐδὲ
  choice: то и ... не
  rationale: Русская соотносительная конструкция «то и ... не» ясно передаёт отрицательное соответствие οὐδέ и сохраняет параллелизм условия и следствия.
- source_word: ὁ πατὴρ ὑμῶν
  choice: ваш Отец
  rationale: Греческий текст говорит «ваш Отец» без определения «небесный»; добавлять его не следует.
- source_word: ἀφήσει
  choice: простит
  rationale: Будущее время передано прямо; тот же русский корень, что и в первой части, сохраняет повтор ἀφίημι и взаимную структуру высказывания.
- source_word: τὰ παραπτώματα ὑμῶν
  choice: ваших проступков
  rationale: παράπτωμα означает проступок, нарушение или прегрешение. «Проступки» сохраняет нравственный смысл, понятно современному читателю и не звучит излишне архаично.
theological_decisions:
- issue: Условная связь между прощением людей и Божьим прощением
  choice: 'Сохранить прямую условную формулировку: «если ... не прощаете, то и ... не простит».'
  alternative: Истолковать человеческое прощение лишь как признак уже полученного прощения либо заменить прощение утратой общения.
  rationale: Греческий текст прямо выражает условие и соответствующее отрицательное следствие. Перевод сохраняет богословское напряжение, не разрешая его посредством конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Людям» передаёт родовую инклюзивность, а «проступков» избегает как чрезмерной архаики, так и ослабляющего пересказа. Маркер примечания поставлен непосредственно после слова, к которому оно относится.
