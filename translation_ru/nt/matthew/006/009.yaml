lexical_decisions:
- source_word: Οὕτως
  choice: так
  rationale: Наречие указывает на образец и способ молитвы. Русское «так» естественно вводит последующие слова как пример того, как следует молиться.
- source_word: οὖν
  choice: итак
  rationale: Сохраняет выводный переход от предшествующего наставления Иисуса и звучит естественно в современном русском языке.
- source_word: προσεύχεσθε ὑμεῖς
  choice: вы молитесь
  rationale: Форма повелительного наклонения во втором лице множественного числа передана как прямое наставление. Отдельное «вы» отражает выраженное в греческом тексте и потому несколько подчёркнутое ὑμεῖς.
- source_word: Πάτερ ἡμῶν
  choice: Отец наш
  rationale: Сохраняет прямое обращение и общий для молящихся характер местоимения «наш», а также привычный для русского молитвенного языка порядок слов без архаизации всей фразы.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: Который на небесах
  rationale: Передаёт определительную функцию ὁ и сохраняет множественное число τοῖς οὐρανοῖς. «На небесах» естественно и понятно по-русски, тогда как «Небесный Отец» было бы более свободным истолкованием.
- source_word: ἁγιασθήτω
  choice: пусть ... почитают святым
  rationale: Аористный пассивный императив выражает просьбу о том, чтобы имя Бога признавали и чтили как святое. Неопределённо-личная конструкция естественна в современном русском и не называет не указанного в греческом тексте деятеля.
- source_word: τὸ ὄνομά σου
  choice: имя Твоё
  rationale: Прямо сохраняет образ «имени», который может включать явленную личность, славу и репутацию Бога, не заменяя его толкованием.
theological_decisions:
- issue: Обращение к Богу как к Отцу и указание на небеса
  choice: Отец наш, Который на небесах
  alternative: Отец наш Небесный; Отец наш, сущий на небесах
  rationale: Выбранный вариант сохраняет одновременно близость обращения «Отец», общность «наш» и трансцендентность указания «на небесах». Он следует греческому множественному числу и избегает как истолковывающего прилагательного «Небесный», так и архаичного «сущий».
- issue: Смысл просьбы ἁγιασθήτω
  choice: пусть имя Твоё почитают святым
  alternative: да святится имя Твоё; пусть имя Твоё будет освящено
  rationale: Формулировка передаёт просьбу о признании и почитании Божьего имени как святого, не создавая впечатления, будто оно прежде не было святым. При этом неопределённый деятель не устраняет смысловую открытость греческого пассива.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения, но без устаревших форм. Заглавные буквы в «Который», «Твоё» отражают принятую русскую практику почтительного обращения к Богу. Открывающая кавычка показывает начало приведённой молитвы; стих заканчивается внутри продолжающейся цитаты.
