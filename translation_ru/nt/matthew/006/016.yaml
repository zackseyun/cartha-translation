  text: Ὅταν δὲ νηστεύητε, μὴ γίνεσθε ⸀ὡς οἱ ὑποκριταὶ σκυθρωποί, ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/016.yaml
  text: And whenever you fast[a], do not become gloomy like the hypocrites, for they disfigure their faces so that they may appear to people to be fasting. Truly I say to you, they have received their reward in full.
translation:
  language: ru
  text: 'Когда же вы поститесь, не принимайте мрачный вид, как лицемеры: они искажают свои лица, чтобы люди видели, что они постятся. Истинно говорю вам: они получили свою награду сполна.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν δὲ νηστεύητε
  choice: Когда же вы поститесь
  rationale: ὅταν с сослагательным наклонением обозначает всякий случай повторяющейся практики; в современном русском «когда» естественно передаёт это обобщённо-временное значение, а «же» связывает наставление с предыдущими параллельными наставлениями.
- source_word: μὴ γίνεσθε ... σκυθρωποί
  choice: не принимайте мрачный вид
  rationale: Передаёт становление или намеренное принятие состояния (γίνεσθε) и мрачное выражение лица (σκυθρωποί), не сводя фразу к простой характеристике личности.
- source_word: ὡς οἱ ὑποκριταί
  choice: как лицемеры
  rationale: Прямое и естественное сравнительное выражение; «лицемеры» сохраняет нравственный и театрально-показной оттенок ὑποκριταί.
- source_word: ἀφανίζουσιν ... τὰ πρόσωπα αὐτῶν
  choice: они искажают свои лица
  rationale: Сохраняет конкретный образ лиц и намеренного изменения внешности. Глагол допускает оттенки обезображивания, порчи или запущенности; «искажают» не уточняет способ сверх сказанного в тексте.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες
  choice: чтобы люди видели, что они постятся
  rationale: Передаёт цель и пассивно-зрительный смысл φανῶσιν. «Люди» естественно выражает обобщённое значение ἄνθρωποι без ненужного ограничения мужчинами.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Истинно говорю вам
  rationale: Сохраняет торжественную формулу авторитетного утверждения и её привычную библейскую выразительность в русском языке.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: они уже получили свою награду сполна
  rationale: ἀπέχω употреблено как расчётная формула полного получения причитающегося; «уже» и «сполна» ясно передают завершённость и отсутствие дальнейшего притязания, подразумеваемое идиомой.
theological_decisions:
- issue: Круг лиц, обозначенных τοῖς ἀνθρώποις
  choice: «люди» в общем смысле
  alternative: «мужчины» или «другие»
  rationale: В данном контексте ἄνθρωποι означает людей вообще. Русское «люди» точно и естественно сохраняет этот смысл, не внося гендерного ограничения.
- issue: Смысл ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: «уже получили свою награду сполна»
  alternative: «получают свою награду» или «имеют свою награду»
  rationale: Коммерческая идиома указывает на полный расчёт. Перевод сохраняет напряжение между искомым человеческим признанием и подразумеваемым отсутствием иной награды, не конкретизируя её богословски сверх текста.
translation_notes:
  register: 'Современный литературный русский язык с dignified библейским звучанием. Синтаксис ясен обычному читателю; сохранены конкретные образы лица, видимости и награды. Стих не требует сноски: обобщённое τοῖς ἀνθρώποις непосредственно и недвусмысленно передаётся словом «люди».'
