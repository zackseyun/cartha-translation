id: MAT.6.8
reference: Matthew 6:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μὴ οὖν ὁμοιωθῆτε αὐτοῖς, οἶδεν γὰρ ⸀ὁ πατὴρ ὑμῶν ὧν χρείαν ἔχετε πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/008.yaml
  text: Therefore[a], do not become like them, for your Father knows what you need before you ask him.
translation:
  language: ru
  text: Итак, не уподобляйтесь им[a], ведь ваш Отец знает, в чём вы нуждаетесь, прежде чем вы попросите его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не становитесь похожими на них»; более буквально: «не будьте уподоблены им».'
    reason: 'Лексическая альтернатива: пассивная форма ὁμοιωθῆτε допускает более буквальную передачу, тогда как основной текст использует естественный русский возвратный глагол.'
lexical_decisions:
- source_word: μὴ οὖν
  choice: Итак, не
  rationale: «Итак» передаёт выводное значение οὖν и связывает запрет с предшествующим предостережением о многословной молитве язычников.
- source_word: ὁμοιωθῆτε
  choice: уподобляйтесь
  rationale: Возвратный глагол естественно передаёт призыв не перенимать их образ действий; отрицательная форма сохраняет силу греческого запрета.
- source_word: αὐτοῖς
  choice: им
  rationale: Местоимение естественно отсылает к упомянутым непосредственно перед этим язычникам, не добавляя отсутствующего в стихе пояснения.
- source_word: οἶδεν
  choice: знает
  rationale: Хотя οἶδα имеет перфектную форму, здесь оно употреблено в настоящем значении.
- source_word: ὁ πατὴρ ὑμῶν
  choice: ваш Отец
  rationale: Передаёт греческий текст без добавления слова «Небесный», которого в данном стихе нет.
- source_word: ὧν χρείαν ἔχετε
  choice: в чём вы нуждаетесь
  rationale: Естественная русская конструкция точно выражает содержание нужды и сохраняет оттенок действительной потребности.
- source_word: πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν
  choice: прежде чем вы попросите его
  rationale: Передаёт временное предшествование, выраженное πρὸ τοῦ с инфинитивом, и сохраняет личное дополнение αὐτόν без добавления предмета просьбы.
theological_decisions:
- issue: Предварительное знание Бога и молитва
  choice: Прямо утверждается, что Отец знает нужды учеников до их просьбы.
  alternative: Пояснить в переводе, что молитва служит отношениям с Богом, а не сообщает Ему неизвестное.
  rationale: Текст утверждает предварительное знание Отца, но не объясняет, зачем при этом молиться; перевод сохраняет это богословское напряжение и не вводит доктринального толкования.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанно-торжественное. Слово «Отец» написано с прописной буквы как обозначение Бога, местоимение «его» — со строчной согласно нейтральной современной орфографической практике.
