id: MAT.6.23
reference: Matthew 6:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐὰν δὲ ὁ ὀφθαλμός σου πονηρὸς ᾖ, ὅλον τὸ σῶμά σου σκοτεινὸν ἔσται. εἰ οὖν τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν, τὸ σκότος πόσον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/023.yaml
  text: But if your eye is bad[a], your whole body will be dark. If then the light in you is darkness, how great is the darkness!
translation:
  language: ru
  text: Но если твой глаз плохой[a], то всё твоё тело будет во тьме. Итак, если свет, который в тебе, — тьма, то как велика тьма!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «злой», «нездоровый»; возможно также: «скупой» — с учётом идиомы о «глазе» и ближайшего контекста.'
    reason: 'Лексическая альтернатива: πονηρός имеет широкий диапазон значений, а образ глаза может иметь идиоматический оттенок.'
lexical_decisions:
- source_word: πονηρός
  choice: плох
  rationale: Широкое соответствие, сохраняющее возможные значения нравственной порочности, нездоровья зрения и скупости в идиоме о «глазе», не сводя образ к одному толкованию.
- source_word: σκοτεινός
  choice: во тьме
  rationale: Естественная русская предикативная конструкция, точно передающая состояние, обозначенное прилагательным «тёмный».
- source_word: φῶς
  choice: свет
  rationale: Сохраняет буквальный образ и его противопоставление тьме, не конкретизируя метафорический смысл.
- source_word: σκότος
  choice: тьма
  rationale: Передаёт метафорический контраст со светом и сохраняет повтор в заключительной фразе.
- source_word: πόσον
  choice: как велика
  rationale: Передаёт степень в восклицательной эллиптической конструкции и звучит естественно по-русски.
- source_word: ὀφθαλμός
  choice: глаз
  rationale: Сохраняет телесный образ, связанный с восприятием, направленностью и нравственным состоянием.
- source_word: ὅλον τὸ σῶμά σου
  choice: всё твоё тело
  rationale: Прямо и естественно передаёт обобщающее ударение ὅλον.
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: свет, который в тебе
  rationale: Близко передаёт определённую конструкцию с ἐν σοὶ и не вносит более истолковывающее выражение «внутренний свет».
theological_decisions:
- issue: Значение образа «плохого глаза»
  choice: Сохранить широкий образ посредством слова «плох», а не уточнять в основном тексте «злой», «нездоровый» или «скупой».
  alternative: «Злой глаз» с акцентом на нравственной порочности; «нездоровый глаз» с акцентом на ущербном восприятии; «скупой глаз» как семитская идиома скупости.
  rationale: 'Контекст Мф. 6:19–24 допускает пересекающиеся оттенки: нравственную тьму, искажённое восприятие и, возможно, скупость. Широкая формулировка сохраняет эту смысловую напряжённость, а варианты отмечены в сноске.'
translation_notes:
  register: Современный литературный русский язык; достоинство и краткость афористического изречения сохранены. «Во тьме» выбрано вместо менее естественного «тёмным» применительно ко всему телу. Частица οὖν передана словом «итак», а заключительная эллиптическая фраза сохранена как восклицание.
