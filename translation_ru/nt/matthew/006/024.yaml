base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/024.yaml
  text: No one is able to serve two masters[a], for either he will hate the one and love the other, or he will be devoted to one and despise the other. You are not able to serve God and mammon.
translation:
  language: ru
  text: Никто не может служить двум господам, ибо либо одного возненавидит и другого полюбит, либо будет держаться одного и презрит другого. Вы не можете служить и Богу, и маммоне[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «богатству» или «деньгам». В греческом тексте употреблено заимствованное слово «маммона», которое может олицетворять богатство как соперничающего господина.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Никто
  rationale: Естественная и точная передача всеобщего отрицания в современном русском языке.
- source_word: δύναται / δύνασθε
  choice: не может / не можете
  rationale: Передаёт невозможность совмещать служение двум соперничающим господам и сохраняет повтор глагола в стихе.
- source_word: δυσὶ κυρίοις
  choice: двум господам
  rationale: В сочетании с δουλεύειν речь идёт о господах, которым служит зависимый человек; это сохраняет социальную метафору и не смешивает κύριος с божественным титулом.
- source_word: δουλεύειν
  choice: служить
  rationale: Нормальная русская передача служения господину; зависимое положение уже ясно из слова «господам».
- source_word: μισήσει / ἀγαπήσει
  choice: возненавидит / полюбит
  rationale: Сохраняет сильную антитезу исходного текста, не смягчая μισέω до сравнительного «любить меньше».
- source_word: ἑνὸς ἀνθέξεται
  choice: одного будет держаться
  rationale: Передаёт смысл стойкой привязанности и верности, оставаясь близким к образности греческого глагола.
- source_word: καταφρονήσει
  choice: другим пренебрежёт
  rationale: Передаёт презрительное отношение и образует естественный контраст с верностью другому господину.
- source_word: θεῷ
  choice: Богу
  rationale: Стандартная передача θεός; дательный падеж обусловлен управлением глагола «служить».
- source_word: μαμωνᾷ
  choice: маммоне
  rationale: Сохранение заимствованного слова поддерживает олицетворённый образ богатства как соперничающего господина; значение поясняется в сноске.
theological_decisions:
- issue: Передача κύριος в недивинном социальном контексте
  choice: господам
  alternative: владыкам
  rationale: Множественное число и образ зависимого служения указывают на хозяев-господ; выбранное слово естественно по-русски и не превращает его в божественный титул.
- issue: Передача μαμωνᾶς
  choice: маммона
  alternative: богатство; деньги
  rationale: Транслитерация сохраняет риторическое противопоставление Богу и образ маммоны как соперничающего господина, не сводя высказывание только к деньгам.
- issue: Сила противопоставления μισήσει и ἀγαπήσει
  choice: возненавидит и полюбит
  alternative: будет любить меньше и любить
  rationale: Прямые значения сохраняют намеренно резкую антитезу текста; возможный семитский сравнительный оттенок не настолько определён, чтобы вводить его в основной перевод.
