    reason: textual_variant
lexical_decisions:
- source_word: ἄφες
  choice: прости
  rationale: Аористный императив ἀφίημι в контексте молитвы естественно передаётся как «прости»; в сочетании с нравственной метафорой долга речь идёт о прощении, а не просто об освобождении от денежного обязательства.
- source_word: τὰ ὀφειλήματα ἡμῶν
  choice: наши долги
  rationale: Слово ὀφειλήματα буквально означает «долги», «то, что причитается». Такой перевод сохраняет исходную метафору и связь с однокоренным словом «должникам» во второй части стиха.
- source_word: ὡς
  choice: как
  rationale: Кратко и естественно сохраняет выраженное в греческом тексте сопоставление, не уточняя сверх текста характер связи между Божьим и человеческим прощением.
- source_word: καὶ ἡμεῖς
  choice: и мы
  rationale: Второе καὶ вместе с явно выраженным местоимением ἡμεῖς подчёркивает, что прощение совершили также и молящиеся.
- source_word: ἀφήκαμεν
  choice: простили
  rationale: Аорист изъявительного наклонения указывает на совершённое действие; русское совершенное прошедшее «простили» естественно передаёт его, не добавляя отдельного грамматического значения, аналогичного английскому present perfect.
- source_word: τοῖς ὀφειλέταις ἡμῶν
  choice: нашим должникам
  rationale: «Должникам» сохраняет однокоренную связь с «долгами» и цельность метафоры оригинала.
theological_decisions:
- issue: Нравственная метафора долга
  choice: Сохранить в основном тексте слова «долги» и «должники».
  alternative: «грехи / согрешения» и «согрешившие против нас»
  rationale: Греческий текст последовательно использует лексику долга. В контексте молитвы она обозначает нравственную вину, однако замена метафоры прямым словом «грехи» сделала бы перевод более толковательным и устранила бы образ оригинала.
- issue: Связь между испрашиваемым и человеческим прощением
  choice: Передать ὡς нейтральным сравнительным союзом «как».
  alternative: «поскольку» или «при условии, что»
  rationale: Греческое ὡς выражает сопоставление, но само по себе не определяет исчерпывающе причинную или условную природу этой связи. Нейтральное «как» сохраняет богословское напряжение текста.
- issue: Временной аспект ἀφήκαμεν
  choice: «простили» — совершенное действие в прошлом.
  alternative: «прощаем»
  rationale: Основной текст SBLGNT содержит аорист ἀφήκαμεν. Перевод «простили» следует принятому чтению и не превращает его в описание только привычного или продолжающегося действия; вариант настоящего времени засвидетельствован частью рукописной традиции и указан в примечании.
translation_notes:
  register: Современный литературный русский язык с лаконичным, молитвенным и достоинственным звучанием. Порядок слов сделан естественным для русского языка, при этом сохранены повтор «долги — должники», сравнительное «как» и подчёркнутое «и мы».
