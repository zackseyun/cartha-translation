translation:
  language: ru
  text: И прости нам наши долги[a], как и мы простили[b] нашим должникам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проступки». Буквально: «долги»; здесь это образ грехов и проступков перед Богом.'
