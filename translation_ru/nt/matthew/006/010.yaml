base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/010.yaml
  text: May your kingdom come; may your will be done[a], as in heaven, so also on earth.
translation:
  language: ru
  text: Да придёт Царство Твоё; да исполнится воля Твоя, как на небе, так и на земле.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также понимать слова «как на небе, так и на земле» как относящиеся к обоим прошениям: «Да придёт Царство Твоё; да исполнится воля Твоя, как на небе, так и на земле».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθέτω
  choice: да придёт
  rationale: Аористный императив третьего лица выражает обращённую к Богу просьбу; конструкция «да придёт» естественна для возвышенной современной русской молитвенной речи.
- source_word: ἡ βασιλεία σου
  choice: Царство Твоё
  rationale: βασιλεία может обозначать и царство, и царствование; традиционное «Царство» естественно в данном контексте и не исключает смысла Божьего владычества.
- source_word: γενηθήτω
  choice: да исполнится
  rationale: С θέλημα глагол γίνομαι означает осуществление или совершение воли. «Да исполнится» точно и идиоматично передаёт молитвенную просьбу, не сводя её лишь к человеческому действию.
- source_word: τὸ θέλημά σου
  choice: воля Твоя
  rationale: «Воля» сохраняет широту значения θέλημα — желание, намерение или замысел — без неоправданного уточнения.
- source_word: ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς
  choice: и на земле, как на небе
  rationale: Русский порядок слов естественно выражает сопоставление неба и земли и передаёт καί как «и», то есть распространение небесной действительности также на землю.
theological_decisions:
- issue: Объём действия сравнительной фразы ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς
  choice: В основном тексте фраза непосредственно отнесена к прошению «да исполнится воля Твоя».
  alternative: 'Понимать «и на земле, как на небе» как относящееся к обоим прошениям: о пришествии Царства и об исполнении воли.'
  rationale: Ближайшая синтаксическая связь — со вторым прошением, однако древнегреческий текст допускает более широкий охват; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным молитвенным звучанием. Сохранены привычные библейские термины и прописные местоимения при обращении к Богу; архаические формы избегаются.
