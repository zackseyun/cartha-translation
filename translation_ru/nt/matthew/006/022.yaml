  text: Ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός. ἐὰν οὖν ⸂ᾖ ὁ ὀφθαλμός σου ἁπλοῦς⸃, ὅλον τὸ σῶμά σου φωτεινὸν ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/022.yaml
  text: The eye is the lamp of the body. Therefore[a], if your eye is healthy, your whole body will be full of light.
translation:
  language: ru
  text: Светильник тела — глаз. Поэтому, если твой глаз здоров[a], всё твоё тело будет наполнено светом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ясен», «целый (неповреждённый)» или «единый». Греческое слово может также передавать смысл цельности или неразделённости, а в некоторых контекстах — щедрости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: светильник
  rationale: Конкретное существительное сохраняет образ источника света, а не света как абстрактного явления.
- source_word: σῶμα
  choice: тело
  rationale: Прямой и естественный эквивалент, сохраняющий телесную образность.
- source_word: ὀφθαλμός
  choice: глаз
  rationale: Буквальная передача уместна и для физического образа, и для его нравственного смысла.
- source_word: ἐὰν οὖν
  choice: поэтому, если
  rationale: «Поэтому» передаёт вывод, выраженный οὖν, а «если» сохраняет условную конструкцию.
- source_word: ἁπλοῦς
  choice: здоров
  rationale: В непосредственном образе зрения слово естественно описывает глаз, который правильно функционирует; многозначность отмечена в сноске.
- source_word: ὅλον
  choice: всё
  rationale: В сочетании «всё твоё тело» естественно передаёт полноту, выраженную ὅλον.
- source_word: φωτεινὸν
  choice: наполнено светом
  rationale: Идиоматически передаёт состояние освещённости всего тела и сохраняет метафору света.
- source_word: ἔσται
  choice: будет
  rationale: Сохраняет явно выраженное в греческом тексте будущее время.
theological_decisions:
- issue: Значение ἁπλοῦς в метафоре глаза
  choice: 'В основном тексте: «здоров»'
  alternative: «чист», «ясен», «прост (един)»; в некоторых контекстах — «щедр»
  rationale: Контраст с плохим глазом и образ освещения тела поддерживают значение нормального, здорового зрения. Вместе с тем греческое слово допускает оттенки цельности, простоты и неразделённости, а в иных контекстах — щедрости, поэтому неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и dignified, с сохранением конкретной метафоры светильника. Не вполне прозрачные значения ἁπλοῦς не навязываются основному тексту, а представлены в сноске.
