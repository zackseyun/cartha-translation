base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/021.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: ru
  text: Ведь где твоё сокровище, там будет[a] и твоё сердце.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Ведь где твоё сокровище, там и твоё сердце». В этой русской именной конструкции подразумевается настоящее время. Некоторые переводы передают изречение как вневременное правило в настоящем времени, однако в греческом тексте стоит форма будущего времени — «будет».'
    reason: Альтернативная передача временного значения глагола.
lexical_decisions:
- source_word: ὅπου
  choice: где
  rationale: Вводит придаточное места и естественно образует соотносительную конструкцию «где… там».
- source_word: γάρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующим наставлением о сокровищах; в современном русском «ведь» звучит естественнее, чем начальное «ибо», не ослабляя логики текста.
- source_word: θησαυρός
  choice: сокровище
  rationale: Сохраняет как прямое значение накопленного богатства, так и метафорический смысл того, что человек особенно ценит.
- source_word: σου
  choice: твоё
  rationale: Передаёт притяжательное значение местоимения второго лица единственного числа; форма согласована с существительными «сокровище» и «сердце».
- source_word: ἐκεῖ
  choice: там
  rationale: Соответствует ὅπου и сохраняет краткий параллелизм «где… там».
- source_word: ἔσται
  choice: будет
  rationale: Сохраняет будущее время греческого глагола εἰμί и не превращает высказывание в чисто статическое описание.
- source_word: καρδία
  choice: сердце
  rationale: Традиционный и точный эквивалент, охватывающий желания, привязанности, волю и внутреннюю направленность человека без сужения смысла.
- source_word: καὶ
  choice: и
  rationale: 'Передаёт добавочное значение: вместе с сокровищем в том же месте окажется и сердце.'
theological_decisions:
- issue: Временное значение ἔσται в изречении, похожем на мудростную максиму
  choice: 'Сохранить явное будущее время: «будет»'
  alternative: 'Передать настоящим временем: «находится» или «есть»'
  rationale: 'Греческий текст употребляет форму будущего времени. Её сохранение оставляет открытой динамическую сторону изречения: сердце не только соответствует сокровищу, но и направляется туда, где оно помещено; при этом перевод не превращает это наблюдение в отдельное доктринальное утверждение.'
translation_notes:
  register: Современный литературный русский язык с краткой, ясной и достойной формулировкой. «Ведь» сохраняет пояснительную связь без архаичного оттенка «ибо»; обращение оставлено в единственном числе, как в греческом тексте.
