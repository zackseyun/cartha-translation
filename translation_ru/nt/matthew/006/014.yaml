  text: ἐὰν γὰρ ἀφῆτε τοῖς ἀνθρώποις τὰ παραπτώματα αὐτῶν, ἀφήσει καὶ ὑμῖν ὁ πατὴρ ὑμῶν ὁ οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/014.yaml
  text: For if you forgive people their trespasses[b][a], your heavenly Father will also forgive you.
translation:
  language: ru
  text: Ведь если вы простите людям их проступки[a], то и ваш Небесный Отец простит вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прегрешения», «нарушения» или «обиды». Греческое слово обозначает нравственные проступки или неверные шаги.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Ведь если
  rationale: «Ведь» естественно передаёт пояснительную связь γάρ с предшествующей молитвой, а «если» сохраняет условную конструкцию ἐάν с аористом сослагательного наклонения.
- source_word: ἀφῆτε … ἀφήσει
  choice: будете прощать … простит
  rationale: Оба употребления ἀφίημι переданы одним русским глаголом, чтобы сохранить намеренный словесный параллелизм; видо-временные формы естественно выражают условие и его следствие.
- source_word: τοῖς ἀνθρώποις
  choice: людям
  rationale: Обобщающее ἄνθρωποι относится ко всем людям, а не только к мужчинам; «людям» — точное и естественное соответствие.
- source_word: τὰ παραπτώματα αὐτῶν
  choice: их проступки
  rationale: παράπτωμα обозначает нравственный проступок, нарушение или ложный шаг. «Проступки» сохраняет нравственно-личностный смысл и звучит естественно в современном русском языке.
- source_word: καὶ ὑμῖν
  choice: то и … вас
  rationale: Конструкция «то и» ясно передаёт соответствие, выраженное καί, а русское управление глагола «простить» требует прямого дополнения «вас».
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: ваш Небесный Отец
  rationale: Естественная русская передача атрибутивной конструкции — «ваш Небесный Отец»; она сохраняет и личное отношение, и небесное определение Отца.
theological_decisions:
- issue: Условная связь между прощением людьми и Божьим прощением
  choice: 'Условие передано прямо: «если … то и».'
  alternative: Истолковать человеческое прощение либо как заслугу, приобретающую Божье прощение, либо исключительно как свидетельство уже полученного прощения.
  rationale: Греческий текст формулирует реальное условие, но не разъясняет его догматический механизм. Перевод сохраняет эту богословскую напряжённость и не навязывает конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю. «Ведь» сохраняет связь с предшествующим контекстом, а парные формы «будете прощать … простит» обеспечивают естественное звучание и передают лексический повтор оригинала.
