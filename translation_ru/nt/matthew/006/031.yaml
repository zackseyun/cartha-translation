  text: μὴ οὖν μεριμνήσητε λέγοντες· Τί φάγωμεν; ἤ· Τί πίωμεν; ἤ· Τί περιβαλώμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/031.yaml
  text: Therefore do not worry[a], saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’
translation:
  language: ru
  text: 'Итак, не тревожьтесь[a], говоря: «Что нам есть?» или: «Что нам пить?» или: «Во что нам одеться?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не беспокойтесь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὖν μεριμνήσητε
  choice: Итак, не тревожьтесь
  rationale: οὖν передаёт вывод из предшествующего рассуждения, а μεριμνάω в данном контексте означает тревожную озабоченность насущными нуждами. «Не тревожьтесь» естественно по-русски и не превращает запрет в отрицание разумной предусмотрительности.
- source_word: λέγοντες
  choice: и не говорите
  rationale: Причастие обозначает слова, которыми выражается тревога. Сочинительная конструкция звучит естественно по-русски, при этом сохраняет связь речи с запрещаемой тревогой.
- source_word: Τί φάγωμεν;
  choice: Что нам есть?
  rationale: Аорист конъюнктива в совещательном вопросе передаёт озабоченность тем, чем питаться; русская конструкция с дательным «нам» естественно выражает этот смысл без излишнего уточнения времени.
- source_word: Τί πίωμεν;
  choice: Что нам пить?
  rationale: Параллельный совещательный вопрос передан той же естественной русской конструкцией.
- source_word: Τί περιβαλώμεθα;
  choice: Во что нам одеться?
  rationale: Средняя форма περιβάλλω здесь относится к облачению в одежду. «Во что нам одеться?» естественно передаёт смысл и сохраняет образ действия, а не только состояния.
- source_word: ἤ ... ἤ
  choice: или ... или
  rationale: Повтор союза сохранён, чтобы передать трёхчастный ряд тревожных вопросов.
theological_decisions:
- issue: Характер запрета относительно материальных нужд
  choice: Передать μεριμνήσητε как запрет тревожиться о насущном
  alternative: Не заботьтесь вообще
  rationale: Контекст говорит о мучительной тревоге из-за пищи, питья и одежды, а не вводит полный запрет на ответственную предусмотрительность.
translation_notes:
  register: Современный литературный русский язык; речь ясная и достойная. Трёхчастная риторическая структура оригинала сохранена, а формулировки вопросов сделаны естественными для прямой речи.
