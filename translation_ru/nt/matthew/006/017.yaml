source:
  edition: SBLGNT
  text: σὺ δὲ νηστεύων ἄλειψαί σου τὴν κεφαλὴν καὶ τὸ πρόσωπόν σου νίψαι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/017.yaml
  text: But you[a], when you fast, anoint your head and wash your face[b],
translation:
  language: ru
  text: А ты, когда постишься, умасти голову маслом[a] и умой лицо[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «умасти голову». Речь может идти о нанесении масла как части обычного ухода за собой.'
    reason: lexical_alternative
  - marker: b
    text: То есть сохраняй обычный внешний вид, не делая свой пост заметным для окружающих.
    reason: cultural_note
lexical_decisions:
- source_word: σὺ δὲ
  choice: А ты
  rationale: Выраженная форма местоимения с δέ подчёркивает прямое противопоставление лицемерам из предыдущего контекста.
- source_word: νηστεύων
  choice: когда постишься
  rationale: Причастие естественно передано обстоятельственным придаточным времени, сохраняющим значение продолжающегося действия.
- source_word: ἄλειψαί
  choice: умасти ... маслом
  rationale: Глагол обозначает нанесение масла, здесь как обычное действие по уходу за собой. Уточнение «маслом» делает культурно обусловленное действие понятным современному читателю.
- source_word: τὴν κεφαλήν
  choice: голову
  rationale: Прямой эквивалент κεφαλή; контекст подразумевает обычный уход за головой и волосами.
- source_word: καὶ
  choice: и
  rationale: Сохраняет простое соединение двух повелений.
- source_word: τὸ πρόσωπόν σου
  choice: лицо
  rationale: Естественное современное соответствие πρόσωπον в значении видимого лица.
- source_word: νίψαι
  choice: умой
  rationale: νίπτω обычно означает мыть часть тела; «умой» идиоматично применительно к лицу и сохраняет повелительное значение.
theological_decisions:
- issue: Характер указания о внешнем виде во время поста
  choice: Иисус велит сохранять обычный ухоженный вид во время поста, чтобы не выставлять пост напоказ перед людьми.
  alternative: Речь идёт о ритуальном помазании либо о запрете любого публичного поста.
  rationale: Ближайший контекст противопоставляет показному искажению лица обычный внешний вид. Текст не запрещает пост и не требует понимать нанесение масла как обряд.
translation_notes:
  register: Современный литературный русский язык с прямым обращением на «ты». «Умасти» сохраняет достоинство и культурный колорит текста, а добавление «маслом» устраняет неясность для современного читателя. Запятая в конце сохранена в соответствии с тем, что стих синтаксически продолжается в Мф 6:18.
