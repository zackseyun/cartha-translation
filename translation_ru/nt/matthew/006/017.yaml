review_pass:
  verdict: approve
  source_fidelity: '«А ты» точно передаёт контрастивное σὺ δέ. Оборот «когда постишься» естественно выражает обстоятельное настоящее причастие νηστεύων. «Умасти голову маслом» верно передаёт ἄλειψαι σου τὴν κεφαλήν: масло подразумевается значением глагола и его добавление не меняет смысла. «Умой лицо» точно соответствует νίψαι τὸ πρόσωπόν σου. Конечная запятая уместна, поскольку синтаксис продолжается в следующем стихе.'
  naturalness: Перевод звучит как современный литературный русский с умеренно возвышенной библейской окраской. «Умасти» несколько книжно, но понятно и удачно сохраняет культурный оттенок действия без ненужной ритуализации. «Умой лицо» идиоматично.
  terminology: Термины и обращение последовательны. «Постишься», «умасти» и «умой» не вносят конфессионально обусловленного толкования. Примечание a корректно отмечает более буквальную форму без явно названного масла; примечание b осторожно объясняет ближайший контекст, не выдавая пояснение за дополнительный текст стиха.
