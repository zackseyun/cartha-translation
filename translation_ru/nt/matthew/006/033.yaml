  text: ζητεῖτε δὲ πρῶτον τὴν ⸀βασιλείαν καὶ τὴν δικαιοσύνην αὐτοῦ, καὶ ταῦτα πάντα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/033.yaml
  text: But seek first his kingdom and his righteousness[a], and all these things will be added to you.
translation:
  language: ru
  text: Но прежде всего ищите Его Царства и Его праведности[a], и всё это будет дано вам вдобавок.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливости». Греческое слово может означать как праведность, так и справедливость; здесь «праведность» лучше сохраняет широкий смысл правильных отношений с Богом и жизни согласно Его воле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖτε
  choice: ищите
  rationale: Настоящее повелительное наклонение во множественном числе выражает продолжающееся деятельное стремление; русское «ищите» естественно сохраняет и повеление, и эту смысловую широту.
- source_word: δὲ
  choice: но
  rationale: Союз обозначает противопоставление предшествующим словам о тревоге и погоне за необходимым для жизни.
- source_word: πρῶτον
  choice: прежде
  rationale: «Прежде» естественно передаёт приоритет Царства и праведности, не превращая текст в пояснительный пересказ.
- source_word: βασιλείαν
  choice: Царства
  rationale: «Царство» сохраняет традиционную и широкую передачу βασιλεία, включающую как царское правление Бога, так и область его осуществления.
- source_word: δικαιοσύνην
  choice: праведности
  rationale: «Праведность» сохраняет широкий смысл соответствия Божьей воле и правильной жизни перед Богом; более узкая возможная передача отмечена в сноске.
- source_word: αὐτοῦ
  choice: Его
  rationale: Местоимение сохранено, как в греческом тексте; из контекста его референтом является Бог Отец.
- source_word: ταῦτα πάντα
  choice: всё это
  rationale: Указательное выражение отсылает к пище, питью и одежде в ближайшем контексте; «всё это» звучит естественно и точно.
- source_word: προστεθήσεται
  choice: будет дано вдобавок
  rationale: Будущий пассив передаёт мысль о прибавлении необходимых благ к главному исканию; «дано вам вдобавок» по-русски естественнее буквального «прибавлено вам» и не уточняет действующее лицо.
- source_word: ὑμῖν
  choice: вам
  rationale: Дательный падеж непосредственно и естественно передан русским «вам».
theological_decisions:
- issue: Передача δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: В данном контексте слово охватывает соответствие Божьей воле и праведное поведение, а не только общественную или судебную справедливость; альтернативный оттенок сохранён в сноске.
- issue: Референт αὐτοῦ
  choice: Его
  alternative: Божьего / Божьей
  rationale: Сохранение местоимения следует форме исходного текста и не вводит ненужного пояснения, хотя контекст ясно указывает на Бога Отца.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис краткий и ясный; заглавные буквы в «Его Царства» и «Его праведности» отражают принятый благоговейный русский библейский регистр.
