id: MAT.6.1
reference: Matthew 6:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Προσέχετε ⸀δὲ τὴν ⸀δικαιοσύνην ὑμῶν μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς· εἰ δὲ μή γε, μισθὸν οὐκ ἔχετε παρὰ τῷ πατρὶ ὑμῶν τῷ ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/001.yaml
  text: But be careful not to practice your righteousness before people in order to be seen by them[a]; otherwise[b], you have no reward from your Father in the heavens.
translation:
  language: ru
  text: 'Но смотрите: не проявляйте своей праведности перед людьми напоказ[a], иначе не получите награды от вашего Отца, Который на небесах[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не совершайте своих праведных дел». В некоторых рукописях: «не подавайте милостыни».'
    reason: textual_variant
  - marker: b
    text: 'Буквально: «на небесах»; в греческом тексте употреблено множественное число.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε
  choice: смотрите
  rationale: Настоящее повелительное наклонение во множественном числе призывает к постоянной бдительности. «Смотрите» естественно передаёт предостережение в современном литературном русском языке.
- source_word: δὲ
  choice: но
  rationale: Частица обозначает переход с оттенком противопоставления и вводит предостережение.
- source_word: δικαιοσύνην
  choice: праведности
  rationale: Основное чтение SBLGNT имеет широкое значение — праведность, проявляемая в поступках, — и не ограничивает смысл одной лишь милостыней.
- source_word: μὴ ποιεῖν
  choice: не проявляйте
  rationale: Буквальное «не делайте праведности» неестественно по-русски. «Не проявляйте своей праведности» сохраняет широкий смысл религиозно-нравственной практики.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς
  choice: перед людьми напоказ
  rationale: Передаёт как публичность действия, так и выраженную в греческом тексте цель — добиться внимания окружающих.
- source_word: εἰ δὲ μή γε
  choice: иначе
  rationale: Естественно и кратко передаёт условное предупреждение о последствии.
- source_word: μισθὸν
  choice: награды
  rationale: В контексте Божьего воздаяния «награда» точнее и естественнее, чем буквальная «плата».
- source_word: παρὰ τῷ πατρὶ ὑμῶν
  choice: от вашего Отца
  rationale: В контексте получения награды παρά с дательным указывает на Отца как её источник.
- source_word: τῷ ἐν τοῖς οὐρανοῖς
  choice: Который на небесах
  rationale: Сохраняется характерная для Матфея форма множественного числа «небеса».
theological_decisions:
- issue: Объём значения δικαιοσύνην
  choice: праведность как широкая праведная практика
  alternative: праведные дела; милостыня
  rationale: SBLGNT читает δικαιοσύνην, поэтому основной текст не сужает смысл до милостыни. Более конкретное понимание и текстовый вариант отмечены в сноске.
- issue: Цель праведного поступка
  choice: напоказ
  alternative: чтобы быть замеченными людьми
  rationale: Краткая русская формулировка сохраняет отрицательно оцениваемое намерение добиться человеческого внимания, не осуждая сами публично видимые добрые дела.
- issue: Форма τοῖς οὐρανοῖς
  choice: на небесах
  alternative: на небе
  rationale: Множественное число отражает греческую форму и стиль Матфея, не придавая ей дополнительного догматического значения.
translation_notes:
  register: Современный литературный русский язык с достоинством наставительной речи. «Смотрите» сохраняет прямую силу предостережения; «напоказ» естественно выражает цель действия. Синтаксис сделан ясным для широкого читателя без сужения богословски значимого понятия праведности.
