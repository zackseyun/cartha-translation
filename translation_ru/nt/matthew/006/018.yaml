source:
  edition: SBLGNT
  text: ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων ἀλλὰ τῷ πατρί σου τῷ ἐν τῷ ⸀κρυφαίῳ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸁κρυφαίῳ ἀποδώσει σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/018.yaml
  text: so that you may not appear to men to be fasting[a], but to your Father who is in secret[b]; and your Father who sees in secret will reward you.
translation:
  language: ru
  text: чтобы люди не видели, что ты постишься, а видел только твой Отец, который втайне; и твой Отец, видящий тайное, воздаст тебе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως
  choice: чтобы
  rationale: Естественно передаёт целевое значение союза.
- source_word: μὴ φανῇς τοῖς ἀνθρώποις νηστεύων
  choice: чтобы не людям показаться постящимся
  rationale: Сохраняет отрицание при явлении перед людьми и ясно связывает причастие с тем, каким человек предстаёт наблюдателям.
- source_word: τοῖς ἀνθρώποις
  choice: людям
  rationale: В данном контексте ἄνθρωποι обозначает людей вообще, а не только мужчин; русское «людям» точно и естественно передаёт родовое значение.
- source_word: ἀλλὰ τῷ πατρί σου
  choice: а твоему Отцу
  rationale: Сохраняет прямое противопоставление человеческой и божественной аудитории и параллель дательных форм.
- source_word: τῷ ἐν τῷ κρυφαίῳ
  choice: Который втайне
  rationale: Передаёт скрытое, недоступное человеческому взгляду присутствие Отца, не уточняя его как физическое место.
- source_word: ὁ βλέπων ἐν τῷ κρυφαίῳ
  choice: видящий тайное
  rationale: Естественная русская формулировка, передающая, что Отец видит скрытое от людей; буквальное «видящий втайне» могло бы ошибочно описывать тайным сам способ Его видения.
- source_word: ἀποδώσει σοι
  choice: воздаст тебе
  rationale: Передаёт идею ответного воздаяния и сохраняет достойный библейский регистр без добавления конкретного содержания награды.
theological_decisions:
- issue: Характер противопоставления μὴ... ἀλλά
  choice: «не людям… а твоему Отцу»
  alternative: «не показаться людям постящимся, но [показаться] твоему Отцу»
  rationale: Выбранная структура сохраняет противопоставление адресатов внешнего проявления поста, не утверждая, что постящийся намеренно демонстрирует свой пост Отцу.
- issue: Значение ἐν τῷ κρυφαίῳ во втором употреблении
  choice: «видящий тайное»
  alternative: «видящий втайне» / «видящий в сокровенном месте»
  rationale: Так сохраняется богословский акцент на всеведении Отца относительно скрытого благочестия и устраняется русская двусмысленность, будто Сам Отец смотрит тайком; при этом конкретное место не домысливается.
- issue: Значение ἀποδώσει
  choice: «воздаст»
  alternative: «наградит»
  rationale: «Воздаст» сохраняет более широкий смысл ответного действия и не конкретизирует природу воздаяния.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Втайне» и «воздаст» понятны современному читателю и сохраняют достоинство речи; местоимение «Который» относится к титулу «Отец».
