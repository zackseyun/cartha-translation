id: MAT.5.18
reference: Matthew 5:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν, ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου, ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/018.yaml
  text: For truly I say to you[a], until heaven and earth pass away[c][b], not one iota or one stroke will ever pass away from the law until all things happen.
translation:
  language: ru
  text: 'Ведь истинно говорю вам: пока не пройдут небо и земля, ни одна йота[a], ни одна черта[b] ни в коем случае не исчезнет из Закона, пока всё не произойдёт[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Йота — самая малая буква греческого алфавита; по смыслу: ни одна, даже самая малая буква.'
    reason: lexical_explanation
  - marker: b
    text: То есть мельчайший письменный штрих, различающий буквы.
    reason: lexical_explanation
  - marker: c
    text: 'Или: «пока всё не исполнится»; также возможно: «пока всё не свершится».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: истинно
  rationale: В речениях Иисуса это торжественное заверение, вводящее авторитетное высказывание; «истинно» естественно и достойно передаёт его силу.
- source_word: γὰρ
  choice: ведь
  rationale: Частица поясняет и обосновывает предыдущее утверждение; «ведь» сохраняет связность и естественно звучит по-русски.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямой перевод сохраняет торжественный и авторитетный тон речи.
- source_word: ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ
  choice: пока не пройдут небо и земля
  rationale: Конструкция обозначает будущий предел; «пройдут» сохраняет образ прекращения нынешнего порядка и не усиливает его толкованием.
- source_word: ἰῶτα ἓν
  choice: ни одна йота
  rationale: Йота — название самой малой греческой буквы; сочетание с «ни одна» естественно включается в усиленное отрицание.
- source_word: μία κεραία
  choice: ни одна черта
  rationale: κεραία обозначает мельчайший штрих или выступ в начертании буквы; «черта» понятно современному читателю и сохраняет письменный образ.
- source_word: οὐ μὴ παρέλθῃ
  choice: ни в коем случае не исчезнет
  rationale: Двойное отрицание с сослагательным наклонением выражает категорическое отрицание; русское сочетание передаёт его усиленную силу.
- source_word: ἀπὸ τοῦ νόμου
  choice: из Закона
  rationale: Предлог указывает на исчезновение какого-либо элемента из Закона; прописная буква естественно обозначает здесь данный Богом Писаный закон, упомянутый в контексте вместе с Пророками.
- source_word: ἕως ἂν πάντα γένηται
  choice: пока всё не произойдёт
  rationale: Широкое значение γίνομαι — произойти, осуществиться; перевод сохраняет открытость между событием и исполнением, не навязывая одной схемы.
theological_decisions:
- issue: Смысл νόμος
  choice: Закон как данное Богом Писание/предписание в контексте слов о Законе и Пророках
  alternative: конкретно Тора (Пятикнижие) либо, по расширению, всё ветхозаветное Писание
  rationale: Основной текст не уточняет объём понятия сверх греческого νόμος; прописная буква лишь отмечает его особое библейское употребление.
- issue: Смысл πάντα γένηται
  choice: пока всё не произойдёт
  alternative: пока всё не исполнится
  rationale: Греческая фраза допускает оттенки наступления и осуществления. Основной вариант сохраняет широту, а сноска показывает важную возможность понимания как исполнения.
translation_notes:
  register: Современный литературный русский с торжественной интонацией. Сохранены пояснительное «ведь», образ прохождения неба и земли, усиленное отрицание и параллелизм двух временных конструкций. Термины «йота» и «черта» оставлены в тексте, а их письменный смысл пояснён в сносках.
