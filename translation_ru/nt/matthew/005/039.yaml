id: MAT.5.39
reference: Matthew 5:39
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ἀντιστῆναι τῷ πονηρῷ· ἀλλ’ ὅστις σε ⸀ῥαπίζει ⸀εἰς τὴν δεξιὰν ⸀σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/039.yaml
  text: But I say to you[a], do not resist the evil person. Instead, if anyone slaps you on the right cheek[b], turn the other to him as well.
translation:
  language: ru
  text: 'А Я говорю вам: не противьтесь злому человеку[a]; а если кто ударит тебя по правой щеке, поверни к нему и другую.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не противьтесь злу»; возможно также: «не противьтесь лукавому».'
    reason: Греческое τῷ πονηρῷ может пониматься как обозначение злого человека, зла или лукавого.
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: А Я говорю вам
  rationale: «А» передаёт противопоставление δέ предшествующему установлению; выраженное местоимение «Я» сохраняет эмфатическое ἐγώ и авторитетный характер формулы.
- source_word: μὴ ἀντιστῆναι
  choice: не противьтесь
  rationale: Глагол ἀνθίστημι означает «противостоять, сопротивляться». «Не противьтесь» сохраняет широту исходного выражения и не сужает его заранее до возмездия или юридического сопротивления.
- source_word: τῷ πονηρῷ
  choice: злому человеку
  rationale: Форма с артиклем грамматически допускает значения «злу», «злому человеку» и «лукавому». Следующий пример с человеком, наносящим удар, делает личное обобщённое значение наиболее вероятным в основном тексте; неоднозначность отмечена в сноске.
- source_word: ἀλλ’
  choice: Напротив
  rationale: Передаёт сильное противопоставление и переход от общего повеления к положительному примеру поведения.
- source_word: ὅστις σε ῥαπίζει
  choice: если кто ударит тебя
  rationale: Условная конструкция естественно передаёт неопределённое ὅστις. «Ударит» в сочетании со щекой звучит по-русски естественно; контекст подразумевает удар рукой, вероятнее всего пощёчину.
- source_word: εἰς τὴν δεξιὰν σιαγόνα
  choice: по правой щеке
  rationale: σιαγών может обозначать щёку или челюсть; в контексте удара рукой естественно «щека». Предлог εἰς при глаголе удара идиоматично передан русским «по».
- source_word: στρέψον αὐτῷ καὶ τὴν ἄλλην
  choice: поверни к нему и другую
  rationale: Сохраняется прямое значение στρέφω — «поворачивать» — без усиления толкованием «предложи» или «подставь»; «другую» ясно относится к другой щеке.
theological_decisions:
- issue: Значение τῷ πονηρῷ
  choice: злому человеку
  alternative: «злу» или «лукавому»
  rationale: Греческая форма допускает средний род с абстрактным значением и мужской род с личным значением. Непосредственный пример указывает на человеческого обидчика, однако подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис сохраняет контраст и краткость греческого текста; традиционное «подставь» не выбрано, поскольку оно сильнее интерпретирует буквальное «поверни».
