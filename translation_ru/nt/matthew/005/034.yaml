  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ὀμόσαι ὅλως· μήτε ἐν τῷ οὐρανῷ, ὅτι θρόνος ἐστὶν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/034.yaml
  text: 'But I say to you, do not swear at all: neither by heaven, because it is the throne of God;'
translation:
  language: ru
  text: 'А Я говорю вам: не клянитесь вовсе — ни небом, потому что оно — престол Бога;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: А Я говорю вам
  rationale: Противительное δέ передано союзом «А», а выраженное местоимение ἐγώ сохранено как эмфатическое «Я».
- source_word: μὴ ὀμόσαι ὅλως
  choice: не клянитесь вовсе
  rationale: Инфинитив в конструкции запрета естественно передан русским повелительным наклонением; ὅλως означает полный запрет — «вовсе».
- source_word: μήτε ἐν τῷ οὐρανῷ
  choice: ни небом
  rationale: В контексте клятвы греческое ἐν обозначает то, чем клянутся; русское управление требует творительного падежа.
- source_word: ὅτι θρόνος ἐστὶν τοῦ θεοῦ
  choice: потому что оно престол Бога
  rationale: ὅτι сохранено как причинное «потому что»; именная конструкция передана кратко и естественно.
theological_decisions:
- issue: Объём запрета μὴ ὀμόσαι ὅλως
  choice: не клянитесь вовсе
  alternative: не давайте ложных клятв / не клянитесь легкомысленно
  rationale: Текст буквально формулирует полный запрет и сам не вводит ограничений; возможные богословские согласования с другими местами не следует вносить в перевод.
- issue: Основание запрета клясться небом
  choice: потому что оно престол Бога
  alternative: ибо оно престол Божий
  rationale: Сохранена явная причинная связь и ветхозаветный образ без дополнительного истолкования.
translation_notes:
  register: Современный литературный русский язык с dignified библейской лаконичностью. «Вовсе» понятно современному читателю и точно передаёт абсолютность ὅλως; «престол Бога» прозрачно отражает греческий родительный падеж.
