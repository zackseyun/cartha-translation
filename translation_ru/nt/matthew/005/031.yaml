lexical_decisions:
- source_word: Ἐρρέθη δέ
  choice: Сказано также
  rationale: Безличная пассивная формула естественно передаётся как «сказано»; δέ здесь обозначает переход к следующему примеру и потому передано нейтральным «также», без преждевременного усиления противопоставления.
- source_word: Ὃς ἂν
  choice: Кто
  rationale: Относительное местоимение с ἄν выражает общее неопределённое условие; русское «кто» в такой конструкции звучит естественно и точно.
- source_word: ἀπολύσῃ
  choice: разведётся
  rationale: Глагол может буквально означать «отпустить», однако в данном брачно-правовом контексте вместе с ἀποστάσιον обозначает развод.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: со своей женой
  rationale: γυνή здесь означает именно жену; возвратное «своей» естественно соотносит её с подлежащим.
- source_word: δότω αὐτῇ
  choice: пусть даст ей
  rationale: Так сохраняется сила повелительного наклонения третьего лица без превращения цитируемой нормы в авторский комментарий.
- source_word: ἀποστάσιον
  choice: разводное свидетельство
  rationale: Слово обозначает письменный документ, удостоверяющий развод; выбранный оборот ясен современному читателю и сохраняет юридический характер выражения.
theological_decisions:
- issue: Отношение слов Иисуса к установлению о разводе в Законе Моисея
  choice: Передать стих как цитату правовой формулы, не добавляя в него одобрения или осуждения.
  alternative: Истолковать формулу как прямое одобрение развода либо как простое описание распространённого учения.
  rationale: В этом стихе приводится положение, которое Иисус рассматривает далее; перевод не должен заранее разрешать богословское напряжение.
