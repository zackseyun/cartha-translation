id: MAT.5.19
reference: Matthew 5:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὃς ἐὰν οὖν λύσῃ μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων καὶ διδάξῃ οὕτως τοὺς ἀνθρώπους, ἐλάχιστος κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· ὃς δ’ ἂν ποιήσῃ καὶ διδάξῃ, οὗτος μέγας κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/019.yaml
  text: Therefore[a], whoever relaxes one of the least of these commandments and teaches others to do so will be called least in the kingdom of heaven; but whoever does them and teaches them[b], this one will be called great in the kingdom of heaven.
translation:
  language: ru
  text: Итак, кто отменит одну из наименьших из этих заповедей[a] и научит людей поступать так же, тот будет назван малым в Небесном Царстве; а кто исполнит эти заповеди и научит им, тот будет назван великим в Небесном Царстве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «развяжет». Здесь возможно также: «нарушит», «упразднит» или «лишит обязательной силы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Итак
  rationale: Передаёт логический вывод из предыдущего утверждения и естественно звучит в современном русском повествовании.
- source_word: λύσῃ
  choice: отменит
  rationale: В контексте заповедей λύω означает лишить обязательной силы, упразднить или нарушить; «отменит» ясно передаёт юридико-нормативный оттенок, а буквальный образ раскрыт в сноске.
- source_word: μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων
  choice: одну из этих заповедей, даже самых малых
  rationale: Передаёт отнесение одной заповеди к числу малейших, не утверждая, что все указанные заповеди являются малыми.
- source_word: διδάξῃ οὕτως τοὺς ἀνθρώπους
  choice: научит людей поступать так же
  rationale: οὕτως отсылает к предшествующему действию, а ἀνθρώπους имеет обобщённое значение «людей»; русский вариант естественно выражает обе особенности.
- source_word: ἐλάχιστος κληθήσεται
  choice: будет назван малым
  rationale: Сохраняет будущий пассив и сравнительную оценку без добавления идеи исключения из Царства.
- source_word: ποιήσῃ καὶ διδάξῃ
  choice: исполнит их и научит им
  rationale: В отношении заповедей ποιέω естественно передаётся глаголом «исполнить»; подразумеваемый объект восстановлен из контекста.
- source_word: οὗτος μέγας κληθήσεται
  choice: тот будет назван великим
  rationale: Указательное «тот» сохраняет подчёркнутое противопоставление двух людей, а «великим» прямо передаёт μέγας.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: в Небесном Царстве
  rationale: Устоявшийся, естественный русский эквивалент характерного для Матфея выражения, без буквального и неидиоматичного множественного «небес».
theological_decisions:
- issue: Статус «малого» и «великого» в Небесном Царстве
  choice: Сохранено описание сравнительного статуса в Царстве без пояснения о спасении, исключении или степени награды.
  alternative: Истолковать «малого» как исключённого из Царства либо «великого» как обладателя особого ранга награды.
  rationale: Греческий текст говорит «в Царстве», но не разрешает более широкий богословский спор; перевод не должен делать это за текст.
- issue: Отсылка οὕτως
  choice: «поступать так же» отнесено к отмене или ослаблению обязательности заповеди.
  alternative: Передать наречие неопределённо как «так» либо связать его только со способом преподавания.
  rationale: Наиболее естественно οὕτως отсылает к предшествующему λύσῃ, однако сама формулировка не добавляет конкретного механизма нарушения.
- issue: Обобщённое τοὺς ἀνθρώπους
  choice: «людей»
  alternative: «мужчин» или родовое «человеков».
  rationale: Здесь форма обозначает людей вообще, а современный русский не требует мужского обозначения для сохранения этого обобщённого значения.
translation_notes:
  register: Современный литературный русский с достоинством и ясностью. Синтаксический параллелизм двух частей и повтор «будет назван… в Небесном Царстве» сохранены. Термин «Небесное Царство» выбран как естественная русская передача характерного для Матфея выражения.
