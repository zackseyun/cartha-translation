source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες καὶ διψῶντες τὴν δικαιοσύνην, ὅτι αὐτοὶ χορτασθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/006.yaml
  text: Blessed are those who hunger and thirst for righteousness[a], because they will be filled.
translation:
  language: ru
  text: Блаженны те, кто алчет и жаждет праведности[a], потому что они насытятся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливости». Греческое слово может означать праведность, справедливость или то, что правильно перед Богом.'
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Блаженны
  rationale: Традиционная и по-прежнему понятная формула заповедей блаженства; передаёт провозглашение Божьего благоволения, а не только субъективное ощущение счастья.
- source_word: οἱ πεινῶντες καὶ διψῶντες
  choice: те, кто алчет и жаждет
  rationale: Причастия настоящего времени выражают продолжающееся сильное стремление. «Алчет и жаждет» естественно сохраняет метафору голода и жажды и соответствует возвышенному, но понятному регистру.
- source_word: τὴν δικαιοσύνην
  choice: праведности
  rationale: «Праведность» сохраняет широкий богословский смысл δικαιοσύνη — того, что право и угодно Богу; возможность значения «справедливость» отмечена в сноске.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно передаёт причинно-пояснительную связь между провозглашением блаженства и последующим обещанием.
- source_word: αὐτοὶ
  choice: они
  rationale: Личное местоимение передаёт выраженное греческое подлежащее; дополнительное «именно» сделало бы русскую фразу тяжеловесной.
- source_word: χορτασθήσονται
  choice: насытятся
  rationale: Естественно передаёт будущий пассивный по смыслу результат и сохраняет образ утоления голода; в русском возвратная форма не уточняет действующего, оставляя подразумеваемое Божье действие.
theological_decisions:
- issue: Передача δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: В контексте Нагорной проповеди слово может охватывать как праведную жизнь перед Богом, так и справедливый порядок отношений. Основной текст сохраняет традиционно широкое «праведность», а сноска не позволяет утратить социально-правовой оттенок.
- issue: Неявный деятель в χορτασθήσονται
  choice: насытятся
  alternative: Бог насытит их
  rationale: Греческий пассив не называет деятеля, хотя в контексте подразумевается Божье действие. Русская возвратная форма сохраняет эту недосказанность и не добавляет в основной текст явно названного субъекта.
translation_notes:
  register: Современный литературный русский с достоинством, уместным для формулы блаженства. Сохранены традиционные «блаженны» и «праведность»; «алчет» слегка возвышенно, но общеупотребительно в устойчивом сочетании «алкать и жаждать» и точно передаёт силу образа.
