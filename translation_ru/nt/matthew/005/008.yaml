  text: μακάριοι οἱ καθαροὶ τῇ καρδίᾳ, ὅτι αὐτοὶ τὸν θεὸν ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/008.yaml
  text: Blessed are the pure in heart[b][a], because they will see God.
translation:
  language: ru
  text: Блаженны чистые сердцем, потому что они увидят Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Обещание «увидят Бога» может подразумевать непосредственное пребывание в Божьем присутствии, включая его будущее окончательное исполнение; перевод сохраняет формулировку оригинала, не сужая её смысл.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Блаженны
  rationale: Традиционное и по-прежнему понятное обозначение состояния тех, кто пользуется Божьим благоволением; оно не сводит смысл к субъективному счастью.
- source_word: καθαροὶ τῇ καρδίᾳ
  choice: чистые сердцем
  rationale: Естественное русское выражение, передающее чистоту внутреннего человека. «Чистые в сердце» звучало бы менее идиоматично, а «с чистым сердцем» несколько меняло бы конструкцию.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно передаёт основание или причину провозглашённого блаженства и соответствует современному литературному русскому языку.
- source_word: αὐτοὶ
  choice: они
  rationale: Местоимение выделяет именно названных людей как получателей обещания; в русской конструкции явное «они» сохраняет этот акцент без тяжеловесного «именно они».
- source_word: τὸν θεὸν
  choice: Бога
  rationale: Прямое и естественное соответствие прямому дополнению в греческом тексте.
- source_word: ὄψονται
  choice: увидят
  rationale: Прямо передаёт будущее обещание, не уточняя способ, время или характер видения.
theological_decisions:
- issue: Значение выражения «увидят Бога»
  choice: Сохранено прямое выражение «увидят Бога».
  alternative: «будут в присутствии Бога»; «узрят Бога при окончательном свершении»
  rationale: Фраза допускает смысл непосредственного доступа к Божьему присутствию и его будущего окончательного исполнения, однако греческий текст не раскрывает это подробнее. Перевод сохраняет богословскую ёмкость и напряжение исходной формулировки.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и лаконизма заповеди блаженства. Оборот «чистые сердцем» естественен и одновременно сохраняет традиционную библейскую узнаваемость.
