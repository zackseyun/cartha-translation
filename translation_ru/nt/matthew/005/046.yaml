  text: ἐὰν γὰρ ἀγαπήσητε τοὺς ἀγαπῶντας ὑμᾶς, τίνα μισθὸν ἔχετε; οὐχὶ καὶ οἱ τελῶναι ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/046.yaml
  text: For if you love those who love you[a], what reward do you have? Do not even the tax collectors do the same?
translation:
  language: ru
  text: Ведь если вы любите тех, кто любит вас, какая вам награда[a]? Разве даже сборщики налогов не делают того же самого?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «какая вам плата?» Греческое слово может означать «плату» или «награду»; здесь речь идёт о воздаянии в контексте учения Иисуса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Ведь если
  rationale: «Ведь» естественно связывает высказывание с предшествующим доводом, а «если» сохраняет условное значение ἐάν.
- source_word: ἀγαπήσητε
  choice: вы любите
  rationale: Аорист сослагательного наклонения после ἐάν выражает общее условие; русское настоящее время передаёт его естественно.
- source_word: τοὺς ἀγαπῶντας ὑμᾶς
  choice: тех, кто любит вас
  rationale: Субстантивированное причастие обозначает людей, определяемых их отношением к слушателям; формулировка сохраняет повтор корня «любить».
- source_word: τίνα μισθὸν ἔχετε
  choice: какая вам награда
  rationale: μισθός может означать плату или награду. В контексте этического наставления Нагорной проповеди «награда» звучит естественно и не сводит смысл к трудовому вознаграждению.
- source_word: οὐχὶ
  choice: Разве не
  rationale: οὐχί вводит риторический вопрос, предполагающий утвердительный ответ; «разве не» точно передаёт эту силу.
- source_word: καὶ
  choice: и
  rationale: 'В конструкции «разве не… и» частица передаёт включительно-усилительный оттенок: так поступают даже сборщики налогов.'
- source_word: τελῶναι
  choice: сборщики налогов
  rationale: Термин обозначает сборщиков налогов и пошлин; современное выражение ясно читателю и сохраняет исторический смысл без архаизации.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: то же самое делают
  rationale: Формулировка близко и естественно передаёт сочетание «делают то же самое».
theological_decisions:
- issue: Значение μισθός в нравственном наставлении Иисуса
  choice: награда
  alternative: плата; воздаяние
  rationale: «Награда» сохраняет идею последующего воздаяния в контексте Нагорной проповеди, не навязывая механистического учения о заслугах; сноска отмечает реальную лексическую широту слова.
translation_notes:
  register: Современный литературный русский язык; речь ясная, сдержанная и достойная. Риторический вопрос сохранён, богословская неоднозначность μισθός отмечена в сноске.
