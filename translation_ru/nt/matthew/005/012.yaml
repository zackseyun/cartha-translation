  variant: modern literary Russian
source:
  edition: SBLGNT
  text: χαίρετε καὶ ἀγαλλιᾶσθε, ὅτι ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς· οὕτως γὰρ ἐδίωξαν τοὺς προφήτας τοὺς πρὸ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/012.yaml
  text: Rejoice and be very glad[a], because your reward is great in the heavens; for in this way they persecuted the prophets who were before you.
translation:
  language: ru
  text: 'Радуйтесь и ликуйте, потому что велика ваша награда на небесах: ведь так гнали пророков, живших до вас.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαίρετε
  choice: Радуйтесь
  rationale: Настоящее повелительное наклонение во втором лице множественного числа выражает призыв к деятельной радости; это естественный и устойчивый русский эквивалент.
- source_word: ἀγαλλιᾶσθε
  choice: ликуйте
  rationale: Глагол обозначает особенно сильную, торжествующую радость и естественно усиливает предшествующее «радуйтесь».
- source_word: μισθὸς
  choice: награда
  rationale: В контексте Божьего воздаяния за перенесённые гонения «награда» звучит естественно и не придаёт выражению узко коммерческого смысла слова «плата».
- source_word: πολὺς
  choice: велика
  rationale: Предикативное прилагательное указывает на величие награды; сочетание «велика награда» естественно для современного литературного русского языка.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: на небесах
  rationale: Сохраняет множественное число греческого выражения и при этом является естественным русским библейским и общеупотребительным оборотом.
- source_word: οὕτως
  choice: так же
  rationale: 'Передаёт сопоставление: учеников гонят тем же образом, каким прежде гнали пророков.'
- source_word: ἐδίωξαν
  choice: гнали
  rationale: В данном контексте διώκω означает враждебное преследование; «гнали» кратко, ясно и идиоматично связывает стих с темой гонений.
- source_word: προφήτας
  choice: пророков
  rationale: Стандартное обозначение пророков Израиля.
- source_word: τοὺς πρὸ ὑμῶν
  choice: живших до вас
  rationale: Ясно выражает историческое предшествование пророков адресатам, не добавляя лишнего богословского содержания.
theological_decisions:
- issue: Значение выражения «на небесах»
  choice: 'Сохранено множественное число: «на небесах».'
  alternative: «на небе»
  rationale: Русское «на небесах» естественно передаёт греческое множественное ἐν τοῖς οὐρανοῖς. Выбор не уточняет сверх текста ни природу награды, ни устройство небесной сферы.
- issue: Связь гонений учеников с гонениями пророков
  choice: «так же гнали»
  alternative: «так гнали»
  rationale: 'Частица «же» делает сравнительную силу οὕτως прозрачной: переживания учеников сопоставляются с участью прежних пророков, без утверждения полного тождества обстоятельств.'
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Пара «радуйтесь и ликуйте» сохраняет нарастание двух греческих повелений; двоеточие естественно вводит поясняющее историческое основание.
