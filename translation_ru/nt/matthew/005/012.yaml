  source_fidelity: «Радуйтесь и ликуйте» точно передаёт два повеления χαίρετε καὶ ἀγαλλιᾶσθε с нарастанием интенсивности. «Велика ваша награда на небесах» верно отражает ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς; множественное «небесах» допустимо и естественно. В заключении сочетание «так же ... и пророков» может в русском прочитываться как добавочное («также преследовали и пророков»), тогда как οὕτως указывает прежде всего на способ/сопоставление. Устранение «же» и «и» делает эту связь однозначной.
  naturalness: Текст в целом современный, литературный и благозвучный. «Радуйтесь и ликуйте» и «на небесах» соответствуют возвышенному, но понятному регистру. «Ведь так гнали пророков» естественно звучит по-русски и яснее выражает сопоставительный смысл, чем исходное «ведь так же гнали и пророков».
  terminology: 'Ключевые термины переданы удачно: «награда» для μισθός, «небеса» для οὐρανοί и «пророки» для προφῆται. «Гнали» в данном контексте приемлемо передаёт враждебное преследование (ἐδίωξαν), сохраняя традиционный и понятный библейский оттенок. Сноски не требуются.'
