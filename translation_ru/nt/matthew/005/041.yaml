  text: καὶ ὅστις σε ἀγγαρεύσει μίλιον ἕν, ὕπαγε μετ’ αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/041.yaml
  text: And whoever forces you to go one mile[c][b][a], go with him two miles.
translation:
  language: ru
  text: И если кто принудит тебя пройти одну милю[a], пройди с ним две мили[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол может означать принудительное привлечение к службе по требованию властей; вероятно, здесь подразумевается известная в римскую эпоху повинность. Миля — римская мера расстояния.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «одну милю… две»; слово «мили» во второй части подразумевается.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: если кто
  rationale: Неопределённое относительное местоимение обозначает любой возможный случай; «если кто» естественно передаёт обобщающий смысл в современном русском языке.
- source_word: ἀγγαρεύσει
  choice: принудит тебя пройти
  rationale: Глагол означает принудительное привлечение к службе или исполнению требования, нередко по властному распоряжению. «Принудит» сохраняет выраженный оттенок несвободы, а движение передаётся в сочетании с указанием расстояния.
- source_word: μίλιον ἕν
  choice: одну милю
  rationale: Речь идёт о римской миле. Прямое обозначение сохраняет исторический образ и конкретное расстояние исходного текста.
- source_word: ὕπαγε
  choice: пройди
  rationale: Императив призывает отправиться или продолжить путь. В сочетании с расстоянием «пройди» звучит по-русски естественнее, чем буквальное «иди».
- source_word: μετ’ αὐτοῦ
  choice: с ним
  rationale: Предлог μετά с родительным падежом выражает совместное движение; «с ним» является прямым и естественным соответствием.
- source_word: δύο
  choice: две мили
  rationale: В греческом стоит только числительное «две», а единица расстояния подразумевается из первой части. В русском языке существительное восполнено ради ясности и естественности.
theological_decisions:
- issue: Историко-социальный смысл принудительной службы
  choice: Передать принуждение, не называя в основном тексте римских воинов или должностных лиц.
  alternative: Прямо истолковать требование как приказ римского солдата нести поклажу.
  rationale: Глагол и упоминание мили вызывают ассоциацию с принудительной службой в условиях римской власти, однако сам греческий текст не называет ни солдата, ни вид поручения. Перевод сохраняет исторически значимый оттенок принуждения, не сужая смысл сверх сказанного.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Конструкция сохраняет прямое обращение в единственном числе и параллелизм между одной и двумя милями.
