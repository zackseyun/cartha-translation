  text: ὅπως γένησθε υἱοὶ τοῦ πατρὸς ὑμῶν τοῦ ⸀ἐν οὐρανοῖς, ὅτι τὸν ἥλιον αὐτοῦ ἀνατέλλει ἐπὶ πονηροὺς καὶ ἀγαθοὺς καὶ βρέχει ἐπὶ δικαίους καὶ ἀδίκους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/045.yaml
  text: so that you may become sons of your Father in heaven[a], because he makes his sun rise on evil and good[c][b], and sends rain on righteous and unrighteous.
translation:
  language: ru
  text: чтобы вы стали сынами вашего Отца, Который на небесах[a], потому что Он даёт Своему солнцу восходить над злыми и добрыми и посылает дождь на праведных и неправедных[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст: «Отца вашего, Который в небесах»; слово «небеса» стоит во множественном числе. Возможен более привычный перевод: «вашего Небесного Отца».'
    reason: lexical_alternative
  - marker: b
    text: Греческий глагол буквально означает «дождит», то есть «идёт дождь»; «посылает дождь» — естественная русская передача Божьего действия.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: чтобы
  rationale: Естественно передаёт целевое, с возможным оттенком результата, значение союза.
- source_word: γένησθε
  choice: вам стать
  rationale: Сохраняет динамическое значение γίνομαι — «стать», не превращая его в статическое «быть» и не уточняя сверх текста богословский механизм сыновства.
- source_word: υἱοὶ
  choice: сынами
  rationale: Передаёт прямо выраженное мужское множественное число и сохраняет образ сыновства; по контексту обращение относится ко всем ученикам.
- source_word: τοῦ πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: вашего Отца, Который на небесах
  rationale: Сохраняет отдельное определение τοῦ ἐν οὐρανοῖς и греческое множественное число, при этом фраза остаётся понятной по-русски.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно вводит основание предшествующего призыва.
- source_word: τὸν ἥλιον αὐτοῦ ἀνατέλλει
  choice: повелевает Своему солнцу восходить
  rationale: Передаёт каузативный смысл конструкции с солнцем как объектом и сохраняет явное αὐτοῦ — «Своему».
- source_word: ἐπὶ πονηροὺς καὶ ἀγαθοὺς
  choice: над злыми и добрыми
  rationale: Субстантивированные прилагательные переданы кратко и симметрично, без добавления отсутствующего существительного «людьми».
- source_word: βρέχει
  choice: посылает дождь
  rationale: Идиоматично выражает по-русски действие Бога; буквальное «дождит» здесь невозможно, а «проливает дождь» менее естественно.
- source_word: ἐπὶ δικαίους καὶ ἀδίκους
  choice: праведным и неправедным
  rationale: Сохраняет традиционную и точную нравственную антитезу; русский дательный естественен при выражении благодеяния «посылает дождь».
theological_decisions:
- issue: Гендерно маркированный язык сыновства
  choice: сынами вашего Отца
  alternative: детьми вашего Отца
  rationale: В источнике стоит υἱοί, а не τέκνα. «Сынами» сохраняет исходный образ сыновства, не исключая общего для учеников представительного смысла.
- issue: Значение γένησθε применительно к сыновству Бога
  choice: вам стать
  alternative: вам быть; вам явить себя сынами
  rationale: «Стать» сохраняет лексическую динамику глагола. Перевод не добавляет утверждения о том, каким именно образом возникает или подтверждается статус сыновства; этическая связь с уподоблением Отцу остаётся в контексте.
- issue: Божье действие в природных явлениях
  choice: повелевает Своему солнцу восходить… и посылает дождь
  alternative: даёт Своему солнцу восходить… и орошает дождём
  rationale: Формулировка сохраняет явную Божью деятельность в обеих параллельных частях, не превращая стих в отвлечённое описание природы.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Сохранены параллелизм и краткие нравственные противопоставления. Заглавные местоимения при обращении к Богу употреблены в соответствии с распространённой русской библейской издательской практикой.
