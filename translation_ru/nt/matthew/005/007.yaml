  text: μακάριοι οἱ ἐλεήμονες, ὅτι αὐτοὶ ἐλεηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/007.yaml
  text: Blessed are the merciful[a], for they will be shown mercy.
translation:
  language: ru
  text: Блаженны милосердные, потому что они будут помилованы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: Блаженны
  rationale: Традиционная и по-прежнему понятная формула заповедей блаженства; обозначает состояние благоволения и благополучия перед Богом, а не просто субъективное счастье.
- source_word: οἱ ἐλεήμονες
  choice: милосердные
  rationale: Субстантивированное прилагательное передано кратко и афористично. «Милосердные» сохраняет смысловую и корневую связь с последующим «помилованы».
- source_word: ὅτι
  choice: потому что
  rationale: Ясно передаёт причинно-обосновывающее значение союза в современном русском языке.
- source_word: αὐτοὶ
  choice: они
  rationale: Личное местоимение сохраняет выделение именно милосердных как получателей обещанной милости; усиленное «они сами» по-русски могло бы ошибочно намекать, что они помилуют себя.
- source_word: ἐλεηθήσονται
  choice: будут помилованы
  rationale: Будущее страдательного залога передано непосредственно, без называния действующего лица; корень «мил-» поддерживает словесную связь с «милосердные».
theological_decisions:
- issue: Кто окажет обещанную милость
  choice: 'Сохранить безличную страдательную конструкцию: «будут помилованы».'
  alternative: «Бог помилует их» или «они получат милость».
  rationale: В греческом тексте действующее лицо не названо. Контекст допускает и убедительно подразумевает Бога, однако перевод не должен делать это подразумевание явным дополнением.
translation_notes:
  register: Краткий, возвышенный, но понятный современному читателю стиль. Сохранены параллелизм и афористичность оригинала; архаическое «ибо» заменено естественным «потому что».
