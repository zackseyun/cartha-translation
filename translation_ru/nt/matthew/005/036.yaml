  text: μήτε ἐν τῇ κεφαλῇ σου ὀμόσῃς, ὅτι οὐ δύνασαι μίαν τρίχα λευκὴν ⸂ποιῆσαι ἢ μέλαιναν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/036.yaml
  text: Nor shall you swear by your head[a], because you are not able to make one hair white or black.
translation:
  language: ru
  text: И своей головой не клянись, потому что ты не можешь сделать ни один волос белым или чёрным.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτε
  choice: Не… и
  rationale: Продолжает ряд предшествующих запретов; такая конструкция естественно передаёт присоединительное отрицание в современном русском языке.
- source_word: ἐν τῇ κεφαλῇ σου
  choice: своей головой
  rationale: При глаголе ὀμνύω предлог ἐν указывает на то, чем клянутся; русский творительный падеж передаёт эту клятвенную формулу естественно и точно.
- source_word: ὀμόσῃς
  choice: не клянись
  rationale: Аорист конъюнктива с μήτε выражает запрет; повелительная форма с отрицанием наиболее естественна по-русски.
- source_word: ὅτι
  choice: потому что
  rationale: Сохраняет причинную связь между запретом и последующим обоснованием.
- source_word: οὐ δύνασαι
  choice: ты не можешь
  rationale: Прямо и естественно передаёт отсутствие способности или власти.
- source_word: μίαν τρίχα
  choice: ни одного волоса
  rationale: В отрицательном русском предложении конструкция «ни одного» естественно сохраняет акцент на невозможности изменить даже один волос.
- source_word: λευκὴν … ἢ μέλαιναν
  choice: белым или чёрным
  rationale: Сохраняет основные цветовые значения и резкий контраст исходного текста без истолковывающего смягчения.
- source_word: ποιῆσαι
  choice: сделать
  rationale: 'Передаёт каузативный смысл ποιέω: сделать так, чтобы волос был белым или чёрным.'
theological_decisions:
- issue: Объём запрета на клятвы
  choice: Передать прямой запрет клясться своей головой, не расширяя его до сформулированного запрета всех клятв.
  alternative: Истолковать стих как абсолютный запрет любых клятв либо как осуждение лишь уклончивых клятвенных формул.
  rationale: Сам стих называет конкретную клятвенную формулу и обосновывает запрет ограниченностью человеческой власти; более широкий богословский вопрос переводом не разрешается.
translation_notes:
  register: Современный литературный русский язык; обращение на «ты» соответствует греческому единственному числу и сохраняет прямой, наставительный характер речи. Формулировка лаконична и достойна, без архаизмов.
