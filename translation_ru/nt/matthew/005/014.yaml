  text: Ὑμεῖς ἐστε τὸ φῶς τοῦ κόσμου. οὐ δύναται πόλις κρυβῆναι ἐπάνω ὄρους κειμένη·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/014.yaml
  text: You are the light of the world[a]. A city set on a hill cannot be hidden.
translation:
  language: ru
  text: Вы — свет мира. Не может укрыться город, стоящий на горе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Вы
  rationale: Личное местоимение в греческом тексте выражено явно и имеет смысловое ударение. В русском прямое «Вы» естественно передаёт обращение ко всем слушателям; акцент дополнительно поддержан тире.
- source_word: τὸ φῶς
  choice: свет
  rationale: В именной части сказуемого русский язык обычно не воспроизводит греческий артикль отдельным средством; «свет» сохраняет прямую метафору.
- source_word: τοῦ κόσμου
  choice: мира
  rationale: Родительный падеж буквально и естественно передаёт греческий генитив, не заменяя его более толковательным «для мира».
- source_word: οὐ δύναται ... κρυβῆναι
  choice: не может укрыться
  rationale: Оборот естественно передаёт невозможность остаться незаметным. Возвратная форма «укрыться» здесь имеет непереходное значение и соответствует греческому пассивному инфинитиву.
- source_word: πόλις
  choice: город
  rationale: Обычное и контекстуально уместное соответствие πόλις.
- source_word: ἐπάνω ὄρους
  choice: на горе
  rationale: ὄρος может обозначать гору или возвышенность; «на горе» сохраняет более прямое лексическое соответствие, не уточняя размер рельефа.
- source_word: κειμένη
  choice: стоящий
  rationale: Причастие означает «расположенный, находящийся, лежащий». По-русски о городе естественно сказать «стоящий на горе»; это передаёт положение, а не действие установки.
theological_decisions:
- issue: Метафорическое отождествление учеников со светом
  choice: «Вы — свет мира»
  alternative: «Вы — свет для мира»
  rationale: Сохранена прямая метафора и форма греческого генитива без поясняющего целевого значения, которое могло бы сузить смысл.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и понятная формулировка. Тире естественно оформляет именное сказуемое и поддерживает акцент явного Ὑμεῖς.
