review_pass:
  verdict: approve
  source_fidelity: 'Текст точно передаёт обе части греческого стиха: явное обращение «Вы», метафору «свет мира», невозможность скрытия города и его положение на горе. «Укрыться» естественно выражает κρυβῆναι («быть скрытым»), а «стоящий на горе» в данном образе передаёт κειμένη («расположенный/находящийся»), не вводя дополнительного топографического уточнения.'
  naturalness: Формулировка краткая, ясная и естественная для современного литературного русского языка. Тире в «Вы — свет мира» нормативно и уместно. Порядок слов во втором предложении немного книжный, но хорошо соответствует афористическому регистру стиха.
  terminology: «Свет мира» — точное, устойчивое и ненавязчивое соответствие τὸ φῶς τοῦ κόσμου. «Город» точно передаёт πόλις; «гора» сохраняет диапазон ὄρος без интерпретирующего выбора «холм» или добавления «вершина». Богословских добавлений нет.
