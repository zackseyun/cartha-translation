reference: Matthew 5:32
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι ⸂πᾶς ὁ ἀπολύων⸃ τὴν γυναῖκα αὐτοῦ παρεκτὸς λόγου πορνείας ποιεῖ αὐτὴν ⸀μοιχευθῆναι, καὶ ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/032.yaml
  text: But I say to you that everyone who divorces his wife[a], except on the ground of sexual immorality, makes her commit adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: ru
  text: 'Но Я говорю вам: всякий, кто разводится со своей женой, кроме как по причине сексуальной безнравственности[a], делает её прелюбодейкой[b]; и кто женится на разведённой женщине, тот прелюбодействует.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово πορνεία имеет широкий смысл и обозначает недозволенное сексуальное поведение; его также переводят словами «блуд» или «половая распущенность».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально возможно: «делает так, что она становится прелюбодейкой»; греческий инфинитив имеет пассивную форму.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύων / ἀπολελυμένην
  choice: разводится / разведённой женщине
  rationale: В контексте брака глагол ἀπολύω означает расторжение брака, а не просто «отпустить» или «отослать». Единая лексика сохраняет юридико-брачный смысл обеих форм.
- source_word: γυναῖκα
  choice: женой
  rationale: Хотя γυνή может означать и «женщина», и «жена», притяжательное αὐτοῦ и контекст развода однозначно указывают здесь на жену.
- source_word: παρεκτὸς λόγου πορνείας
  choice: не по причине сексуальной безнравственности
  rationale: παρεκτός вводит исключение, а λόγος здесь имеет смысл причины или основания. «Сексуальная безнравственность» передаёт широкий охват πορνεία и не сужает его до одного конкретного вида нарушения.
- source_word: ποιεῖ αὐτὴν μοιχευθῆναι
  choice: тем самым делает её прелюбодейкой
  rationale: Оборот ποιέω с инфинитивом выражает причинность. Такая формулировка естественна по-русски и вместе с тем сохраняет результативно-пассивный оттенок формы μοιχευθῆναι лучше, чем однозначно активное «заставляет её прелюбодействовать».
- source_word: ὃς ἐὰν ... γαμήσῃ
  choice: кто женится
  rationale: Относительное предложение с ἐάν выражает общее неопределённое условие; русское «кто женится» передаёт его кратко и естественно.
- source_word: μοιχᾶται
  choice: прелюбодействует
  rationale: Настоящая форма естественно передаётся русским глаголом настоящего времени без искусственного уточнения залога.
- source_word: πᾶς ὁ ἀπολύων
  choice: всякий, кто разводится
  rationale: Формула обозначает любого человека, к которому относится названное действие; мужская социальная ситуация остаётся явной благодаря словам «со своей женой».
theological_decisions:
- issue: Смысл исключения παρεκτὸς λόγου πορνείας
  choice: 'Передать как действительное исключение: «не по причине сексуальной безнравственности».'
  alternative: «кроме случая незаконного брака» или формулировка, не признающая здесь исключения
  rationale: Греческий текст прямо вводит исключение, но не определяет точный объём понятия πορνεία. Перевод сохраняет как само исключение, так и широту термина, не разрешая спор толкований.
- issue: Значение μοιχευθῆναι после ποιεῖ
  choice: «тем самым делает её прелюбодейкой»
  alternative: «заставляет её прелюбодействовать» или «становится причиной прелюбодеяния против неё»
  rationale: Инфинитив пассивен по форме, и его можно понимать результативно либо передавать идиоматически активной конструкцией. Основной текст сохраняет результативный оттенок, а примечание указывает на грамматическую неоднозначность, не превращая её в отдельное учение.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным библейским звучанием. Заглавное «Я» отмечает речь Иисуса по принятой русской издательской норме. Термин «прелюбодействовать» сохранён как точный и общеупотребительный в библейском контексте; более традиционное «блуд» вынесено в примечание из-за его возможной неясности и более узких современных ассоциаций.
