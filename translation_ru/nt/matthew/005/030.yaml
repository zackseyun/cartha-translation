id: MAT.5.30
reference: Matthew 5:30
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ εἰ ἡ δεξιά σου χεὶρ σκανδαλίζει σε, ἔκκοψον αὐτὴν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου ⸂εἰς γέενναν ἀπέλθῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/030.yaml
  text: And if your right hand causes you to stumble[a], cut it off and throw it away[c][b]. For it is better for you that one of your members should perish than that your whole body should go into Gehenna.
translation:
  language: ru
  text: И если твоя правая рука заставляет тебя спотыкаться[a], отсеки её и отбрось от себя. Ведь для тебя лучше, чтобы погибла одна часть твоего тела, чем чтобы всё твоё тело отправилось в геенну[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вводит тебя в грех». Греческий глагол буквально передаёт образ того, как кого-либо заставляют споткнуться.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в ад». Греческое слово «геенна» восходит к названию долины Еннома и употребляется как обозначение окончательного суда.'
    reason: alternative_reading
lexical_decisions:
- source_word: δεξιά ... χείρ
  choice: твоя правая рука
  rationale: Естественное русское соответствие, сохраняющее конкретный телесный образ и параллель с предыдущим стихом.
- source_word: σκανδαλίζει
  choice: заставляет тебя спотыкаться
  rationale: Сохраняет метафору преткновения, которая в контексте означает побуждение или вовлечение в грех; смысловая альтернатива приведена в сноске.
- source_word: ἔκκοψον
  choice: отсеки её
  rationale: Передаёт решительный характер повеления и точнее подходит к образу руки, чем более общее «отрежь».
- source_word: βάλε ἀπὸ σοῦ
  choice: отбрось от себя
  rationale: Передаёт как энергичное действие βάλε, так и удаление, выраженное ἀπὸ σοῦ, и звучит естественно по-русски.
- source_word: συμφέρει γάρ σοι
  choice: ведь для тебя лучше
  rationale: Выражает сравнительное преимущество в данном контексте без неуместного оттенка материальной выгоды.
- source_word: ἵνα ἀπόληται
  choice: чтобы погибла
  rationale: Сохраняет силу глагола ἀπόλλυμι и контраст между утратой одной части и участью всего тела.
- source_word: ἓν τῶν μελῶν σου
  choice: одна часть твоего тела
  rationale: Современное и понятное выражение; «член» в современном русском двусмысленен, а «конечность» была бы семантически уже греческого μέλος.
- source_word: ὅλον τὸ σῶμά σου
  choice: всё твоё тело
  rationale: Прямо сохраняет противопоставление одной части целому телу.
- source_word: εἰς γέενναν ἀπέλθῃ
  choice: отправилось в геенну
  rationale: Передаёт движение, выраженное ἀπέρχομαι с εἰς, не добавляя отсутствующую в греческом мысль о том, что тело туда бросают; термин «геенна» сохранён.
theological_decisions:
- issue: Передача γέεννα
  choice: геенна
  alternative: ад
  rationale: Транслитерация сохраняет исторически и богословски насыщенный исходный термин, связанный с долиной Еннома, и не сводит его без пояснения ко всем более поздним представлениям, связанным со словом «ад».
- issue: Значение σκανδαλίζει
  choice: заставляет тебя спотыкаться
  alternative: вводит тебя в грех
  rationale: Основной текст сохраняет метафору исходника и её напряжённость, а сноска поясняет подразумеваемый нравственный смысл, не подменяя им образ.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной синтаксической формой. Телесная и нравственная резкость высказывания сохранена; эвфемизация и конфессионально обусловленные толкования не добавлялись.
