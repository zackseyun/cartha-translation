base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/011.yaml
  text: Blessed are you when they insult you and persecute you and falsely say every kind of evil against you because of me[a][b][c].
translation:
  language: ru
  text: Блаженны вы, когда вас оскорбляют[a], преследуют и ложно говорят против вас всякое зло[b] из-за Меня[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поносят вас».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «говорят о вас всякое зло».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ради Меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοί ἐστε
  choice: Блаженны вы
  rationale: Сохраняет формулу блаженства и её богословскую весомость; выражение укоренено в русском библейском стиле и остаётся понятным современному читателю.
- source_word: ὅταν
  choice: когда
  rationale: Естественно передаёт общее условие, относящееся к возможным и повторяющимся случаям, без излишнего подчёркивания многократности.
- source_word: ὀνειδίσωσιν ὑμᾶς
  choice: вас оскорбляют
  rationale: Ясно и современно передаёт словесное унижение; более традиционное «поносят» вынесено в примечание.
- source_word: διώξωσιν
  choice: преследуют
  rationale: Сохраняет широкий смысл враждебного притеснения за связь с Иисусом, не ограничивая его физическим насилием.
- source_word: εἴπωσιν πᾶν πονηρὸν καθ’ ὑμῶν
  choice: говорят о вас всякое зло
  rationale: Передаёт всеохватность злонамеренных высказываний и звучит естественнее, чем буквальное «говорят против вас».
- source_word: ψευδόμενοι
  choice: лгая
  rationale: Сохраняет форму обстоятельственного причастия и прямо показывает, что злые высказывания не соответствуют истине.
- source_word: ἕνεκεν ἐμοῦ
  choice: из-за Меня
  rationale: Прямо выражает причину враждебного отношения — связь учеников с Иисусом; вариант «ради Меня» отмечен в примечании.
theological_decisions:
- issue: Характер описанного противодействия
  choice: Стих охватывает оскорбления, преследование и ложные злые высказывания из-за связи с Иисусом, не уточняя конкретную форму преследования.
  alternative: Ограничить преследование только физическим насилием либо свести всё противодействие к одной лишь клевете.
  rationale: Три однородных глагольных выражения описывают широкий спектр враждебности; перевод не сужает его до юридического, физического или социального преследования.
- issue: Связь ψευδόμενοι со злой речью
  choice: «лгая» относится к высказыванию всякого зла и указывает на ложность обвинений.
  alternative: Понять выражение как отдельное общее обвинение противников во лжи.
  rationale: Грамматически причастие сопровождает εἴπωσιν и характеризует произносимые против учеников злые слова как ложные.
translation_notes:
  register: Современный литературный русский язык с сохранением узнаваемой формулы блаженства. Синтаксис близок к греческому оригиналу, но естественен для русского чтения; «лгая» сохраняет смысловую связь ложности с произносимым злом.
