    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Блаженны
  rationale: Устоявшееся и точное обозначение провозглашаемого Богом благого состояния; в отличие от «счастливы», не сводит смысл к субъективному чувству.
- source_word: οἱ δεδιωγμένοι
  choice: гонимые
  rationale: Субстантивированное причастие совершенного вида указывает на тех, кто подвергся гонению и остаётся в положении гонимых; русская форма естественно передаёт эту результирующую характеристику без излишней тяжеловесности.
- source_word: ἕνεκεν
  choice: за
  rationale: В сочетании «гонимые за праведность» кратко и естественно передаёт основание гонений; смысл соответствует «из-за / ради».
- source_word: δικαιοσύνης
  choice: праведность
  rationale: Сохраняет широкий смысл соответствия Божьей воле в положении и поступках; возможный оттенок справедливости отмечен в сноске.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно вводит основание провозглашённого блаженства и звучит естественно в современном русском языке.
- source_word: αὐτῶν ἐστιν
  choice: им принадлежит
  rationale: Естественно передаёт греческую притяжательную конструкцию и сохраняет настоящее время.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Небесное Царство
  rationale: Естественный современный русский эквивалент характерного для Матфея выражения о Божьем небесном царствовании; избегает буквального, но неидиоматичного «Царство небес».
theological_decisions:
- issue: Передача δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: В данном контексте слово прежде всего обозначает жизнь в согласии с Божьей волей, однако греческое понятие может включать и смысл справедливости; эта смысловая возможность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством традиционной формулы заповеди блаженства. Синтаксис краткий и доступный; «Блаженны» сохраняет библейский регистр, а «потому что» и «им принадлежит» обеспечивают современную ясность.
