id: MAT.5.5
reference: Matthew 5:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μακάριοι οἱ πραεῖς, ὅτι αὐτοὶ κληρονομήσουσι τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/005.yaml
  text: Blessed are the meek[b][a], because they will inherit the earth.
translation:
  language: ru
  text: Блаженны кроткие[a], потому что они наследуют землю[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мягкие», «смиренные». Кротость здесь означает смиренную мягкость, а не слабость.'
    reason: lexical_alternative
  - marker: b
    text: Слово «земля» может обозначать также «страну». Вероятно, здесь звучит отзвук Псалма 36:11 (37:11 в другой нумерации), поэтому обещание допускает как связь с обетованной землёй, так и более широкий смысл.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Блаженны
  rationale: Традиционная и по-прежнему понятная формула заповедей блаженства; передаёт Божье благоволение и истинное благополучие, не сводя смысл к субъективному счастью.
- source_word: οἱ πραεῖς
  choice: кроткие
  rationale: Передаёт мягкость, смирение и отказ от агрессивного самоутверждения, а не слабость или робость; субстантивированное прилагательное естественно воспроизводится русским прилагательным во множественном числе.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно выражает основание провозглашённого блаженства и звучит естественно в современном русском языке.
- source_word: αὐτοὶ
  choice: они
  rationale: Сохраняет выраженное греческим местоимением смысловое выделение обещанных наследников; более буквальное «они сами» в краткой формуле звучало бы избыточно.
- source_word: κληρονομήσουσι
  choice: наследуют
  rationale: Прямо передаёт получение наследства и сохраняет связь с языком Божьего обетования.
- source_word: τὴν γῆν
  choice: землю
  rationale: 'Русское «землю» естественно сохраняет присущую γῆ неоднозначность: речь может идти как о земле в широком смысле, так и об обетованной земле в отзвуке Псалма 36:11 (37:11 в иной нумерации).'
theological_decisions:
- issue: Объём значения τὴν γῆν
  choice: землю
  alternative: обетованную землю; всю землю
  rationale: Греческое γῆ допускает локально-заветный и всеобщий смысл. Русское «землю» не вынуждает выбирать между ними и тем самым сохраняет вероятный отзвук псалма вместе с более широким эсхатологическим прочтением.
- issue: Характер πραεῖς
  choice: кроткие
  alternative: мягкие; смиренные
  rationale: «Кроткие» удерживает соединение смирения и мягкости без предположения бессилия; примечание предотвращает распространённое ошибочное понимание как слабости.
translation_notes:
  register: Современный литературный русский с сохранением узнаваемой библейской формулы «Блаженны…». Синтаксис краток и достоин оригинальной макаризмы; неоднозначность γῆ сохранена в основном тексте и пояснена в примечании.
