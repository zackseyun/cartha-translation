source:
  edition: SBLGNT
  text: οὐδὲ καίουσιν λύχνον καὶ τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, καὶ λάμπει πᾶσιν τοῖς ἐν τῇ οἰκίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/015.yaml
  text: Nor do people light a lamp and put it under a basket[a], but on a lampstand[b], and it gives light to everyone in the house.
translation:
  language: ru
  text: И не зажигают светильник и не ставят его под мерный сосуд[a], но на подставку для светильника; и он светит всем в доме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Модий — мера сыпучих продуктов и, по расширенному значению, сосуд для их отмеривания.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: И не
  rationale: Связывает этот пример с предыдущим отрицательным высказыванием и естественно звучит по-русски.
- source_word: καίουσιν λύχνον
  choice: зажигают светильник
  rationale: Передаёт конкретный образ масляного светильника и обычное действие с ним.
- source_word: τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον
  choice: чтобы поставить его под мерный сосуд
  rationale: Русская целевая конструкция естественно выражает подразумеваемую нелепую цель действия; μόδιος обозначает меру сыпучих тел и соответствующий сосуд.
- source_word: ἀλλ’ ἐπὶ τὴν λυχνίαν
  choice: но ставят на подставку
  rationale: Восстановленный глагол делает русскую фразу ясной; «подставка» обозначает предназначенное для светильника возвышение без анахроничного образа современного фонаря.
- source_word: λάμπει
  choice: светит
  rationale: Прямо сохраняет значение «сиять, светить» и допускает связь как с самим светильником, так и с его назначением.
- source_word: πᾶσιν τοῖς ἐν τῇ οἰκίᾳ
  choice: всем в доме
  rationale: Кратко и естественно сохраняет всеобщий охват и пространственное значение οἰκία.
theological_decisions:
- issue: Не выраженный явно субъект глаголов третьего лица множественного числа
  choice: Безлично-обобщённое «зажигают… ставят»
  alternative: «Люди не зажигают…» или «никто не зажигает…»
  rationale: Русская неопределённо-личная конструкция точно передаёт обобщённый греческий субъект, не добавляя явно названных действующих лиц и не превращая утверждение в абсолютное «никто».
- issue: Связь καὶ перед τιθέασιν
  choice: Передана целевой конструкцией «чтобы поставить»
  alternative: «И ставят его под…»
  rationale: В контексте зажигания светильника конструкция описывает цель последующего помещения; такой перевод естественен по-русски и не меняет смысл противопоставления.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная структура сохранена. «Светильник» точнее передаёт древнюю масляную лампу, а «мерный сосуд» сохраняет исторический предмет без малопонятного традиционного «бушеля».
