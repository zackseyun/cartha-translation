  text: Ἔσεσθε οὖν ὑμεῖς τέλειοι ⸀ὡς ὁ πατὴρ ὑμῶν ὁ ⸀οὐράνιος τέλειός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/048.yaml
  text: You[a], therefore, shall be perfect, as your heavenly Father is perfect.
translation:
  language: ru
  text: Итак, будьте совершенны[a], как совершенен ваш Небесный Отец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «целостны», «полны» или «зрелы». Греческое τέλειος может обозначать не только совершенство, но также полноту, цельность или зрелость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔσεσθε
  choice: будьте
  rationale: Будущее изъявительное εἰμί в данном контексте имеет повелительно-наставительный смысл; русское «будьте» естественно и ясно передаёт призыв, не превращая его в простое предсказание.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предшествующего наставления, особенно из призыва любить врагов.
- source_word: ὑμεῖς
  choice: вы (выражено формой «будьте»)
  rationale: В греческом местоимение подчёркнуто, однако в русском отдельное «вы» здесь звучало бы тяжеловесно; личная форма повелительного наклонения достаточно ясно обращена к слушателям.
- source_word: τέλειοι / τέλειός
  choice: совершенны / совершенен
  rationale: Сохраняет повтор одного греческого слова и силу сопоставления учеников с Отцом; возможные значения полноты и цельности отмечены в сноске.
- source_word: ὡς
  choice: как
  rationale: Естественно вводит сопоставление с совершенством Отца.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: ваш Небесный Отец
  rationale: Естественная русская передача атрибутивной конструкции; прописные буквы указывают на наименование Бога.
theological_decisions:
- issue: Значение τέλειος в этическом призыве
  choice: «совершенны» в основном тексте с пояснением семантического диапазона в сноске
  alternative: «целостны», «полны», «зрелы»
  rationale: «Совершенны» прямо сохраняет напряжённую силу призыва и параллель с Отцом, тогда как сноска не позволяет сузить τέλειος исключительно до идеи безгрешной абсолютности и отражает контекст цельной, неразделённой любви.
translation_notes:
  register: Современный литературный русский язык, краткий и торжественный. «Итак» сохраняет логическую связь с предыдущим наставлением; «будьте» естественно передаёт побудительное употребление греческого будущего времени.
