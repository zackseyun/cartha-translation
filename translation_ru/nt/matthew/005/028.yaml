id: MAT.5.28
reference: Matthew 5:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ βλέπων γυναῖκα πρὸς τὸ ἐπιθυμῆσαι αὐτὴν ἤδη ἐμοίχευσεν αὐτὴν ἐν τῇ καρδίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/028.yaml
  text: But I say to you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart[a][b][c].
translation:
  language: ru
  text: 'А я говорю вам: всякий, кто смотрит на женщину[a], чтобы возжелать её[b], уже совершил с ней прелюбодеяние в своём сердце.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может означать как «женщину», так и «жену» — в зависимости от контекста.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с вожделением»; буквально конструкция указывает на цель или намерение: «чтобы возжелать её».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: А я говорю вам
  rationale: «А» естественно передаёт противопоставление δέ предыдущему положению; местоимение «я» сохраняет эмфатическое ἐγώ, а «говорю вам» близко к λέγω ὑμῖν и звучит современно.
- source_word: πᾶς ὁ βλέπων
  choice: всякий, кто смотрит
  rationale: Передаёт обобщающий характер конструкции и универсальную силу πᾶς, не добавляя отсутствующего в греческом тексте слова «мужчина».
- source_word: γυναῖκα
  choice: на женщину
  rationale: γυνή может означать как женщину, так и жену. В общем нравственном высказывании более широкое «женщину» не сужает смысл исходного текста; возможность значения «жену» отмечена в сноске.
- source_word: πρὸς τὸ ἐπιθυμῆσαι αὐτήν
  choice: чтобы возжелать её
  rationale: Союз «чтобы» сохраняет значение цели или намеренной направленности, выраженное πρὸς с субстантивированным инфинитивом. «Возжелать» в данном контексте ясно обозначает неправомерное половое желание, не превращая фразу лишь в описание случайно возникшего чувства.
- source_word: ἤδη ἐμοίχευσεν αὐτήν
  choice: уже совершил с ней прелюбодеяние
  rationale: «Уже» точно передаёт ἤδη, а устойчивое русское выражение «совершить прелюбодеяние с кем-либо» естественно передаёт μοιχεύω с прямым дополнением.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: в своём сердце
  rationale: Сохраняет библейский образ сердца как внутреннего мира человека — области мыслей, намерений и желаний — и при этом остаётся понятным современному читателю.
theological_decisions:
- issue: Передавать ли γυνή словом «женщина» или «жена»
  choice: женщина
  alternative: жена, в том числе чужая жена
  rationale: Греческое слово само по себе не уточняет семейное положение. Контекст прелюбодеяния допускает значение «жена», но основной текст не должен устранять подлинную лексическую неоднозначность.
- issue: Передавать ли πρὸς τὸ ἐπιθυμῆσαι как намеренную цель взгляда или просто как сопровождающее его желание
  choice: чтобы возжелать её
  alternative: с вожделением; желая её
  rationale: Конструкция πρὸς τό с инфинитивом обычно выражает цель или направленность. Выбранная формулировка сохраняет нравственно значимое намерение, не утверждая, будто любой замеченный взгляд сам по себе равен прелюбодеянию.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Возжелать» несколько возвышенно, но понятно и здесь точнее нейтрального «пожелать», которое в современном русском недостаточно ясно выражает половое желание. Пунктуация делает прямое утверждение естественным для русского чтения.
