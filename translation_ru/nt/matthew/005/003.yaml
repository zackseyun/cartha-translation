  text: Блаженны нищие духом[b], потому что им принадлежит Царство Небесное[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Царство небес» — характерное для Евангелия от Матфея выражение.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «нищие духом» можно также понимать как «духовно нищие» или «осознающие свою духовную нужду»; основной текст сохраняет открытость греческого выражения.
    reason: alternative_reading
lexical_decisions:
- source_word: Μακάριοι
  choice: Блаженны
  rationale: Традиционное и по-прежнему понятное русское соответствие в контексте заповедей блаженства; обозначает состояние под Божьим благоволением, а не просто чувство счастья.
- source_word: οἱ πτωχοὶ
  choice: нищие
  rationale: Передаёт сильное значение нужды и бедности у πτωχός, сохраняя субстантивированную форму греческого выражения.
- source_word: τῷ πνεύματι
  choice: духом
  rationale: Творительный отношения естественно передаёт дательный сферы или отношения и сохраняет краткость и смысловую открытость греческого выражения, не отождествляя πνεῦμα со Святым Духом.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно выражает основание провозглашённого блаженства в современном русском языке.
- source_word: αὐτῶν ἐστιν
  choice: им принадлежит
  rationale: Естественно передаёт именную конструкцию с родительным αὐτῶν и сохраняет настоящее время ἐστιν.
- source_word: ἡ βασιλεία
  choice: Царство
  rationale: Устоявшееся и широкое по смыслу соответствие, способное обозначать как царское владычество, так и царство как область правления.
- source_word: τῶν οὐρανῶν
  choice: Небесное
  rationale: Устоявшаяся русская передача характерного для Матфея выражения «царство небес»; она естественна и не требует буквального воспроизведения греческого множественного числа.
theological_decisions:
- issue: Значение выражения «нищие духом»
  choice: Сохранить выражение «нищие духом» без истолковывающего расширения.
  alternative: «духовно нищие»; «осознающие свою духовную нужду»; «смиренные»
  rationale: Греческое выражение допускает смысловую глубину и некоторую неоднозначность. Развёрнутый перевод преждевременно закрепил бы одно толкование.
- issue: Настоящее время обладания Царством
  choice: «им принадлежит»
  alternative: «им будет принадлежать»
  rationale: ἐστιν стоит в настоящем времени; перевод не должен превращать нынешнюю принадлежность исключительно в будущее обещание.
translation_notes:
  register: Современный литературный русский язык с сохранением укоренившейся библейской формулы «Блаженны нищие духом» и традиционного наименования «Царство Небесное». Синтаксис сделан ясным и естественным; богословская неоднозначность исходного текста не устранена.
