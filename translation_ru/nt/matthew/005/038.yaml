- source_word: Ἠκούσατε
  choice: Вы слышали
  rationale: Аорист в устойчивой вводной формуле естественно передаётся по-русски прошедшим временем и указывает на известное слушателям учение.
- source_word: ἐρρέθη
  choice: было сказано
  rationale: Безличная пассивная конструкция точно сохраняет форму греческого текста и не уточняет говорящего.
- source_word: Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ
  choice: глаз за глаз
  rationale: Устойчивое русское соответствие юридической формуле; предлог «за» здесь передаёт обменное и заместительное значение ἀντί.
- source_word: ὀδόντα ἀντὶ ὀδόντος
  choice: зуб за зуб
  rationale: Сохраняет параллелизм, краткость и узнаваемую форму правового изречения.
theological_decisions:
- issue: Передача цитируемого Иисусом принципа воздаяния
  choice: «Глаз за глаз и зуб за зуб»
  alternative: «Глаз вместо глаза и зуб вместо зуба»
  rationale: Традиционная русская формула точно и естественно передаёт греческий текст, не решая за читателя, идёт ли речь о буквальном воздаянии или о принципе соразмерности.
translation_notes:
