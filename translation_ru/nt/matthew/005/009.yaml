id: MAT.5.9
reference: Matthew 5:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μακάριοι οἱ εἰρηνοποιοί, ὅτι αὐτοὶ υἱοὶ θεοῦ κληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/009.yaml
  text: Blessed are the peacemakers[a], because they will be called sons of God.
translation:
  language: ru
  text: Блаженны миротворцы, потому что именно они будут названы сынами Божьими[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «детьми Божьими». В греческом тексте буквально: «сынами Бога»; мужская форма множественного числа здесь имеет представительный смысл.'
    reason: Лексическая альтернатива и пояснение включающего смысла мужского образа.
lexical_decisions:
- source_word: μακάριοι
  choice: Блаженны
  rationale: Устоявшаяся формула заповедей блаженства; передаёт не просто субъективное счастье, а состояние людей, удостоенных Божьего благоволения.
- source_word: εἰρηνοποιοί
  choice: миротворцы
  rationale: Естественное русское обозначение тех, кто деятельно созидает мир; сохраняет агентивный смысл греческого сложного существительного.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно передаёт причинное значение союза в современном русском языке.
- source_word: αὐτοὶ
  choice: именно они
  rationale: Передаёт выраженное в греческом тексте эмфатическое местоимение, не делая фразу неестественной.
- source_word: υἱοὶ θεοῦ
  choice: сынами Божьими
  rationale: Сохраняет мужской образ сыновства в исходном тексте и его возможные богословские оттенки статуса и принадлежности; представительный, включающий смысл пояснён в сноске.
- source_word: κληθήσονται
  choice: будут названы
  rationale: Прямо передаёт будущее время и страдательный залог καλέω, не сводя смысл лишь к человеческому признанию.
theological_decisions:
- issue: Мужской образ сыновства в выражении υἱοὶ θεοῦ
  choice: сынами Божьими
  alternative: детьми Божьими
  rationale: Основной текст сохраняет конкретный образ греческого оригинала и возможные ассоциации с сыновним статусом, тогда как сноска указывает на представительный смысл множественного числа, охватывающий мужчин и женщин.
translation_notes:
  register: Современный литературный и достоинственный русский язык. Сохранена узнаваемая формула «Блаженны…», но архаичное «ибо… нарекутся» заменено ясной современной конструкцией.
