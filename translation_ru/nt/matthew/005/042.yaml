  text: τῷ αἰτοῦντί σε ⸀δός, καὶ τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι μὴ ἀποστραφῇς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/042.yaml
  text: Give to the one who asks you[a], and do not turn away from the one who wants to borrow from you.
translation:
  language: ru
  text: Дай тому, кто просит у тебя, и от того, кто хочет занять у тебя, не отворачивайся.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не отказывай тому, кто хочет занять у тебя».'
    reason: 'Лексическая альтернатива: μὴ ἀποστραφῇς сохраняет образ отворачивания, но в данном контексте может означать отказ.'
lexical_decisions:
- source_word: αἰτοῦντί
  choice: просящему у тебя
  rationale: Субстантивированное причастие настоящего времени обозначает всякого, кто обращается с просьбой; дательный падеж передаёт адресата повеления δός.
- source_word: δός
  choice: дай
  rationale: Аористный императив δίδωμι передан прямым повелением без добавочного модального оттенка.
- source_word: θέλοντα
  choice: желающего
  rationale: Субстантивированное причастие настоящего времени передаёт человека, который хочет совершить названное действие.
- source_word: ἀπὸ σοῦ
  choice: у тебя
  rationale: При русском глаголе «занять» источник естественно выражается конструкцией «занять у кого-либо».
- source_word: δανίσασθαι
  choice: занять
  rationale: Средний инфинитив в данном контексте означает взять взаймы; объект не указан, поэтому перевод не ограничен деньгами.
- source_word: μὴ ἀποστραφῇς
  choice: не отворачивайся
  rationale: Запрет передан естественной русской формой и сохраняет образ отворачивания, не сводя выражение только к прямому отказу.
theological_decisions:
- issue: Объём и сила нравственного повеления Иисуса
  choice: Сохранены прямые, обобщённо сформулированные повеления без смягчения и дополнительных ограничений.
  alternative: Уточнить, что помощь полагается лишь достойным просителям, или заменить образное выражение однозначным «не отказывай».
  rationale: Греческий текст не оговаривает достоинство просителя и формулирует оба требования прямо; перевод не должен вносить отсутствующие квалификации.
translation_notes:
  register: Современный литературный русский язык; синтаксический параллелизм и прямота повелений сохранены. «Занять у тебя» употреблено в нормативном значении «взять взаймы».
