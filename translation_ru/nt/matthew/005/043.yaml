  text: Ἠκούσατε ὅτι ἐρρέθη· Ἀγαπήσεις τὸν πλησίον σου καὶ μισήσεις τὸν ἐχθρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/043.yaml
  text: You have heard that it was said[a], ‘You shall love your neighbor and hate your enemy.’
translation:
  language: ru
  text: 'Вы слышали, что было сказано[a]: «Люби ближнего твоего и ненавидь врага твоего».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Первая часть перекликается с Левитом 19:18; вторая — «и ненавидь врага твоего» — не является прямой цитатой из Ветхого Завета, а отражает принятое учение, которое Иисус исправляет.
    reason: cross_reference
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Вы слышали
  rationale: Аорист в повторяющейся формуле введения передаёт ранее воспринятое учение; по-русски естественно звучит «Вы слышали».
- source_word: ἐρρέθη
  choice: было сказано
  rationale: Безличная пассивная конструкция сохраняет неопределённость относительно говорящего и точно передаёт форму греческого текста.
- source_word: Ἀγαπήσεις
  choice: Люби
  rationale: Будущее изъявительного наклонения употреблено в значении предписания; русский повелительный эквивалент ясно и естественно передаёт силу заповеди.
- source_word: τὸν πλησίον σου
  choice: ближнего твоего
  rationale: «Ближний» — точный и укоренившийся эквивалент πλησίον в этическом контексте и в отсылке к Левиту 19:18.
- source_word: μισήσεις
  choice: ненавидь
  rationale: Как и Ἀγαπήσεις, форма будущего имеет предписывающую силу; параллельное повелительное наклонение сохраняет структуру приписываемого изречения.
- source_word: τὸν ἐχθρόν σου
  choice: врага твоего
  rationale: «Враг» прямо передаёт ἐχθρός и сохраняет противопоставление ближнему.
theological_decisions:
- issue: Статус слов «и ненавидь врага твоего»
  choice: Передать их как часть единого изречения, которое, по словам Иисуса, слышали Его слушатели, но в примечании пояснить, что это не прямая ветхозаветная цитата.
  alternative: Представить всё изречение как однородную прямую цитату из Писания либо уже в основном тексте обозначить вторую часть как позднейшее толкование.
  rationale: Греческий текст грамматически представляет обе части как одно услышанное изречение. При этом первая часть перекликается с Левитом 19:18, тогда как второй заповеди в такой форме в Ветхом Завете нет; примечание сохраняет эту существенную напряжённость, не перегружая основной текст толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формы «ближнего твоего» и «врага твоего» слегка возвышенны, но понятны и сохраняют ритмический параллелизм цитируемого изречения.
