  text: Μὴ νομίσητε ὅτι ἦλθον καταλῦσαι τὸν νόμον ἢ τοὺς προφήτας· οὐκ ἦλθον καταλῦσαι ἀλλὰ πληρῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/017.yaml
  text: Do not think that I came to abolish the Law or the Prophets[b][a]; I did not come to abolish them but to fulfill them.
translation:
  language: ru
  text: Не думайте, что я пришёл отменить Закон или Пророков. Я пришёл не отменить, а исполнить[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «довести до полноты», «привести к исполнению».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Не думайте
  rationale: Аористный сослагательный с μή выражает запрещение; эта формулировка прямо и естественно передаёт его силу.
- source_word: ἦλθον
  choice: я пришёл / Я пришёл
  rationale: Простое прошедшее время естественно передаёт греческий аорист и сохраняет параллель между двумя употреблениями глагола.
- source_word: καταλῦσαι
  choice: отменить
  rationale: В сочетании с Законом и Пророками речь идёт не о физическом разрушении, а об упразднении или лишении силы; «отменить» ясно выражает этот смысл на современном русском языке.
- source_word: τὸν νόμον ἢ τοὺς προφήτας
  choice: Закон или Пророков
  rationale: Заглавные буквы указывают на известные части Писания Израиля, а союз «или» сохраняет греческое ἢ.
- source_word: πληρῶσαι
  choice: исполнить
  rationale: 'Традиционный и ёмкий русский эквивалент сохраняет многозначность: осуществить сказанное, привести к полноте или дать полное выражение, не закрепляя одно богословское толкование.'
theological_decisions:
- issue: Смысл πληρῶσαι применительно к Закону и Пророкам
  choice: исполнить
  alternative: довести до полноты; привести к исполнению; раскрыть во всей полноте
  rationale: Основной текст сохраняет широкое значение греческого глагола и не сводит слова Иисуса исключительно к соблюдению предписаний, завершению прежнего порядка или подтверждению Писания.
translation_notes:
  register: Современный литературный русский язык с ясной, торжественной, но не архаичной формулировкой. Местоимение первого лица внутри предложения написано со строчной буквы по общим правилам современной русской орфографии; канонические названия «Закон» и «Пророки» — с заглавной.
