  text: ἀμὴν λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ἂν ἀποδῷς τὸν ἔσχατον κοδράντην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/026.yaml
  text: Truly I tell you[b][a], you will certainly not get out of there until you have paid the last quadrans.
translation:
  language: ru
  text: 'Истинно говорю тебе: ты ни в коем случае не выйдешь оттуда, пока не отдашь последний кодрант.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Кодрант — мелкая римская монета.
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν
  choice: Истинно
  rationale: В синоптической формуле это слово служит торжественным подтверждением истинности и авторитетности последующего высказывания; «истинно» естественно передаёт его функцию по-русски.
- source_word: λέγω σοι
  choice: говорю тебе
  rationale: Прямо и естественно передаёт формулу личного обращения, сохраняя её вес и лаконичность.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: ты ни в коем случае не выйдешь
  rationale: Сочетание οὐ μή с аористом сослагательного наклонения выражает усиленное отрицание; «ни в коем случае» сохраняет эту силу без архаизации.
- source_word: ἐκεῖθεν
  choice: оттуда
  rationale: Точно передаёт движение прочь из указанного места и естественно сочетается с глаголом «выйдешь».
- source_word: ἕως ἂν ἀποδῷς
  choice: пока не отдашь
  rationale: Передаёт будущую границу пребывания в заключении и завершённую выплату долга; «отдать» уместно в контексте денежной задолженности.
- source_word: τὸν ἔσχατον κοδράντην
  choice: последний кодрант
  rationale: Сохраняет конкретное название мелкой римской монеты и образ полной выплаты вплоть до последней монеты.
theological_decisions:
- issue: Следует ли истолковать заключение и выплату как указание на окончательный суд, посмертное очищение или только на земное долговое заключение
  choice: Сохранён конкретный образ заключения до полной выплаты долга без уточнения его богословского смысла.
  alternative: Явно представить слова как описание Божьего суда либо посмертного очищения.
  rationale: Греческий текст сам по себе не разрешает метафору в пользу конкретной доктрины; перевод сохраняет её напряжение и непосредственный контекст предупреждения и примирения.
translation_notes:
  register: Современный литературный русский язык; формулировка торжественная, но понятная. Усиленное греческое отрицание передано выражением «ни в коем случае», а конкретное название монеты сохранено с кратким культурным пояснением.
