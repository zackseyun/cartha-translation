  text: ἐγὼ δὲ λέγω ὑμῖν, ἀγαπᾶτε τοὺς ἐχθροὺς ⸀ὑμῶν καὶ προσεύχεσθε ὑπὲρ ⸀τῶν διωκόντων ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/044.yaml
  text: But I say to you[a], love your enemies and pray for those who persecute you.
translation:
  language: ru
  text: 'А Я говорю вам: любите ваших врагов и молитесь за тех, кто преследует вас.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: А Я говорю вам
  rationale: Передаёт подчёркнутое ἐγώ и противопоставление, вводимое δέ, сохраняя естественную и торжественную русскую формулу.
- source_word: ἀγαπᾶτε
  choice: любите
  rationale: Прямо передаёт повелительное наклонение настоящего времени, не перегружая перевод явным указанием на длительность действия.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: ваших врагов
  rationale: Естественная русская передача, сохраняющая личный и реляционный характер вражды.
- source_word: προσεύχεσθε
  choice: молитесь
  rationale: Обычная и точная передача повелительной формы προσεύχομαι.
- source_word: ὑπὲρ
  choice: за
  rationale: В сочетании с глаголом «молиться» русский предлог «за» естественно выражает молитву о ком-либо и ради его блага.
- source_word: τῶν διωκόντων ὑμᾶς
  choice: тех, кто преследует вас
  rationale: Сохраняет глагольный характер субстантивированного причастия и допускаемый настоящим временем смысл продолжающегося преследования.
theological_decisions:
- issue: Содержание любви к врагам и молитвы за преследователей
  choice: Оба повеления переданы прямо, без поясняющих добавлений.
  alternative: Уточнить любовь как благожелательные поступки либо указать, о чём именно следует молиться.
  rationale: Греческий текст не определяет здесь ни полный практический объём любви, ни конкретное содержание молитвы; перевод сохраняет эту открытость и этическое напряжение.
translation_notes:
  register: Современный литературный русский язык с dignified библейской интонацией. Заглавное «Я» подчёркивает выраженное в греческом ἐγώ и соответствует русской традиции передачи речи Христа; синтаксис остаётся простым и понятным.
