  text: ἄφες ἐκεῖ τὸ δῶρόν σου ἔμπροσθεν τοῦ θυσιαστηρίου καὶ ὕπαγε πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου, καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/024.yaml
  text: leave your gift there before the altar[a], and go; first be reconciled to your brother[b], and then come and offer your gift.
translation:
  language: ru
  text: 'оставь свой дар там перед жертвенником и пойди: сначала примирись со своим братом[a], а потом приди и принеси свой дар.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово буквально означает «брат» и стоит в мужском роде и единственном числе; в данном наставлении принцип примирения может относиться и к другим людям.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες ἐκεῖ
  choice: оставь … там
  rationale: Повелительная форма означает оставить дар на месте; наречие сохраняет пространственный акцент оригинала.
- source_word: τὸ δῶρόν σου
  choice: свой дар
  rationale: «Дар» передаёт δῶρον и в сочетании с жертвенником ясно обозначает приношение Богу.
- source_word: ἔμπροσθεν τοῦ θυσιαστηρίου
  choice: перед жертвенником
  rationale: Сохраняется конкретное пространственное отношение и храмовый контекст; «жертвенник» точнее обозначает место жертвоприношения.
- source_word: ὕπαγε πρῶτον
  choice: 'пойди: сначала'
  rationale: 'Передаёт повеление идти и подчёркнутую последовательность: примирение должно предшествовать принесению дара.'
- source_word: διαλλάγηθι τῷ ἀδελφῷ σου
  choice: примирись со своим братом
  rationale: Русское «примириться с кем-либо» естественно передаёт пассивную повелительную форму и дательный падеж участника отношения, не уточняя сверх текста, кто должен сделать первый шаг.
- source_word: καὶ τότε ἐλθὼν
  choice: а потом вернись
  rationale: Причастная конструкция подчинена следующему повелению. «Вернись» естественно выражает подразумеваемое возвращение к оставленному у жертвенника дару.
- source_word: πρόσφερε τὸ δῶρόν σου
  choice: принеси свой дар
  rationale: «Принести дар» — естественное русское выражение для культового представления приношения и сохраняет повтор слова δῶρον.
theological_decisions:
- issue: Значение ἀδελφός в наставлении о примирении
  choice: брат
  alternative: ближний; брат или сестра
  rationale: Греческое слово стоит в мужском роде и единственном числе, поэтому основной текст сохраняет «брат». Примечание указывает, что нравственный принцип не обязательно ограничен родным братом или мужчиной.
- issue: Характер примирения в διαλλάγηθι
  choice: примирись
  alternative: восстанови мир
  rationale: Форма глагола сосредоточена на достижении состояния примирения и не распределяет подробно ответственность между сторонами; перевод сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской лексикой. «Жертвенник» сохраняет точность храмового контекста, а синтаксис с двоеточием ясно передаёт порядок двух повелений.
