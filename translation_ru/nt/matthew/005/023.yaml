  text: ἐὰν οὖν προσφέρῃς τὸ δῶρόν σου ἐπὶ τὸ θυσιαστήριον κἀκεῖ μνησθῇς ὅτι ὁ ἀδελφός σου ἔχει τι κατὰ σοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/023.yaml
  text: Therefore, if you are offering your gift on the altar, and there remember that your brother has something against you,
translation:
  language: ru
  text: Итак, если ты приносишь свой дар на жертвенник и там вспоминаешь, что твой брат[a] имеет что-то против тебя,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по смыслу в более широком применении: «твой брат или сестра». В греческом тексте стоит существительное мужского рода в единственном числе — «брат», которое в данном контексте может употребляться как представительное обозначение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Итак, если
  rationale: «Итак» передаёт выводное значение οὖν и связь с предшествующим наставлением, а «если» — условную силу ἐάν.
- source_word: προσφέρῃς τὸ δῶρόν σου
  choice: ты приносишь свой дар
  rationale: Глагол προσφέρω в культовом контексте означает принесение или представление дара; настоящее время создаёт живую условную ситуацию. «Дар» прямо соответствует δῶρον и остаётся понятным рядом со словом «жертвенник».
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: к жертвеннику
  rationale: ἐπί с винительным может обозначать направленность к месту; выражение естественно описывает принесение дара к жертвеннику, не добавляя предположения, что дар уже положен на него.
- source_word: κἀκεῖ μνησθῇς
  choice: и там вспоминаешь
  rationale: Сохраняются соединительное и пространственное значения κἀκεῖ и нейтральный смысл μνησθῇς без уточнения, чем вызвано воспоминание.
- source_word: ὁ ἀδελφός σου
  choice: твой брат
  rationale: Передаётся мужской род и единственное число греческого выражения; возможная представительная широта отмечена в сноске.
- source_word: ἔχει τι κατὰ σοῦ
  choice: имеет что-то против тебя
  rationale: Естественный русский эквивалент идиомы, сохраняющий намеренную неопределённость τι — «что-то».
theological_decisions:
- issue: Родовое и возможное представительное значение ἀδελφός
  choice: твой брат
  alternative: твой брат или сестра; другой верующий
  rationale: Основной текст сохраняет явно мужскую форму единственного числа. Возможное более широкое применение не вносится в перевод, а поясняется сноской.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской лексикой. «Жертвенник» сохраняет культовую точность и традиционную узнаваемость; синтаксис оставлен незавершённым, поскольку условное предложение продолжается в следующем стихе.
