  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος· καὶ καθίσαντος αὐτοῦ προσῆλθαν αὐτῷ οἱ μαθηταὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/001.yaml
  text: Seeing the crowds[a], he went up the mountain; and when he sat down[c][b], his disciples came to him.
translation:
  language: ru
  text: Увидев толпы народа, Он поднялся на гору[a]. Когда Он сел[b], к Нему подошли Его ученики.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «взошёл на гору».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «после того как Он сел». В греческом здесь употреблён родительный самостоятельный оборот.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν
  choice: Увидев
  rationale: Аористное причастие задаёт обстоятельство основного действия; деепричастие естественно передаёт эту связь, не уточняя её как строго временную.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Здесь это слабая переходная частица; отдельное «же», «но» или «тогда» придало бы связи лишний смысловой вес.
- source_word: τοὺς ὄχλους
  choice: толпы народа
  rationale: Сохраняет множественное число ὄχλους и естественно обозначает большие скопления людей в современном русском языке.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: поднялся на гору
  rationale: Передаёт направленное вверх движение к горе или на неё без неуместно торжественного «взошёл».
- source_word: τὸ ὄρος
  choice: гору
  rationale: Обычное значение ὄρος — «гора»; контекст не требует более конкретного «склон».
- source_word: καὶ καθίσαντος αὐτοῦ
  choice: Когда Он сел
  rationale: Родительный самостоятельный оборот передан естественным временным придаточным, без чрезмерно строгого указания на последовательность.
- source_word: προσῆλθαν αὐτῷ
  choice: к Нему подошли
  rationale: Точно и естественно передаёт приближение учеников; в данном контексте несколько конкретнее русского «пришли к Нему».
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Его ученики
  rationale: Стандартная и точная передача обозначения последователей в отношениях ученика и учителя.
theological_decisions:
- issue: Определённость τὸ ὄρος
  choice: на гору
  alternative: на одну гору; на склон
  rationale: В русском языке артикль не выражается, а «на эту гору» добавило бы указательность, которой в греческом нет. Существительное «гора» сохраняет образ исходного текста, не отождествляя место с конкретной названной горой.
- issue: Временной оттенок καθίσαντος αὐτοῦ
  choice: Когда Он сел
  alternative: После того как Он сел
  rationale: Оборот указывает на временное обстоятельство, но не требует подчёркивать строгую последовательность или придавать сидячей позе особый церемониальный смысл.
- issue: Заглавные местоимения при упоминании Иисуса
  choice: Он, Нему, Его
  alternative: он, нему, его
  rationale: Заглавное написание следует принятому достоинственному русскому библейскому регистру, не добавляя к смыслу греческого текста отдельного доктринального утверждения.
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным библейским звучанием. Синтаксис остаётся близким к греческому, но избегает тяжеловесности; причастная связь передана деепричастием, а родительный самостоятельный оборот — временным придаточным.
