id: MAT.5.16
reference: Matthew 5:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὕτως λαμψάτω τὸ φῶς ὑμῶν ἔμπροσθεν τῶν ἀνθρώπων, ὅπως ἴδωσιν ὑμῶν τὰ καλὰ ἔργα καὶ δοξάσωσιν τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/016.yaml
  text: In the same way[a], let your light shine before men[b], so that they may see your good works and glorify your Father who is in the heavens.
translation:
  language: ru
  text: Так пусть ваш свет сияет перед людьми, чтобы они видели ваши добрые дела и прославляли вашего Отца, Который на небесах.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Так
  rationale: Передаёт связь с предшествующим образом светильника и указывает, каким образом ученики должны являть свет.
- source_word: λαμψάτω τὸ φῶς ὑμῶν
  choice: пусть и ваш свет сияет
  rationale: Конструкция с «пусть» естественно передаёт повелительное наклонение третьего лица; «и» подчёркивает сопоставление с только что упомянутым светильником.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: перед людьми
  rationale: ἄνθρωποι здесь обозначает людей вообще; русское «людьми» точно и естественно передаёт общий смысл без ненужного ограничения по полу.
- source_word: ὅπως ἴδωσιν
  choice: чтобы они видели
  rationale: «Чтобы» естественно передаёт целевое значение ὅπως с сослагательным наклонением.
- source_word: τὰ καλὰ ἔργα
  choice: ваши добрые дела
  rationale: Устойчивое и понятное соответствие, сохраняющее нравственный смысл καλός и традиционную библейскую формулировку.
- source_word: δοξάσωσιν
  choice: прославляли
  rationale: Точно передаёт δοξάζω применительно к Богу и согласуется по виду с «видели» в целевой конструкции.
- source_word: τὸν πατέρα ὑμῶν
  choice: вашего Отца
  rationale: Сохраняет обращённое к ученикам родственное обозначение Бога; прописная буква соответствует норме русского религиозного текста.
- source_word: τὸν ἐν τοῖς οὐρανοῖς
  choice: Который на небесах
  rationale: Русское «на небесах» естественно сохраняет множественное число греческого οὐρανοῖς.
theological_decisions:
- issue: Видимость добрых дел и прославление Бога
  choice: «чтобы они видели ваши добрые дела и прославляли вашего Отца»
  alternative: Формулировка, в которой ученики сами получают славу за свои дела
  rationale: Греческий текст прямо направляет итог видимых добрых дел к прославлению Отца, не устраняя при этом повеления делать эти дела заметными людям.
- issue: Множественное число οὐρανοῖς
  choice: «на небесах»
  alternative: «на небе»
  rationale: Выбор сохраняет форму исходного текста и при этом звучит естественно по-русски, не добавляя особой космологической трактовки.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified библейским звучанием. Синтаксис близок к греческому, но не буквалистичен; гендерно общий смысл ἀνθρώπων передан обычным словом «люди».
