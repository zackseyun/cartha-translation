  text: Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐ φονεύσεις· ὃς δ’ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/021.yaml
  text: You have heard that it was said to the ancients[a], ‘You shall not murder[c][b]; and whoever murders will be liable to judgment.’
translation:
  language: ru
  text: 'Вы слышали, что тем, кто жил в древности[a], было сказано: «Не совершай убийств[b]; а кто совершит убийство, тот подлежит суду».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «людям прежних времён».'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «Не убивай»; однако греческий глагол здесь означает именно совершение убийства, а не лишение жизни вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Вы слышали
  rationale: Русское прошедшее время естественно передаёт аорист в формуле обращения к слушателям и указывает на уже воспринятое ими учение.
- source_word: ἐρρέθη
  choice: было сказано
  rationale: Безличная пассивная конструкция сохраняет неопределённость относительно говорящего и не добавляет в текст прямого указания на Бога.
- source_word: τοῖς ἀρχαίοις
  choice: людям древности
  rationale: Передаёт дательный падеж как адресата сказанного и ясно обозначает людей прежних времён; более краткое «древним» возможно, но в современном русском менее прозрачно.
- source_word: Οὐ φονεύσεις
  choice: Не совершай убийства
  rationale: φονεύω означает именно совершение убийства, а не всякое лишение жизни. Такая формулировка точнее традиционного, но семантически более широкого «не убивай».
- source_word: ὃς δ’ ἂν φονεύσῃ
  choice: а кто совершит убийство
  rationale: Относительное придаточное с ἄν и аористом сослагательного наклонения выражает общее неопределённое условие; русский оборот с «кто» передаёт его естественно.
- source_word: ἔνοχος ἔσται
  choice: тот подлежит
  rationale: Юридический оборот передаёт ответственность лица перед названной судебной инстанцией или процедурой, не сводя смысл к отвлечённой виновности.
- source_word: τῇ κρίσει
  choice: суду
  rationale: Сохраняет судебно-правовой смысл κρίσις, не уточняя сверх текста, имеется ли в виду судебное разбирательство, решение или конкретный суд.
theological_decisions:
- issue: Смысл шестой заповеди в цитате
  choice: Не совершай убийства
  alternative: Не убивай
  rationale: Греческое φονεύω обозначает убийство человека и уже по значению, чем общее «убивать». Выбранный вариант не вводит в заповедь запрет на любое лишение жизни.
- issue: Кому было сказано
  choice: людям древности
  alternative: предками / у древних
  rationale: Дательный τοῖς ἀρχαίοις естественнее всего понимать как указание на получателей сказанного. Перевод не превращает их в говорящих и не уточняет, что речь обязательно идёт о прямых предках слушателей.
- issue: Значение κρίσις
  choice: суд
  alternative: осуждение
  rationale: «Суд» сохраняет юридическую широту слова и не предрешает исход разбирательства словом «осуждение».
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи Иисуса. Синтаксис прост и доступен; единая цитата объединяет заповедь и указание на судебную ответственность. Точка с запятой отражает тесную связь двух частей и греческий знак разделения.
