- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз сохранён без добавления более выраженного временного оттенка («тогда»).
- source_word: ἀνοίξας τὸ στόμα αὐτοῦ
  choice: он открыл уста
  rationale: Сохранён торжественный библейский оборот, вводящий значимую речь; личная конструкция звучит по-русски естественнее буквального деепричастного построения.
- source_word: ἐδίδασκεν
  choice: стал учить
  rationale: Имперфект передаёт разворачивающееся действие; «стал учить» уместно вводит последующее продолжительное наставление, не сводя глагол к однократному действию.
- source_word: αὐτοὺς
  choice: их
  rationale: Местоимение сохранено без уточнения его референта как «учеников» или «народа», поскольку сам стих такого уточнения не даёт.
- source_word: λέγων
  choice: такими словами
  rationale: Естественный русский способ ввести содержание последующей речи; двоеточие сохраняет её непосредственную связь с глаголом учения.
