source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ ἅλας τῆς γῆς· ἐὰν δὲ τὸ ἅλας μωρανθῇ, ἐν τίνι ἁλισθήσεται; εἰς οὐδὲν ἰσχύει ἔτι εἰ μὴ ⸂βληθὲν ἔξω⸃ καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/013.yaml
  text: You are the salt of the earth. But if the salt becomes tasteless[a], with what will it be made salty? It is no longer good for anything except to be thrown out and trampled underfoot by men.
translation:
  language: ru
  text: 'Вы — соль земли. Но если соль утратит солёность[a], чем сделать её солёной? Она уже ни на что не годна: разве что выбросить её вон и растоптать ногами.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот греческий глагол в других контекстах означает «стать глупым»; применительно к соли — «стать безвкусной», «утратить солёность».
    reason: Сноска сохраняет необычную словесную связь исходного текста, которую невозможно естественно воспроизвести в основном русском переводе.
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Вы
  rationale: Явное местоимение в греческом тексте несёт смысловое ударение; в русском оно естественно передаётся местоимением «вы» и именным сказуемым с тире.
- source_word: τὸ ἅλας τῆς γῆς
  choice: соль земли
  rationale: γῆ допускает значения «земля», «суша», «страна», но в этой широкой метафоре естественно и традиционно понятное «земля».
- source_word: μωρανθῇ
  choice: потеряет вкус
  rationale: Применительно к соли глагол означает, что она становится безвкусной или утрачивает свои свойства. Выражение «потеряет вкус» естественно по-русски; необычная связь глагола со значением «стать глупым» отмечена в сноске.
- source_word: ἐν τίνι ἁλισθήσεται;
  choice: чем сделать её солёной?
  rationale: Сохранены вопрос о средстве и страдательное значение греческой формы без поясняющего добавления о «восстановлении» солёности.
- source_word: εἰς οὐδὲν ἰσχύει ἔτι
  choice: Она уже ни на что не годна
  rationale: В контексте ἰσχύει выражает практическую пригодность или действенность; русский оборот точно и естественно передаёт этот смысл.
- source_word: εἰ μὴ βληθὲν ἔξω
  choice: разве только выбросить её вон
  rationale: «Выбросить вон» сохраняет пространственную силу ἔξω и при этом звучит естественно в современном русском.
- source_word: καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων
  choice: чтобы люди топтали её ногами
  rationale: Придаточная конструкция естественно передаёт результат выбрасывания; «топтали ногами» сохраняет наглядность καταπατεῖσθαι, а «люди» точно выражает общее значение ἄνθρωποι.
theological_decisions:
- issue: Образ соли, утратившей свои свойства
  choice: потеряет вкус
  alternative: станет пресной; утратит солёность
  rationale: Перевод не объясняет метафору и не определяет заранее, какое именно духовное состояние она обозначает, сохраняя её открытость и предостерегающую силу.
- issue: Общее значение ὑπὸ τῶν ἀνθρώπων
  choice: люди
  alternative: человеческие ноги; мужчины
  rationale: Греческое существительное обозначает здесь людей вообще, а не лиц мужского пола; русское «люди» передаёт это значение без конфессионального или доктринального уточнения.
translation_notes:
  register: Современный литературный русский язык с краткой, выразительной синтаксической структурой. Тире подчёркивает обращённое к ученикам «вы». Избегаются как церковнославянизмы («попираема»), так и чрезмерно разговорные формулировки.
