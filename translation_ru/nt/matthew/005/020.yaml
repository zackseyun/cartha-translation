  terminology: «Праведность», «книжники», «фарисеи» и «Царство Небесное» употреблены последовательно с русской библейской традицией и без конфессионально обусловленных добавлений. Сноска об альтернативе «справедливость» корректно отмечает лексическую возможность, не навязывая её как предпочтительное значение.
