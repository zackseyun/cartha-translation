id: MAT.5.20
reference: Matthew 5:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι ἐὰν μὴ περισσεύσῃ ⸂ὑμῶν ἡ δικαιοσύνη⸃ πλεῖον τῶν γραμματέων καὶ Φαρισαίων, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/020.yaml
  text: For I tell you that unless your righteousness exceeds that of the scribes and Pharisees[a], you will certainly not enter the kingdom of heaven.
translation:
  language: ru
  text: 'Ибо говорю вам: если ваша праведность не превзойдёт праведности книжников и фарисеев[a], вы ни в коем случае не войдёте в Царство Небесное.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливость». Греческое слово может означать как праведность в широком смысле, так и справедливость; в данном контексте лучше подходит «праведность».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Ибо говорю вам
  rationale: γάρ связывает высказывание с предшествующим объяснительной связью, а λέγω ὑμῖν сохраняет прямое и торжественное обращение без архаизации.
- source_word: ἐὰν μὴ
  choice: если ... не
  rationale: В русском условная конструкция «если ... не» естественно передаёт необходимое отрицательное условие; «если только не» здесь могло бы звучать двусмысленно.
- source_word: περισσεύσῃ ... πλεῖον
  choice: не превзойдёт
  rationale: Сочетание глагола περισσεύω со сравнительным πλεῖον указывает на превосходство по мере или качеству. «Превзойдёт» ясно и естественно выражает сравнение.
- source_word: ὑμῶν ἡ δικαιοσύνη
  choice: ваша праведность
  rationale: δικαιοσύνη здесь обозначает жизнь и поведение, соответствующие Божьей воле. «Праведность» сохраняет широкий нравственно-богословский смысл лучше, чем более узкое «справедливость».
- source_word: τῶν γραμματέων καὶ Φαρισαίων
  choice: праведности книжников и фарисеев
  rationale: 'Повтор слова «праведность» устраняет возможную двусмысленность: сравниваются не ученики с людьми, а их праведность. γραμματεῖς передано традиционным и точным словом «книжники».'
- source_word: οὐ μὴ εἰσέλθητε
  choice: вы ни в коем случае не войдёте
  rationale: Двойное отрицание οὐ μή с аористом сослагательного наклонения выражает усиленное отрицание. Оборот «ни в коем случае» передаёт эту категоричность современным русским языком.
- source_word: τὴν βασιλείαν τῶν οὐρανῶν
  choice: Царство Небесное
  rationale: Это естественное и укоренившееся русское соответствие характерному для Матфея выражению; оно не превращает множественное число οὐρανῶν в отдельное богословское утверждение.
theological_decisions:
- issue: Значение δικαιοσύνη в контексте Матфея 5
  choice: праведность
  alternative: справедливость
  rationale: Контекст Нагорной проповеди охватывает верность Божьей воле и правильную жизнь в широком смысле, а не только справедливое отношение к другим. При этом лексическая возможность значения «справедливость» отмечена в сноске.
- issue: Характер превосходства над книжниками и фарисеями
  choice: Сохранено общее утверждение «праведность ... превзойдёт» без уточнения, идёт ли речь о количестве, качестве, внутреннем характере или ином отношении к Закону
  alternative: Уточнить как «будет более искренней», «будет совершеннее» или «будет больше»
  rationale: Греческая сравнительная конструкция утверждает превосходство, но сама по себе не определяет его точную природу. Интерпретирующее уточнение преждевременно сняло бы значимую богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис сохраняет объяснительное «ибо» и категоричность заключения; повтор «праведности» выбран ради недвусмысленного сравнения. Названия «Царство Небесное» и «фарисеи» оформлены по устойчивой русской библейской традиции.
