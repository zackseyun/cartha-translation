  source_fidelity: 'Текст точно передаёт все основные элементы греческого оригинала: объяснительное γάρ («Ибо»), необходимое отрицательное условие ἐὰν μή, сравнение праведности с праведностью книжников и фарисеев и усиленное отрицание οὐ μή. Повтор слова «праведность» правомерно проясняет эллиптическое сравнение, не добавляя толкования. «Царство Небесное» — устойчивое и точное соответствие βασιλεία τῶν οὐρανῶν.'
