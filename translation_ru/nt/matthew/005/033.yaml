  text: Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐκ ἐπιορκήσεις, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/033.yaml
  text: Again[a], you have heard that it was said to those of old, ‘You shall not swear falsely[b], but you shall fulfill your oaths to the Lord.’
translation:
  language: ru
  text: 'И ещё вы слышали, что древним было сказано: «Не клянись ложно[a], но исполняй свои клятвы, данные Господу[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не нарушай клятвы»; глагол может означать как ложную клятву, так и нарушение данной клятвы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «данные ГОСПОДУ» — в соответствии с заветным именем Бога в ветхозаветном контексте.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν
  choice: И ещё
  rationale: Передаёт переход к следующему примеру в ряду и естественно связывает его с предшествующим рассуждением.
- source_word: ἠκούσατε
  choice: вы слышали
  rationale: Русское прошедшее время естественно передаёт аорист в повторяющейся формуле и сохраняет прямое обращение во множественном числе.
- source_word: ἐρρέθη
  choice: было сказано
  rationale: Сохраняет безличную пассивную конструкцию, не уточняя того, кто говорил.
- source_word: τοῖς ἀρχαίοις
  choice: людям древности
  rationale: Ясно указывает на прежние поколения и не создаёт возможного впечатления, будто речь просто о пожилых людях.
- source_word: Οὐκ ἐπιορκήσεις
  choice: Не клянись ложно
  rationale: Передаёт основное значение ложной клятвы, не сужая его до современного юридического понятия лжесвидетельства; возможность значения нарушения клятвы сохранена в сноске.
- source_word: ἀποδώσεις
  choice: исполняй
  rationale: В контексте клятв глагол означает выполнить принятое на себя обязательство; русский императив естественно выражает предписание, переданное греческой формой будущего времени.
- source_word: τῷ κυρίῳ
  choice: перед Господом
  rationale: В сочетании с исполнением клятв русский оборот естественно обозначает обязательство перед Богом; титул κύριος передан как «Господь».
- source_word: τοὺς ὅρκους σου
  choice: свои клятвы
  rationale: Точно и кратко передаёт существительное ὅρκος и возвратное отношение, естественное для русского языка.
theological_decisions:
- issue: Передача κύριος в аллюзии на Писания Израиля
  choice: Господом
  alternative: ГОСПОДОМ
  rationale: Греческий текст содержит κυρίῳ, а не еврейское тетраграмматон; основной текст сохраняет титул «Господь», тогда как связь с заветным именем отмечена в сноске.
- issue: Смысловой объём ἐπιορκέω
  choice: клянись ложно
  alternative: нарушай клятву
  rationale: Глагол допускает как ложную клятву, так и нарушение данной клятвы. Основной вариант передаёт ложность клятвы, а альтернативный смысл сохранён без догматического разрешения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формулировка сохраняет безличное «было сказано», прямое обращение и юридико-нравственный характер изречения, избегая узкого термина «лжесвидетельствовать».
