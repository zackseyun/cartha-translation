  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ ⸀αὐτοῦ ἔνοχος ἔσται τῇ κρίσει· ὃς δ’ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ· Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ’ ἂν εἴπῃ· Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/022.yaml
  text: But I say to you that everyone who is angry with his brother will be liable to the judgment[a]; and whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says[e][d][c][b], ‘Fool,’ will be liable to the Gehenna of fire.
translation:
  language: ru
  text: 'А Я говорю вам: всякий, кто гневается на своего брата[a][d], будет подлежать суду; кто скажет своему брату: «Рака!»[b] — будет подлежать совету[c]; а кто скажет: «Безумец!» — будет подлежать огненной геенне[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях после слов «гневается на своего брата» добавлено: «напрасно» (или «без причины»). В наиболее ранних и надёжно засвидетельствованных рукописях этих слов нет.'
    reason: textual_variant
  - marker: b
    text: «Рака» — арамейское презрительное слово, приблизительно означающее «пустоголовый» или «никчёмный».
    reason: cultural_note
  - marker: c
    text: 'Или: «Синедриону» — высшему иудейскому совету.'
    reason: alternative_reading
  - marker: d
    text: Слово «брат» передаёт существительное мужского рода в единственном числе, которое здесь может иметь представительное значение; изречение не обязательно относится лишь к родным братьям или только к мужчинам.
    reason: lexical_alternative
  - marker: e
    text: 'Или: «огненному аду». Слово «геенна» сохраняет употреблённое Иисусом название, связанное с долиной Еннома и ставшее образом суда.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: А Я говорю вам
  rationale: Ударное ἐγώ и противопоставление δέ переданы сочетанием «А Я», сохраняющим контраст с предшествующим учением и естественно звучащим по-русски.
- source_word: πᾶς ὁ ὀργιζόμενος
  choice: всякий, кто гневается
  rationale: Субстантивированное причастие настоящего времени выражает общее правило; эта формулировка сохраняет его характер, не уточняя без необходимости длительность или причину гнева.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: на своего брата
  rationale: При русском глаголе «гневаться» дательный греческого оригинала естественно передаётся конструкцией «на» с винительным падежом. Мужское единственное число сохранено в тексте, а его возможная представительная функция отмечена в сноске.
- source_word: ἔνοχος ἔσται
  choice: будет подлежать
  rationale: Формулировка передаёт будущую форму ἔσται и юридический смысл ответственности перед последующим судом или наказанием; повторение сохраняет риторический параллелизм.
- source_word: τῇ κρίσει
  choice: суду
  rationale: «Суд» сохраняет намеренно широкое судебное значение κρίσις, не решая без достаточных оснований, имеется ли в виду конкретный местный суд или сам акт суда.
- source_word: Ῥακά
  choice: Рака
  rationale: Арамейское оскорбление, сохранённое в греческом тексте транслитерацией, также транслитерировано по-русски; значение пояснено в сноске.
- source_word: τῷ συνεδρίῳ
  choice: совету
  rationale: Передаёт обычное значение συνέδριον и сохраняет возможную неоднозначность между советом вообще и Синедрионом как конкретным высшим советом.
- source_word: Μωρέ
  choice: Безумец
  rationale: Русское «безумец» передаёт прямое оскорбительное обращение и нравственно-религиозный оттенок μωρός лучше, чем современное заимствование «морон».
- source_word: εἰς τὴν γέενναν τοῦ πυρός
  choice: огненной геенне
  rationale: Термин γέεννα сохранён как «геенна», а τοῦ πυρός естественно передано русским определением «огненной», без сведения образа к более широкому слову «ад».
theological_decisions:
- issue: Передача γέεννα
  choice: геенна
  alternative: ад
  rationale: «Геенна» сохраняет конкретный образ, восходящий к долине Еннома и связанный с судом, не привнося автоматически все позднейшие ассоциации слова «ад».
- issue: Представительная функция ἀδελφός
  choice: брат
  alternative: брат или сестра; ближний; единоверец
  rationale: Основной текст сохраняет мужское единственное число оригинала, а сноска сообщает, что в данном изречении слово может употребляться шире и не ограничивать смысл родным братом мужского пола.
- issue: Характер трёх предупреждений
  choice: сохранён параллелизм без объяснения точного соотношения наказаний
  alternative: истолковать их как строгую ступенчатую шкалу земных и последнего суда
  rationale: В тексте заметно усиление судебных образов, однако перевод не должен догматически определять точные юрисдикции или меру каждого наказания.
translation_notes:
  register: Современный литературный русский язык с торжественной, но общепонятной интонацией. Юридический параллелизм оригинала сохранён повтором «будет подлежать». Архаизмы и конфессионально окрашенные уточнения не вводятся; специфические историко-культурные термины поясняются в сносках.
