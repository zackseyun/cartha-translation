id: MAT.5.40
reference: Matthew 5:40
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ τῷ θέλοντί σοι κριθῆναι καὶ τὸν χιτῶνά σου λαβεῖν, ἄφες αὐτῷ καὶ τὸ ἱμάτιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/040.yaml
  text: And to the one who wants to sue you and take your tunic[b][a], let him have your cloak also.
translation:
  language: ru
  text: И тому, кто хочет судиться с тобой[a] и взять твою рубаху[b], отдай и верхнюю одежду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «привлечь тебя к суду». Греческое выражение буквально относится к разбирательству в суде.'
    reason: lexical_alternative
  - marker: b
    text: Рубаха — нижняя одежда; далее речь идёт об одежде, которую носили поверх неё.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ θέλοντί
  choice: тому, кто хочет
  rationale: Субстантивированное причастие обозначает любого человека в такой ситуации; эта формулировка естественна по-русски и сохраняет значение волеизъявления.
- source_word: σοι κριθῆναι
  choice: судиться с тобой
  rationale: Инфинитив κριθῆναι буквально связан с судебным разбирательством. «Судиться с тобой» естественно передаёт юридический контекст, не уточняя сверх текста, кто именно возбуждает дело.
- source_word: χιτῶνά
  choice: рубаху
  rationale: χιτών — нижняя одежда, носившаяся под верхней. «Рубаха» понятно современному читателю и сохраняет контраст с верхней одеждой без излишней исторической экзотики.
- source_word: λαβεῖν
  choice: взять
  rationale: Передаёт обычное значение получения во владение и уместно в контексте судебного притязания.
- source_word: ἄφες αὐτῷ
  choice: отдай
  rationale: В данном контексте ἀφίημι означает уступить или позволить забрать. Повелительное «отдай» кратко и ясно сохраняет резкость требования; адресат косвенно понятен из первой части предложения.
- source_word: ἱμάτιον
  choice: верхнюю одежду
  rationale: ἱμάτιον обозначает наружное одеяние, отличное от χιτών. Описательный эквивалент точно и понятно передаёт это различие.
- source_word: καὶ ... καὶ
  choice: И ... и
  rationale: Первое καί связывает изречение с предыдущим контекстом, второе добавляет ещё более значимую уступку; русская конструкция сохраняет эту добавочную силу.
theological_decisions:
- issue: Этическая сила повеления Иисуса при судебном споре
  choice: Прямое требование радикальной неответной щедрости сохранено в конкретном повелении «отдай».
  alternative: Передать стих отвлечённо как общий совет уступать свои права.
  rationale: Повелительное ἄφες и конкретный образ двух предметов одежды требуют сохранить остроту высказывания, не сводя его к абстрактному принципу и не привязывая к определённой конфессиональной системе.
translation_notes:
  register: Современный литературный русский язык с ясной, сдержанно-достойной формулировкой. «Рубаха» и «верхняя одежда» делают историческое различие понятным обычному читателю; юридическая неоднозначность κριθῆναι отмечена в сноске.
