  text: ни землёй, потому что она — подножие для Его ног[b]; ни Иерусалимом[a], потому что он — город великого Царя[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к Иерусалиму»; здесь греческий предлог, по-видимому, употреблён идиоматически в формуле клятвы.'
    reason: lexical_alternative
