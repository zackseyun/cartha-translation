    reason: cross_reference
lexical_decisions:
- source_word: μήτε
  choice: ни
  rationale: Продолжает начатый в предыдущем стихе ряд запретов и естественно передаётся повторяющейся русской конструкцией «ни… ни…».
- source_word: ἐν τῇ γῇ
  choice: землёй
  rationale: 'В контексте клятв ἐν имеет инструментально-формульное значение: «клясться землёй».'
- source_word: γῇ
  choice: землёй
  rationale: Противопоставление небу и Иерусалиму указывает на землю как мироздание, а не на отдельную страну.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно передаёт причинное значение союза в современном русском языке.
- source_word: ὑποπόδιόν
  choice: подножие
  rationale: Точный и укоренённый в библейском стиле эквивалент, сохраняющий связь с Ис 66:1.
- source_word: τῶν ποδῶν αὐτοῦ
  choice: для Его ног
  rationale: Естественная русская конструкция при слове «подножие»; местоимение относится к Богу, как показывает контекст и аллюзия на Ис 66:1.
- source_word: εἰς Ἱεροσόλυμα
  choice: Иерусалимом
  rationale: В формуле клятвы εἰς употреблено идиоматически; творительный падеж естественно передаёт значение «клясться Иерусалимом». Необычная предложная форма отмечена в сноске.
- source_word: πόλις
  choice: город
  rationale: Прямой и естественный русский эквивалент.
- source_word: τοῦ μεγάλου βασιλέως
  choice: великого Царя
  rationale: Сохраняет родительный падеж, возвышенный регистр и аллюзию на Пс 47:3 по русской нумерации.
theological_decisions:
- issue: Референт αὐτοῦ в выражении «подножие для Его ног»
  choice: Прописная буква в «Его» указывает на Бога.
  alternative: Строчная буква «его», формально не уточняющая референта.
  rationale: Хотя греческий текст не различает регистр, непосредственный контекст предыдущего стиха и аллюзия на Ис 66:1 однозначно указывают на Бога; русская издательская норма допускает почтительное написание местоимения с прописной буквы.
- issue: Референт выражения «великий Царь»
  choice: «Царя» с прописной буквы, с сохранением имплицитного указания на Бога.
  alternative: «царя» со строчной буквы либо явное «Бога, великого Царя».
  rationale: Аллюзия на Пс 47:3 указывает на Бога. Прописная буква помогает русскому читателю распознать референта, не добавляя отсутствующего в тексте имени.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Эллиптическая конструкция сохранена, поскольку стих продолжает запрет «не клянись» из Мф. 5:34. Формула «ни землёй… ни Иерусалимом» звучит естественно и ясно в контексте.
