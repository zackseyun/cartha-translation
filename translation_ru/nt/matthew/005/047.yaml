source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀσπάσησθε τοὺς ⸀ἀδελφοὺς ὑμῶν μόνον, τί περισσὸν ποιεῖτε; οὐχὶ καὶ οἱ ⸀ἐθνικοὶ ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/047.yaml
  text: And if you greet only your brothers[c][b][a], what are you doing that is extraordinary? Do not even the Gentiles do the same?
translation:
  language: ru
  text: И если вы приветствуете только своих братьев[a], что особенного вы делаете?[b] Разве и язычники[c] не поступают так же?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братьев и сестёр»; греческое слово буквально означает «братьев», но здесь может шире относиться к членам своего круга или общины.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «что вы делаете сверх того?»'
    reason: lexical_alternative
  - marker: c
    text: 'То есть неевреи; возможно также: «люди из других народов».'
    reason: lexical_clarification
lexical_decisions:
- source_word: ἀσπάσησθε
  choice: приветствуете
  rationale: Глагол обозначает приветствие; этот вариант естественен по-русски и не добавляет значения гостеприимства.
- source_word: ἀδελφοὺς
  choice: братьев
  rationale: Сохраняет грамматически мужскую форму греческого текста; в данном контексте слово может шире обозначать членов своей общины или круга, что отмечено в сноске.
- source_word: μόνον
  choice: только
  rationale: Ясно передаёт ограничение действия одной группой.
- source_word: τί περισσὸν ποιεῖτε
  choice: что особенного вы делаете?
  rationale: Передаёт идею поступка, выходящего за рамки обычного, и сохраняет риторическую силу вопроса.
- source_word: ἐθνικοὶ
  choice: язычники
  rationale: В русской библейской лексике это естественное обозначение неевреев, находящихся вне народа завета; этнический смысл не следует сужать до современного значения религиозных язычников.
- source_word: τὸ αὐτό
  choice: так же
  rationale: Идиоматично передаёт греческое «то же самое» в сочетании с глаголом «поступают».
theological_decisions:
- issue: Объём значения ἀδελφοὺς в этическом наставлении
  choice: В основном тексте — «братьев», с указанием в сноске на возможный более широкий смысл.
  alternative: «братьев и сестёр»; «своих»; «членов своей общины»
  rationale: Так сохраняется выраженная в греческом мужская форма, но не исключается вероятная отсылка к своему кругу или общине в целом.
- issue: Значение ἐθνικοὶ
  choice: «язычники»
  alternative: «неевреи»; «народы»
  rationale: В данном иудейском контексте речь идёт о людях вне народа завета. Традиционное русское слово понятно, но его контекстуальный смысл пояснён в сноске, чтобы не усиливать религиозную окраску.
translation_notes:
  register: Современный литературный русский язык с ясной риторической структурой. «Что особенного вы делаете?» естественно передаёт περισσόν, а «Разве… не…?» сохраняет ожидаемый утвердительный ответ греческого οὐχί.
