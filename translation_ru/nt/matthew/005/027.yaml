  source_fidelity: «Вы слышали, что было сказано» точно передаёт Ἠκούσατε ὅτι ἐρρέθη, сохраняя обращение ко множеству слушателей, содержание услышанной традиции и безличный пассив без добавления говорящего. «Не прелюбодействуй» верно передаёт запретительное значение Οὐ μοιχεύσεις и его отсылку к формуле Декалога.
