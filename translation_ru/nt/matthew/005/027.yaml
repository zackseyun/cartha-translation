  text: 'Вы слышали, что было сказано: «Не прелюбодействуй».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Вы слышали
  rationale: Аорист в этой вводной формуле естественно передаётся по-русски прошедшим временем; выражение указывает на уже известное слушателям учение и не требует добавления «раньше».
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание услышанного и прямо соответствует естественной русской конструкции.
- source_word: ἐρρέθη
  choice: было сказано
  rationale: Безличная пассивная конструкция точно и естественно передаёт греческий аорист пассивного залога, не уточняя говорящего.
- source_word: Οὐ μοιχεύσεις
  choice: Не прелюбодействуй
  rationale: Будущее изъявительное с запретительной силой передаётся традиционной формой заповеди; глагол «прелюбодействовать» точно обозначает нарушение супружеской верности и сохраняет связь с Декалогом.
theological_decisions:
- issue: Связь с цитатой из Декалога
  choice: Не прелюбодействуй
  alternative: Не совершай супружеской измены
  rationale: Традиционная краткая форма узнаваемо воспроизводит заповедь и сохраняет её юридически-императивное звучание, не добавляя толкования.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и лаконичности формулы заповеди. «Вы слышали» звучит естественно и близко к греческому; архаические «слышали вы» и «речено» не используются.
