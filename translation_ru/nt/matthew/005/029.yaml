id: MAT.5.29
reference: Matthew 5:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ὀφθαλμός σου ὁ δεξιὸς σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου βληθῇ εἰς γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/029.yaml
  text: But if your right eye causes you to stumble[a], tear it out and throw it away from you[b]. For it is better for you that one of your members should perish than that your whole body should be thrown into Gehenna.
translation:
  language: ru
  text: Но если твой правый глаз служит тебе преткновением[a], вырви его и отбрось от себя. Ведь для тебя лучше, чтобы погибла одна из частей твоего тела, чем чтобы всё твоё тело было брошено в геенну[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вводит тебя в грех».'
    reason: lexical_alternative
  - marker: b
    text: Геенна — греческая форма названия, связанного с долиной Еннома; традиционно переводится словом «ад».
    reason: historical_term
lexical_decisions:
- source_word: σκανδαλίζει
  choice: становится для тебя причиной падения
  rationale: Сохраняет образ преткновения и падения, заложенный в греческом глаголе, но звучит ясно и естественно по-русски; контекстуальное значение греха дано в сноске.
- source_word: ἔξελε
  choice: вырви
  rationale: Передаёт резкий и настоятельный характер повеления, а также намеренно сильный образ исходного текста.
- source_word: βάλε ἀπὸ σοῦ
  choice: отбрось от себя
  rationale: Сохраняет как силу повеления βάλε, так и выраженную словами ἀπὸ σοῦ идею удаления от себя.
- source_word: συμφέρει
  choice: для тебя лучше
  rationale: Естественно выражает пользу и сравнительную логику фразы, не придавая ей коммерческого оттенка.
- source_word: ἀπόληται
  choice: погибла
  rationale: Передаёт серьёзность утраты, не уточняя сверх текста характер уничтожения.
- source_word: ἓν τῶν μελῶν σου
  choice: одна из частей твоего тела
  rationale: Современное и понятное обозначение телесного органа; слово «член» здесь возможно, но в современном русском менее прозрачно и естественно.
- source_word: βληθῇ
  choice: было брошено
  rationale: Прямо передаёт пассивную форму βάλλω и сохраняет силу греческого образа.
- source_word: γέενναν
  choice: геенну
  rationale: Сохраняет особый греческий термин, не подменяя его сразу более общим богословским понятием «ад»; пояснение дано в сноске.
- source_word: ὁ δεξιὸς
  choice: правый
  rationale: Сохраняет явно указанную в исходном тексте деталь.
- source_word: δὲ
  choice: Но
  rationale: Передаёт лёгкий контраст и продолжение мысли в контексте.
theological_decisions:
- issue: Передача γέεννα
  choice: геенна
  alternative: ад
  rationale: Транслитерация сохраняет исторически и богословски значимый термин исходного текста, не сводя заранее весь диапазон его ассоциаций к более общему русскому слову «ад».
- issue: Метафорическая сила σκανδαλίζω
  choice: становится для тебя причиной падения
  alternative: вводит тебя в грех
  rationale: Основной текст сохраняет образ падения, тогда как более узкое контекстуальное истолкование через грех приведено в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным звучанием. Сильная гиперболическая образность стиха сохранена; архаичные обороты и преждевременное богословское уточнение терминов избегаются.
