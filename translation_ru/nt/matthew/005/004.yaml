  verdict: approve
  source_fidelity: «Блаженны скорбящие» точно передаёт μακάριοι οἱ πενθοῦντες, сохраняя формулу блаженства и широкий, неуточнённый предмет скорби. «Потому что они будут утешены» верно отражает причинное ὅτι и будущее страдательное παρακληθήσονται. Необязательное усиление αὐτοὶ адекватно передано обычным «они», без искусственного акцента.
  naturalness: Фраза кратка, ясна и естественна для современного литературного русского языка; «скорбящие» имеет несколько возвышенный, но уместный для жанра блаженств регистр. «Потому что» современно и не создаёт архаизации.
  terminology: «Блаженны» сохраняет устойчивую терминологию блаженств без сведения смысла к субъективному «счастливы». «Скорбящие» и вариант в сноске «горюющие» не сужают πενθοῦντες до скорби о грехе, личной утраты или конкретной исторической ситуации. «Будут утешены» точно и естественно передаёт обещание утешения.
