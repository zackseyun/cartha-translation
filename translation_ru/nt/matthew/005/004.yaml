id: MAT.5.4
reference: Matthew 5:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μακάριοι οἱ πενθοῦντες, ὅτι αὐτοὶ παρακληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/004.yaml
  text: Blessed are those who mourn[a], because they will be comforted.
translation:
  language: ru
  text: Блаженны скорбящие[a], потому что они будут утешены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «горюющие». Греческое слово имеет широкое значение и не уточняет причину скорби.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Блаженны
  rationale: Сохраняет традиционную формулу блаженств и её объективную оценочную силу; «счастливы» могло бы звучать как описание субъективного эмоционального состояния.
- source_word: οἱ πενθοῦντες
  choice: скорбящие
  rationale: Субстантивированное причастие передано естественным русским причастием во множественном числе. «Скорбящие» охватывает плач и глубокую печаль, не уточняя их причину.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно передаёт причинное значение союза в современном русском языке.
- source_word: αὐτοὶ
  choice: они
  rationale: Отдельное местоимение сохраняет некоторую выраженность греческого αὐτοὶ без чрезмерно усиленного «именно они».
- source_word: παρακληθήσονται
  choice: будут утешены
  rationale: Естественно передаёт будущее страдательного залога и значение получения утешения.
theological_decisions:
- issue: Смысловой охват скорби в блаженстве
  choice: Передать широко как «скорбящие», не называя причину скорби.
  alternative: «скорбящие о грехе»; «оплакивающие состояние Израиля»; «горюющие вообще»
  rationale: Греческий текст не указывает, вызвана ли скорбь личной утратой, грехом, угнетением или эсхатологическим ожиданием; широкий перевод сохраняет эту намеренную открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством традиционной формулы блаженств. Синтаксис краткий и доступный; архаическое причинное «ибо» заменено ясным «потому что».
