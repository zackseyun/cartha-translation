  text: ἔστω δὲ ὁ λόγος ὑμῶν ναὶ ναί, οὒ οὔ· τὸ δὲ περισσὸν τούτων ἐκ τοῦ πονηροῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/037.yaml
  text: But let your word be[a], ‘Yes, yes,’ or ‘No, no.’ Anything beyond these is from the evil one.
translation:
  language: ru
  text: 'Но пусть ваше слово будет: «Да, да» или «Нет, нет». А всё, что сверх этого, — от лукавого[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от зла». Греческое выражение τοῦ πονηροῦ может пониматься как «от лукавого» в личном смысле или как «от зла» в безличном.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστω
  choice: пусть ... будет
  rationale: Форма повелительного наклонения третьего лица от εἰμί передаёт наставление; русское «пусть ... будет» естественно и точно сохраняет эту силу.
- source_word: λόγος
  choice: слово
  rationale: Здесь речь идёт о сказанном человеком; «слово» сохраняет краткость и афористичность греческой формулировки.
- source_word: ναὶ ναί, οὒ οὔ
  choice: «Да, да» или «Нет, нет»
  rationale: Повтор частиц сохранён ради греческого акцента и ритма, а союз «или» естественно выражает противопоставление по-русски.
- source_word: τὸ δὲ περισσὸν τούτων
  choice: А что сверх этого
  rationale: Субстантивированное сравнительное прилагательное обозначает всё выходящее за пределы названных прямых ответов; формулировка кратка и естественна.
- source_word: ἐκ
  choice: от
  rationale: Предлог обозначает источник или происхождение; в сочетании «от лукавого» это наиболее естественный русский эквивалент.
- source_word: τοῦ πονηροῦ
  choice: лукавого
  rationale: Артиклированная форма допускает личное и безличное понимание. «От лукавого» сохраняет вероятное у Матфея личное значение и традиционно-достоинный, понятный современному читателю оборот; альтернативное «от зла» указано в сноске.
theological_decisions:
- issue: Личное или безличное значение τοῦ πονηροῦ
  choice: от лукавого
  alternative: от зла
  rationale: 'Грамматика допускает оба толкования, однако у Матфея ὁ πονηρός нередко обозначает личного носителя зла. Основной текст отражает это вероятное значение, не устраняя неоднозначность: безличный вариант дан в сноске.'
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и афористичным звучанием. Повтор «да, да / нет, нет» сохранён по форме греческого текста; «лукавый» употреблено субстантивированно и со строчной буквы, чтобы не добавлять к исходному тексту лишней определённости.
