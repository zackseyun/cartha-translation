  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ ⸂μετ’ αὐτοῦ ἐν τῇ ὁδῷ⸃, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ ⸀κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/025.yaml
  text: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
translation:
  language: ru
  text: Будь поскорее благожелателен к своему обвинителю[a], пока ты ещё с ним в пути, чтобы обвинитель не передал тебя судье, а судья не передал судебному служителю, и тебя не бросили в тюрьму.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более идиоматично в данном судебном контексте: «Поскорее договорись со своим обвинителем».'
    reason: Лексическая альтернатива для ἴσθι εὐνοῶν.
lexical_decisions:
- source_word: ἴσθι εὐνοῶν
  choice: проявить расположение
  rationale: Передаёт основное значение εὐνοέω — благожелательно относиться, быть расположенным — и не подменяет его более узким толкованием о достижении соглашения. Побудительная конструкция по-русски естественно выражена императивом «поспеши проявить».
- source_word: ἀντιδίκῳ / ἀντίδικος
  choice: обвинителю / обвинитель
  rationale: 'Контекст явно судебный: далее названы судья, служитель и темница. «Обвинитель» ясно передаёт юридическую роль, не прибегая к громоздкому «судебный противник».'
- source_word: ταχὺ
  choice: поспеши
  rationale: Передаёт срочность наречия и образует естественную современную русскую фразу вместе с последующим глаголом.
- source_word: ἕως ὅτου εἶ μετ’ αὐτοῦ ἐν τῇ ὁδῷ
  choice: пока ты ещё с ним в пути
  rationale: Сохраняет конкретный образ совместного пути и не добавляет отсутствующего в греческом тексте уточнения «в суд».
- source_word: μήποτέ
  choice: чтобы … не
  rationale: Естественно передаёт предупредительно-предотвращающее значение μήποτε в современном русском языке.
- source_word: παραδῷ
  choice: не передал тебя
  rationale: Точно и естественно выражает передачу человека во власть следующего должностного лица.
- source_word: κριτῇ / κριτὴς
  choice: судье / судья
  rationale: Прямой и общепонятный эквивалент в данном судебном контексте.
- source_word: ὑπηρέτῃ
  choice: судебному служителю
  rationale: Контекстуальное уточнение «судебному» показывает, что речь идёт о подчинённом должностном лице, исполняющем распоряжение судьи; это яснее современному читателю, чем одно «служителю».
- source_word: εἰς φυλακὴν
  choice: в темницу
  rationale: Традиционно-достоинный, но по-прежнему понятный русский эквивалент, соответствующий серьёзности предупреждения.
- source_word: βληθήσῃ
  choice: тебя не бросили
  rationale: Сохраняет яркую силу βάλλω и пассивную конструкцию исходного текста.
theological_decisions:
- issue: Передавать ли начальное повеление как достижение юридического соглашения или сохранить значение благожелательного расположения
  choice: В основном тексте сохранено «проявить расположение».
  alternative: «Поскорее договорись со своим обвинителем».
  rationale: Юридический контекст делает смысл договорённости вероятным, однако εὐνοέω непосредственно обозначает благожелательное расположение. Основной текст сохраняет эту смысловую открытость, а более идиоматическое юридическое понимание дано в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан ясным и плавным; конкретный образ пути сохранён. Слово «темница» слегка возвышенное, но общеупотребительное в библейском контексте.
