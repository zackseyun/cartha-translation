  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰ πετρώδη ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ εὐθέως ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/005.yaml
  text: Other seed fell on rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil,
translation:
  language: ru
  text: Другие семена упали на каменистую почву[a], где земли было мало, и сразу взошли, потому что слой земли был неглубок.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на каменистые места»; имеются в виду участки с тонким слоем земли над каменной породой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα δὲ
  choice: Другие семена
  rationale: Форма среднего рода во множественном числе эллиптически отсылает к семенам из предыдущего стиха; существительное добавлено для ясности, а противопоставление передано без излишне резкого «но».
- source_word: ἔπεσεν
  choice: упали
  rationale: Передаёт прямое значение глагола в образе притчи; вариант «были посеяны» добавлял бы отсутствующее в греческом тексте толкование действия.
- source_word: ἐπὶ τὰ πετρώδη
  choice: на каменистую почву
  rationale: Естественное современное выражение для участков с тонким слоем земли над каменной породой; буквальная форма пояснена в сноске.
- source_word: ὅπου οὐκ εἶχεν γῆν πολλήν
  choice: где земли было мало
  rationale: Естественно передаёт недостаток почвы в сельскохозяйственном контексте и не создаёт неясного местоименного подлежащего.
- source_word: καὶ εὐθέως ἐξανέτειλεν
  choice: и сразу взошли
  rationale: «Сразу» сохраняет временную силу εὐθέως, а «взошли» является обычным русским обозначением появления ростков.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: потому что слой земли был неглубок
  rationale: Передаёт причинное значение конструкции с διά и образ малой глубины почвы естественным современным русским языком.
