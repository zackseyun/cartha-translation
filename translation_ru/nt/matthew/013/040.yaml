  text: ὥσπερ οὖν συλλέγεται τὰ ζιζάνια καὶ πυρὶ ⸀καίεται, οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ ⸀αἰῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/040.yaml
  text: Therefore[a], just as the weeds are gathered and burned with fire[b], so it will be at the end of the age.
translation:
  language: ru
  text: Итак, как собирают сорняки[a] и сжигают их в огне, так будет при завершении века[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плевелы». Греческое слово обозначает вредные сорняки, вероятно плевел опьяняющий.'
    reason: lexical_alternative
  - marker: b
    text: 'Или, традиционно: «при кончине мира»; греческое слово означает «век».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ οὖν
  choice: Итак, как
  rationale: «Итак» передаёт выводное или продолжительное значение οὖν, а «как» вводит сравнение ὥσπερ; вместе они сохраняют связь с предшествующим объяснением.
- source_word: συλλέγεται
  choice: собирают
  rationale: Греческая форма стоит в настоящем времени и имеет пассивное значение. Русская неопределённо-личная конструкция естественно передаёт обобщённое действие в образном сравнении.
- source_word: τὰ ζιζάνια
  choice: сорняки
  rationale: ζιζάνια обозначает вредные сорные растения, вероятно плевел; общее слово «сорняки» понятно современному читателю и не вносит излишней ботанической точности.
- source_word: πυρὶ καίεται
  choice: сжигают в огне
  rationale: Фраза сохраняет простое значение καίω и явное упоминание огня; «в огне» естественно передаёт дательный πυρί в данном контексте.
- source_word: οὕτως ἔσται
  choice: так будет
  rationale: Кратко и естественно передаёт соответствие между образом и его будущим исполнением.
- source_word: ἐν τῇ συντελείᾳ
  choice: при завершении
  rationale: συντέλεια означает завершение, итоговую стадию или свершение. «При завершении» сохраняет процессуально-кульминационный оттенок лучше, чем одно лишь «в конце».
- source_word: τοῦ αἰῶνος
  choice: века
  rationale: αἰών здесь имеет временное значение «век, эпоха», а не пространственное значение «мир»; отсутствие указательного местоимения в греческом тексте не требует добавления «этого».
theological_decisions:
- issue: Эсхатологическое выражение τοῦ αἰῶνος
  choice: века
  alternative: мира
  rationale: «Века» сохраняет временной и эсхатологический смысл αἰών и не отождествляет завершение эпохи с уничтожением физического мира. Перевод не уточняет конкретную эсхатологическую схему.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Неопределённо-личные формы «собирают и сжигают» звучат естественнее буквального пассива и сохраняют обобщённость сравнения. Термин «завершение века» выбран ради точности, а традиционная формула вынесена в примечание.
