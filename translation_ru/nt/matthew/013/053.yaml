  text: καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τὰς παραβολὰς ταύτας, μετῆρεν ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/053.yaml
  text: And when Jesus had finished these parables[a], he departed from there.
translation:
  language: ru
  text: Когда Иисус закончил рассказывать эти притчи, Он ушёл оттуда.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἐγένετο ὅτε
  choice: Когда
  rationale: Сочетание служит повествовательным переходом и вводит временное придаточное. В современном русском естественное «Когда» передаёт временную связь без буквального, но тяжеловесного «И случилось, когда».
- source_word: ἐτέλεσεν
  choice: закончил рассказывать
  rationale: Глагол означает довести до конца, завершить. Добавление «рассказывать» естественно сочетается в русском с «притчами» и ясно выражает завершение речи, не меняя смысла.
- source_word: τὰς παραβολὰς ταύτας
  choice: эти притчи
  rationale: «Притчи» — закрепившееся жанровое соответствие παραβολαί, а указательное «эти» отсылает к непосредственно предшествующему циклу притч.
- source_word: μετῆρεν
  choice: ушёл
  rationale: В данном контексте глагол обозначает перемещение прочь из места. «Ушёл» точно и естественно для современного русского; более формальное «удалился» звучало бы архаично.
- source_word: ἐκεῖθεν
  choice: оттуда
  rationale: Наречие места прямо означает «оттуда».
theological_decisions: []
