  text: Ταῦτα πάντα ἐλάλησεν ὁ Ἰησοῦς ἐν παραβολαῖς τοῖς ὄχλοις, καὶ χωρὶς παραβολῆς ⸀οὐδὲν ἐλάλει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/034.yaml
  text: Jesus spoke all these things to the crowds in parables[a], and apart from a parable he said nothing to them.
translation:
  language: ru
  text: Всё это Иисус сказал толпам в притчах, и без притчи ничего им не говорил.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα πάντα
  choice: Всё это
  rationale: Естественная русская конструкция, сохраняющая указательное значение и полноту охвата.
- source_word: ἐλάλησεν
  choice: говорил
  rationale: Аорист обобщает описанную речь Иисуса; несовершенный вид по-русски естественно передаёт процесс и согласуется с последующим ἐλάλει.
- source_word: ἐν παραβολαῖς
  choice: притчами
  rationale: Творительный образа или средства действия естественно передаёт ἐν с дательным в значении способа речи.
- source_word: τοῖς ὄχλοις
  choice: народу
  rationale: В данном контексте множественное ὄχλοι обозначает собравшийся простой народ; русский собирательный эквивалент звучит естественно и не подразумевает нескольких раздельных толп.
- source_word: χωρὶς παραβολῆς
  choice: без притчи
  rationale: Сохраняет значение χωρίς и единственное число παραβολῆς.
- source_word: οὐδὲν ἐλάλει
  choice: ничего им не говорил
  rationale: Русский несовершенный вид естественно передаёт длительное или обычное действие греческого имперфекта без тяжеловесной конструкции.
- source_word: αὐτοῖς
  choice: им
  rationale: Местоимение ясно отсылает к народу и избегает ненужного повтора.
theological_decisions:
- issue: Видовое значение имперфекта ἐλάλει во второй части стиха
  choice: ничего им не говорил
  alternative: ничего им не сказал
  rationale: 'Несовершенный вид сохраняет возможное обычное или продолженное значение: в описываемой обстановке Иисус обращался к народу посредством притч. При этом перевод не превращает эту фразу в универсальное утверждение обо всей его речи.'
translation_notes:
  register: Современный литературный русский язык; фраза краткая, повествовательная и торжественно-нейтральная. Видовой контраст греческого аориста и имперфекта передан прежде всего контекстом и русским несовершенным видом; отдельная сноска не требуется.
