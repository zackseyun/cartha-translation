  verdict: revise
  source_fidelity: Греческие причастия βλέποντες и ἀκούοντες обозначают одновременное внешнее восприятие в противопоставлении последующему «не видят / не слышат». В черновике «смотрят» несколько сужает первое выражение до намеренного направления взгляда и не сохраняет повтор глагола «видеть». Более близкое «видя, не видят» сохраняет синтаксический параллелизм и намеренную парадоксальность оригинала. Причинное «потому что» и заключительное «и не понимают» переданы точно.
