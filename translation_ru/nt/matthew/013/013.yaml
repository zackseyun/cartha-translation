  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν παραβολαῖς αὐτοῖς λαλῶ, ὅτι βλέποντες οὐ βλέπουσιν καὶ ἀκούοντες οὐκ ἀκούουσιν οὐδὲ συνίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/013.yaml
  text: For this reason I speak to them in parables[a], because seeing they do not see, and hearing they do not hear, nor do they understand.
translation:
  language: ru
  text: Поэтому Я говорю им притчами, потому что, видя, они не видят и, слыша, не слышат и не понимают.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Кратко и естественно передаёт причинно-следственную связь с предшествующим контекстом.
- source_word: ἐν παραβολαῖς
  choice: притчами
  rationale: Русский творительный образа действия естественно передаёт греческое ἐν с дательным и обозначает способ речи.
- source_word: αὐτοῖς λαλῶ
  choice: Я говорю им
  rationale: Сохраняет настоящее время, адресата и прямой характер высказывания.
- source_word: ὅτι
  choice: потому что
  rationale: Передаёт причинное значение союза в объяснении того, почему Иисус говорит притчами.
- source_word: βλέποντες οὐ βλέπουσιν
  choice: они смотрят, но не видят
  rationale: Сохраняет парадоксальное повторение корня и естественно выражает контраст внешнего зрения и действительного восприятия, не уточняя его доктринально.
- source_word: ἀκούοντες οὐκ ἀκούουσιν
  choice: слушают, но не слышат
  rationale: Передаёт параллелизм исходного текста и различие между внешним слушанием и восприятием услышанного.
- source_word: οὐδὲ συνίουσιν
  choice: и не понимают
  rationale: Естественно продолжает отрицательный ряд; «понимают» точно передаёт отсутствие постижения смысла.
theological_decisions:
- issue: Смысл причастий βλέποντες и ἀκούοντες
  choice: Контраст передан конструкциями «смотрят, но не видят» и «слушают, но не слышат»
  alternative: 'Более формально: «видя, не видят, и слыша, не слышат»'
  rationale: Греческие причастия сами по себе не требуют явно уступительного перевода. Союз «но» делает парадокс понятным по-русски, сохраняя напряжение между внешним восприятием и отсутствием понимания без добавления объяснения причины.
- issue: Значение συνίουσιν
  choice: не понимают
  alternative: не постигают
  rationale: «Понимают» ясно обозначает неспособность уловить смысл и не вносит более сильного утверждения о её причине или виновности слушателей.
translation_notes:
  register: Современный литературный русский язык; речь ясная и достойная, с сохранением риторического параллелизма греческого текста. Местоимение «Я» написано с прописной буквы по принятой русской библейской традиции.
