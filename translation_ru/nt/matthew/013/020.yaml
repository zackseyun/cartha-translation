id: MAT.13.20
reference: Matthew 13:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ εὐθὺς μετὰ χαρᾶς λαμβάνων αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/020.yaml
  text: As for the one sown on the rocky ground[a], this is the one who hears the word and immediately receives it with joy,
translation:
  language: ru
  text: А посеянный на каменистой почве[a] — это тот, кто слышит слово и сразу с радостью принимает его,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «посеянный на каменистых местах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς
  choice: А посеянный на каменистой почве
  rationale: Субстантивированное причастие сохраняет сжатый образ посеянного и одновременно указывает на представленного им человека; «а» передаёт мягкий переход δέ.
- source_word: πετρώδη
  choice: каменистая почва
  rationale: Естественное современное обозначение неглубокой почвы с каменистым основанием; сохраняет земледельческий образ контекста.
- source_word: σπαρείς
  choice: посеянный
  rationale: Кратко и точно передаёт аористное страдательное причастие, не устраняя метафору сеяния.
- source_word: οὗτός ἐστιν
  choice: это тот
  rationale: Сохраняет прямое отождествление и делает русское предложение естественным без поясняющего «означает».
- source_word: ὁ τὸν λόγον ἀκούων
  choice: кто слышит слово
  rationale: Причастная конструкция естественно передана придаточным; «слово» сохраняет лексику и тематические связи Матфея.
- source_word: εὐθὺς
  choice: сразу
  rationale: Современный и точный эквивалент, сохраняющий смысл немедленной реакции.
- source_word: μετὰ χαρᾶς
  choice: с радостью
  rationale: Прямо сохраняет существительное χαρά и звучит естественно по-русски.
- source_word: λαμβάνων αὐτόν
  choice: принимает его
  rationale: В данном контексте λαμβάνω означает принятие услышанного слова; местоимение ясно отсылает к слову.
theological_decisions:
- issue: Референт «посеянного» в объяснении притчи
  choice: Сохранить сжатую формулировку «посеянный… — это тот, кто…»
  alternative: «Семя, посеянное на каменистой почве, означает человека, который…»
  rationale: Греческий текст намеренно соединяет образ посеянного с человеком, слышащим слово. Перевод не устраняет эту образную напряжённость пояснительной парафразой.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; сохранена земледельческая метафора и синтаксическая сжатость оригинала. Конечная запятая оставлена, поскольку стих продолжается в следующем предложении исходного контекста.
