  source_fidelity: 'Основной перевод верно передаёт δέ как контрастное «же», μακάριοι как «блаженны», а также сохраняет буквальные глаголы «видят» и «слышат» без преждевременного истолкования. Причинное «потому что» для ὅτι допустимо и естественно. Однако сноска не вполне соответствует заявленной альтернативе в английской контрольной версии: «тем, что» не является прямой и естественной русской альтернативой причинному «потому что» в этой конструкции.'
