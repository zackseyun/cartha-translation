  text: ὑμῶν δὲ μακάριοι οἱ ὀφθαλμοὶ ὅτι βλέπουσιν, καὶ τὰ ὦτα ὑμῶν ὅτι ⸀ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/016.yaml
  text: But blessed are your eyes[a], because they see, and your ears, because they hear.
translation:
  language: ru
  text: Ваши же глаза блаженны, потому что видят, и ваши уши блаженны, потому что слышат.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ибо видят… ибо слышат». Греческий союз здесь может быть передан и так.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: же
  rationale: В контексте частица обозначает противопоставление тем, кто смотрит, но не видит, и слушает, но не слышит; постпозитивное «же» естественно передаёт этот оттенок по-русски.
- source_word: μακάριοι
  choice: блаженны
  rationale: Сохраняет характерную для евангельских изречений идею благословенного состояния и Божьего благоволения, не сводя её к субъективному счастью.
- source_word: οἱ ὀφθαλμοὶ / τὰ ὦτα
  choice: ваши глаза / ваши уши
  rationale: Естественная русская передача притяжательных конструкций с сохранением параллелизма.
- source_word: ὅτι
  choice: потому что
  rationale: 'Передаёт наиболее вероятное причинное значение союза: зрение и слух названы причиной блаженного состояния.'
- source_word: βλέπουσιν / ἀκούουσιν
  choice: видят / слышат
  rationale: Сохраняет простые чувственные глаголы исходного текста и не делает подразумеваемое духовное восприятие явным.
theological_decisions:
- issue: Следует ли явно обозначить духовное понимание в глаголах зрения и слуха
  choice: Сохранить буквальные «видят» и «слышат»
  alternative: «понимают увиденное» и «внимают услышанному»
  rationale: Сам стих использует обычные глаголы зрения и слуха. Более глубокий смысл раскрывается контекстом, поэтому его не следует вносить в перевод как прямое утверждение.
- issue: Значение ὅτι
  choice: 'Причинное: «потому что»'
  alternative: 'Изъяснительное: «блаженны тем, что видят… тем, что слышат»'
  rationale: Причинное прочтение наиболее естественно в данном макаризме, однако греческий союз допускает близкое изъяснительное понимание, отмеченное в сноске.
translation_notes:
  register: Современный литературный русский язык с традиционно-библейским, но понятным словом «блаженны». Эллипсис во второй части («уши — потому что слышат») естественно сохраняет параллелизм и избегает тяжеловесного повтора.
