base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/057.yaml
  text: And they took offense at him[a]. But Jesus said to them[c][b], “A prophet is not without honor except in his hometown and in his own household.”
translation:
  language: ru
  text: 'И они были возмущены Им[a]. Но Иисус сказал им: «Пророк не бывает без чести, разве только у себя на родине[b] и в своём доме[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они оскорбились из-за Него». Буквально: «они были приведены к преткновению в Нём».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в родном месте», «в родном городе» или «на родине».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «среди своих домашних». Греческое слово может обозначать дом, домочадцев или семейный круг.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: они отвергли Его
  rationale: В данном контексте оборот означает, что Иисус стал для них причиной преткновения и они не приняли Его; «отвергли» естественно передаёт итоговую реакцию, а буквальный образ сохранён в сноске.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Но Иисус сказал им
  rationale: δέ обозначает мягкое противопоставление реакции слушателей последующим словам Иисуса.
- source_word: προφήτης
  choice: пророк
  rationale: Прямой и общепринятый русский эквивалент, сохраняющий форму изречения.
- source_word: ἄτιμος
  choice: без чести
  rationale: Сохраняет лексику чести и бесчестия и отрицательную форму греческого изречения.
- source_word: εἰ μὴ
  choice: разве только
  rationale: Естественно выражает исключение в русской пословичной конструкции.
- source_word: πατρίδι
  choice: у себя на родине
  rationale: πατρίς обозначает родное место; в контексте это Назарет. «Родина» сохраняет более широкий диапазон слова, а оборот «у себя» указывает на местную среду.
- source_word: οἰκίᾳ αὐτοῦ
  choice: в собственном доме
  rationale: οἰκία может означать как дом, так и домашних или семейный круг. Основной текст сохраняет конкретное «дом», а смысловая неоднозначность отмечена в сноске.
theological_decisions:
- issue: Объём смысла изречения Иисуса об отвержении пророка
  choice: Передать как общее изречение о недостатке чести у пророка в родной и домашней среде, не расширяя его до общего учения обо всяком отвержении Иисуса.
  alternative: Истолковательно подчеркнуть именно неверие родственников.
  rationale: Греческий текст сохраняет пословичную форму и тему чести в близком социальном окружении, но сам по себе не формулирует более широкого доктринального вывода.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной и слегка пословичной формой речи Иисуса. Заглавное местоимение «Его» соответствует распространённой русской библейской издательской традиции; неоднозначности ключевых оборотов вынесены в сноски.
