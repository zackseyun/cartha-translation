  text: οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ αἰῶνος· ἐξελεύσονται οἱ ἄγγελοι καὶ ἀφοριοῦσιν τοὺς πονηροὺς ἐκ μέσου τῶν δικαίων
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/049.yaml
  text: 'So it will be at the end of the age: the angels will go out and separate the wicked from among the righteous,[a]'
translation:
  language: ru
  text: 'Так будет при завершении века: ангелы выйдут и отделят злых от праведных.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в конце века». В традиционных переводах встречается «при кончине мира», однако греческое слово αἰών означает «век», а не «мир».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως ἔσται
  choice: Так будет
  rationale: Кратко и естественно передаёт указание на итог и смысл образа, сохраняя будущее время.
- source_word: ἐν τῇ συντελείᾳ τοῦ αἰῶνος
  choice: при завершении века
  rationale: «Завершение» передаёт значение συντέλεια как доведения до конца, а «век» соответствует αἰών и не подменяет его словом «мир».
- source_word: ἐξελεύσονται οἱ ἄγγελοι
  choice: ангелы выйдут
  rationale: В контексте окончательного суда ἄγγελοι означает небесных ангелов; «выйдут» прямо передаёт ἐξελεύσονται без архаического оттенка.
- source_word: ἀφοριοῦσιν
  choice: отделят
  rationale: Глагол обозначает отделение одной группы от другой; русский выбор ясен и естественен.
- source_word: τοὺς πονηροὺς
  choice: злых
  rationale: Субстантивированное прилагательное обозначает злых людей. «Злых» звучит современно и сохраняет нравственную характеристику.
- source_word: ἐκ μέσου τῶν δικαίων
  choice: от праведных
  rationale: В сочетании с «отделят» русский язык естественно выражает удаление злых из смешанной группы конструкцией «отделят … от …»; «праведных» точно передаёт субстантивированное δικαίων.
theological_decisions:
- issue: Значение αἰών в эсхатологическом выражении
  choice: век
  alternative: мир
  rationale: Греческое αἰών обозначает век или эпоху; перевод «мир» мог бы необоснованно представить фразу как прямое утверждение об уничтожении физического мира.
- issue: Кто подразумевается под οἱ ἄγγελοι
  choice: небесные ангелы
  alternative: вестники
  rationale: Контекст объяснения притчи об окончательном суде указывает на сверхъестественных ангелов, а не на человеческих посланников.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка избегает как разговорности, так и архаического выражения «кончина мира»; синтаксис краток и понятен широкому кругу читателей.
