  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/050.yaml
  text: and they will throw them into the furnace of fire[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: ru
  text: И бросят их в огненную печь.[a] Там будет плач и скрежет зубов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «печь огня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσιν
  choice: бросят
  rationale: Будущее время от βάλλω передаёт решительное действие — «бросить». Современное русское «бросят» естественно и сохраняет силу греческого глагола.
- source_word: αὐτοὺς
  choice: их
  rationale: Винительный падеж местоимения мужского рода во множественном числе отсылает к нечестивым из предыдущего контекста.
- source_word: κάμινον τοῦ πυρός
  choice: огненную печь
  rationale: Идиоматическое русское сочетание точно передаёт образ печи, наполненной огнём; буквальное «печь огня» в современном русском звучит неестественно.
- source_word: ἐκεῖ
  choice: Там
  rationale: Кратко и естественно сохраняет выраженное в греческом тексте указание на место.
- source_word: ἔσται
  choice: будет
  rationale: Будущая форма εἰμί естественно передаётся русским «будет» при однородных существительных.
- source_word: ὁ κλαυθμὸς
  choice: плач
  rationale: «Плач» точно передаёт рыдание и скорбь, сохраняя устойчивую для Матфея формулу.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: скрежет зубов
  rationale: Устойчивое и понятное русское выражение, точно соответствующее образу βρυγμός τῶν ὀδόντων и сохраняющее его связь с мукой и судом.
theological_decisions:
- issue: Передача эсхатологического образа суда
  choice: Сохранить конкретные образы огненной печи, плача и скрежета зубов без смягчения и поясняющего пересказа.
  alternative: 'Передать смысл описательно: «там люди будут плакать и скрежетать зубами от мучения».'
  rationale: Греческий текст формулирует образ суда метафорически и не объясняет его природу. Перевод сохраняет эту образность и богословскую напряжённость, не добавляя толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством и лаконичностью евангельского изречения. «Огненная печь» естественнее буквального генитивного оборота, а примечание сохраняет прозрачность формы оригинала.
