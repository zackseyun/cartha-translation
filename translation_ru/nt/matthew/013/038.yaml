  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀγρός ἐστιν ὁ κόσμος· τὸ δὲ καλὸν σπέρμα, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας· τὰ δὲ ζιζάνιά εἰσιν οἱ υἱοὶ τοῦ πονηροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/038.yaml
  text: The field is the world[a], and the good seed—these are the sons of the kingdom. And the weeds are the sons of the evil one[c][b],
translation:
  language: ru
  text: Поле — это мир, а доброе семя — это сыны Царства.[a] Сорняки же[b] — сыны лукавого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Сыны Царства» — образное выражение о людях, принадлежащих Царству; оно относится не только к мужчинам.
    reason: cultural_note
  - marker: b
    text: Под «сорняками» здесь, вероятно, подразумеваются плевелы — растение, похожее на пшеницу.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρός
  choice: поле
  rationale: Обычное и естественное обозначение поля в земледельческой притче; сохраняет исходный образ.
- source_word: κόσμος
  choice: мир
  rationale: Передаёт широкий смысл сферы, в которой происходит посев, и соответствует обычному употреблению слова в данном объяснении.
- source_word: καλὸν σπέρμα
  choice: доброе семя
  rationale: Сохраняет земледельческий образ и прямое противопоставление сорнякам.
- source_word: υἱοὶ τῆς βασιλείας
  choice: сыны Царства
  rationale: Сохраняет мужской род и реляционную семитскую окраску греческого выражения; пояснение раскрывает его представительный смысл.
- source_word: ζιζάνια
  choice: сорняки
  rationale: Понятное современному читателю общее название; более точное ботаническое обозначение «плевелы» менее прозрачно и потому отмечено в примечании.
- source_word: τοῦ πονηροῦ
  choice: лукавого
  rationale: 'Артикль и форма мужского рода поддерживают личное понимание: речь идёт о носителе зла, а не об отвлечённом зле.'
theological_decisions:
- issue: Личное или безличное понимание τοῦ πονηροῦ
  choice: лукавого
  alternative: зла
  rationale: Грамматическая форма с артиклем и мужским родом в сочетании «сыны кого-либо» естественно указывает на личного деятеля, не называя его точнее, чем это делает греческий текст.
- issue: Передача υἱοὶ как гендерно конкретного или инклюзивного выражения
  choice: сыны
  alternative: дети
  rationale: Основной текст сохраняет явное «сыны» греческого оригинала, а примечание разъясняет, что выражение относится ко всем людям, принадлежащим соответствующей стороне.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Параллельная структура трёх толкований сохранена; частица δὲ передана сочетанием «а» и постпозитивным «же». «Сыны» оставлено ради точности и образной реляционной окраски, но снабжено ясным примечанием.
