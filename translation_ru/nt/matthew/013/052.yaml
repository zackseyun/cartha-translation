source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Διὰ τοῦτο πᾶς γραμματεὺς μαθητευθεὶς ⸂τῇ βασιλείᾳ⸃ τῶν οὐρανῶν ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐκβάλλει ἐκ τοῦ θησαυροῦ αὐτοῦ καινὰ καὶ παλαιά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/052.yaml
  text: Then he said to them[c][b][a], “Therefore every scribe who has been trained for the kingdom of heaven is like a master of a house who brings out of his treasure new things and old.”
translation:
  language: ru
  text: 'Тогда Он сказал им: «Поэтому всякий книжник, ставший учеником Царства Небесного[a], подобен хозяину дома[b], который выносит из своей сокровищницы[c] новое и старое».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наставленный для Царства Небесного». Греческое выражение допускает оттенки ученичества, наставления и направленности по отношению к Царству.'
    reason: alternative_reading
  - marker: b
    text: То есть глава и распорядитель домашнего хозяйства.
    reason: lexical_alternative
  - marker: c
    text: Греческое слово может означать как сокровище, так и место хранения ценностей — кладовую или сокровищницу.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Поэтому
  rationale: Естественно передаёт вывод из предшествующего разговора и сохраняет логическую связь.
- source_word: πᾶς γραμματεὺς
  choice: всякий книжник
  rationale: Прямое и исторически уместное соответствие γραμματεύς; оно не сужает значение до современного учителя права.
- source_word: μαθητευθεὶς
  choice: ставший учеником
  rationale: Пассивное причастие от μαθητεύω прежде всего связано с приобщением к ученичеству. Такая передача сохраняет образ ученика и не сводит смысл лишь к обучению навыкам.
- source_word: τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: ради Царства Небесного
  rationale: Необычный дательный указывает на направленность или отношение к Царству. «Ради» естественно выражает эту ориентацию, а неоднозначность отмечена в сноске.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: хозяину дома
  rationale: Современная и ясная передача главы и распорядителя домашнего хозяйства без архаического оттенка.
- source_word: ἐκβάλλει
  choice: выносит
  rationale: В данном контексте глагол означает извлечение хранимого наружу, а не насильственное изгнание.
- source_word: ἐκ τοῦ θησαυροῦ αὐτοῦ
  choice: из своей сокровищницы
  rationale: θησαυρός может обозначать как сокровище, так и место хранения ценностей; здесь пространственная конструкция с ἐκ естественно допускает «сокровищницу».
- source_word: καινὰ καὶ παλαιά
  choice: новое и старое
  rationale: Сохраняет греческий порядок и субстантивированность прилагательных, не уточняя, что именно подразумевается.
theological_decisions:
- issue: Смысл μαθητευθεὶς по отношению к книжнику и Царству
  choice: книжник, ставший учеником ради Царства Небесного
  alternative: книжник, наставленный для Царства Небесного; книжник, ставший учеником Царства Небесного
  rationale: Основной текст сохраняет выраженную глаголом μαθητεύω идею ученичества. Сноска удерживает возможный оттенок обучения и необычность связи с дательным падежом, не превращая фразу в утверждение о формальном образовании или обращении.
- issue: Образ οἰκοδεσπότης
  choice: хозяин дома
  alternative: глава семьи; домовладелец
  rationale: Передаёт хозяйственную власть персонажа в сравнении, не делая акцента ни на владении недвижимостью, ни исключительно на семейном статусе.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Книжник» и «Царство Небесное» сохранены как узнаваемые евангельские термины; синтаксис упрощён до естественной русской фразы без устранения смысловой неоднозначности.
