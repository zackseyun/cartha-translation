  text: Other seeds fell among the thorns[a], and the thorns came up and choked them.
translation:
  language: ru
  text: Другие семена упали среди колючек[a]. Колючки выросли и заглушили их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на колючки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: Другие семена
  rationale: Субстантивированное прилагательное среднего рода во множественном числе по контексту обозначает другие семена; существительное добавлено для ясности по-русски.
- source_word: δὲ
  choice: отдельно не выражено
  rationale: Частица служит мягкой связкой в последовательном рассказе; деление на два предложения естественно передаёт ход повествования без лишнего противительного оттенка.
- source_word: ἔπεσεν
  choice: упали
  rationale: Сохранено прямое значение πίπτω — «падать», а не более истолковывающее «были посеяны».
- source_word: ἐπὶ τὰς ἀκάνθας
  choice: среди колючек
  rationale: Хотя буквально возможно «на колючки», в земледельческом контексте «среди колючек» естественно обозначает место, куда упали семена; буквальная форма отмечена в сноске.
- source_word: ἀκάνθας / ἄκανθαι
  choice: колючки
  rationale: Слово охватывает колючую сорную растительность и позволяет естественно сохранить повтор исходного текста.
- source_word: ἀνέβησαν
  choice: выросли
  rationale: В данном контексте глагол описывает рост растений вверх; «выросли» ясно и естественно для современного русского языка.
- source_word: ἔπνιξαν
  choice: заглушили
  rationale: Обычное русское обозначение того, как сорные растения подавляют культурные; сохраняет образное значение πνίγω без неестественного буквального «задушили».
- source_word: αὐτά
  choice: их
  rationale: Местоимение среднего рода множественного числа относится к подразумеваемым семенам; русское «их» сохраняет местоименную отсылку.
