  source_fidelity: 'Текст точно передаёт последовательность греческого оригинала: после появления всходов и образования зерна сорняки стали видны. «Когда же … тогда» уместно выражает ὅτε δέ … τότε, а добавочное «и» сохраняет силу καί.'
