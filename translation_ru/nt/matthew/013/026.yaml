  text: ὅτε δὲ ἐβλάστησεν ὁ χόρτος καὶ καρπὸν ἐποίησεν, τότε ἐφάνη καὶ τὰ ζιζάνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/026.yaml
  text: But when the plants had sprouted and produced grain[a], then the weeds also appeared.
translation:
  language: ru
  text: Когда же всходы поднялись и дали зерно, тогда показались и сорняки[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плевелы»; возможно, имеется в виду плевел опьяняющий — сорное растение, внешне похожее на пшеницу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Когда же
  rationale: Передаёт временное значение ὅτε и мягкий связующий, слегка контрастный оттенок δέ естественной русской конструкцией.
- source_word: ἐβλάστησεν ὁ χόρτος
  choice: всходы поднялись
  rationale: В данном земледельческом контексте χόρτος обозначает выросшую посевную растительность, а ἐβλάστησεν — её появление и рост; выражение естественно по-русски и не создаёт образа обычной травы.
- source_word: καρπὸν ἐποίησεν
  choice: дали зерно
  rationale: Буквально «произвели плод»; в контексте пшеничного поля речь идёт об образовании зерна.
- source_word: τότε
  choice: тогда
  rationale: Прямо сохраняет временную последовательность исходного текста.
- source_word: ἐφάνη
  choice: показались
  rationale: Передаёт значение «стали видны, обнаружились» и согласуется во множественном числе с сорняками.
- source_word: καὶ τὰ ζιζάνια
  choice: и сорняки
  rationale: καί имеет добавочное значение, а ζιζάνια доступно передано общим словом без неоправданно точной ботанической идентификации.
theological_decisions:
- issue: Точная идентификация ζιζάνια
  choice: В основном тексте — «сорняки»
  alternative: «плевелы»; возможно, «плевел опьяняющий»
  rationale: Греческое слово обозначает вредное растение среди посева, но сам стих не требует точного определения вида. Общее современное слово сохраняет смысл, а традиционный и возможный ботанический варианты вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная и достойная повествовательная формулировка. «Всходы» точно соответствует полевому контексту, а «дали зерно» ясно передаёт созревание посева.
