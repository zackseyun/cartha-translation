  source_fidelity: «Стали приносить» придаёт ἐδίδου несвойственное ему начинательное значение («начали приносить»). Имперфект описывает приношение плода как процесс или повторяющееся/характерное действие; «приносили плод» передаёт это без добавления начала действия. Распределение «одни… другие… третьи» уместно соотнесено с «семенами» и сохраняет различие урожаев.
  naturalness: «А другие семена упали на добрую почву» звучит естественно в современном литературном русском. «Приносили плод» сохраняет сельскохозяйственный образ и библейски нейтральный регистр; двоеточие перед распределительным перечислением оправдано.
