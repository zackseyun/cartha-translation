  text: But other seed fell on the good soil and was producing fruit—one a hundredfold, another sixty, and another thirty.
translation:
  language: ru
  text: 'А другие семена упали на добрую почву и приносили плод: одни — во сто крат, другие — в шестьдесят крат, третьи — в тридцать крат.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и приносили плод: одно — во сто крат, другое — в шестьдесят крат, третье — в тридцать крат». Греческая распределительная конструкция может быть передана по-русски как «одни… другие… третьи» или как «одно… другое… третье».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: другие семена
  rationale: Субстантивированное прилагательное среднего рода множественного числа по контексту обозначает семена; существительное добавлено по-русски для ясности.
- source_word: δὲ
  choice: А
  rationale: Передаёт контраст с предшествующими случаями естественнее для современного русского повествования, чем более резкое «но».
- source_word: ἔπεσεν
  choice: упали
  rationale: Сохранено буквальное значение глагола «падать», а не введено подразумеваемое «были посеяны».
- source_word: ἐπὶ τὴν γῆν τὴν καλὴν
  choice: на добрую почву
  rationale: В земледельческом контексте γῆ естественно означает почву, а καλός — хорошую, пригодную и плодородную; «добрая почва» сохраняет достоинство и традиционную образность.
- source_word: ἐδίδου καρπόν
  choice: стали приносить урожай
  rationale: Имперфект передан как разворачивающееся действие; «урожай» ясно выражает буквальный земледельческий смысл καρπός и естественно сочетается с указанием кратности.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: одни — во сто крат, другие — в шестьдесят, третьи — в тридцать
  rationale: Русская распределительная конструкция естественно отражает греческое ὃ μὲν… ὃ δὲ… ὃ δὲ; «крат» делает явным подразумеваемое соотношение урожая к посеянному.
