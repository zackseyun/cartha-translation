  text: ἡλίου δὲ ἀνατείλαντος ἐκαυματίσθη καὶ διὰ τὸ μὴ ἔχειν ῥίζαν ἐξηράνθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/006.yaml
  text: But when the sun rose[a], it was scorched, and because it had no root, it withered away.
translation:
  language: ru
  text: Но когда взошло солнце, оно было опалено и, не имея корня, засохло.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡλίου δὲ ἀνατείλαντος
  choice: Но когда взошло солнце
  rationale: Родительный самостоятельный оборот передан естественным русским придаточным времени; δέ сохраняется как мягкое противопоставление посредством «но».
- source_word: ἐκαυματίσθη
  choice: оно было опалено
  rationale: Страдательная форма означает повреждение жаром; «опалено» естественно в образе растения и не усиливает смысл до полного сгорания.
- source_word: διὰ τὸ μὴ ἔχειν ῥίζαν
  choice: не имея корня
  rationale: Причинное значение διά с субстантивированным инфинитивом сохраняется деепричастным оборотом; единственное число ῥίζαν передано как «корня».
- source_word: ἐξηράνθη
  choice: засохло
  rationale: В контексте растения глагол обозначает высыхание и увядание; «засохло» кратко и естественно передаёт итог.
theological_decisions: []
