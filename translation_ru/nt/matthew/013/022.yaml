  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων, καὶ ἡ μέριμνα τοῦ αἰῶνος ⸀τούτου καὶ ἡ ἀπάτη τοῦ πλούτου συμπνίγει τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/022.yaml
  text: And the one sown among the thorns—this is the one who hears the word[a], but the चिंता of this age and the deceitfulness of wealth choke the word[b], and he becomes unfruitful.
translation:
  language: ru
  text: А посеянный среди терний — это тот, кто слышит слово, но заботы этого века[a] и обманчивость богатства[b] заглушают слово, и он не приносит плода.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заботы этого мира». Буквально: «забота этого века».'
    reason: Сохраняется знакомая контекстуальная передача αἰών и отмечается буквальная форма греческого выражения.
  - marker: b
    text: 'Или: «обман богатства».'
    reason: Указана более буквальная передача ἀπάτη τοῦ πλούτου.
lexical_decisions:
- source_word: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς
  choice: А посеянный среди терний
  rationale: Мужской род причастия с артиклем указывает в толковании притчи на человека, представленного посеянным семенем. «Среди терний» естественно передаёт образ и значение εἰς в данном контексте.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: тот, кто слышит слово
  rationale: Причастный оборот естественно передан относительным предложением; λόγος сохранено как «слово», то есть возвещаемая в притче весть.
- source_word: ἡ μέριμνα τοῦ αἰῶνος τούτου
  choice: заботы этого века
  rationale: μέριμνα обозначает тревожащие заботы; множественное число по-русски естественно выражает собирательный смысл. «Этот век» сохраняет временно-нравственный оттенок αἰών, не сводя его к физическому миру.
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: обманчивость богатства
  rationale: Формулировка передаёт не просто отдельный обман, а присущую богатству способность вводить человека в заблуждение.
- source_word: συμπνίγει
  choice: заглушают
  rationale: Глагол описывает, как тернии душат растение и не дают ему развиваться. «Заглушают» сохраняет сельскохозяйственный образ и естественно сочетается со «словом».
- source_word: ἄκαρπος γίνεται
  choice: он не приносит плода
  rationale: Естественная русская передача результата «становится бесплодным» сохраняет личный референт и образ плодоношения, избегая возможного современного понимания «бесплодный» как физиологически неспособный иметь детей.
theological_decisions:
- issue: Передача αἰών
  choice: этого века
  alternative: этого мира
  rationale: αἰών прежде всего обозначает век или эпоху и здесь допускает нравственный оттенок нынешнего порядка жизни. Знакомый вариант «этого мира» дан в примечании как контекстуально возможный.
- issue: Личный или безличный референт в заключении
  choice: он не приносит плода
  alternative: слово не приносит плода
  rationale: Толкование прямо отождествляет посеянное с тем, кто слышит слово; мужской род ἄκαρπος поддерживает личный референт. Такая передача не создаёт впечатления, будто само слово внутренне лишено плодотворности.
translation_notes:
  register: Современный литературный русский язык с сохранением образности притчи. Синтаксис ясный и достойный, без архаизмов; «обманчивость богатства» сохраняет богословскую напряжённость образа, а «не приносит плода» естественно передаёт личное применение метафоры.
