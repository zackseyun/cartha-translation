  text: On that day Jesus went out of the house and sat beside the sea[a][b].
translation:
  language: ru
  text: В тот день Иисус вышел из дома и сидел у моря[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «В тот же день», если выражение подчёркивает непосредственную связь с предшествующими событиями, а не только указывает время.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «возле моря». Греческое выражение указывает на место рядом с морем, не уточняя расстояние до берега.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: В тот день
  rationale: Естественное современное русское обозначение времени; сохраняет указание на день, не добавляя отсутствующего в греческом слова «самый».
- source_word: ἐξελθὼν ... τῆς οἰκίας
  choice: вышел из дома
  rationale: Аористное причастие передано естественной для русского языка последовательностью однородных сказуемых; родительный падеж обозначает место, из которого вышли.
- source_word: ἐκάθητο
  choice: сидел
  rationale: Имперфект передаёт продолжающееся, фоновое состояние; русское «сидел» естественно сохраняет этот видовой оттенок.
- source_word: παρὰ τὴν θάλασσαν
  choice: у моря
  rationale: Выражение обозначает положение возле моря, не уточняя расстояние до берега; «у моря» звучит естественно и не вносит лишней конкретики.
- source_word: ὁ Ἰησοῦς
  choice: Иисус
  rationale: Традиционная русская форма личного имени.
