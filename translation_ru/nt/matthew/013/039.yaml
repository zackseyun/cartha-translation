id: MAT.13.39
reference: Matthew 13:39
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ ἐχθρὸς ὁ σπείρας αὐτά ἐστιν ὁ διάβολος· ὁ δὲ θερισμὸς συντέλεια ⸀αἰῶνός ἐστιν, οἱ δὲ θερισταὶ ἄγγελοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/039.yaml
  text: And the enemy who sowed them is the devil; the harvest is the end of the age[a], and the harvesters are angels.
translation:
  language: ru
  text: А враг, посеявший их, — дьявол; жатва — завершение века[a], а жнецы — ангелы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «конец века»; традиционно: «конец мира».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχθρὸς
  choice: враг
  rationale: Прямой и естественный русский эквивалент, сохраняющий личное противостояние в объяснении притчи.
- source_word: ὁ σπείρας
  choice: посеявший
  rationale: Причастие передаёт завершённое действие и сохраняет земледельческий образ сеяния.
- source_word: αὐτά
  choice: их
  rationale: Местоимение естественно отсылает к ранее упомянутым плевелам.
- source_word: διάβολος
  choice: дьявол
  rationale: В данном контексте это устойчивое личное обозначение, а не характеристика «клеветник».
- source_word: θερισμός
  choice: жатва
  rationale: Обычное русское слово для сбора урожая, точно сохраняющее образ притчи.
- source_word: συντέλεια αἰῶνος
  choice: завершение века
  rationale: «Век» передаёт временной смысл αἰών, а «завершение» сохраняет оттенок кульминации и доведения периода до конца.
- source_word: θερισταί
  choice: жнецы
  rationale: Точный, понятный и образный русский эквивалент для тех, кто совершает жатву.
- source_word: ἄγγελοι
  choice: ангелы
  rationale: Эсхатологический контекст указывает на небесных существ, а не просто посланников.
- source_word: δέ
  choice: а / пунктуационное соединение
  rationale: Повторяющееся δέ обозначает последовательный переход между частями толкования; русское «а» естественно сохраняет структуру сопоставлений.
theological_decisions:
- issue: Передача αἰών в выражении συντέλεια αἰῶνος
  choice: завершение века
  alternative: конец мира; конец века
  rationale: «Век» не привносит в текст идею уничтожения материального мира, которой само слово αἰών не требует. «Завершение» передаёт не только прекращение, но и наступление предела, кульминации данного века; более традиционные варианты приведены в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством и краткостью исходного изречения. Сохранены параллельные именные конструкции и сельскохозяйственная образность; тире делает толкование ясным и естественным.
