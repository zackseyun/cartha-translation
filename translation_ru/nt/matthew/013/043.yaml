  text: Τότε οἱ δίκαιοι ἐκλάμψουσιν ὡς ὁ ἥλιος ἐν τῇ βασιλείᾳ τοῦ πατρὸς αὐτῶν. ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/043.yaml
  text: Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.
translation:
  language: ru
  text: Тогда праведные воссияют, как солнце, в Царстве их Отца. У кого есть уши, пусть услышит.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественно передаёт временную последовательность, связанную с предшествующим объяснением притчи.
- source_word: οἱ δίκαιοι
  choice: праведные
  rationale: Стандартное и ясное субстантивированное обозначение тех, кто признан праведным; сохраняет нравственный и заветный оттенки без уточняющего толкования.
- source_word: ἐκλάμψουσιν
  choice: воссияют
  rationale: Передаёт значение «ярко засияют, воссияют» и уместно сочетается с образом солнца; форма будущего времени сохранена.
- source_word: ὡς ὁ ἥλιος
  choice: как солнце
  rationale: Прямо и естественно сохраняет сравнение.
- source_word: ἐν τῇ βασιλείᾳ
  choice: в Царстве
  rationale: В данном местном обороте «Царство» естественнее, чем «царствование», и сохраняет эсхатологический образ сферы царской власти.
- source_word: τοῦ πατρὸς αὐτῶν
  choice: их Отца
  rationale: Точно сохраняет притяжательное значение греческого текста, не добавляя отсутствующего слова «Небесного».
- source_word: ὁ ἔχων ὦτα
  choice: У кого есть уши
  rationale: Естественный современный русский эквивалент единственного репрезентативного оборота; не ограничивает призыв лицами мужского пола.
- source_word: ἀκουέτω
  choice: пусть услышит
  rationale: Передаёт повелительное значение формы третьего лица и сохраняет смысл не просто физического восприятия, а внимательного принятия сказанного.
theological_decisions:
- issue: Репрезентативное единственное число в заключительном призыве
  choice: «У кого есть уши, пусть услышит»
  alternative: «Имеющий уши да слышит»
  rationale: Сохраняется единственное число и всеобщий характер призыва, но фраза звучит естественно для современного читателя и не создаёт ненужного впечатления, будто речь только о мужчине.
- issue: Значение βασιλεία в данном контексте
  choice: «Царство»
  alternative: «царствование»
  rationale: Предлог ἐν и образ пребывания праведных благоприятствуют пониманию как сферы царской власти; перевод не исключает динамического смысла Божьего правления.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. «Воссияют» сохраняет возвышенность и силу эсхатологического образа; заключительный призыв передан естественно, без архаического «да слышит».
