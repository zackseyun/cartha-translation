base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/014.yaml
  text: 'And in them the prophecy of Isaiah is fulfilled[a], which says: ‘You will indeed hear, but never understand, and seeing you will see, but never perceive.’'
translation:
  language: ru
  text: 'И на них исполняется пророчество Исаии, в котором сказано: «Слушая, будете слушать[a], но так и не поймёте; глядя, будете смотреть, но так и не увидите».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «слушая, будете слушать… и, глядя, будете смотреть» — переданное по-гречески семитское усилительное выражение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπληροῦται
  choice: исполняется
  rationale: Настоящее время и страдательное значение переданы естественной русской формой «исполняется»; она не усиливает глагол до «полностью исполняется» и сохраняет осуществление пророчества в этих людях.
- source_word: αὐτοῖς
  choice: на них
  rationale: Русская формула «на них исполняется пророчество» естественно передаёт дательный падеж и указывает, что пророчество осуществляется в их случае.
- source_word: προφητεία Ἠσαΐου ἡ λέγουσα
  choice: пророчество Исаии, в котором сказано
  rationale: Передаёт родительный оборот и атрибутивное причастие λέγουσα современным литературным русским языком.
- source_word: Ἀκοῇ ἀκούσετε
  choice: Слухом услышите
  rationale: Сохраняет семитскую усилительную конструкцию, воспроизведённую по-гречески, и риторическую связь с параллельной фразой.
- source_word: οὐ μὴ συνῆτε
  choice: но так и не поймёте
  rationale: «Так и не» передаёт усиленное отрицание οὐ μή, а «но» ясно выражает подразумеваемое противопоставление.
- source_word: βλέποντες βλέψετε
  choice: смотреть будете
  rationale: Передаёт продолженное зрительное действие без неестественного русского повтора «глядя, будете глядеть».
- source_word: οὐ μὴ ἴδητε
  choice: но так и не увидите
  rationale: Сохраняет обычное зрительное значение ἴδητε и усиленное отрицание, не вводя в основной текст толкование «не постигнете».
theological_decisions:
- issue: Характер исполнения пророчества
  choice: «на них исполняется»
  alternative: «ими полностью исполняется» или «на них лишь сбывается как пример»
  rationale: Формулировка утверждает исполнение пророчества в этих людях, но не определяет механизм ожесточения и не утверждает ни исчерпывающего завершения, ни простой иллюстрации.
- issue: Физическое зрение и внутреннее восприятие
  choice: «смотреть будете, но так и не увидите»
  alternative: «будете видеть, но так и не постигнете»
  rationale: Основной текст сохраняет образную неоднозначность и словесное напряжение греческого текста, не превращая подразумеваемое духовное восприятие в явное толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. Архаизирующее «слухом услышите» сохранено намеренно как узнаваемая и понятная усилительная формула; смысл пояснён в сноске.
