lexical_decisions:
- source_word: Πάλιν
  choice: Ещё
  rationale: Вводит следующее сравнение в ряду притч о Царстве; «ещё» естественно передаёт продолжение речи.
- source_word: ὁμοία ἐστὶν
  choice: подобно
  rationale: Краткая и привычная формула сравнения в притчах, точно передающая смысл греческого выражения.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Царство Небесное
  rationale: Устоявшаяся и естественная русская передача характерного для Матфея выражения, без неуместного буквального множественного числа «небес».
- source_word: ἀνθρώπῳ ἐμπόρῳ
  choice: купцу
  rationale: Существительное ἔμπορος уже обозначает человека; «купец» ясно и лаконично передаёт торговца, не создавая тяжеловесного повтора «человеку, купцу».
- source_word: ζητοῦντι
  choice: который ищет
  rationale: Придаточное предложение естественно звучит по-русски и сохраняет значение продолжающегося, целенаправленного поиска.
- source_word: καλοὺς μαργαρίτας
  choice: прекрасные жемчужины
  rationale: Прилагательное καλός здесь указывает на высокое качество и привлекательность жемчужин; «прекрасные» сохраняет эту широту, не сводя смысл исключительно к денежной ценности.
theological_decisions:
- issue: Объём сравнения в формуле притчи
  choice: Царство непосредственно уподобляется купцу.
  alternative: Царство уподобляется всей ситуации, в которой купец ищет прекрасные жемчужины.
  rationale: Греческая конструкция ὁμοία ἐστὶν ... ἀνθρώπῳ ἐμπόρῳ грамматически называет купца ближайшим предметом сравнения. Перевод не ограничивает этим дальнейший смысл всей приточной сцены.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная по тону. Традиционное «Царство Небесное» сохранено, а причастный оборот заменён естественным придаточным предложением.
