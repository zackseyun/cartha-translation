  text: Again[a], the kingdom of heaven is like a merchant seeking fine pearls.
translation:
  language: ru
  text: Ещё Царство Небесное подобно купцу[a], который ищет прекрасные жемчужины.
  philosophy: optimal-equivalence
  footnotes:
