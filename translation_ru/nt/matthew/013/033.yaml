base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/033.yaml
  text: 'He told them another parable: “The kingdom of heaven is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.”'
translation:
  language: ru
  text: 'Он рассказал им ещё одну притчу: «Царство Небесное подобно закваске[a], которую женщина взяла и спрятала[b] в трёх сатах муки[c], пока всё не заквасилось».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дрожжи». Греческое слово обозначает средство, которым заквашивают тесто.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вмешала», «смешала с мукой». Буквально: «спрятала».'
    reason: lexical_alternative
  - marker: c
    text: Сата — древняя мера сыпучих тел. Три саты составляли большой объём муки.
    reason: cultural_note
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς
  choice: Он рассказал им ещё одну притчу
  rationale: Естественно передаёт повествовательную формулу и добавочное значение ἄλλην без буквальной тяжеловесности.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Царство Небесное
  rationale: Устоявшаяся и точная русская передача характерного для Матфея семитизированного выражения во множественном числе.
- source_word: ζύμῃ
  choice: закваске
  rationale: «Закваска» обозначает средство заквашивания теста и сохраняет традиционную образность и нейтральность греческого слова.
- source_word: ἐνέκρυψεν εἰς
  choice: спрятала в
  rationale: Сохраняет буквальную силу глагола «скрывать, прятать внутри»; более бытовое «замесила» было бы истолковывающим.
- source_word: ἀλεύρου σάτα τρία
  choice: в трёх сатах муки
  rationale: Сохраняет конкретную древнюю меру оригинала; пояснение помогает современному читателю понять необычно большой объём.
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: пока не заквасилось всё
  rationale: Передаёт пассивный смысл ἐζυμώθη и нейтральное ὅλον, не добавляя отсутствующее в тексте существительное «тесто».
theological_decisions:
- issue: Смысловая окраска ζύμη в притче о Царстве
  choice: Передать нейтрально как «закваска», не задавая положительной или отрицательной оценки образа.
  alternative: Истолковать закваску отрицательно на основании её употребления в других местах либо заменить её словом «дрожжи», подчёркивая бытовую сторону образа.
  rationale: Сам текст подчёркивает скрытое воздействие закваски на всю массу, но не формулирует её нравственную оценку; перевод не должен заранее разрешать толковательную напряжённость.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Буквальный образ «спрятала» сохранён в основном тексте, а естественные кулинарные соответствия вынесены в примечание. Все маркеры примечаний стоят при соответствующих словах.
