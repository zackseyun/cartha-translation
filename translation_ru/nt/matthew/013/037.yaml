    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Он ответил
  rationale: Причастие ἀποκριθείς и личная форма εἶπεν вместе образуют обычную формулу введения ответа. По-русски естественно объединить их в «Он ответил», не воспроизводя избыточное «ответив, сказал».
- source_word: Ὁ σπείρων
  choice: Сеющий
  rationale: Субстантивированное причастие настоящего времени обозначает того, кто совершает действие. Форма «Сеющий» кратка, ясна в контексте объяснения притчи и сохраняет глагольный образ.
- source_word: τὸ καλὸν σπέρμα
  choice: доброе семя
  rationale: καλός здесь означает хорошее, годное семя, а не просто красивое. Единственное число сохраняет собирательный образ греческого текста.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Это устойчивое евангельское самообозначение Иисуса, перекликающееся с Дан 7. Традиционная русская форма остаётся понятной и сохраняет межтекстовый и богословский вес выражения.
theological_decisions:
- issue: Передача христологического наименования ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  alternative: Сын человека
  rationale: Основной вариант сохраняет закрепившееся в русской библейской речи наименование и его связь с образом из Дан 7, не сводя выражение к простому указанию на человеческую природу. Альтернатива точнее отражает обычное построение исходного словосочетания, но слабее передаёт узнаваемость титула.
translation_notes:
  register: Современный литературный русский язык с краткой и естественной формулой введения прямой речи. Традиционное христологическое наименование сохранено, а возможная более буквальная передача указана в сноске.
