reference: Matthew 13:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: παντὸς ἀκούοντος τὸν λόγον τῆς βασιλείας καὶ μὴ συνιέντος, ἔρχεται ὁ πονηρὸς καὶ ἁρπάζει τὸ ἐσπαρμένον ἐν τῇ καρδίᾳ αὐτοῦ· οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/019.yaml
  text: When anyone hears the word of the kingdom and does not understand it[a], the evil one comes and snatches away what has been sown in his heart[b]. This is the one sown beside the road.
translation:
  language: ru
  text: Когда кто-нибудь слышит слово о Царстве и не понимает его, приходит лукавый[a] и похищает посеянное в его сердце. Это тот, кто посеян у дороги[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «злой».'
    reason: Лексическая альтернатива для ὁ πονηρός; в данном контексте оба варианта относятся к личному злому противнику.
  - marker: b
    text: 'Или: «вдоль дороги», «при дороге».'
    reason: παρὰ τὴν ὁδόν допускает близкие пространственные формулировки; «дорога» может также обозначать тропу или путь.
lexical_decisions:
- source_word: παντὸς ἀκούοντος
  choice: ко всякому, кто слышит
  rationale: Родительный абсолют с πᾶς передан естественной для русского языка обобщающей конструкцией; она сохраняет значение «всякий, кто» и грамматически связывается с глаголом «приходит».
- source_word: λόγον τῆς βασιλείας
  choice: слово о Царстве
  rationale: λόγος сохраняется как «слово», поддерживая связь с образом семени, а родительный τῆς βασιλείας естественно раскрывается по-русски как указание на содержание вести — «о Царстве».
- source_word: μὴ συνιέντος
  choice: не понимает его
  rationale: συνίημι обозначает понимание смысла; местоимение «его» естественно отсылает к слову о Царстве.
- source_word: ὁ πονηρὸς
  choice: лукавый
  rationale: Субстантивированное прилагательное с артиклем обозначает личного злого противника. Традиционное русское «лукавый» кратко сохраняет личный характер выражения, не называя его точнее, чем исходный текст.
- source_word: ἁρπάζει
  choice: похищает
  rationale: Глагол передаёт резкое, насильственное отнятие; «похищает» сохраняет эту выразительность и звучит естественно.
- source_word: τὸ ἐσπαρμένον
  choice: посеянное
  rationale: Субстантивированное страдательное причастие среднего рода передано без добавления слова «семя», сохраняя образ и формальную неопределённость исходного текста.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: в его сердце
  rationale: Прямой перевод сохраняет библейский антропологический образ сердца и единственное число местоимения.
- source_word: οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς
  choice: Это тот, кто был посеян у дороги
  rationale: Сохранено необычное отождествление человека с посеянным, выраженное мужским причастием σπαρείς; «у дороги» естественно передаёт παρά с винительным в пространственном значении.
theological_decisions:
- issue: Личный или абстрактный смысл ὁ πονηρός
  choice: личный злой противник — «лукавый»
  alternative: абстрактное зло — «зло»
  rationale: Артикль, мужской род и действие «приходит и похищает» в данном контексте указывают на личного деятеля, однако перевод не уточняет его имя сверх сказанного в стихе.
- issue: Соотношение слушателя, семени и почвы в заключительной фразе
  choice: 'сохранить: «тот, кто был посеян у дороги»'
  alternative: разъяснить как «это семя, посеянное у дороги» или «это человек, подобный семени у дороги»
  rationale: Греческое мужское σπαρείς грамматически указывает на человека, хотя образ посева обычно относится к семени. Необычная метафорическая напряжённость сохранена, а не устранена пояснением.
- issue: Родовое значение αὐτοῦ
  choice: «в его сердце»
  alternative: «в сердце такого человека»
  rationale: Мужское единственное число исходного текста сохранено; обобщённость уже выражена словами «ко всякому, кто».
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. «Царство» написано с прописной буквы как краткое обозначение Божьего Царства. Синтаксис первой фразы слегка приподнят, но ясен; заключительная метафора намеренно оставлена необычной вслед за греческим текстом.
