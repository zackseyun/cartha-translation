  text: ⸀Συνήκατε ταῦτα πάντα; λέγουσιν αὐτῷ· ⸀Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/051.yaml
  text: Have you understood all these things? They said to him[a], “Yes.”
translation:
  language: ru
  text: '«Вы поняли всё это?» — спросил он. Они ответили ему: «Да».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνήκατε
  choice: Вы поняли
  rationale: Аорист изъявительного наклонения во вопросе обращён к достигнутому к этому моменту пониманию; русское «вы поняли» естественно передаёт это значение без излишнего толкования.
- source_word: ταῦτα πάντα
  choice: всё это
  rationale: Нейтральное и естественное русское соответствие сочетанию указательного местоимения с πᾶς; оно охватывает всё только что изложенное учение.
- source_word: λέγουσιν αὐτῷ
  choice: Они ответили
  rationale: Историческое настоящее передано прошедшим временем согласно нормам русского повествования. В данном диалоге «ответили» естественно выражает речевую реакцию, хотя буквально стоит «говорят ему».
- source_word: Ναί
  choice: Да
  rationale: Передан только утвердительный ответ, без добавления отсутствующего в греческом тексте обращения «Господи».
theological_decisions:
- issue: Следует ли расширять ответ учеников почтительным обращением
  choice: Сохранить простой ответ «Да»
  alternative: «Да, Господи»
  rationale: В SBLGNT присутствует только Ναί; добавление титула внесло бы в текст отсутствующий элемент.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Прямая речь оформлена естественно; вопросительный контекст позволяет передать λέγουσιν как «ответили». Синтаксис слегка перестроен ради ясного обозначения говорящего, без изменения содержания.
