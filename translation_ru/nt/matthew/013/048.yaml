  text: ἣν ὅτε ἐπληρώθη ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλὸν καὶ καθίσαντες συνέλεξαν τὰ καλὰ εἰς ⸀ἄγγη, τὰ δὲ σαπρὰ ἔξω ἔβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/048.yaml
  text: When it was filled[a], they pulled it up onto the shore, sat down, and gathered the good fish into containers[b], but threw the rotten ones out.
translation:
  language: ru
  text: Когда сеть наполнилась, её вытащили на берег, сели и собрали хорошую рыбу в ёмкости[a], а негодную[b] выбросили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «в сосуды». Греческое слово обозначает вместилища вообще, не обязательно корзины.
    reason: lexical_alternative
  - marker: b
    text: Или «испорченную», «гнилую». Греческое слово может обозначать как протухшую, так и вообще непригодную рыбу.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ὅτε ἐπληρώθη
  choice: Когда сеть наполнилась
  rationale: Местоимение ἣν отсылает к сети из предыдущего стиха. Повтор слова «сеть» делает отдельный стих ясным по-русски, а «наполнилась» прямо передаёт пассивную форму по естественным нормам русского языка.
- source_word: ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλόν
  choice: её вытащили на берег
  rationale: Оборот обозначает вытягивание сети из воды на сушу; «берег» не уточняет без основания, был ли он песчаным.
- source_word: καθίσαντες
  choice: сели
  rationale: Краткая личная форма естественно передаёт последовательность действий, выраженную аористным причастием.
- source_word: συνέλεξαν τὰ καλὰ
  choice: собрали хорошую рыбу
  rationale: Существительное «рыбу» подразумевается контекстом и необходимо для естественного русского выражения; «хорошую» сохраняет простую оценочную лексику оригинала.
- source_word: εἰς ἄγγη
  choice: в ёмкости
  rationale: ἄγγη — общее обозначение вместилищ; «ёмкости» не сужает значение до корзин или какой-либо определённой посуды.
- source_word: τὰ δὲ σαπρά
  choice: а негодную
  rationale: σαπρά может обозначать испорченную, гнилую или вообще непригодную рыбу. «Негодную» естественно противопоставляется «хорошей» и сохраняет широту значения.
- source_word: ἔξω ἔβαλον
  choice: выбросили
  rationale: Русский глагол естественно выражает значение «бросили вон» и силу отвержения без архаизации.
theological_decisions:
- issue: Толкование разделения улова в притче
  choice: Передать стих как конкретную сцену сортировки рыбы
  alternative: Использовать слова, прямо указывающие на последний суд
  rationale: В самом стихе дан образ притчи, а его богословское объяснение следует далее. Перевод не должен преждевременно подменять образ толкованием.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Формулировка сохраняет конкретный рыболовный образ, избегает архаизмов и не вносит в стих последующее истолкование притчи.
