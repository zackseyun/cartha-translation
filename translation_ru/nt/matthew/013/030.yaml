  text: ἄφετε συναυξάνεσθαι ἀμφότερα ⸀μέχρι τοῦ θερισμοῦ· καὶ ἐν καιρῷ τοῦ θερισμοῦ ἐρῶ τοῖς θερισταῖς· Συλλέξατε πρῶτον τὰ ζιζάνια καὶ δήσατε αὐτὰ εἰς δέσμας πρὸς τὸ κατακαῦσαι αὐτά, τὸν δὲ σῖτον ⸀συναγάγετε εἰς τὴν ἀποθήκην μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/030.yaml
  text: Let both grow together until the harvest[a], and at the time of harvest I will tell the reapers, ‘First collect the weeds and tie them into bundles to burn them, but gather the wheat into my storehouse.’
translation:
  language: ru
  text: 'Пусть и то и другое растёт вместе до жатвы[a], а во время жатвы я скажу жнецам: «Сначала соберите сорняки и свяжите их в пучки, чтобы сжечь их, а пшеницу соберите в мою житницу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сорняки — вероятно, плевел опьяняющий, внешне похожий на пшеницу; традиционно: «плевелы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε συναυξάνεσθαι ἀμφότερα
  choice: Пусть и то и другое растёт вместе
  rationale: Передаёт разрешительно-повелительный смысл ἄφετε, совместность роста в συναυξάνεσθαι и отнесённость ἀμφότερα к двум ранее названным видам растений.
- source_word: μέχρι τοῦ θερισμοῦ
  choice: до жатвы
  rationale: Естественно и точно обозначает предел совместного роста — определённое событие жатвы.
- source_word: ἐν καιρῷ τοῦ θερισμοῦ
  choice: во время жатвы
  rationale: Сохраняет значение установленного или подходящего времени, не утяжеляя русскую фразу.
- source_word: τοῖς θερισταῖς
  choice: жнецам
  rationale: Точный и понятный русский сельскохозяйственный термин.
- source_word: Συλλέξατε πρῶτον τὰ ζιζάνια
  choice: Сначала соберите сорняки
  rationale: Передаёт последовательность действий и использует доступное общее название вредных растений; более конкретная идентификация дана в сноске.
- source_word: δήσατε αὐτὰ εἰς δέσμας
  choice: свяжите их в пучки
  rationale: Сохраняет конкретное действие и результат, выраженный конструкцией с εἰς.
- source_word: πρὸς τὸ κατακαῦσαι αὐτά
  choice: чтобы сжечь
  rationale: Ясно передаёт цель; объект естественно подразумевается из предыдущей части и не нуждается в повторении по-русски.
- source_word: τὸν δὲ σῖτον συναγάγετε εἰς τὴν ἀποθήκην μου
  choice: а пшеницу соберите в мою житницу
  rationale: Противительный союз передан через «а»; «житница» точно обозначает хранилище зерна и сохраняет сельскохозяйственный образ.
theological_decisions:
- issue: Образ окончательного разделения в притче
  choice: Сохранить сельскохозяйственный образ без прямого упоминания суда или уничтожения.
  alternative: Истолковать образ прямо в тексте как окончательный суд или полное уничтожение.
  rationale: Сам Иисус объясняет притчу далее; здесь перевод должен передавать образ рассказа, не подменяя его последующим толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. «Жатва», «жнецы» и «житница» сохраняют цельный земледельческий образ и остаются понятными современному читателю.
