  text: ὁ δὲ ἔφη αὐτοῖς· Ἐχθρὸς ἄνθρωπος τοῦτο ἐποίησεν. οἱ δὲ ⸂δοῦλοι αὐτῷ λέγουσιν⸃· Θέλεις οὖν ἀπελθόντες ⸀συλλέξωμεν αὐτά;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/028.yaml
  text: He said to them[a], “An enemy did this.” Then the slaves said to him, “Do you want us to go and gather them up?”
translation:
  language: ru
  text: 'Он сказал им: «Это сделал враг». Тогда рабы[a] сказали ему: «Хочешь, мы пойдём и соберём их?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуги». Греческое слово δοῦλοι может обозначать рабов или слуг в зависимости от контекста.'
    reason: Лексическая альтернатива для социального термина δοῦλοι.
lexical_decisions:
- source_word: ἔφη
  choice: сказал
  rationale: Обычный глагол речи; простая форма прошедшего времени естественна для повествовательного диалога.
- source_word: Ἐχθρὸς ἄνθρωπος
  choice: враг
  rationale: Буквально сочетание означает «враждебный человек», однако в данном контексте ἄνθρωπος индивидуализирует действующее лицо; по-русски смысл естественно передаётся словом «враг».
- source_word: τοῦτο ἐποίησεν
  choice: это сделал
  rationale: Сохраняет указательное τοῦτο и естественно передаёт аорист как завершённое действие в прошлом.
- source_word: δοῦλοι
  choice: рабы
  rationale: В древнем хозяйственном контексте слово обозначает зависимых людей, принадлежащих господину; «рабы» яснее сохраняет их социальное положение. Более традиционное «слуги» дано в сноске.
- source_word: Θέλεις
  choice: Хочешь
  rationale: Прямая и естественная современная передача выражения желания или воли.
- source_word: οὖν
  choice: Тогда
  rationale: Здесь частица вводит следующий ход разговора, а не подчёркивает строгий логический вывод.
- source_word: ἀπελθόντες
  choice: мы пойдём
  rationale: Причастие обозначает действие, предшествующее собиранию; личная форма в русском естественно передаёт связь с последующим сослагательным вопросом.
- source_word: συλλέξωμεν
  choice: соберём
  rationale: Передаёт собирание сорняков с целью их удаления и хорошо сочетается с контекстом земледельческой притчи.
- source_word: αὐτά
  choice: их
  rationale: Местоимение среднего рода множественного числа отсылает к ранее упомянутым сорнякам; русское «их» сохраняет эту отсылку.
theological_decisions:
- issue: Передача δοῦλοι в притче
  choice: рабы
  alternative: слуги
  rationale: Основной вариант сохраняет реальное социальное положение зависимых людей в древнем доме. Слово «слуги» возможно по контексту и привычно в церковной традиции, поэтому оно отмечено в сноске без изменения смысла притчи.
translation_notes:
  register: Современный литературный русский язык с простой, dignified повествовательной речью. Формулировка вопроса сделана естественной для живого диалога; историческая социальная реальность сохранена словом «рабы».
