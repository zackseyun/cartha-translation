  text: ὁ δὲ ἀποκριθεὶς εἶπεν ⸀αὐτοῖς· Ὅτι ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν, ἐκείνοις δὲ οὐ δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/011.yaml
  text: He answered them[a], “To you it has been given to know the mysteries of the kingdom of heaven[b], but to them it has not been given.”
translation:
  language: ru
  text: 'Он ответил им: «Вам дано[a] знать тайны Царства Небесного, а им не дано».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Пассивная форма «дано» не называет дарителя; здесь может подразумеваться Бог.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ответил
  rationale: Обычная греческая конструкция с причастием и личной формой глагола передаётся одним естественным русским глаголом без тяжеловесного «отвечая, сказал».
- source_word: ὑμῖν δέδοται γνῶναι
  choice: вам дано знать
  rationale: Сохраняются дательный получателя, пассивная форма и значение γινώσκω; совершенный вид греческого глагола указывает на дарованное состояние, естественно выражаемое по-русски конструкцией «дано знать».
- source_word: τὰ μυστήρια
  choice: тайны
  rationale: «Тайны» естественно и точно обозначает прежде сокрытые, а теперь открываемые Богом истины; «мистерии» в современном русском языке внесло бы посторонние культовые ассоциации.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: Небесного Царства
  rationale: Это естественная русская передача характерного для Матфея выражения; она сохраняет связь царства с небесами, не воспроизводя неидиоматично греческое множественное число.
- source_word: ἐκείνοις δὲ οὐ δέδοται
  choice: а им не дано
  rationale: Краткая параллельная конструкция ясно противопоставляет адресатов другой группе и сохраняет повтор пассивного δέδοται.
theological_decisions:
- issue: Подразумеваемый деятель в δέδοται
  choice: Сохранить безлично-пассивное «дано», не называя Бога прямо
  alternative: «Бог дал вам»
  rationale: Хотя подразумеваемым дарителем, вероятнее всего, является Бог, греческий текст его не называет. Пассив сохраняет формулировку и богословское напряжение оригинала.
- issue: Смысл μυστήρια
  choice: «тайны»
  alternative: «сокровенные истины»
  rationale: «Тайны» сохраняет широкую библейскую категорию открываемых божественных истин и не сужает значение поясняющим толкованием.
translation_notes:
  register: Современный литературный русский язык, краткий и достоинственный. Инверсия «вам дано» подчёркивает контраст с «им не дано». Прописные буквы в «Небесном Царстве» используются как традиционно уместное обозначение Божьего царства.
