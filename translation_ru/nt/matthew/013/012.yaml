id: MAT.13.12
reference: Matthew 13:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἔχει, δοθήσεται αὐτῷ καὶ περισσευθήσεται· ὅστις δὲ οὐκ ἔχει, καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/012.yaml
  text: For whoever has[a], more will be given to him, and he will have an abundance; but whoever does not have[b], even what he has will be taken from him.
translation:
  language: ru
  text: Ведь тому, кто имеет, будет дано, и будет у него в изобилии; а у того, кто не имеет, будет отнято даже то, что он имеет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις
  choice: тому, кто / у того, кто
  rationale: Неопределённое относительное местоимение выражает общий принцип. Русская конструкция «тот, кто» естественно сохраняет единственное число и обобщающий смысл.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит пояснение к предыдущей мысли; «ведь» естественно передаёт эту связь в современном русском языке.
- source_word: ἔχει
  choice: имеет
  rationale: Объект оставлен невыраженным, как и в греческом тексте, чтобы не сужать смысл до понимания, восприимчивости или знания тайн Царства.
- source_word: δοθήσεται αὐτῷ
  choice: тому… будет дано
  rationale: Будущее страдательное δίδωμι передано прямо. В отличие от английского консультационного текста, слово «больше» не добавлено, поскольку в греческом оно отсутствует; на увеличение указывает следующая фраза.
- source_word: περισσευθήσεται
  choice: будет у него в изобилии
  rationale: Форма передаёт состояние изобилия или избытка. Выражение звучит естественнее, чем буквальное «он будет изобиловать», и не вводит конкретный объект.
- source_word: δὲ
  choice: а
  rationale: Частица обозначает контраст. В симметричной русской пословичной конструкции «а» звучит естественно и достаточно ясно противопоставляет две части.
- source_word: καὶ ὃ ἔχει
  choice: даже то, что он имеет
  rationale: καί имеет усилительное значение «даже», подчёркивая парадокс второй части.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: у того… будет отнято
  rationale: Будущее страдательное αἴρω с ἀπό обозначает лишение или удаление; русская конструкция «у него будет отнято» ясно и идиоматично передаёт смысл.
- source_word: αὐτῷ / αὐτοῦ
  choice: у него / у того
  rationale: Сохранено грамматическое единственное число и репрезентативный мужской род исходной общей формулировки.
theological_decisions:
- issue: Неуказанный объект глагола «иметь»
  choice: Объект не назван.
  alternative: 'Уточнить: «имеет понимание», «имеет восприимчивость» или «имеет знание тайн Царства».'
  rationale: Контекст связывает изречение с восприятием учения Иисуса и тайн Царства, однако греческий текст оставляет объект подразумеваемым. Перевод сохраняет эту намеренную широту.
- issue: Подразумеваемое дополнение при «будет дано»
  choice: Не добавлять «больше».
  alternative: «Будет дано больше».
  rationale: «Больше» хорошо раскрывает смысл, но не выражено отдельным словом в греческом тексте. Последующее περισσευθήσεται уже передаёт нарастание до изобилия, поэтому основной текст может следовать форме источника без потери смысла.
- issue: Обобщающий мужской род
  choice: 'Сохранить единственное число: «тому, кто… у того, кто… он».'
  alternative: Перейти к множественному числу или повторить нейтральное «человек».
  rationale: Греческая конструкция грамматически оформлена в единственном числе и имеет обобщающее значение. Русский мужской род здесь также естественно выполняет родовую функцию.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным ритмом. Синтаксический параллелизм двух частей сохранён; архаизмы и конфессионально окрашенные уточнения не использованы.
