  text: Καὶ προσελθόντες οἱ μαθηταὶ εἶπαν αὐτῷ· Διὰ τί ἐν παραβολαῖς λαλεῖς αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/010.yaml
  text: Then the disciples came up and said to him[a], “Why do you speak to them in parables?”
translation:
  language: ru
  text: 'Тогда ученики подошли и сказали Ему: «Почему Ты говоришь с ними притчами?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Тогда
  rationale: В данном контексте союз продвигает повествование вперёд; «тогда» естественно передаёт последовательность событий, не добавляя нового содержания.
- source_word: προσελθόντες
  choice: подошли
  rationale: Аористное причастие προσέρχομαι обозначает, что ученики приблизились к Иисусу перед тем, как заговорить; русское «подошли» точно и естественно выражает это движение.
- source_word: οἱ μαθηταὶ
  choice: ученики
  rationale: Артикль указывает на уже известных из контекста учеников. Местоимение «Его» не добавлено, поскольку в греческом тексте оно отсутствует.
- source_word: εἶπαν αὐτῷ
  choice: сказали Ему
  rationale: Сохранено основное значение λέγω — «сказать», хотя прямая речь имеет форму вопроса. Такой оборот естественен по-русски и близок к оригиналу.
- source_word: Διὰ τί
  choice: Почему
  rationale: Прямой и современный русский эквивалент вопросительного выражения со значением причины.
- source_word: ἐν παραβολαῖς
  choice: притчами
  rationale: Предлог ἐν с дательным здесь обозначает способ или форму речи. Творительный падеж «притчами» естественно передаёт это значение по-русски.
- source_word: λαλεῖς
  choice: Ты говоришь
  rationale: Форма настоящего времени передана обычным русским настоящим временем; местоимение добавлено ради ясной структуры прямого вопроса.
- source_word: αὐτοῖς
  choice: с ними
  rationale: В русском сочетание «говорить с ними» естественно обозначает обращение к аудитории. Возможное «им» формально ближе к дательному, но менее идиоматично в данном вопросе.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Обращённые к Иисусу местоимения написаны с прописной буквы как устойчивое русское издательское почтительное оформление; это не вносит отдельного богословского толкования. Синтаксис сохраняет повествовательную последовательность и прямой вопрос оригинала.
