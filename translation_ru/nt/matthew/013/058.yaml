  text: καὶ οὐκ ἐποίησεν ἐκεῖ δυνάμεις πολλὰς διὰ τὴν ἀπιστίαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/058.yaml
  text: And he did not do many mighty works there because of their unbelief[a].
translation:
  language: ru
  text: И не совершил Он там многих могущественных дел из-за их неверия[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «многих чудес»; или: «многих проявлений силы». Греческое слово обозначает деяния, в которых проявляется сила, и в данном контексте указывает на чудеса.'
    reason: Лексическая альтернатива для δυνάμεις, сохраняющая диапазон значений между «могущественными делами», «чудесами» и «проявлениями силы».
lexical_decisions:
- source_word: καὶ οὐκ ἐποίησεν
  choice: И не совершил Он
  rationale: καί продолжает повествование, οὐκ отрицает совершённое действие, а ἐποίησεν передано естественным русским глаголом «совершил». Формулировка не привносит значения неспособности.
- source_word: ἐκεῖ
  choice: там
  rationale: Прямое обозначение места, отсылающее к месту действия в ближайшем контексте.
- source_word: δυνάμεις πολλὰς
  choice: многих могущественных дел
  rationale: Во множественном числе δύναμις в евангельском контексте обозначает проявления силы, то есть чудесные деяния. «Могущественные дела» сохраняет связь слова с силой и не сводит его сразу к толковательному «чудеса»; форма родительного падежа обусловлена отрицанием.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: из-за их неверия
  rationale: διά с винительным падежом выражает причину. ἀπιστία прямо обозначает неверие или отсутствие веры; «неверие» сохраняет отрицательную силу существительного и соответствует контексту отвержения.
theological_decisions:
- issue: Говорит ли стих о неспособности совершить чудеса или о том, что они не были совершены
  choice: «не совершил Он там» — утверждение о несовершении действия
  alternative: «не мог совершить там» — утверждение о неспособности
  rationale: В греческом тексте стоит οὐκ ἐποίησεν («не совершил»), а не выражение невозможности. Перевод сохраняет формулировку Матфея и не снимает богословское напряжение толковательным уточнением.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Постпозиция местоимения «Он» придаёт фразе плавность и умеренную возвышенность; заглавная буква следует принятой русской традиции обозначения Иисуса в библейском тексте.
