  source_fidelity: 'Текст точно передаёт все смысловые элементы греческого оригинала: Иисус представляет ещё одну притчу слушателям; сохранены формула сравнения, «Царство Небесное», горчичное зерно, действие человека («взял и посеял») и принадлежность поля этому человеку. «На своём поле» — нормативная русская сельскохозяйственная формулировка для ἐν τῷ ἀγρῷ αὐτοῦ.'
