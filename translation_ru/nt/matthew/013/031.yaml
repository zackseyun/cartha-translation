id: MAT.13.31
reference: Matthew 13:31
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔσπειρεν ἐν τῷ ἀγρῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/031.yaml
  text: He set another parable before them, saying, “The kingdom of heaven is like a mustard seed, which a man took and sowed in his field.”
translation:
  language: ru
  text: 'Другую притчу Он предложил им, сказав: «Царство Небесное подобно горчичному зерну, которое человек взял и посеял на своём поле».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέθηκεν
  choice: предложил
  rationale: Глагол здесь означает представить или изложить притчу перед слушателями; «предложил им притчу» естественно передаёт этот смысл по-русски.
- source_word: παραβολὴν
  choice: притчу
  rationale: Устоявшийся и точный русский термин для παραβολή в контексте синоптического учения.
- source_word: Ὁμοία ἐστὶν
  choice: подобно
  rationale: Естественная русская формула сравнения, сохраняющая прямую связь между Царством и образом зерна.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Царство Небесное
  rationale: Устоявшаяся русская передача характерного для Матфея выражения, допускающая смысл как царствования, так и сферы Божьего владычества.
- source_word: κόκκῳ σινάπεως
  choice: горчичному зерну
  rationale: Ясная и традиционная передача названия малого семени в данном сравнении.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: которое человек взял
  rationale: Сохраняет отдельное упоминание действия «взял» и неопределённого участника притчи без излишнего уточнения его личности.
- source_word: ἔσπειρεν
  choice: посеял
  rationale: Точно передаёт сельскохозяйственное значение σπείρω применительно к семени.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: на своём поле
  rationale: В русском языке семя обычно сеют «на поле»; возвратное «своём» недвусмысленно относит поле к действующему лицу.
theological_decisions:
- issue: Передача выражения βασιλεία τῶν οὐρανῶν
  choice: Царство Небесное
  alternative: небесное царствование; Царство небес
  rationale: Устоявшаяся формулировка сохраняет богословскую широту выражения и не сводит его только к отвлечённому акту правления или к месту пребывания.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Порядок слов слегка выровнен ради естественности; местоимение «Он» написано с прописной буквы согласно распространённой русской библейской издательской норме.
