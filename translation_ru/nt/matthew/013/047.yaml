  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν σαγήνῃ βληθείσῃ εἰς τὴν θάλασσαν καὶ ἐκ παντὸς γένους συναγαγούσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/047.yaml
  text: Again[b][a], the kingdom of heaven is like a dragnet cast into the sea and gathering from every kind.
translation:
  language: ru
  text: 'И ещё: Царство Небесное подобно неводу[a], закинутому в море и собирающему рыбу всякого рода[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рыболовной сети»; греческое слово точнее обозначает большой невод — протяжную рыболовную сеть.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «собирающему из всякого рода»; слово «рыбу» подразумевается образом рыбной ловли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: Ещё
  rationale: Наречие вводит следующую притчу в ряду; «ещё» естественно и кратко передаёт повторное присоединение.
- source_word: ὁμοία ἐστὶν
  choice: подобно
  rationale: Обычная и понятная сравнительная формула, сохраняющая образный характер высказывания.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Царство Небесное
  rationale: Сохраняет характерное для Матфея выражение, не заменяя его толкованием «Царство Божье».
- source_word: σαγήνῃ
  choice: неводу
  rationale: Греческое слово обозначает большую протяжную рыболовную сеть; «невод» точнее общего слова «сеть» и естественен по-русски.
- source_word: βληθείσῃ εἰς τὴν θάλασσαν
  choice: закинутому в море
  rationale: «Закинуть невод» — естественное русское сочетание, точно передающее пассивное причастие и направление действия.
- source_word: ἐκ παντὸς γένους συναγαγούσῃ
  choice: собравшему всякого рода
  rationale: Сохраняет отсутствие явного дополнения в греческом тексте и его формулировку «из/от всякого рода», при этом по-русски контекст улова остаётся понятным.
theological_decisions:
- issue: Значение выражения «Царство Небесное»
  choice: Сохранить матфеевское «Царство Небесное»
  alternative: Царство Божье; небесное правление
  rationale: Перевод сохраняет авторскую формулу, не устраняя её особенности и не подменяя её богословским парафразом.
translation_notes:
  register: Современный литературный русский язык с традиционно узнаваемым библейским выражением «Царство Небесное». Синтаксис сохраняет сжатость греческой приточной формулы; редкое, но понятное слово «невод» уточнено в сноске.
