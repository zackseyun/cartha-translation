id: MAT.13.24
reference: Matthew 13:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ ⸀σπείραντι καλὸν σπέρμα ἐν τῷ ἀγρῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/024.yaml
  text: He set another parable before them[a], saying, “The kingdom of heaven is like a man who sowed good seed in his field.”
translation:
  language: ru
  text: 'Он предложил им другую притчу, сказав: «Царство Небесное подобно человеку, посеявшему доброе семя на своём поле».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄλλην παραβολὴν
  choice: другую притчу
  rationale: ἄλλην вводит следующую, дополнительную притчу; по-русски естествен порядок «другую притчу».
- source_word: παρέθηκεν αὐτοῖς
  choice: предложил им
  rationale: παρατίθημι здесь означает представить или изложить слушателям; «предложил им» естественно передаёт введение нового поучения без излишней буквальности.
- source_word: λέγων
  choice: сказав
  rationale: Деепричастие сохраняет связь причастия с вводным глаголом и естественно предваряет прямую речь.
- source_word: Ὡμοιώθη
  choice: подобно
  rationale: В формуле, вводящей притчу, аорист пассива естественно передаётся по-русски настоящим временем сравнения; буквальное «было уподоблено» звучало бы тяжеловесно и могло бы создать ложный акцент на действующем лице.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Царство Небесное
  rationale: Устоявшееся и ясное русское соответствие характерному для Матфея выражению, сохраняющее его богословскую значимость.
- source_word: ἀνθρώπῳ σπείραντι
  choice: человеку, посеявшему
  rationale: Дательный после ὁμοιόω обозначает предмет сравнения, а аористное причастие — совершённое действие этого человека.
- source_word: καλὸν σπέρμα
  choice: доброе семя
  rationale: Передаёт качественную положительную характеристику семени и сохраняет словесное противопоставление сорнякам в дальнейшем повествовании.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: на своём поле
  rationale: Русское «на поле» идиоматично для посева; возвратное «своём» ясно относит поле к сеятелю.
theological_decisions:
- issue: Передача формулы Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν
  choice: Царство Небесное подобно
  alternative: Царство Небесное было уподоблено
  rationale: Выбранная формулировка естественно вводит сравнение и не превращает грамматический пассив в отдельное богословское утверждение о том, кто и когда уподобил Царство.
- issue: Объём сравнения в притче
  choice: подобно человеку, посеявшему доброе семя
  alternative: подобно ситуации, в которой человек посеял доброе семя
  rationale: Сохранена грамматическая привязка сравнения к ἀνθρώπῳ, без преждевременного расширения или истолкования того, с чем именно сопоставляется Царство.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис близок к греческому, но не калькирован; традиционное «Царство Небесное» сохранено.
