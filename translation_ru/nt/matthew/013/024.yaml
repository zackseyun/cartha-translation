  source_fidelity: 'Текст точно передаёт греческий оригинал: Ἄλλην παραβολὴν — «другую притчу», παρέθηκεν αὐτοῖς — «предложил им», а сравнение Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ... ἀνθρώπῳ σπείραντι передано естественной русской формулой «Царство Небесное подобно человеку, посеявшему...». «На своём поле» идиоматично передаёт ἐν τῷ ἀγρῷ αὐτοῦ.'
  naturalness: Современный литературный русский, ясный и благозвучный. Формула «Царство Небесное подобно» имеет уместный возвышенно-библейский регистр, не являясь неестественной калькой. «Доброе семя» сохраняет литературно-библейскую связь с последующим противопоставлением и понятно в современном употреблении.
  terminology: «Царство Небесное» последовательно и точно передаёт характерное матфеевское ἡ βασιλεία τῶν οὐρανῶν. Выбор не навязывает истолкования аористного пассива Ὡμοιώθη и сохраняет функцию притчевой формулы. В сличении с английским аудит-трейлом русское «подобно» обоснованно соответствует допустимому «is like», а не спорному буквальному «has become like».
