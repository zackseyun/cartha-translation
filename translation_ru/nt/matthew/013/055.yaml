base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/055.yaml
  text: Is this not the carpenter’s son? Is not his mother called Mary[b][a], and his brothers James and Joseph and Simon and Judas?
translation:
  language: ru
  text: Разве Он не сын плотника? Разве Его мать не Мария, а Его братья[a] — Иаков, Иосиф[b], Симон и Иуда?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родственники», «родичи». Греческое слово обычно означает «братья», но некоторые понимают его здесь в более широком смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых рукописях: «Иосия» вместо «Иосиф».'
    reason: textual_variant
lexical_decisions:
- source_word: τέκτονος
  choice: плотника
  rationale: Греческое τέκτων обозначает ремесленника, работавшего прежде всего с деревом и в строительстве. «Плотник» — естественный и традиционный русский эквивалент в данном контексте, хотя исходное слово может иметь более широкое значение.
- source_word: υἱός
  choice: сын
  rationale: Непосредственный семейный контекст однозначно указывает на обычное значение родства.
- source_word: λέγεται
  choice: зовут
  rationale: Настоящая пассивная форма здесь употреблена в значении «называют, зовут»; «зовут» естественно звучит по-русски и сохраняет смысл греческой конструкции.
- source_word: Μαριὰμ
  choice: Марией
  rationale: Использована закрепившаяся в русском языке форма имени «Мария»; падеж обусловлен конструкцией «зовут Марией».
- source_word: ἀδελφοὶ
  choice: братьев
  rationale: Обычное значение слова — «братья». Более широкое понимание как родственников не внесено в основной текст, чтобы перевод не разрешал давний богословский спор; оно отмечено в сноске.
- source_word: Ἰάκωβος
  choice: Иаковом
  rationale: «Иаков» — традиционная и общепринятая русская форма этого новозаветного имени; творительный падеж продолжает подразумеваемое «зовут».
- source_word: Ἰωσὴφ
  choice: Иосифом
  rationale: Основной текст SBLGNT читает Ἰωσήφ, которому соответствует русская форма «Иосиф». Разночтение отмечено в сноске.
- source_word: Σίμων
  choice: Симоном
  rationale: «Симон» — стандартная русская передача имени; творительный падеж соответствует конструкции перечисления имен.
- source_word: Ἰούδας
  choice: Иудой
  rationale: «Иуда» — стандартная русская передача греческого имени Ἰούδας; форма творительного падежа — «Иудой».
- source_word: οὐχ ... ;
  choice: Разве ... не ...? Разве ... не ...?
  rationale: Частица вводит риторические вопросы, предполагающие утвердительный ответ. Конструкция с «разве не» естественно передает это ожидание в современном русском языке.
theological_decisions:
- issue: Значение ἀδελφοὶ αὐτοῦ применительно к семье Иисуса
  choice: 'В основном тексте переведено буквально: «Его братьев»'
  alternative: «Его родственников» или «Его родичей»
  rationale: Наиболее обычное лексическое значение ἀδελφοί — «братья». Перевод не должен предрешать вопрос об их точной степени родства с Иисусом или привносить позицию в споре о приснодевстве Марии. Более широкая возможность значения сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясной риторической структурой. Заглавные местоимения по отношению к Иисусу сохранены как принятая в русском библейском стиле уважительная норма. Эллиптическая конструкция «а Его братьев — Иаковом...» подразумевает повторение глагола «зовут» и позволяет близко передать структуру исходного текста без тяжеловесности.
