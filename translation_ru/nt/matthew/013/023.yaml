base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/023.yaml
  text: But the one sown on the good soil—this is the one who hears the word and understands it[a], who indeed bears fruit and produces, in one case a hundred, in another sixty[b], and in another thirty.
translation:
  language: ru
  text: 'А посеянный на доброй почве — это тот, кто слышит слово и понимает его. Он-то и приносит плод и даёт урожай: в одном случае — сто, в другом — шестьдесят, в третьем — тридцать[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «один — сто, другой — шестьдесят, а третий — тридцать»; речь идёт о различной величине урожая. В контексте эти числа могут пониматься как урожай во сто, шестьдесят и тридцать раз больше посеянного.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τὴν καλὴν γῆν
  choice: на хорошей почве
  rationale: В земледельческом контексте γῆ обозначает почву, принимающую семя; καλὴν передано как «хорошей», то есть пригодной и плодородной, без внесения отдельной нравственной оценки.
- source_word: σπαρείς
  choice: посеянный
  rationale: Аористное страдательное причастие сохранено, как и намеренный переход притчи от образа семени к человеку, которого оно представляет.
- source_word: ὁ τὸν λόγον ἀκούων καὶ συνιείς
  choice: тот, кто слышит слово и понимает его
  rationale: Настоящие причастия выражают характерный отклик. «Слово» сохраняет устойчивый евангельский образ, а местоимение «его» естественно восполняет подразумеваемое дополнение при «понимает».
- source_word: δὴ
  choice: Он-то и
  rationale: Частица δή придаёт утверждению подчёркнутый характер; русская конструкция с «-то» передаёт это ударение естественно и без чрезмерного усиления.
- source_word: καρποφορεῖ καὶ ποιεῖ
  choice: приносит плод и даёт урожай
  rationale: Сохранены два греческих глагола. «Даёт урожай» раскрывает сельскохозяйственное значение ποιεῖ в данном контексте и не смешивает его с предшествующим «приносит плод».
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: один — во сто крат, другой — в шестьдесят, а третий — в тридцать
  rationale: Распределительная конструкция указывает на различную урожайность. Оборот «во ... крат» естественно выражает подразумеваемое соотношение урожая с посеянным, при этом буквальная форма пояснена в сноске.
theological_decisions:
- issue: Характер отклика на слово в притче
  choice: Слушающий слышит, понимает и приносит плод в различной мере.
  alternative: Явно истолковать плодоношение как стойкость, истинное обращение или доказательство возрождения.
  rationale: Греческий текст называет слышание, понимание и плодоношение, но не формулирует более поздние догматические категории. Перевод сохраняет собственные категории стиха и не разрешает богословский вопрос за автора.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Метафора сеяния и плодоношения сохранена; несколько необычное «посеянный ... тот, кто» намеренно отражает переход греческого текста от семени к человеку. Разбиение на два предложения делает длинную греческую конструкцию естественной по-русски, не меняя её смысловых связей.
