  text: Τότε ἀφεὶς τοὺς ὄχλους ἦλθεν εἰς τὴν ⸀οἰκίαν. καὶ προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ λέγοντες· ⸀Διασάφησον ἡμῖν τὴν παραβολὴν τῶν ζιζανίων τοῦ ἀγροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/036.yaml
  text: Then[a], after leaving the crowds, he went into the house. And his disciples came to him, saying, “Explain to us the parable of the weeds of the field.”
translation:
  language: ru
  text: 'Тогда, оставив народ, Он вошёл в дом. К Нему подошли ученики и сказали: «Объясни нам притчу о сорняках на поле».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «притчу о плевелах на поле». Греческое слово, вероятно, обозначает плевел — сорное растение, внешне похожее на пшеницу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественный временной указатель, связывающий событие с предыдущим повествованием.
- source_word: ἀφεὶς τοὺς ὄχλους
  choice: оставив народ
  rationale: Аористное причастие передаёт действие, предшествующее входу в дом; собирательное «народ» естественно обозначает собравшиеся толпы в современном русском.
- source_word: ἦλθεν εἰς τὴν οἰκίαν
  choice: Он вошёл в дом
  rationale: Передаёт направленное движение внутрь и звучит естественнее буквального «пришёл в дом».
- source_word: προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ
  choice: К Нему подошли ученики
  rationale: «Подошли» точно передаёт προσέρχομαι; принадлежность учеников Иисусу ясна из местоимения «Нему» и контекста, поэтому повторное «Его» по-русски необязательно.
- source_word: λέγοντες
  choice: и сказали
  rationale: Сочинённая глагольная конструкция естественно передаёт греческое причастие речи в русском повествовании.
- source_word: Διασάφησον ἡμῖν
  choice: Объясни нам
  rationale: Точно и современно передаёт просьбу сделать смысл ясным.
- source_word: τὴν παραβολὴν
  choice: притчу
  rationale: Устоявшийся и точный русский эквивалент евангельского παραβολή.
- source_word: τῶν ζιζανίων τοῦ ἀγροῦ
  choice: о сорняках на поле
  rationale: Естественная русская передача предмета притчи; ζιζάνια обозначает вредные сорные растения, вероятно плевелы.
