  verdict: approve
  source_fidelity: 'Текст точно передаёт последовательность событий и основные смысловые элементы греческого оригинала: временной переход «Тогда», предшествующее оставление собравшихся, вход в дом, приближение учеников и их просьбу объяснить притчу. «Народ» допустимо передаёт τοὺς ὄχλους как собирательное обозначение присутствующих толп; «на поле» — естественная русская передача связи ζιζανίων с полем.'
