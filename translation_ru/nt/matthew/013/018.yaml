base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/018.yaml
  text: You[a], then, hear the parable of the one who sowed.
translation:
  language: ru
  text: Итак, вы послушайте притчу о сеятеле[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «притчу о том, кто сеял».'
    reason: Греческое τοῦ σπείραντος — субстантивированное причастие аориста, а не существительное со значением закреплённого наименования.
lexical_decisions:
- source_word: Ὑμεῖς
  choice: вы
  rationale: Личное местоимение в греческом выражено явно и несёт смысловое ударение; в русском оно сохранено, хотя при повелительном наклонении могло бы быть опущено.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод или переход, связывающий повеление с предшествующими словами Иисуса.
- source_word: ἀκούσατε
  choice: послушайте
  rationale: Сохраняет значение повелительной формы глагола ἀκούω и не подменяет «слушать» более толковательным «понимать».
- source_word: παραβολὴν
  choice: притчу
  rationale: Устоявшийся и точный русский эквивалент παραβολή в контексте учения Иисуса.
- source_word: τοῦ σπείραντος
  choice: о сеятеле
  rationale: Естественно передаёт субстантивированное причастие «тот, кто сеял» и смысл зависимого родительного при слове «притча»; более буквальная форма приведена в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повеление звучит ясно и достойно. Явное «вы» сохраняет эмфазу оригинала, а «о сеятеле» обеспечивает естественность без утраты более буквального варианта, отмеченного в сноске.
