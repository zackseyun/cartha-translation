  source_fidelity: «Итак, вы послушайте притчу о сеятеле» точно передаёт явное эмфатическое Ὑμεῖς, связующее οὖν, императив ἀκούσατε и παραβολή. Оборот «о сеятеле» — естественная русская передача генитивной конструкции τοῦ σπείραντος в данном контексте; сноска прозрачно отмечает более близкое к форме причастия «о том, кто сеял».
