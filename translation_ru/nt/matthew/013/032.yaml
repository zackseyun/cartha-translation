id: MAT.13.32
reference: Matthew 13:32
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὃ μικρότερον μέν ἐστιν πάντων τῶν σπερμάτων, ὅταν δὲ αὐξηθῇ μεῖζον τῶν λαχάνων ἐστὶν καὶ γίνεται δένδρον, ὥστε ἐλθεῖν τὰ πετεινὰ τοῦ οὐρανοῦ καὶ κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/032.yaml
  text: It is indeed smaller than all the seeds[a], but when it has grown, it is larger than the garden plants and becomes a tree[b], so that the birds of the sky come and nest in its branches.
translation:
  language: ru
  text: Оно меньше всех семян, но, когда вырастает, становится больше огородных растений и становится деревом, так что прилетают птицы небесные[a] и гнездятся в его ветвях[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «птицы в небе».'
    reason: lexical_alternative
  - marker: b
    text: Образ птиц, находящих пристанище в ветвях, может перекликаться с ветхозаветными образами великого дерева, представляющего царство (например, Иезекииль 17:23; Даниил 4:12), но сам стих прямо не объясняет этот образ.
    reason: cross_reference
lexical_decisions:
- source_word: μικρότερον ... πάντων τῶν σπερμάτων
  choice: меньше всех семян
  rationale: Сохраняет сравнительную форму греческого μικρότερον и явно выраженное сопоставление со всеми семенами, не превращая её формально в превосходную степень.
- source_word: μέν ... δέ
  choice: '..., но ...'
  rationale: Естественно передаёт контраст между малым началом и большим результатом; отдельный эквивалент μέν в русском здесь не требуется.
- source_word: ὅταν ... αὐξηθῇ
  choice: когда вырастает
  rationale: Передаёт обычный для притчи случай и рассматривает рост как достигнутый перед последующим результатом.
- source_word: μεῖζον τῶν λαχάνων
  choice: больше огородных растений
  rationale: λάχανα обозначает выращиваемые в огороде растения; широкий вариант не сужает значение до овощей или пряных трав.
- source_word: γίνεται δένδρον
  choice: превращается в дерево
  rationale: Сохраняет прямой и яркий образ греческого текста, не смягчая его до «становится похожим на дерево».
- source_word: ὥστε ἐλθεῖν
  choice: так что прилетают
  rationale: Передаёт значение результата у ὥστε с инфинитивом; «прилетают» естественно описывает прибытие птиц по-русски.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: птицы небесные
  rationale: Сохраняет образную конструкцию оригинала и высокий, но понятный современному читателю библейский регистр.
- source_word: κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ
  choice: гнездятся в его ветвях
  rationale: В контексте птиц глагол означает устраиваться или находить пристанище; «гнездятся» передаёт это кратко и естественно.
theological_decisions:
- issue: Возможная аллюзия на образ великого дерева, в ветвях которого находят пристанище птицы
  choice: Образ сохранён буквально, а возможная ветхозаветная связь отмечена только в сноске.
  alternative: Истолковать птиц в основном тексте как народы или людей, находящих убежище в Божьем Царстве.
  rationale: Текст может перекликаться с Иезекиилем 17:23 и Даниилом 4:12, однако сам стих не объясняет символику птиц. Перевод не должен устранять эту смысловую открытость.
translation_notes:
  register: Современный литературный русский с ясным синтаксисом и умеренно возвышенным библейским оборотом «птицы небесные». Сравнительные формы и контраст оригинала сохранены; толкование возможной символики не внесено в основной текст.
