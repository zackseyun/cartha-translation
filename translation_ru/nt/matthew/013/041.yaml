id: MAT.13.41
reference: Matthew 13:41
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀποστελεῖ ὁ υἱὸς τοῦ ἀνθρώπου τοὺς ἀγγέλους αὐτοῦ, καὶ συλλέξουσιν ἐκ τῆς βασιλείας αὐτοῦ πάντα τὰ σκάνδαλα καὶ τοὺς ποιοῦντας τὴν ἀνομίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/041.yaml
  text: The Son of Man will send out his angels[a], and they will gather out of his kingdom all causes of stumbling and those who practice lawlessness[b],
translation:
  language: ru
  text: Сын Человеческий пошлёт Своих ангелов, и они соберут из Его Царства всё, что служит соблазном[a], и тех, кто творит беззаконие[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все соблазны». Греческое слово σκάνδαλα может обозначать всё, что побуждает людей согрешить или отпасть.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тех, кто делает беззаконие». Настоящее время может указывать на постоянное, характерное пренебрежение Божьим законом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: пошлёт
  rationale: Будущее время глагола ἀποστέλλω. «Пошлёт» естественно передаёт направление уполномоченных исполнителей, не добавляя отсутствующей в греческом тексте экспрессии.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшаяся титульная передача сохраняет формулировку и связь с образом из Дан 7.
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: Своих ангелов
  rationale: В эсхатологическом контексте ἄγγελοι обозначает небесных ангелов. Возвратное «Своих» естественно по-русски соотносит их с подлежащим — Сыном Человеческим.
- source_word: συλλέξουσιν
  choice: соберут
  rationale: Передаёт будущее действие и сохраняет образ жатвы из контекста притчи.
- source_word: ἐκ τῆς βασιλείας αὐτοῦ
  choice: из Его Царства
  rationale: Предлог «из» передаёт удаление изнутри сферы Его Царства; прописные буквы соответствуют dignified biblical register.
- source_word: πάντα τὰ σκάνδαλα
  choice: всё, что служит соблазном
  rationale: 'Формулировка сохраняет широкий охват среднего множественного σκάνδαλα: то, что ведёт к греху или отпадению, без неоправданного сведения только к людям или предметам.'
- source_word: τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: тех, кто творит беззаконие
  rationale: «Творит беззаконие» близко передаёт ποιέω + ἀνομία и сохраняет библейскую нравственно-богословскую категорию; форма настоящего времени допускает понимание характерного, продолжающегося поведения.
theological_decisions:
- issue: Передача титула ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  alternative: Человеческий Сын / Сын человека
  rationale: Традиционная титульная форма наиболее ясно сохраняет особое самоназвание Иисуса и вероятную отсылку к Дан 7, не подменяя её толкованием.
- issue: Объём значения σκάνδαλα в сцене суда
  choice: всё, что служит соблазном
  alternative: все соблазны / все преткновения
  rationale: Греческое слово может охватывать людей, влияния и предметы, побуждающие к греху или отпадению. Нейтральная конструкция сохраняет эту намеренную широту.
- issue: Характер действия в τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: тех, кто творит беззаконие
  alternative: тех, кто поступает беззаконно
  rationale: Существительное «беззаконие» сохраняет связь с ἀνομία и богословское напряжение между законом и мятежом; настоящее время относительного предложения допускает привычный характер действия, не усиливая его наречиями.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис остаётся прозрачным для широкого читателя; традиционные «Сын Человеческий», «Царство» и «беззаконие» сохранены ради межтекстовых и богословских связей. Запятая в конце сохранена, поскольку стих продолжается в Мф 13:42.
