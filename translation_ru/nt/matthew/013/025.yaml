id: MAT.13.25
reference: Matthew 13:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐν δὲ τῷ καθεύδειν τοὺς ἀνθρώπους ἦλθεν αὐτοῦ ὁ ἐχθρὸς καὶ ⸀ἐπέσπειρεν ζιζάνια ἀνὰ μέσον τοῦ σίτου καὶ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/025.yaml
  text: But while the men were sleeping, his enemy came and sowed weeds among the wheat and went away.
translation:
  language: ru
  text: Но когда люди спали, пришёл его враг, посеял сорняки среди пшеницы и ушёл.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν δὲ τῷ καθεύδειν τοὺς ἀνθρώπους
  choice: Но когда люди спали
  rationale: Естественная русская передача временной конструкции с субстантивированным инфинитивом; ἀνθρώπους здесь означает людей, а не обязательно только мужчин.
- source_word: αὐτοῦ ὁ ἐχθρός
  choice: его враг
  rationale: Сохранена прямая соотнесённость местоимения с хозяином поля из контекста притчи.
- source_word: ἐπέσπειρεν
  choice: посеял
  rationale: Глагол обозначает засев поверх или среди уже посеянного; положение сорняков среди пшеницы ясно выражено последующей фразой.
- source_word: ζιζάνια
  choice: сорняки
  rationale: ζιζάνια, вероятно, обозначает плевелы, похожие на пшеницу, однако более общее «сорняки» понятно современному читателю и не утверждает ботаническую идентификацию сверх необходимого.
- source_word: ἀνὰ μέσον τοῦ σίτου
  choice: среди пшеницы
  rationale: Точно и естественно передаёт пространственное значение выражения.
- source_word: ἀπῆλθεν
  choice: ушёл
  rationale: Прямая и стилистически естественная передача завершения действия.
theological_decisions:
- issue: Кого обозначает τοὺς ἀνθρώπους
  choice: люди
  alternative: мужчины / работники
  rationale: Само слово допускает общее значение «люди»; контекст может подразумевать работников хозяина, но стих прямо этого не уточняет. Перевод не сужает референцию без текстового основания.
- issue: Точная разновидность ζιζάνια
  choice: сорняки
  alternative: плевелы
  rationale: Сохраняется основной образ вредных растений среди хлеба без спорной чрезмерной ботанической конкретизации; богословский смысл притчи не уточняется переводчиком.
translation_notes:
  register: Современный литературный русский язык; краткий повествовательный синтаксис, соответствующий ясности и достоинству притчи. Союз «Но» сохраняет противопоставление, выраженное δέ.
