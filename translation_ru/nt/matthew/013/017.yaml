id: MAT.13.17
reference: Matthew 13:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν ὅτι πολλοὶ προφῆται καὶ δίκαιοι ἐπεθύμησαν ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/017.yaml
  text: For truly I say to you that many prophets and righteous people longed to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: ru
  text: 'Ведь истинно говорю вам: многие пророки и праведники желали увидеть то, что видите вы, но не увидели, и услышать то, что слышите вы, но не услышали.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν
  choice: истинно
  rationale: В формуле ἀμὴν λέγω ὑμῖν слово передаёт торжественное подтверждение истинности сказанного; «истинно» естественно сохраняет эту силу в русском библейском регистре.
- source_word: γὰρ
  choice: ведь
  rationale: Частица поясняет и обосновывает предыдущее высказывание; «ведь» естественнее русского «ибо» и сохраняет логическую связь.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямо передаёт формулу оригинала и звучит естественно и торжественно.
- source_word: πολλοὶ προφῆται καὶ δίκαιοι
  choice: многие пророки и праведники
  rationale: δίκαιοι — субстантивированное прилагательное во множественном числе; «праведники» ясно обозначает людей, характеризуемых праведностью, и естественно для современного литературного русского.
- source_word: ἐπεθύμησαν
  choice: желали
  rationale: Глагол выражает сильное стремление; в сочетании с инфинитивами «желали увидеть… и услышать» звучит естественно, не привнося отрицательных оттенков, возможных у слова в других контекстах.
- source_word: ἃ βλέπετε
  choice: то, что видите вы
  rationale: Сохраняет неопределённый объект относительной конструкции и посредством порядка слов подчёркивает контраст между прежними праведниками и нынешними слушателями.
- source_word: οὐκ εἶδαν
  choice: не увидели
  rationale: Аорист констатирует исторический факт; русский вид глагола естественно передаёт недостигнутый результат без добавления отсутствующего объекта.
- source_word: ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: то, что слышите вы, но не услышали
  rationale: Сохраняет параллелизм со зрением и различие между настоящим временем у учеников и историческим фактом применительно к пророкам и праведникам.
theological_decisions:
- issue: Объём значения δίκαιοι
  choice: «праведники» как более широкая группа наряду с пророками
  alternative: «праведные» или пояснительное «праведные люди»
  rationale: Греческое субстантивированное прилагательное обозначает праведных людей, но не ограничивает их пророками. Русское существительное сохраняет самостоятельность этой категории без конфессионального уточнения.
- issue: Предмет увиденного и услышанного
  choice: 'Оставлен неуточнённым: «то, что видите… то, что слышите»'
  alternative: Уточнить как Мессию, тайны Царства или исполнение обетований
  rationale: Контекст позволяет связать слова с откровением Царства в служении Иисуса, однако сам стих не называет предмет прямо; перевод не устраняет эту содержательную открытость.
- issue: Отношение желания к фактическому опыту прежних поколений
  choice: «желали… но не увидели… но не услышали»
  alternative: Усилить до «так и не увидели / так и не услышали»
  rationale: Простой отрицательный аорист утверждает, что желаемое не было ими пережито, но не требует добавочного русского усиления.
translation_notes:
  register: 'Современный литературный русский с dignified библейским звучанием. Сохранены риторический параллелизм и контраст; «ведь» предпочтено архаизирующему «ибо». Сноски не требуются: «праведники» непосредственно и недвусмысленно передаёт субстантивированное δίκαιοι.'
