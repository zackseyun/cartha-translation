  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/015.yaml
  text: For this people's heart has grown dull[a], and with their ears they hear heavily, and they have closed their eyes, lest they should see with their eyes and hear with their ears and understand with their heart and turn back[c][b], and I will heal them.
translation:
  language: ru
  text: Ибо огрубело сердце этого народа[a], ушами они с трудом слышат и закрыли свои глаза, чтобы они не увидели глазами, не услышали ушами, не поняли сердцем и не обратились[b], — и Я исцелю их.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «утолстилось»; то есть стало невосприимчивым.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не вернулись».'
    reason: lexical_alternative
  - marker: c
    text: Цитата из Исаии 6:9–10.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: огрубело
  rationale: Глагол буквально означает «стало толстым, утолстилось», но в сочетании с «сердцем» передаёт утрату восприимчивости. «Огрубело» естественно звучит по-русски и сохраняет образ, не сводя его только к интеллектуальной неспособности.
- source_word: καρδία
  choice: сердце
  rationale: Сохраняет библейское обозначение внутреннего человека; в данном стихе сердце прямо связано с пониманием.
- source_word: λαοῦ τούτου
  choice: этого народа
  rationale: Передаёт родительный оборот и указательное τούτου без перестройки смысла.
- source_word: βαρέως ἤκουσαν
  choice: ушами они с трудом слышат
  rationale: βαρέως буквально выражает тяжесть, а при глаголе слуха — затруднённое восприятие. Настоящее время в русском естественно описывает продолжающееся состояние пророческой цитаты, хотя греческая форма ἤκουσαν — аорист.
- source_word: ἐκάμμυσαν
  choice: глаза свои закрыли
  rationale: Сохраняет активное действие самих людей и завершённость поступка с сохраняющимся результатом.
- source_word: μήποτε
  choice: чтобы не
  rationale: Передаёт отрицательно-целевую силу конструкции, не сглаживая напряжение между судом и ответственностью людей.
- source_word: ἴδωσιν ... ἀκούσωσιν ... συνῶσιν
  choice: не увидеть ... не услышать ... не понять
  rationale: Последовательность инфинитивов после «чтобы не» естественна в современном русском и точно воспроизводит цепочку греческих сослагательных форм.
- source_word: ἐπιστρέψωσιν
  choice: не обратиться
  rationale: «Обратиться» передаёт поворот или возвращение к Богу, не вводя более узкого конфессионального термина «быть обращёнными».
- source_word: ἰάσομαι
  choice: Я исцелю
  rationale: Прямо передаёт будущее время греческого глагола и сохраняет образ исцеления.
theological_decisions:
- issue: Судебное ожесточение и человеческая ответственность в обороте с μήποτε
  choice: «чтобы не увидеть… не понять… и не обратиться, — и Я исцелю их»
  alternative: «иначе они увидели бы… поняли бы… обратились бы, и Я исцелил бы их»
  rationale: Выбранный вариант сохраняет поверхностную целевую силу μήποτε и активную роль народа, который сам закрыл глаза, не разрешая богословское напряжение посредством условного перефразирования.
- issue: Значение ἐπιστρέψωσιν
  choice: «обратиться»
  alternative: «повернуться» или «вернуться»
  rationale: В контексте речь идёт о возвращении к Богу, однако перевод не добавляет специальной формулы о порядке спасения; возможная буквальная широта отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой цитаты. Синтаксический параллелизм органов восприятия и сердца сохранён; архаизмы вроде «дабы» и конфессионально нагруженные пояснения исключены.
