  verdict: revise
  source_fidelity: 'Смысл в целом передан точно: «огрубело сердце», затруднённое слышание, активное закрытие глаз, цепочка «увидеть — услышать — понять — обратиться» и будущее «исцелю». Однако «чтобы не» может звучать как недвусмысленно целевое объяснение действия самих людей и несколько сильнее связывает его с «закрыли», тогда как μήποτε в цитате сохраняет спорную/напряжённую функцию «как бы не; иначе не». Более нейтральное «чтобы они не…» сохраняет поверхность греческой конструкции и яснее отделяет последующее следствие от ближайшего глагола.'
  naturalness: 'Текст литературный и понятный. Для современного русского естественнее восстановить подлежащее «они» после «чтобы», а также поставить личные формы в параллельной последовательности: «не увидели… не услышали… не поняли… не обратились». Это устраняет некоторую телеграфность цепочки инфинитивов и сохраняет зависимость от μήποτε.'
  terminology: '«Огрубело сердце», «сердце», «обратились» и «исцелю» удачны. Сноска к ἐπιστρέψωσιν требует исправления: «повернуться» не является естественной альтернативой к «обратиться» в данной конструкции; исходный глагол допускает «вернуться» и более нейтральное «обратиться/повернуть назад». Перекрёстная ссылка верна, но её якорь должен стоять при самой цитате или при её начале, а не после конечной точки.'
