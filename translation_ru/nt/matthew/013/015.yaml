    rationale: «Чтобы не увидеть…» формально возможно, но может восприниматься как прямое целевое пояснение к тому, что люди закрыли глаза. В греческой цитате μήποτε сохраняет напряжённую функцию «как бы не / чтобы не» перед субъектом всей последующей цепи. «Чтобы они не увидели…» точнее отражает структуру и естественнее звучит по-русски.
