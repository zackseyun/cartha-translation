  yaml_path: translation/nt/matthew/013/029.yaml
  text: But he said[a], ‘No, lest while gathering the weeds you uproot the wheat along with them.’
translation:
  language: ru
  text: 'Но он сказал: «Нет, иначе, выпалывая сорняки[a], вы вместе с ними вырвете с корнем и пшеницу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плевелы»; возможно, имеется в виду плевел опьяняющий — сорняк, который на ранних стадиях роста похож на пшеницу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: сказал
  rationale: Греческий исторический презенс в русском повествовании естественно передаётся прошедшим временем.
- source_word: Οὔ
  choice: Нет
  rationale: Прямой и естественный ответ, точно передающий краткое греческое отрицание.
- source_word: μήποτε
  choice: иначе
  rationale: Передаёт предостережение о возможном нежелательном последствии без архаичного оттенка.
- source_word: συλλέγοντες τὰ ζιζάνια
  choice: выпалывая сорняки
  rationale: В данном земледельческом контексте причастный оборот обозначает одновременное удаление сорной травы; «выпалывая» звучит по-русски естественно.
- source_word: ζιζάνια
  choice: сорняки
  rationale: Понятное современному читателю общее обозначение; возможная более точная идентификация растения сохраняется в сноске.
- source_word: ἐκριζώσητε
  choice: вырвете с корнем
  rationale: Явно передаёт значение удаления растения вместе с корнем и звучит естественнее, чем более книжное «искорените».
- source_word: ἅμα αὐτοῖς
  choice: вместе с ними
  rationale: Точно выражает опасность одновременного удаления пшеницы вместе с сорняками.
- source_word: τὸν σῖτον
  choice: пшеницу
  rationale: В контексте притчи речь идёт именно о пшенице, противопоставленной похожему сорному растению.
theological_decisions:
- issue: Передача ζιζάνια в известной притче
  choice: сорняки
  alternative: плевелы; возможно, плевел опьяняющий
  rationale: Современное «сорняки» обеспечивает ясность, тогда как традиционное «плевелы» и возможная ботаническая конкретизация сохранены в сноске, не создавая ложной уверенности в точном виде растения.
translation_notes:
  register: Современный литературный русский язык; прямая речь лаконична, сельскохозяйственный образ передан понятно и без архаизмов.
