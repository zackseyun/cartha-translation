lexical_decisions:
- source_word: ὁ ἔχων
  choice: У кого есть
  rationale: Артикль с причастием употреблён субстантивированно и обозначает любого человека, обладающего названным признаком. Русская конструкция «у кого есть» естественно передаёт обобщённое значение и сохраняет единственное число.
- source_word: ὦτα
  choice: уши
  rationale: Греческое слово стоит во множественном числе; прямое соответствие «уши» сохраняет число и образ исходного выражения.
- source_word: ἀκουέτω
  choice: пусть слышит
  rationale: Форма настоящего повелительного наклонения третьего лица единственного числа передана конструкцией «пусть слышит». Она сохраняет побудительную силу и лексическую связь с глаголом «слышать», который в контексте подразумевает внимательное восприятие и отклик.
theological_decisions:
- issue: Обобщённое выражение в мужском роде
  choice: У кого есть уши, пусть слышит.
  alternative: Кто имеет уши, да услышит.
  rationale: Греческая конструкция имеет форму мужского рода единственного числа, но употреблена обобщённо. Русское «у кого» естественно относится к любому человеку, а «пусть слышит» сохраняет единственное число, не вводя дополнительного гендерного ограничения.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Формулировка сохраняет краткость, афористичность и повелительную силу греческого текста, избегая архаичных «имеет» и «да услышит».
