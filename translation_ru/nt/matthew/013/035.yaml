  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος· Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου, ἐρεύξομαι κεκρυμμένα ἀπὸ ⸀καταβολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/035.yaml
  text: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the foundation of the world.”'
translation:
  language: ru
  text: 'чтобы исполнилось сказанное через пророка:


    «Открою уста мои в притчах,


    возвещу сокрытое от основания».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «от основания мира».'
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: чтобы исполнилось
  rationale: Естественно передаёт целевое-результативную связь и сослагательное наклонение в формуле исполнения пророчества.
- source_word: τὸ ῥηθὲν διὰ τοῦ προφήτου
  choice: сказанное через пророка
  rationale: Сохраняет значение διά с родительным как посредничества и привычную для Матфея формулу цитирования.
- source_word: Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου
  choice: Открою уста мои в притчах
  rationale: Передаёт поэтическую образность цитаты и сохраняет ключевой термин «притчи»; «уста» уместны в возвышенном цитатном регистре.
- source_word: ἐρεύξομαι
  choice: возвещу
  rationale: Глагол обозначает излияние или произнесение вслух; «возвещу» звучит достойно и естественно, не создавая грубых физиологических ассоциаций буквального русского соответствия.
- source_word: κεκρυμμένα
  choice: сокрытое
  rationale: 'Субстантивированное причастие передано собирательным единственным числом, естественным для русской поэтической речи и сохраняющим результативное значение: то, что оставалось скрытым.'
- source_word: ἀπὸ καταβολῆς
  choice: от основания мира
  rationale: Хотя κόσμου в принятом тексте отсутствует, устойчивое эллиптическое выражение в данном контексте подразумевает основание мира; восполнение делает русский текст понятным и соответствует цитатному смыслу Пс 77:2.
theological_decisions:
- issue: Посредничество пророка в формуле цитирования
  choice: через пророка
  alternative: пророком
  rationale: Вариант «через пророка» точнее сохраняет διά с родительным и не уточняет имя, отсутствующее в исходном тексте.
- issue: Объём выражения ἀπὸ καταβολῆς
  choice: от основания мира
  alternative: от основания
  rationale: 'Греческое выражение эллиптично: слово «мира» не выражено, но подразумевается идиомой и контекстом. Его восполнение необходимо для ясного и естественного русского текста; неоднозначность и рукописная форма отмечены в сноске.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим регистром внутри ветхозаветной цитаты. Формула исполнения передана ясно и без конфессиональных уточнений; двоеточие естественно вводит прямую цитату.
