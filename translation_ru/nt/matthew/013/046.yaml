lexical_decisions:
- source_word: εὑρὼν δὲ
  choice: найдя
  rationale: Аористное причастие передаёт действие, предшествующее основным глаголам. Частица δέ здесь лишь продолжает повествование и по-русски не требует отдельного союза.
- source_word: ἕνα
  choice: одну
  rationale: Сохраняет явно выраженное числительное и подчёркивает единственность жемчужины исключительной ценности.
- source_word: πολύτιμον
  choice: драгоценную
  rationale: Естественное современное соответствие со значением исключительной ценности; вариант «очень дорогую» вынесен в примечание для сохранения оттенка высокой стоимости.
- source_word: μαργαρίτην
  choice: жемчужину
  rationale: Стандартное значение слова в данном контексте.
- source_word: ἀπελθὼν
  choice: он пошёл
  rationale: Причастие естественно передано личной формой, сохраняющей последовательность действий; «пошёл» звучит по-русски проще и естественнее, чем «удалился».
- source_word: πέπρακεν
  choice: продал
  rationale: Перфект в повествовательной цепи естественно передаётся русским прошедшим совершенного вида, выражающим завершённое действие.
- source_word: πάντα ὅσα εἶχεν
  choice: всё, что имел
  rationale: Точно и естественно сохраняет идею полной совокупности его имущества.
- source_word: ἠγόρασεν
  choice: купил
  rationale: Прямое и современное соответствие греческому глаголу.
- source_word: αὐτόν
  choice: её
  rationale: Местоимение согласовано с русским существительным женского рода «жемчужина» и однозначно указывает на неё.
