  text: and having found one pearl of great value[a], he went away, sold all that he had, and bought it.
translation:
  language: ru
  text: найдя одну драгоценную жемчужину[a], он ушёл, продал всё, что имел, и купил её.
  philosophy: optimal-equivalence
  footnotes:
