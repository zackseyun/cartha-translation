  source_fidelity: 'Перевод точно передаёт нахождение одной жемчужины исключительной ценности, продажу всего имущества и её покупку. Явное числительное «одну» сохранено; местоимение «её» правильно соотнесено с «жемчужиной». Однако ἀπελθών точнее передать как «ушёл» (или «уйдя»), а не «пошёл»: речь идёт об удалении/уходе после находки, а не просто о начале движения.'
