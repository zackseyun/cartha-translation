id: MAT.13.21
reference: Matthew 13:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐκ ἔχει δὲ ῥίζαν ἐν ἑαυτῷ ἀλλὰ πρόσκαιρός ἐστιν, γενομένης δὲ θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον εὐθὺς σκανδαλίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/021.yaml
  text: Yet he has no root in himself[a], but is temporary. When affliction or persecution arises because of the word[b], he immediately falls away.
translation:
  language: ru
  text: Но корня в себе он не имеет и непостоянен. Когда же из-за слова приходит беда или гонение, он сразу отступает[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спотыкается»; греческий глагол также может означать «соблазняется».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν ἐν ἑαυτῷ
  choice: корня в себе
  rationale: Сохраняет земледельческий образ притчи и возвратное значение выражения, не добавляя толкования.
- source_word: πρόσκαιρός
  choice: непостоянен
  rationale: Передаёт недолговечность и отсутствие стойкости у человека; по-русски звучит естественнее буквального «временный» применительно к лицу.
- source_word: γενομένης ... θλίψεως ἢ διωγμοῦ
  choice: когда ... наступают беда или гонение
  rationale: Передаёт временное значение генитивной абсолютной конструкции и возникновение тяжёлых обстоятельств.
- source_word: θλίψεως
  choice: беда
  rationale: Современное и понятное слово, передающее тяжёлое давление и скорбные обстоятельства без архаичного оттенка.
- source_word: διωγμοῦ
  choice: гонение
  rationale: Устоявшийся и точный русский эквивалент в контексте враждебного преследования из-за принятого слова.
- source_word: διὰ τὸν λόγον
  choice: из-за слова
  rationale: Сохраняет ключевую связь с λόγος в притче; «слово» здесь естественно обозначает возвещённую весть.
- source_word: εὐθὺς
  choice: сразу
  rationale: Ясно и естественно передаёт подчёркнутую незамедлительность реакции.
- source_word: σκανδαλίζεται
  choice: отступает
  rationale: В контексте кратковременного принятия слова передаёт прекращение верности под давлением, не формулируя отдельной доктрины; более буквальные оттенки отмечены в сноске.
theological_decisions:
- issue: Значение σκανδαλίζεται в контексте ученичества и притчи
  choice: отступает
  alternative: спотыкается; соблазняется
  rationale: Контекст указывает на отказ продолжать следовать слову при беде или гонении. «Отступает» передаёт результат, но не уточняет окончательность или богословский статус этого отступления; широта греческого глагола сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранён образ корня и повтор ключевого слова «слово». Пунктуация разделяет характеристику человека и последующее испытание на два предложения, не меняя логической связи.
