  text: And as he was sowing[a], some seeds fell beside the path, and the birds came and devoured them.
translation:
  language: ru
  text: И когда он сеял, одни семена упали у дороги[a], и прилетели птицы и склевали их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «одни упали у дороги»; слово «семена» добавлено по контексту притчи о сеятеле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: когда он сеял
  rationale: Конструкция ἐν с субстантивированным инфинитивом выражает одновременность; этот перевод естественно передаёт временное значение.
- source_word: ἃ μὲν
  choice: одни семена
  rationale: Форма среднего рода множественного числа буквально означает «одни [предметы]»; существительное «семена» восполнено из контекста и сохраняет соотнесённость с последующими группами в притче.
- source_word: ἔπεσεν
  choice: упали
  rationale: Аорист в повествовании передан совершенным видом; множественное число по-русски согласовано с восполненным словом «семена».
- source_word: παρὰ τὴν ὁδόν
  choice: у дороги
  rationale: παρά с винительным указывает на место возле дороги; «у дороги» естественно и не уточняет сверх текста, была ли это тропа или более широкая дорога.
- source_word: ἐλθόντα τὰ πετεινὰ
  choice: прилетели птицы
  rationale: Причастный оборот естественно передан личной глагольной формой. «Прилетели» идиоматично выражает прибытие птиц, не добавляя отсутствующего в стихе оборота «небесные».
- source_word: κατέφαγεν
  choice: склевали
  rationale: В отношении птиц «склевали» естественно передаёт полное поедание семян и силу приставочного глагола κατεσθίω.
- source_word: αὐτά
  choice: их
  rationale: Местоимение относится к упавшим семенам; русское «их» ясно сохраняет эту связь.
