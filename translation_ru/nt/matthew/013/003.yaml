lexical_decisions:
- source_word: ἐλάλησεν
  choice: говорил
  rationale: Естественная передача аориста в повествовательном контексте; в сочетании с «многое» русский несовершенный вид звучит идиоматично и передаёт развернутую речь.
- source_word: παραβολαῖς
  choice: притчами
  rationale: Устоявшийся и точный русский эквивалент для поучительных образных рассказов Иисуса.
- source_word: Ἰδού
  choice: Вот
  rationale: Передаёт призыв обратить внимание естественным современным русским словом, без архаизации «се».
- source_word: ὁ σπείρων
  choice: сеятель
  rationale: Субстантивированное причастие обозначает человека, который сеет; «сеятель» кратко и традиционно передаёт этот смысл.
- source_word: τοῦ σπείρειν
  choice: сеять
  rationale: Инфинитив цели после глагола движения естественно передаётся русским инфинитивом.
