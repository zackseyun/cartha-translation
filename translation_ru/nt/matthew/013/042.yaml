source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/042.yaml
  text: and they will throw them into the furnace of fire[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: ru
  text: И бросят их в огненную печь. Там будет плач и скрежет зубов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαλοῦσιν
  choice: бросят
  rationale: Будущее время βάλλω передаёт решительное насильственное действие; «бросят» естественно и точно в современном русском.
- source_word: αὐτοὺς
  choice: их
  rationale: Местоимение сохраняет отсылку к группе, названной в предшествующем контексте, не повторяя её наименование.
- source_word: κάμινον τοῦ πυρός
  choice: огненную печь
  rationale: Греческая генитивная конструкция естественно передаётся русским определением; конкретный образ печи и огня сохранён без богословской конкретизации.
- source_word: ἐκεῖ
  choice: там
  rationale: Краткое русское наречие точно сохраняет указание на только что названное место и естественно стоит в начале нового предложения.
- source_word: κλαυθμὸς
  choice: плач
  rationale: Передаёт скорбь и мучительное переживание, не усиливая значение до более узкого «рыдания».
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: скрежет зубов
  rationale: Устоявшееся и понятное русское соответствие греческому выражению, не определяющее однозначно, вызван ли скрежет страданием, яростью или обоими переживаниями.
- source_word: καὶ
  choice: и
  rationale: Начальный союз сохраняет связь стиха с предыдущим высказыванием.
theological_decisions:
- issue: Характер образа «огненной печи»
  choice: Сохранить конкретную метафору суда без поясняющей подстановки doctrinalного термина.
  alternative: Передать как «адский огонь» либо усилить до «печи с пылающим огнём».
  rationale: Исходный текст даёт образ, но не разъясняет в этом стихе его природу; перевод не должен ни смягчать, ни догматически уточнять его.
- issue: Смысл формулы «плач и скрежет зубов»
  choice: Сохранить формулу без сведения её только к скорби или только к ярости.
  alternative: Истолковать скрежет исключительно как гнев или всё выражение исключительно как печаль.
  rationale: Фраза выражает тяжкое состояние при суде, но допускает оттенки мучения, отчаяния и враждебной реакции; буквальный устойчивый оборот сохраняет напряжение.
translation_notes:
  register: Современный литературный русский; краткая, ритмичная и достойная формулировка. «Огненная печь» звучит естественнее буквального «печь огня», а «там» точно и без избыточности передаёт ἐκεῖ.
