  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ, ὃν εὑρὼν ἄνθρωπος ἔκρυψεν, καὶ ἀπὸ τῆς χαρᾶς αὐτοῦ ὑπάγει καὶ ⸂πωλεῖ πάντα ὅσα ἔχει⸃ καὶ ἀγοράζει τὸν ἀγρὸν ἐκεῖνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/044.yaml
  text: The kingdom of heaven is like a treasure hidden in a field[a], which a man found and hid[b]; and in his joy he goes and sells all that he has and buys that field.
translation:
  language: ru
  text: 'Царство Небесное подобно сокровищу, скрытому в поле: найдя его, человек спрятал его и от радости идёт, продаёт всё, что у него есть, и покупает то поле.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁμοία ἐστὶν
  choice: подобно
  rationale: Естественно передаёт обычную сравнительную формулу притч, сохраняя образное сопоставление.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Царство Небесное
  rationale: Устоявшееся и понятное русское соответствие характерному для Матфея выражению; сохраняет смысл βασιλεία, не сводя его только к территории или только к действию царствования.
- source_word: θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ
  choice: сокровищу, скрытому в поле
  rationale: Дательный падеж обусловлен сравнением; причастие перфекта передаёт состояние сокровища как уже скрытого. Неопределённость поля естественно выражена без артикля.
- source_word: ὃν εὑρὼν ἄνθρωπος
  choice: найдя его, человек
  rationale: 'Деепричастная конструкция естественна по-русски и сохраняет последовательность: человек находит именно сокровище.'
- source_word: ἔκρυψεν
  choice: снова спрятал его
  rationale: Объект восстановлен ради ясности; «снова» контекстуально показывает, что найденное уже было скрыто, хотя отдельного греческого слова со значением «снова» нет.
- source_word: ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: от радости
  rationale: 'Кратко и естественно передаёт причинную силу ἀπό: поступки человека вызваны его радостью.'
- source_word: ὑπάγει καὶ πωλεῖ πάντα ὅσα ἔχει
  choice: пошёл, продал всё, что имел
  rationale: Русское повествование естественно передаёт цепь действий совершенным видом; полнота продажи сохранена.
- source_word: ἀγοράζει τὸν ἀγρὸν ἐκεῖνον
  choice: купил то поле
  rationale: «То поле» отражает указательное ἐκεῖνον и подчёркивает конкретное поле, где находится сокровище.
theological_decisions:
- issue: Передача βασιλεία
  choice: Царство
  alternative: царствование, владычество
  rationale: «Царство» сохраняет традиционный широкий диапазон понятия, не устраняя возможного динамического смысла Божьего правления.
- issue: Референт ἄνθρωπος
  choice: человек
  alternative: мужчина
  rationale: Русское «человек» точно и естественно обозначает отдельного участника притчи; грамматический мужской род и последующие формы не скрыты.
- issue: Предмет сравнения
  choice: Царство Небесное подобно сокровищу
  alternative: С Царством Небесным происходит то же, что с сокровищем
  rationale: Сохранена непосредственная форма греческого сравнения без истолкования того, какой именно элемент всей сцены соответствует Царству.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис слегка упрощён для естественного повествования; образ, последовательность действий и неразрешённая широта понятия «Царство» сохранены.
