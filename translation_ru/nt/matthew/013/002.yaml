  text: And large crowds gathered to him[a], so that he got into a boat and sat down[b], and the whole crowd stood on the shore.
translation:
  language: ru
  text: И собралось к Нему множество людей, так что Он вошёл в лодку и сел, а вся толпа стояла на берегу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτὸν ὄχλοι πολλοί
  choice: собралось к Нему множество людей
  rationale: Русское собирательное выражение естественно передаёт многочисленные группы людей, пришедшие к Иисусу; направление πρός сохранено формой «к Нему».
- source_word: ὥστε
  choice: так что
  rationale: Передаёт фактическое следствие, вводимое ὥστε, без оттенка намерения.
- source_word: εἰς πλοῖον ἐμβάντα καθῆσθαι
  choice: Он вошёл в лодку и сел
  rationale: Естественно передаёт вход в лодку и последующее сидячее положение; причастная конструкция развёрнута в однородные сказуемые.
- source_word: πᾶς ὁ ὄχλος
  choice: весь народ
  rationale: Сохраняет переход от множества собравшихся к их обозначению как единого целого и звучит естественнее, чем повтор слова «толпа».
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: на берегу
  rationale: Нейтрально передаёт αἰγιαλός как береговую полосу без излишне конкретного образа пляжа.
- source_word: εἱστήκει
  choice: стоял
  rationale: Передаёт продолжительное состояние, выраженное плюсквамперфектом ἵστημι, естественной русской формой несовершенного вида.
