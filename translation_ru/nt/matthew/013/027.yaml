  yaml_path: translation/nt/matthew/013/027.yaml
  text: So the slaves of the master of the house came to him and said[a], ‘Lord, did you not sow good seed in your field? Where then do the weeds come from?’
translation:
  language: ru
  text: 'Тогда рабы хозяина дома подошли к нему и сказали: «Господин! Разве не доброе семя ты посеял на своём поле? Откуда же на нём взялись плевелы[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сорняки». Греческое слово, вероятно, означает плевел опьяняющий — сорное растение, похожее на пшеницу на ранних стадиях роста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: подошли к нему
  rationale: Аористное причастие обозначает действие, предшествующее εἶπον; по-русски естественно передать двумя однородными сказуемыми.
- source_word: δοῦλοι
  choice: рабы
  rationale: Слово обозначает зависимых людей, принадлежащих хозяину; «рабы» сохраняет социальный статус, не смягчая его до общего «слуги».
- source_word: οἰκοδεσπότου
  choice: хозяина дома
  rationale: Передаёт составное значение слова — главу и хозяина домашнего хозяйства — и сохраняет его отношение к рабам.
- source_word: Κύριε
  choice: Господин
  rationale: Внутри притчи это почтительное обращение рабов к хозяину; «Господин» естественно передаёт контекстуальное значение без необоснованного христологического уточнения.
- source_word: οὐχὶ
  choice: разве не
  rationale: Русская конструкция передаёт вопрос, предполагающий утвердительный ответ.
- source_word: καλὸν σπέρμα
  choice: доброе семя
  rationale: Точная и традиционно понятная передача положительного качества посеянного семени.
- source_word: ἔσπειρας
  choice: посеял
  rationale: Глагол означает именно сеяние и передан совершенным видом в соответствии с аористом.
- source_word: ἐν τῷ σῷ ἀγρῷ
  choice: на своём поле
  rationale: Русский возвратный притяжательный «своём» естественно выражает принадлежность поля субъекту действия; для поля нормативен предлог «на».
- source_word: πόθεν οὖν
  choice: откуда же
  rationale: «Откуда» сохраняет вопрос об источнике или происхождении, а «же» передаёт выводное οὖν.
- source_word: ἔχει
  choice: на нём
  rationale: Греческая конструкция буквально говорит, что поле «имеет» плевелы; русская локативная перестройка избегает неестественного «имеет плевелы», сохраняя поле как место их появления.
- source_word: ζιζάνια
  choice: плевелы
  rationale: Термин обозначает сорное растение, вероятнее всего плевел опьяняющий, внешне похожий на пшеницу на ранних стадиях; «плевелы» точно и узнаваемо в контексте притчи.
theological_decisions:
- issue: Передача δοῦλοι в бытовом мире притчи
  choice: рабы
  alternative: слуги
  rationale: «Рабы» сохраняет выраженный греческим словом зависимый статус персонажей. Это социальное описание внутри притчи, а не одобрение института рабства.
- issue: Передача обращения Κύριε
  choice: Господин
  alternative: Господи
  rationale: Здесь персонажи обращаются к хозяину дома. «Господин» сохраняет бытовой смысл обращения и не превращает реплику притчи в прямое богословское исповедание; возможная более широкая смысловая перекличка при этом не отрицается.
translation_notes:
  register: Современный литературный русский язык с dignified, но доступным строем. Синтаксис греческого причастного оборота естественно развёрнут в последовательные действия. Финальный вопрос передан идиоматично, без буквального и неестественного оборота «откуда поле имеет плевелы».
