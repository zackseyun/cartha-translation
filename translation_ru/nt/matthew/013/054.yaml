  text: καὶ ἐλθὼν εἰς τὴν πατρίδα αὐτοῦ ἐδίδασκεν αὐτοὺς ἐν τῇ συναγωγῇ αὐτῶν, ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν· Πόθεν τούτῳ ἡ σοφία αὕτη καὶ αἱ δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/054.yaml
  text: And coming to his hometown[a], he was teaching them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these powers?”
translation:
  language: ru
  text: 'Придя в родные места, Он учил их в их синагоге, так что они изумлялись и говорили: «Откуда у этого человека такая мудрость и такие силы[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «могущественные дела»; то есть деяния, в которых проявляется сила, часто понимаемые как чудеса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρίδα
  choice: к себе на родину
  rationale: В данном повествовательном контексте слово обозначает родные места Иисуса, где Его знали местные жители. «К себе на родину» естественно передаёт локальный смысл, не сводя его строго к городу или селению.
- source_word: ἐδίδασκεν
  choice: стал учить
  rationale: Имперфект описывает продолжавшееся в прошлом действие; сочетание «стал учить» естественно передаёт начало и последующее течение обучения после прихода.
- source_word: συναγωγῇ
  choice: синагоге
  rationale: В иудейском контексте речь идёт о синагоге как месте собрания и обучения.
- source_word: ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν
  choice: так что они изумлялись и говорили
  rationale: ὥστε вводит результат, а русские личные глагольные формы естественно передают оба инфинитива; «изумлялись» сохраняет силу ἐκπλήσσομαι.
- source_word: Πόθεν
  choice: Откуда
  rationale: Вопрос касается источника или происхождения мудрости и сил Иисуса; «Откуда у Него…?» точно и естественно выражает эту мысль.
- source_word: τούτῳ
  choice: у Него
  rationale: Русское «у Него» естественно оформляет вопрос о происхождении качеств и деяний. Дистанцирующий оттенок указательного местоимения здесь не усилен добавлением «этого человека», чтобы речь оставалась естественной.
- source_word: σοφία
  choice: мудрость
  rationale: Прямое и общепонятное соответствие, обозначающее проявившиеся в учении глубокое знание и понимание.
- source_word: δυνάμεις
  choice: силы
  rationale: Буквальное множественное число сохраняет связь с идеей силы и допускает подразумеваемое значение могущественных, чудесных деяний, не заменяя его сразу более толковательным словом «чудеса».
theological_decisions:
- issue: Передача δυνάμεις применительно к необычайным деяниям Иисуса
  choice: силы
  alternative: могущественные дела; чудеса
  rationale: '«Силы» сохраняет лексическую форму и смысловую открытость греческого текста: слово может обозначать проявления силы и метонимически — совершённые силой чудесные дела. Сноска поясняет этот смысл без внесения в основной текст более узкого толкования.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Заглавные местоимения в отношении Иисуса использованы как устойчивое русское издательское оформление; синтаксис сделан ясным для широкого читателя.
