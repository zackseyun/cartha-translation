base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/056.yaml
  text: And are not all his sisters with us? Where then did this man get all these things?[a]
translation:
  language: ru
  text: И разве не все его сёстры среди нас? Откуда же у этого человека всё это?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родственницы женского пола». Греческое слово здесь обычно означает «сёстры», однако некоторые понимают его шире в свете позднейших богословских дискуссий.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφαὶ
  choice: сёстры
  rationale: Обычное родственное значение слова естественно в контексте, где жители говорят о семье Иисуса; более широкое толкование не следует вносить в основной текст.
- source_word: οὐχὶ πᾶσαι
  choice: разве не все
  rationale: Оборот передаёт риторический вопрос, предполагающий утвердительный ответ, и сохраняет акцент на всех сёстрах.
- source_word: πρὸς ἡμᾶς
  choice: живут среди нас
  rationale: Греческое выражение обозначает присутствие и связь с местной общиной. Добавление «живут» делает эту идиому естественной по-русски, не меняя её смысла.
- source_word: πόθεν οὖν
  choice: Откуда же
  rationale: «Откуда» сохраняет вопрос об источнике, а частица «же» естественно передаёт логический вывод οὖν в русской речи.
- source_word: τούτῳ
  choice: у Него
  rationale: Русская конструкция «откуда у него» естественно передаёт дательный падеж принадлежности/обладания; местоимение в контексте ясно указывает на Иисуса. Заглавная буква соответствует принятому русскому библейскому стилю.
- source_word: ταῦτα πάντα
  choice: всё это
  rationale: Собирательное русское выражение точно и естественно указывает на ранее упомянутые мудрость и чудеса.
theological_decisions:
- issue: Кого обозначает слово ἀδελφαὶ применительно к Иисусу
  choice: Передать в основном тексте обычным значением «сёстры».
  alternative: «родственницы» или «двоюродные сёстры»
  rationale: Контекст семейного перечисления поддерживает прямое значение «сёстры». Перевод не должен разрешать возникшие позднее богословские споры за пределами того, что прямо выражает греческий текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Риторические вопросы звучат естественно для обычного читателя; формулировка не привносит конфессионального толкования.
