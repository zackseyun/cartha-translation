  text: And the blind and the lame came to him in the temple[a], and he healed them.
translation:
  language: ru
  text: И в храме[a] к Нему подошли слепые и хромые, и Он исцелил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово ἱερόν означает храмовый комплекс, то есть его территорию и сооружения, а не только внутреннее святилище.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: подошли
  rationale: Глагол προσέρχομαι обозначает приближение к кому-либо. «Подошли» естественно передаёт направленное движение к Иисусу и точнее, чем более общее «пришли».
- source_word: αὐτῷ
  choice: к Нему
  rationale: Дательный падеж при προσέρχομαι указывает на того, к кому подошли; по-русски это естественно выражается сочетанием «к Нему».
- source_word: τυφλοὶ
  choice: слепые
  rationale: Субстантивированное прилагательное во множественном числе; краткий русский эквивалент сохраняет форму и смысл греческого текста.
- source_word: χωλοὶ
  choice: хромые
  rationale: Субстантивированное прилагательное обозначает людей с нарушением способности ходить. «Хромые» — традиционное, точное и понятное соответствие без более резкой дополнительной окраски.
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: ἱερόν обозначает храмовый комплекс в целом, а не только внутреннее святилище. Выражение «в храме» естественно для русского текста, а пространственный нюанс пояснён в сноске.
- source_word: ἐθεράπευσεν
  choice: исцелил
  rationale: В повествованиях Евангелий θεραπεύω обычно означает исцеление от болезни или телесного недуга. «Исцелил» точно и стилистически уместно передаёт смысл.
theological_decisions:
- issue: Место исцеления, обозначенное словом ἱερόν
  choice: Иисус исцелил их на территории храмового комплекса.
  alternative: Иисус исцелил их во дворах храма.
  rationale: Слово ἱερόν обычно относится ко всему храмовому комплексу, а не к внутреннему святилищу (ναός). Основной текст сохраняет естественное «в храме», а сноска предотвращает ошибочное сужение смысла.
translation_notes:
  register: Современный литературный русский язык с лаконичным, повествовательным и достойным библейского текста строем. Заглавные буквы в местоимениях «Нему» и «Он» используются как принятая в русском религиозном письме форма почтительного обозначения Иисуса; они не добавляют смыслового различия к греческому тексту.
