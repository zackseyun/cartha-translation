id: MAT.21.33
reference: Matthew 21:33
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἀκούσατε. ⸀Ἄνθρωπος ἦν οἰκοδεσπότης ὅστις ἐφύτευσεν ἀμπελῶνα καὶ φραγμὸν αὐτῷ περιέθηκεν καὶ ὤρυξεν ἐν αὐτῷ ληνὸν καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/033.yaml
  text: 'Listen to another parable: There was a landowner who planted a vineyard and put a fence around it and dug a winepress in it and built a tower[a], and leased it to tenant farmers[c][b], and went away.'
translation:
  language: ru
  text: Послушайте другую притчу. Был один землевладелец, который насадил виноградник, обнёс его оградой[b], выкопал в нём давильню и построил башню[a]. Затем он сдал виноградник в аренду виноградарям[c] и уехал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Образы насаждённого виноградника, ограды, давильни и башни перекликаются с Ис 5:1–2.
    reason: cross_reference
  - marker: b
    text: 'Или: «обнёс его живой изгородью». Греческое слово может обозначать ограду, забор или живую изгородь.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «сдал его земледельцам». Речь идёт о людях, которые брали виноградник в аренду и возделывали его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἀκούσατε
  choice: Послушайте другую притчу
  rationale: Аористный императив ἀκούσατε передан естественным для современного русского языка прямым призывом «послушайте»; παραβολή — устойчиво «притча».
- source_word: Ἄνθρωπος ἦν οἰκοδεσπότης
  choice: Был один землевладелец
  rationale: В сельскохозяйственном контексте οἰκοδεσπότης обозначает хозяина владения; «землевладелец» ясно передаёт его роль, а оборот «был один» естественно вводит персонажа притчи.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: насадил виноградник
  rationale: Традиционное и живое русское сочетание точно сохраняет конкретный образ посадки виноградника и перекличку с Ис 5:1–2.
- source_word: φραγμὸν αὐτῷ περιέθηκεν
  choice: обнёс его оградой
  rationale: φραγμός означает окружающую преграду — ограду, забор или живую изгородь; нейтральное «ограда» не уточняет материал.
- source_word: ὤρυξεν ἐν αὐτῷ ληνὸν
  choice: выкопал в нём давильню
  rationale: ὀρύσσω означает «копать», а ληνός — устройство для выжимания винограда. «Давильня» сохраняет древний сельскохозяйственный образ и не смешивает пресс с сосудом для сока.
- source_word: ᾠκοδόμησεν πύργον
  choice: построил башню
  rationale: πύργος прямо означает «башня»; её вероятная сторожевая функция не добавлена в основной текст.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: сдал виноградник в аренду виноградарям
  rationale: Средний залог ἐκδίδωμι здесь означает сдачу в аренду, а γεωργοί в контексте — возделывающие виноградник арендаторы. Повтор существительного вместо местоимения устраняет возможную двусмысленность по-русски.
- source_word: ἀπεδήμησεν
  choice: уехал
  rationale: Глагол означает отъезд из своей местности; «уехал» точно передаёт смысл, не добавляя не названного в тексте места назначения.
theological_decisions:
- issue: Перекличка образа виноградника с Исайей 5:1–2
  choice: Сохранить конкретные сельскохозяйственные образы, а аллюзию отметить в сноске.
  alternative: Усилить связь в основном тексте традиционной формулировкой или прямо назвать пророчество.
  rationale: Матфей явно использует знакомую образность Ис 5, однако её истолкование не следует вносить в слова самой притчи.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Синтаксис слегка разделён словом «Затем», чтобы длинное греческое перечисление звучало ясно, без потери последовательности действий. Термин «давильня» конкретен и понятен из контекста; сноски сохраняют значимые лексические варианты.
