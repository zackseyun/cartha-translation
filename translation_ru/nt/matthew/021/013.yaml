id: MAT.21.13
reference: Matthew 21:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Γέγραπται· Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται, ὑμεῖς δὲ αὐτὸν ⸀ποιεῖτε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/013.yaml
  text: And he says to them[a], “It is written[b], ‘My house will be called a house of prayer,’ but you are making it a den of robbers.”
translation:
  language: ru
  text: 'И говорит им: «Написано: „Мой дом будет назван домом молитвы“[a], а вы делаете его притоном разбойников[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Иисус соединяет здесь слова из Исайи 56:7 и Иеремии 7:11.
    reason: cross_reference
  - marker: b
    text: 'Или: «грабителей»; греческое слово может обозначать грабителей, разбойников или бандитов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: говорит
  rationale: Сохранён исторический презенс греческого повествования, придающий сцене живость; такая форма естественна и в русском библейском повествовании.
- source_word: Γέγραπται
  choice: Написано
  rationale: Устойчивая русская формула введения цитаты из Писания; передаёт сохраняющую силу результата перфекта.
- source_word: Ὁ οἶκός μου
  choice: Мой дом
  rationale: Сохранено буквальное «дом», поскольку это ключевое обозначение в цитате; «храм» было бы более узким толкованием.
- source_word: οἶκος προσευχῆς
  choice: дом молитвы
  rationale: Естественно передаёт греческую конструкцию и сохраняет узнаваемую связь с Ис 56:7.
- source_word: κληθήσεται
  choice: будет назван
  rationale: Прямо передаёт будущее время и пассивный залог.
- source_word: ποιεῖτε
  choice: делаете
  rationale: Настоящее время передаёт продолжающееся действие и остаётся близким к греческому глаголу, не добавляя значения превращения.
- source_word: σπήλαιον
  choice: притоном
  rationale: В данном контексте означает укрытие или логово преступников; «притон» естественно звучит по-русски и сохраняет обвинительную силу аллюзии на Иер 7:11.
- source_word: λῃστῶν
  choice: разбойничьим
  rationale: «Разбойники» передаёт не только воровство, но и возможный оттенок вооружённого насилия, присущий λῃστής.
theological_decisions:
- issue: Сочетание ветхозаветных цитат и аллюзий
  choice: Сохранить узнаваемые формулировки «Мой дом… домом молитвы» и «разбойничьим притоном».
  alternative: Передать смысл более свободно, например «место поклонения» и «убежище преступников».
  rationale: Высказывание соединяет Ис 56:7 и Иер 7:11; узнаваемость обоих мест важна для прозрачности межтекстовой связи.
- issue: Значение λῃστῶν
  choice: разбойников / разбойничьим
  alternative: грабителей / бандитов
  rationale: Выбор сохраняет возможный оттенок насильственного грабежа, не ограничивая слово только тайным хищением или политическим мятежом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Исторический презенс сохранён. Порядок «И говорит им» слегка маркирован, но естественен для повествовательного регистра и отражает καὶ λέγει αὐτοῖς. Сноски поставлены после всей реплики, поскольку первая поясняет сочетание цитат, а вторая — лексему в её заключительной части.
