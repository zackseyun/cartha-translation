  text: ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Οὐ θέλω· ὕστερον δὲ μεταμεληθεὶς⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/029.yaml
  text: But he answered[b][a], ‘I do not want to.’ But later he changed his mind and went.
translation:
  language: ru
  text: 'Он ответил: «Не хочу». Но позже передумал[a] и пошёл.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пожалел о своём отказе», «одумался». Греческое слово может подразумевать сожаление, которое приводит к перемене решения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: Он ответил
  rationale: Обычная повествовательная формула естественно передаётся личной формой глагола; значение причастия сохраняется.
- source_word: Οὐ θέλω
  choice: Не хочу
  rationale: Краткий прямой отказ, передающий значение желания или готовности; современнее и точнее в данном контексте, чем категорическое «не пойду».
- source_word: ὕστερον
  choice: позже
  rationale: Точно и естественно обозначает последующее время.
- source_word: μεταμεληθεὶς
  choice: передумал
  rationale: Передаёт перемену намерения, приведшую к изменению поведения, не усиливая выражение до богословски нагруженного «покаялся»; оттенок сожаления отмечен в сноске.
- source_word: ἀπῆλθεν
  choice: пошёл
  rationale: В контексте означает, что сын отправился исполнять просьбу; «пошёл» естественно и достаточно ясно.
theological_decisions:
- issue: Передача μεταμεληθεὶς в контексте притчи
  choice: передумал
  alternative: раскаялся; пожалел о своём отказе
  rationale: Греческое слово допускает сожаление, ведущее к перемене решения, однако «раскаялся» может неоправданно конкретизировать богословский смысл. «Передумал» сохраняет основной повествовательный акцент на переходе от отказа к исполнению.
translation_notes:
  register: Современный литературный русский язык; прямая речь краткая и естественная, тон повествования простой и достойный. Союз «но» сохраняет противопоставление между первоначальным отказом и последующим поступком.
