  text: διὰ τοῦτο λέγω ὑμῖν ὅτι ἀρθήσεται ἀφ’ ὑμῶν ἡ βασιλεία τοῦ θεοῦ καὶ δοθήσεται ἔθνει ποιοῦντι τοὺς καρποὺς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/043.yaml
  text: Therefore I tell you[a], the kingdom of God will be taken away from you and given to a nation producing its fruits.
translation:
  language: ru
  text: 'Поэтому говорю вам: Царство Божье будет отнято у вас и дано народу[a], приносящему плоды Царства.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нации». Греческое ἔθνος может обозначать народ или нацию; здесь речь идёт о совокупности людей, отличающейся тем, что она приносит плоды, без более точного указания, кто именно имеется в виду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Передаёт вывод из предшествующих притчи и цитаты кратко и естественно.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Сохраняет прямую речевую формулу и личное обращение.
- source_word: ἀρθήσεται ἀφ’ ὑμῶν
  choice: будет отнято у вас
  rationale: Передаёт будущий пассив и отделение от нынешних обладателей; по-русски сочетание звучит естественно.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Царство Божье
  rationale: Устоявшийся современный русский эквивалент, сохраняющий смысловую широту понятия βασιλεία.
- source_word: δοθήσεται
  choice: и дано
  rationale: Сохраняет согласованный с первым сказуемым будущий пассив без ненужного повторения подлежащего.
- source_word: ἔθνει
  choice: народу
  rationale: В данном контексте обозначает совокупного получателя; «народ» естественнее по-русски, чем «нация», и не сужает его до язычников или конкретного этноса.
- source_word: ποιοῦντι
  choice: приносящему
  rationale: В сочетании с плодами это естественная русская метафора, передающая продолжающееся действие причастия.
- source_word: τοὺς καρποὺς αὐτῆς
  choice: его плоды
  rationale: Сохраняет множественное число и наиболее естественно относит местоимение к Царству Божьему.
theological_decisions:
- issue: Кого обозначает ἔθνει
  choice: Обобщённо переведено как «народу» без отождествления с церковью, язычниками или остатком Израиля.
  alternative: «нации»; «языческому народу»; прямое указание на церковь
  rationale: Греческий текст называет совокупного получателя, характеризуемого плодами, но сам по себе не требует более узкого богословского отождествления.
- issue: Значение выражения «Царство Божье»
  choice: Сохранено «Царство Божье».
  alternative: «владычество Бога»; «привилегии Царства»
  rationale: Буквальное выражение сохраняет полноту и напряжение исходного смысла, не сводя его лишь к правлению или религиозным привилегиям.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены пассивные конструкции и образ плодов; двоеточие естественно вводит содержание высказывания.
