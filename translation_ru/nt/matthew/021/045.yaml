  text: Καὶ ἀκούσαντες οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι τὰς παραβολὰς αὐτοῦ ἔγνωσαν ὅτι περὶ αὐτῶν λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/045.yaml
  text: And when the chief priests and the Pharisees heard his parables[a], they knew that he was speaking about them.
translation:
  language: ru
  text: Услышав Его притчи, первосвященники и фарисеи поняли, что Он говорит о них.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «относительно них». Они поняли, что притчи относятся к ним. Перевод «против них» яснее выражает подразумеваемую критику, но усиливает значение греческого выражения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: услышав
  rationale: Аористное причастие перед главным глаголом естественно передаёт предшествующее или сопутствующее обстоятельство; деепричастие «услышав» кратко и точно сохраняет структуру греческой фразы.
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся русское обозначение высшего священнического руководства; форма множественного числа в данном контексте не означает нескольких одновременно действующих верховных первосвященников.
- source_word: Φαρισαῖοι
  choice: фарисеи
  rationale: Общепринятая русская передача названия иудейской религиозной группы.
- source_word: παραβολὰς
  choice: притчи
  rationale: Традиционный и понятный современному читателю термин для образных рассказов и изречений Иисуса.
- source_word: ἔγνωσαν
  choice: поняли
  rationale: В контексте аорист γινώσκω обозначает распознание, осознание смысла; «поняли» естественнее по-русски, чем буквальное «узнали», и не усиливает значение.
- source_word: περὶ αὐτῶν
  choice: о них
  rationale: περί с родительным падежом прямо означает «о, относительно». Перевод «против них» сделал бы подразумеваемую критику частью лексического значения предлога.
- source_word: λέγει
  choice: говорит
  rationale: Историческое настоящее сохранено как настоящее время в придаточном изъяснительном; по-русски такая конструкция естественна и передаёт живость греческой формы.
theological_decisions:
- issue: Следует ли прямо обозначить притчи как направленные против религиозных руководителей
  choice: Он говорит о них
  alternative: Он говорит против них
  rationale: Греческое περὶ αὐτῶν выражает тему речи — «о них». Контекст показывает критическую направленность, однако перевод не должен заменять эту контекстуальную импликацию более сильным значением «против».
translation_notes:
  register: Современный литературный русский язык с традиционной библейской терминологией. Порядок слов сделан естественным для русского; прописные местоимения «Его», «Он» соответствуют распространённой русской библейской издательской норме, не добавляя отдельного смыслового утверждения.
