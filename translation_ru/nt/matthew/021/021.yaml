review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод точно передаёт структуру и главные лексические элементы греческого текста, включая условие веры, запрет на сомнение и образ горы. Однако формула «то, что было сделано со смоковницей» неудачна: она создаёт впечатление, что над смоковницей было совершено не названное действие, тогда как τὸ τῆς συκῆς — эллиптическая отсылка к только что описанному случаю со смоковницей. Формулировка «то, что произошло со смоковницей» яснее передаёт эту отсылку, хотя и сохраняет исходную эллиптичность.'
  naturalness: «Иисус ответил им» естественнее современного несколько тяжеловесного «сказал им в ответ». В прямой речи «если у вас есть вера» лучше соответствует настоящему сослагательному ἔχητε и по-русски звучит непосредственно. «Поднимись и будь брошена» понятно, но сочетание возвратительного повеления с пассивным повелением стилистически неровно; «Поднимись, и пусть тебя бросят в море» сохраняет пассивный смысл второго глагола и звучит естественно.
  terminology: «Вера», «усомнитесь», «смоковница», «гора» и «море» уместны и соответствуют современному литературному, сдержанно торжественному регистру. Сноска корректно отмечает возможные оттенки διακρίνω и привязана к нужному слову.
  issues:
  - severity: medium
    issue: Неясная передача τὸ τῆς συκῆς
    rationale: «То, что было сделано со смоковницей» вводит невыраженного деятеля и меняет характер отсылки к предшествующему событию. Следует сказать «то, что произошло со смоковницей».
  - severity: low
    issue: Стилистически неровная форма повелений горе
    rationale: «Поднимись и будь брошена» соединяет возвратительную форму с пассивной и звучит искусственно. Вариант с «пусть тебя бросят» естественно выражает второй пассивный императив.
