  to: 'Иисус ответил им: «Истинно говорю вам: если у вас есть вера и вы не усомнитесь[a], то не только сделаете то, что произошло со смоковницей, но даже если скажете этой горе: „Поднимись, и пусть тебя бросят в море“, — так и будет».'
