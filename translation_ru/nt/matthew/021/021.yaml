id: MAT.21.21
reference: Matthew 21:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐὰν ἔχητε πίστιν καὶ μὴ διακριθῆτε, οὐ μόνον τὸ τῆς συκῆς ποιήσετε, ἀλλὰ κἂν τῷ ὄρει τούτῳ εἴπητε· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, γενήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/021.yaml
  text: But Jesus answered them[a], “Truly I say to you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be taken up and thrown into the sea,’ it will happen.”
translation:
  language: ru
  text: 'Иисус ответил им: «Истинно говорю вам: если у вас есть вера и вы не усомнитесь[a], то не только сделаете то, что произошло со смоковницей, но даже если скажете этой горе: „Поднимись, и пусть тебя бросят в море“, — так и будет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «не будете колебаться»; возможен также смысл «не будете внутренне раздваиваться».
    reason: Лексический диапазон διακρίνω включает сомнение, колебание и внутреннюю раздвоенность.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Иисус же сказал им в ответ
  rationale: Оборот естественно передаёт ответный характер причастия ἀποκριθείς; частица δέ выражена мягким переходным «же», без усиления противопоставления.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Истинно говорю вам
  rationale: Сохраняет торжественную и авторитетную вводную формулу Иисуса в ясном современном русском языке.
- source_word: ἐὰν ἔχητε πίστιν
  choice: если у вас будет вера
  rationale: В данном контексте πίστις означает доверительную уверенность в Боге; «вера» остаётся наиболее точным и привычным соответствием.
- source_word: μὴ διακριθῆτε
  choice: не усомнитесь
  rationale: В контексте глагол обозначает внутреннее сомнение или колебание. Основной вариант краток и естественен, а более широкие оттенки отмечены в сноске.
- source_word: οὐ μόνον τὸ τῆς συκῆς ποιήσετε
  choice: сделаете не только то, что было сделано со смоковницей
  rationale: Так раскрывается эллиптическое греческое выражение τὸ τῆς συκῆς с опорой на непосредственно предшествующее событие, без добавления его толкования.
- source_word: κἂν
  choice: но даже если
  rationale: Передаёт усиленный условный переход от смоковницы к ещё более поразительному образу горы.
- source_word: τῷ ὄρει τούτῳ
  choice: этой горе
  rationale: Сохраняет указательное местоимение и обычное значение ὄρος — «гора».
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: Поднимись и будь брошена в море
  rationale: Сохраняет физический образ и пассивную форму второго повеления; русская формулировка намеренно несколько торжественна, но остаётся понятной.
- source_word: γενήσεται
  choice: так и будет
  rationale: Естественно передаёт обещание, что названное событие произойдёт, не добавляя объяснения механизма.
theological_decisions:
- issue: Значение πίστις в изречении о чудесном действии
  choice: вера
  alternative: доверие; верность
  rationale: Речь идёт прежде всего об уверенном доверии, а не о верности как устойчивом качестве; «вера» сохраняет богословскую ёмкость слова.
- issue: Характер образа перемещения горы
  choice: Сохранить образ без уточнения, является ли обещание буквальным или гиперболически-метафорическим
  alternative: Истолковать только как буквальное чудо либо только как метафору преодоления трудностей
  rationale: Исходный текст не объясняет образ и сохраняет его напряжённую, предельно сильную форму; перевод не должен заранее сужать её смысл.
translation_notes:
  register: Современный литературный русский язык с достойным, слегка торжественным звучанием прямой речи. Архаизмы устранены; яркий образ горы и смысловая напряжённость изречения сохранены.
