source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν μίαν ἐπὶ τῆς ὁδοῦ ἦλθεν ἐπ’ αὐτήν, καὶ οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον, καὶ λέγει αὐτῇ· ⸀Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα· καὶ ἐξηράνθη παραχρῆμα ἡ συκῆ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/019.yaml
  text: And seeing a fig tree by the road[a], he came up to it and found nothing on it except leaves alone. And he said to it, “May there no longer ever be fruit from you.” And the fig tree withered at once.
translation:
  language: ru
  text: 'Увидев у дороги смоковницу, Он подошёл к ней и не нашёл на ней ничего, кроме одних листьев. И сказал ей: «Пусть от тебя больше вовек не будет плода».[a] И смоковница тотчас засохла.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или более естественно: «Пусть от тебя больше никогда не будет плода».'
    reason: 'Лексико-стилистический вариант: основной текст сохраняет торжественное «вовек» для εἰς τὸν αἰῶνα, а примечание даёт более обычный современный оборот; оба варианта передают μηκέτι и образ ἐκ σοῦ («от тебя»).'
lexical_decisions:
- source_word: συκῆν μίαν
  choice: смоковницу
  rationale: В данном контексте μίαν естественно вводит неопределённый единичный предмет; отдельное «одну» по-русски излишне подчёркивало бы число.
- source_word: ἐπὶ τῆς ὁδοῦ
  choice: у дороги
  rationale: Локативное значение ἐπί с родительным передано естественным русским оборотом; дерево находится возле дороги, а не на её проезжей части.
- source_word: ἦλθεν ἐπ’ αὐτήν
  choice: подошёл к ней
  rationale: Передаёт направленное приближение к дереву и звучит естественно по-русски.
- source_word: οὐδὲν εὗρεν ἐν αὐτῇ
  choice: не нашёл на ней ничего
  rationale: Для листьев и плодов на дереве русский язык требует «на ней», хотя греческий предлог буквально имеет значение «в».
- source_word: εἰ μὴ φύλλα μόνον
  choice: кроме одних листьев
  rationale: 'Сохраняет эмфазу μόνον: на дереве были исключительно листья.'
- source_word: λέγει αὐτῇ
  choice: сказал ей
  rationale: Историческое настоящее сглажено прошедшим временем согласно нормам современного русского повествования.
- source_word: Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα
  choice: Пусть от тебя вовеки больше не будет плода
  rationale: Сохраняются источник плода («от тебя»), значение прекращения в μηκέτι и непреходящая длительность εἰς τὸν αἰῶνα; формула остаётся торжественным волеизъявлением, а не превращается в простое предсказание.
- source_word: ἐξηράνθη παραχρῆμα
  choice: тотчас засохла
  rationale: «Засохла» естественно описывает смоковницу, а «тотчас» точно передаёт немедленность παραχρῆμα.
theological_decisions:
- issue: Сила обращения Иисуса к смоковнице
  choice: 'Передать как торжественное волеизъявление: «Пусть от тебя вовеки больше не будет плода».'
  alternative: 'Передать как предсказание: «От тебя больше никогда не будет плода».'
  rationale: Сослагательное γένηται с μηκέτι здесь выражает запретительно-импрекативное провозглашение. Русское «пусть» сохраняет эту силу, не объясняя механизм и не добавляя символического толкования.
translation_notes:
  register: Современный литературный русский язык с dignified библейской интонацией. Местоимение «Он» написано с прописной буквы по устойчивой русской издательской традиции; синтаксис остаётся ясным для широкого читателя. Символическое значение смоковницы в текст не внесено.
