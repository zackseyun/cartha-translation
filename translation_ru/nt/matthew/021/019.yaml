  terminology: «Смоковница», «плод», «листья», «тотчас» и обращение к дереву употреблены уместно. Прописное «Он» допустимо в заявленной издательской традиции и не влияет на смысл. Примечание следует привести в соответствие с естественным русским вариантом, не подменяя образ «от тебя» оборотом «на тебе».
