  text: πάλιν ἀπέστειλεν ἄλλους δούλους πλείονας τῶν πρώτων, καὶ ἐποίησαν αὐτοῖς ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/036.yaml
  text: Again he sent other servants[a], more than the first ones, and they did the same to them.
translation:
  language: ru
  text: И снова он послал других слуг[a], больше, чем в первый раз, и с ними поступили так же.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рабов». Греческое слово δοῦλος в зависимости от контекста может означать как слугу, так и раба.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: И снова
  rationale: Передаёт повторность действия и естественно связывает стих с предыдущим повествованием.
- source_word: ἀπέστειλεν
  choice: он послал
  rationale: Прямой и естественный эквивалент аориста ἀποστέλλω в повествовательном контексте.
- source_word: ἄλλους δούλους
  choice: других слуг
  rationale: В притче эти люди выступают как посланцы хозяина; «слуг» естественно в современном русском, тогда как возможное «рабов» сохранено в примечании.
- source_word: πλείονας τῶν πρώτων
  choice: больше, чем в первый раз
  rationale: 'Сравнение относится к числу посланных: во второй раз хозяин отправил более многочисленную группу. Такая формулировка естественнее буквального «больше первых».'
- source_word: ἐποίησαν αὐτοῖς ὡσαύτως
  choice: с ними поступили так же
  rationale: Русская идиома точно передаёт действие по отношению к людям и отсылает к описанному в предыдущем стихе обращению с первой группой.
theological_decisions:
- issue: Передача δοῦλος в притче
  choice: слуг
  alternative: рабов
  rationale: В данном контексте на первом плане служение хозяину и роль посланцев, а не их юридический статус. При этом лексическая возможность значения «рабы» прямо отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; ясный и достойный повествовательный стиль. Союз «но» естественно выражает контраст между новой отправкой слуг и повторением прежнего насилия, не изменяя событийной связи греческого καί.
