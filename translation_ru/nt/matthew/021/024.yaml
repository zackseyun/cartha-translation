source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἐρωτήσω ὑμᾶς κἀγὼ λόγον ἕνα, ὃν ἐὰν εἴπητέ μοι κἀγὼ ὑμῖν ἐρῶ ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/024.yaml
  text: But Jesus answered them[a], “I also will ask you one question, which if you tell me, I also will tell you by what authority I do these things.”
translation:
  language: ru
  text: 'Но Иисус ответил им: «И Я задам вам один вопрос[a]. Если вы ответите Мне, то и Я скажу вам, какой властью это делаю».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одно дело»; букв. «одно слово». Греческое выражение λόγον ἕνα может обозначать вопрос или предмет обсуждения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Но Иисус ответил им
  rationale: Причастие ἀποκριθείς вместе с εἶπεν образует обычную повествовательную формулу ответа; по-русски естественно передать её одним глаголом «ответил». δέ выражает здесь лёгкое противопоставление.
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ
  choice: И Я задам вам
  rationale: 'κἀγώ подчёркивает ответное, взаимное действие: они спросили Иисуса, и Он, в свою очередь, задаёт вопрос им. Конструкция «задать вопрос» естественна для современного русского языка.'
- source_word: λόγον ἕνα
  choice: один вопрос
  rationale: Хотя λόγος буквально может означать «слово» или «дело, предмет обсуждения», в данном контексте речь идёт о встречном вопросе; этот смысл ясно передаёт «один вопрос».
- source_word: ὃν ἐὰν εἴπητέ μοι
  choice: Если вы ответите Мне
  rationale: Буквально относительная конструкция означает «который, если скажете Мне», но по-русски применительно к вопросу естественно «если вы ответите Мне»; условный смысл ἐάν сохранён.
- source_word: κἀγὼ ὑμῖν ἐρῶ
  choice: то и Я скажу вам
  rationale: «То и Я» сохраняет взаимность, выраженную повторным κἀγώ, и ясно связывает ответ Иисуса с поставленным условием.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: какой властью
  rationale: ἐν с ἐξουσία указывает на власть или полномочие, на основании которого совершается действие. «Какой властью» естественно сохраняет формулировку исходного вопроса.
- source_word: ταῦτα ποιῶ
  choice: это делаю
  rationale: Русское собирательное «это» естественно отсылает к совокупности обсуждаемых действий Иисуса, не сужая отсылку до одного поступка.
theological_decisions:
- issue: Характер ἐξουσία
  choice: власть
  alternative: полномочие
  rationale: «Власть» сохраняет широту греческого слова, которое может обозначать как реальную власть, так и право действовать; выбор «полномочие» сделал бы административный оттенок более узким и явным.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис слегка упрощён разделением длинного греческого периода на два предложения, при этом условие и взаимность реплик сохранены. Местоимение «Я» в прямой речи написано с прописной буквы согласно принятому благоговейному библейскому регистру.
