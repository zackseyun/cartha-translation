  source_fidelity: 'Текст точно передаёт греческую конструкцию ответа: δέ уместно отражено словом «Но», формула ἀποκριθεὶς … εἶπεν естественно сведена к «Иисус ответил», а повтор κἀγώ сохранён оборотами «И Я» и «то и Я». «Один вопрос» соответствует контекстуальному значению λόγον ἕνα; условие ὃν ἐὰν εἴπητέ μοι передано ясно и без утраты смысла. «Какой властью это делаю» верно передаёт ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.'
