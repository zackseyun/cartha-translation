base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/030.yaml
  text: Then he came to the second and said the same[a]. And he answered, ‘I will[b], sir,’ but he did not go.
translation:
  language: ru
  text: 'Подойдя ко второму, отец сказал ему то же самое. Тот ответил: «Я пойду[a], господин[b]», — но не пошёл.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я, господин» — краткий ответ, по смыслу означающий: «Я пойду» или «Я это сделаю».'
    reason: lexical_alternative
  - marker: b
    text: Греческое κύριε может также означать «Господи» или «хозяин». Здесь это уважительное обращение к отцу-человеку.
    reason: alternative_reading
lexical_decisions:
- source_word: προσελθὼν
  choice: подойдя
  rationale: Деепричастие передаёт предшествующее движение отца к сыну и естественно звучит в русском повествовании.
- source_word: τῷ δευτέρῳ
  choice: ко второму
  rationale: Сохраняется краткость греческого текста; из ближайшего контекста ясно, что речь идёт о втором сыне.
- source_word: ὡσαύτως
  choice: то же самое
  rationale: Выражение указывает, что второму сыну отец обратился с тем же поручением.
- source_word: ἀποκριθεὶς εἶπεν
  choice: ответил
  rationale: Обычная греческая формула естественно передаётся одним русским глаголом без избыточного «ответив, сказал».
- source_word: Ἐγώ
  choice: Я пойду
  rationale: В греческом стоит только подчёркнутое «я», но это эллиптическое согласие исполнить поручение; добавление подразумеваемого глагола делает ответ ясным по-русски.
- source_word: κύριε
  choice: господин
  rationale: Здесь это уважительное обращение к земному отцу, а не обязательный божественный титул. «Господин» сохраняет уважение и связь со значением κύριος, хотя в современной семейной речи звучит необычно.
- source_word: καὶ οὐκ ἀπῆλθεν
  choice: но не пошёл
  rationale: Противительный союз естественно выражает смысловой контраст между обещанием и поступком, заложенный в контексте.
theological_decisions:
- issue: Передача κύριε в обращении сына к отцу
  choice: господин
  alternative: Господь; хозяин; отец
  rationale: Контекст говорит об уважительном обращении к человеку. «Господь» внесло бы не требуемый контекстом божественный или мессианский оттенок, «хозяин» изменило бы семейное отношение, а «отец» было бы контекстуальным уточнением вместо перевода самого слова.
translation_notes:
  register: Современный литературный русский язык с естественным повествовательным синтаксисом. Слово «отец» введено как явный субъект, чтобы избежать неясности местоимения после эллиптического «ко второму»; это лицо прямо установлено ближайшим контекстом. Обращение «господин» намеренно сохраняет уважительный характер κύριε и его смысловую широту, а примечание поясняет непривычность такого обращения в современной русской семье.
