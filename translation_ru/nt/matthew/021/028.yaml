  text: Τί δὲ ὑμῖν δοκεῖ; ἄνθρωπος εἶχεν τέκνα δύο. ⸀προσελθὼν τῷ πρώτῳ εἶπεν· Τέκνον, ὕπαγε σήμερον ἐργάζου ἐν τῷ ⸀ἀμπελῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/028.yaml
  text: But what do you think? A man had two children. Going to the first[a], he said, ‘Child, go work today in the vineyard.’
translation:
  language: ru
  text: 'А как вы думаете? У одного человека было двое детей. Подойдя к первому, он сказал: «Дитя, иди сегодня работай в винограднике».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί δὲ ὑμῖν δοκεῖ;
  choice: А как вы думаете?
  rationale: Естественно передаёт обращённый к слушателям вопрос и сохраняет лёгкую связующую силу δέ с помощью «А».
- source_word: ἄνθρωπος
  choice: у одного человека
  rationale: Вводит персонажа естественным для русской притчевой речи оборотом, не добавляя отсутствующего в греческом указания вроде «некий».
- source_word: τέκνα δύο
  choice: двое детей
  rationale: Сохраняет широкое значение τέκνα «дети», не сужая его до «сыновья»; собирательное числительное «двое» нормативно и естественно с существительным «дети».
- source_word: προσελθὼν τῷ πρώτῳ
  choice: подойдя к первому
  rationale: Точно и плавно передаёт аористное причастие и порядковое обозначение первого ребёнка.
- source_word: Τέκνον
  choice: Дитя
  rationale: Передаёт более широкое τέκνον без сужения до «сын»; «дитя» пригодно как непосредственное, несколько торжественное обращение в библейской притче.
- source_word: ὕπαγε σήμερον ἐργάζου
  choice: пойди сегодня поработай
  rationale: Передаёт оба императива и временное наречие; совершенный вид «поработай» естественно выражает поручение на сегодняшний день.
- source_word: ἐν τῷ ἀμπελῶνι
  choice: в винограднике
  rationale: Прямо сохраняет пространственное значение ἐν и сельскохозяйственный образ виноградника.
theological_decisions:
- issue: Следует ли переводить τέκνα/τέκνον по традиции как «сыновья/сын»
  choice: детей / Дитя
  alternative: сыновей / Сын
  rationale: В данном стихе употреблены общие родственные термины τέκνα и τέκνον, а не υἱοί и υἱέ. Более широкая передача сохраняет исходную лексику и не вносит преждевременного смыслового сужения.
translation_notes:
  register: Современный литературный русский язык с достоинством притчевой речи. Синтаксис сделан естественным для устного вопроса и краткого повествования; лексическая широта τέκνα/τέκνον сохранена без конфессионального истолкования.
