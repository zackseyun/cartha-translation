  text: Καὶ ὅτε ἤγγισαν εἰς Ἱεροσόλυμα καὶ ἦλθον εἰς Βηθφαγὴ ⸀εἰς τὸ Ὄρος τῶν Ἐλαιῶν, τότε ⸀Ἰησοῦς ἀπέστειλεν δύο μαθητὰς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/001.yaml
  text: And when they came near to Jerusalem and came to Bethphage[a], to the Mount of Olives, then Jesus sent two disciples
translation:
  language: ru
  text: Когда они приблизились к Иерусалиму и пришли в Вифагию, к Масличной горе, тогда Иисус послал двух учеников.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγγισαν
  choice: приблизились
  rationale: Аорист ἐγγίζω обозначает пространственное приближение; «приблизились» естественно и точно передаёт движение к Иерусалиму.
- source_word: Ἱεροσόλυμα
  choice: Иерусалиму
  rationale: Устоявшаяся русская форма названия города; дательный падеж обусловлен глаголом «приблизились».
- source_word: ἦλθον
  choice: пришли
  rationale: Обычное значение ἔρχομαι в повествовании; сохраняется отличие от предшествующего «приблизились» без излишне сильного значения полного прибытия.
- source_word: Βηθφαγὴ
  choice: Вифагию
  rationale: Традиционная и узнаваемая русская передача данного топонима.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: к Масличной горе
  rationale: Предлог εἰς сохраняет направительное значение; формулировка допускает понимание Вифагии как пункта у Масличной горы и не превращает гору в место, внутрь которого вошли.
- source_word: τότε
  choice: опущено как явно подразумеваемый переход
  rationale: В русском повествовании последовательность естественно выражена порядком событий; буквальное «тогда» здесь утяжеляло бы фразу, не добавляя существенного смысла.
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Прямое и естественное обозначение отправления учеников с поручением.
- source_word: δύο μαθητὰς
  choice: двух учеников
  rationale: Стандартная передача числительного и существительного μαθητής в евангельском контексте.
theological_decisions:
- issue: Подлежащее глаголов множественного числа до упоминания Иисуса
  choice: 'Сохранить невыраженное в стихе групповое подлежащее: «они приблизились… и пришли…», назвав Иисуса там, где Он назван в греческом тексте.'
  alternative: «Иисус и Его ученики приблизились…»
  rationale: Контекст позволяет установить состав группы, однако сам стих этого прямо не уточняет; выбранный вариант сохраняет повествовательную сжатость оригинала.
- issue: Связь Вифагии с Масличной горой
  choice: «пришли в Вифагию, к Масличной горе»
  alternative: «пришли в Вифагию на Масличной горе»
  rationale: Греческая последовательность с εἰς допускает некоторую синтаксико-географическую неоднозначность. Направительное «к» ближе к форме источника и не уточняет сверх текста точное расположение селения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный повествовательный регистр. Сохранена исходная последовательность движений и не добавлено явное «Иисус и ученики» к подразумеваемому множественному подлежащему.
