translation:
  language: ru
  text: И всё, чего ни попросите в молитве с верой[a], получите.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё, что попросите».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: всё, чего ни
  rationale: 'Сочетание πᾶς с ὅσος имеет всеобъемлющий смысл: «всё, что» или «чего бы ни». Оборот «всё, чего ни попросите» естественно передаёт открытый объём выражения.'
- source_word: ἂν αἰτήσητε
  choice: попросите
  rationale: Ἄν с аористом сослагательного наклонения входит в неопределённо-относительную конструкцию. Русский оборот с «ни» передаёт эту неопределённость без избыточного модального слова «бы».
- source_word: ἐν τῇ προσευχῇ
  choice: в молитве
  rationale: 'Предложное сочетание естественно и точно передаёт обстоятельственную сферу действия: просьба обращается в молитве.'
- source_word: πιστεύοντες
  choice: веря
  rationale: Причастие настоящего времени обозначает действие, сопровождающее просьбу. Деепричастие «веря» сохраняет связь с подлежащим и не превращает оборот в явно условное предложение.
- source_word: λήμψεσθε
  choice: получите
  rationale: Будущая форма λαμβάνω в данном контексте прямо и естественно передаётся глаголом «получите».
theological_decisions:
- issue: Связь веры с ответом на молитву
  choice: веря
  alternative: если будете верить; при условии, что верите
  rationale: Греческий текст использует причастие, а не явное условное придаточное. Перевод «веря» сохраняет тесную связь молитвы и веры, не разрешая сверх текста вопрос о механизме или границах исполнения просьб.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным и понятным синтаксисом. Деепричастие «веря» намеренно сохраняет форму и богословскую напряжённость греческого причастия.
