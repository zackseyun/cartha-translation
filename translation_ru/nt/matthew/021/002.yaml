base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/002.yaml
  text: saying to them[a], “Go into the village opposite you, and immediately you will find a donkey tied, and a colt with her[c][b]. Untie them and bring them to me.”
translation:
  language: ru
  text: 'сказав им: «Идите в селение напротив вас. Там вы сразу найдёте привязанную ослицу и с ней ослёнка. Отвяжите их[a] и приведите ко Мне».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в греческом: «отвязав, приведите»; речь идёт о последовательности двух действий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: сказав им
  rationale: Деепричастная конструкция естественно передаёт греческое причастие, вводящее прямую речь, и сохраняет связь с предшествующим контекстом.
- source_word: Πορεύεσθε
  choice: Идите
  rationale: Обычная и естественная передача повелительной формы πορεύομαι в данном повествовательном контексте.
- source_word: κώμην
  choice: селение
  rationale: κώμη обозначает небольшой населённый пункт, не город; «селение» звучит естественно и достаточно широко.
- source_word: κατέναντι ὑμῶν
  choice: которое прямо перед вами
  rationale: Передаёт пространственное значение «напротив вас / перед вами» естественным современным русским выражением, не уточняя без необходимости, разделяет ли их дорога или иное пространство.
- source_word: εὐθέως
  choice: сразу
  rationale: Точно и естественно передаёт значение немедленности, присущее εὐθέως.
- source_word: ὄνον δεδεμένην
  choice: привязанную ослицу
  rationale: Женский род причастия показывает, что речь идёт об ослице; это важно и для последующего μετ’ αὐτῆς.
- source_word: πῶλον
  choice: ослёнка
  rationale: Хотя πῶλος может обозначать детёныша разных вьючных животных, соседство с ослицей ясно определяет здесь вид животного; «ослёнок» понятнее и точнее русского «жеребёнок».
- source_word: μετ’ αὐτῆς
  choice: с ней
  rationale: Сохраняет женский род местоимения и связь ослёнка с ослицей.
- source_word: λύσαντες
  choice: Отвяжите их
  rationale: Предшествующее обстоятельственное причастие выражает действие, которое должно быть совершено перед главным повелением; в естественном русском оно передано отдельным однородным повелением. Множественное дополнение следует из упоминания двух животных и формы последующего глагола.
- source_word: ἀγάγετέ μοι
  choice: приведите ко Мне
  rationale: ἄγω применительно к животным естественно передаётся глаголом «привести»; местоимение во множественном числе восстанавливается из контекста двух животных.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с ясным, достойным повествовательным тоном. «Ослица» сохраняет явно выраженный в греческом женский род, а «ослёнок» раскрывает контекстуальное значение πῶλος. Пространственное κατέναντι передано без излишнего топографического уточнения.
