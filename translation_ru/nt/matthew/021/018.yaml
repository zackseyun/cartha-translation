  text: ⸀Πρωῒ δὲ ⸀ἐπανάγων εἰς τὴν πόλιν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/018.yaml
  text: Early in the morning, as he was returning to the city, he became hungry.
translation:
  language: ru
  text: Рано утром, возвращаясь в город, он проголодался.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωῒ
  choice: рано утром
  rationale: Передаёт указание на раннюю часть дня естественным для современного русского языка выражением.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Здесь это слабая повествовательная связка; в русском связность естественно передаётся последовательностью повествования без добавления «теперь» или контрастного «но».
- source_word: ἐπανάγων
  choice: возвращаясь
  rationale: Деепричастие естественно передаёт одновременность возвращения с наступлением голода.
- source_word: εἰς τὴν πόλιν
  choice: в город
  rationale: Передаёт движение по направлению к городу и в данном контексте не утверждает, что прибытие уже состоялось.
- source_word: ἐπείνασεν
  choice: почувствовал голод
  rationale: Аорист обозначает наступление состояния; это выражение сохраняет событийность и звучит естественнее, чем книжное «взалкал».
theological_decisions:
- issue: Христологическое значение голода Иисуса
  choice: Прямо передать реальное переживание голода
  alternative: Сгладить наступление голода формулировкой «он был голоден»
  rationale: Повествование говорит о подлинном человеческом переживании Иисуса; прямой перевод сохраняет свидетельство текста, не добавляя доктринального комментария.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная повествовательная фраза без архаизмов и лишнего вводного маркера.
