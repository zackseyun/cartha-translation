  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅταν οὖν ἔλθῃ ὁ κύριος τοῦ ἀμπελῶνος, τί ποιήσει τοῖς γεωργοῖς ἐκείνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/040.yaml
  text: Therefore[a], when the owner of the vineyard comes[b], what will he do to those farmers?
translation:
  language: ru
  text: Итак, когда придёт хозяин[a] виноградника, что он сделает с теми виноградарями[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «господин» либо «владелец виноградника». Греческое κύριος часто переводится как «Господь», но здесь в рамках притчи обозначает хозяина виноградника.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «арендаторами». Само греческое слово означает земледельцев или возделывателей, однако из контекста притчи видно, что они получили виноградник в пользование от хозяина.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: когда
  rationale: В сочетании с сослагательным ἔλθῃ вводит ожидаемое в будущем событие; русское «когда» естественно передаёт это значение без оттенка многократности.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод и переход от рассказанной ситуации к вопросу Иисуса; в данном контексте звучит естественнее, чем более причинное «поэтому».
- source_word: ἔλθῃ
  choice: придёт
  rationale: Аорист конъюнктива после ὅταν указывает на ожидаемое будущее наступление события; по-русски требуется будущее совершенного вида.
- source_word: κύριος
  choice: хозяин
  rationale: Внутри притчи слово обозначает владельца или господина виноградника, а не выступает здесь непосредственно как титул «Господь». «Хозяин» естественно передаёт отношение к винограднику.
- source_word: ἀμπελῶνος
  choice: виноградника
  rationale: Обычное и точное соответствие для ἀμπελών.
- source_word: τί ποιήσει
  choice: что он сделает
  rationale: Сохраняет прямой вопрос о будущем действии хозяина.
- source_word: τοῖς γεωργοῖς
  choice: с ... виноградарями
  rationale: γεωργός обозначает земледельца или возделывателя; в связи с виноградником «виноградари» точно и естественно. Русская конструкция «что сделает с» идиоматично передаёт дательный падеж лица, на которое направлено действие.
- source_word: ἐκείνοις
  choice: теми
  rationale: 'Сохраняет указательное и слегка дистанцирующее значение: речь идёт именно о ранее названных виноградарях.'
theological_decisions:
- issue: Передача κύριος в контексте притчи
  choice: хозяин
  alternative: господин; владелец; Господь
  rationale: Ближайший контекст обозначает собственника виноградника как персонажа притчи. «Хозяин» сохраняет прямой смысл, не превращая слово в явный божественный титул и при этом не отрицая символического уровня притчи.
- issue: Передача γεωργοί с учётом арендных отношений
  choice: виноградари
  alternative: арендаторы; земледельцы
  rationale: Само слово называет возделывателей, тогда как их положение арендаторов устанавливается более широким контекстом притчи. Основной текст сохраняет лексическую широту, а примечание сообщает контекстуально возможное уточнение.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Итак» сохраняет логический переход, «придёт» естественно передаёт будущую временную конструкцию, а «виноградари» избегает как архаичного «виноградари-работники», так и излишне пояснительного включения аренды в основной текст.
