id: MAT.21.23
reference: Matthew 21:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ ἱερὸν προσῆλθον αὐτῷ διδάσκοντι οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ λέγοντες· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; καὶ τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/023.yaml
  text: And when he came into the temple[a], the chief priests and the elders of the people came up to him while he was teaching and said, “By what authority are you doing these things? And who gave you this authority?”
translation:
  language: ru
  text: 'Когда Иисус вошёл в храм[a] и учил там, к Нему подошли первосвященники и старейшины народа и спросили: «Какой властью Ты это делаешь? Кто дал Тебе эту власть?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово означает весь храмовый комплекс с его дворами, а не только внутреннее святилище.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: Когда Иисус вошёл
  rationale: Родительный самостоятельный оборот имеет временное значение. Имя «Иисус» естественно восстанавливает подразумеваемого участника в русском повествовании и устраняет неясность местоимения вне широкого контекста.
- source_word: ἱερὸν
  choice: храм
  rationale: Ἱερόν обозначает весь храмовый комплекс, а не только внутреннее святилище; обычное русское «храм» сохраняет естественность, а точный объём понятия пояснён в сноске.
- source_word: προσῆλθον αὐτῷ
  choice: к Нему подошли
  rationale: Передаёт направленное физическое приближение и естественно звучит в русском повествовании.
- source_word: διδάσκοντι
  choice: и учил там
  rationale: Причастие обозначает действие, во время которого к Иисусу подошли руководители. Сочинительная конструкция по-русски естественна; наречие «там» связывает преподавание с храмом.
- source_word: οἱ ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся русское обозначение ведущих представителей храмового священства; множественное число не подразумевает одновременного существования нескольких действующих первосвященников.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: старейшины народа
  rationale: Передаёт признанных руководителей народа и близко следует форме исходного выражения.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: Какой властью
  rationale: Вопрос касается основания и легитимности действий Иисуса. Такая формулировка сохраняет повтор слова ἐξουσία в следующем вопросе и естественна для современного русского языка.
- source_word: ταῦτα ποιεῖς
  choice: Ты это делаешь
  rationale: Единственное собирательное «это» естественно передаёт греческое множественное ταῦτα как совокупность наблюдаемых действий, не уточняя их сверх текста.
- source_word: τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην
  choice: Кто дал Тебе эту власть?
  rationale: Сохраняет отдельный второй вопрос и аорист как совершившийся акт наделения властью.
theological_decisions:
- issue: Значение ἐξουσία в вызове со стороны руководителей
  choice: власть
  alternative: право; полномочие; сила
  rationale: Речь идёт не просто о способности совершать действия, а о праве и полученной санкции на них. «Власть» сохраняет как институциональный, так и богословский оттенок, не разрешая заранее вопрос об источнике этой власти.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской традиции. Синтаксис слегка перестроен для естественного русского порядка слов без устранения двухчастного вызова руководителей.
