  yaml_path: translation/nt/matthew/021/038.yaml
  text: But when the tenant farmers saw the son[a], they said among themselves, ‘This is the heir. Come, let us kill him and seize his inheritance.’
translation:
  language: ru
  text: 'Но виноградари, увидев сына, сказали друг другу: «Это наследник. Давайте убьём его и завладеем его наследством[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «получим его наследство» или «будем иметь его наследство»; в данном контексте имеется в виду насильственно завладеть им.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: виноградари
  rationale: В контексте притчи это люди, которым хозяин передал виноградник и которые его возделывали. «Виноградари» естественно для русского библейского повествования и сохраняет связь с виноградником; их положение арендаторов ясно из ближайшего контекста.
- source_word: ἰδόντες
  choice: увидев
  rationale: Деепричастие естественно передаёт предшествующее обстоятельство аористного причастия и последовательность действий.
- source_word: τὸν υἱὸν
  choice: сына
  rationale: Сохраняется простое наименование из греческого текста без добавления притяжательного местоимения; чьим сыном он является, ясно из контекста.
- source_word: ἐν ἑαυτοῖς
  choice: друг другу
  rationale: В данном множественном контексте выражение обозначает разговор внутри группы. «Сказали друг другу» звучит естественнее, чем буквальное «сказали между собой».
- source_word: κληρονόμος
  choice: наследник
  rationale: Стандартное русское соответствие, сохраняющее юридический и сюжетный смысл.
- source_word: δεῦτε
  choice: давайте
  rationale: Здесь слово вводит совместное побуждение, а не обязательно призыв физически куда-то идти. «Давайте» естественно сочетается с последующими формами совместного намерения.
- source_word: ἀποκτείνωμεν
  choice: убьём
  rationale: Передаёт побудительное сослагательное наклонение в конструкции «давайте убьём», не добавляя судебного или отдельно подчёркнутого уголовного оттенка.
- source_word: σχῶμεν
  choice: завладеем
  rationale: Буквально форма связана со значением «иметь, получить», но в контексте убийства наследника речь идёт о насильственном присвоении. «Завладеем» ясно и естественно передаёт этот контекстуальный смысл.
- source_word: κληρονομίαν αὐτοῦ
  choice: его наследством
  rationale: «Наследство» прямо соответствует κληρονομία и связано с предшествующим «наследник»; «его» явно передаёт αὐτοῦ.
theological_decisions:
- issue: Притчевое указание на сына
  choice: Передать υἱός просто как «сын», не раскрывая в самом переводе его христологическое значение.
  alternative: Добавить формулировку, прямо указывающую, что сын представляет Иисуса.
  rationale: В повествовательном контексте Матфея притча указывает на Иисуса, однако сам стих остаётся на уровне образного рассказа. Прямой перевод сохраняет этот уровень и не подменяет текст толкованием.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным повествовательным тоном. Разговор арендаторов передан естественной прямой речью; избегаются как архаизмы, так и излишне разговорные выражения.
