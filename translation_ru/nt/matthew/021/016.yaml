  text: καὶ εἶπαν αὐτῷ· Ἀκούεις τί οὗτοι λέγουσιν; ὁ δὲ Ἰησοῦς λέγει αὐτοῖς· Ναί. οὐδέποτε ἀνέγνωτε ὅτι Ἐκ στόματος νηπίων καὶ θηλαζόντων κατηρτίσω αἶνον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/016.yaml
  text: And they said to him[a], “Do you hear what these are saying?” But Jesus says to them, “Yes. Have you never read, ‘Out of the mouth of infants and nursing babies you have prepared praise’?”
translation:
  language: ru
  text: 'И сказали Ему: «Ты слышишь, что говорят эти?» Иисус же говорит им: «Да. Разве вы никогда не читали: „Из уст младенцев и грудных детей Ты устроил хвалу“?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Иисус цитирует Псалом 8:3 по греческой традиции Писания. Еврейский текст обычно переводят: «Из уст младенцев и грудных детей Ты утвердил силу».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούεις
  choice: Ты слышишь
  rationale: Настоящее время и прямой вопрос переданы естественно и без ослабления вызова, обращённого к Иисусу.
- source_word: τί οὗτοι λέγουσιν
  choice: что они говорят
  rationale: Настоящее время сохранено; русское «они» естественно указывает на присутствующих, не добавляя отсутствующего в греческом существительного.
- source_word: λέγει
  choice: говорит
  rationale: Сохранено историческое настоящее Матфея, придающее повествованию живость.
- source_word: Ναί
  choice: Да
  rationale: Прямой и естественный эквивалент краткого утвердительного ответа.
- source_word: οὐδέποτε ἀνέγνωτε
  choice: Разве вы никогда не читали
  rationale: Риторическая частица «разве» естественно передаёт укоризненный характер вопроса, не меняя его содержания.
- source_word: Ἐκ στόματος
  choice: Из уст
  rationale: Устойчивое русское выражение точно передаёт исходный предложный оборот; множественное «уст» идиоматично в русском.
- source_word: νηπίων
  choice: младенцев
  rationale: Передаёт обозначение совсем маленьких детей и сохраняет отличие от следующего причастного выражения.
- source_word: θηλαζόντων
  choice: грудных детей
  rationale: Современное и ясное обозначение детей, питающихся грудью, без архаизма «сосущих».
- source_word: κατηρτίσω
  choice: приготовил
  rationale: Передаёт значение устроения или подготовки в греческой форме цитаты, не подменяя её еврейским чтением «утвердил силу».
- source_word: αἶνον
  choice: хвалу
  rationale: Прямой эквивалент существительного со значением хвалы; абстрактное употребление естественно по-русски.
theological_decisions:
- issue: Формулировка цитаты из Псалма 8:3 в аргументе Иисуса
  choice: 'В основном тексте передать греческую формулировку Матфея: «Ты приготовил хвалу»'
  alternative: 'Еврейский текст обычно передают: «Ты утвердил силу»'
  rationale: Перевод следует тому виду цитаты, который содержится в греческом тексте Евангелия, и не гармонизирует его с еврейской формой Псалма; различие отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Историческое настоящее «говорит» сохранено. В цитате использованы естественные русские соответствия без архаизации; прописные местоимения в обращении к Богу выдержаны в традиционном русском издательском регистре.
