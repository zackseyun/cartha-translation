base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/011.yaml
  text: And the crowds were saying[a], “This is the prophet Jesus, from Nazareth in Galilee.”
translation:
  language: ru
  text: 'А толпы говорили: «Это пророк[a] Иисус из Назарета в Галилее».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом перед словом «пророк» стоит определённый артикль; возможно, он указывает на известную пророческую фигуру, но это не выражено в русском языке прямо.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: А народ
  rationale: δέ передано лёгким повествовательным союзом «а»; множественное ὄχλοι в данном контексте естественно обозначает собравшийся народ как совокупность людей.
- source_word: ἔλεγον
  choice: говорил
  rationale: Имперфект передаёт продолжавшееся или повторявшееся высказывание; русская форма «говорил» в сочетании с собирательным «народ» естественно сохраняет эту аспектуальность.
- source_word: Οὗτός ἐστιν
  choice: Это
  rationale: Естественная русская отождествительная конструкция; связка «есть» в настоящем времени не требуется.
- source_word: ὁ προφήτης
  choice: пророк
  rationale: Русское именное сказуемое без артикля не позволяет прямо воспроизвести греческую определённость. Формулировка сохраняет естественность, а возможное значение «тот самый пророк» отмечено в сноске.
- source_word: Ἰησοῦς
  choice: Иисус
  rationale: Традиционная русская передача личного имени.
- source_word: ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας
  choice: из Назарета Галилейского
  rationale: Естественно и кратко передаёт происхождение Иисуса и географическую принадлежность Назарета к Галилее.
theological_decisions:
- issue: Определённость выражения ὁ προφήτης
  choice: «пророк» с пояснительной сноской
  alternative: «тот самый пророк» или «один из пророков»
  rationale: В греческом стоит артикль, допускающий отождествление Иисуса с известной или ожидаемой пророческой фигурой. Однако русское «тот самый пророк» усилило бы эту интерпретацию, а «один из пророков» устранило бы определённость; основной текст и сноска сохраняют напряжение.
translation_notes:
  register: Современный литературный русский язык; фраза проста и пригодна для публичного чтения. «Назарета Галилейского» звучит достойно и однозначно указывает местность, не перегружая предложение.
