  text: ὁ δὲ πλεῖστος ὄχλος ἔστρωσαν ἑαυτῶν τὰ ἱμάτια ἐν τῇ ὁδῷ, ἄλλοι δὲ ἔκοπτον κλάδους ἀπὸ τῶν δένδρων καὶ ἐστρώννυον ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/008.yaml
  text: Most of the crowd spread their garments on the road[b][a], and others were cutting branches from the trees and spreading them on the road.
translation:
  language: ru
  text: Большинство людей в толпе[a] расстелили на дороге свою одежду[b], а другие срезали ветви с деревьев и расстилали их на дороге.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «большая часть толпы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «свои плащи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλεῖστος ὄχλος
  choice: Большинство людей в толпе
  rationale: Передаёт πλεῖστος при собирательном ὄχλος как «большинство» и звучит естественно по-русски; δέ отражено связностью повествования без искусственного вводного слова.
- source_word: ἔστρωσαν
  choice: расстелили
  rationale: Совершенный вид естественно передаёт аорист и действие раскладывания одежды по поверхности дороги.
- source_word: ἑαυτῶν τὰ ἱμάτια
  choice: свою одежду
  rationale: Возвратное «свою» передаёт ἑαυτῶν, а собирательное «одежду» естественнее русского множественного «одежды» и сохраняет широкое значение ἱμάτια.
- source_word: ἐν τῇ ὁδῷ
  choice: на дороге
  rationale: Идиоматический русский оборот для предметов, разложенных по поверхности дороги; речь идёт о физической дороге, а не о метафорическом пути.
- source_word: ἄλλοι δὲ
  choice: а другие
  rationale: Обозначает вторую группу внутри толпы; союз «а» естественно передаёт здесь мягкое различение, выраженное δέ.
- source_word: ἔκοπτον
  choice: срезали
  rationale: Несовершенный вид сохраняет длительный, разворачивающийся характер действия; «срезали» точнее контекстуального отделения ветвей, чем более резкое «рубили».
- source_word: κλάδους ἀπὸ τῶν δένδρων
  choice: ветви с деревьев
  rationale: Прямое и современное соответствие исходному выражению без неоправданного уточнения вида деревьев.
- source_word: καὶ ἐστρώννυον
  choice: и расстилали их
  rationale: Несовершенный вид передаёт продолжающееся действие, а местоимение ясно указывает на ветви.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис остаётся прозрачным для широкого круга читателей; аспектуальное различие между аористом ἔστρωσαν и имперфектами ἔκοπτον, ἐστρώννυον передано совершенным и несовершенным видами.
