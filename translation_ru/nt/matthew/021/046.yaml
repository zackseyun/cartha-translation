  source_fidelity: «Хотели схватить» передаёт общий смысл, но несколько ослабляет настоящее причастие ζητοῦντες, выражающее предпринимаемое/длящееся намерение. «Стремились схватить» точнее сохраняет этот аспект и контраст с последовавшим страхом. «Народ» может естественно передавать τοὺς ὄχλους как собирательное обозначение собравшихся людей.
  naturalness: В исходном тексте повтор «народа» — «люди» создаёт стилистическую неровность и без необходимости меняет обозначение одной и той же группы. Повторительное «народ» в причинной части ясно, естественно и устраняет двусмысленность относительно того, кто считал Иисуса пророком.
  terminology: «Схватить» уместно для κρατῆσαι и не навязывает современную юридическую процедуру. «Считал Его пророком» точно передаёт идиому εἰς προφήτην αὐτὸν εἶχον как оценку толпы, не делая утверждения об исчерпывающем статусе Иисуса. Заглавное «Его» допустимо в русской библейской редакционной традиции.
