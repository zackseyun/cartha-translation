source:
  edition: SBLGNT
  text: καὶ ζητοῦντες αὐτὸν κρατῆσαι ἐφοβήθησαν τοὺς ὄχλους, ⸂ἐπεὶ εἰς⸃ προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/046.yaml
  text: And although they were seeking to arrest him[a], they feared the crowds, because they regarded him as a prophet.
translation:
  language: ru
  text: И хотя они стремились схватить Его, они боялись народа, потому что народ считал Его пророком.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητοῦντες
  choice: хотели
  rationale: Причастие настоящего времени передаёт продолжающееся намерение; в русском контексте естественно выражено уступительной конструкцией «хотя они хотели».
- source_word: κρατῆσαι
  choice: схватить
  rationale: В данном враждебном контексте глагол означает насильственно взять под стражу; «схватить» сохраняет конкретность действия, не добавляя явно выраженной официальной процедуры ареста.
- source_word: ἐφοβήθησαν
  choice: боялись
  rationale: Прямо передаёт значение аориста без навязывания оттенка начала состояния.
- source_word: τοὺς ὄχλους
  choice: народа
  rationale: Русское собирательное «народ» естественно обозначает собравшиеся массы людей; множественность исходного ὄχλους раскрывается далее словом «люди».
- source_word: ἐπεὶ
  choice: потому что
  rationale: Ясно вводит причину страха.
- source_word: εἰς προφήτην αὐτὸν εἶχον
  choice: люди считали Его пророком
  rationale: 'Идиома ἔχω εἰς передаёт отношение или оценку: собравшиеся считали Иисуса пророком. Явное «люди» устраняет возможную двусмысленность русского местоимения и показывает, что речь идёт о народе, а не о противниках Иисуса.'
theological_decisions:
- issue: Как передать оценку Иисуса как προφήτην, не привнося и не отрицая более полных христологических утверждений
  choice: люди считали Его пророком
  alternative: люди почитали Его за пророка
  rationale: Фраза сообщает восприятие Иисуса народом, а не исчерпывающее определение Его личности. «Считали Его пророком» сохраняет повествовательную перспективу и не подразумевает, что Он был только пророком.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Уступительное «И хотя» естественно передаёт контраст между намерением схватить Иисуса и страхом перед народом. Заглавная буква в местоимении «Его» соответствует распространённой русской библейской издательской традиции.
