id: MAT.21.26
reference: Matthew 21:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, φοβούμεθα τὸν ὄχλον, πάντες γὰρ ⸂ὡς προφήτην ἔχουσιν τὸν Ἰωάννην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/026.yaml
  text: But if we say[a], ‘From men,’ we fear the crowd, for they all regard John as a prophet.
translation:
  language: ru
  text: 'А если скажем: «От людей»[a], — мы боимся толпы, потому что все считают Иоанна пророком.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человеческого происхождения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: А если скажем
  rationale: Передаёт условную возможность, выраженную ἐὰν с аористом сослагательного наклонения, естественно для современного русского диалога.
- source_word: Ἐξ ἀνθρώπων
  choice: От людей
  rationale: 'Кратко сохраняет прямое противопоставление источников: «с небес» или «от людей»; речь идёт о человеческом, а не мужском происхождении.'
- source_word: φοβούμεθα τὸν ὄχλον
  choice: мы боимся толпы
  rationale: Прямо и естественно передаёт страх перед собравшейся толпой.
- source_word: πάντες γὰρ
  choice: потому что все
  rationale: Союз γάρ указывает причину страха, а πάντες обозначает всех людей в толпе.
- source_word: ὡς προφήτην ἔχουσιν τὸν Ἰωάννην
  choice: считают Иоанна пророком
  rationale: Русское «считать кого-либо кем-либо» естественно передаёт идиому ἔχω с ὡς и предикативным дополнением.
theological_decisions:
- issue: Противопоставление небесного и человеческого источника
  choice: «От людей»
  alternative: «Человеческого происхождения»
  rationale: Выбранный вариант сохраняет лаконичную форму и резкую антитезу контекста, не уточняя сверх текста, идёт ли речь о происхождении крещения или полномочий Иоанна.
- issue: Отношение толпы к Иоанну
  choice: «все считают Иоанна пророком»
  alternative: «все признают Иоанна за пророка»
  rationale: «Считают» точно передаёт сообщаемую оценку толпы и не добавляет богословского утверждения от лица рассказчика.
translation_notes:
  register: Современный литературный русский язык; реплика звучит естественно, но сохраняет достоинство и лаконичность повествования. Тире после прямой речи помогает ясно связать условную реплику с её следствием.
