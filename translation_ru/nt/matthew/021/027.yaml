  text: καὶ ἀποκριθέντες τῷ Ἰησοῦ εἶπαν· Οὐκ οἴδαμεν. ἔφη αὐτοῖς καὶ αὐτός· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/027.yaml
  text: And answering Jesus, they said, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.”
translation:
  language: ru
  text: 'Они ответили Иисусу: «Не знаем». И Он сказал им: «И Я не скажу вам, какой властью Я всё это делаю».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες τῷ Ἰησοῦ εἶπαν
  choice: Они ответили Иисусу
  rationale: Греческое причастие с глаголом речи естественно передаётся по-русски одним глаголом «ответили»; дательный τῷ Ἰησοῦ обозначает адресата ответа.
- source_word: Οὐκ οἴδαμεν
  choice: Не знаем
  rationale: Краткий прямой ответ естественен в современном русском диалоге и точно передаёт отрицание знания.
- source_word: ἔφη αὐτοῖς καὶ αὐτός
  choice: Тогда и Он сказал им
  rationale: «И Он» передаёт ответную, взаимную силу καὶ αὐτός, а «тогда» естественно связывает реплику Иисуса с их отказом отвечать.
- source_word: Οὐδὲ ἐγὼ λέγω ὑμῖν
  choice: И Я не скажу вам
  rationale: Настоящее λέγω в данном речевом контексте выражает отказ сообщить ответ; по-русски это естественно передаётся будущим совершенного вида «не скажу».
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: какой властью
  rationale: Творительный падеж естественно выражает основание и полномочие действия; «власть» сохраняет смысл законного права и авторитета, а не только способности.
- source_word: ταῦτα ποιῶ
  choice: это делаю
  rationale: Русское собирательное «это» естественно отсылает к совокупности обсуждаемых действий Иисуса, хотя греческое ταῦτα формально имеет форму множественного числа.
theological_decisions:
- issue: Смысл ἐξουσία в ответе Иисуса
  choice: власть
  alternative: право; полномочие; сила
  rationale: В споре религиозные руководители спрашивают о законном основании действий Иисуса. «Власть» сохраняет юридический и богословский диапазон слова, не сводя его к физической силе или отдельно выданному полномочию.
translation_notes:
  register: Современный литературный русский язык; краткий и достойный диалогический стиль. Заглавные местоимения «Он», «Я» употреблены в отношении Иисуса согласно распространённой русской библейской издательской традиции.
