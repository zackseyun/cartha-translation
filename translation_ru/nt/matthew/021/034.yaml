  text: But when the season for the fruits had drawn near[b][a], he sent his servants to the tenant farmers to collect his fruits.
translation:
  language: ru
  text: Когда же приблизилось время сбора плодов, он послал своих слуг[a] к виноградарям[b], чтобы получить причитающиеся ему плоды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рабов». Греческое слово δοῦλος может обозначать как раба, так и слугу; здесь выбрано «слуг», поскольку в притче на первом плане их роль посланников хозяина.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «земледельцам», «арендаторам». Греческое слово γεωργός обозначает человека, возделывающего землю; здесь по контексту они возделывают виноградник хозяина.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Когда же
  rationale: Естественно передаёт временное значение ὅτε и мягкий повествовательный переход δέ.
- source_word: ἤγγισεν ὁ καιρὸς τῶν καρπῶν
  choice: приблизилось время сбора плодов
  rationale: Сохраняет значение наступающего подходящего срока и ясно передаёт сельскохозяйственный контекст генитива τῶν καρπῶν.
- source_word: τοὺς δούλους αὐτοῦ
  choice: своих слуг
  rationale: В данном контексте подчёркнута роль посланных как представителей хозяина; возможное значение «рабов» отмечено в сноске.
- source_word: πρὸς τοὺς γεωργοὺς
  choice: к виноградарям
  rationale: В контексте притчи речь идёт о людях, возделывающих чужой виноградник; русский термин естественен и не требует добавлять отсутствующее в самом слове указание на аренду.
- source_word: λαβεῖν τοὺς καρποὺς αὐτοῦ
  choice: чтобы получить причитающиеся ему плоды
  rationale: λαβεῖν означает «получить/взять», а αὐτοῦ указывает на принадлежащую хозяину долю урожая; «причитающиеся ему» естественно раскрывает контекст, не определяя точный вид платы.
