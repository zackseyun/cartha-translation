base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/041.yaml
  text: They said to him[a], “He will miserably destroy those wretches, and he will lease the vineyard to other farmers[c][b], who will give him the fruits in their seasons.”
translation:
  language: ru
  text: 'Они ответили ему: «Этих злодеев он жестоко погубит[a], а виноградник сдаст внаём другим виноградарям[b], которые будут отдавать ему плоды в положенные сроки[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «злых злым образом погубит». В греческом тексте прилагательное и наречие одного корня образуют игру слов, усиливающую приговор.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отдаст виноградник в аренду другим земледельцам».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «будут отдавать ему урожай в надлежащее время».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Они ответили ему
  rationale: Настоящее время здесь является повествовательным; прошедшее время естественно для современного русского рассказа. По контексту слова представляют собой ответ на вопрос Иисуса.
- source_word: Κακοὺς κακῶς
  choice: Этих злодеев он жестоко
  rationale: Однокоренная греческая конструкция усиливает осуждение. Русское «злодеев… жестоко» естественно передаёт и нравственную оценку, и суровость приговора, хотя не воспроизводит игру слов буквально.
- source_word: ἀπολέσει
  choice: погубит
  rationale: Глагол обозначает решительное уничтожение или гибель, не уточняя способ. «Погубит» сохраняет эту широту и торжественную суровость.
- source_word: τὸν ἀμπελῶνα ἐκδώσεται
  choice: виноградник сдаст внаём
  rationale: В данном сельскохозяйственном контексте ἐκδίδωμι означает передать имущество арендаторам за обусловленную плату или долю урожая.
- source_word: ἄλλοις γεωργοῖς
  choice: другим виноградарям
  rationale: В контексте виноградника γεωργοί — возделывающие его работники-арендаторы. «Виноградари» сохраняет конкретный образ притчи, а арендные отношения выражены глаголом «сдаст внаём».
- source_word: ἀποδώσουσιν αὐτῷ τοὺς καρποὺς
  choice: будут отдавать ему плоды
  rationale: ἀποδίδωμι указывает на передачу причитающегося владельцу, а «плоды» сохраняют как буквальный сельскохозяйственный образ, так и возможный метафорический оттенок.
- source_word: ἐν τοῖς καιροῖς αὐτῶν
  choice: в положенные сроки
  rationale: Выражение указывает на соответствующие, установленные для плодов сроки. Такой перевод естественен по-русски и сохраняет мысль о своевременной отдаче.
theological_decisions:
- issue: Суровость и характер суда над виноградарями
  choice: жестоко погубит этих злодеев
  alternative: злой смертью погубит этих злых людей
  rationale: Текст выражает усиленное осуждение посредством игры однокоренных слов, но не определяет точный способ наказания и не вводит специального богословского термина. Перевод сохраняет суровость суда, не конкретизируя её сверх сказанного.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным тоном. Сельскохозяйственная и арендная образность притчи сохранена; архаические и конфессионально окрашенные формулы не использованы.
