  text: τίς ἐκ τῶν δύο ἐποίησεν τὸ θέλημα τοῦ πατρός; ⸀λέγουσιν· Ὁ ⸀πρῶτος. λέγει αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν λέγω ὑμῖν ὅτι οἱ τελῶναι καὶ αἱ πόρναι προάγουσιν ὑμᾶς εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/031.yaml
  text: Which of the two did the will of the father? They said[a], “The first.” Jesus said to them, “Truly I say to you, the tax collectors and the prostitutes are going ahead of you into the kingdom of God.”
translation:
  language: ru
  text: 'Кто из двоих исполнил волю отца? Они ответили: «Первый». Иисус сказал им: «Истинно говорю вам: сборщики налогов и проститутки идут впереди вас в Царство Бога.[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «входят в Царство Бога раньше вас». Буквально греческий текст говорит, что они «идут впереди вас», подчёркивая первенство, но не обязательно окончательное исключение вас.'
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐκ τῶν δύο
  choice: Кто из этих двоих
  rationale: Естественно передаёт вопрос и партитивное значение ἐκ τῶν δύο.
- source_word: ἐποίησεν τὸ θέλημα τοῦ πατρός
  choice: исполнил волю отца
  rationale: Русское устойчивое сочетание точно передаёт ποιέω с θέλημα; речь идёт об отце из притчи, поэтому слово написано со строчной буквы.
- source_word: Ὁ πρῶτος
  choice: Первый
  rationale: Краткий эллиптический ответ соответствует греческому тексту и естественен по-русски.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Истинно говорю вам
  rationale: Сохраняет торжественную формулу Иисуса в ясном и достойном современном русском регистре.
- source_word: τελῶναι
  choice: сборщики налогов
  rationale: Понятный современному читателю эквивалент названия фискальных агентов; он избегает недостаточно прозрачного традиционного слова «мытари».
- source_word: πόρναι
  choice: блудницы
  rationale: В данном библейском регистре точно обозначает женщин, занимавшихся проституцией, и звучит достойнее разговорного или сугубо административного термина.
- source_word: προάγουσιν ὑμᾶς
  choice: идут впереди вас
  rationale: Сохраняет настоящее время, образ движения впереди и смысл предшествования, не утверждая прямо окончательного исключения адресатов.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: в Царство Бога
  rationale: Передаёт направительное εἰς и сохраняет полную богословскую формулу; прописная буква отмечает особое значение царствования Бога.
theological_decisions:
- issue: Смысл προάγουσιν ὑμᾶς применительно ко вхождению в Царство Бога
  choice: идут впереди вас в Царство Бога
  alternative: входят в Царство Бога раньше вас
  rationale: Глагол προάγω обозначает движение впереди или предшествование. Основной вариант сохраняет образ и напряжение предупреждения, не усиливая его до категорического утверждения, что религиозные руководители вовсе не войдут.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным библейским звучанием. Синтаксис сохраняет лаконичность диалога; архаизмы сведены к минимуму. Маркер сноски поставлен непосредственно после предложения, к которому относится смысловая альтернатива.
