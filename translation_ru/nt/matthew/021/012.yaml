id: MAT.21.12
reference: Matthew 21:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν ⸀Ἰησοῦς εἰς τὸ ⸀ἱερόν, καὶ ἐξέβαλεν πάντας τοὺς πωλοῦντας καὶ ἀγοράζοντας ἐν τῷ ἱερῷ καὶ τὰς τραπέζας τῶν κολλυβιστῶν κατέστρεψεν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστεράς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/012.yaml
  text: And Jesus entered the temple courts and drove out all those selling and buying in the temple courts[a], and he overturned the tables of the money changers and the seats of those selling doves.
translation:
  language: ru
  text: Иисус вошёл во дворы храма и выгнал оттуда всех, кто продавал и покупал[a]. Он опрокинул столы менял и сиденья продавцов голубей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в храм и выгнал всех, кто продавал и покупал в храме»; греческое слово означает весь храмовый комплекс, а не только внутреннее святилище.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερόν
  choice: дворы храма
  rationale: Слово обозначает весь храмовый комплекс, в отличие от внутреннего святилища (ναός); торговля происходила во дворах храма.
- source_word: ἐξέβαλεν
  choice: выгнал
  rationale: Передаёт решительное, силовое удаление естественным современным русским глаголом.
- source_word: πάντας τοὺς πωλοῦντας καὶ ἀγοράζοντας
  choice: всех, кто продавал и покупал
  rationale: Сохраняет явно выраженный всеобщий охват πάντας и действие субстантивированных причастий.
- source_word: τράπεζας
  choice: столы
  rationale: Прямое и контекстуально ясное соответствие без неоправданного уточнения вида мебели.
- source_word: κολλυβιστῶν
  choice: менял
  rationale: Устоявшееся русское обозначение людей, занимавшихся разменом и обменом монет.
- source_word: κατέστρεψεν
  choice: опрокинул
  rationale: В данном контексте означает переворачивание столов и сидений, а не их уничтожение.
- source_word: καθέδρας
  choice: сиденья
  rationale: Точно передаёт более широкое значение существительного, не конкретизируя форму как стулья.
- source_word: περιστεράς
  choice: голубей
  rationale: В русском языке «голуби» естественно охватывает птиц, использовавшихся для жертвоприношений; искусственное различение голубей и горлиц здесь не выражено греческим словом.
theological_decisions:
- issue: Пространственный охват ἱερόν
  choice: Иисус вошёл во дворы храмового комплекса, а не во внутреннее святилище.
  alternative: Обобщённое «в храм», не уточняющее конкретную часть комплекса.
  rationale: Так сохраняется историко-пространственное различие между ἱερόν и ναός и не создаётся впечатление, будто Иисус вошёл в закрытое внутреннее святилище.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Разделение длинной греческой фразы на два предложения улучшает ясность; «оттуда» естественно передаёт повторное ἐν τῷ ἱερῷ без тяжеловесного повтора.
