  terminology: «Дворы храма» удачно передаёт ἱερόν как храмовый комплекс, не смешивая его с внутренним святилищем. «Менялы», «голуби», «столы» и «сиденья» являются точными и естественными соответствиями. Сноска корректно фиксирует возможный более общий вариант «храм» и объясняет пространственный объём греческого слова.
