id: MAT.21.3
reference: Matthew 21:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ τι, ἐρεῖτε ὅτι Ὁ κύριος αὐτῶν χρείαν ἔχει· ⸀εὐθὺς δὲ ⸀ἀποστελεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/003.yaml
  text: And if anyone says anything to you[a], you shall say[b], ‘The Lord has need of them,’ and he will send them at once.
translation:
  language: ru
  text: 'И если кто-нибудь что-либо вам скажет, ответьте: «Они нужны Господу[a]», — и он тотчас пошлёт их[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хозяину». Греческое κύριος может означать как «Господь», так и «хозяин» или «господин».'
    reason: lexical_alternative
  - marker: b
    text: 'Субъект в греческом прямо не назван; вероятнее всего, имеется в виду человек, который заговорит с учениками: он тотчас пошлёт животных.'
    reason: referent_ambiguity
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ τι
  choice: если кто-нибудь что-либо вам скажет
  rationale: Неопределённое условие сохраняет открытый круг возможных говорящих; «что-либо скажет» не сужает смысл до вопроса или возражения.
- source_word: ἐρεῖτε
  choice: ответьте
  rationale: Будущее изъявительного наклонения имеет здесь предписывающую силу. В данном контексте естественное русское «ответьте» ясно передаёт указание ученикам.
- source_word: Ὁ κύριος
  choice: Господу
  rationale: «Господь» сохраняет обычное значение титула κύριος и возможный христологический вес высказывания, не исключая контекстуального смысла «хозяин».
- source_word: αὐτῶν χρείαν ἔχει
  choice: Они нужны
  rationale: Русская конструкция естественно передаёт греческую идиому «имеет нужду в них»; местоимение относится к двум животным из предыдущего контекста.
- source_word: εὐθὺς
  choice: тотчас
  rationale: Передаёт немедленность действия в ясном, литературном регистре.
- source_word: ἀποστελεῖ αὐτούς
  choice: он … пошлёт их
  rationale: Сохраняет основное значение ἀποστέλλω — «посылать» — без добавления отсутствующего в греческом указания на возвращение; наиболее естественный субъект — человек, обратившийся к ученикам.
theological_decisions:
- issue: Значение и референт Ὁ κύριος
  choice: Господь
  alternative: хозяин
  rationale: Форма допускает бытовое значение «хозяин», однако в речи Иисуса может выступать как значимый титул. Основной текст сохраняет эту напряжённость, а лексическая возможность отмечена в сноске.
- issue: Субъект ἀποστελεῖ
  choice: человек, который заговорит с учениками, пошлёт животных
  alternative: Господь пошлёт животных
  rationale: В греческом субъект прямо не выражен. Ближайший и контекстуально наиболее естественный референт — неопределённое «кто-нибудь», но грамматическая неявность сохранена и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок слов естественен для прямой речи; архаичные «имеет нужду» и «скажите» в значении будущего предписания заменены ясными современными соответствиями.
