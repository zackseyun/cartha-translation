lexical_decisions:
- source_word: πορευθέντες
  choice: пошли
  rationale: Аористное причастие обозначает предшествующее или сопутствующее основному действию движение; в естественном русском повествовании передаётся личной формой «пошли».
- source_word: δὲ
  choice: связь передана без отдельного союза
  rationale: Частица обозначает продолжение повествования и отклик на предыдущее поручение; в русском языке эта связь естественно выражается последовательностью действий без обязательного отдельного эквивалента.
- source_word: οἱ μαθηταὶ
  choice: ученики
  rationale: Устойчивое и контекстуально точное обозначение последователей Иисуса в Евангелиях.
- source_word: ποιήσαντες
  choice: сделали
  rationale: Согласованное с πορευθέντες аористное причастие естественно передаётся вторым однородным сказуемым.
- source_word: καθὼς
  choice: всё так, как
  rationale: Передаёт полное соответствие действий учеников данному Иисусом распоряжению; «всё» естественно уточняет подразумеваемый объект глагола «сделали».
- source_word: συνέταξεν
  choice: повелел
  rationale: Глагол συντάσσω здесь означает дать распоряжение или указания. «Повелел» сохраняет оттенок авторитетного поручения; возможен и менее сильный вариант «велел».
- source_word: αὐτοῖς
  choice: им
  rationale: Русская форма дательного падежа прямо соответствует косвенному дополнению.
- source_word: ὁ Ἰησοῦς
  choice: Иисус
  rationale: Обычная передача имени собственного; греческий артикль отдельно не переводится.
