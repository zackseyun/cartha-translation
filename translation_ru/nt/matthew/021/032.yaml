source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ⸂Ἰωάννης πρὸς ὑμᾶς⸃ ἐν ὁδῷ δικαιοσύνης, καὶ οὐκ ἐπιστεύσατε αὐτῷ· οἱ δὲ τελῶναι καὶ αἱ πόρναι ἐπίστευσαν αὐτῷ· ὑμεῖς δὲ ἰδόντες ⸀οὐδὲ μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/032.yaml
  text: For John came to you in the way of righteousness[a], and you did not believe him; but the tax collectors and the prostitutes believed him. But even after seeing this[c][b], you did not afterward change your minds so as to believe him.
translation:
  language: ru
  text: Ведь Иоанн пришёл к вам путём праведности[a], и вы ему не поверили, а сборщики налогов и проститутки ему поверили. Вы же, увидев это, даже после этого не переменили своего мнения, чтобы поверить ему.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праведным путём»; возможно также: «по пути праведности». Греческое выражение может описывать как праведный образ жизни и служения Иоанна, так и возвещённый им путь праведности.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно: «даже после этого не раскаялись, чтобы поверить ему». Употреблённый здесь греческий глагол обозначает перемену мнения или сожаление и отличается от глагола, обычно переводимого как «каяться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν γὰρ
  choice: Ведь … пришёл
  rationale: «Ведь» естественно вводит обоснование предшествующего упрёка, а «пришёл» прямо передаёт повествовательный аорист.
- source_word: πρὸς ὑμᾶς
  choice: к вам
  rationale: Сохраняет направительное значение πρός с винительным падежом.
- source_word: ἐν ὁδῷ δικαιοσύνης
  choice: путём праведности
  rationale: 'Сохраняет метафору пути и не устраняет неоднозначность: выражение может относиться к праведному образу служения Иоанна либо к возвещённому им пути.'
- source_word: οὐκ ἐπιστεύσατε αὐτῷ / ἐπίστευσαν αὐτῷ
  choice: вы ему не поверили / ему поверили
  rationale: πιστεύω с дательным здесь естественно означает поверить человеку; одинаковый перевод сохраняет явный контраст.
- source_word: τελῶναι
  choice: сборщики налогов
  rationale: Современное и понятное обозначение тех, кто собирал налоги и пошлины; не вызывает современного значения слова «мытарь» как страдающего человека.
- source_word: πόρναι
  choice: блудницы
  rationale: Прямое, узнаваемое и уместное для достоинства библейского регистра обозначение; сохраняет нравственно-социальную силу исходного слова.
- source_word: ἰδόντες
  choice: хотя и увидели это
  rationale: Уступительное прочтение естественно в контексте упрёка; «это» явно отсылает к отклику сборщиков налогов и блудниц.
- source_word: οὐδὲ μετεμελήθητε ὕστερον
  choice: даже после не изменили своего решения
  rationale: Передаёт усилительное οὐδέ и временное ὕστερον, сохраняя отличие μεταμέλομαι от более обычного глагола «каяться» μετανοέω.
- source_word: τοῦ πιστεῦσαι αὐτῷ
  choice: чтобы поверить ему
  rationale: Передаёт результат или направленность требуемой перемены без излишнего уточнения синтаксической связи.
theological_decisions:
- issue: Значение δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: 'В данном контексте речь шире общественной справедливости: о соответствии Божьей воле в пути, служении или вести Иоанна.'
- issue: Значение πιστεύω с αὐτῷ
  choice: поверить ему
  alternative: довериться ему; уверовать в него
  rationale: Форма с дательным указывает на принятие слов и свидетельства Иоанна; «уверовать в него» могло бы привнести не выраженную здесь богословскую формулу.
- issue: Значение μεταμέλομαι
  choice: изменить своё решение
  alternative: раскаяться; пожалеть
  rationale: Так сохраняется оттенок перемены решения или сожаления и не стирается лексическое различие с μετανοέω. Возможный нравственный смысл покаяния отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сохраняет трёхчастный контраст оригинала и эмфатическое «вы же». «Сборщики налогов» выбрано ради ясности современному читателю; «блудницы» сохраняет узнаваемый библейский регистр без эвфемизации.
