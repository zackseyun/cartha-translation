revisions:
- from: Ведь Иоанн пришёл к вам путём праведности[a], и вы ему не поверили, а сборщики налогов и блудницы ему поверили. Вы же, хотя и увидели это, даже после не изменили своего решения, чтобы поверить ему.[b]
  to: Ведь Иоанн пришёл к вам путём праведности[a], и вы ему не поверили, а сборщики налогов и проститутки ему поверили. Вы же, увидев это, даже после этого не переменили своего мнения, чтобы поверить ему.[b]
  rationale: Исправлены стилистически неестественный временной оборот и излишне уступительное оформление причастия; заменено архаизирующее «блудницы» на современное прямое обозначение. Сохраняются аргументативное «Ведь», метафора «путь праведности», одинаковое «поверить ему» и различение между μεταμέλομαι и μετανοέω в сноске.
  reviewer_model: gpt-5.6-terra
