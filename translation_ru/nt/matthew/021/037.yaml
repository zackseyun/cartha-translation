  text: But later he sent his son to them[a], saying, ‘They will respect my son.’
translation:
  language: ru
  text: 'Позднее он послал к ним своего сына, сказав: «Они отнесутся к моему сыну с уважением»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Они проявят почтение к моему сыну». Греческий глагол означает проявить уважение или почтение; в других контекстах он также может означать «стыдиться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: наконец
  rationale: В контексте последовательности посланников слово обозначает последующий, завершающий на данном этапе поступок хозяина. «Наконец» естественно передаёт развитие притчи, не утверждая ничего сверх её повествовательных рамок.
- source_word: δὲ
  choice: (не выражено отдельно)
  rationale: Частица отмечает переход и лёгкое противопоставление; в русском они достаточно переданы словом «наконец», а отдельное «но» сделало бы начало фразы тяжеловесным.
- source_word: ἀπέστειλεν πρὸς αὐτοὺς
  choice: послал к ним
  rationale: Обычное русское соответствие глаголу «посылать» и конструкции направления πρός с винительным падежом; технический смысл апостольского посланничества здесь не привносится.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: своего сына
  rationale: Возвратное притяжательное местоимение естественно по-русски соотносит сына с подлежащим «он» и не добавляет отсутствующего в греческом определения «любимый».
- source_word: λέγων
  choice: сказав
  rationale: Деепричастие естественно вводит прямую речь и сохраняет смысл греческого причастия. Контекст представляет слова хозяина, а не просто скрытую мысль.
- source_word: Ἐντραπήσονται τὸν υἱόν μου
  choice: Моего сына они постыдятся
  rationale: Конструкция ἐντρέπομαι с прямым дополнением допускает значение «устыдиться перед кем-либо, постесняться кого-либо» и тем самым выражает ожидаемую почтительную сдержанность. Формулировка сохраняет живую связь с основным значением стыда и не сводит слово только к отвлечённому уважению.
theological_decisions:
- issue: Обозначение сына в притче без внесения явного христологического титула
  choice: своего сына / моего сына
  alternative: Своего Сына / Моего Сына; любимого сына
  rationale: В греческом стоит обычное υἱός без ἀγαπητός. Строчная буква сохраняет повествовательный уровень притчи, позволяя её христологическому смыслу раскрываться из контекста, а не через добавление переводчика.
- issue: Неоднозначность ἐντρέπομαι между стыдом и почтением
  choice: постыдятся
  alternative: уважат; проявят почтение
  rationale: Выбор удерживает образ стыда или смущения перед сыном, из которого в данном контексте следует уважительное отношение. Смысл «проявят почтение» указан в сноске, чтобы не скрывать контекстуальную направленность глагола.
translation_notes:
  register: Современный литературный русский язык с достоинством притчевой речи. «Постыдятся» понятно современному читателю, но несколько приподнято и сохраняет лексическую напряжённость оригинала; сноска поясняет подразумеваемое почтение.
