  source_fidelity: 'Синтаксис и смена субъектов переданы точно: человек падает на камень, затем камень падает на человека. «Сокрушит» удачно передаёт более сильный λικμήσει. Однако «разобьётся» несколько слабее и менее явно передаёт значение συνθλασθήσεται — быть разбитым на части; «разобьётся вдребезги» точнее сохраняет контраст двух глаголов.'
  naturalness: Текст звучит естественно и литературно. Конструкция «а на кого он упадёт — того сокрушит» ясна, выразительна и соответствует краткому образному регистру.
  terminology: «Камень» последовательно сохраняет λίθος. Термины и образность не содержат конфессионально окрашенного истолкования. В примечании «разотрёт в порошок» естественнее по-русски, чем «размелет в порошок».
