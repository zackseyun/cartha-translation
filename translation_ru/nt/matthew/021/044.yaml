id: MAT.21.44
reference: Matthew 21:44
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸂Καὶ ὁ πεσὼν ἐπὶ τὸν λίθον τοῦτον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ λικμήσει αὐτόν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/044.yaml
  text: And the one who falls on this stone will be broken to pieces[a]; but on whomever it falls[b], it will crush him.
translation:
  language: ru
  text: И тот, кто упадёт на этот камень, разобьётся вдребезги; а на кого он упадёт — того сокрушит.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот стих отсутствует в некоторых рукописях Евангелия от Матфея; ср. Лк. 20:18. Глагол, переведённый как «сокрушит», может ярче означать «разотрёт в порошок» или «развеет, как мякину».
    reason: Текстологический вариант и лексическая альтернатива.
lexical_decisions:
- source_word: ὁ πεσὼν
  choice: тот, кто упадёт
  rationale: Субстантивированное причастие обозначает любого человека в обобщённом, почти пословичном высказывании; эта конструкция естественна по-русски и сохраняет единственное число.
- source_word: ἐπὶ τὸν λίθον τοῦτον
  choice: на этот камень
  rationale: Прямо передаёт пространственное значение и сохраняет образ именно камня (λίθος), связанный с ближайшим контекстом.
- source_word: συνθλασθήσεται
  choice: разобьётся
  rationale: Передаёт тяжёлое повреждение от удара и при этом не стирает различие со следующим, более сильным глаголом λικμήσει.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: а на кого он упадёт
  rationale: 'Сохраняет смену направления действия: теперь падает камень. Неопределённо-относительная конструкция естественно передана русским «на кого».'
- source_word: λικμήσει
  choice: сокрушит
  rationale: Передаёт сильное значение полного раздробления или уничтожения, оставаясь ясным и стилистически достойным; более наглядные оттенки указаны в примечании.
- source_word: αὐτόν
  choice: того
  rationale: Указательное местоимение соотнесено с обобщённым лицом в единственном числе и позволяет избежать неестественного повтора.
theological_decisions:
- issue: Образ камня и метафора суда
  choice: Сохранить конкретный образ камня и различие между двумя действиями без поясняющего истолкования.
  alternative: Прямо назвать камень Мессией или Иисусом либо свести оба глагола к одному общему обозначению уничтожения.
  rationale: Контекст раскрывает значение камня, но сам стих сохраняет образно-пословичную форму. Перевод не добавляет толкования и удерживает напряжение между двумя глаголами.
- issue: Текстологический статус стиха
  choice: Включить стих в основной текст и отметить разночтение в примечании.
  alternative: Исключить стих из основного текста или заключить его в скобки.
  rationale: Стих присутствует в указанном исходном тексте SBLGNT, однако его отсутствие в части рукописей существенно для читателя и потому отмечается.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным и образным синтаксисом. Тире подчёркивает итог второго действия. Единственное примечание объединяет текстологическую и лексическую информацию; маркер [a] присутствует в основном тексте.
