  text: καὶ λαβόντες οἱ γεωργοὶ τοὺς δούλους αὐτοῦ ὃν μὲν ἔδειραν, ὃν δὲ ἀπέκτειναν, ὃν δὲ ἐλιθοβόλησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/035.yaml
  text: And the tenant farmers took his slaves; one they beat[a], another they killed, and another they stoned.
translation:
  language: ru
  text: 'И арендаторы виноградника схватили его рабов[a]: одного избили, другого убили, а третьего забросали камнями.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуг». Греческое слово δοῦλοι в зависимости от контекста может означать как рабов, так и слуг.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: арендаторы виноградника
  rationale: В контексте притчи это люди, которым хозяин передал виноградник и которые обязаны отдавать ему плоды; выражение передаёт и земледельческую среду, и отношения аренды.
- source_word: λαβόντες
  choice: схватили
  rationale: В данном насильственном контексте «схватили» естественно передаёт действие причастия, предшествующее дальнейшему обращению с рабами, не меняя временной последовательности.
- source_word: δούλους
  choice: рабов[a]
  rationale: Основное значение δοῦλοι сохранено без смягчения; сноска отмечает возможный контекстуальный перевод «слуги».
- source_word: ἔδειραν
  choice: избили
  rationale: Передаёт нанесение побоев, не уточняя без достаточных оснований способ или орудие наказания.
- source_word: ἀπέκτειναν
  choice: убили
  rationale: Прямой и нейтральный по регистру эквивалент, не добавляющий юридического оттенка слова «убили преднамеренно» или официальности выражения «предали смерти».
- source_word: ἐλιθοβόλησαν
  choice: забросали камнями
  rationale: Ясно передаёт нападение посредством бросания камней и не утверждает сверх текста, что именно этот раб непременно умер.
- source_word: ὃν μὲν ... ὃν δὲ ... ὃν δὲ
  choice: одного ... другого ... а третьего
  rationale: Естественная русская распределительная конструкция, ясно различающая участь трёх рабов.
theological_decisions:
- issue: Передача δοῦλος в притче
  choice: рабы
  alternative: слуги
  rationale: Греческое слово прямо допускает значение «раб»; оно сохраняет социальную зависимость посланников от хозяина. Возможный более широкий контекстуальный вариант вынесен в сноску, чтобы не скрывать лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и повествовательно энергичная. «Арендаторы виноградника» понятнее обычному читателю, чем профессиональное или архаизирующее обозначение, а «забросали камнями» сохраняет отличие этого действия от прямо названного убийства.
