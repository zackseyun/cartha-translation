source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου πόθεν ἦν; ἐξ οὐρανοῦ ἢ ἐξ ἀνθρώπων; οἱ δὲ διελογίζοντο ⸀ἐν ἑαυτοῖς λέγοντες· Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ ἡμῖν· Διὰ τί οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/025.yaml
  text: The baptism of John—from where was it? From heaven or from men? And they were reasoning among themselves[a], saying, “If we say, ‘From heaven,’ he will say to us[b], ‘Why then did you not believe him?’”
translation:
  language: ru
  text: 'Крещение Иоанна — откуда оно? С небес или от людей?[a] Они же рассуждали между собой: «Если скажем: “С небес”, Он скажет нам: “Почему же вы не поверили ему?”»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «С небес» означает «от Бога», а «от людей» — человеческое происхождение или полномочие.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: крещение
  rationale: Устоявшееся и точное обозначение обряда и служения крещения Иоанна.
- source_word: τὸ Ἰωάννου
  choice: Иоанна
  rationale: Родительный падеж естественно передаёт связь крещения с Иоанном.
- source_word: πόθεν ἦν
  choice: откуда оно было
  rationale: Сохраняет вопрос об источнике и происхождении, оставаясь понятным в контексте последующего противопоставления.
- source_word: ἐξ οὐρανοῦ
  choice: с небес
  rationale: Сохраняет буквальный образ и почтительное указание на божественное происхождение, не заменяя его толкованием «от Бога».
- source_word: ἐξ ἀνθρώπων
  choice: от людей
  rationale: Передаёт происхождение от людей вообще, без гендерного сужения, и ясно противопоставляется небесному источнику.
- source_word: διελογίζοντο ἐν ἑαυτοῖς
  choice: рассуждали между собой
  rationale: Передаёт продолжающееся совместное обсуждение и естественно звучит по-русски.
- source_word: Ἐὰν εἴπωμεν
  choice: Если скажем
  rationale: Естественно передаёт условную конструкцию с аористом сослагательного наклонения.
- source_word: ἐρεῖ ἡμῖν
  choice: Он спросит нас
  rationale: В русском контексте последующая прямая речь является вопросом; глагол «спросит» естественно передаёт функцию λέγω, хотя формально возможно «скажет нам».
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: вы не поверили ему
  rationale: Точно передаёт πιστεύω с дательным падежом как принятие слов и авторитета Иоанна.
theological_decisions:
- issue: Значение выражения «с небес»
  choice: Сохранить «с небес» в основном тексте
  alternative: от Бога
  rationale: Греческое выражение почтительно указывает на божественный источник. Буквальная формулировка сохраняет образ и богословскую сдержанность оригинала.
- issue: Значение ἀνθρώπων в противопоставлении небесам
  choice: от людей
  alternative: от человеков / человеческого происхождения
  rationale: Речь идёт не о мужчинах как таковых, а о человеческом источнике или авторизации; «от людей» точно и современно передаёт этот смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Сохранены краткость, риторическое противопоставление и неоднозначность вопроса об источнике крещения.
