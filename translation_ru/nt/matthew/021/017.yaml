  text: καὶ καταλιπὼν αὐτοὺς ἐξῆλθεν ἔξω τῆς πόλεως εἰς Βηθανίαν, καὶ ηὐλίσθη ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/017.yaml
  text: And leaving them[a], he went out of the city to Bethany and stayed there overnight.
translation:
  language: ru
  text: И, оставив их, Он вышел из города и пошёл в Вифанию, где и провёл ночь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «остался там на ночь»; «переночевал там».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλιπὼν
  choice: оставив
  rationale: Аористное причастие обозначает действие, предшествующее основному; русское деепричастие естественно и точно передаёт эту связь.
- source_word: αὐτοὺς
  choice: их
  rationale: Простое местоимение сохраняет отсылку к упомянутым в ближайшем контексте людям, не уточняя её интерпретационно.
- source_word: ἐξῆλθεν ἔξω τῆς πόλεως
  choice: вышел из города
  rationale: Естественная русская формулировка передаёт усиленное указание на выход за пределы города без неуклюжей избыточности.
- source_word: εἰς Βηθανίαν
  choice: пошёл в Вифанию
  rationale: Предлог εἰς выражает направление; добавление «пошёл» естественно связывает выход из города с направлением движения.
- source_word: ηὐλίσθη
  choice: провёл ночь
  rationale: Глагол означает остановиться на ночлег или переночевать; выбранная формулировка ясна современному читателю и сохраняет временной смысл.
- source_word: ἐκεῖ
  choice: где
  rationale: В русском относительное наречие естественно связывает место ночлега с Вифанией; местное значение «там» сохранено.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Местоимение «Он» применительно к Иисусу написано с прописной буквы по принятой русской библейской традиции; смысловой неоднозначности это не создаёт. Маркер сноски поставлен непосредственно после выражения, к которому относится.
