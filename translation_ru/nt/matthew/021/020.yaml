  text: And when the disciples saw it[a], they marveled, saying, “How did the fig tree wither immediately?”
translation:
  language: ru
  text: 'Увидев это, ученики удивились и сказали: «Как это смоковница сразу засохла?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: увидев это
  rationale: Аористное причастие передано естественным русским деепричастием; местоимение «это» восполняет подразумеваемый из контекста предмет — случившееся со смоковницей.
- source_word: ἐθαύμασαν
  choice: удивились
  rationale: Глагол обозначает удивление или изумление; «удивились» точно передаёт смысл и звучит естественно в современном литературном русском.
- source_word: λέγοντες
  choice: и сказали
  rationale: Причастие сопутствующего действия передано сочинённым глаголом, что сохраняет последовательность повествования и избегает тяжеловесной конструкции «говоря».
- source_word: Πῶς
  choice: как это
  rationale: Вопросительное «как» относится к способу или обстоятельствам события, а частица «это» естественно выражает оттенок удивления, присутствующий в контексте.
- source_word: παραχρῆμα
  choice: сразу
  rationale: Наречие означает «немедленно, тотчас»; «сразу» ясно и естественно передаёт непосредственность события без ослабления временного значения.
- source_word: ἐξηράνθη
  choice: засохла
  rationale: Аорист пассивной формы ξηραίνω в отношении дерева естественно передаётся русским непереходным глаголом «засохла»; грамматическая пассивность по-русски здесь не требует отдельного выражения.
- source_word: ἡ συκῆ
  choice: смоковница
  rationale: Существительное точно обозначает фиговое дерево; «смоковница» — традиционное и по-прежнему понятное литературное соответствие.
