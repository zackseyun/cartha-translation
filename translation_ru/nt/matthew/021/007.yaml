source:
  edition: SBLGNT
  text: ἤγαγον τὴν ὄνον καὶ τὸν πῶλον, καὶ ἐπέθηκαν ⸀ἐπ’ αὐτῶν τὰ ⸀ἱμάτια, καὶ ἐπεκάθισεν ἐπάνω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/007.yaml
  text: They brought the donkey and the colt[a], and put their cloaks on them, and he sat on them.
translation:
  language: ru
  text: Они привели ослицу и ослёнка, положили на них свои плащи, и Он сел на них.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он сел на плащи, положенные на животных».'
    reason: Альтернативное понимание референта греческого местоимения множественного числа.
lexical_decisions:
- source_word: ἤγαγον
  choice: привели
  rationale: Аорист ἄγω здесь передаёт доставление животных к Иисусу; «привели» естественно для животных, которых ведут.
- source_word: τὴν ὄνον
  choice: ослицу
  rationale: Существительное ὄνος с артиклем женского рода здесь обозначает самку осла, мать упомянутого рядом ослёнка; русский язык позволяет передать это ясно и естественно.
- source_word: τὸν πῶλον
  choice: ослёнка
  rationale: πῶλος означает молодое животное; контекст уточняет, что это молодой осёл.
- source_word: ἐπέθηκαν ἐπ’ αὐτῶν τὰ ἱμάτια
  choice: положили на них свои плащи
  rationale: ἱμάτια в этой сцене — верхняя одежда, естественно передаваемая как «плащи». Притяжательное «свои» проясняет контекстуально очевидную принадлежность одежды ученикам.
- source_word: ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: Он сел на них
  rationale: 'Сохранено множественное число местоимения и исходная неоднозначность его референта: это могут быть животные либо положенные на них плащи.'
theological_decisions:
- issue: Референт конечного αὐτῶν во фразе ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: Сохранить буквально прозрачное «Он сел на них».
  alternative: «Он сел на плащи» или смысловое уточнение, что Он сел на одно из животных.
  rationale: Греческое местоимение стоит во множественном числе и допускает отнесение как к животным, так и к плащам. Поскольку текст сам не устраняет синтаксическую неоднозначность, основной перевод её сохраняет, а примечание указывает вероятное понимание.
translation_notes:
  register: Современный литературный русский язык; повествование изложено просто и достойно. «Ослица» передаёт грамматически и контекстуально обозначенный пол животного, а «ослёнок» естественно обозначает молодого осла. Заглавное «Он» соответствует принятому в русском библейском стиле почтительному написанию местоимения, относящегося к Иисусу.
