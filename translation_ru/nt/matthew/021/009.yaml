id: MAT.21.9
reference: Matthew 21:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι οἱ προάγοντες ⸀αὐτὸν καὶ οἱ ἀκολουθοῦντες ἔκραζον λέγοντες· Ὡσαννὰ τῷ υἱῷ Δαυίδ· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/009.yaml
  text: And the crowds going ahead of him and those following were crying out[a], saying[c][b], “Hosanna to the Son of David! Blessed is the one who comes in the name of the Lord! Hosanna in the highest!”
translation:
  language: ru
  text: 'А толпы, шедшие впереди него и следовавшие за ним, восклицали: «Осанна[a] Сыну Давида[b]! Благословен тот, кто приходит во имя Господа[c]! Осанна в вышних!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Осанна» — восходящее к еврейскому языку восклицание со значением примерно «спаси же» или «спаси сейчас»; здесь оно звучит также как возглас хвалы.
    reason: lexical_alternative
  - marker: b
    text: «Сын Давида» — царский мессианский титул.
    reason: cultural_note
  - marker: c
    text: Эти слова перекликаются с Псалмом 117:26 (в иной нумерации — 118:26), где слову «Господь» в еврейском тексте соответствует божественное имя YHWH.
    reason: cross_reference
lexical_decisions:
- source_word: ὄχλοι
  choice: толпы
  rationale: Передаёт собравшиеся массы людей и естественно звучит в современном русском языке.
- source_word: προάγοντες αὐτόν
  choice: шедшие впереди него
  rationale: Ясно описывает участников шествия, двигавшихся перед Иисусом, не приписывая им роль официальных предводителей.
- source_word: ἀκολουθοῦντες
  choice: следовавшие за ним
  rationale: Сохраняет процессуальную картину и образует естественную параллель с выражением «шедшие впереди него».
- source_word: ἔκραζον λέγοντες
  choice: восклицали
  rationale: Русский глагол естественно объединяет идею громкого крика и произнесения последующих слов; несовершенный вид передаёт продолжавшееся действие греческого имперфекта.
- source_word: Ὡσαννά
  choice: Осанна
  rationale: Сохраняет укоренившееся литургическое восклицание; исходный смысл поясняется в сноске.
- source_word: τῷ υἱῷ Δαυίδ
  choice: Сыну Давида
  rationale: Дательный падеж точно соответствует греческой форме и сохраняет царский мессианский титул без пояснительной подмены словом «Мессия».
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: Благословен тот, кто приходит
  rationale: Современная и ясная формулировка, сохраняющая единственное число и субстантивированное значение греческого причастия.
- source_word: ἐν ὀνόματι κυρίου
  choice: во имя Господа
  rationale: Традиционное и точное соответствие, сохраняющее отсылку к Псалму и значение действия с Божьим полномочием.
- source_word: κυρίου
  choice: Господа
  rationale: Непосредственно передаёт греческое κύριος; связь с именем YHWH в еврейском тексте Псалма отмечена в сноске.
- source_word: ἐν τοῖς ὑψίστοις
  choice: в вышних
  rationale: Краткое, узнаваемое литургическое выражение, указывающее на высшую небесную сферу и не конкретизирующее её сверх текста.
theological_decisions:
- issue: Мессианский царский титул τῷ υἱῷ Δαυίδ
  choice: Сохранить «Сыну Давида» как титул.
  alternative: «Мессии»
  rationale: Греческий текст употребляет именно династический титул; его сохранение передаёт историческую и богословскую фактуру, не заменяя её толкованием.
- issue: Передача Ὡσαννά
  choice: Оставить «Осанна» в основном тексте, а исходное значение объяснить в сноске.
  alternative: «Спаси же» или «Спаси сейчас»
  rationale: В данном контексте слово служит литургическим приветственным возгласом с оттенком хвалы, хотя восходит к просьбе о спасении.
- issue: Значение κυρίου в цитате из Псалма
  choice: Перевести как «Господа».
  alternative: Передать непосредственно как «Яхве»
  rationale: Основной греческий текст содержит κύριος, тогда как связь с божественным именем в еврейском тексте Псалма уместно сохранить в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Устоявшиеся библейские выражения «Осанна», «Сын Давида» и «в вышних» сохранены ради их литургической и межтекстовой выразительности; синтаксис при этом сделан естественным для современного читателя.
