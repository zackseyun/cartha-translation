  text: Εἴπατε τῇ θυγατρὶ Σιών· Ἰδοὺ ὁ βασιλεύς σου ἔρχεταί σοι πραῢς καὶ ἐπιβεβηκὼς ἐπὶ ὄνον καὶ ⸀ἐπὶ πῶλον υἱὸν ὑποζυγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/005.yaml
  text: Tell the daughter of Zion[a], ‘Look, your king is coming to you, gentle and mounted on a donkey, and on a colt[b], the foal of a beast of burden.’
translation:
  language: ru
  text: 'Скажите дочери Сиона: «Вот, твой царь идёт к тебе — кроткий[a], сидящий верхом на ослице и на ослёнке[b], детёныше вьючного животного».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смиренный». Греческое πραΰς может означать «кроткий», «смиренный» или «незлобивый» и перекликается с Захарией 9:9.'
    reason: lexical_alternative
  - marker: b
    text: 'Матфей сохраняет пророческую формулировку с двумя связанными обозначениями животных: «на ослице и на ослёнке, детёныше вьючного животного».'
    reason: cross_reference
lexical_decisions:
- source_word: Εἴπατε
  choice: Скажите
  rationale: Аористный императив множественного числа передан естественным русским повелительным глаголом, сохраняющим обращение к нескольким слушателям.
- source_word: τῇ θυγατρὶ Σιών
  choice: дочери Сиона
  rationale: Сохранена пророческая персонификация Сиона, а не заменена пояснением «жителям Сиона».
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Современный и естественный русский указательный возглас, привлекающий внимание без архаизации.
- source_word: ὁ βασιλεύς σου
  choice: твой Царь
  rationale: Прямо передаёт притяжательную конструкцию и царское достоинство; прописная буква уместна в данном мессианском контексте.
- source_word: ἔρχεταί σοι
  choice: идёт к тебе
  rationale: Настоящее время передаёт живую непосредственность приближения; «идёт» по-русски естественнее буквального «приходит» в данной сцене.
- source_word: πραῢς
  choice: кроткий
  rationale: «Кроткий» охватывает незлобивость и мягкость, сохраняет библейскую смысловую связь с Захарией 9:9; возможный оттенок смирения отмечен в сноске.
- source_word: ἐπιβεβηκὼς
  choice: восседающий
  rationale: Причастие передаёт состояние того, кто взошёл на животное и сидит на нём; выбор сохраняет достоинство царского образа без излишней буквальности.
- source_word: ἐπὶ ὄνον
  choice: на ослице
  rationale: Форма ὄνον сама по себе может быть формой общего обозначения осла либо женского рода; в цитатном контексте Захарии и ближайшем повествовании Матфея естественно «ослица».
- source_word: πῶλον
  choice: на ослёнке
  rationale: πῶλος обозначает молодое животное; контекст уточняет, что речь идёт о молодом вьючном животном, поэтому «ослёнок» яснее общего «жеребёнок».
- source_word: υἱὸν ὑποζυγίου
  choice: детёныше вьючного животного
  rationale: Семитизированное «сын вьючного животного» передано естественно по-русски, но образ животного, несущего груз, сохранён.
theological_decisions:
- issue: Цитата из Захарии 9:9 и двойное обозначение животных
  choice: 'Сохранить формулировку Матфея: «на ослице и на ослёнке, детёныше вьючного животного»'
  alternative: Свести оба выражения к одному животному или гармонизировать цитату с иной формой текста Захарии
  rationale: Перевод следует греческому тексту Матфея и не снимает его синтаксической и интерпретационной напряжённости. Союз καί и оба предложных оборота воспроизведены.
- issue: Смысл πραῢς в мессианском описании царя
  choice: кроткий
  alternative: смиренный
  rationale: «Кроткий» естественно выражает мягкость и отсутствие насилия, тогда как возможный оттенок смирения сохранён в примечании, а не выбран как единственно допустимый.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. «Вот» избегает архаичного «се», а «дочь Сиона» сохраняет библейскую персонификацию. Синтаксическая напряжённость двойного ἐπί намеренно не сглажена.
