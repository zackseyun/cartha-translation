id: MAT.21.15
reference: Matthew 21:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὰ θαυμάσια ἃ ἐποίησεν καὶ τοὺς παῖδας ⸀τοὺς κράζοντας ἐν τῷ ἱερῷ καὶ λέγοντας· Ὡσαννὰ τῷ υἱῷ Δαυίδ ἠγανάκτησαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/015.yaml
  text: But when the chief priests and the scribes saw the wonderful things that he did[a], and the children crying out in the temple and saying[b], “Hosanna to the Son of David,” they were indignant.
translation:
  language: ru
  text: 'Но первосвященники и книжники, увидев удивительные дела, которые Он совершил, и детей, кричавших в храме[a]: «Осанна[b] Сыну Давида!» — возмутились.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово, переведённое как «храм», обозначает весь храмовый комплекс, а не только внутреннее святилище.
    reason: cultural_note
  - marker: b
    text: «Осанна» — возглас еврейского происхождения, первоначально означавший примерно «спаси же» или «спаси сейчас»; к тому времени он употреблялся также как возглас хвалы.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: увидев
  rationale: Аористное причастие передаёт обстоятельство, предшествующее главному действию; русское деепричастие естественно и точно сохраняет эту связь.
- source_word: δὲ
  choice: но
  rationale: Передаёт мягкий контраст с предшествующей сценой.
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся русское обозначение ведущих представителей священнической власти во множественном числе.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Прямой и традиционно понятный эквивалент для знатоков и толкователей Закона; не требует пояснительной парафразы.
- source_word: τὰ θαυμάσια
  choice: чудесные дела
  rationale: Передаёт субстантивированное прилагательное как замечательные, вызывающие изумление деяния, не ограничивая смысл формальной категорией чудес.
- source_word: ἐποίησεν
  choice: совершил
  rationale: Естественно сочетается с выражением «чудесные дела» и передаёт простой аорист.
- source_word: παῖδας
  choice: детей
  rationale: В данном контексте это наиболее вероятное значение; варианты «слуги» и только «мальчики» контекстуально менее уместны.
- source_word: κράζοντας
  choice: кричавших
  rationale: Передаёт громкое публичное возглашение без дополнительного оттенка враждебности.
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: Естественное русское выражение; ἱερόν обозначает храмовый комплекс, а не только внутреннее святилище.
- source_word: λέγοντας
  choice: двоеточие перед прямой речью
  rationale: В русском языке содержание громкого возгласа естественно вводится прямой речью; смысл причастия «говоривших» сохранён синтаксически без тяжеловесного повтора.
- source_word: Ὡσαννὰ
  choice: Осанна
  rationale: Сохраняется закрепившееся богослужебное заимствование, совмещающее исходную мольбу о спасении и функцию хвалебного возгласа.
- source_word: τῷ υἱῷ Δαυίδ
  choice: Сыну Давида
  rationale: Дательный падеж непосредственно передаёт греческую форму, а мессианский титул сохраняется буквально.
- source_word: ἠγανάκτησαν
  choice: вознегодовали
  rationale: Передаёт сильное недовольство и возмущение религиозных руководителей; слово соответствует достоинству библейского повествования и остаётся понятным современному читателю.
theological_decisions:
- issue: Мессианское значение выражения «Сын Давида»
  choice: Сыну Давида
  alternative: Давидову наследнику; сыну Давида
  rationale: Буквальная титульная форма сохраняет мессианское значение выражения в повествовании Матфея, не сводя его к простому указанию на происхождение.
- issue: Значение Ὡσαννά
  choice: Осанна с пояснением в сноске
  alternative: Спаси же; даруй спасение
  rationale: В контексте выражение одновременно восходит к мольбе о спасении и служит закрепившимся возгласом хвалы; транслитерация не устраняет эту богословскую и семантическую напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Синтаксис сделан плавным и ясным; традиционные термины «первосвященники», «книжники», «Осанна» и титул «Сын Давида» сохранены. Единственная сноска объединяет два кратких пояснения, поскольку маркер естественно ставится после всей цитаты и все заявленные примечания должны иметь маркер в основном тексте.
