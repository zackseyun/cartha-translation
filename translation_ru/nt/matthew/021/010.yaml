base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/010.yaml
  text: And when he entered Jerusalem[a], the whole city was stirred up, saying, “Who is this?”
translation:
  language: ru
  text: 'Когда он вошёл в Иерусалим, весь город пришёл в волнение[a] и спрашивал: «Кто это?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «содрогнулся». Греческий глагол может обозначать физическое сотрясение, а здесь описывает волнение, охватившее город.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: когда он вошёл
  rationale: Родительный самостоятельный оборот естественно передаётся временным придаточным; такая формулировка не уточняет сверх текста, произошло ли действие непосредственно перед последующей реакцией или одновременно с её началом.
- source_word: Ἱεροσόλυμα
  choice: Иерусалим
  rationale: Устоявшаяся русская форма географического названия.
- source_word: ἐσείσθη
  choice: пришёл в волнение
  rationale: Глагол σείω буквально обозначает сотрясение, но здесь метафорически описывает охватившее город общественное возбуждение. Выбранный оборот передаёт контекстуальный смысл естественным современным русским языком; буквальная образность отмечена в сноске.
- source_word: πᾶσα ἡ πόλις
  choice: весь город
  rationale: Естественная русская передача собирательного выражения, относящего реакцию к городу в целом.
- source_word: λέγουσα
  choice: и люди спрашивали
  rationale: Причастие согласовано с персонифицированным словом «город» и вводит прямой вопрос. В русском явное указание на жителей позволяет естественно раскрыть эту метонимию; вопросительная форма реплики оправдывает глагол «спрашивали».
- source_word: Τίς ἐστιν οὗτος;
  choice: Кто это?
  rationale: Прямая и естественная передача вопроса без добавления отсутствующего в греческом тексте слова «человек».
theological_decisions:
- issue: Буквальное или переносное значение реакции города
  choice: Передать ἐσείσθη как «пришёл в волнение»
  alternative: «содрогнулся» / «был потрясён»
  rationale: Контекст говорит о коллективной реакции на вход Иисуса, а не прямо о физическом землетрясении. Основной текст передаёт переносный смысл, тогда как исходный образ и возможная буквальная окраска сохраняются в сноске.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю. Сохранена краткость и динамика повествования. Местоимение «он» написано со строчной буквы как обычное грамматическое местоимение, без внесения конфессиональной типографской традиции.
