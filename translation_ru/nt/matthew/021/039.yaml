  verdict: revise
  source_fidelity: 'Греческая последовательность действий передана верно: арендаторы берут сына, выводят/выбрасывают его за пределы виноградника и затем убивают. Однако «схватив» вносит оттенок насильственного захвата, который возможен по контексту, но не выражен самим λαβόντες; английский контрольный перевод столь же осторожно выбирает нейтральное «took».'
  naturalness: «Они взяли его, выбросили из виноградника и убили» — краткая, естественная для современного литературного русского повествовательная цепочка. Повтор местоимения не требуется и по-русски звучал бы тяжеловесно.
  terminology: «Виноградник» точно передаёт ἀμπελών. «Выбросили» адекватно передаёт физическое изгнание в данном контексте; «убили» — прямой нейтральный эквивалент ἀπέκτειναν.
