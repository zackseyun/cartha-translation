  text: καὶ λαβόντες αὐτὸν ἐξέβαλον ἔξω τοῦ ἀμπελῶνος καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/039.yaml
  text: And they took him[a], threw him out of the vineyard, and killed him.
translation:
  language: ru
  text: Они взяли его, выбросили из виноградника и убили.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: Схватив
  rationale: Аористное причастие от λαμβάνω вводит действие, предшествующее следующим глаголам. В данном враждебном контексте «схватив» естественно передаёт физическое овладение человеком, не добавляя отдельного действия, которого нет в тексте.
- source_word: ἐξέβαλον
  choice: выбросили
  rationale: ἐκβάλλω здесь обозначает насильственное удаление наружу; «выбросили» ясно и естественно передаёт это движение в сочетании с «из виноградника».
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: из виноградника
  rationale: Оборот указывает на движение за пределы виноградника. Русская конструкция «выбросили из виноградника» непосредственно и идиоматично передаёт пространственное значение.
- source_word: ἀμπελῶνος
  choice: виноградника
  rationale: ἀμπελών прямо означает виноградник; это точный и общепонятный эквивалент в контексте притчи.
- source_word: ἀπέκτειναν
  choice: убили
  rationale: ἀποκτείνω означает «убить, предать смерти». «Убили» — прямой современный эквивалент без усиления до более интерпретирующего «убили преднамеренно» или «совершили убийство».
theological_decisions:
- issue: Последовательность изгнания и убийства в сопоставлении с параллельными повествованиями
  choice: Сын сначала выброшен из виноградника, а затем убит.
  alternative: Согласовать с Марком и Лукой, подразумевая, что его сначала убили, а затем выбросили.
  rationale: 'В греческом тексте Матфея последовательность выражена прямо: λαβόντες… ἐξέβαλον… καὶ ἀπέκτειναν. Перевод сохраняет порядок действий у Матфея и не гармонизирует его с параллельными местами.'
translation_notes:
  register: Современный литературный русский язык; повествование краткое и энергичное. «Схватив» соответствует враждебному контексту, а «выбросили» передаёт физическое изгнание без архаичного оттенка.
