id: MAT.21.42
reference: Matthew 21:42
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Λέγει αὐτοῖς ὁ Ἰησοῦς· Οὐδέποτε ἀνέγνωτε ἐν ταῖς γραφαῖς· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας· παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/042.yaml
  text: 'Jesus said to them[a], “Have you never read in the Scriptures: ‘The stone that the builders rejected—this one has become the cornerstone. This came from the Lord[b], and it is marvelous in our eyes’?”'
translation:
  language: ru
  text: 'Иисус сказал им: «Разве вы никогда не читали в Писаниях: „Камень, который отвергли строители, — он стал краеугольным камнем.[a] От Господа это произошло,[b] и дивно это в наших глазах“?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верхним камнем»; буквально: «главой угла».'
    reason: lexical_alternative
  - marker: b
    text: Греч. «от Господа»; в еврейском тексте цитируемого псалма стоит имя Яхве.
    reason: source_language_background
lexical_decisions:
- source_word: Λέγει
  choice: сказал
  rationale: Историческое настоящее в греческом повествовании естественно передаётся русским прошедшим временем.
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: Разве вы никогда не читали
  rationale: «Разве» передаёт риторическую силу вопроса, а «никогда» сохраняет усиление Οὐδέποτε.
- source_word: γραφαῖς
  choice: Писаниях
  rationale: В контексте речь идёт о священных Писаниях Израиля; прописная буква ясно обозначает это значение.
- source_word: ἀπεδοκίμασαν
  choice: отвергли
  rationale: Глагол означает признать негодным и отвергнуть; краткое русское соответствие сохраняет смысл и образ.
- source_word: οἱ οἰκοδομοῦντες
  choice: строители
  rationale: Субстантивированное причастие естественно передаётся существительным и сохраняет строительную метафору.
- source_word: οὗτος ἐγενήθη
  choice: он стал
  rationale: Местоимение сохраняет указательное выделение данного камня без неестественного русского «этот стал».
- source_word: κεφαλὴν γωνίας
  choice: краеугольным камнем
  rationale: Устойчивый и понятный русский эквивалент образного выражения; буквальное значение отмечено в сноске.
- source_word: παρὰ κυρίου ἐγένετο αὕτη
  choice: От Господа это произошло
  rationale: Передаёт источник действия, выраженный παρά с родительным падежом, и сохраняет структуру цитаты.
- source_word: θαυμαστὴ
  choice: дивно
  rationale: Сохраняет возвышенный поэтический регистр цитаты и естественно сочетается с выражением «в наших глазах».
theological_decisions:
- issue: Передача κύριος в цитате из Псалма
  choice: Господь
  alternative: ГОСПОДЬ, то есть передача имени Яхве
  rationale: Непосредственный греческий текст содержит κύριος; еврейский источник цитаты употребляет тетраграмматон, что прозрачно отмечено в сноске.
- issue: Мессианское применение образа камня
  choice: Сохранить метафору без поясняющего добавления
  alternative: Прямо назвать камень Мессией или Иисусом
  rationale: Контекст указывает на применение образа Иисусом к себе, однако сама цитата не содержит такого прямого отождествления; перевод не должен добавлять толкование.
- issue: Определение положения камня
  choice: краеугольный камень
  alternative: верхний камень / камень во главе угла
  rationale: Греческое выражение допускает обсуждение точного архитектурного образа; основной текст использует привычное соответствие, не устраняя альтернативу, указанную в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным регистром внутри библейской цитаты. Риторический вопрос передан естественно; синтаксический параллелизм и образность Псалма сохранены.
