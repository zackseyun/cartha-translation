lexical_decisions:
- source_word: Τοῦτο
  choice: Это
  rationale: Указательное местоимение среднего рода единственного числа относится ко всему непосредственно предшествующему событию; «это» естественно передаёт такую обобщённую отсылку.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Здесь частица имеет слабую связующую функцию. В русском языке переход естественно передаётся самим началом пояснительного предложения; «но» создало бы неоправданное противопоставление, а «теперь» внесло бы временной оттенок.
- source_word: γέγονεν
  choice: произошло
  rationale: Перфект γίνομαι в формуле исполнения указывает на состоявшееся событие; прошедшее время «произошло» естественно для русского повествования.
- source_word: ἵνα
  choice: чтобы
  rationale: Союз сохраняет присущую греческой конструкции целевую и результативную направленность, не устраняя её смыслового напряжения.
- source_word: πληρωθῇ
  choice: исполнилось
  rationale: Глагол в аористе страдательного залога и сослагательного наклонения после ἵνα естественно передаётся русской конструкцией «чтобы исполнилось».
- source_word: τὸ ῥηθὲν
  choice: сказанное
  rationale: Субстантивированное страдательное причастие передано кратко и близко к форме оригинала.
- source_word: διὰ τοῦ προφήτου
  choice: через пророка
  rationale: 'διά с родительным падежом обозначает посредничество: пророк выступает проводником возвещённого слова.'
- source_word: λέγοντος
  choice: который говорит
  rationale: Определительное придаточное сохраняет настоящее время греческого причастия и вводит следующую далее цитату естественнее, чем буквальное «говорящего».
theological_decisions:
- issue: Формула исполнения и роль пророка
  choice: «исполнилось сказанное через пророка»
  alternative: «исполнилось сказанное пророком»
  rationale: Основной текст сохраняет выраженное διά с родительным значение посредничества и тем самым допускает понимание пророка как проводника речи, не добавляя прямо не названного говорящего.
- issue: Цель или результат в конструкции ἵνα
  choice: «чтобы исполнилось»
  alternative: «так исполнилось»
  rationale: «Чтобы» сохраняет целевую направленность формулы, одновременно не исключая оттенка результата; перевод не сводит неоднозначную конструкцию только к одному из этих значений.
