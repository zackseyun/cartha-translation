lexical_decisions:
- source_word: ἄρα οὖν
  choice: Итак
  rationale: Сочетание выводных частиц подводит итог предшествующему рассуждению; «итак» естественно и ясно вводит призыв.
- source_word: μὴ καθεύδωμεν
  choice: не будем спать
  rationale: Увещательное сослагательное наклонение передано совместным призывом. Образ сна сохранён, поскольку в контексте он имеет нравственно-духовный смысл.
- source_word: ὡς οἱ λοιποί
  choice: как прочие
  rationale: Субстантивированное οἱ λοιποί обозначает остальных людей, противопоставленных верующим в ближайшем контексте. «Прочие» кратко и сохраняет это сопоставление.
- source_word: ἀλλὰ
  choice: но
  rationale: Простой противительный союз непосредственно передаёт противопоставление.
- source_word: γρηγορῶμεν
  choice: будем бодрствовать
  rationale: Глагол означает как пребывание без сна, так и бдительность. «Бодрствовать» сохраняет связь с образом сна и допускает значение духовной бдительности.
- source_word: νήφωμεν
  choice: будем сохранять трезвость
  rationale: νήφω выражает трезвость, а переносно — ясность ума и сдержанность. Эта формулировка естественна в современном русском языке и не устраняет намеренно более широкий смысл.
theological_decisions:
- issue: Метафорический смысл сна и бодрствования
  choice: Сохранить в основном тексте образы сна и бодрствования как нравственно-духовный призыв.
  alternative: Передать их пояснительно как беспечность и бдительность.
  rationale: Контекст противопоставляет сынов света и дня тем, кто принадлежит ночи. Сохранение образов передаёт ход мысли Павла без излишнего толкования.
- issue: Передача νήφω
  choice: «сохранять трезвость»
  alternative: «владеть собой» или «сохранять ясность ума»
  rationale: Греческое слово соединяет прямой смысл трезвости с переносными оттенками рассудительности, настороженности и самообладания; перевод сохраняет это смысловое напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксический параллелизм призыва сохранён; метафоры сна, бодрствования и трезвости не заменены отвлечёнными богословскими формулировками.
