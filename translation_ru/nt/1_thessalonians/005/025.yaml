  text: Brothers[a], pray for us.
translation:
  language: ru
  text: Братья[a], молитесь о нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Братья и сёстры», поскольку обращение, вероятно, относится ко всей общине.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Братья
  rationale: Форма звательного множественного числа от ἀδελφός буквально имеет мужской род. В основном тексте сохранено «Братья», а вероятное обращение ко всей общине, включая женщин, отражено в сноске.
- source_word: προσεύχεσθε
  choice: молитесь
  rationale: Настоящее повелительное, второе лицо множественного числа. «Молитесь» естественно передаёт призыв; возможный оттенок продолжительности в русском контексте не требует добавления «продолжайте».
- source_word: περὶ
  choice: о
  rationale: С родительным ἡμῶν предлог выражает предмет молитвенной заботы. Русское «молиться о ком-либо» здесь естественно и точно.
- source_word: ἡμῶν
  choice: нас
  rationale: Местоимение первого лица множественного числа относится к Павлу и его сотрудникам; перевод не уточняет состав этой группы сверх сказанного в тексте.
theological_decisions:
- issue: Обращение Ἀδελφοί к общине, вероятно состоявшей из мужчин и женщин
  choice: Братья
  alternative: Братья и сёстры
  rationale: Основной текст сохраняет грамматически мужскую форму греческого обращения, не скрывая при этом вероятного инклюзивного охвата; это поясняется сноской.
translation_notes:
  register: Краткая, естественная и достойная формулировка на современном литературном русском языке. Порядок слов следует выразительной простоте греческого текста.
