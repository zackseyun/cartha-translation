base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/008.yaml
  text: But since we are of the day[a], let us be sober, having put on the breastplate of faith and love[b], and the hope of salvation as a helmet.
translation:
  language: ru
  text: Мы же, принадлежащие дню, будем трезвы, надев нагрудник веры[a] и любви, а также шлем — надежду на спасение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верности». Греческое слово πίστις может означать веру, доверие или верность; здесь в основном тексте выбран обычный перевод «вера».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Мы же
  rationale: Частица δέ противопоставляет адресатов упомянутым ранее людям ночи; конструкция «мы же» естественно и без избыточного истолкования передаёт этот контраст.
- source_word: ἡμέρας ὄντες
  choice: принадлежащие дню
  rationale: Родительный падеж с εἰμί обозначает принадлежность или сферу. Такой перевод сохраняет метафору дня и яснее для современного русского читателя, чем буквальное «сущие от дня».
- source_word: νήφωμεν
  choice: будем трезвы
  rationale: Глагол νήφω допускает как буквальную трезвость, так и переносный смысл бдительного самообладания. «Будем трезвы» сохраняет обе грани на фоне образов ночи, дня и бодрствования.
- source_word: ἐνδυσάμενοι
  choice: надев
  rationale: Аористное причастие описывает сопутствующий образ действия. Деепричастие «надев» кратко и естественно вводит метафору вооружения.
- source_word: θώρακα
  choice: нагрудник
  rationale: Прямое обозначение части воинских доспехов; сохраняет конкретность метафоры.
- source_word: πίστεως
  choice: веры
  rationale: В сочетании с любовью и надеждой πίστις естественно обозначает веру. Возможное значение «верность» сохранено в примечании.
- source_word: ἀγάπης
  choice: любви
  rationale: Обычное и контекстуально точное соответствие ἀγάπη в ряду веры, любви и надежды.
- source_word: περικεφαλαίαν
  choice: шлем
  rationale: Прямой современный эквивалент воинского термина.
- source_word: ἐλπίδα σωτηρίας
  choice: надежду на спасение
  rationale: Родительный σωτηρίας наиболее естественно понимается как то, на что направлена надежда. Русское «надежда на спасение» ясно выражает это отношение, не исключая более широкого оттенка надежды, связанной со спасением.
theological_decisions:
- issue: Значение πίστις в метафоре доспехов
  choice: вера
  alternative: верность; доверие
  rationale: Сочетание с любовью и надеждой указывает на известную Павлову триаду добродетелей и поддерживает перевод «вера», однако лексически возможный оттенок верности не устранён и отмечен в сноске.
- issue: Смысл выражения ἡμέρας ὄντες
  choice: принадлежащие дню
  alternative: будучи от дня
  rationale: Выражение говорит не просто о времени суток, а о принадлежности к символической сфере дня. Выбранная формулировка сохраняет метафору, не разворачивая её в дополнительное богословское утверждение.
- issue: Связь ἐλπίδα с περικεφαλαίαν
  choice: шлем — надежду на спасение
  alternative: надежду на спасение как шлем
  rationale: Именное приложение сохраняет образ, в котором надежда отождествляется со шлемом, и близко передаёт греческую конструкцию без искусственной русской инверсии.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Воинская метафора и триада «вера, любовь, надежда» сохранены; устаревшие обороты устранены.
