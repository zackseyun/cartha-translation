  yaml_path: translation/nt/1_thessalonians/005/022.yaml
  text: Abstain from every kind of evil[a].
translation:
  language: ru
  text: Воздерживайтесь от всякого рода зла[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от всякой формы зла»; в традиционном английском переводе: «от всякой видимости зла».'
    reason: 'Лексическая альтернатива для εἴδους: слово может обозначать вид, род или форму; значение «видимость» в данном контексте менее вероятно.'
lexical_decisions:
- source_word: ἀπέχεσθε
  choice: удаляйтесь
  rationale: Настоящее повелительное наклонение, 2-е лицо множественного числа, выражает постоянное воздержание и дистанцирование; «удаляйтесь» естественно сочетается с предлогом «от» и сохраняет повелительную силу.
- source_word: ἀπὸ
  choice: от
  rationale: 'Передаёт обычное отделительное значение при ἀπέχω: держаться в стороне, удаляться от чего-либо.'
- source_word: παντὸς
  choice: всякого
  rationale: Согласуется с родительным единственного числа εἴδους и естественно передаёт значение «каждого, любого».
- source_word: εἴδους
  choice: вида
  rationale: В данном контексте наиболее вероятно означает «вид, разновидность, форма», а не просто внешнюю видимость; «вид» сохраняет краткость и часть лексической многозначности.
- source_word: πονηροῦ
  choice: зла
  rationale: Субстантивированное прилагательное в родительном падеже при εἴδους; «зла» — прямой и естественный русский эквивалент.
theological_decisions:
- issue: Значение εἴδους в выражении ἀπὸ παντὸς εἴδους πονηροῦ
  choice: от всякого вида зла
  alternative: 'от всякой формы зла; традиционно: от всякой видимости зла'
  rationale: В контексте наставлений различать и испытывать всё выражение, вероятнее всего, призывает избегать любой разновидности зла. Традиционная передача через «видимость» может ошибочно сместить смысл к тому, что лишь кажется злым; альтернативы указаны в сноске для прозрачности.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и понятная формулировка. Императив во множественном числе сохранён, богословская неоднозначность εἴδους отражена в сноске.
