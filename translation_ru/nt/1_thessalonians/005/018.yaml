  edition: SBLGNT
  text: ἐν παντὶ εὐχαριστεῖτε· τοῦτο γὰρ θέλημα θεοῦ ἐν Χριστῷ Ἰησοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/018.yaml
  text: Give thanks in everything[b][a], for this is God's will in Messiah Jesus for you.
translation:
  language: ru
  text: Во всём благодарите[a], потому что это — воля Бога для вас в Мессии Иисусе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «При любых обстоятельствах благодарите». Буквально: «во всём»; речь прежде всего об обстоятельствах, в которых следует благодарить, а не обязательно о благодарности за само зло.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционный перевод: «во Христе Иисусе».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντί
  choice: во всём
  rationale: Буквально и достаточно естественно передаёт сферу или обстоятельства благодарения. В отличие от «за всё», не утверждает однозначно, что следует благодарить за само зло.
- source_word: εὐχαριστεῖτε
  choice: благодарите
  rationale: Настоящее повелительное наклонение, второе лицо множественного числа. Русская форма прямо и естественно передаёт призыв к постоянной практике без избыточного добавления наречия.
- source_word: τοῦτο
  choice: это
  rationale: Сохраняет краткость и возможный объём отсылки греческого указательного местоимения, не заменяя его истолкованием вроде «эта заповедь».
- source_word: γὰρ
  choice: потому что
  rationale: Ясно вводит основание предшествующего повеления и звучит естественно в современном русском языке.
- source_word: θέλημα θεοῦ
  choice: воля Бога
  rationale: Прямо передаёт родительный падеж принадлежности; формулировка современна и не добавляет конфессиональной окраски.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  rationale: Сохраняет предлог «в» и характерный для Павла язык пребывания или единения, а Χριστός передаёт как осмысленный титул «Мессия», не превращая его в непрозрачное имя.
- source_word: εἰς ὑμᾶς
  choice: для вас
  rationale: Естественно передаёт направленность и отношение Божьей воли к адресатам; буквальное «к вам» здесь по-русски менее ясно.
theological_decisions:
- issue: Следует ли понимать благодарение как благодарность за всё, включая зло, или как благодарение при любых обстоятельствах
  choice: Во всём благодарите
  alternative: При любых обстоятельствах благодарите; За всё благодарите
  rationale: ἐν с дательным παντί прежде всего обозначает сферу или обстоятельства действия. Основной текст сохраняет лаконичность и некоторую неоднозначность греческого выражения, а примечание предотвращает необязательный вывод, будто зло само по себе названо предметом благодарности.
- issue: Передача Χριστός как титула или традиционного наименования
  choice: Мессия Иисус
  alternative: Христос Иисус
  rationale: Здесь Χριστός сохраняет значение титула, поэтому «Мессия» делает его смысл прозрачным. Традиционный вариант указан в примечании.
- issue: Значение выражения ἐν Χριστῷ Ἰησοῦ
  choice: сохранить формулу «в Мессии Иисусе» без поясняющего перефразирования
  alternative: через Мессию Иисуса; благодаря Мессии Иисусу
  rationale: Предлог ἐν допускает богословски насыщенное значение связи и единения с Мессией. Перевод «через» или «благодаря» неоправданно сузил бы эту формулу.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Сохранены краткость стиха, анафорическая неопределённость слова «это» и формула «в Мессии Иисусе»; пояснения вынесены в сноски.
