id: 1TH.5.14
reference: 1 Thessalonians 5:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, νουθετεῖτε τοὺς ἀτάκτους, παραμυθεῖσθε τοὺς ὀλιγοψύχους, ἀντέχεσθε τῶν ἀσθενῶν, μακροθυμεῖτε πρὸς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/014.yaml
  text: And we urge you[a], brothers, admonish the disorderly, encourage the fainthearted, help the weak[d][c][b], be patient with everyone.
translation:
  language: ru
  text: 'Просим вас, братья[a]: вразумляйте тех, кто нарушает порядок[b], ободряйте малодушных[c], поддерживайте слабых[d], будьте терпеливы ко всем.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры»; Павел обращается ко всей общине.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «бездельников», «недисциплинированных» или «непокорных».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «утешайте унывающих».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «помогайте слабым».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦμεν
  choice: просим
  rationale: В данном наставительном контексте глагол выражает настойчивую пастырскую просьбу. «Просим» естественно звучит по-русски и сохраняет серьёзность обращения без излишне официального оттенка.
- source_word: δέ
  choice: не выражено отдельным словом
  rationale: Здесь частица обозначает мягкий переход или продолжение, а не резкое противопоставление; в русском начало нового наставления естественно и без отдельного союза.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохранена грамматически мужская форма греческого обращения; по контексту оно относится ко всей общине, что отмечено в сноске.
- source_word: νουθετεῖτε
  choice: вразумляйте
  rationale: Глагол означает наставлять с исправительной или предостерегающей целью. «Вразумляйте» передаёт как наставление, так и призыв изменить поведение.
- source_word: ἀτάκτους
  choice: тех, кто нарушает порядок
  rationale: Прилагательное обозначает людей, которые выбиваются из установленного порядка или ведут себя недисциплинированно. Описательный перевод сохраняет широкий смысл и не сводит его только к праздности.
- source_word: παραμυθεῖσθε
  choice: ободряйте
  rationale: Глагол означает утешать, успокаивать и поддерживать добрым словом; «ободряйте» хорошо соответствует сочетанию с малодушными.
- source_word: ὀλιγοψύχους
  choice: малодушных
  rationale: Слово буквально характеризует тех, кому недостаёт душевной стойкости или мужества. «Малодушных» кратко передаёт этот смысл, при этом вариант «унывающих» отмечает возможный оттенок подавленности.
- source_word: ἀντέχεσθε
  choice: поддерживайте
  rationale: С родительным падежом глагол означает держаться рядом с кем-либо, помогать и оказывать поддержку. «Поддерживайте» точнее, чем общее «помогайте», сохраняет образ постоянной опоры.
- source_word: τῶν ἀσθενῶν
  choice: слабых
  rationale: Прилагательное может обозначать физическую, нравственную, духовную или социальную слабость; общий перевод не уточняет её вид без основания в тексте.
- source_word: μακροθυμεῖτε
  choice: будьте терпеливы
  rationale: Глагол обозначает долготерпение по отношению к людям. Современное выражение «будьте терпеливы» ясно передаёт эту направленность.
- source_word: πρὸς πάντας
  choice: ко всем
  rationale: Предлог выражает отношение к людям, а πάντας подчёркивает всеобщий охват наставления.
theological_decisions:
- issue: Охват обращения ἀδελφοί
  choice: В основном тексте — «братья», со сноской о значении «братья и сёстры».
  alternative: Передать в основном тексте как «братья и сёстры».
  rationale: Форма исходного текста грамматически мужская, но обычное общинное обращение Павла здесь, вероятнее всего, охватывает всю церковь. Сноска сохраняет одновременно форму и прагматический охват.
- issue: Характер слабости τῶν ἀσθενῶν
  choice: Не уточнять вид слабости.
  alternative: Понимать только духовно слабых, больных или социально уязвимых.
  rationale: Сам стих не определяет, о какой именно слабости идёт речь; широкий перевод сохраняет смысловую открытость текста.
- issue: Значение ἀτάκτους в фессалоникийском контексте
  choice: Сохранить широкое значение нарушения порядка.
  alternative: Уточнить как «праздных» или «не желающих трудиться».
  rationale: Проблема праздности действительно появляется в посланиях к фессалоникийцам, однако само слово шире и может означать недисциплинированных или непокорных; основной текст не должен преждевременно сужать смысл.
translation_notes:
  register: Современный литературный русский язык с пастырским, но не архаичным тоном. Цепочка повелений сохранена. «Вразумляйте» и «поддерживайте» передают деятельную заботу; спорные смысловые оттенки вынесены в сноски.
