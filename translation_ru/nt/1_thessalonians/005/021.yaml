  yaml_path: translation/nt/1_thessalonians/005/021.yaml
  text: But test everything[a]; hold fast to what is good.
translation:
  language: ru
  text: Проверяйте всё[a]; держитесь хорошего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё испытывайте». В ближайшем контексте это особенно относится к оценке пророческих высказываний.'
    reason: Лексическая альтернатива и контекстуальное пояснение без сужения смысла основного текста.
lexical_decisions:
- source_word: πάντα
  choice: всё
  rationale: Форма среднего рода множественного числа имеет всеохватный смысл; «всё» естественно передаёт широту греческого выражения, не сужая его до пророчеств.
- source_word: δὲ
  choice: же
  rationale: Частица обозначает мягкий переход с оттенком противопоставления. Постпозитивное «же» здесь естественнее резкого «но» и связывает повеление с предыдущими наставлениями.
- source_word: δοκιμάζετε
  choice: проверяйте
  rationale: 'Настоящее повелительное наклонение выражает постоянное действие: следует подвергать сказанное или происходящее проверке, чтобы установить его подлинность и ценность.'
- source_word: τὸ καλὸν
  choice: хорошего
  rationale: Субстантивированное прилагательное означает «то, что хорошо». Родительный падеж обусловлен русским управлением глагола «держаться» и сохраняет предметный, а не отвлечённо-философский смысл.
- source_word: κατέχετε
  choice: держитесь
  rationale: В данном контексте глагол означает твёрдо сохранять и не отпускать то, что после проверки признано хорошим. «Держитесь» передаёт деятельную и продолжающуюся приверженность.
theological_decisions:
- issue: Объём значения πάντα в контексте пророчеств и распознавания
  choice: Сохранено широкое «всё», а непосредственный контекст пояснён в сноске.
  alternative: «Проверяйте все пророчества» или «проверяйте всё сказанное».
  rationale: В стихе 20 речь идёт о пророчествах, поэтому они явно входят в предмет проверки, однако в греческом тексте нет существительного, которое прямо ограничивало бы πάντα только пророчествами. Перевод сохраняет намеренную широту формулировки.
translation_notes:
  register: Современный литературный русский язык; краткий афористичный строй оригинала сохранён. «Всё же» следует читать как сочетание дополнения «всё» и постпозитивной частицы «же», а не как уступительный союз «всё же» в значении «однако»; пунктуационно это соответствует греческой последовательности, но возможна кратковременная двусмысленность.
