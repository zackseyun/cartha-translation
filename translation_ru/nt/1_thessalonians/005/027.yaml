  yaml_path: translation/nt/1_thessalonians/005/027.yaml
  text: I put you under oath before the Lord to have this letter read to all the brothers[a][b].
translation:
  language: ru
  text: Заклинаю вас Господом[a], чтобы это послание было прочитано всем братьям[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед Господом». Греческое выражение может представлять Господа как свидетеля и высший авторитет этого торжественного требования.'
    reason: lexical_alternative
  - marker: b
    text: Слово «братья», вероятно, обозначает здесь всю общину, включая женщин; в греческом тексте употреблена форма мужского рода множественного числа.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνορκίζω
  choice: заклинаю
  rationale: Глагол означает торжественно связать клятвой или настоятельно обязать. «Заклинаю» сохраняет силу греческого выражения и уместно в торжественном, но понятном современном русском тексте.
- source_word: τὸν κύριον
  choice: Господом
  rationale: При ἐνορκίζω винительный падеж может указывать на того, кем заклинают, то есть на призываемый высший авторитет. Русское «заклинаю Господом» естественно передаёт эту конструкцию; возможный оттенок присутствия Господа как свидетеля отмечен в сноске.
- source_word: ἀναγνωσθῆναι
  choice: чтобы … прочитали
  rationale: Пассивный инфинитив означает, что письмо должно быть прочитано, по контексту — вслух перед общиной. Неопределённо-личная русская конструкция естественно сохраняет отсутствие названного исполнителя, не добавляя прямо отсутствующего в греческом слова «вслух».
- source_word: τὴν ἐπιστολήν
  choice: это послание
  rationale: Речь идёт о данном письме Павла. «Это послание» ясно передаёт контекстуальную отсылку и сохраняет достойный библейский регистр без архаизма «эпистола».
- source_word: πᾶσιν τοῖς ἀδελφοῖς
  choice: всем братьям
  rationale: Существительное стоит в мужском роде множественного числа. В обращениях Павла оно часто охватывает всю общину, включая женщин; буквальная форма сохранена в тексте, а вероятный широкий охват пояснён в сноске.
theological_decisions:
- issue: Смысл сочетания ἐνορκίζω … τὸν κύριον
  choice: заклинаю вас Господом
  alternative: заклинаю вас перед Господом
  rationale: Греческая конструкция допускает понимание Господа как того, кем заклинают, и как призываемого свидетеля или авторитета. Основной текст выбирает наиболее естественную и грамматически близкую русскую формулировку, не исключая второго оттенка, который сохранён в сноске.
- issue: Охват слова ἀδελφοῖς в смешанной по полу общине
  choice: братьям
  alternative: братьям и сёстрам
  rationale: Основной текст сохраняет грамматически мужскую форму оригинала. Поскольку в данном контексте слово, вероятно, обозначает всю общину, включая женщин, это поясняется в сноске без подмены формы исходного текста.
translation_notes:
  register: Современный литературный русский язык с торжественным апостольским тоном. Формула «заклинаю вас Господом» сохраняет силу требования, а неопределённо-личное «прочитали» естественно передаёт пассивную конструкцию оригинала. Все сноски отмечены в основном тексте.
