translation:
  language: ru
  text: Благодать Господа нашего Иисуса Христа да будет с вами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «со всеми вами»; в некоторых также добавлено: «Аминь».'
