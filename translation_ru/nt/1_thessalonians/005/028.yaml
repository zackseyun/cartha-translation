lexical_decisions:
- source_word: χάρις
  choice: благодать
  rationale: В заключительных благословениях Павла слово обозначает даруемую Богом благодать; «благодать» — точный и общепонятный русский богословский эквивалент.
- source_word: κυρίου
  choice: Господа
  rationale: Сохраняет титул Иисуса и его богословский вес в устойчивой русской форме.
- source_word: Ἰησοῦ
  choice: Иисуса
  rationale: Имя передано в принятой русской библейской форме.
- source_word: Χριστοῦ
  choice: Христа
  rationale: «Христос» — укоренившаяся русская передача греческого титула Χριστός («Помазанник», «Мессия»); здесь она естественно сохраняет и титульный смысл, и узнаваемость формулы.
- source_word: μεθ’ ὑμῶν
  choice: да будет с вами
  rationale: Греческая фраза буквально означает «с вами»; глагольная форма «да будет» естественно восполняет подразумеваемое благопожелание, не усиливая его смысла.
theological_decisions:
- issue: Передача Χριστοῦ в заключительной формуле Павла
  choice: Христа
  alternative: Мессии
  rationale: В русском языке «Христос» остается традиционной и современной формой титула, непосредственно восходящей к Χριστός. В сочетании «Иисуса Христа» она звучит естественно и не требует превращать титул в менее обычную для этой формулы конструкцию «Иисуса Мессии».
- issue: Восполнение отсутствующего в греческом тексте глагола
  choice: да будет
  alternative: пребудет
  rationale: Исходная фраза безглагольна и выражает благословение. «Да будет» ясно передает подразумеваемое пожелание, тогда как «пребудет» добавляет оттенок продолжительности, прямо не выраженный в тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством традиционной апостольской формулы. Порядок слов «Господа нашего» сохранен как естественный для торжественного благословения; архаичные формы вроде «со всеми вами да пребудет» не использованы.
