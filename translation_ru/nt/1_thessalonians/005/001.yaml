id: 1TH.5.1
reference: 1 Thessalonians 5:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν χρόνων καὶ τῶν καιρῶν, ἀδελφοί, οὐ χρείαν ἔχετε ὑμῖν γράφεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/001.yaml
  text: Concerning the times and the seasons[a], brothers, you have no need to have anything written to you[b],
translation:
  language: ru
  text: Что же касается времён и сроков[b], братья[a], вам нет нужды, чтобы вам об этом писали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры»; по-гречески буквально «братья», но обращение, вероятно, относится ко всей общине верующих.'
    reason: lexical_alternative
  - marker: b
    text: «Времена и сроки» — парное выражение, обозначающее периоды времени и определённые или назначенные моменты, особенно в контексте грядущих событий.
    reason: cultural_note
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Что же касается
  rationale: Περὶ вводит тему, а δέ обозначает переход к новому вопросу. Русское «что же касается» естественно передаёт тематический переход, не придавая δέ чрезмерно сильного противопоставления и не добавляя временного «теперь».
- source_word: τῶν χρόνων καὶ τῶν καιρῶν
  choice: времён и сроков
  rationale: χρόνος обозначает время в его течении или протяжённости, тогда как καιρός может указывать на определённый, подходящий или назначенный момент. Устойчивая пара «времена и сроки» сохраняет различие слов и их эсхатологический оттенок.
- source_word: ἀδελφοί
  choice: братья
  rationale: Форма мужского рода буквально означает «братья», хотя в обращении к общине, вероятно, охватывает всех верующих. Исходная форма сохранена в тексте, а широкий смысл отмечен в сноске.
- source_word: οὐ χρείαν ἔχετε
  choice: вам нет нужды
  rationale: Естественно передаёт греческую идиому отсутствия необходимости и сохраняет её спокойный, не категоричный тон.
- source_word: ὑμῖν γράφεσθαι
  choice: чтобы вам об этом писали
  rationale: Пассивный инфинитив не называет автора письма. Безличная русская конструкция сохраняет эту неопределённость; «об этом» естественно отсылает к только что названной теме и не вводит нового содержания.
theological_decisions:
- issue: Обращение к общине словом ἀδελφοί
  choice: братья
  alternative: братья и сёстры
  rationale: В основном тексте сохранена грамматически мужская форма источника. Вероятное обращение ко всей общине, включая женщин, поясняется в сноске без подмены формы оригинала.
- issue: Соотношение χρόνων и καιρῶν
  choice: времён и сроков
  alternative: времён и назначенных моментов
  rationale: Выбранная традиционная русская пара сохраняет краткость и смысловое различие, не уточняя сверх оригинала, кем или как назначены эти сроки.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным апостольским тоном. Синтаксис близок к греческому, но естественен по-русски. Маркеры сносок поставлены непосредственно при тех выражениях, которые они поясняют.
