  text: αὐτοὶ γὰρ ἀκριβῶς οἴδατε ⸀ὅτι ἡμέρα κυρίου ὡς κλέπτης ἐν νυκτὶ οὕτως ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/002.yaml
  text: For you yourselves know very well that the day of the Lord comes like a thief in the night.
translation:
  language: ru
  text: Ведь вы сами точно знаете, что день Господа придёт, как вор ночью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ
  choice: вы сами
  rationale: Интенсивное местоимение подчёркивает подлежащее, уже выраженное формой οἴδατε; «вы сами» естественно передаёт это усиление.
- source_word: γὰρ
  choice: ведь
  rationale: Союз вводит пояснение или обоснование предыдущей мысли; русское «ведь» сохраняет эту связь без излишней книжности.
- source_word: ἀκριβῶς
  choice: прекрасно
  rationale: При глаголе знания наречие означает точное, основательное знание. Сочетание «прекрасно знаете» естественно в современном русском и не ослабляет уверенности высказывания.
- source_word: οἴδατε
  choice: знаете
  rationale: Прямое и естественное соответствие глаголу знания.
- source_word: ἡμέρα κυρίου
  choice: день Господа
  rationale: Устоявшееся библейское выражение об эсхатологическом дне Божьего вмешательства и суда; оно не обозначает еженедельный день богослужения.
- source_word: ὡς κλέπτης ἐν νυκτὶ
  choice: как вор ночью
  rationale: Сохраняет образ неожиданного прихода и естественно звучит по-русски. Предлог ἐν в этом временном выражении не требует буквального «в ночи».
- source_word: οὕτως ἔρχεται
  choice: придёт
  rationale: οὕτως соотносит способ прихода со сравнением и по-русски естественно передаётся самой конструкцией «придёт как». Настоящее ἔρχεται имеет будущее эсхатологическое значение, поэтому выбрана форма будущего времени.
theological_decisions:
- issue: Эсхатологическое выражение ἡμέρα κυρίου
  choice: день Господа
  alternative: Господень день
  rationale: Контекст говорит о будущем дне Божьего вмешательства, а не о дне еженедельного богослужения. «День Господа» ясно сохраняет связь с пророческим библейским выражением.
- issue: Смысл сравнения с ночным вором
  choice: Образ сохранён без поясняющего расширения
  alternative: Явно добавить указание на внезапность или тайность
  rationale: Сам текст даёт сравнение, которое в контексте подчёркивает неожиданность. Перевод не должен превращать его в утверждение о тайном пришествии или добавлять определённую эсхатологическую схему.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. «Ведь» естественно передаёт пояснительное γάρ, а «прекрасно знаете» — усиленное утверждение об основательном знании.
