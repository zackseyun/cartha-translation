  text: Духа не угашайте.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «духа». Греческое слово может обозначать дух в более общем смысле, однако здесь, особенно ввиду следующего упоминания пророчеств, вероятнее всего имеется в виду Святой Дух.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: Духа
  rationale: В контексте наставлений Павла и последующего упоминания пророчеств наиболее вероятно, что речь идёт о Святом Духе. Написание с прописной буквы передаёт этот вероятный референт, хотя в греческом тексте регистр сам по себе его не определяет.
- source_word: μὴ
  choice: не
  rationale: Частица μή с повелительным наклонением настоящего времени выражает запрет; по-русски он естественно передаётся конструкцией «не угашайте».
- source_word: σβέννυτε
  choice: угашайте
  rationale: Глагол σβέννυμι буквально означает гасить огонь. «Угашать» сохраняет образ огня и звучит уместно в современном литературном библейском регистре.
theological_decisions:
- issue: К кому или чему относится πνεῦμα
  choice: Святой Дух
  alternative: дух; духовное рвение или проявление дара
  rationale: Связь со следующим предостережением не пренебрегать пророчествами указывает прежде всего на действие Святого Духа в общине. Однако греческое πνεῦμα допускает более общее понимание, поэтому эта неоднозначность отмечена в сноске.
translation_notes:
  register: Краткая повелительная формулировка сохранена. Выбрано «угашайте», а не разговорное «гасите», чтобы точно передать метафору и сохранить достойный современный литературный регистр.
