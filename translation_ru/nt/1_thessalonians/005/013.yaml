lexical_decisions:
- source_word: ἡγεῖσθαι
  choice: ценить
  rationale: В данном контексте глагол выражает оценочное отношение к упомянутым ранее служителям, а не руководство; «ценить» естественно передаёт уважение и признание их достоинства.
- source_word: ὑπερεκπερισσοῦ
  choice: глубоко
  rationale: Редкое усилительное наречие обозначает чрезвычайно высокую степень. В сочетании «глубоко ценить» его интенсивность звучит по-русски естественно; необычная сила греческого выражения отмечена в сноске.
- source_word: ἐν ἀγάπῃ
  choice: с любовью
  rationale: Творительный оборот с предлогом естественно передаёт образ действия и сохраняет ключевое понятие ἀγάπη как «любовь».
- source_word: διὰ τὸ ἔργον αὐτῶν
  choice: за их труд
  rationale: διά с винительным указывает на основание такого отношения. «За их труд» кратко и естественно сохраняет конкретный смысл ἔργον.
- source_word: εἰρηνεύετε
  choice: живите в мире
  rationale: Настоящее повелительное наклонение призывает к постоянной мирной жизни; этот русский оборот естественнее буквального «будьте в мире».
- source_word: ἐν ἑαυτοῖς
  choice: друг с другом
  rationale: Возвратное местоимение во множественном числе указывает на отношения внутри общины. «Друг с другом» ясно и современно выражает взаимный характер мира.
- source_word: καὶ
  choice: и
  rationale: Союз продолжает ряд наставлений из предыдущего стиха.
- source_word: αὐτούς
  choice: их
  rationale: Местоимение отсылает к тем, кто трудится среди верующих, руководит ими и наставляет их в предыдущем стихе.
