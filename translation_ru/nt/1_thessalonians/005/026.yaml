lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Приветствуйте
  rationale: Аорист, медиальный императив второго лица множественного числа выражает прямое побуждение. «Приветствуйте» естественно передаёт социальное значение ἀσπάζομαι без излишнего расширения.
- source_word: ἀδελφοὺς
  choice: братьев
  rationale: Греческое слово стоит в форме мужского рода множественного числа. В основном тексте сохранена эта форма, а возможное включение всей общины, в том числе женщин, отмечено в сноске.
- source_word: πάντας
  choice: всех
  rationale: Слово подчёркивает полноту названной группы; «всех» точно и естественно передаёт это значение.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: святым поцелуем
  rationale: Предлог ἐν здесь указывает на сопутствующий способ приветствия. «Святым поцелуем» естественно по-русски передаёт конкретное существительное φίλημα и определение ἁγίῳ, обозначающее посвящённый Богу и чистый знак общения верующих.
theological_decisions:
- issue: Родовое значение ἀδελφοί при обращении к общине
  choice: братьев
  alternative: братьев и сестёр
  rationale: Форма греческого текста грамматически мужского рода, поэтому она сохранена в основном тексте. Вместе с тем в данном контексте слово может обозначать всю общину верующих; эта смысловая возможность не устранена, а вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с краткой, ясной и достойной формулировкой. «Поцелуй» предпочтён более архаичному «целованию» ради понятности обычному современному читателю; смысл и образ греческого текста сохранены.
