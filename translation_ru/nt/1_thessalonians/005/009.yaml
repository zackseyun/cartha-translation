  yaml_path: translation/nt/1_thessalonians/005/009.yaml
  text: For God did not appoint us for wrath[a], but for obtaining salvation through our Lord Jesus the Messiah[b],
translation:
  language: ru
  text: потому что Бог назначил нас не для гнева, а для обретения спасения[a] через нашего Господа Иисуса Мессию[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «для приобретения спасения», «для обладания спасением» или, возможно, «для сохранения ко спасению»; греческое περιποίησις имеет более широкий диапазон значений, чем «обретение».'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционный перевод: «через нашего Господа Иисуса Христа». Греческое Χριστός — титул «Мессия».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит основание предшествующего наставления; «потому что» прямо передаёт причинную связь и естественно звучит по-русски.
- source_word: οὐκ ἔθετο ἡμᾶς ὁ θεός
  choice: Бог предназначил нас не
  rationale: В конструкции с εἰς глагол τίθημι указывает на определение к некоторому исходу. «Предназначил» сохраняет эту направленность, не добавляя более разработанной доктринальной формулы.
- source_word: εἰς ὀργήν
  choice: для гнева
  rationale: В данном эсхатологическом контексте ὀργή означает Божий гнев; буквальное «гнев» точнее интерпретирующего «суд».
- source_word: εἰς περιποίησιν σωτηρίας
  choice: для обретения спасения
  rationale: περιποίησις здесь естественно понимается как приобретение или обретение, а родительный σωτηρίας обозначает то, что обретается. Русская формулировка передаёт противопоставление ожидаемых исходов.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: через нашего Господа Иисуса Мессию
  rationale: διά с родительным обозначает посредство; Χριστός после имени сохраняет значение титула и потому передан словом «Мессия».
theological_decisions:
- issue: Степень предопределительного оттенка в ἔθετο
  choice: предназначил нас не для гнева
  alternative: определил нас не на гнев; назначил нас не для гнева
  rationale: «Предназначил» выражает установленную Богом цель или исход, но не уточняет механизм предопределения и не разрешает стоящий за формулировкой богословский спор.
- issue: Передача Χριστοῦ как титула или традиционной формы
  choice: Мессию
  alternative: Христа
  rationale: Здесь Χριστός следует за личным именем, но сохраняет титульное значение «Мессия». Традиционная форма приведена в примечании.
- issue: Значение περιποίησις
  choice: обретения спасения
  alternative: приобретения спасения; обладания спасением; сохранения ко спасению
  rationale: Контекст поддерживает значение достижения положительного эсхатологического исхода, однако семантический диапазон существительного шире; альтернативы отмечены без догматического сужения.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизмов. Порядок отрицания выбран естественный для русского синтаксиса. Единственное примечание отмечено в основном тексте.
