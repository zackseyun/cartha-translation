id: 1TH.5.23
reference: 1 Thessalonians 5:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης ἁγιάσαι ὑμᾶς ὁλοτελεῖς, καὶ ὁλόκληρον ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα ἀμέμπτως ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τηρηθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/023.yaml
  text: May the God of peace himself sanctify you completely[b][a], and may your whole spirit and soul and body be kept blameless at the coming of our Lord Jesus the Messiah.
translation:
  language: ru
  text: Сам же Бог мира пусть освятит вас всецело, и пусть ваши дух, душа и тело[a] во всей своей целостности сохранятся безупречными при пришествии нашего Господа Иисуса Мессии.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Павел называет «дух, душу и тело». Толкователи расходятся во мнениях: учит ли это трёхчастному устройству человеческой природы или же таким перечислением подчёркивается целостность всего человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционный вариант: «нашего Господа Иисуса Христа».'
    reason: alternative_reading
lexical_decisions:
- source_word: Αὐτὸς δὲ
  choice: Сам же
  rationale: «Сам» сохраняет усилительное значение αὐτός, а «же» естественно передаёт переходную функцию δέ, не создавая излишне резкого противопоставления.
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: Бог мира
  rationale: Сохраняет устойчивое павловское наименование Бога как источника и носителя мира.
- source_word: ἁγιάσαι ὑμᾶς ὁλοτελεῖς
  choice: пусть освятит вас всецело
  rationale: Оптатив передан как молитвенное пожелание; «освятит» сохраняет связь со святостью, а «всецело» выражает полноту, обозначенную ὁλοτελεῖς.
- source_word: ὁλόκληρον
  choice: во всей полноте
  rationale: Передаёт идею целостности и сохранности всего названного далее, не привязывая определение только к «духу».
- source_word: τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα
  choice: ваши дух, душа и тело
  rationale: Все три греческих наименования сохранены раздельно и без навязывания определённой системы антропологии.
- source_word: ἀμέμπτως
  choice: в безупречности
  rationale: 'Передаёт состояние, в котором адресаты должны быть сохранены: без основания для упрёка.'
- source_word: ἐν τῇ παρουσίᾳ
  choice: до пришествия
  rationale: В эсхатологическом контексте παρουσία означает пришествие Христа; при глаголе «сохранятся» русский предлог «до» естественно обозначает конечный момент сохранения, хотя буквально греческий оборот допускает «при пришествии».
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός передан как титул «Мессия», а не как непрозрачная транслитерация; традиционная форма отмечена в сноске.
theological_decisions:
- issue: Трёхчастное выражение «дух, душа и тело»
  choice: Сохранить все три термина и связать полноту с их совокупностью.
  alternative: Понять перечисление как риторическое обозначение всего человека либо как формальное учение о трёх составных частях человеческой природы.
  rationale: Текст явно называет дух, душу и тело, но сам по себе не разрешает спор о том, является ли это техническим делением человеческой природы. Перевод сохраняет эту напряжённость.
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: Греческое Χριστός здесь сохраняет титульное мессианское значение; привычный церковный вариант дан в сноске.
- issue: Временная связь ἐν τῇ παρουσίᾳ с τηρηθείη
  choice: до пришествия
  alternative: при пришествии
  rationale: «До пришествия» наиболее естественно по-русски сочетается с пожеланием о сохранении, однако формально ἐν может обозначать состояние или оценку непосредственно при наступлении пришествия; альтернативу следует признать возможной.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного благословения. Порядок слов подчёркивает «Сам же Бог», а конструкция «пусть… и пусть…» ясно передаёт два взаимосвязанных пожелания. Перечень «дух, душа и тело» сохранён без конфессионального истолкования.
