revisions:
- from: Сам же Бог мира пусть освятит вас всецело, и пусть ваши дух, душа и тело сохранятся во всей полноте и безупречности[a] до пришествия нашего Господа Иисуса Мессии.[b]
  to: Сам же Бог мира пусть освятит вас всецело, и пусть ваши дух, душа и тело[a] во всей своей целостности сохранятся безупречными при пришествии нашего Господа Иисуса Мессии.[b]
  rationale: Правка восстанавливает значение ἐν τῇ παρουσίᾳ как «при пришествии», отчётливо различает целостность (ὁλόκληρον) и безупречность (ἀμέμπτως), а также переносит пояснительную сноску к поясняемому трёхчастному перечислению. Смысл и намеренная неоднозначность греческого текста сохранены.
