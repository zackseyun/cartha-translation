reference: 1 Thessalonians 5:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁρᾶτε μή τις κακὸν ἀντὶ κακοῦ τινι ἀποδῷ, ἀλλὰ πάντοτε τὸ ἀγαθὸν ⸀διώκετε εἰς ἀλλήλους καὶ εἰς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/015.yaml
  text: See to it that no one repays evil for evil to anyone[b][a], but always pursue what is good toward one another and toward all people.
translation:
  language: ru
  text: Смотрите, чтобы никто никому не воздавал злом за зло, но всегда стремитесь делать добро друг другу и всем людям.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «друг другу… всем людям», вероятно, расширяют круг от собратьев по вере до всех людей.
    reason: cross_reference
lexical_decisions:
- source_word: ὁρᾶτε μή τις
  choice: Смотрите, чтобы никто
  rationale: Множественное повелительное ὁρᾶτε здесь имеет идиоматический смысл бдительного попечения; конструкция с μή τις естественно передаётся как «чтобы никто».
- source_word: κακὸν ἀντὶ κακοῦ τινι ἀποδῷ
  choice: никому не воздавал злом за зло
  rationale: «Воздавать злом за зло» сохраняет формулу ответного возмездия, повтор корня κακός и широкий нравственный смысл; «никому» передаёт дательный τινι.
- source_word: πάντοτε
  choice: всегда
  rationale: Прямой и естественный эквивалент временного наречия.
- source_word: τὸ ἀγαθὸν διώκετε
  choice: стремитесь делать добро
  rationale: διώκετε выражает настойчивое, деятельное стремление, а субстантивированное τὸ ἀγαθόν — добро как цель поведения. Добавление «делать» естественно по-русски раскрывает направленность действия в сочетании с εἰς, не ослабляя силы повеления.
- source_word: εἰς ἀλλήλους καὶ εἰς πάντας
  choice: друг другу и всем людям
  rationale: Русские дательные естественно выражают направленность добра к адресатам. «Всем людям» ясно передаёт широкий охват πάντας, не перегружая основной текст буквальным «по отношению к».
theological_decisions:
- issue: Охват нравственной обязанности
  choice: «Друг другу» обозначает взаимные отношения внутри общины, а «всем людям» естественно расширяет круг адресатов.
  alternative: «Все» может пониматься только как все верующие.
  rationale: Сочетание εἰς ἀλλήλους καὶ εἰς πάντας естественнее всего движется от взаимности внутри общины к более широкому кругу. Перевод сохраняет обе группы, а примечание осторожно отмечает вероятное расширение, не превращая его в догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык; наставительный, общинный и достойный регистр. Формулировка «воздавать злом за зло» сохраняет библейскую выразительность, оставаясь понятной современному читателю.
