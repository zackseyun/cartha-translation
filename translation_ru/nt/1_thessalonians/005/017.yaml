  text: Pray without ceasing[a].
translation:
  language: ru
  text: Непрестанно молитесь[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Постоянно молитесь»; «Не переставайте молиться».'
    reason: Лексические варианты передачи ἀδιαλείπτως и длительного характера προσεύχεσθε.
lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: непрестанно
  rationale: Наречие передаёт постоянство и неослабевающую регулярность действия, не обязательно подразумевая непрерывную словесную молитву каждую секунду. «Непрестанно» сохраняет силу и лаконизм греческого выражения и естественно сочетается с глаголом «молитесь».
- source_word: προσεύχεσθε
  choice: молитесь
  rationale: Форма настоящего времени повелительного наклонения, 2-го лица множественного числа, выражает обращённый к общине призыв к продолжающемуся, привычному действию. Русское «молитесь» передаёт повелительный смысл, а длительность дополнительно выражена наречием.
theological_decisions:
- issue: Практический смысл повеления
  choice: Общий призыв к постоянству и настойчивости в молитве, без уточнения, что речь идёт о непрерывной словесной молитве в каждое мгновение.
  alternative: Буквальное требование непрерывно произносить молитву без какой-либо паузы.
  rationale: Сочетание формы настоящего времени повелительного наклонения с ἀδιαλείπτως подчёркивает устойчивую, продолжающуюся молитвенную жизнь. Перевод сохраняет категоричность формулировки, а примечание указывает допустимые лексические оттенки, не навязывая узкого толкования.
translation_notes:
  register: Современный литературный русский язык с краткой, ритмичной и традиционно узнаваемой формулировкой. «Непрестанно» несколько возвышенно, но остаётся понятным и уместным для библейского увещания.
