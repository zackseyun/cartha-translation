  text: προφητείας μὴ ἐξουθενεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/020.yaml
  text: Do not despise prophecies[a].
translation:
  language: ru
  text: Пророчествами не пренебрегайте[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пророческими изречениями».'
    reason: Лексическая альтернатива уточняет, что множественное число может относиться к отдельным проявлениям или высказываниям пророческой речи.
lexical_decisions:
- source_word: προφητείας
  choice: пророчествами
  rationale: Винительный падеж множественного числа от προφητεία обозначает конкретные пророчества или их выражения, а не только пророчество как абстрактное явление. Русское множественное число сохраняет форму и широту греческого текста.
- source_word: μὴ
  choice: не
  rationale: Обычное отрицание при повелительной форме; не следует усиливать его словами «никогда» или «ни в коем случае».
- source_word: ἐξουθενεῖτε
  choice: пренебрегайте
  rationale: Глагол означает считать чем-то ничтожным, относиться с презрением или пренебрежением. «Не пренебрегайте» естественно звучит по-русски и передаёт не просто отказ, а уничижительное невнимание.
theological_decisions:
- issue: Значение «пророчеств» в контексте собрания ранних христиан
  choice: Сохранён широкий термин «пророчества» без уточнения их механизма или отнесения к позднейшей доктринальной категории.
  alternative: «пророческие изречения» или «слова, выдаваемые за послание от Бога»
  rationale: Греческий текст предостерегает от пренебрежения пророчествами, но сам по себе не разрешает позднейшие споры о продолжении или прекращении пророческих даров. Прямой перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и естественная повелительная формулировка. Порядок слов с вынесенным дополнением сохраняет акцент на пророчествах и хорошо согласуется с контекстом ряда наставлений.
