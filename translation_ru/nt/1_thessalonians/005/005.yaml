  text: πάντες ⸀γὰρ ὑμεῖς υἱοὶ φωτός ἐστε καὶ υἱοὶ ἡμέρας. οὐκ ἐσμὲν νυκτὸς οὐδὲ σκότους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/005.yaml
  text: For you are all sons of light and sons of day[a]. We are not of night or of darkness.
translation:
  language: ru
  text: Ведь все вы — сыны света и сыны дня[a]. Мы не принадлежим ни ночи, ни тьме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дети света и дети дня». В греческом тексте буквально: «сыны» — это выражение обозначает тех, кто принадлежит свету и дню или характеризуется ими.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες γὰρ ὑμεῖς
  choice: Ведь все вы
  rationale: «Ведь» передаёт пояснительную функцию γάρ, связывая стих с предыдущей мыслью; «все вы» сохраняет подчёркнуто всеохватный смысл πάντες и естественный русский порядок слов.
- source_word: υἱοὶ φωτός
  choice: сыны света
  rationale: Сохраняется мужской образ υἱοί и генитивная метафора принадлежности или характерного свойства. Книжное «сыны» естественнее для устойчивого образного выражения, чем более бытовое «сыновья».
- source_word: υἱοὶ ἡμέρας
  choice: сыны дня
  rationale: Сохранены параллелизм с «сынами света» и противопоставление дню и ночи; необычность выражения обусловлена самой греческой метафорой.
- source_word: οὐκ ἐσμὲν
  choice: Мы не принадлежим
  rationale: Сохранён переход от второго лица «вы» к первому лицу множественного числа «мы». Глагол «принадлежим» естественно раскрывает подразумеваемое отношение, выраженное последующими родительными падежами.
- source_word: νυκτὸς οὐδὲ σκότους
  choice: ни ночи, ни тьме
  rationale: Парная конструкция с «ни… ни…» ясно передаёт совокупное отрицание οὐκ… οὐδέ и сохраняет метафорическое противопоставление ночи и тьмы свету и дню.
theological_decisions:
- issue: Гендерно маркированная семейная метафора υἱοὶ φωτός / υἱοὶ ἡμέρας
  choice: сыны света и сыны дня
  alternative: дети света и дети дня
  rationale: Греческий текст употребляет мужское множественное υἱοί. Основной текст сохраняет этот образ, а сноска поясняет, что идиома относится ко всем адресатам и обозначает принадлежность или характерные свойства.
- issue: Смена лица со второго на первое множественное
  choice: все вы… Мы не принадлежим…
  alternative: все вы… Вы не принадлежите…
  rationale: Смена лица присутствует в греческом тексте и, вероятно, включает Павла и его соработников вместе с фессалоникийцами; её не следует сглаживать.
- issue: Смысл родительных νυκτός и σκότους при опущенном определяемом слове
  choice: не принадлежим ни ночи, ни тьме
  alternative: мы не от ночи и не от тьмы
  rationale: Формулировка с «принадлежим» ясно выражает отношение принадлежности, подразумеваемое контекстом, не превращая образ в утверждение о происхождении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным словом «сыны», уместным для библейской метафоры. Синтаксис краток и прозрачен; тире подчёркивает именную часть сказуемого, а «принадлежим» делает заключительное противопоставление естественным по-русски.
