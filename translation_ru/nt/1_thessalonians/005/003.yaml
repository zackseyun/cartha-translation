base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/003.yaml
  text: When they say[a], “Peace and security,” then sudden destruction comes upon them, like labor pains upon a pregnant woman[c][b], and they will certainly not escape.
translation:
  language: ru
  text: 'Когда они будут говорить: «Мир и безопасность», тогда их внезапно постигнет гибель — как родовые муки постигают беременную женщину, — и они никак не смогут избежать её.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте стоит усиленное отрицание: «они никоим образом не смогут избежать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν λέγωσιν
  choice: Когда они будут говорить
  rationale: ὅταν с сослагательным наклонением вводит неопределённо-временное придаточное в будущем контексте; форма «будут говорить» естественно передаёт это по-русски, не превращая высказывание в многократное «всякий раз».
- source_word: Εἰρήνη καὶ ἀσφάλεια
  choice: Мир и безопасность
  rationale: «Мир» прямо передаёт εἰρήνη, а «безопасность» сохраняет абстрактное значение ἀσφάλεια и естественно звучит как публичное заверение.
- source_word: αἰφνίδιος ... ἐφίσταται ὄλεθρος
  choice: внезапно постигнет их гибель
  rationale: Русская конструкция естественно передаёт внезапное наступление ὄλεθρος на людей; «гибель» выражает тяжесть суда, не уточняя его способ или продолжительность.
- source_word: ἡ ὠδὶν
  choice: родовые муки
  rationale: Выражение ясно обозначает боли при родах и сохраняет образ неизбежного внезапного бедствия.
- source_word: τῇ ἐν γαστρὶ ἐχούσῃ
  choice: беременную женщину
  rationale: Это естественный современный эквивалент буквального выражения «имеющую во чреве».
- source_word: οὐ μὴ ἐκφύγωσιν
  choice: они ни за что не избегнут её
  rationale: «Ни за что не» передаёт усиленное греческое отрицание οὐ μή, а местоимение «её» естественно указывает на гибель.
theological_decisions:
- issue: Характер ὄλεθρος в эсхатологическом предостережении
  choice: гибель
  alternative: уничтожение; погибель; крах
  rationale: «Гибель» сохраняет смысл решительного суда, но не предрешает, означает ли слово прекращение существования, опустошение или иной вид наказания.
translation_notes:
  register: Современный литературный русский язык; торжественный, но понятный синтаксис. Сохранены неопределённое «они», временная последовательность и эмфатическая неотвратимость заключительной фразы.
