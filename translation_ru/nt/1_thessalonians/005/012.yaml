  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, εἰδέναι τοὺς κοπιῶντας ἐν ὑμῖν καὶ προϊσταμένους ὑμῶν ἐν κυρίῳ καὶ νουθετοῦντας ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/012.yaml
  text: We ask you[a], brothers, to acknowledge those who labor among you and lead you in the Lord and admonish you[c][b],
translation:
  language: ru
  text: Просим вас, братья[a], ценить[b] тех, кто усердно трудится среди вас, руководит вами в Господе[c] и вразумляет вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «братья и сёстры»; греческое «братья» здесь употреблено как обращение к общине.
    reason: lexical_alternative
  - marker: b
    text: Или «признавать» или «уважать» тех, кто трудится среди вас; буквально — «знать».
    reason: lexical_alternative
  - marker: c
    text: Или «являются вашими руководителями в Господе».
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐρωτῶμεν δὲ
  choice: Просим
  rationale: Ἐρωτῶμεν передаёт мягкую пастырскую просьбу, а не приказ. Частица δέ обозначает лёгкий переход; в русском отдельное «теперь» или «но» здесь было бы неестественным и излишне сильным.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохранена форма обращения мужского рода; по контексту она относится ко всей общине, что пояснено в сноске.
- source_word: εἰδέναι
  choice: ценить
  rationale: В данном контексте глагол означает не просто знать, а признавать служение этих людей и относиться к ним с уважением. «Ценить» естественно выражает этот идиоматический смысл, не вводя требования повиновения.
- source_word: τοὺς κοπιῶντας ἐν ὑμῖν
  choice: тех, кто усердно трудится среди вас
  rationale: κοπιάω указывает на напряжённый, усердный труд, а ἐν ὑμῖν — на служение внутри общины.
- source_word: προϊσταμένους ὑμῶν ἐν κυρίῳ
  choice: руководит вами в Господе
  rationale: προΐστημι может обозначать руководство, надзор и ответственную заботу. «Руководит» сохраняет значение реального лидерства, не навязывая определённую церковную структуру.
- source_word: νουθετοῦντας ὑμᾶς
  choice: вразумляет вас
  rationale: νουθετέω означает наставлять с исправляющей или предостерегающей целью. «Вразумляет» сохраняет как наставительный, так и корректирующий оттенок.
theological_decisions:
- issue: Обращение ἀδελφοί ко всей общине
  choice: братья
  alternative: братья и сёстры
  rationale: Основной текст сохраняет грамматическую форму оригинала, а сноска сообщает вероятный охват всего собрания.
- issue: Смысл εἰδέναι по отношению к служащим общине
  choice: ценить
  alternative: признавать или уважать
  rationale: Призыв предполагает признание ценности их труда, однако сам по себе не устанавливает безусловного повиновения или почитания.
- issue: Характер προϊσταμένους ὑμῶν ἐν κυρίῳ
  choice: руководит вами в Господе
  alternative: стоит во главе вас в Господе
  rationale: Перевод сохраняет идею руководства и ответственности перед Господом, не уточняя сверх текста форму или должность церковных руководителей.
translation_notes:
  register: Современный литературный русский язык с достойным, общедоступным церковным регистром. Синтаксис сохраняет единый ряд причастных по смыслу характеристик через придаточное «кто…», что звучит естественно по-русски. Слово «вразумляет» выбрано ради корректирующего оттенка νουθετέω; оно несколько возвышенно, но остаётся понятным современному читателю.
