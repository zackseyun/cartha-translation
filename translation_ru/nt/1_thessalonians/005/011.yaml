lexical_decisions:
- source_word: διὸ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассуждения и ясно сохраняет логическую связь.
- source_word: παρακαλεῖτε
  choice: ободряйте
  rationale: В контексте взаимной поддержки передаёт широкий смысл призыва и воодушевления, не сужая его до утешения и не усиливая до строгого увещания.
- source_word: ἀλλήλους
  choice: друг друга
  rationale: Естественная русская передача взаимного действия.
- source_word: οἰκοδομεῖτε
  choice: укрепляйте
  rationale: Естественно выражает созидание и духовное укрепление людей; буквальное «созидайте» сохраняет метафору точнее, но в современной речи звучит менее обычно с прямым дополнением «друг друга».
- source_word: εἷς τὸν ἕνα
  choice: друг друга
  rationale: Идиоматически передаёт греческое «один — другого» и сохраняет отдельно выраженный акцент на взаимности второго действия.
- source_word: καθὼς καὶ ποιεῖτε
  choice: как вы уже и делаете
  rationale: Сохраняет сравнение, одобрение их нынешней практики и продолжающийся характер действия; «уже» естественно подчёркивает, что повеление ими исполняется.
theological_decisions:
- issue: Смысл παρακαλεῖτε как взаимного действия общины
  choice: ободряйте друг друга
  alternative: увещевайте друг друга
  rationale: Греческий глагол допускает и ободрение, и настойчивый призыв. Контекст взаимного укрепления благоприятствует «ободряйте», но альтернативный оттенок сохранён в сноске без догматического сужения.
translation_notes:
  register: Современный литературный русский язык; краткое, ясное и достойное звучание. Повтор «друг друга» сохранён ради взаимности, выраженной обеими греческими конструкциями. Строительная метафора οἰκοδομεῖτε частично ослаблена ради естественности русского текста.
