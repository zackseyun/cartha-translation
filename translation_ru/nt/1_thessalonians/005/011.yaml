  text: Therefore encourage one another and build up one another[a], just as you are also doing.
translation:
  language: ru
  text: Поэтому ободряйте друг друга[a] и укрепляйте друг друга, как вы и делаете.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «увещевайте друг друга»; греческое слово может означать как ободрение, так и настойчивый призыв.'
