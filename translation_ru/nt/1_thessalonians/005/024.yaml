id: 1TH.5.24
reference: 1 Thessalonians 5:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πιστὸς ὁ καλῶν ὑμᾶς, ὃς καὶ ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/024.yaml
  text: Faithful is the one who calls you[a], who also will do it.
translation:
  language: ru
  text: Верен Тот, Кто призывает вас[a]; Он и совершит это.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Надёжен Призывающий вас — Он и исполнит это».'
    reason: 'Лексическая альтернатива: πιστός может означать «верный» или «надёжный», а ποιήσει — «сделает», «исполнит», «совершит».'
lexical_decisions:
- source_word: πιστὸς
  choice: Верен
  rationale: Предикативное прилагательное характеризует Бога как неизменно верного и надёжного. «Верен» естественно и богословски содержательно звучит по-русски, не добавляя к греческому тексту лишних смыслов.
- source_word: ὁ καλῶν
  choice: Тот, Кто призывает
  rationale: Субстантивированное причастие настоящего времени обозначает Бога как призывающего. Эта формулировка сохраняет определённость и длительный характер действия и при этом естественна в современном русском языке.
- source_word: ὑμᾶς
  choice: вас
  rationale: Местоимение второго лица множественного числа обращено ко всей общине; русское «вас» точно передаёт число.
- source_word: ὃς καὶ
  choice: Он и
  rationale: Относительная связь по-русски естественно передана отдельной частью предложения; усилительная частица «и» подчёркивает, что именно Призывающий также осуществит сказанное.
- source_word: ποιήσει
  choice: совершит это
  rationale: Будущее время ποιέω допускает значения «сделает» и «совершит». «Совершит это» сохраняет краткость, а местоимение отсылает к молитве об освящении и сохранении в предыдущем стихе, не раскрывая подразумеваемый объект чрезмерно подробно.
theological_decisions:
- issue: Подразумеваемый объект ποιήσει
  choice: «совершит это» — Бог исполнит то, о чём сказано в молитве в стихе 23
  alternative: «сделает»; «исполнит это»; «доведёт это до конца»
  rationale: В греческом объект не выражен, но русскому предложению требуется естественная отсылка. «Это» указывает на ближайший контекст, а «совершит» передаёт действенность обещания, не уточняя способ и не превращая перевод в богословское толкование.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Заглавные буквы в «Тот, Кто» помогают ясно отнести выражение к Богу, хотя в греческом регистр этого не обозначает. Точка с запятой сохраняет тесную связь двух утверждений и делает фразу естественной по-русски.
