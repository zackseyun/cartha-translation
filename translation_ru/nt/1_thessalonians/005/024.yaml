  source_fidelity: 'Текст точно передаёт греческое πιστὸς ὁ καλῶν ὑμᾶς, ὃς καὶ ποιήσει: «Верен» соответствует πιστός, «Тот, Кто призывает вас» адекватно передаёт субстантивированное причастие настоящего времени с объектом во множественном числе, а «Он и совершит это» сохраняет будущность ποιήσει и усилительно-связующую функцию καί. Местоимение «это» — необходимая в русском языке, но ненавязчивая отсылка к подразумеваемому объекту из ближайшего контекста.'
