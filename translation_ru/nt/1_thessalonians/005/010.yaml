    reason: alternative_reading
lexical_decisions:
- source_word: ἀποθανόντος
  choice: который умер
  rationale: Аористное причастие относится к Господу Иисусу Христу, названному в предыдущем стихе. В современном русском относительное предложение естественнее буквального «умершего», при этом завершённость действия сохраняется.
- source_word: περὶ ἡμῶν
  choice: за нас
  rationale: В данном сотериологическом контексте περί с родительным падежом означает действие ради нас, в нашу пользу. «За нас» передаёт это кратко и естественно, не уточняя сверх текста характер смерти.
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт целевое или результирующее значение союза без искусственного разграничения этих близких оттенков.
- source_word: γρηγορῶμεν
  choice: бодрствуем
  rationale: Глагол может обозначать как бодрствование в противоположность сну, так и духовную бдительность. Выбор сохраняет оба оттенка и не заменяет образ прямым пояснением «живы».
- source_word: καθεύδωμεν
  choice: спим
  rationale: Сохраняет образ сна, который, вероятнее всего, обозначает смерть верующих, но в ближайшем контексте также допускает контраст с нравственной бдительностью.
- source_word: ἅμα σὺν αὐτῷ
  choice: вместе с Ним
  rationale: Сочетание ἅμα и σύν выражает совместную жизнь со Христом. Русское «вместе с Ним» полно и естественно передаёт эту связь.
- source_word: ζήσωμεν
  choice: жили
  rationale: Форма после «чтобы» естественно передаёт аористный конъюнктив и выражает задуманную цель или результат смерти Христа.
theological_decisions:
- issue: Значение слов «бодрствуем ли или спим»
  choice: В основном тексте сохранена метафора; в контексте она, вероятнее всего, различает живых и умерших верующих.
  alternative: Слова могут продолжать призыв 5:6–7 и противопоставлять духовную бдительность беспечности.
  rationale: Обещание жить вместе со Христом и связь с 4:13–15 поддерживают значение «живы или умерли». Однако повторение лексики ближайшего призыва к бодрствованию создаёт подлинную смысловую напряжённость, которую не следует устранять в переводе.
translation_notes:
  register: Современный литературный русский язык; синтаксис плавный и сдержанно торжественный. Тире выделяют парную конструкцию и делают длинное целевое предложение яснее. Местоимение «Ним» написано с прописной буквы согласно распространённой русской библейской традиции.
