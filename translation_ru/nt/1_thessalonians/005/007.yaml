base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/007.yaml
  text: For those who sleep, sleep at night, and those who get drunk, get drunk at night.
translation:
  language: ru
  text: Ведь те, кто спит, спят ночью, и те, кто напивается, напиваются ночью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: ведь
  rationale: Союз вводит обоснование предшествующего наставления; «ведь» естественно передаёт пояснительно-причинную связь в современном русском языке.
- source_word: οἱ καθεύδοντες ... καθεύδουσιν
  choice: те, кто спит, спят
  rationale: Субстантивированное причастие передано как обобщённое «те, кто спит», а повтор глагола сохраняет риторический параллелизм оригинала.
- source_word: νυκτός
  choice: ночью
  rationale: Родительный падеж употреблён обстоятельственно; краткое русское наречие точно и естественно выражает временное значение.
- source_word: οἱ μεθυσκόμενοι ... μεθύουσιν
  choice: те, кто напивается, напиваются
  rationale: Форма μεθύσκομαι обозначает опьянение или привычное предавание пьянству; «напиваться» сохраняет действие и словесный повтор, не сводя выражение только к состоянию «быть пьяным».
- source_word: καί
  choice: и
  rationale: Простой соединительный союз связывает две параллельные части высказывания.
theological_decisions:
- issue: Буквальный или метафорический смысл сна и опьянения
  choice: Сохранить буквальные образы сна и опьянения в основном тексте
  alternative: Передать их как духовную беспечность и нравственную распущенность
  rationale: В непосредственном контексте обычные ночные занятия служат основанием для духовного увещания. Буквальная передача сохраняет образность и не подменяет перевод толкованием.
translation_notes:
  register: Современный литературный русский язык; краткая симметричная конструкция сохраняет параллелизм греческого текста. «Напивается» звучит естественно и передаёт действие, тогда как «пьянеет» могло бы подразумевать лишь наступление опьянения.
