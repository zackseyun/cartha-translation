  - marker: b
    text: То есть день Господа, о котором говорится в непосредственном контексте.
    reason: cross_reference
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Но вы
  rationale: δέ противопоставляет адресатов людям, упомянутым ранее, а выраженное местоимение ὑμεῖς несёт смысловое ударение. «Но вы» естественно передаёт и контраст, и эмфазу.
- source_word: ἀδελφοί
  choice: братья
  rationale: Форма обращения мужского рода буквально означает «братья»; в обращении к общине она может включать и женщин, что отмечено в сноске.
- source_word: ἐν σκότει
  choice: во тьме
  rationale: Сохранён образ тьмы с его нравственным, духовным и познавательным смыслом; «в неведении» неоправданно сузило бы метафору.
- source_word: ἵνα
  choice: чтобы
  rationale: Союз сохраняет связь между пребыванием во тьме и возможностью быть застигнутыми днём, не устраняя оттенок цели или следствия.
- source_word: ἡ ἡμέρα
  choice: этот день
  rationale: Артикль указывает на конкретный день, уже названный в непосредственном контексте. Указательное «этот» по-русски естественно связывает выражение с предыдущим стихом, не подставляя в основной текст полную формулу «день Господа».
- source_word: ὡς κλέπτης
  choice: как вор
  rationale: Естественно и точно сохраняет греческое сравнение.
- source_word: καταλάβῃ
  choice: застиг
  rationale: Глагол здесь означает настичь или захватить неожиданно. «Застиг» сохраняет внезапность и хорошо сочетается с образом вора, не разворачивая смысл в пояснительный пересказ.
theological_decisions:
- issue: Обращение ἀδελφοί к общине смешанного состава
  choice: братья
  alternative: братья и сёстры
  rationale: В основном тексте сохранена грамматическая форма оригинала, а вероятный включающий смысл обращения обозначен сноской.
- issue: Эсхатологический референт ἡ ἡμέρα
  choice: этот день
  alternative: день Господа
  rationale: Непосредственный контекст отождествляет этот день с днём Господа, однако сам стих содержит только «день». Поэтому полное наименование дано в сноске, а не внесено в основной текст.
- issue: Оттенок связи, выраженной ἵνα
  choice: чтобы
  alternative: так что
  rationale: Греческая конструкция допускает оттенок цели или результата. Русское «чтобы» сохраняет конструкцию и её напряжение без жёсткого догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с сохранением образов «тьмы» и «вора». Формулировка рассчитана на ясное чтение вслух; синтаксис близок к греческому, но не буквалистичен.
