    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἐν πάθει ἐπιθυμίας
  choice: не в похотливой страсти
  rationale: Отрицание продолжает наставление предыдущего стиха; ἐν передаёт образ или сферу действия. Сочетание естественно звучит по-русски и в данном контексте ясно обозначает неупорядоченное половое желание.
- source_word: καθάπερ καὶ
  choice: как и
  rationale: Передаёт сравнение и значение καὶ без тяжеловесного буквального оборота «точно так же, как также».
- source_word: τὰ ἔθνη
  choice: язычники
  rationale: В данном употреблении речь идёт о людях вне народа Божьего, не знающих Бога; русское «язычники» естественно передаёт религиозный смысл контраста, тогда как «народы» сегодня было бы чрезмерно широким.
- source_word: τὰ μὴ εἰδότα τὸν θεόν
  choice: не знающие Бога
  rationale: Причастный оборот сохраняет определительное значение греческой конструкции и описывает продолжающееся состояние.
theological_decisions:
- issue: Значение τὰ ἔθνη в нравственном наставлении
  choice: язычники
  alternative: народы; иноплеменники
  rationale: Контраст определяется не этническим происхождением как таковым, а незнанием Бога. «Язычники» сохраняет религиозно-социальную категорию Павлова словоупотребления, не распространяя утверждение на все народы без различия.
- issue: Передача πάθει ἐπιθυμίας
  choice: похотливая страсть
  alternative: страсть вожделения; страстное вожделение
  rationale: Контекст указывает на половое желание, вышедшее из должных границ. Выбранный оборот передаёт оба смысловых компонента, оставаясь естественным для современного русского языка, но не уточняет сверх текста конкретную форму поведения.
translation_notes:
  register: Современный литературный русский с достоинством апостольского наставления. Сохранена синтаксическая незавершённость, поскольку стих продолжает мысль 4:4; запятая в конце соответствует предоставленному фрагменту.
