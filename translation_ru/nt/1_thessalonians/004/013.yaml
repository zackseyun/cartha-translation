  text: Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, περὶ τῶν ⸀κοιμωμένων, ἵνα μὴ λυπῆσθε καθὼς καὶ οἱ λοιποὶ οἱ μὴ ἔχοντες ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/013.yaml
  text: But we do not want you to be uninformed[a], brothers, about those who have fallen asleep, so that you may not grieve as the rest do[b], who have no hope.
translation:
  language: ru
  text: Мы же не хотим, братья[a], оставлять вас в неведении об уснувших[b], чтобы вы не скорбели, подобно прочим, у которых нет надежды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Обращение «братья» здесь, вероятно, относится ко всей общине, включая женщин.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «о спящих»; сон здесь служит образом умерших.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν
  choice: Мы же не хотим … оставлять вас в неведении
  rationale: Русская конструкция естественно передаёт отрицание θέλομεν и значение ἀγνοεῖν — «не знать, не быть осведомлённым». Частица «же» обозначает мягкий переход или сопоставление, не усиливая его до резкого противопоставления.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохранена грамматически мужская форма греческого обращения; в данном послании она обращена ко всей общине. Это пояснено в сноске.
- source_word: περὶ τῶν κοιμωμένων
  choice: об уснувших
  rationale: Сохранён образ сна, которым в контексте обозначены умершие верующие. «Уснувшие» звучит по-русски естественнее буквального «спящие» и не заменяет метафору прямым толкованием «умершие».
- source_word: ἵνα μὴ λυπῆσθε
  choice: чтобы вы не скорбели
  rationale: Переданы цель и пастырская направленность фразы; такая формулировка не означает полного запрета на скорбь, поскольку последующее сравнение уточняет характер скорби.
- source_word: καθὼς καὶ οἱ λοιποὶ
  choice: как и остальные
  rationale: «Остальные» передаёт οἱ λοιποί как людей вне обозначенной общины, а «и» естественно отражает καί в сравнительной конструкции.
- source_word: οἱ μὴ ἔχοντες ἐλπίδα
  choice: у которых нет надежды
  rationale: Идиоматичная современная русская передача причастного оборота без уточнения содержания надежды сверх сказанного в тексте.
theological_decisions:
- issue: Значение κοιμωμένων в эсхатологическом контексте
  choice: Сохранить метафору в форме «уснувших».
  alternative: «умерших»; буквально «спящих»
  rationale: Образ сна связан с последующей темой воскресения и составляет часть богословской выразительности текста. Прямая замена на «умерших» устранила бы этот образ, а «спящих» могла бы быть ошибочно понята буквально.
- issue: Круг адресатов в обращении ἀδελφοί
  choice: «братья» в основном тексте с пояснением в сноске.
  alternative: «братья и сёстры»; «братья и сестры по вере»
  rationale: Основной текст сохраняет мужскую форму источника, а сноска сообщает вероятный общеобщинный, включающий женщин характер обращения.
- issue: Характер скорби верующих
  choice: Сохранить конструкцию «чтобы вы не скорбели, как и остальные».
  alternative: «чтобы вы вовсе не скорбели»
  rationale: Сравнение с не имеющими надежды характеризует скорбь, а не требует истолковывать фразу как безусловный запрет любой печали.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского наставления. «Оставлять вас в неведении» — естественный русский оборот; «уснувших» сохраняет метафору без чрезмерной церковнославянской окраски. Все маркеры сносок размещены непосредственно при поясняемых словах.
