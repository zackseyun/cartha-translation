  text: so that you may walk properly before outsiders and have need of nothing[a].
translation:
  language: ru
  text: чтобы в отношениях с теми, кто вне общины, вы вели себя достойно и ни в чём не нуждались[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ни в ком не нуждались». Эти слова могут подчёркивать, что верующие не должны зависеть от помощи других.'
    reason: 'Альтернативное понимание греческого μηδενός: «ничего» либо, с учётом контекста, «никого».'
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно передаёт целевое или результативное значение союза, связывая стих с предшествующим наставлением.
- source_word: περιπατῆτε
  choice: вы вели себя
  rationale: Глагол буквально означает «ходить», но здесь метафорически обозначает образ жизни и поведение. Русское «вели себя» естественно в данном общественном контексте.
- source_word: εὐσχημόνως
  choice: достойно
  rationale: Передаёт значение подобающего, благопристойного и вызывающего уважение поведения без архаичного оттенка.
- source_word: πρὸς τοὺς ἔξω
  choice: перед посторонними
  rationale: Обозначает публичное поведение по отношению к людям вне христианской общины. «Посторонними» сохраняет разграничение групп, не вводя более узкого богословского определения.
- source_word: μηδενὸς χρείαν ἔχητε
  choice: ни в чём не нуждались
  rationale: Наиболее естественно передаёт грамматически вероятный предметный смысл местоимения и сохраняет широкое значение отсутствия нужды.
theological_decisions:
- issue: Значение заключительных слов μηδενὸς χρείαν ἔχητε
  choice: «ни в чём не нуждались» — отсутствие материальной нужды или вынужденной зависимости
  alternative: «ни в ком не нуждались» — независимость от помощи других людей
  rationale: Контекст труда своими руками поддерживает мысль о материальной самостоятельности, тогда как сама греческая конструкция допускает связь нужды как с вещами, так и, по смыслу контекста, с людьми. Основной текст следует наиболее вероятному грамматическому пониманию, а альтернативу сохраняет сноска.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная, без архаизмов. Метафора «ходить» передана естественным русским выражением «вести себя», а неоднозначность заключительной фразы сохранена в сноске.
