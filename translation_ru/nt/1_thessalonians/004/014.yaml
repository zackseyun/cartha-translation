id: 1TH.4.14
reference: 1 Thessalonians 4:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ γὰρ πιστεύομεν ὅτι Ἰησοῦς ἀπέθανεν καὶ ἀνέστη, οὕτως καὶ ὁ θεὸς τοὺς κοιμηθέντας διὰ τοῦ Ἰησοῦ ἄξει σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/014.yaml
  text: For if we believe that Jesus died and rose again[b][a], so also God will bring with him those who have fallen asleep through Jesus.
translation:
  language: ru
  text: Ведь если мы верим, что Иисус умер и воскрес, то и усопших[a] через Иисуса[b] Бог приведёт вместе с Ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умерших». Здесь Павел употребляет образ сна, говоря о смерти верующих.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «усопших в Иисусе». Выражение «через Иисуса» может указывать на действие через Него или на тесную связь усопших с Иисусом.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Ведь если
  rationale: «Ведь» естественно передаёт пояснительно-обосновывающую силу γάρ, а «если» сохраняет условную форму εἰ.
- source_word: πιστεύομεν
  choice: мы верим
  rationale: Передаёт общее исповедание веры в смерть и воскресение Иисуса.
- source_word: Ἰησοῦς
  choice: Иисус
  rationale: Общепринятая русская форма личного имени.
- source_word: ἀπέθανεν
  choice: умер
  rationale: Простой прошедший вид естественно передаёт аорист в краткой исповедальной формуле.
- source_word: ἀνέστη
  choice: воскрес
  rationale: Глагол имеет непереходную форму; «воскрес» точно и естественно передаёт событие воскресения, не превращая форму в пассивную.
- source_word: οὕτως καὶ
  choice: то и
  rationale: Сохраняет соотнесение воскресения Иисуса с последующим действием Бога, не уточняя сверх текста, в чём именно состоит подобие.
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Прямое соответствие греческому подлежащему.
- source_word: τοὺς κοιμηθέντας
  choice: усопших
  rationale: «Усопшие» сохраняет образ сна как обозначение умерших и при этом звучит естественно и достойно в современном литературном русском языке.
- source_word: διὰ τοῦ Ἰησοῦ
  choice: через Иисуса
  rationale: Передаёт обычное значение διά с родительным падежом и сохраняет открытым вопрос о точной синтаксической связи оборота; иные возможные понимания отмечены в сноске.
- source_word: ἄξει
  choice: приведёт
  rationale: Будущее время глагола ἄγω естественно передаётся как «приведёт».
- source_word: σὺν αὐτῷ
  choice: вместе с Ним
  rationale: Передаёт значение совместности у σύν; местоимение в контексте естественно относится к Иисусу.
theological_decisions:
- issue: Метафора смерти в κοιμηθέντας
  choice: Сохранить образ сна словом «усопших».
  alternative: «умерших»
  rationale: Павел говорит о реальной смерти, но намеренно использует метафору сна в контексте надежды на воскресение; её устранение обеднило бы текст.
- issue: Значение и синтаксическая связь διὰ τοῦ Ἰησοῦ
  choice: В основном тексте — «через Иисуса», без окончательного разрешения синтаксической неоднозначности.
  alternative: «усопших в Иисусе»; также возможно понимание причины или посредничества действия Иисуса
  rationale: Оборот может пониматься как указание на посредничество Иисуса либо как характеристика умерших в их связи с Ним. Перевод и сноска сохраняют эту подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; слово «усопших» сохраняет исходную метафору без архаической тяжеловесности. Заглавная буква в «Ним» следует устойчивой русской издательской традиции для местоимения, относящегося к Иисусу.
