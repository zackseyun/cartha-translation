  verdict: revise
  source_fidelity: Основной текст точно передаёт οἴδατε, γάρ, τίνας παραγγελίας, ἐδώκαμεν ὑμῖν и титул «Господь Иисус». Однако «через Господа Иисуса» в современном русском обычно означает, что Иисус был посредником передачи наставлений, тогда как в данном контексте διά τοῦ κυρίου Ἰησοῦ естественнее выражает основание/полномочие, с которым апостолы дали наставления. Формулировка «именем Господа Иисуса» передаёт этот смысл без догматического уточнения.
  naturalness: '«Ведь вы знаете...» и «какие наставления» естественны для современного литературного русского. «Дали вам через Господа Иисуса» грамматически понятно, но семантически неудачно: создаёт ненужную картину посреднической передачи.'
  terminology: «Наставления» — удачная, достаточно авторитетная и не чрезмерно жёсткая передача παραγγελίαι. «Господь Иисус» соответствует греческому титулу и принятой русской библейской терминологии.
  issues:
  - severity: medium
    issue: Фраза «через Господа Иисуса» двусмысленно представляет Иисуса посредником передачи.
    rationale: διά с родительным действительно может обозначать посредство, но в сочетании с «дали наставления» и в контексте апостольского увещания выражение указывает на полномочие/основание, связанное с Господом Иисусом. Русское «именем» естественно передаёт этот прагматический смысл.
  - severity: low
