base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/002.yaml
  text: For you know what instructions we gave you through the Lord Jesus[a].
translation:
  language: ru
  text: Ведь вы знаете, какие наставления мы дали вам именем Господа Иисуса[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через Господа Иисуса»; возможно, «по повелению Господа Иисуса».'
    reason: διά с родительным допускает передачу посредства, а в данном контексте также выражает основание или полномочие, с которым были даны наставления.
lexical_decisions:
- source_word: οἴδατε
  choice: вы знаете
  rationale: Форма οἶδα в койне имеет настоящее значение; «вы знаете» естественно и точно передаёт смысл.
- source_word: γὰρ
  choice: ведь
  rationale: Частица обосновывает предыдущее высказывание; русское «ведь» естественно сохраняет пояснительно-причинную связь.
- source_word: τίνας παραγγελίας
  choice: какие наставления
  rationale: Передаёт содержание известного адресатам и сохраняет множественное число; «наставления» выражает авторитетный характер указаний без излишнего усиления до «повелений».
- source_word: ἐδώκαμεν ὑμῖν
  choice: мы дали вам
  rationale: Прямое и естественное соответствие греческой конструкции.
- source_word: διὰ τοῦ κυρίου Ἰησοῦ
  choice: через Господа Иисуса
  rationale: διά с родительным может обозначать посредство или действие через кого-либо. Буквально прозрачный вариант сохраняет также возможный оттенок полномочия, не сводя выражение только к нему.
- source_word: κυρίου
  choice: Господа
  rationale: Стандартная передача титула κύριος в данном христологическом контексте.
- source_word: Ἰησοῦ
  choice: Иисуса
  rationale: Общепринятая русская форма личного имени.
theological_decisions:
- issue: Смысл διὰ τοῦ κυρίου Ἰησοῦ
  choice: через Господа Иисуса
  alternative: властью Господа Иисуса
  rationale: Основной вариант формально сохраняет идею посредства или действия через Иисуса и не устраняет богословскую многозначность; контекстуально возможный оттенок данной Им власти отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная. «Ведь» естественно связывает стих с предыдущей мыслью, а «наставления» сохраняет авторитетный, но не чрезмерно жёсткий тон.
