id: 1TH.4.6
reference: 1 Thessalonians 4:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τὸ μὴ ὑπερβαίνειν καὶ πλεονεκτεῖν ἐν τῷ πράγματι τὸν ἀδελφὸν αὐτοῦ, διότι ἔκδικος ⸀κύριος περὶ πάντων τούτων, καθὼς καὶ προείπαμεν ὑμῖν καὶ διεμαρτυράμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/006.yaml
  text: that no one should overstep and exploit his brother in this matter[a], because the Lord is an avenger concerning all these things[b], just as we also told you beforehand and solemnly warned you.
translation:
  language: ru
  text: чтобы никто не переходил границ и не извлекал выгоды за счёт своего брата[b] в этом деле[a], потому что Господь воздаёт за всё это, как мы уже говорили вам и торжественно предостерегали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не обманывал своего брата в этом деле». Греческий глагол может означать извлечение выгоды за чужой счёт; иногда всё выражение понимают более узко — как мошенничество. Однако в ближайшем контексте, вероятнее всего, речь идёт о проступке в половой сфере.'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте стоит существительное мужского рода в единственном числе — «брата». Вероятно, здесь прежде всего имеется в виду брат по вере, хотя нравственное предостережение может относиться и к другим членам общины.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ μὴ ὑπερβαίνειν
  choice: чтобы никто не переходил границ
  rationale: Субстантивированный инфинитив продолжает наставление предыдущего стиха. Образ перехода дозволенной нравственной границы сохранён в естественной современной формулировке.
- source_word: πλεονεκτεῖν
  choice: не использовал … в своих интересах
  rationale: Глагол обозначает получение выгоды за чужой счёт, злоупотребление или эксплуатацию. Выбранная формулировка сохраняет широкий нравственный смысл и не сводит его исключительно к имущественному обману.
- source_word: ἐν τῷ πράγματι
  choice: в этом деле
  rationale: Греческое выражение намеренно общее, но отсылает к ближайшему контексту о половой чистоте. Перевод сохраняет эту контекстуальную связь, не добавляя отсутствующей в тексте конкретизации.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: своего брата
  rationale: Передано мужское число единственного числа исходного выражения; вероятнее всего, имеется в виду брат по вере.
- source_word: ἔκδικος κύριος
  choice: Господь воздаёт
  rationale: Формулировка передаёт Господа как совершающего справедливое возмездие за зло и звучит естественнее по-русски, чем буквальное существительное «мститель».
- source_word: περὶ πάντων τούτων
  choice: за всё это
  rationale: Сохраняется широкий охват перечисленных в контексте проступков и естественная для русского языка связь с глаголом «воздаёт».
- source_word: προείπαμεν
  choice: уже говорили вам
  rationale: Передан временной смысл прежнего сообщения без смешения с более сильным последующим глаголом предупреждения.
- source_word: διεμαρτυράμεθα
  choice: торжественно предостерегали
  rationale: Передана усиленная, серьёзная и свидетельская сила глагола в контексте нравственного наставления.
theological_decisions:
- issue: К чему относится выражение «в этом деле»
  choice: Стих продолжает наставление о половой святости в 4:3–5 и предостерегает от нарушения границ и использования брата в половой сфере.
  alternative: Слова относятся к деловому мошенничеству или к обману вообще.
  rationale: Ближайший контекст посвящён половой распущенности, святости и владению собственным телом. Вместе с тем греческие слова допускают более широкое понимание, поэтому основной текст не конкретизирует вид проступка, а примечание сохраняет альтернативу.
- issue: Значение ἀδελφός
  choice: своего брата
  alternative: другого верующего; брата или сестру
  rationale: Основной текст сохраняет мужское число единственного числа греческого выражения. Вероятная направленность на члена общины и возможное более широкое применение пояснены в примечании.
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: «Господь» сохраняет обычную новозаветную богословскую и лексическую преемственность; в данном контексте речь идёт о Господе, совершающем суд.
- issue: Характер Господнего воздаяния
  choice: Господь воздаёт за всё это
  alternative: Господь — мститель за всё это; Господь карает за всё это
  rationale: Перевод сохраняет судебный смысл справедливого возмездия, не представляя его как личную мстительность и не ослабляя серьёзности предупреждения.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского наставления. Синтаксическая форма «чтобы никто…» сохраняет связь с предыдущим стихом. Избегаются как архаичное «мститель», так и чрезмерно узкое «обманывал» в основном тексте.
