  footnotes:
  - marker: a
    text: 'Или: «своё тело»; возможно также: «жену». Буквально: «свой сосуд».'
    reason: Поясняет неоднозначную метафору σκεῦος, не закрепляя в основном тексте только одно толкование.
lexical_decisions:
- source_word: εἰδέναι
  choice: знал, как
  rationale: Передаёт инфинитив со значением практического знания или умения и сохраняет синтаксическую зависимость от предыдущего стиха.
- source_word: κτᾶσθαι
  choice: приобретать
  rationale: Средний инфинитив обычно означает «приобретать себе, обретать»; выбранное слово передаёт процесс приобретения, не подменяя его более широким «владеть».
- source_word: σκεῦος
  choice: сосуд
  rationale: 'Буквальный эквивалент сохраняет образ и подлинную неоднозначность: в контексте слово может относиться к телу либо служить обозначением жены.'
- source_word: ἐν ἁγιασμῷ καὶ τιμῇ
  choice: в святости и чести
  rationale: Сохраняет параллельную конструкцию и этико-религиозную лексику исходного текста.
theological_decisions:
- issue: Значение выражения τὸ ἑαυτοῦ σκεῦος
  choice: свой сосуд с пояснительной сноской
  alternative: своё тело / жену
  rationale: Греческое выражение допускает несколько толкований. Основной текст не разрешает спор в пользу одного из них и тем самым сохраняет богословское и экзегетическое напряжение.
translation_notes:
  register: Современный литературный русский язык с сохранением необычного библейского образа. Формулировка намеренно несколько буквальна там, где исходный греческий текст неоднозначен.
