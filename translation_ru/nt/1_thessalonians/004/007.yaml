source:
  edition: SBLGNT
  text: οὐ γὰρ ἐκάλεσεν ἡμᾶς ὁ θεὸς ἐπὶ ἀκαθαρσίᾳ ἀλλ’ ἐν ἁγιασμῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/007.yaml
  text: For God did not call us for uncleanness[b][a], but in holiness.
translation:
  language: ru
  text: Ведь Бог призвал нас не к нечистоте[a], а к жизни в святости[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть к нравственной нечистоте; в данном контексте речь идёт прежде всего о половой нечистоте.
    reason: lexical_clarification
  - marker: b
    text: 'Или: «в освящении». Греческое слово может обозначать как святость, так и процесс освящения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит основание для предшествующего наставления; «ведь» естественно передаёт эту пояснительно-причинную связь в современном русском языке.
- source_word: ἐκάλεσεν
  choice: призвал
  rationale: Аорист передан прошедшим временем. «Призвал» сохраняет библейское понятие Божьего призвания, не уточняя его механизм в терминах какой-либо богословской системы.
- source_word: ἐπὶ ἀκαθαρσίᾳ
  choice: к нечистоте
  rationale: Сочетание ἐπί с дательным здесь выражает направленность или цель призвания. Русское «к нечистоте» кратко и ясно передаёт мысль о жизни, характеризуемой нравственной нечистотой.
- source_word: ἀκαθαρσίᾳ
  choice: нечистоте
  rationale: Слово обозначает нечистоту, в данном контексте прежде всего нравственную и особенно половую. «Нечистота» сохраняет широкий смысл и библейскую связь между чистотой и святостью.
- source_word: ἐν ἁγιασμῷ
  choice: к жизни в святости
  rationale: Буквальное «в святости/освящении» обозначает сферу или образ жизни, к которому призваны верующие. Добавление «к жизни» делает противопоставление естественным по-русски, сохраняя значение греческого ἐν.
- source_word: ἁγιασμῷ
  choice: святости
  rationale: ἁγιασμός может обозначать как состояние святости, так и освящение как процесс. В противопоставлении нечистоте «святость» естественно выражает характеристику жизни, а альтернативный смысл отмечен в сноске.
theological_decisions:
- issue: Смысл Божьего призвания
  choice: Реальное Божье призвание верующих, служащее основанием для святой жизни, без дальнейшего догматического уточнения
  alternative: Общее приглашение либо технически понимаемое действенное призвание
  rationale: Стих связывает нравственное наставление с Божьим призванием, но не объясняет здесь способ его действия. Поэтому сохранён глагол «призвал» без привнесения конфессиональной терминологии.
- issue: Святость как состояние или освящение как процесс
  choice: Основной текст передаёт образ жизни в святости
  alternative: «В освящении», с акцентом на процессе становления святым
  rationale: Греческое слово допускает оба оттенка. Противопоставление нравственной нечистоте способствует переводу «в святости», однако неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным библейским звучанием. Союзная конструкция «не к…, а к жизни в…» естественно передаёт противопоставление, не стирая различия между греческими предлогами ἐπί и ἐν.
