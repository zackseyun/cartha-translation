  text: Περὶ δὲ τῆς φιλαδελφίας οὐ χρείαν ἔχετε γράφειν ὑμῖν, αὐτοὶ γὰρ ὑμεῖς θεοδίδακτοί ἐστε εἰς τὸ ἀγαπᾶν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/009.yaml
  text: Concerning brotherly love, you have no need for anyone to write to you, for you yourselves are taught by God to love one another.
translation:
  language: ru
  text: Что же касается братской любви[a], нет нужды писать вам[b], ибо вы сами научены Богом любить друг друга.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть о любви между братьями и сёстрами по вере; греческое слово использует образ родственных отношений внутри общины верующих.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «нет нужды писать вам». Субъект глагола «писать» в греческом тексте не указан; по контексту подразумеваются авторы письма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: О
  rationale: Естественно вводит новую тему; частица δέ здесь обозначает мягкий переход, который в русском не требует отдельного «же» или «теперь».
- source_word: τῆς φιλαδελφίας
  choice: братской любви
  rationale: Сохраняет семейную образность и отличие φιλαδελφία от более общего ἀγαπᾶν далее в стихе; в данном контексте относится к любви между всеми верующими.
- source_word: οὐ χρείαν ἔχετε γράφειν ὑμῖν
  choice: вам нет нужды писать
  rationale: Передаёт греческую конструкцию без добавления отсутствующего в тексте субъекта инфинитива; по-русски контекст позволяет естественно понять, что речь идёт о наставлении в письме.
- source_word: αὐτοὶ γὰρ ὑμεῖς
  choice: потому что вы сами
  rationale: «Вы сами» передаёт эмфатическое сочетание местоимений; «потому что» естественно выражает γάρ.
- source_word: θεοδίδακτοί ἐστε
  choice: научены Богом
  rationale: Ясно и непосредственно сохраняет значение редкого прилагательного и божественное действующее лицо.
- source_word: εἰς τὸ ἀγαπᾶν ἀλλήλους
  choice: любить друг друга
  rationale: Естественно передаёт направленность обучения и сохраняет более общий глагол «любить» в отличие от «братской любви» в начале стиха.
theological_decisions:
- issue: Различие между φιλαδελφία и ἀγαπᾶν в одном стихе
  choice: «братская любовь» и «любить»
  alternative: Передать оба выражения одним и тем же словом «любовь» без сохранения оттенка семейной привязанности.
  rationale: Разные русские формулировки сохраняют лексическое движение от семейной любви внутри общины к действию взаимной любви, не превращая его в доктринальное разграничение.
- issue: Неуказанный субъект γράφειν
  choice: 'Не добавлять «нам» или «кому-либо»: «вам нет нужды писать».'
  alternative: «Вам нет нужды, чтобы мы (или кто-либо) писали вам».
  rationale: В греческом субъект инфинитива не выражен. Контекст допускает авторов письма, но основной текст сохраняет исходную неопределённость; примечание поясняет буквальную конструкцию.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным синтаксисом. Формулировка «братская любовь» сохраняет традиционно понятную семейную образность, а примечание уточняет её включающий смысл. Порядок частей близок к греческому, но причинная связь выражена естественным русским союзом.
