  text: καὶ φιλοτιμεῖσθαι ἡσυχάζειν καὶ πράσσειν τὰ ἴδια καὶ ἐργάζεσθαι ⸀ταῖς χερσὶν ὑμῶν, καθὼς ὑμῖν παρηγγείλαμεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/011.yaml
  text: and to aspire to live quietly[a], to mind your own affairs, and to work with your own hands, just as we commanded you[b],
translation:
  language: ru
  text: и стремиться жить тихо[a], заниматься своими делами и трудиться своими руками, как мы вам и повелели,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «считать для себя честью вести тихую жизнь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοτιμεῖσθαι
  choice: стремиться
  rationale: Глагол выражает честолюбивое стремление или усердное старание. «Стремиться» естественно звучит по-русски и сохраняет парадоксальную мысль о стремлении к тихой жизни; более буквальный вариант дан в сноске.
- source_word: ἡσυχάζειν
  choice: жить тихо
  rationale: В данном наставлении речь идёт не о полном молчании, а о спокойном, не беспокойном образе жизни.
- source_word: πράσσειν τὰ ἴδια
  choice: заниматься своими делами
  rationale: Греческое выражение означает уделять внимание собственным обязанностям и делам. Этот вариант естественен и не имеет резкого оттенка русского «не лезть не в своё дело».
- source_word: ἐργάζεσθαι
  choice: трудиться
  rationale: Передаёт обычное значение работы и уместно в контексте ручного труда и самостоятельного обеспечения себя.
- source_word: ταῖς χερσὶν ὑμῶν
  choice: своими руками
  rationale: Творительный падеж передаёт инструментальное значение дательного, а «своими» сохраняет притяжательное ὑμῶν и акцент на личном труде.
- source_word: καθὼς
  choice: как
  rationale: Естественно вводит сопоставление с ранее данным наставлением; частица «и» перед сказуемым слегка подчёркивает соответствие.
- source_word: παρηγγείλαμεν
  choice: повелели
  rationale: Слово обозначает авторитетное распоряжение. «Повелели» сохраняет обязательную силу апостольского наставления, не прибегая к канцелярскому «приказали».
theological_decisions:
- issue: Обязательная сила апостольского наставления
  choice: повелели
  alternative: наставили
  rationale: παραγγέλλω здесь выражает не просто совет, а авторитетное нравственное предписание. «Повелели» сохраняет эту силу, тогда как «наставили» могло бы её ослабить.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизации. Сохранена инфинитивная цепочка греческого текста и синтаксическая связь с предшествующим контекстом, поэтому стих начинается со строчной буквы и завершается запятой. Выражение «жить тихо» обозначает спокойный образ жизни, а не молчание.
