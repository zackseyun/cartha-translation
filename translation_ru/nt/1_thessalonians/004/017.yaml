revisions:
- from: Затем мы, живые, оставшиеся, вместе с ними будем восхищены[a] на облаках навстречу Господу в воздухе[b] — и так всегда будем с Господом.
  to: Затем мы, кто останется в живых, вместе с ними будем подхвачены[a] в облаках, чтобы встретить Господа в воздухе[b], — и так всегда будем с Господом.
  rationale: 'Исправлено пространственное значение ἐν νεφέλαις: «в облаках» точно передаёт греческий предлог и сохраняет конкретный образ. Синтаксис группы «живые, оставшиеся» сделан естественным для современного русского без добавления нового смысла. «Будем подхвачены» передаёт будущий страдательный ἁρπαγησόμεθα прямо и нейтрально; сноска отражает внезапный, сильный характер глагола. Формулировка «чтобы встретить» передаёт цель движения εἰς ἀπάντησιν, не определяя дальнейший ход событий.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:47:28Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: последовательность событий, группа ещё живых и оставшихся, совместность с ними, будущая встреча с Господом и постоянное пребывание с Ним сохранены. Однако «на облаках» обычно означает нахождение поверх облаков, тогда как ἐν νεφέλαις означает «в облаках / среди облаков».'
  naturalness: Фраза в целом понятна, но «мы, живые, оставшиеся» звучит несколько фрагментарно в современном литературном русском. «Мы, кто останется в живых» естественнее и передаёт обе характеристики в данном контексте. «Чтобы встретить» ясно выражает целевое εἰς ἀπάντησιν.
  terminology: «Господь» передано последовательно. Вместо конфессионально нагруженного и в современном общем употреблении неоднозначного «будем восхищены» выбран нейтральный, прямой вариант «будем подхвачены»; сноска сохраняет возможность более сильного «внезапно унесены», не навязывая эсхатологической схемы.
  issues:
  - severity: medium
    issue: «На облаках» для ἐν νεφέλαις
    rationale: Предлог ἐν обозначает нахождение в/среди облаков. Русское «на облаках» способно создать иной пространственный образ — сверху, на поверхности облаков.
  - severity: low
    issue: Фрагментарная конструкция «мы, живые, оставшиеся»
    rationale: Она формально близка к двум греческим субстантивированным причастиям, но в современном русском звучит тяжеловесно. Перестройка сохраняет смысл тех, кто к тому моменту останется жив.
  - severity: low
    issue: «Восхищены» как основной глагол
    rationale: Слово закреплено в церковной традиции, но для современного литературного читателя может прежде всего означать «исполнены восторга» и служит конфессиональным техническим термином. «Подхвачены» яснее передаёт пассивное внезапное перемещение.
