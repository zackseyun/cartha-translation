source:
  edition: SBLGNT
  text: ἔπειτα ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι ἅμα σὺν αὐτοῖς ἁρπαγησόμεθα ἐν νεφέλαις εἰς ἀπάντησιν τοῦ κυρίου εἰς ἀέρα· καὶ οὕτως πάντοτε σὺν κυρίῳ ἐσόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/017.yaml
  text: Then we who are alive[a], who remain, will be caught up together with them in the clouds to meet the Lord in the air[b]; and so we will always be with the Lord.
translation:
  language: ru
  text: Затем мы, кто останется в живых, вместе с ними будем подхвачены[a] в облаках, чтобы встретить Господа в воздухе[b], — и так всегда будем с Господом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будем внезапно унесены». Греческий глагол подчёркивает внезапность и силу действия.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для встречи с Господом». Выражение может обозначать выход навстречу кому-либо, однако сам стих не уточняет, что последует за этой встречей.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπειτα
  choice: Затем
  rationale: Передаёт переход к следующему событию после воскресения умерших во Христе, описанного в предыдущем стихе.
- source_word: οἱ ζῶντες οἱ περιλειπόμενοι
  choice: мы, живые, оставшиеся
  rationale: Сохраняет две параллельные характеристики тех верующих, которые будут ещё жить и останутся до этого момента.
- source_word: ἅμα σὺν αὐτοῖς
  choice: вместе с ними
  rationale: Естественно выражает как совместность, так и одновременность происходящего с воскресшими верующими.
- source_word: ἁρπαγησόμεθα
  choice: будем восхищены
  rationale: Передаёт будущее страдательное значение и внезапное, властное действие; примечание поясняет менее привычный современному читателю смысл слова.
- source_word: ἐν νεφέλαις
  choice: на облаках
  rationale: Сохраняет конкретный образ облаков; сочетание «на облаках» естественно для русского библейского повествования и не превращает образ в отвлечённую метафору.
- source_word: εἰς ἀπάντησιν τοῦ κυρίου
  choice: навстречу Господу
  rationale: Передаёт направленное движение для встречи, не добавляя последующего маршрута или эсхатологической схемы.
- source_word: εἰς ἀέρα
  choice: в воздухе
  rationale: При глагольном выражении «навстречу» по-русски естественно обозначает место встречи, сохраняя пространственный смысл греческого текста.
- source_word: καὶ οὕτως
  choice: и так
  rationale: Может указывать на способ или итог описанной последовательности и не уточняет больше, чем исходный текст.
- source_word: πάντοτε σὺν κυρίῳ ἐσόμεθα
  choice: всегда будем с Господом
  rationale: Прямо и естественно передаёт обещание постоянного пребывания с Господом.
theological_decisions:
- issue: Передача ἁρπαγησόμεθα в стихе, связанном со спорами о «восхищении»
  choice: будем восхищены
  alternative: будем внезапно унесены
  rationale: Основной вариант сохраняет узнаваемый библейский термин, а примечание раскрывает заложенные в греческом глаголе внезапность и силу действия, не вводя учения о времени или порядке событий сверх сказанного в стихе.
- issue: Значение εἰς ἀπάντησιν τοῦ κυρίου
  choice: навстречу Господу
  alternative: для встречи с Господом
  rationale: Формулировка ясно обозначает встречу и направленное движение, но не определяет, куда участники направятся после неё; более широкая эсхатологическая последовательность остаётся открытой.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис следует греческой последовательности, но остаётся естественным. Термин «восхищены» сохранён как узнаваемый и точный в контексте, при этом его смысл пояснён в сноске; более поздние конфессиональные схемы в перевод не внесены.
