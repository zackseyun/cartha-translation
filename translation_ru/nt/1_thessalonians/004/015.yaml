reference: 1 Thessalonians 4:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ὑμῖν λέγομεν ἐν λόγῳ κυρίου, ὅτι ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι εἰς τὴν παρουσίαν τοῦ κυρίου οὐ μὴ φθάσωμεν τοὺς κοιμηθέντας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/015.yaml
  text: 'For this we say to you by a word from the Lord: that we who are living[a], who remain until the coming of the Lord[c][b], will certainly not precede those who have fallen asleep.'
translation:
  language: ru
  text: 'Ибо мы говорим вам по слову Господа[a]: мы, живущие и оставшиеся до пришествия Господа[b], ни в коем случае не опередим тех, кто уснул[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «словом Господа» или «на основании слова Господа». Греческое выражение может указывать как на изречение Господа Иисуса, так и на откровение, данное с Его властью.'
    reason: alternative_reading
  - marker: b
    text: Греческое слово παρουσία может также означать «прибытие» или «присутствие»; здесь речь идёт о будущем пришествии Господа.
    reason: lexical_alternative
  - marker: c
    text: «Те, кто уснул» — образное обозначение умерших.
    reason: metaphor_clarification
lexical_decisions:
- source_word: ἐν λόγῳ κυρίου
  choice: словом Господа
  rationale: Инструментальная конструкция передаёт, что слова Павла основаны на слове, имеющем авторитет Господа, и не решает однозначно, идёт ли речь об изречении Иисуса или об откровении, данном от Господа.
- source_word: παρουσίαν
  choice: пришествие
  rationale: В эсхатологическом контексте слово обозначает будущее прибытие и явление Господа; «пришествие» естественно и точно передаёт этот событийный смысл в современном русском библейском регистре.
- source_word: οἱ ζῶντες
  choice: мы, живущие
  rationale: Сохраняется форма причастия настоящего времени и включение Павлом себя в обозначенную группу без утверждения о сроках события.
- source_word: οἱ περιλειπόμενοι
  choice: оставшиеся
  rationale: Нейтрально обозначает тех, кто всё ещё будет в живых к указанному времени, не добавляя оттенка выживания после конкретного бедствия.
- source_word: οὐ μὴ φθάσωμεν
  choice: ни в коем случае не опередим
  rationale: '«Ни в коем случае» передаёт усиленное отрицание οὐ μή, а «опередим» — контекстуальное значение φθάνω: оказаться раньше, предшествовать.'
- source_word: τοὺς κοιμηθέντας
  choice: тех, кто уснул
  rationale: Сохраняется метафора сна, употреблённая о умерших, а не заменяется истолковывающим словом «умершие».
- source_word: κύριος / κυρίου
  choice: Господь / Господа
  rationale: Обычное и контекстуально уместное обозначение Иисуса; прописная буква ясно указывает на титул.
theological_decisions:
- issue: Характер «слова Господа»
  choice: Формулировка оставляет открытым способ получения этого слова, сохраняя его авторитет.
  alternative: Прямо представить его либо как известное изречение земного Иисуса, либо как отдельное откровение Павлу.
  rationale: Греческое ἐν λόγῳ κυρίου само по себе не уточняет способ передачи, поэтому перевод не должен устранять эту неоднозначность.
- issue: Смысл метафоры сна
  choice: Сохранить образ сна применительно к умершим.
  alternative: Передать непосредственно как «умерших».
  rationale: Метафора является частью богословской образности отрывка и связана с надеждой на воскресение, хотя сама по себе не отрицает реальности смерти.
- issue: Включающее «мы» и время пришествия
  choice: 'Сохранить первое лицо: «мы, живущие и оставшиеся».'
  alternative: Переформулировать как отвлечённое «те, кто будет жив».
  rationale: Греческий текст использует ἡμεῖς, однако эта речевая перспектива сама по себе не устанавливает дату пришествия; перевод сохраняет форму, не добавляя хронологического вывода.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис близок к греческому, но естественен по-русски; усиленное отрицание и метафора сна сохранены. Маркеры сносок размещены непосредственно после соответствующих выражений.
