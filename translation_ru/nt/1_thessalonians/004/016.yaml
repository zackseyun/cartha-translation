id: 1TH.4.16
reference: 1 Thessalonians 4:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτι αὐτὸς ὁ κύριος ἐν κελεύσματι, ἐν φωνῇ ἀρχαγγέλου καὶ ἐν σάλπιγγι θεοῦ, καταβήσεται ἀπ’ οὐρανοῦ, καὶ οἱ νεκροὶ ἐν Χριστῷ ἀναστήσονται πρῶτον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/016.yaml
  text: For the Lord himself will descend from heaven with a command[a], with the voice of an archangel, and with the trumpet of God, and the dead in Messiah will rise first[b],
translation:
  language: ru
  text: Потому что сам Господь с повелительным возгласом[a], с голосом архангела и с Божьей трубой сойдёт с неба, и умершие в Мессии[b] воскреснут первыми.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с властным возгласом». Греческое слово κέλευσμα может означать приказ, призыв или командный крик.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционный перевод: «во Христе».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Потому что
  rationale: Союз вводит основание для утешения и уверения в предыдущем контексте; «потому что» естественно передаёт объяснительную силу.
- source_word: αὐτὸς ὁ κύριος
  choice: сам Господь
  rationale: Интенсивное αὐτός подчёркивает, что сойдёт именно Господь; русский порядок слов сохраняет этот акцент.
- source_word: ἐν κελεύσματι
  choice: при повелении
  rationale: κέλευσμα обозначает властный приказ, призыв или командный возглас. «При повелении» кратко передаёт смысл, не уточняя без необходимости, кто его произносит.
- source_word: ἐν φωνῇ ἀρχαγγέλου
  choice: при голосе архангела
  rationale: Буквально сохраняет φωνή и родительный ἀρχαγγέλου; отсутствие артикля в греческом не требует вводить неопределённость, неестественную для русского.
- source_word: ἐν σάλπιγγι θεοῦ
  choice: при трубе Божьей
  rationale: Передаёт σάλπιγξ как «труба» и сохраняет связь с Богом; форма «Божьей» естественна и торжественна в современном русском.
- source_word: καταβήσεται ἀπ’ οὐρανοῦ
  choice: сойдёт с неба
  rationale: Точно и идиоматично передаёт движение вниз, выраженное καταβαίνω, и исходную точку ἀπ’ οὐρανοῦ.
- source_word: οἱ νεκροὶ
  choice: умершие
  rationale: Субстантивированное прилагательное обозначает умерших людей; «умершие» в данном контексте естественнее, чем «мёртвые».
- source_word: ἐν Χριστῷ
  choice: в Мессии
  rationale: Χριστός здесь сохраняет значение титула Помазанника; «Мессия» переводит этот титул, не превращая его лишь в привычное имя.
- source_word: ἀναστήσονται
  choice: воскреснут
  rationale: Будущая форма ἀνίστημι в контексте воскресения естественно и точно передаётся русским «воскреснут», без внесения пассивного залога.
- source_word: πρῶτον
  choice: первыми
  rationale: Наречие указывает последовательность относительно живых верующих в следующем стихе; по-русски при подлежащем во множественном числе естественно «воскреснут первыми».
theological_decisions:
- issue: Передача ἐν Χριστῷ
  choice: в Мессии
  alternative: во Христе
  rationale: Греческое Χριστός является титулом «Помазанник»; основной текст передаёт титульное значение как «Мессия», а традиционная формулировка приведена в сноске.
- issue: Чей голос или повеление сопровождает сошествие
  choice: не уточнять
  alternative: понять повеление или голос как принадлежащие самому Господу
  rationale: Греческая конструкция перечисляет сопровождающие обстоятельства, но прямо не устанавливает, кто отдаёт повеление и кому принадлежит голос; перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством и умеренной торжественностью. Повтор «при… при… при…» сохраняет трёхчастную структуру греческого текста; «сойдёт с неба» и «воскреснут первыми» остаются ясными для обычного читателя.
