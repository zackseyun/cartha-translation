  terminology: '«Братья» корректно сохраняет форму ἀδελφοί как обращения; сноска уместно поясняет вероятный охват мужчин и женщин в общинах. Формулировку сноски следует сделать семантически точнее: слово не «обращено к собратьям», а означает единоверцев в данном контексте.'
