  source_fidelity: 'Смысл греческого текста в целом передан верно: настоящее ποιεῖτε отражено как продолжающаяся практика, географический охват сохранён, а παρακαλοῦμεν и περισσεύειν μᾶλλον переданы как увещание к дальнейшему росту. Однако «поступаете со всеми братьями» в современном русском прежде всего может означать совместное действие с ними, тогда как εἰς πάντας обозначает направленность братской любви на всех верующих.'
