    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Ведь
  rationale: 'Передаёт пояснительно-подтверждающую силу сочетания: последующее утверждение обосновывает сказанное ранее и подчёркивает, что адресаты действительно проявляют братскую любовь.'
- source_word: ποιεῖτε αὐτὸ
  choice: вы так и поступаете
  rationale: Естественно передаёт продолжающуюся практику и отсылает к братской любви из предыдущего стиха, не повторяя её без необходимости.
- source_word: εἰς πάντας τοὺς ἀδελφοὺς
  choice: со всеми братьями
  rationale: Русская конструкция «так поступать с кем-либо» естественно выражает направленность действия на всех членов общины.
- source_word: τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ
  choice: по всей Македонии
  rationale: Сохраняет широкий географический охват и звучит естественно по-русски.
- source_word: παρακαλοῦμεν δὲ ὑμᾶς
  choice: Но призываем вас
  rationale: «Призываем» выражает настойчивое увещание, а «но» передаёт мягкий переход δέ от похвалы к дальнейшему наставлению.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет форму обращения исходного текста; в данном общинном контексте слово может охватывать верующих обоих полов, что поясняется в сноске.
- source_word: περισσεύειν μᾶλλον
  choice: преуспевать в этом ещё больше
  rationale: Передаёт дальнейший рост сверх уже достигнутого уровня; добавленное «в этом» естественно связывает призыв с проявлением братской любви.
theological_decisions:
- issue: Объём значения ἀδελφοί/ἀδελφούς в смешанной христианской общине
  choice: братья
  alternative: братья и сёстры; собратья по вере
  rationale: Основной текст сохраняет грамматически мужскую форму греческого слова, не исключая его вероятного представительного употребления по отношению ко всей общине; этот объём значения пояснён в сноске.
- issue: Подразумеваемое дополнение при περισσεύειν
  choice: преуспевать в этом ещё больше
  alternative: изобиловать ещё больше; всё больше возрастать
  rationale: Контекст связывает призыв с братской любовью, но перевод оставляет отсылку местоименной, не превращая подразумеваемое значение в отдельное явное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык; тон уважительный и увещательный. Формулировка избегает архаизма «изобиловать» в отношении поведения и сохраняет связь с предыдущим стихом через «так» и «в этом».
