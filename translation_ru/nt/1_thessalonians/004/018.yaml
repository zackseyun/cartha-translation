  footnotes:
  - marker: a
    text: 'Или: «утешайте друг друга этими словами». Глагол может означать «ободрять», «утешать» или «увещевать»; в данном контексте особенно заметен смысл пастырского утешения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Поэтому
  rationale: Союз вводит вывод из предшествующего учения о пришествии Господа, воскресении умерших верующих и общей встрече с Ним.
- source_word: παρακαλεῖτε
  choice: ободряйте
  rationale: Глагол может обозначать ободрение, утешение или увещание. В данном контексте «ободряйте» сохраняет широту значения и передаёт пастырскую направленность слов Павла.
- source_word: ἀλλήλους
  choice: друг друга
  rationale: Естественно передаёт взаимность действия в современном русском языке.
- source_word: ἐν
  choice: этими
  rationale: В сочетании «ободряйте… этими словами» творительный падеж естественно выражает средство ободрения, соответствуя функции ἐν.
- source_word: τοῖς λόγοις τούτοις
  choice: этими словами
  rationale: Выражение прямо отсылает к только что сказанному Павлом и сохраняет конкретное значение λόγοι.
