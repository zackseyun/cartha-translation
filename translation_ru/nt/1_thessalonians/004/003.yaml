lexical_decisions:
- source_word: θέλημα
  choice: воля
  rationale: Обычное и точное обозначение желаемого и властного намерения Бога; «желание» звучало бы слабее, а «замысел» мог бы неоправданно указывать на предопределённый итог.
- source_word: ὁ ἁγιασμὸς ὑμῶν
  choice: ваше освящение
  rationale: Сохраняет ёмкость греческого выражения, которое может обозначать посвящённость Богу, святость и освящённую жизнь; дальнейший инфинитив раскрывает здесь его нравственное содержание.
- source_word: ἀπέχεσθαι
  choice: чтобы вы воздерживались
  rationale: Передаёт пояснительный инфинитив как раскрытие того, в чём практически состоит названное освящение.
- source_word: πορνείας
  choice: половой распущенности
  rationale: Современное русское выражение для широкого понятия недозволенного полового поведения; оно не ограничивает значение только добрачной связью.
- source_word: γάρ
  choice: ведь
  rationale: Естественно передаёт обосновывающую связь с предшествующим наставлением.
theological_decisions:
- issue: Значение ἁγιασμός в нравственном наставлении
  choice: «освящение» с пояснением в следующей части стиха
  alternative: «святость»
  rationale: Перевод сохраняет богословскую и нравственную широту слова, не сводя его ни исключительно к положению перед Богом, ни исключительно к процессу нравственного изменения.
- issue: Объём значения πορνεία
  choice: широкое выражение «половая распущенность»
  alternative: «блуд»
  rationale: Греческое слово охватывает недозволенное половое поведение в широком смысле; перевод не сужает его до одной разновидности.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет пояснительную структуру оригинала. «Ведь» естественно связывает стих с предыдущим наставлением, а двоеточие вводит раскрытие Божьей воли.
