id: 1TH.4.1
reference: 1 Thessalonians 4:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Λοιπὸν ⸀οὖν, ἀδελφοί, ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν ἐν κυρίῳ Ἰησοῦ, ⸀ἵνα καθὼς παρελάβετε παρ’ ἡμῶν τὸ πῶς δεῖ ὑμᾶς περιπατεῖν καὶ ἀρέσκειν θεῷ, ⸂καθὼς καὶ περιπατεῖτε⸃, ἵνα περισσεύητε μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/001.yaml
  text: Finally then[a], brothers, we ask and urge you in the Lord Jesus that, just as you received from us how you ought to walk and to please God, just as you are also walking, you abound more and more.
translation:
  language: ru
  text: Итак, братья[a], мы просим и призываем вас в Господе Иисусе, чтобы вы, как получили от нас наставление о том, как вам следует жить и угождать Богу, — как вы и живёте, — всё более преуспевали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «братья и сёстры»: греческое слово буквально означает «братья», но во множественном числе может обращаться ко всей общине, включая женщин.'
    reason: Лексическая альтернатива и пояснение гендерного охвата обращения.
lexical_decisions:
- source_word: Λοιπὸν οὖν
  choice: Итак
  rationale: Сочетание вводит переход к следующей, заключительной части наставлений. «Итак» естественно передаёт переходно-выводный оттенок, не создавая впечатления, будто это уже последние слова послания.
- source_word: ἀδελφοί
  choice: братья[a]
  rationale: Сохранена форма мужского рода греческого обращения; в примечании поясняется, что обращение охватывает всю общину.
- source_word: ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν
  choice: просим и призываем вас
  rationale: 'Переданы оба элемента: уважительная просьба и настойчивое нравственное побуждение.'
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: в Господе Иисусе
  rationale: Сохранён предлог и христологический титул; выражение допускает оттенки единения с Господом и основанного на нём авторитета призыва.
- source_word: καθὼς παρελάβετε παρ’ ἡμῶν
  choice: как вы приняли от нас наставление
  rationale: «Приняли» отражает παραλαμβάνω как получение переданного учения; слово «наставление» делает подразумеваемый объект естественным по-русски и раскрывается последующей конструкцией.
- source_word: τὸ πῶς δεῖ ὑμᾶς περιπατεῖν
  choice: о том, как вам должно жить
  rationale: В данном нравственном контексте метафорическое «ходить» естественно передаётся современным русским «жить», а «должно» сохраняет силу δεῖ.
- source_word: καὶ ἀρέσκειν θεῷ
  choice: и угождать Богу
  rationale: Прямое и устойчивое русское соответствие, сохраняющее направленность жизни на Божье одобрение.
- source_word: καθὼς καὶ περιπατεῖτε
  choice: и вы так и живёте
  rationale: Вставное подтверждение признаёт уже существующий образ жизни адресатов; «так и» естественно передаёт усилительный оттенок καί.
- source_word: ἵνα περισσεύητε μᾶλλον
  choice: так преуспевайте в этом ещё больше
  rationale: Передаёт призыв не остановиться на достигнутом, а возрастать далее. «В этом» связывает заключительный призыв с описанным образом жизни, не добавляя нового предмета.
theological_decisions:
- issue: Гендерный охват обращения ἀδελφοί
  choice: «братья» в основном тексте с пояснением в сноске
  alternative: «братья и сёстры»
  rationale: Греческий текст использует форму мужского рода, которая в контексте общины могла включать верующих обоих полов. Основной текст сохраняет форму источника, а сноска сообщает её вероятный широкий охват.
- issue: Значение ἐν κυρίῳ Ἰησοῦ
  choice: «в Господе Иисусе»
  alternative: «именем Господа Иисуса» или «властью Господа Иисуса»
  rationale: 'Буквальная конструкция сохраняет подлинную смысловую ёмкость выражения: призыв совершается в единении с Господом и с опорой на его авторитет, без сведения фразы лишь к одному из этих оттенков.'
- issue: Характер христианской жизни в образе περιπατεῖν
  choice: «жить»
  alternative: «поступать» или буквальное «ходить»
  rationale: Здесь речь идёт об образе поведения перед Богом. «Жить» ясно передаёт нравственный смысл метафоры современному читателю и не вносит отдельного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достойным апостольским тоном. Синтаксис упрощён двоеточием и парными тире, чтобы длинное греческое предложение оставалось ясным. Избегается архаическое нравственное «ходить»; повтор περιπατεῖν последовательно передан глаголом «жить».
