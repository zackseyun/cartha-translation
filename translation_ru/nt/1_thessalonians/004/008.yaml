  text: τοιγαροῦν ὁ ἀθετῶν οὐκ ἄνθρωπον ἀθετεῖ ἀλλὰ τὸν θεὸν τὸν ⸀καὶ ⸀διδόντα τὸ πνεῦμα αὐτοῦ τὸ ἅγιον εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/008.yaml
  text: Therefore[a], whoever rejects this rejects not man but God[b], who also gives his Holy Spirit to you.
translation:
  language: ru
  text: Итак, кто отвергает[a] это, тот отвергает не человека, а Бога, который также даёт вам[b] своего Святого Духа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пренебрегает». Глагол может означать «отвергать», «пренебрегать» или «признавать недействительным».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в вас». Здесь греческий предлог выражает направление, тогда как по-русски обычно говорят «даёт вам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιγαροῦν
  choice: Итак
  rationale: Передаёт вывод из предшествующего наставления и естественно звучит в современном русском языке.
- source_word: ὁ ἀθετῶν / ἀθετεῖ
  choice: кто отвергает ... тот отвергает
  rationale: Субстантивированное причастие имеет обобщающее значение. «Кто ... тот» естественно передаёт его без ограничения по полу, а «отвергает» сохраняет смысл отказа признать обязательность данного наставления.
- source_word: οὐκ ἄνθρωπον ... ἀλλὰ τὸν θεόν
  choice: не человека, а Бога
  rationale: Сохраняет краткую антитезу оригинала; единственное число «человека» употреблено обобщённо.
- source_word: τὸν καὶ διδόντα
  choice: Который и даёт
  rationale: Причастный оборот передан естественным русским придаточным определительным; «и» отражает καί, связывая это действие с характеристикой Бога.
- source_word: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον
  choice: Своего Святого Духа
  rationale: Возвратное притяжательное местоимение ясно относит Духа к Богу. Порядок слов и прописные буквы естественно обозначают Святого Духа как определённого референта.
- source_word: εἰς ὑμᾶς
  choice: вам
  rationale: При глаголе «давать» это идиоматичный русский эквивалент направительного εἰς; буквальное «в вас» по-русски не сочетается с данным глаголом без смысловой перестройки.
theological_decisions:
- issue: Референт выражения «Своего Святого Духа»
  choice: Выражение обозначает Святого Духа, Которого Бог даёт верующим.
  alternative: Понимать «святой дух» как безличный дар или внутреннее расположение.
  rationale: Определённая греческая конструкция τὸ πνεῦμα αὐτοῦ τὸ ἅγιον и павловский контекст естественно указывают на Святого Духа; перевод не добавляет дальнейших догматических уточнений.
- issue: Обобщающее значение ὁ ἀθετῶν
  choice: кто отвергает ... тот отвергает
  alternative: отвергающий; тот, кто отвергает
  rationale: Мужской род единственного числа в греческом здесь имеет обобщающее, а не исключительно мужское значение.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной антитезой. Повтор «отвергает ... отвергает» намеренно сохраняет риторическую структуру оригинала. Обращение передано во множественном числе «вам».
