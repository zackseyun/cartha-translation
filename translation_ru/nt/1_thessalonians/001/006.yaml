source:
  edition: SBLGNT
  text: καὶ ὑμεῖς μιμηταὶ ἡμῶν ἐγενήθητε καὶ τοῦ κυρίου, δεξάμενοι τὸν λόγον ἐν θλίψει πολλῇ μετὰ χαρᾶς πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/006.yaml
  text: And you became imitators of us and of the Lord[a], having received the word in much affliction with joy of the Holy Spirit,
translation:
  language: ru
  text: И вы стали подражать нам и Господу, приняв слово среди тяжёлых страданий с радостью от Святого Духа[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с радостью Святого Духа»; родительный падеж может указывать на источник этой радости.'
    reason: Сохраняет возможное альтернативное понимание связи πνεύματος ἁγίου с χαρᾶς, не выдавая его за единственно возможное.
lexical_decisions:
- source_word: μιμηταὶ
  choice: подражать
  rationale: Существительное обозначает тех, кто следует чьему-либо примеру. Конструкция «стали подражать» естественна по-русски и сохраняет явную мысль Павла о подражании.
- source_word: ἐγενήθητε
  choice: стали
  rationale: Форма γίνομαι указывает на наступление нового состояния; «стали» ясно и естественно передаёт этот смысл.
- source_word: κυρίου
  choice: Господу
  rationale: Здесь κύριος относится к Иисусу и употреблено как христологический титул.
- source_word: δεξάμενοι
  choice: приняв
  rationale: Деепричастие передаёт предшествующее/сопутствующее действие и показывает, в чём проявилось подражание, не утяжеляя русскую фразу.
- source_word: τὸν λόγον
  choice: слово
  rationale: В контексте имеется в виду возвещённая весть Евангелия; «слово» сохраняет характерную для Павла лексику и её смысловые связи.
- source_word: ἐν θλίψει πολλῇ
  choice: среди великих скорбей
  rationale: θλῖψις обозначает тяготы, притеснение и страдание. «Среди великих скорбей» звучит естественно и не привносит обязательного эсхатологического оттенка.
- source_word: μετὰ χαρᾶς
  choice: с радостью
  rationale: Прямое и естественное соответствие греческому предложному обороту.
- source_word: πνεύματος ἁγίου
  choice: от Святого Духа
  rationale: Родительный падеж, вероятно, обозначает источник радости. Русское «от Святого Духа» ясно выражает этот смысл, а возможная более буквальная связь сохранена в примечании.
theological_decisions:
- issue: Связь родительного падежа в выражении χαρᾶς πνεύματος ἁγίου
  choice: радость от Святого Духа, то есть имеющая своим источником Святого Духа
  alternative: «радость Святого Духа» или «радость, произведённая Святым Духом»
  rationale: Контекст противопоставляет тяжёлые скорби радости, источник которой не объясняется обстоятельствами. Основной текст передаёт наиболее вероятный оттенок источника, а примечание сохраняет грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет достоинство апостольского наставления и остаётся понятной обычному читателю. Порядок компонентов слегка приспособлен к русскому синтаксису без устранения смысловой напряжённости между скорбями и радостью.
