  text: ὥστε γενέσθαι ὑμᾶς ⸀τύπον πᾶσιν τοῖς πιστεύουσιν ἐν τῇ Μακεδονίᾳ καὶ ⸀ἐν τῇ Ἀχαΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/007.yaml
  text: so that you became an example to all the believers in Macedonia and in Achaia[a].
translation:
  language: ru
  text: так что вы стали примером для всех верующих в Македонии и Ахайе[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «образцом» или «образцом для подражания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: так что
  rationale: Передаёт следствие того, как фессалоникийцы приняли слово и стали подражателями, сохраняя естественную русскую связь с предыдущим стихом.
- source_word: γενέσθαι
  choice: стали
  rationale: Аористный инфинитив в конструкции с ὥστε выражает наступивший результат; личная форма естественна по-русски.
- source_word: ὑμᾶς
  choice: вы
  rationale: В греческой инфинитивной конструкции это логический субъект; по-русски передаётся личным местоимением в именительном падеже.
- source_word: τύπον
  choice: примером
  rationale: В данном контексте слово означает образец, достойный подражания; «пример» ясно и естественно передаёт этот смысл.
- source_word: πᾶσιν τοῖς πιστεύουσιν
  choice: для всех верующих
  rationale: Субстантивированное причастие обозначает всех тех, кто верит; предлог «для» естественно указывает, для кого фессалоникийцы стали примером.
- source_word: ἐν τῇ Μακεδονίᾳ
  choice: в Македонии
  rationale: Прямое обозначение местонахождения верующих в названной области.
- source_word: καὶ ἐν τῇ Ἀχαΐᾳ
  choice: и Ахайе
  rationale: Однородное географическое обозначение; общий предлог «в» естественно относится к обоим названиям в русском языке.
