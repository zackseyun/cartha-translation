  text: αὐτοὶ γὰρ περὶ ἡμῶν ἀπαγγέλλουσιν ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς, καὶ πῶς ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων δουλεύειν θεῷ ζῶντι καὶ ἀληθινῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/009.yaml
  text: For they themselves report about us what kind of reception we had among you[a], and how you turned to God from idols to serve the living and true God[c][b],
translation:
  language: ru
  text: Ведь они сами рассказывают о нас, каким было наше прибытие к вам[a], и как вы обратились от идолов к Богу, чтобы служить живому и истинному Богу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каким был наш вход к вам»; выражение указывает на характер и результат прихода апостолов к фессалоникийцам.'
    reason: lexical_alternative
  - marker: b
    text: Слова «живому и истинному Богу» противопоставляют Бога безжизненным идолам; ср. Иер. 10:10.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ γὰρ
  choice: Ведь они сами
  rationale: «Ведь» естественно передаёт пояснительную связь γάρ с предыдущим контекстом, а «они сами» сохраняет усилительное значение αὐτοί.
- source_word: ἀπαγγέλλουσιν
  choice: рассказывают
  rationale: Настоящее время и значение распространения вести переданы естественным русским глаголом без излишне официального оттенка.
- source_word: ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς
  choice: как мы пришли к вам
  rationale: Греческое выражение буквально говорит о том, «каким был наш вход к вам», то есть о характере и результате прихода. Основной текст передаёт это естественно, а буквальная и контекстуальная возможности отмечены в сноске.
- source_word: πῶς ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων
  choice: как вы обратились от идолов к Богу
  rationale: «Обратились» сохраняет образ поворота и в сочетании «от… к…» точно передаёт исходную точку и направление перемены.
- source_word: εἰδώλων
  choice: идолов
  rationale: Прямой и общепонятный эквивалент для культовых образов и почитаемых ложных божеств.
- source_word: δουλεύειν
  choice: чтобы служить
  rationale: Инфинитив цели передан конструкцией «чтобы служить»; «служить» сохраняет значение преданного служения, не усиливая без необходимости оттенок рабства.
- source_word: θεῷ ζῶντι καὶ ἀληθινῷ
  choice: живому и истинному Богу
  rationale: Сохраняется контраст единого реально живого и истинного Бога с безжизненными идолами.
theological_decisions:
- issue: Характер обращения в ἐπεστρέψατε
  choice: «вы обратились от идолов к Богу»
  alternative: «вы были обращены от идолов к Богу»
  rationale: Форма глагола позволяет прямо сказать о действии адресатов и сохранить метафору поворота, не решая в переводе более широкий богословский вопрос о действующей силе обращения.
- issue: Смысл δουλεύειν по отношению к Богу
  choice: «служить»
  alternative: «быть рабами» или «поклоняться»
  rationale: В контексте речь идёт о новой религиозной верности и преданном служении. «Служить» охватывает этот смысл, тогда как «быть рабами» чрезмерно выдвигает социальную метафору, а «поклоняться» сужает значение до культового действия.
- issue: Контраст ζῶντι καὶ ἀληθινῷ с идолами
  choice: «живому и истинному Богу»
  alternative: «Богу, Который жив и истинен»
  rationale: Атрибутивная формулировка близка греческому тексту и сохраняет богословски значимый контраст с безжизненными и ложными идолами.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сделан естественным для обычного читателя; при этом направленность обращения «от идолов к Богу», целевое значение инфинитива и контраст с идолами сохранены.
