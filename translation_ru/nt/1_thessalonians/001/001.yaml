id: 1TH.1.1
reference: 1 Thessalonians 1:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ· χάρις ὑμῖν καὶ ⸀εἰρήνη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God the Father and the Lord Jesus the Messiah: grace to you and peace.'
translation:
  language: ru
  text: 'Павел, Силуан и Тимофей — церкви[a] фессалоникийцев в Боге Отце и Господе Иисусе Мессии[b]: благодать вам и мир.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «общине». Греческое ἐκκλησία обозначает собранное сообщество людей.
    reason: lexical_alternative
  - marker: b
    text: Или «Христе». Греческое Χριστός означает «Мессия», хотя традиционно передаётся также словом «Христос».
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Павел
  rationale: Традиционная и общеупотребительная русская форма имени Παῦλος.
- source_word: Σιλουανὸς
  choice: Силуан
  rationale: Передаёт именно форму Σιλουανός, представленную в греческом тексте; «Сила» соответствует родственной, но иной греческой форме.
- source_word: Τιμόθεος
  choice: Тимофей
  rationale: Традиционная и общеупотребительная русская форма имени Τιμόθεος.
- source_word: ἐκκλησίᾳ
  choice: церкви
  rationale: Естественное для русского новозаветного текста обозначение собранной общины верующих; возможное значение «община» отмечено в сноске.
- source_word: Θεσσαλονικέων
  choice: фессалоникийцев
  rationale: Родительный падеж множественного числа обозначает жителей Фессалоники; конструкция «церкви фессалоникийцев» сохраняет структуру оригинала и понятна по-русски.
- source_word: ἐν
  choice: в
  rationale: Сохраняет выраженную предлогом сферу или отношение, не сводя его к более толковательному «принадлежащей».
- source_word: θεῷ πατρὶ
  choice: Боге Отце
  rationale: Аппозиционная конструкция передана без отсутствующего в греческом притяжательного местоимения «нашем».
- source_word: κυρίῳ
  choice: Господе
  rationale: «Господь» — устойчивое и контекстуально точное соответствие κύριος в новозаветном употреблении.
- source_word: Ἰησοῦ Χριστῷ
  choice: Иисусе Мессии
  rationale: Χριστός передан по значению как титул «Мессия», а не только транслитерирован как «Христос»; падежная форма всей группы определяется предлогом ἐν.
- source_word: χάρις
  choice: благодать
  rationale: Устойчиво передаёт характерный для посланий Павла термин и сохраняет его богословскую насыщенность.
- source_word: εἰρήνη
  choice: мир
  rationale: Стандартное соответствие εἰρήνη, сохраняющее как обычное значение, так и отзвук библейского приветствия.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: благодать вам и мир
  rationale: Сохраняет порядок греческих слов и при этом звучит естественно и торжественно по-русски.
theological_decisions:
- issue: Передача Χριστός в приветствии
  choice: Мессия
  alternative: Христос
  rationale: Здесь слово сохраняет различимый титульный смысл. Перевод «Мессия» раскрывает значение греческого титула, а традиционный вариант «Христос» указан в сноске.
- issue: Отношение, выраженное ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ
  choice: церковь «в Боге Отце и Господе Иисусе Мессии»
  alternative: церковь, принадлежащая Богу Отцу и Господу Иисусу Мессии
  rationale: Буквальное «в» сохраняет неоднозначность языка Павла — сферу существования, единение или отношение — и не заменяет её одним толкованием. Параллельная связь церкви с Отцом и Господом Иисусом также остаётся явной.
translation_notes:
  register: Современный литературный русский язык с достоинством эпистолярного приветствия. Тире отделяет имена отправителей от адресата, а двоеточие вводит формулу благопожелания. Сохранены лаконичность оригинала, повтор союза между именами и богословски значимый предлог «в».
