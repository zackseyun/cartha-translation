  yaml_path: translation/nt/1_thessalonians/001/002.yaml
  text: We always give thanks to God for all of you[a], making mention of you in our prayers unceasingly,
translation:
  language: ru
  text: Мы всегда благодарим Бога за всех вас, непрестанно упоминая вас в наших молитвах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мы непрестанно благодарим Бога за всех вас, упоминая вас в наших молитвах». Наречие «непрестанно» может относиться либо непосредственно к упоминанию в молитвах, либо ко всему высказыванию о благодарности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: Мы… благодарим
  rationale: Настоящее время, действительный залог, первое лицо множественного числа. «Благодарим Бога» естественно передаёт направленную Богу благодарность в формуле Павла.
- source_word: πάντοτε
  choice: всегда
  rationale: Точно и естественно передаёт временное значение наречия.
- source_word: περὶ πάντων ὑμῶν
  choice: за всех вас
  rationale: περί с родительным указывает, о ком или ради кого возносится благодарность; «за всех вас» естественно по-русски и сохраняет всеохватность πάντων.
- source_word: μνείαν ποιούμενοι
  choice: вспоминая вас
  rationale: Идиома буквально означает «совершая упоминание»; в контексте молитвы русское «вспоминая вас» звучит естественно, сохраняя смысл молитвенного упоминания.
- source_word: ἐπὶ τῶν προσευχῶν ἡμῶν
  choice: в наших молитвах
  rationale: 'Идиоматически передаёт обстоятельственное значение выражения: во время или в ходе молитв.'
- source_word: ἀδιαλείπτως
  choice: непрестанно
  rationale: Сохраняет усиленное значение постоянства и допускает исходную синтаксическую неоднозначность связи наречия.
theological_decisions:
- issue: К какому действию относится ἀδιαλείπτως («непрестанно»)
  choice: В основном тексте по положению связано прежде всего с «вспоминая вас в наших молитвах»
  alternative: Может относиться ко всему утверждению о постоянной благодарности Богу
  rationale: Греческое расположение допускает обе синтаксические связи; неоднозначность не следует устранять без оговорки.
translation_notes:
  register: Современный литературный русский язык; тон ясный и достойный. Причастная конструкция сохранена без тяжеловесного буквализма. Маркер сноски помещён после всего предложения, поскольку сноска поясняет синтаксическую связь заключительного наречия.
