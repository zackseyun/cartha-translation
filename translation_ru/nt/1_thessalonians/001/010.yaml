  source_fidelity: 'Текст точно передаёт синтаксическую цепочку греческого оригинала: ожидание Сына «с небес», воскресение Его Богом из мёртвых и характеристику Иисуса как избавляющего от грядущего гнева. «С небес» уместно сохраняет множественное число οὐρανῶν без неестественной кальки. Причастие «избавляющего» хорошо отражает характеризующую функцию τὸν ῥυόμενον и не навязывает будущего времени.'
