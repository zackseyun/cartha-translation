  terminology: «Сын», «воскресил из мёртвых», «Иисус», «избавляющий» и «грядущий гнев» точны и последовательны. Выражение «грядущий гнев» сохраняет смысловую и богословскую неопределённость оригинала, не подменяя его «судом» и не уточняя эсхатологическую схему. Сноска представляет допустимую лексико-синтаксическую альтернативу и имеет корректную привязку.
