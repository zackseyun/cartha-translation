id: 1TH.1.10
reference: 1 Thessalonians 1:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἀναμένειν τὸν υἱὸν αὐτοῦ ἐκ τῶν οὐρανῶν, ὃν ἤγειρεν ἐκ τῶν νεκρῶν, Ἰησοῦν τὸν ῥυόμενον ἡμᾶς ⸀ἐκ τῆς ὀργῆς τῆς ἐρχομένης.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/010.yaml
  text: and to wait for his Son from heaven[a], whom he raised from the dead—Jesus, who rescues us from the coming wrath.
translation:
  language: ru
  text: и ожидать с небес Его Сына, которого Он воскресил из мёртвых, — Иисуса, избавляющего нас от грядущего гнева.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спасающего нас от гнева, который грядёт».'
    reason: 'Лексико-синтаксическая альтернатива: ῥύομαι допускает перевод «спасать», а причастие ἐρχομένης можно передать придаточным предложением.'
lexical_decisions:
- source_word: ἀναμένειν
  choice: ожидать
  rationale: Передаёт продолжительное ожидание с надеждой и естественно продолжает описание обращения фессалоникийцев к Богу в стихе 9.
- source_word: υἱὸν αὐτοῦ
  choice: Его Сына
  rationale: Прямо сохраняет христологический титул и принадлежность Сына Богу; прописная буква соответствует современной русской библейской издательской норме.
- source_word: ἐκ τῶν οὐρανῶν
  choice: с небес
  rationale: Сохраняет множественное число греческого выражения и звучит естественно в современном литературном русском.
- source_word: ὃν ἤγειρεν ἐκ τῶν νεκρῶν
  choice: которого Он воскресил из мёртвых
  rationale: Естественная русская формулировка, точно передающая действие Бога и воскресение Иисуса из числа умерших.
- source_word: Ἰησοῦν
  choice: Иисуса
  rationale: Использована общепринятая русская форма имени; падеж согласован с приложением к слову «Сына».
- source_word: τὸν ῥυόμενον
  choice: избавляющего
  rationale: Причастная форма сохраняет грамматическую связь с «Иисуса» и характеризует Его как Избавителя, не превращая действие явно только в будущее.
- source_word: ἐκ τῆς ὀργῆς
  choice: от ... гнева
  rationale: «Гнев» точнее передаёт ὀργή, чем более широкое «суд»; предлог «от» естественно выражает избавление от опасности.
- source_word: τῆς ἐρχομένης
  choice: грядущего
  rationale: Кратко и достойно передаёт приближающийся, эсхатологически ориентированный характер гнева без уточнения его вида.
theological_decisions:
- issue: Характер «грядущего гнева»
  choice: Сохранить выражение «грядущий гнев» без дальнейшего определения.
  alternative: «грядущий суд» либо прямое отождествление с последним осуждением или периодом бедствий.
  rationale: Сам стих не уточняет, идёт ли речь исключительно о последнем суде, эсхатологических бедствиях или Божьем гневе в более общем смысле.
- issue: Временная сила причастия ῥυόμενον
  choice: «избавляющего нас», без явного будущего времени.
  alternative: «который избавит нас» или «который избавляет нас».
  rationale: Настоящее причастие характеризует Иисуса через Его спасительное действие. Будущая направленность подразумевается словами «грядущего гнева», но не должна дополнительно навязываться форме глагола.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «С небес» и «грядущего» сохраняют достоинство и образность исходного текста, оставаясь понятными широкому читателю.
