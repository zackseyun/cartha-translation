source:
  edition: SBLGNT
  text: μνημονεύοντες ὑμῶν τοῦ ἔργου τῆς πίστεως καὶ τοῦ κόπου τῆς ἀγάπης καὶ τῆς ὑπομονῆς τῆς ἐλπίδος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/003.yaml
  text: remembering your work of faith and labor of love and steadfastness of hope in our Lord Jesus the Messiah before our God and Father[b][a],
translation:
  language: ru
  text: вспоминая ваше дело веры[a], труд любви и стойкость надежды на нашего Господа Иисуса Мессию[b] перед нашим Богом и Отцом,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верности» или «доверия».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Христа». Греч. Χριστοῦ; здесь титул передан как «Мессия».'
    reason: alternative_reading
lexical_decisions:
- source_word: μνημονεύοντες
  choice: постоянно вспоминая
  rationale: Причастие настоящего времени продолжает мысль предыдущего стиха; «постоянно» естественно передаёт длительный характер действия.
- source_word: ἔργου
  choice: дело
  rationale: Сохраняет образ конкретного действия и риторическую триаду «дело… труд… стойкость».
- source_word: πίστεως
  choice: веры
  rationale: Основное и наиболее естественное соответствие πίστις; родительный падеж допускает смысл дела, порождённого верой или ею характеризуемого.
- source_word: κόπου
  choice: труд
  rationale: Передаёт напряжённое, требующее усилий служение и естественно сочетается с «любви».
- source_word: ἀγάπης
  choice: любви
  rationale: Прямое и общепонятное соответствие ἀγάπη.
- source_word: ὑπομονῆς
  choice: стойкость
  rationale: Передаёт твёрдое терпение и способность не отступать под давлением.
- source_word: ἐλπίδος
  choice: надежды
  rationale: Стандартное соответствие, сохраняющее смысл уверенного ожидания.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: на нашего Господа Иисуса Мессию
  rationale: Родительный оборот естественно понимается как указание на объект надежды; Χριστός передан как титул «Мессия».
- source_word: ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: перед нашим Богом и Отцом
  rationale: Близко передаёт греческий оборот и указывает на пребывание в Божьем присутствии.
theological_decisions:
- issue: Значение πίστις в выражении τοῦ ἔργου τῆς πίστεως
  choice: вера
  alternative: верность; доверие
  rationale: Здесь наиболее вероятно дело, исходящее из веры, однако πίστις способно включать оттенки доверия и верности; они сохранены в примечании.
- issue: Передача Χριστοῦ
  choice: Мессия
  alternative: Христос
  rationale: Χριστός исторически и семантически является титулом Помазанника; традиционная форма «Христос» указана как допустимый вариант.
- issue: Связь ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: перед нашим Богом и Отцом относится ко всему воспоминанию
  alternative: может теснее относиться к стойкости надежды
  rationale: Порядок слов допускает некоторую синтаксическую широту; русская постановка в начале делает основной дискурсивный смысл ясным, не добавляя богословского содержания.
translation_notes:
  register: 'Современный литературный русский язык с достоинством апостольского благодарения. Сохранена трёхчастная структура: «дело веры, труд любви и стойкость надежды». Оборот «постоянно вспоминая» грамматически продолжает предыдущий стих.'
