id: 1TH.1.5
reference: 1 Thessalonians 1:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτι τὸ εὐαγγέλιον ἡμῶν οὐκ ἐγενήθη εἰς ὑμᾶς ἐν λόγῳ μόνον ἀλλὰ καὶ ἐν δυνάμει καὶ ἐν πνεύματι ἁγίῳ ⸀καὶ πληροφορίᾳ πολλῇ, καθὼς οἴδατε οἷοι ἐγενήθημεν ⸀ἐν ὑμῖν δι’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/005.yaml
  text: because our gospel did not come to you in word only[a], but also in power and in the Holy Spirit and with great conviction[b], just as you know what kind of men we proved to be among you for your sake.
translation:
  language: ru
  text: потому что наше Евангелие пришло к вам не только в слове, но и в силе, в Святом Духе и с полной уверенностью[a], как вы и сами знаете, какими мы были среди вас ради вас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с глубокой убеждённостью»; возможно также: «с полной достоверностью».'
    reason: Греческое πληροφορίᾳ πολλῇ допускает оттенки полной уверенности, убеждённости и достоверности, а её носитель прямо не указан.
  - marker: b
    text: 'Буквально: «какими мы стали среди вас ради вас»; возможно также: «какими мы показали себя среди вас ради вас».'
    reason: Глагол ἐγενήθημεν буквально означает «стали», но в контексте может описывать то, какими проповедники оказались или показали себя.
lexical_decisions:
- source_word: εὐαγγέλιον
  choice: Евангелие
  rationale: Устоявшийся и понятный русский термин для апостольской Благой вести; в данном контексте обозначает проповедуемую Павлом весть.
- source_word: ἐγενήθη εἰς ὑμᾶς
  choice: пришло к вам
  rationale: Идиоматически передаёт достижение Евангелием фессалоникийцев и избегает неестественного буквального «стало к вам».
- source_word: ἐν λόγῳ μόνον
  choice: не только в слове
  rationale: Сохраняет противопоставление словесной проповеди сопровождавшим её силе, Святому Духу и уверенности.
- source_word: ἐν δυνάμει
  choice: в силе
  rationale: Сохраняет форму и ритмический параллелизм повторяющихся оборотов с ἐν.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: в Святом Духе
  rationale: В контексте Павловых посланий выражение указывает на Святого Духа; русский синтаксис требует предлога и естественно допускает определённое личное наименование.
- source_word: πληροφορίᾳ πολλῇ
  choice: с полной уверенностью
  rationale: Естественно передаёт полноту уверенности, не уточняя прямо, кому именно она принадлежала — проповедникам, слушателям или всему явлению Евангелия среди них.
- source_word: καθὼς οἴδατε
  choice: вы и сами знаете
  rationale: Передаёт обращение к собственному знанию адресатов как подтверждению сказанного; частица «сами» естественно выражает этот акцент.
- source_word: οἷοι ἐγενήθημεν
  choice: какими мы были
  rationale: По-русски естественно описывает проявившийся среди адресатов характер Павла и его сотрудников; буквальный оттенок «стали» отмечен в сноске.
- source_word: ἐν ὑμῖν
  choice: среди вас
  rationale: Обозначает пребывание и поведение миссионеров в среде фессалоникийцев.
- source_word: δι’ ὑμᾶς
  choice: ради вас
  rationale: Сохраняет возможный смысл цели и пользы, не сводя оборот только к причинному «из-за вас».
theological_decisions:
- issue: Значение πνεύματι ἁγίῳ
  choice: Святой Дух как действующий божественный Дух
  alternative: святой дух или духовное воодушевление
  rationale: Обычное Павлово употребление и противопоставление простому слову указывают на действие Святого Духа, а не только на человеческий настрой.
- issue: Носитель πληροφορία
  choice: Формулировка «с полной уверенностью» оставляет носителя уверенности прямо не названным
  alternative: Уточнить, что убеждённость принадлежала проповедникам или слушателям
  rationale: Греческий текст не обозначает носителя явно, поэтому перевод не должен устранять эту содержательную открытость.
- issue: Смысл οἷοι ἐγενήθημεν
  choice: «какими мы были» — характеристика Павла и его сотрудников среди адресатов
  alternative: «какими людьми мы показали себя» или буквально «какими мы стали»
  rationale: Выбранная формулировка естественна по-русски и не превращает фразу в явное заявление о доказательстве их достоинств; буквальный вариант сохранён в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизмов. Сохранены Павлово «наше Евангелие», трёхчастный ритм «в силе, в Святом Духе и с полной уверенностью» и несколько необычное, но смыслово ёмкое «ради вас». Начальное строчное «потому что» учитывает синтаксическую связь стиха с предыдущим высказыванием.
