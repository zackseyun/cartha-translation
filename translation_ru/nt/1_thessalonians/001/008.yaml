  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀφ’ ὑμῶν γὰρ ἐξήχηται ὁ λόγος τοῦ κυρίου οὐ μόνον ἐν τῇ Μακεδονίᾳ ⸀καὶ Ἀχαΐᾳ, ⸀ἀλλ’ ἐν παντὶ τόπῳ ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεὸν ἐξελήλυθεν, ὥστε μὴ χρείαν ⸂ἔχειν ἡμᾶς⸃ λαλεῖν τι·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/008.yaml
  text: For from you the word of the Lord has sounded forth[a], not only in Macedonia and Achaia, but in every place your faith toward God has gone out, so that we have no need to say anything.
translation:
  language: ru
  text: Ведь от вас слово Господне разнеслось не только по Македонии и Ахайе — повсюду распространилась и ваша вера в Бога[a], так что нам нет нужды что-либо говорить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ваша вера, направленная к Богу».'
    reason: Основной текст употребляет естественное русское выражение «вера в Бога»; сноска отмечает направленность, выраженную греческим предлогом πρὸς.
lexical_decisions:
- source_word: ἐξήχηται
  choice: разнеслось
  rationale: Передаёт сильный звуковой образ глагола — слово прозвучало и было услышано далеко за пределами исходного места, — а также сохраняющийся результат перфекта.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: слово Господне
  rationale: Сохраняет традиционное и формальное Павлово выражение, не сужая родительный оборот до единственного толкования — слова от Господа или слова о Господе.
- source_word: Μακεδονίᾳ καὶ Ἀχαΐᾳ
  choice: Македонии и Ахайе
  rationale: Употреблены общепринятые русские формы названий исторических областей.
- source_word: ἀλλ’ ἐν παντὶ τόπῳ
  choice: но и повсюду
  rationale: Естественно передаёт всеохватность выражения «в каждом месте», не ограничивая его отдельными областями.
- source_word: ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεόν
  choice: о вашей вере в Бога
  rationale: «Вера в Бога» — естественный русский эквивалент; предложная направленность греческого πρὸς отмечена в сноске. Предлог «о» связан с контекстуально подразумеваемым распространением известия и позволяет избежать неестественного впечатления, будто сама вера географически перемещалась.
- source_word: ἐξελήλυθεν
  choice: стало известно
  rationale: Контекстуально передаёт результат того, что вера фессалоникийцев «вышла» повсюду, то есть получила широкую известность. Это несколько эксплицирует смысл ради естественности русского языка.
- source_word: ὥστε μὴ χρείαν ἔχειν ἡμᾶς
  choice: так что нам нет нужды
  rationale: Естественно передаёт конструкцию результата с ὥστε и инфинитивом.
- source_word: λαλεῖν τι
  choice: что-либо говорить
  rationale: Идиоматический русский эквивалент без добавочного усиления.
theological_decisions:
- issue: Значение πίστις
  choice: вера
  alternative: верность; доверие
  rationale: В данном контексте речь прежде всего об обращённом к Богу верующем отклике фессалоникийцев, поэтому «вера» точнее, чем характеристика их надёжности или верности.
- issue: Направленность выражения πίστις πρὸς τὸν θεόν
  choice: вера в Бога
  alternative: вера, обращённая к Богу
  rationale: Основной текст использует естественную русскую формулу, а сноска сохраняет заметную в греческом выражении направленность к Богу, не превращая её в отдельное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Слово Господне» сохраняет узнаваемую формулу, а «разнеслось» удерживает звуковой образ оригинала. Синтаксис сделан плавным и понятным без конфессионально окрашенных уточнений.
