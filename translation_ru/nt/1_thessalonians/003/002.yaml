source:
  edition: SBLGNT
  text: καὶ ἐπέμψαμεν Τιμόθεον, τὸν ἀδελφὸν ἡμῶν καὶ ⸀συνεργὸν τοῦ ⸀θεοῦ ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ, εἰς τὸ στηρίξαι ὑμᾶς καὶ παρακαλέσαι ⸀ὑπὲρ τῆς πίστεως ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/002.yaml
  text: and we sent Timothy[a], our brother and God's fellow worker in the gospel of the Messiah, to strengthen you and to encourage you concerning your faith[b],
translation:
  language: ru
  text: и послали Тимофея, нашего брата и Божьего соработника[a] в благовестии Мессии[b], чтобы укрепить вас и ободрить в вашей вере,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «соработника с Богом». В ряде рукописей здесь стоит иная формулировка, например «Божьего служителя».'
    reason: alternative_reading
  - marker: b
    text: Греч. «Христа»; здесь переведено как «Мессии», поскольку слово употреблено прежде всего как титул.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμψαμεν
  choice: послали
  rationale: Аорист передан простым глаголом прошедшего времени; «послали» естественно для повествования и не звучит канцелярски.
- source_word: Τιμόθεον
  choice: Тимофея
  rationale: Использована устоявшаяся русская форма библейского имени в требуемом падеже.
- source_word: ἀδελφὸν ἡμῶν
  choice: нашего брата
  rationale: Сохранён семейный образ, обозначающий близость внутри общины верующих, без пояснительного расширения.
- source_word: συνεργὸν τοῦ θεοῦ
  choice: Божьего соработника
  rationale: Формулировка близка к греческому родительному падежу и сохраняет сильное выражение исходного текста, не заменяя его более слабым «служителем».
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ
  choice: в деле Благой вести о Мессии
  rationale: «В деле» естественно передаёт сферу труда, выраженную ἐν. «Благая весть о Мессии» ясно звучит по-русски; понимание родительного τοῦ Χριστοῦ как вести о Мессии наиболее уместно в контексте, хотя греческая конструкция сама по себе допускает более широкий оттенок связи.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Здесь Χριστός сохраняет силу титула; «Мессия» передаёт её яснее, чем традиционное «Христос».
- source_word: εἰς τὸ στηρίξαι
  choice: чтобы укрепить вас
  rationale: Оборот с εἰς и артиклевым инфинитивом выражает цель; конструкция с «чтобы» естественна в современном русском языке.
- source_word: παρακαλέσαι
  choice: ободрить
  rationale: В контексте испытаний глагол означает поддерживающее наставление и ободрение; «ободрить» не сужает смысл до одного утешения или увещания.
- source_word: ὑπὲρ τῆς πίστεως ὑμῶν
  choice: в вашей вере
  rationale: Русское сочетание «ободрить в вере» естественно передаёт поддержку в отношении веры; притяжательное местоимение сохраняет ὑμῶν.
- source_word: πίστεως
  choice: вере
  rationale: «Вера» здесь обозначает доверие и верующую приверженность фессалоникийцев; перевод не сужает значение до одной лишь верности.
theological_decisions:
- issue: Передача συνεργὸν τοῦ θεοῦ
  choice: Божьего соработника
  alternative: соработника с Богом; по другим рукописям — Божьего служителя
  rationale: Основной текст SBLGNT содержит сильное выражение συνεργὸν τοῦ θεοῦ. Оно сохранено без богословского смягчения, тогда как возможное понимание и значимые разночтения указаны в сноске.
- issue: Передача Χριστοῦ в εὐαγγελίῳ τοῦ Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: В данном сочетании слово сохраняет титульный смысл. Традиционный вариант «Христос» указан в сноске, не подменяя значение титула в основном тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Благая весть» написана с прописной буквы как устойчивое обозначение провозглашаемой вести. Порядок однородных инфинитивных целей передан естественной русской конструкцией «чтобы укрепить… и ободрить…».
