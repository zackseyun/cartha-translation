  text: ὑμᾶς δὲ ὁ κύριος πλεονάσαι καὶ περισσεύσαι τῇ ἀγάπῃ εἰς ἀλλήλους καὶ εἰς πάντας, καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/012.yaml
  text: And may the Lord cause you to increase and abound in love for one another and for all[a], just as we also do for you[b],
translation:
  language: ru
  text: А вам пусть Господь даст возрастать и изобиловать в любви друг к другу и ко всем[a], как и мы любим вас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в любви по отношению друг к другу и ко всем».'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительная часть в греческом тексте эллиптична, буквально: «как и мы — к вам»; глагол «любим» восполнен по смыслу из предыдущей фразы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: Частица обозначает мягкий переход в молитвенном пожелании; «а» связывает стих с предыдущим, не создавая резкого противопоставления.
- source_word: ὁ κύριος
  choice: Господь
  rationale: Сохранён обычный библейский титул без уточнения его референта непосредственно в переводе.
- source_word: πλεονάσαι
  choice: даст возрастать
  rationale: 'Конструкция с «пусть» передаёт оптатив пожелания, а «даст» выражает каузативный оттенок: Господь является источником возрастания адресатов.'
- source_word: περισσεύσαι
  choice: изобиловать
  rationale: Глагол передаёт превышающую меру полноту и остаётся отличимым от πλεονάσαι, сохраняя риторическое усиление пары.
- source_word: τῇ ἀγάπῃ
  choice: в любви
  rationale: Дательный падеж понимается как сфера, в которой адресаты должны возрастать и изобиловать.
- source_word: εἰς ἀλλήλους
  choice: друг к другу
  rationale: Передано направленное отношение любви естественным для современного русского языка выражением.
- source_word: καὶ εἰς πάντας
  choice: и ко всем
  rationale: Формулировка сохраняет широкий и неуточнённый охват πάντας, не ограничивая его верующими или всеми людьми явно.
- source_word: καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς
  choice: как и мы — в любви к вам
  rationale: Тире и краткое восполнение «в любви» сохраняют заметную эллиптичность греческой фразы, одновременно делая её понятной по-русски.
theological_decisions:
- issue: Референт выражения ὁ κύριος
  choice: «Господь» без поясняющего добавления
  alternative: Явно указать «Господь Иисус» либо «Бог»
  rationale: Сам стих не называет референта прямо; сохранение титула не снимает возможную христологическую или более общую божественную отнесённость.
- issue: Охват πάντας
  choice: «ко всем»
  alternative: «ко всем людям» или «ко всем верующим»
  rationale: Греческое слово оставляет круг лиц формально неуточнённым; широкий русский эквивалент сохраняет эту открытость.
- issue: Эллипсис в заключительной части
  choice: Сохранить эллиптическое сравнение с минимальным восполнением «в любви»
  alternative: 'Полностью развернуть: «как изобилуем любовью к вам и мы»'
  rationale: Минимальное восполнение проясняет смысл, не утверждая сверх текста, какой именно из двух предшествующих глаголов следует подразумевать.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Конструкция «пусть Господь даст» понятна широкому читателю и передаёт пожелание без архаического «да». Сочетание «возрастать и изобиловать» сохраняет два греческих глагола и их смысловое нарастание.
