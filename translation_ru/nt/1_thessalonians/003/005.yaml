id: 1TH.3.5
reference: 1 Thessalonians 3:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διὰ τοῦτο κἀγὼ μηκέτι στέγων ἔπεμψα εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν, μή πως ἐπείρασεν ὑμᾶς ὁ πειράζων καὶ εἰς κενὸν γένηται ὁ κόπος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/005.yaml
  text: For this reason[a], when I could bear it no longer, I sent to learn about your faith[b], lest somehow the tempter had tempted you and our labor might be in vain.
translation:
  language: ru
  text: Поэтому и я, не в силах больше терпеть, послал узнать о вашей вере[a], как бы искуситель не искусил вас и наш труд не оказался напрасным[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о вашей верности» или «о вашем доверии». Греческое слово может иметь пересекающиеся значения в зависимости от контекста.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «не стал пустым»; то есть не оказался бесплодным или тщетным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Естественно передаёт причинно-следственную связь с предшествующим изложением.
- source_word: κἀγὼ
  choice: и я
  rationale: Передаёт как местоименное ударение, так и элемент καί, связывающий решение Павла с предыдущим контекстом.
- source_word: μηκέτι στέγων
  choice: не в силах больше терпеть
  rationale: Современное и естественное выражение предела, до которого Павел мог переносить неизвестность.
- source_word: ἔπεμψα
  choice: послал
  rationale: Сохраняет неуказанный объект глагола; имя Тимофея ясно из контекста, но в данном стихе не повторено.
- source_word: εἰς τὸ γνῶναι
  choice: узнать о
  rationale: Передаёт целевую конструкцию и смысл получения сведений, а не просто обладания знанием.
- source_word: τὴν πίστιν ὑμῶν
  choice: о вашей вере
  rationale: В данном контексте πίστις прежде всего означает сохраняющуюся веру фессалоникийцев; возможные оттенки доверия и верности отмечены в сноске.
- source_word: μή πως
  choice: как бы не
  rationale: Естественно выражает опасение Павла без чрезмерного уточнения модальности.
- source_word: ἐπείρασεν ὑμᾶς ὁ πειράζων
  choice: искуситель не искусил вас
  rationale: Сохраняет намеренный однокоренной повтор греческого текста и отрицательную, соблазняющую направленность действия.
- source_word: εἰς κενὸν γένηται
  choice: не оказался напрасным
  rationale: Передаёт идиоматический смысл результата — труд мог оказаться без пользы; по-русски это естественнее буквального «стать пустым».
- source_word: ὁ κόπος ἡμῶν
  choice: наш труд
  rationale: Слово «труд» передаёт усилие и тяготу, заложенные в κόπος, и сохраняет множественное «наш».
theological_decisions:
- issue: Значение πίστις применительно к фессалоникийцам
  choice: вера
  alternative: верность; доверие
  rationale: Контекст говорит о продолжающемся отклике на благую весть, поэтому «вера» наиболее естественна; однако семантические оттенки доверия и верности не исключаются и сохранены в сноске.
- issue: Личность ὁ πειράζων
  choice: искуситель
  alternative: тот, кто искушает; сатана
  rationale: Греческий текст использует описательное обозначение, а не имя. «Искуситель» сохраняет это обозначение и контекстуальную связь с сатаной, не подставляя имя прямо в текст.
- issue: Модальность опасения после μή πως
  choice: как бы … не искусил … и … не оказался
  alternative: чтобы искуситель, возможно, не искусил … и труд не оказался
  rationale: Русская конструкция естественно сохраняет опасение относительно возможного уже совершившегося искушения и возможной тщетности труда, не утверждая, что это действительно произошло.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис сохраняет длинную причинно-целевую структуру оригинала, но остаётся понятным обычному читателю. Однокоренной повтор «искуситель — искусил» намеренно сохранён.
