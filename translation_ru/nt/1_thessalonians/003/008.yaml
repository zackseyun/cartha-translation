lexical_decisions:
- source_word: ὅτι
  choice: Ибо
  rationale: Союз вводит объяснение причины утешения, о котором говорится выше. «Ибо» естественно передаёт причинно-пояснительную связь, не превращая её в более жёсткое логическое утверждение.
- source_word: νῦν
  choice: теперь
  rationale: Сохраняет временное значение наречия и подчёркивает нынешнее оживление Павла в связи со стойкостью фессалоникийцев.
- source_word: ζῶμεν
  choice: мы живём
  rationale: Буквально передаёт настоящее время глагола, сохраняя при этом контекстуально возможный риторический смысл — обретённые силы и воодушевление.
- source_word: ἐὰν
  choice: если
  rationale: Прямо сохраняет условную форму греческого выражения, не усиливая её до «только при условии».
- source_word: ὑμεῖς
  choice: вы
  rationale: Передаёт явно выраженное местоимение и сохраняет смысловой акцент на адресатах.
- source_word: στήκετε
  choice: твёрдо стоите
  rationale: Передаёт значение стойкости и неизменности; форма настоящего времени выражает продолжающееся состояние и естественно звучит по-русски.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Сохраняет характерное для Павла ёмкое выражение сферы и отношений, не сводя его к одному толкованию.
theological_decisions:
- issue: Смысл слов «теперь мы живём»
  choice: Сохранено буквальное выражение, которое в контексте, вероятно, риторически говорит о новых силах и ободрении Павла благодаря стойкости верующих.
  alternative: 'Понимать слова почти буквально: смысл жизни и служения Павла зависит от их верности.'
  rationale: Греческий текст говорит буквально «мы живём», но контекст допускает сильную пастырскую гиперболу. Основной текст не устраняет эту напряжённость.
- issue: Смысл выражения «в Господе»
  choice: Сохранено широкое выражение о стойкости в сфере отношений с Господом.
  alternative: Передать как «в единении с Господом» или «сохраняете верность Господу».
  rationale: Буквальная формулировка сохраняет богословскую ёмкость греческого выражения и не навязывает узкого конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным библейским регистром. «Ибо» выбрано ради ясной связи с предыдущим контекстом; «твёрдо стоите» естественно передаёт образ стойкости.
