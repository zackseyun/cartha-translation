  naturalness: Предлагаемая конструкция «мы сочли за лучшее, чтобы нас оставили одних в Афинах» современна и литературна; она несколько более формальна, чем «остаться», но оправданно сохраняет страдательный залог исходного текста.
  terminology: Название «Афины» передано нормативно. Множественное число «мы» и «одних» сохранено. Специальных богословских терминов в стихе нет.
