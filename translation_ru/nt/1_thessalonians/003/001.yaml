lexical_decisions:
- source_word: Διὸ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего контекста и сохраняет логическую связь.
- source_word: μηκέτι στέγοντες
  choice: не в силах больше терпеть
  rationale: Естественно передаёт предел эмоциональной выдержки; подразумеваемый объект терпения восстанавливается из контекста, но не уточняется.
- source_word: εὐδοκήσαμεν
  choice: мы решили
  rationale: В данном контексте глагол выражает одобрительное волевое решение; русский вариант не сводит его к удовольствию, которое здесь звучало бы неестественно.
- source_word: καταλειφθῆναι
  choice: остаться
  rationale: Естественный русский эквивалент в этом контексте. Формально пассивное значение греческого инфинитива отмечено в сноске.
- source_word: ἐν Ἀθήναις
  choice: в Афинах
  rationale: Стандартная передача названия места и предложной конструкции.
- source_word: μόνοι
  choice: одни
  rationale: Сохраняет форму множественного числа и обозначает отсутствие других спутников, не решая вопрос о составе говорящей группы.
theological_decisions:
- issue: К кому относится первое лицо множественного числа и как оно соотносится с более широким контекстом
  choice: 'Сохранить множественное число: «мы… одни».'
  alternative: 'Понять множественное число как авторское и перевести в единственном числе: «я решил остаться один».'
  rationale: В греческом тексте употреблены формы множественного числа εὐδοκήσαμεν и μόνοι. Перевод не должен устранять историко-грамматическое напряжение ради согласования с одной из реконструкций событий.
translation_notes:
