id: 1TH.3.13
reference: 1 Thessalonians 3:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰς τὸ στηρίξαι ὑμῶν τὰς καρδίας ἀμέμπτους ἐν ἁγιωσύνῃ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ μετὰ πάντων τῶν ἁγίων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/013.yaml
  text: so that he may establish your hearts blameless in holiness before our God and Father at the coming of our Lord Jesus with all his holy ones[a].
translation:
  language: ru
  text: чтобы он утвердил ваши сердца непорочными в святости пред нашим Богом и Отцом при пришествии нашего Господа Иисуса со всеми его святыми[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со всеми его святыми людьми». Греческое слово может здесь обозначать святых людей, ангелов или тех и других.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τὸ στηρίξαι
  choice: чтобы он утвердил
  rationale: Сочетание εἰς τό с инфинитивом выражает цель или ожидаемый результат предыдущего пожелания. Личная форма с союзом «чтобы» естественна по-русски и сохраняет связь с подразумеваемым субъектом из предыдущего стиха.
- source_word: στηρίξαι
  choice: утвердил
  rationale: Глагол означает сделать твёрдым, укрепить, придать устойчивость. «Утвердил» сохраняет образ внутренней стойкости и естественно сочетается со словом «сердца».
- source_word: τὰς καρδίας
  choice: ваши сердца
  rationale: «Сердца» передаёт павловское обозначение внутреннего человека, не сужая смысл до чувств или рассудка.
- source_word: ἀμέμπτους
  choice: непорочными
  rationale: Слово обозначает отсутствие основания для упрёка или обвинения. «Непорочными» точно и достойно звучит в контексте нравственной святости.
- source_word: ἐν ἁγιωσύνῃ
  choice: в святости
  rationale: ἁγιωσύνη обозначает святость как состояние или качество; прямое соответствие естественно в современном литературном русском языке.
- source_word: ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: пред нашим Богом и Отцом
  rationale: «Пред» передаёт пребывание перед Божьим взором, а единая конструкция «нашим Богом и Отцом» сохраняет тесную связь двух наименований одного лица.
- source_word: ἐν τῇ παρουσίᾳ
  choice: при пришествии
  rationale: В данном эсхатологическом контексте παρουσία означает будущее прибытие и явление Господа; «пришествие» является точным и понятным русским соответствием.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: нашего Господа Иисуса
  rationale: Передаёт титул κύριος словом «Господь» и сохраняет синтаксическую структуру исходного текста.
- source_word: μετὰ πάντων τῶν ἁγίων αὐτοῦ
  choice: со всеми его святыми
  rationale: Субстантивированное «святыми» сохраняет широту греческого ἅγιοι и не добавляет слова «людьми» или «ангелами», которые преждевременно определили бы референта.
theological_decisions:
- issue: Кого обозначают «все его святые»
  choice: 'Референт не уточнён: «со всеми его святыми».'
  alternative: «со всеми его святыми людьми» или «со всеми его святыми ангелами»
  rationale: Греческое τῶν ἁγίων в данном эсхатологическом контексте может относиться к святым людям, ангелам либо к тем и другим. Перевод сохраняет эту подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Формы «пред» и «пришествие» сохраняют достоинство и богословскую точность, оставаясь понятными широкому читателю. Местоимение «его» дано со строчной буквы согласно нейтральной современной орфографической практике.
