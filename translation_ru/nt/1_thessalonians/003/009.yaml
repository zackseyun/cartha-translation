  yaml_path: translation/nt/1_thessalonians/003/009.yaml
  text: For what thanksgiving can we repay to God concerning you[a], for all the joy with which we rejoice because of you before our God,
translation:
  language: ru
  text: Какую же благодарность мы можем воздать Богу за вас[a], за всю радость, которую мы испытываем благодаря вам перед нашим Богом?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более свободно: «Как нам в полной мере отблагодарить Бога за вас?» Буквальнее: «Какую благодарность мы можем воздать Богу за вас?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα … εὐχαριστίαν
  choice: какую … благодарность
  rationale: Прямой вопрос сохраняет греческую форму и риторически подчёркивает, что никакая благодарность не может быть достаточной.
- source_word: ἀνταποδοῦναι
  choice: воздать
  rationale: Глагол означает дать в ответ, отплатить. «Воздать благодарность» сохраняет идею ответного дара, но по-русски звучит естественнее, чем буквальное «отплатить благодарностью».
- source_word: περὶ ὑμῶν
  choice: за вас
  rationale: В данном контексте это естественное русское обозначение тех, за кого благодарят Бога; более буквальное «о вас» звучало бы неестественно.
- source_word: ἐπὶ πάσῃ τῇ χαρᾷ
  choice: за всю ту радость
  rationale: Предлог выражает основание благодарности; «за» ясно связывает радость с благодарением Богу.
- source_word: ᾗ χαίρομεν
  choice: которой мы радуемся
  rationale: Сохранено намеренное однокоренное сочетание χαρά и χαίρω — «радость, которой радуемся».
- source_word: δι’ ὑμᾶς
  choice: из-за вас
  rationale: διά с винительным указывает на причину. Здесь выражение имеет однозначно положительный смысл благодаря слову «радость».
- source_word: ἔμπροσθεν τοῦ θεοῦ ἡμῶν
  choice: перед нашим Богом
  rationale: Кратко и непосредственно передаёт образ пребывания в Божьем присутствии.
theological_decisions:
- issue: Образ ответного воздаяния Богу
  choice: «Какую… благодарность можем мы воздать Богу»
  alternative: «Как нам достаточно отблагодарить Бога»
  rationale: Перевод сохраняет значение ἀνταποδοῦναι и риторическую силу вопроса, не превращая благодарность в буквальный расчёт с Богом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены риторический вопрос и однокоренное сочетание «радость, которой… радуемся»; конечная запятая исходного фрагмента заменена вопросительным знаком, поскольку стих образует завершённый риторический вопрос, хотя синтаксически мысль продолжается в следующем стихе.
