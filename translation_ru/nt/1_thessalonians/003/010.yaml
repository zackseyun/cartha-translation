lexical_decisions:
- source_word: νυκτὸς καὶ ἡμέρας
  choice: днём и ночью
  rationale: Наречные родительные передают повторяющееся или постоянное действие; этот порядок слов естественен для современного русского языка.
- source_word: ὑπερεκπερισσοῦ
  choice: горячо
  rationale: Редкое усилительное наречие подчёркивает исключительную настойчивость просьбы; «горячо молясь» естественно передаёт эту силу без тяжеловесности.
- source_word: δεόμενοι
  choice: молясь
  rationale: Причастие обозначает настойчивую молитвенную просьбу; интенсивность выражена наречием «горячо».
- source_word: εἰς τὸ ἰδεῖν
  choice: о том, чтобы увидеть
  rationale: Конструкция с артиклевым инфинитивом выражает направленность молитвы или её цель; русский оборот естественно связывает её с глаголом «молясь».
- source_word: ὑμῶν τὸ πρόσωπον
  choice: вас лицом к лицу
  rationale: Буквально говорится об «увидеть ваше лицо», то есть о личной встрече; русский идиоматический оборот сохраняет конкретный и relational смысл.
- source_word: καταρτίσαι
  choice: восполнить
  rationale: Глагол может означать привести в надлежащее состояние, исправить, дополнить или завершить. В сочетании с «недостаёт» слово «восполнить» точно и естественно передаёт смысл.
- source_word: τὰ ὑστερήματα
  choice: то, чего недостаёт
  rationale: Форма множественного числа обозначает недостатки или недостающее; собирательный русский оборот звучит естественно и не придаёт фразе излишне осуждающего оттенка.
- source_word: τῆς πίστεως ὑμῶν
  choice: вашей вере
  rationale: Родительный падеж указывает на то, что нуждается в восполнении; дательный после «недостаёт» — естественная русская конструкция. πίστις здесь передано как «вера».
theological_decisions:
- issue: Значение πίστις
  choice: вера
  alternative: верность; доверие
  rationale: В контексте речь идёт о вере фессалоникийцев, которая уже существует, но ещё нуждается в укреплении или доведении до полноты. «Верность» сместила бы акцент преимущественно на поведение.
- issue: Характер недостатка в вере
  choice: то, чего недостаёт вашей вере
  alternative: недостатки вашей веры; то, что ещё нужно укрепить в вашей вере
  rationale: Формулировка сохраняет прямой смысл τὰ ὑστερήματα, не предполагая отсутствия веры и не решая однозначно, идёт ли речь о знании, зрелости, укреплении или завершении.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранена форма зависимого причастного оборота, поскольку стих синтаксически продолжает предыдущую мысль. «Увидеть вас лицом к лицу» естественно передаёт семитизированное «увидеть ваше лицо», а сноска сохраняет широту значений καταρτίσαι и τὰ ὑστερήματα.
