  text: καὶ γὰρ ὅτε πρὸς ὑμᾶς ἦμεν, προελέγομεν ὑμῖν ὅτι μέλλομεν θλίβεσθαι, καθὼς καὶ ἐγένετο καὶ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/004.yaml
  text: For even when we were with you[a], we kept telling you beforehand that we were going to suffer affliction, just as it also happened, and you know it.
translation:
  language: ru
  text: Ведь ещё тогда, когда мы были у вас, мы заранее говорили вам, что нам предстоит терпеть скорби[a], как и случилось, — и вы это знаете.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подвергаться притеснениям». Греческий глагол может означать испытывать давление, бедствия или преследования.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Ведь ещё
  rationale: «Ведь» передаёт пояснительную силу γάρ, а «ещё» естественно выражает усилительное καί в сочетании с придаточным времени.
- source_word: ὅτε πρὸς ὑμᾶς ἦμεν
  choice: когда мы были у вас
  rationale: Оборот означает пребывание вместе с адресатами; «были у вас» естественно указывает на присутствие Павла и его спутников среди фессалоникийцев.
- source_word: προελέγομεν ὑμῖν
  choice: мы не раз заранее говорили вам
  rationale: Имперфект передаёт повторявшееся или продолжавшееся действие, а προλέγω — сообщение заранее. «Не раз» делает этот видовой оттенок понятным без тяжеловесности.
- source_word: ὅτι μέλλομεν θλίβεσθαι
  choice: что нам предстоит терпеть скорби
  rationale: μέλλομεν выражает предстоящее, ожидаемое событие; страдательный инфинитив θλίβεσθαι передан естественным русским оборотом, не сужающим значение до одного вида преследований.
- source_word: καθὼς καὶ ἐγένετο
  choice: Так и случилось
  rationale: Краткий русский оборот точно передаёт соответствие между прежними словами и последовавшими событиями, включая усилительный оттенок καί.
- source_word: καὶ οἴδατε
  choice: и вы это знаете
  rationale: Местоимение «это» естественно восполняет подразумеваемый объект знания — то, что предсказанное действительно произошло.
theological_decisions:
- issue: Характер страданий, обозначенных θλίβεσθαι
  choice: «терпеть скорби» — общее обозначение тягот, давления и страданий, способное включать преследование
  alternative: «подвергнуться преследованиям» или «терпеть бедствие»
  rationale: Контекст допускает враждебное преследование, однако сам глагол имеет более широкий диапазон. Перевод не превращает его ни в исключительно технический эсхатологический термин, ни в указание только на преследование.
translation_notes:
  register: Современный литературный русский язык; ясный и достойный регистр. «Не раз заранее говорили» передаёт повторность имперфекта, а «Так и случилось» сохраняет естественность при точной передаче исполнения сказанного.
