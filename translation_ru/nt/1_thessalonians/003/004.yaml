    rationale: Имперфект обозначает продолжающееся или повторяемое говорение, но сам по себе не обязательно утверждает несколько отдельных высказываний. Русский несовершенный вид «говорили» сохраняет оттенок без этой конкретизации.
  - severity: low
    issue: «Так и случилось» ослабляет формальное соответствие καθώς καὶ ἐγένετο.
    rationale: 'Оборот естественен, но «как и случилось» точнее сохраняет сравнительно-соотносительную связь: предсказанное произошло так, как было сказано.'
  - severity: low
