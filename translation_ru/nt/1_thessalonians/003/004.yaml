  source_fidelity: 'Смысл передан верно: γάρ имеет пояснительную силу, προελέγομεν отражено несовершенным видом, μέλλομεν — словом «предстоит», а θλίβεσθαι не сужено до одних преследований. Однако «не раз» несколько сильнее, чем требуется имперфектом, а «Так и случилось» менее явно передаёт καθώς («как»).'
  naturalness: Текст в целом естественен для современного литературного русского. Оборот «Ведь ещё тогда, когда…» звучит плавнее и точнее связывает временное обстоятельство с усилительным καί. «Как и случилось» ясно выражает исполнение ранее сказанного.
  terminology: «Терпеть скорби» сохраняет широкий смысл θλίβεσθαι и уместный библейский регистр без искусственной технической окраски. Сноску следует сформулировать так, чтобы она описывала значение глагола как переживание бедствий или давления, а не называла сами эти явления значением слова.
