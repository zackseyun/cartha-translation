  text: διὰ τοῦτο παρεκλήθημεν, ἀδελφοί, ἐφ’ ὑμῖν ἐπὶ πάσῃ τῇ ⸂ἀνάγκῃ καὶ θλίψει⸃ ἡμῶν διὰ τῆς ὑμῶν πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/007.yaml
  text: For this reason[a], brothers, concerning you, in all our distress and affliction[b], we were comforted through your faith.
translation:
  language: ru
  text: Поэтому, братья[a], при всех наших тяготах и скорбях мы получили утешение относительно вас благодаря вашей вере[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Братья» — обычное обращение Павла к общине; оно могло относиться ко всем верующим, включая женщин.
    reason: cultural_note
  - marker: b
    text: 'Или: «верности». Греческое слово πίστις может означать веру, доверие или верность; здесь оно, вероятно, включает стойкость фессалоникийцев в вере.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь с предшествующим сообщением Тимофея естественным современным русским выражением.
- source_word: παρεκλήθημεν
  choice: мы утешились
  rationale: В данном контексте пассивная форма παρακαλέω указывает на обретённое утешение и облегчение среди испытаний.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет грамматическую форму греческого обращения; его обычное для Павла собирательное употребление поясняется в сноске.
- source_word: ἐφ’ ὑμῖν
  choice: за вас
  rationale: Естественно по-русски обозначает, что утешение касалось состояния фессалоникийцев, не представляя их причиной тягот Павла.
- source_word: ἐπὶ πάσῃ τῇ ἀνάγκῃ καὶ θλίψει ἡμῶν
  choice: при всех наших тяготах и скорбях
  rationale: Передаёт обстоятельства, среди которых было получено утешение. Число согласовано с естественным русским употреблением, при этом сохранены оба близких по смыслу обозначения страдания.
- source_word: ἀνάγκῃ
  choice: тяготах
  rationale: Здесь ἀνάγκη означает тяжёлые, стеснённые обстоятельства, а не отвлечённую необходимость; «тяготы» ясно выражает этот смысл.
- source_word: θλίψει
  choice: скорбях
  rationale: Передаёт тяжесть страдания и притеснения без архаичного оттенка слова «скорбь» в современном литературном и библейском регистре.
- source_word: διὰ τῆς ὑμῶν πίστεως
  choice: благодаря вашей вере
  rationale: Передаёт веру фессалоникийцев как средство или основание утешения; «благодаря» звучит естественно, не устраняя инструментально-причинный оттенок διά с родительным падежом.
- source_word: πίστεως
  choice: вере
  rationale: Основное значение πίστις здесь — вера и доверие Богу, однако контекст допускает оттенок стойкости или верности, сохранённый в сноске.
theological_decisions:
- issue: Значение πίστις в контексте стойкости фессалоникийцев
  choice: вера
  alternative: верность; стойкость в вере
  rationale: Главный текст сохраняет обычное значение «вера», не сводя слово только к нравственной верности; возможный контекстуальный оттенок постоянства отмечен в сноске.
- issue: Охват обращения ἀδελφοί
  choice: братья
  alternative: братья и сёстры
  rationale: Сохранена мужская форма исходного обращения, а возможное обращение ко всей общине, включая женщин, пояснено без расширения основного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского послания. Формулировка «утешились за вас» естественно передаёт направленность утешения на положение адресатов; пара «тяготы и скорби» сохраняет два греческих существительных без излишней архаизации.
