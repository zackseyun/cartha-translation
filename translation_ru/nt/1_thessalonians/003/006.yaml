id: 1TH.3.6
reference: 1 Thessalonians 3:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἄρτι δὲ ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν καὶ εὐαγγελισαμένου ἡμῖν τὴν πίστιν καὶ τὴν ἀγάπην ὑμῶν, καὶ ὅτι ἔχετε μνείαν ἡμῶν ἀγαθὴν πάντοτε ἐπιποθοῦντες ἡμᾶς ἰδεῖν καθάπερ καὶ ἡμεῖς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/006.yaml
  text: But now that Timothy has come to us from you and has brought us the good news of your faith and love[a], and that you always have a good remembrance of us, longing to see us just as we also long to see you,
translation:
  language: ru
  text: Но теперь Тимофей пришёл к нам от вас и принёс нам добрую весть о вашей вере[a] и любви, а также о том, что вы всегда по-доброму вспоминаете нас и жаждете увидеть нас, как и мы — вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верности». Греческое слово πίστις может означать веру, доверие или верность.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄρτι δὲ
  choice: Но теперь
  rationale: Передаёт переход и мягкое противопоставление прежней тревоге Павла; современно и естественно по-русски.
- source_word: ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν
  choice: Тимофей пришёл к нам от вас
  rationale: Генитив абсолютный естественно передан личной глагольной конструкцией; контекст указывает на недавнее прибытие.
- source_word: εὐαγγελισαμένου ἡμῖν
  choice: принёс нам добрую весть
  rationale: В данном контексте речь идёт о радостном сообщении Тимофея, при этом сохраняется связь глагола с языком благой вести.
- source_word: τὴν πίστιν καὶ τὴν ἀγάπην ὑμῶν
  choice: о вашей вере и любви
  rationale: Обычный и контекстуально уместный перевод; возможный оттенок верности для πίστις отмечен в сноске.
- source_word: μνείαν ἡμῶν ἀγαθὴν
  choice: по-доброму вспоминаете нас
  rationale: Передаёт положительный характер воспоминания естественнее, чем буквальное «имеете доброе воспоминание о нас».
- source_word: ἐπιποθοῦντες ἡμᾶς ἰδεῖν
  choice: жаждете увидеть нас
  rationale: Сохраняет сильное, сердечное желание, выраженное ἐπιποθέω.
- source_word: καθάπερ καὶ ἡμεῖς ὑμᾶς
  choice: как и мы — вас
  rationale: Эллиптическая русская конструкция точно воспроизводит взаимность и подразумеваемое «жаждем увидеть» без тяжеловесного повтора.
theological_decisions:
- issue: 'Значение πίστις: вера или верность'
  choice: вашей вере
  alternative: вашей верности
  rationale: В контексте, вероятнее всего, имеется в виду сохраняющаяся вера фессалоникийцев, однако слово допускает оттенок верности; неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и эмоциональной теплотой. Синтаксис сделан естественным для широкого читателя; взаимное стремление увидеться передано лаконичной эллиптической конструкцией.
