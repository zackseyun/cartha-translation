  text: Αὐτὸς δὲ ὁ θεὸς καὶ πατὴρ ἡμῶν καὶ ὁ κύριος ἡμῶν ⸀Ἰησοῦς κατευθύναι τὴν ὁδὸν ἡμῶν πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/011.yaml
  text: May our God and Father himself[a], and our Lord Jesus[b], direct our way to you.
translation:
  language: ru
  text: Сам же Бог и Отец наш и Господь наш Иисус[a] да направит наш путь к вам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте при соединённых подлежащих «Бог и Отец наш» и «Господь наш Иисус» употреблён глагол в единственном числе: «да направит».'
    reason: cross_reference
  - marker: b
    text: 'Или: «да выпрямит наш путь к вам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: Сам
  rationale: Интенсивное αὐτός подчёркивает, что сам Бог лично должен совершить просимое; русское «Сам» естественно сохраняет это ударение.
- source_word: δὲ
  choice: же
  rationale: δέ обозначает мягкий переход к молитвенному пожеланию, а не резкое противопоставление; постпозитивное «же» естественно передаёт эту связь.
- source_word: ὁ θεὸς καὶ πατὴρ ἡμῶν
  choice: Бог и Отец наш
  rationale: Оба наименования относятся к одному Лицу; сохранены состав и порядок греческого выражения в естественной для возвышенной русской речи форме.
- source_word: ὁ κύριος ἡμῶν Ἰησοῦς
  choice: Господь наш Иисус
  rationale: Переданы титул κύριος, имя Ἰησοῦς и притяжательное ἡμῶν без добавления отсутствующего в данном стихе титула «Христос».
- source_word: κατευθύναι
  choice: да направит
  rationale: Аорист оптатива выражает молитвенное пожелание. Конструкция «да направит» ясно и достойно передаёт его, сохраняя единственное число греческого глагола.
- source_word: τὴν ὁδὸν ἡμῶν
  choice: наш путь
  rationale: ὁδός допускает буквальный и переносный оттенки; в контексте речь о возможности прийти к фессалоникийцам, а «наш путь» сохраняет оба оттенка.
- source_word: πρὸς ὑμᾶς
  choice: к вам
  rationale: πρός с винительным обозначает направление движения; «к вам» естественно передаёт направленность к адресатам.
theological_decisions:
- issue: Глагол в единственном числе при двух соединённых подлежащих — Боге Отце и Господе Иисусе
  choice: 'Сохранены оба подлежащих и единое сказуемое в единственном числе: «Бог и Отец наш и Господь наш Иисус… да направит».'
  alternative: Перестроить фразу с глаголом во множественном числе либо отнести действие только к Богу Отцу.
  rationale: Греческий текст ставит Отца и Господа Иисуса рядом как подлежащие одного глагола в единственном числе. Русский перевод сохраняет эту примечательную грамматико-богословскую напряжённость, не разъясняя её сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной молитвенной конструкцией «да направит». Порядок слов сохраняет акцент на «Сам» и позволяет явно передать единственное число сказуемого, не делая фразу искусственно архаичной.
