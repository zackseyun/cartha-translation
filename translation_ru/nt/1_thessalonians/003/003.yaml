  text: τὸ μηδένα σαίνεσθαι ἐν ταῖς θλίψεσιν ταύταις. αὐτοὶ γὰρ οἴδατε ὅτι εἰς τοῦτο κείμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/003.yaml
  text: so that no one would be shaken by these afflictions[c][b][a]. For you yourselves know that we are appointed for this.
translation:
  language: ru
  text: чтобы никто не поколебался[a] из-за этих скорбей[b]. Ведь вы сами знаете, что мы к этому предназначены[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не был потревожен», «не утратил стойкости». Редкий глагол в иных контекстах может также означать «быть обманутым» или «поддаться лести».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «бедствий», «притеснений».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «нам это назначено»; «таков наш удел».'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ μηδένα σαίνεσθαι
  choice: чтобы никто не поколебался
  rationale: Артиклевый инфинитив продолжает мысль предыдущего стиха и выражает цель или результат. Редкий глагол σαίνεσθαι в данном контексте естественно передаёт утрату стойкости под давлением страданий; «не поколебался» звучит современно и сохраняет образную силу, не исключая отмеченных в сноске иных оттенков.
- source_word: ἐν ταῖς θλίψεσιν ταύταις
  choice: из-за этих скорбей
  rationale: Предлог ἐν буквально может означать «в», но при глаголе «поколебаться» русское «из-за» естественно выражает обстоятельство или причину. «Скорби» сохраняет серьёзность θλίψεις и привычно в новозаветном контексте, оставаясь понятным современному читателю.
- source_word: αὐτοὶ
  choice: вы сами
  rationale: Сохраняет эмфатический характер местоимения.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительно-обосновывающую функцию γάρ и естественно связывает предложение с предыдущим.
- source_word: οἴδατε
  choice: знаете
  rationale: Форма οἶδα имеет настоящее значение; «знаете» является прямым и естественным соответствием.
- source_word: εἰς τοῦτο
  choice: к этому
  rationale: Указание относится к только что названным скорбям. Краткая передача не уточняет сверх текста, идёт ли речь о цели, уделе или назначении.
- source_word: κείμεθα
  choice: мы предназначены
  rationale: κεῖμαι буквально означает «лежать, находиться, быть положенным», а в данной конструкции — быть назначенным или предназначенным. «Предназначены» сохраняет пассивность и вес высказывания, не называя прямо действующее лицо.
theological_decisions:
- issue: Отношение верующих к страданиям в выражении εἰς τοῦτο κείμεθα
  choice: мы к этому предназначены
  alternative: нам это назначено; таков наш удел
  rationale: Перевод сохраняет мысль о том, что скорби не являются неожиданностью для верующих и входят в их назначенный путь, но не уточняет механизм или объём предопределения и не вводит конфессиональную трактовку.
translation_notes:
  register: Современный литературный русский с достоинством новозаветного наставления. Начальное «чтобы» намеренно сохраняет синтаксическую связь с предыдущим стихом. Порядок сносок приведён в соответствие с теми словами, которые они поясняют.
