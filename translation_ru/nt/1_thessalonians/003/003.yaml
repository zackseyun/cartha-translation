  source_fidelity: Текст точно передаёт синтаксическую зависимость артиклевого инфинитива через начальное «чтобы», отрицание μηδένα, пастырский смысл σαίνεσθαι как утраты устойчивости под давлением скорбей, эмфазу αὐτοὶ, пояснительное γάρ и значение κείμεθα как назначенного удела. «Из-за этих скорбей» является естественной русской передачей ἐν ταῖς θλίψεσιν ταύταις в сочетании с «поколебаться»; оно не искажает контекстуальную связь.
