lexical_decisions:
- source_word: παράκλησις
  choice: призыв
  rationale: В данном контексте слово обозначает обращённое к слушателям настойчивое увещание или воззвание; «призыв» естественен по-русски и не сужает смысл до утешения.
- source_word: πλάνης
  choice: заблуждения
  rationale: При ἐκ слово указывает на источник призыва. «Заблуждение» сохраняет возможный смысл ошибочности или ложности, не отождествляя его с намеренным обманом, выраженным далее словом δόλος.
- source_word: ἀκαθαρσίας
  choice: нечистоты
  rationale: «Нечистота» сохраняет широкий нравственный смысл греческого слова; возможный сексуальный оттенок не конкретизируется, поскольку сам стих этого не делает.
- source_word: δόλῳ
  choice: лукавства
  rationale: Слово обозначает намеренную хитрость и обман. «Лукавство» передаёт это значение в естественном и достойном русском регистре.
- source_word: ἐκ ... ἐξ ... ἐν
  choice: исходит не из ... или ..., и в нём нет ...
  rationale: 'Различие предлогов отражено: ἐκ/ἐξ обозначают источник, а ἐν — способ или сферу действия. Такая формулировка естественна по-русски и не превращает все три члена в полностью одинаковую конструкцию.'
- source_word: γὰρ
  choice: Ведь
  rationale: «Ведь» естественно связывает объяснение с предшествующим утверждением и передаёт пояснительную функцию γάρ.
theological_decisions:
- issue: Объём значения ἀκαθαρσία
  choice: Сохранить широкое «нечистота» без уточнения вида нравственного проступка.
  alternative: «половая распущенность» или «нравственная нечистота»
  rationale: Хотя слово может иметь сексуальный оттенок, греческий текст здесь его не уточняет; широкая передача не вносит в стих более узкого обвинения.
- issue: Соотношение πλάνη и δόλος
  choice: Различить «заблуждение» и намеренное «лукавство».
  alternative: Передать оба слова через лексику обмана.
  rationale: Так сохраняется смысловое напряжение между ложностью или ошибочностью источника и сознательной хитростью в способе действия.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Пояснительная связь γάρ передана словом «ведь», а различие между источником (ἐκ/ἐξ) и способом или сферой (ἐν) сохранено синтаксически.
