  text: παρακαλοῦντες ὑμᾶς καὶ παραμυθούμενοι καὶ μαρτυρόμενοι, εἰς τὸ ⸀περιπατεῖν ὑμᾶς ἀξίως τοῦ θεοῦ τοῦ καλοῦντος ὑμᾶς εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/012.yaml
  text: encouraging[a], comforting, and urging you to walk worthily of God[c][b], who calls you into his own kingdom and glory.
translation:
  language: ru
  text: ободряя, утешая и настойчиво призывая вас[a] жить достойно Бога[b], который призывает вас в своё Царство и славу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «увещевая, утешая и торжественно убеждая вас». Три греческих причастия описывают взаимосвязанные стороны отцовского служения Павла: ободрение, утешение и настойчивый призыв.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ходить достойно Бога». «Ходить» — библейская метафора образа жизни и поведения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦντες
  choice: ободряя
  rationale: В данном отцовском и пастырском контексте глагол обозначает ободрение и увещание. «Ободряя» естественно звучит по-русски и не придаёт обращению излишне сурового оттенка.
- source_word: παραμυθούμενοι
  choice: утешая
  rationale: Глагол передаёт утешительную, ободряющую речь. «Утешая» сохраняет оттенок, отличный от παρακαλοῦντες, и образует ясный ряд из трёх действий.
- source_word: μαρτυρόμενοι
  choice: настойчиво призывая
  rationale: В этом контексте форма выражает торжественное, настойчивое заверение или призыв. Такой перевод передаёт силу выражения понятнее, чем буквальное «свидетельствуя».
- source_word: εἰς τὸ περιπατεῖν ὑμᾶς
  choice: вас жить
  rationale: Конструкция с εἰς и артиклевым инфинитивом выражает цель или ожидаемый результат. Русское «жить» естественно передаёт этическую метафору хождения; буквальный образ отмечен в сноске.
- source_word: ἀξίως τοῦ θεοῦ
  choice: достойно Бога
  rationale: Наречие с родительным падежом прямо обозначает образ жизни, соответствующий Богу и Его призванию, без добавления невыраженных отношений.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: который призывает вас
  rationale: Настоящее причастие передано настоящим временем, что сохраняет аспект греческого текста и не ограничивает призвание исключительно прошлым событием.
- source_word: εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν
  choice: в своё Царство и славу
  rationale: «Своё» сохраняет возвратно-усилительное ἑαυτοῦ, а единый предлог относится и к Царству, и к славе. Оба понятия оставлены равноправными, без пояснительного расширения.
theological_decisions:
- issue: Следует ли сохранять метафору περιπατεῖν в основном тексте
  choice: Передать смысл естественным русским «жить», а буквальный образ указать в сноске
  alternative: «ходить достойно Бога» или «поступать достойно Бога»
  rationale: В современном русском «ходить достойно Бога» звучит неестественно и может восприниматься буквально. «Жить» ясно передаёт библейскую этическую метафору, не устраняя её из справочного аппарата.
- issue: Временная и богословская сила τοῦ καλοῦντος
  choice: «который призывает вас»
  alternative: «который призвал вас» или «который сейчас призывает вас»
  rationale: Настоящее время наиболее непосредственно отражает греческое причастие, не навязывая определённого учения о моменте или механизме Божьего призвания.
- issue: Соотношение Царства и славы
  choice: 'Сохранить два однородных дополнения: «в своё Царство и славу»'
  alternative: Истолковать как единое понятие либо добавить пояснение об участии в них
  rationale: Греческий текст соединяет βασιλείαν и δόξαν одним предлогом и союзом, но не разъясняет точное соотношение понятий; перевод сохраняет эту сжатость и богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясным пастырским звучанием. Три однородных деепричастия сохраняют ритм исходного текста; одно общее «вас» избегает тяжеловесного повтора. Написание «Царство» с прописной буквы подчёркивает устойчивое обозначение Божьего Царства, тогда как местоимение «своё» оставлено со строчной по общим нормам современного русского текста.
