    rationale: Фраза «как каждого из вас, словно отец своих детей» не оформляет греческую эллиптичность понятным русским фрагментом и заменяет второе «как» на «словно». Лучше обозначить отсутствие глагола тире и прямо объяснить зависимость от контекста.
