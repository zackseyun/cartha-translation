  source_fidelity: 'Основной смысл передан верно: καθάπερ οἴδατε отражено как апелляция к знанию адресатов, ἕνα ἕκαστον ὑμῶν — распределительно, а образ отца и его собственных детей сохранён. Однако «вы и сами знаете» добавляет усиление, которого в οἴδατε нет; καθάπερ означает «как/подобно тому как», но не требует «и сами».'
  naturalness: «Обходились с каждым из вас» возможно, но в современном литературном русском может иметь оттенок обращения (в том числе грубого) и конструкция «как отец со своими детьми» оставляет сравнительное отношение неявным. «Относились к каждому из вас так, как отец относится к своим детям» ясно, естественно и остаётся широким по смыслу.
  terminology: «Отец», «дети» и «своими» точны и не несут конфессиональной интерпретации. В примечании следует дать осмысленно оформленный буквальный фрагмент, не приписывая греческому тексту отсутствующий глагол.
