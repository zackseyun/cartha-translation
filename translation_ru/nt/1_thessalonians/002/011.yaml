  text: как вы знаете[a], мы относились к каждому из вас так, как отец относится к своим детям,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Дословно: «как вы знаете: каждого из вас — как отец своих детей». Греческая фраза эллиптична: глагольное действие подразумевается из окружающего предложения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: как
  rationale: Передаёт сравнительную связь с предыдущим описанием поведения Павла и его спутников; в данном обороте простое «как» естественно для современного русского языка.
- source_word: οἴδατε
  choice: вы и сами знаете
  rationale: Форма οἶδα имеет настоящее значение «знаете». Частица «сами» естественно подчёркивает обращение к личному знанию фессалоникийцев, а «и» поддерживает усилительную силу καθάπερ.
- source_word: ὡς
  choice: как / каким образом
  rationale: Первое ὡς вводит содержание известного адресатам; в русском оно естественно выражено конструкцией всего предложения и отдельно не воспроизводится.
- source_word: ἕνα ἕκαστον ὑμῶν
  choice: с каждым из вас
  rationale: 'Сохраняет усиленное распределительное значение: речь идёт не только об общине в целом, но о каждом её члене.'
- source_word: ὡς
  choice: как
  rationale: Второе ὡς вводит сравнение с поведением отца.
- source_word: πατὴρ
  choice: отец
  rationale: Существительное употреблено без артикля в сравнительном, качественном значении; русский язык здесь естественно не требует неопределённого показателя.
- source_word: τέκνα
  choice: детьми
  rationale: τέκνα обозначает детей без ограничения по полу и сохраняет широкий семейный образ.
- source_word: ἑαυτοῦ
  choice: своими
  rationale: Возвратное местоимение подчёркивает, что речь идёт о собственных детях отца; русское «своими» точно и естественно передаёт эту связь.
- source_word: '[эллиптически подразумеваемое действие из контекста]'
  choice: мы обходились
  rationale: Греческая фраза синтаксически неполна и получает словесное наполнение из окружающего предложения. «Мы обходились» даёт необходимую русскую основу, сохраняя общий характер действия и не сводя его преждевременно к одному из действий, названных далее.
theological_decisions:
- issue: Восполнение подразумеваемого глагольного действия в эллиптической греческой фразе
  choice: Передать широким выражением «мы обходились с каждым из вас»
  alternative: 'Сохранить фрагментарность: «как вы знаете, как каждого из вас, словно отец своих детей»; либо конкретизировать: «увещевали каждого из вас»'
  rationale: Исходная фраза зависит от окружающего предложения и без восполнения звучит по-русски незавершённо. Общее «обходились» делает смысл понятным, но не выбирает одно конкретное пастырское действие вместо нескольких, перечисленных в продолжении.
translation_notes:
  register: Современный литературный русский язык с достойным, общепонятным библейским звучанием. Запятая в конце сохранена, поскольку стих представляет собой часть предложения, продолжающегося в следующем стихе.
