source:
  edition: SBLGNT
  text: ἀλλὰ προπαθόντες καὶ ὑβρισθέντες καθὼς οἴδατε ἐν Φιλίπποις ἐπαρρησιασάμεθα ἐν τῷ θεῷ ἡμῶν λαλῆσαι πρὸς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ ἐν πολλῷ ἀγῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/002.yaml
  text: But after we had already suffered and been shamefully mistreated[a], as you know, in Philippi[c][b], we were bold in our God to speak the gospel of God to you amid much conflict.
translation:
  language: ru
  text: Но, уже пострадав и подвергшись унизительному обращению[a], как вы знаете, в Филиппах, мы обрели в нашем Боге[b] смелость возвещать вам Божью благую весть среди тяжёлой борьбы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будучи оскорблены», «подвергшись надругательству» или «испытав бесчестное обращение». Греческий глагол подразумевает дерзкое, унижающее, возможно публично бесчестящее обращение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мы смело говорили в нашем Боге». Греческий глагол может включать значение смелой, открытой речи; перевод «обрели ... смелость возвещать» передаёт его вместе со следующим инфинитивом «возвещать».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в великой борьбе» или «при сильном противодействии».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт сильное противопоставление предшествующей мысли естественным русским союзом.
- source_word: προπαθόντες
  choice: хотя прежде мы уже пострадали
  rationale: Аористное причастие обозначает страдание, предшествовавшее основному действию; «прежде» передаёт значение приставки προ-, а уступительная конструкция естественно связывает его с последующей смелостью.
- source_word: ὑβρισθέντες
  choice: подверглись унизительному обращению
  rationale: Передаёт не только словесное оскорбление, но и дерзкое, бесчестящее обращение; сохраняет пассивную форму.
- source_word: καθὼς οἴδατε
  choice: как вы знаете
  rationale: Прямая и естественная передача обращения к известному читателям факту.
- source_word: ἐν Φιλίπποις
  choice: в Филиппах
  rationale: Нормативная русская форма названия города.
- source_word: ἐπαρρησιασάμεθα
  choice: мы обрели смелость
  rationale: Передаёт смелость и открытость речи, избегая избыточного повтора перед инфинитивом λαλῆσαι.
- source_word: ἐν τῷ θεῷ ἡμῶν
  choice: в нашем Боге
  rationale: Сохраняет широкое значение сферы или основания смелости и не сводит выражение только к инструментальному значению.
- source_word: λαλῆσαι πρὸς ὑμᾶς
  choice: говорить вам
  rationale: Естественно передаёт простой глагол речи и адресата.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: Божью благую весть
  rationale: Ясно передаёт содержание εὐαγγέλιον и естественную для русского языка принадлежность; родительный может указывать как на источник, так и на принадлежность, и перевод этого не сужает.
- source_word: ἐν πολλῷ ἀγῶνι
  choice: среди тяжёлой борьбы
  rationale: Передаёт обстановку напряжённой борьбы и противодействия, сохраняя образ ἀγών без сведения его исключительно к внешней оппозиции.
theological_decisions:
- issue: Значение ἐν τῷ θεῷ ἡμῶν
  choice: в нашем Боге
  alternative: благодаря нашему Богу; с упованием на нашего Бога
  rationale: Буквальная предложная конструкция сохраняет возможные оттенки сферы, основания и связи с Богом, не определяя Бога лишь как средство действия.
- issue: Значение родительного τοῦ θεοῦ при εὐαγγέλιον
  choice: Божью благую весть
  alternative: благую весть от Бога; благую весть о Боге
  rationale: Притяжательное прилагательное сохраняет широту греческого родительного и не ограничивает его только источником либо содержанием вести.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского увещания. Синтаксис сделан естественным для русского, при этом сохранены повтор «Бог» и богословски ёмкое выражение «в нашем Боге». Все примечания отмечены в основном тексте.
