source:
  edition: SBLGNT
  text: οὔτε ζητοῦντες ἐξ ἀνθρώπων δόξαν, οὔτε ἀφ’ ὑμῶν οὔτε ἀπ’ ἄλλων,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/006.yaml
  text: nor seeking glory from people[a], neither from you nor from others,
translation:
  language: ru
  text: и не искали славы у людей[a] — ни у вас, ни у других,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «почёта» или «похвалы» вместо «славы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: искали
  rationale: Причастие настоящего времени относится к подразумеваемому подлежащему из контекста и выражает продолжающуюся установку; по-русски в связном повествовании естественна личная форма «искали».
- source_word: ἐξ ἀνθρώπων
  choice: у людей
  rationale: ἄνθρωποι имеет здесь обобщённое значение без указания на пол; сочетание «искать славы у людей» естественно передаёт источник ожидаемого признания.
- source_word: δόξαν
  choice: славы
  rationale: «Слава» сохраняет обычное новозаветное соответствие δόξα, а контекст уточняет, что речь идёт о человеческом признании; возможны также «почёт» и «похвала».
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: и не ... — ни ... ни ...
  rationale: Начальное «и не» связывает фразу с предшествующим контекстом, а парное «ни… ни…» ясно передаёт два уточняющих источника человеческой славы.
- source_word: ἀφ’ ὑμῶν
  choice: у вас
  rationale: Прямое обращение во множественном числе к фессалоникийцам; предлог «у» согласован с русским оборотом «искать славы у кого-либо».
- source_word: ἀπ’ ἄλλων
  choice: у других
  rationale: Кратко и естественно обозначает прочих людей помимо адресатов, не добавляя отсутствующего в греческом уточнения.
theological_decisions:
- issue: Характер δόξα, которую могли искать
  choice: человеческая слава или признание, а не слава от Бога
  alternative: почёт или похвала со стороны людей
  rationale: Оборот ἐξ ἀνθρώπων прямо указывает на людей как источник славы; перевод сохраняет лексическую широту δόξα и не привносит противопоставление Божьей славе, которого в самой фразе нет.
translation_notes:
  register: Современный литературный русский язык; формулировка dignified и понятная. Тире помогает показать, что «ни у вас, ни у других» уточняет общее «у людей». Конечная запятая сохранена, поскольку стих представляет собой часть более длинного предложения.
