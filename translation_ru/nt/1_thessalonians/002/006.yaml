  source_fidelity: 'Текст точно передаёт οὔτε ζητοῦντες ἐξ ἀνθρώπων δόξαν, οὔτε ἀφ’ ὑμῶν οὔτε ἀπ’ ἄλλων: отрицание и зависимое от общего «у людей» уточнение «ни у вас, ни у других» сохранены. «Искали» уместно в синтаксисе русского контекста, хотя греческая форма является причастием настоящего времени.'
  naturalness: Фраза звучит естественно на современном литературном русском. Тире ясно обозначает, что последние два члена конкретизируют людей, от которых не искали признания. Конечная запятая оправдана продолжающимся предложением.
