  text: Μνημονεύετε γάρ, ἀδελφοί, τὸν κόπον ἡμῶν καὶ τὸν μόχθον· ⸀νυκτὸς καὶ ἡμέρας ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν ἐκηρύξαμεν εἰς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/009.yaml
  text: 'For you remember[a], brothers, our labor and hardship: working night and day so as not to burden any of you, we proclaimed to you the gospel of God.'
translation:
  language: ru
  text: 'Ведь вы помните, братья[a], наш труд и тяготы: работая ночью и днём, чтобы не обременить никого из вас, мы возвестили вам Божью благую весть.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «братья и сёстры»; по-гречески буквально «братья», но обращение может включать всю общину.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημονεύετε
  choice: вы помните
  rationale: Форма настоящего времени, изъявительного наклонения, второго лица множественного числа передаёт утверждение, а не повеление; Павел обращается к памяти фессалоникийцев.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет мужскую форму множественного числа греческого обращения; по контексту оно, вероятно, относится ко всей общине, что отмечено в сноске.
- source_word: τὸν κόπον ἡμῶν καὶ τὸν μόχθον
  choice: наш труд и изнурительную работу
  rationale: 'Передаёт близкие, но не полностью тождественные понятия: κόπος обозначает тяжёлый труд, а μόχθος подчёркивает его тягостный, изнуряющий характер.'
- source_word: νυκτὸς καὶ ἡμέρας
  choice: ночью и днём
  rationale: Естественное русское выражение, передающее продолжительность и напряжённость работы.
- source_word: ἐργαζόμενοι
  choice: трудясь
  rationale: Причастный оборот описывает сопутствующее действие и объясняет, каким образом благовестники избегали материально обременять общину.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν
  choice: чтобы не обременить никого из вас
  rationale: Конструкция выражает цель; глагол указывает на материальное или практическое бремя, которое Павел не хотел возлагать на адресатов.
- source_word: ἐκηρύξαμεν εἰς ὑμᾶς
  choice: мы возвещали вам
  rationale: «Возвещали» передаёт публичное провозглашение, а «вам» сохраняет направленность εἰς ὑμᾶς без неестественной буквальности.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: Божью Благую Весть
  rationale: Передаёт смысл εὐαγγέλιον современным и понятным выражением; притяжательное прилагательное естественно воспроизводит греческий родительный падеж, не уточняя, обозначает ли он источник, принадлежность или содержание.
theological_decisions:
- issue: Охват обращения ἀδελφοί
  choice: В основном тексте — «братья»
  alternative: «братья и сёстры»
  rationale: Греческое слово имеет форму мужского рода множественного числа, однако в данном контексте, вероятно, обращено ко всей общине. Основной текст сохраняет форму источника, а возможный включительный смысл указан в сноске.
- issue: Значение родительного оборота τοῦ θεοῦ
  choice: «Божью Благую Весть» без дальнейшего уточнения связи
  alternative: «Благую Весть от Бога»
  rationale: Родительный падеж допускает оттенки источника, принадлежности и содержания; перевод не должен без необходимости сводить эту связь только к происхождению вести.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис сохраняет причинную связь γάρ («ведь») и последовательность мысли оригинала; церковная терминология сведена к минимуму без потери богословского содержания.
