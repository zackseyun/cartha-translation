  source_fidelity: 'В целом смысл передан точно: Μνημονεύετε правильно понято как утверждение «вы помните», цель πρὸς τὸ μὴ ἐπιβαρῆσαι передана верно, а «никого из вас» соответствует τινα ὑμῶν. Однако «изнурительная работа» слишком близка к «труду» и стилистически утяжеляет пару κόπος / μόχθος; «труд и тяготы» яснее различает напряжённое служение и сопряжённые с ним лишения/тяготы. Для аориста ἐκηρύξαμεν предпочтительно совершенное «возвестили» в данном ретроспективном изложении.'
