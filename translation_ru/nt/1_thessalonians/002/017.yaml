  text: Ἡμεῖς δέ, ἀδελφοί, ἀπορφανισθέντες ἀφ’ ὑμῶν πρὸς καιρὸν ὥρας, προσώπῳ οὐ καρδίᾳ, περισσοτέρως ἐσπουδάσαμεν τὸ πρόσωπον ὑμῶν ἰδεῖν ἐν πολλῇ ἐπιθυμίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/017.yaml
  text: But we[a], brothers, having been torn away from you for a short time—in person, not in heart—were all the more eager, with great longing[b], to see your face.
translation:
  language: ru
  text: Мы же, братья[b], ненадолго оторванные от вас[a] — телом, но не сердцем, — с ещё большим рвением и горячим желанием старались увидеть вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «осиротевшие без вас»; греческое слово рисует яркий образ тяжёлой утраты и разлуки.'
    reason: lexical_alternative
  - marker: b
    text: «Братья» — форма обращения Павла; в данном контексте она, вероятно, относится ко всей общине верующих, включая женщин.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡμεῖς δέ
  choice: Мы же
  rationale: Сочетание сохраняет выраженное местоимение и мягкий контраст, обозначенный δέ, оставаясь естественным для русского повествования.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохранена грамматически мужская форма обращения. В апостольском употреблении она может относиться ко всей общине; это пояснено в сноске.
- source_word: ἀπορφανισθέντες ἀφ’ ὑμῶν
  choice: оторванные от вас
  rationale: Передаёт болезненную и невольную разлуку естественнее, чем буквальное «осиротевшие без вас»; яркий образ утраты отмечен в сноске.
- source_word: πρὸς καιρὸν ὥρας
  choice: ненадолго
  rationale: Греческое выражение обозначает краткий промежуток, а не буквальный час.
- source_word: προσώπῳ οὐ καρδίᾳ
  choice: телом, но не сердцем
  rationale: Естественно передаёт противопоставление физического отсутствия и сохраняющейся сердечной близости. «Телом» выражает контекстуальный смысл προσώπῳ, буквально «лицом».
- source_word: περισσοτέρως ἐσπουδάσαμεν
  choice: с ещё большим рвением ... старались
  rationale: Сохраняет и усилительную сравнительную форму, и оттенок усердного стремления, присущий σπουδάζω.
- source_word: τὸ πρόσωπον ὑμῶν ἰδεῖν
  choice: увидеть вас лицом к лицу
  rationale: Русская идиома естественно выражает личную встречу и сохраняет образ лица, хотя греческий текст буквально говорит «увидеть ваше лицо».
- source_word: ἐν πολλῇ ἐπιθυμίᾳ
  choice: с ... горячим желанием
  rationale: Передаёт сильное положительное стремление без возможного в современном русском нежелательного оттенка слова «вожделение».
theological_decisions:
- issue: Охват обращения ἀδελφοί
  choice: братья
  alternative: братья и сёстры
  rationale: Основной текст сохраняет мужскую форму греческого обращения, не исключая вероятного обращения ко всей общине; инклюзивный контекст разъяснён в сноске.
- issue: Образ утраты в ἀπορφανισθέντες
  choice: оторванные от вас
  alternative: осиротевшие без вас
  rationale: Выбран естественный русский оборот, передающий боль разлуки, а буквальный образ сиротства сохранён в сноске без навязывания особого богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достойным, но понятным синтаксисом. Тире сохраняют эмоционально значимое уточнение. Образы сердца и личной встречи сохранены, тогда как буквально необычный образ сиротства вынесен в сноску.
