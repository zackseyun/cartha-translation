  text: ὑμεῖς γάρ ἐστε ἡ δόξα ἡμῶν καὶ ἡ χαρά.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/020.yaml
  text: For you are our glory and joy[a].
translation:
  language: ru
  text: Ведь вы — наша слава и радость.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предмет гордости»; или: «честь» — вместо «слава».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: вы
  rationale: Явно выраженное местоимение второго лица множественного числа несёт смысловое ударение; в русском оно естественно сохраняется, а тире дополнительно подчёркивает именную часть сказуемого.
- source_word: γάρ
  choice: ведь
  rationale: Частица вводит обоснование предыдущего утверждения; «ведь» естественно и кратко передаёт пояснительно-причинную связь.
- source_word: ἐστε
  choice: —
  rationale: В настоящем времени русская нулевая связка естественно передаёт греческое ἐστε; тире оформляет и подчёркивает конструкцию «вы — наша слава и радость».
- source_word: δόξα
  choice: слава
  rationale: «Слава» прямо сохраняет основной смысл δόξα и его риторическую весомость, не сужая значение до хвастовства или субъективной гордости.
- source_word: ἡμῶν
  choice: наша
  rationale: Родительный падеж местоимения первого лица множественного числа естественно передан притяжательным местоимением, согласованным с существительными.
- source_word: χαρά
  choice: радость
  rationale: «Радость» — прямой и естественный эквивалент χαρά, обозначающий состояние или источник радости, а не действие.
theological_decisions:
- issue: Передача δόξα в личном высказывании Павла и его сотрудников
  choice: слава
  alternative: предмет гордости; честь
  rationale: '«Слава» сохраняет широту греческого слова и напряжение образного высказывания: фессалоникийцы названы славой и радостью служителей. Более пояснительные варианты сильнее истолковывают, в чём именно состоит эта слава.'
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и эмоционально выразительная фраза. Тире естественно передаёт русскую именную конструкцию и акцент на «вы».
