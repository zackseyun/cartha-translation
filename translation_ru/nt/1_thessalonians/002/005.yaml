  text: οὔτε γάρ ποτε ἐν λόγῳ κολακείας ἐγενήθημεν, καθὼς οἴδατε, οὔτε ⸀ἐν προφάσει πλεονεξίας, θεὸς μάρτυς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/005.yaml
  text: For we never came with flattering speech[a], as you know[b], nor with a pretext for greed—God is witness.
translation:
  language: ru
  text: Ведь мы никогда не прибегали к льстивым речам[a], как вы знаете, и не использовали предлог для корысти[b]. Бог свидетель.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не говорили льстивых слов»; буквально: «не были в слове лести».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не под прикрытием корысти» или «не с притворным предлогом ради наживы». Греческое выражение допускает оттенки предлога, притворства или прикрытия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γάρ ποτε
  choice: Ведь… мы никогда не… и не…
  rationale: «Ведь» передаёт пояснительную связь γάρ с предыдущим контекстом, а «никогда… и не…» естественно выражает усиленное отрицание οὔτε… ποτε… οὔτε в современном русском языке.
- source_word: ἐν λόγῳ κολακείας
  choice: прибегали к льстивым речам
  rationale: λόγος здесь обозначает речь, а не отдельное слово; κολακεία — лесть. Формулировка передаёт способ поведения и звучит естественно по-русски.
- source_word: ἐγενήθημεν
  choice: прибегали… прикрывали
  rationale: В данном контексте форма γίνομαι описывает то, какими апостолы проявили себя и как действовали. Единый греческий глагол передан двумя подходящими по смыслу русскими сказуемыми ради ясности и естественного синтаксиса.
- source_word: καθὼς οἴδατε
  choice: как вы знаете
  rationale: Сохраняется прямое обращение к собственному знанию фессалоникийцев как подтверждению поведения проповедников.
- source_word: ἐν προφάσει πλεονεξίας
  choice: не прикрывали корыстолюбие никаким предлогом
  rationale: πρόφασις может обозначать предлог, видимость или прикрытие, а πλεονεξία — стремление приобрести больше, корыстолюбие. Перевод сохраняет образ скрытого мотива и не сужает его исключительно до денежных злоупотреблений.
- source_word: θεὸς μάρτυς
  choice: Бог свидетель
  rationale: Краткая торжественная формула близко воспроизводит греческую конструкцию без добавления отсутствующего в тексте притяжательного местоимения.
theological_decisions:
- issue: Характер отрицаемых Павлом методов и мотивов
  choice: Стих отрицает лесть в речи и корыстолюбие, скрываемое предлогом.
  alternative: Понимать стих как осуждение всякой риторической выразительности либо только финансовой эксплуатации.
  rationale: В греческом тексте конкретно названы κολακεία и πλεονεξία. Перевод не превращает осуждение лести в запрет любой искусной речи и не ограничивает корыстолюбие только денежной выгодой.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной заключительной формулой. Перестановка «как вы знаете» делает длинное отрицательное построение естественным, не меняя его доказательной функции.
