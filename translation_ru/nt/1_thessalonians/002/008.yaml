  text: οὕτως ὁμειρόμενοι ὑμῶν εὐδοκοῦμεν μεταδοῦναι ὑμῖν οὐ μόνον τὸ εὐαγγέλιον τοῦ θεοῦ ἀλλὰ καὶ τὰς ἑαυτῶν ψυχάς, διότι ἀγαπητοὶ ἡμῖν ⸀ἐγενήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/008.yaml
  text: So[a], longing for you in this way, we were pleased to share with you not only the gospel of God but also our own lives[b], because you had become dear to us.
translation:
  language: ru
  text: Так, горячо любя вас[a], мы рады были поделиться с вами не только Божьей Благой вестью, но и самими собой[b], потому что вы стали нам дороги.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сильно тоскуя по вас», «нежно к вам привязанные». Греческое слово редко встречается и выражает глубокую любовь и сильное стремление быть рядом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «свои собственные души»; по смыслу также: «свои жизни». Речь идёт о личном и жертвенном самоотдании.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Так
  rationale: Кратко связывает стих с предшествующим образом заботливой кормилицы и передаёт обстоятельственное значение наречия.
- source_word: ὁμειρόμενοι ὑμῶν
  choice: горячо любя вас
  rationale: Редкий глагол выражает сильную нежную привязанность и томление; русское выражение естественно передаёт эмоциональную силу, не превращая причастие в явно причинную конструкцию.
- source_word: εὐδοκοῦμεν
  choice: мы рады были
  rationale: Передаёт охотное, радостное согласие и расположение, а не простое разрешение.
- source_word: μεταδοῦναι
  choice: передать вам
  rationale: Глагол означает дать другому долю в том, что принадлежит дающему; «передать» естественно сочетается и с Благой Вестью, и с личным самоотданием.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: Божью Благую Весть
  rationale: Передаёт родительный падеж естественной русской притяжательной конструкцией; «Благая Весть» остаётся понятным эквивалентом εὐαγγέλιον.
- source_word: τὰς ἑαυτῶν ψυχάς
  choice: самих себя
  rationale: В данном контексте ψυχαί обозначает их собственную жизнь и личность в целом; формулировка подчёркивает личное самоотдание и избегает ошибочно узкого противопоставления души телу.
- source_word: διότι
  choice: потому что
  rationale: Ясно вводит основание их самоотдачи.
- source_word: ἀγαπητοὶ ἡμῖν ἐγενήθητε
  choice: вы стали нам дороги
  rationale: Естественно передаёт возникшее состояние близости и любви без лишнего терминологического оттенка.
theological_decisions:
- issue: Смысл ψυχάς в описании апостольского самоотдания
  choice: «самих себя»
  alternative: «свои души» или «свои жизни»
  rationale: Контекст говорит не об устройстве человеческой природы, а о том, что служители делились не только вестью, но и всей своей жизнью и собой; перевод сохраняет эту целостность.
- issue: Характер ἀγαπητοί
  choice: «дороги нам»
  alternative: «возлюблены нами»
  rationale: Русская формулировка сохраняет личную теплоту и не привносит специального богословского значения, которого контекст здесь не требует.
- issue: Синтаксическая роль ὁμειρόμενοι
  choice: сохранено обстоятельственное причастное значение без явной причинной частицы
  alternative: «поскольку мы тосковали по вас»
  rationale: Греческая форма допускает смысловой оттенок причины, но прямо его не маркирует; перевод не устраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с тёплой, достойной интонацией. Синтаксис остаётся близким к греческому, но не звучит архаично; оба маркера сносок присутствуют в основном тексте.
