id: 1TH.2.18
reference: 1 Thessalonians 2:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀διότι ἠθελήσαμεν ἐλθεῖν πρὸς ὑμᾶς, ἐγὼ μὲν Παῦλος καὶ ἅπαξ καὶ δίς, καὶ ἐνέκοψεν ἡμᾶς ὁ Σατανᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/018.yaml
  text: Because we wanted to come to you—I[a], Paul, again and again—but Satan hindered us.
translation:
  language: ru
  text: Потому что мы хотели прийти к вам — я, Павел, и раз, и другой,[a] — но сатана помешал нам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и однажды, и дважды»; то есть неоднократно, больше одного раза.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Потому что
  rationale: Передаёт причинно-пояснительную связь с предшествующим высказыванием, не превращая её в вывод.
- source_word: ἠθελήσαμεν
  choice: мы хотели
  rationale: Естественно передаёт волю и желание, выраженные глаголом θέλω.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: прийти к вам
  rationale: Сохраняет образ движения к адресатам, не добавляя прямо не выраженных значений «навестить» или «вернуться».
- source_word: ἐγὼ μὲν Παῦλος
  choice: я, Павел
  rationale: Выделяет Павла из обозначенного ранее «мы» и естественно передаёт приложение; частица μέν не требует искусственного соответствия в русском.
- source_word: καὶ ἅπαξ καὶ δίς
  choice: и раз, и другой
  rationale: Передаёт буквально-идиоматический смысл «и однажды, и дважды», то есть неоднократные попытки, сохраняя образ оригинала в понятной русской форме.
- source_word: ἐνέκοψεν
  choice: помешал
  rationale: Выражает воспрепятствование и не усиливает смысл до абсолютной невозможности сверх значения ἐγκόπτω.
- source_word: ὁ Σατανᾶς
  choice: сатана
  rationale: Устоявшаяся русская передача личного наименования; личная действующая сила текста сохранена.
theological_decisions:
- issue: Действие сатаны как причина препятствия путешествию Павла
  choice: но сатана помешал нам
  alternative: но противник преградил нам путь
  rationale: Текст прямо называет сатану действующим лицом. Перевод сохраняет эту личную причинность, не сводя её к безличным обстоятельствам и не усиливая до абсолютного предопределения.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства апостольской речи. Тире выделяют уточнение, в котором Павел особо говорит о себе; строчная форма «сатана» соответствует обычной русской орфографической практике.
