id: 1TH.2.7
reference: 1 Thessalonians 2:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: δυνάμενοι ἐν βάρει εἶναι ὡς Χριστοῦ ἀπόστολοι· ἀλλὰ ἐγενήθημεν ⸀ἤπιοι ἐν μέσῳ ὑμῶν, ὡς ⸀ἐὰν τροφὸς θάλπῃ τὰ ἑαυτῆς τέκνα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/007.yaml
  text: though we could have been a burden as apostles of the Messiah[a], yet we became gentle among you[c][b], as a nursing mother cherishes her own children.
translation:
  language: ru
  text: Хотя как апостолы Мессии[b] мы могли бы пользоваться своим весом[a], мы, напротив, стали кроткими[d] среди вас, словно кормящая мать[c], которая с нежностью заботится о своих детях.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «быть в весе». Возможны также переводы: «быть в тягость», «предъявлять требования» или «пользоваться своим авторитетом».'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционный перевод: «апостолы Христа».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «кормилица»; речь идёт о нежной материнской заботе.'
    reason: lexical_alternative
  - marker: d
    text: 'В некоторых древних рукописях: «стали младенцами».'
    reason: textual_variant
lexical_decisions:
- source_word: δυνάμενοι
  choice: хотя… мы могли бы
  rationale: Причастие в сочетании с последующим ἀλλά имеет уступительный смысл; эта конструкция естественно передаёт его по-русски.
- source_word: ἐν βάρει εἶναι
  choice: пользоваться своим весом
  rationale: Русское выражение сохраняет греческий образ «веса» и допускает широкий смысл апостольского авторитета, требований и значимости, не сводя фразу только к материальному бремени.
- source_word: ὡς Χριστοῦ ἀπόστολοι
  choice: как апостолы Мессии
  rationale: Χριστός здесь выступает как титул; родительный падеж передан естественной русской конструкцией.
- source_word: ἀλλὰ ἐγενήθημεν
  choice: мы, напротив, стали
  rationale: «Стали» сохраняет динамическое значение ἐγενήθημεν, а «напротив» ясно выражает контраст.
- source_word: ἤπιοι
  choice: кроткими
  rationale: Слово обозначает мягкость и незлобивость в обращении; «кроткими» соответствует достоинству и тону контекста.
- source_word: ἐν μέσῳ ὑμῶν
  choice: среди вас
  rationale: Естественный современный эквивалент пространственно-социального выражения.
- source_word: ὡς ἐὰν τροφὸς
  choice: словно кормящая мать
  rationale: τροφός обозначает женщину, кормящую младенца и ухаживающую за ним; упоминание её собственных детей делает материнский образ особенно уместным.
- source_word: θάλπῃ
  choice: с нежностью заботится
  rationale: Глагол буквально связан с согреванием и переносно выражает тёплую, нежную заботу.
- source_word: τὰ ἑαυτῆς τέκνα
  choice: о своих детях
  rationale: Возвратное местоимение передаёт подчёркнутое «собственных», что по-русски естественно выражается словом «своих».
theological_decisions:
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: В этой формуле слово функционирует как титул; традиционный вариант указан в примечании без устранения различия.
- issue: Характер апостольского «веса»
  choice: пользоваться своим весом
  alternative: быть в тягость; предъявлять требования
  rationale: Выбранная формулировка сохраняет метафору и не решает однозначно, идёт ли речь о материальном бремени, требованиях или осуществлении апостольского авторитета.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского наставления. Синтаксис остаётся доступным, а материнский образ передан тепло и без клинического оттенка слова «медсестра».
