  source_fidelity: Греческое ὁσίως точнее передаётся как «благочестиво», поскольку обозначает благоговейную, обращённую к Богу сторону поведения. Дательный ὑμῖν τοῖς πιστεύουσιν допускает как реляционное «по отношению к вам», так и контекстуальное «среди вас»; основным выбран более естественный в русском контексте вариант, а альтернативное прочтение сохранено в сноске. «Вели себя» адекватно передаёт ἐγενήθημεν в сочетании с наречиями образа действия.
