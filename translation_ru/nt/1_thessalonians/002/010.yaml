  text: ὑμεῖς μάρτυρες καὶ ὁ θεός, ὡς ὁσίως καὶ δικαίως καὶ ἀμέμπτως ὑμῖν τοῖς πιστεύουσιν ἐγενήθημεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/010.yaml
  text: You are witnesses[a], and God also, how devoutly and righteously and blamelessly we behaved toward you who believe[b],
translation:
  language: ru
  text: Вы — свидетели, и Бог тоже, как благочестиво, праведно и безупречно мы вели себя среди вас, верующих[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по отношению к вам, верующим».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς μάρτυρες καὶ ὁ θεός
  choice: Вы свидетели, и Бог тоже
  rationale: Сохранено эмфатическое обращение сначала к фессалоникийцам, а затем обращение к Богу как свидетелю; связка естественно восполнена по-русски.
- source_word: ὡς
  choice: как
  rationale: Вводит характеристику образа поведения Павла и его спутников.
- source_word: ὁσίως
  choice: свято
  rationale: Передаёт благочестивый, обращённый к Богу аспект поведения; в данном ряду наречий звучит естественно и торжественно.
- source_word: δικαίως
  choice: праведно
  rationale: Передаёт нравственную правильность поведения, не сужая значение до юридической справедливости.
- source_word: ἀμέμπτως
  choice: безупречно
  rationale: Указывает на поведение, не дающее обоснованного повода для порицания, без утверждения абсолютной безгрешности.
- source_word: ὑμῖν
  choice: по отношению к вам
  rationale: Дательный обозначает людей, в отношении которых проявлялось описанное поведение; вариант «среди вас» также грамматически возможен.
- source_word: τοῖς πιστεύουσιν
  choice: верующим
  rationale: Субстантивированное причастие настоящего времени характеризует адресатов как верующих; русский причастный оборот сохраняет словесный оттенок.
- source_word: ἐγενήθημεν
  choice: мы вели себя
  rationale: В сочетании с наречиями образа действия γίνομαι идиоматически описывает поведение; буквальное «мы были» по-русски менее ясно.
theological_decisions:
- issue: Три этические характеристики апостольского поведения
  choice: Они описывают реальный образ жизни миссионеров перед Богом и верующими, не утверждая их абсолютной безгрешности.
  alternative: Понимать слова либо только как риторическую самозащиту, либо как заявление о нравственном совершенстве.
  rationale: Павел торжественно призывает человеческих и Божественного свидетелей своей безупречности в конкретных отношениях; текст не требует переносить это утверждение на метафизическую безгрешность.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Трёхчастный ряд «свято, праведно и безупречно» сохраняет ритм и смысловые различия греческих наречий; неоднозначность дательного ὑμῖν отмечена в сноске.
