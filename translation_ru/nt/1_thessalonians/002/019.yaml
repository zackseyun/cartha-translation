base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/019.yaml
  text: For what is our hope or joy or crown of boasting—is it not indeed you?—before our Lord Jesus at his coming[a].
translation:
  language: ru
  text: Ибо кто наша надежда, или радость, или венец, которым мы хвалимся, — разве не вы? — перед нашим Господом Иисусом при Его пришествии[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Его присутствии» или «при Его прибытии». Греческое слово παρουσία может означать «присутствие» или «прибытие»; в этом контексте оно относится к будущему пришествию Господа Иисуса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: кто
  rationale: Хотя местоимение может означать «кто» или «что», далее надежда, радость и венец отождествляются с людьми — фессалоникийскими верующими; поэтому русское «кто» звучит естественно и подготавливает ответ «вы».
- source_word: γὰρ
  choice: ибо
  rationale: Союз сохраняет пояснительную связь с предыдущей мыслью и соответствует достоинству литературного регистра.
- source_word: ἐλπίς
  choice: надежда
  rationale: Прямой и устойчивый русский эквивалент, передающий уверенное ожидание.
- source_word: χαρά
  choice: радость
  rationale: Естественный русский эквивалент, сохраняющий эмоциональную силу слова.
- source_word: στέφανος καυχήσεως
  choice: венец похвалы
  rationale: «Венец» передаёт образ почётной или победной награды, а «похвала» сохраняет смысл καύχησις как основания для хваления, не сводя его лишь к радости.
- source_word: οὐχὶ καὶ ὑμεῖς
  choice: разве не вы?
  rationale: Такая форма естественно передаёт риторический вопрос, предполагающий утвердительный ответ, и сохраняет его усилительный характер.
- source_word: ἔμπροσθεν
  choice: перед
  rationale: Кратко и естественно передаёт нахождение перед кем-либо, в его присутствии.
- source_word: κυρίου
  choice: Господом
  rationale: Стандартное новозаветное соответствие κύριος в христологическом употреблении.
- source_word: παρουσίᾳ
  choice: пришествии
  rationale: В данном эсхатологическом контексте слово указывает на будущее прибытие и присутствие Иисуса; «пришествие» ясно передаёт этот смысл в русском библейском употреблении, а более буквальные варианты указаны в сноске.
theological_decisions:
- issue: Передача παρουσίᾳ в эсхатологическом контексте
  choice: при Его пришествии
  alternative: в Его присутствии; при Его прибытии
  rationale: Контекст говорит о будущем явлении Господа Иисуса, поэтому «пришествие» наиболее ясно выражает эсхатологический смысл. При этом лексическая широта слова, включающая присутствие и прибытие, сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Повтор союза «или» и вставной риторический вопрос сохраняют напряжённую структуру греческой фразы, не устраняя её выразительность.
