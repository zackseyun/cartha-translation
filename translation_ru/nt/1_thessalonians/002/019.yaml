revisions:
- from: Ибо кто наша надежда, или радость, или венец похвалы — разве не вы? — перед нашим Господом Иисусом при Его пришествии[a]?
  to: Ибо кто наша надежда, или радость, или венец, которым мы хвалимся, — разве не вы? — перед нашим Господом Иисусом при Его пришествии[a]?
  rationale: Заменено «венец похвалы» на «венец, которым мы хвалимся», чтобы передать καυχήσεως как хваление, а не как похвалу, адресованную кому-либо. Остальная риторическая структура сохранена. Сноска отредактирована стилистически и продолжает фиксировать значимые лексические альтернативы παρουσία.
