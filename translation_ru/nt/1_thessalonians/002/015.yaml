  text: τῶν καὶ τὸν κύριον ἀποκτεινάντων Ἰησοῦν καὶ ⸀τοὺς προφήτας καὶ ἡμᾶς ἐκδιωξάντων, καὶ θεῷ μὴ ἀρεσκόντων, καὶ πᾶσιν ἀνθρώποις ἐναντίων,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/015.yaml
  text: who also killed the Lord Jesus and the prophets[a], and drove us out, and are not pleasing to God, and are hostile to all people[c][b],
translation:
  language: ru
  text: которые убили и Господа Иисуса, и пророков[a], и нас изгнали[b], и Богу не угождают, и враждебны ко всем людям[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «предали смерти Господа Иисуса и пророков».'
    reason: lexical_alternative
  - marker: b
    text: То есть «выгнали нас» или «выдворили нас»; этот глагол конкретнее, чем более общее «преследовали».
    reason: lexical_alternative
  - marker: c
    text: Грамматически эти слова продолжают описание группы, названной в предыдущем стихе; их не следует понимать как общее утверждение обо всех евреях во все времена и во всех местах.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκτεινάντων
  choice: убили
  rationale: Аористное действительное причастие означает «убить, предать смерти». «Убили» естественно и точно, не добавляя оттенка преднамеренного преступления, возможного в слове «умертвили» или «убили как преступники».
- source_word: κύριον Ἰησοῦν
  choice: Господа Иисуса
  rationale: κύριος передано традиционным и христологически уместным титулом «Господь»; имя Ἰησοῦς — в принятой русской форме «Иисус».
- source_word: τοὺς προφήτας
  choice: пророков
  rationale: Контекст указывает на известную линию Божьих пророков; в русском языке определённость не требует отдельного выражения.
- source_word: ἐκδιωξάντων
  choice: изгнали
  rationale: Глагол конкретно обозначает изгнание или выдворение и здесь точнее более общего «преследовали».
- source_word: θεῷ μὴ ἀρεσκόντων
  choice: Богу не угождают
  rationale: Настоящее причастие выражает продолжающуюся характеристику. «Не угождают Богу» — естественная русская передача значения «не быть угодным, не стараться нравиться».
- source_word: πᾶσιν ἀνθρώποις ἐναντίων
  choice: враждебны ко всем людям
  rationale: ἐναντίος передаёт противостояние или враждебность; выбранная формулировка естественна и сохраняет сильный риторический тон.
- source_word: τῶν ... ἀποκτεινάντων ... ἐκδιωξάντων ... ἀρεσκόντων ... ἐναντίων
  choice: которые убили ... изгнали ... не угождают ... враждебны
  rationale: Относительное предложение сохраняет связь цепочки причастий с группой, названной в предыдущем стихе, и звучит естественно по-русски.
- source_word: καὶ
  choice: и
  rationale: Повтор союза сохраняет накопительную риторическую силу греческой фразы.
theological_decisions:
- issue: К кому относится цепочка характеристик
  choice: Она продолжает описание группы, упомянутой в 2:14, без превращения слов Павла во вневременное осуждение всех евреев.
  alternative: Обобщённое осуждение всех евреев во все времена.
  rationale: Родительный артикль τῶν и следующие за ним причастия грамматически зависят от предшествующего контекста. Перевод «которые» сохраняет эту связь, а примечание предохраняет от необоснованного универсального прочтения.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясной синтаксической связью с предыдущим стихом. Сохранён повтор «и», передающий нарастающий риторический ряд оригинала; причастная цепочка преобразована в естественное русское относительное предложение.
