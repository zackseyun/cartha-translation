  text: ὑμεῖς γὰρ μιμηταὶ ἐγενήθητε, ἀδελφοί, τῶν ἐκκλησιῶν τοῦ θεοῦ τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ ἐν Χριστῷ Ἰησοῦ, ὅτι τὰ αὐτὰ ἐπάθετε καὶ ὑμεῖς ὑπὸ τῶν ἰδίων συμφυλετῶν καθὼς καὶ αὐτοὶ ὑπὸ τῶν Ἰουδαίων
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/014.yaml
  text: For you became imitators[a], brothers, of the churches of God that are in Judea in Messiah Jesus, because you also suffered the same things from your own countrymen[c][b], just as they did from the Jews.
translation:
  language: ru
  text: Ведь вы, братья, стали подражателями Божьих церквей, которые находятся в Иудее и пребывают в Мессии Иисусе[a], потому что и вы претерпели то же самое от своих соплеменников, что и они — от иудеев[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во Христе Иисусе». Греческое Χριστός означает «Мессия», то есть Помазанник.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «от жителей Иудеи». Греческое слово может обозначать как иудеев, так и жителей Иудеи; здесь речь идёт о конкретных гонителях, а не обо всех иудеях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μιμηταὶ ἐγενήθητε
  choice: стали подражателями
  rationale: Сохраняет как значение существительного μιμηταί («подражатели»), так и выраженную глаголом ἐγενήθητε перемену состояния («стали»).
- source_word: ἀδελφοί
  choice: братья
  rationale: Прямое обращение в форме мужского множественного числа; в контексте послания оно обращено ко всей общине.
- source_word: ἐκκλησιῶν τοῦ θεοῦ
  choice: Божьих церквей
  rationale: Естественное для современного русского языка обозначение христианских общин, сохраняющее принадлежность Богу.
- source_word: τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ
  choice: в Иудее, пребывающих
  rationale: Передаёт географическое определение и позволяет естественно связать с ним последующее ἐν Χριστῷ Ἰησοῦ, не смешивая два разных оборота с ἐν.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  rationale: Передаёт титульное значение Χριστός словом «Мессия» и сохраняет характерную для Павла формулу пребывания «в» Мессии.
- source_word: τὰ αὐτὰ ἐπάθετε
  choice: претерпели то же самое
  rationale: Естественно выражает перенесённые страдания и сохраняет прямое сопоставление с опытом иудейских церквей.
- source_word: τῶν ἰδίων συμφυλετῶν
  choice: своих соплеменников
  rationale: Слово «соплеменники» передаёт принадлежность к тому же народу или этническому сообществу, а «своих» отражает ἰδίων.
- source_word: τῶν Ἰουδαίων
  choice: иудеев
  rationale: Обычное русское обозначение этнорелигиозной группы в данном контексте; форма не добавляет мысли обо всех иудеях без исключения.
theological_decisions:
- issue: Передача Χριστῷ как титула или ставшей привычной части имени
  choice: в Мессии Иисусе
  alternative: во Христе Иисусе
  rationale: Χριστός сохраняет значение титула «Мессия»; основной текст передаёт его смысл, а традиционный русский вариант отмечен как допустимая альтернатива.
- issue: Объём значения τῶν Ἰουδαίων
  choice: от иудеев
  alternative: от жителей Иудеи
  rationale: В контексте имеются в виду конкретные гонители иудейских церквей, а не весь иудейский народ. Перевод не расширяет референт, а географическая возможность слова сохранена в примечании.
translation_notes:
  register: 'Современный литературный русский язык с достоинством апостольского послания. Синтаксис слегка выровнен ради ясности: два оборота с ἐν разведены как географическое «в Иудее» и богословское «в Мессии Иисусе». Слово «соплеменники» точнее, чем «соотечественники», поскольку συμφυλέται может указывать не только на гражданство, но и на общность народа.'
