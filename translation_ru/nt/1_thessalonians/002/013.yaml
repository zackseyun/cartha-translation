source:
  edition: SBLGNT
  text: ⸀Καὶ διὰ τοῦτο καὶ ἡμεῖς εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως, ὅτι παραλαβόντες λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ ἐδέξασθε οὐ λόγον ἀνθρώπων ἀλλὰ καθὼς ⸂ἀληθῶς ἐστὶν⸃ λόγον θεοῦ, ὃς καὶ ἐνεργεῖται ἐν ὑμῖν τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/013.yaml
  text: And because of this we also thank God continually[a], that when you received the word of God that you heard from us, you accepted it not as the word of men but, as it truly is, the word of God[c][b], which is also at work in you who believe.
translation:
  language: ru
  text: И по этой причине мы тоже непрестанно благодарим Бога за то, что вы, получив от нас слово Божье[a], приняли его не как человеческое слово, а как слово Божье — как оно и есть на самом деле, — которое также действует в вас, верующих[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «весть от Бога, которую вы услышали от нас». Греческое выражение сжато и допускает несколько естественных способов передать связь между «словом», «слышанием», нами и Богом.'
    reason: lexical_alternative
  - marker: c
    text: 'Относительное местоимение можно также отнести к Богу: «который также действует в вас, верующих».'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: поэтому
  rationale: Кратко и естественно передаёт связь с предшествующим контекстом; выражение допускает как причинный, так и итоговый оттенок.
- source_word: εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως
  choice: непрестанно благодарим Бога
  rationale: Сохраняет значение продолжающейся, регулярно повторяющейся благодарности и достойный современный регистр.
- source_word: λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ
  choice: услышанное от нас слово Божье
  rationale: Естественно разворачивает сжатую греческую конструкцию, сохраняя и источник слышания — «от нас», и характеристику вести как Божьего слова.
- source_word: παραλαβόντες ... ἐδέξασθε
  choice: приняв ... вы приняли его
  rationale: 'Повтор отражает два разных греческих глагола лишь частично, но в русском контексте остаётся ясным: сначала речь о получении услышанного, затем — о признании его истинного характера.'
- source_word: οὐ λόγον ἀνθρώπων
  choice: не как человеческое слово
  rationale: Передаёт качественный смысл родительного множественного числа без устаревающего или гендерно суженного «слово людей/мужей».
- source_word: ἀλλὰ καθὼς ἀληθῶς ἐστὶν λόγον θεοῦ
  choice: а как слово Божье — чем оно и является на самом деле
  rationale: Сохраняет противопоставление и подчёркнутое авторское утверждение, при этом звучит естественно по-русски.
- source_word: ὃς καὶ ἐνεργεῖται
  choice: Оно и действует
  rationale: Соотносит местоимение прежде всего со «словом» и передаёт продолжающееся действенное проявление без уточнения механизма действия.
- source_word: ἐν ὑμῖν τοῖς πιστεύουσιν
  choice: в вас, верующих
  rationale: Лаконично и естественно передаёт причастную конструкцию и характеристику адресатов как верующих.
theological_decisions:
- issue: К чему относится относительное местоимение ὃς
  choice: 'К «слову Божьему»: «Оно и действует в вас»'
  alternative: 'К Богу: «Он и действует в вас»'
  rationale: Местоимение мужского рода грамматически может соотноситься и с λόγος, и с θεός, однако ближайшим и наиболее естественным антецедентом является λόγος. Альтернатива сохранена в сноске.
- issue: Смысл выражения «слово Божье» применительно к проповеди апостолов
  choice: Сохранено прямое обозначение «слово Божье»
  alternative: «Божья весть» или «весть от Бога»
  rationale: Так сохраняется явное риторическое противопоставление человеческого и Божьего слова без расширения утверждения стиха до более общей доктринальной формулы.
translation_notes:
  register: Современный литературный русский язык, доступный широкой аудитории, с умеренно торжественным библейским звучанием. Форма «Божье» выбрана как современная и естественная; синтаксис слегка упрощён ради ясности, но повтор и богословское напряжение оригинала сохранены.
