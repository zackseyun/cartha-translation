base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/004.yaml
  text: But just as we have been approved by God to be entrusted with the gospel[a], so we speak—not as pleasing people, but God, who tests our hearts.
translation:
  language: ru
  text: Но как Бог одобрил нас, доверив нам Евангелие, так и мы говорим — не угождая людям, а Богу[a], Который испытывает наши сердца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более развёрнуто: «не для того, чтобы угождать людям, а чтобы угождать Богу». В греческом тексте мысль выражена сжато: слово «угождая» прямо стоит только в первой части противопоставления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδοκιμάσμεθα
  choice: Бог испытал и одобрил нас
  rationale: Перфект страдательного залога обозначает состоявшееся испытание с сохраняющимся результатом. Сочетание «испытал и одобрил» передаёт и процесс проверки, и её положительный итог, не вводя идеи собственной заслуженности.
- source_word: πιστευθῆναι τὸ εὐαγγέλιον
  choice: чтобы доверить нам Евангелие
  rationale: Страдательный инфинитив здесь означает, что Бог вверил апостолам Евангелие, а не то, что они поверили в него. Русская конструкция с активным субъектом «Бог» звучит естественно и сохраняет смысл порученного служения.
- source_word: τὸ εὐαγγέλιον
  choice: Евангелие
  rationale: Устоявшийся русский библейский термин сохраняет насыщенное павловское значение благой вести.
- source_word: οὕτως λαλοῦμεν
  choice: так мы и говорим
  rationale: 'Формулировка естественно передаёт соотношение καθὼς… οὕτως: Божье испытание и доверие определяют то, как апостолы говорят.'
- source_word: οὐχ ὡς ἀνθρώποις ἀρέσκοντες ἀλλὰ θεῷ
  choice: не угождая людям, а Богу
  rationale: Русский деепричастный оборот сохраняет сжатый контраст оригинала, где идея угождения выражена явно только в первой части, но подразумевается и во второй.
- source_word: τῷ δοκιμάζοντι
  choice: Который испытывает
  rationale: Настоящее причастие указывает на продолжающееся Божье исследование; «испытывает» также сохраняет лексическую связь с δοκιμάζω в начале стиха.
- source_word: τὰς καρδίας ἡμῶν
  choice: наши сердца
  rationale: «Сердца» сохраняет библейское антропологическое значение внутреннего человека и не сводит его только к мыслям или чувствам.
theological_decisions:
- issue: Сжатый контраст между угождением людям и угождением Богу
  choice: 'Сохранить эллипсис: «не угождая людям, а Богу»'
  alternative: «не для того, чтобы угождать людям, но чтобы угождать Богу»
  rationale: В греческом тексте причастие ἀρέσκοντες выражено только в первой части противопоставления, а во второй подразумевается. Русская формулировка сохраняет эту сжатость, не затемняя смысла и не добавляя конфессионального толкования.
- issue: Связь Божьего первоначального испытания с Его продолжающимся исследованием сердец
  choice: Передать оба употребления δοκιμάζω через однокоренное по смыслу «испытал» / «испытывает»
  alternative: «одобрил» / «исследует»
  rationale: 'Так сохраняется намеренный лексический повтор: Бог уже подверг посланников проверке и продолжает исследовать их сердца; при этом слово «одобрил» добавлено в первой части для передачи положительного результата перфекта.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Синтаксис сохраняет парную конструкцию «как… так…», а формулировка остаётся понятной без устранения эллипсиса оригинала.
