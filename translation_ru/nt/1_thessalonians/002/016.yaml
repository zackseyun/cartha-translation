source:
  edition: SBLGNT
  text: κωλυόντων ἡμᾶς τοῖς ἔθνεσιν λαλῆσαι ἵνα σωθῶσιν, εἰς τὸ ἀναπληρῶσαι αὐτῶν τὰς ἁμαρτίας πάντοτε. ἔφθασεν δὲ ἐπ’ αὐτοὺς ἡ ⸀ὀργὴ εἰς τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/016.yaml
  text: by hindering us from speaking to the Gentiles so that they may be saved[a], so as always to fill up the measure of their sins[b]. But wrath has come upon them at last.
translation:
  language: ru
  text: мешая нам говорить язычникам, чтобы те были спасены, и тем самым всегда доводя меру своих грехов до полноты. Но гнев[b] уже постиг их наконец.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «окончательно», «полностью» или «до конца»; греческое выражение εἰς τέλος может обозначать полноту действия, а не временное «наконец».'
    reason: lexical_alternative
  - marker: b
    text: Вероятно, имеется в виду Божий гнев, то есть суд; Павел здесь не уточняет, говорит ли он об уже наступившем историческом суде, о последнем суде или об обоих.
    reason: alternative_reading
lexical_decisions:
- source_word: κωλυόντων
  choice: мешая
  rationale: Причастие настоящего времени продолжает характеристику из предыдущего контекста и передаёт продолжающееся противодействие, не сужая значение до официального запрета.
- source_word: τοῖς ἔθνεσιν
  choice: язычникам
  rationale: В данном контексте речь идёт о неевреях, а не о государствах или народах как политических образованиях.
- source_word: λαλῆσαι
  choice: говорить
  rationale: Прямо передаёт инфинитив, зависящий от κωλυόντων; содержание речи определяется контекстом.
- source_word: ἵνα σωθῶσιν
  choice: чтобы они спаслись
  rationale: Сохраняет целевое значение ἵνα, пассивную направленность греческой формы и богословскую ёмкость глагола σῴζω.
- source_word: εἰς τὸ ἀναπληρῶσαι
  choice: и тем самым … доводя … до полноты
  rationale: Передаёт следствие поступков, не утверждая, будто сознательной целью противников было накопление грехов; при этом не устраняет возможный целевой оттенок конструкции.
- source_word: ἀναπληρῶσαι αὐτῶν τὰς ἁμαρτίας
  choice: доводя свои грехи до полноты
  rationale: Естественно по-русски выражает образ достижения полноты, не вводя отсутствующее в греческом тексте слово «мера».
- source_word: πάντοτε
  choice: постоянно
  rationale: Передаёт устойчивый, повторяющийся характер описываемого поведения и естественно сочетается с деепричастным оборотом.
- source_word: ἔφθασεν ἐπ’ αὐτούς
  choice: постиг их
  rationale: Кратко и естественно передаёт уже совершившееся наступление гнева на названных людей, сохраняя результативность аориста.
- source_word: ὀργή
  choice: гнев
  rationale: Сохраняет сильное и богословски нагруженное значение слова, не подменяя его более толковательным словом «суд».
- source_word: εἰς τέλος
  choice: до конца
  rationale: Близко к форме греческого выражения и сохраняет его спорную временную и интенсивную окраску; основные варианты смысла указаны в сноске.
theological_decisions:
- issue: К чему относится и что означает «гнев»
  choice: Оставить слово «гнев» без уточнения вида суда
  alternative: Указать конкретный исторический суд, окончательный эсхатологический суд либо оба аспекта
  rationale: Контекст позволяет понимать гнев как Божий, однако стих не называет конкретное событие и не устанавливает однозначно временные рамки.
- issue: Смысл конструкции εἰς τὸ ἀναπληρῶσαι
  choice: 'Передать преимущественно как следствие: «и тем самым»'
  alternative: 'Передать как цель: «чтобы довести свои грехи до полноты»'
  rationale: В данном контексте результативное прочтение не приписывает противникам сознательного намерения умножать грехи, но формулировка сохраняет связь их действий с наступающей полнотой грехов.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского высказывания. Начальное деепричастие сохранено, поскольку стих синтаксически продолжает предыдущее предложение. Формулировка избегает конфессиональных уточнений и сохраняет неоднозначность εἰς τέλος и временной отнесённости гнева.
