id: 1TH.2.1
reference: 1 Thessalonians 2:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Αὐτοὶ γὰρ οἴδατε, ἀδελφοί, τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς ὅτι οὐ κενὴ γέγονεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/001.yaml
  text: For you yourselves know[a], brothers, that our coming to you was not in vain,
translation:
  language: ru
  text: Ведь вы сами знаете, братья[a], что наш приход к вам не был напрасным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры». В греческом тексте стоит слово «братья»; в подобных обращениях оно нередко относится ко всей общине верующих.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτοὶ
  choice: вы сами
  rationale: Интенсивное местоимение подчёркивает личное, непосредственное знание фессалоникийцев; сочетание «вы сами» естественно передаёт это ударение по-русски.
- source_word: γὰρ
  choice: ведь
  rationale: Частица связывает утверждение с предшествующей мыслью как её обоснование. Русское «ведь» естественно сохраняет пояснительно-аргументативную связь.
- source_word: οἴδατε
  choice: знаете
  rationale: Хотя греческая форма исторически перфектная, οἶδα имеет настоящее значение; «знаете» точно и идиоматично.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохранена мужская форма греческого обращения. В посланиях Павла она нередко обращена ко всей общине, включая женщин, что пояснено в сноске.
- source_word: τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς
  choice: наш приход к вам
  rationale: εἴσοδος буквально означает «вход, вступление», но здесь обозначает прибытие Павла и его спутников к адресатам. «Приход к вам» звучит естественно и сохраняет направленность πρὸς ὑμᾶς.
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание того, что известно адресатам; прямое русское соответствие — «что».
- source_word: οὐ κενὴ
  choice: не был напрасным
  rationale: κενός может означать «пустой», «безрезультатный», «напрасный». В данном контексте речь идёт о том, что приход не оказался лишённым смысла или плода; выражение «не был напрасным» сохраняет широту оценки.
- source_word: γέγονεν
  choice: был
  rationale: Перфект γίνομαι характеризует состоявшийся приход и его сохраняющееся значение. В современном русском оборот «не был напрасным» естественнее буквального «не стал пустым».
theological_decisions:
- issue: Обращение ἀδελφοί к общине, в которую входили мужчины и женщины
  choice: братья
  alternative: братья и сёстры
  rationale: Основной текст сохраняет грамматически мужскую форму оригинала и традиционное общинное обращение, не исключая более широкого круга адресатов; вероятное включение женщин явно отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Порядок слов сохраняет эмфазу «вы сами», а «ведь» естественно передаёт связь с предыдущим рассуждением.
