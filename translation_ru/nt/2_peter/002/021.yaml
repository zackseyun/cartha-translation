id: 2PE.2.21
reference: 2 Peter 2:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἦν αὐτοῖς μὴ ἐπεγνωκέναι τὴν ὁδὸν τῆς δικαιοσύνης ἢ ἐπιγνοῦσιν ⸀ὑποστρέψαι ἐκ τῆς παραδοθείσης αὐτοῖς ἁγίας ἐντολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/021.yaml
  text: For it would have been better for them not to have known the way of righteousness than[a], after knowing it[c][b], to turn back from the holy commandment delivered to them.
translation:
  language: ru
  text: Ведь лучше было бы им не познать путь праведности[a], чем, познав его, отступить[b] от переданной[c] им святой заповеди.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стезю праведности». Слово δικαιοσύνη может также означать «справедливость», но здесь речь, вероятнее всего, о праведной жизни.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «повернуть назад от»; также возможно: «отвернуться от».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «вручённой»; «переданной» подчёркивает, что заповедь была сообщена им.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον … ἦν
  choice: лучше было бы
  rationale: Сравнительная конструкция выражает то, что было бы предпочтительнее; условная форма естественна по-русски и передаёт контрфактический оттенок контекста.
- source_word: ἐπεγνωκέναι / ἐπιγνοῦσιν
  choice: познать / познав
  rationale: Повтор одного корня сохраняет риторическую связь форм ἐπιγινώσκω. «Познать» передаёт определённое, состоявшееся знание, не усиливая его до «познать в полной мере».
- source_word: ὁδὸν τῆς δικαιοσύνης
  choice: путь праведности
  rationale: ὁδός здесь метафорически обозначает образ жизни или направление, а δικαιοσύνη — нравственную правоту перед Богом. Традиционное сочетание ясно и естественно в современном литературном русском.
- source_word: ὑποστρέψαι ἐκ
  choice: отступить от
  rationale: В контексте речь идёт о движении назад и удалении от уже принятого пути. «Отступить от» естественно сочетается с «заповедью» и сохраняет смысл отказа, хотя образ обратного движения выражен менее буквально.
- source_word: παραδοθείσης
  choice: переданной
  rationale: Страдательное причастие παραδίδωμι обозначает передачу заповеди адресатам. «Переданной» не добавляет ни оттенка исторического предания, ни особой ответственности за вверенное.
- source_word: ἁγίας ἐντολῆς
  choice: святой заповеди
  rationale: Сохранены единственное число и религиозно-нравственная весомость определения ἁγίας.
- source_word: γὰρ
  choice: ведь
  rationale: «Ведь» естественно вводит обоснование предыдущего утверждения и не делает связь чрезмерно формальной.
theological_decisions:
- issue: Следует ли переводом разрешить спор об отпадении от спасения или лишь внешнем знакомстве с верой
  choice: Прямо передать реальное познание пути и последующее отступление, не уточняя сотериологический статус людей.
  alternative: Ослабить «познать» до поверхностного ознакомления либо усилить «отступить» так, чтобы прямо утверждать утрату спасения.
  rationale: Греческий текст говорит, что они познали путь праведности, а затем отступили от переданной им святой заповеди, но сам стих не формулирует окончательного решения более широкого богословского спора.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Синтаксис сохраняет сравнительную структуру оригинала; формулировка остаётся понятной без конфессионально окрашенных уточнений.
