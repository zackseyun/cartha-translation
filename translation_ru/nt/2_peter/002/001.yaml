revisions:
- from: Но были и лжепророки в народе, как и среди вас будут лжеучители, которые тайно введут пагубные ереси[a] и, отрекаясь даже от купившего их Владыки[b], навлекут на себя скорую гибель.
  to: Но и среди народа появлялись лжепророки, как и среди вас будут лжеучители, которые тайно внесут гибельные ереси[a], отрекутся от Владыки, купившего их[b], и тем самым навлекут на себя скорую гибель.
  rationale: Убрано добавочное «даже» и выровнена синтаксическая структура, чтобы отречение от Владыки было самостоятельной характеристикой лжеучителей, а навлечение гибели — следствием их действий. «Появлялись» точнее передаёт ἐγένοντο, чем статическое «были», без излишней буквальности.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T02:32:37Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан точно: противопоставление лжепророков в народе и будущих лжеучителей у адресатов, тайное внесение гибельных ересей, отречение от Владыки и навлечение на себя скорой гибели сохранены. Однако частица «даже» не имеет необходимой опоры в греческом καί и добавляет эмфатический оттенок. Кроме того, исходное русское построение с «и, отрекаясь..., навлекут» синтаксически привязывает отречение преимущественно к навлечению гибели, тогда как греческие причастия характеризуют самих лжеучителей наряду с внесением ересей.'
  naturalness: «Владыка» и «купивший их» естественны в возвышенном библейском регистре. Перестройка фразы делает однородные действия и их следствие яснее в современном литературном русском.
  terminology: «Лжепророки», «лжеучители», «ереси», «Владыка» и метафора «купивший их» удачно передают исходные термины. «Владыка» обоснованно сохраняет отличие δεσπότης от κύριος. Сноска сохраняет допустимую альтернативу для αἱρέσεις и не навязывает богословского вывода относительно «купившего их».
  issues:
  - severity: medium
    issue: Необоснованная частица «даже» перед «от купившего их Владыки».
    rationale: В тексте стоит καὶ («и»); хотя в некоторых переводческих традициях возможен усилительный оттенок, здесь он не требуется и в русском добавляет акцент, отсутствующий в исходнике.
  - severity: medium
    issue: Синтаксическая связь деепричастия «отрекаясь» недостаточно точно отражена.
    rationale: Форма «и, отрекаясь..., навлекут» связывает отречение прежде всего с глаголом «навлекут». Лучше прямо представить отречение как действие лжеучителей и отдельно выразить следствие.
