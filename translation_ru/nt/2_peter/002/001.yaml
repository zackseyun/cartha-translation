  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐγένοντο δὲ καὶ ψευδοπροφῆται ἐν τῷ λαῷ, ὡς καὶ ἐν ὑμῖν ἔσονται ψευδοδιδάσκαλοι, οἵτινες παρεισάξουσιν αἱρέσεις ἀπωλείας, καὶ τὸν ἀγοράσαντα αὐτοὺς δεσπότην ἀρνούμενοι, ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/001.yaml
  text: But false prophets also arose among the people[a], just as there will also be false teachers among you, who will secretly bring in destructive heresies, even denying the Master who bought them[b], bringing swift destruction on themselves.
translation:
  language: ru
  text: Но и среди народа появлялись лжепророки, как и среди вас будут лжеучители, которые тайно внесут гибельные ереси[a], отрекутся от Владыки, купившего их[b], и тем самым навлекут на себя скорую гибель.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гибельные группировки». Греческое слово может обозначать также партии или секты, но здесь, вероятнее всего, имеются в виду учения или движения, ведущие к гибели.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Господа, искупившего их». Буквально по-гречески: «Владыку, купившего их»; здесь сохранена метафора покупки без разрешения богословских споров о её смысле и охвате.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένοντο
  choice: были
  rationale: В данном повествовательном сопоставлении естественная русская конструкция «были лжепророки» передаёт историческое появление и существование таких людей среди народа без тяжеловесного буквализма «возникли».
- source_word: ψευδοπροφῆται
  choice: лжепророки
  rationale: Прямой и общепонятный эквивалент сложного греческого существительного.
- source_word: ἐν τῷ λαῷ
  choice: в народе
  rationale: Сохраняет определённое «народе» и подразумеваемую связь с ветхозаветным народом Божьим, не добавляя в основной текст уточнение «Израиля».
- source_word: ὡς καὶ ἐν ὑμῖν ἔσονται
  choice: как и среди вас будут
  rationale: Естественно передаёт сравнение между прежними лжепророками и будущими лжеучителями в общинах адресатов.
- source_word: ψευδοδιδάσκαλοι
  choice: лжеучители
  rationale: Прямой русский эквивалент, сохраняющий параллель с «лжепророками».
- source_word: παρεισάξουσιν
  choice: тайно введут
  rationale: Передаёт как будущее действие, так и заложенный в глаголе оттенок скрытого, незаметного внесения.
- source_word: αἱρέσεις ἀπωλείας
  choice: пагубные ереси
  rationale: 'Прилагательное «пагубные» естественно передаёт родительный результата или свойства: эти ереси ведут к гибели. «Ереси» сохраняет вероятный здесь акцент на ложных учениях, а возможность значения «группировки» отмечена в сноске.'
- source_word: τὸν ... δεσπότην
  choice: Владыки
  rationale: «Владыка» передаёт верховную власть δεσπότης и позволяет не смешивать этот титул с обычным соответствием κύριος — «Господь».
- source_word: ἀγοράσαντα αὐτοὺς
  choice: купившего их
  rationale: Сохраняет прямую метафору покупки в ἀγοράζω и не подменяет её более богословски истолкованным «искупившего».
- source_word: ἀρνούμενοι
  choice: отрекаясь
  rationale: Передаёт не просто интеллектуальное отрицание, а отказ признавать власть Владыки; деепричастие сохраняет связь этого действия с введением ересей.
- source_word: ἐπάγοντες ἑαυτοῖς
  choice: навлекут на себя
  rationale: Естественная русская идиома точно сохраняет возвратный смысл и причинное последствие поступков лжеучителей.
- source_word: ταχινὴν ἀπώλειαν
  choice: скорую гибель
  rationale: Прямо передаёт быстроту наступления и тяжесть конечного результата.
theological_decisions:
- issue: Значение αἱρέσεις в данном контексте
  choice: ереси
  alternative: гибельные группировки или секты
  rationale: Скрытое внесение и последующее упоминание об отречении от Владыки выдвигают на первый план ложное учение, однако диапазон греческого слова допускает также партии или группировки; эта неоднозначность отмечена в сноске.
- issue: Смысл выражения τὸν ἀγοράσαντα αὐτοὺς δεσπότην
  choice: купившего их Владыки
  alternative: искупившего их Господа
  rationale: Основной текст сохраняет метафору покупки и прямое отнесение местоимения «их» к лжеучителям, не разрешая переводом богословский спор о характере или объёме этой покупки.
- issue: Различение δεσπότης и κύριος
  choice: Владыка
  alternative: Господь или Властелин
  rationale: «Владыка» естественно для возвышенного русского регистра, выражает власть хозяина и сохраняет лексическое отличие от κύριος.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис сделан плавным и доступным, при этом сохранены резкое предупреждение текста, метафора покупки и богословская напряжённость высказывания.
