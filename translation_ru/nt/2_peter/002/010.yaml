  text: μάλιστα δὲ τοὺς ὀπίσω σαρκὸς ἐν ἐπιθυμίᾳ μιασμοῦ πορευομένους καὶ κυριότητος καταφρονοῦντας. Τολμηταί, αὐθάδεις, δόξας οὐ τρέμουσιν, βλασφημοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/010.yaml
  text: especially those who go after the flesh in the desire for defilement and despise authority[a]. Bold, self-willed, they do not tremble as they blaspheme glorious ones[d][c][b],
translation:
  language: ru
  text: особенно тех, кто идёт вслед за плотью, предаваясь оскверняющей страсти[a], и презирает власть[b]. Дерзкие и своевольные, они не трепещут, злословя небесные славы[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в страсти осквернения»; возможно также: «в нечистой похоти».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «господство» или «владычество».'
    reason: lexical_alternative
  - marker: c
    text: Вероятно, имеются в виду славные небесные существа; возможно, ангелы. Греческое слово также может пониматься как «славы» или «величия».
    reason: alternative_reading
lexical_decisions:
- source_word: μάλιστα
  choice: особенно
  rationale: Передаёт усилительное выделение этой группы среди тех, о ком говорится в предыдущем стихе.
- source_word: ὀπίσω σαρκὸς … πορευομένους
  choice: тех, кто идёт вслед за плотью
  rationale: Сохраняет образ следования и ключевое слово σάρξ, не заменяя его более истолковывающим выражением «греховная природа».
- source_word: ἐν ἐπιθυμίᾳ μιασμοῦ
  choice: предаваясь оскверняющей страсти
  rationale: Естественно по-русски выражает порочное желание, связанное с осквернением; связь между страстью и осквернением не сводится исключительно к желанию намеренно оскверниться.
- source_word: κυριότητος
  choice: власть
  rationale: Ясное современное обозначение господствующей власти, не сужающее референт до владычества Христа или ангельского чина.
- source_word: καταφρονοῦντας
  choice: презирает
  rationale: Передаёт активное пренебрежение и силу греческого глагола.
- source_word: Τολμηταί
  choice: дерзкие
  rationale: Сохраняет краткую, резко отрицательную характеристику самоуверенной смелости.
- source_word: αὐθάδεις
  choice: своевольные
  rationale: Передаёт упрямую ориентацию на собственную волю, а не только общую надменность.
- source_word: δόξας
  choice: облечённых славой
  rationale: Передаёт личностный референт множественного числа и идею славы, не уточняя в основном тексте, что это ангелы или иные небесные существа.
- source_word: οὐ τρέμουσιν, βλασφημοῦντες
  choice: не трепещут, злословя
  rationale: Сохраняет яркий образ отсутствия трепета и обстоятельственный греческий причастный оборот; «злословить» здесь точнее русского «богохульствовать», которое обычно предполагает, что объектом речи является Бог.
theological_decisions:
- issue: К кому или к чему относится κυριότης
  choice: власть без уточнения её носителя
  alternative: господство Христа; ангельское владычество
  rationale: Само слово допускает значения власти, господства и владычества, а данный стих не устанавливает референт однозначно. Основной текст сохраняет широту выражения.
- issue: Кого обозначает δόξας
  choice: личности, облечённые славой, без их отождествления в основном тексте
  alternative: ангелы; небесные величия; абстрактные достоинства
  rationale: Упоминание ангелов в следующем стихе поддерживает небесный референт, но δόξας здесь остаётся менее определённым. Формулировка не вводит слово «ангелы» непосредственно в текст.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Обороты «вслед за плотью» и «не трепещут» намеренно сохраняют образность оригинала; «злословя» избегает чрезмерного сужения βλασφημεῖν до речи исключительно против Бога. Все примечания обозначены в основном тексте.
