id: 2PE.2.20
reference: 2 Peter 2:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ γὰρ ἀποφυγόντες τὰ μιάσματα τοῦ κόσμου ἐν ἐπιγνώσει τοῦ ⸀κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ τούτοις δὲ πάλιν ἐμπλακέντες ἡττῶνται, γέγονεν αὐτοῖς τὰ ἔσχατα χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/020.yaml
  text: For if[a], after escaping the defilements of the world through the knowledge of the Lord and Savior Jesus the Messiah, they are again entangled in these things and overcome[b], the last state has become worse for them than the first.
translation:
  language: ru
  text: Ибо если они, избежав скверн мира через познание Господа и Спасителя Иисуса Христа[a], снова запутываются в них и оказываются побеждены, то их последнее состояние стало хуже первоначального.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое Χριστός означает «Помазанник», то есть «Мессия».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποφυγόντες
  choice: избежав
  rationale: Деепричастие передаёт предшествующее действие аористного причастия без излишнего пояснения.
- source_word: τὰ μιάσματα τοῦ κόσμου
  choice: скверн мира
  rationale: «Скверна» сохраняет смысл нравственного осквернения и загрязнения, заложенный в μίασμα.
- source_word: ἐν ἐπιγνώσει
  choice: через познание
  rationale: Предлог ἐν здесь естественно понимать как указание на средство; «познание» не решает спорный вопрос о характере и глубине этого знания.
- source_word: κυρίου καὶ σωτῆρος
  choice: Господа и Спасителя
  rationale: Сохраняются оба титула, относящиеся к Иисусу.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Христа
  rationale: Это естественная и устоявшаяся русская передача; титульное значение Χριστός разъяснено в сноске.
- source_word: τούτοις δὲ πάλιν ἐμπλακέντες
  choice: снова запутываются в них
  rationale: Местоимение «в них» отсылает к сквернам мира, а глагол сохраняет образ повторного попадания в путы.
- source_word: ἡττῶνται
  choice: оказываются побеждены
  rationale: Пассивная форма передаёт подчинение или поражение, не уточняя сверх текста, чем именно оно завершается.
- source_word: τὰ ἔσχατα χείρονα τῶν πρώτων
  choice: их последнее состояние стало хуже первоначального
  rationale: Идиоматическая русская формулировка ясно выражает сопоставление конечного и исходного состояния, не придавая выражению специального эсхатологического смысла.
theological_decisions:
- issue: Характер познания Иисуса и его отношение к отпадению
  choice: «познание» без уточнения его спасительного или внешнего характера
  alternative: «полное познание», «спасительное познание» или «внешнее знакомство»
  rationale: Само слово ἐπίγνωσις не разрешает богословский спор о прежнем состоянии этих людей; перевод сохраняет напряжение текста.
- issue: Значение Χριστός
  choice: «Христос» в основном тексте с пояснением титула в сноске
  alternative: «Мессия»
  rationale: «Иисус Христос» соответствует современному литературному и библейскому русскому употреблению, а сноска сохраняет исходное титульное значение.
- issue: К чему относится τούτοις
  choice: «в них» — к сквернам мира
  alternative: «во всём этом»
  rationale: Ближайший грамматический антецедент — τὰ μιάσματα; перевод не добавляет отдельного перечня пороков.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Синтаксис условного предложения сохранён, но сделан естественным для русского читателя; богословская неоднозначность слова ἐπίγνωσις не устранена.
