  text: ὅπου ἄγγελοι ἰσχύϊ καὶ δυνάμει μείζονες ὄντες οὐ φέρουσιν κατ’ ⸀αὐτῶν βλάσφημον κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/011.yaml
  text: whereas angels[a], though greater in might and power[b], do not bring a slanderous judgment against them.
translation:
  language: ru
  text: тогда как ангелы, хотя и превосходят силой и могуществом, не выносят против них оскорбительного[a] суждения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «злословного», «поносительного»; греческое слово может обозначать оскорбительную, поносительную или клеветническую речь.'
    reason: lexical_alternative
  - marker: b
    text: Местоимение «них», вероятнее всего, отсылает к «славным» в предыдущем стихе, но Пётр здесь не уточняет, кого именно имеет в виду.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: тогда как
  rationale: В данном контексте слово выражает сопоставление и контраст с поведением людей, упомянутых в предыдущем стихе, а не буквальное место.
- source_word: ἄγγελοι
  choice: ангелы
  rationale: Контекст указывает на небесных существ, а не на людей-посланников.
- source_word: ἰσχύϊ καὶ δυνάμει
  choice: силой и могуществом
  rationale: Сохраняется парное усиление близких по смыслу слов и указывается, в чём ангелы превосходят других.
- source_word: μείζονες ὄντες
  choice: хотя и превосходят
  rationale: 'Причастный оборот имеет уступительный оттенок: несмотря на своё превосходство, ангелы так не поступают. Объект сравнения не добавлен, поскольку в греческом тексте он прямо не назван.'
- source_word: οὐ φέρουσιν
  choice: не выносят
  rationale: В сочетании с κρίσιν глагол имеет судебный оттенок — вынести или произнести суждение, приговор.
- source_word: κατ’ αὐτῶν
  choice: против них
  rationale: Местоименная отсылка сохранена без уточнения её неоднозначного антецедента.
- source_word: βλάσφημον
  choice: злословного
  rationale: Здесь слово характеризует оскорбительную, поносительную речь; «злословный» не сужает значение до богохульства против Бога.
- source_word: κρίσιν
  choice: приговора
  rationale: Слово обозначает судебное суждение или решение; «приговор» естественно сочетается с глаголом «выносить».
theological_decisions:
- issue: К кому относится αὐτῶν («них»)
  choice: В основном тексте оставлено местоимение «них» без уточнения.
  alternative: Падшие ангельские существа; человеческие властители; славные небесные существа вообще.
  rationale: Сам стих не называет референта прямо. Такая передача сохраняет связь с предыдущим стихом, не навязывая определённого богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сохраняет контраст и уступительный оборот оригинала; неоднозначная местоименная отсылка намеренно не конкретизирована.
