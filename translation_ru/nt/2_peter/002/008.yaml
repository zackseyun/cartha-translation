lexical_decisions:
- source_word: βλέμματι καὶ ἀκοῇ
  choice: тем, что видел и слышал
  rationale: Дательные формы обозначают восприятие зрением и слухом; такая передача естественна по-русски и сохраняет связь душевного мучения Лота с увиденным и услышанным.
- source_word: ὁ δίκαιος
  choice: этот праведник
  rationale: Субстантивированное прилагательное с артиклем отсылает к Лоту, упомянутому в предыдущем стихе; «этот» ясно выражает такую отсылку.
- source_word: ἐγκατοικῶν ἐν αὐτοῖς
  choice: живя среди них
  rationale: Причастие описывает длительное проживание Лота среди этих людей; деепричастный оборот близок к структуре греческого текста и естественен в современном русском языке.
- source_word: ἡμέραν ἐξ ἡμέρας
  choice: изо дня в день
  rationale: Идиома указывает на постоянно повторявшееся действие и его продолжительность.
- source_word: ψυχὴν δικαίαν
  choice: свою праведную душу
  rationale: ψυχή здесь обозначает внутреннюю жизнь Лота; «душу» прямо передаёт лексику оригинала, а возвратное «свою» естественно связывает дополнение с подлежащим.
- source_word: ἀνόμοις ἔργοις
  choice: их беззаконными делами
  rationale: Дательный падеж выражает средство или причину мучения. «Беззаконные дела» сохраняет нравственно-правовой оттенок ἄνομος; местоимение «их» проясняет контекстуальную принадлежность этих дел окружающим Лота людям.
- source_word: ἐβασάνιζεν
  choice: терзал
  rationale: Имперфект описывает продолжавшееся в прошлом действие, а «терзал» сохраняет сильное значение βασανίζω и активный залог.
theological_decisions:
- issue: Значение ψυχή в отношении природы человека
  choice: «душа» как внутреннее существо и жизнь Лота без дальнейшей догматической конкретизации
  alternative: «самого себя» или «своё внутреннее существо»
  rationale: Стих описывает внутреннее нравственное страдание, но не формулирует учение о соотношении души и тела; традиционный прямой эквивалент сохраняет смысл без привнесения антропологической системы.
- issue: Связь увиденного и услышанного с беззаконными делами
  choice: Сохранить оба обстоятельства как описание причины и содержания мучения, поставив «беззаконные дела» после пояснительного тире
  alternative: «своей праведной душой мучился из-за беззаконных дел, которые видел и о которых слышал»
  rationale: Порядок слов в греческом тексте разносит βλέμματι καὶ ἀκοῇ и ἀνόμοις ἔργοις, поэтому синтаксическую связь нельзя чрезмерно сужать. Основной текст передаёт естественную смысловую связь, а примечание сохраняет возможную альтернативную расстановку.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Повтор «праведник — праведную» намеренно сохранён вслед за оригиналом; «терзал» передаёт интенсивность глагола, не ослабляя его до простого огорчения.
