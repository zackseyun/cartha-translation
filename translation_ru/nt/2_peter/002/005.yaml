  text: καὶ ἀρχαίου κόσμου οὐκ ἐφείσατο, ἀλλὰ ὄγδοον Νῶε δικαιοσύνης κήρυκα ἐφύλαξεν, κατακλυσμὸν κόσμῳ ἀσεβῶν ἐπάξας,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/005.yaml
  text: and if he did not spare the ancient world[a], but preserved Noah, an eighth person, a herald of righteousness, when he brought a flood upon a world of the ungodly[c][b],
translation:
  language: ru
  text: и если Он не пощадил древнего мира, но сохранил Ноя — восьмого человека[a], глашатая праведности[b], — наведя потоп на мир нечестивых,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ноя, одного из восьми». Греческое выражение сжато и буквально называет Ноя «восьмым [человеком]»; вероятно, имеется в виду, что он был сохранён вместе с семью другими людьми.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «проповедника праведности». Слово κῆρυξ обозначает глашатая, публично возвещающего весть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχαίου κόσμου
  choice: древнего мира
  rationale: Передаёт мир прежних времён, прежде всего допотопный мир, естественным современным русским выражением.
- source_word: οὐκ ἐφείσατο
  choice: не пощадил
  rationale: Обычное значение φείδομαι в контексте суда; сохраняет судебную силу высказывания.
- source_word: ὄγδοον Νῶε
  choice: Ноя — восьмого
  rationale: Сохраняет сжатую порядковую конструкцию оригинала и её неоднозначность; пояснение о семи других вынесено в сноску.
- source_word: δικαιοσύνης κήρυκα
  choice: вестника праведности
  rationale: «Вестник» передаёт публичное провозглашение, заложенное в κῆρυξ, а «праведность» является здесь наиболее уместным соответствием δικαιοσύνη.
- source_word: ἐφύλαξεν
  choice: сохранил
  rationale: В контексте избавления среди суда обозначает сохранение в безопасности, не ограничиваясь оттенком физической охраны.
- source_word: κατακλυσμὸν
  choice: потоп
  rationale: Естественное русское обозначение всемирного потопа в повествовании о Ное; отсутствие артикля в греческом не требует неопределённости, которой русский язык грамматически не выражает.
- source_word: κόσμῳ ἀσεβῶν
  choice: на мир нечестивых
  rationale: Сохраняет структуру с родительным множественного числа и передаёт мир, населённый или характеризуемый нечестивыми людьми.
- source_word: ἐπάξας
  choice: наведя
  rationale: Деепричастие естественно и сжато передаёт аористное причастие, относя действие к тому же субъекту — Богу.
theological_decisions:
- issue: Передача δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: В характеристике провозглашения Ноя «праведность» лучше охватывает нравственную правоту и соответствие Божьей воле; возможное значение «справедливость» не исключается лексически, но здесь менее вероятно.
- issue: Смысл ὄγδοον Νῶε
  choice: Ноя — восьмого
  alternative: Ноя, одного из восьми
  rationale: Основной текст сохраняет необычную сжатость и формальную неоднозначность греческого оборота, а вероятный смысл — Ной вместе ещё с семью людьми — поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренно формальным библейским звучанием. Синтаксис сохраняет незавершённую условную цепь окружающего греческого предложения. Местоимение «Он» пишется с прописной буквы по русской библейской издательской традиции; референт определяется контекстом.
