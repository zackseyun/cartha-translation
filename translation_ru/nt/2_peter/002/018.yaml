  text: ὑπέρογκα γὰρ ματαιότητος φθεγγόμενοι δελεάζουσιν ἐν ἐπιθυμίαις σαρκὸς ἀσελγείαις τοὺς ⸀ὀλίγως ⸀ἀποφεύγοντας τοὺς ἐν πλάνῃ ἀναστρεφομένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/018.yaml
  text: For[a], speaking inflated words of emptiness, they entice by fleshly desires and sensuality those who are barely escaping from those who live in error[d][c][b],
translation:
  language: ru
  text: Ибо, произнося напыщенные и пустые речи[a], они плотскими желаниями и распутством заманивают тех, кто едва ускользает[b] от людей, живущих в заблуждении.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «произнося высокопарные речи, лишённые смысла».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кто лишь начинает ускользать» или «кто только недавно начал ускользать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέρογκα ματαιότητος
  choice: напыщенные, но пустые речи
  rationale: Сочетание передаёт чрезмерность и высокопарность ὑπέρογκα, а также бессодержательность ματαιότητος; слово «речи» естественно восполняется из φθεγγόμενοι.
- source_word: φθεγγόμενοι
  choice: произнося
  rationale: Причастие обозначает способ действия; «произнося» сохраняет оттенок речевого высказывания и подходит к слову «речи».
- source_word: δελεάζουσιν
  choice: заманивают
  rationale: Глагол связан с приманиванием, словно на наживку; «заманивают» сохраняет образ и нравственно-соблазняющий характер действия.
- source_word: ἐν ἐπιθυμίαις σαρκὸς ἀσελγείαις
  choice: плотскими желаниями и распутством
  rationale: Творительный падеж естественно передаёт ἐν как средство. «Плотскими» сохраняет метафору σάρξ, а «распутством» передаёт необузданное чувственное поведение, выраженное ἀσελγείαις.
- source_word: ὀλίγως ἀποφεύγοντας
  choice: тех, кто едва ускользает
  rationale: «Едва» отражает наиболее вероятное значение ὀλίγως в данном чтении, а настоящее время сохраняет незавершённость и непрочность бегства.
- source_word: τοὺς ἐν πλάνῃ ἀναστρεφομένους
  choice: от людей, живущих в заблуждении
  rationale: Оборот обозначает привычный образ жизни или поведения в состоянии заблуждения; «живущих в заблуждении» звучит естественно и не сужает πλάνη до одного лишь интеллектуального заблуждения.
theological_decisions:
- issue: Значение σάρξ в нравственном контексте
  choice: плотскими желаниями
  alternative: желаниями плоти; греховными желаниями
  rationale: «Плотскими» сохраняет греческую метафору и нравственный оттенок, не вводя более систематизированного понятия «греховной природы».
- issue: Кого заманивают лжеучители
  choice: тех, кто едва ускользает от людей, живущих в заблуждении
  alternative: тех, кто только недавно ускользнул от людей, живущих в заблуждении
  rationale: Основной текст следует чтению ὀλίγως и сохраняет процессуальный характер ἀποφεύγοντας, не утверждая завершённости или спасительного характера их бегства.
- issue: Соотношение ἐπιθυμίαις σαρκὸς и ἀσελγείαις
  choice: плотскими желаниями и распутством
  alternative: плотскими желаниями, то есть распутством
  rationale: Синтаксис допускает тесную связь или пояснительное отношение, однако сочинительная передача сохраняет неоднозначность и остаётся естественной по-русски.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены образ приманивания, метафора плоти и неустойчивость бегства; тяжеловесная греческая конструкция перестроена без устранения смысловой неоднозначности.
