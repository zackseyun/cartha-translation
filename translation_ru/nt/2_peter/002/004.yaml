source:
  edition: SBLGNT
  text: Εἰ γὰρ ὁ θεὸς ἀγγέλων ἁμαρτησάντων οὐκ ἐφείσατο, ἀλλὰ ⸀σειραῖς ζόφου ταρταρώσας παρέδωκεν εἰς κρίσιν τηρουμένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/004.yaml
  text: For if God did not spare angels when they sinned[a], but cast them into Tartarus and committed them to chains of gloom, to be kept for judgment[b],
translation:
  language: ru
  text: Ибо если Бог не пощадил согрешивших ангелов, но низверг их в Тартар[a] и предал их цепям мрака, чтобы они содержались до суда[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «низверг их в ад». Греческий глагол означает ввергнуть в Тартар, поэтому в основном тексте сохранён этот более точный термин.'
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых рукописях: «ямам мрака» вместо «цепям мрака».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐφείσατο
  choice: не пощадил
  rationale: Естественный русский эквивалент в контексте наказания; передаёт отказ избавить виновных от кары.
- source_word: ἀγγέλων ἁμαρτησάντων
  choice: согрешивших ангелов
  rationale: Причастный оборот точно и естественно передаёт греческое сочетание существительного с аористным причастием, указывающим на совершённое действие.
- source_word: ταρταρώσας
  choice: низверг их в Тартар
  rationale: Редкий глагол ταρταρόω обозначает заключение в Тартар; сохранение конкретного образа точнее обобщающего «низверг в ад».
- source_word: σειραῖς ζόφου
  choice: узам мрака
  rationale: Передаёт σειραί как узы или цепи, а ζόφος — как густой, зловещий мрак; формулировка сохраняет сжатый образ оригинала.
- source_word: παρέδωκεν
  choice: предал
  rationale: В судебно-тюремном контексте глагол обозначает передачу под стражу; «предал узам» звучит по-русски торжественно, но понятно.
- source_word: εἰς κρίσιν
  choice: до суда
  rationale: В сочетании с τηρουμένους выражает срок содержания под стражей в ожидании будущего суда, не предрешая формулировкой его приговор.
- source_word: τηρουμένους
  choice: где они содержатся
  rationale: Настоящее страдательное причастие обозначает продолжающееся содержание под стражей; личная конструкция естественна в современном русском.
theological_decisions:
- issue: Передача ταρταρώσας без привнесения более поздней доктринальной терминологии
  choice: низверг их в Тартар
  alternative: низверг их в ад
  rationale: Греческий глагол прямо отсылает к Тартару. Более общее «ад» могло бы стереть специфику авторского образа и вызвать ассоциации, которых сам редкий термин не уточняет.
- issue: Связь Тартара, уз мрака и содержания до суда
  choice: низверг их в Тартар и предал узам мрака, где они содержатся до суда
  alternative: низверг их в Тартар в узах мрака, чтобы сохранить до суда
  rationale: Выбранная формулировка сохраняет все элементы плотной греческой конструкции и продолжающееся состояние заключения, не уточняя сверх текста, являются ли узы орудием, местом или образом заточения.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. «Ибо если» сохраняет связь с последующим условным рассуждением; конечная запятая показывает, что предложение продолжается в следующих стихах.
