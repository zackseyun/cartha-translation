  source_fidelity: 'Перевод точно передаёт конструкцию οἶδεν ... ῥύεσθαι ... τηρεῖν: Господь умеет избавлять благочестивых и удерживать неправедных с перспективой дня суда. «Испытание» уместно в контексте Ноя и Лота; вариант «искушение» корректно вынесен в сноску. «Под наказанием» передаёт настоящее страдательное причастие κολαζομένους, не устраняя его синтаксической связи с будущим днём суда.'
