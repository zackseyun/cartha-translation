id: 2PE.2.9
reference: 2 Peter 2:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἶδεν κύριος εὐσεβεῖς ἐκ πειρασμοῦ ῥύεσθαι, ἀδίκους δὲ εἰς ἡμέραν κρίσεως κολαζομένους τηρεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/009.yaml
  text: then the Lord knows how to rescue the godly from trial[a], and to keep the unrighteous under punishment until the day of judgment[b],
translation:
  language: ru
  text: то Господь знает, как избавлять благочестивых от испытания[a], а неправедных — держать под наказанием до дня суда[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от искушения». Греческое слово может означать как искушение, так и испытание; здесь контекст скорее указывает на избавление от испытания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «а неправедных — сохранять для наказания в день суда». Греческое причастие можно понимать либо как указание на уже продолжающееся наказание, либо как относящее наказание к грядущему суду.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἶδεν
  choice: знает, как
  rationale: 'В сочетании с инфинитивами οἶδεν передаёт практическое знание или способность: «знает, как избавлять… и держать».'
- source_word: κύριος
  choice: Господь
  rationale: Традиционное и естественное русское соответствие κύριος в данном богословском контексте.
- source_word: εὐσεβεῖς
  choice: благочестивых
  rationale: Субстантивированное прилагательное обозначает людей, отличающихся почтением к Богу и верностью Ему; «благочестивых» сохраняет религиозно-нравственный смысл.
- source_word: ἐκ πειρασμοῦ
  choice: от испытания
  rationale: πειρασμός допускает значения «испытание» и «искушение»; предшествующие примеры Ноя и Лота говорят прежде всего об избавлении из тяжёлых обстоятельств.
- source_word: ῥύεσθαι
  choice: избавлять
  rationale: ῥύομαι означает спасать или избавлять от опасности; «избавлять» естественно звучит по-русски и сохраняет широкий смысл.
- source_word: ἀδίκους
  choice: неправедных
  rationale: Передаёт нравственный и судебный оттенок ἄδικος и соответствует устойчивому библейскому словоупотреблению.
- source_word: εἰς ἡμέραν κρίσεως
  choice: до дня суда
  rationale: При τηρεῖν оборот указывает на удержание с перспективой грядущего дня суда; «до» естественно выражает эту временную направленность, не устраняя возможной связи наказания с самим днём суда.
- source_word: κολαζομένους
  choice: под наказанием
  rationale: Причастие настоящего времени позволяет понимать наказание как продолжающееся состояние тех, кого удерживают; предложная конструкция сохраняет этот длительный оттенок.
- source_word: τηρεῖν
  choice: держать
  rationale: τηρέω здесь означает удерживать или сохранять до назначенного срока; «держать» сочетается с выражением «под наказанием» и не добавляет лишней конкретики.
theological_decisions:
- issue: Значение πειρασμός в контексте
  choice: испытание
  alternative: искушение
  rationale: Контекст повествует об избавлении Ноя и Лота среди бедствий и суда, поэтому «испытание» подходит лучше, но лексическая возможность значения «искушение» отмечена в сноске.
- issue: Смысл κολαζομένους при τηρεῖν
  choice: неправедные удерживаются под наказанием до дня суда
  alternative: неправедные сохраняются для наказания в день суда
  rationale: Настоящее страдательное причастие естественно передаёт продолжающееся наказание, однако синтаксис допускает отнесение наказания к будущему суду; эта подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Союз «то» сохраняет выводный характер стиха в связи с предшествующим условным рассуждением. Формулировка остаётся понятной обычному читателю и не разрешает насильно синтаксическую и богословскую неоднозначность второй части.
