  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἔλεγξιν δὲ ἔσχεν ἰδίας παρανομίας· ὑποζύγιον ἄφωνον ἐν ἀνθρώπου φωνῇ φθεγξάμενον ἐκώλυσεν τὴν τοῦ προφήτου παραφρονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/016.yaml
  text: 'But he received a rebuke for his own transgression: a mute beast of burden[a], speaking with a human voice[b], restrained the prophet’s madness.'
translation:
  language: ru
  text: 'Но он получил обличение за собственное беззаконие: бессловесное вьючное животное[a], заговорив человеческим голосом[b], остановило безумие пророка.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вьючное животное»; имеется в виду ослица Валаама (Чис. 22:28–30).'
    reason: cross_reference
  - marker: b
    text: 'Или: «голосом человека». Греческое выражение, вероятнее всего, противопоставляет человеческую речь бессловесному животному.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγξιν
  choice: обличение
  rationale: Слово обозначает порицание, выявляющее вину; «обличение» естественно в русском библейском контексте и сохраняет силу греческого существительного.
- source_word: ἰδίας παρανομίας
  choice: за собственное беззаконие
  rationale: παρανομία указывает на противозаконное, беззаконное поведение, а ἰδίας подчёркивает личную ответственность; предлог «за» естественно передаёт основание обличения.
- source_word: ὑποζύγιον
  choice: вьючное животное
  rationale: Греческое слово означает животное под ярмом или используемое для переноса груза. Более общее обозначение сохранено в основном тексте, хотя контекст Чис 22 указывает на ослицу Валаама.
- source_word: ἄφωνον
  choice: бессловесное
  rationale: ἄφωνος значит «не имеющий голоса, речи». «Бессловесное» звучит естественно применительно к животному и подчёркивает парадокс последующего говорения.
- source_word: ἐν ἀνθρώπου φωνῇ
  choice: человеческим голосом
  rationale: Оборот обозначает способ говорения и противопоставляет человеческую речь бессловесному животному; он не акцентирует мужской пол.
- source_word: φθεγξάμενον
  choice: заговорив
  rationale: Причастие обозначает членораздельное высказывание. Совершенный вид естественно передаёт событие, предшествующее остановке пророка.
- source_word: ἐκώλυσεν
  choice: остановило
  rationale: κωλύω означает препятствовать, удерживать или не допускать. В данном повествовательном контексте «остановило» ясно передаёт пресечение безумного устремления.
- source_word: παραφρονίαν
  choice: безумие
  rationale: παραφρονία обозначает сильную неразумность, исступление или безумие; выбранное слово сохраняет резкость исходного выражения.
- source_word: τοῦ προφήτου
  choice: пророка
  rationale: 'Родительный падеж выражает принадлежность: речь идёт о безумии пророка. Название сохраняет формулировку греческого текста, не оправдывая его поведения.'
theological_decisions:
- issue: Следует ли прямо назвать ὑποζύγιον ослицей Валаама
  choice: Сохранить в основном тексте более общее «вьючное животное»
  alternative: ослица
  rationale: Аллюзия на Чис 22:28–30 однозначна, однако греческий текст употребляет общее ὑποζύγιον, а не специальное название осла; конкретизация вынесена в примечание.
- issue: Как передать ἀνθρώπου в выражении ἐν ἀνθρώπου φωνῇ
  choice: человеческим
  alternative: мужским / голосом человека
  rationale: Здесь противопоставлены речь человека и бессловесность животного, а не мужской и женский голос; «человеческим» точно сохраняет смысл.
- issue: Сила выражения ἰδίας παρανομίας
  choice: за собственное беззаконие
  alternative: за собственное преступление / за свой проступок
  rationale: «Беззаконие» сохраняет связь παρανομία с нарушением должной нормы и подчёркивает серьёзность личной вины, не сводя её к случайной ошибке.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис близок к греческому, но остаётся естественным; лексическая и богословская напряжённость слов «беззаконие» и «безумие» сохранена. Все маркеры примечаний размещены в основном тексте.
