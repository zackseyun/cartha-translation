lexical_decisions:
- source_word: καὶ
  choice: и
  rationale: Простой соединительный союз продолжает синтаксическую последовательность предыдущего стиха.
- source_word: δίκαιον Λὼτ
  choice: праведного Лота
  rationale: Сохраняет прямую нравственную оценку Лота в греческом тексте и естественный русский порядок слов при общем сказуемом «избавил».
- source_word: καταπονούμενον
  choice: изнемогавшего
  rationale: Причастие передаёт продолжительное тяжёлое внутреннее состояние под воздействием окружающего зла; вариант сохраняет интенсивность, не подразумевая обязательно прямого физического истязания.
- source_word: ὑπὸ τῆς τῶν ἀθέσμων ἐν ἀσελγείᾳ ἀναστροφῆς
  choice: от распутного поведения беззаконников
  rationale: «От» естественно выражает причину страдания; «поведение» передаёт ἀναστροφή, а «распутного» — ἐν ἀσελγείᾳ, обозначающее бесстыдную нравственную разнузданность.
- source_word: τῶν ἀθέσμων
  choice: беззаконников
  rationale: 'Передаёт нравственно-правовой оттенок ἄθεσμος: людей, пренебрегающих установленными нормами и правдой.'
- source_word: ἐρρύσατο
  choice: избавил
  rationale: Естественный библейский и современный русский эквивалент со значением спасения от опасности; форма продолжает сказуемое из контекста.
theological_decisions:
- issue: Нравственная характеристика Лота на фоне повествования Бытия
  choice: Сохранено прямое определение «праведного Лота».
  alternative: Смягчить или опустить оценку из-за спорных поступков Лота в Бытии.
  rationale: δίκαιον недвусмысленно характеризует Лота как праведного; перевод не должен устранять богословское напряжение самого текста.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Тире сохранено, поскольку стих синтаксически входит в длинное предложение 2 Пет. 2:4–9. Маркеры сносок поставлены непосредственно после соответствующих выражений.
