  text: οὗτοι δέ, ὡς ἄλογα ζῷα ⸂γεγεννημένα φυσικὰ⸃ εἰς ἅλωσιν καὶ φθοράν, ἐν οἷς ἀγνοοῦσιν βλασφημοῦντες, ἐν τῇ φθορᾷ αὐτῶν ⸂καὶ φθαρήσονται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/012.yaml
  text: But these[a], like irrational animals—creatures of instinct, born for capture and destruction—blaspheming about things they do not understand, will also be destroyed in their destruction[d][c][b],
translation:
  language: ru
  text: А эти, словно неразумные животные[a], от природы рождённые для поимки и гибели[b], поносят то, чего не понимают[c], и также погибнут в своей гибели[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «животные, лишённые разума».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое выражение буквально сжато: «от природы рождённые»; речь о животных, живущих согласно своей природе или инстинкту.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «злословят о том, чего не знают».'
    reason: lexical_alternative
  - marker: d
    text: В греческом тексте повторены родственные слова со значениями «гибель» и «погибнут»; перевод сохраняет эту игру слов.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλογα ζῷα
  choice: неразумные животные
  rationale: ἄλογα обозначает отсутствие разума, а не просто неспособность говорить; сочетание «неразумные животные» естественно по-русски и сохраняет нравственный контраст.
- source_word: γεγεννημένα φυσικὰ
  choice: создания, ведомые природным инстинктом и рождённые
  rationale: Греческое сочетание сжато и буквально звучало бы по-русски неестественно. Формулировка передаёт жизнь по природному побуждению и сохраняет образ рождения.
- source_word: εἰς ἅλωσιν καὶ φθοράν
  choice: для поимки и погибели
  rationale: εἰς выражает назначение или ожидаемый результат; ἅλωσις означает поимку, а φθορά в данном образе — гибель. Слово «погибель» также позволяет сохранить связь с последующим глаголом.
- source_word: ἐν οἷς ἀγνοοῦσιν
  choice: то, чего не понимают
  rationale: Средний род множественного числа указывает на предметы или вопросы, а не обязательно на лиц. «Не понимают» естественно передаёт невежество, проявляющееся в их речи.
- source_word: βλασφημοῦντες
  choice: хулят
  rationale: Глагол может означать хулу, злословие или поношение. «Хулят» сохраняет силу выражения и не уточняет объект сверх сказанного в греческом тексте.
- source_word: ἐν τῇ φθορᾷ αὐτῶν καὶ φθαρήσονται
  choice: и в своей погибели сами погибнут
  rationale: Повтор однокоренных слов «погибель / погибнут» воспроизводит греческую игру φθορά / φθαρήσονται. Возвратная формулировка естественно передаёт их собственную окончательную гибель, не уточняя её характер.
theological_decisions:
- issue: Смысл βλασφημοῦντες
  choice: «хулят»
  alternative: «злословят» или «поносят»
  rationale: Более сильное слово сохраняет религиозно-нравственную тяжесть обвинения, но не называет объект хулы, которого сам стих прямо не указывает.
- issue: Смысл φθορά / φθαρήσονται
  choice: 'лексика погибели: «для поимки и погибели… в своей погибели сами погибнут»'
  alternative: лексика тления, порчи или уничтожения
  rationale: Образ животных, предназначенных для поимки и гибели, поддерживает значение окончательной погибели. Однокоренной повтор передаёт намеренную словесную связь греческого текста, не конкретизируя способ суда.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной синтаксической структурой. Вставная конструкция между тире сохраняет развёрнутое сравнение оригинала; однокоренной повтор намеренно оставлен ради греческой риторики.
