  terminology: «Неразумные животные» удачно передаёт ἄλογα ζῷα. «Гибель / погибнут» хорошо воспроизводит греческую однокоренную игру. Для βλασφημοῦντες в данном синтаксисе «поносят» естественнее русского «хулят» и не сужает неуказанный объект до собственно сакрального.
