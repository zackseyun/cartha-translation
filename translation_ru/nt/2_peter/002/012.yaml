  source_fidelity: 'Основной смысл передан верно: сравнение с лишёнными разума животными, невежественная хула и намеренный повтор φθορά / φθαρήσονται сохранены. Однако γεγεννημένα φυσικὰ представляет их как «природных/от природы рождённых» животных; нынешнее «ведомые природным инстинктом и рождённые» разъединяет единое греческое определение и несколько расширяет его. Кроме того, ἐν οἷς естественнее передать как «о том, чего…», а не прямым дополнением.'
