id: 2PE.2.15
reference: 2 Peter 2:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀καταλιπόντες εὐθεῖαν ὁδὸν ἐπλανήθησαν, ἐξακολουθήσαντες τῇ ὁδῷ τοῦ Βαλαὰμ τοῦ ⸀Βοσὸρ ὃς μισθὸν ἀδικίας ἠγάπησεν
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/015.yaml
  text: Having abandoned the straight way[a], they went astray, having followed the way of Balaam son of Bosor[b], who loved the wages of unrighteousness.
translation:
  language: ru
  text: Оставив прямой путь, они заблудились, последовав[b] путём Валаама, сына Восора[a], который полюбил плату за неправедность.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте стоит имя «Восор»; в Ветхом Завете Валаам обычно назван сыном Веора.
    reason: alternative_reading
  - marker: b
    text: 'Возможно также: «заблудились, пойдя путём Валаама» или «заблудились потому, что пошли путём Валаама».'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: καταλιπόντες
  choice: оставив
  rationale: Деепричастие передаёт предшествующее действие аористного причастия и сознательный уход с пути, не усиливая значение до «отрекшись».
- source_word: εὐθεῖαν ὁδὸν
  choice: прямой путь
  rationale: Сохраняет буквальный образ прямого пути и библейскую нравственную метафору.
- source_word: ἐπλανήθησαν
  choice: заблудились
  rationale: Естественно передаёт непереходное значение глагола и нравственно-духовное уклонение, не вводя явно не названного внешнего виновника.
- source_word: ἐξακολουθήσαντες
  choice: последовав
  rationale: Сохраняет причастную форму и допускает как сопутствующее, так и причинно-инструментальное отношение к сказуемому.
- source_word: τῇ ὁδῷ
  choice: путём
  rationale: Повторяет метафору пути и естественно сочетается с глаголом «последовать».
- source_word: τοῦ Βαλαὰμ
  choice: Валаама
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: τοῦ Βοσὸρ
  choice: сына Восора
  rationale: Повторный родительный падеж естественно понимается как указание на отца; «Восор» непосредственно отражает форму греческого текста.
- source_word: μισθὸν ἀδικίας
  choice: плату за неправедность
  rationale: Передаёт вознаграждение, получаемое за неправедное дело, сохраняя отрицательный нравственный смысл выражения без архаичного «мзда».
- source_word: ἠγάπησεν
  choice: полюбил
  rationale: Прямо и естественно передаёт аорист ἀγαπάω.
theological_decisions:
- issue: Образ нравственного пути в εὐθεῖαν ὁδὸν / τῇ ὁδῷ
  choice: Сохранить единый образ «пути» без толкующих добавлений.
  alternative: «правильная дорога» / «истинный путь»
  rationale: Греческий текст использует конкретную метафору пути; её сохранение не сужает смысл до заранее заданного богословского толкования.
- issue: 'Форма отчества Валаама: Βοσόρ'
  choice: В основном тексте — «сына Восора», с пояснением формы «Веор» в сноске.
  alternative: «сына Веора»
  rationale: Приоритет греческого источника требует сохранить Βοσόρ, тогда как сноска помогает соотнести это лицо с ветхозаветным Валаамом, сыном Веора.
- issue: Синтаксическая связь ἐξακολουθήσαντες с ἐπλανήθησαν
  choice: «заблудились, последовав»
  alternative: «заблудились тем, что пошли» / «заблудились, потому что пошли»
  rationale: 'Деепричастная конструкция сохраняет возможную неоднозначность: следование пути Валаама может обозначать сопутствующее действие или средство и основание заблуждения.'
translation_notes:
  register: 'Современный литературный русский язык с сохранением библейского образа пути. Избегаются как архаизм «мзда», так и излишне толкующие выражения. Порядок маркеров определяется их фактическим местом в русском тексте: [b] поясняет связь деепричастия, [a] — форму имени Восор.'
