    reason: textual_variant
lexical_decisions:
- source_word: ἀδικούμενοι μισθὸν ἀδικίας
  choice: получая воздаяние за неправедность
  rationale: Причастие ἀδικούμενοι в данном контексте выражает претерпевание заслуженного последствия, а μισθός — воздаяние или плату. Формулировка передаёт идею кары за неправедное поведение и сохраняет смысловую напряжённость оборота.
- source_word: ἡδονὴν ἡγούμενοι
  choice: считают наслаждением
  rationale: ἡγέομαι с предикативным винительным означает «считать, почитать чем-либо», а ἡδονή — «наслаждение, удовольствие».
- source_word: τὴν ἐν ἡμέρᾳ τρυφήν
  choice: предаваться роскоши среди бела дня
  rationale: τρυφή обозначает изнеженную, расточительную роскошь и самоугождение; «среди бела дня» естественно передаёт ἐν ἡμέρᾳ и подчёркивает бесстыдную открытость поведения.
- source_word: σπίλοι καὶ μῶμοι
  choice: пятна и пороки
  rationale: Парный образ обозначает нравственную нечистоту и изъян. «Пятна и пороки» звучит понятно и достойно, сохраняя различие между загрязнением и недостатком.
- source_word: ἐντρυφῶντες
  choice: упиваясь
  rationale: Глагол описывает самодовольное наслаждение и разгул; «упиваясь» естественно связывается с обманами и передаёт отрицательную нравственную окраску.
- source_word: ἐν ταῖς ἀπάταις αὐτῶν
  choice: своими обманами
  rationale: Основной текст SBLGNT читает ἀπάταις — «обманами, заблуждениями». Творительный оборот естественно передаёт греческое ἐν в сочетании с ἐντρυφῶντες.
- source_word: συνευωχούμενοι ὑμῖν
  choice: они пируют вместе с вами
  rationale: Глагол означает совместно участвовать в пиршестве. Личная форма делает длинную греческую цепочку причастий ясной по-русски, не уточняя характер трапезы сверх текста.
theological_decisions:
- issue: Значение ἀδικούμενοι в выражении о воздаянии
  choice: получая воздаяние за неправедность
  alternative: терпя несправедливость как плату за неправедность
  rationale: Хотя форма буквально может означать «подвергаясь несправедливости», контекст суда над лжеучителями указывает на получение заслуженного возмездия. Перевод не представляет Бога совершающим несправедливость.
- issue: Разночтение ἀπάταις / ἀγάπαις
  choice: ἀπάταις — «своими обманами» в основном тексте
  alternative: ἀγάπαις — «на ваших трапезах любви»
  rationale: SBLGNT имеет ἀπάταις, что соответствует контексту обмана лжеучителей. Значимое разночтение ἀγάπαις сохранено в сноске без принятия его в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Греческая причастная цепочка разделена на предложения ради ясности; обличительный тон, образность и значимое текстуальное разночтение сохранены.
