base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/019.yaml
  text: promising them freedom while they themselves are servants of corruption[a]; for whatever a person is overcome by[b], by this he is also enslaved.
translation:
  language: ru
  text: Обещая им свободу, они сами — рабы тления[a], ведь кто чем побеждён, тому и порабощён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «испорченности», «разложения»; это слово может также подразумевать гибель.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλευθερίαν
  choice: свободу
  rationale: Обычное и естественное соответствие; сохраняет резкое противопоставление обещанной свободы фактическому рабству.
- source_word: ἐπαγγελλόμενοι
  choice: обещая
  rationale: Причастие означает именно обещание, а не просто предложение или провозглашение.
- source_word: δοῦλοι
  choice: рабами
  rationale: В контексте господства и противопоставления свободе слово «рабы» точнее, чем более мягкое «слуги».
- source_word: ὑπάρχοντες
  choice: они сами остаются
  rationale: Передаёт их действительное, продолжающееся состояние одновременно с обещанием свободы; «сами» сохраняет эмфатическое αὐτοί.
- source_word: φθορᾶς
  choice: тления
  rationale: «Тление» сохраняет совокупность оттенков нравственной испорченности, разложения и гибельности, не сводя смысл только к одному из них.
- source_word: ᾧ γάρ τις ἥττηται
  choice: ведь кем кто побеждён
  rationale: Сохраняет пассивное значение совершённого поражения и намеренно широкое относительное местоимение, которое по-русски допускает господствующую силу или предмет.
- source_word: τούτῳ καὶ δεδούλωται
  choice: тому и порабощён
  rationale: Дательный передан параллельным «тому»; перфект выражен результирующим состоянием «порабощён», а καί — частицей «и».
theological_decisions:
- issue: Передача образа рабства в противопоставлении ложной свободе
  choice: «рабами» и «порабощён»
  alternative: «слугами» и «оказался в зависимости»
  rationale: Прямой образ рабства составляет основу аргумента и не должен смягчаться.
- issue: Смысл φθορά
  choice: «тление» с пояснением диапазона значения
  alternative: «испорченность», «разложение» или «гибель»
  rationale: Греческое слово может соединять нравственную порчу, разложение и гибель; основной текст сохраняет эту смысловую напряжённость, а примечание предотвращает чрезмерное сужение.
- issue: Отношение между победителем и порабощённым в заключительной максиме
  choice: «кем кто побеждён, тому и порабощён»
  alternative: «что одолевает человека, то его и порабощает»
  rationale: Выбранная формулировка ближе к синтаксису оригинала и сохраняет совершённое поражение и возникшее вследствие него состояние рабства.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной заключительной фразой. Сохранены эмфаза «они сами», контраст свободы и рабства и неоднозначность слова φθορά.
