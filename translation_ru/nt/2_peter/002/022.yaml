revisions:
- from: 'С ними произошло то, о чём говорит верная пословица: «Пёс возвращается к собственной блевотине»[a] и «Вымытая свинья — валяться в грязи»[b].'
  to: 'С ними случилось то, о чём говорится в правдивой пословице: «Пёс возвращается к собственной блевотине», а «вымытая свинья снова валяется в грязи».[a][b]'
  rationale: Исправлена неестественная синтаксическая неполнота второй русской цитаты. Подразумеваемое в пословичном контексте повторное действие передано минимально и без догматического расширения. Также «верная» заменено на более ясное для современного читателя «правдивая». Сноски сохранены и уточнены; их якоря поставлены после всего пословичного комплекса.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T02:32:47Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: συμβέβηκεν αὐτοῖς обозначает произошедшее с этими людьми, а две пословичные картины передают возвращение к прежней нечистоте. Однако во второй цитате русское «Вымытая свинья — валяться в грязи» не образует нормативного законченного высказывания. Греческий текст здесь эллиптичен, но русский перевод может и должен передать подразумеваемое повторное действие естественным полным предложением, не добавляя богословского вывода.'
  naturalness: «Верная пословица» возможно, но в современном литературном русском менее естественно и менее ясно, чем «правдивая пословица». Формула «то, о чём говорится в правдивой пословице» плавна и сохраняет эллиптический смысл оригинала. «Снова валяется в грязи» естественно передаёт образ возвращения к валянию; «блевотина» оправдана резкостью исходного образа.
  terminology: «Пёс», «собственная блевотина», «вымытая свинья» и «грязь» приемлемо передают κύων, ἴδιον ἐξέραμα, ὗς λουσαμένη и βόρβορος. «Вымытая» удачно не решает спорный вопрос о средне-пассивном оттенке λουσαμένη.
  issues:
  - severity: medium
    issue: Ненормативная эллиптическая конструкция во второй пословице
    rationale: «Вымытая свинья — валяться в грязи» не является естественной современной русской фразой. Эллипсис греческой цитаты не требует сохранять в русском синтаксически неполное и неясное словосочетание; подразумеваемое повторное действие можно выразить как «снова валяется в грязи».
  - severity: low
    issue: «Верная пословица» звучит несколько архаично и двусмысленно
    rationale: В современном русском «верная» может прежде всего означать преданная. «Правдивая пословица» яснее передаёт ἀληθής как соответствующая действительности.
