  text: ⸀συμβέβηκεν αὐτοῖς τὸ τῆς ἀληθοῦς παροιμίας· Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα, καί· Ὗς λουσαμένη εἰς ⸀κυλισμὸν βορβόρου.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/022.yaml
  text: 'What the true proverb says has happened to them: “A dog returns to its own vomit,” and[b][a], “A washed sow returns to wallowing in the mud.”'
translation:
  language: ru
  text: 'С ними случилось то, о чём говорится в правдивой пословице: «Пёс возвращается к собственной блевотине», а «вымытая свинья снова валяется в грязи».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Первая строка перекликается с Притчами 26:11. Буквально: «Пёс, возвратившийся к собственной блевотине».'
    reason: cross_reference
  - marker: b
    text: 'Во второй строке в греческом тексте глагол не выражен; буквально: «и вымытая свинья — к валянию в грязи». Русское «снова валяется» передаёт подразумеваемое возвращение к этому действию.'
    reason: textual_clarity
lexical_decisions:
- source_word: συμβέβηκεν αὐτοῖς
  choice: С ними произошло
  rationale: Перфект передаёт наступившее событие, результат которого сохраняется; русская конструкция естественно обозначает тех, к кому относится пословица.
- source_word: τὸ τῆς ἀληθοῦς παροιμίας
  choice: то, о чём говорит верная пословица
  rationale: 'Эллиптическая греческая конструкция раскрыта минимально: содержание пословицы осуществилось в их случае. «Верная» здесь означает соответствующая действительности.'
- source_word: Κύων
  choice: Пёс
  rationale: В пословичном изречении слово имеет обобщающий смысл; «пёс» естественно и сохраняет грубоватую выразительность образа.
- source_word: ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα
  choice: возвращается к собственной блевотине
  rationale: Настоящее время по-русски естественно для общеизвестной пословицы; «собственной» сохраняет ἴδιον, а «блевотина» точно и наглядно передаёт ἐξέραμα.
- source_word: Ὗς λουσαμένη
  choice: Вымытая свинья
  rationale: Женский род греческого существительного и причастия передан словом «свинья»; форма не уточняет однозначно, вымылась ли она сама или была вымыта.
- source_word: εἰς κυλισμὸν βορβόρου
  choice: валяться в грязи
  rationale: Передаёт действие катания или барахтанья в грязи естественным современным русским выражением; эллипсис оригинала сохранён.
theological_decisions:
- issue: Смысл применения пословицы
  choice: Содержание пословицы осуществилось в жизни упомянутых людей, без дополнительного догматического объяснения образа возвращения.
  alternative: Истолковать образ как прямое утверждение о конкретном учении об отпадении или природе этих людей.
  rationale: Греческий текст подчёркивает соответствие их поведения пословичным образам, но сам по себе не разворачивает здесь систематического богословского вывода.
- issue: Залог λουσαμένη
  choice: «Вымытая» без уточнения действующего лица.
  alternative: «Вымывшаяся» или «которую вымыли».
  rationale: Средне-пассивная форма допускает различное понимание; нейтральная русская форма сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением резкости пословичных образов. Первая строка оформлена как полноценная русская пословица, тогда как во второй сохранён заметный эллипсис греческого текста; сноска разъясняет конструкцию.
