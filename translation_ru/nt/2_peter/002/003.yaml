  source_fidelity: 'Основной смысл передан верно: лжеучители из жадности извлекают выгоду из адресатов посредством намеренно выдуманных речей; суд и погибель неизбежны. Однако «не остаётся без исполнения» несколько сильнее и конкретнее, чем οὐκ ἀργεῖ («не бездействует / не медлит»): оно прямо утверждает исполнение приговора, тогда как греческий образ подчёркивает, что суд не бездеятелен и не задерживается. «Суд, ожидающий их с давних пор» естественно передаёт οἷς ... ἔκπαλαι без неоправданного указания на формальный акт вынесения приговора.'
