base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/003.yaml
  text: And in greed they will exploit you with fabricated words. Their judgment from long ago is not idle[a], and their destruction is not asleep.
translation:
  language: ru
  text: И из жадности они будут наживаться на вас[a] выдуманными речами. Суд, ожидающий их с давних пор, не медлит, и их погибель не дремлет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также: «будут торговать вами»; в греческом употреблена торговая метафора, представляющая людей средством наживы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεονεξίᾳ
  choice: из алчности
  rationale: Дательный с ἐν передаёт побуждение или сферу действия; «из алчности» естественно выражает мотив и сохраняет нравственную оценку.
- source_word: πλαστοῖς λόγοις
  choice: с помощью выдуманных речей
  rationale: πλαστός означает искусственно созданное, сфабрикованное; «выдуманные речи» передаёт намеренно сочинённые утверждения или учения, а не просто ошибочные слова.
- source_word: ἐμπορεύσονται
  choice: будут наживаться на вас
  rationale: Глагол содержит торговую метафору и в данном контексте означает извлечение выгоды из людей. Русское выражение ясно передаёт эксплуатацию, а буквальный образ отмечен в сноске.
- source_word: κρίμα
  choice: приговор
  rationale: Здесь κρίμα обозначает судебное решение, ожидающее лжеучителей; «приговор» сохраняет юридическую образность и не уточняет способ наказания.
- source_word: ἔκπαλαι
  choice: давно вынесенный
  rationale: Наречие указывает, что приговор существует с давних пор; в русском оно естественно связано с вынесением приговора.
- source_word: οὐκ ἀργεῖ
  choice: не остаётся без исполнения
  rationale: ἀργέω означает бездействовать, оставаться неисполненным или неэффективным. Формулировка естественна в сочетании с «приговором» и передаёт уверенность в его действии, не сводя смысл только к задержке.
- source_word: ἀπώλεια
  choice: погибель
  rationale: «Погибель» передаёт разрушение или окончательный крах и уместно сочетается с олицетворением в следующем глаголе, не определяя точную природу наказания.
- source_word: οὐ νυστάζει
  choice: не дремлет
  rationale: 'Сохраняется яркое олицетворение: грядущая погибель не спит и не бездействует.'
theological_decisions:
- issue: Характер объявленного наказания
  choice: Передать текст как несомненный грядущий приговор и погибель лжеучителей, не уточняя механизм и продолжительность наказания.
  alternative: Понимать «погибель» исключительно как уничтожение либо только как земной крах без окончательного суда.
  rationale: Стих утверждает неизбежность суда, но сам по себе не раскрывает точную природу или длительность наказания; перевод сохраняет эту границу.
translation_notes:
  register: Современный литературный русский язык с ясной, серьёзной интонацией. «Наживаться на вас» звучит естественно для широкой аудитории; юридическая образность «приговор — исполнение» и олицетворение «погибель не дремлет» сохраняют силу исходного текста.
