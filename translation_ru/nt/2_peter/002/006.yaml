source:
  edition: SBLGNT
  text: καὶ πόλεις Σοδόμων καὶ Γομόρρας τεφρώσας ⸀καταστροφῇ κατέκρινεν, ὑπόδειγμα μελλόντων ⸀ἀσεβέσιν τεθεικώς,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/006.yaml
  text: and if by reducing the cities of Sodom and Gomorrah to ashes he condemned them to destruction[a], having made them an example for those who would be ungodly[b],
translation:
  language: ru
  text: и, обратив города Содома и Гоморры в пепел, осудил их на гибель, сделав их примером того, что предстоит нечестивым[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделав их примером для будущих нечестивцев».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεφρώσας
  choice: обратив в пепел
  rationale: Передаёт не только сожжение, но и его результат — превращение в пепел; деепричастие сохраняет форму и связь греческого аористного причастия с основным глаголом.
- source_word: καταστροφῇ
  choice: на уничтожение
  rationale: 'Дательный падеж естественно понимать как результат приговора: города были осуждены на уничтожение. Это сохраняет судебный оттенок κατέκρινεν.'
- source_word: κατέκρινεν
  choice: осудил
  rationale: Прямо передаёт судебный смысл глагола — вынести обвинительный приговор.
- source_word: ὑπόδειγμα
  choice: пример
  rationale: Нейтральное соответствие, сохраняющее контекстуально очевидную функцию предостережения без её избыточного разъяснения в основном тексте.
- source_word: μελλόντων ἀσεβέσιν
  choice: того, что ожидает нечестивых
  rationale: Греческая конструкция текстуально неоднозначна и допускает отнесение μελλόντων либо к будущей участи нечестивых, либо к будущим нечестивцам. Основной вариант естественно передаёт возможное значение будущей участи, а альтернативное чтение отмечено в сноске.
- source_word: τεθεικώς
  choice: показав тем самым
  rationale: Передаёт установление городов в качестве сохраняющего силу примера и естественно связывает суд с его назидательным результатом.
- source_word: πόλεις Σοδόμων καὶ Γομόρρας
  choice: города Содом и Гоморру
  rationale: В современном русском названия самих городов естественнее поставить в приложении к слову «города», согласовав их с винительным падежом.
theological_decisions:
- issue: Неявно выраженное подлежащее
  choice: не добавлять «Бог» или «Господь»
  alternative: он / Бог / Господь
  rationale: В греческом подлежащее восстанавливается из предшествующего контекста. Русская форма «осудил» позволяет сохранить связность отрывка, не вводя отсутствующий здесь титул.
- issue: Синтаксическая неоднозначность μελλόντων ἀσεβέσιν
  choice: «пример того, что ожидает нечестивых»
  alternative: «пример для будущих нечестивцев»
  rationale: 'Рукописная и синтаксическая форма допускает разные способы связи слов: либо пример будущей участи нечестивых, либо пример для людей, которые впоследствии будут нечестивы. Неоднозначность сохранена посредством сноски.'
translation_notes:
  register: Современный литературный русский, сдержанный и торжественный. Синтаксис сохраняет зависимость стиха от условной конструкции окружающего контекста; заключительная запятая показывает, что предложение продолжается.
