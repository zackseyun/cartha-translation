  verdict: revise
  source_fidelity: 'Основной смысл передан верно: речь о превращении городов Содома и Гоморры в пепел, их осуждении на гибель и об установленном ими предостерегающем примере. Однако «показав тем самым пример» ослабляет τεθεικώς («сделав/установив их примером») и меняет образ городов как самого примера. «Предстоит нечестивым» точнее передаёт μελλόντων, чем нейтральное «ожидает».'
  naturalness: '«Города Содом и Гоморру» ненормативно и неестественно как приложение: в русском здесь нужны родительные формы «города Содома и Гоморры». Перестроенная фраза с «сделав их примером» современна, ясна и сохраняет незавершённость условного периода запятой в конце.'
  terminology: «Осудил на гибель» сохраняет судебную силу κατέκρινεν и естественно передаёт результат καταστροφῇ. «Нечестивые» — уместное литературное соответствие ἀσεβέσιν. Имена «Содом» и «Гоморра» даны в нормативных русских формах.
