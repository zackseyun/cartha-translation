  text: ὀφθαλμοὺς ἔχοντες μεστοὺς μοιχαλίδος καὶ ⸀ἀκαταπαύστους ἁμαρτίας, δελεάζοντες ψυχὰς ἀστηρίκτους, καρδίαν γεγυμνασμένην πλεονεξίας ἔχοντες, κατάρας τέκνα,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/014.yaml
  text: having eyes full of an adulteress and insatiable for sin, enticing unstable souls, having a heart trained in greed, children of a curse,
translation:
  language: ru
  text: Их глаза полны прелюбодейки[a] и не знают удержу в грехе[b]; они прельщают неутверждённые души; сердце их приучено к алчности. Дети проклятия!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «полны прелюбодейки»; по смыслу возможно: «полны прелюбодеяния» или «полны прелюбодейного желания».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не перестают грешить» или «не могут перестать грешить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεστοὺς μοιχαλίδος
  choice: полны прелюбодейки
  rationale: Сохранён конкретный и намеренно резкий образ греческого текста — буквально «полны прелюбодейки»; более гладкие истолковательные варианты вынесены в примечание.
- source_word: ἀκαταπαύστους ἁμαρτίας
  choice: не могут перестать грешить
  rationale: Передаёт privative значение ἀκατάπαυστος и зависимость от ἁμαρτία естественным современным русским языком, не привнося оттенка ненасытности, которого выражение прямо не требует.
- source_word: δελεάζοντες
  choice: прельщают
  rationale: Передаёт заманивание соблазном и хищнический оттенок глагола; слово уместно в литературном библейском регистре и понятно современному читателю.
- source_word: ψυχὰς ἀστηρίκτους
  choice: неутверждённые души
  rationale: «Души» сохраняет форму ψυχάς, а «неутверждённые» выражает отсутствие твёрдости и укоренённости.
- source_word: καρδίαν γεγυμνασμένην πλεονεξίας
  choice: сердце их приучено к алчности
  rationale: γεγυμνασμένην обозначает выработанную упражнением привычку; «приучено» звучит естественно, а «алчность» ясно передаёт πλεονεξία.
- source_word: κατάρας τέκνα
  choice: Дети проклятия
  rationale: Сохранена образная генитивная конструкция греческого текста, выражающая принадлежность к проклятию или его характерную печать.
theological_decisions:
- issue: Следует ли смягчать конкретный сексуальный образ μοιχαλίδος
  choice: Сохранить в основном тексте буквальный образ «полны прелюбодейки»
  alternative: «полны прелюбодеяния» или «полны прелюбодейного желания»
  rationale: Необычность выражения принадлежит самому греческому тексту; перевод не должен без необходимости устранять его резкость, но поясняет смысл в примечании.
- issue: Как понимать ἀκαταπαύστους ἁμαρτίας
  choice: «не могут перестать грешить»
  alternative: «не перестают грешить» или «ненасытны в грехе»
  rationale: Выбран вариант, непосредственно передающий невозможность или неспособность прекратить грех; альтернативная возможность непрерывности отмечена в примечании без догматического усиления.
- issue: Передача κατάρας τέκνα
  choice: Сохранить «Дети проклятия!»
  alternative: «проклятые дети» или «дети, находящиеся под проклятием»
  rationale: Образная формула оставляет присущую оригиналу напряжённость между характеристикой этих людей и грозящим им проклятием.
translation_notes:
  register: Современный литературный русский язык с сохранением резкого обличительного тона и накопления характеристик. Длинная греческая цепь причастий расчленена точками с запятой, а заключительная формула оформлена как отдельное восклицание для естественности и силы по-русски.
