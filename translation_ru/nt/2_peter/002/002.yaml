  text: καὶ πολλοὶ ἐξακολουθήσουσιν αὐτῶν ταῖς ἀσελγείαις, δι’ οὓς ἡ ὁδὸς τῆς ἀληθείας βλασφημηθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/002.yaml
  text: And many will follow their sensuality[c][b][a], and because of them the way of the truth will be blasphemed.
translation:
  language: ru
  text: И многие последуют их распутству[a], и из-за них будут хулить путь истины[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разврату», «бесстыдству», «необузданности». Греческое слово означает бесстыдное, ничем не сдерживаемое поведение, часто с сексуальным оттенком.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будут поносить», «станут злословить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: многие
  rationale: Естественный и точный количественный эквивалент, сохраняющий неопределённо большое число.
- source_word: ἐξακολουθήσουσιν
  choice: последуют
  rationale: Передаёт будущее время и идею следования за людьми либо избранным ими путём без добавления отсутствующего в тексте пояснения.
- source_word: αὐτῶν ταῖς ἀσελγείαις
  choice: их распутству
  rationale: ἀσέλγεια обозначает бесстыдное, необузданное поведение, нередко с сексуальным оттенком. Русское «распутство» естественно и ёмко передаёт этот смысл; единственное число в русском обобщает греческое множественное.
- source_word: δι’ οὓς
  choice: из-за них
  rationale: διά с винительным падежом выражает здесь причину; местоимение может грамматически относиться к тем, кто следует распутству, при сохранении контекстуальной связи с лжеучителями.
- source_word: ἡ ὁδὸς τῆς ἀληθείας
  choice: путь истины
  rationale: Сохраняет метафору пути и родительную конструкцию; в современном русском артикли греческого текста не требуют формы «путь этой истины».
- source_word: βλασφημηθήσεται
  choice: будут хулить
  rationale: 'Активная неопределённо-личная конструкция естественнее русского страдательного «будет хулим» и точно передаёт будущее пассивное значение: путь истины станет объектом злоречия и поношения.'
theological_decisions:
- issue: Смысл выражения «путь истины»
  choice: Сохранена формулировка «путь истины» как обозначение истинной веры и соответствующего ей образа жизни.
  alternative: «истинный путь» или прямо «христианская вера»
  rationale: Буквенная метафора сохраняет широту выражения и не сводит его только к вероучению или только к нравственному поведению.
- issue: Объём значения ἀσέλγεια
  choice: «распутство» с примечанием о более широком значении
  alternative: «разврат», «бесстыдство», «необузданность»
  rationale: Слово часто имеет сексуальный оттенок, но обозначает также более широкое бесстыдное и необузданное поведение; примечание сохраняет эту смысловую широту.
- issue: Сила βλασφημέω применительно к «пути истины»
  choice: «будут хулить»
  alternative: «будут поносить», «станут злословить»
  rationale: «Хулить» сохраняет серьёзность глагола, не утверждая непременно узкий технический смысл богохульства.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Синтаксис краток и прозрачен; «последуют их распутству» намеренно сохраняет образ следования, а неопределённо-личное «будут хулить» звучит естественнее формального страдательного оборота.
