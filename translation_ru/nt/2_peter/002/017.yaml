base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/017.yaml
  text: These are waterless springs and mists driven by a storm[b][a], for whom the gloom of darkness has been kept.
translation:
  language: ru
  text: Это безводные источники и туманы[a], гонимые бурей; для них сохранён мрак тьмы.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «облака». Греческое слово точнее означает «туманы» или «мгла», хотя его иногда передают более общим словом «облака».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для них сохранена непроглядная тьма».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πηγαὶ ἄνυδροι
  choice: безводные источники
  rationale: πηγή обозначает прежде всего природный источник, а не выкопанный колодец; ἄνυδρος означает «лишённый воды». Перевод сохраняет парадоксальный образ источников, от которых ожидают воды, но в которых её нет.
- source_word: ὁμίχλαι
  choice: туманы
  rationale: ὁμίχλη точнее обозначает туман или мглу. Множественное число «туманы» соответствует форме оригинала и передаёт образ неустойчивого атмосферного явления.
- source_word: ὑπὸ λαίλαπος ἐλαυνόμεναι
  choice: гонимые бурей
  rationale: λαῖλαψ — сильная буря или вихрь, а ἐλαύνω здесь означает «гнать, увлекать». Краткое причастное выражение сохраняет пассивный образ оригинала.
- source_word: οἷς
  choice: для них
  rationale: Местоимение возвращает читателя от образов источников и туманов к людям, обозначенным словом Οὗτοι («это»). «Для них» ясно сохраняет личный референт.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: мрак тьмы
  rationale: ζόφος означает густой, зловещий мрак, а σκότος — тьму. Формулировка сохраняет оба существительных и усилительный характер сочетания, не сводя его к одному прилагательному.
- source_word: τετήρηται
  choice: сбережён
  rationale: Перфект страдательного залога указывает, что этот мрак был сохранён или предназначен и остаётся таковым. «Сбережён» передаёт результативное состояние и не называет подразумеваемого деятеля.
theological_decisions:
- issue: Суд в заключительной части стиха и подразумеваемый деятель
  choice: Сохранить безличную страдательную конструкцию «для них сбережён», не добавляя имени Бога.
  alternative: «Бог уготовил им» или иная конструкция с явно названным божественным деятелем.
  rationale: Текст подразумевает Божий суд, но прямо не называет совершающего действие. Перевод сохраняет это умолчание и не вносит дополнительного утверждения.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным, но понятным синтаксисом. Образность оригинала и намеренное нагромождение слов со значением тьмы сохранены; архаичные «тьма кромешная» и «мгла мрака» не использованы.
