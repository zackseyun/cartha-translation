source:
  edition: SBLGNT
  text: ταῦτα γὰρ ὑμῖν ὑπάρχοντα καὶ πλεονάζοντα οὐκ ἀργοὺς οὐδὲ ἀκάρπους καθίστησιν εἰς τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐπίγνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/008.yaml
  text: For if these things are yours and are increasing[c][b][a], they keep you from being ineffective or unfruitful in the knowledge of our Lord Jesus the Messiah.
translation:
  language: ru
  text: Ибо всё это, пребывая у вас и умножаясь[a], не сделает вас бездеятельными или бесплодными в познании[b] нашего Господа Иисуса Мессии[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «имеется в изобилии».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в полном познании».'
    reason: lexical_alternative
  - marker: c
    text: Греч. «Иисуса Христа»; здесь Χριστός переведено как титул «Мессия».
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: всё это
  rationale: Указательное местоимение отсылает к перечисленному в стихах 5–7; «всё это» естественно сохраняет эту связь, не добавляя пояснительного «качества».
- source_word: ὑμῖν ὑπάρχοντα
  choice: есть у вас
  rationale: Сочетание дательного местоимения с ὑπάρχω выражает наличие у читателей или принадлежность им; русское «есть у вас» сохраняет оба оттенка, не сводя смысл только к внутреннему пребыванию.
- source_word: πλεονάζοντα
  choice: умножается
  rationale: Передаёт идею возрастания и изобилия и хорошо согласуется с контекстом духовного роста.
- source_word: ἀργούς
  choice: бездеятельными
  rationale: Слово обозначает праздность, отсутствие действенности или полезного труда; «бездеятельными» сохраняет связь с отсутствием деятельности и образует ясную пару с «бесплодными».
- source_word: ἀκάρπους
  choice: бесплодными
  rationale: Сохраняет исходную метафору отсутствия плода и звучит естественно в современном литературном русском языке.
- source_word: καθίστησιν
  choice: не позволит вам оставаться
  rationale: 'В данном контексте глагол имеет результативный смысл: наличие и возрастание перечисленного не оставляет читателей бездеятельными и бесплодными. Такая формулировка естественно передаёт греческое отрицание οὐκ… οὐδὲ.'
- source_word: εἰς τὴν … ἐπίγνωσιν
  choice: в познании
  rationale: «В познании» естественно выражает сферу, применительно к которой читатели не должны быть бездеятельными или бесплодными, и сохраняет процессуальный оттенок русского слова «познание».
- source_word: κυρίου
  choice: Господа
  rationale: Обычное и уместное русское обозначение κύριος как христологического титула.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός передан по смыслу как титул «Мессия», а не оставлен без перевода в форме «Христос».
theological_decisions:
- issue: Передача Χριστοῦ в сочетании Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  alternative: Иисуса Христа
  rationale: Форма «Мессия» явно передаёт смысл греческого титула «Помазанник» и не превращает его незаметно в часть имени; традиционная русская форма отмечена в сноске.
- issue: Характер связи причастий ὑπάρχοντα καὶ πλεονάζοντα с главным глаголом
  choice: условная формулировка «если…»
  alternative: причинная формулировка «поскольку…»
  rationale: В греческом нет отдельной условной частицы, а причастия допускают обстоятельственное прочтение. Условная русская конструкция естественно описывает действительность и возрастание этих качеств, не утверждая автоматически, что они уже присутствуют у каждого адресата.
translation_notes:
  register: Современный литературный русский язык с достоинством новозаветного послания. Синтаксис сделан ясным для обычного читателя; сохранены метафора плодотворности, анафорическое «всё это» и неоднозначность оттенка ἐπίγνωσις через сноску.
