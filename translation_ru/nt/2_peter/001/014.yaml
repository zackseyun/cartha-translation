  text: εἰδὼς ὅτι ταχινή ἐστιν ἡ ἀπόθεσις τοῦ σκηνώματός μου, καθὼς καὶ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς ἐδήλωσέν μοι·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/014.yaml
  text: knowing that the putting off of my tent is near[c][b][a], just as our Lord Jesus the Messiah made clear to me.
translation:
  language: ru
  text: зная, что скоро произойдёт снятие моей палатки[a][b], как и дал мне понять наш Господь Иисус Мессия[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оставление» или «отложение моей палатки». Пётр образно говорит о своей близкой смерти как об оставлении временного жилища.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «снятие моей палатки будет быстрым». Греческое слово может указывать как на скорое наступление, так и на быстроту события.'
    reason: ambiguity
  - marker: c
    text: 'Традиционно: «Иисус Христос». Греческое Χριστός означает «Помазанник», то есть «Мессия».'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδὼς
  choice: зная
  rationale: Деепричастие сохраняет зависимость причастного оборота от предыдущего высказывания и не делает причинное значение более явным, чем в греческом тексте.
- source_word: ταχινή
  choice: скоро
  rationale: В данном предикативном употреблении слово указывает на скорое наступление события; «скоро» естественно по-русски и не усиливает смысл до безусловной немедленности.
- source_word: ἀπόθεσις
  choice: сниму с себя
  rationale: Глагольная передача отвлечённого существительного делает фразу естественной по-русски, сохраняя образ снятия или откладывания, а не заменяя его прямым упоминанием смерти.
- source_word: σκηνώματός
  choice: палатку
  rationale: Слово обозначает палатку, временное жилище. Такой перевод сохраняет телесную метафору и понятнее современному читателю, чем «скиния».
- source_word: καθὼς καὶ
  choice: как и
  rationale: Естественно передаёт сопоставление и подтверждение, выраженные греческим сочетанием.
- source_word: κύριος
  choice: Господь
  rationale: Обычный русский титул, соответствующий κύριος в данном христологическом контексте.
- source_word: Ἰησοῦς Χριστός
  choice: Иисус Мессия
  rationale: Χριστός передано по значению как титул «Мессия», а не как фамильная часть имени; отсутствие артикля в греческом не требует добавлять отдельное определительное слово в русском.
- source_word: ἐδήλωσέν
  choice: дал понять
  rationale: Передаёт значение «сделал ясным, сообщил» естественным современным русским выражением, не уточняя способ сообщения.
- source_word: μοι
  choice: мне
  rationale: Передаёт дательный падеж адресата.
theological_decisions:
- issue: Образ предстоящей смерти Петра
  choice: Сохранить метафору снятия с себя палатки.
  alternative: 'Перевести прямо: «скоро умру» или «моя смерть близка».'
  rationale: Греческий текст не называет смерть прямо, а изображает телесную жизнь как пребывание во временном жилище. Сохранение образа удерживает богословскую выразительность и не устраняет намеренную метафоричность.
- issue: Временной оттенок ταχινή
  choice: Передать как «скоро».
  alternative: «близко» или «будет быстрым».
  rationale: Форма допускает оттенок скорого наступления либо быстроты события. Основной перевод выбирает наиболее естественное контекстуальное понимание, а примечание сохраняет альтернативу.
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Здесь Χριστός входит в полное именование Иисуса, но сохраняет титульное значение «Помазанник»; перевод «Мессия» делает это значение доступным современному читателю.
translation_notes:
  register: Современный литературный русский с достоинством апостольского послания. Необычный образ «снять с себя палатку» намеренно сохранён, но греческая именная конструкция преобразована в естественную русскую глагольную. Порядок «наш Господь» выбран как современный и ясный; «Иисус Мессия» сохраняет титульность Χριστός.
