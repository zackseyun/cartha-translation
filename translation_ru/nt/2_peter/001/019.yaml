source:
  edition: SBLGNT
  text: καὶ ἔχομεν βεβαιότερον τὸν προφητικὸν λόγον, ᾧ καλῶς ποιεῖτε προσέχοντες ὡς λύχνῳ φαίνοντι ἐν αὐχμηρῷ τόπῳ, ἕως οὗ ἡμέρα διαυγάσῃ καὶ φωσφόρος ἀνατείλῃ ἐν ταῖς καρδίαις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/019.yaml
  text: And we have the prophetic word more certain[a], to which you do well to pay attention as to a lamp shining in a dark place[b], until the day dawns and the morning star rises in your hearts.
translation:
  language: ru
  text: И мы имеем более достоверное пророческое слово[a], которому вы хорошо делаете, что внимаете, как светильнику, сияющему в тёмном месте, пока не забрезжит день и не взойдёт утренняя звезда в ваших сердцах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И у нас есть более верное пророческое слово». Греческий текст можно понимать либо как указание на то, что апостольское свидетельство подтверждает пророческое слово, либо как подчёркивание особой надёжности самого пророческого слова.'
    reason: alternative_reading
  - marker: b
    text: Образ «утренней звезды» может иметь мессианский оттенок; ср. Отк. 22:16.
    reason: cross_reference
lexical_decisions:
- source_word: βεβαιότερον
  choice: ещё твёрже для нас
  rationale: Сохраняет сравнительную степень и естественно передаёт надёжность или подтверждённость пророческого слова, не добавляя отсутствующего в греческом глагола «сделано».
- source_word: τὸν προφητικὸν λόγον
  choice: пророческое слово
  rationale: Прямое и привычное соответствие, сохраняющее определение προφητικόν и многозначность λόγος.
- source_word: ᾧ καλῶς ποιεῖτε προσέχοντες
  choice: Вы хорошо делаете, что обращаетесь к нему
  rationale: Естественная современная русская формулировка со значением внимательного отношения; местоимение соотнесено с «словом».
- source_word: λύχνῳ φαίνοντι
  choice: светильнику, сияющему
  rationale: Сохраняет образ светильника и продолжающееся действие причастия.
- source_word: ἐν αὐχμηρῷ τόπῳ
  choice: в тёмном месте
  rationale: Передаёт мрачность и отсутствие света, согласуясь с образом сияющего светильника.
- source_word: ἡμέρα διαυγάσῃ
  choice: не забрезжит день
  rationale: Русский глагол «забрезжить» естественно выражает наступление рассвета и появление света.
- source_word: φωσφόρος
  choice: утренняя звезда
  rationale: Контекстуальное обозначение звезды, возвещающей наступление дня; сохраняет образ без явного истолкования его референта.
- source_word: ἀνατείλῃ
  choice: не взойдёт
  rationale: Обычный русский глагол для восхода небесного светила.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: в ваших сердцах
  rationale: Формально точная и естественная передача библейского обозначения внутреннего человека.
theological_decisions:
- issue: Смысл сравнительной формы βεβαιότερον и её связь с апостольским свидетельством
  choice: «пророческое слово ещё твёрже для нас»
  alternative: «мы имеем более верное пророческое слово»; «пророческое слово стало ещё твёрже»
  rationale: Греческая фраза допускает как акцент на подтверждении пророческого слова предшествующим свидетельством, так и утверждение его особой надёжности. Основной текст сохраняет сравнительность, а примечание обозначает неоднозначность.
- issue: Референт образа φωσφόρος
  choice: Образ сохранён как «утренняя звезда» без пояснения в основном тексте
  alternative: Явно отождествить утреннюю звезду с Христом или с эсхатологическим просвещением
  rationale: В стихе референт прямо не назван. Перевод сохраняет возможный мессианский оттенок, не превращая его в добавленное толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Синтаксис сделан ясным для обычного читателя; образность оригинала и его богословская неоднозначность сохранены.
