id: 2PE.1.9
reference: 2 Peter 1:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ᾧ γὰρ μὴ πάρεστιν ταῦτα, τυφλός ἐστιν μυωπάζων, λήθην λαβὼν τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ⸀ἁμαρτημάτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/009.yaml
  text: For whoever lacks these things is blind[a], being shortsighted[b], having forgotten the cleansing of his former sins.
translation:
  language: ru
  text: 'Ведь тот, у кого нет этого[a], слеп и близорук[b]: он забыл об очищении от своих прежних грехов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «этих качеств». Речь идёт о добродетелях, перечисленных выше.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «видит лишь то, что близко».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ γὰρ μὴ πάρεστιν ταῦτα
  choice: Ведь тот, у кого нет этого
  rationale: Оборот передаёт отсутствие у человека перечисленных выше добродетелей; «этого» сохраняет указательный характер ταῦτα и естественно звучит по-русски.
- source_word: τυφλός
  choice: слеп
  rationale: Прямо сохраняет метафору духовной слепоты.
- source_word: μυωπάζων
  choice: близорук
  rationale: Передаёт образ ограниченного зрения, не устраняя намеренное напряжение между слепотой и близорукостью.
- source_word: λήθην λαβὼν
  choice: он забыл
  rationale: Греческая идиома буквально означает «приняв забвение»; по-русски её смысл естественно передаётся глаголом «забыл».
- source_word: καθαρισμοῦ
  choice: очищении
  rationale: «Очищение» доступно современному читателю и сохраняет религиозно-нравственный образ устранения нечистоты.
- source_word: τῶν πάλαι αὐτοῦ ἁμαρτημάτων
  choice: от своих прежних грехов
  rationale: «Прежних» передаёт временное значение πάλαι, а возвратное «своих» ясно связывает грехи с упомянутым человеком.
theological_decisions:
- issue: Связь очищения с грехами в конструкции τοῦ καθαρισμοῦ τῶν ... ἁμαρτημάτων
  choice: очищении от своих прежних грехов
  alternative: очищении своих прежних грехов
  rationale: Родительный падеж допускает формально более буквальную конструкцию, но русский оборот «очищение от грехов» естественно выражает избавление от них и не добавляет уточнения о способе очищения.
- issue: Соотношение образов τυφλός и μυωπάζων
  choice: слеп и близорук
  alternative: слеп, видит лишь то, что близко
  rationale: Сохранены оба образа и их смысловое напряжение; перевод не сводит один образ к пояснению другого.
translation_notes:
  register: Современный литературный русский язык с ясной, краткой синтаксической структурой. Двоеточие делает связь последнего причастного оборота с характеристикой человека понятной, не превращая её в отдельное причинное утверждение.
