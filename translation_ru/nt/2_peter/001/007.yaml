  text: ἐν δὲ τῇ εὐσεβείᾳ τὴν φιλαδελφίαν, ἐν δὲ τῇ φιλαδελφίᾳ τὴν ἀγάπην·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/007.yaml
  text: and in godliness[a], brotherly affection; and in brotherly affection, love.
translation:
  language: ru
  text: а к благочестию — братскую привязанность[a], а к братской привязанности — любовь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братскую любовь». Греческое слово означает тёплую любовь и привязанность к братьям и сёстрам, особенно к единоверцам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσεβείᾳ
  choice: благочестию
  rationale: «Благочестие» передаёт почтительное отношение к Богу, проявляющееся в образе жизни, и остаётся понятным в современном литературном русском языке.
- source_word: φιλαδελφίαν
  choice: братскую привязанность
  rationale: Выражение передаёт тёплое семейное расположение к братьям и сёстрам, прежде всего к единоверцам, и сохраняет отличие от следующего более широкого понятия ἀγάπη.
- source_word: ἀγάπην
  choice: любовь
  rationale: Простое «любовь» точно передаёт ἀγάπη и сохраняет кульминацию ряда после братской привязанности, не сужая возможный круг тех, на кого направлена любовь.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: а к ... — ...
  rationale: Русская конструкция естественно продолжает начатый в предыдущих стихах призыв дополнять одно качество другим. Повтор конструкции сохраняет ступенчатое построение греческого текста, хотя греческое ἐν буквально выражает сферу или связь внутри ряда.
- source_word: δέ
  choice: а
  rationale: В перечне δέ служит связкой между последовательными звеньями; русское «а» естественно обозначает переход к следующему качеству без сильного противопоставления.
theological_decisions:
- issue: Разграничение φιλαδελφία и ἀγάπη в последовательности добродетелей
  choice: Передать φιλαδελφία как «братская привязанность», а ἀγάπη как «любовь»
  alternative: Передать φιλαδελφία как «братская любовь», а ἀγάπη как «любовь»
  rationale: В греческом тексте последовательно употреблены два близких, но разных слова. Выбранный перевод сохраняет различие и возможное движение от тёплого отношения внутри общины к любви в более широком смысле, не превращая это движение в догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Строчная начальная буква и повтор «а к» показывают, что стих продолжает единый перечень, начатый ранее; тире делает эллиптическую конструкцию ясной.
