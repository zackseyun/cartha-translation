  text: δι’ ὧν τὰ ⸂τίμια καὶ μέγιστα ἡμῖν⸃ ἐπαγγέλματα δεδώρηται, ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως, ἀποφυγόντες τῆς ἐν ⸀τῷ κόσμῳ ἐν ἐπιθυμίᾳ φθορᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/004.yaml
  text: through which he has granted to us his precious and very great promises[a], so that through these you may become sharers in the divine nature[b], having escaped the corruption that is in the world because of sinful desire.
translation:
  language: ru
  text: Через них Он даровал нам драгоценные и величайшие обещания, чтобы благодаря этим обещаниям вы стали причастниками божественной природы[a], избежав растления, которое существует в мире из-за греховного желания[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «участниками божественной природы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из-за желания» или «из-за похоти». Греческое слово может означать желание вообще, но в этом контексте имеет отрицательный нравственный смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὧν
  choice: Через них
  rationale: διά с родительным падежом выражает посредство. Местоимение сохраняет связь с предшествующим стихом, не уточняя спорный антецедент.
- source_word: τίμια καὶ μέγιστα
  choice: драгоценные и величайшие
  rationale: «Драгоценные» естественно передаёт τίμια, а «величайшие» сохраняет превосходную степень μέγιστα и звучит по-русски торжественно, но понятно.
- source_word: ἡμῖν
  choice: нам
  rationale: Дательный падеж обозначает получателей дара и прямо передаётся русским «нам».
- source_word: ἐπαγγέλματα
  choice: обещания
  rationale: Обычное и ясное соответствие слову ἐπάγγελμα в контексте Божьих обетований; выбрано общеупотребительное «обещания», понятное современному читателю.
- source_word: δεδώρηται
  choice: Он даровал
  rationale: «Даровал» передаёт безвозмездный характер δωρέομαι; совершенный вид отражает совершившееся дарование. Подлежащее «Он» восстанавливается из контекста стиха 3.
- source_word: ἵνα
  choice: чтобы
  rationale: Союз естественно передаёт целевое значение ἵνα.
- source_word: διὰ τούτων
  choice: благодаря этим обещаниям
  rationale: Инструментальное значение διά сохранено; существительное повторено для ясности, поскольку указательное местоимение относится к только что названным обещаниям.
- source_word: γένησθε
  choice: вы стали
  rationale: Форма γίνομαι обозначает становление, а не просто состояние; сослагательно-целевой оттенок выражен конструкцией с «чтобы».
- source_word: θείας κοινωνοὶ φύσεως
  choice: причастниками божественной природы
  rationale: «Причастники» передаёт реальное участие, выраженное κοινωνοί, а «божественная природа» точно и без ослабления сохраняет θείας φύσεως.
- source_word: ἀποφυγόντες
  choice: избежав
  rationale: Деепричастие сохраняет зависимую причастную конструкцию и представляет избавление как действие, связанное со становлением причастниками.
- source_word: φθορᾶς
  choice: растления
  rationale: В данном нравственном контексте «растление» лучше, чем физическое «разложение», передаёт губительную нравственную порчу.
- source_word: ἐν τῷ κόσμῳ
  choice: которое существует в мире
  rationale: Относительная конструкция ясно связывает оборот с «растлением» и сохраняет его локализацию в мире.
- source_word: ἐν ἐπιθυμίᾳ
  choice: из-за греховного желания
  rationale: Предлог ἐν допускает инструментально-причинное понимание. Контекст придаёт ἐπιθυμία отрицательный нравственный смысл; «греховное желание» не сужает значение исключительно до сексуальной похоти.
theological_decisions:
- issue: θείας κοινωνοὶ φύσεως и участие в божественной природе
  choice: причастниками божественной природы
  alternative: участниками божественной природы
  rationale: Сохранена сильная формулировка оригинала без сведения её лишь к нравственному подражанию и без утверждения, что люди становятся божественными по сущности. Пояснение вынесено в сноску, а не внесено в основной текст.
- issue: Нравственная окраска ἐπιθυμία
  choice: греховного желания
  alternative: желания; похоти
  rationale: Само слово может обозначать желание вообще, однако его связь с мировым растлением здесь требует отрицательного смысла. «Похоть» могла бы неоправданно сузить значение до сексуальной сферы.
- issue: Связь ἀποφυγόντες с главным высказыванием
  choice: избежав
  alternative: после того как избежали; избегая
  rationale: Деепричастная форма сохраняет связь избавления от мирового растления с участием в божественной природе, не уточняя сверх текста точное временное или причинное отношение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Даровал», «причастниками» и «растления» сохраняют достоинство и богословскую насыщенность текста, оставаясь понятными обычному читателю. Маркеры сносок поставлены при тех выражениях, которые они действительно поясняют.
