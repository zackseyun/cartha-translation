id: 2PE.1.12
reference: 2 Peter 1:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Διὸ ⸀μελλήσω ἀεὶ ὑμᾶς ὑπομιμνῄσκειν περὶ τούτων, καίπερ εἰδότας καὶ ἐστηριγμένους ἐν τῇ παρούσῃ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/012.yaml
  text: Therefore I will always be ready to remind you about these things[a], even though you know them and have been established in the present truth.
translation:
  language: ru
  text: Поэтому я намерен всегда напоминать вам об этом, хотя вы и знаете это и утверждены в истине, которая ныне с вами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в истине, которую вы теперь имеете».'
    reason: Лексическая альтернатива для ἐν τῇ παρούσῃ ἀληθείᾳ, допускающего понимание истины как ныне доступной или принадлежащей читателям.
lexical_decisions:
- source_word: Διὸ
  choice: Поэтому
  rationale: Передаёт вывод, следующий из предшествующего рассуждения, и естественно связывает стих с контекстом.
- source_word: μελλήσω
  choice: я намерен
  rationale: Будущая форма μέλλω с инфинитивом здесь выражает намерение и решимость Петра постоянно напоминать читателям, а не только близкое будущее действие.
- source_word: ἀεὶ
  choice: всегда
  rationale: Прямо передаёт идею постоянного или повторяющегося действия.
- source_word: ὑπομιμνῄσκειν
  choice: напоминать
  rationale: Естественный русский эквивалент со значением побуждать помнить; повторяемость уже выражена словом «всегда».
- source_word: περὶ τούτων
  choice: об этом
  rationale: Нормальная современная русская передача περί с родительным падежом; единственное собирательное «об этом» относится ко всему сказанному выше.
- source_word: καίπερ
  choice: хотя ... и
  rationale: Ясно и естественно передаёт уступительное значение.
- source_word: εἰδότας
  choice: вы и знаете это
  rationale: Причастие согласуется с ὑμᾶς; дополнение «это» естественно восполняет отсылку к τούτων.
- source_word: ἐστηριγμένους
  choice: утверждены
  rationale: Передаёт совершенный пассив и сохраняющееся состояние твёрдости без излишнего истолкования.
- source_word: ἐν τῇ παρούσῃ ἀληθείᾳ
  choice: в истине, которая ныне с вами
  rationale: Передаёт παρούσῃ как присутствующую у адресатов истину, избегая возможного ошибочного понимания «нынешней истины» как истины, действительной лишь в особую эпоху.
theological_decisions:
- issue: Значение выражения ἐν τῇ παρούσῃ ἀληθείᾳ
  choice: в истине, которая ныне с вами
  alternative: в нынешней истине; в истине, которую вы теперь имеете
  rationale: Греческий текст не определяет выражение как специальный термин для отдельной эпохи. Формулировка сохраняет идею истины, присутствующей у читателей, и не навязывает конфессиональной схемы.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. «Намерен» естественно выражает решимость; «утверждены» сохраняет традиционно понятную и точную богословскую лексику. Маркер сноски помещён непосредственно после относящейся к нему фразы.
