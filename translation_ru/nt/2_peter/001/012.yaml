  verdict: approve
  source_fidelity: Текст точно передаёт логическую связь Διό («Поэтому»), намеренно-перспективный оттенок μελλήσω («я намерен»), повторяемость ἀεί («всегда»), уступление καίπερ («хотя ... и»), а также совершенное пассивное состояние ἐστηριγμένους («утверждены»). Собирательное «об этом» естественно отсылает к τούτων и не меняет смысла.
  naturalness: Формулировка звучит по-современному и литературно, сохраняя уместный библейский регистр. Сочетания «хотя вы и знаете это» и «утверждены в истине» ясны и естественны. «Истина, которая ныне с вами» несколько возвышенно, но соответствует регистру и осмысленно передаёт παρούσῃ.
  terminology: «Утверждены» — удачный, понятный и богословски нейтральный эквивалент ἐστηριγμένους. Выражение о «ныне» присутствующей истине не превращено в специальный доктринальный термин. Сноска уместно фиксирует лексически возможную альтернативу без навязывания толкования.
