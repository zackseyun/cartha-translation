source:
  edition: SBLGNT
  text: Οὐ γὰρ σεσοφισμένοις μύθοις ἐξακολουθήσαντες ἐγνωρίσαμεν ὑμῖν τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ δύναμιν καὶ παρουσίαν, ἀλλ’ ἐπόπται γενηθέντες τῆς ἐκείνου μεγαλειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/016.yaml
  text: For we did not make known to you the power and coming of our Lord Jesus the Messiah by following cleverly devised myths[b][a], but by becoming eyewitnesses of his majesty.
translation:
  language: ru
  text: Ибо мы возвестили вам о силе и пришествии[a] Господа нашего Иисуса, Мессии[b], не следуя искусно сочинённым мифам, но став очевидцами его величия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «присутствии» либо «прибытии». Греческое παρουσία может означать присутствие, прибытие или, во многих новозаветных контекстах, пришествие Мессии.'
    reason: alternative_reading
  - marker: b
    text: Греч. «Христа»; здесь переведено «Мессии», поскольку Χριστός употреблено как титул.
    reason: lexical_alternative
lexical_decisions:
- source_word: σεσοφισμένοις μύθοις
  choice: искусно сочинённым мифам
  rationale: Причастие от σοφίζω передаёт мысль об умело придуманных или изощрённо составленных повествованиях; «искусно сочинённым» сохраняет и рукотворность, и отрицательную окраску выражения.
- source_word: ἐξακολουθήσαντες
  choice: последовали
  rationale: Глагол означает следовать чему-либо или руководствоваться этим. В русском причинная конструкция «не потому, что последовали» естественно выражает связь причастия с главным глаголом и готовит противопоставление ἀλλά.
- source_word: ἐγνωρίσαμεν
  choice: возвестили вам
  rationale: γνωρίζω означает сделать известным, сообщить. «Возвестили вам» соответствует публичному апостольскому сообщению и сохраняет адресата ὑμῖν, не превращая глагол в более узкое «доказали».
- source_word: δύναμιν
  choice: о силе
  rationale: Прямое и обычное соответствие δύναμις; предлог «о» добавлен ради естественного управления русского глагола «возвестить».
- source_word: παρουσίαν
  choice: пришествии
  rationale: В новозаветном контексте применительно к Иисусу παρουσία часто обозначает его ожидаемое пришествие. Лексическая возможность значений «присутствие» и «прибытие» сохранена в сноске.
- source_word: κυρίου
  choice: Господа
  rationale: κύριος употреблено как титул Иисуса; традиционное и точное русское соответствие — «Господь».
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь входит в титульное именование Иисуса и буквально соответствует понятию «Помазанник», то есть «Мессия». В сноске указано традиционное заимствованное соответствие «Христос».
- source_word: ἐπόπται
  choice: очевидцами
  rationale: ἐπόπτης обозначает человека, который видел нечто собственными глазами. «Очевидцы» ясно передаёт доказательную силу противопоставления мифам.
- source_word: γενηθέντες
  choice: стали
  rationale: Форма γίνομαι буквально указывает на то, что авторы «стали» очевидцами. Причинная конструкция по-русски естественно связывает этот факт с возвещением.
- source_word: μεγαλειότητος
  choice: величия
  rationale: μεγαλειότης означает величие, величественность или великолепие. «Величие» точно, достойно по регистру и не конкретизирует возможную отсылку к преображению сверх сказанного.
- source_word: ἐκείνου
  choice: его
  rationale: Указательное местоимение отсылает к Господу Иисусу Мессии; русское притяжательное «его» передаёт эту связь естественно и без ненужной тяжеловесности.
theological_decisions:
- issue: Значение παρουσία в христологическом контексте
  choice: пришествие
  alternative: присутствие; прибытие
  rationale: В раннехристианском употреблении слово часто относится к будущему явлению Иисуса, однако само по себе допускает значения присутствия и прибытия. Основной текст передаёт наиболее вероятный контекстуальный смысл, а сноска сохраняет подлинную лексическую широту.
- issue: Передача Χριστοῦ как титула или традиционного имени
  choice: Мессия
  alternative: Христос
  rationale: В сочетании «Господь Иисус Мессия» титульное значение Χριστός остаётся различимым. «Мессия» раскрывает смысл титула, тогда как традиционная форма «Христос» отмечена в сноске.
- issue: Связь причастий с глаголом возвещения
  choice: не потому, что… а потому, что…
  alternative: не следуя… но став…
  rationale: Греческие причастия допускают инструментально-обстоятельственное понимание. Русская причинная пара ясно сохраняет контраст между выдуманными мифами и непосредственным свидетельством, не утверждая более узкой причинности, чем предполагает контекст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формула «не потому, что… а потому, что…» делает длинное греческое предложение понятным обычному читателю, сохраняя его основное противопоставление. Написание «Мессия» раскрывает титул; местоимение «его» оставлено со строчной буквы в соответствии с нейтральной современной орфографией и без внесения конфессиональной практики капитализации.
