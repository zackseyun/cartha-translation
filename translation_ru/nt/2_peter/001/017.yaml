source:
  edition: SBLGNT
  text: λαβὼν γὰρ παρὰ θεοῦ πατρὸς τιμὴν καὶ δόξαν φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε ὑπὸ τῆς μεγαλοπρεποῦς δόξης· ⸂Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν⸃, εἰς ὃν ἐγὼ εὐδόκησα—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/017.yaml
  text: 'For when he received honor and glory from God the Father[a], such a voice was borne to him from the Majestic Glory: “This is my Son, my Beloved[c][b], in whom I am well pleased”—'
translation:
  language: ru
  text: 'Ведь Он принял от Бога Отца честь и славу, когда от Величественной Славы[a] к Нему донёсся такой голос: «Это Сын Мой, Возлюбленный Мой[b], Которым Я доволен[c]», —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Величественной Славой». Греческий предлог ὑπό может обозначать действующее лицо; перевод «от Величественной Славы» естественнее подчёркивает источник голоса.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Это Мой возлюбленный Сын». Буквальнее по-гречески: «Это Сын Мой, Возлюбленный Мой».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «к Которому Я благоволю» или «в Котором Я нашёл отраду». Греческое выражение буквально использует предлог «в/к» и глагол в прошедшем времени; оно перекликается с рассказами Евангелий о крещении и преображении Иисуса.'
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν γὰρ
  choice: Ведь Он принял
  rationale: Аористное причастие передано личной формой ради естественного русского синтаксиса; γάρ передано словом «ведь», связывающим стих с предшествующим утверждением.
- source_word: παρὰ θεοῦ πατρὸς
  choice: от Бога Отца
  rationale: παρά с родительным обозначает источник; выражение прямо и естественно сохраняет оба наименования.
- source_word: τιμὴν καὶ δόξαν
  choice: честь и славу
  rationale: Сохранены оба самостоятельных существительных и их обычные библейские соответствия.
- source_word: φωνῆς ἐνεχθείσης αὐτῷ
  choice: к Нему донёсся ... голос
  rationale: Греческий родительный самостоятельный передан придаточным времени. «Донёсся» естественно выражает движение голоса к адресату, не устраняя указание на его источник.
- source_word: τοιᾶσδε
  choice: такой
  rationale: Указательное слово предваряет содержание последующей прямой речи и естественно передаётся по-русски словом «такой».
- source_word: ὑπὸ τῆς μεγαλοπρεποῦς δόξης
  choice: от Величественной Славы
  rationale: «От» естественно обозначает источник голоса; прописные буквы отмечают вероятное благоговейное именование Божьего присутствия, не заменяя его пояснительным толкованием.
- source_word: Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν
  choice: Это Сын Мой, Возлюбленный Мой
  rationale: Сохранены приложение, повтор притяжательного местоимения и выделенность ἀγαπητός, которые были бы сглажены в варианте «Мой возлюбленный Сын».
- source_word: εἰς ὃν ἐγὼ εὐδόκησα
  choice: Которым Я доволен
  rationale: Так естественно по-русски передаётся идиоматическое значение εὐδοκέω с εἰς. Формулировка сохраняет личное одобрение Отца, не придавая предлогу неестественного пространственного смысла.
theological_decisions:
- issue: Благоговейное именование τῆς μεγαλοπρεποῦς δόξης
  choice: Величественная Слава
  alternative: величественная слава; Божественное Величие
  rationale: Греческое выражение, вероятно, служит иносказательным обозначением Бога в славе. Перевод сохраняет образ и не подменяет его прямым пояснением.
- issue: Форма слов Отца о Сыне
  choice: Это Сын Мой, Возлюбленный Мой
  alternative: Это Мой возлюбленный Сын
  rationale: Выбранная форма сохраняет греческое приложение и повтор μου, не добавляя позднейшей богословской терминологии.
- issue: Передача εὐδόκησα
  choice: Которым Я доволен
  alternative: к Которому Я благоволю; в Котором Я нашёл отраду
  rationale: Аорист допускает оттенок состоявшегося проявления благоволения, однако в торжественном прямом высказывании он идиоматически выражает Божье одобрение. Примечание сохраняет возможные способы передачи времени и образности.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем. Необычная приложительная формула в прямой речи сохранена ради акцента оригинала. Конечные запятая и тире показывают, что предложение и свидетельство продолжаются в следующем стихе.
