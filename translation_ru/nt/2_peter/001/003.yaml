  text: Ὡς πάντα ἡμῖν τῆς θείας δυνάμεως αὐτοῦ τὰ πρὸς ζωὴν καὶ εὐσέβειαν δεδωρημένης διὰ τῆς ἐπιγνώσεως τοῦ καλέσαντος ἡμᾶς ⸂ἰδίᾳ δόξῃ καὶ ἀρετῇ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/003.yaml
  text: As his divine power has granted to us all things for life and godliness[a], through the knowledge of the one who called us by his own glory and excellence,
translation:
  language: ru
  text: Поскольку Его божественная сила даровала нам всё для жизни и благочестия через познание Того, Кто призвал нас собственной славой и доблестью[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к Своей собственной славе и доблести». Греческий оборот в дательном падеже допускает различное понимание.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς
  choice: Поскольку
  rationale: Оборот вводит основание последующего наставления. «Поскольку» естественно передаёт эту связь в русском языке, не превращая стих в самостоятельное законченное предложение.
- source_word: πάντα ... τὰ πρὸς ζωὴν καὶ εὐσέβειαν
  choice: всё для жизни и благочестия
  rationale: Кратко и естественно передаёт значение «всё относящееся к жизни и благочестию», не добавляя отсутствующего в греческом тексте слова «необходимое».
- source_word: τῆς θείας δυνάμεως αὐτοῦ
  choice: Его божественная сила
  rationale: Естественная русская передача родительной конструкции; «божественная» сохраняет прямой смысл θεῖος.
- source_word: δεδωρημένης
  choice: даровала
  rationale: Глагол выражает щедрое дарование; совершенный вид передаёт завершённость действия, тогда как сохраняющийся результат явствует из контекста.
- source_word: διὰ τῆς ἐπιγνώσεως
  choice: через познание
  rationale: «Познание» сохраняет как предметный, так и личностный оттенок ἐπίγνωσις и естественно сочетается с указанием на Призвавшего.
- source_word: τοῦ καλέσαντος ἡμᾶς
  choice: Того, Кто призвал нас
  rationale: Передаёт субстантивированное причастие лично и ясно, сохраняя действие призвания.
- source_word: ἰδίᾳ
  choice: Своей собственной
  rationale: Возвратное «Своей» однозначно связывает славу и совершенство с Призвавшим, а «собственной» сохраняет усиление принадлежности в ἰδίᾳ.
- source_word: δόξῃ
  choice: славой
  rationale: «Слава» — точная и устойчивая передача δόξα, допускающая значение божественного величия и его явления.
- source_word: ἀρετῇ
  choice: совершенством
  rationale: В данном сочетании обозначает превосходное качество или доблесть. «Совершенство» звучит современно и достойно и не сужает смысл до одной лишь нравственной добродетели.
- source_word: ζωὴν
  choice: жизни
  rationale: Сохраняет широту исходного слова без необоснованного уточнения, позволяя видеть как нынешний, так и эсхатологический смысл.
- source_word: εὐσέβειαν
  choice: благочестия
  rationale: Устоявшееся и понятное обозначение почтительной, обращённой к Богу жизни.
theological_decisions:
- issue: Значение дательного оборота ἰδίᾳ δόξῃ καὶ ἀρετῇ
  choice: Своей собственной славой и совершенством
  alternative: к Своей собственной славе и совершенству
  rationale: 'При тексте SBLGNT дательный падеж естественно понимать инструментально: призвание совершается посредством Его славы и совершенства. Возможное понимание как цели или направления призвания сохранено в сноске, чтобы не устранять реальную синтаксическую и богословскую неоднозначность.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Начальное «Поскольку» и конечная запятая сохраняют связь этого зависимого оборота с продолжением предложения в следующем стихе. Заглавные местоименные формы употреблены для ясного указания на Бога и в соответствии с распространённой русской библейской традицией.
