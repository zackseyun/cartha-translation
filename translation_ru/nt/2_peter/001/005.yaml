  text: καὶ αὐτὸ τοῦτο δὲ σπουδὴν πᾶσαν παρεισενέγκαντες ἐπιχορηγήσατε ἐν τῇ πίστει ὑμῶν τὴν ἀρετήν, ἐν δὲ τῇ ἀρετῇ τὴν γνῶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/005.yaml
  text: And for this very reason[a], making every effort, supply in your faith virtue, and in virtue knowledge[d][c][b],
translation:
  language: ru
  text: Именно поэтому, приложив все старания, дополните вашу веру добродетелью, а добродетель — знанием.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к вашей вере прибавьте добродетель, а к добродетели — знание». Глагол может означать «обеспечить», «снабдить», «щедро предоставить».'
    reason: lexical_alternative
  - marker: b
    text: '«Добродетель» — также: «нравственное совершенство».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸ τοῦτο δὲ
  choice: И потому
  rationale: Связывает призыв с основанием, изложенным в предыдущих стихах; по-русски естественно передаёт причинно-следственный переход без избыточной буквальности.
- source_word: σπουδὴν πᾶσαν παρεισενέγκαντες
  choice: приложите все старания
  rationale: Причастный оборот преобразован в форму повеления, естественную для русского языка и передающую необходимость деятельного, усердного участия.
- source_word: ἐπιχορηγήσατε
  choice: чтобы … проявлялась
  rationale: В данном ряду глагол означает деятельно обеспечивать наличие названных качеств. Такое выражение сохраняет связь качеств и избегает неестественного русского «снабдите в вере»; более буквальные варианты отмечены в сноске.
- source_word: ἐν τῇ πίστει ὑμῶν
  choice: вера ваша проявлялась в добродетели
  rationale: Повторяющаяся конструкция ἐν с дательным передана как отношение, в котором одно качество получает выражение в другом; это сохраняет структуру цепочки, не сводя её однозначно к простому арифметическому добавлению.
- source_word: πίστει
  choice: вера
  rationale: Основное значение πίστις в данном контексте; возможные оттенки доверия и верности не вынесены в основной текст, чтобы не перегружать стих.
- source_word: ἀρετήν
  choice: добродетель
  rationale: Точное и понятное обозначение нравственного достоинства; вариант «нравственное совершенство» возможен, но более пояснителен.
- source_word: γνῶσιν
  choice: знание
  rationale: Передаёт основное значение γνῶσις и не привносит более узких толкований вроде «проницательности».
theological_decisions:
- issue: Значение πίστις в перечне качеств
  choice: вера
  alternative: верность; доверие
  rationale: «Вера» сохраняет широкий смысл греческого слова и не решает без достаточного основания, идёт ли речь преимущественно о доверии или верности.
- issue: Связь качеств, выраженная повторением ἐν
  choice: одно качество проявляется в другом
  alternative: добавить одно качество к другому; снабдить одно качество другим
  rationale: Греческая конструкция допускает связь и развитие качеств, но не требует понимать перечень только как механическое прибавление. Основной текст сохраняет взаимосвязь, а буквальная альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис приспособлен к естественной русской речи, при этом сохранены последовательность качеств и смысловая напряжённость конструкции ἐν.
