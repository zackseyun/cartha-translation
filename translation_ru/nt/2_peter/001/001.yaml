source:
  edition: SBLGNT
  text: ⸀Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/001.yaml
  text: 'Simeon Peter[a], a servant and apostle of Jesus the Messiah[d][c][b], to those who have obtained a faith as precious as ours in the righteousness of our God and Savior Jesus the Messiah:'
translation:
  language: ru
  text: 'Симеон Пётр, раб и апостол Иисуса Мессии, — тем, кто получил веру, столь же драгоценную, как и наша[a], благодаря праведности[b] нашего Бога и Спасителя Иисуса Мессии[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен также перевод: «веру, равную нашей по чести и положению». Прилагательное может подчёркивать равную ценность, честь или привилегию.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможен также перевод: «в праведности» или «посредством праведности». Предлог может обозначать сферу или средство.'
    reason: lexical_alternative
  - marker: c
    text: По-гречески выражение наиболее естественно означает, что Иисус Мессия назван и «нашим Богом», и «Спасителем». Менее вероятное прочтение относит слова «наш Бог» и «Спаситель Иисус Мессия» к двум лицам.
    reason: alternative_reading
lexical_decisions:
- source_word: Συμεὼν Πέτρος
  choice: Симеон Пётр
  rationale: «Симеон» непосредственно передаёт форму Συμεών в SBLGNT, а «Пётр» — общепринятая русская форма имени Πέτρος.
- source_word: δοῦλος
  choice: раб
  rationale: Слово обозначает человека, полностью принадлежащего господину; «раб» сохраняет силу апостольского самообозначения и не сводит его к добровольному служению.
- source_word: ἀπόστολος
  choice: апостол
  rationale: Устоявшийся и точный русский термин для особо посланного представителя Иисуса.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός здесь передано как значимый титул «Мессия», а не только как ставшая привычной частью имени форма «Христос».
- source_word: τοῖς ... λαχοῦσιν
  choice: тем, кто получил
  rationale: Передаёт получение как данность, а не как достижение, не навязывая буквальный образ жребия.
- source_word: ἰσότιμον ἡμῖν ... πίστιν
  choice: веру, столь же драгоценную, как и наша
  rationale: ἰσότιμος выражает равную ценность, честь или положение; основной вариант естественен по-русски и подчёркивает равную ценность веры адресатов и апостолов.
- source_word: πίστιν
  choice: веру
  rationale: В данном контексте речь идёт об общей вере верующих, а не о верности Христа.
- source_word: ἐν δικαιοσύνῃ
  choice: в праведности
  rationale: Формально близкая передача сохраняет открытым вопрос, обозначает ли ἐν сферу или средство.
- source_word: δικαιοσύνῃ
  choice: праведности
  rationale: «Праведность» сохраняет широкий библейский смысл δικαιοσύνη; «справедливость» здесь уже и менее естественна.
- source_word: τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: нашего Бога и Спасителя Иисуса Мессии
  rationale: 'Единый артикль при двух личных существительных в единственном числе, соединённых καί, наиболее естественно указывает на одно лицо: Иисус назван и Богом, и Спасителем.'
theological_decisions:
- issue: Относится ли выражение «нашего Бога и Спасителя Иисуса Мессии» к одному лицу или к двум
  choice: 'Одно лицо: Иисус назван «нашим Богом и Спасителем».'
  alternative: 'Два лица: «наш Бог» и «Спаситель Иисус Мессия».'
  rationale: Греческая конструкция с одним артиклем перед двумя личными существительными в единственном числе, соединёнными καί, убедительно поддерживает единый референт. Богословски значимая, но грамматически менее вероятная двухреферентная трактовка сохранена в примечании.
- issue: Смысл предлога ἐν при δικαιοσύνῃ
  choice: Сохранена формально открытая передача «в праведности».
  alternative: «Благодаря праведности» или «посредством праведности».
  rationale: Предлог может обозначать как сферу, так и средство; основной текст не должен без необходимости устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского приветствия. Синтаксис остаётся достаточно близким к греческому, но относительная конструкция «тем, кто получил» делает фразу понятной современному читателю. Термин «раб» намеренно сохраняет сильный смысл полной принадлежности, а титул «Мессия» раскрывает значение Χριστός.
