id: 2PE.1.2
reference: 2 Peter 1:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη ἐν ἐπιγνώσει τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/002.yaml
  text: Grace to you and peace be multiplied in the knowledge of God and of Jesus our Lord[a][b].
translation:
  language: ru
  text: Благодать вам и мир да умножатся в познании Бога и Иисуса, Господа нашего[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через познание Бога и Иисуса, Господа нашего». Греческий предлог может указывать как на сферу («в»), так и на средство («через», «посредством»).'
    reason: alternative_reading
  - marker: b
    text: 'Или: «в полном познании». Греческое слово ἐπίγνωσις может иметь оттенок более полного или глубокого познания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: благодать
  rationale: Традиционное и содержательно ёмкое обозначение Божьего благоволения в апостольском приветствии.
- source_word: εἰρήνη
  choice: мир
  rationale: Естественная для библейского приветствия передача, сохраняющая также семитский оттенок целостного благополучия.
- source_word: πληθυνθείη
  choice: да умножатся
  rationale: Форма пожелания передаёт аористный пассивный оптатив и сохраняет образ умножения; множественное число согласуется с однородными подлежащими «благодать» и «мир».
- source_word: ἐν
  choice: в
  rationale: Прямое соответствие, позволяющее понять предлог как указание на сферу; возможное инструментальное значение «через» отмечено в сноске.
- source_word: ἐπιγνώσει
  choice: познании
  rationale: «Познание» естественно обозначает не только наличие сведений, но и углублённое, личностно значимое знание, не превращая усилительный оттенок слова в обязательное толкование.
- source_word: θεοῦ
  choice: Бога
  rationale: Родительный падеж обозначает объект познания.
- source_word: Ἰησοῦ
  choice: Иисуса
  rationale: Нормативная русская форма личного имени.
- source_word: κυρίου
  choice: Господа
  rationale: Сохраняет обычный новозаветный титул и его христологическую значимость.
- source_word: τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν
  choice: Бога и Иисуса, Господа нашего
  rationale: Оба имени представлены как объекты познания; приложение «Господа нашего» недвусмысленно относится к Иисусу. Постпозиция «нашего» поддерживает возвышенный, но понятный регистр.
theological_decisions:
- issue: Оттенок значения ἐπίγνωσις
  choice: познание
  alternative: полное познание; глубокое познание
  rationale: Греческое слово может подразумевать более полное или углублённое знание, однако основной текст не делает этот оттенок обязательным; возможность отражена в сноске.
- issue: Значение ἐν при ἐπιγνώσει
  choice: в познании
  alternative: через познание; посредством познания
  rationale: Предлог допускает понимание как сферы, так и средства. Основной текст сохраняет наиболее формальное «в», а инструментальное прочтение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной интонацией апостольского благословения. Формула «да умножатся» сохраняет достоинство и грамматическую форму пожелания; порядок «Господа нашего» соответствует библейскому регистру, оставаясь понятным современному читателю.
