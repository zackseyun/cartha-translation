  source_fidelity: 'Текст точно передаёт греческую формулу благословения: χάρις и εἰρήνη представлены как однородные подлежащие, пожелательный пассивный оптатив πληθυνθείη естественно передан формой «да умножатся», а ἐν ἐπιγνώσει сохранено как «в познании». Оборот «Бога и Иисуса, Господа нашего» корректно передаёт зависимость обоих имён от «познании» и относит титул «Господа нашего» к Иисусу.'
