  terminology: «Благодать», «мир», «познание» и «Господь» соответствуют устойчивой новозаветной терминологии, не навязывая усиленное или конфессионально узкое толкование. «Познание» удачно сохраняет возможный усилительный оттенок ἐπίγνωσις без его обязательного внесения в основной текст.
