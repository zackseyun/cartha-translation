  terminology: «Пророчество Писания» — точная и устойчивая передача προφητεία γραφῆς. «Истолкование» корректно передаёт ἐπίλυσις без доктринального уточнения субъекта. Сноска добросовестно обозначает возможные понимания, не навязывая ни читательское, ни пророческое толкование.
