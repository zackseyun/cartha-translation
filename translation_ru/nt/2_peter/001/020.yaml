  text: τοῦτο πρῶτον γινώσκοντες ὅτι πᾶσα προφητεία γραφῆς ἰδίας ἐπιλύσεως οὐ γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/020.yaml
  text: 'knowing this first: that every prophecy of Scripture does not come about from one''s own interpretation.'
translation:
  language: ru
  text: 'Прежде всего знайте: никакое пророчество Писания не возникает из собственного истолкования.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не бывает результатом собственного истолкования». Греческий текст не уточняет, идёт ли речь об истолковании самим пророком, читателем или о самостоятельном объяснении пророчества.'
    reason: Сохраняет неоднозначность ἰδίας ἐπιλύσεως и диапазон значения γίνεται.
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: Прежде всего знайте
  rationale: Естественно передаёт приоритет и причастную конструкцию в контексте наставления.
- source_word: πᾶσα προφητεία γραφῆς ... οὐ
  choice: никакое пророчество Писания не
  rationale: В русском отрицательное местоимение естественно передаёт универсальное отрицание, создаваемое сочетанием πᾶσα и οὐ; родительный «Писания» сохраняет возможную связь пророчества с Писанием.
- source_word: ἰδίας ἐπιλύσεως
  choice: из собственного истолкования
  rationale: «Истолкование» передаёт ἐπίλυσις без уточнения, чьё именно оно; «собственного» сохраняет неоднозначность ἰδίας.
- source_word: γίνεται
  choice: возникает
  rationale: Сохраняет динамический смысл «происходит, возникает», не подменяя его более узким «истолковывается».
theological_decisions:
- issue: Относится ли «собственное истолкование» к читателю, пророку или самому пророчеству
  choice: 'Сохранена неопределённость: «собственного истолкования»'
  alternative: «личного толкования пророка» или «частного толкования читателя»
  rationale: Греческий текст прямо не называет носителя «собственного» истолкования; уточнение разрешило бы реальную экзегетическую неоднозначность.
- issue: Значение γίνεται
  choice: «возникает»
  alternative: «истолковывается»
  rationale: Так сохраняется утверждение о происхождении или появлении пророчества и связь со следующим стихом, не сводя смысл исключительно к правилам чтения Писания.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и понятная формулировка. Синтаксис слегка выровнен для естественного русского чтения, при этом сохранены универсальное отрицание и смысловая неоднозначность оригинала.
