  text: διὸ μᾶλλον, ἀδελφοί, σπουδάσατε βεβαίαν ὑμῶν τὴν κλῆσιν καὶ ἐκλογὴν ποιεῖσθαι· ταῦτα γὰρ ποιοῦντες οὐ μὴ πταίσητέ ποτε·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/010.yaml
  text: Therefore[a], brothers, be all the more diligent to make your calling and election sure, for if you do these things, you will certainly never stumble.
translation:
  language: ru
  text: Поэтому, братья[a], тем усерднее старайтесь утверждать своё призвание и избрание, ведь, поступая так, вы никогда не преткнётесь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры»; греческое слово буквально означает «братья», но в таком обращении может подразумевать всю общину верующих.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего наставления и сохраняет ясную логическую связь.
- source_word: μᾶλλον
  choice: тем усерднее
  rationale: Естественно по-русски усиливает повеление σπουδάσατε в связи с предшествующим контекстом.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет грамматически мужскую форму греческого обращения; возможный охват всей общины пояснён в сноске.
- source_word: σπουδάσατε
  choice: старайтесь
  rationale: Передаёт настойчивый призыв приложить ревностное усилие без излишне книжного оттенка.
- source_word: βεβαίαν ... ποιεῖσθαι
  choice: утверждать
  rationale: Передаёт идею подтверждения и упрочения призвания и избрания, не внушая, будто человеческое усилие создаёт Божье решение.
- source_word: κλῆσιν
  choice: призвание
  rationale: Устоявшийся и точный русский эквивалент для Божьего призыва.
- source_word: ἐκλογὴν
  choice: избрание
  rationale: Точно обозначает Божье избрание и не привносит определённой конфессиональной системы.
- source_word: ταῦτα ... ποιοῦντες
  choice: поступая так
  rationale: Естественно отсылает к перечисленным ранее добродетелям и передаёт условно-обстоятельственный смысл причастия.
- source_word: οὐ μὴ ... ποτε
  choice: никогда не
  rationale: В русском языке категорическое «никогда не» достаточно ясно передаёт усиленное греческое отрицание.
- source_word: πταίσητέ
  choice: преткнётесь
  rationale: Сохраняет метафору спотыкания и не сужает смысл до любого отдельного греха или исключительно окончательного отпадения.
theological_decisions:
- issue: Смысл выражения «утверждать своё призвание и избрание»
  choice: Призыв подтверждать и укреплять в жизни действительность Божьего призвания и избрания посредством стойкого следования названным добродетелям.
  alternative: Понимать это как создание или приобретение Божьего призвания и избрания человеческими усилиями.
  rationale: Сочетание βεβαίαν ... ποιεῖσθαι говорит об утверждении или подтверждении. Перевод сохраняет напряжение текста, не определяя точный догматический механизм.
- issue: Сила обещания «никогда не преткнётесь»
  choice: Сохранена метафора преткновения без дополнительного уточнения, идёт ли речь о духовном падении вообще или об окончательном отпадении.
  alternative: Истолковать как обещание полного безгрешия либо исключительно как гарантию невозможности окончательного отпадения.
  rationale: Глагол πταίω допускает образный смысл спотыкания или падения; контекст не требует в самом переводе более узкой конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский язык; тон наставительный и достойный. «Утверждать» выбрано вместо более буквального, но двусмысленного «делать твёрдыми», а «преткнётесь» сохраняет исходную метафору.
