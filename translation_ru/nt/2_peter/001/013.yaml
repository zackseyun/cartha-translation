  text: δίκαιον δὲ ἡγοῦμαι, ἐφ’ ὅσον εἰμὶ ἐν τούτῳ τῷ σκηνώματι, διεγείρειν ὑμᾶς ἐν ὑπομνήσει,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/013.yaml
  text: But I consider it right[a], as long as I am in this tent, to stir you up by way of reminder,
translation:
  language: ru
  text: Но я считаю правильным, пока нахожусь в этом шатре[a], напоминанием побуждать вас,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в этом шатре». Образно — о теле как временном жилище.'
    reason: Поясняет метафорическое употребление σκηνώματι, сохраняя буквальный образ в основном тексте и не добавляя невыраженных деталей.
lexical_decisions:
- source_word: δίκαιον
  choice: правильным
  rationale: В сочетании с ἡγοῦμαι слово выражает взвешенную оценку того, что подобает и является верным; «считаю правильным» естественно звучит по-русски.
- source_word: δὲ
  choice: И
  rationale: Здесь частица продолжает и развивает мысль предыдущего стиха; русское «и» передаёт мягкий переход без чрезмерно резкого противопоставления.
- source_word: ἡγοῦμαι
  choice: считаю
  rationale: Глагол обозначает обдуманное суждение, что точно и естественно передаётся словом «считаю».
- source_word: ἐφ’ ὅσον
  choice: пока
  rationale: 'В сочетании с εἰμί оборот имеет временное значение: «всё то время, пока».'
- source_word: σκηνώματι
  choice: шатре
  rationale: Слово обозначает временное жилище, шатёр, и здесь метафорически указывает на нынешнее телесное существование Петра. «Шатёр» сохраняет образ и связь со следующим стихом.
- source_word: διεγείρειν
  choice: пробуждать
  rationale: Инфинитив значит «будить, пробуждать, побуждать». «Пробуждать вас» сохраняет образ действия и уместно в контексте духовного наставления.
- source_word: ἐν ὑπομνήσει
  choice: напоминанием
  rationale: 'Предложная конструкция указывает на средство: Пётр пробуждает читателей посредством напоминания.'
theological_decisions:
- issue: Метафорическое значение «этого шатра»
  choice: Сохранить прямую метафору «в этом шатре».
  alternative: 'Передать толковательно: «в этом теле» или менее образно: «в этом жилище».'
  rationale: Греческий текст называет тело временным шатром. Сохранение метафоры передаёт образ бренности нынешней земной жизни и подготавливает формулировку следующего стиха, не подменяя перевод толкованием.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Образ «шатра» сохранён; «пробуждать вас напоминанием» близко к структуре греческого текста и остаётся понятным обычному читателю.
