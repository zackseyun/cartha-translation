  text: οὐ γὰρ θελήματι ἀνθρώπου ἠνέχθη ⸂προφητεία ποτέ⸃, ἀλλὰ ὑπὸ πνεύματος ἁγίου φερόμενοι ἐλάλησαν ⸀ἀπὸ θεοῦ ἄνθρωποι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/021.yaml
  text: For prophecy was never brought forth by the will of man[c][b][a], but men spoke from God as they were carried along by the Holy Spirit.
translation:
  language: ru
  text: Ибо пророчество никогда не было принесено по воле человека[a], но люди говорили от Бога, будучи несомыми Святым Духом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не возникало по воле человека». Греческий глагол стоит в страдательном залоге и родствен причастию «несомыми» далее в стихе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «движимые Святым Духом». Буквальнее: «несомые»; этот образ подчёркивает активное водительство Духа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θελήματι ἀνθρώπου
  choice: человеческой волей
  rationale: Творительный падеж естественно передаёт инструментальное значение греческого дательного при страдательном глаголе; выражение сохраняет мысль об отсутствии человеческой инициативы как источника пророчества.
- source_word: ἠνέχθη
  choice: было принесено
  rationale: Страдательная форма φέρω сохранена и лексически перекликается с последующим φερόμενοι. Такая формулировка передаёт появление пророчества не по человеческой воле, не уточняя сверх текста способ его возникновения.
- source_word: προφητεία
  choice: пророчество
  rationale: Устоявшееся и понятное соответствие, охватывающее здесь пророческое слово или изречение в общем смысле.
- source_word: ποτέ
  choice: никогда
  rationale: В сочетании с οὐ выражает категорическое отрицание во времени.
- source_word: ὑπὸ πνεύματος ἁγίου
  choice: Святым Духом
  rationale: Греческое ὑπό с родительным обозначает действующее лицо; русский творительный естественно передаёт эту функцию.
- source_word: φερόμενοι
  choice: будучи несомыми
  rationale: Сохраняет конкретный страдательный образ φέρω и его связь с ἠνέχθη, подчёркивая активное водительство Духа без сведения его к механической диктовке.
- source_word: ἐλάλησαν
  choice: говорили
  rationale: Прямое и естественное соответствие простому глаголу речи λαλέω.
- source_word: ἀπὸ θεοῦ
  choice: от Бога
  rationale: Сохраняет значение источника, выраженное ἀπό, и не смешивает его с действующей силой, обозначенной ὑπό.
- source_word: ἄνθρωποι
  choice: люди
  rationale: Естественно передаёт множественное ἄνθρωποι как обозначение человеческих говорящих; русский язык не требует здесь формы, способной создать ненужное впечатление исключительно мужского пола.
theological_decisions:
- issue: Соотношение божественного и человеческого действия в пророчестве
  choice: Люди действительно говорили, однако источник их слова — Бог, а направляющая сила — Святой Дух; пророчество не возникало по человеческой воле.
  alternative: Понимать действие Духа как механическую диктовку либо считать пророчество совместным плодом независимой человеческой инициативы и божественного влияния.
  rationale: Греческий текст одновременно утверждает человеческую речь (ἐλάλησαν… ἄνθρωποι), божественный источник (ἀπὸ θεοῦ) и решающее действие Святого Духа (ὑπὸ πνεύματος ἁγίου φερόμενοι). Перевод сохраняет это напряжение и не конкретизирует механизм вдохновения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены страдательные формы и лексическая перекличка двух форм φέρω; «люди» выбрано как естественное родовое обозначение.
