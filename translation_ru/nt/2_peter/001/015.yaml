id: 2PE.1.15
reference: 2 Peter 1:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: σπουδάσω δὲ καὶ ἑκάστοτε ἔχειν ὑμᾶς μετὰ τὴν ἐμὴν ἔξοδον τὴν τούτων μνήμην ποιεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/015.yaml
  text: And I will make every effort so that[a], after my departure, you may be able at any time to recall these things.
translation:
  language: ru
  text: И я приложу все усилия, чтобы после моего ухода[a] вы могли в любой момент вспоминать обо всём этом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более прямо: «после моей смерти». В греческом тексте буквально: «после моего ухода».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσω
  choice: приложу все усилия
  rationale: Будущая форма σπουδάζω выражает усердное, целенаправленное старание; это естественная и достаточно сильная формулировка по-русски.
- source_word: δὲ
  choice: И
  rationale: Здесь частица продолжает мысль предыдущего стиха, а не вводит резкое противопоставление.
- source_word: καὶ
  choice: чтобы
  rationale: В сочетании с инфинитивной конструкцией передаёт дальнейшую цель усилий Петра; целевое «чтобы» естественно выражает связь по-русски.
- source_word: ἑκάστοτε
  choice: всегда
  rationale: Слово означает «в каждом случае», «всякий раз, когда потребуется»; в данном контексте «всегда» кратко передаёт постоянную возможность припоминать сказанное.
- source_word: ἔχειν ὑμᾶς
  choice: вы могли
  rationale: Конструкция выражает наличие возможности; буквальное «иметь» здесь было бы неестественно по-русски.
- source_word: μετὰ τὴν ἐμὴν ἔξοδον
  choice: после моего ухода
  rationale: ἔξοδος буквально обозначает уход или выход и здесь служит деликатным обозначением предстоящей смерти Петра. «Уход» сохраняет образ, не подменяя его толкованием.
- source_word: τὴν τούτων μνήμην ποιεῖσθαι
  choice: вспоминать об этом
  rationale: Греческое устойчивое выражение означает вызывать в памяти, вспоминать; выбранная формулировка естественна в современном русском языке.
- source_word: τούτων
  choice: об этом
  rationale: Местоимение отсылает к истинам, о которых Пётр говорил выше; единственное собирательное «об этом» естественно передаёт данную отсылку.
theological_decisions:
- issue: Значение ἔξοδος применительно к предстоящему концу земной жизни Петра
  choice: уход
  alternative: смерть; исход
  rationale: Основной текст сохраняет метафорическое выражение оригинала. Смысл «смерть» разъясняется в сноске, тогда как «исход» в современном русском мог бы неоправданно выдвинуть на первый план ветхозаветные ассоциации.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная, без архаизмов. Сохранён эвфемистический образ ухода, а его явный смысл указан в сноске.
