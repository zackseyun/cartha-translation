id: 2PE.1.18
reference: 2 Peter 1:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ταύτην τὴν φωνὴν ἡμεῖς ἠκούσαμεν ἐξ οὐρανοῦ ἐνεχθεῖσαν σὺν αὐτῷ ὄντες ἐν τῷ ⸂ἁγίῳ ὄρει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/018.yaml
  text: And we ourselves heard this voice brought from heaven when we were with him on the holy mountain[a].
translation:
  language: ru
  text: И этот голос, принесённый с неба, мы сами слышали, когда были с Ним на святой горе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «донесённый с неба».'
    reason: 'Лексическая альтернатива: ἐνεχθεῖσαν допускает передачу как «принесённый», «донесённый» или «перенесённый»; вариант «донесённый» по-русски особенно естественно сочетается с голосом.'
lexical_decisions:
- source_word: ταύτην τὴν φωνὴν
  choice: этот голос
  rationale: φωνή здесь относится к приведённым в предыдущем стихе словам Бога, поэтому «голос» точнее общего «звук».
- source_word: ἡμεῖς
  choice: мы сами
  rationale: Явно выраженное местоимение при глаголе уже обозначенной формы подчёркивает личное свидетельство авторов; «мы сами» передаёт это ударение.
- source_word: ἠκούσαμεν
  choice: слышали
  rationale: Аорист обозначает конкретное событие восприятия голоса; «слышали» естественно передаёт смысл без оттенка намеренного вслушивания.
- source_word: ἐξ οὐρανοῦ
  choice: с неба
  rationale: Это естественный современный русский эквивалент исходного направления; сохраняется представление о небесном происхождении голоса.
- source_word: ἐνεχθεῖσαν
  choice: принесённый
  rationale: Пассивное причастие от φέρω характеризует голос как донесённый или принесённый с неба. Такое выражение сохраняет образность оригинала, хотя по-русски несколько необычно.
- source_word: σὺν αὐτῷ ὄντες
  choice: когда были с Ним
  rationale: Причастный оборот естественно передаётся временным придаточным. Местоимение относится в контексте к Иисусу.
- source_word: ἐν τῷ ἁγίῳ ὄρει
  choice: на святой горе
  rationale: Русская норма требует предлога «на» применительно к горе; «святой» сохраняет библейскую и сакральную характеристику места.
theological_decisions:
- issue: К какой горе относится выражение «святая гора»
  choice: Описательное указание на гору преображения Иисуса без её географического отождествления
  alternative: Прямое отождествление с Фавором или Ермоном
  rationale: Греческий текст называет место «святой горой», но не сообщает его названия; перевод не вводит отсутствующую в тексте традиционную или предполагаемую идентификацию.
- issue: Прописная буква в местоимении «Ним»
  choice: Ним
  alternative: ним
  rationale: Прописная буква соответствует принятому в русском библейском и религиозном письме благоговейному обозначению Иисуса, не меняя референта или смысла исходного текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Порядок слов сохраняет акцент на «этот голос» и «мы сами», а формулировка не называет гору, которой не называет оригинал.
