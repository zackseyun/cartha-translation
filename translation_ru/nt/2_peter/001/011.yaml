id: 2PE.1.11
reference: 2 Peter 1:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὕτως γὰρ πλουσίως ἐπιχορηγηθήσεται ὑμῖν ἡ εἴσοδος εἰς τὴν αἰώνιον βασιλείαν τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/011.yaml
  text: For in this way entry into the eternal kingdom of our Lord and Savior Jesus the Messiah will be richly provided for you[a][b][c].
translation:
  language: ru
  text: Ведь так вам будет щедро дарован вход в вечное Царство нашего Господа и Спасителя Иисуса Мессии.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционный перевод: «Иисуса Христа». Греческое Χριστός означает «Мессия», то есть Помазанник.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: так
  rationale: Кратко и естественно связывает обещание с описанным выше образом жизни, сохраняя указательное значение греческого наречия.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предыдущим стихом и естественно звучит в современном русском повествовании.
- source_word: πλουσίως
  choice: щедро
  rationale: Передаёт идею изобильного, великодушного предоставления и хорошо сочетается с глаголом «дарован».
- source_word: ἐπιχορηγηθήσεται
  choice: будет дарован
  rationale: Сохраняет будущее время и страдательную конструкцию; «дарован» естественно выражает предоставление входа, не называя прямо действующее лицо.
- source_word: ὑμῖν
  choice: вам
  rationale: Точно передаёт дательный падеж адресата или получателя.
- source_word: ἡ εἴσοδος
  choice: вход
  rationale: Русское «вход» может обозначать как вступление, так и возможность войти и потому сохраняет смысловую ёмкость греческого слова.
- source_word: εἰς τὴν αἰώνιον βασιλείαν
  choice: в вечное Царство
  rationale: Прямо передаёт направление и эсхатологическое качество Царства; прописная буква уместна для Божьего Царства в библейском контексте.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος
  choice: нашего Господа и Спасителя
  rationale: Сохраняет оба титула и естественный русский порядок слов; единое определение указывает на одного носителя обоих титулов.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Передаёт Χριστός по значению как титул «Мессия», а не только традиционной транслитерацией; русская форма без дополнительного артикля грамматически естественна.
theological_decisions:
- issue: К кому относятся титулы «Господь» и «Спаситель»
  choice: Оба титула относятся к одному лицу — Иисусу Мессии.
  alternative: Понимать титулы как относящиеся к разным лицам.
  rationale: Один греческий артикль перед двумя личными существительными в единственном числе, соединёнными καί, а затем имя Ἰησοῦ Χριστοῦ убедительно указывают на одного референта; перевод сохраняет эту синтаксическую связь без добавочного догматического пояснения.
- issue: Характер предоставления входа
  choice: Сохранена страдательная форма «будет… дарован» без прямого называния дарующего.
  alternative: 'Уточнить субъект как Бога: «Бог щедро дарует вам».'
  rationale: В греческом тексте действующее лицо не названо. Перевод не устраняет эту грамматическую сдержанность, хотя контекст допускает подразумеваемое божественное действие.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Формулировка остаётся понятной обычному читателю; «ведь так» естественно связывает стих с предшествующим наставлением, а пассивная конструкция сохраняет сдержанность оригинала.
