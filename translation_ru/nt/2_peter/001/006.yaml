  yaml_path: translation/nt/2_peter/001/006.yaml
  text: and in knowledge[a], self-control; and in self-control, steadfastness; and in steadfastness, godliness[b],
translation:
  language: ru
  text: а в знании — самообладание; в самообладании — стойкость[a]; в стойкости — благочестие[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выносливость», «терпение» или «непоколебимость» (ὑπομονή).'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст здесь эллиптичен: продолжается начатая в предыдущем стихе цепь добродетелей, в которой к одному качеству добавляется следующее.'
    reason: cross_reference
lexical_decisions:
- source_word: γνώσει
  choice: знании
  rationale: Прямой и естественный эквивалент γνῶσις в перечне добродетелей; сохраняет связь с предыдущим звеном цепи.
- source_word: ἐγκράτειαν / ἐγκρατείᾳ
  choice: самообладание / самообладании
  rationale: Передаёт владение своими желаниями и побуждениями; в современном русском звучит естественнее, чем «воздержание», которое может пониматься слишком узко.
- source_word: ὑπομονήν / ὑπομονῇ
  choice: стойкость / стойкости
  rationale: Передаёт постоянство и способность выдерживать трудности, не сводя значение лишь к пассивному терпению.
- source_word: εὐσέβειαν
  choice: благочестие
  rationale: Устоявшийся и ёмкий русский эквивалент для почтительной преданности Богу, проявляющейся в жизни.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: а в ... — ...; в ... — ...
  rationale: Сохраняет сжатую, эллиптическую структуру греческой цепочки, а тире позволяет ей ясно и естественно звучать по-русски.
- source_word: δέ
  choice: а / бессоюзное продолжение после точки с запятой
  rationale: δέ связывает последовательные звенья, не выражая сильного противопоставления; первое «а» отмечает продолжение предыдущего стиха, дальнейший повтор опущен ради естественного русского ритма.
theological_decisions:
- issue: Передача эллиптического построения цепи добродетелей
  choice: Сохранить сжатый перечень с конструкцией «в … — …»
  alternative: Развернуть как «к знанию прибавьте самообладание…» или «в знании проявляйте самообладание…»
  rationale: Греческий текст продолжает начатое в предыдущем стихе побуждение, не повторяя глагола. Сжатая передача сохраняет эту особенность и не уточняет сверх текста, каким именно образом одна добродетель соотносится с другой.
translation_notes:
  register: Современный литературный русский язык; краткий, ритмичный и достойный стиль. Строчная начальная буква и конечная запятая сохранены, поскольку стих является частью продолжающегося предложения.
