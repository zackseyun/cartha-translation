  text: προσδοκῶντας καὶ σπεύδοντας τὴν παρουσίαν τῆς τοῦ θεοῦ ἡμέρας, δι’ ἣν οὐρανοὶ πυρούμενοι λυθήσονται καὶ στοιχεῖα καυσούμενα τήκεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/012.yaml
  text: as you wait for and hasten the coming of the day of God[a], because of which the heavens, being set on fire, will be dissolved, and the elements, burning[b], will melt.
translation:
  language: ru
  text: ожидая и ускоряя пришествие Божьего дня[a], из-за которого небеса, объятые огнём, распадутся, а стихии, охваченные жаром[b], расплавятся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ревностно ожидая пришествия Божьего дня». Греческий глагол может означать как «приближать, ускорять», так и «ревностно ожидать, стремиться к».'
    reason: alternative_reading
  - marker: b
    text: Под «стихиями» могут подразумеваться основные составляющие мира или, возможно, небесные тела.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδοκῶντας
  choice: ожидая
  rationale: Передаёт продолжающееся ожидание с оттенком предвкушения и естественно продолжает увещание предыдущего стиха.
- source_word: σπεύδοντας
  choice: приближая
  rationale: При прямом дополнении παρουσίαν глагол допускает каузативный смысл — способствовать скорейшему наступлению; неоднозначность с «ревностно ожидать» сохранена в сноске.
- source_word: παρουσίαν
  choice: пришествие
  rationale: В эсхатологическом контексте это устоявшееся и точное обозначение грядущего явления и присутствия.
- source_word: τῆς τοῦ θεοῦ ἡμέρας
  choice: Божьего дня
  rationale: Сохраняет необычное выражение «день Бога», не заменяя его более привычным «день Господа».
- source_word: δι’ ἣν
  choice: из-за которого
  rationale: διά с винительным падежом здесь естественно выражает причину; местоимение соотнесено с Божьим днём.
- source_word: οὐρανοὶ
  choice: небеса
  rationale: Сохраняет множественное число и космический масштаб высказывания.
- source_word: πυρούμενοι
  choice: объятые огнём
  rationale: Передаёт пассивный оттенок причастия и состояние небес под действием огня.
- source_word: λυθήσονται
  choice: распадутся
  rationale: Передаёт разложение или утрату целостности, не навязывая идею метафизического уничтожения.
- source_word: στοιχεῖα
  choice: стихии
  rationale: Традиционное широкое русское соответствие сохраняет неоднозначность между основными составляющими мира и небесными телами.
- source_word: καυσούμενα
  choice: раскалившись
  rationale: Естественно выражает воздействие жара, ведущее к последующему плавлению.
- source_word: τήκεται
  choice: расплавятся
  rationale: Передаёт плавление от жара; будущее время по-русски согласуется с окружающими эсхатологическими формами, хотя в греческом употреблено яркое настоящее.
theological_decisions:
- issue: Значение σπεύδοντας τὴν παρουσίαν
  choice: приближая пришествие
  alternative: ревностно ожидая пришествия
  rationale: Конструкция с прямым дополнением позволяет понимать действие как ускорение или приближение наступления дня; альтернативное значение глагола не исключено и вынесено в сноску, чтобы сохранить богословское напряжение.
- issue: Референт στοιχεῖα
  choice: стихии
  alternative: небесные тела
  rationale: Точное значение слова в данном эсхатологическом контексте спорно; широкое обозначение не навязывает определённой древней или современной космологии.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Синтаксис причастного оборота сохранён как продолжение предыдущего стиха. Формулировки избегают архаизмов и не снимают лексико-богословскую неоднозначность оригинала.
