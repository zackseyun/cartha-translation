  source_fidelity: 'Смысловой каркас перевода точен: выводное «Поэтому», обращение, продолжающееся ожидание, настойчивое повеление и состояние «в мире» переданы верно. Активная перестройка «чтобы Он нашёл вас» допустима для εὑρεθῆναι αὐτῷ и не называет референта сверх текста. Однако «непорочными» в современном русском заметно тяготеет к значению сексуальной непорочности и потому уже, чем ἀμώμητοι — общее отсутствие порока, изъяна или упрёка.'
  naturalness: '«Незапятнанными и безупречными» естественно для современного литературного и одновременно возвышенного библейского регистра. Запятая перед «в мире» уместна: обстоятельство состояния обособлено и не связывается только со вторым прилагательным.'
  terminology: «Возлюбленные», «приложите все усилия» и «в мире» удачны. Замена «непорочными» на «безупречными» точнее передаёт этический, а не специально сексуальный смысл ἀμώμητοι. Сноска сохраняет подлинную синтаксико-семантическую неоднозначность αὐτῷ.
  issues:
