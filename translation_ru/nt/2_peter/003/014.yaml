source:
  edition: SBLGNT
  text: Διό, ἀγαπητοί, ταῦτα προσδοκῶντες σπουδάσατε ἄσπιλοι καὶ ἀμώμητοι αὐτῷ εὑρεθῆναι ἐν εἰρήνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/014.yaml
  text: Therefore[a], beloved, since you are waiting for these things, make every effort to be found by him spotless and blameless in peace.
translation:
  language: ru
  text: Поэтому, возлюбленные, ожидая этого, приложите все усилия, чтобы Он нашёл вас незапятнанными и безупречными, в мире[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы вы оказались перед Ним незапятнанными и безупречными, в мире». Греческий дательный может указывать либо на деятеля («Он нашёл вас»), либо на отношение или присутствие («перед Ним»).'
    reason: alternative_reading
lexical_decisions:
- source_word: Διό
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассуждения о дне Господнем и обещанных новых небесах и новой земле.
- source_word: ἀγαπητοί
  choice: возлюбленные
  rationale: Сохраняет тёплое обращение и возвышенный эпистолярный тон, оставаясь понятным в современном русском.
- source_word: ταῦτα
  choice: этого
  rationale: Естественно отсылает к совокупности только что названных эсхатологических событий, не уточняя их сверх текста.
- source_word: προσδοκῶντες
  choice: ожидая
  rationale: Передаёт продолжающееся ожидание и сохраняет компактную причастную связь с повелением.
- source_word: σπουδάσατε
  choice: приложите все усилия
  rationale: Выражает настойчивое, деятельное старание, заключённое в аористном императиве.
- source_word: ἄσπιλοι
  choice: незапятнанными
  rationale: Сохраняет образ отсутствия пятна и нравственной чистоты.
- source_word: ἀμώμητοι
  choice: непорочными
  rationale: Передаёт отсутствие изъяна или основания для упрёка и естественно сочетается с «незапятнанными».
- source_word: αὐτῷ
  choice: Он
  rationale: В конструкции «чтобы Он нашёл вас» передаёт возможное значение деятеля при пассивном εὑρεθῆναι; референт местоимения не конкретизирован сверх греческого текста. Альтернативное понимание дательного как отношения или присутствия отмечено в сноске.
- source_word: εὑρεθῆναι
  choice: чтобы Он нашёл вас
  rationale: Естественная русская активная перестройка пассивного инфинитива «быть найденными», сохраняющая эсхатологическую оценку подразумеваемым божественным лицом.
- source_word: ἐν εἰρήνῃ
  choice: в мире
  rationale: Формально и семантически близко греческому выражению и не решает, имеется ли в виду состояние примирённости, внутренний покой или мирные отношения.
theological_decisions:
- issue: Значение и референт αὐτῷ в эсхатологическом контексте
  choice: 'Основной текст понимает дательный как обозначение деятеля: «чтобы Он нашёл вас», сохраняя референт не названным явно.'
  alternative: «чтобы вы оказались перед Ним незапятнанными и непорочными»
  rationale: Греческий дательный допускает как значение деятеля («Им»), так и значение отношения или присутствия («перед Ним»). Основное прочтение естественно в конструкции с пассивным инфинитивом, но подлинная неоднозначность сохранена в сноске.
- issue: Смысл ἐν εἰρήνῃ
  choice: «в мире» без поясняющего дополнения
  alternative: «в мире с Ним» или «с миром в душе»
  rationale: В греческом тексте объект или конкретная сфера мира не названы; перевод не должен сужать выражение до одной богословской интерпретации.
translation_notes:
  register: Современный литературный русский с достоинством апостольского увещания. «Возлюбленные» сохраняет библейский эпистолярный регистр; остальная фраза построена естественно и ясно. Запятая перед «в мире» помогает не прочитать сочетание как устойчивое «непорочными в мире» и сохраняет широкую смысловую связь оборота с состоянием, в котором адресаты должны быть найдены.
