source:
  edition: SBLGNT
  text: Ἓν δὲ τοῦτο μὴ λανθανέτω ὑμᾶς, ἀγαπητοί, ὅτι μία ἡμέρα παρὰ κυρίῳ ὡς χίλια ἔτη καὶ χίλια ἔτη ὡς ἡμέρα μία.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/008.yaml
  text: 'But do not let this one thing escape your notice[a], beloved: with the Lord one day is like a thousand years[c][b], and a thousand years like one day.'
translation:
  language: ru
  text: 'Но пусть это одно не ускользнёт от вашего внимания[a], возлюбленные: у Господа один день — как тысяча лет[b][c], и тысяча лет — как один день.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не оставайтесь в неведении об одном этом».'
    reason: lexical_alternative
  - marker: b
    text: Ср. Псалом 89:4 (в иной нумерации — 90:4).
    reason: cross_reference
  - marker: c
    text: Слово «как» выражает сравнение, а не буквальное равенство одного дня тысяче лет.
    reason: cultural_note
lexical_decisions:
- source_word: Ἓν δὲ τοῦτο
  choice: Но одно это
  rationale: Сохраняет противительный переход δέ, указательную силу τοῦτο и акцент на одном конкретном обстоятельстве, не перегружая русскую фразу.
- source_word: μὴ λανθανέτω ὑμᾶς
  choice: пусть не ускользнёт от вас
  rationale: Передаёт повелительную конструкцию и значение λανθάνω — оставаться незамеченным, ускользать от внимания.
- source_word: ἀγαπητοί
  choice: возлюбленные
  rationale: Сохраняет тёплый и возвышенный характер обращения к общине; слово понятно в современном библейском регистре.
- source_word: παρὰ κυρίῳ
  choice: у Господа
  rationale: Естественно передаёт παρά с дательным как пребывание у кого-либо и взгляд с его стороны, не сужая выражение исключительно до субъективной оценки.
- source_word: μία ἡμέρα ... ὡς χίλια ἔτη
  choice: один день — как тысяча лет
  rationale: ὡς выражает сравнение, а не буквальное тождество; тире создаёт естественную русскую именную конструкцию.
- source_word: καὶ χίλια ἔτη ὡς ἡμέρα μία
  choice: и тысяча лет — как один день
  rationale: Сохраняет зеркальный параллелизм и эллиптическое устройство греческой фразы.
- source_word: χίλια ἔτη
  choice: тысяча лет
  rationale: Прямое и обычное соответствие количественному выражению без символизирующего истолкования.
theological_decisions:
- issue: Характер сопоставления времени
  choice: Передать высказывание как сравнение, описывающее отношение Господа ко времени.
  alternative: Понимать один день как буквально равный тысяче лет или как ключ для расчёта пророческих сроков.
  rationale: Дважды употреблённое ὡς («как») обозначает аналогию. Перевод сохраняет эту форму и не вводит в текст определённую эсхатологическую схему.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Обращение «возлюбленные» сохранено ради пастырской теплоты; синтаксический параллелизм исходного текста передан симметричными конструкциями с тире.
