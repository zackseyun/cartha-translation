base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/016.yaml
  text: as also in all his letters[a], speaking in them about these things. In them are some things hard to understand, which the ignorant and unstable twist, as they do the rest of the Scriptures[c][b], to their own destruction.
translation:
  language: ru
  text: как и во всех своих письмах, где он говорит об этом. В них есть кое-что трудное для понимания, что невежды[a] и неустойчивые извращают[b] — точно так же, как и остальные Писания[c], — себе на погибель.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ненаставленные».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «искажают».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «другие Писания». Греческое слово может означать как «остальные», так и «другие»; в данном сравнении наиболее естественно «остальные Писания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολαῖς
  choice: письмах
  rationale: Современное и естественное обозначение письменных посланий; слово «послания» возможно, но здесь звучит более терминологично.
- source_word: λαλῶν
  choice: где он говорит
  rationale: Сохраняет значение «говорить, сообщать», естественно передавая его применительно к содержанию писем, без замены на более узкое «пишет».
- source_word: περὶ τούτων
  choice: об этом
  rationale: Естественная русская отсылка к темам, упомянутым в предыдущем контексте.
- source_word: δυσνόητά τινα
  choice: нечто трудное для понимания
  rationale: Передаёт и неопределённость τινα, и смысл δυσνόητα, не утверждая, что трудны для понимания письма целиком.
- source_word: ἀμαθεῖς
  choice: невежды
  rationale: Обозначает людей, лишённых должного знания или наставления; вариант «неучёные» мог бы ошибочно свести смысл к отсутствию формального образования.
- source_word: ἀστήρικτοι
  choice: нетвёрдые люди
  rationale: Передаёт отсутствие внутренней и вероучительной устойчивости понятным современным языком.
- source_word: στρεβλοῦσιν
  choice: извращают
  rationale: Сохраняет образ намеренного или пагубного искажения смысла; «искажают» — более нейтральная возможная передача.
- source_word: τὰς λοιπὰς γραφὰς
  choice: остальные Писания
  rationale: Передаёт обычное новозаветное значение γραφαί как священных Писаний и сравнительный смысл λοιπάς — «остальные».
- source_word: ἀπώλειαν
  choice: погибель
  rationale: Достоинная и понятная передача тяжёлого итогового смысла; не вводит более детальной догматической формулировки.
theological_decisions:
- issue: Статус писем Павла в выражении τὰς λοιπὰς γραφὰς
  choice: «как и остальные Писания»
  alternative: «как и другие писания»
  rationale: Формулировка сохраняет естественное указание греческого текста на сопоставление писем Павла с другими священными Писаниями, не развивая подразумеваемое в отдельное догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис разделён на два предложения для ясности. «Письма» предпочтено более традиционному «послания», а «себе на погибель» сохраняет краткость и силу греческого оборота.
