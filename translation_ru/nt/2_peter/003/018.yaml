id: 2PE.3.18
reference: 2 Peter 3:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: αὐξάνετε δὲ ἐν χάριτι καὶ γνώσει τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ. αὐτῷ ἡ δόξα καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος. ⸀ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/018.yaml
  text: But grow in the grace and knowledge of our Lord and Savior Jesus the Messiah[a]. To him be the glory both now and to the day of eternity[b]. Amen.
translation:
  language: ru
  text: Но возрастайте в благодати и познании нашего Господа и Спасителя Иисуса Мессии[a]. Ему слава и ныне, и до дня вечности[b]. Аминь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно традиционному русскому употреблению: «Иисуса Христа».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «ныне и вовеки». Буквально по-гречески: «и ныне, и до дня вечности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐξάνετε
  choice: возрастайте
  rationale: Настоящее повелительное наклонение во множественном числе выражает продолжающийся рост; «возрастайте» естественно и достойно передаёт этот призыв.
- source_word: δὲ
  choice: но
  rationale: Союз обозначает мягкое противопоставление предшествующим предостережениям.
- source_word: ἐν χάριτι καὶ γνώσει
  choice: в благодати и познании
  rationale: Один предлог ἐν относится к обоим существительным; формулировка сохраняет общую сферу духовного роста и не сводит γνώσις лишь к интеллектуальному знанию.
- source_word: χάριτι
  choice: благодати
  rationale: «Благодать» — точный и укоренившийся русский эквивалент χάρις в данном новозаветном контексте.
- source_word: γνώσει
  choice: познании
  rationale: «Познание» естественно обозначает не только сведения, но и углубляющееся знание личности Господа.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: нашего Господа и Спасителя Иисуса Мессии
  rationale: Единственный артикль объединяет титулы «Господь» и «Спаситель» и относит их к одному лицу. Χριστός передан по смыслу как титул «Мессия», а не только традиционной транслитерацией «Христос».
- source_word: αὐτῷ ἡ δόξα
  choice: Ему слава
  rationale: Краткая русская доксологическая формула сохраняет подразумеваемую в греческом связку.
- source_word: καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος
  choice: и ныне, и до дня вечности
  rationale: Парная конструкция передаёт καὶ…καὶ, а необычный образ «дня вечности» сохраняет ἡμέραν αἰῶνος, не сглаживая его до обычного «вовеки».
- source_word: ἀμήν
  choice: Аминь
  rationale: Сохранена традиционная русская передача литургического утверждения.
theological_decisions:
- issue: Передача Χριστοῦ в сочетании Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  alternative: Иисуса Христа
  rationale: Χριστός сохраняет значение титула «Мессия» в христологическом исповедании и славословии; традиционный вариант указан в примечании.
- issue: К кому относятся титулы «наш Господь и Спаситель»
  choice: Оба титула относятся к Иисусу Мессии
  alternative: Передать конструкцию менее определённо
  rationale: Один греческий артикль при двух соединённых существительных естественно указывает на одно лицо; русский текст отражает эту грамматику без дополнительных догматических пояснений.
- issue: Необычное выражение εἰς ἡμέραν αἰῶνος
  choice: до дня вечности
  alternative: ныне и вовеки
  rationale: Основной текст сохраняет эсхатологический образ «дня» и подлинную необычность греческой фразы, тогда как более привычное осмысление вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского славословия. Слова «возрастайте», «благодать», «познание» и «ныне» понятны широкому читателю и сохраняют торжественный регистр; необычное «до дня вечности» намеренно удерживает образность оригинала.
