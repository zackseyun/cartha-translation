  text: Τούτων ⸀οὕτως πάντων λυομένων ποταποὺς δεῖ ὑπάρχειν ὑμᾶς ἐν ἁγίαις ἀναστροφαῖς καὶ εὐσεβείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/011.yaml
  text: Since all these things are being dissolved in this way[a], what sort of people ought you to be in holy conduct and godliness[b],
translation:
  language: ru
  text: Поскольку всё это так распадается[a], какими же людьми вам следует быть в святом образе жизни и благочестии?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разрушается»; греческое слово буквально передаёт разъединение или распад.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων ... πάντων
  choice: всё это
  rationale: Родительная конструкция указывает на всё перечисленное в ближайшем контексте; русское «всё это» передаёт подразумеваемую совокупность без лишнего уточнения.
- source_word: οὕτως
  choice: так
  rationale: Наречие обозначает способ происходящего распада; краткое «так» естественно передаёт это значение.
- source_word: λυομένων
  choice: распадается
  rationale: Причастие настоящего времени страдательного залога от λύω здесь описывает разъединение и распад. «Распадается» сохраняет этот образ и не усиливает его до однозначного «уничтожается».
- source_word: ποταποὺς
  choice: какими же людьми
  rationale: Слово ставит риторический вопрос о качествах адресатов. Добавление «людьми» естественно для современного русского и не меняет смысла.
- source_word: δεῖ ὑπάρχειν ὑμᾶς
  choice: вам следует быть
  rationale: Оборот выражает нравственную необходимость. «Следует быть» звучит естественно и передаёт обязательность без неоправданного усиления.
- source_word: ἐν ἁγίαις ἀναστροφαῖς
  choice: живя свято
  rationale: ἀναστροφή обозначает поведение или образ жизни. Деепричастный оборот естественно передаёт по-русски сферу, в которой должны проявляться качества адресатов.
- source_word: εὐσεβείαις
  choice: благочестиво
  rationale: εὐσέβεια означает почтительное отношение к Богу, выраженное в жизни. Наречие согласуется с выбранной естественной русской конструкцией и сохраняет отличие от святости поведения.
theological_decisions:
- issue: Характер конечной участи нынешнего порядка
  choice: «распадается»
  alternative: «уничтожается» / «будет разрушено»
  rationale: Греческое λύω буквально связано с развязыванием и разъединением. Контекст эсхатологический, однако перевод не должен усиливать образ до полного уничтожения, которого само слово однозначно не утверждает.
- issue: Временная форма эсхатологического описания
  choice: 'Сохранено настоящее время: «распадается»'
  alternative: 'Будущее время: «распадётся»'
  rationale: В греческом стоит причастие настоящего времени, хотя из контекста ясно, что речь идёт о грядущем событии. Настоящее время сохраняет форму и напряжение исходного выражения, не устраняя его контекстуальной направленности в будущее.
translation_notes:
  register: Современный литературный русский язык с достойным, но доступным регистром. Риторический вопрос передан восклицательной конструкцией, соответствующей увещевательному тону. Множественные формы ἀναστροφαῖς и εὐσεβείαις переданы естественными русскими наречиями без искусственного воспроизведения греческого множественного числа.
