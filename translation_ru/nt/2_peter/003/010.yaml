source:
  edition: SBLGNT
  text: ἥξει δὲ ⸀ἡμέρα κυρίου ὡς ⸀κλέπτης, ἐν ᾗ οἱ οὐρανοὶ ῥοιζηδὸν παρελεύσονται, στοιχεῖα δὲ καυσούμενα ⸀λυθήσεται, καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα ⸀εὑρεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/010.yaml
  text: But the day of the Lord will come like a thief[a], in which the heavens will pass away with a roar, and the elements, being burned, will be dissolved[c][b], and the earth and the works in it will be found.
translation:
  language: ru
  text: Но день Господа придёт, как вор, и в тот день небеса с грохотом исчезнут, стихии, охваченные огнём, распадутся[a], а земля и дела на ней будут обнаружены[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «небесные тела»; слово στοιχεῖα в этом контексте может обозначать составные части мироздания, в частности небесные тела.'
    reason: lexical_alternative
  - marker: b
    text: Некоторые понимают слова «будут обнаружены» в смысле «будут обнажены» или «станут явными».
    reason: alternative_reading
  - marker: c
    text: 'Во многих рукописях: «земля и дела на ней сгорят».'
    reason: textual_variant
lexical_decisions:
- source_word: ἥξει
  choice: придёт
  rationale: Будущее время ἥκω естественно передаётся глаголом «придёт» и соответствует эсхатологическому контексту.
- source_word: ἡμέρα κυρίου
  choice: день Господа
  rationale: Сохраняет устойчивое пророческое и апостольское выражение, не смешивая его с обозначением еженедельного дня поклонения.
- source_word: κλέπτης
  choice: вор
  rationale: Обычное и точное соответствие; сравнение подчёркивает внезапность и непредсказуемость прихода.
- source_word: ἐν ᾗ
  choice: и в тот день
  rationale: Естественно для современного русского связывает последующие события с только что названным днём, не меняя временного значения конструкции.
- source_word: οἱ οὐρανοὶ
  choice: небеса
  rationale: Передаёт множественное число и космический масштаб контекста.
- source_word: ῥοιζηδόν
  choice: с грохотом
  rationale: Передаёт громкий стремительный шум; выражение понятно и сохраняет силу образа.
- source_word: παρελεύσονται
  choice: исчезнут
  rationale: В данном эсхатологическом контексте глагол означает прекращение нынешнего состояния или уход; «исчезнут» естественно по-русски и не добавляет механизма разрушения.
- source_word: στοιχεῖα
  choice: стихии
  rationale: Сохраняет широкий и намеренно неуточнённый смысл компонентов мироздания; возможное значение «небесные тела» вынесено в примечание.
- source_word: καυσούμενα
  choice: охваченные огнём
  rationale: Передаёт процесс горения и не называет прямо действующее лицо.
- source_word: λυθήσεται
  choice: распадутся
  rationale: Передаёт значение разложения или утраты связности точнее, чем более общее «будут уничтожены».
- source_word: γῆ
  choice: земля
  rationale: Космический контекст требует значения «земля», а не локального «страна» или «суша».
- source_word: τὰ ἐν αὐτῇ ἔργα
  choice: дела на ней
  rationale: Сохраняет ёмкость ἔργα, которое может обозначать совершённые дела или произведения деятельности, без преждевременного сужения смысла.
- source_word: εὑρεθήσεται
  choice: будут обнаружены
  rationale: Передаёт трудное чтение SBLGNT от εὑρίσκω («найти, обнаружить») и в русском звучит осмысленнее буквального «будут найдены», не превращая его молча в «сгорят».
theological_decisions:
- issue: Значение заключительной фразы καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα εὑρεθήσεται
  choice: «земля и дела на ней будут обнаружены» в основном тексте
  alternative: «будут обнажены / открыты»; по варианту рукописей — «сгорят»
  rationale: Исходный текст SBLGNT содержит трудное εὑρεθήσεται. Основной перевод сохраняет его прямое значение и не снимает толковательную напряжённость; смысловое толкование и текстовый вариант даны отдельно.
- issue: Референт στοιχεῖα
  choice: «стихии» без дополнительного уточнения
  alternative: «небесные тела» или «составные части мироздания»
  rationale: Контекст допускает разные конкретизации. Более широкое слово не навязывает одну космологическую интерпретацию.
translation_notes:
  register: Современный литературный русский с торжественным, но доступным библейским звучанием. Синтаксис сделан естественным для русского языка; трудное чтение финальной фразы и неоднозначность космологической лексики сохранены, а не сглажены.
