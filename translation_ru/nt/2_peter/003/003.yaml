- source_word: ἐν ἐμπαιγμονῇ ἐμπαῖκται
  choice: насмешники, которые будут насмехаться
  rationale: Сохраняется намеренное усиление посредством однокоренных греческих слов, при этом фраза звучит понятно по-русски.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν
  choice: по собственным желаниям
  rationale: «Желания» сохраняет широкое значение ἐπιθυμίαι и не сужает его до сексуальной похоти; «собственным» передаёт усиленное притяжательное выражение.
- source_word: πορευόμενοι
