  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ τὴν τοῦ κυρίου ἡμῶν μακροθυμίαν σωτηρίαν ἡγεῖσθε, καθὼς καὶ ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος κατὰ τὴν ⸂δοθεῖσαν αὐτῷ⸃ σοφίαν ἔγραψεν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/015.yaml
  text: And regard the patience of our Lord as salvation[a], just as our beloved brother Paul also wrote to you according to the wisdom given to him[b],
translation:
  language: ru
  text: И долготерпение нашего Господа считайте спасением[a], как и возлюбленный наш брат Павел написал вам согласно данной ему мудрости[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «терпение». Речь идёт о том, что Господь откладывает суд ради спасения, а не остаётся безучастным.'
    reason: lexical_alternative
  - marker: b
    text: Вероятнее всего, подразумевается мудрость, данная Богом, хотя в греческом тексте тот, кто её дал, прямо не назван.
    reason: alternative_reading
lexical_decisions:
- source_word: μακροθυμίαν
  choice: долготерпение
  rationale: Слово обозначает терпеливую сдержанность и отсрочку суда. «Долготерпение» сохраняет смысл длительного терпения Господа и остаётся понятным в современном литературном русском языке.
- source_word: σωτηρίαν
  choice: спасением
  rationale: В эсхатологическом контексте речь идёт о спасительной цели отсрочки суда; «спасение» сохраняет прямую предикативную связь и богословскую весомость греческого слова.
- source_word: ἡγεῖσθε
  choice: считайте
  rationale: Форма повелительного наклонения призывает читателей рассматривать долготерпение Господа определённым образом; конструкция «считайте спасением» естественно передаёт это значение.
- source_word: τοῦ κυρίου ἡμῶν
  choice: нашего Господа
  rationale: Сохраняются титул κύριος и принадлежность, выраженная местоимением «нашего».
- source_word: ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος
  choice: возлюбленный наш брат Павел
  rationale: Формулировка передаёт тёплое отношение к Павлу и близко следует порядку и смыслу греческого выражения, не становясь неестественной по-русски.
- source_word: κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν
  choice: согласно данной ему мудрости
  rationale: Предлог κατά выражает соответствие, а страдательная форма «данной» сохраняет не названного прямо деятеля.
- source_word: ἔγραψεν ὑμῖν
  choice: написал вам
  rationale: Простое прошедшее время естественно передаёт греческий аорист как указание на совершённое письменное обращение.
- source_word: καθὼς καὶ
  choice: как и
  rationale: Краткая русская конструкция сохраняет сравнительную связь и добавочное значение частицы καί.
theological_decisions:
- issue: Кем была дана Павлу мудрость
  choice: Сохранить страдательную конструкцию «данной ему», не добавляя в основной текст слова «Богом».
  alternative: «согласно мудрости, данной ему Богом»
  rationale: Контекст, вероятно, подразумевает Бога как дарующего мудрость, однако в греческом тексте деятель прямо не назван; перевод сохраняет эту недосказанность.
- issue: Смысл отсрочки действия Господа
  choice: Передать μακροθυμία как «долготерпение», а σωτηρία как «спасение», сохранив прямое отождествление в призыве автора.
  alternative: «считайте долготерпение Господа возможностью для спасения»
  rationale: Расширенный вариант яснее объяснял бы подразумеваемую цель, но добавлял бы отсутствующие в греческом тексте слова и ослаблял прямую формулировку «считайте спасением».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Долготерпение» выбрано как точное и укоренённое слово; синтаксис упрощён до естественного русского порядка без устранения смысловой напряжённости исходного текста.
