source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ποῦ ἐστιν ἡ ἐπαγγελία τῆς παρουσίας αὐτοῦ; ἀφ’ ἧς γὰρ οἱ πατέρες ἐκοιμήθησαν, πάντα οὕτως διαμένει ἀπ’ ἀρχῆς κτίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/004.yaml
  text: and saying[a], “Where is the promise of his coming? For ever since the fathers fell asleep[b], all things continue just as they have from the beginning of creation.”
translation:
  language: ru
  text: 'и говоря: «Где обещание Его пришествия[a]? Ведь с тех пор, как отцы уснули[b], всё с начала творения остаётся таким же».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово παρουσία может также означать «присутствие» или «прибытие». Здесь речь идёт об ожидаемом будущем возвращении Христа.
    reason: lexical_alternative
  - marker: b
    text: «Уснули» — употреблённое в греческом тексте иносказательное обозначение смерти.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: и говоря
  rationale: Причастная форма сохраняет синтаксическую связь с описанием насмешников в предыдущем стихе и не превращает оборот без необходимости в самостоятельное личное предложение.
- source_word: ἐπαγγελία
  choice: обещанное
  rationale: В вопросе подразумевается обещанное событие — пришествие. Субстантивированное «обещанное» звучит по-русски естественнее буквального «обещание пришествия», сохраняя смысл существительного ἐπαγγελία.
- source_word: παρουσίας
  choice: пришествие
  rationale: В данном эсхатологическом контексте παρουσία обозначает ожидаемое будущее прибытие и явление Христа. «Пришествие» ясно передаёт это значение и сохраняет традиционно узнаваемую библейскую лексику.
- source_word: ἀφ’ ἧς
  choice: с тех пор, как
  rationale: Оборот обозначает время, истекшее от названного события; выбранный вариант естественен для современного русского языка.
- source_word: οἱ πατέρες
  choice: отцы
  rationale: 'Греческий текст содержит определённый артикль, но не содержит притяжательного местоимения. «Отцы» сохраняет формулировку и возможную широту значения: прежние поколения или предки.'
- source_word: ἐκοιμήθησαν
  choice: уснули
  rationale: Сохранена греческая метафора сна как обозначения смерти, а её смысл пояснён в сноске.
- source_word: πάντα
  choice: всё
  rationale: Средний род множественного числа имеет совокупное значение; русское «всё» естественно передаёт всеобщий охват утверждения.
- source_word: οὕτως διαμένει
  choice: всё остаётся таким же
  rationale: Фраза выражает утверждение насмешников о неизменности миропорядка. Такой перевод естественно передаёт длительность διαμένει и значение οὕτως.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: как от начала творения
  rationale: Передаёт исходную временную точку и сохраняет «творение» как процесс или событие сотворения, не конкретизируя его сверх текста.
theological_decisions:
- issue: Значение παρουσία в эсхатологическом контексте
  choice: Его пришествие
  alternative: Его присутствие; Его прибытие
  rationale: Контекст насмешек над задержкой исполнения обещанного указывает на ожидаемое будущее возвращение Христа. «Пришествие» передаёт это, не сводя слово к статическому присутствию.
- issue: Метафора смерти в ἐκοιμήθησαν
  choice: уснули
  alternative: умерли; почили
  rationale: Исходный текст употребляет эвфемистическую метафору, поэтому она сохранена без превращения её в отдельное утверждение о состоянии умерших.
- issue: Кого обозначают οἱ πατέρες
  choice: отцы
  alternative: предки; праотцы; наши отцы
  rationale: Перевод не добавляет отсутствующее в греческом притяжательное местоимение и сохраняет некоторую неопределённость относительно того, имеются ли в виду предки вообще или прежние поколения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Причастный оборот «и говоря» намеренно сохраняет связь с предыдущим стихом. Метафора сна и неоднозначное «отцы» оставлены без скрытого истолкования.
