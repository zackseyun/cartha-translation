source:
  edition: SBLGNT
  text: Ταύτην ἤδη, ἀγαπητοί, δευτέραν ὑμῖν γράφω ἐπιστολήν, ἐν αἷς διεγείρω ὑμῶν ἐν ὑπομνήσει τὴν εἰλικρινῆ διάνοιαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/001.yaml
  text: Beloved[a], this is now the second letter I am writing to you; in both of them I am stirring up your sincere mind by way of reminder[b],
translation:
  language: ru
  text: Возлюбленные, это уже второе послание, которое я пишу вам. В обоих посланиях я напоминанием пробуждаю ваше чистое мышление[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваш искренний образ мыслей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Возлюбленные
  rationale: Сохраняет тёплое обращение и его эпистолярный и богословский вес; в современном литературном русском звучит возвышенно, но понятно.
- source_word: Ταύτην ἤδη ... δευτέραν ... ἐπιστολήν
  choice: это уже второе послание
  rationale: Естественно передаёт греческий порядок смысла и ἤδη, подчёркивая, что нынешнее послание — второе.
- source_word: γράφω
  choice: я пишу
  rationale: Русское настоящее время естественно передаёт эпистолярное настоящее без необходимости добавлять аспектуальное уточнение.
- source_word: ἐν αἷς
  choice: в обоих посланиях
  rationale: Женский род и множественное число относительного местоимения наиболее естественно отсылают к двум посланиям; явное повторение существительного делает связь ясной по-русски.
- source_word: διεγείρω
  choice: пробуждаю
  rationale: Передаёт метафору побуждения ума к деятельной внимательности и близко соответствует основному значению глагола.
- source_word: ἐν ὑπομνήσει
  choice: напоминанием
  rationale: Кратко и естественно выражает средство, посредством которого автор пробуждает мышление адресатов.
- source_word: εἰλικρινῆ διάνοιαν
  choice: чистый образ мыслей
  rationale: διάνοια здесь обозначает мышление или умонастроение, а εἰλικρινής — чистоту, неподдельность, искренность. Формулировка естественнее буквального «чистый ум» и сохраняет нравственно-интеллектуальный оттенок.
- source_word: ὑμῶν
  choice: в вас
  rationale: При перестройке конструкции с «пробуждаю» принадлежность образа мыслей адресатам естественно выражена предложным оборотом.
theological_decisions:
- issue: К чему относится множественное ἐν αἷς
  choice: К обоим посланиям, написанным адресатам
  alternative: Только к нынешнему посланию при свободном употреблении множественного числа
  rationale: Грамматически наиболее прямое понимание связывает местоимение женского рода во множественном числе с двумя посланиями. Перевод делает эту связь явной, не выводя из неё дополнительных утверждений об идентичности первого послания.
- issue: Смысл εἰλικρινῆ в сочетании с διάνοιαν
  choice: Чистый образ мыслей
  alternative: Искренний ум; неподдельное мышление
  rationale: Греческое выражение допускает оттенки чистоты и искренности. Основной текст использует естественную русскую формулировку, а сноска сохраняет значимую лексическую альтернативу.
translation_notes:
  register: Современный литературный русский с достоинством новозаветного послания. «Послание» выбрано вместо более бытового «письмо» как естественный жанровый термин; синтаксис разделён на два предложения ради ясности, без изменения смысловой связи.
