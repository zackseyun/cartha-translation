  source_fidelity: 'Текст точно передаёт синтаксический смысл греческого: цель увещания выражена конструкцией «чтобы вы помнили»; προειρημένων ῥημάτων передано как «слова, прежде сказанные», без неоправданного сужения до пророческих предсказаний; ἐντολή сохранена в единственном числе. Формулировка «заповедь Господа и Спасителя, переданную вашими апостолами» естественно выражает наиболее связное понимание генитивной цепочки — заповедь принадлежит/исходит от Господа и Спасителя и сообщена апостолами.'
  naturalness: Русский текст современный, литературный и хорошо читается. «Прежде сказанные» и «святые пророки» уместны в сдержанном библейском регистре, не будучи чрезмерно архаичными. Причастный оборот «переданную вашими апостолами» однозначно относится к «заповедь» и не создаёт стилистической тяжеловесности.
