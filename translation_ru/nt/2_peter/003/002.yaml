source:
  edition: SBLGNT
  text: μνησθῆναι τῶν προειρημένων ῥημάτων ὑπὸ τῶν ἁγίων προφητῶν καὶ τῆς τῶν ἀποστόλων ὑμῶν ἐντολῆς τοῦ κυρίου καὶ σωτῆρος,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/002.yaml
  text: to remember the words spoken beforehand by the holy prophets and the commandment of your apostles from the Lord and Savior[b][a],
translation:
  language: ru
  text: чтобы вы помнили слова, прежде сказанные святыми пророками, и заповедь Господа и Спасителя, переданную вашими апостолами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и заповедь ваших апостолов, исходящую от Господа и Спасителя». Сочетание родительных падежей в греческом допускает несколько способов связать эти слова.'
    reason: alternative_reading
lexical_decisions:
- source_word: μνησθῆναι
  choice: чтобы вы помнили
  rationale: Инфинитив зависит от контекста цели в ст. 1; по-русски личная конструкция естественнее и ясно передаёт обращение к читателям.
- source_word: τῶν προειρημένων ῥημάτων
  choice: слова, прежде сказанные
  rationale: Передаёт временное значение προειρημένων, не сужая его до предсказаний; «слова» естественно соответствует ῥημάτων.
- source_word: ὑπὸ τῶν ἁγίων προφητῶν
  choice: святыми пророками
  rationale: Творительный падеж естественно обозначает деятеля при страдательном причастии и сохраняет определение «святыми».
- source_word: ἐντολῆς
  choice: заповедь
  rationale: Сохраняет единственное число и авторитетный характер предписания; в новозаветном контексте звучит естественно и весомо.
- source_word: τῶν ἀποστόλων ὑμῶν
  choice: вашими апостолами
  rationale: Сохраняет связь ὑμῶν с ἀποστόλων, но в естественной русской конструкции обозначает посредников передачи заповеди.
- source_word: τοῦ κυρίου καὶ σωτῆρος
  choice: Господа и Спасителя
  rationale: Родительный падеж отнесён к «заповеди» и сохраняет формальную неоднозначность принадлежности/источника без добавления отсутствующего в греческом слова «нашего».
theological_decisions:
- issue: Синтаксическая связь τοῦ κυρίου καὶ σωτῆρος
  choice: «Господа и Спасителя» относится к заповеди, переданной через апостолов
  alternative: «Господа и Спасителя» может характеризовать апостолов как принадлежащих Ему
  rationale: 'Связь с ἐντολῆς наиболее связна по смыслу: заповедь исходит от Господа и Спасителя и сообщается апостолами. Русская формулировка делает основное понимание ясным, а примечание сохраняет грамматическую альтернативу.'
- issue: Отношение ὑμῶν к ἀποστόλων
  choice: «вашими» определяет «апостолами»
  alternative: «заповедь, данная вам апостолами»
  rationale: Порядок слов прямо связывает ὑμῶν с ἀποστόλων; перевод не подразумевает права собственности, а указывает на апостолов, служивших этим читателям.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Выражение «прежде сказанные» сохраняет оттенок исходного текста без архаичного «предречённые». Пунктуация связывает причастный оборот со «словами», а маркер примечания поставлен непосредственно после затрагиваемой части стиха.
