  source_fidelity: Перевод точно передаёт выводное οὖν («Итак»), эмфатическое обращение «вы, возлюбленные», предварительное знание προγινώσκοντες и продолжающееся предостережение φυλάσσεσθε. Оборот «оказавшись увлечёнными заблуждением беззаконных» адекватно выражает пассивное συναπαχθέντες и связь с τῇ ... πλάνῃ. «Не утратить собственной устойчивости» — естественная нейтральная передача предупреждения ἐκπέσητε τοῦ ἰδίου στηριγμοῦ; она не навязывает вывода о вероотступничестве.
