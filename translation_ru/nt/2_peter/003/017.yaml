id: 2PE.3.17
reference: 2 Peter 3:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὑμεῖς οὖν, ἀγαπητοί, προγινώσκοντες φυλάσσεσθε ἵνα μὴ τῇ τῶν ἀθέσμων πλάνῃ συναπαχθέντες ἐκπέσητε τοῦ ἰδίου στηριγμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/017.yaml
  text: Therefore[a], you, beloved, knowing this beforehand, guard yourselves so that, being carried away by the error of the lawless[b], you may not fall from your own stability.
translation:
  language: ru
  text: Итак, вы, возлюбленные, зная это заранее, будьте настороже, чтобы, оказавшись увлечёнными заблуждением беззаконных, не утратить[b] собственной устойчивости[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собственной стойкости». Греческое στηριγμός может означать твёрдость, устойчивость или стойкость.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «не отпасть от». Такой перевод сохраняет образ греческого глагола ἐκπίπτω, но может восприниматься как более определённое указание на вероотступничество, чем требует данный контекст.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς οὖν
  choice: Итак, вы
  rationale: «Итак» передаёт выводный переход οὖν, а явное «вы» сохраняет эмфатическое ὑμεῖς.
- source_word: ἀγαπητοί
  choice: возлюбленные
  rationale: Сохраняет пастырскую теплоту обращения и достойный эпистолярный регистр.
- source_word: προγινώσκοντες
  choice: зная это заранее
  rationale: Передаёт предварительное знание или предупреждение; «это» естественно восполняется из контекста.
- source_word: φυλάσσεσθε
  choice: будьте настороже
  rationale: Естественно передаёт продолжительную бдительность, выраженную настоящим императивом среднего залога.
- source_word: τῇ τῶν ἀθέσμων πλάνῃ
  choice: заблуждением беззаконных
  rationale: πλάνη здесь означает заблуждение или обман, а ἀθέσμων — людей, пренебрегающих нравственным законом.
- source_word: συναπαχθέντες
  choice: оказавшись увлечёнными
  rationale: Сохраняет пассивный смысл — быть увлечёнными вместе с другими, — не усиливая его до явно сознательного отступления.
- source_word: ἐκπέσητε
  choice: не утратить
  rationale: По-русски естественно передаёт выпадение из устойчивого положения; примечание сохраняет более буквальный образ падения.
- source_word: τοῦ ἰδίου στηριγμοῦ
  choice: собственной устойчивости
  rationale: Передаёт значение твёрдости или устойчивого положения и сохраняет усиление ἰδίου — «собственной».
theological_decisions:
- issue: Означает ли ἐκπέσητε вероотступничество или более общее лишение твёрдого положения
  choice: не утратить собственной устойчивости
  alternative: не отпасть от собственной стойкости
  rationale: Формулировка сохраняет серьёзность предупреждения, но не решает за текстом спор о потере спасения или окончательном вероотступничестве.
translation_notes:
  register: Современный литературный русский язык с тёплым, достойным эпистолярным обращением. Синтаксис остаётся близким к греческому, но повеление и предупреждение выражены естественно для современного читателя.
