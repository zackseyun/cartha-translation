review_pass:
  verdict: revise
  source_fidelity: 'В черновике верно переданы контраст с прежним миром, множественное «небеса», инструментальное «тем же словом», эсхатологический суд и то, что «гибель» синтаксически относится к нечестивым людям. Однако сочетание «сбережены для огня и сохраняются до дня» неудачно распределяет зависимые обстоятельства: в греческом πυρί («для огня») относится к τηρούμενοι («сохраняемые/хранимые»), а εἰς ἡμέραν («ко дню») задаёт цель или срок этого хранения. Кроме того, «сбережены» и «сохраняются» создают в русском почти тавтологическую, но недостаточно различённую пару.'
  naturalness: '«Отложены и сохраняются для огня ко дню суда» естественнее отражает два разных греческих причастных представления: уже отложены/запасены и продолжают сохраняться. Союзное «А» возможно, но «Но» яснее передаёт контрастивное δέ в современном литературном русском.'
  terminology: «Нечестивых людей» — точная и нейтральная передача τῶν ἀσεβῶν ἀνθρώπων; сноска не нужна, поскольку русское «людей» уже имеет общий, не гендерно-ограниченный смысл. «Гибель» допустимо передаёт ἀπώλεια, не предрешая характер окончательного суда или судьбу творения.
  issues:
  - severity: medium
    issue: Неясная синтаксическая связь «для огня и сохраняются до дня».
    rationale: Греческое πυρὶ непосредственно связано с τηρούμενοι, а εἰς ἡμέραν относится к сохранению для будущего дня. В текущей русской фразе «для огня» примыкает к «сбережены», тогда как «до дня» — к «сохраняются», что затушёвывает исходную конструкцию.
  - severity: low
    issue: Недостаточно отчётливо разграничены τεθησαυρισμένοι и τηρούμενοι.
    rationale: «Сбережены» и «сохраняются» однокоренно и почти дублируют друг друга. «Отложены и сохраняются» лучше передаёт совершившееся отложение и продолжающееся хранение.
  revised_text: Но нынешние небеса и земля тем же словом отложены и сохраняются для огня ко дню суда и гибели нечестивых людей.
