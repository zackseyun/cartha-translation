revisions:
- from: А нынешние небеса и земля тем же словом сбережены для огня и сохраняются до дня суда и гибели нечестивых людей.
  to: Но нынешние небеса и земля тем же словом отложены и сохраняются для огня ко дню суда и гибели нечестивых людей.
  rationale: Исправлена синтаксическая привязка обстоятельств и более ясно переданы перфектное «отложены» (τεθησαυρισμένοι εἰσίν) и настоящее страдательное «сохраняются» (τηρούμενοι). Формулировка не уточняет, означает ли огонь уничтожение или преображение небес и земли; «гибель» относится только к нечестивым людям, как в греческом тексте.
