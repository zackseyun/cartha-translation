  text: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ τῷ ⸀αὐτῷ λόγῳ τεθησαυρισμένοι εἰσὶν πυρὶ τηρούμενοι εἰς ἡμέραν κρίσεως καὶ ἀπωλείας τῶν ἀσεβῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/007.yaml
  text: But the present heavens and the earth are stored up by the same word, being kept for fire until the day of judgment and destruction of ungodly men.
translation:
  language: ru
  text: Но нынешние небеса и земля тем же словом отложены и сохраняются для огня ко дню суда и гибели нечестивых людей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ
  choice: А нынешние небеса и земля
  rationale: «А» естественно передаёт контраст δέ с прежним миром из предыдущего контекста; νῦν обозначает нынешний миропорядок. Множественное число οὐρανοί сохранено как «небеса».
- source_word: τῷ αὐτῷ λόγῳ
  choice: тем же словом
  rationale: Дательный падеж передан как орудийный; выражение отсылает к действенному Божьему слову, упомянутому ранее.
- source_word: τεθησαυρισμένοι εἰσὶν
  choice: сбережены
  rationale: Перифрастический перфект выражает состояние, возникшее вследствие совершившегося действия. «Сбережены» передаёт сохранённость для последующего события и не дублирует полностью следующее τηρούμενοι.
- source_word: πυρὶ τηρούμενοι
  choice: для огня и сохраняются
  rationale: Дательный πυρί понят как указание на предназначение, а τηρούμενοι — как продолжающееся сохранение. Русская конструкция передаёт обе греческие формы без утверждения, что огонь обязательно означает полное уничтожение творения.
- source_word: εἰς ἡμέραν κρίσεως
  choice: до дня суда
  rationale: εἰς имеет здесь временно-целевую направленность; «до дня суда» ясно обозначает эсхатологический предел сохранения.
- source_word: καὶ ἀπωλείας
  choice: и гибели
  rationale: «Гибель» естественно передаёт ἀπώλεια как уничтожение или пагубный исход, не превращая слово в позднейший специальный богословский термин.
- source_word: τῶν ἀσεβῶν ἀνθρώπων
  choice: нечестивых людей
  rationale: ἄνθρωποι обозначает людей вообще, а не исключительно мужчин; «нечестивых людей» точно и естественно передаёт родительный оборот и значение ἀσεβῶν.
theological_decisions:
- issue: Характер грядущего огненного конца
  choice: Стих говорит, что нынешние небеса и земля сохраняются для будущего огня, а нечестивых людей ожидает гибель.
  alternative: Полное уничтожение космоса или очищающее преображение творения.
  rationale: В данном стихе ἀπώλεια непосредственно относится к нечестивым людям. Перевод не решает более широкий вопрос о том, означает ли огонь уничтожение или преображение небес и земли.
translation_notes:
  register: Современный литературный русский язык; тон возвышенный, но понятный. Синтаксис сохраняет последовательность греческих образов и различает «сбережены» и «сохраняются».
