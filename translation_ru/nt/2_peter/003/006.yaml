lexical_decisions:
- source_word: δι’ ὧν
  choice: посредством которых
  rationale: διά с родительным падежом выражает средство или орудие действия. Множественное число относительного местоимения сохранено, а его отнесённость к названным в предыдущем стихе средствам намеренно не уточняется.
- source_word: ὁ τότε κόσμος
  choice: тогдашний мир
  rationale: Так передаётся мир в его состоянии в то время и сохраняется временное противопоставление нынешнему миру в ближайшем контексте.
- source_word: ὕδατι
  choice: водой
  rationale: Творительный падеж естественно передаёт значение средства при страдательном причастии.
- source_word: κατακλυσθεὶς
  choice: затопленный
  rationale: Страдательное причастие сохраняет грамматическую связь с главным глаголом и передаёт охваченность водой без добавления отсутствующего в греческом тексте существительного «потоп».
- source_word: ἀπώλετο
  choice: погиб
  rationale: Непереходное «погиб» передаёт среднее по форме значение глагола и не навязывает идею полного уничтожения или исчезновения.
theological_decisions:
- issue: Характер гибели мира при потопе
  choice: погиб
  alternative: был уничтожен
  rationale: Греческий глагол обозначает катастрофическую гибель, но сам по себе не требует понимать её как абсолютное уничтожение. Выбранный вариант сохраняет силу суда и не выходит за пределы текста.
translation_notes:
  register: Современный литературный русский язык; краткая и dignified формулировка. Порядок слов слегка адаптирован для естественности, при этом сохранены причастная конструкция, множественное число δι’ ὧν и смысловая неоднозначность ἀπώλετο.
