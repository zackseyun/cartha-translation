id: 2PE.3.13
reference: 2 Peter 3:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καινοὺς δὲ οὐρανοὺς καὶ γῆν καινὴν κατὰ τὸ ἐπάγγελμα αὐτοῦ προσδοκῶμεν, ἐν οἷς δικαιοσύνη κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/013.yaml
  text: But according to his promise[a], we are waiting for new heavens and a new earth, in which righteousness dwells.
translation:
  language: ru
  text: Но мы, по Его обещанию, ожидаем новых небес и новой земли, где обитает праведность.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καινοὺς ... οὐρανοὺς / γῆν καινὴν
  choice: новых небес и новой земли
  rationale: καινός указывает на новое по качеству или характеру, не уточняя, идёт ли речь о полном замещении или обновлении. «Небеса и земля» сохраняет библейский космический язык и связь с Ис 65:17; 66:22.
- source_word: δὲ
  choice: Но
  rationale: Частица обозначает мягкое противопоставление описанному ранее разрушению нынешних небес и земли.
- source_word: κατὰ τὸ ἐπάγγελμα αὐτοῦ
  choice: по Его обещанию
  rationale: κατά с винительным падежом выражает соответствие или основание ожидания; ἐπάγγελμα означает «обещание».
- source_word: προσδοκῶμεν
  choice: ожидаем
  rationale: Настоящее время передаёт продолжающееся, направленное в будущее ожидание; русское «ожидаем» естественно выражает этот смысл.
- source_word: ἐν οἷς
  choice: где
  rationale: Относительное местоимение во множественном числе относится к совокупности новых небес и новой земли; «где» естественно передаёт смысл без неуклюжего согласования.
- source_word: δικαιοσύνη
  choice: праведность
  rationale: «Праведность» сохраняет широкий нравственный и богословский смысл δικαιοσύνη — то, что право перед Богом; возможный оттенок «справедливость» отмечен в сноске.
- source_word: κατοικεῖ
  choice: обитает
  rationale: κατοικέω означает постоянно жить, пребывать; «обитает» кратко и достойно передаёт устойчивое присутствие.
theological_decisions:
- issue: Значение δικαιοσύνη в эсхатологическом контексте
  choice: праведность
  alternative: справедливость
  rationale: В новой реальности пребывает всё правое перед Богом; «праведность» сохраняет более широкий библейский смысл, тогда как «справедливость» передаёт важный, но более узкий возможный оттенок.
- issue: Характер новых небес и новой земли
  choice: новых небес и новой земли
  alternative: обновлённых небес и обновлённой земли
  rationale: Прилагательное καινός подчёркивает качественную новизну, но само по себе не решает вопрос между обновлением и замещением; перевод не должен устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок слов сделан естественным для русского; прописное «Его» использовано как уважительное указание на Бога.
