source:
  edition: SBLGNT
  text: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας ὅτι οὐρανοὶ ἦσαν ἔκπαλαι καὶ γῆ ἐξ ὕδατος καὶ δι’ ὕδατος συνεστῶσα τῷ τοῦ θεοῦ λόγῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/005.yaml
  text: 'For they deliberately overlook this: that the heavens existed long ago[a], and the earth was formed out of water and through water by the word of God[c][b],'
translation:
  language: ru
  text: Ведь они намеренно упускают из виду[a], что небеса существовали издревле, а земля[b] была образована из воды и посредством воды словом Бога[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «это остаётся от них скрытым по их собственной воле» или «они по своей воле не замечают этого». Греческое выражение соединяет незнание или незамечание с сознательной волевой установкой.'
    reason: lexical_alternative
  - marker: b
    text: Греческое γῆ может означать «земля» или «суша». В оригинале здесь нет артикля; в русском языке это различие непосредственно не выражается.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «велением Бога». Более буквально: «словом Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας
  choice: Ведь они намеренно упускают из виду
  rationale: Оборот сочетает значение незамечания с θέλοντας, указывающим на волевую установку. Перевод передаёт не случайное неведение, а сознательное нежелание замечать или признавать.
- source_word: οὐρανοὶ ἦσαν ἔκπαλαι
  choice: небеса существовали издревле
  rationale: Сохранено множественное число οὐρανοί и временное значение ἔκπαλαι; «издревле» уместно в возвышенном, но понятном современном библейском изложении.
- source_word: γῆ
  choice: земля
  rationale: «Земля» естественно передаёт γῆ в космологическом контексте и сохраняет возможный смысл как мира земли, так и суши; отсутствие артикля невозможно непосредственно воспроизвести средствами русского языка.
- source_word: ἐξ ὕδατος καὶ δι’ ὕδατος
  choice: из воды и посредством воды
  rationale: 'Различие предлогов ἐκ и διά сохранено: первый указывает на исходную среду или происхождение, второй — на посредство, не устраняя смысловой трудности выражения.'
- source_word: συνεστῶσα
  choice: была образована
  rationale: Перфектное причастие описывает устроение или сложение земли и её существование в таком состоянии. «Была образована» естественно звучит в контексте творения, хотя возможны оттенки «устроена» и «составлена».
- source_word: τῷ τοῦ θεοῦ λόγῳ
  choice: словом Бога
  rationale: Творительный падеж передаёт инструментальный дательный, а «словом Бога» формально сохраняет λόγος, не сводя его заранее только к повелению и не превращая явно в личный титул.
theological_decisions:
- issue: Следует ли понимать λόγος как личный титул Логоса или как Божье творческое повеление
  choice: словом Бога
  alternative: велением Бога
  rationale: В данном контексте речь идёт о действенном Божьем слове при творении, но сам стих не отождествляет λόγος явно с личным титулом Сына. Формулировка сохраняет эту смысловую открытость.
- issue: Как передать соотношение земли с водой
  choice: из воды и посредством воды
  alternative: из воды и через воду
  rationale: Буквальное разграничение ἐξ и διά сохранено без попытки навязать стиху определённую космологическую реконструкцию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Издревле» сохраняет торжественный тон, оставаясь общеупотребительным; синтаксис сделан ясным без устранения неоднозначности выражений о воде и Божьем слове.
