source:
  edition: SBLGNT
  text: οὐ βραδύνει ⸀κύριος τῆς ἐπαγγελίας, ὥς τινες βραδύτητα ἡγοῦνται, ἀλλὰ μακροθυμεῖ εἰς ⸀ὑμᾶς, μὴ βουλόμενός τινας ἀπολέσθαι ἀλλὰ πάντας εἰς μετάνοιαν χωρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/009.yaml
  text: The Lord is not slow concerning the promise[a], as some consider slowness, but is patient toward you[c][b], not wanting any to perish but all to come to repentance.
translation:
  language: ru
  text: Господь не медлит относительно обещания, как некоторые считают промедлением, но долго терпит вас, не желая, чтобы кто-либо погиб, но чтобы все пришли к покаянию[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Объём слов «вам», «кто-либо» и «все» оставлен таким, как в греческом тексте. Толкователи расходятся во мнениях, относится ли это прежде всего к адресатам послания или шире — ко всему человечеству.
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: Господь
  rationale: Естественная и традиционная передача божественного титула в данном контексте.
- source_word: οὐ βραδύνει ... τῆς ἐπαγγελίας
  choice: не медлит с исполнением обещания
  rationale: Русское «медлить с исполнением обещания» естественно передаёт конструкцию с родительным падежом; слово «исполнением» делает подразумеваемое отношение ясным, не меняя смысла.
- source_word: ὥς τινες βραδύτητα ἡγοῦνται
  choice: как некоторые считают это промедлением
  rationale: Передаёт значение ἡγέομαι «считать, расценивать» и сохраняет лексическую связь βραδύνει/βραδύτητα через «медлит/промедлением».
- source_word: μακροθυμεῖ
  choice: проявляет долготерпение
  rationale: Передаёт длительное терпеливое воздержание; выражение современно, понятно и сохраняет более весомый оттенок, чем простое «терпелив».
- source_word: εἰς ὑμᾶς
  choice: к вам
  rationale: Близко передаёт направленность отношения или действия, выраженную εἰς, и естественно звучит с «проявляет долготерпение».
- source_word: μὴ βουλόμενός
  choice: не желая
  rationale: Сохраняет значение желания или воли, не превращая его в специальный богословский термин.
- source_word: τινας ἀπολέσθαι
  choice: чтобы кто-либо погиб
  rationale: «Погиб» естественно и весомо передаёт непереходное значение ἀπολέσθαι; «кто-либо» не сужает круг подразумеваемых лиц.
- source_word: πάντας
  choice: все
  rationale: Сохраняет краткое и неуточнённое обобщение греческого текста в противопоставлении «кто-либо ... все».
- source_word: εἰς μετάνοιαν χωρῆσαι
  choice: пришли к покаянию
  rationale: Идиоматично передаёт вхождение в состояние, выраженное χωρέω εἰς; «покаяние» является точным и общеупотребительным эквивалентом μετάνοια.
theological_decisions:
- issue: Объём референции местоимения «вам» и слов «кто-либо» и «все»
  choice: 'Оставить объём без уточнения: «к вам ... кто-либо ... все».'
  alternative: Ограничить эти слова адресатами послания или явно распространить их на всё человечество.
  rationale: Греческий текст сам не вводит такого пояснения; перевод сохраняет его подлинную богословскую напряжённость и не навязывает конфессионального толкования.
- issue: Характер желания Бога в μὴ βουλόμενός
  choice: «не желая»
  alternative: «не постановив», «не допустив» или техническое различение видов Божьей воли.
  rationale: Причастие выражает волю или желание, но не определяет его в категориях позднейшей систематики.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Синтаксис остаётся ясным для широкого читателя; сохранены риторическое противопоставление и неопределённость объёма «кто-либо/все».
