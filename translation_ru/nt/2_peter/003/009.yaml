revisions:
- from: Господь не медлит с исполнением обещания, как некоторые считают это промедлением, но проявляет долготерпение к вам[a], не желая, чтобы кто-либо погиб, но чтобы все пришли к покаянию.
  to: Господь не медлит относительно обещания, как некоторые считают промедлением, но долго терпит вас, не желая, чтобы кто-либо погиб, но чтобы все пришли к покаянию[a].
  rationale: Правка устраняет интерпретационное добавление «с исполнением», сохраняет компактную конструкцию оригинала и делает сноску явно относящейся ко всем трём спорным референтам. Неоднозначность объёма «вам», «кто-либо» и «все» сохранена без конфессионального уточнения.
