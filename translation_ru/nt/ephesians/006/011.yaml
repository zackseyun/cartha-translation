  source_fidelity: «Облекитесь во всеоружие Божье» точно передаёт повелительный характер ἐνδύσασθε, полноту πανοπλία и намеренно широкий родительный τοῦ θεοῦ. «Чтобы вы могли устоять» адекватно выражает конструкцию цели πρὸς τὸ δύνασθαι ὑμᾶς στῆναι; «устоять» уместно передаёт контекстуальный смысл удержаться перед лицом противодействия. «Против козней дьявола» соответствует πρὸς τὰς μεθοδείας τοῦ διαβόλου.
