source:
  edition: SBLGNT
  text: ἐνδύσασθε τὴν πανοπλίαν τοῦ θεοῦ πρὸς τὸ δύνασθαι ὑμᾶς στῆναι πρὸς τὰς μεθοδείας τοῦ διαβόλου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/011.yaml
  text: Put on the full armor of God[b][a], so that you may be able to stand against the schemes of the devil.
translation:
  language: ru
  text: Облекитесь во всеоружие Божье[a], чтобы вы могли устоять против козней дьявола[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во все Божьи доспехи». Греческое слово обозначает полное вооружение и снаряжение воина.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «коварных замыслов», «уловок».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: Облекитесь
  rationale: Аорист, повелительное наклонение, средний залог, 2-е лицо множественного числа. «Облекитесь» естественно сочетается с образом доспехов, сохраняет силу повеления и возвратный оттенок формы.
- source_word: πανοπλίαν
  choice: всеоружие
  rationale: Слово обозначает полное снаряжение тяжеловооружённого воина, а не только защитные доспехи. «Всеоружие» кратко и точно передаёт идею полного воинского оснащения; возможный более прозрачный вариант пояснён в сноске.
- source_word: τοῦ θεοῦ
  choice: Божье
  rationale: 'Родительный падеж оставлен достаточно широким: выражение может указывать на принадлежность Богу и на то, что это вооружение предоставлено Богом, без жёсткого выбора только одного оттенка.'
- source_word: πρὸς τὸ δύνασθαι ὑμᾶς στῆναι
  choice: чтобы вы могли устоять
  rationale: Конструкция с артиклевым инфинитивом выражает цель. Перевод прямо сохраняет значение способности и естественно формулирует цель повеления.
- source_word: στῆναι
  choice: устоять
  rationale: В контексте воинского противостояния глагол означает не просто стоять, а удержаться и не уступить натиску. «Устоять» естественно передаёт этот контекстуальный смысл без лишнего расширения.
- source_word: μεθοδείας
  choice: козней
  rationale: Существительное обозначает коварные приёмы, уловки или замыслы. «Козни» ясно передают враждебность и обманный характер действий; альтернативы приведены в сноске.
- source_word: τοῦ διαβόλου
  choice: дьявола
  rationale: В контексте духовной борьбы слово употреблено как устойчивое обозначение личного противника, а не просто как нарицательное «клеветник».
theological_decisions:
- issue: Значение родительного τοῦ θεοῦ при «всеоружии»
  choice: Божье
  alternative: данное Богом
  rationale: Форма «Божье» сохраняет ёмкость греческого родительного и не сводит его исключительно к источнику или исключительно к принадлежности.
- issue: Референт διάβολος
  choice: дьявол как личный злой противник
  alternative: клеветник
  rationale: Непосредственный контекст духовной борьбы в Ефесянам 6 указывает на личного сверхъестественного противника. Перевод не добавляет к этому иных доктринальных уточнений.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной, но понятной библейской образностью. «Всеоружие» сохраняет военную метафору и полноту греческого термина; сноска предлагает более прозрачную формулировку. Синтаксис краткий и естественный, обращение во множественном числе сохранено.
