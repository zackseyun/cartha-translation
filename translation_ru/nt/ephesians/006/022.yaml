  naturalness: «Я послал его к вам именно для того, чтобы вы узнали, что с нами, и чтобы он ободрил ваши сердца» — естественная современная литературная русская фраза с достойным библейским регистром. «Ободрил ваши сердца» сохраняет традиционный образ и понятен без архаизации.
  terminology: «Ободрил» уместно передаёт παρακαλέσῃ в этом контексте, не исключая возможных оттенков утешения или укрепления. «Сердца» следует сохранить как прямой и естественный эквивалент τὰς καρδίας. Сноска должна отражать широту τὰ περὶ ἡμῶν, а не поддерживать сужающее «как мы живём».
