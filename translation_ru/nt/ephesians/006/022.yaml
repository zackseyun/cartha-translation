source:
  edition: SBLGNT
  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα γνῶτε τὰ περὶ ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/022.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: ru
  text: Я послал его к вам именно для того, чтобы вы узнали, что с нами[a], и чтобы он ободрил ваши сердца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «узнали о нас»; «узнали о наших обстоятельствах»; буквально: «то, что касается нас».'
    reason: Греческое τὰ περὶ ἡμῶν охватывает как сведения о людях, так и об их обстоятельствах.
lexical_decisions:
- source_word: ὃν
  choice: его
  rationale: Винительный падеж относительного местоимения относится к Тихику из предыдущего стиха; в русском придаточное естественно передаётся самостоятельным предложением с местоимением «его».
- source_word: ἔπεμψα
  choice: Я послал
  rationale: Аорист естественно передаётся русским прошедшим временем; форма сохраняет личное действие Павла.
- source_word: πρὸς ὑμᾶς
  choice: к вам
  rationale: С глаголом посылания πρός с винительным обозначает направление к адресатам.
- source_word: εἰς αὐτὸ τοῦτο
  choice: именно для того
  rationale: «Именно» передаёт усиление αὐτὸ, а вся конструкция ясно выражает цель.
- source_word: ἵνα
  choice: чтобы
  rationale: Союз естественно и точно вводит в русском языке придаточное цели.
- source_word: γνῶτε τὰ περὶ ἡμῶν
  choice: вы узнали, как мы живём
  rationale: Оборот охватывает положение и обстоятельства Павла и его спутников; русское «как мы живём» звучит естественно, не ограничивая смысл только внешними условиями.
- source_word: καὶ
  choice: и чтобы
  rationale: Повтор союза «чтобы» ясно координирует вторую цель с первой.
- source_word: παρακαλέσῃ
  choice: он ободрил
  rationale: В сочетании с «сердцами» и в пастырском контексте παρακαλέω означает укрепить духом, ободрить; это не исключает оттенка утешения.
- source_word: τὰς καρδίας ὑμῶν
  choice: ваши сердца
  rationale: Сохраняется естественный для библейской речи образ внутреннего мира человека.
theological_decisions:
- issue: Значение τὰ περὶ ἡμῶν
  choice: «как мы живём» — личное состояние вместе с жизненными обстоятельствами
  alternative: «что с нами»; «о наших обстоятельствах»; «всё о нас»
  rationale: Греческий оборот допускает как сведения о состоянии людей, так и об их обстоятельствах. Основной текст передаёт оба аспекта без сведения смысла лишь к внешней обстановке; варианты отмечены в сноске.
- issue: Оттенок παρακαλέω
  choice: «ободрил»
  alternative: «утешил»; «укрепил»; «наставил»
  rationale: Контекст заботы о сердцах адресатов прежде всего указывает на ободрение, однако многозначность глагола не превращается в узкое конфессиональное толкование.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис естественный, при этом сохранены целевая структура стиха и библейский образ «сердца».
