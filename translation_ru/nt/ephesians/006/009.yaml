  text: Καὶ οἱ κύριοι, τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς, ἀνιέντες τὴν ἀπειλήν, εἰδότες ὅτι καὶ ⸂αὐτῶν καὶ ὑμῶν⸃ ὁ κύριός ἐστιν ἐν οὐρανοῖς, καὶ προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/009.yaml
  text: And masters[a], do the same things toward them, giving up threatening, knowing that both their Master and yours is in heaven[c][b], and there is no partiality with him.
translation:
  language: ru
  text: И вы, господа[a], поступайте с ними так же, отказавшись от угроз[b], зная, что и их, и ваш Господь — на небесах[c] и что у Него нет пристрастия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть господа рабов; речь идёт о социальных отношениях древнего домашнего уклада, а не о современных работодателях.
    reason: historical_context
  - marker: b
    text: 'Или: «перестав угрожать». Греческое выражение означает прекратить угрозы как способ обращения с подчинёнными.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в небесах».'
    reason: literal_rendering
lexical_decisions:
- source_word: κύριοι
  choice: господа
  rationale: В контексте древнего домашнего уклада слово обозначает господ по отношению к рабам. «Господа» исторически точно и не превращает эти отношения в современные трудовые.
- source_word: τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς
  choice: поступайте с ними так же
  rationale: Естественная русская формулировка сохраняет связь с предыдущим наставлением и подчёркивает взаимность требуемого отношения.
- source_word: ἀνιέντες τὴν ἀπειλήν
  choice: оставив угрозы
  rationale: Передаёт прекращение привычки угрожать; деепричастная конструкция сохраняет зависимость от повеления.
- source_word: εἰδότες
  choice: зная
  rationale: Сохраняет причастную структуру греческого текста и подразумеваемое основание повеления.
- source_word: καὶ αὐτῶν καὶ ὑμῶν ὁ κύριος
  choice: и их, и ваш Господин
  rationale: 'Сохраняет повтор одного корня κύριος внутри стиха и риторический переворот: земные господа сами подчинены общему небесному Господину.'
- source_word: ἐν οὐρανοῖς
  choice: на небесах
  rationale: Естественный русский библейский эквивалент греческой формы множественного числа без устранения её образности.
- source_word: προσωπολημψία
  choice: лицеприятие
  rationale: Устоявшееся и точное русское слово для пристрастия, основанного на общественном положении или внешнем статусе.
- source_word: παρ’ αὐτῷ
  choice: у Него
  rationale: Идиоматично выражает отсутствие лицеприятия в Божьем отношении и суде.
theological_decisions:
- issue: Передача κύριος применительно к земным и небесному господину
  choice: «господа» для людей и «Господин» для небесного κύριος
  alternative: «господа» и «Господь»
  rationale: '«Господин» сохраняет лексическую связь и контраст внутри стиха: те, кто являются господами для рабов, сами имеют Господина на небесах. При этом заглавная буква ясно указывает на божественного референта, не устраняя смысловую напряжённость.'
- issue: Обозначение древнего социального статуса
  choice: «господа»
  alternative: «хозяева» или «работодатели»
  rationale: «Работодатели» анахронично смягчило бы рабовладельческий контекст, а «хозяева» могло бы чрезмерно выделить собственность; «господа» передаёт именно властное социальное отношение.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Формулировка ясна обычному читателю, сохраняет историческую дистанцию, взаимность наставления и словесную связь между земными господами и небесным Господином.
