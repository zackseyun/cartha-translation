  source_fidelity: Причастная конструкция «служа … как Господу, а не людям» точно передаёт δουλεύοντες, ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις. Однако «от души» прежде всего означает искренне, усердно или wholeheartedly и не вполне выражает εὔνοια — доброжелательное, благосклонное расположение.
  naturalness: Текст краток, современен и естественно продолжает синтаксис предыдущего стиха. «С доброй волей» несколько книжнее, чем «от души», но в данном нравственном наставлении звучит нормально и точнее. Конечная запятая уместна, поскольку фраза является продолжением предложения.
  terminology: «Господу» верно сохраняет κύριος как божественный титул; «людям» точно передаёт родовое ἀνθρώποις и не требует гендерной сноски. «Служа» допустимо в контексте, где статус рабов назван ранее, хотя δουλεύοντες имеет рабский оттенок.
