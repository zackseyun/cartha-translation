  text: служа с доброй волей, как Господу, а не людям,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετ’ εὐνοίας
  choice: от души
  rationale: Оборот передаёт образ действия и внутреннюю доброжелательную готовность. «От души» естественно по-русски выражает искреннее, охотное служение, не сводя смысл лишь к внешней любезности.
- source_word: δουλεύοντες
  choice: служа
  rationale: Причастие δουλεύω обозначает служение раба. Поскольку положение адресатов прямо названо в ближайшем контексте (Еф. 6:5), здесь естественное «служа» сохраняет основной глагольный смысл без тяжеловесного повтора.
- source_word: ὡς
  choice: как
  rationale: Передаёт сравнение и направленность служения, не добавляя оттенка нереальности, который могло бы внести «как будто».
- source_word: τῷ κυρίῳ
  choice: Господу
  rationale: κύριος здесь обозначает божественного Господа, в контексте Послания — Христа. «Господу» сохраняет титул и отличает Его от земных господ.
- source_word: ἀνθρώποις
  choice: людям
  rationale: ἄνθρωποι во множественном числе здесь означает людей как человеческих существ в противопоставлении Господу; русское «людям» точно и естественно передаёт этот общий смысл.
theological_decisions:
- issue: Передача κύριος в противопоставлении земным господам
  choice: Господу
  alternative: господину
  rationale: «Господу» сохраняет христологический титул и ясное противопоставление между высшим адресатом служения и людьми.
- issue: Степень выраженности рабского значения δουλεύοντες
  choice: служа
  alternative: служа как рабы
  rationale: Социальное положение адресатов уже обозначено в предыдущем контексте; добавление «как рабы» здесь было бы поясняющим расширением сверх формы данного стиха.
- issue: Передача внутреннего расположения μετ’ εὐνοίας
  choice: от души
  alternative: с доброй волей
  rationale: «От души» в современном русском ясно выражает искреннее и охотное расположение; «с доброй волей» формальнее и может звучать неестественно.
translation_notes:
  register: Современный литературный русский язык; краткая причастная конструкция сохраняет связь с предыдущим стихом. Регистр достойный и понятный, без архаизмов. Запятая в конце отражает незавершённость предложения в пределах более широкого контекста.
