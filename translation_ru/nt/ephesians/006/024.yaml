  text: ἡ χάρις μετὰ πάντων τῶν ἀγαπώντων τὸν κύριον ἡμῶν Ἰησοῦν Χριστὸν ἐν ⸀ἀφθαρσίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/024.yaml
  text: Grace be with all who love our Lord Jesus the Messiah with incorruptibility[a].
translation:
  language: ru
  text: Благодать да будет со всеми, кто любит нашего Господа Иисуса Мессию в нетлении[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «непреходящей любовью»; возможны также переводы «искренне» или «неизменно». Греческое выражение буквально означает «в нетлении» и допускает разные толкования.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: Благодать
  rationale: Сохраняет обычный для посланий Павла язык заключительного благословения; постановка в начале предложения не предполагает олицетворения.
- source_word: μετὰ πάντων
  choice: да будет со всеми
  rationale: В греческом сказуемое не выражено; русская формула благословения естественно восполняет его словами «да будет», а μετά с родительным передано как «со всеми».
- source_word: ἀγαπώντων
  choice: кто любит
  rationale: Субстантивированное причастие передано естественным русским придаточным; настоящее время обозначает устойчивую характеристику.
- source_word: τὸν κύριον ἡμῶν
  choice: нашего Господа
  rationale: «Господь» сохраняет значение κύριος как христологического титула; порядок слов соответствует современному литературному русскому.
- source_word: Ἰησοῦν Χριστόν
  choice: Иисуса Мессию
  rationale: Χριστός передано по значению титула «Мессия», а не как непрозрачная транслитерация; русское склонение ясно связывает оба наименования с дополнением при «любит».
- source_word: ἐν ἀφθαρσίᾳ
  choice: в нетлении
  rationale: Краткая формально близкая передача сохраняет неоднозначность греческого оборота и не решает без достаточных оснований, относится ли он к любви, к любящим или к сфере благословения.
theological_decisions:
- issue: Смысл и синтаксическая связь ἐν ἀφθαρσίᾳ
  choice: Сохранить в основном тексте буквальный и неоднозначный оборот «в нетлении»
  alternative: «непреходящей любовью»; «искренне»; «неизменно»
  rationale: Греческий текст не уточняет однозначно, описывает ли ἀφθαρσία любовь верующих, образ их любви или более широкую сферу нетления. Интерпретирующие варианты поэтому вынесены в сноску.
translation_notes:
  register: 'Современный литературный русский с достоинством заключительного апостольского благословения. Оборот «в нетлении» намеренно несколько формален: он сохраняет краткость и реальную неоднозначность исходного текста, а более плавные истолковывающие варианты приведены в сноске.'
