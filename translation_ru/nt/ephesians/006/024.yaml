  source_fidelity: 'Текст точно передаёт структуру благословения: χάρις как «Благодать», подразумеваемое пожелание «да будет», μετά πάντων как «со всеми», субстантивированное ἀγαπώντων как «кто любит» и титул κύριος как «Господь». Формула «Иисуса Мессию» сохраняет титульное значение Χριστός. Оборот «в нетлении» формально близок к ἐν ἀφθαρσίᾳ и, не навязывая синтаксической связи, оправданно сохраняет исходную неоднозначность.'
