  language: ru
  text: чтобы тебе было хорошо и ты долго жил на земле[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в земле» — как отзвук формулировки пятой заповеди в Исходе 20:12 и Второзаконии 5:16.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт целевое или результативное значение союза и естественно связывает обещание с предыдущей заповедью.
- source_word: εὖ σοι γένηται
  choice: тебе было хорошо
  rationale: Естественный русский эквивалент греческой идиомы со значением благополучного исхода; сохраняет личное обращение.
- source_word: καὶ
  choice: и
  rationale: Простой сочинительный союз, соединяющий две части обещания.
- source_word: ἔσῃ μακροχρόνιος
  choice: ты долго жил
  rationale: Формально выражение означает «ты будешь долговечен»; по-русски смысл естественно передаётся глагольным оборотом «долго жил».
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Следует непосредственно греческой формулировке и не добавляет отсутствующего здесь уточнения о конкретной земле; возможная отсылка к земле обетованной отмечена в сноске.
theological_decisions:
- issue: Объём значения ἐπὶ τῆς γῆς в связи с обещанием пятой заповеди
  choice: на земле
  alternative: в земле
  rationale: Греческий текст допускает широкое значение «на земле» и не содержит уточнения, ограничивающего обещание землёй Израиля. При этом ветхозаветный фон сохраняется как реальная альтернатива в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Синтаксис сохраняет связь с предыдущим стихом, поэтому текст начинается со строчной буквы.
