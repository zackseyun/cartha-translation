  text: Finally[a], be strengthened in the Lord and in the strength of his might.
translation:
  language: ru
  text: Наконец, укрепляйтесь[a] в Господе и в могуществе Его силы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будьте сильны в Господе». Греческий глагол может передаваться этой более идиоматичной формой; «укрепляйтесь» сохраняет его динамический характер и может подразумевать, что сила обретается, а не производится самостоятельно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: Наконец
  rationale: Устойчивый переход к заключительному наставлению. «Наконец» естественно передаёт дискурсивную функцию выражения, тогда как буквальное «в остальном» здесь звучало бы неясно.
- source_word: ἐνδυναμοῦσθε
  choice: укрепляйтесь
  rationale: 'Возвратная форма повелительного наклонения сохраняет воспринимающий оттенок греческой формы: адресаты должны обретать силу не только за счёт собственной решимости. Вместе с тем греческая форма допускает более идиоматическое понимание «будьте сильны», отмеченное в сноске.'
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Предлог сохранён, чтобы не сводить выражение исключительно к орудию действия («Господом») и передать характерный для Павла смысл сферы и отношения.
- source_word: κράτει
  choice: могуществе
  rationale: Слово обозначает действенно проявляющуюся мощь. «Могущество» отличает его от ἰσχύς и сохраняет торжественную насыщенность греческого сочетания.
- source_word: ἰσχύος
  choice: силы
  rationale: «Сила» естественно передаёт ἰσχύς и образует понятное, хотя намеренно весомое сочетание «могущество Его силы».
- source_word: αὐτοῦ
  choice: Его
  rationale: Местоимение непосредственно отсылает к Господу; повтор существительного не требуется.
theological_decisions:
- issue: Залог и источник укрепления в ἐνδυναμοῦσθε
  choice: «укрепляйтесь» — призыв принимать силу в Господе, а не просто мобилизовать собственную волю
  alternative: «будьте сильны»
  rationale: Греческая форма допускает среднее или страдательное понимание. Основной перевод сохраняет воспринимающий оттенок, не уточняя сверх текста конкретный механизм укрепления; идиоматическая альтернатива приведена в сноске.
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: В данном контексте это естественное и традиционно понятное обозначение возвышенного Христа; дополнительное пояснение в тексте стиха не требуется.
- issue: Значение двух конструкций с ἐν
  choice: Сохранить «в Господе» и «в могуществе», не сводя вторую конструкцию однозначно к инструментальному значению
  alternative: «Господом и могуществом Его силы»
  rationale: 'Повтор «в» сохраняет структуру и некоторую смысловую открытость греческого текста: речь может идти о сфере, основании или средстве укрепления.'
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной формулировкой. Сочетание «в могуществе Его силы» намеренно сохраняет риторическое нагромождение близких понятий в греческом тексте.
