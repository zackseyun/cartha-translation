  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἵνα δὲ ⸂εἰδῆτε καὶ ὑμεῖς⸃ τὰ κατ’ ἐμέ, τί πράσσω, πάντα ⸂γνωρίσει ὑμῖν⸃ Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/021.yaml
  text: So that you also may know the things concerning me[a], what I am doing, Tychicus, the beloved brother and faithful minister in the Lord[b], will make everything known to you.
translation:
  language: ru
  text: А чтобы и вы знали о моих обстоятельствах[a] и о том, что я делаю, обо всём вам расскажет Тихик, любимый брат и верный служитель в Господе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «о том, что касается меня»; возможно также: «о моём положении».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «верный слуга»; греч. διάκονος может означать служителя, слугу, а в некоторых контекстах — диакона.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἵνα δὲ
  choice: А чтобы
  rationale: ἵνα вводит цель, а δέ мягко связывает эту фразу с предыдущим контекстом; «А чтобы» естественно передаёт обе функции.
- source_word: εἰδῆτε καὶ ὑμεῖς
  choice: и вы знали
  rationale: 'καί при выраженном ὑμεῖς подчёркивает присоединение адресатов: «и вы» или «вы тоже».'
- source_word: τὰ κατ’ ἐμέ
  choice: о моих обстоятельствах
  rationale: Греческое выражение буквально обозначает «то, что касается меня» и в данном контексте естественно указывает на положение и дела Павла; сноска сохраняет более буквальную возможность.
- source_word: τί πράσσω
  choice: о том, что я делаю
  rationale: Прямо и естественно передаёт вопросительное местоимение и настоящее время πράσσω.
- source_word: πάντα γνωρίσει ὑμῖν
  choice: обо всём вам расскажет
  rationale: γνωρίζω означает сообщить или сделать известным; русское «расскажет» естественно для личного сообщения Тихика и сохраняет объём πάντα.
- source_word: Τυχικὸς
  choice: Тихик
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: любимый брат
  rationale: Сохраняет выражение христианского родства и сердечную оценку ἀγαπητός без архаизации.
- source_word: πιστὸς διάκονος
  choice: верный служитель
  rationale: διάκονος здесь обозначает надёжного участника служения; контекст не требует понимания термина как названия формальной должности.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Сохранена характерная для Павла формула, выражающая сферу отношений и служения во Христе.
theological_decisions:
- issue: Значение διάκονος применительно к Тихику
  choice: служитель
  alternative: слуга; диакон
  rationale: Контекст описывает служение доверенного соработника, но не устанавливает однозначно формальную церковную должность; «служитель» сохраняет функциональный смысл и неоднозначность термина.
- issue: Передача ἀδελφός
  choice: брат
  alternative: собрат
  rationale: Речь идёт об одном известном мужчине-соработнике, поэтому «брат» точно передаёт и пол, и христианскую родственность.
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — естественная и традиционно точная передача титула κύριος в формуле ἐν κυρίῳ.
translation_notes:
  register: 'Современный литературный русский язык с достоинством апостольского письма. Порядок слов перестроен ради естественного русского синтаксиса: подлежащее «Тихик» помещено ближе к сказуемому. Все смысловые компоненты греческого текста сохранены; неоднозначность τὰ κατ’ ἐμέ и διάκονος отмечена в сносках.'
