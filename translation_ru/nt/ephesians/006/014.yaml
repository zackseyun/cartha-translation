lexical_decisions:
- source_word: στῆτε
  choice: стойте
  rationale: Аористный императив во втором лице множественного числа выражает решительный призыв занять и удерживать позицию; «стойте» передаёт сам глагол без добавления отсутствующего в нём наречия «твёрдо».
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предшествующего наставления естественным для современного русского языка способом.
- source_word: περιζωσάμενοι τὴν ὀσφὺν ὑμῶν
  choice: опоясав бёдра
  rationale: Сохраняет конкретный образ опоясывания области поясницы, не прибегая к устаревшему «препоясав чресла» и не добавляя прямо не названного существительного «пояс».
- source_word: ἐν ἀληθείᾳ
  choice: истиной
  rationale: Творительный падеж естественно передаёт средство или содержание опоясывания и оставляет открытыми оттенки объективной истины и правдивости.
- source_word: ἐνδυσάμενοι
  choice: надев
  rationale: Естественно передаёт аористное причастие в образе облачения в доспехи и связывает действие с повелением «стойте».
- source_word: θώρακα
  choice: нагрудник
  rationale: Современное и понятное обозначение защитного доспеха, закрывающего грудь.
- source_word: δικαιοσύνης
  choice: праведности
  rationale: Основной русский эквивалент в богословском контексте Павла; возможное значение «справедливость» сохранено в примечании.
theological_decisions:
- issue: Значение δικαιοσύνη в метафоре Божьих доспехов
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» сохраняет широкий павловский богословский и нравственный диапазон слова, не определяя здесь однозначно, идёт ли речь о дарованном Богом статусе, нравственной жизни или их связи; общественно-этический оттенок «справедливости» отмечен как допустимая альтернатива.
translation_notes:
  register: Современный литературный русский язык с сохранением военной метафоры. Деепричастия передают зависимые аористные причастия естественнее тяжеловесных конструкций с причастиями прошедшего времени. Устаревшие «чресла» и «броня» не использованы; богословская неоднозначность δικαιοσύνη не снята.
