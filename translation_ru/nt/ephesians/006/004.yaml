  text: Καὶ οἱ πατέρες, μὴ παροργίζετε τὰ τέκνα ὑμῶν, ἀλλὰ ἐκτρέφετε αὐτὰ ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/004.yaml
  text: And fathers[a], do not provoke your children to anger[c][b], but bring them up in the discipline and instruction of the Lord.
translation:
  language: ru
  text: И вы, отцы, не вызывайте у своих детей гнева[a], но растите их в воспитании и наставлении Господнем[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не раздражайте своих детей», «не доводите их до гнева». Греческий глагол означает вызывать гнев или негодование.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в воспитании и наставлении Господа». Это может означать воспитание и наставление, исходящие от Господа, принадлежащие Ему, соответствующие Ему или направляемые Им.'
    reason: alternative_reading
lexical_decisions:
- source_word: πατέρες
  choice: отцы
  rationale: Существительное прямо обозначает отцов; перевод не расширяет обращение до «родителей».
- source_word: παροργίζετε
  choice: не вызывайте у своих детей гнева
  rationale: 'Передаёт каузативное значение глагола: доводить до гнева, раздражать и вызывать негодование.'
- source_word: τέκνα
  choice: детей
  rationale: Естественное собирательное обозначение детей в семье, включающее сыновей и дочерей.
- source_word: ἐκτρέφετε
  choice: растите
  rationale: В контексте воспитания детей глагол означает растить, вскармливать и доводить до зрелости.
- source_word: παιδείᾳ
  choice: воспитывая
  rationale: Передаёт формирующее воспитание, обучение и исправление, не сводя значение только к наказанию.
- source_word: νουθεσίᾳ
  choice: наставляя
  rationale: Передаёт словесное нравственное наставление, вразумление и предостережение.
- source_word: κυρίου
  choice: в Господе
  rationale: Русская конструкция естественно связывает всё воспитание и наставление с Господом, сохраняя широкий смысл греческого генитива посредством пояснительной сноски.
theological_decisions:
- issue: Объём обращения πατέρες
  choice: «отцы»
  alternative: «родители»
  rationale: Греческий текст непосредственно обращён к отцам. Более широкое применение возможно, но не должно подменять формулировку источника.
- issue: Смысл κυρίου в ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου
  choice: «в Господе» с пояснительной сноской
  alternative: «от Господа»; «Господнем»; «согласно Господу»
  rationale: Генитив может обозначать источник, принадлежность, характер или направленность воспитания и наставления. Сноска сохраняет эту смысловую широту и не закрепляет единственное толкование.
translation_notes:
  register: Современный литературный русский язык, понятный широкой аудитории. Императивы переданы прямо и достойно; «воспитывая и наставляя» естественно выражает два взаимодополняющих аспекта παιδεία и νουθεσία. Все сноски отмечены в основном тексте.
