  - marker: b
    text: 'Или: «тайну Благой вести».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ ἐμοῦ
  choice: обо мне
  rationale: В продолжающемся призыве к молитве ὑπέρ с родительным означает молитву о Павле, в его пользу; «обо мне» естественно связывается с подразумеваемым «молитесь» из предыдущего стиха.
- source_word: δοθῇ λόγος
  choice: мне было дано слово
  rationale: 'Единственное число λόγος сохранено как «слово»: речь идёт о дарованном Богом содержании высказывания, а не просто о способности говорить. Сноска поясняет возможный естественный смысл.'
- source_word: ἐν ἀνοίξει τοῦ στόματός μου
  choice: когда я открываю уста
  rationale: Сохранён образ открытия уст, но греческий предложный оборот передан естественным русским придаточным времени, обозначающим начало речи.
- source_word: ἐν παρρησίᾳ
  choice: со всей смелостью
  rationale: παρρησία обозначает смелую, открытую и свободную речь. «Со всей смелостью» естественно передаёт здесь обстоятельственный смысл и риторическое ударение.
- source_word: γνωρίσαι
  choice: открыть людям
  rationale: Глагол означает «сделать известным». Дополнение «людям» явно выражает подразумеваемых адресатов, а «открыть» хорошо сочетается с последующей «тайной», не превращая глагол в более узкое «проповедовать».
- source_word: τὸ μυστήριον τοῦ εὐαγγελίου
  choice: тайну Евангелия
  rationale: «Тайна» сохраняет павловское обозначение прежде сокрытого, а ныне открываемого Божьего замысла; «Евангелие» является понятным и богословски ёмким русским соответствием εὐαγγέλιον.
theological_decisions:
- issue: Смысл λόγος в молитвенной просьбе Павла
  choice: «мне было дано слово» с пояснением в сноске
  alternative: «мне было дано, что сказать»; «мне были даны слова»
  rationale: Так сохраняются единственное число и образ дарованной речи, но сноска не позволяет ошибочно принять λόγος за титул Христа или за одно отдельное слово.
- issue: Характер παρρησία
  choice: «со всей смелостью»
  alternative: «открыто»; «с уверенностью»; «дерзновенно»
  rationale: Выбор передаёт мужественную свободу публичной речи, не сводя выражение только к внутренней уверенности и не используя архаичное для многих читателей «дерзновение».
- issue: Значение μυστήριον
  choice: «тайна»
  alternative: «сокрытый замысел»; «секрет»
  rationale: 'Сохранён традиционный и контекстуально точный термин: речь не обязательно о загадке, а о Божьем замысле, который становится известен через Евангелие.'
translation_notes:
  register: Современный литературный русский с достоинством апостольского призыва. Сохранены образ «открываю уста» и термин «тайна Евангелия»; синтаксис слегка перестроен ради ясности, поскольку стих продолжает просьбу о молитве из Еф. 6:18.
