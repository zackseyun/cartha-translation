  text: and for me[a], that words may be given to me in opening my mouth, to make known with boldness the mystery of the gospel[e][d][c][b],
translation:
  language: ru
  text: и обо мне — чтобы, когда я открою уста, мне было дано слово[a], чтобы смело возвестить тайну Евангелия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мне было дано, что сказать»; буквально: «мне было дано слово».'
