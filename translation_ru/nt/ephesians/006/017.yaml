lexical_decisions:
- source_word: δέξασθε
  choice: примите
  rationale: Аористный императив среднего залога во втором лице множественного числа. «Примите» сохраняет оттенок принятия того, что даётся, и естественно звучит в образе Божьих доспехов; возможен также перевод «возьмите».
- source_word: περικεφαλαίαν
  choice: шлем
  rationale: Прямое и естественное соответствие обычному греческому обозначению защитного воинского головного убора.
- source_word: τοῦ σωτηρίου
  choice: спасения
  rationale: Родительная конструкция передана без уточнения её внутреннего смыслового отношения. «Спасение» естественно соответствует контексту Павла, тогда как «избавление» возможно, но здесь менее привычно.
- source_word: μάχαιραν
  choice: меч
  rationale: Общепонятный русский эквивалент названия клинкового оружия. Более узкое «короткий меч» было бы излишней конкретизацией.
- source_word: τοῦ πνεύματος
  choice: Духа
  rationale: В контексте Божьих доспехов наиболее вероятен Святой Дух. Заглавная буква обозначает этот референт, не уточняя, принадлежит ли меч Духу или даётся Им.
- source_word: ὅ ἐστιν
  choice: —
  rationale: Пояснительное «который есть» естественно выражено по-русски тире; при этом сохраняется отождествление меча с последующим выражением.
- source_word: ῥῆμα θεοῦ
  choice: Слово Божье
  rationale: Устойчивый и ясный перевод, сохраняющий богословскую узнаваемость. В сноске отмечен возможный оттенок произнесённого слова или речения у ῥῆμα.
theological_decisions:
- issue: Референт выражения «Духа»
  choice: Святой Дух
  alternative: человеческий дух или духовная природа
  rationale: В образе Божьих доспехов и рядом с «Словом Божьим» наиболее естественна отсылка к Святому Духу. Формулировка не разрешает сверх текста возможную смысловую роль родительного падежа.
- issue: Связь «Слова Божьего» с мечом
  choice: пояснительное отождествление через тире
  alternative: «который есть Слово Божье»
  rationale: Средний род греческого ὅ может грамматически соотноситься с подразумеваемым оружием или с образом в целом, а не прямо с существительным женского рода μάχαιρα. Русское тире сохраняет ясное пояснение, не создавая искусственной грамматической привязки.
translation_notes:
  register: Современный литературный русский язык, краткий и торжественный без архаизации. «Божье» выбрано как естественная современная форма; заглавные буквы в «Духа» и «Слово Божье» отражают традиционное распознавание референта и устойчивое наименование, не добавляя пояснений в основной текст.
