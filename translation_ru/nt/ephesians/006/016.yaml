  text: ⸀ἐν πᾶσιν ἀναλαβόντες τὸν θυρεὸν τῆς πίστεως, ἐν ᾧ δυνήσεσθε πάντα τὰ βέλη τοῦ ⸀πονηροῦ πεπυρωμένα σβέσαι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/016.yaml
  text: In all circumstances[a], taking up the shield of faith[c][b], with which you will be able to extinguish all the flaming arrows of the evil one.
translation:
  language: ru
  text: При любых обстоятельствах берите щит веры, которым вы сможете погасить все зажжённые стрелы[a] лукавого[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «метательные снаряды»; греческое βέλη — общее обозначение метательных снарядов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «зла». Греческое выражение допускает отвлечённое значение, хотя в контексте духовной борьбы вероятнее личное: «лукавого».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πᾶσιν
  choice: при любых обстоятельствах
  rationale: 'Оборот естественно понимается наречно: во всякой ситуации. Такой перевод соответствует контексту перечня доспехов и не вводит менее вероятного значения «прежде всего».'
- source_word: ἀναλαβόντες
  choice: берите
  rationale: Аористное причастие обозначает действие, сопутствующее призыву облечься во всеоружие; русская повелительная форма естественно передаёт его функцию в цепи наставлений.
- source_word: τὸν θυρεὸν τῆς πίστεως
  choice: щит веры
  rationale: θυρεός обозначает щит, в частности большой щит; краткий общеупотребительный эквивалент сохраняет военный образ. πίστις здесь естественнее всего передать словом «вера» как упование на Бога.
- source_word: ἐν ᾧ
  choice: которым
  rationale: Предлог имеет инструментальное значение, а относительное местоимение относится к щиту.
- source_word: δυνήσεσθε
  choice: вы сможете
  rationale: Перевод сохраняет будущее время и значение способности.
- source_word: βέλη
  choice: стрелы
  rationale: βέλη — общее обозначение метательных снарядов; в данном военном образе «стрелы» понятно современному читателю, а более широкое значение отмечено в сноске.
- source_word: τοῦ πονηροῦ
  choice: лукавого
  rationale: Субстантивированное прилагательное с артиклем в контексте духовной борьбы вероятнее обозначает личного противника. Традиционное русское «лукавый» сохраняет личный смысл, не добавляя имени.
- source_word: πεπυρωμένα
  choice: горящие
  rationale: Причастие обозначает снаряды, которые были подожжены; «горящие» ясно и естественно сохраняет образ.
- source_word: σβέσαι
  choice: погасить
  rationale: Глагол означает гасить огонь; выбранный русский эквивалент прямо соотносится с горящими стрелами.
theological_decisions:
- issue: Личное или отвлечённое значение τοῦ πονηροῦ
  choice: лукавого
  alternative: зла
  rationale: Контекст духовной войны и образ направленных нападений поддерживают личное прочтение, однако грамматически возможно и отвлечённое значение; оно сохранено в сноске.
- issue: Значение πίστις
  choice: вера
  alternative: доверие; верность
  rationale: В данном контексте «вера» наиболее естественно обозначает упование верующего на Бога и сохраняет устойчивую богословскую лексику, не исключая оттенка доверия.
translation_notes:
  register: Современный литературный русский язык; образность и торжественность апостольского наставления сохранены без архаической синтаксической тяжеловесности. «Берите» естественно продолжает ряд повелений в контексте.
