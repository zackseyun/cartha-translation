lexical_decisions:
- source_word: ὑπὲρ οὗ
  choice: ради которой
  rationale: Местоимение среднего рода, вероятнее всего, отсылает к «тайне Благой Вести» в ст. 19; «ради которой» естественно передаёт значение ὑπέρ и сохраняет связь с этой вестью.
- source_word: πρεσβεύω
  choice: я исполняю посольство
  rationale: Глагол обозначает служение посланником или послом. Такая формулировка сохраняет официальный представительский оттенок и естественно сочетается с парадоксальным образом узника-посла.
- source_word: ἐν ἁλύσει
  choice: в цепях
  rationale: В греческом употреблено единственное число («в цепи»), однако по-русски образ заключения естественно передаётся устойчивым выражением «в цепях».
- source_word: ἵνα
  choice: чтобы
  rationale: Союз вводит цель молитвенной просьбы; «чтобы» ясно и естественно выражает эту связь.
- source_word: ἐν αὐτῷ
  choice: возвещать её
  rationale: Местоимение среднего рода отсылает к Благой Вести или её тайне. С учётом семантики παρρησιάζομαι оборот естественно передан как смелое возвещение этой вести, без искусственного русского «в ней».
- source_word: παρρησιάσωμαι
  choice: возвещать её смело
  rationale: Глагол выражает открытую, свободную и мужественную речь. «Возвещать смело» сохраняет речевой и миссионерский смысл в данном контексте.
- source_word: ὡς δεῖ με λαλῆσαι
  choice: как мне и должно говорить
  rationale: δεῖ выражает необходимость или обязанность; перевод сохраняет нормативный оттенок и явное упоминание речи в λαλῆσαι.
theological_decisions:
- issue: Референт οὗ и αὐτῷ
  choice: Оба местоимения поняты как отсылки к Благой Вести или «тайне Благой Вести» из ст. 19.
  alternative: Относительное местоимение можно шире связать с делом возвещения; αὐτῷ иногда понимают лично — «в Нём», однако грамматический средний род этого не поддерживает.
  rationale: Формы οὗ и αὐτῷ здесь морфологически допускают средний род, а ближайший контекст даёт нейтральный антецедент — «тайна Благой Вести». Перевод не вводит личный христологический референт, не обозначенный грамматикой.
- issue: Характер посольства Павла
  choice: Сохранён образ официального посланника, находящегося в заключении.
  alternative: Обобщённое «я представляю её» или «я служу её вестником».
  rationale: πρεσβεύω содержит более конкретный образ посольского служения; его сохранение передаёт намеренный парадокс — посол в цепях.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской речи. «Исполняю посольство» сохраняет образ πρεσβεύω, а «возвещать её смело» естественно раскрывает трудный греческий оборот ἐν αὐτῷ παρρησιάσωμαι. Все сноски отмечены в основном тексте.
