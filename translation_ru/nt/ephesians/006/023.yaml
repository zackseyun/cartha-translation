  text: Peace to the brothers[a], and love with faith[c][b], from God the Father and the Lord Jesus the Messiah.
translation:
  language: ru
  text: Мир братьям[a] и любовь с верой[b] от Бога Отца и Господа Иисуса Мессии[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братьям и сёстрам». В греческом тексте стоит слово «братья» в форме мужского рода, но оно может обозначать всю общину верующих.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «с верностью» или «с доверием». Греческое слово может иметь эти значения, хотя здесь основным переводом остаётся «вера».'
    reason: lexical_alternative
  - marker: c
    text: 'По-гречески: «Иисуса Христа». Здесь титул Χριστός переведён словом «Мессия», чтобы сохранить его значение.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰρήνη
  choice: Мир
  rationale: Сохраняет краткую форму благословения без добавления отсутствующего в греческом тексте глагола «да будет».
- source_word: τοῖς ἀδελφοῖς
  choice: братьям
  rationale: Передаёт грамматически мужскую форму множественного числа; возможное обращение ко всей общине отмечено в сноске.
- source_word: ἀγάπη
  choice: любовь
  rationale: Прямое и устойчивое соответствие слову ἀγάπη, сохраняющее связь с употреблением этого слова у Павла.
- source_word: μετὰ πίστεως
  choice: с верой
  rationale: Предлог μετά с родительным падежом обозначает сопутствие, а «вера» является основным соответствием πίστις; другие возможные оттенки приведены в сноске.
- source_word: ἀπὸ
  choice: от
  rationale: Передаёт источник мира и любви с верой.
- source_word: θεοῦ πατρὸς
  choice: Бога Отца
  rationale: Точно отражает греческое выражение без добавления отсутствующего местоимения «нашего».
- source_word: κυρίου
  choice: Господа
  rationale: Устойчиво передаёт κύριος как титул Иисуса в новозаветном контексте.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса, Мессии
  rationale: Имя передано как «Иисус», а Χριστός — как значимый титул «Мессия»; запятая делает приложение естественнее и яснее по-русски.
theological_decisions:
- issue: Передача Χριστοῦ в заключительном благословении
  choice: Мессии
  alternative: Христа
  rationale: Χριστός сохраняет значение титула, поэтому переведено как «Мессия», а традиционная передача «Христос» указана в сноске.
- issue: Род обращения ἀδελφοῖς
  choice: братьям
  alternative: братьям и сёстрам
  rationale: Основной текст сохраняет мужскую форму греческого слова, не отрицая вероятного обращения ко всей верующей общине.
- issue: Значение πίστις
  choice: вера
  alternative: верность; доверие
  rationale: «Вера» — основное значение в данном благословении, однако греческое слово допускает оттенки верности и доверия, которые нельзя полностью исключить.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой благословения. Синтаксическая эллиптичность оригинала сохранена; добавочные глаголы не вводятся. Приложение «Мессии» обособлено для естественности русского титульного выражения.
