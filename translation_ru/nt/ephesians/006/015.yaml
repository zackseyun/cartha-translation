lexical_decisions:
- source_word: ὑποδησάμενοι
  choice: обув
  rationale: Аористное причастие среднего залога буквально обозначает надевание обуви. «Обув» естественно по-русски сохраняет и причастную конструкцию, и образ воинского снаряжения.
- source_word: τοὺς πόδας
  choice: ноги
  rationale: В греческом прямо названы ноги, а не обувь; буквальный образ сохранён.
- source_word: ἐν
  choice: в
  rationale: Предлог вводит то, чем снаряжены ноги. Русская конструкция «обув ноги в…» естественно передаёт значение оснащения и сохраняет образ надетого снаряжения.
- source_word: ἑτοιμασίᾳ
  choice: готовность
  rationale: Существительное может означать готовность или подготовленность, а возможно, также надёжную опору. Основной вариант не уточняет, идёт ли речь о готовности возвещать или о твёрдости, которую даёт Евангелие.
- source_word: εὐαγγελίου
  choice: Евангелие
  rationale: Традиционный и понятный в современном русском языке эквивалент павловского термина, сохраняющий его богословскую насыщенность.
- source_word: τῆς εἰρήνης
  choice: мира
  rationale: 'Родительный падеж сохраняет связь с «Евангелием»: это Евангелие, несущее или возвещающее мир.'
theological_decisions:
- issue: Смысл выражения ἐν ἑτοιμασίᾳ τοῦ εὐαγγελίου τῆς εἰρήνης
  choice: готовность, которую даёт Евангелие мира
  alternative: готовность возвещать Евангелие мира; твёрдая опора, которую даёт Евангелие мира
  rationale: Греческая цепочка родительных падежей сжата и допускает разные связи. В основном тексте естественная русская формулировка указывает на Евангелие как источник готовности, но не добавляет прямо отсутствующий в оригинале глагол «возвещать»; прочие вероятные толкования отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением метафоры обувания как части воинского снаряжения. Союз «и» оставлен для связи со структурой окружающего предложения; формулировка рассчитана на включение в более широкий синтаксический контекст.
