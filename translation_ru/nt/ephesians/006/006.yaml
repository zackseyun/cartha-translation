  text: not by eye-service[a], as people-pleasers, but as servants of Messiah[c][b], doing the will of God from the soul.
translation:
  language: ru
  text: не напоказ[a], как угождающие людям, но как рабы Мессии[b], исполняя волю Бога от всей души[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «служение для глаза»; то есть работа ради видимости, лишь когда за ней наблюдают.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Христа». Греческое Христос означает «Помазанник», то есть «Мессия».'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «из души»; возможно также: «искренне» или «всей душой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοδουλίαν
  choice: напоказ
  rationale: Редкое сложное слово обозначает службу лишь под чужим взглядом, ради видимости. «Напоказ» естественно и кратко передаёт отрицательный смысл; буквальный образ отмечен в сноске.
- source_word: ἀνθρωπάρεσκοι
  choice: угождающие людям
  rationale: Передаёт стремление заслужить человеческое одобрение без тяжеловесного существительного и звучит естественно в современном русском.
- source_word: δοῦλοι
  choice: рабы
  rationale: В непосредственном контексте речь идёт о рабах, а оборот также подчёркивает их принадлежность Мессии; «слуги» ослабило бы эту связь.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Χριστός сохраняет значение титула Помазанника; форма родительного падежа естественно зависит от слова «рабы».
- source_word: ποιοῦντες τὸ θέλημα τοῦ θεοῦ
  choice: исполняя волю Бога
  rationale: «Исполняя» идиоматично сочетается с «волей» и точно выражает осуществление того, чего хочет Бог.
- source_word: ἐκ ψυχῆς
  choice: от всей души
  rationale: Русский устойчивый оборот сохраняет слово «душа» и выражает внутреннюю искренность и полноту усердия.
theological_decisions:
- issue: Передача δοῦλοι в наставлении рабам
  choice: рабы Мессии
  alternative: слуги Мессии
  rationale: Рабский статус явно присутствует в ближайшем контексте и переосмысляется как принадлежность Мессии, поэтому более сильное «рабы» сохраняет риторическое напряжение текста.
- issue: Передача Χριστοῦ как титула
  choice: Мессии
  alternative: Христа
  rationale: Перевод титула раскрывает значение греческого Χριστός как Помазанника; традиционная форма дана в сноске, чтобы не скрывать возможный вариант передачи.
- issue: Смысл ἐκ ψυχῆς
  choice: от всей души
  alternative: искренне; всем сердцем
  rationale: Выбранный оборот одновременно естественен по-русски и сохраняет ψυχή («душа»), не подменяя его словом «сердце».
translation_notes:
  register: Современный литературный русский, ясный и достойный. «Не напоказ» избегает искусственной кальки, а «от всей души» сохраняет образ исходного текста в естественном русском обороте.
