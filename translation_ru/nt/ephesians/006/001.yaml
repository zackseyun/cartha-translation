id: EPH.6.1
reference: Ephesians 6:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν ὑμῶν ἐν κυρίῳ, τοῦτο γάρ ἐστιν δίκαιον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/001.yaml
  text: Children[a], obey your parents in the Lord, for this is right.
translation:
  language: ru
  text: Дети, повинуйтесь своим родителям в Господе[a], потому что так правильно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как принадлежащие Господу»; «в единении с Господом». Выражение «в Господе» может описывать сферу или характер послушания, а также подразумевать, что оно ограничено верностью Господу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  choice: Дети
  rationale: Форма обращения во множественном числе прямо адресована детям как членам семьи. «Дети» — естественный и точный русский эквивалент без ненужного уточнения пола или возраста.
- source_word: ὑπακούετε
  choice: повинуйтесь
  rationale: Настоящее повелительное наклонение выражает требование постоянного деятельного послушания, а не просто слушания. «Повинуйтесь» ясно передаёт силу повеления и сохраняет достойный библейский регистр.
- source_word: γονεῦσιν
  choice: родителям
  rationale: Существительное во множественном числе собирательно обозначает отца и мать; «родителям» — точный и идиоматичный перевод.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Сохранена краткая формула Павла. Она может указывать на сферу, основание или характер послушания и не устраняет возможного смысла, что верность Господу задаёт его пределы.
- source_word: δίκαιον
  choice: правильно
  rationale: В данном нравственном контексте слово обозначает то, что справедливо, должным образом и соответствует правильному порядку. Оборот «так правильно» естественен в современном русском и понятнее, чем более отвлечённое «это праведно».
theological_decisions:
- issue: Смысл и синтаксическая связь выражения ἐν κυρίῳ
  choice: 'Выражение присоединено к повелению: «повинуйтесь своим родителям в Господе», при этом его смысловая открытость сохранена.'
  alternative: «Дети, принадлежащие Господу, повинуйтесь родителям»; «повинуйтесь родителям так, как подобает в Господе»; явное указание, что послушание ограничено верностью Господу.
  rationale: 'По-гречески ἐν κυρίῳ естественнее всего связано с повелением, однако точный оттенок не определён однозначно: речь может идти о положении детей в Господе, о сфере или характере послушания либо о его неявной границе. Буквальная формула не разрешает эту богословскую напряжённость за автора.'
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и доступным синтаксисом. Сохранена характерная для Павла формула «в Господе»; «так правильно» передаёт нравственную уместность δίκαιον без излишне церковного оттенка.
