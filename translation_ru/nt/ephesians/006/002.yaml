    reason: lexical_alternative
lexical_decisions:
- source_word: τίμα
  choice: Почитай
  rationale: Повелительная форма требует деятельно оказывать честь, а не только испытывать внутреннее уважение; «почитай» также сохраняет узнаваемую связь с Десятью заповедями.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: отца твоего и мать
  rationale: Прямые обозначения родителей. Форма «отца твоего» сохраняет библейскую цитатную окраску, но вторая часть не перегружается повтором местоимения, которого нет в греческом тексте.
- source_word: ἥτις ἐστὶν
  choice: это
  rationale: Местоимение отсылает к только что приведённой заповеди; русское «это» естественно вводит пояснение Павла.
- source_word: ἐντολὴ πρώτη
  choice: первая заповедь
  rationale: πρώτη имеет порядковое значение «первая», а «заповедь» сохраняет связь с Десятисловием.
- source_word: ἐν ἐπαγγελίᾳ
  choice: данная с обещанием
  rationale: Буквально оборот означает «в обещании», но по контексту указывает на заповедь, сопровождаемую обещанием; выбранная формулировка ясно передаёт эту связь, не включая содержание следующего стиха.
theological_decisions:
- issue: Смысл выражения «первая заповедь» и его связь с обещанием
  choice: «первая заповедь, данная с обещанием»
  alternative: «первая заповедь в обещании»; «первая заповедь во второй скрижали»; «главнейшая заповедь с обещанием»
  rationale: Перевод сохраняет порядковое значение πρώτη и передаёт наиболее вероятный смысл ἐν ἐπαγγελίᾳ — заповедь сопровождается обещанием. Он не привязывает слова Павла к конфессиональной нумерации Десятисловия и не превращает «первую» в «главнейшую».
translation_notes:
  register: Современный литературный русский с умеренно возвышенной цитатной формой «Почитай отца твоего». Тире обозначает пояснительный характер второй части; двоеточие подготавливает продолжение обещания в следующем стихе.
