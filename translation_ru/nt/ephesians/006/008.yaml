base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/008.yaml
  text: knowing that each one[a], whatever good he does, this he will receive back from the Lord[b], whether servant or free.
translation:
  language: ru
  text: зная, что каждый, какое бы добро он ни сделал, получит за это от Господа[a], будь он рабом или свободным[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «получит это обратно от Господа»; глагол может означать получение обратно того, что соответствует совершенному поступку.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «будь то раб, будь то свободный».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: зная
  rationale: Деепричастие сохраняет связь с предшествующим наставлением и не делает причинный оттенок более явным, чем в греческом тексте.
- source_word: ἕκαστος
  choice: каждый
  rationale: 'Передаёт распределительное значение единственного числа: воздаяние касается каждого человека в отдельности.'
- source_word: ὃ ἂν ποιήσῃ ἀγαθόν
  choice: какое бы добро он ни сделал
  rationale: Конструкция «какое бы… ни» естественно передаёт неопределённость относительного оборота с ἄν, а «добро» сохраняет нравственную характеристику поступка.
- source_word: τοῦτο κομίσεται
  choice: получит за него
  rationale: Формулировка указывает на соответствие между сделанным добром и получаемым от Господа, избегая неестественного буквального «получит это обратно» и чрезмерно коммерческого «получит плату».
- source_word: παρὰ κυρίου
  choice: от Господа
  rationale: παρά с родительным падежом обозначает источник, а «Господь» сохраняет обычное для Павла богословское звучание титула κύριος.
- source_word: δοῦλος
  choice: раб
  rationale: В непосредственном контексте противопоставлены несвободный и свободный социальные статусы, поэтому «раб» точнее, чем смягчающее «слуга».
- source_word: ἐλεύθερος
  choice: свободный
  rationale: Кратко и естественно передаёт социальный статус, противоположный положению раба.
theological_decisions:
- issue: Передача δοῦλος в наставлениях рабам и господам
  choice: раб
  alternative: слуга
  rationale: Противопоставление ἐλεύθερος делает именно правовой и социальный статус центральным; перевод «раб» не затушёвывает историческую действительность текста.
- issue: Значение κύριος в ближайшем контексте отношений рабов и господ
  choice: Господь
  alternative: господин
  rationale: Воздаяние исходит не от земного хозяина, а от божественного Господа; такое чтение сохраняет вероятную христологическую отсылку и не сводит титул к бытовому обращению.
- issue: Характер будущего воздаяния в τοῦτο κομίσεται
  choice: получит за него от Господа
  alternative: получит это обратно от Господа
  rationale: Греческий глагол допускает смысл получения обратно или соответствующего воздаяния. Основной текст передаёт взаимосвязь поступка и воздаяния, но не уточняет его природу и не превращает её в строго коммерческий расчёт.
translation_notes:
  register: Современный литературный русский язык с умеренно формальной, пригодной для публичного чтения синтаксической структурой. Оборот «будь он рабом или свободным» естественно передаёт парное εἴτε… εἴτε; исторически значимое «раб» сохранено без смягчения.
