id: EPH.6.12
reference: Ephesians 6:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔστιν ἡμῖν ἡ πάλη πρὸς αἷμα καὶ σάρκα, ἀλλὰ πρὸς τὰς ἀρχάς, πρὸς τὰς ἐξουσίας, πρὸς τοὺς κοσμοκράτορας τοῦ ⸀σκότους τούτου, πρὸς τὰ πνευματικὰ τῆς πονηρίας ἐν τοῖς ἐπουρανίοις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/012.yaml
  text: For our struggle is not against flesh and blood[a], but against the rulers, against the authorities, against the world-rulers of this darkness[c][b], against the spiritual forces of evil in the heavenly realms.
translation:
  language: ru
  text: Потому что наша борьба[a] — не против плоти и крови, а против начальств, против властей, против мироправителей этой тьмы[b], против духовных сил зла в небесных сферах[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наша схватка»; слово может обозначать борцовский поединок.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мироправителей нынешней тьмы».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в небесных местах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλη
  choice: борьба
  rationale: Слово обозначает борьбу, в частности схватку или борцовский поединок. «Борьба» естественно звучит по-русски и сохраняет образ непосредственного противостояния; более буквальный оттенок отмечен в сноске.
- source_word: πρὸς αἷμα καὶ σάρκα
  choice: против плоти и крови
  rationale: Греческое выражение буквально имеет порядок «крови и плоти» и обозначает людей как телесных существ. Устойчивый русский оборот «плоть и кровь» передаёт смысл без сведения σάρξ к понятию греховной природы.
- source_word: ἀρχάς
  choice: начальств
  rationale: В данном перечислении слово обозначает стоящие у власти сверхчеловеческие силы. «Начальства» сохраняет различие со следующими «властями» и не уточняет их природу сверх того, что позволяет контекст.
- source_word: ἐξουσίας
  choice: властей
  rationale: Передаёт значение властных сил или носителей власти и естественно сочетается с «начальствами».
- source_word: κοσμοκράτορας
  choice: мироправителей
  rationale: Редкое сложное слово буквально указывает на правителей мира. «Мироправители» сохраняет состав и силу греческого термина, не заменяя его более широким толкованием «космические силы».
- source_word: τοῦ σκότους τούτου
  choice: этой тьмы
  rationale: Близко передаёт родительный оборот и указательное местоимение, связывая мироправителей с «этой тьмой». Временной оттенок «нынешней» возможен по смыслу, но прямо не выражен отдельным словом.
- source_word: τὰ πνευματικὰ τῆς πονηρίας
  choice: духовных сил зла
  rationale: Субстантивированное прилагательное среднего рода во множественном числе в контексте обозначает духовные существа или силы. Добавление «сил» делает русский текст понятным, не конкретизируя их как «воинства».
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: в небесных сферах
  rationale: Оборот обозначает небесную область и неоднократно встречается в Послании к эфесянам. «В небесных сферах» естественно для современного русского языка и сохраняет пространственную широту выражения.
theological_decisions:
- issue: Природа названных противников
  choice: Перечисление передано как указание на сверхчеловеческие духовные силы.
  alternative: Термины могут пониматься прежде всего как человеческие правители и учреждения либо как духовные силы вместе с их земными проявлениями.
  rationale: Сочетание κοσμοκράτορας и τὰ πνευματικὰ τῆς πονηρίας прямо направляет смысл к духовным противникам. При этом перевод не исключает их воздействия через земные структуры.
- issue: Значение σάρξ в выражении «плоть и кровь»
  choice: Слово сохранено как «плоть» внутри устойчивого обозначения смертных людей.
  alternative: «Греховная природа».
  rationale: Здесь σάρξ не обозначает нравственно испорченную природу, а входит в идиому о человеческом, телесном существовании.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Повтор «против» сохранён ради риторического напора оригинала. Термины «начальства», «власти» и «мироправители» оставлены различными, чтобы не сглаживать структуру греческого перечисления.
