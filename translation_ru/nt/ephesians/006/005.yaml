  text: Οἱ δοῦλοι, ὑπακούετε τοῖς ⸂κατὰ σάρκα κυρίοις⸃ μετὰ φόβου καὶ τρόμου ἐν ἁπλότητι τῆς καρδίας ὑμῶν ὡς τῷ Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/005.yaml
  text: Servants[a], obey your masters according to the flesh with fear and trembling, in sincerity of your heart, as to Messiah[b],
translation:
  language: ru
  text: Рабы, повинуйтесь своим господам по плоти[a] со страхом и трепетом, в искренности вашего сердца, как Мессии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть господам лишь в земном, человеческом отношении.
    reason: lexical_alternative
  - marker: b
    text: Греч. «Христу»; здесь слово передано как «Мессии», поскольку употреблено как титул.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλοι
  choice: рабы
  rationale: В данном распорядке домашней жизни речь идёт о людях, находившихся в рабской зависимости; «слуги» неоправданно смягчило бы социальную реальность текста.
- source_word: ὑπακούετε
  choice: повинуйтесь
  rationale: Настоящее повелительное наклонение выражает требование постоянного послушания; «повинуйтесь» естественно и точно передаёт смысл в данном отношении власти.
- source_word: κατὰ σάρκα
  choice: по плоти
  rationale: Сохранён образный оборот оригинала, обозначающий ограниченное земной, человеческой сферой господство; пояснение дано в сноске.
- source_word: κυρίοις
  choice: господам
  rationale: В контексте это владельцы рабов и главы хозяйств; «господам» сохраняет социальную и лексическую связь с κύριος, а контекст отличает их от Мессии.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: со страхом и трепетом
  rationale: Устойчивое парное выражение Павла сохранено ради его риторической силы и межтекстовой узнаваемости.
- source_word: ἐν ἁπλότητι τῆς καρδίας ὑμῶν
  choice: в искренности вашего сердца
  rationale: ἁπλότης здесь означает искренность и нераздвоенность внутреннего расположения; формулировка естественна для современного литературного русского языка.
- source_word: ὡς τῷ Χριστῷ
  choice: как Мессии
  rationale: ὡς сохраняет сравнительный смысл, не отождествляя земных господ с Мессией; Χριστός передан как титул по его значению.
theological_decisions:
- issue: Передача Χριστῷ
  choice: Мессии
  alternative: Христу
  rationale: В данном месте Χριστός функционирует как титул; перевод «Мессии» раскрывает его значение, тогда как «Христу» является традиционной передачей греческой формы.
- issue: Передача δοῦλοι в контексте рабства
  choice: рабы
  alternative: слуги
  rationale: Текст обращён к людям, юридически и социально подчинённым господам; перевод не должен скрывать или смягчать эту историческую реальность.
- issue: Смысл κατὰ σάρκα
  choice: по плоти
  alternative: земным
  rationale: Буквальный оборот сохраняет противопоставление человеческого, временного господства отношению к Мессии, не истолковывая «плоть» как греховную природу.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достойным библейского текста звучанием. Сохранены традиционные выражения «по плоти» и «со страхом и трепетом»; потенциально неясный первый оборот пояснён в сноске.
