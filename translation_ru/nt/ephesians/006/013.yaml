language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἀναλάβετε τὴν πανοπλίαν τοῦ θεοῦ, ἵνα δυνηθῆτε ἀντιστῆναι ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ καὶ ἅπαντα κατεργασάμενοι στῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/013.yaml
  text: Therefore take up the full armor of God[a], so that you may be able to withstand in the evil day, and having done everything[d][c][b], to stand firm.
translation:
  language: ru
  text: Поэтому возьмите полное Божье вооружение[a], чтобы вы могли противостоять[b] в злой день[c] и, всё совершив[d], устоять.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё Божье вооружение». Греческое слово обозначает полное снаряжение воина.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сопротивляться», «выстоять против».'
    reason: lexical_alternative
  - marker: c
    text: Выражение «злой день» может обозначать время особенно сильного зла или испытания и не обязательно относится только к определённому событию последнего времени.
    reason: alternative_reading
  - marker: d
    text: 'Или: «всё исполнив», «всё сделав».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Кратко и естественно передаёт вывод из предыдущего наставления.
- source_word: ἀναλάβετε
  choice: возьмите
  rationale: Аористный императив ἀναλαμβάνω означает взять, поднять или принять для употребления; «возьмите» сохраняет образ готовящегося к бою воина и не подменяет глагол выражением «облекитесь».
- source_word: τὴν πανοπλίαν τοῦ θεοῦ
  choice: все Божьи доспехи
  rationale: πανοπλία обозначает полное снаряжение воина. Естественное русское выражение во множественном числе передаёт совокупность доспехов, а «Божьи» не уточняет без достаточных оснований, принадлежат ли они Богу или даны Им.
- source_word: ἵνα δυνηθῆτε
  choice: чтобы вы могли
  rationale: Передаёт и цель, и выраженную глаголом возможность, не добавляя отсутствующей в тексте причины этой способности.
- source_word: ἀντιστῆναι
  choice: противостоять
  rationale: В военном контексте означает сопротивляться нападению, выступать против и удерживать позицию.
- source_word: ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ
  choice: в злой день
  rationale: Близкая к форме оригинала передача сохраняет ёмкость и открытость выражения, не ограничивая его ни личным испытанием, ни последним временем.
- source_word: ἅπαντα κατεργασάμενοι
  choice: всё исполнив
  rationale: Сохраняет широкий смысл совершения или доведения всего до конца и не вводит более узкую идею победы, которой причастие само по себе не требует.
- source_word: στῆναι
  choice: устоять
  rationale: Естественно передаёт военный образ сохранения позиции после противостояния; в русском языке заключительное «стоять» звучало бы слабее и менее ясно.
theological_decisions:
- issue: Значение выражения «злой день»
  choice: Оставлено общим обозначением времени особенно сильного зла, испытания или духовного противоборства.
  alternative: Конкретный эсхатологический день либо отдельный день личного испытания.
  rationale: Греческое выражение допускает эти оттенки, но не требует выбрать только один из них.
- issue: Значение родительного падежа в «доспехи Бога»
  choice: Передано как «Божьи доспехи» без пояснения отношения.
  alternative: Доспехи, принадлежащие Богу, либо доспехи, которые Бог даёт верующим.
  rationale: Родительный τοῦ θεοῦ допускает несколько связанных смыслов; перевод не должен устранять эту неоднозначность.
- issue: Смысл ἅπαντα κατεργασάμενοι
  choice: «всё исполнив» — завершив всё требуемое, без явного утверждения о победе.
  alternative: «всё преодолев» или «одержав полную победу».
  rationale: Победное прочтение возможно в контексте, но лексически оно слишком сужает более широкое κατεργάζομαι.
translation_notes:
  register: 'Современный литературный русский язык с торжественным, но понятным военным образом. Синтаксис сохраняет движение оригинала: призыв взять доспехи, цель — противостоять, итог — устоять. Формулировки избегают конфессионально окрашенных уточнений.'
