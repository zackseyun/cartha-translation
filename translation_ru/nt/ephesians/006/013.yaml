  source_fidelity: 'Основной смысл передан точно: вывод, повеление принять πλήную воинскую экипировку Бога, цель противостоять в «злой день» и итоговое устояние сохранены. Однако «все Божьи доспехи» по-русски может означать просто все доспехи, которыми располагает Бог, и несколько слабее выражает единую полноту τὴν πανοπλίαν. «Полное Божье вооружение» точнее передаёт συλλективное, исчерпывающее снаряжение, не уточняя отношения родительного τοῦ θεοῦ.'
