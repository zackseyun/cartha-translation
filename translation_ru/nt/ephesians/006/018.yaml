  text: with every prayer and petition, praying at all times in the Spirit, and for this very thing staying alert with all perseverance in petition for all the saints,
translation:
  language: ru
  text: Всякой молитвой и прошением молитесь во всякое время в Духе[a]. Для этого бодрствуйте, с полной настойчивостью вознося прошения[c] обо всех святых[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «духом». Греческое выражение допускает более общее понимание, однако в этом контексте, вероятнее всего, речь идёт о Святом Духе.'
    reason: alternative_reading
  - marker: b
    text: «Святые» здесь — весь святой Божий народ, то есть все верующие.
    reason: lexical_alternative
  - marker: c
    text: 'Буквальнее: «со всяким постоянством и прошением».'
    reason: literal_rendering
lexical_decisions:
- source_word: διὰ πάσης προσευχῆς καὶ δεήσεως
  choice: всякой молитвой и прошением
  rationale: διά с родительным падежом выражает средство; русский творительный передаёт его естественно. «Молитва» служит общим обозначением, а «прошение» сохраняет оттенок конкретной просьбы.
- source_word: προσευχόμενοι
  choice: молитесь
  rationale: Греческое причастие продолжает предшествующее побуждение. Личная форма повелительного наклонения делает эту связь ясной и естественной по-русски, не меняя побудительной силы контекста.
- source_word: ἐν παντὶ καιρῷ
  choice: во всякое время
  rationale: 'Фраза передаёт всеохватность: молиться следует во всякое время и при всяком случае.'
- source_word: ἐν πνεύματι
  choice: в Духе
  rationale: В непосредственном и более широком контексте Послания наиболее вероятна ссылка на Святого Духа. Отсутствие артикля допускает и более общее понимание, поэтому оно отмечено в сноске.
- source_word: εἰς αὐτὸ
  choice: ради этого
  rationale: Оборот указывает на цель или предмет направленного внимания. «Ради этого» естественно передаёт смысл, не уточняя сверх текста, относится ли указание преимущественно к молитве или ко всему предшествующему наставлению.
- source_word: ἀγρυπνοῦντες
  choice: бодрствуйте
  rationale: Глагол означает сохранять бдительность, не терять настороженности; «бодрствуйте» сохраняет образ духовного бодрствования и возвышенный, но понятный регистр.
- source_word: ἐν πάσῃ προσκαρτερήσει
  choice: со всяким постоянством
  rationale: προσκαρτέρησις обозначает настойчивую, стойкую продолжительность действия. «Постоянство» здесь понятно как неослабная верность молитве.
- source_word: καὶ δεήσει
  choice: вознося прошения
  rationale: Греческое καί прямо соединяет постоянство и прошение, но буквальное русское «с постоянством и прошением» звучит неясно. Развёрнутая конструкция сохраняет оба понятия и естественно связывает прошения с бодрствованием.
- source_word: περὶ πάντων τῶν ἁγίων
  choice: обо всех святых
  rationale: «Святые» сохраняет устойчивое павловское обозначение всего освящённого Божьего народа; речь идёт обо всех верующих, а не об ограниченной позднейшей категории.
theological_decisions:
- issue: К кому или чему относится πνεύματι
  choice: 'Святой Дух: «в Духе»'
  alternative: 'человеческий дух или духовный образ молитвы: «духом»'
  rationale: Контекст Ефесянам 6:17 и употребление сходных выражений у Павла делают ссылку на Святого Духа наиболее вероятной. Подлинная грамматическая неоднозначность сохранена в сноске.
- issue: Значение οἱ ἅγιοι
  choice: все верующие как Божий святой народ
  alternative: особая группа канонизированных святых в позднейшем церковном смысле
  rationale: В павловских посланиях это обычное обозначение всех принадлежащих Богу верующих. Перевод сохраняет традиционный термин, а сноска предотвращает анахроническое сужение смысла.
- issue: Связь προσκαρτέρησις и δέησις
  choice: постоянство проявляется при вознесении прошений
  alternative: 'два непосредственно однородных обстоятельства: «со всяким постоянством и прошением»'
  rationale: Греческое καί допускает прямое сочинение, однако вся фраза описывает бдительность в настойчивой молитве. Развёрнутый русский оборот избегает синтаксической неловкости, не устраняя альтернативного разбора, указанного в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены ключевые повторы «молитва/молитесь» и «прошение/прошения», а также традиционные, понятные слова «Дух», «бодрствуйте» и «святые». Причастные конструкции переданы личными формами ради ясности русского побуждения.
