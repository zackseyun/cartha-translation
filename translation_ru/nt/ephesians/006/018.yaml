- from: Всякой молитвой и прошением молитесь во всякое время в Духе[a]. Ради этого бодрствуйте со всяким постоянством, вознося прошения[c] обо всех святых[b].
  to: Всякой молитвой и прошением молитесь во всякое время в Духе[a]. Для этого бодрствуйте, с полной настойчивостью вознося прошения[c] обо всех святых[b].
  rationale: Правка ограничена двумя стилистико-синтаксическими уточнениями. «Для этого» более естественно передаёт целевую направленность εἰς αὐτό. «С полной настойчивостью вознося прошения» сохраняет два греческих понятия — προσκαρτέρησις и δέησις — и делает их связь понятной в современном литературном русском. Смысл, регистр, терминология и сноски сохранены.
