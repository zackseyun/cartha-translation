base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/010.yaml
  text: For we are his workmanship[a], created in Messiah Jesus for good works[b], which God prepared beforehand so that we might walk in them.
translation:
  language: ru
  text: Ибо мы — Его творение, созданные в Мессии Иисусе[a] для добрых дел, которые Бог заранее приготовил, чтобы мы жили, совершая их[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во Христе Иисусе». Греческое Χριστός — титул «Мессия», то есть «Помазанник».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «чтобы мы ходили в них». «Ходить» здесь означает вести определённый образ жизни; то есть жить, совершая эти добрые дела.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοῦ γάρ ἐσμεν ποίημα
  choice: Ведь мы — Его творение
  rationale: «Ведь» передаёт пояснительную связь γάρ с предыдущим контекстом. «Его творение» естественно выражает ποίημα как то, что создано Богом, не сужая образ до ремесленного изделия.
- source_word: κτισθέντες
  choice: сотворённые
  rationale: 'Причастие сохраняет пассивное значение: верующие являются теми, кого сотворил Бог. «Сотворённые» также поддерживает связь с существительным «творение».'
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  rationale: Χριστός здесь передано как значимый титул «Мессия», а не просто как имя; предложный падеж естественно выражает ἐν.
- source_word: ἐπὶ ἔργοις ἀγαθοῖς
  choice: для добрых дел
  rationale: Предлог ἐπί с дательным здесь указывает на предназначение или цель. «Для добрых дел» ясно и естественно передаёт эту связь.
- source_word: οἷς προητοίμασεν ὁ θεός
  choice: которые Бог заранее приготовил
  rationale: Относительное местоимение отнесено к «добрым делам», а «заранее» сохраняет временной оттенок приставки προ-.
- source_word: ἵνα ἐν αὐτοῖς περιπατήσωμεν
  choice: чтобы мы ими жили
  rationale: Фраза передаёт целевое значение ἵνα и метафорическое употребление περιπατέω как образа жизни. Русское «ими жили» естественнее буквального «ходили в них», сохраняя добрые дела как содержание и уклад жизни.
theological_decisions:
- issue: Передача Χριστός как титула или имени
  choice: Мессия Иисус
  alternative: Христос Иисус
  rationale: Перевод «Мессия» раскрывает значение греческого титула и сохраняет мысль о единении с Помазанником, не превращая титул исключительно в имя.
- issue: Соотношение Божьего приготовления и человеческой жизни
  choice: Бог заранее приготовил, чтобы мы ими жили
  alternative: Бог заранее приготовил их нам для исполнения
  rationale: Формулировка сохраняет одновременно Божью инициативу и предназначение верующих жить добрыми делами, не выводя из стиха более широких положений о предопределении или механизме человеческого действия.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Формулировка краткая и доступная; тире подчёркивает именную конструкцию. Необычность выражения «Мессия Иисус» обусловлена сохранением титульного значения Χριστός и пояснена сноской.
