lexical_decisions:
- source_word: ἐποικοδομηθέντες
  choice: будучи возведены
  rationale: Аористное страдательное причастие описывает адресатов как уже включённых в Божье строение. Оборот сохраняет страдательный залог и связь с окружающим предложением.
- source_word: ἐπὶ τῷ θεμελίῳ
  choice: на основании
  rationale: Предлог ἐπί с дательным здесь выражает опору в архитектурном образе; это естественное русское соответствие.
- source_word: τῶν ἀποστόλων καὶ προφητῶν
  choice: апостолов и пророков
  rationale: Родительный падеж сохранён без уточнения, идёт ли речь об основании, состоящем из них, положенном ими или связанном с их свидетельством.
- source_word: ὄντος
  choice: причём … является
  rationale: Так естественно передаётся греческий самостоятельный родительный оборот и обозначается отношение Мессии Иисуса к образу здания без причинного или временного уточнения.
- source_word: ἀκρογωνιαίου
  choice: краеугольным камнем
  rationale: Термин обозначает краеугольный камень в строительной метафоре; вариант «главным краеугольным камнем» добавлял бы отсутствующее в тексте усиление.
- source_word: αὐτοῦ
  choice: сам
  rationale: Местоимение относится к Χριστοῦ Ἰησοῦ и имеет подчёркивающую силу.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Мессия Иисус
  rationale: Χριστός передан по смыслу как титул «Мессия», при этом сохранён порядок греческого выражения.
theological_decisions:
- issue: Значение выражения «основание апостолов и пророков»
  choice: 'Сохранён широкий родительный падеж: «на основании апостолов и пророков».'
  alternative: «на основании, положенном апостолами и пророками» или «на основании, которым являются апостолы и пророки»
  rationale: Греческая конструкция допускает основание, связанное с самими апостолами и пророками, их служением или свидетельством, но не уточняет это однозначно.
- issue: Передача Χριστός
  choice: Мессия Иисус
  alternative: Христос Иисус
  rationale: В данном богословском контексте Χριστός сохраняет значение титула; традиционный вариант указан в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Архитектурная метафора и синтаксическая зависимость от контекста сохранены; запятая в конце показывает продолжение предложения.
