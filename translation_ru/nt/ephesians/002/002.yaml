  text: ἐν αἷς ποτε περιεπατήσατε κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου, κατὰ τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος, τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος ἐν τοῖς υἱοῖς τῆς ἀπειθείας·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/002.yaml
  text: in which you once walked[a], according to the age of this world, according to the ruler of the authority of the air[c][b], the spirit now at work in the sons of disobedience.
translation:
  language: ru
  text: в которых вы некогда жили[a], согласно укладу этого мира[b], следуя правителю власти воздуха[c] — духу, ныне действующему в сынах непослушания[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ходили»; это образное обозначение образа жизни и поведения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «течению этого мира». Греческое слово αἰών означает «век», то есть нынешнюю эпоху и свойственный ей уклад.'
    reason: lexical_alternative
  - marker: c
    text: «Воздух» отражает древнее представление о сфере, связанной с действием враждебных духовных сил.
    reason: cultural_note
  - marker: d
    text: «Сыны непослушания» — люди, для которых характерно непослушание.
    reason: idiom_explanation
lexical_decisions:
- source_word: ἐν αἷς
  choice: в которых
  rationale: Относительное местоимение отсылает к «проступкам и грехам» в предыдущем стихе и сохраняет образ пребывания в них.
- source_word: ποτε περιεπατήσατε
  choice: вы некогда жили
  rationale: Наречие передаёт прежний образ жизни, а метафорическое «ходили» естественно выражено современным русским глаголом «жили»; буквальный образ отмечен в сноске.
- source_word: κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου
  choice: следуя веку этого мира
  rationale: «Следуя» передаёт соответствие или подчинение, выраженное κατά; «век» сохраняет отличие αἰών от κόσμος и временно-мировоззренческий оттенок выражения.
- source_word: κατὰ τὸν ἄρχοντα
  choice: следуя правителю
  rationale: Повтор «следуя» отражает второе κατά, а «правитель» ясно передаёт ἄρχων без архаичного «князь».
- source_word: τῆς ἐξουσίας τοῦ ἀέρος
  choice: власти воздуха
  rationale: Сохранена необычная греческая цепочка родительных падежей и слово «воздух», чтобы не подменять древний космологический язык толкованием.
- source_word: τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος
  choice: духу, ныне действующему
  rationale: Строчная буква соответствует враждебному духовному контексту; причастная конструкция передаёт продолжающееся в настоящее время действие.
- source_word: ἐν τοῖς υἱοῖς τῆς ἀπειθείας
  choice: в сынах непослушания
  rationale: Сохранён семитизированный оборот и грамматически мужское υἱοί; смысл идиомы пояснён в сноске.
theological_decisions:
- issue: Связь «духа, ныне действующего» с «правителем власти воздуха»
  choice: Тире представляет «духа» как пояснение к предшествующему обозначению враждебной силы, не уточняя окончательно, тождественны ли они онтологически.
  alternative: Понимать «духа» либо как прямое второе наименование самого сатаны, либо как отдельную безличную силу, подчинённую правителю.
  rationale: Структура греческой цепочки с родительными формами допускает пояснительное отношение, но не требует догматически точного определения природы этой связи.
- issue: Передача υἱοῖς τῆς ἀπειθείας
  choice: Сохранить в основном тексте «сыны непослушания».
  alternative: «Дети непослушания» или «непокорные люди».
  rationale: Так сохраняются грамматическая форма и библейская идиома источника, а сноска раскрывает её значение без смыслового сужения.
translation_notes:
  register: Современный литературный русский язык с умеренно сохранённой библейской образностью. Необычные выражения «век этого мира», «власть воздуха» и «сыны непослушания» оставлены ради точности к источнику и снабжены краткими пояснениями.
