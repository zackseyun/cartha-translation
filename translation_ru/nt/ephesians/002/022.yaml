  text: ἐν ᾧ καὶ ὑμεῖς συνοικοδομεῖσθε εἰς κατοικητήριον τοῦ θεοῦ ἐν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/022.yaml
  text: in whom you also are being built together into a dwelling place for God in the Spirit[a][b].
translation:
  language: ru
  text: в Нём и вы созидаетесь вместе, чтобы стать жилищем Бога в Духе[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в нём», если относительное местоимение относится ко всему зданию, а не непосредственно ко Христу.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «в духе» или «Духом». Выражение может указывать на сферу Божьего обитания или на действие Святого Духа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: в Нём
  rationale: Относительное местоимение естественнее всего относится к Христу, который остаётся личным центром строительного образа в предшествующем контексте. Заглавная буква ясно указывает на этот референт; возможная отсылка ко всему зданию отмечена в сноске.
- source_word: καὶ ὑμεῖς
  choice: и вы
  rationale: 'Сочетание сохраняет добавочное значение καί и подчёркнутое прямое обращение во множественном числе: адресаты также включены в созидаемое Божье здание.'
- source_word: συνοικοδομεῖσθε
  choice: созидаетесь вместе
  rationale: Настоящее время и пассивный залог передают продолжающееся действие, а «вместе» отражает приставку συν-. Глагол «созидаться» естественно поддерживает образ возведения здания и звучит достойно в современном библейском регистре.
- source_word: εἰς κατοικητήριον
  choice: чтобы стать жилищем
  rationale: Оборот с «чтобы стать» естественно передаёт цель или результат, выраженный εἰς, а «жилище» сохраняет конкретный храмовый образ без архаичного оттенка.
- source_word: τοῦ θεοῦ
  choice: Бога
  rationale: Родительный падеж после «жилище» позволяет сохранить форму греческого генитива и естественно обозначает Бога как Того, Кто пребывает в этом жилище.
- source_word: ἐν πνεύματι
  choice: в Духе
  rationale: Контекст Божьего присутствия и храмовый образ делают наиболее вероятной отсылку к Святому Духу. Предлог «в» сохраняет возможное совмещение значения сферы и действия, не сводя выражение только к орудийному смыслу.
theological_decisions:
- issue: Референт ἐν ᾧ
  choice: '«в Нём»: отсылка ко Христу'
  alternative: '«в нём»: отсылка ко всему зданию'
  rationale: Ближайший контекст связывает единство и рост здания со Христом, поэтому личная отсылка предпочтительна. Однако грамматически и контекстуально возможное отнесение к зданию не устранено, а вынесено в сноску.
- issue: Значение ἐν πνεύματι
  choice: '«в Духе»: Святой Дух как сфера Божьего присутствия и, возможно, действующая сила'
  alternative: «в духе» или «Духом»
  rationale: Храмовая тема и употребление Павлом языка Божьего обитания поддерживают отсылку к Святому Духу. Сохранение предлога «в» не разрешает однозначно заложенное в выражении наложение локативного и инструментального оттенков.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. «Созидаетесь» сохраняет строительную метафору и пассивный, продолжающийся характер действия; конструкция «чтобы стать» делает значение цели/результата прозрачным для обычного читателя.
