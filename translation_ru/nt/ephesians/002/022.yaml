  naturalness: Текст звучит естественно в современном литературном русском с уместным возвышенным библейским регистром. «Созидаетесь вместе» несколько более книжно, чем «строитесь вместе», но хорошо сохраняет пассивный характер и строительный образ, не создавая ненужной разговорности.
