    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν νόμον τῶν ἐντολῶν
  choice: закон заповедей
  rationale: Сохраняет формальную родительную конструкцию и заветно-правовой оттенок ἐντολή, не превращая выражение в отвлечённый принцип.
- source_word: ἐν δόγμασιν
  choice: выраженных в постановлениях
  rationale: Передаёт δόγμα как официальное постановление и делает связь с заповедями понятной по-русски; возможные иные синтаксические связи отмечены в сноске.
- source_word: καταργήσας
  choice: упразднив
  rationale: Передаёт решительное действие аористного причастия, не добавляя пояснений о пределах или богословских последствиях упразднения.
- source_word: τοὺς δύο
  choice: из двух
  rationale: Сохраняет явное указание на две группы из ближайшего контекста и естественно сочетается по-русски с результатом творения — «одного нового человека».
- source_word: κτίσῃ
  choice: сотворить
  rationale: Сохраняет сильное значение κτίζω и оттенок нового творения, а не просто преобразования или объединения.
- source_word: ἐν αὑτῷ
  choice: в Самом Себе
  rationale: Передаёт возвратное местоимение и подчёркивает, что единство создаётся в самом Христе; прописные буквы соответствуют русской благоговейной издательской норме.
- source_word: εἰς ἕνα καινὸν ἄνθρωπον
  choice: в одного нового человека
  rationale: Сохраняет единственное число и конкретный антропологический образ; корпоративный смысл остаётся видимым из сочетания «из двух» и поясняется в сноске.
- source_word: ποιῶν εἰρήνην
  choice: тем самым устанавливая мир
  rationale: Естественно передаёт причастную конструкцию как действие, связанное с сотворением нового человека; «тем самым» выявляет очевидную контекстуальную связь, не превращая её в отдельное утверждение.
theological_decisions:
- issue: Корпоративный смысл ἕνα καινὸν ἄνθρωπον
  choice: одного нового человека
  alternative: одно новое человечество
  rationale: Буквальный единственный образ сохраняет напряжение между отдельным «человеком» и корпоративной реальностью единства иудеев и язычников; вариант «человечество» допустим как толкование, но не подменяет образ в основном тексте.
- issue: Сила καταργήσας применительно к закону
  choice: упразднив
  alternative: лишив силы
  rationale: Греческий глагол допускает оттенок лишения действенности, однако в данном контексте выражение достаточно сильное. Перевод не расширяет объект действия за пределы названного здесь «закона заповедей, выраженных в постановлениях».
- issue: Синтаксическая роль ἐν δόγμασιν
  choice: заповеди, выраженные в постановлениях
  alternative: упразднив посредством постановлений / закон, состоящий в постановлениях
  rationale: Греческая предложная группа допускает несколько способов связи. Основной вариант наиболее понятен по-русски, а сноска сохраняет подлинную синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством новозаветного стиля. Синтаксис сохраняет форму фрагмента исходного предложения. «Упразднив» и «сотворить» поддерживают формальную точность, а «тем самым устанавливая мир» звучит естественно для широкого читателя.
