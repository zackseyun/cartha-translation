base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/008.yaml
  text: For by grace you have been saved through faith[a], and this is not from yourselves[b]; it is the gift of God.
translation:
  language: ru
  text: Ведь благодатью вы спасены через веру[a], и это[b] не от вас самих — это дар Божий.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «вера», в зависимости от контекста может также означать «доверие» или «верность».
    reason: lexical_alternative
  - marker: b
    text: Греческое «это», вероятнее всего, указывает на всю предшествующую мысль — спасение благодатью через веру, — а не только на «веру» или «благодать» по отдельности.
    reason: alternative_reading
lexical_decisions:
- source_word: χάριτί
  choice: благодатью
  rationale: Творительный падеж естественно передаёт средство или основание спасения; «благодать» сохраняет устойчивый богословский смысл Божьей незаслуженной милости.
- source_word: ἐστε σεσῳσμένοι
  choice: вы спасены
  rationale: Русская краткая форма страдательного причастия передаёт совершившееся спасительное действие и сохраняющийся результат греческой перифрастической перфектной конструкции.
- source_word: διὰ πίστεως
  choice: через веру
  rationale: «Через» точно передаёт διά с родительным как средство; «вера» является естественным и устойчивым соответствием πίστις в данном контексте.
- source_word: τοῦτο
  choice: это
  rationale: Средний род указательного местоимения сохраняет компактность греческого текста и позволяет отнести его ко всей предшествующей мысли, не сводя исключительно к «вере» или «благодати».
- source_word: οὐκ ἐξ ὑμῶν
  choice: не от вас самих
  rationale: Оборот ясно передаёт источник или происхождение, выраженное ἐκ, и звучит естественно в современном русском языке.
- source_word: θεοῦ τὸ δῶρον
  choice: это дар Божий
  rationale: Именная конструкция естественно восполняет связку и определяет всю предшествующую спасительную реальность как Божий дар.
theological_decisions:
- issue: 'К чему относится τοῦτο («это»): к благодати, вере или ко всей предшествующей мысли'
  choice: «Это» относится прежде всего ко всей реальности спасения благодатью через веру.
  alternative: «Это» относится отдельно к вере как Божьему дару либо отдельно к благодати.
  rationale: Τοῦτο имеет средний род, тогда как χάρις и πίστις — женский; поэтому естественнее видеть в нём указание на предшествующее высказывание в целом. Формулировка не исключает богословских выводов, но не утверждает более узкого референта как однозначный смысл текста.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет торжественную краткость оригинала. «Ведь» естественно передаёт пояснительное γάρ, а «дар Божий» сохраняет dignified biblical register без архаизации.
