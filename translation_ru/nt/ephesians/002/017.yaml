base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/017.yaml
  text: And he came and proclaimed peace to you who were far away[b][a], and peace to those who were near.
translation:
  language: ru
  text: Он пришёл и возвестил[b] мир вам, далёким[a], и мир[c] близким.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В данном контексте «далёкие» — прежде всего язычники, а «близкие» — иудеи (см. Еф 2:11–13).
    reason: cross_reference
  - marker: b
    text: 'Или: «принёс благую весть о мире». Греческий глагол означает возвещать благую весть, но здесь его прямое дополнение — «мир».'
    reason: lexical_alternative
  - marker: c
    text: В некоторых древних рукописях второе слово «мир» отсутствует.
    reason: textual_variant
lexical_decisions:
- source_word: ἐλθὼν
  choice: Он пришёл
  rationale: Аористное причастие передано личной формой как сопутствующее или предваряющее действие; так сохраняется образ прихода и получается естественная русская фраза.
- source_word: εὐηγγελίσατο
  choice: возвестил
  rationale: Глагол означает возвещение благой вести. Поскольку его прямое дополнение здесь — «мир», слово «возвестил» точно и естественно передаёт смысл без добавления отсутствующего в греческом существительного «Евангелие».
- source_word: εἰρήνην
  choice: мир
  rationale: Прямой эквивалент, сохраняющий в контексте оттенки примирения и целостного благополучия.
- source_word: ὑμῖν
  choice: вам
  rationale: Дательный падеж обозначает адресатов возвещения; обращение относится к читателям, которые в контексте принадлежат к «далёким».
- source_word: τοῖς μακρὰν
  choice: далёким
  rationale: Субстантивированное выражение передано без добавления толкования; оно сохраняет пространственную метафору отчуждения.
- source_word: τοῖς ἐγγύς
  choice: близким
  rationale: Параллельная краткая форма сохраняет риторический контраст с «далёкими».
- source_word: καὶ ... καὶ
  choice: и ... и
  rationale: Повтор союза сохраняет координацию двух групп и повторное возвещение одного мира.
theological_decisions:
- issue: Кого обозначают «далёкие» и «близкие»
  choice: В основном тексте сохранены образные обозначения «далёкие» и «близкие».
  alternative: Прямо назвать их язычниками и иудеями.
  rationale: Контекст Еф 2:11–13 указывает соответственно на язычников и иудеев, однако сам стих сохраняет метафорические категории. Толкование вынесено в примечание, чтобы не сужать риторику Павла.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественная, но общепонятная. Порядок слов сохраняет обращение «вам, далёким» и параллелизм двух групп. Местоимение «Он» указывает на Христа из контекста и написано с прописной буквы по принятой русской библейской традиции.
