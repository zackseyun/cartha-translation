lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: не от дел
  rationale: Оборот сохраняет отрицание и основное значение источника или происхождения у ἐξ. В современном русском он краток и естественно продолжает мысль предыдущего стиха.
- source_word: ἔργων
  choice: дел
  rationale: «Дела» передаёт широкое значение ἔργων, не добавляя отсутствующих в греческом тексте уточнений «дел закона», «добрых дел» или «человеческих усилий».
- source_word: ἵνα μή τις
  choice: чтобы никто не
  rationale: Естественно передаёт отрицательную цель или следствие, сохраняя возможную смысловую широту ἵνα.
- source_word: καυχήσηται
  choice: хвалился
  rationale: Глагол «хвалиться» прямо и традиционно передаёт καυχάομαι в значении выставлять основание для собственной похвалы; форма после «чтобы» естественно выражает греческое сослагательное наклонение.
theological_decisions:
- issue: Смысл выражения «от дел»
  choice: Сохранить широкое «дел», не сужая его толкованием.
  alternative: «от дел закона», «за добрые дела», «благодаря человеческим усилиям»
  rationale: В греческом тексте стоит только ἔργων. Любое уточнение разрешило бы богословский вопрос средствами перевода и добавило бы отсутствующее в исходном тексте.
- issue: Оттенок предлога ἐξ
  choice: «от», с примечанием о буквальном значении источника
  alternative: «за дела», «посредством дел», «вследствие дел»
  rationale: ἐξ прежде всего указывает на источник или происхождение. Русское «не от дел» сохраняет этот образ, тогда как инструментальные варианты сильнее интерпретируют связь.
translation_notes:
  register: Современный литературный русский, краткий и достойный по тону. Сохранена синтаксическая связь с предыдущим стихом и лаконичность греческого оригинала; маркер примечания помещён непосредственно после слова «дел».
