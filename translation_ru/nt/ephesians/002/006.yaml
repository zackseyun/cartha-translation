  text: καὶ συνήγειρεν καὶ συνεκάθισεν ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/006.yaml
  text: and raised us up with him and seated us with him in the heavenly places in Messiah Jesus[b][a],
translation:
  language: ru
  text: и воскресил нас вместе с Ним, и посадил вместе с Ним на небесах в Мессии Иисусе[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во Христе Иисусе».'
    reason: Лексическая альтернатива передачи титула Χριστός.
lexical_decisions:
- source_word: συνήγειρεν
  choice: воскресил нас вместе с Ним
  rationale: Глагол с приставкой συν- обозначает совместное участие в воскресении со Христом. Местоимение «нас» восстанавливается из контекста предложения, а «вместе с Ним» естественно передаёт значение греческой приставки.
- source_word: συνεκάθισεν
  choice: посадил вместе с Ним
  rationale: Глагол означает «посадить вместе». Такой перевод сохраняет образ совместного пребывания со Христом, не усиливая его до более толковательного «возвёл на престол».
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: на небесах
  rationale: Устойчивое и естественное русское выражение для небесной сферы; оно передаёт пространственное значение фразы, не вводя отсутствующего в греческом существительного «места» или «сферы».
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  rationale: Χριστός здесь сохраняет значение титула «Мессия», а предложная конструкция передаёт характерный для Павла язык единения с Мессией.
- source_word: καὶ
  choice: и
  rationale: Повторяющийся союз соединяет действия Бога в последовательный ряд и сохраняется в переводе.
theological_decisions:
- issue: Значение совместного участия в сложных глаголах с συν-
  choice: В обоих глаголах явно передать «вместе с Ним».
  alternative: 'Оставить совместность невыраженной: «воскресил нас и посадил нас».'
  rationale: Формы συνήγειρεν и συνεκάθισεν подчёркивают участие верующих вместе со Христом в Его воскресении и небесном положении; явное выражение этого значения передаёт греческую морфологию без добавления чуждого смысла.
- issue: Передача Χριστῷ как титула или традиционного именования
  choice: Мессии Иисусе
  alternative: Христе Иисусе
  rationale: Перевод «Мессия» раскрывает титульное значение Χριστός. Традиционный вариант отмечен в сноске, поскольку в русском библейском употреблении «Христос» также воспринимается как устойчивое именование.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и ритма исходного перечисления. Заглавное «Ним» соответствует принятой русской практике почтительного обозначения Христа. Начальное «и» и конечная запятая сохранены, поскольку стих является частью более длинного предложения.
