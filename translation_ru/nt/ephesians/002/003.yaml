source:
  edition: SBLGNT
  text: ἐν οἷς καὶ ἡμεῖς πάντες ἀνεστράφημέν ποτε ἐν ταῖς ἐπιθυμίαις τῆς σαρκὸς ἡμῶν, ποιοῦντες τὰ θελήματα τῆς σαρκὸς καὶ τῶν διανοιῶν, καὶ ⸀ἤμεθα τέκνα φύσει ὀργῆς ὡς καὶ οἱ λοιποί·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/003.yaml
  text: among whom we all also once lived in the desires of our flesh[a], fulfilling the desires of the flesh and of the mind, and we were by nature children of wrath[e][d][c][b], just as the rest were.
translation:
  language: ru
  text: Среди них некогда жили и все мы, по желаниям нашей плоти, исполняя желания плоти и помыслов, и по природе были детьми гнева, как и прочие.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν οἷς
  choice: среди них
  rationale: Форма местоимения допускает соотнесение как с людьми, упомянутыми непосредственно перед этим («сынами непокорности»), так и со сферой прежней жизни. В данном контексте личное «среди них» наиболее естественно, а альтернативу сохраняет сноска.
- source_word: ἀνεστράφημέν
  choice: жили
  rationale: Глагол здесь обозначает образ жизни или поведение. «Жили» естественно для современного русского языка и не привносит несвойственного контексту значения движения.
- source_word: ἐπιθυμίαις
  choice: по желаниям
  rationale: «Желания» передаёт широкий круг влечений и не сужает смысл до сексуальной похоти. Предлог «по» естественно выражает жизнь, направляемую этими желаниями.
- source_word: σάρξ
  choice: плоть
  rationale: Сохранён характерный термин Павла. В данном контексте он имеет нравственно-антропологическую окраску, однако перевод «греховная природа» чрезмерно конкретизировал бы его смысл.
- source_word: ποιοῦντες τὰ θελήματα
  choice: исполняя волю
  rationale: Оборот передаёт практическое осуществление волевых устремлений. Единственное число «волю» является естественным русским собирательным выражением; формальное множественное число отмечено в сноске.
- source_word: διανοιῶν
  choice: помыслов
  rationale: «Помыслы» охватывают мысли, намерения и внутренние установки, сохраняя множественное число исходного слова и нравственный оттенок контекста.
- source_word: τέκνα ὀργῆς
  choice: детьми гнева
  rationale: Сохранён семитский по форме образ исходного текста без преждевременного сведения его смысла только к «объектам гнева» или к предопределённости наказанию.
- source_word: φύσει
  choice: по природе
  rationale: Прямой и богословски нейтральный перевод, не сужающий спорный смысл до одного лишь рождения или биологического происхождения.
- source_word: οἱ λοιποί
  choice: прочие
  rationale: Кратко и естественно обозначает остальных людей, с которыми сопоставляется прежнее состояние говорящих.
theological_decisions:
- issue: Значение σάρξ в нравственно окрашенном контексте
  choice: плоть
  alternative: греховная природа
  rationale: «Плоть» сохраняет лексику Павла и присущую ей многозначность; вариант «греховная природа» уже содержит определённое антропологическое толкование.
- issue: Смысл выражения τέκνα φύσει ὀργῆς
  choice: по природе были детьми гнева
  alternative: от рождения были объектами гнева
  rationale: Основной текст сохраняет греческую метафору и не решает за читателя, подчёркивает ли она состояние, принадлежность или подверженность суду. «По природе» также не заменено более узким «от рождения».
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Синтаксис сделан плавным и понятным, при этом сохранены ключевые образы «плоть», «по природе» и «дети гнева». Повтор слова «плоть» намеренно оставлен вслед за исходным текстом.
