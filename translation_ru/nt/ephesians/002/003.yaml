  source_fidelity: 'Основной смысл передан точно: личное понимание ἐν οἷς как «среди них» допустимо и снабжено сноской; ἀνεστράφημεν ποτε, ἐπιθυμίαις, σάρξ, φύσει и τέκνα ὀργῆς отражены без конфессионального истолкования. Однако τὰ θελήματα имеет множественное число и обозначает волевые стремления; «волю плоти и помыслов» в единственном числе сглаживает эту деталь и синтаксически объединяет два источника в одну «волю».'
