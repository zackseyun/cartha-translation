  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτι ⸀ἦτε τῷ καιρῷ ἐκείνῳ χωρὶς Χριστοῦ, ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραὴλ καὶ ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας, ἐλπίδα μὴ ἔχοντες καὶ ἄθεοι ἐν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/012.yaml
  text: that at that time you were without Messiah[a], alienated from the commonwealth of Israel and strangers to the covenants of the promise[c][b], having no hope and without God in the world.
translation:
  language: ru
  text: что в то время вы были без Мессии[a], отчуждены от общества Израиля и чужды заветам обещания[b], не имели надежды и были без Бога в мире[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «без Христа». Греческий титул Χριστός можно передать обоими способами; здесь «Мессия» подчёркивает его смысл в контексте Израиля и заветов.'
    reason: alternative_reading
  - marker: b
    text: 'Возможный смысл: «заветам, связанным с обещанием» или «заветам, содержащим обещание».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «безбожны в мире». Здесь речь может идти о жизни без истинного Бога, а не о философском отрицании существования божества.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς Χριστοῦ
  choice: без Мессии
  rationale: Χριστός здесь выступает как титул в иудейско-заветном контексте; «Мессия» передаёт его смысл, а «без» прямо и естественно выражает χωρὶς.
- source_word: ἀπηλλοτριωμένοι
  choice: отчуждены
  rationale: Причастие совершенного вида обозначает устойчивое состояние отделённости; «отчуждены» сохраняет как общественный, так и relational смысл.
- source_word: πολιτείας τοῦ Ἰσραήλ
  choice: от общества Израиля
  rationale: πολιτεία здесь указывает на устроенную общность Израиля, а не только на индивидуальный юридический статус; «общество» понятно современному читателю и сочетается с «отчуждены».
- source_word: ξένοι
  choice: чужды
  rationale: Слово обозначает непричастность к данной заветной сфере; управление «чужды заветам» естественно для литературного русского языка.
- source_word: διαθηκῶν τῆς ἐπαγγελίας
  choice: заветам обещания
  rationale: Сохранены множественное число «заветов» и единственное число «обещания», а также неоднозначная родительная связь греческого текста.
- source_word: ἐλπίδα μὴ ἔχοντες
  choice: не имели надежды
  rationale: Личная форма естественно продолжает русское предложение и точно передаёт отсутствие надежды как прежнее состояние адресатов.
- source_word: ἄθεοι
  choice: без Бога
  rationale: Так передаётся лишённость Бога или отсутствие связи с истинным Богом без навязывания современного значения философского атеизма.
- source_word: ἐν τῷ κόσμῳ
  choice: в мире
  rationale: Кратко и буквально передаёт мир как сферу человеческого существования.
theological_decisions:
- issue: Передача Χριστός в данном контексте
  choice: Мессия
  alternative: Христос
  rationale: Контекст Израиля, заветов и обещания подчёркивает титульный смысл слова; вариант «Мессия» делает этот смысл явным, не превращая титул лишь в имя.
- issue: Передача ἄθεοι
  choice: без Бога
  alternative: безбожны
  rationale: «Без Бога» сохраняет возможный смысл отчуждения от истинного Бога и не сводит выражение ни к нравственной оценке, ни к современному философскому атеизму.
- issue: Связь в выражении διαθηκῶν τῆς ἐπαγγελίας
  choice: заветам обещания
  alternative: заветам, содержащим обещание
  rationale: Формальная родительная конструкция сохраняет богословскую ёмкость и не уточняет без необходимости, каким именно образом обещание связано с заветами.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис сохраняет зависимость от предшествующего призыва помнить; богословски значимые числа и родительная конструкция сохранены без лишнего истолкования.
