lexical_decisions:
- source_word: ἐν ᾧ
  choice: в Нём
  rationale: Относительное местоимение естественнее всего относится к Христу из предыдущего стиха; личная формулировка также сохраняет повторяющийся в контексте оборот «в Нём».
- source_word: πᾶσα οἰκοδομὴ
  choice: всё здание
  rationale: Безартиклевое сочетание допускает значения «всё здание» и «каждое здание». Основной текст передаёт единый образ Божьего народа как храма, а альтернативу сохраняет сноска.
- source_word: συναρμολογουμένη
  choice: соединяясь воедино
  rationale: Причастие настоящего времени в пассивном залоге описывает продолжающееся согласованное соединение частей; русская возвратная форма естественна и сохраняет архитектурный образ.
- source_word: αὔξει
  choice: растёт
  rationale: Настоящее время выражает продолжающийся рост; краткая форма сохраняет намеренное сочетание архитектурного и органического образов.
- source_word: εἰς
  choice: становясь
  rationale: Предлог обозначает направленность к результату. Деепричастная конструкция естественно передаёт смысл «вырастает в / становится», не создавая неуклюжей русской фразы.
- source_word: ναὸν ἅγιον
  choice: святым храмом
  rationale: ναός обозначает храм, особенно его святилище; «святой храм» ясно и непосредственно передаёт метафору.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Буквальная и укоренённая формулировка сохраняет возможные оттенки сферы и единения, не сужая их толкованием.
theological_decisions:
- issue: Относится ли ᾧ лично ко Христу или безлично к образу здания
  choice: 'Личное указание на Христа: «в Нём»'
  alternative: 'Безличное указание: «в котором»'
  rationale: Ближайший смысловой предшественник — Сам Христос Иисус как краеугольный камень; повторение «в Нём» в контексте поддерживает личное христологическое прочтение.
- issue: Имеет ли πᾶσα οἰκοδομὴ собирательное или распределительное значение
  choice: 'Собирательное: «всё здание»'
  alternative: 'Распределительное: «каждое здание»'
  rationale: Контекст подчёркивает единство иудеев и язычников в одном Божьем народе и одном храме. Однако грамматика допускает распределительное прочтение, поэтому оно приведено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Заглавные буквы в «Нём» и «Господе» обозначают личное указание на Христа. Сохранено наложение образов здания и органического роста.
