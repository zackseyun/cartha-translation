lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт резкое противопоставление предшествующему описанию духовной смерти и состояния под гневом.
- source_word: πλούσιος ὢν ἐν ἐλέει
  choice: богатый милостью
  rationale: Естественно передаёт причастный оборот и образ изобилия; значение ἔλεος сохранено как «милость».
- source_word: διὰ τὴν πολλὴν ἀγάπην αὐτοῦ
  choice: по Своей великой любви
  rationale: διά с винительным выражает причину; оборот «по Своей великой любви» звучит естественно и сохраняет причинную связь.
- source_word: ἣν ἠγάπησεν ἡμᾶς
  choice: которой Он возлюбил нас
  rationale: Сохраняет относительное придаточное и намеренный однокоренной повтор ἀγάπην — ἠγάπησεν.
theological_decisions:
- issue: Однокоренной оборот «любовь — возлюбил»
  choice: 'Сохранить: «по Своей великой любви, которой Он возлюбил нас»'
  alternative: «из-за Своей великой любви к нам»
  rationale: Греческий текст подчёркивает мысль повтором существительного и однокоренного глагола; более гладкий вариант устранил бы этот риторический акцент.
- issue: Соотношение милости и любви
  choice: 'Передать их как различные, но связанные понятия: «богатый милостью… по Своей великой любви»'
  alternative: 'Объединить их, например: «по Своей великой милосердной любви»'
  rationale: 'В исходном тексте милость и любовь не тождественны: милость описывает Божье изобилие, а великая любовь названа основанием действия.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оборотом «возлюбил», выбранным ради сохранения однокоренного повтора. Прописные местоимения о Боге следуют принятому в проектном тексте благоговейному регистру.
