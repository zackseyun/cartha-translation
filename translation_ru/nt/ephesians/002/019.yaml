  text: ἄρα οὖν οὐκέτι ἐστὲ ξένοι καὶ πάροικοι, ἀλλὰ ⸀ἐστὲ συμπολῖται τῶν ἁγίων καὶ οἰκεῖοι τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/019.yaml
  text: So then[a], you are no longer strangers and resident foreigners, but you are fellow citizens with the saints and members of God's household[c][b],
translation:
  language: ru
  text: Итак, вы уже не чужие и не пришельцы[a], а сограждане вместе со святыми[b] и члены Божьей семьи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть люди, живущие среди народа, но не обладающие полными гражданскими правами.
    reason: lexical_alternative
  - marker: b
    text: «Святые» здесь — Божий святой народ, а не особая группа впоследствии канонизированных людей.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Итак
  rationale: Сочетание выводных частиц связывает стих с предшествующим рассуждением; «итак» естественно и ясно передаёт этот вывод в современном русском языке.
- source_word: οὐκέτι
  choice: уже не
  rationale: Передаёт изменение прежнего положения и звучит по-русски естественнее, чем буквальное «больше не» в этой конструкции.
- source_word: ξένοι
  choice: чужие
  rationale: Сохраняет значение непричастности и отсутствия принадлежности, одновременно поддерживая контраст с Божьей семьёй.
- source_word: πάροικοι
  choice: пришельцы
  rationale: Обозначает живущих среди народа без полного гражданского статуса. Традиционное русское слово сохраняет социально-правовой оттенок, а сноска устраняет возможную неясность.
- source_word: συμπολῖται
  choice: сограждане
  rationale: Точно и лаконично выражает совместное гражданство, продолжая общественно-политический образ стиха.
- source_word: τῶν ἁγίων
  choice: святых
  rationale: Формально сохраняет родительный падеж греческого текста и не сужает неоднозначный круг обозначаемых лиц; пояснение раскрывает новозаветное употребление слова.
- source_word: οἰκεῖοι
  choice: члены ... семьи
  rationale: Греческое слово обозначает принадлежащих к дому или домочадцев. «Члены Божьей семьи» естественно раскрывает метафору личной принадлежности к Божьему дому.
- source_word: τοῦ θεοῦ
  choice: Божьей
  rationale: Русское притяжательное прилагательное естественно передаёт родительный падеж принадлежности.
theological_decisions:
- issue: Кого обозначают «святые» (τῶν ἁγίων)
  choice: Сохранено широкое обозначение «святые», пояснённое как Божий святой народ.
  alternative: Ангелы; конкретно верующие из иудеев; все верующие.
  rationale: Контекст говорит о включении прежних язычников в Божий народ, однако сам стих не определяет референт настолько узко, чтобы закрепить одну из более конкретных трактовок в основном тексте.
- issue: Образ οἰκεῖοι τοῦ θεοῦ
  choice: члены Божьей семьи
  alternative: домашние Бога; принадлежащие к Божьему дому
  rationale: Выбранный вариант ясно передаёт близость и принадлежность, не превращая метафору дома в указание лишь на здание или учреждение.
translation_notes:
  register: 'Современный литературный русский язык с умеренно традиционной библейской лексикой. Пара «чужие и пришельцы» сохраняет различие двух греческих слов, а «сограждане» и «семья» передают последовательную смену образов: от отсутствия гражданских прав к полноправному гражданству и близкой принадлежности Божьему дому.'
