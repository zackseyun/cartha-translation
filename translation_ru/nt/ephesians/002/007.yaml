id: EPH.2.7
reference: Ephesians 2:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἵνα ἐνδείξηται ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις ⸂τὸ ὑπερβάλλον πλοῦτος⸃ τῆς χάριτος αὐτοῦ ἐν χρηστότητι ἐφ’ ἡμᾶς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/007.yaml
  text: so that in the coming ages he might display the surpassing riches of his grace in kindness toward us in Messiah Jesus[a][b][c].
translation:
  language: ru
  text: чтобы в грядущих веках показать безмерное[a] богатство Своей благодати в доброте к нам во Христе Иисусе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «превосходящее всякую меру».'
    reason: Греческое ὑπερβάλλον буквально указывает на то, что выходит за пределы или превосходит меру.
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт целевое, а возможно и результативное, значение союза в связи с предшествующим контекстом.
- source_word: ἐνδείξηται
  choice: показать
  rationale: Естественно передаёт значение явного обнаружения или наглядного проявления; форма русского инфинитива после «чтобы» соотносится с подлежащим предыдущего контекста.
- source_word: ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις
  choice: в грядущих веках
  rationale: Сохраняет множественное число αἰῶσιν и направленность к будущему, оставаясь естественным для литературного русского языка.
- source_word: τὸ ὑπερβάλλον πλοῦτος
  choice: безмерное богатство
  rationale: Передаёт идею богатства, превосходящего обычную меру; «безмерное» звучит естественнее буквального «превосходящее» при существительном «богатство».
- source_word: τῆς χάριτος αὐτοῦ
  choice: Своей благодати
  rationale: «Благодать» сохраняет центральное для Павла значение χάρις; возвратное «Своей» ясно связывает её с действующим лицом из контекста.
- source_word: ἐν χρηστότητι
  choice: в доброте
  rationale: Сохраняет предложную конструкцию и обозначает доброту как сферу или образ проявления благодати, не сводя выражение исключительно к средству действия.
- source_word: ἐφ’ ἡμᾶς
  choice: к нам
  rationale: Передаёт направленность благой доброты на адресатов; буквальное «на нас» здесь было бы неестественно по-русски.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: во Христе Иисусе
  rationale: Традиционное и естественное русское титульное обозначение сохраняет богословски значимую формулу единения со Христом.
theological_decisions:
- issue: Значение конструкции ἐν χρηστότητι
  choice: в доброте
  alternative: посредством доброты
  rationale: Греческое ἐν допускает оттенки сферы, образа действия и средства. Основной текст сохраняет более широкую формулировку и не сужает её до инструментального значения.
- issue: Передача Χριστῷ как титула
  choice: Христе
  alternative: Мессии
  rationale: В современном русском библейском употреблении «Христос» является укоренившимся титулом, а не фамилией; форма «во Христе Иисусе» также сохраняет узнаваемую павловскую формулу.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Синтаксис сохранён близким к греческому, но без неестественных для русского языка оборотов.
