base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/014.yaml
  text: For he himself is our peace[a], who made both one and broke down the dividing wall of the barrier—the hostility—in his flesh[d][c][b],
translation:
  language: ru
  text: 'Ведь Он Сам — наш мир: Он сделал и тех и других[a] единым целым и в Своей плоти разрушил разделительную стену-преграду — то есть вражду[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «И те и другие» — иудеи и язычники, о которых говорится в ближайшем контексте.
    reason: contextual_clarification
  - marker: b
    text: 'Возможна и иная пунктуационная связь: «разрушил разделительную стену-преграду, вражду, в Своей плоти»; греческая фраза продолжается в следующем стихе.'
    reason: syntactic_ambiguity
  - marker: c
    text: 'Буквально: «в Своей плоти». Этот оборот относится к действию Христа, а не означает, что вражда находилась в Его плоти; в контексте он связан с Его телесной смертью.'
    reason: lexical_and_theological_clarification
lexical_decisions:
- source_word: αὐτὸς
  choice: Он Сам
  rationale: 'Интенсивное местоимение передано с эмфазой: Христос не только приносит мир, но Сам является нашим миром.'
- source_word: γάρ
  choice: Ведь
  rationale: Естественно для современного русского языка обозначает обоснование предыдущей мысли и сохраняет связь с контекстом.
- source_word: ἡ εἰρήνη ἡμῶν
  choice: наш мир
  rationale: 'Сохраняет именную метафору оригинала: Христос Сам есть мир, объединяющий прежде разделённых.'
- source_word: ὁ ποιήσας τὰ ἀμφότερα ἓν
  choice: Он сделал и тех и других единым целым
  rationale: Передаёт τὰ ἀμφότερα без внесения обозначений «иудеи» и «язычники» непосредственно в текст, но ясно указывает на две названные в контексте стороны; «единым целым» звучит естественно и выражает результат объединения.
- source_word: τὸ μεσότοιχον τοῦ φραγμοῦ
  choice: разделявшую их стену — преграду
  rationale: μεσότοιχον обозначает разделительную стену, а φραγμός характеризует её как преграду; тире сохраняет пояснительное отношение и избегает тяжеловесного буквального сочетания «средняя стена ограды».
- source_word: λύσας
  choice: разрушил
  rationale: В образе стены глагол означает её устранение или разрушение; этот вариант точен и естествен.
- source_word: τὴν ἔχθραν
  choice: то есть вражду
  rationale: 'Передаёт вероятную пояснительную аппозицию: стена-преграда осмысляется как вражда. Формула «то есть» делает эту связь ясной, не превращая вражду в отдельное действие.'
- source_word: ἐν τῇ σαρκὶ αὐτοῦ
  choice: в Своей плоти
  rationale: Сохраняет буквальное «плоть» и относит оборот к действию разрушения, не создавая впечатления, будто вражда находилась внутри Христа.
theological_decisions:
- issue: К кому относятся «и те и другие»
  choice: Оставить две стороны неназванными в основном тексте, пояснив их в сноске как иудеев и язычников.
  alternative: Ввести в текст «иудеев и язычников».
  rationale: Непосредственный контекст однозначно указывает на иудеев и язычников, но сам греческий текст использует субстантивированное «оба/те и другие». Выбранный вариант сохраняет форму оригинала и остаётся понятным.
- issue: Значение σάρξ применительно ко Христу
  choice: «плоть» — телесное человеческое существование Христа, в контексте ведущее к Его смерти.
  alternative: «тело» или разъясняющее «через Свою телесную смерть».
  rationale: «Плоть» сохраняет лексику оригинала и богословскую конкретность воплощения; сноска предотвращает ошибочное понимание как греховной природы или уничтожения человечности Христа.
- issue: Синтаксическая связь τὴν ἔχθραν
  choice: Понять «вражду» как пояснение к стене-преграде.
  alternative: Связать «вражду» с последующим причастием/мыслью стиха 15 или понять как второй прямой объект «разрушил».
  rationale: Аккузатив допускает синтаксическое напряжение, а мысль продолжается в следующем стихе. Пояснительная передача хорошо соответствует порядку слов и образу, при этом сноска отмечает возможную иную пунктуационную связь.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной интонацией. Заглавные буквы в местоимениях, относящихся ко Христу, следуют принятой русской библейской стилистике. Двоеточие делает участие Христа в созидании мира естественным продолжением утверждения «Он Сам — наш мир».
