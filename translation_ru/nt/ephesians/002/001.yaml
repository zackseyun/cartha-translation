  yaml_path: translation/nt/ephesians/002/001.yaml
  text: And you were dead in your trespasses and sins,
translation:
  language: ru
  text: И вас, мёртвых из-за ваших проступков и грехов,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεκρούς
  choice: мёртвых
  rationale: Сохраняет сильную метафору духовной смерти и согласуется с винительным падежом, зависящим от продолжения мысли в ст. 5.
- source_word: παραπτώμασιν
  choice: проступков
  rationale: Передаёт смысл нарушений и ложных шагов, сохраняя различие с более общим ἁμαρτίαις.
- source_word: ἁμαρτίαις
  choice: грехов
  rationale: Обычный и точный русский эквивалент для обозначения грехов.
- source_word: τοῖς… καὶ ταῖς…
  choice: из-за… и…
  rationale: Дательный здесь указывает на причину или основание состояния смерти; «из-за» естественно выражает это по-русски.
theological_decisions:
- issue: Синтаксическая незавершённость стиха
  choice: Сохранить причастную конструкцию «И вас, мёртвых…»
  alternative: «И вы были мертвы…»
  rationale: В греческом тексте ὑμᾶς и ὄντας входят в незавершённую конструкцию, которая получает главное сказуемое в ст. 5. Такой перевод сохраняет связь и риторическое напряжение оригинала, не превращая причастие в самостоятельный глагол.
- issue: Характер смерти
  choice: Не добавлять пояснение «духовно»
  alternative: «духовно мёртвых»
  rationale: Оригинал говорит просто «мёртвых»; контекст раскрывает метафорический смысл без внесения толковательного уточнения.
translation_notes:
  register: Современный литературный русский язык; формулировка намеренно остаётся синтаксически открытой, поскольку предложение продолжается далее. Запятая в конце отражает структуру данного фрагмента.
