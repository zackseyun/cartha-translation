  source_fidelity: 'Текст точно передаёт Καὶ ὑμᾶς ὄντας νεκρούς: союз «И», винительное «вас» и обособленное «мёртвых» сохраняют незавершённую синтаксическую связь с главным сказуемым в ст. 5. «Из-за ваших проступков и грехов» адекватно выражает причинное значение дательного τοῖς παραπτώμασιν καὶ ταῖς ἁμαρτίαις ὑμῶν. Не добавлено отсутствующее в оригинале «духовно».'
