  terminology: «Грехи» — точный обычный эквивалент ἁμαρτίαι. «Проступки» приемлемо передаёт παραπτώματα и сохраняет различение двух терминов, не навязывая узкого богословского толкования. Выбранная лексика соответствует английскому аудиторскому тексту («trespasses and sins»).
