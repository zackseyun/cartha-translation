source:
  edition: SBLGNT
  text: Διὸ μνημονεύετε ὅτι ⸂ποτὲ ὑμεῖς⸃ τὰ ἔθνη ἐν σαρκί, οἱ λεγόμενοι ἀκροβυστία ὑπὸ τῆς λεγομένης περιτομῆς ἐν σαρκὶ χειροποιήτου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/011.yaml
  text: Therefore remember that formerly you[a], the Gentiles in the flesh[d][c][b], who are called “uncircumcision” by what is called “circumcision,” made by hands in the flesh—
translation:
  language: ru
  text: Поэтому помните, что прежде вы, язычники по плоти[a], которых те, кого называют «обрезанием» — обрезанием, совершаемым руками на плоти[c], — называют «необрезанием»[b], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вы, некогда бывшие язычниками по плоти». Здесь «язычники» означает неевреев, а «по плоти» указывает на телесно-этническое происхождение.'
    reason: lexical_alternative
  - marker: b
    text: «Обрезание» и «необрезание» здесь — не только телесные признаки, но и коллективные заветно-этнические наименования.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «так называемым обрезанием, рукотворным на плоти». Слова Павла могут содержать критическую дистанцию по отношению к одному лишь внешнему обрезанию.'
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассуждения и естественно связывает стих с контекстом.
- source_word: μνημονεύετε
  choice: помните
  rationale: Настоящее повелительное наклонение во множественном числе; русская форма естественно передаёт призыв продолжать помнить.
- source_word: ποτὲ ὑμεῖς
  choice: прежде вы
  rationale: Сохраняет временное противопоставление и смысловое выделение адресатов.
- source_word: τὰ ἔθνη ἐν σαρκί
  choice: язычники по плоти
  rationale: В данном иудейско-языческом противопоставлении ἔθνη означает неевреев, а ἐν σαρκί указывает на телесно-этнический статус.
- source_word: οἱ λεγόμενοι ἀκροβυστία
  choice: которых ... называют «необрезанием»
  rationale: Передаёт пассивное общественное именование и сохраняет абстрактное, полемическое название группы.
- source_word: ὑπὸ τῆς λεγομένης περιτομῆς
  choice: те, кто носит название «обрезание»
  rationale: В русском языке позволяет ясно показать, что абстрактное существительное обозначает группу людей, и сохраняет повтор λεγόμενοι/λεγομένης и риторическую дистанцию.
- source_word: ἐν σαρκὶ χειροποιήτου
  choice: обрезание, совершаемое руками на плоти
  rationale: Сохраняет буквальный образ χειροποίητος и тесно связывает определение с обрезанием как внешним телесным действием.
theological_decisions:
- issue: Значение σάρξ в неморальном контексте
  choice: плоть
  alternative: тело; телесное происхождение
  rationale: Речь идёт о телесно-этническом и заветном различии, а не о греховной природе; традиционный термин сохраняет связь двух употреблений ἐν σαρκί в стихе.
- issue: Сила λεγομένης при περιτομή
  choice: те, кто носит название «обрезание»
  alternative: так называемое «обрезание»; те, кого называют «обрезанными»
  rationale: Формулировка сохраняет симметрию двух именований и возможную критическую дистанцию Павла, но не усиливает её до явной насмешки.
- issue: Функция терминов «обрезание» и «необрезание»
  choice: сохранены как коллективные заветно-этнические наименования
  alternative: обрезанные и необрезанные
  rationale: Абстрактные формы отражают лексику и риторическое противопоставление греческого текста, не сводя их к анатомическому описанию.
translation_notes:
  register: 'Современный литературный русский язык с достоинством апостольского увещания. Синтаксис намеренно остаётся незавершённым: греческое предложение продолжается в следующем стихе. Повтор слова «плоть» сохранён ради смысловой и риторической связи, а тяжёлая греческая конструкция слегка развернута для ясности.'
