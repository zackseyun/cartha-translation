  text: For through him we both have access in one Spirit to the Father[a][b][c].
translation:
  language: ru
  text: Ведь через Него мы — и одни и другие — имеем доступ к Отцу в одном Духе[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Потому что через Него…»'
    reason: lexical_alternative
