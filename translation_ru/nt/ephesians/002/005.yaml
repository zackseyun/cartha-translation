  yaml_path: translation/nt/ephesians/002/005.yaml
  text: even when we were dead in our trespasses[a], he made us alive together with Messiah—by grace you have been saved—
translation:
  language: ru
  text: даже когда мы были мертвы в своих преступлениях, оживил нас вместе с Мессией[a] — благодатью вы спасены —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со Христом». Греческое Χριστός буквально означает «Помазанник»; здесь этот титул передан словом «Мессия». В традиционных русских переводах обычно употребляется «Христос».'
    reason: Указывает традиционный вариант передачи титула и поясняет смысл выбранного слова.
lexical_decisions:
- source_word: ὄντας ἡμᾶς νεκροὺς
  choice: когда мы были мертвы
  rationale: Причастный оборот передан естественной для русского языка придаточной конструкцией. Она выражает состояние во время Божьего действия, не исключая допустимого уступительного оттенка («хотя мы были мертвы»).
- source_word: τοῖς παραπτώμασιν
  choice: в своих преступлениях
  rationale: Предлог «в» сохраняет вероятное значение сферы или состояния, не сводя дательный падеж однозначно к причине. Местоимение «своих» естественно соотносит преступления с «нами» и соответствует контексту.
- source_word: συνεζωοποίησεν
  choice: оживил нас вместе
  rationale: Глагол «оживил» ясно передаёт дарование жизни, а «вместе» сохраняет значение приставки συν-. Местоимение «нас» поставлено при сказуемом ради естественного русского порядка слов.
- source_word: τῷ Χριστῷ
  choice: с Мессией
  rationale: 'Дательный падеж передан как совместность: Бог оживил нас вместе с Мессией. «Мессия» сохраняет титульный смысл Χριστός и здесь звучит естественно.'
- source_word: χάριτί
  choice: благодатью
  rationale: Творительный падеж передаёт средство или основание спасения и сохраняет краткость и богословскую ёмкость греческого выражения.
- source_word: ἐστε σεσῳσμένοι
  choice: вы спасены
  rationale: Краткое страдательное причастие выражает нынешнее состояние как результат совершившегося спасительного действия, что соответствует перифрастическому перфекту.
theological_decisions:
- issue: Передача Χριστῷ
  choice: с Мессией
  alternative: со Христом
  rationale: В данном сочетании титульное значение остаётся заметным; «Мессия» передаёт смысл греческого Χριστός, тогда как традиционный русский вариант «Христос» отмечен в сноске.
- issue: Синтаксическая функция τοῖς παραπτώμασιν
  choice: в своих преступлениях
  alternative: из-за своих преступлений
  rationale: Выбранный вариант сохраняет возможное значение сферы и не утверждает исключительно причинное понимание дательного падежа.
- issue: Вставной характер χάριτί ἐστε σεσῳσμένοι
  choice: сохранить обособление с помощью тире
  alternative: включить слова без обособления в основное предложение
  rationale: Тире передают резкую пояснительную вставку Павла и подчёркивают благодать, не добавляя отсутствующих в тексте связок.
translation_notes:
  register: Современный литературный русский с достоинством библейского стиля. Начальная строчная буква и заключительное тире сохранены, поскольку стих продолжает синтаксическую конструкцию предыдущего контекста. Формулировка избегает архаичного «оживотворил», но сохраняет компактность и риторическую напряжённость оригинала.
