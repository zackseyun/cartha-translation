id: EPH.2.16
reference: Ephesians 2:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἀποκαταλλάξῃ τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι τῷ θεῷ διὰ τοῦ σταυροῦ ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/016.yaml
  text: and might reconcile both to God in one body through the cross, having put the hostility to death by it.
translation:
  language: ru
  text: и в одном теле примирить обоих с Богом посредством креста, убив им вражду.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «убив на нём вражду».'
    reason: ἐν αὐτῷ может пониматься как указание либо на средство («им»), либо на место/сферу действия («на нём»); вероятный антецедент — крест.
lexical_decisions:
- source_word: ἀποκαταλλάξῃ
  choice: примирить
  rationale: Передаёт восстановление отношений с Богом; форма инфинитива естественно продолжает синтаксис предыдущего стиха и соответствует греческому сослагательному в целевой конструкции.
- source_word: τοὺς ἀμφοτέρους
  choice: обоих
  rationale: Сохраняет прямую отсылку к двум группам — иудеям и язычникам — без внесения пояснения в основной текст.
- source_word: ἐν ἑνὶ σώματι
  choice: в одном теле
  rationale: Буквально сохраняет образ единого тела и не уточняет сверх текста, идёт ли речь прежде всего о теле Христа или об объединённой общине.
- source_word: διὰ τοῦ σταυροῦ
  choice: посредством креста
  rationale: Ясно передаёт инструментальное значение διά с родительным падежом.
- source_word: ἀποκτείνας τὴν ἔχθραν
  choice: убив … вражду
  rationale: Сохраняет сильную метафору греческого ἀποκτείνω и связь с крестной смертью, не ослабляя её до «устранив».
- source_word: ἐν αὐτῷ
  choice: им
  rationale: В основном тексте передано инструментально с ближайшим вероятным антецедентом «крест»; возможное локативное понимание отмечено в сноске.
theological_decisions:
- issue: Значение «одного тела»
  choice: Сохранён образ без поясняющей подстановки «Церковь» или «тело Христа».
  alternative: «в единой Церкви» / «в Своём теле»
  rationale: Греческий текст допускает богословски насыщенное прочтение образа, но сам не содержит такого уточнения; его следует оставить читателю и контексту.
- issue: Значение ἐν αὐτῷ
  choice: «им», то есть посредством креста
  alternative: «на нём», то есть на кресте
  rationale: Инструментальное понимание хорошо согласуется с непосредственно предшествующим «посредством креста» и с аудированной английской формулировкой, однако греческий предлог ἐν допускает также локативный оттенок, поэтому альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной, но понятной библейской образности. Порядок слов слегка перестроен ради естественного русского синтаксиса; фрагмент намеренно начинается со строчной буквы и союзного продолжения, поскольку стих зависит от предыдущего предложения.
