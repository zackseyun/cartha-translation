  variant: modern literary Russian
source:
  edition: SBLGNT
  text: νυνὶ δὲ ἐν Χριστῷ Ἰησοῦ ὑμεῖς οἵ ποτε ὄντες μακρὰν ⸂ἐγενήθητε ἐγγὺς⸃ ἐν τῷ αἵματι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/013.yaml
  text: But now in Messiah Jesus[d][c][b][a], you who once were far away have become near by the blood of the Messiah.
translation:
  language: ru
  text: Но теперь в Мессии[d] Иисусе вы, некогда бывшие далеко[a], стали близки[b] кровью[c] Мессии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «находившиеся далеко».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «были приближены».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «через кровь»; буквально возможно также: «в крови».'
    reason: lexical_alternative
  - marker: d
    text: Греч. «Христос»; здесь переведено как «Мессия», поскольку Χριστός употреблено как титул.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Но теперь
  rationale: Передаёт и временное противопоставление нынешнего положения прежнему, и связующую противительную силу δέ.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  rationale: Предлог «в» сохраняет характерный для Павла язык пребывания и сопричастности; Χριστός передан как титул «Мессия», а порядок компонентов сохранён.
- source_word: ὑμεῖς οἵ ποτε ὄντες
  choice: вы, некогда бывшие
  rationale: Естественно передаёт обращение к читателям и их прежнее состояние, обозначенное ποτε и причастием ὄντες.
- source_word: μακρὰν
  choice: далеко
  rationale: Сохраняет наречное обозначение удалённости без добавления не названного в стихе объекта; выражение допускает пространственный и образно-религиозный смысл.
- source_word: ἐγενήθητε ἐγγὺς
  choice: стали близки
  rationale: Прямо передаёт значение γίνομαι — переход в новое состояние — и не вводит явно действующее лицо, которого греческая форма сама по себе не называет.
- source_word: ἐν τῷ αἵματι
  choice: кровью
  rationale: 'Русский творительный падеж естественно выражает вероятное инструментальное значение ἐν: кровь представлена как средство приближения.'
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь сохраняет титулярное значение и потому переведён, а не просто транслитерирован как «Христос».
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Перевод титула раскрывает его значение для современного читателя и сохраняет мессианское содержание, не превращая его в личное имя.
- issue: Залог и подразумеваемое действие в ἐγενήθητε ἐγγὺς
  choice: стали близки
  alternative: были приближены
  rationale: Форма ἐγενήθητε прежде всего обозначает наступление состояния; выбранный вариант не делает подразумеваемое Божье действие грамматически явным и тем самым сохраняет неоднозначность.
- issue: Значение ἐν τῷ αἵματι τοῦ Χριστοῦ
  choice: 'инструментальное: «кровью Мессии»'
  alternative: 'сфера или посредство: «в крови Мессии» / «через кровь Мессии»'
  rationale: Контекст указывает на средство, благодаря которому далёкие стали близкими, однако перевод не развивает это утверждение в какую-либо конкретную теорию искупления.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка краткая и сохраняет параллель «далеко — близки», титулярное значение Χριστός и неоднозначность греческой конструкции.
