id: EPH.1.3
reference: Ephesians 1:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ εὐλογήσας ἡμᾶς ἐν πάσῃ εὐλογίᾳ πνευματικῇ ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who has blessed us with every spiritual blessing in the heavenly realms in Messiah[c][b],
translation:
  language: ru
  text: Благословен Бог и Отец нашего Господа Иисуса Мессии[a], благословивший нас всяким духовным[b] благословением на небесах[c] в Мессии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционный перевод: «Иисуса Христа»; ниже — «во Христе». Греческое Χριστός означает «Мессия», то есть «Помазанник».'
    reason: alternative_reading
  - marker: b
    text: 'Возможно также: «всяким благословением Духа». Греческое прилагательное может означать как «духовный» в широком смысле, так и «относящийся к Духу».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в небесной сфере»; буквально выражение имеет форму «в небесных».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Благословен
  rationale: Предикативное прилагательное выражает хвалу Богу; краткая форма естественно передаёт торжественную формулу благословения.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: Бог и Отец
  rationale: Артикль относится к сочетанию двух однородных существительных; сохранены оба наименования без поясняющего парафраза.
- source_word: τοῦ κυρίου ἡμῶν
  choice: нашего Господа
  rationale: κύριος передано традиционным и содержательно точным титулом «Господь»; порядок слов соответствует современному литературному русскому.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Ἰησοῦ передано как имя, а Χριστός — как значимый титул «Мессия», а не как утратившая значение часть имени.
- source_word: ὁ εὐλογήσας
  choice: благословивший
  rationale: Аористное причастие обозначает совершённое Божье действие и сохраняет формальную связь с начальным «Благословен».
- source_word: ἐν πάσῃ εὐλογίᾳ πνευματικῇ
  choice: всяким духовным благословением
  rationale: После глагола «благословить» русский творительный естественно передаёт содержание дарованного благословения; «всяким» сохраняет значение полноты πάσῃ.
- source_word: πνευματικῇ
  choice: духовным
  rationale: 'Так сохраняется широта греческого прилагательного: оно может описывать духовный характер благословения или его связь с Духом.'
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: на небесах
  rationale: Естественное русское обозначение небесной сферы; не вводит излишне конкретного представления о физических местах.
- source_word: ἐν Χριστῷ
  choice: в Мессии
  rationale: Сохранена краткая и богословски насыщенная формула Павла, выражающая пребывание и участие «в» Мессии; предлог не истолкован парафразом.
theological_decisions:
- issue: Передача Χριστός в формулах Павла
  choice: Мессия в обоих случаях
  alternative: Христос; Иисус Христос; во Христе
  rationale: Χριστός сохраняет смысл титула. «Мессия» делает этот смысл явным, не меняя христологического содержания; традиционный вариант указан в примечании.
- issue: Значение πνευματικῇ
  choice: духовным
  alternative: данным Духом; благословением Духа
  rationale: Греческое прилагательное допускает как более широкое значение, так и непосредственную связь со Святым Духом. Основной текст не снимает эту неоднозначность, а более узкое прочтение отмечено в сноске.
- issue: Смысл ἐν Χριστῷ
  choice: в Мессии
  alternative: через Мессию; благодаря Мессии
  rationale: Буквальная предложная формула сохраняет характерный для Павла язык сопричастности Мессии и не сводит его к одной лишь посреднической или причинной связи.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским регистром. Синтаксический параллелизм «Благословен — благословивший — благословением» намеренно сохранён. Формула «в Мессии» несколько непривычна, однако удерживает компактность и богословскую напряжённость греческого выражения.
