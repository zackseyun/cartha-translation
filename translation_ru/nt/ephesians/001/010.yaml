id: EPH.1.10
reference: Ephesians 1:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰς οἰκονομίαν τοῦ πληρώματος τῶν καιρῶν, ἀνακεφαλαιώσασθαι τὰ πάντα ἐν τῷ Χριστῷ, τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς· ἐν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/010.yaml
  text: for the administration of the fullness of the times[a], to sum up all things in the Messiah—the things in the heavens and the things on the earth—in him,
translation:
  language: ru
  text: для устроения полноты времён, чтобы соединить всё в Мессии — и то, что на небесах, и то, что на земле, — в Нём.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκονομίαν
  choice: устроения
  rationale: Слово передаёт упорядоченное осуществление Божьего замысла; «устроение» сохраняет оттенки управления и установленного порядка, не сводя значение лишь к «плану».
- source_word: πληρώματος τῶν καιρῶν
  choice: полноты времён
  rationale: Буквально и весомо передаёт наступление полной меры назначенных периодов, не сужая смысл до одной конечной точки.
- source_word: ἀνακεφαλαιώσασθαι
  choice: соединить
  rationale: В данном космическом контексте естественно передаёт сведение всего воедино; возможный оттенок подведения итога или объединения под одной главой сохранён в примечании.
- source_word: τὰ πάντα
  choice: всё
  rationale: Передаёт всеохватность субстантивированного среднего множественного числа и естественно звучит по-русски.
- source_word: ἐν τῷ Χριστῷ
  choice: в Мессии
  rationale: Здесь Χριστός сохраняет титульное значение; «Мессия» делает его смысл явным.
- source_word: τὰ ἐπὶ τοῖς οὐρανοῖς
  choice: то, что на небесах
  rationale: Сохраняет греческое множественное число и обозначение небесной сферы.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: то, что на земле
  rationale: Прямо передаёт местное значение и параллелизм с небесами.
- source_word: ἐν αὐτῷ
  choice: в Нём
  rationale: Повторяет греческое выражение и его акцент, относя местоимение к Мессии без добавления отсутствующей в тексте исключительности.
theological_decisions:
- issue: Передача Χριστῷ
  choice: в Мессии
  alternative: во Христе
  rationale: В контексте слово функционирует как титул, поэтому «Мессия» непосредственно передаёт его значение.
- issue: Смысл ἀνακεφαλαιώσασθαι
  choice: соединить всё
  alternative: подвести итог всему; объединить всё под одной главой
  rationale: Глагол допускает как идею сведения воедино или подведения итога, так и возможный оттенок объединения под главой. Основной текст остаётся естественным, а семантическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Тире проясняют целевую связь инфинитива и обособляют космическое перечисление; формула «полнота времён» сохранена как содержательно насыщенная и понятная библейская речь.
