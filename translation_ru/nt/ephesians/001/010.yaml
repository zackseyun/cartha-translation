  source_fidelity: 'Основной смысл передан верно: οἰκονομία — «устроение», «полнота времён», всеохватное «всё», космический параллелизм и намеренно повторённое «в Мессии / в Нём» сохранены. Однако двоеточие после «в Мессии» неверно оформляет греческое перечисление и разрывает его синтаксическую связь с «в Нём».'
