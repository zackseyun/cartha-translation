  text: who is the down payment of our inheritance, toward the redemption of the possession, to the praise of his glory.
translation:
  language: ru
  text: Он — залог нашего наследия, ведущий к искуплению достояния, ради прославления Его славы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он — залог нашего наследия для искупления достояния, ради прославления Его славы». Греческое слово, переведённое как «достояние», может означать принадлежащий Богу народ, приобретённое владение или получение владения; точное значение в этом месте спорно.'
    reason: Сноска отмечает лексико-синтаксическую неоднозначность περιποίησις и направленное значение εἰς, не навязывая одного толкования.
lexical_decisions:
- source_word: ἀρραβών
  choice: залог
  rationale: Обозначает первоначальную гарантирующую часть будущего полного получения; «залог» естественно и достойно передаёт образ, не сводя его к современной денежной предоплате.
- source_word: κληρονομία
  choice: наследие
  rationale: Сохраняет библейский образ обещанного удела, который верующие получат от Бога.
- source_word: ἀπολύτρωσις
  choice: искупление
  rationale: Передаёт освобождение ценой выкупа и сохраняет богословскую насыщенность термина.
- source_word: περιποίησις
  choice: Божье достояние
  rationale: В данном контексте наиболее вероятно обозначает народ, принадлежащий Богу; добавление «Божье» делает подразумеваемую принадлежность ясной по-русски, но неоднозначность отмечена в сноске.
- source_word: ἔπαινος τῆς δόξης αὐτοῦ
  choice: во славу Его величия
  rationale: Естественно выражает цель — чтобы Божье славное величие было прославлено; буквальная конструкция «в похвалу славы Его» по-русски тяжеловесна.
theological_decisions:
- issue: Референт относительного местоимения ὅ
  choice: «Он», то есть Святой Дух из предыдущего стиха
  alternative: «это», относящееся к запечатлению или дару Духа
  rationale: Средний род ὅ согласуется с πνεῦμα («Дух») в греческом; личное «Он» естественно в русском и соответствует непосредственному контексту, не отрицая грамматической формы оригинала.
- issue: Значение εἰς перед ἀπολύτρωσιν
  choice: «до искупления»
  alternative: «для искупления» / «к искуплению»
  rationale: Фраза указывает вперёд, к окончательному искуплению, гарантией которого служит Дух. «До» ясно передаёт временно-целевую направленность, хотя греческое εἰς шире.
- issue: Кого или что обозначает τῆς περιποιήσεως
  choice: народ как Божье достояние
  alternative: приобретённое владение или само вступление во владение наследием
  rationale: Генитив допускает несколько толкований. Контекст принадлежности Богу и библейское употребление поддерживают значение «Божье достояние», но вариант не следует скрывать.
- issue: «Наше наследие» и «Божье достояние»
  choice: сохранить различие образов
  alternative: истолковать обе фразы как одно и то же наследство верующих
  rationale: Текст одновременно говорит о наследии верующих и о принадлежащем Богу достоянии; перевод не должен преждевременно устранять это богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Стих продолжает длинное предложение предыдущих стихов; начальное «Он» восстанавливает референт для самостоятельного цитирования. Прописные буквы в «Он/Его» употреблены как традиционное благоговейное оформление местоимений о Боге, без добавления конфессиональной терминологии.
