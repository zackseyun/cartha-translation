  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: ru
  text: Благодать вам и мир от Бога, нашего Отца, и Господа Иисуса, Мессии[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господа Иисуса Христа». Греческое Χριστός может выступать как титул «Мессия», а в некоторых контекстах — как форма, близкая к имени: «Христос».'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: благодать
  rationale: Сохраняет как смысл приветствия и благоволения, так и богословскую насыщенность слова в посланиях Павла.
- source_word: ὑμῖν
  choice: вам
  rationale: Естественная русская передача дательного адресата в приветствии и благословении.
- source_word: εἰρήνη
  choice: мир
  rationale: Передаёт обычный смысл слова и возможный отголосок еврейского приветствия «шалом».
- source_word: ἀπὸ
  choice: от
  rationale: Точно обозначает источник благодати и мира.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Бога, нашего Отца
  rationale: Приложение «нашего Отца» естественно раскрывает, кем является Бог, не добавляя отсутствующего в греческом союза.
- source_word: κυρίου
  choice: Господа
  rationale: Сохраняет титульное и христологическое значение κύριος в данном контексте.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса, Мессии
  rationale: Передаёт Χριστός как осмысленный титул «Мессия», а не только как традиционную, ставшую почти именной форму «Христос»; запятая помогает современному русскому читателю распознать приложение-титул.
theological_decisions:
- issue: Передача Χριστοῦ в сочетании Ἰησοῦ Χριστοῦ
  choice: Иисуса, Мессии
  alternative: Иисуса Христа
  rationale: Греческое Χριστός может быть титулом («Мессия») либо употребляться как часть устойчивого именования («Христос»). Основной текст делает титульный смысл прозрачным, а традиционная передача дана в примечании, чтобы сохранить реальную неоднозначность употребления.
translation_notes:
  register: Современный литературный русский язык с традиционно-библейской торжественностью. Порядок компонентов близок к греческому, но «нашего Отца» поставлено в естественную для русского языка позицию. Избыточное английское примечание [b], дословно повторяющее основной вариант, не перенесено, поскольку не представляет отдельного чтения.
