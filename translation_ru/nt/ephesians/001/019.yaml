  text: and what is the surpassing greatness of his power toward us who believe[a], according to the working of the might of his strength
translation:
  language: ru
  text: и каково превосходящее величие Его могущества, обращённого к нам, верующим,[a] согласно действию мощи Его силы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более истолковательно: «действующего в нас, верующих». Буквально греческий текст говорит о могуществе, обращённом «к нам».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπερβάλλον
  choice: превосходящее всё
  rationale: Причастие употреблено как определение к «величию» и выражает превосходящую степень, не усиливая смысл до буквальной неизмеримости.
- source_word: μέγεθος
  choice: величие
  rationale: Естественно передаёт отвлечённое существительное и сохраняет конструкцию «превосходящее всё величие».
- source_word: δύναμις
  choice: могущество
  rationale: Передаёт действенную способность и позволяет отличить этот термин от κράτος и ἰσχύς в последующем нагнетании близких по смыслу слов.
- source_word: εἰς ἡμᾶς
  choice: направленного к нам
  rationale: Сохраняет направительное значение εἰς и не уточняет без достаточных оснований, действует ли Божье могущество внутри верующих или проявляется ради них.
- source_word: τοὺς πιστεύοντας
  choice: верующим
  rationale: Естественная русская субстантивированная форма причастия настоящего времени; обозначает тех, кто верит.
- source_word: κατά
  choice: по
  rationale: 'Кратко и естественно выражает соответствие: могущество направлено к верующим сообразно описываемому далее Божьему действию.'
- source_word: ἐνέργεια
  choice: действие
  rationale: Передаёт активную, действенную работу, избегая современных посторонних оттенков слова «энергия».
- source_word: κράτος
  choice: мощь
  rationale: Обозначает проявленную силу и сохраняет отдельный элемент в риторическом ряду близких понятий.
- source_word: ἰσχύς
  choice: сила
  rationale: Естественно передаёт присущую силу и остаётся отличимым от κράτος, переведённого как «мощь».
- source_word: καὶ τί
  choice: и каково
  rationale: Продолжает синтаксис молитвы из предыдущего стиха; «каково» естественно согласуется с «величием» и передаёт подразумеваемую связку.
theological_decisions:
- issue: Передача ряда δύναμις / ἐνέργεια / κράτος / ἰσχύς
  choice: 'Сохранить нагнетание различимыми словами: «могущество… действие… мощь… сила».'
  alternative: Сгладить ряд как «действие Его могучей силы» или объединить понятия.
  rationale: Накопление близких слов подчёркивает величие и действенность Божьего могущества; его не следует превращать ни в одно обобщённое выражение, ни в жёсткую богословскую классификацию.
- issue: Направленность Божьего могущества в εἰς ἡμᾶς
  choice: «направленного к нам, верующим»
  alternative: «действующего в нас, верующих» или «явленного ради нас, верующих»
  rationale: Предлог εἰς указывает прежде всего направление к верующим. Такой перевод сохраняет неоднозначность между внутренним действием и благотворным действием ради них.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Несколько необычная цепочка «действие мощи Его силы» сохранена ради намеренного риторического нагнетания исходного текста.
