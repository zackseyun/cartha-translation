  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ τοῖς ἁγίοις τοῖς οὖσιν ⸂[ἐν Ἐφέσῳ]⸃ καὶ πιστοῖς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God[c][b], to the saints who are [in Ephesus] and faithful in Messiah Jesus:'
translation:
  language: ru
  text: 'Павел, апостол Мессии Иисуса по воле Бога, — святым, пребывающим [в Эфесе][a], и верным в Мессии Иисусе[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых важных ранних рукописях слова «в Эфесе» отсутствуют. Поэтому возможно, что послание предназначалось для более широкого круга общин, а не только для эфесской церкви.
    reason: textual_variant
  - marker: b
    text: 'Или: «верующим в Мессию Иисуса».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: апостол
  rationale: В данном приветствии это устойчивое обозначение особого посланнического служения Павла; «апостол» точно и естественно передаёт термин.
- source_word: Χριστοῦ Ἰησοῦ / ἐν Χριστῷ Ἰησοῦ
  choice: Мессии Иисуса / в Мессии Иисусе
  rationale: Χριστός здесь сохраняет значение титула; «Мессия» передаёт его прозрачнее, чем ставшее именеподобным «Христос».
- source_word: διὰ θελήματος θεοῦ
  choice: по воле Бога
  rationale: Естественная русская формула, передающая основание и божественное уполномочивание апостольства Павла.
- source_word: τοῖς ἁγίοις
  choice: святым
  rationale: Обычное у Павла обозначение посвящённого Богу народа; русское «святым» сохраняет и краткость, и общинный смысл.
- source_word: τοῖς οὖσιν
  choice: находящимся
  rationale: В сочетании с указанием места причастие εἰμί естественно передаётся как «находящимся».
- source_word: '[ἐν Ἐφέσῳ]'
  choice: '[в Эфесе]'
  rationale: Квадратные скобки сохраняют отмеченную в исходном тексте текстологическую неуверенность.
- source_word: πιστοῖς
  choice: верным
  rationale: Сохраняет возможный смысл верности и не сводит неоднозначное прилагательное лишь к обозначению «верующие».
theological_decisions:
- issue: Передача Χριστός в приветствии Павла
  choice: Мессия
  alternative: Христос
  rationale: В обеих конструкциях слово сохраняет титульную силу; перевод «Мессия» делает этот смысл явным.
- issue: Наличие слов ἐν Ἐφέσῳ
  choice: Сохранить «[в Эфесе]» в квадратных скобках
  alternative: Опустить эти слова
  rationale: Важный ранний разночтение нельзя молча разрешать; скобки показывают неуверенность текста.
- issue: Значение πιστοῖς
  choice: верным
  alternative: верующим
  rationale: Греческое слово допускает оба значения. Основной текст сохраняет качественный оттенок верности, а альтернативное понимание указано в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского приветствия. Синтаксис слегка формален, но понятен; тире естественно отделяет представление отправителя от адресатов. Текстологическая неопределённость отмечена квадратными скобками и пояснена в примечании.
