lexical_decisions:
- source_word: πάντα
  choice: всё / над всем
  rationale: Средний род множественного числа охватывает всю совокупность сущего; русское «всё» естественно передаёт этот всеобщий масштаб.
- source_word: ὑπέταξεν
  choice: покорил
  rationale: Глагол означает привести в подчинение. «Покорил» кратко и естественно передаёт активное установление подчинённого положения.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: под ноги Его
  rationale: Сохранён буквальный образ господства и покорения, перекликающийся с Псалмом 8:7 по русской нумерации.
- source_word: αὐτὸν ἔδωκεν
  choice: дал Его
  rationale: Сохранено прямое значение δίδωμι — «дать», а не истолковывающее «поставить» или «назначить».
- source_word: κεφαλὴν
  choice: как Главу
  rationale: Оборот с «как» естественно оформляет в русском языке предикативное дополнение и сохраняет метафору главы.
- source_word: ὑπὲρ πάντα
  choice: над всем
  rationale: В данном контексте ὑπέρ выражает превосходство и власть; «над всем» сохраняет универсальный охват.
- source_word: τῇ ἐκκλησίᾳ
  choice: церкви
  rationale: Дательный падеж естественно передаёт церковь как получателя дара, не исключая оттенка пользы, отмеченного в сноске.
theological_decisions:
- issue: Отношение главенства Христа ко всему и к церкви
  choice: Христос дан церкви как Тот, Кто является Главой над всем.
  alternative: Христос поставлен Главой над всем ради блага церкви.
  rationale: Синтаксис естественно связывает «Главу» с «над всем», а дательный τῇ ἐκκλησίᾳ допускает понимание церкви как получателя или выгодоприобретателя. Основной текст и сноска сохраняют оба оттенка.
- issue: Референты местоимений
  choice: Первое «Он» относится к Богу, а «Его» — к Христу; прописные буквы помогают различить участников.
  alternative: Передать местоимения строчными буквами, оставив их референты только контексту.
  rationale: Контекст стихов 20–21 устанавливает референты; прописные буквы соответствуют распространённой русской библейской норме и повышают ясность, не добавляя нового содержания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Сохранены образ «под ноги», метафора Главы и глагол «дал»; синтаксис слегка упорядочен ради естественности русского предложения. «Церковь» употреблено в обычном новозаветном значении сообщества верующих.
