  text: Διὰ τοῦτο κἀγώ, ἀκούσας τὴν καθ’ ὑμᾶς πίστιν ἐν τῷ κυρίῳ Ἰησοῦ καὶ τὴν ⸂ἀγάπην τὴν⸃ εἰς πάντας τοὺς ἁγίους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/015.yaml
  text: For this reason[a], I also, having heard of your faith in the Lord Jesus and your love for all the saints[b],
translation:
  language: ru
  text: Поэтому и я, услышав о вашей вере[a] в Господа Иисуса и о вашей любви ко всем святым[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о вашем доверии»; греческое слово πίστις в некоторых контекстах может также означать «верность».'
    reason: lexical_alternative
  - marker: b
    text: В некоторых древних рукописях слова «о вашей любви» отсутствуют; тогда фразу можно понять как «услышав о вашей вере в Господа Иисуса и о вашем отношении ко всем святым».
    reason: textual_variant
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Поэтому
  rationale: Выражение указывает на предшествующее благословение и вводит основанный на нём отклик Павла; «поэтому» естественно передаёт причинно-следственную связь.
- source_word: κἀγώ
  choice: и я
  rationale: 'Слияние καί и ἐγώ имеет присоединительное значение: Павел включает и себя в описываемый отклик, не придавая местоимению чрезмерного усиления.'
- source_word: ἀκούσας
  choice: услышав
  rationale: Деепричастие сохраняет зависимую форму греческого аористного причастия и выражает действие, предшествующее дальнейшему сообщению Павла.
- source_word: τὴν καθ’ ὑμᾶς πίστιν
  choice: о вашей вере
  rationale: Оборот κατά с ὑμᾶς обозначает веру, присущую адресатам; «ваша вера» звучит естественно и точно.
- source_word: πίστιν
  choice: вере
  rationale: В данном сочетании с ἐν τῷ κυρίῳ Ἰησοῦ существительное прежде всего обозначает веру или доверие, направленное на Господа Иисуса; основным выбран традиционный и современно понятный эквивалент «вера».
- source_word: ἐν τῷ κυρίῳ Ἰησοῦ
  choice: в Господа Иисуса
  rationale: Русское управление «вера в кого» естественно передаёт смысл греческого ἐν в данном сочетании, хотя формально возможна более буквальная конструкция «в Господе Иисусе».
- source_word: κυρίῳ
  choice: Господа
  rationale: «Господь» сохраняет весомый христологический титул κύριος.
- source_word: ἀγάπην
  choice: любви
  rationale: «Любовь» является прямым, современным и стилистически уместным соответствием ἀγάπη.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: ко всем святым
  rationale: Предлог εἰς обозначает направленность любви; русское «любовь ко всем» передаёт её непосредственно. «Святые» сохраняет обычное для Павла обозначение верующих.
- source_word: ἁγίους
  choice: святым
  rationale: Слово передано устоявшимся библейским обозначением всех принадлежащих Богу людей, а не особой позднейшей категории канонизированных лиц.
theological_decisions:
- issue: Значение πίστις в выражении о связи адресатов с Господом Иисусом
  choice: вера
  alternative: доверие; верность
  rationale: Контекст с Господом Иисусом как объектом веры лучше всего поддерживает значение «вера/доверие». Возможный оттенок верности не исключён, но не выдвинут в основной текст как единственный смысл.
- issue: Передача κύριος как титула Иисуса
  choice: Господь
  alternative: Владыка; Господин
  rationale: «Господь» сохраняет традиционное и богословски значимое титульное употребление, не ослабляя его до обычного обращения.
- issue: Кого обозначают οἱ ἅγιοι
  choice: святые
  alternative: святые люди; Божий святой народ
  rationale: В контексте Павла это обозначение всех верующих, освящённых принадлежностью Богу; перевод не должен внушать, будто речь только о позднее канонизированных людях.
translation_notes:
  register: 'Современный литературный русский язык с достоинством апостольского послания. Сохранена незавершённость синтаксиса стиха: фраза оканчивается запятой и продолжается в следующем стихе. Деепричастный оборот передаёт греческую причастную конструкцию без излишнего дробления предложения.'
