    text: 'Буквально: «Святым Духом обещания». Возможный смысл: Святым Духом, Которого Бог обещал; выражение также подчёркивает Его связь с обещанием.'
    reason: Сохраняет формальную генитивную конструкцию τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ и не сужает её смысловой диапазон.
  - marker: b
    text: 'Буквально: «в Нём и уверовав».'
    reason: Отмечает, что второе ἐν ᾧ может сохранять рамку «в Нём», а не только прямо управляться русским «уверовав в Него».
lexical_decisions:
- source_word: ἐν ᾧ
  choice: В Нём / в Него
  rationale: Относительное выражение отсылает ко Христу; при сказуемом «уверовав» русский язык естественно требует управления «в Него», тогда как начальное «В Нём» сохраняет смысл пребывания и единения со Христом.
- source_word: καὶ ὑμεῖς
  choice: и вы
  rationale: Сохраняет добавочное значение καί и противопоставление предыдущему «мы» в контексте.
- source_word: ἀκούσαντες
  choice: услышав
  rationale: Деепричастие естественно передаёт предшествующее или тесно связанное с главным действием действие, не превращая последовательность в жёсткую богословскую схему.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: слово истины
  rationale: Близко передаёт λόγος и сохраняет узнаваемое павловское выражение; поясняющее приложение далее раскрывает его смысл.
- source_word: τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν
  choice: Благую весть о вашем спасении
  rationale: «Благая весть» доступно передаёт εὐαγγέλιον, а «о вашем спасении» естественно выражает содержание вести без исключения возможного оттенка результата.
- source_word: πιστεύσαντες
  choice: уверовав
  rationale: Деепричастная форма параллельна «услышав» и сохраняет аспектуально-временную связь с «были запечатлены», не уточняя её сверх текста.
- source_word: ἐσφραγίσθητε
  choice: были запечатлены
  rationale: Сохраняет пассивную форму и метафору печати — принадлежности, удостоверения и защиты.
- source_word: τῷ πνεύματι
  choice: Святым Духом
  rationale: Творительный падеж естественно допускает инструментальный и сопроводительный оттенки греческого дательного, не вынуждая выбирать между ними.
- source_word: τῆς ἐπαγγελίας τῷ ἁγίῳ
  choice: обещанным Святым Духом
  rationale: Естественно по-русски передаёт сжатое определение «Дух обещания» как Духа, обещанного Богом; более формальная конструкция отмечена в сноске.
theological_decisions:
- issue: Связь слышания, веры и запечатления
  choice: «услышав… и уверовав… были запечатлены»
  alternative: «когда услышали… и поверили… были запечатлены» или «после того как услышали… и уверовали…»
  rationale: Греческие аористные причастия стоят перед личным глаголом и допускают предшествование либо тесную сопутствующую связь. Русские деепричастия сохраняют эту связь, не утверждая конфессионально заданную хронологию получения Духа.
- issue: Отнесение второго ἐν ᾧ
  choice: «уверовав в Него»
  alternative: «в Нём… уверовав»
  rationale: Синтаксически ἐν ᾧ может продолжать тему пребывания во Христе, но в русском выражение «веровать в Него» является естественным и соответствует возможному присоединению оборота к πιστεύσαντες. Начальное «В Нём» сохраняет павловскую тему единения со Христом.
- issue: Значение «Дух обещания»
  choice: «обещанный Святой Дух»
  alternative: «Святой Дух обещания»
  rationale: Генитивная конструкция сжата и может указывать на Духа, Которого Бог обещал, либо на Его связь с обещанием. Основной текст передаёт наиболее естественное контекстуальное понимание, а формальная альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Синтаксис упрощён без устранения павловской протяжённости мысли; тире выделяет поясняющее приложение. «Благая весть» написана с прописной буквы как обозначение евангельской вести, а местоимения о Христе и Духе — по принятой русской библейской издательской традиции.
