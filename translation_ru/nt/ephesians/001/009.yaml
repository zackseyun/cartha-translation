  source_fidelity: 'Основной текст должен не разрешать спорный референт ἐν αὐτῷ возвратным «в Себе»: в греческом стоит обычное αὐτῷ, а не недвусмысленно возвратное ἑαυτῷ. При возможности альтернативного возвратного понимания буквальное русское «в Нём» лучше сохраняет форму и открытость исходного выражения. «Открыв нам тайну Своей воли» точно передаёт γνωρίσας ἡμῖν τὸ μυστήριον τοῦ θελήματος αὐτοῦ; деепричастная конструкция уместна как зависимый фрагмент периода.'
  naturalness: Текст литературен и естественен. «Замыслил» возможно, но в современном русском иногда имеет оттенок тайного или недоброго умысла; «задумал» нейтральнее и хорошо передаёт προέθετο в контексте намерения. «По Своему благоволению» сохраняет возвышенный, но понятный библейский регистр.
  terminology: «Тайна», «воля» и «благоволение» удачно сохраняют устойчивую библейскую терминологию без излишней конфессиональной интерпретации. Местоимение «в Нём» следует оставить в основном тексте, а возвратное «в Себе» вынести в примечание; не следует утверждать в примечании, что «в Нём» означает именно Христа, поскольку это уже интерпретация референта.
