  text: γνωρίσας ἡμῖν τὸ μυστήριον τοῦ θελήματος αὐτοῦ, κατὰ τὴν εὐδοκίαν αὐτοῦ ἣν προέθετο ἐν αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/009.yaml
  text: having made known to us the mystery of his will[a], according to his good pleasure, which he purposed in himself
translation:
  language: ru
  text: открыв нам тайну Своей воли по Своему благоволению, которое Он задумал в Нём[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Себе». Греческое «в нём» может относиться к Богу возвратно либо к иному референту, который в контексте нередко понимают как Христа.'
    reason: Сохраняет спорную неоднозначность референта ἐν αὐτῷ, не разрешая её в основном тексте и не навязывая конкретное толкование.
lexical_decisions:
- source_word: γνωρίσας
  choice: открыв
  rationale: Аористное действительное причастие обозначает действие Бога, связанное с окружающим предложением. Русское деепричастие естественно передаёт эту зависимость; «открыв» здесь означает «сделав известной».
- source_word: ἡμῖν
  choice: нам
  rationale: Дательный падеж обозначает адресатов откровения.
- source_word: τὸ μυστήριον
  choice: тайну
  rationale: В контексте Павла это прежде сокрытый, но теперь открытый Божий замысел; «тайна» сохраняет этот смысл и традиционную библейскую лексику.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: Своей воли
  rationale: Родительный оборот передан прямо; возвратное «Своей» естественно указывает на Бога как действующее лицо.
- source_word: κατὰ τὴν εὐδοκίαν αὐτοῦ
  choice: по Своему благоволению
  rationale: κατά выражает соответствие или основание, а «благоволение» сохраняет личный и благой характер Божьего намерения.
- source_word: ἣν προέθετο
  choice: которое Он замыслил
  rationale: Относительное местоимение женского рода относится к εὐδοκίαν. В русском оно согласуется со словом среднего рода «благоволение». «Замыслил» естественно передаёт значение намерения προτίθεμαι в данном контексте.
- source_word: ἐν αὐτῷ
  choice: в Себе
  rationale: Форма допускает понимание αὐτῷ как относящегося к Богу и имеющего возвратный смысл. Это вероятное прочтение вынесено в основной текст, а возможная отсылка ко Христу сохранена в примечании.
theological_decisions:
- issue: К кому относится ἐν αὐτῷ
  choice: «в Себе» — возвратное указание на Бога
  alternative: «в Нём», то есть во Христе
  rationale: 'Греческое местоимение формально допускает оба понимания. Русский язык не позволяет естественно сохранить ту же неоднозначность: «в Себе» выражает возвратное прочтение, тогда как «в Нём» требует иного референта. Поэтому вероятное возвратное прочтение дано в тексте, а христологическое — в примечании.'
translation_notes:
  register: Современный литературный русский с достоинством библейского стиля. Форма представляет собой зависимый фрагмент длинного предложения Еф. 1:3–14; деепричастие «открыв» сохраняет эту синтаксическую связь. Заглавные буквы в местоимениях употреблены по принятой русской библейской издательской традиции.
