  text: πεφωτισμένους τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν εἰς τὸ εἰδέναι ὑμᾶς τίς ἐστιν ἡ ἐλπὶς τῆς κλήσεως αὐτοῦ, ⸀τίς ὁ πλοῦτος τῆς δόξης τῆς κληρονομίας αὐτοῦ ἐν τοῖς ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/018.yaml
  text: having the eyes of your heart enlightened[a], so that you may know what is the hope of his calling, what is the wealth of the glory of his inheritance among the saints[b],
translation:
  language: ru
  text: чтобы очи вашего сердца были просвещены и чтобы вы знали, какова надежда Его призвания, каково богатство славы Его наследия среди святых[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его наследия в святых»; возможно также: «наследия, которое Он дарует святым».'
    reason: 'Альтернативы сохраняют неоднозначность выражений κληρονομίας αὐτοῦ и ἐν τοῖς ἁγίοις: наследие может пониматься как принадлежащее Богу либо даруемое Им, а ἐν — как «в» или «среди».'
lexical_decisions:
- source_word: πεφωτισμένους
  choice: были просвещены
  rationale: Совершенное пассивное причастие передано конструкцией, сохраняющей страдательный залог и состояние как результат совершившегося просвещения.
- source_word: τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν
  choice: очи вашего сердца
  rationale: Метафора оригинала сохранена; «очи» уместны в возвышенном библейском контексте и при этом понятны современному читателю.
- source_word: εἰς τὸ εἰδέναι ὑμᾶς
  choice: и вы узнали
  rationale: В сочетании с начальным «чтобы» естественно выражает цель просвещения, не перегружая русскую фразу повторным союзом.
- source_word: ἐλπὶς
  choice: надежда
  rationale: Передаёт обычное для Павла значение уверенного ожидания и сохраняет устойчивую богословскую лексику.
- source_word: κλήσεως αὐτοῦ
  choice: Его призвания
  rationale: Близко следует форме греческого родительного падежа и не разворачивает выражение в толкование.
- source_word: πλοῦτος
  choice: богатство
  rationale: Естественно передаёт идею изобилия и хорошо сочетается с «славой».
- source_word: δόξης
  choice: славы
  rationale: Сохраняет основное библейское и богословское значение слова δόξα.
- source_word: κληρονομίας αὐτοῦ
  choice: Его наследия
  rationale: Формулировка намеренно не уточняет, идёт ли речь о наследии, принадлежащем Богу, или о наследии, которое Он дарует.
- source_word: ἐν τοῖς ἁγίοις
  choice: среди святых
  rationale: Передаёт естественный корпоративный смысл ἐν и сохраняет обозначение «святые»; буквальное «в святых» приведено в примечании из-за смысловой значимости варианта.
theological_decisions:
- issue: Означает ли «Его наследие среди/в святых» Божье обладание Своим народом или наследие, даруемое верующим
  choice: Его наследия среди святых
  alternative: Его наследия в святых; наследия, которое Он дарует святым
  rationale: Греческие родительные формы и оборот с ἐν допускают несколько смысловых оттенков. Основной текст не разрешает эту богословскую неоднозначность, а примечание сохраняет более буквальную пространственно-внутреннюю формулировку.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Метафора «очи сердца» сохранена. Начальное «чтобы» отражает синтаксическую зависимость стиха от предшествующей молитвенной фразы; конечная запятая показывает продолжение предложения в следующем стихе.
