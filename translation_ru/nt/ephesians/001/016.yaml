lexical_decisions:
- source_word: οὐ παύομαι
  choice: не перестаю
  rationale: Настоящее время выражает продолжающееся действие; «не перестаю» точно передаёт значение и сохраняет достоинство павловской речи.
- source_word: εὐχαριστῶν
  choice: благодарить
  rationale: Причастие обозначает действие, одновременное с «не перестаю»; русский инфинитив после фазового глагола естественно передаёт эту конструкцию.
- source_word: ὑπὲρ ὑμῶν
  choice: за вас
  rationale: В контексте благодарения ὑπέρ с родительным указывает на людей, за которых возносится благодарность.
- source_word: μνείαν ποιούμενος
  choice: вспоминая вас
  rationale: Греческий оборот буквально означает «совершая упоминание»; «вспоминая вас» естественно передаёт его смысл по-русски, а подразумеваемое дополнение восстановлено из контекста.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: в моих молитвах
  rationale: Предложное сочетание обозначает обстоятельство или сферу, в которой Павел вспоминает адресатов; «в моих молитвах» звучит естественно и точно.
