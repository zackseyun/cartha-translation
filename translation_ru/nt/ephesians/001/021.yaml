  text: ὑπεράνω πάσης ἀρχῆς καὶ ἐξουσίας καὶ δυνάμεως καὶ κυριότητος καὶ παντὸς ὀνόματος ὀνομαζομένου οὐ μόνον ἐν τῷ αἰῶνι τούτῳ ἀλλὰ καὶ ἐν τῷ μέλλοντι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/021.yaml
  text: far above every rule and authority and power and dominion[a], and every name that is named[c][b], not only in this age but also in the one to come.
translation:
  language: ru
  text: превыше всякого начальства, и власти, и силы, и господства[a], и всякого имени, какое только может быть названо[b], не только в этом веке, но и в грядущем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякого правления, и власти, и силы, и владычества». Греческие слова могут обозначать виды или сферы власти, в том числе космические или духовные силы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всякого титула, который даётся». Буквально: «всякого именуемого имени».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεράνω
  choice: превыше
  rationale: Передаёт превосходство и возвышенное положение Христа; слово естественно для высокого, но понятного библейского регистра.
- source_word: πάσης ἀρχῆς
  choice: всякого начальства
  rationale: Сохраняет категориальный и достаточно широкий смысл ἀρχή, не уточняя, идёт ли речь исключительно о духовных или человеческих властях.
- source_word: ἐξουσίας
  choice: власти
  rationale: Передаёт право или сферу осуществления власти и остаётся отличимым от δύναμις.
- source_word: δυνάμεως
  choice: силы
  rationale: Естественный русский эквивалент, сохраняющий различие между силой и властью.
- source_word: κυριότητος
  choice: господства
  rationale: Передаёт положение или сферу господства, не превращая абстрактную категорию в конкретного «господина».
- source_word: παντὸς ὀνόματος ὀνομαζομένου
  choice: всякого имени, которым называют
  rationale: Сохраняет риторическое повторение корня «имя/называть» и широту выражения, которое может охватывать имя, звание или титул.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: не только ... но и
  rationale: Точно и естественно передаёт греческую соотносительную конструкцию.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: в этом веке
  rationale: Сохраняет временной и эсхатологический смысл αἰών, не подменяя его пространственным понятием «мир».
- source_word: ἐν τῷ μέλλοντι
  choice: в грядущем
  rationale: Передаёт эллипсис оригинала, где слово «век» подразумевается из предыдущей части, и звучит естественно по-русски.
theological_decisions:
- issue: Природа перечисленных начальств, властей, сил и господств
  choice: Оставить их широкими категориями власти без уточнения их человеческой, ангельской или космической природы.
  alternative: Прямо назвать их духовными силами или ангельскими чинами.
  rationale: Контекст допускает духовные или космические силы, однако сами греческие существительные не дают оснований ограничивать перечень только одной онтологической категорией.
- issue: Значение «имени» в выражении παντὸς ὀνόματος ὀνομαζομένου
  choice: Сохранить слово «имя» и глагол «называть».
  alternative: Передать как «всякого данного титула» или «всякого звания».
  rationale: «Имя» может включать титул, статус и именуемую власть; более узкий перевод снял бы намеренную широту выражения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Союз «и» сохранён перед каждым элементом перечня для передачи греческой риторической последовательности. Формулировка продолжает синтаксис предыдущего стиха, поэтому начинается со строчной буквы.
