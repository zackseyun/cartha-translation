  text: just as he chose us in him before the foundation of the world[a], to be holy and blameless before him in love[c][b],
translation:
  language: ru
  text: как он избрал нас в нём прежде основания мира, чтобы мы были святы и непорочны[b] перед ним в любви[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Слова «в любви» можно также отнести к следующему стиху: «В любви предопределив нас…»'
    reason: alternative_reading
  - marker: b
    text: 'Или: «без изъяна».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: так же как
  rationale: Сохраняет сравнительно-связующую функцию выражения по отношению к предшествующему благословению, не сводя её однозначно к причинному «потому что».
- source_word: ἐξελέξατο
  choice: избрал
  rationale: Точно и естественно передаёт совершённый Богом выбор; само по себе русское слово не уточняет позднейшие конфессиональные схемы предопределения.
- source_word: ἡμᾶς
  choice: нас
  rationale: Передаёт прямое дополнение при «избрал»; повторное ἡμᾶς в инфинитивном обороте естественно выражено подлежащим «мы» в придаточном цели.
- source_word: ἐν αὐτῷ
  choice: в нём
  rationale: Сохраняет краткий и богословски ёмкий оборот Павла, не разворачивая его толковательно в «в единении с ним».
- source_word: πρὸ καταβολῆς κόσμου
  choice: прежде основания мира
  rationale: Близко передаёт временной смысл и традиционный образ закладки основания мира, оставаясь понятным в современном литературном русском.
- source_word: εἶναι ἡμᾶς
  choice: чтобы мы были
  rationale: Естественно передаёт инфинитивный оборот цели или результата и сохраняет явно выраженное в греческом тексте «нас» через русское «мы».
- source_word: ἁγίους
  choice: святы
  rationale: Основной русский эквивалент сохраняет как нравственный, так и посвятительный смысл.
- source_word: ἀμώμους
  choice: непорочны
  rationale: Передаёт отсутствие вины или изъяна и сохраняет возможный культово-жертвенный оттенок; буквальная образность отмечена в сноске.
- source_word: κατενώπιον αὐτοῦ
  choice: перед ним
  rationale: Кратко сохраняет значение нахождения в Божьем присутствии и перед Его взглядом.
- source_word: ἐν ἀγάπῃ
  choice: в любви
  rationale: 'Сохраняет греческий порядок слов и не устраняет синтаксическую неоднозначность: оборот может относиться к предшествующим словам либо к следующему стиху.'
theological_decisions:
- issue: Возможное догматическое переосмысление глагола ἐξελέξατο
  choice: избрал нас
  alternative: выбрал нас
  rationale: «Избрал» точно передаёт божественный выбор и соответствует возвышенному регистру, но перевод не добавляет уточнений о способе или основаниях избрания, которых нет в данном стихе.
- issue: Синтаксическое присоединение ἐν ἀγάπῃ
  choice: сохранить «в любви» в конце стиха 4
  alternative: 'отнести к стиху 5: «В любви предопределив нас…»'
  rationale: Греческий текст допускает обе связи. Основной текст сохраняет исходное положение оборота, а сноска прямо сообщает об альтернативе, не разрешая спор догматически.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Местоимения, относящиеся к Богу и Христу, даны со строчной буквы в соответствии с обычной современной издательской практикой и без внесения отсутствующей в греческом тексте типографской маркировки. Запятая в конце показывает, что стих синтаксически продолжается.
