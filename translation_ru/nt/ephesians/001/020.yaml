lexical_decisions:
- source_word: ἣν ἐνήργηκεν
  choice: которую Он явил
  rationale: Относительное местоимение отсылает к силе в предыдущем контексте; «явил» естественно передаёт действенное проявление этой силы, выраженное глаголом ἐνεργέω.
- source_word: ἐν τῷ Χριστῷ
  choice: во Христе
  rationale: В русском библейском и литературном употреблении «Христос» сохраняет титульный смысл и здесь звучит естественнее, чем менее привычное «в Мессии».
- source_word: ἐγείρας αὐτὸν ἐκ νεκρῶν
  choice: воскресив Его из мёртвых
  rationale: Деепричастный оборот сохраняет связь аористного причастия с главным глаголом; «из мёртвых» точно передаёт ἐκ νεκρῶν.
- source_word: καθίσας ἐν δεξιᾷ αὐτοῦ
  choice: посадив по правую руку от Себя
  rationale: Передаёт действие Бога и идиому почётного места и власти; возвратное «Себя» ясно соотносится с подлежащим.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: на небесах
  rationale: Субстантивированное прилагательное обозначает небесную сферу; «на небесах» — ясное и естественное современное русское выражение.
theological_decisions:
- issue: Титульный характер Χριστῷ
  choice: во Христе
  alternative: в Мессии
  rationale: «Христос» в русском языке является укоренившимся титулом и не устраняет мессианского смысла; вариант «в Мессии» возможен, но здесь менее естественен.
- issue: Значение ἐν τοῖς ἐπουρανίοις
  choice: на небесах
  alternative: в небесной сфере
  rationale: Основной текст передаёт пространственно-сферический смысл без искусственной буквальности; примечание сохраняет более аналитическую передачу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Местоимения, относящиеся к Богу и Христу, написаны с прописной буквы; синтаксис сохраняет зависимость стиха от предыдущего контекста.
