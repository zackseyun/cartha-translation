    rationale: «Стали» может описывать лишь результат, тогда как греческий аористный пассив говорит о том, что субъект был назначен/определён. Формулировка «были определены как Его наследие» сохраняет пассивность и основное избранное прочтение.
  - severity: low
    issue: «По замыслу» и «по решению Своей воли» не вполне сохраняют различие между πρόθεσις и βουλή.
    rationale: В оригинале употреблены два разных, хотя и близких понятия. «Согласно намерению ... по замыслу Своей воли» звучит по-русски естественно и лучше передаёт их различие.
