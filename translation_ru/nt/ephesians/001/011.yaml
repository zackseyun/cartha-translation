  text: ἐν ᾧ καὶ ἐκληρώθημεν προορισθέντες κατὰ πρόθεσιν τοῦ τὰ πάντα ἐνεργοῦντος κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/011.yaml
  text: In him we also were made an inheritance[a], having been predestined according to the purpose of the one who works all things according to the counsel of his will,
translation:
  language: ru
  text: В Нём мы также были определены как Его наследие[a], будучи предопределены согласно намерению Того, Кто совершает всё по замыслу Своей воли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мы также получили наследие». Греческий глагол может означать как получение наследия, так и то, что люди были определены как Божий удел, Его наследие.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: В Нём
  rationale: Относительное местоимение указывает на Мессию в предшествующем контексте; эта формулировка естественна по-русски и сохраняет смысл пребывания в единении с Ним.
- source_word: ἐκληρώθημεν
  choice: мы также стали Его наследием
  rationale: Пассивная форма κληρόω допускает смысл назначения в удел, то есть превращения верующих в Божье наследие. Добавленное местоимение «Его» ясно передаёт подразумеваемую принадлежность; альтернативный смысл получения наследия сохранён в сноске.
- source_word: προορισθέντες
  choice: будучи предопределены
  rationale: Причастие обозначает предварительное определение. Стандартный русский эквивалент сохраняет лексическое значение, не уточняя спорную богословскую систему.
- source_word: κατὰ πρόθεσιν
  choice: по замыслу
  rationale: πρόθεσις обозначает намерение или целенаправленный план; «по замыслу» звучит естественно и достойно в современном литературном русском.
- source_word: τοῦ τὰ πάντα ἐνεργοῦντος
  choice: Того, Кто совершает всё
  rationale: Субстантивированное причастие указывает на Бога как действующего; «совершает» передаёт действенное осуществление, не конкретизируя его способ.
- source_word: τὰ πάντα
  choice: всё
  rationale: Прямой и естественный русский эквивалент, сохраняющий всеохватность утверждения.
- source_word: κατὰ τὴν βουλὴν
  choice: по решению
  rationale: βουλή здесь выражает обдуманное решение или намерение; «решение» сохраняет оттенок волевого определения и избегает архаичного «совета».
- source_word: τοῦ θελήματος αὐτοῦ
  choice: Своей воли
  rationale: Возвратное притяжательное местоимение естественно указывает на волю действующего субъекта и точно передаёт родительное сочетание.
theological_decisions:
- issue: Значение ἐκληρώθημεν
  choice: Верующие стали Божьим наследием, Его уделом.
  alternative: Верующие получили наследие.
  rationale: Пассивная форма κληρόω допускает оба толкования. Ветхозаветный образ Божьего народа как Его наследия и пассивная конструкция поддерживают основной вариант, но альтернативное прочтение достаточно вероятно и потому сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Сохранены богословская насыщенность и подлинная неоднозначность ключевого глагола; конфессионально окрашенные уточнения не добавлены.
