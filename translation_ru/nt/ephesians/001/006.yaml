  text: εἰς ἔπαινον δόξης τῆς χάριτος αὐτοῦ ⸀ἧς ἐχαρίτωσεν ἡμᾶς ἐν τῷ ἠγαπημένῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/006.yaml
  text: to the praise of the glory of his grace[a], with which he has favored us in the Beloved[b],
translation:
  language: ru
  text: к похвале славы Его благодати[a], которой Он одарил нас в Возлюбленном[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которую Он даровал нам»; буквальнее, но архаичнее: «которой Он облагодатствовал нас». Греческие слова «благодать» и «одарил благодатью» однокоренные и подчёркивают, что Бог поступил с нами по благодати.'
    reason: lexical_alternative
  - marker: b
    text: «Возлюбленный» — наименование Сына, то есть Мессии.
    reason: cross_reference
lexical_decisions:
- source_word: εἰς ἔπαινον
  choice: к похвале
  rationale: Устойчиво и естественно передаёт направленность на цель или результат, не устраняя возможный оттенок обоих значений.
- source_word: δόξης
  choice: славы
  rationale: Обычный эквивалент δόξα в хвалебном контексте; сохраняет богословскую насыщенность выражения.
- source_word: χάριτος
  choice: благодати
  rationale: Передаёт Божью милость и благоволение в спасительном действии, сохраняя ключевой для контекста термин.
- source_word: ἧς ἐχαρίτωσεν
  choice: которой Он одарил
  rationale: Относительное местоимение отнесено к «благодати», а «одарил» естественно выражает действие χαριτόω и частично сохраняет связь с идеей дара.
- source_word: ἡμᾶς
  choice: нас
  rationale: Прямое соответствие дополнению греческого глагола.
- source_word: ἐν
  choice: в
  rationale: Сохраняет основное значение предлога и не сводит выражение исключительно к средству действия или к союзу со Христом.
- source_word: τῷ ἠγαπημένῳ
  choice: Возлюбленном
  rationale: Субстантивированное причастие передано как титул; прописная буква указывает на личное именование, не добавляя отсутствующее в стихе слово «Сын».
theological_decisions:
- issue: Связь χάρις и χαριτόω
  choice: благодати, которой Он одарил нас
  alternative: благодати, которой Он облагодатствовал нас; благодати, которую Он даровал нам
  rationale: «Облагодатствовал» точнее воспроизводит однокоренную фигуру, но звучит архаично; «одарил» остаётся понятным современному читателю и передаёт Божье благодатное действие без конфессионального уточнения.
- issue: Значение ἐν τῷ ἠγαπημένῳ
  choice: в Возлюбленном
  alternative: через Возлюбленного; в возлюбленном Сыне
  rationale: Буквальное «в» сохраняет смысловую ёмкость греческого ἐν, а титул «Возлюбленный» указывает на Мессию, не вставляя прямо не названное здесь слово «Сын».
- issue: Выражение ἔπαινον δόξης τῆς χάριτος
  choice: к похвале славы Его благодати
  alternative: дабы была прославлена Его славная благодать
  rationale: Формулировка сохраняет необычную генитивную цепочку оригинала и не решает однозначно, характеризует ли «слава» благодать или обозначает предмет хвалы.
translation_notes:
  register: Современный литературный и торжественный регистр. Сохранены павловская генитивная цепочка, титульное употребление «Возлюбленный» и неоднозначность предлога «в»; архаизм «облагодатствовал» вынесен в примечание.
