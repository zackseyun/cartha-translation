  text: εἰς τὸ εἶναι ἡμᾶς εἰς ἔπαινον δόξης αὐτοῦ τοὺς προηλπικότας ἐν τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/012.yaml
  text: so that we who had already hoped in Messiah might be for the praise of his glory[a][b].
translation:
  language: ru
  text: чтобы мы, прежде возложившие надежду на Мессию[a], были к хвале Его славы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мы, первыми возложившие надежду на Мессию».'
    reason: Альтернативное понимание προηλπικότας как указания на тех, кто надеялся прежде других.
lexical_decisions:
- source_word: εἰς τὸ εἶναι
  choice: чтобы ... служили
  rationale: Оборот с субстантивированным инфинитивом выражает цель или результат. По-русски конструкция «чтобы ... служили» естественно передаёт смысл предназначения и сочетается с «к хвале».
- source_word: ἡμᾶς
  choice: мы
  rationale: В греческом это винительный падеж как субъект инфинитива; при перестройке в русское придаточное требуется именительный «мы».
- source_word: εἰς ἔπαινον
  choice: к хвале
  rationale: Сохраняется повторяющаяся в Еф 1 формула цели или результата. «К хвале» звучит достойно и не перегружает выражение пояснением.
- source_word: δόξης αὐτοῦ
  choice: Его славы
  rationale: Прямо сохраняется родительная конструкция и богословски значимое слово «слава».
- source_word: τοὺς προηλπικότας
  choice: заранее возложившие надежду
  rationale: Перфектное причастие передаёт предшествующее упование с сохраняющимся результатом. «Заранее» удерживает значение приставки προ-, не навязывая толкование, будто речь непременно идёт о первой исторической группе уверовавших.
- source_word: ἐν τῷ Χριστῷ
  choice: на Мессию
  rationale: При глаголе надежды греческое ἐν может естественно передавать направленность и основание упования. «Мессия» сохраняет титульный смысл Χριστός; русское управление «возложить надежду на» звучит естественнее буквального «надеяться в».
theological_decisions:
- issue: Обозначает ли προηλπικότας тех, кто прежде других возложил надежду, или просто тех, кто надеялся заранее
  choice: 'В основном тексте: «заранее возложившие надежду»'
  alternative: «первыми возложившие надежду»
  rationale: Приставка προ- несомненно указывает на предшествование, но не определяет однозначно, идёт ли речь о хронологически первой группе. Основной текст сохраняет эту недосказанность, а более сильное толкование вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Определительное причастие не отделено запятыми как вставное пояснение, поскольку оно уточняет, какие именно «мы» имеются в виду. Заглавная буква в «Его» использована как принятая в русском библейском регистре форма почтительного местоимения.
