  text: ἥτις ἐστὶν τὸ σῶμα αὐτοῦ, τὸ πλήρωμα τοῦ τὰ πάντα ἐν πᾶσιν πληρουμένου.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/023.yaml
  text: which is his body[b][a], the fullness of the one who fills all things in all.
translation:
  language: ru
  text: которая есть Его тело, полнота[a] Того, Кто наполняет[b] всё во всём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что наполнено» либо «восполнение». Греческое слово «полнота» здесь допускает несколько оттенков смысла.'
    reason: lexical_alternative
  - marker: b
    text: Греческую форму можно также понять как «наполняется», хотя в данном контексте вероятнее значение «наполняет».
    reason: alternative_reading
lexical_decisions:
- source_word: ἥτις
  choice: которая
  rationale: Относительное местоимение женского рода отсылает к Церкви в предыдущем стихе. Простое «которая» естественно по-русски; возможный качественный оттенок «которая, будучи таковой» не выражен, чтобы не утяжелять фразу.
- source_word: τὸ σῶμα αὐτοῦ
  choice: Его тело
  rationale: Прямая и устоявшаяся передача Павловой метафоры отношений Церкви и Мессии.
- source_word: τὸ πλήρωμα
  choice: полнота
  rationale: Сохраняет ёмкость и неоднозначность греческого слова, не решая за текст, означает ли оно наполненность, восполнение или то, что наполняется.
- source_word: τοῦ ... πληρουμένου
  choice: Того, Кто наполняет
  rationale: Хотя причастие морфологически допускает среднее или страдательное понимание, в данном контексте наиболее естествен активный смысл. Прописные буквы отражают отнесение выражения ко Христу, не добавляя имени в текст.
- source_word: τὰ πάντα
  choice: всё
  rationale: Естественно передаёт всеохватное значение среднего рода множественного числа и его космический размах.
- source_word: ἐν πᾶσιν
  choice: во всём
  rationale: Близкая к форме оригинала передача сохраняет сжатость и неоднозначность выражения, не сужая его до «во всех людях» и не истолковывая как «всячески».
theological_decisions:
- issue: Значение πλήρωμα применительно к Церкви и Христу
  choice: Сохранено слово «полнота» без поясняющего перефразирования.
  alternative: «то, что Он наполняет»; «восполнение»; «завершение»
  rationale: 'Греческая формулировка допускает несколько взаимосвязанных толкований: Церковь может мыслиться как наполненная Христом или как Его полнота/восполнение в рамках образа тела. Перевод не устраняет эту напряжённость.'
- issue: Залог и значение πληρουμένου
  choice: 'Активное понимание: «Того, Кто наполняет».'
  alternative: «Того, Кто наполняется»
  rationale: Форма причастия сама по себе допускает среднее/страдательное прочтение, однако контекст и употребление глагола поддерживают активное значение. Грамматически возможная альтернатива отмечена в сноске.
- issue: Значение ἐν πᾶσιν
  choice: «во всём»
  alternative: «всеми способами»; «во всех»
  rationale: Буквально близкая передача сохраняет намеренную широту греческого выражения и не ограничивает его ни образом действия, ни кругом лиц.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксис оригинала сохранён настолько, насколько это естественно по-русски; богословская и грамматическая неоднозначность отмечена, а не устранена.
