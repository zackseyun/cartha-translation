  text: In him we have redemption through his blood[a], the forgiveness of trespasses[b], according to the riches of his grace
translation:
  language: ru
  text: В Нём мы имеем искупление через Его кровь — прощение прегрешений — по богатству Его благодати.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ᾧ
  choice: В Нём
  rationale: Относительное местоимение отсылает к Возлюбленному в предыдущем стихе. «В Нём» естественно по-русски и сохраняет выраженную предлогом ἐν связь со Христом.
- source_word: ἔχομεν
  choice: мы имеем
  rationale: Форма настоящего времени обозначает нынешнюю реальность и обладание; прямое соответствие естественно звучит по-русски.
- source_word: ἀπολύτρωσιν
  choice: искупление
  rationale: Термин передаёт освобождение, достигнутое дорогой ценой, и сохраняет характерный для Павла богословский смысл.
- source_word: διὰ τοῦ αἵματος αὐτοῦ
  choice: через Его кровь
  rationale: διά с родительным падежом выражает средство. Конкретный образ крови сохранён без истолковывающей замены на «смерть» или «жертвенную смерть».
- source_word: ἄφεσιν
  choice: прощение
  rationale: В данном контексте слово обозначает отпущение вины; «прощение» — ясный и современный русский эквивалент.
- source_word: παραπτωμάτων
  choice: прегрешений
  rationale: Слово обозначает нравственные проступки и нарушения. «Прегрешения» сохраняет морально-религиозный оттенок, оставаясь понятным в современном литературном русском.
- source_word: κατὰ τὸ πλοῦτος
  choice: по богатству
  rationale: 'κατά с винительным указывает на меру или соответствие: прощение соразмерно богатству Божьей благодати, а не просто исходит из него.'
- source_word: χάριτος
  choice: благодати
  rationale: Устоявшийся и семантически ёмкий русский эквивалент центрального для Павла понятия χάρις.
theological_decisions:
- issue: Связь между «искуплением» и «прощением прегрешений»
  choice: 'Сохранено приложение: «искупление… — прощение прегрешений»'
  alternative: «искупление, то есть прощение прегрешений»
  rationale: Второе словосочетание естественно понимается как приложение к первому. Тире делает эту связь ясной по-русски, не добавляя отсутствующего в греческом пояснения «то есть» и не сводя богословское содержание искупления к явному определению.
- issue: Значение выражения «через Его кровь»
  choice: Сохранён конкретный образ крови
  alternative: «через Его смерть» или «через Его жертвенную смерть»
  rationale: Греческий текст прямо говорит о крови. Замена на «смерть» была бы истолкованием и ослабила бы жертвенный и заветный образ исходного текста.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Заглавные буквы в местоимениях «Нём», «Его» употреблены как принятая русская благоговейная норма. Тире перед и после приложения помогает ясно передать греческую синтаксическую связь без добавления пояснительных слов.
