  terminology: «Искупление», «кровь», «прощение», «прегрешения» и «благодать» — устойчивые и семантически подходящие соответствия. Они не подменяют образ крови интерпретацией «смерть» и не навязывают конфессионального объяснения связи искупления и прощения.
