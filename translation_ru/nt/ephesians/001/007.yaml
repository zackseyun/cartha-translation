  source_fidelity: 'Текст точно передаёт греческую конструкцию: «В Нём» соответствует ἐν ᾧ и сохраняет отсылку к Возлюбленному из предыдущего стиха; настоящее «мы имеем» передаёт ἔχομεν; «искупление через Его кровь» сохраняет ἀπολύτρωσις и конкретное средство διὰ τοῦ αἵματος αὐτοῦ. «Прощение прегрешений» адекватно передаёт ἄφεσις τῶν παραπτωμάτων. «По богатству Его благодати» передаёт κατά как меру/соответствие, а не только источник.'
