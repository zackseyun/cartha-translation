  text: προορίσας ἡμᾶς εἰς υἱοθεσίαν διὰ Ἰησοῦ Χριστοῦ εἰς αὐτόν, κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/005.yaml
  text: having predestined us for adoption through Jesus the Messiah to himself[a], according to the good pleasure of his will[c][b],
translation:
  language: ru
  text: предопределив нас к усыновлению[a] через Иисуса Мессию[b] к Себе[c], по благоволению Своей воли,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально термин указывает на принятие в положение сына, то есть на наделение статусом законного наследника.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «через Иисуса Христа». Греческое Христос — титул, означающий «Мессия», то есть «Помазанник».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «для Себя». Греческое выражение может указывать как на направленность к Нему, так и на цель — для Него Самого.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προορίσας
  choice: предопределив
  rationale: Аористное причастие сохранено как деепричастие, продолжающее единое предложение 1:3–14. «Предопределив» прямо передаёт значение предварительного определения и не ослабляет богословски напряжённый термин.
- source_word: εἰς υἱοθεσίαν
  choice: к усыновлению
  rationale: «Усыновление» — естественный русский юридический и библейский термин; он передаёт принятие в положение сына и наследника. Предлог «к» сохраняет направительное значение εἰς.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: через Иисуса Мессию
  rationale: διά с родительным падежом обозначает посредничество или средство. Χριστός передан по значению как титул «Мессия», а не как непрозрачная часть имени.
- source_word: εἰς αὐτόν
  choice: к Себе
  rationale: Передаёт направленность действия к Богу и естественно указывает на Него возвратным местоимением; возможный целевой оттенок «для Себя» отмечен в сноске.
- source_word: κατὰ τὴν εὐδοκίαν
  choice: по благоволению
  rationale: κατά выражает соответствие, а εὐδοκία — благосклонное желание или угодное решение. Устойчивое русское «по благоволению» сохраняет оба оттенка без разъясняющего пересказа.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: Своей воли
  rationale: Прямо передаёт родительную конструкцию; возвратное «Своей» в русском однозначно связывает волю с действующим Богом.
theological_decisions:
- issue: Значение προορίσας в доктринально спорном контексте
  choice: предопределив
  alternative: заранее предназначив
  rationale: Выбранный термин сохраняет явную лексическую силу προορίζω, но перевод не уточняет ни основание, ни механизм предопределения сверх сказанного в тексте.
- issue: Сыновний и юридический оттенок υἱοθεσία
  choice: усыновление с пояснительной сноской
  alternative: принятие в положение сыновей
  rationale: Основной текст остаётся естественным по-русски, а сноска сохраняет указание на статус сына и наследника, применяемый в контексте ко всем верующим.
- issue: Передача титула Χριστοῦ
  choice: Мессия
  alternative: Христос
  rationale: Перевод значения титула делает его понятным современному читателю и не превращает его автоматически в часть личного имени.
- issue: Направительный или целевой оттенок εἰς αὐτόν
  choice: к Себе
  alternative: для Себя
  rationale: Основной вариант ближе к направительному значению εἰς; целевое понимание остаётся подлинной грамматической возможностью и поэтому вынесено в сноску.
translation_notes:
  register: Современный литературный русский с достоинством библейского регистра. Синтаксическая незавершённость и конечная запятая сохранены, поскольку стих является частью длинного предложения 1:3–14. Прописные буквы в «Себе» и «Своей» использованы как традиционный русский знак отнесения местоимений к Богу, не меняющий смысла исходного текста.
