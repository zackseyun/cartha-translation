  text: чтобы Бог нашего Господа Иисуса, Мессии[a], Отец славы[b], дал вам дух[c] мудрости и откровения в познании Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционный перевод: «Иисуса Христа». Греческое Χριστός означает «Мессия».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «славный Отец». Буквально: «Отец славы».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Дух мудрости и откровения». Греческое πνεῦμα может означать как дарованный Богом дух или внутренний настрой, так и Святого Духа.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт целевое и содержательное значение придаточной части, продолжающей молитву Павла из предыдущего стиха.
- source_word: ὁ θεὸς τοῦ κυρίου ἡμῶν
  choice: Бог нашего Господа
  rationale: Прямое и естественное соответствие греческой конструкции; «Господь» сохраняет христологический титул κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός здесь сохраняет смысл титула «Мессия»; русский язык не требует определённого артикля перед титулом.
- source_word: ὁ πατὴρ τῆς δόξης
  choice: Отец славы
  rationale: Сохраняет буквальную родительную конструкцию и не сводит её к одному толкованию «славный Отец».
- source_word: δώῃ ὑμῖν
  choice: дал вам
  rationale: Сослагательно-целевое значение аориста после ἵνα естественно выражается русской формой прошедшего времени с союзом «чтобы».
- source_word: πνεῦμα σοφίας καὶ ἀποκαλύψεως
  choice: дух мудрости и откровения
  rationale: Строчная буква позволяет не предрешать, обозначает ли πνεῦμα Святого Духа или дарованный Богом внутренний настрой; зависимые родительные формы переданы прямо.
- source_word: ἐν ἐπιγνώσει αὐτοῦ
  choice: в познании Его
  rationale: Близко передаёт ἐν и ἐπίγνωσις, сохраняя открытым точный оттенок связи познания с мудростью и откровением.
theological_decisions:
- issue: Относится ли πνεῦμα к Святому Духу или к дарованному Богом духу/настрою
  choice: дух мудрости и откровения
  alternative: Дух мудрости и откровения
  rationale: В греческом перед πνεῦμα нет артикля, и возможны оба прочтения. Основной текст не закрепляет более определённое отождествление, а альтернатива указана в сноске.
- issue: Как передать Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В сочетании Ἰησοῦ Χριστοῦ слово сохраняет титульное мессианское значение; традиционный вариант отмечен в сноске.
- issue: Как понимать родительное сочетание πατὴρ τῆς δόξης
  choice: Отец славы
  alternative: славный Отец
  rationale: Буквальная конструкция сохраняет богословскую ёмкость выражения и не ограничивает его качественным толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного контекста. Синтаксис сохраняет связь с предыдущим стихом; формулировки избегают как излишней архаики, так и разговорности. Прописное «Его» принято для ясной отсылки к Богу без устранения синтаксической связи местоимения.
