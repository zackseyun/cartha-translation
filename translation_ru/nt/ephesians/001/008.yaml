lexical_decisions:
- source_word: ἧς
  choice: которой
  rationale: Относительное местоимение в родительном падеже согласуется с χάριτος («благодати») из ст. 7 и естественно продолжает предыдущее высказывание.
- source_word: ἐπερίσσευσεν
  choice: щедро одарил
  rationale: 'Глагол здесь имеет переходный, каузативный смысл: Бог даровал благодать в преизбытке. Выражение передаёт изобилие и естественно звучит по-русски.'
- source_word: εἰς ἡμᾶς
  choice: нас
  rationale: При глаголе «одарил» адресат естественно выражается винительным падежом; направленность действия на верующих сохраняется.
- source_word: ἐν πάσῃ σοφίᾳ καὶ φρονήσει
  choice: во всякой мудрости и разумении
  rationale: Близкая к форме греческого текста передача сохраняет открытым синтаксическое отношение оборота к предшествующему действию или дару.
- source_word: σοφίᾳ
  choice: мудрости
  rationale: Прямой и устойчивый эквивалент σοφία.
- source_word: φρονήσει
  choice: разумении
  rationale: Передаёт способность понимать и рассуждать, отличая φρόνησις от σοφία; сохраняет достоинство библейского регистра без явной архаизации.
theological_decisions:
- issue: К чему относится оборот «во всякой мудрости и разумении»
  choice: Основной текст не уточняет, описывает ли оборот образ действия Бога или то, чем верующие были наделены вместе с благодатью.
  alternative: Явно отнести мудрость и разумение либо к Божьему действию, либо к дару верующим.
  rationale: Греческий синтаксис допускает оба понимания; сохранение неопределённости не разрешает подлинную богословскую напряжённость за читателя.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Щедро одарил» идиоматично передаёт идею преизобилия; «разумение» сохраняет смысловое отличие от «мудрости».
