  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ πάσης
  choice: со всяким
  rationale: μετά с родительным падежом выражает сопутствие, а πάσης усиливает полноту проявления качества. «Со всяким» сохраняет эту всеохватность и естественно вводит парные добродетели.
- source_word: ταπεινοφροσύνης
  choice: смирением
  rationale: Существительное обозначает смирение, скромное представление о себе; «смирение» — ясный и устойчивый современный русский эквивалент.
- source_word: πραΰτητος
  choice: кротостью
  rationale: πραΰτης обозначает кротость, мягкость и сдержанность, а не слабость. «Кротость» сохраняет этический и библейский оттенок слова.
- source_word: μακροθυμίας
  choice: долготерпением
  rationale: Термин указывает на длительное терпение по отношению к людям, особенно на медлительность к гневу. «Долготерпение» точно передаёт это значение и остаётся понятным в литературном русском языке.
- source_word: ἀνεχόμενοι
  choice: перенося
  rationale: Причастие настоящего времени выражает продолжающуюся готовность терпеливо принимать недостатки или трудности, связанные с другими. «Перенося» сохраняет причастную связь с призывом предыдущего стиха и не имеет разговорной окраски.
- source_word: ἀλλήλων
  choice: друг друга
  rationale: Взаимное местоимение естественно передаётся по-русски устойчивым сочетанием «друг друга».
- source_word: ἐν ἀγάπῃ
  choice: с любовью
  rationale: ἐν здесь может обозначать сферу или образ действия. «С любовью» естественно описывает то, как следует переносить друг друга, не устраняя возможный смысл действия в сфере любви.
theological_decisions:
- issue: Передача ἀγάπη
  choice: любовь
  alternative: благотворительность; христианская любовь
  rationale: «Любовь» прямо и современно передаёт ἀγάπη без архаизации и без добавления отсутствующего в греческом тексте уточнения.
- issue: Характер ἀνεχόμενοι ἀλλήλων
  choice: перенося друг друга
  alternative: снисходя друг к другу; терпя друг друга
  rationale: 'Выбранная формулировка сохраняет взаимность и напряжение исходного выражения: речь идёт не только о мягком отношении, но и о терпеливом принятии реальных трудностей друг друга.'
translation_notes:
  register: Современный литературный русский с достоинством библейского стиля. Сохранена синтаксическая незавершённость фрагмента, поскольку стих продолжает призыв из Еф. 4:1; финальная запятая отражает связь со следующим стихом. Термины «кротость» и «долготерпение» выбраны как точные и общеупотребительные в библейско-этическом контексте, без конфессиональных добавлений.
