  language: ru
  text: И не давайте дьяволу места[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «не давайте дьяволу возможности действовать»; буквально: «не давайте места дьяволу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: и не
  rationale: Союз продолжает ряд предшествующих наставлений; «и не» естественно передаёт как связь с контекстом, так и запрет.
- source_word: δίδοτε
  choice: давайте
  rationale: Настоящее повелительное наклонение от δίδωμι непосредственно означает «давать»; форма множественного числа соответствует обращению к читателям.
- source_word: τόπον
  choice: места
  rationale: Основное значение — «место». В данном обороте слово также может означать возможность или простор для действия; буквальный образ сохранён в тексте, а смысловая альтернатива указана в сноске.
- source_word: τῷ διαβόλῳ
  choice: дьяволу
  rationale: В этом контексте слово с артиклем служит личным обозначением духовного противника; традиционное русское «дьявол» точно передаёт референта без лишнего истолкования.
theological_decisions:
- issue: Обозначает ли διάβολος обычного клеветника или личного духовного противника
  choice: дьяволу
  alternative: клеветнику
  rationale: В контексте наставлений Павла это выражение, вероятнее всего, относится к личному духовному противнику. Перевод «дьяволу» сохраняет это значение, не расширяя формулировку стиха.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified формулировка сохраняет буквальный образ оригинала и его идиоматическую широту.
