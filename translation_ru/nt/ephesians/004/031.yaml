  text: πᾶσα πικρία καὶ θυμὸς καὶ ὀργὴ καὶ κραυγὴ καὶ βλασφημία ἀρθήτω ἀφ’ ὑμῶν σὺν πάσῃ κακίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/031.yaml
  text: Let all bitterness and wrath and anger and clamor and slander be taken away from you[a], along with all malice.
translation:
  language: ru
  text: Всякая горечь, ярость, гнев, крик и злословие[a] пусть будут удалены от вас вместе со всякой злобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оскорбительная речь». В более широком значении слово может означать «хулу», в том числе по отношению к Богу; однако здесь оно, по-видимому, относится к вредоносной речи о людях или против них.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα πικρία
  choice: всякая горечь
  rationale: «Всякая» передаёт всеохватность πᾶσα, а «горечь» сохраняет образ укоренившейся внутренней обиды и озлобленности.
- source_word: θυμός
  choice: ярость
  rationale: «Ярость» обозначает бурное, вспыхивающее чувство и позволяет отличить θυμός от следующего ὀργή.
- source_word: ὀργή
  choice: гнев
  rationale: «Гнев» — естественный современный эквивалент, отличимый от более взрывной «ярости».
- source_word: κραυγή
  choice: крик
  rationale: В данном перечне пороков слово означает громкое, враждебное выражение гнева; «крик» передаёт это прямо и понятно.
- source_word: βλασφημία
  choice: злословие
  rationale: В контексте межличностного поведения речь, вероятнее всего, идёт о порочащей или оскорбительной речи. «Злословие» сохраняет её широкий вредоносный характер, не сужая значение до юридически понимаемой клеветы.
- source_word: ἀρθήτω ἀφ’ ὑμῶν
  choice: пусть будут удалены от вас
  rationale: Формулировка сохраняет пассивную форму повеления и образ полного устранения перечисленных пороков из жизни адресатов.
- source_word: σὺν πάσῃ κακίᾳ
  choice: вместе со всякой злобой
  rationale: «Вместе с» передаёт сопутствующее значение σύν, а «злоба» здесь естественно выражает злой умысел и недоброжелательность, а не зло вообще.
theological_decisions:
- issue: Значение βλασφημία в этическом перечне
  choice: межличностное «злословие»
  alternative: «богохульство» или «оскорбительная речь»
  rationale: Соседние слова описывают разрушительные чувства и речь в отношениях между людьми. Однако более традиционное религиозное значение слова возможно само по себе и поэтому отмечено в сноске, а не исключено без оговорки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной, но понятной повелительной конструкцией. Однородный ряд и пассивная форма сохранены близко к греческому тексту; «ярость» и «гнев» разграничивают θυμός и ὀργή.
