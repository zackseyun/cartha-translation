lexical_decisions:
- source_word: ἐσκοτωμένοι
  choice: помрачённые
  rationale: Перфектное страдательное причастие описывает наступившее и продолжающееся состояние; причастная форма сохраняет связь с окружающим предложением.
- source_word: τῇ διανοίᾳ
  choice: в разуме
  rationale: διάνοια обозначает разум, мышление или понимание. «В разуме» кратко и естественно передаёт дательный отношения, не сводя значение лишь к отдельным мыслям.
- source_word: ἀπηλλοτριωμένοι
  choice: отчуждённые
  rationale: Перфектное страдательное причастие выражает устойчивое состояние отделённости; «отчуждённые» сохраняет как пассивный оттенок, так и идею нарушенной связи.
- source_word: τῆς ζωῆς τοῦ θεοῦ
  choice: от жизни Божьей
  rationale: Родительная конструкция сохранена без уточнения, идёт ли речь о жизни, принадлежащей Богу, или о жизни, исходящей от Бога.
- source_word: διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς
  choice: из-за пребывающего в них неведения
  rationale: διά с винительным передаёт причину, а атрибутивное причастие указывает, что неведение находится в них. «Неведение» точнее и нейтральнее, чем потенциально уничижительное «невежество».
- source_word: διὰ τὴν πώρωσιν τῆς καρδίας αὐτῶν
  choice: из-за ожесточения их сердец
  rationale: πώρωσις обозначает затвердение и утрату восприимчивости; «ожесточение» естественно передаёт эту метафору по-русски. Множественное «сердец» согласуется с множественным носителем и звучит естественнее, хотя в греческом существительное стоит в единственном числе.
theological_decisions:
- issue: Смысл выражения «жизнь Божья»
  choice: Сохранить родительную конструкцию «жизнь Божья», не уточняя её отношение к Богу.
  alternative: «жизнь, исходящая от Бога» или «собственная жизнь Бога»
  rationale: Греческое выражение допускает оба близких оттенка; перевод не должен устранять подлинную смысловую открытость.
- issue: Причинная связь неведения и ожесточения
  choice: Сохранить два повторяющихся оборота «из-за… из-за…» без уточнения логической иерархии.
  alternative: Представить ожесточение как причину неведения либо объединить обе причины в один оборот.
  rationale: Повторение διὰ сохраняет напряжение синтаксиса и не навязывает более точную причинную схему, чем выражено в тексте.
- issue: Единственное число «сердце» при множественном референте
  choice: Передать естественным русским множественным числом «их сердец».
  alternative: «их сердца» с собирательным единственным числом
  rationale: Русское множественное число яснее и естественнее указывает на сердца этих людей, не меняя антропологического смысла выражения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Причастная структура и конечная запятая сохранены, поскольку стих является частью более длинного предложения. Формы «неведение» и «ожесточение» понятны современному читателю и точно передают нравственно-познавательную образность оригинала.
