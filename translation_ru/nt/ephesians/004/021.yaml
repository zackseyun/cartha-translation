  text: если вы действительно услышали Его[a] и в Нём были научены, как истина пребывает в Иисусе[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «услышали Его»; возможно также понимание: «услышали о Нём». В греческом стоит прямое дополнение; такое выражение может подразумевать, что через апостольскую весть они услышали самого Христа.'
