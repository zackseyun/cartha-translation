    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: если вы действительно
  rationale: Сохраняет условную форму и усилительный оттенок γε, не превращая фразу в причинное «поскольку».
- source_word: αὐτὸν ἠκούσατε
  choice: услышали Его
  rationale: Прямое дополнение в греческом буквально указывает на то, что адресаты услышали самого Христа; более гладкое «услышали о Нём» оставлено как возможное понимание в примечании.
- source_word: ἐν αὐτῷ
  choice: в Нём
  rationale: Сохраняет широкий смысл ἐν — сферу, единение или тесную связь, — не сводя выражение к действующему лицу «Им».
- source_word: ἐδιδάχθητε
  choice: были научены
  rationale: Передаёт пассивную форму аориста прямо и в естественной для библейского регистра формулировке.
- source_word: καθώς
  choice: ведь
  rationale: В данном синтаксическом контексте вводит основание, соответствующее истине в Иисусе; буквальное «как» по-русски здесь создаёт неясную и тяжёлую связь.
- source_word: ἀλήθεια
  choice: истина
  rationale: Передаёт существительное без добавления указательного или определительного оттенка и сохраняет смысл истины, находящейся в Иисусе.
- source_word: ἐν τῷ Ἰησοῦ
  choice: в Иисусе
  rationale: 'Сохраняет личное имя и неоднозначность ἐν: сфера, единение либо тесная связь.'
theological_decisions:
- issue: Следует ли понимать αὐτὸν ἠκούσατε как «услышали Его» или «услышали о Нём».
  choice: услышали Его
  alternative: услышали о Нём
  rationale: Греческий текст ставит местоимение как прямое дополнение и не содержит предлога со значением «о». Выбранный вариант сохраняет выразительную мысль о том, что во время возвещения адресаты слышали самого Христа, не делая её более определённой, чем оригинал.
- issue: Как передать повторяющиеся обороты с ἐν.
  choice: в Нём / в Иисусе
  alternative: Им / в единении с Иисусом
  rationale: Предлог «в» удерживает павловскую смысловую широту — сферу, единение или тесную связь — и не сводит первый оборот к простому указанию на деятеля.
translation_notes:
  register: 'Современный литературный русский язык с достоинством новозаветного послания. Сохранена синтаксическая связь с предыдущим стихом: фрагмент начинается со строчной буквы и оканчивается запятой. Местоимение «Его» применительно к Христу написано с прописной буквы согласно устойчивой русской библейской традиции.'
