  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μέχρι καταντήσωμεν οἱ πάντες εἰς τὴν ἑνότητα τῆς πίστεως καὶ τῆς ἐπιγνώσεως τοῦ υἱοῦ τοῦ θεοῦ, εἰς ἄνδρα τέλειον, εἰς μέτρον ἡλικίας τοῦ πληρώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/013.yaml
  text: until we all attain to the unity of the faith and of the knowledge of the Son of God[a], to a mature man, to the measure of the stature of the fullness of Messiah[e][d][c][b],
translation:
  language: ru
  text: пока все мы не придём к единству веры[a] и познания[b] Сына Божьего, к зрелому мужу[c], к мере роста[d] полноты Мессии[e],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение может означать как единство в общей исповедуемой вере, так и единство веры самих верующих.
    reason: alternative_reading
  - marker: b
    text: 'Или: «полного познания» или «глубокого познания».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «к зрелости». Буквально по-гречески: «к зрелому мужу»; мужской род и единственное число изображают совместную зрелость всей церкви.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «зрелости»; греческое слово может обозначать также возраст или телесный рост.'
    reason: lexical_alternative
  - marker: e
    text: 'По-гречески: «Христа». Здесь переведено «Мессии», поскольку слово употреблено как титул.'
    reason: alternative_reading
lexical_decisions:
- source_word: μέχρι
  choice: пока… не
  rationale: Естественно передаёт предел и цель продолжающегося действия, описанного в предыдущем стихе.
- source_word: καταντήσωμεν οἱ πάντες
  choice: все мы не придём
  rationale: Передаёт достижение намеченной цели и явно включает всю общину; в конструкции с «пока» по-русски требуется отрицание.
- source_word: εἰς τὴν ἑνότητα τῆς πίστεως
  choice: к единству веры
  rationale: Сохраняет направленность εἰς и допускает как общую исповедуемую веру, так и веру верующих, не устраняя смысловую напряжённость.
- source_word: ἐπιγνώσεως
  choice: познания
  rationale: «Познание» естественно обозначает не только обладание сведениями, но и более глубокое знание; возможный усилительный оттенок вынесен в примечание.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: Сына Божьего
  rationale: Прямо передаёт родительную конструкцию и христологический титул; современная литературная форма «Божьего» ясна и благозвучна.
- source_word: εἰς ἄνδρα τέλειον
  choice: к зрелому мужу
  rationale: Сохраняет мужской род и единственное число корпоративного образа, а τέλειος в контексте роста передаёт как «зрелый», а не как безусловно «совершенный».
- source_word: μέτρον
  choice: мера
  rationale: Сохраняет образ измерения и повторное целевое построение с εἰς.
- source_word: ἡλικίας
  choice: рост
  rationale: Поддерживает телесный образ взросления и допускает значение достигнутой величины; значение «зрелость» отмечено как альтернатива.
- source_word: τοῦ πληρώματος
  choice: полнота
  rationale: Сохраняет богословски значимое и многозначное существительное πλήρωμα, не сводя его к пояснительному прилагательному «полный».
- source_word: τοῦ Χριστοῦ
  choice: Мессия
  rationale: Χριστός здесь имеет титульное богословское значение; «Мессия» передаёт смысл Помазанника, а традиционная форма «Христос» указана в примечании.
theological_decisions:
- issue: Значение τῆς πίστεως
  choice: вера с сохранённой неоднозначностью
  alternative: общее христианское вероучение или личная вера верующих
  rationale: Контекст единства всей общины может указывать на совместно исповедуемую веру, однако русское «веры» сохраняет и субъективное значение греческого πίστις.
- issue: Корпоративный образ εἰς ἄνδρα τέλειον
  choice: к зрелому мужу
  alternative: к зрелости; в совершенного мужа
  rationale: Мужской род и единственное число в греческом представляют всю церковь как одного достигшего зрелости человека; буквальный образ сохранён без утверждения абсолютного нравственного совершенства.
- issue: Связь ἡλικίας и πληρώματος
  choice: мера роста полноты Мессии
  alternative: мера зрелости полноты Мессии; полный возраст Мессии
  rationale: Родительная цепочка в греческом допускает разные способы понимания. Основной текст сохраняет её сжатость и метафоры меры, роста и полноты, не превращая πλήρωμα в простое определение.
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: В данном богословском описании преобладает титульный смысл «Помазанник»; общеупотребительная транслитерация указана в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством новозаветного наставления. Сохранены трёхчастная структура с повтором «к», корпоративный образ одного зрелого мужа и плотная родительная конструкция в заключительной фразе; неоднозначные места пояснены, а не устранены.
