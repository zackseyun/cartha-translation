translation:
  language: ru
  text: один Бог и Отец всех[a], Который над всеми, через всех и во всех[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в более широком смысле: «Отец всего… над всем, через всё и во всём». Повторяющиеся греческие формы слова «весь» употреблены без явно названного существительного и могут относиться как ко всем людям, так и ко всему сущему.'
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых рукописях: «во всех вас».'
    reason: textual_variant
lexical_decisions:
- source_word: εἷς
  choice: один
  rationale: Сохраняет подчёркнутое указание на единство, продолжающее ряд «одно… один…» в ближайшем контексте.
- source_word: θεὸς
  choice: Бог
  rationale: Обычное и точное соответствие θεός; прописная буква уместна как обозначение единого Бога.
- source_word: πατὴρ
  choice: Отец
  rationale: Сохраняет личное и relational обозначение Бога как Отца; прописная буква передаёт употребление слова как божественного титула.
- source_word: πάντων
  choice: всех
  rationale: Естественное русское соответствие в сочетании «Отец всех» и в контексте единства общины. Поскольку греческий текст не называет явно ни людей, ни вещи, более широкий вариант отмечен в сноске.
- source_word: ὁ
  choice: Который
  rationale: Греческий артикль вводит определительное описание Бога; относительное местоимение делает эту связь ясной и естественной по-русски.
- source_word: ἐπὶ πάντων
  choice: над всеми
  rationale: ἐπί с родительным падежом здесь естественно передаёт верховенство и власть; «над всеми» сохраняет краткость греческого выражения.
- source_word: διὰ πάντων
  choice: через всех
  rationale: διά с родительным падежом выражает посредство или действие через кого-либо. Краткая передача не добавляет отсутствующего в тексте глагола.
- source_word: ἐν πᾶσιν
  choice: во всех
  rationale: Прямо передаёт ἐν с дательным падежом и сохраняет параллелизм трёх предложных оборотов. Вариант рукописей и возможность более широкого понимания отмечены в сносках.
theological_decisions:
- issue: Объём значения повторяющихся πάντων / πᾶσιν
  choice: В основном тексте — «всех / всеми / всех», без уточнения «верующих» или «людей».
  alternative: «всего / всем / всё / всём», то есть всё творение или всё сущее.
  rationale: Ближайший контекст посвящён единству общины, однако греческие формы употреблены без явно названного существительного. Русская грамматика требует выбрать форму, поэтому основной текст следует наиболее естественному личному пониманию, а сноска сохраняет более широкий смысл и не разрешает богословскую неоднозначность молча.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным исповедальным ритмом. Троекратный параллелизм «над всеми, через всех и во всех» сохранён; лишние поясняющие глаголы не добавлены.
