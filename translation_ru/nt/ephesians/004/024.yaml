source:
  edition: SBLGNT
  text: καὶ ἐνδύσασθαι τὸν καινὸν ἄνθρωπον τὸν κατὰ θεὸν κτισθέντα ἐν δικαιοσύνῃ καὶ ὁσιότητι τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/024.yaml
  text: and to put on the new man[d][c][b][a], created according to God in righteousness and holiness of the truth.
translation:
  language: ru
  text: и облечься в нового человека[a], созданного сообразно Богу[b] в праведности[c] и святости истины[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в нового себя», «в новую личность». Буквально: «в нового человека»; это выражение соответствует «прежнему человеку» в окружающем контексте.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по образу Бога», «по подобию Бога», «согласно Богу».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «справедливости».'
    reason: alternative_reading
  - marker: d
    text: 'Возможно также: «в истинной праведности и святости» или «в праведности и святости, которые даёт истина».'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ἐνδύσασθαι
  choice: облечься
  rationale: Возвратный инфинитив сохраняет метафору надевания одежды и соответствует противопоставлению «снять с себя / облечься» в ближайшем контексте.
- source_word: καινὸν ἄνθρωπον
  choice: нового человека
  rationale: Передаёт существительное ἄνθρωπος и сохраняет связь с «прежним человеком» в контексте, не сводя выражение к более толковательному «новому я».
- source_word: κατὰ θεὸν
  choice: сообразно Богу
  rationale: Сохраняет значение соответствия Богу или Божьему образцу, не добавляя прямо отсутствующего в греческом тексте слова «образ».
- source_word: κτισθέντα
  choice: созданного
  rationale: Передаёт страдательное причастие и сохраняет образ нового творения.
- source_word: δικαιοσύνῃ
  choice: праведности
  rationale: Обычный русский библейский эквивалент, охватывающий нравственную правоту; возможное значение «справедливость» отмечено в сноске.
- source_word: ὁσιότητι
  choice: святости
  rationale: Естественно передаёт качество благочестивой, угодной Богу жизни.
- source_word: τῆς ἀληθείας
  choice: истины
  rationale: 'Родительный падеж сохранён, чтобы не сужать связь до одного толкования: истина может качественно определять праведность и святость либо указывать на их источник.'
theological_decisions:
- issue: Значение выражения «новый человек»
  choice: Сохранено «нового человека».
  alternative: «новое я», «новую личность»
  rationale: Так сохраняются антропологический образ Павла и лексическая связь с «прежним человеком»; альтернативы яснее в психологическом смысле, но уже являются толкованием.
- issue: Смысл κατὰ θεὸν
  choice: «сообразно Богу»
  alternative: «по образу Бога», «по Божьему замыслу»
  rationale: Основной текст сохраняет неоднозначность соответствия Богу, не уточняя без прямого основания, идёт ли речь именно об образе, подобии или замысле.
- issue: Связь родительного τῆς ἀληθείας
  choice: «праведности и святости истины»
  alternative: «истинной праведности и святости», «праведности и святости, которые даёт истина»
  rationale: Формальная конструкция сохраняет возможность как качественного, так и исходного понимания родительного падежа, не разрешая скрыто богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской метафоры «облечься» и намеренно плотной формулировки «святости истины». Слово «сообразно» несколько возвышенное, но понятное из контекста и позволяет избежать преждевременного толкования κατὰ θεόν.
