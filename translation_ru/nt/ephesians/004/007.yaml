  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἑνὶ δὲ ἑκάστῳ ἡμῶν ἐδόθη ⸀ἡ χάρις κατὰ τὸ μέτρον τῆς δωρεᾶς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/007.yaml
  text: But grace was given to each one of us according to the measure of Messiah’s gift[a].
translation:
  language: ru
  text: Но каждому из нас дана благодать по мере дара Мессии[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дара Христа». Греческий титул Χριστός здесь передан словом «Мессия», раскрывающим его значение; «Христос» — его традиционная передача.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑνὶ ... ἑκάστῳ ἡμῶν
  choice: каждому из нас
  rationale: Сочетание ἑνί и ἑκάστῳ имеет усилительное распределительное значение. Русское «каждому из нас» естественно передаёт индивидуальное наделение каждого члена общины.
- source_word: δὲ
  choice: Но
  rationale: 'Частица обозначает мягкий переход с оттенком противопоставления: после единства, подчёркнутого в предыдущих стихах, Павел обращается к различию даров.'
- source_word: ἐδόθη
  choice: дана
  rationale: Аорист пассивного залога передан краткой формой прошедшего времени, согласованной с существительным «благодать».
- source_word: ἡ χάρις
  choice: благодать
  rationale: «Благодать» сохраняет богословски значимую лексику Павла и не сужает смысл до общего расположения или только спасительной благодати; контекст указывает на благодатное наделение для служения.
- source_word: κατὰ τὸ μέτρον
  choice: по мере
  rationale: Оборот κατά с винительным выражает меру или соразмерность. «По мере» точно и естественно передаёт этот смысл по-русски.
- source_word: τῆς δωρεᾶς
  choice: дара
  rationale: «Дар» передаёт δωρεά как нечто свободно данное и избегает неестественной избыточности рядом со словом «дана».
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Здесь Χριστός сохраняет значение титула. «Мессия» передаёт его смысл, а родительный падеж сохраняет возможную широту отношения между Мессией и даром.
theological_decisions:
- issue: Значение χάρις в контексте
  choice: «Благодать» как индивидуально уделяемое благодатное наделение в общине, без пояснения этого смысла непосредственно в тексте
  alternative: «дар благодати», «способность для служения», общая Божья милость или исключительно спасительная благодать
  rationale: Ближайший контекст переходит от единства общины к различным служениям и дарам, однако само слово χάρις шире любой пояснительной передачи. Поэтому сохранено «благодать», чтобы не устранять богословскую многозначность.
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: В данном обороте титульное значение остаётся ощутимым; «Мессия» раскрывает значение греческого титула. Традиционная передача «Христос» приведена в примечании.
- issue: Отношение родительного τοῦ Χριστοῦ к δωρεᾶς
  choice: дар Мессии
  alternative: дар, данный Мессией; дар, принадлежащий Мессии
  rationale: Русский родительный оборот, как и греческий, не уточняет принудительно, обозначает ли он прежде всего источник, принадлежность или иную связь дара с Мессией.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным синтаксисом. Формулировка сохраняет риторический переход от единства к разнообразию, традиционный павловский термин «благодать» и неоднозначность греческого родительного оборота.
