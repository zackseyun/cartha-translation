id: EPH.4.28
reference: Ephesians 4:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ κλέπτων μηκέτι κλεπτέτω, μᾶλλον δὲ κοπιάτω ἐργαζόμενος ⸂ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν⸃, ἵνα ἔχῃ μεταδιδόναι τῷ χρείαν ἔχοντι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/028.yaml
  text: The one who steals must steal no longer[a], but rather must labor, doing good work with his own hands[b], so that he may have something to share with the one who has need.
translation:
  language: ru
  text: Кто крадёт, пусть больше не крадёт, а лучше усердно трудится, своими руками делая доброе[a], чтобы ему было чем делиться с нуждающимся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «занимаясь добрым делом»; возможно также: «делая полезное».'
    reason: Греческое τὸ ἀγαθόν допускает как нравственный смысл «доброе», так и контекстуальный оттенок полезного, честного труда.
lexical_decisions:
- source_word: ὁ κλέπτων
  choice: Кто крадёт
  rationale: Субстантивированное причастие настоящего времени обозначает человека, который занимается воровством. Такая передача сохраняет глагольный, а не ярлыковый характер выражения.
- source_word: μηκέτι κλεπτέτω
  choice: пусть больше не крадёт
  rationale: «Больше не» передаёт прекращение прежнего поведения, а конструкция с «пусть» естественно выражает повеление третьего лица.
- source_word: μᾶλλον δὲ
  choice: а лучше
  rationale: Передаёт резкое противопоставление и указывает на требуемую альтернативу воровству.
- source_word: κοπιάτω
  choice: усердно трудится
  rationale: Глагол обозначает напряжённый, требующий усилий труд; наречие «усердно» сохраняет этот оттенок.
- source_word: ἐργαζόμενος ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν
  choice: своими руками делая доброе
  rationale: Сохраняет акцент на личном честном труде и более широкое значение субстантивированного τὸ ἀγαθόν, не сводя его лишь к конкретному ремеслу или заработку.
- source_word: ἵνα ἔχῃ μεταδιδόναι
  choice: чтобы ему было чем делиться
  rationale: Естественно передаёт целевое предложение и подразумеваемое наличие средств или имущества для передачи другим.
- source_word: τῷ χρείαν ἔχοντι
  choice: с нуждающимся
  rationale: Краткая и естественная русская передача дательного оборота, обозначающего получателя помощи.
theological_decisions:
- issue: Нравственная цель труда
  choice: Честный труд противопоставлен воровству и направлен на то, чтобы человек мог делиться с нуждающимся.
  alternative: Главная цель труда здесь — только самообеспечение или возмещение украденного.
  rationale: Целевое предложение прямо называет возможность делиться с нуждающимся; самообеспечение может подразумеваться, но не выдвигается текстом на первый план.
translation_notes:
  register: Современный литературный русский язык; повелительная конструкция ясна и естественна, а формулировка сохраняет напряжённый характер труда, личное участие и цель — щедрость по отношению к нуждающемуся.
