  terminology: 'Ключевые этические понятия переданы нейтрально и точно: «крадёт», «усердно трудится», «нуждающийся». Не вводится конфессионально окрашенная терминология. Сноска поставлена непосредственно после «доброе», то есть у того элемента, к которому относится.'
