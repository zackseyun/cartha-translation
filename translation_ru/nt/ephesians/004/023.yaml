  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или дательный падеж можно понимать как указание на действие Святого Духа: «обновляться Духом». Однако выражение, вероятнее всего, относится к внутреннему настрою или направленности вашего ума, а не прямо к Святому Духу.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνανεοῦσθαι
  choice: обновляться
  rationale: Настоящий пассивный инфинитив передан возвратной формой с пассивным значением; она естественна по-русски, сохраняет идею совершающегося над человеком обновления и допускает оттенок продолжающегося процесса.
- source_word: δὲ
  choice: и
  rationale: Здесь δέ служит мягкой связкой в последовательности инфинитивов, поэтому «и» передаёт ход мысли без излишне сильного противопоставления.
- source_word: τῷ πνεύματι
  choice: духом
  rationale: Творительный падеж позволяет выразить область или внутреннее начало обновления, не решая однозначно, обозначен ли здесь дух как внутренняя направленность человека или Дух как действующая сила.
- source_word: νοὸς
  choice: ума
  rationale: «Ум» прямо и ёмко передаёт νοῦς как способность мыслить и понимать; сочетание «дух вашего ума» сохраняет необычную формулировку оригинала.
- source_word: ὑμῶν
  choice: вашего
  rationale: Местоимение относится ко всей общине, но согласуется в русском с существительным «ум» в единственном числе; множественность адресатов ясна из контекста послания.
theological_decisions:
- issue: Относится ли πνεύματι к Святому Духу или к внутреннему духу/настрою человека
  choice: 'Основной текст: «духом вашего ума» со строчной буквы, как указание прежде всего на внутренний строй или направленность ума'
  alternative: «Духом, обновляющим ваш ум» или понимание творительного как указания на Святого Духа
  rationale: Родительное τοῦ νοὸς ὑμῶν непосредственно определяет πνεύματι и естественнее образует антропологическое выражение «дух вашего ума». Однако форма дательного допускает инструментальное понимание, поэтому возможная отсылка к Святому Духу отмечена, но не внесена в основной текст как однозначная.
translation_notes:
  register: Современный литературный русский язык. Необычное, но понятное сочетание «дух вашего ума» намеренно сохраняет образ и богословскую неоднозначность греческого текста; строчная буква в основном тексте отражает более вероятное прочтение, не исключая альтернативы в сноске.
