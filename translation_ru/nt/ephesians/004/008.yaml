id: EPH.4.8
reference: Ephesians 4:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διὸ λέγει· Ἀναβὰς εἰς ὕψος ᾐχμαλώτευσεν αἰχμαλωσίαν, ⸀ἔδωκεν δόματα τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/008.yaml
  text: Therefore it says[a], “Having ascended on high[b], he led captivity captive and gave gifts to men.”
translation:
  language: ru
  text: 'Поэтому сказано: «Взойдя на высоту, он пленил плен[a] и дал дары людям[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «увёл пленников» или «захватил множество пленников». В греческом стоит выразительный однокоренной оборот, перекликающийся с Псалмом 67:19.'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово здесь обозначает людей вообще, а не только мужчин.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Поэтому
  rationale: Передаёт выводное значение союза и связывает цитату с предшествующим рассуждением Павла.
- source_word: λέγει
  choice: сказано
  rationale: В греческом нет явно названного подлежащего. Безличная русская формула естественно указывает на Писание, не добавляя отсутствующего в тексте уточнения.
- source_word: Ἀναβὰς
  choice: Взойдя
  rationale: Деепричастие сохраняет форму аористного причастия и представляет восхождение как предшествующее главным действиям.
- source_word: εἰς ὕψος
  choice: на высоту
  rationale: Сохраняет пространственный и возвышенный образ, а также узнаваемую связь с Псалмом 67:19 по русской нумерации.
- source_word: ᾐχμαλώτευσεν αἰχμαλωσίαν
  choice: пленил плен
  rationale: Намеренно сохраняет выразительный однокоренной оборот греческого текста и его псалмический характер, не сводя образ только к пленникам или к отвлечённому плену.
- source_word: ἔδωκεν δόματα
  choice: дал дары
  rationale: Прямое и естественное соответствие простому глаголу «дать» и существительному «дары».
- source_word: τοῖς ἀνθρώποις
  choice: людям
  rationale: ἄνθρωποι здесь имеет обобщённое значение; «людям» точно и естественно передаёт его в современном русском языке без неоправданного ограничения мужчинами.
theological_decisions:
- issue: Смысл образного выражения ᾐχμαλώτευσεν αἰχμαλωσίαν
  choice: Сохранить в основном тексте выражение «пленил плен»
  alternative: «увёл пленников» или «захватил множество пленников»
  rationale: Однокоренной оборот остаётся многозначным и тесно связан с формулировкой Псалма. Более конкретный перевод преждевременно определил бы, кого или что именно подразумевает образ.
- issue: Неявное подлежащее λέγει
  choice: Безличное «сказано»
  alternative: «он говорит» или «Писание говорит»
  rationale: Такой перевод не отождествляет говорящего сверх того, что выражено в греческом, но естественно функционирует как формула введения цитаты.
- issue: Обобщённое значение τοῖς ἀνθρώποις
  choice: «людям»
  alternative: «мужчинам» или традиционное «человекам»
  rationale: Контекст не ограничивает получателей даров мужчинами; современное «людям» передаёт родовое значение без архаизации.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным ритмом цитаты. Безличное «сказано» естественно вводит ссылку на Писание. Архаичное по оттенку, но понятное выражение «пленил плен» сохранено ради словесного образа и межтекстовой связи; его смысловые варианты вынесены в сноску. Местоимение «он» оставлено со строчной буквы, поскольку прописная буква была бы редакционной конфессиональной маркировкой, отсутствующей в греческом тексте.
