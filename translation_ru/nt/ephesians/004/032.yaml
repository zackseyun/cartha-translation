source:
  edition: SBLGNT
  text: ⸀γίνεσθε εἰς ἀλλήλους χρηστοί, εὔσπλαγχνοι, χαριζόμενοι ἑαυτοῖς καθὼς καὶ ὁ θεὸς ἐν Χριστῷ ἐχαρίσατο ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/032.yaml
  text: And be kind to one another[a], tenderhearted, forgiving one another[b], just as God in Messiah forgave you.
translation:
  language: ru
  text: Будьте друг к другу добры, сострадательны, прощайте друг друга, как и Бог в Мессии простил вас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через Мессию».'
    reason: Греческое ἐν Χριστῷ может пониматься как указание на сферу Божьего действия («в Мессии») либо на посредство («через Мессию»).
lexical_decisions:
- source_word: γίνεσθε
  choice: будьте
  rationale: Настоящее повелительное наклонение выражает постоянный призыв; «будьте» естественно и точно передаёт его в современном русском.
- source_word: εἰς ἀλλήλους
  choice: друг к другу
  rationale: Передаёт направленность взаимного отношения и звучит по-русски естественно.
- source_word: χρηστοί
  choice: добры
  rationale: В нравственном межличностном контексте слово обозначает доброту и благожелательность.
- source_word: εὔσπλαγχνοι
  choice: сострадательны
  rationale: Передаёт глубокое сердечное сочувствие, не сливая значение с предшествующим «добры».
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: прощайте друг друга
  rationale: В данном контексте χαρίζομαι означает прощать обиды, что подтверждается сопоставлением с Божьим действием; формально возвратное ἑαυτοῖς имеет взаимное значение.
- source_word: καθὼς καὶ
  choice: как и
  rationale: Сохраняет сравнение и усилительную частицу καί без тяжеловесности.
- source_word: ἐν Χριστῷ
  choice: в Мессии
  rationale: Сохраняет ἐν и передаёт Χριστός как титул «Мессия», не истолковывая оборот более узко как средство действия.
- source_word: ἐχαρίσατο ὑμῖν
  choice: простил вас
  rationale: В контексте речь о завершённом Божьем акте прощения; русский глагол естественно управляет винительным падежом без предлога.
theological_decisions:
- issue: Значение ἐν Χριστῷ
  choice: в Мессии
  alternative: через Мессию
  rationale: Греческий оборот допускает более инструментальное понимание, однако буквальное «в Мессии» сохраняет подлинную смысловую ёмкость ἐν и характерный для Павла язык сопричастности Христу.
- issue: Передача Χριστῷ
  choice: Мессии
  alternative: Христе
  rationale: Здесь Χριστός сохраняет титульное значение; «Мессия» делает это значение прозрачным современному читателю.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная форма увещевания. Сохранены три взаимосвязанных призыва и богословски ёмкий оборот «в Мессии».
