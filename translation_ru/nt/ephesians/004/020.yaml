review_pass:
  verdict: approve
  source_fidelity: «Но вы не так узнали Мессию» точно сохраняет противопоставление (ὑμεῖς δὲ), отрицание способа (οὐχ οὕτως), аорист и личное прямое дополнение τὸν Χριστόν. Русское «узнали» является естественным способом передать необычное греческое «научились Мессии», не вводя отсутствующее в тексте «учение» или пассивное «были научены».
  naturalness: Фраза краткая, ясная и соответствует современному литературному русскому. «Не так» естественно отсылает к предшествующему описанию образа жизни; конечная запятая обоснована продолжением предложения в следующем стихе.
  terminology: «Мессию» обоснованно сохраняет титульный смысл Χριστός без добавления имени Иисуса. Сноска уместно сообщает традиционный вариант «Христа» и объясняет необычность буквальной конструкции.
