id: EPH.4.20
reference: Ephesians 4:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ οὐχ οὕτως ἐμάθετε τὸν Χριστόν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/020.yaml
  text: But you did not learn Messiah in this way,[a]
translation:
  language: ru
  text: Но вы не так узнали Мессию,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа». Буквально: «научились Мессии».'
    reason: Сноска сохраняет как традиционную передачу титула Χριστός, так и необычную буквальную конструкцию греческого текста.
lexical_decisions:
- source_word: ὑμεῖς
  choice: вы
  rationale: Явно выраженное местоимение второго лица множественного числа сохраняет противопоставление адресатов людям, чей образ жизни описан выше.
- source_word: δὲ
  choice: но
  rationale: Союз вводит прямое противопоставление предшествующему описанию языческого образа жизни.
- source_word: οὐχ οὕτως
  choice: не так
  rationale: Кратко и естественно передаёт отрицание и указание на образ действия, не уточняя сверх греческого текста, к чему именно относится «так».
- source_word: ἐμάθετε
  choice: узнали
  rationale: Глагол буквально означает «научились, узнали». Поскольку его прямым дополнением здесь является личность Мессии, «узнали» звучит по-русски естественно и при этом сохраняет необычную мысль об усвоении вести, сосредоточенной на личности. Перевод «были научены» неоправданно вводил бы пассивную конструкцию.
- source_word: τὸν Χριστόν
  choice: Мессию
  rationale: Χριστός сохраняет значение титула Помазанника. Артикль и контекст позволяют передать его как «Мессию», не добавляя имени Иисуса, которого в стихе нет.
theological_decisions:
- issue: Передача Χριστόν как титула или как привычного имени
  choice: Мессию
  alternative: Христа
  rationale: В данном необычном выражении речь идёт о личности, которую верующие узнали через благую весть; перевод «Мессию» сохраняет титульный смысл Χριστός. Вариант «Христа» также возможен и дан в сноске.
- issue: Значение выражения ἐμάθετε τὸν Χριστόν
  choice: узнали Мессию
  alternative: научились Мессии
  rationale: Греческая конструкция необычно представляет личность Мессии как предмет научения. Русское «узнали Мессию» сохраняет личностный объект и остаётся понятным, не сводя смысл ни только к получению сведений, ни к ученичеству у учителя.
translation_notes:
  register: Современный литературный русский язык; краткая контрастная фраза сохраняет риторическую силу оригинала. Запятая в конце обусловлена продолжением предложения в следующем стихе.
