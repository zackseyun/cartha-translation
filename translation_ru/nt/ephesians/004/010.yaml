id: EPH.4.10
reference: Ephesians 4:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ καταβὰς αὐτός ἐστιν καὶ ὁ ἀναβὰς ὑπεράνω πάντων τῶν οὐρανῶν, ἵνα πληρώσῃ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/010.yaml
  text: The one who descended is himself also the one who ascended far above all the heavens[b][a], so that he might fill all things.
translation:
  language: ru
  text: Тот, кто сошёл, — Он же и взошёл превыше всех небес[a], чтобы наполнить всё[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выше всех небес». Выражение может подчёркивать возвышение над всякой небесной областью.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «исполнить всё». Греческий глагол в некоторых контекстах означает «исполнить», однако здесь непосредственный контекст скорее указывает на значение «наполнить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καταβὰς
  choice: Тот, кто сошёл
  rationale: Субстантивированное причастие аориста передано естественным для современного русского языка относительным оборотом, сохраняющим указание на определённое лицо и завершённость действия.
- source_word: αὐτός ἐστιν καὶ ὁ ἀναβὰς
  choice: Он же и взошёл
  rationale: Частица «же» и местоимение «Он» передают эмфатическое αὐτός и подчёркивают, что сошедший и взошедший — одно и то же лицо, не утяжеляя фразу буквальным повтором конструкции.
- source_word: ὑπεράνω πάντων τῶν οὐρανῶν
  choice: превыше всех небес
  rationale: «Превыше» передаёт усиленное пространственное значение ὑπεράνω и оттенок превосходства; множественное число «небес» сохраняет форму и широту греческого выражения.
- source_word: ἵνα πληρώσῃ
  choice: чтобы наполнить
  rationale: «Чтобы» естественно передаёт целевое значение ἵνα, а «наполнить» соответствует наиболее вероятному значению πληρόω в ближайшем контексте, не раскрывая дополнительно способ или результат наполнения.
- source_word: τὰ πάντα
  choice: всё
  rationale: Русское «всё» естественно и широко передаёт субстантивированное среднее множественное число, не сужая его до людей и не расширяя толкованием «вселенную».
theological_decisions:
- issue: Тождество сошедшего и взошедшего
  choice: 'Эмфатически указано, что сошёл и взошёл один и тот же субъект: «Он же».'
  alternative: Менее выразительное «также взошёл», не подчёркивающее тождество лица.
  rationale: αὐτός и параллельные субстантивированные причастия подчёркивают тождество субъекта обоих действий. Перевод сохраняет этот акцент, не добавляя догматического пояснения.
- issue: Объём значения τὰ πάντα
  choice: «всё»
  alternative: «всех людей» или «всю вселенную»
  rationale: Греческое выражение имеет намеренно широкий охват. Перевод не ограничивает и не конкретизирует его сверх сказанного в тексте.
- issue: Значение πληρώσῃ
  choice: «наполнить»
  alternative: «исполнить»
  rationale: В данном контексте значение наполнения представляется более вероятным, однако возможный оттенок исполнения отмечен в сноске, чтобы не скрывать лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Превыше» сохраняет силу греческого ὑπεράνω, оставаясь понятным; синтаксис с тире и «Он же» естественно передаёт эмфатическое тождество субъекта.
