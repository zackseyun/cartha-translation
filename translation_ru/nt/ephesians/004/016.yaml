  text: ἐξ οὗ πᾶν τὸ σῶμα συναρμολογούμενον καὶ συμβιβαζόμενον διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους τὴν αὔξησιν τοῦ σώματος ποιεῖται εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/016.yaml
  text: from whom the whole body[a], being joined together and held together through every supporting joint, according to the working in measure of each individual part[d][c][b], causes the growth of the body for building itself up in love.
translation:
  language: ru
  text: От Него всё тело, соединяемое и скрепляемое посредством каждого поддерживающего сочленения[a], при действии каждой отдельной части в отведённой ей мере производит рост тела для созидания самого себя в любви.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также варианты: «посредством каждого сочленения снабжения», «посредством каждой поддерживающей связки» или «посредством каждой связи, доставляющей необходимое».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ οὗ
  choice: От Него
  rationale: В ближайшем контексте местоимение относится ко Христу (ст. 15); личное и прописное «Него» ясно передаёт этот референт.
- source_word: πᾶν τὸ σῶμα
  choice: всё тело
  rationale: Естественное русское соответствие единственному собирательному выражению, сохраняющее полноту образа.
- source_word: συναρμολογούμενον καὶ συμβιβαζόμενον
  choice: соединяемое и скрепляемое
  rationale: 'Два страдательных причастия сохраняют различимые оттенки: составление частей в единое целое и обеспечение его связности.'
- source_word: διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας
  choice: посредством каждого поддерживающего сочленения
  rationale: «Сочленение» удерживает телесный образ ἁφή, а «поддерживающего» передаёт идею снабжения или поддержки в ἐπιχορηγία без чрезмерно узкой анатомической конкретизации.
- source_word: κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους
  choice: при действии каждой отдельной части в отведённой ей мере
  rationale: Формулировка передаёт деятельность каждой части и её соразмерность, избегая неестественной кальки «действие в мере»; «отведённой ей» эксплицирует контекстуальный смысл меры, не называя прямо того, кто её определяет.
- source_word: τὴν αὔξησιν τοῦ σώματος ποιεῖται
  choice: тело … растёт
  rationale: Идиоматическая русская передача того, что тело осуществляет собственный рост; субъект «тело» и средний залог не затушёваны.
- source_word: εἰς οἰκοδομὴν ἑαυτοῦ
  choice: созидая себя
  rationale: Сохраняет строительную метафору οἰκοδομή и возвратную силу ἑαυτοῦ в естественной русской форме.
- source_word: ἐν ἀγάπῃ
  choice: в любви
  rationale: Прямое, традиционное и современно понятное соответствие, сохраняющее возможную связь как с ростом, так и с созиданием.
theological_decisions:
- issue: Источник и участие в росте тела
  choice: Рост исходит от Христа, но осуществляется телом при соразмерном действии каждой его части.
  alternative: Представить Христа единственным непосредственным деятелем роста либо перенести основной акцент на сочленения.
  rationale: ἐξ οὗ указывает на Христа как источник, тогда как ποιεῖται грамматически относится к телу; перевод сохраняет обе стороны высказывания.
- issue: Образ ἁφῆς τῆς ἐπιχορηγίας
  choice: Сохранён конкретный телесный образ «поддерживающего сочленения».
  alternative: «связь, через которую поступает снабжение» или «связка, обеспечивающая поддержку»
  rationale: Греческое выражение допускает оттенки контакта, соединения и снабжения. Основной текст сохраняет образ тела, а примечание отмечает неоднозначность.
- issue: Сфера выражения ἐν ἀγάπῃ
  choice: «В любви» оставлено в конце, как в греческом тексте.
  alternative: Однозначно связать его только с «созидая» либо только с «растёт».
  rationale: Конечная позиция сохраняет естественную смысловую широту и не устраняет возможную синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского рассуждения. Сложное синтаксическое единство сохранено, но тяжёлая греческая конструкция упорядочена ради ясности. Термин «сочленение» несколько книжный, однако понятен и уместен в развёрнутой метафоре тела.
