  source_fidelity: 'Начальное «От Него» верно передаёт личный референт ἐξ οὗ в контексте. «Соединяемое и скрепляемое» удачно сохраняет два страдательных причастия, а «поддерживающее сочленение» обоснованно удерживает телесный образ спорного выражения διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας. Однако «тело … растёт, созидая себя» заменяет выражение τὴν αὔξησιν τοῦ σώματος ποιεῖται и целевое εἰς οἰκοδομὴν ἑαυτοῦ двумя деепричастно-смысловыми отношениями, не вполне соответствующими греческому: тело производит свой рост для собственного созидания.'
  naturalness: Черновик в целом литературен. Исправленный вариант сохраняет один период, но яснее передаёт отношения между ростом и созиданием. Формула «производит рост тела для созидания самого себя» несколько книжна, но уместна для апостольского рассуждения и точнее, чем деепричастная перестройка.
  terminology: '«Тело», «сочленение», «действие», «созидание» и «любовь» подходят регистру и сохраняют метафорический и богословски значимый словарь исходного текста. Сноску следует избавить от неточного заявления «буквально»: приведённые варианты являются возможными переводами, но не все буквально воспроизводят греческую конструкцию.'
