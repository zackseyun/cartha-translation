base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/029.yaml
  text: Let no rotten word come out of your mouth[a], but only such as is good for building up according to the need[d][c][b], so that it may give grace to those who hear.
translation:
  language: ru
  text: Пусть никакое гнилое слово не исходит из ваших уст[a], а лишь такое, которое хорошо для созидания, соответственно нужде[b], чтобы оно приносило благодать слушающим[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никакая испорченная речь» или «никакое вредное слово». Буквально: «никакое гнилое слово».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для созидания в соответствии с нуждой» или «для созидания, уместного в данных обстоятельствах».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «чтобы оно приносило пользу слушающим».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς λόγος σαπρὸς
  choice: никакое гнилое слово
  rationale: При отрицании πᾶς с существительным в единственном числе имеет распределительное значение «никакое». «Гнилое» сохраняет яркую метафору σαπρός, а «слово» в данном контексте означает произнесённую речь.
- source_word: ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω
  choice: пусть ... не исходит из ваших уст
  rationale: Передаёт запретительное повеление и сохраняет телесный образ речи, исходящей из уст; множественное «уст» естественно согласуется с обращением к нескольким адресатам.
- source_word: ἀλλὰ εἴ τις ἀγαθὸς
  choice: а только доброе
  rationale: Восполняет эллипсис через подразумеваемое «слово» и естественно выражает резкое противопоставление запрещённой и допустимой речи.
- source_word: πρὸς οἰκοδομὴν τῆς χρείας
  choice: для созидания сообразно нужде
  rationale: «Созидание» сохраняет строительную метафору οἰκοδομή и привычно, но понятно звучит по-русски. «Сообразно нужде» сохраняет сжатость и неоднозначную связь родительного τῆς χρείας, не сводя её исключительно к случаю или обстоятельству.
- source_word: ἵνα δῷ χάριν
  choice: чтобы оно несло благодать
  rationale: «Благодать» сохраняет широкий смысл χάρις — благосклонность, благой дар и пользу. Глагол «нести» естественнее русского буквального «давать благодать», при этом сохраняет действие речи на слушающих.
- source_word: τοῖς ἀκούουσιν
  choice: слушающим
  rationale: Кратко и точно передаёт субстантивированное причастие настоящего времени — тех, кто слышит или слушает произносимое.
theological_decisions:
- issue: Значение χάριν в нравственном наставлении о речи
  choice: благодать
  alternative: пользу; благо; расположение
  rationale: Контекст допускает практическую пользу для слушателей, однако «благодать» сохраняет характерную для Павла смысловую широту χάρις и не устраняет богословский и межличностный оттенок. Сноска указывает более контекстуальное прочтение.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского наставления. Сохранены образы гнилого слова, исходящего из уст, и созидания; богословски ёмкое χάρις передано как «благодать», а практический смысл отмечен в сноске.
