lexical_decisions:
- source_word: σπουδάζοντες
  choice: стараясь
  rationale: Причастие настоящего времени передаёт продолжающееся усердное стремление и связано с призывом в предыдущих стихах. «Стараясь» естественно продолжает русское предложение, а оттенок особого усердия отмечен в сноске.
- source_word: τηρεῖν
  choice: сохранять
  rationale: Глагол означает беречь и поддерживать уже существующее, а не создавать заново. «Сохранять» ясно передаёт этот смысл.
- source_word: τὴν ἑνότητα
  choice: единство
  rationale: Прямой и естественный русский эквивалент, подходящий к контексту единства верующих.
- source_word: τοῦ πνεύματος
  choice: Духа
  rationale: По ближайшему контексту Послания наиболее вероятно указание на Святого Духа; прописная буква отражает это понимание, а допустимая неоднозначность отмечена в сноске.
- source_word: ἐν τῷ συνδέσμῳ
  choice: в узах
  rationale: Образ того, что связывает и удерживает вместе, передан устойчивым русским выражением «в узах». Грамматическое число изменено ради естественности русского языка без изменения образа.
- source_word: τῆς εἰρήνης
  choice: мира
  rationale: 'Родительный падеж сохраняет компактность и неоднозначность греческой конструкции: мир может пониматься как связующая сила или как характеристика этих уз.'
theological_decisions:
- issue: К чему относится πνεύματος
  choice: к Святому Духу
  alternative: к общему духу или настрою верующих
  rationale: В Ефесянам ближайшие употребления, особенно 4:4 и 4:30, поддерживают указание на Святого Духа. Однако само существительное допускает более общее понимание, поэтому оно отражено в сноске.
- issue: Характер единства
  choice: единство уже существует и должно сохраняться
  alternative: единство должно быть создано усилиями верующих
  rationale: τηρεῖν означает сохранять или оберегать, поэтому текст призывает поддерживать данное единство, а не производить его.
- issue: Связь мира и уз
  choice: сохранена конструкция «узы мира»
  alternative: «узы, создаваемые миром» или «узы, которыми является мир»
  rationale: Греческий родительный падеж не уточняет однозначно характер отношения. Перевод не делает скрытое толкование частью основного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизмов. Формулировка сохраняет причастную связь с предыдущим контекстом, образ связывающих уз и неоднозначность родительного падежа.
