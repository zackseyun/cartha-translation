    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς / μία / ἓν
  choice: один / одна / одно
  rationale: Формы одного числительного согласованы с родом существительных. Троекратное повторение сохраняет параллелизм и подчёркивает единство.
- source_word: κύριος
  choice: Господь
  rationale: В данном контексте это христологический титул, естественно относящийся к Иисусу Христу, а не просто обозначение господина или хозяина.
- source_word: πίστις
  choice: вера
  rationale: Здесь слово наиболее естественно обозначает общую веру или доверие, объединяющее верующих; вариант «вера» сохраняет краткость и параллелизм исходного текста.
- source_word: βάπτισμα
  choice: крещение
  rationale: Общепринятое и точное обозначение крещения; перевод не уточняет его способ, действие или богословское понимание.
theological_decisions:
- issue: К кому относится титул «Господь»
  choice: Сохранён титул «Господь», наиболее естественно относящийся к Иисусу Христу.
  alternative: Общее указание на Бога.
  rationale: В последовательности Ефесянам 4:4–6 названы один Дух, один Господь и один Бог и Отец; поэтому «Господь» естественнее всего понимать как указание на Сына, не добавляя этого имени в сам текст.
- issue: Смысл выражения «одно крещение»
  choice: Нейтральное «одно крещение» без дополнительных пояснений в основном тексте.
  alternative: Специально сакраментальное понимание либо преимущественно метафорическое или духовное понимание.
  rationale: Стих утверждает единство, но сам по себе не определяет способ, действенность или конфессиональное истолкование крещения.
translation_notes:
  register: Современный литературный русский язык; сохранены лаконичность, трёхчастный параллелизм и торжественная ритмика оригинала. Строчная буква в начале и точка с запятой соответствуют положению стиха внутри продолжающегося перечня.
