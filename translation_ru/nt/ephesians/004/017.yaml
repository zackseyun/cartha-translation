id: EPH.4.17
reference: Ephesians 4:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τοῦτο οὖν λέγω καὶ μαρτύρομαι ἐν κυρίῳ, μηκέτι ὑμᾶς περιπατεῖν καθὼς καὶ ⸀τὰ ἔθνη περιπατεῖ ἐν ματαιότητι τοῦ νοὸς αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/017.yaml
  text: 'Therefore I say this and testify in the Lord: you must no longer walk as the Gentiles walk[a], in the futility of their minds,'
translation:
  language: ru
  text: 'Итак, вот что я говорю и о чём свидетельствую в Господе: вы не должны больше жить так, как живут язычники[a], — в суетности своего ума.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народы»; по смыслу здесь также возможно: «неевреи».'
    reason: Лексема ἔθνη может обозначать народы вообще или людей из других народов, то есть неевреев; перевод «язычники» в русском языке может дополнительно подчёркивать религиозный оттенок.
lexical_decisions:
- source_word: Τοῦτο οὖν
  choice: Итак, вот что я говорю
  rationale: «Итак» передаёт вывод из предшествующего наставления, а «вот что» естественно выражает указательное Τοῦτο как объект глагола.
- source_word: μαρτύρομαι
  choice: о чём свидетельствую
  rationale: Сохраняется значение торжественного личного свидетельства; относительная конструкция делает сочетание с предыдущим глаголом естественным по-русски.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Буквальная и богословски нейтральная передача сохраняет возможные оттенки сферы, единения и авторитета, не сводя выражение к «Господом» или «перед Господом».
- source_word: μηκέτι ὑμᾶς περιπατεῖν
  choice: вы не должны больше жить
  rationale: Отрицание передано во временном значении, а подразумеваемая наставительная сила инфинитива выражена словом «должны». В современном русском этическое περιπατεῖν естественно передаётся глаголом «жить»; буквальное «ходить» здесь было бы неясным библеизмом.
- source_word: καθὼς καὶ τὰ ἔθνη περιπατεῖ
  choice: так, как живут язычники
  rationale: Повтор того же глагола сохраняет риторическую структуру оригинала. «Язычники» — привычное русское обозначение ἔθνη в павловском контексте, а его более буквальное этническое значение отмечено в сноске.
- source_word: ἐν ματαιότητι
  choice: в суетности
  rationale: «Суетность» передаёт смысл пустоты, бесплодности и тщетности, сохраняя абстрактную форму оригинала и не подменяя её конкретным толкованием.
- source_word: τοῦ νοὸς αὐτῶν
  choice: своего ума
  rationale: «Ум» непосредственно передаёт νοῦς и не смешивает его с διάνοια в следующем стихе. Возвратное «своего» естественно указывает на язычников как субъект придаточной части.
theological_decisions:
- issue: Значение ἔθνη в нравственном противопоставлении, обращённом к читателям из неевреев
  choice: язычники
  alternative: народы; неевреи
  rationale: «Язычники» сохраняет устойчивую новозаветную категорию и понятно современному читателю. Сноска предупреждает, что греческое слово буквально может обозначать «народы» или «неевреев», поэтому фраза не представлена как безоговорочное суждение о каждом нееврее.
- issue: Наставительная сила инфинитива περιπατεῖν после λέγω καὶ μαρτύρομαι
  choice: вы не должны больше жить
  alternative: чтобы вы больше не жили
  rationale: Форма с «не должны» ясно передаёт настоятельное апостольское увещание, не превращая его в более сильную клятву или отдельное доктринальное утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Этическая метафора «ходить» передана естественным русским «жить», тогда как «свидетельствую в Господе» и «суетность ума» сохраняют торжественность и смысловую напряжённость оригинала.
