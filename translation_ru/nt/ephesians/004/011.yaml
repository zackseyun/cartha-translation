id: EPH.4.11
reference: Ephesians 4:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἔδωκεν τοὺς μὲν ἀποστόλους, τοὺς δὲ προφήτας, τοὺς δὲ εὐαγγελιστάς, τοὺς δὲ ποιμένας καὶ διδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/011.yaml
  text: And he himself gave some as apostles[a], some as prophets, some as evangelists, and some as shepherds and teachers[b],
translation:
  language: ru
  text: И Он Сам дал одних в качестве апостолов, других — в качестве пророков, иных — в качестве благовестников, а иных — в качестве пастырей[a] и учителей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пасторов». Греческое слово буквально означает «пастухов», то есть тех, кто пасёт стадо.'
    reason: lexical_alternative
  - marker: b
    text: В греческом перед словами «пастырей и учителей» стоит один общий артикль. Это может указывать на особенно тесную связь этих служений, но не обязательно означает одну общую должность.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: И Он Сам
  rationale: Союз сохраняет связь с предыдущим контекстом, а «Он Сам» передаёт эмфатическое αὐτός.
- source_word: ἔδωκεν
  choice: дал
  rationale: Сохраняет основное значение δίδωμι и образ людей, данных как дар; «поставил» было бы более узким толкованием.
- source_word: τοὺς μὲν … τοὺς δὲ
  choice: одних … других … иных
  rationale: Естественно передаёт распределительную конструкцию с μέν/δέ, не воспроизводя греческие артикли механически.
- source_word: ἀποστόλους
  choice: апостолов
  rationale: Прямой, общепринятый и понятный эквивалент.
- source_word: προφήτας
  choice: пророков
  rationale: Прямой и общепринятый эквивалент без необходимости смыслового расширения.
- source_word: εὐαγγελιστάς
  choice: благовестников
  rationale: Передаёт служение возвещения Благой вести и в данном перечне меньше рискует быть понятым как обозначение авторов Евангелий, чем «евангелистов».
- source_word: ποιμένας
  choice: пастырей
  rationale: Сохраняет метафору пастуха, но звучит в современном литературном русском достойно и уместно для заботы о людях.
- source_word: καὶ διδασκάλους
  choice: и учителей
  rationale: Прямо передаёт координацию двух существительных, не решая спор о том, являются ли они одной должностью.
theological_decisions:
- issue: Следует ли понимать ποιμένας как церковный титул или как образ пастуха
  choice: пастырей
  alternative: пасторов; пастухов
  rationale: «Пастырей» сохраняет исходную метафору и её церковный контекст; «пасторов» сильнее привязывает выражение к позднейшему названию должности, а «пастухов» в русском основном тексте вызвало бы неуместные бытовые ассоциации.
- issue: Обозначают ли «пастыри и учители» одну объединённую группу или две группы
  choice: Сохранить два координированных наименования без объединения в одну должность
  alternative: пастыри-учители как единая группа; две полностью отдельные группы
  rationale: Один артикль перед двумя существительными указывает на особенно тесную связь, но сам по себе не требует считать их единой должностью. Перевод сохраняет эту синтаксическую и богословскую открытость.
- issue: Означает ли ἔδωκεν назначение на должность или дарование людей общине
  choice: дал
  alternative: поставил; назначил
  rationale: «Дал» сохраняет лексическое значение и контекст дара, не сводя действие Христа исключительно к официальному назначению.
translation_notes:
  register: Современный литературный и достойный библейский регистр. Оборот «дал одних в качестве…» выбран ради сохранения значения «дал» и распределительной структуры; повтор «в качестве» делает перечень однозначным и грамматически прозрачным. Строчные буквы в названиях служений отражают их нарицательный характер.
