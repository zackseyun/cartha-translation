base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/025.yaml
  text: Therefore[a], having put away falsehood, let each one speak truth with his neighbor, because we are members of one another.
translation:
  language: ru
  text: Поэтому, отвергнув ложь[a], пусть каждый говорит правду своему ближнему, потому что мы — члены друг друга.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ложь» с определённым артиклем; возможно также понимание лжи как определённого явления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего наставления и естественно звучит в современном русском языке.
- source_word: ἀποθέμενοι
  choice: отвергнув
  rationale: Деепричастие сохраняет предшествующее главному повелению решительное отречение; «отвергнув» естественнее здесь, чем буквальное «отложив».
- source_word: τὸ ψεῦδος
  choice: ложь
  rationale: Обозначает ложь как нравственное зло и непосредственно противопоставляется правде. Греческий артикль допускает более определённое понимание, отмеченное в сноске.
- source_word: λαλεῖτε ἀλήθειαν ἕκαστος
  choice: пусть каждый говорит правду
  rationale: Передаёт повелительное наклонение и распределительное значение ἕκαστος, относя заповедь к каждому адресату.
- source_word: μετὰ τοῦ πλησίον αὐτοῦ
  choice: своему ближнему
  rationale: Русское управление глагола «говорить» требует дательного падежа; «ближний» сохраняет этико-социальный смысл πλησίον.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно передаёт причинное основание повеления.
- source_word: ἐσμὲν ἀλλήλων μέλη
  choice: мы — члены друг друга
  rationale: Сохраняет метафору членов тела и необычную взаимность греческого выражения, не добавляя отсутствующего здесь слова «тело».
theological_decisions:
- issue: Объём значения τὸ ψεῦδος
  choice: ложь как общее нравственное явление
  alternative: определённая ложь — «эта ложь»
  rationale: Контекст нравственного наставления поддерживает обобщённое значение, однако артикль позволяет услышать и более определённый оттенок; он сохранён в сноске.
- issue: Взаимность в образе членов тела
  choice: мы — члены друг друга
  alternative: мы принадлежим друг другу как члены одного тела
  rationale: Более буквальная формулировка сохраняет богословски значимый образ взаимной принадлежности, не вводя пояснение «одного тела», которого в данном стихе нет.
- issue: Распределительный характер повеления
  choice: пусть каждый говорит правду своему ближнему
  alternative: говорите правду друг другу
  rationale: Выбранный вариант сохраняет ἕκαστος и αὐτοῦ, подчёркивая личную ответственность каждого, при этом в русском языке не создаёт ненужного гендерного ограничения.
translation_notes:
  register: Современный литературный русский язык с ясной увещательной интонацией. Формулировка «члены друг друга» намеренно сохраняет выразительную необычность и образность оригинала.
