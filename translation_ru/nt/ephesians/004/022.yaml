    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθέσθαι ὑμᾶς
  choice: снять с себя
  rationale: Инфинитив сохраняет зависимость от предшествующего контекста и не превращён ни в прямое повеление, ни в указание на уже завершившееся действие. «Снять с себя» передаёт образ одежды, продолженный глаголом «облечься» в ст. 24.
- source_word: κατὰ τὴν προτέραν ἀναστροφὴν
  choice: что касается вашего прежнего образа жизни
  rationale: ἀναστροφή обозначает поведение, образ жизни; κατά здесь естественно понимать как указание на сферу или отношение. Формулировка сохраняет эту связь, не представляя прежний образ жизни как норму действия.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: ветхого человека
  rationale: Сохранено буквальное антропологическое выражение Павла и его традиционно узнаваемая русская форма. Оно обозначает прежнего человека в его целостности, а не только внутреннее «я» и не исключительно мужчину.
- source_word: τὸν φθειρόμενον
  choice: истлевающего
  rationale: Причастие настоящего времени передаёт продолжающийся процесс порчи и распада; «истлевающего» сохраняет пассивно-медиальный оттенок без сведения смысла только к нравственной испорченности.
- source_word: κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης
  choice: под властью обманчивых желаний
  rationale: κατά передано как определяющее влияние, а родительный оборот τῆς ἀπάτης — естественным русским определением «обманчивых». «Желания» не сужает значение до сексуальной похоти.
theological_decisions:
- issue: Значение выражения τὸν παλαιὸν ἄνθρωπον
  choice: ветхого человека
  alternative: прежнее «я»
  rationale: «Ветхий человек» сохраняет форму ἄνθρωπος и возможный личный, общеантропологический и корпоративный смысл. Вариант «прежнее “я”» понятнее вне контекста, но сужает образ до индивидуальной самости.
- issue: Сила инфинитива ἀποθέσθαι в контексте
  choice: снять с себя
  alternative: чтобы вы сняли с себя / вы уже сняли с себя
  rationale: Независимый русский инфинитив следует греческому синтаксису и сохраняет открытым, выражает ли фраза содержание наставления, призыв или описание усвоенной перемены.
- issue: Характер процесса в φθειρόμενον
  choice: истлевающего
  alternative: который был развращён
  rationale: Форма настоящего причастия указывает на продолжающийся процесс. Перевод не превращает его в завершённое прошлое событие и не ограничивает многозначный образ распада только нравственным развращением.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и узнаваемой павловской формулы «ветхий человек». Тире выделяют поясняющий оборот и делают сложный греческий порядок слов читаемым. Перевод оставлен синтаксически зависимым от предыдущего стиха, как и в греческом тексте.
