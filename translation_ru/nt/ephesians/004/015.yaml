lexical_decisions:
- source_word: ἀληθεύοντες
  choice: говоря истину
  rationale: Причастие может охватывать как правдивую речь, так и верность истине в поступках. В контексте противопоставления ложному учению естественнее всего «говоря истину»; более широкий смысл сохранён в примечании.
- source_word: δὲ
  choice: но
  rationale: Союз обозначает мягкое противопоставление предшествующим словам о заблуждении и обмане.
- source_word: ἐν ἀγάπῃ
  choice: с любовью
  rationale: Передаёт образ действия естественно для современного русского языка, не исключая мысли о любви как сфере христианской жизни.
- source_word: αὐξήσωμεν
  choice: будем возрастать
  rationale: Форма сослагательного наклонения первого лица множественного числа имеет побудительное значение; русское «будем возрастать» сохраняет совместный призыв и возвышенный, но понятный регистр.
- source_word: εἰς αὐτόν
  choice: в Него
  rationale: Сохраняет направительное значение εἰς и образ роста к более глубокому единению с Мессией, не сводя выражение к нейтральному «к Нему».
- source_word: τὰ πάντα
  choice: во всём
  rationale: В сочетании с глаголом роста выражение естественно понимается как всесторонний рост; буквальная форма и иной возможный оттенок отмечены в сноске.
- source_word: κεφαλή
  choice: глава
  rationale: Прямо сохраняет метафору тела и не выбирает между спорными толкованиями «источник» и «властвующий».
- source_word: Χριστός
  choice: Мессия
  rationale: Здесь слово стоит в приложении после «глава» и функционирует как титул; «Мессия» передаёт его титульное значение.
theological_decisions:
- issue: Смысловой объём ἀληθεύοντες
  choice: 'В основном тексте: «говоря истину»'
  alternative: «будучи правдивыми»; «поступая по истине»
  rationale: Ближайший контекст говорит о ложном учении и обмане, однако сам греческий глагол может относиться не только к речи. Примечание сохраняет эту смысловую широту.
- issue: Значение метафоры κεφαλή
  choice: Передано словом «глава» без поясняющего толкования
  alternative: «источник»; «владыка»
  rationale: Так перевод сохраняет образ Павла и не вносит в текст конфессионально обусловленного решения о точном характере главенства.
- issue: Направление роста в εἰς αὐτόν
  choice: «возрастать в Него»
  alternative: «возрастать к Нему»
  rationale: Формулировка сохраняет необычную пространственно-корпоративную метафору оригинала и не устраняет возможную мысль о включённости в Мессию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Побудительное «будем возрастать» понятно обычному читателю; необычное «в Него» намеренно сохраняет направительную метафору оригинала. Местоимение, относящееся к Мессии, написано с прописной буквы согласно устойчивой русской религиозной практике.
