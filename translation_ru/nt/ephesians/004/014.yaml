source:
  edition: SBLGNT
  text: ἵνα μηκέτι ὦμεν νήπιοι, κλυδωνιζόμενοι καὶ περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας ἐν τῇ κυβείᾳ τῶν ἀνθρώπων ἐν πανουργίᾳ πρὸς τὴν μεθοδείαν τῆς πλάνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/014.yaml
  text: so that we may no longer be children[a], tossed by waves and carried about by every wind of teaching, by human trickery, by craftiness in the scheming of error[c][b],
translation:
  language: ru
  text: чтобы мы уже не были младенцами, которых бросают волны и носят туда и сюда всякие ветры учения, — увлекаемыми людским мошенничеством и коварством, направленным на осуществление замысла заблуждения[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при игре людей в кости»; этот образ указывает на шулерство и мошенничество.'
    reason: cultural_note
  - marker: b
    text: 'Или: «коварством, направленным на замысел обмана». Греческое выражение допускает оттенки заблуждения, обольщения и сознательного обмана.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μηκέτι ὦμεν
  choice: чтобы мы уже не были
  rationale: Передаёт целевое значение ἵνα с сослагательным наклонением и прекращение прежнего состояния, выраженное μηκέτι.
- source_word: νήπιοι
  choice: младенцами
  rationale: Сохраняет метафору духовной незрелости и точнее передаёт возрастной оттенок νήπιοι, чем более широкое «детьми».
- source_word: κλυδωνιζόμενοι
  choice: которых бросают волны
  rationale: 'Явно сохраняет морской образ глагола: людей швыряет волнением или волнами.'
- source_word: περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας
  choice: носят туда и сюда всякие ветры учения
  rationale: Сохраняет пассивность людей, образ ветра и широкий смысл διδασκαλία как «учение», не сужая его до формальной доктрины.
- source_word: ἐν τῇ κυβείᾳ τῶν ἀνθρώπων
  choice: из-за людского обмана
  rationale: κυβεία буквально связано с игрой в кости, а переносно означает мошенничество и обман; причинное «из-за» естественно связывает выражение с неустойчивостью младенцев.
- source_word: ἐν πανουργίᾳ
  choice: из-за коварства
  rationale: Передаёт отрицательный нравственный смысл πανουργία — ловкую, недобросовестную хитрость.
- source_word: πρὸς τὴν μεθοδείαν τῆς πλάνης
  choice: ведущего к хитроумным замыслам заблуждения
  rationale: «Ведущего к» сохраняет направленность πρός; «хитроумные замыслы» передаёт преднамеренность μεθοδεία, а «заблуждение» оставляет πλάνη открытым как для ошибки, так и для обольщения.
theological_decisions:
- issue: Значение διδασκαλία
  choice: учение
  alternative: доктрина
  rationale: «Учение» — естественное современное слово с достаточной широтой; греческое выражение не требует более узкого конфессионально-технического термина.
- issue: Значение πλάνη
  choice: заблуждение
  alternative: обман
  rationale: πλάνη может обозначать и ошибочное блуждание, и обольщение. «Заблуждение» сохраняет эту смысловую напряжённость, тогда как намеренный человеческий обман уже выражен через κυβεία и πανουργία.
- issue: Связь πρὸς τὴν μεθοδείαν τῆς πλάνης
  choice: коварство, ведущее к хитроумным замыслам заблуждения
  alternative: коварство в соответствии с замыслом обмана
  rationale: Греческая конструкция с πρός сжата и допускает разные оттенки направленности или соответствия. Основной текст сохраняет направленность, не отождествляя безоговорочно заблуждение с сознательным обманом.
translation_notes:
  register: Современный литературный русский язык с сохранением энергичных морских образов оригинала. Синтаксис прояснён тире, но причинно-образная связь и неоднозначность заключительной фразы сохранены. Все маркеры сносок присутствуют в основном тексте.
