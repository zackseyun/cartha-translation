  text: Παρακαλῶ οὖν ὑμᾶς ἐγὼ ὁ δέσμιος ἐν κυρίῳ ἀξίως περιπατῆσαι τῆς κλήσεως ἧς ἐκλήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/001.yaml
  text: Therefore I[a], the prisoner in the Lord, urge you to walk worthily of the calling with which you were called[b],
translation:
  language: ru
  text: Итак, я, узник в Господе[a], призываю вас жить достойно призвания, к которому вы были призваны[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «узник Господа»; или: «узник ради Господа».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «вести жизнь, достойную призвания, к которому вы были призваны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: призываю
  rationale: Передаёт настойчивое пастырское увещание, оставаясь естественным и достойным по стилю.
- source_word: οὖν
  choice: Итак
  rationale: Ясно обозначает вывод и переход от предшествующего богословского изложения к практическому наставлению.
- source_word: δέσμιος
  choice: узник
  rationale: Точно передаёт значение «заключённый» и в данном контексте звучит естественно в современном литературном русском.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Сохраняет характерную для Павла формулировку и не сводит её смысл только к причине, цели или принадлежности.
- source_word: ἀξίως
  choice: достойно
  rationale: Выражает соответствие образа жизни полученному призванию без ненужного расширения.
- source_word: περιπατῆσαι
  choice: жить
  rationale: В этом контексте греческая метафора означает вести определённый образ жизни; «жить» ясно и естественно передаёт её смысл современному русскому читателю.
- source_word: κλήσεως
  choice: призвания
  rationale: Соответствует павловскому употреблению слова о Божьем призыве и сохраняет связь с однокоренным глаголом.
- source_word: ἧς ἐκλήθητε
  choice: которым вы были призваны
  rationale: Сохраняет формальное соответствие относительного оборота и намеренный этимологический повтор «призвание — призваны».
theological_decisions:
- issue: Смысл самоописания ὁ δέσμιος ἐν κυρίῳ
  choice: узник в Господе
  alternative: узник Господа; узник ради Господа
  rationale: Буквенная предложная конструкция сохраняет широту связи заключения Павла с Господом, не уточняя её как принадлежность или причину.
- issue: Характер κλῆσις
  choice: призвание
  alternative: зов; приглашение
  rationale: «Призвание» сохраняет богословскую ёмкость выражения и не решает сверх текста вопрос о характере и действенности Божьего призыва.
translation_notes:
  register: Современный литературный русский с достоинством апостольского увещания. Основной текст предпочитает естественное «жить» вместо буквального «ходить», а сноска сохраняет альтернативную развёрнутую формулировку. Повтор «призвания — призваны» намеренно удерживает лексику оригинала.
