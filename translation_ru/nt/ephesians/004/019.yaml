  text: οἵτινες ἀπηλγηκότες ἑαυτοὺς παρέδωκαν τῇ ἀσελγείᾳ εἰς ἐργασίαν ἀκαθαρσίας πάσης ἐν πλεονεξίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/019.yaml
  text: who[a], having become callous[c][b], gave themselves over to sensuality for the practice of every kind of impurity with greediness.
translation:
  language: ru
  text: Они, утратив всякую чувствительность[a], предали себя распутству[b], чтобы совершать всякую нечистоту с жадностью[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «став бесчувственными» или «потеряв всякое чувство»; речь идёт прежде всего о нравственной нечувствительности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «необузданности» или «бесстыдной распущенности».'
    reason: lexical_alternative
  - marker: c
    text: 'Букв.: «в алчности»; возможно также: «с ненасытной жадностью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: они
  rationale: Местоимение отсылает к язычникам, упомянутым выше. В самостоятельной нумерации стиха русское «они» естественно сохраняет эту связь, не добавляя особого смыслового акцента.
- source_word: ἀπηλγηκότες
  choice: став бесчувственными
  rationale: Перфектное причастие обозначает наступившее состояние утраты нравственной чувствительности. Формулировка передаёт и процесс, и сохраняющийся результат, не сводя значение к эмоциональному онемению.
- source_word: ἑαυτοὺς παρέδωκαν
  choice: предали себя
  rationale: Возвратное дополнение с παραδίδωμι указывает на сознательную самоотдачу пороку. «Предали себя» сохраняет активный и добровольный характер действия.
- source_word: τῇ ἀσελγείᾳ
  choice: распутству
  rationale: ἀσέλγεια означает бесстыдную, необузданную распущенность, нередко сексуальную, но не исключительно. «Распутство» понятно современному читателю и не ограничивает слово одним конкретным проступком.
- source_word: εἰς ἐργασίαν
  choice: чтобы … предаваться
  rationale: Оборот выражает направленность или цель деятельности. Глагольная конструкция звучит по-русски естественнее буквального «для совершения».
- source_word: ἀκαθαρσίας πάσης
  choice: всякой нечистоте
  rationale: Формулировка сохраняет всеохватность πάσης и нравственно-религиозную широту ἀκαθαρσία.
- source_word: ἐν πλεονεξίᾳ
  choice: ненасытно
  rationale: В данном контексте πλεονεξία, вероятнее всего, характеризует образ действия как не знающую меры жажду всё большего. Наречие естественно связывает выражение с практикой нечистоты; буквальное значение «в алчности» сохранено в примечании.
theological_decisions:
- issue: Нравственно-психологический смысл ἀπηλγηκότες
  choice: Утрата нравственной чувствительности
  alternative: Утрата всякой способности чувствовать вообще
  rationale: Контекст говорит об этическом отчуждении и добровольной отдаче нечистоте. Перевод передаёт нравственное очерствение, не внося клинического или чисто эмоционального смысла.
- issue: Объём значения ἀσέλγεια
  choice: Широкая бесстыдная распущенность
  alternative: Исключительно сексуальная безнравственность
  rationale: Хотя слово часто употребляется в сексуальном контексте, оно может обозначать более широкую необузданность. «Распутство» сохраняет эту широту и связь с последующей «нечистотой».
- issue: Связь ἐν πλεονεξίᾳ с предшествующим выражением
  choice: Характеризует ненасытный образ совершения нечистоты
  alternative: Обозначает самостоятельный порок — алчность или корыстолюбие
  rationale: Синтаксис допускает оттенок алчности как отдельного порока, однако ближайшая связь с «предаваться всякой нечистоте» поддерживает значение неумеренной, ненасытной жажды. Альтернатива указана в примечании, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Синтаксис сделан плавным и понятным, при этом сохранены добровольность самоотдачи, всеохватность нечистоты и неоднозначность πλεονεξία.
