  text: And do not grieve the Holy Spirit of God[a], in whom you were sealed for the day of redemption.
translation:
  language: ru
  text: И не огорчайте Святого Духа Божьего, в Котором вы были запечатлены на день искупления[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до дня искупления». Греческое выражение εἰς ἡμέραν ἀπολυτρώσεως означает «на день искупления» и может также пониматься во временном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπεῖτε
  choice: огорчайте
  rationale: 'Настоящее повелительное наклонение с μή передаёт запрет: «не огорчайте». Глагол сохраняет личностный и relationalный смысл причиняемой скорби; варианты «оскорбляйте» и «печальте» соответственно добавляют иной оттенок или звучат менее естественно.'
- source_word: τὸ πνεῦμα τὸ ἅγιον τοῦ θεοῦ
  choice: Святого Духа Божьего
  rationale: Сохранено полное наименование с явным родительным τοῦ θεοῦ. Формулировка естественна для современного литературного русского языка и не опускает принадлежность Богу.
- source_word: ἐν ᾧ
  choice: в Котором
  rationale: Перевод сохраняет предлог ἐν и личностную отсылку к Святому Духу. Вариант «Которым» был бы естественнее как обозначение действующего лица, но яснее вводил бы инструментальное толкование.
- source_word: ἐσφραγίσθητε
  choice: вы были запечатлены
  rationale: Аорист страдательного залога передан как совершившееся действие над адресатами; сохранён образ печати без пояснительного развёртывания его возможных значений.
- source_word: εἰς ἡμέραν ἀπολυτρώσεως
  choice: ко дню искупления
  rationale: «Ко дню» естественно передаёт направленность к будущей цели, выраженную εἰς, и не сводит оборот исключительно к значению продолжительности «до дня». Определённость дня понятна из контекста, несмотря на отсутствие артикля в греческом.
theological_decisions:
- issue: Личностная отсылка к Святому Духу в относительном обороте
  choice: «в Котором»
  alternative: «в котором» как безличная отсылка; «Которым» как указание на действующее лицо
  rationale: Грамматический род греческого πνεῦμα не определяет личностность референта. Контекст говорит о Духе, Которого можно огорчить; личностная формулировка сохраняется, но агентное значение ἐν не навязывается.
- issue: Связь запечатления с днём искупления
  choice: «ко дню искупления»
  alternative: «до дня искупления»
  rationale: Выбранный вариант сохраняет целевую и будущую направленность εἰς, не делая стих самостоятельным доказательством какой-либо детально разработанной доктрины о способе или неизменности запечатления.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Синтаксис близок к греческому, однако остаётся понятным. Написание «Котором» с прописной буквы поддерживает личностную отсылку к Святому Духу; богословски значимая неоднозначность предлога ἐν и оборота с εἰς не устранена.
