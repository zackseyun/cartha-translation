  text: ἓν σῶμα καὶ ἓν πνεῦμα, καθὼς καὶ ἐκλήθητε ἐν μιᾷ ἐλπίδι τῆς κλήσεως ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/004.yaml
  text: There is one body and one Spirit[a], just as you also were called in one hope of your calling.
translation:
  language: ru
  text: Одно тело и один Дух[a], как вы и были призваны к одной надежде вашего призвания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «один дух». Греческое слово может означать как «дух», так и «Дух»; в формуле единства этого отрывка оно, вероятнее всего, относится к Святому Духу.'
    reason: 'Лексическая и интерпретационная альтернатива: древнегреческое письмо не различает прописную и строчную буквы, поэтому референт слова πνεῦμα определяется контекстом.'
lexical_decisions:
- source_word: ἓν
  choice: одно / один / одной
  rationale: Повтор числительного сохраняет подчёркнутую тему единства; формы согласованы с родом русских существительных.
- source_word: σῶμα
  choice: тело
  rationale: Прямой эквивалент сохраняет метафору единого сообщества верующих без её истолковывающей замены.
- source_word: πνεῦμα
  choice: Дух
  rationale: В ряду утверждений Еф. 4:4–6 наиболее вероятна отсылка к Святому Духу; прописная буква передаёт это понимание, а сноска сохраняет допустимую лексическую альтернативу.
- source_word: καθὼς καὶ
  choice: как и
  rationale: Естественно передаёт сравнение и сохраняет усилительно-присоединительное καί, относящее сказанное к адресатам.
- source_word: ἐκλήθητε
  choice: вы были призваны
  rationale: Страдательная конструкция сохраняет пассивную форму и не называет явно подразумеваемого Бога как действующее лицо.
- source_word: ἐν μιᾷ ἐλπίδι
  choice: к одной надежде
  rationale: Русское «призваны к надежде» естественно выражает направленность призвания; буквальное «в одной надежде» здесь звучит менее ясно и может ошибочно обозначать состояние, а не содержание призвания.
- source_word: τῆς κλήσεως ὑμῶν
  choice: связанной с вашим призванием
  rationale: Передаёт ассоциативный родительный и сохраняет существительное «призвание», а также его лексическую связь с глаголом «были призваны», не создавая тяжёлого оборота «надежде вашего призвания».
theological_decisions:
- issue: Референт πνεῦμα
  choice: Святой Дух, обозначенный как «Дух» с прописной буквы
  alternative: единый дух, духовная общность или расположение верующих
  rationale: Контекст семичленного исповедания единства в Еф. 4:4–6 — «одно тело… один Дух… один Господь… один Бог и Отец» — сильнее поддерживает личный референт, однако греческое письмо само по себе не различает прописную и строчную буквы, поэтому альтернатива отмечена в сноске.
- issue: Отношение надежды к призванию
  choice: надежда, связанная с призванием
  alternative: надежда, к которой были призваны
  rationale: Формулировка сохраняет неопределённость родительного τῆς κλήσεως ὑμῶν и не сводит её без необходимости только к цели призвания.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным звучанием. Повтор «одно/один/одной» намеренно сохранён как риторический стержень стиха. Оборот «связанной с вашим призванием» выбран ради естественности и для сохранения смысловой широты греческого родительного.
