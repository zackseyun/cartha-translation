lexical_decisions:
- source_word: πρὸς τὸν καταρτισμὸν
  choice: для подготовки
  rationale: καταρτισμός обозначает подготовку, приведение в надлежащее состояние, оснащение всем необходимым. «Для подготовки» естественно звучит по-русски и не вносит идеи нравственного совершенства, которой здесь не требует контекст.
- source_word: τῶν ἁγίων
  choice: святых
  rationale: Это обычное у Павла обозначение верующих как посвящённых Богу. Традиционный термин сохраняет связь с другими местами посланий, не подразумевая позднейшей канонизации отдельных лиц.
- source_word: εἰς ἔργον διακονίας
  choice: к делу служения
  rationale: διακονία охватывает служение и практическую помощь; «служение» сохраняет широту значения и не ограничивает деятельность духовенством. Единственное число «делу» соответствует ἔργον.
- source_word: εἰς οἰκοδομὴν
  choice: для созидания
  rationale: οἰκοδομή буквально связано со строительством, а здесь метафорически означает укрепление и возрастание общины. «Созидание» сохраняет этот образ и соответствует dignified современному регистру.
- source_word: τοῦ σώματος
  choice: тела
  rationale: Передаёт павловскую метафору общины как единого тела без поясняющего расширения.
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь выступает как титул; «Мессия» передаёт его титулярный смысл, тогда как традиционное «Христос» указано как допустимый вариант в сноске.
theological_decisions:
- issue: Синтаксическая связь трёх целевых оборотов πρὸς ... εἰς ... εἰς
  choice: 'Формулировка сохраняет отдельные обороты: «для подготовки святых к делу служения, для созидания…», не уточняя окончательно, относится ли последнее действие непосредственно к дарам из стиха 11 или к служению святых.'
  alternative: «Чтобы подготовить святых к делу служения — к созиданию тела Мессии».
  rationale: Греческая последовательность допускает как ряд соотнесённых целей, так и развитие мысли, при котором святые подготовлены к служению, созидающему тело. Неоднозначность не следует превращать в аргумент о том, кто именно совершает служение.
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Основной текст подчёркивает значение титула «Помазанник», а сноска сохраняет привычную церковную передачу без изменения референта.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Святые», «служение», «созидание» и «тело Мессии» сохраняют павловскую лексику и метафорику; структура фразы остаётся достаточно естественной и одновременно не устраняет синтаксическую неоднозначность оригинала.
