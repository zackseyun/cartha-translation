  text: τὸ δὲ Ἀνέβη τί ἐστιν εἰ μὴ ὅτι καὶ ⸀κατέβη εἰς τὰ κατώτερα μέρη τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/009.yaml
  text: What does “he ascended” mean except that he also descended into the lower parts of the earth?[a]
translation:
  language: ru
  text: А «восшёл» — что это значит, как не то, что Он также сошёл в нижние части земли?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в нижние области, то есть на землю». Эти слова могут означать просто сошествие на землю или, более конкретно, сошествие в область мёртвых.'
    reason: Сохраняет два основных понимания неоднозначного греческого выражения τὰ κατώτερα μέρη τῆς γῆς.
lexical_decisions:
- source_word: Ἀνέβη
  choice: восшёл
  rationale: Сохраняет образ движения вверх и словесную параллель с «нисходил», а также естественно звучит в контексте цитаты.
- source_word: τί ἐστιν εἰ μὴ ὅτι
  choice: что это значит, как не то, что
  rationale: Передаёт вывод, который автор делает из слова «восшёл», естественным современным русским языком.
- source_word: καὶ κατέβη
  choice: Он и нисходил
  rationale: Частица καί передана добавочным «и»; глагол сохраняет противопоставление восхождению. Местоимение «Он» добавлено для ясности и написано с прописной буквы по принятой русской библейской традиции.
- source_word: εἰς
  choice: в
  rationale: В сочетании с винительным падежом передаёт направленное движение внутрь; русское «в нижние части» естественно выражает эту направленность.
- source_word: τὰ κατώτερα μέρη
  choice: нижние части
  rationale: Близко передаёт сравнительное κατώτερα и существительное μέρη, не заменяя неоднозначный образ толкованием.
- source_word: τῆς γῆς
  choice: земли
  rationale: 'Сохраняет родительный падеж греческого выражения и его синтаксическую неоднозначность: «части земли» либо «нижние области, то есть земля».'
theological_decisions:
- issue: Значение εἰς τὰ κατώτερα μέρη τῆς γῆς
  choice: «в нижние части земли» без уточнения, что именно имеется в виду
  alternative: «в нижние области, то есть на землю»; либо истолкование как сошествие в область мёртвых
  rationale: Греческое выражение допускает несколько синтаксических и богословских толкований. Основной текст сохраняет неоднозначность, а примечание сообщает читателю основные возможности, не утверждая одну из них как единственно верную.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Начальное δέ передано частицей «А», связывающей вопрос с предшествующей цитатой. Формулировка сохраняет риторическую структуру и намеренно не снимает неоднозначность заключительной фразы.
