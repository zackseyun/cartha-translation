lexical_decisions:
- source_word: ὀργίζεσθε
  choice: Гневайтесь
  rationale: Сохраняет повелительную форму греческого глагола и вероятную словесную связь с Пс. 4:5 по Септуагинте, не превращая напряжённое высказывание в условное.
- source_word: καὶ μὴ ἁμαρτάνετε
  choice: но не грешите
  rationale: Отрицательное повеление передано прямо; союз «но» естественно выражает в русском смысловое противопоставление, возникающее между гневом и запретом грешить.
- source_word: ὁ ἥλιος μὴ ἐπιδυέτω
  choice: Пусть солнце не зайдёт
  rationale: Естественная русская передача запретительного повеления в третьем лице, сохраняющая образ заходящего солнца.
- source_word: ἐπὶ παροργισμῷ ὑμῶν
  choice: пока вы гневаетесь
  rationale: Передаёт наиболее вероятный контекстуальный смысл как продолжающееся состояние гнева. Неоднозначность существительного παροργισμός отмечена в сноске.
theological_decisions:
- issue: Следует ли понимать начальную фразу как повеление гневаться или как условную уступку
  choice: 'Повелительная форма: «Гневайтесь, но не грешите»'
  alternative: 'Условно-уступительное понимание: «Если вы гневаетесь, не грешите»'
  rationale: Греческая форма — императив. Её сохранение передаёт форму источника и возможную отсылку к Пс. 4:5, а следующий запрет не позволяет понимать фразу как безусловное одобрение всякого гнева.
- issue: Как передать временное и нравственное ограничение гнева
  choice: «Пусть солнце не зайдёт, пока вы гневаетесь»
  alternative: «Солнце да не зайдёт над вашим гневом»
  rationale: Выбранная формулировка ясно сообщает запрет сохранять гнев до захода солнца, не превращая образное выражение в отвлечённое наставление.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Императив «Гневайтесь» сохраняет формальную и богословскую напряжённость оригинала; оборот «пока вы гневаетесь» делает вторую фразу естественной для обычного читателя. Все сноски отмечены в основном тексте.
