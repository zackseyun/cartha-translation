    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Вводит придаточное цели или результата, продолжающее предшествующую молитву; «чтобы» естественно передаёт эту связь по-русски.
- source_word: ἐξισχύσητε
  choice: были в силах
  rationale: Глагол выражает достаточную силу или способность совершить последующее действие; оборот сохраняет оттенок способности, не сводя его просто к знанию.
- source_word: καταλαβέσθαι
  choice: постичь
  rationale: В данном контексте означает охватить умом, глубоко понять; «постичь» соответствует возвышенному, но понятному регистру послания.
- source_word: σὺν πᾶσιν τοῖς ἁγίοις
  choice: вместе со всеми святыми
  rationale: Передаёт совместность участия и сохраняет обычное для Павла обозначение верующих как «святых».
- source_word: τί
  choice: каковы
  rationale: Естественно вводит перечисление измерений и не добавляет прямо не выраженного объекта; в отличие от «как велики», не усиливает количественный оттенок сверх греческого текста.
- source_word: τὸ πλάτος
  choice: ширина
  rationale: Прямое современное обозначение измерения; «широта» возможна как более традиционная или абстрактная передача.
- source_word: μῆκος
  choice: длина
  rationale: Прямой и естественный эквивалент термина измерения.
- source_word: ὕψος
  choice: высота
  rationale: Прямой и естественный эквивалент термина измерения.
- source_word: βάθος
  choice: глубина
  rationale: Прямой и естественный эквивалент термина измерения.
theological_decisions:
- issue: К чему относятся четыре измерения
  choice: Не указывать в основном тексте, что именно имеет ширину, длину, высоту и глубину.
  alternative: 'Добавить: «любви Мессии» или «Божьего замысла спасения».'
  rationale: В этом стихе греческий текст не называет предмет измерений. Его уточнение сняло бы подлинную неоднозначность и преждевременно внесло бы толкование, которое многие связывают со следующим стихом.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской молитвы. Конструкция «были в силах постичь» сохраняет мотив достаточной силы, а «каковы» позволяет естественно оставить объект четырёх измерений невыраженным.
