  text: so that you may be strong enough to comprehend[a], together with all the saints, what is the width and length and height and depth[b],
translation:
  language: ru
  text: чтобы вы вместе со всеми святыми были в силах постичь, каковы ширина[a], длина, высота и глубина[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «широта».'
    reason: lexical_alternative
  - marker: b
