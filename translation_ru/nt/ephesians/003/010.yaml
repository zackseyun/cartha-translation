id: EPH.3.10
reference: Ephesians 3:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἵνα γνωρισθῇ νῦν ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις ἐν τοῖς ἐπουρανίοις διὰ τῆς ἐκκλησίας ἡ πολυποίκιλος σοφία τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/010.yaml
  text: so that now[a], through the church, the manifold wisdom of God might be made known to the rulers and the authorities in the heavenly realms[c][b],
translation:
  language: ru
  text: чтобы теперь через Церковь многообразная[a] мудрость Бога стала известна начальствам и властям в небесных сферах[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «многогранная». Греческое слово обозначает мудрость, богатую разнообразием и имеющую множество граней.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в небесных местах». Речь идёт о небесной сфере.'
    reason: lexical_alternative
  - marker: c
    text: «Начальства и власти в небесных сферах», вероятнее всего, означают космические или духовные силы, а не только человеческих правителей.
    reason: cultural_note
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Союз вводит цель; русский «чтобы» естественно передаёт целевое значение.
- source_word: γνωρισθῇ
  choice: стала известна
  rationale: Передаёт пассивную форму и значение доведения до знания, не добавляя в текст явно названного деятеля.
- source_word: νῦν
  choice: теперь
  rationale: Прямое временное значение наречия, указывающее на нынешний этап осуществления Божьего замысла.
- source_word: ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις
  choice: начальствам и властям
  rationale: Сохраняет традиционно понятную парную формулу и допускает подразумеваемые контекстом надчеловеческие силы, не называя их прямо ангелами или духами.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: в небесных сферах
  rationale: Передаёт небесную область как сферу бытия; формулировка естественнее буквального «в небесных местах».
- source_word: διὰ τῆς ἐκκλησίας
  choice: через Церковь
  rationale: διά с родительным обозначает средство; прописная буква помогает понять ἐκκλησία как совокупную общину верующих, а не здание.
- source_word: ἡ πολυποίκιλος σοφία
  choice: многообразная мудрость
  rationale: «Многообразная» передаёт богатство, разнообразие и многочисленные грани мудрости без архаизма.
- source_word: τοῦ θεοῦ
  choice: Бога
  rationale: Родительный падеж естественно передаёт принадлежность и источник мудрости.
theological_decisions:
- issue: Кого обозначают «начальства и власти»
  choice: В основном тексте сохранены широкие наименования; примечание указывает на вероятное значение космических или духовных сил.
  alternative: Земные правители и органы власти либо одновременно земные и небесные власти.
  rationale: Уточнение «в небесных сферах» убедительно указывает на надчеловеческие силы, но сам греческий текст не определяет их точнее, поэтому перевод не добавляет слова «ангелы» или «духи».
- issue: Значение ἐκκλησία
  choice: «Церковь» как совокупная община верующих.
  alternative: Отдельное местное собрание.
  rationale: Контекст Послания к эфесянам и роль Церкви в явлении Божьего замысла указывают здесь на общую, а не только местную общину.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет целевую связь с предшествующим контекстом и поэтому начинается со строчной буквы; конечная запятая отражает форму предоставленного фрагмента. Терминология доступна широкому читателю, при этом смысловые неоднозначности вынесены в примечания.
