  text: For this reason I bend my knees to the Father,
translation:
  language: ru
  text: По этой причине я преклоняю колени перед Отцом,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτου χάριν
  choice: Поэтому
  rationale: Идиоматично передаёт основание последующего действия и сохраняет связь с предшествующим контекстом; по-русски естественнее буквального «по этой причине».
- source_word: κάμπτω τὰ γόνατά μου
  choice: я преклоняю колени
  rationale: Устойчивое и достойное русское выражение сохраняет образ сгибания колен и молитвенную позу, не сводя его просто к «становлюсь на колени».
- source_word: πρὸς
  choice: перед
  rationale: В сочетании с молитвенной позой естественно обозначает обращённость к Богу. В русском «к Отцу» после «преклоняю колени» звучит менее естественно, тогда как «перед» не меняет основного смысла.
- source_word: πατέρα
  choice: Отцом
  rationale: Контекст указывает на Бога как адресата молитвы; прописная буква отражает употребление слова как божественного наименования.
theological_decisions:
- issue: Следует ли передавать πατέρα как божественное наименование
  choice: Отцом
  alternative: отцом
  rationale: Павел говорит о молитве Богу, а следующий стих развивает тему отцовства. Прописная буква ясно обозначает референта, не добавляя отсутствующего в тексте содержания.
translation_notes:
  register: Современный литературный русский язык с традиционно-достойным, но общепонятным выражением «преклоняю колени». Пунктуация сохраняет незавершённость предложения, продолжающегося в следующем стихе.
