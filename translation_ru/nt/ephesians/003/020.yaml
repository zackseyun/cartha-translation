  source_fidelity: 'Смысл в целом передан верно: дательный адресат славословия сохранён, как и незавершённость конструкции; «сила, действующая в нас» точно передаёт κατὰ τὴν δύναμιν τὴν ἐνεργουμένην ἐν ἡμῖν. Однако «несравненно больше всего» в русском синтаксически допускает значение «больше всех/всего на свете» и недостаточно ясно выражает сравнение с тем, о чём просят или мыслят. Сравнительный союз «чем» безопасно и прямо передаёт генитив относительного местоимения после выражения превышения.'
