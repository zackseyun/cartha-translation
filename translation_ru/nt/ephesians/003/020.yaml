base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/020.yaml
  text: To the one who is able to do far beyond all that we ask or think[a], according to the power at work in us[b],
translation:
  language: ru
  text: А Тому, кто способен сделать неизмеримо больше[a], чем всё, о чём мы просим или помышляем[b], — в соответствии с силой, действующей в нас, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «безмерно больше»; греческое выражение особенно усиливает мысль о том, что это превосходит всё, о чём мы просим или помышляем.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «можем себе представить»; здесь глагол может обозначать то, что ум способен постичь или вообразить.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: Тому, кто силен
  rationale: Дательный падеж субстантивированного причастия вводит адресата славословия, которое продолжается в следующем стихе. Перевод сохраняет эту синтаксическую незавершённость и не добавляет отсутствующее в стихе слово «Бог».
- source_word: δὲ
  choice: А
  rationale: Частица обозначает переход к заключительному славословию, а не резкое противопоставление; русское «А» естественно передаёт этот переход.
- source_word: ὑπὲρ πάντα ... ὑπερεκπερισσοῦ
  choice: несравненно больше всего
  rationale: Сочетание предлога со значением превышения и усилительного наречия выражает чрезвычайную, превосходящую меру; формулировка передаёт усиление естественным современным русским языком.
- source_word: ποιῆσαι
  choice: сделать
  rationale: Сохраняется широкое и простое значение ποιέω без более узкого толкования вроде «совершить».
- source_word: ὧν αἰτούμεθα ἢ νοοῦμεν
  choice: о чём мы просим или помышляем
  rationale: «Просим» прямо передаёт αἰτούμεθα, а «помышляем» сохраняет широкий смысл умственного представления или мысли в νοοῦμεν.
- source_word: κατὰ τὴν δύναμιν
  choice: в соответствии с силой
  rationale: κατά с винительным указывает здесь на меру или соответствие, а не только на средство действия.
- source_word: τὴν ἐνεργουμένην ἐν ἡμῖν
  choice: действующей в нас
  rationale: Причастие передаёт продолжающееся действенное проявление силы; «в нас» сохраняет наиболее прямой смысл ἐν ἡμῖν, не исключая общего, церковного измерения.
theological_decisions:
- issue: Кому адресовано славословие
  choice: «Тому, кто силен» без добавления слова «Бог»
  alternative: «Богу, Который силен»
  rationale: Из контекста ясно, что речь идёт о Боге, однако в самом стихе существительное не повторено. Перевод сохраняет форму оригинала и связь со следующим стихом.
- issue: Характер действия силы в верующих
  choice: «силой, действующей в нас»
  alternative: «силой, действующей среди нас»
  rationale: Формулировка утверждает реальное действие Божьей силы в верующих, но не уточняет его посредством какой-либо конфессиональной схемы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном славословия. Начальное «А» передаёт переход δέ. Тире и конечная запятая показывают, что предложение и славословие продолжаются в Еф 3:21.
