base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/021.yaml
  text: To him be glory in the church and in Messiah Jesus through all generations forever and ever[a]. Amen.
translation:
  language: ru
  text: Ему слава в церкви и в Мессии Иисусе во все поколения, во веки веков. Аминь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτῷ ἡ δόξα
  choice: Ему слава
  rationale: Безглагольная греческая формула славословия естественно и торжественно передаётся русской безглагольной конструкцией, без добавления смыслово более определённого глагола.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: в церкви
  rationale: Сохраняет предлог ἐν и обычное для посланий Павла обозначение общины Божьего народа; соответствует параллельной конструкции далее.
- source_word: καὶ ἐν Χριστῷ Ἰησοῦ
  choice: и в Мессии Иисусе
  rationale: Сохраняет синтаксический параллелизм двух оборотов с ἐν и передаёт Χριστός как значимый титул — «Мессия».
- source_word: εἰς πάσας τὰς γενεὰς
  choice: во все поколения
  rationale: Передаёт временную протяжённость славы через каждое поколение, оставаясь близким к форме исходного выражения.
- source_word: τοῦ αἰῶνος τῶν αἰώνων
  choice: во веки веков
  rationale: Устоявшаяся русская формула славословия точно передаёт усиленное выражение неограниченной длительности.
- source_word: ἀμήν
  choice: Аминь
  rationale: Традиционная и общеупотребительная русская передача литургического утверждения.
theological_decisions:
- issue: Передача Χριστός как титула или как ставшего именем обозначения
  choice: Мессия Иисус
  alternative: Христос Иисус
  rationale: В данном сочетании Χριστός сохраняет смысл титула; «Мессия» делает этот смысл явным, не меняя референта.
- issue: Связь славы с церковью и Мессией Иисусом
  choice: Сохранены два параллельных оборота «в церкви и в Мессии Иисусе»
  alternative: «среди церкви через Мессию Иисуса»
  rationale: Исходный текст повторяет ἐν и не уточняет разные отношения; перевод не устраняет эту богословски значимую синтаксическую напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством церковного славословия. Устоявшиеся формулы «Ему слава», «во веки веков» и «Аминь» обеспечивают естественное звучание; пунктуация сохраняет непрерывность временного выражения.
