id: EPH.3.5
reference: Ephesians 3:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὃ ἑτέραις γενεαῖς οὐκ ἐγνωρίσθη τοῖς υἱοῖς τῶν ἀνθρώπων ὡς νῦν ἀπεκαλύφθη τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/005.yaml
  text: which was not made known to the sons of men in other generations as it has now been revealed to his holy apostles and prophets in the Spirit[b][a],
translation:
  language: ru
  text: которая в иных поколениях не была раскрыта сынам человеческим[a] так, как теперь открыта его святым апостолам и пророкам в Духе[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть людям, человечеству; буквально: «сынам людей».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «посредством Духа»; греческое выражение может указывать как на сферу, так и на средство откровения.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: которая
  rationale: Относительное местоимение сохраняет синтаксическую связь с существительным «тайна» в предыдущем контексте, не повторяя его в этом стихе.
- source_word: ἑτέραις γενεαῖς
  choice: в иных поколениях
  rationale: Дательный падеж понят темпорально; «иных» прямо передаёт ἑτέραις, не сужая значение до одного конкретного прошлого периода.
- source_word: οὐκ ἐγνωρίσθη
  choice: не была раскрыта
  rationale: Передаёт страдательный залог и каузативный смысл γνωρίζω — сделать известным. В сочетании с «тайной» это естественно по-русски и отличается от последующего «открыта».
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: сынам человеческим
  rationale: Сохраняет образную семитизированную форму греческого выражения; его общеантропологический смысл пояснён в сноске.
- source_word: ὡς νῦν
  choice: так, как теперь
  rationale: 'Сохраняет сравнительный смысл: прежде тайна не была раскрыта таким образом или в такой мере, как теперь.'
- source_word: ἀπεκαλύφθη
  choice: открыта
  rationale: Обычное и ясное соответствие глаголу откровения ἀποκαλύπτω, сохраняющее страдательную конструкцию.
- source_word: τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις
  choice: его святым апостолам и пророкам
  rationale: Прилагательное «святым» естественно относится к обеим однородным группам, а «его» не уточняет сверх греческого текста, относится ли местоимение в ближайшем контексте к Богу или Христу.
- source_word: ἐν πνεύματι
  choice: в Духе
  rationale: Контекст божественного откровения указывает прежде всего на Святого Духа. Предлог «в» сохраняет возможный оттенок сферы действия, не исключая значения средства.
theological_decisions:
- issue: Референт πνεύματι
  choice: Святой Дух
  alternative: человеческий дух или духовная сфера/образ действия
  rationale: В контексте откровения апостолам и пророкам наиболее вероятен Святой Дух; прописная буква отражает этот вывод, а сноска сохраняет неоднозначность отношения ἐν — сфера или средство.
- issue: Степень известности тайны в прежних поколениях
  choice: 'сравнительное отрицание: не была раскрыта так, как теперь'
  alternative: 'абсолютное отрицание: прежде совершенно не была известна'
  rationale: Конструкция οὐκ … ὡς νῦν допускает и подчёркивает сравнение способа или меры откровения; перевод не превращает её в однозначное утверждение о полном отсутствии прежнего знания.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Форма «сынам человеческим» намеренно сохраняет исходный образ и сопровождается пояснением; местоимение «его» написано со строчной буквы, чтобы не вносить отсутствующее в греческом тексте типографическое толкование.
