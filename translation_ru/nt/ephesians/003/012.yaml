  text: ἐν ᾧ ἔχομεν τὴν παρρησίαν ⸀καὶ προσαγωγὴν ἐν πεποιθήσει διὰ τῆς πίστεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/012.yaml
  text: in whom we have boldness and access with confidence through faith in him[a].
translation:
  language: ru
  text: в Котором мы имеем дерзновение и уверенный доступ через веру в Него[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через Его верность». Греческое выражение может означать как веру в Него, так и Его собственную верность.'
    reason: Сохранение подлинной неоднозначности конструкции πίστις с родительным местоимением.
lexical_decisions:
- source_word: ἐν ᾧ
  choice: в Котором
  rationale: Относительное местоимение мужского рода естественно относится к Христу из предыдущего контекста; формулировка сохраняет личный смысл пребывания во Христе.
- source_word: παρρησίαν
  choice: дерзновение
  rationale: Передаёт открытость и смелость перед Богом, не сливая значение слова с последующим πεποίθησις.
- source_word: προσαγωγὴν
  choice: доступ
  rationale: В данном контексте обозначает возможность входить в Божье присутствие; «доступ» естественно и точно передаёт эту мысль по-русски.
- source_word: ἐν πεποιθήσει
  choice: уверенный
  rationale: Оборот выражает характер доступа — с уверенностью. Прилагательное создаёт естественную русскую конструкцию «уверенный доступ» и сохраняет отличие от «дерзновения».
- source_word: διὰ τῆς πίστεως αὐτοῦ
  choice: через веру в Него
  rationale: Основной текст понимает αὐτοῦ как объект веры, что хорошо соответствует теме доступа верующих; возможное понимание как верности Христа сохранено в сноске.
theological_decisions:
- issue: Значение διὰ τῆς πίστεως αὐτοῦ
  choice: через веру в Него
  alternative: через Его верность
  rationale: Греческий родительный падеж допускает как веру, направленную на Христа, так и собственную верность Христа. Основной текст следует распространённому объектному прочтению, не устраняя альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. «Дерзновение» сохраняет традиционную богословскую ёмкость, оставаясь понятным; синтаксис упрощён до естественного русского оборота.
