  text: οὗ ⸀ἐγενήθην διάκονος κατὰ τὴν δωρεὰν τῆς χάριτος τοῦ θεοῦ ⸂τῆς δοθείσης⸃ μοι κατὰ τὴν ἐνέργειαν τῆς δυνάμεως αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/007.yaml
  text: of which I became a servant according to the gift of God's grace given to me according to the working of his power—[a]
translation:
  language: ru
  text: которого я стал служителем по дару Божьей благодати, данной мне в соответствии с действием Его силы—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которого я был поставлен служителем».'
    reason: 'Лексико-грамматическая альтернатива: форма ἐγενήθην допускает более явно пассивную передачу.'
lexical_decisions:
- source_word: οὗ
  choice: которого
  rationale: Относительное местоимение в родительном падеже относится к стоящему ранее εὐαγγέλιον («Евангелие»); русская форма сохраняет связь с ним.
- source_word: ἐγενήθην
  choice: я стал
  rationale: Передаёт обычное значение аориста γίνομαι — вступление в новое положение, не исключая подразумеваемого Божьего действия.
- source_word: διάκονος
  choice: служителем
  rationale: Передаёт функциональное значение служения Евангелию и не привносит более поздний смысл установленной церковной должности диакона.
- source_word: κατὰ τὴν δωρεὰν
  choice: по дару
  rationale: Кратко и естественно передаёт основание и меру служения, выраженные конструкцией κατά с винительным падежом.
- source_word: τῆς χάριτος τοῦ θεοῦ
  choice: Божьей благодати
  rationale: Естественная русская передача цепочки родительных падежей; дар определяется как дар Божьей благодати.
- source_word: τῆς δοθείσης μοι
  choice: данной мне
  rationale: Причастный оборот грамматически соотнесён с «благодатью» и сохраняет пассивный смысл дарования.
- source_word: κατὰ τὴν ἐνέργειαν
  choice: действием
  rationale: Творительный падеж естественно выражает действенную силу, посредством которой благодать была дана, избегая тяжёлого буквального повтора «согласно».
- source_word: τῆς δυνάμεως αὐτοῦ
  choice: Его силы
  rationale: Обычная и контекстуально точная передача δύναμις; прописная буква ясно указывает на Бога.
theological_decisions:
- issue: Характер роли Павла как διάκονος
  choice: служитель
  alternative: диакон
  rationale: Контекст говорит о служении Павла Евангелию, но не обозначает здесь формальную церковную должность.
- issue: Залоговой оттенок ἐγενήθην
  choice: я стал
  alternative: я был поставлен
  rationale: Основной текст сохраняет естественное значение вступления в роль, а примечание отражает возможный пассивный оттенок и Божье действие, не закрепляя его как единственно допустимое прочтение.
- issue: Связь τῆς δοθείσης с χάριτος
  choice: данной согласовано с благодатью
  alternative: данному согласовано с даром
  rationale: В греческом причастие стоит в родительном падеже и непосредственно согласуется с χάριτος, поэтому речь идёт о благодати, данной Павлу.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и синтаксической связи с предыдущим стихом. «Служитель» понятно широкой аудитории и не звучит как указание на особую церковную должность. Конечное тире сохраняет незавершённость развёрнутого предложения Павла.
