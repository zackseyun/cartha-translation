  variant: modern literary Russian
source:
  edition: SBLGNT
  text: κατοικῆσαι τὸν Χριστὸν διὰ τῆς πίστεως ἐν ταῖς καρδίαις ὑμῶν ἐν ἀγάπῃ· ἐρριζωμένοι καὶ τεθεμελιωμένοι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/017.yaml
  text: so that Messiah may dwell in your hearts through faith[a], being rooted and grounded in love[c][b],
translation:
  language: ru
  text: чтобы Мессия[a] через веру[b] обитал в ваших сердцах, а вы, укоренённые и утверждённые в любви[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческое Χριστός — титул со значением «Помазанник»; здесь он передан словом «Мессия».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «через доверие». Греческое πίστις может также означать доверие или верность, хотя здесь лучше всего подходит «вера».'
    reason: lexical_alternative
  - marker: c
    text: Слова «в любви» естественнее всего связывать с «укоренённые и утверждённые», хотя их можно отнести и к словам «обитал в ваших сердцах».
    reason: alternative_reading
lexical_decisions:
- source_word: κατοικῆσαι
  choice: обитал
  rationale: Глагол обозначает устойчивое пребывание, а не просто присутствие. «Обитал» сохраняет этот смысл и соответствует возвышенному, но понятному регистру молитвы; форма зависит от предшествующего оборота цели.
- source_word: τὸν Χριστόν
  choice: Мессия
  rationale: Χριστός здесь передаёт титул Помазанника. «Мессия» раскрывает титульное значение и естественно употребляется в данном контексте.
- source_word: διὰ τῆς πίστεως
  choice: через веру
  rationale: Оборот указывает на средство, посредством которого Мессия обитает в сердцах верующих. «Вера» — наиболее естественное контекстуальное значение πίστις.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: в ваших сердцах
  rationale: Сохраняется обычный библейский образ сердца как внутреннего человека, не ограниченный областью чувств.
- source_word: ἐν ἀγάπῃ
  choice: в любви
  rationale: Предложный оборот наиболее естественно относится к следующим причастиям и обозначает ту среду или основу, в которой адресаты укоренены и утверждены.
- source_word: ἐρριζωμένοι
  choice: укоренённые
  rationale: Страдательное причастие совершенного вида передаёт состояние как результат совершившегося действия и сохраняет образ растения.
- source_word: τεθεμελιωμένοι
  choice: утверждённые
  rationale: Слово сохраняет образ прочного основания и естественно сочетается по-русски с «в любви», не смешивая его буквально с предшествующим образом укоренения.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Выбран перевод титула, передающий значение «Помазанник» и не вводящий конфессионально специфического толкования. Традиционное «Христос» указано как допустимый вариант.
- issue: Значение πίστις в διὰ τῆς πίστεως
  choice: через веру
  alternative: через доверие; через верность
  rationale: В данном контексте речь, вероятнее всего, о вере как средстве пребывания Мессии в сердцах. Другие лексические оттенки слова πίστις возможны, но менее вероятны здесь.
- issue: Синтаксическая связь ἐν ἀγάπῃ
  choice: отнесено к «укоренённые и утверждённые»
  alternative: отнесено к «обитал в ваших сердцах»
  rationale: Порядок слов и развитие мысли естественнее связывают «в любви» с двумя причастиями, однако греческий текст допускает и иную пунктуационно-синтаксическую связь.
- issue: Связь причастий с продолжением молитвы
  choice: «а вы, укоренённые и утверждённые»
  alternative: «будучи укоренены и утверждены»
  rationale: Явно выраженное «вы» устраняет по-русски ошибочное впечатление, будто причастия относятся к Мессии, а незавершённая конструкция сохраняет связь со следующим стихом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены два исходных образа — укоренения и основания, а также незавершённость синтаксиса, продолжающегося в следующем стихе. Порядок «через веру» перед «обитал» выбран ради естественного русского звучания.
