  yaml_path: translation/nt/ephesians/003/015.yaml
  text: from whom every family in heaven and on earth is named,[a]
translation:
  language: ru
  text: от Которого получает имя всякая семья на небесах и на земле.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от Которого именуется вся семья на небесах и на земле»; либо: «от Которого получает имя всякий род на небесах и на земле». Греческое слово, переведённое как «семья», связано со словом «Отец» в предыдущем стихе; поэтому возможна и более истолковательная передача: «от Которого всякое отцовство на небесах и на земле получает своё имя».'
    reason: Сохраняются возможное собирательное понимание πᾶσα πατριά, более буквальная передача пассивного ὀνομάζεται, оттенок «род, родовая общность» и игра слов между πατήρ и πατριά.
lexical_decisions:
- source_word: ἐξ οὗ
  choice: от Которого
  rationale: 'Предлог ἐκ с родительным относительного местоимения указывает на источник: имя каждой семьи исходит от Отца, упомянутого в предыдущем стихе. Такая передача сохраняет связь стихов и не перегружает текст пояснениями.'
- source_word: πᾶσα
  choice: всякая
  rationale: При существительном в единственном числе πᾶσα естественно имеет распределительное значение «всякая, каждая». Возможное собирательное понимание «вся семья» сохранено в сноске.
- source_word: πατριά
  choice: семья
  rationale: πατριά обозначает семью, род или родовую общность. «Семья» — наиболее ясный современный эквивалент; «отечество» в современном русском обычно означает родину и потому вводило бы в заблуждение. Возможный смысл «род» отмечен в сноске вместе со словесной связью с Отцом.
- source_word: ἐν οὐρανοῖς
  choice: на небесах
  rationale: Форма множественного числа передана естественным для русского библейского регистра выражением «на небесах».
- source_word: ἐπὶ γῆς
  choice: на земле
  rationale: Прямая и идиоматичная передача пространственного выражения.
- source_word: ὀνομάζεται
  choice: получает имя
  rationale: Греческий пассив буквально означает «именуется, называется». В сочетании с ἐξ οὗ русское «получает имя от Которого» естественно выражает подразумеваемый источник именования, хотя немного явнее передаёт этот оттенок; более формальный вариант приведён в сноске.
theological_decisions:
- issue: Значение πᾶσα πατριά и его связь со словом «Отец» в предыдущем стихе
  choice: всякая семья
  alternative: вся семья; всякий род; всякое отцовство
  rationale: Основной текст сохраняет обычное конкретное значение πατριά и распределительную силу πᾶσα, не превращая выражение в абстрактное утверждение о всяком отцовстве и не решая заранее, идёт ли речь об одной всеобъемлющей семье. Сноска отмечает как собирательное прочтение, так и словесную связь πατριά с πατήρ.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Избегнуто устаревшее «отечество», которое сегодня прежде всего означает родину. Конструкция «получает имя» выбрана ради естественности по-русски и ясного выражения отношения источника, а формально более близкое «именуется» сохранено в сноске.
