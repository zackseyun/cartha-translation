  text: εἴ γε ἠκούσατε τὴν οἰκονομίαν τῆς χάριτος τοῦ θεοῦ τῆς δοθείσης μοι εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/002.yaml
  text: assuming indeed that you have heard of the stewardship of God's grace that was given to me for you[b][a],
translation:
  language: ru
  text: если[a] вы действительно слышали о домостроительстве[b] Божьей благодати, данной мне для вас,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если вы и правда слышали». Греческий текст сохраняет условную форму, хотя Павел, вероятно, предполагает, что это известно читателям.'
    reason: alternative_reading
  - marker: b
    text: '«Домостроительство» здесь означает вверенное управление; также возможно: «поручение», «служение» или «управление». «Данной мне» грамматически относится к «благодати».'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: если вы действительно
  rationale: 'Сохраняет условную форму греческого выражения и допускает его риторический оттенок: Павел, вероятно, исходит из того, что читатели об этом слышали.'
- source_word: ἠκούσατε
  choice: слышали
  rationale: Естественно передаёт аорист как целостный факт слышания; контекст не требует искусственно уточнять завершённость действия.
- source_word: οἰκονομίαν
  choice: домостроительстве
  rationale: В данном контексте обозначает вверенное управление или служение; традиционный библейский термин сохраняет образ распорядителя, хотя нуждается в пояснении.
- source_word: χάριτος τοῦ θεοῦ
  choice: Божьей благодати
  rationale: 'Сохраняет обычную для Павла лексику и родительную связь: благодать исходит от Бога и принадлежит Ему.'
- source_word: τῆς δοθείσης μοι
  choice: вверенном мне
  rationale: Передаёт пассивное получение поручения и естественно соотносит причастие с домостроительством благодати; греческая конструкция допускает тесную связь и с самой благодатью.
- source_word: εἰς ὑμᾶς
  choice: для вас
  rationale: Передаёт направленность и благотворную цель порученного Павлу служения по отношению к читателям.
theological_decisions:
- issue: Значение «домостроительства Божьей благодати»
  choice: Вверенное Павлу управление или поручение, связанное с Божьей благодатью и предназначенное для читателей.
  alternative: Более отвлечённо — Божий замысел или устроение спасения.
  rationale: Ближайший контекст подчёркивает порученное Павлу служение язычникам, но выбранная формулировка не отрицает более широкий Божий замысел.
- issue: Сила εἴ γε
  choice: Условная формулировка с подразумеваемым ожиданием, что читатели действительно слышали.
  alternative: 'Прямое условие, выражающее реальную неуверенность: «если только вы слышали».'
  rationale: Сохранено подлинное условное напряжение греческого текста без превращения его ни в категорическое утверждение, ни в выражение явного сомнения.
- issue: К чему относится τῆς δοθείσης μοι
  choice: В основном к вверенному Павлу домостроительству благодати.
  alternative: Непосредственно к благодати, данной Павлу.
  rationale: Грамматически форма согласуется с «благодатью», однако по смыслу вся конструкция описывает данное Павлу поручение; сжатое «вверенном мне» естественно передаёт эту тесную связь, а примечание сохраняет неоднозначность.
translation_notes:
  register: Современный литературный русский с сохранением традиционного библейского термина «домостроительство», пояснённого в сноске. Строчная начальная буква и конечная запятая отражают синтаксическую незавершённость стиха в составе предложения 3:1–7.
