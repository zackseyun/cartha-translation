source:
  edition: SBLGNT
  text: εἶναι τὰ ἔθνη συγκληρονόμα καὶ σύσσωμα καὶ συμμέτοχα τῆς ἐπαγγελίας ⸂ἐν Χριστῷ Ἰησοῦ⸃ διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/006.yaml
  text: that the Gentiles are fellow heirs[a], fellow members of the body, and fellow partakers of the promise in Messiah Jesus through the gospel[c][b],
translation:
  language: ru
  text: 'а именно: язычники[a] — сонаследники, члены одного тела и соучастники обещания в Мессии Иисусе[b] через Евангелие.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народы». Здесь имеются в виду неевреи, которые вместе с Израилем включены в Божье спасительное обещание.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционный перевод: «во Христе Иисусе». Греческое Χριστός передано здесь словом «Мессия», чтобы сохранить значение титула.'
    reason: alternative_rendering
lexical_decisions:
- source_word: εἶναι
  choice: 'а именно: … —'
  rationale: Инфинитив раскрывает содержание «тайны» из предыдущего стиха. Русская пояснительная конструкция естественно передаёт эту зависимость, не превращая фрагмент в самостоятельное утверждение без связи с контекстом.
- source_word: τὰ ἔθνη
  choice: язычники
  rationale: В данном контексте речь идёт не о государствах или народах как политических образованиях, а о неевреях, включённых вместе с Израилем в Божье обещание.
- source_word: συγκληρονόμα
  choice: сонаследники
  rationale: Приставка συν- указывает на совместное обладание наследием; «сонаследники» кратко и ясно сохраняет эту мысль.
- source_word: σύσσωμα
  choice: члены одного тела
  rationale: Редкое сложное слово выражает принадлежность к одному и тому же телу. Такое выражение сохраняет телесный образ и звучит по-русски естественнее буквального неологизма.
- source_word: συμμέτοχα
  choice: соучастники
  rationale: Слово обозначает тех, кто совместно участвует в чём-либо; «соучастники» поддерживает параллель с «сонаследниками», не добавляя нового содержания.
- source_word: τῆς ἐπαγγελίας
  choice: обещания
  rationale: 'Родительный падеж зависит от συμμέτοχα: язычники совместно участвуют в обещании. Единственное число исходного текста сохранено.'
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  rationale: Χριστός здесь сохраняет смысл титула в рассуждении об исполнении Божьего обещания; «Мессия» делает этот смысл явным, а порядок слов следует греческому тексту.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: через Евангелие
  rationale: 'διά с родительным падежом обозначает средство: именно через возвещённое Евангелие язычники становятся участниками обещания.'
theological_decisions:
- issue: Титульное или ставшее именем употребление Χριστός
  choice: Мессия Иисус
  alternative: Христос Иисус
  rationale: В контексте раскрытия Божьего замысла и включения язычников в обещание титульный мессианский смысл остаётся активным. В сноске сохранён традиционный русский вариант.
- issue: Значение τὰ ἔθνη
  choice: язычники
  alternative: народы
  rationale: Контекст противопоставления евреев и неевреев требует обозначения нееврейских народов, а не народов вообще; сноска сохраняет формально возможный вариант.
- issue: Характер единства в σύσσωμα
  choice: члены одного тела
  alternative: составляют одно тело
  rationale: Выбранный вариант сохраняет образ совместной принадлежности к единому телу и параллельный ряд именных сказуемых, не определяя сверх текста устройство или границы этого тела.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Сохранён ритмический трёхчленный ряд; буквальный неологизм для σύσσωμα отвергнут как неестественный. «Евангелие» употреблено как устойчивое русское обозначение благой вести.
