  text: ἐμοὶ τῷ ἐλαχιστοτέρῳ πάντων ἁγίων ἐδόθη ἡ χάρις αὕτη— ⸀τοῖς ἔθνεσιν εὐαγγελίσασθαι ⸂τὸ ἀνεξιχνίαστον πλοῦτος⸃ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/008.yaml
  text: To me[a], the very least of all the saints, this grace was given—to proclaim to the Gentiles the unsearchable riches of Messiah[c][b],
translation:
  language: ru
  text: Мне, наименьшему из всех святых[a], дана эта благодать — возвещать язычникам[b] неисследимое богатство Христа[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможна усиленная передача: «меньшему, чем наименьший из всех святых». Необычная греческая форма подчёркивает крайнее смирение Павла.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «народам». В данном контексте имеются в виду неевреи, то есть языческие народы.'
    reason: lexical_alternative
  - marker: c
    text: То есть Помазанника, Мессии. Греческое Χριστός — титул, традиционно передаваемый по-русски словом «Христос».
    reason: translation_clarification
lexical_decisions:
- source_word: ἐλαχιστοτέρῳ
  choice: самому малому
  rationale: Необычная усиленная сравнительно-превосходная форма выражает крайнюю степень смирения Павла. «Самому малому» естественно звучит по-русски и сохраняет усиление, не воспроизводя буквально неловкое «меньшему наименьшего».
- source_word: ἁγίων
  choice: святых
  rationale: В посланиях Павла слово обычно обозначает всех принадлежащих Богу верующих как освящённый народ; «святых» кратко и лексически точно передаёт это употребление.
- source_word: χάρις
  choice: благодать
  rationale: Здесь речь о дарованной Богом милости, проявившейся также в порученном Павлу служении. «Благодать» сохраняет широкий смысл греческого слова и связь с богословской лексикой Павла.
- source_word: εὐαγγελίσασθαι
  choice: возвещать
  rationale: Инфинитив обозначает провозглашение благой вести. При следующем прямом дополнении «богатство Христа» глагол «возвещать» звучит естественно и не требует добавления отсутствующего в тексте существительного «Евангелие».
- source_word: ἔθνεσιν
  choice: язычникам
  rationale: В данном контексте имеются в виду нееврейские народы, а не политические нации; традиционное русское «язычникам» ясно передаёт противопоставление иудеев и неиудеев.
- source_word: ἀνεξιχνίαστον
  choice: неисследимое
  rationale: Слово обозначает то, что невозможно до конца проследить, исследовать или постичь. «Неисследимое» сохраняет образ и остаётся понятным в современном литературном русском.
- source_word: πλοῦτος
  choice: богатство
  rationale: Греческое существительное стоит в единственном числе и метафорически обозначает безмерное изобилие того, что заключено во Христе; русское собирательное единственное число соответствует форме источника.
- source_word: Χριστοῦ
  choice: Христа
  rationale: «Христос» — укоренившаяся русская передача греческого титула Χριστός; форма родительного падежа естественно выражает принадлежность или связь богатства со Христом.
theological_decisions:
- issue: Смысл дарованной «благодати»
  choice: Сохранено слово «благодать» без сведения его только к должности или способности
  alternative: «Мне был дан этот благодатный дар / это поручение»
  rationale: Греческий текст позволяет слышать одновременно Божью милость и дарованное ею служение; более узкая передача преждевременно устранила бы эту смысловую объёмность.
- issue: Передача Χριστοῦ
  choice: Христа
  alternative: Мессии
  rationale: Оба варианта передают титул «Помазанник», однако «Христос» в современном русском библейском употреблении является естественной и узнаваемой формой, не превращающей титул в частное вероучительное толкование.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис следует греческому движению мысли, а тире подчёркивает содержание дарованной Павлу благодати. Избегаются как архаичное «благовествовать язычникам», так и канцелярские или узкоконфессиональные формулировки.
