id: EPH.3.4
reference: Ephesians 3:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πρὸς ὃ δύνασθε ἀναγινώσκοντες νοῆσαι τὴν σύνεσίν μου ἐν τῷ μυστηρίῳ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/004.yaml
  text: By reading this[a], you are able to understand my insight into the mystery of Messiah,
translation:
  language: ru
  text: Читая это, вы можете постичь, как я понимаю тайну Мессии[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа». Греческий титул Χριστός можно передать как «Мессия» или, по традиции, как «Христос».'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς ὃ … ἀναγινώσκοντες
  choice: Читая это
  rationale: Оборот отсылает к только что написанному Павлом и указывает на чтение как средство понимания. Такая передача естественна по-русски и сохраняет связь с предшествующим текстом.
- source_word: δύνασθε
  choice: вы можете
  rationale: Передаёт способность или возможность, выраженную глаголом δύναμαι, без ненужного усиления.
- source_word: νοῆσαι τὴν σύνεσίν μου
  choice: постичь, как я понимаю
  rationale: Греческое сочетание буквально говорит о постижении Павлова понимания. Преобразование существительного в придаточную конструкцию устраняет тяжеловесное русское «понять моё понимание», сохраняя различие между актом постижения читателей и пониманием Павла.
- source_word: ἐν τῷ μυστηρίῳ
  choice: тайну
  rationale: Предлог ἐν обозначает здесь область или предмет понимания. В русской конструкции «понимаю тайну» это отношение передаётся естественно без отдельного предлога.
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь сохраняет значение титула. «Мессия» передаёт его смысл в современном русском, тогда как традиционная форма «Христос» дана в сноске.
theological_decisions:
- issue: Значение родительного τοῦ Χριστοῦ при слове «тайна»
  choice: тайна Мессии
  alternative: тайна о Мессии
  rationale: 'Буквальная родительная конструкция сохраняет возможную смысловую широту: это может быть тайна, относящаяся к Мессии, раскрываемая в Нём или имеющая Его своим содержанием. Вариант «о Мессии» неоправданно сужает эту связь.'
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном контексте слово функционирует как богословский титул; смысловой перевод «Мессия» это ясно показывает, а традиционный эквивалент сохраняется в примечании.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Причастная конструкция передана естественным деепричастным оборотом; повтор однокоренных слов устранён без потери смыслового различия. Конечная запятая сохранена, поскольку стих синтаксически продолжается далее.
