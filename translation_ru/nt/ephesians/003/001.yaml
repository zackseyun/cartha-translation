source:
  edition: SBLGNT
  text: Τούτου χάριν ἐγὼ Παῦλος ὁ δέσμιος τοῦ Χριστοῦ Ἰησοῦ ὑπὲρ ὑμῶν τῶν ἐθνῶν—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/001.yaml
  text: For this reason I[a], Paul[c][b], the prisoner of Messiah Jesus on behalf of you Gentiles—
translation:
  language: ru
  text: Поэтому я, Павел, узник Мессии Иисуса ради вас, язычников,—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτου χάριν
  choice: Поэтому
  rationale: Оборот указывает на предшествующее рассуждение и естественно передаётся как причинно-следственная связка; фраза остаётся незавершённой и продолжается после отступления Павла.
- source_word: ἐγὼ Παῦλος
  choice: я, Павел,
  rationale: Явное местоимение сохраняет риторическое выделение говорящего, а имя оформлено как приложение по нормам русского языка.
- source_word: ὁ δέσμιος
  choice: узник
  rationale: Точно и литературно передаёт человека, находящегося в заключении, не добавляя отсутствующего в тексте указания на цепи.
- source_word: τοῦ Χριστοῦ Ἰησοῦ
  choice: Мессии Иисуса
  rationale: 'Χριστός передан как титул «Мессия», а родительный падеж сохраняет ёмкую связь: Павел — узник, принадлежащий Мессии и заключённый вследствие служения ему.'
- source_word: ὑπὲρ ὑμῶν
  choice: ради вас
  rationale: Естественно выражает благотворно-целевое значение ὑπέρ применительно к заключению Павла.
- source_word: τῶν ἐθνῶν
  choice: язычников
  rationale: В обращении к читателям слово обозначает людей из нееврейских народов, а не государства или нации; запятые ясно передают приложение к «вас».
theological_decisions:
- issue: Передача Χριστοῦ как титула или как традиционной именной формы
  choice: Мессии Иисуса
  alternative: Христа Иисуса
  rationale: В данном сочетании Χριστός сохраняет значение титула; «Мессия» делает его смысл явным, не превращая в фамилию или часть имени.
- issue: Характер связи в выражении «узник Мессии Иисуса»
  choice: Сохранён родительный падеж без разъясняющей вставки
  alternative: узник за Мессию Иисуса / узник, принадлежащий Мессии Иисусу
  rationale: Греческий генитив допускает смысл принадлежности и служения, связанного с заключением; перевод не устраняет эту содержательную ёмкость.
translation_notes:
  register: 'Современный литературный русский язык с достоинством апостольского послания. Синтаксическая незавершённость оригинала сохранена с помощью тире: начатая мысль прерывается последующим отступлением.'
