lexical_decisions:
- source_word: κατὰ ἀποκάλυψιν
  choice: через откровение
  rationale: Предлог κατά с винительным здесь указывает на способ, посредством которого тайна стала известна. «Через откровение» естественно по-русски и сохраняет связь с божественным раскрытием, не называя прямо подразумеваемого деятеля.
- source_word: ἐγνωρίσθη μοι
  choice: была открыта мне
  rationale: Пассивная форма γνωρίζω означает «была сделана известной мне». Русское «была открыта мне» передаёт пассив и в данном контексте звучит естественнее буквального «была сделана известной», хотя частично перекликается со словом «откровение».
- source_word: τὸ μυστήριον
  choice: тайна
  rationale: В употреблении Павла это прежде сокрытый, а теперь раскрытый Божий замысел. «Тайна» сохраняет богословскую категорию текста и не подменяет её разъясняющей парафразой.
- source_word: καθὼς
  choice: как
  rationale: Простой сравнительный союз точно и естественно связывает утверждение с ранее написанным.
- source_word: προέγραψα
  choice: я уже писал
  rationale: В контексте глагол указывает на написанное ранее, вероятнее всего выше в этом же послании. Частица «уже» естественно передаёт предшествование без уточнения, которого нет в стихе.
- source_word: ἐν ὀλίγῳ
  choice: кратко
  rationale: Идиоматическое выражение обозначает краткость изложения; «кратко» ясно и естественно для современного русского языка.
theological_decisions:
- issue: Значение μυστήριον у Павла
  choice: Сохранить «тайна» как обозначение прежде сокрытого и ныне открытого Божьего замысла, не раскрывая его содержания в самом стихе.
  alternative: «секрет»; «сокрытый Божий замысел»
  rationale: Стих называет понятие, но не даёт здесь полного определения. Слово «тайна» сохраняет богословскую напряжённость и позволяет последующему контексту раскрыть содержание.
- issue: Подразумеваемый деятель в ἐγνωρίσθη
  choice: Сохранить пассив «была открыта», не добавляя прямо «Богом».
  alternative: «Бог открыл мне»
  rationale: Божественный источник подразумевается контекстом откровения, однако в греческом тексте деятель прямо не назван; перевод не должен устранять эту формальную неопределённость.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Начальное «что» сохраняет синтаксическую зависимость стиха от предыдущего предложения. Формулировка избегает тяжеловесного буквализма «была сделана известной», но удерживает пассив и не называет прямо деятеля.
