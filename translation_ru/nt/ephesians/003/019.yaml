source:
  edition: SBLGNT
  text: γνῶναί τε τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην τοῦ Χριστοῦ, ἵνα πληρωθῆτε εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/019.yaml
  text: and to know the love of Messiah that surpasses knowledge[b][a], so that you may be filled unto all the fullness of God.
translation:
  language: ru
  text: и познать любовь Мессии[a], превосходящую знание, чтобы вы были исполнены до всей полноты Бога[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по традиции: «любовь Христа». Греческое выражение формально также может означать любовь к Мессии, хотя контекст скорее говорит о его любви.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «наполниться всей полнотой Бога». Буквально греческий текст говорит о наполнении «до» всей полноты Бога; это сжатое выражение может подчёркивать движение к полноте как к цели или мере.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναί τε
  choice: и познать
  rationale: Инфинитив координируется с предыдущими прошениями молитвы; «познать» сохраняет как смысл осмысления, так и возможный опытный оттенок.
- source_word: τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην
  choice: превосходящую знание любовь
  rationale: 'Сохраняется парадокс: Павел просит познать любовь, которая превосходит знание. Причастная конструкция естественна для современного литературного русского.'
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Χριστός передаётся как титул «Мессия»; родительный падеж сохранён без уточнения, идёт ли речь о любви Мессии или любви к Мессии.
- source_word: ἵνα πληρωθῆτε
  choice: чтобы вам исполниться
  rationale: Передаёт целевое или результативное значение ἵνα и пассивную семантику πληρόω; «исполниться» здесь звучит возвышенно, но остаётся понятно в библейском контексте.
- source_word: εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: до всей полноты Бога
  rationale: «До» сохраняет направленность εἰς к цели или мере и не сводит выражение к простому «наполниться всей полнотой».
theological_decisions:
- issue: Значение родительного τοῦ Χριστοῦ
  choice: любовь Мессии
  alternative: любовь Христа; любовь, которую Мессия проявляет; любовь к Мессии
  rationale: Формальная родительная конструкция сохраняет присущую греческому выражению неоднозначность, хотя контекст преимущественно указывает на любовь Мессии к верующим.
- issue: Передача εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: исполниться до всей полноты Бога
  alternative: наполниться всей полнотой Бога
  rationale: Основной текст сохраняет направительное значение εἰς и сжатость выражения, не вводя более определённого метафизического толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Синтаксическая сжатость и богословская напряжённость оригинала сохранены; архаическое «дабы» не используется.
