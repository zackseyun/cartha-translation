  source_fidelity: 'Смысловая структура оригинала в целом передана верно: γνῶναί τε — «и познать», парадокс «любовь, превосходящая знание» сохранён, а родительный τοῦ Χριστοῦ не истолкован однозначно. Однако «вам исполниться» неудачно передаёт πληρωθῆτε: по-русски это прежде всего «осуществиться/сбыться» либо возвратное действие, тогда как в греческом стоит страдательная форма «быть наполненными».'
