  text: διὸ αἰτοῦμαι μὴ ⸀ἐγκακεῖν ἐν ταῖς θλίψεσίν μου ὑπὲρ ὑμῶν, ἥτις ἐστὶν δόξα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/013.yaml
  text: Therefore I ask you not to lose heart because of my afflictions for your sake[b][a], which are your glory.
translation:
  language: ru
  text: 'Поэтому прошу вас не падать духом из-за моих страданий ради вас: это — ваша слава.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которая есть ваша слава». Единственное число может указывать на всю мысль о страданиях Павла ради адресатов.'
    reason: Уточнение грамматической неоднозначности относительного местоимения и его смысловой связи.
lexical_decisions:
- source_word: διὸ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассуждения кратко и естественно.
- source_word: αἰτοῦμαι
  choice: прошу вас
  rationale: Адресат просьбы подразумевается контекстом; добавление «вас» делает русскую фразу ясной, не изменяя её смысла.
- source_word: μὴ ἐγκακεῖν
  choice: не падать духом
  rationale: Естественная русская идиома, передающая утрату мужества или стойкости, обозначенную глаголом ἐγκακέω.
- source_word: ἐν ταῖς θλίψεσίν μου
  choice: из-за моих страданий
  rationale: Предлог ἐν здесь естественно понимать как указание на обстоятельство или причину уныния; «страдания» ясно передаёт тяжесть θλῖψις.
- source_word: ὑπὲρ ὑμῶν
  choice: ради вас
  rationale: Передаёт значение пользы и служения адресатам, выраженное ὑπέρ.
- source_word: ἥτις ἐστὶν δόξα ὑμῶν
  choice: это — ваша слава
  rationale: Указательное «это» естественно соотносит единственное число относительного местоимения со всей предшествующей мыслью, а «слава» сохраняет богословскую и риторическую ёмкость δόξα.
theological_decisions:
- issue: К чему относится ἥτις ἐστὶν δόξα ὑμῶν
  choice: К страданиям Павла ради адресатов, рассматриваемым как единое целое
  alternative: Ко всему служению Павла и связанным с ним страданиям ради них
  rationale: Ближайшее смысловое основание — «мои страдания ради вас», однако форма единственного числа позволяет охватить всю предшествующую мысль. Слово «это» сохраняет такую широту и не вводит более узкого доктринального толкования.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и достоинственная. «Не падать духом» понятно широкому кругу читателей, а «слава» сохраняет насыщенность исходного богословского образа.
