base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/009.yaml
  text: and to bring to light for everyone what is the administration of the mystery hidden from the ages in God[a], who created all things[b],
translation:
  language: ru
  text: и открыть всем, в чём состоит порядок осуществления[a] тайны, сокрытой от веков[b] в Боге, сотворившем всё,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «управление тайной», «домостроительство тайны» или «замысел тайны».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «скрытой на протяжении веков»; более истолковательно: «сокрытой от вечности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωτίσαι
  choice: открыть
  rationale: Передаёт значение «сделать явным, вывести на свет» и естественно сочетается в русском языке с последующим придаточным «в чём состоит…»; инфинитив продолжает выражение цели в контексте.
- source_word: πάντας
  choice: всем
  rationale: Дательный падеж естественно обозначает всех людей, которым должно быть открыто содержание сказанного.
- source_word: τίς ἡ οἰκονομία
  choice: в чём состоит устроение
  rationale: «Устроение» сохраняет смысл порядка осуществления или управления, не сводя οἰκονομία только к замыслу и не вводя позднейший специальный богословский термин.
- source_word: μυστήριον
  choice: тайна
  rationale: Обычное и укоренившееся русское соответствие павловскому обозначению прежде сокрытого, а ныне открываемого Божьего замысла.
- source_word: ἀποκεκρυμμένου
  choice: сокрытой
  rationale: Передаёт совершенный пассив и сохраняющееся состояние сокрытости; согласование относится к слову «тайна».
- source_word: ἀπὸ τῶν αἰώνων
  choice: от веков
  rationale: Близко следует греческой формулировке и сохраняет её временную неоднозначность, не заменяя «века» более определённым понятием вечности.
- source_word: ἐν τῷ θεῷ
  choice: в Боге
  rationale: Сохраняет прямое пространственно-образное выражение с ἐν и не ослабляет его до «у Бога».
- source_word: τῷ τὰ πάντα κτίσαντι
  choice: сотворившем всё
  rationale: Причастный оборот естественно описывает Бога и точно передаёт τὰ πάντα без добавления «сущее» или «вещи».
theological_decisions:
- issue: Значение οἰκονομία применительно к тайне
  choice: устроение
  alternative: управление; домостроительство; замысел
  rationale: «Устроение» охватывает порядок осуществления тайны и сохраняет управленческий оттенок слова, но не навязывает конфессионально нагруженное прочтение.
- issue: Временное значение ἀπὸ τῶν αἰώνων
  choice: от веков
  alternative: на протяжении веков; от вечности
  rationale: Греческий текст прямо говорит о «веках»; буквальное выражение сохраняет напряжение между давним сокрытием и возможным указанием на изначальность, не отождествляя его безоговорочно с вечностью.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Открыть всем» звучит естественнее буквального «просветить всех относительно того, каково…», а «сокрытой от веков» сохраняет формальную и богословскую неоднозначность оригинала.
