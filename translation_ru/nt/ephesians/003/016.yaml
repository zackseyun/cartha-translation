lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт цель и содержание молитвенного прошения Павла, естественно продолжая синтаксис предыдущего стиха.
- source_word: δῷ
  choice: дал
  rationale: Аорист конъюнктива δίδωμι под управлением ἵνα; «дал» точно и естественно в русском молитвенном контексте.
- source_word: κατὰ τὸ πλοῦτος τῆς δόξης αὐτοῦ
  choice: по богатству Своей славы
  rationale: κατά с винительным указывает на меру или соответствие; «по богатству» сохраняет этот смысл, не сводя его к получению лишь части богатства.
- source_word: δυνάμει
  choice: силой
  rationale: Дательный падеж средства при κραταιωθῆναι; творительный «силой» кратко и точно передаёт средство укрепления.
- source_word: κραταιωθῆναι
  choice: укрепиться
  rationale: Передаёт становление сильными; русская возвратная форма естественна и не подразумевает, что люди укрепляют себя, поскольку средство и действующий через него Божий Дух названы далее.
- source_word: διὰ τοῦ πνεύματος αὐτοῦ
  choice: через Его Духа
  rationale: διά с родительным обозначает посредство или действие; прописная буква отражает наиболее вероятную отсылку к Божьему Духу.
- source_word: εἰς τὸν ἔσω ἄνθρωπον
  choice: во внутреннем человеке
  rationale: Фраза обозначает внутреннюю сторону человеческой личности как область или цель укрепления. Такая формулировка сохраняет павловский образ и звучит понятно по-русски.
theological_decisions:
- issue: Кого обозначает πνεῦμα
  choice: Божьего Духа («Его Духа»)
  alternative: дух как безличная божественная сила или влияние
  rationale: Контекст говорит о Божьем действии в верующих, а употребление Павлом πνεῦμα убедительно указывает здесь на Божьего Духа; перевод не добавляет определения «Святой», отсутствующего в греческом тексте.
- issue: Передача ἔσω ἄνθρωπον
  choice: «внутренний человек»
  alternative: «внутренняя сущность» или «внутреннее естество»
  rationale: Сохранён буквальный и характерный для Павла образ человека; выражение относится к внутренней личности вообще, а не только к мужчинам.
translation_notes:
  register: Современный литературный русский с сохранением достоинства молитвенной речи и павловского образа. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятому русскому библейскому регистру. Конечная запятая сохранена, поскольку стих синтаксически продолжается.
