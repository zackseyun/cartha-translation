lexical_decisions:
- source_word: κατὰ
  choice: согласно
  rationale: С винительным падежом обозначает соответствие; «согласно» естественно связывает этот стих с предшествующим высказыванием.
- source_word: πρόθεσιν
  choice: замыслу
  rationale: Передаёт намерение и целенаправленный план Бога; в данном контексте по-русски естественнее, чем более отвлечённое «намерение».
- source_word: τῶν αἰώνων
  choice: вечному
  rationale: Так естественно передаётся временной смысл греческого родительного множественного «веков»; буквальная форма сохранена в примечании.
- source_word: ἣν ἐποίησεν
  choice: который Он осуществил
  rationale: Относительное местоимение относится к «замыслу», а ἐποίησεν в таком сочетании указывает на его воплощение в действии. Заглавное «Он» ясно обозначает Бога как подразумеваемого деятеля.
- source_word: ἐν
  choice: в
  rationale: Сохранено прямое значение предлога и не устранена возможная смысловая напряжённость между сферой и орудием действия.
- source_word: Χριστῷ
  choice: Мессии
  rationale: Здесь Χριστός сохраняет значение титула; «Мессия» раскрывает его смысл и иудейский фон.
- source_word: Ἰησοῦ
  choice: Иисусе
  rationale: Общепринятая русская форма имени в предложном падеже после «в».
- source_word: κυρίῳ ἡμῶν
  choice: нашем Господе
  rationale: Точно передаёт титул κύριος и зависимое притяжательное местоимение.
theological_decisions:
- issue: Значение τῶν αἰώνων в πρόθεσιν τῶν αἰώνων
  choice: вечному замыслу
  alternative: замыслу веков
  rationale: Греческое выражение буквально означает «замысел веков», но в контексте указывает на непреходящий, вечный Божий замысел. Основной текст звучит естественно по-русски, а буквальная образность отмечена в сноске.
- issue: Значение ἐν τῷ Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  alternative: через Мессию Иисуса
  rationale: Перевод «в» следует обычному значению ἐν и не решает однозначно, обозначает ли оборот сферу осуществления или средство.
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном обороте слово может восприниматься как титул; «Мессия» передаёт его значение, тогда как традиционный вариант указан в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным библейским звучанием. Сохранена синтаксическая незавершённость стиха как части более длинного предложения. Формула «Мессия Иисус» намеренно сохраняет титульный характер Χριστός.
