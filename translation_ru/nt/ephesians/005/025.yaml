id: EPH.5.25
reference: Ephesians 5:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οἱ ἄνδρες, ἀγαπᾶτε τὰς ⸀γυναῖκας, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν τὴν ἐκκλησίαν καὶ ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/025.yaml
  text: Husbands[a], love your wives, just as Messiah also loved the church and gave himself up for her[b],
translation:
  language: ru
  text: Мужья, любите своих жён, как и Мессия[a] возлюбил церковь и отдал себя за неё[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческое Χριστός — титул со значением «Мессия», то есть «Помазанник».'
    reason: Лексическая альтернатива и пояснение титула.
  - marker: b
    text: 'Или: «предал себя за неё».'
    reason: Лексическая альтернатива для παρέδωκεν.
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: Мужья
  rationale: В контексте наставлений о браке и в сочетании с γυναῖκας слово обозначает мужей, а не мужчин вообще.
- source_word: ἀγαπᾶτε … ἠγάπησεν
  choice: любите … возлюбил
  rationale: Сохранён повтор однокоренного глагола ἀγαπάω; форма «возлюбил» естественно передаёт совершившееся самоотверженное действие Мессии.
- source_word: τὰς γυναῖκας
  choice: своих жён
  rationale: Контекст требует значения «жён»; «своих» естественно выражает подразумеваемое отношение к обращённым мужьям.
- source_word: καθὼς καὶ
  choice: как и
  rationale: 'Кратко и естественно передаёт сравнение и частицу καί: любовь Мессии служит образцом.'
- source_word: ὁ Χριστὸς
  choice: Мессия
  rationale: Χριστός здесь употреблено с артиклем как титул; «Мессия» передаёт его смысл, а традиционное «Христос» отмечено в сноске.
- source_word: τὴν ἐκκλησίαν
  choice: церковь
  rationale: В данном послании речь идёт о совокупном народе Божьем; «церковь» — ясный и устоявшийся русский эквивалент.
- source_word: ἑαυτὸν παρέδωκεν
  choice: отдал себя
  rationale: Передаёт добровольную самоотдачу естественным современным русским языком, не добавляя отсутствующей в тексте формулировки об искуплении.
- source_word: ὑπὲρ αὐτῆς
  choice: за неё
  rationale: Передаёт действие ради неё и в её пользу; местоимение относится к церкви.
theological_decisions:
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Форма с артиклем подчёркивает титульное употребление; основной текст раскрывает значение греческого титула, а привычный вариант сохранён в сноске.
- issue: Степень конкретизации παρέδωκεν ὑπὲρ αὐτῆς
  choice: отдал себя за неё
  alternative: предал себя за неё
  rationale: Перевод сохраняет смысл добровольной самоотдачи ради церкви, но не вводит более узкую богословскую трактовку способа или цели этой жертвы.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизации. Повеление сформулировано прямо; «своих жён» устраняет возможное понимание «женщин вообще». Слова «церковь» и «себя» написаны со строчной буквы по нормам современного русского текста, без конфессионально обусловленной капитализации.
