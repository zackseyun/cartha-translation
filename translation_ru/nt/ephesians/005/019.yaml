lexical_decisions:
- source_word: λαλοῦντες
  choice: говоря
  rationale: Причастная форма и широкое значение глагола сохранены без более узкого истолкования как формального обращения.
- source_word: ἑαυτοῖς
  choice: друг другу
  rationale: Во множественном числе возвратное местоимение здесь естественно понимать взаимно; этот вариант соответствует общинному контексту.
- source_word: ψαλμοῖς
  choice: псалмами
  rationale: Стандартное соответствие, не ограничивающее смысл исключительно канонической Псалтирью.
- source_word: ὕμνοις
  choice: гимнами
  rationale: Сохраняет отдельный элемент трёхчастного перечисления и передаёт обычное значение слова.
- source_word: ᾠδαῖς πνευματικαῖς
  choice: духовными песнями
  rationale: Естественно передаёт сочетание существительного с определением, не усиливая его до прямого утверждения о богодухновенности песен.
- source_word: ᾄδοντες
  choice: поя
  rationale: Прямо передаёт причастие со значением пения и сохраняет его связь со следующим музыкальным глаголом.
- source_word: ψάλλοντες
  choice: воспевая
  rationale: Передаёт пение хвалы и музыкальный оттенок слова, не вводя обязательного указания на инструментальное сопровождение.
- source_word: τῇ καρδίᾳ ὑμῶν
  choice: в ваших сердцах
  rationale: Дательный падеж понят как сфера действия; множественное число по-русски естественно согласуется с обращением ко многим, хотя в греческом стоит единственное число «сердце» при местоимении множественного числа.
- source_word: τῷ κυρίῳ
  choice: Господу
  rationale: Дательный падеж естественно обозначает Того, к кому обращены пение и хвала; референт не уточняется сверх формулировки стиха.
theological_decisions:
- issue: Значение ψάλλοντες применительно к музыкальной практике
  choice: Передано как «воспевая» без указания на инструментальное сопровождение.
  alternative: «играя» либо «поя хвалу»
  rationale: В данном контексте глагол может обозначать хвалебное пение или создание мелодии, но сам по себе не требует упоминания инструментов; перевод не занимает конфессиональной позиции за или против их употребления.
- issue: Кого обозначает «Господь»
  choice: Сохранено «Господу» без добавления имени Иисуса Христа.
  alternative: «Господу Иисусу» или «Христу»
  rationale: Контекст Послания может указывать на Христа, однако в самом стихе употреблено κύριος; перевод сохраняет эту формулировку и её контекстуальную открытость.
translation_notes:
  register: Современный литературный русский язык с сохранением причастного строя греческого предложения. Трёхчастный ряд «псалмами, гимнами и духовными песнями» сохранён. Формула «в ваших сердцах» намеренно не заменена на «от всего сердца», поскольку последнее добавляло бы отсутствующую в исходном тексте идею полноты или искренности.
