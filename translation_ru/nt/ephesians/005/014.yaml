source:
  edition: SBLGNT
  text: πᾶν γὰρ τὸ φανερούμενον φῶς ἐστιν. διὸ λέγει· Ἔγειρε, ὁ καθεύδων, καὶ ἀνάστα ἐκ τῶν νεκρῶν, καὶ ἐπιφαύσει σοι ὁ Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/014.yaml
  text: For everything that is made visible is light[a]. Therefore it says, “Wake up, sleeper, and rise from the dead[c][b], and Messiah will shine on you.”
translation:
  language: ru
  text: 'Ведь всё, что становится явным, есть свет[a]. Поэтому сказано[c]: «Проснись, спящий, и восстань из мёртвых, и Мессия[b] осияет тебя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё обнаруживаемое есть свет». Причастие φανερούμενον можно понимать как «становящееся явным/видимым» или «обнаруживаемое, выявляемое».'
    reason: lexical_alternative
  - marker: b
    text: Греч. «Христос», то есть «Помазанник»; здесь слово употреблено как титул и передано как «Мессия».
    reason: alternative_reading
  - marker: c
    text: Источник этой цитаты точно не известен. Возможно, она перекликается с библейскими образами, особенно с Ис 60:1, либо происходит из раннехристианского гимна.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν
  choice: всё
  rationale: Средний род единственного числа с субстантивированным причастием имеет обобщённый смысл; «всё» сохраняет широкий охват, не сводя выражение только к людям.
- source_word: φανερούμενον
  choice: что становится явным
  rationale: Форма допускает оттенки «становится видимым», «делается явным», «обнаруживается». Основной вариант естественен по-русски и не уточняет действующее лицо.
- source_word: φῶς
  choice: свет
  rationale: Прямой эквивалент, сохраняющий метафору без её истолкования в тексте.
- source_word: διὸ
  choice: поэтому
  rationale: Передаёт вывод из предыдущего утверждения.
- source_word: λέγει
  choice: сказано
  rationale: Безличная русская формула естественно вводит цитату и не определяет не названный в греческом источник или субъект речи.
- source_word: Ἔγειρε
  choice: проснись
  rationale: Современный и естественный императив, сохраняющий образ сна.
- source_word: ὁ καθεύδων
  choice: спящий
  rationale: Субстантивированное причастие передано обращением, близким по форме и смыслу.
- source_word: ἀνάστα
  choice: восстань
  rationale: Сохраняет возвышенный регистр и смысл вставания/воскресения в сочетании «из мёртвых».
- source_word: ἐκ τῶν νεκρῶν
  choice: из мёртвых
  rationale: Устоявшееся и естественное русское выражение, сохраняющее возможный воскресный оттенок.
- source_word: ἐπιφαύσει
  choice: осияет
  rationale: Передаёт направленное сияние света и соответствует поэтическому характеру цитаты.
- source_word: ὁ Χριστός
  choice: Мессия
  rationale: Артикль поддерживает титульное употребление; «Мессия» передаёт значение титула, а традиционное «Христос» отмечено как вариант.
theological_decisions:
- issue: Источник вводимой цитаты
  choice: Безличное «сказано» без указания источника
  alternative: «Писание говорит»; «Он говорит»; указание на раннехристианский гимн
  rationale: Греческий текст не называет говорящего, а происхождение цитаты остаётся спорным; перевод не должен устранять эту открытость.
- issue: Передача ὁ Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном контексте слово выступает как титул; выбран смысловой эквивалент, при этом традиционный вариант сохранён в примечании.
- issue: Образ восстания из мёртвых
  choice: Сохранить буквально-метафорическое выражение «восстань из мёртвых»
  alternative: Истолковать как духовное пробуждение или как буквальное воскресение
  rationale: Контекст допускает сильный духовный образ с воскресными ассоциациями; перевод сохраняет напряжение и не навязывает одно толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром цитаты. «Проснись» звучит понятно и современно, а «восстань» и «осияет» сохраняют поэтическую торжественность и световую образность исходного текста.
