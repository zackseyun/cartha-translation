lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: благодаря
  rationale: Причастие настоящего времени продолжает ряд зависимых от предшествующего повеления оборотов; деепричастие сохраняет эту синтаксическую связь и длительный характер действия.
- source_word: πάντοτε
  choice: всегда
  rationale: Прямой и естественный эквивалент наречия со значением постоянства.
- source_word: ὑπὲρ πάντων
  choice: за всё
  rationale: Форма πάντων допускает понимание «всё» или «все», но контекст общей благодарности благоприятствует всеохватному значению обстоятельств и предметов благодарения.
- source_word: ἐν ὀνόματι
  choice: во имя
  rationale: Сохраняет устойчивый библейский оборот и его представительский или посреднический оттенок без пояснительного расширения.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Господа нашего
  rationale: Передаёт христологический титул κύριος и сохраняет достоинство традиционного русского библейского регистра.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός здесь сохраняет силу титула и потому передан по значению как «Мессия», а не только традиционной транслитерацией «Христос».
- source_word: τῷ θεῷ καὶ πατρί
  choice: Богу и Отцу
  rationale: Сохраняет координацию двух существительных, относящихся к одному адресату благодарения, не превращая её в составное именование «Богу Отцу».
theological_decisions:
- issue: Передача Χριστοῦ в выражении τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: «Мессия» раскрывает титульное значение греческого Χριστός; привычная церковная форма «Христос» сохранена в сноске.
- issue: Референт πάντων в ὑπὲρ πάντων
  choice: за всё
  alternative: за всех
  rationale: Морфологически возможны средний и мужской род, поэтому неоднозначность подлинна; в данном увещательном контексте вероятнее всеохватная благодарность за всё, однако личное прочтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский с умеренно традиционным библейским порядком слов. Деепричастный оборот и конечная запятая отражают зависимость стиха от предшествующего повеления; «Господа нашего» и «Богу и Отцу» сохраняют достоинство и структуру исходной формулировки.
