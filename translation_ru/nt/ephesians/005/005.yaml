source:
  edition: SBLGNT
  text: τοῦτο γὰρ ⸀ἴστε γινώσκοντες ὅτι πᾶς πόρνος ἢ ἀκάθαρτος ἢ πλεονέκτης, ⸀ὅ ἐστιν εἰδωλολάτρης, οὐκ ἔχει κληρονομίαν ἐν τῇ βασιλείᾳ τοῦ Χριστοῦ καὶ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/005.yaml
  text: For you know this[a], understanding that every sexually immoral or unclean or greedy person, who is an idolater[b], has no inheritance in the kingdom of Messiah and God.
translation:
  language: ru
  text: Ведь вы знаете и понимаете, что ни один развратный, нечистый или алчный человек — то есть идолопоклонник[a] — не имеет наследия в Царстве Мессии[b] и Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен более буквальный перевод: «что есть идолопоклонство»; вероятнее всего, это относится прежде всего к алчности.'
    reason: alternative_reading
  - marker: b
    text: Греч. Χριστός — «Помазанник», то есть Мессия; здесь слово употреблено как титул.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε γινώσκοντες
  choice: вы знаете и понимаете
  rationale: Сочетание личной формы οἶδα с причастием γινώσκω усиливает мысль о знании и осознании. Два однородных глагола естественно передают оба элемента по-русски.
- source_word: πόρνος
  choice: развратник
  rationale: Обозначает человека, которого характеризует половая безнравственность. «Развратник» понятно современному читателю и не сужает значение до одного конкретного вида проступка.
- source_word: ἀκάθαρτος
  choice: нечистый
  rationale: Сохраняет метафору нечистоты и её нравственные и культовые оттенки; в данном перечне слово употреблено субстантивно.
- source_word: πλεονέκτης
  choice: алчный человек
  rationale: Передаёт человека, которым владеет жадное стремление иметь больше. Такая формулировка современнее, чем «лихоимец» или «корыстолюбец».
- source_word: ὅ ἐστιν εἰδωλολάτρης
  choice: то есть идолопоклонник
  rationale: По контексту и параллели в Кол 3:5 пояснение прежде всего относится к алчному человеку. При этом средний род относительного местоимения допускает абстрактное понимание, отмеченное в сноске.
- source_word: κληρονομίαν
  choice: наследия
  rationale: Сохраняет павловскую лексику наследования и её заветные и эсхатологические оттенки.
- source_word: βασιλείᾳ
  choice: Царстве
  rationale: Обычное и точное библейское соответствие, способное обозначать как царственное правление, так и его область.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Здесь Χριστός функционирует как титул; «Мессия» передаёт его смысл, а не просто транслитерирует греческую форму.
- source_word: τοῦ Χριστοῦ καὶ θεοῦ
  choice: Мессии и Бога
  rationale: Прямо сохраняет координацию двух родительных форм, не навязывая спорного синтаксического вывода.
theological_decisions:
- issue: К чему относится ὅ ἐστιν εἰδωλολάτρης
  choice: 'Пояснение отнесено к упомянутому человеку, прежде всего к алчному: «то есть идолопоклонник».'
  alternative: 'Абстрактное прочтение: «что есть идолопоклонство», прежде всего об алчности.'
  rationale: Форма среднего рода создаёт подлинную синтаксическую неоднозначность. Контекст и Кол 3:5 поддерживают связь алчности с идолопоклонством; альтернативное прочтение сохранено в сноске.
- issue: Характер отсутствия наследия
  choice: 'Настоящее состояние: «не имеет наследия».'
  alternative: 'Будущее событие: «не наследует Царства».'
  rationale: В греческом стоит настоящее οὐκ ἔχει. Перевод сохраняет грамматическое время и силу предупреждения.
- issue: Соотношение «Мессии и Бога»
  choice: Сохранены непосредственно координированные родительные формы.
  alternative: Перевод, явно отождествляющий референтов на основании одной синтаксической конструкции.
  rationale: Фраза допускает тесную концептуальную связь, однако перевод не должен принудительно закреплять более узкий спорный вывод, чем выражено в исходном тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского наставления. Формулировка «вы знаете и понимаете» естественно передаёт усиленную греческую конструкцию; «не имеет наследия» намеренно сохраняет настоящее время и наследственную образность.
