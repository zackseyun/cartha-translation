lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит основание предыдущего утверждения; «потому что» естественно и ясно передаёт причинное значение.
- source_word: μέλη
  choice: члены
  rationale: Слово обозначает составные части тела. «Члены» сохраняет телесный образ Павла и его общинный смысл, не сводя значение лишь к анатомическим конечностям.
- source_word: ἐσμὲν
  choice: мы —
  rationale: Форма настоящего времени глагола «быть» передана естественной русской именной конструкцией с тире; местоимение «мы» выражает лицо и число греческой формы.
- source_word: τοῦ σώματος
  choice: тела
  rationale: Прямо сохраняет образ тела, которым в контексте обозначена связь верующих со Христом.
- source_word: αὐτοῦ
  choice: Его
  rationale: Местоимение относится ко Христу в ближайшем контексте; личное «Его» ясно передаёт эту отсылку.
theological_decisions:
- issue: Включать ли более пространное византийское чтение «от плоти Его и от костей Его»
  choice: 'В основном тексте переведено только чтение SBLGNT: «потому что мы — члены Его тела».'
  alternative: «потому что мы — члены Его тела, от плоти Его и от костей Его»
  rationale: Предоставленный греческий текст содержит краткое чтение, обычно считающееся наиболее ранним восстанавливаемым текстом. Более пространное чтение, вероятно, возникло под влиянием Бытия 2:23, которое уже отзывается в контексте. Для текстологической прозрачности оно приведено в сноске, но не включено в основной текст.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. Традиционный библейский термин «члены» сохранён, поскольку он понятен в образе единого тела и точнее удерживает метафору, чем нейтральное «части».
