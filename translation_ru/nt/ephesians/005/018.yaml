  to: И не напивайтесь вином, ибо оно ведёт к разнузданности, но исполняйтесь Духом[a].
  rationale: Правка заменяет семантически более узкое «распутство» на «разнузданность» и делает причинно-смысловую связь естественной для современного литературного русского. Основное понимание πνεύματι как Святого Духа сохранено капитализацией, а альтернативы не устранены, а указаны в сноске.
