  text: καὶ μὴ μεθύσκεσθε οἴνῳ, ἐν ᾧ ἐστιν ἀσωτία, ἀλλὰ πληροῦσθε ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/018.yaml
  text: And do not get drunk with wine[a], in which there is debauchery, but be filled with the Spirit,
translation:
  language: ru
  text: И не напивайтесь вином, ибо оно ведёт к разнузданности, но исполняйтесь Духом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исполняйтесь в Духе»; некоторые понимают это более общо: «исполняйтесь духом».'
    reason: Альтернативные способы понять ἐν πνεύματι и референт πνεύματι.
lexical_decisions:
- source_word: μεθύσκεσθε
  choice: не напивайтесь
  rationale: Настоящее повелительное с μή выражает запрет; «не напивайтесь» естественно передаёт в современном русском доведение себя до состояния опьянения.
- source_word: οἴνῳ
  choice: вином
  rationale: Дательный падеж обозначает вещество или средство опьянения и естественно передаётся русским творительным.
- source_word: ἐν ᾧ
  choice: в котором
  rationale: Относительное местоимение грамматически согласуется с «вином»; буквальная связь сохранена без подмены её пояснительным толкованием.
- source_word: ἀσωτία
  choice: распутство
  rationale: Слово обозначает нравственно разнузданное, расточительное поведение; «распутство» кратко и понятно сохраняет этическую силу выражения.
- source_word: πληροῦσθε
  choice: исполняйтесь
  rationale: Форма настоящего времени в пассиве выражает повеление с продолжающимся или повторяющимся характером; традиционное «исполняйтесь» сохраняет образ наполнения и звучит достойно.
- source_word: ἐν πνεύματι
  choice: Духом
  rationale: После глагола наполнения ἐν с дательным допускает понимание Духа как содержания или действующей силы; русский творительный естественно передаёт основное прочтение, тогда как неоднозначность отмечена в сноске.
theological_decisions:
- issue: Кого или что обозначает πνεύματι
  choice: Святого Духа, переданного как «Духом»
  alternative: «в Духе»; возможно также более общее «духом»
  rationale: В контексте Послания наиболее вероятна отсылка к Святому Духу, хотя отсутствие артикля и семантика предлога ἐν допускают иные оттенки; они сохранены в сноске.
- issue: Отношение ἐν ᾧ к предыдущей фразе
  choice: 'Отнесено грамматически к вину: «в котором — распутство»'
  alternative: 'Смысловая отсылка к опьянению вином: «в этом — распутство»'
  rationale: Местоимение среднего рода единственного числа формально соотносится с οἴνῳ, но по смыслу осуждается связанное с вином опьянение; перевод сохраняет форму исходного текста и не устраняет напряжение.
translation_notes:
  register: Современный литературный русский с лаконичным, увещательным ритмом. Тире в обороте «в котором — распутство» делает непривычную для русского языка относительную конструкцию яснее, не превращая её в толкование.
