base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/027.yaml
  text: so that he himself might present the church to himself in splendor[a], not having spot or wrinkle or anything like that[c][b], but so that she might be holy and blameless.
translation:
  language: ru
  text: чтобы Он Сам представил Себе Церковь во славе[a], не имеющую ни пятна, ни морщины, ни чего-либо подобного[b], а чтобы она была святой и непорочной[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «славную». Греческое прилагательное может обозначать качество Церкви либо состояние славы, в котором она представлена.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ни чего-нибудь такого».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «без изъяна».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραστήσῃ
  choice: представить
  rationale: Передаёт значение παρίστημι — привести и поставить перед кем-либо; аорист конъюнктива с ἵνα выражает цель.
- source_word: αὐτὸς ἑαυτῷ
  choice: Самому представить Себе
  rationale: Сохраняет и эмфатическое αὐτός, и возвратное ἑαυτῷ, не устраняя намеренную рефлексивность греческого выражения.
- source_word: ἔνδοξον
  choice: во славе
  rationale: Передаёт состояние Церкви при её представлении; сохраняет возможный оттенок как славы, так и великолепия.
- source_word: ἐκκλησίαν
  choice: Церковь
  rationale: В данном контексте обозначает совокупный народ Божий; это устойчивый и контекстуально точный русский эквивалент.
- source_word: μὴ ἔχουσαν σπίλον ἢ ῥυτίδα
  choice: без пятна, или морщины
  rationale: Естественно передаёт отсутствие названных изъянов и сохраняет конкретную образность оригинала.
- source_word: ἤ τι τῶν τοιούτων
  choice: или чего-либо подобного
  rationale: Сохраняет открытое обобщение, следующее за двумя конкретными образами.
- source_word: ἁγία
  choice: святую
  rationale: Стандартный и содержательно точный эквивалент, сохраняющий богословскую ёмкость слова.
- source_word: ἄμωμος
  choice: непорочную
  rationale: Передаёт отсутствие порока или изъяна и естественно сочетается в русском с «святую», сохраняя связь с образами чистоты.
theological_decisions:
- issue: Возвратный образ представления Церкви Христом
  choice: Сохранено «Самому представить Себе»
  alternative: Сгладить до «представить Церковь» или истолковать как представление перед Богом
  rationale: В греческом явно присутствуют эмфатическое αὐτός и возвратное ἑαυτῷ; перевод не разрешает заложенное в тексте богословское напряжение.
- issue: Сочетание брачной и культовой образности чистоты
  choice: «без пятна, или морщины… святую и непорочную»
  alternative: «без изъяна… святую и безупречную»
  rationale: Конкретные образы пятна и морщины сохранены наряду с языком святости и непорочности, без сведения текста к одному виду символики.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Инверсия «Самому представить Себе» сохраняет эмфазу оригинала; прописные местоимения и «Церковь» соответствуют распространённой русской библейской издательской традиции.
