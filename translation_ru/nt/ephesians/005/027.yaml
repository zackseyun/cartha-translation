    issue: Неясная передача эмфатического αὐτός
    rationale: «Самому представить Себе» неявно оформляет субъект и меняет падежное ощущение по сравнению с греческим αὐτὸς (именительный). «Чтобы Он Сам представил Себе» передаёт и субъект, и эмфазу.
  - severity: medium
    issue: Вторая целевая конструкция ἵνα не выражена явно
    rationale: «Но святую и непорочную» может быть понято как простое противопоставленное определение при «Церковь», тогда как ἀλλ’ ἵνα ᾖ вводит положительную цель. «А чтобы она была святой и непорочной» сохраняет структуру оригинала.
  - severity: low
    issue: Неестественное оформление отрицательного перечня
    rationale: При «без» и повторяющемся «или» исходная пунктуация и связка звучат тяжеловесно. Русское «не имеющую ни пятна, ни морщины, ни чего-либо подобного» точно передаёт отсутствие любого из названных изъянов.
