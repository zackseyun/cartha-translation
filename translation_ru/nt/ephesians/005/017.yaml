  source_fidelity: 'Перевод точно передаёт все основные элементы греческого текста: выводное διὰ τοῦτο («Поэтому»), процессуальный запрет μὴ γίνεσθε («не становитесь»), противопоставление ἀλλά («но»), повеление συνίετε («понимайте») и косвенный вопрос τί τὸ θέλημα τοῦ κυρίου («в чём воля Господа»). Неоднозначный в данном стихе референт τοῦ κυρίου не конкретизируется сверх исходного текста.'
