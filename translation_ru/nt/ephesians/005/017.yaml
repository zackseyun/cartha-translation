  text: διὰ τοῦτο μὴ γίνεσθε ἄφρονες, ἀλλὰ ⸀συνίετε τί τὸ θέλημα τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/017.yaml
  text: For this reason[a], do not become foolish, but understand what the will of the Lord is.
translation:
  language: ru
  text: Поэтому не становитесь неразумными, но понимайте, в чём воля Господа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Оборот указывает на предыдущее наставление и выражает вывод; «поэтому» естественно и ясно передаёт эту связующую силу по-русски.
- source_word: μὴ γίνεσθε
  choice: не становитесь
  rationale: Глагол γίνομαι обозначает вхождение в состояние, а не просто пребывание в нём; форма с μή выражает запрет.
- source_word: ἄφρονες
  choice: неразумными
  rationale: ἄφρων обозначает недостаток понимания и здравого практического суждения. «Неразумными» сохраняет смысловую связь с последующим «понимайте» и звучит достойно и современно.
- source_word: ἀλλὰ
  choice: но
  rationale: Союз вводит прямое противопоставление отрицательного и положительного повелений.
- source_word: συνίετε
  choice: понимайте
  rationale: συνίημι означает понимать, постигать, осознавать; «понимайте» здесь ясно и естественно, не сужая смысла до одного лишь процесса различения.
- source_word: τί τὸ θέλημα
  choice: в чём воля
  rationale: В русском языке оборот «понимать, в чём воля» естественнее буквального «понимать, что есть воля», при этом точно передаёт содержание косвенного вопроса.
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: κύριος передано традиционным и уместным словом «Господь»; родительный падеж соответствует греческой конструкции, а прописная буква указывает на титул.
theological_decisions:
- issue: Кого обозначает τοῦ κυρίου
  choice: Господа
  alternative: Господа Иисуса; Бога
  rationale: В ближайшем контексте Послания «Господь» часто относится к Иисусу, но сам стих не уточняет референта. Перевод сохраняет формулировку и неоднозначность греческого текста.
- issue: Сила запрета μὴ γίνεσθε
  choice: не становитесь
  alternative: не будьте; перестаньте быть
  rationale: Так сохраняется значение перехода в состояние и не утверждается без достаточного основания, что адресаты уже являются неразумными.
translation_notes:
  register: Современный литературный русский язык; краткая, увещевательная и синтаксически естественная формулировка. Лексическая оппозиция «неразумными — понимайте» отражает внутреннюю связь греческого текста.
