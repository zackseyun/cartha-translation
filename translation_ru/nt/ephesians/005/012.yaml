  text: τὰ γὰρ κρυφῇ γινόμενα ὑπ’ αὐτῶν αἰσχρόν ἐστιν καὶ λέγειν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/012.yaml
  text: For it is shameful even to speak of the things done by them in secret[a].
translation:
  language: ru
  text: Ведь о том, что они делают втайне, стыдно даже говорить.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующим увещеванием и естественно звучит в современном русском.
- source_word: τὰ ... γινόμενα
  choice: о том, что ... делают
  rationale: Субстантивированное причастие обозначает совершаемые действия; русская конструкция «о том, что делают» естественно передаёт этот смысл и сочетается с «говорить».
- source_word: κρυφῇ
  choice: втайне
  rationale: Кратко и идиоматично передаёт совершение действий скрытно, не на виду.
- source_word: ὑπ’ αὐτῶν
  choice: они делают
  rationale: Греческое обозначение действующего лица при страдательной форме естественно преобразовано в русскую действительную конструкцию без уточнения референта местоимения.
- source_word: αἰσχρόν
  choice: стыдно
  rationale: Предикативная форма точно и естественно передаёт нравственную постыдность, выраженную αἰσχρόν.
- source_word: καὶ λέγειν
  choice: даже говорить
  rationale: καί имеет усилительное значение «даже»; «говорить о том» идиоматично передаёт смысл упоминания этих дел.
theological_decisions:
- issue: Референт αὐτῶν
  choice: Сохранить местоименное указание «они» без пояснения, кто именно имеется в виду.
  alternative: 'Уточнить: «те, кто творит дела тьмы» или «непокорные».'
  rationale: Греческий текст оставляет референт местоимения контексту. Эксплицитное уточнение внесло бы в стих толкование из окружающего контекста.
- issue: Смысл высказывания о речи
  choice: Передать как «стыдно даже говорить», сохраняя усиление.
  alternative: Передать как запрет упоминать тайные дела.
  rationale: Текст характеризует упоминание этих дел как постыдное, но грамматически не формулирует прямого запрета; перевод не должен усиливать высказывание до отдельной заповеди.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, ясная и достойная по тону. Активная конструкция естественнее буквального «о совершаемом ими», при этом содержание и неопределённость местоименного референта сохранены.
