  text: For no one ever hated his own flesh[a], but nourishes and cherishes it, just as the Messiah also does the church[c][b],
translation:
  language: ru
  text: Ведь никто никогда не ненавидел собственной плоти[a], но питает её и окружает заботой, как и Мессия питает церковь и окружает её заботой[b].
  philosophy: optimal-equivalence
