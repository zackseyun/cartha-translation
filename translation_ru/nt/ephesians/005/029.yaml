lexical_decisions:
- source_word: οὐδεὶς γάρ ποτε
  choice: Ведь никто никогда
  rationale: «Ведь» передаёт пояснительную силу γάρ, а сочетание «никто никогда» естественно выражает усиленное отрицание οὐδεὶς…ποτε.
- source_word: τὴν ἑαυτοῦ σάρκα
  choice: собственной плоти
  rationale: σάρξ здесь буквально обозначает физическое тело, а не нравственно испорченную природу; «плоть» также сохраняет связь с языком ближайшего контекста.
- source_word: ἐμίσησεν
  choice: не ненавидел
  rationale: Прямой и естественный эквивалент μισέω; прошедшее время соответствует аористу в обобщающем утверждении.
- source_word: ἐκτρέφει
  choice: питает
  rationale: Передаёт заботу о теле посредством питания и сохраняет телесный образ.
- source_word: θάλπει
  choice: окружает заботой
  rationale: В данном контексте глагол означает тёплую, бережную заботу; буквальное «согревает» по-русски могло бы неоправданно сузить смысл.
- source_word: καθὼς καὶ
  choice: как и
  rationale: Кратко и естественно сохраняет сравнительную и добавочную силу греческого оборота.
- source_word: ὁ Χριστὸς
  choice: Мессия
  rationale: Артикль и контекст поддерживают титульное употребление Χριστός; «Мессия» передаёт значение титула, а традиционный вариант отмечен в сноске.
- source_word: τὴν ἐκκλησίαν
  choice: церковь
  rationale: В контексте Послания речь идёт о совокупности Божьего народа; «церковь» является ясным и общепринятым русским соответствием.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Выбран смысловой перевод титула; традиционное русское именование сохранено как допустимый вариант в сноске.
- issue: Передача σάρξ
  choice: плоть
  alternative: тело
  rationale: Здесь слово обозначает собственное физическое существо человека в брачно-телесной аналогии, а не «греховную природу». «Плоть» сохраняет исходную лексику и межстиховую связь.
- issue: Эллипсис сказуемого в последней части
  choice: как и Мессия — церковь
  alternative: как и Мессия питает церковь и окружает её заботой
  rationale: Тире естественно передаёт по-русски отсутствующие в греческом повторные глаголы, не устраняя лаконичность и не создавая неясного оборота.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся кратким; эллипсис оригинала передан тире, а «окружает заботой» естественно выражает нежную заботу, подразумеваемую θάλπει.
