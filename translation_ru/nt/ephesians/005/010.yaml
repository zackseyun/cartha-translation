lexical_decisions:
- source_word: δοκιμάζοντες
  choice: испытывая
  rationale: 'Причастие настоящего времени передаёт продолжающееся действие и сохраняет активный, проверочный оттенок δοκιμάζω: исследовать и проверять, чтобы распознать ценность или приемлемость.'
- source_word: τί
  choice: что
  rationale: 'Естественно передаёт косвенный вопрос: «что угодно».'
- source_word: ἐστιν
  choice: угодно
  rationale: Связка ἐστιν естественно выражена в русском составном именном сказуемом без отдельного слова «есть».
- source_word: εὐάρεστον
  choice: угодно
  rationale: Обычное и достойное русское выражение для того, что приятно или приемлемо для Господа; оно естественнее буквального «благоугодно».
- source_word: τῷ κυρίῳ
  choice: Господу
  rationale: Дательный падеж при εὐάρεστον прямо и естественно передан русским дательным; титул κύριος сохранён без уточнения референта.
theological_decisions:
- issue: Референт κύριος
  choice: Господь
  alternative: Господь Иисус; Бог
  rationale: Греческий текст содержит только титул κύριος. Перевод не уточняет референта и тем самым сохраняет возможную христологическую отнесённость и исходную недосказанность.
translation_notes:
  register: Современный литературный русский язык. Оборот «что угодно Господу» краток, естественен и сохраняет достоинство библейского регистра; строчная форма в начале учитывает синтаксическую связь со смежным контекстом.
