lexical_decisions:
- source_word: ἐξαγοραζόμενοι
  choice: дорожа
  rationale: Причастие буквально связано с выкупом или приобретением, но в данном наставительном контексте выражает мысль о том, чтобы не упускать время и пользоваться им наилучшим образом. «Дорожа» естественно передаёт этот смысл по-русски, не привнося учение об искуплении.
- source_word: καιρόν
  choice: временем
  rationale: καιρός может обозначать как время, так и благоприятный случай. Сочетание «дорожа временем» сохраняет привычное обозначение времени, а значение возможности отмечено в сноске.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит основание наставления; «потому что» ясно передаёт причинную связь.
- source_word: ἡμέραι
  choice: дни
  rationale: Прямое соответствие греческому множественному числу без поясняющего расширения.
- source_word: πονηραί
  choice: злы
  rationale: Сохраняет нравственную и враждебную окраску πονηρός; более слабые варианты вроде «тяжелы» сузили бы смысл до неблагоприятных обстоятельств.
theological_decisions:
- issue: Возможное понимание ἐξαγοραζόμενοι как указания на спасительное искупление
  choice: Практический призыв дорожить временем и пользоваться возможностью
  alternative: «искупая время»
  rationale: В наставительном контексте оборот говорит о разумном использовании времени или благоприятного случая, а не раскрывает учение об искуплении. Буквальный традиционный вариант сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и естественная формулировка. Причастный оборот сохраняет синтаксическую связь со смежным контекстом, поскольку стих представляет собой часть более длинного предложения.
