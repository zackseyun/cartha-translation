base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/015.yaml
  text: Therefore[b][a], watch carefully how you walk—not as unwise but as wise—
translation:
  language: ru
  text: 'Итак, внимательно следите за тем, как вы живёте: не как неразумные, а как мудрые.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βλέπετε
  choice: следите
  rationale: Настоящее повелительное наклонение во втором лице множественного числа выражает продолжающееся внимательное наблюдение за собственным образом жизни.
- source_word: οὖν
  choice: Итак
  rationale: Передаёт вывод из предшествующего наставления и естественно связывает стих с контекстом.
- source_word: ἀκριβῶς πῶς
  choice: внимательно ... за тем, как
  rationale: Сохраняет усиленное внимание к тому, каким именно образом адресаты ведут себя, и звучит естественно по-русски.
- source_word: περιπατεῖτε
  choice: вы живёте
  rationale: Греческое «ходите» здесь является устойчивой метафорой образа жизни; прямое «живёте» ясно передаёт её смысл современному читателю.
- source_word: μὴ ὡς ἄσοφοι ἀλλ’ ὡς σοφοί
  choice: не как неразумные, а как мудрые
  rationale: Сохраняет параллельную антитезу и различие между отсутствием мудрости и мудростью без добавления отсутствующего существительного.
theological_decisions:
- issue: Род и охват прилагательных ἄσοφοι / σοφοί
  choice: неразумные ... мудрые
  alternative: неразумные люди ... мудрые люди
  rationale: Формы мужского рода во множественном числе употреблены представительно и относятся ко всей общине. Русские субстантивированные прилагательные естественно сохраняют грамматическую форму оригинала, не ограничивая обращение мужчинами.
- issue: Метафора хождения как образа жизни
  choice: как вы живёте
  alternative: как вы ходите
  rationale: В данном контексте речь идёт о нравственном образе жизни, а буквальное «ходите» в современном русском может быть понято прежде всего как физическое передвижение. Смысл метафоры передан прямо, без богословского уточнения сверх текста.
