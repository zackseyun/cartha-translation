source:
  edition: SBLGNT
  text: Πορνεία δὲ καὶ ⸂ἀκαθαρσία πᾶσα⸃ ἢ πλεονεξία μηδὲ ὀνομαζέσθω ἐν ὑμῖν, καθὼς πρέπει ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/003.yaml
  text: But sexual immorality and every impurity or greed must not even be named among you[a], as is proper for saints[c][b],
translation:
  language: ru
  text: А сексуальная безнравственность, всякая нечистота или жадность не должны даже упоминаться среди вас, как и подобает святым[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Святые» здесь — все верующие как посвящённый Богу народ, а не только люди, позднее причисленные к лику святых.
    reason: cultural_note
lexical_decisions:
- source_word: Πορνεία
  choice: разврат
  rationale: Обозначает недозволенное сексуальное поведение в широком смысле; «разврат» естественно и достаточно широко передаёт это значение, не сужая его до одного вида половых отношений.
- source_word: δὲ
  choice: А
  rationale: Передаёт мягкий контраст и переход от предшествующего наставления без чрезмерно резкого противопоставления.
- source_word: ἀκαθαρσία πᾶσα
  choice: всякая нечистота
  rationale: Сохраняет всеохватность πᾶσα и нравственное значение ἀκαθαρσία в данном перечне пороков.
- source_word: ἢ
  choice: или
  rationale: Прямо передаёт разделительный союз греческого текста.
- source_word: πλεονεξία
  choice: жадность
  rationale: Передаёт ненасытное стремление иметь больше и не сужает слово до сексуальной похоти; современно и понятно.
- source_word: μηδὲ ὀνομαζέσθω ἐν ὑμῖν
  choice: не должно быть среди вас даже речи
  rationale: Естественно по-русски передаёт сильный запрет и эмфатическое μηδέ; выражение сохраняет возможный смысл как недопустимости самих пороков в общине, так и непристойных разговоров о них.
- source_word: καθὼς πρέπει
  choice: как и подобает
  rationale: Передаёт норму поведения, соответствующего положению адресатов.
- source_word: ἁγίοις
  choice: святым
  rationale: Сохраняет краткое павловское обозначение верующих как посвящённого Богу народа.
theological_decisions:
- issue: Значение πλεονεξία рядом с пороками сексуального характера
  choice: жадность в широком смысле
  alternative: корыстолюбие; ненасытная похоть
  rationale: Контекст затрагивает сексуальную нравственность, однако само слово имеет более широкое значение алчного стремления к большему; текст не даёт достаточного основания ограничивать его сексуальной сферой.
- issue: Кого обозначает ἁγίοις
  choice: всех верующих как посвящённый Богу народ
  alternative: особый позднее канонизированный разряд святых; «Божий святой народ»
  rationale: В посланиях Павла это обычное обозначение членов христианской общины, а не позднейшей отдельной категории почитаемых лиц.
- issue: Объём запрета μηδὲ ὀνομαζέσθω ἐν ὑμῖν
  choice: не должно быть среди вас даже речи
  alternative: пусть этого даже не будет среди вас; пусть это даже не упоминается у вас
  rationale: Греческая формулировка допускает оттенок буквального упоминания, но в контексте также подразумевает, что названным порокам не место в общине; перевод сохраняет эту напряжённость, а сноска отмечает более буквальный вариант.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. «Разврат» выбран как понятное широкое обозначение недозволенного сексуального поведения; «как и подобает святым» сохраняет сжатость и торжественность оригинала. Все сноски отмечены в основном тексте.
