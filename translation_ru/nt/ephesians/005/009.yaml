lexical_decisions:
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительное обоснование предыдущего призыва и естественно связывает стих с контекстом.
- source_word: καρπὸς
  choice: плод
  rationale: Сохраняет павловский образ результата, производимого жизнью во свете.
- source_word: τοῦ φωτός
  choice: света
  rationale: Прямо передаёт родительный падеж и отсылает к названной в предыдущем стихе жизни верующих как света в Господе.
- source_word: ἐν
  choice: проявляется во
  rationale: В данном перечислении предлог указывает на сферу или форму проявления плода; такой перевод естественен по-русски и не сводит выражение к пространственному значению.
- source_word: πάσῃ
  choice: всякой
  rationale: Сохраняет всеохватное значение πᾶς при отвлечённых существительных.
- source_word: ἀγαθωσύνῃ
  choice: доброте
  rationale: Передаёт нравственное добро и благотворное отношение без архаичности слова «благость».
- source_word: δικαιοσύνῃ
  choice: праведности
  rationale: Сохраняет широкое павловское значение нравственной правильности; возможный смысл справедливости отмечен в сноске.
- source_word: ἀληθείᾳ
  choice: истине
  rationale: Сохраняет широкий смысл, включающий как соответствие истине, так и правдивость.
theological_decisions:
- issue: Разночтение в родительном определении к слову «плод»
  choice: плод света
  alternative: плод Духа
  rationale: SBLGNT читает φωτός («света»), что непосредственно соответствует контексту стихов 8–9; известное разночтение πνεύματος («Духа») сохранено в сноске.
- issue: Значение δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» сохраняет широкий нравственно-богословский диапазон слова у Павла, а общественно-этический оттенок «справедливость» указан как допустимая альтернатива.
- issue: Отношение плода к перечисленным качествам
  choice: проявляется во
  alternative: состоит во
  rationale: Греческое ἐν допускает понимание сферы проявления без необходимости строго определять перечисление как исчерпывающий состав плода.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской метафоры «плод света». Глагол «проявляется» делает конструкцию с ἐν естественной для обычного читателя, не устраняя смысловой возможности «состоит во».
