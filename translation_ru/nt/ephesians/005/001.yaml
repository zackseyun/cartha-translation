  text: Итак, подражайте Богу, как возлюбленные дети.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «становитесь подражателями Богу»; греческая форма может подчёркивать как становление, так и продолжающееся состояние или действие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: подражайте
  rationale: В сочетании с существительным μιμηταί форма γίνεσθε образует естественное русское повеление «подражайте». Буквальное «становитесь подражателями» точнее передаёт процессуальный оттенок γίνομαι, но звучит тяжелее; возможный оттенок становления отмечен в сноске.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предшествующего рассуждения и естественно звучит в современном русском повествовании.
- source_word: μιμηταὶ
  choice: подражайте
  rationale: Смысл существительного «подражатели» передан глагольной конструкцией, обычной для русского языка; мотив сознательного подражания сохранён и не ослаблен до общего «следуйте».
- source_word: τοῦ θεοῦ
  choice: Богу
  rationale: При русском глаголе «подражать» требуется дательный падеж; это естественный функциональный эквивалент греческого родительного при μιμηταί.
- source_word: ὡς
  choice: как
  rationale: Сохраняет компактную связь образа действия и основания призыва, не сводя её однозначно к причинному «поскольку вы».
- source_word: τέκνα
  choice: дети
  rationale: Точно передаёт гендерно-инклюзивное τέκνα и подчёркивает отношения детей с родителем.
- source_word: ἀγαπητά
  choice: возлюбленные
  rationale: Сохраняет значение любви и тёплый, возвышенный библейский регистр, оставаясь понятным современному читателю.
theological_decisions:
- issue: Связь призыва к подражанию Богу со статусом возлюбленных детей
  choice: Фраза «как возлюбленные дети» оставлена при повелении и может выражать как образ действия, так и основание призыва; она не утверждает, что подражание делает адресатов детьми Бога.
  alternative: 'Передать причинно: «поскольку вы Его возлюбленные дети», либо только сравнительно: «словно возлюбленные дети».'
  rationale: Греческое ὡς допускает компактное сочетание сравнительного и обусловливающего оттенков. Перевод «как» сохраняет эту смысловую напряжённость и не добавляет отсутствующего в стихе уточнения «Его».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Громоздкая именная конструкция заменена естественным повелительным глаголом; буквальная форма и её аспектуальная неоднозначность сохранены в сноске.
