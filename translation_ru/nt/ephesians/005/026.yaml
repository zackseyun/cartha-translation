lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Союз естественно передаёт цель, выраженную ἵνα с сослагательным наклонением.
- source_word: αὐτὴν
  choice: её
  rationale: Местоимение женского рода относится в контексте к Церкви, представленной как невеста.
- source_word: ἁγιάσῃ
  choice: освятить
  rationale: «Освятить» сохраняет связь со святостью и передаёт целевое значение аориста конъюнктива без излишнего толкования.
- source_word: καθαρίσας
  choice: очистив
  rationale: Деепричастие сохраняет причастную конструкцию и представляет очищение как действие, связанное с освящением; подразумеваемое дополнение «её» ясно из главной части.
- source_word: τῷ λουτρῷ
  choice: омовением
  rationale: Творительный падеж передаёт инструментальное значение дательного; «омовение» естественно выражает λουτρόν и сохраняет образ ритуального или образного очищения.
- source_word: τοῦ ὕδατος
  choice: водой
  rationale: Русский творительный падеж естественно передаёт вещество или средство омовения, не уточняя богословский характер образа.
- source_word: ἐν ῥήματι
  choice: посредством слова
  rationale: Формулировка передаёт вероятное значение средства и сохраняет достаточно широкую связь «слова» с очищающим омовением.
- source_word: ῥήματι
  choice: слова
  rationale: «Слово» сохраняет широкое значение ῥῆμα — слово, изречение или весть — и не сужает его до конкретной формулы либо проповеди.
theological_decisions:
- issue: Связь очищения, омовения водой и слова в потенциально сакраментальном контексте
  choice: Сохранить образ омовения водой и его связь со словом, не определяя точный сакраментальный смысл.
  alternative: Явно назвать крещение либо представить омовение исключительно как метафору.
  rationale: Греческий текст, вероятно, вызывает крещальные ассоциации, однако сам по себе не устанавливает, насколько строго сакраментально следует понимать выражение.
- issue: Значение ῥήματι
  choice: Передать как «слова».
  alternative: «вести», «изречения» или более конкретно «слова Евангелия».
  rationale: Контекст допускает понимание провозглашённой вести или произнесённого слова, но лексема шире; перевод не должен устранять эту многозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Синтаксис остаётся близким к греческому, но читается естественно; термины не привязаны к отдельной конфессиональной традиции.
