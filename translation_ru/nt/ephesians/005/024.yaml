id: EPH.5.24
reference: Ephesians 5:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀ὡς ἡ ἐκκλησία ὑποτάσσεται τῷ Χριστῷ, οὕτως καὶ αἱ γυναῖκες ⸀τοῖς ἀνδράσιν ἐν παντί.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/024.yaml
  text: But as the church submits to Messiah[a], so also wives to their husbands in everything.
translation:
  language: ru
  text: Но как церковь подчиняется Мессии[a], так и жёны — мужьям во всём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христу». Греческое Χριστός означает «Мессия, Помазанник» и здесь употреблено как титул.'
    reason: Альтернативная традиционная передача греческого титула.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт контраст и возобновление мысли из предыдущего контекста естественным русским союзом.
- source_word: ὡς ... οὕτως καὶ
  choice: как ... так и
  rationale: Сохраняет греческую соотносительную конструкцию и сравнительный характер высказывания.
- source_word: ἡ ἐκκλησία
  choice: церковь
  rationale: В контексте Павловых посланий обозначает христианскую общину; это ясный и общепринятый русский эквивалент.
- source_word: ὑποτάσσεται
  choice: подчиняется
  rationale: Передаёт добровольно-среднее или пассивное по форме отношение упорядоченного подчинения, не добавляя идеи принуждения, которой сам глагол здесь прямо не выражает.
- source_word: τῷ Χριστῷ
  choice: Мессии
  rationale: Χριστός здесь функционирует как титул; «Мессия» передаёт его значение, а традиционное «Христу» дано в примечании.
- source_word: αἱ γυναῖκες
  choice: жёны
  rationale: В контексте наставления о браке и в паре с ἀνδράσιν слово означает именно жён, а не женщин вообще.
- source_word: τοῖς ἀνδράσιν
  choice: мужьям
  rationale: Домашний и брачный контекст требует значения «мужья»; русская форма естественно выражает соотнесённость жён и мужей без добавления местоимения.
- source_word: ἐν παντί
  choice: во всём
  rationale: Прямо сохраняет широту греческого выражения, не вводя отсутствующих в стихе ограничений.
- source_word: эллипсис ὑποτάσσεται во второй части
  choice: тире без повторения глагола
  rationale: Греческий текст не повторяет сказуемое во второй части; русское тире естественно обозначает пропуск глагола «подчиняются» и сохраняет компактность оригинала.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном сравнении слово сохраняет функцию титула. Вариант «Христос», укоренённый в русской традиции, указан в сноске как допустимая передача.
- issue: Объём выражения ἐν παντί
  choice: Сохранить «во всём» без поясняющих ограничений
  alternative: Интерпретирующие расширения вроде «во всём подобающем»
  rationale: В греческом тексте стоит лишь ἐν παντί. Добавление ограничителей разрешило бы богословское напряжение средствами, которых нет в самом стихе.
- issue: Пропущенный глагол во второй части
  choice: Сохранить эллипсис посредством тире
  alternative: Добавить «должны подчиняться» или «подчиняются»
  rationale: Такой синтаксис остаётся понятным по-русски и не превращает зависимую сравнительную конструкцию в явно выраженное предписание сильнее, чем это делает данный текст.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизмов. Синтаксический параллелизм оригинала сохранён; тире естественно отмечает эллипсис сказуемого во второй части.
