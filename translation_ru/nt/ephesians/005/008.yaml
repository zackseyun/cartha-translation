  text: ἦτε γάρ ποτε σκότος, νῦν δὲ φῶς ἐν κυρίῳ· ὡς τέκνα φωτὸς περιπατεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/008.yaml
  text: For you were once darkness[a], but now you are light in the Lord. Walk as children of light,
translation:
  language: ru
  text: Ведь прежде вы были тьмой, а теперь вы — свет в Господе. Живите как дети света[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ходите как дети света». В посланиях Павла «ходить» — распространённый образ, означающий вести определённый образ жизни.'
    reason: Лексическая альтернатива и пояснение метафоры περιπατεῖτε.
lexical_decisions:
- source_word: ἦτε
  choice: вы были
  rationale: Имперфект εἰμί обозначает прежнее состояние; прямой русский эквивалент естественен в данном противопоставлении.
- source_word: γάρ
  choice: ведь
  rationale: Союз вводит обоснование предшествующего наставления; «ведь» естественно передаёт его пояснительную силу.
- source_word: ποτε
  choice: прежде
  rationale: Наречие указывает на прошлое состояние и ясно противопоставляет его нынешнему.
- source_word: σκότος
  choice: тьмой
  rationale: 'Сохранён предикативный абстрактный образ: адресаты не просто находились во тьме, а были тьмой.'
- source_word: νῦν δὲ
  choice: а теперь
  rationale: Передаёт выраженное противопоставление прежнего и нынешнего состояния.
- source_word: φῶς
  choice: свет
  rationale: Сохранён предикативный образ идентичности, без ослабления до «во свете» или «просвещены».
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Передаёт характерную для Павла сферу принадлежности и единения; не сужает смысл до средства действия.
- source_word: ὡς τέκνα φωτός
  choice: как дети света
  rationale: τέκνα относится к детям без указания пола, а родительный оборот сохраняет образную характеристику.
- source_word: περιπατεῖτε
  choice: живите
  rationale: В этическом контексте глагол метафорически означает вести определённый образ жизни. «Живите» естественно передаёт смысл в современном русском, а буквальный образ отмечен в сноске.
theological_decisions:
- issue: Предикативные образы «вы были тьмой» и «вы — свет»
  choice: 'Сохранить прямые образы идентичности: «были тьмой» и «вы — свет».'
  alternative: «были во тьме, а теперь находитесь во свете»; «были тёмными, а теперь просвещены»
  rationale: В греческом тексте σκότος и φῶς стоят как именные части сказуемого без предлогов. Формулировка подчёркивает глубокую перемену состояния и идентичности, а не только окружения.
- issue: Значение ἐν κυρίῳ
  choice: «в Господе»
  alternative: «благодаря Господу»; «через Господа»
  rationale: Буквальная формулировка сохраняет возможные оттенки сферы, принадлежности и единения со Христом, не сводя выражение только к причине или средству.
- issue: Передача κύριος
  choice: «Господь»
  alternative: «Владыка»; «господин»
  rationale: «Господь» соответствует новозаветному богословскому употреблению и сохраняет его христологическое звучание.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Тире в выражении «вы — свет» подчёркивает предикативную метафору. «Дети света» сохраняет исходный образ и гендерно нейтральное значение τέκνα.
