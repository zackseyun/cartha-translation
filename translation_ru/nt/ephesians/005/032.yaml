  source_fidelity: Текст точно передаёт греческое τὸ μυστήριον τοῦτο μέγα ἐστίν и пояснительное ἐγὼ δὲ λέγω εἰς Χριστὸν καὶ εἰς τὴν ἐκκλησίαν. «Эта тайна велика» сохраняет прямое значение μέγα, а «я же говорю о Мессии и о церкви» естественно передаёт δέ, λέγω и двукратно употреблённое εἰς без излишнего толкования.
