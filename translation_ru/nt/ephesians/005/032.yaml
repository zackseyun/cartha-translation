source:
  edition: SBLGNT
  text: τὸ μυστήριον τοῦτο μέγα ἐστίν, ἐγὼ δὲ λέγω εἰς Χριστὸν καὶ εἰς τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/032.yaml
  text: This mystery is great[c][b][a], but I am speaking with reference to Messiah and the church.
translation:
  language: ru
  text: Эта тайна[a] велика[b]; я же говорю о Мессии и о церкви.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «эта тайна» может относиться к единству мужа и жены, к приведённым перед этим словам из Бытия 2:24 или к их значению применительно к Мессии и церкви.
    reason: preserved_ambiguity
  - marker: b
    text: 'Или: «глубока». Буквально: «велика»; речь может идти о величии или значимости, а не только о глубине.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: тайна
  rationale: В посланиях Павла это слово обозначает прежде сокрытый, а теперь открытый Божий замысел или истину, а не просто нечто непонятное. «Тайна» сохраняет этот смысл и привычную библейскую лексику.
- source_word: μέγα
  choice: велика
  rationale: Прямо передаёт значение величия и значимости, не сводя его только к интеллектуальной глубине.
- source_word: δὲ
  choice: я же
  rationale: Частица обозначает мягкое противопоставление или переход к пояснению; русская конструкция «я же» естественно передаёт этот оттенок.
- source_word: λέγω
  choice: говорю
  rationale: Сохраняет настоящее время и словесный образ оригинала; вариант «имею в виду» был бы более толковательным.
- source_word: εἰς
  choice: о
  rationale: После λέγω предлог указывает на предмет речи. Русское «говорю о» естественно передаёт идиоматическое значение; повтор «о… и о…» также отражает повтор предлога в греческом тексте.
- source_word: Χριστόν
  choice: Мессии
  rationale: Χριστός здесь имеет титульное значение — Помазанник; «Мессия» ясно передаёт функцию титула, а не имени собственного.
- source_word: ἐκκλησίαν
  choice: церкви
  rationale: В данном контексте речь идёт о сообществе Божьего народа в его совокупности; «церковь» является естественным и точным русским соответствием.
theological_decisions:
- issue: К чему относится выражение «эта тайна»
  choice: Не уточнять референт в основном тексте
  alternative: Отнести тайну исключительно к браку, цитате из Бытия 2:24 или прообразной связи брака с Мессией и церковью
  rationale: Греческий текст допускает эти взаимосвязанные понимания и затем поясняет направленность слов Павла. Перевод не должен сужать смысл до одного толкования.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Точка с запятой ясно передаёт переход от утверждения к пояснению, не усиливая противопоставление.
