  text: καὶ αἰσχρότης καὶ μωρολογία ἢ εὐτραπελία, ⸂ἃ οὐκ ἀνῆκεν⸃, ἀλλὰ μᾶλλον εὐχαριστία.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/004.yaml
  text: And obscenity and foolish talk or crude joking[a], which are not fitting[b], but rather thanksgiving.
translation:
  language: ru
  text: Также не должно быть сквернословия, глупых речей или непристойных шуток[a] — всего того, что не подобает[b]; а лучше — благодарение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грубых шуток». Греческое слово εὐτραπελία может обозначать остроумие вообще, но здесь употреблено отрицательно, поскольку включено в перечень неподобающей речи.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «что неприлично»; «что неуместно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰσχρότης
  choice: сквернословие
  rationale: 'В данном окружении существительное обозначает постыдную, непристойную речь: следующие два порока явно относятся к речи, а противопоставлено им выражение благодарности. «Сквернословие» естественно передаёт этот контекстуально суженный смысл.'
- source_word: μωρολογία
  choice: глупые речи
  rationale: Передаёт сложное существительное со значением глупой, пустой речи, оставаясь понятным и не переходя в разговорно-сниженный стиль.
- source_word: ἢ
  choice: или
  rationale: Сохраняет обычное разделительное значение союза, который присоединяет последний элемент перечня.
- source_word: εὐτραπελία
  choice: непристойные шутки
  rationale: Хотя вне этого контекста слово может означать остроумие, здесь оно стоит среди пороков и прямо названо неподобающим; отрицательная характеристика необходима.
- source_word: ἃ οὐκ ἀνῆκεν
  choice: всего того, что не подобает
  rationale: Обобщающее относительное выражение отсылает ко всему предшествующему перечню и сохраняет нравственную оценку как неподобающего.
- source_word: ἀλλὰ μᾶλλον
  choice: напротив, лучше
  rationale: Передаёт как резкое противопоставление, так и усилительное значение μᾶλλον.
- source_word: εὐχαριστία
  choice: воздавайте благодарность
  rationale: Греческое существительное обозначает выражение благодарности. В русском языке повелительная глагольная конструкция естественно выражает подразумеваемую положительную альтернативу речи, хотя формально возможен вариант «благодарение».
theological_decisions:
- issue: Относится ли αἰσχρότης именно к речи
  choice: 'Передать как речевой порок: «сквернословие»'
  alternative: 'Более широко: «непристойность» или «постыдное поведение»'
  rationale: μωρολογία и εὐτραπελία непосредственно обозначают виды речи, а εὐχαριστία в этом противопоставлении также предполагает словесное выражение. При этом перевод не утверждает, что αἰσχρότης всегда имеет только речевой смысл.
- issue: Нравственная окраска εὐτραπελία
  choice: Негативное «непристойные шутки»
  alternative: Нейтральное или положительное «остроумие»
  rationale: Перечень пороков и пояснение «что не подобает» требуют здесь отрицательного смысла, не превращая всякое остроумие или юмор в предмет запрета.
- issue: Подразумеваемая синтаксическая связь с предыдущим стихом
  choice: Восполнить «не должно быть» для самостоятельного и естественного русского предложения
  alternative: 'Сохранить эллиптический фрагмент: «И сквернословие…»'
  rationale: Греческое καὶ продолжает конструкцию предыдущего стиха с подразумеваемым запретом. Восполнение делает стих понятным отдельно и не добавляет новой богословской мысли.
translation_notes:
  register: Современный литературный русский язык, понятный широкому кругу читателей. Сохранён достойный нравственно-наставительный тон; синтаксическая эллиптичность греческого текста умеренно восполнена из непосредственного контекста.
