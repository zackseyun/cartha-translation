lexical_decisions:
- source_word: ὑποτασσόμενοι
  choice: подчиняясь
  rationale: Причастие настоящего времени продолжает ряд причастных оборотов, связанных с предшествующим контекстом. Деепричастие «подчиняясь» естественно передаёт эту зависимость и не добавляет явно не выраженной возвратности.
- source_word: ἀλλήλοις
  choice: друг другу
  rationale: Взаимное местоимение в дательном падеже; русский оборот точно и естественно сохраняет взаимное значение.
- source_word: ἐν φόβῳ
  choice: в страхе перед
  rationale: Предлог ἐν обозначает сферу или образ действия. По-русски сочетание «в страхе перед» естественно передаёт φόβος с объектом, выраженным родительным падежом, не ослабляя его до одного лишь уважения.
- source_word: φόβῳ
  choice: страхе
  rationale: «Страх» сохраняет основное лексическое значение φόβος и богословское напряжение; возможные оттенки благоговения и трепета указаны в сноске.
- source_word: Χριστοῦ
  choice: Мессией
  rationale: Χριστός здесь сохраняет силу титула; «Мессия» передаёт его значение, а традиционное «Христос» отмечено как вариант.
theological_decisions:
- issue: Значение выражения φόβῳ Χριστοῦ
  choice: страх, направленный к Мессии
  alternative: благоговение перед Мессией; страх, вызываемый Мессией
  rationale: Наиболее прямое понимание родительного падежа — страх или благоговейный трепет перед Мессией. Основной текст сохраняет сильное слово «страх», не сводя его к простому почтению.
- issue: Передача Χριστοῦ
  choice: Мессией
  alternative: Христом
  rationale: В данном выражении Χριστός уместно понимать как титул. Перевод «Мессия» раскрывает значение титула, не отрицая традиционного варианта, приведённого в сноске.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет причастную связь стиха с предшествующим контекстом. Формулировка краткая, dignified и понятная, при этом лексическая и богословская неоднозначность вынесена в сноски.
