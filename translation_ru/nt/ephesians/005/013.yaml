  text: τὰ δὲ πάντα ἐλεγχόμενα ὑπὸ τοῦ φωτὸς φανεροῦται,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/013.yaml
  text: But all things[a], when exposed by the light, are made visible,
translation:
  language: ru
  text: Но всё, обличаемое светом, становится явным[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но всё становится явным, когда его обличает свет». Греческие причастие и глагол допускают близкие способы понимания: акцент может падать либо на действие света, выявляющего скрытое, либо на то, что обличённое становится явным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... πάντα
  choice: всё
  rationale: Субстантивированное нейтральное множественное число имеет широкий, всеохватный смысл; русское «всё» передаёт его естественно и без ненужного уточнения.
- source_word: δὲ
  choice: но
  rationale: Частица обозначает мягкое противопоставление предыдущему утверждению о скрытых делах тьмы.
- source_word: ἐλεγχόμενα
  choice: обличаемое
  rationale: 'Причастие сохраняет пассивную форму и смысловой диапазон ἐλέγχω: обличать, разоблачать, обнаруживать. В сочетании со светом на первом плане оказывается выявление скрытого, однако нравственный оттенок обличения не устраняется.'
- source_word: ὑπὸ τοῦ φωτὸς
  choice: светом
  rationale: Творительный падеж естественно передаёт деятеля при греческом ὑπό с родительным; определённость света ясна из контекста.
- source_word: φανεροῦται
  choice: становится явным
  rationale: Форма передаёт переход к открытости и видимости; выражение естественно по-русски и сохраняет образ действия света.
theological_decisions:
- issue: К чему относится «свет»
  choice: Сохранить слово «свет» без уточнения его референта.
  alternative: Прямо отождествить свет со Христом, благовестием, нравственной истиной или свидетельством верующих.
  rationale: Контекст связывает свет с жизнью верующих в Господе и с обличением дел тьмы, но сам стих не сужает образ до одного богословского референта.
- issue: Соотношение обличения и обнаружения
  choice: Сохранить конструкцию, в которой обличаемое светом становится явным.
  alternative: Понять фразу как утверждение, что свет делает явным вообще всё.
  rationale: Синтаксис греческого причастия допускает близкие способы членения; основной текст следует наиболее прямому прочтению, а примечание отмечает альтернативную расстановку акцентов.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и лаконичности исходной фразы. «Обличаемое» удерживает как образ обнаружения светом, так и нравственный оттенок контекста. Конечная запятая сохранена, поскольку стих синтаксически продолжается в Еф. 5:14.
