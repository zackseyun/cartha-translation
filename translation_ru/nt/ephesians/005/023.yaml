source:
  edition: SBLGNT
  text: ὅτι ἀνήρ ἐστιν κεφαλὴ τῆς γυναικὸς ὡς καὶ ὁ Χριστὸς κεφαλὴ τῆς ἐκκλησίας, ⸀αὐτὸς σωτὴρ τοῦ σώματος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/023.yaml
  text: For the husband is the head of the wife[a], as the Messiah also is the head of the church[d][c][b], himself the Savior of the body.
translation:
  language: ru
  text: Потому что муж — глава жены, как и Мессия — глава Церкви; Он Сам — Спаситель тела.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит основание предшествующего наставления; «потому что» естественно передаёт причинно-пояснительную связь.
- source_word: ἀνήρ / γυνή
  choice: муж / жена
  rationale: В контексте наставлений супругам требуются брачные, а не общие значения «мужчина / женщина».
- source_word: κεφαλή
  choice: глава
  rationale: Сохраняет греческую метафору и не сводит спорное значение к одному толкованию — «источник», «руководитель» или «властный глава».
- source_word: ὡς καὶ
  choice: как и
  rationale: Кратко и естественно сохраняет сравнительную структуру оригинала.
- source_word: Χριστός
  choice: Мессия
  rationale: Передаёт титульный смысл слова, активный в данном христологическом высказывании.
- source_word: ἐκκλησία
  choice: Церковь
  rationale: В павловском контексте обозначает сообщество верующих как единое целое; традиционный русский эквивалент здесь ясен и уместен.
- source_word: αὐτός
  choice: Он же
  rationale: Передаёт эмфатическое местоимение и выделяет личность Мессии как Спасителя тела.
- source_word: σωτήρ
  choice: Спаситель
  rationale: Стандартно передаёт как избавление, так и богословский спасительный смысл.
- source_word: σῶμα
  choice: тело
  rationale: Сохраняет метафору тела и не добавляет отсутствующего в греческом тексте местоимения «Своего».
theological_decisions:
- issue: Значение κεφαλή в сопоставлении мужа и жены с Мессией и Церковью
  choice: Сохранить метафору «глава» без её истолкования в основном тексте.
  alternative: «источник», «руководитель», «имеющий власть над»
  rationale: Семантика слова в этом месте спорна; буквальная метафора сохраняет подлинную богословскую напряжённость.
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Здесь слово действует как титул; «Мессия» делает его смысл прозрачным современному читателю.
- issue: Связь αὐτὸς σωτὴρ τοῦ σώματος с предшествующим высказыванием
  choice: Он же — Спаситель тела
  alternative: Сам будучи Спасителем тела; и Он — Спаситель тела
  rationale: Самостоятельная именная конструкция передаёт эмфазу αὐτός и лаконизм греческой фразы, не вводя отсутствующего причастия.
translation_notes:
  register: Современный литературный русский с достоинством библейского стиля. Тире обозначают именное сказуемое и помогают ясно прочитать параллельную структуру. Заглавное «Церковь» употреблено для вселенского сообщества верующих; местоимение «Он» написано с прописной буквы по принятой русской библейской традиции.
