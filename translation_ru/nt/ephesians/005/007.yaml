lexical_decisions:
- source_word: μὴ
  choice: не
  rationale: Отрицание при форме повелительного наклонения естественно передаётся по-русски частицей «не».
- source_word: οὖν
  choice: итак
  rationale: Слово выражает вывод из предшествующего предупреждения в стихах 3–6; «итак» ясно и естественно сохраняет логическую связь.
- source_word: γίνεσθε
  choice: становитесь
  rationale: Глагол указывает на вхождение в состояние или принятие роли; «становитесь» точнее передаёт эту динамику, чем простое «будьте».
- source_word: συμμέτοχοι
  choice: соучастниками
  rationale: Существительное обозначает тех, кто вместе с другими участвует в чём-либо. «Соучастники» сохраняет идею совместного участия и в данном контексте естественно несёт отрицательный оттенок, не добавляя прямо не названного объекта участия.
- source_word: αὐτῶν
  choice: их
  rationale: Родительный падеж местоимения непосредственно зависит от «соучастниками». Форма «их соучастниками» сохраняет указание на людей, не разворачивая его истолковательно в «в их делах».
theological_decisions:
- issue: Объём участия, подразумеваемого выражением συμμέτοχοι αὐτῶν
  choice: Общий запрет становиться соучастниками упомянутых людей, без уточнения, идёт ли речь об их поступках, образе жизни или разделении их участи.
  alternative: «Не участвуйте в их делах» или «не разделяйте их участь».
  rationale: В греческом тексте стоит местоимение «их», относящееся к людям, тогда как ближайший контекст подразумевает их греховное поведение и возможные последствия. Перевод сохраняет эту недосказанность и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык. Формулировка краткая и достойная; «соучастниками» передаёт совместное участие и подходит к отрицательному контексту, а сноска сохраняет более нейтральную лексическую альтернативу.
