base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/031.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife[a], and the two will become one flesh.
translation:
  language: ru
  text: Поэтому[a] мужчина оставит отца и мать, соединится со своей женой, и двое станут одной плотью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «По этой причине». Греческое выражение ἀντὶ τούτου здесь вводит следствие или основание в цитате из Бытия, а не означает «вместо этого».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τούτου
  choice: Поэтому
  rationale: В цитате из Бытия это сочетание служит причинно-следующей связкой. «Поэтому» естественно передаёт смысл и связь с контекстом, не придавая ἀντί значения замещения.
- source_word: καταλείψει
  choice: оставит
  rationale: Глагол обозначает уход из родительской семьи ради нового брачного союза; «оставит» сохраняет простоту и силу исходного выражения без оттенка эмоционального отречения.
- source_word: ἄνθρωπος
  choice: мужчина
  rationale: Хотя ἄνθρωπος может означать человека вообще, здесь он противопоставлен своей жене как мужчина в брачной паре.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: отца и мать
  rationale: Краткая русская формулировка естественна; принадлежность родственных отношений ясна из контекста и не требует добавления «своих».
- source_word: προσκολληθήσεται
  choice: соединится
  rationale: Слово выражает тесное присоединение к супруге. «Соединится» звучит естественно и достойно, передавая прочный брачный союз без излишне буквального образа прилипания.
- source_word: τῇ γυναικὶ αὐτοῦ
  choice: со своей женой
  rationale: В брачном контексте γυνή означает «жена»; местоимение αὐτοῦ передано возвратным притяжательным «своей».
- source_word: ἔσονται οἱ δύο
  choice: двое станут
  rationale: Буквальное «двое будут» возможно, но по-русски результат соединения естественнее выражается глаголом «станут»; явное οἱ δύο сохранено.
- source_word: εἰς σάρκα μίαν
  choice: одной плотью
  rationale: Сохранено устойчивое библейское выражение о брачном единстве. «Плоть» передаёт σάρξ точнее, чем «тело», и здесь не означает греховную природу.
theological_decisions:
- issue: Гендерная конкретность брачной цитаты
  choice: мужчина… со своей женой
  alternative: человек… со своим супругом
  rationale: Текст цитаты изображает мужчину и его жену; гендерно нейтральная передача устранила бы присутствующее в источнике различие.
- issue: Значение σάρξ в выражении εἰς σάρκα μίαν
  choice: одной плотью
  alternative: одним телом
  rationale: Здесь σάρξ входит в цитату из Бытия и обозначает телесно-родственное брачное единство, а не греховное начало. Традиционное «плоть» сохраняет образ и богословскую открытость выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранено выражение «одной плотью», но архаичные обороты вроде «прилепится к жене своей» заменены понятной современной формой.
