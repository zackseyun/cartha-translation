  yaml_path: translation/nt/ephesians/005/033.yaml
  text: Nevertheless[a], you also—each one individually—must love his own wife as himself[b], and the wife must fear her husband.
translation:
  language: ru
  text: Впрочем, и каждый из вас пусть любит свою жену так же, как самого себя, а жена пусть уважает мужа[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы жена боялась мужа»; здесь «бояться» означает относиться с почтением и уважением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Впрочем
  rationale: Передаёт заключительный переход к практическому итогу предыдущего рассуждения, сохраняя лёгкий ограничительно-противительный оттенок.
- source_word: καὶ ὑμεῖς
  choice: и … из вас
  rationale: Сохраняет включение адресатов в заключительное наставление; в русском естественно соединяется с последующим «каждый из вас».
- source_word: οἱ καθ’ ἕνα ἕκαστος
  choice: каждый из вас
  rationale: 'Естественно и ясно передаёт усиленное распределительное значение: наставление относится лично к каждому мужу.'
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: свою жену
  rationale: «Жену» соответствует брачному контексту, а возвратное «свою» точно передаёт ἑαυτοῦ.
- source_word: οὕτως ἀγαπάτω
  choice: пусть любит
  rationale: Форма с «пусть» естественно передаёт повелительное наклонение третьего лица. Отдельное «так» не выражено, поскольку последующее сравнение «как самого себя» в русском уже ясно указывает на образ любви.
- source_word: ὡς ἑαυτόν
  choice: как самого себя
  rationale: Сохраняет прямое сравнение и усиленную возвратную форму.
- source_word: ἡ δὲ γυνὴ
  choice: а жена
  rationale: «Жена» требуется брачным контекстом; «а» естественно отмечает переход ко второй стороне парного наставления без чрезмерного противопоставления.
- source_word: ἵνα φοβῆται
  choice: пусть уважает
  rationale: В данном контексте φοβέομαι обозначает почтительное отношение, а не испуг; «уважает» естественно передаёт этот смысл современному читателю. Буквальное значение отмечено в сноске.
- source_word: τὸν ἄνδρα
  choice: мужа
  rationale: В брачном контексте ἀνήρ означает «муж»; русский определённо-личный контекст не требует добавления притяжательного местоимения.
theological_decisions:
- issue: Значение φοβῆται в наставлении жене
  choice: уважает
  alternative: боится; чтит
  rationale: Глагол допускает значения страха, благоговения и почтительного уважения. Контекст супружеского наставления поддерживает значение уважительного почтения, но лексическая напряжённость сохраняется в сноске.
- issue: Гендерно конкретная форма наставления
  choice: свою жену … жена … мужа
  alternative: супруги в гендерно нейтральной формулировке
  rationale: Греческий текст прямо обращается к мужьям и жёнам в формах единственного числа; перевод сохраняет эту конкретность.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Повелительная конструкция «пусть» сохраняет наставительный характер текста, а порядок слов остаётся естественным для русского читателя.
