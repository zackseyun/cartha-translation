lexical_decisions:
- source_word: Αἱ γυναῖκες
  choice: Жёны
  rationale: В контексте наставлений о семье и в сочетании с «своим мужьям» слово обозначает жён, а не женщин вообще.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: своим мужьям
  rationale: ἀνήρ здесь имеет значение «муж», а ἰδίοις указывает на конкретные брачные отношения; естественное русское «своим» сохраняет этот оттенок.
- source_word: ὡς
  choice: как
  rationale: Простое сравнительное «как» сохраняет лаконичность и не уточняет сверх текста характер сравнения.
- source_word: τῷ κυρίῳ
  choice: Господу
  rationale: В данном контексте κύριος относится к Господу Иисусу; определённость по-русски естественно передаётся без артикля, с прописной буквы.
- source_word: implicit verb from context
  choice: тире без добавления глагола
  rationale: 'В греческом тексте стиха 22 сказуемого нет: смысл продолжается из ὑποτασσόμενοι в стихе 21. Именительный «Жёны» и тире позволяют сохранить эллипсис в современном русском.'
theological_decisions:
- issue: Добавлять ли в основной текст глагол «повинуйтесь», отсутствующий в греческом тексте стиха 22
  choice: Не добавлять глагол; сохранить эллиптическую конструкцию и пояснить её в сноске.
  alternative: «Жёны, повинуйтесь своим мужьям, как Господу».
  rationale: Хотя подразумеваемый смысл восстанавливается из стиха 21, добавление глагола сделало бы явным то, что в самом стихе 22 оставлено синтаксически зависимым от предыдущего предложения. Тире делает конструкцию понятной по-русски, не устраняя эту особенность.
translation_notes:
  register: Современный литературный русский, краткий и достойный по тону. Эллипсис оригинала сохранён с помощью тире; запятая в конце отражает продолжение предложения.
