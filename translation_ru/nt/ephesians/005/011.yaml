  text: καὶ μὴ συγκοινωνεῖτε τοῖς ἔργοις τοῖς ἀκάρποις τοῦ σκότους, μᾶλλον δὲ καὶ ἐλέγχετε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/011.yaml
  text: And do not participate in the unfruitful works of darkness[a], but instead even expose them[b],
translation:
  language: ru
  text: И не участвуйте в бесплодных делах тьмы[a], а, напротив, обличайте их[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будьте причастны к бесплодным делам тьмы»; возможен также смысл «не имейте с ними ничего общего».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «разоблачайте их», «порицайте их». Греческий глагол может обозначать словесное обличение, но в данном контексте также связан с выявлением дел и выведением их на свет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκοινωνεῖτε
  choice: участвуйте в
  rationale: Глагол означает совместно участвовать или быть причастным к чему-либо. «Участвовать в» естественно звучит по-русски и ясно передаёт деятельную вовлечённость.
- source_word: ἔργοις
  choice: делах
  rationale: «Дела» сохраняет обычную для Павла нравственную лексику и естественно сочетается с образом плода.
- source_word: ἀκάρποις
  choice: бесплодных
  rationale: «Бесплодных» непосредственно сохраняет метафору отсутствия плода и связь с ближайшим контекстом о плоде света.
- source_word: τοῦ σκότους
  choice: тьмы
  rationale: Родительный падеж передан без уточняющего истолкования, благодаря чему сохраняются метафорическая и нравственная многозначность выражения.
- source_word: μᾶλλον δὲ καὶ
  choice: а, напротив
  rationale: Оборот подчёркивает резкое противопоставление пассивному неучастию активного действия; отдельная передача καί словом «даже» по-русски здесь была бы тяжеловесной, а его усилительная функция выражена всем оборотом.
- source_word: ἐλέγχετε
  choice: обличайте
  rationale: «Обличать» может означать как выявлять зло и выводить его на свет, так и нравственно указывать на него; это сохраняет смысловую широту глагола в контексте образов света и тьмы.
theological_decisions:
- issue: Значение ἐλέγχετε применительно к делам тьмы
  choice: обличайте их
  alternative: разоблачайте их; укоряйте за них
  rationale: Контекст света и обнаружения в стихах 8–13 поддерживает смысл выявления, тогда как сам глагол допускает также нравственное порицание. «Обличайте» сохраняет обе стороны и не сводит повеление только к публичному разоблачению или словесному укору.
- issue: Сила противопоставления двух повелений
  choice: не участвуйте… а, напротив, обличайте
  alternative: не будьте причастны… но лучше обличайте
  rationale: Формулировка сохраняет переход от отказа участвовать во зле к активному противодействию ему, не уточняя способ такого противодействия сверх сказанного в греческом тексте.
translation_notes:
  register: Современный литературный русский язык; тон краткий, повелительный и достойный. Сохранены павловские образы бесплодия, тьмы и обличения, а смысловая широта ключевого глагола пояснена в сноске.
