  source_fidelity: 'Текст точно передаёт оба повеления: μὴ συγκοινωνεῖτε — «не участвуйте», τοῖς ἔργοις τοῖς ἀκάρποις τοῦ σκότους — «в бесплодных делах тьмы», а ἐλέγχετε — «обличайте их». Русское «обличайте» удачно сохраняет присущую ἐλέγχω широту: нравственное изобличение и выявление зла, не сводя смысл только к публичному разоблачению.'
  naturalness: 'Фраза краткая, ясная и естественная для современного литературного русского: «И не участвуйте в бесплодных делах тьмы, а, напротив, обличайте их». Пунктуация и порядок слов нормативны; регистр соответствует наставительному стилю послания.'
  terminology: «Дела тьмы» и «бесплодные» сохраняют образность и лексику исходного текста. «Обличайте» является уместным библейско-литературным, но всё ещё понятным современному читателю соответствием ἐλέγχετε. Сноски верно привязаны к «тьмы» и «их» и поясняют варианты без навязывания одного спорного оттенка.
