  text: οὕτως ὀφείλουσιν ⸀καὶ οἱ ἄνδρες ἀγαπᾶν τὰς ἑαυτῶν γυναῖκας ὡς τὰ ἑαυτῶν σώματα· ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα ἑαυτὸν ἀγαπᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/028.yaml
  text: In the same way, husbands also ought to love their own wives as their own bodies. He who loves his own wife loves himself,
translation:
  language: ru
  text: Так и мужья должны любить своих жён, как свои тела. Кто любит свою жену, тот любит самого себя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Так и
  rationale: Передаёт связь с предшествующим сравнением и вместе с καί естественно вводит соответствующий вывод применительно к мужьям.
- source_word: ὀφείλουσιν
  choice: должны
  rationale: Выражает нравственную обязанность в естественной современной русской форме, не превращая изъявительное высказывание в прямой императив.
- source_word: καὶ οἱ ἄνδρες
  choice: и мужья
  rationale: καί имеет добавочное значение, а ἄνδρες в контексте наставления супругам означает именно мужей.
- source_word: ἀγαπᾶν
  choice: любить
  rationale: Сохраняет повтор глагола ἀγαπάω и его прямое смысловое соответствие.
- source_word: τὰς ἑαυτῶν γυναῖκας
  choice: своих жён
  rationale: Возвратное «своих» передаёт ἑαυτῶν, а γυναῖκας в брачном контексте — «жён».
- source_word: ὡς τὰ ἑαυτῶν σώματα
  choice: как свои тела
  rationale: Буквально и естественно сохраняет явное сравнение и телесный образ.
- source_word: ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα
  choice: Кто любит свою жену
  rationale: Русская конструкция «кто… тот…» естественно передаёт субстантивированное причастие и сохраняет конкретную отсылку к жене.
- source_word: ἑαυτὸν ἀγαπᾷ
  choice: тот любит самого себя
  rationale: «Самого себя» передаёт усиленный возвратный смысл и сохраняет повтор глагола «любить».
theological_decisions:
- issue: Гендерная конкретность наставления
  choice: «мужья» и «кто любит свою жену»
  alternative: «мужчины» или гендерно-нейтральная формулировка
  rationale: Контекст обращён именно к мужьям в браке; перевод не расширяет адресатов до мужчин вообще и не нейтрализует семейную конкретность.
- issue: Характер сравнения жены с собственным телом
  choice: Сохранено прямое сравнение без поясняющего расширения
  alternative: Передать как утверждение метафизического тождества жены и тела мужа
  rationale: Текст формулирует этическое сравнение и вывод о любви к себе; перевод сохраняет эту логику, не навязывая дополнительного догматического толкования.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, достоинственная и понятная. Повтор «любит» намеренно сохранён как важный элемент аргументации оригинала.
