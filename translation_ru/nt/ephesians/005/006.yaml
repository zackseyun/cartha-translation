source:
  edition: SBLGNT
  text: Μηδεὶς ὑμᾶς ἀπατάτω κενοῖς λόγοις, διὰ ταῦτα γὰρ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/006.yaml
  text: Let no one deceive you with empty words[a], for because of these things the wrath of God comes upon the sons of disobedience.
translation:
  language: ru
  text: Пусть никто не обманывает вас пустыми словами, потому что из-за этого гнев Божий приходит на сынов непослушания[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Сыны непослушания» — то есть люди, для которых характерно непослушание.
    reason: Пояснение идиоматического выражения
lexical_decisions:
- source_word: Μηδεὶς … ἀπατάτω
  choice: Пусть никто не обманывает
  rationale: Эта конструкция естественно передаёт греческое запрещение с императивом настоящего времени и сохраняет прямой характер предостережения.
- source_word: κενοῖς λόγοις
  choice: пустыми словами
  rationale: Сохраняет образ пустоты, то есть слов, лишённых истины и действительного содержания, не сужая λόγοις до «доводов».
- source_word: διὰ ταῦτα
  choice: за всё это
  rationale: Передаёт причинное значение διά с винительным падежом; «всё» естественно отсылает к перечисленным выше поступкам, не определяя их заново.
- source_word: ἔρχεται
  choice: приходит
  rationale: 'Сохраняет настоящее время и допускает присущую греческой форме смысловую широту: действие может пониматься как совершающееся, закономерное или предстоящее.'
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: гнев Божий
  rationale: Точно передаёт ὀργή и не смягчает его до общего понятия суда; форма естественна для современного литературного русского языка и сохраняет возвышенный регистр.
- source_word: ἐπὶ
  choice: на
  rationale: Естественно передаёт направленность гнева на людей без излишне архаичного «на сынов сходит».
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: сынов непослушания
  rationale: Сохраняет буквальный образ семитизированного оборота и грамматически мужское υἱούς; сноска поясняет его характеристический смысл.
theological_decisions:
- issue: Передача гнева Бога
  choice: гнев Божий
  alternative: суд Божий
  rationale: В исходном тексте стоит ὀργή («гнев»), поэтому более общее «суд» неоправданно ослабило бы богословскую напряжённость высказывания.
- issue: Передача выражения τοὺς υἱοὺς τῆς ἀπειθείας
  choice: сынов непослушания
  alternative: непокорных людей
  rationale: Основной текст сохраняет исходную метафорическую форму, а сноска раскрывает идиоматический смысл, не сводя непослушание только к неверию или мятежу.
- issue: Временной оттенок ἔρχεται
  choice: приходит
  alternative: придёт
  rationale: Настоящее время греческого глагола оставлено без эсхатологического уточнения, чтобы не устранять возможную смысловую широту между нынешним действием и грядущим проявлением Божьего гнева.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; сохранены библейский образ «сыны непослушания» и прямое выражение «гнев Божий». Маркер сноски поставлен непосредственно после поясняемого выражения.
