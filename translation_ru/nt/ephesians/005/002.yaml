source:
  edition: SBLGNT
  text: καὶ περιπατεῖτε ἐν ἀγάπῃ, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν ⸀ἡμᾶς καὶ παρέδωκεν ἑαυτὸν ὑπὲρ ⸀ἡμῶν προσφορὰν καὶ θυσίαν τῷ θεῷ εἰς ὀσμὴν εὐωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/002.yaml
  text: and walk in love[a], just as the Messiah also loved us and gave himself up for us[c][b], an offering and sacrifice to God for a fragrant aroma.
translation:
  language: ru
  text: и живите в любви, как и Мессия[a] возлюбил нас и отдал Себя за нас[b] — как приношение и жертву Богу, в приятное благоухание[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческое Χριστός здесь употреблено как титул со значением «Мессия».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «ради нас» или «в нашу пользу». Выражение ὑπὲρ ἡμῶν может обозначать действие ради кого-либо или в его пользу; перевод не сужает его до значения «вместо нас».'
    reason: lexical_alternative
  - marker: c
    text: Выражение «в приятное благоухание» перекликается с ветхозаветным языком жертвоприношений, угодных Богу.
    reason: cross_reference
lexical_decisions:
- source_word: περιπατεῖτε
  choice: живите
  rationale: Глагол буквально означает «ходите», но у Павла это устойчивая метафора образа жизни. «Живите» естественно передаёт её смысл в современном русском языке.
- source_word: ἐν ἀγάπῃ
  choice: в любви
  rationale: Сохраняет предложную конструкцию и возможный оттенок любви как сферы и образа жизни.
- source_word: ὁ Χριστός
  choice: Мессия
  rationale: Артикль поддерживает понимание Χριστός как титула; «Мессия» передаёт значение титула, а не обращается с ним как с личным именем.
- source_word: ἠγάπησεν ἡμᾶς
  choice: возлюбил нас
  rationale: Передаёт аорист как совершившееся действие и сохраняет лексическую связь с существительным «любовь».
- source_word: παρέδωκεν ἑαυτὸν
  choice: отдал Себя
  rationale: Естественно передаёт добровольную самоотдачу в жертвенном контексте, не добавляя того, чего прямо нет в греческом тексте.
- source_word: ὑπὲρ ἡμῶν
  choice: за нас
  rationale: Краткая естественная формулировка, сохраняющая благодетельный и представительский диапазон ὑπέρ без обязательного уточнения «вместо нас».
- source_word: προσφορὰν καὶ θυσίαν
  choice: приношение и жертву
  rationale: Оба жертвенных термина сохранены и не сведены к одному понятию.
- source_word: τῷ θεῷ
  choice: Богу
  rationale: Дательный падеж естественно обозначает адресата приношения.
- source_word: εἰς ὀσμὴν εὐωδίας
  choice: как благоуханный аромат
  rationale: Передаёт конкретный образ приятного запаха и его ветхозаветный жертвенный фон понятным современным языком.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном контексте слово с артиклем выступает как титул. Основной текст передаёт значение титула, а привычная форма указана в примечании.
- issue: Смысл ὑπὲρ ἡμῶν в жертвенном контексте
  choice: за нас
  alternative: ради нас; от нашего имени; вместо нас
  rationale: Греческое выражение несёт благодетельный и представительский смысл, но само по себе не требует сузить его до явно заместительной формулы. Перевод сохраняет эту богословскую ёмкость.
- issue: Жертвенный образ εἰς ὀσμὴν εὐωδίας
  choice: как благоуханный аромат
  alternative: в приятное благоухание
  rationale: Выбранная формулировка сохраняет образ жертвы, угодной Богу, не превращая подразумеваемую оценку в отдельное явное утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. «Живите» предпочтено буквальному «ходите» ради ясности для обычного читателя; жертвенная терминология и образ благоухания сохранены. Прописное «Себя» следует устойчивой русской традиции уважительного обозначения Мессии.
