  terminology: «Дарован» удачно сохраняет пассивную форму и оттенок безвозмездного/милостивого дара в χαρισθήσομαι, не превращая подразумеваемое Божье действие в явное. Сноски корректно отражают лексическую широту ξενία и χαρίζομαι и поставлены у соответствующих слов.
