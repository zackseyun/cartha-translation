  text: ἅμα δὲ καὶ ἑτοίμαζέ μοι ξενίαν, ἐλπίζω γὰρ ὅτι διὰ τῶν προσευχῶν ὑμῶν χαρισθήσομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/022.yaml
  text: At the same time also prepare a guest room for me[b][a], for I hope that through your prayers I will be granted to you.
translation:
  language: ru
  text: А заодно приготовь для меня место для ночлега[a], потому что я надеюсь, что благодаря вашим молитвам буду дарован вам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жильё», «комнату для гостя» или «гостеприимство»; греческое слово может обозначать как оказанное гостеприимство, так и приготовленное для гостя место.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «буду милостиво дан вам». Греческий глагол выражает свободное, милостивое дарование и, вероятно, подразумевает действие Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: А заодно
  rationale: Передаёт присоединение ещё одной просьбы к предыдущей и звучит естественно в современном русском языке.
- source_word: ἑτοίμαζέ μοι
  choice: приготовь для меня
  rationale: Императив передан прямо, а дательный μοι — как указание на того, для кого следует всё приготовить.
- source_word: ξενίαν
  choice: место для ночлега
  rationale: В данном сочетании наиболее естествен конкретный смысл жилья или помещения для гостя; при этом более широкий диапазон слова отмечен в сноске.
- source_word: ἐλπίζω γὰρ ὅτι
  choice: потому что я надеюсь, что
  rationale: γάρ объясняет причину просьбы, а ὅτι вводит содержание надежды.
- source_word: διὰ τῶν προσευχῶν ὑμῶν
  choice: благодаря вашим молитвам
  rationale: διά с родительным обозначает средство или содействующий фактор; русское «благодаря» естественно связывает ожидаемый исход с молитвами адресатов.
- source_word: χαρισθήσομαι ὑμῖν
  choice: буду дарован вам
  rationale: Сохраняет страдательный залог, направленность к адресатам и оттенок свободного, милостивого дара, не добавляя прямо не названного деятеля.
theological_decisions:
- issue: Подразумеваемый деятель при χαρισθήσομαι
  choice: Сохранить страдательную конструкцию «буду дарован вам», не называя Бога прямо.
  alternative: «Бог вернёт меня вам» или «я буду освобождён и вернусь к вам».
  rationale: Контекст позволяет подразумевать Божье действие, однако греческий текст не называет деятеля и не употребляет здесь глагол освобождения; перевод сохраняет эту недосказанность.
translation_notes:
  register: Современный литературный русский язык с тёплым, личным и вместе с тем достойным тоном частного апостольского письма. «Место для ночлега» понятно широкому читателю и не предполагает непременно отдельной гостевой комнаты.
