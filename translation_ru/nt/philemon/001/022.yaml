  source_fidelity: 'Текст точно передаёт синтаксис и смысл греческого оригинала: ἅμα δὲ καὶ уместно передано «А заодно», повелительное ἑτοίμαζε — «приготовь», ξενίαν — конкретным «место для ночлега», а διὰ τῶν προσευχῶν ὑμῶν — «благодаря вашим молитвам». Страдательный залог χαρισθήσομαι и направленность ὑμῖν сохранены в формулировке «буду дарован вам»; перевод не добавляет прямо ни освобождения, ни названного деятеля.'
