lexical_decisions:
- source_word: παρακαλῶ
  choice: прошу
  rationale: В контексте личного послания глагол вводит сердечную, настойчивую просьбу, а не приказ; «прошу» естественно передаёт доверительный тон.
- source_word: περὶ τοῦ ἐμοῦ τέκνου
  choice: о моём дитя
  rationale: περί с родительным означает «о, относительно», а τέκνον здесь метафорически обозначает духовное дитя. «Дитя» сохраняет родительский образ и звучит теплее, чем нейтральное «ребёнок».
- source_word: ὃν ἐγέννησα
  choice: которого я родил
  rationale: Буквальный образ рождения сохранён без замены на явное утверждение об обращении Онисима. В русском «родил» применительно к Павлу необычно, но намеренно передаёт резкость и выразительность греческой метафоры.
- source_word: ἐν τοῖς δεσμοῖς
  choice: в узах
  rationale: «Узы» сохраняют конкретный образ оков и одновременно естественно обозначают заключение; притяжательное «моих» в греческом отсутствует и по-русски не требуется.
- source_word: Ὀνήσιμον
  choice: Онисиме
  rationale: Использована традиционная русская форма имени; падеж обусловлен конструкцией «прошу о…».
theological_decisions:
- issue: Характер отношений Павла и Онисима
  choice: 'Сохранить метафору духовного рождения: «которого я родил».'
  alternative: «которому я стал отцом» / «которого я обратил к вере»
  rationale: Греческий текст подразумевает духовное отцовство Павла, но выражает его через γεννάω. Перевод не превращает подразумеваемое обращение в прямое доктринальное утверждение.
translation_notes:
  register: Современный литературный русский с достоинством и личной теплотой. Слово «дитя» слегка возвышенно, но понятно и уместно для нежной родительской метафоры; «в узах» сохраняет библейски выразительный, не архаичный в данном контексте образ.
