source:
  edition: SBLGNT
  text: καὶ Ἀπφίᾳ τῇ ⸀ἀδελφῇ καὶ Ἀρχίππῳ τῷ συστρατιώτῃ ἡμῶν καὶ τῇ κατ’ οἶκόν σου ἐκκλησίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/002.yaml
  text: 'and to Apphia our sister[a], and to Archippus our fellow soldier, and to the church in your house:'
translation:
  language: ru
  text: 'и сестре Апфии[a], и Архиппу, нашему соратнику, и церкви в твоём доме:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «нашей сестре».'
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπφίᾳ
  choice: Апфии
  rationale: Личное имя передано в принятой русской библейской форме; дательный падеж отражает адресата приветствия.
- source_word: ἀδελφῇ
  choice: сестре
  rationale: Передаёт христианское родственное наименование без добавления отсутствующего в основном тексте SBLGNT местоимения «нашей».
- source_word: Ἀρχίππῳ
  choice: Архиппу
  rationale: Личное имя передано в принятой русской библейской форме и поставлено в дательном падеже.
- source_word: συστρατιώτῃ
  choice: соратнику
  rationale: Естественное современное русское слово, сохраняющее военный образ совместной службы.
- source_word: ἐκκλησίᾳ
  choice: церкви
  rationale: В данном христианском эпистолярном контексте «церковь» естественно обозначает общину верующих.
- source_word: κατ’ οἶκόν σου
  choice: в твоём доме
  rationale: 'Близко передаёт греческое выражение и сохраняет возможную смысловую широту: община находится или собирается в доме Филимона.'
- source_word: καὶ
  choice: и
  rationale: Повтор союза сохранён, чтобы передать последовательную структуру перечисления адресатов.
- source_word: ἡμῶν
  choice: нашему
  rationale: Местоимение относится к Архиппу в выражении «нашему соратнику» и явно присутствует в греческом тексте.
theological_decisions:
- issue: Следует ли добавлять к слову ἀδελφῇ притяжательное местоимение «нашей»
  choice: сестре
  alternative: нашей сестре
  rationale: Основной текст SBLGNT гласит τῇ ἀδελφῇ без ἡμῶν, поэтому перевод не вводит местоимение из вариативной рукописной традиции. Вариант отмечен в сноске.
- issue: Как передать военную метафору συστρατιώτῃ
  choice: соратнику
  alternative: товарищу по оружию
  rationale: «Соратник» сохраняет образ совместной борьбы и при этом звучит естественно в кратком приветствии, не превращая метафору в буквальное утверждение о военной службе.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского приветствия. Повторяющийся союз «и» сохраняет ритм оригинала; порядок «сестре Апфии» выбран как естественный для русского языка. Местоимение «твоём» оставлено в единственном числе, как в греческом σου.
