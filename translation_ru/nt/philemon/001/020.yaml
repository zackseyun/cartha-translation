  source_fidelity: 'Основной смысл передан верно: ναί — «Да», братское обращение сохранено, ἐν κυρίῳ — «в Господе», а σπλάγχνα уместно передано словом «сердце». Однако «пусть будет мне от тебя польза» в современном русском звучит безлично и тяжеловесно и несколько ослабляет личную просьбу, выраженную оптативом ὀναίμην. Для ἀνάπαυσον «ободри» точнее передаёт призыв дать Павлу облегчение/отраду, чем «успокой», которое может подразумевать прекращение тревоги. Χριστῷ имеет титульный смысл; в соответствии с английской аудиторской траекторией и заявленной политикой его следует передать как «в Мессии».'
