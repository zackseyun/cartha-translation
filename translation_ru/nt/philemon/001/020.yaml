base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/020.yaml
  text: Yes[a], brother, let me have benefit from you in the Lord[c][b]; refresh my heart in Messiah.
translation:
  language: ru
  text: Да, брат, дай мне получить от тебя пользу в Господе[a]; ободри моё сердце[b] в Мессии[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «дай мне воспользоваться твоей помощью» или «порадуй меня». Здесь, вероятно, есть игра со значением имени Онисим — «полезный».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мои внутренности» — образное обозначение глубоких чувств или внутреннего существа человека.'
    reason: lexical_alternative
  - marker: c
    text: «Мессия» — значение греческого титула «Христос», то есть «Помазанник».
    reason: translation_clarification
lexical_decisions:
- source_word: ναί
  choice: Да
  rationale: Естественно передаёт тёплое подтверждение, которым Павел вводит личную просьбу.
- source_word: ἀδελφέ
  choice: брат
  rationale: Форма звательного обращения к Филимону как к брату по вере; в русском обращение выражается именительным падежом.
- source_word: ἐγώ σου ὀναίμην
  choice: пусть будет мне от тебя польза
  rationale: Сохраняет значение пользы или блага и форму настойчивой, но доброжелательной просьбы; также позволяет услышать вероятную игру со значением имени Онисим.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Передаёт обычную для Павла формулу сферы отношений и поступков, определяемых единением с Господом.
- source_word: ἀνάπαυσόν
  choice: успокой
  rationale: Глагол означает дать покой или облегчение; здесь речь о конкретном душевном утешении Павла и имеется смысловая перекличка со стихом 7.
- source_word: μου τὰ σπλάγχνα
  choice: моё сердце
  rationale: Буквально речь о внутренностях, но в данном контексте это идиома глубоких чувств и внутреннего существа; «сердце» естественно передаёт её по-русски.
- source_word: ἐν Χριστῷ
  choice: во Христе
  rationale: В современном литературном русском «Христос» — укоренившаяся форма титула Χριστός; предложный падеж естественно оформляет формулу единения и общей жизни во Христе.
theological_decisions:
- issue: Передача Χριστῷ
  choice: во Христе
  alternative: в Мессии
  rationale: Χριστός исторически означает «Помазанник, Мессия», однако по-русски «Христос» остаётся общеупотребительной и узнаваемой формой этого титула, а не только личным именем. Смысл титула отмечен в сноске.
- issue: Передача κυρίῳ
  choice: в Господе
  alternative: во Владыке
  rationale: «Господь» сохраняет обычное новозаветное титульное употребление и не сужает выражение до социального значения «хозяин» в контексте послания о рабе.
translation_notes:
  register: Современный литературный русский язык с тёплым, личным и вместе с тем достойным тоном. Синтаксис сохраняет две параллельные просьбы оригинала; точка с запятой передаёт их тесную связь. Формулировка не устраняет вероятную игру слов, но объясняет её в сноске.
