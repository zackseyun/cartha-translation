  text: But if he has wronged you in any way or owes you anything[a], charge this to me.
translation:
  language: ru
  text: Если же он чем-либо обидел тебя или что-нибудь тебе должен, поставь это на мой счёт.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зачти это за мной». Глагол имеет значение из языка расчётов: внести сумму или обязательство на чей-либо счёт.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Если же
  rationale: Условный союз εἰ передан словом «если», а δέ — частицей «же», которая естественно выражает мягкий переход и оттенок противопоставления предыдущей мысли.
- source_word: τι ἠδίκησέν σε
  choice: он чем-либо обидел тебя
  rationale: ἀδικέω обозначает причинение несправедливости или ущерба. «Обидел» здесь достаточно широко охватывает личную и материальную неправоту, а «чем-либо» передаёт неопределённое τι.
- source_word: ἢ ὀφείλει
  choice: или что-нибудь тебе должен
  rationale: ὀφείλω указывает на долг или обязательство; местоимение «тебе» ясно восстанавливается из контекста, а «что-нибудь» сохраняет неопределённость возможного долга.
- source_word: τοῦτο ἐμοὶ ἐλλόγα
  choice: поставь это на мой счёт
  rationale: 'ἐλλογέω — слово из языка расчётов: внести в счёт, начислить или отнести на чей-либо счёт. Русское выражение естественно сохраняет бухгалтерскую метафору и ясно передаёт готовность Павла принять обязательство на себя.'
