base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/021.yaml
  text: Confident of your obedience[a], I wrote to you, knowing that you will do even more than I say.
translation:
  language: ru
  text: Будучи уверен в твоём послушании, я написал тебе, зная, что ты сделаешь даже больше, чем я говорю.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сверх того, что я говорю». Возможно, Павел подразумевает, что Филимон сделает больше, чем его прямо попросили, однако в тексте не уточняется, что именно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: Уверенный
  rationale: Перфектное причастие передаёт устойчивую уверенность Павла; краткая форма «уверенный» естественно вводит основание, по которому он пишет.
- source_word: τῇ ὑπακοῇ σου
  choice: в твоём послушании
  rationale: ὑπακοή прямо обозначает послушание или готовность последовать сказанному. «Послушание» сохраняет силу обращения Павла, не усиливая её до принуждения.
- source_word: ἔγραψά σοι
  choice: я написал тебе
  rationale: Аорист передан прошедшим временем. Формулировка также сохраняет возможный эпистолярный оттенок речи автора о пишущемся письме.
- source_word: εἰδὼς
  choice: зная
  rationale: Причастная форма сохраняет связь уверенного знания Павла с тем, что он написал.
- source_word: καὶ ὑπὲρ ἃ λέγω
  choice: даже больше того, о чём я говорю
  rationale: ὑπέρ с винительным означает «сверх, больше чем», а καί усиливает выражение. Перевод остаётся открытым и не уточняет, какое именно дополнительное действие ожидается.
- source_word: ποιήσεις
  choice: ты сделаешь
  rationale: Будущее время и широкий смысл ποιέω переданы прямо; неопределённость ожидаемого действия сохранена.
theological_decisions:
- issue: Сила слова ὑπακοή в обращении Павла к Филимону
  choice: «послушание»
  alternative: «согласие», «готовность откликнуться»
  rationale: Исходное слово имеет прямое значение послушания. Такой перевод сохраняет присутствующую в письме динамику авторитета, не добавляя не выраженного в тексте принуждения.
- issue: Подразумеваемый смысл слов «больше того, о чём я говорю»
  choice: Оставить ожидаемое дополнительное действие неопределённым
  alternative: Уточнить, что Павел просит освободить Онисима, либо ограничить смысл радушным приёмом
  rationale: Фраза может намекать на действие сверх прямо высказанной просьбы, однако не называет его. Перевод сохраняет эту намеренную недосказанность.
translation_notes:
  register: Современный литературный русский язык с уважительным, но не архаичным тоном. Синтаксис сохраняет обе причастные смысловые связи греческого текста, оставаясь естественным для русского читателя.
