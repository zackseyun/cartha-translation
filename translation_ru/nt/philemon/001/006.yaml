    reason: syntactic_alternative
lexical_decisions:
- source_word: ὅπως
  choice: чтобы
  rationale: Естественно вводит цель или желаемый результат молитвы Павла и сохраняет целевую силу союза.
- source_word: κοινωνία τῆς πίστεώς σου
  choice: твоё участие в вере
  rationale: κοινωνία обозначает участие, общность, общение или совместность. Формулировка «участие в вере» понятна по-русски и не сводит выражение исключительно к устному возвещению веры; притяжательное σου передано словом «твоё».
- source_word: πίστεώς
  choice: вере
  rationale: Основное значение здесь — христианская вера Филимона; возможные оттенки доверия и верности сохранены в примечании.
- source_word: ἐνεργὴς γένηται
  choice: стало действенным
  rationale: Передаёт становление активным или результативным, сохраняя молитвенно-желательный характер высказывания.
- source_word: ἐν ἐπιγνώσει
  choice: через познание
  rationale: 'ἐν допускает инструментальное понимание: участие становится действенным посредством глубокого распознавания или познания добра. «Познание» естественно передаёт более содержательный оттенок ἐπίγνωσις.'
- source_word: παντὸς ἀγαθοῦ
  choice: всякого добра
  rationale: Сохраняет обобщённое субстантивированное значение среднего рода, не добавляя отсутствующего в тексте понятия «дар».
- source_word: τοῦ ἐν ἡμῖν
  choice: которое есть в нас
  rationale: Определительная конструкция отнесена к «всякому добру»; основное чтение SBLGNT ἡμῖν передано как «в нас».
- source_word: εἰς Χριστόν
  choice: ради Христа
  rationale: Передаёт направленность или отнесённость ко Христу естественным русским выражением, не вводя архаичное «ко Христу» в неясном синтаксическом употреблении.
theological_decisions:
- issue: Смысл κοινωνία τῆς πίστεώς σου
  choice: «твоё участие в вере» — участие Филимона в общей христианской вере и её деятельное выражение
  alternative: «общение, основанное на твоей вере» или «то, как ты делишься своей верой»
  rationale: Греческое выражение допускает как общинное участие, так и деятельное разделение веры с другими. Основной текст сохраняет общинный и практический диапазон, а альтернативы вынесены в примечание.
- issue: Связь ἐν ἐπιγνώσει с эффективностью участия
  choice: инструментальное «через познание»
  alternative: локативное или сферическое «в познании»
  rationale: Обе связи грамматически возможны. Инструментальное прочтение даёт естественный русский синтаксис, но альтернативное не исключается и отмечено.
- issue: Референт ἡμῖν
  choice: коллективное «в нас», включающее Павла, Филимона и других верующих
  alternative: вариант рукописей «в тебе», относящий слова непосредственно к Филимону
  rationale: Основной текст следует SBLGNT и не сужает коллективную перспективу Павла.
- issue: Значение εἰς Χριστόν
  choice: «ради Христа», как направленность всего добра ко Христу
  alternative: «по отношению ко Христу» или «для Христа»
  rationale: Предложная фраза синтаксически и семантически трудна. Выбранный вариант краток и понятен, но примечание сохраняет более формальную альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского послания. Синтаксис сохранён как единое целевое придаточное, но тяжёлая греческая именная конструкция передана естественным русским оборотом. Неясности κοινωνία, ἐν ἐπιγνώσει и εἰς Χριστόν не устранены догматически, а обозначены в примечаниях.
