  text: because of love I rather appeal[a], being such a one as Paul, an old man[c][b], and now also a prisoner of Messiah Jesus—
translation:
  language: ru
  text: Но из любви я предпочитаю обратиться с просьбой — я, Павел, уже пожилой человек[a], а теперь ещё и узник Христа Иисуса, —
