  footnotes:
  - marker: a
    text: 'Буквально: «старик» или «старец». В ряде рукописей: «посланник» (другое, сходно звучащее греческое слово).'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τὴν ἀγάπην
  choice: ради любви
  rationale: Предлог διά с винительным падежом здесь указывает на основание или побуждение. «Ради любви» естественно передаёт мотив просьбы и сохраняет связь с противопоставлением в предыдущем стихе.
- source_word: μᾶλλον παρακαλῶ
  choice: предпочитаю просить
  rationale: μᾶλλον противопоставляет просьбу возможному повелению из ст. 8. Глагол παρακαλῶ здесь означает личное настойчивое обращение, но русское «просить» в сочетании с «предпочитаю» звучит естественно и не превращает просьбу в приказ.
- source_word: τοιοῦτος ὢν ὡς Παῦλος
  choice: я, Павел
  rationale: Греческий оборот эллиптичен и буквально тяжеловесен по-русски. Самоназвание с последующими характеристиками естественно передаёт его функцию, не добавляя причинного смысла.
- source_word: πρεσβύτης
  choice: уже пожилой человек
  rationale: Обычное значение слова — человек преклоняющегося возраста, а не церковный пресвитер. Формулировка «пожилой человек» ясна современному читателю и избегает возможной должностной окраски слова «старец».
- source_word: νυνὶ δὲ καὶ
  choice: а теперь ещё и
  rationale: 'Переданы временное ударение νυνί, присоединительное καί и лёгкое противопоставление δέ: к возрасту Павла добавляется его нынешнее заключение.'
- source_word: δέσμιος Χριστοῦ Ἰησοῦ
  choice: узник Христа Иисуса
  rationale: 'δέσμιος прямо обозначает заключённого. Родительный падеж сохраняет ёмкость греческого выражения: Павел может мыслиться как принадлежащий Христу узник и как заключённый ради него.'
- source_word: Χριστοῦ Ἰησοῦ
  choice: Христа Иисуса
  rationale: В современном литературном и библейском русском «Христос» является устойчивой передачей титула Χριστός; порядок слов оригинала сохранён. Титульный смысл слова при этом остаётся доступен русскому читателю.
theological_decisions:
- issue: Значение πρεσβύτης
  choice: Павел называет себя пожилым человеком.
  alternative: «старец», «пресвитер» или, по предполагаемому иному чтению, «посланник»
  rationale: В засвидетельствованном греческом тексте стоит πρεσβύτης, естественно обозначающее пожилого мужчину. Перевод «посланник» предполагает другое греческое слово, πρεσβευτής, а «пресвитер» вносит не выраженную здесь церковную должность.
- issue: Смысл родительного падежа в δέσμιος Χριστοῦ Ἰησοῦ
  choice: Сохранено краткое выражение «узник Христа Иисуса».
  alternative: «узник ради Христа Иисуса» или «узник, принадлежащий Христу Иисусу»
  rationale: Греческий родительный допускает оттенки принадлежности и причины заключения. Развёрнутая передача выбрала бы один оттенок и устранила содержательную ёмкость оригинала.
- issue: Передача Χριστός
  choice: Христос
  alternative: Мессия
  rationale: Русское «Христос» — традиционное и современно понятное титульное соответствие греческому Χριστός. Оно не требует превращать устойчивое сочетание «Христос Иисус» в менее естественное по-русски «Мессия Иисус».
translation_notes:
  register: 'Современный литературный русский с достоинством личного обращения. Эллиптический греческий оборот упрощён до естественного самоназвания, тире сохранены, поскольку предложение продолжается в следующем стихе. Местоимение «тебя» не добавлено: в греческом оно появляется лишь далее.'
