source:
  edition: SBLGNT
  text: ⸀χαρὰν γὰρ ⸂πολλὴν ἔσχον⸃ καὶ παράκλησιν ἐπὶ τῇ ἀγάπῃ σου, ὅτι τὰ σπλάγχνα τῶν ἁγίων ἀναπέπαυται διὰ σοῦ, ἀδελφέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/007.yaml
  text: For I had much joy and encouragement because of your love[a], because the hearts of the saints have been refreshed through you, brother.
translation:
  language: ru
  text: Ибо благодаря твоей любви я испытал большую радость и ободрение, потому что через тебя сердца[a] святых получили облегчение, брат.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «внутренности»; здесь — глубинные чувства или внутренняя жизнь святых.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαρὰν
  choice: радость
  rationale: Обычное значение χαρά; естественно сочетается с «ободрением» и передаёт тёплую личную реакцию Павла.
- source_word: πολλὴν ἔσχον
  choice: я испытал великую
  rationale: Сочетание ἔχω с отвлечёнными существительными может обозначать переживание или испытанное состояние; «великую» естественно согласуется в русском с обоими дополнениями.
- source_word: παράκλησιν
  choice: ободрение
  rationale: В данном межличностном контексте слово обозначает поддержку и укрепление; «ободрение» сохраняет активный оттенок, не исключая утешения.
- source_word: ἐπὶ τῇ ἀγάπῃ σου
  choice: благодаря твоей любви
  rationale: ἐπί с дательным здесь указывает на основание или причину радости и ободрения.
- source_word: σπλάγχνα
  choice: сердца
  rationale: Буквально слово называет внутренности, а идиоматически — глубинное внутреннее существо и чувства человека. «Сердца» естественно передаёт этот образ по-русски; буквальный оттенок отмечен в сноске.
- source_word: τῶν ἁγίων
  choice: святых
  rationale: Сохраняет обычное для Павла обозначение верующих как принадлежащих и посвящённых Богу, не заменяя его толкованием.
- source_word: ἀναπέπαυται
  choice: успокоились
  rationale: Перфект передаёт наступившее и сохраняющееся состояние покоя или облегчения. «Успокоились» сохраняет образ обретения покоя и связь с повторным употреблением того же корня в стихе 20.
- source_word: διὰ σοῦ
  choice: через тебя
  rationale: διά с родительным выражает посредничество или действенное участие Филимона.
- source_word: ἀδελφέ
  choice: брат
  rationale: Прямое семейное обращение внутри христианской общины передано без добавочного усиления.
theological_decisions:
- issue: Передача ἅγιοι
  choice: святые
  alternative: Божий народ; освящённые
  rationale: «Святые» сохраняет павловский общинный термин и не сводит его к позднейшему представлению об особом канонизированном разряде верующих.
- issue: Антропологический образ σπλάγχνα
  choice: сердца
  alternative: внутреннее существо; глубинные чувства
  rationale: Русское «сердца» естественно обозначает внутреннюю жизнь и чувства, тогда как анатомически буквальная передача была бы вводящей в заблуждение. Сноска сохраняет полноту исходного образа.
- issue: Оттенок ἀναπέπαυται
  choice: успокоились
  alternative: обрели облегчение; были ободрены
  rationale: Выбор сохраняет значение покоя и результирующую силу перфекта, а также словесную связь с просьбой Павла в Флм 20, не сужая смысл до одного лишь эмоционального ободрения.
translation_notes:
  register: Современный литературный русский, тёплый и достойный эпистолярный стиль. Порядок обращения «брат» слегка перестроен ради естественного русского звучания. Маркер сноски поставлен после предложения, к которому относится пояснение образа «сердца святых».
