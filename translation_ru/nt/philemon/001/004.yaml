  text: Εὐχαριστῶ τῷ θεῷ μου πάντοτε μνείαν σου ποιούμενος ἐπὶ τῶν προσευχῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/004.yaml
  text: I always thank my God[a], making mention of you in my prayers,
translation:
  language: ru
  text: Я всегда благодарю моего Бога, упоминая тебя в своих молитвах,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вспоминая о тебе в своих молитвах». Буквально по-гречески: «совершая упоминание о тебе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: благодарю
  rationale: Настоящее время, действительный залог, первое лицо единственного числа; прямой и естественный русский эквивалент.
- source_word: τῷ θεῷ μου
  choice: моего Бога
  rationale: Дательный объект при εὐχαριστέω по-русски естественно передаётся прямой конструкцией «благодарю Бога»; притяжательное местоимение сохраняет личный характер выражения.
- source_word: πάντοτε
  choice: всегда
  rationale: Передаёт постоянство действия и естественно звучит в формуле благодарения.
- source_word: μνείαν σου ποιούμενος
  choice: упоминая тебя
  rationale: Сохраняет значение греческой идиомы «совершая упоминание о тебе» и её связь с произносимой молитвой, не сводя выражение лишь к внутреннему воспоминанию.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: в своих молитвах
  rationale: Идиоматически передаёт ἐπί с родительным в значении обстоятельства молитвы; «своих» естественно соотносится с говорящим.
