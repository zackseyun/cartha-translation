  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: ru
  text: Благодать вам и мир от Бога, нашего Отца, и Господа Иисуса Мессии[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисуса Христа». Греческое Χριστός может употребляться как титул («Мессия») или, в некоторых контекстах, почти как часть имени («Христос»).'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: благодать
  rationale: Сохраняет как форму апостольского приветствия, так и богословскую насыщенность характерного для Павла слова; «милость» или «благоволение» здесь были бы уже по смыслу.
- source_word: ὑμῖν
  choice: вам
  rationale: Естественная русская передача дательного адресата в благопожелании.
- source_word: εἰρήνη
  choice: мир
  rationale: Передаёт и смысл приветствия, и более широкое библейское содержание мира и благополучия.
- source_word: ἀπὸ
  choice: от
  rationale: Обозначает источник благодати и мира.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Бога, нашего Отца
  rationale: Приложение «нашего Отца» естественно передаёт греческое сочетание, где Бог назван Отцом верующих.
- source_word: κυρίου
  choice: Господа
  rationale: Сохраняет почётный титул и его христологическую значимость в языке Павла.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Имя передано традиционной русской формой, а Χριστός — смысловым соответствием «Мессия», сохраняющим титульное значение.
theological_decisions:
- issue: Передача Χριστοῦ в сочетании Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  alternative: Иисуса Христа
  rationale: Χριστός означает «Помазанник», то есть «Мессия», и в данной формуле сохраняет титульную силу. При этом традиционное «Христос» также возможно, поскольку в раннехристианском употреблении слово могло функционировать почти как часть имени; эта возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского приветствия. Порядок слов близок к греческому, но сочетание «Бога, нашего Отца» оформлено естественно для русского языка. Союз «и» сохраняет координацию Бога Отца и Господа Иисуса Мессии как источника благодати и мира.
