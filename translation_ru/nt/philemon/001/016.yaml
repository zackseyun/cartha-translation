  text: οὐκέτι ὡς δοῦλον ἀλλὰ ὑπὲρ δοῦλον, ἀδελφὸν ἀγαπητόν, μάλιστα ἐμοί, πόσῳ δὲ μᾶλλον σοὶ καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/016.yaml
  text: no longer as a servant[a], but more than a servant, a beloved brother—especially to me, but how much more to you[b], both in the flesh and in the Lord.
translation:
  language: ru
  text: уже не как раба[a], но больше, чем раба, — как возлюбленного брата, особенно для меня, а тем более для тебя — и по плоти[b], и в Господе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «невольника». Греческое слово обозначает человека, находящегося в подневольном положении; здесь, вероятно, имеется в виду общественное положение Онисима.'
    reason: alternative_reading
  - marker: b
    text: «По плоти» здесь, вероятно, означает земные, телесные или общественные отношения, а не греховную природу.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: уже не
  rationale: Естественно передаёт временное отрицание и изменение прежнего положения.
- source_word: ὡς δοῦλον
  choice: как раба
  rationale: В контексте Онисима слово обозначает несвободное социальное положение; «раб» прямо сохраняет историческую и риторическую остроту выражения.
- source_word: ὑπὲρ δοῦλον
  choice: больше, чем раба
  rationale: Ὑπέρ выражает превосходство положения или ценности; формулировка сохраняет прямое сопоставление с δοῦλον.
- source_word: ἀδελφὸν ἀγαπητόν
  choice: как возлюбленного брата
  rationale: Сохраняет семейную метафору христианского сообщества; добавленное «как» естественно связывает приложение с глагольной мыслью предыдущего контекста, не меняя статуса Онисима.
- source_word: μάλιστα ἐμοί
  choice: особенно для меня
  rationale: Передаёт значение особой степени и личного отношения Павла.
- source_word: πόσῳ δὲ μᾶλλον σοὶ
  choice: а тем более для тебя
  rationale: Естественно передаёт усилительное риторическое сопоставление отношений Павла и Филимона с Онисимом.
- source_word: ἐν σαρκὶ
  choice: по плоти
  rationale: 'Сохраняет характерную для Павла формулировку и её смысловой диапазон: телесную, земную либо социальную связь; пояснение дано в сноске.'
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Сохраняет богословски ёмкое указание на отношения в сфере принадлежности Господу и единства с Ним.
theological_decisions:
- issue: Передача δοῦλος применительно к Онисиму
  choice: раб
  alternative: слуга; раб-служитель
  rationale: Социально несвободное положение Онисима существенно для контраста «не как раба, но больше, чем раба». Более мягкое «слуга» могло бы скрыть эту реальность.
- issue: Смысл ἐν σαρκὶ καὶ ἐν κυρίῳ
  choice: и по плоти, и в Господе
  alternative: и в земных отношениях, и в Господе; и лично, и в Господе
  rationale: Буквально близкая формулировка сохраняет различие между земной, телесной или социальной связью и отношениями в Господе, не сводя многозначность σάρξ к одному толкованию.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Синтаксис сохраняет нарастающий контраст оригинала; тире помогают ясно обозначить приложение и заключительную двойную характеристику.
