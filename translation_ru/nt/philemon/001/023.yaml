  yaml_path: translation/nt/philemon/001/023.yaml
  text: Epaphras[a], my fellow prisoner in Messiah Jesus, greets you.
translation:
  language: ru
  text: Тебя приветствует Епафрас, мой товарищ по заключению в Мессии Иисусе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в более традиционной передаче: «во Христе Иисусе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: приветствует
  rationale: Обычное для ἀσπάζομαι в эпистолярном контексте значение; кратко и естественно передаёт личное приветствие.
- source_word: σε
  choice: тебя
  rationale: Передаёт винительный падеж местоимения второго лица единственного числа и прямое обращение к Филимону.
- source_word: Ἐπαφρᾶς
  choice: Епафрас
  rationale: Традиционная русская библейская передача личного имени.
- source_word: ὁ συναιχμάλωτός μου
  choice: мой соузник
  rationale: Сложное существительное обозначает человека, находящегося в заключении вместе с говорящим; «соузник» точно и ёмко передаёт смысл.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Иисусе Мессии
  rationale: Сохраняется предлог ἐν и характерная для Павла формула пребывания или единения; Χριστός передан как титул «Мессия», а порядок имён естественно адаптирован для современного русского языка.
theological_decisions:
- issue: Передача Χριστῷ в формуле ἐν Χριστῷ Ἰησοῦ
  choice: Мессии
  alternative: Христе
  rationale: Здесь Χριστός сохраняет титульный смысл, поэтому основной текст передаёт его как «Мессия». Традиционный вариант «во Христе Иисусе» дан в сноске, без устранения богословски значимой конструкции ἐν.
- issue: Связь выражения ἐν Χριστῷ Ἰησοῦ
  choice: в Иисусе Мессии
  alternative: за Иисуса Мессию / ради Иисуса Мессии
  rationale: Буквальная предложная конструкция сохраняет возможную идею пребывания или единения с Мессией и не сводит выражение только к причине заключения.
translation_notes:
  register: Современный литературный русский с достоинством эпистолярного стиля. Инверсия «Приветствует тебя Епафрас» естественно продолжает перечень приветствий и сохраняет акцент греческого предложения. Форма «соузник» кратка, понятна и уместна в библейском регистре.
