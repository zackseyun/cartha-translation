  text: Διό, πολλὴν ἐν Χριστῷ παρρησίαν ἔχων ἐπιτάσσειν σοι τὸ ἀνῆκον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/008.yaml
  text: Therefore[a], though I have much boldness in Messiah to command you to do what is proper[b],
translation:
  language: ru
  text: Поэтому, хотя во Мессии[a] я могу с большой смелостью повелеть тебе поступить как должно[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во Христе». Греческое Χριστός — титул со значением «Помазанник»; здесь он передан словом «Мессия».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «сделать то, что подобает».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διό
  choice: Поэтому
  rationale: Передаёт вывод из предшествующих слов и сохраняет явную логическую связь.
- source_word: πολλὴν ... παρρησίαν
  choice: большая смелость
  rationale: Сохраняет значение открытой, уверенной смелости и усиление, выраженное πολλήν, не сводя выражение только к праву или власти.
- source_word: ἐν Χριστῷ
  choice: в Мессии
  rationale: Χριστός употреблено как титул; «Мессия» сохраняет его титулярный и мессианский смысл, а предлог «в» — характерную для Павла реляционную формулу без её дальнейшего истолкования.
- source_word: ἔχων
  choice: хотя ... у меня есть
  rationale: Причастие понято уступительно ввиду противопоставления в следующем стихе; русская конструкция естественно подготавливает это противопоставление.
- source_word: ἐπιτάσσειν σοι
  choice: повелеть тебе
  rationale: Передаёт властный оттенок ἐπιτάσσω и дательный адресата, сохраняя при этом достойный литературный регистр.
- source_word: τὸ ἀνῆκον
  choice: поступить как должно
  rationale: Передаёт то, что уместно, подобает или следует сделать; глагол «поступить» естественно выражает подразумеваемое действие по-русски.
theological_decisions:
- issue: Передача Χριστῷ
  choice: Мессии
  alternative: Христе
  rationale: В данном выражении слово сохраняет функцию титула. «Мессия» делает титулярный смысл явным, тогда как традиционное «Христос» дано в примечании как допустимый русский эквивалент.
- issue: Смысл Павловой παρρησία
  choice: смелость повелеть
  alternative: право повелеть
  rationale: Греческий текст прямо говорит о смелости или свободе речи, а не употребляет термин «право»; выбранный вариант не усиливает утверждение об апостольской власти сверх текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, эпистолярным звучанием. Незавершённость фразы и конечная запятая сохранены, поскольку мысль продолжается в стихе 9.
