  yaml_path: translation/nt/philemon/001/015.yaml
  text: For perhaps he was separated from you for a time so that you might have him back forever,[a]
translation:
  language: ru
  text: Ведь, возможно, он был разлучён с тобой на время, чтобы ты обрёл его навсегда,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он ушёл от тебя ненадолго». Греческая пассивная форма «был разлучён» может деликатно избегать прямого возложения вины и в то же время оставлять место для подразумеваемого Божьего замысла.'
    reason: alternative_reading
lexical_decisions:
- source_word: τάχα
  choice: возможно
  rationale: Передаёт осторожное, предположительное суждение Павла, не превращая его в уверенное утверждение.
- source_word: γὰρ
  choice: ведь
  rationale: Естественно передаёт пояснительную связь с предыдущей мыслью.
- source_word: διὰ τοῦτο
  choice: именно для того
  rationale: В данном построении выражает предполагаемую цель или замысел и соотносится с последующим ἵνα.
- source_word: ἐχωρίσθη
  choice: был разлучён с тобой
  rationale: Пассивная форма не называет виновника разлуки, смягчает прямое указание на поступок Онисима и допускает, но не утверждает, подразумеваемый Божий промысел.
- source_word: πρὸς ὥραν
  choice: на время
  rationale: Передаёт идиоматическое значение ограниченного, сравнительно недолгого периода и сохраняет контраст с «навсегда».
- source_word: ἵνα
  choice: чтобы
  rationale: Ясно выражает цель или предполагаемый результат.
- source_word: αἰώνιον
  choice: навсегда
  rationale: Прилагательное употреблено предикативно и по смыслу относится к длительности обладания; перевод сохраняет контраст временной разлуки с непреходящим возвращением.
- source_word: αὐτὸν
  choice: его
  rationale: Местоимение относится к Онисиму.
- source_word: ἀπέχῃς
  choice: ты получил его обратно
  rationale: В контексте передаёт возвращение Онисима к Филимону; «получил обратно» естественно выражает значение вновь обретённого обладания или отношений.
theological_decisions:
- issue: Кто подразумевается действующим лицом при пассивном ἐχωρίσθη
  choice: Сохранить пассивное «был разлучён», не называя прямо ни Бога, ни Онисима действующим лицом.
  alternative: «Он ушёл» или «Бог разлучил вас».
  rationale: 'Греческая формулировка оставляет причину и действующее лицо невыраженными: она может деликатно смягчать вину Онисима и одновременно допускать мысль о Божьем промысле, не утверждая её прямо.'
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Частица «и» в сочетании «он и был разлучён» естественно поддерживает предположительное объяснение Павла, а «именно» подчёркивает связь временной разлуки с предполагаемой целью.
