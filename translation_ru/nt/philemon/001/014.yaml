  text: χωρὶς δὲ τῆς σῆς γνώμης οὐδὲν ἠθέλησα ποιῆσαι, ἵνα μὴ ὡς κατὰ ἀνάγκην τὸ ἀγαθόν σου ᾖ ἀλλὰ κατὰ ἑκούσιον·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/014.yaml
  text: But without your consent I wanted to do nothing[a], so that your good deed might not be as if by compulsion[c][b], but voluntary.
translation:
  language: ru
  text: Но без твоего согласия[a] я ничего не хотел делать, чтобы твой добрый поступок[b] был не вынужденным, а добровольным[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «без твоего одобрения»; возможно также: «не узнав твоего мнения».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «твоя доброта» или «твоя милость». Греческое выражение может обозначать как конкретный добрый поступок Филимона в этом деле, так и его доброту вообще.'
    reason: lexical_alternative
  - marker: c
    text: 'Греческое выражение буквально: «по добровольному»; смысл: «добровольно, по собственной воле».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς ... τῆς σῆς γνώμης
  choice: без твоего согласия
  rationale: γνώμη может означать мнение, решение, намерение или согласие; в контексте действий Павла в отношении Онисима естественнее всего передать волевой и личный оттенок словом «согласие».
- source_word: οὐδὲν ἠθέλησα ποιῆσαι
  choice: я ничего не хотел делать
  rationale: θέλω выражает волю или желание. Такая формулировка близка к греческому тексту и не усиливает смысл до окончательного решения.
- source_word: ἵνα μὴ
  choice: чтобы ... не
  rationale: Передаёт целевое значение конструкции ясным и естественным современным русским языком.
- source_word: ὡς κατὰ ἀνάγκην
  choice: не как бы по принуждению
  rationale: '«По принуждению» передаёт давление или несвободу, а «как бы» сохраняет смягчающую силу ὡς: Павел говорит о характере поступка, не утверждая прямо, что Филимон принуждён.'
- source_word: τὸ ἀγαθόν σου
  choice: твой добрый поступок
  rationale: Субстантивированное прилагательное, вероятно, указывает на конкретное доброе действие Филимона, хотя может обозначать также его доброту вообще; основной текст естественно передаёт наиболее вероятный конкретный смысл, а примечание сохраняет альтернативу.
- source_word: ᾖ
  choice: был
  rationale: В русском придаточном цели форма «был» естественно передаёт греческий конъюнктив после ἵνα.
- source_word: ἀλλὰ κατὰ ἑκούσιον
  choice: а по доброй воле
  rationale: ἑκούσιον обозначает добровольное, свободно избранное действие. Русское выражение ясно противопоставлено принуждению и звучит естественнее буквального «согласно добровольному».
theological_decisions:
- issue: Характер ответа Филимона
  choice: Сохранить противопоставление принуждения и свободной воли, не уточняя, в чём именно должен состоять добрый поступок.
  alternative: Передать τὸ ἀγαθόν σου отвлечённо как «твоя доброта» или конкретнее как «твоя милость».
  rationale: Греческий текст подчёркивает добровольный характер ожидаемого добра, но оставляет сам поступок неуточнённым. Перевод не должен привносить более узкое нравственное или богословское толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис сохраняет последовательность мысли оригинала; выражение «как бы» удерживает смысловую осторожность ὡς, а примечания отражают подлинную лексическую неоднозначность.
