source:
  edition: SBLGNT
  text: ὃν ἐγὼ ἐβουλόμην πρὸς ἐμαυτὸν κατέχειν, ἵνα ὑπὲρ σοῦ ⸂μοι διακονῇ⸃ ἐν τοῖς δεσμοῖς τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/013.yaml
  text: I wanted to keep him with me[a], so that on your behalf he might serve me in the chains of the gospel,
translation:
  language: ru
  text: Я хотел оставить его при себе, чтобы он служил мне от твоего имени в узах Евангелия.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃν
  choice: его
  rationale: Винительный падеж относительного местоимения мужского рода относится к Онисиму; в русском продолжение предыдущей мысли естественно передаётся личным местоимением «его».
- source_word: ἐβουλόμην
  choice: я хотел
  rationale: Имперфект βούλομαι выражает желание Павла в прошлом; «хотел» естественно передаёт смысл, не навязывая длительный оттенок.
- source_word: πρὸς ἐμαυτὸν κατέχειν
  choice: оставить при себе
  rationale: Сочетание означает удержать Онисима рядом с собой; «оставить при себе» точно и естественно для современного русского языка.
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт целевое значение союза.
- source_word: ὑπὲρ σοῦ
  choice: вместо тебя
  rationale: В данном контексте служение Онисима Павлу мыслится как совершаемое от лица Филимона и на его месте; русский оборот кратко выражает представительский смысл, хотя не предполагает строгого заместительства.
- source_word: μοι διακονῇ
  choice: служил мне
  rationale: διακονέω обозначает оказание помощи и служение; выражение не сужено ни до церковного служения, ни только до бытовой помощи.
- source_word: ἐν τοῖς δεσμοῖς
  choice: в узах
  rationale: Сохраняется конкретный образ δεσμοί и традиционно понятное обозначение заключения; «узы» соответствует достоинству эпистолярного регистра.
- source_word: τοῦ εὐαγγελίου
  choice: благовестия
  rationale: 'Родительный падеж сохраняет компактную и неоднозначную связь с «узами»: это узы, связанные с благовестием и, вероятно, понесённые из-за него.'
theological_decisions:
- issue: Значение τοῦ εὐαγγελίου при δεσμοῖς
  choice: «в узах благовестия»
  alternative: «в узах за благовестие» / «в узах из-за благовестия»
  rationale: Основной текст сохраняет греческий родительный падеж и его сжатую образность, не устраняя связь уз с благовестием в пользу одного причинного толкования; вероятный причинный смысл поясняется в сноске.
- issue: Значение ὑπὲρ σοῦ
  choice: «вместо тебя»
  alternative: «от твоего имени» / «ради тебя»
  rationale: Контекст подразумевает, что Онисим оказывал бы Павлу ту помощь, которую мог бы оказать Филимон. Формулировка передаёт представительское замещение, не превращая его в специальное учение о заместительстве.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Оставить при себе» звучит естественно, а «узы благовестия» сохраняют конкретный образ и богословскую неоднозначность оригинала.
