  text: Παῦλος δέσμιος Χριστοῦ Ἰησοῦ καὶ Τιμόθεος ὁ ἀδελφὸς Φιλήμονι τῷ ἀγαπητῷ καὶ συνεργῷ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/001.yaml
  text: Paul[a], a prisoner of Messiah Jesus, and Timothy our brother, to Philemon our beloved fellow worker[b],
translation:
  language: ru
  text: Павел, узник Мессии Иисуса[a], и брат Тимофей — Филимону, возлюбленному и нашему соработнику,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «узник за Мессию Иисуса». Греческий родительный падеж может выражать связь Павла с Мессией Иисусом или причину его заключения.'
    reason: alternative_reading
lexical_decisions:
- source_word: δέσμιος
  choice: узник
  rationale: Передаёт человека, находящегося в узах или заключении, и сохраняет достоинство эпистолярного стиля.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Здесь Χριστός сохраняет значение титула; «Мессия» передаёт его смысл, а не заменяет именеподобным «Христос».
- source_word: Ἰησοῦ
  choice: Иисуса
  rationale: Общепринятая русская форма личного имени в родительном падеже.
- source_word: ὁ ἀδελφὸς
  choice: брат
  rationale: Естественно передаёт христианское родственное именование; артикль отдельно по-русски не выражается.
- source_word: ἀγαπητῷ
  choice: возлюбленному
  rationale: Сохраняет теплоту и глубину выраженной любви в достойном современном регистре.
- source_word: συνεργῷ
  choice: соработнику
  rationale: Точно и кратко обозначает того, кто трудится вместе с другими, и соответствует церковно-эпистолярному контексту.
- source_word: ἡμῶν
  choice: нашему
  rationale: Сохраняет форму множественного числа и относится к характеристике Филимона как возлюбленного соработника Павла и Тимофея.
- source_word: Φιλήμονι
  choice: Филимону
  rationale: Дательный падеж естественно передаёт адресата письма без добавления предлога.
- source_word: καὶ Τιμόθεος
  choice: и брат Тимофей
  rationale: Тимофей назван вместе с Павлом как соотправитель; определение «брат» расположено перед именем согласно естественному русскому порядку слов.
theological_decisions:
- issue: Передача Χριστός в приветствии
  choice: Мессия
  alternative: Христос
  rationale: В сочетании Χριστοῦ Ἰησοῦ титульное значение остаётся различимым, поэтому «Мессия Иисус» передаёт значение греческого титула, хотя «Христос Иисус» привычнее в русской библейской традиции.
- issue: Значение родительного Χριστοῦ Ἰησοῦ при δέσμιος
  choice: узник Мессии Иисуса
  alternative: узник за Мессию Иисуса
  rationale: Компактная конструкция сохраняет неоднозначность греческого родительного, который может обозначать принадлежность или отношение к Иисусу либо причину заключения.
translation_notes:
  register: Современный литературный русский с достоинством апостольского приветствия. Тире обозначает переход от отправителей к адресату; завершающая запятая сохраняет незавершённость предложения, продолжающегося в следующих стихах.
