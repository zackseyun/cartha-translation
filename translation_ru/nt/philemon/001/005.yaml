lexical_decisions:
- source_word: ἀκούων
  choice: потому что слышу
  rationale: Причастие зависит от предшествующего благодарения и в данном контексте имеет причинный оттенок; личная форма естественна по-русски и сохраняет настоящее время.
- source_word: ἀγάπην
  choice: любви
  rationale: Основное и естественное соответствие для ἀγάπη.
- source_word: πίστιν
  choice: вере
  rationale: Сохраняет обычное новозаветное значение πίστις; возможный оттенок верности указан в сноске.
- source_word: πρὸς τὸν κύριον Ἰησοῦν
  choice: к Господу Иисусу
  rationale: Предлог «к» передаёт направленность отношения к личности и сохраняет структуру исходного выражения.
- source_word: κύριον
  choice: Господу
  rationale: Стандартная передача христологического титула κύριος.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: ко всем святым
  rationale: Формулировка сохраняет направленность греческого εἰς и не распределяет явно любовь и веру между двумя дополнениями.
- source_word: ἁγίους
  choice: святым
  rationale: Традиционное, краткое и понятное обозначение членов христианской общины в посланиях Павла.
theological_decisions:
- issue: Соотнесение «любви» и «веры» с Господом Иисусом и всеми святыми
  choice: 'Сохранён поверхностный порядок греческого текста: оба существительных предшествуют относительному обороту и двум предложным дополнениям.'
  alternative: «о твоей вере в Господа Иисуса и любви ко всем святым»
  rationale: Распределительное понимание богословски и контекстуально вероятно, однако греческий синтаксис не выражает его прямо. Основной текст сохраняет неоднозначность, а более явное толкование вынесено в сноску.
- issue: Значение πίστις
  choice: вера
  alternative: верность
  rationale: «Вера» является основным соответствием; возможный смысл верности не исключается и отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достойным библейского текста регистром. Синтаксическая неоднозначность оригинала сохранена без конфессионального уточнения; несколько тяжеловесная связь «к Господу Иисусу и ко всем святым» намеренно отражает структуру греческого текста.
