  language: ru
  text: Марк, Аристарх, Димас и Лука, мои соработники.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μᾶρκος
  choice: Марк
  rationale: Устоявшаяся русская форма личного имени Μᾶρκος.
- source_word: Ἀρίσταρχος
  choice: Аристарх
  rationale: Устоявшаяся русская форма личного имени Ἀρίσταρχος.
- source_word: Δημᾶς
  choice: Димас
  rationale: Форма «Димас» непосредственно передаёт греческое Δημᾶς и отличает это имя от Δημήτριος («Димитрий»).
- source_word: Λουκᾶς
  choice: Лука
  rationale: Устоявшаяся русская форма личного имени Λουκᾶς.
- source_word: οἱ συνεργοί μου
  choice: мои соработники
  rationale: Слово συνεργός обозначает человека, совместно трудящегося с другим. «Мои соработники» кратко и естественно передаёт совместный труд и связь названных лиц с Павлом.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая именная конструкция оригинала сохранена. Союз «и» перед последним именем естественен для русского перечисления. Употребление «соработники» сохраняет традиционный библейский оттенок, оставаясь понятным современному читателю.
