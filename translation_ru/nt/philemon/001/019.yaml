  text: ἐγὼ Παῦλος ἔγραψα τῇ ἐμῇ χειρί, ἐγὼ ἀποτίσω· ἵνα μὴ λέγω σοι ὅτι καὶ σεαυτόν μοι προσοφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/019.yaml
  text: 'I[a], Paul, write this with my own hand: I will repay it—not to mention to you that you owe me even your very self.'
translation:
  language: ru
  text: 'Я, Павел, написал это собственной рукой: я возмещу — не говоря уже о том, что ты даже самим собой обязан мне.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγραψα
  choice: пишу
  rationale: Хотя в греческом стоит аорист («написал»), в эпистолярном контексте настоящее время естественно по-русски передаёт указание Павла на собственноручную приписку и личное обязательство.
- source_word: τῇ ἐμῇ χειρί
  choice: собственной рукой
  rationale: Устойчивое и естественное выражение, подчёркивающее, что Павел пишет лично.
- source_word: ἀποτίσω
  choice: я возмещу
  rationale: Будущее время выражает обещание покрыть упомянутый в предыдущем стихе ущерб или долг; дополнение оставлено подразумеваемым, как в греческом тексте.
- source_word: ἵνα μὴ λέγω σοι
  choice: Не говорю уже о том
  rationale: Передаёт риторическое, тактичное напоминание, а не буквальную цель; формула естественна для современного русского языка.
- source_word: καὶ σεαυτόν
  choice: и самого себя
  rationale: Сохраняет усиление при καί и не уточняет сверх текста, в каком именно смысле Филимон обязан Павлу собой.
- source_word: προσοφείλεις
  choice: должен мне
  rationale: Ясно передаёт личную задолженность; добавочный оттенок приставки поддерживается контекстом и выражением «и самого себя».
theological_decisions:
- issue: Характер долга Филимона Павлу
  choice: 'Сохранить сильное, но не уточнённое утверждение о личной задолженности: «ты и самого себя должен мне».'
  alternative: Уточнить, что Филимон обязан Павлу своим обращением, спасением или жизнью.
  rationale: Греческий текст не называет основания этого долга. Перевод не должен привносить конкретное историческое или богословское объяснение.
translation_notes:
  register: Современный литературный русский язык; тон личный, уверенный и тактично ироничный. Синтаксис сохраняет контраст между прямым обещанием возмещения и деликатным напоминанием о более глубоком долге.
