  source_fidelity: Логическая связка «Итак, если» точно передаёт Εἰ οὖν; «прими его так же, как принял бы меня» верно выражает προσλαβοῦ αὐτὸν ὡς ἐμέ. Однако «соучастник» в современном русском обычно означает участника преступления и потому искажает нейтрально-положительное κοινωνός («партнёр», «соучастник общего дела», «fellow participant»).
