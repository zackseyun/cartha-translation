  terminology: «Партнёр» не является специальным богословским термином и, как и английский audit trail, передаёт κοινωνός без внесения конфессионального смысла. Сноска сохраняет более широкий оттенок совместного участия. «Прими» удачно оставляет открытыми значения «принять / благосклонно принять / приветствовать».
