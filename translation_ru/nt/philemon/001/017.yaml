  text: Εἰ οὖν με ἔχεις κοινωνόν, προσλαβοῦ αὐτὸν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/017.yaml
  text: So if you consider me a partner[a], receive him as you would me.
translation:
  language: ru
  text: Итак, если ты считаешь меня своим партнёром[a], прими его так же, как принял бы меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сотоварищем», «тем, кто участвует вместе с тобой». Греческое слово обозначает человека, с которым разделяют нечто общее; здесь речь не обязательно о деловом партнёрстве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ οὖν
  choice: Итак, если
  rationale: Передаёт условие εἰ и выводную связь οὖν с предшествующим обращением Павла естественным современным русским оборотом.
- source_word: ἔχεις κοινωνόν
  choice: считаешь меня соучастником
  rationale: κοινωνός обозначает того, кто разделяет с другим участие или общение. «Соучастник» сохраняет идею общей причастности, а глагол «считаешь» естественно передаёт идиоматическое ἔχεις без узкого делового оттенка слова «партнёр».
- source_word: προσλαβοῦ
  choice: прими
  rationale: Императив προσλαβοῦ может означать принять, благосклонно встретить или допустить в общение. «Прими» сохраняет широту значения и достоинство просьбы.
- source_word: αὐτὸν
  choice: его
  rationale: Местоимение относится к Онисиму, названному в предшествующем контексте.
- source_word: ὡς ἐμέ
  choice: как меня
  rationale: 'Кратко и прямо сохраняет сравнительную конструкцию: Павел просит принять Онисима так же, как приняли бы самого Павла.'
theological_decisions:
- issue: Характер связи, выраженной словом κοινωνός
  choice: соучастник
  alternative: товарищ; партнёр; участник общения
  rationale: Выбор сохраняет широкую идею совместного участия и взаимной принадлежности, не превращая её ни в деловое партнёрство, ни в специальный конфессиональный термин.
- issue: Объём просьбы προσλαβοῦ
  choice: прими
  alternative: приветливо встреть; признай своим
  rationale: «Прими» допускает как личный приём Онисима, так и его благосклонное принятие в отношения и общение, не разрешая скрытую в греческом слове многозначность слишком узко.
translation_notes:
  register: Современный литературный русский язык; краткая, настойчивая и достойная формулировка. Синтаксическая сжатость оригинала сохранена. Слово «соучастник» здесь употреблено в нейтральном смысле совместного участия, хотя в современном русском оно иногда ассоциируется с соучастием в преступлении; контекст снимает эту возможность.
