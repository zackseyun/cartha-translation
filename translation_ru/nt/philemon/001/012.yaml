  text: Я посылаю[a] его обратно к тебе — его самого, то есть моё сердце[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я отослал его обратно к тебе» или «Я отправил его обратно к тебе». Греческий аорист допускает передачу прошедшим временем; настоящее время отражает перспективу письма, достигающего Филимона.'
