lexical_decisions:
- source_word: ὃν
  choice: его
  rationale: Винительный падеж относительного местоимения мужского рода отсылает к Онисиму. В русском предложении связь естественно передаётся личным местоимением «его».
- source_word: ἀνέπεμψά
  choice: отсылаю обратно
  rationale: 'Аорист глагола ἀναπέμπω означает «послать обратно, возвратить». Настоящее время передаёт эпистолярную перспективу: действие совершается с отправкой письма и воспринимается адресатом при его получении.'
- source_word: σοι
  choice: к тебе
  rationale: Дательный падеж обозначает адресата возвращения; сочетание «отсылать к тебе» естественно для современного русского языка.
- source_word: αὐτόν
  choice: его самого
  rationale: Повторное местоимение возобновляет и подчёркивает объект после относительной конструкции. «Его самого» сохраняет эмфатическое повторение и делает синтаксис понятным по-русски.
- source_word: τοῦτ’ ἔστιν
  choice: то есть
  rationale: Обычная пояснительная формула, вводящая образное отождествление Онисима с тем, что особенно дорого Павлу.
- source_word: τὰ ἐμὰ σπλάγχνα
  choice: моё собственное сердце
  rationale: Буквально σπλάγχνα обозначает внутренности, но в данном употреблении — средоточие глубокой привязанности и нежного чувства. Русское «моё собственное сердце» естественно передаёт силу личного отождествления, не превращая метафору в отвлечённое «чувство».
theological_decisions:
- issue: Антропологическая метафора σπλάγχνα
  choice: моё собственное сердце
  alternative: мои внутренности; моя глубочайшая привязанность
  rationale: Это идиоматико-лексическое, а не конфессиональное решение. Буквальное «внутренности» в современном русском прежде всего воспринимается анатомически, тогда как «сердце» сохраняет образ средоточия глубокой любви и личную напряжённость слов Павла.
- issue: Временная перспектива аориста ἀνέπεμψά
  choice: отсылаю обратно
  alternative: отослал обратно; отправил обратно
  rationale: Греческий аорист допускает передачу прошедшим временем, однако настоящее время естественно отражает эпистолярную перспективу отправляемого вместе с Онисимом письма. В примечании сохранена грамматическая альтернатива.
translation_notes:
  register: Современный литературный русский язык с dignified, но не архаичным звучанием. Эмфатическое повторение местоимения сохранено как «его самого»; тире передаёт пояснительный излом греческой фразы. Метафора передана привычным русским словом «сердце», а её буквальная форма отмечена в сноске.
