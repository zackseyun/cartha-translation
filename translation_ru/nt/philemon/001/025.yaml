base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/025.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a][b].
translation:
  language: ru
  text: Благодать Господа Иисуса Христа да будет с вашим духом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Местоимение «вашим» в греческом тексте стоит во множественном числе: заключительное благословение обращено не только к Филимону, но и ко всем названным в начале письма адресатам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: благодать
  rationale: Устоявшийся и семантически точный русский эквивалент для χάρις в заключительном апостольском благословении.
- source_word: κυρίου
  choice: Господа
  rationale: Передаёт титул κύριος и сохраняет его христологическую значимость.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Христа
  rationale: В современном литературном русском «Иисус Христос» — естественное и общеупотребительное соответствие; при этом «Христос» сохраняет исторически титульное значение греческого Χριστός.
- source_word: μετὰ
  choice: да будет с
  rationale: Греческое предложение не содержит выраженного глагола; «да будет» естественно восполняет его в русской формуле благословения.
- source_word: πνεύματος
  choice: духом
  rationale: Строчная буква не предрешает отождествление с Духом Святым; притяжательное местоимение указывает прежде всего на дух, то есть внутреннего человека адресатов.
- source_word: ὑμῶν
  choice: вашим
  rationale: Форма второго лица множественного числа; русское «вашим» естественно передаёт и значение, и множественность адресатов.
theological_decisions:
- issue: Передача Χριστοῦ в заключительном благословении
  choice: Христа
  alternative: Мессии
  rationale: В русском языке «Иисус Христос» остаётся естественной формой имени с сохраняющимся титульным содержанием; «Иисус Мессия» здесь звучало бы подчеркнуто и менее естественно.
- issue: К кому относится «дух» в выражении «с вашим духом»
  choice: дух адресатов / их внутренний человек
  alternative: Святой Дух
  rationale: Местоимение ὑμῶν («вашим») лучше всего указывает на дух получателей письма. Строчное написание не вносит в текст прямого утверждения о Святом Духе.
translation_notes:
  register: Современный литературный русский язык с традиционно возвышенным, но понятным оборотом благословения. Сохранены лаконичность и синтаксическая структура греческого заключения.
