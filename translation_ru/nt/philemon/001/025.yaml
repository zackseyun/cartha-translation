  source_fidelity: 'Текст точно передаёт греческое благословение: χάρις — «благодать», κυρίου Ἰησοῦ Χριστοῦ — «Господа Иисуса Христа», μετὰ — «с», πνεύματος ὑμῶν — «вашим духом». Добавленное «да будет» — естественное русское восполнение отсутствующей в греческом глагольной связки в формуле благословения. Строчное «духом» обоснованно не отождествляет его со Святым Духом.'
