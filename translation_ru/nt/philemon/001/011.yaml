id: PHM.1.11
reference: Philemon 1:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τόν ποτέ σοι ἄχρηστον νυνὶ ⸀δὲ σοὶ καὶ ἐμοὶ εὔχρηστον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/011.yaml
  text: who once was useless to you[a], but now is useful both to you and to me,
translation:
  language: ru
  text: который прежде был бесполезен для тебя[a], а теперь полезен и тебе, и мне,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вероятно, Павел обыгрывает имя Онисим, связанное со значением «полезный» или «приносящий пользу».
    reason: lexical_alternative
lexical_decisions:
- source_word: τόν
  choice: который
  rationale: Субстантивированное винительное τόν анафорически указывает на Онисима из предыдущего стиха; русское относительное местоимение естественно продолжает предложение.
- source_word: ποτέ
  choice: прежде
  rationale: Передаёт прежнее положение дел и создаёт ясный временной контраст с νυνί — «теперь».
- source_word: σοι
  choice: для тебя
  rationale: Дательный при ἄχρηστον естественно передаётся по-русски сочетанием «для тебя».
- source_word: ἄχρηστον
  choice: бесполезен
  rationale: Точно передаёт значение «непригодный, не приносящий пользы», сохраняет прямую антитезу с εὔχρηστον и вероятную игру с именем Онисим.
- source_word: νυνὶ δὲ
  choice: а теперь
  rationale: Выражает сильный временной контраст между прежним и нынешним положением.
- source_word: σοὶ καὶ ἐμοὶ
  choice: и тебе, и мне
  rationale: Парная конструкция «и … и …» ясно и естественно передаёт соотнесённые дательные формы.
- source_word: εὔχρηστον
  choice: полезен
  rationale: Современный прямой эквивалент, сохраняющий антитезу «бесполезен — полезен» и возможную игру со значением имени Онисим.
theological_decisions:
- issue: Возможная игра со значением имени Онисим и изменение его положения
  choice: Сохранить в основном тексте простую антитезу «бесполезен — полезен».
  alternative: 'Истолковательно подчеркнуть каламбур, например: «прежде не приносил тебе пользы, а теперь поистине полезен».'
  rationale: Греческий текст сам выражает контраст без дополнительных пояснений. Прямая передача сохраняет литературный эффект и не превращает вероятную игру слов в утверждение основного текста.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. Сохранены синтаксическая связь с предыдущим стихом, резкая временная антитеза и вероятная игра слов.
