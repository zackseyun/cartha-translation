  source_fidelity: 'Основная проблема — «пенящиеся собственным позором»: творительный падеж меняет синтаксическую связь и представляет позор как среду/причину пенообразования, тогда как ἐπαφρίζοντα имеет прямое дополнение τὰς ἑαυτῶν αἰσχύνας («извергающие/выбрасывающие пеной свои собственные позоры [или постыдные дела]»). Остальные образы и заключительное «для которых ... навеки сохранён» в целом верно передают греческий текст, включая перфектный пассив τετήρηται.'
