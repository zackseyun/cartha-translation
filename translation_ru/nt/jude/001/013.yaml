  terminology: «Блуждающие звёзды» удачно сохраняет древний образ πλανῆται, не подменяя его современным термином «планеты». «Мрак тьмы» передаёт усиленное ζόφος τοῦ σκότους; «навеки» адекватно передаёт εἰς αἰῶνα в данном контексте. Для αἰσχύνας в основном тексте выбрано «постыдные дела» как естественное русское выражение множественного числа, а вариант «позоры» сохранён в сноске.
