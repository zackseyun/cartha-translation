    reason: lexical_alternative
lexical_decisions:
- source_word: κύματα ἄγρια θαλάσσης
  choice: свирепые морские волны
  rationale: «Морские волны» естественно передаёт генитив θαλάσσης, а «свирепые» сохраняет яркую, угрожающую силу ἄγρια.
- source_word: ἐπαφρίζοντα τὰς ἑαυτῶν αἰσχύνας
  choice: пенящиеся собственным позором
  rationale: Причастная конструкция сохраняет образ волн, чья пена обнаруживает их собственный позор. В русском буквальное множественное «позорами» звучит неестественно, поэтому число разъяснено в сноске без устранения смысловой неоднозначности αἰσχύνας.
- source_word: ἀστέρες πλανῆται
  choice: блуждающие звёзды
  rationale: Передаёт древний образ небесных тел, отклоняющихся от устойчивого пути, не внося современное астрономическое значение слова «планеты».
- source_word: ὁ ζόφος τοῦ σκότους
  choice: мрак тьмы
  rationale: Сохраняет усилительную генитивную конструкцию и мрачную поэтичность греческого выражения; возможный вариант «непроглядная тьма» дан в сноске.
- source_word: εἰς αἰῶνα τετήρηται
  choice: навеки сохранён
  rationale: «Сохранён» отражает перфект пассива τετήρηται — установленное в прошлом и продолжающееся состояние, а «навеки» естественно передаёт εἰς αἰῶνα в контексте суда.
theological_decisions:
- issue: Продолжительность суда в выражении εἰς αἰῶνα
  choice: навеки
  alternative: на век
  rationale: В данном контексте εἰς αἰῶνα естественнее всего обозначает неограниченную продолжительность. Перевод не добавляет к образу суда дальнейших догматических пояснений.
- issue: Референт οἷς в образе блуждающих звёзд
  choice: для которых
  alternative: для кого
  rationale: Русское согласование с ближайшим образом «звёзды» требует формы «которых», при этом контекст сохраняет понимание, что метафора относится к людям.
translation_notes:
  register: Современный литературный русский язык с сохранением резких поэтических образов и параллельного строя оригинала. Синтаксис оставлен фрагментарным, поскольку стих продолжает ряд метафор из предыдущего контекста.
