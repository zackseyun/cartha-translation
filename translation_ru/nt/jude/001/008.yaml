  source_fidelity: 'Перевод точно передаёт триаду сказуемых и её параллелизм: «оскверняют плоть», «отвергают власть» и «злословят славных существ». «Однако и эти люди поступают так же» адекватно сохраняет как сопоставительное ὁμοίως, так и лёгкое противопоставление μέντοι. «Полагаясь на сновидения» является допустимой контекстуальной передачей ἐνυπνιαζόμενοι; сноска честно отмечает более буквальную альтернативу. Неопределённость κυριότητα и δόξας в основном тексте не снимается чрезмерно.'
  naturalness: Текст звучит естественно на современном литературном русском. Двоеточие после «так же» удачно вводит перечень обвинений; повтор «они» делает синтаксическую связь с деепричастным оборотом ясной. Обличительный регистр оригинала сохранён без архаизации.
  terminology: «Плоть» соответствует σάρξ и не сводит её к телу либо к заранее заданному богословскому значению. «Власть» сохраняет открытым референт κυριότητα. «Славные существа» несколько эксплицирует личный референт δόξας, но не отождествляет его в основном тексте с ангелами; сноска корректно указывает буквальное «славы» и вероятное небесное прочтение. «Злословят» хорошо передаёт βλασφημοῦσιν в данном контексте.
