id: JUD.1.8
reference: Jude 1:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὁμοίως μέντοι καὶ οὗτοι ἐνυπνιαζόμενοι σάρκα μὲν μιαίνουσιν, κυριότητα δὲ ἀθετοῦσιν, δόξας δὲ βλασφημοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/008.yaml
  text: Yet in the same way, these people also, relying on dreams, defile the flesh, reject authority, and slander glorious ones.
translation:
  language: ru
  text: 'Однако и эти люди поступают так же: полагаясь на сновидения[a], они оскверняют плоть, отвергают власть и злословят славных существ[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «видя сны». Греческое причастие допускает более буквальный перевод, но, вероятно, означает, что эти люди ссылались на сновидения как на основание своего поведения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «славы». Вероятно, имеются в виду возвышенные небесные существа, возможно ангелы.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁμοίως μέντοι καὶ οὗτοι
  choice: Однако и эти люди поступают так же
  rationale: «Однако» передаёт лёгкое противопоставление μέντοι, а «так же» — сравнительную силу ὁμοίως. Добавленное «поступают» делает фразу естественной по-русски и вводит последующий перечень действий.
- source_word: ἐνυπνιαζόμενοι
  choice: полагаясь на сновидения
  rationale: Причастие связано со всеми последующими действиями и, вероятно, указывает на сновидения как на их основание или оправдание. Более буквальное «видя сны» сохранено в сноске.
- source_word: σάρκα μὲν μιαίνουσιν
  choice: оскверняют плоть
  rationale: «Плоть» сохраняет широту σάρξ, не сводя её ни просто к телу, ни к специальному богословскому понятию; «оскверняют» соответствует нравственно-религиозной окраске μιαίνω.
- source_word: κυριότητα δὲ ἀθετοῦσιν
  choice: отвергают власть
  rationale: «Власть» естественно передаёт κυριότης и не решает однозначно, идёт ли речь о Божьем владычестве, небесной власти или власти вообще. «Отвергают» сохраняет сильный смысл ἀθετέω.
- source_word: δόξας δὲ βλασφημοῦσιν
  choice: злословят славных существ
  rationale: Контекст указывает на возвышенных небесных существ, но не называет их прямо ангелами. «Злословят» ясно передаёт оскорбительную речь βλασφημέω без ограничения слова «богохульствуют» речью против Бога.
theological_decisions:
- issue: Кого обозначает δόξας
  choice: славные существа
  alternative: ангелы; небесные величия; буквально «славы»
  rationale: Следующий стих позволяет предполагать небесных существ, возможно ангелов, однако само слово остаётся менее определённым. Основной текст не сужает его до «ангелов», а буквальная форма отмечена в сноске.
- issue: Смысл ἐνυπνιαζόμενοι
  choice: их поступки основаны на сновидениях, на которые они полагаются
  alternative: видя сны; будучи сновидцами
  rationale: Такое понимание правдоподобно связывает причастие с последующим поведением, но более формальная и менее истолковывающая передача сохранена в сноске.
- issue: Референт κυριότητα
  choice: неуточнённая власть
  alternative: Божье владычество; власть небесных существ; земные структуры власти
  rationale: Греческий текст не называет обладателя власти, поэтому перевод сохраняет эту богословски значимую неопределённость.
translation_notes:
  register: 'Современный литературный русский язык с обличительным, но ясным и сдержанным тоном. Синтаксис слегка перестроен ради естественности: двоеточие вводит три параллельных обвинения. Термины «плоть», «власть» и «славные существа» сохраняют смысловую широту оригинала.'
