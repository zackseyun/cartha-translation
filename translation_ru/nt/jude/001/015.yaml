id: JUD.1.15
reference: Jude 1:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ποιῆσαι κρίσιν κατὰ πάντων καὶ ἐλέγξαι ⸂πάντας τοὺς ἀσεβεῖς⸃ περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν καὶ περὶ πάντων τῶν σκληρῶν ὧν ἐλάλησαν κατ’ αὐτοῦ ἁμαρτωλοὶ ἀσεβεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/015.yaml
  text: to execute judgment against all and to convict all the ungodly concerning all their ungodly deeds that they committed in ungodliness[c][b][a], and concerning all the harsh things that ungodly sinners have spoken against him.
translation:
  language: ru
  text: чтобы совершить суд над всеми и изобличить[a] всех нечестивых за все нечестивые дела, которые они совершили в своём нечестии, и за все дерзкие слова[c], которые нечестивые грешники произнесли против него[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «обличить» или «доказать виновность». Греческий глагол может означать выявление проступка, но здесь он употреблён в судебном контексте рядом с выражением «совершить суд».
    reason: lexical_alternative
  - marker: b
    text: Местоимение «него» по контексту относится к Господу, упомянутому в предыдущем стихе.
    reason: cross_reference
  - marker: c
    text: 'Буквально также возможно: «суровые слова». Греческое слово здесь, вероятно, обозначает резкие, вызывающие или дерзкие высказывания против него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι κρίσιν
  choice: совершить суд
  rationale: Передаёт осуществление судебного действия, а не просто вынесение решения; выражение естественно для возвышенного эсхатологического контекста.
- source_word: κατὰ πάντων
  choice: над всеми
  rationale: В сочетании с «совершить суд» русский оборот «суд над всеми» естественно передаёт судебную направленность κατά с родительным падежом.
- source_word: ἐλέγξαι
  choice: изобличить
  rationale: В судебном контексте глагол означает выявить и доказать вину; «изобличить» сохраняет как обличительный, так и судебный оттенок.
- source_word: πάντας τοὺς ἀσεβεῖς
  choice: всех нечестивых
  rationale: Субстантивированное прилагательное передано кратко и естественно; сохранена лексическая связь с последующими словами той же смысловой группы.
- source_word: περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν
  choice: за все нечестивые дела
  rationale: Предлог «за» естественно обозначает основание обвинения и суда, а «нечестивые дела» ясно передаёт родительный падеж качества ἀσεβείας.
- source_word: ὧν ἠσέβησαν
  choice: которые они совершили в своём нечестии
  rationale: Формулировка сохраняет намеренный повтор корня ἀσεβ- и передаёт как сами поступки, так и характеризующий их образ действия.
- source_word: πάντων τῶν σκληρῶν
  choice: все дерзкие слова
  rationale: В контексте речи σκληρός обозначает резкие, вызывающие или дерзкие высказывания; добавление «слова» естественно восполняет подразумеваемое существительное.
- source_word: ἐλάλησαν κατ’ αὐτοῦ
  choice: произнесли против него
  rationale: Прошедшее время передаёт аорист как совершившиеся речевые действия, а «против него» точно отражает направленность κατά с родительным падежом.
- source_word: ἁμαρτωλοὶ ἀσεβεῖς
  choice: нечестивые грешники
  rationale: Сохранены оба усилительных определения и порядок, подчёркивающий повторяющуюся в стихе тему нечестия.
theological_decisions:
- issue: К кому относится αὐτοῦ во фразе «произнесли против него»
  choice: Сохранить местоимение «него», не заменяя его в основном тексте словами «Господа» или «Бога».
  alternative: «против Господа» или «против Бога»
  rationale: Контекст предыдущего стиха указывает на Господа, однако греческий текст употребляет местоимение. Его сохранение не устраняет содержащуюся в форме текста смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством судебно-эсхатологического контекста. Намеренный повтор слов «нечестивых», «нечестивые», «нечестии» и «нечестивые грешники» отражает настойчивое повторение греческой группы ἀσεβ-; тяжеловесность повтора сохранена как риторическая особенность исходного текста. Местоимение «него» оставлено со строчной буквы, чтобы не вносить в саму графику дополнительное толкование сверх формы греческого текста.
