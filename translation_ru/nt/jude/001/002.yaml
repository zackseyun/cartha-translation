  yaml_path: translation/nt/jude/001/002.yaml
  text: May mercy and peace and love be multiplied to you[a].
translation:
  language: ru
  text: Пусть умножатся для вас милость, и мир, и любовь[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возрастут» или «будут в изобилии» вместо «умножатся».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: милость
  rationale: Обычное и ёмкое соответствие в новозаветном благословении; сохраняет смысл милосердного Божьего отношения и не сужает его до одного лишь чувства сострадания.
- source_word: ὑμῖν
  choice: вам
  rationale: Дательный адресата естественно передаётся русским «вам»; расположение после первого существительного сохраняет связь со всем трёхчастным благословением и близко к порядку слов источника.
- source_word: εἰρήνη
  choice: мир
  rationale: Устоявшееся соответствие, сохраняющее как значение отсутствия вражды, так и более широкий библейский смысл целостности и благополучия.
- source_word: ἀγάπη
  choice: любовь
  rationale: Прямое, современное и богословски нейтральное соответствие.
- source_word: πληθυνθείη
  choice: пусть … умножатся
  rationale: Конструкция с «пусть» передаёт желательное значение аориста пассивного оптатива, а «умножатся» сохраняет образ количественного возрастания. Множественное число согласует сказуемое с однородными подлежащими.
- source_word: καὶ ... καὶ ... καὶ
  choice: и …, и …, и …
  rationale: Повтор союза сохранён, чтобы передать торжественный ритм и накопление исходной формулы.
theological_decisions:
- issue: Передача оптативной формулы благословения
  choice: Пусть милость вам, и мир, и любовь умножатся.
  alternative: Да умножатся вам милость, мир и любовь.
  rationale: «Пусть» ясно выражает пожелание на современном литературном русском, не превращая его ни в утверждение, ни в повеление. Вариант с «да» точен, но заметно более архаичен.
- issue: Соотнесение «вам» с тремя дарами
  choice: Сохранить одно «вам» при общем ряду «милость … мир … любовь».
  alternative: 'Повторить «вам» или перестроить: «Пусть у вас умножатся…».'
  rationale: Греческое ὑμῖν относится ко всему трёхчастному ряду. Однократное «вам» сохраняет эту общность, тогда как «у вас» могло бы сместить оттенок от направленного благословения к простому наличию качеств.
translation_notes:
  register: Современный литературный русский с достоинством эпистолярного благословения. Повтор «и» намеренно сохранён ради ритма оригинала; «пусть» предпочтено более архаичному «да».
