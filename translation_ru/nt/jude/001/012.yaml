source:
  edition: SBLGNT
  text: οὗτοί εἰσιν ⸀οἱ ἐν ταῖς ἀγάπαις ὑμῶν σπιλάδες συνευωχούμενοι, ἀφόβως ἑαυτοὺς ποιμαίνοντες, νεφέλαι ἄνυδροι ὑπὸ ἀνέμων παραφερόμεναι, δένδρα φθινοπωρινὰ ἄκαρπα δὶς ἀποθανόντα ἐκριζωθέντα,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/012.yaml
  text: These are hidden reefs at your love feasts[a], feasting together without fear, shepherding themselves; waterless clouds carried along by winds; autumn trees without fruit, twice dead[c][b], uprooted.
translation:
  language: ru
  text: 'Они — подводные камни на ваших трапезах любви[a]: пируют вместе с вами без страха, пасут самих себя[b]; безводные облака, гонимые ветрами; осенние деревья без плода, дважды мёртвые, вырванные с корнем.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пятна» на ваших трапезах любви. Греческое слово может пониматься в нравственном смысле, но также обозначать опасные подводные камни; последнее хорошо соответствует череде ярких образов у Иуды.'
    reason: alternative_reading
  - marker: b
    text: «Пасут самих себя» можно также перевести как «кормят самих себя»; это подчёркивает их своекорыстие. Ср. Иез. 34, где пастыри кормят себя, а не стадо.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: σπιλάδες
  choice: подводные рифы
  rationale: Слово может обозначать опасные скалы или рифы; это чтение хорошо вписывается в череду ярких образов у Иуды. Возможное нравственное значение «пятна» сохранено в сноске.
- source_word: ἀγάπαις
  choice: трапезах любви
  rationale: Множественное число здесь обозначает общинные трапезы христиан; перевод сохраняет как конкретный характер собрания, так и связь слова с любовью.
- source_word: συνευωχούμενοι
  choice: пируют вместе с вами
  rationale: Причастие означает совместное участие в пиршестве; «с вами» естественно раскрывает совместность в контексте «ваших» трапез.
- source_word: ἀφόβως
  choice: без страха
  rationale: Прямой перевод сохраняет неоднозначность между бесстыдной беспечностью, отсутствием сдержанности и неблагоговением.
- source_word: ἑαυτοὺς ποιμαίνοντες
  choice: пасут самих себя
  rationale: Сохранена пастушеская метафора и её отзвук в Иезекииле 34; вариант «кормят самих себя» пояснён в сноске.
- source_word: νεφέλαι ἄνυδροι
  choice: безводные облака
  rationale: Краткий и образный перевод, передающий обещание дождя без его исполнения.
- source_word: ὑπὸ ἀνέμων παραφερόμεναι
  choice: гонимые ветрами
  rationale: Передаёт пассивное движение под действием внешней силы и звучит естественно по-русски.
- source_word: δένδρα φθινοπωρινὰ ἄκαρπα
  choice: осенние деревья без плода
  rationale: 'Сохранены сезонный и конкретный образы: в пору ожидаемого плода деревья остаются бесплодными.'
- source_word: δὶς ἀποθανόντα
  choice: дважды мёртвые
  rationale: Риторически резкая формулировка оригинала сохранена без истолковывающего сглаживания.
- source_word: ἐκριζωθέντα
  choice: вырванные с корнем
  rationale: Живой русский оборот передаёт полное искоренение и усиливает образ окончательной безжизненности.
theological_decisions:
- issue: Значение σπιλάδες применительно к лжеучителям
  choice: опасные подводные рифы среди общинных трапез
  alternative: пятна или пороки на трапезах любви
  rationale: В контексте последовательности природных метафор образ скрытой морской опасности наиболее выразителен, но лексическая и переводческая альтернатива указана в сноске.
- issue: Смысл ποιμαίνοντες в выражении ἑαυτοὺς ποιμαίνοντες
  choice: сохранена метафора «пасут самих себя»
  alternative: кормят самих себя
  rationale: Глагол обычно означает пасти или быть пастырем; буквальная метафора сохраняет связь с образом себялюбивых пастырей, не сводя смысл только к еде.
- issue: Смысл выражения «дважды мёртвые»
  choice: сохранена намеренная образная напряжённость без пояснения в основном тексте
  alternative: совершенно мёртвые
  rationale: Оригинал допускает разные способы осмысления усиленного образа; перевод не навязывает конкретную богословскую схему.
translation_notes:
  register: Современный литературный русский язык с достоинством и высокой образностью апостольского обличения. Синтаксис разбит на две фразы для ясности, при этом сохранена цепь метафор и её нарастающая сила.
