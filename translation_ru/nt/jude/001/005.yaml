id: JUD.1.5
reference: Jude 1:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι, εἰδότας ⸂ὑμᾶς ἅπαξ⸃ ⸀πάντα, ὅτι ⸀Ἰησοῦς λαὸν ἐκ γῆς Αἰγύπτου σώσας τὸ δεύτερον τοὺς μὴ πιστεύσαντας ἀπώλεσεν,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/005.yaml
  text: I want to remind you[a], though you know all things once for all, that Jesus, having saved a people out of the land of Egypt, afterward destroyed those who did not believe.
translation:
  language: ru
  text: 'Хочу напомнить вам[a], хотя вы раз и навсегда всё это знаете: Иисус, спасший народ из земли Египетской, впоследствии погубил тех, кто не поверил.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых рукописях вместо «Иисус» стоит «Господь» или «Бог».
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπομνῆσαι ... βούλομαι
  choice: Хочу напомнить
  rationale: Инфинитив с βούλομαι выражает намерение; этот перевод естественен для современного русского языка и передаёт напоминание об уже известном.
- source_word: εἰδότας ὑμᾶς ἅπαξ πάντα
  choice: хотя вы раз и навсегда всё это знаете
  rationale: Причастный оборот понят как уступительный; ἅπαξ передано как «раз и навсегда», а πάντα контекстуально — как «всё это», то есть последующие известные читателям примеры.
- source_word: Ἰησοῦς
  choice: Иисус
  rationale: Основной текст SBLGNT содержит Ἰησοῦς; прямой перевод сохраняет сильное христологическое утверждение и не заменяет его менее определённым титулом.
- source_word: λαὸν
  choice: народ
  rationale: В контексте исхода слово обозначает Израиль как единый народ; русский язык не требует неопределённого артикля, поэтому «народ» звучит естественно и не вносит лишней неопределённости.
- source_word: ἐκ γῆς Αἰγύπτου
  choice: из земли Египетской
  rationale: Формулировка сохраняет библейское звучание выражения об исходе, оставаясь понятной современному читателю.
- source_word: σώσας
  choice: спасший
  rationale: Действительное причастие передаёт действие, предшествующее главному глаголу, без лишнего утяжеления фразы.
- source_word: τὸ δεύτερον
  choice: впоследствии
  rationale: В данном обороте выражение указывает на последующее действие — суд после спасения; «впоследствии» естественно передаёт временную последовательность.
- source_word: τοὺς μὴ πιστεύσαντας
  choice: тех, кто не поверил
  rationale: Перевод прямо передаёт отрицательное причастие и сохраняет смысл отказа поверить Богу.
- source_word: ἀπώλεσεν
  choice: погубил
  rationale: Глагол обозначает суровый Божий суд над неверовавшим поколением; «погубил» точно и естественно передаёт эту силу.
theological_decisions:
- issue: Субъект действия при исходе
  choice: Иисус
  alternative: Господь; Бог
  rationale: Предоставленный греческий текст читает Ἰησοῦς. Основной перевод следует этому чтению и сохраняет его христологическую напряжённость; значимые разночтения отмечены в сноске.
- issue: Связь спасения и последующего суда
  choice: 'сохранить прямое сопоставление: сначала Иисус спас народ, затем погубил неверовавших'
  alternative: смягчить или объяснить это как действия разных субъектов
  rationale: Греческая синтаксическая конструкция относит оба действия к одному субъекту. Перевод не устраняет заключённое в тексте богословское предостережение.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис слегка упрощён для ясности; двоеточие естественно вводит содержание напоминания. Выражение «земля Египетская» сохраняет узнаваемый библейский оттенок без чрезмерной архаизации.
