  text: ἑαυτοὺς ἐν ἀγάπῃ θεοῦ τηρήσατε προσδεχόμενοι τὸ ἔλεος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/021.yaml
  text: keep yourselves in the love of God[c][b][a], waiting for the mercy of our Lord Jesus the Messiah unto eternal life.
translation:
  language: ru
  text: Храните себя в любви Божьей[a], ожидая милости нашего Господа Иисуса Мессии[b] для вечной жизни[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Божьей любви»; греческое выражение может также означать «в любви к Богу».'
    reason: alternative_reading
  - marker: b
    text: 'Греч. «Иисуса Христа»; здесь Χριστός передано по значению титула: «Мессия».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «к вечной жизни»; буквальнее: «для вечной жизни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρήσατε
  choice: храните себя
  rationale: Аорист, действительный залог, повелительное наклонение, 2-е лицо множественного числа. «Храните себя» естественно передаёт прямое увещание и идею пребывания в определённой сфере, не уточняя сверх текста способы этого хранения.
- source_word: ἐν ἀγάπῃ θεοῦ
  choice: в любви Божьей
  rationale: 'Формулировка близка к греческой и по возможности сохраняет неоднозначность родительного θεοῦ: речь может идти о Божьей любви или о любви, направленной к Богу.'
- source_word: προσδεχόμενοι
  choice: ожидая
  rationale: Причастие настоящего времени обозначает продолжающуюся установку, сопутствующую главному повелению. «Ожидая» передаёт направленное в будущее ожидание без добавления не выраженной явно интенсивности.
- source_word: ἔλεος
  choice: милости
  rationale: «Милость» — точный и привычный русский эквивалент, сохраняющий смысл сострадательного и незаслуженного благоволения.
- source_word: κυρίου
  choice: Господа
  rationale: Обычное новозаветное соответствие κύριος в титуле Иисуса.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός здесь сохраняет значение титула, поэтому переведено как «Мессия», а не просто передано традиционной транслитерацией «Христос».
- source_word: εἰς ζωὴν αἰώνιον
  choice: ведущей к вечной жизни
  rationale: εἰς выражает направленность к цели или результату. Оборот «ведущей к вечной жизни» ясно и естественно передаёт эту направленность в современном русском языке.
theological_decisions:
- issue: Значение родительного падежа в ἀγάπῃ θεοῦ
  choice: Сохранить возможную многозначность посредством выражения «в любви Божьей».
  alternative: «в Божьей любви» или «в любви к Богу»
  rationale: Греческий родительный может обозначать как любовь Бога к людям, так и любовь людей к Богу; ближайший контекст не требует однозначно выбирать только одно понимание.
- issue: Передача Χριστοῦ в сочетании Ἰησοῦ Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: Слово Χριστός имеет здесь силу титула «Помазанник, Мессия»; смысловой перевод сохраняет этот титульный характер.
- issue: Связь εἰς ζωὴν αἰώνιον с предшествующей фразой
  choice: «милости… ведущей к вечной жизни»
  alternative: «милости… для вечной жизни» или более буквальное «к вечной жизни»
  rationale: Греческий предлог εἰς указывает на цель или итог. Основной текст передаёт это естественным русским оборотом, а примечание сохраняет более буквальные варианты.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Храните себя» и «любовь Божья» понятны широкому читателю, не являются архаичными и сохраняют достоинство исходного увещания. Порядок фразы следует греческому смысловому движению, но синтаксис сделан естественным для русского.
