review_pass:
  verdict: revise
  source_fidelity: Основной текст точно передаёт трёхчастное обвинение, ветхозаветные имена и итоговый смысл ἀπώλοντο. «Предались заблуждению» — допустимая русская передача образного ἐξεχύθησαν, не навязывающая спорную интерпретацию. Однако «ради платы» звучит несколько неестественно в современном русском; «за плату» точнее и идиоматичнее передаёт μισθοῦ в данном контексте.
  naturalness: Торжественный, но современный литературный регистр сохранён. Замена «ради платы» на «за плату» делает центральную трудную фразу более естественной без изменения смысла. В сноске «устремились по ложному пути» синтаксически менее удачно и несколько сильнее истолковывает πλάνη как «ложный путь»; «устремились к заблуждению» лучше сохраняет образ движения в ошибочное направление.
  terminology: Каин, Валаам и Корей — закреплённые русские библейские формы. «Горе», «путём», «заблуждение», «мятеж» и «погибли» соответствуют пророческому регистру и смыслу греческого текста. «Мятеж Корея» обоснован аллюзией на Числа 16, но не излишне уточняет способ гибели.
  issues:
