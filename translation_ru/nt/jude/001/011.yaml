    rationale: '«Безудержно устремились по ложному пути» стилистически и образно менее точна: обычно устремляются «к» чему-либо или «в» что-либо. Кроме того, «ложный путь» несколько сужает многозначное πλάνη. Нейтральнее сохранить «заблуждение».'
