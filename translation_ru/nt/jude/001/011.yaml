  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐαὶ αὐτοῖς, ὅτι τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν, καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν, καὶ τῇ ἀντιλογίᾳ τοῦ Κόρε ἀπώλοντο.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/011.yaml
  text: Woe to them[a], because they have walked in the way of Cain, and have poured themselves out for pay into Balaam’s error, and have perished in Korah’s rebellion.
translation:
  language: ru
  text: Горе им, потому что они пошли путём Каина, за плату предались заблуждению Валаама[a] и погибли в мятеже Корея.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради выгоды безудержно устремились к заблуждению Валаама».'
    reason: Лексическая альтернатива для сжатого и метафорически трудного греческого выражения.
lexical_decisions:
- source_word: οὐαὶ
  choice: Горе
  rationale: Сохраняет пророческую силу возгласа осуждения; «увы» звучало бы преимущественно как скорбь.
- source_word: τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν
  choice: они пошли путём Каина
  rationale: Передаёт метафору пути как образа поведения и естественно звучит по-русски.
- source_word: τῇ πλάνῃ τοῦ Βαλαὰμ
  choice: заблуждению Валаама
  rationale: '«Заблуждение» сохраняет широту πλάνη: ошибочный и нравственно ложный путь, без излишнего уточнения как обмана.'
- source_word: μισθοῦ
  choice: ради платы
  rationale: Передаёт корыстный мотив и конкретное значение вознаграждения.
- source_word: ἐξεχύθησαν
  choice: предались
  rationale: В данном метафорическом употреблении выражает безудержную самоотдачу ложному пути; буквальное «излились» по-русски здесь неясно.
- source_word: τῇ ἀντιλογίᾳ τοῦ Κόρε
  choice: в мятеже Корея
  rationale: В контексте Чисел 16 ἀντιλογία означает противление, принявшее форму мятежа; русский оборот сохраняет аллюзию.
- source_word: ἀπώλοντο
  choice: погибли
  rationale: Кратко и торжественно передаёт завершённый результат уничтожения или гибели.
- source_word: Κάϊν / Βαλαὰμ / Κόρε
  choice: Каин / Валаам / Корей
  rationale: Употреблены закрепившиеся в русской библейской традиции формы имён.
theological_decisions:
- issue: Передача трудного выражения καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν
  choice: ради платы предались заблуждению Валаама
  alternative: ради выгоды безудержно устремились по ложному пути Валаама
  rationale: Основной вариант сохраняет корыстный мотив μισθοῦ и идею самоотдачи в ἐξεχύθησαν, но не воспроизводит неестественное по-русски буквальное «излились». Более динамическая трактовка вынесена в сноску, поскольку точный оттенок метафоры остаётся спорным.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Сохранена трёхчастная структура обвинения и ветхозаветные аллюзии; устаревшие синтаксис и лексика избегаются.
