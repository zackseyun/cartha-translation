translation:
  language: ru
  text: других спасайте, выхватывая из огня[a]; к другим же будьте милостивы со страхом[b], ненавидя даже хитон, осквернённый плотью[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «других избавляйте, выхватывая из огня». Огонь может обозначать грядущий суд или тяжёлую духовную опасность.'
    reason: alternative_reading
  - marker: b
    text: «Со страхом» может означать благоговейный страх перед Богом или осторожность, чтобы самому не подвергнуться осквернению.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «одежду, осквернённую греховной природой». В греческом: «плотью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σῴζετε
  choice: спасайте
  rationale: Передаёт повелительный смысл формы и сохраняет как значение спасения, так и образ срочного избавления от опасности.
- source_word: ἐκ πυρὸς ἁρπάζοντες
  choice: выхватывая из огня
  rationale: Причастный оборот указывает, каким образом следует спасать; «выхватывая» сохраняет оттенок силы и безотлагательности.
- source_word: ἐλεᾶτε
  choice: будьте милостивы
  rationale: Естественно передаёт повеление проявлять милость, не ослабляя его действенного характера.
- source_word: ἐν φόβῳ
  choice: со страхом
  rationale: 'Сохраняет краткость и неоднозначность греческого выражения: возможны как благоговейный страх перед Богом, так и осторожность перед нравственным осквернением.'
- source_word: μισοῦντες
  choice: ненавидя
  rationale: Прямо передаёт резкость греческого слова и подчёркивает необходимость отличать милость к человеку от отношения к осквернению.
- source_word: χιτῶνα
  choice: хитон
  rationale: Сохраняет конкретный образ нижней одежды древнего мира, а не заменяет его более общим словом.
- source_word: ἐσπιλωμένον
  choice: осквернённый
  rationale: Передаёт устойчивое состояние загрязнения и одновременно сохраняет нравственный оттенок метафоры.
- source_word: σάρξ
  choice: плоть
  rationale: Сохраняет исходную метафору и не подменяет её более истолковывающим выражением «греховная природа».
theological_decisions:
- issue: Смысл огня в образе спасения
  choice: Оставить слово «огонь» без уточнения в основном тексте.
  alternative: Будущий суд или нынешняя губительная духовная опасность.
  rationale: Сам стих не называет прямо, что именно обозначает огонь, поэтому перевод сохраняет образ и его богословскую напряжённость.
- issue: Значение слова σάρξ в выражении об осквернённом хитоне
  choice: Передать как «плоть».
  alternative: «Греховная природа».
  rationale: «Плоть» сохраняет образность и допускает контекстуальное толкование, не вводя в текст систематизированное богословское объяснение.
- issue: Смысл выражения ἐν φόβῳ
  choice: Передать буквально как «со страхом».
  alternative: «С благоговением» или «с осторожностью».
  rationale: Греческая формулировка допускает страх перед Богом и осторожность из-за опасности самому подвергнуться осквернению; основной текст не разрешает эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан естественным для русского, при этом сохранены параллельные обращения к разным людям, резкость «ненавидя» и конкретный образ хитона.
