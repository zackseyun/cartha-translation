  text: ὑμεῖς δέ, ἀγαπητοί, ⸂ἐποικοδομοῦντες ἑαυτοὺς τῇ ἁγιωτάτῃ ὑμῶν πίστει⸃, ἐν πνεύματι ἁγίῳ προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/020.yaml
  text: But you[a], beloved, building yourselves up in your most holy faith and praying in the Holy Spirit[c][b],
translation:
  language: ru
  text: Вы же, возлюбленные, созидая самих себя на основании вашей святейшей веры[a] и молясь в Святом Духе[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «созидая самих себя в вашей святейшей вере». Греческая конструкция позволяет понимать веру и как основание созидания, и как сферу, в которой оно совершается. Слово «вера» здесь, вероятнее всего, означает общую христианскую веру адресатов, хотя само по себе может также обозначать доверие или верность.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможен перевод: «молясь посредством Святого Духа». Греческое выражение может подчёркивать как сферу молитвы, так и содействие Духа.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Вы же
  rationale: Явное местоимение и частица δέ подчёркивают противопоставление адресатов описанным ранее нечестивцам; «вы же» естественно передаёт этот контраст по-русски.
- source_word: ἀγαπητοί
  choice: возлюбленные
  rationale: Сохраняет форму обращения, сердечность и богословскую весомость слова, не сводя его к более разговорному «дорогие друзья».
- source_word: ἐποικοδομοῦντες ἑαυτούς
  choice: созидайте себя
  rationale: Причастия в стихах 20–21 зависят от повелительного τηρήσατε; в русском их естественно передать однородными побуждениями. «Созидайте» сохраняет строительную метафору, а «себя» — возвратное и собирательное значение множественного числа.
- source_word: τῇ ἁγιωτάτῃ ὑμῶν πίστει
  choice: на основании вашей святейшей веры
  rationale: Дательный падеж при ἐποικοδομέω допускает понимание веры как основания созидания. Формулировка ясна по-русски, сохраняет строительный образ и превосходную степень ἁγιωτάτῃ.
- source_word: πίστει
  choice: веры
  rationale: В контексте Послания Иуды наиболее вероятна общая принятая христианская вера, однако русское «вера» не исключает оттенка доверия.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: в Святом Духе
  rationale: Сохраняет значение предлога ἐν и наиболее вероятную отсылку к Божьему Святому Духу, не сводя выражение исключительно к инструментальному «посредством».
- source_word: προσευχόμενοι
  choice: молитесь
  rationale: Повелительная форма естественно передаёт увещевательную функцию причастия в цепи наставлений и сохраняет связь с продолжением в следующем стихе.
theological_decisions:
- issue: Значение πίστις в выражении «ваша святейшая вера»
  choice: общая для адресатов принятая христианская вера
  alternative: личное доверие или верность
  rationale: Употребление слова «вера» у Иуды, особенно в стихе 3, указывает на переданное общине содержание веры; перевод сохраняет само слово и не исключает присущей ему многозначности.
- issue: Кого обозначает πνεύματι ἁγίῳ
  choice: Божьего Святого Духа
  alternative: святой настрой человеческого духа
  rationale: Раннехристианское словоупотребление и контекст молитвы делают отсылку к Святому Духу наиболее естественной; отсутствие артикля в греческом не требует неопределённого понимания.
- issue: Значение ἐν при «Святом Духе»
  choice: 'сфера или влияние: «в Святом Духе»'
  alternative: 'средство или действующая сила: «Святым Духом»'
  rationale: Буквальное «в» сохраняет смысловую широту греческой конструкции и не устраняет возможный оттенок содействия Духа.
translation_notes:
  register: Современный литературный русский с достоинством апостольского увещевания. Сохранены обращение «возлюбленные», строительная метафора и незавершённость синтаксической мысли, продолжающейся в следующем стихе. Причастные формы переданы повелительными глаголами ради естественного русского синтаксиса.
