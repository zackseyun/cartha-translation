id: JUD.1.10
reference: Jude 1:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὗτοι δὲ ὅσα μὲν οὐκ οἴδασιν βλασφημοῦσιν, ὅσα δὲ φυσικῶς ὡς τὰ ἄλογα ζῷα ἐπίστανται, ἐν τούτοις φθείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/010.yaml
  text: But these people slander whatever they do not understand[a], and whatever they understand naturally, like irrational animals[c][b], by these things they are corrupted.
translation:
  language: ru
  text: А эти люди злословят то, чего не понимают[a], а то, что они знают по природе, подобно неразумным животным, губит их[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «того, чего не знают»; «поносят» или «хулят».'
    reason: Лексические варианты для οἴδασιν и βλασφημοῦσιν.
  - marker: b
    text: 'Буквально: «в этом они губятся/портятся». Или: «в этом они погибают»; возможно также: «в этом они растлеваются».'
    reason: φθείρονται может обозначать гибель, порчу или нравственное растление; ἐν τούτοις допускает передачу как «в этом» или «этим».
lexical_decisions:
- source_word: οὗτοι
  choice: эти люди
  rationale: Указательное местоимение отсылает к описанным в контексте нечестивцам; добавление «люди» делает отсылку естественной по-русски, не вводя указания на пол.
- source_word: βλασφημοῦσιν
  choice: злословят
  rationale: Глагол означает оскорбительную, порочащую речь и не обязательно ограничивается богохульством; «злословят» сохраняет широту и серьёзность смысла.
- source_word: ὅσα μὲν οὐκ οἴδασιν
  choice: то, чего не понимают
  rationale: В противопоставлении природному, животному знанию речь идёт не просто об отсутствии сведений, а об отсутствии понимания.
- source_word: φυσικῶς
  choice: от природы
  rationale: Передаёт естественный, нерефлексивный способ знания и сохраняет связь с последующим сравнением с животными.
- source_word: ἄλογα ζῷα
  choice: неразумные животные
  rationale: «Неразумные» прямо передаёт отсутствие разумного постижения и звучит естественно в современном литературном русском.
- source_word: ἐπίστανται
  choice: знают
  rationale: Глагол обозначает имеющееся у них непосредственное знание; «знают» создаёт ясный контраст с тем, чего они не понимают.
- source_word: ἐν τούτοις
  choice: в том
  rationale: Сохраняет предложную конструкцию оригинала и не исключает ни сферы, ни средства их гибели.
- source_word: φθείρονται
  choice: губят себя
  rationale: Возвратная передача выражает то, что следование природным влечениям ведёт их к собственной гибели; возможный оттенок нравственного растления отмечен в сноске.
theological_decisions:
- issue: Значение βλασφημέω при объекте, который прямо не назван божественным
  choice: злословят
  alternative: богохульствуют; поносят
  rationale: Оригинал осуждает оскорбительную речь о непонятом, но не уточняет, что её объектом непосредственно является Бог; «злословят» не сужает смысл до богохульства.
- issue: Смысл и залоговая оттеночность φθείρονται
  choice: губят себя
  alternative: погибают; растлеваются
  rationale: Форма допускает оттенки гибели, разрушения и нравственного растления, а также саморазрушительный результат их поведения. Основной текст передаёт собственную гибель, не уточняя исключительно нравственный или судебный аспект; варианты отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис близок к греческому противопоставлению двух видов знания; устаревшие и чрезмерно конфессиональные выражения избегаются.
