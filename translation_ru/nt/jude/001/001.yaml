id: JUD.1.1
reference: Jude 1:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἰούδας Ἰησοῦ Χριστοῦ δοῦλος, ἀδελφὸς δὲ Ἰακώβου, τοῖς ἐν θεῷ πατρὶ ⸀ἠγαπημένοις καὶ Ἰησοῦ Χριστῷ τετηρημένοις κλητοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/001.yaml
  text: 'Jude[a], a servant of Jesus the Messiah and brother of James, to those who are loved in God the Father and kept for Jesus the Messiah[c][b], called:'
translation:
  language: ru
  text: Иуда, раб Иисуса Мессии и брат Иакова, — призванным, любимым в Боге Отце и хранимым для Иисуса Мессии[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хранимым Иисусом Мессией». Греческий дательный падеж может указывать либо на предназначение («для»), либо на действующее лицо («Иисусом Мессией»).'
    reason: alternative_reading
  - marker: b
    text: 'В некоторых рукописях: «освящённым в Боге Отце» вместо «любимым в Боге Отце».'
    reason: textual_variant
lexical_decisions:
- source_word: Ἰούδας
  choice: Иуда
  rationale: Обычная русская передача греческого личного имени; контекст и заглавие послания отличают автора от Иуды Искариота.
- source_word: δοῦλος
  choice: раб
  rationale: Передаёт принадлежность и полное служебное подчинение, выраженные словом δοῦλος; в русском библейском и литературном употреблении это естественное самообозначение автора послания.
- source_word: Χριστοῦ / Χριστῷ
  choice: Мессия / Мессии
  rationale: Χριστός является титулом со значением «Помазанник»; «Мессия» ясно сохраняет титульный смысл, а не превращает слово только в часть имени.
- source_word: ἀδελφὸς δὲ Ἰακώβου
  choice: и брат Иакова
  rationale: δέ здесь имеет мягкую соединительную функцию; русское «и» естественно связывает две части самообозначения.
- source_word: τοῖς ... κλητοῖς
  choice: призванным
  rationale: Субстантивированное прилагательное обозначает адресатов, получивших призвание; начальная позиция позволяет по-русски естественно подчинить ему следующие определения.
- source_word: ἐν θεῷ πατρὶ ἠγαπημένοις
  choice: любимым в Боге Отце
  rationale: Сохраняет значение ἐν как сферы или отношения и результирующее состояние, выраженное перфектным пассивным причастием.
- source_word: τετηρημένοις
  choice: хранимым
  rationale: Передаёт продолжающееся состояние сохранности, являющееся результатом предшествующего действия.
- source_word: Ἰησοῦ Χριστῷ
  choice: для Иисуса Мессии
  rationale: 'Дательный падеж истолкован как направленность или предназначение: адресаты сохранены для Мессии. Возможное значение деятеля сохранено в сноске.'
theological_decisions:
- issue: Отношение τετηρημένοις к Ἰησοῦ Χριστῷ
  choice: хранимым для Иисуса Мессии
  alternative: хранимым Иисусом Мессией
  rationale: Греческий дательный допускает как значение предназначения или пользы («для»), так и значение действующего лица («Иисусом Мессией»). Основной текст следует вероятному значению предназначения, а подлинная неоднозначность отмечена в сноске.
- issue: Разночтение ἠγαπημένοις / ἡγιασμένοις
  choice: любимым
  alternative: освящённым
  rationale: 'Основной текст следует SBLGNT: ἠγαπημένοις. Значимое рукописное разночтение вынесено в сноску без смешения вариантов.'
- issue: Синтаксическая связь κλητοῖς
  choice: «призванным» поставлено первым как обозначение адресатов
  alternative: «любимым… хранимым… призванным»
  rationale: В греческом κλητοῖς завершает ряд определений при τοῖς, но русская начальная позиция делает адресата ясным и сохраняет параллельность всех трёх характеристик.
translation_notes:
  register: Современный литературный русский с достоинством эпистолярного приветствия. Тире отделяет имя и самообозначение отправителя от адресатов. Сохранены краткость исходного текста, титул «Мессия» и богословски значимая неоднозначность дательного падежа.
