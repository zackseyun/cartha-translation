id: JUD.1.3
reference: Jude 1:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἀγαπητοί, πᾶσαν σπουδὴν ποιούμενος γράφειν ὑμῖν περὶ τῆς κοινῆς ⸀ἡμῶν σωτηρίας ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/003.yaml
  text: Beloved[a], although I was making every effort to write to you about our common salvation, I found it necessary to write[d][c][b], urging you to contend earnestly for the faith once for all delivered to the saints.
translation:
  language: ru
  text: Возлюбленные, хотя я прилагал все усилия, чтобы написать вам о нашем общем спасении, я счёл необходимым написать вам, призывая вас ревностно бороться за веру[a], раз и навсегда переданную[b] святым[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «вера», вероятнее всего, означает доверенное верующим содержание христианского учения, а не только личный акт доверия Богу.
    reason: alternative_reading
  - marker: b
    text: 'Или: «вручённую»; греческое слово может обозначать передачу или вручение чего-либо другим.'
    reason: lexical_alternative
  - marker: c
    text: «Святые» — Божий святой народ, то есть верующие, а не только люди, впоследствии особо признанные святыми.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Возлюбленные
  rationale: Сохраняет тёплое пастырское обращение и его прямую связь с понятием любви; в современном русском звучит возвышенно, но понятно.
- source_word: πᾶσαν σπουδὴν ποιούμενος
  choice: хотя я всем сердцем желал
  rationale: Причастный оборот по контексту имеет уступительный оттенок. Перевод естественно передаёт горячее усердие автора, не создавая неуклюжей русской кальки.
- source_word: γράφειν ... γράψαι
  choice: написать ... обратиться ... с призывом
  rationale: Различие между первоначальным намерением и фактически возникшей необходимостью сохранено; второе «писать» передано контекстуально, чтобы избежать тяжёлого повтора, а значение письма остаётся ясным.
- source_word: περὶ τῆς κοινῆς ἡμῶν σωτηρίας
  choice: о нашем общем спасении
  rationale: Точно и естественно передаёт κοινῆς как спасение, общее для автора и адресатов.
- source_word: ἀνάγκην ἔσχον
  choice: я счёл необходимым
  rationale: Передаёт необходимость, возникшую вследствие обстоятельств, не усиливая её до внешнего принуждения.
- source_word: παρακαλῶν
  choice: с призывом
  rationale: Передаёт серьёзное настойчивое увещание и естественно связывается с целью письма.
- source_word: ἐπαγωνίζεσθαι
  choice: усердно бороться
  rationale: Сохраняет усиленный характер глагола и образ напряжённой борьбы, не ограничивая его физическим противоборством.
- source_word: τῇ ... πίστει
  choice: за веру
  rationale: В данном сочетании вера наиболее вероятно обозначает доверенное общине содержание христианского учения; русское «вера» сохраняет и привычный термин, и некоторую смысловую широту.
- source_word: ἅπαξ
  choice: раз и навсегда
  rationale: Передаёт окончательный, неповторимый характер состоявшейся передачи.
- source_word: παραδοθείσῃ
  choice: переданную
  rationale: Охватывает значение вручения и передачи учения, не уточняя без необходимости способ или человеческую цепь передачи.
- source_word: τοῖς ἁγίοις
  choice: святым
  rationale: Сохраняет установленное новозаветное обозначение Божьего святого народа; примечание устраняет возможное современное понимание только как особо канонизированных лиц.
theological_decisions:
- issue: Значение πίστις в выражении «за веру»
  choice: Совокупность христианской веры и учения, доверенная общине
  alternative: Личное доверие или акт веры
  rationale: Определения «раз и навсегда переданную святым» наиболее естественно описывают объективно переданное содержание, однако основной текст сохраняет широкое слово «вера» и не превращает толкование в парафраз.
- issue: Сила выражения ἅπαξ παραδοθείσῃ
  choice: Окончательная передача — «раз и навсегда переданную»
  alternative: Однократная передача — «однажды переданную»
  rationale: В этом контексте ἅπαξ подчёркивает не просто момент в прошлом, но определённость и неповторимость передачи; перевод не уточняет сверх текста её механизм или позднейшие конфессиональные последствия.
translation_notes:
  register: Современный литературный русский с достоинством и пастырской теплотой. Синтаксис слегка перестроен ради естественности, но сохранены уступительный поворот, возникшая необходимость, настойчивость призыва и напряжённая сила ἐπαγωνίζεσθαι. Все маркеры примечаний присутствуют в основном тексте.
