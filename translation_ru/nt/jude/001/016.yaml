base_translation:
  language: en
  yaml_path: translation/nt/jude/001/016.yaml
  text: These are grumblers[a], malcontents, walking according to their own desires, and their mouth speaks arrogant things[c][b], showing favoritism for the sake of gain.
translation:
  language: ru
  text: Это ропотники, жалующиеся на свою участь, живущие по собственным желаниям[a]; их уста произносят надменные речи[b], и они оказывают людям предпочтение ради выгоды[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «живущие по собственным страстям».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «говорят напыщенные слова».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «восхищаются лицами» — идиома, означающая пристрастное предпочтение или угодливое отношение к людям.'
    reason: idiom_explanation
lexical_decisions:
- source_word: γογγυσταί
  choice: ропотники
  rationale: Передаёт постоянный недовольный ропот и сохраняет характерное для библейского увещания, но понятное современному читателю слово.
- source_word: μεμψίμοιροι
  choice: жалующиеся на свою участь
  rationale: Редкое слово обозначает людей, недовольных доставшейся им долей; описательный перевод точнее общего «недовольные» и не сливается по смыслу с γογγυσταί.
- source_word: κατὰ τὰς ἐπιθυμίας αὐτῶν πορευόμενοι
  choice: живущие по собственным желаниям
  rationale: 'Метафорическое πορεύομαι естественно передано как образ жизни, а ἐπιθυμίαι оставлено широким по значению: отрицательная нравственная оценка явствует из контекста.'
- source_word: τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα
  choice: их уста произносят надменные речи
  rationale: «Уста» сохраняет греческий образ речи, а «надменные речи» передаёт высокомерный и напыщенный характер ὑπέρογκα без неясной буквальности.
- source_word: θαυμάζοντες πρόσωπα
  choice: выказывают людям особое расположение
  rationale: Передан идиоматический смысл лицеприятного отношения к людям, а не буквальное «удивляются лицам»; формулировка остаётся достаточно широкой и не сводит выражение только к лести.
- source_word: ὠφελείας χάριν
  choice: ради выгоды
  rationale: Ясно выражает корыстную цель такого расположения и соответствует значению пользы или преимущества.
theological_decisions:
- issue: Нравственный оттенок ἐπιθυμίαι
  choice: «желаниям» в основном тексте, с отрицательной оценкой из контекста
  alternative: «страстям» или «похотям»
  rationale: Греческое слово может обозначать сильные желания шире сексуальной похоти. Контекст осуждает их направленность, поэтому не следует без необходимости сужать смысл.
- issue: Идиоматический смысл θαυμάζοντες πρόσωπα
  choice: «выказывают людям особое расположение»
  alternative: «льстят людям», «лицеприятствуют» или буквально «восхищаются лицами»
  rationale: Выражение указывает на пристрастное почтение ради собственной пользы. Выбранный вариант сохраняет широту идиомы, тогда как «льстят» описывает лишь один возможный способ такого поведения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенными библейскими словами «ропотники» и «уста». Синтаксис сохраняет плотность и обличительный тон греческого текста, а точка с запятой ясно разделяет два ряда характеристик.
