  text: that they were saying to you[a], “In the last time there will be mockers[b], going according to their own ungodly desires.”
translation:
  language: ru
  text: 'что они говорили вам: «В последнее время[a] будут насмешники[b], живущие по своим нечестивым желаниям».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в конце времени». В греческом тексте слово «время» стоит в единственном числе, а не «дни».'
