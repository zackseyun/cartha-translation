    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: говорили
  rationale: Имперфект передаёт продолжавшуюся или повторявшуюся в прошлом речь; русская форма «говорили» естественно сохраняет этот оттенок.
- source_word: Ἐπ’ ἐσχάτου χρόνου
  choice: В последнее время
  rationale: Перевод сохраняет единственное число χρόνος («время») и эсхатологический смысл выражения, не заменяя его привычной формулой «в последние дни».
- source_word: ἐμπαῖκται
  choice: насмешники
  rationale: Современное и понятное слово, передающее насмешливое, презрительное противление.
- source_word: κατὰ τὰς ἑαυτῶν ἐπιθυμίας
  choice: по своим ... желаниям
  rationale: Предлог κατά с винительным выражает сообразность или следование чему-либо; «по своим желаниям» естественно передаёт эту связь. «Желания» не сужает значение до сексуальной похоти.
- source_word: πορευόμενοι
  choice: живущие
  rationale: Причастие буквально связано с хождением, но здесь метафорически описывает образ жизни; «живущие» ясно и естественно передаёт этот смысл.
- source_word: τῶν ἀσεβειῶν
  choice: нечестивым
  rationale: Родительный падеж характеризует желания как отмеченные нечестием. Прилагательное «нечестивым» сохраняет нравственно-религиозную оценку и звучит по-русски естественно.
theological_decisions:
- issue: Эсхатологическое выражение
  choice: В последнее время
  alternative: В последние дни; в конце времени
  rationale: Сохранено единственное число «время», без гармонизации с более привычными эсхатологическими формулами других мест Писания.
- issue: Нравственная характеристика желаний
  choice: нечестивым желаниям
  alternative: желаниям нечестия; безбожным желаниям
  rationale: Перевод сохраняет нравственную оценку текста, но не сводит широкий смысл ἐπιθυμίαι к одной разновидности желаний, например сексуальной похоти.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Начальное «что» сохранено как связь с предыдущим стихом. Все примечания поставлены непосредственно после соответствующих выражений; порядок маркеров исправлен по отношению к предоставленному английскому слою.
