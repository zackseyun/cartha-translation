reference: Jude 1:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος, οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας, ἀλλὰ εἶπεν· Ἐπιτιμήσαι σοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/009.yaml
  text: But Michael the archangel[a], when he was disputing with the devil and arguing about Moses' body, did not dare to bring a slanderous judgment against him, but said[b], “May the Lord rebuke you.”
translation:
  language: ru
  text: 'Но архангел Михаил, когда он спорил с дьяволом и обсуждал с ним тело Моисея, не осмелился вынести против него оскорбительное осуждение[a], а сказал: «Пусть Господь укорит тебя!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не осмелился произнести против него поносящее обвинение». Греческое выражение допускает понимание как оскорбительного осуждения, так и обвинения, содержащего хулу или поношение.'
    reason: lexical_alternative
  - marker: b
    text: Эти слова перекликаются с Захарией 3:2, где Господь укоряет сатану.
    reason: cross_reference
lexical_decisions:
- source_word: ἀρχάγγελος
  choice: архангел
  rationale: Общепринятый и понятный русский эквивалент титула, сохраняющий значение старшего ангела.
- source_word: διαβόλῳ
  choice: дьяволом
  rationale: В данном контексте διάβολος обозначает личного сверхъестественного противника; традиционное титульное наименование естественно по-русски.
- source_word: διακρινόμενος
  choice: споря
  rationale: Передаёт участие в конфликте или споре и сохраняет обстоятельственную связь с последующим глаголом.
- source_word: διελέγετο
  choice: препирался
  rationale: Передаёт продолжительный словесный спор и позволяет не сливать два близких, но отдельных греческих глагола.
- source_word: περὶ τοῦ Μωϋσέως σώματος
  choice: о теле Моисея
  rationale: Естественная русская конструкция, точно сохраняющая конкретный предмет спора.
- source_word: οὐκ ἐτόλμησεν
  choice: не осмелился
  rationale: Прямо передаёт значение дерзновения или решимости совершить действие.
- source_word: κρίσιν ἐπενεγκεῖν βλασφημίας
  choice: вынести против него оскорбительный приговор
  rationale: Сохраняет судебный оттенок κρίσις и силу βλασφημία как поношения, не утверждая однозначно, что речь идёт именно о богохульстве. Трудность конструкции отмечена сноской.
- source_word: Ἐπιτιμήσαι σοι κύριος
  choice: Пусть Господь укорит тебя!
  rationale: Конструкция с «пусть» ясно передаёт желательное значение аористного оптатива, а «укорит» — направленное властное порицание без архаического для современного читателя употребления слова «запретит».
- source_word: κύριος
  choice: Господь
  rationale: Устоявшееся русское библейское соответствие κύριος в данном контексте.
theological_decisions:
- issue: Характер сдержанности Михаила в обращении с дьяволом
  choice: Михаил не выносит собственного оскорбительного приговора, а призывает Господа укорить дьявола.
  alternative: Михаил избегает богохульного суждения либо вообще поносящего обвинения.
  rationale: Греческое сочетание κρίσιν … βλασφημίας допускает разные оттенки. Основной текст сохраняет ясное противопоставление между отказом Михаила самому вынести приговор и его обращением к власти Господа, а сноска оставляет лексическую неоднозначность открытой.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис сохраняет два греческих глагола словесного противостояния («споря… препирался»), не делая фразу чрезмерно формальной. Формула «Пусть Господь укорит тебя» понятна современному читателю и передаёт оптатив; традиционное «да запретит тебе Господь» не выбрано из-за архаического значения глагола «запретить».
