  text: And have mercy on those who are doubting,[a]
translation:
  language: ru
  text: И к сомневающимся будьте милостивы,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к колеблющимся»; возможно: «к спорящим». Греческое причастие в этом контексте допускает несколько смысловых оттенков.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз, связывающий это наставление с предыдущими и последующими.
- source_word: οὓς μὲν
  choice: к сомневающимся
  rationale: Оборот вводит первую из нескольких групп. Частица μέν указывает на последующее сопоставление, которое в естественном русском не требует буквального выражения «с одной стороны».
- source_word: ἐλεᾶτε
  choice: будьте милостивы
  rationale: Глагол означает проявлять милость или сострадание. Эта формулировка естественно передаёт повелительное значение и сохраняет этическую силу призыва.
- source_word: διακρινομένους
  choice: сомневающимся
  rationale: Причастие может обозначать сомневающихся, колеблющихся или спорящих. В данном пастырском контексте «сомневающимся» наиболее естественно обозначает людей, поколебленных ложным учением; подлинная неоднозначность отмечена в сноске.
theological_decisions:
- issue: Значение διακρινομένους в наставлении о том, как относиться к людям, оказавшимся в духовной опасности
  choice: сомневающимся
  alternative: колеблющимся; возможно, спорящим
  rationale: Повеление проявлять милость хорошо согласуется с пониманием этой группы как людей, пребывающих в духовной неуверенности, а не обязательно как враждебных противников. Вместе с тем греческое слово допускает другие оттенки, поэтому они сохранены в сноске без догматического разрешения неоднозначности.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Управление «к ... будьте милостивы» выбрано как естественное русское соответствие греческой конструкции. Маркер сноски помещён непосредственно после текста стиха.
