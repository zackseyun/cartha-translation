source:
  edition: SBLGNT
  text: Ὑμεῖς δέ, ἀγαπητοί, μνήσθητε τῶν ῥημάτων τῶν προειρημένων ὑπὸ τῶν ἀποστόλων τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/017.yaml
  text: But you[a], beloved, remember the words spoken beforehand by the apostles of our Lord Jesus the Messiah.
translation:
  language: ru
  text: Вы же, возлюбленные, вспомните слова, сказанные ранее апостолами нашего Господа Иисуса, Мессии[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисуса Христа».'
    reason: Традиционная русская передача греческого титула Χριστός.
lexical_decisions:
- source_word: Ὑμεῖς δέ
  choice: Вы же
  rationale: Местоимение передаёт подчёркнутое обращение к читателям, а частица «же» естественно выражает контраст с ранее описанными людьми.
- source_word: ἀγαπητοί
  choice: возлюбленные
  rationale: Сохраняет теплоту обращения и возвышенный, но понятный эпистолярный стиль.
- source_word: μνήσθητε
  choice: помните
  rationale: Прямое и естественное повеление вспомнить и удерживать в памяти ранее полученное наставление.
- source_word: τῶν ῥημάτων
  choice: слова
  rationale: Передаёт речь или высказывания без ненужного сужения смысла.
- source_word: τῶν προειρημένων
  choice: прежде сказанные
  rationale: Сохраняет временное значение — эти слова были сказаны ранее — и не сводит выражение исключительно к пророческому предсказанию.
- source_word: ὑπὸ τῶν ἀποστόλων
  choice: апостолами
  rationale: Устоявшийся русский эквивалент; творительный падеж естественно передаёт деятеля при страдательном обороте.
- source_word: τοῦ κυρίου ἡμῶν
  choice: нашего Господа
  rationale: Естественно передаёт принадлежность апостолов Господу и сохраняет традиционный христологический титул.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός передан по значению как титул «Мессия», а не как фамилия или непрозрачная часть имени.
theological_decisions:
- issue: Передача Χριστοῦ в сочетании Ἰησοῦ Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: Греческое Χριστός означает помазанника, Мессию, и здесь сохраняет титульное значение. Традиционный русский вариант «Христа» дан в сноске, чтобы не скрывать принятую церковную форму.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной новозаветной лексикой. Конструкция «Вы же» сохраняет контраст, а «прежде сказанные» — временной смысл без чрезмерного акцента на предсказании.
