source:
  edition: SBLGNT
  text: ἀγγέλους τε τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν ἀλλὰ ἀπολιπόντας τὸ ἴδιον οἰκητήριον εἰς κρίσιν μεγάλης ἡμέρας δεσμοῖς ἀϊδίοις ὑπὸ ζόφον τετήρηκεν·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/006.yaml
  text: And the angels who did not keep their own domain[a], but abandoned their proper dwelling[c][b], he has kept in eternal chains under gloom for the judgment of the great day.
translation:
  language: ru
  text: И ангелов, которые не сохранили своего положения[a], но покинули собственное жилище[b], Он сохранил в вечных узах под мраком[c] для суда великого дня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своей власти»; возможны также значения «своей сферы» или «своего места».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «собственное место обитания».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «под мраком»; греческое слово обозначает глубокую, зловещую тьму.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλους
  choice: ангелов
  rationale: В контексте Божьего суда речь естественнее всего идёт о сверхъестественных существах, а не о человеческих посланниках.
- source_word: τηρήσαντας / τετήρηκεν
  choice: не сохранили / сохранил
  rationale: 'Повтор одного русского глагола передаёт намеренный контраст оригинала: ангелы не сохранили своего положения, а Бог сохранил их для суда.'
- source_word: τὴν ἑαυτῶν ἀρχὴν
  choice: своего положения
  rationale: ἀρχή может обозначать власть, положение или сферу полномочий. «Положение» сохраняет широту выражения и не сводит его ни к правлению, ни к временному началу.
- source_word: ἀπολιπόντας
  choice: покинули
  rationale: Глагол передаёт сознательное оставление и хорошо соответствует судебному контексту.
- source_word: τὸ ἴδιον οἰκητήριον
  choice: собственное жилище
  rationale: οἰκητήριον означает место обитания, а ἴδιον — своё, собственное. Перевод не уточняет природу этого жилища сверх сказанного в тексте.
- source_word: εἰς κρίσιν μεγάλης ἡμέρας
  choice: для суда великого дня
  rationale: Формулировка сохраняет целевую направленность εἰς и генитивную конструкцию, не подменяя её более толковательным «до суда».
- source_word: δεσμοῖς ἀϊδίοις
  choice: в вечных узах
  rationale: «Узы» естественно передают δεσμοί в возвышенном судебном контексте, а «вечные» ясно выражает ἀΐδιος.
- source_word: ὑπὸ ζόφον
  choice: во мраке
  rationale: ζόφος обозначает глубокий, зловещий мрак. Русское «во мраке» естественно передаёт образ заключения, хотя буквально предлог ὑπό означает «под».
- source_word: τε
  choice: И
  rationale: Союз связывает этот пример суда с предыдущим и естественно передаётся русским «И».
theological_decisions:
- issue: Характер проступка ангелов
  choice: Сказано лишь, что ангелы не сохранили своего положения и покинули собственное жилище.
  alternative: Прямо отождествить событие с преданием о Бытии 6 или с общим первоначальным падением ангелов.
  rationale: Иуда, вероятно, отсылает к известному читателям преданию, однако сам греческий текст не раскрывает его подробно; перевод не должен вносить конкретную реконструкцию в основной текст.
- issue: Значение ἀΐδιος
  choice: вечные
  alternative: непреходящие; навеки наложенные
  rationale: «Вечные» — ясный и традиционно понятный эквивалент длительной, непрекращающейся силы уз, без дальнейших метафизических уточнений.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис сохраняет единое предложение оригинала. Заглавное «Он» ясно указывает на Бога по контексту, не добавляя имени в текст. Повтор «сохранили / сохранил» намеренно оставлен ради словесного контраста греческого текста.
