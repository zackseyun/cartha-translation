id: JUD.1.7
reference: Jude 1:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὡς Σόδομα καὶ Γόμορρα καὶ αἱ περὶ αὐτὰς πόλεις, τὸν ὅμοιον ⸂τρόπον τούτοις⸃ ἐκπορνεύσασαι καὶ ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας, πρόκεινται δεῖγμα πυρὸς αἰωνίου δίκην ὑπέχουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/007.yaml
  text: just as Sodom and Gomorrah and the cities around them[a], having in like manner committed sexual immorality and gone after other flesh, are set forth as an example[b], undergoing the punishment of eternal fire.
translation:
  language: ru
  text: Так и Содом, и Гоморра, и окрестные города, подобно им предавшиеся половой распущенности и устремившиеся за иной плотью[b], служат примером[a], неся наказание вечного огня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «подобным образом, как и эти». Слово «им» может относиться к ангелам, упомянутым в предыдущем стихе, или шире — к предшествующим примерам мятежа и суда.'
    reason: alternative_reading
  - marker: b
    text: 'Возможно также: «чужой плотью» или «плотью иного рода»; традиционно — «чужою плотью». Буквальная формулировка не сводит выражение к одному определённому толкованию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Так и
  rationale: Передаёт сравнительную связь с предшествующими примерами естественным для русского языка оборотом.
- source_word: Σόδομα καὶ Γόμορρα
  choice: Содом и Гоморра
  rationale: Устоявшиеся русские формы библейских географических названий.
- source_word: αἱ περὶ αὐτὰς πόλεις
  choice: окрестные города
  rationale: Кратко и естественно передаёт города, расположенные вокруг Содома и Гоморры.
- source_word: τὸν ὅμοιον τρόπον τούτοις
  choice: подобно им
  rationale: Сохраняет явно выраженное в греческом тексте сравнение и местоимение, не определяя в основном тексте его спорный антецедент.
- source_word: ἐκπορνεύσασαι
  choice: предались половой распущенности
  rationale: Передаёт сильное обозначение сексуальной безнравственности без эвфемизма и без неоправданного сужения до одного конкретного поступка.
- source_word: ἀπελθοῦσαι ὀπίσω
  choice: устремились за
  rationale: Передаёт идиому преследования или стремления к чему-либо и сохраняет образ направленного движения.
- source_word: σαρκὸς ἑτέρας
  choice: иной плотью
  rationale: Буквально сохраняет слова σάρξ и ἕτερος, не навязывая одну из спорных интерпретаций выражения.
- source_word: πρόκεινται
  choice: выставлены
  rationale: Передаёт смысл публичного предъявления или представления в качестве назидательного примера.
- source_word: δεῖγμα
  choice: пример
  rationale: Прямой русский эквивалент; предостерегающий характер примера ясен из упоминания наказания.
- source_word: πυρὸς αἰωνίου
  choice: вечным огнём
  rationale: Сохраняет определение αἰώνιος и естественно связывает огонь со способом наказания в русском предложении.
- source_word: δίκην ὑπέχουσαι
  choice: терпят наказание
  rationale: Естественно передаёт судебную идиому «нести, претерпевать наказание» и её продолжающееся обстоятельственное значение.
theological_decisions:
- issue: К кому относится τούτοις («им»)
  choice: Сохранить местоименное сравнение «подобно им» и пояснить неопределённость в сноске.
  alternative: Отнести «им» непосредственно к ангелам из стиха 6 либо в общем смысле к предшествующим примерам мятежа и суда.
  rationale: Греческий текст выражает сравнение, но антецедент местоимения допускает разные толкования; перевод не должен молча устранять эту неоднозначность.
- issue: Значение σαρκὸς ἑτέρας
  choice: 'Перевести буквально: «иной плотью».'
  alternative: «чужой плотью»; конкретизация как однополых отношений; конкретизация как нарушения границы между ангельским и человеческим.
  rationale: Само выражение не уточняет природу «иной плоти», поэтому буквальный перевод сохраняет богословское напряжение и не вносит более узкого толкования.
- issue: Сила выражения πυρὸς αἰωνίου
  choice: Сохранить формулировку «вечным огнём».
  alternative: «неугасимым огнём» или развёрнутое догматическое пояснение характера наказания.
  rationale: Перевод прямо передаёт αἰώνιος, не смягчая его и не расширяя стих до систематического богословского утверждения.
translation_notes:
  register: Современный литературный русский язык с dignified библейской интонацией. Синтаксис упрощён двоеточием перед заключительным описанием наказания; спорные местоименная связь и значение «иной плоти» сохранены, а не разрешены в основном тексте.
