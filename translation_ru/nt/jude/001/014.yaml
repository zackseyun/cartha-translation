source:
  edition: SBLGNT
  text: Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ λέγων· Ἰδοὺ ἦλθεν κύριος ἐν ἁγίαις μυριάσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/014.yaml
  text: And Enoch[a], the seventh from Adam, also prophesied to these, saying, “Behold[c][b], the Lord came with his holy myriads,”
translation:
  language: ru
  text: 'О них пророчествовал и Енох[a], седьмой от Адама, говоря: «Вот[c], пришёл Господь с мириадами святых Своих[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «им» или «против них». Греческое τούτοις может указывать на тех, к кому обращено пророчество, либо на тех, о ком или против кого оно произнесено; в контексте имеются в виду ранее описанные нечестивцы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с десятками тысяч святых Своих». Слово μυριάσιν может обозначать мириады, то есть десятки тысяч, и выражает образ огромного святого воинства.'
    reason: lexical_alternative
  - marker: c
    text: Эти слова перекликаются с 1 Еноха 1:9.
    reason: cross_reference
lexical_decisions:
- source_word: Προεφήτευσεν
  choice: пророчествовал
  rationale: Передаёт пророческое речевое действие, не сужая смысл до одного лишь предсказания.
- source_word: δὲ καὶ
  choice: и
  rationale: Частицы продолжают рассуждение и вводят Еноха как дополнительного свидетеля; в русском естественно выразить это союзом «и» при актуальном членении «О них… и Енох».
- source_word: τούτοις
  choice: о них
  rationale: 'Дательный падеж при προφητεύω допускает значение отнесённости: пророчество касается упомянутых нечестивцев. Формулировка не добавляет отсутствующего в греческом слова «люди» и сохраняет возможные варианты в примечании.'
- source_word: ἕβδομος ἀπὸ Ἀδὰμ
  choice: седьмой от Адама
  rationale: Прямо сохраняет генеалогическое обозначение исходного текста.
- source_word: Ἑνὼχ
  choice: Енох
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: λέγων
  choice: говоря
  rationale: Кратко и формально точно передаёт причастие, вводящее цитату.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Сохраняет торжественное указательное значение междометия, оставаясь естественным для современного литературного русского.
- source_word: ἦλθεν
  choice: пришёл
  rationale: Передаёт аорист как прошедшее действие и не подменяет форму истолкованием её как будущего пророческого события.
- source_word: κύριος
  choice: Господь
  rationale: Устоявшаяся передача титула κύριος; не уточняет личность обозначенного им Господа сверх сказанного в тексте.
- source_word: ἐν ἁγίαις μυριάσιν αὐτοῦ
  choice: с мириадами святых Своих
  rationale: Предлог передан в значении сопровождения; «мириады» сохраняет образ несметного множества, а субстантивированное «святых» не добавляет слова «ангелы», которого в греческом нет.
theological_decisions:
- issue: Кого обозначает титул «Господь» в цитате
  choice: Оставить «Господь», не уточняя референта.
  alternative: Понять как Бога в контексте источника либо как христологическое отнесение к Иисусу в послании Иуды.
  rationale: Греческий текст содержит только κύριος; перевод сохраняет возможное богословское напряжение и не разрешает неоднозначность за автора.
- issue: Статус цитаты, перекликающейся с 1 Еноха 1:9
  choice: Передать её как пророчество Еноха без оценки канонического статуса произведения.
  alternative: Явно назвать её цитатой из 1 Еноха либо лишь традиционным изречением, приписанным Еноху.
  rationale: Иуда представляет эти слова как пророчество Еноха; основной текст не должен вносить не сформулированное здесь суждение о статусе источника.
- issue: Пророческое прошедшее в ἦλθεν
  choice: 'Сохранить форму прошедшего времени: «пришёл».'
  alternative: Передать истолковательно как «идёт» или «придёт».
  rationale: Хотя аорист в пророческой речи может описывать будущее событие как совершившееся, перевод сохраняет грамматическую форму и присущее ей напряжение.
translation_notes:
  register: Современный литературный русский с торжественным пророческим оттенком. Порядок «О них пророчествовал и Енох» естественно передаёт отнесённость τούτοις и добавочную силу καί. Архаизирующее «се» заменено понятным «вот»; «мириады» сохранено как точный и dignified образ огромного множества.
