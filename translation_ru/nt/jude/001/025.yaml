source:
  edition: SBLGNT
  text: ⸀μόνῳ θεῷ σωτῆρι ἡμῶν ⸂διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν⸃ ⸀δόξα μεγαλωσύνη κράτος καὶ ἐξουσία ⸂πρὸ παντὸς τοῦ αἰῶνος⸃ καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/025.yaml
  text: to the only God our Savior[a], through Jesus the Messiah our Lord, be glory, majesty, dominion, and authority, before all time and now and forever[b]. Amen.
translation:
  language: ru
  text: Единому Богу, нашему Спасителю, через Иисуса, Мессию, нашего Господа, — слава, величие, могущество и власть прежде всех веков, ныне и во все века[a]. Аминь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «прежде всякого века… и во все века».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνῳ θεῷ σωτῆρι ἡμῶν
  choice: Единому Богу, нашему Спасителю
  rationale: Дательный падеж выражает адресата славословия; «единому» естественно и торжественно передаёт исключительность μόνος, а «Спасителю» — обычное богословское значение σωτήρ.
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: через Иисуса Мессию, нашего Господа
  rationale: διά с родительным передаёт посредство. «Мессия» раскрывает титульное значение Χριστός; приложение «нашего Господа» сохранено без устранения синтаксической связи.
- source_word: δόξα μεγαλωσύνη κράτος καὶ ἐξουσία
  choice: слава, величие, могущество и власть
  rationale: «Величие» передаёт μεγαλωσύνη в возвышенном, но современном регистре; «могущество» для κράτος отличает проявленную силу от ἐξουσία — законной власти.
- source_word: πρὸ παντὸς τοῦ αἰῶνος
  choice: прежде всех веков
  rationale: Передаёт буквальный образ αἰών и его смысл — существование до всякого века или времени, не сужая выражение до одной трактовки.
- source_word: καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας
  choice: ныне и во все века
  rationale: Сохраняет временную трёхчастность славословия и повторяющийся образ веков; по-русски звучит естественно и торжественно.
theological_decisions:
- issue: Посредническая фраза в славословии
  choice: Славословие обращено к единому Богу Спасителю и возносится через Иисуса Мессию, нашего Господа.
  alternative: Связать оборот «через Иисуса Мессию» с более широким контекстом, не уточняя, к какому именно элементу славословия он относится.
  rationale: Ближайший синтаксический смысл указывает на посредство Иисуса в вознесении славы Богу, сохраняя различение лиц и не добавляя дальнейших догматических уточнений.
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Здесь слово сохраняет титульный смысл «Помазанник»; «Мессия» делает этот смысл явным, тогда как «Христос» в современном русском часто воспринимается как часть имени.
translation_notes:
  register: Современный литературный русский с возвышенным регистром славословия. Синтаксис сделан ясным без сглаживания посреднической конструкции и временного образа «веков».
