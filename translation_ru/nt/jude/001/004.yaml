id: JUD.1.4
reference: Jude 1:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: παρεισέδυσαν γάρ τινες ἄνθρωποι, οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα, ἀσεβεῖς, τὴν τοῦ θεοῦ ἡμῶν χάριτα μετατιθέντες εἰς ἀσέλγειαν καὶ τὸν μόνον ⸀δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστὸν ἀρνούμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/004.yaml
  text: For certain men have slipped in unnoticed[a], who long ago were designated for this judgment, ungodly men who turn the grace of our God into sensuality and deny our only Master and Lord[d][c][b], Jesus the Messiah.
translation:
  language: ru
  text: Ибо некоторые люди незаметно проникли — нечестивцы, издавна отмеченные для этого суда[b], обращающие благодать нашего Бога в распутство[c] и отрекающиеся от единственного Владыки и Господа нашего — Иисуса, Мессии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «о которых издавна было заранее написано в связи с этим судом». Греческое слово допускает смысл как предварительного обозначения, так и более буквального предварительного упоминания в Писании.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «разнузданность», «бесстыдство».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεισέδυσαν
  choice: незаметно проникли
  rationale: Передаёт скрытное проникновение и естественно звучит по-русски; результат их прихода значим для настоящей ситуации.
- source_word: πάλαι προγεγραμμένοι
  choice: издавна предназначенные
  rationale: Передаёт давность и предварительную определённость, не усиливая формулировку до прямого утверждения о предопределении; буквальная возможность «заранее написано» сохранена в сноске.
- source_word: κρίμα
  choice: суд
  rationale: Сохраняет широкий судебный смысл, не сужая его до одного лишь приговора или осуждения.
- source_word: ἀσεβεῖς
  choice: нечестивцы
  rationale: Краткое субстантивированное обозначение людей, непочтительных к Богу, связанное с предшествующим ἄνθρωποι.
- source_word: χάριτα
  choice: благодать
  rationale: Устоявшийся и точный русский термин для Божьего благого дара и благоволения в данном контексте.
- source_word: μετατιθέντες
  choice: обращающие ... в
  rationale: Передаёт изменение одного в другое без добавления более интерпретирующего «извращающие».
- source_word: ἀσέλγειαν
  choice: распутство
  rationale: Передаёт бесстыдную нравственную разнузданность, нередко сексуального характера, и понятно современному читателю.
- source_word: μόνον δεσπότην καὶ κύριον
  choice: единственного Владыки и Господа
  rationale: Сохраняет оба различных титула и их общий референт, не сводя их в одно обозначение.
- source_word: Ἰησοῦν Χριστόν
  choice: Иисуса Мессии
  rationale: Χριστός передано как титул «Мессия»; русская конструкция после приложения естественно оформлена родительным падежом.
- source_word: ἀρνούμενοι
  choice: отрекающиеся
  rationale: Выражает не просто словесное отрицание, а отказ признавать власть и принадлежность, что соответствует контексту.
theological_decisions:
- issue: Смысл προγεγραμμένοι εἰς τοῦτο τὸ κρίμα
  choice: «издавна предназначенные для этого суда» с примечанием о буквальном значении «заранее написано»
  alternative: «о которых издавна было заранее написано в связи с этим судом»; «предопределённые к этому осуждению»
  rationale: Основной текст сохраняет предварительный и судебный смысл, но не формулирует более сильного учения об индивидуальном предопределении, чем требует греческий текст; лексическая неоднозначность вынесена в сноску.
- issue: Референт выражения μόνον δεσπότην καὶ κύριον
  choice: Оба титула относятся к Иисусу Мессии
  alternative: «Владыка» относится к Богу Отцу, а «Господь» — к Иисусу Мессии
  rationale: Синтаксически наиболее естественно понимать единый ряд титулов перед одним именем как относящийся к Иисусу Мессии, при этом оба греческих существительных сохранены.
translation_notes:
  register: Современный литературный русский язык с достоинством новозаветного обличительного стиля. Синтаксис сохраняет длинную причинную конструкцию оригинала, но тире перед приложением делает референт двух титулов ясным. «К вам» добавлено для естественности, однако в греческом тексте прямого дополнения нет; при максимально формальном подходе возможно просто «незаметно проникли».
