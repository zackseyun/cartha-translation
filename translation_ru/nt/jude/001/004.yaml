revisions:
- from: Ибо к вам незаметно проникли некоторые люди[a], издавна предназначенные для этого суда[b], нечестивцы, обращающие благодать нашего Бога в распутство[c] и отрекающиеся от единственного Владыки и Господа нашего — Иисуса Мессии.
  to: Ибо некоторые люди незаметно проникли — нечестивцы, издавна отмеченные для этого суда[b], обращающие благодать нашего Бога в распутство[c] и отрекающиеся от единственного Владыки и Господа нашего — Иисуса, Мессии.
