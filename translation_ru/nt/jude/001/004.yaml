  - severity: medium
    issue: «Предназначенные» чрезмерно конкретизирует спорное προγεγραμμένοι.
    rationale: Слово может означать предварительное письменное упоминание/обозначение; «предназначенные» легче воспринимается как прямое индивидуальное предопределение. Более нейтральное «отмеченные» лучше сохраняет неоднозначность.
