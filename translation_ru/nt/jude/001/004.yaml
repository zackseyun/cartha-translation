  naturalness: После устранения «к вам» порядок слов «некоторые люди незаметно проникли» остаётся естественным. Обособление «— нечестивцы» ясно передаёт пояснительную характеристику и сохраняет обличительный регистр. «Иисуса, Мессии» — нормативное и понятное приложение.
  terminology: «Благодать», «распутство», «Владыка» и «Господь» удачно передают ключевые термины. «Мессия» сохраняет титульный характер Χριστός. «Издавна отмеченные» передаёт предварительный характер προγεγραμμένοι более нейтрально, а сноска сохраняет возможность понимания как предварительного письменного упоминания.
