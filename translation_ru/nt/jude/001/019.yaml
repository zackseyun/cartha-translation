    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοί
  choice: Это те
  rationale: Указательное местоимение отсылает к ранее описанным людям; оборот «это те» сохраняет указательную силу и естественно вводит последующие характеристики.
- source_word: οἱ ἀποδιορίζοντες
  choice: кто производит разделения
  rationale: Субстантивированное причастие характеризует этих людей по их разделяющей деятельности. Формулировка сохраняет вероятный активный смысл, не исключая отмеченного в сноске значения самообособления.
- source_word: ψυχικοί
  choice: душевные
  rationale: Слово обозначает людей, живущих лишь природной, человеческой жизнью, в противопоставлении Духу. «Душевные» сохраняет терминологическую связь с ψυχή и богословское напряжение текста; более разъясняющие варианты даны в сноске.
- source_word: πνεῦμα
  choice: Духа
  rationale: Непосредственное противопоставление ψυχικοί указывает прежде всего на Святого Духа. Прописная буква выражает это контекстуальное решение, а лексически возможное «духа» сохранено в сноске.
- source_word: μὴ ἔχοντες
  choice: не имеющие
  rationale: Причастный оборот близко передаёт греческую конструкцию и связывает отсутствие Духа с предыдущей характеристикой.
theological_decisions:
- issue: Кого обозначает πνεῦμα
  choice: Святого Духа — «Духа»
  alternative: человеческий дух — «духа»
  rationale: Контраст между ψυχικοί и отсутствием πνεῦμα наиболее естественно понимается как противопоставление природной жизни и Святого Духа. Поскольку существительное само по себе допускает более широкое значение, альтернатива отмечена в сноске.
- issue: Характер смысла ψυχικοί
  choice: «душевные» как люди, ограниченные природной жизнью
  alternative: «бездуховные» или «живущие лишь природными побуждениями»
  rationale: Буквально-терминологическое «душевные» сохраняет связь с исходным словом и не сводит характеристику к простой мирскости или безнравственности; смысл поясняется сноской.
translation_notes:
  register: Современный литературный и сдержанно возвышенный регистр. Сохранена краткая трёхчастная структура греческого стиха. Термин «душевные» несколько непривычен в повседневной речи, но здесь он точнее сохраняет исходное противопоставление; его смысл раскрыт в сноске.
