  yaml_path: translation/nt/jude/001/019.yaml
  text: These are the ones who cause divisions[a], worldly people[c][b], not having the Spirit.
translation:
  language: ru
  text: Это люди, вносящие разделения[a], живущие лишь природной жизнью[b] и не имеющие Духа[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отделяющиеся» или «отделяющие себя».'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «душевные»; возможно также: «бездуховные». Речь о людях, живущих лишь природной, человеческой жизнью.'
    reason: lexical_alternative
  - marker: c
