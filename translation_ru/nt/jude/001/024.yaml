  text: Τῷ δὲ δυναμένῳ φυλάξαι ⸀ὑμᾶς ἀπταίστους καὶ στῆσαι κατενώπιον τῆς δόξης αὐτοῦ ἀμώμους ἐν ἀγαλλιάσει
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/024.yaml
  text: To the one who is able to keep you from stumbling and to present you blameless before his glory with rejoicing[c][b][a],
translation:
  language: ru
  text: Тому, Кто может не дать вам оступиться[a] и представить вас непорочными[c] перед Своей славой[b] с ликованием,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уберечь вас от падения». Греческое ἀπταίστους обозначает тех, кто не спотыкается и не падает.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «перед Его славой»; иногда это выражение передают как «в Его славном присутствии».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «безупречными»; греческое ἀμώμους может также означать «без изъяна».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ δὲ δυναμένῳ
  choice: Тому же, Кто может
  rationale: Дательный оборот открывает славословие, продолжающееся в следующем стихе. Частица δέ передана мягким связующим «же», без добавления временного «ныне».
- source_word: φυλάξαι ὑμᾶς ἀπταίστους
  choice: не дать вам оступиться
  rationale: Так по-русски естественно передаётся мысль о сохранении человека не оступившимся; сохраняется образ спотыкания и не сужается смысл до окончательного отпадения.
- source_word: καὶ στῆσαι
  choice: и поставить вас
  rationale: Передаёт каузативный смысл «поставить, сделать стоящими» и уместно звучит в контексте предстояния перед Божьей славой.
- source_word: κατενώπιον τῆς δόξης αὐτοῦ
  choice: перед Своей славой
  rationale: «Перед» естественно передаёт κατενώπιον, а существительное «слава» сохраняется без поясняющего добавления «присутствием».
- source_word: ἀμώμους
  choice: непорочными
  rationale: Слово передаёт как нравственную безупречность, так и оттенок отсутствия изъяна; «непорочными» сохраняет возвышенный, но понятный регистр.
- source_word: ἐν ἀγαλλιάσει
  choice: с ликованием
  rationale: Передаёт сильную, торжествующую радость без отсутствующего в греческом тексте прилагательного «великим».
theological_decisions:
- issue: 'Значение ἀπταίστους: сохранение от оступания или от окончательного падения'
  choice: не дать вам оступиться
  alternative: уберечь вас от падения
  rationale: Основной текст сохраняет метафору спотыкания и не решает за читателя, относится ли выражение к отдельным согрешениям или к окончательному отпадению.
- issue: Передача τῆς δόξης αὐτοῦ
  choice: перед Своей славой
  alternative: в Своём славном присутствии
  rationale: Греческий текст прямо говорит о «славе», а не использует отдельное слово «присутствие»; буквальный образ сохраняет богословскую ёмкость выражения.
- issue: Оттенок ἀμώμους
  choice: непорочными
  alternative: безупречными; без изъяна
  rationale: Выбранное слово допускает одновременно нравственный и жертвенно-культовый оттенки, не сводя выражение только к юридической невиновности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным строем славословия. Конструкция оставлена незавершённой запятой, поскольку синтаксически стих продолжается в Иуд. 1:25. Заглавные буквы в «Кто» и «Своей» следуют принятому русскому благоговейному оформлению местоименных указаний на Бога.
