source:
  edition: SBLGNT
  text: ⸀Πάτερ δίκαιε, καὶ ὁ κόσμος σε οὐκ ἔγνω, ἐγὼ δέ σε ἔγνων, καὶ οὗτοι ἔγνωσαν ὅτι σύ με ἀπέστειλας,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/025.yaml
  text: Righteous Father[a], though the world has not known you, I have known you[b], and these have known that you sent me.
translation:
  language: ru
  text: Праведный Отец! Хотя мир[a] Тебя не познал, Я познал Тебя[b], и они познали, что Ты послал Меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Мир» у Иоанна нередко означает человечество в его отчуждении от Бога, хотя смысл слова этим не исчерпывается.
    reason: cross_reference
  - marker: b
    text: 'Или, ближе к соединительной форме греческого текста: «И мир Тебя не познал, но Я познал Тебя, и они познали, что Ты послал Меня». Все три формы глагола «познавать» в греческом стоят в аористе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάτερ δίκαιε
  choice: Праведный Отец
  rationale: Звательная форма передана естественным для современного русского языка обращением. «Праведный» сохраняет нравственно-богословскую широту δίκαιος и не сужает смысл до одной лишь беспристрастной справедливости.
- source_word: καὶ ὁ κόσμος σε οὐκ ἔγνω
  choice: Хотя мир Тебя не познал
  rationale: Первое καὶ в данном противопоставлении естественно понимать уступительно. «Хотя» ясно выражает связь между неведением мира и знанием Иисуса; буквальное «и» возможно и отмечено в сноске.
- source_word: ὁ κόσμος
  choice: мир
  rationale: Сохранён ёмкий и характерный для Иоанна термин, который может обозначать человечество в его отчуждении от Бога, но не сводится в основном тексте к одному толкованию.
- source_word: ἔγνω / ἔγνων / ἔγνωσαν
  choice: не познал / познал / познали
  rationale: Русский совершенный вид естественно передаёт греческие аористы и допускает как событие узнавания, так и достигнутое личное знание. «Знать» здесь было бы менее точно аспектуально.
- source_word: ἐγὼ δέ
  choice: Я
  rationale: Противопоставление, выраженное δέ, уже ясно обозначено уступительным «хотя»; дополнительное «но» в русском предложении не требуется.
- source_word: οὗτοι
  choice: они
  rationale: В контексте указательное местоимение относится к присутствующим ученикам. Русское «они» звучит естественнее буквального «эти», не добавляя поясняющего существительного.
- source_word: σύ με ἀπέστειλας
  choice: Ты послал Меня
  rationale: Прямо и естественно передаёт аорист ἀποστέλλω и сохраняет акцент на Отце как пославшем Иисуса.
theological_decisions:
- issue: Смысл определения δίκαιε по отношению к Отцу
  choice: Праведный Отец
  alternative: Справедливый Отец
  rationale: «Праведный» сохраняет широкий смысл соответствия Божьей истине и нравственной правоты; «справедливый» могло бы чрезмерно сузить его до судебной беспристрастности.
- issue: Значение κόσμος у Иоанна
  choice: мир
  alternative: люди этого мира
  rationale: 'Основной текст сохраняет многослойность слова: оно обозначает не просто творение и не только отдельных людей, а в данном контексте также человечество в отчуждении от Бога.'
- issue: Видо-временная передача аористов γινώσκω
  choice: 'совершенный вид: «не познал / познал / познали»'
  alternative: 'несовершенный вид: «не знал / знал / знали»'
  rationale: Совершенный вид соответствует аористным формам и передаёт достигнутое знание, не превращая его лишь в отвлечённое постоянное состояние.
- issue: Логическое значение первого καὶ
  choice: уступительное «хотя»
  alternative: соединительное «и»
  rationale: Контекст подчёркивает контраст между миром, который не познал Отца, и Иисусом, который Его познал. Однако соединительное прочтение грамматически возможно и сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с молитвенно-торжественным, но не архаичным звучанием. В обращении поставлен восклицательный знак для естественного отделения вокатива. Местоимения, относящиеся к Отцу и Сыну, написаны с прописной буквы согласно устойчивой русской библейской традиции.
