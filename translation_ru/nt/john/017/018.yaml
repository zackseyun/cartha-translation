  text: καθὼς ἐμὲ ἀπέστειλας εἰς τὸν κόσμον, κἀγὼ ἀπέστειλα αὐτοὺς εἰς τὸν κόσμον·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/018.yaml
  text: Just as you sent me into the world, I also sent them into the world.
translation:
  language: ru
  text: Как Ты послал Меня в мир, так и Я послал их в мир.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: Как … так и
  rationale: Союзная конструкция естественно передаёт сопоставление двух посланий и сохраняет ясный параллелизм греческой фразы.
- source_word: ἐμὲ
  choice: Меня
  rationale: Прямое дополнение при «послал»; прописная буква соответствует принятому в русском библейском стиле обозначению Христа.
- source_word: ἀπέστειλας / ἀπέστειλα
  choice: послал / послал
  rationale: Одинаковый глагол в обеих частях сохраняет намеренный лексический параллелизм и не добавляет более узкого значения «поручил» или «уполномочил».
- source_word: εἰς τὸν κόσμον
  choice: в мир
  rationale: Предлог «в» естественно передаёт направленность εἰς, а «мир» сохраняет широкий и богословски насыщенный смысл κόσμος у Иоанна без его преждевременного уточнения.
- source_word: κἀγὼ
  choice: так и Я
  rationale: В коррелятивной конструкции «как … так и» ясно выражает добавочное καί и подчёркивает соответствие между действиями Отца и Иисуса.
- source_word: αὐτοὺς
  choice: их
  rationale: Местоимение естественно отсылает к ученикам, названным в контексте.
theological_decisions:
- issue: Соотношение послания Сына Отцом и послания учеников Сыном
  choice: Сохранить параллель «послал … послал»
  alternative: Различить действия как «послал … поручил служение»
  rationale: Текст проводит аналогию между двумя посланиями, не утверждая тождества статуса или миссии. Повтор одного глагола сохраняет напряжение исходного текста и не вносит дополнительного толкования.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. Корреляция «Как … так и» звучит естественно и воспроизводит структуру и риторический параллелизм оригинала.
