  text: αὕτη δέ ἐστιν ἡ αἰώνιος ζωὴ ἵνα γινώσκωσι σὲ τὸν μόνον ἀληθινὸν θεὸν καὶ ὃν ἀπέστειλας Ἰησοῦν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/003.yaml
  text: 'And this is eternal life: that they may know you[a], the only true God, and Jesus the Messiah whom you sent.'
translation:
  language: ru
  text: 'И вот что такое вечная жизнь: чтобы они знали Тебя, единственного истинного Бога, и Иисуса Мессию[a], Которого Ты послал.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по традиции: «Иисуса Христа». Греческое Χριστός может употребляться как титул («Мессия»), а в некоторых контекстах — почти как часть имени («Христос»).'
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη δέ ἐστιν
  choice: Вечная же жизнь — в том
  rationale: Частица δέ передана словом «же», а указательно-связочная конструкция естественно выражена по-русски оборотом «— в том», вводящим последующее определение вечной жизни.
- source_word: ἡ αἰώνιος ζωὴ
  choice: вечная жизнь
  rationale: Устоявшееся и точное русское выражение для жизни грядущего века, имеющей непреходящий характер.
- source_word: ἵνα γινώσκωσι
  choice: чтобы они знали
  rationale: Союз «чтобы» сохраняет определяющую конструкцию с ἵνα и множественное число глагола; «знали» передаёт не только получение сведений, но и продолжающееся личное знание.
- source_word: σὲ
  choice: Тебя
  rationale: Прямое дополнение, относящееся к Отцу, к Которому обращена молитва Иисуса. Прописная буква соответствует принятому почтительному библейскому регистру русского текста.
- source_word: τὸν μόνον ἀληθινὸν θεὸν
  choice: единственного истинного Бога
  rationale: Сохраняет прямое значение μόνον и ἀληθινόν без ослабления или богословского расширения формулировки.
- source_word: καὶ
  choice: и
  rationale: Простое сочинение сохранено без добавочных толкований отношений между Отцом и Иисусом.
- source_word: ὃν ἀπέστειλας
  choice: Которого Ты послал
  rationale: Относительное придаточное естественно помещено после имени в русском языке; аорист передан простым прошедшим временем.
- source_word: Ἰησοῦν Χριστόν
  choice: Иисуса Мессию
  rationale: Χριστός сохранено как значимый титул «Мессия», тогда как сочетание двух форм винительного падежа точно отражает их синтаксическую связь.
theological_decisions:
- issue: Обращение к Отцу как к «единственному истинному Богу» и отличие от Него посланного Иисуса
  choice: Сохранить прямую формулировку и синтаксическое различение Отца и Иисуса.
  alternative: Добавить пояснение, явно согласующее стих с более поздними тринитарными формулами, либо ослабить выраженное в предложении различие.
  rationale: Сам стих следует переводить без догматических вставок, сохраняя его подлинное богословское напряжение; более широкий христологический контекст раскрывается в других местах Евангелия.
- issue: Значение Χριστόν
  choice: Мессия
  alternative: Христос
  rationale: В данном исповедальном и пояснительном контексте титульное значение слова остаётся различимым; традиционная форма сохранена в сноске как допустимая передача имени-титула.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Порядок придаточного предложения приспособлен к естественному русскому синтаксису; прописные формы «Тебя» и «Ты» поддерживают традиционный почтительный регистр.
