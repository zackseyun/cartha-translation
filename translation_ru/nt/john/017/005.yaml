id: JHN.17.5
reference: John 17:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ νῦν δόξασόν με σύ, πάτερ, παρὰ σεαυτῷ τῇ δόξῃ ᾗ εἶχον πρὸ τοῦ τὸν κόσμον εἶναι παρὰ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/005.yaml
  text: And now[a], Father[b], glorify me in your presence with the glory that I had with you before the world existed.
translation:
  language: ru
  text: И теперь Ты, Отец, прославь Меня у Себя[a] той славой, которую Я имел у Тебя прежде, чем существовал мир[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Твоём присутствии»; греческое выражение может буквально указывать на близость к Отцу или пребывание при Нём.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «прежде, чем мир появился»; греческую конструкцию можно передать и как «до существования мира».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξασόν
  choice: прославь
  rationale: Сохраняет ключевую для Евангелия от Иоанна лексику славы и взаимного прославления Отца и Сына; «почти» было бы уже по смыслу.
- source_word: παρὰ σεαυτῷ
  choice: у Себя
  rationale: παρά с дательным обозначает близость или пребывание при ком-либо. «У Себя» естественно по-русски передаёт как пространственный, так и личностный оттенок выражения.
- source_word: τῇ δόξῃ
  choice: той славой
  rationale: Дательный падеж связан с повелением «прославь» и указывает, какой именно славой следует прославить Сына; указательное «той» естественно вводит последующее определительное придаточное.
- source_word: ᾗ εἶχον
  choice: которую Я имел
  rationale: Имперфект εἶχον указывает на обладание славой в предшествующее время; русское прошедшее время точно и естественно передаёт это значение.
- source_word: πρὸ τοῦ τὸν κόσμον εἶναι
  choice: прежде, чем существовал мир
  rationale: Конструкция с артиклевым инфинитивом выражает предшествование во времени. «Существовал» сохраняет значение εἶναι и ясно указывает на время до существования мира.
- source_word: παρὰ σοί
  choice: у Тебя
  rationale: Повтор παρά с дательным вновь передаёт близость и пребывание при Отце; «у Тебя» кратко, естественно и соотносится с «у Себя».
- source_word: σύ, πάτερ
  choice: Ты, Отец
  rationale: 'Явное местоимение σύ в греческом тексте имеет эмфатический характер. В русском его уместно сохранить: «Ты, Отец».'
- source_word: κόσμον
  choice: мир
  rationale: «Мир» — стандартный и контекстуально точный эквивалент κόσμος, обозначающий здесь сотворённый мир.
theological_decisions:
- issue: Предсуществование Сына
  choice: Временная фраза прямо отнесена к славе, которой Иисус обладал у Отца прежде существования мира.
  alternative: Ослабить высказывание до предопределённой или предназначенной славы.
  rationale: Греческий текст говорит ᾗ εἶχον, «которую Я имел», и помещает это обладание славой до существования мира. Перевод сохраняет утверждение без дополнительного догматического развёртывания.
- issue: Характер славы у Отца
  choice: Сохранено слово «слава» без поясняющей конкретизации.
  alternative: Передать как «величие» или «честь».
  rationale: Сам стих не определяет эту славу точнее. Слово «слава» сохраняет богословскую многозначность и характерную лексику Иоанна.
translation_notes:
  register: Современный литературный русский язык с молитвенно-торжественным, но понятным строем. Местоимения, относящиеся к Отцу и Сыну, написаны с прописной буквы в соответствии с распространённой русской библейской традицией. Порядок «Ты, Отец» намеренно сохраняет эмфазу греческого σύ.
