  text: ἐγὼ περὶ αὐτῶν ἐρωτῶ· οὐ περὶ τοῦ κόσμου ἐρωτῶ ἀλλὰ περὶ ὧν δέδωκάς μοι, ὅτι σοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/009.yaml
  text: I am asking on their behalf[a]. I am not asking on behalf of the world, but on behalf of those whom you have given me[b], because they are yours.
translation:
  language: ru
  text: Я прошу[b] о них[a]. Не о мире прошу, а о тех, кого Ты дал Мне, потому что они — Твои.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за них»; греческий предлог в этом контексте может указывать как на предмет просьбы, так и на тех, ради кого просят.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «молюсь»; греческий глагол буквально означает «прошу» или «обращаюсь с просьбой», хотя здесь речь идёт о молитве к Отцу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: прошу
  rationale: «Прошу» передаёт основное значение глагола ἐρωτάω — «просить, обращаться с просьбой» — и естественно звучит в непосредственном обращении Иисуса к Отцу, не заменяя исходный глагол более явно религиозным «молюсь».
- source_word: περὶ αὐτῶν
  choice: о них
  rationale: 'Предлог περί с родительным падежом буквально указывает на предмет просьбы: «о них». В молитвенном контексте возможно и целевое понимание «за них», поэтому оно отмечено в сноске.'
- source_word: κόσμου
  choice: мире
  rationale: Сохранено обычное для Иоанна слово «мир» без сужения значения до «человечества» или «враждебной Богу системы».
- source_word: ὧν δέδωκάς μοι
  choice: о тех, кого Ты дал Мне
  rationale: Относительное местоимение относится к людям. Русский совершенный вид «дал» естественно передаёт совершившееся действие с сохраняющимся результатом, выраженным греческим перфектом.
- source_word: ὅτι
  choice: потому что
  rationale: 'Союз передаёт наиболее естественную здесь причинную связь: Иисус просит о них, потому что они принадлежат Отцу.'
- source_word: σοί εἰσιν
  choice: они — Твои
  rationale: Кратко и непосредственно сохранено притяжательное и личностное значение греческой конструкции.
- source_word: ἐγὼ
  choice: Я
  rationale: Явное местоимение сохранено, поскольку в греческом оно выражено отдельно и поддерживает контрастную структуру высказывания.
- source_word: ἀλλὰ
  choice: а
  rationale: В русской конструкции «не …, а …» этот союз естественно и точно выражает сильное противопоставление.
theological_decisions:
- issue: Передавать ли ἐρωτῶ явно молитвенным словом
  choice: «прошу», а не «молюсь»
  alternative: «молюсь»
  rationale: Контекст несомненно молитвенный, однако исходный глагол означает прежде всего просьбу. Выбор «прошу» сохраняет лексическую прозрачность и не добавляет к тексту более специальной религиозной формулировки.
- issue: Значение выражения περὶ αὐτῶν в ходатайственном контексте
  choice: «о них» с указанием варианта в сноске
  alternative: «за них»
  rationale: «О них» ближе воспроизводит форму и повтор исходного текста, тогда как «за них» яснее выражает ходатайственный оттенок. Сноска сохраняет реальную смысловую возможность, не устраняя неоднозначность.
- issue: Объём понятия «мир»
  choice: сохранить «мир» без поясняющего сужения
  alternative: «всё человечество» или «неверующий мир»
  rationale: У слова κόσμος в Евангелии от Иоанна есть несколько взаимосвязанных оттенков. Перевод не разрешает богословское напряжение в пользу одного конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык, краткий и торжественный без архаизации. Инверсия «Не о мире прошу» сохраняет выразительное противопоставление оригинала. Заглавные буквы в «Ты», «Мне», «Твои» использованы как традиционный русский знак почтительного обращения в библейском тексте; они не вносят дополнительного толкования.
