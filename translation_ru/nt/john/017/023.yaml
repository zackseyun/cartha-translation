  text: ἐγὼ ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί, ἵνα ὦσιν τετελειωμένοι εἰς ἕν, ⸀ἵνα γινώσκῃ ὁ κόσμος ὅτι σύ με ἀπέστειλας καὶ ἠγάπησας αὐτοὺς καθὼς ἐμὲ ἠγάπησας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/023.yaml
  text: I in them and you in me[a], so that they may be perfected into one, so that the world may know that you sent me and loved them just as you loved me.
translation:
  language: ru
  text: Я — в них, и Ты — во Мне, чтобы они были приведены к полному единству[a], чтобы мир узнал, что Ты послал Меня и возлюбил их так же, как возлюбил Меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были доведены до полноты в единстве»; букв.: «были доведены до совершенства в одно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτοῖς / ἐν ἐμοί
  choice: в них / во Мне
  rationale: Сохраняет характерный для Иоанна язык взаимного пребывания и богословски значимый предлог ἐν, не ослабляя его до значения «среди».
- source_word: τετελειωμένοι
  choice: были приведены к совершенству
  rationale: Передаёт совершенный пассивный причастный оборот как состояние, возникшее в результате доведения до полноты; не сводит смысл исключительно к нравственной безгрешности.
- source_word: εἰς ἕν
  choice: как одно целое
  rationale: Естественно по-русски выражает результативную направленность εἰς ἕν — становление единым целым, а не просто пребывание в уже существующем единстве.
- source_word: γινώσκῃ
  choice: узнал
  rationale: В придаточном цели естественно передаёт распознавание миром того, что Отец послал Сына; совершенный вид в русском обозначает достижение познания, не внося дополнительного толкования.
- source_word: κόσμος
  choice: мир
  rationale: Сохраняет стандартное и многозначное иоанновское обозначение без пояснительного сужения до «людей мира» или «мировой системы».
- source_word: ἀπέστειλας
  choice: послал
  rationale: Прямой и последовательный эквивалент ἀποστέλλω, сохраняющий тему посланничества Сына.
- source_word: ἠγάπησας
  choice: возлюбил
  rationale: Сохраняет повтор одного и того же глагола и возвышенный, но понятный современному читателю регистр молитвы.
- source_word: καθὼς
  choice: так же, как
  rationale: Прямо передаёт силу сопоставления, не смягчая и не разъясняя его богословское содержание.
theological_decisions:
- issue: Сила сопоставления в словах об Отчей любви к ученикам и к Сыну
  choice: «возлюбил их так же, как возлюбил Меня»
  alternative: «возлюбил их, подобно тому как возлюбил Меня» или пояснительное «такой же любовью»
  rationale: καθὼς вводит действительное сопоставление. Перевод сохраняет его богословскую напряжённость, не ослабляя и не разворачивая в доктринальный комментарий.
- issue: Значение τετελειωμένοι в связи с единством
  choice: «были приведены к совершенству как одно целое»
  alternative: «стали совершенно едины»; «были совершенными в одном»
  rationale: Формулировка сохраняет пассивное доведение до полноты и его направленность к единству, не утверждая однозначно абсолютного безгрешного совершенства верующих.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Заглавные местоимения в обращении к Отцу и применительно к Сыну поддерживают принятую русскую библейскую стилистику. Две последовательные конструкции с «чтобы» сохраняют повтор ἵνα и ход исходной фразы.
