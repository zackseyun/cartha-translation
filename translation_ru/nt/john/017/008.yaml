  source_fidelity: 'Основной смысл передан точно: λόγια/ῥήματα даны Отцом Иисусу, Иисус дал их ученикам; ученики приняли их, узнали истинность происхождения Иисуса от Отца и поверили в факт его посланничества. Однако «передал» для δέδωκα несколько сужает широкое «дал», внося оттенок именно передачи сообщения. Прямое «дал» точнее сохраняет повтор глагола δίδωμι и связь между двумя действиями.'
  naturalness: Текст звучит естественно на современном литературном русском. «Ведь» уместно передаёт пояснительную связь с предшествующим контекстом. Разделение на два предложения не нарушает последовательность мысли. «Действительно узнали» приемлемо и не требует изменения.
  terminology: «Слова», «приняли», «поверили, что» и «послал» адекватны контексту и синтаксису. «Я пришёл от Тебя» естественно передаёт παρὰ σοῦ ἐξῆλθον, не предрешая богословских интерпретаций. Альтернативы в сносках корректны; «изошёл» оправдано именно как более буквальный, но менее современный вариант.
