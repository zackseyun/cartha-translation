base_translation:
  language: en
  yaml_path: translation/nt/john/017/008.yaml
  text: For the words that you gave me I have given to them[a], and they received them and truly came to know that I came from you[b], and they believed that you sent me.
translation:
  language: ru
  text: Ведь слова, которые Ты дал Мне, Я дал им[a]. Они приняли их и действительно узнали, что Я пришёл от Тебя[b], и поверили, что Ты послал Меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изречения, которые Ты дал Мне».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я изошёл от Тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Ведь
  rationale: Начальное ὅτι связывает стих с предыдущим утверждением и вводит его обоснование; «ведь» естественно передаёт эту пояснительную связь.
- source_word: τὰ ῥήματα
  choice: слова
  rationale: «Слова» сохраняет конкретное множественное число и значение произнесённых слов; возможное «изречения» отмечено в сноске.
- source_word: ἔδωκάς ... δέδωκα
  choice: Ты дал ... Я передал
  rationale: Первое «дал» передаёт аорист, а «передал» естественно выражает передачу ученикам того, что было дано Иисусу. Русский вид обозначает завершённое действие, хотя формально не воспроизводит различие аориста и перфекта.
- source_word: ἔλαβον
  choice: приняли
  rationale: В контексте принятия откровения «приняли» передаёт получение и не усиливает смысл до явно выраженного одобрения.
- source_word: ἔγνωσαν ἀληθῶς
  choice: действительно узнали
  rationale: «Узнали» отражает достигнутое понимание в аористе, а «действительно» прямо передаёт ἀληθῶς без сведения смысла лишь к субъективной уверенности.
- source_word: παρὰ σοῦ ἐξῆλθον
  choice: Я пришёл от Тебя
  rationale: Оборот естественно выражает происхождение и исходную точку, сохраняя богословскую весомость без добавления позднейшей терминологии.
- source_word: ἐπίστευσαν ὅτι
  choice: поверили, что
  rationale: Придаточное с ὅτι сообщает содержание веры, поэтому «поверили, что» точнее, чем реляционное «доверились».
- source_word: ἀπέστειλας
  choice: послал
  rationale: «Послал» прямо и традиционно передаёт действие Отца по отношению к Иисусу, не добавляя значения официального поручения.
theological_decisions:
- issue: Отношение Иисуса к Отцу в παρὰ σοῦ ἐξῆλθον
  choice: Я пришёл от Тебя
  alternative: Я изошёл от Тебя
  rationale: Выбранный вариант ясно утверждает происхождение Иисуса от Отца, но не уточняет способ этого происхождения и тем самым сохраняет заложенную в тексте богословскую глубину.
- issue: Значение πιστεύω при придаточном с ὅτι
  choice: поверили, что Ты послал Меня
  alternative: уверовали, что Ты послал Меня
  rationale: «Поверили, что» естественно передаёт признание истинности названного утверждения и не превращает конструкцию в не выраженное здесь «поверили в».
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Местоимения, обращённые к Отцу и Иисусу, написаны с прописной буквы по принятой русской библейской издательской традиции. Короткие предложения улучшают ясность, не меняя логической последовательности греческого текста.
