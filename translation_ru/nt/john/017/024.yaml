source:
  edition: SBLGNT
  text: ⸀πάτερ, ⸀ὃ δέδωκάς μοι, θέλω ἵνα ὅπου εἰμὶ ἐγὼ κἀκεῖνοι ὦσιν μετ’ ἐμοῦ, ἵνα θεωρῶσιν τὴν δόξαν τὴν ἐμὴν ἣν ⸀δέδωκάς μοι, ὅτι ἠγάπησάς με πρὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/024.yaml
  text: Father[a], I desire that those whom you have given me also may be with me where I am, so that they may see my glory that you have given me, because you loved me before the foundation of the world.
translation:
  language: ru
  text: Отец, Я хочу, чтобы те, кого Ты дал Мне[a], также были со Мной там, где Я, чтобы они видели Мою славу, которую Ты дал Мне, потому что Ты возлюбил Меня прежде основания мира.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «то, что Ты дал Мне». Выражение имеет собирательный смысл и обозначает людей, которых Отец дал Сыну; далее они названы во множественном числе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  choice: Отец
  rationale: Прямое обращение к Богу; форма «Отец» естественна для современного русского и не добавляет отсутствующего в греческом притяжательного местоимения.
- source_word: ὃ δέδωκάς μοι
  choice: те, кого Ты дал Мне
  rationale: Хотя ὃ формально стоит в среднем роде единственного числа («то, что»), выражение имеет собирательное личное значение, что подтверждается последующим множественным κἀκεῖνοι ὦσιν. Русское «те, кого» ясно передаёт референт.
- source_word: δέδωκάς
  choice: дал
  rationale: Греческий перфект обозначает совершившееся дарование с сохраняющимся результатом; в русском контексте это естественно выражается совершенным видом прошедшего времени.
- source_word: θέλω
  choice: Я хочу
  rationale: Передаёт волевое значение θέλω прямо и естественно, не превращая молитвенное высказывание в формулу повеления; «желаю» в современном русском здесь звучало бы более книжно и слабее.
- source_word: ἵνα ... ἵνα
  choice: чтобы ... и видели
  rationale: Первое ἵνα вводит содержание желания. Второе обозначает цель; однородное продолжение «и видели» в русском естественно связывает пребывание со Христом с его целью, не устраняя целевого смысла.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: там, где Я
  rationale: Идиоматическая русская конструкция передаёт местное значение и выраженное местоимением ἐγώ выделение субъекта без тяжеловесного «где нахожусь Я Сам».
- source_word: κἀκεῖνοι ὦσιν μετ’ ἐμοῦ
  choice: были со Мной
  rationale: Личный множественный референт уже выражен словами «те, кого»; русский порядок слов естественно передаёт желаемое совместное пребывание. Добавочное значение καί отражено общей конструкцией желания и последующим союзом.
- source_word: θεωρῶσιν
  choice: видели
  rationale: θεωρέω означает видеть, созерцать, наблюдать. «Видели» понятно современному читателю и сохраняет возможность как непосредственного видения, так и созерцания славы.
- source_word: τὴν δόξαν τὴν ἐμήν
  choice: Мою славу
  rationale: Естественное русское соответствие конструкции с повторным артиклем и притяжательным прилагательным; принадлежность славы Сыну выражена ясно.
- source_word: ἣν δέδωκάς μοι
  choice: которую Ты дал Мне
  rationale: Относительное придаточное прямо определяет славу; совершенный вид «дал» естественно передаёт завершённое действие с сохраняющимся результатом.
- source_word: ὅτι
  choice: потому что
  rationale: 'Сохраняет наиболее прямое причинное прочтение: дарование славы связано с любовью Отца к Сыну прежде основания мира.'
- source_word: ἠγάπησάς με
  choice: Ты возлюбил Меня
  rationale: Аорист передан совершенным видом прошедшего времени. «Возлюбил» уместно в dignified библейском регистре и выражает любовь без разговорного оттенка.
- source_word: πρὸ καταβολῆς κόσμου
  choice: прежде основания мира
  rationale: Близко передаёт временное значение πρό и устойчивый образ καταβολὴ κόσμου, не ослабляя указания на любовь Отца к Сыну до сотворения мира.
theological_decisions:
- issue: Предвечная любовь Отца к Сыну
  choice: 'Сохранено прямое временное утверждение: «Ты возлюбил Меня прежде основания мира».'
  alternative: Ослабить временной смысл посредством метафорического или предопределительного пересказа.
  rationale: Греческий текст прямо помещает любовь Отца к Сыну прежде основания мира; перевод сохраняет это утверждение без догматического расширения.
- issue: Сила θέλω в молитве Иисуса
  choice: «Я хочу»
  alternative: «Я желаю» или «Я повелеваю».
  rationale: «Я хочу» сохраняет реальное волеизъявление, но не разрешает богословское напряжение молитвенного контекста в сторону либо слабого пожелания, либо властного указа.
- issue: Связь ὅτι с предшествующим высказыванием
  choice: Причинное «потому что».
  alternative: Изъяснительное «что» или менее определённое «ибо».
  rationale: Причинное прочтение наиболее естественно связывает данную Сыну славу с любовью Отца, однако перевод не добавляет объяснения того, каким именно образом эта причинность понимается.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Сохранены традиционные прописные местоимения при обращении к Богу как допустимая особенность русского библейского регистра; синтаксис сделан естественным, без архаизмов вроде «да будут» и без конфессионально обусловленных пояснений.
