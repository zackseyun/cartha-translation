base_translation:
  language: en
  yaml_path: translation/nt/john/017/026.yaml
  text: And I made your name known to them[a], and I will make it known, so that the love with which you loved me may be in them[c][b], and I in them.
translation:
  language: ru
  text: Я открыл им Твоё имя[a] и открою его, чтобы любовь, которой Ты возлюбил Меня, была в них[b], и Я — в них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Твоё имя» относится к открытой людям идентичности и характеру Бога, а не только к произносимому наименованию.
    reason: cultural_note
  - marker: b
    text: 'Или: «среди них»; однако «в них» точнее сохраняет характерную для Евангелия от Иоанна тему внутреннего пребывания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισα
  choice: Я открыл
  rationale: Аорист γνωρίζω означает «сделал известным». В данном контексте «открыл» естественно передаёт сообщение прежде неведомого и сохраняет параллель с будущим γνωρίσω.
- source_word: τὸ ὄνομά σου
  choice: Твоё имя
  rationale: Сохраняет конкретный библейский образ и не сводит его интерпретационно к «характеру» или «тому, кто Ты».
- source_word: γνωρίσω
  choice: ещё открою
  rationale: Будущее время передано явно; «ещё» естественно выражает продолжение действия после уже совершённого откровения, не меняя объекта — имени Отца.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно передаёт целевую, с возможным оттенком результата, силу ἵνα.
- source_word: ἡ ἀγάπη ἣν ἠγάπησάς με
  choice: любовь, которой Ты возлюбил Меня
  rationale: Сохраняет однокоренное сочетание ἀγάπη/ἀγαπάω и необычную, но понятную инструментальную конструкцию оригинала.
- source_word: ἐν αὐτοῖς
  choice: в них
  rationale: Это прямое соответствие ἐν с дательным и оно сохраняет характерную для Иоанна тему внутреннего пребывания.
- source_word: κἀγὼ ἐν αὐτοῖς
  choice: и Я — в них
  rationale: Тире естественно обозначает пропуск подразумеваемого глагола «был», сохраняя краткость и координацию греческого текста.
theological_decisions:
- issue: Смысл выражения «Твоё имя»
  choice: Сохранить «Твоё имя» в основном тексте.
  alternative: «кто Ты» или «Твой характер»
  rationale: У Иоанна «имя» подразумевает открытую людям личность и сущность Отца, но замена образа толкованием сузила бы смысл оригинала.
- issue: Связь любви Отца и пребывания Христа в учениках
  choice: 'Передать их как два однородных элемента: «любовь… была в них, и Я — в них».'
  alternative: 'Явно подчинить одно другому, например: «чтобы Я был в них и потому в них была любовь».'
  rationale: Греческий текст соединяет эти реалии союзом καί и не разъясняет их причинную взаимосвязь; перевод сохраняет эту богословскую напряжённость.
- issue: Значение ἐν αὐτοῖς
  choice: «в них»
  alternative: «среди них»
  rationale: Хотя ἐν иногда может обозначать нахождение среди группы, здесь буквальное «в них» лучше соответствует непосредственной синтаксической форме и теме пребывания в Евангелии от Иоанна.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимения, обращённые к Отцу и Сыну, написаны с прописной буквы в соответствии с устойчивой русской библейской традицией. «Возлюбил» сохранено как возвышенное, но понятное слово, позволяющее воспроизвести связь существительного «любовь» с глаголом.
