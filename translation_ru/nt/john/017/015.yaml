id: JHN.17.15
reference: John 17:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐκ ἐρωτῶ ἵνα ἄρῃς αὐτοὺς ἐκ τοῦ κόσμου ἀλλ’ ἵνα τηρήσῃς αὐτοὺς ἐκ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/015.yaml
  text: I am not asking that you take them out of the world[a], but that you keep them from the evil one.
translation:
  language: ru
  text: Я прошу не о том, чтобы Ты взял их из мира, но чтобы сохранил их от лукавого.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от зла». Греческое выражение τοῦ πονηροῦ может означать как «лукавого», так и «зло».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: Я прошу
  rationale: Настоящее время передаёт непосредственную просьбу Иисуса в молитве; «прошу» естественно и точно, без излишне церковного оттенка.
- source_word: ἄρῃς
  choice: взял
  rationale: В сочетании с ἐκ τοῦ κόσμου выражает удаление из мира; русское «взял их из мира» сохраняет образ и звучит естественно.
- source_word: κόσμου
  choice: мира
  rationale: «Мир» сохраняет широту и характерную для Иоанна многозначность κόσμος, не сужая значение до общества или миропорядка.
- source_word: τηρήσῃς
  choice: сохранил
  rationale: Передаёт значение оберегания и защиты; в данном русском контексте естественнее, чем буквальное «сберёг» или более конкретное «защитил».
- source_word: ἐκ
  choice: от
  rationale: После «сохранил» предлог «от» идиоматически передаёт защиту от угрозы, сохраняя смысл греческой конструкции τηρέω ἐκ.
- source_word: τοῦ πονηροῦ
  choice: лукавого
  rationale: Субстантивированное «лукавого» передаёт вероятный личный референт — злого духа, — не добавляя прямо имени «дьявол»; грамматически возможное безличное значение отмечено в сноске.
theological_decisions:
- issue: Личное или безличное значение τοῦ πονηροῦ
  choice: от лукавого
  alternative: от зла
  rationale: Греческая форма допускает оба понимания. Употребление у Иоанна и контекст защиты поддерживают личное значение, однако подлинная неоднозначность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимение «Ты» написано с прописной буквы как уместная русская издательская конвенция обращения к Богу; синтаксис сохраняет противопоставление «не… но…» оригинала.
