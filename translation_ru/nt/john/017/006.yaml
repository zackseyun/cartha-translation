  text: Ἐφανέρωσά σου τὸ ὄνομα τοῖς ἀνθρώποις οὓς ⸀ἔδωκάς μοι ἐκ τοῦ κόσμου. σοὶ ἦσαν κἀμοὶ αὐτοὺς ⸁ἔδωκας, καὶ τὸν λόγον σου τετήρηκαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/006.yaml
  text: I have made your name known to the men whom you gave me out of the world. They were yours, and you gave them to me, and they have kept your word.
translation:
  language: ru
  text: Я открыл Твоё имя[a] людям, которых Ты дал Мне из мира. Они были Твоими, и Ты дал их Мне, и они соблюли Твоё слово[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Твоё имя» относится к открываемой личности и характеру Бога, а не только к Его наименованию.
    reason: cultural_note
  - marker: b
    text: 'Или: «сохранили Твоё слово»; греческий глагол также может означать «соблюли», «сберегли», «остались верны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφανέρωσά
  choice: Я открыл
  rationale: Глагол φανερόω означает сделать явным, открыть, явить. «Открыл» естественно сочетается с выражением «Твоё имя» и передаёт смысл раскрытия, не прибегая к более архаичному «явил».
- source_word: τὸ ὄνομα
  choice: Твоё имя
  rationale: Сохранено конкретное слово греческого текста. В данном контексте «имя» охватывает открываемую людям личность, характер и присутствие Бога, но перевод не сводит этот ёмкий образ к одному толкованию.
- source_word: τοῖς ἀνθρώποις
  choice: людям
  rationale: ἄνθρωποι допускает общее значение «люди». Русское «людям» естественно и точно; ближайший контекст определяет этих людей как учеников Иисуса.
- source_word: οὓς ἔδωκάς μοι ἐκ τοῦ κόσμου
  choice: кого Ты дал Мне из мира
  rationale: Формулировка сохраняет образ людей, данных Отцом Сыну и взятых из мира, без внесения позднейшей богословской системы.
- source_word: σοὶ ἦσαν
  choice: Они были Твоими
  rationale: Краткая притяжательная конструкция прямо и торжественно передаёт греческое выражение.
- source_word: κἀμοὶ αὐτοὺς ἔδωκας
  choice: и Ты дал их Мне
  rationale: Естественный русский порядок слов сохраняет утверждение о передаче этих людей Отцом Сыну.
- source_word: τὸν λόγον σου
  choice: Твоё слово
  rationale: «Слово» сохраняет широкий смысл λόγος — слово, весть или учение — и важную для Евангелия от Иоанна лексику.
- source_word: τετήρηκαν
  choice: они сохранили
  rationale: Перфект τηρέω указывает на совершённое действие с сохраняющимся результатом. «Сохранили» удерживает основное значение глагола и не сужает его до одного лишь послушания.
theological_decisions:
- issue: Смысл выражения «Твоё имя»
  choice: Сохранить буквальное выражение «Твоё имя»
  alternative: 'Передать толковательно: «кто Ты» или «Твой характер»'
  rationale: В контексте имя означает открываемую личность и характер Отца, однако конкретный образ исходного текста богословски ёмок и не должен заменяться пояснительным пересказом.
- issue: Кого обозначает τοῖς ἀνθρώποις
  choice: Перевести «людям»
  alternative: Перевести «мужчинам» или уточнить «ученикам»
  rationale: Существительное способно обозначать людей вообще, тогда как конкретный круг референтов устанавливается контекстом. «Людям» не добавляет отсутствующего в этой фразе уточнения.
- issue: Люди, данные Отцом Сыну
  choice: Сохранить формулировку без систематического толкования
  alternative: Передать её в терминах определённой доктрины избрания или предузнания
  rationale: Стих прямо говорит, что Отец дал этих людей Сыну, но не объясняет здесь полный богословский механизм этого действия.
- issue: Значение τετήρηκαν
  choice: Перевести «сохранили Твоё слово»
  alternative: Перевести «послушались Твоего слова»
  rationale: Глагол допускает значение соблюдения и послушания, но более буквальное «сохранили» удерживает смысловую широту и результативность греческого перфекта.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимения, обращённые к Отцу и Сыну, написаны с прописной буквы по принятой русской библейской традиции. Тире после «имя» естественно присоединяет уточняющий оборот и устраняет тяжеловесное повторение придаточной конструкции.
