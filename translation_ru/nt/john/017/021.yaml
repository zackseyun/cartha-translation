base_translation:
  language: en
  yaml_path: translation/nt/john/017/021.yaml
  text: that they may all be one[a], just as you, Father, are in me and I am in you; that they also may be in us[c][b], so that the world may believe that you sent me.
translation:
  language: ru
  text: чтобы все они были едины[a], как Ты, Отец, во Мне и Я в Тебе, чтобы и они были в Нас[b], — чтобы мир верил[c], что Ты послал Меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «чтобы все были одно». Выражение говорит о единстве, не уточняя, в чём именно оно состоит.'
    reason: lexical_alternative
  - marker: b
    text: Повтор предлога «в» — «во Мне», «в Тебе», «в Нас» — передаёт характерный для Иоанна язык взаимного пребывания и участия; речь идёт о большем, чем простая связь или близость.
    reason: cross_reference
  - marker: c
    text: 'Также возможно: «поверил». Греческая форма не уточняет однозначно, подчёркивается ли начало веры или сама вера.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: 'Три последовательных придаточных с ἵνα переданы повтором «чтобы»: это сохраняет целевую и результативную связь и естественно звучит по-русски.'
- source_word: πάντες
  choice: все они
  rationale: Местоимение «они» ясно указывает на людей, о которых молится Иисус, а «все» сохраняет полный охват греческого πάντες.
- source_word: ἓν
  choice: едины
  rationale: Форма «едины» естественна в современном литературном русском и сохраняет широкое значение единства, не сводя его к организационному, нравственному или иному отдельному аспекту.
- source_word: καθὼς
  choice: как
  rationale: Краткое «как» естественно вводит сопоставление единства учеников с отношением Отца и Сына.
- source_word: πάτερ
  choice: Отец
  rationale: Сохранено прямое обращение в звательном значении; прописная буква соответствует обращению к Богу в данном контексте.
- source_word: ἐν ἐμοὶ ... ἐν σοί
  choice: во Мне ... в Тебе
  rationale: Последовательная передача ἐν предлогом «в» сохраняет характерный для Иоанна язык взаимного пребывания и не ослабляет его до простой близости или связи.
- source_word: κἀγώ
  choice: и Я
  rationale: 'Передаёт сочинительную и взаимную связь: «и Я в Тебе».'
- source_word: καὶ αὐτοὶ
  choice: и они
  rationale: Сохраняет добавочное значение καί и связывает пребывание учеников с только что названным отношением Отца и Сына.
- source_word: ἐν ἡμῖν
  choice: в Нас
  rationale: Буквальная и естественная передача сохраняет богословски насыщенный образ участия и пребывания, не заменяя его более слабым «с Нами».
- source_word: κόσμος
  choice: мир
  rationale: Сохраняет ёмкий и устойчивый термин Иоанна, не сужая его до выражения «люди мира».
- source_word: πιστεύῃ
  choice: поверил
  rationale: В целевой конструкции «чтобы мир поверил» естественно по-русски передаёт веру как предполагаемый итог; примечание сохраняет возможность понимания без акцента на начале веры.
- source_word: ἀπέστειλας
  choice: послал
  rationale: Совершенный вид естественно передаёт греческий аорист и завершённость послания в данном высказывании.
theological_decisions:
- issue: Характер единства верующих по отношению к Отцу и Сыну
  choice: «были едины» без пояснения вида или основания единства
  alternative: «были объединены»; «были едины в намерениях»; «были одно»
  rationale: Текст сопоставляет единство верующих с отношением Отца и Сына, но не определяет его как исключительно организационное, нравственное или метафизическое. Перевод сохраняет глубину и напряжение исходного текста без привнесения более поздней доктринальной конкретизации.
- issue: Язык пребывания у Иоанна
  choice: «во Мне», «в Тебе», «в Нас»
  alternative: «со Мной», «с Тобой», «с Нами»; «в единении с Нами»
  rationale: Повтор греческого ἐν существенен для смысла стиха. Буквальная передача сохраняет язык взаимного пребывания и участия, не разрешая заложенную в нём богословскую многозначность.
- issue: Видовой оттенок πιστεύῃ
  choice: «поверил» с примечанием об альтернативе «верил»
  alternative: «начал верить»; «верил»
  rationale: Греческая форма обозначает веру, но сама по себе не требует однозначно понимать её как начало или продолжение. Основной русский вариант естественен в целевом придаточном, а примечание не позволяет принять видовой оттенок русского глагола за однозначное уточнение оригинала.
translation_notes:
  register: Современный литературный русский с торжественностью, уместной для молитвы Иисуса. Синтаксический повтор «чтобы» сохранён ради структуры оригинала; тире перед последним придаточным помогает ясно обозначить итоговую цель. Местоимения, относящиеся к Отцу и Сыну, написаны с прописной буквы согласно принятому русскому библейскому регистру.
