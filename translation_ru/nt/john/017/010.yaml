id: JHN.17.10
reference: John 17:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ τὰ ἐμὰ πάντα σά ἐστιν καὶ τὰ σὰ ἐμά, καὶ δεδόξασμαι ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/010.yaml
  text: And all that is mine is yours[a], and what is yours is mine, and I have been glorified in them.
translation:
  language: ru
  text: И всё Моё — Твоё, и Твоё — Моё, и Я прославлен в них.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через них» или «среди них». В греческом тексте буквально: «в них»; в данном контексте это может указывать на сферу, средство или проявление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἐμὰ πάντα
  choice: всё Моё
  rationale: 'Субстантивированное сочетание среднего рода имеет всеобъемлющий смысл: всё, что принадлежит Иисусу. «Всё Моё» естественно и лаконично передаёт этот смысл.'
- source_word: σά
  choice: Твоё
  rationale: Притяжательное прилагательное употреблено субстантивированно; форма «Твоё» сохраняет краткость и параллелизм взаимной принадлежности.
- source_word: τὰ σὰ ἐμά
  choice: Твоё — Моё
  rationale: Зеркально передаёт вторую часть высказывания и сохраняет подчёркнутую взаимность без добавочного истолкования.
- source_word: δεδόξασμαι
  choice: Я прославлен
  rationale: Греческий перфект пассива обозначает совершившееся прославление с сохраняющимся результатом. Русская краткая форма «прославлен» естественно выражает наличное состояние, возникшее вследствие действия.
- source_word: ἐν αὐτοῖς
  choice: в них
  rationale: Прямо сохраняет греческое ἐν и его контекстуальную неоднозначность; местоимение, вероятнее всего, относится к людям, данным Сыну Отцом.
theological_decisions:
- issue: Взаимная принадлежность между Сыном и Отцом
  choice: 'Передать утверждение прямо: «всё Моё — Твоё, и Твоё — Моё»'
  alternative: Ослабить смысл до функционального сотрудничества
  rationale: Греческий текст прямо утверждает взаимную принадлежность. Перевод не смягчает этого утверждения, но и не вводит более позднюю богословскую терминологию.
- issue: Значение ἐν αὐτοῖς
  choice: Сохранить в основном тексте «в них»
  alternative: «через них» или «среди них»
  rationale: Предлог ἐν допускает оттенки сферы, средства или проявления; контекст не требует однозначно выбирать один из них, поэтому буквальная формулировка сохраняет напряжение оригинала.
translation_notes:
  register: Современный литературный русский язык; краткие именные конструкции сохраняют торжественность и параллелизм оригинала. Заглавные буквы в притяжательных и личных местоимениях употреблены по принятой русской библейской традиции при обращении Сына к Отцу.
