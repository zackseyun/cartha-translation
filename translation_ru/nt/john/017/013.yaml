  text: νῦν δὲ πρὸς σὲ ἔρχομαι, καὶ ταῦτα λαλῶ ἐν τῷ κόσμῳ ἵνα ἔχωσιν τὴν χαρὰν τὴν ἐμὴν πεπληρωμένην ἐν ⸀ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/013.yaml
  text: But now I am coming to you[b][a], and I am speaking these things in the world so that they may have my joy fulfilled in themselves.
translation:
  language: ru
  text: Но теперь Я иду к Тебе и говорю это в мире, чтобы Моя радость во всей полноте была в них.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы они имели в себе Мою радость, достигшую полноты». «В них» также может пониматься как «среди них».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: Но теперь
  rationale: νῦν указывает на настоящий момент в сопоставлении с предшествующим, а δέ обозначает мягкий переход с оттенком противопоставления.
- source_word: πρὸς σὲ ἔρχομαι
  choice: Я иду к Тебе
  rationale: ἔρχομαι с πρὸς и винительным падежом выражает движение к Отцу; настоящее время передаёт непосредственность предстоящего возвращения.
- source_word: ταῦτα λαλῶ
  choice: говорю это
  rationale: Естественная современная русская передача речевого действия без тяжеловесного буквального «говорю эти слова».
- source_word: ἐν τῷ κόσμῳ
  choice: пока нахожусь в мире
  rationale: Контекст показывает, что Иисус произносит слова, ещё пребывая в земной сфере; «в мире» сохраняет характерную для Иоанна лексику.
- source_word: ἵνα ἔχωσιν
  choice: чтобы … исполнила их
  rationale: Греческая конструкция буквально говорит, чтобы они имели радость в состоянии полноты; по-русски естественнее выразить тот же результат глагольной конструкцией.
- source_word: τὴν χαρὰν τὴν ἐμὴν
  choice: Моя радость
  rationale: Повтор артикля с притяжательным местоимением подчёркивает, что речь идёт о радости, принадлежащей Иисусу.
- source_word: πεπληρωμένην ἐν ἑαυτοῖς
  choice: исполнила их
  rationale: Перфектное пассивное причастие обозначает радость, доведённую до полноты в учениках. Русская конструкция сохраняет образ внутреннего наполнения и звучит естественно.
theological_decisions:
- issue: Смысл выражения «Моя радость»
  choice: Радость, принадлежащая Иисусу, должна наполнить учеников.
  alternative: Радость учеников об Иисусе.
  rationale: Притяжательное ἐμὴν естественнее всего указывает на собственную радость Иисуса; перевод не развивает это в дополнительное учение.
- issue: Отношение радости к ученикам
  choice: Радость исполняет их, то есть достигает полноты внутри них.
  alternative: Радость становится совершенной среди них как общины.
  rationale: ἐν ἑαυτοῖς обычно допускает внутреннее, личное понимание, однако возможность коллективного оттенка отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с уважительным написанием местоимения «Тебе» при обращении Сына к Отцу. Синтаксис упрощён ради ясности, при этом сохранены движение к Отцу, пребывание в мире, целевая связь и образ радости, достигающей полноты внутри учеников.
