    rationale: Слово «пока» эксплицирует временной оттенок, возможный по контексту, но отсутствующий в самой конструкции ἐν τῷ κόσμῳ. Простое «в мире» точнее сохраняет исходную формулировку.
  revised_text: Но теперь Я иду к Тебе и говорю это в мире, чтобы Моя радость во всей полноте была в них.[a]
