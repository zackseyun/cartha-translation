  source_fidelity: 'Черновик верно передаёт движение Иисуса к Отцу, Его речь «в мире» и целевую связь. Однако «чтобы Моя радость исполнила их» меняет синтаксическую и смысловую связь: в греческом ученики «имеют» радость Иисуса как уже приведённую к полноте в них, а не радость выступает действующим субъектом, который «исполняет» учеников.'
  naturalness: «Но теперь Я иду к Тебе и говорю это в мире» — естественный современный литературный русский. Формулировка «чтобы Моя радость во всей полноте была в них» естественна и ясно выражает результативное состояние, передаваемое πεπληρωμένην.
  terminology: «Моя радость» сохраняет принадлежность радости Иисусу. «В мире» сохраняет значимую для Иоанна лексику κόσμος, не сводя её к нейтральному «на земле». «Во всей полноте» адекватно передаёт πληρόω, не навязывая догматического истолкования.
