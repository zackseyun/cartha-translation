  text: καὶ οὐκέτι εἰμὶ ἐν τῷ κόσμῳ, καὶ ⸀αὐτοὶ ἐν τῷ κόσμῳ εἰσίν, κἀγὼ πρὸς σὲ ἔρχομαι. πάτερ ἅγιε, τήρησον αὐτοὺς ἐν τῷ ὀνόματί σου ᾧ δέδωκάς μοι, ἵνα ὦσιν ἓν ⸀καθὼς ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/011.yaml
  text: And I am no longer in the world[a], but they are in the world, and I am coming to you. Holy Father, keep them in your name, which you have given to me, so that they may be one[b], just as we are.
translation:
  language: ru
  text: Я уже не в мире, а они в мире, и Я иду к Тебе. Святой Отец, сохрани их в Твоём имени[a], которое Ты дал Мне[b], чтобы они были едины, как Мы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «сохрани их Твоим именем» или «защити их посредством Твоего имени». Греческое выражение может обозначать сферу, средство или власть.'
    reason: lexical_alternative
  - marker: b
    text: 'В одних рукописях читается: «сохрани их в Твоём имени, которое Ты дал Мне»; в других — «сохрани в Твоём имени тех, кого Ты дал Мне». Перевод следует тексту SBLGNT, где «которое» относится к слову «имя».'
    reason: textual_variant
lexical_decisions:
- source_word: οὐκέτι εἰμὶ ἐν τῷ κόσμῳ
  choice: Я уже не в мире
  rationale: Передаёт временное отрицание οὐκέτι и сохраняет характерное для Иоанна слово «мир», не уточняя его как общество или земной порядок.
- source_word: κἀγὼ πρὸς σὲ ἔρχομαι
  choice: а Я иду к Тебе
  rationale: В русском контексте движения от мира к Отцу «иду к Тебе» естественно передаёт настоящее время с ближайшим будущим значением; буквальное «прихожу к Тебе» здесь звучало бы менее естественно.
- source_word: πάτερ ἅγιε
  choice: Святой Отец
  rationale: Естественное русское обращение, сохраняющее и именование Бога Отцом, и определение ἅγιε.
- source_word: τήρησον
  choice: сохрани
  rationale: Глагол τηρέω здесь включает хранение, защиту и сохранение верности; «сохрани» достаточно широко и не сводит просьбу лишь к физической защите.
- source_word: ἐν τῷ ὀνόματί σου
  choice: в Твоём имени
  rationale: Буквальная конструкция сохраняет возможные оттенки сферы, средства и власти, не выбирая один из них в основном тексте.
- source_word: ᾧ δέδωκάς μοι
  choice: которое Ты дал Мне
  rationale: Относительное местоимение среднего рода согласуется с ὀνόματι («имени»), поэтому в данном тексте Отцом Сыну дано имя.
- source_word: ἵνα ὦσιν ἓν
  choice: чтобы они были едины
  rationale: «Едины» естественно выражает единство нескольких лиц и не создаёт впечатления, будто они становятся одним лицом или предметом.
- source_word: καθὼς ἡμεῖς
  choice: как и Мы
  rationale: Сохраняет прямое сопоставление единства учеников с единством Отца и Сына, не определяя сверх сказанного природу этого сходства.
theological_decisions:
- issue: Значение выражения «сохрани их в Твоём имени»
  choice: Формулировка оставлена без истолковывающего расширения в основном тексте.
  alternative: «сохрани их Твоим именем» или «защити их силой Твоего имени»
  rationale: Греческое ἐν допускает понимание имени как сферы, средства или власти. Буквальная формулировка сохраняет эту богословскую многозначность.
- issue: Смысл слов «чтобы они были едины, как и Мы»
  choice: Сохранена реальная аналогия между единством учеников и единством Отца и Сына.
  alternative: Уточнить это как только нравственное единодушие либо как тождество по природе.
  rationale: Текст утверждает сравнение, но в самом стихе не объясняет его природу; перевод не должен ни ослаблять, ни догматически расширять его.
- issue: К чему относится «которое Ты дал Мне»
  choice: К «имени».
  alternative: «Тех, кого Ты дал Мне».
  rationale: В тексте SBLGNT относительное местоимение ᾧ согласуется с ὀνόματι, однако рукописная традиция содержит вариант, допускающий отнесение к ученикам; это отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Местоимения, относящиеся к Отцу и Сыну в прямом обращении, написаны с прописной буквы по принятой русской библейской традиции. Необычная конструкция «в Твоём имени» намеренно сохранена ради точности и пояснена сноской.
