  yaml_path: translation/nt/john/017/007.yaml
  text: Now they have come to know that everything you have given me is from you[a].
translation:
  language: ru
  text: Теперь они знают, что всё, что Ты дал Мне, — от Тебя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё, что Ты дал Мне, исходит от Тебя».'
    reason: Лексико-синтаксический вариант передачи παρὰ σοῦ εἰσιν.
lexical_decisions:
- source_word: νῦν
  choice: Теперь
  rationale: Передаёт нынешний этап и достигнутый результат в понимании учеников; естественно звучит в современном русском языке.
- source_word: ἔγνωκαν
  choice: они узнали
  rationale: Перфект указывает на достигнутое познание с сохраняющимся результатом. Русское «узнали» в контексте естественно выражает приход к знанию, не перегружая фразу.
- source_word: πάντα ὅσα
  choice: всё, что
  rationale: Сохраняет значение всеохватности и относительную конструкцию греческого выражения.
- source_word: δέδωκάς μοι
  choice: Ты дал Мне
  rationale: Русский совершенный вид выражает состоявшуюся передачу с сохраняющимся значением; порядок слов естественен и ясен.
- source_word: παρὰ σοῦ εἰσιν
  choice: от Тебя
  rationale: Передаёт значение источника или происхождения при παρά с родительным падежом; связка в настоящем времени в русском закономерно опускается.
theological_decisions:
- issue: Отношение дарованного Сыну к Отцу как источнику
  choice: «всё, что Ты дал Мне, — от Тебя»
  alternative: «всё, что Ты дал Мне, исходит от Тебя»
  rationale: Формулировка прямо сохраняет утверждение об Отце как источнике всего данного Сыну, не развивая его в более поздние догматические категории и не устраняя лаконичность оригинала.
translation_notes:
  register: Современный литературный русский язык; речь торжественная, но доступная. Местоимения, обращённые к Отцу, написаны с прописной буквы как уважительная издательская конвенция, без добавления смыслового содержания.
