    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: так как
  rationale: В данном контексте вводит основание и одновременно соотносит просьбу предыдущего стиха с уже данной Сыну властью; «так как» естественно связывает фразу с Ин. 17:1, не утяжеляя её оборотом «подобно тому как».
- source_word: ἔδωκας
  choice: Ты дал
  rationale: 'Аорист передан простым прошедшим временем: речь о даровании Отцом власти Сыну.'
- source_word: ἐξουσίαν
  choice: власть
  rationale: Передаёт предоставленное право и полномочие, а не только способность или силу.
- source_word: πάσης σαρκός
  choice: над всякой плотью
  rationale: Сохранён библейский образ и универсальный охват выражения; его идиоматический смысл разъяснён в сноске.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно передаёт цель или предполагаемый результат.
- source_word: πᾶν ὃ
  choice: всем, кого
  rationale: Греческая форма среднего рода единственного числа имеет собирательное личное значение; русский личный оборот ясен и согласуется с последующим αὐτοῖς.
- source_word: δέδωκας
  choice: Ты дал
  rationale: Русское прошедшее время в контексте естественно охватывает завершённое действие с сохраняющимся результатом; отличие греческого перфекта поясняется смыслом всего оборота.
- source_word: δώσῃ
  choice: Он дал
  rationale: Сослагательное наклонение после ἵνα передано русской целевой конструкцией с «чтобы», не выражая сомнения в намерении.
- source_word: αὐτοῖς
  choice: всем, кого
  rationale: Дательный объект включён в личный оборот «всем, кого Ты дал Ему», что делает связь местоимения с собирательным antecedent ясной по-русски.
- source_word: ζωὴν αἰώνιον
  choice: вечную жизнь
  rationale: Устоявшееся и точное русское соответствие ключевому для Иоанна выражению.
theological_decisions:
- issue: Соотношение всеобщей власти Сына и получающих вечную жизнь
  choice: Сохранены всеобщий охват власти («над всякой плотью») и отдельное обозначение тех, кого Отец дал Сыну («всем, кого Ты дал Ему»).
  alternative: Истолковать обе группы как полностью совпадающие либо заранее сузить «всякую плоть» до группы данных Сыну.
  rationale: Греческий текст различает область власти Сына и тех, кому Он даёт вечную жизнь; перевод сохраняет это богословское напряжение, не разрешая его в пользу какой-либо конфессиональной системы.
translation_notes:
  register: Современный литературный русский с сохранением достоинства молитвенной речи и библейского образа «всякая плоть». Местоимения, относящиеся к Отцу и Сыну, написаны с прописной буквы в соответствии с традиционным русским библейским регистром; синтаксис остаётся понятным обычному читателю.
