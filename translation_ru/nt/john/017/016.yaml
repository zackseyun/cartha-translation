base_translation:
  language: en
  yaml_path: translation/nt/john/017/016.yaml
  text: They are not from the world[a], just as I am not from the world.
translation:
  language: ru
  text: Они не от мира[a], как и Я не от мира.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не принадлежат миру». Греческий предлог ἐκ может указывать на источник, происхождение или принадлежность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: от
  rationale: Предлог ἐκ обозначает источник или происхождение; русское «от» естественно передаёт эту связь и сохраняет краткость греческого выражения.
- source_word: κόσμου
  choice: мира
  rationale: Простое «мир» сохраняет многозначность слова κόσμος в Евангелии от Иоанна и не сужает его до истолковывающих вариантов вроде «мировой порядок» или «система мира».
- source_word: οὐκ εἰσὶν
  choice: не от мира
  rationale: В русском составное именное сказуемое в настоящем времени естественно передаётся без явной связки «есть»; отрицание сохраняется.
- source_word: καθὼς
  choice: как и
  rationale: Оборот естественно выражает точное сопоставление учеников с Иисусом; частица «и» подчёркивает параллель, не усиливая её сверх текста.
- source_word: ἐγὼ
  choice: Я
  rationale: Личное местоимение сохранено, поскольку в греческом оно выражено явно и важно для сопоставления.
- source_word: οὐκ εἰμὶ ἐκ τοῦ κόσμου
  choice: Я не от мира
  rationale: Повтор ключевого выражения сохранён, как и в греческом; настоящее время в русском не требует явной связки.
theological_decisions:
- issue: Значение выражения «мир» в богословии Иоанна
  choice: Сохранить слово «мир» без поясняющего расширения в основном тексте.
  alternative: «мировой порядок», «падший мир» или «система этого мира»
  rationale: Контекст Иоанна придаёт слову κόσμος богословскую глубину, однако сам стих не уточняет её однозначно. Буквальное «мир» сохраняет напряжение и не вводит более узкое толкование.
- issue: 'Оттенок ἐκ: происхождение или принадлежность'
  choice: Перевести «от мира» и отметить в сноске возможный смысл принадлежности.
  alternative: «не принадлежат миру» или традиционное «не от мира сего»
  rationale: «От мира» непосредственно передаёт исходную конструкцию и её оттенок источника или происхождения, тогда как принадлежность остаётся возможным контекстуальным смыслом. Добавление «сего» отсутствует в греческом тексте.
translation_notes:
  register: Современный литературный русский язык; краткий, торжественно-нейтральный строй. Сохранены повтор «не от мира» и лаконизм оригинала; архаическое «мир сей» не использовано.
