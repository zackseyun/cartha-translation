source:
  edition: SBLGNT
  text: καὶ ὑπὲρ αὐτῶν ἐγὼ ἁγιάζω ἐμαυτόν, ἵνα ⸂ὦσιν καὶ αὐτοὶ⸃ ἡγιασμένοι ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/019.yaml
  text: And for their sake I sanctify myself[b][a], so that they also may be sanctified in truth.
translation:
  language: ru
  text: И ради них Я освящаю Себя[a], чтобы и они были освящены в истине[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посвящаю Себя». Тот же греческий глагол далее переведён словами «были освящены».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «истиной»; ср. Ин 17:17.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ αὐτῶν
  choice: ради них
  rationale: Ὑπέρ с родительным падежом выражает действие ради пользы других. «Ради них» естественно передаёт направленность поступка Иисуса на благо учеников, не добавляя обязательного значения заместительности.
- source_word: ἁγιάζω ἐμαυτόν
  choice: освящаю Себя
  rationale: Повтор корня «освящать» в обеих частях стиха отражает повтор греческого ἁγιάζω / ἡγιασμένοι. Здесь выражение означает прежде всего посвящение Себя Богу и Своему делу, а не переход от нравственной нечистоты к святости.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно передаёт целевое значение греческого союза.
- source_word: καὶ αὐτοὶ
  choice: и они
  rationale: 'Передаёт включение и смысловое ударение: вследствие посвящения Иисуса освящены должны быть также ученики.'
- source_word: ὦσιν ... ἡγιασμένοι
  choice: были освящены
  rationale: Сочетание связочного глагола с перфектным страдательным причастием указывает на состояние, возникшее в результате освящающего действия. Русская страдательная конструкция сохраняет это значение.
- source_word: ἐν ἀληθείᾳ
  choice: в истине
  rationale: Буквально сохраняет предложную конструкцию и допускает понимание истины как сферы или реальности освящения. Отсутствие артикля не следует механически воспроизводить, поскольку в русском языке артиклей нет; контекстуальная связь с Ин 17:17 остаётся открытой.
theological_decisions:
- issue: Смысл самоосвящения Иисуса
  choice: Иисус посвящает Себя исполнению Своего дела ради учеников; повтор глагола передан словом «освящаю».
  alternative: «Я посвящаю Себя» или понимание как «делаю Себя святым».
  rationale: В данном контексте ἁγιάζω применительно к Иисусу естественно означает посвящение, отделение для святой цели. Однако основной текст сохраняет лексическую связь с последующим «были освящены», а пояснение не утверждает нравственного перехода от нечистоты к святости.
- issue: Значение ἐν ἀληθείᾳ
  choice: «в истине» — истина как сфера или реальность освящения.
  alternative: «истиной» — истина как средство освящения.
  rationale: Предлог ἐν допускает оба понимания, а непосредственный контекст Ин 17:17 поддерживает инструментальное прочтение. Основной текст не устраняет эту смысловую напряжённость, а вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Заглавные буквы в «Я» и «Себя» отражают устойчивую русскую библейскую издательскую практику при передаче слов Иисуса. Лексический повтор «освящаю — освящены» намеренно сохранён, а более естественный в первом обороте вариант «посвящаю» дан в сноске.
