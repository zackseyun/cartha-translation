  text: ἐγώ σε ἐδόξασα ἐπὶ τῆς γῆς, τὸ ἔργον ⸀τελειώσας ὃ δέδωκάς μοι ἵνα ποιήσω·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/004.yaml
  text: I glorified you on the earth by completing the work that you have given me to do[a].
translation:
  language: ru
  text: Я прославил Тебя на земле, совершив дело, которое Ты дал Мне исполнить[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я прославил Тебя на земле тем, что завершил дело, которое Ты дал Мне исполнить».'
    reason: Сноска отражает возможную более явную передачу τελειώσας как средства, тогда как основной текст сохраняет более широкую причастную связь.
lexical_decisions:
- source_word: ἐδόξασα
  choice: прославил
  rationale: Передаёт характерное для Иоанна значение δοξάζω — явить или принести славу; это точнее богословски насыщенного контекста, чем более общее «почтил».
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Естественно и точно передаёт пространственное значение ἐπί с родительным падежом; русский язык здесь не требует отдельной передачи греческого артикля.
- source_word: τελειώσας
  choice: совершив
  rationale: Передаёт доведение порученного дела до завершения и естественно связывает причастный оборот с главным глаголом; в современном литературном русском звучит достойнее и компактнее, чем «завершив выполнение».
- source_word: τὸ ἔργον
  choice: дело
  rationale: Прямой и контекстуально уместный эквивалент ἔργον, обозначающий порученную Иисусу миссию.
- source_word: δέδωκάς μοι
  choice: Ты дал Мне
  rationale: В русском простое прошедшее время естественно выражает завершённое действие с сохраняющейся значимостью; буквальное стремление отдельно передать греческий перфект сделало бы фразу неестественной.
- source_word: ἵνα ποιήσω
  choice: исполнить
  rationale: Инфинитив естественно передаёт цель после «дал»; «исполнить» в сочетании с порученным делом выражает выполнение, не повторяя слово «делать».
- source_word: ἐγώ σε
  choice: Я ... Тебя
  rationale: Явные местоимения сохранены. Дополнительное «Я Сам» излишне усилило бы греческое ἐγώ.
theological_decisions:
- issue: Связь прославления Отца с причастием τελειώσας
  choice: 'Причастие передано как обстоятельство образа действия или средства: «прославил… совершив дело».'
  alternative: 'Возможны временное «прославил… после того как совершил» или сопутствующее/координатное понимание: «прославил…; совершил дело».'
  rationale: Синтаксис естественно позволяет понимать завершение дела как то, посредством чего Иисус прославил Отца. Форма «совершив» сохраняет смысловую связь, но не делает её столь однозначно инструментальной, как «тем, что совершил».
translation_notes:
  register: Современный литературный русский с традиционно возвышенным, но понятным библейским звучанием. Местоимения, относящиеся к Отцу и Сыну, написаны с прописной буквы как редакционная норма благоговейного регистра; это не добавляет толкования к греческому тексту.
