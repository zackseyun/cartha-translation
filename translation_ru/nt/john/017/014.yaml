source:
  edition: SBLGNT
  text: ἐγὼ δέδωκα αὐτοῖς τὸν λόγον σου, καὶ ὁ κόσμος ἐμίσησεν αὐτούς, ὅτι οὐκ εἰσὶν ἐκ τοῦ κόσμου καθὼς ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/014.yaml
  text: I have given them your word[a], and the world has hated them because they are not of the world, just as I am not of the world.
translation:
  language: ru
  text: Я дал им Твоё слово, и мир возненавидел их, потому что они не от мира[a], как и Я не от мира.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не принадлежат миру»; буквально: «не от мира». Греческий оборот с предлогом «из/от» может указывать как на происхождение, так и на принадлежность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέδωκα
  choice: передал
  rationale: Греческий перфект обозначает совершённое действие с сохраняющимся результатом. В русском контексте «передал» естественно выражает вручение ученикам слова Отца; продолжающийся результат ясен из контекста.
- source_word: λόγον
  choice: слово
  rationale: «Слово» сохраняет характерную для Иоанна лексику и богословскую многозначность, не сужая значение до более пояснительного «весть».
- source_word: κόσμος
  choice: мир
  rationale: Стандартное и широкое соответствие κόσμος; в данном контексте враждебность мира раскрывается сказуемым «возненавидел», поэтому расширительное толкование в основном тексте не требуется.
- source_word: ἐμίσησεν
  choice: возненавидел
  rationale: Аорист передан русским совершенным видом как наступившая враждебная реакция мира; это естественнее буквального «ненавидел» и не исключает продолжающейся ненависти.
- source_word: ὅτι
  choice: потому что
  rationale: 'Союз имеет причинное значение: ненависть мира связана с тем, что ученики не от мира.'
- source_word: ἐκ τοῦ κόσμου
  choice: не от мира
  rationale: Предлог ἐκ прежде всего указывает на источник или происхождение, а в данном обороте также подразумевает принадлежность. «Не от мира» сохраняет эту напряжённость и соответствует естественной библейской речи по-русски.
- source_word: καθὼς
  choice: как и
  rationale: Кратко и ясно выражает прямое сопоставление отношения учеников к миру с отношением Иисуса к миру.
theological_decisions:
- issue: Соотношение учеников и Иисуса с «миром»
  choice: «они не от мира, как и Я не от мира»
  alternative: «они не принадлежат миру, как и Я не принадлежу миру»
  rationale: Прямое сопоставление сохранено без ослабления. Формулировка «не от мира» не сводит ἐκ к одной лишь социальной принадлежности и не добавляет метафизических уточнений, которых сам стих не формулирует.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Местоимения, обращённые к Отцу и произнесённые Иисусом о Себе, написаны с прописной буквы в соответствии с распространённой русской библейской издательской традицией. Синтаксический параллелизм оригинала сохранён.
