  yaml_path: translation/nt/john/017/017.yaml
  text: Sanctify them in the truth[a]; your word is truth.
translation:
  language: ru
  text: 'Освяти их в истине[a]: Твоё слово — истина.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «освяти их истиной». Греческий предлог может обозначать как сферу, так и средство действия.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγίασον
  choice: Освяти
  rationale: Аорист, действительный залог, повелительное наклонение от ἁγιάζω. «Освяти» естественно сохраняет как смысл посвящения Богу, так и значение святости; «отдели» неоправданно сужало бы выражение.
- source_word: αὐτοὺς
  choice: их
  rationale: Винительный падеж множественного числа; местоимение относится к ученикам и прямо передаётся русским объектным местоимением.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: в истине
  rationale: Так сохраняются определённость существительного с артиклем и смысловая широта ἐν, допускающая сферу и средство действия. Вариант «истиной» выделил бы только инструментальное значение.
- source_word: ὁ λόγος ὁ σὸς
  choice: Твоё слово
  rationale: Естественная русская передача выражения «слово, которое Твоё». «Слово» сохраняет прозрачную связь с λόγος и характерную для Иоанна богословскую лексику.
- source_word: ἀλήθειά ἐστιν
  choice: — истина
  rationale: Именная конструкция без связки естественна по-русски и сохраняет субстантивное, вероятно качественное значение без добавления отсутствующего в греческом определённого артикля при сказуемом.
theological_decisions:
- issue: Качественное или идентифицирующее понимание ἀλήθεια во второй части стиха
  choice: Твоё слово — истина
  alternative: Твоё слово — это истина
  rationale: 'Безартиклевое именное сказуемое естественно допускает качественный акцент: Божье слово по своей природе есть истина. Основной перевод не усиливает конструкцию указательным «это», но примечание сохраняет возможное идентифицирующее прочтение.'
- issue: Значение ἐν в просьбе об освящении
  choice: в истине
  alternative: истиной
  rationale: Предложная конструкция сохраняет намеренную смысловую широту греческого текста и не решает однозначно, представлена ли истина преимущественно как сфера освящения или как его средство.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Заглавная буква в «Твоё» отражает обращение Сына к Отцу. Тире естественно оформляет именное сказуемое при отсутствии связки в настоящем времени.
