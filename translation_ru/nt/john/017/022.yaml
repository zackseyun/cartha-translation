source:
  edition: SBLGNT
  text: κἀγὼ τὴν δόξαν ἣν δέδωκάς μοι δέδωκα αὐτοῖς, ἵνα ὦσιν ἓν καθὼς ἡμεῖς ⸀ἕν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/022.yaml
  text: And I have given them the glory that you have given me[a], so that they may be one, just as we are one.
translation:
  language: ru
  text: И Я дал им славу, которую Ты дал Мне,[a] чтобы они были едины, как и Мы едины.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И Я также дал им славу, которую Ты дал Мне». Греческое κἀγώ может иметь добавочный оттенок: «Я также».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: И Я
  rationale: Красис καί + ἐγώ связывает фразу с предыдущим контекстом и подчёркивает подлежащее. «И Я» естественно передаёт эту связь; возможный добавочный оттенок отражён в сноске.
- source_word: δόξαν
  choice: славу
  rationale: В Евангелии от Иоанна δόξα несёт богословский смысл божественной славы, а не только человеческой чести или великолепия.
- source_word: ἣν δέδωκάς μοι
  choice: которую Ты дал Мне
  rationale: Русский совершенный вид естественно передаёт совершившееся дарование с сохраняющимся результатом; относительное «которую» ясно связывает придаточное со «славой».
- source_word: δέδωκα αὐτοῖς
  choice: Я дал им
  rationale: Совершенный вид «дал» естественно выражает завершённое действие; порядок слов сохраняет акцент на «Я».
- source_word: ἵνα ὦσιν
  choice: чтобы они были
  rationale: Передаёт целевое и возможное результирующее значение конструкции ἵνα с сослагательным наклонением без искусственной буквальности.
- source_word: ἓν
  choice: едины
  rationale: «Едины» естественнее по-русски, чем «одно», и сохраняет смысл единства, не превращая многих лиц в одно лицо.
- source_word: καθὼς ἡμεῖς ἕν
  choice: как и Мы едины
  rationale: Сохраняет прямое сравнение единства верующих с единством Отца и Сына, не определяя его природу сверх сказанного в тексте.
theological_decisions:
- issue: Природа единства верующих в сравнении с единством Отца и Сына
  choice: «чтобы они были едины, как и Мы едины»
  alternative: Уточнить единство как исключительно духовное, relational, миссионерское или церковно-институциональное
  rationale: Греческий текст проводит реальное сравнение, но здесь не уточняет его модус. Перевод сохраняет богословскую напряжённость и не привносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавные местоимения «Ты», «Мне», «Мы» применены по принятой русской библейской традиции при обращении Сына к Отцу. Формулировка «были едины» естественна и сохраняет отличие единства от тождества лиц.
