  source_fidelity: 'Перевод точно передаёт синтаксис и смысл греческого текста: κἀγώ отражено как «И Я» с сохранением возможного добавочного оттенка в сноске; оба перфекта δέδωκάς и δέδωκα естественно переданы совершенным видом; цель ἵνα ὦσιν передана союзом «чтобы»; нейтральное ἕν адекватно выражено словами «едины» без сведения многих лиц к одному лицу. Сравнение καθὼς ἡμεῖς ἕν сохранено без богословского уточнения его характера.'
