source:
  edition: SBLGNT
  text: Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ⸂ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τὸν οὐρανὸν εἶπεν⸃· Πάτερ, ἐλήλυθεν ἡ ὥρα· δόξασόν σου τὸν υἱόν, ⸀ἵνα ὁ ⸀υἱὸς δοξάσῃ σέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/001.yaml
  text: 'Jesus said these things, and lifting up his eyes to heaven, he said: “Father, the hour has come. Glorify your Son, so that the Son may glorify you,”'
translation:
  language: ru
  text: 'Сказав это, Иисус поднял глаза к небу и произнёс: «Отец, настал час. Прославь Своего Сына, чтобы Сын прославил Тебя».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα ἐλάλησεν
  choice: Сказав это
  rationale: Деепричастная конструкция естественно передаёт завершённость предшествующей речи и связь с последующим действием; «это» в русском языке идиоматично охватывает сказанное ранее.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: поднял глаза
  rationale: Сохраняет конкретный физический жест, выраженный аористным причастием, без тяжеловесного буквального «подняв Свои глаза».
- source_word: εἰς τὸν οὐρανόν
  choice: к небу
  rationale: Передаёт направительное значение εἰς и естественно сочетается с русским выражением «поднять глаза».
- source_word: Πάτερ
  choice: Отец
  rationale: Точно передаёт звательный смысл без добавления отсутствующего в греческом местоимения «Мой».
- source_word: ἐλήλυθεν ἡ ὥρα
  choice: настал час
  rationale: Русское «настал» естественно выражает наступление решающего момента, а «час» сохраняет важный для Евангелия от Иоанна тематический образ.
- source_word: δόξασόν
  choice: Прославь
  rationale: «Прославить» сохраняет смысловую насыщенность δοξάζω — явление славы и воздание чести — и поддерживает лексическую симметрию фразы.
- source_word: σου τὸν υἱόν
  choice: Своего Сына
  rationale: Возвратно-притяжательное «Своего» нормативно и ясно соотносит Сына с обращённым к Нему Отцом.
- source_word: ἵνα ὁ υἱὸς δοξάσῃ σέ
  choice: чтобы Сын прославил Тебя
  rationale: «Чтобы» передаёт целевое/результативное значение ἵνα; повтор «Сын» сохраняет явную греческую формулировку и взаимность прославления.
theological_decisions:
- issue: Взаимное прославление Отца и Сына
  choice: «Прославь Своего Сына, чтобы Сын прославил Тебя»
  alternative: «Почти Своего Сына, чтобы Он воздал честь Тебе»
  rationale: Повтор одного корня сохраняет богословски значимую симметрию δοξάζω и не сводит понятие славы только к почтению.
- issue: Написание обозначений Отца и Сына
  choice: «Отец», «Сын», а также относящиеся к Богу местоимения с прописной буквы
  alternative: 'Строчные буквы: «отец», «сын», «тебя»'
  rationale: В русском библейском регистре прописные буквы ясно обозначают титульные и адресные употребления в данном контексте, не добавляя нового содержания к исходному тексту.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Синтаксис сделан естественным для русского читателя, при этом сохранены образ «часа», физический жест Иисуса и лексическая симметрия взаимного прославления.
