  text: ὅτε ἤμην μετ’ ⸀αὐτῶν ἐγὼ ἐτήρουν αὐτοὺς ἐν τῷ ὀνόματί σου ⸀ᾧ δέδωκάς μοι, ⸀καὶ ἐφύλαξα, καὶ οὐδεὶς ἐξ αὐτῶν ἀπώλετο εἰ μὴ ὁ υἱὸς τῆς ἀπωλείας, ἵνα ἡ γραφὴ πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/012.yaml
  text: While I was with them[a], I kept them in your name, which you have given me, and I guarded them, and not one of them perished except the son of destruction[b], so that the Scripture might be fulfilled.
translation:
  language: ru
  text: Пока Я был с ними, Я хранил их в Твоём имени, которое Ты дал Мне, и оберегал их; и никто из них не погиб[a], кроме сына погибели[b], чтобы исполнилось Писание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никто из них не был утрачен».'
    reason: lexical_alternative
  - marker: b
    text: '«Сын погибели» — выражение в семитском стиле; возможный смысл: «тот, кому предстоит погибель».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἤμην μετ’ αὐτῶν
  choice: Пока Я был с ними
  rationale: «Пока» естественно передаёт временную связь и длительный характер пребывания Иисуса с учениками.
- source_word: ἐτήρουν αὐτοὺς
  choice: Я хранил их
  rationale: «Хранил» передаёт продолжающееся попечение и позволяет отличить этот глагол от последующего ἐφύλαξα.
- source_word: ἐν τῷ ὀνόματί σου
  choice: во имя Твоё
  rationale: Формулировка сохраняет богословскую ёмкость образа имени, не сводя его лишь к власти или силе.
- source_word: ᾧ δέδωκάς μοι
  choice: которое Ты дал Мне
  rationale: Средний род относительного местоимения согласуется с «именем», а не с учениками; перевод следует грамматике данного греческого текста.
- source_word: καὶ ἐφύλαξα
  choice: и оберегал их
  rationale: «Оберегал» сохраняет оттенок защиты и передаёт отличие φυλάσσω от предшествующего τηρέω.
- source_word: οὐδεὶς ἐξ αὐτῶν ἀπώλετο
  choice: никто из них не погиб
  rationale: «Не погиб» передаёт серьёзный смысл ἀπόλλυμι; возможное значение «не был утрачен» отмечено в сноске.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: сын погибели
  rationale: Формальный перевод сохраняет семитский оборот и его богословское напряжение, не превращая его в развёрнутое утверждение о предопределении.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: чтобы исполнилось Писание
  rationale: Передаёт целевую или результативную силу ἵνα и сохраняет единственное число с определённым Писанием.
theological_decisions:
- issue: К чему относится ᾧ δέδωκάς μοι
  choice: 'Относительное предложение относится к имени: «имя Твоё, которое Ты дал Мне».'
  alternative: 'Отнести слова к ученикам: «тех, кого Ты дал Мне».'
  rationale: В представленном греческом тексте местоимение ᾧ стоит в среднем роде единственного числа и естественно соотносится с ὀνόματι, а не с αὐτούς. Перевод не гармонизирует этот текст с другими формулировками Евангелия.
- issue: Смысл выражения ὁ υἱὸς τῆς ἀπωλείας
  choice: Сохранён семитский оборот «сын погибели».
  alternative: «Тот, кому суждено погибнуть» или традиционное «сын погибели» без пояснения.
  rationale: 'Буквальная идиома сохраняет неоднозначность: она может обозначать человека, характеризуемого погибелью или идущего к ней, но основной текст не уточняет механизм и не вводит доктрину предопределения.'
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Прописные местоимения по отношению к Богу поддерживают традиционный русский библейский регистр. Глаголы «хранил» и «оберегал» сохраняют различие двух близких греческих глаголов, а точка с запятой делает длинную фразу яснее.
