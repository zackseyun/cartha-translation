id: JHN.17.20
reference: John 17:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οὐ περὶ τούτων δὲ ἐρωτῶ μόνον, ἀλλὰ καὶ περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/020.yaml
  text: I do not ask concerning these only[a], but also concerning those who believe in me through their word[b],
translation:
  language: ru
  text: Но Я прошу не только о них, но и о тех, кто верит в Меня через их слово[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через их весть»; «через их проповедь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: прошу
  rationale: В контексте обращения Иисуса к Отцу глагол означает просьбу. «Прошу» естественно по-русски и не добавляет к самому глаголу специальной молитвенной окраски.
- source_word: περὶ τούτων
  choice: о них
  rationale: Оборот περί с родительным указывает, о ком направлена просьба. Местоимение сохраняет отсылку к ближайшим ученикам, не уточняя её сверх текста.
- source_word: μόνον
  choice: только
  rationale: Передаёт ограничительное значение μόνον и естественно входит в русскую конструкцию «не только... но и».
- source_word: ἀλλὰ καὶ
  choice: но и
  rationale: Сохраняет противопоставление и расширение круга тех, о ком просит Иисус.
- source_word: τῶν πιστευόντων
  choice: о тех, кто верит
  rationale: Субстантивированное причастие передано глагольной конструкцией, которая естественна в современном русском и сохраняет процессуальный оттенок.
- source_word: διὰ τοῦ λόγου αὐτῶν
  choice: через их слово
  rationale: «Слово» формально близко λόγος и сохраняет характерный для Иоанна смысловой резонанс; при этом возможное значение «весть, проповедь» отмечено в сноске.
- source_word: εἰς ἐμέ
  choice: в Меня
  rationale: Сочетание πιστεύω εἰς с личным объектом идиоматично передаётся по-русски как «верить в» и выражает личную направленность веры.
theological_decisions:
- issue: Круг людей, охваченных просьбой Иисуса
  choice: 'Форма настоящего времени сохранена: «кто верит», без добавления «будет».'
  alternative: «О тех, кто поверит в Меня» — явное указание на будущих верующих.
  rationale: Греческое причастие настоящего времени само по себе не требует будущего времени. Перевод оставляет открытым, относятся ли слова только к будущим верующим или также к тем, кто уже приходит к вере через свидетельство учеников.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Корреляция «не только... но и» делает греческую структуру естественной по-русски. Заглавные местоимения в обращении к Иисусу соответствуют принятому благоговейному библейскому регистру.
