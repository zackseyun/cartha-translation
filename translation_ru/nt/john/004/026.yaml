lexical_decisions:
- source_word: λέγει
  choice: сказал
  rationale: Греческое историческое настоящее в современном русском повествовании естественно передаётся прошедшим временем.
- source_word: αὐτῇ
  choice: ей
  rationale: Дательный падеж обозначает косвенное дополнение и естественно передаётся русским «ей».
- source_word: Ἐγώ εἰμι
  choice: Это Я
  rationale: В данном контексте формула служит самоидентификации Иисуса как ожидаемого Мессии. Русское «Это Я» идиоматично передаёт это значение, не добавляя прямо слова «Мессия»; буквальное «Я есть» здесь звучало бы неестественно и могло бы затемнить непосредственный смысл.
- source_word: ὁ λαλῶν σοι
  choice: говорящий с тобой
  rationale: Артиклированное причастие передано субстантивированным причастным оборотом. Предлог «с» естественно выражает происходящий разговор, при этом сохраняется значение обращения к женщине.
theological_decisions:
- issue: Следует ли прямо назвать Мессию в основной строке
  choice: 'Сохранить самоидентификацию без добавления слова «Мессия»: «Это Я»'
  alternative: «Я — Мессия»; «Я есть»
  rationale: Предыдущий стих ясно задаёт мессианский референт, однако в греческом тексте этого стиха слово «Мессия» отсутствует. «Это Я» сохраняет контекстуальную идентификацию, не превращая подразумеваемое сказуемое в явное.
- issue: Возможный богословский отзвук формулы Ἐγώ εἰμι
  choice: Не усиливать и не устранять возможный отзвук посредством пояснения в основной строке
  alternative: Формально-буквальное «Я есть»
  rationale: В непосредственном синтаксическом контексте выражение является ответом-самоидентификацией. Русское «Это Я» передаёт эту функцию; сноска сохраняет сведения о более буквальной форме греческого текста.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified реплика. Форма «Это Я» выбрана как естественная русская самоидентификация, а причастный оборот сохраняет компактность и структуру греческой фразы.
