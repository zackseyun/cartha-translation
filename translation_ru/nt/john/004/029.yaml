  text: Δεῦτε ἴδετε ἄνθρωπον ὃς εἶπέ μοι πάντα ⸀ὅσα ἐποίησα· μήτι οὗτός ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/029.yaml
  text: Come[a], see a man who told me everything I have done. Could this be the Messiah?
translation:
  language: ru
  text: «Пойдёмте, посмотрите на человека, который рассказал мне всё, что я сделала. Может быть, он и есть Мессия[a]?»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не он ли Мессия?»'
    reason: Греческая вопросительная частица μήτι выражает осторожность и обычно предполагает отрицательный ответ, однако здесь женщина предлагает другим самим рассмотреть такую возможность.
lexical_decisions:
- source_word: Δεῦτε ἴδετε
  choice: Пойдёмте, посмотрите
  rationale: Два призыва переданы естественным для современного русского языка приглашением, сохраняющим побудительную силу греческого выражения.
- source_word: ἄνθρωπον
  choice: человека
  rationale: В данном контексте слово обозначает конкретного мужчину — Иисуса; русское «человека» точно и естественно передаёт значение без стилистической тяжеловесности.
- source_word: ὃς εἶπέ μοι
  choice: который рассказал мне
  rationale: В сочетании с последующим содержанием глагол λέγω естественно передаётся как «рассказал», а не буквально «сказал мне».
- source_word: πάντα ὅσα ἐποίησα
  choice: всё, что я сделала
  rationale: Передаёт полноту πάντα ὅσα и прошедшие действия женщины; женский род обусловлен говорящей.
- source_word: μήτι
  choice: Может быть
  rationale: Передаёт осторожный, побуждающий к размышлению вопрос, не превращая слова женщины в категорическое утверждение.
- source_word: ὁ χριστός
  choice: Мессия
  rationale: Здесь χριστός употреблено как известный иудейский титул; «Мессия» сохраняет его историко-религиозный смысл.
theological_decisions:
- issue: Передача вопроса с μήτι
  choice: Может быть, Он и есть Мессия?
  alternative: Не Он ли Мессия?
  rationale: Основной вариант сохраняет сомнение и приглашение слушателей самим сделать вывод; альтернатива ближе воспроизводит отрицательную форму греческого вопроса, но по-русски может звучать увереннее оригинала.
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В контексте беседы самарянки речь идёт об ожидаемом Помазаннике, поэтому смысловой перевод титула предпочтительнее его традиционной греческой формы.
translation_notes:
  register: Современный литературный русский язык; речь женщины передана живо и естественно, без архаизмов. Заглавное «Он» использовано как уважительное местоимение в отношении Иисуса и соответствует принятой русской библейской традиции.
