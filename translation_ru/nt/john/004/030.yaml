  text: ἐξῆλθον ἐκ τῆς πόλεως καὶ ἤρχοντο πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/030.yaml
  text: They went out of the city and were coming to him[a].
translation:
  language: ru
  text: Они вышли из города и направлялись к Нему.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Они вышли из города и шли к Нему».'
    reason: 'Лексико-аспектуальная альтернатива: ἤρχοντο можно естественно передать как продолженное движение «шли».'
lexical_decisions:
- source_word: ἐξῆλθον ἐκ τῆς πόλεως
  choice: вышли из города
  rationale: Аорист ἐξέρχομαι с ἐκ обозначает выход из определённого места; «вышли из города» естественно передаёт завершённое отправление, не добавляя лишних оттенков.
- source_word: ἤρχοντο
  choice: направлялись
  rationale: Имперфект ἔρχομαι представляет движение как продолжавшийся процесс. «Направлялись» сохраняет эту незавершённость и естественно звучит при указании цели движения.
- source_word: πρὸς αὐτόν
  choice: к Нему
  rationale: πρός с винительным падежом обозначает движение к человеку. Местоимение относится к Иисусу; прописная буква соответствует принятому русскому библейскому оформлению, не изменяя смысла греческого текста.
