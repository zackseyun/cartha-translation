id: JHN.4.24
reference: John 4:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πνεῦμα ὁ θεός, καὶ τοὺς προσκυνοῦντας αὐτὸν ἐν πνεύματι καὶ ἀληθείᾳ δεῖ προσκυνεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/024.yaml
  text: God is spirit[b][a], and those who worship him must worship in spirit and truth.
translation:
  language: ru
  text: Бог есть дух[b], и те, кто поклоняется Ему, должны поклоняться в духе и истине[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «в Духе и истине». Греческое выражение допускает более конкретное понимание, но основной текст сохраняет его более широкий смысл.'
    reason: alternative_reading
  - marker: b
    text: Слова «Бог есть дух» говорят о природе Бога, а не о том, что Он — лишь одно духовное существо среди других.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: дух
  rationale: Безартиклевое именное сказуемое перед ὁ θεός качественно характеризует природу Бога; форма «Бог есть дух» не представляет Бога одним из множества духов.
- source_word: ὁ θεός
  choice: Бог
  rationale: Артикль указывает, что θεός — подлежащее; «Бог» является естественным и точным русским соответствием.
- source_word: τοὺς προσκυνοῦντας
  choice: те, кто поклоняется
  rationale: Субстантивированное причастие обозначает поклоняющихся как общий класс; выбранная формулировка естественна для современного русского языка.
- source_word: ἐν πνεύματι
  choice: в духе
  rationale: Безартиклевая форма в паре с ἀληθείᾳ допускает широкий смысл поклонения, характеризуемого духовной реальностью, не устраняя возможной связи со Святым Духом.
- source_word: ἀληθείᾳ
  choice: истине
  rationale: «Истина» сохраняет обычный и богословски насыщенный смысл ἀλήθεια у Иоанна, не сводя его лишь к искренности.
- source_word: δεῖ
  choice: должны
  rationale: Передаёт необходимость и обязательность, выраженную безличным δεῖ, в естественной русской конструкции.
- source_word: προσκυνεῖν
  choice: поклоняться
  rationale: Точно передаёт действие в данном контексте; более буквальное «падать ниц» неоправданно усилило бы телесный оттенок.
theological_decisions:
- issue: Смысл выражения «Бог есть дух»
  choice: Качественное утверждение о природе Бога.
  alternative: «Бог — один из духов» или «Бог является духом».
  rationale: Порядок слов и отсутствие артикля у πνεῦμα поддерживают качественный смысл. Традиционная связка «есть» помогает ясно передать утверждение о природе Бога, не причисляя Его к классу духовных существ.
- issue: Смысл выражения «в духе и истине»
  choice: Сохранена широкая формулировка без явного отождествления πνεύματι со Святым Духом.
  alternative: «в Духе и истине»; «искренне и истинно».
  rationale: Греческая форма допускает более конкретное понимание, однако не вынуждает перевод явно обозначать Святого Духа; вместе с тем «истина» не сводится к одной лишь искренности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Связка «есть» сохранена ради ясного качественного утверждения и узнаваемости формулы; местоимение «Ему» написано с прописной буквы в соответствии с распространённой русской библейской практикой.
