  text: λέγει πρὸς αὐτὸν ἡ γυνή· Κύριε, δός μοι τοῦτο τὸ ὕδωρ, ἵνα μὴ διψῶ μηδὲ ⸀διέρχωμαι ἐνθάδε ἀντλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/015.yaml
  text: The woman said to him[a], “Lord, give me this water, so that I may not be thirsty or come here to draw.”
translation:
  language: ru
  text: 'Женщина сказала Ему: «Господи[a], дай мне этой воды, чтобы я не испытывала жажды и не приходила сюда черпать».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господин, дай мне этой воды…»'
    reason: Слово κύριε может быть как обращением «Господи», так и вежливым «господин».
lexical_decisions:
- source_word: λέγει
  choice: сказала
  rationale: Греческий исторический презенс передан прошедшим временем, естественным для современного русского повествования.
- source_word: γυνή
  choice: женщина
  rationale: В контексте речь идёт о самарянке; значение «жена» здесь не подходит.
- source_word: Κύριε
  choice: Господи
  rationale: Сохраняет основное соответствие κύριος и возможный более глубокий смысл обращения в Евангелии от Иоанна; значение вежливого обращения отмечено в сноске.
- source_word: δός μοι τοῦτο τὸ ὕδωρ
  choice: дай мне этой воды
  rationale: Партитивный родительный падеж после «дай» естественен по-русски и точно передаёт просьбу дать названную воду; определение «живой» не добавлено, поскольку в этом стихе его нет.
- source_word: ἵνα μὴ διψῶ
  choice: чтобы я не испытывала жажды
  rationale: Передаёт отрицательную цель и длительный оттенок настоящего сослагательного без излишнего усиления.
- source_word: μηδὲ διέρχωμαι ἐνθάδε
  choice: и не приходила сюда
  rationale: Отрицательная сочинительная связь и направленность к месту разговора естественно переданы по-русски.
- source_word: ἀντλεῖν
  choice: черпать
  rationale: Глагол непосредственно обозначает черпание воды; объект остаётся невыраженным, как и в греческом тексте, но ясен из контекста.
theological_decisions:
- issue: Значение κύριος в обращении самарянки
  choice: Господи
  alternative: Господин
  rationale: В ближайшем контексте слово может быть обычным почтительным обращением, однако в повествовании Иоанна возможно и более глубокое звучание. Основной текст сохраняет традиционное соответствие, а сноска — реальную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным синтаксисом. Формулировка близка к греческому тексту, но исторический презенс естественно передан прошедшим временем. Местоимение «Ему» оформлено с прописной буквы в соответствии с принятым благоговейным библейским регистром.
