  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἤδη δὲ αὐτοῦ καταβαίνοντος οἱ δοῦλοι αὐτοῦ ⸀ὑπήντησαν ⸀αὐτῷ λέγοντες ὅτι ὁ παῖς ⸀αὐτοῦ ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/051.yaml
  text: And while he was already going down[a], his servants met him, saying that his child was alive.
translation:
  language: ru
  text: И когда он уже спускался, его слуги встретили его и сказали, что его ребёнок[a] жив.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сын». Греческое слово может означать «ребёнок», «мальчик», а в некоторых контекстах — «слуга».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: уже
  rationale: Передаёт, что спуск уже продолжался к моменту встречи.
- source_word: δὲ
  choice: и когда
  rationale: Слабая повествовательная связка естественно вводится придаточным времени, без усиления противопоставления.
- source_word: καταβαίνοντος
  choice: спускался
  rationale: Настоящее причастие в родительном абсолютном обороте обозначает продолжающееся одновременное действие; глагол уместен для пути из Каны к Капернауму.
- source_word: δοῦλοι
  choice: слуги
  rationale: В данном бытовом контексте речь идёт о людях из дома чиновника, находящихся у него в подчинении; «слуги» звучит естественно и не устраняет отношения зависимости.
- source_word: ὑπήντησαν
  choice: встретили
  rationale: Ясно передаёт встречу, вероятно, после того как слуги вышли навстречу хозяину.
- source_word: λέγοντες
  choice: и сказали
  rationale: Причастие сопутствующего действия естественно преобразовано в однородный личный глагол русского повествования.
- source_word: παῖς
  choice: ребёнок
  rationale: Слово допускает значения «ребёнок», «мальчик», «сын» и в иных контекстах «слуга»; здесь семейный контекст поддерживает «ребёнок», не требуя уточнения пола самим этим словом.
- source_word: ζῇ
  choice: жив
  rationale: 'Сохраняет настоящее время и живость переданной вести: ребёнок жив сейчас; не добавляет толкования «выздоровел».'
theological_decisions:
- issue: Кого обозначает παῖς в рассказе об исцелении
  choice: его ребёнок
  alternative: его сын; его слуга
  rationale: Ближайший контекст всего эпизода показывает, что речь идёт о сыне чиновника, однако в этом стихе употреблено более широкое παῖς, а не υἱός. Основной текст сохраняет эту лексическую широту, а примечание указывает контекстуально вероятный вариант.
translation_notes:
  register: Современный литературный русский язык; фраза выстроена как естественное повествовательное предложение. «Спускался» сохраняет географическую направленность движения, «жив» — непосредственность сообщения слуг.
