  source_fidelity: Текст точно передаёт родительный абсолют ἤδη δὲ αὐτοῦ καταβαίνοντος как продолжающееся действие в момент встречи («когда он уже спускался»), встречу слуг с ним и содержание их сообщения. «Жив» удачно сохраняет настоящее время ζῇ и не вносит добавочного смысла выздоровления.
