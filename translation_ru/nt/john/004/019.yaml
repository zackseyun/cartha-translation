  yaml_path: translation/nt/john/004/019.yaml
  text: The woman said to him[a], “Lord, I see that you are a prophet.”
translation:
  language: ru
  text: 'Женщина сказала Ему: «Господин[a], я вижу, что Ты пророк».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господи». Греческое κύριε может быть почтительным обращением «господин» или означать «Господи».'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: сказала
  rationale: Греческий текст использует повествовательное настоящее («говорит»), но в современном русском рассказе естественно прошедшее время «сказала».
- source_word: αὐτῷ
  choice: Ему
  rationale: Дательный падеж местоимения обозначает адресата речи; прописная буква соответствует принятому в русском библейском стиле уважительному написанию местоимений, относящихся к Иисусу.
- source_word: ἡ γυνή
  choice: женщина
  rationale: В контексте речь идёт о самарянке, а не о жене; определённость передаётся контекстом и порядком слов.
- source_word: Κύριε
  choice: Господин
  rationale: В данном месте обращение, вероятнее всего, выражает почтение («господин»), не обязательно являясь исповеданием Иисуса как Господа. Возможный более богословски насыщенный перевод сохранён в сноске.
- source_word: θεωρῶ
  choice: я вижу
  rationale: Здесь глагол означает осознание или заключение на основании сказанного Иисусом; «я вижу» естественно передаёт это в современном русском.
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание того, что женщина поняла.
- source_word: προφήτης
  choice: пророк
  rationale: Именная часть сказуемого без артикля указывает, что женщина признаёт Иисуса пророком, но не обязательно отождествляет Его с особым ожидаемым Пророком.
- source_word: σύ
  choice: Ты
  rationale: Явное греческое местоимение имеет некоторое смысловое ударение; русский перевод сохраняет его, причём прописная буква соответствует уважительному библейскому употреблению.
theological_decisions:
- issue: Передача обращения Κύριε к Иисусу
  choice: Господин
  alternative: Господи
  rationale: На данном этапе разговора слово может быть обычным почтительным обращением. Перевод «Господин» не приписывает женщине преждевременного христологического исповедания, а вариант «Господи» указан в сноске для сохранения лексической и богословской неоднозначности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Реплика звучит естественно; историческое настоящее передано прошедшим временем. Неоднозначность обращения κύριε сохранена посредством сноски.
