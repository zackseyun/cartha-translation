  yaml_path: translation/nt/john/004/006.yaml
  text: Jacob’s well was there[a]. So Jesus, wearied from the journey, was sitting there by the well[c][b]. It was about the sixth hour.
translation:
  language: ru
  text: Там находился колодец Иакова[a]. Иисус, утомлённый дорогой, сидел у колодца[b]. Было около шестого часа[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «источник»; греческое πηγή может обозначать как источник, так и колодец.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «так». Слово οὕτως может относиться к состоянию Иисуса или к тому, как Он сидел.'
    reason: lexical_alternative
  - marker: c
    text: При обычном иудейском отсчёте дневных часов — приблизительно полдень. Сам текст не уточняет систему отсчёта.
    reason: alternative_reading
lexical_decisions:
- source_word: πηγή
  choice: колодец
  rationale: Хотя πηγή может означать источник, в данном повествовании речь идёт о месте, откуда черпают воду; «колодец Иакова» естественно звучит по-русски. Возможное значение «источник» сохранено в сноске.
- source_word: κεκοπιακὼς
  choice: утомлённый
  rationale: Перфектное причастие передаёт состояние усталости, наступившее вследствие долгого пути; «утомлённый» сохраняет физический смысл и достойный повествовательный тон.
- source_word: ἐκ τῆς ὁδοιπορίας
  choice: дорогой
  rationale: 'Творительный падеж естественно передаёт причину усталости: Иисус был утомлён совершённым переходом.'
- source_word: ἐκαθέζετο
  choice: сел
  rationale: В данном контексте русское «сел» естественно описывает действие утомлённого путника, хотя греческий имперфект допускает и описательное «сидел».
- source_word: οὕτως
  choice: прямо как был
  rationale: 'Фраза сохраняет трудное наречие οὕτως и вероятный смысл: Иисус сел в том состоянии, в каком находился, не устраняя неоднозначность.'
- source_word: ἐπὶ τῇ πηγῇ
  choice: у колодца
  rationale: Предлог ἐπί с дательным здесь имеет локативное значение; «у колодца» — естественное русское обозначение положения рядом с ним.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: Было около шестого часа
  rationale: Сохраняется исходный способ отсчёта времени, а ὡς передаётся словом «около», без преждевременного выбора современного часового эквивалента.
- source_word: δὲ / οὖν
  choice: нулевое выражение
  rationale: Связность повествования в русском не требует отдельных соответствий этим слабым дискурсивным частицам; добавление «теперь» или «итак» было бы избыточным.
theological_decisions:
- issue: Отсчёт времени в выражении «шестой час»
  choice: Сохранить в основном тексте буквальное выражение «около шестого часа».
  alternative: Около полудня; либо около шести вечера при гипотезе римского отсчёта.
  rationale: Греческий текст не указывает современный часовой эквивалент. Буквальная передача сохраняет существующую хронологическую неоднозначность, не разрешая спор переводческим решением.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным тоном. Сохранены образ колодца, физическая усталость Иисуса, трудное οὕτως и неопределённость древнего обозначения времени.
