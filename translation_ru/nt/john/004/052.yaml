  text: ἐπύθετο οὖν ⸂τὴν ὥραν παρ’ αὐτῶν⸃ ἐν ᾗ κομψότερον ἔσχεν· ⸂εἶπαν οὖν⸃ αὐτῷ ὅτι ⸀Ἐχθὲς ὥραν ἑβδόμην ἀφῆκεν αὐτὸν ὁ πυρετός.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/052.yaml
  text: So he asked them the hour in which he got better. Then they said to him[a], “Yesterday at the seventh hour the fever left him.”
translation:
  language: ru
  text: 'Итак, он спросил у них, в котором часу ему стало лучше. Они ответили ему: «Вчера в седьмом часу[a] лихорадка оставила его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: При отсчёте от восхода солнца — около часа дня; некоторые исследователи полагают, что у Иоанна использован иной отсчёт времени.
    reason: Сохраняет неоднозначность обозначения времени и поясняет один из распространённых вариантов современного соответствия, не превращая его в часть основного текста.
lexical_decisions:
- source_word: ἐπύθετο οὖν
  choice: Итак, он спросил
  rationale: πυνθάνομαι обозначает расспрос или выяснение посредством вопроса; «спросил» естественно по-русски. οὖν связывает вопрос с предшествующим рассказом, что передано словом «итак».
- source_word: τὴν ὥραν παρ’ αὐτῶν
  choice: спросил у них, в котором часу
  rationale: παρά с родительным указывает на источник сведений; русское «спросил у них» передаёт это естественно. «В котором часу» сохраняет конкретное указание на час и звучит современно.
- source_word: ἐν ᾗ κομψότερον ἔσχεν
  choice: в котором часу ему стало лучше
  rationale: Выражение κομψότερον ἔχειν означает улучшение состояния здоровья. «Ему стало лучше» передаёт наступление улучшения, не утверждая полного выздоровления.
- source_word: εἶπαν οὖν αὐτῷ
  choice: Они ответили ему
  rationale: Буквально — «они сказали ему»; в контексте речь является ответом на вопрос, поэтому «ответили» естественно передаёт функцию высказывания. Повторное οὖν служит переходом к ответу и не требует отдельного русского соответствия.
- source_word: Ἐχθὲς ὥραν ἑβδόμην
  choice: Вчера в седьмом часу
  rationale: Сохранено буквальное обозначение часа без перевода в современную систему времени, поскольку сам текст не уточняет способ отсчёта.
- source_word: ἀφῆκεν αὐτὸν ὁ πυρετός
  choice: горячка оставила его
  rationale: Сохранена греческая образная конструкция, в которой горячка является подлежащим. «Горячка» — понятное литературное обозначение лихорадочного состояния, а «оставила его» близко передаёт ἀφῆκεν αὐτόν.
theological_decisions:
- issue: Способ отсчёта «седьмого часа»
  choice: Оставить в основном тексте «в седьмом часу»
  alternative: Около часа дня при отсчёте от восхода солнца; при иной системе отсчёта возможно другое современное соответствие
  rationale: Греческий текст не называет систему исчисления времени. Буквальная передача сохраняет эту подлинную неопределённость и не навязывает спорное хронологическое толкование.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Формулировка сохраняет достоинство библейского рассказа, не перегружая его архаизмами; буквальное обозначение часа сопровождено сноской.
