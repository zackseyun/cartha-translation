lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Союз отмечает лёгкое противопоставление словам учеников и естественно передаёт развитие диалога.
- source_word: εἶπεν αὐτοῖς
  choice: Он сказал им
  rationale: Прямой и естественный эквивалент, сохраняющий повествовательный стиль.
- source_word: Ἐγὼ
  choice: У Меня
  rationale: Русская конструкция «У Меня есть» естественно передаёт значение обладания; прописная буква соответствует принятому благоговейному оформлению речи об Иисусе.
- source_word: βρῶσιν
  choice: пища
  rationale: Слово обозначает здесь пищу; этот выбор сохраняет буквальный образ, который получает объяснение в последующем контексте.
- source_word: ἔχω φαγεῖν
  choice: У Меня есть пища
  rationale: В русском языке назначение пищи для еды очевидно, поэтому буквальное добавление «чтобы есть» было бы тяжеловесным и неестественным.
- source_word: ἣν ὑμεῖς οὐκ οἴδατε
  choice: о которой вы не знаете
  rationale: Предложное управление естественно для современного русского языка и передаёт неосведомлённость учеников об этой пище; противопоставление, выраженное ὑμεῖς, ясно из местоимения «вы».
theological_decisions:
- issue: Метафорический смысл слова «пища»
  choice: Сохранить в основном тексте буквальное слово «пища», не объясняя метафору заранее.
  alternative: Передать смысл толкованием, например «У Меня есть духовная пища».
  rationale: Иисус объясняет образ в следующем контексте; данный стих намеренно допускает непонимание учеников, поэтому перевод не должен преждевременно устранять эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с естественным синтаксисом и сдержанно возвышенным библейским регистром. Образ «пищи» сохранён без преждевременного истолкования.
