  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Ἐμὸν βρῶμά ἐστιν ἵνα ⸀ποιήσω τὸ θέλημα τοῦ πέμψαντός με καὶ τελειώσω αὐτοῦ τὸ ἔργον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/034.yaml
  text: Jesus said to them[b][a], “My food is to do the will of him who sent me and to complete his work.”
translation:
  language: ru
  text: 'Иисус сказал им: «Моя пища — исполнять волю Того, кто послал Меня[a], и завершить Его дело[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Того, кто послал Меня» — по контексту Отец, хотя здесь греческий текст прямо не называет Его.
    reason: cross_reference
  - marker: b
    text: 'Или: «довести до конца Его дело».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμά
  choice: пища
  rationale: Сохраняет конкретную метафору и связь с предшествующим разговором учеников о буквальной еде.
- source_word: ἵνα ποιήσω τὸ θέλημα
  choice: исполнять волю
  rationale: Естественная для современного русского передача оборота, обозначающего содержание того, что Иисус называет Своей пищей; «исполнять волю» точнее и идиоматичнее, чем буквальное «делать волю».
- source_word: τοῦ πέμψαντός με
  choice: Пославшего Меня
  rationale: Передаёт субстантивированное причастие без добавления отсутствующего в греческом тексте титула «Отец».
- source_word: τελειώσω
  choice: завершить
  rationale: Передаёт доведение дела до конца и сохраняет возможный оттенок осуществления поставленной цели.
- source_word: ἔργον
  choice: дело
  rationale: Естественно обозначает порученное служение или миссию, не сужая значение до отдельной задачи.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Иисус сказал им
  rationale: Историческое настоящее передано прошедшим временем в соответствии с естественным русским повествовательным стилем.
theological_decisions:
- issue: Кого обозначает «Пославший Меня»
  choice: Сохранить в основном тексте неявное обозначение «Пославшего Меня».
  alternative: 'Передать явно: «Отца, пославшего Меня».'
  rationale: В контексте Евангелия речь идёт об Отце, однако в самом греческом стихе титул не назван; перевод не должен добавлять его в основной текст.
- issue: Связь между исполнением воли и завершением дела
  choice: 'Сохранить два соединённых элемента: «исполнять волю… и завершить… дело».'
  alternative: Объединить их как одно истолкованное описание миссии.
  rationale: Греческий текст координирует два глагола, и перевод сохраняет как их тесную связь, так и различие.
translation_notes:
  register: Современный литературный русский с достоинством и ясностью. Сохранена конкретная метафора «пища», а синтаксис слегка адаптирован к естественной русской речи. Местоимения, относящиеся к Иисусу и Пославшему Его, написаны с прописной буквы как допустимая русская библейская издательская норма.
