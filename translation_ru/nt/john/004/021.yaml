  text: λέγει αὐτῇ ὁ Ἰησοῦς· ⸂Πίστευέ μοι, γύναι⸃, ὅτι ἔρχεται ὥρα ὅτε οὔτε ἐν τῷ ὄρει τούτῳ οὔτε ἐν Ἱεροσολύμοις προσκυνήσετε τῷ πατρί.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/021.yaml
  text: Jesus said to her[a], “Believe me, woman[c][b], an hour is coming when neither on this mountain nor in Jerusalem will you worship the Father.”
translation:
  language: ru
  text: 'Иисус сказал ей: «Поверь Мне, женщина: наступает час, когда вы не будете поклоняться Отцу ни на этой горе, ни в Иерусалиме».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστευέ μοι
  choice: Поверь Мне
  rationale: Настоящее повелительное наклонение с местоимением в дательном падеже выражает прямой призыв принять слова Иисуса за истину. «Поверь Мне» естественно по-русски и сохраняет связь с лексемой πιστεύω; значение «доверься Мне» также возможно, но сильнее подчёркивает личное упование.
- source_word: γύναι
  choice: женщина
  rationale: Звательная форма γύναι буквально означает «женщина» и в данном контексте является уважительным обращением, а не грубостью. Более мягкие варианты вроде «уважаемая» добавляли бы отсутствующий в тексте оттенок.
- source_word: ἔρχεται ὥρα
  choice: наступает час
  rationale: Сохранено слово «час», важное для тематического языка Евангелия от Иоанна. Русское «наступает час» естественно передаёт приближение определяющего момента, не раскрывая преждевременно его точного богословского содержания.
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: на этой горе
  rationale: При обозначении места поклонения русское «на этой горе» естественно передаёт греческое ἐν с топографическим объектом.
- source_word: ἐν Ἱεροσολύμοις
  choice: в Иерусалиме
  rationale: Нормальная русская форма названия города и соответствующий местный предлог.
- source_word: προσκυνήσετε
  choice: вы будете поклоняться
  rationale: Форма второго лица множественного числа будущего времени сохранена. «Поклоняться» передаёт религиозное значение προσκυνέω в контексте Ин 4 лучше, чем более узкое «кланяться».
- source_word: τῷ πατρί
  choice: Отцу
  rationale: В контексте речь идёт о Боге как Отце; прописная буква уместно передаёт употребление слова как божественного наименования.
- source_word: οὔτε ... οὔτε
  choice: не ... и не
  rationale: Русская парная конструкция естественно и точно сохраняет отрицание обоих мест поклонения.
theological_decisions:
- issue: Тон обращения γύναι
  choice: Буквально передано как «женщина», с пояснением уважительного характера в сноске
  alternative: «Уважаемая» или иное смягчённое обращение
  rationale: Так сохраняется исходная формулировка без внесения дополнительных оттенков и одновременно предотвращается ошибочное восприятие обращения как грубого.
- issue: Иоанновский мотив ὥρα
  choice: Сохранено «час»
  alternative: «время» или «пора»
  rationale: «Час» сохраняет повторяющийся тематический язык Иоанна и не снимает напряжения относительно решающего момента в Божьем замысле.
- issue: Неопределённость ἔρχεται ὥρα
  choice: «наступает час» с примечанием о возможном понимании
  alternative: «наступает тот час»
  rationale: В греческом существительное стоит без артикля, однако у Иоанна «час» нередко имеет тематический характер. Русский основной текст не должен искусственно разрешать эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-сдержанный. Синтаксис естественен для широкой аудитории; сохранены ключевые иоанновские слова «верить», «час», «поклоняться» и «Отец». Местоимение «Мне» написано с прописной буквы в соответствии с распространённой русской библейской издательской традицией.
