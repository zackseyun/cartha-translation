  text: Are you greater than our father Jacob[a], who gave us the well and drank from it himself, as did his sons and his livestock?
translation:
  language: ru
  text: Неужели ты величественнее нашего праотца Иакова[a], который дал нам колодец и сам пил из него, и его сыновья, и его скот тоже пили из него?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты ведь не величественнее нашего праотца Иакова?» Греческий вопрос с μή предполагает отрицательный ответ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ
  choice: Неужели ты
  rationale: Частица μή вводит вопрос, предполагающий отрицательный ответ, а местоимение σὺ имеет эмфатический характер. «Неужели ты» естественно передаёт и ожидаемое «нет», и обращённый к собеседнику вызов.
- source_word: μείζων
  choice: больше
  rationale: Сравнительная форма означает здесь превосходство по значимости или достоинству, а не физический размер. Русское «больше» сохраняет краткость и естественную многозначность оригинала.
- source_word: τοῦ πατρὸς ἡμῶν Ἰακώβ
  choice: нашего праотца Иакова
  rationale: «Праотец» ясно передаёт обращение к Иакову как к почитаемому предку и естественнее в современном русском, чем буквальное «нашего отца Иакова».
- source_word: ἔδωκεν ἡμῖν τὸ φρέαρ
  choice: дал нам этот колодец
  rationale: Аорист передан простым прошедшим временем; φρέαρ в данном контексте означает колодец. Указательное «этот» естественно отсылает к колодцу, у которого происходит разговор.
- source_word: καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν
  choice: и сам пил из него
  rationale: «Сам» сохраняет эмфатическую функцию αὐτός, а «из него» естественно передаёт связь с упомянутым колодцем.
- source_word: οἱ υἱοὶ αὐτοῦ
  choice: его сыновья
  rationale: υἱοί здесь конкретно обозначает сыновей Иакова, поэтому родовое «дети» было бы менее точным.
- source_word: τὰ θρέμματα αὐτοῦ
  choice: скот
  rationale: Слово обозначает домашних животных, которых содержат и кормят. «Скот» — точное, широкое и понятное русское соответствие без неоправданного сужения до крупного рогатого скота.
theological_decisions:
- issue: Сила риторического вопроса с μή
  choice: Вопрос с «неужели», предполагающий ответ «нет»
  alternative: «Ты ведь не больше нашего праотца Иакова?»
  rationale: Форма с «неужели» передаёт ожидаемый отрицательный ответ, но не превращает вопрос женщины в прямое утверждение и сохраняет его риторическое напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Праотец» сохраняет значение почитаемого родоначальника, а конструкция «как и его сыновья и скот» делает перечисление естественным и ясным.
