  text: τῇ τε γυναικὶ ἔλεγον ὅτι Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν· αὐτοὶ γὰρ ἀκηκόαμεν, καὶ οἴδαμεν ὅτι οὗτός ἐστιν ἀληθῶς ὁ σωτὴρ τοῦ ⸀κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/042.yaml
  text: And they were saying to the woman[a], “We no longer believe because of your word, for we ourselves have heard[b], and we know that this one truly is the Savior of the world.”
translation:
  language: ru
  text: 'И они говорили женщине: «Теперь мы верим уже не из-за твоих слов[a], ведь мы сами услышали и знаем, что именно Он[b] — поистине Спаситель мира».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «из-за твоей речи». Греческое слово обозначает сказанное женщиной, её устное свидетельство.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «этот». Греческое указательное местоимение подчёркнуто указывает на Иисуса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε γυναικὶ ἔλεγον
  choice: И они говорили женщине
  rationale: Дательный обозначает адресата, τε передаёт мягкую связь с предшествующим повествованием, а несовершенный вид «говорили» естественно отражает имперфект ἔλεγον.
- source_word: Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν
  choice: Теперь мы верим уже не из-за твоих слов
  rationale: Οὐκέτι указывает, что прежнее основание веры больше не является определяющим; λαλιά здесь означает сказанное женщиной, её устное свидетельство. «Твои слова» звучит естественно и не добавляет того, что прямо не выражено в тексте.
- source_word: αὐτοὶ γὰρ ἀκηκόαμεν
  choice: ведь мы сами услышали
  rationale: «Сами» сохраняет усилительное αὐτοί и подчёркивает непосредственное восприятие в отличие от чужого рассказа. Русское совершенное прошедшее естественно передаёт завершённое слушание с сохраняющимся результатом, выраженное греческим перфектом.
- source_word: καὶ οἴδαμεν
  choice: и знаем
  rationale: οἴδαμεν имеет настоящее статическое значение «знаем».
- source_word: οὗτός ἐστιν ἀληθῶς
  choice: именно Он — поистине
  rationale: «Именно Он» передаёт указательную и подчёркнутую силу οὗτος без неестественного русского «этот», а «поистине» сохраняет торжественный оттенок ἀληθῶς.
- source_word: ὁ σωτὴρ τοῦ κόσμου
  choice: Спаситель мира
  rationale: Это прямое и традиционно понятное соответствие, сохраняющее широкий смысл κόσμος и не добавляющее таких уточнений, как «всего» или «всех людей».
theological_decisions:
- issue: Объём исповедания самарян и значение «мира»
  choice: «Спаситель мира»
  alternative: «Спаситель всех людей» или сужение значения до отдельной группы
  rationale: Греческий текст даёт широкое христологическое исповедание, но не разъясняет здесь его систематико-богословские границы. Перевод сохраняет эту широту и напряжение без добавочных ограничений или пояснений.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием исповедания. Синтаксис остаётся доступным; «поистине» сохраняет достоинство исходной формулировки, а «именно Он» естественно передаёт греческое указательное ударение.
