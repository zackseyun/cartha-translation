  footnotes:
  - marker: a
    text: 'Или: «снова отправился в Галилею». Греческое наречие πάλιν может означать «снова», но здесь, вероятно, указывает на возвращение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῆκεν
  choice: оставил
  rationale: В данном контексте ἀφίημι означает оставить место; «оставил Иудею» прямо и естественно передаёт конструкцию с прямым дополнением.
- source_word: τὴν Ἰουδαίαν
  choice: Иудею
  rationale: Общепринятое русское название географической области; винительный падеж соответствует синтаксису исходного текста.
- source_word: ἀπῆλθεν
  choice: вернулся
  rationale: Глагол движения ἀπέρχομαι вместе с πάλιν здесь естественно передаётся одним русским глаголом «вернулся», поскольку речь идёт о возвращении в Галилею.
- source_word: πάλιν
  choice: вернулся
  rationale: Значение наречия «снова, обратно» включено в глагол «вернулся»; это естественнее по-русски, чем буквальное «пошёл снова».
- source_word: εἰς τὴν Γαλιλαίαν
  choice: в Галилею
  rationale: εἰς обозначает направление движения; по-русски с названием области нормативно «в Галилею».
