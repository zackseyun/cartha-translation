    rationale: πάντα ἑωρακότες ὅσα ἐποίησεν — причастный оборот, который сообщает предшествующее видение как фон к их приёму. Перевод «потому что видели» возможен, но фиксирует причинность сильнее, чем грамматика требует.
  - severity: low
    issue: «Радушно» добавляет степень благожелательности.
    rationale: ἐδέξαντο обозначает благоприятный приём в контексте, но не содержит отдельного усилителя, соответствующего «радушно».
