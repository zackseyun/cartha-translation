  to: Итак, когда Он пришёл в Галилею, галилеяне приняли Его[a], видев всё, что Он сделал в Иерусалиме во время праздника[b], ибо они тоже были на празднике.
  rationale: Перевод сохраняет повествовательную связку οὖν («Итак»), направленное прибытие в Галилею, благоприятное значение ἐδέξαντο без добавленного усиления и пояснительно-фоновую функцию совершенного причастия ἑωρακότες. «Были на празднике» естественно передаёт, что галилеяне ранее прибыли туда и потому видели действия Иисуса. Примечания приведены в соответствие с русским текстом и не выходят за пределы контекстуально обоснованного пояснения.
