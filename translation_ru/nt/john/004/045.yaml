base_translation:
  language: en
  yaml_path: translation/nt/john/004/045.yaml
  text: So when he came into Galilee[a], the Galileans welcomed him, having seen all that he had done in Jerusalem at the feast[b], for they too had gone to the feast.
translation:
  language: ru
  text: Итак, когда Он пришёл в Галилею, галилеяне приняли Его[a], видев всё, что Он сделал в Иерусалиме во время праздника[b], ибо они тоже были на празднике.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «радушно встретили Его». Греческий глагол может означать «принять» или «оказать благожелательный приём»; контекст указывает на благоприятную встречу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во время торжества». Греческое слово обозначает религиозный праздник; в ближайшем контексте имеется в виду праздник в Иерусалиме.'
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Итак, когда
  rationale: «Итак» сохраняет связующую и выводно-повествовательную силу οὖν, а сочетание естественно вводит придаточное времени.
- source_word: ἦλθεν εἰς τὴν Γαλιλαίαν
  choice: Он пришёл в Галилею
  rationale: Передаёт направленное движение в область без неестественного буквального оборота.
- source_word: ἐδέξαντο αὐτὸν
  choice: радушно приняли Его
  rationale: Глагол δέχομαι допускает значение «принять», а контекст указывает на благожелательный приём; наречие передаёт этот оттенок естественно по-русски.
- source_word: οἱ Γαλιλαῖοι
  choice: галилеяне
  rationale: Краткое и общепонятное этногеографическое обозначение жителей Галилеи.
- source_word: πάντα ἑωρακότες ὅσα
  choice: потому что видели всё, что
  rationale: Причастный оборот сообщает обстоятельство, объясняющее приём Иисуса; русское причинное придаточное звучит естественнее и не устраняет смысловой связи.
- source_word: ἐποίησεν
  choice: Он совершил
  rationale: «Совершил» достойно и естественно передаёт широкое ποιέω применительно к делам Иисуса; предшествование ясно из контекста.
- source_word: ἐν Ἱεροσολύμοις
  choice: в Иерусалиме
  rationale: Стандартная передача местного значения.
- source_word: ἐν τῇ ἑορτῇ
  choice: во время праздника
  rationale: Передаёт временное значение и указывает на религиозный праздник в Иерусалиме.
- source_word: καὶ αὐτοὶ γὰρ
  choice: ведь они тоже
  rationale: «Ведь» сохраняет пояснительную силу γάρ, а «тоже» — включающее ударение καὶ αὐτοί.
- source_word: ἦλθον εἰς τὴν ἑορτήν
  choice: ходили на этот праздник
  rationale: Оборот естественно сообщает об их предшествующем посещении праздника; указательное «этот» ясно отсылает к уже названному празднику.
