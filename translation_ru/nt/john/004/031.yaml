translation:
  language: ru
  text: 'Тем временем ученики просили Его: «Равви[a], поешь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Равви» — иудейское почтительное обращение к учителю; означает «Учитель».
