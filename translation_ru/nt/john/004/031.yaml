lexical_decisions:
- source_word: Ἐν τῷ μεταξὺ
  choice: Тем временем
  rationale: Естественно передаёт временной оборот со значением происходящего в промежутке между событиями.
- source_word: ἠρώτων
  choice: уговаривали
  rationale: Имперфект указывает на продолженное или повторяющееся действие, а контекст придаёт просьбе настойчивый оттенок.
- source_word: αὐτὸν
  choice: Его
  rationale: Местоимение относится к Иисусу; в русском библейском тексте уважительное написание с прописной буквы уместно.
- source_word: οἱ μαθηταὶ
  choice: ученики
  rationale: Определённая группа учеников ясна из контекста; притяжательное местоимение добавлять не требуется.
- source_word: λέγοντες
  choice: двоеточие перед прямой речью
  rationale: В русском языке содержание сопутствующей речи естественно вводится непосредственно после глагола просьбы; отдельное «говоря» было бы тяжеловесно.
- source_word: Ῥαββί
  choice: Равви
  rationale: Сохранён иудейский титул-обращение, имеющий значение «Учитель» и характерный для Евангелия от Иоанна.
- source_word: φάγε
  choice: поешь
  rationale: Аорист повелительного наклонения передаёт прямое побуждение; «поешь» естественнее в русском обращении и сохраняет смысл просьбы принять пищу.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая, естественная прямая речь. Продолженность ἠρώτων выражена несовершенным видом «уговаривали», а λέγοντες передано русской пунктуационной конструкцией без избыточного «говоря».
