  text: 'For in this the saying is true: one is the one sowing[c][b][a], and another the one reaping.'
translation:
  language: ru
  text: 'Ибо в этом случае верно изречение: «Один сеет, а другой жнёт».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «один — сеющий, а другой — жнущий». Слово, переведённое как «изречение», можно также передать как «высказывание» или «поговорка».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ τούτῳ
  choice: Ведь здесь
  rationale: Передаёт пояснительную силу γάρ и указание ἐν τούτῳ на рассматриваемую ситуацию; по-русски звучит естественно и не уточняет референт сверх текста.
- source_word: ὁ λόγος
  choice: изречение
  rationale: В данном контексте λόγος обозначает известное высказывание или сентенцию, а не богословский титул «Слово». «Изречение» сохраняет обобщённый, пословичный характер, не утверждая формально, что это народная пословица.
- source_word: ἀληθινός
  choice: верно
  rationale: Предикативное наречие естественно по-русски выражает истинность и применимость изречения.
- source_word: ὅτι
  choice: двоеточие и кавычки
  rationale: ὅτι вводит содержание изречения; русская пунктуация ясно и естественно оформляет его как прямую формулировку.
- source_word: ἄλλος ... καὶ ἄλλος
  choice: один ... а другой
  rationale: Сохраняет противопоставление двух различных участников; союз «а» естественно выражает контраст в русском языке.
- source_word: ὁ σπείρων
  choice: сеет
  rationale: Субстантивированное причастие передано личной формой при местоимении «один»; это естественнее буквального «сеющий» и сохраняет действие без превращения его в отдельный термин.
- source_word: ὁ θερίζων
  choice: жнёт
  rationale: Параллельная личная форма при «другой» естественно передаёт субстантивированное причастие и сохраняет симметрию изречения.
theological_decisions:
- issue: Кого обозначают сеющий и жнущий
  choice: Оставить участников неопределёнными, как в греческом тексте
  alternative: Прямо отождествить сеющего с пророками, Иоанном Крестителем или Иисусом, а жнущего — с учениками
  rationale: Сам стих формулирует общее изречение, а его применение раскрывается контекстом. Конкретизация в переводе устранила бы намеренную открытость текста.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная формулировка сохраняет характер сентенции. «Жнёт» — общепонятное и уместное в земледельском образе слово. Кавычки выделяют содержание изречения.
