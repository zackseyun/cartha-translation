  source_fidelity: 'Перевод точно передаёт структуру и смысл греческого текста: «Я послал вас» соответствует ἐγὼ ἀπέστειλα ὑμᾶς; «жать» сохраняет образ θερίζειν; «то, над чем не вы трудились» передаёт относительное ὃ и эмфатическое ὑμεῖς; «Другие трудились» не конкретизирует ἄλλοι; заключительный образ «вы вошли в их труд» намеренно сохраняет εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε без подмены труда его результатом. Русское прошедшее время в обоих случаях «трудились» естественно передаёт предшествующий труд, релевантный настоящей ситуации.'
  naturalness: Текст краток, ясен и соответствует современному литературному русскому языку. Оборот «вошли в их труд» несколько необычен по-русски, однако это оправданное сохранение выразительного и столь же необычного образа оригинала; сноска даёт более идиоматичные интерпретирующие варианты. «Жать» уместно в данном сельскохозяйственном контексте.
