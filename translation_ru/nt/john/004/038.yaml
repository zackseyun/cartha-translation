  text: ἐγὼ ἀπέστειλα ὑμᾶς θερίζειν ὃ οὐχ ὑμεῖς κεκοπιάκατε· ἄλλοι κεκοπιάκασιν, καὶ ὑμεῖς εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/038.yaml
  text: I sent you to reap what you have not labored for[a]; others have labored[b], and you have entered into their labor.
translation:
  language: ru
  text: Я послал вас жать то, над чем не вы трудились. Другие трудились, а вы вошли в их труд.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воспользовались плодами их труда»; «приняли участие в их работе». Буквально: «вошли в их труд».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλα
  choice: послал
  rationale: Аорист передаёт завершённое действие; простое прошедшее время естественно в данном контексте и сохраняет смысл посланничества без пояснительного расширения.
- source_word: θερίζειν
  choice: жать
  rationale: Сохраняет сельскохозяйственный образ контекста и естественно сочетается с подразумеваемой жатвой.
- source_word: ὃ οὐχ ὑμεῖς κεκοπιάκατε
  choice: то, над чем не вы трудились
  rationale: Передаёт субстантивированное относительное местоимение и подчёркнутое ὑμεῖς; оборот «над чем» по-русски ясно связывает предшествующий труд с тем, что теперь жнут.
- source_word: ἄλλοι κεκοπιάκασιν
  choice: другие трудились
  rationale: Сохраняет неопределённость слова «другие» и лексическую связь двух форм κοπιάω. Русское прошедшее время здесь естественно выражает предшествующий труд, результат которого сохраняется.
- source_word: εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε
  choice: вы вошли в их труд
  rationale: Формально передаёт необычный греческий образ, не подменяя сам труд его плодами; совершенный вид «вошли» допускает актуальный результат совершённого действия.
theological_decisions:
- issue: Кого обозначают «другие»
  choice: Референт оставлен неопределённым
  alternative: Прямо указать пророков, Иоанна Крестителя, Иисуса или прежних свидетелей
  rationale: Греческий текст не уточняет, о ком именно идёт речь, поэтому перевод не сужает возможное толкование.
- issue: Смысл выражения «вошли в их труд»
  choice: Сохранён буквальный и неоднозначный образ участия в чужом труде
  alternative: «Воспользовались плодами их труда» или «приняли участие в их работе»
  rationale: Такие варианты делают смысл понятнее, но истолковывают εἰς τὸν κόπον как результат труда либо совместную работу; основной текст сохраняет формулировку источника.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости, параллелизма и сельскохозяйственной метафоры. Местоимение «вы» не капитализировано, поскольку обращение множественное. Необычный оборот «вошли в их труд» намеренно сохранён и пояснён сноской.
