base_translation:
  language: en
  yaml_path: translation/nt/john/004/022.yaml
  text: You worship what you do not know; we worship what we know[a], because salvation is from the Jews.
translation:
  language: ru
  text: Вы поклоняетесь тому, чего не знаете, а мы поклоняемся тому, что знаем, потому что спасение — от иудеев.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от иудейского народа». В Евангелии от Иоанна слово «иудеи» в некоторых контекстах может означать жителей Иудеи, но здесь иудеи противопоставлены самарянам в вопросах поклонения и истории спасения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνεῖτε / προσκυνοῦμεν
  choice: поклоняетесь / поклоняемся
  rationale: В контексте речь идёт о религиозном поклонении; этот русский глагол естественно передаёт смысл, не сводя его к телесному поклону.
- source_word: ὃ
  choice: тому, чего / тому, что
  rationale: Средний род относительного местоимения сохранён естественной русской конструкцией. Перевод «Тому, Кого» сделал бы выражение более личным, чем греческий текст.
- source_word: οἴδατε / οἴδαμεν
  choice: знаете / знаем
  rationale: Прямой эквивалент сохраняет резкое противопоставление между незнанием и знанием предмета поклонения.
- source_word: σωτηρία
  choice: спасение
  rationale: Обычный и контекстуально точный термин для Божьего спасительного действия.
- source_word: ἐκ
  choice: от
  rationale: Передаёт источник или происхождение, сохраняя краткость греческой формулировки.
- source_word: τῶν Ἰουδαίων
  choice: иудеев
  rationale: В данном контексте имеются в виду иудеи как народ и историческая общность, в противопоставлении самарянам; значение «жители Иудеи» здесь слишком узко.
theological_decisions:
- issue: Смысл утверждения «спасение — от иудеев»
  choice: Сохранено утверждение об историческом источнике спасения среди иудейского народа.
  alternative: Уточнить как «Мессия происходит из иудейского народа» или расширить до приоритета иудейского откровения и богослужения.
  rationale: Греческий текст формулирует мысль шире происхождения Мессии, но сам по себе не утверждает этнического превосходства. Буквенно-естественный перевод сохраняет эту богословскую ёмкость.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Параллелизм двух частей сохранён; тире в именной конструкции естественно выделяет заключительное утверждение.
