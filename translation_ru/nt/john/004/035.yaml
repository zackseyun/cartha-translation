base_translation:
  language: en
  yaml_path: translation/nt/john/004/035.yaml
  text: 'Do you not say[a], ‘There are still four months, and then the harvest comes’? Look, I tell you: lift up your eyes and see the fields, that they are white for harvest already.'
translation:
  language: ru
  text: 'Разве не говорите вы: «Ещё четыре месяца — и наступит жатва»? Вот, говорю вам: поднимите глаза и посмотрите на поля — они уже побелели и готовы к жатве.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они уже созрели для жатвы». Буквально: «они белы для жатвы»; этот зримый образ указывает на готовность к сбору урожая.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὑμεῖς λέγετε
  choice: Разве не говорите вы
  rationale: Естественно передаёт отрицательный вопрос и сохраняет лёгкое смысловое выделение местоимения ὑμεῖς благодаря постпозиции «вы».
- source_word: Ἔτι τετράμηνός ἐστιν
  choice: Ещё четыре месяца
  rationale: Кратко и идиоматично обозначает оставшийся до жатвы промежуток времени.
- source_word: ὁ θερισμὸς ἔρχεται
  choice: наступит жатва
  rationale: По-русски о времени жатвы естественно сказать «наступит»; будущее значение обусловлено конструкцией о четырёх оставшихся месяцах.
- source_word: ἰδοὺ
  choice: Вот
  rationale: Современный и достаточно выразительный указательный маркер, привлекающий внимание без архаического оттенка.
- source_word: ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν
  choice: поднимите глаза
  rationale: Сохраняет зримую греческую идиому и звучит естественно по-русски.
- source_word: θεάσασθε
  choice: посмотрите
  rationale: Передаёт призыв к внимательному наблюдению и естественно сочетается с «поднимите глаза».
- source_word: τὰς χώρας
  choice: на поля
  rationale: В контексте жатвы χώρας обозначает возделанные поля, а не страны или местности вообще.
- source_word: λευκαί εἰσιν
  choice: они уже побелели
  rationale: Сохраняет буквальный зрительный образ «белых» полей, при этом русская глагольная форма естественно выражает достигнутое состояние зрелости.
- source_word: πρὸς θερισμόν
  choice: для жатвы
  rationale: Кратко сохраняет сельскохозяйственный образ и не заменяет его прямым толкованием.
- source_word: ἤδη
  choice: уже
  rationale: Сохраняет контраст с ожиданием ещё четырёх месяцев и подчёркивает нынешнюю готовность полей.
theological_decisions:
- issue: Следует ли прямо раскрывать духовный смысл жатвы в основном тексте
  choice: Сохранить сельскохозяйственный образ без явного пояснения его духовного референта
  alternative: 'Передать смысл истолковательно, например: «люди уже готовы, чтобы их собрать»'
  rationale: Хотя в контексте образ относится к готовности людей принять весть, греческий текст продолжает говорить о полях и жатве; перевод не должен устранять метафору или сужать её толкование.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены риторический вопрос, образ поднятых глаз и буквальная белизна полей; порядок слов и пунктуация приспособлены к естественной русской речи.
