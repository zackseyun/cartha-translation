  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καίτοιγε
  choice: хотя
  rationale: Союз вводит уступительное уточнение к предыдущему стиху; «хотя» естественно передаёт эту связь в современном русском языке.
- source_word: Ἰησοῦς αὐτὸς
  choice: Сам Иисус
  rationale: 'Порядок слов и частица «Сам» сохраняют эмфатическое противопоставление: крещение совершал не Иисус лично.'
- source_word: οὐκ ἐβάπτιζεν
  choice: не крестил
  rationale: Русский глагол несовершенного вида передаёт имперфект, допускающий продолженное или обычное действие, без неестественной конструкции «не был крестящим».
- source_word: ἀλλ’
  choice: а
  rationale: В данном противопоставлении лиц русский союз «а» звучит естественнее, чем более резкое «но».
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Его ученики — крестили
  rationale: В греческом повторный глагол опущен; в русском он восстановлен после тире для ясности и сохранения контраста.
theological_decisions:
- issue: Кто совершал крещения в служении Иисуса
  choice: Сам Иисус лично не крестил; крестили Его ученики.
  alternative: «Иисус не крестил, а Его ученики крестили» — без явной передачи эмфазы αὐτός.
  rationale: Перевод сохраняет повествовательное уточнение и подчёркнутое различие между Иисусом и учениками, не добавляя богословского объяснения.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. Заглавные местоимения «Сам», «Его» применены как традиционный русский знак почтения. Конечная запятая отражает синтаксическую зависимость вставного уточнения от контекста Ин. 4:1–3.
