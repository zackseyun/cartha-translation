  text: ἀφῆκεν οὖν τὴν ὑδρίαν αὐτῆς ἡ γυνὴ καὶ ἀπῆλθεν εἰς τὴν πόλιν καὶ λέγει τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/028.yaml
  text: So the woman left her water jar and went into the town and says to the people,
translation:
  language: ru
  text: 'Тогда женщина оставила свой кувшин, пошла в город и говорит людям:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: тогда
  rationale: Передаёт повествовательный переход и следствие из предшествующего разговора естественным русским языком.
- source_word: ὑδρίαν
  choice: кувшин
  rationale: Обычное и понятное обозначение сосуда для воды; принадлежность передана словом «свой».
- source_word: πόλιν
  choice: город
  rationale: Нейтральный современный эквивалент; в данном контексте речь идёт о ближайшем населённом пункте.
- source_word: λέγει
  choice: говорит
  rationale: Сохраняет историческое настоящее греческого текста и его живость, в соответствии с исходной формой.
- source_word: τοῖς ἀνθρώποις
  choice: людям
  rationale: Передаёт общее обозначение жителей без неоправданного сужения до мужчин.
