  yaml_path: translation/nt/john/004/007.yaml
  text: A woman from Samaria came to draw water. Jesus said to her[a], “Give me a drink.”
translation:
  language: ru
  text: 'Женщина из Самарии пришла набрать воды. Иисус сказал ей[a]: «Дай Мне пить».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «приходит… говорит»; в греческом повествовании здесь употреблено историческое настоящее время.'
    reason: лексическая альтернатива
lexical_decisions:
- source_word: Ἔρχεται
  choice: пришла
  rationale: Настоящее время употреблено как историческое настоящее. В русском повествовании прошедшее время звучит естественно и точно передаёт последовательность событий.
- source_word: γυνὴ
  choice: женщина
  rationale: В данном контексте слово обозначает женщину, а не жену; неопределённость сохраняется отсутствием уточняющих определений.
- source_word: ἐκ τῆς Σαμαρείας
  choice: из Самарии
  rationale: Прямо передаёт происхождение или место, откуда пришла женщина, не заменяя формулировку текста этнонимом «самарянка».
- source_word: ἀντλῆσαι ὕδωρ
  choice: набрать воды
  rationale: Инфинитив выражает цель. «Набрать воды» — естественное современное русское выражение для доставания воды из колодца.
- source_word: λέγει αὐτῇ
  choice: сказал ей
  rationale: Греческое историческое настоящее естественно передано русским прошедшим временем.
- source_word: Δός μοι πεῖν
  choice: Дай Мне пить
  rationale: Эта краткая просьба близко воспроизводит конструкцию с повелительным наклонением и инфинитивом и при этом естественна для современного литературного русского.
theological_decisions:
- issue: Значение выражения «из Самарии»
  choice: Сохранено географическое выражение «женщина из Самарии».
  alternative: «Самарянка» или «женщина из города Самарии».
  rationale: Греческий текст этого стиха указывает, что женщина пришла из Самарии, но прямо не употребляет этноним и не уточняет, идёт ли речь именно о городе. Перевод не вносит дополнительных этнических или богословских выводов.
translation_notes:
  register: Современный литературный русский язык; повествование передано естественным прошедшим временем. Реплика Иисуса краткая и прямая, без архаической конструкции «дай Мне напиться»; местоимение «Мне» написано с прописной буквы в соответствии с принятой русской библейской издательской традицией.
