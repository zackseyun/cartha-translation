  text: λέγει αὐτῷ ὁ Ἰησοῦς· Πορεύου· ὁ υἱός σου ζῇ. ⸀ἐπίστευσεν ὁ ἄνθρωπος τῷ λόγῳ ⸀ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς καὶ ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/050.yaml
  text: Jesus said to him[a], “Go; your son lives.” The man believed the word that Jesus spoke to him and went on his way.
translation:
  language: ru
  text: 'Иисус сказал ему: «Иди, твой сын жив». Человек поверил[a] слову, которое сказал ему Иисус, и отправился в путь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доверился слову, которое сказал ему Иисус».'
    reason: 'Лексическая альтернатива: πιστεύω с дательным падежом может подчёркивать не только веру в истинность сказанного, но и доверие этому слову.'
lexical_decisions:
- source_word: Πορεύου
  choice: Иди
  rationale: Настоящее повелительное наклонение передаёт прямое распоряжение уйти и направиться домой; краткое «Иди» естественно сохраняет темп повествования.
- source_word: ὁ υἱός σου
  choice: твой сын
  rationale: υἱός обозначает именно сына, а не ребёнка вообще.
- source_word: ζῇ
  choice: жив
  rationale: Настоящее время выражает, что сын жив; краткая форма сохраняет силу и лаконичность слов Иисуса, не превращая их в обещание только о будущем.
- source_word: ἐπίστευσεν
  choice: поверил
  rationale: При дательном τῷ λόγῳ глагол означает, что человек счёл сказанное истинным и положился на него. «Поверил» сохраняет связь с обычной передачей πιστεύω, не устраняя оттенка доверия.
- source_word: ὁ ἄνθρωπος
  choice: Человек
  rationale: В этом стихе употреблено общее ἄνθρωπος, хотя ранее персонаж назван царским придворным; перевод сохраняет смену обозначения.
- source_word: τῷ λόγῳ
  choice: слову
  rationale: λόγος здесь означает конкретно произнесённое Иисусом высказывание; последующее определительное придаточное разъясняет смысл.
- source_word: ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: которое сказал ему Иисус
  rationale: Формально и естественно передаёт определительное придаточное, относящееся к «слову», без ненужного толкования.
- source_word: ἐπορεύετο
  choice: отправился в путь
  rationale: Имперфект описывает начавшееся и продолжившееся движение человека; выражение естественно передаёт, что он послушался и пошёл своей дорогой.
theological_decisions:
- issue: Передача πιστεύω как отклика на слово Иисуса
  choice: поверил
  alternative: доверился
  rationale: «Поверил» точно обозначает принятие слов Иисуса за истину и не навязывает разграничения между спасительной верой и ситуативной уверенностью. Возможный оттенок личного доверия отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; речь лаконична и достойна. Прямое «Иди» и краткое «твой сын жив» сохраняют сжатую выразительность греческого текста, а «отправился в путь» естественно передаёт дальнейшее движение персонажа.
