  source_fidelity: Текст точно передаёт пояснительный γάρ («Ведь»), учеников Иисуса, их предшествующий уход в город и цель — купить пищу. Русское прошедшее совершенного вида «ушли» в данном повествовательном контексте приемлемо передаёт греческий плюсквамперфект без неестественного утяжеления.
  naturalness: «Ведь Его ученики ушли в город купить еды» звучит естественно и понятно на современном литературном русском. Конструкция «в город купить еды» нормативна и лаконична.
  terminology: «Ученики», «город» и «еда» соответствуют смыслу μαθηταί, πόλις и τροφαί. Написание «Его» с прописной буквы последовательно для уважительного библейского регистра и не влияет на смысл.
