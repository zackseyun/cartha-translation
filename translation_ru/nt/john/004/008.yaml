lexical_decisions:
- source_word: γὰρ
  choice: Ведь
  rationale: Союз вводит пояснение к предыдущей реплике повествования; «ведь» естественно передаёт эту пояснительную связь по-русски.
- source_word: μαθηταὶ αὐτοῦ
  choice: Его ученики
  rationale: Прямое и естественное обозначение учеников Иисуса с сохранением притяжательного отношения.
- source_word: ἀπεληλύθεισαν
  choice: ушли
  rationale: Плюсквамперфект обозначает действие, совершившееся до описываемой сцены; в русском повествовании эта предшествующая завершённость естественно выражается прошедшим совершенного вида.
- source_word: εἰς τὴν πόλιν
  choice: в город
  rationale: Предлог εἰς с винительным обозначает направленное движение; русское «в город» одновременно передаёт направление и естественно звучит в данном контексте.
- source_word: ἵνα
  choice: купить
  rationale: Целевое значение конструкции ἵνα с конъюнктивом естественно выражено русским инфинитивом.
- source_word: τροφὰς
  choice: еды
  rationale: Множественное число греческого существительного здесь имеет собирательное значение; разговорно нейтральное «еда» ясно и точно передаёт смысл.
- source_word: ἀγοράσωσιν
  choice: купить
  rationale: Аорист конъюнктива после ἵνα обозначает намеченную цель; «купить» — точный современный эквивалент.
