base_translation:
  language: en
  yaml_path: translation/nt/john/004/013.yaml
  text: Jesus answered and said to her[a], “Everyone who drinks from this water will be thirsty again.”
translation:
  language: ru
  text: 'Иисус ответил ей: «Всякий, кто пьёт из этой воды, снова будет испытывать жажду».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ
  choice: Иисус ответил ей
  rationale: Русское «ответил» естественно передаёт устойчивую греческую повествовательную формулу «ответил и сказал»; буквальное удвоение здесь звучало бы тяжеловесно и не добавляло бы смысла.
- source_word: Πᾶς ὁ πίνων
  choice: Всякий, кто пьёт
  rationale: Артиклированное причастие настоящего времени выражает общее, относящееся к любому человеку утверждение; «всякий, кто пьёт» сохраняет универсальный охват и достойный современный регистр.
- source_word: ἐκ τοῦ ὕδατος τούτου
  choice: эту воду
  rationale: При глаголе «пить» современный русский обычно использует прямое дополнение без отдельной передачи ἐκ; указательное τούτου ясно сохранено словом «эту».
- source_word: διψήσει πάλιν
  choice: снова будет испытывать жажду
  rationale: Будущее время и значение повторности переданы явно; выражение естественно и точно обозначает возвращение жажды.
theological_decisions:
- issue: Передача двойной речевой формулы ἀπεκρίθη ... καὶ εἶπεν
  choice: Свести к естественному русскому «ответил ей»
  alternative: «ответил и сказал ей»
  rationale: Это обычная семитизированная повествовательная формула. Сжатие не устраняет богословски значимого содержания, но позволяет избежать неестественного для современного русского удвоения.
- issue: Обобщающее мужское выражение Πᾶς ὁ πίνων
  choice: «Всякий, кто пьёт» как универсальное обозначение
  alternative: «Каждый пьющий»
  rationale: Грамматический мужской род здесь не ограничивает высказывание мужчинами; выбранная конструкция относится к любому человеку и сохраняет обобщающий характер оригинала.
translation_notes:
  register: Современный литературный русский язык; речь ясная, сдержанная и достойная. Сохранён контраст между этой физической водой и последующим обещанием Иисуса, без преждевременного богословского истолкования.
