  terminology: «Иисус», «всякий» и «жажда» уместны. «Всякий, кто пьёт» сохраняет обобщающий характер Πᾶς ὁ πίνων, хотя «каждый, кто пьёт» звучит несколько современнее. Двойная формула «ответил и сказал» в русском может быть сжата до «ответил», без смысловой потери.
