  text: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν ⸀αὐτῷ· Οὐκ ἔχω ἄνδρα. λέγει αὐτῇ ὁ Ἰησοῦς· Καλῶς εἶπας ὅτι Ἄνδρα οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/017.yaml
  text: 'The woman answered and said to him[a], “I do not have a husband.” Jesus said to her[b], “You have spoken well: ‘I do not have a husband.’”'
translation:
  language: ru
  text: 'Женщина ответила Ему: «У меня нет мужа[a]». Иисус сказал ей: «Правильно ты сказала: „У меня нет мужа“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может означать как «муж», так и «мужчина»; здесь контекст указывает на мужа.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν
  choice: Женщина ответила
  rationale: Греческая формула буквально сочетает «ответила» и «сказала», но в современном русском удвоение было бы тяжеловесным; глагол «ответила» естественно передаёт всю речевую формулу.
- source_word: Οὐκ ἔχω ἄνδρα
  choice: У меня нет мужа
  rationale: В данном контексте ἀνήρ обозначает мужа, а русская конструкция «у меня нет мужа» естественно передаёт обладание/отношение, выраженное ἔχω.
- source_word: λέγει
  choice: сказал
  rationale: Греческое историческое настоящее передано русским прошедшим временем, обычным для последовательного повествования.
- source_word: Καλῶς εἶπας
  choice: Правильно ты сказала
  rationale: Καλῶς здесь подтверждает истинность и точность слов женщины; «правильно» яснее передаёт этот смысл, чем буквальное, но менее естественное «хорошо».
- source_word: ὅτι Ἄνδρα οὐκ ἔχω
  choice: ': „У меня нет мужа“'
  rationale: ὅτι вводит содержание сказанного; двоеточие и цитата естественно показывают, что Иисус повторяет слова женщины. Повтор исходного текста сохранён.
theological_decisions:
- issue: Значение ἀνήρ в словах женщины
  choice: муж
  alternative: мужчина
  rationale: Хотя ἀνήρ может означать как «мужчина», так и «муж», ближайший контекст и продолжение разговора в стихе 18 указывают на брачные отношения. Перевод «муж» передаёт контекстуальный смысл без дополнительных богословских выводов.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Устранено неестественное для русского повествования удвоение «ответила и сказала», при этом повтор ключевых слов женщины в ответе Иисуса сохранён.
