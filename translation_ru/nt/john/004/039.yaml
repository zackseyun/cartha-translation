  yaml_path: translation/nt/john/004/039.yaml
  text: And many of the Samaritans from that town believed in him because of the word of the woman who was testifying, “He told me everything I did.”
translation:
  language: ru
  text: 'И многие самаряне из того города поверили в него благодаря словам женщины[a], которая свидетельствовала: «Он рассказал мне всё, что я сделала».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благодаря сообщению женщины». Греческое слово λόγος может означать «слово», «сообщение» или «рассказ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκ δὲ τῆς πόλεως ἐκείνης
  choice: И ... из того города
  rationale: Предлог ἐκ обозначает происхождение, а δέ — мягкую связь с предшествующим повествованием. «Город» естественно передаёт πόλις и сохраняет связь с контекстом.
- source_word: πολλοὶ ... τῶν Σαμαριτῶν
  choice: многие самаряне
  rationale: Греческая конструкция имеет партитивный смысл — многие из числа самарян; по-русски это естественно и без потери смысла выражается сочетанием «многие самаряне».
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: поверили в него
  rationale: Сочетание πιστεύω с εἰς выражает веру или доверие, направленное на личность. «Поверили в него» точно и без лишнего истолкования передаёт эту конструкцию.
- source_word: διὰ τὸν λόγον τῆς γυναικός
  choice: благодаря словам женщины
  rationale: διά с винительным падежом указывает на причину. Здесь λόγος обозначает сказанное женщиной — её слова, сообщение или свидетельство; множественное «словам» звучит естественно по-русски и связано с последующей цитатой.
- source_word: μαρτυρούσης
  choice: которая свидетельствовала
  rationale: Настоящее причастие показывает женщину в процессе свидетельства. Придаточное предложение сохраняет этот оттенок и остаётся понятным современному читателю.
- source_word: Εἶπέν μοι
  choice: Он рассказал мне
  rationale: В данном контексте речь идёт не об отдельной реплике, а о раскрытии Иисусом её поступков, поэтому «рассказал мне» естественнее буквального «сказал мне».
- source_word: πάντα ἃ ἐποίησα
  choice: всё, что я сделала
  rationale: πάντα ἃ имеет всеохватный смысл, а аорист ἐποίησα естественно передаётся русским прошедшим временем. Женский род определяется говорящей женщиной.
theological_decisions:
- issue: Смысл выражения πιστεύω εἰς в повествовании Иоанна
  choice: поверили в него
  alternative: доверились ему
  rationale: Выбранный вариант сохраняет направленность веры на Иисуса, но не вводит в стих более узкую богословскую категорию, которой сам текст здесь не формулирует.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Местоимение «него» написано со строчной буквы в соответствии с обычной современной орфографией и без добавления отсутствующего в греческом тексте конфессионального графического выделения.
