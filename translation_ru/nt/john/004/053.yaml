  text: ἔγνω οὖν ὁ πατὴρ ⸀ὅτι ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ εἶπεν αὐτῷ ὁ ⸀Ἰησοῦς· Ὁ υἱός σου ζῇ, καὶ ἐπίστευσεν αὐτὸς καὶ ἡ οἰκία αὐτοῦ ὅλη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/053.yaml
  text: So the father knew that it was at that hour when Jesus said to him[a], “Your son lives,” and he himself believed[b], and his whole household.
translation:
  language: ru
  text: 'Тогда отец понял, что это произошло в тот час, когда Иисус сказал ему: «Твой сын жив». И уверовал он сам, и все его домашние[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Глагол «уверовал» может означать как то, что отец поверил сказанному Иисусом, так и то, что он глубже уверовал в Самого Иисуса; греческий текст этого не уточняет.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω οὖν
  choice: И тогда отец понял
  rationale: ἔγνω передаёт осознание совпадения времени, а οὖν связывает вывод с сообщением слуг в предыдущем стихе. «Тогда» естественно передаёт повествовательно-логическую связь.
- source_word: ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ
  choice: в тот самый час, когда
  rationale: Оборот обозначает конкретный совпавший момент. «Самый» в русском идиоматично подчёркивает тождество часа, не меняя смысла.
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: Иисус сказал ему
  rationale: Прямое и естественное соответствие греческой конструкции с λέγω и косвенным дополнением.
- source_word: Ὁ υἱός σου ζῇ
  choice: Твой сын жив
  rationale: Настоящее время ζῇ выражает нынешнее состояние сына. Краткая русская форма «жив» естественна и не вносит будущего значения.
- source_word: ἐπίστευσεν αὐτὸς
  choice: он сам уверовал
  rationale: «Уверовал» сохраняет характерный для Иоанна религиозный оттенок πιστεύω, а «сам» передаёт эмфатическое αὐτός.
- source_word: ἡ οἰκία αὐτοῦ ὅλη
  choice: весь его дом
  rationale: «Дом» в данном контексте обозначает всех домашних, а не здание; это традиционное, достойное и понятное русское употребление, сохраняющее образ греческого οἰκία.
theological_decisions:
- issue: Смысл веры отца
  choice: «уверовал» без явного дополнения
  alternative: «поверил слову Иисуса» или «обрёл полную веру в Иисуса»
  rationale: Греческий текст не уточняет, идёт ли речь только о доверии конкретному слову Иисуса или о более полной вере в Него. Перевод сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сделан плавным и понятным; подлинная смысловая неопределённость πιστεύω сохранена в сноске.
