    issue: «в тот самый час»
    rationale: «Самый» добавляет эмфатическое «именно/как раз», которого в ἐκείνῃ τῇ ὥρᾳ нет; достаточно «в тот час».
  - severity: medium
    issue: «и весь его дом»
    rationale: Греческое ἡ οἰκία αὐτοῦ ὅλη означает весь его household, а не строение. В русском эллиптическая конструкция также звучит неполной; лучше явно назвать домашних и повторить глагол.
  - severity: low
    issue: 'Сноска a: «продолжает жить»'
    rationale: ζῇ — настоящее состояние «жив», без заложенного значения продолжения. Указанная русская альтернатива вводит дополнительный аспект и не должна сохраняться.
