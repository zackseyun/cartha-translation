  terminology: '«Знамение» — удачный последовательный эквивалент Johannine σημεῖον. Сноска с вариантом «чудо» полезна, но её формулировку следует сделать точнее: речь не о том, что Иоанн просто «называет чудеса» знамениями, а о терминологическом значении слова в Евангелии.'
