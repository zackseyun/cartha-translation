  text: Это было второе знамение, которое Иисус совершил, когда пришёл из Иудеи в Галилею.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чудо». У Иоанна «знамение» подчёркивает не только чудесную силу действия, но и его значение. Слово «вновь» в греческом тексте может относиться либо к совершению знамения, либо к приходу Иисуса в Галилею.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: Это
  rationale: Указывает на только что описанное исцеление; нейтральное «это» естественно передаёт отсылку назад.
- source_word: δὲ
  choice: явно не выражено отдельным словом
  rationale: Слабая связка δέ в русском естественно передаётся ходом повествования; отдельное «же» здесь звучало бы тяжеловесно.
- source_word: πάλιν
  choice: снова
  rationale: Сохраняет значение повторения и непосредственно относится к возвращению Иисуса из Иудеи в Галилею, как и ранее в 4:46.
- source_word: δεύτερον
  choice: второе
  rationale: Точно сохраняет порядковое обозначение знамения.
- source_word: σημεῖον
  choice: знамение
  rationale: Передаёт характерный для Иоанна смысл деяния, которое не только чудесно, но и указывает на более глубокую реальность.
- source_word: ἐποίησεν
  choice: совершил
  rationale: Естественное русское сочетание со словом «знамение»; достоиннее и яснее буквального «сделал».
- source_word: ἐλθὼν
  choice: придя
  rationale: Деепричастие сохраняет обстоятельственную связь с основным глаголом без чрезмерного уточнения временного отношения.
- source_word: ἐκ τῆς Ἰουδαίας
  choice: из Иудеи
  rationale: Стандартно и точно передаёт исходную точку движения.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: в Галилею
  rationale: Естественно передаёт направление движения в современном русском языке.
theological_decisions:
- issue: Терминология σημεῖον у Иоанна
  choice: знамение
  alternative: чудо
  rationale: '«Знамение» сохраняет литературно-богословскую функцию термина у Иоанна: деяние свидетельствует о личности и славе Иисуса, а не только проявляет сверхъестественную силу.'
- issue: Связь πάλιν с ἐλθὼν или с нумерацией знамений
  choice: «снова» связано с приходом Иисуса из Иудеи в Галилею
  alternative: «это было снова второе знамение» / общее указание на повторное совершение знамения
  rationale: Положение πάλιν допускает некоторую гибкость, однако контекст 4:46 и естественный русский синтаксис поддерживают связь с возвращением Иисуса в Галилею; «второе» уже выражает последовательность знамений.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-нейтральный. Сохранён характерный для Евангелия от Иоанна термин «знамение»; синтаксис сделан естественным без утраты смысловых связей оригинала.
