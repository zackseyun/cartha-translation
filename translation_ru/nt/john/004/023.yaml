id: JHN.4.23
reference: John 4:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀλλὰ ἔρχεται ὥρα καὶ νῦν ἐστιν, ὅτε οἱ ἀληθινοὶ προσκυνηταὶ προσκυνήσουσιν τῷ πατρὶ ἐν πνεύματι καὶ ἀληθείᾳ, καὶ γὰρ ὁ πατὴρ τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/023.yaml
  text: But an hour is coming[a], and is now here, when the true worshipers will worship the Father in spirit and truth; for the Father indeed seeks such people to worship him.
translation:
  language: ru
  text: Но наступает время — и уже настало, — когда истинные поклонники будут поклоняться Отцу в духе[a] и истине, ведь именно таких поклонников ищет Отец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Духе». Греческое выражение может означать поклонение, совершаемое силой Святого Духа, поклонение в человеческом духе либо поклонение, которому присуща духовная реальность.'
    reason: Сохраняется неоднозначность ἐν πνεύματι.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт противопоставление предшествующему разговору о месте поклонения естественным русским союзом.
- source_word: ἔρχεται ὥρα
  choice: наступает время
  rationale: Сохраняет временной и эсхатологический смысл выражения; русское «время» здесь естественнее буквального «час» и не требует артиклевой определённости.
- source_word: καὶ νῦν ἐστιν
  choice: и уже настало
  rationale: Ясно передаёт, что ожидаемое время не только приближается, но уже началось.
- source_word: οἱ ἀληθινοὶ προσκυνηταὶ
  choice: истинные поклонники
  rationale: Сохраняет характерное для Иоанна значение подлинности и соответствия истине, не вводя конфессионального разграничения.
- source_word: προσκυνήσουσιν τῷ πατρὶ
  choice: будут поклоняться Отцу
  rationale: Естественно передаёт будущий индикатив и дательный объект при глаголе поклонения.
- source_word: ἐν πνεύματι καὶ ἀληθείᾳ
  choice: в духе и истине
  rationale: Сохраняет существительные и намеренно не уточняет, означает ли πνεῦμα человеческий дух, Святого Духа или духовную сферу и качество поклонения.
- source_word: καὶ γὰρ
  choice: ведь именно
  rationale: «Ведь» вводит основание, а «именно» передаёт дополнительный акцент καί в естественной русской форме.
- source_word: τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν
  choice: именно таких поклонников ищет Отец
  rationale: Причастная конструкция естественно свёрнута в существительное «поклонников»; указание на Отца в конце сохраняет смысл αὐτόν без тяжеловесного повтора «поклоняющихся Ему».
theological_decisions:
- issue: Значение ἐν πνεύματι
  choice: «в духе» в основном тексте, со строчной буквы и с примечанием
  alternative: «в Духе» или «духовно»
  rationale: Греческая форма без артикля допускает несколько богословски значимых пониманий. Перевод не разрешает эту неоднозначность в пользу исключительно человеческого духа или исключительно Святого Духа.
- issue: Характеристика истинных поклонников
  choice: «истинные поклонники»
  alternative: «подлинные поклонники»
  rationale: Формулировка сохраняет иоанновскую категорию истины и не превращает стих в утверждение о принадлежности к какой-либо конфессиональной группе.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Тире выделяют вставное «и уже настало», сохраняя напряжение между наступающим и уже присутствующим временем. Повтор слова «поклонники» выбран ради естественности и смысловой ясности.
