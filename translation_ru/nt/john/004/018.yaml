lexical_decisions:
- source_word: πέντε γὰρ ἄνδρας ἔσχες
  choice: Ведь у тебя было пять мужей
  rationale: γάρ передано объяснительным «ведь»; ἀνήρ в контексте брачных отношений означает «муж», а аорист ἔσχες указывает на прошлую историю женщины.
- source_word: καὶ νῦν ὃν ἔχεις
  choice: и тот, с кем ты теперь живёшь
  rationale: Буквальное «тот, кого ты имеешь» по-русски звучит неестественно и двусмысленно; контекстуальное «с кем ты живёшь» ясно передаёт нынешнюю связь, не называя её браком.
- source_word: οὐκ ἔστιν σου ἀνήρ
  choice: тебе не муж
  rationale: Краткая русская конструкция естественно выражает отсутствие брачного отношения и сохраняет повтор слова ἀνήρ по смыслу.
- source_word: τοῦτο ἀληθὲς εἴρηκας
  choice: Ты сказала правду
  rationale: Идиоматично передаёт греческую конструкцию «это ты сказала истинно» и сохраняет результативную значимость перфекта εἴρηκας.
theological_decisions:
- issue: Значение ἀνήρ в обоих употреблениях
  choice: Передать оба употребления словом «муж» в брачном значении.
  alternative: Передать более буквально как «мужчины / мужчина».
  rationale: Противопоставление прежних пяти мужей нынешнему человеку, который ей «не муж», указывает на брачно-реляционное значение; это контекстуальный лексический выбор, а не привнесённое вероучительное толкование.
- issue: Характер нынешней связи
  choice: «тот, с кем ты теперь живёшь»
  alternative: «тот, кто у тебя теперь есть»
  rationale: Выбранная формулировка естественна в современном русском и сообщает только подразумеваемое контекстом совместное сожительство, не добавляя оценки или юридической характеристики.
translation_notes:
  register: Современный литературный русский, ясный и достойный. «Ведь» естественно вводит основание предыдущих слов Иисуса; финал разбит на отдельное предложение ради русской плавности.
