base_translation:
  language: en
  yaml_path: translation/nt/john/004/020.yaml
  text: Our fathers worshiped on this mountain[b][a], and you say that in Jerusalem is the place where one must worship.
translation:
  language: ru
  text: Наши отцы[a] поклонялись на этой горе, а вы говорите, что место, где должно поклоняться[b], находится в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Наши предки поклонялись на этой горе».'
    reason: 'Лексическая альтернатива: «отцы» буквально сохраняет идиому, а «предки» яснее выражает её историко-родовой смысл.'
  - marker: b
    text: 'Или: «где следует поклоняться»; «где необходимо поклоняться».'
    reason: Лексическая альтернатива, отражающая безличное значение необходимости в δεῖ.
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: наши отцы
  rationale: Буквально передаёт греческое выражение и сохраняет смысл общинной преемственности; в данном контексте речь идёт о предках.
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: на этой горе
  rationale: Естественная русская передача местонахождения места поклонения.
- source_word: προσεκύνησαν
  choice: поклонялись
  rationale: В контексте спора о месте богопочитания глагол обозначает религиозное поклонение.
- source_word: καὶ ὑμεῖς λέγετε
  choice: а вы говорите
  rationale: Русское «а» естественно выражает заложенное контекстом противопоставление между «нашими отцами» и «вами», не усиливая его словами «самаряне» или «иудеи».
- source_word: ἐν Ἱεροσολύμοις
  choice: в Иерусалиме
  rationale: Нормальная современная русская форма названия и локативной конструкции.
- source_word: ὁ τόπος
  choice: место
  rationale: Сохраняет определённость, выраженную греческим артиклем в конструкции со сказуемым, без поясняющего добавления «единственное» или «правильное».
- source_word: ὅπου προσκυνεῖν δεῖ
  choice: где следует поклоняться
  rationale: Передаёт безличную необходимость или установленную должность действия естественной русской конструкцией, не превращая высказывание в обращённое к конкретному лицу повеление.
theological_decisions:
- issue: Следует ли явно назвать стороны спора самарянами и иудеями
  choice: Контраст сохранён в формулировке «наши отцы… а вы говорите…»
  alternative: «Наши самарянские предки… а вы, иудеи, говорите…»
  rationale: Греческий текст обозначает стороны местоимениями и контекстом, но не называет их в этом стихе; добавление этнонимов было бы избыточным толкованием.
- issue: Сила необходимости в προσκυνεῖν δεῖ
  choice: «где следует поклоняться»
  alternative: «где должно поклоняться»; «где необходимо поклоняться»
  rationale: «Следует» сохраняет общий нормативный смысл безличной конструкции. Примечание фиксирует более формальную альтернативу, чтобы не скрывать оттенок необходимости.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Порядок второй части слегка перестроен ради естественного русского синтаксиса; контраст передан союзом «а». Все примечания обозначены в основном тексте.
