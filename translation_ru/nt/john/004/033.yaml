  yaml_path: translation/nt/john/004/033.yaml
  text: So the disciples were saying to one another[a], “Has anyone brought him something to eat?”
translation:
  language: ru
  text: 'Тогда ученики говорили между собой[a]: «Неужели кто-нибудь принёс Ему поесть?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве кто-нибудь принёс Ему поесть?» Греческий вопрос с μή предполагает отрицательный ответ.'
    reason: Передаёт грамматическую особенность вопроса и сохраняет возможную альтернативную формулировку.
lexical_decisions:
- source_word: ἔλεγον
  choice: стали говорить
  rationale: Имперфект передаёт разворачивающийся в сцене разговор; сочетание «стали говорить» естественно выражает его начало и продолженность.
- source_word: οὖν
  choice: тогда
  rationale: Частица связывает реплику с предшествующим контекстом и продолжает повествование; «тогда» естественно в современном русском.
- source_word: οἱ μαθηταὶ
  choice: ученики
  rationale: Обычный и контекстуально точный русский эквивалент μαθηταί в Евангелии от Иоанна.
- source_word: πρὸς ἀλλήλους
  choice: друг другу
  rationale: Передаёт взаимный обмен репликами внутри группы.
- source_word: Μή τις
  choice: Неужели кто-то
  rationale: Вопрос с μή предполагает отрицательный ответ, но остаётся вопросом; «неужели» естественно передаёт удивление и ожидание ответа «нет».
- source_word: ἤνεγκεν αὐτῷ
  choice: принёс Ему
  rationale: В данном контексте φέρω означает принести, а дательный αὐτῷ естественно передаётся русским косвенным дополнением.
- source_word: φαγεῖν
  choice: поесть
  rationale: Субстантивированный смысловой объект при «принёс» идиоматично выражается инфинитивом «поесть», то есть принёс пищу для еды.
theological_decisions: []
translation_notes:
  register: Современный литературный русский, ясный и достойный. Заглавное «Ему» употреблено как традиционная русская форма уважительного местоименного обозначения Иисуса; оно не меняет смысла исходного текста.
