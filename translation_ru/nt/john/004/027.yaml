  text: Καὶ ἐπὶ τούτῳ ἦλθαν οἱ μαθηταὶ αὐτοῦ, καὶ ⸀ἐθαύμαζον ὅτι μετὰ γυναικὸς ἐλάλει· οὐδεὶς μέντοι εἶπεν· Τί ζητεῖς; ἢ τί λαλεῖς μετ’ αὐτῆς;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/027.yaml
  text: And at this point his disciples came[a], and they were amazed that he was speaking with a woman. Yet no one said, “What are you seeking?” or[b], “Why are you speaking with her?”
translation:
  language: ru
  text: 'И в это время пришли Его ученики и удивлялись тому, что Он разговаривает с женщиной. Однако никто не сказал: «Чего Ты хочешь?[a]» — или: «Почему Ты разговариваешь с ней?»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Чего Ты ищешь?» Возможный смысл: «Чего Ты хочешь от неё?»'
    reason: lexical_alternative
  - marker: b
    text: 'Возможна также передача: «О чём Ты говоришь с ней?» По смыслу в данном контексте: «Почему Ты разговариваешь с ней?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τούτῳ
  choice: в это время
  rationale: Оборот имеет временное значение и связывает приход учеников с происходившей беседой; современное русское выражение естественно передаёт совпадение по времени.
- source_word: ἐθαύμαζον
  choice: удивлялись
  rationale: Имперфект передаёт продолжавшуюся реакцию учеников, а нейтральный глагол не усиливает степень их изумления сверх текста.
- source_word: μετὰ γυναικὸς
  choice: с женщиной
  rationale: Существительное без артикля указывает здесь на женщину, а не на жену; перевод сохраняет неопределённость формулировки и не добавляет причины удивления.
- source_word: ἐλάλει
  choice: разговаривает
  rationale: Имперфект описывает беседу, ещё шедшую при появлении учеников. Настоящее время в русском придаточном естественно передаёт одновременность с их удивлением.
- source_word: μέντοι
  choice: однако
  rationale: 'Слово выражает уступительное противопоставление: ученики удивлялись, но не высказали своих вопросов.'
- source_word: Τί ζητεῖς;
  choice: Чего Ты хочешь?
  rationale: В данном контексте ζητέω может выражать вопрос о намерении или желании Иисуса по отношению к женщине. Этот вариант естественен по-русски; более буквальная передача сохранена в примечании.
- source_word: τί λαλεῖς μετ’ αὐτῆς;
  choice: Почему Ты разговариваешь с ней?
  rationale: Буквальное «что Ты разговариваешь с ней?» по-русски неестественно; вопросительное τί в контексте передаёт причину или основание разговора. Примечание отмечает формальную особенность оригинала.
theological_decisions:
- issue: Причина удивления учеников разговором Иисуса с женщиной
  choice: Передать только названный в тексте факт их удивления.
  alternative: Добавить объяснение о гендерных, этнических или религиозных нормах того времени.
  rationale: Греческий текст не уточняет причину реакции учеников; перевод не должен вводить социально-историческое или богословское объяснение в сам стих.
- issue: Направленность первого невысказанного вопроса
  choice: Сохранить обращение к Иисусу без добавления подразумеваемого дополнения.
  alternative: 'Перевести: «Чего Ты хочешь от неё?» или понять вопрос как обращённый к женщине.'
  rationale: Форма ζητεῖς — второе лицо единственного числа и в повествовании естественно относится к Иисусу, однако дополнение в оригинале отсутствует; поэтому «от неё» не добавлено.
translation_notes:
  register: 'Современный литературный русский язык, ясный и сдержанно-достоинственный. Заглавные местоимения в обращении к Иисусу соответствуют принятой русской библейской типографической традиции. Имперфекты переданы с учётом русской естественности: «удивлялись» и настоящее время одновременного действия «разговаривает».'
