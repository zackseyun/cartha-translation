  source_fidelity: 'В основном перевод точно передаёт временную связь, удивление учеников, неопределённое «с женщиной» и невысказанный характер вопросов. Однако εἶπεν означает «сказал», а не «спросил»: вопросы приводятся как то, чего никто не произнёс. Примечание b ошибочно называет неестественную русскую конструкцию буквальной передачей; τί λαλεῖς μετ’ αὐτῆς допускает также смысл «о чём Ты говоришь с ней?», хотя в контексте естественно передавать его как «почему».'
