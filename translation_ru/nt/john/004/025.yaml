  text: λέγει αὐτῷ ἡ γυνή· Οἶδα ὅτι Μεσσίας ἔρχεται, ὁ λεγόμενος χριστός· ὅταν ἔλθῃ ἐκεῖνος, ἀναγγελεῖ ἡμῖν ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/025.yaml
  text: The woman said to him[a], “I know that Messiah is coming” (the one called Messiah). “When he comes, he will tell us all things.”
translation:
  language: ru
  text: 'Женщина сказала ему: «Я знаю, что придёт Мессия[a], называемый Христом. Когда он придёт, он сообщит нам всё».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч.: «Мессия, называемый Христом». Семитский титул «Мессия» поясняется его греческим соответствием «Христос»; оба слова означают «Помазанник».'
    reason: Сноска поясняет сохранённую в оригинале связь между семитским титулом и его греческим соответствием.
lexical_decisions:
- source_word: λέγει
  choice: сказала
  rationale: Историческое настоящее передано естественным для современного русского повествования прошедшим временем.
- source_word: γυνή
  choice: женщина
  rationale: По контексту речь идёт о самарянке; это прямое и естественное обозначение.
- source_word: Οἶδα
  choice: я знаю
  rationale: Прямо и естественно передаёт уверенное знание говорящей.
- source_word: Μεσσίας
  choice: Мессия
  rationale: Сохраняет заимствованный семитский титул, употреблённый в иудейско-самарянском контексте.
- source_word: ἔρχεται
  choice: придёт
  rationale: Настоящее время имеет здесь будущее значение; русское будущее звучит естественно и не добавляет идеи, будто Мессия уже находится в пути.
- source_word: ὁ λεγόμενος χριστός
  choice: то есть Христос
  rationale: Передаёт пояснительную функцию греческой фразы и сохраняет различие между семитским титулом «Мессия» и его греческим соответствием «Христос».
- source_word: ὅταν ἔλθῃ ἐκεῖνος
  choice: когда он придёт
  rationale: Естественно передаёт будущую временную обусловленность; отдельное усиление указательного местоимения по-русски здесь было бы тяжеловесным.
- source_word: ἀναγγελεῖ
  choice: расскажет
  rationale: В данном контексте глагол означает, что Мессия всё сообщит и сделает известным; «расскажет» понятно и естественно для современной речи.
- source_word: ἡμῖν
  choice: нам
  rationale: Прямое соответствие косвенному дополнению.
- source_word: ἅπαντα
  choice: всё
  rationale: Естественно передаёт совокупное значение усиленной формы «всё, все вещи».
theological_decisions:
- issue: Соотношение титулов Μεσσίας и χριστός
  choice: 'В основном тексте сохранены оба обозначения: «Мессия» и поясняющее «Христос».'
  alternative: Передать оба слова одинаково как «Мессия», отметив греческое слово только в сноске.
  rationale: В оригинале χριστός поясняет семитское Μεσσίας для грекоязычного читателя. Русский язык позволяет сохранить эту двуязычную пояснительную структуру без утверждения, будто речь идёт о разных титулах.
translation_notes:
  register: Современный литературный русский язык с ясной разговорной репликой и умеренно торжественной библейской лексикой. Пояснение в скобках отражает авторскую разъяснительную функцию исходной фразы.
