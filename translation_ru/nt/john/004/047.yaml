id: JHN.4.47
reference: John 4:47
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὗτος ἀκούσας ὅτι Ἰησοῦς ἥκει ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν ἀπῆλθεν πρὸς αὐτὸν καὶ ⸀ἠρώτα ἵνα καταβῇ καὶ ἰάσηται αὐτοῦ τὸν υἱόν, ἤμελλεν γὰρ ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/047.yaml
  text: When this man heard that Jesus had come from Judea into Galilee[a], he went to him and asked him to come down and heal his son[b], for he was about to die.
translation:
  language: ru
  text: Услышав, что Иисус пришёл из Иудеи в Галилею, этот человек отправился к нему и просил[a] его спуститься[b] и исцелить его сына, ведь тот был при смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «продолжал просить». Имперфект греческого глагола может подчёркивать продолжительность или повторяемость просьбы.'
    reason: lexical_alternative
  - marker: b
    text: 'Слово «спуститься» отражает перепад высоты между местами в Галилее: из Каны к Капернауму шли вниз.'
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: этот человек
  rationale: Передаёт указательное значение и естественно отсылает к царедворцу, упомянутому в предыдущем стихе.
- source_word: ἀκούσας
  choice: услышав
  rationale: Деепричастие естественно передаёт предшествующее обстоятельство, выраженное аористным причастием.
- source_word: ἥκει
  choice: пришёл
  rationale: Передаёт прибытие Иисуса и возникшее в результате присутствие в Галилее.
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: из Иудеи в Галилею
  rationale: Сохраняет исходный пункт и направление движения без стилистической тяжеловесности.
- source_word: ἀπῆλθεν πρὸς αὐτόν
  choice: отправился к нему
  rationale: Естественно передаёт движение царедворца к Иисусу.
- source_word: ἠρώτα
  choice: просил
  rationale: Русский глагол несовершенного вида сохраняет длительный аспект имперфекта, не навязывая непременно повторность или усиленную эмоциональность.
- source_word: ἵνα καταβῇ
  choice: его спуститься
  rationale: Инфинитивная конструкция естественна после «просил», а «спуститься» сохраняет указание на движение вниз.
- source_word: ἰάσηται
  choice: исцелить
  rationale: Точно и привычно передаёт физическое исцеление в контексте чудес Иисуса.
- source_word: αὐτοῦ τὸν υἱόν
  choice: его сына
  rationale: Сохраняет притяжательное местоимение оригинала; контекст указывает на сына царедворца.
- source_word: ἤμελλεν γὰρ ἀποθνῄσκειν
  choice: ведь тот был при смерти
  rationale: Естественная русская формулировка передаёт непосредственную угрозу смерти, выраженную μέλλω с инфинитивом; «тот» ясно отсылает к сыну.
theological_decisions:
- issue: К кому относится подразумеваемое подлежащее в ἤμελλεν γὰρ ἀποθνῄσκειν
  choice: к сыну царедворца
  alternative: к Иисусу или к самому царедворцу
  rationale: Ближайший названный участник и контекст болезни однозначно указывают на сына.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Местоимения, относящиеся к Иисусу, набраны со строчной буквы по обычной современной издательской норме. Несовершенный вид «просил» сохраняет аспект греческого имперфекта без чрезмерно сильного «умолял».
