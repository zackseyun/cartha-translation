  source_fidelity: 'Текст точно передаёт греческий оригинал: временное значение ἀκούσας естественно выражено деепричастием «услышав», ἥκει — «пришёл», а направления движения сохранены. «Просил» корректно передаёт имперфект ἠρώτα без необязательного усиления повторности. Инфинитивы «спуститься и исцелить» адекватно передают цель просьбы. «Был при смерти» естественно передаёт срочность ἤμελλεν ἀποθνῄσκειν; «тот» недвусмысленно относится к сыну.'
