lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: сказала Ему
  rationale: Греческое настоящее время выполняет функцию исторического настоящего; прошедшее время естественно для современного русского повествования и сохраняет ход рассказа.
- source_word: ἡ γυνή
  choice: женщина
  rationale: В контексте речь идёт о самарянке у колодца, а не о жене.
- source_word: Κύριε
  choice: Господин
  rationale: Здесь это прежде всего почтительное обращение к незнакомому мужчине. «Господи» могло бы преждевременно приписать женщине исповедание веры, хотя такая смысловая возможность греческого слова отмечена в сноске.
- source_word: οὔτε ἄντλημα ἔχεις
  choice: у Тебя даже черпака нет
  rationale: οὔτε здесь подчёркивает отсутствие необходимого приспособления для доставания воды; «даже» естественно передаёт аргумент женщины и не создаёт ошибочного отрицания глубины колодца.
- source_word: ἄντλημα
  choice: черпак
  rationale: Слово обозначает сосуд или приспособление для черпания воды. «Черпак» краток, понятен и подходит к сцене у колодца.
- source_word: τὸ φρέαρ
  choice: колодец
  rationale: В данном контексте это глубокий источник, из которого черпают воду; «колодец» является точным и общеупотребительным соответствием.
- source_word: βαθύ
  choice: глубок
  rationale: Передаёт простое указание на глубину без добавочного усиления.
- source_word: πόθεν οὖν
  choice: откуда же
  rationale: «Откуда» спрашивает об источнике или способе получения, а частица «же» естественно передаёт вывод, основанный на предыдущих словах.
- source_word: τὸ ὕδωρ τὸ ζῶν
  choice: живая вода
  rationale: Буквальное выражение сохраняет и обычный смысл свежей, проточной воды, и более глубокий смысл слов Иисуса в повествовании Иоанна.
theological_decisions:
- issue: Значение κύριε в обращении самарянки к Иисусу
  choice: Господин
  alternative: Господи
  rationale: На этом этапе разговора почтительное «Господин» лучше соответствует непосредственному контексту и не утверждает, что женщина уже признала в Иисусе Господа. Более насыщенное значение слова сохраняется в сноске.
- issue: Передача двойного смысла ὕδωρ τὸ ζῶν
  choice: живая вода
  alternative: проточная вода
  rationale: '«Живая вода» не устраняет намеренную смысловую напряжённость: женщина понимает выражение в обычном смысле, тогда как слова Иисуса имеют более глубокое значение.'
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Конструкция «у Тебя даже черпака нет, а колодец глубок» точно отражает греческий довод: отсутствие средства для черпания при большой глубине колодца. Заглавные местоимения обращения к Иисусу использованы в соответствии с принятой русской библейской традицией.'
