source:
  edition: SBLGNT
  text: ὡς οὖν ἦλθον πρὸς αὐτὸν οἱ Σαμαρῖται, ἠρώτων αὐτὸν μεῖναι παρ’ αὐτοῖς· καὶ ἔμεινεν ἐκεῖ δύο ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/040.yaml
  text: So when the Samaritans came to him[a], they asked him to stay with them, and he stayed there two days.
translation:
  language: ru
  text: Итак, когда самаряне пришли к Нему, они просили Его остаться у них, и Он остался там на два дня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς οὖν
  choice: Итак, когда
  rationale: Передаёт и связь с предшествующим повествованием, выраженную οὖν, и временное значение ὡς, оставаясь естественным для русского повествования.
- source_word: ἦλθον πρὸς αὐτὸν
  choice: пришли к Нему
  rationale: Точно и естественно передаёт движение к Иисусу; местоимение пишется с прописной буквы согласно принятой русской библейской традиции.
- source_word: οἱ Σαμαρῖται
  choice: самаряне
  rationale: Обычное современное русское обозначение этнической и религиозной группы; определённый артикль отдельно не передаётся.
- source_word: ἠρώτων
  choice: просили
  rationale: Русский глагол несовершенного вида естественно сохраняет длительный или повторяющийся оттенок греческого имперфекта, не усиливая его до «настойчиво просили».
- source_word: μεῖναι παρ’ αὐτοῖς
  choice: остаться у них
  rationale: Естественно передаёт μένω и пребывание в их месте и обществе, выраженное παρά с дательным падежом.
- source_word: καὶ ἔμεινεν ἐκεῖ
  choice: и Он остался там
  rationale: Сохраняет явное ἐκεῖ («там») и лексическую связь с предыдущим «остаться».
- source_word: δύο ἡμέρας
  choice: на два дня
  rationale: Естественная русская конструкция для обозначения продолжительности пребывания.
theological_decisions: []
