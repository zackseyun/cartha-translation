source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ἡ γυνὴ ἡ Σαμαρῖτις· Πῶς σὺ Ἰουδαῖος ὢν παρ’ ἐμοῦ πεῖν αἰτεῖς ⸂γυναικὸς Σαμαρίτιδος οὔσης⸃; οὐ γὰρ συγχρῶνται Ἰουδαῖοι Σαμαρίταις.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/009.yaml
  text: So the Samaritan woman said to him[a], “How is it that you, being a Jew, ask for a drink from me, a Samaritan woman?” (For Jews do not associate with Samaritans.)
translation:
  language: ru
  text: 'Тогда самарянка сказала Ему: «Как это Ты, иудей, просишь у меня, самарянки, пить?» (Ведь иудеи не общаются с самарянами[a].)'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не имеют дел с самарянами». Возможно и более конкретное значение: не пользуются с ними общими предметами, например посудой для питья.'
    reason: 'Лексическая неоднозначность глагола συγχρῶνται: он может обозначать как общение или отношения вообще, так и совместное пользование вещами.'
lexical_decisions:
- source_word: λέγει οὖν
  choice: Тогда ... сказала
  rationale: οὖν обозначает переход в повествовании и связь с предыдущими словами Иисуса; «тогда» естественно передаёт это в современном русском языке.
- source_word: ἡ γυνὴ ἡ Σαμαρῖτις
  choice: самарянка
  rationale: Русское существительное естественно и кратко передаёт одновременно пол и принадлежность женщины к самарянам.
- source_word: Πῶς
  choice: Как это
  rationale: Оборот выражает не простой вопрос об образе действия, а удивление женщины нарушением принятой социальной границы.
- source_word: Ἰουδαῖος
  choice: иудей
  rationale: В данном контексте речь идёт об этнорелигиозной общности, противопоставленной самарянам; «иудей» сохраняет это значение и не сводит его лишь к месту проживания.
- source_word: ὢν
  choice: будучи
  rationale: Деепричастный оборот сохраняет фоновое обстоятельственное значение причастия, не уточняя его как строго причинное или уступительное.
- source_word: παρ’ ἐμοῦ πεῖν αἰτεῖς
  choice: просишь пить у меня
  rationale: Формулировка близко передаёт просьбу дать пить и сохраняет акцент на том, что Иисус обращается именно к ней, не добавляя прямо отсутствующее в этой фразе слово «вода».
- source_word: γυναικὸς Σαμαρίτιδος οὔσης
  choice: у меня, самарянки
  rationale: Приложение естественно передаёт самоописание женщины и основание её удивления, сохраняя первое лицо.
- source_word: συγχρῶνται
  choice: общаются с
  rationale: Глагол допускает широкое значение социальных отношений и более узкое значение совместного пользования вещами. В основном тексте выбрано широкое и понятное по контексту значение, а более узкая возможность сохранена в сноске.
theological_decisions:
- issue: Значение Ἰουδαῖος в контексте Евангелия от Иоанна
  choice: иудей
  alternative: житель Иудеи
  rationale: Здесь иудеи и самаряне противопоставлены как религиозно-этнические сообщества с различными обычаями, а не просто как жители двух областей.
- issue: Объём значения συγχρῶνται
  choice: 'общее социальное взаимодействие: «не общаются»'
  alternative: не пользуются общими предметами, в частности посудой
  rationale: Пояснение естественно указывает на общую отчуждённость между группами, однако непосредственный контекст просьбы напиться делает возможным более конкретное указание на совместное пользование сосудами; эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Прописные местоимения по отношению к Иисусу сохранены как привычная русская издательская норма; синтаксис остаётся ясным для обычного читателя.
