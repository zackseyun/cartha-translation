source:
  edition: SBLGNT
  text: ὃς δ’ ἂν πίῃ ἐκ τοῦ ὕδατος οὗ ἐγὼ δώσω αὐτῷ, οὐ μὴ ⸀διψήσει εἰς τὸν αἰῶνα, ἀλλὰ τὸ ὕδωρ ὃ δώσω αὐτῷ γενήσεται ἐν αὐτῷ πηγὴ ὕδατος ἁλλομένου εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/014.yaml
  text: But whoever drinks from the water that I will give him will never thirst forever; rather, the water that I will give him will become in him a spring of water welling up to eternal life.
translation:
  language: ru
  text: А кто выпьет той воды, которую Я дам ему, тот не будет жаждать вовек. Напротив, вода, которую Я дам ему, станет в нём источником воды, бьющей в вечную жизнь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «источником воды, прыгающей (бьющей) в вечную жизнь». Выражение передаёт образ воды, бурно бьющей и устремлённой к вечной жизни.'
    reason: Уточняет образность греческого ἁλλομένου и направленность εἰς, не подменяя их более слабым образом простого течения.
lexical_decisions:
- source_word: οὐ μὴ διψήσει εἰς τὸν αἰῶνα
  choice: не будет жаждать вовек
  rationale: Усиленное отрицание οὐ μή передано категорично, а εἰς τὸν αἰῶνα — традиционным и понятным «вовек», без неестественного русского удвоения «никогда вовеки».
- source_word: πηγὴ ὕδατος
  choice: источник воды
  rationale: Сохраняется образ внутреннего источника; «источник» естественнее и точнее здесь, чем «колодец».
- source_word: ἁλλομένου
  choice: бьющей
  rationale: Причастие от ἅλλομαι обозначает энергичное движение, вскидывание или струение воды; «бьющей» естественно описывает источник и сохраняет динамику образа.
- source_word: ζωὴν αἰώνιον
  choice: вечную жизнь
  rationale: Устойчивый и точный эквивалент Иоанновой формулы, сохраняющий её богословскую насыщенность.
theological_decisions:
- issue: Направленность выражения εἰς ζωὴν αἰώνιον
  choice: в вечную жизнь
  alternative: для вечной жизни
  rationale: Предлог εἰς прежде всего выражает направленность или итог. «В вечную жизнь» сохраняет метафору потока и допускает смысл движения к жизни как конечному результату, не сводя выражение только к назначению.
translation_notes:
  register: Современный литературный русский с dignified biblical register. Местоимение «Я» написано с прописной буквы по принятой русской библейской традиции. Синтаксис разделён на два предложения ради ясности, при сохранении противопоставления ἀλλά через «Напротив».
