  text: ⸀ὁ θερίζων μισθὸν λαμβάνει καὶ συνάγει καρπὸν εἰς ζωὴν αἰώνιον, ⸀ἵνα ὁ σπείρων ὁμοῦ χαίρῃ καὶ ὁ θερίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/036.yaml
  text: The one who reaps is receiving wages and gathering fruit for eternal life[b][a], so that the one who sows and the one who reaps may rejoice together.
translation:
  language: ru
  text: Тот, кто жнёт, получает плату[a] и собирает плод для вечной жизни[b], чтобы тот, кто сеет, и тот, кто жнёт, вместе радовались.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «награду». Греческое слово может означать как плату за труд, так и вознаграждение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в жизнь вечную». Выражение может указывать на цель или результат.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θερίζων
  choice: жнущий
  rationale: Субстантивированное причастие настоящего времени передаёт человека, совершающего жатву, и сохраняет параллелизм с «сеющим».
- source_word: μισθὸν
  choice: плату
  rationale: Слово может обозначать заработок либо вознаграждение; «плата» сохраняет конкретный образ труда на жатве, не исключая более широкого смысла.
- source_word: λαμβάνει
  choice: получает
  rationale: Настоящее время естественно передано русским настоящим временем без добавления отсутствующего в греческом тексте наречия «уже».
- source_word: συνάγει καρπὸν
  choice: собирает плод
  rationale: Формулировка сохраняет образ плода и не смешивает его с самой жатвой.
- source_word: εἰς ζωὴν αἰώνιον
  choice: для вечной жизни
  rationale: Предлог εἰς здесь указывает на направленность, цель или результат; основной вариант естественен по-русски, а возможная неоднозначность отмечена в сноске.
- source_word: ὁ σπείρων
  choice: сеющий
  rationale: Субстантивированное причастие сохраняет грамматический и образный параллелизм с «жнущим».
- source_word: ὁμοῦ
  choice: вместе
  rationale: Передаёт совместность радости сеющего и жнущего.
- source_word: χαίρῃ
  choice: радовались
  rationale: Форма в придаточном с ἵνα естественно передаётся конструкцией «чтобы … радовались».
theological_decisions:
- issue: Следует ли явно добавлять значение «уже» для подчёркивания начавшейся жатвы
  choice: Не добавлять «уже»
  alternative: «Уже жнущий получает…»
  rationale: Контекст говорит о настоящей жатве, однако отдельного соответствия слову «уже» в данном греческом предложении нет; настоящее время глаголов передаёт текущую реальность без поясняющей вставки.
- issue: Направленность выражения εἰς ζωὴν αἰώνιον
  choice: «для вечной жизни» с примечанием
  alternative: «в жизнь вечную»
  rationale: Греческое выражение допускает оттенки цели и результата; перевод не должен догматически устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык; краткая и ясная фраза сохраняет сельскохозяйственную образность, параллелизм «сеющий — жнущий» и достоинство библейского регистра.
