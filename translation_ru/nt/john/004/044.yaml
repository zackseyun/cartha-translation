  text: αὐτὸς ⸀γὰρ Ἰησοῦς ἐμαρτύρησεν ὅτι προφήτης ἐν τῇ ἰδίᾳ πατρίδι τιμὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/044.yaml
  text: For Jesus himself testified that a prophet has no honor in his own homeland[a].
translation:
  language: ru
  text: Ведь сам Иисус свидетельствовал, что пророк не пользуется почётом у себя на родине[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в своей стране»; или: «в родных местах». Греческое слово πατρίς может обозначать родину, страну или родную область человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит пояснение к окружающему повествованию; «ведь» естественно передаёт эту связь в современном русском языке.
- source_word: αὐτὸς ... Ἰησοῦς
  choice: сам Иисус
  rationale: Сохраняет эмфатическое значение αὐτός при естественном русском порядке слов.
- source_word: ἐμαρτύρησεν
  choice: свидетельствовал
  rationale: Передаёт значение μαρτυρέω и сохраняет важную для Евангелия от Иоанна лексику свидетельства.
- source_word: ὅτι
  choice: что
  rationale: Естественно вводит содержание свидетельства.
- source_word: προφήτης
  choice: пророк
  rationale: В русском языке нулевая форма передаёт неопределённо-обобщённый смысл и пословичный характер высказывания без искусственного добавления «какой-либо».
- source_word: ἐν τῇ ἰδίᾳ πατρίδι
  choice: у себя на родине
  rationale: Естественно передаёт πατρίς как родину или родные места, а ἰδίᾳ — сочетанием «у себя».
- source_word: τιμὴν οὐκ ἔχει
  choice: не имеет чести
  rationale: Близко воспроизводит именную конструкцию оригинала и сохраняет существительное τιμή — «честь».
theological_decisions:
- issue: Географический охват выражения «у себя на родине» в контексте Евангелия от Иоанна
  choice: Сохранить общее выражение, не уточняя конкретное место
  alternative: Иудея; Галилея; Назарет или родные места в более узком смысле
  rationale: Сам стих не называет конкретного географического референта. Обобщённая формулировка сохраняет смысловую напряжённость контекста и не навязывает гармонизирующего толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изложения. «Ведь» сохраняет пояснительную функцию γάρ, а формулировка «у себя на родине» звучит естественно и не сужает неоднозначный географический референт.
