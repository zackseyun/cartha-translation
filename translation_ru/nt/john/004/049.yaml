  text: λέγει πρὸς αὐτὸν ὁ βασιλικός· Κύριε, κατάβηθι πρὶν ἀποθανεῖν τὸ παιδίον μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/049.yaml
  text: The royal official said to him[a], “Lord, come down before my child dies.”
translation:
  language: ru
  text: 'Царский чиновник сказал ему: «Господи[a], спустись, пока мой ребёнок не умер».


    [a] Или: «Господин». Греческое κύριε — почтительное обращение, которое в данном контексте может означать «господин».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господин». Греческое κύριε — почтительное обращение, которое в данном контексте может означать «господин».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ βασιλικός
  choice: царский чиновник
  rationale: Субстантивированное прилагательное обозначает человека, связанного с царём или царским двором. «Царский чиновник» ясно передаёт служебное положение и не привносит значения знатного происхождения.
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма «Господи» сохраняет обычное соответствие κύριε и возможную богословскую многозначность обращения к Иисусу; в данном контексте слово может быть также почтительным обращением.
- source_word: κατάβηθι
  choice: приди
  rationale: Императив означает движение вниз, из Каны в Капернаум. В русском «сойди» здесь может ошибочно восприниматься как предложение покинуть возвышение или транспорт; естественное «приди» передаёт просьбу двигаться вместе с говорящим, хотя топографический оттенок разъясняется в сноске.
- source_word: πρὶν ἀποθανεῖν
  choice: пока ... не умер
  rationale: Естественная русская конструкция передаёт предельный срок действия — прийти прежде смерти ребёнка — без изменения смысла греческого πρίν с инфинитивом.
- source_word: τὸ παιδίον μου
  choice: мой ребёнок
  rationale: Передаёт παιδίον без неоправданного уточнения пола, хотя ближайший контекст позднее говорит о сыне.
- source_word: λέγει πρὸς αὐτόν
  choice: сказал ему
  rationale: Историческое настоящее естественно передано русским прошедшим временем в повествовании.
theological_decisions:
- issue: Передача κύριε в обращении к Иисусу
  choice: Господи
  alternative: Господин; сударь
  rationale: «Господи» сохраняет многослойность повествования Иоанна и не сводит обращение исключительно к светской вежливости. При этом возможное значение почтительного обращения отмечено в сноске.
translation_notes:
  register: Современный литературный русский, ясный и сдержанно-достоинственный. Для последовательности маркер [b] добавлен в основной текст при глаголе, отражающем κατάβηθι.
