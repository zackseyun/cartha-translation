base_translation:
  language: en
  yaml_path: translation/nt/john/004/048.yaml
  text: So Jesus said to him[a], “Unless you see signs and wonders, you will certainly not believe.”
translation:
  language: ru
  text: 'На это Иисус сказал ему: «Если вы не увидите знамений и чудес, то ни за что не поверите».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глаголы «увидите» и «поверите» в греческом тексте стоят во множественном числе, поэтому слова Иисуса, вероятно, обращены не только к самому царедворцу, но и к более широкому кругу людей.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Тогда
  rationale: Передаёт продолжение и логическое развитие повествования естественным современным русским языком; в данном контексте не требует более формального «итак» или явно причинного «поэтому».
- source_word: πρὸς αὐτόν
  choice: сказал ему
  rationale: Естественно передаёт направление речи к одному упомянутому человеку; русский глагол речи не требует буквального воспроизведения предлога πρός.
- source_word: Ἐὰν μὴ
  choice: Если вы не
  rationale: Естественная русская условная конструкция, точно сохраняющая отрицательное условие; число местоимения уточняется сноской.
- source_word: σημεῖα
  choice: знамения
  rationale: Сохраняет характерный для Иоанна смысл действий, указывающих за пределы самого чуда, и избегает сведения слова только к сверхъестественному происшествию.
- source_word: τέρατα
  choice: чудеса
  rationale: В сочетании со «знамениями» естественно обозначает необычайные явления, вызывающие изумление; «дивные явления» звучало бы искусственно.
- source_word: ἴδητε
  choice: вы не увидите
  rationale: Аористный конъюнктив в условной части передан естественной русской формой будущего времени; форма второго лица множественного числа сохранена.
- source_word: οὐ μὴ πιστεύσητε
  choice: ни за что не поверите
  rationale: Передаёт усиленное греческое отрицание οὐ μή живым, но достойным русским выражением, не ослабляя его до простого «не поверите».
- source_word: πιστεύσητε
  choice: поверите
  rationale: «Верить/поверить» — наименее толковательное и обычное соответствие πιστεύω у Иоанна; совершенный вид естественен в данном условно-результативном высказывании.
theological_decisions:
- issue: Число и объём адресата
  choice: Во вводной части сохранить единственное число («ему»), а в словах Иисуса — множественное («вы… увидите… поверите»), пояснив это сноской.
  alternative: Понять всё высказывание как обращённое только к царедворцу либо добавить в основной текст толковательное «вы, люди».
  rationale: Повествовательная рамка указывает на одного собеседника, однако ἴδητε и πιστεύσητε стоят во множественном числе. Такое различие сохраняет исходное напряжение и допускает более широкий круг адресатов, не определяя его прямо.
- issue: Сила отрицания οὐ μή
  choice: Передать как «ни за что не поверите».
  alternative: «Не поверите» или «никогда не поверите».
  rationale: Первый вариант сохраняет эмфатическое отрицание, не превращая его в абсолютное утверждение о вере во все времена, что могло бы подразумевать «никогда».
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Знамения и чудеса» сохраняет традиционную и богословски значимую пару терминов, а множественное число обращения оставлено в основном тексте без пояснительной вставки.
