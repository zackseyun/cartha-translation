  yaml_path: translation/nt/john/004/043.yaml
  text: After the two days[a], he departed from there for Galilee.
translation:
  language: ru
  text: По прошествии этих двух дней Он ушёл оттуда в Галилею.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ τὰς δύο ἡμέρας
  choice: По прошествии этих двух дней
  rationale: 'μετά с винительным падежом выражает последование во времени: «после». Артикль указывает на уже упомянутые два дня пребывания Иисуса у самарян; указательное «этих» естественно передаёт эту анафорическую связь по-русски. δέ здесь служит мягкой связкой и отдельно не переводится.'
- source_word: ἐξῆλθεν
  choice: Он ушёл
  rationale: Аорист ἐξέρχομαι буквально означает «вышел», но в данном повествовании обозначает отъезд из места пребывания. «Ушёл» звучит естественно и сохраняет идею удаления, не уточняя способ передвижения.
- source_word: ἐκεῖθεν
  choice: оттуда
  rationale: Наречие указывает на отправление из ранее названного места; «оттуда» является точным и естественным соответствием.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: в Галилею
  rationale: εἰς обозначает направленное движение к месту назначения. При глаголе движения нормативное русское «в Галилею» естественно передаёт и направление, и вступление в область.
