  source_fidelity: «По прошествии этих двух дней» точно передаёт μετὰ τὰς δύο ἡμέρας и уместно отражает связь с только что упомянутым двухдневным пребыванием. «Он ушёл оттуда в Галилею» верно передаёт ἐξῆλθεν ἐκεῖθεν εἰς τὴν Γαλιλαίαν без неоснованных уточнений способа или цели движения.
