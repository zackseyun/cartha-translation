source:
  edition: SBLGNT
  text: Ὡς οὖν ἔγνω ὁ ⸀Ἰησοῦς ὅτι ἤκουσαν οἱ Φαρισαῖοι ὅτι Ἰησοῦς πλείονας μαθητὰς ποιεῖ καὶ βαπτίζει ἢ Ἰωάννης—
base_translation:
  language: en
  yaml_path: translation/nt/john/004/001.yaml
  text: Therefore[a], when Jesus knew that the Pharisees had heard that Jesus was making and baptizing more disciples than John—
translation:
  language: ru
  text: Итак, когда Иисус узнал, что фарисеи услышали, что Он приобретает и крестит больше учеников, чем Иоанн—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Итак, когда
  rationale: «Когда» передаёт временную функцию ὡς, а «итак» — вывод или переход в повествовании, выраженный οὖν.
- source_word: ἔγνω
  choice: узнал
  rationale: Аорист γινώσκω здесь естественно обозначает, что Иисусу стало известно о дошедших до фарисеев сведениях.
- source_word: οἱ Φαρισαῖοι
  choice: фарисеи
  rationale: Общепринятое русское наименование этой религиозной группы; определённость передаётся контекстом.
- source_word: ἤκουσαν
  choice: услышали
  rationale: Форма аориста передаёт предшествующее событие; в русском последовательность времён ясна без специальной формы давнопрошедшего времени.
- source_word: πλείονας μαθητὰς
  choice: больше учеников
  rationale: Естественная передача сравнительного прилагательного πλείονας с существительным μαθητάς.
- source_word: ποιεῖ
  choice: приобретает
  rationale: В сочетании с μαθητάς глагол означает привлечение людей в число учеников. «Приобретает учеников» звучит по-русски естественнее буквального «делает учеников» и не добавляет конфессиональной терминологии.
- source_word: βαπτίζει
  choice: крестит
  rationale: Стандартный и понятный русский эквивалент βαπτίζω в новозаветном повествовании.
- source_word: ἢ Ἰωάννης
  choice: чем Иоанн
  rationale: Кратко и естественно передаёт греческое сравнение без ненужного повторения сказуемых.
theological_decisions:
- issue: Возможное впечатление, что Иисус лично крестил людей
  choice: 'Сохранить поверхностную формулировку стиха: «Он приобретает и крестит»'
  alternative: Заранее уточнить, что крестили ученики Иисуса
  rationale: Следующий стих сам поясняет, что крестил не Иисус лично, а Его ученики. В данный стих это пояснение не вносится, чтобы сохранить последовательность и напряжение исходного повествования.
- issue: Объём сравнения с деятельностью Иоанна
  choice: Сохранить естественную русскую конструкцию, в которой сравнение может относиться к сочетанию приобретения и крещения учеников
  alternative: Однозначно отнести «больше» только к числу приобретённых учеников
  rationale: Греческий порядок слов допускает некоторое различие в понимании области действия сравнения; перевод не должен без необходимости устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык; тон повествовательный и сдержанно-достоинственный. Тире в конце сохраняет незавершённость придаточной конструкции, продолжение которой следует в следующем стихе.
