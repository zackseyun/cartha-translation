source:
  edition: SBLGNT
  text: Ἦλθεν οὖν ⸀πάλιν εἰς τὴν Κανὰ τῆς Γαλιλαίας, ὅπου ἐποίησεν τὸ ὕδωρ οἶνον. καὶ ἦν τις βασιλικὸς οὗ ὁ υἱὸς ἠσθένει ἐν Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/046.yaml
  text: So he came again to Cana of Galilee[a], where he had made the water wine[b]. And there was a certain royal official whose son was sick in Capernaum.
translation:
  language: ru
  text: Итак, Он снова пришёл в Кану Галилейскую, где прежде превратил воду в вино. Там был один царский служащий, у которого в Капернауме болел сын.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Итак
  rationale: Передаёт связь с предшествующим повествованием и естественно вводит продолжение рассказа.
- source_word: πάλιν
  choice: снова
  rationale: Прямо обозначает повторное прибытие Иисуса в Кану.
- source_word: Κανὰ τῆς Γαλιλαίας
  choice: Кану Галилейскую
  rationale: Традиционное и естественное по-русски обозначение Каны, находящейся в Галилее.
- source_word: ἐποίησεν τὸ ὕδωρ οἶνον
  choice: прежде превратил воду в вино
  rationale: Естественно передаёт смысл греческого выражения «сделал воду вином»; «прежде» ясно указывает, что событие произошло ранее.
- source_word: βασιλικός
  choice: царский служащий
  rationale: Сохраняет связь человека с царём или царским двором, не утверждая точного чина и не приписывая ему знатного происхождения.
- source_word: τις
  choice: один
  rationale: Естественный русский способ представить конкретного, но не названного человека.
- source_word: υἱός
  choice: сын
  rationale: Точно передаёт указанное в греческом тексте родство и пол.
- source_word: ἠσθένει
  choice: болел
  rationale: В контексте глагол обозначает физическую болезнь; русское слово кратко и естественно.
- source_word: Καφαρναούμ
  choice: Капернауме
  rationale: Общепринятая русская форма географического названия.
theological_decisions:
- issue: Передача βασιλικός без излишней исторической конкретизации
  choice: царский служащий
  alternative: царедворец; царский чиновник; человек из царской свиты
  rationale: Греческое слово указывает на связь с царём или царским двором, но само по себе не устанавливает точную должность, ранг или знатное происхождение.
translation_notes:
  register: Современный литературный русский язык; повествовательный стиль простой и достойный. Местоимение «Он» употреблено по принятой в русском библейском тексте норме для Иисуса. Формулировка избегает архаичного «царедворец» и канцелярски более узкого «чиновник».
