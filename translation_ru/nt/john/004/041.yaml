  text: И гораздо больше людей поверили по Его слову[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за Его вести»; «благодаря Его вести».'
    reason: Слово λόγος здесь может обозначать как сказанное Им слово, так и содержание сказанного — весть; διά с винительным указывает на основание или причину веры.
lexical_decisions:
- source_word: πολλῷ πλείους
  choice: ещё гораздо больше людей
  rationale: πολλῷ усиливает сравнительную форму πλείους. Сочетание «ещё гораздо больше людей» естественно передаёт и значительное увеличение числа, и связь с предыдущим стихом.
- source_word: ἐπίστευσαν
  choice: поверили
  rationale: Аорист πιστεύω прямо передан глаголом «поверили», без добавления отсутствующего в греческом тексте объекта и без навязывания начинательного оттенка.
- source_word: διὰ τὸν λόγον αὐτοῦ
  choice: благодаря Его слову
  rationale: διά с винительным указывает здесь на основание или причину веры. «Благодаря» звучит естественно по-русски, а «слову» сохраняет лексику λόγος и её смысловой отзвук в Евангелии от Иоанна.
theological_decisions:
- issue: Передача πιστεύω в повествовании о вере
  choice: поверили
  alternative: уверовали в Него
  rationale: В самом стихе после глагола нет явно выраженного объекта. Перевод сохраняет эту особенность и позволяет контексту указать на Иисуса, не добавляя более развёрнутую богословскую формулировку.
translation_notes:
  register: Современный литературный русский язык; ясный, естественный и достойный повествовательный стиль. Заглавная буква в местоимении «Его» следует принятой русской традиции уважительного обозначения Иисуса.
