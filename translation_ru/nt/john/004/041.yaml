  source_fidelity: 'Смысл в целом передан верно: καὶ πολλῷ πλείους означает, что по сравнению с предыдущей группой уверовало значительно больше людей; ἐπίστευσαν не получает добавленного объекта; διὰ τὸν λόγον αὐτοῦ выражает основание веры. Однако «благодаря» может придавать причинности оттенок благоприятствующего средства, тогда как «из-за/по причине» точнее передаёт διά с винительным в данном контексте.'
  naturalness: '«И ещё гораздо больше людей поверили» понятно, но «ещё» избыточно рядом с усиленным сравнительным «гораздо больше» и менее гладко передаёт греческое καὶ, которое здесь естественно соединяет повествование: «И гораздо больше людей поверили…». «По слову Его» — естественное литературное выражение, но может звучать несколько традиционно; «из-за того, что Он сказал» было бы разговорнее и развёрнутее. Для современного литературного библейского регистра предпочтительно «по Его слову».'
  terminology: «Поверили» оправданно сохраняет отсутствие эксплицитного объекта. «Слово» для λόγος уместно и сохраняет иоанновский лексический отзвук. Заглавная буква в «Его» допустима при выбранной редакционной традиции.
