  text: Ему нужно было пройти через Самарию[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ему надлежало пройти через Самарию». Греческий текст выражает необходимость, не уточняя, чем именно она была обусловлена.'
    reason: Лексический вариант и сохранение неоднозначности основания необходимости.
lexical_decisions:
- source_word: ἔδει
  choice: надлежало
  rationale: Имперфект δέω выражает необходимость в прошлом. «Надлежало» сохраняет реальную, но не объяснённую в самом стихе необходимость и звучит уместно в литературном повествовании.
- source_word: δὲ
  choice: же
  rationale: Здесь δέ служит лёгкой связкой в развитии повествования, не выражая сильного противопоставления; частица «же» передаёт эту функцию без добавления временного значения.
- source_word: αὐτὸν
  choice: ему
  rationale: В греческой конструкции αὐτόν — винительный субъект инфинитива; по-русски необходимость естественно выражается безличной конструкцией с дательным «ему».
- source_word: διέρχεσθαι
  choice: пройти
  rationale: В сочетании с διά глагол означает движение через территорию; «пройти» кратко и естественно передаёт этот смысл.
- source_word: διὰ τῆς Σαμαρείας
  choice: через Самарию
  rationale: διά с родительным обозначает движение через местность. Название «Самария» достаточно ясно без поясняющего добавления «область».
theological_decisions:
- issue: Основание необходимости в ἔδει
  choice: Передать необходимость как действительную, не уточняя её основания.
  alternative: Истолковать её как чисто географическую необходимость либо как необходимость, обусловленную Божьим замыслом.
  rationale: Сам греческий текст утверждает необходимость, но в этом стихе не объясняет, была ли она географической, практической или связанной с миссией Иисуса. Перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Надлежало» выбрано как естественное для повествования слово, сохраняющее смысл необходимости; порядок «Ему же» передаёт лёгкую связующую функцию δέ.
