lexical_decisions:
- source_word: Λέγει
  choice: Он сказал
  rationale: Историческое настоящее в греческом повествовании естественно передаётся по-русски прошедшим временем; вариант настоящего времени отмечен в сноске.
- source_word: αὐτῇ
  choice: ей
  rationale: Дательный падеж местоимения обозначает адресата речи и кратко передаётся русским «ей».
- source_word: Ὕπαγε
  choice: Пойди
  rationale: Повелительная форма выражает указание удалиться для следующего действия; «пойди» естественно связывается с последующим «позови».
- source_word: φώνησον
  choice: позови
  rationale: В данном контексте глагол означает позвать человека; «позови» современно и менее официально, чем «призови» или «вызови».
- source_word: τὸν ἄνδρα σου
  choice: своего мужа
  rationale: ἀνήρ может означать мужчину или мужа; притяжательное местоимение и дальнейший контекст указывают на значение «муж». Возвратное «своего» естественно для русского языка при обращении к собеседнице.
- source_word: καὶ
  choice: и
  rationale: Простой сочинительный союз сохраняет связь между двумя повелениями.
- source_word: ἐλθὲ
  choice: приходи
  rationale: Прямое приглашение прийти к говорящему. «Вернись» сделало бы явным подразумеваемое возвращение, которого сам греческий глагол не выражает.
- source_word: ἐνθάδε
  choice: сюда
  rationale: Наречие указывает движение к месту говорящего; с глаголом движения русское «сюда» естественнее буквального «здесь».
