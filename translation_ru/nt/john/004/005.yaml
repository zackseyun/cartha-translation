base_translation:
  language: en
  yaml_path: translation/nt/john/004/005.yaml
  text: So he came to a town of Samaria called Sychar[b][a], near the piece of land that Jacob had given to Joseph his son.
translation:
  language: ru
  text: Итак, Он пришёл в город Самарии под названием Сихарь[a], близ участка земли[b], который Иаков дал своему сыну Иосифу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «поселение Сихарь». Греческое πόλις может обозначать как город, так и менее крупное поселение.
    reason: lexical_alternative
  - marker: b
    text: Или «поле» или «земельное владение». Греческое χωρίον может обозначать поле, владение или участок земли.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: пришёл
  rationale: Настоящее время употреблено как историческое настоящее; русское прошедшее время естественно передаёт последовательность повествования.
- source_word: οὖν
  choice: итак
  rationale: Сохраняет связь с предшествующим контекстом и отмечает дальнейшее развитие повествования.
- source_word: πόλιν τῆς Σαμαρείας
  choice: самарийский город
  rationale: Естественно передаёт принадлежность или местонахождение города в области Самарии; πόλις допускает разный масштаб поселения.
- source_word: λεγομένην Συχὰρ
  choice: под названием Сихарь
  rationale: Современная и ясная передача причастного оборота, называющего поселение.
- source_word: πλησίον
  choice: близ
  rationale: Кратко и в достойном литературном регистре передаёт пространственную близость.
- source_word: χωρίου
  choice: участка земли
  rationale: Передаёт участок или земельное владение, не сужая значение исключительно до возделанного поля.
- source_word: ὃ ἔδωκεν Ἰακὼβ
  choice: который Иаков отдал
  rationale: Прямо передаёт аорист ἔδωκεν; контекст и без плюсквамперфектной формы ясно показывает, что действие произошло ранее.
- source_word: τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ
  choice: своему сыну Иосифу
  rationale: Естественный русский порядок слов ясно сохраняет получателя и его родство с Иаковом.
