base_translation:
  language: en
  yaml_path: translation/nt/john/004/010.yaml
  text: Jesus answered and said to her[a], “If you knew the gift of God, and who it is who says to you, ‘Give me a drink,’ you would have asked him, and he would have given you living water.”
translation:
  language: ru
  text: 'Иисус сказал ей в ответ: «Если бы ты знала Божий дар и знала, кто говорит тебе: „Дай мне пить“, то ты сама попросила бы у него, и он дал бы тебе живую воду[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проточную воду» либо «свежую воду». Это выражение могло обозначать текущую воду, но перевод «живая вода» сохраняет заложенный здесь двойной смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ
  choice: Иисус сказал ей в ответ
  rationale: Естественная современная русская передача повествовательной формулы «ответил и сказал ей»; сохраняет значение ответа, не воспроизводя тяжеловесный греческий дублет буквально.
- source_word: τὴν δωρεὰν τοῦ θεοῦ
  choice: Божий дар
  rationale: Кратко и естественно передаёт дар, исходящий от Бога, не добавляя толкования о его конкретном содержании.
- source_word: τίς ἐστιν ὁ λέγων σοι
  choice: кто говорит тебе
  rationale: Сохраняет акцент на личности говорящего и настоящее время причастия, оставаясь естественным по-русски.
- source_word: Δός μοι πεῖν
  choice: Дай мне пить
  rationale: Точная и идиоматичная передача повеления с инфинитивом.
- source_word: σὺ ἂν ᾔτησας αὐτόν
  choice: то ты сама попросила бы у него
  rationale: 'Частица «сама» передаёт выраженное местоимением σὺ противопоставление: при знании женщина сама обратилась бы с просьбой к Иисусу.'
- source_word: καὶ ἔδωκεν ἄν σοι
  choice: и он дал бы тебе
  rationale: Русская условная конструкция с «бы» естественно передаёт нереальное условие и предполагаемый результат.
- source_word: ὕδωρ ζῶν
  choice: живая вода
  rationale: Сохраняет буквальный образ и намеренную многозначность выражения, которое может обозначать текущую, свежую воду и одновременно указывать на более глубокую реальность.
theological_decisions:
- issue: Сочетание буквального и символического смыслов ὕδωρ ζῶν
  choice: живая вода
  alternative: проточная вода; свежая вода
  rationale: Перевод не сводит слова Иисуса только к физической воде и сохраняет напряжение между обычным значением выражения и его более глубоким смыслом в контексте.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Местоимения, относящиеся к Иисусу, даны со строчной буквы в соответствии с обычной современной орфографией и без внесения конфессиональной издательской традиции.
