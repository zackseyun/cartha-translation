  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Ἓν ἔργον ἐποίησα καὶ πάντες θαυμάζετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/021.yaml
  text: Jesus answered and said to them[a], “I did one work[b], and you all marvel.”
translation:
  language: ru
  text: 'Иисус ответил им: «Я совершил одно дело[a][b], и все вы удивляетесь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «поступок». Греческое слово может означать «дело» или «поступок», но «дело» сохраняет характерное для Евангелия от Иоанна обозначение действий Иисуса.
    reason: lexical_alternative
  - marker: b
    text: Вероятно, речь идёт об исцелении больного у купальни в субботу (Ин. 5:1–18).
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: ответил им
  rationale: В греческом употреблена парная повествовательная формула «ответил и сказал». В современном русском перед прямой речью естественное «ответил им» передаёт её смысл без тяжеловесного дублирования.
- source_word: Ἓν
  choice: всего одно
  rationale: Сочетание сохраняет акцент на единственном поступке, ставшем причиной реакции слушателей.
- source_word: ἔργον
  choice: дело
  rationale: «Дело» естественно обозначает совершённый поступок и позволяет сохранять повторяющийся у Иоанна значимый термин для дел Иисуса.
- source_word: ἐποίησα
  choice: совершил
  rationale: В сочетании с существительным «дело» глагол «совершил» звучит естественно и достойно; буквальное «сделал одно дело» по-русски стилистически слабее.
- source_word: πάντες
  choice: все вы
  rationale: Передаёт отнесённость «всех» ко всей группе адресатов и сохраняет множественное число обращения.
- source_word: θαυμάζετε
  choice: удивляетесь
  rationale: Настоящее время и значение изумления или недоумения сохранены без придания реакции однозначно положительной окраски.
theological_decisions:
- issue: Иоанново значение ἔργον
  choice: дело
  alternative: поступок
  rationale: «Дело» сохраняет лексическую связь с повторяющейся в Евангелии темой дел Иисуса, не добавляя в основной текст богословского истолкования.
- issue: Причина удивления слушателей
  choice: Не уточнять её в основном тексте
  alternative: Прямо назвать исцеление в субботу
  rationale: Сам стих не называет конкретного дела; вероятную связь с исцелением в Ин. 5 следует отметить только в сноске, сохраняя меру определённости оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Семитизированная формула «ответил и сказал» свёрнута до естественного русского «ответил им», тогда как смысловые акценты «всего одно» и «все вы» сохранены.
