source:
  edition: SBLGNT
  text: ἐάν τις θέλῃ τὸ θέλημα αὐτοῦ ποιεῖν, γνώσεται περὶ τῆς διδαχῆς πότερον ἐκ τοῦ θεοῦ ἐστιν ἢ ἐγὼ ἀπ’ ἐμαυτοῦ λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/017.yaml
  text: If anyone wants to do his will[a], he will know about the teaching, whether it is from God or whether I am speaking from myself.
translation:
  language: ru
  text: Если кто хочет исполнять Его волю, тот узнает, от Бога ли это учение или Я говорю от Себя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «самостоятельно»; возможно также: «по собственной власти». Буквально: «от Себя».'
    reason: 'Лексическая альтернатива: ἀπ’ ἐμαυτοῦ может указывать как на источник речи, так и на независимое действие или собственную власть.'
lexical_decisions:
- source_word: ἐάν τις θέλῃ
  choice: Если кто хочет
  rationale: Сочетание ἐάν с сослагательным наклонением выражает общее условие; «хочет» естественно передаёт желание и готовность человека.
- source_word: τὸ θέλημα αὐτοῦ ποιεῖν
  choice: исполнять Его волю
  rationale: В русском сочетание «исполнять волю» идиоматичнее буквального «делать волю» и точно передаёт практическое осуществление желаемого Богом; местоимение сохранено.
- source_word: γνώσεται
  choice: тот узнает
  rationale: Будущая форма указывает на знание или распознавание, которое станет результатом названного условия. Коррелят «тот» делает русскую условную конструкцию ясной.
- source_word: περὶ τῆς διδαχῆς
  choice: об этом учении
  rationale: περί с родительным падежом означает «об, относительно»; указательное «этом» естественно отсылает к обсуждаемому учению Иисуса.
- source_word: πότερον ... ἢ
  choice: от Бога ли оно или
  rationale: Русская частица «ли» естественно оформляет два противопоставленных варианта без тяжеловесного повтора.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: от Бога ли оно
  rationale: ἐκ обозначает источник или происхождение; «от Бога» прямо сохраняет этот смысл, а «оно» отсылает к учению.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: от Себя
  rationale: Формулировка сохраняет образ источника речи и не уточняет его как вопрос власти, хотя такой смысл возможен в контексте.
- source_word: λαλῶ
  choice: Я говорю
  rationale: Настоящее время естественно и прямо передаёт греческую форму в контексте текущей речи Иисуса.
theological_decisions:
- issue: К кому относится αὐτοῦ в выражении «Его волю»
  choice: Сохранено местоимение «Его», контекстуально относящееся к Богу.
  alternative: «волю Бога»
  rationale: Контекст ясно указывает на Бога, но исходный текст употребляет местоимение; его сохранение избегает ненужного истолковывающего расширения.
- issue: Смысл ἀπ’ ἐμαυτοῦ
  choice: «от Себя»
  alternative: «самостоятельно» или «по собственной власти»
  rationale: Греческое выражение непосредственно обозначает источник речи. Возможный оттенок независимости или собственной власти не внесён в основной текст, чтобы не устранять смысловую ёмкость выражения.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Двоеточие естественно вводит содержание того, что человек узнает. Местоимения, относящиеся к Богу и Иисусу, написаны с прописной буквы согласно принятой русской библейской традиции.
