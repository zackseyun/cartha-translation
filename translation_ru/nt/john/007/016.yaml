    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: Иисус же ответил им
  rationale: «Ответил» естественно передаёт ἀπεκρίθη; частица «же» сохраняет связующую силу οὖν без чрезмерно жёсткого вывода. Отдельное καὶ εἶπεν идиоматически объединено с формулой ответа, поскольку прямая речь ясно выражает акт говорения.
- source_word: Ἡ ἐμὴ διδαχή
  choice: Моё учение
  rationale: «Учение» — современное и достаточно широкое соответствие διδαχή; притяжательное местоимение сохраняет выраженное в греческом тексте ударение.
- source_word: οὐκ ἔστιν ἐμὴ
  choice: не Моё
  rationale: Кратко и параллельно оригиналу передаёт отрицание принадлежности или самостоятельного происхождения учения.
- source_word: ἀλλὰ τοῦ πέμψαντός με
  choice: а Пославшего Меня
  rationale: Субстантивированное причастие и родительный падеж естественно переданы русской эллиптической конструкцией. Она сохраняет возможные оттенки принадлежности и источника, не добавляя отсутствующего в тексте существительного.
theological_decisions:
- issue: Отношение учения Иисуса к Пославшему Его
  choice: 'Сохранено прямое противопоставление: «не Моё, а Пославшего Меня».'
  alternative: «не от Меня, а от Того, Кто послал Меня»
  rationale: Греческий родительный τοῦ πέμψαντός με может указывать на принадлежность и тем самым подразумевать источник. Основной текст сохраняет лаконичную грамматическую напряжённость и не превращает её исключительно в утверждение о происхождении учения.
translation_notes:
  register: Современный литературный русский язык с достоинством и библейской лаконичностью. Заглавные буквы в местоимениях и субстантивированном причастии, относящихся к Иисусу и Отцу, использованы в соответствии с распространённой русской библейской традицией; они не меняют смысла исходного греческого текста.
