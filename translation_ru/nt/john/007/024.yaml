id: JHN.7.24
reference: John 7:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μὴ κρίνετε κατ’ ὄψιν, ἀλλὰ τὴν δικαίαν κρίσιν ⸀κρίνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/024.yaml
  text: Do not judge according to appearance[a], but judge with righteous judgment.
translation:
  language: ru
  text: Не судите по внешности[a], но судите праведным судом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по тому, что видно».'
    reason: 'Лексическая альтернатива: ὄψις может обозначать внешность, вид или непосредственно то, что представляется взгляду.'
lexical_decisions:
- source_word: μὴ κρίνετε
  choice: Не судите
  rationale: Настоящее повелительное наклонение с μή естественно передаётся общим запретом. Такой перевод сохраняет краткость и повелительную силу, не навязывая аспекту значение «перестаньте судить».
- source_word: κατ’ ὄψιν
  choice: по внешности
  rationale: Оборот указывает на суждение по видимому, внешнему впечатлению. «По внешности» естественно по-русски и сохраняет противопоставление поверхностной оценки справедливому суду.
- source_word: ἀλλὰ
  choice: но
  rationale: Сильное противопоставление между запрещённым и предписанным способом судить прямо и естественно передаётся союзом «но».
- source_word: τὴν δικαίαν κρίσιν
  choice: праведным судом
  rationale: Творительный оборот естественно передаёт внутренний объект греческого выражения и сохраняет существительное κρίσις. «Праведный» выражает не только беспристрастность, но и нравственную правильность суда.
- source_word: κρίνετε
  choice: судите
  rationale: Повтор глагола «судите» сохраняет риторический параллелизм греческого текста.
theological_decisions:
- issue: Передача δικαίαν в нравственно-судебном контексте
  choice: праведным
  alternative: справедливым
  rationale: «Праведным» сохраняет нравственную полноту δικαίαν и традиционную библейскую выразительность, не исключая смысла справедливости. Вариант «справедливым» возможен, но может звучать уже, преимущественно в юридическом смысле.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной библейской формулировкой. Конструкция «судите праведным судом» несколько возвышенна, но понятна и позволяет сохранить существительное κρίσις и повтор корня, не переходя к архаической инверсии.
