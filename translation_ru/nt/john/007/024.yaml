  verdict: approve
  source_fidelity: «Не судите по внешности, но судите праведным судом» точно передаёт обе повелительные формы κρίνετε, запрет с μή, противопоставление ἀλλά и смысл κατ’ ὄψιν как суждения по внешнему, видимому впечатлению. Творительный оборот «праведным судом» естественно передаёт τὴν δικαίαν κρίσιν, не утрачивая ни понятия суда, ни его нравственно-правовой характеристики.
  naturalness: Формулировка краткая, ясная и естественная для современного литературного русского языка; повтор «судите» уместно сохраняет риторический параллелизм оригинала. Выражение «праведным судом» имеет библейски достойный, но не архаичный регистр.
  terminology: «Внешность» корректно отражает ὄψις в данном контексте. «Праведный» является допустимой и точной передачей δικαία, сохраняя нравственное измерение слова; вариант «справедливый» также возможен, но не требуется. Сноска привязана к слову «внешности» и предлагает реальную лексическую альтернативу без изменения смысла.
