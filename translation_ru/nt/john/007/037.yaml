base_translation:
  language: en
  yaml_path: translation/nt/john/007/037.yaml
  text: On the last day[a], the great day of the feast, Jesus stood and cried out, saying, “If anyone is thirsty, let him come to me and drink.”
translation:
  language: ru
  text: 'В последний, великий день праздника Иисус стоял и громко воскликнул: «Кто жаждет, пусть приходит ко Мне и пьёт».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ τῇ μεγάλῃ τῆς ἑορτῆς
  choice: В последний, великий день праздника
  rationale: Предлог с дательным обозначает время, а δέ служит мягкой связкой, которую в русском здесь естественно не выражать отдельно. Приложенное определение «великий» сохранено как характеристика последнего дня праздника.
- source_word: εἱστήκει ὁ Ἰησοῦς
  choice: Иисус встал
  rationale: Плюсквамперфектная форма ἵστημι описывает Иисуса стоящим или занявшим положение стоя; в русском повествовании «встал» естественно передаёт публичный характер последующего обращения.
- source_word: ἔκραξεν λέγων
  choice: громко возгласил
  rationale: κράζω обозначает громкий публичный возглас. Русское «громко возгласил» передаёт и силу голоса, и торжественность; отдельное «говоря» было бы тяжеловесным.
- source_word: Ἐάν τις διψᾷ
  choice: Кто жаждет
  rationale: Условное неопределённо-личное выражение передано естественной русской конструкцией, открытой для любого человека. Настоящее время и образ жажды сохранены.
- source_word: ἐρχέσθω πρός με καὶ πινέτω
  choice: пусть приходит ко Мне и пьёт
  rationale: Оба императива настоящего времени переданы координированными формами «пусть приходит» и «пьёт», без ослабления приглашения-призыва.
theological_decisions:
- issue: Образный смысл жажды и питья
  choice: Сохранить буквальные образы «жаждет» и «пьёт» без пояснения в основном тексте.
  alternative: Истолковать как стремление к жизни, веру или принятие Духа.
  rationale: Сам стих формулирует приглашение образно, а его смысл развивается в ближайшем контексте; экспликация преждевременно сняла бы богословское напряжение.
- issue: Обобщающий характер τις и форм императива
  choice: Передать конструкцией «Кто жаждет, пусть приходит… и пьёт».
  alternative: «Если кто жаждет, пусть он придёт…»
  rationale: Русская конструкция остаётся грамматически единственной и всеобщей, не добавляя пола и не меняя референта.
translation_notes:
  register: Современный литературный русский, ясный и торжественный без архаизации. «Праздник» естественнее современного «пир» или конфессионально окрашенного «празднество». Заглавная буква в «Мне» следует принятой русской библейской издательской традиции.
