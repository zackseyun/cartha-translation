lexical_decisions:
- source_word: οὖν
  choice: Итак
  rationale: Передаёт связь с предшествующим повествованием и вывод из того, что Иисус не пошёл на праздник открыто.
- source_word: Ἰουδαῖοι
  choice: иудеи
  rationale: Сохраняет широкий и традиционный эквивалент, не сужая прямо обозначенный в стихе круг лиц до властей; контекстуальное значение пояснено в сноске.
- source_word: ἐζήτουν
  choice: искали
  rationale: Естественно передаёт продолженное действие имперфекта; русский вид глагола и контекст выражают длительность без тяжеловесной конструкции.
- source_word: ἐν τῇ ἑορτῇ
  choice: на празднике
  rationale: Естественное русское обозначение происходящего во время уже упомянутого праздника Кущей.
- source_word: ἔλεγον
  choice: спрашивали
  rationale: Вводит последующий прямой вопрос естественно по-русски; имперфект допускает продолжающееся или повторявшееся высказывание.
- source_word: ἐκεῖνος
  choice: Он
  rationale: В данном прямом вопросе естественное русское указание на отсутствующего человека; прописная буква служит принятой в русском библейском стиле формой уважительного обозначения Иисуса, не добавляя существительного «человек».
theological_decisions:
- issue: Кого обозначает Ἰουδαῖοι в повествовании Иоанна
  choice: «иудеи» в основном тексте с поясняющей сноской
  alternative: «жители Иудеи» или «иудейские религиозные власти»
  rationale: Сам стих не ограничивает референт одними руководителями, хотя в контексте Евангелия от Иоанна слово нередко обозначает иудеев Иудеи, особенно влиятельных противников Иисуса. Сноска сохраняет эту контекстуальную возможность, не превращая её в однозначное утверждение текста.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционным библейским звучанием. Повтор двух имперфектов передан естественно, без искусственной конструкции «продолжали говорить». Указательное ἐκεῖνος не усилено добавлением «человек» или явно пренебрежительным «этот».
