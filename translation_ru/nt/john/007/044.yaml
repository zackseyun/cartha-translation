  text: τινὲς δὲ ἤθελον ἐξ αὐτῶν πιάσαι αὐτόν, ἀλλ’ οὐδεὶς ⸀ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/044.yaml
  text: But some of them wanted to seize him[b][a], yet no one laid hands on him.
translation:
  language: ru
  text: Некоторые же из них хотели схватить Его[a], но никто не схватил Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «арестовать Его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ
  choice: Некоторые же
  rationale: «Некоторые» сохраняет неопределённость и указывает на часть упомянутой группы; частица «же» естественно передаёт контраст δὲ с предыдущими реакциями.
- source_word: ἤθελον
  choice: хотели
  rationale: Естественная русская передача прошедшего несовершенного вида, выражающая сохранявшееся намерение без избыточного уточнения аспектуального оттенка.
- source_word: ἐξ αὐτῶν
  choice: из них
  rationale: Кратко и точно обозначает часть более широкой группы.
- source_word: πιάσαι
  choice: схватить
  rationale: Передаёт основное значение физического захвата и не устраняет контекстуально возможный смысл ареста.
- source_word: ἀλλ’ οὐδεὶς
  choice: но никто
  rationale: Ясно выражает резкое противопоставление намерения и результата.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: не наложил на Него рук
  rationale: Сохраняет греческий образ физического посягательства и при этом остаётся понятным в современном литературном русском.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис близок к греческому, но естественен по-русски; прописное написание местоимений, относящихся к Иисусу, сохранено как традиционная издательская норма, не меняющая смысла.
