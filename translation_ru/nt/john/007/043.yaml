  text: σχίσμα οὖν ⸂ἐγένετο ἐν τῷ ὄχλῳ⸃ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/043.yaml
  text: So there was a division in the crowd because of him.
translation:
  language: ru
  text: Итак, из-за Него в толпе произошёл раскол.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  choice: раскол
  rationale: Слово обозначает разделение людей на противостоящие стороны. «Раскол» естественно передаёт возникший в толпе разлад, не привнося обязательного значения официального религиозного раскола.
- source_word: οὖν
  choice: итак
  rationale: Связывает стих с предшествующим спором и указывает на его результат; «итак» сохраняет эту связь без чрезмерно строгого логического оттенка.
- source_word: ἐγένετο
  choice: произошёл
  rationale: В сочетании с σχίσμα глагол указывает на возникновение разделения; «произошёл раскол» — естественная русская конструкция.
- source_word: ἐν τῷ ὄχλῳ
  choice: в толпе
  rationale: ὄχλος обозначает собравшуюся толпу; буквальное и идиоматичное «в толпе» точно сохраняет образ.
- source_word: δι’ αὐτόν
  choice: из-за Него
  rationale: διά с винительным падежом выражает причину. Русское «из-за Него» ясно передаёт, что причиной разделения стало отношение к Иисусу; местоимение сохранено без поясняющей вставки.
theological_decisions:
- issue: К кому относится αὐτόν
  choice: «Него» — Иисус
  alternative: явно назвать «Иисуса»
  rationale: Из контекста ясно, что местоимение относится к Иисусу. Сохранение местоимения следует греческому тексту и не добавляет ненужного толкования.
translation_notes:
  register: Современный литературный русский язык; краткая и достойная формулировка. Заглавная буква в местоимении «Него» соответствует распространённой русской библейской издательской норме при указании на Иисуса.
