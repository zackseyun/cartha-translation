  text: ἄλλοι ἔλεγον· Οὗτός ἐστιν ὁ χριστός· ⸂οἱ δὲ⸃ ἔλεγον· Μὴ γὰρ ἐκ τῆς Γαλιλαίας ὁ χριστὸς ἔρχεται;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/041.yaml
  text: Others were saying[a], “This is the Messiah.” But some were saying, “Surely the Messiah does not come from Galilee[b], does he?”
translation:
  language: ru
  text: 'Другие говорили: «Это Мессия[a]». А некоторые говорили: «Разве Мессия приходит из Галилеи?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос».'
    reason: Сохраняется традиционное греческое по форме соответствие титулу ὁ χριστός.
lexical_decisions:
- source_word: ἄλλοι
  choice: Другие
  rationale: Субстантивированное прилагательное во множественном числе обозначает другую группу среди народа; «другие» прямо и естественно передаёт это противопоставление.
- source_word: ἔλεγον
  choice: говорили / возражали
  rationale: Имперфект допускает продолженное или повторявшееся высказывание. В первой части это передано словом «говорили», а во второй контрастное δέ и содержание реплики позволяют естественное «возражали».
- source_word: Οὗτός ἐστιν
  choice: Это
  rationale: Естественная русская форма указательного отождествления; буквальное «этот есть» звучало бы архаично и неестественно.
- source_word: ὁ χριστός
  choice: Мессия
  rationale: Здесь слово употреблено как титул ожидаемого Помазанника, а не как имя; «Мессия» сохраняет иудейский контекст спора.
- source_word: οἱ δὲ
  choice: А некоторые
  rationale: Артикль во множественном числе с δέ вводит противопоставленную группу. «А некоторые» по-русски естественно отличает её от ранее упомянутых людей, не создавая тяжёлого повтора «другие… другие».
- source_word: Μὴ γὰρ
  choice: Разве…?
  rationale: Вопрос с μή предполагает отрицательный ответ, а γάρ придаёт реплике обосновывающий или недоверчивый оттенок. Русское «разве» естественно передаёт эту риторическую силу.
- source_word: ἐκ τῆς Γαλιλαίας
  choice: из Галилеи
  rationale: Предлог ἐκ указывает на источник или место происхождения; нормативное русское соответствие — «из».
- source_word: ἔρχεται
  choice: придёт
  rationale: Греческое настоящее выражает общее ожидание о явлении Мессии. В русском риторическом вопросе о его ожидаемом приходе будущее время звучит естественно и не меняет смысла.
theological_decisions:
- issue: Передача Χριστός как титула
  choice: Мессия
  alternative: Христос
  rationale: Речь идёт о споре относительно ожидаемого мессианского лица, поэтому «Мессия» яснее сохраняет титульный и иудейский смысл. Традиционное «Христос» приведено в сноске как допустимое соответствие.
- issue: Риторический вопрос о происхождении Мессии
  choice: «Разве Мессия придёт из Галилеи?»
  alternative: «Мессия ведь не из Галилеи приходит, не так ли?»
  rationale: Форма с «разве» сохраняет ожидание отрицательного ответа, не подтверждая истинность предположения говорящих и не разрешая богословскую иронию повествования.
translation_notes:
  register: Современный литературный русский язык, пригодный для публичного чтения. Реплики переданы просто и достойно; «возражали» делает контраст групп ясным без избыточного повтора. Архаизмы и конфессионально окрашенные уточнения не добавлялись.
