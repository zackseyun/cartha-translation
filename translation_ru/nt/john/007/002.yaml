  yaml_path: translation/nt/john/007/002.yaml
  text: The Jewish feast[a], the Feast of Tabernacles, was near.
translation:
  language: ru
  text: Приближался иудейский праздник — праздник Кущей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, букв.: «праздник Шалашей».'
