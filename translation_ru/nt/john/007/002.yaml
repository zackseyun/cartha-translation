lexical_decisions:
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Слабый повествовательный связующий элемент. В русском отдельное «же» или «а» здесь звучало бы тяжеловесно либо создавало бы лишний оттенок противопоставления; переход естественно передаётся порядком и построением фразы.
- source_word: ἦν … ἐγγὺς
  choice: приближался
  rationale: Естественно передаёт временную близость праздника в современном русском; буквальное «был близок» менее идиоматично.
- source_word: ἑορτὴ
  choice: праздник
  rationale: Обычное и точное обозначение религиозного празднования; в данном контексте естественнее, чем «торжество» или «фестиваль».
- source_word: τῶν Ἰουδαίων
  choice: иудейский
  rationale: Генитив обозначает принадлежность праздника иудейскому народу. Прилагательное естественно по-русски и не придаёт выражению полемического смысла.
- source_word: σκηνοπηγία
  choice: праздник Кущей
  rationale: Сохранено общепринятое русское название праздника. Более прозрачное буквальное значение «праздник Шалашей» дано в сноске.
theological_decisions:
- issue: Передача τῶν Ἰουδαίων в названии праздника
  choice: иудейский
  alternative: праздник иудеев
  rationale: Здесь словосочетание просто определяет праздник как иудейский, а не выражает полемику; форма с прилагательным точна и естественна.
- issue: Название σκηνοπηγία
  choice: праздник Кущей
  alternative: праздник Шалашей
  rationale: Традиционное название обеспечивает узнаваемость, а буквальный вариант в сноске раскрывает значение греческого слова без навязывания дополнительного толкования.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Конструкция с тире сохраняет пояснительное приложение греческого текста, а глагол «приближался» передаёт временную близость естественно и ясно.
