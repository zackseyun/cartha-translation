  text: λέγει οὖν αὐτοῖς ὁ Ἰησοῦς· Ὁ καιρὸς ὁ ἐμὸς οὔπω πάρεστιν, ὁ δὲ καιρὸς ὁ ὑμέτερος πάντοτέ ἐστιν ἕτοιμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/006.yaml
  text: So Jesus said to them[a], “My time has not yet come, but your time is always ready.”
translation:
  language: ru
  text: 'Тогда Иисус сказал им: «Моё время ещё не пришло[a], а для вас всегда есть подходящее время».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моё назначенное время ещё не наступило». Греческое слово может означать не просто время вообще, а подходящий или назначенный момент.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Тогда
  rationale: Передаёт связь с предшествующим повествованием естественно для современного русского языка; здесь частица может обозначать как следствие, так и продолжение рассказа.
- source_word: λέγει ... ὁ Ἰησοῦς
  choice: Иисус сказал
  rationale: Историческое настоящее в греческом естественно передано русским прошедшим временем в повествовании.
- source_word: αὐτοῖς
  choice: им
  rationale: Прямое соответствие дательному косвенного объекта; из контекста ясно, что речь идёт о братьях Иисуса.
- source_word: ὁ καιρὸς ὁ ἐμός
  choice: Моё время
  rationale: Сохраняет подчёркнутое противопоставление времени Иисуса времени его собеседников, не заменяя καιρός словом «час».
- source_word: οὔπω πάρεστιν
  choice: ещё не пришло
  rationale: Естественно передаёт смысл отсутствия или ненаступления соответствующего момента.
- source_word: δὲ
  choice: а
  rationale: Русский противительный союз ясно и естественно выражает контраст между двумя частями высказывания.
- source_word: ὁ καιρὸς ὁ ὑμέτερος πάντοτέ ἐστιν ἕτοιμος
  choice: для вас время всегда подходящее
  rationale: Буквальное «ваше время всегда готово» по-русски звучит неестественно. Формулировка сохраняет смысл постоянной доступности подходящего момента и контраст с временем Иисуса.
theological_decisions:
- issue: Значение «времени» Иисуса в контексте Евангелия от Иоанна
  choice: Моё время
  alternative: Мой назначенный срок; Мой час
  rationale: В тексте стоит καιρός, а не ὥρα. Перевод не вводит слово «час» и не раскрывает в основном тексте богословское значение момента, сохраняя присущую оригиналу смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Во второй части идиоматическое «для вас время всегда подходящее» предпочтено формально буквальному, но неестественному «ваше время всегда готово».
