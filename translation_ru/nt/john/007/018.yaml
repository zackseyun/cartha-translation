source:
  edition: SBLGNT
  text: ὁ ἀφ’ ἑαυτοῦ λαλῶν τὴν δόξαν τὴν ἰδίαν ζητεῖ· ὁ δὲ ζητῶν τὴν δόξαν τοῦ πέμψαντος αὐτὸν οὗτος ἀληθής ἐστιν καὶ ἀδικία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/018.yaml
  text: The one who speaks from himself seeks his own glory[a]; but the one who seeks the glory of the one who sent him, this one is true[c][b], and there is no unrighteousness in him.
translation:
  language: ru
  text: Кто говорит от себя[a], тот ищет собственной славы; а кто ищет славы того, кто послал его, тот правдив[b], и нет в нём неправедности[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по собственной инициативе»; возможно также: «по собственному почину».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «истинен» или «подлинен».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «несправедливости» или «неправды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ ἑαυτοῦ
  choice: от себя
  rationale: Буквальное и естественное русское соответствие сохраняет противопоставление между речью, исходящей от самого говорящего, и поручением пославшего; возможный смысл «по собственной инициативе» указан в сноске.
- source_word: λαλῶν
  choice: кто говорит
  rationale: Субстантивированное причастие передано обобщающей конструкцией, естественной для современного русского языка.
- source_word: τὴν δόξαν τὴν ἰδίαν
  choice: собственной славы
  rationale: «Слава» сохраняет устойчивое богословское и повествовательное значение δόξα у Иоанна, а «собственной» ясно передаёт противопоставление славе пославшего.
- source_word: ζητεῖ
  choice: ищет
  rationale: Повтор одного и того же глагола в обеих частях сохраняет параллелизм греческого текста.
- source_word: τοῦ πέμψαντος αὐτόν
  choice: того, кто послал его
  rationale: Передаёт артиклевое причастие ясно и без добавочного истолкования личности пославшего; строчная буква не вносит отсутствующего в греческом текста конфессионального оформления.
- source_word: οὗτος
  choice: тот
  rationale: Русское указательное местоимение сохраняет эмфатическое соотнесение именно с человеком, ищущим славы пославшего.
- source_word: ἀληθής
  choice: истинен
  rationale: Сохраняет более широкий диапазон значения — истинность, подлинность и правдивость, — не сужая его сразу до одного качества речи.
- source_word: ἀδικία
  choice: неправедность
  rationale: Передаёт нравственную и богословскую широту слова; варианты «несправедливость» и «неправда» отмечены в сноске.
- source_word: ἐν αὐτῷ οὐκ ἔστιν
  choice: нет в нём
  rationale: Естественная русская экзистенциальная конструкция сохраняет внутреннюю нравственную характеристику человека.
theological_decisions:
- issue: Противопоставление речи «от себя» и поиска славы пославшего
  choice: Сохранено противопоставление источника и цели речи без уточнения, будто речь обязательно идёт о технически понимаемой самостоятельной власти.
  alternative: «Говорит по собственной инициативе» или «говорит своей властью».
  rationale: 'Контекст связывает происхождение учения с направленностью говорящего: на собственную славу или на славу пославшего. Буквально близкая формулировка сохраняет эту смысловую напряжённость.'
- issue: Значение ἀληθής применительно к человеку
  choice: «истинен» с примечанием о варианте «правдив».
  alternative: «Правдив» или «подлинен».
  rationale: Греческое слово может характеризовать как правдивость, так и истинность или подлинность человека; основной текст не должен без необходимости сужать это значение.
- issue: Значение ἀδικία
  choice: «неправедность».
  alternative: «Несправедливость», «неправда» или «зло».
  rationale: В данном нравственном утверждении «неправедность» сохраняет широкое значение отсутствия правоты, не сводя его только к социальной несправедливости или отдельному проступку.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксический параллелизм и повтор «ищет» сохранены. Формы «тот истинен» и «неправедность» несколько торжественны, но понятны и позволяют удержать смысловую широту греческих слов.
