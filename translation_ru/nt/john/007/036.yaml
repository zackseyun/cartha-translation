  text: τίς ἐστιν ⸂ὁ λόγος οὗτος⸃ ὃν εἶπε· Ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/036.yaml
  text: What is this statement that he said[a], ‘You will seek me and will not find me, and where I am[c][b], you are not able to come’?”
translation:
  language: ru
  text: 'Что это за высказывание[a], которое он произнёс: «Вы будете искать меня и не найдёте, и туда, где я[b], вы прийти не можете»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Что это за слово, которое он сказал?» Здесь греческое λόγος может означать «слово», «высказывание» или «сказанное».'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте: «где я», а не «куда я иду».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λόγος οὗτος
  choice: эти слова
  rationale: В данном контексте λόγος обозначает содержание произнесённого Иисусом высказывания. Русское множественное «слова» естественно передаёт цельное высказывание, не сводя его к одному отдельному слову.
- source_word: Ζητήσετέ με
  choice: будете искать меня
  rationale: Передаёт будущее время и обычное значение ζητέω, сохраняя весомость глагола «искать».
- source_word: οὐχ εὑρήσετε
  choice: не найдёте
  rationale: Прямо передаёт отрицание в будущем времени; дополнение «меня» естественно подразумевается из предыдущей части и по-русски не требует повторения.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: туда, где я
  rationale: Сохраняет настоящее время εἰμί — «я есть/нахожусь», не заменяя его истолковывающим «куда я иду».
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: вы прийти не можете
  rationale: Явно передаёт значение способности или возможности в δύνασθε; порядок слов звучит естественно и подчёркивает невозможность прийти.
theological_decisions:
- issue: Настоящее время в выражении ὅπου εἰμὶ ἐγώ
  choice: «где я»
  alternative: «куда я иду»
  rationale: В греческом тексте стоит настоящее εἰμί. Формулировка «где я» сохраняет намеренное напряжение в повествовании Иоанна и не сводит смысл только к будущему месту назначения.
translation_notes:
  register: Современный литературный русский язык; синтаксис вопроса и единая непрерывная цитата сохранены. Местоимения, относящиеся к Иисусу, написаны со строчной буквы согласно общей современной орфографической норме.
