base_translation:
  language: en
  yaml_path: translation/nt/john/007/023.yaml
  text: If a man receives circumcision on the Sabbath so that the law of Moses may not be broken[c][b][a], are you angry with me because I made a whole man well on the Sabbath?
translation:
  language: ru
  text: Если в субботу человеку совершают обрезание, чтобы не был нарушен закон Моисея, то почему вы негодуете на Меня за то, что Я исцелил всего человека в субботу?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «всего человека» подчёркивают сопоставление обрезания одной части тела с исцелением человека целиком.
    reason: cross_reference
lexical_decisions:
- source_word: περιτομὴν λαμβάνει
  choice: принимает обрезание
  rationale: Передаёт греческую идиому близко к форме оригинала и при этом понятно по-русски; более обычное «подвергается обрезанию» возможно, но менее формально соответствует λαμβάνει.
- source_word: ἄνθρωπος
  choice: человек
  rationale: В данном контексте речь по необходимости идёт о мужчине, однако русское «человек принимает обрезание» естественно и не утрачивает контекстуальной определённости пола.
- source_word: ἐν σαββάτῳ
  choice: в субботу
  rationale: Естественная русская передача обстоятельства времени, относящегося к соблюдению субботы.
- source_word: ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως
  choice: чтобы не был нарушен закон Моисея
  rationale: В юридико-религиозном контексте λύω допускает значение нарушения или отмены; «не был нарушен» ясно передаёт логику соблюдения предписания, не утверждая, что закон буквально уничтожается.
- source_word: χολᾶτε
  choice: негодуете на Меня
  rationale: «Негодуете» передаёт не просто чувство гнева, но возмущённую реакцию против Иисуса, не доводя интенсивность до «ярости».
- source_word: ὅλον ἄνθρωπον
  choice: всего человека
  rationale: Сохраняет подчёркнутый контраст между действием над одной частью тела при обрезании и восстановлением человека целиком.
- source_word: ὑγιῆ ἐποίησα
  choice: исцелил
  rationale: Естественно передаёт смысл «сделал здоровым». Сочетание «всего человека исцелил» сохраняет риторическое выделение целостности, хотя буквальная конструкция была бы «сделал всего человека здоровым».
theological_decisions:
- issue: Сопоставление обрезания и исцеления в субботу
  choice: Иисус рассуждает от допускаемого в субботу обрезания к тем более оправданному исцелению всего человека.
  alternative: Общее противопоставление обрядового закона сострадательному поступку.
  rationale: Формулировка сохраняет аргумент от меньшего к большему и не превращает его в привнесённую полемику против Моисеева закона.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Негодуете» несколько возвышеннее разговорного «сердитесь», но точно передаёт χολᾶτε. Заглавные местоимения «Меня», «Я» соблюдают распространённую русскую библейскую издательскую норму.
