  text: ἐγὼ οἶδα αὐτόν, ὅτι παρ’ αὐτοῦ εἰμι κἀκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/029.yaml
  text: I know him[a], because I am from him[b], and he sent me.
translation:
  language: ru
  text: Я знаю Его, потому что Я от Него[a], и Он послал Меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я знаю, что Я от Него». Греческий союз может вводить как причину («потому что»), так и содержание высказывания («что»); контекст скорее указывает на причину. Выражение «Я от Него» можно также передать: «Я пришёл от Него» или «Я из Его присутствия».'
    reason: Сохранение неоднозначности союза ὅτι и смыслового диапазона παρ’ αὐτοῦ εἰμι.
lexical_decisions:
- source_word: ἐγὼ
  choice: Я
  rationale: 'Явное местоимение передаёт подчёркнутое противопоставление: Иисус, в отличие от собеседников, знает Отца.'
- source_word: οἶδα
  choice: знаю
  rationale: Перфектная по форме лексема употреблена в настоящем значении состояния знания; естественный русский эквивалент — «знаю».
- source_word: αὐτόν
  choice: Его
  rationale: Местоимение относится в контексте к Отцу; сохранено без поясняющей вставки.
- source_word: ὅτι
  choice: потому что
  rationale: Союз наиболее естественно вводит основание утверждения «Я знаю Его», хотя грамматически возможно и изъяснительное понимание.
- source_word: παρ’ αὐτοῦ
  choice: от Него
  rationale: παρά с родительным падежом обозначает источник или происхождение. «От Него» сохраняет ёмкость греческого выражения, не сводя его только к приходу или местонахождению.
- source_word: εἰμι
  choice: Я от Него
  rationale: Настоящее время связки сохранено; перевод не заменяет его более узким «Я пришёл от Него».
- source_word: κἀκεῖνός
  choice: и Он
  rationale: Слияние καί и ἐκεῖνος естественно передаётся по-русски сочетанием «и Он».
- source_word: με
  choice: Меня
  rationale: Прямое дополнение к глаголу «послал».
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Аорист передан русским прошедшим совершенного вида; формулировка сохраняет тему посланничества.
theological_decisions:
- issue: Смысл отношения Иисуса к Отцу в выражении παρ’ αὐτοῦ εἰμι
  choice: «Я от Него» — источник и происхождение выражены без дальнейшего истолкования.
  alternative: «Я пришёл от Него»; «Я из Его присутствия».
  rationale: Буквально ёмкая формулировка сохраняет богословскую глубину и напряжение текста, не ограничивая смысл лишь отправлением на миссию или пространственной близостью.
- issue: Функция союза ὅτι
  choice: Причинное «потому что».
  alternative: 'Изъяснительное «что»: «Я знаю, что Я от Него».'
  rationale: 'Контекст и синтаксическая связь благоприятствуют причинному смыслу: Иисус знает Его, поскольку Он от Него. Подлинная грамматическая неоднозначность отмечена в сноске.'
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-сдержанный. Прописные буквы в местоимениях, относящихся к Отцу и Иисусу, соответствуют принятой русской библейской издательской традиции. Порядок частей и повтор «Я» сохраняют акцент исходного текста.
