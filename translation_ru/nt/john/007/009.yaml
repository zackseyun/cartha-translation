  source_fidelity: 'Текст точно передаёт греческий оригинал: деепричастие «Сказав» выражает предшествующее действие εἰπών, «это» естественно отсылает к предшествующим словам (ταῦτα), «Он сам» сохраняет эмфазу αὐτός, а «остался в Галилее» верно передаёт ἔμεινεν ἐν τῇ Γαλιλαίᾳ.'
  naturalness: Фраза краткая, грамматически безупречная и естественная для современного литературного русского библейского повествования. «Сказав это» звучит несколько компактнее английского «After saying these things», но не утрачивает смысла.
  terminology: «Галилея» передана в нормативной русской форме. «Остался» точно соответствует повествовательному значению μένω в данном контексте. Выделение «Он сам» оправдано явным αὐτός и согласуется с английской аудиторской фиксацией эмфазы.
