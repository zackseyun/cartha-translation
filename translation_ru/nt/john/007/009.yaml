  text: ταῦτα ⸀δὲ εἰπὼν ⸀αὐτὸς ἔμεινεν ἐν τῇ Γαλιλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/009.yaml
  text: After saying these things, he himself remained in Galilee.
translation:
  language: ru
  text: Сказав это, Он сам остался в Галилее.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: это
  rationale: Указательное местоимение среднего рода во множественном числе отсылает к предшествующим словам; по-русски естественно передаётся собирательным «это».
- source_word: δὲ … εἰπὼν
  choice: Сказав
  rationale: Частица δέ продолжает повествование, а аористное причастие обозначает действие, предшествующее главному; русское деепричастие естественно передаёт эту последовательность без лишнего союза.
- source_word: αὐτὸς
  choice: Он сам
  rationale: Явно выраженное αὐτός имеет эмфатическую силу и в контексте противопоставляет поступок Иисуса действиям Его братьев.
- source_word: ἔμεινεν
  choice: остался
  rationale: В данном повествовательном контексте μένω означает, что Иисус не покинул Галилею; «остался» естественно и точно передаёт это значение.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: в Галилее
  rationale: Прямое и естественное обозначение места.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая, естественная повествовательная фраза. Заглавная буква в местоимении «Он» следует принятой русской библейской издательской традиции при указании на Иисуса.
