    issue: В придаточном опущено явное соответствие εἰμί.
    rationale: Оборот «где Я» может функционировать как локативный эллипсис, но «где Я нахожусь» яснее передаёт «ὅπου εἰμὶ ἐγώ» и сохраняет утверждение о местонахождении Иисуса.
  revised_text: Вы будете искать Меня и не найдёте; и туда, где Я нахожусь, вы не можете прийти.
