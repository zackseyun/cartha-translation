base_translation:
  language: en
  yaml_path: translation/nt/john/007/034.yaml
  text: You will seek me and will not find me[a], and where I am[b], you are not able to come.
translation:
  language: ru
  text: Вы будете искать Меня и не найдёте; и туда, где Я нахожусь, вы не можете прийти.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητήσετέ
  choice: будете искать
  rationale: Будущее время, 2-е лицо множественного числа. «Искать» прямо и естественно передаёт попытку найти Иисуса, не добавляя особого религиозного оттенка.
- source_word: με
  choice: Меня
  rationale: Прямое дополнение, относящееся к Иисусу.
- source_word: οὐχ εὑρήσετε
  choice: не найдёте
  rationale: Простое отрицание в будущем времени; в греческом тексте нет дополнительного усиления.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: туда, где Я
  rationale: Оборот естественно передаёт указанное место назначения. Выраженное местоимение ἐγώ сохраняется как «Я» и поддерживает контраст с «вы».
- source_word: ὑμεῖς οὐ δύνασθε ἐλθεῖν
  choice: вы не можете прийти
  rationale: Формулировка явно сохраняет значение неспособности или невозможности, выраженное δύνασθε, а не запрета.
theological_decisions:
- issue: Характер невозможности прийти туда, где находится Иисус
  choice: «вы не можете прийти» — утверждение о невозможности без уточнения её причины
  alternative: «вам нельзя прийти» — понимание как запрета
  rationale: δύνασθε обозначает способность или возможность, а не разрешение. Сам стих не определяет, является ли эта невозможность духовной, нравственной, судебной или временной, поэтому перевод не снимает эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык, сдержанный и понятный. Точка с запятой ясно разделяет два связанных предсказания. Заглавные буквы в местоимениях, относящихся к Иисусу, соответствуют принятому русскому библейскому регистру, не меняя смысла исходного текста.
