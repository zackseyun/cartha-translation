id: JHN.7.51
reference: John 7:51
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Μὴ ὁ νόμος ἡμῶν κρίνει τὸν ἄνθρωπον ἐὰν μὴ ἀκούσῃ ⸂πρῶτον παρ’ αὐτοῦ⸃ καὶ γνῷ τί ποιεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/051.yaml
  text: Our law does not judge a man unless it first hears from him and knows what he is doing[b][a], does it?
translation:
  language: ru
  text: Разве наш закон судит человека, не выслушав прежде его самого и не узнав, что он делает?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ
  choice: Разве ...?
  rationale: Начальное μή вводит вопрос, предполагающий отрицательный ответ; русская конструкция «разве» естественно передаёт эту риторическую силу.
- source_word: ὁ νόμος ἡμῶν
  choice: наш закон
  rationale: Передаёт принадлежность закона общине говорящих, не сужая значение исключительно до Пятикнижия.
- source_word: κρίνει
  choice: судит
  rationale: Сохраняет широкое юридическое значение «судить, выносить решение», не усиливая его до «осуждать».
- source_word: τὸν ἄνθρωπον
  choice: человека
  rationale: Естественно передаёт родовое единственное число; в русском «человек» здесь относится к любому лицу.
- source_word: ἐὰν μὴ
  choice: не ... прежде
  rationale: Отрицательная деепричастная конструкция естественно выражает необходимое предварительное условие в русском вопросе.
- source_word: ἀκούσῃ πρῶτον παρ’ αὐτοῦ
  choice: не выслушав прежде его самого
  rationale: «Выслушать» уместно в юридической процедуре и передаёт получение показаний непосредственно от человека; «прежде» сохраняет πρῶτον, а «его самого» — оттенок παρ’ αὐτοῦ.
- source_word: γνῷ
  choice: не узнав
  rationale: Передаёт вхождение в знание, то есть установление обстоятельств дела, точнее для данного контекста, чем статическое «знать».
- source_word: τί ποιεῖ
  choice: что он делает
  rationale: Сохраняет настоящее время и не подменяет его формой «что он сделал».
theological_decisions: []
