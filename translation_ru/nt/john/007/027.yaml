  text: ἀλλὰ τοῦτον οἴδαμεν πόθεν ἐστίν· ὁ δὲ χριστὸς ὅταν ἔρχηται οὐδεὶς γινώσκει πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/027.yaml
  text: But we know where this man is from; but when the Messiah comes[a], no one knows where he is from.
translation:
  language: ru
  text: Но мы знаем, откуда этот человек; а когда придёт Мессия, никто не знает, откуда он.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт прямое противопоставление предшествующему рассуждению естественным русским союзом.
- source_word: τοῦτον
  choice: этот человек
  rationale: Указательное местоимение относится непосредственно к Иисусу; выражение сохраняет конкретный и несколько подчёркнутый характер реплики.
- source_word: οἴδαμεν
  choice: мы знаем
  rationale: Прямо передаёт имеющееся у говорящих знание.
- source_word: πόθεν ἐστίν
  choice: откуда этот человек / откуда он
  rationale: Естественно выражает происхождение и сохраняет повтор формулировки в обеих частях стиха.
- source_word: ὁ δὲ χριστός
  choice: когда же придёт Мессия
  rationale: «Мессия» передаёт χριστός как титул ожидаемого Помазанника, а частица «же» сохраняет контраст δέ.
- source_word: ὅταν ἔρχηται
  choice: когда придёт
  rationale: Естественно передаёт неопределённое будущее событие в контексте ожидания прихода Мессии.
- source_word: οὐδεὶς γινώσκει
  choice: никто не знает
  rationale: Ясная современная русская формулировка всеобщего отрицания знания.
theological_decisions:
- issue: Передача Χριστός как титула
  choice: Мессия
  alternative: Христос / Помазанник
  rationale: Здесь слово обозначает ожидаемую мессианскую фигуру, а не употребляется как имя; «Мессия» сохраняет иудейский контекст высказывания.
- issue: Утверждение толпы о происхождении Мессии
  choice: Передать реплику прямо, не подтверждая и не опровергая её
  alternative: Добавить пояснение о предполагаемом неизвестном происхождении Мессии
  rationale: Это сообщаемое евангелистом мнение говорящих. Перевод сохраняет присущую тексту богословскую напряжённость и не вносит толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Точка с запятой сохраняет тесное, но отчётливое противопоставление двух частей. Местоимение «он» написано со строчной буквы, поскольку это реплика толпы и грамматическая отсылка, а не добавленная переводчиком конфессиональная маркировка.
