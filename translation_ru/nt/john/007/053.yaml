translation:
  language: ru
  text: И[a] каждый пошёл к себе домой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: С этого стиха начинается рассказ о женщине, застигнутой в прелюбодеянии (Ин. 7:53–8:11). Весь этот отрывок отсутствует в наиболее ранних греческих рукописях, включая папирусы III века, а также Синайский и Ватиканский кодексы IV века, и в ранних коптских и сирийских переводах. Он присутствует в Кодексе Безы V века, латинской традиции и более поздней византийской традиции большинства рукописей. В некоторых рукописях рассказ помещён в других местах — например, после Ин. 21:25 или Лк. 21:38, — что указывает на его отдельную историю передачи до включения в рукописную традицию Евангелий. Здесь он сохранён ввиду его многовекового места в христианском чтении и церковной традиции.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπορεύθη
  choice: пошёл
  rationale: Аорист πορεύομαι обозначает уход или перемещение; в контексте расходящегося собрания естественное русское соответствие — «пошёл».
- source_word: ἕκαστος
  choice: каждый
  rationale: Форма единственного числа подчёркивает, что присутствующие разошлись по отдельности.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: к себе домой
  rationale: Хотя οἶκος буквально означает «дом», всё выражение идиоматически передаёт возвращение каждого в собственный дом; «к себе домой» звучит естественно и сохраняет значение αὐτοῦ.
theological_decisions:
- issue: Текстуальный статус Ин. 7:53–8:11
  choice: Сохранить стих в основном тексте и отметить рукописную вариативность в сноске
  alternative: Исключить стих из основного текста или заключить весь отрывок в скобки
  rationale: Стих присутствует в заданном византийском исходном тексте и имеет длительную историю церковного чтения, однако значимые ранние свидетели не содержат этот отрывок, поэтому неопределённость его текстуальной истории необходимо сообщить читателю.
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная фраза передана просто и достойно. Начальный союз «И» сохранён как соответствие Καί и как связь с предшествующим повествованием.
