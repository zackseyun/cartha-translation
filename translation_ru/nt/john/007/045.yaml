  text: Ἦλθον οὖν οἱ ὑπηρέται πρὸς τοὺς ἀρχιερεῖς καὶ Φαρισαίους, καὶ εἶπον αὐτοῖς ἐκεῖνοι· Διὰ τί οὐκ ἠγάγετε αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/045.yaml
  text: So the officers came to the chief priests and Pharisees[a], and they said to them[b], “Why did you not bring him?”
translation:
  language: ru
  text: 'Итак, служители пришли к первосвященникам и фарисеям, и те спросили их: «Почему вы не привели его?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Итак
  rationale: Передаёт следствие и переход к следующему событию в повествовании; в данном контексте звучит естественно и сохраняет связующую функцию частицы.
- source_word: ὑπηρέται
  choice: служители
  rationale: Обозначает подчинённых представителей властей, посланных схватить Иисуса. «Служители» сохраняет традиционную и достаточно широкую формулировку, не добавляя прямо отсутствующего в тексте уточнения «храмовая стража».
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся русское обозначение руководителей священнической среды во множественном числе.
- source_word: Φαρισαίους
  choice: фарисеям
  rationale: Устоявшаяся русская передача названия религиозной группы.
- source_word: ἐκεῖνοι
  choice: те
  rationale: Указательное местоимение явно отсылает к первосвященникам и фарисеям и выделяет их как говорящих; русское «те» естественно сохраняет эту выраженную в греческом тексте отсылку.
- source_word: εἶπον
  choice: спросили
  rationale: Буквально «сказали», но последующая прямая речь является вопросом; «спросили» естественно передаёт речевое действие без изменения содержания.
- source_word: Διὰ τί
  choice: Почему
  rationale: Естественный русский вопросительный эквивалент выражения причины.
- source_word: ἠγάγετε
  choice: не привели
  rationale: Глагол может означать «вести» или «приводить»; здесь служители были посланы задержать Иисуса и доставить Его к властям, поэтому «привели» точно соответствует контексту.
- source_word: αὐτόν
  choice: Его
  rationale: Местоимение относится к Иисусу; прописная буква соответствует принятому благоговейному русскому библейскому регистру, не меняя смысла исходного текста.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Указательное ἐκεῖνοι сохранено посредством «те», но тяжеловесное «те люди» не используется. «Вернулись» контекстуально передаёт прибытие посланных служителей обратно к отправившим их властям; сам глагол ἦλθον буквально означает «пришли».
