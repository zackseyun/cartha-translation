  text: εἶπον οὖν πρὸς αὐτὸν οἱ ἀδελφοὶ αὐτοῦ· Μετάβηθι ἐντεῦθεν καὶ ὕπαγε εἰς τὴν Ἰουδαίαν, ἵνα καὶ οἱ μαθηταί σου ⸀θεωρήσουσιν ⸂σοῦ τὰ ἔργα⸃ ἃ ποιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/003.yaml
  text: So his brothers said to him[a], “Leave here and go to Judea, so that your disciples also may see the works you are doing.”
translation:
  language: ru
  text: 'Итак, братья Иисуса сказали Ему: «Уйди отсюда и отправляйся в Иудею, чтобы и Твои ученики увидели[a] дела, которые Ты совершаешь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы и Твои ученики наблюдали за делами, которые Ты совершаешь». Греческий глагол может обозначать не только зрительное восприятие, но и внимательное наблюдение; формально он стоит в будущем времени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Тогда
  rationale: Естественная повествовательная связка, передающая последовательный и выводный оттенок греческой частицы без излишней формальности.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: братья Иисуса
  rationale: Мужской род множественного числа в данном контексте указывает на членов семьи Иисуса мужского пола. Имя повторено вместо местоимения для ясности по-русски.
- source_word: Μετάβηθι ἐντεῦθεν
  choice: Уйди отсюда
  rationale: Прямое и естественное повеление покинуть нынешнее место.
- source_word: ὕπαγε εἰς τὴν Ἰουδαίαν
  choice: отправляйся в Иудею
  rationale: Передаёт повеление двигаться в названную область; «отправляйся» хорошо сочетается с предшествующим «уйди» и избегает неуклюжего повтора.
- source_word: ἵνα καὶ οἱ μαθηταί σου
  choice: чтобы и Твои ученики
  rationale: 'Сохраняет целевое значение ἵνα и включительное значение καὶ: увидеть дела должны также ученики.'
- source_word: θεωρήσουσιν
  choice: увидели
  rationale: В целевом обороте после ἵνα будущая форма естественно передаётся по-русски прошедшим временем совершенного вида после «чтобы»; глагол может также подразумевать внимательное наблюдение.
- source_word: σοῦ τὰ ἔργα ἃ ποιεῖς
  choice: дела, которые Ты совершаешь
  rationale: Сохраняет характерный для Иоанна тематический термин «дела» и естественно выражает связь этих дел с Иисусом.
theological_decisions:
- issue: Кого обозначают «братья Иисуса»
  choice: Члены семьи Иисуса мужского пола, названные Его братьями
  alternative: Более широкий круг родственников
  rationale: Непосредственный контекст Ин. 7:3–5 прямо называет говорящих братьями Иисуса. Перевод сохраняет родственный термин, не разрешая за пределами текста вопрос о точной степени родства.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Местоимения, относящиеся к Иисусу, написаны с прописной буквы по распространённой русской библейской традиции.
