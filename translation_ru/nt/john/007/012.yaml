  terminology: Термины не требуют доктринальной корректировки. «Вводит толпу в заблуждение» удачно сохраняет смысл πλανᾷ, не навязывая вывод о намеренном обмане. Сноску к этому слову следует поставить непосредственно после соответствующего выражения, а не после «напротив».
