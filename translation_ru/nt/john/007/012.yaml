base_translation:
  language: en
  yaml_path: translation/nt/john/007/012.yaml
  text: And there was much murmuring about him among the crowds[a]. Some were saying, “He is good.” Others were saying, “No, on the contrary[b], he is misleading the crowd.”
translation:
  language: ru
  text: 'Среди собравшихся о нём много перешёптывались[a]. Одни говорили: «Он хорош». Другие же возражали: «Нет, напротив, он вводит толпу в заблуждение[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди собравшихся было много ропота о нём»; или: «о нём много говорили вполголоса».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обманывает толпу»; или: «сбивает толпу с пути».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσμός
  choice: перешёптывались
  rationale: Передаёт негромкие, неофициальные разговоры в толпе. «Роптали» чрезмерно подчёркивало бы недовольство, хотя контекст показывает разделившиеся мнения.
- source_word: περὶ αὐτοῦ
  choice: о нём
  rationale: Прямой и естественный эквивалент предложного сочетания.
- source_word: πολύς
  choice: много
  rationale: Передаёт значительный объём разговоров без стилистического утяжеления.
- source_word: ἐν τοῖς ὄχλοις
  choice: среди собравшихся
  rationale: Сохраняет значение множества людей, собравшихся на праздник, и естественно сочетается по-русски с глаголом «перешёптывались».
- source_word: οἱ μὲν ... ἄλλοι δὲ
  choice: одни ... другие же
  rationale: Ясно обозначает две противопоставленные группы среди собравшихся.
- source_word: Ἀγαθός ἐστιν
  choice: Он хороший
  rationale: Сохраняет простое предикативное прилагательное греческого текста и не добавляет существительное «человек».
- source_word: Οὔ, ἀλλὰ
  choice: Нет, наоборот
  rationale: Передаёт прямое отрицание предыдущего мнения и последующее противопоставление.
- source_word: πλανᾷ
  choice: вводит в заблуждение
  rationale: Передаёт как обман, так и увод от истины, не утверждая однозначно намеренный характер действия.
- source_word: τὸν ὄχλον
  choice: народ
  rationale: Здесь единственное число обозначает собирательно множество людей; «народ» звучит естественнее повторения слова «толпа».
theological_decisions:
- issue: Противоречивые оценки Иисуса среди собравшихся
  choice: Обе оценки переданы как прямая речь разных групп без авторского подтверждения одной из них.
  alternative: Сформулировать положительную или отрицательную реплику так, будто её поддерживает рассказчик.
  rationale: Греческий текст сообщает о разделившихся человеческих мнениях; перевод сохраняет эту напряжённость и нейтральную повествовательную рамку.
translation_notes:
  register: Современный литературный русский язык. Фраза «перешёптывались» естественно передаёт приглушённый характер разговоров; местоимения, относящиеся к Иисусу, даны со строчной буквы как нейтральная современная орфографическая практика, особенно уместная при передаче речи толпы.
