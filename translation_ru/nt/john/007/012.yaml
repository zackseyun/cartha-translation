    rationale: Анкер следует перенести к «вводит толпу в заблуждение», чтобы он указывал на переводимое слово и его варианты.
  - severity: low
    issue: «Народ» может расширять значение τὸν ὄχλον.
    rationale: «Толпу» точнее передаёт собирательное значение ὄχλος и согласуется с ранее упомянутыми собравшимися.
