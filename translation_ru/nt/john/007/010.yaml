  text: Ὡς δὲ ἀνέβησαν οἱ ἀδελφοὶ αὐτοῦ ⸂εἰς τὴν ἑορτήν, τότε καὶ αὐτὸς ἀνέβη⸃, οὐ φανερῶς ἀλλὰ ὡς ἐν κρυπτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/010.yaml
  text: But when his brothers had gone up to the feast[a], then he also went up, not openly but as if in secret.
translation:
  language: ru
  text: Но когда Его братья поднялись на праздник, тогда и Он поднялся — не открыто, а как бы тайно.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а тайно». Греческое выражение буквально означает «а как бы тайно» и, возможно, несколько смягчает утверждение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Но когда
  rationale: Ὡς с аористом вводит придаточное времени, а δέ обозначает мягкий переход и контраст с предыдущим контекстом.
- source_word: ἀνέβησαν ... ἀνέβη
  choice: пошли ... пошёл
  rationale: В данном контексте ἀναβαίνω означает отправиться в Иерусалим на праздник. Русское «пойти» естественно передаёт движение и последовательность событий; буквальное «подняться» здесь звучало бы менее естественно.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: Его братья
  rationale: В ближайшем контексте речь идёт именно о братьях Иисуса; мужской род исходного выражения сохранён.
- source_word: εἰς τὴν ἑορτήν
  choice: на праздник
  rationale: ἑορτή обозначает праздник, в контексте — праздник Шалашей. Сочетание «пойти на праздник» естественно для современного русского языка.
- source_word: τότε καὶ αὐτὸς
  choice: тогда и Он
  rationale: Сохранены как временная последовательность τότε, так и присоединительное ударение καὶ αὐτός.
- source_word: οὐ φανερῶς
  choice: не открыто
  rationale: Прямо передаёт наречие φανερῶς и сохраняет контраст со следующим выражением.
- source_word: ἀλλὰ ὡς ἐν κρυπτῷ
  choice: а как бы тайно
  rationale: «Как бы» сохраняет оттенок ὡς, который несколько смягчает утверждение, не сводя его к однозначному «тайно».
theological_decisions:
- issue: Соотношение поступка Иисуса с Его предшествующими словами о том, что Он не идёт на праздник
  choice: 'Передать последовательность прямо: Иисус пошёл позже и не открыто.'
  alternative: Разрешить напряжение поясняющим пересказом, например указав, что Он передумал или что ранее имел в виду лишь иной способ восхождения.
  rationale: Греческий текст не объясняет соотношение двух высказываний. Перевод сохраняет повествовательное и богословское напряжение, не привнося толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Прописные местоимения «Его», «Он» употреблены как традиционный русский знак почтения к Иисусу. Тире слегка выделяет контраст между фактом восхождения и его неявным характером.
