id: JHN.7.22
reference: John 7:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διὰ τοῦτο Μωϋσῆς δέδωκεν ὑμῖν τὴν περιτομήν— οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων— καὶ ἐν σαββάτῳ περιτέμνετε ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/022.yaml
  text: For this reason Moses has given you circumcision—not that it is from Moses[a], but from the fathers—and on the Sabbath you circumcise a man.
translation:
  language: ru
  text: Поэтому Моисей дал вам обрезание — хотя оно не от Моисея, а от праотцов, — и вы обрезаете человека в субботу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Естественная русская причинно-следственная связка, сохраняющая объяснительную функцию греческого выражения в контексте.
- source_word: Μωϋσῆς δέδωκεν ὑμῖν
  choice: Моисей дал вам
  rationale: Русский совершенный вид естественно передаёт состоявшееся установление, сохраняющее силу для слушателей; буквальное «дал и имеет данным» в русском не требуется.
- source_word: τὴν περιτομήν
  choice: обрезание
  rationale: Общепринятое библейское и современное обозначение заветного установления и обряда.
- source_word: οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων
  choice: хотя оно не от Моисея, а от праотцов
  rationale: Передаёт вводное уточнение об историческом происхождении обрезания. «Праотцы» в данном контексте ясно указывает на патриархов и сохраняет библейский регистр без двусмысленного русского «отцы».
- source_word: ἐν σαββάτῳ
  choice: в субботу
  rationale: Идиоматическое русское обозначение времени; речь идёт об общепринятой практике, а не об одной конкретной субботе.
- source_word: περιτέμνετε ἄνθρωπον
  choice: вы обрезаете человека
  rationale: Сохраняет настоящее время обычного действия и конкретную формулировку оригинала; контекст самого обряда однозначно предполагает лицо мужского пола.
theological_decisions:
- issue: Кого обозначают οἱ πατέρες в пояснении о происхождении обрезания
  choice: «праотцы», то есть патриархальные предки, от которых обрезание перешло к Израилю ещё до Моисея
  alternative: «отцы» или более широкое «предки»
  rationale: В контексте исторического происхождения обряда «праотцы» естественно указывает на патриархов и не добавляет к тексту конфессионального толкования.
- issue: Связь начального διὰ τοῦτο с контекстом и последующим высказыванием
  choice: Сохранить причинно-следственную связку «Поэтому», не уточняя её референт внутри стиха
  alternative: «Вот почему» или присоединение выражения к предыдущему стиху
  rationale: Пунктуационная и смысловая привязка выражения обсуждается; перевод сохраняет связность, но не вводит отсутствующего в греческом пояснения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Вставное пояснение выделено парными тире. Формулировка остаётся компактной и сохраняет риторическое напряжение между соблюдением субботы и допускаемым в субботу обрезанием.
