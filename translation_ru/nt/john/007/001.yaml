    issue: Не передано самостоятельное пояснительное γάρ.
    rationale: Конструкция «ходил по Галилее и не хотел ходить по Иудее, потому что...» сливает два греческих причинных звена. Следует выразить «ибо не хотел...», а затем отдельно «так как...».
  - severity: medium
    issue: «Искали случая убить» добавляет смысловой компонент.
    rationale: В ἐζήτουν αὐτὸν ἀποκτεῖναι нет слова «случай»; глагол выражает стремление или попытки убить.
  - severity: low
    issue: Сноска называет «жителей Иудеи» лексической альтернативой без достаточной оговорки.
    rationale: Такое понимание возможно в отдельных контекстах, но здесь не должно выглядеть как равнозначная точная замена; контекст скорее указывает на противостоящую Иисусу иудейскую группу, особенно власти.
  revised_text: После этого Иисус ходил по Галилее, ибо не хотел ходить по Иудее, так как иудеи[a] стремились убить Его.
