  to: После этого Иисус ходил по Галилее, ибо не хотел ходить по Иудее, так как иудеи[a] стремились убить Его.
  rationale: Правка восстанавливает двухступенчатую причинную структуру оригинала (γάρ ... ὅτι), устраняет добавленный оттенок «случая» и уточняет сноску, сохраняя исходное обозначение οἱ Ἰουδαῖοι в основном тексте.
