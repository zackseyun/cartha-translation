source:
  edition: SBLGNT
  text: Καὶ ⸂μετὰ ταῦτα περιεπάτει ὁ Ἰησοῦς⸃ ἐν τῇ Γαλιλαίᾳ, οὐ γὰρ ἤθελεν ἐν τῇ Ἰουδαίᾳ περιπατεῖν, ὅτι ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/001.yaml
  text: And after these things Jesus was walking in Galilee[a], for he did not want to walk in Judea, because the Jews were seeking to kill him.
translation:
  language: ru
  text: После этого Иисус ходил по Галилее, ибо не хотел ходить по Иудее, так как иудеи[a] стремились убить Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иудеяне» или «иудейские вожди». У Иоанна слово «иудеи» нередко обозначает не весь еврейский народ, а конкретную иудейскую среду, противостоящую Иисусу; в данном контексте — прежде всего его противников, включая власти.'
    reason: Лексическая альтернатива и контекстуальное уточнение референта οἱ Ἰουδαῖοι.
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: после этого
  rationale: Естественный русский временной переход, сохраняющий связь с предшествующими событиями; буквальное «после этих вещей» в современном русском звучит неестественно.
- source_word: περιεπάτει / περιπατεῖν
  choice: ходил / ходить
  rationale: Повтор одного русского глагола отражает повтор περιπατέω; несовершенный вид передаёт продолжительное или повторявшееся передвижение.
- source_word: ἐν τῇ Γαλιλαίᾳ / ἐν τῇ Ἰουδαίᾳ
  choice: по Галилее / по Иудее
  rationale: При русском «ходить» предлог «по» естественно выражает передвижение в пределах области, не добавляя идеи исчерпывающего охвата всей территории.
- source_word: οὐ γὰρ ἤθελεν
  choice: и не хотел
  rationale: γάρ вводит пояснение; в русском связка «и не хотел… потому что» естественно передаёт пояснительно-причинную структуру без предположения о невозможности.
- source_word: ἐζήτουν … ἀποκτεῖναι
  choice: искали случая убить
  rationale: Передаёт длительное враждебное намерение и конструкцию ζητέω с инфинитивом естественным современным русским выражением, не сводя её к простому физическому поиску.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Формально сохраняет обобщённое обозначение греческого текста; сноска поясняет его контекстуальный референт и предотвращает ошибочное понимание как осуждения всего еврейского народа.
theological_decisions:
- issue: Кого обозначает οἱ Ἰουδαῖοι в повествовательном контексте Иоанна
  choice: В основном тексте «иудеи» с поясняющей сноской
  alternative: «иудейские вожди» или «жители Иудеи»
  rationale: Так сохраняется широта исходного обозначения и его повествовательная напряжённость, но читателю разъясняется, что здесь речь идёт о противостоящей Иисусу иудейской среде, особенно о властях, а не обо всём еврейском народе.
translation_notes:
  register: Современный литературный русский, ясный и сдержанно-достоинственный. Сохранён повтор «ходил / ходить», значимый для формы греческого текста; синтаксис слегка адаптирован ради естественного русского звучания.
