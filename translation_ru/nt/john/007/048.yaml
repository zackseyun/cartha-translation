  text: μή τις ἐκ τῶν ἀρχόντων ἐπίστευσεν εἰς αὐτὸν ἢ ἐκ τῶν Φαρισαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/048.yaml
  text: Has any one of the rulers or of the Pharisees believed in him?[a]
translation:
  language: ru
  text: Разве кто-нибудь из начальников или фарисеев уверовал в Него?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий вопрос с μή сформулирован так, что предполагает ответ «нет».
    reason: Передача риторической силы исходной отрицательной вопросительной конструкции.
lexical_decisions:
- source_word: μή τις
  choice: Разве кто-нибудь
  rationale: Частица μή в таком вопросе предполагает отрицательный ответ. «Разве кто-нибудь» сохраняет вопросительную форму и естественно передаёт ожидаемое «нет», не превращая вопрос в прямое утверждение.
- source_word: ἐκ τῶν ἀρχόντων
  choice: из начальников
  rationale: Ἄρχοντες здесь обозначает признанных представителей иудейской правящей верхушки. «Начальники» — понятное и достаточно точное обозначение без расширительного «руководители».
- source_word: ἐπίστευσεν
  choice: уверовал
  rationale: Глагол передаёт веру, направленную на Иисуса. «Уверовал» естественно сочетается с «в Него» и сохраняет религиозный смысл πιστεύω εἰς.
- source_word: εἰς αὐτόν
  choice: в Него
  rationale: При πιστεύω конструкция εἰς αὐτόν идиоматически означает «веровать в Него»; буквальное пространственное значение предлога здесь неуместно.
- source_word: ἢ
  choice: или
  rationale: Простой союз точно сохраняет координацию двух групп и не добавляет усиления, отсутствующего в тексте.
- source_word: ἐκ τῶν Φαρισαίων
  choice: из фарисеев
  rationale: Формулировка параллельна «из начальников» и выражает принадлежность к группе фарисеев.
theological_decisions:
- issue: Риторическая сила отрицательного вопроса
  choice: Сохранить риторический вопрос, предполагающий ответ «нет»
  alternative: «Никто из начальников или фарисеев не уверовал в Него»
  rationale: Греческое μή τις указывает на ожидаемый отрицательный ответ, однако исходный текст остаётся вопросом. Формулировка с «разве» сохраняет и грамматическую форму, и пренебрежительную уверенность говорящих, не превращая подразумеваемое в прямое утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Разве кто-нибудь» звучит естественно и ясно; «начальники» сохраняет официальный общественный оттенок, а прописная буква в «Него» соответствует принятой русской библейской традиции.
