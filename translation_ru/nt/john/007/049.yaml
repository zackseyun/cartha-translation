  verdict: approve
  source_fidelity: «Но эта толпа, не знающая Закона, проклята» точно передаёт противопоставительное ἀλλά, указательное «эта», атрибутивное отрицательное причастие и резкое предикативное ἐπάρατοί εἰσιν. Единственное число сказуемого «проклята» нормативно согласуется с русским собирательным существительным «толпа» и не меняет смысла греческого множественного числа.
  naturalness: Фраза краткая, ясная и естественная для современного литературного русского. «Толпа» передаёт ὄχλος без усиления до «черни» или «сброда»; резкость «проклята» уместна для враждебной реплики в прямой речи.
  terminology: «Закон» с прописной буквы и сноской корректно обозначает Тору/иудейский Закон в данном контексте. «Проклята» и вариант «находится под проклятием» адекватно отражают ἐπάρατος, не превращая слова фарисеев в оценку повествователя. Оба маркера сносок присутствуют и соответствуют пояснениям.
