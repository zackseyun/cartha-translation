  text: ἀλλὰ ὁ ὄχλος οὗτος ὁ μὴ γινώσκων τὸν νόμον ⸀ἐπάρατοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/049.yaml
  text: But this crowd[a], which does not know the law[b], is accursed.
translation:
  language: ru
  text: Но эта толпа, не знающая Закона[a], проклята[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть Торы, иудейского Закона.
    reason: cultural_note
  - marker: b
    text: 'Или: «находится под проклятием».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт противопоставление мнению Никодима в предшествующем контексте и естественно звучит в современной русской речи.
- source_word: ὁ ὄχλος οὗτος
  choice: эта толпа
  rationale: Нейтрально передаёт ὄχλος как множество людей, не добавляя отрицательного оттенка слова «чернь».
- source_word: ὁ μὴ γινώσκων
  choice: не знающая
  rationale: Причастный оборот естественно передаёт атрибутивное причастие настоящего времени и характеризует толпу как не знающую Закона.
- source_word: τὸν νόμον
  choice: Закон
  rationale: В данном контексте имеется в виду иудейский Закон, Тора; прописная буква помогает обозначить этот конкретный религиозный референт.
- source_word: ἐπάρατοί
  choice: проклята
  rationale: Сохраняет резкий осуждающий смысл прилагательного ἐπάρατος и естественно согласуется в русском языке с собирательным существительным «толпа».
- source_word: εἰσιν
  choice: проклята
  rationale: Хотя греческая связка стоит во множественном числе по смысловому согласованию с людьми, составляющими толпу, русский язык требует грамматического согласования сказуемого с существительным «толпа» в единственном числе.
theological_decisions:
- issue: Следует ли представить враждебный приговор говорящих как утверждение повествователя
  choice: Сохранить прямое и резкое осуждение в речи фарисеев, не смягчая и не подтверждая его от лица повествователя.
  alternative: 'Добавить дистанцирующую формулировку, например: «они считают эту толпу проклятой».'
  rationale: Греческий текст передаёт прямую речь противников Иисуса. Добавление пояснения изменило бы форму высказывания и ослабило бы его напряжённость.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и резкая, как в оригинале. Слово «толпа» нейтральнее, чем «чернь», а «проклята» сохраняет суровый тон реплики. Все сноски отмечены в основном тексте.
