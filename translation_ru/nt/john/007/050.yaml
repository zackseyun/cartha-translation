lexical_decisions:
- source_word: λέγει
  choice: сказал
  rationale: Греческий исторический презенс естественно передаётся в русском повествовании прошедшим временем; функция повествования сохраняется.
- source_word: Νικόδημος
  choice: Никодим
  rationale: Употреблена традиционная и общеизвестная русская форма имени.
- source_word: πρὸς αὐτούς
  choice: им
  rationale: После глагола речи πρός с винительным указывает на адресатов; русская конструкция «сказал им» естественна и точна.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν πρότερον
  choice: тот самый, который прежде приходил к Иисусу
  rationale: Артикль с причастием имеет определительно-субстантивированную функцию и отождествляет Никодима с уже известным участником повествования. «Прежде» передаёт временное значение πρότερον; имя «Иисусу» естественно проясняет контекстуально очевидный референт местоимения.
- source_word: εἷς ὢν ἐξ αὐτῶν
  choice: и был одним из них
  rationale: Фраза сообщает фоновую идентифицирующую информацию. Сочинительная связь по-русски звучит естественно и не придаёт обороту причинного смысла.
theological_decisions:
- issue: Референт αὐτόν в выражении «приходил к нему прежде»
  choice: В основном тексте обозначен как Иисус.
  alternative: 'Сохранить формальную местоименную неоднозначность: «приходил к нему прежде».'
  rationale: Интертекстуальная отсылка к Ин. 3:1–2 ясно указывает на Иисуса. В русском цепочка местоимений «к нему… одним из них… им» создаёт ненужную референциальную неясность, поэтому контекстуальный референт назван прямо, а формальная особенность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; достоинство повествования сохранено. Вставная конструкция с тире удерживает греческую аппозиционную структуру, не перегружая предложение.
