base_translation:
  language: en
  yaml_path: translation/nt/john/007/014.yaml
  text: When the feast was already half over[c][b][a], Jesus went up into the temple and was teaching.
translation:
  language: ru
  text: Когда праздник уже достиг середины[a], Иисус поднялся в храм[b] и учил[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда праздник был примерно на середине».'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово ἱερόν здесь обозначает храмовый комплекс или его дворы, а не только внутреннее святилище.
    reason: cultural_note
  - marker: c
    text: Форма греческого глагола может подчёркивать, что Иисус в это время продолжал учить.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤδη
  choice: уже
  rationale: Передаёт достижение указанного момента к этому времени, не добавляя отдельного повествовательного маркера вроде «теперь».
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Здесь частица служит мягкому переходу в повествовании; в современном русском такой переход естественно передаётся самим построением фразы.
- source_word: τῆς ἑορτῆς μεσούσης
  choice: когда наступила середина праздника
  rationale: Родительный абсолют задаёт временное обстоятельство, а μεσούσης указывает на середину праздника. Формулировка естественна по-русски и не уточняет сверх текста, была ли ровно половина уже завершена.
- source_word: ἀνέβη
  choice: поднялся
  rationale: Сохраняет направительное значение ἀναβαίνω — «идти, подниматься вверх», уместное при движении к храму.
- source_word: Ἰησοῦς
  choice: Иисус
  rationale: Традиционная русская форма имени.
- source_word: εἰς τὸ ἱερὸν
  choice: в храм
  rationale: Краткий и привычный русский эквивалент; примечание уточняет, что ἱερόν обозначает весь храмовый комплекс или дворы, а не только внутреннее святилище.
- source_word: ἐδίδασκεν
  choice: учил там
  rationale: Русский глагол несовершенного вида передаёт длительное или происходившее действие греческого имперфекта без добавления неявного начинательного оттенка «стал учить».
theological_decisions:
- issue: Значение ἱερόν
  choice: '«храм» с уточнением в примечании: храмовый комплекс и дворы'
  alternative: «храмовые дворы» или «территория храма» в основном тексте
  rationale: Так сохраняются и привычная библейская формулировка, и важное различие между ἱερόν и ναός; речь не обязательно идёт о внутреннем святилище.
- issue: Видовое значение ἐδίδασκεν
  choice: «учил» — действие в процессе
  alternative: «стал учить»
  rationale: Имперфект ясно допускает продолженное действие, тогда как начинательное значение не выражено однозначно и потому не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык, простой и достойный по тону. Порядок слов сохраняет временную рамку в начале стиха. «Учил» выбрано вместо «стал учить», чтобы не добавлять начинательного значения; «там» естественно связывает действие с храмом.
