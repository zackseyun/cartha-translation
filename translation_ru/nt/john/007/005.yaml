  text: For not even his brothers believed in him[a].
translation:
  language: ru
  text: Ведь даже Его братья не верили в Него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол стоит в форме имперфекта, которая может представлять неверие как продолжавшееся или характерное в прошлом.
    reason: аспектуальное пояснение
lexical_decisions:
- source_word: οὐδὲ
  choice: даже … не
  rationale: В данном контексте οὐδὲ усиливает отрицание; русская конструкция «даже … не» естественно передаёт значение «и те не».
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит поясняющее основание к предшествующему контексту; «ведь» сохраняет эту связь естественнее для современного русского повествования.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: Его братья
  rationale: Форма мужского рода во множественном числе в повествовательном контексте обозначает братьев Иисуса; перевод не уточняет сверх текста, были ли они родными или иными родственниками.
- source_word: ἐπίστευον
  choice: не верили
  rationale: Имперфект допускает характеристику продолжавшегося или имевшего место в тот период неверия; русский несовершенный вид «не верили» естественно сохраняет эту аспектуальность.
- source_word: εἰς αὐτόν
  choice: в Него
  rationale: Сочетание πιστεύω εἰς у Иоанна выражает веру, направленную на личность; «верить в Него» — точное и естественное русское соответствие.
theological_decisions:
- issue: Значение πιστεύω εἰς αὐτόν в употреблении Иоанна
  choice: личная вера в Иисуса
  alternative: доверие Иисусу
  rationale: Конструкция обозначает веру, направленную на Иисуса, но стих не раскрывает здесь её полного богословского содержания и не объясняет причин неверия братьев.
- issue: Кем были οἱ ἀδελφοὶ αὐτοῦ
  choice: братья
  alternative: родственники
  rationale: Перевод сохраняет непосредственное лексическое значение ἀδελφοί и не решает внутри текста спор о точной степени родства.
translation_notes:
  register: Современный литературный русский язык; краткая пояснительная частица «ведь» сохраняет связь с контекстом. Прописные местоимения в отношении Иисуса выбраны как традиционный русский библейский регистр, не меняющий смысла исходного текста.
