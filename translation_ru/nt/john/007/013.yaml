  text: οὐδεὶς μέντοι παρρησίᾳ ἐλάλει περὶ αὐτοῦ διὰ τὸν φόβον τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/013.yaml
  text: Yet no one was speaking openly about him for fear of the Jews[a].
translation:
  language: ru
  text: Но никто не говорил о Нём открыто из страха перед иудеями[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В данном контексте это выражение может обозначать более конкретно иудейских руководителей или иерусалимские иудейские власти. В Евангелии от Иоанна слово «иудеи» может относиться как к иудейскому народу вообще, так и — в некоторых местах — к находившимся в Иерусалиме властям, противостоявшим Иисусу.
    reason: Сохраняет неоднозначность исходного термина и разъясняет его вероятный контекстуальный смысл.
lexical_decisions:
- source_word: οὐδεὶς
  choice: никто
  rationale: Прямо и естественно передаёт всеобъемлющее отрицательное местоимение.
- source_word: μέντοι
  choice: но
  rationale: Передаёт мягкое противопоставление предшествующим разногласиям в толпе; в современном русском здесь естественнее, чем «однако».
- source_word: παρρησίᾳ
  choice: открыто
  rationale: В данном контексте означает речь без утайки, на виду у других; перевод сохраняет оттенок публичной откровенности.
- source_word: ἐλάλει
  choice: не говорил
  rationale: Несовершенный вид русского глагола соответствует имперфекту и передаёт продолжавшееся или обычное действие.
- source_word: περὶ αὐτοῦ
  choice: о Нём
  rationale: Естественный русский эквивалент конструкции περί с родительным падежом; заглавная буква соответствует принятому достоинственному библейскому регистру.
- source_word: διὰ τὸν φόβον
  choice: из страха перед
  rationale: Естественно передаёт причинное значение διά с винительным и сохраняет именную конструкцию.
- source_word: τῶν Ἰουδαίων
  choice: иудеями
  rationale: Формально сохраняет широкое обозначение исходного текста, не сужая его в основном тексте до руководителей; контекстуально вероятное значение поясняется в сноске.
theological_decisions:
- issue: Кого обозначает τῶν Ἰουδαίων в повествовании Иоанна
  choice: «иудеями» в основном тексте со сноской о возможном более узком контекстуальном значении
  alternative: «иудейскими вождями» или «иудейскими властями»
  rationale: Так сохраняется лексическая широта и неоднозначность греческого выражения, а сноска предотвращает ошибочное понимание как безусловного указания на весь еврейский народ.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Порядок слов естественен для русского; имперфективность ἐλάλει сохранена несовершенным видом. Формулировка не переносит в текст позднейшие этнические обобщения.
