  text: ὑμεῖς ἀνάβητε εἰς τὴν ⸀ἑορτήν· ἐγὼ ⸀οὐκ ἀναβαίνω εἰς τὴν ἑορτὴν ταύτην, ὅτι ὁ ⸂ἐμὸς καιρὸς⸃ οὔπω πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/008.yaml
  text: You go up to the feast[a]. I am not going up to this feast[b], because my time has not yet come to fulfillment.
translation:
  language: ru
  text: Вы пойдите на праздник. Я не иду на этот праздник[a], потому что Моё время ещё не исполнилось[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «Я ещё не иду на этот праздник».'
    reason: textual_variant
  - marker: b
    text: 'Или: «назначенное Мне время ещё не исполнилось».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάβητε
  choice: пойдите
  rationale: В данном контексте речь идёт о паломничестве в Иерусалим; по-русски «пойдите на праздник» звучит естественно, тогда как буквальное «поднимитесь» без пояснения было бы неясным.
- source_word: ἑορτή
  choice: праздник
  rationale: Передаёт религиозный праздник в естественном современном русском языке.
- source_word: οὐκ ἀναβαίνω
  choice: Я не иду
  rationale: Настоящее время передано естественной русской формой с ближайшим будущим значением. Основной текст следует чтению οὐκ («не»), не добавляя «ещё».
- source_word: ταύτην
  choice: этот
  rationale: Сохраняет указание на конкретный обсуждаемый праздник.
- source_word: καιρός
  choice: время
  rationale: Кратко и естественно сохраняет возможный смысл назначенного, надлежащего времени, не делая его явным толкованием.
- source_word: πεπλήρωται
  choice: исполнилось
  rationale: Сохраняет значение достижения полноты или завершения, выраженное перфектом πληρόω, и соответствует естественному русскому обороту «время исполнилось».
theological_decisions:
- issue: Разночтение в словах Иисуса о посещении праздника
  choice: 'В основном тексте следовать SBLGNT: οὐκ — «Я не иду».'
  alternative: 'В ряде рукописей οὔπω: «Я ещё не иду».'
  rationale: Так сохраняется предоставленное исходное чтение и связанное с ним повествовательное напряжение; значимое альтернативное чтение вынесено в примечание, а не подставлено в основной текст.
- issue: Смысл выражения ὁ ἐμὸς καιρός
  choice: «Моё время»
  alternative: «назначенное Мне время»
  rationale: Основной вариант сохраняет смысловую открытость καιρός и не вводит в текст подразумеваемого назначающего субъекта.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Формулировка сохраняет краткость прямой речи и не сглаживает значимое разночтение. Заглавная буква в «Моё» употреблена как принятая в русском библейском стиле форма почтительного местоимения, относящегося к Иисусу.
