id: JHN.7.39
reference: John 7:39
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν περὶ τοῦ πνεύματος ⸀οὗ ἔμελλον λαμβάνειν οἱ ⸀πιστεύσαντες εἰς αὐτόν· οὔπω γὰρ ἦν ⸀πνεῦμα, ὅτι Ἰησοῦς ⸀οὐδέπω ἐδοξάσθη.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/039.yaml
  text: He said this about the Spirit[a], whom those who believed in him were about to receive; for the Spirit was not yet[b], because Jesus had not yet been glorified.
translation:
  language: ru
  text: Это он сказал о Духе, которого предстояло принять уверовавшим в него; ведь Духа ещё не было[a], потому что Иисус ещё не был прославлен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с пояснением: «ведь Дух ещё не был дан». В греческом тексте буквально: «ведь Духа ещё не было»; это связано с тем, что Иисус ещё не был прославлен.'
    reason: alternative_reading
lexical_decisions:
- source_word: πνεύματος / πνεῦμα
  choice: Дух / Духа
  rationale: По контексту речь идёт о Божьем Духе, которого примут верующие. Слово пишется с прописной буквы, но определение «Святой» не добавляется, поскольку ἅγιον в греческом тексте отсутствует.
- source_word: οὗ
  choice: которого
  rationale: Относительное местоимение относится к «Духе» и естественно передаёт греческую связь без дополнительного истолкования.
- source_word: ἔμελλον λαμβάνειν
  choice: предстояло принять
  rationale: Оборот сохраняет направленность в будущее, выраженную μέλλω с инфинитивом, и естественно звучит по-русски применительно к принятию Духа.
- source_word: οἱ πιστεύσαντες εἰς αὐτόν
  choice: уверовавшим в него
  rationale: Субстантивированное причастие передано кратко и естественно; совершенный вид отражает аорист, а конструкция «веровать в» сохраняет характерное для Иоанна выражение πιστεύειν εἰς.
- source_word: οὔπω γὰρ ἦν πνεῦμα
  choice: ведь Духа ещё не было
  rationale: Формулировка близко передаёт краткое и напряжённое греческое выражение, не добавляя отсутствующего в оригинале слова «дан».
- source_word: οὐδέπω ἐδοξάσθη
  choice: ещё не был прославлен
  rationale: Передаёт временное отношение и сохраняет важный для Евангелия от Иоанна термин «прославлен», не сужая его смысла до одного аспекта возвышения Иисуса.
theological_decisions:
- issue: Как передать οὔπω γὰρ ἦν πνεῦμα, не создавая впечатления, будто Дух не существовал до прославления Иисуса.
  choice: 'Сохранить в основном тексте буквальное напряжение: «Духа ещё не было».'
  alternative: «Дух ещё не был дан».
  rationale: В греческом тексте нет глагола «дать»; пояснительный перевод был бы понятнее, но устранил бы намеренную краткость и богословское напряжение исходной формулировки. Вероятный смысл указан в сноске.
translation_notes:
  register: Современный литературный русский язык; изложение естественное и достойное, без конфессионально окрашенных добавлений. Местоимения, относящиеся к Богу и Иисусу, не капитализируются как обычное типографическое правило современного русского текста; название «Дух» пишется с прописной буквы для обозначения Божьего Духа.
