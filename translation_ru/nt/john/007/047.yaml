  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: ответили
  rationale: Обычный повествовательный глагол ответа в диалоге; естественно передаёт форму множественного числа.
- source_word: οὖν
  choice: тогда
  rationale: Передаёт связь с предшествующим обменом репликами и последовательность развития сцены; в русском повествовании звучит естественнее буквального «итак».
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж прямо и естественно передаётся русским местоимением «им».
- source_word: οἱ Φαρισαῖοι
  choice: фарисеи
  rationale: Устоявшееся русское название религиозной группы; определённость греческого артикля ясна из контекста и не требует отдельной передачи.
- source_word: Μὴ καὶ ὑμεῖς
  choice: Неужели и вы
  rationale: «Неужели» естественно передаёт вопрос с μή, предполагающий отрицательный ответ, а «и вы» сохраняет усилительное καί и оттенок удивления или упрёка.
- source_word: πεπλάνησθε
  choice: введены в заблуждение
  rationale: Передаёт перфектную пассивную форму и значение πλανάω — быть уведёнными в ошибку; выражение сохраняет интеллектуальный оттенок заблуждения без лишнего усиления.
theological_decisions:
- issue: Риторическая сила вопроса с μή
  choice: «Неужели и вы введены в заблуждение?»
  alternative: «Разве и вы обмануты?»
  rationale: Вариант с «неужели» показывает, что фарисеи ожидают отрицательного ответа, и сохраняет их удивлённо-пренебрежительный тон, не превращая подразумеваемое в прямое утверждение.
translation_notes:
  register: Современный литературный русский язык; реплика краткая и dignified, с сохранением риторического упрёка. Слово «заблуждение» точно передаёт ошибочность убеждения, а пассивная конструкция сохраняет грамматическую направленность греческого текста.
