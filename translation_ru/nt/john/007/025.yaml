  text: So some of the people of Jerusalem were saying[a], “Is this not the man they are seeking to kill?”
translation:
  language: ru
  text: 'Итак, некоторые из жителей Иерусалима говорили: «Не тот ли это человек, которого хотят убить?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγον
  choice: говорили
  rationale: Имперфект передаёт продолжающуюся или повторяющуюся речь; русская форма несовершенного вида «говорили» естественно сохраняет этот аспект.
- source_word: οὖν
  choice: Тогда
  rationale: Союз обозначает повествовательное продолжение и связь с предшествующим контекстом; «тогда» здесь звучит естественно, не усиливая вывод до строгого «поэтому».
- source_word: τινες ἐκ τῶν Ἱεροσολυμιτῶν
  choice: некоторые из жителей Иерусалима
  rationale: Передаёт неопределённую часть группы и значение Ἱεροσολυμῖται как жителей Иерусалима; формулировка ясна и современна.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Не Тот ли это
  rationale: Отрицательная вопросительная конструкция предполагает утвердительный ответ; русская частица «ли» сохраняет риторическую силу вопроса.
- source_word: ζητοῦσιν
  choice: хотят
  rationale: В сочетании с инфинитивом глагол означает стремление или намерение совершить действие; «хотят убить» естественно по-русски и сохраняет продолжающееся намерение.
- source_word: ἀποκτεῖναι
  choice: убить
  rationale: Прямое лексическое значение без добавления судебного оттенка, который могло бы внести выражение «предать смерти».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены повествовательная связь, длительный характер речи и вопрос, ожидающий утвердительного ответа. Местоимения, относящиеся к Иисусу, оформлены с прописной буквы в соответствии с распространённой русской библейской традицией.
