  terminology: '«В храме» допустимо для ἱερόν, хотя речь идёт о храмовом комплексе. «Не сам от себя» удачно сохраняет широту ἀπ’ ἐμαυτοῦ; «послал меня» не добавляет явного именования Отца. Сноска к ἀληθινός нуждается в более естественной формулировке: «действительно реален» неудачно по-русски.'
