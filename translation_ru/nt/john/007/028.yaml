  source_fidelity: 'Смысл в целом передан точно: сохранены публично громкая речь Иисуса, повтор «знаете», не-самостоятельность его прихода и незнание пославшего его. Однако «уча в храме» двусмысленно: в современном русском оно прежде всего может означать «обучая в храме» (то есть кого-либо), тогда как греческое ἐν τῷ ἱερῷ относится к месту, где Иисус учил. Формулировка «в храме, когда он учил» яснее и ближе к синтаксической функции причастия.'
