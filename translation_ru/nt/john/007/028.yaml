source:
  edition: SBLGNT
  text: ἔκραξεν οὖν ἐν τῷ ἱερῷ διδάσκων ὁ Ἰησοῦς καὶ λέγων· Κἀμὲ οἴδατε καὶ οἴδατε πόθεν εἰμί· καὶ ἀπ’ ἐμαυτοῦ οὐκ ἐλήλυθα, ἀλλ’ ἔστιν ἀληθινὸς ὁ πέμψας με, ὃν ὑμεῖς οὐκ οἴδατε·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/028.yaml
  text: So Jesus cried out in the temple[a], teaching and saying, “You know me, and you know where I am from. And I have not come from myself, but the one who sent me is true[c][b], whom you do not know.”
translation:
  language: ru
  text: 'Итак, Иисус громко воскликнул в храме, когда учил: «Вы и меня знаете, и знаете, откуда я[a]. Но я пришёл не сам от себя[b]: тот, кто послал меня, — истинный[c], а вы его не знаете».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эти слова можно услышать как иронические или вызывающие: «Вы знаете меня и знаете, откуда я?» Однако по форме греческое предложение утвердительное.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «не по собственной инициативе».'
    reason: lexical_alternative
  - marker: c
    text: Слово «истинный» может также означать «подлинный» или «настоящий».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: громко возгласил
  rationale: Передаёт сильный, публичный характер речи, не привнося оттенка страдания, возможного у глагола «вскричал».
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: ἱερόν обозначает храмовый комплекс, а не только внутреннее святилище; по-русски «в храме» естественно сохраняет этот общий смысл.
- source_word: διδάσκων καὶ λέγων
  choice: уча … возгласил
  rationale: Оборот «уча» сохраняет контекст продолжающегося наставления, а глагол речи естественно вводит прямую речь без тяжеловесного «уча и говоря».
- source_word: Κἀμὲ
  choice: Вы и меня знаете
  rationale: Частица καί в слиянии с ἐμέ придаёт местоимению оттенок выделения; конструкция «и меня» естественно передаёт это по-русски.
- source_word: οἴδατε … οἴδατε
  choice: знаете … знаете
  rationale: Повтор сохранён как существенный риторический элемент высказывания.
- source_word: πόθεν εἰμί
  choice: откуда я
  rationale: Краткая и естественная русская формулировка сохраняет открытым вопрос о том, идёт ли речь о видимом земном происхождении или о более глубоком происхождении Иисуса.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: не сам от себя
  rationale: Сохраняет исходный образ и допускает также смысл «не по собственной инициативе», не сводя выражение только к одному толкованию.
- source_word: οὐκ ἐλήλυθα
  choice: я пришёл
  rationale: Русский прошедший вид совершенного вида естественно передаёт совершившееся пришествие и его сохраняющийся результат без неестественной кальки перфекта.
- source_word: ἀληθινὸς
  choice: истинен
  rationale: Сохраняет ёмкость греческого слова, которое может указывать как на истинность и надёжность, так и на подлинность.
- source_word: ὁ πέμψας με
  choice: пославший меня
  rationale: Передаёт личное действующее лицо, не добавляя отсутствующего здесь обозначения «Отец».
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: а вы его не знаете
  rationale: Сохраняет прямое противопоставление и личный объект познания; союз «а» естественно выражает контраст данного контекста.
theological_decisions:
- issue: Следует ли передавать слова «Вы и меня знаете, и знаете, откуда я» как иронию или риторический вопрос
  choice: В основном тексте сохранена утвердительная форма
  alternative: «Вы знаете меня и знаете, откуда я?» либо явное обозначение иронии
  rationale: Греческая форма грамматически утвердительна, хотя контекст допускает иронический или вызывающий оттенок. Перевод сохраняет эту риторическую неоднозначность.
- issue: Как понимать происхождение Иисуса в выражениях «откуда я» и «не сам от себя»
  choice: Формулировка оставлена достаточно широкой для земного и более глубокого, связанного с посланничеством, смысла
  alternative: Ограничить смысл географическим происхождением либо прямо добавить небесное происхождение
  rationale: Текст допускает характерную для Евангелия от Иоанна многослойность, поэтому перевод не сужает и не расширяет сказанное пояснительной вставкой.
- issue: Кто подразумевается под «пославшим меня»
  choice: Референт не назван прямо
  alternative: «Отец, пославший меня»
  rationale: Хотя контекст Евангелия указывает на Отца, в данном предложении греческий текст употребляет только описательное обозначение; оно и сохранено.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной речи. Синтаксис сделан естественным для чтения вслух; риторический повтор «знаете … знаете» и напряжение между кажущимся знанием слушателей и их незнанием Пославшего сохранены. Местоимения, относящиеся к Иисусу и Пославшему, даны со строчной буквы в соответствии с обычной современной орфографией и без внесения отсутствующих в греческом тексте графических различий.
