base_translation:
  language: en
  yaml_path: translation/nt/john/007/038.yaml
  text: The one who believes in me[a], just as the Scripture has said[b], rivers of living water will flow from his belly.
translation:
  language: ru
  text: Тот, кто верит в Меня, — как сказано в Писании, — из его[a] чрева[b] потекут реки живой воды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое местоимение может относиться к верующему; некоторые толкователи относят его к Мессии, понимая, что живая вода течёт из Него.
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «живота» или «чрева»; здесь, вероятно, образно обозначается внутренняя сущность человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: Кто верит в Меня
  rationale: Субстантивированное причастие обозначает всякого человека, которого характеризует вера; конструкция «кто верит» естественна для современного русского языка и сохраняет направленность личного доверия ко Христу.
- source_word: καθὼς εἶπεν ἡ γραφή
  choice: как сказано в Писании
  rationale: Безличная русская формула естественно передаёт ссылку на авторитет Писания, сохраняя единственное число ἡ γραφή и значение греческого аориста.
- source_word: ποταμοὶ
  choice: реки
  rationale: Слово обозначает именно реки и поддерживает образ изобилия; «потоки» было бы менее формальным соответствием.
- source_word: ἐκ τῆς κοιλίας αὐτοῦ
  choice: у того … из чрева
  rationale: «Чрево» прямо передаёт κοιλία и сохраняет телесно-пространственный образ, тогда как русская конструкция «у того» ясно и естественно связывает местоимение с верующим. Возможный переносный смысл и иной референт местоимения отмечены в сносках.
- source_word: ῥεύσουσιν
  choice: потекут
  rationale: Простое будущее время точно передаёт форму глагола, не добавляя отсутствующей в оригинале интенсивности.
- source_word: ὕδατος ζῶντος
  choice: живой воды
  rationale: Устойчивое выражение сохраняет как образ текущей воды, так и его богословскую глубину в Евангелии от Иоанна.
theological_decisions:
- issue: К кому относится αὐτοῦ («его»)
  choice: 'К верующему: реки текут из чрева того, кто верит'
  alternative: 'К Мессии/Иисусу: реки текут из Него'
  rationale: Ближайший грамматический антецедент — «кто верит»; такое прочтение также согласуется с пояснением о Духе в Ин. 7:39. Однако мессианское прочтение возможно и поэтому сохранено в сноске.
- issue: Значение κοιλία
  choice: чрево, понимаемое здесь как внутренняя глубина человека
  alternative: буквально живот; также возможно «изнутри него»
  rationale: Перевод «чрево» сохраняет конкретный образ оригинала, а сноска предотвращает ошибочное сведение смысла к анатомии.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским словом «чрево». Инверсия «у того … из чрева» позволяет передать единичного верующего без тяжеловесного повторения и сохранить образ исходного текста.
