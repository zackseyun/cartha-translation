source:
  edition: SBLGNT
  text: οὐ δύναται ὁ κόσμος μισεῖν ὑμᾶς, ἐμὲ δὲ μισεῖ, ὅτι ἐγὼ μαρτυρῶ περὶ αὐτοῦ ὅτι τὰ ἔργα αὐτοῦ πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/007.yaml
  text: The world is not able to hate you[a], but it hates me[d][c][b], because I testify about it that its works are evil.
translation:
  language: ru
  text: Мир[b] не может ненавидеть вас[a], а Меня ненавидит, потому что Я свидетельствую о нём[c], что его дела злы[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не способен ненавидеть вас».'
    reason: lexical_alternative
  - marker: b
    text: У Иоанна «мир» нередко означает человеческий порядок, противящийся Богу, а не сотворённую вселенную как таковую.
    reason: cultural_note
  - marker: c
    text: 'Или: «даю свидетельство о нём».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «его поступки злы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δύναται
  choice: не может
  rationale: Естественно передаёт значение способности или возможности, выраженное δύναμαι, не ослабляя категоричности высказывания.
- source_word: ὁ κόσμος
  choice: мир
  rationale: Сохраняет ёмкий и многозначный термин Иоанна без пояснительного сужения до «мировой системы» или «людей этого мира».
- source_word: μισεῖν / μισεῖ
  choice: ненавидеть / ненавидит
  rationale: Последовательно передаёт повтор одного и того же резкого глагола и сохраняет противопоставление между братьями Иисуса и Самим Иисусом.
- source_word: ἐμὲ δὲ
  choice: а Меня ненавидит
  rationale: Союз «а» естественно выражает контраст, а вынесенное вперёд «Меня» сохраняет эмфазу греческого местоимения.
- source_word: μαρτυρῶ
  choice: свидетельствую
  rationale: Сохраняет характерную для Иоанна лексику свидетельства и её возможный судебный оттенок.
- source_word: περὶ αὐτοῦ
  choice: о нём
  rationale: Передаёт отнесённость местоимения к существительному κόσμος; мужской род русского слова «мир» естественно требует формы «о нём».
- source_word: τὰ ἔργα αὐτοῦ
  choice: его дела
  rationale: «Дела» близко передаёт ἔργα и сохраняет нравственно-богословское звучание выражения.
- source_word: πονηρά
  choice: злы
  rationale: Краткое прилагательное прямо выражает нравственную порочность дел, а не просто их плохое качество.
theological_decisions:
- issue: Смысл слова κόσμος в контексте Евангелия от Иоанна
  choice: Сохранить «мир» без истолковывающего расширения
  alternative: «мир, противящийся Богу» или «человечество в мятеже против Бога»
  rationale: У Иоанна слово «мир» многозначно; здесь оно обозначает человеческий порядок, враждебный Иисусу, однако перевод не должен устранять более широкие смысловые связи этого слова.
- issue: Причина ненависти мира к Иисусу
  choice: 'Сохранить прямую причинную связь: мир ненавидит Иисуса, потому что Он свидетельствует о зле его дел'
  alternative: Ослабить связь до общего указания на неприятие учения Иисуса
  rationale: Греческое ὅτι прямо вводит причину, а повторное ὅτι — содержание свидетельства; сохранение структуры удерживает нравственное напряжение текста.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Заглавные местоимения «Я» и «Меня» употреблены по принятой русской библейской традиции при речи Христа. Синтаксис сохраняет контраст и две причинно-изъяснительные связи греческого текста, оставаясь понятным современному читателю.
