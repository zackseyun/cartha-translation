  yaml_path: translation/nt/john/007/046.yaml
  text: The officers answered[a], “Never has a man spoken like this.”
translation:
  language: ru
  text: 'Служители ответили: «Никогда ещё человек не говорил так».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Никто никогда так не говорил». Греческий текст буквально говорит о «человеке», употребляя единственное число в обобщающем смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: ответили
  rationale: Аорист от ἀποκρίνομαι в диалогическом контексте естественно передаётся глаголом «ответили».
- source_word: οἱ ὑπηρέται
  choice: служители
  rationale: В контексте это служители, посланные первосвященниками и фарисеями схватить Иисуса (Ин. 7:32, 45). «Служители» сохраняет широту греческого обозначения и не вводит более узкое толкование «храмовая стража».
- source_word: Οὐδέποτε
  choice: никогда ещё
  rationale: Русское «никогда ещё» естественно выражает отсутствие подобного случая вплоть до настоящего момента.
- source_word: ἐλάλησεν
  choice: не говорил
  rationale: После «никогда ещё» русский прошедший вид «не говорил» идиоматично передаёт греческий аорист и итоговое суждение говорящих.
- source_word: οὕτως
  choice: так
  rationale: 'Кратко и естественно передаёт наречие образа действия: «таким образом».'
- source_word: ἄνθρωπος
  choice: человек
  rationale: Прямой и естественный эквивалент ἄνθρωπος; в русском единственное число здесь имеет обобщающее значение и не требует искусственного гендерного уточнения.
theological_decisions:
- issue: Обобщающее значение ἄνθρωπος
  choice: человек
  alternative: никто
  rationale: «Человек» сохраняет существительное в единственном числе и риторическую силу греческой фразы; «никто» передаёт общий смысл, но меняет исходную форму и несколько усиливает отрицательную конструкцию.
translation_notes:
  register: Современный литературный русский язык; реплика краткая, выразительная и естественная. «Служители» согласуется с ближайшим контекстом и избегает чрезмерно конкретизирующего «храмовая стража».
