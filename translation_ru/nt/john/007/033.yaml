  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἔτι ⸂χρόνον μικρὸν⸃ μεθ’ ὑμῶν εἰμι καὶ ὑπάγω πρὸς τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/033.yaml
  text: So Jesus said[a], “I am with you a little while longer[b], and I am going to the one who sent me.”
translation:
  language: ru
  text: 'Итак, Иисус сказал: «Ещё недолго Я буду с вами, и уйду к Тому, Кто послал Меня».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Тот, Кто послал Иисуса, — Отец; это ясно из более широкого контекста Евангелия от Иоанна.
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: Итак
  rationale: Передаёт повествовательно-логическую связь с предшествующим эпизодом; в современном литературном русском звучит естественно и сохраняет выводный оттенок.
- source_word: Ἔτι χρόνον μικρόν
  choice: Ещё недолго
  rationale: Кратко и идиоматично передаёт сочетание ἔτι («ещё») и χρόνον μικρόν («короткое время»), включая смысл остающегося непродолжительного времени.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: Я буду с вами
  rationale: Русское будущее время естественно требуется при обстоятельстве «ещё недолго» и передаёт продолжающееся присутствие Иисуса, не меняя временной перспективы высказывания.
- source_word: καὶ ὑπάγω
  choice: а потом уйду
  rationale: «Уйду» передаёт направленное удаление ὑπάγω; «а потом» естественно выражает последовательность, подразумеваемую словами о кратком оставшемся времени, хотя отдельного τότε в греческом нет.
- source_word: πρὸς τὸν πέμψαντά με
  choice: к Тому, Кто послал Меня
  rationale: Сохраняет субстантивированное причастие — «к Тому, Кто послал Меня» — и не вводит в основной текст прямого уточнения «к Отцу».
theological_decisions:
- issue: Кого означает выражение «Тот, Кто послал Меня»
  choice: 'Сохранить косвенное обозначение: «к Тому, Кто послал Меня»'
  alternative: «к Отцу, пославшему Меня»
  rationale: В более широком контексте Евангелия от Иоанна речь идёт об Отце, однако сам греческий текст данного стиха называет Его косвенно. Перевод сохраняет форму и богословскую напряжённость исходного высказывания.
- issue: Временная последовательность ухода
  choice: «а потом уйду»
  alternative: «и ухожу» / «и уйду»
  rationale: Фраза о кратком оставшемся времени подразумевает последующий уход; «потом» делает эту связь естественной по-русски, не утверждая дополнительных событий или сроков.
translation_notes:
  register: Современный литературный русский с уважительным традиционным написанием местоимений, относящихся к Иисусу и Отцу. Синтаксис простой и понятный; косвенное обозначение Отца сохранено. Маркер сноски поставлен после всей реплики, поскольку поясняет её заключительное выражение.
