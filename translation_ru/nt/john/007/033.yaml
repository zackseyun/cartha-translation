    issue: Added «потом» in «а потом уйду»
    rationale: The Greek has καὶ ὑπάγω, «and I am going/departing», without τότε or another explicit temporal adverb. Although departure follows the brief remaining time contextually, «потом» makes this relation more explicit than the source.
