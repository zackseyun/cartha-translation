base_translation:
  language: en
  yaml_path: translation/nt/john/007/032.yaml
  text: The Pharisees heard the crowd muttering these things about him[c][b][a], and the chief priests and the Pharisees sent officers to seize him.
translation:
  language: ru
  text: Фарисеи услышали, как в толпе вполголоса говорили[a] о Нём всё это, и первосвященники и фарисеи послали стражников[b], чтобы схватить Его[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «роптали» или «перешёптывались». Греческое слово обозначает приглушённые разговоры, иногда с оттенком недовольства.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «служителей»; то есть официальных стражников, состоявших при иудейских властях. Возможный перевод: «храмовую стражу».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «арестовать Его». Греческий глагол буквально означает «схватить», «захватить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: услышали
  rationale: Аорист ἀκούω обозначает получение услышанной информации; «услышали» естественно и точно передаёт смысл.
- source_word: τοῦ ὄχλου
  choice: в толпе
  rationale: ὄχλος — собравшийся народ, толпа. Конструкция «как в толпе… говорили» естественно передаёт греческий родительный абсолют, не превращая всю толпу в обязательно единодушного говорящего.
- source_word: γογγύζοντος
  choice: вполголоса говорили
  rationale: γογγύζω указывает на приглушённые разговоры, нередко с оттенком недовольства. Контекстуально нейтральное «вполголоса говорили» сохраняет приглушённость, а возможный негативный оттенок отмечен в сноске.
- source_word: περὶ αὐτοῦ ταῦτα
  choice: о Нём всё это
  rationale: Переданы и περί с родительным («о Нём»), и множественное ταῦτα («всё это»); порядок слов звучит естественно по-русски.
- source_word: ἀπέστειλαν
  choice: послали
  rationale: Прямое и стилистически нейтральное соответствие аористу ἀποστέλλω.
- source_word: οἱ ἀρχιερεῖς
  choice: первосвященники
  rationale: В данном историческом контексте множественное ἀρχιερεῖς обозначает высшее священническое руководство; «первосвященники» — укоренившееся русское библейское обозначение этой группы.
- source_word: ὑπηρέτας
  choice: стражников
  rationale: Здесь ὑπηρέται — официальные служители, направленные религиозными властями для задержания. «Стражники» ясно передаёт их функцию, не используя неестественное в современном русском «чиновники» или двусмысленное «служители».
- source_word: ἵνα πιάσωσιν αὐτόν
  choice: чтобы схватить Его
  rationale: ἵνα с аористом сослагательного наклонения выражает цель, а πιάζω буквально означает схватить или захватить. Перевод не уточняет юридическую процедуру сверх сказанного в греческом тексте.
theological_decisions:
- issue: Кем были ὑπηρέται
  choice: официальные стражники, подчинённые первосвященникам и фарисеям
  alternative: служители; храмовая стража
  rationale: Контекст ясно указывает на официальное поручение задержать Иисуса, однако само слово не называет этих людей исключительно «храмовой полицией». «Стражники» сохраняет институциональную функцию без чрезмерной конкретизации.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка «как в толпе вполголоса говорили» естественно передаёт родительный абсолют и приглушённый характер разговоров. Заглавные местоимения при упоминании Иисуса сохранены как привычная русская библейская типографическая норма.
