  text: ⸀οὐχ ἡ γραφὴ εἶπεν ὅτι ἐκ τοῦ σπέρματος Δαυίδ, καὶ ἀπὸ Βηθλέεμ τῆς κώμης ὅπου ἦν Δαυίδ, ⸂ἔρχεται ὁ χριστός⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/042.yaml
  text: Has not the Scripture said that the Messiah comes from the offspring of David and from Bethlehem[a], the village where David was?
translation:
  language: ru
  text: Разве не сказано в Писании, что Мессия[a] придёт из рода Давида и из Вифлеема, селения, где был Давид?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческий титул — ὁ χριστός.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ γραφή
  choice: Писание
  rationale: В единственном числе обозначает авторитетное свидетельство Священного Писания; по-русски естественно «в Писании» после глагола речи.
- source_word: εἶπεν
  choice: сказано
  rationale: Безличная конструкция «сказано в Писании» естественна в современном русском и сохраняет непреходящую силу свидетельства.
- source_word: ἐκ τοῦ σπέρματος Δαυίδ
  choice: из потомков Давида
  rationale: σπέρμα здесь обозначает род и происхождение; «потомки» ясно передаёт генеалогический смысл без буквального «семени».
- source_word: ἀπὸ Βηθλέεμ
  choice: из Вифлеема
  rationale: ἀπό указывает на место происхождения; «из Вифлеема» — естественный русский эквивалент.
- source_word: τῆς κώμης
  choice: селения
  rationale: κώμη означает небольшой населённый пункт; «селение» точно и стилистически достойно, не создавая современного административного оттенка слова «деревня».
- source_word: ὅπου ἦν Δαυίδ
  choice: откуда был Давид
  rationale: Русская формулировка передаёт лаконичное указание на происхождение Давида и естественнее буквального «где был Давид», не уточняя сверх текста, жил ли он там или родился.
- source_word: ἔρχεται
  choice: придёт
  rationale: В контексте ожидания Мессии русский будущий вид естественно выражает предсказанное пришествие; настоящее греческого имеет обобщающе-пророческую силу.
- source_word: ὁ χριστός
  choice: Мессия
  rationale: Здесь это обсуждаемый иудейский титул ожидаемого царя-избавителя, поэтому перевод значения предпочтительнее формы «Христос».
theological_decisions:
- issue: Передача ὁ χριστός как титула
  choice: Мессия
  alternative: Христос
  rationale: В данном споре слово обозначает ожидаемого Мессию и функционирует как титул, а не как ставшее именем обозначение Иисуса. В сноске сохранён традиционный альтернативный эквивалент.
translation_notes:
  register: Современный литературный русский, понятный широкому читателю; риторический вопрос и мессианский контекст сохранены. Порядок происхождения — от потомков Давида и из Вифлеема — следует греческому тексту.
