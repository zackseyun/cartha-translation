revisions:
- from: Разве не сказано в Писании, что Мессия[a] придёт из потомков Давида и из Вифлеема, селения, откуда был Давид?
  to: Разве не сказано в Писании, что Мессия[a] придёт из рода Давида и из Вифлеема, селения, где был Давид?
  rationale: Исправлены два небезопасных русских выражения без изменения смысла. «Из рода Давида» передаёт генеалогическое ἐκ τοῦ σπέρματος Δαυίδ; «где был Давид» сохраняет сдержанность исходного выражения. Будущее «придёт» допустимо в русском как передача пророчески-ожидательного контекста греческого настоящего ἔρχεται.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:21:52Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: риторический вопрос, Писание, происхождение Мессии от Давида и из Вифлеема, а также титул «Мессия» сохранены. Однако «из потомков Давида» неточно: Мессия не является одним из потомков Давида, а происходит из его рода. «Откуда был Давид» для современного литературного русского неестественно и синтаксически ущербно.'
  naturalness: «Разве не сказано в Писании» и «селение» звучат естественно в литературном регистре. Замена на «из рода Давида» устраняет двусмысленность. Оборот «где был Давид» сохраняет лаконичность греческого ὅπου ἦν Δαυίδ, не добавляя конкретизации о рождении или проживании.
  terminology: «Писание» соответствует ἡ γραφή, а «Мессия» уместно передаёт ὁ χριστός как обсуждаемый титул. Сноска с традиционным вариантом «Христос» корректна и её следует сохранить.
  issues:
  - severity: medium
    issue: «из потомков Давида»
    rationale: Этот оборот может означать, что Мессия приходит «из числа потомков» Давида, тогда как ἐκ τοῦ σπέρματος Δαυίδ обозначает происхождение, династическую линию. «Из рода Давида» ясно передаёт данный смысл.
  - severity: medium
    issue: «откуда был Давид»
    rationale: Оборот не является естественным современным русским способом определить место, связанное с Давидом. «Где был Давид» ближе к намеренно минимальному греческому ὅπου ἦν Δαυίδ и не вносит уточнения «родился» либо «жил».
  revised_text: Разве не сказано в Писании, что Мессия[a] придёт из рода Давида и из Вифлеема, селения, где был Давид?
