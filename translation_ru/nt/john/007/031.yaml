source:
  edition: SBLGNT
  text: ⸂ἐκ τοῦ ὄχλου δὲ πολλοὶ⸃ ἐπίστευσαν εἰς αὐτόν, καὶ ⸀ἔλεγον· Ὁ χριστὸς ὅταν ἔλθῃ ⸀μὴ πλείονα ⸀σημεῖα ποιήσει ὧν οὗτος ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/031.yaml
  text: But many from the crowd believed in him[a], and they were saying, “When the Messiah comes, he will not do more signs than this man has done, will he?”
translation:
  language: ru
  text: 'Но многие из толпы уверовали в него и говорили: «Когда придёт Мессия[a], разве он совершит больше знамений, чем совершил этот человек?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческое Χριστός здесь употреблено как титул ожидаемого иудейского Помазанника.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ ὄχλου δὲ πολλοὶ
  choice: Но многие из толпы
  rationale: δέ передаёт мягкое противопоставление окружающему неверию и спору, а ἐκ τοῦ ὄχλου сохраняет значение части, выделенной из более многочисленной толпы.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: уверовали в него
  rationale: Сочетание πιστεύω с εἰς обозначает направленную на личность веру; «уверовали в него» точно и естественно передаёт это значение в данном контексте.
- source_word: ἔλεγον
  choice: говорили
  rationale: Русский глагол несовершенного вида передаёт продолжительный или повторяющийся характер речи, выраженный греческим имперфектом.
- source_word: ὁ χριστός
  choice: Мессия
  rationale: Здесь Χριστός употреблено как титул в иудейском мессианском контексте, поэтому «Мессия» яснее передаёт его функцию; вариант «Христос» сохранён в сноске.
- source_word: ὅταν ἔλθῃ
  choice: когда придёт
  rationale: Сочетание ὅταν с аористом сослагательного наклонения обозначает ожидаемое будущее событие; по-русски естественно «когда придёт».
- source_word: μὴ πλείονα σημεῖα ποιήσει
  choice: разве он совершит больше знамений
  rationale: Вопросительная частица μή предполагает отрицательный ответ. «Разве» естественно сохраняет эту риторическую направленность, а πλείονα передано количественным «больше», не «более великие».
- source_word: σημεῖα
  choice: знамения
  rationale: В Евангелии от Иоанна σημεῖα — не просто чудеса, но указывающие на личность и миссию Иисуса деяния; «знамения» сохраняет этот смысловой мотив.
- source_word: οὗτος
  choice: этот человек
  rationale: Указательное местоимение относится к Иисусу в речи толпы. «Этот человек» звучит по-русски естественнее буквального «этот» и не добавляет почтительного оттенка.
- source_word: ἐποίησεν
  choice: совершил
  rationale: Аорист обозначает уже совершённые Иисусом знамения; простое прошедшее время естественно сочетается с будущим сравнением.
theological_decisions:
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Фраза «когда придёт» показывает, что речь идёт о ожидаемом иудейском Помазаннике, а не об имени. Основной текст передаёт титул как «Мессия», не исключая традиционного варианта «Христос».
- issue: Риторическая сила вопроса с μή
  choice: Вопрос с «разве», предполагающий отрицательный ответ
  alternative: Нейтральный вопрос о том, совершит ли Мессия больше знамений
  rationale: Частица μή обычно настраивает слушателя на ответ «нет». Перевод сохраняет уверенность толпы в значимости знамений Иисуса, не превращая её в прямое утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской лексикой («уверовали», «знамения»). Местоимения, относящиеся к Иисусу и Мессии, написаны со строчной буквы, поскольку греческий текст не выражает почтительного различия регистром. Риторический вопрос оформлен естественной русской конструкцией с «разве».
