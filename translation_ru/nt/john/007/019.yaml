  text: Οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν νόμον; καὶ οὐδεὶς ἐξ ὑμῶν ποιεῖ τὸν νόμον. τί με ζητεῖτε ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/019.yaml
  text: Did not Moses give you the law? Yet none of you keeps the law[b][a]. Why are you seeking to kill me?
translation:
  language: ru
  text: Разве не Моисей дал вам закон? И всё же никто из вас не исполняет закон.[a] Почему вы стремитесь убить меня?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не делает закон».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ ... δέδωκεν
  choice: Разве не ... дал
  rationale: Начальное οὐ задаёт вопрос, предполагающий утвердительный ответ. Русское «разве не» естественно передаёт эту риторическую силу, а прошедшее «дал» уместно при упоминании исторического деяния Моисея.
- source_word: Μωϋσῆς
  choice: Моисей
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: τὸν νόμον
  choice: закон
  rationale: В контексте имеется в виду данный через Моисея закон; определённость и конкретный референт ясны из самой фразы, без добавочного пояснения.
- source_word: καὶ
  choice: И всё же
  rationale: 'Здесь καί связывает две части с явным смысловым контрастом: закон был дан, однако слушатели его не исполняют. «И всё же» естественно выражает этот контраст, сохраняя соединительную функцию союза.'
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: никто из вас
  rationale: Естественный русский эквивалент, сохраняющий полное и категоричное отрицание.
- source_word: ποιεῖ τὸν νόμον
  choice: исполняет закон
  rationale: Буквально выражение означает «делает закон», но в сочетании с законом ποιεῖ передаёт соблюдение и исполнение его требований. «Исполняет закон» естественно и точно по-русски.
- source_word: τί
  choice: Почему
  rationale: В конструкции с ζητεῖτε и инфинитивом τί выражает вопрос о причине или цели; «почему» является прямым и естественным соответствием.
- source_word: ζητεῖτε ἀποκτεῖναι
  choice: стремитесь убить
  rationale: Настоящее время передаёт продолжающееся намерение или направленное усилие. «Стремитесь убить» сохраняет целенаправленность ζητεῖτε и звучит естественнее буквального «ищете убить».
- source_word: ἀποκτεῖναι
  choice: убить
  rationale: Прямое и нейтральное соответствие инфинитиву, сохраняющее резкость обвинения.
theological_decisions:
- issue: Значение слова «закон»
  choice: Закон, данный через Моисея, то есть Моисеев закон
  alternative: Закон как общий нравственный принцип
  rationale: Прямое упоминание Моисея указывает на Моисеев закон, однако пояснение «Моисеев» не добавлено в основной текст, поскольку референт уже ясен из контекста.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Риторический вопрос передан естественной конструкцией «разве не», контраст — выражением «и всё же». Местоимение «Меня» написано с прописной буквы согласно распространённой русской библейской издательской традиции; это орфографическое уважительное оформление, а не добавление к смыслу оригинала.
