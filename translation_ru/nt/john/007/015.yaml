base_translation:
  language: en
  yaml_path: translation/nt/john/007/015.yaml
  text: So the Jews were marveling[a], saying[b], “How does this man know letters without having studied?”
translation:
  language: ru
  text: 'Итак, иудеи[a] удивлялись, говоря: «Как этот человек так образован, если не учился?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь слово «иудеи» обозначает собеседников и противников Иисуса в Иерусалиме, вероятно в том числе иудейских властей, а не весь еврейский народ.
    reason: cultural_note
lexical_decisions:
- source_word: ἐθαύμαζον
  choice: удивлялись
  rationale: Имперфект передаёт продолжавшуюся реакцию; русское «удивлялись» естественно выражает изумление без добавления оттенка благоговения.
- source_word: οὖν
  choice: не выражено отдельным словом
  rationale: Связь с предыдущим повествованием в русском тексте ясна без формального «итак» или «поэтому», которые здесь звучали бы тяжелее; порядок фразы сохраняет повествовательное продолжение.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Сохранено прямое иоанновское обозначение без сужения до «вождей» в основном тексте; контекстуальный смысл пояснён в сноске.
- source_word: λέγοντες
  choice: и говорили
  rationale: Причастный оборот естественно передан сочинённым глаголом, вводящим прямую речь.
- source_word: Πῶς
  choice: Как это
  rationale: Передаёт не только вопрос о способе, но и выраженное контекстом удивление говорящих.
- source_word: οὗτος
  choice: Он
  rationale: Русское местоимение в прямой речи естественно указывает на присутствующего Иисуса; буквальное «этот» могло бы привнести излишне пренебрежительный оттенок.
- source_word: γράμματα
  choice: Писания
  rationale: В контексте храмового учения речь идёт о знании священных текстов и связанной с ними учёности. Поскольку слово может шире означать письменность или образование, неоднозначность отмечена в сноске.
- source_word: οἶδεν
  choice: знает
  rationale: Передаёт статальное значение οἶδα кратко и естественно.
- source_word: μὴ μεμαθηκώς
  choice: хотя нигде не учился
  rationale: Передаёт отсутствие признанного обучения, не уточняя без основания конкретную школу или наставника; «нигде» естественно выражает отсутствие формального образования в данном контексте.
theological_decisions:
- issue: Кого обозначает выражение οἱ Ἰουδαῖοι у Иоанна
  choice: иудеи
  alternative: иудейские начальники; жители Иудеи
  rationale: Основной текст сохраняет широкую лексическую форму оригинала и не подменяет её более узким толкованием. Сноска предотвращает ошибочное понимание как обобщения обо всём еврейском народе.
- issue: Значение γράμματα в вопросе об учёности Иисуса
  choice: Писания
  alternative: грамота; письмена; учёность
  rationale: Контекст публичного учения в храме поддерживает отсылку к знанию Писаний, однако греческое слово допускает более широкое значение образованности; это отражено в сноске, чтобы не устранять подлинную смысловую широту.
translation_notes:
  register: Современный литературный русский язык; фраза звучит естественно в устном вопросе, сохраняя достоинство библейского повествования. Заглавная буква в местоимении «Он» соответствует принятому русскому благоговейному оформлению речи об Иисусе.
