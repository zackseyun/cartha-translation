base_translation:
  language: en
  yaml_path: translation/nt/john/007/004.yaml
  text: For no one does anything in secret while seeking to be in public view. If you do these things, show yourself to the world.
translation:
  language: ru
  text: Ведь никто не делает ничего втайне и при этом сам стремится быть на виду[a]. Если Ты делаешь всё это, яви Себя миру.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «быть известным открыто»; греческое выражение подчёркивает публичность и открытость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς γάρ
  choice: Ведь никто
  rationale: «Ведь» естественно передаёт пояснительную силу γάρ и связывает реплику с предыдущим стихом; οὐδεὶς передано обычным обобщающим «никто».
- source_word: τι ἐν κρυπτῷ ποιεῖ
  choice: не делает ничего втайне
  rationale: Сохраняет неопределённый объект τι и идиоматическое значение ἐν κρυπτῷ — скрытно, не публично.
- source_word: καὶ ζητεῖ αὐτὸς
  choice: если сам стремится
  rationale: В данном обобщённом высказывании союз передаёт смысловое сопоставление двух несовместимых намерений; «сам» сохраняет эмфазу αὐτός, а «стремится» — целенаправленность ζητεῖ.
- source_word: ἐν παρρησίᾳ εἶναι
  choice: быть на виду
  rationale: В контексте речь идёт о публичности и открытой видимости, а не о смелости речи. Русское выражение естественно и не перегружает текст толкованием.
- source_word: εἰ ταῦτα ποιεῖς
  choice: Если Ты делаешь это
  rationale: Передаёт реальное условие настоящего времени; единственное «это» по-русски естественно охватывает упомянутые дела.
- source_word: φανέρωσον σεαυτὸν
  choice: яви Себя
  rationale: Передаёт решительный императив публичного самораскрытия; «яви Себя» звучит достойно и сохраняет более сильный оттенок, чем нейтральное «покажи себя».
- source_word: τῷ κόσμῳ
  choice: миру
  rationale: Сохраняет ключевое для Иоанна слово κόσμος и его возможный литературно-богословский резонанс, не сводя значение только к «публике».
theological_decisions:
- issue: Значение κόσμος в контексте Евангелия от Иоанна
  choice: миру
  alternative: публике / людям
  rationale: Непосредственно имеется в виду публичное явление, однако буквальное «миру» сохраняет характерную лексику Иоанна и не устраняет возможную тематическую многозначность.
- issue: Характер условия εἰ ταῦτα ποιεῖς
  choice: Если Ты делаешь это
  alternative: Раз Ты делаешь это
  rationale: Сохранено формальное условие и оттенок сомнения или вызова в речи братьев; перевод «раз» преждевременно делал бы условие утверждением.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской дикцией. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской издательской традиции. Реплика сохраняет прямой, вызывающий тон братьев.
