  naturalness: «Ведь никто не делает ничего втайне и при этом сам стремится быть на виду» — естественная современная литературная фраза и сохраняет оттенок несообразности в реплике. «Яви Себя миру» уместно в умеренно возвышенном библейском регистре.
  terminology: «Миру» оправданно сохраняет иоанновское κόσμος. «Яви Себя» точно и стилистически последовательно передаёт φανέρωσον σεαυτόν. Сноска к «на виду» уместна и не требует изменения.
