  yaml_path: translation/nt/john/007/052.yaml
  text: They answered and said to him[b][a], “Are you also from Galilee? Search and see that no prophet arises from Galilee.”
translation:
  language: ru
  text: 'Они ответили ему: «Ты ведь тоже не из Галилеи?[a] Исследуй и увидишь, что из Галилеи не появляется ни одного пророка[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий вопрос с μή предполагает отрицательный ответ; возможная передача: «Ты ведь не из Галилеи, верно?»'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из Галилеи не воздвигается ни один пророк». Такая передача сохраняет возможный оттенок того, что пророк воздвигается Богом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Они ответили ему
  rationale: Сочетание двух глаголов представляет собой обычную греческую повествовательную формулу. В современном русском буквальное «ответили и сказали ему» звучит избыточно, поэтому смысл естественно передан одним глаголом.
- source_word: Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ;
  choice: Уж не из Галилеи ли и ты?
  rationale: Конструкция с μή предполагает отрицательный ответ и передаёт насмешливо-недоверчивый тон; русская форма «уж не… ли» естественно сохраняет эту риторическую направленность.
- source_word: ἐραύνησον καὶ ἴδε
  choice: Исследуй Писания и увидишь
  rationale: Императивы требуют внимательного разыскания и последующего вывода. Дополнение «Писания» ясно из контекста спора об их свидетельстве, однако в греческом тексте оно не выражено и потому отмечается как интерпретирующее уточнение.
- source_word: προφήτης
  choice: пророк
  rationale: Существительное без артикля обозначает пророка вообще, а не определённого эсхатологического Пророка.
- source_word: οὐκ ἐγείρεται
  choice: не восстаёт
  rationale: «Восстаёт» сохраняет образ глагола ἐγείρω и допускает как значение появления пророка, так и возможный оттенок того, что Бог воздвигает пророка.
theological_decisions:
- issue: Риторическая сила вопроса с μή
  choice: «Уж не из Галилеи ли и ты?»
  alternative: «Разве и ты из Галилеи?»
  rationale: Выбранная формулировка ясно показывает, что говорящие ожидают отрицательного ответа, не превращая подразумеваемое в прямое утверждение.
- issue: Возможный подразумеваемый деятель при ἐγείρεται
  choice: «пророк не восстаёт»
  alternative: «Бог не воздвигает пророка»
  rationale: Греческая форма может описывать появление пророка либо подразумевать Божье действие. Основной текст сохраняет эту двусмысленность и не вводит прямо не названного деятеля.
- issue: Объект повеления «исследуй»
  choice: «Исследуй Писания»
  alternative: «Исследуй»
  rationale: Контекст указывает на исследование Писаний, но дополнение отсутствует в данном греческом стихе; это уточнение сделано ради естественности и прозрачно объяснено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством полемической сцены. Форма «уж не… ли» передаёт презрительную риторичность вопроса. «Восстаёт» несколько возвышенно, но понятно и сохраняет смысловую ёмкость исходного глагола. Добавление «Писания» контекстуально мотивировано, хотя формально отсутствует в стихе.
