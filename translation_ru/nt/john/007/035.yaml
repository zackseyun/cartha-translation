  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς ἑαυτούς· Ποῦ οὗτος μέλλει πορεύεσθαι ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν; μὴ εἰς τὴν διασπορὰν τῶν Ἑλλήνων μέλλει πορεύεσθαι καὶ διδάσκειν τοὺς Ἕλληνας;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/035.yaml
  text: So the Jews said to one another, “Where is this man about to go, that we will not find him? He is not about to go to the dispersion among the Greeks and teach the Greeks, is he?”
translation:
  language: ru
  text: 'Тогда иудеи[a] сказали друг другу: «Куда это Он намерен пойти, что мы не найдём Его? Разве Он намерен пойти к рассеянным среди греков[b] и учить греков?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жители Иудеи». Греческое слово может обозначать иудеев вообще или, в некоторых контекстах, жителей Иудеи.'
    reason: lexical_alternative
  - marker: b
    text: То есть к иудеям, живущим в рассеянии среди греков, а не к рассеянным грекам.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Обычный русский эквивалент этно-религиозного обозначения; контекст не даёт оснований сужать значение до руководителей. Возможное региональное значение отмечено в сноске.
- source_word: πρὸς ἑαυτούς
  choice: друг другу
  rationale: Передаёт взаимный характер разговора внутри группы естественным современным русским выражением.
- source_word: Ποῦ οὗτος
  choice: Куда Он
  rationale: Русское местоимение звучит естественнее буквального «этот»; прописная буква соответствует принятому благоговейному библейскому регистру, не меняя референции.
- source_word: μέλλει πορεύεσθαι
  choice: намерен пойти
  rationale: В данном вопросе μέλλω выражает предполагаемое намерение или предстоящее действие; «намерен» естественно согласуется с последующим риторическим вопросом.
- source_word: ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν
  choice: что мы не найдём Его
  rationale: Сохраняет формально неоднозначную связь ὅτι и не добавляет отсутствующего в греческом понятия возможности.
- source_word: μὴ
  choice: Не намерен ли Он
  rationale: Русская вопросительная конструкция с «не… ли» естественно передаёт вопрос, предполагающий отрицательный ответ.
- source_word: διασπορὰν τῶν Ἑλλήνων
  choice: к рассеянным среди греков
  rationale: Передаёт διασπορά как рассеянных иудеев, а генитив — как среду их проживания, не создавая ошибочного впечатления, будто рассеяны сами греки.
- source_word: τοὺς Ἕλληνας
  choice: греков
  rationale: Прямой лексический эквивалент, не расширяющий значение до всех язычников.
theological_decisions:
- issue: Объём значения Ἰουδαῖοι в повествовании Иоанна
  choice: иудеи
  alternative: жители Иудеи
  rationale: В стихе нет прямого указания ни только на жителей области, ни только на религиозных руководителей; основной текст сохраняет широкое обозначение, а региональная возможность вынесена в сноску.
- issue: К кому относится διασπορά
  choice: рассеянные иудеи, живущие среди греков
  alternative: греческое рассеяние
  rationale: В иудейском употреблении διασπορά обозначает рассеянный среди народов еврейский народ; перевод устраняет возможное неверное понимание генитива, не превращая «греков» во всех язычников.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка «к рассеянным среди греков» понятнее абстрактного «в Рассеяние» и точно передаёт культурный референт. Местоимения, относящиеся к Иисусу, даны с прописной буквы по устойчивой русской библейской традиции.
