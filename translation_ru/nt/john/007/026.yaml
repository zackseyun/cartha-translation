id: JHN.7.26
reference: John 7:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἴδε παρρησίᾳ λαλεῖ καὶ οὐδὲν αὐτῷ λέγουσιν· μήποτε ἀληθῶς ἔγνωσαν οἱ ἄρχοντες ὅτι οὗτός ⸀ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/026.yaml
  text: And look[a], he is speaking openly, and they say nothing to him. Can it be that the rulers truly know that this is the Messiah?
translation:
  language: ru
  text: И вот, Он говорит открыто, а они ничего Ему не говорят. Неужели правители и вправду узнали, что Он и есть Мессия?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Возможно ли, что правители действительно признали, что Он и есть Мессия?»'
    reason: 'Альтернативная передача оттенков μήποτε и ἔγνωσαν: вопрос может звучать как осторожное предположение, а глагол — как признание личности Иисуса.'
lexical_decisions:
- source_word: ἴδε
  choice: вот
  rationale: Употреблено как частица привлечения внимания; «вот» естественно передаёт её функцию в современном русском без архаического оттенка.
- source_word: παρρησίᾳ
  choice: открыто
  rationale: Передаёт публичный и ничем не стеснённый характер речи; «смело» неоправданно выдвигало бы на первый план мужество.
- source_word: λαλεῖ
  choice: говорит
  rationale: Настоящее время изображает продолжающееся действие, которое наблюдают собравшиеся.
- source_word: οὐδὲν αὐτῷ λέγουσιν
  choice: они ничего Ему не говорят
  rationale: Сохранена буквальная направленность действия к Иисусу без добавления подразумеваемого значения «против Него».
- source_word: μήποτε
  choice: неужели
  rationale: Передаёт удивлённое и недоверчивое предположение, не превращая вопрос в однозначное отрицание.
- source_word: ἀληθῶς
  choice: и вправду
  rationale: Естественно по-русски подчёркивает неожиданность предполагаемого признания.
- source_word: ἔγνωσαν
  choice: узнали
  rationale: Аорист передан формой завершённого узнавания; контекст допускает оттенок «пришли к признанию», отмеченный в сноске.
- source_word: οἱ ἄρχοντες
  choice: правители
  rationale: Сохраняет значение лиц, обладающих властью, не вводя более узкое пояснение «иудейские руководители», отсутствующее в стихе.
- source_word: ὅτι οὗτός ἐστιν ὁ χριστός
  choice: что Он и есть Мессия
  rationale: Конструкция «и есть» естественно передаёт идентификационную силу указательного οὗτός, а «Мессия» передаёт χριστός как титул.
theological_decisions:
- issue: Передача ὁ χριστός как мессианского титула
  choice: Мессия
  alternative: Христос
  rationale: В вопросе толпы слово обозначает ожидаемого Помазанника и функционирует как титул, а не как часть имени; «Мессия» яснее сохраняет иудейский контекст.
- issue: Степень уверенности в вопросе с μήποτε
  choice: Неужели…?
  alternative: Возможно ли, что…?
  rationale: Основной текст сохраняет недоверчивое удивление говорящих, а сноска показывает допустимое более нейтральное понимание предположения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Заглавные местоимения в отношении Иисуса сохранены как принятая русская издательская норма. Союз «а» передаёт контраст между Его открытой речью и отсутствием реакции властей, выраженный контекстуально при помощи καί.
