  text: ἐζήτουν οὖν αὐτὸν πιάσαι, καὶ οὐδεὶς ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/030.yaml
  text: So they were seeking to seize him[a], yet no one laid a hand on him[b], because his hour had not yet come.
translation:
  language: ru
  text: Итак, они пытались схватить Его[a], но никто не наложил на Него руки, потому что час Его ещё не настал[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стремились схватить Его» или «пытались задержать Его». Греческий глагол означает «схватить»; в данном контексте это, вероятно, подразумевает задержание.'
    reason: lexical_alternative
  - marker: b
    text: «Его час» — повторяющееся у Иоанна выражение, обозначающее установленное Богом время в миссии Иисуса, особенно связанное с Его страданиями, смертью, воскресением и прославлением.
    reason: cross_reference
lexical_decisions:
- source_word: ἐζήτουν οὖν
  choice: Тогда они стали искать случая
  rationale: Передаёт повествовательное следствие οὖν и длительную либо повторяющуюся направленность действия в имперфекте ἐζήτουν естественным современным русским выражением.
- source_word: πιάσαι
  choice: схватить
  rationale: Сохраняет основное значение физического захвата; в данном контексте подразумевается задержание, но юридический оттенок не вносится прямо в основной текст.
- source_word: καὶ οὐδεὶς ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα
  choice: но никто не наложил на Него руки
  rationale: Союз передан противительным «но» по смысловой связи; устойчивое библейское выражение сохраняет образ исходного текста и означает попытку взять человека под стражу.
- source_word: ὅτι οὔπω ἐληλύθει
  choice: потому что … ещё не пришёл
  rationale: Ясно передаёт причинную связь, временное отрицание и результативное значение плюсквамперфекта применительно к тому моменту повествования.
- source_word: ἡ ὥρα αὐτοῦ
  choice: час Его
  rationale: Сохраняет характерный для Иоанна многозначный образ «часа», не сводя его только к смерти, аресту или прославлению.
theological_decisions:
- issue: Значение выражения «час Его» в повествовании Иоанна
  choice: Сохранить буквальное выражение «час Его» без поясняющего расширения в основном тексте.
  alternative: назначенное для Него время; время Его смерти
  rationale: В Евангелии от Иоанна «час» обозначает установленный Богом решающий этап служения Иисуса, особенно Его страдания, смерть, воскресение и прославление, однако сам стих не ограничивает значение одним событием.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Заглавные местоимения при обращении к Иисусу следуют принятой русской христианской издательской традиции. Порядок слов «час Его» сохраняет узнаваемость богословски значимого иоанновского выражения.
