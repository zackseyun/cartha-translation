  text: ⸂Ἐκ τοῦ ὄχλου οὖν⸃ ἀκούσαντες ⸂τῶν λόγων τούτων⸃ ⸀ἔλεγον· Οὗτός ἐστιν ἀληθῶς ὁ προφήτης·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/040.yaml
  text: Therefore[a], some from the crowd, when they heard these words, were saying, “This truly is the Prophet.”
translation:
  language: ru
  text: 'Итак, некоторые из толпы, услышав эти слова, говорили: «Он действительно Пророк[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вероятно, имеется в виду ожидаемый пророк, подобный Моисею (см. Второзаконие 18:15), хотя некоторые толкователи понимают это выражение в более общем смысле — «пророк».
    reason: cross_reference
lexical_decisions:
- source_word: Ἐκ τοῦ ὄχλου
  choice: некоторые из толпы
  rationale: 'Предложное сочетание имеет партитивный смысл: речь идёт не обо всей толпе, а о части находившихся в ней людей.'
- source_word: οὖν
  choice: итак
  rationale: Передаёт связь с предшествующими словами Иисуса и последовавший отклик толпы, не сводя союз лишь к указанию времени.
- source_word: ἀκούσαντες
  choice: услышав
  rationale: Деепричастие естественно передаёт действие, предшествующее основному глаголу.
- source_word: τῶν λόγων τούτων
  choice: эти слова
  rationale: В контексте выражение указывает на только что произнесённые слова Иисуса; это прямой и естественный русский эквивалент.
- source_word: ἔλεγον
  choice: говорили
  rationale: Несовершенный вид передаёт имперфект греческого глагола, представляющий речь как происходившую или повторявшуюся.
- source_word: Οὗτός ἐστιν
  choice: Он
  rationale: Греческое указательное местоимение непосредственно указывает на Иисуса; личное местоимение звучит в современной русской прямой речи естественнее, чем буквальное «Этот».
- source_word: ἀληθῶς
  choice: действительно
  rationale: Сохраняет усиленное утверждение истинности без излишне архаичного оттенка.
- source_word: ὁ προφήτης
  choice: Пророк
  rationale: Определённый артикль и контекст Евангелия от Иоанна позволяют понять выражение как обозначение ожидаемого особого Пророка; прописная буква передаёт титульный характер, не уточняя его личность.
theological_decisions:
- issue: Кого подразумевает выражение ὁ προφήτης
  choice: Передать как титульное «Пророк», не отождествляя его прямо с Мессией.
  alternative: 'Понимать выражение в общем смысле: «пророк».'
  rationale: Вероятна аллюзия на ожидаемого пророка, подобного Моисею, однако сам стих не раскрывает точного содержания титула. Перевод сохраняет эту богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет достоинство повествования и остаётся понятной широкому кругу читателей. Несовершенный вид «говорили» передаёт длительный или повторяющийся характер реакции толпы.
