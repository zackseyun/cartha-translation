lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ответила
  rationale: Обычный повествовательный глагол ответа в диалоге; согласован с собирательным существительным «толпа».
- source_word: ὄχλος
  choice: толпа
  rationale: Передаёт собравшуюся массу людей естественным и современным русским словом.
- source_word: Δαιμόνιον ἔχεις
  choice: В Тебе бес
  rationale: Естественный русский библейский оборот, близко сохраняющий греческое «имеешь демона» и не превращающий обвинение в более специальную формулировку «одержим».
- source_word: τίς
  choice: Кто
  rationale: Сохраняет явное вопросительное местоимение и риторическую форму ответа толпы.
- source_word: ζητεῖ
  choice: хочет
  rationale: В сочетании с инфинитивом передаёт ζητεῖ как намерение или попытку; по-русски «кто хочет тебя убить?» звучит естественнее буквального «кто ищет убить тебя?».
- source_word: ἀποκτεῖναι
  choice: убить
  rationale: Прямой современный эквивалент без добавления юридической или нравственной оценки, присущей слову «убить» в данном контексте.
theological_decisions:
- issue: Передача δαιμόνιον в обвинении, обращённом к Иисусу
  choice: «В Тебе бес» с буквальной альтернативой в сноске
  alternative: '«Ты одержим бесом»; буквально: «У Тебя есть демон»'
  rationale: Текст сообщает враждебное обвинение толпы, не подтверждая его. Выбранный оборот сохраняет образ присутствующего в человеке беса, но не вводит более истолковывающее понятие одержимости.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Местоимения, относящиеся к Иисусу, написаны с прописной буквы по принятой русской библейской традиции; реплика толпы при этом остаётся явно враждебным обвинением.
