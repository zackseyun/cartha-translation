  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐν τῇ οἰκίᾳ τοῦ πατρός μου μοναὶ πολλαί εἰσιν· εἰ δὲ μή, εἶπον ἂν ὑμῖν ⸀ὅτι πορεύομαι ἑτοιμάσαι τόπον ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/002.yaml
  text: In my Father's house there are many dwelling places[a]. If it were not so[b], would I have told you that I am going to prepare a place for you?
translation:
  language: ru
  text: В доме моего Отца много мест для пребывания[a]. Если бы это было не так[b], разве я сказал бы вам, что иду приготовить вам место?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «много комнат». Греческое слово может обозначать места, где остаются или живут; выражение «места для пребывания» шире и сохраняет связь с темой пребывания в этой главе.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможное прочтение: «Если бы это было не так, я сказал бы вам, потому что иду приготовить вам место». Греческую фразу можно понять и как утверждение, а не как риторический вопрос.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίᾳ
  choice: доме
  rationale: «Дом» естественно передаёт конкретный образ οἰκία и сохраняет выражение «дом моего Отца», не сужая его до значения «семья» или «домочадцы».
- source_word: πατρός μου
  choice: моего Отца
  rationale: Русский родительный оборот прямо и естественно передаёт греческое сочетание; прописная буква указывает на Бога как референта в речи Иисуса.
- source_word: μοναὶ πολλαί
  choice: много мест для пребывания
  rationale: μονή обозначает место, где остаются или живут. Такое выражение сохраняет широту смысла и связь с темой пребывания в Ин 14, не привнося образ роскошных «обителей» и не сводя значение к отдельным комнатам.
- source_word: εἰ δὲ μή
  choice: Если бы это было не так
  rationale: Условный оборот требует в русском явного восполнения подразумеваемого содержания и так звучит ясно и естественно.
- source_word: εἶπον ἂν ὑμῖν
  choice: разве я сказал бы вам
  rationale: Сочетание аориста с ἄν передано русским условным наклонением; частица «разве» ясно выражает выбранное риторически-вопросительное понимание фразы.
- source_word: ὅτι
  choice: что
  rationale: В основном тексте ὅτι вводит содержание сказанного; альтернативное причинное понимание отмечено в сноске.
- source_word: πορεύομαι
  choice: иду
  rationale: Настоящее время передаёт действие как уже предстоящее и близкое; краткое «иду» соответствует непосредственности речи Иисуса.
- source_word: ἑτοιμάσαι
  choice: приготовить
  rationale: Инфинитив цели передан обычным и ясным русским глаголом.
- source_word: τόπον
  choice: место
  rationale: «Место» сохраняет широкое значение τόπος и не сужает его до «комнаты».
- source_word: ὑμῖν
  choice: вам
  rationale: Дательный падеж естественно передаёт значение предназначения; множественное число выражено формой «вам» без лишнего добавления «всем».
theological_decisions:
- issue: Передача μονή в эсхатологическом образе
  choice: много мест для пребывания
  alternative: много комнат; много обителей
  rationale: «Места для пребывания» сохраняют основное значение слова и тематическую связь с пребыванием, не уточняя устройство дома и не внося позднейших ассоциаций, связанных со словом «обители».
- issue: Пунктуация и синтаксическая сила второй части стиха
  choice: 'риторический вопрос: «Если бы это было не так, разве я сказал бы вам, что иду приготовить вам место?»'
  alternative: 'утверждение: «Если бы это было не так, я сказал бы вам, потому что иду приготовить вам место»'
  rationale: В древнем тексте не было современной пунктуации, а конструкция допускает как вопросительное, так и утвердительное прочтение. Основной текст следует естественному риторически-вопросительному прочтению, а подлинная неоднозначность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранён конкретный образ «дома Отца»; избегнуты архаичное «обители» и более узкое «комнаты» в основном тексте. Местоимения, относящиеся к Иисусу, набраны со строчной буквы по нормам современного общего текста; «Отец» — с прописной как обозначение Бога.
