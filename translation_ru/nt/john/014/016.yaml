  source_fidelity: 'Перевод точно передаёт основные элементы греческого текста: κἀγώ — «И Я», ἐρωτήσω — «попрошу», τὸν πατέρα — «Отца» без добавления «Моего», ἄλλον παράκλητον — «другого Заступника», а также цель/результат в ἵνα ᾖ — «чтобы Он был». «С вами вовеки» верно передаёт μεθ’ ὑμῶν εἰς τὸν αἰῶνα. Не вносятся дополнительные богословские утверждения.'
