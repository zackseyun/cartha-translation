id: JHN.14.16
reference: John 14:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: κἀγὼ ἐρωτήσω τὸν πατέρα καὶ ἄλλον παράκλητον δώσει ὑμῖν ἵνα ⸀ᾖ μεθ’ ὑμῶν εἰς τὸν ⸀αἰῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/016.yaml
  text: And I will ask the Father[a], and he will give you another Advocate, so that he may be with you forever,
translation:
  language: ru
  text: И Я попрошу Отца, и Он даст вам другого Заступника[a], чтобы Он был с вами вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Помощника», «Советника»; традиционно: «Утешителя». Так можно передать греческое παράκλητος.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: И Я
  rationale: Слияние καί и ἐγώ передаёт связь с предыдущей мыслью и лёгкое усиление подлежащего; «И Я» естественно сохраняет оба оттенка.
- source_word: ἐρωτήσω
  choice: попрошу
  rationale: Будущее время ἐρωτάω здесь означает обращение с просьбой; «попрошу» естественно для современного русского языка и не вносит архаического молитвенного оттенка.
- source_word: τὸν πατέρα
  choice: Отца
  rationale: В греческом стоит определённый артикль без притяжательного местоимения; перевод не добавляет «Моего».
- source_word: ἄλλον
  choice: другого
  rationale: Сохраняет прямое значение ἄλλος и соотнесённость обещанного παράκλητος с Иисусом, не разворачивая эту связь толковательно.
- source_word: παράκλητον
  choice: Заступника
  rationale: Слово обозначает личного защитника, представителя или того, кто приходит на помощь. «Заступник» сохраняет личностный и защитно-представительный смысл; иные возможные оттенки отмечены в сноске.
- source_word: δώσει ὑμῖν
  choice: даст вам
  rationale: Прямая и естественная передача будущего времени и косвенного дополнения.
- source_word: ἵνα ᾖ
  choice: чтобы Он был
  rationale: Конструкция ἵνα с сослагательным наклонением выражает цель или предполагаемый результат; русский оборот с «чтобы» сохраняет эту открытость.
- source_word: μεθ’ ὑμῶν
  choice: с вами
  rationale: Точно передаёт μετά с родительным падежом, не заменяя значение на более пространственное «среди вас».
- source_word: εἰς τὸν αἰῶνα
  choice: вовеки
  rationale: Устойчивый и понятный в достойном библейском регистре эквивалент идиомы, обозначающей непреходящую продолжительность.
theological_decisions:
- issue: Передача παράκλητος в контексте обещания «другого» παράκλητος
  choice: Заступник
  alternative: Помощник; Советник; Утешитель
  rationale: «Заступник» сохраняет личностный, защитный и представительский аспекты слова, не сводя его к одной функции. Поскольку семантический диапазон шире любого одного русского соответствия, основные альтернативы приведены в сноске.
- issue: Референт подразумеваемого подлежащего при ᾖ
  choice: Он
  alternative: тот
  rationale: Русское личное местоимение делает фразу естественной и передаёт личный референт мужского рода παράκλητος, не добавляя определения природы или служения обещанного лица.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Заглавные местоимения «Я», «Он» употреблены как принятая русская издательская конвенция для божественных лиц; синтаксис остаётся ясным и близким к структуре греческого текста.
