id: JHN.14.18
reference: John 14:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οὐκ ἀφήσω ὑμᾶς ὀρφανούς, ἔρχομαι πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/018.yaml
  text: I will not leave you as orphans[b][a]; I am coming to you.
translation:
  language: ru
  text: Не оставлю вас сиротами; Я приду к вам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «Я приду к вам» могут относиться к явлениям Иисуса после воскресения, к Его приходу через Святого Духа или к Его будущему возвращению; сама греческая формулировка не указывает однозначно лишь на одно из этих событий.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφήσω
  choice: оставлю
  rationale: Будущее время ἀφίημι здесь означает «оставить, покинуть». Нейтральное «оставлю» естественно сочетается с образом сирот и не усиливает смысл до «брошу».
- source_word: ὀρφανούς
  choice: сиротами
  rationale: Сохраняет конкретный семейный образ людей, лишённых родительской заботы, и естественно передаёт предикативный винительный падеж в конструкции «оставить кого-либо кем-либо».
- source_word: ἔρχομαι
  choice: приду
  rationale: Греческое настоящее время имеет здесь значение близкого или уверенно предстоящего действия. В современном русском «приду» звучит естественнее буквального «иду» и не определяет, какое именно пришествие имеется в виду.
- source_word: πρὸς ὑμᾶς
  choice: к вам
  rationale: Передаёт направленность движения к адресатам обычным русским оборотом при глаголе «прийти».
- source_word: Οὐκ
  choice: не
  rationale: Обычное отрицание, естественно передаваемое частицей «не» при глаголе будущего времени.
theological_decisions:
- issue: К какому событию относится «Я приду к вам»
  choice: Оставить формулировку без уточнения события
  alternative: Явления Иисуса после воскресения; Его приход через Святого Духа; Его будущее возвращение
  rationale: Контекст допускает несколько взаимосвязанных прочтений, а сама греческая формулировка не вынуждает выбрать только одно. Перевод сохраняет эту богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная и достойная формулировка. Образ сирот сохранён непосредственно. Заглавная буква в местоимении «Я» следует традиционному русскому библейскому оформлению речи Христа.
