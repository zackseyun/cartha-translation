  source_fidelity: 'Текст точно передаёт греческий оригинал: οὐκ ἀφήσω — «Не оставлю», ὑμᾶς ὀρφανούς — «вас сиротами», ἔρχομαι πρὸς ὑμᾶς — «Я приду к вам». Русское будущее «приду» естественно передаёт настоящее ἔρχομαι с предстоящим, уверенным значением, не сужая возможный референт.'
