reference: John 14:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἠκούσατε ὅτι ἐγὼ εἶπον ὑμῖν· Ὑπάγω καὶ ἔρχομαι πρὸς ὑμᾶς. εἰ ἠγαπᾶτέ με ἐχάρητε ἄν, ⸀ὅτι πορεύομαι πρὸς τὸν πατέρα, ὅτι ὁ ⸀πατὴρ μείζων μού ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/028.yaml
  text: You heard that I said to you[a], ‘I am going away, and I am coming to you.’ If you loved me, you would have rejoiced that I am going to the Father[b], because the Father is greater than I.
translation:
  language: ru
  text: 'Вы слышали, что Я сказал вам: «Я ухожу и приду к вам». Если бы вы любили Меня, то обрадовались бы[a], что Я иду к Отцу, потому что Отец больше Меня[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то радовались бы». Греческую форму можно понять более общо, хотя в данном условном высказывании естественно видеть нереализованную радость.'
    reason: lexical_alternative
  - marker: b
    text: Слова «Отец больше Меня» переведены без добавления толковательного уточнения, например «по положению» или «в земном состоянии».
    reason: alternative_reading
lexical_decisions:
- source_word: ἠκούσατε
  choice: Вы слышали
  rationale: Аорист указывает на состоявшееся слышание ранее сказанных слов Иисуса; простое прошедшее время естественно по-русски.
- source_word: Ὑπάγω καὶ ἔρχομαι πρὸς ὑμᾶς
  choice: Я ухожу и приду к вам
  rationale: «Ухожу» передаёт движение прочь от учеников, а «приду» — направленное к ним действие с будущей отнесённостью; такая смена форм естественна в русском и сохраняет смысл греческих настоящих форм.
- source_word: εἰ ἠγαπᾶτέ με
  choice: Если бы вы любили Меня
  rationale: Имперфект в условии, противоречащем действительности, естественно передаётся русской конструкцией с «бы».
- source_word: ἐχάρητε ἄν
  choice: то обрадовались бы
  rationale: Аорист с ἄν выражает нереализованную реакцию; русская форма допускает как контекстуальную ретроспективность, так и более общее понимание.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: Я иду к Отцу
  rationale: Передаёт направленное движение к Отцу ясно и без избыточного толкования; определённый артикль отражён титульным употреблением «Отец».
- source_word: μείζων μού
  choice: больше Меня
  rationale: Прямо сохраняет неуточнённое сравнение исходного текста и звучит естественно в современном литературном русском.
theological_decisions:
- issue: Смысл слов «Отец больше Меня»
  choice: Оставить прямое сравнение без поясняющего ограничения.
  alternative: «Отец выше Меня по положению» или «Отец больше Меня в Моём воплощённом состоянии».
  rationale: Греческий текст не уточняет аспект сравнения. Добавление такого уточнения разрешило бы богословское напряжение средствами перевода и внесло бы интерпретацию в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно принятой русской библейской традиции. Формулировка сохраняет условность высказывания и намеренно не снимает богословскую напряжённость последней части стиха.
