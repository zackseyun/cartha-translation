  text: Ταῦτα λελάληκα ὑμῖν παρ’ ὑμῖν μένων·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/025.yaml
  text: I have spoken these things to you while staying with you[a].
translation:
  language: ru
  text: Всё это Я сказал вам, пока остаюсь с вами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «находясь с вами»; греческий текст использует причастие от глагола «оставаться, пребывать», часто встречающегося у Иоанна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: Всё это
  rationale: Передаёт указательное местоимение среднего рода множественного числа как отсылку ко всему предшествующему наставлению; по-русски естественнее, чем буквальное «эти вещи».
- source_word: λελάληκα
  choice: Я сказал
  rationale: Русское прошедшее совершенного вида естественно передаёт завершённую речь с сохраняющейся значимостью; буквальное воспроизведение греческого перфекта конструкцией «Я говорил» здесь менее точно и менее естественно.
- source_word: ὑμῖν
  choice: вам
  rationale: Точно передаёт дательный падеж местоимения множественного числа без избыточного добавления «всем».
- source_word: παρ’ ὑμῖν
  choice: с вами
  rationale: Естественно выражает присутствие рядом с учениками, обозначенное παρά с дательным падежом.
- source_word: μένων
  choice: пока остаюсь
  rationale: Передаёт одновременность настоящего причастия и сохраняет связь с характерным для Иоанна глаголом μένω — «оставаться, пребывать».
theological_decisions:
- issue: Сохранение тематической лексики Иоанна, связанной с μένω
  choice: пока остаюсь с вами
  alternative: находясь с вами; пока Я с вами
  rationale: Выбор сохраняет повторяющийся у Иоанна образ «оставаться/пребывать», не придавая ему в этом стихе дополнительного богословского смысла и одновременно указывая на продолжающееся присутствие Иисуса.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная. «Всё это» естественно передаёт греческое множественное Ταῦτα, а «пока остаюсь» сохраняет настоящее время и характерную лексику Иоанна.
