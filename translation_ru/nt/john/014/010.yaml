  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐ πιστεύεις ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί ἐστιν; τὰ ῥήματα ἃ ἐγὼ ⸀λέγω ὑμῖν ἀπ’ ἐμαυτοῦ οὐ λαλῶ, ὁ δὲ ⸀πατὴρ ἐν ἐμοὶ ⸀μένων ποιεῖ τὰ ἔργα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/010.yaml
  text: Do you not believe that I am in the Father and the Father is in me? The words that I say to you I do not speak from myself[b][a], but the Father who remains in me does his works.
translation:
  language: ru
  text: Разве ты не веришь, что Я в Отце и Отец во Мне? Слова, которые Я говорю вам, Я говорю не от Себя[a]; но Отец, пребывающий во Мне[b], совершает Свои дела.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не по Своей инициативе»; выражение может указывать на собственную инициативу или власть.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «остающийся во Мне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: веришь
  rationale: Обычное для Евангелия от Иоанна соответствие πιστεύω; сохраняет связь с повторяющейся темой веры.
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: в Отце ... во Мне
  rationale: Буквально сохраняет язык взаимного пребывания и не заменяет его толкованием «един с».
- source_word: τὰ ῥήματα
  choice: слова
  rationale: Прямое и естественное соответствие в данном контексте.
- source_word: λέγω ... λαλῶ
  choice: говорю ... говорю
  rationale: В русском различение «говорю» и «изрекаю/произношу» звучало бы искусственно; повтор обеспечивает ясность и естественность.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: не от Себя
  rationale: Сохраняет образ источника речи и оставляет открытыми оттенки собственной инициативы и власти.
- source_word: μένων
  choice: пребывающий
  rationale: Передаёт длительность μένω и важную для Иоанна лексику; в современном литературном библейском регистре слово понятно и уместно.
- source_word: ποιεῖ τὰ ἔργα αὐτοῦ
  choice: совершает Свои дела
  rationale: Естественная русская сочетаемость; «дела» сохраняет характерную для Иоанна лексику, а «Свои» передаёт αὐτοῦ.
theological_decisions:
- issue: Взаимное пребывание Отца и Сына
  choice: «Я в Отце и Отец во Мне»
  alternative: «Я един с Отцом, и Отец един со Мной»
  rationale: Буквальная пространственно-реляционная формулировка сохраняет точный образ греческого текста и не подменяет его богословским разъяснением.
- issue: Источник слов Иисуса и действие Отца
  choice: «Я говорю не от Себя; но Отец… совершает Свои дела»
  alternative: «Я говорю не по собственной власти; Отец… действует через Меня»
  rationale: Выбранный вариант сохраняет различие Лиц и единство действия, не уточняя сверх текста характер власти или посредничества.
translation_notes:
  register: Современный литературный русский с достоинством библейского регистра. Местоимения, относящиеся к Отцу и Сыну, написаны с прописной буквы по принятой русской библейской традиции. «Пребывающий» несколько возвышенно, но сохраняет важный иоанновский мотив μένω.
