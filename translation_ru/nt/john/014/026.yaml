source:
  edition: SBLGNT
  text: ὁ δὲ παράκλητος, τὸ πνεῦμα τὸ ἅγιον ὃ πέμψει ὁ πατὴρ ἐν τῷ ὀνόματί μου, ἐκεῖνος ὑμᾶς διδάξει πάντα καὶ ὑπομνήσει ὑμᾶς πάντα ἃ εἶπον ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/026.yaml
  text: But the Advocate[a], the Holy Spirit, whom the Father will send in my name, he will teach you all things and remind you of all that I said to you.
translation:
  language: ru
  text: Но Заступник[a], Святой Дух, которого Отец пошлёт во имя Моё, — Он научит вас всему и напомнит вам всё, что Я сказал вам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «Помощник», «Советник» или «Утешитель» (греч. пара́клетос).
    reason: Ни одно русское слово полностью не охватывает сочетание оттенков поддержки, представительства, совета и утешения в παράκλητος.
lexical_decisions:
- source_word: παράκλητος
  choice: Заступник
  rationale: Слово передаёт личную и деятельную роль того, кто выступает в поддержку другого; «Заступник» сохраняет оттенок представительства и защиты, не сводя значение лишь к утешению. Другие основные оттенки указаны в сноске.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Святой Дух
  rationale: Общепринятое и естественное современное русское наименование, точно соответствующее греческому выражению.
- source_word: ὃ πέμψει ὁ πατήρ
  choice: которого Отец пошлёт
  rationale: Местоимение мужского рода естественно относится в русском к личному обозначению «Заступник» и сохраняет представленную в стихе личную деятельность Святого Духа.
- source_word: ἐν τῷ ὀνόματί μου
  choice: во имя Моё
  rationale: Устойчивое русское выражение сохраняет возможные оттенки полномочия, представительства и связи с Иисусом, не сужая их до одного толкования.
- source_word: ἐκεῖνος
  choice: Он
  rationale: Отдельное местоимение после тире передаёт эмфатическое возвращение к Заступнику и подчёркивает личного деятеля.
- source_word: διδάξει ὑμᾶς πάντα
  choice: научит вас всему
  rationale: Естественно и близко передаёт глагол διδάσκω и широкий охват πάντα.
- source_word: ὑπομνήσει ὑμᾶς πάντα ἃ εἶπον ὑμῖν
  choice: напомнит вам всё, что Я сказал вам
  rationale: Сохраняет причинный смысл «побудит вспомнить», относительную конструкцию и прямую связь с прежними словами Иисуса.
theological_decisions:
- issue: Личное обозначение Святого Духа
  choice: Использовать личные формы «которого» и «Он»
  alternative: Передать πνεῦμα местоимениями среднего рода или безличной конструкцией
  rationale: Хотя πνεῦμα грамматически среднего рода, оно соотнесено с мужским παράκλητος и эмфатическим ἐκεῖνος; синтаксис представляет Святого Духа как личного деятеля.
- issue: Передача παράκλητος
  choice: Заступник
  alternative: Помощник; Советник; Утешитель
  rationale: Греческое слово семантически многогранно. «Заступник» сохраняет активные оттенки поддержки, представительства и защиты, а другие подлинные возможности вынесены в сноску, чтобы не скрывать неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Порядок определений и повтор «вам» сохранены ради ясности и близости к греческому тексту; тире выделяет эмфатическое ἐκεῖνος. Заглавные буквы в местоимениях, относящихся к Иисусу и Святому Духу, использованы как издательская норма данного текста, не изменяющая смысла.
