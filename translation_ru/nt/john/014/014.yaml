  text: ἐάν τι αἰτήσητέ ⸀με ἐν τῷ ὀνόματί μου ⸀ἐγὼ ποιήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/014.yaml
  text: If you ask me anything in my name[a], I will do it.
translation:
  language: ru
  text: Если попросите Меня о чём-либо во имя Моё[a], Я сделаю это.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «Если попросите о чём-либо во имя Моё, Я сделаю это» — слово «Меня» отсутствует.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐάν
  choice: если
  rationale: Вводит условное придаточное; «если» естественно и точно передаёт условие.
- source_word: τι
  choice: о чём-либо
  rationale: После глагола просьбы неопределённое местоимение естественно передаётся по-русски сочетанием «о чём-либо», сохраняя открытый объём просьбы.
- source_word: αἰτήσητέ
  choice: попросите
  rationale: Аорист конъюнктива второго лица множественного числа в условной конструкции; совершенный вид «попросите» естественно передаёт отдельный акт просьбы.
- source_word: με
  choice: Меня
  rationale: Прямое дополнение присутствует в принятом тексте SBLGNT и явно указывает, к кому обращена просьба.
- source_word: ἐν τῷ ὀνόματί μου
  choice: во имя Моё
  rationale: Традиционное, понятное и точное выражение, сохраняющее связь просьбы с именем, личностью и полномочиями Иисуса без пояснительного расширения.
- source_word: ἐγὼ
  choice: Я
  rationale: Явное греческое местоимение имеет некоторую эмфатическую силу; русское «Я» сохраняет её без добавления «Сам».
- source_word: ποιήσω
  choice: сделаю это
  rationale: Будущее время обещания; указательное «это» естественно отсылает к предмету просьбы.
theological_decisions:
- issue: Наличие με («Меня») и прямое обращение с просьбой к Иисусу
  choice: В основном тексте переведено «попросите Меня»
  alternative: «Если попросите о чём-либо во имя Моё, Я сделаю это»
  rationale: Предоставленный текст SBLGNT содержит με, поэтому основной перевод следует этому чтению. Поскольку вариант без местоимения влияет на то, назван ли Иисус прямым адресатом просьбы, он указан в сноске без устранения богословского напряжения.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Инверсия «во имя Моё» сохраняет узнаваемость библейского выражения, оставаясь понятной современному читателю.
