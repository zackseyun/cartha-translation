source:
  edition: SBLGNT
  text: καὶ ὅ τι ἂν αἰτήσητε ἐν τῷ ὀνόματί μου τοῦτο ποιήσω, ἵνα δοξασθῇ ὁ πατὴρ ἐν τῷ υἱῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/013.yaml
  text: And whatever you ask in my name[a], this I will do, so that the Father may be glorified in the Son.
translation:
  language: ru
  text: И чего бы вы ни попросили во имя Моё, это Я сделаю, чтобы Отец был прославлен в Сыне[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через Сына». Греческое выражение буквально означает «в Сыне» и может указывать как на сферу, так и на средство прославления Отца.'
    reason: Альтернативное понимание многозначного греческого предлога ἐν.
lexical_decisions:
- source_word: ὅ τι ἂν
  choice: чего бы… ни
  rationale: Относительно-неопределённая конструкция с ἄν передаёт неограниченный охват. Русская конструкция «чего бы… ни» естественна с глаголом «попросить» и сохраняет значение «чего угодно».
- source_word: αἰτήσητε
  choice: вы ни попросили
  rationale: Форма является аористом сослагательного наклонения, вторым лицом множественного числа. В сочетании с «чего бы… ни» совершенный вид естественно передаёт неопределённое будущее действие.
- source_word: ἐν τῷ ὀνόματί μου
  choice: во имя Моё
  rationale: Устоявшееся и близкое к греческому выражение сохраняет многослойный смысл представительства, принадлежности и действия в согласии с Иисусом, не сводя его только к власти или полномочиям.
- source_word: τοῦτο
  choice: это
  rationale: Явно выраженное указательное местоимение сохранено; порядок «это Я сделаю» передаёт его смысловое выделение.
- source_word: ποιήσω
  choice: Я сделаю
  rationale: Прямой и естественный эквивалент широкого по значению ποιέω; будущее время соответствует греческой форме.
- source_word: ἵνα
  choice: чтобы
  rationale: Союз ясно передаёт целевое значение греческого ἵνα.
- source_word: δοξασθῇ
  choice: был прославлен
  rationale: Страдательная конструкция сохраняет библейскую лексику славы и грамматический залог исходного текста.
- source_word: ὁ πατὴρ
  choice: Отец
  rationale: Греческий текст говорит «Отец», а не «Мой Отец». Заглавная буква уместна для особого обозначения Бога в данном контексте.
- source_word: ἐν τῷ υἱῷ
  choice: в Сыне
  rationale: Буквальная передача ἐν сохраняет возможные оттенки сферы и средства, не сужая выражение до одного толкования.
theological_decisions:
- issue: Смысл просьбы «во имя Моё»
  choice: Сохранено выражение «во имя Моё» без поясняющего перифраза.
  alternative: «по Моей власти», «в единении со Мной», «в согласии с Моей волей и характером»
  rationale: Иоанново выражение допускает несколько взаимосвязанных смысловых оттенков. Близкий перевод сохраняет их и не вводит в основной текст одно частное богословское толкование.
- issue: Значение ἐν τῷ υἱῷ
  choice: «в Сыне»
  alternative: «через Сына»
  rationale: Предлог ἐν здесь может обозначать сферу либо средство. Основной текст сохраняет формальную неоднозначность греческого выражения, а возможное инструментальное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Инверсия «это Я сделаю» намеренно сохраняет акцент исходного текста; местоимение «Моё» написано с заглавной буквы согласно принятому уважительному оформлению речи Христа.
