  text: εἰρήνην ἀφίημι ὑμῖν, εἰρήνην τὴν ἐμὴν δίδωμι ὑμῖν· οὐ καθὼς ὁ κόσμος δίδωσιν ἐγὼ δίδωμι ὑμῖν. μὴ ταρασσέσθω ὑμῶν ἡ καρδία μηδὲ δειλιάτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/027.yaml
  text: Peace I leave with you; my peace I give to you. I do not give to you as the world gives. Do not let your heart be troubled[a], nor let it be fearful.
translation:
  language: ru
  text: Мир оставляю вам; Мой мир даю вам. Я даю вам не так, как даёт мир. Пусть сердце ваше не тревожится и не робеет.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и не боится»; или: «и не падает духом». Греческий глагол означает поддаваться страху, робеть или терять мужество.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνην
  choice: мир
  rationale: Обычное и широкое соответствие, сохраняющее как смысл покоя, так и более глубокие оттенки благополучия и целостности, не сужая их толкованием.
- source_word: ἀφίημι
  choice: оставляю
  rationale: Прямо передаёт значение глагола в данном контексте; возможный оттенок завещания не вынесен в основной текст как слишком интерпретационный.
- source_word: εἰρήνην τὴν ἐμὴν
  choice: Мой мир
  rationale: Сохраняет эмфатическое притяжательное местоимение и противопоставляет мир Иисуса тому, что даёт мир.
- source_word: δίδωμι
  choice: даю
  rationale: Естественное соответствие настоящему времени, позволяющее сохранить повтор глагола и контраст.
- source_word: οὐ καθὼς ὁ κόσμος δίδωσιν ἐγὼ δίδωμι ὑμῖν
  choice: Я даю вам не так, как даёт мир
  rationale: Естественный русский порядок слов сохраняет явное сопоставление способа, которым даёт Иисус, с тем, как даёт мир.
- source_word: κόσμος
  choice: мир
  rationale: Традиционное широкое соответствие для κόσμος, сохраняющее характерную для Иоанна многозначность и не сводящее слово лишь к обществу или мировому порядку.
- source_word: μὴ ταρασσέσθω
  choice: Пусть ... не тревожится
  rationale: Передаёт форму повеления и перекликается с Ин 14:1; «тревожится» естественно выражает внутреннее смятение.
- source_word: ὑμῶν ἡ καρδία
  choice: сердце ваше
  rationale: Сохраняет греческое единственное число при обращении к нескольким людям и его собирательный смысл.
- source_word: μηδὲ δειλιάτω
  choice: и не робеет
  rationale: «Робеть» передаёт страх, боязливость и утрату мужества, сохраняя отличие от предшествующего «тревожится» и избегая резкого обвинения в трусости.
theological_decisions:
- issue: Природа мира, который даёт Иисус
  choice: Оставить широкое обозначение «мир» / «Мой мир» без поясняющего расширения.
  alternative: Уточнить как внутренний покой, эсхатологическую целостность или примирение с Богом.
  rationale: Сам стих не ограничивает значение одним аспектом; широкая передача сохраняет богословскую насыщенность и напряжение исходного текста.
- issue: Значение единственного числа «сердце» при множественном «ваше»
  choice: Сохранить «сердце ваше» как собирательное единственное число.
  alternative: Передать более обычным по-русски множественным числом «ваши сердца».
  rationale: Единственное число отражает форму греческого текста и допускает коллективное обращение к ученикам без навязывания индивидуализирующего прочтения.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной близостью к структуре оригинала. Инверсия «сердце ваше» поддерживает библейскую торжественность, оставаясь понятной. Повтор «мир» намеренно сохранён, как и различие между «тревожится» и «робеет».
