  verdict: approve
  source_fidelity: Перевод точно передаёт условное будущего характера («если Я пойду»), приготовление места для адресатов, повторный приход, принятие учеников к Иисусу и целевую конструкцию ἵνα. Формулировка «чтобы и вы были там, где Я» естественно воспроизводит смысл ὅπου εἰμὶ ἐγὼ καὶ ὑμεῖς ἦτε, не устраняя целевой оттенок.
  naturalness: Текст звучит естественно на современном литературном русском. Условная связка «если ... то», «снова приду» и «возьму вас к Себе» ясны и сохраняют сдержанно-торжественный библейский регистр без архаизации.
  terminology: «Приготовлю вам место», «снова приду» и «возьму вас к Себе» уместны и не вносят конфессионального истолкования. Прописное написание местоимений соответствует заявленной издательской практике. Сноска a корректно поясняет футуристическое употребление настоящей формы ἔρχομαι, а сноска b сохраняет спектр интерпретаций обещанного прихода, не делая одну из них нормативной.
