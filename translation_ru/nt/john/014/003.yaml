reference: John 14:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐὰν πορευθῶ ⸀καὶ ἑτοιμάσω ⸂τόπον ὑμῖν⸃, πάλιν ἔρχομαι καὶ παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν, ἵνα ὅπου εἰμὶ ἐγὼ καὶ ὑμεῖς ἦτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/003.yaml
  text: And if I go and prepare a place for you[a], I am coming again and will take you to myself, so that where I am[b], you also may be.
translation:
  language: ru
  text: И если Я пойду и приготовлю вам место, то снова приду[a] и возьму вас к Себе, чтобы и вы были там, где Я[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «снова прихожу». В греческом употреблена форма настоящего времени, имеющая здесь значение будущего.'
    reason: lexical_alternative
  - marker: b
    text: Есть разные толкования того, относится ли обещание «снова приду» именно к окончательному возвращению Иисуса, к Его явлениям после воскресения, к пришествию Духа или представляет собой многослойное обещание, охватывающее несколько событий.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν πορευθῶ
  choice: если Я пойду
  rationale: Условная конструкция с ἐάν и аористом сослагательного наклонения указывает на будущую ситуацию. «Пойду» прямо передаёт πορεύομαι и сохраняет связь с предстоящим уходом Иисуса.
- source_word: ἑτοιμάσω τόπον ὑμῖν
  choice: приготовлю вам место
  rationale: Естественно и точно передаёт значения ἑτοιμάζω («приготовить») и τόπος («место»), не уточняя природу этого места сверх сказанного в тексте.
- source_word: πάλιν ἔρχομαι
  choice: снова приду
  rationale: Настоящая форма ἔρχομαι здесь имеет будущее значение. Русское «приду» ясно передаёт обещание будущего прихода, а «снова» соответствует πάλιν; особенность греческой формы отмечена в сноске.
- source_word: παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν
  choice: возьму вас к Себе
  rationale: Передаёт как действие παραλαμβάνω, так и направленность πρὸς ἐμαυτόν — принятие учеников в непосредственное присутствие Иисуса.
- source_word: ἵνα
  choice: чтобы
  rationale: Обычный современный русский союз цели, точно передающий целевое значение ἵνα.
- source_word: ὅπου εἰμὶ ἐγὼ καὶ ὑμεῖς ἦτε
  choice: чтобы и вы были там, где Я
  rationale: «Были» сохраняет сослагательную форму целевого придаточного; «и вы» передаёт καὶ ὑμεῖς. Добавленное по нормам русского языка «там» проясняет соотнесённость с «где», не расширяя смысла.
theological_decisions:
- issue: Характер обещанного прихода Иисуса в πάλιν ἔρχομαι
  choice: Будущее обещание передано как «снова приду» без уточнения способа и времени исполнения.
  alternative: Воскресные явления Иисуса, пришествие Духа, окончательное возвращение Христа либо многослойное обещание, охватывающее несколько событий.
  rationale: Сам стих обещает новый приход Иисуса и принятие учеников к Нему, однако не требует от перевода выбрать одно из основных толкований. Неопределённость сохранена и обозначена в сноске.
translation_notes:
  register: Современный литературный русский язык с привычной библейской торжественностью без архаизмов. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской издательской практике. Порядок слов сделан естественным для русского языка при сохранении условной конструкции, обещания и целевого придаточного.
