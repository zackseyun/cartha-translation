  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ὁδὸς καὶ ἡ ἀλήθεια καὶ ἡ ζωή· οὐδεὶς ἔρχεται πρὸς τὸν πατέρα εἰ μὴ δι’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/006.yaml
  text: Jesus said to him[a], “I am the way, and the truth, and the life[b]. No one comes to the Father except through me.”
translation:
  language: ru
  text: 'Иисус говорит ему[a]: «Я — путь, и истина, и жизнь. Никто не приходит к Отцу иначе как через Меня[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисус сказал ему». В греческом здесь употреблено повествовательное настоящее время.'
    reason: historical_present
  - marker: b
    text: 'Или: «Никто не приходит к Отцу, кроме как через Меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: говорит
  rationale: Сохранён греческий исторический презенс. В русском библейском повествовании настоящее время здесь звучит естественно и придаёт сцене непосредственность.
- source_word: αὐτῷ
  choice: ему
  rationale: Дательный падеж местоимения прямо обозначает адресата слов Иисуса.
- source_word: Ἐγώ εἰμι
  choice: Я —
  rationale: Именная конструкция с тире естественно передаёт по-русски emphатическое «Я есмь / Я являюсь», не прибегая к архаичному «есмь» и не добавляя отсутствующего в греческом глагола «есть».
- source_word: ἡ ὁδός
  choice: путь
  rationale: «Путь» сохраняет как прямое, так и метафорическое значение ὁδός и естественно выражает доступ к Отцу.
- source_word: ἡ ἀλήθεια
  choice: истина
  rationale: «Истина» передаёт основное значение ἀλήθεια и сохраняет богословскую ёмкость слова в Евангелии от Иоанна.
- source_word: ἡ ζωή
  choice: жизнь
  rationale: «Жизнь» прямо передаёт ζωή, не сужая его богатого иоанновского смысла поясняющей парафразой.
- source_word: οὐδεὶς
  choice: никто
  rationale: Обычный и точный русский эквивалент отрицательного местоимения.
- source_word: ἔρχεται
  choice: не приходит
  rationale: Настоящее время выражает общее, непреходящее положение; русский глагол «приходит» передаёт это естественно.
- source_word: πρὸς τὸν πατέρα
  choice: к Отцу
  rationale: Предлог πρός с винительным обозначает движение к кому-либо; «Отец» оформлен как личное обозначение Бога.
- source_word: εἰ μὴ
  choice: иначе как
  rationale: В отрицательной конструкции это естественный русский способ передать исключительное значение «если не / кроме как».
- source_word: δι’ ἐμοῦ
  choice: через Меня
  rationale: διά с родительным обозначает посредство или средство; «через Меня» точно сохраняет эту силу выражения.
theological_decisions:
- issue: Исключительность доступа к Отцу через Иисуса
  choice: «Никто не приходит к Отцу иначе как через Меня»
  alternative: «Никто не приходит к Отцу, кроме как через Меня»
  rationale: Греческий текст прямо и недвусмысленно выражает исключительность. Формулировка сохранена без смягчения и без расширения смысла за пределы стиха.
- issue: Трёхчастная последовательность именных сказуемых
  choice: «путь, и истина, и жизнь»
  alternative: «путь, истина и жизнь»
  rationale: Повтор союза передаёт повтор καί и подчёркивает каждый из трёх членов; нулевые связки и общий контекст сохраняют их определённость, хотя русский язык не имеет артиклей.
- issue: Формула Ἐγώ εἰμι
  choice: «Я — путь…»
  alternative: «Я есмь путь…»
  rationale: Современное русское именное предложение точно передаёт отождествление и акцент на «Я», не привнося архаического регистра и не заявляя сверх того, что выражено данным синтаксисом.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранены риторический повтор «и» и историческое настоящее; исключены архаизм «есмь» и излишне поясняющие богословские добавления.
