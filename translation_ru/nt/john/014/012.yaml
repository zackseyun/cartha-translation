source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ πιστεύων εἰς ἐμὲ τὰ ἔργα ἃ ἐγὼ ποιῶ κἀκεῖνος ποιήσει, καὶ μείζονα τούτων ποιήσει, ὅτι ἐγὼ πρὸς τὸν ⸀πατέρα πορεύομαι·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/012.yaml
  text: Truly[a], truly, I say to you, the one who believes in me will also do the works that I do; and he will do greater works than these[b], because I am going to the Father.
translation:
  language: ru
  text: 'Истинно, истинно говорю вам: верующий в Меня тоже будет совершать дела, которые совершаю Я, и совершит более великие дела, чем эти[a], потому что Я иду к Отцу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «большие [дела], чем эти». Существительное «дела» подразумевается из предыдущей части; стих не уточняет, в каком именно отношении эти дела будут более великими.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Истинно, истинно
  rationale: Передаёт торжественную усиленную формулу через естественное и понятное русское выражение, сохраняя повтор.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: верующий в Меня
  rationale: Субстантивированное причастие настоящего времени передано обобщённым единственным числом; сочетание «верующий в Меня» естественно для речи Иоанна.
- source_word: τὰ ἔργα ἃ ἐγὼ ποιῶ
  choice: дела, которые совершаю Я
  rationale: «Дела» сохраняет важную для Евангелия от Иоанна лексику, а «совершать» по-русски естественно сочетается с этим существительным. Ударное «Я» отражает эксплицитное ἐγώ.
- source_word: κἀκεῖνος ποιήσει
  choice: тоже будет совершать
  rationale: «Тоже» передаёт добавочно-усилительный смысл κἀκεῖνος, а будущее время соответствует ποιήσει.
- source_word: καὶ μείζονα τούτων ποιήσει
  choice: и совершит дела больше этих
  rationale: Существительное «дела» естественно восполняется из предыдущей части; «больше» сохраняет широту сравнительной формы и не уточняет, идёт ли речь о величии, значимости, масштабе или количестве.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно передаёт причинную связь между предшествующим обещанием и уходом Иисуса к Отцу.
- source_word: πρὸς τὸν πατέρα πορεύομαι
  choice: Я иду к Отцу
  rationale: Настоящее время сохраняет форму оригинала и в контексте естественно указывает на предстоящий уход; артикль перед πατέρα не даёт основания добавлять «Моему».
theological_decisions:
- issue: Смысл выражения «дела больше этих»
  choice: Оставить сравнение широким и не определять, в каком именно отношении эти дела будут больше.
  alternative: 'Уточнить: «более великие по силе», «более значимые в истории спасения» или «более масштабные благодаря миссии Церкви».'
  rationale: Сам стих связывает обещание с уходом Иисуса к Отцу, но не объясняет точный критерий превосходства; перевод не должен устранять эту богословскую напряжённость.
- issue: Референт обобщённого единственного числа
  choice: Передать ὁ πιστεύων формой «верующий», которая в русском грамматически мужского рода, но имеет обобщённое значение.
  alternative: «Каждый, кто верит в Меня».
  rationale: Выбранная форма близко воспроизводит грамматику оригинала и в данном контексте относится к любому верующему, а не только к мужчинам.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным звучанием. Повтор «Истинно, истинно» и порядок «совершаю Я» сохраняют особую выразительность оригинала; заглавные буквы в местоимениях, относящихся к Иисусу, соответствуют принятому русскому библейскому регистру.
