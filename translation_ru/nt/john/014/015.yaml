  text: Ἐὰν ἀγαπᾶτέ με, τὰς ἐντολὰς τὰς ἐμὰς ⸀τηρήσετε·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/015.yaml
  text: If you love me[a], you will keep my commandments.
translation:
  language: ru
  text: Если вы любите Меня, то будете соблюдать Мои заповеди.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будете хранить Мои заповеди»; также возможно: «будете исполнять Мои повеления». Глагол может означать «хранить», «соблюдать», «исполнять» или «оберегать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Если
  rationale: Передаёт условный союз естественно и без добавления повторяющегося значения «всякий раз, когда».
- source_word: ἀγαπᾶτέ
  choice: вы любите
  rationale: Настоящее время сослагательного наклонения после ἐάν естественно передаётся по-русски формой настоящего времени в условном придаточном.
- source_word: με
  choice: Меня
  rationale: Прямое дополнение, относящееся к Иисусу; прописная буква соответствует принятой русской библейской орфографии для местоимений, относящихся к Нему.
- source_word: τὰς ἐντολὰς τὰς ἐμὰς
  choice: Мои заповеди
  rationale: Сохраняет весомость ἐντολή и естественно передаёт греческую притяжательную конструкцию; «повеления» возможно, но менее узнаваемо в данном контексте.
- source_word: τηρήσετε
  choice: будете соблюдать
  rationale: Сохраняет будущее время изъявительного наклонения и широкий смысл τηρέω — соблюдать, хранить и исполнять, — не превращая фразу в прямое повеление.
theological_decisions:
- issue: Передавать ли τηρήσετε как будущее утверждение или как побуждение
  choice: 'будущее утверждение: «будете соблюдать»'
  alternative: 'повеление: «соблюдайте Мои заповеди»'
  rationale: Греческая форма — будущее изъявительного наклонения, а не императив. Перевод сохраняет напряжение между условием любви к Иисусу и следующим из неё соблюдением Его заповедей.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Частица «то» делает условную конструкцию естественной, не меняя её логики. Будущее время сохранено; интонационно стих остаётся утверждением, а не приказом.
