  terminology: «Заповеди» — точное и устоявшееся соответствие ἐντολαί. «Соблюдать» удачно передаёт τηρέω в данном контексте, охватывая соблюдение и верность без сужения до одного лишь подчинения. Прописное написание местоимений, относимых к Иисусу, последовательно соответствует избранной русской библейской орфографии.
