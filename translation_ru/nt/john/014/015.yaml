  source_fidelity: Точный перевод греческого текста. Ἐὰν с настоящим сослагательным ἀγαπᾶτε естественно передано условным «Если вы любите», а τηρήσετε — будущим изъявительным «будете соблюдать», без неоправданного превращения в повеление. Множественное число и притяжательная связь «Мои заповеди» сохранены.
