  text: πιστεύετέ μοι ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί· εἰ δὲ μή, διὰ τὰ ἔργα αὐτὰ ⸀πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/011.yaml
  text: Believe me that I am in the Father and the Father is in me; but if not[a], believe because of the works themselves.
translation:
  language: ru
  text: Верьте Мне, что Я в Отце и Отец во Мне; если же нет[a], верьте по самим делам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Последнее «верьте» в греческом тексте не имеет прямо названного объекта; сами дела представлены как основание для веры. Возможный перевод: «верьте на основании самих дел».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύετέ μοι
  choice: Верьте Мне
  rationale: Глагол πιστεύω с дательным μοι передаёт прямой призыв поверить Иисусу; такая формулировка естественна по-русски и не расширяет смысл до общего «доверьтесь Мне».
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание того, чему следует верить, а не причину веры.
- source_word: ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί
  choice: Я в Отце и Отец во Мне
  rationale: Буквально сохраняет повторяющееся ἐν и характерный для Иоанна язык взаимного пребывания, не заменяя его толкованием.
- source_word: εἰ δὲ μή
  choice: если же нет
  rationale: 'Сохраняет условно-противительную форму и намеренную краткость греческого выражения: если первое основание для веры не принимается, предлагается другое.'
- source_word: διὰ τὰ ἔργα αὐτὰ
  choice: ради самих дел
  rationale: διά с винительным обозначает основание или причину, а αὐτά усиливает существительное. «Ради самих дел» кратко и естественно указывает на дела как основание веры.
- source_word: πιστεύετε
  choice: верьте
  rationale: Передаёт настоящее повелительное наклонение без добавления отсутствующего в греческом объектного дополнения.
theological_decisions:
- issue: Взаимное пребывание Сына и Отца
  choice: Сохранить формулировку «Я в Отце и Отец во Мне».
  alternative: «Я един с Отцом, и Отец един со Мной».
  rationale: Исходный текст говорит именно о взаимном пребывании. Буквальная реляционная формула сохраняет богословскую глубину и не подменяет слова Иоанна doctrинальным пересказом.
- issue: Дела как основание веры
  choice: Оставить последнее «верьте» без прямого дополнения и связать его с «самими делами».
  alternative: «Верьте в Меня ради дел» или «верьте Мне ради дел».
  rationale: При втором πιστεύετε в греческом нет явно выраженного объекта. Его добавление сняло бы реальную синтаксическую открытость текста.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной простоты и иоанновской краткости. Местоимения, относящиеся к Иисусу и Отцу, написаны с прописной буквы согласно устойчивой русской библейской традиции.
