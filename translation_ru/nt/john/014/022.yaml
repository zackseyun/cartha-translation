  text: λέγει αὐτῷ Ἰούδας, οὐχ ὁ Ἰσκαριώτης· Κύριε, ⸀τί γέγονεν ὅτι ἡμῖν μέλλεις ἐμφανίζειν σεαυτὸν καὶ οὐχὶ τῷ κόσμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/022.yaml
  text: Judas (not Iscariot) said to him[a], “Lord[b], what has happened that you are going to reveal yourself to us and not to the world?”
translation:
  language: ru
  text: 'Иуда — не Искариот — сказал Ему: «Господи, что произошло, что Ты намерен явить Себя нам, а не миру?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: сказал
  rationale: Историческое настоящее в греческом повествовании естественно передаётся русским прошедшим временем.
- source_word: Ἰούδας, οὐχ ὁ Ἰσκαριώτης
  choice: Иуда — не Искариот
  rationale: Уточнение прямо отличает этого Иуду от Иуды Искариота; тире естественно передаёт присоединённое пояснение.
- source_word: Κύριε
  choice: Господь
  rationale: В прямом обращении сохраняет уважительный титул и его богословскую весомость.
- source_word: τί γέγονεν
  choice: что произошло
  rationale: 'Передаёт результативный оттенок перфекта: ученик спрашивает, какое изменение обстоятельств обусловило сказанное Иисусом.'
- source_word: μέλλεις
  choice: намерен
  rationale: В данном вопросе выражает предстоящее действие как намерение, не усиливая оттенок непосредственной близости.
- source_word: ἐμφανίζειν σεαυτόν
  choice: открыть Себя
  rationale: Естественно передаёт значение явить или сделать себя известным и сохраняет возвратность выражения.
- source_word: κόσμῳ
  choice: миру
  rationale: Сохраняет характерный для Иоанна ёмкий термин без истолковывающего расширения.
theological_decisions:
- issue: Значение κόσμος у Иоанна
  choice: миру
  alternative: всему человечеству; неверующему миру
  rationale: Буквальное «миру» сохраняет намеренную смысловую широту и богословское напряжение контекста.
translation_notes:
  register: Современный литературный русский язык; речь ясная и достойная, без архаизмов. Заглавные буквы в местоимениях обращения к Иисусу соответствуют принятому русскому библейскому регистру.
