lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз сохраняет связь с предыдущим высказыванием без добавочного усиления.
- source_word: ὅπου
  choice: куда
  rationale: При русском глаголе движения «иду» естественно употребить направительное «куда», передающее место назначения.
- source_word: ἐγὼ
  choice: Я
  rationale: Личное местоимение передано явно; прописная буква соответствует принятому русскому библейскому оформлению речи Иисуса.
- source_word: ὑπάγω
  choice: иду
  rationale: Настоящее время передаёт предстоящее и уже совершающееся движение; «ухожу» было бы несколько более истолковывающим.
- source_word: οἴδατε
  choice: вы знаете
  rationale: Форма οἶδα имеет значение настоящего времени и естественно передаётся глаголом «знаете».
- source_word: τὴν ὁδόν
  choice: путь
  rationale: «Путь» сохраняет как прямое, так и возможное переносное значение ὁδός и естественно подготавливает последующий разговор, не разъясняя его заранее.
theological_decisions:
- issue: Порядок частей фразы и связь оборота «куда Я иду» со словом «путь»
  choice: И куда Я иду, вы знаете путь.
  alternative: И вы знаете путь туда, куда Я иду.
  rationale: Вынесенное вперёд «куда Я иду» близко отражает порядок и синтаксическую напряжённость греческого текста. Вариант с «туда» звучит глаже, но добавляет отсутствующее в источнике указательное слово и яснее определяет смысловую связь, чем это делает греческая конструкция.
- issue: Более пространное разночтение
  choice: 'Краткое чтение SBLGNT: «куда Я иду, вы знаете путь»'
  alternative: «Вы знаете, куда Я иду, и знаете путь»
  rationale: Основной текст следует предоставленному критическому изданию. Более пространное чтение засвидетельствовано частью рукописей и отмечено в сноске, но не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Необычный, но понятный порядок слов сохранён ради близости к греческому тексту и присущей ему смысловой напряжённости.
