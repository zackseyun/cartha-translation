  text: And you know the way where I am going[a].
translation:
  language: ru
  text: И куда Я иду, вы знаете путь[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «И вы знаете, куда Я иду, и знаете путь».'
