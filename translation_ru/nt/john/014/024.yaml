id: JHN.14.24
reference: John 14:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ μὴ ἀγαπῶν με τοὺς λόγους μου οὐ τηρεῖ· καὶ ὁ λόγος ὃν ἀκούετε οὐκ ἔστιν ἐμὸς ἀλλὰ τοῦ πέμψαντός με πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/024.yaml
  text: The one who does not love me does not keep my words[a]. And the word that you hear is not mine[b], but belongs to the Father who sent me.
translation:
  language: ru
  text: Кто не любит меня, тот не соблюдает моих слов. А слово, которое вы слышите, не моё, а пославшего меня Отца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν με
  choice: Кто не любит меня
  rationale: Субстантивированное причастие обозначает любого человека, для которого характерно отсутствие любви к Иисусу. Конструкция «кто не любит» естественно передаёт обобщённый смысл по-русски.
- source_word: τοὺς λόγους μου
  choice: моих слов
  rationale: Множественное число сохранено, чтобы передать отдельные высказывания и наставления Иисуса и не смешивать их с последующим единственным числом λόγος.
- source_word: τηρεῖ
  choice: соблюдает
  rationale: В данном контексте τηρέω означает не просто хранить, а верно следовать словам Иисуса. «Соблюдает» сохраняет оттенки послушания и постоянной верности, не сводя выражение к одному лишь исполнению приказа.
- source_word: ὁ λόγος ὃν ἀκούετε
  choice: слово, которое вы слышите
  rationale: Единственное число λόγος передано буквально как «слово»; здесь оно может собирательно обозначать всё возвещаемое Иисусом учение. Добавление «от меня» не требуется, поскольку его нет в греческом тексте.
- source_word: οὐκ ἔστιν ἐμὸς
  choice: не моё
  rationale: Краткая именная конструкция непосредственно передаёт греческое отрицание принадлежности, не уточняя сверх текста, идёт ли речь прежде всего об источнике или владении.
- source_word: ἀλλὰ τοῦ πέμψαντός με πατρός
  choice: а пославшего меня Отца
  rationale: Русская родительная конструкция естественно восполняет пропущенное сказуемое «[слово] Отца» и сохраняет параллель с «не моё». Причастный оборот точно определяет Отца как пославшего Иисуса.
theological_decisions:
- issue: Соотношение слова Иисуса и слова Отца
  choice: «не моё, а пославшего меня Отца»
  alternative: «не от меня, а от пославшего меня Отца»
  rationale: Выбранная формулировка сохраняет текстовое напряжение между различием Иисуса и Отца и единством возвещаемого слова. Она не ограничивает родительный падеж только значением происхождения и не создаёт добавочного богословского пояснения.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Местоимения, относящиеся к Иисусу, даны со строчной буквы по общим нормам современного русского текста; титул «Отец» — с прописной. Союз «А» естественно вводит второе, поясняющее высказывание.
