  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸂Τοσούτῳ χρόνῳ⸃ μεθ’ ὑμῶν εἰμι καὶ οὐκ ἔγνωκάς με, Φίλιππε; ὁ ἑωρακὼς ἐμὲ ἑώρακεν τὸν πατέρα· ⸀πῶς σὺ λέγεις· Δεῖξον ἡμῖν τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/009.yaml
  text: Jesus said to him[a], “Have I been with you for so long, and you still have not known me, Philip? The one who has seen me has seen the Father. How can you say, ‘Show us the Father’?”
translation:
  language: ru
  text: 'Иисус сказал ему: «Я так долго с вами[a], а ты всё ещё не знаешь Меня, Филипп? Кто видел Меня, тот видел Отца. Как же ты говоришь: „Покажи нам Отца“?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я столько времени с вами».'
    reason: Лексико-стилистический вариант передачи Τοσούτῳ χρόνῳ.
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Иисус сказал ему
  rationale: Греческое историческое настоящее λέγει в современном русском повествовании естественно передаётся прошедшим временем «сказал»; адресат выражен местоимением «ему».
- source_word: Τοσούτῳ χρόνῳ μεθ’ ὑμῶν εἰμι
  choice: Я столько времени с вами
  rationale: Дательный оборот обозначает продолжительность, а настоящее εἰμι — пребывание, продолжающееся до момента речи. Русская безглагольная конструкция естественна и сохраняет эту длительность.
- source_word: καὶ οὐκ ἔγνωκάς με
  choice: а ты так и не узнал Меня
  rationale: Совершенный вид «не узнал» вместе с «так и» передаёт итоговое состояние греческого перфекта и укоризненную силу вопроса, не сводя γινώσκω к простому обладанию сведениями.
- source_word: Φίλιππε
  choice: Филипп
  rationale: Нормативная русская форма имени в обращении; отдельной формы звательного падежа в современном русском нет.
- source_word: ὁ ἑωρακὼς ἐμὲ
  choice: Кто видел Меня
  rationale: Субстантивированное причастие передано естественной обобщающей конструкцией «кто»; прошедшее несовершенного вида сохраняет смысл пережитого опыта видения без искусственной моментальности.
- source_word: ἑώρακεν τὸν πατέρα
  choice: тот видел Отца
  rationale: Соотносительное «тот» делает русскую фразу ясной, а «Отца» сохраняет именно определённое именование из греческого текста без добавления притяжательного местоимения.
- source_word: πῶς σὺ λέγεις
  choice: Как же ты говоришь
  rationale: «Как же» передаёт риторическое недоумение πῶς, а явное «ты» сохраняет эмфазу греческого местоимения σὺ.
- source_word: Δεῖξον ἡμῖν τὸν πατέρα
  choice: Покажи нам Отца
  rationale: Прямой императив «покажи» точно и естественно передаёт Δεῖξον и повторяет просьбу Филиппа без толковательного расширения.
theological_decisions:
- issue: Связь между видением Иисуса и видением Отца
  choice: Кто видел Меня, тот видел Отца
  alternative: Кто видел Меня, тот видел, каков Отец; либо развёрнутая формулировка в категориях позднейших вероучительных определений
  rationale: Прямое и сильное христологическое утверждение сохранено без ослабления до простого сходства и без внесения в перевод дополнительных онтологических формулировок, которых нет в стихе.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Божественные личные местоимения и именование «Отец» написаны с прописной буквы. Формулировки естественны для обычного читателя, при этом риторический укор и богословская напряжённость исходного текста сохранены.
