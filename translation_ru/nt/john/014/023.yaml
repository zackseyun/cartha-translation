reference: John 14:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἐάν τις ἀγαπᾷ με τὸν λόγον μου τηρήσει, καὶ ὁ πατήρ μου ἀγαπήσει αὐτόν, καὶ πρὸς αὐτὸν ἐλευσόμεθα καὶ μονὴν παρ’ αὐτῷ ⸀ποιησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/023.yaml
  text: Jesus answered and said to him[a], “If anyone loves me, he will keep my word, and my Father will love him[b], and we will come to him and make our dwelling with him.”
translation:
  language: ru
  text: 'Иисус сказал ему в ответ: «Кто любит Меня, тот будет хранить Моё слово[a]. И Мой Отец полюбит его, и Мы придём к нему и поселимся у него[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моё учение»; «то, что Я говорю».'
    reason: Лόγος здесь может обозначать слово, весть или учение Иисуса.
  - marker: b
    text: 'Букв.: «устроим у него обитель»; также возможно: «сделаем у него Своё жилище».'
    reason: Существительное μονή означает место пребывания или жилище, а сочетание с ποιέω буквально имеет форму «сделать жилище».
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Иисус сказал ему в ответ
  rationale: Естественная для современного русского передача греческой повествовательной формулы «ответил и сказал ему» без утраты значения ответа.
- source_word: Ἐάν τις
  choice: Кто
  rationale: В русском обобщённое условное «кто... тот» естественно передаёт открытое и неопределённое значение конструкции «если кто-либо».
- source_word: ἀγαπᾷ με
  choice: любит Меня
  rationale: Прямая и контекстуально точная передача глагола ἀγαπάω; местоимение сохраняет объект любви.
- source_word: τὸν λόγον μου
  choice: Моё слово
  rationale: Сохраняет характерную для Иоанна лексику λόγος и её возможную богословскую многозначность; здесь слово означает сказанное Иисусом, Его весть или учение.
- source_word: τηρήσει
  choice: будет хранить
  rationale: '«Хранить» сохраняет широкий диапазон τηρέω: беречь, соблюдать и исполнять, не сводя смысл исключительно к формальному повиновению.'
- source_word: ὁ πατήρ μου ἀγαπήσει αὐτόν
  choice: Мой Отец полюбит его
  rationale: Точно сохраняет будущее время, личное обозначение Отца и единичное местоименное соответствие.
- source_word: πρὸς αὐτὸν ἐλευσόμεθα
  choice: Мы придём к нему
  rationale: Сохраняет первое лицо множественного числа и выраженное πρός движение к человеку.
- source_word: μονὴν παρ’ αὐτῷ ποιησόμεθα
  choice: поселимся у него
  rationale: Естественный русский эквивалент идиомы «устроим обитель у него», передающий постоянное пребывание и совместное присутствие Отца и Сына.
theological_decisions:
- issue: Множественное число в «Мы придём... и поселимся»
  choice: Сохранено явное «Мы», относящееся к Иисусу и Отцу, и их совместное действие.
  alternative: Стилистически сгладить множественное число или передать безлично.
  rationale: Формы ἐλευσόμεθα и ποιησόμεθα прямо выражают первое лицо множественного числа. Перевод не должен скрывать ни различение Иисуса и Отца, ни единство их действия.
- issue: Связь любви и хранения слова Иисуса
  choice: Сохранена условно-обобщённая последовательность текста без пояснения характера этой связи.
  alternative: Истолковать хранение слова как основание, доказательство или следствие любви.
  rationale: Стих утверждает связь, но сам по себе не формулирует её в систематических категориях; перевод сохраняет эту богословскую напряжённость.
- issue: Обобщённое τις и последующее αὐτόν
  choice: «Кто... тот» с последующим мужским местоимением «его».
  alternative: «Если кто-нибудь» либо перестройка фразы во множественном числе для гендерной нейтральности.
  rationale: Русская конструкция естественно выражает обобщённый охват, а «его» сохраняет грамматическое единственное число исходного текста и не ограничивает высказывание мужчинами.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Конструкция «сказал ему в ответ» естественнее буквального «ответил и сказал». Заглавные буквы в местоимениях, относящихся к Иисусу, Отцу и их совместному действию, применены как издательская норма религиозного русского текста; они не выражены грамматически в греческой рукописной традиции.
