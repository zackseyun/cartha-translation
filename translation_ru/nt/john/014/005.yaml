  yaml_path: translation/nt/john/014/005.yaml
  text: Thomas said to him[a], “Lord, we do not know where you are going[b]. How can we know the way?”
translation:
  language: ru
  text: 'Фома сказал Ему: «Господи, мы не знаем, куда Ты идёшь. Как мы можем знать путь?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте один и тот же глагол «знать» употреблён дважды: «мы не знаем» и «знать путь».'
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτῷ Θωμᾶς
  choice: Фома сказал Ему
  rationale: Историческое настоящее λέγει естественно передано русским прошедшим временем в повествовании; местоимение сохраняет адресацию к Иисусу.
- source_word: Κύριε
  choice: Господи
  rationale: Традиционная и естественная русская звательная форма сохраняет как почтительное обращение, так и возможную более глубокую христологическую значимость.
- source_word: οὐκ οἴδαμεν
  choice: мы не знаем
  rationale: Прямо передаёт значение знания и позволяет сохранить повтор того же греческого глагола далее в стихе.
- source_word: ποῦ ὑπάγεις
  choice: куда Ты идёшь
  rationale: Нейтрально и естественно передаёт направление движения, не раскрывая преждевременно богословский смысл ухода Иисуса.
- source_word: πῶς δυνάμεθα ... εἰδέναι
  choice: Как же нам знать
  rationale: Естественная русская вопросительная конструкция передаёт невозможность или затруднение, выраженное δυνάμεθα; частица «же» обозначает логическую связь с предыдущим признанием, не добавляя нового содержания.
- source_word: τὴν ὁδὸν
  choice: путь
  rationale: Сохраняет буквальный и тематический смысл ὁδός и связь со следующим стихом, не истолковывая её заранее.
theological_decisions:
- issue: Богословский оттенок ὑπάγεις в Евангелии от Иоанна
  choice: куда Ты идёшь
  alternative: куда Ты уходишь
  rationale: Нейтральная формулировка сохраняет неведение Фомы и не вводит в его слова явного толкования ухода Иисуса как возвращения к Отцу.
- issue: Связь «пути» с самооткровением Иисуса в следующем стихе
  choice: путь
  alternative: дорога
  rationale: «Путь» сохраняет смысловую напряжённость и тематическую связь с Ин. 14:6, не превращая настоящий стих в преждевременное толкование.
translation_notes:
  register: Современный литературный русский язык с традиционно-библейским, но понятным обращением «Господи». Прописные местоимения в обращении к Иисусу соответствуют принятой русской библейской издательской норме. Повтор «знать» намеренно сохранён.
