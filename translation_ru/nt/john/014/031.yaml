  text: ἀλλ’ ἵνα γνῷ ὁ κόσμος ὅτι ἀγαπῶ τὸν πατέρα, καὶ καθὼς ⸀ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ. Ἐγείρεσθε, ἄγωμεν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/031.yaml
  text: But so that the world may know that I love the Father[a], I do just as the Father has commanded me. Rise, let us go from here.
translation:
  language: ru
  text: Но чтобы мир узнал, что Я люблю Отца, Я поступаю так, как повелел Мне Отец.[a] Вставайте, пойдём отсюда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…как повелел Мне Отец, так Я и поступаю».'
    reason: Возможный более явный перевод парной конструкции καθώς… οὕτως («как… так»).
lexical_decisions:
- source_word: ἀλλ’
  choice: Но
  rationale: Сохраняет противительный переход от предыдущего высказывания и естественно связывает стих с контекстом.
- source_word: ἵνα γνῷ
  choice: чтобы мир узнал
  rationale: ἵνα с аористом сослагательного наклонения выражает цель; совершенный вид «узнал» естественно передаёт достижение знания как предполагаемый результат.
- source_word: ὁ κόσμος
  choice: мир
  rationale: Сохраняет характерное для Иоанна обозначение человеческого мира без поясняющего расширения.
- source_word: ἀγαπῶ τὸν πατέρα
  choice: Я люблю Отца
  rationale: Передаёт настоящее время глагола и сохраняет титул «Отец» без отсутствующего в греческом притяжательного местоимения.
- source_word: καθὼς ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ
  choice: Я поступаю так, как повелел Мне Отец
  rationale: Парная конструкция καθώς… οὕτως передаётся естественным русским соответствием «так, как»; «повелел» сохраняет силу данного Отцом поручения или приказания, а «поступаю» подходит для ποιῶ в данном контексте.
- source_word: Ἐγείρεσθε
  choice: Вставайте
  rationale: Форма повелительного наклонения во множественном числе обращена к ученикам; «вставайте» современно и точно для призыва подняться.
- source_word: ἄγωμεν ἐντεῦθεν
  choice: пойдём отсюда
  rationale: Побудительное сослагательное первого лица множественного числа естественно передаётся формой «пойдём», а ἐντεῦθεν — наречием «отсюда».
theological_decisions:
- issue: Отношение любви и послушания Сына Отцу
  choice: люблю Отца… поступаю так, как повелел Мне Отец
  alternative: люблю Моего Отца… поступаю так, как наставил Меня Отец
  rationale: Перевод не добавляет притяжательного местоимения и не смягчает значение ἐντέλλομαι по богословским соображениям, сохраняя одновременно любовь и послушание в отношениях Сына с Отцом.
- issue: Синтаксическая связь целевого оборота ἵνα и οὕτως ποιῶ
  choice: действие Иисуса представлено как средство, благодаря которому мир узнаёт о Его любви к Отцу
  alternative: слова о поступке Иисуса включены в содержание того, что должен узнать мир
  rationale: Основной текст следует естественно возможному прочтению, отражённому в консультационном английском слое, но греческая пунктуация и координация допускают иное членение; оно сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, но понятным регистром. Заглавные местоимения «Я», «Мне» употреблены в прямой речи Иисуса согласно принятой русской библейской издательской традиции; лексика избегает архаизмов вроде «восстаньте» и «идёмте».
