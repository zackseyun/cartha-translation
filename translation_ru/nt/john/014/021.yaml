source:
  edition: SBLGNT
  text: ὁ ἔχων τὰς ἐντολάς μου καὶ τηρῶν αὐτὰς ἐκεῖνός ἐστιν ὁ ἀγαπῶν με· ὁ δὲ ἀγαπῶν με ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου, κἀγὼ ἀγαπήσω αὐτὸν καὶ ἐμφανίσω αὐτῷ ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/021.yaml
  text: The one who has my commandments and keeps them is the one who loves me[a]. And the one who loves me will be loved by my Father[c][b], and I will love him and reveal myself to him.
translation:
  language: ru
  text: Тот, кто имеет Мои заповеди и соблюдает их, любит Меня. А кто любит Меня, того будет любить Мой Отец; и Я буду любить его и явлю ему Себя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст употребляет формы мужского рода единственного числа в обобщающем смысле; сказанное относится к любому человеку, который любит Иисуса и соблюдает Его заповеди. «Явлю ему Себя» можно также перевести: «откроюсь ему» или «покажу ему Себя».'
    reason: Уточнение представительского значения грамматического рода и смыслового диапазона ἐμφανίσω.
lexical_decisions:
- source_word: ὁ ἔχων
  choice: У кого есть
  rationale: Субстантивированное причастие обозначает всякого человека, отвечающего этому описанию. Русская конструкция «У кого есть… тот…» естественно передаёт единичную форму и обобщающее значение.
- source_word: τὰς ἐντολάς μου
  choice: Мои заповеди
  rationale: «Заповеди» сохраняет властный характер слов Иисуса и соответствует устойчивому употреблению ἐντολή у Иоанна.
- source_word: τηρῶν
  choice: соблюдает
  rationale: τηρέω здесь означает хранить верность заповедям и исполнять их; «соблюдает» передаёт это шире и естественнее, чем одно лишь «повинуется».
- source_word: ἐκεῖνός ἐστιν ὁ ἀγαπῶν με
  choice: тот любит Меня
  rationale: Соотносительная конструкция «у кого… тот…» сохраняет подчёркнутое отождествление любящего Иисуса с тем, кто имеет и соблюдает Его заповеди.
- source_word: ὁ δὲ ἀγαπῶν με
  choice: А кто любит Меня
  rationale: δέ обозначает переход к следующему утверждению и не требует сильного противопоставления; русское «А» естественно связывает части стиха.
- source_word: ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου
  choice: того будет любить Мой Отец
  rationale: Активная русская конструкция естественно передаёт греческий будущий пассив, не меняя участника или направленность любви.
- source_word: κἀγὼ ἀγαπήσω αὐτόν
  choice: и Я буду любить его
  rationale: Сохраняются добавочное значение κἀγώ, будущее время и повтор корня ἀγαπάω.
- source_word: ἐμφανίσω αὐτῷ ἐμαυτόν
  choice: явлю ему Себя
  rationale: «Явлю Себя» передаёт личное самораскрытие Иисуса и допускаемую глаголом идею проявления, не сводя её только к физической видимости.
theological_decisions:
- issue: Связь любви к Иисусу и соблюдения Его заповедей
  choice: Соблюдение заповедей определяет того, кто любит Иисуса, без добавления причинной или заслуживающей схемы.
  alternative: Соблюдение заповедей доказывает любовь или заслуживает любовь Бога.
  rationale: Греческий текст устанавливает отождествляющую связь, но прямо не говорит ни о доказательстве, ни о заслуге; перевод сохраняет эту напряжённость.
- issue: Любовь Отца и Иисуса
  choice: 'Будущие формы переданы прямо: «будет любить» и «буду любить».'
  alternative: Передать как награду за послушание либо сгладить будущее время настоящим.
  rationale: Текст связывает эти обещания с любящим Иисуса человеком, но не объясняет здесь природу или основание божественной любви.
- issue: Характер самоявления Иисуса
  choice: «явлю ему Себя»
  alternative: «покажу ему Себя» или «откроюсь ему»
  rationale: Выбранная формулировка сохраняет возможность как проявления, так и личного самораскрытия, не ограничивая смысл исключительно видимым явлением.
- issue: Обобщающее значение мужского единственного числа
  choice: 'Сохранено единственное число: «того… его… ему», с пояснением в сноске.'
  alternative: Множественное число или повтор «этого человека».
  rationale: Греческие формы стоят в мужском единственном числе, но имеют обобщающее, представительское значение; русский текст сохраняет форму источника, а сноска предупреждает ошибочное ограничение только мужчинами.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Соотносительная конструкция «У кого… тот…» звучит естественно и сохраняет логику греческого оригинала. Заглавные буквы в местоимениях, относящихся к Иисусу, использованы в соответствии с распространённой русской библейской издательской традицией.
