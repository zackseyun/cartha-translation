  yaml_path: translation/nt/john/014/030.yaml
  text: I will no longer speak much with you[a], for the ruler of the world is coming[b]. And he has nothing in me.
translation:
  language: ru
  text: Больше Я не буду много говорить с вами, потому что идёт правитель мира[a]. Он не имеет во Мне ничего[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «правитель мира». В некоторых переводах: «правитель этого мира» — по сходным выражениям у Иоанна; однако слова «этого» в греческом тексте здесь нет.'
    reason: lexical_alternative
  - marker: b
    text: 'Или по смыслу: «он не имеет на Меня никаких прав», «он не имеет надо Мной власти» или «он не найдёт во Мне никакой опоры». Буквально: «он не имеет во Мне ничего».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκέτι πολλὰ λαλήσω
  choice: Я уже недолго буду говорить
  rationale: Передаёт прекращение продолжительной речи с этого момента; по-русски звучит естественнее, чем буквальное «уже не много буду говорить».
- source_word: μεθ’ ὑμῶν
  choice: с вами
  rationale: Передаёт общение Иисуса с учениками.
- source_word: ἔρχεται
  choice: приближается
  rationale: Настоящее время имеет значение близкого наступления; «приближается» ясно выражает неизбежность и близость прихода.
- source_word: ὁ τοῦ κόσμου ἄρχων
  choice: правитель мира
  rationale: Сохраняет явный греческий титул без добавления отсутствующего в тексте указательного слова «этого» и без замены титула именем «сатана».
- source_word: ἐν ἐμοὶ οὐκ ἔχει οὐδέν
  choice: Он ничего не имеет во Мне
  rationale: Сохраняет краткую и многозначную греческую формулировку, не сужая её до одного толкования — права, власти или опоры.
theological_decisions:
- issue: Кого обозначает «правитель мира»
  choice: Сохранить титул без прямого отождествления в основном тексте
  alternative: Перевести как «сатана» или «правитель этого мира»
  rationale: В контексте Иоанна речь подразумевает сатану, однако греческий текст использует титул и не содержит слова «этого».
- issue: Смысл выражения «ничего не имеет во Мне»
  choice: Сохранить буквальный образ
  alternative: «не имеет надо Мной власти», «не имеет на Меня прав» или «не найдёт во Мне опоры»
  rationale: Греческая идиома допускает несколько взаимосвязанных оттенков. Буквальная передача сохраняет богословскую ёмкость и напряжение оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавное «Мне» следует принятой русской традиции местоимений, относящихся к Иисусу. Формулировка сохраняет образность и неоднозначность заключительной греческой идиомы.
