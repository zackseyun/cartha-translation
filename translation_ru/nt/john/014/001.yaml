  text: Μὴ ταρασσέσθω ὑμῶν ἡ καρδία· πιστεύετε εἰς τὸν θεόν, καὶ εἰς ἐμὲ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/001.yaml
  text: Do not let your heart be troubled[a]. Believe in God[b]; believe also in me.
translation:
  language: ru
  text: Пусть сердце ваше не тревожится. Верьте в Бога и в Меня верьте[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вы верите в Бога — верьте и в Меня». Греческая форма πιστεύετε может означать как «вы верите», так и «верьте».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Доверьтесь Богу и Мне доверьтесь». Глагол может обозначать не только веру, но и доверие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ ταρασσέσθω
  choice: Пусть ... не тревожится
  rationale: Форма настоящего времени страдательного императива третьего лица с μή передана как естественное русское запрещение; «тревожится» сохраняет широкий смысл внутреннего смятения, не сужая его до страха или беспокойства.
- source_word: ὑμῶν ἡ καρδία
  choice: сердце ваше
  rationale: 'Сохранено греческое единственное число при обращении к нескольким ученикам: сердце представлено собирательно. Такой оборот естественен в русском возвышенном, но понятном повествовании.'
- source_word: πιστεύετε
  choice: верьте
  rationale: «Верить в» непосредственно передаёт πιστεύω с εἰς и допускает как признание истинности, так и личное доверие; возможный оттенок «доверяйте» отмечен в сноске.
- source_word: εἰς τὸν θεόν
  choice: в Бога
  rationale: При πιστεύω предлог εἰς выражает направленность веры и доверия; по-русски нормативно «верить в Бога».
- source_word: καὶ εἰς ἐμὲ πιστεύετε
  choice: и в Меня верьте
  rationale: Сохранены присоединительное καί, повтор глагола и параллель между Богом и Иисусом; русский порядок слов естественно выделяет «в Меня».
theological_decisions:
- issue: Изъявительное или повелительное значение двух форм πιστεύετε
  choice: 'Обе формы переданы как повелительные: «Верьте в Бога и в Меня верьте».'
  alternative: «Вы верите в Бога — верьте и в Меня»; грамматически возможны также другие сочетания изъявительного и повелительного наклонений.
  rationale: Формы второго лица множественного числа настоящего времени изъявительного и повелительного наклонений совпадают. Контекст утешения и начальное запрещение поддерживают ряд побуждений, однако реальная грамматическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Инверсия «сердце ваше» и повтор «верьте» сохраняют ритм и параллелизм оригинала, оставаясь понятными современному читателю.
