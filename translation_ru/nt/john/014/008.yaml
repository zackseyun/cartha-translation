  text: Λέγει αὐτῷ Φίλιππος· Κύριε, δεῖξον ἡμῖν τὸν πατέρα, καὶ ἀρκεῖ ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/008.yaml
  text: Philip said to him[a], “Lord, show us the Father, and that is enough for us.”
translation:
  language: ru
  text: 'Филипп говорит Ему: «Господи, покажи нам Отца, и нам этого достаточно».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господин, покажи нам Отца, и нам этого достаточно».'
    reason: κύριε может употребляться как уважительное обращение «господин», хотя в данном обращении к Иисусу перевод «Господи» лучше сохраняет контекстуальный вес слова.
lexical_decisions:
- source_word: Λέγει
  choice: говорит
  rationale: 'Историческое настоящее сохранено: в русском повествовании оно звучит естественно и передаёт живость греческого изложения.'
- source_word: αὐτῷ
  choice: Ему
  rationale: Дательный падеж обозначает адресата речи; местоимение сохраняет явную отсылку к Иисусу.
- source_word: Φίλιππος
  choice: Филипп
  rationale: Традиционная русская форма личного имени.
- source_word: Κύριε
  choice: Господи
  rationale: Естественная русская звательная форма обращения к Иисусу; сохраняет уважительный и христологически весомый оттенок κύριος.
- source_word: δεῖξον ἡμῖν
  choice: покажи нам
  rationale: Прямо и естественно передаёт аористный императив и дательный местоимения без усиления до «открой» или «яви».
- source_word: τὸν πατέρα
  choice: Отца
  rationale: В контексте Евангелия от Иоанна речь идёт о Боге Отце; прописная буква соответствует современному русскому оформлению божественного именования.
- source_word: καὶ ἀρκεῖ ἡμῖν
  choice: и этого нам будет достаточно
  rationale: 'Передаёт ожидаемый результат просьбы естественным русским оборотом. Будущее время в переводе обусловлено смысловой последовательностью: если Отец будет показан, этого окажется достаточно.'
theological_decisions:
- issue: Обращение κύριε к Иисусу
  choice: Господи
  alternative: Господин / Учитель
  rationale: «Господи» сохраняет обычное для данного контекста обращение к Иисусу и его возможный христологический вес, не сводя слово к одной лишь вежливой форме.
- issue: Смысл достаточности в ἀρκεῖ ἡμῖν
  choice: этого нам будет достаточно
  alternative: этого нам достаточно
  rationale: Русское будущее естественно выражает достаточность как ожидаемое следствие исполнения просьбы, не добавляя идеи полного духовного удовлетворения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранено греческое историческое настоящее; тире естественно подчёркивает ожидаемый итог просьбы.
