  source_fidelity: Греческое ἀρκεῖ стоит в настоящем времени («достаточно», «довольно»). Переводное будущее «будет достаточно» понятно по смыслу просьбы, но вносит временной оттенок, которого прямо нет в исходном тексте. Историческое настоящее Λέγει можно естественно сохранить по-русски.
  naturalness: «Филипп говорит Ему» и прямая речь звучат литературно и ясно. Более прямое «и нам этого достаточно» естественно передаёт заключительную реплику без добавленного будущего значения.
  terminology: «Господи» для κύριε и «Отца» в данном иоанновом контексте уместны. Альтернатива «Господин» в сноске корректно отмечает возможное менее нагруженное значение обращения, не навязывая его как основной перевод.
