  text: And now I have told you before it happens[c][b][a], so that when it happens you may believe.
translation:
  language: ru
  text: И теперь Я уже сказал вам об этом, прежде чем это произойдёт, чтобы, когда это произойдёт, вы поверили.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прежде чем это сбудется»; «когда это сбудется». Слово, переведённое «поверили», может также передавать смысл доверия; сама форма глагола не уточняет, идёт ли речь о возникновении веры или о её укреплении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: И теперь
  rationale: Сохраняет соединительный καί и временное νῦν, естественно продолжая предшествующую речь.
- source_word: εἴρηκα ὑμῖν
  choice: Я сказал вам об этом
  rationale: Перфект εἴρηκα указывает на уже совершённое высказывание, значимое в настоящем. «Сказал вам об этом» звучит по-русски естественно; «об этом» восполняет подразумеваемое содержание предсказания.
- source_word: πρὶν γενέσθαι
  choice: прежде, чем это произойдёт
  rationale: Передаёт временное значение πρίν с инфинитивом; подразумеваемое событие выражено местоимением «это».
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно и точно передаёт целевое значение союза.
- source_word: ὅταν γένηται
  choice: когда это произойдёт
  rationale: Передаёт будущее событие, выраженное ὅταν с сослагательным наклонением, и сохраняет повтор глагола γίνομαι.
- source_word: πιστεύσητε
  choice: вы поверили
  rationale: Обычный для Иоанна русский эквивалент πιστεύω; форма после ἵνα естественно передаётся прошедшим временем совершенного вида после «чтобы», не уточняя, идёт ли речь о возникновении или укреплении веры.
theological_decisions:
- issue: Смысл πιστεύσητε в контексте
  choice: вы поверили
  alternative: вы укрепились в вере / вы доверились
  rationale: Греческий текст допускает как возникновение, так и укрепление веры вследствие исполнения предсказания. Нейтральное «поверили» сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным синтаксисом. Заглавная буква в местоимении «Я» сохраняет традиционное почтительное оформление речи Иисуса. Повтор «произойдёт» намеренно отражает повтор γίνομαι в оригинале.
