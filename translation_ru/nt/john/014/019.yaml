source:
  edition: SBLGNT
  text: ἔτι μικρὸν καὶ ὁ κόσμος με οὐκέτι θεωρεῖ, ὑμεῖς δὲ θεωρεῖτέ με, ὅτι ἐγὼ ζῶ καὶ ὑμεῖς ⸀ζήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/019.yaml
  text: A little while longer[a], and the world will no longer see me, but you will see me. Because I live[b], you also will live.
translation:
  language: ru
  text: Ещё немного времени — и мир больше не будет видеть Меня[a], а вы будете видеть Меня. Ведь Я живу, и вы тоже будете жить[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол в обоих случаях может означать не только просто «видеть», но также «созерцать» или «наблюдать».
    reason: lexical_alternative
  - marker: b
    text: Слова «вы тоже будете жить» могут подразумевать участие учеников в воскресшей жизни Иисуса, духовную жизнь в единении с Ним или оба смысла.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι μικρὸν
  choice: Ещё немного времени
  rationale: Естественно передаёт краткий оставшийся промежуток времени и сохраняет направленность к близкой перемене.
- source_word: ὁ κόσμος
  choice: мир
  rationale: Сохраняет характерное для Иоанна широкое и потенциально многозначное обозначение мира людей, не уточняя его как «мирскую систему» или отдельную группу.
- source_word: θεωρεῖ / θεωρεῖτέ
  choice: не будет видеть / будете видеть
  rationale: Глагол θεωρέω может подразумевать не только мимолётный взгляд, но простое «видеть» по-русски естественно и не решает заранее, идёт ли речь о телесном видении воскресшего Иисуса, духовном восприятии или обоих смыслах. Будущее время в русском выражает близкую перемену, заданную контекстом.
- source_word: οὐκέτι
  choice: уже не
  rationale: Кратко и естественно передаёт прекращение видения с близкого момента.
- source_word: δὲ
  choice: а
  rationale: Русский противительный союз ясно противопоставляет мир ученикам без излишне резкого оттенка.
- source_word: ὅτι
  choice: Поскольку
  rationale: Передаёт наиболее вероятную причинную связь между жизнью Иисуса и будущей жизнью учеников, сохраняя плавность русского текста.
- source_word: ἐγὼ ζῶ
  choice: Я живу
  rationale: Сохраняет настоящее время и лаконичную богословскую насыщенность греческого выражения.
- source_word: καὶ ὑμεῖς ζήσετε
  choice: будете жить и вы
  rationale: Явно передаёт будущее время и смысл καί — участие учеников в жизни, связанной с жизнью Иисуса, не сужая понятие жизни до одного аспекта.
theological_decisions:
- issue: Смысл того, что ученики будут видеть Иисуса
  choice: Оставить общее «будете видеть Меня»
  alternative: Уточнить как телесное видение Иисуса после воскресения либо как духовное восприятие верой
  rationale: Греческий текст допускает воскресные явления, духовное восприятие воскресшего Иисуса и, возможно, совмещение этих смыслов; перевод не должен устранять эту напряжённую многозначность.
- issue: Смысл слов «будете жить и вы»
  choice: Передать широко, не уточняя вид жизни
  alternative: Ограничить смысл воскресением тела, духовной жизнью в единении с Иисусом либо вечной жизнью
  rationale: Будущее ζήσετε богословски ёмко и может охватывать как участие в новой жизни, так и будущее воскресение; широкая формулировка сохраняет объём оригинала.
- issue: Связь, выраженная ὅτι
  choice: 'Передать причинно: «Поскольку Я живу»'
  alternative: Передать пояснительно через «ведь» или понимать ὅτι как вводящее содержание
  rationale: 'В данном контексте причинное прочтение наиболее естественно: жизнь учеников основывается на жизни Иисуса. Оно не требует дальнейшего догматического уточнения характера этой связи.'
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и возвышенным звучанием. Инверсия «будете жить и вы» естественно подчёркивает соответствие καί и связь жизни учеников с жизнью Иисуса. Заглавные буквы в местоимениях, относящихся к Иисусу, соответствуют распространённой русской библейской издательской традиции.
