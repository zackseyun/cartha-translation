  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ⸂γνώσεσθε ὑμεῖς⸃ ὅτι ἐγὼ ἐν τῷ πατρί μου καὶ ὑμεῖς ἐν ἐμοὶ κἀγὼ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/020.yaml
  text: On that day you will know that I am in my Father[a], and you are in me[b], and I am in you.
translation:
  language: ru
  text: В тот день вы узнаете, что Я в Моём Отце, и вы во Мне, и Я в вас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: В тот день
  rationale: Предложное сочетание имеет временное значение. «В тот день» естественно для современного русского языка и сохраняет указательную определённость ἐκείνῃ.
- source_word: γνώσεσθε
  choice: вы узнаете
  rationale: Будущая форма γινώσκω здесь указывает на грядущее осознание или обретение знания. «Узнаете» естественно передаёт наступление понимания, не подчёркивая чрезмерно длительный процесс.
- source_word: ὑμεῖς
  choice: вы
  rationale: Явно выраженное местоимение имеет оттенок акцента; русское «вы» сохранено в тексте, но добавление «сами» было бы излишне сильным.
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание того, что ученики узнают, а не причинное придаточное.
- source_word: ἐγὼ ἐν τῷ πατρί μου
  choice: Я в Моём Отце
  rationale: Повторяющаяся конструкция с ἐν важна для темы взаимного пребывания у Иоанна. Буквальное «в» сохраняет образность и многозначность, не сводя её к пояснительному «в единстве с».
- source_word: πατρί μου
  choice: Моём Отце
  rationale: Естественно передаёт притяжательную конструкцию и сохраняет выраженное сыновнее отношение Иисуса к Отцу.
- source_word: καὶ ὑμεῖς ἐν ἐμοὶ
  choice: а вы во Мне
  rationale: Связка подразумевается и естественно опускается в русском настоящем времени. «Во Мне» сохраняет тот же предлог и тему взаимного пребывания; союз «а» естественно обозначает переход к ученикам, не создавая смыслового противопоставления.
- source_word: κἀγὼ ἐν ὑμῖν
  choice: и Я в вас
  rationale: κἀγώ означает «и Я». Повтор предлога «в» сохранён, чтобы передать взаимность пребывания без интерпретирующего расширения.
theological_decisions:
- issue: Иоаннова лексика взаимного пребывания (ἐν ... ἐν ... ἐν)
  choice: 'Последовательно сохранить предлог «в»: «Я в Моём Отце, а вы во Мне, и Я в вас»'
  alternative: «Я един с Моим Отцом, вы соединены со Мной, а Я — с вами»
  rationale: Исходный текст выражает многослойную взаимосвязь посредством повторения ἐν. Буквальное «в» сохраняет богословское напряжение и не сводит смысл исключительно к сущностному единству, общению или духовному союзу.
- issue: Отношение Иисуса к Отцу
  choice: «Я в Моём Отце» без поясняющего расширения
  alternative: «Я един по сущности с Моим Отцом» или «Я пребываю с Моим Отцом»
  rationale: Такой перевод не ослабляет христологическую силу высказывания, но и не вносит в стих более позднюю догматическую терминологию, которой нет в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с ясным, возвышенным библейским регистром. Прописные буквы в местоимениях «Я», «Мне» при отнесении к Иисусу и «Моём» при отнесении к Отцу соответствуют принятой русской библейской издательской традиции. Пунктуация сохраняет трёхчастный ритм исходной фразы.
