id: JHN.14.17
reference: John 14:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τὸ πνεῦμα τῆς ἀληθείας, ὃ ὁ κόσμος οὐ δύναται λαβεῖν, ὅτι οὐ θεωρεῖ αὐτὸ οὐδὲ ⸀γινώσκει· ⸀ὑμεῖς γινώσκετε αὐτό, ὅτι παρ’ ὑμῖν μένει καὶ ἐν ὑμῖν ⸀ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/017.yaml
  text: the Spirit of truth[a], whom the world is not able to receive, because it neither sees him nor knows him. You know him[b], because he remains with you and will be in you.
translation:
  language: ru
  text: Духа истины[a], Которого мир не может принять, потому что не видит Его и не знает. Вы знаете Его, потому что Он пребывает с вами и будет в вас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом слово «дух» (πνεῦμα) среднего рода, и согласованные с ним формы также стоят в среднем роде; однако здесь речь идёт о личностном действующем субъекте. В русском слово «Дух» мужского рода.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «среди вас». Греческое выражение допускает собирательное понимание, однако «в вас» точнее сохраняет различие с предшествующим «с вами».'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: Духа истины
  rationale: Сохраняет греческую родительную конструкцию и устойчивое для Иоанна выражение; прописная буква указывает на Святого Духа в данном контексте.
- source_word: ὃ / αὐτό
  choice: Которого / Его
  rationale: Хотя πνεῦμα в греческом среднего рода, речь идёт о личностном референте; в русском слово «Дух» мужского рода, поэтому естественны личные формы мужского рода.
- source_word: ὁ κόσμος
  choice: мир
  rationale: Сохраняет широкое и богословски насыщенное значение иоанновского κόσμος, не сужая его до «человечества» или «мирской системы».
- source_word: οὐ δύναται λαβεῖν
  choice: не может принять
  rationale: Передаёт модальное значение δύναται и обычный смысл λαμβάνω, не заменяя принятие более интерпретирующим «признать».
- source_word: θεωρεῖ
  choice: видит
  rationale: Естественное современное соответствие, сохраняющее непосредственный смысл глагола без излишнего уточнения как «воспринимает».
- source_word: γινώσκει / γινώσκετε
  choice: знает / знаете
  rationale: Единый перевод сохраняет намеренный контраст между миром и учениками.
- source_word: παρ’ ὑμῖν μένει
  choice: пребывает с вами
  rationale: «Пребывает» сохраняет характерную для Иоанна смысловую линию μένω, а «с вами» естественно передаёт παρά с дательным.
- source_word: ἐν ὑμῖν ἔσται
  choice: будет в вас
  rationale: Передаёт наиболее прямое значение ἐν и сохраняет отличие от предшествующего «с вами»; возможное собирательное прочтение отмечено в сноске.
theological_decisions:
- issue: Личностное обозначение Святого Духа при грамматически среднем роде греческого πνεῦμα
  choice: 'Использованы личные местоимения и формы мужского рода: «Которого», «Его», «Он»'
  alternative: 'Формально-грамматическая передача среднего рода: «которое», «его», «оно»'
  rationale: Русское «Дух» грамматически мужского рода, а ближайший контекст представляет Духа как личностного действующего субъекта. Выбор естественен для русского языка и не превращает грамматический род греческого слова в утверждение о безличности.
- issue: Соотношение выражений παρ’ ὑμῖν и ἐν ὑμῖν
  choice: 'Сохранено различие: «с вами» и «в вас»'
  alternative: Передать второе выражение как «среди вас»
  rationale: Два разных греческих предлога следует различить, не устраняя заложенное в тексте напряжение между присутствием рядом и присутствием внутри; собирательная возможность для ἐν ὑμῖν остаётся в сноске.
translation_notes:
  register: Современный литературный русский язык с традиционно-библейским, но понятным регистром. «Пребывает» выбрано ради иоанновской лексической связи и достоинства стиля; синтаксис остаётся ясным и не архаичным.
