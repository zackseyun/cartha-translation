id: JHN.14.7
reference: John 14:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ ⸀ἐγνώκειτέ με, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃· ⸀ἀπ’ ἄρτι γινώσκετε αὐτὸν καὶ ἑωράκατε ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/007.yaml
  text: If you had known me, you would have known my Father also. From now on you do know him and have seen him.
translation:
  language: ru
  text: Если бы вы знали Меня, то знали бы и Моего Отца. Отныне вы знаете Его и видели Его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγνώκειτέ / ᾔδειτε / γινώσκετε
  choice: знали / знали бы / знаете
  rationale: Различные греческие глаголы знания здесь передают близкий смысл; естественный русский повтор «знали» сохраняет условную связь, а настоящее «знаете» — подчеркнутый переход к утверждению.
- source_word: ἀπ’ ἄρτι
  choice: отныне
  rationale: Кратко и точно передаёт временной переход «с этого момента / отныне» в достойном современном регистре.
- source_word: ἑωράκατε
  choice: видели
  rationale: 'Перфект передан формой прошедшего времени, которая в контексте сохраняет результативный смысл: ученики уже увидели Отца в откровении через Иисуса.'
theological_decisions:
- issue: Соотношение знания Иисуса и знания Отца
  choice: Сохранена прямая формулировка «знали бы и Моего Отца» без поясняющей вставки.
  alternative: Добавить «через Меня» или иным образом истолковать механизм познания Отца.
  rationale: Исходный текст утверждает тесную связь, но в этом стихе не формулирует её пояснительно; перевод не должен снимать богословское напряжение.
- issue: Утверждение «видели Его»
  choice: 'Сохранено буквально: «видели Его».'
  alternative: Истолковать как «увидели, каков Он» или «видели Его во Мне».
  rationale: Буквальная формулировка сохраняет намеренную силу и неоднозначность слов Иисуса, раскрываемых дальнейшим контекстом.
translation_notes:
  register: Современный литературный русский язык с уважительным написанием местоимений, относящихся к Иисусу и Отцу. Синтаксис простой и торжественный; условная конструкция передаёт контрфактический оттенок греческого текста.
