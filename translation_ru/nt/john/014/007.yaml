  source_fidelity: Текст точно передаёт условную конструкцию εἰ ἐγνώκειτέ με … ἂν ᾔδειτε, включая связь познания Иисуса с познанием Отца. «Отныне» хорошо соответствует ἀπ’ ἄρτι; настоящее «вы знаете» и «видели» адекватно передают γινώσκετε и перфект ἑωράκατε. Неоднозначность утверждения о видении Отца сохранена.
