source:
  edition: SBLGNT
  text: λέγει οὖν ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς τῷ Πέτρῳ· Ὁ κύριός ἐστιν. Σίμων οὖν Πέτρος, ἀκούσας ὅτι ὁ κύριός ἐστιν, τὸν ἐπενδύτην διεζώσατο, ἦν γὰρ γυμνός, καὶ ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/021/007.yaml
  text: So that disciple whom Jesus loved said to Peter[a], “It is the Lord.” Therefore, when Simon Peter heard that it was the Lord, he tied his outer garment around himself (for he was lightly clothed) and threw himself into the sea.
translation:
  language: ru
  text: 'Тогда тот ученик, которого любил Иисус, сказал Петру: «Это Господь». Тогда Симон Пётр, услышав, что это Господь, подпоясался верхней одеждой — потому что был наг[a] — и бросился в море.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «раздет»; греческое слово может означать как полную наготу, так и отсутствие верхней одежды или недостаточную одетость.'
    reason: Лексическая неоднозначность γυμνός.
lexical_decisions:
- source_word: λέγει οὖν
  choice: Тогда ... сказал
  rationale: οὖν обозначает переход и развитие повествования; «тогда» естественно передаёт эту связь по-русски без излишне логического оттенка «поэтому».
- source_word: ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς
  choice: тот ученик, которого любил Иисус
  rationale: Сохранены указательное ἐκεῖνος и характерное для Иоанна обозначение ученика.
- source_word: Ὁ κύριός ἐστιν
  choice: Это Господь
  rationale: Естественная русская формула узнавания; «Господь» сохраняет как обычный титул, так и его христологическую значимость.
- source_word: ἀκούσας
  choice: услышав
  rationale: Деепричастие естественно и точно передаёт предшествующее обстоятельство, выраженное аористным причастием.
- source_word: τὸν ἐπενδύτην διεζώσατο
  choice: подпоясался верхней одеждой
  rationale: ἐπενδύτης обозначает верхнюю одежду, а διαζώννυμι — действие опоясывания или закрепления одежды вокруг себя; такая формулировка точнее простого «надел».
- source_word: ἦν γὰρ γυμνός
  choice: потому что был наг
  rationale: «Наг» прямо передаёт γυμνός и не устраняет присущую слову контекстуальную неоднозначность; возможный смысл неполной одетости отмечен в сноске.
- source_word: ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν
  choice: бросился в море
  rationale: Русское «бросился» сохраняет выразительность рефлексивной конструкции с βάλλω и звучит естественно.
theological_decisions:
- issue: Передача κύριος при узнавании Иисуса
  choice: Господь
  alternative: Учитель / Владыка
  rationale: «Господь» сохраняет обычное новозаветное наименование Иисуса и его богословскую весомость, не добавляя пояснений к самому тексту.
- issue: Смысл γυμνός применительно к Петру
  choice: наг
  alternative: раздет / легко одет
  rationale: Основной текст сохраняет прямое значение греческого слова, а реальную лексическую возможность значения «без верхней одежды, недостаточно одет» предоставляет сноска, не разрешая неоднозначность молча.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для русского; «наг» несколько возвышенно, но общеупотребительно в библейском контексте и позволяет кратко сохранить прямое значение исходного слова.
