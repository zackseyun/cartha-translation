  yaml_path: translation/nt/john/021/001.yaml
  text: After these things[a], Jesus revealed himself again to the disciples by the Sea of Tiberias, and he revealed himself in this way.
translation:
  language: ru
  text: После этого Иисус снова явил Себя[a] ученикам у Тивериадского моря. И вот как Он явил Себя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «появился»; греческий глагол может означать, что кто-либо делает себя видимым или открывает себя другим.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: После этого
  rationale: Естественный русский повествовательный переход; собирательное «это» в данном контексте передаёт греческое множественное ταῦτα без тяжеловесности.
- source_word: ἐφανέρωσεν ἑαυτὸν
  choice: явил Себя
  rationale: Сохраняет возвратную конструкцию и оттенок сознательного самооткровения, оставаясь естественным и достойным по стилю.
- source_word: πάλιν
  choice: снова
  rationale: Прямо обозначает повторное явление после предшествующих встреч воскресшего Иисуса с учениками.
- source_word: τοῖς μαθηταῖς
  choice: ученикам
  rationale: Не добавляет отсутствующего в греческом тексте притяжательного местоимения «Своим».
- source_word: ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος
  choice: у Тивериадского моря
  rationale: Предлог «у» естественно передаёт местонахождение возле моря; название следует греческой форме.
- source_word: ἐφανέρωσεν δὲ οὕτως
  choice: Явил Он Себя так
  rationale: Повтор глагола сохранён ради литературной связности, а οὕτως прямо вводит последующее описание способа явления.
theological_decisions:
- issue: Передача языка явления воскресшего Иисуса
  choice: явил Себя
  alternative: явился; открыл Себя
  rationale: Формулировка сохраняет акцент φανερόω на том, что Иисус Сам сделал Себя видимым и известным, не сводя событие лишь к зрительному впечатлению и не отрицая реальности встречи.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Заглавное «Себя» применено как традиционная русская форма почтительного обозначения Иисуса; синтаксис второй фразы сохраняет заметный повтор оригинала.
