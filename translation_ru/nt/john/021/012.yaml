base_translation:
  language: en
  yaml_path: translation/nt/john/021/012.yaml
  text: Jesus said to them[a], “Come, eat breakfast.” But none of the disciples dared to ask him[b], “Who are you?” knowing that it was the Lord.
translation:
  language: ru
  text: 'Иисус говорит им: «Подойдите, позавтракайте».[a] Но никто из учеников не осмеливался спросить Его[b]: «Кто Ты?» — ведь они знали, что это Господь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Подойдите сюда». Греческий глагол обозначает именно завтрак, утреннюю трапезу.'
    reason: lexical_alternative
  - marker: b
    text: Глагол, переведённый как «спросить», может также означать «расспрашивать», «подробно выспрашивать» или «испытывать вопросами».
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε
  choice: Идите
  rationale: В данном приглашении наречие с повелительным значением передаёт призыв подойти и приступить к трапезе; «идите» естественно звучит по-русски в сочетании с последующим повелением.
- source_word: ἀριστήσατε
  choice: позавтракайте
  rationale: Глагол обозначает принятие утренней пищи; «позавтракайте» сохраняет эту временную конкретность и естественно передаёт приглашение.
- source_word: οὐδεὶς δὲ
  choice: Но никто
  rationale: δέ отмечает мягкий контраст между приглашением Иисуса и сдержанностью учеников.
- source_word: ἐτόλμα
  choice: не решался
  rationale: Имперфект передаёт отсутствие решимости или смелости совершить действие; русское «не решался» естественно в конструкции с инфинитивом.
- source_word: ἐξετάσαι
  choice: расспрашивать
  rationale: Глагол сильнее нейтрального «спросить» и может означать обстоятельно расспрашивать или допытываться; «расспрашивать» сохраняет этот оттенок без чрезмерного усиления.
- source_word: Σὺ τίς εἶ;
  choice: Кто Ты?
  rationale: Естественная русская форма прямого вопроса о личности; прописная буква в местоимении соответствует принятому благоговейному регистру русского библейского текста.
- source_word: εἰδότες ὅτι
  choice: ведь они знали, что
  rationale: Причастие обозначает сопутствующее знание и в контексте допускает причинный оттенок. «Ведь» естественно связывает нежелание спрашивать с уже имевшимся знанием, не превращая причинность в чрезмерно жёсткое логическое утверждение.
- source_word: ὁ κύριός
  choice: Господь
  rationale: В повествовании о явлении воскресшего Иисуса κύριος сохраняет христологически значимое наименование «Господь».
theological_decisions:
- issue: Передача κύριος применительно к Иисусу
  choice: Господь
  alternative: господин; Учитель
  rationale: «Господь» сохраняет обычное новозаветное наименование Иисуса и его богословский вес, не добавляя толкования сверх текста.
- issue: Связь знания учеников с их нежеланием спрашивать
  choice: ведь они знали
  alternative: зная, что
  rationale: Греческое причастие εἰδότες формально допускает сопутствующий или причинный оттенок. «Ведь они знали» передаёт естественную контекстуальную связь, тогда как буквальное «зная» по-русски здесь звучит менее плавно.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Настоящее историческое «говорит» сохранено вслед за греческим λέγει. Лексика проста и понятна; более сильный оттенок ἐξετάσαι вынесен в основной текст и пояснён в сноске.
