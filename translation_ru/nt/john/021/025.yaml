  text: ἔστιν δὲ καὶ ἄλλα πολλὰ ⸀ἃ ἐποίησεν ὁ Ἰησοῦς, ἅτινα ἐὰν γράφηται καθ’ ἕν, οὐδ’ αὐτὸν οἶμαι τὸν κόσμον ⸀χωρήσειν τὰ γραφόμενα ⸀βιβλία.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/025.yaml
  text: There are also many other things that Jesus did[a], which, if they were written down one by one, I suppose that not even the world itself would have room for the books being written.
translation:
  language: ru
  text: Есть также многое другое, что сделал Иисус; если бы всё это было записано по отдельности, думаю, даже сам мир не вместил бы книг, которые были бы написаны.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не вместил бы пишущихся книг». Греческое причастие буквально означает «пишущихся», но в условном контексте естественно передаёт книги, которые были бы написаны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ καὶ ἄλλα πολλὰ
  choice: Есть также и многое другое
  rationale: Передаёт мягкое продолжение мысли через «также» и сохраняет смысл множества иных деяний без искусственного начального «теперь».
- source_word: ἃ ἐποίησεν ὁ Ἰησοῦς
  choice: что совершил Иисус
  rationale: «Совершил» естественно и достойно передаёт широкое значение ποιέω применительно к деяниям Иисуса.
- source_word: ἅτινα ἐὰν γράφηται
  choice: Если бы всё это описывали
  rationale: Условная конструкция передаёт гипотетичность ἐάν с сослагательным наклонением; «описывали» в данном контексте означает письменное изложение упомянутых деяний.
- source_word: καθ’ ἕν
  choice: одно за другим
  rationale: 'Сохраняет распределительное значение: каждое деяние по отдельности.'
- source_word: οὐδ’ αὐτὸν ... τὸν κόσμον
  choice: даже сам мир не
  rationale: «Сам» передаёт усилительное αὐτόν, а «даже» — οὐδέ.
- source_word: οἶμαι
  choice: думаю
  rationale: Сохраняет личное риторическое замечание автора и звучит естественно по-русски.
- source_word: χωρήσειν
  choice: не вместил бы
  rationale: Глагол «вместить» сохраняет пространственный образ χωρέω и одновременно допускает значение «содержать».
- source_word: τὰ γραφόμενα βιβλία
  choice: написанных книг
  rationale: Естественная русская формулировка для книг, которые появились бы в результате предполагаемого описания; буквальное «пишущихся книг» здесь было бы тяжеловесно.
theological_decisions:
- issue: Риторическая гипербола о способности мира вместить книги
  choice: 'Сохранён образ: «даже сам мир не вместил бы»'
  alternative: «получилось бы бесчисленное множество книг»
  rationale: Исходный текст намеренно использует яркую гиперболу; перевод не сводит её к отвлечённому указанию на большое количество.
translation_notes:
  register: Современный литературный русский язык, с ясным, достойным и естественным синтаксисом. Длинное греческое предложение разделено на два для удобства чтения без изменения логической связи; сохранены личное «думаю» и заключительная гипербола.
