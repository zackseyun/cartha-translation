revisions:
- from: Есть также и многое другое, что совершил Иисус. Если бы всё это описывали одно за другим, то, думаю, даже сам мир не вместил бы написанных книг.[a]
  to: Есть также многое другое, что сделал Иисус; если бы всё это было записано по отдельности, думаю, даже сам мир не вместил бы книг, которые были бы написаны.[a]
  rationale: Сохранены добавочность, множество иных дел, личное «думаю» и намеренная гипербола. Страдательный условный оборот восстановлен, а итоговые книги прямо выражены как предполагаемый результат записи; сноска отмечает более буквальную форму греческого причастия.
