  text: Ὅτε οὖν ἠρίστησαν λέγει τῷ Σίμωνι Πέτρῳ ὁ Ἰησοῦς· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με πλέον τούτων; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Βόσκε τὰ ἀρνία μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/015.yaml
  text: So when they had eaten breakfast[a], Jesus said to Simon Peter, “Simon, son of John, do you love me more than these?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Feed my lambs.”
translation:
  language: ru
  text: 'Когда же они позавтракали, Иисус сказал Симону Петру: «Симон, сын Иоанна, любишь ли ты Меня больше, чем эти?[a]» Пётр сказал Ему: «Да, Господи! Ты знаешь, что я люблю Тебя».[b] Иисус сказал ему: «Паси Моих ягнят».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «больше, чем эти» в греческом тексте неоднозначно. Оно может означать «больше, чем любят Меня они», «больше, чем ты любишь их» или «больше, чем всё это».
    reason: alternative_reading
  - marker: b
    text: Задавая вопрос, Иисус употребляет глагол ἀγαπάω («любить»), а Пётр в ответе — φιλέω («любить, быть привязанным»). Одни толкователи видят здесь смысловое различие, другие считают смену слов стилистической. В основном тексте оба слова переведены глаголом «любить», чтобы не подчёркивать различие, не выраженное контекстом однозначно.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρίστησαν
  choice: позавтракали
  rationale: Глагол обозначает принятие утренней пищи; «позавтракали» естественно и точно передаёт значение.
- source_word: λέγει
  choice: сказал / ответил
  rationale: Историческое настоящее передано прошедшим временем, обычным для русского повествования; в реплике Петра контекстуально естественно «ответил».
- source_word: Σίμων Ἰωάννου
  choice: Симон, сын Иоанна
  rationale: Родительный падеж имени здесь выполняет функцию патронима. В греческом тексте стоит имя Иоанн, а не традиционный вариант «Ионин».
- source_word: ἀγαπᾷς / φιλῶ
  choice: любишь / люблю
  rationale: Оба глагола могут передаваться русским «любить». Различие греческих слов отмечено в сноске, чтобы не навязывать спорную смысловую иерархию.
- source_word: πλέον τούτων
  choice: больше их
  rationale: 'Краткая русская формулировка сохраняет эллиптичность сравнения: речь может идти как о других учениках, так и о находящихся рядом вещах, а также о сравнении любви Петра с любовью других.'
- source_word: κύριε
  choice: Господи
  rationale: Форма звательного обращения естественно передаёт почтительное κύριε в данном христологическом контексте.
- source_word: Βόσκε τὰ ἀρνία μου
  choice: Паси Моих ягнят
  rationale: «Паси» естественно сохраняет пастушеский образ и включает кормление стада; «ягнят» точно и понятно передаёт ἀρνία.
theological_decisions:
- issue: Следует ли резко разграничивать ἀγαπάω и φιλέω
  choice: В основном тексте оба глагола переданы словом «любить», а лексическая смена отмечена в сноске.
  alternative: Передать φιλῶ как «я привязан к Тебе» или выстроить иерархию двух видов любви.
  rationale: Контекст не устанавливает однозначно различие между «высшей» и «низшей» любовью; одинаковый перевод не превращает спорное толкование в сам текст.
- issue: К чему относится πλέον τούτων
  choice: Сохранить неоднозначность выражением «больше их».
  alternative: 'Уточнить: «больше, чем любят Меня они», «больше, чем ты любишь их» или «больше всего этого».'
  rationale: Греческая фраза не выражает второй член сравнения полностью, поэтому конкретизация неоправданно сузила бы смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формы «Пётр», «ягнят» и «позавтракали» понятны современному читателю; прописные местоимения в обращении к Иисусу сохраняют принятую русскую издательскую традицию.
