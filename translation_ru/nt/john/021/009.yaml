  text: Ὡς οὖν ἀπέβησαν εἰς τὴν γῆν βλέπουσιν ἀνθρακιὰν κειμένην καὶ ὀψάριον ἐπικείμενον καὶ ἄρτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/009.yaml
  text: So when they got out onto the land[a], they saw a charcoal fire laid there, and fish lying on it[b], and bread.
translation:
  language: ru
  text: Когда они вышли на сушу[a], то увидели там угольный огонь[b], а на нём — рыбу и хлеб.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сошли на берег». Буквально: «вышли на землю».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «угольный огонь» переводит то же греческое слово, что и в Ин 18:18, где описано место отречения Петра.
    reason: cross_reference
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Когда… то
  rationale: Естественно передаёт временную связь ὡς и повествовательное продолжение οὖν, не утяжеляя русскую фразу буквальным «итак».
- source_word: ἀπέβησαν εἰς τὴν γῆν
  choice: они вышли на сушу
  rationale: Сохраняет образ выхода из лодки на землю и звучит естественно по-русски; «пристали к берегу» скорее описывало бы прибытие лодки, а не выход людей.
- source_word: βλέπουσιν
  choice: увидели
  rationale: Историческое настоящее передано прошедшим временем, обычным для современного русского повествования.
- source_word: ἀνθρακιὰν κειμένην
  choice: разведённый там угольный костёр
  rationale: ἀνθρακιά обозначает огонь на древесном угле или горящие угли; сочетание передаёт приготовленный огонь естественно и сохраняет лексическую связь с Ин 18:18.
- source_word: ὀψάριον ἐπικείμενον
  choice: на нём — рыбу
  rationale: Передаёт рыбу как пищу, лежавшую на угольном огне; контекст допускает приготовление, но слово само по себе не требует добавлять «жареную».
- source_word: ἄρτον
  choice: хлеб
  rationale: Нейтральное соответствие, не уточняющее без необходимости форму или количество хлеба.
theological_decisions:
- issue: Историческое настоящее βλέπουσιν
  choice: 'Передать прошедшим временем: «увидели»'
  alternative: 'Сохранить настоящее время: «видят»'
  rationale: Это повествовательный приём, а не богословское утверждение; прошедшее время естественнее в современном русском рассказе и не меняет последовательности событий.
- issue: Словесная связь ἀνθρακιά с местом отречения Петра в Ин 18:18
  choice: Перевести одинаково значимым выражением «угольный костёр» и отметить связь в сноске
  alternative: «горящие угли» или просто «костёр» без пояснения
  rationale: Редкое слово создаёт намеренное повествовательное эхо, однако текст не объясняет его богословский смысл; сноска сохраняет связь, не навязывая толкования.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Синтаксис слегка перестроен для естественности; тире выделяет увиденные на огне рыбу и хлеб. Маркер [b] должен стоять после слов «угольный костёр», чтобы соответствовать сноске.
