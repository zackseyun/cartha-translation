id: JHN.21.23
reference: John 21:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ⸂οὗτος ὁ λόγος⸃ εἰς τοὺς ἀδελφοὺς ὅτι ὁ μαθητὴς ἐκεῖνος οὐκ ἀποθνῄσκει. ⸂οὐκ εἶπεν δὲ⸃ αὐτῷ ὁ Ἰησοῦς ὅτι οὐκ ἀποθνῄσκει ἀλλ’· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/023.yaml
  text: So this report spread among the brothers that that disciple would not die. Yet Jesus did not say to him that he would not die, but, “If I want him to remain until I come, what is that to you?”
translation:
  language: ru
  text: 'Поэтому среди братьев[a] распространилась молва[b], что тот ученик не умрёт. Но Иисус не сказал ему, что тот не умрёт, а сказал: «Если Я хочу, чтобы он оставался, пока Я не приду, что тебе до этого?»[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Братья» — здесь община учеников Иисуса; в греческом тексте употреблено существительное мужского рода во множественном числе.
    reason: cultural_note
  - marker: b
    text: 'Или: «это сообщение»; греческое λόγος может означать «слово», «высказывание» или «сообщение».'
    reason: lexical_alternative
  - marker: c
    text: 'Иисус не обещал, что этот ученик никогда не умрёт, а поставил условие: «Если Я хочу, чтобы он оставался, пока Я не приду…»'
    reason: clarification
lexical_decisions:
- source_word: ἐξῆλθεν ... εἰς
  choice: распространилась среди
  rationale: В данном контексте выражение описывает распространение вести внутри сообщества; по-русски это естественно передаётся глаголом «распространилась».
- source_word: οὗτος ὁ λόγος
  choice: молва
  rationale: Здесь λόγος обозначает распространившееся сообщение, которое возникло из неверного понимания слов Иисуса. «Молва» естественно передаёт и распространённость, и неподтверждённый характер сообщения, не придавая λόγος специального богословского смысла.
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: среди братьев
  rationale: Сочетание с глаголом распространения указывает на хождение сообщения внутри сообщества учеников; мужское множественное число ἀδελφούς сохранено как «братьев».
- source_word: ὁ μαθητὴς ἐκεῖνος
  choice: тот ученик
  rationale: Указательное ἐκεῖνος сохранено, поскольку речь идёт о конкретном ученике, названном в ближайшем контексте.
- source_word: οὐκ ἀποθνῄσκει
  choice: не умрёт
  rationale: Настоящее время греческого глагола в содержании распространившегося сообщения естественно передаётся русским будущим временем.
- source_word: οὐκ εἶπεν δὲ
  choice: Но Иисус не сказал
  rationale: δέ вводит авторское противопоставление и исправление ошибочного вывода; «но» ясно и естественно выражает эту функцию.
- source_word: Ἐὰν αὐτὸν θέλω μένειν
  choice: Если Я хочу, чтобы он оставался
  rationale: Условность ἐάν и волеизъявление θέλω сохранены без превращения слов Иисуса в обещание; «оставался» передаёт μένειν и его характерное для Иоанна звучание.
- source_word: ἕως ἔρχομαι
  choice: пока Я не приду
  rationale: Русская конструкция «пока не» естественно выражает предел действия и не означает отрицания прихода; «приду» сохраняет близость к ἔρχομαι без пояснительного «вернусь».
- source_word: τί πρὸς σέ
  choice: что тебе до этого?
  rationale: Устойчивое современное русское выражение точно передаёт прямой вопрос о том, касается ли это Петра.
theological_decisions:
- issue: Характер распространившегося утверждения об ученике
  choice: Передать его как «молву» и затем сохранить прямое авторское опровержение того, будто Иисус обещал ученику бессмертие.
  alternative: 'Более буквально: «это слово распространилось» или нейтрально: «это сообщение распространилось».'
  rationale: Стих сам подчёркивает расхождение между распространившимся выводом и действительными условными словами Иисуса. Перевод не должен превращать условие в пророчество или обещание.
- issue: Смысл условия ἐὰν ... θέλω
  choice: 'Сохранить открытое условие: «Если Я хочу...»'
  alternative: Истолковать фразу как предсказание, что ученик доживёт до пришествия Иисуса.
  rationale: Греческий текст формулирует гипотетическое условие, а не утверждает, что Иисус действительно желает этого или что ученик непременно останется жив.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Формулировка сохраняет противопоставление между возникшей молвой и действительными условными словами Иисуса; прописные «Я» соответствуют принятому русскому оформлению прямой речи Христа.
