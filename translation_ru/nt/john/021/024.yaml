id: JHN.21.24
reference: John 21:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ μαθητὴς ὁ μαρτυρῶν περὶ τούτων καὶ ⸀ὁ γράψας ταῦτα, καὶ οἴδαμεν ὅτι ἀληθὴς ⸂αὐτοῦ ἡ μαρτυρία ἐστίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/024.yaml
  text: This is the disciple who testifies about these things and who wrote these things[a], and we know that his testimony is true.
translation:
  language: ru
  text: Это тот ученик, который свидетельствует об этом и написал это[a], и мы знаем, что его свидетельство истинно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который свидетельствует об этих событиях и записал их». Греческие местоимения стоят во множественном числе и могут указывать на события или содержание Евангелия; по-русски собирательное «это» звучит естественнее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός
  choice: Это тот
  rationale: Передаёт указательное и отождествляющее значение местоимения, отсылающего к только что упомянутому ученику; по-русски естественнее, чем буквальное «этот есть».
- source_word: μαθητὴς
  choice: ученик
  rationale: Обычное и точное обозначение последователя Иисуса в Евангелии от Иоанна.
- source_word: μαρτυρῶν
  choice: свидетельствует
  rationale: Настоящее причастие имеет продолжающееся или характеризующее значение; личная форма естественна по-русски и сохраняет связь со словом «свидетельство».
- source_word: περὶ τούτων
  choice: об этом
  rationale: Естественно передаёт множественное греческое выражение, указывающее на изложенные события и содержание; русское собирательное «об этом» избегает тяжеловесного «об этих вещах».
- source_word: ὁ γράψας ταῦτα
  choice: написал это
  rationale: Аористное причастие обозначает завершённое действие; однородное сказуемое с общим относительным местоимением звучит естественно и точно.
- source_word: οἴδαμεν
  choice: мы знаем
  rationale: Обычная передача перфектной по форме глагольной формы с настоящим значением; первое лицо множественного числа сохранено без уточнения говорящих.
- source_word: ἀληθὴς
  choice: истинно
  rationale: Краткое прилагательное непосредственно передаёт оценку свидетельства как соответствующего истине, сохраняя характерную для Иоанна лексику истины.
- source_word: αὐτοῦ ἡ μαρτυρία
  choice: его свидетельство
  rationale: Естественная русская притяжательная конструкция, сохраняющая юридический и истинностный оттенки греческого существительного.
- source_word: μαρτυρία
  choice: свидетельство
  rationale: Сохраняет однокоренную связь с «свидетельствует», заметную и в греческих μαρτυρῶν/μαρτυρία.
theological_decisions:
- issue: Кто подразумевается под «мы знаем»
  choice: Сохранить первое лицо множественного числа «мы знаем», не определяя говорящих.
  alternative: Истолковать это как редакционное «мы» евангелиста либо как утверждение общины, удостоверяющей свидетельство любимого ученика.
  rationale: Греческий текст прямо использует первое лицо множественного числа, но не называет говорящих; перевод не должен разрешать вопрос авторства или голоса общины.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены однокоренные «свидетельствует / свидетельство» и неопределённость относительно того, кто говорит «мы знаем».
