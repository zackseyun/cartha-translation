source:
  edition: SBLGNT
  text: ⸀Ἐπιστραφεὶς ὁ Πέτρος βλέπει τὸν μαθητὴν ὃν ἠγάπα ὁ Ἰησοῦς ἀκολουθοῦντα, ὃς καὶ ἀνέπεσεν ἐν τῷ δείπνῳ ἐπὶ τὸ στῆθος αὐτοῦ καὶ εἶπεν· Κύριε, τίς ἐστιν ὁ παραδιδούς σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/020.yaml
  text: Peter turned and saw the disciple whom Jesus loved following[a], who had also leaned back against his chest at the supper and said, “Lord[b], who is the one betraying you?”
translation:
  language: ru
  text: 'Пётр обернулся и увидел ученика, которого любил Иисус, идущего следом[a], который также за ужином откинулся[b] на грудь Иисуса и спросил: «Господи, кто предаёт Тебя?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «следующего»; в греческом тексте не сказано прямо, за кем он шёл.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «возлёг у Его груди». За трапезой люди располагались полулёжа; речь идёт о позе ученика рядом с Иисусом.'
    reason: historical_context
lexical_decisions:
- source_word: Ἐπιστραφεὶς
  choice: обернулся
  rationale: Аористное причастие передаёт действие Петра, предшествующее тому, что он увидел; личная форма естественна для современного русского повествования.
- source_word: βλέπει
  choice: увидел
  rationale: Историческое настоящее по-русски естественно передать прошедшим временем, сохранив последовательность повествования.
- source_word: τὸν μαθητὴν
  choice: ученика
  rationale: Устоявшееся и точное обозначение ученика Иисуса в Евангелии от Иоанна.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: которого любил Иисус
  rationale: Прямо и естественно передаёт относительное придаточное, не меняя субъекта любви.
- source_word: ἀκολουθοῦντα
  choice: идущего следом
  rationale: Передаёт движение вслед за кем-либо, но не добавляет не названный в греческом тексте объект.
- source_word: ἀνέπεσεν
  choice: откинулся
  rationale: В контексте трапезы описывает движение человека, возлежавшего за столом; выбранное слово понятно современному читателю.
- source_word: ἐν τῷ δείπνῳ
  choice: во время ужина
  rationale: Естественно обозначает конкретную вечернюю трапезу без внесения литургической терминологии.
- source_word: ἐπὶ τὸ στῆθος αὐτοῦ
  choice: к груди Иисуса
  rationale: Передаёт физическую близость и ясно обозначает референта местоимения, известного из контекста сцены.
- source_word: Κύριε
  choice: Господи
  rationale: Нормальная русская форма прямого обращения к Иисусу, сохраняющая уважительное и богословское звучание κύριος.
- source_word: ὁ παραδιδούς σε
  choice: кто предаёт Тебя
  rationale: Настоящее время сохраняет форму греческого причастия и напряжённость вопроса, не превращая её без необходимости в простое будущее.
theological_decisions:
- issue: Историческое настоящее βλέπει
  choice: передано прошедшим временем «увидел»
  alternative: «видит»
  rationale: Это повествовательная адаптация к естественному русскому употреблению; богословский смысл не меняется.
- issue: Неуказанный объект при ἀκολουθοῦντα
  choice: 'объект не добавлен: «идущего следом»'
  alternative: «идущего за ними» или «идущего за Ним»
  rationale: Греческий текст не уточняет, за кем именно шёл ученик; перевод сохраняет эту подлинную неоднозначность.
- issue: Временная форма ὁ παραδιδούς
  choice: «кто предаёт Тебя»
  alternative: «кто предаст Тебя»
  rationale: Настоящее время ближе к греческой форме и не устраняет напряжение между уже совершающимся предательством и его предстоящим осуществлением.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохранён в одном предложении, но греческие причастия переданы естественными русскими формами. Заглавное «Тебя» употреблено как принятая в русском религиозном письме форма почтительного обращения.
