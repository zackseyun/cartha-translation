  terminology: «Ученик», «Господи» и «предаёт Тебя» удачны. «За ужином» более компактно и естественно, чем «во время ужина», без смысловой потери. Сноску о позе следует привязать к слову, которое она поясняет, а не к имени «Иисуса».
