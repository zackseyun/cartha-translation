base_translation:
  language: en
  yaml_path: translation/nt/john/021/016.yaml
  text: He said to him again a second time[a], “Simon, son of John, do you love me?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Shepherd my sheep.”
translation:
  language: ru
  text: 'Он снова, во второй раз, спросил его: «Симон, сын Иоанна, любишь ли ты Меня?» Тот ответил Ему: «Да, Господи, Ты знаешь, что я люблю Тебя».[a] Он сказал ему: «Паси Моих овец».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте в вопросе Иисуса и ответе Петра употреблены разные глаголы со значением любви: ἀγαπάω и φιλέω. Одни толкователи видят между ними смысловое различие, другие считают их здесь стилистическими вариантами. В основном тексте оба переданы словом «любить», чтобы не преувеличивать возможное различие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν δεύτερον
  choice: снова, во второй раз
  rationale: 'Переданы оба элемента греческого выражения: πάλιν указывает на повторение, а δεύτερον — на то, что вопрос задаётся во второй раз. Лёгкая избыточность отражает акцент исходного текста.'
- source_word: Σίμων Ἰωάννου
  choice: Симон, сын Иоанна
  rationale: Родительный падеж Ἰωάννου естественно понят как отчество-патроним; вариант «сын Ионы» не соответствует данному греческому чтению.
- source_word: ἀγαπᾷς με
  choice: любишь ли ты Меня
  rationale: Обычный русский глагол «любить» естественно передаёт ἀγαπάω, не навязывая контексту спорного различия между ἀγαπάω и φιλέω.
- source_word: Ναί, κύριε
  choice: Да, Господь!
  rationale: Ναί передано простым подтверждением, а κύριε — традиционным и контекстуально уместным обращением «Господь».
- source_word: σὺ οἶδας
  choice: Ты знаешь
  rationale: Выраженное местоимение сохраняет умеренное ударение на знании Иисуса; в русском оно передано естественно.
- source_word: ὅτι φιλῶ σε
  choice: что я люблю Тебя
  rationale: φιλέω здесь передано тем же русским глаголом «любить», поскольку уверенно установить резкий смысловой контраст с ἀγαπάω в данном контексте нельзя; различие греческих слов отмечено в сноске.
- source_word: Ποίμαινε
  choice: Паси
  rationale: Императив «паси» сохраняет образ пастуха и включает заботу, руководство и попечение о стаде.
- source_word: τὰ πρόβατά μου
  choice: Моих овец
  rationale: Буквальное обозначение овец сохраняет конкретный пастырский образ и принадлежность стада Иисусу.
theological_decisions:
- issue: Следует ли различать ἀγαπάω и φιλέω разными русскими глаголами
  choice: Оба глагола переданы словом «любить», а лексическое различие указано в сноске.
  alternative: Передать ἀγαπάω как «любить», а φιλέω как «быть привязанным» или «дорожить».
  rationale: В греческом действительно употреблены разные глаголы, однако в языке Иоанна их значения могут заметно пересекаться. Разные русские эквиваленты внесли бы более резкое психологическое или богословское противопоставление, чем однозначно выражено в тексте.
translation_notes:
  register: Современный литературный русский язык; речь ясная и достойная, с сохранением пастырского образа. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно принятой русской библейской традиции. Конструкция «снова, во второй раз» намеренно сохраняет греческое усиленное обозначение повторения.
