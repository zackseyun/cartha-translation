  text: Πρωΐας δὲ ἤδη ⸀γενομένης ⸀ἔστη Ἰησοῦς εἰς τὸν αἰγιαλόν· οὐ μέντοι ᾔδεισαν οἱ μαθηταὶ ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/004.yaml
  text: When daybreak had already come[a], Jesus stood on the shore; yet the disciples did not know that it was Jesus.
translation:
  language: ru
  text: Когда уже рассвело, Иисус стоял на берегу, однако ученики не знали[a], что это Иисус.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или по смыслу: «не узнали, что это Иисус». Буквально в греческом тексте: «не знали, что это Иисус».'
    reason: Лексема οἶδα буквально означает «знать», хотя в данном контексте речь может идти о неузнавании.
lexical_decisions:
- source_word: Πρωΐας δὲ ἤδη γενομένης
  choice: Когда уже рассвело
  rationale: Генитив абсолютный задаёт временное обстоятельство. «Рассвело» естественно передаёт наступление раннего утра, а «уже» соответствует ἤδη. Слабое повествовательное δέ отдельно не выражено, поскольку связь естественно передаётся придаточным времени.
- source_word: ἔστη
  choice: стоял
  rationale: В данном контексте форма ἵστημι описывает нахождение Иисуса на берегу; русское «стоял» естественно передаёт результирующее положение, не делая лишнего акцента на самом движении.
- source_word: εἰς τὸν αἰγιαλόν
  choice: на берегу
  rationale: При глаголе положения εἰς может обозначать место; αἰγιαλός здесь — берег озера. «На берегу» является точной и естественной русской формулировкой.
- source_word: οὐ μέντοι
  choice: однако ... не
  rationale: 'Сочетание выражает противопоставление: Иисус находился перед учениками, однако они не знали, кто это.'
- source_word: ᾔδεισαν
  choice: не знали
  rationale: Сохранено основное значение οἶδα — «знать». Контекст допускает смысл неузнавания, но перевод не подменяет более общее исходное выражение толкованием.
- source_word: οἱ μαθηταὶ
  choice: ученики
  rationale: Определённый артикль указывает на уже известных из контекста учеников; добавлять отсутствующее в греческом тексте притяжательное местоимение не требуется.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: что это Иисус
  rationale: Так по-русски естественно строится предложение отождествления; настоящее время греческого ἐστιν в косвенной речи не требует неестественного русского «есть».
theological_decisions:
- issue: Неузнавание воскресшего Иисуса учениками
  choice: Передать как отсутствие знания, не объясняя его причину
  alternative: «Ученики не узнали Иисуса»
  rationale: Стих сообщает о том, что ученики не знали, что перед ними Иисус, но не объясняет, было ли это связано с его обликом, расстоянием, освещением или их восприятием. Перевод сохраняет эту сдержанность.
translation_notes:
  register: Современный литературный русский язык с простым, достоинственным повествовательным строем. Формулировка понятна широкому читателю и сохраняет лаконичность оригинала.
