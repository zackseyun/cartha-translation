  text: ἀνέβη ⸀οὖν Σίμων Πέτρος καὶ εἵλκυσεν τὸ δίκτυον ⸂εἰς τὴν γῆν⸃ μεστὸν ἰχθύων μεγάλων ἑκατὸν πεντήκοντα τριῶν· καὶ τοσούτων ὄντων οὐκ ἐσχίσθη τὸ δίκτυον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/011.yaml
  text: So Simon Peter went aboard and pulled the net onto the shore[a], full of large fish, one hundred fifty-three; and though there were so many[b], the net was not torn.
translation:
  language: ru
  text: Тогда Симон Пётр вошёл в лодку[a] и вытащил сеть на берег[b], полную ста пятидесяти трёх крупных рыб. И хотя их было так много, сеть не порвалась.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднялся». По контексту Симон Пётр поднялся в лодку или на неё, чтобы вытащить сеть.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на землю» или «на сушу»; в данном контексте имеется в виду берег.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: поднялся
  rationale: 'Передаёт основное значение греческого глагола и сохраняет неуточнённость направления: по контексту Пётр, вероятно, поднялся в лодку или на неё, но сам текст прямо этого не говорит.'
- source_word: οὖν
  choice: тогда
  rationale: Естественно передаёт повествовательную связь с предшествующим повелением Иисуса и последовавшим действием Петра.
- source_word: εἵλκυσεν
  choice: вытащил
  rationale: В данном контексте обозначает подтягивание сети из воды на сушу; это естественнее по-русски, чем буквальное «потянул».
- source_word: τὸ δίκτυον
  choice: сеть
  rationale: Прямое и общепонятное обозначение рыболовной сети.
- source_word: εἰς τὴν γῆν
  choice: на берег
  rationale: Буквально выражение значит «на землю/сушу», но в сцене рыбной ловли речь идёт о береге.
- source_word: μεστὸν ἰχθύων μεγάλων ἑκατὸν πεντήκοντα τριῶν
  choice: В ней было сто пятьдесят три крупные рыбы
  rationale: Естественная русская формулировка, ясно передающая наполненность сети, размер рыб и их точное число без громоздкой конструкции.
- source_word: τοσούτων ὄντων
  choice: хотя их было так много
  rationale: Передаёт уступительное значение родительного самостоятельного оборота и подразумеваемое напряжение сети из-за множества рыб.
- source_word: οὐκ ἐσχίσθη τὸ δίκτυον
  choice: сеть не порвалась
  rationale: 'Естественно передаёт греческий пассив результата: несмотря на нагрузку, сеть осталась целой.'
