id: JHN.21.19
reference: John 21:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν σημαίνων ποίῳ θανάτῳ δοξάσει τὸν θεόν. καὶ τοῦτο εἰπὼν λέγει αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/019.yaml
  text: He said this to indicate by what kind of death he would glorify God[a]. And after saying this, he says to him[b], “Follow me.”
translation:
  language: ru
  text: 'Он сказал это, давая понять, какой смертью Пётр прославит Бога[a]. Сказав это, Он говорит ему[b]: «Следуй за Мной».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смертью какого рода».'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте здесь употреблено историческое настоящее: «говорит ему».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημαίνων
  choice: давая понять
  rationale: Передаёт значение косвенного указания или обозначения и естественно звучит в современном русском языке.
- source_word: ποίῳ θανάτῳ
  choice: какой смертью
  rationale: Творительный падеж естественно передаёт греческий дательный, а «какой» сохраняет качественный оттенок — указание на вид или образ смерти.
- source_word: δοξάσει
  choice: прославит
  rationale: Будущее время греческого оригинала прямо и естественно сохраняется в русском косвенном сообщении.
- source_word: τὸν θεόν
  choice: Бога
  rationale: Стандартная передача θεός как прямого объекта глагола «прославит».
- source_word: λέγει αὐτῷ
  choice: Он говорит ему
  rationale: Настоящее время сохраняет исторический презенс и живость повествования Иоанна.
- source_word: Ἀκολούθει μοι
  choice: Следуй за Мной
  rationale: Естественная русская форма повеления, способная выражать как непосредственный призыв, так и продолжающееся ученичество.
- source_word: καὶ τοῦτο εἰπὼν
  choice: Сказав это
  rationale: Деепричастный оборот кратко и естественно передаёт предшествующее действие аористного причастия; начальное καί не требует отдельного «и» в русском.
theological_decisions:
- issue: Кто прославит Бога своей смертью
  choice: Имя «Пётр» введено для ясности референта местоимения
  alternative: «он прославит Бога»
  rationale: В ближайшем контексте речь идёт о Петре; явное имя устраняет возможную русскую двусмысленность между Иисусом и Петром, не добавляя нового толкования.
- issue: Смысл прославления Бога смертью Петра
  choice: 'Оставлено без поясняющего расширения: «прославит Бога»'
  alternative: Уточнить, что Пётр прославит Бога мученической смертью и верным свидетельством
  rationale: Текст связывает смерть Петра с прославлением Бога, но не объясняет здесь механизм этой связи; перевод сохраняет богословскую ёмкость выражения.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Местоимение «Он» и форма «Мной» капитализированы в соответствии с распространённой русской библейской издательской практикой при указании на Иисуса.
