  yaml_path: translation/nt/john/021/005.yaml
  text: So Jesus said to them[a], “Children, you do not have any fish, do you?” They answered him, “No.”
translation:
  language: ru
  text: 'Тогда Иисус спросил их: «Дети, у вас ведь нет рыбы[a]?» Они ответили Ему: «Нет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чего-нибудь съестного». Греческое προσφάγιον обозначает пищу, которую едят с хлебом; в контексте рыбной ловли, вероятно, имеется в виду рыба.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Тогда
  rationale: Естественный повествовательный связующий элемент, передающий развитие событий без излишне строгого причинного оттенка.
- source_word: Παιδία
  choice: Дети
  rationale: Прямой эквивалент ласкового или близкого обращения; сохраняет необычную для данного контекста форму греческого текста, не заменяя её толкованием «друзья».
- source_word: μή τι
  choice: у вас ведь нет ...?
  rationale: Частица μή в вопросе предполагает отрицательный ответ; конструкция с «ведь нет» естественно передаёт это ожидание по-русски.
- source_word: προσφάγιον
  choice: рыбы
  rationale: Слово обозначает пищу, которую едят с хлебом; в контексте рыбной ловли наиболее вероятно имеется в виду рыба. Более широкое значение отмечено в сноске.
- source_word: ἔχετε
  choice: у вас ... нет
  rationale: Русская конструкция обладания с «у вас» идиоматично передаёт греческое ἔχετε в отрицательном вопросе.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: Они ответили Ему
  rationale: Естественная и точная передача стандартной повествовательной формулы.
- source_word: Οὔ
  choice: Нет
  rationale: Краткий отрицательный ответ в соответствии с греческим текстом.
