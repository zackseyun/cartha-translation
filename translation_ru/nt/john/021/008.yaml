    text: Двести локтей — около 90 метров.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «сеть рыб»; вероятно, имеется в виду сеть, в которой находилась рыба.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄλλοι μαθηταὶ
  choice: А остальные ученики
  rationale: δέ связывает повествование и одновременно отмечает отличие их действий от поступка Петра в предыдущем стихе; русское «а» естественно передаёт обе функции.
- source_word: τῷ πλοιαρίῳ ἦλθον
  choice: приплыли на небольшой лодке
  rationale: πλοιάριον — уменьшительная форма со значением небольшой лодки; контекст движения по воде позволяет естественно передать ἦλθον глаголом «приплыли».
- source_word: οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς
  choice: потому что были недалеко от берега
  rationale: γάρ вводит объяснение; γῆ в противопоставлении воде контекстуально означает берег или сушу, причём «берег» здесь звучит естественнее.
- source_word: ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων
  choice: примерно в двухстах локтях
  rationale: ὡς указывает на приблизительность, а древняя мера πῆχυς сохранена в основном тексте и пояснена в сноске.
- source_word: σύροντες
  choice: таща
  rationale: Причастие настоящего времени обозначает действие, сопровождавшее их приближение; «таща» сохраняет оттенок физического усилия.
- source_word: τὸ δίκτυον τῶν ἰχθύων
  choice: сеть с рыбой
  rationale: Родительный τῶν ἰχθύων допускает более буквальное «сеть рыб», но в данном контексте естественно обозначает содержимое сети. Перевод «с рыбой» не добавляет отсутствующего в греческом тексте прямого утверждения, что сеть была полной.
