  yaml_path: translation/nt/john/021/008.yaml
  text: But the other disciples came in the small boat[a], for they were not far from the land, but about two hundred cubits away[c][b], dragging the net of fish.
translation:
  language: ru
  text: А остальные ученики приплыли на небольшой лодке, потому что были недалеко от берега — примерно в двухстах локтях[a], — таща сеть с рыбой[b].
  philosophy: optimal-equivalence
  footnotes:
