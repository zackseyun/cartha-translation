  text: ἦσαν ὁμοῦ Σίμων Πέτρος καὶ Θωμᾶς ὁ λεγόμενος Δίδυμος καὶ Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας καὶ οἱ τοῦ Ζεβεδαίου καὶ ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/002.yaml
  text: Simon Peter[a], Thomas called Didymus, Nathanael from Cana of Galilee, the sons of Zebedee, and two others of his disciples were together.
translation:
  language: ru
  text: Вместе были Симон Пётр, Фома, которого называли Близнецом[a], Нафанаил из Каны Галилейской, сыновья Зеведея и ещё двое из его учеников.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Фома, называемый Дидимом». Греческое слово «Дидим» означает «близнец».'
    reason: Сноска поясняет, что «Близнец» передаёт значение греческого обозначения Δίδυμος, и сохраняет его традиционную транслитерацию.
lexical_decisions:
- source_word: ἦσαν ὁμοῦ
  choice: Вместе были
  rationale: Передаёт состояние в прошедшем времени и значение совместного пребывания; начальная позиция естественна для русского повествования и сохраняет акцент на том, что ученики находились вместе.
- source_word: Σίμων Πέτρος
  choice: Симон Пётр
  rationale: Устоявшаяся русская передача личного имени и прозвания.
- source_word: Θωμᾶς ὁ λεγόμενος Δίδυμος
  choice: Фома по прозвищу Близнец[a]
  rationale: Δίδυμος — значимое обозначение со смыслом «близнец»; перевод смысла понятен современному читателю, а сноска сохраняет греческую форму и более буквальную конструкцию.
- source_word: Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας
  choice: Нафанаил из Каны Галилейской
  rationale: Естественно передаёт происхождение, выраженное ἀπό, и традиционное географическое определение.
- source_word: οἱ τοῦ Ζεβεδαίου
  choice: сыновья Зеведея
  rationale: В греческом существительное «сыновья» подразумевается; контекст однозначно требует его восполнения по-русски.
- source_word: ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: ещё двое из его учеников
  rationale: 'Сохраняет число и партитивный смысл ἐκ: это двое из числа его учеников.'
- source_word: καί … καί
  choice: перечисление с запятыми и союзом «и» перед последним элементом
  rationale: Русская синтаксическая норма естественно передаёт многократное греческое соединение членов списка без обязательного повторения каждого καί.
