lexical_decisions:
- source_word: λέγει
  choice: сказал
  rationale: Греческое историческое настоящее в русском повествовании естественно передаётся прошедшим временем; ход рассказа при этом сохраняется.
- source_word: Ἐνέγκατε
  choice: Принесите
  rationale: Аористный императив множественного числа выражает прямое повеление принести рыбу к Иисусу.
- source_word: ἀπὸ τῶν ὀψαρίων
  choice: несколько рыб из тех
  rationale: 'Предлог ἀπό с родительным здесь имеет партитивный смысл: речь идёт о части улова. Русское выражение естественно передаёт это значение.'
- source_word: ὀψαρίων
  choice: рыб
  rationale: В данном контексте слово обозначает пойманную рыбу; указание на размер или способ приготовления было бы неоправданным уточнением.
- source_word: ὧν ἐπιάσατε
  choice: что вы поймали
  rationale: Относительная конструкция определяет рыб как часть только что сделанного улова.
- source_word: νῦν
  choice: только что
  rationale: В контексте νῦν подчёркивает недавность завершённого улова; «только что» звучит по-русски естественно и точно.
