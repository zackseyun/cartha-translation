source:
  edition: SBLGNT
  text: λέγει αὐτῷ τὸ τρίτον· Σίμων ⸀Ἰωάννου, φιλεῖς με; ἐλυπήθη ὁ Πέτρος ὅτι εἶπεν αὐτῷ τὸ τρίτον· Φιλεῖς με; καὶ ⸀εἶπεν αὐτῷ· Κύριε, ⸂πάντα σὺ⸃ οἶδας, σὺ γινώσκεις ὅτι φιλῶ σε. λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Βόσκε τὰ ⸀πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/017.yaml
  text: He said to him the third time[a], “Simon, son of John, do you love me?” Peter was grieved because he said to him the third time, “Do you love me?” And he said to him, “Lord, you know all things; you know that I love you.” Jesus said to him[b], “Feed my sheep.”
translation:
  language: ru
  text: 'Он сказал ему в третий раз[a]: «Симон, сын Иоанна, любишь ли ты Меня?» Пётр опечалился оттого, что Он в третий раз спросил его: «Любишь ли ты Меня?» — и ответил Ему: «Господи, Ты всё знаешь; Ты знаешь, что я люблю Тебя». Иисус сказал ему[b]: «Паси Моих овец».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь употреблён глагол φιλέω («любить, быть привязанным»), тогда как в двух предыдущих вопросах Иисуса стоял глагол ἀγαπάω. Одни толкователи видят в этой смене существенное различие, другие считают, что в данном контексте значения глаголов пересекаются. Перевод передаёт оба глагола словом «любить», не усиливая различие, которого греческий текст не выражает однозначно.
    reason: lexical_alternative
  - marker: b
    text: 'В ответе Петра по-гречески употреблены два разных глагола со значением «знать»: οἶδα и γινώσκω. По-русски оба здесь естественно переводятся словом «знать»; возможную смысловую нюансировку нельзя выразить без чрезмерного истолкования.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ τρίτον
  choice: в третий раз
  rationale: Естественное русское выражение, точно сохраняющее мотив троекратного вопроса.
- source_word: Σίμων Ἰωάννου
  choice: Симон, сын Иоанна
  rationale: Родительный падеж Ἰωάννου здесь имеет патронимическое значение; чтение «сын Ионы» не соответствует данному греческому тексту.
- source_word: φιλεῖς / φιλῶ
  choice: любишь / люблю
  rationale: Глагол выражает любовь и привязанность. Русское «любить» сохраняет серьёзность разговора и не навязывает спорного резкого различия с ἀγαπάω в предыдущих вопросах.
- source_word: ἐλυπήθη
  choice: опечалился
  rationale: Передаёт скорбь и душевную боль Петра естественным, литературным русским языком.
- source_word: Κύριε
  choice: Господи
  rationale: Традиционная и естественная форма прямого обращения к воскресшему Иисусу, передающая κύριος как «Господь», а не просто вежливое «господин».
- source_word: πάντα σὺ οἶδας
  choice: Ты всё знаешь
  rationale: Точно передаёт всеохватность πάντα и подчёркнутое местоимение σὺ, оставаясь естественным по-русски.
- source_word: οἶδας ... γινώσκεις
  choice: знаешь ... знаешь
  rationale: Оба греческих глагола здесь естественно переводятся русским «знать»; искусственное разведение значений внесло бы чрезмерное толкование.
- source_word: Βόσκε
  choice: Паси
  rationale: В контексте образа овец русское повеление «паси» естественно включает кормление и заботу, сохраняя пастырскую метафору.
- source_word: πρόβατά
  choice: овец
  rationale: πρόβατα означает овец, в отличие от ἀρνία («ягнята») в стихе 15; перевод сохраняет это лексическое различие.
theological_decisions:
- issue: Следует ли выражать резкое различие между φιλέω и ἀγαπάω в разговоре Иисуса с Петром
  choice: Передать φιλέω глаголом «любить», не обозначая в основном тексте иной вид любви
  alternative: Развести глаголы как «любить» и «быть привязанным» либо «дорожить»
  rationale: Различие между этими глаголами в данном контексте спорно и недостаточно устойчиво, чтобы делать его богословски определяющим в переводе. Возможная нюансировка отмечена в сноске.
- issue: Сила исповедания Петра «Ты всё знаешь»
  choice: Сохранить прямое и всеохватное утверждение
  alternative: Сузить смысл до «Ты знаешь всё об этом» либо расширить текст явным догматическим пояснением о всеведении
  rationale: Греческий текст прямо говорит πάντα, «всё». Перевод сохраняет силу высказывания, не сужая и не дополняя его толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Заглавные местоимения в обращении к Иисусу сохранены как устойчивая русская издательская норма. Синтаксис сделан естественным для прямой речи; «спросил» во втором упоминании передаёт речевой акт εἶπεν по контексту.
