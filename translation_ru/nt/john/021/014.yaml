- from: Так Иисус уже в третий раз явился ученикам после того, как был воскрешён из мёртвых.[a]
  to: Это было уже третье явление Иисуса ученикам после того, как Он был воскрешён из мёртвых.[a]
  rationale: Перевод уточнён, чтобы τοῦτο ясно отсылало к описанному явлению, а ἤδη τρίτον передавалось как указание на третий случай. «Явление Иисуса ученикам» — естественная русская передача контекстуального значения ἐφανερώθη; альтернативная конструкция с «явился» вынесена в сноску. Страдательный залог в «был воскрешён из мёртвых» сохранён.
