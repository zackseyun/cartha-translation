base_translation:
  language: en
  yaml_path: translation/nt/john/021/014.yaml
  text: This was now the third time Jesus was revealed to the disciples after he had been raised from the dead[a].
translation:
  language: ru
  text: Это было уже третье явление Иисуса ученикам после того, как Он был воскрешён из мёртвых.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Это уже в третий раз Иисус явился ученикам после того, как был воскрешён из мёртвых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο ἤδη τρίτον
  choice: Так… уже в третий раз
  rationale: Оборот подводит итог только что описанному событию и отмечает его как третье явление; такая русская формулировка естественно передаёт указательное τοῦτο, ἤδη и наречное τρίτον.
- source_word: ἐφανερώθη
  choice: явился
  rationale: В данном контексте пассивная форма φανερόω идиоматически означает, что Иисус сделал Себя видимым ученикам. «Явился» естественно по-русски и сохраняет смысл явления; более формальное «был явлен» возможно, но звучит менее естественно.
- source_word: τοῖς μαθηταῖς
  choice: ученикам
  rationale: Передаёт дательный падеж без добавления отсутствующего в греческом местоимения «Своим».
- source_word: ἐγερθεὶς
  choice: после того, как был воскрешён
  rationale: Временная конструкция ясно выражает предшествование действия причастия, а страдательный залог сохраняет грамматическую форму исходного текста.
- source_word: ἐκ νεκρῶν
  choice: из мёртвых
  rationale: Устойчивое и понятное русское выражение для воскресения, соответствующее греческой формуле.
theological_decisions:
- issue: Залог в выражении ἐγερθεὶς ἐκ νεκρῶν
  choice: после того, как был воскрешён из мёртвых
  alternative: после Своего воскресения из мёртвых / после того, как воскрес из мёртвых
  rationale: Основной текст сохраняет страдательный залог греческого причастия и не заменяет его возвратным или активным выражением.
- issue: Значение ἐφανερώθη
  choice: явился
  alternative: был явлен
  rationale: «Явился» здесь передаёт контекстуальный смысл глагола без вывода о том, кто именно совершил явление; буквальное страдательное «был явлен» сохраняется в примечании как возможная передача формы.
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная формулировка. Сохранены выражение «из мёртвых» и страдательный залог воскресения; для ἐφανερώθη выбран естественный в данном контексте глагол «явился», а формальный вариант отмечен в сноске.
