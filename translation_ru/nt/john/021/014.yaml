    issue: Неясная передача τοῦτο
    rationale: «Так» обычно имеет модальное значение, тогда как τοῦτο указывает на данное, только что описанное событие. «Это было уже третье явление...» сохраняет анафорическую функцию и счёт третьего случая.
  - severity: low
    issue: Сноска не отражает наиболее естественную лексическую альтернативу
    rationale: 'Буквальное «был явлен» возможно, но неестественно в русском. Сноска с «Или: „Это уже в третий раз Иисус явился ученикам...“» яснее фиксирует альтернативную синтаксическую передачу без изменения смысла.'
  revised_text: Это было уже третье явление Иисуса ученикам после того, как Он был воскрешён из мёртвых.[a]
  revised_footnotes:
