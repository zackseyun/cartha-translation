  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ; σύ ⸂μοι ἀκολούθει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/022.yaml
  text: Jesus said to him[a], “If I want him to remain until I come[b], what is that to you? You follow me.”
translation:
  language: ru
  text: 'Иисус сказал ему: «Если Я хочу[a], чтобы он оставался, пока Я не приду[b], что тебе до этого? А ты следуй за Мной».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если Мне угодно, чтобы он оставался…» Греческий глагол может выражать как желание, так и волю.'
    reason: lexical_alternative
  - marker: b
    text: 'Слова «пока Я не приду» намеренно оставлены без уточнения: толкователи по-разному понимают их — как указание на последующий приход Иисуса в историческом событии или на Его окончательное пришествие.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Иисус сказал ему
  rationale: Историческое настоящее передано обычным для русского повествования прошедшим временем.
- source_word: Ἐὰν
  choice: Если
  rationale: Сохраняет условный и гипотетический характер высказывания.
- source_word: θέλω
  choice: Я хочу
  rationale: Естественно передаёт желание или волеизъявление Иисуса, не сужая значение греческого глагола до одного оттенка.
- source_word: μένειν
  choice: чтобы он оставался
  rationale: Передаёт значение «оставаться, пребывать» и не добавляет истолкования «оставаться в живых», хотя контекст допускает такой вывод.
- source_word: ἕως ἔρχομαι
  choice: пока Я не приду
  rationale: Естественная русская временная конструкция, сохраняющая неопределённость того, о каком приходе идёт речь.
- source_word: τί πρὸς σέ;
  choice: что тебе до этого?
  rationale: Современная и прямая передача греческого оборота, которым отклоняется вопрос Петра о судьбе другого ученика.
- source_word: σύ μοι ἀκολούθει
  choice: А ты следуй за Мной
  rationale: «А ты» передаёт подчёркнутое греческое местоимение и противопоставляет обязанность Петра возможной судьбе другого ученика; повеление оставлено кратким и естественным.
theological_decisions:
- issue: Значение прихода Иисуса в выражении ἕως ἔρχομαι
  choice: 'Передано неопределённо: «пока Я не приду».'
  alternative: Уточнить как исторический приход Иисуса, явление после воскресения, суд над Иерусалимом или окончательное пришествие.
  rationale: Сам стих не определяет, какой именно приход имеется в виду; уточнение внесло бы в перевод спорное толкование.
- issue: Смысл μένειν применительно к ученику
  choice: «чтобы он оставался»
  alternative: «чтобы он оставался в живых»
  rationale: В контексте возможен смысл продолжения земной жизни, однако сам глагол этого прямо не говорит; буквальная широта значения сохранена.
translation_notes:
  register: Современный литературный русский язык; речь прямая и достойная. Заглавные местоимения «Я», «Мной» употреблены в соответствии с распространённой русской библейской издательской традицией. Конструкция «А ты» естественно сохраняет эмфатическое противопоставление греческого σύ.
