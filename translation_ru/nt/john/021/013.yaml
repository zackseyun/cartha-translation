  text: Jesus comes and takes the bread and gives it to them[b][a], and the fish likewise.
translation:
  language: ru
  text: Иисус приходит, берёт хлеб и даёт им хлеб[a], и так же — рыбу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисус пришёл, взял хлеб и дал им хлеб». В греческом тексте употреблено повествовательное настоящее время.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и рыбу — таким же образом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: подходит
  rationale: В данной сцене глагол обозначает приближение Иисуса к ученикам и приготовленной пище. Настоящее время сохранено как повествовательное настоящее.
- source_word: λαμβάνει
  choice: берёт
  rationale: Передаёт простое действие с уже находящимся там хлебом без добавочного смысла «подаёт» или «служит».
- source_word: τὸν ἄρτον
  choice: хлеб
  rationale: 'Определённость следует из контекста: речь о хлебе, уже упомянутом в сцене. В русском языке артикль отдельно не выражается.'
- source_word: δίδωσιν αὐτοῖς
  choice: даёт им
  rationale: Объект действия ясен из непосредственно предшествующего слова «хлеб»; его повторение или местоименное выражение по-русски было бы тяжеловесным.
- source_word: τὸ ὀψάριον
  choice: рыбу
  rationale: В контексте слово означает рыбу как пищу; перевод не добавляет не выраженной прямо характеристики «жареную» или «приготовленную».
- source_word: ὁμοίως
  choice: так же
  rationale: 'Кратко сохраняет параллель: с рыбой Иисус поступает так же, как с хлебом.'
theological_decisions:
- issue: Повествовательное настоящее в рассказе о явлении воскресшего Иисуса
  choice: 'Сохранить настоящее время: «подходит, берёт, даёт»'
  alternative: 'Передать прошедшим временем: «подошёл, взял, дал»'
  rationale: Настоящее время отражает повествовательную манеру греческого текста и не предполагает отдельного богословского вывода.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и повествовательно живая. Сохранено историческое настоящее оригинала, а подразумеваемое действие над рыбой не раскрыто лишними словами.
