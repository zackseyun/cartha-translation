  yaml_path: translation/nt/john/021/021.yaml
  text: So when Peter saw him, he says to Jesus, “Lord, what about this man?”
translation:
  language: ru
  text: 'Увидев его, Пётр спросил Иисуса: «Господи, а что будет с ним?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον … ἰδών
  choice: увидев его
  rationale: Естественно передаёт причастную конструкцию и сохраняет указание на ученика, названного в предыдущем стихе.
- source_word: λέγει
  choice: спросил
  rationale: Настоящее историческое в повествовании естественно передано русским прошедшим временем; вопросительная реплика позволяет перевести общее «говорит» как «спросил».
- source_word: οὗτος δὲ τί;
  choice: а что будет с ним?
  rationale: Краткая греческая идиома буквально имеет вид «а этот — что?»; по контексту вопрос относится к дальнейшей участи этого ученика. Русская формулировка передаёт подразумеваемое, не уточняя содержание этой участи.
theological_decisions:
- issue: Подразумеваемый смысл эллиптического вопроса οὗτος δὲ τί;
  choice: а что будет с ним?
  alternative: а он что? / а как же он?
  rationale: Контекст ответа Иисуса в следующем стихе показывает, что Пётр спрашивает о дальнейшей участи ученика. Формулировка сохраняет общность вопроса и не сводит его исключительно к способу смерти или конкретному служению.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная повествовательная фраза и почтительное обращение «Господи».
