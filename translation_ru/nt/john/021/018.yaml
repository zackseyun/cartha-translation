source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι, ὅτε ἦς νεώτερος, ἐζώννυες σεαυτὸν καὶ περιεπάτεις ὅπου ἤθελες· ὅταν δὲ γηράσῃς, ἐκτενεῖς τὰς χεῖράς σου, καὶ ἄλλος ⸂σε ζώσει⸃ καὶ οἴσει ὅπου οὐ θέλεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/018.yaml
  text: Truly[a], truly, I say to you, when you were younger, you used to dress yourself and walk where you wanted; but when you grow old, you will stretch out your hands[c][b], and another will dress you and carry you where you do not want to go.
translation:
  language: ru
  text: 'Истинно, истинно говорю тебе: когда ты был моложе, ты сам подпоясывался[a] и ходил, куда хотел. Но когда состаришься, протянешь руки[b], и другой подпояшет тебя и поведёт[c] туда, куда ты не хочешь идти.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «опоясывался». Греческий глагол означает закреплять или подвязывать одежду поясом; здесь прежняя самостоятельность Петра противопоставлена его будущей зависимости от другого.'
    reason: lexical_alternative
  - marker: b
    text: Слова «протянешь руки» часто понимают как намёк на смерть Петра через распятие; следующий стих поясняет, что Иисус сказал это, указывая, какой смертью Пётр прославит Бога.
    reason: cross_reference
  - marker: c
    text: 'Или: «понесёт»; «отведёт». Греческий глагол может обозначать, что человека несут или уводят к месту, куда он не желает идти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Истинно, истинно
  rationale: Сохраняет торжественную удвоенную формулу и передаёт её ясным, укоренившимся в русском библейском языке выражением.
- source_word: λέγω σοι
  choice: говорю тебе
  rationale: Близко передаёт прямое обращение и характерную для Евангелия от Иоанна формулу.
- source_word: ὅτε ἦς νεώτερος
  choice: когда ты был моложе
  rationale: Сохраняет сравнительную форму νεώτερος и противопоставление будущей старости Петра.
- source_word: ἐζώννυες σεαυτόν
  choice: ты сам подпоясывался
  rationale: Передаёт буквальный образ закрепления одежды поясом и подчёркивает прежнюю самостоятельность Петра.
- source_word: περιεπάτεις ὅπου ἤθελες
  choice: ходил, куда хотел
  rationale: Передаёт обычное физическое передвижение и свободу выбора без внесения нравственного значения глагола.
- source_word: ὅταν δὲ γηράσῃς
  choice: но когда состаришься
  rationale: Естественно передаёт направленное в будущее условно-временное выражение и контраст δέ.
- source_word: ἐκτενεῖς τὰς χεῖράς σου
  choice: протянешь руки
  rationale: Сохраняет конкретный образ, не превращая его в основном тексте в прямое упоминание распятия.
- source_word: ἄλλος σε ζώσει
  choice: другой подпояшет тебя
  rationale: Сохраняет лексическую связь с прежним самостоятельным подпоясыванием и контраст между самостоятельностью и зависимостью.
- source_word: οἴσει
  choice: поведёт
  rationale: В данном контексте естественно выражает принудительное перемещение к нежеланному месту; буквальные оттенки «понесёт» и «отведёт» отмечены в сноске.
- source_word: ὅπου οὐ θέλεις
  choice: туда, куда ты не хочешь
  rationale: По-русски естественно обозначает нежеланное место назначения, не добавляя в основной текст лишнего поясняющего глагола.
theological_decisions:
- issue: Следует ли прямо истолковать слова как предсказание распятия в основном тексте
  choice: Сохранить конкретный, но не истолкованный образ в основном тексте
  alternative: Передать слова как прямое предсказание распятия или связывания Петра
  rationale: Следующий стих сам объясняет, что Иисус говорил о смерти, которой Пётр прославит Бога. Буквальная образность здесь сохраняет последовательность повествования и не устраняет намеренную недосказанность раньше времени.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Подпоясывался / подпояшет» понятно из контекста и сохраняет повтор одного греческого глагола; синтаксис остаётся плавным и доступным.
