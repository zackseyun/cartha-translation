  text: But he said to them[a], “Cast the net on the right side of the boat, and you will find some.” So they cast it, and they were no longer able to haul it in because of the multitude of fish.
translation:
  language: ru
  text: 'Он же сказал им: «Закиньте сеть по правую сторону лодки — и найдёте[a]». Они закинули и уже не могли вытащить её из-за множества рыбы.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть найдёте рыбу. В греческом тексте дополнение не названо прямо, но подразумевается из контекста.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βάλετε
  choice: Закиньте
  rationale: В контексте рыбной ловли естественно обозначает забрасывание сети и передаёт повелительное наклонение.
- source_word: τὰ δεξιὰ μέρη τοῦ πλοίου
  choice: с правой стороны лодки
  rationale: Естественно передаёт направление без буквального и неидиоматичного «в правые части лодки».
- source_word: τὸ δίκτυον
  choice: сеть
  rationale: Прямое соответствие названию рыболовной сети; определённость понятна из контекста.
- source_word: καὶ εὑρήσετε
  choice: и найдёте
  rationale: Сохраняет отсутствие выраженного дополнения в греческом тексте; объект ясен из контекста рыбной ловли.
- source_word: οὐκέτι αὐτὸ ἑλκύσαι ἴσχυον
  choice: уже не могли вытащить её
  rationale: Передаёт как невозможность из-за недостатка сил, так и физическое вытягивание сети; «её» согласуется с русским словом «сеть».
- source_word: ἀπὸ τοῦ πλήθους τῶν ἰχθύων
  choice: из-за множества рыбы
  rationale: Передаёт причинное значение ἀπό и количественный смысл πλήθος в современном литературном русском.
