- from: 'Симон Пётр говорит им[a]: «Я иду ловить рыбу». Они отвечают ему: «И мы пойдём с тобой». Они вышли, сели в лодку, но в ту ночь ничего не поймали.'
  to: 'Симон Пётр говорит им[a]: «Я иду рыбачить». Они говорят ему: «Мы тоже идём с тобой». Они вышли, сели в лодку и в ту ночь ничего не поймали.'
  rationale: Убран не выраженный в оригинале противопоставительный союз «но». Нейтральное «говорят» точнее передаёт λέγουσιν, а «иду рыбачить» — естественная русская передача сочетания Ὑπάγω ἁλιεύειν. Сохранены историческое настоящее и смысл решения учеников присоединиться к Петру.
