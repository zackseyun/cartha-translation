base_translation:
  language: en
  yaml_path: translation/nt/john/021/003.yaml
  text: Simon Peter said to them[a], “I am going to fish.” They said to him, “We are also coming with you.” They went out and got into the boat, and that night they caught nothing.
translation:
  language: ru
  text: 'Симон Пётр говорит им[a]: «Я иду рыбачить». Они говорят ему: «Мы тоже идём с тобой». Они вышли, сели в лодку и в ту ночь ничего не поймали.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь употреблено историческое настоящее: «говорит… говорят». Это обычный приём живого повествования.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει ... λέγουσιν
  choice: говорит ... отвечают
  rationale: Сохранён греческий исторический презенс, естественный и выразительный в русском повествовании. Во второй реплике «отвечают» контекстуально передаёт речевую реакцию, не меняя содержания.
- source_word: Ὑπάγω ἁλιεύειν
  choice: Я иду ловить рыбу
  rationale: Передаёт движение и цель инфинитива без избыточного повторения; выражение естественно для современного русского языка.
- source_word: Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί
  choice: И мы пойдём с тобой
  rationale: «И мы» сохраняет эмфатическое καὶ ἡμεῖς, а «с тобой» — значение совместности σύν. Будущее «пойдём» естественно передаёт намерение присоединиться к Петру в данной ситуации.
- source_word: ἐξῆλθον
  choice: вышли
  rationale: Прямо передаёт значение глагола движения и сохраняет последовательность действий.
- source_word: ἐνέβησαν εἰς τὸ πλοῖον
  choice: сели в лодку
  rationale: Естественный русский эквивалент посадки в небольшое рыбацкое судно; πλοῖον в данном контексте передано как «лодка».
- source_word: ἐν ἐκείνῃ τῇ νυκτὶ
  choice: в ту ночь
  rationale: Идиоматично и точно передаёт временное обстоятельство.
- source_word: ἐπίασαν οὐδέν
  choice: ничего не поймали
  rationale: В контексте рыбной ловли πιάζω означает «ловить, поймать»; οὐδέν подчёркивает полное отсутствие улова.
