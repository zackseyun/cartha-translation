  source_fidelity: В черновике верно переданы историческое настоящее в вводящих реплики глаголах, намерение Петра, совместное действие учеников, выход, посадка в лодку и отсутствие улова. Однако союз «но» перед «в ту ночь» отсутствует в греческом тексте и вводит невыраженное противопоставление. «Отвечают» допустимо по контексту, но λέγουσιν нейтральнее передать как «говорят».
  naturalness: Текст в целом звучит современно и литературно. «Я иду рыбачить» — более естественная русская передача Ὑπάγω ἁλιεύειν, чем «Я иду ловить рыбу». «Мы тоже идём с тобой» естественно выражает решение присоединиться и сохраняет настоящее время оригинала.
  terminology: Имена, «лодка» для πλοῖον и рыболовное «ничего не поймали» переданы уместно. Богословски нагруженных терминов в стихе нет. Сноска корректно объясняет историческое настоящее и привязана к соответствующему месту.
