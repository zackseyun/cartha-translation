  text: Καὶ ⸀τοῦτο εἰποῦσα ἀπῆλθεν καὶ ἐφώνησεν ⸀Μαριὰμ τὴν ἀδελφὴν αὐτῆς λάθρᾳ εἰποῦσα· Ὁ διδάσκαλος πάρεστιν καὶ φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/028.yaml
  text: And after saying this[a], she went away and called Mary her sister privately, saying[c][b], “The Teacher is here and is calling for you.”
translation:
  language: ru
  text: 'Сказав это, она ушла и позвала свою сестру Марию наедине[a], сказав: «Учитель[b] здесь и зовёт тебя[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тайком». Греческое наречие указывает, что Марфа обратилась к Марии не при всех.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Наставник». Греч. «Учитель».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «вызывает тебя»; то есть просит тебя прийти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο εἰποῦσα
  choice: Сказав это
  rationale: Деепричастный оборот естественно передаёт предшествующее действие аористного причастия и сохраняет связь с предыдущими словами Марфы.
- source_word: ἀπῆλθεν
  choice: она ушла
  rationale: Простое повествовательное соответствие со значением удаления с места действия.
- source_word: ἐφώνησεν Μαριὰμ τὴν ἀδελφὴν αὐτῆς
  choice: позвала свою сестру Марию
  rationale: φωνέω здесь означает позвать человека; порядок слов естественен для современного русского и ясно показывает, что Мария — сестра Марфы.
- source_word: λάθρᾳ
  choice: наедине
  rationale: Передаёт сообщение вне всеобщего слуха, не приписывая Марфе обмана или страха. Позиция наречия допускает связь с самим обращением к Марии.
- source_word: Ὁ διδάσκαλος
  choice: Учитель
  rationale: Сохраняет обычное лексическое значение διδάσκαλος и уважительное титульное употребление без усиления до «Господин» или «Владыка».
- source_word: πάρεστιν
  choice: здесь
  rationale: В составе русского именного предложения «Учитель здесь» естественно выражает значение присутствия.
- source_word: φωνεῖ σε
  choice: зовёт тебя
  rationale: Настоящее время сохранено; выражение естественно означает, что Иисус просит Марию прийти, не добавляя отдельного глагола «просит».
theological_decisions:
- issue: Передача титула διδάσκαλος
  choice: Учитель
  alternative: Наставник; Господин
  rationale: «Учитель» прямо передаёт греческое слово и сохраняет уважительный, но не расширенный богословски титул.
- issue: Оттенок λάθρᾳ
  choice: наедине
  alternative: тайно; тихо
  rationale: Выбранный вариант обозначает непубличность речи, не утверждая скрытого мотива и не сводя значение только к громкости голоса.
- issue: Характер действия φωνεῖ σε
  choice: зовёт тебя
  alternative: позвал тебя; просит тебя прийти
  rationale: Настоящее время и краткость греческой фразы сохранены; цель зова понятна из контекста, но не внесена в основной текст как явное пояснение.
translation_notes:
  register: Современный литературный русский язык; краткое и плавное повествование. Сохранён уважительный титул «Учитель», а непубличный характер обращения передан без излишнего оттенка заговора или обмана.
