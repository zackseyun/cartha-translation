  text: ἐδάκρυσεν ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/035.yaml
  text: Jesus wept[a].
translation:
  language: ru
  text: Иисус прослезился[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисус пролил слёзы». Греческий глагол обозначает пролитие слёз и отличается от глагола, передающего громкий плач или причитание в этом повествовании.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδάκρυσεν
  choice: прослезился
  rationale: Аорист действительного залога, изъявительного наклонения, 3-го лица единственного числа от δακρύω обозначает пролитие слёз. «Прослезился» естественно и кратко передаёт тихое проявление слёз, не усиливая его до громкого плача и не навязывая форме начинательного значения.
- source_word: ὁ Ἰησοῦς
  choice: Иисус
  rationale: Личное имя с артиклем является подлежащим; в русском языке артикль перед личным именем не передаётся.
theological_decisions:
- issue: Эмоциональное проявление Иисуса
  choice: Иисус прослезился
  alternative: Иисус пролил слёзы
  rationale: Перевод прямо сохраняет свидетельство текста о подлинном человеческом чувстве Иисуса, не умаляя его и не превращая в более сильное причитание, которого данный греческий глагол сам по себе не выражает.
translation_notes:
  register: Краткая, естественная и торжественно-сдержанная формулировка современного литературного русского языка. Выбор «прослезился» сохраняет отличие δακρύω от более громкого плача, описанного в ближайшем контексте.
