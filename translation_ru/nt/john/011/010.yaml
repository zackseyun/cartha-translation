  text: ἐὰν δέ τις περιπατῇ ἐν τῇ νυκτί, προσκόπτει, ὅτι τὸ φῶς οὐκ ἔστιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/010.yaml
  text: But if anyone walks in the night[a], he stumbles, because the light is not in him.
translation:
  language: ru
  text: Но кто ходит ночью, тот спотыкается, потому что в нём нет света.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что свет не с ним». Буквально по-гречески: «света нет в нём», что может означать не только отсутствие внешнего освещения.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν δέ τις
  choice: Но кто
  rationale: Естественная русская обобщённо-условная конструкция; «но» сохраняет противопоставление предыдущему стиху, а «кто» передаёт неопределённое τις без тяжеловесного «если кто-нибудь».
- source_word: περιπατῇ
  choice: ходит
  rationale: Сохраняет буквальный образ ходьбы и допускает его переносный нравственно-духовный смысл.
- source_word: ἐν τῇ νυκτί
  choice: ночью
  rationale: Естественно передаёт временно-образное значение выражения, не заменяя «ночь» толкованием «тьма».
- source_word: προσκόπτει
  choice: спотыкается
  rationale: Передаёт как физический образ, так и возможный переносный смысл глагола.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно выражает причинную связь.
- source_word: τὸ φῶς
  choice: света
  rationale: В русской конструкции «в нём нет света» родительный падеж естественен; контекст сохраняет определённость данного образа.
- source_word: οὐκ ἔστιν ἐν αὐτῷ
  choice: в нём нет
  rationale: Точно сохраняет ἐν — «в», не сводя фразу к отсутствию внешнего освещения.
theological_decisions:
- issue: Смысл выражения «света нет в нём»
  choice: 'Сохранить внутреннюю локализацию: «в нём нет света»'
  alternative: «при нём нет света» / «у него нет света» как указание лишь на отсутствие внешнего освещения
  rationale: Греческое ἐν αὐτῷ буквально указывает на пребывание света «в нём». Такая передача сохраняет напряжение между непосредственным образом ночной ходьбы и более глубоким богословским смыслом света у Иоанна.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная фраза с сохранением образности и богословской многозначности оригинала.
