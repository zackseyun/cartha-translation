id: JHN.11.31
reference: John 11:31
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν, ἰδόντες τὴν ⸀Μαριὰμ ὅτι ταχέως ἀνέστη καὶ ἐξῆλθεν, ἠκολούθησαν αὐτῇ ⸀δόξαντες ὅτι ὑπάγει εἰς τὸ μνημεῖον ἵνα κλαύσῃ ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/031.yaml
  text: So the Jews who were with her in the house and comforting her[a], when they saw that Mary got up quickly and went out, followed her, thinking that she was going to the tomb to weep there.
translation:
  language: ru
  text: Тогда иудеи, которые были с Марией в доме и утешали её, увидев, что Мария быстро встала и вышла, пошли за ней, думая, что она идёт к гробнице, чтобы плакать там.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ οὖν Ἰουδαῖοι
  choice: Иудеи
  rationale: οὖν здесь служит связкой в повествовании и не требует отдельного слова в естественном русском синтаксисе. Ἰουδαῖοι передано как «иудеи»; контекст уточняет, что речь о находившихся с Марией участниках траура.
- source_word: οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν
  choice: которые были с Марией в доме и утешали её
  rationale: Определительный оборот ясно указывает конкретную группу; παραμυθέομαι означает утешать, ободрять словами.
- source_word: ταχέως ἀνέστη καὶ ἐξῆλθεν
  choice: она поспешно встала и вышла
  rationale: ἀνέστη в данном контексте означает вставание с места, а не воскресение; «поспешно» сохраняет наречный оттенок ταχέως и звучит литературно.
- source_word: ἠκολούθησαν αὐτῇ
  choice: последовали за ней
  rationale: Передаёт обычное физическое следование без привнесения ученического смысла.
- source_word: δόξαντες ὅτι ὑπάγει
  choice: полагая, что она идёт
  rationale: Причастие δόξαντες выражает предположение; настоящее ὑπάγει сохранено естественным русским настоящим временем в придаточном.
- source_word: εἰς τὸ μνημεῖον
  choice: к гробнице
  rationale: μνημεῖον обозначает погребальное сооружение; «гробница» точнее, чем «могила», для данного контекста.
- source_word: ἵνα κλαύσῃ ἐκεῖ
  choice: чтобы там оплакать Лазаря
  rationale: ἵνα выражает цель. Русское «оплакать» естественно передаёт погребальный плач; подразумеваемый объект назван для ясности и отмечен сноской.
theological_decisions:
- issue: Значение Ἰουδαῖοι в повествовании Иоанна
  choice: Иудеи
  alternative: Жители Иудеи
  rationale: Термин у Иоанна контекстуален. Здесь это не обобщение обо всём народе и не обозначение властей, а конкретные люди, утешавшие Марию. Основной текст сохраняет прямое значение, а контекст ограничивает референт.
- issue: Объект плача в ἵνα κλαύσῃ ἐκεῖ
  choice: оплакать Лазаря
  alternative: плакать там
  rationale: Греческий текст буквально не называет объект плача, однако траурный контекст делает его понятным. Добавление имени обеспечивает естественность русского выражения, а сноска сохраняет формальную открытость оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Синтаксис сглажен без изменения последовательности событий; уточняющая сноска сохраняет буквальную форму последней фразы.
