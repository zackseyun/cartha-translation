id: JHN.11.54
reference: John 11:54
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸂Ὁ οὖν Ἰησοῦς⸃ οὐκέτι παρρησίᾳ περιεπάτει ἐν τοῖς Ἰουδαίοις, ἀλλὰ ἀπῆλθεν ἐκεῖθεν εἰς τὴν χώραν ἐγγὺς τῆς ἐρήμου, εἰς Ἐφραὶμ λεγομένην πόλιν, κἀκεῖ ⸀ἔμεινεν μετὰ τῶν ⸀μαθητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/054.yaml
  text: So Jesus no longer walked openly among the Jews[a], but departed from there to the region near the wilderness, to a city called Ephraim, and stayed there with the disciples.
translation:
  language: ru
  text: Поэтому Иисус уже не ходил открыто среди иудеев[a], а ушёл оттуда в местность близ пустыни, в город под названием Ефраим, и оставался там с учениками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди жителей Иудеи». В Евангелии от Иоанна слово «иудеи» в зависимости от контекста может обозначать жителей Иудеи или иудейских руководителей, а не обязательно весь еврейский народ.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Поэтому
  rationale: Передаёт следствие из предшествующего рассказа о заговоре против Иисуса и сохраняет логическую связь повествования.
- source_word: οὐκέτι
  choice: уже не
  rationale: Естественно выражает прекращение прежнего образа действий.
- source_word: παρρησίᾳ
  choice: открыто
  rationale: В данном контексте означает публичность и отсутствие сокрытия, а не внутреннюю смелость.
- source_word: περιεπάτει
  choice: ходил
  rationale: Сохраняет образ исходного глагола и по-русски может обозначать свободное передвижение среди людей.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: среди иудеев
  rationale: Сохраняет обычное соответствие многозначному Ἰουδαῖοι; возможный региональный смысл разъяснён в сноске, чтобы не сводить выражение ни ко всему еврейскому народу, ни исключительно к властям.
- source_word: ἀπῆλθεν ἐκεῖθεν
  choice: ушёл оттуда
  rationale: Кратко и естественно передаёт повествовательное движение из прежнего места.
- source_word: χώραν
  choice: местность
  rationale: Обозначает территорию или округ, а не государство; «местность» естественно сочетается с указанием на близость пустыни.
- source_word: ἐγγὺς τῆς ἐρήμου
  choice: близ пустыни
  rationale: Передаёт близость к безлюдной, пустынной области и сохраняет библейскую географическую лексику.
- source_word: εἰς Ἐφραὶμ λεγομένην πόλιν
  choice: в город под названием Ефраим
  rationale: Естественно передаёт πόλις и причастную конструкцию λεγομένην без излишней буквальности.
- source_word: κἀκεῖ ἔμεινεν
  choice: и оставался там
  rationale: В контексте перемещения μένω означает пребывание в указанном месте; несовершенный вид по-русски подчёркивает продолжительность пребывания.
- source_word: μετὰ τῶν μαθητῶν
  choice: с учениками
  rationale: Не добавляет отсутствующее в греческом тексте притяжательное местоимение, при этом референт ясен из контекста.
theological_decisions:
- issue: Значение Ἰουδαῖοι в Евангелии от Иоанна
  choice: среди иудеев
  alternative: среди жителей Иудеи
  rationale: В Евангелии от Иоанна слово может иметь этнический, региональный или связанный с руководителями смысл. Здесь речь идёт о публичном передвижении Иисуса в определённой общественно-географической среде; основной текст сохраняет традиционную формулировку, а сноска отмечает вероятный региональный оттенок и предостерегает от неоправданного обобщения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис ясен для широкого читателя; выражения «ушёл оттуда» и «под названием» избегают канцелярской тяжеловесности. Маркер [a] присутствует в основном тексте.
