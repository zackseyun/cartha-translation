  to: Итак, услышав, что Лазарь болен[a], Иисус оставался там, где находился, ещё два дня.
  rationale: Убрано уступительное «всё же», поскольку оно не является безопасным прямым соответствием τότε μὲν и придаёт фразе излишне уступительный смысл. Глагол заменён на «оставался», а обстоятельства переставлены для более естественного русского порядка слов; «ещё два дня» сохраняет указание на дальнейшее пребывание после услышанного известия. Сноска сохранена с небольшой стилистической правкой.
