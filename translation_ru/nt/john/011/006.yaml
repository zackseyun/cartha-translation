  text: ὡς οὖν ἤκουσεν ὅτι ἀσθενεῖ, τότε μὲν ἔμεινεν ἐν ᾧ ἦν τόπῳ δύο ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/006.yaml
  text: So when he heard that he was sick[a], he then stayed two days in the place where he was.
translation:
  language: ru
  text: Итак, услышав, что Лазарь болен[a], Иисус оставался там, где находился, ещё два дня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «что он болеет».'
    reason: В основном тексте имя «Лазарь» употреблено для ясности референта; греческий текст использует глагол в настоящем времени без выраженного подлежащего.
lexical_decisions:
- source_word: ὡς οὖν
  choice: Итак, услышав
  rationale: Передаёт и связь с предыдущим контекстом через οὖν, и временное значение ὡς; деепричастная конструкция естественна для современного русского повествования.
- source_word: ἤκουσεν
  choice: услышав
  rationale: Сохраняет обычное значение ἀκούω и не добавляет подразумеваемого источником значения «ему сообщили».
- source_word: ὅτι ἀσθενεῖ
  choice: что Лазарь болен
  rationale: В контексте ἀσθενέω означает физическую болезнь. Настоящее время греческого глагола естественно сохраняется в русском косвенном сообщении; имя «Лазарь» восстанавливает понятный референт местоимения без смысловой неоднозначности в контексте.
- source_word: τότε μὲν
  choice: всё же
  rationale: 'Передаёт заметное контрастное напряжение: именно после известия о болезни Иисус остался. Частица μέν соотносится с последующим развитием повествования, а буквальное «тогда же» по-русски могло бы быть понято лишь как указание времени.'
- source_word: ἔμεινεν
  choice: пробыл
  rationale: В сочетании с длительностью «два дня» естественно выражает пребывание на прежнем месте.
- source_word: ἐν ᾧ ἦν τόπῳ
  choice: там, где находился
  rationale: Естественно и достаточно близко передаёт греческое указание на место без тяжеловесного «в том месте, где находился».
- source_word: δύο ἡμέρας
  choice: два дня
  rationale: Прямо передаёт винительный длительности.
theological_decisions:
- issue: Смысловая напряжённость задержки Иисуса после известия о болезни Лазаря
  choice: Прямо сообщить, что, услышав о болезни, Иисус всё же остался ещё на два дня.
  alternative: Смягчить формулировку или объяснить задержку как заранее продуманный сострадательный замысел.
  rationale: Исходный текст намеренно ставит рядом известие о болезни и задержку Иисуса. Перевод сохраняет это напряжение и не объясняет его внутри стиха.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинный. Формулировка избегает канцелярского «оставался в том месте» и сохраняет повествовательное напряжение оригинала.
