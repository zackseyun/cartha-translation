id: JHN.11.47
reference: John 11:47
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: συνήγαγον οὖν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι συνέδριον, καὶ ἔλεγον· Τί ποιοῦμεν ὅτι οὗτος ὁ ἄνθρωπος πολλὰ ⸂ποιεῖ σημεῖα⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/047.yaml
  text: So the chief priests and the Pharisees gathered a council and were saying[a], “What are we doing? For this man is doing many signs.”
translation:
  language: ru
  text: 'Тогда первосвященники и фарисеи созвали совет[a] и говорили: «Что же мы делаем? Ведь этот человек совершает много знамений».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «Синедрион» — высший иудейский совет.
    reason: Уточняет вероятный институциональный смысл слова συνέδριον, сохраняя в основном тексте более прямое «совет».
lexical_decisions:
- source_word: συνήγαγον
  choice: созвали
  rationale: Аорист συνάγω с дополнением συνέδριον означает, что руководители собрали или созвали совет; «созвали» естественно передаёт целенаправленное действие.
- source_word: οὖν
  choice: тогда
  rationale: Передаёт повествовательное следствие предшествующих событий, не превращая связку в чрезмерно формальный логический вывод.
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся русское обозначение ведущих представителей священнической власти; множественное число не подразумевает нескольких одновременно действующих первосвященников в строгом смысле.
- source_word: Φαρισαῖοι
  choice: фарисеи
  rationale: Устоявшееся русское название этой иудейской религиозной группы.
- source_word: συνέδριον
  choice: совет
  rationale: Сохраняет значение собрания руководителей, не подменяя греческое слово техническим названием «Синедрион»; вероятная институциональная отсылка пояснена в сноске.
- source_word: ἔλεγον
  choice: говорили
  rationale: Несовершенный вид естественно передаёт имперфект и представляет речь как продолжавшееся обсуждение.
- source_word: Τί ποιοῦμεν
  choice: Что же мы делаем?
  rationale: Сохраняет форму настоящего изъявительного наклонения и выражает тревожное недовольство собственным бездействием, не заменяя фразу более истолковывающим «Что нам делать?».
- source_word: ὅτι
  choice: ведь
  rationale: Естественно вводит в прямой речи основание для тревожного вопроса.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: этот человек
  rationale: Точно и естественно передаёт указательное выражение, включая его возможный отчуждённый оттенок.
- source_word: πολλὰ ποιεῖ σημεῖα
  choice: совершает много знамений
  rationale: «Совершает» идиоматично сочетается со «знамениями», а настоящее время сохраняет продолжающийся характер действия. «Знамения» удерживает важный для Иоанна смысл деяний, указывающих на личность Иисуса, без сведения их просто к чудесам.
theological_decisions:
- issue: Передача σημεῖα в Евангелии от Иоанна
  choice: знамения
  alternative: чудеса; чудесные знамения
  rationale: У Иоанна σημεῖα — не только сверхъестественные дела, но и указывающие на личность Иисуса свидетельства. «Знамения» сохраняет этот богословский вес без поясняющей вставки.
- issue: Передача συνέδριον
  choice: совет
  alternative: Синедрион
  rationale: Основной текст переводит греческое существительное и сохраняет некоторую неоднозначность между собранием и учреждением; вероятное отождествление с иудейским правящим советом дано в сноске.
- issue: Смысл Τί ποιοῦμεν
  choice: Что же мы делаем?
  alternative: Что нам делать?
  rationale: Греческий текст использует настоящее изъявительное наклонение. Выбранный вариант сохраняет упрёк себе за бездействие и не устраняет грамматическое напряжение в пользу явно совещательного вопроса.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Прямая речь звучит естественно, но сохраняет греческое изъявительное «Что же мы делаем?» и богословски значимое «знамения».
