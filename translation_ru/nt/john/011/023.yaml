source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· Ἀναστήσεται ὁ ἀδελφός σου.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/023.yaml
  text: Jesus says to her[a], “Your brother will rise again.”
translation:
  language: ru
  text: 'Иисус говорит ей: «Твой брат воскреснет[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «встанет». В данном контексте греческий глагол означает восстание из мёртвых.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время передаёт характерное для повествования Иоанна историческое настоящее и сохраняет живость греческого текста; по-русски оно здесь звучит естественно.
- source_word: αὐτῇ
  choice: ей
  rationale: Дательный падеж местоимения естественно передаётся русским «ей» при глаголе «говорит».
- source_word: Ἀναστήσεται
  choice: воскреснет
  rationale: В контексте смерти Лазаря глагол означает, что он встанет из мёртвых. Русское «воскреснет» ясно и естественно выражает этот смысл, не вводя явно выраженного в греческой форме указания на внешнего деятеля.
- source_word: ὁ ἀδελφός σου
  choice: твой брат
  rationale: Обычная и точная передача существительного с притяжательным местоимением; в контексте речь идёт о Лазаре.
- source_word: ὁ Ἰησοῦς
  choice: Иисус
  rationale: Традиционная русская форма личного имени; греческий артикль перед именем отдельно не передаётся.
theological_decisions:
- issue: Формулировка воскресения
  choice: воскреснет
  alternative: встанет; будет воскрешён
  rationale: «Воскреснет» передаёт значение вставания из мёртвых, соответствующее контексту, но не уточняет, говорит ли Иисус здесь о скором возвращении Лазаря к жизни или об общем воскресении в последний день. Пассивное «будет воскрешён» сильнее подчёркивало бы внешнего деятеля, чем греческая форма.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная повествовательная формулировка. Историческое настоящее сохранено.
