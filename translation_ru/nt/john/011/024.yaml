base_translation:
  language: en
  yaml_path: translation/nt/john/011/024.yaml
  text: Martha said to him[a], “I know that he will rise again in the resurrection on the last day.”
translation:
  language: ru
  text: 'Марта сказала Ему: «Я знаю, что он воскреснет при воскресении, в последний день».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: сказала
  rationale: Историческое настоящее в греческом тексте естественно передаётся прошедшим временем в современном русском повествовании.
- source_word: αὐτῷ
  choice: Ему
  rationale: Дательный падеж обозначает адресата речи; местоимение ясно относится к Иисусу.
- source_word: Οἶδα
  choice: Я знаю
  rationale: Прямо передаёт уверенное знание Марты без усиления до «я уверена».
- source_word: ἀναστήσεται
  choice: он воскреснет
  rationale: Будущая форма ἀνίστημι в данном контексте означает возвращение умершего к жизни; русский глагол «воскреснет» естественно сохраняет непассивную форму греческого выражения.
- source_word: ἐν τῇ ἀναστάσει
  choice: при воскресении
  rationale: В современном русском это естественное временное выражение для участия в эсхатологическом событии; оно не смешивает воскресение Лазаря с обозначенным далее всеобщим воскресением.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: в последний день
  rationale: Устойчиво и естественно передаёт временное значение ἐν с обозначением дня.
theological_decisions:
- issue: Эсхатологическое воскресение
  choice: «он воскреснет при воскресении в последний день»
  alternative: Общая надежда на существование после смерти
  rationale: Повтор корня ἀνίστημι/ἀνάστασις и выражение «в последний день» указывают на будущее эсхатологическое воскресение, не уточняя сверх текста его doctrинальные детали.
- issue: Связь двух предложных оборотов
  choice: Основной текст понимает «в последний день» как уточнение времени воскресения; сноска сохраняет возможность тесно связать оба оборота в единое выражение.
  alternative: «Он воскреснет — в воскресение последнего дня»
  rationale: 'Греческая последовательность допускает небольшую синтаксическую неоднозначность: второй оборот может уточнять событие воскресения либо непосредственно время глагола.'
translation_notes:
  register: Современный литературный русский язык; реплика проста и уверенно звучит. Прописное «Ему» следует принятой в русском библейском стиле уважительной орфографии для местоимения, относящегося к Иисусу.
