  verdict: revise
  source_fidelity: 'Основной смысл передан верно: Марта выражает уверенность в будущем воскресении умершего, относя его к воскресению в последний день. «Воскреснет» точно передаёт будущее среднее ἀναστήσεται без неоправданного перехода к страдательной форме. Однако предложенная сноска не отражает подлинно спорного места текста и её вариант «в воскресение последнего дня» менее точен: греческий текст говорит «в воскресении, в последний день», а не о «воскресении последнего дня» как едином генитивном сочетании.'
  naturalness: «При воскресении в последний день» понятно и в целом литературно. Небольшая пунктуационная пауза перед уточнением «в последний день» делает фразу яснее и естественнее в современном русском, сохраняя повтор двух греческих предложных оборотов.
  terminology: «Воскреснет», «воскресение» и «последний день» — устойчивые и точные библейские соответствия. Прописное «Ему» допустимо в избранном библейском орфографическом регистре.
