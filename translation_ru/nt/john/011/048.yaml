source:
  edition: SBLGNT
  text: ἐὰν ἀφῶμεν αὐτὸν οὕτως, πάντες πιστεύσουσιν εἰς αὐτόν, καὶ ἐλεύσονται οἱ Ῥωμαῖοι καὶ ἀροῦσιν ἡμῶν καὶ τὸν τόπον καὶ τὸ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/048.yaml
  text: If we let him go on like this[a], everyone will believe in him[b], and the Romans will come and take away both our place and our nation.
translation:
  language: ru
  text: Если мы позволим Ему и дальше действовать так, все поверят в Него, и придут римляне и отнимут у нас и место[a], и народ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наш храм»; греческое слово буквально означает «место» и может относиться к храму или, более широко, к их месту либо положению.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «нашу нацию»; здесь слово может обозначать народ как общность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῶμεν αὐτὸν οὕτως
  choice: позволим Ему и дальше действовать так
  rationale: ἀφίημι имеет здесь разрешительное значение «позволить, допустить», а οὕτως указывает на продолжающийся образ действий Иисуса. Такой перевод естественен по-русски и передаёт мысль о том, что Ему не станут препятствовать.
- source_word: πάντες
  choice: все
  rationale: Передаёт обобщающее значение мужского множественного числа без неоправданного сужения круга людей.
- source_word: πιστεύσουσιν εἰς αὐτόν
  choice: поверят в Него
  rationale: Обычная для Евангелия от Иоанна конструкция πιστεύω εἰς с винительным падежом означает направленную веру или доверие к личности; «поверят в Него» сохраняет эту конструкцию естественным русским языком.
- source_word: ἐλεύσονται οἱ Ῥωμαῖοι
  choice: придут римляне
  rationale: Прямо передаёт будущее время ἔρχομαι и явно названное подлежащее.
- source_word: ἀροῦσιν
  choice: отнимут у нас
  rationale: αἴρω здесь означает «забрать, отнять, устранить». Формулировка не усиливает смысл до однозначного «уничтожат» и естественно сочетается с обоими дополнениями.
- source_word: τόπον
  choice: место
  rationale: 'Буквальное значение τόπος сохраняет неопределённость: речь может идти о храме, территории либо положении и влиянии руководителей.'
- source_word: ἔθνος
  choice: народ
  rationale: В данном контексте ἔθνος обозначает еврейский народ как общность. Русское «народ» естественнее «нации» и не исключает политического измерения угрозы.
- source_word: ἡμῶν καὶ τὸν τόπον καὶ τὸ ἔθνος
  choice: отнимут у нас и наше место, и наш народ
  rationale: Повторённое καί передано парной конструкцией «и …, и …», а ἡμῶν соотнесено с обоими объектами. «У нас» сохраняет оттенок лишения, «наше» ясно выражает принадлежность места говорящим.
theological_decisions:
- issue: Значение выражения «наше место» (τὸν τόπον)
  choice: В основном тексте сохранено широкое слово «место»
  alternative: «наш храм» или «наше положение/влияние»
  rationale: Контекст допускает страх за храм и святую землю, а также за общественно-политическое положение руководителей. Греческое слово не разрешает эту неоднозначность, поэтому перевод её сохраняет.
- issue: Значение ἔθνος
  choice: «наш народ»
  alternative: «наша нация» или «наше государство»
  rationale: Говорящие опасаются последствий для еврейского народа; перевод «народ» не навязывает современное понятие национального государства, но сохраняет коллективный и политический смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизмов. Заглавные местоимения при указании на Иисуса соответствуют принятой русской библейской издательской практике. Связка «и тогда» естественно выражает ожидаемое следствие, заложенное в последовательности греческих предложений.
