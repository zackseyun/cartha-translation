  source_fidelity: 'Основной смысл передан верно: разрешительное ἀφῶμεν, οὕτως, всеобщность πάντες, вера εἰς Иисуса, приход римлян и лишение «места» и «народа» сохранены. Однако «и тогда» вносит в текст явную причинно-следственную связку, которой греческий καί сам по себе не выражает. Примечание к «месту» чрезмерно расширяет возможные значения, вводя «землю» и конкретно «влияние руководителей», тогда как τόπος следует оставить неопъяснённо широким: возможно храм или, более широко, их место/положение.'
