translation:
  language: ru
  text: 'Тогда Иисус сказал им прямо: «Лазарь умер».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε οὖν
  choice: Тогда
  rationale: Сочетание обозначает последовательный переход с оттенком вывода; в данном контексте естественное русское «тогда» передаёт движение повествования без тяжеловесного удвоения связок.
- source_word: εἶπεν αὐτοῖς
  choice: сказал им
  rationale: Прямое соответствие греческой конструкции, естественное для современного литературного русского языка.
- source_word: παρρησίᾳ
  choice: прямо
  rationale: Наречие противопоставляет последующее недвусмысленное сообщение прежним образным словам Иисуса о сне; «прямо» передаёт открытый и ясный характер высказывания.
- source_word: Λάζαρος
  choice: Лазарь
  rationale: Использована укоренившаяся русская библейская форма личного имени.
- source_word: ἀπέθανεν
  choice: умер
  rationale: Простое прошедшее время точно передаёт греческий аорист как совершившееся событие и звучит естественно по-русски.
theological_decisions:
- issue: Характер утверждения Иисуса о состоянии Лазаря
  choice: Недвусмысленное сообщение о физической смерти Лазаря
  alternative: Сохранить прежний образ сна
  rationale: Сам исходный текст снимает неоднозначность прежней метафоры, употребляя прямой глагол ἀπέθανεν («умер»).
translation_notes:
  register: Современный литературный русский язык; краткая и достойная повествовательная формулировка. Порядок слов сохраняет смысловой переход и подчёркивает прямоту разъяснения.
