id: JHN.11.26
reference: John 11:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμὲ οὐ μὴ ἀποθάνῃ εἰς τὸν αἰῶνα· πιστεύεις τοῦτο;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/026.yaml
  text: And everyone who lives and believes in me will certainly never die forever. Do you believe this?
translation:
  language: ru
  text: И всякий, кто живёт и верит в Меня, не умрёт вовек. Веришь ли ты в это?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμέ
  choice: всякий, кто живёт и верит в Меня
  rationale: Сохраняет две параллельные характеристики человека и естественно передаёт конструкцию с субстантивированными причастиями.
- source_word: οὐ μὴ ἀποθάνῃ
  choice: не умрёт
  rationale: Греческое οὐ μή с аористом сослагательного наклонения выражает категорическое отрицание; в русском контексте категоричность поддерживается сочетанием «не умрёт вовек».
- source_word: εἰς τὸν αἰῶνα
  choice: вовек
  rationale: Традиционное, но понятное современному читателю выражение точно передаёт значение «никогда, навеки» и не создаёт неестественного русского сочетания «не умрёт навсегда».
- source_word: πιστεύεις τοῦτο;
  choice: Веришь ли ты в это?
  rationale: Передаёт прямой личный вопрос и сохраняет акцент на вере в только что сказанное.
theological_decisions:
- issue: Соотношение обещания «не умрёт вовек» с физической смертью верующих
  choice: Сохранить без поясняющего уточнения формулировку «не умрёт вовек»
  alternative: «никогда не умрёт духовно» или «хотя и умрёт, будет жить вечно»
  rationale: Исходный текст содержит сильное и намеренно напряжённое утверждение, смысл которого раскрывается в связи с предыдущим стихом. Добавление слова «духовно» либо перефразирование устранило бы подлинную неоднозначность и внесло бы толкование в основной текст.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. «Вовек» слегка возвышенно, но широко понятно и здесь точнее и естественнее разговорных либо громоздких альтернатив.
