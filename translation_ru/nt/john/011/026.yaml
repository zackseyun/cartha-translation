  source_fidelity: 'Текст точно передаёт греческую конструкцию: πᾶς ὁ ζῶν καὶ πιστεύων сохранено как «всякий, кто живёт и верит», направление веры εἰς ἐμέ передано «в Меня», а усиленное отрицание οὐ μὴ ἀποθάνῃ εἰς τὸν αἰῶνα естественно и сильно выражено словами «не умрёт вовек». Вопрос πιστεύεις τοῦτο? передан прямо и без добавочного толкования.'
  naturalness: Формулировка звучит естественно для современного литературного русского и сохраняет достойный библейский регистр. «Вовек» несколько возвышенно, но понятно, идиоматично в данном контексте и удачнее буквального, но неестественного «навсегда не умрёт».
  terminology: «Верит в Меня» точно отражает πιστεύειν εἰς и соответствует обычному русскому библейскому употреблению. Местоименное «Меня» с прописной буквы последовательно оформляет речь Иисуса. Неоднозначное утверждение о смерти не разъясняется доктринально, что верно.
