  yaml_path: translation/nt/john/011/049.yaml
  text: But one of them[a], Caiaphas, who was high priest that year, said to them, “You know nothing at all.”
translation:
  language: ru
  text: 'Но один из них — Каиафа, который был первосвященником в том году, — сказал им: «Вы ровным счётом ничего не знаете».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς δέ τις ἐξ αὐτῶν
  choice: Но один из них
  rationale: Сочетание εἷς… τις естественно обозначает одного человека из упомянутой группы; δέ передано как «но», поскольку реплика Каиафы противопоставлена предшествующему обсуждению.
- source_word: Καϊάφας
  choice: Каиафа
  rationale: Использована устоявшаяся русская форма личного имени.
- source_word: ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: бывший в тот год первосвященником
  rationale: Оборот естественно передаёт причастную конструкцию и временное указание, не добавляя объяснений о характере или продолжительности должности.
- source_word: εἶπεν αὐτοῖς
  choice: сказал им
  rationale: Прямая и нейтральная передача глагола λέγω с косвенным дополнением.
- source_word: Ὑμεῖς οὐκ οἴδατε οὐδέν
  choice: Вы вообще ничего не понимаете!
  rationale: Явное ὑμεῖς и усилительная отрицательная конструкция выражают резкий упрёк. В данном совещательном контексте οἴδατε естественно передано как «понимаете», а «вообще ничего» сохраняет эмфазу.
theological_decisions:
- issue: Временное указание о первосвященстве Каиафы
  choice: бывший в тот год первосвященником
  alternative: который был первосвященником в тот год
  rationale: Фраза сохранена как историко-повествовательное описание без привнесения объяснений о первосвященстве или повествовательной иронии Иоанна.
translation_notes:
  register: Современный литературный русский язык; речь Каиафы передана резко и властно. Восклицательный знак выражает заложенную в греческой фразе эмфазу, не меняя её содержания.
