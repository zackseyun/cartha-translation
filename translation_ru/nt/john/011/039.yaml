base_translation:
  language: en
  yaml_path: translation/nt/john/011/039.yaml
  text: Jesus said[a], “Take away the stone.” Martha, the sister of the dead man, said to him, “Lord, by now he smells[c][b], for he has been dead four days.”
translation:
  language: ru
  text: 'Иисус сказал: «Уберите камень». Марфа, сестра умершего[a], сказала Ему: «Господи, от него уже пахнет[b], ведь он мёртв уже четвёртый день[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сестра того, кто умер».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «он уже смердит»; греческий глагол означает «издавать запах», здесь — неприятный.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «ведь он четвёртого дня», то есть со времени его смерти идёт четвёртый день.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρατε
  choice: Уберите
  rationale: Аористный императив множественного числа от αἴρω здесь означает распоряжение присутствующим отодвинуть камень; «уберите» естественно передаёт действие над камнем, закрывающим гробницу.
- source_word: τὸν λίθον
  choice: камень
  rationale: В контексте гробницы λίθος обозначает камень, закрывавший вход.
- source_word: τοῦ τετελευτηκότος
  choice: умершего
  rationale: Перфектное причастие τελευτάω обозначает того, кто умер и остаётся мёртвым; субстантивированное «умершего» кратко и естественно по-русски.
- source_word: Κύριε
  choice: Господи
  rationale: Форма звательного обращения «Господи» сохраняет вес κύριε в обращении Марфы к Иисусу и соответствует русской библейской речи.
- source_word: ἤδη ὄζει
  choice: от него уже пахнет
  rationale: ὄζω означает «издавать запах»; контекст смерти ясно указывает на неприятный запах. Русское выражение передаёт смысл естественно, не усиливая глагол до разговорного «воняет» и не добавляя прямо идею разложения.
- source_word: τεταρταῖος γάρ ἐστιν
  choice: ведь он мёртв уже четвёртый день
  rationale: Редкое прилагательное τεταρταῖος буквально характеризует человека как находящегося в четвёртом дне; в данном контексте по-русски требуется явно указать, что речь идёт о времени после смерти.
- source_word: λέγει
  choice: сказал / сказала
  rationale: Греческое историческое настоящее в русском повествовании естественно передаётся прошедшим временем, без изменения последовательности событий.
theological_decisions:
- issue: Передача κύριε в обращении Марфы к Иисусу
  choice: Господи
  alternative: Господин / Учитель
  rationale: «Господи» сохраняет возможную богословскую значимость обращения в Евангелии от Иоанна, не заставляя читателя понимать это слово лишь как вежливое светское обращение и не уточняя сверх того, что сказано в тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Прошедшее время выбрано вместо греческого исторического настоящего как наиболее естественное для русского рассказа. Формулировка «от него уже пахнет» сдержанна, понятна и сохраняет эвфемистическую краткость исходного глагола.
