  text: But even now I know that whatever you ask from God, God will give you.
translation:
  language: ru
  text: 'Но и теперь[a] я знаю: чего бы ты ни попросил у Бога, Бог даст тебе.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И теперь». Греческий союз допускает простое соединительное значение, однако в контексте может обозначать и контраст с только что сказанным о смерти Лазаря.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Но и теперь
  rationale: В данном контексте καί связывает слова Марфы с предыдущим признанием смерти Лазаря и вместе с νῦν выражает контраст и сохраняющуюся надежду; «но и теперь» естественно передаёт оба оттенка.
- source_word: οἶδα
  choice: я знаю
  rationale: Форма перфекта имеет настоящее значение и прямо передаётся обычным русским «я знаю».
- source_word: ὅσα ἂν
  choice: чего бы … ни
  rationale: Сочетание относительного местоимения с ἄν выражает неопределённо-всеобщий охват; русская конструкция «чего бы … ни» сохраняет открытость значения.
- source_word: αἰτήσῃ τὸν θεόν
  choice: ты ни попросил у Бога
  rationale: Хотя в греческом θεόν стоит в винительном падеже при αἰτέω, по-русски просьба о чём-либо естественно выражается конструкцией «попросить у Бога».
- source_word: δώσει σοι ὁ θεός
  choice: Бог даст тебе
  rationale: Сохраняются прямое значение δίδωμι, будущее время и явное повторение слова «Бог» без замены на «Отец» или местоимение.
theological_decisions:
- issue: Слова Марфы о том, что Иисус просит Бога и получает от Бога
  choice: 'Сохранить прямую форму речи: «чего бы ты ни попросил у Бога, Бог даст тебе»'
  alternative: Заменить «Бог» на «Отец» или перефразировать фразу, устраняя возможный оттенок подчинённости
  rationale: Это реплика Марфы внутри повествования. Перевод должен сохранять её формулировку и богословское напряжение Евангелия, не внося ни отрицания божественности Иисуса, ни пояснений, отсутствующих в тексте.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным звучанием. Местоимения, обращённые к Иисусу, даны со строчной буквы по общим современным орфографическим нормам; это не выражает богословской оценки.
