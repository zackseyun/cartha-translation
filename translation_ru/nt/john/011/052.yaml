reference: John 11:52
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’ ἵνα καὶ τὰ τέκνα τοῦ θεοῦ τὰ διεσκορπισμένα συναγάγῃ εἰς ἕν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/052.yaml
  text: and not for the nation only[b][a], but also so that he might gather into one the scattered children of God.
translation:
  language: ru
  text: и не только за народ[a], но и для того, чтобы собрать воедино рассеянных детей Божьих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В данном контексте под «народом» подразумевается иудейский народ.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθνους
  choice: народ
  rationale: В ближайшем контексте имеется в виду иудейский народ. «Народ» естественно передаёт единственное число и корпоративный смысл, не расширяя значение до народов вообще.
- source_word: ἵνα
  choice: для того, чтобы
  rationale: Сохраняет целевую, с возможным оттенком результата, связь с предшествующей мыслью о смерти Иисуса.
- source_word: τέκνα τοῦ θεοῦ
  choice: детей Божьих
  rationale: τέκνα обозначает детей без ограничения по полу; традиционное и понятное сочетание «дети Божьи» точно передаёт родительный оборот.
- source_word: τὰ διεσκορπισμένα
  choice: рассеянных
  rationale: Перфектное страдательное причастие описывает пребывание в состоянии рассеяния; русское определение сохраняет это значение естественно и кратко.
- source_word: συναγάγῃ
  choice: собрать
  rationale: Аористный конъюнктив после ἵνα передан инфинитивной целевой конструкцией. Значение собирания вместе дополнительно выражено словом «воедино».
- source_word: εἰς ἕν
  choice: воедино
  rationale: Передаёт краткость и намеренную неопределённость греческого выражения, не добавляя отсутствующих в тексте слов «тело» или «единство».
- source_word: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’
  choice: и не только за народ, но и
  rationale: Продолжает мысль предыдущего стиха о смерти Иисуса за других; «за» естественно передаёт ὑπέρ в данном контексте, а конструкция «не только… но и» сохраняет противопоставление.
theological_decisions:
- issue: Кого обозначают «дети Божьи»
  choice: Сохранено широкое, неуточнённое обозначение рассеянных детей Божьих за пределами упомянутого народа.
  alternative: Только иудеи диаспоры; либо избранные верующие из иудеев и язычников.
  rationale: Текст противопоставляет «народ» более широкой группе рассеянных детей Божьих, но не определяет её состав исчерпывающе. Перевод не разрешает эту богословскую напряжённость за оригинал.
translation_notes:
  register: Современный литературный русский язык; формулировка dignified и доступная. «Воедино» слегка возвышенно, но общеупотребительно в библейском контексте и точно сохраняет лаконичность εἰς ἕν.
