  source_fidelity: 'Текст точно передаёт синтаксическую зависимость от предыдущего стиха: «за народ» соответствует ὑπὲρ τοῦ ἔθνους, а целевая конструкция «для того, чтобы собрать» — ἀλλ’ ἵνα … συναγάγῃ. «Воедино» удачно и без избыточного богословского уточнения передаёт εἰς ἕν. «Рассеянных детей Божьих» сохраняет широту и неопределённость исходного выражения.'
