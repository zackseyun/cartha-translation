  terminology: «Народ» корректно передаёт ἔθνος в контексте; примечание надлежащим образом уточняет, что имеется в виду иудейский народ. «Дети Божьи» соответствует гендерно неограниченному τέκνα τοῦ θεοῦ и не навязывает более узкого толкования. Якорь примечания расположен непосредственно после слова, к которому относится.
