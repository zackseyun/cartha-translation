source:
  edition: SBLGNT
  text: εἶπεν αὐτῇ ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή· ὁ πιστεύων εἰς ἐμὲ κἂν ἀποθάνῃ ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/025.yaml
  text: Jesus said to her[a], “I am the resurrection and the life. The one who believes in me, even if he dies, will live,”
translation:
  language: ru
  text: 'Иисус сказал ей: «Я — воскресение и жизнь. Тот, кто верит в Меня, даже если умрёт, будет жить».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всякий, кто верит в Меня, даже если умрёт, будет жить». В греческом тексте употреблено единственное число мужского рода в обобщающем смысле.'
    reason: Лексическая альтернатива и пояснение представительного мужского рода.
lexical_decisions:
- source_word: εἶπεν αὐτῇ
  choice: сказал ей
  rationale: Прямая и естественная передача повествовательной формулы с дательным местоимением, указывающим в контексте на Марфу.
- source_word: Ἐγώ εἰμι
  choice: Я —
  rationale: Личное местоимение сохраняет эмфатическое самоотождествление; в русском настоящем времени связка обычно опускается, а тире естественно оформляет именную часть сказуемого.
- source_word: ἡ ἀνάστασις
  choice: воскресение
  rationale: В данном контексте слово означает воскресение из мёртвых, а не просто вставание; определённость греческого артикля передаётся конструкцией самоотождествления.
- source_word: ἡ ζωή
  choice: жизнь
  rationale: Сохраняется прямое и параллельное самоотождествление Иисуса с жизнью без пояснительного расширения.
- source_word: ὁ πιστεύων
  choice: тот, кто верит
  rationale: Естественная современная русская конструкция передаёт субстантивированное причастие в единственном числе и обозначает любого человека, характеризуемого верой.
- source_word: εἰς ἐμέ
  choice: в Меня
  rationale: При глаголе «верить» это идиоматическое русское соответствие греческой конструкции πιστεύω εἰς, выражающей направленную на Иисуса веру.
- source_word: κἂν ἀποθάνῃ
  choice: даже если умрёт
  rationale: Передаёт уступительное условие и аористный конъюнктив без неестественного добавления модального оттенка.
- source_word: ζήσεται
  choice: будет жить
  rationale: 'Сохраняет широту будущей формы: обещание жизни вопреки смерти, без добавления отсутствующего в греческом слова «снова».'
theological_decisions:
- issue: Объём самоотождествления Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή
  choice: Я — воскресение и жизнь
  alternative: Я даю воскресение и жизнь
  rationale: Прямая предикативная формула сохраняется без сведения слов Иисуса лишь к сообщению о Его действии.
- issue: Представительное мужское единственное число в ὁ πιστεύων и последующих глаголах
  choice: Тот, кто верит в Меня, даже если умрёт, будет жить
  alternative: Всякий, кто верит в Меня, даже если умрёт, будет жить
  rationale: Единственное число оригинала сохранено; русская форма мужского рода употреблена в обобщающем смысле и не ограничивает обещание мужчинами.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим торжественности высказывания. Заглавная буква в «Меня» следует принятой русской библейской орфографической традиции; артикли отдельно не воспроизводятся, поскольку в русском их нет.
