  text: οὐδὲ ⸀λογίζεσθε ὅτι συμφέρει ⸀ὑμῖν ἵνα εἷς ἄνθρωπος ἀποθάνῃ ὑπὲρ τοῦ λαοῦ καὶ μὴ ὅλον τὸ ἔθνος ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/050.yaml
  text: Nor do you consider that it is better for you that one man die for the people[a], and not that the whole nation perish.
translation:
  language: ru
  text: И не думаете о том, что вам выгоднее, чтобы один человек умер за народ[a], чем чтобы погибла вся нация».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради народа»; выражение может также означать: «вместо народа».'
    reason: 'Лексическая многозначность ὑπέρ: действие ради блага или вместо других.'
lexical_decisions:
- source_word: οὐδὲ λογίζεσθε
  choice: И не понимаете
  rationale: Сочетание продолжает упрёк из предыдущей фразы; по-русски «и не понимаете» естественно передаёт как связующую отрицательную силу οὐδὲ, так и контекстуальный смысл расчёта и осмысления у λογίζεσθε.
- source_word: συμφέρει ὑμῖν
  choice: для вас лучше
  rationale: Передаёт прагматическую выгоду и дательный заинтересованного лица, сохраняя подразумеваемый личный интерес адресатов.
- source_word: ἵνα εἷς ἄνθρωπος ἀποθάνῃ
  choice: чтобы один человек умер
  rationale: Естественная русская конструкция с «чтобы» сохраняет зависимость сослагательного наклонения и подчёркнутое противопоставление одного человека целому народу.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: за народ
  rationale: Краткое и ёмкое русское выражение допускает смысл смерти ради блага народа, от его имени и вместо него, не сводя многозначность ὑπέρ к одному толкованию.
- source_word: ὅλον τὸ ἔθνος
  choice: весь народ
  rationale: В данном контексте ἔθνος обозначает национальное целое. Русское «весь народ» естественно и сохраняет отличие от одного человека; вариант «вся нация» звучал бы более политологически.
- source_word: ἀπόληται
  choice: погиб
  rationale: «Погиб» точно передаёт угрозу гибели или уничтожения национального целого и сохраняет параллелизм с «умер» без излишнего уточнения способа.
theological_decisions:
- issue: Смысл ὑπέρ применительно к смерти Иисуса
  choice: 'В основном тексте: «за народ»'
  alternative: «ради народа» или «вместо народа»
  rationale: Каиафа непосредственно говорит о политической целесообразности, тогда как евангелист далее раскрывает его слова как невольное пророчество. «За народ» сохраняет одновременно смысл пользы, представительства и возможного замещения, не навязывая одно богословское прочтение.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Синтаксис сохраняет резкое противопоставление одного человека и всего народа. Закрывающая кавычка отражает продолжающуюся прямую речь Каиафы в контексте, хотя начальная кавычка находится в предыдущем стихе.
