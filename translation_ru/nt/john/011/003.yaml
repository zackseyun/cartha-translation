  text: ἀπέστειλαν οὖν αἱ ἀδελφαὶ πρὸς αὐτὸν λέγουσαι· Κύριε, ἴδε ὃν φιλεῖς ἀσθενεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/003.yaml
  text: So the sisters sent word to him, saying, “Lord, look, the one you love is sick.”
translation:
  language: ru
  text: 'Поэтому сёстры послали к Нему сказать: «Господи, вот, тот, кого Ты любишь, болен».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Поэтому
  rationale: Передаёт вывод или следствие из предшествующего сообщения о болезни Лазаря.
- source_word: ἀπέστειλαν ... πρὸς αὐτόν
  choice: послали Ему сказать
  rationale: Естественная русская передача отправки сообщения к Иисусу без предположения, что сами сёстры отправились к Нему.
- source_word: ἴδε
  choice: восклицательная интонация после «Господи!»
  rationale: В данном сообщении ἴδε служит формулой привлечения внимания; буквальное «смотри» по-русски могло бы ошибочно подразумевать непосредственное зрительное восприятие отсутствующего больного.
- source_word: ὃν φιλεῖς
  choice: тот, кого Ты любишь
  rationale: Сохраняет личный, тёплый характер φιλέω и не добавляет имени Лазаря, которого в греческой фразе нет.
- source_word: ἀσθενεῖ
  choice: болен
  rationale: Прямо и естественно передаёт настоящее состояние болезни.
theological_decisions:
- issue: Характер любви, выраженной глаголом φιλέω
  choice: «любишь» без дополнительного уточнения
  alternative: «дорог Тебе» или «к кому Ты привязан»
  rationale: Обычное «любишь» сохраняет смысл личной привязанности, не навязывая богословского различия между φιλέω и ἀγαπάω и не ослабляя прямоту исходной речи.
translation_notes:
  register: Современный литературный русский язык с ясной, сдержанной и dignified библейской интонацией. Прописные формы «Ему» и «Ты» употреблены как традиционное почтительное обращение к Иисусу; смысловых уточнений сверх греческого текста не добавлено.
