id: JHN.11.32
reference: John 11:32
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ ὡς ἦλθεν ὅπου ⸀ἦν Ἰησοῦς ἰδοῦσα αὐτὸν ἔπεσεν αὐτοῦ ⸀πρὸς τοὺς πόδας, λέγουσα αὐτῷ· Κύριε, εἰ ἦς ὧδε οὐκ ἄν ⸂μου ἀπέθανεν⸃ ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/032.yaml
  text: So when Mary came where Jesus was and saw him[a], she fell at his feet, saying to him, “Lord, if you had been here, my brother would not have died.”
translation:
  language: ru
  text: 'Когда же Мария пришла туда, где был Иисус, и увидела Его, она пала к Его ногам и сказала Ему: «Господи[a], если бы Ты был здесь, мой брат не умер бы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господин». Греческое κύριε могло быть почтительным обращением; здесь переведено «Господи» в соответствии с обычной передачей κύριος и изображением Иисуса в Евангелии.'
    reason: Сохранение возможного оттенка почтительного обращения наряду с основным переводом «Господи».
lexical_decisions:
- source_word: οὖν
  choice: же
  rationale: Частица передаёт связь с предыдущим повествованием и естественно включается в конструкцию «Когда же…».
- source_word: ὡς ἦλθεν
  choice: когда … пришла
  rationale: ὡς с аористом здесь вводит временное обстоятельство; такой перевод ясен и естественен по-русски.
- source_word: ὅπου ἦν Ἰησοῦς
  choice: туда, где был Иисус
  rationale: Добавление естественного для русского глагола движения соотносительного слова «туда» ясно передаёт направленность ἦλθεν, не меняя смысла локативной придаточной части.
- source_word: ἰδοῦσα αὐτόν
  choice: и увидела Его
  rationale: Обстоятельное причастие передано личной формой, сохраняющей последовательность действий и обеспечивающей естественное русское повествование.
- source_word: ἔπεσεν αὐτοῦ πρὸς τοὺς πόδας
  choice: пала к Его ногам
  rationale: Выражение обозначает падение или преклонение у ног; «пала к ногам» сохраняет образ и звучит литературно, но понятно.
- source_word: λέγουσα αὐτῷ
  choice: и сказала Ему
  rationale: Причастный оборот естественно передан личной формой, вводящей прямую речь.
- source_word: Κύριε
  choice: Господи
  rationale: Традиционная и современно понятная звательная форма слова «Господь» сохраняет вес обращения κύριε и не сводит его лишь к вежливому «господин».
- source_word: εἰ ἦς ὧδε
  choice: если бы Ты был здесь
  rationale: Русская условная конструкция с «бы» точно передаёт нереальное условие, относящееся к прошлому.
- source_word: οὐκ ἄν … ἀπέθανεν
  choice: не умер бы
  rationale: Сочетание ἄν с аористом в нереальном условном периоде передано естественной русской формой прошедшего времени с «бы».
- source_word: μου ὁ ἀδελφός
  choice: мой брат
  rationale: Притяжательный генитив естественно передаётся русским притяжательным местоимением.
theological_decisions:
- issue: Передача κύριε в обращении Марии к Иисусу
  choice: Господи
  alternative: господин
  rationale: «Господи» сохраняет обычное значение κύριος и богословско-повествовательную многозначность обращения в Евангелии от Иоанна. При этом само слово в данном контексте могло служить и почтительным обращением, поэтому альтернативный оттенок отмечен в сноске без превращения реплики в однозначно сформулированное исповедание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной повествовательной интонацией. Формы «пала» и «Господи» сохраняют достоинство сцены, оставаясь понятными широкому читателю. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской практикой.
