  source_fidelity: 'Текст точно передаёт греческий оригинал: τινὲς δὲ ἐξ αὐτῶν — «Но некоторые из них», риторическое Οὐκ ἐδύνατο — «Разве ... не мог», а конструкция ποιῆσαι ἵνα естественно воспроизведена как «сделать так, чтобы». Повтор указательных слов сохраняет различение между Иисусом («тот») и Лазарем («этот человек»).'
  naturalness: Перевод звучит естественно на современном литературном русском. Формулировка «открыл глаза слепому» нормативна и ясна; «сделать так, чтобы ... не умер» хорошо передаёт в данном контексте предотвращение смерти.
  terminology: Терминологически нейтрален и точен. «Слепой» корректно передаёт субстантивированное τοῦ τυφλοῦ и не вносит интерпретаций. Богословская и риторическая напряжённость вопроса сохранена без конфессионального усиления.
