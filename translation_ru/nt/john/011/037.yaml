  text: τινὲς δὲ ἐξ αὐτῶν εἶπαν· Οὐκ ἐδύνατο οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ ποιῆσαι ἵνα καὶ οὗτος μὴ ἀποθάνῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/037.yaml
  text: But some of them said[a], “Could not this man, who opened the eyes of the blind man, also have made it so that this man would not die?”
translation:
  language: ru
  text: 'Но некоторые из них сказали: «Разве тот, кто открыл глаза слепому, не мог сделать так, чтобы и этот человек не умер?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Но некоторые из них
  rationale: Передаёт значение «некоторые из них», а δέ отмечает контраст с предшествующей реакцией людей.
- source_word: εἶπαν
  choice: сказали
  rationale: Аорист в повествовании естественно передаётся простым прошедшим временем.
- source_word: Οὐκ ἐδύνατο
  choice: Разве ... не мог
  rationale: Естественная русская форма риторического вопроса, сохраняющая подразумеваемое ожидание утвердительного ответа и оттенок упрёка.
- source_word: οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ
  choice: тот, кто открыл глаза слепому
  rationale: Причастная конструкция передана естественным относительным оборотом; субстантивированное τοῦ τυφλοῦ относится к слепому, исцелённому ранее.
- source_word: ποιῆσαι ἵνα
  choice: сделать так, чтобы
  rationale: Передаёт каузативно-результативный смысл конструкции в современном литературном русском без неестественной буквальности.
- source_word: καὶ οὗτος
  choice: и этот человек
  rationale: καί выражает добавочное «и», а указательное местоимение относится к Лазарю; слово «человек» ясно различает его и Иисуса.
- source_word: μὴ ἀποθάνῃ
  choice: не умер
  rationale: После «сделать так, чтобы» совершенный вид и прошедшая форма естественно выражают предотвращение уже наступившей смерти в контексте вопроса.
theological_decisions:
- issue: Тон вопроса говорящих
  choice: Сохранён скептический риторический вопрос о способности Иисуса предотвратить смерть Лазаря
  alternative: Передать как нейтральный вопрос без оттенка упрёка
  rationale: Конструкция с Οὐκ предполагает ожидаемый положительный ответ и в контексте звучит как недоумение или скрытая критика, однако перевод не усиливает её до прямого обвинения.
translation_notes:
  register: Современный литературный русский; фраза звучит естественно и достойно. Указательные формы различают Иисуса («тот») и Лазаря («этот человек»), не устраняя риторическую и богословскую напряжённость текста.
