base_translation:
  language: en
  yaml_path: translation/nt/john/011/053.yaml
  text: So from that day on they planned to kill him.
translation:
  language: ru
  text: Итак, с того дня они решили убить Его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπ’ ἐκείνης ... τῆς ἡμέρας
  choice: С того дня
  rationale: Оборот обозначает начальную точку дальнейшего развития событий. В русском языке «с того дня» естественно передаёт и временную отправную точку, и подразумеваемое продолжение.
- source_word: οὖν
  choice: не передано отдельным словом
  rationale: Частица указывает на следствие из предшествующего совещания. В русском повествовании эта связь естественно выражается самим переходом «С того дня»; добавление «итак» или «поэтому» здесь утяжеляло бы фразу.
- source_word: ἐβουλεύσαντο
  choice: решили
  rationale: Средний аорист βουλεύομαι в данном контексте обозначает совещание, приведшее к решению. «Решили» передаёт достигнутую определённость намерения; «совещались» могло бы ошибочно представить дело как незавершённое обсуждение.
- source_word: ἵνα ἀποκτείνωσιν
  choice: убить
  rationale: Конструкция ἵνα с сослагательным наклонением после глагола решения передаёт содержание или цель принятого решения. Русский инфинитив после «решили» выражает это естественно и точно.
- source_word: αὐτόν
  choice: Его
  rationale: Местоимение относится к Иисусу, ясно названному в ближайшем контексте. Имя не добавляется, поскольку в греческом тексте стоит местоимение.
theological_decisions:
- issue: Характер намерения руководителей в отношении Иисуса
  choice: Передать это как принятое решение убить Его
  alternative: «стали обдумывать, как убить Его» или «решили предать Его смерти»
  rationale: Форма ἐβουλεύσαντο в контексте показывает решительный поворот к убийству, а не только предварительное обсуждение. При этом «убить» не добавляет отсутствующего в тексте оттенка официального судебного приговора.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, ясная и серьёзная. Синтаксис естественен для широкого читателя, без архаизмов и конфессионально окрашенной лексики.
