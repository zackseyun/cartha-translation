  text: καὶ εἶπεν· Ποῦ τεθείκατε αὐτόν; λέγουσιν αὐτῷ· Κύριε, ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/034.yaml
  text: And he said[a], “Where have you laid him?” They said to him, “Lord, come and see.”
translation:
  language: ru
  text: 'И Он сказал: «Куда вы положили его?» Ему сказали: «Господи[a], пойди и посмотри».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господин». Греческое слово κύριε может быть уважительным обращением; перевод «Господи» сохраняет также возможный более глубокий смысл.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: спросил
  rationale: Хотя буквально это форма глагола «сказать», последующая прямая речь является вопросом; в современном русском повествовании «спросил» передаёт функцию реплики естественнее.
- source_word: Ποῦ
  choice: куда
  rationale: С глаголом помещения тела русское «куда положили» естественно выражает вопрос о месте, тогда как буквальное «где положили» менее идиоматично.
- source_word: τεθείκατε
  choice: вы положили
  rationale: Перфект τίθημι обозначает совершённое помещение тела; в русском прошедшее совершенного вида естественно передаёт этот результат.
- source_word: αὐτόν
  choice: его
  rationale: Местоимение мужского рода относится к Лазарю.
- source_word: λέγουσιν
  choice: Ему ответили
  rationale: Греческий исторический презенс естественно передаётся русским прошедшим временем; «ответили» ясно обозначает функцию реплики после вопроса, не изменяя её содержания.
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма «Господи» сохраняет основное значение обращения к Иисусу и возможный христологический оттенок; контекст допускает также вежливое «Господин».
- source_word: ἔρχου
  choice: пойдём
  rationale: Буквально «иди/приходи»; в ответ на вопрос о месте по-русски естественнее приглашение «пойдём», подразумевающее сопровождение к гробнице.
- source_word: ἴδε
  choice: посмотри
  rationale: Императив ὁράω здесь приглашает увидеть указанное место; «посмотри» естественно сочетается с «пойдём».
theological_decisions:
- issue: Обращение Κύριε к Иисусу
  choice: Господи
  alternative: Господин
  rationale: «Господи» сохраняет возможный богословский вес обращения, не утверждая, что говорящие непременно вкладывали в него полное исповедальное значение. Смысл вежливого обращения отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с естественным диалогом и сдержанно возвышенным библейским регистром. Перевод сохраняет краткость греческого текста; функциональные «спросил» и «ответили» выбраны ради нормальной русской повествовательной речи.
