source:
  edition: SBLGNT
  text: εἰρήκει δὲ ὁ Ἰησοῦς περὶ τοῦ θανάτου αὐτοῦ. ἐκεῖνοι δὲ ἔδοξαν ὅτι περὶ τῆς κοιμήσεως τοῦ ὕπνου λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/013.yaml
  text: Jesus had spoken about his death[a], but they thought that he was speaking about the sleep of rest.
translation:
  language: ru
  text: Иисус говорил о смерти Лазаря, а они думали, что Он говорит об обычном сне.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «о сне сна», то есть о буквальном сне, а не о смерти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήκει
  choice: говорил
  rationale: Плюсквамперфект указывает на сказанное ранее; в современном русском это естественно передаётся прошедшим несовершенного вида, а временная соотнесённость ясна из контекста.
- source_word: δὲ … δὲ
  choice: … а …
  rationale: Первое δέ не требует отдельного русского соответствия, тогда как второе выражает противопоставление между смыслом слов Иисуса и пониманием учеников.
- source_word: περὶ τοῦ θανάτου αὐτοῦ
  choice: о смерти Лазаря
  rationale: Местоимение αὐτοῦ относится к Лазарю. Замена местоимения именем устраняет неестественную для изолированного русского стиха двусмысленность, не меняя смысла.
- source_word: ἐκεῖνοι
  choice: они
  rationale: Указательное местоимение относится к ученикам, уже названным в контексте; по-русски естественно употребить личное местоимение.
- source_word: ἔδοξαν
  choice: подумали
  rationale: Передаёт ошибочное заключение учеников ясно и без лишней экспрессии.
- source_word: περὶ τῆς κοιμήσεως τοῦ ὕπνου
  choice: об обычном сне
  rationale: Буквальное сочетание «о сне сна» по-русски неестественно. Родительный τοῦ ὕπνου уточняет, что ученики поняли слова как обозначение буквального сна, а не смерти.
- source_word: λέγει
  choice: говорит
  rationale: Историческое настоящее сохранено внутри косвенной речи; такой переход естественен по-русски и удерживает живость исходной формулировки.
theological_decisions:
- issue: Может ли образ сна подразумевать учение о состоянии умерших
  choice: Передать θάνατος прямо как смерть, а κοιμήσεως τοῦ ὕπνου — как обычный, буквальный сон.
  alternative: Использовать буквальное «сон сна» либо формулировку, предполагающую определённое учение о промежуточном состоянии.
  rationale: 'Стих объясняет повествовательное недоразумение: Иисус образно назвал смерть сном, а ученики поняли это буквально. Перевод не должен выводить из образа дополнительное догматическое утверждение.'
translation_notes:
  register: Современный литературный русский, ясный и сдержанно-достоинный. Имя «Лазаря» эксплицирует референт αὐτοῦ по ближайшему контексту. Заглавная буква в «Он» соответствует принятому благоговейному русскому библейскому регистру.
