  text: λέγει αὐτῷ· Ναί, κύριε· ἐγὼ πεπίστευκα ὅτι σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ ὁ εἰς τὸν κόσμον ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/027.yaml
  text: She said to him[a], “Yes, Lord; I have believed that you are the Messiah, the Son of God[b], the one coming into the world.”
translation:
  language: ru
  text: 'Она говорит Ему: «Да, Господи. Я уверовала, что Ты — Мессия[a], Сын Божий, Тот, Кто приходит в мир[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческое Χριστός означает «Помазанник» и здесь употреблено как титул.'
    reason: alternative_rendering
  - marker: b
    text: 'Или: «который приходит в мир». Греческий оборот может быть передан относительным придаточным предложением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: Она говорит Ему
  rationale: Сохранено историческое настоящее греческого повествования; женский род подлежащего однозначно восстанавливается из контекста (Марфа).
- source_word: Ναί
  choice: Да
  rationale: Прямой и естественный ответ, соответствующий обычному значению греческого утвердительного слова.
- source_word: κύριε
  choice: Господь
  rationale: Обращение находится в контексте исповедания личности Иисуса и потому передаёт не просто вежливое «господин», а почтительное признание.
- source_word: πεπίστευκα
  choice: Я уверовала
  rationale: Русский глагол совершенного вида выражает возникшую прежде веру, которая сохраняется в настоящем, и естественнее буквального «я поверила» передаёт результативную силу перфекта.
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание веры Марфы, а не причину её ответа.
- source_word: ὁ χριστός
  choice: Мессия
  rationale: Передано значение титула Помазанника в иудейском контексте, а не только его традиционная греческая транслитерация «Христос».
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Сын Божий
  rationale: Устойчивое и точное русское наименование, сохраняющее определённость и богословский вес выражения.
- source_word: ὁ εἰς τὸν κόσμον ἐρχόμενος
  choice: Тот, Кто приходит в мир
  rationale: Субстантивированное причастие передано определительным оборотом без добавления отсутствующего в греческом тексте модального значения «должен»; настоящее время сохраняет аспект исходного выражения.
- source_word: κόσμον
  choice: мир
  rationale: Естественно передаёт κόσμος как человеческий мир, в который приходит Сын.
theological_decisions:
- issue: Передача Χριστός как исповедального титула
  choice: Мессия
  alternative: Христос
  rationale: Здесь слово обозначает ожидаемого Помазанника и выступает именно титулом; «Мессия» непосредственно передаёт его смысл, а примечание сохраняет традиционный вариант.
- issue: Смысл обращения κύριε
  choice: Господь
  alternative: господин
  rationale: Следующее за обращением исповедание Иисуса Мессией и Сыном Божьим поддерживает почтительно-богословское прочтение, хотя само обращение в иных контекстах может быть вежливой формой.
- issue: Результативная сила перфекта πεπίστευκα
  choice: Я уверовала
  alternative: Я верую
  rationale: Выбор сохраняет мысль о состоявшемся обретении веры с продолжающимся результатом; настоящее «верую» яснее выражало бы нынешнее состояние, но сгладило бы перфект.
- issue: Значение ὁ ἐρχόμενος
  choice: Тот, Кто приходит в мир
  alternative: Тот, Кто должен прийти в мир
  rationale: Текст допускает восприятие выражения как титула ожидаемого Грядущего, однако модальность ожидания не выражена отдельным словом; основной текст сохраняет формальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формы «Сын Божий» и прописные буквы в относящихся к Иисусу местоимениях сохраняют привычный русский библейский регистр; синтаксис остаётся ясным для современного читателя.
