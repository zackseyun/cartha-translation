lexical_decisions:
- source_word: οὔπω
  choice: ещё не
  rationale: 'Естественно передаёт временное значение: действие до этого момента не произошло.'
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Частица обозначает мягкий переход или слабое противопоставление; в русском оно естественно передаётся построением всего предложения и союзом «а» перед второй частью.
- source_word: ἐληλύθει
  choice: вошёл
  rationale: Плюсквамперфект обозначает предшествующее состояние относительно повествования; поскольку далее говорится, что Иисус оставался вне селения, «ещё не вошёл» естественно и точно передаёт смысл движения в селение.
- source_word: κώμην
  choice: селение
  rationale: κώμη обозначает небольшое поселение; «селение» сохраняет масштаб и звучит достойно и понятно.
- source_word: ἀλλ’
  choice: а
  rationale: В русском при противопоставлении «не вошёл, а оставался» союз «а» естественнее, чем более резкое «но».
- source_word: ἔτι
  choice: оставался
  rationale: Значение продолжающегося пребывания передано глаголом «оставался»; отдельное «всё ещё» здесь было бы возможно, но утяжеляло бы фразу.
- source_word: τόπῳ
  choice: месте
  rationale: Прямой и нейтральный эквивалент общего обозначения места.
- source_word: ὅπου
  choice: где
  rationale: Естественно вводит придаточное места.
- source_word: ὑπήντησεν
  choice: встретила
  rationale: Глагол может означать как встречу, так и выход навстречу; основной текст сохраняет краткую формулировку, а более явный оттенок движения вынесен в примечание.
- source_word: αὐτῷ
  choice: Его
  rationale: Дательный объект при ὑπαντάω естественно передаётся в русском прямым дополнением при глаголе «встретила».
- source_word: Μάρθα
  choice: Марфа
  rationale: Традиционная и общеупотребительная русская форма имени.
