  yaml_path: translation/nt/john/011/030.yaml
  text: Jesus had not yet come into the village[a], but was still in the place where Martha had met him.
translation:
  language: ru
  text: Иисус ещё не пришёл в селение, а всё ещё был там, где Марфа встретила Его[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
