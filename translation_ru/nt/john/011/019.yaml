  text: ⸂πολλοὶ δὲ⸃ ἐκ τῶν Ἰουδαίων ἐληλύθεισαν πρὸς ⸀τὴν Μάρθαν καὶ ⸀Μαριὰμ ἵνα παραμυθήσωνται αὐτὰς περὶ τοῦ ⸀ἀδελφοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/019.yaml
  text: Many of the Jews had come to Martha and Mary to comfort them about their brother[a].
translation:
  language: ru
  text: Многие из иудеев уже пришли к Марфе и Марии, чтобы утешить их в горе по брату.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Многие из жителей Иудеи пришли к Марфе и Марии». Греческое слово может обозначать иудеев вообще, а в некоторых контекстах у Иоанна — жителей Иудеи.'
    reason: Сохранение возможного более узкого географического значения Ἰουδαίων.
lexical_decisions:
- source_word: πολλοὶ δὲ
  choice: Многие
  rationale: πολλοί означает «многие»; слабый соединительный δέ не требует отдельной передачи в естественном русском повествовании и не выражает здесь явного противопоставления.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: из иудеев
  rationale: 'Конструкция с ἐκ имеет партитивное значение: «многие из числа иудеев». В данном неполемическом контексте речь естественнее всего понимать как о представителях еврейского народа; возможное более узкое значение «жители Иудеи» отмечено в сноске.'
- source_word: ἐληλύθεισαν
  choice: пришли
  rationale: Плюсквамперфект указывает, что они уже пришли к данному моменту повествования; в русском языке это временное соотношение естественно передаётся прошедшим совершенного вида без вспомогательного «были».
- source_word: πρὸς τὴν Μάρθαν καὶ Μαριὰμ
  choice: к Марфе и Марии
  rationale: πρός с винительным обозначает направленность к людям, здесь — посещение сестёр. Имена переданы в принятой русской библейской форме.
- source_word: ἵνα παραμυθήσωνται αὐτὰς
  choice: чтобы утешить их
  rationale: ἵνα с сослагательным выражает цель, а παραμυθέομαι в контексте скорби означает «утешать».
- source_word: περὶ τοῦ ἀδελφοῦ
  choice: после смерти брата
  rationale: Буквально περί с родительным означает «о брате / по поводу брата», но в контексте траура естественный русский смысл — утешать сестёр после смерти их брата. Притяжательное отношение ясно из контекста и формы «брата» после местоимения «их».
theological_decisions:
- issue: Значение Ἰουδαίων в Евангелии от Иоанна
  choice: иудеев
  alternative: жителей Иудеи
  rationale: Здесь слово употреблено описательно, а не полемически, и, вероятнее всего, обозначает представителей еврейского народа. Однако присущая Иоанну возможность более узкого географического значения сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. «После смерти брата» естественно передаёт ситуацию траурного утешения; формально возможное «по поводу брата» по-русски неясно и неидиоматично.
