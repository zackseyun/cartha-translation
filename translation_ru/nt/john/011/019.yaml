  source_fidelity: Фраза «после смерти брата» верно отражает повествовательский контекст (Лазарь умер), однако она переводит περί τοῦ ἀδελφοῦ как временное обстоятельство и прямо добавляет «смерть», которой в самом стихе нет. «В горе по брату» естественно передаёт цель утешения и сохраняет связь с братом без такого добавления. «Уже пришли» уместно передаёт предшествование, выраженное плюсквамперфектом ἐληλύθεισαν.
