  text: καὶ ταῦτα εἰπὼν φωνῇ μεγάλῃ ἐκραύγασεν· Λάζαρε, δεῦρο ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/043.yaml
  text: And after saying these things[a], he cried out with a loud voice, “Lazarus, come out!”
translation:
  language: ru
  text: 'Сказав это, Он громко воззвал: «Лазарь, выходи!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: это
  rationale: Хотя в греческом стоит форма множественного числа среднего рода («эти вещи»), в данном контексте современный русский естественно обобщает сказанное местоимением «это».
- source_word: εἰπὼν
  choice: сказав
  rationale: Аористное причастие обозначает действие, предшествующее основному; русское деепричастие кратко и естественно передаёт эту последовательность.
- source_word: φωνῇ μεγάλῃ
  choice: громко
  rationale: Дательный образа действия буквально указывает на «громкий голос»; наречие «громко» передаёт тот же смысл естественным современным русским языком.
- source_word: ἐκραύγασεν
  choice: воззвал
  rationale: Глагол обозначает громкий крик или призыв. «Воззвал» сохраняет торжественную силу повествования, а громкость уже явно выражена словом «громко».
- source_word: Λάζαρε
  choice: Лазарь
  rationale: Звательная форма имени передана нормативной русской формой обращения; отдельного звательного падежа в современном русском здесь нет.
- source_word: δεῦρο ἔξω
  choice: выходи
  rationale: Сочетание буквально выражает повеление прийти наружу. «Выходи» — ясный, энергичный и естественный русский призыв, соответствующий ситуации.
theological_decisions:
- issue: Передача властного призыва при совершении чуда без искусственной архаизации
  choice: выходи
  alternative: иди вон / выйди наружу
  rationale: «Выходи» точно и естественно передаёт δεῦρο ἔξω, не добавляя богословского толкования и не прибегая к неестественной архаической формуле.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. «Воззвал» придаёт фразе возвышенность, не затрудняя понимания; команда «выходи» остаётся простой и непосредственной.
