  text: Ἦν δέ τις ἀσθενῶν, Λάζαρος ἀπὸ Βηθανίας ἐκ τῆς κώμης Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/001.yaml
  text: A certain man was sick[a], Lazarus from Bethany, from the village of Mary and her sister Martha.
translation:
  language: ru
  text: Был болен один человек — Лазарь из Вифании, из селения Марии и её сестры Марфы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: Был
  rationale: Ἦν образует с причастием ἀσθενῶν описательную конструкцию состояния; начальное «был» естественно передаёт её по-русски. Слабая связующая функция δέ не выражена отдельным словом, чтобы не создавать неуместного оттенка противопоставления.
- source_word: τις
  choice: один человек
  rationale: Неопределённое местоимение вводит конкретного, но ещё не представленного участника повествования. «Один человек» звучит естественно и не несёт несколько отчуждённого оттенка слова «некий».
- source_word: ἀσθενῶν
  choice: болен
  rationale: В данном контексте слово означает физическую болезнь, а не просто слабость; вместе с ἦν оно передано сказуемым «был болен».
- source_word: Λάζαρος
  choice: Лазарь
  rationale: Использована закрепившаяся в русской библейской традиции форма имени.
- source_word: ἀπὸ Βηθανίας
  choice: из Вифании
  rationale: Предлог ἀπό указывает на происхождение или место, откуда человек родом; «из Вифании» прямо передаёт этот смысл.
- source_word: ἐκ τῆς κώμης
  choice: из селения
  rationale: κώμη обозначает небольшое поселение; «селение» сохраняет достоинство стиля и хорошо сочетается с последующим определением.
- source_word: Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς
  choice: Марии и её сестры Марфы
  rationale: Оборот связывает селение с Марией и Марфой и прямо называет Марфу сестрой Марии. Русский порядок слов устраняет неясность отсылки αὐτῆς.
