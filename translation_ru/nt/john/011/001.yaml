  source_fidelity: 'Текст точно передаёт конструкцию ἦν ... ἀσθενῶν («был болен»), неопределённо-конкретное τις («один человек»), имя Лазаря и оба последовательно данных указания на место: «из Вифании, из селения…». Приложение с именем через тире корректно отражает Λάζαρος. Связь Марфы с Марией передана однозначно: «её сестры Марфы».'
