    text: 'Греческий глагол может также означать «будет спасён», но здесь, в контексте болезни, речь идёт о восстановлении здоровья: «выздоровеет» или «поправится».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Тогда
  rationale: Передаёт связь реплики учеников с предшествующими словами Иисуса как естественное продолжение повествования и вывод из сказанного.
- source_word: οἱ μαθηταὶ
  choice: ученики
  rationale: Определённость и известный из контекста круг учеников естественно передаются по-русски без обязательного местоимения «Его».
- source_word: αὐτῷ
  choice: Ему
  rationale: Сохраняет местоименную форму оригинала; из контекста ясно, что речь об Иисусе.
- source_word: Κύριε
  choice: Господи
  rationale: Обычная русская форма прямого обращения, сохраняющая как уважительный смысл, так и возможный христологический оттенок титула.
- source_word: εἰ
  choice: если
  rationale: Передаёт прямое условие, на котором ученики основывают свой вывод.
- source_word: κεκοίμηται
  choice: уснул
  rationale: Перфектная форма описывает наступившее состояние сна. Здесь ученики понимают слова Иисуса буквально, как обычный сон; краткое «уснул» естественно по-русски и сохраняет ход повествования.
- source_word: σωθήσεται
  choice: выздоровеет
  rationale: В контексте болезни σῴζω может означать восстановление здоровья. «Выздоровеет» ясно передаёт мысль учеников, не привнося сюда неуместный сотериологический смысл.
theological_decisions:
- issue: Передача обращения κύριε к Иисусу
  choice: Господи
  alternative: Господин; Учитель
  rationale: «Господи» соответствует обычному значению обращения и сохраняет присущую Евангелию от Иоанна смысловую глубину, не заставляя читателя выбирать лишь между вежливым обращением и исповеданием.
- issue: 'Двойной смысл κεκοίμηται: обычный сон или смерть'
  choice: 'В основном тексте передать как обычный сон: «уснул»'
  alternative: Почил; заснул смертным сном
  rationale: Ученики ошибочно понимают образные слова Иисуса о смерти Лазаря как указание на обычный сон. Перевод должен сохранить это недоразумение, которое поясняется в следующих стихах.
- issue: Значение σωθήσεται в контексте болезни
  choice: выздоровеет
  alternative: спасётся; поправится
  rationale: Контекст требует физического выздоровления. Буквально возможное «спасётся» по-русски создало бы здесь преимущественно богословскую ассоциацию, отсутствующую в мысли учеников.
translation_notes:
  register: Современный литературный русский язык; реплика звучит просто и естественно, при этом обращение «Господи» сохраняет достоинство и богословскую многослойность текста. Частица «то» делает условно-следственную связь ясной без излишней книжности.
