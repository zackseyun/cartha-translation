  text: 'Тогда ученики сказали Ему: «Господи, если он уснул[a], то выздоровеет[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также можно перевести: «заснул». Иисус образно говорил о смерти Лазаря как о сне, но ученики поняли Его слова как указание на обычный сон.'
    reason: lexical_alternative
