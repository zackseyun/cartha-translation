  yaml_path: translation/nt/john/011/029.yaml
  text: And when she heard it[a], she got up quickly and went to him.
translation:
  language: ru
  text: Она же, услышав это, быстро встала и пошла к Нему.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «Та же, когда услышала, быстро встала и шла к Нему».'
    reason: Более буквальный вариант сохраняет указательное местоимение ἐκείνη и длительный вид имперфекта ἤρχετο.
lexical_decisions:
- source_word: ἐκείνη
  choice: она
  rationale: Указательное местоимение относится к Марии; в современном русском повествовании естественно употребить личное местоимение, не утяжеляя фразу буквальным «та».
- source_word: δὲ
  choice: же
  rationale: Частица мягко связывает фразу с предшествующим повествованием и слегка выделяет реакцию Марии, не выражая сильного противопоставления.
- source_word: ὡς ἤκουσεν
  choice: услышав это
  rationale: Временная конструкция передаёт действие, после которого Мария сразу отреагировала. «Это» естественно отсылает к сообщению предыдущего стиха, не меняя значения глагола «услышала».
- source_word: ἠγέρθη
  choice: встала
  rationale: Формально пассивная форма здесь употреблена непереходно и означает, что Мария поднялась со своего места; «была поднята» ошибочно подразумевало бы внешнего деятеля.
- source_word: ταχὺ
  choice: быстро
  rationale: Наречие обозначает быстроту и незамедлительность реакции, но не требует усиленного перевода «тотчас».
- source_word: ἤρχετο
  choice: пошла
  rationale: Имперфект изображает начавшееся и разворачивающееся движение. В последовательном русском повествовании совершенная форма «пошла» звучит естественно; длительный оттенок отмечен в сноске.
- source_word: πρὸς αὐτόν
  choice: к Нему
  rationale: Предлог с винительным падежом обозначает движение по направлению к Иисусу. Русское «к Нему» естественно передаёт как направление, так и подразумеваемую цель движения.
