  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς εἶπεν· Αὕτη ἡ ἀσθένεια οὐκ ἔστιν πρὸς θάνατον ἀλλ’ ὑπὲρ τῆς δόξης τοῦ θεοῦ ἵνα δοξασθῇ ὁ υἱὸς τοῦ θεοῦ δι’ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/004.yaml
  text: But when Jesus heard it[a], he said, “This sickness is not unto death, but for the glory of God, so that the Son of God may be glorified through it.”
translation:
  language: ru
  text: 'Услышав это, Иисус сказал: «Эта болезнь не к смерти[a], но ради славы Бога, чтобы через неё был прославлен Сын Божий».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не ведёт к смерти». Греческое выражение может означать, что смерть не является окончательным исходом или целью этой болезни.'
    reason: Лексико-синтаксическая неоднозначность конструкции πρὸς θάνατον.
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: Услышав это, Иисус
  rationale: Деепричастие естественно передаёт обстоятельственное значение аористного причастия; «это» восполняет из контекста сообщение о болезни Лазаря. δέ здесь обозначает переход в повествовании и не требует отдельного противительного союза по-русски.
- source_word: ἀσθένεια
  choice: болезнь
  rationale: Широкое и естественное обозначение состояния Лазаря без излишне клинического оттенка.
- source_word: οὐκ ἔστιν πρὸς θάνατον
  choice: не к смерти
  rationale: Сохраняет образ и целевую либо результативную направленность конструкции πρὸς с винительным падежом, не устраняя напряжение с последующей смертью Лазаря.
- source_word: ὑπὲρ τῆς δόξης τοῦ θεοῦ
  choice: ради славы Бога
  rationale: «Ради» естественно выражает целевое значение ὑπέρ; «слава Бога» ясно и непосредственно передаёт родительный оборот.
- source_word: ἵνα δοξασθῇ
  choice: чтобы … был прославлен
  rationale: Сохраняет целевую конструкцию ἵνα и пассивный залог δοξασθῇ.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Сын Божий
  rationale: Устоявшаяся и точная русская передача христологического титула; прописные буквы уместны для титульного наименования.
- source_word: δι’ αὐτῆς
  choice: через неё
  rationale: Передаёт инструментальное значение διά с родительным падежом; местоимение соотнесено с «болезнью».
theological_decisions:
- issue: Смысл выражения «не к смерти» ввиду последующей смерти Лазаря
  choice: Сохранена формулировка «не к смерти», допускающая понимание смерти как неокончательного исхода или нецели болезни.
  alternative: «не смертельна» или «не приведёт к смерти»
  rationale: Контекст сообщает, что Лазарь действительно умер, поэтому категорическое отрицание самой смерти преждевременно разрешило бы повествовательное и богословское напряжение исходного текста.
- issue: Связь славы Бога с прославлением Сына Божьего
  choice: 'Обе части сохранены раздельно: болезнь служит славе Бога, чтобы через неё был прославлен Сын Божий.'
  alternative: Объединить обе части в общее утверждение о Божьей славе.
  rationale: Так воспроизводится структура греческого текста и его явное соотнесение славы Бога с прославлением Сына без добавочного догматического истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формулировка «не к смерти» слегка возвышенна, но понятна и намеренно сохраняет смысловую напряжённость оригинала; остальные обороты естественны для современного читателя.
