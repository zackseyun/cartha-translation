  text: ἡ οὖν Μάρθα ὡς ἤκουσεν ὅτι Ἰησοῦς ἔρχεται ὑπήντησεν αὐτῷ· ⸀Μαρία δὲ ἐν τῷ οἴκῳ ἐκαθέζετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/020.yaml
  text: So when Martha heard that Jesus was coming[a], she went to meet him; but Mary was sitting in the house.
translation:
  language: ru
  text: Итак, когда Марфа услышала, что Иисус идёт[a], она пошла навстречу ему, а Мария сидела в доме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что Иисус приближается». Греческий глагол стоит в настоящем времени и в косвенной речи может передавать происходящее приближение.'
    reason: 'Лексическая альтернатива: настоящее время ἔρχεται может быть передано как «идёт» или «приближается».'
lexical_decisions:
- source_word: οὖν
  choice: Когда
  rationale: Связь с предыдущим повествованием естественно передана общей конструкцией «Когда…»; отдельное «итак» в современном русском здесь утяжеляло бы фразу.
- source_word: ὡς
  choice: когда
  rationale: Союз вводит временное придаточное; «когда» ясно передаёт значение, не усиливая его до «как только».
- source_word: ἤκουσεν
  choice: услышала
  rationale: Прямое соответствие ἀκούω, сохраняющее конкретность греческого выражения.
- source_word: ἔρχεται
  choice: идёт
  rationale: Настоящее время греческого глагола сохранено как живое настоящее в косвенной речи; по-русски такая форма звучит естественно.
- source_word: ὑπήντησεν
  choice: вышла Ему навстречу
  rationale: Передаёт направленное движение для встречи. «Вышла» естественно подразумевается противопоставлением Марии, оставшейся в доме, хотя само по себе «из дома» в греческом не выражено.
- source_word: δὲ
  choice: а
  rationale: Русское «а» естественно выражает мягкое противопоставление действий Марфы и Марии без чрезмерно сильного «но».
- source_word: ἐν τῷ οἴκῳ
  choice: в доме
  rationale: Прямая и естественная передача конкретного существительного οἶκος.
- source_word: ἐκαθέζετο
  choice: сидела
  rationale: Русский глагол несовершенного вида передаёт продолженное состояние, выраженное греческим имперфектом.
- source_word: Μάρθα / Μαρία / Ἰησοῦς
  choice: Марфа / Мария / Иисус
  rationale: Принятые в русской библейской и литературной традиции формы личных имён.
