  source_fidelity: 'Основной смысл передан верно: ученики обращаются к Иисусу как к Равви, напоминают о совсем недавней попытке побить Его камнями и с недоумением спрашивают, намерен ли Он снова идти туда. «Пытались побить» точнее передаёт ἐζήτουν, чем «хотели», поскольку сохраняет оттенок предпринимавшейся попытки, не утверждая её осуществление. «Только что» лучше соответствует νῦν в данном контексте, чем несколько менее непосредственное «ещё совсем недавно».'
