  text: λέγουσιν αὐτῷ οἱ μαθηταί· Ῥαββί, νῦν ἐζήτουν σε λιθάσαι οἱ Ἰουδαῖοι, καὶ πάλιν ὑπάγεις ἐκεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/008.yaml
  text: The disciples said to him[a], “Rabbi, just now the Jews were seeking to stone you, and are you going there again?”
translation:
  language: ru
  text: 'Ученики сказали Ему[a]: «Равви, только что иудеи пытались побить Тебя камнями, и Ты снова идёшь туда?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жители Иудеи»; в данном контексте, возможно, «иудейские руководители». У Иоанна слово «иудеи» нередко обозначает противников Иисуса в Иудее, а не весь еврейский народ.'
    reason: Альтернативное контекстуальное понимание οἱ Ἰουδαῖοι.
lexical_decisions:
- source_word: λέγουσιν
  choice: сказали
  rationale: Греческое историческое настоящее в современном русском повествовании естественно передаётся прошедшим временем.
- source_word: Ῥαββί
  choice: Равви
  rationale: Сохранено транслитерированное семитское обращение, употреблённое в греческом тексте; оно передаёт форму обращения учеников и стиль Иоанна.
- source_word: νῦν
  choice: ещё совсем недавно
  rationale: В данном контексте наречие указывает на недавность угрозы; такая формулировка естественно передаёт этот смысл по-русски.
- source_word: ἐζήτουν
  choice: хотели
  rationale: Имперфект обозначает продолжавшееся намерение или попытку; «хотели» идиоматично передаёт направленность действия, не утверждая, что побиение началось.
- source_word: λιθάσαι
  choice: побить камнями
  rationale: Прямой и традиционно понятный русский эквивалент, не добавляющий отсутствующего в греческом тексте уточнения «до смерти».
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Лексически прямой русский эквивалент; возможное более узкое контекстуальное значение поясняется в сноске, а не вносится в основной текст.
- source_word: πάλιν
  choice: снова
  rationale: Естественный русский эквивалент повторности действия.
- source_word: ὑπάγεις
  choice: идёшь
  rationale: В сочетании с указанием места «туда» глагол естественно означает движение к ранее названному месту.
- source_word: ἐκεῖ
  choice: туда
  rationale: Русское наречие направления естественнее, чем «там», при глаголе движения и отсылает к Иудее.
theological_decisions:
- issue: Кого обозначает οἱ Ἰουδαῖοι в Евангелии от Иоанна
  choice: иудеи
  alternative: жители Иудеи; в данном контексте — противники Иисуса из числа иудеев или иудейские руководители
  rationale: Основной текст сохраняет прямое лексическое значение и не сужает референт без явного указания в греческом. Сноска предотвращает ошибочное понимание как обобщения обо всём еврейском народе и сохраняет контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством и повествовательной естественностью. Обращение «Равви» сохранено; прописные местоимения при обращении к Иисусу соответствуют распространённой русской библейской традиции. Тире перед вторым вопросительным компонентом передаёт удивление и тревогу учеников.
