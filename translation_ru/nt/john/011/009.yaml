base_translation:
  language: en
  yaml_path: translation/nt/john/011/009.yaml
  text: Jesus answered[a], “Are there not twelve hours in the day? If anyone walks in the day, he does not stumble[c][b], because he sees the light of this world.”
translation:
  language: ru
  text: 'Иисус ответил: «Разве в дне не двенадцать часов?[a] Кто ходит днём, тот не спотыкается, потому что видит свет этого мира[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «двенадцать часов дня».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «свет этого мира» может перекликаться с более широкой темой света в Евангелии от Иоанна; в основном тексте образ оставлен без поясняющего истолкования.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ответил
  rationale: Обычный повествовательный глагол ответа; естественный и точный русский эквивалент.
- source_word: Οὐχὶ
  choice: Разве не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ.
- source_word: δώδεκα ὧραί εἰσιν τῆς ἡμέρας
  choice: двенадцать часов в дне
  rationale: Сохраняет образ дневного периода, разделённого на двенадцать часов, и близко передаёт греческую конструкцию.
- source_word: ἐάν τις περιπατῇ
  choice: Кто ходит
  rationale: Естественно передаёт обобщённое условие с неопределённым τις, не ограничивая его лицом определённого пола.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: днём
  rationale: Современное и естественное выражение, сохраняющее буквальный дневной образ.
- source_word: προσκόπτει
  choice: спотыкается
  rationale: Сохраняет буквальный образ и возможный переносный смысл.
- source_word: τὸ φῶς
  choice: свет
  rationale: Основное лексическое значение без внесения в текст явного богословского толкования.
- source_word: τοῦ κόσμου τούτου
  choice: этого мира
  rationale: Близко передаёт родительный оборот и указательную силу τούτου.
- source_word: βλέπει
  choice: видит
  rationale: Прямой эквивалент настоящего времени без пояснительного добавления «может».
theological_decisions:
- issue: Возможный символический смысл «света» в контексте Евангелия от Иоанна
  choice: Сохранить в основном тексте обычный образ света без явного отождествления с Иисусом или Божьим водительством.
  alternative: Передать выражение как прямую ссылку на Иисуса или духовное просвещение.
  rationale: Непосредственная формулировка представляет изречение через повседневный образ, но допускает более глубокий иоанновский смысл; перевод не должен устранять эту многозначность.
- issue: Обобщённое τις и формы единственного числа
  choice: Передать конструкцией «кто… тот», естественной для современного русского языка.
  alternative: «Если кто-либо ходит… он не спотыкается».
  rationale: Русская соотносительная конструкция точно сохраняет единственное и обобщённое значение, не вводя ненужной гендерной маркированности, которой нет у местоимения τις как такового.
translation_notes:
  register: Современный литературный русский язык; речь ясная и достойная. Риторическая форма сохранена, а повтор существительного «день» естественно передан сочетанием «в дне… днём». Все сноски имеют маркеры в основном тексте.
