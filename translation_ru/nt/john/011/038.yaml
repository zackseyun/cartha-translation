  text: Иисус тогда, снова глубоко взволнованный в душе[a], пришёл к гробнице. Гробница была пещерой, и ко входу в неё был привален камень.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «испытывая в душе негодование» или «сильно потрясённый в душе». Греческий глагол выражает необычайно сильное переживание и может указывать не только на скорбь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: тогда
  rationale: Передаёт переход к следующему событию и связь с предшествующей сценой естественным для русского повествования способом.
- source_word: πάλιν
  choice: снова
  rationale: Указывает на повтор сильного внутреннего переживания Иисуса, уже упомянутого ранее.
- source_word: ἐμβριμώμενος ἐν ἑαυτῷ
  choice: глубоко взволнованный в душе
  rationale: Сохраняет силу и внутренний характер переживания, не сводя его однозначно ни к скорби, ни к негодованию; более узкие варианты приведены в сноске.
- source_word: ἔρχεται
  choice: подошёл
  rationale: Историческое настоящее передано русским прошедшим временем; «подошёл» естественно описывает прибытие к находящейся рядом гробнице.
- source_word: μνημεῖον
  choice: гробница
  rationale: Обозначает место погребения; слово согласуется с последующим описанием пещеры.
- source_word: σπήλαιον
  choice: пещера
  rationale: Прямой и общепонятный современный эквивалент.
- source_word: λίθος
  choice: камень
  rationale: Обычное обозначение камня, которым закрывали вход в гробницу.
- source_word: ἐπέκειτο ἐπ’ αὐτῷ
  choice: ко входу которой был привален
  rationale: Передаёт положение камня у пещерной гробницы естественно по-русски; упоминание входа делает понятной функцию камня, не меняя образ описанной сцены.
theological_decisions:
- issue: Эмоциональная окраска ἐμβριμώμενος применительно к Иисусу
  choice: глубоко взволнованный в душе
  alternative: испытывая в душе негодование; сильно потрясённый в душе
  rationale: Глагол выражает сильное внутреннее волнение и может включать оттенок негодования, однако контекст стиха не позволяет бесспорно определить одну эмоцию. Основной текст сохраняет эту смысловую широту, а более сильный вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное по тону. Формулировка эмоционального состояния намеренно сохраняет неоднозначность греческого текста.
