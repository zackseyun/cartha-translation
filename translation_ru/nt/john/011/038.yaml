  source_fidelity: 'Основной смысл передан точно: οὖν («тогда»), πάλιν («снова/вновь»), сильное внутреннее переживание ἐμβριμώμενος ἐν ἑαυτῷ, гробница-пещера и камень у её входа. Однако «подошёл» может обозначать лишь приближение, тогда как ἔρχεται εἰς передаёт прибытие к гробнице; «пришёл к» точнее. Указание входа в последней части — оправданное прояснение пространственного образа, но лучше сформулировать его без относительной конструкции, относящей камень к гробнице несколько тяжеловесно.'
