source:
  edition: SBLGNT
  text: εἶπεν οὖν Θωμᾶς ὁ λεγόμενος Δίδυμος τοῖς συμμαθηταῖς· Ἄγωμεν καὶ ἡμεῖς ἵνα ἀποθάνωμεν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/016.yaml
  text: So Thomas[a], called Didymus, said to his fellow disciples, “Let us also go, so that we may die with him.”
translation:
  language: ru
  text: 'Тогда Фома, которого называли Близнецом[a], сказал своим товарищам-ученикам: «Пойдём и мы, чтобы умереть вместе с ним».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: По-гречески Дидим, то есть «Близнец».
    reason: Указывает греческую форму прозвания и раскрывает его значение.
lexical_decisions:
- source_word: οὖν
  choice: Тогда
  rationale: Передаёт повествовательно-логическое продолжение предыдущего разговора естественным современным русским языком.
- source_word: Θωμᾶς
  choice: Фома
  rationale: Устоявшаяся русская форма личного имени.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: которого называли Близнецом
  rationale: Δίδυμος означает «близнец»; перевод смыслового прозвания понятен русскому читателю и сохраняет пояснительную функцию оборота.
- source_word: τοῖς συμμαθηταῖς
  choice: остальным ученикам
  rationale: В данном контексте речь идёт о других учениках той же группы; такое выражение естественнее буквального «соученикам».
- source_word: Ἄγωμεν καὶ ἡμεῖς
  choice: Пойдём и мы
  rationale: Точно передаёт побудительный конъюнктив первого лица множественного числа и подчёркнутое включение говорящего с другими учениками.
- source_word: ἵνα ἀποθάνωμεν
  choice: чтобы умереть
  rationale: Сохраняет целевую или ожидаемо-результативную связь, не уточняя сверх текста степень вероятности.
- source_word: μετ’ αὐτοῦ
  choice: вместе с ним
  rationale: Естественно передаёт совместность; местоимение относится к Иисусу по контексту.
theological_decisions:
- issue: Тон и намерение слов Фомы
  choice: Высказывание передано прямо, без эмоциональной характеристики.
  alternative: Истолковать его как проявление отважной верности, обречённости либо иронического пессимизма.
  rationale: Греческий текст не определяет тон Фомы однозначно, поэтому перевод сохраняет эту психологическую и богословскую неоднозначность.
- issue: Написание местоимения, относящегося к Иисусу
  choice: ним
  alternative: Ним
  rationale: Строчная буква соответствует нейтральной современной орфографии и не добавляет отсутствующего в греческом тексте конфессионального графического различия.
translation_notes:
  register: Современный литературный русский язык; речь краткая, серьёзная и естественная. Формулировка не приписывает Фоме ни героизма, ни отчаяния, ни иронии.
