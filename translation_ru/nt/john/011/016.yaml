  verdict: revise
  source_fidelity: '«Остальным ученикам» несколько сужает/конкретизирует τοῖς συμμαθηταῖς: греческое слово обозначает соучеников, товарищей по ученичеству, а не обязательно «остальных» членов группы. Остальные элементы точно передают текст: οὖν как повествовательное «Тогда», побудительное «Пойдём и мы», а также неоднозначную целевую/ожидаемую связь «чтобы умереть вместе с ним».'
  naturalness: Текст звучит естественно и сдержанно на современном литературном русском. «Своим товарищам-ученикам» сохраняет значение συμμαθηταῖς и при этом избегает несколько книжного «соученикам».
  terminology: «Фома» — нормативная русская форма имени. «Близнец» корректно передаёт Δίδυμος; сноска уместно сохраняет греческую форму «Дидим» и поясняет её значение. Строчное «ним» нейтрально и не привносит конфессиональной интерпретации.
