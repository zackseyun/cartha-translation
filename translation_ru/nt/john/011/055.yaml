  source_fidelity: Нужна правка двух смысловых деталей. «Пришли» не передаёт ἀνέβησαν, которое в данном паломническом контексте означает «поднялись / взошли» в Иерусалим. «Жители той местности» добавляет понятие постоянного проживания и слишком конкретизирует χώρα; исходный текст говорит о многих, прибывших «из страны/окрестных мест».
  naturalness: Предлагаемая формулировка сохраняет современное литературное звучание. «Поднялись в Иерусалим» — естественное в библейско-повествовательном контексте обозначение пути в святой город и уместно передаёт исходный глагол.
  terminology: «Иудейская Пасха» — допустимая современная передача τὸ πάσχα τῶν Ἰουδαίων; сноска правильно сохраняет более буквальное «Пасха иудеев». «Очиститься» вместе с культурной сноской не вносит позднейших богословских смыслов и достаточно передаёт ἁγνίσωσιν ἑαυτούς.
