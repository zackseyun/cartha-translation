  text: Ἦν δὲ ἐγγὺς τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβησαν πολλοὶ εἰς Ἱεροσόλυμα ἐκ τῆς χώρας πρὸ τοῦ πάσχα ἵνα ἁγνίσωσιν ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/055.yaml
  text: The Passover of the Jews was near[b][a], and many went up to Jerusalem from the countryside before the Passover to purify themselves.
translation:
  language: ru
  text: Приближалась иудейская Пасха[a], и многие из окрестных мест поднялись в Иерусалим до Пасхи, чтобы очиститься[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Пасха иудеев» — выражение, неоднократно встречающееся у Иоанна.'
    reason: lexical_alternative
  - marker: b
    text: То есть пройти ритуальное очищение в рамках подготовки к Пасхе.
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν δὲ ἐγγὺς
  choice: Приближалась
  rationale: Естественно передаёт временное значение ἐγγὺς; мягкая связка δέ не требует отдельного русского слова и поддерживается порядком повествования.
- source_word: τὸ πάσχα τῶν Ἰουδαίων
  choice: иудейская Пасха
  rationale: Естественная современная русская передача греческого генитива; «иудейская» сохраняет характерное для Иоанна уточнение.
- source_word: ἀνέβησαν ... εἰς Ἱεροσόλυμα
  choice: пришли в Иерусалим
  rationale: По-русски естественно описывает паломничество к городу; буквальное «поднялись» могло бы неоправданно выдвинуть на первый план рельеф или звучать неясно.
- source_word: πολλοὶ ... ἐκ τῆς χώρας
  choice: многие жители той местности
  rationale: χώρα может обозначать область или местность вне города; такая формулировка не сужает значение до сельской местности и естественно выражает подразумеваемых людей.
- source_word: πρὸ τοῦ πάσχα
  choice: ещё до Пасхи
  rationale: Передаёт временное предшествование и подчёркивает, что паломники прибыли заранее.
- source_word: ἵνα ἁγνίσωσιν ἑαυτούς
  choice: чтобы очиститься
  rationale: Сохраняет цель и возвратное значение, не перегружая основной текст пояснением о ритуальном характере очищения.
theological_decisions:
- issue: Характер очищения перед Пасхой
  choice: «чтобы очиститься» с пояснением в сноске о ритуальной подготовке
  alternative: «чтобы совершить обряд очищения»
  rationale: Контекст указывает на иудейское ритуальное очищение перед праздником, но греческий текст выражен шире; основной текст сохраняет формулировку источника, а сноска даёт необходимый культурный контекст.
translation_notes:
  register: Современный литературный русский язык с ясным, повествовательным и достойным звучанием. Слово «иудейская» сохраняет исторический контекст; сноски отделяют буквальную форму и культурное пояснение от плавного основного текста.
