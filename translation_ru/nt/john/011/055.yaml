- from: Приближалась иудейская Пасха[a], и многие жители той местности пришли в Иерусалим ещё до Пасхи, чтобы очиститься[b].
  to: Приближалась иудейская Пасха[a], и многие из окрестных мест поднялись в Иерусалим до Пасхи, чтобы очиститься[b].
