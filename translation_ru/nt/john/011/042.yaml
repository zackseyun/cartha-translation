revisions:
- from: Но Я знал, что Ты всегда слышишь Меня. Я сказал это ради стоящего вокруг народа, чтобы они поверили, что именно Ты послал Меня.
  to: Я же знал, что Ты всегда слышишь Меня; но сказал это ради толпы, стоявшей вокруг, чтобы они поверили, что именно Ты послал Меня.
  rationale: Добавлен союз «но» для передачи ἀλλά. «Народ» заменён на «толпы», а определение перестроено в форму «толпы, стоявшей вокруг», чтобы точно и естественно передать τὸν ὄχλον τὸν περιεστῶτα. Смысл, цель и акцент на субъекте послания сохранены.
