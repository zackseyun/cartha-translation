  text: ἐγὼ δὲ ᾔδειν ὅτι πάντοτέ μου ἀκούεις· ἀλλὰ διὰ τὸν ὄχλον τὸν περιεστῶτα εἶπον, ἵνα πιστεύσωσιν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/042.yaml
  text: But I knew that you always hear me[a]. Yet I said this because of the crowd standing around[b], so that they may believe that you sent me.
translation:
  language: ru
  text: Я же знал, что Ты всегда слышишь Меня; но сказал это ради толпы, стоявшей вокруг, чтобы они поверили, что именно Ты послал Меня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾔδειν
  choice: Я знал
  rationale: Форма οἶδα имеет здесь значение прошедшего времени; «знал» естественно передаёт её без неоправданного оттенка предпрошедшего времени.
- source_word: πάντοτέ μου ἀκούεις
  choice: Ты всегда слышишь Меня
  rationale: 'Сохраняет наречие «всегда» и обычное для молитвенного контекста значение ἀκούω с родительным: воспринимать обращение, слышать молящегося.'
- source_word: ἀλλὰ διὰ τὸν ὄχλον τὸν περιεστῶτα
  choice: Я сказал это ради стоящего вокруг народа
  rationale: ἀλλά вводит противопоставление, которое по-русски достаточно ясно выражено соположением предложений; διά с винительным допускает целевое «ради», а причастие передаёт присутствие людей вокруг Иисуса.
- source_word: εἶπον
  choice: Я сказал это
  rationale: «Это» естественно указывает на только что произнесённые слова молитвы, не расширяя их содержания.
- source_word: ἵνα πιστεύσωσιν
  choice: чтобы они поверили
  rationale: Передаёт целевое значение ἵνα с сослагательным наклонением.
- source_word: ὅτι σύ με ἀπέστειλας
  choice: что именно Ты послал Меня
  rationale: «Именно Ты» передаёт выраженное в греческом тексте местоимение σύ и его вероятное смысловое выделение; «послал» сохраняет аорист и тему посланничества.
theological_decisions:
- issue: Слова о том, что Отец всегда слышит Иисуса
  choice: 'Сохранено прямое утверждение: «Ты всегда слышишь Меня».'
  alternative: Истолковать выражение как общее учение об услышанной молитве или развернуть его в утверждение об ответе на молитву.
  rationale: Текст прямо говорит об отношениях Иисуса с Отцом в данном эпизоде; перевод не добавляет систематического богословского объяснения.
- issue: Цель произнесённых вслух слов
  choice: Публичное высказывание должно привести окружающих к вере в то, что Отец послал Иисуса.
  alternative: Ограничить цель подтверждением только данного чуда или расширить её до явной формулы о природе Иисуса.
  rationale: Целевая конструкция непосредственно относится к вере в посланничество Иисуса; её смысл сохранён без сужения и богословского расширения.
translation_notes:
  register: Современный литературный русский язык с молитвенной торжественностью. Местоимения обращения к Богу и относящиеся к Иисусу личные местоимения написаны с прописной буквы согласно принятому в русском библейском стиле уважительному употреблению. «Народ» выбрано вместо более нейтральной «толпы» как естественное и достойное обозначение собравшихся людей.
