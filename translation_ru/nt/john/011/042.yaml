    rationale: 'В проекте отсутствует русское «но», соответствующее явному противительному союзу: Иисус знал, что Отец всегда слышит Его, но произнёс эти слова ради присутствующей толпы.'
  - severity: low
    issue: «Народа» менее точно и создаёт менее согласованную связку с «они».
    rationale: ὄχλος обозначает толпу/собравшуюся группу. «Толпы» непосредственно передаёт это значение и естественно согласуется с местоимением «они».
