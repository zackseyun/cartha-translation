  text: ἠγάπα δὲ ὁ Ἰησοῦς τὴν Μάρθαν καὶ τὴν ἀδελφὴν αὐτῆς καὶ τὸν Λάζαρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/005.yaml
  text: Jesus loved Martha and her sister and Lazarus.
translation:
  language: ru
  text: Иисус же любил Марфу, её сестру и Лазаря.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάπα
  choice: любил
  rationale: Имперфект глагола ἀγαπάω здесь естественно передаёт продолжительное состояние в прошлом. Русское «любил» выражает это без неестественной перифразы.
- source_word: δὲ
  choice: же
  rationale: Частица «же» естественно передаёт лёгкую связующую и тематическую функцию δέ, не придавая ей сильного противительного смысла.
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: её сестру
  rationale: Естественное русское соответствие существительному с притяжательным местоимением; имя сестры в сам стих не добавляется.
- source_word: Μάρθαν
  choice: Марфу
  rationale: Традиционная русская форма имени в винительном падеже.
- source_word: Λάζαρον
  choice: Лазаря
  rationale: Традиционная русская форма имени в винительном падеже.
- source_word: καὶ ... καὶ ... καὶ
  choice: Марфу, её сестру и Лазаря
  rationale: 'Однородный ряд передан по нормам современного русского языка: запятой и заключительным союзом «и». Это сохраняет равноправие трёх дополнений без тяжеловесного повторения союза.'
theological_decisions:
- issue: Значение имперфекта ἠγάπα применительно к любви Иисуса
  choice: Продолжительное отношение любви Иисуса к Марфе, её сестре и Лазарю
  alternative: Начало любви («полюбил») или подчёркнуто процессуальное «продолжал любить»
  rationale: В данном контексте имперфект наиболее естественно обозначает устойчивое состояние в прошлом; перевод не добавляет эмоциональных или доктринальных уточнений сверх текста.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, естественная и достойная. Частица «же» сохраняет мягкую связь с контекстом, а имена даны в привычных русских библейских формах.
