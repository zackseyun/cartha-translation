  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῇ ὁ Ἰησοῦς
  choice: Иисус сказал ей
  rationale: Греческое историческое настоящее λέγει в современном русском повествовании естественно передаётся прошедшим временем; дательный αὐτῇ обозначает адресата — Марфу.
- source_word: Οὐκ εἶπόν σοι
  choice: Разве Я не сказал тебе
  rationale: Форма вопроса предполагает утвердительный ответ. «Разве Я не сказал тебе» естественно сохраняет риторический характер и личное обращение.
- source_word: ἐὰν πιστεύσῃς
  choice: если будешь верить
  rationale: Условная конструкция с аористом сослагательного наклонения выражает условие, ориентированное на предстоящее событие. «Верить» сохраняет характерную для Иоанна лексику, не сужая её до отдельного доктринального толкования.
- source_word: ὄψῃ
  choice: увидишь
  rationale: Будущая форма ὁράω прямо и естественно передаётся русским будущим временем.
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: славу Бога
  rationale: «Слава» — традиционный и смыслово ёмкий эквивалент δόξα, сохраняющий тему явления Божьего величия и действия; генитив τοῦ θεοῦ передан без дополнительного истолкования.
theological_decisions:
- issue: Связь веры с видением славы Бога
  choice: Слова переданы как прямое условное обещание, обращённое к Марфе.
  alternative: Истолковать их либо как универсальный принцип о вере и чудесах, либо как обещание, относящееся исключительно к воскрешению Лазаря.
  rationale: Сам стих не определяет весь объём применения обещания. Перевод сохраняет условную формулировку и её напряжение, не добавляя богословских ограничений или обобщений.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавное «Я» в прямой речи Иисуса следует распространённой русской библейской типографической традиции. Формулировка ясна обычному читателю и близка к структуре греческого текста без неестественного буквализма.
