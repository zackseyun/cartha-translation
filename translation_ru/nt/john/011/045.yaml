base_translation:
  language: en
  yaml_path: translation/nt/john/011/045.yaml
  text: Therefore many of the Jews who had come to Mary and had seen what he had done believed in him[a].
translation:
  language: ru
  text: Поэтому многие из иудеев, пришедших к Марии и увидевших, что сделал Иисус, поверили в Него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «многие из числа иудеев». В некоторых контекстах Евангелия от Иоанна Ἰουδαῖοι может пониматься в региональном смысле: «жители Иудеи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ οὖν
  choice: Поэтому многие
  rationale: «Многие» прямо передаёт количественное значение Πολλοί, а «поэтому» сохраняет выводно-следственную связь οὖν с предшествующим рассказом о воскрешении Лазаря.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: из иудеев
  rationale: 'Передаёт партитивную конструкцию ἐκ: речь идёт о многих из числа обозначенной группы. «Иудеи» — традиционное и естественное русское соответствие, а возможный региональный оттенок отмечен в сноске.'
- source_word: οἱ ἐλθόντες πρὸς τὴν Μαριὰμ
  choice: пришедших к Марии
  rationale: Причастный оборот естественно определяет, о каких именно людях идёт речь, и сохраняет направительное значение πρὸς.
- source_word: θεασάμενοι
  choice: увидевших
  rationale: Передаёт фактическое зрительное наблюдение; более тяжеловесное «созерцавших» в данном повествовательном контексте не требуется.
- source_word: ἃ ἐποίησεν
  choice: что сделал Иисус
  rationale: Русское «что сделал» естественно передаёт множественное относительное ἃ с ποιέω. Имя «Иисус» восстанавливает явного референта местоименно подразумеваемого подлежащего и предотвращает двусмысленность после упоминания Марии.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: поверили в Него
  rationale: Это естественное русское соответствие характерной для Иоанна конструкции πιστεύω εἰς, выражающей веру, направленную на Иисуса, без избыточного доктринального расширения.
theological_decisions:
- issue: Передача πιστεύω εἰς αὐτόν в контексте веры в Иисуса
  choice: поверили в Него
  alternative: уверовали в Него; доверились Ему
  rationale: «Поверили в Него» сохраняет объектно-направленную конструкцию и остаётся понятным современным читателям. «Уверовали» имеет более выраженную церковную окраску, а «доверились» сильнее конкретизирует характер веры, чем это делает сам глагол.
- issue: Значение Ἰουδαῖοι
  choice: иудеи
  alternative: жители Иудеи
  rationale: В данном месте слово может обозначать еврейскую группу в повествовании Иоанна, тогда как строго региональное прочтение не бесспорно. Основной текст сохраняет широкое традиционное обозначение, а альтернативный нюанс вынесен в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан плавным и ясным; имя Иисуса указано вместо неявного греческого подлежащего, чтобы избежать возможной референциальной неясности. Маркер сноски помещён непосредственно после предложения.
