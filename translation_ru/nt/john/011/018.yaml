lexical_decisions:
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Слабый повествовательный связующий элемент; в современном русском естественно передать переход самим построением фразы, не добавляя временного «теперь» и не усиливая противопоставление.
- source_word: ἡ Βηθανία
  choice: Вифания
  rationale: Традиционная и общепонятная русская форма географического названия.
- source_word: ἐγγὺς τῶν Ἱεροσολύμων
  choice: недалеко от Иерусалима
  rationale: Передаёт пространственную близость естественным русским оборотом; форма «Иерусалим» соответствует принятому русскому названию.
- source_word: ὡς
  choice: примерно
  rationale: При указании меры слово обозначает приблизительность, которую важно сохранить.
- source_word: ἀπὸ σταδίων δεκαπέντε
  choice: в пятнадцати стадиях от него
  rationale: Сохраняет древнюю единицу расстояния и пространственное значение ἀπό; местоимение однозначно отсылает к Иерусалиму.
