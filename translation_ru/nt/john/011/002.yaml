base_translation:
  language: en
  yaml_path: translation/nt/john/011/002.yaml
  text: It was Mary who had anointed the Lord with perfume and wiped his feet with her hair[a], whose brother Lazarus was sick.
translation:
  language: ru
  text: Это была Мария, которая помазала Господа благовонным маслом[a] и вытерла его ноги своими волосами; её брат Лазарь был болен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благовонной мазью»; греческое слово обозначает ароматическое масло или мазь.'
    reason: 'Лексическая альтернатива: μύρον может обозначать как благовонное масло, так и ароматическую мазь.'
lexical_decisions:
- source_word: ἦν δὲ
  choice: Это была
  rationale: Передаёт идентифицирующую конструкцию естественным русским оборотом; отдельное «теперь» не добавляется, поскольку в греческом нет явного временного наречия.
- source_word: Μαριὰμ
  choice: Мария
  rationale: Использована традиционная русская форма имени.
- source_word: ἡ ἀλείψασα
  choice: которая помазала
  rationale: Артикль с аористным причастием описательно определяет Марию; русское придаточное сохраняет эту функцию и звучит естественно.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Сохраняет титул κύριος и его повествовательно-богословский вес.
- source_word: μύρῳ
  choice: благовонным маслом
  rationale: μύρον обозначает ароматическое масло или мазь; выбран ясный современный эквивалент, связанный с обрядом помазания.
- source_word: καὶ ἐκμάξασα
  choice: и вытерла
  rationale: Точно и естественно передаёт действие ἐκμάσσω — вытирать, обтирать насухо.
- source_word: τοὺς πόδας αὐτοῦ
  choice: его ноги
  rationale: Прямой и естественный русский эквивалент.
- source_word: ταῖς θριξὶν αὐτῆς
  choice: своими волосами
  rationale: Творительный падеж передаёт орудийное значение дательного, а возвратное притяжательное однозначно связывает волосы с Марией.
- source_word: ἧς ὁ ἀδελφὸς Λάζαρος
  choice: её брат Лазарь
  rationale: Сохраняет родственную связь, выраженную родительным относительным местоимением, с естественной для русского языка перестройкой после точки с запятой.
- source_word: ἠσθένει
  choice: был болен
  rationale: В данном контексте глагол обозначает продолжавшуюся физическую болезнь; форма «был болен» передаёт значение имперфекта.
theological_decisions:
- issue: Передача κύριος как титула Иисуса
  choice: Господь
  alternative: господин / учитель
  rationale: «Господь» сохраняет титульное и богословское значение слова в повествовании Иоанна, не сводя его к обычному социальному обращению.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Точка с запятой позволяет ясно передать длинную относительную конструкцию оригинала. Местоимение «его» дано со строчной буквы согласно общим нормам современного русского текста; титул «Господь» сохранён с прописной.
