    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ... οὐκ εἶπεν
  choice: Он сказал это не
  rationale: 'δέ передано без отдельного союза: по-русски переход и слабое противопоставление естественно выражаются всей конструкцией с «но» далее; λέγω — обычное «сказать».'
- source_word: ἀφ’ ἑαυτοῦ
  choice: от себя
  rationale: Сохраняет значение источника высказывания и допускает смысл «по собственной инициативе», не уточняя его сверх текста.
- source_word: ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: но, будучи в тот год первосвященником
  rationale: Причастный оборот сохраняет греческую конструкцию и её фоново-причинный оттенок, не превращая его в недвусмысленное «потому что».
- source_word: ἐπροφήτευσεν
  choice: пророчествовал
  rationale: Прямо передаёт пророческий характер речи, заявленный евангелистом.
- source_word: ἔμελλεν ... ἀποθνῄσκειν
  choice: Иисусу предстояло умереть
  rationale: «Предстояло» естественно передаёт направленность к будущему и определённость грядущего события, не сводя μέλλω исключительно к непосредственной близости.
- source_word: ὑπὲρ τοῦ ἔθνους
  choice: за народ
  rationale: «За» в данном контексте сохраняет широкий благодетельный и представительский смысл ὑπέρ, не навязывая узкую техническую формулу; «народ» по-русски естественно обозначает здесь народ Израиля.
theological_decisions:
- issue: Пророческий характер слов Каиафы
  choice: Текст прямо говорит, что он пророчествовал в связи со своим положением первосвященника.
  alternative: Считать это лишь иронией либо утверждать, что Каиафа полностью осознавал богодухновенный смысл своих слов.
  rationale: Перевод сохраняет реальную пророческую силу глагола, но ничего не добавляет о внутреннем понимании или нравственном состоянии Каиафы.
- issue: Смысл ὑπέρ применительно к смерти Иисуса
  choice: за народ
  alternative: ради народа; от имени народа; вместо народа
  rationale: Краткое русское «за» удерживает богословскую насыщенность и возможный благодетельный/представительский смысл, не разрешая неоднозначность в пользу одной формулы искупления.
translation_notes:
  register: Современный литературный русский язык; синтаксис достоинственный и ясный. «Первосвященник» и «пророчествовал» сохранены как общеупотребительные библейские термины. Местоимение «Он» следует современному русскому оформлению повествования; запятые выделяют причастный оборот.
