id: JHN.11.11
reference: John 11:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ταῦτα εἶπεν, καὶ μετὰ τοῦτο λέγει αὐτοῖς· Λάζαρος ὁ φίλος ἡμῶν κεκοίμηται, ἀλλὰ πορεύομαι ἵνα ἐξυπνίσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/011.yaml
  text: After saying these things[a], he said to them, “Lazarus our friend has fallen asleep, but I am going so that I may wake him up.”
translation:
  language: ru
  text: 'Сказав всё это, он затем сказал им: «Наш друг Лазарь уснул[a], но я иду разбудить его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть умер. Здесь Иисус образно называет смерть сном; в следующих стихах ученики сначала понимают Его слова буквально.
    reason: Поясняет переносное значение, не устраняя образ сна из основного текста.
lexical_decisions:
- source_word: ταῦτα εἶπεν
  choice: Сказав всё это
  rationale: Естественная русская конструкция передаёт завершённое предшествующее высказывание; «всё это» сохраняет отсылку к сказанному ранее и множественное значение ταῦτα.
- source_word: καὶ μετὰ τοῦτο λέγει αὐτοῖς
  choice: он затем сказал им
  rationale: «Затем» ясно обозначает последовательность, а прошедшее время естественно передаёт историческое настоящее λέγει в русском повествовании.
- source_word: Λάζαρος ὁ φίλος ἡμῶν
  choice: Наш друг Лазарь
  rationale: Естественный современный русский порядок слов сохраняет личное и тёплое обозначение Лазаря как общего друга.
- source_word: κεκοίμηται
  choice: уснул
  rationale: Сохранена намеренная метафора сна, обозначающая смерть; совершенный вид выражает наступившее состояние и не снимает последующего непонимания учеников.
- source_word: ἀλλὰ πορεύομαι
  choice: но я иду
  rationale: Переданы противопоставление и настоящее время, указывающее на намеренное предстоящее действие Иисуса.
- source_word: ἵνα ἐξυπνίσω αὐτόν
  choice: разбудить его
  rationale: Русский инфинитив после глагола движения естественно и ясно выражает цель, сохраняя образ сна и пробуждения.
theological_decisions:
- issue: Передавать ли κεκοίμηται прямо как «умер» или сохранить образ сна
  choice: 'Сохранить в основном тексте метафору: «уснул»'
  alternative: умер
  rationale: Иисус намеренно говорит о смерти образно, а в следующих стихах ученики понимают Его буквально. Слово «уснул» сохраняет повествовательное напряжение и богословскую многозначность, не внося разъяснение раньше самого повествования.
translation_notes:
  register: Современный литературный русский язык с ясным, спокойным повествовательным ритмом. Местоимения, относящиеся к Иисусу, даны со строчной буквы в соответствии с обычной современной орфографией; реплика остаётся естественной и достоинство речи сохраняется.
