    text: 'Или: «иудеяне». Здесь имеются в виду иудеи, пришедшие вместе с Марией, а не еврейский народ в целом.'
    reason: lexical_alternative
  - marker: b
    text: Греческий глагол выражает сильное внутреннее волнение и может также означать «исполнился негодования» или «был глубоко потрясён».
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: не выражено отдельным словом
  rationale: Связь с предшествующим повествованием естественно передаётся русской синтаксической конструкцией; отдельное «итак» здесь звучало бы излишне логически, а «тогда» могло бы восприниматься только как временной указатель.
- source_word: ὡς εἶδεν
  choice: увидев
  rationale: 'Деепричастная конструкция естественно передаёт временное значение: эмоциональная реакция последовала, когда Иисус увидел плачущих.'
- source_word: κλαίουσαν / κλαίοντας
  choice: плачет / плачут
  rationale: κλαίω обозначает явный, обычно слышимый плач. Нейтральное «плакать» сохраняет смысл, не усиливая его до обрядового причитания.
- source_word: τοὺς συνελθόντας αὐτῇ Ἰουδαίους
  choice: пришедшие с ней иудеи
  rationale: Передаёт совместное прибытие и контекстуально ограничивает обозначение присутствующими иудейскими участниками траура.
- source_word: ἐνεβριμήσατο
  choice: глубоко возмутился
  rationale: Глагол выражает сильное внутреннее волнение с возможным оттенком негодования. «Глубоко возмутился» лучше сохраняет эту резкость, чем более общее «растрогался», но не определяет причину или объект чувства.
- source_word: τῷ πνεύματι
  choice: духом
  rationale: Дательный падеж обозначает внутреннюю сферу сильной реакции; буквальное «духом» естественно в возвышенном повествовательном регистре.
- source_word: ἐτάραξεν ἑαυτόν
  choice: привёл Себя в смятение
  rationale: Сохраняет необычную активную возвратную форму греческого текста, не сглаживая её до «пришёл в смятение».
theological_decisions:
- issue: Характер чувства Иисуса в ἐνεβριμήσατο
  choice: глубоко возмутился
  alternative: был глубоко потрясён; исполнился негодования
  rationale: Греческий глагол допускает сильное внутреннее потрясение, но часто содержит оттенок негодования. Основной текст сохраняет интенсивность и этот возможный оттенок, а примечание оставляет точную эмоциональную окраску открытой.
- issue: Активная возвратность ἐτάραξεν ἑαυτόν
  choice: привёл Себя в смятение
  alternative: пришёл в смятение; встревожился
  rationale: Формулировка сохраняет грамматически явное действие Иисуса по отношению к Себе, не выводя из него дополнительных христологических заключений.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор глагола «плакать» сохранён вслед за оригиналом. Заглавное «Себя» применено по русской издательской традиции при указании на Иисуса; синтаксически отмеченное «привёл Себя в смятение» намеренно сохраняет возвратную активность исходного текста.
