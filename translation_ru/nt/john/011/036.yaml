base_translation:
  language: en
  yaml_path: translation/nt/john/011/036.yaml
  text: So the Jews were saying[a], “See how he loved him!”
translation:
  language: ru
  text: 'Итак, иудеи[a] говорили: «Смотрите, как он любил его!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жители Иудеи», если понимать это как более узкое региональное обозначение присутствовавших там иудеев.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: говорили
  rationale: Имперфект передаёт продолжавшуюся или повторявшуюся речь присутствующих; русское «говорили» естественно сохраняет сценический, незавершённый характер действия.
- source_word: οὖν
  choice: тогда
  rationale: Связывает реплику с плачем Иисуса в предыдущем стихе и естественно обозначает повествовательное следствие без излишне формального «итак» или «поэтому».
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Традиционно и достаточно буквально передаёт иоанновское обозначение; в данном контексте речь идёт о присутствовавших там иудеях, а не обо всём народе.
- source_word: Ἴδε
  choice: Смотрите
  rationale: Повелительная форма привлекает внимание собравшихся; множественное число естественно в обращении внутри группы наблюдателей.
- source_word: πῶς
  choice: как
  rationale: Сохраняет возможный оттенок как образа проявления, так и силы любви, не устраняя неоднозначность.
- source_word: ἐφίλει
  choice: любил
  rationale: Естественно передаёт личную привязанность, выраженную φιλέω; варианты «был привязан» и «дорожил» были бы более истолковательными.
- source_word: αὐτόν
  choice: его
  rationale: Местоимение относится к Лазарю и прямо соответствует греческому винительному падежу.
theological_decisions:
- issue: Передача οἱ Ἰουδαῖοι в Евангелии от Иоанна
  choice: иудеи
  alternative: жители Иудеи
  rationale: Основной текст сохраняет обычное иоанновское обозначение. Сноска уточняет возможное региональное понимание и ограниченный контекстом круг присутствующих, чтобы фраза не воспринималась как обобщение обо всех евреях.
translation_notes:
  register: Современный литературный русский язык; реплика звучит естественно и достойно. «Смотрите» передаёт живую речь группы, а «как он любил его» сохраняет простоту и эмоциональную силу оригинала.
