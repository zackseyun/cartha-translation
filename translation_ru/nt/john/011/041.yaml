base_translation:
  language: en
  yaml_path: translation/nt/john/011/041.yaml
  text: So they took away the stone[a]. And Jesus lifted his eyes upward and said, “Father[b], I thank you that you have heard me,”
translation:
  language: ru
  text: 'Тогда они убрали камень. Иисус же поднял глаза вверх[a] и сказал: «Отец, благодарю Тебя за то, что Ты услышал Меня[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные варианты: «поднял взор» или, более свободно, «посмотрел вверх».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Ты внял Мне». В контексте молитвы глагол «услышать» может подразумевать благосклонный ответ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: убрали
  rationale: В контексте входа в гробницу глагол означает, что камень удалили с места; «убрали» естественно передаёт действие, не уточняя способ перемещения.
- source_word: οὖν
  choice: тогда
  rationale: Передаёт последовательность и обусловленность действия предшествующим повелением, сохраняя естественный ход русского повествования.
- source_word: λίθον
  choice: камень
  rationale: Обычное и контекстуально точное обозначение камня, закрывавшего вход в гробницу.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Иисус же
  rationale: Частица δέ служит мягким переходом к действию Иисуса; «же» сохраняет этот переход без чрезмерно сильного противопоставления.
- source_word: ἦρεν τοὺς ὀφθαλμοὺς ἄνω
  choice: поднял глаза вверх
  rationale: Сохраняет образность греческого выражения и остаётся понятным современному русскому читателю.
- source_word: Πάτερ
  choice: Отец
  rationale: Прямое обращение в молитве, естественно передающее греческий звательный падеж без добавочной литургической стилизации.
- source_word: εὐχαριστῶ σοι
  choice: благодарю Тебя
  rationale: Краткая и естественная передача настоящего времени и адресованной Отцу благодарности.
- source_word: ὅτι ἤκουσάς μου
  choice: за то, что Ты услышал Меня
  rationale: Русское прошедшее совершенного вида естественно передаёт завершённое действие аориста и его значимость в настоящей ситуации.
theological_decisions:
- issue: Обращение Иисуса к Богу в молитве
  choice: Отец
  alternative: О Отец
  rationale: Простое обращение точно сохраняет близость и почтительность исходного текста, не привнося архаической или конфессионально окрашенной формы.
- issue: Смысл ἤκουσάς μου в контексте молитвы
  choice: Ты услышал Меня
  alternative: Ты внял Мне
  rationale: «Услышал» сохраняет формулировку исходного текста и подразумеваемое благосклонное принятие молитвы, не превращая подразумеваемый смысл в явное толкование.
translation_notes:
  register: Современный литературный русский язык с естественным повествовательным ритмом и сохранением образности оригинала. Местоимения, относящиеся к Отцу и Иисусу в прямой молитвенной речи, написаны с прописной буквы в соответствии с распространённой русской библейской традицией. Маркеры примечаний поставлены при тех выражениях, к которым относятся предложенные лексические варианты.
