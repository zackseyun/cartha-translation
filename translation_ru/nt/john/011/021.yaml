base_translation:
  language: en
  yaml_path: translation/nt/john/011/021.yaml
  text: So Martha said to Jesus[a], “Lord, if you had been here, my brother would not have died.”
translation:
  language: ru
  text: 'Итак, Марфа сказала Иисусу: «Господи[a], если бы ты был здесь, мой брат не умер бы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господин». Греческое κύριε могло быть почтительным обращением, однако перевод «Господи» сохраняет и возможный богословский оттенок этого слова в Евангелии от Иоанна.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Тогда
  rationale: Союз отмечает продолжение повествования и связь с предыдущим событием; «тогда» естественно передаёт эту функцию, не усиливая причинно-следственный оттенок.
- source_word: εἶπεν … πρὸς τὸν Ἰησοῦν
  choice: сказала Иисусу
  rationale: После глагола речи πρός с винительным падежом указывает на адресата; русская конструкция с дательным падежом передаёт это прямо и естественно.
- source_word: Κύριε
  choice: Господи
  rationale: Традиционная и естественная русская форма обращения к Иисусу сохраняет как уважительный смысл, так и возможный богословский оттенок слова κύριος в Евангелии от Иоанна.
- source_word: εἰ ἦς ὧδε
  choice: если бы ты был здесь
  rationale: Сочетание «если бы» с прошедшим временем естественно выражает по-русски нереальное условие в прошлом; ὧδε передано кратким и точным «здесь».
- source_word: οὐκ ἂν ἀπέθανεν
  choice: не умер бы
  rationale: Частица ἄν с аористом изъявительного наклонения выражает нереализованный результат в прошлом; русская условная конструкция точно сохраняет этот смысл.
- source_word: ὁ ἀδελφός μου
  choice: мой брат
  rationale: В данном контексте ἀδελφός обозначает родного брата Марфы, Лазаря; прямой русский эквивалент однозначен.
theological_decisions:
- issue: Значение обращения κύριε к Иисусу
  choice: Господи
  alternative: Господин
  rationale: «Господи» сохраняет обычное почтительное обращение к Иисусу и возможный христологический смысл, не утверждая, что в этой реплике Марфа непременно вкладывает в слово полный богословский титул.
translation_notes:
  register: Современный литературный русский язык с простым, достоинственным синтаксисом. Местоимение «ты» написано со строчной буквы, чтобы не вносить отсутствующее в греческом тексте дополнительное конфессионально-стилистическое различие.
