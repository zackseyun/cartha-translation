  text: ἐζήτουν οὖν τὸν Ἰησοῦν καὶ ἔλεγον μετ’ ἀλλήλων ἐν τῷ ἱερῷ ἑστηκότες· Τί δοκεῖ ὑμῖν; ὅτι οὐ μὴ ἔλθῃ εἰς τὴν ἑορτήν;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/056.yaml
  text: So they were looking for Jesus and saying to one another as they stood in the temple courts[b][a], “What do you think? That he certainly will not come to the feast?”
translation:
  language: ru
  text: 'Итак, они искали Иисуса и, стоя в храме[a], говорили друг другу: «Как вы думаете? Неужели Он совсем не придёт на праздник?»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое ἱερόν означает весь храмовый комплекс, а не только внутреннее святилище.
    reason: cultural_note
  - marker: b
    text: 'В греческом тексте употреблено усиленное отрицание: возможный перевод — «Он ни за что не придёт на праздник?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: искали
  rationale: Имперфект передаёт продолжавшееся действие; русское «искали» естественно описывает попытки найти Иисуса.
- source_word: οὖν
  choice: Итак
  rationale: Связывает стих с предшествующим повествованием, выражая продолжение и вывод из контекста.
- source_word: ἔλεγον μετ’ ἀλλήλων
  choice: говорили друг другу
  rationale: Имперфект допускает продолжавшийся или повторявшийся разговор, а взаимное местоимение передано естественной русской конструкцией.
- source_word: ἐν τῷ ἱερῷ
  choice: во дворах храма
  rationale: ἱερόν обозначает храмовый комплекс, а не внутреннее святилище; формулировка помогает сохранить это различие.
- source_word: ἑστηκότες
  choice: стоя
  rationale: Причастие описывает положение собеседников; деепричастная конструкция звучит естественно и сохраняет одновременность.
- source_word: Τί δοκεῖ ὑμῖν;
  choice: Как вы думаете?
  rationale: Современная идиоматическая передача вопроса о мнении собеседников.
- source_word: ὅτι οὐ μὴ ἔλθῃ
  choice: Неужели Он совсем не придёт
  rationale: В вопросительном контексте «неужели» естественно вводит предполагаемый ответ, а «совсем не» передаёт усиленное отрицание οὐ μή, не превращая неоднозначную реплику в категорическое утверждение.
- source_word: εἰς τὴν ἑορτήν
  choice: на праздник
  rationale: В контексте речь идёт о празднике Пасхи; «на праздник» естественно по-русски и не требует добавлять отсутствующее в стихе название.
theological_decisions:
- issue: Прагматическая сила вопроса с οὐ μή
  choice: «Неужели Он совсем не придёт на праздник?»
  alternative: «Он наверняка не придёт на праздник?»
  rationale: Греческая конструкция выражает сильное отрицание, но синтаксис и пунктуация допускают вопросительную реплику с оттенком недоумения или ожидания. Выбранный вариант сохраняет и усиление, и вопросительность, не приписывая говорящим чрезмерно определённой позиции.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены повествовательная связь, длительность действий и выразительная неоднозначность заключительного вопроса.
