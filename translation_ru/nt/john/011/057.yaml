id: JHN.11.57
reference: John 11:57
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: δεδώκεισαν ⸀δὲ οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ⸀ἐντολὰς ἵνα ἐάν τις γνῷ ποῦ ἐστιν μηνύσῃ, ὅπως πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/057.yaml
  text: The chief priests and the Pharisees had given orders that if anyone knew where he was[a], he should report it[b], so that they might seize him.
translation:
  language: ru
  text: 'Первосвященники же и фарисеи отдали приказ: если кто узнает, где Он находится, пусть сообщит об этом, чтобы они схватили Его.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы они арестовали Его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδώκεισαν
  choice: отдали
  rationale: Плюсквамперфект обозначает уже отданное к данному моменту распоряжение; в русском повествовании относительная предшествованность естественно передаётся прошедшим временем без громоздкого «уже отдали».
- source_word: δὲ
  choice: же
  rationale: Частица отмечает развитие повествования и лёгкое сопоставление с предыдущим контекстом, не создавая сильного противопоставления.
- source_word: οἱ ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся русское обозначение ведущих представителей храмовой священнической власти во множественном числе.
- source_word: οἱ Φαρισαῖοι
  choice: фарисеи
  rationale: Устоявшееся русское наименование этой иудейской религиозной группы.
- source_word: ἐντολὰς
  choice: приказ
  rationale: В административно-властном контексте слово обозначает обязательное распоряжение; единственное число по-русски естественно передаёт собирательный смысл греческого множественного.
- source_word: ἵνα ἐάν τις γνῷ
  choice: если кто узнает
  rationale: Сохраняет условный характер предписания и аористную направленность на получение или наличие сведений; «узнает» здесь естественнее буквального «знает».
- source_word: ποῦ ἐστιν
  choice: где Он находится
  rationale: Настоящее время греческого текста сохранено; «находится» ясно указывает на текущее местонахождение в составе косвенной речи.
- source_word: μηνύσῃ
  choice: пусть сообщит об этом
  rationale: Передаёт требование донести властям сведения, не добавляя прямо не названного адресата.
- source_word: ὅπως πιάσωσιν αὐτόν
  choice: чтобы они схватили Его
  rationale: Сохраняет цель распоряжения и основное значение πιάζω — схватить, захватить; более узкое юридическое «арестовать» не вносится в основной текст.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Заглавные местоимения в отношении Иисуса соответствуют распространённой русской библейской издательской традиции. Порядок «Первосвященники же» сохраняет связующую роль δέ без добавления отсутствующего в оригинале временного наречия.
