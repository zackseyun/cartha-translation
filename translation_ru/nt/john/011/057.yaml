  verdict: approve
  source_fidelity: 'Текст точно передаёт греческий оригинал: δεδώκεισαν адекватно выражено прошедшим временем («отдали») в естественном русском повествовании; δέ передано ненавязчивым «же»; условие ἵνα ἐάν τις γνῷ, настоящее ἐστιν и цель ὅπως πιάσωσιν αὐτόν сохранены. «Где Он находится» удачно удерживает настоящее время оригинала.'
  naturalness: 'Фраза звучит естественно на современном литературном русском и сохраняет сдержанный библейский регистр. Конструкция «отдали приказ: если кто узнает ... пусть сообщит» ясна и нормативна. «Кто» несколько книжнее, но уместно для регистра и не препятствует пониманию.'
  terminology: «Первосвященники», «фарисеи» и «схватили» соответствуют принятой русской библейской терминологии и греческому смыслу. Сноска корректно предлагает контекстуально возможное, но более узкое «арестовали», не навязывая его основному тексту. Маркер сноски расположен после завершения высказывания и относится к «схватили Его».
