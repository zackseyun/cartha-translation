revisions:
- from: Итак, придя, Иисус узнал, что Лазарь уже четыре дня находится в гробнице.
  to: Итак, когда Иисус пришёл, он обнаружил, что Лазарь уже четыре дня находился в гробнице.
  rationale: Исправление заменяет семантически менее точное «узнал» на «обнаружил» и согласует описание состояния Лазаря с прошедшей повествовательной перспективой. Смысл о четырёх днях в гробнице сохранён без добавления деталей о погребении или способе исчисления срока.
