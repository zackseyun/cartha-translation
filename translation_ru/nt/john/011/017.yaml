  text: Ἐλθὼν οὖν ὁ Ἰησοῦς εὗρεν αὐτὸν τέσσαρας ⸂ἤδη ἡμέρας⸃ ἔχοντα ἐν τῷ μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/017.yaml
  text: So when Jesus arrived, he found that Lazarus had already been in the tomb four days.
translation:
  language: ru
  text: Итак, когда Иисус пришёл, он обнаружил, что Лазарь уже четыре дня находился в гробнице.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν
  choice: придя
  rationale: Аористное причастие обозначает действие, предшествующее главному глаголу; русское деепричастие естественно и точно передаёт эту временную связь.
- source_word: οὖν
  choice: итак
  rationale: Здесь частица служит повествовательной связкой с предшествующим контекстом, а не выражает строгий логический вывод.
- source_word: εὗρεν
  choice: узнал
  rationale: В данном контексте εὑρίσκω означает установление факта по прибытии; «узнал» естественно вводит придаточное с сообщением о длительности пребывания Лазаря в гробнице.
- source_word: αὐτὸν
  choice: Лазарь
  rationale: Местоимение однозначно отсылает к Лазарю; явное имя устраняет возможную неясность в русском предложении, не добавляя новой информации.
- source_word: τέσσαρας ἤδη ἡμέρας ἔχοντα
  choice: уже четыре дня находится
  rationale: Греческая идиома буквально говорит об «имеющем уже четыре дня» и обозначает истёкший срок пребывания в гробнице. Русская конструкция передаёт длительность естественно; настоящее время обусловлено точкой отсчёта при прибытии Иисуса.
- source_word: ἐν τῷ μνημείῳ
  choice: в гробнице
  rationale: μνημεῖον обозначает место погребения; «гробница» точнее передаёт сооружение или высеченное погребальное помещение, чем «гроб».
theological_decisions:
- issue: Явное обозначение референта αὐτόν
  choice: Назвать Лазаря по имени
  alternative: Сохранить местоимение «он» или «его»
  rationale: Референт местоимения ясен из контекста. Имя делает современное русское предложение однозначным и не привносит богословского толкования.
- issue: Отсчёт четырёх дней
  choice: Передать как длительность пребывания в гробнице
  alternative: 'Буквально: «имеет уже четыре дня в гробнице»'
  rationale: Греческая конструкция идиоматически указывает на прошедшие со времени погребения дни. Перевод сохраняет смысл, не уточняя сверх текста способ их исчисления.
translation_notes:
  register: Современный литературный русский язык; повествовательный стиль с умеренной формальностью. Формулировка «придя, Иисус узнал» сохраняет структуру греческого предложения, а «находится в гробнице» естественно выражает продолжающееся состояние к моменту прибытия.
