lexical_decisions:
- source_word: ἔπειτα μετὰ τοῦτο
  choice: Затем, после этого
  rationale: Сохраняет оба последовательных временных выражения греческого текста и при этом звучит понятно по-русски.
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время сохраняет характерное для повествования Иоанна историческое настоящее и придаваемую им живость рассказу.
- source_word: τοῖς μαθηταῖς
  choice: ученикам
  rationale: Передаёт дательный падеж без добавления отсутствующего в греческом тексте притяжательного местоимения «Своим».
- source_word: Ἄγωμεν
  choice: Пойдём
  rationale: Естественно передаёт побудительный конъюнктив первого лица множественного числа — предложение говорящего совместно отправиться в путь.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: в Иудею
  rationale: Обычное русское обозначение направленного движения передаёт значение εἰς; различие английских вариантов «to/into» в русском здесь не требует отдельной формулировки.
- source_word: πάλιν
  choice: снова
  rationale: Прямо указывает на возвращение в ранее посещённую область и естественно сочетается с «пойдём».
theological_decisions:
- issue: Историческое настоящее в повествовании Иоанна
  choice: 'Сохранить настоящее время: «говорит»'
  alternative: 'Сгладить по нормам повествования прошедшего времени: «сказал»'
  rationale: Настоящее время непосредственно отражает стиль греческого текста, не меняя богословского смысла.
translation_notes:
  register: Современный литературный русский язык; речь ясная и сдержанно-достоинственная. Местоимение «Он» написано с прописной буквы по принятой в русском библейском стиле традиции. Английская сноска о различии «into/to» не перенесена, поскольку русское «в Иудею» естественно охватывает направительное значение и не создаёт сопоставимой лексической альтернативы.
