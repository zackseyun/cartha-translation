source:
  edition: SBLGNT
  text: ⸀ἐξῆλθεν ὁ τεθνηκὼς δεδεμένος τοὺς πόδας καὶ τὰς χεῖρας κειρίαις, καὶ ἡ ὄψις αὐτοῦ σουδαρίῳ περιεδέδετο. λέγει ⸂αὐτοῖς ὁ Ἰησοῦς⸃· Λύσατε αὐτὸν καὶ ἄφετε ⸀αὐτὸν ὑπάγειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/044.yaml
  text: The man who had died came out, his feet and hands bound with burial cloths, and his face wrapped with a cloth. Jesus says to them, “Unbind him and let him go.”
translation:
  language: ru
  text: 'Умерший вышел; его руки и ноги были обвязаны погребальными пеленами, а лицо обёрнуто платком. Иисус говорит им: «Развяжите его и дайте ему идти».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τεθνηκώς
  choice: умерший
  rationale: Субстантивированное причастие перфекта обозначает человека, который умер; краткое русское «умерший» сохраняет смысл и естественно в повествовании.
- source_word: κειρίαις
  choice: погребальными пеленами
  rationale: Речь об узких полосах ткани, использовавшихся при погребении; «погребальные пелены» ясно передаёт контекст и не создаёт впечатления обычных верёвок.
- source_word: ἡ ὄψις
  choice: лицо
  rationale: В данном контексте слово обозначает лицо, закрытое отдельным платком.
- source_word: σουδαρίῳ
  choice: платком
  rationale: Это отдельный кусок ткани, которым было обёрнуто лицо; нейтральное «платок» соответствует предмету без излишней конкретизации.
- source_word: λέγει
  choice: говорит
  rationale: Сохранено историческое настоящее греческого повествования, придающее сцене непосредственность.
- source_word: ἄφετε αὐτὸν ὑπάγειν
  choice: дайте ему идти
  rationale: Конструкция буквально означает позволить ему идти; перевод сохраняет отличие от возможного более свободного «отпустите его».
theological_decisions:
- issue: Состояние Лазаря при выходе из гробницы
  choice: «Умерший вышел»
  alternative: «Тот, кто был мёртв, вышел»
  rationale: 'Перевод не добавляет прямого пояснения о воскресении в первой части стиха, но сохраняет разительный образ исходного текста: названный умершим выходит наружу.'
- issue: Настоящее время λέγει
  choice: «Иисус говорит им»
  alternative: «Иисус сказал им»
  rationale: Настоящее время сохранено как повествовательный приём оригинала; богословской конкретизации оно не вносит.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; сохранено историческое настоящее «говорит» и буквальная направленность заключительной команды.
