reference: John 11:46
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν ἀπῆλθον πρὸς τοὺς Φαρισαίους καὶ εἶπαν αὐτοῖς ἃ ⸀ἐποίησεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/046.yaml
  text: But some of them went to the Pharisees and told them what Jesus had done[a].
translation:
  language: ru
  text: Но некоторые из них пошли к фарисеям и рассказали им, что сделал Иисус[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сообщили им, что сделал Иисус». Греческий текст прямо не указывает, с каким намерением они пошли к фарисеям.'
    reason: Лексическая альтернатива и сохранение неопределённости мотива.
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Но некоторые из них
  rationale: Передаёт неопределённую часть упомянутой группы и контраст с теми, кто уверовал в предыдущем стихе.
- source_word: ἀπῆλθον πρὸς τοὺς Φαρισαίους
  choice: пошли к фарисеям
  rationale: Естественно передаёт уход от места действия и направленное движение к фарисеям; отдельное «ушли» по-русски здесь избыточно.
- source_word: εἶπαν αὐτοῖς
  choice: рассказали им
  rationale: В данном повествовательном контексте речь идёт о сообщении совершённого; формулировка не приписывает говорившим враждебного мотива.
- source_word: ἃ ἐποίησεν Ἰησοῦς
  choice: что сделал Иисус
  rationale: Естественная русская передача относительной конструкции и аориста как завершённого действия, предшествующего рассказу.
theological_decisions:
- issue: Мотив обращения к фарисеям
  choice: Нейтральное «рассказали им»
  alternative: «донесли им» / «донесли на Иисуса»
  rationale: Греческий текст сообщает о поступке этих людей, но прямо не определяет их намерение; перевод не должен добавлять мотив доноса или предательства.
translation_notes:
  register: Современный литературный русский язык; краткая и естественная повествовательная фраза. Название группы «фарисеи» дано со строчной буквы по нормам русского письма.
