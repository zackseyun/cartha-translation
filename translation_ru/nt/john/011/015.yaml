  text: καὶ χαίρω δι’ ὑμᾶς, ἵνα πιστεύσητε, ὅτι οὐκ ἤμην ἐκεῖ· ἀλλὰ ἄγωμεν πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/015.yaml
  text: And I am glad for your sake that I was not there[a], so that you may believe. But let us go to him.
translation:
  language: ru
  text: Я рад за вас, что меня там не было, чтобы вы поверили[a]. Но пойдём к нему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начали верить». Греческая форма может подчёркивать начало веры, хотя допускает и более общее «поверили».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: я рад
  rationale: Настоящее время и положительное чувство переданы естественным современным выражением; «ликую» или «радуюсь» здесь звучало бы более приподнято и могло бы неверно усилить эмоциональную окраску.
- source_word: δι’ ὑμᾶς
  choice: ради вас
  rationale: διά с винительным указывает здесь на пользу для учеников, а не просто на них как причину радости Иисуса.
- source_word: ἵνα πιστεύσητε
  choice: чтобы вы поверили
  rationale: ἵνα с аористом сослагательного наклонения выражает цель. «Поверили» сохраняет широкий смысл πιστεύω и не утверждает без необходимости, что прежде у учеников вовсе не было веры.
- source_word: ὅτι οὐκ ἤμην ἐκεῖ
  choice: что меня там не было
  rationale: ὅτι естественно вводит содержание радости, а имперфект εἰμί с ἐκεῖ прямо передаётся русским оборотом «меня там не было».
- source_word: ἀλλὰ
  choice: но
  rationale: Союз обозначает контрастный переход от объяснения к действию.
- source_word: ἄγωμεν
  choice: пойдём
  rationale: Форма первого лица множественного числа сослагательного наклонения употреблена как побуждение к совместному действию; «пойдём» естественно передаёт этот смысл.
- source_word: πρὸς αὐτόν
  choice: к нему
  rationale: πρός с винительным обозначает движение к человеку; «к нему» точно и идиоматично.
theological_decisions:
- issue: Смысловая сила πιστεύσητε в контексте Евангелия от Иоанна
  choice: поверили
  alternative: пришли к вере
  rationale: Аорист может иметь начинательное значение, однако сам текст не требует вывода, будто ученики до этого совершенно не верили. Более широкое «поверили» сохраняет заложенную в тексте богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и естественным звучанием. Порядок слов «ради вас я рад» сохраняет смысл пользы для учеников, не превращая их в непосредственную причину радости. Местоимения, относящиеся к Иисусу, не получают внефразового почтительного написания с прописной буквы, что соответствует нейтральной современной орфографии и не вносит конфессиональной редакционной особенности.
