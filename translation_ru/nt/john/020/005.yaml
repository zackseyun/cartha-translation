  text: καὶ παρακύψας βλέπει κείμενα τὰ ὀθόνια, οὐ μέντοι εἰσῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/005.yaml
  text: And stooping to look in[a], he sees the linen cloths lying there, yet he did not enter.
translation:
  language: ru
  text: И, наклонившись, он видит лежащие там льняные пелены, но внутрь не вошёл.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρακύψας
  choice: наклонившись
  rationale: Аористное причастие передаёт движение ученика, который нагнулся у входа в гробницу, чтобы заглянуть внутрь; в русском контексте зрительная направленность ясно выражена последующим «видит».
- source_word: βλέπει
  choice: он видит
  rationale: Настоящее время сохранено как историческое настоящее, придающее повествованию характерную для Иоанна живость.
- source_word: κείμενα
  choice: лежащие там
  rationale: Причастие κεῖμαι обозначает, что пелены находились в лежачем положении; «там» естественно соотносит их с внутренним пространством гробницы, не меняя смысла.
- source_word: τὰ ὀθόνια
  choice: льняные пелены
  rationale: ὀθόνια обозначает полотна или полосы льняной ткани, здесь связанные с погребением. «Пелены» кратко и естественно передаёт этот предмет в русском библейском контексте без избыточного пояснения.
- source_word: οὐ μέντοι
  choice: но
  rationale: Сочетание вводит мягкое противопоставление между тем, что ученик увидел, и тем, что он всё же не вошёл; простое «но» естественно передаёт его по-русски.
- source_word: εἰσῆλθεν
  choice: внутрь не вошёл
  rationale: Аорист обозначает завершённое действие в прошлом; «внутрь не вошёл» ясно и естественно передаёт невхождение в гробницу.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Историческое настоящее «видит» сохранено, тогда как аорист εἰσῆλθεν передан прошедшим временем. Местоимение «он» добавлено для ясности при смене глагольной формы.
