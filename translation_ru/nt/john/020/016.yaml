base_translation:
  language: en
  yaml_path: translation/nt/john/020/016.yaml
  text: Jesus says to her[a], “Mary.” Turning, she says to him in Hebrew, “Rabboni!” (which means, “Teacher”).
translation:
  language: ru
  text: 'Иисус говорит ей: «Мария!» Обернувшись, она говорит Ему по-еврейски[a]: «Раввуни!» (что значит «Учитель»).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по-арамейски». У Иоанна выражение «по-еврейски» может шире обозначать семитскую речь Иудеи.'
    reason: Сохраняет возможное более широкое значение Ἑβραϊστί и не разрешает спорную языковую идентификацию в основном тексте.
lexical_decisions:
- source_word: λέγει
  choice: говорит
  rationale: Историческое настоящее сохранено, чтобы передать живость повествования Иоанна.
- source_word: Μαριάμ
  choice: Мария
  rationale: Употреблена общепринятая русская форма имени, естественная для библейского повествования.
- source_word: στραφεῖσα
  choice: поворачивается
  rationale: Форма передаёт последующее действие естественным современным русским языком и согласуется с историческим настоящим контекста.
- source_word: Ἑβραϊστί
  choice: по-еврейски
  rationale: Основной текст следует прямому значению греческого наречия; возможность более широкого обозначения арамейской речи отмечена в сноске.
- source_word: Ραββουνι
  choice: Раввуни
  rationale: Сохранена транслитерация обращения, поскольку сам евангелист сразу поясняет его значение.
- source_word: ὃ λέγεται Διδάσκαλε
  choice: что значит «Учитель»
  rationale: Естественно передаёт пояснительную глоссу; «Учитель» соответствует обычному значению звательной формы Διδάσκαλε.
theological_decisions:
- issue: Значение Ἑβραϊστί в повествовании Иоанна
  choice: по-еврейски
  alternative: по-арамейски
  rationale: Основной текст сохраняет буквальное обозначение языка в греческом источнике, не устраняя вероятную историко-языковую неоднозначность; альтернативное понимание вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством и повествовательной живостью. Историческое настоящее сохранено. Местоимение «Ему» написано с прописной буквы согласно устойчивой русской библейской традиции; эмоциональность узнавания передана восклицательными знаками без добавления отсутствующих смысловых деталей.
