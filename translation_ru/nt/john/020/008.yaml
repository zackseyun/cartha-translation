id: JHN.20.8
reference: John 20:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τότε οὖν εἰσῆλθεν καὶ ὁ ἄλλος μαθητὴς ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον, καὶ εἶδεν καὶ ἐπίστευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/008.yaml
  text: Then the other disciple[a], who had arrived at the tomb first, also went in[b], and he saw and believed.
translation:
  language: ru
  text: Тогда вошёл и другой ученик, который первым пришёл к гробнице, и увидел, и поверил.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст говорит просто «поверил», не уточняя, во что именно. Это может означать, что ученик поверил в воскресение Иисуса, поверил увиденному свидетельству или прежнему сообщению.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: Тогда
  rationale: Передаёт последовательность событий и лёгкий оттенок вывода без тяжеловесного «итак» или «поэтому».
- source_word: εἰσῆλθεν
  choice: вошёл
  rationale: Прямой и естественный русский эквивалент глагола со значением входа внутрь.
- source_word: ὁ ἄλλος μαθητής
  choice: другой ученик
  rationale: Сохраняет обычное для Евангелия от Иоанна обозначение и связь с ближайшим контекстом.
- source_word: ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον
  choice: который первым пришёл к гробнице
  rationale: Естественно передаёт определительный оборот и предшествование прихода основному действию; «первым» показывает, что он опередил Петра.
- source_word: μνημεῖον
  choice: гробница
  rationale: В данном повествовании обозначает высеченное место погребения; «гробница» точнее современного «могила».
- source_word: καὶ εἶδεν
  choice: и увидел
  rationale: Сохраняет простой повествовательный глагол и повтор союза καί.
- source_word: ἐπίστευσεν
  choice: поверил
  rationale: Передаёт глагол без добавления объекта веры, сохраняя лаконичность и неоднозначность греческого текста.
theological_decisions:
- issue: Во что поверил ученик
  choice: 'Оставить глагол без прямого дополнения: «поверил»'
  alternative: «поверил, что Иисус воскрес»; «поверил словам Марии»; «уверовал»
  rationale: В греческом тексте содержание веры прямо не названо. Его уточнение сняло бы сохраняемое повествованием толковательное напряжение, особенно с учётом следующего стиха.
translation_notes:
  register: Современный литературный русский язык; ясный, сдержанный и достойный повествовательный стиль. Повтор «и увидел, и поверил» сохранён ради ритма и смысловой последовательности оригинала.
