source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ οἱ ἄλλοι μαθηταί· Ἑωράκαμεν τὸν κύριον. ὁ δὲ εἶπεν αὐτοῖς· Ἐὰν μὴ ἴδω ἐν ταῖς χερσὶν αὐτοῦ τὸν τύπον τῶν ἥλων καὶ βάλω τὸν δάκτυλόν μου εἰς τὸν τύπον τῶν ἥλων καὶ βάλω ⸂μου τὴν χεῖρα⸃ εἰς τὴν πλευρὰν αὐτοῦ, οὐ μὴ πιστεύσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/025.yaml
  text: So the other disciples were telling him[a], “We have seen the Lord.” But he said to them, “Unless I see in his hands the mark of the nails, and put my finger into the mark of the nails, and put my hand into his side, I will certainly not believe.”
translation:
  language: ru
  text: 'Итак, другие ученики говорили ему: «Мы видели Господа!» Но он сказал им: «Если я не увижу на его руках след от гвоздей, не вложу свой палец в след от гвоздей и не вложу свою руку в его бок, ни за что не поверю».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никогда не поверю». В греческом тексте употреблено усиленное отрицание.'
    reason: Сноска отмечает возможную более абсолютную передачу эмфатического οὐ μή, не заменяя основной условно обусловленный смысл.
lexical_decisions:
- source_word: ἔλεγον
  choice: говорили
  rationale: Имперфект передаёт продолжавшееся или повторявшееся действие; русское несовершенное «говорили» сохраняет этот оттенок без утяжеления фразы.
- source_word: οὖν
  choice: поэтому
  rationale: Союз связывает слова учеников с предшествующим сообщением об отсутствии Фомы и передаёт повествовательно-следственную связь.
- source_word: Ἑωράκαμεν
  choice: мы видели
  rationale: В современном русском естественная форма прошедшего времени передаёт совершившееся событие и сохраняющуюся значимость свидетельства; буквальное воспроизведение греческого перфекта невозможно без неестественной конструкции.
- source_word: κύριον
  choice: Господа
  rationale: В контексте воскресения это титул Иисуса; традиционное и современно понятное русское соответствие сохраняет христологическое значение.
- source_word: ἐν ταῖς χερσὶν αὐτοῦ
  choice: на его руках
  rationale: Для видимых следов на частях тела русский язык естественно употребляет «на», хотя греческий предлог буквально означает «в».
- source_word: τύπον τῶν ἥλων
  choice: след от гвоздей
  rationale: τύπος обозначает оставшийся отпечаток или след; «след от гвоздей» ясно передаёт его происхождение и не добавляет прямо не названного слова «рана».
- source_word: βάλω ... εἰς
  choice: вложу ... в
  rationale: Сохраняется направленность внутрь и нарочито осязаемый характер требования Фомы; более слабое «прикоснусь» не передавало бы εἰς.
- source_word: οὐ μὴ πιστεύσω
  choice: ни за что не поверю
  rationale: Разговорно-литературная формула ясно передаёт усиленное греческое отрицание и решительный отказ верить при невыполнении условий.
theological_decisions:
- issue: Сила отказа Фомы в οὐ μὴ πιστεύσω
  choice: «ни за что не поверю» как усиленный условный отказ
  alternative: «никогда не поверю»
  rationale: Сочетание οὐ μή выражает решительное отрицание, однако «никогда» может придать словам безусловный и вневременной смысл, тогда как отказ Фомы грамматически зависит от перечисленных условий.
- issue: Конкретность проверки раны в боку
  choice: «вложу руку в его бок» без добавления слова «рана»
  alternative: «вложу руку в рану на его боку»
  rationale: Греческий текст прямо называет бок и движение внутрь, но не употребляет существительного «рана». Выбранная формулировка сохраняет резкую телесную образность и не делает подразумеваемое явным дополнением.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Синтаксический параллелизм трёх условий сохранён. «Говорили» передаёт длительность или повторяемость исходного имперфекта; «в его бок» намеренно сохраняет непривычную и сильную образность оригинала.
