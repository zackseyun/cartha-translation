- from: 'Поэтому другие ученики говорили ему: «Мы видели Господа!» Но он сказал им: «Если я не увижу на его руках след от гвоздей, не вложу палец в след от гвоздей и не вложу руку в его бок, ни за что не поверю».[a]'
