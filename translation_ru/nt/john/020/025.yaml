  terminology: «Господь» адекватно передаёт κύριος как титул воскресшего Иисуса. «След от гвоздей» — ясная передача τύπος τῶν ἥλων без добавления слова «рана». «Ни за что не поверю» передаёт эмфатическое οὐ μή, а сноска корректно отмечает альтернативу.
