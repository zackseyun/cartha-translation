  source_fidelity: 'Основная передача верна: условные конструкции, неопределённость лиц, пассивные результативные формы и параллелизм сохранены. Однако «за кем-либо удержите их» не отражает синтаксис греческого τινων и по-русски ненормативно/неестественно: грехи удерживают не «за кем-либо», а формулируют как «удержите грехи кого-либо».'
  naturalness: «Если вы простите кому-либо грехи, они ему прощены» понятно, но сочетание «если за кем-либо удержите их» тяжеловесно и не является естественным современным литературным русским. Повторение существительного «грехи» во второй части устраняет неясную референцию «их» и сохраняет торжественно-сдержанный регистр.
