base_translation:
  language: en
  yaml_path: translation/nt/john/020/023.yaml
  text: If you forgive the sins of any[a], they have been forgiven them; if you retain them[b], they have been retained.
translation:
  language: ru
  text: Если вы простите грехи кого-либо, они прощены ему; если удержите грехи кого-либо, они удержаны.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческие формы «прощены» и «удержаны» стоят в перфекте и могут подчёркивать совершившееся действие с сохраняющимся результатом. «Удержать грехи» — буквальная передача выражения, противопоставленного прощению.
    reason: Пояснение аспектуальной силы перфекта и непривычного, но точного выражения «удержать грехи».
lexical_decisions:
- source_word: ἄν τινων
  choice: если ... кому-либо / если за кем-либо
  rationale: Сочетание ἄν с сослагательным наклонением выражает неопределённое условие. Русская конструкция с «если» и неопределённым местоимением сохраняет как условность, так и неопределённость лиц.
- source_word: ἀφῆτε
  choice: простите
  rationale: В сочетании с «грехами» ἀφίημι обычно означает «прощать»; это естественный и точный современный русский эквивалент.
- source_word: τὰς ἁμαρτίας
  choice: грехи
  rationale: В русском языке определённый артикль отдельно не передаётся; контекст ясно указывает на грехи названных лиц.
- source_word: ἀφέωνται
  choice: они ему прощены
  rationale: Краткое страдательное причастие сохраняет пассивную форму и выражает состояние как результат совершившегося действия, не называя действующего лица.
- source_word: αὐτοῖς
  choice: ему
  rationale: Дательный местоименный компонент относится к человеку, чьи грехи прощены. Единственное число согласовано с естественным русским «кому-либо» и имеет обобщённое значение.
- source_word: κρατῆτε
  choice: удержите
  rationale: Глагол κρατέω здесь противопоставлен прощению и означает удержание грехов. «Удержите» сохраняет образ исходного текста, тогда как «оставите непрощёнными» уже истолковывает его.
- source_word: κεκράτηνται
  choice: они удержаны
  rationale: Краткое страдательное причастие передаёт параллель с «прощены», результативность перфекта и отсутствие прямо названного деятеля.
theological_decisions:
- issue: Означают ли слова, что ученики самостоятельно совершают прощение, или их действие соответствует уже совершённому Божьему действию?
  choice: 'Сохранены перфектные страдательные формы: «прощены» и «удержаны», без указания действующего лица.'
  alternative: «Бог простил их / Бог удержал их грехи» либо просто «будут прощены / останутся непрощёнными».
  rationale: В греческом тексте Бог прямо не назван действующим лицом, а отношение между действием учеников и выраженным результатом не разъясняется. Пассивная результативная формулировка сохраняет эту богословскую напряжённость и не вводит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Синтаксический параллелизм исходного текста сохранён; несколько непривычное «удержите грехи» оставлено ради точности, а более естественная динамическая передача вынесена в сноску.
