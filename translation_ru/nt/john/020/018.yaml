  text: ἔρχεται ⸀Μαριὰμ ἡ Μαγδαληνὴ ⸀ἀγγέλλουσα τοῖς μαθηταῖς ὅτι ⸀Ἑώρακα τὸν κύριον καὶ ταῦτα εἶπεν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/018.yaml
  text: Mary Magdalene came announcing to the disciples[a], “I have seen the Lord,” and that he had said these things to her.
translation:
  language: ru
  text: 'Мария Магдалина пришла к ученикам и возвестила им: «Я видела Господа, и Он сказал мне это».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мария Магдалина пришла к ученикам и сказала: „Я видела Господа“, — и Он сказал ей это». Заключительные слова можно понимать либо как часть сообщения Марии, либо как замечание повествователя.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: пришла
  rationale: Настоящее время употреблено как историческое; русское прошедшее время естественно передаёт завершённое событие повествования.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Мария Магдалина
  rationale: Использована устоявшаяся русская форма имени и прозвания.
- source_word: ἀγγέλλουσα
  choice: возвестила
  rationale: Причастие обозначает сообщение вести одновременно с приходом; личная форма делает русскую фразу естественной и сохраняет оттенок провозглашения.
- source_word: τοῖς μαθηταῖς
  choice: ученикам
  rationale: Стандартное и точное соответствие; притяжательное местоимение в греческом тексте отсутствует.
- source_word: Ἑώρακα
  choice: Я видела
  rationale: Русское прошедшее время в данном контексте естественно выражает совершившуюся встречу, сохраняющую значение для настоящего свидетельства Марии.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Сохраняет титул Иисуса и его христологический вес в контексте воскресения.
- source_word: καὶ ταῦτα εἶπεν αὐτῇ
  choice: и Он сказал мне всё это
  rationale: Передано как продолжение сообщения Марии, с естественной для прямой речи сменой лица; ταῦτα отражено словами «всё это».
theological_decisions:
- issue: Передача κύριος в контексте воскресения
  choice: Господь
  alternative: господин / учитель
  rationale: Здесь это признанный титул Иисуса; «Господь» сохраняет его богословскую значимость, не добавляя конфессионального толкования.
- issue: Связь καὶ ταῦτα εἶπεν αὐτῇ с сообщением Марии
  choice: 'Включено в прямую речь Марии: «и Он сказал мне всё это»'
  alternative: 'Слова повествователя: «и Он сказал ей всё это»'
  rationale: Союз καὶ позволяет понимать заключительную часть как продолжение содержания, которое Мария сообщила ученикам, однако синтаксис допускает и отнесение её к голосу повествователя; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Возвестила» сохраняет оттенок торжественного сообщения, оставаясь понятным; синтаксическая неоднозначность последней части не замалчивается, а вынесена в сноску.
