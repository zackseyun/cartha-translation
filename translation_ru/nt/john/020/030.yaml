lexical_decisions:
- source_word: Πολλὰ μὲν οὖν καὶ ἄλλα
  choice: и много других
  rationale: Сочетание продолжает и обобщает повествование, а μέν подготавливает противопоставление в следующем стихе. Русский порядок слов и союз «и» естественно передают связь с контекстом без механического воспроизведения каждой частицы.
- source_word: σημεῖα
  choice: знамений
  rationale: В Евангелии от Иоанна слово обозначает чудесные деяния, указывающие на личность и миссию Иисуса; «знамения» сохраняет этот смысловой акцент.
- source_word: ἐποίησεν
  choice: совершил
  rationale: В сочетании со «знамениями» глагол «совершил» звучит естественно и достойно; буквальное «сделал» здесь менее идиоматично.
- source_word: ἐνώπιον τῶν μαθητῶν
  choice: перед учениками
  rationale: Передаёт присутствие учеников как очевидцев и не добавляет отсутствующего в греческом тексте притяжательного местоимения «Своими».
- source_word: ἃ οὐκ ἔστιν γεγραμμένα
  choice: которые не записаны
  rationale: Передаёт результирующее состояние перифрастического перфекта и пассивную форму; «записаны» естественнее по-русски применительно к содержанию книги.
- source_word: ἐν τῷ βιβλίῳ τούτῳ
  choice: в этой книге
  rationale: «Книга» — ясное и естественное обозначение данного письменного произведения; «свиток» был бы излишне конкретным.
theological_decisions:
- issue: Богословски значимое употребление σημεῖα у Иоанна
  choice: знамения
  alternative: чудеса
  rationale: «Знамения» сохраняет мысль о чудесных деяниях, которые не только проявляют силу, но и указывают на то, кто такой Иисус, не устраняя при этом их чудесного характера.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Синтаксис естественный, без церковнославянизмов; сохранён ключевой для Иоанна термин «знамения» и явная связь с продолжением мысли в следующем стихе.
