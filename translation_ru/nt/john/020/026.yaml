  text: Καὶ μεθ’ ἡμέρας ὀκτὼ πάλιν ἦσαν ἔσω οἱ μαθηταὶ αὐτοῦ καὶ Θωμᾶς μετ’ αὐτῶν. ἔρχεται ὁ Ἰησοῦς τῶν θυρῶν κεκλεισμένων, καὶ ἔστη εἰς τὸ μέσον καὶ εἶπεν· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/026.yaml
  text: And after eight days, his disciples were inside again, and Thomas was with them. Jesus comes, though the doors had been shut, and stood in the midst and said, “Peace to you.”
translation:
  language: ru
  text: 'Спустя восемь дней Его ученики снова были внутри, и Фома был с ними. При запертых дверях приходит Иисус, становится посреди них и говорит: «Мир вам!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ὀκτώ
  choice: через восемь дней
  rationale: Естественно передаёт греческий временной оборот, сохраняя древний способ счёта без добавочного толкования.
- source_word: ἔσω
  choice: в доме
  rationale: По контексту речь идёт о нахождении внутри помещения; такой перевод по-русски естественнее отдельного наречия «внутри».
- source_word: ἔρχεται
  choice: приходит
  rationale: Сохранено настоящее историческое время оригинала и его повествовательная живость.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: хотя двери были заперты
  rationale: Передаёт уступительный смысл генитива абсолютного и результативное состояние закрытых, запертых дверей.
- source_word: ἔστη εἰς τὸ μέσον
  choice: становится посреди них
  rationale: Естественно выражает появление Иисуса в середине собравшихся; настоящее время согласовано с историческим настоящим «приходит».
- source_word: Εἰρήνη ὑμῖν
  choice: Мир вам!
  rationale: Сохраняет краткую традиционную формулу приветствия и её смысл пожелания полноты мира.
theological_decisions:
- issue: Способ появления Иисуса при запертых дверях
  choice: Не уточнять, каким образом Иисус вошёл или появился
  alternative: «Иисус прошёл сквозь запертые двери»
  rationale: Греческий текст сообщает лишь, что двери были заперты и Иисус пришёл; он не описывает механизма появления.
- issue: Временная форма повествования
  choice: Сохранить историческое настоящее в глаголах «приходит» и «становится», затем «говорит»
  alternative: 'Полностью перевести прошедшим временем: «пришёл, встал и сказал»'
  rationale: Так передаётся заметный переход оригинала к настоящему времени без догматического переосмысления.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и торжественно-сдержанное. Местоимение «Его» написано с прописной буквы по принятой русской библейской традиции. Форма «Фома» сохраняет общепринятое русское имя апостола.
