  text: καὶ λέγουσιν αὐτῇ ἐκεῖνοι· Γύναι, τί κλαίεις; λέγει αὐτοῖς ὅτι Ἦραν τὸν κύριόν μου, καὶ οὐκ οἶδα ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/013.yaml
  text: And they said to her[a], “Woman, why are you weeping?” She said to them, “They have taken away my Lord[b], and I do not know where they have put him.”
translation:
  language: ru
  text: 'Они сказали ей: «Женщина, почему ты плачешь?» Она сказала им: «Унесли моего Господа, и я не знаю, куда его положили».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γύναι
  choice: Женщина
  rationale: Уважительное обращение в данном контексте; сохраняет прямоту и последовательность словоупотребления у Иоанна, не добавляя отсутствующей в греческом тексте эмоциональной окраски.
- source_word: τί κλαίεις
  choice: почему ты плачешь?
  rationale: Хотя τί буквально означает «что», в этой конструкции оно естественно передаёт вопрос о причине. Настоящее время κλαίεις указывает на продолжающееся действие.
- source_word: Ἦραν
  choice: унесли
  rationale: Аорист обозначает завершённое действие. «Унесли» естественно передаёт удаление тела из гробницы и не требует уточнять неизвестных действующих лиц.
- source_word: τὸν κύριόν μου
  choice: моего Господа
  rationale: «Господь» сохраняет как уважительный, так и возможный христологический смысл κύριος, не сводя его только к социальному титулу.
- source_word: οὐκ οἶδα
  choice: я не знаю
  rationale: Перфектная по форме лексема οἶδα имеет значение настоящего состояния и естественно переводится настоящим временем.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: куда его положили
  rationale: В русском языке при глаголе перемещения/помещения естествен вопрос «куда». «Положили» точно передаёт ἔθηκαν и уместно по отношению к телу.
- source_word: ἐκεῖνοι
  choice: они
  rationale: Местоимение естественно отсылает к ранее названным собеседникам; более буквальное «те» звучало бы здесь искусственно.
theological_decisions:
- issue: Передача κύριος в словах Марии
  choice: моего Господа
  alternative: моего господина / моего учителя
  rationale: '«Господь» сохраняет присущую слову κύριος смысловую открытость: оно может выражать почтительное отношение к Иисусу и одновременно иметь христологическое звучание.'
- issue: Тон обращения Γύναι
  choice: Женщина
  alternative: Уважаемая / милая женщина
  rationale: Прямое обращение в греческом тексте не является грубым, но и не содержит дополнительной ласковой или официальной окраски; перевод не добавляет её.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис простой и естественный; «пла́чешь», «унесли» и «положили» понятны широкому кругу читателей. Местоимение «его» пишется со строчной буквы в соответствии с обычной современной издательской практикой и формой исходного текста.
