review_pass:
  verdict: revise
  source_fidelity: 'Начальные глаголы в греческом тексте — настоящее λέγουσιν («говорят/сказали») и λέγει («говорит/сказала»). Вариант «спросили ... ответила» верно передаёт ход диалога, но добавляет оттенок формальной реплики-ответа и ослабляет лексическую симметрию оригинала. Остальная передача точна: τί κλαίεις естественно передано как «почему ты плачешь?», аористы Ἦραν и ἔθηκαν адекватно отражены формами «унесли» и «положили».'
  naturalness: Исправленный текст остаётся естественным для современного литературного русского с умеренным библейским регистром. Обращение «Женщина» в современной речи может восприниматься как резкое, однако здесь оно сохраняет прямоту уважительного греческого обращения Γύναι без не подтверждённой оригиналом фамильярности или сентиментальности.
  terminology: '«Моего Господа» точно сохраняет κύριόν μου и не сужает титул до «господина» либо «учителя». Строчная буква в местоимении «его» нормативна и не влияет на смысл. Дополнительные сноски не требуются: смысловые альтернативы не создают здесь необходимой для читателя неопределённости.'
