base_translation:
  language: en
  yaml_path: translation/nt/john/020/014.yaml
  text: After saying these things[a], she turned around and saw Jesus standing there, and she did not know that it was Jesus.
translation:
  language: ru
  text: Сказав это[a], она обернулась и увидела стоящего Иисуса и не знала, что это Иисус.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сказав всё это». Греческое слово имеет форму множественного числа и буквально означает «эти вещи», то есть сказанное перед этим.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: это
  rationale: Хотя греческое местоимение имеет форму множественного числа, в современном русском «сказав это» естественно охватывает сказанное ранее и не меняет смысла.
- source_word: εἰποῦσα
  choice: сказав
  rationale: Деепричастие естественно передаёт предшествующее действие аористного причастия и сохраняет связь с Марией.
- source_word: ἐστράφη εἰς τὰ ὀπίσω
  choice: она обернулась
  rationale: Естественное русское выражение для поворота назад, без буквального и тяжеловесного «повернулась к тому, что позади».
- source_word: θεωρεῖ
  choice: увидела
  rationale: Историческое настоящее передано прошедшим временем согласно нормам русского повествования; глагол обозначает зрительное восприятие.
- source_word: ἑστῶτα
  choice: стоящего
  rationale: Сохраняет выраженную причастием позу Иисуса; отдельное «там» в русском тексте не требуется и отсутствует в греческом.
- source_word: οὐκ ᾔδει
  choice: не знала
  rationale: Формально сохраняет основное значение οἶδα и не подменяет его более истолковывающим «не узнала».
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: что это Иисус
  rationale: Естественная русская конструкция установления личности; настоящее время в придаточном сохраняет форму греческого текста и звучит нормативно.
theological_decisions:
- issue: Опознание воскресшего Иисуса Марией
  choice: не знала, что это Иисус
  alternative: не узнала Иисуса
  rationale: Текст утверждает отсутствие знания о личности стоящего перед Марией, но не объясняет причину. Основной вариант сохраняет эту сдержанность и смысловую напряжённость.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Синтаксис плавный, без архаизмов; лексическая точность «не знала» сохранена, а возможное значение узнавания не внесено в основной текст.
