  yaml_path: translation/nt/john/020/009.yaml
  text: For they did not yet understand the Scripture[a], that he had to rise from the dead.
translation:
  language: ru
  text: 'Ведь они ещё не понимали Писания: Ему надлежало воскреснуть из мёртвых.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ему надлежало быть воскрешённым из мёртвых». Однако в греческом тексте здесь употреблён активный глагол: «воскреснуть».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδέπω
  choice: ещё не
  rationale: 'Естественно передаёт временной смысл: до этого момента понимания у них не было.'
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предыдущим повествованием и естественно звучит в современном русском языке.
- source_word: ᾔδεισαν
  choice: понимали
  rationale: В сочетании с Писанием и последующим изъяснением речь идёт не просто об осведомлённости, а о понимании смысла.
- source_word: τὴν γραφὴν
  choice: Писания
  rationale: Сохраняет единственное число греческого текста и обозначение авторитетного священного текста; родительный падеж обусловлен русским управлением глагола «понимать» при отрицании.
- source_word: ὅτι
  choice: ':'
  rationale: Двоеточие естественно вводит в русском языке содержание Писания, которое они ещё не понимали.
- source_word: δεῖ
  choice: надлежало
  rationale: Передаёт необходимость, в том числе подразумеваемую божественную необходимость, и согласуется с прошедшим планом повествования.
- source_word: αὐτὸν
  choice: Ему
  rationale: Дательный субъект при безличном «надлежало» является естественной русской конструкцией; прописная буква указывает на Иисуса в соответствии с русской библейской традицией.
- source_word: ἐκ νεκρῶν
  choice: из мёртвых
  rationale: Точное и устоявшееся русское соответствие новозаветной формуле воскресения.
- source_word: ἀναστῆναι
  choice: воскреснуть
  rationale: Передаёт активный инфинитив греческого текста и наиболее естественно выражает воскресение в современном русском языке.
theological_decisions:
- issue: Форма выражения воскресения и действующее лицо
  choice: Ему надлежало воскреснуть из мёртвых
  alternative: Ему надлежало быть воскрешённым из мёртвых
  rationale: В греческом тексте употреблён активный инфинитив ἀναστῆναι. Основной текст сохраняет активную форму и не заменяет её пассивной, хотя пассивное выражение встречается в других местах Нового Завета.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. «Ведь» естественно передаёт пояснение, а «надлежало» сохраняет смысл необходимости без чрезмерно тяжеловесной конструкции.
