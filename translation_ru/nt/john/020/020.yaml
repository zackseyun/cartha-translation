  text: καὶ τοῦτο εἰπὼν ⸀ἔδειξεν τὰς χεῖρας καὶ τὴν πλευρὰν ⸀αὐτοῖς. ἐχάρησαν οὖν οἱ μαθηταὶ ἰδόντες τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/020.yaml
  text: And after saying this, he showed them his hands and his side. Then the disciples rejoiced when they saw the Lord.
translation:
  language: ru
  text: Сказав это, он показал им свои руки и бок. Тогда ученики, увидев Господа, обрадовались.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: Сказав это
  rationale: Аористное причастие обозначает действие, предшествующее основному; русский деепричастный оборот естественно и точно передаёт эту последовательность.
- source_word: ἔδειξεν
  choice: показал
  rationale: Прямой и естественный эквивалент со значением предъявить для обозрения.
- source_word: τὰς χεῖρας καὶ τὴν πλευράν
  choice: Свои руки и бок
  rationale: В греческом употреблены артикли без притяжательного местоимения, но по-русски принадлежность частей тела субъекту естественно выражается словом «Свои». «Бок» точно передаёт πλευρά и сохраняет связь с раной, не добавляя её явного упоминания.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж естественно передан косвенным дополнением при глаголе «показал».
- source_word: ἐχάρησαν
  choice: обрадовались
  rationale: Глагол передаёт возникшую радость учеников; «обрадовались» естественно в современном русском и сохраняет событийный оттенок аориста.
- source_word: οὖν
  choice: передано последовательностью предложений без отдельного слова
  rationale: Здесь частица обозначает следствие или развитие повествования. В русском эта связь ясно выражена порядком действий и деепричастной конструкцией; буквальное «итак» или «поэтому» звучало бы тяжелее.
- source_word: οἱ μαθηταί
  choice: ученики
  rationale: Устоявшийся и точный евангельский эквивалент.
- source_word: ἰδόντες
  choice: Увидев
  rationale: Аористное причастие естественно передано деепричастием, обозначающим основание и непосредственный повод для радости.
- source_word: τὸν κύριον
  choice: Господа
  rationale: «Господь» сохраняет как узнавание Иисуса учениками, так и христологический вес титула в повествовании Иоанна.
theological_decisions:
- issue: Передача κύριος
  choice: Господа
  alternative: Учителя / Владыку
  rationale: В контексте явления воскресшего Иисуса слово имеет больший вес, чем обычное обращение к учителю или хозяину; традиционное и современно понятное «Господь» сохраняет эту смысловую полноту.
translation_notes:
  register: Современный литературный русский язык, краткий и достоинственный повествовательный стиль. Заглавные буквы в местоимениях «Он», «Свои» применены как принятая в русском библейском регистре форма почтительного указания на Иисуса.
