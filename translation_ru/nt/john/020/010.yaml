  source_fidelity: '«Итак, ученики снова возвратились к себе» точно передаёт все основные элементы греческого текста: повествовательную связку οὖν, повторно-возвратный оттенок πάλιν, уход/возвращение ἀπῆλθον и намеренно неуточнённое πρὸς ἑαυτούς. «К себе» удачно сохраняет идиоматическую неоднозначность оригинала и не сужает её до отдельных домов.'
  naturalness: Фраза естественна для современного литературного русского, кратка и соответствует спокойному повествовательному регистру контекста. Сочетание «снова возвратились» нормативно и ясно выражает возвращение после посещения гробницы.
