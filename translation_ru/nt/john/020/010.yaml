  text: ἀπῆλθον οὖν πάλιν πρὸς ⸀αὑτοὺς οἱ μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/010.yaml
  text: So the disciples went away again to their own homes[a].
translation:
  language: ru
  text: Итак, ученики снова возвратились к себе[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «туда, где они остановились»; буквально: «к самим себе».'
    reason: Греческое выражение допускает буквальное прочтение, но в данном контексте, вероятно, указывает на место проживания или временного пребывания учеников.
lexical_decisions:
- source_word: ἀπῆλθον
  choice: возвратились
  rationale: В сочетании с πάλιν глагол обозначает уход от гробницы и возвращение туда, где ученики находились; «возвратились» естественно передаёт это движение по-русски.
- source_word: οὖν
  choice: итак
  rationale: Союз связывает действие с предшествующим повествованием и обозначает его итог или продолжение; «итак» сохраняет эту связующую функцию.
- source_word: πάλιν
  choice: снова
  rationale: Наречие указывает на возвращение или повторное движение; «снова» прямо передаёт это значение.
- source_word: πρὸς αὑτούς
  choice: к себе
  rationale: Буквально рефлексивное выражение здесь, вероятно, означает возвращение туда, где ученики жили или остановились. «К себе» сохраняет краткость и некоторую неопределённость греческого текста, не уточняя без достаточных оснований «по домам».
- source_word: οἱ μαθηταί
  choice: ученики
  rationale: Обычное и устойчивое русское обозначение последователей Иисуса в повествовании.
theological_decisions: []
