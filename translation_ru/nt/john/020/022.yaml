  text: καὶ τοῦτο εἰπὼν ἐνεφύσησεν καὶ λέγει αὐτοῖς· Λάβετε πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/022.yaml
  text: And after saying this[a], he breathed on them and said to them, “Receive the Holy Spirit.”
translation:
  language: ru
  text: 'Сказав это, он дунул на них[a] и сказал им: «Примите Святого Духа».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вдохнул в них». Этот глагол также напоминает об образах творения и нового творения в Бытие 2:7 и Иезекииле 37.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: Сказав это
  rationale: Деепричастный оборот естественно передаёт действие, предшествующее основному, и сохраняет лаконичность греческого текста.
- source_word: ἐνεφύσησεν
  choice: дунул на них
  rationale: Такой перевод естественен по-русски и не уточняет сверх текста направление дыхания; возможный смысл «вдохнул в них» вынесен в сноску вместе с ветхозаветными ассоциациями.
- source_word: λέγει αὐτοῖς
  choice: сказал им
  rationale: Историческое настоящее сглажено русским прошедшим временем в соответствии с нормами современного повествования.
- source_word: Λάβετε
  choice: Примите
  rationale: В данном контексте глагол обозначает принятие дара; «примите» звучит естественно и не предполагает самовольного овладения.
- source_word: πνεῦμα ἅγιον
  choice: Святого Духа
  rationale: В контексте Евангелия от Иоанна выражение обозначает Божьего Святого Духа; винительный падеж обусловлен русским управлением глагола «примите».
theological_decisions:
- issue: Личное или безличное понимание πνεῦμα ἅγιον
  choice: Святого Духа
  alternative: святой дух
  rationale: Контекст Иоанна указывает на Божьего Святого Духа, а не на неопределённую духовную силу; при этом перевод не добавляет отсутствующего в греческом тексте пояснения.
- issue: Направление действия ἐνεφύσησεν и образ нового творения
  choice: дунул на них
  alternative: вдохнул в них
  rationale: Основной текст сохраняет наиболее естественное и нейтральное чтение, а допустимая альтернатива и связь с образами творения отмечены в сноске, без навязывания единственного толкования.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная повествовательная формулировка. Местоимение «он» дано со строчной буквы по общим нормам современной русской орфографии; прямая речь оформлена русскими кавычками.
