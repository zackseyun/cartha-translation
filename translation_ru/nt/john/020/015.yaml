  terminology: '«Господин» верно передаёт κύριε как вежливое обращение к предполагаемому садовнику; христологическое «Господи» здесь не следует навязывать. Сноску следует уточнить: κύριε — не просто форма русского слова «Господь», а греческая форма κύριος, которое в иных контекстах обычно переводится «Господь».'
