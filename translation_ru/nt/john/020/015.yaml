source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Γύναι, τί κλαίεις; τίνα ζητεῖς; ἐκείνη δοκοῦσα ὅτι ὁ κηπουρός ἐστιν λέγει αὐτῷ· Κύριε, εἰ σὺ ἐβάστασας αὐτόν, εἰπέ μοι ποῦ ἔθηκας αὐτόν, κἀγὼ αὐτὸν ἀρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/015.yaml
  text: Jesus says to her[a], “Woman, why are you weeping? Whom are you seeking?” She, supposing that he was the gardener, says to him, “Sir, if you carried him away, tell me where you put him, and I will take him away.”
translation:
  language: ru
  text: 'Иисус говорит ей: «Женщина, почему ты плачешь? Кого ты ищешь?» Она, полагая, что он садовник, говорит ему: «Господин[a], если ты унёс его, скажи мне, где ты его положил, и я заберу его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: По-гречески κύριε — форма слова κύριος, обычно переводимого «Господь»; здесь, вероятно, это уважительное обращение «господин», поскольку Мария думает, что говорит с садовником.
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  choice: Женщина
  rationale: Прямое, но уважительное обращение; сохраняет форму греческого текста и повторяющееся у Иоанна обращение Иисуса без добавления отсутствующего в оригинале оттенка ласковости.
- source_word: τί κλαίεις
  choice: почему ты плачешь
  rationale: Естественно передаёт идиоматическое τί в значении причины и обычное значение κλαίω, сохраняя серьёзный тон сцены.
- source_word: τίνα ζητεῖς
  choice: Кого ты ищешь
  rationale: Точно передаёт личное вопросительное местоимение τίνα и значение ζητέω; по-русски звучит естественно и ясно.
- source_word: δοκοῦσα
  choice: думая
  rationale: Причастный оборот естественно передаёт ошибочное предположение Марии, не усиливая степень её уверенности.
- source_word: ὁ κηπουρός
  choice: садовник
  rationale: Прямой современный эквивалент κηπουρός без излишней конкретизации обязанностей.
- source_word: Κύριε
  choice: Господин
  rationale: В контексте Мария считает собеседника садовником, поэтому слово служит уважительным обращением, а не осознанным христологическим титулом; при этом сохраняется формальная связь с κύριος через сноску.
- source_word: ἐβάστασας αὐτόν
  choice: ты унёс его
  rationale: Передаёт и физическое перемещение тела, и направленность действия; звучит естественнее по-русски, чем буквальное «понёс».
- source_word: ποῦ ἔθηκας αὐτόν
  choice: куда ты его положил
  rationale: Направительное «куда» естественно сочетается с глаголом «положил» и точно отражает ποῦ в контексте результата перемещения.
- source_word: κἀγὼ αὐτὸν ἀρῶ
  choice: и я заберу его
  rationale: Естественно выражает намерение Марии самой взять и унести тело; будущее значение греческой формы сохранено.
theological_decisions:
- issue: Передача κύριε в обращении Марии до того, как она узнала воскресшего Иисуса
  choice: Господин
  alternative: Господи
  rationale: 'Контекст прямо сообщает, что Мария принимает Иисуса за садовника, поэтому наиболее вероятно уважительное светское обращение. Сноска сохраняет прозрачность: в греческом употреблена та же форма κύριε, которая часто переводится «Господи».'
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно торжественным повествованием. Настоящее историческое время («говорит») сохранено вслед за греческим текстом. Обращение «Женщина» не является пренебрежительным в исходном контексте; добавочные смягчения не внесены.
