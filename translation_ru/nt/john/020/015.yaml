  source_fidelity: 'Смысл в целом передан точно: вопросы Иисуса, ошибочное предположение Марии, уважительное κύριε и её намерение забрать тело сохранены. Однако «это садовник» менее точно передаёт мужское αὐτόν/подразумеваемое «он» в ὅτι ὁ κηπουρός ἐστιν; безопаснее и естественнее «он садовник». «Где ты его положил» прямо передаёт ποῦ («где»), не добавляя направительного оттенка «куда».'
