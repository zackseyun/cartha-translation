base_translation:
  language: en
  yaml_path: translation/nt/john/020/003.yaml
  text: So Peter and the other disciple went out and were going to the tomb[a].
translation:
  language: ru
  text: Тогда Пётр и другой ученик вышли и пошли к гробнице[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шли к гробнице». Греческая форма глагола может подчёркивать продолжавшееся движение.'
    reason: лексическая альтернатива
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: вышли
  rationale: Аорист ἐξέρχομαι обозначает выход или уход из места. Хотя в греческом глагол стоит в единственном числе и формально согласован с ближайшим подлежащим «Пётр», составное подлежащее показывает, что вышли оба; по-русски естественно множественное число.
- source_word: οὖν
  choice: тогда
  rationale: В данном повествовательном контексте οὖν связывает действие со сказанным в предыдущем стихе и указывает на последовавшую реакцию. «Тогда» передаёт эту связь естественнее, чем более рассудочное «поэтому».
- source_word: ὁ Πέτρος
  choice: Пётр
  rationale: Использована общепринятая русская форма имени.
- source_word: ὁ ἄλλος μαθητής
  choice: другой ученик
  rationale: μαθητής в повествовании Евангелия означает ученика Иисуса, а ἄλλος отличает его от Петра без уточнения личности.
- source_word: ἤρχοντο
  choice: пошли
  rationale: Имперфект ἔρχομαι описывает движение к гробнице. «Пошли» звучит естественно в современном русском повествовании; оттенок продолжающегося действия отмечен в сноске.
- source_word: εἰς τὸ μνημεῖον
  choice: к гробнице
  rationale: μνημεῖον здесь — высеченная погребальная гробница Иисуса. Предлог «к» передаёт движение к ней, не подразумевая, что ученики уже вошли внутрь.
