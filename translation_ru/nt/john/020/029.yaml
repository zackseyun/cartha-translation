  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ὅτι ἑώρακάς με πεπίστευκας; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/029.yaml
  text: Jesus said to him, “Because you have seen me, you have believed? Blessed are those who have not seen and yet have believed.”
translation:
  language: ru
  text: 'Иисус говорит ему: «Ты поверил, потому что увидел Меня?[a] Блаженны те, кто не видел и поверил».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты поверил, потому что увидел Меня». Греческий текст допускает как вопросительное, так и утвердительное прочтение.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Иисус говорит ему
  rationale: 'Историческое настоящее сохранено: по-русски оно естественно звучит в живом повествовании Иоанна; αὐτῷ передано как «ему» и относится к Фоме.'
- source_word: Ὅτι
  choice: потому что
  rationale: Ὅτι здесь естественно понимать как вводящее причину веры Фомы; русская перестановка «Ты поверил, потому что…» ясна и сохраняет смысловую связь.
- source_word: ἑώρακάς με
  choice: увидел Меня
  rationale: Русский совершенный вид естественно передаёт завершённое видение с актуальным результатом; местоимение с прописной буквы соответствует принятому благоговейному русскому оформлению речи о Христе.
- source_word: πεπίστευκας
  choice: ты поверил
  rationale: Совершенный вид «поверил» естественно выражает наступившую вследствие увиденного веру, не перегружая русский текст искусственной передачей греческого перфекта.
- source_word: μακάριοι
  choice: Блаженны
  rationale: «Блаженны» — точное, достоинственное и традиционно понятное соответствие формуле макаризма; оно глубже субъективного «счастливы».
- source_word: οἱ μὴ ἰδόντες
  choice: те, кто не видел
  rationale: Субстантивированное причастие передано естественной русской конструкцией; «не видел» не уточняет без необходимости, идёт ли речь только о физическом видении воскресшего Иисуса.
- source_word: καὶ πιστεύσαντες
  choice: и поверил
  rationale: Союз καί передан прямо как «и». Не добавлено «всё же», которого нет в греческом тексте, хотя контраст между отсутствием видения и верой сохраняется самой конструкцией.
theological_decisions:
- issue: Вопросительное или утвердительное прочтение первой реплики Иисуса
  choice: 'Основной текст оформлен как вопрос: «Ты поверил, потому что увидел Меня?»'
  alternative: «Ты поверил, потому что увидел Меня».
  rationale: Греческая словесная форма допускает оба прочтения, поскольку пунктуация не является частью древнейшей рукописной традиции. Вопросительное прочтение хорошо передаёт риторическую направленность реплики, но утвердительное остаётся реальной возможностью и поэтому отмечено в сноске.
- issue: Характер противопоставления видения и веры
  choice: Сохранена простая связь «не видел и поверил»
  alternative: «не видел, но всё же поверил»
  rationale: Такой перевод не превращает высказывание в осуждение всякого свидетельства или видения и не усиливает противопоставление сверх выраженного греческим καί.
translation_notes:
  register: Современный литературный русский язык с достоинственным библейским звучанием. Синтаксис сделан естественным для русской речи, историческое настоящее сохранено. Подлинная пунктуационная неоднозначность вынесена в сноску.
