  text: Θωμᾶς δὲ εἷς ἐκ τῶν δώδεκα, ὁ λεγόμενος Δίδυμος, οὐκ ἦν μετ’ αὐτῶν ὅτε ⸀ἦλθεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/024.yaml
  text: Thomas[a], one of the Twelve, the one called Didymus, was not with them when Jesus came.
translation:
  language: ru
  text: Фома, один из Двенадцати, которого называли Близнецом[a], не был с ними, когда пришёл Иисус.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое прозвание — «Дидим» (Δίδυμος), то есть «Близнец».
    reason: Поясняет традиционную форму греческого прозвания и его значение.
lexical_decisions:
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Здесь δέ служит мягким переходом к Фоме; в современном русском такой переход естественно передаётся сменой темы без искусственного «теперь» или усилительного «но».
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: один из Двенадцати
  rationale: Устойчивое обозначение признанной группы ближайших учеников; прописная буква показывает, что это название группы, а не просто числительное.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: которого называли Близнецом
  rationale: Δίδυμος означает «близнец» и здесь выступает как осмысленное прозвание; перевод передаёт доступное греческому читателю значение.
- source_word: οὐκ ἦν μετ’ αὐτῶν
  choice: не был с ними
  rationale: Прямо и естественно передаёт отсутствие Фомы среди собравшихся в тот момент.
- source_word: ὅτε ἦλθεν Ἰησοῦς
  choice: когда пришёл Иисус
  rationale: Прямое соответствие конструкции; «пришёл» менее истолковательно, чем «явился» или «прибыл».
theological_decisions:
- issue: Передача Δίδυμος
  choice: Близнец
  alternative: Дидим
  rationale: Термин не выражает спорного учения, а является греческим прозванием со значением, понятным первоначальному читателю. Перевод сохраняет эту смысловую прозрачность, а примечание сообщает традиционную греческую форму.
translation_notes:
  register: Современный литературный русский язык; повествовательная фраза краткая и достоинственная. Сохранено официальное обозначение «Двенадцать», а греческое прозвание переведено по смыслу с пояснением в сноске.
