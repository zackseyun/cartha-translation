  text: Thomas answered and said to him[a], “My Lord and my God!”
translation:
  language: ru
  text: 'Фома ответил ему: «Господь мой и Бог мой!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Менее вероятно: Фома произнёс слова «Господь мой и Бог мой!» как возглас, не обращённый непосредственно к Иисусу. Однако по-гречески сказано, что он произнёс их «ему», что указывает на прямое обращение к Иисусу.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ответил
  rationale: Обычное повествовательное значение глагола ἀποκρίνομαι; по-русски естественно передаёт ответ Фомы.
- source_word: Θωμᾶς
  choice: Фома
  rationale: Устоявшаяся русская форма личного имени.
- source_word: εἶπεν αὐτῷ
  choice: ему
  rationale: Дательный αὐτῷ прямо указывает на адресата. В русском сочетание «ответил ему» естественно передаёт оба греческих глагола без тяжеловесного «ответил и сказал ему».
- source_word: Ὁ κύριός μου
  choice: Господь мой
  rationale: κύριος передано традиционным и богословски весомым словом «Господь»; порядок слов сохраняет торжественный характер непосредственного обращения.
- source_word: καὶ
  choice: и
  rationale: Союз сохраняет координацию двух именований.
- source_word: ὁ θεός μου
  choice: Бог мой
  rationale: θεός прямо означает «Бог», а μου сохраняет личное исповедание; порядок слов параллелен выражению «Господь мой».
theological_decisions:
- issue: Обращены ли слова Фомы непосредственно к Иисусу или являются отдельным возгласом к Богу
  choice: 'Прямое обращение к Иисусу: «Господь мой и Бог мой!»'
  alternative: Возглас, не называющий Иисуса Богом напрямую
  rationale: Греческое αὐτῷ означает, что Фома сказал это «ему», то есть Иисусу; формы с артиклем в данном контексте выполняют функцию обращения. Перевод сохраняет эту христологическую силу, не добавляя дальнейшего толкования.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием. Греческая конструкция «ответил и сказал» передана естественным русским «ответил ему»; прямой адресат сохранён. Восклицательный знак отражает силу исповедания.
