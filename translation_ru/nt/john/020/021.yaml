  text: εἶπεν οὖν αὐτοῖς ⸂ὁ Ἰησοῦς⸃ πάλιν· Εἰρήνη ὑμῖν· καθὼς ἀπέσταλκέν με ὁ πατήρ, κἀγὼ πέμπω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/021.yaml
  text: So Jesus said to them again[a], “Peace to you. As the Father has sent me, even so I am sending you.”
translation:
  language: ru
  text: 'И снова Иисус сказал им: «Мир вам! Как Отец послал Меня, так и Я посылаю вас».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: И
  rationale: Связывает слова Иисуса с предыдущей сценой как продолжение повествования; русское «итак» здесь могло бы придать излишне выраженный оттенок вывода.
- source_word: πάλιν
  choice: снова
  rationale: Прямо указывает на повторение приветствия из предыдущего стиха и естественно звучит в современном русском повествовании.
- source_word: Εἰρήνη ὑμῖν
  choice: Мир вам!
  rationale: Кратко и буквально передаёт безглагольную формулу приветствия, сохраняя её семитский характер и укоренённое русское библейское звучание.
- source_word: καθὼς
  choice: Как
  rationale: Вводит сопоставление посланничества Иисуса Отцом и посланничества учеников Иисусом; корреляция естественно завершается словами «так и».
- source_word: ἀπέσταλκέν
  choice: послал
  rationale: Русский совершенный вид передаёт завершённость действия и его сохраняющуюся значимость без неестественной попытки формально воспроизвести греческий перфект.
- source_word: ὁ πατήρ
  choice: Отец
  rationale: Сохраняет определённое именование Бога в Евангелии от Иоанна и не добавляет отсутствующего в греческом притяжательного местоимения «Мой».
- source_word: κἀγὼ
  choice: так и Я
  rationale: Передаёт сочетание καί и ἐγώ и подчёркивает соответствие двух посланий, не утверждая их полного тождества по способу или объёму полномочий.
- source_word: πέμπω
  choice: посылаю
  rationale: Настоящее время естественно выражает совершаемое в данный момент поручение; русская форма не требует добавочного прогрессивного оборота.
theological_decisions:
- issue: Соотношение между посланием Иисуса Отцом и посланием учеников Иисусом
  choice: «Как Отец послал Меня, так и Я посылаю вас»
  alternative: «Как Отец послал Меня, Я тоже посылаю вас»
  rationale: Корреляция «как… так и» сохраняет вес аналогии миссии, но не разворачивает её в утверждение о полном равенстве власти, служения или способа послания.
translation_notes:
  register: Современный литературный русский язык с естественным, достоинственным библейским звучанием. Традиционная формула «Мир вам!» одновременно точна по отношению к греческому тексту и понятна обычному читателю; вариантная сноска не требуется.
