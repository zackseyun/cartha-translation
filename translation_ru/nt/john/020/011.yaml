lexical_decisions:
- source_word: δὲ
  choice: же
  rationale: Передаёт мягкий повествовательный переход и лёгкое противопоставление предыдущему эпизоду, не усиливая его.
- source_word: εἱστήκει
  choice: стояла
  rationale: Форма выражает продолжавшееся состояние; русское несовершенное прошедшее естественно передаёт этот аспект.
- source_word: πρὸς τῷ μνημείῳ ἔξω
  choice: у гробницы
  rationale: Греческое сочетание помещает Марию снаружи, рядом с гробницей. В русском «у гробницы» естественно обозначает это положение; дальнейшее «заглянуть в гробницу» ясно передаёт противопоставление внешнего и внутреннего пространства.
- source_word: μνημεῖον
  choice: гробница
  rationale: Обозначает высеченное или устроенное место погребения, а не просто могилу; «гробница» точно и понятно в данном контексте.
- source_word: κλαίουσα / ἔκλαιεν
  choice: плакала / плача
  rationale: Обе формы описывают продолжающийся плач. В русском повтор смягчён деепричастием без утраты временной одновременности.
- source_word: ὡς οὖν
  choice: Плача
  rationale: Связь последовательности и одновременности естественно выражена деепричастным оборотом; отдельное причинное значение не навязывается.
- source_word: παρέκυψεν
  choice: наклонилась, чтобы заглянуть
  rationale: Передаёт и физическое движение — наклон, и цель — посмотреть внутрь.
- source_word: εἰς τὸ μνημεῖον
  choice: в гробницу
  rationale: Предлог εἰς указывает направление взгляда внутрь гробницы; с глаголом «заглянуть» это естественная русская конструкция.
