  text: 'И она видит двух ангелов в белом[a], сидящих там, где лежало[b] тело Иисуса: одного у изголовья, другого у ног.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в белых одеждах». Буквально по-гречески: «в белом».'
    reason: lexical_alternative
  - marker: b
    text: 'По смыслу также возможно: «прежде лежало». Греческая форма обозначает продолжавшееся в прошлом состояние; в русском тексте предшествование понятно из контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: видит она
  rationale: Историческое настоящее сохранено для живости повествования; местоимение указывает на Марию из контекста, а порядок слов естественно продолжает греческое καί.
- source_word: ἀγγέλους
  choice: ангелов
  rationale: В контексте пустой гробницы речь явно идёт о небесных существах, а не просто о человеческих посланниках.
- source_word: ἐν λευκοῖς
  choice: в белом
  rationale: Кратко и естественно передаёт греческое выражение, не уточняя сверх текста вид белой одежды.
- source_word: καθεζομένους
  choice: сидящих
  rationale: Причастие прямо обозначает положение ангелов; добавлять наречие «там» к самому причастию не требуется.
- source_word: ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν
  choice: одного у изголовья, а другого у ног
  rationale: Передаёт расположение у двух концов места, где находилось тело. «У изголовья» звучит по-русски естественнее, чем буквальное «у головы», когда самой головы там уже нет.
- source_word: ὅπου
  choice: там, где
  rationale: Русская соотносительная конструкция естественно связывает расположение ангелов с местом, где прежде находилось тело.
- source_word: ἔκειτο
  choice: лежало
  rationale: Русское прошедшее несовершенного вида точно передаёт продолжавшееся в прошлом состояние; предшествование ясно из контекста без добавления слова «прежде».
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: тело Иисуса
  rationale: Стандартная, ясная и уважительная передача греческого словосочетания.
theological_decisions:
- issue: Значение ἀγγέλους в рассказе о пустой гробнице
  choice: ангелов
  alternative: посланников
  rationale: Белое одеяние и контекст явления у пустой гробницы указывают на небесных ангелов; это контекстуально-лексическое, а не конфессиональное уточнение.
- issue: Временной оттенок ἔκειτο
  choice: лежало
  alternative: прежде лежало / находилось там до этого
  rationale: Форма имперфекта обозначает состояние в прошлом. В русском языке «лежало» сохраняет видовое значение, а предшествование моменту, когда Мария видит ангелов, устанавливается контекстом без излишнего истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Историческое настоящее сохранено. Формулировка остаётся ясной для широкого читателя и не вводит отсутствующих в греческом тексте богословских уточнений.
