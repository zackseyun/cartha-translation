  text: καὶ τὸ σουδάριον, ὃ ἦν ἐπὶ τῆς κεφαλῆς αὐτοῦ, οὐ μετὰ τῶν ὀθονίων κείμενον ἀλλὰ χωρὶς ἐντετυλιγμένον εἰς ἕνα τόπον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/007.yaml
  text: and the face cloth[a], which had been on his head, was not lying with the linen cloths but folded up separately in one place.
translation:
  language: ru
  text: а платок, который был на его голове, лежал не вместе с льняными полотнами, а отдельно, свёрнутый, в одном месте.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σουδάριον
  choice: платок
  rationale: В погребальном контексте это кусок ткани, находившийся на голове или лице умершего. «Платок» естественно звучит по-русски, а последующее пояснение не позволяет принять его за обычный носовой платок.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: на его голове
  rationale: Прямая передача греческого оборота без уточнения, покрывал ли платок лицо или был обёрнут вокруг головы.
- source_word: ὀθονίων
  choice: льняными полотнами
  rationale: Передаёт и материал, и множественное число, не добавляя более узкого толкования о точной форме погребальных пелен.
- source_word: κείμενον
  choice: лежал
  rationale: Естественно передаёт положение предмета, обозначенное причастием от κεῖμαι.
- source_word: χωρὶς
  choice: отдельно
  rationale: Сохраняет пространственное противопоставление платка остальным льняным полотнам.
- source_word: ἐντετυλιγμένον
  choice: свёрнутый
  rationale: Форма обозначает сохранявшееся состояние свёрнутой или обёрнутой ткани. «Свёрнутый» естественнее и лексически осторожнее, чем более определённое «аккуратно сложенный».
- source_word: εἰς ἕνα τόπον
  choice: в одном месте
  rationale: Близко передаёт указание на отдельное конкретное место, не вводя значения «на своём месте», которого текст прямо не выражает.
- source_word: καὶ
  choice: а
  rationale: В русском продолжение перечисления здесь естественно соединяется с одновременным противопоставлением расположения платка другим полотнам.
theological_decisions:
- issue: Следует ли видеть в расположении погребальных тканей символический или апологетический смысл
  choice: Оставить стих описанием наблюдаемого расположения платка и полотен.
  alternative: Передать расположение как намеренно аккуратное или как доказательство определённого хода воскресения.
  rationale: Греческий текст сообщает состояние и место тканей, но прямо не объясняет их символического значения и не предлагает реконструкции события.
translation_notes:
  register: Современный литературный русский язык; повествование звучит просто и достойно. Местоимение «его» написано со строчной буквы в соответствии с обычной современной издательской нормой. Союз «а» передаёт связь с предыдущим стихом и естественно подводит к контрасту «не вместе… но отдельно».
