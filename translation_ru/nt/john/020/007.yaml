  source_fidelity: 'Смысл передан в целом точно: σουδάριον отличено от льняных полотен; сохранены противопоставление «не вместе ... а отдельно», состояние ἐντετυλιγμένον и указание на отдельное место. Однако в исходной русской пунктуации сочетание «свёрнутый в одном месте» может ошибочно читаться так, будто платок был свёрнут именно в этом месте, тогда как εἰς ἕνα τόπον относится к его расположению.'
