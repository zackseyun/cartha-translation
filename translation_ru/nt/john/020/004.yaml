    rationale: 'προέδραμεν τάχιον τοῦ Πέτρου выражает одно событие: другой ученик опередил Петра в беге. Русское «обогнал Петра» передаёт это без добавления отдельного, повторяющего действия.'
  - severity: low
    issue: Сноска повторяет и неудачно калькирует уже переданный смысл.
    rationale: Фраза «забежал вперёд быстрее Петра» не является полезной лексической альтернативой и звучит по-русски менее естественно, чем основной вариант. После точной передачи «обогнал Петра» сноска не нужна.
  revised_text: Оба бежали вместе, и другой ученик обогнал Петра и первым добежал до гробницы.
