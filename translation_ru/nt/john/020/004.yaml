  text: ἔτρεχον δὲ οἱ δύο ὁμοῦ· καὶ ὁ ἄλλος μαθητὴς προέδραμεν τάχιον τοῦ Πέτρου καὶ ἦλθεν πρῶτος εἰς τὸ μνημεῖον,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/004.yaml
  text: The two were running together[a], and the other disciple ran ahead faster than Peter and came first to the tomb.
translation:
  language: ru
  text: Оба бежали вместе, и другой ученик обогнал Петра и первым добежал до гробницы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔτρεχον
  choice: бежали
  rationale: Имперфект изображает продолжающееся действие в прошлом; в русском контексте этот вид передаётся естественной формой «бежали».
- source_word: δὲ
  choice: ;
  rationale: 'Незначительное присоединение и смысловой переход переданы точкой с запятой: это не усиливает противопоставление, но отмечает переход от совместного бега к тому, что один ученик вырвался вперёд.'
- source_word: οἱ δύο ὁμοῦ
  choice: оба они бежали вместе
  rationale: «Оба» сохраняет явное указание на двоих, а «вместе» передаёт ὁμοῦ.
- source_word: ὁ ἄλλος μαθητής
  choice: другой ученик
  rationale: Традиционное и контекстуально точное обозначение ученика, отличного от Петра.
- source_word: προέδραμεν τάχιον τοῦ Πέτρου
  choice: бежал быстрее Петра, опередил его
  rationale: Переданы и сравнительное значение τάχιον, и направленность προέδραμεν — ученик оказался впереди Петра. Формулировка естественна по-русски, а буквальный образ указан в сноске.
- source_word: ἦλθεν πρῶτος
  choice: первым добежал
  rationale: В данном контексте «добежал» естественно выражает прибытие после бега и сохраняет смысл первенства.
- source_word: εἰς τὸ μνημεῖον
  choice: до гробницы
  rationale: Контекст следующего стиха показывает, что ученик достиг места погребения, но ещё не вошёл внутрь; поэтому «до гробницы», а не «в гробницу».
