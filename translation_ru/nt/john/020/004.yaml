- from: Оба они бежали вместе; другой ученик бежал быстрее Петра, опередил его[a] и первым добежал до гробницы.
  to: Оба бежали вместе, и другой ученик обогнал Петра и первым добежал до гробницы.
  rationale: Устранены тавтология и неестественная калька. «Обогнал Петра» сохраняет сравнительно-результативный смысл προέδραμεν τάχιον τοῦ Πέτρου; «первым добежал до гробницы» передаёт ἦλθεν πρῶτος εἰς τὸ μνημεῖον, не предполагая входа в гробницу.
