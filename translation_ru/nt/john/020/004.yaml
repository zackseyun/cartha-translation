review_pass:
  verdict: revise
  source_fidelity: 'В исходнике сказано, что оба бежали вместе, затем другой ученик опередил Петра и достиг гробницы первым. Черновик в целом передаёт этот смысл, однако сочетание «бежал быстрее Петра, опередил его» избыточно: оно разворачивает одно греческое сказуемое προέδραμεν в два последовательных действия.'
  naturalness: «Оба они» допустимо, но «Оба» естественнее. Формула «бежал быстрее Петра, опередил его» тяжеловесна и тавтологична для современного литературного русского. «Обогнал Петра» ясно и естественно передаёт результат бега.
  terminology: «Ученик» и «гробница» уместны. «До гробницы» верно отражает достижение места, не утверждая вход внутрь.
  issues:
