source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Μή μου ἅπτου, οὔπω γὰρ ἀναβέβηκα πρὸς τὸν ⸀πατέρα· πορεύου δὲ πρὸς τοὺς ἀδελφούς μου καὶ εἰπὲ αὐτοῖς· Ἀναβαίνω πρὸς τὸν πατέρα μου καὶ πατέρα ὑμῶν καὶ θεόν μου καὶ θεὸν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/017.yaml
  text: Jesus said to her[a], “Do not cling to me, for I have not yet ascended to the Father. But go to my brothers and tell them, ‘I am ascending to my Father and your Father[b], and my God and your God.’”
translation:
  language: ru
  text: 'Иисус сказал ей: «Не держись за Меня[a], потому что Я ещё не взошёл к Отцу. Но пойди к Моим братьям[b] и скажи им: „Я восхожу к Моему Отцу и вашему Отцу, к Моему Богу и вашему Богу“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не прикасайся ко Мне»; или: «Не удерживай Меня». Вероятно, греческое выражение означает, что Мария держалась за Иисуса или продолжала Его удерживать, а не просто прикоснулась к Нему.'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте употреблено существительное мужского рода во множественном числе. Здесь «братья» означает учеников Иисуса и, возможно, более широкий круг Его последователей.
    reason: cultural_note
lexical_decisions:
- source_word: Μή μου ἅπτου
  choice: Не держись за Меня
  rationale: Настоящее повелительное наклонение с μή в данном контексте естественно передаёт прекращение или запрет продолжающегося действия. Русское «не держись» допускает смысл продолжительного удерживания и не сводит фразу к простому прикосновению.
- source_word: οὔπω γὰρ ἀναβέβηκα
  choice: потому что Я ещё не взошёл
  rationale: «Взошёл» сохраняет перфектное значение совершившегося к данному моменту действия и характерный для Иоанна смысл восхождения к Отцу.
- source_word: πρὸς τὸν πατέρα
  choice: к Отцу
  rationale: В первой фразе греческий текст содержит определённый артикль, но не притяжательное местоимение; перевод не добавляет «Моему», которое появляется далее.
- source_word: πορεύου
  choice: пойди
  rationale: Естественная русская форма единичного повеления двигаться к названным людям.
- source_word: ἀδελφούς
  choice: братьям
  rationale: Сохраняется грамматически мужская форма исходного текста; контекстуальный объём обозначения поясняется в сноске.
- source_word: εἰπὲ αὐτοῖς
  choice: скажи им
  rationale: Прямой и идиоматичный русский эквивалент повелительной конструкции.
- source_word: Ἀναβαίνω
  choice: Я восхожу
  rationale: Настоящее время сохраняет живую направленность действия и допускает значение близкого предстоящего восхождения без замены на явно будущее время.
- source_word: πατέρα μου καὶ πατέρα ὑμῶν
  choice: к Моему Отцу и вашему Отцу
  rationale: Сохранены параллелизм и различение отношений Иисуса и учеников к Отцу.
- source_word: θεόν μου καὶ θεὸν ὑμῶν
  choice: к Моему Богу и вашему Богу
  rationale: Фраза передана прямо, с сохранением параллельной структуры и без богословского смягчения.
theological_decisions:
- issue: Значение Μή μου ἅπτου
  choice: Запрет продолжать держаться за Иисуса
  alternative: Не прикасайся ко Мне
  rationale: Вид и форма греческого глагола в контексте благоприятствуют значению продолжающегося удерживания. Сноска сохраняет допустимые лексические варианты, не превращая их в категорическое толкование.
- issue: Передача πατέρα в первой фразе
  choice: к Отцу
  alternative: к Моему Отцу
  rationale: В этом месте исходный текст не содержит μου; явное «Моему Отцу» появляется в следующей прямой речи.
- issue: Христологическое напряжение выражения «Моему Богу и вашему Богу»
  choice: Передать буквально и без поясняющей переработки
  alternative: Смягчающий богословский парафраз
  rationale: Перевод сохраняет полную силу формулировки Иоанна и не подчиняет её заранее выбранному догматическому объяснению.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Местоимения, относящиеся к Иисусу, Отцу и Богу, написаны с прописной буквы согласно распространённой русской религиозно-издательской норме. Повтор «к Моему Отцу и вашему Отцу, к Моему Богу и вашему Богу» намеренно сохраняет параллелизм греческого текста.
