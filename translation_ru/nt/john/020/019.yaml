id: JHN.20.19
reference: John 20:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οὔσης οὖν ὀψίας τῇ ἡμέρᾳ ἐκείνῃ τῇ ⸀μιᾷ σαββάτων, καὶ τῶν θυρῶν κεκλεισμένων ὅπου ἦσαν οἱ ⸀μαθηταὶ διὰ τὸν φόβον τῶν Ἰουδαίων, ἦλθεν ὁ Ἰησοῦς καὶ ἔστη εἰς τὸ μέσον, καὶ λέγει αὐτοῖς· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/019.yaml
  text: So when it was evening on that day[a], the first day of the week, and the doors had been locked where the disciples were because of fear of the Jews, Jesus came and stood in the midst of them and said to them[b], “Peace to you.”
translation:
  language: ru
  text: 'Итак, вечером того дня, в первый день недели, двери в месте, где были ученики, были заперты из страха перед иудеями[a]. Иисус пришёл, встал посреди них и сказал им: «Мир вам!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в зависимости от контекста: «перед иудейскими властями» или «перед жителями Иудеи». Греческое слово может обозначать иудеев в более широком смысле, жителей Иудеи или, в данном контексте, в особенности враждебно настроенных властей.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Мир с вами». Буквально: «Мир вам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὔσης ... ὀψίας
  choice: вечером
  rationale: Родительный абсолют задаёт время действия; наречное выражение естественно передаёт его по-русски.
- source_word: οὖν
  choice: итак
  rationale: Сохраняет связь с предшествующим повествованием, не придавая фразе чрезмерно сильного логического значения.
- source_word: τῇ ἡμέρᾳ ἐκείνῃ
  choice: того дня
  rationale: Прямо и естественно передаёт указание на уже упомянутый день.
- source_word: τῇ μιᾷ σαββάτων
  choice: первого дня недели
  rationale: Устойчиво передаёт семитизированное греческое выражение, обозначающее первый день недели.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: двери ... были заперты
  rationale: Перфектное пассивное причастие обозначает сохраняющееся состояние; «заперты» соответствует обстановке страха и защиты точнее, чем просто «закрыты».
- source_word: ὅπου ἦσαν οἱ μαθηταί
  choice: там, где находились ученики
  rationale: Сохраняет простое указание на местонахождение, не добавляя отсутствующих в тексте слов «дом», «комната» или идеи собрания.
- source_word: μαθηταί
  choice: ученики
  rationale: Обычный русский эквивалент, сохраняющий значение отношений ученика с наставником.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: из страха перед иудеями
  rationale: Передаёт причинное значение διά с винительным падежом и сохраняет неопределённость референта Ἰουδαίων.
- source_word: ἦλθεν ὁ Ἰησοῦς
  choice: Иисус пришёл
  rationale: Естественная передача повествовательного аориста без добавочного толкования способа Его появления.
- source_word: ἔστη εἰς τὸ μέσον
  choice: встал посреди них
  rationale: Сохраняет пространственный образ появления Иисуса в середине группы; «них» ясно восстанавливается из контекста.
- source_word: λέγει αὐτοῖς
  choice: сказал им
  rationale: Историческое настоящее естественно передано русским прошедшим временем в последовательном повествовании.
- source_word: Εἰρήνη ὑμῖν
  choice: Мир вам!
  rationale: Близко к буквальной форме греческого приветствия и одновременно естественно и торжественно звучит по-русски.
theological_decisions:
- issue: Кого обозначает τῶν Ἰουδαίων в Евангелии от Иоанна
  choice: «перед иудеями» в основном тексте с пояснением в сноске
  alternative: «перед иудейскими властями» или «перед жителями Иудеи»
  rationale: Греческое слово само по себе не уточняет здесь группу до одних руководителей. Основной текст сохраняет лексическую широту, а сноска предупреждает ошибочное понимание выражения как обвинения всех иудеев без исключения.
- issue: Характер появления Иисуса при запертых дверях
  choice: «Иисус пришёл» без пояснения способа
  alternative: уточнить, что Он прошёл сквозь запертые двери
  rationale: Текст подчёркивает, что двери были заперты, но не объясняет физический способ появления Иисуса; перевод не должен разрешать эту повествовательную и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис первой фразы несколько сохраняет структуру оригинала, но остаётся понятным; исключены добавления «дом» или «комната», отсутствующие в греческом тексте.
