  text: εἶτα λέγει τῷ Θωμᾷ· Φέρε τὸν δάκτυλόν σου ὧδε καὶ ἴδε τὰς χεῖράς μου, καὶ φέρε τὴν χεῖρά σου καὶ βάλε εἰς τὴν πλευράν μου, καὶ μὴ γίνου ἄπιστος ἀλλὰ πιστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/027.yaml
  text: Then he said to Thomas[a], “Bring your finger here and see my hands, and bring your hand and put it into my side, and do not become unbelieving, but believing.”
translation:
  language: ru
  text: 'Затем Он говорит Фоме: «Поднеси сюда свой палец и посмотри на Мои руки. Поднеси свою руку и вложи её в Мой бок. Не становись неверующим, но верующим»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будь неверным, но верным». Греческие прилагательные могут означать как «неверующий» и «верующий», так и «неверный» и «верный»; в данном контексте основное внимание уделено вере Фомы в воскресшего Иисуса.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: Затем
  rationale: Передаёт последовательность событий естественным для русского повествования способом.
- source_word: λέγει
  choice: говорит
  rationale: Сохранён греческий исторический презенс; в русском повествовании он звучит естественно и придаёт сцене непосредственность.
- source_word: Φέρε ... φέρε
  choice: Поднеси ... Поднеси
  rationale: Сохраняет повтор одного и того же глагола и выражает движение пальца и руки к телу Иисуса без излишне конкретного толкования.
- source_word: δάκτυλόν σου ὧδε
  choice: сюда свой палец
  rationale: «Сюда» сохраняет указательное значение ὧδε; порядок слов естественен для современного русского языка.
- source_word: ἴδε τὰς χεῖράς μου
  choice: посмотри на Мои руки
  rationale: В данном приглашении осмотреть руки «посмотри на» по-русски естественнее буквального «увидь», сохраняя зрительный смысл императива.
- source_word: βάλε εἰς τὴν πλευράν μου
  choice: вложи её в Мой бок
  rationale: «Вложи ... в» передаёт направленность εἰς и физическое действие; местоимение «её» ясно отсылает к руке и необходимо для естественного русского синтаксиса.
- source_word: μὴ γίνου
  choice: не становись
  rationale: Сохраняет процессуальный оттенок γίνομαι, не превращая призыв в статическое «не будь» или более толковательное «перестань быть».
- source_word: ἄπιστος ... πιστός
  choice: неверующим, но верующим
  rationale: В ближайшем контексте речь идёт об отказе Фомы поверить в воскресение Иисуса; эта пара естественно передаёт основной контекстуальный смысл и сохраняет антитезу.
theological_decisions:
- issue: Смысл противопоставления ἄπιστος / πιστός
  choice: неверующий / верующий
  alternative: неверный / верный
  rationale: Контекст сосредоточен на вере Фомы в воскресшего Иисуса, поэтому значение, связанное с верой, вынесено в основной текст. Вместе с тем греческие прилагательные допускают значение верности, которое сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Историческое настоящее сохранено. Повтор повелительного глагола отражает структуру оригинала; архаичные «се» и «воззри» исключены. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно принятой русской библейской издательской традиции.
