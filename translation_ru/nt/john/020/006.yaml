- from: Тогда приходит и Симон Пётр, следовавший за ним, и входит в гробницу. Он видит лежащие там льняные полотна.
  to: Тогда приходит также Симон Пётр, следуя за ним, и входит в гробницу. Он видит лежащие там льняные полотна.
  rationale: Исправлены только одновременное значение ἀκολουθῶν и добавочный оттенок καί. Историческое настоящее в «приходит» и «видит» сохранено, как в греческом тексте; отсутствие отдельной сноски допустимо, поскольку этот приём непосредственно воспроизводится в русском тексте.
