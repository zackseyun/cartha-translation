lexical_decisions:
- source_word: ἔρχεται
  choice: приходит
  rationale: 'Сохранено историческое настоящее греческого текста: оно придаёт повествованию живость и естественно звучит по-русски в этой сцене.'
- source_word: οὖν
  choice: тогда
  rationale: Передаёт переход к следующему событию в повествовании без чрезмерно логического оттенка слова «поэтому».
- source_word: καὶ Σίμων Πέτρος
  choice: и Симон Пётр
  rationale: 'Сохраняет добавочное значение καί: вслед за другим учеником приходит также Симон Пётр.'
- source_word: ἀκολουθῶν αὐτῷ
  choice: следовавший за ним
  rationale: Передаёт одновременное обстоятельство, выраженное причастием, и ясно указывает, что Пётр шёл вслед за другим учеником.
- source_word: εἰσῆλθεν εἰς τὸ μνημεῖον
  choice: входит в гробницу
  rationale: «Гробница» ясно обозначает место погребения, а настоящее время согласовано с историческим настоящим окружающего повествования.
- source_word: θεωρεῖ
  choice: видит
  rationale: Сохранено историческое настоящее; простое «видит» естественно передаёт внимательное зрительное восприятие в данном контексте.
- source_word: τὰ ὀθόνια
  choice: льняные полотна
  rationale: Прямая и прозрачная передача названия льняных погребальных тканей без добавления отсутствующего в самом слове толкования.
- source_word: κείμενα
  choice: лежащие там
  rationale: Передаёт положение полотен; «там» естественно связывает их с внутренним пространством гробницы.
