  text: ταῦτα δὲ γέγραπται ἵνα ⸀πιστεύητε ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ, καὶ ἵνα πιστεύοντες ζωὴν ἔχητε ἐν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/031.yaml
  text: But these have been written so that you may believe that Jesus is the Messiah[a], the Son of God[b], and so that by believing you may have life in his name.
translation:
  language: ru
  text: Но всё это написано, чтобы вы верили[a], что Иисус — Мессия, Сын Божий, и чтобы, веря, вы имели жизнь во имя Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В одних рукописях стоит форма, которую можно понимать как «чтобы вы продолжали верить» (настоящее время), а в других — форма, которую можно понимать как «чтобы вы уверовали» (аорист). В основном тексте употреблено более широкое выражение: «чтобы вы верили».'
    reason: textual_variant
lexical_decisions:
- source_word: ταῦτα
  choice: всё это
  rationale: Указывает на описанные знамения и повествование; по-русски «всё это» естественно связывает стих с предшествующим контекстом.
- source_word: δὲ
  choice: Но
  rationale: Передаёт мягкое противопоставление предыдущему стиху и переход к цели написанного.
- source_word: γέγραπται
  choice: написано
  rationale: Русская краткая форма страдательного причастия естественно выражает совершившееся написание с сохраняющимся результатом.
- source_word: ἵνα πιστεύητε
  choice: чтобы вы верили
  rationale: Передаёт целевое значение ἵνα и не сужает искусственно аспект πιστεύητε до начала или продолжения веры; разночтение отражено в сноске.
- source_word: ὁ χριστός
  choice: Мессия
  rationale: Передаёт значение греческого титула Χριστός и сохраняет его мессианский контекст, а не просто транслитерирует титул.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Сын Божий
  rationale: Точное, традиционное и понятное воспроизведение христологического титула.
- source_word: πιστεύοντες
  choice: веря
  rationale: Деепричастие естественно передаёт обстоятельственное значение причастия и связь веры с обладанием жизнью.
- source_word: ζωὴν ἔχητε
  choice: вы имели жизнь
  rationale: Сохраняет целевую конструкцию и не добавляет отсутствующее в греческом тексте определение «вечную».
- source_word: ἐν τῷ ὀνόματι αὐτοῦ
  choice: во имя Его
  rationale: Сохраняет библейскую формулу и её намеренную смысловую ёмкость, не сводя ἐν к одному толкованию вроде «благодаря» или «через».
theological_decisions:
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном месте слово является титулом и утверждает мессианскую идентичность Иисуса; смысловой перевод делает это прозрачным современному читателю.
- issue: Текстуальный и аспектуальный вопрос πιστεύητε
  choice: чтобы вы верили
  alternative: чтобы вы продолжали верить / чтобы вы уверовали
  rationale: Основной текст SBLGNT содержит настоящее сослагательное πιστεύητε, но существует значимое разночтение с аористом πιστεύσητε. Нейтральное «верили» не разрешает спор однозначно, а сноска сообщает варианты.
- issue: Значение жизни в стихе
  choice: жизнь
  alternative: вечная жизнь
  rationale: Прилагательного «вечная» в греческом тексте нет; богословская насыщенность понятия должна сохраняться без поясняющей вставки.
- issue: Значение ἐν τῷ ὀνόματι αὐτοῦ
  choice: во имя Его
  alternative: через Его имя
  rationale: Буквально близкая и естественная библейская формула сохраняет возможные оттенки основания, сферы и действенной связи с личностью Иисуса.
translation_notes:
  register: Современный литературный русский с достоинством библейского стиля. Синтаксис сохраняет две параллельные целевые конструкции. Заглавные буквы в «Сын Божий» и местоимении «Его» соответствуют принятому русскому библейскому регистру.
