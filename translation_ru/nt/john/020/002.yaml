base_translation:
  language: en
  yaml_path: translation/nt/john/020/002.yaml
  text: So she runs and comes to Simon Peter and to the other disciple[a], whom Jesus loved, and says to them, “They have taken the Lord out of the tomb[b], and we do not know where they have laid him.”
translation:
  language: ru
  text: 'Тогда она бежит к Симону Петру и к другому ученику[a], которого любил Иисус, и говорит им: «Господа унесли из гробницы, и мы не знаем, где Его положили».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте употреблён глагол φιλέω, который может подчёркивать личную привязанность; возможно также: «к которому Иисус питал привязанность».'
    reason: lexical_alternative
  - marker: b
    text: Мария говорит «мы не знаем», сохраняя первое лицо множественного числа греческого текста. Кого ещё она включает в это «мы», сам стих не поясняет.
    reason: alternative_reading
lexical_decisions:
- source_word: τρέχει οὖν καὶ ἔρχεται
  choice: Тогда она бежит к
  rationale: Историческое настоящее сохраняет живость повествования. «Тогда» естественно передаёт следствие и развитие событий, выраженные οὖν; два греческих глагола движения без потери смысла естественно сведены в русском к «бежит к».
- source_word: πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητήν
  choice: к Симону Петру и к другому ученику
  rationale: Повтор предлога сохраняет структуру и ясно показывает, что Мария направляется к обоим ученикам.
- source_word: ὃν ἐφίλει ὁ Ἰησοῦς
  choice: которого любил Иисус
  rationale: «Любил» точно и естественно передаёт φιλέω в данном контексте; имперфект выражен обычным русским прошедшим временем без неестественной длительной конструкции.
- source_word: λέγει αὐτοῖς
  choice: говорит им
  rationale: Историческое настоящее сохранено ради повествовательной непосредственности.
- source_word: Ἦραν τὸν κύριον ἐκ τοῦ μνημείου
  choice: Господа унесли из гробницы
  rationale: Неопределённо-личная конструкция естественно передаёт греческое третье лицо множественного числа без введения не названного субъекта. «Гробница» обозначает место погребения и отличает его от могилы как ямы.
- source_word: οὐκ οἴδαμεν
  choice: мы не знаем
  rationale: Первое лицо множественного числа сохранено буквально и не заменено на единственное.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: куда Его положили
  rationale: «Куда» идиоматично сочетается с глаголом перемещения «положили» и передаёт неизвестность нынешнего местонахождения тела.
theological_decisions:
- issue: Передача κύριος применительно к Иисусу
  choice: Господь
  alternative: Учитель / господин
  rationale: В данном контексте это почтительное обозначение Иисуса; традиционное и современно понятное «Господь» сохраняет христологическое звучание, не сводя слово к бытовому обращению.
- issue: Множественное число οἴδαμεν в словах Марии
  choice: мы не знаем
  alternative: я не знаю
  rationale: Сохранено явное множественное число исходного текста. Перевод не определяет, кого именно Мария включает в «мы», и не гармонизирует стих с другими рассказами.
- issue: Неуказанный субъект формы Ἦραν
  choice: неопределённо-личное «унесли»
  alternative: «они унесли»
  rationale: Греческий текст не называет тех, кто, по мнению Марии, унёс тело. Русская неопределённо-личная конструкция сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Историческое настоящее сохранено. Местоимение «Его» написано с прописной буквы как принятая почтительная издательская норма; это не добавляет отдельного смыслового утверждения.
