  text: Τῇ δὲ μιᾷ τῶν σαββάτων Μαρία ἡ Μαγδαληνὴ ἔρχεται πρωῒ σκοτίας ἔτι οὔσης εἰς τὸ μνημεῖον, καὶ βλέπει τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/001.yaml
  text: On the first day of the week[a], Mary Magdalene comes to the tomb early, while it was still dark, and sees the stone having been taken away from the tomb.
translation:
  language: ru
  text: В первый день недели[a] Мария Магдалина приходит к гробнице рано, когда ещё темно, и видит, что камень отодвинут от гробницы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в один из субботних дней»; это выражение означает первый день недели.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ μιᾷ τῶν σαββάτων
  choice: В первый день недели
  rationale: Устойчивое койне-греческое обозначение первого дня недели; буквальная форма пояснена в сноске. Частица δέ не требует отдельного вводного слова в естественном русском повествовании.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Мария Магдалина
  rationale: Традиционная и понятная русская форма имени и прозвания.
- source_word: ἔρχεται
  choice: приходит
  rationale: Сохранено историческое настоящее, придающее повествованию непосредственность.
- source_word: πρωῒ σκοτίας ἔτι οὔσης
  choice: рано… когда ещё темно
  rationale: Передаёт раннее время и продолжающуюся темноту, не добавляя отсутствующего в источнике указания на рассвет.
- source_word: εἰς τὸ μνημεῖον
  choice: к гробнице
  rationale: В данном контексте μνημεῖον означает место погребения; «гробница» ясно и естественно передаёт предмет речи.
- source_word: βλέπει
  choice: видит
  rationale: Сохранено историческое настоящее и простое зрительное восприятие без усиления значения.
- source_word: τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου
  choice: что камень убран от гробницы
  rationale: 'Конструкция передаёт завершённое пассивное действие и его наличный результат: к моменту прихода Марии камень уже находился не у гробницы. «Убран» не уточняет способ перемещения, которого греческий текст здесь не называет.'
theological_decisions:
- issue: Повествовательное время в рассказе о воскресении
  choice: 'Сохранить историческое настоящее: «приходит», «видит»'
  alternative: 'Передать глаголы прошедшим временем: «пришла», «увидела»'
  rationale: Историческое настоящее заметно в греческом повествовании и естественно звучит по-русски; его сохранение не добавляет богословского толкования.
- issue: Кем был убран камень
  choice: Использовать пассивную форму «камень убран», не называя действующего лица
  alternative: Указать, что камень убрал Бог или ангел
  rationale: Греческий пассив не называет исполнителя, поэтому перевод сохраняет эту недосказанность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан понятным для широкого читателя; историческое настоящее и смысловая недосказанность пассива сохранены.
