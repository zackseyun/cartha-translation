review_pass:
  verdict: revise
  source_fidelity: 'Начальная временная формула верно передана как «В первый день недели»; исторические настоящие «приходит» и «видит» уместно сохранены. «Когда ещё темно» точно передаёт генитив абсолютный. В исходном варианте «камень убран от гробницы» передаёт пассивность и результативность ἠρμένον, но выбор «убран» в сочетании «убран от» семантически и стилистически неудачен: по-русски он легко означает, что предмет просто прибрали. «Отодвинут от гробницы» ясно передаёт, что камень уже не находился на прежнем месте, не называя деятеля.'
  naturalness: Предложение в целом естественно для современного литературного русского. Более обычный порядок слов — «приходит к гробнице рано», а «отодвинут от гробницы» звучит существенно естественнее, чем «убран от гробницы».
  terminology: «Мария Магдалина» и «гробница» употреблены правильно и соответствуют принятому современному библейскому регистру. Сноска сохраняет нужное указание на буквальную форму греческой идиомы; её формулировка понятна и не навязывает спорного толкования.
