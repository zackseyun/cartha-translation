base_translation:
  language: en
  yaml_path: translation/nt/john/003/032.yaml
  text: What he has seen and heard[a], this he testifies to[b], and no one receives his testimony.
translation:
  language: ru
  text: Он свидетельствует о том, что видел и слышал, и никто не принимает Его свидетельства.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «никто не принимает Его свидетельства» представляют собой резкое обобщение; в следующем стихе говорится о том, кто это свидетельство принимает.
    reason: cross_reference
lexical_decisions:
- source_word: ὃ
  choice: о том, что
  rationale: Относительное местоимение среднего рода указывает на содержание увиденного и услышанного; оборот «о том, что» естественно связывается с русским глаголом «свидетельствовать».
- source_word: ἑώρακεν
  choice: видел
  rationale: Греческий перфект обозначает увиденное как сохраняющее актуальность; в русском координация «видел и слышал» передаёт это естественно, без тяжеловесного «увидел».
- source_word: ἤκουσεν
  choice: слышал
  rationale: Аорист стоит рядом с перфектом; русский вид не позволяет без искажения полностью воспроизвести аспектуальное различие, поэтому выбран идиоматичный однородный ряд.
- source_word: τοῦτο
  choice: Он и свидетельствует
  rationale: 'Усилительная частица «и» передаёт возобновляющее и указательное значение τοῦτο: свидетельствует именно о только что названном.'
- source_word: μαρτυρεῖ
  choice: свидетельствует
  rationale: Сохраняет характерный для Иоанна язык свидетельства и возможный судебный оттенок.
- source_word: μαρτυρίαν
  choice: свидетельства
  rationale: Однокоренное соответствие с «свидетельствует» сохраняет лексическую связь μαρτυρεῖ — μαρτυρίαν.
- source_word: οὐδεὶς
  choice: никто
  rationale: Прямо и без смягчения передаёт всеобщее отрицание.
- source_word: λαμβάνει
  choice: принимает
  rationale: В данном контексте означает не только получение, но принятие свидетельства; «принимает» естественно по-русски и сохраняет характерную для Иоанна формулировку.
theological_decisions:
- issue: Объём всеобщего отрицания «никто не принимает»
  choice: Сохранено резкое обобщение «никто не принимает».
  alternative: «Почти никто не принимает» или строго абсолютное толкование без учёта следующего стиха.
  rationale: Греческий текст формулирует всеобщее отрицание без оговорок, тогда как следующий стих говорит о принявшем свидетельство. Перевод сохраняет это напряжение и не разрешает его посредством парафраза.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизации. Заглавные местоимения «Он», «Его» употреблены как традиционный русский способ обозначения Христа; они не устраняют референтную связь с контекстом. Частица «но» естественно выражает противопоставление, заложенное в καί перед отрицательной частью.
