lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно вводит придаточное цели или результата и сохраняет связь с предыдущим высказыванием.
- source_word: πᾶς ὁ πιστεύων
  choice: каждый, кто верит
  rationale: Субстантивированное причастие имеет обобщающий смысл. Этот вариант ясно и естественно передаёт всеобщий охват выражения.
- source_word: πιστεύων
  choice: верит
  rationale: Обычное и прозрачное соответствие πιστεύω в контексте Евангелия от Иоанна; настоящее время передано без искусственного подчёркивания длительности.
- source_word: ἐν αὐτῷ
  choice: в Него
  rationale: Греческий текст содержит ἐν, а не более обычное для Иоанна εἰς. Русское управление глагола «верить» требует формы «в Него»; примечание сохраняет грамматическое различие оригинала.
- source_word: ἔχῃ
  choice: имел
  rationale: Сослагательная форма после ἵνα естественно передаётся русским прошедшим временем с «чтобы» и не означает сомнения в возможности обрести жизнь.
- source_word: ζωὴν αἰώνιον
  choice: вечную жизнь
  rationale: Устоявшийся, точный и понятный эквивалент, передающий как непреходящую продолжительность, так и эсхатологическое качество жизни.
theological_decisions:
- issue: Выражение веры с ἐν αὐτῷ
  choice: в Него
  alternative: в Нём
  rationale: Основной текст следует фактическому чтению ἐν αὐτῷ, но использует нормативное русское управление «верить в кого». Примечание указывает на буквальную форму, не подменяя её более частой конструкцией с εἰς.
- issue: Объём значения πᾶς ὁ πιστεύων
  choice: каждый, кто верит
  alternative: всякий верующий
  rationale: Выражение имеет обобщающий и всеохватный смысл; выбранный вариант естественен в современном русском языке и не добавляет гендерного ограничения.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным библейским звучанием. Местоимение «Него» написано с прописной буквы как традиционное уважительное обозначение Христа.
