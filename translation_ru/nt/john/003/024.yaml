  text: For John had not yet been thrown into prison[a].
translation:
  language: ru
  text: Ведь Иоанн ещё не был брошен в тюрьму[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть Иоанн Креститель.
    reason: cross_reference
lexical_decisions:
- source_word: οὔπω
  choice: ещё не
  rationale: Точно передаёт, что к данному моменту повествования событие пока не произошло, и естественно звучит по-русски.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь со сказанным ранее без излишне жёсткого причинного оттенка.
- source_word: ἦν βεβλημένος
  choice: не был брошен
  rationale: В сочетании с «ещё» русская форма прошедшего времени естественно выражает предшествующее состояние; «брошен» сохраняет выразительность βάλλω и уместно для заключения в тюрьму.
- source_word: εἰς τὴν φυλακήν
  choice: в тюрьму
  rationale: Передаёт направленность εἰς и значение φυλακή как места заключения; это обычное современное русское выражение.
- source_word: ὁ Ἰωάννης
  choice: Иоанн
  rationale: Сохраняет указанное в греческом тексте простое имя, не добавляя в основной текст пояснение «Креститель».
theological_decisions:
- issue: Отождествление ὁ Ἰωάννης
  choice: Иоанн
  alternative: Иоанн Креститель
  rationale: Из контекста ясно, что речь об Иоанне Крестителе, однако в самом стихе стоит только имя. Пояснение вынесено в сноску, чтобы не расширять основной текст.
translation_notes:
  register: Современный литературный русский язык; краткая пояснительная фраза сохраняет достоинство и естественность повествования. Порядок слов адаптирован к русской норме, а маркер сноски помещён непосредственно после слова «тюрьму».
