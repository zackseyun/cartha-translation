  text: Ὁ ἄνωθεν ἐρχόμενος ἐπάνω πάντων ἐστίν. ὁ ὢν ἐκ τῆς γῆς ἐκ τῆς γῆς ἐστιν καὶ ἐκ τῆς γῆς λαλεῖ· ὁ ἐκ τοῦ οὐρανοῦ ἐρχόμενος ἐπάνω πάντων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/031.yaml
  text: The one who comes from above is above all[a]. The one who is from the earth is from the earth and speaks from the earth[b]. The one who comes from heaven is above all.
translation:
  language: ru
  text: Тот, кто приходит свыше, — выше всех[a]. Тот, кто от земли, происходит от земли и говорит от земли[b]. Тот, кто приходит с неба, — выше всех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с неба». Греческое ἄνωθεν указывает на происхождение сверху; далее это поясняется словами «с неба».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «говорит о земле». В греческом буквально вновь сказано «от земли»; это может указывать на источник, сферу или содержание речи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: свыше
  rationale: В сочетании с ἐρχόμενος слово обозначает происхождение сверху, а не повторность. «Свыше» сохраняет контраст с землёй и подготавливает более явное «с неба» в конце стиха.
- source_word: ἐρχόμενος
  choice: кто приходит
  rationale: Субстантивированное причастие настоящего времени естественно передаётся придаточным оборотом и сохраняет описательный характер действия.
- source_word: ἐπάνω πάντων
  choice: выше всех
  rationale: Фраза выражает превосходство и верховенство, сохраняя пространственный образ. В контексте лиц русское «выше всех» естественнее, чем «выше всего».
- source_word: ὁ ὢν ἐκ τῆς γῆς
  choice: тот, кто от земли
  rationale: Передаёт происхождение и сохраняет повтор предлога ἐκ в последующих оборотах.
- source_word: γῆ
  choice: земля
  rationale: Здесь слово противопоставлено небу как земная сфера небесной, поэтому «земля» точнее вариантов «страна» или «почва».
- source_word: ἐκ τῆς γῆς ἐστιν
  choice: от земли
  rationale: В русском составная связка может быть опущена; повтор «от земли» сохраняет риторический акцент оригинала без тяжеловесного «есть от земли».
- source_word: ἐκ τῆς γῆς λαλεῖ
  choice: говорит от земли
  rationale: Намеренно сохранена необычная конструкция с повтором ἐκ, чтобы не сужать смысл до предмета речи или земной точки зрения.
- source_word: οὐρανός
  choice: небо
  rationale: В данном богословском контексте обозначает небесную сферу и происхождение, а не просто видимое небо.
theological_decisions:
- issue: Соотношение выражений ἄνωθεν и ἐκ τοῦ οὐρανοῦ
  choice: Первое передано «свыше», второе — «с неба».
  alternative: Оба выражения передать как «с неба».
  rationale: 'Разные формулировки оригинала сохранены: заключительное «с неба» разъясняет небесное происхождение приходящего свыше, не устраняя словесного различия.'
- issue: Смысл повторяющихся выражений о земле
  choice: Сохранён тройной повтор «от земли».
  alternative: Сгладить как «земной человек говорит по-земному» или истолковать как «говорит о земном».
  rationale: Повтор подчёркивает контраст земного и небесного происхождения. Буквенная структура сохраняет возможные оттенки источника, сферы и предмета речи, не выбирая один из них без достаточных оснований.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Риторический повтор оригинала сохранён, хотя сочетание «говорит от земли» намеренно звучит необычно; сноска поясняет его смысловую открытость.
