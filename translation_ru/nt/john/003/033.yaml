base_translation:
  language: en
  yaml_path: translation/nt/john/003/033.yaml
  text: Whoever has received his testimony has certified that God is true[a].
translation:
  language: ru
  text: Кто принял его свидетельство, тот подтвердил[a], что Бог правдив.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «скрепил печатью то, что Бог правдив».'
    reason: Сохраняет буквальный образ глагола ἐσφράγισεν как удостоверения печатью.
lexical_decisions:
- source_word: ὁ λαβὼν
  choice: Кто принял
  rationale: Субстантивированное причастие с артиклем обозначает любого человека, принявшего свидетельство; аорист передаёт принятие как совершившийся акт.
- source_word: αὐτοῦ
  choice: его
  rationale: Местоимение естественно относится к упомянутому в контексте пришедшему с небес, чьё свидетельство принимают.
- source_word: τὴν μαρτυρίαν
  choice: свидетельство
  rationale: Сохраняет судебно-свидетельскую образность Иоанна и естественно сочетается с глаголом «принял».
- source_word: ἐσφράγισεν
  choice: подтвердил
  rationale: Передаёт метафорический смысл удостоверения и признания истинности; буквальный образ печати сохранён в сноске.
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание подтверждаемого утверждения, а не причину.
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Определённый субъект передан прямо, без ненужного расширения.
- source_word: ἀληθής
  choice: истинен
  rationale: Сохраняет широкий смысл истинности, правдивости и надёжности Бога, а также характерную для Иоанна лексику истины.
theological_decisions:
- issue: Метафорический смысл образа печати
  choice: 'В основном тексте: «подтвердил»'
  alternative: «поставил печать, удостоверив» / «скрепил печатью»
  rationale: Принятие свидетельства означает признание истинности Бога. Современное «подтвердил» ясно передаёт функцию метафоры, тогда как её буквальная форма отмечена в сноске без навязывания особого богословского толкования.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Конструкция «Кто… тот…» естественно передаёт греческое субстантивированное причастие. «Истинен» выбрано вместо более узкого «правдив», чтобы сохранить богословскую и лексическую многозначность ἀληθής.
