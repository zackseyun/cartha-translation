  text: Μετὰ ταῦτα ἦλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὴν Ἰουδαίαν γῆν, καὶ ἐκεῖ διέτριβεν μετ’ αὐτῶν καὶ ἐβάπτιζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/022.yaml
  text: After these things[a], Jesus and his disciples went into the land of Judea[c][b], and there he was spending time with them and baptizing.
translation:
  language: ru
  text: После этого Иисус вместе со своими учениками пришёл в область Иудеи и там оставался с ними и крестил.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В Ин 4:2 уточняется, что крестил не сам Иисус, а его ученики.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: После этого
  rationale: Естественный современный русский переход, сохраняющий временную последовательность; множественное ταῦτα по-русски идиоматично передаётся единственным «этого».
- source_word: ἦλθεν
  choice: пришёл
  rationale: Прямо отражает греческий глагол движения ἔρχομαι; контекст позволяет сохранить исходную перспективу без замены на «отправился».
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Свои ученики
  rationale: В сочетании «Иисус вместе со Своими учениками» возвратное притяжательное местоимение естественно связывает учеников с Иисусом.
- source_word: εἰς τὴν Ἰουδαίαν γῆν
  choice: в Иудейскую землю
  rationale: Сохраняет явно выраженное γῆ («земля, область») и отличает более широкую местность от города Иерусалима; формулировка понятна и обладает библейским достоинством.
- source_word: διέτριβεν
  choice: оставался
  rationale: Передаёт продолжительное пребывание, выраженное имперфектом, естественнее русского буквального «проводил время» в данном контексте.
- source_word: μετ’ αὐτῶν
  choice: с ними
  rationale: Прямая и естественная передача предложного оборота; местоимение относится к ученикам.
- source_word: ἐβάπτιζεν
  choice: крестил
  rationale: Стандартный русский эквивалент для βαπτίζω, не предрешающий способ совершения обряда; несовершенный вид передаёт длительное или повторявшееся действие.
theological_decisions:
- issue: Кто совершал крещение в соотношении с Ин 4:2
  choice: Сохранить Иисуса как грамматический субъект глагола «крестил» в основном тексте.
  alternative: Перестроить предложение так, чтобы крестящими прямо были названы ученики.
  rationale: В греческом тексте единственное число ἐβάπτιζεν естественно продолжает подлежащее ὁ Ἰησοῦς. Ин 4:2 позднее уточняет практическое участие учеников; это уточнение следует отметить, не изменяя формулировку данного стиха.
translation_notes:
  register: Современный литературный русский язык с умеренно формальной, достойной библейской интонацией. Синтаксис упрощён до естественного русского порядка слов; продолжительность двух имперфектов передана лексически («оставался») и несовершенным видом («крестил»).
