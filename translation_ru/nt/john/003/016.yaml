  edition: SBLGNT
  text: Οὕτως γὰρ ἠγάπησεν ὁ θεὸς τὸν κόσμον ὥστε τὸν ⸀υἱὸν τὸν μονογενῆ ἔδωκεν, ἵνα πᾶς ὁ πιστεύων εἰς αὐτὸν μὴ ἀπόληται ἀλλὰ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/016.yaml
  text: 'For God loved the world in this way: he gave his only Son[b][a], so that everyone who believes in him should not perish but have eternal life.'
translation:
  language: ru
  text: 'Ведь Бог так[a] возлюбил мир: Он отдал Своего единственного Сына[b], чтобы каждый, кто верит в Него, не погиб, но имел вечную жизнь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в традиционной формулировке: «Ибо так возлюбил Бог мир…» Греческое слово здесь может указывать на то, как Бог проявил Свою любовь: Он отдал Сына.'
    reason: lexical_alternative
  - marker: b
    text: 'Или, традиционно: «Своего Единородного Сына»; возможно также: «Своего уникального Сына».'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὕτως
  choice: так
  rationale: В сочетании с последующим пояснением через двоеточие «так» указывает прежде всего на образ проявления любви — Бог отдал Сына, — сохраняя при этом естественность и традиционное звучание по-русски.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь со сказанным ранее и звучит естественно в современном русском языке.
- source_word: ἠγάπησεν
  choice: возлюбил
  rationale: Совершенный вид передаёт аорист как совершившийся акт; «возлюбил» сохраняет достоинство и богословскую весомость текста без неестественной архаичности.
- source_word: τὸν κόσμον
  choice: мир
  rationale: Сохраняет широкое и намеренно не суженное значение κόσμος в Евангелии от Иоанна.
- source_word: ὥστε
  choice: ': Он отдал'
  rationale: Двоеточие естественно вводит конкретное проявление Божьей любви и не заставляет выбирать исключительно между значением результата и следствия.
- source_word: τὸν υἱὸν τὸν μονογενῆ
  choice: Своего единственного Сына
  rationale: «Единственного» ясно выражает уникальность Сына и соответствует современному лексическому пониманию μονογενής; традиционный вариант приведён в сноске.
- source_word: ἔδωκεν
  choice: отдал
  rationale: Русское «отдал» здесь естественнее простого «дал» и сохраняет широту действия, не ограничивая его лишь воплощением или распятием.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно передаёт целевое значение греческого союза.
- source_word: πᾶς ὁ πιστεύων
  choice: каждый, кто верит
  rationale: Передаёт включительный, обобщённый характер выражения и настоящее причастие без громоздкости.
- source_word: εἰς αὐτὸν
  choice: в Него
  rationale: Нормальный русский эквивалент конструкции πιστεύω εἰς; прописная буква соответствует принятому благоговейному регистру.
- source_word: μὴ ἀπόληται ἀλλὰ ἔχῃ ζωὴν αἰώνιον
  choice: не погиб, но имел вечную жизнь
  rationale: Сохраняет параллельные формы сослагательного наклонения под управлением «чтобы», а также противопоставление гибели и вечной жизни.
theological_decisions:
- issue: Значение Οὕτως
  choice: 'образ действия: «так», раскрываемое последующим «Он отдал…»'
  alternative: 'степень: «так сильно»'
  rationale: Синтаксис позволяет последующему дарованию Сына раскрывать, как именно Бог возлюбил мир. Формулировка не отрицает величия любви, но не делает степень её главным лексическим смыслом.
- issue: Передача μονογενής применительно к Сыну
  choice: «единственного Сына»
  alternative: «Единородного Сына» или «уникального Сына»
  rationale: Основной текст подчёркивает уникальность сыновства, не сводя слово к физическому рождению; исторически и богословски значимый вариант «Единородного» сохранён в сноске.
- issue: Объём πᾶς ὁ πιστεύων
  choice: «каждый, кто верит»
  alternative: «всякий верующий»
  rationale: Сохраняет универсальную и обобщённую форму утверждения, не разрешая через перевод последующие споры об избрании, искуплении или человеческом отклике.
- issue: Оттенок ἔδωκεν
  choice: «отдал» без уточнения способа
  alternative: «послал» или «предал на смерть»
  rationale: Перевод сохраняет смысловую широту греческого глагола и не ограничивает дарование Сына одним этапом Его миссии.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Порядок слов сделан естественным для русского; двоеточие раскрывает значение «так». Местоимения, относящиеся к Богу и Сыну, написаны с прописной буквы согласно распространённой русской библейской практике.
