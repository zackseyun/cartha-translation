lexical_decisions:
- source_word: ὁ πατὴρ
  choice: Отец
  rationale: В контексте Евангелия от Иоанна это личное наименование Бога в Его отношении к Сыну; прописная буква передаёт титульное употребление.
- source_word: ἀγαπᾷ
  choice: любит
  rationale: Настоящее время обозначает продолжающуюся реальность; русское настоящее время передаёт это естественно.
- source_word: τὸν υἱόν
  choice: Сына
  rationale: Речь идёт об Иисусе в Его уникальном отношении к Отцу; прописная буква уместна для личного христологического наименования.
- source_word: πάντα
  choice: всё
  rationale: Субстантивированное среднее множественное число имеет всеохватное значение; «всё» звучит естественно и сохраняет широту выражения.
- source_word: δέδωκεν
  choice: отдал
  rationale: Перфект указывает на совершившуюся передачу с сохраняющимся результатом. В сочетании «отдал в руки» русский совершенный вид естественно выражает и завершённость, и действующее последствие.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: в Его руки
  rationale: Буквально — «в Его руке», но в сочетании с глаголом передачи это идиома о вручении власти или распоряжения; русское «отдать в руки» естественно передаёт её смысл.
theological_decisions:
- issue: Отношение Отца и Сына
  choice: Сохранены личные наименования «Отец» и «Сын» с прописной буквы.
  alternative: Передача как обычных родственных существительных со строчной буквы.
  rationale: Контекст представляет эти слова как конкретные богословски значимые наименования, однако перевод не добавляет к ним отсутствующих в стихе доктринальных пояснений.
- issue: Объём и сохраняющийся результат передачи Сыну
  choice: «всё отдал в Его руки»
  alternative: «дал Ему всё» или буквальное «дал всё в Его руке»
  rationale: Формулировка сохраняет всеохватность πάντα и передаёт совершившееся наделение властью с продолжающимся результатом, не уточняя сверх текста природу всего переданного.
translation_notes:
  register: Современный литературный русский язык, краткий и торжественно-нейтральный. Идиоматическое «отдал в Его руки» понятно широкому читателю и сопровождается примечанием с буквальной формой.
