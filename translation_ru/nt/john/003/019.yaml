id: JHN.3.19
reference: John 3:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ κρίσις ὅτι τὸ φῶς ἐλήλυθεν εἰς τὸν κόσμον καὶ ἠγάπησαν οἱ ἄνθρωποι μᾶλλον τὸ σκότος ἢ τὸ φῶς, ἦν γὰρ ⸂αὐτῶν πονηρὰ⸃ τὰ ἔργα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/019.yaml
  text: 'And this is the judgment: that the light has come into the world[a], and people loved the darkness rather than the light, because their works were evil.'
translation:
  language: ru
  text: 'И вот в чём суд: свет пришёл в мир, но люди полюбили тьму больше, чем свет, потому что их дела были злы.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρίσις
  choice: суд
  rationale: Сохраняет широкий смысл суда и решающей оценки, не сужая его заранее до одного лишь осуждения или приговора.
- source_word: τὸ φῶς
  choice: свет
  rationale: Сохраняет характерную для Иоанна метафору, не подменяя её прямым указанием на Иисуса.
- source_word: ἐλήλυθεν
  choice: пришёл
  rationale: Русская форма прошедшего времени естественно передаёт совершившееся пришествие света; сохраняющийся результат ясен из контекста.
- source_word: κόσμον
  choice: мир
  rationale: Обычное и достаточно ёмкое соответствие иоанновскому κόσμος.
- source_word: ἠγάπησαν
  choice: полюбили
  rationale: Передаёт не только предпочтение, но и нравственно значимую привязанность к тьме.
- source_word: οἱ ἄνθρωποι
  choice: люди
  rationale: 'Естественно передаёт обобщённое значение: речь идёт о людях вообще, а не только о мужчинах.'
- source_word: μᾶλλον ... ἢ
  choice: больше, чем
  rationale: Прямо и естественно передаёт сравнительное предпочтение.
- source_word: τὸ σκότος
  choice: тьму
  rationale: Сохраняет символический контраст света и тьмы.
- source_word: πονηρὰ
  choice: злы
  rationale: Передаёт нравственную порочность дел, не ослабляя значение до «плохи».
- source_word: τὰ ἔργα
  choice: дела
  rationale: Естественное русское соответствие, сохраняющее важную для Евангелия лексику дел.
theological_decisions:
- issue: Кого обозначает «свет»
  choice: Метафора «свет» сохранена без поясняющей подстановки.
  alternative: Передать как «Христос», «Иисус» или оформить как явный титул «Свет».
  rationale: Контекст связывает свет с пришедшим Сыном, однако греческий текст сохраняет метафору; перевод не должен устранять её смысловую глубину.
- issue: Смысл κρίσις
  choice: «суд»
  alternative: «осуждение» или «приговор»
  rationale: Здесь раскрывается сущность или основание суда; более узкое «осуждение» преждевременно фиксировало бы только отрицательный исход.
- issue: Связь καί между приходом света и реакцией людей
  choice: Передано противительным «но».
  alternative: Буквальное «и».
  rationale: В данном контексте καί соединяет резко контрастирующие события; русское «но» ясно выражает этот подразумеваемый контраст, не меняя содержания.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и торжественная, но понятная широкому читателю. Порядок слов слегка нормализован для естественного русского звучания. Слово «люди» уже недвусмысленно имеет обобщённый смысл, поэтому примечание о родовой инклюзивности не требуется.
