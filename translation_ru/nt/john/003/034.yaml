  text: ὃν γὰρ ἀπέστειλεν ὁ θεὸς τὰ ῥήματα τοῦ θεοῦ λαλεῖ, οὐ γὰρ ἐκ μέτρου ⸀δίδωσιν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/034.yaml
  text: For the one whom God sent speaks the words of God[a], for he gives the Spirit without measure.
translation:
  language: ru
  text: Ведь Тот, кого послал Бог, говорит слова Бога, потому что Бог даёт Духа без меры.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что Он даёт Духа без меры», где «Он» — Тот, кого послал Бог.'
    reason: Альтернативное понимание невыраженного подлежащего глагола «даёт».
lexical_decisions:
- source_word: ὃν
  choice: Тот, Кого
  rationale: Субстантивированное относительное местоимение передано естественной русской конструкцией, обозначающей посланного Богом.
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Простое прошедшее время прямо передаёт аорист и сохраняет характерную для Иоанна лексику посланничества.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: слова Божьи
  rationale: Множественное число ῥήματα обозначает произносимые слова; русская конструкция естественна и сохраняет принадлежность слов Богу.
- source_word: λαλεῖ
  choice: говорит
  rationale: Настоящее время и обычное значение глагола переданы прямо и естественно.
- source_word: οὐ ... ἐκ μέτρου
  choice: без меры
  rationale: Отрицательная греческая конструкция означает отсутствие отмеренного, ограниченного дара; выражение «без меры» сохраняет метафору.
- source_word: δίδωσιν
  choice: даёт
  rationale: Настоящее время передано напрямую; глагол не перегружен дополнительным богословским оттенком.
- source_word: τὸ πνεῦμα
  choice: Духа
  rationale: В контексте Иоанна речь естественно понимать о Святом Духе; прописная буква обозначает этот референт, не добавляя слова «Святой», которого здесь нет в греческом тексте.
theological_decisions:
- issue: Подразумеваемое подлежащее при δίδωσιν («даёт»)
  choice: 'В основном тексте подлежащим назван Бог: «Бог даёт Духа без меры».'
  alternative: 'Подлежащим может быть Тот, Кого Бог послал: «Он даёт Духа без меры».'
  rationale: Греческое подлежащее не выражено. Контекст и логика фразы позволяют понимать дающим Бога, Который даёт Духа Посланному, благодаря чему Тот говорит Божьи слова. Однако грамматически возможно отнести действие к Посланному; эта подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Прописные буквы в «Тот, Кого» помогают обозначить мессианского референта в данном контексте. Явное «Бог» во второй части устраняет неясность основного прочтения, а грамматическая альтернатива вынесена в сноску.
