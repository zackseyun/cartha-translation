  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν ἔχει ζωὴν αἰώνιον· ὁ δὲ ἀπειθῶν τῷ υἱῷ οὐκ ὄψεται ζωήν, ἀλλ’ ἡ ὀργὴ τοῦ θεοῦ μένει ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/036.yaml
  text: The one who believes in the Son has eternal life; but the one who disobeys the Son will not see life, but the wrath of God remains on him.
translation:
  language: ru
  text: Тот, кто верит в Сына, имеет вечную жизнь; а тот, кто не повинуется Сыну[a], не увидит жизни, но гнев Божий остаётся на нём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тот, кто отказывается верить Сыну». Греческий глагол может означать как неповиновение, так и отказ верить.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς τὸν υἱόν
  choice: Верующий в Сына
  rationale: Субстантивированное причастие настоящего времени передаёт обобщённое обозначение человека и продолжающееся доверие, направленное на Сына; конструкция «веровать в» естественна для современного литературного русского и сохраняет личностный смысл εἰς.
- source_word: τὸν υἱόν / τῷ υἱῷ
  choice: Сына / Сыну
  rationale: Сохранён христологический титул с определённостью контекста, без добавления отсутствующего в греческом притяжательного определения «Божьего».
- source_word: ἔχει
  choice: имеет
  rationale: Настоящее время указывает на нынешнее обладание жизнью, а не только на будущую надежду.
- source_word: ζωὴν αἰώνιον
  choice: вечную жизнь
  rationale: Устоявшееся и точное выражение, передающее как непреходящую длительность, так и эсхатологическое качество жизни в контексте Иоанна.
- source_word: ὁ δὲ ἀπειθῶν
  choice: а непокорный
  rationale: ἀπειθέω охватывает непослушание и отказ верить. «Непокорный» сохраняет более широкий смысл слова и естественно сочетается с дательным «Сыну»; оттенок отказа верить отмечен в сноске.
- source_word: οὐκ ὄψεται ζωήν
  choice: не увидит жизни
  rationale: Сохранён образный идиоматический оборот оригинала и его будущее время, без сведения смысла к одному лишь обладанию жизнью.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: гнев Божий
  rationale: Прямо передаёт генитивную конструкцию и не смягчает утверждение о Божьем суде.
- source_word: μένει ἐπ’ αὐτόν
  choice: остаётся на нём
  rationale: Настоящее время μένει выражает продолжающееся состояние; «на нём» естественно передаёт ἐπί с винительным в данном контексте.
theological_decisions:
- issue: Значение ἀπειθῶν в противопоставлении πιστεύων
  choice: «непокорный Сыну» в основном тексте с вариантом «отказывающийся верить Сыну» в сноске
  alternative: «не верующий в Сына»
  rationale: Противопоставление указывает на неверие, однако лексема также выражает непослушание. Основной текст сохраняет эту смысловую широту, а сноска — непосредственно связанный с контекстом оттенок отказа верить.
- issue: Временная соотнесённость вечной жизни и Божьего гнева
  choice: Сохранены нынешнее обладание вечной жизнью и нынешнее пребывание Божьего гнева, наряду с будущим «не увидит»
  alternative: Истолковать жизнь и гнев исключительно как будущие состояния
  rationale: ἔχει и μένει стоят в настоящем времени, тогда как ὄψεται — в будущем. Перевод сохраняет это напряжение, не гармонизируя временные планы.
translation_notes:
  register: Современный литературный русский, ясный и торжественно-сдержанный. Параллелизм двух частей сохранён; двоеточие перед заключительным утверждением устраняет тяжёлый повтор союза «но» и естественно показывает итоговое противопоставление.
