  yaml_path: translation/nt/john/003/009.yaml
  text: Nicodemus answered and said to him[a], “How can these things happen?”
translation:
  language: ru
  text: 'Никодим ответил ему: «Как это может произойти?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как это может быть?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Νικόδημος καὶ εἶπεν αὐτῷ
  choice: Никодим спросил его
  rationale: Греческая формула буквально означает «Никодим ответил и сказал ему», но в данном диалоге по-русски естественно передаётся как «спросил его», поскольку далее следует прямой вопрос. Местоимение «его» сохранено без подстановки имени Иисуса.
- source_word: Πῶς δύναται
  choice: Как ... может
  rationale: Передаёт вопрос о возможности или способе осуществления, сохраняя модальное значение δύναται.
- source_word: ταῦτα
  choice: это
  rationale: Русское собирательное «это» естественно отсылает ко всему сказанному ранее; буквальное «эти вещи» в данном контексте звучало бы неестественно.
- source_word: γενέσθαι
  choice: произойти
  rationale: Передаёт событийное значение γίνομαι — осуществиться, случиться, стать действительностью — без излишнего истолкования.
theological_decisions:
- issue: Характер вопроса Никодима о ранее описанных реалиях
  choice: Как это может произойти?
  alternative: Как это может быть?
  rationale: «Произойти» сохраняет смысл осуществления или наступления, а не объясняет механизм нового рождения. Более широкое «быть» возможно и отмечено в сноске, чтобы не устранять подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая и естественная реплика. Традиционное повествовательное «ответил и сказал» сглажено до контекстуально точного «спросил», при сохранении адресата и вопросительной силы оригинала.
