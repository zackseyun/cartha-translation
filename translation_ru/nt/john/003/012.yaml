  text: εἰ τὰ ἐπίγεια εἶπον ὑμῖν καὶ οὐ πιστεύετε, πῶς ἐὰν εἴπω ὑμῖν τὰ ἐπουράνια πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/012.yaml
  text: If I told you about earthly things and you do not believe[b][a], how will you believe if I tell you about heavenly things?
translation:
  language: ru
  text: Если Я сказал вам о земном[a], а вы не верите, как поверите, если скажу вам о небесном[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о том, что на земле».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «о том, что на небе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἐπίγεια
  choice: о земном
  rationale: Субстантивированное прилагательное среднего рода во множественном числе обозначает земные реалии или предметы речи. Русское «о земном» естественно звучит и сохраняет широкий смысл и прямое противопоставление небесному.
- source_word: εἶπον
  choice: сказал
  rationale: Аорист λέγω указывает на предшествующие слова Иисуса. Совершенный вид «сказал» близко передаёт греческую форму и естественно сочетается с «вам».
- source_word: οὐ πιστεύετε
  choice: а вы не верите
  rationale: Настоящее время выражает фактическую нынешнюю реакцию слушателей. Союз καί в данном контексте естественно передан противительным «а», не изменяющим смысла.
- source_word: πῶς ... πιστεύσετε
  choice: как поверите
  rationale: Сохранены вопросительное «как» и будущее время греческого текста; риторический вопрос не усилен более толковательным «как сможете поверить».
- source_word: ἐὰν εἴπω
  choice: если скажу
  rationale: Условная конструкция с аористом сослагательного наклонения относится к возможному будущему сообщению; русский совершенный вид будущего времени передаёт это естественно.
- source_word: τὰ ἐπουράνια
  choice: о небесном
  rationale: Субстантивированное прилагательное обозначает небесные реалии или предметы речи. «О небесном» сохраняет лексическое и смысловое противопоставление выражению «о земном», не уточняя его сверх текста.
theological_decisions:
- issue: Смысл противопоставления земного и небесного
  choice: Передать обе категории широко как «земное» и «небесное», не уточняя, идёт ли речь о земных образах, происходящем на земле или различных уровнях откровения.
  alternative: Истолковать «земное» как наглядные примеры из земной жизни, а «небесное» — как более глубокие божественные тайны.
  rationale: Сам стих устанавливает контраст, но не определяет его точные границы. Широкая формулировка сохраняет подлинную смысловую и богословскую открытость текста.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным и понятным синтаксисом. Повтор «сказал / скажу» и параллель «о земном / о небесном» сохраняют структуру и риторическую силу оригинала.
