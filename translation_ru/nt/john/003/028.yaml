  text: αὐτοὶ ὑμεῖς ⸀μοι μαρτυρεῖτε ὅτι ⸀εἶπον· Οὐκ εἰμὶ ἐγὼ ὁ χριστός, ἀλλ’ ὅτι Ἀπεσταλμένος εἰμὶ ἔμπροσθεν ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/028.yaml
  text: You yourselves bear me witness that I said[a], ‘I am not the Messiah[b], but I have been sent ahead of him.’
translation:
  language: ru
  text: 'Вы сами свидетельствуете, что я сказал: «Не я Мессия[a], но я послан перед Ним[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос».'
    reason: Лексическая альтернатива для титула ὁ χριστός.
  - marker: b
    text: 'Или: «был послан перед Ним»; также возможно: «послан впереди Него».'
    reason: Перифрастическая конструкция может подчёркивать совершившееся послание либо нынешний статус посланного; ἔμπροσθεν допускает передачу «перед» или «впереди».
lexical_decisions:
- source_word: αὐτοὶ ὑμεῖς
  choice: Вы сами
  rationale: Эмфатическое сочетание естественно передаётся по-русски словами «вы сами», подчёркивающими, что свидетелями являются сами слушатели.
- source_word: μοι μαρτυρεῖτε
  choice: свидетельствуете обо мне
  rationale: Дательный μοι при μαρτυρεῖτε обозначает лицо, в пользу которого даётся свидетельство; «свидетельствуете обо мне» ясно и естественно для современного русского языка.
- source_word: εἶπον
  choice: я сказал
  rationale: Аорист указывает на прежнее конкретное высказывание Иоанна и естественно передаётся прошедшим временем.
- source_word: ὁ χριστός
  choice: Мессия
  rationale: Здесь Χριστός употреблено как титул ожидаемого Помазанника; «Мессия» передаёт это значение непосредственно.
- source_word: Ἀπεσταλμένος εἰμὶ
  choice: я послан
  rationale: Перифрастическая конструкция с причастием перфекта подчёркивает нынешнее положение Иоанна как посланного вследствие совершившегося послания. Русское «я послан» сохраняет и результат, и продолжающийся статус без неестественной тяжеловесности.
- source_word: ἔμπροσθεν ἐκείνου
  choice: перед Ним
  rationale: Оборот обозначает предшествующую, подготовительную миссию. «Перед Ним» сохраняет допустимую пространственно-временную образность оригинала и не разъясняет её сверх текста.
theological_decisions:
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Иоанн отрицает, что он является ожидаемым Помазанником, поэтому «Мессия» ясно передаёт титульное значение; традиционное «Христос» отмечено как допустимый вариант.
- issue: Смысл Ἀπεσταλμένος εἰμὶ
  choice: я послан перед Ним
  alternative: я был послан перед Ним / я был послан впереди Него
  rationale: Формулировка сохраняет совершившееся послание и нынешний статус Иоанна, а также его предшествующую роль, не добавляя утверждений о точном характере этой миссии.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Порядок «Не я Мессия» сохраняет контрастное ударение греческого Οὐκ εἰμὶ ἐγὼ ὁ χριστός. Местоимение «Ним» написано с прописной буквы согласно распространённой русской библейской издательской норме.
