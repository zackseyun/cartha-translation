source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἀναβέβηκεν εἰς τὸν οὐρανὸν εἰ μὴ ὁ ἐκ τοῦ οὐρανοῦ καταβάς, ὁ υἱὸς τοῦ ⸀ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/013.yaml
  text: And no one has ascended into heaven except the one who descended from heaven—the Son of Man[a][b].
translation:
  language: ru
  text: И никто не восходил на небо, кроме Того, Кто сошёл с неба, — Сына Человеческого[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Того, Кто спустился с неба».'
    reason: lexical_alternative
  - marker: b
    text: «Сын Человеческий» — характерное самообозначение Иисуса, перекликающееся с Дан 7:13–14.
    reason: cross_reference
lexical_decisions:
- source_word: οὐδεὶς
  choice: никто
  rationale: Естественный современный эквивалент отрицательного местоимения, не сужающий круг лиц.
- source_word: ἀναβέβηκεν
  choice: не восходил
  rationale: Глагол «восходить» сохраняет возвышенный регистр и прямую лексическую противоположность последующему «сошёл»; русская форма прошедшего времени в данном отрицательном утверждении естественно передаёт результативную силу греческого перфекта.
- source_word: εἰς τὸν οὐρανόν
  choice: на небо
  rationale: Нормальное русское выражение направления движения; буквальное «в небо» здесь менее естественно и может восприниматься как движение лишь в воздушное пространство.
- source_word: εἰ μὴ
  choice: кроме
  rationale: Ясно выражает единственное исключение после общего отрицания.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: Того, Кто сошёл с неба
  rationale: Передаёт субстантивированное причастие, небесное происхождение и контраст «восходил — сошёл»; прописные буквы соответствуют личному христологическому референту в русском библейском регистре.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сына Человеческого
  rationale: Сохраняет устоявшееся евангельское самообозначение Иисуса и связь с Дан 7:13–14, не сводя выражение к общему обозначению человека.
theological_decisions:
- issue: Христологическое значение выражения «Сын Человеческий»
  choice: Передать как признанное титульное выражение «Сын Человеческий» без поясняющего перифраза.
  alternative: Человек; Человеческий Сын
  rationale: Традиционная форма сохраняет одновременно семитский оборот, евангельское употребление и апокалиптический отзвук Дан 7, не устраняя смыслового напряжения.
- issue: Временной и аспектуальный смысл образов восхождения и нисхождения
  choice: «не восходил … сошёл»
  alternative: «не поднимался … пришёл с неба»
  rationale: Формулировка сохраняет утверждение об уникальном небесном происхождении и доступе Сына Человеческого, не добавляя доктринального истолкования сверх греческого текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис следует греческому противопоставлению восхождения и нисхождения, но остаётся естественным для русского читателя.
