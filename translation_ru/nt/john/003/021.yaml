base_translation:
  language: en
  yaml_path: translation/nt/john/003/021.yaml
  text: But the one who does the truth comes to the light[a], so that his works may be revealed[d][c][b], because they have been done in God.
translation:
  language: ru
  text: А тот, кто поступает по истине[a], идёт к свету, чтобы его дела стали явными, потому что они совершены в Боге[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «делает истину»; также возможно: «исполняет истину» или «делает то, что истинно».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «чтобы его дела стали явными, чтобы было видно, что они совершены в Боге». Выражение «в Боге» может также пониматься как «Богом» или «через Бога», однако греческая формулировка менее определённа.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ ποιῶν τὴν ἀλήθειαν
  choice: А тот, кто поступает по истине
  rationale: δέ передаёт мягкое противопоставление предыдущему стиху. Субстантивированное причастие обозначает человека, для которого это действие характерно. Русское «поступает по истине» сохраняет связь истины с образом жизни и звучит естественнее буквального «делает истину».
- source_word: ἔρχεται πρὸς τὸ φῶς
  choice: идёт к свету
  rationale: πρός при глаголе движения означает направленность к свету; «к свету» сохраняет образ приближения, не заменяя его более истолковывающим «выходит на свет».
- source_word: ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα
  choice: чтобы стало явным, что его дела
  rationale: ἵνα передаёт цель, а пассивное φανερωθῇ — обнаружение или явление. Конструкция с придаточным содержательным естественна по-русски и позволяет связать ὅτι с тем, что становится явным.
- source_word: ὅτι
  choice: что
  rationale: 'ὅτι понято как союз, вводящий содержание открывающегося: становится явным, что дела совершены в Боге. Возможное причинное значение «потому что» отмечено в сноске.'
- source_word: ἐν θεῷ
  choice: в Боге
  rationale: Формальная передача ἐν сохраняет открытость выражения относительно сферы, отношения и Божьего действия, не сводя его однозначно к «Богом» или «через Бога».
- source_word: ἐστιν εἰργασμένα
  choice: совершены
  rationale: Перифрастический перфект выражает завершённость с сохраняющимся результатом. Краткое страдательное причастие «совершены» естественно передаёт пассивную и результативную окраску.
theological_decisions:
- issue: Значение ποιῶν τὴν ἀλήθειαν
  choice: поступает по истине
  alternative: делает истину; исполняет истину; делает то, что истинно
  rationale: Выражение обозначает истину, воплощаемую в поступках. Буквальная калька в современном русском неестественна, а «делает то, что истинно» чрезмерно сужает смысл до правильности отдельных действий.
- issue: Синтаксическая функция ὅτι
  choice: вводит содержание того, что становится явным
  alternative: 'вводит причину: «потому что они совершены в Боге»'
  rationale: Оба разбора грамматически возможны. Основной текст выбирает естественную связь с φανερωθῇ, а сноска сохраняет альтернативу.
- issue: Смысл ἐν θεῷ
  choice: в Боге
  alternative: Богом; через Бога
  rationale: Исходное выражение допускает оттенки сферы, отношения и действующей силы. Более конкретная передача преждевременно разрешила бы богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Необычная греческая идиома передана естественным русским выражением с буквальным вариантом в сноске; неоднозначность ὅτι и ἐν θεῷ сохранена.
