  verdict: approve
  source_fidelity: 'Перевод точно передаёт основную синтаксическую и смысловую структуру греческого текста: обобщённое «человек» для ἄνθρωπος, невозможность получения, усиленное отрицание οὐδὲ ἕν через «ничего», условие ἐὰν μὴ и небесный источник ἐκ τοῦ οὐρανοῦ. «Дано» адекватно передаёт результативный пассив δεδομένον. Сведение формулы «ответил и сказал» к «ответил» естественно для русского повествования и не меняет смысла.'
  naturalness: 'Текст звучит как современный литературный русский: кратко, ясно и с уместным библейским достоинством. Конструкция «ничего, если это не дано ему с небес» естественна. «С небес» сохраняет образ оригинала и хорошо соответствует регистру.'
  terminology: «Человек» удачно сохраняет общий, не ограниченный мужским полом смысл ἄνθρωπος. «С небес» не подменяет исходное выражение догматическим «от Бога» и сохраняет свойственную Иоанну непрямоту. Богословская широта высказывания не сужена до служения Иоанна и не истолкована детерминистически.
