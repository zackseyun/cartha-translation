  text: ἀπεκρίθη Ἰωάννης καὶ εἶπεν· Οὐ δύναται ἄνθρωπος λαμβάνειν ⸂οὐδὲ ἓν⸃ ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/027.yaml
  text: John answered and said[a], “A man is not able to receive even one thing unless it has been given to him from heaven.”
translation:
  language: ru
  text: 'Иоанн ответил: «Человек не может получить ничего, если это не дано ему с небес».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Ἰωάννης καὶ εἶπεν
  choice: Иоанн ответил
  rationale: Русское «ответил» естественно передаёт устойчивую греческую формулу ответа; буквальное «ответил и сказал» в современном русском звучит избыточно.
- source_word: Οὐ δύναται
  choice: не может
  rationale: Прямо и естественно передаёт значение неспособности или невозможности.
- source_word: ἄνθρωπος
  choice: человек
  rationale: Сохраняет единственное число и обобщённый, относящийся ко всякому человеку смысл без гендерного сужения.
- source_word: λαμβάνειν οὐδὲ ἓν
  choice: получить ничего
  rationale: В контексте речь идёт о получении дарованного, а не о присвоении; отрицательное местоимение естественно передаёт усиленное отрицание οὐδὲ ἓν по-русски.
- source_word: ἐὰν μὴ
  choice: если ... не
  rationale: Естественная русская конструкция условия-исключения, соответствующая греческому выражению.
- source_word: ᾖ δεδομένον αὐτῷ
  choice: это не дано ему
  rationale: Передаёт результативное состояние перфектного пассива; указательное «это» соотносится с тем, что человек получает.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: с небес
  rationale: Сохраняет образ небесного, то есть божественного, источника, не заменяя его истолкованием «от Бога».
theological_decisions:
- issue: Объём утверждения о небесном источнике
  choice: 'Сохранено широкое утверждение: человек ничего не может получить, если это не дано с небес.'
  alternative: Ограничить смысл только служением, положением или духовной властью в непосредственном контексте.
  rationale: Контекст связывает слова со служением Иоанна и возрастающей известностью Иисуса, однако сама формулировка шире. Перевод сохраняет эту широту, не превращая стих в развёрнутое учение о детерминизме и не отрицая человеческую деятельность.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Устойчивая греческая формула «ответил и сказал» свёрнута до естественного русского «ответил». «С небес» сохраняет библейский образ и не устраняет его богословскую непрямоту.
