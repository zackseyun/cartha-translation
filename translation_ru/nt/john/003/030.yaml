  text: ἐκεῖνον δεῖ αὐξάνειν, ἐμὲ δὲ ἐλαττοῦσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/030.yaml
  text: He must increase[a], but I must decrease.
translation:
  language: ru
  text: Ему надлежит возрастать[a], а мне — умаляться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ему должно становиться больше, а мне — меньше».'
    reason: Более буквальная лексическая альтернатива, раскрывающая противопоставление αὐξάνειν и ἐλαττοῦσθαι.
lexical_decisions:
- source_word: ἐκεῖνον
  choice: Ему
  rationale: В конструкции с δεῖ винительный обозначает логический субъект инфинитива. Русская безличная конструкция «Ему надлежит…» естественно передаёт это значение; местоимение указывает на Иисуса из ближайшего контекста.
- source_word: δεῖ
  choice: надлежит
  rationale: Передаёт необходимость и уместный высокий регистр, не уточняя сверх текста, идёт ли речь о прямом постановлении, исторической неизбежности или должном порядке.
- source_word: αὐξάνειν
  choice: возрастать
  rationale: Сохраняет широкое и продолжающееся значение увеличения, возвышения и роста влияния, а также ёмкий параллелизм высказывания.
- source_word: ἐμὲ
  choice: мне
  rationale: В параллельной безличной конструкции дательный естественно обозначает того, кому надлежит умаляться.
- source_word: δὲ
  choice: а
  rationale: Русский союз «а» ясно и естественно выражает сопоставительный контраст между Иисусом и Иоанном, не делая его излишне резким.
- source_word: ἐλαττοῦσθαι
  choice: умаляться
  rationale: Передаёт процесс становления меньшим и сохраняет краткий, афористичный параллелизм с «возрастать».
theological_decisions:
- issue: Характер необходимости, выраженной δεῖ
  choice: Необходимость передана словом «надлежит» без дальнейшего пояснения её природы.
  alternative: «должен»; либо развёрнутое указание на Божье предопределение
  rationale: В контексте возможен оттенок установленного Богом порядка, однако сам стих не определяет механизм этой необходимости. Перевод сохраняет богословскую весомость и не снимает неоднозначность.
translation_notes:
  register: Современный литературный русский с кратким, достойным и афористичным звучанием. Формы «возрастать» и «умаляться» слегка возвышенны, но понятны обычному читателю и уместны в данном торжественном высказывании.
