id: JHN.3.4
reference: John 3:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ⸀ὁ Νικόδημος· Πῶς δύναται ἄνθρωπος γεννηθῆναι γέρων ὤν; μὴ δύναται εἰς τὴν κοιλίαν τῆς μητρὸς αὐτοῦ δεύτερον εἰσελθεῖν καὶ γεννηθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/004.yaml
  text: Nicodemus said to him[a], “How can a man be born when he is old? He cannot enter his mother’s womb a second time and be born[b], can he?”
translation:
  language: ru
  text: 'Никодим сказал ему: «Как может человек родиться, если он уже стар? Разве может он во второй раз войти в утробу своей матери и родиться?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει πρὸς αὐτὸν
  choice: сказал ему
  rationale: Настоящее время здесь выполняет функцию исторического настоящего, характерного для повествования Иоанна; прошедшее время естественно передаёт эту функцию по-русски.
- source_word: ἄνθρωπος
  choice: человек
  rationale: Русское «человек» точно передаёт родовое значение существительного и не ограничивает смысл только мужчинами.
- source_word: γεννηθῆναι
  choice: родиться
  rationale: В данном контексте пассивный инфинитив γεννάω обозначает рождение; добавлять «снова» к самому глаголу не следует, поскольку далее прямо стоит δεύτερον.
- source_word: γέρων ὤν
  choice: будучи старым
  rationale: Оборот сохраняет обстоятельственное значение причастной конструкции и звучит ясно и достойно в современном русском языке.
- source_word: μὴ δύναται
  choice: неужели он может
  rationale: Частица μή вводит вопрос, предполагающий отрицательный ответ; «неужели» естественно выражает недоверие Никодима и ожидаемое «нет».
- source_word: κοιλίαν τῆς μητρὸς αὐτοῦ
  choice: утробу своей матери
  rationale: В сочетании с упоминанием матери κοιλία означает материнскую утробу; возвратное «своей» естественно соотносит мать с подлежащим.
- source_word: δεύτερον
  choice: во второй раз
  rationale: Передаёт прямое значение δεύτερον и подчёркивает буквальное понимание Никодимом слов Иисуса.
- source_word: εἰσελθεῖν καὶ γεννηθῆναι
  choice: войти … и родиться
  rationale: Оба инфинитива сохранены, чтобы передать образность и последовательность, присутствующие в вопросе Никодима.
theological_decisions:
- issue: Родовое значение ἄνθρωπος
  choice: человек
  alternative: мужчина
  rationale: В греческом употреблена форма мужского рода с общим значением. Русское «человек» сохраняет единственное число и родовой смысл без неоправданного ограничения только мужским полом.
- issue: Связь с двусмысленным ἄνωθεν в Ин 3:3
  choice: родиться … во второй раз
  alternative: родиться снова
  rationale: В этом стихе прямо употреблено δεύτερον — «во второй раз». Такой перевод сохраняет буквальное истолкование Никодима и не переносит в этот глагол спорные оттенки ἄνωθεν из предыдущего стиха.
translation_notes:
  register: Современный литературный русский язык; речь Никодима передана ясно, естественно и с сохранением его недоверчивого, буквально понимающего вопроса.
