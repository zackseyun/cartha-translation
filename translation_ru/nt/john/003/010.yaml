base_translation:
  language: en
  yaml_path: translation/nt/john/003/010.yaml
  text: Jesus answered and said to him[a], “You are the teacher of Israel, and you do not know these things?”
translation:
  language: ru
  text: 'Иисус ответил ему: «Ты — учитель Израиля и не знаешь этого?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты — этот учитель Израиля». В греческом тексте стоит «учитель» с определённым артиклем; это может придавать обращению подчёркнутую, риторически заострённую силу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Иисус ответил ему
  rationale: Греческая формула буквально содержит два глагола — «ответил и сказал ему», однако в современном русском естественно передаётся одним глаголом «ответил» с сохранением адресата.
- source_word: Σὺ
  choice: Ты
  rationale: Явно выраженное местоимение передано и поставлено в начале реплики, чтобы сохранить эмфатическое противопоставление.
- source_word: ὁ διδάσκαλος τοῦ Ἰσραὴλ
  choice: учитель Израиля
  rationale: Сочетание передаёт определённый, представительный статус Никодима. В русском отсутствие артикля не позволяет формально воспроизвести определённость, поэтому её риторическая сила поддержана конструкцией «Ты — учитель Израиля».
- source_word: ταῦτα
  choice: этого
  rationale: Русское единственное число естественно обозначает всё только что сказанное как совокупность; вариант «этих вещей» был бы менее литературным, а «этого» сохраняет широту отсылки.
- source_word: οὐ γινώσκεις
  choice: не знаешь
  rationale: «Не знаешь» лексически прозрачно передаёт γινώσκεις и в контексте включает смысл непонимания.
theological_decisions:
- issue: Определённая сила обращения ὁ διδάσκαλος τοῦ Ἰσραήλ
  choice: «учитель Израиля» с пояснением определённости в сноске
  alternative: «один из учителей Израиля» / «учитель в Израиле»
  rationale: 'Греческий артикль придаёт обращению заострённую риторическую силу: Никодим назван признанным учителем Израиля, а не просто одним из многих. Русский основной текст сохраняет естественность, а сноска обозначает подлинную смысловую особенность оригинала.'
translation_notes:
  register: Современный литературный русский язык; краткая и достоинственная реплика. Двуглагольная греческая повествовательная формула сведена к естественному русскому «ответил», а тире после «Ты» подчёркивает явное местоимение и резкость вопроса.
