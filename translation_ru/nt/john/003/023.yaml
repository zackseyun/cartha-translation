  yaml_path: translation/nt/john/003/023.yaml
  text: John also was baptizing at Aenon near Salim[a], because there were many waters there[b], and people were coming and being baptized.
translation:
  language: ru
  text: Иоанн также крестил[a] в Еноне, недалеко от Салима, потому что там было много воды[b], и люди приходили, и их крестили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол, переведённый как «крестил», можно также передать как «погружал». Здесь сохранён устоявшийся термин «крестил», который сам по себе не определяет способ совершения крещения.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «там было много вод».'
    reason: literal_rendering
lexical_decisions:
- source_word: ἦν δὲ καὶ
  choice: Также и … крестил
  rationale: δέ обозначает мягкий переход, а καί добавляет деятельность Иоанна к описанной в контексте деятельности Иисуса. Сочетание ἦν с причастием βαπτίζων передаёт продолжавшееся действие в прошлом; по-русски это естественно выражается глаголом несовершенного вида «крестил».
- source_word: ὁ Ἰωάννης
  choice: Иоанн
  rationale: Артикль при имени собственном отдельно не передаётся. Уточнение «Креститель» в греческом тексте отсутствует и поэтому не добавляется.
- source_word: βαπτίζων
  choice: крестил
  rationale: Выбран традиционный и общепонятный русский термин. Он сохраняет связь с новозаветным понятием крещения и сам по себе не решает вопрос о способе совершения обряда.
- source_word: ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ
  choice: в Еноне, недалеко от Салима
  rationale: Предлог ἐν обозначает место, а ἐγγύς с родительным — близость. Имена переданы в сложившейся русской библейской форме.
- source_word: ὅτι ὕδατα πολλὰ ἦν ἐκεῖ
  choice: потому что там было много воды
  rationale: ὅτι имеет причинное значение. Буквальное множественное число «многие воды» по-русски здесь неестественно; «много воды» точно и ясно передаёт смысл, а буквальная форма отмечена в сноске.
- source_word: παρεγίνοντο
  choice: люди приходили
  rationale: Имперфект передаёт продолжавшееся или повторявшееся действие. Подлежащее «люди» естественно восполняется по смыслу из формы множественного числа и делает русскую фразу ясной.
- source_word: ἐβαπτίζοντο
  choice: принимали крещение
  rationale: Имперфект пассивного залога указывает на неоднократное принятие крещения. «Принимали крещение» яснее сохраняет пассивный смысл, чем потенциально двусмысленное «крестились».
theological_decisions:
- issue: Передача βαπτίζω
  choice: крестил / принимали крещение
  alternative: погружал / были погружаемы
  rationale: В новозаветном контексте глагол служит устоявшимся религиозным термином. Традиционная русская передача не навязывает конфессионального вывода о способе крещения; возможность значения, связанного с погружением, указана в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Синтаксис простой и ясный; архаизмы и конфессионально окрашенные уточнения не добавляются.
