    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: был
  rationale: δέ служит мягким повествовательным переходом; в русском отдельный союз не требуется, а конструкция с «был» естественно вводит нового участника.
- source_word: ἄνθρωπος
  choice: человек
  rationale: В данном контексте речь идёт о конкретном мужчине; русское «человек» естественно в вводной конструкции и точно передаёт существительное.
- source_word: ἐκ τῶν Φαρισαίων
  choice: среди фарисеев
  rationale: ἐκ с родительным указывает на принадлежность к группе; «среди фарисеев» естественно сообщает, что Никодим принадлежал к этому течению.
- source_word: Νικόδημος ὄνομα αὐτῷ
  choice: по имени Никодим
  rationale: Естественная русская передача греческого оборота называния без сохранения чуждой русскому синтаксису формы.
- source_word: ἄρχων
  choice: один из начальников
  rationale: ἄρχων обозначает человека, обладающего властью. «Один из начальников» естественно выражает его положение в составе иудейского руководства, не уточняя без основания конкретную должность.
- source_word: τῶν Ἰουδαίων
  choice: иудеев
  rationale: Термин может обозначать иудеев в целом, жителей Иудеи или иудейские власти; при ἄρχων здесь прежде всего выражена принадлежность Никодима к иудейскому руководству, а неоднозначность отмечена в сноске.
theological_decisions:
- issue: Значение Ἰουδαίων в контексте Евангелия от Иоанна
  choice: иудеев
  alternative: жителей Иудеи; иудейских властей
  rationale: Широкий традиционно понятный эквивалент сохраняет этнорелигиозный смысл и не сводит слово исключительно к географии или к властям. Возможные более узкие значения указаны в сноске.
translation_notes:
  register: Современный литературный русский язык; синтаксис естественный и ясный, при этом сохранены достоинство повествования и неоднозначность термина Ἰουδαίων.
