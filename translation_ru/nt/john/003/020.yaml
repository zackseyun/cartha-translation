id: JHN.3.20
reference: John 3:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ φαῦλα πράσσων μισεῖ τὸ φῶς καὶ οὐκ ἔρχεται πρὸς τὸ φῶς, ἵνα μὴ ἐλεγχθῇ τὰ ἔργα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/020.yaml
  text: For everyone who practices evil hates the light and does not come to the light[b][a], lest his works be exposed.
translation:
  language: ru
  text: Ведь всякий, кто делает зло, ненавидит свет и не идёт к свету, чтобы его дела[b] не были обличены[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разоблачены», «уличены». Греческий глагол может означать выведение неправды на свет, доказательство вины или обличение.'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте употреблена обобщающая форма мужского рода в единственном числе; речь идёт о любом человеке, который делает зло.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ὁ
  choice: Ведь всякий, кто
  rationale: «Ведь» передаёт пояснительное γάρ и связывает стих с предыдущим утверждением; «всякий, кто» естественно выражает обобщающую конструкцию πᾶς с субстантивированным причастием.
- source_word: φαῦλα πράσσων
  choice: делает зло
  rationale: φαῦλα имеет здесь нравственный смысл, а настоящее причастие описывает характерное поведение. Русское «делает зло» сохраняет нравственную силу выражения и звучит естественно, не сводя смысл к отдельному проступку.
- source_word: μισεῖ τὸ φῶς
  choice: ненавидит свет
  rationale: Прямой перевод сохраняет резкость μισεῖ и ключевой для Иоанна образ света как Божьего откровения и истины.
- source_word: οὐκ ἔρχεται πρὸς τὸ φῶς
  choice: не идёт к свету
  rationale: Выражение сохраняет простую пространственную метафору движения к свету; в данном русском контексте «идёт к свету» естественнее буквального «приходит к свету».
- source_word: ἵνα μὴ
  choice: чтобы … не
  rationale: 'В контексте конструкция выражает цель избегания: человек не идёт к свету, стремясь не допустить обнаружения своих дел.'
- source_word: ἐλεγχθῇ
  choice: не были обличены
  rationale: «Обличены» передаёт смысл выявления неправоты и в то же время сохраняет возможность оттенков уличения и порицания, не сужая глагол до чисто судебного значения.
- source_word: τὰ ἔργα αὐτοῦ
  choice: его дела
  rationale: «Дела» естественно передаёт ἔργα и сохраняет словесную связь с поступками; «его» отражает единственное число обобщающей мужской конструкции греческого текста.
theological_decisions:
- issue: Значение ἐλεγχθῇ в образе света
  choice: были обличены
  alternative: были разоблачены; были уличены; обнаружились
  rationale: Контекст говорит прежде всего о свете, выявляющем нравственную сущность дел. «Обличены» сохраняет напряжение между обнаружением зла, доказательством вины и нравственным укором, не превращая фразу исключительно в судебный приговор.
- issue: Обобщающая форма мужского рода
  choice: всякий, кто … его дела
  alternative: все, кто … их дела
  rationale: Греческий текст последовательно использует единственное число и обобщающую форму мужского рода. Русская конструкция «всякий, кто» естественно сохраняет это число и относится к любому человеку, а не только к мужчинам.
translation_notes:
  register: Современный литературный русский язык с простой, торжественно-сдержанной фразой. Сохранены ключевой образ света, нравственная сила слова «зло» и смысл намеренного избегания разоблачения. «Обличены» слегка возвышенно, но понятно современному читателю и уместно в библейском контексте.
