id: JHN.3.17
reference: John 3:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλεν ὁ θεὸς τὸν ⸀υἱὸν εἰς τὸν κόσμον ἵνα κρίνῃ τὸν κόσμον, ἀλλ’ ἵνα σωθῇ ὁ κόσμος δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/017.yaml
  text: For God did not send the Son into the world so that he might judge the world[a], but so that the world might be saved through him.
translation:
  language: ru
  text: Ведь Бог послал Сына в мир не для того, чтобы Он судил мир[a], но чтобы мир был спасён через Него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осудил мир». В этом контексте греческий глагол может иметь более узкое значение, однако его основное значение — «судить».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Ведь ... не
  rationale: Частица γάρ поясняет предыдущее утверждение; «ведь» естественно передаёт эту связь в современном русском, а «не» отрицает цель послания.
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Прямой и естественный эквивалент, сохраняющий характерную для Иоанна тему послания Сына Отцом без дополнительного уточнения характера поручения.
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Определённый артикль при θεός по-русски здесь не выражается отдельно.
- source_word: τὸν υἱὸν
  choice: Сына
  rationale: В греческом тексте нет явного притяжательного местоимения; форма «Сына» сохраняет титульное значение и не добавляет «Своего».
- source_word: εἰς τὸν κόσμον
  choice: в мир
  rationale: εἰς с винительным падежом обозначает движение в мир; русский оборот «послал ... в мир» передаёт это прямо и естественно.
- source_word: ἵνα κρίνῃ τὸν κόσμον
  choice: для того, чтобы Он судил мир
  rationale: κρίνω имеет основное широкое значение «судить», а не только «осудить». Конструкция «для того, чтобы» ясно выражает цель, заложенную в ἵνα с сослагательным наклонением.
- source_word: ἀλλ’ ἵνα
  choice: но чтобы
  rationale: Передаёт резкое противопоставление двух целей и сохраняет параллелизм, не утяжеляя русскую фразу повтором.
- source_word: σωθῇ
  choice: был спасён
  rationale: Страдательный аорист сослагательного наклонения от σῴζω передан формой, сохраняющей пассивность и широкое богословское значение спасения.
- source_word: ὁ κόσμος
  choice: мир
  rationale: Последовательный перевод κόσμος словом «мир» сохраняет повтор и свойственную Евангелию от Иоанна смысловую широту, не сводя понятие только к человечеству.
- source_word: δι’ αὐτοῦ
  choice: через Него
  rationale: διά с родительным падежом обозначает средство или посредничество; «через Него» естественно передаёт эту функцию, не сужая её до простой причинности.
theological_decisions:
- issue: Значение κρίνῃ в противопоставлении σωθῇ
  choice: судил
  alternative: осудил
  rationale: 'Хотя контекст допускает более узкое понимание «осудил», у κρίνω основное значение шире — «судить». Такой перевод сохраняет лексическую и богословскую напряжённость: речь идёт не об отрицании всякого суда вообще, а о цели послания Сына, противопоставленной спасению мира. Узкий контекстуальный вариант дан в сноске.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. «Ведь» естественно связывает стих с предыдущим высказыванием. Местоимения, относящиеся к Сыну, написаны с прописной буквы по устойчивой русской библейской издательской норме; это не меняет смысла исходного текста.
