id: JHN.3.14
reference: John 3:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ καθὼς Μωϋσῆς ὕψωσεν τὸν ὄφιν ἐν τῇ ἐρήμῳ, οὕτως ὑψωθῆναι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου,
base_translation:
  language: en
  yaml_path: translation/nt/john/003/014.yaml
  text: And just as Moses lifted up the serpent in the wilderness[a], so the Son of Man must be lifted up[b],
translation:
  language: ru
  text: И как Моисей поднял змея в пустыне[b], так и Сын Человеческий должен быть поднят[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возвышен». Греческий глагол может означать как физическое поднятие, так и возвышение, прославление; вероятно, здесь подразумеваются оба смысла.'
    reason: lexical_alternative
  - marker: b
    text: См. Числа 21:8–9 — рассказ о том, как Моисей поднял змея в пустыне.
    reason: cross_reference
lexical_decisions:
- source_word: καθὼς … οὕτως
  choice: как … так и
  rationale: Естественная русская соотносительная конструкция ясно передаёт сопоставление между действием Моисея и тем, что должно произойти с Сыном Человеческим.
- source_word: ὕψωσεν / ὑψωθῆναι
  choice: поднял / должен быть поднят
  rationale: Повтор одного корня сохраняет прямую связь между двумя частями сравнения. «Поднят» передаёт физическое поднятие и не исключает дополнительного смысла возвышения или прославления.
- source_word: τὸν ὄφιν
  choice: змея
  rationale: Литературное и понятное обозначение, соответствующее ветхозаветному повествованию; уточнение «медного» не добавляется, поскольку его нет в греческом тексте этого стиха.
- source_word: ἐν τῇ ἐρήμῳ
  choice: в пустыне
  rationale: Точное и естественное обозначение места странствий Израиля.
- source_word: δεῖ
  choice: должен
  rationale: Передаёт необходимость, выраженную греческим δεῖ, а не только предсказание будущего события.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Сохраняет устойчивое библейское наименование и связанные с ним смысловые отголоски, не заменяя его толкованием.
theological_decisions:
- issue: Двойной смысл ὑψόω в Евангелии от Иоанна
  choice: В обоих случаях употребить «поднять», а дополнительный смысл отметить в сноске.
  alternative: «вознести» или «прославить»
  rationale: Основной текст сохраняет конкретную связь с поднятым змеем и одновременно не сводит участь Сына Человеческого лишь к физическому действию. Перевод «прославить» устранил бы образ распятия, а «вознести» мог бы быть ошибочно понят только как вознесение на небо.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Порядок слов перестроен ради естественной русской фразы; «так и» отчётливо сохраняет параллель. Маркеры сносок поставлены рядом с теми выражениями, которые они поясняют.
