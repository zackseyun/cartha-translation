  text: τὸ γεγεννημένον ἐκ τῆς σαρκὸς σάρξ ἐστιν, καὶ τὸ γεγεννημένον ἐκ τοῦ πνεύματος πνεῦμά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/006.yaml
  text: What is born of the flesh is flesh[b][a], and what is born of the Spirit is spirit.
translation:
  language: ru
  text: Рождённое от плоти есть плоть, а рождённое от Духа есть дух.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рождённое от Духа духовно». Греческий текст буквально говорит: «есть дух», подчёркивая качественный контраст с «плотью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γεγεννημένον
  choice: рождённое
  rationale: Субстантивированное причастие среднего рода имеет обобщающий смысл. «Рождённое» естественно передаёт категориальное утверждение и сохраняет параллелизм обеих частей.
- source_word: ἐκ
  choice: от
  rationale: В сочетании с глаголом рождения «от» естественно выражает источник или происхождение.
- source_word: σάρξ / σαρκὸς
  choice: плоть
  rationale: «Плоть» сохраняет повтор одного греческого слова и контраст между естественным человеческим рождением и рождением от Духа, не сужая смысл до «греховной природы».
- source_word: πνεύματος
  choice: Духа
  rationale: Артикль и ближайший контекст указывают на Божьего, Святого Духа как источник рождения; прописная буква делает этот референт ясным.
- source_word: πνεῦμα
  choice: дух
  rationale: Безартиклевое сказуемое выражает качество или природу рождённого от Духа. Строчная буква сохраняет различие между Духом как источником и духом как характеристикой результата.
- source_word: ἐστιν
  choice: есть
  rationale: Связка сохранена ради краткой, афористичной и строго параллельной структуры греческого текста.
theological_decisions:
- issue: Смысл σάρξ в первой части
  choice: «плоть» как естественная человеческая сфера происхождения
  alternative: «человеческая природа» или «греховная природа»
  rationale: В данном контексте основной контраст проходит между естественным рождением и рождением от Духа. «Греховная природа» внесла бы более узкое нравственно-богословское толкование, чем требует текст.
- issue: Значение πνεῦμα в сказуемом второй части
  choice: «есть дух» со строчной буквы
  alternative: «есть Дух» или «духовно»
  rationale: Такая передача сохраняет качественный контраст греческих существительных и не отождествляет рождённое с самим Святым Духом. Вариант «духовно» понятнее, но более истолковывающий.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной и афористичной конструкцией. Повторы «рождённое» и «есть» намеренно сохранены для передачи параллелизма оригинала.
