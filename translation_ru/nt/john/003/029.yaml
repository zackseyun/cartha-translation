id: JHN.3.29
reference: John 3:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ ἔχων τὴν νύμφην νυμφίος ἐστίν· ὁ δὲ φίλος τοῦ νυμφίου ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ, χαρᾷ χαίρει διὰ τὴν φωνὴν τοῦ νυμφίου. αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/029.yaml
  text: The one who has the bride is the bridegroom[a]. But the friend of the bridegroom, who stands and hears him, rejoices greatly because of the bridegroom’s voice[c][b]. Therefore this joy of mine has been made complete.
translation:
  language: ru
  text: Тот, у кого есть невеста, — жених. А друг жениха[a], который стоит и слышит его, очень радуется голосу жениха[b]. Поэтому эта моя радость достигла полноты[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «друг жениха». По своей роли он мог напоминать современного шафера, однако греческий текст прямо говорит именно о друге жениха.'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «радуется радостью» — усилительное греческое выражение.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «исполнилась», «стала полной». Греческое слово может означать достижение полноты или завершённости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων τὴν νύμφην
  choice: Тот, у кого есть невеста
  rationale: Субстантивированное причастие передано естественной русской конструкцией; «невеста» сохраняет свадебный образ и непосредственное противопоставление жениху.
- source_word: νυμφίος
  choice: жених
  rationale: Обычное современное русское обозначение мужчины в свадебном образе; последовательно повторяется в стихе.
- source_word: φίλος τοῦ νυμφίου
  choice: друг жениха
  rationale: Формально точно передаёт греческое выражение, не подменяя его культурно более узким понятием «шафер».
- source_word: ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ
  choice: который стоит и слышит его
  rationale: Сохраняет положение ожидающего друга и прямое значение ἀκούω с местоимением в родительном падеже; не добавляет отсутствующего в тексте «рядом».
- source_word: χαρᾷ χαίρει
  choice: очень радуется
  rationale: Однокоренная конструкция усиливает значение глагола; естественное русское усиление передаёт её смысл без тяжеловесного «радуется радостью».
- source_word: διὰ τὴν φωνὴν τοῦ νυμφίου
  choice: радуется голосу жениха
  rationale: Русский дательный после «радоваться» естественно выражает причину радости и сохраняет явное упоминание голоса жениха.
- source_word: αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ
  choice: Поэтому эта моя радость
  rationale: «Поэтому» передаёт вывод οὖν, а сочетание «эта моя радость» сохраняет указательное и личное ударение.
- source_word: πεπλήρωται
  choice: достигла полноты
  rationale: Перфект передаёт достигнутое и сохраняющееся состояние; формулировка выражает доведение радости до полноты, не ограничивая смысл идеей исполнения предсказания.
theological_decisions:
- issue: Свадебный образ и самоопределение Иоанна
  choice: Сохранены образы жениха, невесты и друга жениха без пояснения, кого именно символизирует невеста.
  alternative: Прямо назвать невестой церковь или Божий народ либо передать друга жениха словом «шафер».
  rationale: Сам стих не раскрывает, кого обозначает невеста, и называет Иоанна именно другом жениха; перевод не должен вносить в основной текст последующие богословские выводы.
- issue: Полнота радости
  choice: πεπλήρωται передано как «достигла полноты».
  alternative: «Исполнилась» или «стала совершенной».
  rationale: Выбранная формулировка сохраняет образ наполнения и завершённости, не утверждая здесь непременно исполнение пророчества или нравственное совершенство.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Синтаксис сохраняет последовательность свадебного образа и логический вывод, избегая как архаизмов, так и чрезмерно разговорной передачи.
