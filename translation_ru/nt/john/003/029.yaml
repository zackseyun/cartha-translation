  source_fidelity: 'Русский текст точно передаёт ключевые элементы греческого оригинала: «тот, у кого есть невеста» (ὁ ἔχων τὴν νύμφην), повтор «жених», «друг жениха», стояние и слышание, усиленную радость, причину радости — голос жениха — и результативную полноту радости. «Достигла полноты» удачно выражает итоговое состояние πεπλήρωται, не навязывая значение исполнения пророчества.'
