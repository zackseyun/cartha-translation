  text: μὴ θαυμάσῃς ὅτι εἶπόν σοι Δεῖ ὑμᾶς γεννηθῆναι ἄνωθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/007.yaml
  text: Do not be amazed that I told you[b][a], ‘You must be born from above.’
translation:
  language: ru
  text: 'Не удивляйся тому, что я сказал тебе[b]: «Вам нужно родиться свыше[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родиться заново» (или «снова»). Греческое ἄνωθεν может означать как «свыше», так и «заново, снова».'
    reason: alternative_reading
  - marker: b
    text: В выражении «я сказал тебе» местоимение стоит в единственном числе, а далее, в выражении «вам нужно родиться», — во множественном.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάσῃς
  choice: Не удивляйся
  rationale: μή с аористом сослагательного наклонения выражает запрещение; «не удивляйся» естественно передаёт θαυμάζω в современном русском языке.
- source_word: ὅτι
  choice: тому, что
  rationale: ὅτι вводит содержание сказанного Иисусом; конструкция «удивляться тому, что…» естественна по-русски и не превращает союз в причинное «потому что».
- source_word: εἶπόν σοι
  choice: я сказал тебе
  rationale: Форма σοι стоит в единственном числе. «Сказал тебе» точно и естественно передаёт прямое обращение, не усиливая значение до «велел».
- source_word: Δεῖ
  choice: нужно
  rationale: Δεῖ выражает необходимость. «Нужно» звучит естественно и сохраняет обязательный характер высказывания.
- source_word: ὑμᾶς
  choice: вам
  rationale: Местоимение стоит во множественном числе; русский язык позволяет явно сохранить контраст с предшествующим единственным «тебе».
- source_word: γεννηθῆναι
  choice: родиться
  rationale: В данном контексте γεννάω естественно означает рождение; «родиться» передаёт пассивную форму без неуместно узкого оттенка слова «быть зачатым».
- source_word: ἄνωθεν
  choice: свыше
  rationale: ἄνωθεν может означать как «свыше», так и «снова/заново». Основной вариант сохраняет тему происхождения от Бога, характерную для Иоанна, а другое возможное значение отмечено в сноске.
theological_decisions:
- issue: Значение ἄνωθεν в словах о новом рождении
  choice: свыше
  alternative: заново; снова
  rationale: В контексте Евангелия от Иоанна слово указывает на происхождение свыше, однако его двузначность важна для разговора с Никодимом. Поэтому основной текст не устраняет небесный смысл, а сноска сохраняет альтернативное прочтение.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Различие между единственным «тебе» и множественным «вам» сохранено непосредственно в основном тексте; подлинная двузначность ἄνωθεν отражена сноской.
