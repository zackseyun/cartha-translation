  source_fidelity: Текст точно передаёт смысл SBLGNT. «Иисус сказал ему в ответ» идиоматично выражает ἀπεκρίθη ... καὶ εἶπεν; «Истинно, истинно» сохраняет удвоенную формулу Ἀμὴν ἀμὴν. Условие, пассивное «родится», невозможность «не может увидеть» и «Царство Божье» соответствуют греческому тексту. Основное «свыше» для ἄνωθεν оправдано, а альтернативное «снова» корректно сохранено.
