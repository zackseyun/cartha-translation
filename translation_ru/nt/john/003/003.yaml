  terminology: «Царство Божье» — устоявшееся и точное соответствие βασιλεία τοῦ θεοῦ. «Свыше» удачно сохраняет вертикально-небесный оттенок ἄνωθεν, не устраняя словесную двусмысленность благодаря примечанию.
