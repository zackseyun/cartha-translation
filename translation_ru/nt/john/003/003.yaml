  text: ⸀ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἄνωθεν, οὐ δύναται ἰδεῖν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/003.yaml
  text: Jesus answered and said to him, “Truly, truly, I say to you, unless someone is born from above,[a] he is not able to see the kingdom of God.”
translation:
  language: ru
  text: 'Иисус сказал ему в ответ: «Истинно, истинно говорю тебе: если кто не родится свыше,[a] тот не может увидеть Царство Божье».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «снова», «заново». Греческое наречие может означать и «свыше», и «снова»; вопрос Никодима в следующем стихе основан на этом двойном смысле.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Иисус сказал ему в ответ
  rationale: Естественно передаёт греческую двухглагольную формулу ответа, не утяжеляя современную русскую речь буквальным «ответил и сказал».
- source_word: Ἀμὴν ἀμὴν
  choice: Истинно, истинно
  rationale: Сохраняет удвоение и торжественную настойчивость формулы, оставаясь понятным современному читателю.
- source_word: ἐὰν μή τις
  choice: если кто не
  rationale: Краткая и естественная русская конструкция с обобщённым значением.
- source_word: γεννηθῇ
  choice: родится
  rationale: Точно передаёт пассивную форму γεννάω в данном контексте; значение «снова» не добавляется к самому глаголу.
- source_word: ἄνωθεν
  choice: свыше
  rationale: Передаёт преимущественное в Евангелии от Иоанна значение «сверху, от Бога» и поддерживает дальнейшее противопоставление небесного и земного; значение «снова» сохраняется в примечании.
- source_word: οὐ δύναται ἰδεῖν
  choice: не может увидеть
  rationale: Прямо передаёт невозможность и сохраняет смысловую широту «увидеть», не сужая её до понимания или вступления.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: Царство Божье
  rationale: Устоявшееся, точное и понятное русское выражение, сохраняющее как значение царствования, так и царства.
theological_decisions:
- issue: Значение ἄνωθεν в словах Иисуса
  choice: свыше
  alternative: снова; заново
  rationale: Наречие допускает оба смысла. Иоаннова тема небесного происхождения благоприятствует значению «свыше», тогда как вопрос Никодима в следующем стихе строится на значении «снова». Основной текст и примечание вместе сохраняют намеренную многозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формула «Истинно, истинно» намеренно сохраняет торжественное повторение; синтаксис ответа сделан естественным для русского языка.
