id: JHN.3.2
reference: John 3:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν πρὸς αὐτὸν νυκτὸς καὶ εἶπεν αὐτῷ· Ῥαββί, οἴδαμεν ὅτι ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος· οὐδεὶς γὰρ ⸂δύναται ταῦτα τὰ σημεῖα⸃ ποιεῖν ἃ σὺ ποιεῖς, ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/002.yaml
  text: This man came to him by night and said to him[a], “Rabbi, we know that you have come from God as a teacher[c][b], for no one is able to do these signs that you do unless God is with him.”
translation:
  language: ru
  text: 'Этот человек пришёл к Нему ночью[a] и сказал Ему: «Равви, мы знаем, что Ты пришёл от Бога как учитель, ведь никто не может совершать эти знамения[b], которые совершаешь Ты, если Бог не с ним[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в ночное время». В Евангелии от Иоанна ночь и тьма могут также иметь символическое значение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «эти чудесные знамения». Слово «знамения» подчёркивает, что эти деяния указывают за пределы самих себя.'
    reason: lexical_alternative
  - marker: c
    text: 'Греческий текст буквально сохраняет третье лицо: «если Бог не с ним», хотя Никодим обращается к Иисусу как к «Тебе».'
    reason: source_texture
lexical_decisions:
- source_word: οὗτος
  choice: Этот человек
  rationale: Указательное местоимение относится к Никодиму, названному в предыдущем стихе; перевод сохраняет его указательную силу и естественно обозначает мужчину.
- source_word: νυκτός
  choice: ночью
  rationale: Естественная передача родительного времени; формулировка сохраняет как буквальное временное значение, так и возможный иоанновский мотив ночи.
- source_word: Ῥαββί
  choice: Равви
  rationale: Сохранено иудейское обращение, присутствующее в греческом тексте, без замены его пояснительным титулом «Учитель».
- source_word: οἴδαμεν
  choice: мы знаем
  rationale: Сохранено первое лицо множественного числа без предположения, от чьего именно имени говорит Никодим.
- source_word: ἀπὸ θεοῦ ἐλήλυθας
  choice: Ты пришёл от Бога
  rationale: Переданы происхождение и сохраняющаяся значимость совершившегося прихода; не добавлено более сильное понятие формального посланничества.
- source_word: διδάσκαλος
  choice: как учитель
  rationale: Оборот естественно выражает роль, в которой, по словам Никодима, Иисус пришёл от Бога.
- source_word: ταῦτα τὰ σημεῖα
  choice: эти знамения
  rationale: «Знамения» передаёт характер деяний как указывающих за пределы самих себя и сохраняет ключевую лексику Евангелия от Иоанна.
- source_word: ποιεῖν ἃ σὺ ποιεῖς
  choice: совершать эти знамения, которые совершаешь Ты
  rationale: Повтор одного русского глагола отражает повтор ποιέω в оригинале, оставаясь естественным в литературной речи.
- source_word: ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ
  choice: если Бог не с ним
  rationale: Сохранено неожиданное третье лицо «с ним», хотя до этого Никодим прямо обращается к Иисусу во втором лице.
theological_decisions:
- issue: Передача σημεῖα в Евангелии от Иоанна
  choice: знамения
  alternative: чудеса
  rationale: «Знамения» сохраняет богословскую функцию деяний, указывающих на личность и миссию Иисуса, не отрицая их чудесного характера.
- issue: Переход со второго лица на третье в речи Никодима
  choice: если Бог не с ним
  alternative: если Бог не с Тобой
  rationale: Греческий текст действительно переходит от прямого «Ты» к третьему лицу; сохранение этого перехода не устраняет возможную риторическую значимость формулировки.
- issue: Смысл ἀπὸ θεοῦ ἐλήλυθας
  choice: Ты пришёл от Бога
  alternative: Ты послан Богом
  rationale: Текст прямо говорит о происхождении от Бога, но не употребляет глагол «посылать»; перевод не усиливает утверждение сверх данной формулировки.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Обращение «Равви» сохраняет историческую среду. Местоимения, относящиеся к Иисусу в прямом обращении, написаны с прописной буквы согласно распространённой русской библейской традиции; это орфографическое выражение почтения, а не добавление к смыслу греческого текста.
