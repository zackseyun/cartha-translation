id: JHN.3.11
reference: John 3:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι ὅτι ὃ οἴδαμεν λαλοῦμεν καὶ ὃ ἑωράκαμεν μαρτυροῦμεν, καὶ τὴν μαρτυρίαν ἡμῶν οὐ λαμβάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/011.yaml
  text: Truly[a], truly, I tell you, we speak what we know and testify to what we have seen[c][b], and you do not receive our testimony.
translation:
  language: ru
  text: 'Истинно, истинно говорю тебе: мы говорим о том, что знаем, и свидетельствуем о том, что видели, и вы не принимаете нашего свидетельства.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Кого именно Иисус включает в слово «мы», из текста однозначно не ясно.
    reason: Сохраняет неоднозначность референта первого лица множественного числа, не навязывая истолкования.
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Истинно, истинно
  rationale: Сохраняет торжественную удвоенную формулу и естественно передаёт её усилительное значение по-русски.
- source_word: λέγω σοι
  choice: говорю тебе
  rationale: Прямо передаёт настоящее время и обращение к одному собеседнику.
- source_word: ὃ οἴδαμεν λαλοῦμεν
  choice: мы говорим о том, что знаем
  rationale: Естественный русский порядок слов сохраняет первое лицо множественного числа и содержание высказывания.
- source_word: ὃ ἑωράκαμεν μαρτυροῦμεν
  choice: свидетельствуем о том, что видели
  rationale: «Свидетельствуем» сохраняет юридико-свидетельскую лексику Иоанна; русское прошедшее время здесь естественно выражает результат предшествующего восприятия.
- source_word: τὴν μαρτυρίαν ἡμῶν
  choice: нашего свидетельства
  rationale: Сохраняет лексическую связь с глаголом «свидетельствуем» и не уточняет спорный состав группы, обозначенной местоимением «мы».
- source_word: οὐ λαμβάνετε
  choice: не принимаете
  rationale: В данном контексте «принимать» естественно выражает не просто получение, а признание и принятие свидетельства.
- source_word: καὶ
  choice: но
  rationale: Союз формально означает «и», однако здесь соединяет истинное свидетельство с отказом слушателей и в естественном русском выражает контраст как «но».
theological_decisions:
- issue: 'Первое лицо множественного числа: «мы» и «нашего»'
  choice: Множественное число сохранено без уточнения его референта.
  alternative: Истолковать «мы» как Иисуса и учеников, как риторическое множественное число либо как более широкое небесное свидетельство.
  rationale: Греческий текст последовательно использует формы множественного числа, но не определяет прямо, кого именно Иисус включает в «мы»; перевод не должен устранять эту неоднозначность.
- issue: Переход от единственного «тебе» к множественному «вы»
  choice: Сохранены «тебе» и «вы».
  alternative: Унифицировать обращение как единственное число.
  rationale: Греческое σοι стоит в единственном числе, а λαμβάνετε — во множественном; смена числа значима и должна быть видна в переводе.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным звучанием. Традиционная формула «Истинно, истинно» сохранена как узнаваемая и точная; синтаксис слегка упорядочен для естественности. Маркер сноски поставлен в основном тексте.
