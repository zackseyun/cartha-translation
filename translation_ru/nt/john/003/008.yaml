base_translation:
  language: en
  yaml_path: translation/nt/john/003/008.yaml
  text: The wind blows where it wishes[a], and you hear its sound, but you do not know where it comes from and where it goes[b]. So it is with everyone who has been born of the Spirit.
translation:
  language: ru
  text: Ветер дует, где хочет[a], и ты слышишь его шум[b], но не знаешь, откуда он приходит и куда уходит. Так бывает со всяким, кто рождён от Духа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово пне́вма может означать и «ветер», и «дух». В обеих частях стиха употреблено одно и то же слово, что создаёт игру значений, которую невозможно полностью передать по-русски.
    reason: lexical_alternative
  - marker: b
    text: 'Или «голос»: греческое слово может означать как «звук, шум», так и «голос»; здесь речь идёт о слышимом проявлении ветра.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα (первое употребление)
  choice: ветер
  rationale: Сочетание с πνεῖ («дует») и воспринимаемой на слух φωνή указывает здесь на ветер; перевод также создаёт естественный образ для последующего сравнения.
- source_word: ὅπου θέλει
  choice: где хочет
  rationale: Передаёт значение воления и сохраняет лёгкое олицетворение ветра без архаичного оттенка.
- source_word: πνεῖ
  choice: дует
  rationale: Обычный современный русский глагол для движения ветра.
- source_word: φωνήν
  choice: шум
  rationale: В контексте ветра обозначает слышимое проявление; «голос» возможен лексически, но в русском чрезмерно усилил бы олицетворение.
- source_word: οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει
  choice: не знаешь, откуда он приходит и куда уходит
  rationale: Сохраняет параллелизм πόθεν/ποῦ и ἔρχεται/ὑπάγει, оставаясь естественным по-русски.
- source_word: οὕτως ἐστὶν πᾶς ὁ γεγεννημένος
  choice: Таков всякий, кто рождён
  rationale: Кратко и естественно передаёт сравнительную конструкцию и результирующее состояние совершенного причастия γεγεννημένος.
- source_word: ἐκ τοῦ πνεύματος (второе употребление)
  choice: от Духа
  rationale: Предлог «от» ясно передаёт источник или происхождение, выраженное ἐκ; в контексте нового рождения πνεῦμα означает Духа.
theological_decisions:
- issue: Двойное значение повторённого πνεῦμα
  choice: Первое употребление переведено как «ветер», второе — как «Дух».
  alternative: Передать оба употребления одним словом либо истолковать первое как «Дух».
  rationale: Греческий текст использует многозначность πνεῦμα. В первой части глагол «дует» и слышимый шум указывают на ветер, а заключение в контексте Ин 3 говорит о рождении от Духа. Русский язык не позволяет естественно сохранить эту игру одним словом, поэтому она поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified библейским звучанием. «Таков всякий» сохраняет сжатость и универсальность исходной формулы; «рождён от Духа» передаёт происхождение без конфессионального уточнения.
