  text: καὶ ἦλθον πρὸς τὸν Ἰωάννην καὶ εἶπαν αὐτῷ· Ῥαββί, ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου, ᾧ σὺ μεμαρτύρηκας, ἴδε οὗτος βαπτίζει καὶ πάντες ἔρχονται πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/026.yaml
  text: And they came to John and said to him[a], “Rabbi, the one who was with you beyond the Jordan, to whom you have borne witness—look, he is baptizing[b], and everyone is going to him.”
translation:
  language: ru
  text: 'И они пришли к Иоанну и сказали ему: «Равви! Тот, кто был с тобой по ту сторону Иордана и о ком ты свидетельствовал[a], — вот, он крестит, и все идут к нему».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в пользу которого ты свидетельствовал». Греческая конструкция с дательным падежом допускает такой оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον πρὸς τὸν Ἰωάννην
  choice: пришли к Иоанну
  rationale: Глагол ἔρχομαι может означать движение как «приходить», так и «идти»; повествовательная перспектива и движение к Иоанну естественно переданы словом «пришли».
- source_word: Ῥαββί
  choice: Равви
  rationale: Традиционная и понятная транслитерация сохраняет иудейскую обстановку и форму обращения; перевод «Учитель» был бы возможен, но менее формально близок.
- source_word: ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου
  choice: тот, кто был с тобой по ту сторону Иордана
  rationale: Оборот естественен в современном русском и сохраняет относительное выражение и географическую перспективу оригинала.
- source_word: ᾧ σὺ μεμαρτύρηκας
  choice: о ком ты свидетельствовал
  rationale: Русский глагол «свидетельствовать» в этом значении естественно управляет предложным оборотом «о ком». Формулировка сохраняет характерную для Иоанна лексику свидетельства, а результативное значение греческого перфекта здесь передаётся контекстом.
- source_word: ἴδε οὗτος
  choice: вот, он
  rationale: «Вот» сохраняет призыв обратить внимание и вместе с местоимением передаёт указательную, несколько подчёркнутую силу οὗτος, не создавая неестественного русского оборота «этот крестит».
- source_word: βαπτίζει
  choice: крестит
  rationale: Настоящее время обозначает продолжающуюся деятельность; в русском простое настоящее естественно выражает это значение.
- source_word: πάντες ἔρχονται πρὸς αὐτόν
  choice: все идут к нему
  rationale: «Все» сохраняет риторическое обобщение говорящих, а «идут к нему» естественно передаёт направленное движение с их точки зрения.
theological_decisions:
- issue: Передача характерной для Евангелия от Иоанна лексики свидетельства
  choice: свидетельствовал
  alternative: говорил; давал свидетельство
  rationale: «Свидетельствовал» сохраняет повторяющийся в книге мотив μαρτυρέω и не уточняет богословский смысл сверх сказанного в тексте.
- issue: Направленность свидетельства в конструкции с дательным падежом
  choice: о ком ты свидетельствовал
  alternative: в пользу которого ты свидетельствовал
  rationale: Основной текст использует наиболее естественную русскую конструкцию, а сноска сохраняет возможный оттенок свидетельства в чью-либо пользу, не превращая его в единственно допустимое прочтение.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. «Равви» сохраняет историко-культурный колорит; «вот, он крестит» звучит естественно и передаёт подчёркнутый тон сообщения без архаичного «се».
