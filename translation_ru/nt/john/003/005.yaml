id: JHN.3.5
reference: John 3:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἐξ ὕδατος καὶ πνεύματος, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/005.yaml
  text: Jesus answered[a], “Truly, truly, I say to you, unless someone is born of water and the Spirit[b], he is not able to enter the kingdom of God.”
translation:
  language: ru
  text: 'Иисус ответил: «Истинно, истинно говорю тебе: если кто не родится от воды и Духа[a][b], тот не может войти в Царство Божье».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «от воды и духа». В древнегреческих рукописях различие прописной и строчной букв не определяет, имеется ли здесь в виду Святой Дух, хотя такое понимание вероятно.'
    reason: alternative_reading
  - marker: b
    text: 'Выражение «от воды и Духа» понимают по-разному: как образ очищения и обновления, как указание на физическое и духовное рождение или как отсылку к крещению. Основной текст сохраняет греческую формулировку, не решая этот вопрос в пользу одного толкования.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ответил
  rationale: Обычная и естественная передача глагола ответа в повествовательном диалоге.
- source_word: Ἀμὴν ἀμὴν
  choice: Истинно, истинно
  rationale: Передаёт торжественную удвоенную формулу и её усилительное значение, оставаясь понятной современному русскому читателю.
- source_word: λέγω σοι
  choice: говорю тебе
  rationale: Сохраняет прямоту, единственное число и торжественный характер греческой формулы.
- source_word: ἐὰν μή τις
  choice: если кто не
  rationale: Естественная русская конструкция с обобщённо-неопределённым значением, не вносящая указания на пол.
- source_word: γεννηθῇ
  choice: не родится
  rationale: Сохраняет значение рождения и страдательную направленность формы; в этом стихе нет ἄνωθεν, поэтому значения «снова» или «свыше» не добавляются.
- source_word: ἐξ ὕδατος καὶ πνεύματος
  choice: от воды и Духа
  rationale: Предлог «от» естественно сочетается с «родиться» и достаточно близко передаёт ἐκ; написание «Духа» с прописной буквы отражает вероятную отсылку к Святому Духу, а допустимая альтернатива отмечена в сноске.
- source_word: οὐ δύναται
  choice: не может
  rationale: Краткая и точная русская передача явно выраженной невозможности.
- source_word: εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: войти в Царство Божье
  rationale: Сохраняет образ вхождения и традиционное, но современно звучащее обозначение Божьего царства.
theological_decisions:
- issue: Значение πνεύματος в выражении ἐξ ὕδατος καὶ πνεύματος
  choice: «Духа» — вероятная отсылка к Святому Духу
  alternative: «духа» — указание на дух или духовное начало
  rationale: Контекст Евангелия от Иоанна и библейский фон поддерживают личную отсылку к Божьему Духу, однако в греческом письме регистр букв не решает этот вопрос, а существительное употреблено без артикля; поэтому альтернативное прочтение сохранено в сноске.
- issue: Смысл выражения «от воды и Духа»
  choice: Сохранить греческий образ без уточняющей интерпретации в основном тексте
  alternative: Толковать воду как физическое рождение, как образ очищения и обновления либо как конкретную отсылку к крещению
  rationale: Само выражение допускает несколько исторически известных толкований. Перевод не должен превращать одно из них в конфессионально обязательное там, где греческая формулировка этого однозначно не делает.
translation_notes:
  register: Современный литературный русский с достоинством и умеренной традиционностью. Формула «Истинно, истинно говорю тебе» сохраняет торжественность оригинала; «Царство Божье» понятно современному читателю и не утрачивает библейского регистра.
