  source_fidelity: 'Текст точно передаёт греческий оригинал: ἀπεκρίθη — «ответил»; торжественная удвоенная формула Ἀμὴν ἀμὴν сохранена; условие ἐὰν μή τις γεννηθῇ передано без добавления отсутствующего в стихе ἄνωθεν; ἐξ ὕδατος καὶ πνεύματος и невозможность войти в Божье Царство переданы полно и без смысловых потерь.'
  naturalness: '«Иисус ответил: „Истинно, истинно говорю тебе: если кто не родится от воды и Духа, тот не может войти в Царство Божье“» — естественный современный литературный русский с уместным библейским, торжественным регистром. Конструкция «если кто …, тот …» несколько традиционна, но не архаична и хорошо соответствует жанру.'
  terminology: «Духа» обоснованно передаёт вероятную отсылку к Святому Духу, не навязывая спорное толкование выражения в целом. «Царство Божье» — устоявшийся и точный эквивалент βασιλεία τοῦ θεοῦ. Сноски корректно сохраняют альтернативу «духа» и основные интерпретационные возможности, не превращая их в перевод основного текста. Маркеры [a][b] стоят непосредственно после спорного выражения и соответствуют содержанию сносок.
