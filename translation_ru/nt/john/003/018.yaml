id: JHN.3.18
reference: John 3:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς αὐτὸν οὐ κρίνεται· ὁ ⸀δὲ μὴ πιστεύων ἤδη κέκριται, ὅτι μὴ πεπίστευκεν εἰς τὸ ὄνομα τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/018.yaml
  text: The one who believes in him is not judged[a]; but the one who does not believe has already been judged[b], because he has not believed in the name of the one and only Son of God.
translation:
  language: ru
  text: Верующий в Него не осуждается[a], а неверующий уже осуждён, потому что не уверовал во имя единственного Сына Божьего[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не судится»; далее соответственно: «уже был судим». Глагол κρίνω может означать как «судить», так и, в данном контексте, «осуждать».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «уникального Сына»; традиционно: «Единородного Сына».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς αὐτόν
  choice: верующий в Него
  rationale: Субстантивированное причастие настоящего времени обозначает всякого, кто верит; сочетание «веровать в» естественно передаёт направленное на личность доверие.
- source_word: οὐ κρίνεται
  choice: не осуждается
  rationale: Настоящее время передано формой настоящего времени. В контексте Ин 3:17–19 κρίνω обозначает неблагоприятный суд, то есть осуждение, однако более широкое значение «судить» сохранено в сноске.
- source_word: ὁ δὲ μὴ πιστεύων
  choice: а неверующий
  rationale: Краткая субстантивированная форма естественно передаёт греческое причастие, а «а» ясно выражает противопоставление, отмеченное δέ.
- source_word: ἤδη κέκριται
  choice: уже осуждён
  rationale: Перфект указывает на совершившийся приговор и сохраняющееся вследствие него состояние; краткое страдательное причастие хорошо передаёт этот результативный смысл.
- source_word: ὅτι μὴ πεπίστευκεν
  choice: потому что не уверовал
  rationale: ὅτι вводит причину. Русское совершенное «не уверовал» передаёт состоявшийся отказ или отсутствие прихода к вере, хотя греческий перфект также подчёркивает сохраняющийся результат.
- source_word: εἰς τὸ ὄνομα
  choice: во имя
  rationale: Сохранён конкретный иоанновский оборот, в котором «имя» указывает на явленную личность и достоинство, без разъясняющего добавления в основном тексте.
- source_word: τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ
  choice: единственного Сына Божьего
  rationale: μονογενής подчёркивает единственность и уникальность Сына. Современное «единственного» ясно передаёт этот смысл, не навязывая слову биологического оттенка.
theological_decisions:
- issue: Значение κρίνω в стихе
  choice: В обоих случаях передавать как «осуждать / быть осуждённым»
  alternative: «судить / быть судимым»
  rationale: Ближайший контекст противопоставляет спасение неблагоприятному судебному решению, поэтому «осуждать» уместно по смыслу. При этом лексическая широта κρίνω не скрыта и отмечена в сноске.
- issue: Передача μονογενής
  choice: «единственный»
  alternative: «уникальный»; традиционно «Единородный»
  rationale: Основной текст передаёт прежде всего уникальность сыновства согласно современным лексическим данным, а традиционный богословски значимый вариант сохраняется в сноске без внесения позднейшей формулировки непосредственно в перевод.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным библейским звучанием. Формы «верующий» и «неверующий» сохраняют обобщённый характер греческих причастий; заглавные местоимение и титулы следуют принятой русской библейской орфографической традиции.
