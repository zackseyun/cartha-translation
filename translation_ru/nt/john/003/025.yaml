  text: Ἐγένετο οὖν ζήτησις ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου περὶ καθαρισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/025.yaml
  text: Then a dispute arose between John's disciples and a Jew about purification[a].
translation:
  language: ru
  text: Тогда у учеников Иоанна возник спор с одним иудеем об очищении[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «об омовении»; возможно, имеется в виду обрядовое очищение.'
    reason: Слово καθαρισμός может обозначать очищение вообще, но в данном контексте, вероятно, имеет ритуальный оттенок.
lexical_decisions:
- source_word: Ἐγένετο
  choice: возник
  rationale: Глагол вводит возникновение события; в сочетании со словом «спор» современное русское «возник» естественно передаёт смысл.
- source_word: οὖν
  choice: Итак
  rationale: Частица связывает эпизод с предшествующим повествованием и может выражать как переход, так и лёгкое следственное значение; «итак» сохраняет обе функции без чрезмерного усиления вывода.
- source_word: ζήτησις
  choice: спор
  rationale: Слово может обозначать обсуждение, разбирательство или прение; контекст последующей жалобы учеников указывает на спорный характер разговора.
- source_word: ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου
  choice: между учениками Иоанна и одним иудеем
  rationale: Хотя ἐκ буквально означает «из», вся конструкция называет стороны спора. Единственное число Ἰουδαίου передано сочетанием «одним иудеем», чтобы ясно сохранить индивидуального участника.
- source_word: περὶ καθαρισμοῦ
  choice: об очищении
  rationale: καθαρισμός означает очищение и в данном контексте, вероятно, имеет обрядовый оттенок, однако сам стих не уточняет его характер.
theological_decisions:
- issue: Следует ли прямо обозначить καθαρισμός как обрядовое очищение
  choice: очищение
  alternative: обрядовое очищение
  rationale: Контекст Евангелия от Иоанна допускает и, вероятно, предполагает ритуальный смысл, но добавление «обрядовое» в основной текст сузило бы формулировку оригинала.
translation_notes:
  register: Современный литературный русский язык; синтаксис естественный и сдержанно-достоинственный. «Иудей» сохраняет историко-культурное обозначение текста, а «одним» подчёркивает единственное число без превращения этнонима в обобщение.
