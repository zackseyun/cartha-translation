    rationale: «Ибо» сохраняет объяснительно-обосновывающую функцию ὅτι и лучше соотносится с регистром перевода.
  - severity: low
    issue: Фраза примечания «один дар благодати» добавляет отсутствующее в греческом слово «дар».
    rationale: 'Смысл последовательности можно передать непосредственно: «одна благодать следует за другой».'
