  yaml_path: translation/nt/john/001/016.yaml
  text: For from his fullness we have all received[a], and grace upon grace.
translation:
  language: ru
  text: Ибо от Его полноты все мы приняли и благодать вместо благодати.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благодать за благодатью»; «одну благодать за другой». Греческий оборот может подразумевать, что одна благодать следует за другой, хотя ἀντί буквально означает «вместо», «взамен».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Ведь
  rationale: Союз вводит пояснение или основание к предшествующему высказыванию; «ведь» естественно передаёт эту связь по-русски.
- source_word: ἐκ τοῦ πληρώματος αὐτοῦ
  choice: от Его полноты
  rationale: Сохраняет образ полноты, принадлежащей Слову, как источника того, что получили верующие.
- source_word: ἡμεῖς πάντες
  choice: все мы
  rationale: Такой порядок слов передаёт подчёркнутое сочетание явного местоимения с πάντες и звучит естественно в современном русском языке.
- source_word: ἐλάβομεν
  choice: приняли
  rationale: Аорист передан совершенным видом прошедшего времени; «приняли» здесь естественно обозначает состоявшееся получение дара.
- source_word: καὶ
  choice: —
  rationale: Тире естественно присоединяет пояснение того, что именно было принято; это не исключает возможности понимать καὶ как обычное «и».
- source_word: χάριν ἀντὶ χάριτος
  choice: благодать вместо благодати
  rationale: Передаёт основное значение ἀντί — «вместо, на место», не устраняя возможного смысла сменяющейся или последовательно даруемой благодати.
theological_decisions:
- issue: Толкование χάριν ἀντὶ χάριτος
  choice: благодать вместо благодати
  alternative: благодать за благодатью; одна благодать за другой
  rationale: Оборот допускает спор между значением замещения и значением последовательности или нарастания. Основной текст сохраняет более прямую силу ἀντί, а примечание сообщает естественные альтернативы, не разрешая богословское напряжение за читателя.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Его» написано с прописной буквы как традиционное указание на Христа; синтаксис краток и сохраняет образность оригинала.
