source:
  edition: SBLGNT
  text: λέγει αὐτοῖς· Ἔρχεσθε καὶ ⸂ὄψεσθε. ἦλθαν οὖν⸃ καὶ εἶδαν ποῦ μένει, καὶ παρ’ αὐτῷ ἔμειναν τὴν ἡμέραν ἐκείνην· ὥρα ἦν ὡς δεκάτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/039.yaml
  text: He said to them[a], “Come, and you will see.” So they went and saw where he was staying, and they stayed with him that day. It was about the tenth hour.
translation:
  language: ru
  text: 'Он сказал им: «Пойдите — и увидите». Они пошли и увидели, где Он остановился, и пробыли у Него тот день. Было около десятого часа.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Если считать часы от восхода солнца, это около 16:00; некоторые понимают это по римскому счёту времени — как около 10:00.
    reason: Сохранить альтернативные варианты отсчёта времени, не разрешая неоднозначность в основном тексте.
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Он сказал им
  rationale: Историческое настоящее передано обычным для русского повествования прошедшим временем; адресат во множественном числе сохранён.
- source_word: Ἔρχεσθε
  choice: Пойдите
  rationale: Форма передаёт прямое приглашение последовать за Иисусом; в данном русском контексте «пойдите» естественнее буквального «приходите».
- source_word: ὄψεσθε
  choice: увидите
  rationale: 'Будущее время сохранено, как и обещательный оттенок приглашения: результат станет ясен, если ученики пойдут.'
- source_word: ἦλθαν οὖν
  choice: Они пошли
  rationale: Глагол движения передан с точки зрения повествования; смысл следствия, выраженный οὖν, естественно следует из предыдущего приглашения без обязательного отдельного союза.
- source_word: εἶδαν
  choice: увидели
  rationale: Прямой эквивалент сохраняет словесный повтор с «увидите».
- source_word: ποῦ μένει
  choice: где Он остановился
  rationale: В контексте μένω обозначает место временного пребывания Иисуса; русский глагол «остановился» естественно выражает этот смысл.
- source_word: παρ’ αὐτῷ
  choice: у Него
  rationale: Передаёт одновременно пребывание в месте, где находился Иисус, и нахождение в Его обществе.
- source_word: ἔμειναν
  choice: пробыли
  rationale: Естественно обозначает продолжительность их пребывания у Иисуса в течение указанного дня.
- source_word: τὴν ἡμέραν ἐκείνην
  choice: тот день
  rationale: Формулировка не добавляет отсутствующих в греческом тексте уточнений «остаток» или «весь».
- source_word: ὥρα ἦν ὡς δεκάτη
  choice: Было около десятого часа
  rationale: Сохранены приблизительность ὡς и исходное обозначение часа без навязывания спорной системы отсчёта времени.
theological_decisions:
- issue: Отсчёт «десятого часа»
  choice: В основном тексте сохранено буквальное обозначение «около десятого часа».
  alternative: Около 16:00 при отсчёте от восхода солнца либо около 10:00 при римском гражданском отсчёте.
  rationale: Сам текст не указывает систему отсчёта. Буквальная формулировка сохраняет неоднозначность, а примечание сообщает основные варианты понимания.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным библейским повествовательным стилем. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской издательской традиции.
