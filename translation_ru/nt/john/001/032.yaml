id: JHN.1.32
reference: John 1:32
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐμαρτύρησεν Ἰωάννης λέγων ὅτι Τεθέαμαι τὸ πνεῦμα καταβαῖνον ⸀ὡς περιστερὰν ἐξ οὐρανοῦ, καὶ ἔμεινεν ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/032.yaml
  text: And John testified[a], saying, “I have seen the Spirit descending like a dove out of heaven[b], and it remained on him.”
translation:
  language: ru
  text: 'И Иоанн засвидетельствовал: «Я видел, как Дух сходил с неба[b], словно голубь[a], и остался на Нём».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как голубь». Греческое выражение обозначает подобие и само по себе не уточняет, относится ли оно к облику или к характеру схождения.'
    reason: Сохранение диапазона значения ὡς и образной неоднозначности.
  - marker: b
    text: 'Буквально: «из неба»; по-русски также можно передать: «с небес».'
    reason: Лексическая альтернатива для ἐξ οὐρανοῦ.
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: засвидетельствовал
  rationale: Передаёт значение публичного свидетельства и сохраняет характерный для Евангелия юридический оттенок μαρτυρέω.
- source_word: λέγων ὅτι
  choice: 'засвидетельствовал: «…»'
  rationale: Русское двоеточие естественно вводит содержание свидетельства; буквальное «говоря, что» здесь было бы тяжеловесным.
- source_word: Τεθέαμαι
  choice: Я видел
  rationale: 'Естественная русская передача перфекта θεάομαι: Иоанн говорит о лично увиденном событии, сохраняющем значение для его свидетельства.'
- source_word: τὸ πνεῦμα
  choice: Дух
  rationale: Контекст стихов 32–33 указывает на Святого Духа; прописная буква обозначает этот референт без добавления отсутствующего в стихе определения «Святой».
- source_word: καταβαῖνον
  choice: сходил
  rationale: Передаёт направленное вниз движение и естественно сочетается с конструкцией «видел, как».
- source_word: ὡς περιστερὰν
  choice: словно голубь
  rationale: ὡς выражает уподобление. Формулировка сохраняет образ, не утверждая, что Дух буквально был голубем.
- source_word: ἐξ οὐρανοῦ
  choice: с неба
  rationale: Наиболее естественная современная русская передача движения от небесного источника; буквальное «из неба» по-русски звучит неестественно.
- source_word: ἔμεινεν
  choice: остался
  rationale: Передаёт продолжительное пребывание после схождения. Нулевое подлежащее естественно отсылает к слову «Дух» и не добавляет отдельного местоимения.
- source_word: ἐπ’ αὐτόν
  choice: на Нём
  rationale: Передаёт пребывание Духа на Иисусе. Прописная буква соответствует русской библейской издательской традиции для местоимения, относящегося ко Христу.
theological_decisions:
- issue: Кого обозначает τὸ πνεῦμα
  choice: «Дух» — Святой Дух
  alternative: «дух» в неопределённом или безличном смысле
  rationale: Непосредственный контекст Ин 1:32–33 связывает увиденный знак с Духом, сходящим и пребывающим на Иисусе, и с крещением Святым Духом.
- issue: Смысл ὡς περιστερὰν
  choice: 'сравнение: «словно голубь»'
  alternative: отождествление или телесное превращение в голубя
  rationale: ὡς обычно отмечает подобие; перевод сохраняет образ и не уточняет сверх текста, относится ли сравнение прежде всего к виду или к характеру схождения.
- issue: Подлежащее при ἔμεινεν
  choice: опущенное русское подлежащее относится к Духу
  alternative: явное «Он» или повтор «Дух»
  rationale: Греческая форма не содержит отдельного местоимения. Русское «и остался» ясно сохраняет того же субъекта, не внося дополнительного акцента на грамматический род.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаичным звучанием. Причастная конструкция заменена естественным оборотом «видел, как». Глагол «засвидетельствовал» сохраняет ключевую для Иоанна тему свидетельства. Маркеры сносок размещены непосредственно при соответствующих выражениях.
