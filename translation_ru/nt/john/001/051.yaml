source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἀμὴν ἀμὴν λέγω ⸀ὑμῖν, ὄψεσθε τὸν οὐρανὸν ἀνεῳγότα καὶ τοὺς ἀγγέλους τοῦ θεοῦ ἀναβαίνοντας καὶ καταβαίνοντας ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/051.yaml
  text: And he said to him[a], “Truly, truly, I say to you[b], you will see heaven opened and the angels of God ascending and descending on the Son of Man.”
translation:
  language: ru
  text: 'И сказал ему: «Истинно, истинно говорю вам[a]: вы увидите небо открытым и ангелов Божьих, восходящих и нисходящих на Сына Человеческого».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте слова «вам» и «вы увидите» стоят во множественном числе, хотя перед этим Иисус обращается к Нафанаилу.
    reason: lexical_alternative
  - marker: b
    text: Этот образ перекликается со сном Иакова, в котором ангелы Божьи восходили и нисходили (Быт. 28:12); здесь образ сосредоточен на Сыне Человеческом.
    reason: cross_reference
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Истинно, истинно
  rationale: Сохраняет удвоенную торжественную формулу и естественно передаёт её утвердительную силу на современном русском языке.
- source_word: ὑμῖν / ὄψεσθε
  choice: вам / вы увидите
  rationale: Русские формы ясно передают множественное число, отмечая переход от обращения к одному Нафанаилу к более широкому кругу слушателей.
- source_word: τὸν οὐρανὸν ἀνεῳγότα
  choice: небо открытым
  rationale: 'Передаёт результативное состояние, выраженное перфектным причастием: небо уже открыто и остаётся открытым.'
- source_word: ἀγγέλους τοῦ θεοῦ
  choice: ангелов Божьих
  rationale: В контексте видения и отсылки к Быт 28 речь идёт о небесных ангелах; форма «Божьих» естественна и достойна в современной русской речи.
- source_word: ἀναβαίνοντας καὶ καταβαίνοντας
  choice: восходящих и нисходящих
  rationale: Точно сохраняет направленную пару глаголов и её связь с образом из сна Иакова.
- source_word: ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: на Сына Человеческого
  rationale: Сохраняет пространственную образность и не устраняет смысловую напряжённость предлога ἐπί; традиционный титул передаёт библейские связи выражения.
theological_decisions:
- issue: Переход от единственного числа в авторской ремарке αὐτῷ к множественному числу ὑμῖν и ὄψεσθε
  choice: 'Передать в основном тексте явно: «ему» — затем «вам» и «вы увидите».'
  alternative: Сгладить переход обращением только к Нафанаилу в единственном числе.
  rationale: Греческий текст намеренно или значимо расширяет адресат высказывания; русский язык позволяет сохранить это без неестественной формулировки.
- issue: Образ ангелов, восходящих и нисходящих на Сына Человеческого
  choice: Сохранить буквальную образность в основном тексте, а связь со сном Иакова отметить в сноске.
  alternative: Разъяснить непосредственно в тексте, что Сын Человеческий занимает место лестницы или является средоточием откровения.
  rationale: Греческая формулировка допускает богословски насыщенную образность, но прямо не истолковывает её; перевод не должен разрешать эту напряжённость посредством добавленной экзегезы.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Сохранены удвоение «Истинно, истинно», титул «Сын Человеческий» и направленная пара «восходящих и нисходящих». Все маркеры сносок присутствуют в основном тексте.
