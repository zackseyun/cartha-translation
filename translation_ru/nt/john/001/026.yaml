  text: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων· Ἐγὼ βαπτίζω ἐν ὕδατι· ⸀μέσος ὑμῶν ⸀ἕστηκεν ὃν ὑμεῖς οὐκ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/026.yaml
  text: John answered them[a], saying, “I baptize in water. Among you stands one whom you do not know,”
translation:
  language: ru
  text: 'Иоанн ответил им: «Я крещу в воде. Среди вас[a] стоит тот, кого вы не знаете».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посреди вас».'
    reason: Лексическая альтернатива для μέσος ὑμῶν.
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων
  choice: 'Иоанн ответил им:'
  rationale: Русское «ответил им» естественно передаёт повествовательный глагол ἀπεκρίθη с адресатом; содержание причастия λέγων ясно вводится двоеточием, поэтому отдельное «говоря» было бы тяжеловесным.
- source_word: βαπτίζω
  choice: крещу
  rationale: «Крестить» — установившийся и уместный русский эквивалент; «погружаю» неоправданно сужало бы значение и могло бы привнести конфессиональную специфику.
- source_word: ἐν ὕδατι
  choice: в воде
  rationale: Передаёт ἐν с дательным падежом близко к форме исходного текста и сохраняет образ воды; вариант «водой» также возможен, но менее формально соответствует греческой конструкции.
- source_word: μέσος ὑμῶν
  choice: среди вас
  rationale: Естественное современное выражение присутствия внутри группы; «посреди вас» сохранено как допустимая более буквальная альтернатива в сноске.
- source_word: ἕστηκεν
  choice: стоит
  rationale: 'Настоящее время по-русски естественно передаёт результирующее состояние, выраженное греческим перфектом: некто занял место и теперь находится среди них.'
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: тот, кого вы не знаете
  rationale: Сохраняет широкое значение οἶδα — «знать», не сужая его до более толковательного «не узнаёте».
theological_decisions:
- issue: Личность неназванного человека, стоящего среди слушателей
  choice: «тот» со строчной буквы, без явного наименования
  alternative: «Мессия», «Он» или местоимения с прописной буквы
  rationale: Хотя дальнейший контекст указывает на Иисуса, сам стих не называет Его прямо. Нейтральная форма сохраняет риторическую недосказанность и не разрешает её раньше исходного текста.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Двоеточие вместо буквального «говоря» устраняет неестественную для русского избыточность, не теряя смысла.
