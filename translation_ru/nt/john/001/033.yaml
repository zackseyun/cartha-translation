  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ὁ πέμψας με βαπτίζειν ἐν ὕδατι ἐκεῖνός μοι εἶπεν· Ἐφ’ ὃν ἂν ἴδῃς τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν, οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/033.yaml
  text: And I did not know him[a], but the one who sent me to baptize in water said to me, ‘The one on whom you see the Spirit descending and remaining on him[c][b], this is he who baptizes in the Holy Spirit.’
translation:
  language: ru
  text: 'И я не знал Его[a], но Пославший меня крестить в воде сказал мне: «Тот, на Ком ты увидишь Духа, сходящего и остающегося на Нём[b], и есть Тот, Кто крестит в Святом Духе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не узнавал Его» / «не распознавал Его». Греческое выражение в данном контексте может означать как отсутствие знания, так и отсутствие узнавания или распознания.'
    reason: lexical_alternative
  - marker: b
    text: «Остающегося» передаёт важный для Евангелия от Иоанна глагол, который также переводят как «пребывающего».
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ οὐκ ᾔδειν αὐτόν
  choice: Я и сам не знал Его
  rationale: κἀγώ передаёт продолжение и подчёркнутое самообозначение говорящего; «и сам» естественно выражает этот оттенок. «Не знал» прямо передаёт οὐκ ᾔδειν, не устраняя возможного значения «не узнавал/не распознавал».
- source_word: ὁ πέμψας με
  choice: Пославший меня
  rationale: Субстантивированное причастие с артиклем обозначает определённого Пославшего; русское причастие передаёт конструкцию кратко и достойно.
- source_word: βαπτίζειν ἐν ὕδατι
  choice: крестить в воде
  rationale: Сохраняется предлог ἐν и его намеренная параллель с ἐν πνεύματι ἁγίῳ в конце стиха.
- source_word: Ἐφ’ ὃν ἂν ἴδῃς
  choice: Тот, на Ком ты увидишь
  rationale: Естественная русская формула опознания, сохраняющая относительную конструкцию и неопределённость до указания знака.
- source_word: τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν
  choice: Духа, сходящего и остающегося на Нём
  rationale: Оба причастия сохранены. «Остающегося» доступно современному читателю и передаёт значимый для Иоанна глагол μένω без архаичного «пребывающего».
- source_word: οὗτός ἐστιν ὁ βαπτίζων
  choice: и есть Тот, Кто крестит
  rationale: Конструкция ясно передаёт указательно-идентифицирующую силу οὗτός ἐστιν и субстантивированное причастие.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: в Святом Духе
  rationale: Формально сохраняет ἐν и параллель с «в воде»; заглавные буквы обозначают божественного Духа, ясно определяемого контекстом.
theological_decisions:
- issue: Значение οὐκ ᾔδειν
  choice: не знал
  alternative: не узнавал / не распознавал
  rationale: Греческий глагол допускает как отсутствие знания, так и отсутствие распознания личности в данном качестве. Основной текст оставляет более прямой и широкий вариант, а примечание сохраняет контекстуальную альтернативу.
- issue: Предлог ἐν в двух формулах крещения
  choice: крестить в воде ... крестит в Святом Духе
  alternative: крестить водой ... крестит Святым Духом
  rationale: Одинаковое «в» сохраняет лексический и риторический параллелизм исходного текста, не решая заранее вопрос об инструментальном или сферическом оттенке.
- issue: Идентификация πνεῦμα
  choice: Дух ... Святой Дух
  alternative: дух ... святой дух
  rationale: Заключительная формула πνεύματι ἁγίῳ определяет референта как Святого Духа; прописные буквы отражают эту контекстуальную идентификацию.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Местоимения, относящиеся к Богу, Христу и Святому Духу, написаны с прописной буквы согласно распространённой русской библейской традиции. Синтаксис сделан естественным для устной цитаты; исходный параллелизм «в воде — в Святом Духе» сохранён.
