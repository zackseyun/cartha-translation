source:
  edition: SBLGNT
  text: Καὶ αὕτη ἐστὶν ἡ μαρτυρία τοῦ Ἰωάννου ὅτε ⸀ἀπέστειλαν οἱ Ἰουδαῖοι ἐξ Ἱεροσολύμων ἱερεῖς καὶ Λευίτας ἵνα ἐρωτήσωσιν αὐτόν· Σὺ τίς εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/019.yaml
  text: And this is the testimony of John[a], when the Jews sent priests and Levites from Jerusalem to ask him, “Who are you?”
translation:
  language: ru
  text: 'Вот свидетельство, которое дал Иоанн, когда иудеи[a] послали из Иерусалима священников и левитов спросить его: «Кто ты?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иудейские руководители»; или: «жители Иудеи». В Евангелии от Иоанна слово «иудеи» нередко обозначает прежде всего иудейские религиозные власти, а не весь еврейский народ.'
    reason: Лексическая альтернатива и уточнение контекстуального референта.
lexical_decisions:
- source_word: μαρτυρία
  choice: свидетельство
  rationale: Передаёт свидетельское заявление Иоанна и сохраняет характерный для Евангелия юридический оттенок свидетельствования.
- source_word: τοῦ Ἰωάννου
  choice: Иоанна
  rationale: 'Родительный падеж понят как субъектный: речь идёт о свидетельстве, которое даёт Иоанн, а не о свидетельстве о нём.'
- source_word: ὅτε
  choice: когда
  rationale: Естественно вводит обстоятельство времени, при котором было дано свидетельство.
- source_word: ἀπέστειλαν
  choice: послали
  rationale: Прямой и естественный эквивалент в данном повествовательном контексте.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Сохраняет буквальное групповое обозначение исходного текста; возможное более узкое указание на иудейские религиозные власти разъяснено в сноске.
- source_word: ἐξ Ἱεροσολύμων
  choice: из Иерусалима
  rationale: Естественно обозначает место, откуда были посланы священники и левиты.
- source_word: ἱερεῖς καὶ Λευίτας
  choice: священников и левитов
  rationale: Сохраняет два различных храмовых служебных круга.
- source_word: ἵνα ἐρωτήσωσιν αὐτόν
  choice: спросить его
  rationale: Кратко и естественно передаёт цель посылки.
- source_word: Σὺ τίς εἶ;
  choice: Кто ты?
  rationale: Естественная русская формулировка; местоимение «ты» передаёт выраженное в греческом тексте Σὺ без неестественного усиления.
theological_decisions:
- issue: Кого обозначает οἱ Ἰουδαῖοι в Евангелии от Иоанна
  choice: 'В основном тексте: «иудеи», со сноской о возможном более узком значении'
  alternative: «иудейские руководители» или «жители Иудеи»
  rationale: Так сохраняется формулировка источника и не сужается референт безусловно; одновременно сноска предохраняет от ошибочного понимания как указания на весь еврейский народ. В данном контексте отправление священников и левитов из Иерусалима особенно указывает на религиозные власти.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно торжественный. Начальное «И вот» естественно передаёт Καὶ αὕτη и вводит новый повествовательный эпизод. Порядок «послали из Иерусалима» сохраняет ясную связь места отправления с посланниками.
