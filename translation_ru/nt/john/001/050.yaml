base_translation:
  language: en
  yaml_path: translation/nt/john/001/050.yaml
  text: Jesus answered and said to him[a], “Because I told you that I saw you under the fig tree, do you believe? You will see greater things than these.”
translation:
  language: ru
  text: 'Иисус ответил ему: «Ты веришь потому, что Я сказал тебе: „Я видел тебя под смоковницей“? Ты увидишь большее, чем это».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Иисус ответил ему
  rationale: Греческая повествовательная формула буквально сочетает «ответил» и «сказал», но в современном русском естественно передаётся одним глаголом «ответил» без потери смысла.
- source_word: Ὅτι ... πιστεύεις;
  choice: Ты веришь потому, что…?
  rationale: Начальное ὅτι имеет причинное значение и относится к вопросу; русская конструкция сохраняет риторический характер и не превращает вопрос в утверждение.
- source_word: εἶδόν σε ὑποκάτω τῆς συκῆς
  choice: Я видел тебя под смоковницей
  rationale: Прямо сохраняет прошедшее время и конкретный образ; «смоковница» — устоявшееся, понятное библейское название фигового дерева.
- source_word: μείζω τούτων ὄψῃ
  choice: Ты увидишь большее, чем это
  rationale: Субстантивированное нейтральное множественное μείζω естественно передано собирательным «большее»; τούτων допускает отнесение ко всему только что упомянутому.
theological_decisions:
- issue: Сила вопроса πιστεύεις;
  choice: 'Риторический вопрос: «Ты веришь потому, что…?»'
  alternative: 'Утверждение: «Ты веришь, потому что…»'
  rationale: Форма и контекст хорошо поддерживают вопрос, который ведёт к обещанию большего откровения; перевод не усиливает его до явного упрёка.
- issue: Объём обещания μείζω τούτων
  choice: «большее, чем это»
  alternative: «больше этого» / «более великие дела»
  rationale: Перевод сохраняет обобщённость греческого среднего рода и не уточняет без основания, идёт ли речь о знамениях, откровениях или иных событиях.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Архаическая двойная формула «отвечал и сказал» устранена как неестественная; традиционное слово «смоковница» сохранено благодаря его узнаваемости и точности.
