  text: λέγει αὐτῷ Ναθαναήλ· Πόθεν με γινώσκεις; ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Πρὸ τοῦ σε Φίλιππον φωνῆσαι ὄντα ὑπὸ τὴν συκῆν εἶδόν σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/048.yaml
  text: Nathanael said to him[a], “How do you know me?” Jesus answered and said to him, “Before Philip called you, while you were under the fig tree, I saw you.”
translation:
  language: ru
  text: 'Нафанаил спросил Его: «Откуда Ты меня знаешь?» Иисус ответил ему: «Ещё до того, как Филипп позвал тебя, Я увидел тебя под смоковницей».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πόθεν με γινώσκεις
  choice: Откуда Ты меня знаешь?
  rationale: «Откуда» прямо передаёт Πόθεν и по-русски естественно выражает вопрос об источнике или основании знания; γινώσκεις передано обычным личным «знаешь».
- source_word: λέγει
  choice: спросил
  rationale: Формально глагол означает «говорит», но содержание реплики является прямым вопросом; «спросил» естественно передаёт речевую функцию без изменения смысла.
- source_word: ἀπεκρίθη ... καὶ εἶπεν αὐτῷ
  choice: ответил ему
  rationale: Греческая парная формула буквально означает «ответил и сказал ему». В современном русском «ответил ему» передаёт её полностью и избегает тяжеловесного повтора.
- source_word: Πρὸ τοῦ σε Φίλιππον φωνῆσαι
  choice: Ещё до того, как Филипп позвал тебя
  rationale: Конструкция Πρὸ τοῦ с инфинитивом обозначает предшествование во времени. «Позвал» соответствует повествовательному контексту, а «ещё» естественно подчёркивает предшествование.
- source_word: ὄντα ὑπὸ τὴν συκῆν
  choice: под смоковницей
  rationale: Причастие ὄντα описывает обстоятельство, в котором Иисус видел Нафанаила. В русском оно естественно выражается предложным оборотом при глаголе «увидел».
- source_word: εἶδόν σε
  choice: Я увидел тебя
  rationale: Аорист передан формой прошедшего совершенного вида. Временная конструкция уже ясно указывает, что это произошло до призыва Филиппа.
- source_word: συκῆν
  choice: смоковницей
  rationale: «Смоковница» — точное и устойчивое русское название фигового дерева в библейском регистре, остающееся понятным современному читателю.
theological_decisions:
- issue: Характер знания Иисуса о Нафанаиле
  choice: Передать слова о том, что Иисус видел Нафанаила раньше, без объяснения природы этого знания.
  alternative: Прямо обозначить это знание как сверхъестественное или, напротив, как результат обычного наблюдения.
  rationale: Сам стих не объясняет, каким образом Иисус видел или узнал Нафанаила. Прямой перевод сохраняет эту богословскую напряжённость и не навязывает толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской издательской традиции; смысловой нагрузки эта графика не добавляет.
