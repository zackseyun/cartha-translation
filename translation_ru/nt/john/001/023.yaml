base_translation:
  language: en
  yaml_path: translation/nt/john/001/023.yaml
  text: He said[a], “I am a voice of one crying out in the wilderness, ‘Make straight the way of the Lord,’ just as Isaiah the prophet said.”
translation:
  language: ru
  text: 'Он сказал[a]: «Я — голос взывающего в пустыне: „Выпрямите путь Господа“, — как сказал пророк Исаия».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, при другом синтаксическом разборе: «Я — голос, взывающий в пустыне»; тогда слова «в пустыне» относятся к «голосу», а не к «взывающему». Основной текст передаёт более вероятное прочтение.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: Он сказал
  rationale: Обычная формула введения прямой речи; подлежащее восстанавливается из непосредственного контекста диалога.
- source_word: Ἐγὼ φωνὴ
  choice: Я — голос
  rationale: Именная конструкция естественно передаётся по-русски с тире. Отсутствие артикля не требует слова «один»; образ сохраняется без избыточного уточнения.
- source_word: βοῶντος
  choice: взывающего
  rationale: Причастие передаёт громкий, настойчивый пророческий призыв и естественно сочетается со словом «голос».
- source_word: ἐν τῇ ἐρήμῳ
  choice: в пустыне
  rationale: Передаёт обычное значение ἔρημος в данном пророческом контексте и сохраняет как географический образ, так и его библейское звучание.
- source_word: Εὐθύνατε
  choice: Сделайте прямым
  rationale: Прямое повеление во множественном числе сохраняет образ выпрямления дороги и близко следует греческому тексту.
- source_word: τὴν ὁδὸν κυρίου
  choice: путь Господа
  rationale: «Путь» сохраняет буквальный образ и переносный смысл; «Господа» передаёт κύριος в цитате из Исаии, не ослабляя её богословского звучания.
- source_word: καθὼς εἶπεν Ἠσαΐας ὁ προφήτης
  choice: как сказал пророк Исаия
  rationale: Естественная русская формула соответствия пророческому слову; порядок «пророк Исаия» нормативен для современного русского языка.
theological_decisions:
- issue: Передача κυρίου в цитате из Исаии
  choice: Господа
  alternative: владыки
  rationale: «Господь» является естественным библейским соответствием κύριος и сохраняет значимость ветхозаветной цитаты, не навязывая дополнительного толкования.
- issue: Синтаксическая связь слов ἐν τῇ ἐρήμῳ
  choice: «в пустыне» относится к «взывающего»
  alternative: «в пустыне» относится к слову «голос»
  rationale: 'Основной текст отражает наиболее естественное прочтение греческой фразы: в пустыне взывает человек, чей голос говорит. Возможная иная синтаксическая связь отмечена в сноске, чтобы не устранять подлинную неоднозначность.'
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Внутренняя цитата выделена вложенными кавычками; формулировка сохраняет образ и синтаксическую неоднозначность исходного текста посредством сноски.
