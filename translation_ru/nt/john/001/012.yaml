    rationale: В тексте «Он дал право стать детьми Бога — тем, кто верит в Его имя» оборот после тире стоит после смыслового завершения главного высказывания. Поэтому неясно, что он поясняет исходное «всем, кто принял Его». В греческом τοῖς πιστεύουσιν уточняет тех же получателей дара.
  revised_text: Но всем, кто принял Его, — тем, кто верит в Его имя, — Он дал право стать детьми Бога.
