source:
  edition: SBLGNT
  text: ὅσοι δὲ ἔλαβον αὐτόν, ἔδωκεν αὐτοῖς ἐξουσίαν τέκνα θεοῦ γενέσθαι, τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/012.yaml
  text: But to all who received him[a], he gave them the right to become children of God—to those who believe in his name,
translation:
  language: ru
  text: Но всем, кто принял Его, — тем, кто верит в Его имя, — Он дал право стать детьми Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅσοι δὲ
  choice: Но всем, кто
  rationale: δὲ передаёт контраст с отвержением в предыдущем стихе, а ὅσοι обозначает всех людей, отвечающих названному условию.
- source_word: ἔλαβον αὐτόν
  choice: принял Его
  rationale: В данном контексте λαμβάνω означает принять или встретить Логоса с верой, а не физически взять; «принял» сохраняет образ исходного текста и не сужает его до одного лишь интеллектуального согласия.
- source_word: ἔδωκεν αὐτοῖς
  choice: Он дал
  rationale: Прямая и естественная передача δίδωμι; адресаты уже выражены оборотом «всем, кто», поэтому отдельное «им» по-русски необязательно.
- source_word: ἐξουσίαν
  choice: право
  rationale: Здесь слово обозначает дарованное полномочие или основание обрести новый статус, а не грубую силу. «Право» ясно и естественно передаёт этот смысл; широта греческого слова отражена в сноске.
- source_word: τέκνα θεοῦ
  choice: детьми Бога
  rationale: τέκνα — гендерно всеохватное обозначение детей, а не специально сыновей; форма «детьми Бога» непосредственно передаёт родительный θεοῦ и звучит понятно в современной русской речи.
- source_word: γενέσθαι
  choice: стать
  rationale: Инфинитив γίνομαι указывает на вхождение в новое состояние; «стать» точнее, чем статическое «быть».
- source_word: τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ
  choice: тем, кто верит в Его имя
  rationale: Причастный оборот уточняет, кто именно принял Его. Перевод сохраняет как глагольный характер веры, так и явно присутствующее в греческом тексте слово «имя».
theological_decisions:
- issue: Соотношение выражений «принял Его» и «верит в Его имя»
  choice: Сохранить оба выражения, присоединив второе через пояснительное тире.
  alternative: Свести оба выражения к одной формулировке о вере или принятии.
  rationale: Греческий текст сохраняет оба выражения; последнее уточняет адресатов, но не отменяет и не исчерпывает первое. Такая передача не устраняет намеренно оставленную богословскую многослойность.
- issue: Обозначение богосыновства
  choice: «детьми Бога»
  alternative: «сынами Бога»
  rationale: В источнике стоит τέκνα, а не υἱοί, поэтому мужское «сыны» неоправданно сужало бы значение.
- issue: Характер дарованной ἐξουσία
  choice: Передать как «право», сохранив альтернативы в сноске.
  alternative: Однозначно истолковать как внутреннюю способность, юридическое право или властное полномочие.
  rationale: Лексема допускает оттенки права, полномочия и возможности; контекст поддерживает дарованный Богом статус, но не требует искусственно устранять всю смысловую широту.
translation_notes:
  register: Современный литературный русский с ясным, достойным звучанием. Заглавные местоимения «Его», «Он» помогают однозначно указать на Логоса в пределах отдельно цитируемого стиха. Пояснительное тире естественно показывает приложение τοῖς πιστεύουσιν, не превращая его в отдельное условие.
