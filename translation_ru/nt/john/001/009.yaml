id: JHN.1.9
reference: John 1:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἦν τὸ φῶς τὸ ἀληθινὸν ὃ φωτίζει πάντα ἄνθρωπον ἐρχόμενον εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/009.yaml
  text: The true light[a], which enlightens every person, was coming into the world.
translation:
  language: ru
  text: Истинный свет[a], который просвещает каждого человека, приходил в мир.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Истинный свет, который просвещает каждого человека, приходящего в мир». Греческое причастие «приходящий» можно отнести к словам «каждого человека», а не к «истинному свету».'
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: свет
  rationale: Обычное существительное сохраняет образ света и его христологическое значение в контексте без искусственного введения прописной буквы.
- source_word: ἀληθινόν
  choice: истинный
  rationale: Передаёт характерное для Иоанна значение подлинного, окончательного и соответствующего высшей реальности.
- source_word: φωτίζει
  choice: просвещает
  rationale: Естественно передаёт как образ света, так и метафорический смысл глагола в данном контексте.
- source_word: πάντα ἄνθρωπον
  choice: каждого человека
  rationale: Точно и естественно передаёт обобщающее единственное число ἄνθρωπον в современном русском языке.
- source_word: ἐρχόμενον εἰς τὸν κόσμον
  choice: приходил в мир
  rationale: В основном тексте причастие по смыслу отнесено к истинному свету; вместе с ἦν оно передано русской формой прошедшего времени несовершенного вида.
- source_word: κόσμον
  choice: мир
  rationale: Стандартное и контекстуально уместное соответствие κόσμος у Иоанна.
- source_word: ἦν
  choice: приходил
  rationale: Значение имперфекта включено в составное русское сказуемое «приходил», поскольку буквальная конструкция с отдельным «был» звучала бы неестественно.
theological_decisions:
- issue: Синтаксическая связь ἐρχόμενον («приходящий»)
  choice: 'По смыслу отнесено к «истинному свету»: «Истинный свет… приходил в мир».'
  alternative: 'Отнесено к «каждому человеку»: «Истинный свет, который просвещает каждого человека, приходящего в мир».'
  rationale: Форма причастия грамматически может определять ἄνθρωπον, однако контекст пролога и характерное для Иоанна выражение о приходе в мир поддерживают христологическое прочтение. Подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; стиль простой и достоинственный. Метафора света сохранена, синтаксис сделан естественным для русского читателя, а неоднозначность греческой конструкции отмечена в сноске.
