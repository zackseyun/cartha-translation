lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: На следующий день
  rationale: Естественно передаёт временную последовательность повествования.
- source_word: ἠθέλησεν
  choice: захотел
  rationale: Сохраняет значение желания или намерения, не усиливая его до твёрдо принятого решения.
- source_word: ἐξελθεῖν εἰς τὴν Γαλιλαίαν
  choice: отправиться в Галилею
  rationale: В современном русском это естественная передача движения к месту назначения; буквальное «выйти в Галилею» звучало бы неясно без явно названного исходного места.
- source_word: εὑρίσκει ... λέγει
  choice: находит ... говорит
  rationale: Настоящее время сохраняет характерный для греческого текста исторический презенс и живость повествования.
- source_word: Ἀκολούθει μοι
  choice: Следуй за Мной
  rationale: Точно и естественно передаёт повеление, сохраняя как буквальное следование, так и призыв стать учеником.
- source_word: Φίλιππον
  choice: Филиппа
  rationale: Традиционная русская форма личного имени.
- source_word: ὁ Ἰησοῦς
  choice: Иисус
  rationale: Явно названный субъект сохранён и поставлен в начале предложения для ясности русского повествования.
theological_decisions:
- issue: Смысл повеления Иисуса Филиппу
  choice: «Следуй за Мной» — формулировка, допускающая призыв к ученичеству
  alternative: Простое приглашение физически сопровождать Иисуса
  rationale: Контекст включает реальное передвижение, но евангельское употребление выражения также несёт смысл ученичества. Перевод сохраняет оба смысловых уровня, не разъясняя один за счёт другого.
translation_notes:
  register: Современный литературный русский язык, естественный и достойный. Местоимение «Мной» написано с прописной буквы как устойчивая русская типографическая форма почтительного отношения к Иисусу; дополнительных конфессиональных уточнений не внесено.
