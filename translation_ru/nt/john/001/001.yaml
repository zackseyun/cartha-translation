  text: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: ru
  text: В начале[b] было Слово, и Слово было с Богом, и Слово было Богом[a].
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'Или: «Слово было божественным»; или: «чем был Бог, тем было и Слово». Греческая конструкция в заключительной части стиха имеет качественный оттенок: она характеризует Слово и не отождествляет его с Богом, упомянутым в предыдущей части.'
    reason: alternative_reading
  - marker: b
    text: Слова «В начале» перекликаются с Быт. 1:1 и связывают Слово с началом творения.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: В начале
  rationale: Сохраняет прямую связь с Быт. 1:1 и естественно звучит по-русски.
- source_word: ἦν
  choice: было
  rationale: Имперфект εἰμί естественно передаётся формой «было»; повтор поддерживает ритм оригинала и указывает на существование Слова уже в начале.
- source_word: ὁ λόγος
  choice: Слово
  rationale: Традиционное и семантически ёмкое обозначение, сохраняющее связь с речью и откровением и не сводящее λόγος к «разуму» или «вестью».
- source_word: πρὸς τὸν θεόν
  choice: с Богом
  rationale: В данном контексте естественно передаёт личную соотнесённость и общение, сохраняя различие между Словом и Богом.
- source_word: θεὸς ἦν ὁ λόγος
  choice: Слово было Богом
  rationale: Передаёт качественную силу безартиклевого θεός и утверждает божественную природу Слова, не отождествляя его как личность с Богом из предыдущей части фразы.
theological_decisions:
- issue: Передача безартиклевого предикативного θεός в заключительной части стиха
  choice: Слово было Богом
  alternative: Слово было божественным; чем был Бог, тем было и Слово
  rationale: Основной вариант наиболее прямо и естественно передаёт сильное утверждение оригинала. Примечание сохраняет качественный оттенок конструкции и личностное различие, не ослабляя θεός до неопределённого «бога».
translation_notes:
  register: Современный литературный русский язык с достоинством и лаконичным ритмом. Сохранён трёхчастный параллелизм оригинала. «Слово» и «Бог» написаны с прописной буквы как личностные обозначения в данном контексте.
