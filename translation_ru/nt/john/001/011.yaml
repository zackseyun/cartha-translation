  yaml_path: translation/nt/john/001/011.yaml
  text: He came to his own[b][a], and his own people did not receive him.
translation:
  language: ru
  text: Он пришёл к тому, что принадлежало Ему[a], но Его собственные не приняли Его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к тому, что было Его»; форма среднего рода во множественном числе может означать то, что Ему принадлежало, — Его владения, область или дом.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «не приняли Его» в смысле «не оказали Ему радушного приёма»; возможно также: «не признали Его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὰ ἴδια
  choice: к тому, что принадлежало Ему
  rationale: Субстантивированное прилагательное среднего рода во множественном числе обозначает принадлежащее Ему — Его владение, область или дом, — а не прямо людей. Такая формулировка сохраняет широту греческого выражения и его отличие от следующего мужского множественного числа.
- source_word: ἦλθεν
  choice: пришёл
  rationale: Прямой и естественный эквивалент аориста ἔρχομαι, передающий простое повествовательное движение.
- source_word: οἱ ἴδιοι
  choice: Его собственные
  rationale: Мужской род множественного числа указывает на людей. «Его собственные» сохраняет словесную связь с первым ἴδια и не сужает круг обозначаемых лиц до конкретно названного народа или семьи.
- source_word: παρέλαβον
  choice: не приняли
  rationale: В данном контексте παραλαμβάνω означает принять человека, включая оттенки признания и радушного приёма; русский глагол «приняли» сохраняет эту смысловую широту.
- source_word: αὐτόν
  choice: Его
  rationale: Местоимение относится к воплощённому Слову; в русском переводе естественно передаётся личным местоимением.
theological_decisions:
- issue: Соотношение двух употреблений ἴδιος
  choice: Первое выражение относится к тому, что принадлежало Ему, а второе — к Его собственным людям.
  alternative: Оба выражения можно понимать как относящиеся к Его народу; первое также можно конкретизировать как Его дом или родную землю.
  rationale: Переход от среднего множественного τὰ ἴδια к мужскому множественному οἱ ἴδιοι создаёт намеренное различие между принадлежащей Ему сферой и принадлежащими Ему людьми. Перевод сохраняет это различие, не определяя сферу чрезмерно узко.
- issue: Смысл παρέλαβον
  choice: «не приняли»
  alternative: «не признали» или «не встретили с радушием»
  rationale: «Не приняли» допускает как личное непризнание, так и отсутствие радушного приёма, не сводя смысл лишь к гостеприимству или интеллектуальному согласию.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Заглавная буква в местоимениях, относящихся ко Христу, следует принятой русской библейской издательской традиции. Союз «но» естественно выражает контраст, который в греческом передан καί в противительном по смыслу контексте.
