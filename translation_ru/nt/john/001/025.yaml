  text: καὶ ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ· Τί οὖν βαπτίζεις εἰ σὺ οὐκ εἶ ὁ χριστὸς ⸂οὐδὲ Ἠλίας οὐδὲ⸃ ὁ προφήτης;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/025.yaml
  text: And they asked him and said to him[a], “Why then are you baptizing, if you are not the Messiah, nor Elijah[b], nor the Prophet?”
translation:
  language: ru
  text: 'И они спросили его: «Почему же ты крестишь, если ты не Мессия, не Илия и не тот Пророк[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Тот Пророк» — определённая ожидаемая фигура; вероятно, имеется в виду пророк, подобный Моисею (см. Втор. 18:15).
    reason: cross_reference
lexical_decisions:
- source_word: ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ
  choice: они спросили его
  rationale: Русское «спросили» естественно передаёт единый речевой ввод; буквальное удвоение «спросили его и сказали ему» в современном русском тяжеловесно и не добавляет содержания.
- source_word: Τί οὖν βαπτίζεις
  choice: Почему же ты крестишь
  rationale: В данном вопросе τί с οὖν запрашивает основание действия; «почему же» естественно передаёт эту силу. Настоящее время сохраняет продолжающуюся практику Иоанна.
- source_word: ὁ χριστός
  choice: Мессия
  rationale: Χριστός здесь является титулом ожидаемого Помазанника; «Мессия» сохраняет иудейский контекст вопроса.
- source_word: Ἠλίας
  choice: Илия
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: ὁ προφήτης
  choice: тот Пророк
  rationale: Артикль указывает не на любого пророка, а на определённую ожидаемую фигуру; указательное «тот» ясно и естественно выражает это по-русски.
- source_word: οὐδὲ ... οὐδὲ
  choice: не ... и не
  rationale: После общего отрицания русская конструкция «не Мессия, не Илия и не тот Пророк» естественно координирует три отвергнутых отождествления.
theological_decisions:
- issue: Передача Χριστός в вопросе об отождествлении Иоанна
  choice: Мессия
  alternative: Христос
  rationale: В контексте перечисления ожидаемых иудейских фигур слово функционирует как титул, поэтому «Мессия» яснее сохраняет историко-религиозный смысл.
- issue: Понимание ὁ προφήτης как определённой ожидаемой фигуры
  choice: тот Пророк
  alternative: пророк
  rationale: Определённый артикль и контекст отличают эту фигуру и от Илии, и от пророков вообще; перевод сохраняет определённость, не утверждая сверх текста точного отождествления.
translation_notes:
  register: Современный литературный русский язык с естественным синтаксисом и умеренно торжественным библейским регистром. Избыточная греческая формула речевого ввода сглажена; титульная определённость сохранена.
