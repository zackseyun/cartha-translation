id: JHN.1.10
reference: John 1:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐν τῷ κόσμῳ ἦν, καὶ ὁ κόσμος δι’ αὐτοῦ ἐγένετο, καὶ ὁ κόσμος αὐτὸν οὐκ ἔγνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/010.yaml
  text: He was in the world[a], and the world came into being through him[b], and the world did not know him.
translation:
  language: ru
  text: Он был в мире, и мир через него возник[a], и мир его не познал[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был сотворён через него». Греческий глагол означает «возник», «стал существовать».'
    reason: lexical_alternative
  - marker: b
    text: «Не познал его» может также подразумевать «не узнал его» или «не признал его».
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμῳ / κόσμος
  choice: мир
  rationale: 'Троекратное «мир» сохраняет повтор исходного текста и его многослойность: сотворённый мир, обитаемый мир и человечество, отчуждённое от своего Творца.'
- source_word: ἦν
  choice: был
  rationale: Простая форма «был» передаёт продолжающееся присутствие и сохраняет контраст с ἐγένετο — «возник».
- source_word: δι’ αὐτοῦ
  choice: через него
  rationale: διά с родительным падежом выражает посредничество или средство; «через него» естественно передаёт эту роль и согласуется с Ин. 1:3.
- source_word: ἐγένετο
  choice: возник
  rationale: Глагол обозначает появление или вступление в бытие. «Возник» ясно отличается от «был» и сохраняет намеренный контраст между существованием Логоса и возникновением мира.
- source_word: ἔγνω
  choice: не познал
  rationale: «Не познал» сохраняет основное значение γινώσκω и его характерную для Иоанна глубину, не сводя смысл только к узнаванию или признанию.
- source_word: αὐτόν / αὐτοῦ
  choice: его / него
  rationale: Местоимения отсылают к Логосу из ближайшего контекста и сохраняют личный характер референта. Строчные буквы соответствуют нейтральной современной русской орфографии и не добавляют конфессиональной маркировки.
theological_decisions:
- issue: Подразумеваемое подлежащее
  choice: Личное местоимение «Он», относящееся к Логосу из ближайшего контекста.
  alternative: Безличная или среднеродовая передача, ориентированная лишь на грамматический род слова «слово».
  rationale: Хотя в греческом стихе подлежащее прямо не названо, контекст Ин. 1:1–9 указывает на личного референта мужского рода. Русское «Он» сохраняет эту дискурсивную связь, не добавляя нового утверждения.
- issue: Различие между ἦν и ἐγένετο
  choice: Передать как «был» и «возник».
  alternative: Передать ἐγένετο как «был сотворён».
  rationale: Так сохраняется текстовый контраст между продолжающимся бытием Логоса и вступлением мира в существование, без внесения в основной текст более узкого глагола «сотворить».
- issue: Связь последней части стиха
  choice: Сохранить повторяющийся союз «и».
  alternative: Использовать «но», явно обозначив противопоставление.
  rationale: Греческий текст повторяет καί. Хотя контекст допускает противительный оттенок, «и» сохраняет формальную неоднозначность и нарастающий ритм высказывания.
translation_notes:
  register: Современный литературный русский язык с достоинством и простым синтаксисом. Повтор слова «мир» и союза «и» сохранён ради структуры и ритма оригинала. «Познал» несколько возвышенно, но понятно и передаёт более широкий смысл, чем одно лишь визуальное узнавание. Местоимения, относящиеся к Логосу, даны со строчной буквы как нейтральная орфографическая практика.
