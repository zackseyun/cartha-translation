  text: οὗτος ἦν ἐν ἀρχῇ πρὸς τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/002.yaml
  text: He was in the beginning with God[a].
translation:
  language: ru
  text: Он был в начале с Богом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Этот был в начале с Богом».'
    reason: Лексическая альтернатива для οὗτος; основной текст использует более естественное русское местоимение «Он».
lexical_decisions:
- source_word: οὗτος
  choice: Он
  rationale: Указательное местоимение относится к Слову из Ин. 1:1. Русское личное местоимение естественно передаёт эту анафорическую связь; буквальное «этот» здесь звучало бы неестественно и могло бы приобрести нежелательный оттенок.
- source_word: ἦν
  choice: был
  rationale: Имперфект глагола εἰμί обозначает продолжавшееся состояние. «Был» точно и естественно передаёт его без добавочного толкования.
- source_word: ἐν ἀρχῇ
  choice: в начале
  rationale: Так сохраняется явная перекличка с Быт. 1:1 и повтор формулировки Ин. 1:1.
- source_word: πρὸς
  choice: с
  rationale: В сочетании с винительным падежом здесь предлог выражает близость, личную соотнесённость и различение. Русское «с» передаёт это кратко и естественно, не уточняя метафизический смысл сверх текста.
- source_word: τὸν θεόν
  choice: Богом
  rationale: Определённый артикль отдельно не воспроизводится, поскольку в русском языке его нет; форма творительного падежа обусловлена предлогом «с».
theological_decisions:
- issue: К кому относится οὗτος
  choice: Местоимение относится к Слову и передано как «Он».
  alternative: «Этот»
  rationale: Стих вновь указывает на Слово из предыдущего стиха. Личное местоимение сохраняет этот референт, не добавляя к тексту дополнительных догматических формулировок.
- issue: Смысл πρὸς τὸν θεόν
  choice: «с Богом»
  alternative: «к Богу»; «в присутствии Бога»
  rationale: Перевод сохраняет одновременно близкую соотнесённость Слова с Богом и их различение, не снимая богословского напряжения исходного текста.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная формулировка сохраняет синтаксический параллелизм и перекличку с Ин. 1:1 и Быт. 1:1.
