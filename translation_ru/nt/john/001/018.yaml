base_translation:
  language: en
  yaml_path: translation/nt/john/001/018.yaml
  text: No one has ever seen God[a]; the one and only God, who is in the bosom of the Father[c][b], has made him known.
translation:
  language: ru
  text: Бога никто никогда не видел. Бог, единственный в Своём роде[a], пребывающий в лоне Отца[b], открыл Его[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «единственный Сын»; традиционно также переводят: «Единородный Сын» — вместо «Бог, единственный в Своём роде».'
    reason: textual_variant
  - marker: b
    text: 'Или: «у сердца Отца». Буквально греческий текст говорит: «в лоне Отца», выражая глубочайшую близость.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «изъяснил Его», «явил Его» либо «поведал о Нём».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: Бога
  rationale: Прямое дополнение при ἑώρακεν; стандартное обозначение Бога в абсолютном употреблении.
- source_word: οὐδεὶς
  choice: никто
  rationale: Естественно передаёт всеобщее отрицание в современном русском языке.
- source_word: ἑώρακεν πώποτε
  choice: никогда не видел
  rationale: Русское сочетание «никто никогда не видел» естественно передаёт отрицательный перфект с πώποτε и сохраняет смысл «ни в какое время вплоть доныне».
- source_word: μονογενὴς θεὸς
  choice: Единственный Бог
  rationale: Следует чтению SBLGNT с θεός. «Единственный» передаёт значение уникальности μονογενής, не вкладывая в само слово спорную этимологическую идею рождения.
- source_word: ὁ ὢν
  choice: пребывающий
  rationale: Причастная форма сохраняет длительный характер греческого ὁ ὢν и звучит естественно в возвышенном литературном регистре.
- source_word: εἰς τὸν κόλπον τοῦ πατρὸς
  choice: в лоне Отца
  rationale: Сохраняет образ κόλπος — груди, лона — и выраженную им глубочайшую близость, не заменяя метафору толкованием.
- source_word: ἐκεῖνος
  choice: не передано отдельным местоимением
  rationale: В русском предложении отдельное «Он» было бы синтаксически избыточным; эмфатический референт ясно обозначен подлежащим «Единственный Бог».
- source_word: ἐξηγήσατο
  choice: открыл Его
  rationale: Передаёт контекстуальный смысл раскрытия и явления Бога людям; более буквальные оттенки «изъяснил» и «поведал» отмечены в сноске.
theological_decisions:
- issue: Разночтение μονογενὴς θεὸς / ὁ μονογενὴς υἱός
  choice: 'Основной текст следует SBLGNT: «Единственный Бог».'
  alternative: «единственный Сын» или традиционное «Единородный Сын»
  rationale: Поскольку заданный греческий источник содержит θεός, это чтение должно стоять в основном тексте; важное христологическое разночтение открыто приведено в сноске.
- issue: Значение μονογενής
  choice: «Единственный»
  alternative: «Единородный» или «единственный в своём роде»
  rationale: Перевод передаёт уникальность без молчаливого решения вопроса о происхождении слова и без внесения дополнительного догматического содержания.
- issue: Образ κόλπος Отца
  choice: 'Сохранить метафору: «в лоне Отца».'
  alternative: «рядом с Отцом» или «у сердца Отца»
  rationale: Греческий текст выражает не только местоположение, но особую близость; сохранение образа позволяет не сводить его к одному толкованию.
- issue: Смысл ἐξηγήσατο
  choice: «открыл Его»
  alternative: «изъяснил Его», «поведал о Нём»
  rationale: Так передаётся откровение невидимого Бога через названного Единственного Бога, однако более буквальные смысловые оттенки сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Лоно» сохранено ради исходной метафоры; менее образная формулировка дана в сноске. Заглавные буквы в «Отец» и относящемся к Богу местоимении «Его» помогают ясности референции и соответствуют принятому русскому библейскому оформлению.
