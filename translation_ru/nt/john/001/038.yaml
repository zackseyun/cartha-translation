  text: στραφεὶς δὲ ὁ Ἰησοῦς καὶ θεασάμενος αὐτοὺς ἀκολουθοῦντας λέγει αὐτοῖς· Τί ζητεῖτε; οἱ δὲ εἶπαν αὐτῷ· Ῥαββί (ὃ λέγεται ⸀μεθερμηνευόμενον Διδάσκαλε), ποῦ μένεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/038.yaml
  text: Then Jesus turned and[a], seeing them following, said to them, “What are you seeking?” They said to him, “Rabbi” (which translated means Teacher)[c][b], “where are you staying?”
translation:
  language: ru
  text: 'Иисус обернулся и, увидев, что они идут за Ним, говорит им: «Что вы ищете?» Они сказали Ему: «Равви» (что в переводе означает «Учитель»)[a], где Ты остановился?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Равви» — еврейское или арамейское почтительное обращение к учителю.
    reason: cultural_note
  - marker: b
    text: 'Также возможно перевести: «где Ты пребываешь?» Тот же греческий глагол в других местах Евангелия от Иоанна часто переводится как «оставаться» или «пребывать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: обернулся
  rationale: Передаёт предшествующее речи движение Иисуса естественным современным русским языком, не добавляя лишних деталей.
- source_word: θεασάμενος
  choice: увидев
  rationale: Кратко и естественно передаёт зрительное восприятие; контекст показывает, что Иисус заметил идущих за Ним.
- source_word: ἀκολουθοῦντας
  choice: идут за Ним
  rationale: Сохраняет буквальную ситуацию движения вслед за Иисусом и не устраняет возможный оттенок зарождающегося ученичества.
- source_word: Τί ζητεῖτε;
  choice: Что вы ищете?
  rationale: Глагол ζητέω допускает как обычный смысл поиска, так и более глубокий смысл стремления; русский вопрос сохраняет эту многозначность.
- source_word: Ῥαββί
  choice: Равви
  rationale: Семитский титул сохранён в транслитерации, поскольку сам текст непосредственно даёт его перевод.
- source_word: μεθερμηνευόμενον Διδάσκαλε
  choice: что в переводе означает «Учитель»
  rationale: Естественно воспроизводит авторское пояснение; форма «Учитель» сохраняет обращение, выраженное звательным падежом Διδάσκαλε.
- source_word: ποῦ μένεις;
  choice: где Ты остановился?
  rationale: В данном контексте μένω обозначает место временного пребывания. «Остановился» звучит естественно и не навязывает развитый богословский смысл глагола у Иоанна.
theological_decisions:
- issue: Возможная двойная значимость ζητέω в повествовании Иоанна
  choice: Что вы ищете?
  alternative: Что вам нужно? / Кого вы ищете?
  rationale: '«Ищете» сохраняет открытость вопроса: он относится к непосредственному намерению учеников, но может иметь и более глубокий духовный оттенок.'
- issue: Передача μένω при его последующей богословской значимости у Иоанна
  choice: где Ты остановился?
  alternative: где Ты пребываешь?
  rationale: Непосредственный смысл вопроса — узнать место пребывания Иисуса. Вариант «пребываешь» лучше сохранял бы словесную связь с последующими местами, но в современном русском здесь звучал бы возвышенно и мог бы преждевременно усиливать богословский подтекст.
translation_notes:
  register: Современный литературный русский язык с уважительным написанием местоимений, обращённых к Иисусу. Синтаксис сохраняет последовательность действий оригинала, но избегает тяжеловесности. Реплики оформлены естественно; возможная смысловая глубина ζητέω сохранена, а оттенок μένω отмечен в сноске.
