  yaml_path: translation/nt/john/001/003.yaml
  text: All things came into being through him[a], and apart from him not even one thing came into being that has come into being.
translation:
  language: ru
  text: Всё возникло через Него[a], и без Него не возникло ничто из того, что возникло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, если отнести последние слова к началу стиха 4: «То, что возникло в Нём, было жизнью».'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: Всё
  rationale: Средний род множественного числа имеет всеохватный смысл. Русское «всё» естественно передаёт совокупность всего существующего, не сужая космического охвата высказывания.
- source_word: δι’ αὐτοῦ
  choice: через Него
  rationale: διά с родительным падежом обозначает посредство или действующую причину. «Через Него» сохраняет эту смысловую связь и звучит естественно в возвышенном прологе.
- source_word: ἐγένετο
  choice: возникло
  rationale: Здесь γίνομαι означает вступление в существование. «Возникло» передаёт этот онтологический смысл точнее, чем «было сделано», и позволяет последовательно воспроизвести повтор глагола.
- source_word: χωρὶς αὐτοῦ
  choice: без Него
  rationale: χωρίς выражает отсутствие или отделённость. В данном отрицательном обороте «без Него» — наиболее естественная и точная современная русская формулировка.
- source_word: οὐδὲ ἕν
  choice: не возникло ничто
  rationale: 'οὐδέ с ἕν образует усиленное и исчерпывающее отрицание. Русское «ничто» в сочетании с повтором «не возникло» ясно передаёт: нет ни единого исключения.'
- source_word: ὃ γέγονεν
  choice: из того, что возникло
  rationale: При присоединении оборота к стиху 3 эта формулировка естественно ограничивает «ничто» всем, что получило бытие. Результативность перфекта γέγονεν в русском контексте достаточно выражена самим фактом существования возникшего; буквальное «что возникло и существует» было бы избыточным.
theological_decisions:
- issue: Связь заключительного оборота ὃ γέγονεν
  choice: 'Присоединить к стиху 3: «не возникло ничто из того, что возникло»'
  alternative: 'Начать им стих 4: «То, что возникло в Нём, было жизнью»'
  rationale: В ранней рукописной традиции не было исходной пунктуации, поэтому оборот допускает обе синтаксические связи. Основной текст следует данной пунктуации SBLGNT и связно подчёркивает всеобщность возникновения через Логос; подлинная неоднозначность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим стилю пролога. Заглавное «Него» принято как традиционное русское уважительное написание местоимения, относящегося к Логосу; оно не добавляет отдельного толкования. Трёхкратный повтор «возникло» намеренно отражает повтор форм γίνομαι в греческом тексте.
