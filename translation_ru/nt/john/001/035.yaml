  text: На следующий день Иоанн снова стоял там с двумя своими учениками.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: На следующий день
  rationale: Артикль с ἐπαύριον образует временное выражение «на следующий день»; этот вариант естественен для современного русского повествования.
- source_word: πάλιν
  choice: снова
  rationale: Передаёт повторение и связь с предшествующей сценой.
- source_word: εἱστήκει
  choice: стоял там
  rationale: Форма описывает продолжавшееся состояние в прошлом. «Там» не выражено отдельным словом, но естественно обозначает место действия и делает русскую фразу завершённой.
- source_word: ὁ Ἰωάννης
  choice: Иоанн
  rationale: Традиционная русская форма имени; уточнение «Креститель» не добавляется, поскольку его нет в греческом тексте.
- source_word: καὶ ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: с двумя своими учениками
  rationale: Греческая конструкция буквально называет Иоанна и «двух из его учеников» в одной сцене. Русское «с двумя своими учениками» ясно и естественно передаёт их присутствие рядом с ним и сохраняет значение принадлежности к кругу его учеников.
