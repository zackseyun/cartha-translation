  text: ⸀ὁ ὀπίσω μου ⸀ἐρχόμενος, οὗ ⸂οὐκ εἰμὶ⸃ ἄξιος ἵνα λύσω αὐτοῦ τὸν ἱμάντα τοῦ ὑποδήματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/027.yaml
  text: the one coming after me[a], whose sandal strap I am not worthy to untie.
translation:
  language: ru
  text: Тот, кто приходит после меня, — тот, ремешок чьей сандалии я недостоин развязать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὀπίσω μου ἐρχόμενος
  choice: Тот, кто идёт за мной
  rationale: Субстантивированное причастие обозначает конкретного человека. Формулировка сохраняет идею следования за Иоанном и не уточняет сверх текста, идёт ли речь прежде всего о времени, последовательности служения или положении позади.
- source_word: οὗ
  choice: его
  rationale: Родительное относительное местоимение выражает принадлежность; в естественном русском синтаксисе это передано притяжательным местоимением при слове «сандалии».
- source_word: οὐκ εἰμὶ ἄξιος
  choice: я недостоин
  rationale: Точно и естественно передаёт значение недостоинства или несоответствия и сохраняет выраженное Иоанном смирение.
- source_word: ἵνα λύσω
  choice: развязать
  rationale: После выражения достоинства конструкция ἵνα с сослагательным наклонением естественно передаётся русским инфинитивом; λύω здесь означает развязать или ослабить крепление обуви.
- source_word: ἱμάντα
  choice: ремешок
  rationale: В контексте сандалии слово обозначает кожаный ремень или ремешок; уменьшительная форма естественна для детали обуви и не добавляет эмоциональной окраски.
- source_word: τοῦ ὑποδήματος
  choice: сандалии
  rationale: Хотя слово может обозначать обувь шире, «сандалия» исторически и контекстуально точно и понятно современному читателю.
theological_decisions:
- issue: Значение выражения «за мной» применительно к Грядущему
  choice: Сохранено «идёт за мной», допускающее временную последовательность и образ следования
  alternative: «приходит после меня»
  rationale: Контекст указывает на того, кто появляется в служении после Иоанна, но сам оборот допускает также пространственный образ. Перевод не вносит в эту фразу прямо выраженное утверждение о превосходстве из соседних стихов.
translation_notes:
  register: Современный литературный русский язык; краткая, достоинственная фраза. Тире отделяет обозначение Грядущего от признания Иоанна и делает сложную относительную конструкцию естественной без изменения смысла.
