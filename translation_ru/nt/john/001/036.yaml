base_translation:
  language: en
  yaml_path: translation/nt/john/001/036.yaml
  text: And looking at Jesus as he was walking, he says, “Look, the Lamb of God!”
translation:
  language: ru
  text: 'И, пристально взглянув на идущего Иисуса, он сказал: «Вот Агнец Божий!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: пристально посмотрев
  rationale: Глагол обозначает направленный, внимательный взгляд; перевод сохраняет большую выразительность, чем нейтральное «увидев».
- source_word: περιπατοῦντι
  choice: проходившего мимо
  rationale: Причастие описывает Иисуса в движении; в данном эпизоде естественное русское выражение передаёт, что он шёл поблизости, не уточняя направление.
- source_word: λέγει
  choice: сказал
  rationale: Историческое настоящее греческого повествования естественно передано русским прошедшим временем.
- source_word: Ἴδε
  choice: Вот
  rationale: Краткое указательное восклицание естественно и непосредственно привлекает внимание слушателей.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: Агнец Божий
  rationale: Сохраняется традиционный и богословски значимый образ; родительный τοῦ θεοῦ передан без уточнения типа отношения.
theological_decisions:
- issue: Значение родительного оборота τοῦ θεοῦ
  choice: Агнец Божий
  alternative: Агнец от Бога / Агнец, принадлежащий Богу
  rationale: Буквенная и укоренённая формулировка сохраняет возможные смысловые оттенки происхождения, принадлежности и назначения, не выбирая один из них.
translation_notes:
  register: Современный литературный русский с достоинством и ясностью; традиционное «Агнец Божий» сохранено, тогда как синтаксис сделан естественным для современного читателя.
