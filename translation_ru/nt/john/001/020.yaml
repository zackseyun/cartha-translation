  text: καὶ ὡμολόγησεν καὶ οὐκ ἠρνήσατο, καὶ ὡμολόγησεν ὅτι ⸂Ἐγὼ οὐκ εἰμὶ⸃ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/020.yaml
  text: And he confessed and did not deny[a], but confessed, “I am not the Messiah.”
translation:
  language: ru
  text: 'Он признал и не отрицал, и признал: «Я не Мессия[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческий титул Χριστός (Христос) здесь обозначает ожидаемого Мессию.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡμολόγησεν
  choice: признал
  rationale: Глагол передаёт открытое, публичное признание. Повтор слова «признал» сохраняет настойчивую риторическую структуру греческого текста.
- source_word: οὐκ ἠρνήσατο
  choice: не стал отрицать
  rationale: Так естественно по-русски передаётся прямое отрицание того, что Иоанн уклонился от ответа или отверг истину.
- source_word: καὶ ... καὶ ... καὶ
  choice: и ... и ... а ...
  rationale: Повтор союзов в греческом создаёт усиление; русское «а» перед заключительным признанием естественно обозначает подчёркнутое разъяснение, не устраняя риторического нарастания.
- source_word: Ἐγὼ οὐκ εἰμὶ
  choice: Я не
  rationale: Прямое «Я не» передаёт категоричность отрицания; дополнительное «сам» по-русски было бы избыточным и могло бы привнести отсутствующее противопоставление.
- source_word: ὁ χριστός
  choice: Мессия
  rationale: Здесь Χριστός употреблено как титул ожидаемого Помазанника, а не как имя, поэтому «Мессия» ясно передаёт функцию слова в иудейском контексте.
theological_decisions:
- issue: Передача Χριστός как мессианского титула
  choice: Мессия
  alternative: Христос
  rationale: Иоанн отрицает, что он является ожидаемым Помазанником. «Мессия» сохраняет титульный смысл и исторический контекст, тогда как вариант «Христос» дан в сноске как традиционное соответствие.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной синтаксической структурой. Намеренный повтор «признал» сохраняет эмфазу оригинала; «открыто» раскрывает публичный характер ὁμολογέω.
