    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός ἐστιν
  choice: Это Тот
  rationale: Указательное местоимение со связкой вводит торжественное и подчёркнутое отождествление; формулировка естественна для современного литературного русского языка.
- source_word: ὑπὲρ οὗ ἐγὼ εἶπον
  choice: о Ком я сказал
  rationale: После глагола речи ὑπέρ указывает на того, о ком было сказано; «о Ком» передаёт это кратко и естественно.
- source_word: Ὀπίσω μου ἔρχεται
  choice: Следом за мной идёт
  rationale: ὀπίσω с родительным падежом здесь выражает следование, прежде всего во времени и порядке появления; русский оборот сохраняет образ движения и сравнительную структуру.
- source_word: ἀνὴρ
  choice: Человек
  rationale: В данном контексте слово обозначает взрослого мужчину — Иисуса. Русское «Человек» звучит естественно и достойно применительно к конкретному лицу, тогда как «мужчина» здесь было бы стилистически сниженным и излишне биологическим.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: стал впереди меня
  rationale: Совершенная форма γέγονεν обозначает возникшее и сохраняющееся положение впереди. Перевод удерживает неоднозначность между первенством в последовательности и превосходством по положению; возможный смысл более высокого ранга вынесен в примечание.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит основание предшествующего утверждения и естественно передаётся причинным оборотом.
- source_word: πρῶτός μου ἦν
  choice: был прежде меня
  rationale: Фраза компактно выражает приоритет, способный включать временное предшествование и более высокий статус. Такой перевод сохраняет богословское напряжение и не разворачивает неявный смысл прямо в основном тексте.
theological_decisions:
- issue: Насколько явно выразить предсуществование Христа в заключительной части стиха
  choice: был прежде меня
  alternative: существовал прежде меня
  rationale: В контексте Евангелия от Иоанна выражение весомо указывает на предсуществование Иисуса, однако греческий текст сформулирован компактнее. Основной перевод сохраняет как временной смысл, так и оттенок первенства, не разрешая неоднозначность посредством поясняющего добавления.
- issue: Передача ἔμπροσθέν μου γέγονεν как временного первенства или превосходства по положению
  choice: стал впереди меня
  alternative: занял более высокое положение, чем я
  rationale: Греческая конструкция допускает представление о первенстве и превосходстве, а не только о временной последовательности. Образный основной перевод сохраняет широту выражения; более явное указание на ранг дано в примечании.
translation_notes:
  register: Современный литературный и достойный регистр. Заглавные буквы в «Тот», «Ком» и «Человек» подчёркивают личное отнесение к Иисусу без добавления отсутствующего в тексте титула. Синтаксический параллелизм «за мной — впереди меня — прежде меня» по возможности сохраняет риторическую структуру греческого оригинала.
