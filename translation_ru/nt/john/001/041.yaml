  source_fidelity: 'Основной смысл передан точно: πρῶτον передано как «сначала», исторические настоящие εὑρίσκει/λέγει сохранены, а перфект Εὑρήκαμεν естественно передан совершенным прошедшим «мы нашли». Однако внутритекстовое пояснение μεθερμηνευόμενον χριστός призвано объяснить читателю смысл «Мессии». Формальное «Христос» в скобках не выполняет этой функции для современного русского читателя без обращения к сноске. «Помазанник» передаёт семантику χριστός и сохраняет объяснительный характер авторской ремарки.'
  naturalness: Текст в целом литературный и естественный. Формулировка «что переводится как “Помазанник”» короче и идиоматичнее, чем «что в переводе означает», при этом яснее показывает характер пояснения.
