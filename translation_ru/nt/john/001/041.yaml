  text: εὑρίσκει οὗτος ⸀πρῶτον τὸν ἀδελφὸν τὸν ἴδιον Σίμωνα καὶ λέγει αὐτῷ· Εὑρήκαμεν τὸν Μεσσίαν (ὅ ἐστιν μεθερμηνευόμενον χριστός).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/041.yaml
  text: He first found his own brother Simon and said to him[a], “We have found the Messiah” (which means Messiah).
translation:
  language: ru
  text: 'Сначала он находит своего брата Симона и говорит ему: «Мы нашли Мессию» (что переводится как «Помазанник»).[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте здесь стоит χριστός («Христос»). И «Мессия», и χριστός означают «Помазанник».
    reason: Поясняет, что «Помазанник» передаёт смысл греческого χριστός, сохраняя при этом традиционную русскую форму титула «Христос».
lexical_decisions:
- source_word: εὑρίσκει
  choice: находит
  rationale: 'Историческое настоящее сохранено: в русском повествовании оно звучит естественно и передаёт живость греческого текста.'
- source_word: οὗτος
  choice: он
  rationale: Местоимение естественно отсылает к Андрею, названному в предыдущем стихе; буквальное «этот» здесь было бы тяжеловесно.
- source_word: πρῶτον
  choice: сначала
  rationale: Передаёт последовательность действий, не создавая возможного ложного впечатления, будто Андрей первым среди нескольких людей нашёл Симона.
- source_word: τὸν ἀδελφὸν τὸν ἴδιον
  choice: своего брата
  rationale: Возвратное притяжательное местоимение естественно передаёт принадлежность и акцент ἴδιον; добавление «родного» без необходимости усилило бы формулировку.
- source_word: Σίμωνα
  choice: Симона
  rationale: Имя передано в принятой русской библейской форме.
- source_word: λέγει αὐτῷ
  choice: говорит ему
  rationale: Сохранено историческое настоящее и прямое соответствие глаголу речи.
- source_word: Εὑρήκαμεν
  choice: мы нашли
  rationale: Русское прошедшее совершенного вида естественно передаёт результативность греческого перфекта и сохраняет актуальность сделанного открытия.
- source_word: Μεσσίαν
  choice: Мессию
  rationale: Сохранён семитский титул Μεσσίας в его традиционной русской форме.
- source_word: μεθερμηνευόμενον
  choice: что в переводе означает
  rationale: Формулировка ясно вводит греческий эквивалент семитского титула и естественна для современного русского читателя.
- source_word: χριστός
  choice: Христос
  rationale: Передан традиционный русский эквивалент греческого титула χριστός; сноска раскрывает его буквальное значение и сохраняет пояснительную функцию скобок.
theological_decisions:
- issue: Передача соотношения Μεσσίας и χριστός
  choice: «Мессия» … «Христос» с пояснительной сноской «оба титула означают Помазанник»
  alternative: «Мессия» … «Помазанник»
  rationale: Греческий текст не просто определяет значение слова, а сообщает греческий перевод семитского титула. Русские традиционные формы «Мессия» и «Христос» сохраняют это различие, а сноска делает прозрачным общий смысл обоих титулов, не отождествляя их без пояснения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Историческое настоящее сохранено; синтаксис сделан ясным и разговорно не сниженным.
