id: JHN.1.7
reference: John 1:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν εἰς μαρτυρίαν, ἵνα μαρτυρήσῃ περὶ τοῦ φωτός, ἵνα πάντες πιστεύσωσιν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/007.yaml
  text: He came as a witness[a], so that he might testify about the Light[b], so that all might believe through him.
translation:
  language: ru
  text: Он пришёл как свидетель, чтобы свидетельствовать о Свете, чтобы все уверовали через него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть через свидетельство Иоанна; некоторые относят слова «через него» к Свету.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτος
  choice: Он
  rationale: Указательное местоимение подчёркнуто отсылает к Иоанну из предыдущего стиха, однако в современном русском связном тексте естественнее употребить «Он»; референт остаётся ясным.
- source_word: ἦλθεν
  choice: пришёл
  rationale: Прямой и естественный перевод аориста ἔρχομαι, сохраняющий повествовательное движение.
- source_word: εἰς μαρτυρίαν
  choice: как свидетель
  rationale: Оборот передаёт цель и роль Иоанна; по-русски это естественнее буквального «для свидетельства» и сохраняет судебно-свидетельский оттенок.
- source_word: ἵνα μαρτυρήσῃ
  choice: чтобы свидетельствовать
  rationale: Сохраняется целевое значение ἵνα и лексическая связь с существительным μαρτυρία.
- source_word: περὶ τοῦ φωτός
  choice: о Свете
  rationale: περί с родительным падежом означает «о»; прописная буква указывает на личностно-титульное употребление образа Света в контексте пролога.
- source_word: ἵνα πάντες πιστεύσωσιν
  choice: чтобы все уверовали
  rationale: Повтор «чтобы» сохраняет вторую целевую конструкцию; «все» прямо передаёт неограниченное πάντες, а «уверовали» естественно для данного контекста возникновения веры.
- source_word: δι’ αὐτοῦ
  choice: через него
  rationale: διά с родительным выражает посредство. Формулировка сохраняет местоименную неоднозначность оригинала, хотя контекст прежде всего указывает на Иоанна.
theological_decisions:
- issue: К кому относится αὐτοῦ в δι’ αὐτοῦ
  choice: В основном тексте сохранено местоимение «него»; по контексту оно, вероятнее всего, относится к Иоанну и его свидетельству.
  alternative: Местоимение может быть понято как относящееся к Свету.
  rationale: Грамматически форма допускает оба соотнесения. Иоанн является подлежащим стиха и в ближайшем контексте отделён от Света, поэтому он — наиболее естественный референт; примечание сохраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; ясный и достойный библейский регистр без архаических оборотов. Повтор двух целевых придаточных сохранён ради структуры греческого текста.
