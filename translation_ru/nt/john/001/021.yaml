  text: καὶ ἠρώτησαν αὐτόν· Τί οὖν; ⸂σὺ Ἠλίας εἶ⸃; καὶ λέγει· Οὐκ εἰμί. Ὁ προφήτης εἶ σύ; καὶ ἀπεκρίθη· Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/021.yaml
  text: And they asked him[a], “What then? Are you Elijah?” And he says, “I am not.” “Are you the Prophet?” And he answered[b], “No.”
translation:
  language: ru
  text: 'И они спросили его: «Что же? Ты Илия?» Он говорит[b]: «Я не Илия». — «Ты Пророк[a]?» Он ответил: «Нет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тот пророк»; вероятно, имеется в виду ожидаемый пророк, подобный Моисею (Втор. 18:15, 18).'
    reason: alternative_reading
  - marker: b
    text: 'В греческом тексте здесь настоящее время: «говорит»; это историческое настоящее, придающее повествованию живость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησαν
  choice: спросили
  rationale: Обычный современный глагол для введения прямого вопроса; не добавляет оттенка допроса или настойчивости.
- source_word: Τί οὖν;
  choice: Что же?
  rationale: Кратко передаёт последовательный, несколько отрывистый вопрос, возникающий после предыдущего отрицания.
- source_word: σὺ Ἠλίας εἶ
  choice: Ты Илия?
  rationale: Естественная русская форма прямого вопроса; местоимение «ты» сохраняет явное σὺ.
- source_word: Οὐκ εἰμί
  choice: Я не Илия
  rationale: По-русски требуется понятная именная часть сказуемого; имя восстанавливается непосредственно из вопроса, при этом отрицание остаётся кратким и недвусмысленным.
- source_word: Ὁ προφήτης
  choice: Пророк
  rationale: Определённый артикль указывает на ожидаемую конкретную фигуру. В русском это передано прописной буквой как обозначением титула, а не любого пророка.
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время сохраняет историческое настоящее греческого повествования и звучит допустимо в живом русском рассказе.
- source_word: ἀπεκρίθη
  choice: ответил
  rationale: Прямой и естественный русский эквивалент повествовательного глагола ответа.
- source_word: Οὔ
  choice: Нет
  rationale: Самостоятельная отрицательная частица передана столь же кратким прямым ответом.
theological_decisions:
- issue: Кого обозначает «Пророк»
  choice: «Пророк» без поясняющего раскрытия в основном тексте
  alternative: «тот Пророк», то есть ожидаемый пророк, подобный Моисею
  rationale: Форма с артиклем указывает на известную собеседникам ожидаемую фигуру, но сам стих не раскрывает её прямо; прописная буква и сноска сохраняют определённость и неоднозначность.
- issue: Отрицание Иоанном тождества с Илиёй
  choice: 'Передать отрицание прямо: «Я не Илия»'
  alternative: 'Уточнить: «Я не Илия в буквальном смысле» или согласовать ответ с другими евангельскими местами'
  rationale: Перевод не вносит гармонизирующего толкования и сохраняет прямой смысл ответа в данном стихе.
translation_notes:
  register: Современный литературный русский язык с кратким, живым диалогом. Тире перед вторым вопросом помогает обозначить смену реплики без введения отсутствующего в греческом говорящего. Формулировки сохраняют резкость последовательных вопросов и ответов.
