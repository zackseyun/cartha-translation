  text: ὅτι ὁ νόμος διὰ Μωϋσέως ἐδόθη, ἡ χάρις καὶ ἡ ἀλήθεια διὰ Ἰησοῦ Χριστοῦ ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/017.yaml
  text: For the law was given through Moses[a]; grace and truth came through Jesus the Messiah.
translation:
  language: ru
  text: Ибо закон был дан через Моисея; благодать и истина пришли через Иисуса Мессию[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в традиционной передаче: «через Иисуса Христа».'
    reason: Альтернативная передача титула Χριστός.
lexical_decisions:
- source_word: ὅτι
  choice: ведь
  rationale: Союз вводит поясняющее основание к предыдущему утверждению; «ведь» естественно передаёт эту связь и не превращает стих в тяжеловесное придаточное предложение.
- source_word: ὁ νόμος
  choice: закон
  rationale: Речь идёт о данном через Моисея законе. Строчная буква сохраняет обычную русскую орфографию и не добавляет позднейшего типографского разграничения.
- source_word: διὰ Μωϋσέως
  choice: через Моисея
  rationale: διά с родительным падежом обозначает посредничество; «через» сохраняет параллель с выражением о служении Иисуса.
- source_word: ἐδόθη
  choice: был дан
  rationale: Передаёт аорист пассивного залога без уточнения подразумеваемого деятеля.
- source_word: ἡ χάρις καὶ ἡ ἀλήθεια
  choice: благодать и истина
  rationale: Традиционные и семантически ёмкие русские соответствия сохраняют связь с Ин 1:14 и богословскую насыщенность обоих понятий.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: через Иисуса Мессию
  rationale: Повтор «через» сохраняет синтаксический параллелизм; Χριστός передан как значимый титул «Мессия», а не как утратившая прозрачность транслитерация.
- source_word: ἐγένετο
  choice: пришли
  rationale: Глагол передаёт вступление благодати и истины в историческую явленность через Иисуса. Русское множественное число требуется составным подлежащим и не устраняет смыслового единства пары.
theological_decisions:
- issue: Передача Χριστοῦ в сочетании Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессию
  alternative: Иисуса Христа
  rationale: «Мессия» раскрывает титульное значение греческого Χριστός. Привычная церковная форма «Христос» сохранена в примечании.
- issue: Соотношение закона с благодатью и истиной
  choice: сопоставление без добавленного противительного союза
  alternative: «а благодать и истина»
  rationale: В греческом тексте между частями нет явного противительного союза. Точка с запятой сохраняет выразительное сопоставление, не усиливая его до прямого противопоставления.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксический параллелизм исходного текста сохранён; формулировки понятны без специальной богословской подготовки.
