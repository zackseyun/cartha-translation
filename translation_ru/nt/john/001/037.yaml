  verdict: approve
  source_fidelity: «Оба ученика услышали его слова и последовали за Иисусом» точно передаёт ход греческого текста. «Оба ученика» в данном контексте верно отсылает к двум ученикам Иоанна Крестителя; «последовали за Иисусом» естественно передаёт ἠκολούθησαν τῷ Ἰησοῦ. Формулировка «услышали его слова» идиоматически передаёт мысль о том, что они услышали его говорящим, хотя не воспроизводит причастную форму буквально.
  naturalness: Текст краткий, плавный и соответствует современному литературному русскому повествовательному регистру. Управление «последовать за Иисусом» нормативно.
  terminology: Имена и ключевой глагол «последовали» переданы последовательно и без преждевременного богословского истолкования. Опущение местоимения при «оба ученика» оправдано контекстом и предотвращает ложное отнесение к Иисусу.
