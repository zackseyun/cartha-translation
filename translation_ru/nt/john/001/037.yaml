  text: καὶ ἤκουσαν ⸂οἱ δύο μαθηταὶ αὐτοῦ⸃ λαλοῦντος καὶ ἠκολούθησαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/037.yaml
  text: And the two disciples heard him speaking[a], and they followed Jesus.
translation:
  language: ru
  text: Оба ученика услышали его слова и последовали за Иисусом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσαν
  choice: услышали
  rationale: Аорист передаёт простое событие восприятия сказанного; «услышали» естественно и не предполагает длительного вслушивания.
- source_word: οἱ δύο μαθηταὶ αὐτοῦ
  choice: оба ученика
  rationale: Речь идёт о двух учениках Иоанна Крестителя из непосредственного контекста. «Оба ученика» сохраняет определённость и не создаёт в русском двусмысленности местоимения «его», которое можно было бы ошибочно отнести к Иисусу.
- source_word: λαλοῦντος
  choice: его слова
  rationale: Родительный абсолют указывает, что ученики услышали Иоанна, когда тот говорил. Естественная русская конструкция «услышали его слова» передаёт содержание оборота без тяжеловесного «услышали его говорящим».
- source_word: ἠκολούθησαν
  choice: последовали
  rationale: Глагол обозначает буквальное следование за Иисусом и одновременно допускает повествовательный оттенок ученичества; «последовали» сохраняет оба уровня.
- source_word: τῷ Ἰησοῦ
  choice: за Иисусом
  rationale: Дательный при ἀκολουθέω обозначает того, за кем идут; нормативное русское управление — «последовать за кем».
theological_decisions:
- issue: К кому относится αὐτοῦ в выражении οἱ δύο μαθηταὶ αὐτοῦ
  choice: К Иоанну Крестителю; в основном тексте передано как «оба ученика»
  alternative: «Оба его ученика»
  rationale: В Ин 1:35–36 рядом с двумя своими учениками стоит Иоанн Креститель и указывает на Иисуса. Местоимение относится к Иоанну, однако по-русски «его» могло бы быть ошибочно понято как относящееся к Иисусу. Контекстуально ясная формулировка не меняет принадлежность учеников.
translation_notes:
  register: Современный литературный русский язык; краткий и dignified повествовательный стиль. Формулировка избегает неестественного буквального воспроизведения причастного оборота и сохраняет двойной смысл следования — физическое движение и начало ученичества.
