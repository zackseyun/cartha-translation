    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: И я
  rationale: Передаёт связь с предыдущим свидетельством и умеренное усиление местоимения без избыточного «также».
- source_word: οὐκ ᾔδειν αὐτόν
  choice: не знал Его
  rationale: Прямо передаёт прошедшее состояние незнания и сохраняет более широкий смысл греческого выражения; возможное значение «не узнавал/не распознавал» вынесено в сноску.
- source_word: ἀλλ’
  choice: но
  rationale: Естественно выражает контраст между прежним незнанием Иоанна и целью его служения.
- source_word: ἵνα φανερωθῇ
  choice: чтобы Он был явлен
  rationale: Сохраняет целевое значение ἵνα и страдательный залог φανερωθῇ, не заменяя его более толковательным «чтобы я указал на Него».
- source_word: τῷ Ἰσραὴλ
  choice: Израилю
  rationale: Кратко и точно передаёт дательный падеж и собирательное обозначение народа Израиля.
- source_word: διὰ τοῦτο
  choice: для того
  rationale: В сочетании с последующим «чтобы» естественно по-русски указывает вперёд на цель прихода.
- source_word: ἦλθον ἐγὼ
  choice: я пришёл
  rationale: Аорист передан простым прошедшим временем; явное ἐγώ отражено местоимением «я».
- source_word: ἐν ὕδατι βαπτίζων
  choice: крестить в воде
  rationale: Инфинитивальная русская конструкция естественно передаёт сопутствующий причастный оборот «пришёл, крестя»; «в воде» сохраняет форму греческого ἐν ὕδατι и не уточняет способ действия сверх текста.
theological_decisions:
- issue: Что означает утверждение Иоанна, что он не знал Иисуса
  choice: «не знал Его» без уточнения характера незнания
  alternative: «не узнавал Его» или «не знал, что Он Мессия»
  rationale: Греческий текст сам не уточняет, идёт ли речь об отсутствии личного знакомства или мессианского распознания; широкий вариант сохраняет эту неоднозначность.
- issue: Деятель откровения Иисуса Израилю
  choice: сохранён страдательный оборот «Он был явлен»
  alternative: «чтобы явить Его Израилю»
  rationale: Страдательная форма не называет деятеля и не сводит явление исключительно к действию Иоанна.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Конструкция «для того и пришёл… чтобы» звучит естественно, а «крестить в воде» сохраняет образность и синтаксическую направленность исходного текста.
