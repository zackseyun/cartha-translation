  text: 'And I did not know him[a], but for this reason I came baptizing in water: that he might be revealed to Israel.'
translation:
  language: ru
  text: И я не знал Его[a], но для того и пришёл крестить в воде, чтобы Он был явлен Израилю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
