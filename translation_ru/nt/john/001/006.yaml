  text: Ἐγένετο ἄνθρωπος ἀπεσταλμένος παρὰ θεοῦ, ὄνομα αὐτῷ Ἰωάννης·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/006.yaml
  text: There was a man sent from God[a], whose name was John.
translation:
  language: ru
  text: Был человек, посланный от Бога; имя ему — Иоанн.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο
  choice: Был
  rationale: В этом повествовательном введении форма γίνομαι представляет нового участника. «Был» естественно по-русски передаёт экзистенциальный смысл, не добавляя идеи сотворения или внезапного появления.
- source_word: ἄνθρωπος
  choice: человек
  rationale: Речь идёт об отдельном человеке, мужчине Иоанне. Русское «человек» точно и естественно соответствует контексту.
- source_word: ἀπεσταλμένος
  choice: посланный
  rationale: Перфектное страдательное причастие представляет Иоанна как того, кто был послан и несёт данное ему поручение; «посланный» сохраняет страдательный залог и лаконичность оригинала.
- source_word: παρὰ θεοῦ
  choice: от Бога
  rationale: παρά с родительным падежом обозначает источник. «От Бога» сохраняет акцент на происхождении поручения, тогда как «Богом» сильнее подчёркивало бы действующее лицо.
- source_word: ὄνομα αὐτῷ Ἰωάννης
  choice: имя ему — Иоанн
  rationale: Эта конструкция близко передаёт греческую именную фразу, оставаясь понятной и достойной по стилю в современном русском языке.
- source_word: Ἰωάννης
  choice: Иоанн
  rationale: Использована устоявшаяся русская библейская форма имени.
theological_decisions:
- issue: Характер миссии Иоанна
  choice: Иоанн представлен как посланный от Бога.
  alternative: Иоанн был послан Богом.
  rationale: Сочетание страдательного причастия ἀπεσταλμένος с παρὰ θεοῦ указывает на Божье поручение и его источник. Формулировка не привносит дополнительных утверждений о статусе или служении Иоанна.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Порядок частей и формула «имя ему — Иоанн» сохраняют лаконизм и ритм греческого текста; точка с запятой ясно связывает представление человека с сообщением его имени.
