  yaml_path: translation/nt/john/001/022.yaml
  text: So they said to him, “Who are you, so that we may give an answer to those who sent us? What do you say about yourself?”
translation:
  language: ru
  text: 'Итак, они сказали ему: «Кто ты, чтобы мы могли дать ответ пославшим нас? Что ты говоришь о себе?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Тогда
  rationale: Передаёт переход к следующему вопросу, вызванному предшествующим обменом репликами; естественно звучит в современном русском повествовании.
- source_word: εἶπαν ... αὐτῷ
  choice: они спросили его
  rationale: Буквально конструкция означает «они сказали ему», но непосредственное продолжение представляет собой вопросы; «спросили» естественно передаёт речевую функцию без изменения смысла.
- source_word: Τίς εἶ;
  choice: Кто ты?
  rationale: Кратко и прямо передаёт вопрос о личности Иоанна.
- source_word: ἵνα ἀπόκρισιν δῶμεν
  choice: Нам нужно дать ответ
  rationale: Передаёт целевую направленность ἵνα и устойчивое сочетание «дать ответ»; русская конструкция ясно выражает практическую цель вопроса.
- source_word: τοῖς πέμψασιν ἡμᾶς
  choice: тем, кто нас послал
  rationale: Естественно передаёт субстантивированное причастие и сохраняет множественное число отправителей.
- source_word: τί λέγεις περὶ σεαυτοῦ;
  choice: Что ты скажешь о себе?
  rationale: Идиоматичный русский вопрос о собственном свидетельстве человека; будущее совершенного вида уместно в просьбе сформулировать ответ сейчас, не вводя дополнительного содержания.
