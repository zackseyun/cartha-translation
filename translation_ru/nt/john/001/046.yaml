  yaml_path: translation/nt/john/001/046.yaml
  text: And Nathanael said to him[a], “Can anything good come from Nazareth?” Philip said to him, “Come and see.”
translation:
  language: ru
  text: 'Нафанаил сказал ему: «Разве из Назарета может быть что-нибудь доброе?» Филипп говорит ему: «Приди и посмотри».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ Ναθαναήλ
  choice: Нафанаил сказал ему
  rationale: В русском начало с имени звучит естественнее, чем буквальное «И сказал ему Нафанаил»; καί здесь служит простым повествовательным связующим и не требует отдельной передачи.
- source_word: Ἐκ Ναζαρὲτ
  choice: из Назарета
  rationale: ἐκ указывает на источник или происхождение; «из Назарета» точно и естественно передаёт эту связь.
- source_word: δύναταί τι ἀγαθὸν εἶναι
  choice: может быть что-нибудь доброе
  rationale: Сохраняется буквальное значение εἶναι «быть», поскольку по-русски эта конструкция естественна и не требует добавлять значение движения «выйти» или «произойти».
- source_word: λέγει αὐτῷ ὁ Φίλιππος
  choice: Филипп говорит ему
  rationale: Историческое настоящее λέγει сохранено, передавая живость повествования Иоанна; порядок слов сделан естественным для современного русского.
- source_word: Ἔρχου καὶ ἴδε
  choice: Пойди и посмотри
  rationale: Императивы передают приглашение лично убедиться. «Пойди» в данном контексте естественнее русского «приди», поскольку Филипп приглашает Нафанаила отправиться к Иисусу; «посмотри» сохраняет прямой смысл и возможность более глубокого восприятия в контексте.
theological_decisions:
- issue: Тон вопроса Нафанаила о Назарете
  choice: Передать как скептический риторический вопрос без добавления насмешки или презрения
  alternative: «Неужели из Назарета может выйти что-то хорошее?»
  rationale: Греческий текст выражает сомнение, но прямо не обозначает сарказм. Частица «разве» естественно передаёт риторическую силу, не усиливая оценку.
- issue: Значение εἶναι при ἐκ Ναζαρὲτ
  choice: «из Назарета может быть»
  alternative: «из Назарета может выйти»
  rationale: Выбранный вариант сохраняет онтологически нейтральное «быть» и указание на происхождение, не конкретизируя его как физический выход или появление.
translation_notes:
  register: Современный литературный русский язык, ясный и dignified по тону. Сохранено историческое настоящее во второй реплике. Имена переданы в принятой русской библейской форме.
