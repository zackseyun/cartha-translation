lexical_decisions:
- source_word: ἦν
  choice: был
  rationale: Имперфект εἰμί обозначает состояние в прошлом и указывает на происхождение Филиппа; простое «был» точно передаёт эту функцию.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: δέ служит мягкой связкой в повествовании. В современном русском здесь естественно передать переход последовательностью изложения, не добавляя «теперь» и не создавая ложного противопоставления.
- source_word: ὁ Φίλιππος
  choice: Филипп
  rationale: Имя передано в традиционной русской библейской форме.
- source_word: ἀπὸ Βηθσαϊδά
  choice: из Вифсаиды
  rationale: ἀπό обозначает происхождение; «из» — естественный русский эквивалент. Название места передано в принятой русской форме.
- source_word: ἐκ τῆς πόλεως
  choice: из города
  rationale: πόλις обозначает город или населённый пункт. «Город» — обычное и точное русское соответствие; повтор предлога сохраняет структуру греческой фразы.
- source_word: Ἀνδρέου καὶ Πέτρου
  choice: Андрея и Петра
  rationale: Родительный падеж сохраняет краткую исходную конструкцию и обозначает связь города с Андреем и Петром как местом их происхождения.
