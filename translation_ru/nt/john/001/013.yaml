base_translation:
  language: en
  yaml_path: translation/nt/john/001/013.yaml
  text: who were born, not from bloods, nor from the will of the flesh, nor from the will of a man, but from God.
translation:
  language: ru
  text: которые родились не от крови[a], не от воли плоти, не от воли мужчины, но от Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не от кровей». В греческом тексте употреблено необычное множественное число, обозначающее естественное происхождение или человеческое родство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: которые
  rationale: Относительное местоимение сохраняет синтаксическую связь с людьми, названными в предыдущем стихе.
- source_word: ἐξ αἱμάτων
  choice: от кровей
  rationale: Необычное множественное число оригинала сохранено как выразительное обозначение естественного происхождения или человеческого родства; смысл пояснён в сноске.
- source_word: θελήματος
  choice: желания
  rationale: В контексте человеческого зачатия «желание» естественно передаёт θέλημα и сохраняет повторяющуюся структуру фразы.
- source_word: σαρκὸς
  choice: плоти
  rationale: «Плоть» сохраняет конкретный библейский образ человеческой телесности и способности к продолжению рода, не подменяя его толкованием вроде «греховной природы».
- source_word: ἀνδρὸς
  choice: мужчины
  rationale: Здесь ἀνήρ, вероятнее всего, обозначает взрослого мужчину и его участие в зачатии. «Мужчины» сохраняет эту мужскую конкретику, не сужая смысл до супруга.
- source_word: ἐκ θεοῦ
  choice: от Бога
  rationale: Естественно выражает источник и сохраняет противопоставление трём отвергнутым человеческим источникам.
- source_word: ἐγεννήθησαν
  choice: родились
  rationale: Аорист пассивного залога γεννάω в данном контексте естественно передаётся как «родились»; форма множественного числа согласована с οἳ.
theological_decisions:
- issue: Противопоставление человеческого и божественного происхождения
  choice: Стих говорит о рождении, источник которого — не естественное происхождение и не человеческое стремление к продолжению рода, а Бог.
  alternative: Можно понимать первую часть уже — только как отрицание значимости этнического происхождения; позднейшие традиции также предлагают более конкретные сакраментальные или метафизические толкования.
  rationale: Тройное отрицание противопоставляет обычное человеческое рождение рождению от Бога. Перевод сохраняет это противопоставление, но не уточняет способ божественного рождения сверх сказанного в тексте.
translation_notes:
  register: Современный литературный и достоинственный регистр. Необычное «от кровей» намеренно сохраняет выразительную форму греческого текста и сопровождается поясняющей сноской; остальная фраза построена естественно для современного русского языка.
