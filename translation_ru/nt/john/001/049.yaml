  text: ἀπεκρίθη ⸂αὐτῷ Ναθαναήλ⸃· Ῥαββί, σὺ εἶ ὁ υἱὸς τοῦ θεοῦ, σὺ ⸂βασιλεὺς εἶ⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/049.yaml
  text: Nathanael answered him, “Rabbi, you are the Son of God; you are the King of Israel.”
translation:
  language: ru
  text: 'Нафанаил ответил Ему: «Равви! Ты — Сын Божий, Ты — Царь Израиля».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ответил
  rationale: Обычный и естественный для русского повествования эквивалент глагола ἀποκρίνομαι в диалоге.
- source_word: Ῥαββί
  choice: Равви
  rationale: Сохранено традиционное заимствованное иудейское обращение, передающее историко-культурную форму титула; перевод «Учитель» был бы смысловым, но менее конкретным.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Сын Божий
  rationale: Определённый христологический титул передан в принятой и ясной русской форме без ослабления или поясняющего расширения.
- source_word: βασιλεὺς
  choice: Царь
  rationale: Прямой русский эквивалент царского титула; в сочетании с «Израиля» контекст указывает на определённый, мессиански значимый титул.
- source_word: τοῦ Ἰσραήλ
  choice: Израиля
  rationale: Родительный падеж сохраняет краткую титульную форму греческого выражения без истолковывающего расширения «над Израилем».
- source_word: σὺ εἶ … σὺ … εἶ
  choice: Ты — … Ты — …
  rationale: Повторение местоимения сохранено, чтобы передать эмфатический параллелизм исповедания; тире естественно оформляет именное сказуемое в современном русском языке.
- source_word: Ναθαναήλ
  choice: Нафанаил
  rationale: Использована устоявшаяся русская библейская форма имени, соответствующая современному литературному употреблению.
theological_decisions:
- issue: Христологическая сила исповедания «Сын Божий»
  choice: 'Сохранить титул без ослабления и расширения: «Сын Божий».'
  alternative: «сын Бога» или неопределённое «один из сынов Божьих»
  rationale: Греческая конструкция представляет определённый титул, значимый в контексте Евангелия от Иоанна. Перевод не разбавляет его и не добавляет позднейших догматических формулировок.
- issue: Царско-мессианский смысл выражения «Царь Израиля»
  choice: Передать как явный титул «Царь Израиля».
  alternative: «царь над Израилем» или «израильский царь»
  rationale: Формулировка сохраняет титульность и ветхозаветно-мессианский оттенок исходного выражения, не превращая его в поясняющий пересказ.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Сохранены культурно значимое обращение «Равви» и торжественный параллелизм двух исповедальных утверждений; архаизирующие формы не добавлены.
