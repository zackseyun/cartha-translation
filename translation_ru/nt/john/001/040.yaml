  text: ἦν Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου εἷς ἐκ τῶν δύο τῶν ἀκουσάντων παρὰ Ἰωάννου καὶ ἀκολουθησάντων αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/040.yaml
  text: Andrew[a], Simon Peter’s brother, was one of the two who had heard from John and followed him.
translation:
  language: ru
  text: Андрей, брат Симона Петра, был одним из двух, услышавших от Иоанна и последовавших за ним.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «одним из двух, услышавших от Иоанна и последовавших за ним». В контексте «ним» относится к Иисусу.'
    reason: Передаёт буквальную структуру выражения и поясняет контекстуальный референт местоимения, не заменяя местоимение именем в основном тексте.
lexical_decisions:
- source_word: ἦν
  choice: был
  rationale: 'Имперфект εἰμί служит простой связкой в конструкции отождествления: Андрей был одним из двоих.'
- source_word: Ἀνδρέας
  choice: Андрей
  rationale: Использована традиционная и общеупотребительная русская форма личного имени.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: брат Симона Петра
  rationale: Естественная русская генитивная конструкция точно передаёт буквальное родство и сохраняет двойное именование Симона Петра.
- source_word: εἷς ἐκ τῶν δύο
  choice: одним из тех двоих
  rationale: Идиоматично и точно передаёт партитивную конструкцию; указательное «тех» связывает двоих с предшествующим повествованием.
- source_word: τῶν ἀκουσάντων παρὰ Ἰωάννου
  choice: которые услышали слова Иоанна
  rationale: Παρά с родительным обозначает источник. Добавление «слова» делает выражение естественным по-русски и передаёт подразумеваемое содержание услышанного, не уточняя его сверх контекста.
- source_word: καὶ ἀκολουθησάντων αὐτῷ
  choice: и последовали за Ним
  rationale: Глагол ἀκολουθέω передан обычным русским выражением «последовать за». Местоимение сохранено; контекст указывает на Иисуса.
theological_decisions:
- issue: К кому относится αὐτῷ
  choice: «за Ним» относится к Иисусу
  alternative: «за ним» относится к Иоанну
  rationale: В ближайшем контексте (Ин. 1:35–39) двое слышат свидетельство Иоанна, после чего идут за Иисусом. Основной текст сохраняет местоимение, а сноска проясняет его контекстуального референта, не подменяя греческую формулировку именем.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис естественный, без архаизмов; прописная буква в «Ним» следует устойчивой русской библейской издательской традиции и одновременно сохраняет местоимение исходного текста.
