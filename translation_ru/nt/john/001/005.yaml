  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ τὸ φῶς ἐν τῇ σκοτίᾳ φαίνει, καὶ ἡ σκοτία αὐτὸ οὐ κατέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/005.yaml
  text: And the light shines in the darkness[a], and the darkness has not overcome it.
translation:
  language: ru
  text: И свет сияет во тьме, и тьма не одолела его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тьма не постигла его»; возможно также: «не охватила его». Греческий глагол может означать как «одолеть, захватить», так и «постичь, понять».'
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: свет
  rationale: Существительное передано как «свет»; в русском языке определённость тематического образа выражается контекстом и не требует отдельного артикля.
- source_word: σκοτίᾳ / σκοτία
  choice: тьма
  rationale: «Тьма» естественно и точно сохраняет повторяющийся, отчасти персонифицированный контраст со светом.
- source_word: φαίνει
  choice: сияет
  rationale: Настоящее время передаёт продолжающееся действие; «сияет» звучит естественно и сохраняет образ света.
- source_word: κατέλαβεν
  choice: не одолела
  rationale: В образном противостоянии света и тьмы значение «одолеть» уместно как основное, но многозначность глагола сохранена в сноске.
- source_word: αὐτό
  choice: его
  rationale: Русское местоимение согласуется с грамматически мужским существительным «свет»; это не является самостоятельным уточнением личностного смысла образа.
theological_decisions:
- issue: Значение κατέλαβεν в противопоставлении света и тьмы
  choice: не одолела его
  alternative: не постигла его; не охватила его
  rationale: Греческий глагол допускает как враждебно-силовое значение («схватить, одолеть»), так и познавательное («постичь, понять»). Основной текст следует образу противоборства, а сноска сохраняет подлинную смысловую многослойность.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная фраза сохраняет параллелизм оригинала. Союз «и» воспроизведён в обеих частях. Лексика возвышенная, но общеупотребительная.
