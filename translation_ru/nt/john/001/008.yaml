lexical_decisions:
- source_word: οὐκ ἦν
  choice: не был
  rationale: Прямо передаёт отрицательную форму имперфекта εἰμί; в русском контексте естественно прошедшее время несовершенного вида.
- source_word: ἐκεῖνος
  choice: Он
  rationale: Указательное местоимение здесь служит подчёркнутым личным указанием на Иоанна; русское «Он» звучит естественно, тогда как «тот» создало бы ненужное дистанцирование.
- source_word: τὸ φῶς
  choice: светом / о свете
  rationale: Существительное с артиклем обозначает конкретный свет, уже представленный в прологе. В русском определённость передаётся контекстом; строчная буква сохраняет образный характер выражения и не добавляет отсутствующего в греческой графике толкования.
- source_word: ἀλλ’ ἵνα
  choice: но пришёл, чтобы
  rationale: После ἀλλά в греческом подразумевается сказуемое, восстанавливаемое из контекста предыдущего стиха. «Пришёл, чтобы» естественно выражает противопоставление и цель, не меняя роли Иоанна.
- source_word: μαρτυρήσῃ
  choice: свидетельствовать
  rationale: Точно сохраняет свидетельский оттенок μαρτυρέω и является естественным термином в русском языке.
- source_word: περὶ τοῦ φωτός
  choice: о свете
  rationale: Краткий и естественный русский эквивалент конструкции περί с родительным падежом.
theological_decisions:
- issue: Отношение Иоанна к свету
  choice: Стих прямо отрицает, что Иоанн был светом, и определяет его назначение как свидетельство о свете.
  alternative: 'Более буквально: «Он не был светом, но — чтобы свидетельствовать о свете».'
  rationale: Перевод сохраняет различие между свидетелем и светом, не уточняя сверх текста личность света и не добавляя конфессионального толкования. Глагол «пришёл» восполняет греческий эллипсис по ближайшему контексту.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и торжественно-нейтральная. Повтор слова «свет» сохранён как значимый элемент пролога.
