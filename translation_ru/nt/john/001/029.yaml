  text: Τῇ ἐπαύριον βλέπει τὸν Ἰησοῦν ἐρχόμενον πρὸς αὐτόν, καὶ λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/029.yaml
  text: The next day he sees Jesus coming toward him and says, “Look, the Lamb of God, who takes away the sin of the world!”
translation:
  language: ru
  text: 'На следующий день он видит идущего к нему Иисуса и говорит: «Вот Агнец Божий, который берёт на себя грех мира[a]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который устраняет грех мира». Греческий глагол может обозначать как принятие или несение, так и удаление.'
    reason: Передаёт смысловую широту αἴρων, не решая спорный оттенок однозначно.
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: На следующий день
  rationale: Естественная современная передача временного указания.
- source_word: βλέπει
  choice: видит
  rationale: Сохранено историческое настоящее греческого повествования.
- source_word: Ἴδε
  choice: Вот
  rationale: Краткое и естественное указательно-восклицательное слово, привлекающее внимание.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: Агнец Божий
  rationale: Сохраняет библейский жертвенный образ и его традиционно узнаваемую форму в русском языке.
- source_word: ὁ αἴρων
  choice: который уносит
  rationale: Передаёт основной образ αἴρω — поднять и унести, не сводя выражение только к абстрактному устранению.
- source_word: τὴν ἁμαρτίαν τοῦ κόσμου
  choice: грех мира
  rationale: Сохранено единственное число «грех» и широкий смысл κόσμος.
theological_decisions:
- issue: Смысл αἴρων применительно к греху
  choice: который уносит
  alternative: который берёт на себя / устраняет
  rationale: Греческое αἴρω допускает оттенки поднятия, несения и удаления. «Уносит» сохраняет намеренную смысловую ёмкость и не решает однозначно, говорится ли прежде всего о несении греха или о его устранении.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. «Агнец» сохранён как устойчивый богословский образ; синтаксис остаётся ясным для обычного читателя.
