  source_fidelity: Нужна небольшая правка для более точной передачи временных форм. В черновике настоящее «Это Тот» заменяет аорист ἦν («Это был Тот»), а «восклицает» не отражает совершённость κέκραγεν. «Стал впереди меня» точнее передаёт γέγονεν, чем «оказался впереди меня», не навязывая одного значения выражению ἔμπροσθέν μου.
  naturalness: Предлагаемый текст остаётся современным литературным русским. Сочетание настоящего «свидетельствует» с совершенным «возгласил» намеренно воспроизводит греческое сочетание настоящего и перфекта и естественно в библейском повествовательном регистре.
  terminology: «Свидетельствует», «идущий за мной», «стал впереди меня» и «был прежде меня» сохраняют исходную образность и многозначность последовательности, первенства и превосходства. Заглавное написание местоимения — допустимая издательская конвенция и не является богословским добавлением.
