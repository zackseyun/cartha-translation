  text: (Ἰωάννης μαρτυρεῖ περὶ αὐτοῦ καὶ κέκραγεν λέγων· Οὗτος ἦν ⸂ὃν εἶπον⸃· Ὁ ὀπίσω μου ἐρχόμενος ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·)
base_translation:
  language: en
  yaml_path: translation/nt/john/001/015.yaml
  text: John testifies about him and has cried out[a], saying, “This was he of whom I said, ‘The one coming after me has become before me[b], because he was before me.’”
translation:
  language: ru
  text: 'Иоанн свидетельствует о Нём и возгласил[a]: «Это был Тот, о Ком я сказал: „Идущий за мной стал впереди меня[b], потому что Он был прежде меня[c]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «возгласил». Греческая форма может подчёркивать непреходящую силу провозглашённого свидетельства.'
    reason: aspectual_note
  - marker: b
    text: 'Или: «занял место выше меня»; «превзошёл меня». Греческое выражение может обозначать не только последовательность, но также первенство или более высокий ранг.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Он существовал прежде меня». Перевод «был прежде меня» ближе сохраняет форму греческого текста, а контекст допускает указание на предсуществование.'
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: свидетельствует
  rationale: Настоящее время передаёт живое, продолжающееся свидетельство; слово сохраняет смысл свидетельского показания и естественно звучит по-русски.
- source_word: περὶ αὐτοῦ
  choice: о Нём
  rationale: Естественная передача περί с родительным падежом; местоимение соотносится с Христом.
- source_word: κέκραγεν λέγων
  choice: и восклицает
  rationale: Русское настоящее время в повествовательном представлении естественно передаёт сохраняющую силу греческого перфекта κέκραγεν; отдельное «говоря» было бы тяжеловесно.
- source_word: Οὗτος ἦν ὃν εἶπον
  choice: Это Тот, о Ком я сказал
  rationale: Передаёт указательную и относительную конструкции, сохраняя отсылку к ранее произнесённым словам. Настоящее «Это Тот» естественнее по-русски при указании на лицо, тогда как прошедшее время сохраняется в «сказал».
- source_word: Ὁ ὀπίσω μου ἐρχόμενος
  choice: Идущий за мной
  rationale: Сохраняет субстантивированное причастие и допускает как временную последовательность появления, так и следование в служении.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: оказался впереди меня
  rationale: Передаёт итоговое состояние перфекта γέγονεν и образ ἔμπροσθεν. Формулировка сохраняет возможные значения первенства и превосходства, не сводя выражение только к рангу.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно вводит основание предыдущего утверждения.
- source_word: πρῶτός μου ἦν
  choice: Он был прежде меня
  rationale: Сохраняет утверждение о предшествовании без добавления глагола «существовал»; в контексте допускает смысл предсуществования.
theological_decisions:
- issue: Насколько явно выражать предсуществование Христа в πρῶτός μου ἦν
  choice: «Он был прежде меня»
  alternative: «Он существовал прежде меня»
  rationale: Греческий текст в контексте убедительно указывает на предсуществование, однако не содержит отдельного глагола «существовать». Выбранная формулировка сохраняет богословскую силу и исходную недосказанность.
- issue: Передача соотношения последовательности и превосходства в ἔμπροσθέν μου γέγονεν
  choice: «оказался впереди меня» с примечанием
  alternative: «превзошёл меня» / «занял место выше меня»
  rationale: Буквенно-образная передача позволяет услышать и временно-пространственный образ, и смысл первенства; более однозначные варианты были бы толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для широкого читателя; сохранены повтор «меня» и смысловая напряжённость между приходом после Иоанна и бытием прежде него. Заглавные буквы в местоимениях, относящихся к Христу, использованы как принятая русская издательская норма, не добавляющая отдельного толкования.
