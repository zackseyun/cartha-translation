  to: 'Иоанн свидетельствует о Нём и возгласил[a]: «Это был Тот, о Ком я сказал: „Идущий за мной стал впереди меня[b], потому что Он был прежде меня[c]“».'
  rationale: Правка восстанавливает аорист ἦν в «Это был Тот», точнее передаёт перфект κέκραγεν через «возгласил» и заменяет потенциально случайностное «оказался впереди» на результативное «стал впереди». Неоднозначность ἔμπροσθεν и πρῶτος сохранена в основном тексте и пояснена в примечаниях; явное «существовал» оставлено только как альтернативное чтение.
