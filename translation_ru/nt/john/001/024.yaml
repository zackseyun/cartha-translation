  text: And they had been sent from the Pharisees[a].
translation:
  language: ru
  text: А посланные были из числа фарисеев.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «А посланные были от фарисеев». Греческое выражение буквально указывает, что посланные были из фарисеев; в контексте оно может также означать, что они были направлены фарисеями.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: А
  rationale: Простой повествовательный союз сохраняет связь с предыдущим стихом; в современном русском здесь естественнее «А», чем буквальное «И».
- source_word: ἀπεσταλμένοι ἦσαν
  choice: посланные были
  rationale: Перифрастическая конструкция с перфектным причастием передаёт состояние людей как уже посланных; русская конструкция сохраняет эту особенность без добавления лишнего временного оттенка.
- source_word: ἐκ
  choice: из
  rationale: Предлог прежде всего указывает на источник или принадлежность к группе, а не выражает явно действующее лицо.
- source_word: τῶν Φαρισαίων
  choice: фарисеев
  rationale: Общепринятое русское обозначение религиозной группы; определённый артикль отдельно не передаётся, как обычно в русском языке.
theological_decisions:
- issue: Связь посланных с фарисеями
  choice: Они были из числа фарисеев
  alternative: Они были посланы фарисеями
  rationale: Греческое ἐκ с родительным падежом прямо обозначает источник или происхождение. Основной текст сохраняет эту более буквальную связь и не усиливает значение до явного указания на фарисеев как действующее лицо; контекстуально возможный смысл агентности отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной повествовательной формулировкой. Несколько отмеченный порядок слов «посланные были» выбран ради сохранения акцента греческой конструкции и естественно связывает стих с предыдущим вопросом.
