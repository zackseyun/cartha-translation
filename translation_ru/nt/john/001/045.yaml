  terminology: «Закон», «пророки», «Иисус», «Иосиф», «Назарет» и «Нафанаил» употреблены последовательно и в устоявшихся русских библейских формах. Прописные буквы в относительном местоимении допустимы в русском библейском регистре и не меняют смысла.
