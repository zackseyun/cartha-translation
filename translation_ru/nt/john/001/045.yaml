  text: εὑρίσκει Φίλιππος τὸν Ναθαναὴλ καὶ λέγει αὐτῷ· Ὃν ἔγραψεν Μωϋσῆς ἐν τῷ νόμῳ καὶ οἱ προφῆται εὑρήκαμεν, ⸀Ἰησοῦν υἱὸν τοῦ Ἰωσὴφ τὸν ἀπὸ Ναζαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/045.yaml
  text: 'Philip found Nathanael and said to him[a], “We have found him of whom Moses in the Law and also the prophets wrote: Jesus son of Joseph[b], from Nazareth.”'
translation:
  language: ru
  text: 'Филипп находит Нафанаила и говорит ему: «Мы нашли Того, о Ком Моисей написал в Законе, а пророки писали, — Иисуса, сына Иосифа, из Назарета».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρίσκει ... λέγει
  choice: находит ... говорит
  rationale: 'Историческое настоящее сохранено: в русском повествовании оно звучит естественно и передаёт живость сцены.'
- source_word: Ὃν ἔγραψεν
  choice: Того, о Ком писали
  rationale: Русская конструкция с «о Ком» естественно передаёт относительное местоимение как объект глагола «писать»; прописная буква указывает на Иисуса в соответствии с русской библейской традицией, не добавляя нового титула.
- source_word: ἐν τῷ νόμῳ
  choice: в Законе
  rationale: «Закон» обозначает связанное с Моисеем Писание, а не закон вообще; написание с прописной буквы делает это различие ясным.
- source_word: οἱ προφῆται
  choice: пророки
  rationale: Передаёт вторую группу свидетелей Писания без добавления отсутствующего в греческом тексте определения.
- source_word: εὑρήκαμεν
  choice: мы нашли
  rationale: Русская форма прошедшего времени в контексте объявления о состоявшемся открытии естественно передаёт греческий перфект и его сохраняющийся результат.
- source_word: υἱὸν τοῦ Ἰωσὴφ
  choice: сына Иосифа
  rationale: Сохранено данное Филиппом обычное общественное именование Иисуса без догматического уточнения или гармонизации.
- source_word: τὸν ἀπὸ Ναζαρέτ
  choice: из Назарета
  rationale: Предлог «из» непосредственно передаёт ἀπό как указание на происхождение или место, с которым человек связан.
- source_word: Ναθαναὴλ
  choice: Нафанаила
  rationale: Употреблена укоренившаяся русская библейская форма имени.
- source_word: Ἰησοῦν
  choice: Иисуса
  rationale: Употреблена стандартная русская форма имени.
- source_word: Μωϋσῆς
  choice: Моисей
  rationale: Употреблена стандартная русская библейская форма имени.
theological_decisions:
- issue: Выражение «сын Иосифа» и христология
  choice: Сохранено прямое именование «Иисуса, сына Иосифа» как слова Филиппа.
  alternative: «Иисуса, которого считали сыном Иосифа» или уточнение о юридическом отцовстве.
  rationale: Стих передаёт начальное общественное обозначение Иисуса устами Филиппа. Перевод не должен вносить в его слова гармонизирующее пояснение, которого нет в тексте.
- issue: Свидетельство Моисея и пророков
  choice: 'Оба субъекта представлены как писавшие о найденном человеке: «о Ком писали Моисей в Законе и пророки».'
  alternative: «Того, о Ком Моисей написал в Законе, а также пророки».
  rationale: Форма множественного числа по нормам русского языка естественно объединяет Моисея и пророков как субъектов, сохраняя двучленное свидетельство Писания и не уточняя сверх текста характер отдельных пророчеств.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Историческое настоящее сохранено. Тире перед приложением помогает ясно связать имя Иисуса с «Тем, о Ком писали». Единственная сноска отмечает более развёрнутую греческую конструкцию τὸν ἀπὸ Ναζαρέτ; её маркер поставлен в основном тексте.
