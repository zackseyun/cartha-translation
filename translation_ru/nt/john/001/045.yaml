  source_fidelity: 'Основной текст в целом верно передаёт историческое настоящее, совершенный результат «мы нашли», обычное именование «сын Иосифа» и ἀπό в значении «из». Однако в русской координации «писали Моисей в Законе и пророки» связь «в Законе» может быть прочитана как относящаяся и к пророкам, тогда как в греческом она относится к Моисею. Сноска неточно характеризует греческую конструкцию: τὸν ἀπὸ Ναζαρέτ — не иной «порядок слов» и не требует добавления «Того, Кто».'
