  text: Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/014.yaml
  text: And the Word became flesh and dwelt among us[a], and we saw his glory, glory as of the one and only Son from the Father[b], full of grace and truth.
translation:
  language: ru
  text: И Слово стало плотью и обитало среди нас[a], и мы увидели Его славу — славу, как у Единородного от Отца, полного благодати и истины.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «раскинуло шатёр среди нас». Глагол вызывает образ шатра, скинии.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «единственного от Отца» или «единственного Сына от Отца». Традиционно: «Единородного от Отца». В греческом тексте слово «Сын» в этом стихе прямо не употреблено.'
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: Слово
  rationale: Сохраняет укоренившийся и содержательно насыщенный титул пролога Иоанна; варианты «Весть» и «Разум» передают лишь часть смыслового диапазона.
- source_word: σὰρξ ἐγένετο
  choice: стало плотью
  rationale: Прямо передаёт реальное воплощение и сохраняет выразительность греческого σάρξ, не заменяя его отвлечённым понятием «человеческая природа».
- source_word: ἐσκήνωσεν ἐν ἡμῖν
  choice: поселилось среди нас
  rationale: Естественно звучит по-русски и передаёт пребывание среди людей; образ шатра или скинии сохраняется в сноске.
- source_word: ἐθεασάμεθα
  choice: мы увидели
  rationale: Современная и ясная передача непосредственного свидетельства без архаического «созерцали».
- source_word: δόξαν
  choice: славу
  rationale: Обычный библейский эквивалент, сохраняющий богословскую насыщенность термина.
- source_word: μονογενοῦς
  choice: единственного Сына
  rationale: Передаёт прежде всего уникальность и единственность; существительное «Сына» обоснованно восполняется из ближайшего контекста, но альтернативы отмечены в сноске.
- source_word: παρὰ πατρός
  choice: пришедшего от Отца
  rationale: Передаёт происхождение и отношение к Отцу естественным русским оборотом; добавленное причастие выражает подразумеваемую связь, не утверждая способ происхождения.
- source_word: πλήρης χάριτος καὶ ἀληθείας
  choice: полного благодати и истины
  rationale: Сохраняет грамматическую связь с воплощённым Словом и традиционную библейскую формулу.
theological_decisions:
- issue: Значение μονογενοῦς в христологическом контексте
  choice: единственного Сына
  alternative: единородного Сына; единственного, пришедшего от Отца
  rationale: В основном тексте выражена уникальность Сына без внесения спорного этимологического значения «рождённый»; исторически значимый вариант сохранён в сноске. Само слово «Сын» подразумевается контекстом, хотя в данном греческом стихе явно не стоит.
- issue: Образ скинии в ἐσκήνωσεν
  choice: поселилось среди нас
  alternative: раскинуло шатёр среди нас; обитало среди нас
  rationale: Основной текст остаётся понятным современному читателю, а вероятная отсылка к шатру и скинии не теряется благодаря сноске.
- issue: Грамматическая отнесённость πλήρης
  choice: полного благодати и истины
  alternative: полное благодати и истины
  rationale: 'Греческое πλήρης формально именительного рода и может относиться к λόγος либо к подразумеваемому μονογενής. Русская формулировка соотносит его с ближайшим «Сына», не меняя референта: речь идёт о воплощённом Слове.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Сохранены традиционные ключевые слова «Слово», «плоть», «слава», «благодать» и «истина»; синтаксис слегка разгружен делением на два предложения.
