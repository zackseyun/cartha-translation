- from: И Слово стало плотью и поселилось среди нас[a]. Мы увидели Его славу — славу единственного Сына, пришедшего от Отца[b], полного благодати и истины.
  to: И Слово стало плотью и обитало среди нас[a], и мы увидели Его славу — славу, как у Единородного от Отца, полного благодати и истины.[b]
  rationale: Исправленное чтение не превращает предложное выражение παρὰ πατρός в «пришедшего от Отца», сохраняет сравнительный оборот ὡς и не вставляет «Сын» в основной текст там, где его нет в греческом. «Полного» оставлено в форме, соответствующей πλήρης и не требующей нового синтаксического решения. Сноски кратко сохраняют образ скинии и значимые варианты μονογενοῦς.
