  text: κἀγὼ ἑώρακα, καὶ μεμαρτύρηκα ὅτι οὗτός ἐστιν ὁ ⸀ἐκλεκτὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/034.yaml
  text: And I have seen and have testified that this is the Chosen One of God[a].
translation:
  language: ru
  text: И я увидел и засвидетельствовал, что Он — Избранник Божий[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «Сын Божий» вместо «Избранник Божий».'
    reason: textual_variant
lexical_decisions:
- source_word: κἀγώ
  choice: И я
  rationale: Передаёт как соединительное значение καί, так и выраженное местоимением ἐγώ смысловое выделение говорящего, не усиливая его сверх меры.
- source_word: ἑώρακα
  choice: увидел
  rationale: Греческий перфект обозначает состоявшееся видение с сохраняющейся значимостью; в естественном русском повествовании это лучше передаётся совершенным видом, поскольку буквальное «я увидел и вижу» было бы неуместно.
- source_word: μεμαρτύρηκα
  choice: засвидетельствовал
  rationale: Совершенный вид выражает завершённое свидетельство, сохраняющее силу; глагол также поддерживает важную для Евангелия от Иоанна лексику свидетельства.
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание свидетельства, а не его причину.
- source_word: οὗτός
  choice: Он
  rationale: В данном указании на Иисуса русское «Он» звучит естественнее буквального «Этот» или «Этот человек», при этом указательная сила сохраняется контекстом.
- source_word: ὁ ἐκλεκτός
  choice: Избранник
  rationale: 'Артикль субстантивирует прилагательное: речь идёт об Избранном. «Избранник» — ясное, краткое и титульное обозначение в современном литературном русском.'
- source_word: τοῦ θεοῦ
  choice: Божий
  rationale: Русское притяжательное прилагательное естественно и точно передаёт родительный оборот в составе титула; оно не уточняет неоднозначное отношение как исключительно источник или принадлежность.
theological_decisions:
- issue: Христологический титул в Ин 1:34
  choice: Избранник Божий
  alternative: Сын Божий
  rationale: Основной текст следует представленному чтению SBLGNT ὁ ἐκλεκτὸς τοῦ θεοῦ и не заменяет его более привычным вариантом. Значимый вариант «Сын Божий» сохраняется в примечании.
translation_notes:
  register: Современный литературный русский, ясный и достоинственный. Синтаксический параллелизм двух греческих перфектов сохранён сочетанием «увидел и засвидетельствовал». Заглавные буквы в «Он» и титуле выбраны в соответствии с благоговейной библейской издательской нормой.
