base_translation:
  language: en
  yaml_path: translation/nt/john/001/047.yaml
  text: Jesus saw Nathanael coming toward him and said about him, “Look, truly an Israelite in whom there is no deceit.”
translation:
  language: ru
  text: 'Иисус увидел приближавшегося к Нему Нафанаила и сказал о нём: «Вот истинный израильтянин, в котором нет лукавства».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: Вот
  rationale: Естественное для современного русского повествования указательное восклицание, сохраняющее призыв обратить внимание.
- source_word: ἀληθῶς Ἰσραηλίτης
  choice: истинный израильтянин
  rationale: Передаёт наречие ἀληθῶς и существительное без искусственной буквальности «поистине израильтянин».
- source_word: δόλος
  choice: лукавство
  rationale: Передаёт смысл хитрости, коварства и обмана и сохраняет библейскую выразительность исходного слова.
theological_decisions:
- issue: Характеристика Нафанаила как ἀληθῶς Ἰσραηλίτης
  choice: истинный израильтянин
  alternative: поистине израильтянин
  rationale: Формулировка сохраняет похвальную характеристику Иисуса и не уточняет сверх текста, в каком именно богословском смысле Нафанаил является «истинным» израильтянином.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Вот» звучит естественно и непосредственно; «лукавство» сохраняет смысловую широту δόλος.
