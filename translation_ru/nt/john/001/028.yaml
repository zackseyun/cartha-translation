lexical_decisions:
- source_word: ταῦτα
  choice: Всё это
  rationale: Передаёт множественное указание на предшествующие события и разговор естественным современным русским оборотом.
- source_word: ἐν Βηθανίᾳ
  choice: в Вифании
  rationale: Прямое и естественное обозначение места; сохранена традиционная русская форма топонима.
- source_word: ἐγένετο
  choice: произошло
  rationale: В данном контексте глагол обозначает совершившиеся события; форма нейтральна и современна.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: за Иорданом
  rationale: Кратко и естественно передаёт местонахождение на другой стороне реки относительно повествовательной перспективы.
- source_word: ὅπου
  choice: где
  rationale: Точно и без утяжеления вводит придаточное места.
- source_word: ἦν ὁ Ἰωάννης βαπτίζων
  choice: Иоанн крестил
  rationale: Перифрастическая конструкция указывает на продолжавшуюся деятельность; русская форма несовершенного вида естественно передаёт её длительность.
theological_decisions:
- issue: Чтение названия места Βηθανίᾳ («Вифания») или вариант Βηθαβαρᾷ («Вифавара»)
  choice: Вифания
  alternative: Вифавара
  rationale: Основной текст следует предоставленному критическому тексту SBLGNT; известный вариант сохранён в сноске, а не внесён в основной текст.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным стилем. Формулировка «Всё это» естественно отсылает к предшествующему эпизоду, а «крестил» сохраняет установленную библейскую лексику без архаизации.
