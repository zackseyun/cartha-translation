base_translation:
  language: en
  yaml_path: translation/nt/john/001/042.yaml
  text: He brought him to Jesus[a]. Looking at him, Jesus said, “You are Simon, the son of John[b]; you will be called Cephas” (which is translated Peter).
translation:
  language: ru
  text: 'Он привёл его к Иисусу. Иисус, пристально посмотрев на него, сказал: «Ты — Симон, сын Иоанна[a]. Тебя будут звать Кифа[b]» (что переводится как «Пётр»).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «Ионы»; в тексте SBLGNT: «Иоанна».'
    reason: textual_variant
  - marker: b
    text: Кифа — семитское имя, соответствующее греческому имени Пётр; оба имени связаны со значением «камень» или «скала».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν
  choice: Он привёл его к Иисусу
  rationale: Аорист ἄγω обозначает завершённое приведение человека к кому-либо; «привёл к Иисусу» естественно передаёт направление, выраженное πρός с винительным падежом.
- source_word: ἐμβλέψας αὐτῷ
  choice: пристально посмотрев на него
  rationale: ἐμβλέπω подразумевает направленный, внимательный взгляд; «пристально посмотрев» передаёт эту интенсивность без излишнего истолкования.
- source_word: Σὺ εἶ Σίμων
  choice: Ты — Симон
  rationale: Явное местоимение σὺ сохраняется, а тире естественно передаёт прямоту и акцент именной конструкции в современном русском языке.
- source_word: ὁ υἱὸς Ἰωάννου
  choice: сын Иоанна
  rationale: Перевод следует чтению SBLGNT Ἰωάννου; рукописный вариант «Ионы» отмечен в сноске.
- source_word: σὺ κληθήσῃ
  choice: Тебя будут звать
  rationale: Будущее пассивное καλέω передано естественной русской неопределённо-личной конструкцией, сохраняющей значение будущего наречения именем.
- source_word: Κηφᾶς
  choice: Кифа
  rationale: Семитское личное имя передано принятой русской библейской транслитерацией, а не заменено его нарицательным значением.
- source_word: ὃ ἑρμηνεύεται Πέτρος
  choice: что в переводе означает «Пётр»
  rationale: Оборот сохраняет пояснительный характер греческой фразы и передаёт Πέτρος как личное имя; его буквальный смысл раскрыт в сноске.
theological_decisions:
- issue: Передача пояснения Кηφᾶς / Πέτρος
  choice: 'Сохранить оба личных имени: «Кифа» и «Пётр», пояснив их значение в сноске'
  alternative: Перевести имя непосредственно как «Камень» или «Скала»
  rationale: В стихе речь идёт о наречении новым именем, и сам греческий текст соотносит семитскую и греческую формы. Сохранение имён не навязывает богословского вывода, тогда как сноска передаёт важную игру значения.
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным повествованием. «Пристально посмотрев» сохраняет выразительность исходного глагола, а «тебя будут звать» звучит естественнее буквального пассива «ты будешь назван». Все сноски привязаны к соответствующим словам основного текста.
