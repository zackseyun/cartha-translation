  text: In him was life[a], and the life was the light of men.
translation:
  language: ru
  text: В Нём была жизнь, и жизнь была светом для людей.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «светом людей»; также возможно: «светом человечества». Греческое слово обозначает здесь людей вообще.'
    reason: лексическая и синтаксическая альтернатива
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: В Нём
  rationale: Предлог ἐν с дательным естественно передаётся как «в». Местоимение относится к Слову (λόγος) из предыдущего контекста; личная форма «Нём» соответствует тому, как Слово представлено в прологе.
- source_word: ζωὴ
  choice: жизнь
  rationale: Прямое соответствие греческому ζωή. Богословская глубина понятия сохраняется без уточняющей парафразы вроде «вечная жизнь».
- source_word: ἦν
  choice: была
  rationale: Имперфект εἰμί здесь естественно передаётся прошедшим временем глагола «быть» и согласуется с повествовательной формой пролога.
- source_word: ἡ ζωὴ
  choice: жизнь
  rationale: Русский язык обычно не выражает анафорическую определённость артиклем; повтор существительного ясно отсылает к только что упомянутой жизни.
- source_word: τὸ φῶς
  choice: светом
  rationale: φῶς означает «свет». Творительный падеж после «была» естественно выражает именную часть сказуемого в современном русском.
- source_word: τῶν ἀνθρώπων
  choice: для людей
  rationale: ἄνθρωποι обозначает людей вообще, без ограничения мужчинами. Хотя греческая форма — родительный падеж («людей»), оборот «светом для людей» в русском естественно передаёт смысл отношения света к человечеству и избегает двусмысленного «светом людей».
theological_decisions:
- issue: Референт и личный характер αὐτῷ
  choice: 'Местоимение передано лично: «в Нём», с отсылкой к Слову.'
  alternative: «в нём/этом», если понимать λόγος отвлечённо
  rationale: Ближайший контекст представляет Слово в личных отношениях с Богом и далее говорит о Его воплощении. Личная форма сохраняет контекстуальную силу, не добавляя к стиху позднейших формулировок.
- issue: Значение родительного τῶν ἀνθρώπων
  choice: Передано как «для людей».
  alternative: «светом человечества» или формально «светом людей»
  rationale: Греческий родительный допускает характеристику света по его отношению к людям. Русское «для людей» ясно и естественно выражает направленность или значимость света, не ограничивая ἀνθρώπων мужчинами; примечание сохраняет более формальную альтернативу.
translation_notes:
  register: Современный литературный русский, простой и торжественный. Сохранены краткость, параллелизм и ключевые образы пролога; заглавная буква в «Нём» подчёркивает личную отсылку к Слову согласно принятой русской библейской норме.
