  source_fidelity: '«В Нём была жизнь, и жизнь была светом для людей» точно передаёт структуру и основные лексемы греческого текста: ἐν αὐτῷ, ζωή, повтор ζωή, φῶς и родительное τῶν ἀνθρώπων. Оборот «для людей» несколько эксплицирует отношение, выраженное греческим родительным, однако в русском он является естественной и смыслово оправданной передачей: речь идёт о свете в его отношении ко всем людям, а не о свете, принадлежащем людям.'
