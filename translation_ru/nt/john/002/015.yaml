  text: καὶ ποιήσας φραγέλλιον ἐκ σχοινίων πάντας ἐξέβαλεν ἐκ τοῦ ἱεροῦ τά τε πρόβατα καὶ τοὺς βόας, καὶ τῶν κολλυβιστῶν ἐξέχεεν ⸂τὰ κέρματα⸃ καὶ τὰς τραπέζας ⸀ἀνέστρεψεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/015.yaml
  text: And after making a whip out of cords[a], he drove them all out of the temple courts, including both the sheep and the cattle[c][b]; and he poured out the coins of the money changers and overturned the tables.
translation:
  language: ru
  text: Сделав бич из верёвок, Он выгнал всех с храмовой территории — и овец, и волов[a]; Он высыпал монеты менял и перевернул столы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст говорит: «выгнал всех», а затем называет овец и волов. Он не утверждает прямо, что Иисус применил бич к людям.'
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσας
  choice: сделав
  rationale: Аористное причастие обозначает действие, предшествующее основному; русское деепричастие естественно и ясно передаёт последовательность.
- source_word: φραγέλλιον ἐκ σχοινίων
  choice: бич из верёвок
  rationale: «Бич» — понятное и достойное обозначение орудия, а «из верёвок» сохраняет указание на материал; σχοινίον может обозначать верёвку или шнур.
- source_word: πάντας ἐξέβαλεν
  choice: выгнал всех
  rationale: Сохраняется мужская форма πάντας и полнота действия, при этом перевод сам по себе не сужает круг до людей или животных.
- source_word: ἐκ τοῦ ἱεροῦ
  choice: с храмовой территории
  rationale: ἱερόν обозначает весь храмовый комплекс, а не собственно святилище (ναός). Формулировка понятна современному читателю и точнее общего «из храма».
- source_word: τά τε πρόβατα καὶ τοὺς βόας
  choice: и овец, и волов
  rationale: Парная конструкция τε…καί передана естественным русским «и… и»; «волы» точно и традиционно передаёт βόες в данном хозяйственно-жертвенном контексте.
- source_word: κολλυβιστῶν
  choice: менял
  rationale: «Менялы» — краткое и общепонятное обозначение людей, обменивавших деньги.
- source_word: ἐξέχεεν τὰ κέρματα
  choice: монеты … рассыпал
  rationale: Буквальное значение ἐκχέω — «выливать, высыпать»; применительно к монетам естественное русское «рассыпал» передаёт наблюдаемое действие без неуместного образа жидкости.
- source_word: τὰς τραπέζας ἀνέστρεψεν
  choice: столы перевернул
  rationale: В данном контексте ἀναστρέφω означает опрокинуть или перевернуть; выбран современный нейтральный глагол.
theological_decisions:
- issue: Кого Иисус выгнал и к кому применил бич
  choice: «выгнал всех … и овец, и волов» без утверждения, что бич был применён к людям
  alternative: «выгнал всех людей и животных» или «выгнал только животных»
  rationale: Греческое πάντας имеет мужскую форму, после чего названы овцы и волы; синтаксис допускает напряжение в определении охвата. Текст не говорит прямо, что Иисус бил бичом людей, поэтому перевод этого не добавляет.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Храмовая территория» раскрывает значение ἱερόν; перестановка «монеты менял Он рассыпал» сохраняет ясную связь родительного падежа и ритмическое противопоставление действий.
