source:
  edition: SBLGNT
  text: ἀπεκρίθησαν οὖν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Τί σημεῖον δεικνύεις ἡμῖν, ὅτι ταῦτα ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/018.yaml
  text: So the Jews answered and said to him[a], “What sign do you show us, that you do these things?”
translation:
  language: ru
  text: 'Тогда иудеи[a] сказали ему в ответ: «Какое знамение ты покажешь нам, раз делаешь всё это?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «иудейские начальники» или «жители Иудеи». В Евангелии от Иоанна выражение «иудеи» в зависимости от контекста может обозначать не весь еврейский народ, а более узкую представительную группу, особенно иудейские власти.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν … καὶ εἶπαν αὐτῷ
  choice: сказали ему в ответ
  rationale: Естественно передаёт характерную греческую формулу введения ответной реплики, не воспроизводя её тяжеловесно как «ответили и сказали».
- source_word: οὖν
  choice: тогда
  rationale: Обозначает развитие повествования и связь с совершённым Иисусом в храме; «тогда» здесь естественнее русского «итак».
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Сохраняет прямое значение греческого выражения, не сужая его в основном тексте до начальников или жителей Иудеи; возможное контекстуальное сужение отмечено в сноске.
- source_word: Τί σημεῖον
  choice: какое знамение
  rationale: «Знамение» сохраняет важный для Евангелия от Иоанна смысл действия, удостоверяющего личность и полномочия и указывающего за пределы самого чуда.
- source_word: δεικνύεις ἡμῖν
  choice: ты покажешь нам
  rationale: Будущая форма естественна в русском вопросе о требуемом предъявлении знамения, хотя греческий глагол стоит в настоящем времени.
- source_word: ὅτι
  choice: раз
  rationale: 'Передаёт причинно-обосновывающую связь: требование знамения вызвано тем, что Иисус совершает эти действия. При этом перевод не добавляет прямо не названные в тексте «власть» или «право».'
- source_word: ταῦτα ποιεῖς
  choice: делаешь всё это
  rationale: Передаёт множественное ταῦτα и настоящее время, отсылая ко всему только что совершённому Иисусом в храме.
theological_decisions:
- issue: Кого обозначает выражение οἱ Ἰουδαῖοι в Евангелии от Иоанна
  choice: Сохранить в основном тексте «иудеи»
  alternative: «иудейские начальники» или «жители Иудеи»
  rationale: Контекст может указывать на ограниченную представительную группу, особенно на иудейских начальников, однако сам стих прямо этого не уточняет. Поэтому основной текст не вводит дополнительного ограничения, а неоднозначность поясняется в сноске.
- issue: Основание требования знамения
  choice: «раз делаешь всё это»
  alternative: «в подтверждение того, что имеешь право так поступать»
  rationale: Более развёрнутый вариант правдоподобно выражает подразумеваемый вопрос о полномочиях, но добавляет слова «право» и «подтверждение», которых в греческом тексте нет. Выбранный вариант сохраняет причинную связь и исходную недосказанность.
translation_notes:
  register: Современный литературный русский язык; реплика звучит естественно и достойно. Местоимения, относящиеся к Иисусу, даны со строчной буквы по общим нормам современного повествовательного текста. Формула «сказали ему в ответ» сохраняет структуру греческого диалога без буквальной тяжеловесности.
