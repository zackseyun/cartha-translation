  text: ἐκλήθη δὲ καὶ ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὸν γάμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/002.yaml
  text: Jesus also was invited to the wedding[a], along with his disciples.
translation:
  language: ru
  text: На свадьбу пригласили также Иисуса и Его учеников.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκλήθη
  choice: пригласили
  rationale: Пассивная форма καλέω в контексте свадьбы означает приглашение на торжество. Русская неопределённо-личная конструкция естественно передаёт греческий пассив.
- source_word: δὲ καὶ
  choice: также
  rationale: Сочетание мягкого связующего δέ с καί добавляет Иисуса и учеников к уже названным участникам; «также» ясно и естественно выражает эту связь.
- source_word: ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ
  choice: Иисуса и Его учеников
  rationale: Союз καί непосредственно соединяет Иисуса с Его учениками как приглашённых. «Ученики» — точный и устоявшийся евангельский эквивалент μαθηταί.
- source_word: εἰς τὸν γάμον
  choice: на свадьбу
  rationale: В данном контексте γάμος обозначает свадебное торжество; по-русски приглашение естественно оформляется сочетанием «на свадьбу» без добавления отсутствующего в тексте слова «пир».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; фраза естественна и в то же время сохраняет порядок смысловых компонентов исходного текста. Местоимение «Его» написано с прописной буквы согласно традиционному библейскому издательскому регистру, без изменения смысла.
