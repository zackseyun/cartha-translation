base_translation:
  language: en
  yaml_path: translation/nt/john/002/006.yaml
  text: There were six stone water jars standing there[a], in accordance with the Jewish rites of purification[b], each holding two or three measures.
translation:
  language: ru
  text: Там стояли шесть каменных сосудов для воды, поставленных по иудейскому обычаю очищения[a]; каждый из них вмещал по две или три меры.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для очищения по иудейскому обычаю». Речь идёт о ритуальном очищении.'
    reason: lexical_alternative
  - marker: b
    text: Мера (греч. «метрет») — древняя мера объёма жидкостей, приблизительно 35–40 литров. Следовательно, каждый сосуд вмещал около 70–120 литров.
    reason: cultural_note
lexical_decisions:
- source_word: ἦσαν δὲ ἐκεῖ
  choice: Там стояли
  rationale: δέ служит лёгкой связкой и не требует отдельного вводного слова; ἐκεῖ передано как «там», а вместе с κείμεναι естественно выражает наличие и расположение сосудов.
- source_word: λίθιναι ὑδρίαι
  choice: каменных сосудов для воды
  rationale: λίθιναι указывает на материал, а ὑδρίαι — на ёмкости для воды. «Сосуды для воды» звучит современно и достойно, не создавая образа обычных небольших кувшинов.
- source_word: κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων
  choice: предназначенных для иудейского обряда очищения
  rationale: В данном контексте κατά соотносит сосуды с практикой ритуального очищения; формулировка передаёт назначение, не сводя выражение к бытовому мытью.
- source_word: κείμεναι
  choice: стояли
  rationale: κεῖμαι означает находиться или быть поставленным; применительно к крупным сосудам русское «стояли» естественно передаёт их положение.
- source_word: χωροῦσαι ἀνὰ μετρητὰς δύο ἢ τρεῖς
  choice: каждый вмещал по две или три меры
  rationale: χωροῦσαι обозначает вместимость, а ἀνά имеет распределительное значение. Древняя единица сохранена в тексте, а её приблизительный современный эквивалент дан в примечании.
theological_decisions:
- issue: Значение τῶν Ἰουδαίων в повествовании Иоанна
  choice: иудейского обряда очищения
  alternative: обряда очищения жителей Иудеи
  rationale: Здесь речь идёт о религиозно-культурном обычае, а не о региональном происхождении, поэтому «иудейского» точнее передаёт контекст и не усиливает полемический оттенок.
- issue: Отношение сосудов к очищению в обороте κατά
  choice: предназначенных для обряда очищения
  alternative: стоявших согласно обряду очищения
  rationale: Греческий оборот допускает оттенки соответствия обычаю и назначения. В контексте сосудов формулировка с назначением наиболее естественна, при этом примечание сохраняет возможный более общий смысл.
translation_notes:
  register: Современный литературный русский язык; ясная повествовательная конструкция без архаического начального связочного слова. Термин «обряд очищения» сохраняет ритуальный смысл, а древняя мера оставлена в основном тексте с пояснением в сноске.
