  text: καὶ τοῖς τὰς περιστερὰς πωλοῦσιν εἶπεν· Ἄρατε ταῦτα ἐντεῦθεν, μὴ ποιεῖτε τὸν οἶκον τοῦ πατρός μου οἶκον ἐμπορίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/016.yaml
  text: And he said to those selling the doves[a], “Take these things away from here; do not make my Father’s house a house of trade.”
translation:
  language: ru
  text: 'А продающим голубей Он сказал: «Уберите это отсюда и не превращайте дом Моего Отца в дом торговли».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рынок». Буквально по-гречески: «дом торговли»; так сохраняется повтор слова «дом» в этой фразе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιστερὰς
  choice: голубей
  rationale: Обычное русское обозначение птиц, продававшихся для жертвоприношений; контекст не требует более узкого зоологического уточнения.
- source_word: πωλοῦσιν
  choice: продающим
  rationale: Причастие настоящего времени естественно передаёт продолжающееся занятие названной группы.
- source_word: Ἄρατε ταῦτα ἐντεῦθεν
  choice: Уберите это отсюда
  rationale: Краткая повелительная конструкция передаёт решительный приказ удалить находящееся здесь; нейтральное «это» не уточняет референт сверх греческого текста.
- source_word: μὴ ποιεῖτε
  choice: не превращайте
  rationale: В данном сочетании двух назначений одного места по-русски естественно «не превращайте»; оно передаёт запрет, не вводя значения прекращения, которого грамматическая форма сама по себе не требует.
- source_word: οἶκον τοῦ πατρός μου
  choice: дом Моего Отца
  rationale: Сохраняет прямое указание Иисуса на Отца и местоимение первого лица единственного числа.
- source_word: οἶκον ἐμπορίου
  choice: дом торговли
  rationale: Сохраняет повтор слова οἶκος — «дом… дом» — и риторическое противопоставление, хотя по-русски это менее привычно, чем «рынок».
theological_decisions:
- issue: Обозначение храма как «дома Моего Отца»
  choice: дом Моего Отца
  alternative: дом Бога; дом нашего Отца
  rationale: Греческий текст прямо говорит τοῦ πατρός μου, поэтому сохраняется личное «Моего», без ослабления или расширения сыновнего утверждения.
- issue: Характер осуждаемого использования храма
  choice: дом торговли
  alternative: рынок
  rationale: Перевод не утверждает, что осуждается торговля вообще, а сохраняет контекстуальное противопоставление предназначения храма коммерческому использованию.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достойный библейского повествования. Прописные буквы в «Он» и «Моего» отражают принятую русскую издательскую практику в отношении Иисуса и Бога, не меняя смысла исходного текста.
