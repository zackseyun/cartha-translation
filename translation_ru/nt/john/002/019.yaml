reference: John 2:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Λύσατε τὸν ναὸν τοῦτον καὶ ἐν τρισὶν ἡμέραις ἐγερῶ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/019.yaml
  text: Jesus answered and said to them[a], “Destroy this temple, and in three days I will raise it up.”
translation:
  language: ru
  text: 'Иисус ответил им[a]: «Разрушьте этот храм, и за три дня Я воздвигну его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разберите этот храм… и Я подниму его». Глагол, переведённый как «воздвигну», может также вызывать ассоциацию с воскресением; далее Иоанн поясняет, что Иисус говорил о храме Своего тела (2:21).'
    reason: Лексическая альтернатива и сохранение воскресительного оттенка ἐγείρω.
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: ответил
  rationale: Греческая парная формула буквально означает «ответил и сказал», но в современном русском естественно и полно передаётся одним глаголом «ответил»; смысловой компонент речи выражен последующей прямой речью.
- source_word: Λύσατε
  choice: Разрушьте
  rationale: В данном контексте λύω означает разрушить или разобрать храм, а не просто «развязать». «Разрушьте» сохраняет прямоту повелительной формы и допускает как буквальное храмовое, так и раскрываемое далее телесное прочтение.
- source_word: τὸν ναὸν τοῦτον
  choice: этот храм
  rationale: ναός обозначает храм или собственно святилище. «Храм» естественно для русского повествования и не снимает намеренной неоднозначности, разъясняемой в Ин. 2:21.
- source_word: ἐν τρισὶν ἡμέραις
  choice: за три дня
  rationale: Оборот передаёт срок, в течение которого действие будет совершено. Русское «за три дня» естественно сочетается с «воздвигну» и не уточняет сверх текста способ отсчёта дней.
- source_word: ἐγερῶ
  choice: воздвигну
  rationale: ἐγείρω может означать поднять, воздвигнуть и воскресить. «Воздвигну» естественно относится к храму и одновременно сохраняет возвышенный оттенок поднятия, не сводя смысл исключительно к архитектурному «отстрою заново».
- source_word: αὐτόν
  choice: его
  rationale: Местоимение согласуется с ближайшим выраженным референтом «храм» и не вводит раньше времени пояснение о теле Иисуса.
theological_decisions:
- issue: Следует ли прямо пояснить, что под храмом понимается тело Иисуса
  choice: Сохранить в основном тексте выражение «этот храм» без поясняющей вставки.
  alternative: «Разрушьте этот храм — Моё тело»
  rationale: Само изречение намеренно загадочно, а авторское объяснение появляется лишь в Ин. 2:21. Досрочное пояснение устранило бы повествовательное и богословское напряжение.
- issue: Передавать ли ἐγερῶ архитектурным или воскресительным термином
  choice: «воздвигну»
  alternative: «восстановлю» / «воскрешу»
  rationale: «Восстановлю» чрезмерно сужает образ до строительства, а «воскрешу» преждевременно раскрывает телесный референт. «Воздвигну» позволяет услышать оба смысловых плана.
translation_notes:
  register: Современный литературный русский с краткой, торжественной прямой речью. Архаизирующая формула «ответил и сказал» устранена как неестественная для целевого регистра; прописное «Я» соответствует принятому уважительному оформлению речи Иисуса.
