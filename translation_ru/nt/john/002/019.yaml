  source_fidelity: 'Текст точно передаёт греческое изречение: обращение Иисуса к собеседникам, повелительное «Разрушьте», указательное «этот храм», срок «за три дня» и будущее действие «Я воздвигну его». Сведение формулы ἀπεκρίθη … καὶ εἶπεν к «ответил» естественно для современного русского и не утрачивает существенного смысла.'
  naturalness: Фраза звучит естественно в современном литературном русском и сохраняет краткий, торжественный характер прямой речи. «Воздвигну» несколько возвышенно, но уместно в данном контексте и хорошо сочетается с «храмом».
  terminology: «Храм» корректно передаёт ναός без преждевременного раскрытия образа тела Иисуса. «Воздвигну» не сводит ἐγερῶ к нейтрально-строительному «восстановлю» и оставляет возможность воскресительного отзвука, разъяснённого в сноске и последующем контексте.
