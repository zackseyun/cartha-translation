base_translation:
  language: en
  yaml_path: translation/nt/john/002/003.yaml
  text: And when the wine ran out[a], the mother of Jesus says to him[b], “They have no wine.”
translation:
  language: ru
  text: 'А когда вино кончилось[a], мать Иисуса говорит Ему[b]: «У них нет вина».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «когда вина стало не хватать».'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте употреблено историческое настоящее: «говорит». В переводе возможно также прошедшее время: «сказала».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστερήσαντος οἴνου
  choice: когда вино кончилось
  rationale: Генитив абсолютный с аористным причастием обозначает обстоятельство, предшествующее главному действию. По-русски естественно сказать «вино кончилось»; более буквальная передача отмечена в сноске.
- source_word: λέγει
  choice: говорит
  rationale: Сохранён исторический презенс, придающий повествованию Иоанна живость; в русском повествовании такая форма звучит естественно.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: мать Иисуса
  rationale: Передача близко следует греческой формулировке и сохраняет характерный для данного контекста способ обозначения матери Иисуса.
- source_word: πρὸς αὐτόν
  choice: Ему
  rationale: При глаголе речи русская дательная конструкция естественно передаёт направление речи к Иисусу.
- source_word: Οἶνον οὐκ ἔχουσιν
  choice: У них нет вина
  rationale: Не названный прямо субъект множественного числа передан местоимением «них», без уточнения, идёт ли речь о хозяевах или обо всех устроителях свадьбы.
- source_word: οἶνος
  choice: вино
  rationale: Обычное и контекстуально точное значение слова; оснований ослаблять или описательно перефразировать его нет.
theological_decisions:
- issue: Историческое настоящее в повествовании Иоанна
  choice: 'Сохранить настоящее время: «говорит»'
  alternative: 'Передать прошедшим временем: «сказала»'
  rationale: Настоящее время отражает дискурсивную фактуру греческого текста и остаётся естественным в русском повествовании, не создавая богословского смещения.
- issue: Референт подразумеваемого субъекта во фразе Οἶνον οὐκ ἔχουσιν
  choice: 'Сохранить неопределённость: «У них нет вина»'
  alternative: 'Уточнить: «У хозяев нет вина» или «У устроителей свадьбы нет вина»'
  rationale: Греческий текст не называет референта прямо, поэтому уточнение внесло бы отсутствующую в источнике деталь.
translation_notes:
  register: Современный литературный русский язык с ясной, dignified повествовательной интонацией. Историческое настоящее сохранено; местоимение «Ему» написано с прописной буквы согласно распространённой русской библейской издательской норме.
