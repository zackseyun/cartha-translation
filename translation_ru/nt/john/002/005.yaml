  yaml_path: translation/nt/john/002/005.yaml
  text: His mother said to the servants[a], “Whatever he tells you, do it.”
translation:
  language: ru
  text: 'Его мать сказала слугам: «Что бы Он вам ни сказал, сделайте».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с более близким к греческому порядком слов: «Что бы Он ни сказал вам, сделайте».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ αὐτοῦ
  choice: Его мать
  rationale: Естественно передаёт греческую конструкцию с родительным местоимением и сохраняет повествовательное обозначение родства.
- source_word: διακόνοις
  choice: слугам
  rationale: В контексте свадебного пира речь идёт о людях, прислуживающих гостям, а не о церковном служении диакона.
- source_word: Ὅ τι ἂν
  choice: Что бы … ни
  rationale: Русская уступительно-обобщительная конструкция естественно передаёт неопределённость и открытость греческого относительного оборота с ἄν.
- source_word: λέγῃ ὑμῖν
  choice: Он вам ни сказал
  rationale: Форма сослагательного наклонения после ἄν имеет неопределённо-будущее значение; выбранная русская конструкция сохраняет его без тяжеловесного буквального оборота.
- source_word: ποιήσατε
  choice: сделайте
  rationale: Совершенный вид и повелительное наклонение передают решительный аористный императив; объект уже выражен предшествующим оборотом и не требует добавления местоимения.
theological_decisions:
- issue: Подразумеваемое подлежащее при λέγῃ
  choice: Он — то есть Иисус — обозначен местоимением без добавления имени
  alternative: Что бы Иисус вам ни сказал, сделайте.
  rationale: В греческом подлежащее не названо, хотя из контекста ясно, что речь об Иисусе. Местоимение сохраняет лаконичность оригинала и не вносит ненужного пояснения.
translation_notes:
  register: Современный литературный русский язык; синтаксис естественный и ясный, тон сдержанный и достойный. Местоимение «Он» написано с прописной буквы как принятое в русской библейской традиции обозначение Иисуса; это не устраняет контекстуально ясный референт.
