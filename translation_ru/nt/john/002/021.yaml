  text: ἐκεῖνος δὲ ἔλεγεν περὶ τοῦ ναοῦ τοῦ σώματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/021.yaml
  text: But he was speaking about the temple of his body[a].
translation:
  language: ru
  text: Но Он говорил о храме Своего тела[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о святилище Своего тела». Греческое слово нао́с часто обозначает собственно святилище, а не весь храмовый комплекс.'
    reason: 'Лексическая альтернатива: уточняется более узкое значение ναός.'
lexical_decisions:
- source_word: ἐκεῖνος
  choice: Он
  rationale: Указательное местоимение относится к Иисусу; в современном русском естественно передаётся личным местоимением без избыточного акцента.
- source_word: δὲ
  choice: Но
  rationale: Частица обозначает мягкое противопоставление ошибочному пониманию собеседников в предыдущем стихе.
- source_word: ἔλεγεν
  choice: говорил
  rationale: Имперфект описывает речь Иисуса в прошлом; форма «говорил» сохраняет видовое значение и не подменяет речь толкованием «имел в виду».
- source_word: περὶ
  choice: о
  rationale: Предлог с родительным падежом означает «о, относительно»; краткое «о» естественно в русском.
- source_word: ναοῦ
  choice: храме
  rationale: ναός может обозначать собственно святилище, в отличие от всего храмового комплекса; общеупотребительное «храм» сохраняет ясность, а уточнение вынесено в сноску.
- source_word: σώματος
  choice: тела
  rationale: Прямо передаёт родительный падеж и сохраняет ключевую метафору исходного текста.
- source_word: αὐτοῦ
  choice: Своего
  rationale: Русское возвратное притяжательное местоимение естественно указывает, что речь идёт о теле самого субъекта — Иисуса; прописная буква соответствует почтительному библейскому употреблению.
theological_decisions:
- issue: Метафорическое отождествление тела Иисуса с храмом
  choice: Сохранить непосредственную формулировку «о храме Своего тела» без поясняющей вставки.
  alternative: «о Своём теле как о храме»; «о святилище Своего тела»
  rationale: Родительная конструкция оригинала сохраняет образ и его богословскую напряжённость, не превращая авторское пояснение в расширительное толкование.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и торжественная. Синтаксис оригинальной метафоры сохранён, а специальный оттенок ναός пояснён в сноске.
