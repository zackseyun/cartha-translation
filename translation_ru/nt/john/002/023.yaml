id: JHN.2.23
reference: John 2:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις ἐν τῷ πάσχα ἐν τῇ ἑορτῇ, πολλοὶ ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ, θεωροῦντες αὐτοῦ τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/023.yaml
  text: When he was in Jerusalem at the Passover[a], during the feast[b], many believed in his name as they were seeing the signs that he was doing.
translation:
  language: ru
  text: Когда он был в Иерусалиме на Пасху, во время праздника, многие поверили в его имя[a], видя знамения[b], которые он совершал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поверили в него». Буквально: «поверили в его имя» — характерное для Иоанна выражение, подчёркивающее доверие к тому, кем он открыл себя.'
    reason: lexical_alternative
  - marker: b
    text: '«Знамения» — характерное для Иоанна обозначение деяний, которые указывают на то, кем является Иисус; возможный перевод: «чудесные знамения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Когда
  rationale: Передаёт временное значение ὡς и естественно вводит новую сцену; слабая связующая функция δέ в русском не требует отдельного слова.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: в Иерусалиме
  rationale: Естественное современное русское обозначение места.
- source_word: ἐν τῷ πάσχα ἐν τῇ ἑορτῇ
  choice: на Пасху, во время праздника
  rationale: Сохраняет и указание на Пасху, и поясняющее упоминание праздника, не устраняя присущую греческому тексту повторность.
- source_word: ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  choice: поверили в его имя
  rationale: Сохраняет характерное для Иоанна выражение с «именем», не сводя его сразу к более общему «поверили в него».
- source_word: θεωροῦντες
  choice: видя
  rationale: Деепричастие естественно выражает одновременное наблюдение, обозначенное причастием настоящего времени.
- source_word: τὰ σημεῖα
  choice: знамения
  rationale: Передаёт характерный для Иоанна термин о деяниях, указывающих за пределы самих событий на личность Иисуса, без добавления толкования «чудесные».
- source_word: ἃ ἐποίει
  choice: которые он совершал
  rationale: Несовершенный вид глагола «совершал» передаёт продолжающееся или повторяющееся действие греческого имперфекта.
theological_decisions:
- issue: Характер веры, выраженной словами ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  choice: «многие поверили в его имя» без оценки искренности или полноты этой веры
  alternative: «многие лишь поверхностно уверовали в него» или «многие поверили в него из-за чудес»
  rationale: Сам стих прямо говорит о вере в его имя, тогда как следующий стих вносит повествовательное напряжение. Перевод не должен заранее разрешать это напряжение или принижать названную здесь веру.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно торжественным звучанием. Местоимения, относящиеся к Иисусу, даны со строчной буквы согласно обычной современной орфографии и без внесения отсутствующего в греческом тексте типографского различия. Повторность «на Пасху, во время праздника» сохранена как отражение структуры оригинала.
