  source_fidelity: Текст точно передаёт временную рамку, пребывание в Иерусалиме, двойное указание на Пасху и праздник, веру многих «в его имя», одновременное наблюдение знамений и продолженный характер действий Иисуса. Неоднозначность характера этой веры не истолковывается преждевременно.
  naturalness: Современный литературный русский в целом естественен. Формула «поверили в его имя» намеренно сохраняет несколько необычную для современного употребления иоаннову формулу; сноска делает её понятной, не подменяя перевод толкованием. «На Пасху, во время праздника» несколько повторно, но это оправдано повтором ἐν в оригинале.
  terminology: «Знамения» удачно сохраняет характерный иоаннов термин σημεῖα без добавления слова «чудесные». «Поверили в его имя» и сноска корректно сохраняют πιστεύω εἰς τὸ ὄνομα αὐτοῦ. Имена, регистр и местоименное написание последовательны и не вносят богословской интерпретации.
