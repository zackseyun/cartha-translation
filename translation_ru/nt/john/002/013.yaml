  text: Приближалась иудейская Пасха[a], и Иисус поднялся в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пасха жителей Иудеи». В Евангелии от Иоанна слово Ἰουδαῖοι в некоторых контекстах может означать жителей Иудеи, однако здесь оно, вероятнее всего, указывает на иудейский праздник.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς ἦν
  choice: приближалась
  rationale: В данном контексте выражение обозначает временную близость праздника. «Приближалась» естественно передаёт это значение по-русски.
- source_word: πάσχα
  choice: Пасха
  rationale: Общепринятое русское название иудейского праздника; прописная буква соответствует современной практике написания названия праздника.
- source_word: τῶν Ἰουδαίων
  choice: иудейская
  rationale: Здесь определение характеризует Пасху как праздник иудеев. Прилагательное «иудейская» звучит естественнее буквального родительного оборота и не смешивает этот праздник с христианской Пасхой.
- source_word: ἀνέβη
  choice: отправился
  rationale: Глагол буквально означает «поднялся, пошёл вверх» и употребляется о пути в Иерусалим. В современном русском «отправился» естественно обозначает поездку; пространственно-паломнический оттенок отмечен в сноске.
- source_word: εἰς Ἱεροσόλυμα
  choice: в Иерусалим
  rationale: Стандартная передача названия города и направления движения.
- source_word: Καὶ … καὶ
  choice: … и
  rationale: Начальное καί выполняет функцию повествовательной связи и не требует отдельного «и» в русском начале нового эпизода; второе καί естественно передано союзом «и».
theological_decisions:
- issue: Значение Ἰουδαῖοι в Евангелии от Иоанна
  choice: иудейская
  alternative: юдейская / Пасха жителей Иудеи
  rationale: В этом стихе слово определяет Пасху как общеиудейский религиозный праздник, а не указывает на узкую региональную или полемически очерченную группу. Возможный региональный смысл термина сохранён в сноске.
- issue: Передача ἀνέβη применительно к Иерусалиму
  choice: отправился
  alternative: поднялся
  rationale: Буквальное «поднялся» сохраняет географический и паломнический оттенок, но без контекста может быть понято как простое движение вверх. Основной текст избирает ясную современную формулировку, а исходный образ поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достойный. Формулировка избегает лишнего начального связующего слова и сохраняет естественный ход повествования.
