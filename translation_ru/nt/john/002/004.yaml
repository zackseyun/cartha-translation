lexical_decisions:
- source_word: λέγει
  choice: сказал
  rationale: Греческое историческое настоящее передано прошедшим временем, естественным для современного русского повествования.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Какое это имеет отношение ко Мне и к тебе
  rationale: Идиома обозначает различие или дистанцию в отношении к происходящему. Перевод передаёт её смысл современным русским языком, не усиливая фразу до разрыва отношений или враждебного упрёка.
- source_word: γύναι
  choice: женщина
  rationale: Сохранено прямое значение обращения. В данном культурном контексте оно не обязательно было грубым; добавление «дорогая» внесло бы отсутствующую в греческом тексте теплоту, а «госпожа» звучало бы неуместно.
- source_word: οὔπω
  choice: ещё не
  rationale: Точно передаёт указание на то, что ожидаемый момент до сих пор не наступил.
- source_word: ἥκει
  choice: пришёл
  rationale: Глагол означает прибытие или наступление; сочетание «час пришёл» естественно по-русски и сохраняет характерный для Иоанна образ.
- source_word: ἡ ὥρα μου
  choice: Мой час
  rationale: Буквальное «час» сохраняет важный для Евангелия от Иоанна мотив назначенного времени служения и прославления Иисуса; более общее «время» ослабило бы эту связь.
theological_decisions:
- issue: Тон ответа Иисуса матери
  choice: Уважительный, но дистанцирующий ответ, не оскорбление
  alternative: Резкий упрёк или, напротив, подчёркнуто ласковое обращение
  rationale: Идиома Τί ἐμοὶ καὶ σοί обозначает различие интересов или ответственности, а γύναι могло быть нормальным обращением. Перевод сохраняет напряжённость реплики, не делая её ни грубее, ни теплее исходного текста.
- issue: Смысл выражения «Мой час»
  choice: Сохранить буквальное выражение с его более широким богословским звучанием
  alternative: Понимать его только как момент совершения данного знамения либо нейтрально перевести «Моё время»
  rationale: В Евангелии от Иоанна «час» тематически связан с миссией, страданиями, смертью и прославлением Иисуса. Основной текст сохраняет эту возможность, не ограничивая значение одним конкретным толкованием.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным звучанием. Не сохранён архаичный вариант «Что Мне и Тебе, Жено?». Местоимения, относящиеся к Иисусу в прямой речи, оформлены с прописной буквы в соответствии с распространённой русской библейской издательской практикой.
