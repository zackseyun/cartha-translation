base_translation:
  language: en
  yaml_path: translation/nt/john/002/010.yaml
  text: And he said to him[a], “Everyone sets out the good wine first, and when they have become drunk, then the inferior[b]. But you have kept the good wine until now.”
translation:
  language: ru
  text: 'И сказал ему: «Каждый сначала подаёт хорошее вино, а когда гости опьянеют[a], подаёт вино похуже. Ты же сохранил хорошее вино до сих пор».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «напьются»; возможна также более смягчённая передача: «выпьют вдоволь». Греческий глагол обычно означает «опьянеть, стать пьяным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: сказал ему
  rationale: Настоящее λέγει употреблено как историческое настоящее; в современном русском повествовании естественно передать его прошедшим временем.
- source_word: Πᾶς ἄνθρωπος
  choice: всякий человек
  rationale: Сохранена обобщающая конструкция в единственном числе; она относится к людям вообще, а не только к мужчинам.
- source_word: πρῶτον
  choice: сначала
  rationale: Передаёт последовательность действий естественнее для русской прямой речи, чем буквальное «первым».
- source_word: τὸν καλὸν οἶνον
  choice: хорошее вино
  rationale: καλός здесь указывает на качество вина и противопоставлен более низкому по качеству вину.
- source_word: τίθησιν
  choice: подаёт
  rationale: В контексте пира русское «подаёт» естественно выражает выставление вина перед гостями.
- source_word: ὅταν μεθυσθῶσιν
  choice: когда гости опьянеют
  rationale: Глагол μεθύω прямо обозначает опьянение; «гости» добавлено из контекста как ясное обозначение подразумеваемого подлежащего множественного числа.
- source_word: τὸν ἐλάσσω
  choice: то, что похуже
  rationale: Сравнительная форма означает вино более низкого качества; существительное «вино» подразумевается, а разговорно-нейтральное «то, что похуже» естественно звучит в реплике.
- source_word: τετήρηκας
  choice: сберёг
  rationale: Совершенный вид передаёт совершившееся сохранение вина с результатом к данному моменту.
- source_word: ἕως ἄρτι
  choice: до сих пор
  rationale: Точно и естественно указывает на настоящий момент повествования.
theological_decisions:
- issue: Значение μεθυσθῶσιν в рассказе о чуде с вином
  choice: Сохранить прямое значение «опьянеют»
  alternative: «выпьют вдоволь» или «много выпьют»
  rationale: μεθύω обычно означает опьянение. Реплика распорядителя описывает распространённый обычай, но сама по себе не выражает нравственного одобрения пьянства; смягчение устранило бы напряжение исходного текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным оттенком. Прямая речь звучит естественно; смысл опьянения не смягчён, а обобщающая форма оригинала сохранена.
