  text: ὅτε οὖν ἠγέρθη ἐκ νεκρῶν, ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι τοῦτο ἔλεγεν, καὶ ἐπίστευσαν τῇ γραφῇ καὶ τῷ λόγῳ ⸀ὃν εἶπεν ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/022.yaml
  text: So when he was raised from the dead, his disciples remembered that he had been saying this, and they believed the Scripture and the word that Jesus had spoken.
translation:
  language: ru
  text: Итак, когда Он был воскрешён из мёртвых[a], Его ученики вспомнили, что Он говорил это[b], и поверили Писанию и слову, сказанному Иисусом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воскрес из мёртвых». В греческом тексте глагол стоит в страдательном залоге: «был воскрешён».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сказал это». Греческий имперфект может представлять речь как происходившую в прошлом, не уточняя здесь, была ли она повторной.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «высказыванию, произнесённому Иисусом». Греческое слово может означать слово, высказывание или сообщение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Итак, когда
  rationale: «Когда» вводит придаточное времени, а «итак» передаёт повествовательную и выводную связь οὖν с предыдущим контекстом.
- source_word: ἠγέρθη
  choice: Он был воскрешён
  rationale: Страдательная форма сохраняет грамматический залог греческого текста; в контексте воскресения ἐγείρω означает возвращение к жизни из смерти.
- source_word: ἐκ νεκρῶν
  choice: из мёртвых
  rationale: Передаёт греческую конструкцию с формой множественного числа и остаётся понятным устойчивым библейским выражением.
- source_word: ἐμνήσθησαν
  choice: вспомнили
  rationale: Естественно передаёт наступившее воспоминание о ранее сказанном.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Его ученики
  rationale: Естественная русская передача греческой притяжательной конструкции.
- source_word: ὅτι τοῦτο ἔλεγεν
  choice: что Он говорил это
  rationale: Несовершенный вид «говорил» передаёт имперфект ἔλεγεν, не навязывая ни однократность, ни обязательную повторяемость речи.
- source_word: ἐπίστευσαν
  choice: поверили
  rationale: Нейтрально и естественно передаёт πιστεύω с дательными дополнениями, не добавляя толкования о характере веры.
- source_word: τῇ γραφῇ
  choice: Писанию
  rationale: Единственное число соответствует греческому γραφή; прописная буква обозначает священное Писание.
- source_word: τῷ λόγῳ
  choice: слову
  rationale: Сохраняет широкое значение λόγος и его связь с речью Иисуса; в данном контексте это сказанное Им слово.
- source_word: ὃν εἶπεν ὁ Ἰησοῦς
  choice: которое сказал Иисус
  rationale: Прямо передаёт относительное придаточное и ретроспективную отсылку к сказанному Иисусом.
theological_decisions:
- issue: Залог глагола воскресения
  choice: Он был воскрешён из мёртвых
  alternative: Он воскрес из мёртвых
  rationale: Страдательная конструкция соответствует ἠγέρθη и сохраняет формулировку исходного текста, не отрицая иных новозаветных способов говорить о воскресении Иисуса.
- issue: Значение πιστεύω при дательных дополнениях
  choice: поверили Писанию и слову
  alternative: доверились Писанию и слову
  rationale: «Поверили» наименее толковательно нагружено и позволяет понимать объектом веры содержание Писания и слова Иисуса без расширения текста.
- issue: Временной характер ἔλεγεν
  choice: говорил это
  alternative: сказал это
  rationale: Русский несовершенный вид сохраняет аспектуальную открытость имперфекта и не утверждает непременно многократного повторения.
translation_notes:
  register: Современный литературный русский язык с dignified библейским регистром. Местоимение «Он» применительно к Иисусу написано с прописной буквы по устойчивой русской издательской традиции. Синтаксис близок к исходному тексту, но остаётся естественным для обычного читателя.
