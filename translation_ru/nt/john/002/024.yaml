  text: Но Сам Иисус не доверял им Себя[a], потому что знал всех людей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом здесь употреблён тот же глагол, что и в предыдущем стихе: многие «поверили» в Иисуса, но Иисус не «доверял им Себя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ Ἰησοῦς
  choice: Но Сам Иисус
  rationale: δέ обозначает противопоставление предыдущему сообщению о поверивших, а αὐτός подчёркивает Иисуса; в русском это естественно передаётся сочетанием «Но Сам Иисус».
- source_word: οὐκ ἐπίστευεν
  choice: не доверял
  rationale: С личным возвратным дополнением и дательным падежом πιστεύω означает «доверять, вверять». Несовершенный вид «не доверял» естественно передаёт имперфект и его продолжительный либо устойчивый характер.
- source_word: αὑτὸν αὐτοῖς
  choice: Себя им
  rationale: Возвратное местоимение с дательным выражает личное вверение себя людям. Такая конструкция сохраняет структуру и смысл греческого текста.
- source_word: διὰ τὸ αὐτὸν γινώσκειν
  choice: потому что знал
  rationale: διά с субстантивированным инфинитивом имеет причинное значение; по-русски естественна личная придаточная конструкция.
- source_word: πάντας
  choice: всех людей
  rationale: Мужской род множественного числа здесь обобщённо относится к людям; явное «людей» устраняет неясность и связывает стих со следующим упоминанием того, что находится в человеке.
theological_decisions:
- issue: Передача связи πιστεύω в стихах 23–24
  choice: В стихе 24 использовать «не доверял Себя», а лексическую связь с «поверили» в стихе 23 отметить в сноске.
  alternative: Передать один и тот же греческий глагол одинаковым русским словом в обоих стихах.
  rationale: Греческий текст создаёт намеренную игру слов, но одинаковая передача по-русски была бы неестественной или исказила бы смысл конструкции. Сноска сохраняет значимую связь.
- issue: Объём значения πάντας
  choice: всех людей
  alternative: всех; каждого
  rationale: Перевод сохраняет общее утверждение текста и не сужает его до конкретной группы, не усиливая при этом формулировку сверх сказанного.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Заглавные буквы в «Сам» и «Себя» следуют принятой русской библейской традиции при обращении к Иисусу; синтаксис остаётся естественным и не перегруженным.
