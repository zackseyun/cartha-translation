    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαν εἶχεν
  choice: не нуждался
  rationale: Естественно передаёт греческую идиому «иметь нужду» с отрицанием, без тяжеловесного буквального оборота.
- source_word: ἵνα τις μαρτυρήσῃ
  choice: чтобы кто-либо свидетельствовал
  rationale: Сохраняет значение μαρτυρέω «свидетельствовать» и неопределённость τις; конструкция с «чтобы» естественна после «не нуждался в том».
- source_word: περὶ τοῦ ἀνθρώπου
  choice: о человеке
  rationale: Единственное число ἄνθρωπος имеет здесь обобщающее значение. Русское «человек» естественно обозначает как отдельного человека, так и человека вообще.
- source_word: αὐτὸς γὰρ
  choice: потому что Сам
  rationale: «Сам» сохраняет эмфазу αὐτός и подчёркивает непосредственность знания; γάρ передан причинным союзом, естественным в русском контексте.
- source_word: ἐγίνωσκεν
  choice: знал
  rationale: Для глагола состояния русское прошедшее несовершенного вида естественно передаёт продолжительное или присущее знание.
- source_word: τί ἦν ἐν τῷ ἀνθρώπῳ
  choice: что в человеке
  rationale: Краткая русская конструкция с подразумеваемым «было» сохраняет широкий внутренний смысл выражения и повтор слова «человек».
theological_decisions:
- issue: Объём знания Иисуса о человеке
  choice: Сохранить широкое утверждение о непосредственном знании того, что в человеке.
  alternative: Уточнить как «что было в каждом человеке» или «какова человеческая природа».
  rationale: Греческое единственное число допускает и индивидуальный, и обобщающий смысл. Перевод не сужает его до психологической проницательности и не расширяет посредством догматического пояснения.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Заглавная буква в «Сам» служит традиционным русским указанием на Иисуса и одновременно передаёт эмфазу αὐτός. Повтор «человек» сохраняет композиционную связь двух греческих оборотов.
