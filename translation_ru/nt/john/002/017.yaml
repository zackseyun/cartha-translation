base_translation:
  language: en
  yaml_path: translation/nt/john/002/017.yaml
  text: His disciples remembered that it is written[a], “Zeal for your house will consume me.”
translation:
  language: ru
  text: 'Его ученики вспомнили, что написано[a]: «Рвение к Твоему дому поглотит Меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поглотило Меня» — так звучит Псалом 68:10 (69:9) в некоторых текстовых традициях; в греческом тексте Евангелия от Иоанна здесь стоит будущее время: «поглотит Меня».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: вспомнили
  rationale: 'Аористная форма μιμνῄσκομαι естественно передаётся совершенным видом «вспомнили»: ученики припомнили слова Писания в связи с поступком Иисуса.'
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Его ученики
  rationale: «Ученики» — точный и общепонятный новозаветный эквивалент μαθηταί; местоимение передаёт принадлежность без ненужного повторения имени.
- source_word: γεγραμμένον ἐστίν
  choice: написано
  rationale: Устойчивая русская формула введения цитаты из Писания; сохраняет результативный смысл греческого перфекта и звучит естественнее буквального «было написано».
- source_word: Ὁ ζῆλος
  choice: Ревность
  rationale: Здесь ζῆλος означает горячую, всепоглощающую преданность делу Божьего дома. «Ревность» сохраняет библейскую насыщенность и допускаемую контекстом силу чувства; «усердие» было бы слабее.
- source_word: τοῦ οἴκου σου
  choice: о Твоём доме
  rationale: Родительный падеж после ζῆλος обозначает предмет ревности. Слово «дом» сохраняет формулировку псалма и связь с храмом, не заменяя образ его истолкованием.
- source_word: καταφάγεταί
  choice: поглотит
  rationale: Будущая форма передана будущим временем. «Поглотит» естественно выражает метафору всецело овладевающей и губительной силы, не снижая её до разговорного «съест».
- source_word: με
  choice: Меня
  rationale: Прямое дополнение сохранено; прописная буква указывает на применение цитаты к Иисусу в данном повествовательном контексте.
theological_decisions:
- issue: Время глагола в цитате из Псалма 68:10 (69:9) и его применение к Иисусу
  choice: 'Сохранить будущее время: «поглотит Меня»'
  alternative: «поглотила Меня» или «поглощает Меня»
  rationale: В греческом тексте Иоанна стоит будущее καταφάγεταί. Перевод следует непосредственно тексту Евангелия и не гармонизирует его с формой псалма в иных текстовых традициях, оставляя открытой заложенную Иоанном перспективу дальнейших событий.
- issue: Значение «дома» в цитате
  choice: Сохранить образ «дом», подразумевающий Божий храм
  alternative: 'Перевести истолковательно: «храм»'
  rationale: Контекст ясно связывает слова с храмом, но цитата намеренно говорит о Божьем «доме». Сохранение образа точнее передаёт межтекстовую связь и не сужает выражение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром цитаты из Писания. Порядок слов сделан естественным для русского; «о Твоём доме» предпочтено более тяжеловесному «по доме Твоём». В обращённых к Богу местоимениях и в относящемся к Иисусу «Меня» использована традиционная прописная буква.
