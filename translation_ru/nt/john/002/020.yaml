id: JHN.2.20
reference: John 2:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἶπαν οὖν οἱ Ἰουδαῖοι· Τεσσεράκοντα καὶ ἓξ ἔτεσιν οἰκοδομήθη ὁ ναὸς οὗτος, καὶ σὺ ἐν τρισὶν ἡμέραις ἐγερεῖς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/020.yaml
  text: So the Jews said[a], “This temple was built in forty-six years[b], and will you raise it up in three days?”
translation:
  language: ru
  text: 'Тогда иудеи сказали[a]: «Этот храм строили сорок шесть лет, а ты воздвигнешь его за три дня[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жители Иудеи». Греческое выражение буквально означает «иудеи»; у Иоанна его значение меняется в зависимости от контекста. Здесь речь идёт о собеседниках Иисуса в храме, а не обо всём еврейском народе.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «отстроишь его заново за три дня». Глагол может быть понят в смысле восстановления здания, но «воздвигнешь» сохраняет словесную связь с воскресением Иисуса, раскрываемую в следующем стихе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: тогда
  rationale: Передаёт переход к реакции собеседников на предыдущее высказывание Иисуса; в данном контексте звучит естественнее, чем более формальное «итак».
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Сохраняет прямое обозначение греческого текста, не сужая его без достаточных оснований до «иудейских вождей»; контекстный диапазон термина отмечен в сноске.
- source_word: Τεσσεράκοντα καὶ ἓξ ἔτεσιν
  choice: сорок шесть лет
  rationale: Дательный времени обозначает продолжительность строительных работ; русская конструкция без предлога передаёт её естественно и ясно.
- source_word: οἰκοδομήθη
  choice: строили
  rationale: Русская неопределённо-личная конструкция естественно передаёт пассив и длительность подразумеваемого процесса, не утверждая, что все храмовые работы были окончательно завершены.
- source_word: ὁ ναὸς οὗτος
  choice: этот храм
  rationale: «Храм» — ясное и обычное соответствие; хотя ναός может точнее обозначать святилище, здесь техническое «святилище» было бы менее естественным.
- source_word: καὶ σὺ
  choice: а ты
  rationale: 'Противительный оборот и местоимение сохраняют подчёркнутое, недоверчивое противопоставление: храм строили десятилетиями, тогда как Иисус говорит о трёх днях.'
- source_word: ἐν τρισὶν ἡμέραις
  choice: за три дня
  rationale: В русском при глаголе созидания «за три дня» естественно выражает срок выполнения действия и сохраняет контраст с сорока шестью годами.
- source_word: ἐγερεῖς
  choice: воздвигнешь
  rationale: «Воздвигнуть» применимо и к сооружению здания, и в библейском контексте к поднятию; оно сохраняет смысловую двуплановость, которую Иоанн связывает далее с воскресением, лучше, чем однозначное «отстроишь».
- source_word: αὐτόν
  choice: его
  rationale: Местоимение согласуется с русским существительным мужского рода «храм».
theological_decisions:
- issue: Возможность чрезмерно широкого или антииудейского понимания οἱ Ἰουδαῖοι
  choice: Сохранить «иудеи» в основном тексте с пояснительной сноской
  alternative: «жители Иудеи» или «иудейские вожди»
  rationale: Греческое выражение само по себе не уточняет здесь статус говорящих. Сужение до вождей внесло бы толкование, а пояснение в сноске предохраняет от ошибочного отнесения слов ко всему еврейскому народу.
- issue: Связь ἐγερεῖς с последующим указанием на воскресение Иисуса
  choice: «воздвигнешь»
  alternative: «отстроишь заново»
  rationale: 'Формулировка сохраняет богословскую и повествовательную иронию: собеседники думают о здании храма, тогда как евангелист далее относит слова Иисуса к храму его тела и воскресению.'
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. «Строили» избегает тяжеловесного пассива «был построен» и передаёт продолжительность. Реплика оформлена как недоверчивый риторический вопрос; «а ты» подчёркивает контраст. Все маркеры сносок присутствуют в основном тексте.
