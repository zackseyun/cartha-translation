  text: When the master of the feast tasted the water that had become wine[a], and did not know where it came from (though the servants who had drawn the water knew)[c][b], the master of the feast calls the bridegroom
translation:
  language: ru
  text: Когда распорядитель пира[a] попробовал воду, ставшую вином, и не знал, откуда взялось это вино, — слуги же, набравшие воду, знали, — распорядитель пира зовёт[b] жениха.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «старший распорядитель». Греческое слово обозначает человека, руководившего проведением пира.'
    reason: lexical_alternative
  - marker: b
    text: 'Здесь Иоанн переходит к историческому настоящему: «зовёт»; по-русски можно также передать прошедшим временем: «позвал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιτρίκλινος
  choice: распорядитель пира
  rationale: Термин обозначает человека, отвечавшего за проведение и порядок пира. «Распорядитель пира» ясно передаёт его роль, не сводя её к обязанностям старшего официанта.
- source_word: ἐγεύσατο
  choice: попробовал
  rationale: В данном контексте глагол означает попробовать напиток на вкус; это естественнее по-русски, чем буквальное «вкусил».
- source_word: τὸ ὕδωρ οἶνον γεγενημένον
  choice: воду, ставшую вином
  rationale: Перфектное причастие передаёт завершившееся превращение с сохраняющимся результатом. Формулировка прямо утверждает, что вода стала вином, не добавляя пояснений.
- source_word: οὐκ ᾔδει πόθεν ἐστίν
  choice: не знал, откуда она взялась
  rationale: πόθεν указывает на происхождение. Местоимение «она» грамматически соотносится с водой как предметом, который распорядитель попробовал, а выражение естественно для современного русского языка.
- source_word: διάκονοι
  choice: слуги
  rationale: В повествовательном контексте речь идёт о прислуживавших на свадебном пире, а не о церковной должности.
- source_word: ἠντληκότες
  choice: черпавшие
  rationale: Причастие означает тех, кто черпал воду; русский несовершенный вид естественно описывает их участие в этом действии без ненужного уточнения источника.
- source_word: φωνεῖ
  choice: зовёт
  rationale: Сохранено историческое настоящее, которым Иоанн оживляет повествование.
- source_word: νυμφίον
  choice: жениха
  rationale: Обычный и точный русский эквивалент в контексте свадьбы.
- source_word: ὡς δὲ
  choice: Когда
  rationale: Сочетание вводит следующее событие повествования. «Когда» естественно передаёт временную связь; отдельное «же» здесь не требуется, поскольку δέ выполняет связующую функцию.
theological_decisions:
- issue: Описание чуда как превращения воды в вино
  choice: «воду, ставшую вином»
  alternative: «воду, превращённую в вино» или ослабленное описание лишь как восприятия вина
  rationale: 'Греческий текст прямо описывает завершившуюся перемену состояния: вода стала вином. Перевод сохраняет это утверждение без дополнительного объяснения механизма чуда.'
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным стилем. Историческое настоящее сохранено. Вставная часть о слугах выделена парными тире, что позволяет передать структуру греческой фразы без тяжеловесных скобок.
