  text: Καὶ τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ γάμος ἐγένετο ἐν Κανὰ τῆς Γαλιλαίας, καὶ ἦν ἡ μήτηρ τοῦ Ἰησοῦ ἐκεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/001.yaml
  text: And on the third day there was a wedding in Cana of Galilee[b][a], and the mother of Jesus was there.
translation:
  language: ru
  text: На третий день в Кане Галилейской была свадьба[a]. Там была и мать Иисуса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свадебный пир». Греческое слово может обозначать как свадьбу, так и сопровождающее её празднество.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: На
  rationale: Начальное καί связывает эпизод с предыдущим повествованием; в современном русском эта связь естественно передаётся без отдельного «и», поскольку фраза начинается обстоятельством времени.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: на третий день
  rationale: Точная и естественная передача дательного времени; сохраняет хронологическую формулировку, не навязывая ей символического смысла.
- source_word: γάμος
  choice: свадьба
  rationale: В данном контексте обозначает свадьбу как событие и празднование; общеупотребительное русское слово сохраняет широту греческого значения.
- source_word: ἐγένετο
  choice: была
  rationale: Идиоматично вводит событие в русском повествовании и соответствует простоте греческого выражения.
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: в Кане Галилейской
  rationale: Устоявшаяся, естественная русская форма географического наименования, точно передающая отличие этой Каны как находящейся в Галилее.
- source_word: ἦν ἡ μήτηρ τοῦ Ἰησοῦ ἐκεῖ
  choice: Там была и мать Иисуса
  rationale: Сохраняет фоновый характер imperfect ἦν и прямое обозначение родства; «и» передаёт связующее καί перед второй клаузой.
theological_decisions:
- issue: Временное указание «на третий день»
  choice: Сохранено как простое хронологическое указание
  alternative: Истолковать в переводе как символический намёк на воскресение
  rationale: Формулировка может вызывать богословские ассоциации, но сам перевод не должен встраивать в неё толкование, отсутствующее в явном виде.
translation_notes:
  register: Современный литературный русский язык с dignified, но не архаическим повествовательным строем. Разделение на два предложения делает русский текст естественным, не изменяя логической связи исходных клауз.
