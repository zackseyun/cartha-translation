    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν
  choice: увидел
  rationale: В данном повествовательном контексте εὗρεν описывает то, что Иисус обнаружил в храме; русское «увидел» естественно передаёт непосредственное восприятие сцены, не добавляя идеи поиска.
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: ἱερόν обозначает весь храмовый комплекс, а не собственно внутреннее святилище; традиционное и естественное «в храме» уточняется в сноске.
- source_word: τοὺς πωλοῦντας
  choice: продавцов
  rationale: Субстантивированное причастие настоящего времени указывает на людей, занятых продажей; «продавцов» кратко и естественно передаёт эту продолжающуюся деятельность.
- source_word: βόας
  choice: волов
  rationale: βοῦς обозначает крупный рогатый скот; в контексте жертвенных животных «волов» — точный и понятный эквивалент без неоправданного уточнения пола как при «быков».
- source_word: πρόβατα
  choice: овец
  rationale: В данном контексте πρόβατα естественно означает овец.
- source_word: περιστερὰς
  choice: голубей
  rationale: περιστερά может означать голубя или горлицу; общее русское «голубей» понятно и соответствует контексту жертвоприношений.
- source_word: κερματιστὰς
  choice: менял
  rationale: κερματιστής — человек, обменивающий монеты; «меняла» является точным, устойчивым и понятным русским обозначением.
- source_word: καθημένους
  choice: сидевших там
  rationale: Причастие передаёт позу и постоянное присутствие менял на месте; «сидевших там» естественно воспроизводит эту деталь.
theological_decisions:
- issue: Пространственный охват слова ἱερόν применительно к Иерусалимскому храму
  choice: В основном тексте использовано «в храме», а в сноске уточнено, что речь идёт о храмовом комплексе и дворах.
  alternative: «во дворах храма» или «на территории храма»; «в святилище» было бы пространственно неточно.
  rationale: Продажа животных и обмен денег происходили не во внутреннем святилище. Сноска сохраняет историко-пространственный смысл греческого слова, тогда как основной текст остаётся естественным и не перегруженным.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Порядок фразы слегка перестроен ради естественного русского синтаксиса; союз καί перед εὗρεν передан связью с предыдущим контекстом, не требующей обязательного начального «и» в отдельном стихе. Заглавное «Он» соответствует принятому благоговейному библейскому регистру.
