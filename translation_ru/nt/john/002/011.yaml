source:
  edition: SBLGNT
  text: ταύτην ⸀ἐποίησεν ἀρχὴν τῶν σημείων ὁ Ἰησοῦς ἐν Κανὰ τῆς Γαλιλαίας καὶ ἐφανέρωσεν τὴν δόξαν αὐτοῦ, καὶ ἐπίστευσαν εἰς αὐτὸν οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/011.yaml
  text: Jesus did this[a], the beginning of his signs, in Cana of Galilee, and revealed his glory, and his disciples believed in him.
translation:
  language: ru
  text: Так Иисус в Кане Галилейской положил начало Своим знамениям и явил Свою славу; и ученики Его уверовали в Него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταύτην ἐποίησεν
  choice: Это Иисус совершил
  rationale: Указательное местоимение отсылает к только что описанному деянию. «Это» не добавляет отсутствующих в греческом тексте слов «чудо» или «знамение», а «совершил» естественно передаёт широкое ποιέω в данном контексте.
- source_word: ἀρχὴν τῶν σημείων
  choice: как начало знамений
  rationale: Оборот сохраняет значение ἀρχή — «начало» — и показывает, что событие открывает последовательность знамений. «Как» естественно обозначает функцию описанного деяния и устраняет тяжёлую для русского языка бессоюзную конструкцию.
- source_word: σημείων
  choice: знамений
  rationale: В Евангелии от Иоанна σημεῖον обозначает деяние, указывающее за пределы самого события и раскрывающее личность Иисуса; «знамение» сохраняет этот смысл лучше, чем «чудо».
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: в Кане Галилейской
  rationale: Устоявшаяся, ясная и близкая к греческой географическая формулировка.
- source_word: ἐφανέρωσεν
  choice: явил
  rationale: «Явил» кратко и точно передаёт раскрытие или обнаружение того, что прежде не было явно, и естественно сочетается со словом «слава».
- source_word: τὴν δόξαν αὐτοῦ
  choice: Свою славу
  rationale: Возвратное притяжательное местоимение естественно по-русски соотносит славу с подлежащим «Иисус», а «слава» сохраняет ключевой богословский термин δόξα.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: уверовали в Него
  rationale: Формула естественно передаёт характерное для Иоанна личное доверие, направленное к Иисусу. «Уверовали» здесь яснее обозначает возникновение веры, чем статическое «верили».
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ученики Его
  rationale: Достоинная литературная формулировка, точно сохраняющая принадлежность учеников Иисусу.
theological_decisions:
- issue: Терминология σημεῖον у Иоанна
  choice: «знамения», а не «чудеса»
  alternative: «чудеса»
  rationale: Слово подчёркивает не только сверхъестественный характер деяния, но и его указующую, откровенную функцию; перевод не должен сводить этот смысл лишь к проявлению силы.
- issue: Смысл ἀρχὴν τῶν σημείων
  choice: «как начало знамений»
  alternative: «как первое из знамений»
  rationale: Выбранный вариант сохраняет собственно значение «начало» и возможный акцент на том, что это деяние положило начало ряду знамений. Более счётное понимание «первое» остаётся допустимым и отмечено в сноске.
- issue: Вера учеников после знамения
  choice: «ученики Его уверовали в Него» без поясняющей гармонизации
  alternative: «вера учеников в Него укрепилась»
  rationale: Греческий текст прямо говорит ἐπίστευσαν и не объясняет, была ли это первоначальная вера или её углубление. Перевод сохраняет эту повествовательную и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно высоким библейским регистром. Сохранены традиционные и понятные сочетания «Кана Галилейская», «явил славу», «уверовали в Него». Заглавные буквы в местоимениях, относящихся к Иисусу, использованы как русская издательская норма почтительного библейского стиля, не меняющая смысла оригинала.
