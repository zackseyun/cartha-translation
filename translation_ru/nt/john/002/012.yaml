lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: После этого
  rationale: Естественный временной переход, сохраняющий значение греческого выражения.
- source_word: κατέβη
  choice: спустился
  rationale: Передаёт движение вниз из Каны в расположенный ниже Капернаум и сохраняет топографический оттенок глагола.
- source_word: εἰς Καφαρναοὺμ
  choice: в Капернаум
  rationale: Нормальное русское обозначение направления к городу; название передано в традиционной русской форме.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: Своей матерью
  rationale: Возвратное притяжательное местоимение естественно по-русски соотносит мать с подлежащим; имя Мария не добавляется, поскольку его нет в стихе.
- source_word: οἱ ἀδελφοὶ
  choice: Своими братьями
  rationale: Мужской род множественного числа наиболее прямо означает братьев; возможное более широкое родственное значение отмечено в сноске.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: учениками
  rationale: «Ученики» — устойчивый и точный русский эквивалент ключевого евангельского термина μαθηταί.
- source_word: ἐκεῖ ἔμειναν
  choice: Там они пробыли
  rationale: Естественно передаёт временное пребывание всей названной группы.
- source_word: οὐ πολλὰς ἡμέρας
  choice: несколько дней
  rationale: Идиоматично передаёт смысл «не много дней» без тяжеловесности буквальной русской конструкции.
theological_decisions:
- issue: Кем приходились Иисусу οἱ ἀδελφοί
  choice: 'В основном тексте: «братьями».'
  alternative: «родственниками» или «родичами».
  rationale: Наиболее прямое значение греческого слова — «братья», однако в некоторых контекстах оно может обозначать более широкий круг родни. Перевод не разрешает связанный с этим богословский спор, а сохраняет альтернативу в сноске.
translation_notes:
  register: 'Современный литературный русский язык, ясный и достойный по тону. Заглавные буквы в местоимениях, относящихся к Иисусу, соответствуют распространённой русской библейской традиции. Синтаксис слегка перестроен для естественности: сопровождающая группа передана оборотом «вместе с», а последнее предложение отделено.'
