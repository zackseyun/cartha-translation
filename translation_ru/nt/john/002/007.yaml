  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Γεμίσατε τὰς ὑδρίας ὕδατος· καὶ ἐγέμισαν αὐτὰς ἕως ἄνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/007.yaml
  text: Jesus said to them[a], “Fill the water jars with water.” And they filled them to the brim.
translation:
  language: ru
  text: 'Иисус сказал им: «Наполните кувшины водой». И они наполнили их доверху.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: сказал
  rationale: Греческий текст использует историческое настоящее («говорит»), однако в современном русском повествовании прошедшее время здесь звучит естественнее и не меняет смысла.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж местоимения во множественном числе обозначает тех, к кому обращается Иисус.
- source_word: Γεμίσατε
  choice: Наполните
  rationale: Аорист, повелительное наклонение, множественное число передаёт прямое распоряжение; «наполните» — естественный и точный русский эквивалент.
- source_word: τὰς ὑδρίας
  choice: кувшины
  rationale: ὑδρία обозначает сосуд или кувшин для воды. «Кувшины» — понятное современному читателю обозначение упомянутых в контексте сосудов; материал, не повторённый в этом стихе, не добавляется.
- source_word: ὕδατος
  choice: водой
  rationale: Родительный падеж после γεμίζω обозначает содержимое; по-русски это естественно передаётся творительным падежом.
- source_word: ἐγέμισαν αὐτάς
  choice: они наполнили их
  rationale: Форма аориста сообщает о выполненном действии, а местоимение явно сохраняет отсылку к кувшинам.
- source_word: ἕως ἄνω
  choice: доверху
  rationale: Выражение буквально указывает на наполнение до верхнего края; «доверху» кратко, естественно и не предполагает особой формы сосуда.
