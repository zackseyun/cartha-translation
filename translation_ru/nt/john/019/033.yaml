  text: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες, ὡς εἶδον ⸂ἤδη αὐτὸν⸃ τεθνηκότα, οὐ κατέαξαν αὐτοῦ τὰ σκέλη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/033.yaml
  text: But when they came to Jesus[a], seeing that he was already dead[b], they did not break his legs.
translation:
  language: ru
  text: Но, подойдя к Иисусу[a] и увидев, что Он уже мёртв[b], они не перебили Ему голени.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Позднее Иоанн связывает это с Писанием: «Ни одна кость Его не будет сломана» (Ин 19:36; ср. Исх 12:46; Чис 9:12; Пс 33:21).'
    reason: cross_reference
  - marker: b
    text: 'Или: «увидев, что Он уже умер».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες
  choice: Но, подойдя к Иисусу
  rationale: Причастный оборот передан естественным русским деепричастным оборотом; δέ выражает лёгкое противопоставление действиям воинов по отношению к распятым рядом.
- source_word: ὡς εἶδον
  choice: и увидев, что
  rationale: Формулировка сохраняет восприятие обстоятельства, на основании которого воины не стали перебивать голени, не усиливая причинный оттенок сверх греческого текста.
- source_word: ἤδη αὐτὸν τεθνηκότα
  choice: Он уже мёртв
  rationale: Перфектное причастие подчёркивает наступившее состояние смерти; русское «уже мёртв» передаёт его прямо и естественно.
- source_word: οὐ κατέαξαν
  choice: не перебили
  rationale: В данном контексте глагол означает намеренное ломание конечностей; «перебить голени» — естественное русское обозначение этого действия.
- source_word: αὐτοῦ τὰ σκέλη
  choice: Ему голени
  rationale: σκέλη может обозначать ноги, особенно их часть ниже колена. «Голени» точно указывает на ломаемую часть конечностей и сохраняет отличие от слова «кости» в Ин 19:36.
theological_decisions:
- issue: Связь неперебитых голеней Иисуса с исполнением Писания
  choice: В основном тексте оставлено прямое повествовательное утверждение, а связь с Писанием указана в сноске.
  alternative: Упомянуть в основном тексте кости, заранее подчёркивая формулировку Ин 19:36.
  rationale: Сам евангелист прямо объясняет исполнение Писания только в Ин 19:36. В данном стихе не следует преждевременно вводить это истолкование или заменять «голени» словом «кости».
- issue: Состояние смерти или событие смерти в τεθνηκότα
  choice: что Он уже мёртв
  alternative: что Он уже умер
  rationale: Перфектное причастие допускает передачу через результативное состояние; альтернативная событийная формулировка сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и сдержанное. Местоимение «Он» и форма «Ему» написаны с прописной буквы согласно распространённой русской библейской традиции, без добавления толкования в основной текст.
