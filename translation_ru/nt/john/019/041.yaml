  text: ἦν δὲ ἐν τῷ τόπῳ ὅπου ἐσταυρώθη κῆπος, καὶ ἐν τῷ κήπῳ μνημεῖον καινόν, ἐν ᾧ οὐδέπω οὐδεὶς ⸂ἦν τεθειμένος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/041.yaml
  text: In the place where he was crucified there was a garden, and in the garden a new tomb, in which no one had yet been laid.
translation:
  language: ru
  text: На месте, где он был распят, находился сад, и в саду — новая гробница, в которой ещё никто не был положен.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: а
  rationale: Мягкий повествовательный переход передан естественной связью между частями предложения без добавления временного значения «теперь».
- source_word: τόπῳ
  choice: месте
  rationale: Прямой и естественный русский эквивалент в описании места распятия.
- source_word: ὅπου ἐσταυρώθη
  choice: где он был распят
  rationale: Сохранён страдательный залог греческого текста; местоимение ясно восстанавливается из контекста.
- source_word: κῆπος
  choice: сад
  rationale: Обычное значение слова; более узкое «фруктовый сад» контекстом не обусловлено.
- source_word: μνημεῖον
  choice: гробница
  rationale: В контексте погребения речь идёт о сооружении или помещении для тела, а не просто о могиле.
- source_word: καινόν
  choice: новая
  rationale: Передаёт прямое значение прилагательного; последующая фраза отдельно поясняет, что гробница ещё не использовалась.
- source_word: ἐν ᾧ
  choice: куда
  rationale: С глаголом движения «клали» русское «куда» естественно передаёт помещение тела внутрь гробницы.
- source_word: οὐδέπω οὐδεὶς ἦν τεθειμένος
  choice: ещё никого не клали
  rationale: Естественная русская формулировка сохраняет временное значение «ещё», всеобщую отрицательность и погребальный смысл глагола τίθημι.
theological_decisions:
- issue: Погребальная лексика μνημεῖον и τεθειμένος
  choice: гробница … куда ещё никого не клали
  alternative: могила … в которой ещё никто не был положен
  rationale: Выбранная формулировка точно обозначает место погребения и действие помещения тела, не добавляя богословского толкования.
- issue: Залог ἐσταυρώθη
  choice: он был распят
  alternative: его распяли
  rationale: Страдательная конструкция сохраняет форму исходного текста и не вводит не названного здесь субъекта действия.
translation_notes:
  register: Современный литературный русский язык; повествование звучит ясно и достойно. Местоимение «он» дано со строчной буквы как нейтральная современная норма, без конфессионально обусловленной капитализации.
