  text: καὶ ὁ ἑωρακὼς μεμαρτύρηκεν, καὶ ἀληθινὴ ⸂αὐτοῦ ἐστιν⸃ ἡ μαρτυρία, καὶ ἐκεῖνος οἶδεν ὅτι ἀληθῆ λέγει, ἵνα ⸀καὶ ὑμεῖς ⸀πιστεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/035.yaml
  text: And the one who has seen has testified[a], and his testimony is true, and that one knows that he is telling the truth, so that you also may believe.
translation:
  language: ru
  text: И тот, кто видел, засвидетельствовал, и свидетельство его истинно. И он знает, что говорит правду, чтобы и вы поверили.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы и вы продолжали верить». Настоящее время греческого глагола может указывать на продолжающуюся веру.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἑωρακὼς
  choice: тот, кто это видел
  rationale: Субстантивированное причастие перфекта передано без добавления явного отождествления свидетеля; форма сохраняет смысл состоявшегося видения, значимого для настоящего свидетельства. Местоимение «это» естественно отсылает к описанным событиям.
- source_word: μεμαρτύρηκεν
  choice: засвидетельствовал
  rationale: Глагол передаёт данное свидетельство с сохраняющейся силой; русский совершенный вид естественно выражает завершённость, а однокоренное существительное поддерживает связь слов.
- source_word: ἀληθινὴ αὐτοῦ ἐστιν ἡ μαρτυρία
  choice: свидетельство его истинно
  rationale: «Истинно» прямо передаёт достоверность свидетельства и сохраняет торжественный, но понятный регистр.
- source_word: ἐκεῖνος
  choice: он
  rationale: В русском «тот» после непосредственно предшествующего «тот, кто» звучало бы искусственно и могло бы создать впечатление другого лица. Ударное «он» допускает эмфатическое прочтение, не определяя личность свидетеля.
- source_word: οἶδεν
  choice: знает
  rationale: Формальный перфект οἶδα имеет настоящее стативное значение, естественно передаваемое формой «знает».
- source_word: ἀληθῆ λέγει
  choice: говорит правду
  rationale: Это естественное русское соответствие идиоматического сочетания, буквально относящегося к говорению истинного.
- source_word: ἵνα καὶ ὑμεῖς πιστεύητε
  choice: чтобы и вы поверили
  rationale: «Чтобы» передаёт целевое значение ἵνα, «и вы» сохраняет включительное καί, а «поверили» оставляет основной смысл без навязывания длительного аспекта.
theological_decisions:
- issue: К кому относятся обозначения свидетеля
  choice: 'Личность свидетеля в переводе не уточняется: «тот, кто это видел… Он знает».'
  alternative: Считать свидетелем самого повествователя либо отдельного очевидца и назвать его прямо.
  rationale: Греческий текст не идентифицирует свидетеля явно; перевод сохраняет третье лицо и не устраняет эту неоднозначность.
- issue: Видо-временной оттенок πιστεύητε
  choice: «поверили» в основном тексте
  alternative: «продолжали верить»
  rationale: Настоящий конъюнктив может допускать длительный оттенок, однако контекст не требует однозначно понимать его как продолжение уже существующей веры. Возможная длительность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Лексическая цепочка «засвидетельствовал — свидетельство» сохранена; синтаксис разделён на два предложения ради ясности без изменения логики оригинала.
