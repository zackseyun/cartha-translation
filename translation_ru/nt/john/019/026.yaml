    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: не выражено отдельным словом
  rationale: Связь с предшествующим повествованием передана естественным продолжением фразы; русское «итак» здесь могло бы создать излишне логический оттенок, а «тогда» — неоправданно усилить временную последовательность.
- source_word: ἰδὼν
  choice: увидев
  rationale: Деепричастие естественно передаёт предшествующее основному действию восприятие и сохраняет компактность греческой конструкции.
- source_word: τὴν μητέρα
  choice: Свою мать
  rationale: В контексте речь идёт о матери Иисуса; русский язык естественно требует притяжательного местоимения. Написание «Свою» с прописной согласовано с традиционным благоговейным оформлением местоимений, относящихся к Иисусу.
- source_word: τὸν μαθητὴν παρεστῶτα
  choice: стоявшего рядом ученика
  rationale: Передаёт конкретного ученика и его положение возле матери Иисуса; «рядом» естественно выражает смысл присутствия при происходящем.
- source_word: ὃν ἠγάπα
  choice: которого Он любил
  rationale: Сохраняет определительную формулу Евангелия от Иоанна без добавления имени ученика.
- source_word: λέγει
  choice: говорит
  rationale: Сохранено историческое настоящее, придающее сцене непосредственность.
- source_word: Γύναι
  choice: Женщина
  rationale: Прямо передаёт форму обращения, не добавляя отсутствующих в тексте слов вроде «дорогая»; сноска предупреждает современное русское восприятие как резкого обращения.
- source_word: ἴδε
  choice: вот
  rationale: В данном указательном и торжественном высказывании естественное русское «вот» передаёт предъявление нового отношения лучше, чем буквальное повелительное «посмотри».
- source_word: ὁ υἱός σου
  choice: твой сын
  rationale: Сохраняет прямое установление сыновнего отношения между учеником и матерью Иисуса.
theological_decisions:
- issue: Тон обращения Γύναι к матери Иисуса
  choice: «Женщина» в основном тексте со сноской о почтительном характере обращения
  alternative: «Дорогая женщина», «Госпожа»
  rationale: Греческое обращение не выражает грубости, но и не содержит слова «дорогая». Прямой перевод сохраняет форму источника, а сноска предотвращает ложное впечатление о резкости слов Иисуса.
- issue: Смысл слов «вот твой сын»
  choice: Не уточнять в основном тексте характер устанавливаемого отношения
  alternative: Истолковать как поручение заботы, юридическое усыновление или более широкое символическое родство
  rationale: Стих прямо называет ученика сыном матери Иисуса, но не определяет исчерпывающе богословский или социальный характер этого отношения; перевод сохраняет эту смысловую открытость.
