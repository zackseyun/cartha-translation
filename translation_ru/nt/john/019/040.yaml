  yaml_path: translation/nt/john/019/040.yaml
  text: So they took Jesus’s body and wrapped it in linen cloths with the spices[a], as is the burial custom of the Jews.
translation:
  language: ru
  text: Итак, они взяли тело Иисуса и обвили его льняными полотнами с благовониями, как у иудеев[a] принято погребать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у жителей Иудеи», если понимать слово географически, а не как обозначение народа и религиозной общности; в данном контексте вероятнее имеется в виду иудейский обычай погребения вообще.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβον
  choice: взяли
  rationale: В данном контексте глагол означает, что тело взяли для подготовки к погребению; это прямой и естественный русский эквивалент.
- source_word: οὖν
  choice: итак
  rationale: Передаёт связь с предыдущим стихом и следствие из полученного разрешения, сохраняя повествовательный ход.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: тело Иисуса
  rationale: Точно и сдержанно передаёт греческое выражение; слово «труп» было бы резче, чем требует оригинал.
- source_word: ἔδησαν αὐτὸ
  choice: обвязали его
  rationale: Сохраняет основное значение δέω — связывать, обвязывать — и естественно описывает действие с погребальными полотнами, не сводя его лишь к заворачиванию.
- source_word: ὀθονίοις
  choice: льняными полотнами
  rationale: Обозначает небольшие льняные полотна, употреблявшиеся при погребении; вариант понятен современному читателю и не добавляет лишнего толкования.
- source_word: μετὰ τῶν ἀρωμάτων
  choice: вместе с благовониями
  rationale: Ἀρώματα здесь означает ароматические вещества для погребения; «благовония» — естественный и традиционно понятный русский эквивалент.
- source_word: καθὼς ἔθος ἐστὶν
  choice: как принято
  rationale: Кратко и естественно выражает соответствие установившемуся обычаю.
- source_word: τοῖς Ἰουδαίοις
  choice: у иудеев
  rationale: В контексте речь идёт об общей иудейской погребальной практике; конструкция «у иудеев» идиоматично передаёт дательный падеж при указании обычая.
- source_word: ἐνταφιάζειν
  choice: погребать
  rationale: Сохраняет глагольную форму и широкий погребальный смысл, включающий подготовку тела, а не только помещение в гробницу.
theological_decisions:
- issue: Значение τοῖς Ἰουδαίοις
  choice: у иудеев
  alternative: у жителей Иудеи
  rationale: Здесь наиболее вероятна культурно-религиозная отсылка к иудейскому обычаю погребения вообще, а не только к географическим жителям Иудеи. Возможная географическая трактовка сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык; изложение ясное, сдержанное и достойное. Порядок фразы близок к греческому, но синтаксис естественен для русского повествования.
