revisions:
- from: Итак, они взяли тело Иисуса и обвязали его льняными полотнами вместе с благовониями, как принято у иудеев[a] погребать.
  to: Итак, они взяли тело Иисуса и обвили его льняными полотнами с благовониями, как у иудеев[a] принято погребать.
  rationale: Правка ограничена естественностью русского выражения. «Обвили ... полотнами» сохраняет представление о связывании тела полотнами, а перестановка в заключительной части делает фразу более плавной, не меняя смысла или степени определённости оригинала.
