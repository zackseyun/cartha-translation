source:
  edition: SBLGNT
  text: Ὅτε οὖν ἤκουσεν ὁ Πιλᾶτος τοῦτον τὸν λόγον, μᾶλλον ἐφοβήθη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/008.yaml
  text: When Pilate heard this statement, he became even more afraid,
translation:
  language: ru
  text: Когда Пилат услышал эти слова, он испугался ещё больше.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Когда
  rationale: Ὅτε вводит обстоятельство времени; οὖν служит лёгкой повествовательной связкой, которую в естественном русском здесь передаёт сама последовательность фразы без отдельного слова.
- source_word: ἤκουσεν
  choice: услышал
  rationale: В данном контексте глагол означает восприятие только что высказанного утверждения.
- source_word: ὁ Πιλᾶτος
  choice: Пилат
  rationale: Общепринятая русская форма имени; греческий артикль перед личным именем отдельно не передаётся.
- source_word: τοῦτον τὸν λόγον
  choice: эти слова
  rationale: Выражение указывает на содержание сказанного в предыдущем стихе. Русское «эти слова» естественно отсылает к прозвучавшему заявлению и не сводит λόγος к одному слову.
- source_word: μᾶλλον ἐφοβήθη
  choice: испугался ещё больше
  rationale: μᾶλλον обозначает усиление уже существовавшего страха, а аорист ἐφοβήθη представляет реакцию как наступившее событие; выбранная формулировка естественно выражает оба оттенка.
theological_decisions:
- issue: Причина страха Пилата
  choice: Не уточнять природу страха, передав лишь его усиление
  alternative: Указать, что Пилат испугался политических последствий или божественного происхождения Иисуса
  rationale: Греческий текст сообщает только, что после услышанного Пилат испугался ещё больше, но не определяет, был ли его страх политическим, суеверным или религиозным.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная повествовательная фраза с сохранением неопределённости причины страха.
