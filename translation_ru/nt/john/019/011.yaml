  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Οὐκ εἶχες ἐξουσίαν ⸂κατ’ ἐμοῦ οὐδεμίαν⸃ εἰ μὴ ἦν ⸂δεδομένον σοι⸃ ἄνωθεν· διὰ τοῦτο ὁ ⸀παραδούς μέ σοι μείζονα ἁμαρτίαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/011.yaml
  text: Jesus answered him[a], “You would have no authority over me at all unless it had been given to you from above[b]. Therefore the one who handed me over to you has the greater sin.”
translation:
  language: ru
  text: 'Иисус ответил ему: «Ты не имел бы надо Мной никакой власти, если бы она не была дана тебе свыше[a]. Поэтому тот, кто передал Меня тебе[b], виновен в большем грехе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с небес». Греческое слово означает «свыше» и у Иоанна нередко указывает на божественный источник.'
    reason: lexical_alternative
  - marker: b
    text: Здесь прямо не сказано, кто передал Иисуса Пилату. Под этим человеком понимают Иуду, Каиафу или, шире, иудейских руководителей.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: власти
  rationale: В контексте суда речь идёт о предоставленных Пилату полномочиях; «власть» естественнее и точнее, чем обозначение одной лишь физической силы или формального права.
- source_word: κατ’ ἐμοῦ οὐδεμίαν
  choice: надо Мной никакой
  rationale: Оборот передаёт направленность власти на Иисуса, а «никакой» сохраняет эмфатическое отрицание οὐδεμίαν.
- source_word: δεδομένον σοι
  choice: не была дана тебе
  rationale: Страдательная конструкция сохраняет мысль о полученной, а не собственной власти Пилата, не называя прямо подателя.
- source_word: ἄνωθεν
  choice: свыше
  rationale: «Свыше» естественно передаёт пространственно-источниковое значение и свойственный Иоанну намёк на божественное происхождение, не заменяя его более однозначным «с небес».
- source_word: διὰ τοῦτο
  choice: поэтому
  rationale: Передаёт причинно-следственную связь с предыдущим утверждением кратко и естественно.
- source_word: ὁ παραδούς μέ σοι
  choice: тот, кто передал Меня тебе
  rationale: Нейтральное «передал» соответствует контексту выдачи Иисуса Пилату и не отождествляет неназванного человека с Иудой посредством слова «предатель».
- source_word: μείζονα ἁμαρτίαν ἔχει
  choice: виновен в большем грехе
  rationale: Это естественный современный русский способ передать буквальное «имеет больший грех», сохраняя сравнение степени вины.
theological_decisions:
- issue: Источник власти Пилата, подразумеваемый словом ἄνωθεν
  choice: «дана тебе свыше» — власть представлена как полученная от высшего, божественного источника
  alternative: «дана тебе с небес» или более общее понимание «сверху»
  rationale: Перевод сохраняет характерный для Иоанна смысл божественного источника, но не разворачивает стих в общее учение о политической власти.
- issue: Личность ὁ παραδούς μέ σοι
  choice: 'Оставлена неназванной: «тот, кто передал Меня тебе»'
  alternative: Иуда, Каиафа или иудейские руководители как группа
  rationale: Греческий текст не называет этого человека или группу прямо, поэтому перевод не устраняет намеренную или контекстуальную неоднозначность.
- issue: Сравнительная вина в выражении μείζονα ἁμαρτίαν
  choice: «виновен в большем грехе»
  alternative: «имеет больший грех»
  rationale: Сохраняется утверждение о различной степени греха между передавшим Иисуса и Пилатом, но не вводится точное объяснение оснований этой разницы сверх сказанного в стихе.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Формулировка «не имел бы надо Мной никакой власти» сохраняет судебный контекст и усиленное отрицание; «виновен в большем грехе» звучит естественнее буквального «имеет больший грех». Местоимения, относящиеся к Иисусу, оформлены с прописной буквы согласно распространённой русской библейской традиции.
