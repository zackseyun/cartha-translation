source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ μαθητῇ· ⸀Ἴδε ἡ μήτηρ σου. καὶ ἀπ’ ἐκείνης τῆς ὥρας ἔλαβεν ὁ μαθητὴς αὐτὴν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/027.yaml
  text: Then he said to the disciple, “Look, your mother.” And from that hour the disciple took her into his own home.
translation:
  language: ru
  text: 'Потом Он говорит ученику: «Вот твоя мать». И с того часа ученик взял её к себе.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: «Вот»
  rationale: Естественное современное русское указательное выражение, сохраняющее прямоту и торжественную краткость греческого повелительного ἴδε.
- source_word: ἀπ’ ἐκείνης τῆς ὥρας
  choice: «с того часа»
  rationale: Близко передаёт временное выражение оригинала и уместно в литературном библейском повествовании.
- source_word: εἰς τὰ ἴδια
  choice: «к себе»
  rationale: Греческое выражение обозначает принятие в своё домашнее или личное окружение; «к себе» сохраняет некоторую широту значения и звучит естественнее, чем добавленное в английском консультационном тексте «в свой дом».
theological_decisions:
- issue: Характер слов Иисуса о матери ученика
  choice: 'Сохранено краткое указательное высказывание: «Вот твоя мать»'
  alternative: «Она — твоя мать» или расширенное толкование духовного материнства
  rationale: Оригинал не разъясняет богословский объём этих слов, поэтому перевод не должен добавлять конфессиональное толкование.
- issue: Что именно сделал ученик
  choice: «взял её к себе»
  alternative: «взял её в свой дом»
  rationale: τὰ ἴδια может подразумевать дом и собственное окружение, но прямо слова «дом» в греческом тексте нет; выбранный вариант сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством и лаконизмом повествования. Заглавное «Он» употреблено как принятое в русском библейском стиле указание на Иисуса; местоимение не добавляет нового содержания.
