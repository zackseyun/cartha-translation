lexical_decisions:
- source_word: ἤρχοντο πρὸς αὐτὸν καὶ ἔλεγον
  choice: Они подходили к Нему и говорили
  rationale: Оба глагола стоят в имперфекте; русские формы несовершенного вида естественно передают продолжавшиеся или повторявшиеся издевательские действия.
- source_word: Χαῖρε
  choice: Да здравствует
  rationale: В данном контексте это насмешливое приветствие царя. Русская формула «Да здравствует…» передаёт торжественное приветствие и его издевательский оттенок естественнее, чем буквальное «радуйся».
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: Царь Иудейский
  rationale: Прямо передаёт царский титул в форме обращения, сохраняя его политическое и мессианское звучание.
- source_word: ἐδίδοσαν αὐτῷ ῥαπίσματα
  choice: давали Ему пощёчины
  rationale: Идиоматично передаёт буквальную конструкцию «давали Ему удары»; «пощёчины» соответствует ῥαπίσματα, а несовершенный вид сохраняет повторяемость действия.
theological_decisions:
- issue: Характер обращения воинов к Иисусу
  choice: Передать слова как издевательское царское приветствие
  alternative: «Радуйся, Царь Иудейский!» или нейтральное «Приветствуем Тебя, Царь Иудейский!»
  rationale: Контекст бичевания, венца и ударов ясно указывает на насмешку. Выбранная формула выражает церемониальную царскую хвалу, не добавляя к повествованию отдельного толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Несовершенный вид последовательно передаёт повторность действий; местоимение «Нему» написано с прописной буквы в соответствии с принятой русской библейской традицией.
