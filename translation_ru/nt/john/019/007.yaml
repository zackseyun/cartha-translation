base_translation:
  language: en
  yaml_path: translation/nt/john/019/007.yaml
  text: The Jews answered him[a], “We have a law, and according to that law he ought to die[b], because he made himself the Son of God.”
translation:
  language: ru
  text: 'Иудеи ответили ему: «У нас есть закон, и по этому закону он должен умереть, потому что объявил себя Сыном Божьим».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «сделал себя Сыном Божьим».'
    reason: Сноска сохраняет доступ к характерному греческому обороту, который в основном тексте передан естественным русским выражением.
lexical_decisions:
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: ответили ему
  rationale: Обычная и естественная для повествования передача глагола ответа с сохранением адресата.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Прямая передача группового обозначения у Иоанна; сам стих не сужает его формально до одних только руководителей, хотя ближайший контекст указывает на представителей иудейской власти.
- source_word: νόμον ἔχομεν
  choice: у нас есть закон
  rationale: Неопределённая форма и строчная буква сохраняют апелляцию к имеющемуся у них закону, не превращая слово без необходимости в формальное название Торы.
- source_word: κατὰ τὸν νόμον
  choice: по этому закону
  rationale: Указательное «этому» естественно передаёт определённость второго употребления и его отсылку к только что названному закону.
- source_word: ὀφείλει ἀποθανεῖν
  choice: он должен умереть
  rationale: Передаёт выраженную ὀφείλει обязанность в юридическом утверждении, не добавляя отдельной формулы приговора.
- source_word: υἱὸν θεοῦ
  choice: Сыном Божьим
  rationale: Устойчивая современная русская форма титула, передающая уникальный характер заявленного сыновства, а не значение «одним из сынов Бога».
- source_word: ἑαυτὸν ἐποίησεν
  choice: объявил себя
  rationale: Естественно передаёт в русском обвинительный смысл греческого оборота «сделал себя» без неуместного впечатления физического превращения и без добавочного оттенка заведомого самозванства.
theological_decisions:
- issue: Смысл υἱὸν θεοῦ в обвинении против Иисуса
  choice: Сыном Божьим
  alternative: сыном Бога; Божьим Сыном
  rationale: Контекст Евангелия от Иоанна указывает на притязание на особый, уникальный статус Сына. Титульная форма сохраняет силу обвинения, при этом текст остаётся речью противников Иисуса, а не добавленным переводчиком богословским утверждением.
- issue: Передача ἑαυτὸν ἐποίησεν
  choice: объявил себя
  alternative: сделал себя; выдавал себя за
  rationale: «Сделал себя» формальнее, но в современном русском может звучать как буквальное превращение; «выдавал себя за» заранее объявляет притязание ложным. «Объявил себя» сохраняет обвинительную формулировку, не решая её истинность голосом переводчика.
translation_notes:
  register: Современный литературный русский, ясный и сдержанно-достоинственный. Синтаксический повтор «закон — по этому закону» сохранён как значимый элемент оригинала. Местоимения, относящиеся к Иисусу, даны со строчной буквы по нормам современного повествовательного текста.
