  yaml_path: translation/nt/john/019/004.yaml
  text: Then Pilate went outside again and said to them[a], “Look, I am bringing him out to you so that you may know that I find no case against him.”
translation:
  language: ru
  text: 'Пилат снова вышел к ним и сказал: «Вот, я вывожу Его к вам, чтобы вы знали: я не нахожу за Ним никакой вины[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я не нахожу никаких оснований обвинять Его». Греческое слово употреблено здесь в судебном смысле и может обозначать обвинение или основание для обвинения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  choice: вышел
  rationale: Русский глагол «вышел» естественно передаёт движение наружу; отдельная передача ἔξω создала бы ненужную избыточность. Местоимение «к ним» проясняет направление в рамках сцены, не меняя смысла.
- source_word: πάλιν
  choice: снова
  rationale: Точно и естественно обозначает повторное действие.
- source_word: λέγει
  choice: сказал
  rationale: Греческий исторический презенс передан прошедшим временем в соответствии с нормами современного русского повествования.
- source_word: Ἴδε
  choice: Вот
  rationale: Естественный русский указательно-побудительный эквивалент, привлекающий внимание к тому, что Пилат сейчас выводит Иисуса.
- source_word: ἄγω ... αὐτὸν ἔξω
  choice: я вывожу Его
  rationale: «Вывожу» ёмко передаёт и действие ἄγω, и направление ἔξω; настоящее время сохраняет непосредственность происходящего.
- source_word: ἵνα γνῶτε
  choice: чтобы вы знали
  rationale: Сохраняет целевое значение ἵνα и звучит естественно по-русски.
- source_word: οὐδεμίαν αἰτίαν
  choice: никакой вины
  rationale: В судебном контексте αἰτία обозначает основание для обвинения или юридически установленную вину. Формула «не нахожу за Ним никакой вины» естественна в современном русском и сохраняет юридический оттенок; более буквальный вариант отмечен в сноске.
- source_word: εὑρίσκω ἐν αὐτῷ
  choice: не нахожу за Ним
  rationale: Русская конструкция «находить за кем-либо вину» идиоматично передаёт судебный смысл греческого выражения.
theological_decisions:
- issue: Судебный смысл заявления Пилата о невиновности Иисуса
  choice: я не нахожу за Ним никакой вины
  alternative: я не нахожу никаких оснований для обвинения Его
  rationale: Перевод передаёт юридическую оценку Пилата, не превращая её прямо в более широкое богословское утверждение о безгрешности. При этом сохраняется подразумеваемая повествованием невиновность Иисуса.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Вот» предпочтено архаизирующему «се». Заглавное «Его/Ним» соблюдает распространённую русскую библейскую издательскую норму, не добавляя толкования к исходному тексту.
