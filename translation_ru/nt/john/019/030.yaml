  text: ὅτε οὖν ἔλαβεν τὸ ὄξος ὁ Ἰησοῦς εἶπεν· Τετέλεσται, καὶ κλίνας τὴν κεφαλὴν παρέδωκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/030.yaml
  text: So when Jesus had received the sour wine[a], he said, “It is finished,” and bowing his head[c][b], he gave up his spirit.
translation:
  language: ru
  text: 'Итак, когда Иисус принял кислое вино[a], Он сказал: «Свершилось!»[b] И, склонив голову, отдал дух[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «винный уксус». Греческое слово ὄξος означает кислое, скисшее вино.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Завершилось!» или «Совершено!»'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «испустил дух». Буквально: «передал дух».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Итак, когда
  rationale: Передаёт временное значение ὅτε и связующую, итоговую функцию οὖν, сохраняя естественный ход повествования.
- source_word: ἔλαβεν
  choice: принял
  rationale: В контексте поднесённого на губке напитка λαμβάνω естественно означает «принять»; русский вид и последовательность действий не требуют плюсквамперфекта.
- source_word: τὸ ὄξος
  choice: кислое вино
  rationale: ὄξος обозначает скисшее дешёвое вино или винный уксус; «кислое вино» ясно и не вызывает современного представления о столовом уксусе.
- source_word: Τετέλεσται
  choice: Свершилось!
  rationale: Краткая совершенная форма передаёт завершённость действия и сохраняющийся результат греческого перфекта, не уточняя прямо, что именно завершено.
- source_word: κλίνας τὴν κεφαλήν
  choice: склонив голову
  rationale: Деепричастный оборот естественно передаёт предшествующее обстоятельственное действие аористного причастия.
- source_word: παρέδωκεν τὸ πνεῦμα
  choice: предал дух
  rationale: Сохраняет буквальный образ добровольной передачи духа и большую смысловую насыщенность выражения по сравнению с простым «умер».
theological_decisions:
- issue: Передавать ли παρέδωκεν τὸ πνεῦμα только как идиому смерти или сохранить личностно-духовное измерение выражения.
  choice: предал дух
  alternative: испустил дух; умер
  rationale: Формулировка близка к греческому тексту и сохраняет возможный акцент Иоанна на сознательном, добровольном характере смерти Иисуса, не превращая этот оттенок в явное догматическое утверждение.
- issue: Уточнять ли подразумеваемый субъект или объект в Τετέλεσται.
  choice: Свершилось!
  alternative: Всё совершилось!; Всё завершено!
  rationale: В греческом тексте нет слова «всё» и не названо то, что завершилось; краткая безличная формула сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. «Он» написано с прописной буквы в соответствии с распространённой русской библейской традицией; синтаксис остаётся ясным для широкого читателя. Маркеры сносок расположены непосредственно при соответствующих выражениях.
