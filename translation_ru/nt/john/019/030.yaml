  terminology: «Кислое вино» — точная передача ὄξος; сноска корректно предлагает «винный уксус». «Свершилось!» соответствует Τετέλεσται и не добавляет отсутствующее в оригинале «всё». «Отдал дух» не предрешает вопрос о богословском смысле πνεῦμα, но сохраняет личный и торжественный характер исходного выражения.
