  text: τοῦτον οὖν τὸν τίτλον πολλοὶ ἀνέγνωσαν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν ὁ τόπος τῆς πόλεως ὅπου ἐσταυρώθη ὁ Ἰησοῦς· καὶ ἦν γεγραμμένον Ἑβραϊστί, ⸂Ῥωμαϊστί, Ἑλληνιστί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/020.yaml
  text: Therefore many of the Jews read this inscription[a], because the place where Jesus was crucified was near the city; and it was written in Hebrew, in Latin, and in Greek.
translation:
  language: ru
  text: Поэтому многие из иудеев прочитали эту надпись, потому что место, где был распят Иисус, находилось недалеко от города; надпись была написана по-еврейски[a], по-латыни и по-гречески.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно, «по-арамейски»: Иоанн называет «еврейским» местный семитский язык.'
    reason: 'Лексическая альтернатива: Ἑβραϊστί в иоанновском употреблении может относиться к арамейскому языку.'
lexical_decisions:
- source_word: τίτλον
  choice: надпись
  rationale: В контексте распятия слово обозначает письменную табличку с указанием вины; «надпись» точно и естественно передаёт смысл без излишнего уточнения.
- source_word: πολλοὶ ... τῶν Ἰουδαίων
  choice: многие из иудеев
  rationale: Сохраняется партитивное значение родительного падежа и не создаётся впечатления, будто речь идёт обо всех иудеях.
- source_word: ἀνέγνωσαν
  choice: прочитали
  rationale: Простой глагол чтения точно передаёт аорист; оснований добавлять «вслух» в греческом тексте нет.
- source_word: ἐγγὺς ἦν ὁ τόπος τῆς πόλεως
  choice: место ... находилось недалеко от города
  rationale: Естественная русская передача пространственной близости без добавления отсутствующих в тексте подробностей, например упоминания городских ворот.
- source_word: ὅπου ἐσταυρώθη ὁ Ἰησοῦς
  choice: где был распят Иисус
  rationale: Сохраняется пассивная конструкция исходного текста без введения неназванного деятеля.
- source_word: γεγραμμένον
  choice: написана же она была
  rationale: Передаётся состояние надписи как уже написанной; частица «же» естественно связывает вторую часть стиха с предыдущим сообщением.
- source_word: Ἑβραϊστί
  choice: по-еврейски
  rationale: Основной текст следует буквальному обозначению языка у Иоанна; возможное указание на арамейский сохраняется в сноске.
- source_word: Ῥωμαϊστί
  choice: по-латыни
  rationale: Хотя форма буквально означает «по-римски», речь идёт о латинском языке; это нормативная и ясная русская передача.
- source_word: Ἑλληνιστί
  choice: по-гречески
  rationale: Прямая и естественная передача обозначения греческого языка.
- source_word: οὖν
  choice: поэтому
  rationale: 'Сохраняется логико-повествовательная связь с предыдущим стихом: близость места объясняет, почему надпись прочитали многие.'
theological_decisions:
- issue: Передача Ἑβραϊστί в языке Евангелия от Иоанна
  choice: «по-еврейски» в основном тексте
  alternative: «по-арамейски»
  rationale: Греческий текст прямо использует обозначение «по-еврейски», поэтому оно сохранено в основном тексте. Поскольку у Иоанна это слово может обозначать местный семитский язык, то есть арамейский, данная возможность отмечена в сноске, а не подменяет формулировку источника.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Иудеи» сохраняет историко-культурное обозначение в Евангелии от Иоанна, а конструкция «многие из иудеев» не допускает неоправданного обобщения. Порядок трёх языков следует SBLGNT.
