base_translation:
  language: en
  yaml_path: translation/nt/john/019/010.yaml
  text: So Pilate said to him[a], “Will you not speak to me? Do you not know that I have authority to release you and authority to crucify you?”
translation:
  language: ru
  text: 'Тогда Пилат сказал Ему: «Ты не отвечаешь мне? Разве Ты не знаешь, что у меня есть власть[a] освободить Тебя и есть власть распять Тебя?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полномочие». Греческое слово ἐξουσία может означать власть, право или полномочие; здесь речь идёт о власти Пилата как римского правителя и судьи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν αὐτῷ ὁ Πιλᾶτος
  choice: Тогда Пилат сказал Ему
  rationale: οὖν продвигает повествование и здесь естественно передаётся как «тогда»; дательный αὐτῷ сохранён, а местоимение оформлено с традиционной уважительной прописной буквы.
- source_word: Ἐμοὶ οὐ λαλεῖς
  choice: Ты не отвечаешь мне?
  rationale: Выдвинутое ἐμοί подчёркивает оскорблённое самолюбие Пилата. В данном контексте λαλεῖς означает отказ отвечать на обращённый вопрос; «не отвечаешь» звучит естественно и сохраняет укоризненный тон.
- source_word: οὐκ οἶδας ὅτι
  choice: Разве Ты не знаешь, что
  rationale: Отрицательный риторический вопрос естественно передан через «разве», а οἶδας — обычным «знаешь» без усилительного истолкования.
- source_word: ἐξουσίαν ἔχω
  choice: у меня есть власть
  rationale: ἐξουσία в судебно-управленческом контексте означает полномочие или власть, а не только физическую силу. «Власть» здесь естественнее и шире русского «полномочие».
- source_word: ἀπολῦσαί σε
  choice: освободить Тебя
  rationale: В судебном контексте ἀπολύω означает отпустить или освободить; выбран точный и современный русский эквивалент без добавочного смысла оправдания.
- source_word: καὶ ἐξουσίαν ἔχω σταυρῶσαί σε
  choice: и есть власть распять Тебя
  rationale: Повтор существительного ἐξουσία сохранён ради риторического противопоставления двух исходов; второе «у меня» можно естественно не повторять, поскольку принадлежность власти остаётся ясной.
theological_decisions:
- issue: Характер заявленной Пилатом ἐξουσία
  choice: Передать как «власть», не подтверждая её абсолютность или нравственную законность.
  alternative: «право» или «полномочие»
  rationale: Стих сообщает притязание Пилата, но не даёт ему богословской санкции. Формулировка сохраняет напряжение, которое Иисус проясняет в следующем стихе.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Реплика Пилата звучит резко и властно; повтор «власть» сохранён. Уважительное написание местоимений, относящихся к Иисусу, соответствует распространённой русской библейской традиции.
