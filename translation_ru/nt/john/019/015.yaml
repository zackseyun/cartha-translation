  text: ⸂ἐκραύγασαν οὖν ἐκεῖνοι⸃· Ἆρον ἆρον, σταύρωσον αὐτόν. λέγει αὐτοῖς ὁ Πιλᾶτος· Τὸν βασιλέα ὑμῶν σταυρώσω; ἀπεκρίθησαν οἱ ἀρχιερεῖς· Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/015.yaml
  text: So they cried out[a], “Away, away! Crucify him!” Pilate said to them, “Shall I crucify your king?” The chief priests answered, “We have no king except Caesar.”
translation:
  language: ru
  text: 'Тогда они закричали: «Долой! Долой! Распни его!» Пилат сказал им: «Мне распять вашего царя?» Первосвященники ответили: «Нет у нас царя, кроме кесаря».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκραύγασαν
  choice: закричали
  rationale: Глагол передаёт громкий, настойчивый крик; «закричали» естественно звучит в современном русском повествовании, не уточняя эмоцию сверх текста.
- source_word: οὖν
  choice: тогда
  rationale: В данном повествовательном контексте частица обозначает развитие событий и их связь с предшествующим; «тогда» передаёт эту функцию естественно.
- source_word: Ἆρον ἆρον
  choice: Долой! Долой!
  rationale: Повторённое повеление от αἴρω здесь является резким требованием устранить Иисуса. «Долой!» сохраняет краткость, повтор и силу возгласа, не добавляя отсутствующего в этой фразе местоимения.
- source_word: σταύρωσον αὐτόν
  choice: Распни Его!
  rationale: В контексте римской казни σταυρόω означает распятие; традиционный русский глагол точен и понятен.
- source_word: Τὸν βασιλέα ὑμῶν σταυρώσω;
  choice: Мне распять вашего Царя?
  rationale: Такая конструкция естественно передаёт совещательный конъюнктив и сохраняет риторическую остроту вопроса Пилата.
- source_word: οἱ ἀρχιερεῖς
  choice: Первосвященники
  rationale: Во множественном числе термин обозначает высших представителей священнической власти; это устоявшийся и точный русский эквивалент.
- source_word: Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα
  choice: Нет у нас царя, кроме кесаря
  rationale: Оборот εἰ μὴ выражает исключение. Порядок слов сохраняет категоричность заявления, а «кесарь» передаёт римский титул Καῖσαρ в данном библейском контексте.
theological_decisions:
- issue: Заявление первосвященников о царской власти
  choice: Нет у нас царя, кроме кесаря
  alternative: У нас нет иного царя, кроме кесаря
  rationale: Выбранный вариант прямо сохраняет исключительный и напряжённый характер заявления, не добавляя богословского толкования и не расширяя значение греческого текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Реплики краткие и резкие, как в греческом тексте; историческое настоящее λέγει передано прошедшим временем, естественным для русского рассказа. Заглавные буквы в местоимении «Его» и слове «Царя» следуют распространённой русской библейской издательской норме, не изменяя смысла.
