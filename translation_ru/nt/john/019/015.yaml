  verdict: revise
  source_fidelity: В целом перевод точно передаёт смысл и резкость реплик. Однако λέγει αὐτοῖς буквально означает «говорит/сказал им» (историческое настоящее), а не «спросил их». Хотя последующая реплика имеет форму вопроса, исходный глагол следует сохранить как нейтральный глагол речи.
  naturalness: Фраза «Мне распять вашего царя?» естественна и удачно передаёт риторический совещательный вопрос. «Долой! Долой!» — краткий, сильный и естественный эквивалент повторённого Ἆρον ἆρον. Строчные буквы в «его» и «царя» предпочтительны для нейтрального современного литературного издания и не привносят интерпретационного оттенка.
  terminology: «Распни», «первосвященники» и «кесарь» допустимы и соответствуют библейскому регистру. «Кесарь» уместно сохраняет традиционную передачу Καίσαρ как римского титула в данном контексте.
  issues:
  - severity: medium
    issue: «Пилат спросил их» передаёт λέγει αὐτοῖς как глагол вопроса.
    rationale: В греческом стоит λέγει — «говорит/сказал», историческое настоящее. Вопросительная форма прямой речи не оправдывает замену нейтрального глагола речи на «спросил»; «сказал им» точнее.
  - severity: low
    issue: Заглавные буквы в «Его» и «Царя» не обусловлены греческим текстом.
    rationale: Греческие рукописные регистровые особенности не дают основания для благоговейной капитализации. В современном нейтральном литературном переводе строчные буквы лучше сохраняют редакционную нейтральность.
