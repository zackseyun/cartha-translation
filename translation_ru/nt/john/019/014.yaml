  text: ἦν δὲ παρασκευὴ τοῦ πάσχα, ὥρα ⸂ἦν ὡς⸃ ἕκτη. καὶ λέγει τοῖς Ἰουδαίοις· Ἴδε ὁ βασιλεὺς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/014.yaml
  text: It was the day of preparation of the Passover[a]; it was about the sixth hour. And he says to the Jews, “Behold[b], your king!”
translation:
  language: ru
  text: 'Это был день приготовления к Пасхе; было около шестого часа[a]. И он говорит иудеям[b]: «Вот ваш царь!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Возможное современное соответствие — около полудня; оно зависит от принятой системы исчисления часов.
    reason: cultural_note
  - marker: b
    text: В данном контексте слово «иудеи» может обозначать более узко представителей иудейской власти или иудейских начальников.
    reason: alternative_reading
lexical_decisions:
- source_word: παρασκευὴ τοῦ πάσχα
  choice: день приготовления к Пасхе
  rationale: Передаёт временное значение παρασκευή и естественно выражает связь с Пасхой, обозначенную родительным τοῦ πάσχα, не добавляя отсутствующего в греческом тексте вводного «теперь».
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: было около шестого часа
  rationale: Сохраняет древний способ обозначения времени и приблизительность ὡς, не устраняя возможную неоднозначность системы отсчёта.
- source_word: λέγει
  choice: говорит
  rationale: Сохраняет характерное для повествования Иоанна историческое настоящее и его живость.
- source_word: τοῖς Ἰουδαίοις
  choice: иудеям
  rationale: Прямо передаёт Ἰουδαῖοι без внесения в основной текст более узкого толкования «иудейским начальникам».
- source_word: Ἴδε
  choice: Вот
  rationale: Естественное современное русское восклицание, которое привлекает внимание и сохраняет торжественно-публичную силу греческого слова.
- source_word: ὁ βασιλεὺς ὑμῶν
  choice: ваш царь
  rationale: Идиоматично передаёт притяжательную конструкцию и сохраняет политическую остроту и иронию заявления Пилата.
theological_decisions:
- issue: Кого обозначает выражение «иудеи» в данном контексте
  choice: Сохранить «иудеям» в основном тексте
  alternative: «иудейским начальникам» или «жителям Иудеи»
  rationale: Греческий текст прямо не сужает круг адресатов, хотя контекст может допускать более узкое указание на представителей иудейской власти; эта возможность отмечена в сноске.
- issue: Исчисление «шестого часа»
  choice: Сохранить древнее обозначение времени
  alternative: «около полудня»
  rationale: Так сохраняются форма исходного текста и приблизительность выражения, а спорный вопрос о системе исчисления часов не решается в самом переводе.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Историческое настоящее сохранено. «Вот» выбрано вместо архаичного «се», а строчная буква в слове «царь» соответствует обычной современной орфографии и характеру реплики Пилата.
