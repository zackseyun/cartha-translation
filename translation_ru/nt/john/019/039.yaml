  naturalness: '«Пришёл также Никодим» звучит несколько плавнее, чем «Пришёл и Никодим», при сохранении присоединительного смысла. Деепричастный оборот «принеся смесь» нормативен и соответствует повествовательному регистру. «Около ста литр» грамматически корректно: родительный множественного числа от «литра» — «литр».'
