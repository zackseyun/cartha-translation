base_translation:
  language: en
  yaml_path: translation/nt/john/019/039.yaml
  text: Nicodemus also came—the one who had first come to him at night—bringing a mixture of myrrh and aloes[b][a], about a hundred litras.
translation:
  language: ru
  text: Пришёл также Никодим — тот, кто прежде приходил к Иисусу ночью[a], — принеся смесь мирры и алоэ, около ста литр[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот оборот отсылает к ночному приходу Никодима к Иисусу; см. Ин. 3:1–2.
    reason: cross_reference
  - marker: b
    text: Литра — римский фунт, около 327 граммов; сто литр составляли примерно 32–33 килограмма.
    reason: cultural_note
lexical_decisions:
- source_word: ἦλθεν δὲ καὶ
  choice: Пришёл и
  rationale: δέ служит лёгкой связкой, а καί добавляет Никодима к уже упомянутому участнику погребения; русское «Пришёл и Никодим» естественно передаёт этот присоединительный смысл.
- source_word: Νικόδημος
  choice: Никодим
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν νυκτὸς τὸ πρῶτον
  choice: тот, кто прежде приходил к Иисусу ночью
  rationale: Субстантивированный оборот идентифицирует Никодима и отсылает к Ин. 3:1–2. «Прежде» естественно передаёт τὸ πρῶτον в значении «ранее», а явное «к Иисусу» устраняет неестественную для русского двусмысленность местоимения без изменения референции.
- source_word: φέρων
  choice: и принёс
  rationale: Причастие обозначает сопутствующее действие. В русском однородное сказуемое звучит естественнее буквального «неся» и сохраняет последовательность прихода с принесёнными веществами.
- source_word: μίγμα σμύρνης καὶ ἀλόης
  choice: смесь мирры и алоэ
  rationale: «Смесь» прямо передаёт μίγμα; «мирра» и «алоэ» — понятные русские названия ароматических веществ, употреблявшихся при погребении.
- source_word: ὡς
  choice: около
  rationale: При указании количества ὡς выражает приблизительность.
- source_word: λίτρας ἑκατόν
  choice: ста литр
  rationale: Сохранена древняя римская единица меры, чтобы не создавать ложного впечатления точного соответствия современному фунту; значение поясняется в сноске.
theological_decisions:
- issue: Референт αὐτόν в определительном обороте
  choice: «к Иисусу»
  alternative: «к Нему»
  rationale: Контекст однозначно отсылает к ночному посещению Иисуса Никодимом в Ин. 3:1–2. Указание имени по-русски ясно передаёт референт, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Порядок слов сохраняет присоединительное выделение Никодима; вставной оборот отмечен тире. Древняя мера оставлена в тексте и кратко разъяснена в сноске.
