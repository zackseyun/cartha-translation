  text: 'Ибо всё это произошло, чтобы исполнилось Писание: «Ни одна из его костей не будет сломана».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Кость его не будет сломана». Единственное число в греческом тексте имеет собирательный смысл; выражение «ни одна из его костей» естественно передаёт его по-русски.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο γὰρ ταῦτα
  choice: Всё это произошло
  rationale: Оборот естественно передаёт событие, о котором только что было рассказано; γάρ выражает пояснение, которое по-русски здесь достаточно ясно из контекста и не требует отдельного союза «ибо».
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: чтобы исполнилось Писание
  rationale: Сохраняются целевая конструкция ἵνα, страдательное значение πληρωθῇ и обычное для Иоанна обозначение священного текста словом «Писание».
- source_word: Ὀστοῦν οὐ συντριβήσεται αὐτοῦ
  choice: Ни одна его кость не будет сломана
  rationale: Русская конструкция «ни одна… не» естественно передаёт отрицание при существительном в единственном числе; «будет сломана» точно соответствует смыслу συντριβήσεται применительно к кости.
theological_decisions:
- issue: Передача ветхозаветной цитаты и её связи с Исх 12:46, Чис 9:12 и Пс 33:21
  choice: Ни одна его кость не будет сломана
  alternative: Его кость не будет сокрушена
  rationale: Выбранный вариант сохраняет единственное число греческого ὀστοῦν, остаётся естественным по-русски и не уточняет, к какому именно ветхозаветному месту восходит формулировка.
translation_notes:
  register: Современный литературный русский язык; формулировка торжественная, но без архаизмов. «Всё это» естественно передаёт нейтральное множественное ταῦτα, а «Писание» сохраняет традиционный библейский термин.
