  source_fidelity: 'Смысл греческого текста передан верно: распятие Иисуса, двое других вместе с Ним, расположенные по разным сторонам, и Иисус посередине. Однако в исходной русской пунктуационно-синтаксической конструкции двоеточие после «двоих» вводит ряд, в который затем попадает «Иисуса», хотя Иисус не является одним из этих двоих.'
