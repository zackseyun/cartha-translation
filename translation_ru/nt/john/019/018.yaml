  text: ὅπου αὐτὸν ἐσταύρωσαν, καὶ μετ’ αὐτοῦ ἄλλους δύο ἐντεῦθεν καὶ ἐντεῦθεν, μέσον δὲ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/018.yaml
  text: where they crucified him[a], and with him two others, one on each side, and Jesus in the middle.
translation:
  language: ru
  text: 'там распяли Его и ещё двоих с Ним: одного с одной стороны, другого — с другой, а Иисуса — посередине.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου
  choice: там
  rationale: В продолжении предыдущего предложения русское «там» естественно передаёт относительное наречие места ὅπου.
- source_word: ἐσταύρωσαν
  choice: распяли
  rationale: В контексте Страстей σταυρόω означает казнь на кресте; «распяли» — точный и общепонятный русский эквивалент без добавления неуказанных деталей.
- source_word: μετ’ αὐτοῦ
  choice: вместе с Ним
  rationale: μετά с родительным выражает совместность; этот вариант естественен по-русски и сохраняет связь с Иисусом.
- source_word: ἄλλους δύο
  choice: ещё двоих
  rationale: Передаёт значение «двух других», не добавляя отсутствующего в греческом тексте существительного «людей» или их характеристики.
- source_word: ἐντεῦθεν καὶ ἐντεῦθεν
  choice: одного с одной стороны, другого — с другой
  rationale: Парные наречия обозначают расположение по разные стороны; развёрнутая формулировка сохраняет распределительный смысл и звучит естественно.
- source_word: μέσον δὲ τὸν Ἰησοῦν
  choice: Иисуса же — посередине
  rationale: Сохраняются центральное положение Иисуса и лёгкое выделение, выраженное δέ; эллиптическая конструкция передаёт лаконичность оригинала.
theological_decisions:
- issue: Следует ли прямо сказать, что Иисус находился между двумя другими
  choice: 'Сохранить пространственный образ оригинала: «одного с одной стороны, другого — с другой, Иисуса же — посередине»'
  alternative: «а Иисуса — между ними»
  rationale: Греческий текст прямо указывает расположение по сторонам и центральное положение Иисуса. «Между ними» верно по смыслу, но несколько сжимает и истолковывает исходную картину.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Заглавные местоимения при указании на Иисуса следуют принятому в русском библейском стиле почтительному оформлению. Тире помогают ясно передать эллиптическую и контрастную структуру греческой фразы.
