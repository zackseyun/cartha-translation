  terminology: '«Распяли», «Иисус» и «ещё двоих» точны и соответствуют современному библейскому русскому регистру. Заглавное «Его» допустимо в избранном стиле. Дополнительная сноска не требуется: английская примечательная альтернатива не представляет текстологической или смысловой неоднозначности, которую необходимо переносить в русский текст.'
