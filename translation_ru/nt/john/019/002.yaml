lexical_decisions:
- source_word: στρατιῶται
  choice: воины
  rationale: Естественное и точное обозначение римских военнослужащих в повествовательном контексте; сохраняет достойный литературный регистр.
- source_word: πλέξαντες
  choice: сплетя
  rationale: Деепричастие естественно передаёт предшествующее действие аористного причастия и последовательность событий.
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: венец из терний
  rationale: «Венец» передаёт царскую символику и насмешливую коронацию, а традиционно понятное «из терний» обозначает материал без уточнения вида колючих растений.
- source_word: ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ
  choice: возложили его Ему на голову
  rationale: «Возложили» точно передаёт намеренное помещение венца; местоимение «его» восполняет подразумеваемый объект по нормам русского языка.
- source_word: ἱμάτιον
  choice: одеяние
  rationale: Сохраняет широкий смысл предмета одежды и не сужает его до конкретного покроя, которого греческий текст не определяет.
- source_word: πορφυροῦν
  choice: пурпурное
  rationale: Прямо передаёт цвет и связанную с ним царскую символику без добавочного истолкования.
- source_word: περιέβαλον αὐτόν
  choice: надели на Него
  rationale: Естественная русская конструкция для облачения человека в предмет одежды; не вносит дополнительных деталей о способе действия.
theological_decisions:
- issue: Образ насмешливого царского облачения
  choice: Передать венец и пурпурное одеяние прямо, не добавляя слов о насмешке или царском достоинстве.
  alternative: «В насмешку короновали Его и облачили как царя»
  rationale: Насмешливая царская символика ясна из контекста и предметов, однако такие поясняющие слова отсутствуют в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Заглавные местоимения по отношению к Иисусу соответствуют принятой русской издательской традиции, не меняя смысла исходного текста.
