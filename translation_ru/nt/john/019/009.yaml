  text: καὶ εἰσῆλθεν εἰς τὸ πραιτώριον πάλιν καὶ λέγει τῷ Ἰησοῦ· Πόθεν εἶ σύ; ὁ δὲ Ἰησοῦς ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/009.yaml
  text: And he entered the governor’s headquarters again and said to Jesus[a], “Where are you from?” But Jesus gave him no answer.
translation:
  language: ru
  text: 'И он снова вошёл в резиденцию наместника[a] и спросил Иисуса: «Откуда ты?» Но Иисус не дал ему ответа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в преторий» — официальную резиденцию или ставку римского наместника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: вошёл
  rationale: Аорист εἰσέρχομαι обозначает движение внутрь; «вошёл» точно и естественно передаёт действие.
- source_word: πραιτώριον
  choice: резиденцию наместника
  rationale: Здесь слово обозначает официальную резиденцию или ставку римского правителя. Функциональный перевод понятнее современному читателю, а традиционный термин приведён в сноске.
- source_word: πάλιν
  choice: снова
  rationale: Наречие прямо указывает на повторное действие.
- source_word: λέγει
  choice: спросил
  rationale: Историческое настоящее передано прошедшим временем, естественным для русского повествования; с учётом следующего прямого вопроса «спросил» идиоматичнее буквального «сказал».
- source_word: Πόθεν εἶ σύ
  choice: Откуда ты?
  rationale: Πόθεν выражает вопрос о происхождении или источнике. Краткая русская формулировка сохраняет возможную глубину вопроса и не уточняет её искусственно.
- source_word: ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ
  choice: не дал ему ответа
  rationale: Передана исходная конструкция «не дал ему ответа», которая звучит естественно по-русски и подчёркивает отсутствие ответа.
- source_word: καὶ ... καὶ ... δὲ
  choice: И ... и ... Но
  rationale: Союзы сохраняют последовательность повествования, а «но» передаёт контраст между вопросом и молчанием Иисуса.
theological_decisions:
- issue: Подразумеваемое подлежащее при εἰσῆλθεν и λέγει
  choice: Сохранено местоимение «он»; из контекста ясно, что речь о Пилате.
  alternative: Явно назвать Пилата в основном тексте.
  rationale: Греческий текст не повторяет имени Пилата. Местоимение сохраняет форму источника без потери ясности в контексте.
- issue: Смысл вопроса Πόθεν εἶ σύ
  choice: «Откуда ты?» без пояснения, идёт ли речь о земном месте или высшем происхождении.
  alternative: Уточнить как «Каково твоё происхождение?» или «Откуда ты пришёл?»
  rationale: Краткий вопрос оригинала допускает смысловую глубину; уточняющий перевод преждевременно снял бы эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Местоимение «ты» набрано со строчной буквы, поскольку греческий текст не кодирует особого почтительного написания; это также избегает внесения поздней конфессиональной орфографической традиции.
