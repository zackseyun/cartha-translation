  text: καὶ βαστάζων ⸂αὑτῷ τὸν σταυρὸν⸃ ἐξῆλθεν εἰς ⸀τὸν λεγόμενον Κρανίου Τόπον, ⸀ὃ λέγεται Ἑβραϊστὶ Γολγοθα,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/017.yaml
  text: And carrying the cross by himself[a], he went out to the place called Skull Place, which in Hebrew is called Golgotha.
translation:
  language: ru
  text: И, Сам неся крест, Он вышел на место, называемое Местом Черепа, которое по-еврейски[a] называется Голгофа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «по-арамейски». Употреблённое Иоанном выражение «по-еврейски» может обозначать местный семитский язык Иудеи.'
    reason: Лексическая альтернатива для Ἑβραϊστί.
lexical_decisions:
- source_word: βαστάζων
  choice: неся
  rationale: Причастие обозначает физическое несение; «неся» точно и естественно передаёт продолжающееся действие.
- source_word: αὑτῷ τὸν σταυρόν
  choice: неся крест сам
  rationale: Возвратное местоимение в дательном падеже подчёркивает, что Иисус Сам нёс крест; формулировка не превращает это подчёркивание в простое указание на принадлежность.
- source_word: σταυρός
  choice: крест
  rationale: В контексте Страстей это стандартный и достаточно широкий эквивалент; греческое слово здесь само по себе не требует более узкого «перекладина».
- source_word: ἐξῆλθεν
  choice: вышел
  rationale: Прямой и естественный русский эквивалент глагола «выйти».
- source_word: τὸν λεγόμενον Κρανίου Τόπον
  choice: к месту, называемому Местом Черепа
  rationale: Передаёт назывную формулу и значение обоих элементов выражения — «место» и «череп», сохраняя характер топонима.
- source_word: Ἑβραϊστί
  choice: по-еврейски
  rationale: Основной текст следует явному обозначению языка в греческом тексте; возможное более широкое употребление термина поясняется в сноске.
- source_word: Γολγοθα
  choice: Голгофа
  rationale: Использована укоренившаяся русская транслитерация семитского топонима.
theological_decisions:
- issue: Значение Ἑβραϊστί
  choice: по-еврейски
  alternative: по-арамейски
  rationale: Греческий текст прямо употребляет обозначение «по-еврейски», поэтому оно сохранено в основном тексте. Возможность отнесения слова к местному семитскому языку Иудеи, то есть к арамейскому, вынесена в сноску.
- issue: Смысл αὑτῷ при τὸν σταυρόν
  choice: крест сам
  alternative: Свой крест
  rationale: Выбранный вариант сохраняет рефлексивное подчёркивание лица, которое несёт крест, и не сводит конструкцию лишь к притяжательности.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Местоимение «Он» написано с прописной буквы по принятой русской библейской традиции; синтаксис остаётся ясным и близким к греческой последовательности.
