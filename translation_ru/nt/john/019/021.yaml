    rationale: ἔλεγον — имперфект; «говорили» сохраняет его незавершённый/повторяемый повествовательный аспект без неестественности.
  - severity: medium
    issue: «Он» с прописной буквы вместо ἐκεῖνος
    rationale: Прописная буква вносит русскую благочестивую конвенцию, а нейтральное «Он» сглаживает демонстративную, возможно дистанцированную, отсылку. «Тот» точнее и не усиливает оттенок до недоказуемого оскорбления.
  - severity: low
