  naturalness: Предлагаемая конструкция с вложенными кавычками естественна для современного литературного русского и ясно показывает, что священники хотят изменить именно текст надписи. «Итак» передаёт связующую функцию οὖν точнее, чем сугубо временное «тогда».
  terminology: «Иудейские первосвященники» и «Царь иудеев» сохраняют общепринятую библейскую терминологию. Примечание фиксирует возможное региональное значение Ἰουδαῖοι, не заменяя в самом тексте устойчивый титул.
