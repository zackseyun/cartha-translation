  text: ἔλεγον οὖν τῷ Πιλάτῳ οἱ ἀρχιερεῖς τῶν Ἰουδαίων· Μὴ γράφε· Ὁ βασιλεὺς τῶν Ἰουδαίων, ἀλλ’ ὅτι ἐκεῖνος εἶπεν Βασιλεὺς ⸂τῶν Ἰουδαίων εἰμί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/021.yaml
  text: So the chief priests of the Jews were saying to Pilate[a], “Do not write, ‘The King of the Jews,’ but that he said[b], ‘I am King of the Jews.’”
translation:
  language: ru
  text: 'Итак, иудейские первосвященники[a] говорили Пилату: «Не пиши: „Царь иудеев“, а напиши: „Тот сказал: ‘Я — Царь иудеев’“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «первосвященники иудеев»; также «Царь иудеев». Греческое слово может означать «иудеев» вообще или, в зависимости от контекста, «жителей Иудеи».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: сказали
  rationale: Имперфект обозначает происходившее в тот момент обращение; в русском повествовании естественнее совершенный вид, поскольку передаётся единая реплика, а не явно повторявшееся действие.
- source_word: οὖν
  choice: тогда
  rationale: Передаёт повествовательную связь и реакцию первосвященников на содержание надписи.
- source_word: οἱ ἀρχιερεῖς τῶν Ἰουδαίων
  choice: иудейские первосвященники
  rationale: Естественная русская конструкция для руководителей священства из числа иудеев; множественное число не подразумевает одновременного существования нескольких действующих первосвященников.
- source_word: Μὴ γράφε
  choice: Не пиши
  rationale: Прямой и естественный запрет, соответствующий настоящему императиву с μή.
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: Царь иудеев
  rationale: Устоявшееся и контекстуально точное обозначение в надписи; русский язык не имеет артикля, поэтому определённость выражается контекстом.
- source_word: ἀλλ’ ὅτι
  choice: но напиши, что
  rationale: В русском для ясности эллиптически восстанавливается сказуемое «напиши»; конструкция прямо противопоставляет требуемую формулировку исходной надписи.
- source_word: ἐκεῖνος εἶπεν
  choice: Он сказал
  rationale: Передаёт референт демонстратива без добавления не вполне обязательного пренебрежительного оттенка; прописная буква соответствует русской традиции уважительного местоименного обозначения Иисуса.
- source_word: Βασιλεὺς τῶν Ἰουδαίων εἰμί
  choice: Я Царь иудеев
  rationale: Предикативное именное сказуемое естественно передаётся без связки «есть»; отсутствие греческого артикля не создаёт в русском отдельной формальной альтернативы.
theological_decisions:
- issue: Значение Ἰουδαίων в рассказе о страстях у Иоанна
  choice: иудеев / иудейские
  alternative: жителей Иудеи / иудейские в региональном смысле
  rationale: В данном месте выражение входит в политико-религиозный титул «Царь иудеев» и обозначает народ в общепринятой русской формулировке. Региональное значение «жители Иудеи» лексически возможно в иных контекстах, но здесь не требует отдельного примечания.
- issue: Определённость титула в словах Иисуса
  choice: Я Царь иудеев
  alternative: Я — Царь иудеев
  rationale: Греческий предикатив βασιλεύς стоит без артикля, однако русский язык не грамматикализует эту разницу; вариант без тире сохраняет прямоту реплики и не навязывает дополнительного смыслового противопоставления.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Сохранена вложенная прямая речь и формулировка спорной надписи. Лексика традиционно библейская, но не архаичная.
