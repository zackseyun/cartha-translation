  text: ἀλλ’ εἷς τῶν στρατιωτῶν λόγχῃ αὐτοῦ τὴν πλευρὰν ἔνυξεν, καὶ ⸂ἐξῆλθεν εὐθὺς⸃ αἷμα καὶ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/034.yaml
  text: But one of the soldiers pierced his side with a spear[b][a], and immediately blood and water came out.
translation:
  language: ru
  text: Но один из воинов пронзил ему бок копьём, и тотчас вытекли кровь и вода.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Некоторые толкователи понимают «кровь и воду» символически или связывают их с таинствами; другие считают эти слова описанием физического явления. Сам греческий текст здесь не объясняет их значения.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Но
  rationale: 'Передаёт противопоставление предыдущему сообщению: голени Иисуса не перебили, но один из воинов пронзил ему бок.'
- source_word: εἷς τῶν στρατιωτῶν
  choice: один из воинов
  rationale: Сохраняет явно выраженную в греческом партитивную конструкцию, не сводя её к неопределённому «один воин».
- source_word: λόγχῃ
  choice: копьём
  rationale: Естественное и понятное современному русскому читателю обозначение колющего древкового оружия воина; «пика» здесь менее нейтральна.
- source_word: αὐτοῦ τὴν πλευρὰν
  choice: ему бок
  rationale: Русская конструкция с дательным принадлежности естественно передаёт буквальное «его бок» и сохраняет местоименную отсылку к Иисусу без избыточного уточнения имени.
- source_word: ἔνυξεν
  choice: пронзил
  rationale: Точно и достойно передаёт действие острым оружием, не усиливая его до экспрессивного «ударил» или «вонзил».
- source_word: καὶ ⸂ἐξῆλθεν εὐθὺς⸃
  choice: и тотчас вытекли
  rationale: «Тотчас» передаёт εὐθύς, а «вытекли» естественно описывает выход крови и воды из раны. Множественное число соответствует норме русского языка при составном подлежащем, хотя в греческом стоит глагол в единственном числе.
- source_word: αἷμα καὶ ὕδωρ
  choice: кровь и вода
  rationale: Сохраняет необычное буквальное выражение без медицинского или сакраментального истолкования.
theological_decisions:
- issue: Следует ли истолковывать «кровь и воду» сакраментально, символически или физиологически
  choice: Оставить буквальное выражение «кровь и вода», а отсутствие пояснения в самом стихе отметить в сноске.
  alternative: Разъяснить выражение как сакраментальный символ или как физическое описание последствий ранения.
  rationale: Греческий текст сообщает о крови и воде, но не объясняет их значения. Перевод сохраняет эту богословскую и смысловую открытость, не вводя в основной текст определённую традицию толкования.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достойный повествовательный стиль. «Воин» уместен в историко-библейском контексте; «копьё» общеупотребительно и не требует отдельной лексической сноски. Маркер сноски поставлен непосредственно после выражения, к которому относится толкование.
