base_translation:
  language: en
  yaml_path: translation/nt/john/019/025.yaml
  text: Standing by the cross of Jesus were his mother[a], and his mother's sister, Mary the wife of Clopas[b], and Mary Magdalene.
translation:
  language: ru
  text: У креста Иисуса стояли Его мать, сестра Его матери, Мария Клопы[a][b] и Мария Магдалина.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мария, жена Клопы». В греческом тексте прямо не сказано, кем Мария приходилась Клопе, хотя понимание «жена Клопы» широко распространено.'
    reason: lexical_alternative
  - marker: b
    text: Этот перечень можно понимать и как упоминание трёх женщин, если «сестра Его матери» и «Мария Клопы» — одно и то же лицо.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἱστήκεισαν
  choice: стояли
  rationale: Русский глагол несовершенного вида естественно передаёт продолжавшееся положение или состояние, выраженное греческой формой.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Здесь частица обозначает мягкий повествовательный переход; в русском такой переход естественно передаётся порядком слов без добавления явного «теперь» или усиленного противопоставления.
- source_word: παρὰ τῷ σταυρῷ τοῦ Ἰησοῦ
  choice: у креста Иисуса
  rationale: Предлог παρά с дательным падежом обозначает близость; «у креста» кратко и естественно сохраняет пространственное значение, а родительный «Иисуса» — структуру исходного текста.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: Его мать
  rationale: Прямой и естественный перевод именной группы.
- source_word: ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ
  choice: сестра Его матери
  rationale: Сохраняет родственную связь без дополнительных уточнений.
- source_word: Μαρία ἡ τοῦ Κλωπᾶ
  choice: Мария, жена Клопы
  rationale: Конструкция с артиклем и родительным падежом обозначает Марию через её отношение к Клопе; наиболее распространённое понимание — супружеская связь. Поскольку слово «жена» в греческом прямо не стоит, буквальная альтернатива вынесена в примечание.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Мария Магдалина
  rationale: Устоявшаяся и понятная русская форма обозначения Марии из Магдалы.
theological_decisions:
- issue: Число и отождествление женщин у креста
  choice: 'Основной текст перечисляет четырёх женщин: мать Иисуса, сестру Его матери, Марию, жену Клопы, и Марию Магдалину.'
  alternative: Возможно прочтение с тремя женщинами, если «сестра Его матери» и «Мария Клопы» обозначают одно лицо.
  rationale: Компактный греческий синтаксис допускает оба разбора. Основной текст следует более прямому пониманию четырёх однородных наименований, но не устраняет альтернативу и указывает её в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка проста и доступна; «а также» помогает основному тексту ясно перечислить четырёх женщин, при этом допустимый трёхчастный разбор сохранён в примечании.
