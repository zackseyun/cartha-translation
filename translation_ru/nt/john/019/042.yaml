source:
  edition: SBLGNT
  text: ἐκεῖ οὖν διὰ τὴν παρασκευὴν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν τὸ μνημεῖον, ἔθηκαν τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/042.yaml
  text: So there[a], because of the Jews’ day of preparation, since the tomb was nearby, they laid Jesus there.
translation:
  language: ru
  text: Итак, там они положили Иисуса, потому что у иудеев был день приготовления и гробница была рядом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκεῖ
  choice: там
  rationale: Наречие места указывает на выбранную для погребения гробницу; русское «там» естественно передаёт пространственную отсылку.
- source_word: οὖν
  choice: итак
  rationale: Сохраняет значение повествовательного вывода и связи с предшествующим контекстом.
- source_word: διὰ τὴν παρασκευὴν
  choice: из-за ... дня приготовления
  rationale: διά с винительным падежом выражает причину, а παρασκευή здесь обозначает день приготовления перед субботой или праздником. Развёрнутый перевод понятен современному читателю.
- source_word: τῶν Ἰουδαίων
  choice: иудейского
  rationale: Передаёт родительный падеж принадлежности или связи, не уточняя сверх текста, идёт ли речь прежде всего об этнической, религиозной или обрядовой характеристике.
- source_word: ὅτι
  choice: поскольку
  rationale: Вводит дополнительную причину выбора именно этой гробницы.
- source_word: ἐγγὺς
  choice: рядом
  rationale: Естественно выражает близость гробницы в современном русском языке.
- source_word: μνημεῖον
  choice: гробница
  rationale: В контексте погребения обозначает подготовленное место для помещения тела и точнее, чем более общее «могила».
- source_word: ἔθηκαν
  choice: положили
  rationale: В данном погребальном контексте естественно передаёт помещение тела Иисуса в гробницу.
- source_word: τὸν Ἰησοῦν
  choice: Иисуса
  rationale: Стандартная русская форма личного имени; прямое дополнение при глаголе.
theological_decisions:
- issue: Передача παρασκευή в повествовании о Страстях
  choice: день приготовления
  alternative: Приготовление
  rationale: Такой перевод объясняет исторический термин современному читателю, но не вводит более конкретного календарного толкования, чем позволяет сам текст.
- issue: Передача τῶν Ἰουδαίων в повествовании Иоанна
  choice: иудейский день приготовления
  alternative: день приготовления у иудеев
  rationale: Формулировка сохраняет связь дня приготовления с иудейским обычаем и не превращает выражение в богословскую оценку иудейского народа.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-д dignified; причинные связи и повествовательное «итак» сохранены. Термин «день приготовления» раскрыт без конфессионального или излишне конкретного календарного толкования.
