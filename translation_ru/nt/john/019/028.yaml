base_translation:
  language: en
  yaml_path: translation/nt/john/019/028.yaml
  text: After this[a], Jesus, knowing that all things had already been completed, in order that the Scripture might be fulfilled, said, “I thirst.”
translation:
  language: ru
  text: 'После этого Иисус, зная, что уже всё совершилось, — чтобы исполнилось Писание, — сказал: «Хочу пить».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее и традиционно: «Жажду».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: После этого
  rationale: Естественный временной переход, сохраняющий единственное число указательного местоимения τοῦτο.
- source_word: εἰδὼς
  choice: зная
  rationale: Передаёт обстоятельственное причастие как одновременное основному действию и естественно звучит по-русски.
- source_word: ἤδη πάντα τετέλεσται
  choice: уже всё совершилось
  rationale: Наречие «уже» отражает ἤδη, а совершенный вид и возвратная форма передают достигнутое состояние, выраженное перфектом τετέλεσται.
- source_word: ἵνα τελειωθῇ ἡ γραφή
  choice: чтобы исполнилось Писание
  rationale: Сохраняет целевую/результативную силу ἵνα и естественную для русского библейского языка сочетаемость «исполнилось Писание».
- source_word: λέγει
  choice: сказал
  rationale: Греческий исторический презенс передан прошедшим временем, естественным для русского повествования.
- source_word: Διψῶ
  choice: Хочу пить
  rationale: Современная и естественная русская передача прямого заявления о жажде; более буквальный традиционный вариант сохранён в примечании.
theological_decisions:
- issue: Связь знания Иисуса, завершённости всего и исполнения Писания
  choice: 'Сохранена последовательность: Иисус знает, что уже всё совершилось, после чего говорит с целью/результатом исполнения Писания.'
  alternative: Понимать ἵνα преимущественно как указание на результат, не подчёркивая намерение.
  rationale: Формулировка сохраняет синтаксис и напряжение греческого текста, не вводя дополнительной доктринальной схемы; различие между τετέλεσται и τελειωθῇ передано глаголами «совершилось» и «исполнилось».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Тире обособляют целевую конструкцию и проясняют, что слова «чтобы исполнилось Писание» относятся к последующему высказыванию. Маркер примечания поставлен непосредственно после цитаты.
