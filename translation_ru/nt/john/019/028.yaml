review_pass:
  verdict: approve
  source_fidelity: «После этого» точно передаёт Μετὰ τοῦτο; «зная» естественно отражает обстоятельственное εἰδώς. «Уже всё совершилось» адекватно передаёт ἤδη πάντα τετέλεσται как уже достигнутое завершение. Целевая конструкция «чтобы исполнилось Писание» верно передаёт ἵνα τελειωθῇ ἡ γραφή, не навязывая более узкого истолкования. Исторический презенс λέγει естественно передан прошедшим временем «сказал». «Хочу пить» является точной современной передачей Διψῶ; традиционно-буквальный вариант дан в примечании.
  naturalness: Текст звучит как современный литературный русский с подобающей повествовательной сдержанностью. «Хочу пить» в прямой речи естественно и не снижает регистра. Тире допустимо выделяют вставленную целевую конструкцию и не создают двусмысленности.
  terminology: «Писание» корректно передаёт ἡ γραφή в данном евангельском контексте. Различие между «совершилось» и «исполнилось» удачно сохраняет смысловое различие между τετέλεσται и τελειωθῇ. Примечание с вариантом «Жажду» уместно и якорь [a] расположен непосредственно после цитаты, к которой относится.
