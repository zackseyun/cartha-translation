lexical_decisions:
- source_word: τίτλον
  choice: надпись
  rationale: В контексте распятия слово обозначает письменное объявление о личности и обвинении осуждённого. «Надпись» точно и естественно передаёт смысл, не добавляя прямо не названную в греческом тексте табличку.
- source_word: ἔθηκεν ἐπὶ τοῦ σταυροῦ
  choice: поместил её на кресте
  rationale: Передаёт прямое пространственное значение греческого выражения, не заменяя его контекстуальным уточнением «над крестом».
- source_word: ἦν δὲ γεγραμμένον
  choice: Там было написано
  rationale: Естественно передаёт результативно-состоявшее значение конструкции и ясно отсылает к надписи на кресте.
- source_word: Ναζωραῖος
  choice: Назарянин
  rationale: Устоявшееся и понятное русское обозначение человека из Назарета, сохраняющее форму эпитета, а не разворачивающее её в отдельную конструкцию.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: Царь иудеев
  rationale: Сохраняет общепринятое в повествовании о страстях обозначение царя еврейского народа и публично-политический характер надписи; возможное более узкое географическое значение отмечено в сноске.
- source_word: δὲ καὶ
  choice: также
  rationale: Естественно выражает присоединительно-добавочное значение сочетания частиц.
- source_word: Ἰησοῦς
  choice: Иисус
  rationale: Устоявшаяся русская форма имени.
- source_word: Πιλᾶτος
  choice: Пилат
  rationale: Устоявшаяся русская форма имени.
- source_word: σταυροῦ
  choice: кресте
  rationale: Стандартное и контекстуально точное обозначение орудия распятия в евангельском повествовании.
theological_decisions:
- issue: Значение Ἰουδαίων в царском титуле
  choice: иудеев
  alternative: жителей Иудеи
  rationale: В надписи это выражение наиболее естественно обозначает еврейский народ в целом, представленный в формуле царского титула. Однако греческое слово в зависимости от контекста может иметь и более узкий региональный смысл, поэтому эта неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественно-сдержанным синтаксисом. Формулировка самой надписи сохранена как лаконичный именной титул; прописная буква в слове «Царь» отражает оформление цитируемой официальной надписи, а не вводит дополнительного богословского толкования.
