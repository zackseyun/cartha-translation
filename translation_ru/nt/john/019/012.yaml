reference: John 19:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐκ τούτου ⸂ὁ Πιλᾶτος ἐζήτει⸃ ἀπολῦσαι αὐτόν· οἱ δὲ Ἰουδαῖοι ⸀ἐκραύγασαν λέγοντες· Ἐὰν τοῦτον ἀπολύσῃς, οὐκ εἶ φίλος τοῦ Καίσαρος· πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν ἀντιλέγει τῷ Καίσαρι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/012.yaml
  text: From then on Pilate was seeking to release him. But the Jews shouted, saying, “If you release this man, you are not Caesar’s friend. Everyone who makes himself a king speaks against Caesar.”
translation:
  language: ru
  text: 'С этого времени Пилат старался освободить его[a]. Но иудеи[b] кричали: «Если ты освободишь его, ты не друг кесаря. Всякий, кто делает себя царём, выступает против кесаря[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Поэтому Пилат продолжал пытаться освободить его». Греческое выражение ἐκ τούτου может иметь временное значение («с этого времени») или причинное («поэтому», «из-за этого»).'
    reason: lexical_alternative
  - marker: b
    text: В Евангелии от Иоанна слово «иудеи» нередко обозначает конкретных противников Иисуса, особенно представителей иудейских властей, а не еврейский народ в целом.
    reason: cultural_note
  - marker: c
    text: 'Или: «говорит против кесаря»; также возможно: «противится кесарю».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτου
  choice: С этого времени
  rationale: Передаёт наиболее вероятное в повествовательном контексте временное значение, сохраняя в сноске возможное причинное понимание.
- source_word: ἐζήτει
  choice: старался
  rationale: Имперфект указывает на продолжавшиеся или повторные попытки; «старался» естественно передаёт эту длительность по-русски.
- source_word: ἀπολῦσαι / ἀπολύσῃς
  choice: освободить / освободишь
  rationale: Точно соответствует официальному освобождению из-под стражи в судебном контексте.
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: Но иудеи
  rationale: Сохраняет формулировку греческого текста без внесения в основной текст более узкого толкования «иудейские власти».
- source_word: ἐκραύγασαν λέγοντες
  choice: кричали
  rationale: Естественно передаёт громкий публичный возглас; отдельное «говоря» в современном русском избыточно.
- source_word: τοῦτον / αὐτόν
  choice: Его
  rationale: Русское местоимение естественно в данном контексте; прописная буква соответствует принятой традиции уважительного обозначения Иисуса, не меняя смысла исходного текста.
- source_word: φίλος τοῦ Καίσαρος
  choice: друг кесарю
  rationale: Устойчивая и ясная русская конструкция сохраняет возможный политический оттенок лояльности, не превращая выражение явно в официальный титул.
- source_word: πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν
  choice: Всякий, кто делает себя царём
  rationale: Близко передаёт греческую конструкцию и не ослабляет её до одного лишь заявления о царском статусе.
- source_word: ἀντιλέγει τῷ Καίσαρι
  choice: выступает против кесаря
  rationale: В политико-судебном контексте передаёт значение противодействия; сноска сохраняет более буквальную речевую альтернативу.
theological_decisions:
- issue: Кого обозначает выражение «иудеи» в Евангелии от Иоанна
  choice: Сохранить «иудеи» в основном тексте.
  alternative: «Иудейские начальники» или «жители Иудеи».
  rationale: Исходный текст содержит οἱ Ἰουδαῖοι и сам по себе не выражает более узкого определения; контекстуальное уточнение вынесено в сноску, чтобы избежать как необоснованного сужения, так и обобщения на весь еврейский народ.
- issue: Смысл ἀντιλέγει применительно к кесарю
  choice: «выступает против кесаря»
  alternative: «говорит против кесаря» или «противится кесарю».
  rationale: Контекст обвинения в нелояльности придаёт глаголу общий политический смысл противодействия, однако возможная более буквальная передача отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён там, где буквальное воспроизведение греческих причастных оборотов звучало бы неестественно; двусмысленность ἐκ τούτου и диапазон значения ἀντιλέγω сохранены в сносках.
