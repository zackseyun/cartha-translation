  text: Pilate answered[a], “What I have written, I have written.”
translation:
  language: ru
  text: 'Пилат ответил: «Что я написал, то написал».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Что я написал, написал». Дважды употреблённый в греческом перфект подчёркивает окончательность написанного и неизменность его результата.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ответил
  rationale: Аорист депонентного глагола ἀποκρίνομαι естественно передаётся обычным для повествовательного диалога русским глаголом «ответил».
- source_word: ὁ Πιλᾶτος
  choice: Пилат
  rationale: Определённый артикль при имени собственном характерен для греческого повествования и в русском не передаётся.
- source_word: Ὃ
  choice: что … то
  rationale: Субстантивированное относительное местоимение среднего рода означает «то, что»; конструкция «что … то» естественна по-русски и сохраняет соотносительную структуру высказывания.
- source_word: γέγραφα
  choice: я написал
  rationale: Русский совершенный вид передаёт завершённость действия и его актуальный результат. Дословное «я написал» повторено без замены, чтобы сохранить резкую и окончательную формулу Пилата.
theological_decisions:
- issue: Смысл повторённой формы перфекта γέγραφα γέγραφα
  choice: «Что я написал, то написал» — как выражение окончательности решения
  alternative: «Что я написал, то и написал»
  rationale: Повтор перфекта указывает на завершённое написание с сохраняющимся результатом и в контексте выражает отказ Пилата менять надпись. Перевод сохраняет эту окончательность, не добавляя прямого пояснения в основной текст.
translation_notes:
  register: Современный литературный русский язык; краткая, твёрдая реплика сохраняет риторический повтор оригинала. Формула «что … то» делает синтаксическую связь ясной и естественной для широкого читателя.
