base_translation:
  language: en
  yaml_path: translation/nt/john/019/006.yaml
  text: So when the chief priests and the officers saw him[a], they cried out, saying, “Crucify him! Crucify him!” Pilate said to them, “You take him and crucify him[b], for I find no charge against him.”
translation:
  language: ru
  text: 'Итак, когда первосвященники и служители увидели Его, они закричали: «Распни! Распни!» Пилат сказал им: «Возьмите Его вы сами[a] и распните, потому что я не нахожу в Нём основания для обвинения[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Возьмите Его вы и распните». Местоимение «вы» в греческом тексте выражено явно и несёт особое ударение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не нахожу в Нём никакой вины». Греческое слово может означать обвинение, основание для обвинения или вину; здесь преобладает судебный смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Итак, когда
  rationale: «Когда» передаёт временное значение ὅτε, а «итак» — продолжение повествования и вывод, выраженные οὖν.
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся русское обозначение представителей высшего священнического руководства Иерусалима; множественное число сохранено.
- source_word: ὑπηρέται
  choice: служители
  rationale: Слово обозначает подчинённых должностных лиц при религиозных властях. «Служители» сохраняет институциональный смысл, не уточняя без достаточных оснований, были ли они храмовой стражей.
- source_word: ἐκραύγασαν λέγοντες
  choice: они закричали
  rationale: Деепричастная конструкция со значением сопутствующего действия естественно свёрнута в русском языке; глагол передаёт громкий публичный крик.
- source_word: Σταύρωσον σταύρωσον
  choice: Распни! Распни!
  rationale: Повтор сохранён ради силы требования. Объект, подразумеваемый греческой формой и ясный из контекста, по-русски также можно не повторять.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: Возьмите Его вы сами
  rationale: «Вы сами» передаёт явное и эмфатическое ὑμεῖς и подчёркивает противопоставление Пилата обвинителям.
- source_word: σταυρώσατε
  choice: распните
  rationale: Точный и устоявшийся русский эквивалент повелительной формы глагола σταυρόω.
- source_word: αἰτίαν
  choice: оснований для обвинения
  rationale: 'В сцене суда αἰτία имеет прежде всего юридический смысл: обвинение либо основание для него. Такая передача точнее, чем более широкое «вина».'
theological_decisions:
- issue: Заявление Пилата о невиновности Иисуса
  choice: я не нахожу оснований для обвинения Его
  alternative: я не нахожу в Нём никакой вины
  rationale: Основной вариант сохраняет судебный характер слов Пилата и не превращает юридическую оценку в более широкое богословское утверждение, хотя альтернативный перевод также лексически возможен.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для устного чтения; повтор требования о распятии и эмфатическое «вы сами» сохранены.
