source:
  edition: SBLGNT
  text: Οἱ οὖν Ἰουδαῖοι, ⸂ἐπεὶ παρασκευὴ ἦν, ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ⸃, ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου, ἠρώτησαν τὸν Πιλᾶτον ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη καὶ ἀρθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/031.yaml
  text: Therefore the Jews[a], because it was the day of preparation[d][c][b], asked Pilate that the bodies might not remain on the cross on the Sabbath—for that Sabbath day was a great one—and that their legs might be broken and they might be taken away.
translation:
  language: ru
  text: Итак, иудеи[a], так как был день приготовления[b], попросили Пилата, чтобы тела не оставались на кресте в субботу — ведь день той субботы был великим[c] — и чтобы им перебили голени и сняли тела[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В повествовании Иоанна слово «иудеи» в некоторых контекстах может обозначать более узко иудейские власти или руководителей.
    reason: Сохраняет возможное контекстуальное значение Ἰουδαῖοι, не сужая его в основном тексте.
  - marker: b
    text: То есть день перед субботой, предназначенный для подготовки к ней.
    reason: Поясняет календарное значение παρασκευή современному читателю.
  - marker: c
    text: 'Или: «ведь та суббота была особенно важной».'
    reason: Раскрывает смысл μεγάλη как указание на особую значимость этой субботы, сохраняя буквальную формулировку в основном тексте.
  - marker: d
    text: 'Или: «убрали тела» или «унесли тела».'
    reason: Отражает более широкий диапазон значений αἴρω, тогда как основной текст передаёт наиболее вероятный контекстуальный смысл.
lexical_decisions:
- source_word: Οἱ οὖν Ἰουδαῖοι
  choice: Иудеи
  rationale: Ἰουδαῖοι буквально обозначает иудеев и в Евангелии от Иоанна может в зависимости от контекста относиться к иудейским властям. Основной текст не сужает значение до руководителей; возможное контекстуальное уточнение вынесено в сноску. Связка οὖν здесь естественно передаётся развитием повествования и не требует отдельного русского слова.
- source_word: ἐπεὶ παρασκευὴ ἦν
  choice: поскольку был день приготовления
  rationale: παρασκευή обозначает день приготовления к субботе. Описательный перевод понятен современному читателю и не требует знания специального календарного термина.
- source_word: ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ
  choice: чтобы тела не оставались на кресте в субботу
  rationale: Конструкция ἵνα с сослагательным наклонением выражает цель. Единственное число τοῦ σταυροῦ сохранено как собирательное обозначение креста/казни, без добавления отсутствующего в греческом множественного числа.
- source_word: ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου
  choice: ведь та суббота была великим днём
  rationale: μεγάλη передано словом «великим», что сохраняет формулировку источника и мысль об особой значимости этой субботы, не заменяя её конфессионально окрашенным выражением.
- source_word: ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη
  choice: чтобы им перебили голени
  rationale: κατάγνυμι означает «ломать, перебивать»; σκέλη — ноги или голени. «Перебили голени» точно описывает действие и естественно звучит по-русски, сохраняя пассивную конструкцию.
- source_word: καὶ ἀρθῶσιν
  choice: и сняли их
  rationale: αἴρω имеет диапазон значений «поднимать, убирать, уносить». В данном контексте речь идёт о снятии распятых тел; краткое «сняли их» естественно передаёт контекст, а более широкая возможность «убрали» отмечена в сноске.
theological_decisions:
- issue: Референт Ἰουδαῖοι в повествовании Иоанна
  choice: Иудеи
  alternative: иудейские начальники / власти
  rationale: У Иоанна слово может иметь более узкий контекстуальный референт, однако сам стих не называет только начальников. Основной текст сохраняет лексическую широту, а сноска предупреждает против необоснованного распространения действия на весь народ.
- issue: Значение μεγάλη применительно к этой субботе
  choice: та суббота была великим днём
  alternative: это была особо важная суббота / великий день
  rationale: Формулировка сохраняет необычную выразительность греческого текста и указание на особый статус дня, не объясняя в самом переводе, в чём именно состояла его значимость.
translation_notes:
  register: Современный литературный русский язык, сдержанный и повествовательно ясный. Синтаксис сохраняет причинно-целевую структуру греческого стиха, но избегает тяжеловесной буквальности. Термин «голени» выбран как точный и общепонятный; «великим днём» сохраняет торжественную, но не архаическую окраску источника.
