  yaml_path: translation/nt/john/019/001.yaml
  text: Then Pilate took Jesus and flogged him[a].
translation:
  language: ru
  text: Тогда Пилат взял Иисуса и бичевал его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с более явным указанием на действие по приказу: «Тогда Пилат взял Иисуса и велел бичевать его».'
    reason: Альтернативная передача возможной делегированной каузации при сохранении Пилата как ответственного действующего лица.
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Временное наречие обозначает следующий этап повествования; «тогда» естественно и кратко передаёт последовательность событий.
- source_word: οὖν
  choice: не выражено отдельным словом
  rationale: Частица отмечает логико-повествовательное продвижение; в русском её значение уже передаётся словом «тогда», а дополнительное «итак» сделало бы фразу тяжеловесной.
- source_word: ἔλαβεν
  choice: взял
  rationale: Прямой и нейтральный эквивалент λαμβάνω, не усиливающий действие до «схватил» и не уточняющий делегированную каузацию.
- source_word: ὁ Πιλᾶτος
  choice: Пилат
  rationale: Устоявшаяся русская форма имени; референт уже известен из контекста.
- source_word: τὸν Ἰησοῦν
  choice: Иисуса
  rationale: Устоявшаяся русская форма имени в винительном падеже как прямого дополнения.
- source_word: ἐμαστίγωσεν
  choice: бичевал Его
  rationale: «Бичевал» точно передаёт избиение бичом и сохраняет серьёзность действия; местоимение естественно восполняет объект второго глагола.
theological_decisions:
- issue: Совершил ли Пилат бичевание лично или распорядился совершить его
  choice: 'Сохранить Пилата грамматическим субъектом обоих глаголов: «взял… и бичевал»'
  alternative: «Пилат взял Иисуса и велел бичевать Его»
  rationale: Греческий текст делает Пилата субъектом обоих глаголов, но такая конструкция может описывать действие, совершённое по его власти. Основной текст сохраняет форму оригинала и не навязывает исторического уточнения; сноска указывает естественное каузативное понимание.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. «Бичевал» несколько книжное, но общеупотребительное в данном историческом контексте и точнее нейтрального «бил плетью».
