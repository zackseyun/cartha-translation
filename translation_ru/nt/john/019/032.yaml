  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: воины ломают голени сначала одному распятому, затем другому; «вместе с Ним» в данном контексте естественно относится к Иисусу. Однако «а затем» несколько сильнее маркирует временную последовательность, чем греческая сочинительная конструкция μὲν ... καὶ, а дательный в сочетании «перебили голени первому» менее естественен в современном литературном русском, чем конструкция с «у».'
  naturalness: «Перебили голени» точно, но анатомически специально; сочетание «перебили голени у первого и у другого» звучит естественнее и сохраняет конкретность греческого σκέλη. Устранение «а затем» делает фразу более ровной и ближе к исходному параллелизму.
  terminology: «Воины» уместно для στρατιῶται. «Голени» допустимо и точно для σκέλη в данном контексте. Прописное «Ним» возможно как редакционное русское оформление при ясном референте, а не как переводческое добавление.
  issues:
