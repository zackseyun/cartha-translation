  text: So the soldiers came and broke the legs of the first man[b][a], and of the other who had been crucified with him.
translation:
  language: ru
  text: Тогда воины подошли и перебили голени у первого и у другого, распятого вместе с Ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Тогда
  rationale: Передаёт переход и последовательность повествования, обусловленную распоряжением из предыдущего стиха, естественно для современного русского языка.
- source_word: οἱ στρατιῶται
  choice: воины
  rationale: Обычное и уместное в библейском повествовании обозначение римских военнослужащих.
- source_word: τοῦ μὲν πρώτου
  choice: первому
  rationale: В русском языке личный референт ясен из контекста; добавлять слово «человеку» нет необходимости.
- source_word: κατέαξαν τὰ σκέλη
  choice: перебили голени
  rationale: Глагол обозначает ломание, а σκέλη здесь — нижние части ног; устойчивое русское выражение «перебить голени» точно передаёт действие в контексте казни.
- source_word: τοῦ ἄλλου
  choice: другому
  rationale: Сохраняет лаконичное противопоставление греческого «первому… другому».
- source_word: τοῦ συσταυρωθέντος αὐτῷ
  choice: распятому вместе с Ним
  rationale: Причастная конструкция естественно передана по-русски; «вместе с» выражает совместность действия, а местоимение относится к Иисусу.
theological_decisions:
- issue: Референт αὐτῷ
  choice: «с Ним» — с Иисусом
  alternative: с первым распятым
  rationale: В контексте сцены двое распятых определяются через отношение к Иисусу; Он остаётся центральным и наиболее естественным референтом местоимения. Прописная буква следует принятой русской издательской традиции для местоимения, относящегося ко Христу.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Конструкция «первому, а затем и другому» делает последовательность действий ясной, не вводя отсутствующего в греческом существительного.
