    issue: 'Не вполне естественное управление: «перебили голени первому, ... другому».'
    rationale: В современном русском при обозначении части тела и её обладателя естественнее «перебили голени у первого ... у другого».
  - severity: low
    issue: Добавленное «а затем» излишне усиливает временную последовательность.
    rationale: Греческое μὲν ... καὶ перечисляет двух лиц в порядке упоминания, но не требует отдельного наречия «затем».
  revised_text: Тогда воины подошли и перебили голени у первого и у другого, распятого вместе с Ним.
