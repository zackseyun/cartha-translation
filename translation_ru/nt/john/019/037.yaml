  text: And again another Scripture says[a], “They will look on the one whom they pierced.”
translation:
  language: ru
  text: 'И ещё другое место Писания говорит: «Они посмотрят на того[a], кого пронзили».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «обратят взгляд к тому, кого пронзили». Греческая конструкция допускает передачу как взгляда на кого-либо, так и направленности взгляда к нему; эти слова перекликаются с Захарией 12:10.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: ещё
  rationale: Вводит дополнительное свидетельство Писания; в сочетании «и ещё» естественно передаёт добавочный характер цитаты.
- source_word: ἑτέρα γραφή
  choice: другое место Писания
  rationale: По-русски так естественнее, чем буквальное «другое Писание», при этом сохраняется смысл ещё одного библейского свидетельства.
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время сохраняет характерную формулу цитирования Писания и представляет его слово как продолжающее звучать.
- source_word: Ὄψονται
  choice: они посмотрят
  rationale: Будущее время и направленность взгляда переданы современным, ясным глаголом без архаизации.
- source_word: εἰς ὃν
  choice: на того, кого
  rationale: Предлог εἰς после глагола зрения выражает направленность взгляда; «на того, кого» естественно обозначает личный объект, сохраняя возможный оттенок обращения к нему в сноске.
- source_word: ἐξεκέντησαν
  choice: пронзили
  rationale: Точно передаёт совершённое действие и соответствует как ближайшему контексту распятия, так и отсылке к Захарии 12:10.
theological_decisions:
- issue: Передача отсылки к Захарии 12:10 без внесения отсутствующей у Иоанна формулировки от первого лица
  choice: «Они посмотрят на того, кого пронзили»
  alternative: «Они посмотрят на Меня, Которого пронзили»
  rationale: Перевод следует непосредственно греческому тексту Иоанна, где стоит относительная конструкция «на того, кого», и не подставляет формулировку еврейского текста Захарии; связь пронзённого с Иисусом остаётся ясной из контекста.
- issue: Направленность взгляда в конструкции ὄψονται εἰς
  choice: «посмотрят на» с примечанием об альтернативе
  alternative: «обратят взгляд к»
  rationale: Основной вариант наиболее естественен по-русски, а примечание сохраняет подлинную смысловую возможность направленного обращения к пронзённому, не превращая её в однозначное толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формула «другое место Писания говорит» сохраняет олицетворённый оборот оригинала, оставаясь понятной современному читателю. Местоимения, относящиеся к Иисусу, не выделены прописными буквами, поскольку такого различия нет в исходном греческом тексте.
