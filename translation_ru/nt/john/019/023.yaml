source:
  edition: SBLGNT
  text: οἱ οὖν στρατιῶται ὅτε ἐσταύρωσαν τὸν Ἰησοῦν ἔλαβον τὰ ἱμάτια αὐτοῦ καὶ ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος, καὶ τὸν χιτῶνα. ἦν δὲ ὁ χιτὼν ἄραφος, ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/023.yaml
  text: So when the soldiers had crucified Jesus[a], they took his outer garments and made four parts, a part for each soldier, and also the tunic. Now the tunic was seamless[c][b], woven from the top throughout.
translation:
  language: ru
  text: Итак, когда воины распяли Иисуса, они взяли Его верхние одежды[a] и разделили их на четыре части — каждому воину по части, — а также хитон. Хитон же был бесшовным[b], весь вытканным сверху[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его одежды». Греческое слово может обозначать одежду вообще, но здесь, вероятно, имеются в виду верхние одежды в отличие от отдельно упомянутого хитона.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «несшитым», то есть не имевшим швов.'
    reason: lexical_clarification
  - marker: c
    text: 'Или: «вытканным от верхней части по всей длине». Вероятно, речь о том, что хитон был соткан сверху вниз как единое полотно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν στρατιῶται
  choice: Итак, … воины
  rationale: οὖν продолжает повествование и связывает действие с предыдущим контекстом; «итак» передаёт эту связь без чрезмерного логического нажима. στρατιῶται естественно передано как «воины».
- source_word: ὅτε ἐσταύρωσαν τὸν Ἰησοῦν
  choice: когда воины распяли Иисуса
  rationale: Аорист с ὅτε обозначает действие, предшествующее последующему разделу одежды. В русском языке последовательность естественно ясна без формы давнопрошедшего времени.
- source_word: ἔλαβον τὰ ἱμάτια αὐτοῦ
  choice: они взяли Его верхние одежды
  rationale: ἱμάτια может обозначать одежду вообще, но здесь противопоставлено отдельно названному χιτών; поэтому «верхние одежды» ясно сохраняет различие.
- source_word: ἐποίησαν τέσσαρα μέρη
  choice: разделили их на четыре части
  rationale: Буквально выражение значит «сделали четыре части»; русский глагол «разделили» естественно и точно выражает действие.
- source_word: ἑκάστῳ στρατιώτῃ μέρος
  choice: каждому воину по части
  rationale: Краткая русская конструкция точно передаёт распределительное значение дательного оборота.
- source_word: καὶ τὸν χιτῶνα
  choice: а также хитон
  rationale: «Хитон» сохраняет название нательной одежды древнего мира, а «также» показывает, что он назван отдельно от верхних одежд.
- source_word: ἦν δὲ ὁ χιτὼν ἄραφος
  choice: Хитон же был бесшовным
  rationale: δέ здесь служит мягким переходом с оттенком пояснения; частица «же» передаёт его естественно. ἄραφος означает «несшитый, не имеющий швов».
- source_word: ἐκ τῶν ἄνωθεν
  choice: от самого верха
  rationale: В описании изготовления одежды ἄνωθεν вероятнее всего указывает на верхнюю часть изделия; примечание сохраняет более буквальное «сверху».
- source_word: ὑφαντὸς δι’ ὅλου
  choice: целиком вытканным
  rationale: ὑφαντός означает «вытканный», а δι’ ὅλου — по всей протяжённости, целиком. Формулировка описывает цельность изготовления, не добавляя символического смысла.
theological_decisions:
- issue: Возможное символическое истолкование бесшовного хитона Иисуса
  choice: Передать только фактическое описание одежды и действий воинов.
  alternative: Увидеть здесь указание на священническое облачение или символ единства Церкви.
  rationale: Сам стих прямо говорит лишь об устройстве хитона и разделе одежды. Возможная символика не должна вноситься в перевод как утверждение текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для широкого читателя; термин «хитон» сохранён как точное и привычное в библейском контексте название одежды. Формулировка не приписывает детали о хитоне какой-либо богословской символики.
