source:
  edition: SBLGNT
  text: Ὁ οὖν Πιλᾶτος ἀκούσας ⸂τῶν λόγων τούτων⸃ ἤγαγεν ἔξω τὸν Ἰησοῦν, καὶ ἐκάθισεν ⸀ἐπὶ βήματος εἰς τόπον λεγόμενον Λιθόστρωτον, Ἑβραϊστὶ δὲ Γαββαθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/013.yaml
  text: So when Pilate heard these words[a], he brought Jesus outside and sat down on the judgment seat at a place called the Stone Pavement, and in Hebrew[b], Gabbatha.
translation:
  language: ru
  text: Итак, услышав эти слова, Пилат вывел Иисуса и сел на судейское место[a] на месте, называемом Каменный Помост, а по-еврейски[b] — Гаввафа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и посадил Его на судейское место». Греческий глагол допускает переходное значение, хотя вероятнее, что здесь сам Пилат сел на судейское место.'
    reason: alternative_reading
  - marker: b
    text: Выражение «по-еврейски», вероятно, обозначает местный семитский язык — скорее всего, арамейский, как и в других местах у Иоанна.
    reason: cultural_note
lexical_decisions:
- source_word: οὖν
  choice: Итак
  rationale: Передаёт логическое и повествовательное продолжение предыдущего обмена репликами.
- source_word: ἀκούσας τῶν λόγων τούτων
  choice: услышав эти слова
  rationale: Деепричастный оборот естественно передаёт предшествующее обстоятельство; «слова» указывает на только что произнесённые высказывания.
- source_word: ἤγαγεν ἔξω τὸν Ἰησοῦν
  choice: вывел Иисуса
  rationale: Кратко и естественно передаёт движение наружу, выраженное ἄγω и ἔξω.
- source_word: ἐκάθισεν ἐπὶ βήματος
  choice: сел на судейское место
  rationale: В судебном контексте βῆμα означает официальное место судьи; наиболее вероятный субъект глагола — Пилат.
- source_word: εἰς τόπον λεγόμενον Λιθόστρωτον
  choice: там, где было место, называемое Каменным помостом
  rationale: Передаёт место, к которому направились и где затем сел Пилат; переводное название отражает прозрачное значение Λιθόστρωτον.
- source_word: Ἑβραϊστὶ δὲ Γαββαθα
  choice: а по-еврейски — Гаввафа
  rationale: Сохраняет буквальное обозначение языка у Иоанна и транслитерирует местное название; δέ передано лёгким присоединительным «а».
theological_decisions:
- issue: Субъект и переходность ἐκάθισεν
  choice: Пилат сел на судейское место
  alternative: Пилат посадил Иисуса на судейское место
  rationale: Форма допускает переходное понимание, однако судебный контекст и наиболее естественный синтаксический разбор указывают на Пилата, занявшего судейское место. Реальная и значимая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-сдержанный. Юридический смысл βῆμα передан понятным выражением «судейское место»; неоднозначность ἐκάθισεν и языковая особенность Ἑβραϊστί вынесены в сноски.
