base_translation:
  language: en
  yaml_path: translation/nt/john/019/029.yaml
  text: A container full of sour wine was lying there[b][a]; so they put a sponge full of the sour wine on hyssop and brought it to his mouth.
translation:
  language: ru
  text: Там находился сосуд, полный кислого вина[a]. Тогда они прикрепили к иссопу[b] губку, пропитанную кислым вином, и поднесли её к его рту.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уксуса». Греческое слово может означать кислое вино или уксус; здесь, вероятно, имеется в виду дешёвое кислое винное питьё, обычное для воинов.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «насадили её на ветку иссопа» или «с помощью иссопа». В греческом тексте буквально сказано лишь «иссопом / на иссопе», поэтому точная картина действия неясна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεῦος
  choice: сосуд
  rationale: Общее обозначение вместилища; «сосуд» естественно для литературного библейского повествования и не уточняет его вид сверх греческого текста.
- source_word: ἔκειτο
  choice: стоял
  rationale: Глагол описывает нахождение предмета на месте. По-русски о сосуде естественно сказать «стоял», не подразумевая отдельного действия по его установке.
- source_word: ὄξους
  choice: кислое вино
  rationale: В данном контексте ὄξος, вероятно, обозначает дешёвое кислое винное питьё, а не только кулинарный уксус; лексическая альтернатива вынесена в сноску.
- source_word: μεστόν / μεστὸν
  choice: полный / пропитали
  rationale: Для сосуда сохранено прямое значение «полный». В сочетании с губкой естественное русское «пропитали губку» точно передаёт, что она была наполнена жидкостью, без тяжеловесного повтора.
- source_word: σπόγγον
  choice: губку
  rationale: Прямой и однозначный русский эквивалент.
- source_word: οὖν
  choice: тогда
  rationale: Передаёт повествовательное следствие и последовательность действий без чрезмерно логического оттенка слова «поэтому».
- source_word: ὑσσώπῳ
  choice: к иссопу
  rationale: Дательный падеж допускает значение средства или прикрепления. Формулировка сохраняет названное растение, но не добавляет отсутствующее в тексте слово «ветка».
- source_word: περιθέντες
  choice: прикрепили
  rationale: Причастие обозначает действие с губкой и иссопом, предшествующее поднесению. «Прикрепили» ясно передаёт физическую связь, оставляя точное устройство неопределённым.
- source_word: προσήνεγκαν
  choice: поднесли
  rationale: В данном физическом контексте глагол означает приблизить или поднести предмет; этот выбор естественнее русского «принесли к его рту».
- source_word: αὐτοῦ τῷ στόματι
  choice: к его рту
  rationale: Сохраняется местоименная форма оригинала и обычное русское управление глагола «поднести».
theological_decisions:
- issue: Историческая и культовая значимость ὑσσώπῳ
  choice: Сохранить «иссоп» в основном тексте без объяснения символики.
  alternative: Перевести как «ветка иссопа» либо заменить нейтральным «стеблем».
  rationale: Упоминание иссопа может вызывать ассоциации с Пасхой и очищением, однако сам стих не объясняет их. Сохранение названия растения удерживает возможный богословский подтекст, не навязывая его читателю.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Формулировки кратки и понятны; повтор слова «кислое» во второй части снят местоименным выражением «этим вином». Неопределённость конструкции с иссопом сохранена и пояснена в сноске.
