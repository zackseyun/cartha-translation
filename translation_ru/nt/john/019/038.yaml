  source_fidelity: 'В целом перевод точно передаёт последовательность событий, просьбу Иосифа, разрешение Пилата и последующее взятие тела. Однако «скрывавший это» несколько смещает κεκρυμμένος: страдательное причастие говорит, что Иосиф был скрытым (тайным) учеником, а не прямо о том, что он сам скрывал некое «это».'
