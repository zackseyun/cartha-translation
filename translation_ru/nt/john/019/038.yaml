source:
  edition: SBLGNT
  text: Μετὰ ⸀δὲ ταῦτα ἠρώτησεν τὸν Πιλᾶτον Ἰωσὴφ ⸀ἀπὸ Ἁριμαθαίας, ὢν μαθητὴς τοῦ Ἰησοῦ κεκρυμμένος δὲ διὰ τὸν φόβον τῶν Ἰουδαίων, ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ· καὶ ἐπέτρεψεν ὁ Πιλᾶτος. ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/038.yaml
  text: After these things[a], Joseph from Arimathea, being a disciple of Jesus but having kept it hidden because of fear of the Jews, asked Pilate that he might take away the body of Jesus. And Pilate gave permission. So he came and took away his body.
translation:
  language: ru
  text: После этого Иосиф из Аримафеи, тайный ученик Иисуса — из страха перед иудеями[a], — попросил Пилата позволить ему забрать тело Иисуса. Пилат разрешил. Тогда Иосиф пришёл и забрал Его тело.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В данном контексте речь, вероятно, прежде всего об иудейских властях, выступавших против Иисуса, а не обо всём еврейском народе без различия.
    reason: Пояснение контекстуального значения многозначного у Иоанна выражения τῶν Ἰουδαίων.
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: После этого
  rationale: Естественный современный русский переход, точно передающий временную последовательность; русский язык не требует буквального сохранения множественного числа ταῦτα.
- source_word: ἠρώτησεν
  choice: попросил
  rationale: В данном контексте глагол означает обращение к Пилату с просьбой, а не простой вопрос.
- source_word: ἀπὸ Ἁριμαθαίας
  choice: из Аримафеи
  rationale: Предлог ἀπό обозначает происхождение или место, откуда был Иосиф.
- source_word: ὢν μαθητὴς τοῦ Ἰησοῦ
  choice: ученик Иисуса
  rationale: Кратко и естественно передаёт причастную конструкцию и обычное значение μαθητής.
- source_word: κεκρυμμένος
  choice: скрывавший это
  rationale: Подразумеваемое дополнение — то, что Иосиф был учеником Иисуса; формулировка делает связь ясной, сохраняя длительное состояние сокрытия.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: из страха перед иудеями
  rationale: Идиоматичная и близкая к греческой конструкции передача причины.
- source_word: τῶν Ἰουδαίων
  choice: иудеями
  rationale: Основной текст сохраняет лексическую широту и напряжение оригинала, а примечание поясняет вероятную контекстуальную отнесённость.
- source_word: ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ
  choice: позволить ему забрать тело Иисуса
  rationale: Цель просьбы естественно выражена через подразумеваемое разрешение; «забрать» передаёт снятие и унесение тела для погребения.
- source_word: ἐπέτρεψεν
  choice: разрешил
  rationale: Точно и лаконично передаёт предоставление разрешения.
- source_word: ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα αὐτοῦ
  choice: Тогда Иосиф пришёл и забрал Его тело
  rationale: «Тогда» естественно передаёт последовательное οὖν; имя устраняет возможную неясность русского местоимения, а «Его» представляет αὐτοῦ.
theological_decisions:
- issue: Значение τῶν Ἰουδαίων в Евангелии от Иоанна
  choice: В основном тексте — «иудеи», с пояснительным примечанием о вероятном контекстуальном значении.
  alternative: «иудейские власти» или «иудейские вожди»
  rationale: Греческое выражение шире конкретного обозначения руководителей. Сохранение «иудеи» не устраняет подлинную неоднозначность, а примечание предупреждает ошибочное понимание как указания на весь еврейский народ без различия.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинный. Синтаксис сглажен ради естественности без устранения смысловой неоднозначности оригинала.
