  to: 'Тогда они сказали друг другу: «Не станем разрывать его, а бросим жребий: кому он достанется»[a]. Это было для того, чтобы исполнилось Писание, которое говорит: «Они разделили между собой мои одежды и за моё одеяние бросили жребий»[b]. Так солдаты и поступили.'
