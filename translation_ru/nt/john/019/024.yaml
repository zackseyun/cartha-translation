source:
  edition: SBLGNT
  text: εἶπαν οὖν πρὸς ἀλλήλους· Μὴ σχίσωμεν αὐτόν, ἀλλὰ λάχωμεν περὶ αὐτοῦ τίνος ἔσται· ἵνα ἡ γραφὴ πληρωθῇ ⸂ἡ λέγουσα⸃· Διεμερίσαντο τὰ ἱμάτιά μου ἑαυτοῖς καὶ ἐπὶ τὸν ἱματισμόν μου ἔβαλον κλῆρον. Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/024.yaml
  text: So they said to one another[a], “Let us not tear it, but cast lots for it to decide whose it will be,” so that the Scripture might be fulfilled that says, “They divided my garments among themselves[b], and for my clothing they cast a lot.” So the soldiers did these things.
translation:
  language: ru
  text: 'Тогда они сказали друг другу: «Не станем разрывать его, а бросим жребий: кому он достанется»[a]. Это было для того, чтобы исполнилось Писание, которое говорит: «Они разделили между собой мои одежды и за моё одеяние бросили жребий»[b]. Так солдаты и поступили.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разыграем его по жребию».'
    reason: lexical_alternative
  - marker: b
    text: Цитата из Псалма 21:19 (в иной нумерации — 22:18).
    reason: cross_reference
lexical_decisions:
- source_word: σχίσωμεν
  choice: не станем разрывать
  rationale: Глагол обозначает разрывание ткани; эта формулировка естественна в современном русском языке и сохраняет увещевательное значение формы первого лица множественного числа.
- source_word: αὐτόν
  choice: его
  rationale: Местоимение относится к упомянутому в предыдущем контексте хитону; в русском языке согласование с существительным мужского рода требует формы «его».
- source_word: λάχωμεν περὶ αὐτοῦ
  choice: бросим о нём жребий
  rationale: Передаёт древний способ определить владельца по жребию и сохраняет явное указание на предмет спора.
- source_word: τίνος ἔσται
  choice: кому он достанется
  rationale: Естественно выражает вопрос о том, кто станет владельцем хитона, не добавляя нового содержания.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: Это было для того, чтобы исполнилось Писание
  rationale: Сохраняет целевую формулу исполнения Писания и при этом делает синтаксическую связь ясной по-русски.
- source_word: ἡ λέγουσα
  choice: которое говорит
  rationale: Сохраняет персонифицированную формулу введения цитаты, обычную для библейской речи.
- source_word: Διεμερίσαντο τὰ ἱμάτιά μου ἑαυτοῖς
  choice: Они разделили между собой мои одежды
  rationale: Передаёт как действие разделения, так и распределительное значение возвратного местоимения.
- source_word: ἐπὶ τὸν ἱματισμόν μου ἔβαλον κλῆρον
  choice: об одеянии моём бросили жребий
  rationale: Сохраняет единственное число слова «жребий» и лексически отличает ἱματισμός от предшествующего ἱμάτια.
- source_word: Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν
  choice: Так солдаты и поступили
  rationale: Кратко и естественно передаёт итоговое указание на то, что именно солдаты совершили описанное.
theological_decisions:
- issue: Связь действий солдат с исполнением Писания в ἵνα ἡ γραφὴ πληρωθῇ
  choice: 'Сохранить прямую целевую формулу: «для того, чтобы исполнилось Писание».'
  alternative: 'Передать ἵνα как чистое следствие: «в результате чего исполнилось Писание».'
  rationale: Иоаннова формула связывает событие с исполнением Писания, но текст перевода не уточняет философский механизм соотношения Божьего замысла и человеческих действий.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром в цитате из Псалтири. «Солдаты» выбрано как ясное современное соответствие στρατιῶται; формы «одежды» и «одеяние» сохраняют лексическое различие греческой цитаты.
