  text: τότε οὖν παρέδωκεν αὐτὸν αὐτοῖς ἵνα σταυρωθῇ. Παρέλαβον ⸀οὖν τὸν ⸀Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/016.yaml
  text: Then he handed him over to them to be crucified[b][a]. So they took Jesus.
translation:
  language: ru
  text: Тогда он передал его им, чтобы его распяли.[a] И они взяли Иисуса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В этом стихе не уточняется, кого обозначают слова «им» и «они»; это определяется из контекста.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: Тогда
  rationale: В данном повествовательном переходе «тогда» естественно передаёт временную последовательность и обусловленность предыдущими событиями, не создавая тяжеловесного сочетания «тогда поэтому».
- source_word: παρέδωκεν
  choice: передал
  rationale: Глагол обозначает передачу человека во власть других; «передал» сохраняет этот смысл без добавления не выраженных в тексте юридических подробностей.
- source_word: αὐτὸν αὐτοῖς
  choice: его им
  rationale: Местоимения сохранены без замены именами или названиями групп, поскольку сам стих их прямо не называет.
- source_word: ἵνα σταυρωθῇ
  choice: чтобы его распяли
  rationale: Конструкция с «чтобы» сохраняет целевое значение ἵνα и естественно передаёт пассивный смысл греческой формы в современном русском языке.
- source_word: Παρέλαβον οὖν
  choice: И они взяли
  rationale: «Взяли» ясно передаёт принятие Иисуса под свою власть; начальное «и» естественно связывает действие со сказанным ранее, не перегружая русский текст повторным выводным союзом.
- source_word: Ἰησοῦν
  choice: Иисуса
  rationale: Употреблена традиционная и общепринятая русская форма имени.
theological_decisions:
- issue: Кого обозначают «им» и подразумеваемое подлежащее «они»
  choice: Сохранить в основном тексте неопределённые местоимения «им» и «они».
  alternative: 'Уточнить: «первосвященникам и служителям» либо «римским воинам».'
  rationale: Греческий текст этого стиха не называет группу прямо. Такое уточнение разрешило бы оставленную текстом референциальную неоднозначность на основании контекста.
translation_notes:
  register: Современный литературный русский язык; изложение краткое и повествовательное. Местоимения, относящиеся к Иисусу, даны со строчной буквы согласно нейтральной современной орфографической практике. Неопределённость участников сохранена.
