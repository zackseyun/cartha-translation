  yaml_path: translation/nt/john/019/005.yaml
  text: So Jesus came out[a], wearing the crown of thorns and the purple robe. And he says to them, “Behold, the man.”
translation:
  language: ru
  text: 'Тогда Иисус вышел в терновом венце и пурпурной одежде. Пилат говорит им: «Вот человек![a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Посмотрите: вот человек!» Греческое ἰδού — выражение, привлекающее внимание; его можно передать словами «вот», «посмотрите» или «смотрите».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν οὖν … ἔξω
  choice: Тогда … вышел
  rationale: Сочетание глагола движения с наречием подчёркивает выход наружу; по-русски это естественно передаётся глаголом «вышел» без избыточного «наружу». οὖν здесь продолжает повествование и указывает на следствие предшествующих действий, поэтому выбрано «тогда».
- source_word: φορῶν
  choice: в … венце и … одежде
  rationale: Причастие обозначает, что на Иисусе были эти предметы; русская предложная конструкция звучит естественнее буквального «нося».
- source_word: τὸν ἀκάνθινον στέφανον
  choice: в терновом венце
  rationale: Передаёт венец, сделанный из колючих ветвей, и сохраняет устойчивое, понятное русское выражение.
- source_word: τὸ πορφυροῦν ἱμάτιον
  choice: в пурпурной одежде
  rationale: ἱμάτιον обозначает одежду или верхнее одеяние без точного указания фасона; «одежда» не вносит лишней конкретизации, а «пурпурная» сохраняет насмешливую царскую символику.
- source_word: λέγει αὐτοῖς
  choice: Пилат говорит им
  rationale: Историческое настоящее сохранено ради живости повествования. Имя Пилата восстановлено из непосредственного контекста, поскольку русское «он» могло бы ошибочно указать на ближайшее названное лицо — Иисуса.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Русское «вот» естественно привлекает внимание к человеку, которого Пилат выводит перед собравшимися, и сохраняет торжественную краткость реплики.
- source_word: ὁ ἄνθρωπος
  choice: человек
  rationale: Фраза конкретно указывает на Иисуса, но не устраняет возможного более широкого смыслового отзвука слова ἄνθρωπος. Русское устойчивое выражение «Вот человек» передаёт артикль средствами контекста.
theological_decisions:
- issue: Возможный более широкий смысл выражения ὁ ἄνθρωπος
  choice: «Вот человек»
  alternative: «Вот этот человек» или «Вот мужчина»
  rationale: Выбранная формулировка непосредственно относится к Иисусу и одновременно не исключает заложенного в повествовании возможного представительного или иронического оттенка. Указательное «этот» сузило бы фразу, а «мужчина» было бы лексически и стилистически неуместно.
- issue: Кто произносит реплику λέγει αὐτοῖς
  choice: Пилат говорит им
  alternative: «Он говорит им»
  rationale: Предыдущий контекст называет Пилата говорящим и выводящим Иисуса; явное имя предотвращает ложное отнесение реплики к Иисусу, не изменяя смысла сцены.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной репликой. Избегаются архаичные «се» и «багряница», а также чрезмерно конкретное название вида одежды. Историческое настоящее «говорит» сохраняет повествовательную живость Иоанна.
