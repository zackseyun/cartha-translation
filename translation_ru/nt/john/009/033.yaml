  verdict: approve
  source_fidelity: Текст точно передаёт условную конструкцию εἰ μὴ ἦν, личную отсылку οὗτος, выражение источника παρὰ θεοῦ и итоговую невозможность οὐκ ἠδύνατο ποιεῖν οὐδέν. Русское сослагательное наклонение («Если бы… не мог бы») адекватно воспроизводит контрфактический характер высказывания. «Делать ничего» сохраняет широкое ποιεῖν, не сужая его до чудес.
  naturalness: 'Фраза звучит естественно в современном литературном русском: «Если бы Он был не от Бога, то не мог бы делать ничего». Порядок слов и частица «то» делают логическое следствие ясным. Возможен вариант «не был от Бога», но основной вариант грамматически нормативен и смыслово прозрачен.'
  terminology: «От Бога» — точное и традиционно понятное соответствие παρὰ θεοῦ; оно не навязывает более узкие толкования («послан», «уполномочен»). Заглавное «Он» уместно в данном библейском регистре и не меняет смысла. Сноска корректно отмечает допустимый русский вариант порядка отрицания, не выдавая его за иной греческий смысл.
