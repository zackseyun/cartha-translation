id: JHN.9.33
reference: John 9:33
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ μὴ ἦν οὗτος παρὰ θεοῦ, οὐκ ἠδύνατο ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/033.yaml
  text: If this man were not from God[a], he could do nothing.
translation:
  language: ru
  text: Если бы Он был не от Бога[a], то не мог бы делать ничего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если бы Он не был от Бога».'
    reason: В русском языке возможен иной порядок слов, яснее связывающий отрицание с глаголом; основной текст выделяет сочетание «не от Бога» как сказуемую характеристику.
lexical_decisions:
- source_word: εἰ μὴ
  choice: если бы… не
  rationale: В сочетании с имперфектом передаёт условие, представленное как противоречащее действительности; раздельная конструкция естественна по-русски и сохраняет условную форму.
- source_word: ἦν
  choice: был бы
  rationale: Русское сослагательное наклонение естественно передаёт нереальный характер условия, выраженный греческим имперфектом в данной конструкции.
- source_word: οὗτος
  choice: Он
  rationale: В контексте речь идёт об Иисусе; местоимение звучит естественно и не добавляет пренебрежительного оттенка, возможного у выражения «этот человек».
- source_word: παρὰ θεοῦ
  choice: от Бога
  rationale: παρά с родительным падежом обозначает источник или происхождение; перевод не сужает смысл до «послан Богом» или «уполномочен Богом».
- source_word: οὐκ ἠδύνατο
  choice: не мог бы
  rationale: Передаёт невозможность в рамках нереального условного высказывания и согласуется с русской конструкцией «если бы… то…».
- source_word: ποιεῖν
  choice: делать
  rationale: Сохраняет широкий смысл ποιέω; контекст указывает на совершаемые Иисусом дела, не требуя добавления слова «чудеса».
- source_word: οὐδέν
  choice: ничего
  rationale: В сочетании с отрицанием естественно и выразительно передаёт полную невозможность что-либо совершить.
theological_decisions:
- issue: Смысл выражения «от Бога» применительно к Иисусу
  choice: Сохранить широкое выражение «от Бога».
  alternative: «послан Богом» или «уполномочен Богом»
  rationale: Греческое выражение указывает на источник или происхождение, но само по себе не уточняет характер посланничества, полномочий или онтологического отношения; перевод сохраняет эту богословскую ёмкость.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Заглавное «Он» отражает принятую в русской библейской традиции форму уважительного обозначения Иисуса. Конструкция «если бы… то…» естественно передаёт нереальное условие.
