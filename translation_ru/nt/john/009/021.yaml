base_translation:
  language: en
  yaml_path: translation/nt/john/009/021.yaml
  text: But how he now sees[a], we do not know; or who opened his eyes, we do not know. Ask him; he is of age. He will speak for himself.
translation:
  language: ru
  text: 'Но как он теперь видит, мы не знаем; а кто открыл ему глаза, мы тоже не знаем. Спросите его: он уже взрослый. Он сам скажет о себе[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он сам может говорить о себе». Будущее время греческого глагола может практически указывать на то, что он способен отвечать сам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δὲ νῦν βλέπει
  choice: Но как он теперь видит
  rationale: Сохраняет вопрос о том, каким образом прежде слепой теперь видит; δέ передано лёгким противопоставлением «но», а настоящее время βλέπει — формой «видит».
- source_word: οὐκ οἴδαμεν
  choice: мы не знаем / мы тоже не знаем
  rationale: Повтор глагола знания сохранён. Во втором случае «тоже» естественно связывает два заявления родителей о своём незнании.
- source_word: ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμούς
  choice: а кто открыл ему глаза
  rationale: В русском косвенном вопросе «а кто» естественно вводит второй предмет расспроса; образное выражение «открыл ему глаза» сохраняет лексику повествования о прозрении.
- source_word: αὐτὸν ἐρωτήσατε
  choice: Спросите его самого
  rationale: Передаёт повелительное наклонение и подчёркнутое указание на сына как на непосредственного свидетеля.
- source_word: ἡλικίαν ἔχει
  choice: он уже взрослый
  rationale: В данном контексте оборот означает, что человек достиг возраста, позволяющего самостоятельно отвечать на вопросы. Современное «уже взрослый» яснее и естественнее буквального «имеет возраст».
- source_word: αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: Он сам за себя ответит[a]
  rationale: Эмфатическое αὐτός и возвратный оборот переданы словами «сам за себя»; будущее λαλήσει сохранено формой «ответит». Контекст допроса делает «ответит» естественным эквивалентом речи от собственного имени, не устраняя возможного оттенка способности отвечать.
theological_decisions:
- issue: Значение ἡλικίαν ἔχει
  choice: Достиг возраста, в котором может самостоятельно отвечать
  alternative: Вообще достиг зрелости; имеет достаточный рост
  rationale: Родители направляют спрашивающих к сыну как к самостоятельному свидетелю. Контекст указывает на возрастную и социальную зрелость, а не на физический рост.
- issue: Смысл αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: Сам ответит за себя
  alternative: Сам будет говорить о себе; сам может отвечать за себя
  rationale: Фраза звучит в обстановке расспроса и подчёркивает самостоятельное свидетельство исцелённого. Будущее время сохранено в основном тексте, а практический оттенок способности отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; речь прямая, сдержанная и понятная. Сохранён повтор заявления о незнании и подчёркнута самостоятельность взрослого сына без излишней юридической терминологии.
