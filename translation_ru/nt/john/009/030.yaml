source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς· Ἐν ⸂τούτῳ γὰρ τὸ⸃ θαυμαστόν ἐστιν ὅτι ὑμεῖς οὐκ οἴδατε πόθεν ἐστίν, καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/030.yaml
  text: 'The man answered and said to them[a], “This is the remarkable thing: you do not know where he is from[b], and yet he opened my eyes.”'
translation:
  language: ru
  text: 'Человек ответил им: «Вот что удивительно[a]: вы не знаете, откуда он[b], а ведь он открыл мне глаза».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поразительно».'
    reason: Лексическая альтернатива для θαυμαστόν, которое может обозначать как удивительное, так и поражающее воображение обстоятельство.
  - marker: b
    text: 'Или: «откуда он родом».'
    reason: Более развёрнутая передача πόθεν ἐστίν как указания на происхождение.
lexical_decisions:
- source_word: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς
  choice: Человек ответил им
  rationale: По-русски глагол «ответил» естественно передаёт формулу ответа; буквальное удвоение «ответил и сказал» здесь было бы тяжеловесным. «Человек» сохраняет обозначение ὁ ἄνθρωπος и связь с исцелённым слепым без пояснительного добавления.
- source_word: Ἐν τούτῳ γὰρ τὸ θαυμαστόν ἐστιν
  choice: Вот что удивительно
  rationale: Оборот естественно передаёт указание на обсуждаемое обстоятельство и оценочное θαυμαστόν. Пояснительная функция γάρ выражена всей конструкцией и последующим двоеточием.
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: вы не знаете
  rationale: Сохраняется явно выраженное и потому акцентированное местоимение ὑμεῖς; οἴδατε обозначает знание, а не понимание.
- source_word: πόθεν ἐστίν
  choice: откуда он
  rationale: Краткий естественный русский оборот сохраняет вопрос о происхождении Иисуса, не уточняя его характер.
- source_word: καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς
  choice: а ведь он открыл мне глаза
  rationale: '«А ведь» естественно передаёт контрастно-ироническую силу καί в контексте: собеседники не знают происхождения Иисуса, хотя он совершил явное исцеление. Выражение «открыл мне глаза» сохраняет непосредственный физический смысл и возможный более широкий смысловой отзвук.'
theological_decisions:
- issue: Возможный переносный смысл выражения «открыл мне глаза» в контексте темы зрения и слепоты у Иоанна
  choice: Сохранить выражение «открыл мне глаза» без пояснения его как духовного просвещения
  alternative: Явно обозначить духовное прозрение
  rationale: Непосредственно речь идёт о физическом исцелении. Формулировка позволяет читателю уловить более широкий богословский смысл из контекста, не навязывая его в самом переводе.
- issue: Характер происхождения Иисуса в словах πόθεν ἐστίν
  choice: Оставить общее «откуда он»
  alternative: Уточнить как земное место происхождения или небесное происхождение
  rationale: Греческий текст не разрешает здесь намеренно значимую для Евангелия неоднозначность; перевод не должен преждевременно её снимать.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Иронический контраст передан частицей «ведь», без разговорной резкости. Местоимение «он» написано со строчной буквы в соответствии с обычной современной орфографией и без внесения конфессиональной типографской традиции.
