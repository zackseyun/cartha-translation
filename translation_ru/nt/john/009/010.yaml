  text: ἔλεγον οὖν αὐτῷ· ⸀Πῶς ἠνεῴχθησάν σου οἱ ὀφθαλμοί;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/010.yaml
  text: So they said to him[a], “How were your eyes opened?”
translation:
  language: ru
  text: 'Итак, они спрашивали его: «Как открылись твои глаза?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: спрашивали
  rationale: Имперфект передаёт продолжающуюся или повторную речь; в русском контексте прямая вопросительная реплика естественно вводится глаголом «спрашивали».
- source_word: οὖν
  choice: итак
  rationale: Сохраняет связующее и слегка выводное значение частицы, продолжая повествование.
- source_word: αὐτῷ
  choice: его
  rationale: При русском глаголе «спрашивать» адресат естественно оформляется винительным падежом, хотя в греческом при λέγω стоит дательный.
- source_word: Πῶς
  choice: как
  rationale: Прямо и естественно передаёт вопрос о способе или обстоятельствах произошедшего.
- source_word: ἠνεῴχθησάν
  choice: открылись
  rationale: Русская возвратная форма естественно передаёт греческий пассив, не называя действующего лица и не превращая глаза в активного деятеля.
- source_word: σου οἱ ὀφθαλμοί
  choice: твои глаза
  rationale: Естественная русская притяжательная конструкция; артикль отдельно не передаётся.
theological_decisions:
- issue: Неназванный деятель при открытии глаз
  choice: «открылись твои глаза» — деятель не назван
  alternative: «кто открыл тебе глаза»
  rationale: Греческий пассив не указывает прямо, кто совершил действие; перевод сохраняет эту неопределённость и не вносит дополнительного богословского уточнения.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная повествовательная фраза. Имперфект передан несовершенным видом «спрашивали», а греческий пассив — идиоматичной русской возвратной формой.
