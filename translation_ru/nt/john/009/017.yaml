  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: λέγουσιν ⸀οὖν τῷ τυφλῷ πάλιν· ⸂Τί σὺ⸃ λέγεις περὶ αὐτοῦ, ὅτι ἠνέῳξέν σου τοὺς ὀφθαλμούς; ὁ δὲ εἶπεν ὅτι Προφήτης ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/017.yaml
  text: So they said again to the blind man[a], “What do you say about him, since he opened your eyes?” And he said[c][b], “He is a prophet.”
translation:
  language: ru
  text: 'Тогда они снова спросили слепого: «А ты что скажешь о Нём, раз Он открыл тебе глаза?»[a] Он ответил: «Он — пророк».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «потому что Он открыл тебе глаза?» Греческий союз может прямо выражать причину; здесь «раз» передаёт основание вопроса.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также титульное прочтение: «Он — Пророк». Однако контекст допускает и обычное значение: «пророк».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Тогда
  rationale: Передаёт повествовательное продолжение и связь с предшествующим допросом; в современном русском здесь естественнее, чем формальное «итак» или «поэтому».
- source_word: τῷ τυφλῷ
  choice: слепого
  rationale: Субстантивированное прилагательное обозначает человека, которого собеседники продолжают называть по прежнему состоянию; вариант не добавляет отсутствующего в этой фразе уточнения «бывшего слепого».
- source_word: πάλιν
  choice: снова
  rationale: Сохраняет указание на повторный вопрос в ходе разбирательства.
- source_word: Τί σὺ λέγεις
  choice: А ты что скажешь
  rationale: Частица «а» вместе с явным местоимением «ты» естественно передаёт эмфазу греческого σὺ и противопоставляет мнение исцелённого мнению допрашивающих.
- source_word: περὶ αὐτοῦ
  choice: о Нём
  rationale: Обычная русская передача περί с родительным падежом в значении предмета высказывания.
- source_word: ὅτι
  choice: раз
  rationale: 'В данном вопросе вводит основание: его спрашивают об Иисусе ввиду того, что Он открыл ему глаза. «Раз» кратко и естественно выражает эту причинную связь.'
- source_word: ἠνέῳξέν σου τοὺς ὀφθαλμούς
  choice: Он открыл тебе глаза
  rationale: Прямо передаёт аорист как завершённое действие и сохраняет образную форму исходного выражения, ясную из контекста исцеления.
- source_word: Προφήτης
  choice: пророк
  rationale: Безартиклевое именное сказуемое естественно понимается как отнесение Иисуса к пророкам. Русская конструкция «Он — пророк» сохраняет краткость признания, не навязывая титульного значения.
theological_decisions:
- issue: Следует ли понимать Προφήτης как обычное наименование или как титул
  choice: «Он — пророк»
  alternative: «Он — Пророк»
  rationale: Контекст показывает развивающееся понимание исцелённым личности Иисуса и не требует определённого мессианского титула. Основной текст сохраняет обычное значение, а сноска отмечает возможное более титульное прочтение.
translation_notes:
  register: Современный литературный русский язык; реплика передана естественно для живого допроса, но с достоинством. Эмфаза явного σὺ выражена сочетанием «А ты». Заглавные местоимения в отношении Иисуса соответствуют принятому русскому библейскому регистру и не изменяют смысла исходного текста.
