  source_fidelity: Требуется небольшая правка. Греческое λελάληκεν с дательным Μωϋσεῖ означает, что Бог «говорил Моисею» / «обращался к Моисею». Вариант «говорил с Моисеем» возможен по-русски, но легче предполагает взаимную беседу и потому несколько менее точен. Повтор субъектного значения во второй части («мы не знаем») лучше явно сохранить, как и в греческом οὐκ οἴδαμεν.
