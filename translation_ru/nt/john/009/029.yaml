  text: ἡμεῖς οἴδαμεν ὅτι Μωϋσεῖ λελάληκεν ὁ θεός, τοῦτον δὲ οὐκ οἴδαμεν πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/029.yaml
  text: We know that God has spoken to Moses[a], but as for this man, we do not know where he is from.
translation:
  language: ru
  text: Мы знаем, что Бог говорил Моисею, а об этом человеке мы не знаем, откуда он.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμεῖς
  choice: мы
  rationale: Явно выраженное местоимение передаёт противопоставление позиции говорящих последующему «об этом человеке»; в русском оно звучит естественно без дополнительного усиления.
- source_word: οἴδαμεν
  choice: знаем
  rationale: Прямой и естественный эквивалент со значением знания или уверенности; повтор корня сохранён во второй части стиха.
- source_word: Μωϋσεῖ λελάληκεν ὁ θεός
  choice: Бог говорил с Моисеем
  rationale: Русская конструкция «говорить с кем-либо» естественно передаёт адресата речи. Перфект обозначает состоявшийся факт, сохраняющий значение для говорящих; в современном русском это без искусственности выражается прошедшим временем.
- source_word: τοῦτον δὲ
  choice: а об этом человеке
  rationale: Конструкция передаёт контраст и смену темы; «этот человек» сохраняет отчуждённый, несколько пренебрежительный тон, не усиливая его сверх текста.
- source_word: οὐκ οἴδαμεν
  choice: не знаем
  rationale: Сохраняется лексический повтор οἴδαμεν и лаконичная форма оригинала.
- source_word: πόθεν ἐστίν
  choice: откуда он
  rationale: Естественное русское выражение, сохраняющее открытым вопрос о происхождении, источнике и возможном авторитете Иисуса.
theological_decisions:
- issue: Смысл происхождения Иисуса в πόθεν ἐστίν
  choice: «откуда он» без пояснения
  alternative: «откуда он пришёл»; «каково его происхождение»
  rationale: 'Формулировка сохраняет характерную для Евангелия от Иоанна многозначность: речь может идти как об обычном происхождении, так и о более глубоком источнике и полномочиях Иисуса. Перевод не устраняет повествовательную и богословскую иронию.'
translation_notes:
  register: 'Современный литературный русский язык, сдержанный и достойный регистр. Синтаксис краток и близок к контрастной структуре греческого текста. Сноска не требуется: вариант «откуда он» сам сохраняет существенную многозначность.'
