  source_fidelity: 'Текст точно следует SBLGNT: ἡμᾶς δεῖ передано как «Нам нужно», а не как вариантное единственное число; «совершать дела Пославшего Меня» адекватно передаёт ἐργάζεσθαι τὰ ἔργα τοῦ πέμψαντός με. Временной образ сохранён: «пока день; наступает ночь». Формулировка «когда никто не сможет трудиться» естественно выражает невозможность действия с наступлением ночи и не меняет смысла греческого δύναται ἐργάζεσθαι.'
