source:
  edition: SBLGNT
  text: ⸀ἡμᾶς δεῖ ἐργάζεσθαι τὰ ἔργα τοῦ πέμψαντός με ἕως ἡμέρα ἐστίν· ἔρχεται νὺξ ὅτε οὐδεὶς δύναται ἐργάζεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/004.yaml
  text: We must do the works of the one who sent me while it is day; night is coming[a], when no one can work.
translation:
  language: ru
  text: Нам нужно совершать дела Пославшего Меня, пока день; наступает ночь[a], когда никто не сможет трудиться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «Мне нужно совершать дела Пославшего Меня».'
    reason: textual_variant
lexical_decisions:
- source_word: ἡμᾶς
  choice: Нам
  rationale: 'В тексте SBLGNT стоит винительный падеж первого лица множественного числа при безличном δεῖ: «нам нужно». Это сохраняет предпочтительное чтение «мы», не смешивая его с вариантом «Мне».'
- source_word: δεῖ
  choice: нужно
  rationale: Естественно передаёт необходимость и обязательность в современном русском языке.
- source_word: ἐργάζεσθαι τὰ ἔργα
  choice: совершать дела
  rationale: Позволяет избежать неестественного однокоренного сочетания «делать дела» и сохраняет связь с характерным для Иоанна понятием дел, порученных Иисусу.
- source_word: τοῦ πέμψαντός με
  choice: Пославшего Меня
  rationale: Субстантивированное причастие передано кратко и естественно; прописные буквы указывают на Бога как на подразумеваемого Пославшего согласно контексту, не добавляя имени в текст.
- source_word: ἕως ἡμέρα ἐστίν
  choice: пока день
  rationale: Передаёт временной предел доступной для деятельности поры и сохраняет образный контраст с наступающей ночью.
- source_word: ἔρχεται νὺξ
  choice: наступает ночь
  rationale: Естественная русская передача настоящего времени с оттенком приближения; выражение сохраняет образ неизбежно приходящей ночи.
- source_word: οὐδεὶς δύναται ἐργάζεσθαι
  choice: никто не сможет трудиться
  rationale: Будущее время естественно следует из русского придаточного с «когда» после «наступает» и передаёт невозможность деятельности в грядущую ночь.
theological_decisions:
- issue: 'Текстовый вариант в начале стиха: ἡμᾶς («нам/мы») или ἐμέ («Мне/Я»)'
  choice: Нам нужно совершать дела Пославшего Меня
  alternative: Мне нужно совершать дела Пославшего Меня
  rationale: Основной текст следует предоставленному SBLGNT с чтением ἡμᾶς. Широко засвидетельствованное единственное число сохранено в примечании, чтобы не скрывать значимый текстовый вариант.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified библейским звучанием. Сохранены метафорический контраст дня и ночи и неоднозначность того, что именно означает грядущая ночь. Местоимения, относящиеся к Иисусу и Богу, оформлены с прописной буквы в соответствии с принятой русской библейской традицией.
