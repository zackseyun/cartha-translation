base_translation:
  language: en
  yaml_path: translation/nt/john/009/020.yaml
  text: So his parents answered and said[a], “We know that this is our son and that he was born blind.
translation:
  language: ru
  text: 'Тогда его родители ответили: «Мы знаем, что это наш сын и что он родился слепым».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Тогда
  rationale: Передаёт повествовательное продолжение и связь с предшествующим допросом; в данном контексте звучит естественнее, чем более формальное «итак».
- source_word: γονεῖς
  choice: родители
  rationale: Точно и естественно обозначает отца и мать этого человека вместе.
- source_word: ἀπεκρίθησαν ... καὶ εἶπαν
  choice: ответили
  rationale: В русском сочетание «ответили и сказали» возможно, но здесь тяжеловесно; один глагол «ответили» естественно передаёт формулу введения прямой речи без потери смысла.
- source_word: Οἴδαμεν
  choice: Мы знаем
  rationale: Прямо передаёт выраженную родителями уверенность в устанавливаемых ими фактах.
- source_word: οὗτός ἐστιν ὁ υἱὸς ἡμῶν
  choice: это наш сын
  rationale: Естественная современная русская формулировка, сохраняющая указание и отождествление.
- source_word: τυφλὸς
  choice: слепым
  rationale: Творительный предикативный естественно описывает состояние сына при рождении.
- source_word: ἐγεννήθη
  choice: родился
  rationale: Обычный русский эквивалент пассивной формы γεννάω в контексте рождения.
- source_word: τυφλὸς ἐγεννήθη
  choice: родился слепым
  rationale: Прямо и идиоматично передаёт греческое выражение и не требует пояснительного варианта.
