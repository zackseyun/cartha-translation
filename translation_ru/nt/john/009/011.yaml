base_translation:
  language: en
  yaml_path: translation/nt/john/009/011.yaml
  text: He answered[a], “The man called Jesus made mud and spread it on my eyes, and he told me, ‘Go to Siloam and wash.’ So I went away and washed[c][b], and I received my sight.”
translation:
  language: ru
  text: 'Он ответил: «Человек по имени Иисус приготовил грязь[a], намазал мне глаза[b] и сказал: „Пойди в Силоам и умойся“. Тогда я пошёл, умылся и прозрел[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделал глину». Греческое слово может обозначать как глину, так и грязь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «помазал мне глаза». Греческий глагол означает «намазывать, наносить на поверхность»; слово «помазал» здесь не обязательно имеет обрядовый смысл.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «стал видеть». В рассказах об исцелении этот глагол означает обретение или возвращение зрения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος
  choice: Он ответил
  rationale: Естественная русская передача повествовательной формулы; отдельное указательное местоимение ἐκεῖνος в данном контексте не требует тяжеловесного «тот ответил».
- source_word: Ὁ ἄνθρωπος ὁ λεγόμενος Ἰησοῦς
  choice: Человек по имени Иисус
  rationale: Сохраняет простое обозначение Иисуса как человека и нынешний уровень понимания говорящего, не привнося более высокого исповедального титула.
- source_word: πηλὸν ἐποίησεν
  choice: развёл грязь
  rationale: Передаёт приготовление влажной массы из земли и слюны в ближайшем контексте. Русское «развёл грязь» естественнее буквального «сделал грязь»; возможное значение «глина» указано в сноске.
- source_word: ἐπέχρισέν μου τοὺς ὀφθαλμούς
  choice: намазал ею мне глаза
  rationale: Ясно передаёт физическое нанесение массы на глаза без возможных ритуальных ассоциаций слова «помазал».
- source_word: εἶπέν μοι ὅτι
  choice: сказал
  rationale: Адресат уже выражен формой повествования и последующей прямой речью; русское «сказал» звучит естественно, а смысл «сказал мне» очевиден из контекста.
- source_word: Ὕπαγε εἰς τὸν Σιλωὰμ
  choice: Пойди к Силоаму
  rationale: Кратко передаёт повеление движения и сохраняет название места без добавления слова «купальня», которого в этом стихе нет.
- source_word: νίψαι
  choice: умойся
  rationale: Средний залог и контекст омовения глаз естественно передаются русским возвратным глаголом «умойся».
- source_word: ἀπελθὼν οὖν καὶ νιψάμενος
  choice: Тогда я пошёл, умылся
  rationale: «Тогда» передаёт следственную связь οὖν, а последовательность личных глаголов естественна для русского рассказа.
- source_word: ἀνέβλεψα
  choice: прозрел
  rationale: В рассказе об исцелении слепого глагол означает обретение зрения, а не буквальное «посмотрел вверх»; «прозрел» кратко и точно выражает этот смысл.
theological_decisions:
- issue: Характеристика Иисуса говорящим
  choice: Человек по имени Иисус
  alternative: Человек, которого называют Иисусом
  rationale: 'Формулировка сохраняет ограниченное на данном этапе понимание исцелённого: он называет Иисуса человеком, не вкладывая в слова более позднее исповедание.'
- issue: Обретение или возвращение зрения
  choice: прозрел
  alternative: стал видеть / снова стал видеть
  rationale: Контекст сообщает о слепоте от рождения, поэтому перевод не утверждает, будто человек прежде видел. «Прозрел» допускает обретение зрения без такого предположения.
translation_notes:
  register: Современный литературный русский язык с ясной устной интонацией рассказа исцелённого. Архаизмы вроде «брение» и двусмысленно-ритуальное «помазал» оставлены только как возможные формальные соответствия в примечании. Формулировка не добавляет в этот стих слово «купальня», уже понятное из контекста.
