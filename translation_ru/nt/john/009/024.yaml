base_translation:
  language: en
  yaml_path: translation/nt/john/009/024.yaml
  text: So they called the man who had been blind a second time and said to him[a], “Give glory to God; we know that this man is a sinner.”
translation:
  language: ru
  text: 'Тогда они во второй раз позвали человека, который прежде был слеп, и сказали ему: «Воздай славу Богу[a]. Мы знаем, что этот человек — грешник».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно, это торжественный призыв: «Воздай Богу славу», то есть «Скажи правду перед Богом» или «Открыто признай правду перед Богом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφώνησαν
  choice: позвали
  rationale: Передаёт вызов исцелённого человека к собеседникам без излишне официального оттенка слова «призвали» или «вызвали».
- source_word: οὖν
  choice: тогда
  rationale: Естественно обозначает развитие повествования и связь с предшествующим разговором.
- source_word: ἐκ δευτέρου
  choice: во второй раз
  rationale: Точно и естественно передаёт значение греческого оборота.
- source_word: ὃς ἦν τυφλός
  choice: который прежде был слеп
  rationale: 'Уточнение «прежде» отражает контекст: человек уже исцелён, хотя греческий текст буквально говорит, что он «был слеп».'
- source_word: Δὸς δόξαν τῷ θεῷ
  choice: Воздай славу Богу
  rationale: Сохраняет буквальную богословски значимую форму выражения, а его вероятный смысл торжественного призыва говорить правду поясняется в сноске.
- source_word: ἡμεῖς οἴδαμεν
  choice: Мы знаем
  rationale: Сохраняет явное местоимение и подчёркнутую уверенность говорящих.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: этот человек
  rationale: Точно передаёт указательное выражение, не добавляя презрительного оттенка.
- source_word: ἁμαρτωλός
  choice: грешник
  rationale: Прямо передаёт обвинение, выраженное предикативным прилагательным.
theological_decisions:
- issue: Идиоматический смысл выражения Δὸς δόξαν τῷ θεῷ
  choice: Сохранить в основном тексте буквальное «Воздай славу Богу»
  alternative: 'Передать истолковательно: «Скажи правду перед Богом» или «Признайся перед Богом»'
  rationale: Выражение, вероятно, служит торжественным призывом говорить правду или открыто признаться (ср. Нав. 7:19), однако его буквальная форма связана с воздаянием славы Богу. Основной текст сохраняет эту форму, а возможный идиоматический смысл вынесен в сноску.
translation_notes:
  register: Современный литературный русский язык; повествование изложено ясно и естественно, при этом сохранены торжественность прямой речи и неоднозначность ключевого выражения.
