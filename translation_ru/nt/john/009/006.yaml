lexical_decisions:
- source_word: ταῦτα εἰπὼν
  choice: Сказав это
  rationale: Краткий деепричастный оборот естественно передаёт предшествующее действие аористного причастия и сохраняет связь с предыдущими словами Иисуса.
- source_word: ἔπτυσεν χαμαί
  choice: он плюнул на землю
  rationale: Прямо и естественно передаёт конкретное действие; χαμαί обозначает направление вниз, на землю.
- source_word: ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος
  choice: сделал из слюны грязь
  rationale: πηλός здесь обозначает влажную землю, смешанную со слюной; «грязь» понятнее и естественнее, чем более узкое «глина». Предлог «из» сохраняет значение ἐκ.
- source_word: ἐπέχρισεν
  choice: намазал
  rationale: В данном предметном контексте глагол означает нанесение или размазывание вещества. «Намазал» передаёт физическое действие без привнесения обрядового оттенка; вариант «помазал» отмечен в сноске.
- source_word: αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ὀφθαλμούς
  choice: ею глаза слепому
  rationale: Местоимение αὐτοῦ по контексту относится к слепому. Русская конструкция «намазал ею глаза слепому» естественна, ясно обозначает участника и сохраняет отсылку к уже упомянутой грязи.
theological_decisions:
- issue: Возможный обрядовый оттенок ἐπέχρισεν
  choice: В основном тексте употреблено конкретное «намазал».
  alternative: «помазал»
  rationale: Греческий глагол допускает значение «помазывать», однако сам стих описывает физическое нанесение грязи и не утверждает обрядового или сакраментального смысла. Более буквальный вариант сохранён в сноске, чтобы не устранять лексическую многозначность.
translation_notes:
  register: Современный литературный русский язык; изложение конкретное, ясное и сдержанное. Местоимение, относящееся к Иисусу, написано со строчной буквы согласно современным нормам повествовательного текста.
