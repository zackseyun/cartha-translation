  text: ἀπεκρίθη Ἰησοῦς· Οὔτε οὗτος ἥμαρτεν οὔτε οἱ γονεῖς αὐτοῦ, ἀλλ’ ἵνα φανερωθῇ τὰ ἔργα τοῦ θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/003.yaml
  text: Jesus answered[a], “Neither this man sinned, nor his parents[c][b], but so that the works of God might be revealed in him.”
translation:
  language: ru
  text: 'Иисус ответил: «Не согрешил ни этот человек, ни его родители. Это произошло[a] для того, чтобы в нём[b] стали явными дела Божьи».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «но чтобы в нём стали явными дела Божьи»; слова «это произошло» восполняют эллипсис по контексту и добавлены для естественности русской фразы.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в нём»; в данном контексте возможно также понимание «через него» или «на нём».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ответил
  rationale: Обычное и естественное повествовательное соответствие глаголу ἀποκρίνομαι в диалоге.
- source_word: Οὔτε ... οὔτε
  choice: не ... ни ... ни
  rationale: Русская конструкция естественно и недвусмысленно отрицает оба предложенных объяснения.
- source_word: οὗτος
  choice: этот человек
  rationale: Уточняет подразумеваемого мужчину, не добавляя сведений сверх контекста.
- source_word: ἥμαρτεν
  choice: согрешил
  rationale: Прямое и современное соответствие аористу ἁμαρτάνω.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: его родители
  rationale: Точное и естественное соответствие греческому выражению.
- source_word: ἀλλ’ ἵνα
  choice: Это произошло для того, чтобы
  rationale: В русском языке восполняет подразумеваемое обстоятельство и естественно передаёт целевую конструкцию с ἵνα; добавление отмечено сноской.
- source_word: φανερωθῇ
  choice: явились
  rationale: Передаёт пассивный смысл раскрытия или становления видимыми и сохраняет возвышенную, но понятную лексику Иоанна.
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: дела Бога
  rationale: Прямо сохраняет родительную конструкцию и ключевую для Евангелия от Иоанна лексику.
- source_word: ἐν αὐτῷ
  choice: на нём
  rationale: В данном контексте естественно по-русски обозначает человека как того, на ком будут явлены Божьи дела; возможные значения «в нём» и «через него» отмечены в сноске.
theological_decisions:
- issue: Отрицает ли Иисус всякую связь между грехом и страданием или только предложенные причины слепоты этого человека
  choice: Отрицание ограничено этим человеком и его родителями в рассматриваемом случае.
  alternative: Обобщающий пересказ, согласно которому страдание вообще никогда не связано с личным грехом или грехом родителей.
  rationale: Стих отвечает на конкретный вопрос учеников и не формулирует универсального правила обо всех страданиях.
- issue: Выражает ли ἵνα цель или только результат
  choice: 'Передать целевое значение: «для того, чтобы».'
  alternative: 'Передать только результат: «так что»; либо перестроить фразу, устранив указание на цель.'
  rationale: Конструкция ἵνα с сослагательным наклонением наиболее прямо допускает целевое прочтение; богословское напряжение текста не следует устранять пересказом.
- issue: Подразумевает ли ἐν αὐτῷ местонахождение, сферу проявления или посредничество
  choice: В основном тексте — «на нём».
  alternative: «в нём» или «через него».
  rationale: «На нём» естественно в русском контексте исцеления, но сноска сохраняет смысловую широту греческого предлога.
translation_notes:
  register: Современный литературный русский язык; фраза ясная и достойная по тону. Синтаксически трудная греческая эллиптическая конструкция восполнена в основном тексте и прозрачно отмечена сноской. Формулировка сохраняет целевое значение ἵνα и не расширяет конкретное отрицание Иисуса до общего учения обо всех страданиях.
