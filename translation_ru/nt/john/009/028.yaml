  terminology: «Ученик» последовательно и удачно передаёт μαθητής в обеих частях. «Моисей» — нормативная русская форма имени. «Того человека» допустимо передаёт возможную отчуждённость ἐκείνου; сноска правильно отмечает, что оттенок не является обязательным.
