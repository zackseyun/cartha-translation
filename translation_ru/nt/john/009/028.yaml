  text: ⸀ἐλοιδόρησαν αὐτὸν καὶ εἶπον· Σὺ ⸂μαθητὴς εἶ⸃ ἐκείνου, ἡμεῖς δὲ τοῦ Μωϋσέως ἐσμὲν μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/028.yaml
  text: They reviled him and said[a], “You are that man's disciple, but we are disciples of Moses.”
translation:
  language: ru
  text: 'Они осыпали его оскорблениями и сказали: «Ты — ученик того человека[a], а мы — ученики Моисея».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ты его ученик». В греческом тексте буквально: «того»; в данном контексте это может звучать пренебрежительно.'
    reason: Лексическая альтернатива и возможный прагматический оттенок указательного местоимения ἐκείνου.
lexical_decisions:
- source_word: ἐλοιδόρησαν
  choice: оскорбили
  rationale: Глагол обозначает брань и словесное унижение. «Оскорбили» естественно звучит по-русски и сохраняет враждебный характер речи, не добавляя отсутствующих в тексте подробностей.
- source_word: Σὺ μαθητὴς εἶ
  choice: Это ты ученик
  rationale: Начальное «ты» в греческом тексте эмфатично. Конструкция «это ты» естественно передаёт противопоставление и обвинительный тон.
- source_word: ἐκείνου
  choice: того человека
  rationale: Указательное местоимение создаёт дистанцию и в данном враждебном контексте может звучать пренебрежительно. «Того человека» передаёт этот оттенок естественнее, чем нейтральное «его».
- source_word: ἡμεῖς δὲ
  choice: а мы
  rationale: Передаёт контраст, выраженный δέ, и подчёркнутое местоимение ἡμεῖς.
- source_word: τοῦ Μωϋσέως ἐσμὲν μαθηταί
  choice: мы — ученики Моисея
  rationale: Сохраняет термин μαθητής и риторический контраст между принадлежностью к Иисусу и принадлежностью к Моисею; тире естественно подчёркивает именную часть сказуемого.
theological_decisions:
- issue: Оттенок ἐκείνου по отношению к Иисусу
  choice: того человека
  alternative: его; того
  rationale: Указательное местоимение допускает нейтральное понимание, однако контекст прямого оскорбления поддерживает дистанцированный, пренебрежительный оттенок. Этот оттенок передан без усиления до более грубого «того типа» или «того самого».
- issue: Последовательная передача μαθητής
  choice: ученик в обеих частях
  alternative: последователь; приверженец
  rationale: «Ученик» сохраняет единый термин и ясный параллелизм оригинала, при этом в контексте обозначает не только обучение, но и приверженность учителю.
translation_notes:
  register: Современный литературный русский язык. Реплика звучит резко и полемично, но без разговорной грубости; параллелизм «ты ученик… а мы — ученики…» сохранён.
