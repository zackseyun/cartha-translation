  text: πάλιν οὖν ἠρώτων αὐτὸν καὶ οἱ Φαρισαῖοι πῶς ἀνέβλεψεν. ὁ δὲ εἶπεν αὐτοῖς· Πηλὸν ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς, καὶ ἐνιψάμην, καὶ βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/015.yaml
  text: So the Pharisees also asked him again how he had received his sight[a]. He said to them, “He put mud on my eyes, and I washed[b], and I see.”
translation:
  language: ru
  text: 'Тогда фарисеи тоже снова стали расспрашивать его о том, как он прозрел. Он ответил им: «Он наложил мне на глаза глину[a], я умылся — и вижу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грязь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν οὖν
  choice: Тогда... снова
  rationale: Передаёт продолжение повествования и повторность расспросов, не придавая οὖν чрезмерно строгого логического значения.
- source_word: ἠρώτων
  choice: стали спрашивать
  rationale: Несовершенный вид передаёт разворачивающийся или повторяющийся расспрос; в сочетании со «снова» фраза естественна по-русски.
- source_word: καὶ οἱ Φαρισαῖοι
  choice: и фарисеи
  rationale: 'Сохраняет присоединительное значение καί: теперь его расспрашивали также фарисеи.'
- source_word: πῶς ἀνέβλεψεν
  choice: как он прозрел
  rationale: В контексте исцеления слепорождённого ἀναβλέπω означает обретение зрения; «прозрел» кратко и естественно выражает это по-русски.
- source_word: Πηλὸν
  choice: грязь
  rationale: πηλός обозначает мокрую землю, грязь или глину; «грязь» здесь понятно современному читателю и соответствует описанному веществу.
- source_word: ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς
  choice: наложил мне на глаза
  rationale: Точно передаёт помещение вещества на глаза и звучит естественно в данном контексте.
- source_word: ἐνιψάμην
  choice: я умылся
  rationale: Средний залог указывает на действие субъекта над собой; в контексте умывания после наложения грязи русское «умылся» передаёт это естественно.
- source_word: βλέπω
  choice: теперь вижу
  rationale: Настоящее время подчёркивает нынешний результат. «Теперь» эксплицирует результирующий оттенок, а «вижу» сохраняет живую непосредственность ответа.
