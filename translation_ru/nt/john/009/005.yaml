  text: ὅταν ἐν τῷ κόσμῳ ὦ, φῶς εἰμι τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/005.yaml
  text: While I am in the world, I am the light of the world.
translation:
  language: ru
  text: Пока Я в мире, Я — свет мира.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: Пока
  rationale: 'В данном контексте передаёт временной смысл: «пока / в то время как Я нахожусь в мире», не превращая оборот в повторяющееся «всякий раз, когда».'
- source_word: ἐν τῷ κόσμῳ ὦ
  choice: Я в мире
  rationale: Естественная русская передача греческого «Я нахожусь в мире»; связка «нахожусь» подразумевается и не нуждается в явном выражении.
- source_word: φῶς εἰμι τοῦ κόσμου
  choice: Я — свет миру
  rationale: Сохраняет образ и предикативное ударение оригинала. Дательный «миру» — естественная литературная формула со значением света, данного миру; возможна и более буквальная передача «свет мира».
theological_decisions:
- issue: Временное значение ὅταν в высказывании Иисуса
  choice: Пока Я в мире
  alternative: Когда Я в мире / Всякий раз, когда Я в мире
  rationale: Контекст указывает на продолжительность земного служения Иисуса, поэтому «пока» яснее передаёт временную рамку, не вводя идеи многократного пребывания в мире.
- issue: Образ «света мира»
  choice: Я — свет миру
  alternative: Я — свет мира
  rationale: Обе передачи допустимы; выбранная формулировка звучит естественно по-русски и сохраняет направленность миссии Иисуса к миру, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и общепонятная формулировка. Тире обозначает именную связку и смысловое ударение.
