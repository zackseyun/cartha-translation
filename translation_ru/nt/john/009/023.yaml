  text: διὰ τοῦτο οἱ γονεῖς αὐτοῦ εἶπαν ὅτι Ἡλικίαν ἔχει, αὐτὸν ⸀ἐπερωτήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/023.yaml
  text: For this reason his parents said[a], “He is of age; ask him.”
translation:
  language: ru
  text: 'Поэтому его родители сказали: «Он уже взрослый; спросите его самого»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он уже достаточно взрослый; спросите его».'
    reason: Лексическая альтернатива для Ἡλικίαν ἔχει; вариант без «самого» не передаёт эмфазу αὐτόν столь явно.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Кратко и естественно передаёт причинно-следственную связь с объяснением в предыдущем стихе.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: его родители
  rationale: Точно передаёт собирательное обозначение отца и матери.
- source_word: εἶπαν
  choice: сказали
  rationale: Соответствует обычному значению глагола речи, не добавляя оттенка ответа, которого сама форма не требует.
- source_word: Ἡλικίαν ἔχει
  choice: Он уже взрослый
  rationale: 'Естественно выражает контекстуальный смысл греческой идиомы: он достиг возраста, когда способен отвечать за себя.'
- source_word: αὐτὸν
  choice: его самого
  rationale: 'Частица «самого» передаёт эмфатическое положение местоимения: расспросить следует именно этого человека.'
- source_word: ἐπερωτήσατε
  choice: спросите
  rationale: Естественный современный эквивалент аористного повелительного наклонения; в данном контексте речь идёт об обращении с вопросом к нему.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; реплика краткая и естественная. «Уже взрослый» яснее для широкого читателя, чем формально-юридическое «совершеннолетний», которое могло бы внести современную правовую категорию. Эмфаза αὐτόν передана сочетанием «его самого».
