base_translation:
  language: en
  yaml_path: translation/nt/john/009/041.yaml
  text: Jesus said to them[a], “If you were blind, you would not have sin. But now you say, ‘We see,’ so your sin remains.”
translation:
  language: ru
  text: 'Иисус сказал им: «Если бы вы были слепы, то не имели бы греха[a]. Но теперь вы говорите: „Мы видим“, — и ваш грех остаётся».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то не были бы виновны». В греческом тексте буквально сказано «не имели бы греха»; здесь слово «грех» может включать значение виновности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοὶ
  choice: слепы
  rationale: Сохранено прямое значение слова и образ слепоты, проходящий через всю главу; духовный смысл не добавлен явно, поскольку он раскрывается контекстом.
- source_word: οὐκ ἂν εἴχετε
  choice: не имели бы
  rationale: Сочетание имперфекта с ἄν в условной конструкции передано естественной русской формой сослагательного наклонения.
- source_word: ἁμαρτίαν
  choice: греха
  rationale: Прямой эквивалент сохраняет характерное для Иоанна словоупотребление; возможный оттенок виновности отмечен в сноске.
- source_word: νῦν δὲ
  choice: Но теперь
  rationale: Передаёт контраст между гипотетическим условием и нынешним положением собеседников.
- source_word: λέγετε ὅτι Βλέπομεν
  choice: 'вы говорите: „Мы видим“'
  rationale: Сохранена прямая речь и переход от второго лица множественного числа к первому, важный для риторики высказывания.
- source_word: ἡ ἁμαρτία ὑμῶν μένει
  choice: ваш грех остаётся
  rationale: Глагол «остаётся» естественно передаёт μένει и сохраняет мотив продолжающегося состояния, характерный для языка Евангелия от Иоанна.
theological_decisions:
- issue: Следует ли явно обозначить духовный смысл слепоты и понимание греха как виновности перед Богом
  choice: В основном тексте сохранить буквальные слова «слепы» и «грех».
  alternative: «Если бы вы были духовно слепы, то не были бы виновны».
  rationale: Контекст указывает на духовное восприятие, однако явное уточнение устранило бы намеренную связь с физической слепотой исцелённого и сузило бы смысл ἁμαρτία. Перевод сохраняет образность и богословское напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Конструкция «не имели бы греха» слегка непривычна, но понятна и намеренно сохраняет формулировку оригинала; сноска поясняет возможный смысл.
