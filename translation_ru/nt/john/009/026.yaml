  text: So they said to him, “What did he do to you? How did he open your eyes?”
translation:
  language: ru
  text: 'Тогда они сказали ему: «Что он сделал с тобой? Как он открыл тебе глаза?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπον
  choice: они сказали
  rationale: Аорист λέγω вводит прямую речь группы. «Сказали» точно передаёт сам глагол, хотя по функции реплика является вопросом.
- source_word: οὖν
  choice: тогда
  rationale: Связка продолжает ход повествования и отмечает следующий шаг в допросе; «тогда» естественно передаёт это в современном русском, не придавая фразе чрезмерно строгого логического значения.
- source_word: αὐτῷ
  choice: ему
  rationale: Дательный падеж обозначает адресата речи — исцелённого человека.
- source_word: Τί ἐποίησέν σοι
  choice: Что Он сделал с тобой?
  rationale: Формулировка сохраняет широкий смысл ποιέω с дательным и настойчивый тон расспроса, не вводя дополнительного оттенка благодеяния, который возник бы при переводе «для тебя».
- source_word: πῶς ἤνοιξέν σου τοὺς ὀφθαλμούς
  choice: Как Он открыл тебе глаза?
  rationale: Русская конструкция «открыть кому-либо глаза» естественно передаёт греческое активное выражение с притяжательным местоимением при части тела.
