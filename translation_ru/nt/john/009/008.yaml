  terminology: «Нищий» и «просить милостыню» — ясные, нейтральные и стилистически уместные соответствия προσαίτης и προσαιτῶν. Специальных богословских терминов или имён в стихе нет. Сноска не требуется, поскольку передача привычного характера действия понятна в самом тексте.
