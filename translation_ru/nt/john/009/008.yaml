  source_fidelity: 'Русский текст точно передаёт повествовательную связку οὖν («Итак»), обе группы людей («соседи и те, кто прежде видел его») и их продолжающуюся реакцию, выраженную имперфектом ἔλεγον («говорили»). Оборот «видел его нищим» естественно и без излишней догматизации передаёт контекстуально спорную связь ὅτι προσαίτης ἦν: он обозначает, что прежде его знали в качестве нищего, не вынуждая выбирать исключительно причинное «потому что». «Обычно сидел и просил милостыню» адекватно выражает идентифицирующее описание прежнего привычного занятия, переданное греческими причастиями.'
