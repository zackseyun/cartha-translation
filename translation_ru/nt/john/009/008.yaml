  text: οἱ οὖν γείτονες καὶ οἱ θεωροῦντες αὐτὸν τὸ πρότερον ὅτι ⸀προσαίτης ἦν ἔλεγον· Οὐχ οὗτός ἐστιν ὁ καθήμενος καὶ προσαιτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/008.yaml
  text: So the neighbors[a], and those who had seen him before as a beggar, were saying, “Is this not the man who used to sit and beg?”
translation:
  language: ru
  text: 'Итак, соседи и те, кто прежде видел его нищим, говорили: «Разве это не тот самый человек, который обычно сидел и просил милостыню?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Итак
  rationale: Передаёт переход и вывод из предшествующего события, сохраняя повествовательную связность.
- source_word: γείτονες
  choice: соседи
  rationale: Прямое и естественное обозначение живущих рядом людей.
- source_word: θεωροῦντες αὐτὸν τὸ πρότερον
  choice: те, кто прежде видел его
  rationale: Передаёт прежнее, вероятно неоднократное наблюдение, не перегружая русскую фразу.
- source_word: ὅτι προσαίτης ἦν
  choice: нищим
  rationale: Творительный предикативный естественно передаёт, в каком качестве они прежде его знали и видели, не навязывая причинного смысла ὅτι.
- source_word: ἔλεγον
  choice: говорили
  rationale: Несовершенный вид передаёт продолжающийся или повторявшийся разговор среди очевидцев.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Разве это не тот самый человек
  rationale: Вопрос ожидает утвердительного ответа; «тот самый» естественно подчёркивает узнавание личности.
- source_word: ὁ καθήμενος καὶ προσαιτῶν
  choice: который обычно сидел и просил милостыню
  rationale: Субстантивированные причастия обозначают его привычное прежнее занятие; «обычно» ясно выражает этот узуальный смысл.
