source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· Ὕπαγε νίψαι εἰς τὴν κολυμβήθραν τοῦ Σιλωάμ (ὃ ἑρμηνεύεται Ἀπεσταλμένος). ἀπῆλθεν οὖν καὶ ἐνίψατο, καὶ ἦλθεν βλέπων.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/007.yaml
  text: And he said to him[a], “Go, wash in the pool of Siloam” (which is translated “Sent”). So he went and washed, and came back seeing.
translation:
  language: ru
  text: 'И сказал ему: «Пойди, умойся в бассейне Силоам» (название которого переводится как «Посланный»). Тот пошёл, умылся и вернулся зрячим.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὕπαγε
  choice: Пойди
  rationale: Прямое повеление двигаться; «пойди» естественно вводит последовательность действий и не добавляет отсутствующих в греческом оттенков.
- source_word: νίψαι / ἐνίψατο (νίπτω)
  choice: умойся / умылся
  rationale: В контексте нанесённой на глаза смеси речь идёт не о полном омовении, а об умывании; русский возвратный глагол естественно передаёт действие над собой.
- source_word: εἰς τὴν κολυμβήθραν
  choice: в купальне
  rationale: κολυμβήθρα означает бассейн или водоём; при глаголе «умойся» русский предложный оборот «в купальне» передаёт место действия без буквального и неестественного «в купальню».
- source_word: Σιλωάμ
  choice: Силоам
  rationale: Устоявшаяся русская передача географического названия.
- source_word: ὃ ἑρμηνεύεται Ἀπεσταλμένος
  choice: 'это название переводится: «Посланный»'
  rationale: ἑρμηνεύεται вводит авторское пояснение перевода имени, а Ἀπεσταλμένος — субстантивированное страдательное причастие. Добавление «название» проясняет русский референт среднего местоимения, не усиливая символический смысл.
- source_word: οὖν
  choice: не выражено отдельным словом
  rationale: Связь следствия естественно передаётся в русском непосредственной последовательностью предложений; «поэтому» могло бы придать логической связи излишнюю тяжеловесность.
- source_word: ἀπῆλθεν
  choice: пошёл
  rationale: Простая повествовательная форма ухода, естественно продолжающая повеление «пойди».
- source_word: ἦλθεν βλέπων
  choice: вернулся зрячим
  rationale: ἦλθεν буквально означает «пришёл», но контекст подразумевает возвращение; «зрячим» кратко и ясно передаёт результативное состояние, выраженное причастием βλέπων.
theological_decisions:
- issue: Передача авторского пояснения имени Силоам без усиления предполагаемой символики
  choice: 'Сохранить пояснение в скобках: «это название переводится: „Посланный“»'
  alternative: Раскрыть связь с Иисусом как Посланным Отцом
  rationale: Пояснение содержится в самом греческом тексте, однако его богословское значение здесь не объясняется прямо; перевод не должен делать скрытую связь явной от себя.
translation_notes:
  register: Современный литературный русский язык с простой, dignified повествовательной интонацией. «Купальня» сохраняет характер названного водоёма и традиционную библейскую узнаваемость; «вернулся зрячим» звучит естественно и подчёркивает совершившееся исцеление.
