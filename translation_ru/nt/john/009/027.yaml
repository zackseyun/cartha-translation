  source_fidelity: 'Основной смысл передан точно: ἀπεκρίθη — «ответил», ἤδη — «уже», οὐκ ἠκούσατε — «не послушали», а заключительный вопрос сохраняет ожидаемый отрицательный ответ. Однако союз «но» в первом предложении излишне усиливает противительное отношение: καί здесь нейтрально соединяет два высказывания. Строчная буква в «его» лучше соответствует нейтральной современной литературной норме и не вносит в перевод издательское конфессиональное оформление, которого нет в греческом тексте.'
