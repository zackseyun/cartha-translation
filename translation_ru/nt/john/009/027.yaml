  text: ἀπεκρίθη αὐτοῖς· Εἶπον ὑμῖν ἤδη καὶ οὐκ ἠκούσατε· τί πάλιν θέλετε ἀκούειν; μὴ καὶ ὑμεῖς θέλετε αὐτοῦ μαθηταὶ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/027.yaml
  text: He answered them[a], “I already told you, and you did not listen. Why do you want to hear it again? You do not also want to become his disciples[b], do you?”
translation:
  language: ru
  text: 'Он ответил им: «Я уже сказал вам, а вы не послушали.[a] Зачем вы хотите услышать это снова? Уж не хотите ли и вы стать его учениками?»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а вы не услышали». Греческий глагол может означать как физическое восприятие речи, так и внимательное слушание; здесь, вероятно, имеется в виду, что сказанному не вняли.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Уж не хотите ли и вы стать его учениками?» Греческий вопрос построен так, что предполагает отрицательный ответ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: Он ответил
  rationale: Обычный повествовательный глагол ответа; формально соответствует греческому и естественно звучит по-русски.
- source_word: ἤδη
  choice: уже
  rationale: Передаёт подчёркнутое указание на то, что сообщение было сделано прежде.
- source_word: οὐκ ἠκούσατε
  choice: вы не послушали
  rationale: В контексте речь, вероятнее всего, не об отсутствии слухового восприятия, а о нежелании принять сказанное во внимание; «не послушали» сохраняет укоряющую силу.
- source_word: τί πάλιν θέλετε ἀκούειν;
  choice: Зачем вы хотите услышать это снова?
  rationale: τί при θέλετε здесь естественно понимать как выражающее раздражённое «зачем»; «это» восполняет подразумеваемый объект.
- source_word: μὴ καὶ ὑμεῖς
  choice: Уж не хотите ли и вы…?
  rationale: Русская конструкция «уж не… ли» естественно передаёт вопрос с μή, предполагающий отрицательный ответ, и сохраняет насмешливо-риторический оттенок.
- source_word: αὐτοῦ μαθηταὶ
  choice: Его учениками
  rationale: Естественная русская притяжательная конструкция; «ученики» соответствует устойчивому значению μαθηταί у Иоанна.
- source_word: γενέσθαι
  choice: стать
  rationale: Передаёт вхождение в новое состояние, выраженное γίνομαι, а не просто пребывание в нём.
theological_decisions:
- issue: Риторическая сила заключительного вопроса
  choice: «Уж не хотите ли и вы стать Его учениками?» — насмешливый вопрос, предполагающий отрицательный ответ.
  alternative: «Неужели и вы хотите стать Его учениками?»
  rationale: Частица μή обычно указывает на ожидание отрицательного ответа. Конструкция «уж не… ли» передаёт эту грамматическую и риторическую силу, не превращая вопрос в нейтральный.
translation_notes:
  register: Современный литературный русский язык с живой, но достойной разговорной интонацией. «Уж не хотите ли» сохраняет резкость и иронию реплики исцелённого, не прибегая к просторечию. Местоимение «Его» написано с прописной буквы в соответствии с распространённой русской библейской издательской практикой.
