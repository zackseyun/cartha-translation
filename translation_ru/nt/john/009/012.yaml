lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз сохраняет связь с предыдущим повествованием, не добавляя значения следствия или последовательности.
- source_word: εἶπαν αὐτῷ
  choice: они спросили его
  rationale: Хотя буквально выражение означает «они сказали ему», прямая речь представляет собой вопрос; в современном русском повествовании «спросили» естественно передаёт речевой акт без изменения смысла.
- source_word: Ποῦ ἐστιν ἐκεῖνος
  choice: Где тот человек
  rationale: Указательное местоимение ἐκεῖνος употреблено самостоятельно и сохраняет оттенок дистанцированного указания. Слово «человек» ясно из контекста и делает фразу естественной по-русски.
- source_word: λέγει
  choice: Он ответил
  rationale: Греческое историческое настоящее буквально означает «говорит», но русский литературный рассказ обычно передаёт его прошедшим временем. «Ответил» естественно обозначает реплику в ответ на вопрос.
- source_word: Οὐκ οἶδα
  choice: Не знаю
  rationale: Краткая форма точно сохраняет простоту и прямоту ответа; русское подлежащее «я» естественно опускается.
