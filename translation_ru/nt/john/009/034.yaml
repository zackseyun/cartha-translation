  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ἐν ἁμαρτίαις σὺ ἐγεννήθης ὅλος, καὶ σὺ διδάσκεις ἡμᾶς; καὶ ἐξέβαλον αὐτὸν ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/034.yaml
  text: They answered and said to him[a], “You were born entirely in sins[c][b], and are you teaching us?” And they cast him out.
translation:
  language: ru
  text: 'Они ответили и сказали ему: «Во грехах ты весь родился — и ты нас учишь?» И выгнали его вон.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение может означать, что его выгнали из их присутствия; в данном контексте оно может также подразумевать исключение из синагогальной общины.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Они ответили и сказали ему
  rationale: Сохранена характерная для Иоанна двуглагольная формула; в русском она звучит несколько торжественно, но ясно и соответствует повествовательной манере оригинала.
- source_word: Ἐν ἁμαρτίαις
  choice: Во грехах
  rationale: Сохранено множественное число греческого ἁμαρτίαις, передающее резкость обвинения и не сводящее его к отвлечённому понятию греха.
- source_word: ἐγεννήθης ὅλος
  choice: ты весь родился
  rationale: Порядок слов «во грехах ты весь родился» естественно подчёркивает, что, по словам обвинителей, грехами отмечен человек целиком; при этом не уточняется источник или характер этих грехов.
- source_word: καὶ σὺ διδάσκεις ἡμᾶς;
  choice: и ты нас учишь?
  rationale: Выделенное местоимение «ты» и порядок «нас учишь» передают возмущённый, уничижительный риторический вопрос.
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: выгнали его вон
  rationale: Естественная современная русская передача усиленного выражения с глаголом изгнания и наречием «наружу/вон»; сохраняет враждебный характер действия.
theological_decisions:
- issue: Смысл обвинения «во грехах ты весь родился» в связи со слепотой от рождения
  choice: Обвинение сохранено как резкая реплика говорящих без уточнения, чьи это грехи и какую связь они усматривают между грехом и врождённой слепотой.
  alternative: «Ты родился сплошным грешником» или «Ты родился во грехе».
  rationale: Греческий текст не определяет, имеются ли в виду собственные грехи человека, грехи родителей, наследственная вина или общее греховное состояние. Перевод не должен разрешать эту богословскую напряжённость за текст.
- issue: Характер изгнания
  choice: Основной текст сообщает, что его «выгнали вон», без прямого уточнения об официальном отлучении.
  alternative: «Исключили его из синагоги».
  rationale: Контекст допускает исключение из синагогальной общины, однако само выражение ἐξέβαλον αὐτὸν ἔξω может обозначать и непосредственное изгнание из их присутствия; более узкое толкование вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Инверсия «Во грехах ты весь родился» сохраняет ударение и оскорбительный тон реплики, не делая фразу неестественной. Тире перед риторическим вопросом передаёт резкий переход к возмущённому вызову.
