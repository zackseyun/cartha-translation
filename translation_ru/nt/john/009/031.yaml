id: JHN.9.31
reference: John 9:31
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀οἴδαμεν ὅτι ⸂ἁμαρτωλῶν ὁ θεὸς⸃ οὐκ ἀκούει, ἀλλ’ ἐάν τις θεοσεβὴς ᾖ καὶ τὸ θέλημα αὐτοῦ ποιῇ τούτου ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/031.yaml
  text: We know that God does not listen to sinners; but if anyone is God-fearing and does his will[a], he listens to him.
translation:
  language: ru
  text: Мы знаем, что Бог не слушает грешников; но если кто чтит Бога[a] и исполняет Его волю, того Он слушает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклоняется Богу».'
    reason: Лексически возможная передача θεοσεβής, которая сильнее подчёркивает поклонение, тогда как основной текст сохраняет более широкое значение благоговения перед Богом.
lexical_decisions:
- source_word: οἴδαμεν
  choice: Мы знаем
  rationale: Форма οἶδα имеет в койне настоящее значение; «мы знаем» — естественный и точный русский эквивалент.
- source_word: ἁμαρτωλῶν
  choice: грешников
  rationale: Родительный падеж при ἀκούει обозначает людей, которых Бог не слушает; «грешники» кратко сохраняет нравственно-религиозную силу слова.
- source_word: ἀκούει
  choice: слушает
  rationale: В контексте речь не просто о восприятии звука, а о благосклонном внимании и отклике. «Слушает» передаёт этот смысл, не усиливая его до «отвечает».
- source_word: θεοσεβὴς
  choice: чтит Бога
  rationale: Прилагательное означает человека, благоговеющего перед Богом. Русская глагольная конструкция естественнее буквального «богобоязнен» и сохраняет явное указание на Бога.
- source_word: τὸ θέλημα αὐτοῦ ποιῇ
  choice: исполняет Его волю
  rationale: Это естественная русская передача устойчивого сочетания ποιεῖν τὸ θέλημα; «исполняет» точнее по-русски, чем буквальное «делает».
- source_word: τούτου ἀκούει
  choice: того Он слушает
  rationale: Начальное τούτου выделяет человека, описанного в условии. «Того Он слушает» сохраняет это смысловое ударение.
- source_word: ἀλλ’ ἐάν τις
  choice: но если кто
  rationale: Сохраняет противопоставление и неопределённое единственное лицо, оставаясь естественным для литературного русского языка.
theological_decisions:
- issue: Объём утверждения «Бог не слушает грешников»
  choice: Передать утверждение прямо, не смягчая и не превращая его в систематическое богословское положение.
  alternative: «Бог не слушает молитв грешников» или «Бог не одобряет грешников».
  rationale: Греческий текст говорит, что Бог не «слушает» грешников, и противопоставляет им человека, который чтит Бога и исполняет Его волю. Перевод сохраняет силу и напряжение реплики говорящего, не добавляя отсутствующего слова «молитвы» и не разрешая вопрос обо всех возможных смыслах Божьего слышания.
- issue: Передача θεοσεβής
  choice: чтит Бога
  alternative: «поклоняется Богу»; «богобоязнен».
  rationale: Выбранная передача выражает благоговейное отношение к Богу и не сужает значение до одного лишь культового поклонения. Возможный вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; фраза звучит ясно и достойно. Заглавные местоимения «Его», «Он» применены как традиционное русское типографическое обозначение отсылки к Богу. Точка с запятой сохраняет резкое противопоставление частей высказывания.
