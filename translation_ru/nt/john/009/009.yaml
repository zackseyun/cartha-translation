base_translation:
  language: en
  yaml_path: translation/nt/john/009/009.yaml
  text: Some were saying[a], “This is he.” Others were saying, “No, but he is like him.” He kept saying, “I am he.”
translation:
  language: ru
  text: 'Одни говорили: «Это он». Другие говорили: «Нет, он похож на него». А тот всё повторял: «Это я».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я есть». Здесь это обычное самоотождествление: человек говорит, что именно его они обсуждают.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι … ἄλλοι
  choice: Одни … Другие
  rationale: Передаёт распределительное противопоставление двух групп и естественно звучит по-русски.
- source_word: ἔλεγον
  choice: говорили
  rationale: Имперфект описывает продолжающееся обсуждение; русская форма прошедшего времени в данном повествовательном контексте передаёт его естественно.
- source_word: Οὗτός ἐστιν
  choice: Это он
  rationale: Краткая прямая идентификация без добавления отсутствующего в греческом существительного.
- source_word: Οὐχί, ἀλλὰ
  choice: Нет, … просто
  rationale: Οὐχί передано ясным отрицанием; ἀλλά выражает поправку. «Просто» естественно подчёркивает, что речь идёт лишь о сходстве, не превращая фразу в категорическое отрицание самого сходства.
- source_word: ὅμοιος αὐτῷ ἐστιν
  choice: он просто похож на него
  rationale: Сохраняет различие между сходством и тождеством и соответствует современному русскому употреблению.
- source_word: ἐκεῖνος ἔλεγεν
  choice: А тот всё повторял
  rationale: ἐκεῖνος выделяет самого обсуждаемого человека, а имперфект уместно передан как его неоднократное настойчивое утверждение.
- source_word: Ἐγώ εἰμι
  choice: Это я
  rationale: В ближайшем контексте это обычное самоотождествление человека с тем, кого обсуждают; русское «Это я» передаёт смысл естественно, тогда как буквальное «Я есть» здесь звучало бы искусственно и могло бы создать не требуемый контекстом богословский оттенок.
theological_decisions:
- issue: Передача Ἐγώ εἰμι в Евангелии от Иоанна
  choice: Это я
  alternative: Я есть / Я — тот
  rationale: Хотя в иных местах Евангелия формула может иметь особую богословскую значимость, здесь её произносит исцелённый человек, подтверждая свою личность. Перевод сохраняет непосредственный контекст и не приписывает его словам христологического смысла.
translation_notes:
  register: Современный литературный русский язык; диалог краткий и живой, но не просторечный. Частица «просто» делает возражение естественным и передаёт ограничение утверждения сходством.
