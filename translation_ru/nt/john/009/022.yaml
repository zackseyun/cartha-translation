  terminology: «Иудеи» сохраняет лексическую форму оригинала; сноска надлежащим образом указывает на вероятный контекстуальный референт — иудейские власти — без обобщения о народе. «Мессия» верно передаёт титульное χριστός и сохраняет историко-иудейский контекст. Альтернативы в сноске полезны и не навязывают толкования.
