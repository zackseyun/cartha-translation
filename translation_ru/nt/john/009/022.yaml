  source_fidelity: Перевод точно передаёт причинную связь ὅτι, продолжающийся страх ἐφοβοῦντο, предварительно достигнутое решение (ἤδη συνετέθειντο), условно-обобщённую конструкцию ἵνα ἐάν τις и санкцию ἀποσυνάγωγος. «Признает Его Мессией» корректно передаёт ὁμολογήσῃ αὐτὸν χριστόν; «отлучён от синагоги» адекватно выражает исключение из синагогальной общины, не добавляя деталей процедуры.
