id: JHN.9.22
reference: John 9:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ταῦτα εἶπαν οἱ γονεῖς αὐτοῦ ὅτι ἐφοβοῦντο τοὺς Ἰουδαίους, ἤδη γὰρ συνετέθειντο οἱ Ἰουδαῖοι ἵνα ἐάν τις αὐτὸν ὁμολογήσῃ χριστόν, ἀποσυνάγωγος γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/022.yaml
  text: His parents said these things because they were afraid of the Jews[a], for the Jews had already agreed that if anyone confessed him as the Messiah[b], he would be put out of the synagogue.
translation:
  language: ru
  text: 'Его родители сказали это потому, что боялись иудеев[a]: ведь иудеи уже договорились, что всякий, кто признает Его Мессией[b], будет отлучён от синагоги.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «иудеев». В данном контексте, вероятно, имеются в виду иудейские власти, а не иудейский народ вообще.'
    reason: Культурно-контекстуальное пояснение неоднозначного обозначения.
  - marker: b
    text: 'Или: «признает Его Христом»; «исповедует Его как Христа».'
    reason: Альтернативная передача титула χριστός и глагола ὁμολογέω.
lexical_decisions:
- source_word: ταῦτα εἶπαν
  choice: сказали это
  rationale: Хотя ταῦτα имеет форму множественного числа, в современном русском «сказали это» естественно отсылает ко всему предшествующему ответу; «сказали эти слова» было бы более эксплицитно, но тяжелее.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: Его родители
  rationale: Прямой и естественный эквивалент, сохраняющий притяжательное значение αὐτοῦ.
- source_word: ὅτι ἐφοβοῦντο
  choice: потому, что боялись
  rationale: ὅτι вводит причину, а имперфект ἐφοβοῦντο обозначает продолжавшийся страх.
- source_word: τοὺς Ἰουδαίους / οἱ Ἰουδαῖοι
  choice: иудеев / иудеи
  rationale: Основной текст сохраняет формулировку греческого оригинала; контекстуально речь, вероятно, идёт об иудейских властях, что разъяснено в сноске.
- source_word: ἤδη γὰρ συνετέθειντο
  choice: ведь иудеи уже договорились
  rationale: «Ведь» естественно передаёт пояснительное γὰρ, «уже» — ἤδη, а «договорились» выражает ранее достигнутое совместное решение, обозначенное плюсквамперфектом συνετέθειντο.
- source_word: ἵνα ἐάν τις
  choice: что всякий, кто
  rationale: Эта русская конструкция естественно передаёт содержание соглашения и неопределённо-условный смысл греческого оборота.
- source_word: αὐτὸν ὁμολογήσῃ χριστόν
  choice: признает Его Мессией
  rationale: ὁμολογέω здесь означает открыто признать или исповедать; творительный «Мессией» естественно передаёт предикативное χριστόν без добавления отсутствующей в тексте связки.
- source_word: ἀποσυνάγωγος γένηται
  choice: будет отлучён от синагоги
  rationale: Передаёт значение лишения участия в синагогальной общине; пассивная русская формулировка ясно выражает налагаемую санкцию.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос; Помазанник
  rationale: В данном месте слово функционирует как мессианский титул, который человек признаёт за Иисусом; «Мессия» сохраняет иудейский контекст и не превращает титул в имя.
- issue: Референт οἱ Ἰουδαῖοι в Евангелии от Иоанна
  choice: иудеи — с контекстуальным пояснением в сноске
  alternative: иудейские власти; иудейские руководители
  rationale: Греческое обозначение сохранено ради точности и присущей тексту широты, однако право отлучать от синагоги указывает здесь, вероятнее всего, на обладавших властью представителей общины, а не на иудейский народ вообще.
- issue: Характер санкции ἀποσυνάγωγος
  choice: отлучён от синагоги
  alternative: исключён из синагоги; изгнан из синагоги
  rationale: Формулировка передаёт реальное исключение из синагогальной общины, не уточняя сверх текста его процедуру, срок или позднейшую институциональную форму.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный повествовательный регистр. Синтаксис близок к оригиналу, но естественен по-русски; двоеточие подчёркивает пояснительную связь γὰρ. Местоимение «Его» написано с прописной буквы согласно распространённой русской библейской традиции, без изменения смысла оригинала.
