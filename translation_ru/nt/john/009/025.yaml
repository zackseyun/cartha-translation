  text: ἀπεκρίθη οὖν ⸀ἐκεῖνος· Εἰ ἁμαρτωλός ἐστιν οὐκ οἶδα· ἓν οἶδα ὅτι τυφλὸς ὢν ἄρτι βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/025.yaml
  text: 'So that man answered[a], “Whether he is a sinner, I do not know. One thing I do know: though I was blind, now I see.”'
translation:
  language: ru
  text: 'Тогда он ответил: «Грешник ли Он — не знаю. Одно знаю: я был слеп, а теперь вижу».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη οὖν ἐκεῖνος
  choice: Тогда он ответил
  rationale: «Тогда» естественно передаёт повествовательную связь οὖν с предыдущим обменом репликами; местоимение «он» в русском контексте достаточно ясно указывает на исцелённого и не создаёт неестественного выражения «тот человек».
- source_word: Εἰ ἁμαρτωλός ἐστιν
  choice: Грешник ли Он
  rationale: Частица «ли» естественно передаёт косвенный вопрос после «не знаю» и сохраняет неопределённость высказывания, не превращая его в условие.
- source_word: οὐκ οἶδα
  choice: не знаю
  rationale: Прямой и современный эквивалент греческой формы с настоящим значением.
- source_word: ἓν οἶδα
  choice: Одно знаю
  rationale: Лаконичная конструкция сохраняет лексический повтор и резкий контраст между тем, чего говорящий не знает, и тем, что знает достоверно.
- source_word: τυφλὸς ὢν
  choice: я был слеп
  rationale: В контексте причастная конструкция обозначает прежнее состояние; личная форма звучит естественно по-русски и ясно противопоставлена нынешнему зрению.
- source_word: ἄρτι βλέπω
  choice: а теперь вижу
  rationale: «Теперь» передаёт ἄρτι в противопоставлении прежней слепоте, а «вижу» буквально и выразительно воспроизводит βλέπω.
theological_decisions:
- issue: Передача ответа исцелённого на утверждение о греховности Иисуса без внесения авторской богословской оценки
  choice: Грешник ли Он — не знаю
  alternative: Если Он грешник, не знаю
  rationale: Конструкция с «ли» передаёт ограниченность знания самого говорящего и сохраняет напряжение контекста, не утверждая и не отрицая греховность Иисуса от лица повествователя.
translation_notes:
  register: Современный литературный русский язык; речь краткая, достоинственная и естественная. Заглавное «Он» употреблено как уважительное местоименное обозначение Иисуса, не изменяя содержания реплики.
