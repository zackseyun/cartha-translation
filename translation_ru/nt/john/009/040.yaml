  text: ⸀ἤκουσαν ἐκ τῶν Φαρισαίων ταῦτα οἱ ⸂μετ’ αὐτοῦ ὄντες⸃, καὶ εἶπον αὐτῷ· Μὴ καὶ ἡμεῖς τυφλοί ἐσμεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/040.yaml
  text: Some of the Pharisees who were with him heard these things and said to him[a], “Surely we are not blind too, are we?”
translation:
  language: ru
  text: 'Некоторые из фарисеев, находившиеся с ним, услышали это и сказали ему: «Неужели и мы слепы?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий вопрос с μή предполагает отрицательный ответ.
    reason: Пояснение направленности вопроса.
lexical_decisions:
- source_word: ἤκουσαν
  choice: услышали
  rationale: Аорист ἀκούω в повествовательном контексте обозначает восприятие сказанного Иисусом; «услышали» — естественный русский эквивалент.
- source_word: ἐκ τῶν Φαρισαίων
  choice: некоторые из фарисеев
  rationale: Конструкция ἐκ с родительным имеет партитивное значение и указывает не на всех фарисеев, а на часть их.
- source_word: ταῦτα
  choice: это
  rationale: Русское собирательное «это» естественно отсылает ко всему только что сказанному, не сужая значение до одних лишь слов.
- source_word: οἱ μετ’ αὐτοῦ ὄντες
  choice: находившиеся с ним
  rationale: Оборот передаёт присутствие этих фарисеев вместе с Иисусом, не предполагая непременно ученичества или согласия с ним.
- source_word: εἶπον αὐτῷ
  choice: спросили его
  rationale: Хотя буквально глагол означает «сказали ему», содержание прямой речи является вопросом; по-русски «спросили» здесь естественнее и не меняет коммуникативного смысла.
- source_word: Μὴ καὶ ἡμεῖς τυφλοί ἐσμεν
  choice: Неужели и мы слепы?
  rationale: Частица μή задаёт вопрос, предполагающий отрицательный ответ; русское «неужели» естественно передаёт недоверие говорящих, а «и мы» сохраняет значение καί и подчёркнутое ἡμεῖς.
- source_word: τυφλοί
  choice: слепы
  rationale: 'Сохранено непояснённое «слепы»: контекст выявляет переносный смысл, а прямое обозначение удерживает характерную для эпизода иронию.'
theological_decisions:
- issue: Следует ли прямо обозначить переносный смысл τυφλοί
  choice: Оставить «слепы» без добавления «духовно»
  alternative: «духовно слепы»
  rationale: Греческий текст не уточняет вид слепоты. Контекст указывает на переносный смысл, но его пояснение в основном тексте ослабило бы многозначность и иронию диалога.
- issue: Как понимать присутствие фарисеев μετ’ αὐτοῦ
  choice: 'Передать нейтрально: «находившиеся с ним»'
  alternative: «следовавшие за ним» или «бывшие его сторонниками»
  rationale: Предлог μετά здесь указывает на совместное присутствие, но сам по себе не доказывает ученичества или приверженности Иисусу.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинный. «Спросили» выбрано вместо формально буквального «сказали», поскольку далее следует прямой вопрос. Местоимения, относящиеся к Иисусу, даны со строчной буквы в соответствии с обычной современной издательской практикой и без внесения отсутствующей в греческом тексте графической интерпретации.
