lexical_decisions:
- source_word: Ἄγουσιν
  choice: приводят
  rationale: 'Греческий исторический презенс сохранён: он оживляет повествование и естественно звучит в русском библейском рассказе. Глагол передаёт направленное перемещение человека к фарисеям.'
- source_word: αὐτὸν
  choice: человека
  rationale: Местоимение «его» объединено с субстантивированным определением τόν ποτε τυφλόν в естественную русскую конструкцию «человека, который прежде был слеп».
- source_word: πρὸς τοὺς Φαρισαίους
  choice: к фарисеям
  rationale: πρός с винительным падежом обозначает движение к лицам; «к фарисеям» прямо передаёт это значение без добавочного судебного оттенка выражения «на суд к фарисеям» или «пред фарисеев».
- source_word: Φαρισαίους
  choice: фарисеям
  rationale: Устоявшееся русское наименование религиозной группы.
- source_word: τόν ποτε τυφλόν
  choice: человека, который прежде был слеп
  rationale: Субстантивированное прилагательное передано с явным обозначением лица; относительное предложение естественно по-русски выражает прежнее состояние человека и подразумеваемый контраст с его нынешним зрением.
- source_word: ποτε
  choice: прежде
  rationale: В данном контексте слово обозначает прежнее состояние; «прежде» ясно выражает временной контраст и звучит литературно и современно.
- source_word: τυφλόν
  choice: был слеп
  rationale: Прилагательное относится к прежнему состоянию мужчины; русская предикативная конструкция точно и естественно передаёт смысл.
