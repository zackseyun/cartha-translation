  text: ἔλεγον οὖν ἐκ τῶν Φαρισαίων τινές· ⸂Οὐκ ἔστιν οὗτος παρὰ θεοῦ ὁ ἄνθρωπος⸃, ὅτι τὸ σάββατον οὐ τηρεῖ. ⸀ἄλλοι ἔλεγον· Πῶς δύναται ἄνθρωπος ἁμαρτωλὸς τοιαῦτα σημεῖα ποιεῖν; καὶ σχίσμα ἦν ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/016.yaml
  text: So some of the Pharisees were saying[a], “This man is not from God, because he does not keep the Sabbath.” But others were saying[b], “How can a sinful man do such signs?” And there was a division among them.
translation:
  language: ru
  text: 'Итак, некоторые из фарисеев говорили: «Этот человек не от Бога, потому что не соблюдает субботу». Другие же говорили: «Как может грешный человек[a] совершать такие знамения[b]?» И между ними было разногласие.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грешник». В греческом тексте буквально: «грешный человек» — прилагательное определяет слово «человек».'
    reason: lexical_alternative
  - marker: b
    text: 'Иоанн часто называет дела Иисуса «знамениями», подчёркивая их откровенное значение; возможный перевод: «такие чудесные знамения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον ... τινές
  choice: некоторые ... говорили
  rationale: Имперфект ἔλεγον передаёт продолжающуюся речь в ходе обсуждения; «говорили» естественно сохраняет этот видовой оттенок, а τινές точно передано словом «некоторые».
- source_word: οὖν
  choice: итак
  rationale: Союз продолжает повествование и связывает реакцию фарисеев с предшествующим разбирательством; «итак» сохраняет связующую и отчасти выводную функцию.
- source_word: ἐκ τῶν Φαρισαίων
  choice: из фарисеев
  rationale: Оборот обозначает часть более широкой группы; русское «некоторые из фарисеев» точно и естественно передаёт эту структуру.
- source_word: οὗτος ... ὁ ἄνθρωπος
  choice: этот человек
  rationale: Передаёт указательное местоимение и существительное без добавления пренебрежительного оттенка, который был бы сильнее в вариантах вроде «этот тип».
- source_word: παρὰ θεοῦ
  choice: от Бога
  rationale: Παρά с родительным указывает на источник или происхождение. «От Бога» сохраняет это значение, не добавляя отсутствующего в греческом тексте глагола «послан».
- source_word: τηρεῖ
  choice: соблюдает
  rationale: В сочетании с субботой глагол означает придерживаться предписаний; «соблюдает субботу» — ясное и современное русское выражение.
- source_word: τὸ σάββατον
  choice: субботу
  rationale: Название установленного дня покоя передано обычным русским библейским термином без избыточного добавления слова «день».
- source_word: ἄλλοι
  choice: другие же
  rationale: «Другие» передаёт противопоставленную группу, а частица «же» естественно подчёркивает контраст мнений.
- source_word: Πῶς δύναται
  choice: Как может
  rationale: Сохраняет вопрос о возможности или способности и звучит естественно по-русски.
- source_word: ἄνθρωπος ἁμαρτωλὸς
  choice: грешный человек
  rationale: Греческое прилагательное ἁμαρτωλός относится к ἄνθρωπος; буквальная синтаксическая связь сохранена, не превращая выражение без необходимости в существительное «грешник».
- source_word: τοιαῦτα σημεῖα
  choice: такие знамения
  rationale: «Такие» передаёт τοιαῦτα, а «знамения» сохраняет характерный для Иоанна смысл действий, указывающих за пределы самого чуда.
- source_word: σχίσμα ἦν ἐν αὐτοῖς
  choice: между ними было разногласие
  rationale: Передаёт существовавшее внутри группы разделение мнений. «Разногласие» в данном контексте естественнее и не слабее по смыслу, чем буквальный, но более резкий «раскол».
theological_decisions:
- issue: Передача богословски значимого слова σημεῖα у Иоанна
  choice: знамения
  alternative: чудеса; чудесные знамения
  rationale: «Знамения» сохраняет указующий, откровенный смысл дел Иисуса в Евангелии от Иоанна и не сводит их лишь к сверхъестественным событиям.
- issue: Утверждение о том, что Иисус — παρὰ θεοῦ
  choice: от Бога
  alternative: послан Богом
  rationale: Перевод сохраняет неоднозначность между происхождением и полномочием от Бога и не вводит более конкретную идею посланничества, хотя она присутствует в более широком богословии Евангелия.
- issue: Характер разделения среди фарисеев
  choice: разногласие
  alternative: раскол
  rationale: Контекст непосредственно описывает противоположные суждения внутри группы. «Разногласие» сохраняет эту напряжённость, не навязывая позднейшего институционального смысла слова «раскол».
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-достоинственным синтаксисом. Реплики звучат естественно, при этом сохранены имперфект речи, противопоставление двух групп и характерная для Иоанна терминология «знамений». Слово «суббота» дано со строчной буквы согласно обычной современной русской орфографии.
