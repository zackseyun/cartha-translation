  text: ὁ δὲ ἔφη· Πιστεύω, κύριε· καὶ προσεκύνησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/038.yaml
  text: And he said[a], “I believe[b], Lord,” and he worshiped him.
translation:
  language: ru
  text: 'Он сказал: «Верую, Господи[a]», — и поклонился Ему[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «господин мой». Греческое κύριε могло быть уважительным обращением; здесь выбрано «Господи», поскольку повествование достигает кульминации в исповедании веры и поклонении.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «поклонился перед Ним», «воздал Ему поклонение». Греческий глагол может обозначать преклонение, выражение почтения или поклонение; контекст здесь указывает на поклонение Иисусу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Он
  rationale: Артикль употреблён как местоимение и указывает на исцелённого человека; δέ здесь служит связкой повествования, которую в естественном русском нет необходимости передавать отдельным союзом.
- source_word: ἔφη
  choice: сказал
  rationale: Аорист φημί — обычная формула введения прямой речи; «сказал» точно и естественно передаёт её.
- source_word: Πιστεύω
  choice: Верую
  rationale: Форма настоящего времени передаёт личное исповедание веры в прямом ответе Иисусу. «Верую» сохраняет связь с характерной для Иоанна темой веры и уместно звучит в торжественном контексте.
- source_word: κύριε
  choice: Господи
  rationale: Звательная форма «Господи» передаёт κύριε как обращение «Господь». Контекст — откровение Иисуса, исповедание веры и последующее поклонение — поддерживает более высокий смысл, хотя уважительное обращение также лексически возможно.
- source_word: προσεκύνησεν
  choice: поклонился
  rationale: '«Поклонился» естественно передаёт завершённое действие и сохраняет присущий προσκυνέω диапазон значений: земной поклон, почтение и поклонение. В данном контексте слово несёт выраженный смысл поклонения.'
- source_word: αὐτῷ
  choice: Ему
  rationale: Дательный объект при προσκυνέω прямо и естественно передаётся русским дательным падежом. Заглавная буква соответствует принятому в русском библейском стиле уважительному обозначению Иисуса.
theological_decisions:
- issue: Следует ли понимать κύριε только как уважительное обращение или как исповедальное «Господи»
  choice: Господи
  alternative: господин мой; сударь
  rationale: После того как Иисус открывает Себя исцелённому, тот исповедует веру и кланяется Ему. Поэтому «Господи» лучше передаёт кульминацию повествования, не исключая отмеченной в сноске лексической возможности уважительного обращения.
- issue: Следует ли явно переводить προσεκύνησεν как религиозное поклонение
  choice: поклонился Ему
  alternative: поклонился перед Ним; воздал Ему поклонение
  rationale: Русское «поклонился Ему» сохраняет как телесный образ преклонения, так и контекстуальный смысл поклонения Иисусу. Оно не устраняет подлинную лексическую многозначность греческого глагола, а сноска делает богословскую силу контекста явной.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Верую» выбрано вместо более разговорного «верю» из-за исповедального характера ответа. Конструкция прямой речи и совершенный вид «поклонился» сохраняют краткость и завершённость греческой фразы.
