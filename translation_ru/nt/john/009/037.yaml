  text: ⸀εἶπεν αὐτῷ ὁ Ἰησοῦς· Καὶ ἑώρακας αὐτὸν καὶ ὁ λαλῶν μετὰ σοῦ ἐκεῖνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/037.yaml
  text: Jesus said to him[a], “You have seen him, and the one speaking with you is he.”
translation:
  language: ru
  text: 'Иисус сказал ему: «Ты видел Его, и Тот, Кто говорит с тобой, — это Он».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: сказал ему
  rationale: Обычная повествовательная передача аориста λέγω и дательного адресата без излишнего усиления.
- source_word: Καὶ ἑώρακας αὐτόν
  choice: Ты уже видел Его
  rationale: Перфект передаёт совершившееся действие, сохраняющее значение в настоящем; частица «уже» естественно выражает этот оттенок по-русски. Начальное καί здесь не требует отдельного «и», которое в русском после вводящей реплики звучало бы тяжеловесно.
- source_word: ὁ λαλῶν μετὰ σοῦ
  choice: Тот, Кто сейчас говорит с тобой
  rationale: Субстантивированное причастие передано конструкцией «Тот, Кто»; настоящее время подчёркнуто словом «сейчас». μετά с родительным сохранено как «с тобой», а не сведено к «тебе».
- source_word: ἐκεῖνός ἐστιν
  choice: это Он
  rationale: Краткая опознавательная формула сохраняет прямое самоотождествление и не повторяет титул из предыдущего стиха.
theological_decisions:
- issue: Самоотождествление Иисуса с упомянутым ранее Сыном Человеческим
  choice: «Тот, Кто сейчас говорит с тобой, — это Он»
  alternative: «это Тот, Кто говорит с тобой»
  rationale: Перевод прямо передаёт отождествление, но не вставляет в стих отсутствующий здесь титул и не снимает заложенную в формулировке отсылку к предыдущему вопросу.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Заглавные буквы в местоимениях «Его», «Он» помогают ясно обозначить референта в традиционном русском библейском регистре, не добавляя нового содержания.
