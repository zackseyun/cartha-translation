lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν
  choice: Он ответил
  rationale: Греческая повествовательная формула буквально сочетает «ответил» и «сказал», но в современном русском их совместная передача была бы тяжеловесной; «Он ответил» естественно выражает смысл всей формулы.
- source_word: Καὶ τίς ἐστιν
  choice: А кто Он
  rationale: Начальное καί связывает вопрос с предшествующими словами Иисуса; русское «А» естественно передаёт непосредственный встречный вопрос. Местоимение «Он» сохраняет отсылку к ранее названному лицу.
- source_word: κύριε
  choice: Господи
  rationale: Это традиционная и точная звательная форма для κύριε; при этом контекст допускает также уважительное обращение «господин», поэтому неоднозначность отмечена в сноске.
- source_word: ἵνα πιστεύσω εἰς αὐτόν
  choice: чтобы мне поверить в Него
  rationale: Оборот с ἵνα и сослагательным наклонением выражает цель. «Поверить в Него» прозрачно передаёт πιστεύω εἰς и сохраняет характерную богословскую формулировку.
theological_decisions:
- issue: Значение обращения κύριε до явного исповедания исцелённого
  choice: Господи
  alternative: господин
  rationale: κύριε может быть как обращением к Господу, так и обычной почтительной формой. Основной текст следует устойчивому соответствию «Господи», а сноска сохраняет реальную контекстуальную неоднозначность, не определяя заранее степень понимания говорящего.
translation_notes:
  register: Современный литературный русский, естественный и достойный по тону. Греческий речевой дублет сокращён без потери смысла; богословски значимая неоднозначность κύριε сохранена с помощью сноски.
