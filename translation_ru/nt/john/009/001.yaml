id: JHN.9.1
reference: John 9:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ παράγων εἶδεν ἄνθρωπον τυφλὸν ἐκ γενετῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/001.yaml
  text: And as he was passing by[a], he saw a man blind from birth.
translation:
  language: ru
  text: И, проходя мимо[a], Он увидел человека, слепого от рождения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «идя». Греческое причастие изображает Иисуса идущим в тот момент, когда Он увидел этого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Сохранён обычный повествовательный союз, связывающий стих с предшествующим контекстом.
- source_word: παράγων
  choice: проходя мимо
  rationale: Деепричастие естественно передаёт одновременное и фоновое действие греческого причастия настоящего времени.
- source_word: εἶδεν
  choice: увидел
  rationale: Прямой и нейтральный эквивалент аориста глагола ὁράω, без добавочного оттенка «заметил».
- source_word: ἄνθρωπον
  choice: человека
  rationale: Русское «человека» естественно передаёт ἄνθρωπον; мужской пол персонажа далее ясен из контекста, поэтому слово «мужчину» здесь не требуется.
- source_word: τυφλὸν
  choice: слепого
  rationale: Согласованное определение сохраняет характеристику человека и естественный русский порядок слов.
- source_word: ἐκ γενετῆς
  choice: от рождения
  rationale: Устойчивое современное выражение, точно обозначающее слепоту с момента рождения.
theological_decisions:
- issue: Передача ἄνθρωπον и пола персонажа
  choice: человека
  alternative: мужчину
  rationale: Хотя повествование говорит о лице мужского пола, основное значение ἄνθρωπος — «человек». Русское «человека» точно и естественно, не устраняя контекстуально ясный пол персонажа.
translation_notes:
  register: Современный литературный русский язык с простым, достойным повествовательным строем. Местоимение «Он» написано с прописной буквы по принятой русской библейской традиции; подлежащее восстановлено из контекста, как того требует русский синтаксис.
