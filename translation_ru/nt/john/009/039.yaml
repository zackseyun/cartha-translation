  text: καὶ εἶπεν ὁ Ἰησοῦς· Εἰς κρίμα ἐγὼ εἰς τὸν κόσμον τοῦτον ἦλθον, ἵνα οἱ μὴ βλέποντες βλέπωσιν καὶ οἱ βλέποντες τυφλοὶ γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/039.yaml
  text: And Jesus said[a], “For judgment I came into this world, so that those who do not see may see, and those who see may become blind.”
translation:
  language: ru
  text: 'И сказал Иисус: «Для суда[a] Я пришёл в этот мир, чтобы те, кто не видит, видели, а те, кто видит, стали слепыми».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для совершения суда». Греческое выражение может подчёркивать судебный результат прихода Иисуса, а не только осуждение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίμα
  choice: суд
  rationale: Передаёт судебный результат и разделяющее действие прихода Иисуса, не сужая смысл до одного лишь осуждения.
- source_word: κόσμον
  choice: мир
  rationale: Обычный и контекстуально уместный эквивалент κόσμος в Евангелии от Иоанна.
- source_word: οἱ μὴ βλέποντες / οἱ βλέποντες
  choice: невидящие / видящие
  rationale: Сохраняет параллелизм причастий и намеренную двусмысленность между физическим и духовным зрением.
- source_word: βλέπωσιν
  choice: видели
  rationale: Естественно передаёт сослагательное наклонение после ἵνα в целевой конструкции и сохраняет физический и духовный планы.
- source_word: τυφλοὶ γένωνται
  choice: стали слепы
  rationale: Сохраняет результативное значение γίνομαι и резкость судебного переворота.
- source_word: εἰς τὸν κόσμον τοῦτον ἦλθον
  choice: Я пришёл в этот мир
  rationale: Естественная русская передача конструкции и характерного для Иоанна языка прихода Иисуса в мир.
theological_decisions:
- issue: Соотношение с Ин. 3:17 («не судить мир»)
  choice: Сохранить «для суда», не сглаживая напряжение.
  alternative: Передать как «для разделения» или «для осуждения».
  rationale: 'κρίμα обозначает судебное различение и его результат: невидящие обретают зрение, а считающие себя видящими становятся слепы. «Разделение» ослабляет судебный оттенок, а «осуждение» чрезмерно сужает смысл.'
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и ясная формулировка. Субстантивированные причастия «невидящие» и «видящие» выбраны ради точного параллелизма и сохранения образной двусмысленности.
