  text: ἐκ τοῦ αἰῶνος οὐκ ἠκούσθη ὅτι ἠνέῳξέν τις ὀφθαλμοὺς τυφλοῦ γεγεννημένου·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/032.yaml
  text: From of old it has never been heard that anyone opened the eyes of one born blind[a].
translation:
  language: ru
  text: Испокон веков не слыхано, чтобы кто-нибудь открыл глаза слепорождённому.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «От начала мира не слыхано…»'
    reason: Лексическая альтернатива для ἐκ τοῦ αἰῶνος, более явно выражающая полный ход мировой истории.
lexical_decisions:
- source_word: ἐκ τοῦ αἰῶνος
  choice: Испокон веков
  rationale: Греческий оборот указывает на весь известный ход истории. Русское выражение естественно передаёт значение «с давних времён», не превращая слова говорящего в метафизическое утверждение о вечности.
- source_word: οὐκ ἠκούσθη
  choice: не слыхано
  rationale: Безличная пассивная конструкция по-русски естественно выражает отсутствие какого-либо известного или засвидетельствованного случая и сохраняет риторическую силу греческого аориста.
- source_word: ὅτι
  choice: чтобы
  rationale: После выражения «не слыхано» союз «чтобы» естественно вводит содержание того, о чём никогда не слышали.
- source_word: ἠνέῳξέν
  choice: открыл
  rationale: Сохраняется прямое значение глагола ἀνοίγω в устойчивом сочетании «открыть глаза»; вариант «вернул зрение» был бы более толковательным.
- source_word: τις
  choice: кто-нибудь
  rationale: Неопределённое местоимение в контексте отрицательного обобщения передаёт отсутствие любого подобного прецедента.
- source_word: ὀφθαλμοὺς
  choice: глаза
  rationale: Это обычное и точное русское соответствие; определённость в данном устойчивом сочетании отдельного выражения не требует.
- source_word: τυφλοῦ γεγεννημένου
  choice: слепорождённому
  rationale: Субстантивированное русское прилагательное кратко и точно обозначает человека, слепого от рождения, не добавляя отсутствующего в греческом существительного «мужчина».
theological_decisions:
- issue: Временной охват ἐκ τοῦ αἰῶνος
  choice: исторический оборот «испокон веков»
  alternative: «от начала мира»; «от вечности»
  rationale: В контексте исцелённый говорит об отсутствии известного людям прецедента, а не формулирует учение о вечности. Основной вариант сохраняет широкую риторическую формулировку, а более конкретное традиционное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Испокон веков» и «не слыхано» здесь являются понятными устойчивыми оборотами; «слепорождённому» сохраняет лаконичность греческой субстантивированной формы.
