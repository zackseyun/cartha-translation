  text: ἦν δὲ σάββατον ⸂ἐν ᾗ ἡμέρᾳ⸃ τὸν πηλὸν ἐποίησεν ὁ Ἰησοῦς καὶ ἀνέῳξεν αὐτοῦ τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/014.yaml
  text: It was a Sabbath on the day when Jesus made the mud and opened his eyes.
translation:
  language: ru
  text: А день, когда Иисус сделал глину[a] и открыл ему глаза[b], был субботой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грязь».'
    reason: lexical_alternative
  - marker: b
    text: 'Дословно: «открыл его глаза» — конкретное выражение, обозначающее исцеление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σάββατον
  choice: субботой
  rationale: Передаёт календарное обозначение дня и естественно сочетается в русском языке со связкой «был».
- source_word: ἐν ᾗ ἡμέρᾳ
  choice: день, когда
  rationale: Естественная современная передача относительного оборота с сохранением временного значения.
- source_word: πηλόν
  choice: грязь
  rationale: В данном контексте речь идёт о смеси земли со слюной; «грязь» звучит естественно, тогда как «глина» остаётся допустимой альтернативой.
- source_word: ἐποίησεν
  choice: сделал
  rationale: Прямо и без излишней конкретизации передаёт обычное значение ποιέω.
- source_word: ἀνέῳξεν αὐτοῦ τοὺς ὀφθαλμούς
  choice: открыл ему глаза
  rationale: Сохраняет конкретный образ оригинала и одновременно естественно обозначает исцеление слепого.
- source_word: δὲ
  choice: А
  rationale: Передаёт мягкий повествовательный переход и связь с предыдущим сообщением, не придавая фразе сильного противопоставления.
theological_decisions:
- issue: Упоминание субботы в связи с исцелением, совершённым Иисусом
  choice: Передать это как простой временной факт, подготавливающий последующий спор.
  alternative: Добавить пояснение о нарушении или соблюдении субботнего закона.
  rationale: Сам стих не выносит богословской или правовой оценки поступка Иисуса, поэтому напряжение повествования следует сохранить, не разрешая его пояснением переводчика.
translation_notes:
  register: Современный литературный русский язык; повествовательный стиль простой и достойный. Начальное «А» передаёт слабую связующую функцию δέ. Порядок частей перестроен ради естественного русского синтаксиса и ясного акцента на том, что день исцеления был субботой.
