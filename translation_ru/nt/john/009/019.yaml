  text: καὶ ἠρώτησαν αὐτοὺς λέγοντες· Οὗτός ἐστιν ὁ υἱὸς ὑμῶν, ὃν ὑμεῖς λέγετε ὅτι τυφλὸς ἐγεννήθη; πῶς οὖν ⸂βλέπει ἄρτι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/019.yaml
  text: And they asked them, saying, “Is this your son, whom you say was born blind? How then does he now see?”
translation:
  language: ru
  text: 'Они спросили их: «Это ваш сын, о котором вы говорите, что он родился слепым? Как же он теперь видит?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησαν αὐτοὺς λέγοντες
  choice: Они спросили их
  rationale: Естественно передаёт основной глагол и вводит прямую речь; отдельное «говоря» в современном русском было бы избыточным.
- source_word: Οὗτός ἐστιν ὁ υἱὸς ὑμῶν
  choice: Это ваш сын?
  rationale: Формально греческая конструкция повествовательная, но контекст и пунктуация показывают вопрос; русский вопросительный порядок слов звучит естественно.
- source_word: ὃν ὑμεῖς λέγετε
  choice: о котором вы говорите
  rationale: Сохраняет нейтральность λέγετε и выраженное местоимением ὑμεῖς смысловое ударение, не добавляя скептического оттенка слова «утверждаете».
- source_word: τυφλὸς ἐγεννήθη
  choice: родился слепым
  rationale: Точная и общепринятая русская передача врождённой слепоты.
- source_word: πῶς οὖν
  choice: Как же
  rationale: Частица «же» естественно передаёт выводно-контрастную силу οὖν в данном вопросе.
- source_word: βλέπει ἄρτι
  choice: теперь видит
  rationale: Передаёт нынешний факт зрения в противопоставлении прежней слепоте, не смещая значение к одной лишь способности видеть.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествование передано ясно и сдержанно. Конструкция «спросили их» сохраняет множественное число адресатов, то есть родителей, из ближайшего контекста.
