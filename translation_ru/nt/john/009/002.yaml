  terminology: «Ученики», «согрешил», «родители», «слепым» уместны и точны. «Равви» корректно сохраняет исторически специфическую форму обращения. Написание «Его» с прописной буквы соответствует заявленной редакционной традиции и не затрагивает исходный смысл.
