  source_fidelity: Перевод точно передаёт участников, вопрос о предполагаемом согрешении и связь, которую ученики предполагают между грехом и врождённой слепотой. «Что он родился слепым» — естественная русская передача ἵνα в данном контексте и не навязывает однозначно ни целевого, ни чисто результативного значения.
