id: JHN.9.2
reference: John 9:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν οἱ μαθηταὶ αὐτοῦ λέγοντες· Ῥαββί, τίς ἥμαρτεν, οὗτος ἢ οἱ γονεῖς αὐτοῦ, ἵνα τυφλὸς γεννηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/002.yaml
  text: And his disciples asked him[a], saying, “Rabbi, who sinned, this man or his parents, that he should be born blind?”
translation:
  language: ru
  text: 'Ученики спросили Его: «Равви, кто согрешил — он или его родители, что он родился слепым?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы он родился слепым?» Греческий оборот может выражать предполагаемую учениками связь цели или результата.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρώτησαν
  choice: спросили
  rationale: Аорист ἐρωτάω вводит обычный прямой вопрос; «спросили» естественно и не добавляет оттенка допроса или особой настойчивости.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Его ученики
  rationale: «Ученики» — принятое и точное обозначение последователей учителя; притяжательное местоимение сохраняет αὐτοῦ.
- source_word: λέγοντες
  choice: двоеточие перед прямой речью
  rationale: В современном русском отдельное «говоря» здесь тяжеловесно; двоеточие естественно передаёт функцию причастия, вводящего прямую речь.
- source_word: Ῥαββί
  choice: Равви
  rationale: Сохраняет исторически конкретную иудейскую форму обращения, понятную русскому читателю, вместо общего «Учитель».
- source_word: τίς ἥμαρτεν
  choice: кто согрешил
  rationale: Прямо передаёт вопрос о том, на ком лежит предполагаемая вина.
- source_word: οὗτος
  choice: он
  rationale: В русском контексте указательное «этот» при обращении к присутствующему человеку звучало бы отчуждённо; «он» ясно указывает на слепого мужчину.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: его родители
  rationale: Стандартный и естественный эквивалент, сохраняющий притяжательное местоимение.
- source_word: ἵνα ... γεννηθῇ
  choice: что он родился
  rationale: Русская конструкция сохраняет предполагаемую учениками связь между грехом и врождённой слепотой, не сводя ἵνα однозначно ни к цели, ни к простому следствию.
- source_word: τυφλὸς
  choice: слепым
  rationale: Творительный падеж естественно передаёт предикативное состояние при рождении.
theological_decisions:
- issue: Оттенок ἵνα в вопросе о грехе и врождённой слепоте
  choice: «что он родился слепым»
  alternative: «чтобы он родился слепым»; «так что он родился слепым»
  rationale: Фраза передаёт заложенную в вопросе учеников связь, но не выдаёт их предположение за одобренное рассказчиком богословское утверждение. Более целевое и более результативное понимания отмечены, а напряжение текста сохранено.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельского повествования. Синтаксис прямой и общепонятный; «Равви» сохраняет историческую окраску. Местоимение «Его» написано с прописной буквы в соответствии с принятой русской библейской издательской традицией.
