  source_fidelity: 'Текст точно передаёт ход мысли греческого оригинала: οὖν передано связкой «же», отрицание ἐπίστευσαν — «не поверили», содержание придаточного ὅτι сохранено, а ἕως ὅτου корректно передано конструкцией «пока не». Формулировка «не поверили, что он был слеп и прозрел» естественно включает значение περὶ αὐτοῦ в русской синтаксической структуре, без ненужного утяжеления «о нём». «Родителей прозревшего» верно воспроизводит повторное определение τοῦ ἀναβλέψαντος.'
