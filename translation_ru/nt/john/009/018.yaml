  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οὐκ ἐπίστευσαν οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι ⸂ἦν τυφλὸς⸃ καὶ ἀνέβλεψεν, ἕως ὅτου ἐφώνησαν τοὺς γονεῖς αὐτοῦ ⸂τοῦ ἀναβλέψαντος⸃
base_translation:
  language: en
  yaml_path: translation/nt/john/009/018.yaml
  text: So the Jews did not believe concerning him that he had been blind and had received sight[a], until they called the parents of the one who had received sight.
translation:
  language: ru
  text: Иудеи же не поверили, что он был слеп и прозрел, пока не позвали родителей прозревшего.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В данном контексте под «иудеями», возможно, подразумеваются иудейские начальники; в других контекстах это слово может означать жителей Иудеи.
    reason: Пояснение контекстуальной неоднозначности οἱ Ἰουδαῖοι и предотвращение необоснованного обобщения обо всём еврейском народе.
lexical_decisions:
- source_word: ἐπίστευσαν
  choice: не поверили
  rationale: Глагол с придаточным, вводимым ὅτι, означает непризнание сообщения истинным; «не поверили» естественно передаёт это значение.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Сохраняет прямо выраженное в греческом тексте обозначение, не сужая его в основном тексте до руководителей; возможный контекстуальный смысл пояснён в сноске.
- source_word: περὶ αὐτοῦ ὅτι
  choice: что он
  rationale: Русская конструкция «не поверили, что он…» естественно передаёт содержание сомнения; отдельное «о нём» было бы тяжеловесным и избыточным.
- source_word: ἦν τυφλὸς
  choice: был слеп
  rationale: Точно передаёт имперфект и предшествующее состояние человека без ненужного усложнения русской временной формы.
- source_word: ἀνέβλεψεν
  choice: прозрел
  rationale: В контексте исцеления «прозрел» кратко и естественно означает, что слепой обрёл зрение, не подразумевая обязательно, что прежде он когда-либо видел.
- source_word: ἕως ὅτου
  choice: пока не
  rationale: Обычный русский способ обозначить временной предел действия при последующем событии.
- source_word: ἐφώνησαν
  choice: позвали
  rationale: Передаёт значение «позвать/вызвать» без излишне официального оттенка слова «призвали».
- source_word: τοὺς γονεῖς αὐτοῦ τοῦ ἀναβλέψαντος
  choice: родителей прозревшего
  rationale: Естественно и сжато передаёт родителей того самого человека, который обрёл зрение; местоимение «его» в русском здесь необязательно.
theological_decisions:
- issue: Референт οἱ Ἰουδαῖοι в Евангелии от Иоанна
  choice: иудеи
  alternative: иудейские начальники; жители Иудеи
  rationale: Основной текст сохраняет неоднозначность греческого выражения и не вводит более узкий референт. Контекст допускает, что речь идёт о представителях иудейской власти, поэтому это отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Прозрел» сохраняет лаконичность повторяющегося греческого глагола; причастная конструкция «родителей прозревшего» звучит естественно и не добавляет отсутствующих в источнике деталей.
