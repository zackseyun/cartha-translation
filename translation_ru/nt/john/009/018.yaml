  terminology: «Иудеи» сохраняет формулировку оригинала, не вводя в основной текст спорное сужение до руководителей. Сноска корректно указывает на вероятный контекстуальный референт и на возможность значения, связанного с Иудеей, не утверждая его как единственно верное. Анкер сноски поставлен корректно.
