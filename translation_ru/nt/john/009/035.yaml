  text: ⸀Ἤκουσεν Ἰησοῦς ὅτι ἐξέβαλον αὐτὸν ἔξω, καὶ εὑρὼν αὐτὸν ⸀εἶπεν· Σὺ πιστεύεις εἰς τὸν υἱὸν τοῦ ⸀ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/035.yaml
  text: Jesus heard that they had thrown him out[a], and when he found him, he said, “Do you believe in the Son of Man?”
translation:
  language: ru
  text: 'Иисус услышал, что его выгнали вон[a], и, найдя его, спросил: «Ты веришь в Сына Человеческого?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «Сына Божьего» вместо «Сына Человеческого».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: его выгнали
  rationale: Сочетание ἐκβάλλω с ἔξω подчёркивает изгнание; «выгнали» естественно звучит по-русски и передаёт исключение человека из общины в данном контексте.
- source_word: εὑρὼν αὐτόν
  choice: найдя его
  rationale: Деепричастный оборот кратко и естественно передаёт предшествующее действие аористного причастия, не делая хронологическую связь чрезмерно жёсткой.
- source_word: εἶπεν
  choice: спросил
  rationale: Хотя буквально глагол означает «сказал», следующая прямая речь является вопросом, поэтому «спросил» — естественный и точный русский эквивалент в этом контексте.
- source_word: Σὺ πιστεύεις
  choice: Ты веришь
  rationale: Именное местоимение Σὺ выражено явно и несёт акцент; русское «Ты веришь…?» естественно сохраняет этот акцент.
- source_word: πιστεύεις εἰς
  choice: веришь в
  rationale: Конструкция πιστεύω εἰς обозначает веру и личное доверие, направленные на кого-либо; «верить в» является обычным русским соответствием.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Сына Человеческого
  rationale: Устоявшаяся передача титула сохраняет его связь с Дан 7 и характерное употребление в Евангелии от Иоанна.
theological_decisions:
- issue: Вариант христологического титула в вопросе
  choice: Сына Человеческого
  alternative: Сына Божьего
  rationale: Основной текст SBLGNT читает ἀνθρώπου («Человеческого»). Значимый вариант θεοῦ («Божьего») не принят в основной текст, но отмечен в сноске без попытки устранить текстологическое и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык; формулировка естественная, ясная и достоинственная. «Выгнали» сохраняет силу исходного выражения без архаичного «изгнали», а традиционный титул «Сын Человеческий» оставлен ради точности и узнаваемых межтекстовых связей.
