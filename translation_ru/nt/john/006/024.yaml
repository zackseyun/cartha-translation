source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδεν ὁ ὄχλος ὅτι Ἰησοῦς οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ, ἐνέβησαν αὐτοὶ εἰς τὰ ⸀πλοιάρια καὶ ἦλθον εἰς Καφαρναοὺμ ζητοῦντες τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/024.yaml
  text: So when the crowd saw that Jesus was not there[a], nor his disciples, they themselves got into the boats and came to Capernaum, looking for Jesus.
translation:
  language: ru
  text: Когда же толпа увидела, что там нет ни Иисуса, ни Его учеников, люди сами сели в лодки[a] и прибыли в Капернаум, разыскивая Иисуса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «небольшие лодки»; в греческом тексте употреблена уменьшительная форма слова «лодка».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Когда же
  rationale: Передаёт временное значение ὅτε и повествовательно-связующее значение οὖν естественным для современного русского оборотом.
- source_word: ὁ ὄχλος
  choice: толпа
  rationale: Точно обозначает собравшуюся массу людей и сохраняет конкретный повествовательный образ.
- source_word: εἶδεν
  choice: увидела
  rationale: Сохраняет прямое значение глагола и не усиливает его до «поняла» или «осознала».
- source_word: οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ
  choice: там нет ни Иисуса, ни Его учеников
  rationale: Естественная русская отрицательная конструкция, равно относящая отсутствие и к Иисусу, и к ученикам; настоящее время соответствует греческому ἔστιν и естественно после «увидела».
- source_word: ἐνέβησαν αὐτοὶ
  choice: люди сами сели
  rationale: «Сели» естественно описывает посадку в лодки, а «сами» сохраняет эмфатическое αὐτοί. Слово «люди» позволяет передать греческое множественное число при собирательном подлежащем «толпа» без ненормативного согласования.
- source_word: τὰ πλοιάρια
  choice: лодки
  rationale: В основном тексте употреблено естественное общее обозначение; возможный уменьшительный оттенок греческой формы сохранён в сноске.
- source_word: ἦλθον εἰς Καφαρναούμ
  choice: прибыли в Капернаум
  rationale: «Прибыли» нейтрально передаёт достижение места назначения и избегает ненужного выбора между русскими дейктическими «пришли» и «отправились».
- source_word: ζητοῦντες τὸν Ἰησοῦν
  choice: разыскивая Иисуса
  rationale: Передаёт конкретный поиск человека в данном повествовательном контексте, не привнося отвлечённого духовного оттенка слова «искать».
theological_decisions: []
