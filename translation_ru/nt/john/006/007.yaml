  yaml_path: translation/nt/john/006/007.yaml
  text: Philip answered him, “Two hundred denarii worth of bread is not enough for them, so that each one may receive a little.”
translation:
  language: ru
  text: 'Филипп ответил Ему: «Хлеба на двести динариев не хватит, чтобы каждому досталось понемногу».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διακοσίων δηναρίων ἄρτοι
  choice: даже на двести динариев хлеба
  rationale: Родительный цены передан естественной русской конструкцией «хлеба на двести динариев»; частица «даже» ясно выражает подразумеваемую недостаточность столь большой суммы в данном отрицательном высказывании.
- source_word: οὐκ ἀρκοῦσιν αὐτοῖς
  choice: не хватит
  rationale: Глагол ἀρκέω здесь означает достаточность количества; безличное русское «не хватит» звучит естественно и сохраняет смысл.
- source_word: ἵνα ἕκαστος βραχύ τι λάβῃ
  choice: чтобы каждому досталось хотя бы понемногу
  rationale: ἵνα передано целевым «чтобы», ἕκαστος — распределительным «каждому», а βραχύ τι — идиоматичным «хотя бы понемногу», подчеркивающим малость доли.
theological_decisions:
- issue: Связь придаточного с ἵνα
  choice: чтобы каждому досталось
  alternative: так что каждый получил бы
  rationale: Сохранено целевое/результативно-целевое звучание ἵνα без догматического уточнения; в контексте речь идет о количестве хлеба, необходимом для раздачи каждому.
translation_notes:
  register: Современный литературный русский язык; прямая речь звучит естественно и достойно. «Динарий» сохранен как историческая денежная единица, без добавления спорного современного эквивалента.
