translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сложная синтаксическая структура греческого предложения сохранена, но причастный оборот передан придаточным. «Люди» звучит естественнее, чем повторное «толпа» при дальнейшем множественном сказуемом. Местоимения, относящиеся к Иисусу, оформлены с традиционной прописной буквы.
