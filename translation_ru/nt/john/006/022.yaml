  text: Τῇ ἐπαύριον ὁ ὄχλος ὁ ἑστηκὼς πέραν τῆς θαλάσσης ⸀εἶδον ὅτι πλοιάριον ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ⸀ἕν, καὶ ὅτι οὐ συνεισῆλθεν τοῖς μαθηταῖς αὐτοῦ ὁ Ἰησοῦς εἰς τὸ ⸀πλοῖον ἀλλὰ μόνοι οἱ μαθηταὶ αὐτοῦ ἀπῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/022.yaml
  text: On the next day[a], the crowd that had been standing on the other side of the sea saw that no other small boat had been there except one, and that Jesus had not gone with his disciples into the boat[b], but that his disciples had gone away alone.
translation:
  language: ru
  text: На следующий день люди, находившиеся на другом берегу моря, увидели, что там не было другой лодки, кроме одной[a], и что Иисус не вошёл вместе со Своими учениками в лодку[b], но ученики Его ушли одни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «судно». Греческое πλοιάριον имеет уменьшительную форму и может обозначать небольшую лодку.'
    reason: lexical_alternative
  - marker: b
    text: В первом случае греческий текст имеет πλοιάριον («небольшая лодка»), а здесь — πλοῖον («лодка, судно»). В рукописях и изданиях в этом стихе встречаются варианты между этими словами.
    reason: textual_variant
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: На следующий день
  rationale: Естественная русская передача обстоятельственного выражения времени, обозначающего переход к событиям следующего дня.
- source_word: ὁ ὄχλος ὁ ἑστηκὼς
  choice: люди, остававшиеся
  rationale: Собирательное ὄχλος передано естественным для контекста словом «люди», а перфектное причастие ἑστηκώς — как продолжавшееся пребывание на месте, а не буквально как поза стоя.
- source_word: πέραν τῆς θαλάσσης
  choice: на другом берегу моря
  rationale: Передаёт местонахождение по ту сторону моря ясно и естественно для русской географической речи.
- source_word: εἶδον
  choice: увидели
  rationale: Сохраняет основное значение зрительного восприятия; содержание наблюдения раскрывают следующие придаточные с ὅτι.
- source_word: πλοιάριον
  choice: лодки
  rationale: В современном русском «лодка» уже обычно обозначает небольшое судно; «маленькая лодка» могло бы чрезмерно подчеркнуть размер, поскольку уменьшительная форма в койне не всегда несёт сильный уменьшительный оттенок.
- source_word: ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ἕν
  choice: там не было другой лодки, кроме одной
  rationale: Сохраняет исключительную конструкцию и её несколько необычную формулировку без добавления отсутствующих в греческом пояснений.
- source_word: συνεισῆλθεν
  choice: не сел ... вместе
  rationale: В контексте лодки русское «сесть в лодку вместе» естественно передаёт буквальное «не вошёл вместе».
- source_word: εἰς τὸ πλοῖον
  choice: в лодку
  rationale: Естественный русский эквивалент πλοῖον; различие с уменьшительной формой πλοιάριον отмечено в сноске.
- source_word: μόνοι
  choice: одни
  rationale: Кратко и точно подчёркивает, что ученики отплыли без Иисуса.
- source_word: ἀπῆλθον
  choice: отплыли
  rationale: 'Контекстуально конкретизирует общее «ушли»: ученики удалились на лодке; это естественная русская формулировка.'
