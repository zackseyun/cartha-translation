  text: λέγει αὐτῷ εἷς ἐκ τῶν μαθητῶν αὐτοῦ, Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/008.yaml
  text: One of his disciples, Andrew, Simon Peter’s brother, said to him,
translation:
  language: ru
  text: 'Один из Его учеников, Андрей, брат Симона Петра, сказал Ему:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: сказал
  rationale: Греческий исторический презенс естественно передан русским прошедшим временем, обычным для последовательного повествования.
- source_word: αὐτῷ
  choice: Ему
  rationale: Дательный падеж обозначает адресата речи; в контексте местоимение относится к Иисусу.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: Один из Его учеников
  rationale: Естественная русская передача партитивной конструкции εἷς ἐκ с родительным падежом множественного числа.
- source_word: μαθητῶν
  choice: учеников
  rationale: Слово «ученики» в евангельском контексте сохраняет значение людей, следующих за учителем и принимающих его наставление.
- source_word: Ἀνδρέας
  choice: Андрей
  rationale: Использована устоявшаяся русская форма библейского имени.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: брат Симона Петра
  rationale: Приложение точно и естественно передаёт родственную идентификацию Андрея.
- source_word: Σίμωνος Πέτρου
  choice: Симона Петра
  rationale: Оба имени вместе переданы как привычное двойное именование одного человека.
