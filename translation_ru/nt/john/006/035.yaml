  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀Εἶπεν αὐτοῖς ὁ Ἰησοῦς· Ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς· ὁ ἐρχόμενος πρὸς ἐμὲ οὐ μὴ πεινάσῃ, καὶ ὁ πιστεύων εἰς ⸀ἐμὲ οὐ μὴ ⸀διψήσει πώποτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/035.yaml
  text: Jesus said to them, “I am the bread of life; the one who comes to me will never hunger, and the one who believes in me will never thirst again.”
translation:
  language: ru
  text: 'Иисус сказал им: «Я — хлеб жизни. Тот, кто приходит ко Мне, никогда не будет голоден, и тот, кто верит в Меня, никогда не будет испытывать жажды[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «ни в коем случае не будет жаждать когда-либо»; в греческом здесь употреблено усиленное отрицание вместе со словом «когда-либо».'
    reason: Сохраняет для читателя особую силу сочетания οὐ μή и πώποτε и показывает, что смысл — «никогда», а не «никогда больше».
lexical_decisions:
- source_word: Εἶπεν αὐτοῖς
  choice: сказал им
  rationale: Естественная передача повествовательного аориста λέγω и дательного косвенного дополнения без излишнего уточнения.
- source_word: Ἐγώ εἰμι
  choice: Я —
  rationale: Именное предложение с тире естественно передаёт по-русски прямое и подчёркнутое самоотождествление; отдельное «Сам» добавило бы не требуемый контекстом оттенок противопоставления.
- source_word: ὁ ἄρτος τῆς ζωῆς
  choice: хлеб жизни
  rationale: Сохраняет образ и неоднозначность родительного оборота, не сводя его к толкованию «хлеб, дающий жизнь».
- source_word: ὁ ἐρχόμενος πρὸς ἐμέ
  choice: тот, кто приходит ко Мне
  rationale: Передаёт субстантивированное причастие настоящего времени как обобщённое, продолжающееся действие; πρός выражено естественным направительным оборотом.
- source_word: οὐ μὴ πεινάσῃ
  choice: никогда не будет голоден
  rationale: Выражает усиленное отрицание οὐ μή естественным современным русским языком.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: тот, кто верит в Меня
  rationale: «Верит в Меня» — прозрачная и устойчивая передача иоанновского πιστεύω εἰς; она сохраняет богословскую формулировку, не сужая её до одного оттенка доверия.
- source_word: οὐ μὴ διψήσει πώποτε
  choice: никогда не будет испытывать жажды
  rationale: Передаёт и усиленное отрицание οὐ μή, и временное усиление πώποτε («когда-либо»), не внося отсутствующего в греческом значения «снова».
theological_decisions:
- issue: Метафора ὁ ἄρτος τῆς ζωῆς
  choice: хлеб жизни
  alternative: хлеб, дающий жизнь
  rationale: Буквенная структура сохраняет возможные смысловые отношения между хлебом и жизнью и не подменяет метафору одним истолкованием.
- issue: Значение πιστεύων εἰς ἐμέ
  choice: тот, кто верит в Меня
  alternative: тот, кто доверяет Мне
  rationale: Основной вариант сохраняет характерную для Евангелия от Иоанна формулу и её богословскую широту; «доверяет Мне» передаёт важный оттенок, но может звучать уже.
- issue: Сила Ἐγώ εἰμι
  choice: Я —
  alternative: Я Сам —
  rationale: Прямое самоотождествление сохранено без добавочного толкования и без искусственного усиления местоимением «Сам».
- issue: Отрицание οὐ μὴ διψήσει πώποτε
  choice: никогда не будет испытывать жажды
  alternative: ни в коем случае никогда не будет испытывать жажды
  rationale: Основной текст естественно выражает абсолютное временное отрицание; более буквальное удвоенное усиление по-русски тяжеловесно и вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксический параллелизм двух частей сохранён. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской издательской традиции; это орфографическое уважительное оформление, а не дополнительное толкование.
