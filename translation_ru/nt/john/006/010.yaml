  yaml_path: translation/nt/john/006/010.yaml
  text: Jesus said, “Have the people sit down.” Now there was plenty of grass in the place. So the men sat down, about five thousand in number.
translation:
  language: ru
  text: 'Иисус сказал: «Усадите людей»[a]. На том месте было много травы. Итак, мужчины сели; их было около пяти тысяч.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Усадите людей, чтобы они возлегли». Этот глагол может обозначать возлежание за трапезой; здесь он описывает, как люди расположились на траве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν
  choice: Пусть люди сядут
  rationale: Каузативная конструкция с ποιέω и инфинитивом передаёт распоряжение усадить людей; русское «пусть… сядут» звучит естественно и сохраняет побудительную силу.
- source_word: τοὺς ἀνθρώπους
  choice: люди
  rationale: ἄνθρωποι обозначает собравшихся в целом, без указания исключительно на мужчин; это сохраняет отличие от последующего οἱ ἄνδρες.
- source_word: ἀναπεσεῖν / ἀνέπεσαν
  choice: сесть / сели
  rationale: Глагол может описывать возлежание за трапезой, однако в русском повествовании о размещении толпы на траве «сесть» естественно передаёт действие без излишней культурной конкретизации.
- source_word: χόρτος πολὺς
  choice: много травы
  rationale: Прямое и естественное соответствие, передающее обилие травы.
- source_word: ἐν τῷ τόπῳ
  choice: на том месте
  rationale: Естественная русская локативная конструкция, сохраняющая указание на конкретное место.
- source_word: οἱ ἄνδρες
  choice: мужчины
  rationale: ἀνήρ здесь обозначает именно мужчин; перевод сохраняет намеренное отличие от более общего ἄνθρωποι.
- source_word: τὸν ἀριθμὸν ὡς πεντακισχίλιοι
  choice: их было около пяти тысяч
  rationale: «Около» передаёт приблизительность ὡς, а русская конструкция ясно и естественно выражает численность.
theological_decisions:
- issue: Относится ли число около пяти тысяч ко всей толпе или конкретно к мужчинам
  choice: 'Сохранить различие: сначала «люди», затем «мужчины»; число грамматически относится к мужчинам.'
  alternative: Передать оба греческих существительных общим словом «люди» и тем самым отнести число ко всей толпе.
  rationale: В греческом тексте происходит лексический переход от общего ἀνθρώπους к обозначающему мужчин ἄνδρες. Его следует сохранить, не сглаживая состав и способ подсчёта толпы.
translation_notes:
  register: Современный литературный русский язык; ясный и dignified повествовательный стиль. «Сядут / сели» выбрано вместо более исторически конкретного, но менее естественного в данном контексте «возлягут / возлегли». Различие между «люди» и «мужчины» сохранено.
