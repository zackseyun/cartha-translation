  text: τοῦτο δέ ἐστιν τὸ θέλημα τοῦ πέμψαντός ⸀με ἵνα πᾶν ὃ δέδωκέν μοι μὴ ἀπολέσω ἐξ αὐτοῦ ἀλλὰ ἀναστήσω ⸀αὐτὸ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/039.yaml
  text: 'And this is the will of the one who sent me: that I should lose nothing of all that he has given me[a], but should raise it up on the last day.'
translation:
  language: ru
  text: 'И вот в чём воля Пославшего меня: чтобы я ничего не потерял из всего, что Он дал мне[a], но воскресил его в последний день.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с более явным указанием на людей: «всех, кого Он дал мне, — никого из них не потерял, но воскресил их». В греческом употреблено собирательное выражение среднего рода, буквально: «всё, что… его».'
    reason: alternative_reading
lexical_decisions:
- source_word: θέλημα
  choice: воля
  rationale: Обычное и точное обозначение намерения Бога; не сужает смысл до простого желания или заранее установленного плана.
- source_word: τοῦ πέμψαντός με
  choice: Пославшего меня
  rationale: Субстантивированное причастие передано естественной русской конструкцией, сохраняющей действие и отношение между Пославшим и Посланным.
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт содержание воли и сохраняет присущий конструкции оттенок цели.
- source_word: πᾶν ὃ δέδωκέν μοι
  choice: всего, что Он дал мне
  rationale: Сохраняет средний род и собирательное единственное число греческого выражения, не заменяя его сразу личным «всех, кого».
- source_word: δέδωκέν
  choice: дал
  rationale: В русском контексте совершенный вид естественно выражает завершённую передачу с сохраняющимся результатом; форма «дал» звучит лучше буквального перфекта «отдал» или «вручил».
- source_word: μὴ ἀπολέσω ἐξ αὐτοῦ
  choice: я ничего не потерял из всего
  rationale: Здесь ἀπόλλυμι означает потерять, а ἐξ αὐτοῦ указывает, что ничто из данного не должно быть утрачено.
- source_word: ἀναστήσω αὐτὸ
  choice: воскресил всё это
  rationale: «Воскресил» ясно передаёт эсхатологическое значение ἀνίστημι, а «всё это» сохраняет соотнесённость местоимения среднего рода с собирательным даром, хотя личный референт раскрывается из контекста.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: в последний день
  rationale: Естественная русская формулировка, сохраняющая эсхатологический смысл и характерный для Евангелия оборот.
theological_decisions:
- issue: Передавать ли собирательный объект лично («всех, кого») или сохранять греческие формы среднего рода («всё, что»).
  choice: «всего, что Он дал мне… воскресил всё это»
  alternative: «всех, кого Он дал мне… воскресил их»
  rationale: В греческом стоят формы среднего рода единственного числа πᾶν, ὃ и αὐτό. Основной текст сохраняет эту грамматическую и богословскую напряжённость, а более личное и естественное по-русски понимание вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной синтаксической формой. Заглавные буквы в «Пославшего» и «Он» помогают ясно обозначить Отца, тогда как местоимения Иисуса переданы со строчной буквы в соответствии с прямой речью и современной русской практикой. Несколько необычное «воскресил всё это» намеренно сохраняет собирательный средний род оригинала; примечание даёт более естественную личную формулировку.
