  yaml_path: translation/nt/john/006/009.yaml
  text: There is a boy here who has five barley loaves and two fish[a], but what are these for so many?
translation:
  language: ru
  text: Здесь есть мальчик, у которого пять ячменных хлебов и две рыбы. Но что это для такого множества людей?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но разве этого хватит на столько людей?»'
    reason: 'Лексико-синтаксическая альтернатива: вопрос ταῦτα τί ἐστιν εἰς τοσούτους можно естественно передать как оценку достаточности, тогда как основной текст сохраняет более буквальную риторическую форму.'
lexical_decisions:
- source_word: παιδάριον
  choice: мальчик
  rationale: Слово обозначает ребёнка или юношу; «мальчик» естественно в современном русском и не усиливает без необходимости оттенок малости.
- source_word: ὧδε
  choice: здесь
  rationale: Прямой и естественный перевод наречия места.
- source_word: ὃς ἔχει
  choice: у которого
  rationale: Русская конструкция принадлежности звучит естественнее буквального «который имеет».
- source_word: ἄρτους κριθίνους
  choice: ячменных хлебов
  rationale: Передаёт и ἄρτους — отдельные хлебы или буханки, и определение κριθίνους — «ячменные»; формулировка соответствует библейскому контексту и остаётся понятной.
- source_word: ὀψάρια
  choice: рыбки
  rationale: В данном контексте речь о рыбе, которую едят с хлебом. «Рыбки» естественно сочетается с числительным «две» и допускает присущий форме слова оттенок небольшого размера, не превращая его в отдельное смысловое утверждение.
- source_word: ἀλλὰ
  choice: но
  rationale: Прямо выражает противопоставление между имеющейся пищей и множеством людей.
- source_word: ταῦτα τί ἐστιν
  choice: что это
  rationale: Сохраняет образную и риторическую форму греческого вопроса. Русское единственное «это» естественно обобщает перечисленную пищу.
- source_word: εἰς τοσούτους
  choice: для такого множества людей
  rationale: Передаёт отношение имеющегося количества пищи к многочисленной толпе, не заменяя риторический вопрос явным утверждением о недостаточности.
