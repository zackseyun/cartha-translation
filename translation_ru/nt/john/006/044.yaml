base_translation:
  language: en
  yaml_path: translation/nt/john/006/044.yaml
  text: No one is able to come to me unless the Father who sent me draws him[b][a], and I will raise him up on the last day.
translation:
  language: ru
  text: Никто не может прийти ко Мне, если только Отец, пославший Меня, не привлечёт его[a][b], и Я воскрешу его в последний день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не потянет его к Себе», «не повлечёт его»; греческий глагол может передавать более сильное действие — вплоть до «тащить». В основном тексте стоит «привлечёт», чтобы не предрешать, каким именно образом Отец приводит человека к Сыну.'
    reason: lexical_alternative
  - marker: b
    text: 'Местоимение «его» соответствует мужскому роду в греческом тексте, но употреблено обобщённо: сказанное относится к любому человеку, а не только к мужчинам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δύναται
  choice: Никто не может
  rationale: Естественно передаёт всеобщее отрицание и прямо выраженную неспособность, не ослабляя её до простой маловероятности.
- source_word: ἐλθεῖν πρός με
  choice: прийти ко Мне
  rationale: Сохраняет образ движения к Иисусу и его контекстуальный духовный смысл, не заменяя образ толкованием.
- source_word: ἐὰν μὴ
  choice: если … не
  rationale: В данном порядке слов это естественный русский эквивалент ограничительного условия «если только не / если не».
- source_word: ὁ πατὴρ ὁ πέμψας με
  choice: Отец, пославший Меня
  rationale: Причастный оборот точно и естественно передаёт определительное греческое причастие.
- source_word: ἑλκύσῃ
  choice: привлечёт
  rationale: Сохраняет принятую в русском библейском языке идею направляющего действия Отца, не предрешая спорный вопрос о характере этого действия; более сильные оттенки глагола отмечены в сноске.
- source_word: αὐτόν
  choice: его
  rationale: Передаёт мужской род и единственное число греческого местоимения; его обобщающее значение разъяснено в сноске.
- source_word: κἀγὼ ἀναστήσω αὐτόν
  choice: и Я воскрешу его
  rationale: Передаёт соединение καί с явно выраженным ἐγώ и однозначный в контексте смысл воскресения из мёртвых.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: в последний день
  rationale: Устойчивое и понятное современному читателю обозначение эсхатологического последнего дня.
theological_decisions:
- issue: Значение ἑλκύσῃ в сотериологически спорном контексте
  choice: привлечёт
  alternative: потянет; повлечёт; потащит
  rationale: Глагол способен обозначать сильное тянущее действие, однако сам стих не объясняет способ действия Отца. Основной текст сохраняет богословское напряжение, а более сильные лексические варианты вынесены в сноску.
- issue: Обобщающее значение местоимения αὐτόν
  choice: его
  alternative: этого человека
  rationale: Форма оригинала — мужской род, единственное число, но в высказывании она имеет представительное значение и относится к любому человеку. Сноска предотвращает ошибочное ограничение только мужчинами.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан естественным для русского языка; прописные буквы в местоимениях «Мне», «Меня», «Я» следуют распространённой русской библейской традиции. Точка с запятой ясно отделяет обещание воскресения от условной части, не разрывая единого высказывания.
