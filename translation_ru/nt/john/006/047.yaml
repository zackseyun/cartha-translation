base_translation:
  language: en
  yaml_path: translation/nt/john/006/047.yaml
  text: Truly[a], truly, I say to you[b], the one who believes has eternal life.
translation:
  language: ru
  text: 'Истинно, истинно говорю вам: тот, кто верит, имеет вечную жизнь.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Истинно, истинно
  rationale: Сохраняет торжественную формулу, её повтор и усилительную силу в естественном, достойном русском языке.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямо передаёт настоящее время глагола и дательный падеж местоимения, сохраняя характерный для Иоанна ритм.
- source_word: ὁ πιστεύων
  choice: верующий
  rationale: 'Русское субстантивированное причастие естественно передаёт греческое причастие настоящего времени с артиклем: человека, для которого вера является характеризующим действием.'
- source_word: ἔχει
  choice: имеет
  rationale: Сохраняет настоящее время и утверждение о вечной жизни как уже имеющейся, а не только будущей.
- source_word: ζωὴν αἰώνιον
  choice: вечную жизнь
  rationale: Устоявшееся и естественное выражение, передающее длительный и качественный смысл сочетания в контексте Евангелия от Иоанна.
theological_decisions:
- issue: Вечная жизнь как настоящее обладание
  choice: имеет вечную жизнь
  alternative: будет иметь вечную жизнь
  rationale: Греческое ἔχει стоит в настоящем времени. Будущее время изменило бы прямое утверждение текста и сгладило бы присущее Иоанну напряжение между настоящим и будущим.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Повтор «истинно, истинно» и формула «говорю вам» сохранены; «верующий» лаконично и естественно воспроизводит субстантивированное причастие.
