  text: ἀπεκρίθη ⸀ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ ἔργον τοῦ θεοῦ ἵνα ⸀πιστεύητε εἰς ὃν ἀπέστειλεν ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/029.yaml
  text: 'Jesus answered and said to them[b][a], “This is the work of God: that you believe in the one whom he has sent.”'
translation:
  language: ru
  text: 'Иисус ответил им: «Это и есть дело Божье[a]: чтобы вы верили[b] в Того, Кого Он послал».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дело, которого требует Бог»; или: «дело, которое совершает Бог». Греческое выражение допускает разные понимания; основной текст сохраняет эту неоднозначность.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «доверяли Тому, Кого Он послал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς
  choice: Иисус ответил им
  rationale: Русское «ответил» естественно передаёт формульное греческое сочетание «ответил и сказал»; буквальное удвоение здесь тяжеловесно и не добавляет смысла.
- source_word: Τοῦτό ἐστιν
  choice: Вот
  rationale: В данном ответе «вот» естественно и выразительно вводит указательное утверждение, сохраняя акцент греческого τοῦτό.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: дело Божье
  rationale: 'Формально близкая русская конструкция сохраняет неоднозначность генитива: это может быть дело, которого требует Бог, или дело, которое совершает Бог.'
- source_word: ἵνα πιστεύητε
  choice: верить
  rationale: Инфинитив после «вот дело» естественно раскрывает содержание дела; настоящее сослагательное не требует отдельной передачи длительности или модальности.
- source_word: εἰς ὃν
  choice: в Того, Кого
  rationale: Оборот πιστεύω εἰς в Иоанна обычно означает личную веру в кого-либо; прописные буквы помогают ясно соотнести местоимение с Иисусом без добавления имени.
- source_word: ἀπέστειλεν ἐκεῖνος
  choice: Он послал
  rationale: Простое прошедшее время точно передаёт греческий аорист и естественно звучит по-русски; «Он» относится к Богу.
theological_decisions:
- issue: Значение генитива в τὸ ἔργον τοῦ θεοῦ
  choice: Сохранить в основном тексте неоднозначное «дело Божье».
  alternative: «дело, которого требует Бог»; «дело, которое совершает Бог»
  rationale: Греческий генитив допускает как объективное, так и субъективное понимание. Контекст вопроса о человеческих делах поддерживает первое, но сосредоточенность ответа на вере в Посланного Богом оставляет открытым и второе; перевод не должен устранять это напряжение.
- issue: Передача πιστεύητε εἰς
  choice: «верить в»
  alternative: «довериться» / «полагаться на»
  rationale: «Верить в» — обычная и точная передача иоанновского πιστεύω εἰς, обозначающего не просто признание факта, а направленную на личность веру. Смысл доверия отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык, краткий и достойный повествовательный стиль. Формульное «ответил и сказал» сведено к естественному «ответил». «Божье» выбрано вместо более книжного «Божие»; синтаксис сохраняет смысловую напряжённость оригинала.
