review_pass:
  verdict: revise
  source_fidelity: В целом переданы контраст «не ... но», образ пищи и титул «Сын Человеческий». Однако «пища тленная» и особенно «пища, пребывающая» звучат книжно и менее точно передают причастия ἀπολλυμένην («гибнущая/портящаяся») и μένουσαν («остающаяся, пребывающая»). Оборот «для вечной жизни» возможен, но в сочетании с «пребывающей» по-русски создаёт неестественную и смыслово неясную связь. «поставил Свою печать» сохраняет образ σφραγίζω, но русское «поставил печать на Нём» требует предлога «на», которого в греческом нет и который может создать излишне конкретный образ физического нанесения печати. «запечатлел» точнее и естественнее сохраняет метафору.
  naturalness: 'Безопасная правка делает фразу естественнее для современного литературного русского: «Не трудитесь ради пищи, которая погибает, но ради пищи, пребывающей к вечной жизни». Сочетание «пища, которая погибает» яснее, чем архаизирующее «пища тленная», а «запечатлел» устраняет шероховатость «поставил ... печать на Нём».'
  terminology: '«Сын Человеческий» сохранён. Приложение «Отец — Бог» допустимо и близко к греческому ὁ πατὴρ ... ὁ θεός; его следует сохранить. Личные местоимения со строчной буквы предпочтительнее для нейтрального современного издания: это орфографическое оформление, не затрагивающее богословского смысла.'
  issues:
  - severity: medium
    issue: «Пища тленная»
    rationale: «Тленный» означает «подверженный тлению» и возможен в возвышенной речи, но здесь менее прямо передаёт активный процесс ἀπολλυμένην и для современной литературной речи звучит архаизирующе. «Пища, которая погибает» сохраняет словесную связь с гибелью и остаётся понятной.
  - severity: medium
    issue: «Пища, пребывающая для вечной жизни»
    rationale: «Пребывающая для» в русском неестественно и не даёт ясной связи εἰς ζωὴν αἰώνιον с пищей. «Пребывающая к вечной жизни» буквально необычно, но в евангельском регистре понятно и лучше удерживает направленность εἰς без навязывания одного толкования.
  - severity: low
    issue: «На Нём поставил Свою печать»
    rationale: Русское «поставить печать на ком-либо» несколько конкретизирует метафору как физическое нанесение знака. «Его запечатлел Отец — Бог» ближе к прямому объекту τοῦτον и естественнее.
  - severity: low
    issue: Прописные буквы в местоимениях
    rationale: «Нём», «Свою» — благочестивая издательская традиция, но не обязательны и не отражают различий греческого текста. Строчная форма соответствует нейтральному современному литературному оформлению.
