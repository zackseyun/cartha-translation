revisions:
- from: Трудитесь не ради пищи тленной, но ради пищи, пребывающей для вечной жизни, которую даст вам Сын Человеческий, потому что на Нём поставил Свою печать Отец — Бог.[a]
  to: Не трудитесь ради пищи, которая погибает, но ради пищи, пребывающей к вечной жизни, которую даст вам Сын Человеческий, ибо его запечатлел Отец — Бог.[a]
  rationale: 'Правка сохраняет все существенные элементы греческого текста: повеление во множественном числе, противопоставление двух видов пищи, направленность к вечной жизни, будущий дар Сына Человеческого, приложение «Отец — Бог» и образ печати. Уточнены русская естественность и синтаксическая прозрачность без доктринального истолкования спорных оттенков εἰς или σφραγίζω.'
