  text: ἐργάζεσθε μὴ τὴν βρῶσιν τὴν ἀπολλυμένην ἀλλὰ τὴν βρῶσιν τὴν μένουσαν εἰς ζωὴν αἰώνιον, ἣν ὁ υἱὸς τοῦ ἀνθρώπου ὑμῖν δώσει, τοῦτον γὰρ ὁ πατὴρ ἐσφράγισεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/027.yaml
  text: Do not work for the food that perishes[a], but for the food that remains to eternal life, which the Son of Man will give to you[b]; for God the Father has set his seal on him.
translation:
  language: ru
  text: Не трудитесь ради пищи, которая погибает, но ради пищи, пребывающей к вечной жизни, которую даст вам Сын Человеческий, ибо его запечатлел Отец — Бог.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его запечатлел Отец — Бог». Образ печати может выражать удостоверение, одобрение или наделение полномочием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργάζεσθε μὴ ... ἀλλὰ
  choice: Трудитесь не ради... но ради...
  rationale: Положительная форма повеления с μὴ запрещает направлять усилия на первый объект и противопоставляет ему второй. «Трудитесь ради» естественно передаёт смысл работы или усилий, направленных на приобретение пищи.
- source_word: βρῶσιν τὴν ἀπολλυμένην
  choice: пищи тленной
  rationale: βρῶσις здесь означает пищу, а причастие ἀπολλυμένην — то, что гибнет, портится и не сохраняется. «Тленная» кратко и достойно передаёт её преходящий характер.
- source_word: βρῶσιν τὴν μένουσαν
  choice: пищи, пребывающей
  rationale: Причастие μένουσαν обозначает то, что остаётся или сохраняется; «пребывающей» удерживает словесный контраст с тленной пищей и соответствует возвышенному, но понятному регистру Евангелия.
- source_word: εἰς ζωὴν αἰώνιον
  choice: для вечной жизни
  rationale: εἰς выражает направленность, цель или результат. «Для вечной жизни» сохраняет эту широту и не вынуждает выбирать между значениями «ведущей к» и «сохраняющейся до».
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшаяся русская передача титула, сохраняющая его библейские и богословские связи.
- source_word: ὑμῖν δώσει
  choice: даст вам
  rationale: Естественная русская передача будущего времени и дательного косвенного дополнения.
- source_word: ἐσφράγισεν
  choice: поставил Свою печать
  rationale: Передаёт аорист и сохраняет образ печати, который в контексте может выражать удостоверение, одобрение или полномочие.
- source_word: ὁ πατὴρ ... ὁ θεός
  choice: Отец — Бог
  rationale: Сохраняет необычный греческий порядок и приложение, явно отождествляющее Отца с Богом, не превращая его автоматически в позднейшую устойчивую формулу «Бог Отец».
theological_decisions:
- issue: Значение ἐσφράγισεν применительно к Сыну Человеческому
  choice: поставил Свою печать
  alternative: удостоверил / уполномочил
  rationale: Образ печати сохранён, поскольку сам текст не уточняет единственное отвлечённое значение; возможные оттенки удостоверения и полномочия не следует молча сводить к одному.
- issue: Приложение ὁ πατὴρ ... ὁ θεός
  choice: Отец — Бог
  alternative: Бог Отец
  rationale: Выбранная форма точнее отражает греческое приложение и сохраняет его акцент, одновременно ясно называя Отца Богом без добавочного конфессионального разъяснения.
- issue: Связь εἰς ζωὴν αἰώνιον с μένουσαν
  choice: пребывающей для вечной жизни
  alternative: сохраняющейся до вечной жизни / ведущей к вечной жизни
  rationale: Греческий оборот допускает оттенки продолжительности и цели/результата. Более общий русский оборот сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством евангельской речи. Синтаксис остаётся прозрачным; образ печати и неоднозначность εἰς ζωὴν αἰώνιον сохранены. Местоимение «Свою» и форма «Нём» написаны с прописной буквы как традиционные знаки почтения, не меняющие содержания.
