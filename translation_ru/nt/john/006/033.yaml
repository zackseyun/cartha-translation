  yaml_path: translation/nt/john/006/033.yaml
  text: For the bread of God is the one who comes down from heaven and gives life to the world[a].
translation:
  language: ru
  text: Ибо хлеб Божий — Тот, кто сходит с неба и даёт жизнь миру.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что сходит с неба и даёт жизнь миру». Греческую конструкцию можно понять более безлично, однако причастия мужского рода говорят в пользу личного референта.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρτος
  choice: хлеб
  rationale: Сохраняет конкретный образ, на котором строится речь, не обобщая его до «пищи».
- source_word: τοῦ θεοῦ
  choice: Божий
  rationale: Естественная русская передача родительного падежа, допускающая оттенки принадлежности и происхождения без их преждевременного уточнения.
- source_word: ὁ καταβαίνων
  choice: Тот, Кто сходит
  rationale: Артиклированное причастие мужского рода указывает на личного референта; настоящее время передано естественной русской конструкцией.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: с неба
  rationale: Естественно передаёт происхождение или исходную точку, выраженную ἐκ с родительным падежом.
- source_word: ζωὴν
  choice: жизнь
  rationale: Сохраняет простой и богословски значимый термин Иоанна без поясняющей перифразы.
- source_word: διδοὺς
  choice: даёт
  rationale: Передаёт характерное продолжающееся действие и естественно согласуется с конструкцией «Тот, Кто…».
- source_word: τῷ κόσμῳ
  choice: миру
  rationale: Сохраняет широту и характерную для Иоанна многозначность κόσμος, не сужая значение до «человечества» или «всех людей».
- source_word: γὰρ
  choice: Потому что
  rationale: Ясно и естественно обозначает обоснование предыдущего утверждения.
theological_decisions:
- issue: Личное или безличное понимание выражения ὁ καταβαίνων… καὶ ζωὴν διδοὺς
  choice: 'Личная формулировка: «Тот, Кто сходит с неба и даёт жизнь миру»'
  alternative: «то, что сходит с неба и даёт жизнь миру»
  rationale: Причастия стоят в мужском роде единственного числа и естественно указывают на личного референта, предвосхищая самоотождествление Иисуса с хлебом; при этом альтернативная грамматически возможная трактовка отмечена в сноске.
- issue: Объём значения κόσμος
  choice: «миру»
  alternative: «человечеству» / «всем людям»
  rationale: Так сохраняются широта выражения и богословское напряжение текста без навязывания более узкого толкования.
translation_notes:
  register: Современный литературный русский язык; формулировка торжественная, но понятная. Прописные буквы в «Тот, Кто» помогают естественно обозначить личного референта, не добавляя имени, отсутствующего в стихе.
