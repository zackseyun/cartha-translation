  text: οὗτός ἐστιν ὁ ἄρτος ὁ ⸀ἐξ οὐρανοῦ καταβάς, οὐ καθὼς ἔφαγον οἱ ⸀πατέρες καὶ ἀπέθανον· ὁ τρώγων τοῦτον τὸν ἄρτον ⸀ζήσει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/058.yaml
  text: This is the bread that came down from heaven[a], not as the fathers ate and died[b]; the one who eats this bread will live forever.
translation:
  language: ru
  text: Это хлеб, сошедший с небес, — не такой, какой ели отцы[a] и умерли. Тот, кто ест этот хлеб, будет жить вечно[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предки», «праотцы». Вероятно, имеются в виду отцы Израиля, евшие манну в пустыне.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «будет жить в век»; это выражение означает: «будет жить вечно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ ἄρτος
  choice: Это хлеб
  rationale: Естественная русская конструкция с указательным местоимением сохраняет отсылку к уже названному в контексте хлебу.
- source_word: ὁ ἐξ οὐρανοῦ καταβάς
  choice: сошедший с небес
  rationale: Причастный оборот близко передаёт аористное причастие καταβάς; «с небес» естественно выражает исходное значение ἐξ οὐρανοῦ.
- source_word: οὐ καθὼς
  choice: не такой, какой
  rationale: Передаёт сравнительное противопоставление яснее и естественнее по-русски, чем буквальное «не как» при данном синтаксисе.
- source_word: ἔφαγον οἱ πατέρες καὶ ἀπέθανον
  choice: ели отцы и умерли
  rationale: Формы прошедшего времени передают аористы; «отцы» сохраняет мужской род и традиционную библейскую отсылку к праотцам Израиля.
- source_word: ὁ τρώγων
  choice: тот, кто ест
  rationale: Субстантивированное причастие настоящего времени передано нейтрально и обобщённо, без привнесения определённого евхаристического или метафорического толкования.
- source_word: τοῦτον τὸν ἄρτον
  choice: этот хлеб
  rationale: Прямо сохраняет указательное местоимение и существительное без неоправданного уточнения «каравай» или «буханка».
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: будет жить вечно
  rationale: Естественный русский эквивалент иоанновского идиоматического выражения, буквально связанного с жизнью «вовек».
theological_decisions:
- issue: Кого обозначают οἱ πατέρες в сравнении с небесным хлебом
  choice: отцы
  alternative: предки; праотцы
  rationale: «Отцы» формально сохраняет греческий мужской род и библейскую отсылку к отцам Израиля, евшим манну; сноска поясняет вероятный референт, не расширяя его молча.
- issue: Смысл τρώγων в речи о хлебе жизни
  choice: тот, кто ест
  alternative: тот, кто питается; тот, кто вкушает
  rationale: Нейтральное «ест» сохраняет конкретность образа и не разрешает спор между сакраментальным и метафорическим прочтениями.
- issue: Продолжительность жизни в ζήσει εἰς τὸν αἰῶνα
  choice: будет жить вечно
  alternative: будет жить вовек; будет жить в грядущем веке
  rationale: В данном иоанновском обороте выражение обозначает непрекращающуюся жизнь; перевод «в грядущем веке» неоправданно сужал бы смысл и привносил бы отсутствующее прилагательное «грядущий».
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис упрощён для ясности, но образ хлеба, сравнительное противопоставление и богословская напряжённость сохранены.
