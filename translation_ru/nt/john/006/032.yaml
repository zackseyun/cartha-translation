source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ, ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ τὸν ἀληθινόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/032.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, Moses has not given you the bread from heaven[b], but my Father gives you the true bread from heaven.”
translation:
  language: ru
  text: 'Тогда Иисус сказал им: «Истинно, истинно говорю вам: не Моисей[a] дал вам хлеб с неба, но Мой Отец даёт вам истинный[b] хлеб с неба».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте отрицание стоит перед именем Моисея, поэтому особенно подчёркнуто, что подателем был не Моисей.
    reason: lexical_alternative
  - marker: b
    text: «Истинный» здесь может также означать «подлинный» или «настоящий» — не просто прежнюю манну, а хлеб с неба в окончательном, полном смысле.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Тогда
  rationale: Связывает слова Иисуса с предшествующим разговором и естественно передаёт продолжение повествования; более жёсткое причинное «итак» здесь не обязательно.
- source_word: Ἀμὴν ἀμὴν
  choice: Истинно, истинно
  rationale: Сохраняет характерную для Евангелия от Иоанна удвоенную торжественную формулу и остаётся понятным современному читателю.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямо и естественно передаёт греческое выражение в составе торжественной вводной формулы.
- source_word: οὐ Μωϋσῆς δέδωκεν ὑμῖν
  choice: не Моисей дал вам
  rationale: Положение отрицания перед именем сохраняет выраженный контраст между действующими лицами. Русский язык не имеет прямого соответствия греческому перфекту, поэтому совершенный вид «дал» передаёт завершённое действие, значимое для текущего спора.
- source_word: τὸν ἄρτον ἐκ τοῦ οὐρανοῦ
  choice: хлеб с неба
  rationale: Естественно передаёт происхождение хлеба и сохраняет библейский образ.
- source_word: ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν
  choice: но Мой Отец даёт вам
  rationale: Настоящее время «даёт» сохраняет противопоставление прежнему дарованию манны и нынешнему действию Отца.
- source_word: τὸν ἀληθινόν
  choice: истинный
  rationale: 'Сохраняет характерную для Иоанна смысловую широту: подлинный, соответствующий окончательной реальности, а не только прежнему прообразу.'
theological_decisions:
- issue: Временной и субъектный контраст между Моисеем и Отцом
  choice: «не Моисей дал… но Мой Отец даёт»
  alternative: «Моисей не дал… но Мой Отец даёт»
  rationale: Выбранный порядок слов сохраняет акцент греческого текста на том, кто является подателем, а формы «дал» и «даёт» передают различие между прежним событием и нынешним дарованием, не добавляя толкования.
- issue: Значение выражения «истинный хлеб»
  choice: Сохранить «истинный» в основном тексте
  alternative: «настоящий» или «подлинный»
  rationale: «Истинный» не сводит смысл к простой фактической реальности и сохраняет богословское напряжение между манной и тем хлебом, который Отец даёт теперь.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной удвоенной формулы Иисуса. Порядок слов подчёркивает контраст между Моисеем и Отцом; синтаксис остаётся ясным и пригодным для публичного чтения.
