source:
  edition: SBLGNT
  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἔχει ζωὴν αἰώνιον, κἀγὼ ἀναστήσω αὐτὸν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/054.yaml
  text: The one who eats my flesh and drinks my blood has eternal life[b][a], and I will raise him up on the last day.
translation:
  language: ru
  text: Тот, кто ест Мою плоть[a] и пьёт Мою кровь, имеет вечную жизнь, и Я воскрешу его в последний день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «питается Моей плотью»; более выразительно: «жуёт Мою плоть». Греческий глагол τρώγω конкретнее общего слова со значением «есть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: Тот, кто ест
  rationale: Артикль с причастием настоящего времени обозначает человека, для которого характерно это действие. Конструкция сохраняет единственное число и естественно звучит по-русски.
- source_word: τρώγων
  choice: ест
  rationale: Глагол τρώγω может конкретно означать «есть», «жевать», «глодать». В основном тексте «ест» ясно и естественно передаёт буквальный смысл, а более выразительный оттенок отмечен в сноске.
- source_word: μου τὴν σάρκα
  choice: Мою плоть
  rationale: σάρξ здесь имеет конкретное значение; «плоть» сохраняет образ исходного текста и не заменяет его толкованием «тело».
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: и пьёт Мою кровь
  rationale: Сохраняются параллелизм двух причастий настоящего времени и буквальный, не смягчённый образ крови.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: имеет вечную жизнь
  rationale: Настоящее время ἔχει передаёт обладание жизнью уже сейчас; «вечная жизнь» — естественное и устойчивое русское соответствие выражению ζωὴ αἰώνιος у Иоанна.
- source_word: κἀγὼ ἀναστήσω αὐτὸν
  choice: и Я воскрешу его
  rationale: В данном эсхатологическом контексте ἀνίστημι означает воскресить из мёртвых. «Воскрешу» естественнее и точнее по-русски, чем буквальное «подниму»; αὐτόν передано местоимением мужского рода в единственном числе.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: в последний день
  rationale: Устойчивое и естественное русское выражение, обозначающее эсхатологический последний день.
theological_decisions:
- issue: Следует ли истолковывать слова о вкушении плоти и питье крови как прямо евхаристические либо как метафору веры
  choice: Сохранены буквальные слова «ест Мою плоть» и «пьёт Мою кровь» без толковательного расширения
  alternative: Передать их как прямое указание на Евхаристию либо заменить разъясняющей метафорой веры
  rationale: Греческий текст использует конкретные слова о плоти, крови, еде и питье. Буквальный перевод сохраняет богословское напряжение и не навязывает конфессиональное толкование.
- issue: Значение ἀναστήσω в связи с последним днём
  choice: воскрешу
  alternative: подниму
  rationale: Упоминание последнего дня задаёт контекст воскресения из мёртвых; русский глагол «воскрешу» передаёт это значение без добавления деталей о характере воскресения.
- issue: Передача αὐτόν
  choice: его
  alternative: этого человека
  rationale: Местоимение мужского рода единственного числа прямо соотносится с конструкцией «тот, кто» и сохраняет грамматическую форму исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Синтаксический параллелизм и конкретные образы исходного текста сохранены; местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской традиции.
