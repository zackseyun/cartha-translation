base_translation:
  language: en
  yaml_path: translation/nt/john/006/004.yaml
  text: The Passover[a], the feast of the Jews, was near.
translation:
  language: ru
  text: Приближалась Пасха[a], праздник иудеев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праздник жителей Иудеи». Греческое слово в зависимости от контекста может обозначать как иудеев вообще, так и жителей Иудеи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: δέ — слабая повествовательная связка. В данном кратком контексте естественный русский порядок слов передаёт переход без добавления «теперь» или подчёркнутого противопоставления.
- source_word: ἦν ἐγγὺς
  choice: приближалась
  rationale: Сочетание указывает на временную близость праздника; «приближалась» естественно и точно передаёт смысл по-русски.
- source_word: τὸ πάσχα
  choice: Пасха
  rationale: Стандартное русское обозначение иудейского праздника; прописная буква соответствует современному употреблению названия праздника.
- source_word: ἡ ἑορτή
  choice: праздник
  rationale: Передаёт праздничное религиозное торжество естественным современным русским словом.
- source_word: τῶν Ἰουδαίων
  choice: иудеев
  rationale: В этом контексте речь идёт о Пасхе как празднике всего иудейского народа, а не только жителей Иудеи; при этом возможное более узкое значение отмечено в сноске.
theological_decisions:
- issue: Значение Ἰουδαίων в повествовании Иоанна
  choice: иудеев
  alternative: жителей Иудеи
  rationale: Слово контекстуально может обозначать как иудеев вообще, так и жителей Иудеи. Здесь общенародный религиозный праздник делает первое значение наиболее вероятным, однако лексическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Приложение «праздник иудеев» сохранено непосредственно после названия праздника.
