  text: Μετὰ ταῦτα ἀπῆλθεν ὁ Ἰησοῦς πέραν τῆς θαλάσσης τῆς Γαλιλαίας τῆς Τιβεριάδος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/001.yaml
  text: After these things[a], Jesus went away to the other side of the Sea of Galilee[b], which is the Sea of Tiberias.
translation:
  language: ru
  text: После этого Иисус отправился на другой берег Галилейского моря, называемого также Тивериадским.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Галилейское море было известно также как Тивериадское море; оба названия обозначают один и тот же водоём.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: После этого
  rationale: Естественная русская переходная формула; единственное число в русском языке идиоматично передаёт греческое множественное ταῦτα без изменения смысла.
- source_word: ἀπῆλθεν
  choice: отправился
  rationale: Передаёт движение прочь и начало пути, оставаясь естественным и литературным в данном повествовании.
- source_word: πέραν
  choice: на другой берег
  rationale: В контексте водоёма ясно и идиоматично обозначает движение к противоположной стороне.
- source_word: τῆς θαλάσσης
  choice: моря
  rationale: Сохраняет традиционное именование, соответствующее греческому θάλασσα, хотя географически речь идёт об озере.
- source_word: τῆς Γαλιλαίας τῆς Τιβεριάδος
  choice: Галилейского моря, называемого также Тивериадским
  rationale: Передаёт два названия одного водоёма и естественно раскрывает аппозиционную связь двух греческих генитивов.
