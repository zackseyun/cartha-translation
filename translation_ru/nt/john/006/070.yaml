  terminology: «Дьявол» сохраняет намеренную резкость διάβολος и не сводит его значение только к «клеветнику». Примечание корректно сообщает лексическую альтернативу и осторожно поясняет качественный характер безартиклевого сказуемого, не навязывая прямого отождествления с сатаной. «Двенадцать» с прописной буквы оправдано как наименование признанной группы.
