  source_fidelity: 'Текст точно передаёт греческий оригинал: ἀπεκρίθη — «ответил», риторический вопрос с οὐκ и выделенным ἐγώ — «Не Я ли избрал», обозначение известной группы — «Двенадцать», партитивное ἐξ ὑμῶν — «один из вас». «И всё же» уместно выражает контрастный дискурсивный эффект καὶ в данном контексте, не меняя основного значения.'
