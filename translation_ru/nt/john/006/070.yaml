source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἐγὼ ὑμᾶς τοὺς δώδεκα ἐξελεξάμην; καὶ ἐξ ὑμῶν εἷς διάβολός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/070.yaml
  text: Jesus answered them[a], “Did I not choose you, the Twelve? Yet one of you is a devil.”
translation:
  language: ru
  text: 'Иисус ответил им: «Не Я ли избрал вас, Двенадцать? И всё же один из вас — дьявол[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «клеветник». Греческое слово может означать ложного обвинителя, а во многих контекстах — дьявола. Здесь оно, вероятно, характеризует человека, а не прямо отождествляет его с сатаной.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: Иисус ответил им
  rationale: Естественный для современного русского повествовательный порядок слов; «ответил» точно передаёт обычный глагол ответа в диалоге.
- source_word: Οὐκ ἐγὼ ... ἐξελεξάμην;
  choice: Не Я ли избрал
  rationale: Риторический вопрос с οὐκ предполагает утвердительный ответ. Ударное «Я» сохраняет выраженное греческим местоимением ἐγώ смысловое выделение.
- source_word: ὑμᾶς τοὺς δώδεκα
  choice: вас, Двенадцать
  rationale: Определённый артикль указывает на известную группу учеников; прописная буква передаёт употребление числительного как наименования группы.
- source_word: καὶ
  choice: И всё же
  rationale: Формально союз означает «и», но здесь вводит резкое противопоставление избранию Двенадцати; «и всё же» естественно сохраняет и соединительную, и противительную силу.
- source_word: ἐξ ὑμῶν εἷς
  choice: один из вас
  rationale: Точно и идиоматично передаёт партитивную конструкцию.
- source_word: διάβολός
  choice: дьявол
  rationale: Безартиклевое именное сказуемое имеет качественную силу. Русское «дьявол» сохраняет резкость образа и допускает характеристику, не вынуждая понимать слова как прямое отождествление с сатаной.
theological_decisions:
- issue: Является ли διάβολός прямым отождествлением с сатаной или качественной характеристикой
  choice: дьявол
  alternative: клеветник
  rationale: 'Отсутствие артикля и позиция именного сказуемого допускают прежде всего качественное понимание: один из Двенадцати характеризуется как дьявольский противник и клеветник, но не обязательно отождествляется с самим сатаной. Основной текст сохраняет богословскую и риторическую напряжённость, а примечание обозначает лексическую альтернативу.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис краткий и выразительный; прописные «Я» и «Двенадцать» передают смысловое ударение и устойчивое наименование группы. Маркер примечания помещён непосредственно после спорного слова.
