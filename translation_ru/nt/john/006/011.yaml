  text: ἔλαβεν ⸀οὖν τοὺς ἄρτους ὁ Ἰησοῦς καὶ εὐχαριστήσας ⸀διέδωκεν τοῖς ἀνακειμένοις, ὁμοίως καὶ ἐκ τῶν ὀψαρίων ὅσον ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/011.yaml
  text: So Jesus took the loaves[a], and after giving thanks he distributed them to those who were reclining; likewise also from the fish[b], as much as they wanted.
translation:
  language: ru
  text: Итак, Иисус взял хлебы и, возблагодарив, раздал возлежавшим; также раздал и рыбу — сколько хотели.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Итак
  rationale: Связка обозначает продолжение и следствие предшествующего повествования; «итак» сохраняет эту функцию и естественно звучит в литературном русском.
- source_word: τοὺς ἄρτους
  choice: хлебы
  rationale: Множественное число указывает на отдельные хлебы, упомянутые в контексте, а не на хлеб как вещество.
- source_word: εὐχαριστήσας
  choice: возблагодарив
  rationale: Деепричастие передаёт предшествующее действие аористного причастия; объект благодарности не добавляется, поскольку в греческом тексте он не назван.
- source_word: διέδωκεν
  choice: раздал
  rationale: Глагол выражает распределение среди собравшихся; по-русски «раздал» передаёт это естественно, без необходимости повторять подразумеваемое дополнение.
- source_word: τοῖς ἀνακειμένοις
  choice: возлежавшим
  rationale: Сохранён образ принятой в древности позы за трапезой; буквальное значение важнее сглаженного «сидевшим».
- source_word: ὁμοίως καὶ ἐκ τῶν ὀψαρίων
  choice: так же и рыбы
  rationale: Формулировка сохраняет параллель с раздачей хлебов. Греческое ἐκ допускает эллиптическое понимание «[раздал] из рыб»; естественный русский требует объектной конструкции.
- source_word: ὅσον ἤθελον
  choice: сколько кто хотел
  rationale: Передаёт неограниченное количество в соответствии с желанием каждого и ясно обозначает множественный субъект греческого глагола.
theological_decisions:
- issue: Возможный евхаристический оттенок εὐχαριστήσας
  choice: «возблагодарив» без сакраментального уточнения
  alternative: «благословив» или явное указание на евхаристический смысл
  rationale: Глагол непосредственно означает благодарение. Возможная богословская перекличка сохраняется, но не вносится в текст как однозначное толкование.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Возлежавшим» исторически точно, хотя менее разговорно; контекст трапезы делает смысл понятным. Маркер сноски поставлен после относящейся ко всей заключительной фразе части стиха.
