  text: Ἐμάχοντο οὖν πρὸς ἀλλήλους οἱ Ἰουδαῖοι λέγοντες· Πῶς δύναται οὗτος ἡμῖν δοῦναι τὴν σάρκα ⸀αὐτοῦ φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/052.yaml
  text: So the Jews were arguing among themselves[a], saying[b], “How can this man give us his flesh to eat?”
translation:
  language: ru
  text: 'Итак, иудеи[a] спорили между собой: «Как этот человек может дать нам в пищу свою плоть[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные варианты: «жители Иудеи» или, по контексту, «иудейские вожди». В греческом тексте буквально: «иудеи».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «тело». В греческом тексте употреблено слово «плоть» (σάρξ); оно сохранено здесь, чтобы передать конкретность формулировки и напряжённость этого отрывка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐμάχοντο
  choice: стали спорить
  rationale: Глагол в имперфекте описывает разворачивающийся и продолжающийся ожесточённый спор. «Стали спорить» естественно передаёт начало этой реакции в повествовании, не превращая словесный конфликт в физическую драку.
- source_word: οὖν
  choice: тогда
  rationale: Связывает реакцию слушателей с предшествующими словами Иисуса и одновременно продвигает повествование. «Тогда» естественно передаёт здесь последовательную и следственную связь.
- source_word: πρὸς ἀλλήλους
  choice: между собой
  rationale: Передаёт взаимный спор внутри названной группы и естественно сочетается с русским глаголом «спорить».
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Прямо передаёт греческое обозначение, не сужая его в основном тексте до руководителей и не разрешая спорный вопрос о конкретном референте в Евангелии от Иоанна.
- source_word: λέγοντες
  choice: двоеточие перед прямой речью
  rationale: Причастие вводит содержание спора. В современном русском двоеточие перед прямой речью передаёт эту функцию естественнее, чем буквальное «говоря».
- source_word: Πῶς δύναται
  choice: Как ... может
  rationale: Прямой и естественный способ передать вопрос о возможности или способности.
- source_word: οὗτος
  choice: этот человек
  rationale: Сохраняет указательную, дистанцирующую окраску, которая была бы ослаблена местоимением «он».
- source_word: ἡμῖν δοῦναι
  choice: дать нам
  rationale: Передаёт обычное значение δίδωμι и косвенное дополнение без смыслового усиления.
- source_word: τὴν σάρκα αὐτοῦ
  choice: свою плоть
  rationale: «Плоть» сохраняет конкретную лексику σάρξ и напряжённость высказывания; возвратное «свою» естественно по-русски относится к субъекту «этот человек».
- source_word: φαγεῖν
  choice: есть
  rationale: Непосредственно передаёт инфинитив «есть» и сохраняет резкую телесную конкретность вопроса.
theological_decisions:
- issue: Передача σάρξ в богословски напряжённом контексте
  choice: плоть
  alternative: тело
  rationale: Греческий текст употребляет σάρξ, а слушатели реагируют на слова Иисуса в конкретном, физическом смысле. «Плоть» сохраняет исходную формулировку и не вводит в перевод заранее определённое евхаристическое или иное толкование.
- issue: Объём значения οἱ Ἰουδαῖοι у Иоанна
  choice: иудеи
  alternative: жители Иудеи; иудейские вожди
  rationale: Основной текст следует явной греческой формулировке. Возможное контекстуальное сужение референта отмечено в сноске, но не внесено в перевод как бесспорное.
translation_notes:
  register: Современный литературный русский язык с ясной повествовательной формой. Формулировка «дать нам есть свою плоть» намеренно сохраняет конкретность и резкость греческого выражения, не сглаживая его толкованием.
