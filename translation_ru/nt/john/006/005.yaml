source:
  edition: SBLGNT
  text: ἐπάρας οὖν ⸂τοὺς ὀφθαλμοὺς ὁ Ἰησοῦς⸃ καὶ θεασάμενος ὅτι πολὺς ὄχλος ἔρχεται πρὸς αὐτὸν λέγει ⸀πρὸς Φίλιππον· Πόθεν ⸀ἀγοράσωμεν ἄρτους ἵνα φάγωσιν οὗτοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/005.yaml
  text: So Jesus[a], lifting up his eyes and seeing that a large crowd was coming toward him, said to Philip[c][b], “Where are we to buy bread so that these may eat?”
translation:
  language: ru
  text: 'Итак, Иисус поднял глаза и, увидев, что к нему идёт большая толпа, сказал Филиппу: «Где нам купить хлеба[a], чтобы эти люди поели?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хлебов». Греческое слово может обозначать как хлеб вообще, так и отдельные хлебы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάρας … τοὺς ὀφθαλμούς
  choice: поднял глаза
  rationale: Греческий аористный оборот буквально означает «подняв глаза»; личная форма делает русское повествование естественным, сохраняя последовательность действий.
- source_word: οὖν
  choice: итак
  rationale: Сохраняет связующую и повествовательно-следственную функцию частицы, не утяжеляя фразу.
- source_word: θεασάμενος
  choice: увидев
  rationale: Передаёт осознанное зрительное восприятие без архаичного оттенка.
- source_word: πολὺς ὄχλος
  choice: большая толпа
  rationale: Прямо и современно передаёт многочисленность собравшихся.
- source_word: ἔρχεται πρὸς αὐτόν
  choice: к нему идёт
  rationale: Настоящее время сохраняет живость греческого повествования, а «к нему» передаёт направленность πρός.
- source_word: λέγει πρὸς Φίλιππον
  choice: сказал Филиппу
  rationale: Историческое настоящее естественно передано русским прошедшим временем; адресат выражен дательным падежом.
- source_word: Πόθεν ἀγοράσωμεν
  choice: Где нам купить
  rationale: Идиоматично передаёт вопрос об источнике приобретения и совещательное значение аористного конъюнктива, не добавляя идеи возможности или обязанности.
- source_word: ἄρτους
  choice: хлеба
  rationale: В данном контексте русское собирательное «хлеб» звучит естественно; греческое множественное число может обозначать отдельные хлебы или хлеб как пищу.
- source_word: ἵνα φάγωσιν οὗτοι
  choice: чтобы эти люди поели
  rationale: Сохраняет целевое значение ἵνα и указательную силу οὗτοι; добавление «люди» необходимо для естественного русского выражения.
theological_decisions:
- issue: Повествовательные времена и последовательность причастий
  choice: Основные действия переданы прошедшим временем, при этом настоящее ἔρχεται сохранено внутри восприятия Иисуса
  alternative: «Подняв глаза и увидев… Иисус говорит Филиппу»
  rationale: Выбранная форма естественна для современного русского повествования и сохраняет сценическую живость движения толпы; богословского уточнения в текст не вносит.
- issue: Совещательный вопрос Πόθεν ἀγοράσωμεν
  choice: «Где нам купить»
  alternative: «Откуда нам купить» или «Где мы купим»
  rationale: Формулировка сохраняет открытый вопрос о месте или источнике приобретения и не превращает его ни в предсказание, ни в утверждение невозможности.
translation_notes:
  register: Современный литературный русский язык; ясный и достойный повествовательный стиль без архаизмов. Местоимение «нему» написано со строчной буквы в соответствии с обычной современной орфографией и без внесения конфессиональной издательской традиции.
