  text: εἰδὼς δὲ ὁ Ἰησοῦς ἐν ἑαυτῷ ὅτι γογγύζουσιν περὶ τούτου οἱ μαθηταὶ αὐτοῦ εἶπεν αὐτοῖς· Τοῦτο ὑμᾶς σκανδαλίζει;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/061.yaml
  text: But Jesus[a], knowing in himself that his disciples were grumbling about this, said to them, “Does this offend you?"
translation:
  language: ru
  text: 'Но Иисус, сам зная, что Его ученики ропщут об этом, сказал им: «Это вас отталкивает?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Это служит для вас преткновением?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: зная
  rationale: Причастие передано деепричастием, естественно выражающим одновременное знание Иисуса.
- source_word: ἐν ἑαυτῷ
  choice: про себя
  rationale: Выражение указывает на внутреннее знание, не полученное из внешнего сообщения; «про себя» естественно и кратко передаёт эту мысль.
- source_word: γογγύζουσιν
  choice: ропщут
  rationale: Глагол обозначает недовольное, приглушённое выражение протеста; «ропщут» сохраняет отрицательную окраску и библейскую межтекстовую связь, оставаясь понятным современному читателю.
- source_word: περὶ τούτου
  choice: об этом
  rationale: Прямо указывает на предшествующие слова Иисуса без добавления поясняющего существительного.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Его ученики
  rationale: Естественная русская конструкция, не сужающая круг учеников до Двенадцати.
- source_word: Τοῦτο
  choice: это
  rationale: Сохраняет лаконичность указательного местоимения и его отсылку к предшествующей речи.
- source_word: σκανδαλίζει
  choice: отталкивает
  rationale: В данном контексте слово описывает такую реакцию на учение, которая может привести к его отвержению; «отталкивает» звучит естественно и не сводит смысл лишь к задетым чувствам.
theological_decisions:
- issue: Значение σκανδαλίζει в контексте возможного отвержения слов Иисуса
  choice: Это вас отталкивает?
  alternative: Это заставляет вас преткнуться?
  rationale: Греческий глагол охватывает как неприятие и возмущение, так и более сильную идею духовного преткновения или отпадения. Основной текст передаёт вопрос естественным современным русским языком, а сноска сохраняет метафорическую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. «Ропщут» сохраняет характер скрытого недовольства; «отталкивает» понятно обычному читателю, тогда как буквальная метафора вынесена в сноску.
