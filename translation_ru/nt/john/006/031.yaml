  text: οἱ πατέρες ἡμῶν τὸ μάννα ἔφαγον ἐν τῇ ἐρήμῳ, καθώς ἐστιν γεγραμμένον· Ἄρτον ἐκ τοῦ οὐρανοῦ ἔδωκεν αὐτοῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/031.yaml
  text: 'Our fathers ate the manna in the wilderness[b][a], just as it is written: ‘He gave them bread from heaven to eat.’'
translation:
  language: ru
  text: 'Наши отцы ели манну в пустыне[a], как написано: «Он дал им есть хлеб с неба».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Наши предки». Буквально: «наши отцы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: наши отцы
  rationale: Буквально передаёт греческое выражение и сохраняет библейскую идиому об израильских предках; вариант «наши предки» возможен, но менее формально близок к источнику.
- source_word: τὸ μάννα
  choice: манну
  rationale: «Манна» — укоренившееся русское обозначение пищи, данной Израилю в пустыне; винительный падеж естественно соответствует роли прямого дополнения.
- source_word: ἔφαγον
  choice: ели
  rationale: Простая форма прошедшего времени естественно передаёт аорист ἐσθίω как историческое утверждение.
- source_word: ἐν τῇ ἐρήμῳ
  choice: в пустыне
  rationale: В контексте исхода «пустыня» — естественный и межтекстуально узнаваемый русский эквивалент ἔρημος.
- source_word: καθώς ἐστιν γεγραμμένον
  choice: как написано
  rationale: Устойчивая русская формула введения цитаты из Писания; сохраняет смысл существующего письменного свидетельства без тяжеловесного буквализма.
- source_word: Ἄρτον ἐκ τοῦ οὐρανοῦ
  choice: хлеб с неба
  rationale: Естественно передаёт ἄρτος и происхождение, выраженное ἐκ; «с неба» является обычной современной русской формой.
- source_word: ἔδωκεν αὐτοῖς φαγεῖν
  choice: дал им есть
  rationale: Сохраняет конструкцию «дал им… есть» и её словесную связь с исходным текстом без добавления отсутствующего существительного «пищу».
theological_decisions:
- issue: Передача цитаты о манне без преждевременного внесения христологического толкования
  choice: Историческое утверждение о том, что Бог дал им хлеб с неба, без поясняющего расширения и особой капитализации слова «хлеб».
  alternative: Формулировка или капитализация, заранее отождествляющая хлеб с Иисусом.
  rationale: Здесь собеседники Иисуса ссылаются на манну в пустыне; дальнейший христологический смысл должен раскрываться по ходу повествования, а не вноситься переводчиком в их слова.
- issue: Неявный субъект ἔδωκεν
  choice: Сохранить местоимение «Он», не называя Бога прямо.
  alternative: «Бог дал им…»
  rationale: Греческий текст не называет субъекта существительным; местоимение сохраняет форму цитаты и не добавляет эксплицитного уточнения.
translation_notes:
  register: 'Современный литературный русский язык с узнаваемой библейской формулой «как написано». Порядок слов в цитате слегка адаптирован для естественности: «дал им есть хлеб с неба». Отдельная сноска к слову «пустыня» не требуется, поскольку русское слово естественно охватывает соответствующее значение ἔρημος в контексте исхода.'
