  terminology: Имя «Иисус» дано в устоявшейся русской форме. «Ропщите» хорошо передаёт γογγύζετε и сохраняет библейский регистр. Сноска «друг с другом» является допустимой лексико-синтаксической альтернативой для μετ’ ἀλλήλων.
