  source_fidelity: «Иисус сказал им в ответ» точно передаёт повествовательную функцию ἀπεκρίθη … καὶ εἶπεν без неестественного для современного русского удвоения «ответил и сказал». «Не ропщите между собой» верно отражает μή с настоящим повелительным γογγύζετε и взаимное μετ’ ἀλλήλων, не навязывая значения «перестаньте».
