  yaml_path: translation/nt/john/006/043.yaml
  text: Jesus answered and said to them[b][a], “Do not grumble among yourselves.”
translation:
  language: ru
  text: 'Иисус сказал им в ответ: «Не ропщите между собой».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «друг с другом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: сказал … в ответ
  rationale: Естественно передаёт греческую повествовательную формулу «ответил и сказал», сохраняя значение ответа без тяжеловесного буквального удвоения.
- source_word: Μὴ γογγύζετε
  choice: Не ропщите
  rationale: «Роптать» точно передаёт недовольное ворчание и сохраняет библейскую перекличку с ропотом народа в пустыне; настоящее повелительное наклонение не уточняется как обязательное «перестаньте».
- source_word: μετ’ ἀλλήλων
  choice: между собой
  rationale: Естественное современное русское выражение для взаимного действия внутри группы; буквально возможно также «друг с другом».
- source_word: Ἰησοῦς
  choice: Иисус
  rationale: Устоявшаяся русская форма имени.
