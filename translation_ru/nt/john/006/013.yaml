  source_fidelity: 'Основной смысл передан верно: ученики собирают остатки и наполняют двенадцать корзин кусками от пяти ячменных хлебов. Однако «оставшимися у тех, кто ел» неудачно передаёт связь τοῖς βεβρωκόσιν: по-русски это может означать, что куски остались во владении едоков. Естественнее и точнее передать результат трапезы: «после того, как люди поели».'
  naturalness: «Кусками от пяти ячменных хлебов, оставшимися у тех, кто ел» тяжеловесно и семантически неясно. Перестройка фразы делает современный литературный русский плавнее, сохраняя повтор слова «куски» и повествовательный темп.
  terminology: «Ячменные хлеба», «корзины» и «куски» уместны. Сноска к κλασμάτων должна быть привязана к явному соответствию слова в конструкции «наполнили ... кусками», а не к подразумеваемому дополнению при «собрали».
