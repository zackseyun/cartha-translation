lexical_decisions:
- source_word: συνήγαγον οὖν
  choice: Итак, они собрали
  rationale: «Итак» передаёт следствие из повеления Иисуса в предыдущем стихе, а «собрали» естественно выражает совершённое действие; подразумеваемое дополнение раскрыто как «куски» из ближайшего контекста.
- source_word: ἐγέμισαν δώδεκα κοφίνους
  choice: наполнили двенадцать корзин
  rationale: Прямой и естественный перевод; «корзины» не добавляет излишней конкретизации формы или размера.
- source_word: κλασμάτων
  choice: кусками
  rationale: В контексте речь идёт об оставшихся кусках хлеба. Это современное и ясное слово; возможное «обломками» отмечено в сноске.
- source_word: ἐκ τῶν πέντε ἄρτων τῶν κριθίνων
  choice: от пяти ячменных хлебов
  rationale: Сохраняет связь собранных кусков с исходными пятью хлебами и явно передаёт κριθίνων.
- source_word: ἃ ἐπερίσσευσαν τοῖς βεβρωκόσιν
  choice: оставшимися у тех, кто ел
  rationale: Естественно передаёт смысл излишка, оставшегося после еды, при этом сохраняет связь с евшими и не подменяет неоднозначное греческое отношение более узким причинным выражением.
