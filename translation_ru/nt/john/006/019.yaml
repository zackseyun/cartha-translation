  source_fidelity: 'Перевод точно передаёт последовательность и основные элементы греческого текста: предварительное продвижение лодки на вёслах, приблизительное расстояние в стадиях, видение Иисуса, идущего по морю и приближающегося к лодке, а также последовавший страх. «Проплыли на вёслах» обоснованно передаёт ἐληλακότες в морском контексте; «приближающегося» верно отражает ἐγγὺς ... γινόμενον.'
