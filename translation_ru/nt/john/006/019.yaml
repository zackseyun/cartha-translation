id: JHN.6.19
reference: John 6:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐληλακότες οὖν ὡς σταδίους εἴκοσι πέντε ἢ τριάκοντα θεωροῦσιν τὸν Ἰησοῦν περιπατοῦντα ἐπὶ τῆς θαλάσσης καὶ ἐγγὺς τοῦ πλοίου γινόμενον, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/019.yaml
  text: So when they had rowed about twenty-five or thirty stadia[a], they saw Jesus walking on the sea and coming near the boat[b], and they were afraid.
translation:
  language: ru
  text: Итак, когда они проплыли на вёслах около двадцати пяти или тридцати стадиев[a], то увидели Иисуса, идущего по морю[b] и приближающегося к лодке, и испугались.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Стадий — древняя мера расстояния; двадцать пять или тридцать стадиев — это примерно пять-шесть километров.
    reason: cultural_note
  - marker: b
    text: 'Или: «идущего по воде». Буквально в греческом тексте: «идущего по морю».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐληλακότες
  choice: проплыли на вёслах
  rationale: В морском контексте ἐλαύνω обозначает движение лодки посредством гребли. Формулировка естественно передаёт действие, предшествующее основному глаголу.
- source_word: οὖν
  choice: итак
  rationale: Сохраняет связь с предшествующим повествованием и обозначает его дальнейшее развитие.
- source_word: ὡς
  choice: около
  rationale: Перед единицей измерения указывает на приблизительность расстояния.
- source_word: σταδίους εἴκοσι πέντε ἢ τριάκοντα
  choice: двадцати пяти или тридцати стадиев
  rationale: Сохранена древняя единица расстояния исходного текста; современный эквивалент вынесен в сноску.
- source_word: θεωροῦσιν
  choice: увидели
  rationale: В данном повествовательном контексте это ясная и естественная передача зрительного восприятия без архаического оттенка.
- source_word: περιπατοῦντα ἐπὶ τῆς θαλάσσης
  choice: идущего по морю
  rationale: Сохраняет слово θάλασσα («море») и прямой смысл необычайного события; по-русски «идти по морю» естественнее буквального «ходить на море».
- source_word: ἐγγὺς τοῦ πλοίου γινόμενον
  choice: приближающегося к лодке
  rationale: Передаёт переход к близости, а не статичное пребывание рядом.
- source_word: πλοίου
  choice: лодке
  rationale: Для галилейского контекста «лодка» точнее и естественнее, чем обозначающее более крупное судно слово «корабль».
- source_word: ἐφοβήθησαν
  choice: испугались
  rationale: Кратко и идиоматично передаёт наступившую реакцию страха.
theological_decisions:
- issue: Передача описания чуда без ослабления его прямого смысла
  choice: идущего по морю
  alternative: идущего у моря; идущего по воде
  rationale: ἐπί с родительным падежом в этом контексте указывает на движение по поверхности моря. Вариант «у моря» противоречит положению учеников вдали от берега, а «по воде» заменяет употреблённое в греческом тексте слово «море», хотя допустим как поясняющая лексическая альтернатива.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом и умеренно торжественным библейским регистром. Древняя мера сохранена в основном тексте, а её современный эквивалент дан в сноске.
