lexical_decisions:
- source_word: οἱ πατέρες ὑμῶν
  choice: ваши отцы
  rationale: Буквально сохраняет πατέρες и передаёт собирательное обозначение предков собеседников — поколения Израиля в пустыне. В русском библейском контексте выражение понятно и естественно.
- source_word: ἔφαγον
  choice: ели
  rationale: Аорист ἐσθίω обозначает исторический факт; русское прошедшее время множественного числа естественно передаёт действие без избыточного уточнения вида.
- source_word: ἐν τῇ ἐρήμῳ
  choice: в пустыне
  rationale: Устойчивое и контекстуально точное обозначение пустыни исхода Израиля.
- source_word: τὸ μάννα
  choice: манну
  rationale: Название известной пищи в повествовании об исходе; определённость греческого артикля в русском языке выражается контекстом.
- source_word: ἀπέθανον
  choice: умерли
  rationale: Прямо передаёт действительную смерть поколения пустыни и сохраняет контраст с хлебом, дающим жизнь.
theological_decisions:
- issue: Обозначение поколения Израиля в пустыне
  choice: ваши отцы
  alternative: ваши предки
  rationale: «Ваши отцы» сохраняет форму и риторическую силу греческого выражения, не добавляя толкования; в данном контексте речь идёт о предшествующем поколении Израиля.
translation_notes:
  register: 'Современный литературный русский язык с сохранением библейской торжественности. Тире перед заключительной частью подчёркивает резкий смысловой контраст, выраженный греческим καί: они ели манну, однако всё же умерли.'
