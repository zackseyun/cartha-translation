  yaml_path: translation/nt/john/006/002.yaml
  text: And a large crowd was following him[a], because they were seeing the signs that he was doing on those who were sick.
translation:
  language: ru
  text: За Ним следовала большая толпа, потому что они видели знамения[a], которые Он совершал, исцеляя больных.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чудеса», «чудесные знамения». У Иоанна слово «знамения» подчёркивает, что эти дела раскрывают нечто об Иисусе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: следовало
  rationale: Имперфект обозначает продолжавшееся действие в прошлом; русская форма несовершенного вида естественно передаёт эту длительность.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Здесь δέ служит слабой повествовательной связкой; в современном русском её явная передача союзом утяжелила бы начало стиха.
- source_word: ὄχλος πολύς
  choice: множество народа
  rationale: Передаёт многочисленность толпы естественным и несколько возвышенным, но понятным библейско-повествовательным оборотом.
- source_word: ἐθεώρουν
  choice: видели
  rationale: Имперфект и значение наблюдения переданы несовершенным видом; «видели» звучит естественнее, чем буквальное «наблюдали», не устраняя повторяемости происходившего.
- source_word: σημεῖα
  choice: знамения
  rationale: Сохраняет характерный для Иоанна смысл действий, которые не только чудесны, но и указывают на личность и служение Иисуса.
- source_word: ἐποίει
  choice: совершал
  rationale: Несовершенный вид передаёт продолжающуюся или повторявшуюся деятельность, а «совершал» идиоматично сочетается со словом «знамения».
- source_word: ἐπὶ τῶν ἀσθενούντων
  choice: над больными
  rationale: Естественный русский оборот для действий исцеления, направленных на больных; достаточно близко отражает ἐπί с родительным падежом.
- source_word: ἀσθενούντων
  choice: больными
  rationale: В данном контексте причастие обозначает людей, страдавших физическими недугами.
theological_decisions:
- issue: Терминология σημεῖα у Иоанна
  choice: знамения
  alternative: чудеса; чудесные знамения
  rationale: «Знамения» сохраняет богословски значимую указательную функцию дел Иисуса и не сводит их смысл лишь к сверхъестественности.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Местоимение «Ним» написано с прописной буквы согласно распространённой русской религиозной издательской норме; синтаксис остаётся ясным для широкого читателя.
