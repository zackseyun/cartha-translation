  text: ἀλλ’ εἶπον ὑμῖν ὅτι καὶ ἑωράκατέ με καὶ οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/036.yaml
  text: But I told you that you have even seen me[a], and yet you do not believe.
translation:
  language: ru
  text: 'Но Я сказал вам: вы и видели Меня, и всё же не верите.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ’
  choice: Но
  rationale: Передаёт противопоставление предыдущему высказыванию естественным и кратким русским союзом.
- source_word: εἶπον ὑμῖν
  choice: Я сказал вам
  rationale: Точно и естественно передаёт аорист λέγω с адресатом; русский оборот «сказал вам» здесь предпочтительнее более интерпретирующего «говорил вам».
- source_word: ὅτι
  choice: ':'
  rationale: В русском двоеточие после «сказал вам» естественно вводит содержание сказанного и позволяет избежать тяжеловесного «что».
- source_word: καὶ ἑωράκατέ με
  choice: вы и видели Меня
  rationale: Частица «и» перед сказуемым передаёт усилительное значение первого καί («действительно/даже видели»), не превращая координацию в явно уступительную конструкцию. Совершенный вид «видели» выражает состоявшийся опыт с сохраняющейся значимостью.
- source_word: καὶ οὐ πιστεύετε
  choice: и всё же не верите
  rationale: «И всё же» сохраняет соединительное καί и одновременно ясно выражает контраст между видением и продолжающимся неверием.
theological_decisions:
- issue: Значение первого καί в καὶ ἑωράκατέ με
  choice: «вы и видели Меня» с усилительной частицей «и»
  alternative: «хотя вы видели Меня»; «вы действительно видели Меня»
  rationale: Греческий текст допускает усилительное и контекстуально уступительное понимание. Русская конструкция с «и» сохраняет форму и риторическое напряжение, не закрепляя более сильную уступительную интерпретацию.
- issue: Передача πιστεύετε
  choice: «верите»
  alternative: «доверяете»; «имеете веру»
  rationale: «Верите» — прямой и устойчивый эквивалент глагола πιστεύω у Иоанна; он не сужает значение до интеллектуального согласия и не добавляет отсутствующего в тексте объекта веры.
translation_notes:
  register: Современный литературный русский язык, краткий и торжественно-сдержанный. Заглавные буквы в местоимениях «Я», «Меня» следуют принятой русской библейской издательской традиции. Синтаксис сохраняет обе греческие координированные части и их контраст без пояснительной сноски.
