  source_fidelity: Текст точно передаёт противопоставление ἀλλ’, предшествующее обращённое к слушателям εἶπον ὑμῖν и содержание с ὅτι. Конструкция «вы и видели Меня, и всё же не верите» сохраняет два καί, совершившееся видение (ἑωράκατε) и продолжающееся неверие (οὐ πιστεύετε), не навязывая более сильное уступительное прочтение.
  naturalness: Фраза краткая, ясная и соответствует современному литературному русскому с уместным сдержанно-библейским регистром. Усилительное «и» перед «видели» несколько маркировано, но в данной параллельной конструкции естественно и передаёт риторический акцент оригинала.
  terminology: «Верите» — прямое и нейтральное соответствие πιστεύετε в иоанновском употреблении. Заглавные буквы в местоимениях, относимых к Иисусу, последовательны с заявленной издательской конвенцией. Имена и специальные термины отсутствуют.
