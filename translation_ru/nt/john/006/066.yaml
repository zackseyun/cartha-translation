base_translation:
  language: en
  yaml_path: translation/nt/john/006/066.yaml
  text: From this time many of his disciples went back and no longer walked with him[a].
translation:
  language: ru
  text: С этого времени многие из Его учеников повернули назад и больше не ходили с Ним[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Из-за этого многие из Его учеников ушли»; начальные греческие слова допускают причинное понимание, хотя в контексте «С этого времени» лучше передаёт смысл переломного момента.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκ τούτου
  choice: С этого времени
  rationale: 'В данном контексте оборот естественно обозначает момент перелома: с этого времени, хотя грамматически возможно и причинное понимание.'
- source_word: πολλοὶ ἐκ τῶν μαθητῶν αὐτοῦ
  choice: многие из Его учеников
  rationale: 'Передаёт количественное значение πολλοί и сохраняет выраженный предлогом ἐκ партитивный смысл: речь идёт о многих из более широкой группы учеников.'
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: отошли назад
  rationale: Совместно глагол и оборот выражают уход, отступление и возвращение назад; перевод сохраняет образ, не сводя его лишь к физическому удалению.
- source_word: οὐκέτι
  choice: больше уже не
  rationale: Ясно обозначает прекращение продолжавшегося прежде действия с этого момента.
- source_word: μετ’ αὐτοῦ περιεπάτουν
  choice: не ходили с Ним
  rationale: Сохраняет образ хождения вместе с Иисусом и его контекстуальный оттенок постоянного общения и следования, не заменяя его толкованием.
theological_decisions:
- issue: Следует ли уточнять, что эти ученики принадлежали к Двенадцати или были истинно верующими
  choice: учеников
  alternative: последователей
  rationale: μαθηταί называет их учениками, но стих не отождествляет их с Двенадцатью и не определяет качество их веры. Перевод сохраняет заложенную в повествовании богословскую напряжённость.
- issue: Следует ли понимать Ἐκ τούτου только причинно
  choice: С этого времени
  alternative: Из-за этого
  rationale: Контекст поддерживает временное значение и подчёркивает переломный момент после трудных слов Иисуса, однако альтернативное причинное понимание сохраняется в примечании.
translation_notes:
  register: Современный литературный русский язык с естественным, но достойным библейским звучанием. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно устойчивой русской библейской традиции; образ «ходить с Ним» сохранён без поясняющего доктринального расширения.
