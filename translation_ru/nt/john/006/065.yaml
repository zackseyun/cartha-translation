  text: καὶ ἔλεγεν· Διὰ τοῦτο εἴρηκα ὑμῖν ὅτι οὐδεὶς δύναται ἐλθεῖν πρός με ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/065.yaml
  text: And he was saying[b][a], “For this reason I have told you that no one is able to come to me unless it has been given to him from the Father.”
translation:
  language: ru
  text: 'И Он говорил: «Вот почему Я сказал вам: никто не может прийти ко Мне, если ему не дано[a] от Отца».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если ему не даровано Отцом».'
    reason: 'Лексическая альтернатива: «даровано» явнее выражает предоставление; «Отцом» передаёт Отца как действующее лицо. Основной текст сохраняет базовое «дано» и значение источника в «от Отца».'
lexical_decisions:
- source_word: ἔλεγεν
  choice: говорил
  rationale: Имперфект передаёт продолжающуюся речь в рамках беседы; русское «говорил» естественно сохраняет этот аспект, не превращая форму в одноразовое «сказал».
- source_word: Διὰ τοῦτο
  choice: Вот почему
  rationale: Выражение отсылает к предшествующему рассуждению и вводит объяснение; «вот почему» ясно и естественно передаёт эту связь.
- source_word: εἴρηκα
  choice: Я сказал
  rationale: Греческий перфект обозначает ранее произнесённые слова, сохраняющие значение сейчас. В русском контексте естественное «Я сказал» передаёт эту связь без тяжеловесного «Я уже говорил».
- source_word: οὐδεὶς δύναται
  choice: никто не может
  rationale: Фраза выражает невозможность или неспособность, а не отсутствие разрешения; «не может» точно и естественно передаёт смысл.
- source_word: ἐλθεῖν πρός με
  choice: прийти ко Мне
  rationale: Это обычная русская передача выражения, сохраняющая характерный для Иоанна образ прихода к Иисусу без пояснительного расширения.
- source_word: ἐὰν μὴ ᾖ δεδομένον
  choice: если это не дано
  rationale: Перифрастическая пассивная конструкция обозначает необходимое условие, которое было дано. «Дано» сохраняет базовое значение δίδωμι и пассивную форму, не уточняя природу дара или действия.
- source_word: αὐτῷ
  choice: ему
  rationale: Местоимение стоит в мужском роде единственного числа, но имеет обобщающее значение; русское «ему» формально соответствует источнику и также может употребляться обобщённо.
- source_word: ἐκ τοῦ πατρός
  choice: от Отца
  rationale: Предлог ἐκ указывает прежде всего на источник; «от Отца» сохраняет эту семантику лучше, чем более агентное «Отцом».
theological_decisions:
- issue: Божественное содействие и способность человека прийти к Иисусу
  choice: Прямо передать невозможность прийти к Иисусу без того, что дано от Отца.
  alternative: Истолковать данное как непреодолимое призвание либо как предваряющую благодать, доступную каждому.
  rationale: Греческий текст устанавливает необходимое условие, но не разъясняет здесь характер, объём или способ действия этого дара. Перевод не разрешает последующие конфессиональные споры.
- issue: Неопределённый референт δεδομένον
  choice: Сохранить безличное «это не дано ему».
  alternative: 'Конкретизировать: «если Отец не даст ему такой возможности» или «если Отец не позволит ему».'
  rationale: В греческом тексте не названо прямо, что именно дано. Безличная конструкция сохраняет подлинную неоднозначность и связь с предшествующим контекстом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавные буквы в местоимениях «Он», «Я», «Мне» отражают принятую русскую религиозно-издательскую норму. Формулировка остаётся понятной без конфессионального истолкования.
