base_translation:
  language: en
  yaml_path: translation/nt/john/006/053.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, unless you eat the flesh of the Son of Man and drink his blood[b], you do not have life in yourselves.”
translation:
  language: ru
  text: 'Итак, Иисус сказал им: «Истинно, истинно говорю вам: если не будете есть плоть Сына Человеческого и пить Его кровь, не будете иметь в себе жизни[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте сказано просто «жизнь», а не «вечная жизнь», хотя в более широком контексте Евангелия от Иоанна эта жизнь часто связана с вечной жизнью.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: тогда
  rationale: Передаёт связь с предшествующей речью как естественный повествовательно-следственный переход; более буквальное «итак» здесь звучало бы несколько формально.
- source_word: Ἀμὴν ἀμὴν
  choice: истинно, истинно
  rationale: Сохраняет характерную для Евангелия от Иоанна удвоенную торжественную формулу и её эмфатическую силу.
- source_word: ἐὰν μὴ φάγητε ... καὶ πίητε
  choice: если не будете есть ... и пить
  rationale: Естественно передаёт условную конструкцию и сохраняет конкретные, намеренно резкие образы исходного текста.
- source_word: σάρκα
  choice: плоть
  rationale: Прямой эквивалент σάρξ, сохраняющий конкретность высказывания; «тело» могло бы ослабить исходную лексику и внести более узкую интерпретацию.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Сына Человеческого
  rationale: Устоявшееся русское обозначение, сохраняющее мессианские и библейские ассоциации титула.
- source_word: αἷμα
  choice: кровь
  rationale: Прямой перевод, сохраняющий резкость образа и его богословскую весомость.
- source_word: ζωὴν
  choice: жизни
  rationale: В греческом тексте стоит просто «жизнь», без определения «вечная»; контекстуальное уточнение не добавляется в основной текст.
- source_word: ἐν ἑαυτοῖς
  choice: в себе
  rationale: Естественный современный русский эквивалент, передающий внутреннее обладание жизнью без излишней буквальности «в самих себе».
theological_decisions:
- issue: Следует ли истолковывать вкушение плоти и питьё крови как исключительно евхаристическое или исключительно метафорическое высказывание
  choice: Сохранена буквальная формулировка «есть плоть ... и пить Его кровь» без поясняющей интерпретации
  alternative: Передать как «приобщаться», «принимать» или заменить «плоть» на «тело»
  rationale: Греческий текст намеренно конкретен и провокационен. Такой перевод сохраняет богословское напряжение и не предрешает спор между сакраментальным, метафорическим или совмещающим оба аспекта прочтением.
- issue: Следует ли уточнить ζωή как «вечную жизнь»
  choice: Оставлено «жизнь»
  alternative: «вечная жизнь»
  rationale: Определение αἰώνιος в этом стихе отсутствует, поэтому его добавление означало бы перенос контекстуального толкования в основной текст.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественности прямой речи Иисуса. Конкретная лексика «плоть» и «кровь» оставлена без смягчения; синтаксис сделан естественным для широкого круга читателей.
