lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: Я —
  rationale: Русское настоящее именное предложение естественно передаёт греческое «я есть» без связки «есть». Тире подчёркивает прямое отождествление, не превращая выражение в абсолютную формулу «Я есмь».
- source_word: ὁ ἄρτος
  choice: хлеб
  rationale: «Хлеб» — естественный и точный эквивалент ἄρτος в данном образном высказывании. Отдельный артикль по-русски не выражается, но определённость сохраняется структурой именного сказуемого и контекстом.
- source_word: τῆς ζωῆς
  choice: жизни
  rationale: 'Родительный падеж сохраняет компактную и неоднозначную связь исходного выражения: хлеб, относящийся к жизни и несущий её, без пояснительной парафразы.'
theological_decisions:
- issue: Сила формулы ἐγώ εἰμι в христологическом контексте Иоанна
  choice: Я — хлеб жизни
  alternative: Я есмь хлеб жизни
  rationale: Здесь ἐγώ εἰμι имеет выраженное именное сказуемое, поэтому архаическое «Я есмь» могло бы чрезмерно сблизить фразу с абсолютными формулами ἐγώ εἰμι. Современная конструкция с тире сохраняет сильное самоотождествление Иисуса без добавочного богословского истолкования.
- issue: Смысл родительного τῆς ζωῆς
  choice: хлеб жизни
  alternative: хлеб, дающий жизнь
  rationale: Формальное сочетание сохраняет возможную многогранность генитива; вариант «дающий жизнь» раскрывает лишь одно толкование и потому сужает исходное выражение.
translation_notes:
  register: Краткая, современная и литературная формулировка. Тире нормативно оформляет нулевую связку между местоимением и существительным и придаёт высказыванию необходимую весомость без архаизации.
