  text: ἥ τε θάλασσα ἀνέμου μεγάλου πνέοντος ⸀διεγείρετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/018.yaml
  text: And the sea was being stirred up because a strong wind was blowing[a].
translation:
  language: ru
  text: А море волновалось, потому что дул сильный ветер.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «море приходило в волнение»; возможный вариант: «море вздымалось».'
    reason: Лексически διεγείρετο допускает передачу как процесса возбуждения или нарастания волнения моря; основной текст использует наиболее естественное русское выражение.
lexical_decisions:
- source_word: ἥ τε θάλασσα
  choice: А море
  rationale: Существительное θάλασσα означает «море»; хотя речь идёт о Галилейском море, в греческом тексте употреблено нарицательное существительное. Частица τε имеет лёгкое соединительное значение, естественно передаваемое здесь союзом «а».
- source_word: ἀνέμου μεγάλου
  choice: сильный ветер
  rationale: Сочетание буквально означает «великий/сильный ветер»; применительно к ветру современное русское «сильный» точно и естественно передаёт μέγας, не усиливая значение до «бурного» или «штормового».
- source_word: πνέοντος
  choice: дул
  rationale: Причастие настоящего времени обозначает продолжающееся действие ветра. Придаточное причины «потому что дул» естественно выражает обстоятельственную связь и длительный характер действия.
- source_word: διεγείρετο
  choice: волновалось
  rationale: 'Имперфект среднего/пассивного по форме глагола διεγείρω описывает развивающееся в прошлом состояние моря: оно приходило в волнение. Русское «волновалось» естественно для моря и не добавляет прямо не названного образа бросаемых волн.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая, естественная повествовательная фраза. Сохранены соединительная частица, причинная связь причастного оборота и продолжающийся характер обоих действий.
