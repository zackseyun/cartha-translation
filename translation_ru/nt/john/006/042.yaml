  text: καὶ ἔλεγον· ⸀Οὐχ οὗτός ἐστιν Ἰησοῦς ὁ υἱὸς Ἰωσήφ, οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα; πῶς ⸀νῦν ⸀λέγει ὅτι Ἐκ τοῦ οὐρανοῦ καταβέβηκα;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/042.yaml
  text: And they were saying, “Is this not Jesus, the son of Joseph, whose father and mother we know? How does he now say, ‘I have come down from heaven’?”
translation:
  language: ru
  text: 'И они говорили: «Разве это не Иисус, сын Иосифа, отца и мать которого мы знаем? Как же он теперь говорит: „Я сошёл с неба“?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: говорили
  rationale: Русская форма прошедшего времени несовершенного вида передаёт длительный или повторяющийся характер речи, выраженный греческим имперфектом.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Разве это не
  rationale: Естественно передаёт отрицательный риторический вопрос, предполагающий утвердительный ответ.
- source_word: ὁ υἱὸς Ἰωσήφ
  choice: сын Иосифа
  rationale: Прямо сохраняет указание собеседников на известное им земное происхождение Иисуса.
- source_word: οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα
  choice: отца и мать которого мы знаем
  rationale: Сохраняет относительное придаточное и подчёркнутое ἡμεῖς «мы», которое в русском естественно выражается личной формой «мы знаем».
- source_word: πῶς νῦν λέγει
  choice: Как же он теперь говорит
  rationale: «Как» сохраняет основное значение πῶς без добавления модальности «может»; частица «же» естественно передаёт возражение, а «теперь» соответствует νῦν.
- source_word: Ἐκ τοῦ οὐρανοῦ
  choice: с неба
  rationale: Естественное русское обозначение исходной точки или происхождения; единственное число соответствует греческому οὐρανοῦ.
- source_word: καταβέβηκα
  choice: Я сошёл
  rationale: Совершенный вид передаёт завершённое нисхождение с сохраняющейся актуальностью, выраженное греческим перфектом; «сошёл» уместно в современном литературном и библейском регистре.
theological_decisions:
- issue: Возражение слушателей против заявления Иисуса о небесном происхождении
  choice: Сохранено прямое высказывание «Я сошёл с неба»
  alternative: «Я пришёл с неба» или метафорическое разъяснение
  rationale: Текст прямо связывает глагол нисхождения с небом как источником. Перевод не смягчает это утверждение и не уточняет сверх сказанного характер нисхождения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Местоимение «он» написано со строчной буквы согласно нейтральной современной орфографии; богословский смысл этим не изменяется. Синтаксис близок к греческому, но остаётся естественным по-русски.
