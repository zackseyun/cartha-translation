source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν, ζητεῖτέ με οὐχ ὅτι εἴδετε σημεῖα ἀλλ’ ὅτι ἐφάγετε ἐκ τῶν ἄρτων καὶ ἐχορτάσθητε·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/026.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you, you are seeking me not because you saw signs, but because you ate of the loaves and were filled.
translation:
  language: ru
  text: 'Иисус ответил им: «Истинно, истинно говорю вам: вы ищете Меня не потому, что увидели знамения, а потому, что ели хлеб и насытились[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «ели от хлебов и были насыщены». Греческий текст употребляет множественное число, отсылая к хлебам, которыми Иисус накормил множество людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: Иисус ответил им
  rationale: Обычная для греческого удвоенная формула речи «ответил… и сказал» естественно передана по-русски одним глаголом без потери смысла.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: Истинно, истинно говорю вам
  rationale: Сохранены характерный для Иоанна повтор и торжественность формулы; «истинно» понятно современному читателю.
- source_word: ζητεῖτέ με
  choice: вы ищете Меня
  rationale: Настоящее время передаёт продолжающееся действие; «ищете» сохраняет важную для Евангелия от Иоанна лексику.
- source_word: σημεῖα
  choice: знамения
  rationale: «Знамения» передаёт не только чудесность деяний, но и их указующий, откровенный смысл в повествовании Иоанна.
- source_word: ἐφάγετε ἐκ τῶν ἄρτων
  choice: ели хлеб
  rationale: В данном контексте естественное русское выражение передаёт вкушение от ранее умноженных хлебов; буквальное «ели от хлебов» звучало бы неестественно.
- source_word: ἐχορτάσθητε
  choice: насытились
  rationale: Точно и естественно выражает достижение сытости после еды, сохраняя пассивно-результативный смысл греческой формы.
theological_decisions:
- issue: Значение σημεῖα в контексте Евангелия от Иоанна
  choice: знамения
  alternative: чудеса
  rationale: «Знамения» сохраняет богословское напряжение между видением самого сверхъестественного события и пониманием того, на что оно указывает, не добавляя толкования в основной текст.
- issue: Причина, по которой люди ищут Иисуса
  choice: не потому… а потому
  alternative: не оттого… но оттого
  rationale: Конструкция ясно передаёт противопоставление причин и не усиливает высказывание до абсолютного отрицания любого восприятия знамений сверх того, что выражено в оригинале.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной формулы Иисуса и иоанновского термина «знамения». Местоимение «Меня» написано с прописной буквы в соответствии с принятой русской библейской издательской традицией.
