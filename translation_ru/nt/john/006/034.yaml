  text: εἶπον οὖν πρὸς αὐτόν· Κύριε, πάντοτε δὸς ἡμῖν τὸν ἄρτον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/034.yaml
  text: So they said to him[a], “Lord, always give us this bread.”
translation:
  language: ru
  text: 'Тогда они сказали Ему: «Господи[a], всегда давай нам этот хлеб».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господин». Греческое обращение может быть как титулом «Господь», так и почтительной формой обращения.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον
  choice: они сказали
  rationale: Аорист λέγω в повествовательном диалоге естественно передаётся как «сказали», без излишнего уточнения характера речевого действия.
- source_word: οὖν
  choice: тогда
  rationale: Частица связывает просьбу с предшествующими словами Иисуса; «тогда» естественно передаёт продолжение и обусловленность реплики в современном русском.
- source_word: πρὸς αὐτόν
  choice: Ему
  rationale: При глаголе речи πρός с винительным обозначает адресата; русский дательный передаёт это идиоматически.
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма «Господи» сохраняет основное значение титула κύριος и его возможную богословскую глубину, не устраняя возможности уважительного обращения.
- source_word: πάντοτε
  choice: всегда
  rationale: Прямой и естественный эквивалент, выражающий просьбу о постоянном даровании.
- source_word: δὸς
  choice: давай
  rationale: Императив в сочетании с «всегда» естественно передаётся несовершенным видом, обозначающим повторяющееся или продолжающееся дарование.
- source_word: ἡμῖν
  choice: нам
  rationale: Дательный косвенного объекта прямо и естественно передаётся русским «нам».
- source_word: τὸν ἄρτον τοῦτον
  choice: этот хлеб
  rationale: Сохраняет значение ἄρτος и указательную отсылку к хлебу, о котором только что шла речь.
theological_decisions:
- issue: Передача κύριος в прямом обращении к Иисусу
  choice: Господи
  alternative: Господин / Учитель
  rationale: «Господи» сохраняет традиционное и богословски ёмкое обращение к Иисусу. При этом контекст не требует считать, что говорящие уже вкладывают в него полное христологическое исповедание; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, естественным синтаксисом. «Тогда» поддерживает связь с предыдущей репликой, а «всегда давай» естественно выражает просьбу о постоянном даровании. Местоимение «Ему» написано с прописной буквы в соответствии с принятым благоговейным библейским регистром.
