  edition: SBLGNT
  text: ὅτι καταβέβηκα ⸀ἀπὸ τοῦ οὐρανοῦ οὐχ ἵνα ποιῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/038.yaml
  text: For I have come down from heaven, not to do my own will, but the will of the one who sent me.
translation:
  language: ru
  text: Ведь Я сошёл с небес не для того, чтобы исполнять Свою волю, но волю Пославшего Меня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Ведь
  rationale: В данном контексте союз вводит объяснение предыдущего утверждения. «Ведь» естественно передаёт причинно-пояснительную связь; более прямое «потому что» по-русски звучало бы тяжелее.
- source_word: καταβέβηκα
  choice: Я сошёл
  rationale: Греческий перфект обозначает совершившееся нисхождение с сохраняющимся результатом. В русском совершенный вид «сошёл» естественно выражает завершённость действия; конструкция «Я сошёл и пребываю здесь» была бы избыточным пояснением.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: с небес
  rationale: Естественное русское выражение, сохраняющее пространственный образ и богословское значение небесного происхождения. Множественная форма «небеса» нормативна в данном высоком, но понятном регистре.
- source_word: οὐχ ἵνα ποιῶ
  choice: не для того, чтобы исполнять
  rationale: Конструкция ясно передаёт отрицание цели. «Исполнять» идиоматично сочетается со словом «воля» и не добавляет к греческому тексту существенного нового смысла.
- source_word: τὸ θέλημα τὸ ἐμὸν
  choice: Свою волю
  rationale: Возвратное притяжательное местоимение естественно по-русски указывает на волю подлежащего и сохраняет противопоставление воле Пославшего. Ударное «Свою собственную» было бы стилистически перегружено.
- source_word: ἀλλὰ
  choice: но
  rationale: Простой противительный союз точно сохраняет резкое противопоставление двух целей.
- source_word: τὸ θέλημα τοῦ πέμψαντός με
  choice: волю Пославшего Меня
  rationale: Субстантивированное причастие передано кратко и естественно, без добавления слова «Отец», которого в самом стихе нет. Заглавные буквы служат традиционным русским способом обозначить Бога и не устраняют формальную сдержанность исходного выражения.
theological_decisions:
- issue: Нисхождение Иисуса с небес
  choice: Передать буквально как «Я сошёл с небес»
  alternative: Истолковать метафорически как указание лишь на Божье поручение
  rationale: Текст прямо говорит о нисхождении с небес. Перевод сохраняет это утверждение, не ослабляя его до одной лишь идеи посланничества и не добавляя догматического пояснения.
- issue: Соотношение воли Иисуса и воли Пославшего
  choice: Сохранить слово «воля» в обеих частях и прямое противопоставление
  alternative: 'Передать динамически: «делать то, чего хочу Я, а не то, чего хочет Он»'
  rationale: Повтор существительного θέλημα создаёт значимую симметрию и выражает различение в контексте миссии и послушания. Перевод не объясняет это различение через позднейшие технические категории и не сглаживает его.
- issue: Личность Пославшего
  choice: Не добавлять слово «Отец»
  alternative: «волю пославшего Меня Отца»
  rationale: Хотя контекст Евангелия указывает на Отца, греческий текст данного стиха содержит только субстантивированное причастие. Сдержанная передача не делает неявное явным.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной традиционностью. «Сошёл с небес» и «исполнять волю» понятны широкому читателю; синтаксический параллелизм оригинала сохранён. Слово «Ведь» связывает стих с предыдущим контекстом без тяжеловесности.
