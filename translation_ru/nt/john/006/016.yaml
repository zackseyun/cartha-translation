  text: Ὡς δὲ ὀψία ἐγένετο κατέβησαν οἱ μαθηταὶ αὐτοῦ ἐπὶ τὴν θάλασσαν,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/016.yaml
  text: When evening came[a], his disciples went down to the sea,
translation:
  language: ru
  text: Когда наступил вечер, Его ученики спустились к морю[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к озеру». Речь идёт о Галилейском море, которое с географической точки зрения является озером, однако в греческом тексте употреблено слово «море» (θάλασσα).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Когда
  rationale: Сочетание вводит временной переход; по-русски естественно передаётся союзом «когда», тогда как слабая связующая сила δέ понятна из последовательности повествования и не требует отдельного «же».
- source_word: ὀψία ἐγένετο
  choice: наступил вечер
  rationale: Естественная современная передача идиомы, обозначающей наступление вечера.
- source_word: κατέβησαν
  choice: спустились
  rationale: Глагол выражает движение вниз; «спустились» точно и естественно передаёт направление движения.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Его ученики
  rationale: Обычная русская передача определённой именной группы с притяжательным местоимением; прописная буква соответствует принятому благоговейному оформлению местоимений, относящихся к Иисусу.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: к морю
  rationale: ἐπί с винительным падежом после глагола движения указывает на движение к водоёму; «к морю» сохраняет θάλασσα, не заменяя его географически более точным словом «озеро».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествовательная фраза звучит естественно и достойно. Сохранено традиционное «море» с пояснением в сноске. Маркер сноски поставлен непосредственно после слова, к которому относится.
