lexical_decisions:
- source_word: ταῦτα
  choice: Это
  rationale: Указательное местоимение среднего рода множественного числа отсылает к предшествующим словам как к целому; по-русски естественное собирательное «это» передаёт такую отсылку без тяжеловесного «эти слова».
- source_word: εἶπεν
  choice: Он сказал
  rationale: Аорист λέγω прямо передан глаголом «сказал». Подлежащее подразумевается и из контекста относится к Иисусу; местоимение сохраняет эту имплицитность без добавления имени.
- source_word: ἐν συναγωγῇ
  choice: в синагоге
  rationale: Хотя в греческом существительное употреблено без артикля, конструкция естественно обозначает местную синагогу в Капернауме; русский язык не требует отдельного выражения определённости.
- source_word: διδάσκων
  choice: когда учил
  rationale: Причастие настоящего времени обозначает действие, одновременное с εἶπεν. Придаточное времени естественно выражает эту связь в современном русском языке.
- source_word: ἐν Καφαρναούμ
  choice: в Капернауме
  rationale: Название города передано принятой русской библейской формой; предлог «в» естественно выражает местонахождение.
