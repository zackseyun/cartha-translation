base_translation:
  language: en
  yaml_path: translation/nt/john/006/041.yaml
  text: So the Jews were grumbling about him because he said[a], “I am the bread that came down from heaven.”
translation:
  language: ru
  text: 'Поэтому иудеи роптали о Нём, потому что Он сказал[a]: «Я — хлеб, сошедший с небес».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «иудеи» у Иоанна в зависимости от контекста может означать жителей Иудеи или определённую группу противников Иисуса, в том числе иудейских руководителей, а не весь еврейский народ.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγόγγυζον
  choice: стали роптать
  rationale: Имперфект передаёт разворачивающееся в прошлом недовольство; «роптать» естественно отражает неодобрительные жалобы и сохраняет библейскую перекличку с ропотом в пустыне.
- source_word: οὖν
  choice: стали
  rationale: Связь со сказанным ранее выражена русской результативной конструкцией «стали роптать»; отдельное «поэтому» сделало бы фразу тяжелее и могло бы чрезмерно подчеркнуть формальный вывод.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Прямой и традиционно понятный эквивалент греческого выражения; сам стих не ограничивает его значение начальниками, а возможное контекстуальное сужение разъясняется в сноске.
- source_word: περὶ αὐτοῦ
  choice: на Него
  rationale: В сочетании с глаголом «роптать» русский язык естественно требует «на кого»; это передаёт направленность недовольства, не добавляя самостоятельного обвинения.
- source_word: ὅτι εἶπεν
  choice: за то, что Он сказал
  rationale: ὅτι имеет причинное значение, а русская конструкция ясно называет основание ропота.
- source_word: Ἐγώ εἰμι
  choice: Я —
  rationale: Именная конструкция с тире естественно передаёт подчёркнутое ἐγώ и связку εἰμι в русском настоящем времени.
- source_word: ὁ ἄρτος
  choice: хлеб
  rationale: В русском языке именная часть сказуемого обычно употребляется без артикля; определённость выражена самой конструкцией отождествления.
- source_word: ὁ καταβὰς
  choice: сошедший
  rationale: Причастие точно и естественно передаёт артиклевое аористное причастие, обозначающее совершившееся схождение.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: с небес
  rationale: Современное и достойное русское выражение, передающее небесное происхождение; множественная форма «небеса» устойчива в библейском контексте.
theological_decisions:
- issue: Референт οἱ Ἰουδαῖοι в Евангелии от Иоанна
  choice: 'В основном тексте: «иудеи»'
  alternative: «иудейские начальники» или «жители Иудеи»
  rationale: Перевод сохраняет широту греческого обозначения и не сужает его без прямого указания в стихе. Сноска предупреждает, что в повествовании Иоанна выражение может обозначать конкретную противостоящую Иисусу группу, а не весь еврейский народ.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Роптать» сохраняет важную ветхозаветную перекличку, не являясь непонятным архаизмом; заглавные местоимения в отношении Иисуса следуют принятой русской библейской издательской традиции.
