base_translation:
  language: en
  yaml_path: translation/nt/john/006/023.yaml
  text: But boats came from Tiberias near the place where they ate the bread after the Lord had given thanks[a].
translation:
  language: ru
  text: Но из Тивериады приплыли лодки[a] недалеко от места, где ели хлеб после того, как Господь возблагодарил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лодочки»; греческое слово πλοιάρια имеет уменьшительную форму.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт противопоставление предыдущему повествованию естественным русским союзом.
- source_word: ἦλθεν πλοιάρια
  choice: приплыли лодки и остановились
  rationale: Глагол ἔρχομαι обозначает прибытие; с лодками по-русски естественно «приплыли». Добавление «остановились» раскрывает подразумеваемое прибытие к месту, не меняя событийного содержания.
- source_word: ἐκ Τιβεριάδος
  choice: из Тивериады
  rationale: Стандартно передаёт исходный пункт движения.
- source_word: ἐγγὺς τοῦ τόπου
  choice: недалеко от того места
  rationale: Естественная современная передача пространственной близости.
- source_word: ὅπου ἔφαγον τὸν ἄρτον
  choice: где люди ели хлеб
  rationale: Форма ἔφαγον не выражает подлежащее явно; «люди» ясно указывает на участников предшествующего насыщения, не отождествляя их с лодками. Простой вид естественно передаёт аорист.
- source_word: εὐχαριστήσαντος τοῦ κυρίου
  choice: после того, как Господь вознёс благодарение
  rationale: Конструкция с аористным причастием обозначает предшествующее действие Господа; «вознёс благодарение» звучит достойно и сохраняет прямое значение εὐχαριστέω.
- source_word: τοῦ κυρίου
  choice: Господь
  rationale: Сохраняет почётный и христологически значимый титул κύριος применительно к Иисусу.
theological_decisions:
- issue: Передача κύριος
  choice: Господь
  alternative: Учитель; господин
  rationale: «Господь» сохраняет титульный и христологический вес слова, не сводя его к обычному обращению.
- issue: Связь благодарения Господа с вкушением хлеба
  choice: «где люди ели хлеб после того, как Господь вознёс благодарение»
  alternative: «где они ели хлеб, когда Господь вознёс благодарение»
  rationale: Передаёт вероятное временное предшествование аористного причастия и не добавляет сакраментального толкования.
translation_notes:
  register: Современный литературный русский, ясный для широкого читателя и сохраняющий достоинство повествования. Уменьшительный оттенок πλοιάρια вынесен в примечание, поскольку «лодочки» в основном тексте могло бы звучать эмоционально или несерьёзно.
