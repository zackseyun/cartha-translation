  text: ὡς δὲ ἐνεπλήσθησαν λέγει τοῖς μαθηταῖς αὐτοῦ· Συναγάγετε τὰ περισσεύσαντα κλάσματα, ἵνα μή τι ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/012.yaml
  text: And when they were filled[a], he says to his disciples, “Gather up the leftover pieces[d][c][b], so that nothing may be lost.”
translation:
  language: ru
  text: 'Когда же они насытились[a], он говорит[b] своим ученикам: «Соберите оставшиеся куски[c], чтобы ничего не пропало[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наелись досыта».'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте употреблено историческое настоящее: «говорит». В русском повествовании возможно также: «сказал».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «обломки». Имеются в виду куски хлеба.'
    reason: lexical_alternative
  - marker: d
    text: 'Или, по смыслу: «чтобы ничего не пропало зря».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Когда же
  rationale: Передаёт временное значение ὡς и лёгкую связующую функцию δέ естественным русским оборотом.
- source_word: ἐνεπλήσθησαν
  choice: они насытились
  rationale: В контексте еды глагол означает, что люди наелись досыта; «насытились» точно и естественно передаёт смысл без лишнего пояснения.
- source_word: λέγει
  choice: он говорит
  rationale: Сохранено историческое настоящее греческого повествования, характерное для Иоанна.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: своим ученикам
  rationale: «Ученикам» — точное и устойчивое соответствие μαθηταῖς; возвратное «своим» естественно передаёт принадлежность при подлежащем «он».
- source_word: Συναγάγετε
  choice: Соберите
  rationale: Прямое повеление, естественное для сбора оставшейся пищи.
- source_word: τὰ περισσεύσαντα κλάσματα
  choice: оставшиеся куски
  rationale: Перевод передаёт и то, что куски остались после еды, и предметное значение κλάσματα; слово «обломки» в данном контексте звучало бы менее естественно.
- source_word: ἵνα μή τι ἀπόληται
  choice: чтобы ничего не пропало
  rationale: Близко передаёт греческое выражение и сохраняет более широкое значение ἀπόληται, не сводя его исключительно к практическому «не было потрачено впустую».
theological_decisions:
- issue: Возможный богословский отзвук ἀπόληται в контексте знамения
  choice: «чтобы ничего не пропало»
  alternative: «чтобы ничего не было выброшено» / «чтобы ничто не погибло»
  rationale: Непосредственно речь идёт об оставшихся кусках пищи. При этом «не пропало» сохраняет лексическую широту глагола и возможный иоанновский отзвук, не навязывая стиху сотериологическое толкование.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным повествовательным стилем. Историческое настоящее сохранено ради формы исходного текста; местоимения, относящиеся к Иисусу, даны со строчной буквы в соответствии с нейтральной современной издательской нормой.
