  text: ἔστιν γεγραμμένον ἐν τοῖς προφήταις· Καὶ ἔσονται πάντες διδακτοὶ θεοῦ· ⸀πᾶς ὁ ⸀ἀκούσας παρὰ τοῦ πατρὸς καὶ μαθὼν ἔρχεται πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/045.yaml
  text: It is written in the Prophets[a], ‘And they will all be taught by God.’ Everyone who has heard from the Father and has learned comes to me.
translation:
  language: ru
  text: 'В пророческих книгах[a] написано: «И все будут научены Богом». Каждый, кто услышал от Отца и научился, приходит ко Мне.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог будет учить всех».'
    reason: Лексико-синтаксическая альтернатива для διδακτοὶ θεοῦ; передаёт смысл «научены Богом» активной конструкцией, сохраняя значение обучения.
lexical_decisions:
- source_word: ἔστιν γεγραμμένον
  choice: написано
  rationale: Естественная русская формула цитирования Писания, передающая сохраняющую силу написанного текста.
- source_word: ἐν τοῖς προφήταις
  choice: в книгах Пророков
  rationale: Передаёт вероятную отсылку к признанному корпусу пророческих книг; слово «книгах» делает выражение естественным по-русски, а прописная буква обозначает раздел Писания.
- source_word: ἔσονται πάντες διδακτοὶ θεοῦ
  choice: все будут научены Богом
  rationale: Сохраняет будущее значение и представляет Бога источником и деятелем обучения, не усложняя фразу неестественной буквальностью.
- source_word: πᾶς ὁ
  choice: каждый, кто
  rationale: Ясно передаёт субстантивированное единственное число с обобщающим значением.
- source_word: ἀκούσας παρὰ τοῦ πατρὸς καὶ μαθὼν
  choice: услышал от Отца и научился
  rationale: Сохраняет последовательность двух аористных причастий как действий, предшествующих приходу, и не добавляет не выраженного прямо дополнения к «научился».
- source_word: ἔρχεται πρὸς ἐμέ
  choice: приходит ко Мне
  rationale: Естественно передаёт настоящее время и личное движение к Иисусу.
theological_decisions:
- issue: Связь между Божьим наставлением и приходом к Иисусу
  choice: 'Сохранена последовательность текста: услышавший от Отца и научившийся приходит к Иисусу.'
  alternative: Истолковать эту связь либо строго детерминистически, либо с подчёркнутым акцентом на самостоятельном человеческом отклике.
  rationale: Греческий текст утверждает связь, но не объясняет её метафизический механизм; перевод не должен разрешать богословское напряжение за автора.
- issue: Отношение Отца к Иисусу
  choice: Сохранены прямые обозначения «Отец» и «Мне».
  alternative: Развернуть подразумеваемое христологическое утверждение поясняющими словами.
  rationale: Формулировка сохраняет мысль Иоанна о том, что истинное научение от Отца ведёт к Иисусу, не добавляя того, чего стих прямо не говорит.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «В книгах Пророков» понятно обозначает корпус Писания; прописные буквы в «Пророков», «Отца» и «Мне» отражают референцию, не добавляя толкования.
