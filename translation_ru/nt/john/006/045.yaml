    issue: «В книгах Пророков» неточно и потенциально двусмысленно передаёт ἐν τοῖς προφήταις.
    rationale: Здесь имеется в виду пророческий корпус Писания. «Пророков» как обозначение авторов/лиц в сочетании «книги Пророков» менее ясно и не является наиболее естественным современным русским обозначением корпуса.
  - severity: low
    issue: Маркер сноски поставлен после цитаты, а не после слов, к которым относится.
    rationale: Сноска поясняет перевод ἐν τοῖς προφήταις; для ясности якорь следует поставить непосредственно после «пророческих книгах».
  - severity: low
    issue: Формулировка прежней сноски «наставлены Богом» несколько расширяет значение до руководства.
    rationale: Для лексической альтернативы лучше дать вариант, который сохраняет именно значение обучения и отражает возможное активное перефразирование.
