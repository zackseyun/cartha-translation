review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан точно: формула написанного Писания, будущее «все будут научены Богом», а также последовательность «услышал от Отца и научился — приходит ко Мне» сохранены без богословских добавлений. Однако ἐν τοῖς προφήταις точнее и естественнее передать как «в пророческих книгах», а не «в книгах Пророков»: греческое выражение обозначает корпус пророческих Писаний, не книги, написанные персонажами, называемыми «Пророки».'
  naturalness: Текст в целом современный и литературный. «В пророческих книгах написано» звучит естественно в современном русском библейском регистре. «Каждый, кто услышал от Отца и научился, приходит ко Мне» удачно сохраняет лаконичность оригинала и не требует искусственного подразумеваемого дополнения.
  terminology: «Научены Богом» точно передаёт διδακτοὶ θεοῦ. «Отец» и «Мне» сохранены в традиционном для русских переводов Иоанна регистре. Сноска должна быть привязана к выражению, для которого она даётся; исходная сноска стояла после всей цитаты, хотя поясняла «Пророков».
  issues:
