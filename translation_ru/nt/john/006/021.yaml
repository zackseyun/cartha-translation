  source_fidelity: 'Требуется уточнить передачу ἤθελον: «захотели» естественно читается как возникшее желание («вдруг захотели»), тогда как имперфект в данном контексте обозначает готовность или согласие принять Иисуса в лодку. Остальная синтаксическая связь и подчёркнутая немедленность события переданы верно.'
  naturalness: «Лодка тотчас оказалась у земли» сохраняет формальную близость, но в современном русском «у земли» звучит неестественно и может вызвать образ лодки у поверхности земли, а не у места высадки. «У берега» — обычное русское контекстуальное соответствие и не требует утверждать, что лодка была выброшена на сушу.
  terminology: «Лодка», «тотчас» и написание «Его» соответствуют регистру современного литературного библейского перевода. «Были готовы взять Его в лодку» точно и естественно передаёт волевое значение ἤθελον без излишней эмоциональности.
