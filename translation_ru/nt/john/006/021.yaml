- from: Тогда они захотели взять Его в лодку, и лодка тотчас оказалась у земли, к которой они направлялись.[a]
  to: Тогда они были готовы взять Его в лодку, и тотчас лодка оказалась у берега, к которому они направлялись.[a]
  rationale: Исправлены два места, где русский черновик либо сужал видо-временной оттенок оригинала («захотели»), либо был стилистически неестественен («у земли»). «У берега» является безопасным контекстуальным переводом γῆ и сохраняет внезапность, выраженную εὐθέως; сноска оставляет возможную динамическую формулировку «достигла берега».
