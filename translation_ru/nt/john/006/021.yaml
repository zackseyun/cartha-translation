  text: ἤθελον οὖν λαβεῖν αὐτὸν εἰς τὸ πλοῖον, καὶ εὐθέως ⸂ἐγένετο τὸ πλοῖον⸃ ἐπὶ τῆς γῆς εἰς ἣν ὑπῆγον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/021.yaml
  text: So they were willing to take him into the boat[a], and immediately the boat was at the land to which they were going.
translation:
  language: ru
  text: Тогда они были готовы взять Его в лодку, и тотчас лодка оказалась у берега, к которому они направлялись.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и лодка тотчас достигла берега, к которому они направлялись».'
    reason: Греческое ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς буквально описывает, что лодка оказалась у земли; в контексте оно может обозначать прибытие к берегу.
lexical_decisions:
- source_word: ἤθελον
  choice: захотели
  rationale: В данном повествовательном контексте форма θέλω выражает возникшую готовность принять Иисуса после испуга; естественное русское «захотели» сохраняет волевой оттенок, не усиливая эмоциональность.
- source_word: οὖν
  choice: тогда
  rationale: Частица связывает действие с предшествующими словами Иисуса и одновременно продвигает повествование; «тогда» здесь звучит естественнее формального «итак».
- source_word: λαβεῖν αὐτὸν εἰς τὸ πλοῖον
  choice: взять Его в лодку
  rationale: Передаёт конкретное действие и сохраняет возможный оттенок принятия на борт без тяжеловесного «принять Его в лодку».
- source_word: πλοῖον
  choice: лодка
  rationale: Соответствует небольшому судну на Галилейском море и естественно для современного русского языка.
- source_word: εὐθέως
  choice: тотчас
  rationale: Сохраняет подчёркнутую внезапность события и при этом соответствует достоинству библейского повествования.
- source_word: ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς
  choice: лодка оказалась у земли
  rationale: Глагол γίνομαι с обозначением места передан как внезапное нахождение в точке назначения. «У земли» не создаёт ложного впечатления, будто лодка очутилась на суше, и не устраняет возможный чудесный смысл.
- source_word: γῆς
  choice: земли
  rationale: Формально сохраняет широкое значение γῆ; в контексте это суша или берег в месте назначения.
- source_word: εἰς ἣν ὑπῆγον
  choice: к которой они направлялись
  rationale: Естественно передаёт движение к цели и продолжающийся характер пути, выраженный имперфектом.
theological_decisions:
- issue: Следует ли объяснять или смягчать возможную чудесную внезапность прибытия лодки
  choice: Сохранить прямое «лодка тотчас оказалась у земли»
  alternative: «лодка тотчас пристала к берегу» или «вскоре лодка достигла берега»
  rationale: Греческий текст сообщает событие кратко и подчёркивает его немедленность. Перевод не должен ни прямо объявлять дополнительное чудо, ни сводить внезапность к обычному скорому прибытию.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным, но понятным повествовательным строем. Местоимение «Его» по отношению к Иисусу написано с прописной буквы согласно принятой русской библейской традиции. Маркер сноски поставлен после всего предложения, поскольку примечание предлагает альтернативу ко второй части стиха.
