  text: καὶ ἐμβάντες ⸀εἰς πλοῖον ἤρχοντο πέραν τῆς θαλάσσης εἰς Καφαρναούμ. καὶ σκοτία ἤδη ἐγεγόνει καὶ ⸀οὔπω ἐληλύθει πρὸς αὐτοὺς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/017.yaml
  text: They got into a boat and were heading across the sea to Capernaum[a]. And it had already become dark[c][b], and Jesus had not yet come to them.
translation:
  language: ru
  text: Они сели в лодку и плыли через море в Капернаум.[a] Уже наступила темнота,[b] а Иисус ещё не пришёл к ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к другому берегу моря, в Капернаум».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «уже стемнело».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντες εἰς πλοῖον
  choice: сели в лодку
  rationale: Аористное причастие обозначает действие, предшествующее движению; сочинительная конструкция естественна по-русски и ясно передаёт последовательность. Неопределённый артикль в греческом отсутствует, поэтому контекстуально нейтрально «в лодку».
- source_word: ἤρχοντο
  choice: направились
  rationale: Имперфект от ἔρχομαι описывает начавшееся и продолжавшееся движение. «Направились» естественно выражает движение к названной цели, хотя длительность передаёт менее явно, чем «плыли»; последнее добавляло бы способ движения, прямо не названный глаголом.
- source_word: πέραν τῆς θαλάσσης
  choice: через море
  rationale: πέραν с родительным допускает смысл движения через море или к его противоположному берегу. «Через море» сохраняет краткость и исходную морскую терминологию Иоанна.
- source_word: εἰς Καφαρναούμ
  choice: в Капернаум
  rationale: Предлог εἰς выражает направление к месту; употреблена традиционная русская форма географического названия.
- source_word: σκοτία ἤδη ἐγεγόνει
  choice: уже стемнело
  rationale: Безличная русская конструкция естественно передаёт наступление темноты и результирующее состояние, выраженные плюсквамперфектом γίνομαι.
- source_word: οὔπω ἐληλύθει πρὸς αὐτοὺς
  choice: ещё не пришёл к ним
  rationale: Передаёт οὔπω и плюсквамперфект как отсутствие прибытия Иисуса к данному моменту, не истолковывая выражение как «не присоединился».
- source_word: ὁ Ἰησοῦς
  choice: Иисус
  rationale: Традиционная русская форма имени.
theological_decisions:
- issue: Временная последовательность и повествовательный аспект
  choice: 'Сохранена последовательность: ученики сели в лодку, направились к Капернауму, уже наступила темнота, а Иисус к ним ещё не пришёл.'
  alternative: 'Передать ἤρχοντο простым «отправились», а σκοτία ἤδη ἐγεγόνει — статично: «уже было темно».'
  rationale: Формулировка поддерживает повествовательное напряжение перед приближением Иисуса по воде, не добавляя богословских выводов сверх текста.
translation_notes:
  register: Современный литературный русский язык; изложение естественное и сдержанно-достоинственное. Сочинительная конструкция вместо буквального причастного оборота облегчает чтение, сохраняя порядок событий. «Море» оставлено в соответствии с θάλασσα и словоупотреблением Иоанна.
