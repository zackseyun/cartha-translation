source:
  edition: SBLGNT
  text: τοῦτο ⸀γάρ ἐστιν τὸ θέλημα τοῦ ⸂πατρός μου⸃ ἵνα πᾶς ὁ θεωρῶν τὸν υἱὸν καὶ πιστεύων εἰς αὐτὸν ἔχῃ ζωὴν αἰώνιον, καὶ ἀναστήσω αὐτὸν ⸀ἐγὼ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/040.yaml
  text: 'For this is the will of my Father: that everyone who sees the Son and believes in him may have eternal life[b][a], and I myself will raise him up on the last day.'
translation:
  language: ru
  text: Ведь воля Моего Отца в том, чтобы каждый, кто видит Сына[a] и верит в Него, имел вечную жизнь; и Я Сам[b] воскрешу его в последний день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «созерцает Сына». Глагол может означать внимательное, осмысленное видение, а не только физическое зрительное восприятие.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст особо подчёркивает местоимение «Я»: «Я Сам воскрешу его».'
    reason: lexical_emphasis
lexical_decisions:
- source_word: τοῦτο γάρ ἐστιν τὸ θέλημα τοῦ πατρός μου
  choice: Ведь воля Моего Отца в том
  rationale: «Ведь» естественно передаёт пояснительную функцию γάρ, а конструкция «воля… в том, чтобы» ясно и по-русски связывает указательное τοῦτο с последующим ἵνα-придаточным.
- source_word: πᾶς ὁ θεωρῶν τὸν υἱόν
  choice: каждый, кто видит Сына
  rationale: Субстантивированное причастие настоящего времени передано обобщающей конструкцией «каждый, кто видит». Глагол θεωρέω может подразумевать внимательное, осмысленное созерцание, что отмечено в сноске без сужения смысла в основном тексте.
- source_word: καὶ πιστεύων εἰς αὐτόν
  choice: и верит в Него
  rationale: Сочетание πιστεύω с εἰς обозначает направленную на личность веру и доверие; устойчивое русское «верит в Него» сохраняет эту направленность.
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: имел вечную жизнь
  rationale: Форма «имел» естественно передаёт зависимое сослагательное наклонение в конструкции ἵνα и не превращает её в отдельное простое утверждение. «Вечная жизнь» сохраняет устойчивый и содержательно ёмкий смысл ζωὴ αἰώνιος.
- source_word: καὶ ἀναστήσω αὐτὸν ἐγώ
  choice: и Я Сам воскрешу его
  rationale: «Воскрешу» однозначно выражает эсхатологическое значение ἀναστήσω в данном контексте. «Я Сам» сохраняет явное усиление, создаваемое отдельно выраженным местоимением ἐγώ.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: в последний день
  rationale: Это естественная современная русская передача дательного времени и устойчивого эсхатологического выражения.
theological_decisions:
- issue: Соотношение всеобщего выражения πᾶς и условий θεωρῶν… πιστεύων
  choice: каждый, кто видит Сына и верит в Него, имел вечную жизнь
  alternative: всякий, видящий Сына и верующий в Него, имеет вечную жизнь
  rationale: Перевод сохраняет обобщающий охват и обе характеристики — видение Сына и веру в Него, — не привнося конфессионального объяснения о предопределении или свободе воли. Зависимая форма «имел» отражает ἵνα с сослагательным наклонением.
- issue: Личная роль Иисуса в καὶ ἀναστήσω αὐτὸν ἐγώ
  choice: и Я Сам воскрешу его
  alternative: и Я воскрешу его
  rationale: Усилительное «Сам» передаёт эксплицитное ἐγώ и подчёркивает личное действие Иисуса, не добавляя к тексту дальнейших догматических выводов.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан понятным для обычного читателя; традиционные богословские выражения «вечная жизнь», «Сын» и «последний день» сохранены. Заглавные буквы в местоимениях «Моего», «Него», «Я Сам» следуют принятой русской reverential практике и помогают обозначить референтов без изменения смысла.
