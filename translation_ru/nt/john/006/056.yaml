lexical_decisions:
- source_word: ὁ τρώγων
  choice: Тот, кто ест
  rationale: Артикль с причастием настоящего времени обозначает человека, для которого характерно это действие. Такая передача сохраняет единственное число и продолжающийся характер действия, оставаясь естественной по-русски.
- source_word: τρώγων
  choice: ест
  rationale: Глагол τρώγω может иметь более наглядный оттенок — «жевать, есть», однако в данном контексте нейтральное «ест» звучит естественно и не усиливает образ сверх необходимого.
- source_word: μου τὴν σάρκα
  choice: Мою плоть
  rationale: σάρξ здесь передано конкретным словом «плоть», чтобы сохранить воплощённую и жертвенную образность высказывания без конфессионального истолкования.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: и пьёт Мою кровь
  rationale: Координированное причастие настоящего времени передано прямо и параллельно первой части; конкретное слово «кровь» сохраняет резкость греческого образа.
- source_word: ἐν ἐμοὶ μένει
  choice: остаётся во Мне
  rationale: μένω — ключевой для Иоанна глагол со значением пребывания и устойчивой связи. «Остаётся» понятно современному читателю и сохраняет идею постоянства.
- source_word: κἀγὼ ἐν αὐτῷ
  choice: и Я — в нём
  rationale: В греческом повтор глагола опущен. Русская конструкция с тире естественно сохраняет этот эллипсис, не добавляя слова «остаюсь».
theological_decisions:
- issue: Евхаристическое/сакраментальное или метафорическое понимание вкушения плоти и питья крови
  choice: Сохранить конкретную формулировку греческого текста без поясняющего расширения.
  alternative: Явно отнести слова либо к таинству, либо к вере как метафорическому вкушению.
  rationale: Сам стих использует конкретные образы, но не разрешает здесь спор между традициями. Перевод не вводит конфессионального толкования.
- issue: Иоаннова тема взаимного пребывания
  choice: Передать μένει словом «остаётся», сохранив эллиптическое «и Я — в нём».
  alternative: «Пребывает во Мне, и Я в нём» или истолковывающее «соединён со Мной».
  rationale: Выбор передаёт устойчивую взаимную связь, не превращая её в более позднюю догматическую формулу; вариант «пребывает» отмечен как традиционный.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Прописные буквы в местоимениях, относящихся к Иисусу, соответствуют принятому русскому библейскому регистру. Конкретные слова «плоть» и «кровь» сохранены без конфессионального пояснения.
