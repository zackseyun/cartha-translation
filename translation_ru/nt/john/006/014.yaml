base_translation:
  language: en
  yaml_path: translation/nt/john/006/014.yaml
  text: So when the people saw the sign that he had done[a], they were saying[b], “This truly is the Prophet who is coming into the world.”
translation:
  language: ru
  text: 'Итак, увидев знамение, которое Он совершил,[a] люди говорили: «Он воистину тот Пророк,[b] который приходит в мир».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых рукописях отсутствуют слова «знамение, которое Он совершил». «Знамение» также можно передать как «чудо», но у Иоанна это слово обычно подчёркивает значение совершённого Иисусом.
    reason: textual_variant; lexical_alternative
  - marker: b
    text: «Тот Пророк» — вероятная отсылка к обещанному пророку, подобному Моисею (Втор 18:15–18).
    reason: cross_reference
lexical_decisions:
- source_word: οἱ οὖν ἄνθρωποι
  choice: Итак, … люди
  rationale: οὖν передаёт вывод или развитие повествования, а ἄνθρωποι обозначает людей вообще, а не только мужчин.
- source_word: ἰδόντες
  choice: увидев
  rationale: Деепричастие естественно передаёт предшествующее действие аористного причастия и сохраняет связь с главным глаголом.
- source_word: ὃ ἐποίησεν σημεῖον
  choice: знамение, которое Он совершил
  rationale: 'Знамение сохраняет характерное для Иоанна значение σημεῖον: чудесное деяние служит указанием на личность и миссию Иисуса, а не является лишь проявлением силы.'
- source_word: ἔλεγον
  choice: говорили
  rationale: Несовершенный вид русского глагола естественно отражает имперфект и допускает продолжающуюся либо повторявшуюся речь.
- source_word: ἀληθῶς
  choice: воистину
  rationale: Слово выражает уверенное признание подлинности; «воистину» звучит достойно и понятно в контексте торжественного исповедания.
- source_word: ὁ προφήτης
  choice: тот Пророк
  rationale: Артикль указывает на определённую ожидаемую фигуру. Указательное «тот» по-русски ясно передаёт определённость, а прописная буква отмечает титульное употребление, не раскрывая его сверх сказанного в тексте.
- source_word: ὁ ἐρχόμενος εἰς τὸν κόσμον
  choice: который должен прийти в мир
  rationale: Артиклевое причастие обозначает ожидаемого Приходящего. Русское «должен прийти» естественно выражает устойчивое ожидание, не утверждая внешней по отношению к тексту хронологии.
theological_decisions:
- issue: Отождествление «Пророка»
  choice: тот Пророк
  alternative: пророк, подобный Моисею
  rationale: Фраза, вероятно, отсылает к ожидаемому пророку из Втор 18:15–18, однако сам греческий текст не добавляет «подобный Моисею». Перевод сохраняет определённость титула, а пояснение выносится в сноску.
- issue: Временной и модальный оттенок ὁ ἐρχόμενος
  choice: который должен прийти
  alternative: который приходит
  rationale: Оборот может буквально означать «приходящий», но в данном исповедании он характеризует ожидаемую фигуру. «Должен прийти» передаёт этот идиоматический смысл, не уточняя, считала ли толпа его приход уже полностью осуществившимся.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Знамение» и «воистину» сохранены как понятные термины, несущие важные смысловые оттенки; синтаксис сделан плавным и доступным.
