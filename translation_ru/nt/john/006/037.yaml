  text: πᾶν ὃ δίδωσίν μοι ὁ πατὴρ πρὸς ἐμὲ ἥξει, καὶ τὸν ἐρχόμενον πρός ⸀με οὐ μὴ ἐκβάλω ἔξω,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/037.yaml
  text: All that the Father gives me will come to me[b][a], and the one who comes to me I will certainly not cast out.
translation:
  language: ru
  text: Всё, что Отец даёт Мне, придёт ко Мне[a], и того, кто приходит ко Мне, Я никогда не изгоню вон[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Все, кого Отец даёт Мне, придут ко Мне». В греческом тексте употреблено собирательное выражение среднего рода единственного числа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ни в коем случае не изгоню вон». В греческом тексте стоит усиленное отрицание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὃ
  choice: Всё, что
  rationale: Средний род единственного числа передаёт собирательное выражение оригинала и не заменяет его более истолковывающим личным «все, кого».
- source_word: δίδωσίν μοι
  choice: даёт Мне
  rationale: Настоящее время переведено простым настоящим без уточнения, является ли действие продолжающимся или завершённым.
- source_word: ὁ πατήρ
  choice: Отец
  rationale: Сохранено наименование с определённостью, присущей греческому артиклю; притяжательное «Мой» не добавлено.
- source_word: πρὸς ἐμὲ ἥξει
  choice: придёт ко Мне
  rationale: Естественно передаёт будущее время и обычное для Евангелия от Иоанна выражение движения к Иисусу.
- source_word: τὸν ἐρχόμενον πρός με
  choice: того, кто приходит ко Мне
  rationale: Передаёт субстантивированное причастие настоящего времени, сохраняя как личный, так и обобщающий смысл.
- source_word: οὐ μὴ ἐκβάλω ἔξω
  choice: Я ни в коем случае не прогоню прочь
  rationale: «Ни в коем случае» выражает усиленное отрицание οὐ μή, а «прогоню прочь» естественно передаёт сочетание ἐκβάλλω с ἔξω.
theological_decisions:
- issue: Собирательное выражение среднего рода πᾶν ὃ в связи с тем, что Отец даёт, и приходом к Иисусу
  choice: Сохранено собирательное «Всё, что Отец даёт Мне».
  alternative: «Все, кого Отец даёт Мне»
  rationale: Греческий текст использует средний род единственного числа. Перевод сохраняет эту особенность и не решает за читателя, следует ли понимать сказанное прежде всего корпоративно или применительно к отдельным людям.
- issue: Сила обещания в οὐ μὴ ἐκβάλω ἔξω
  choice: 'Усиленное заверение: «ни в коем случае не прогоню прочь».'
  alternative: «никогда не прогоню прочь»
  rationale: Передано категорическое отрицание, но стих не развёрнут в более поздние доктринальные формулировки о стойкости верующих или отпадении.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Написание «Мне», «Я» с прописной буквы соответствует принятой русской традиции передачи речи Христа; синтаксис остаётся ясным для широкого круга читателей.
