  yaml_path: translation/nt/john/006/028.yaml
  text: Then they said to him[a], “What must we do so that we may work the works of God?”
translation:
  language: ru
  text: 'Тогда они сказали ему: «Что нам делать, чтобы совершать дела Божьи[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Что нам делать, чтобы совершать дела, которых требует Бог?» Греческое выражение «дела Божьи» допускает разные смысловые оттенки.'
    reason: Альтернативное понимание неоднозначного родительного оборота τοῦ θεοῦ.
lexical_decisions:
- source_word: εἶπον
  choice: сказали
  rationale: Аорист λέγω естественно передаётся формой простого прошедшего времени; «сказали» не уточняет характер речевого действия сверх исходного текста.
- source_word: οὖν
  choice: тогда
  rationale: В данном повествовательном контексте слово продолжает ход разговора; «тогда» звучит естественно и не усиливает логическое следствие.
- source_word: πρὸς αὐτόν
  choice: ему
  rationale: При глаголе речи πρός с винительным обозначает адресата; по-русски это естественно передаётся дательным падежом.
- source_word: Τί ποιῶμεν
  choice: Что нам делать
  rationale: Совещательный конъюнктив выражает вопрос о требуемом действии; эта формулировка естественна в современном русском и сохраняет практическую направленность вопроса.
- source_word: ἵνα
  choice: чтобы
  rationale: Союз вводит цель и прямо соответствует естественной русской целевой конструкции.
- source_word: ἐργαζώμεθα
  choice: совершать
  rationale: Глагол означает трудиться, исполнять или осуществлять. «Совершать» естественно сочетается со словом «дела», хотя не воспроизводит однокоренное повторение греческого текста.
- source_word: τὰ ἔργα
  choice: дела
  rationale: «Дела» сохраняет широкий смысл поступков или совершаемого труда и уместно в богословском контексте Евангелия.
- source_word: τοῦ θεοῦ
  choice: Божьи
  rationale: Притяжательное прилагательное представляет собой естественный русский эквивалент греческого родительного и не устраняет полностью его смысловую открытость.
theological_decisions:
- issue: Значение родительного оборота τὰ ἔργα τοῦ θεοῦ
  choice: дела Божьи
  alternative: дела, которых требует Бог; дела, принадлежащие Богу; дела, совершаемые Богом
  rationale: Греческий родительный допускает несколько смысловых отношений. Основной текст сохраняет краткий открытый оборот, а примечание сообщает наиболее уместное в вопросе толкование, не устраняя игры смысла, получающей развитие в следующем стихе.
translation_notes:
  register: Современный литературный русский язык с ясным и достойным повествовательным тоном. Формулировка «совершать дела» выбрана вместо буквального, но тяжеловесного «делать дела»; неоднозначность оборота «дела Божьи» сохранена и пояснена в сноске.
