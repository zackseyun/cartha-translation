id: JHN.6.55
reference: John 6:55
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἡ γὰρ σάρξ μου ⸀ἀληθής ἐστι βρῶσις, καὶ τὸ αἷμά μου ⸁ἀληθής ἐστι πόσις.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/055.yaml
  text: For my flesh is true food[a], and my blood is true drink.
translation:
  language: ru
  text: Ибо Моя плоть — истинная пища[a], и Моя кровь — истинное питьё.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «настоящая пища» и «настоящее питьё».'
    reason: Лексическая альтернатива для ἀληθής, которое может означать как «истинный», так и «настоящий, реальный».
lexical_decisions:
- source_word: γὰρ
  choice: Ибо
  rationale: Сохраняет пояснительную связь с предыдущим высказыванием и естественно вводит основание сказанного.
- source_word: σάρξ
  choice: плоть
  rationale: Прямо передаёт греческое слово и сохраняет значимое сопоставление плоти и крови, не подменяя «плоть» более толковательным словом «тело».
- source_word: ἀληθής
  choice: истинная / истинное
  rationale: Сохраняет прямое значение и характерный для Иоанна богословски насыщенный оттенок; вариант «настоящая / настоящее» указан в сноске.
- source_word: βρῶσις
  choice: пища
  rationale: В предикативной конструкции и в параллели с πόσις речь идёт о том, что едят, а не о самом процессе еды.
- source_word: αἷμα
  choice: кровь
  rationale: Буквальная передача сохраняет параллель «плоть и кровь» без смягчающего истолкования.
- source_word: πόσις
  choice: питьё
  rationale: Передаёт то, что пьют, и образует естественную смысловую пару со словом «пища».
theological_decisions:
- issue: Передача ἀληθής в контексте евхаристических споров
  choice: истинная / истинное
  alternative: настоящая / настоящее
  rationale: «Истинная» ближе сохраняет форму и богословское напряжение греческого текста, не разрешая переводом спор о характере присутствия; более разговорно-идиоматический вариант дан в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной синтаксической формой. «Ибо» уместно передаёт пояснительное γάρ; тире естественно оформляет именное сказуемое. Местоимение «Моя» написано с прописной буквы согласно распространённой русской библейской издательской традиции.
