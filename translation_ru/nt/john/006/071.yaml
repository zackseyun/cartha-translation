revisions:
- from: 'Он говорил об Иуде, сыне Симона Искариота: именно ему, одному из Двенадцати, предстояло предать Его[a].'
  to: Он говорил об Иуде, сыне Симона Искариота, который должен был предать Его — один из Двенадцати.[a]
  rationale: Исправление сохраняет выбранное контекстуальное «предать» и сноску к παραδιδόναι, но передаёт οὗτος как прямой субъект через «который». «Должен был» здесь передаёт перспективное μέλλω («был о том, чтобы / должен был впоследствии»), не утверждая отдельно ни принуждения, ни доктринального предопределения. Тире естественно оформляет заключительное пояснение «один из Двенадцати».
