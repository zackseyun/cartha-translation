base_translation:
  language: en
  yaml_path: translation/nt/john/006/071.yaml
  text: He was speaking about Judas[a], the son of Simon Iscariot, for this one was about to betray him, being one of the Twelve.
translation:
  language: ru
  text: Он говорил об Иуде, сыне Симона Искариота, который должен был предать Его — один из Двенадцати.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, буквальнее: «выдать Его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ τὸν Ἰούδαν
  choice: Он говорил об Иуде
  rationale: Имперфект ἔλεγεν передаёт поясняющее действие в прошедшем времени; конструкция с винительным τὸν Ἰούδαν по-русски естественно выражается оборотом «говорил об Иуде». Частица δὲ здесь служит мягкой связкой и не требует отдельного слова.
- source_word: Σίμωνος Ἰσκαριώτου
  choice: сыне Симона Искариота
  rationale: 'Родительные формы естественнее всего понимать как указание на отца: Иуда был сыном Симона, носившего прозвание Искариот.'
- source_word: οὗτος γὰρ
  choice: именно ему
  rationale: Указательное οὗτος имеет выделительную силу, а γὰρ вводит пояснение. После двоеточия русское «именно ему» естественно сохраняет акцент и пояснительную связь.
- source_word: ἔμελλεν
  choice: предстояло
  rationale: Передаёт будущее действие, уже находящееся в поле повествования, не приписывая Иуде прямо ни намерения, ни предопределённости и не создавая ложного впечатления немедленности.
- source_word: παραδιδόναι αὐτόν
  choice: предать Его
  rationale: В контексте поступка Иуды «предать» ясно выражает повествовательный и нравственный смысл глагола; более буквальное «выдать Его» сохранено в сноске.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: одному из Двенадцати
  rationale: 'Включение оборота в приложение сохраняет ударение на поразительном обстоятельстве: предателем должен был стать один из круга Двенадцати.'
theological_decisions:
- issue: Смысл παραδιδόναι применительно к Иуде
  choice: предать Его
  alternative: выдать Его
  rationale: Контекст характеризует действие Иуды как предательство, однако исходный глагол буквально обозначает передачу человека в чужие руки; эта смысловая широта отмечена в сноске.
- issue: Оттенок ἔμελλεν
  choice: предстояло
  alternative: собирался; должен был
  rationale: «Предстояло» сохраняет перспективу будущего события, не решая за текст вопрос о личном намерении Иуды или о характере предопределения.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified повествовательным строем. Двоеточие естественно вводит авторское пояснение; «Двенадцать» оформлено как название определённого круга учеников.
