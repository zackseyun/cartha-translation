  text: But he was saying this to test him[a], for he himself knew what he was about to do.
translation:
  language: ru
  text: Он говорил это, испытывая его[a], потому что сам знал, что собирается сделать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проверяя его». Глагол может также означать «искушать», но здесь речь идёт об испытании или проверке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ἔλεγεν
  choice: Он говорил это
  rationale: «Это» отсылает к предыдущему вопросу Иисуса; несовершенный вид «говорил» естественно передаёт имперфект ἔλεγεν. Частица δέ здесь обозначает переход к пояснению и не требует обязательного отдельного «но» в русском тексте.
- source_word: πειράζων αὐτόν
  choice: испытывая его
  rationale: В данном контексте πειράζω означает проверять, подвергать испытанию, а не склонять ко злу. Деепричастие сохраняет обстоятельственную связь с основным глаголом, не исключая оттенков цели и сопутствующего действия.
- source_word: αὐτὸς γὰρ ᾔδει
  choice: потому что сам знал
  rationale: «Сам» сохраняет эмфазу явного местоимения αὐτός, а «потому что» естественно передаёт пояснительное γάρ.
- source_word: τί ἔμελλεν ποιεῖν
  choice: что собирается сделать
  rationale: Оборот μέλλω с инфинитивом указывает на предстоящее или задуманное действие; «собирается сделать» сохраняет эту широту лучше, чем более узкое «вот-вот сделает».
theological_decisions:
- issue: Смысл πειράζων применительно к действию Иисуса по отношению к Филиппу
  choice: «испытывая»
  alternative: «искушая»; «проверяя»
  rationale: Контекст говорит о проверке Филиппа, а не о побуждении ко злу. «Испытывая» сохраняет обычную для библейского контекста идею испытания, не добавляя нравственно отрицательного смысла.
- issue: Подчёркнутое знание Иисуса
  choice: «сам знал»
  alternative: «знал»
  rationale: Явное αὐτός эмфатично; слово «сам» передаёт намеренность и предварительное знание Иисуса без дальнейшего догматического расширения.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинный. Причинное «потому что» звучит естественнее буквального «ибо», а настоящее время «собирается» согласуется с прошедшим «знал» как зависимая передача предстоящего с точки зрения того момента.
