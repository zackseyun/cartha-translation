base_translation:
  language: en
  yaml_path: translation/nt/john/006/064.yaml
  text: But there are some among you who do not believe[a]. For Jesus knew from the beginning who those were who did not believe[b], and who it was who would betray him.
translation:
  language: ru
  text: Но среди вас есть такие, которые не верят. Ведь Иисус с самого начала знал, кто не верил и кто предаст Его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «кто выдаст Его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Естественно передаёт противопоставление предшествующему высказыванию.
- source_word: ἐξ ὑμῶν τινες
  choice: среди вас есть такие
  rationale: Современное и естественное выражение принадлежности некоторых людей к группе слушателей.
- source_word: οἳ οὐ πιστεύουσιν
  choice: которые не верят
  rationale: Настоящее время передаёт продолжающееся неверие; по-русски это естественно выражается настоящим временем.
- source_word: ᾔδει
  choice: знал
  rationale: Передаёт состояние знания в прошлом без ненужного усложнения временной формы.
- source_word: ἐξ ἀρχῆς
  choice: с самого начала
  rationale: Сохраняет временную отсылку, не уточняя, о каком именно начале идёт речь.
- source_word: οἱ μὴ πιστεύοντες
  choice: кто не верит
  rationale: Естественно передаёт субстантивированное причастие и сохраняет его характеристику продолжающегося неверия.
- source_word: παραδώσων αὐτόν
  choice: кто предаст Его
  rationale: В данном повествовательном контексте глагол обозначает предательскую выдачу Иисуса; буквальная возможность отмечена в сноске.
theological_decisions:
- issue: Передача πιστεύω в контексте реакции учеников на слова Иисуса
  choice: верить
  alternative: доверять
  rationale: «Верить» сохраняет широкий смысл глагола у Иоанна и не сужает его до одной лишь эмоционально-реляционной стороны.
- issue: Передача παραδίδωμι применительно к Иуде
  choice: предаст
  alternative: выдаст Его
  rationale: Контекст ясно указывает на предательство, однако более буквальный смысл «передать, выдать» сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Повтор «кто… и кто…» сохраняет структуру греческого текста. Местоимение «Его» написано с прописной буквы согласно распространённой русской библейской издательской традиции.
