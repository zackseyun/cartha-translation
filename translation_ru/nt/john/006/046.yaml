  text: Not that anyone has seen the Father[a], except the one who is from God; he has seen the Father.
translation:
  language: ru
  text: Не то чтобы кто-нибудь видел Отца; только тот, кто от Бога, видел Отца[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с оттенком личной близости: «только тот, кто у Бога, видел Отца»; возможен также перевод: «тот, кто из присутствия Бога». Греческое выражение может указывать не только на происхождение, но и на личную близость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: Не то чтобы
  rationale: Естественно по-русски вводит уточнение и сохраняет корректирующую силу выражения, не превращая его в причинный оборот.
- source_word: τὸν πατέρα
  choice: Отца
  rationale: Обычное для Иоанна обозначение Бога как Отца; прописная буква указывает на титульное божественное употребление.
- source_word: ἑώρακέν τις
  choice: видел кто-либо
  rationale: В отрицательной конструкции τις передано как «кто-либо». Русское прошедшее совершенного вида естественно выражает состоявшийся опыт видения; буквальная передача греческого перфекта здесь была бы неидиоматична.
- source_word: εἰ μὴ
  choice: кроме
  rationale: Оборот обозначает исключение, а не условие.
- source_word: ὁ ὢν
  choice: Того, кто
  rationale: Субстантивированное причастие обозначает Лицо через Его продолжающееся отношение к Богу; конструкция «Того, кто» естественна в русском контексте после «кроме».
- source_word: παρὰ τοῦ θεοῦ
  choice: от Бога
  rationale: παρά с родительным падежом прежде всего указывает здесь на источник или происхождение; формулировка также допускает характерную для контекста мысль об особой близости, вынесенную в примечание.
- source_word: οὗτος
  choice: Он
  rationale: Указательное местоимение с усилением отсылает к только что названному Лицу. В русском отдельное предложение и местоимение «Он» ясно и естественно сохраняют этот акцент.
- source_word: ἑώρακεν
  choice: видел
  rationale: Совершившееся видение с сохраняющейся значимостью естественно передаётся русским «видел»; контекст не требует искусственной аспектуальной кальки.
theological_decisions:
- issue: Отношение Сына к Богу в выражении παρὰ τοῦ θεοῦ
  choice: от Бога
  alternative: из присутствия Бога; пребывающий у Бога
  rationale: Основной текст сохраняет утверждение об уникальном происхождении и отношении к Богу, не уточняя сверх греческого текста метафизический или пространственный оттенок. Примечание отражает возможный смысл личной близости.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Формула «Не то чтобы» сохраняет характер поясняющей оговорки. Прописные «Того» и «Он» помогают ясно обозначить уникальное Лицо в традиционном библейском регистре, не добавляя имени «Сын», отсутствующего в стихе.
