  text: Πολλοὶ οὖν ἀκούσαντες ἐκ τῶν μαθητῶν αὐτοῦ εἶπαν· Σκληρός ἐστιν ⸂ὁ λόγος οὗτος⸃· τίς δύναται αὐτοῦ ἀκούειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/060.yaml
  text: Therefore many of his disciples[a], when they heard it, said, “This word is hard[b]; who can listen to it?”
translation:
  language: ru
  text: 'Итак, многие из его учеников, услышав это, сказали: «Эта речь трудна[a]. Кто может её слушать[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Эта речь сурова»; λόγος здесь может означать также «высказывание», «слово» или «учение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Кто может её слышать?» Греческий глагол может означать «слышать», «слушать», а в данном контексте также «внимать» или «принимать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ οὖν
  choice: Итак, многие
  rationale: «Многие» точно передаёт количественное указание, а «итак» сохраняет связь сказанного с предшествующей речью Иисуса.
- source_word: ἀκούσαντες
  choice: услышав это
  rationale: Деепричастный оборот естественно передаёт обстоятельственное значение аористного причастия; «это» восполняется из контекста и относится к только что услышанной речи.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: из его учеников
  rationale: Конструкция показывает, что говорившие принадлежали к более широкому кругу учеников Иисуса.
- source_word: Σκληρός
  choice: трудное
  rationale: Передаёт мысль о слове, которое трудно воспринять, не сводя возражение исключительно к интеллектуальной непонятности или оскорбительности; возможная суровость отмечена в сноске.
- source_word: ὁ λόγος οὗτος
  choice: это трудное слово
  rationale: «Слово» сохраняет единственное число и широкое значение λόγος — высказывание, речь или учение — вместо преждевременного уточнения.
- source_word: τίς δύναται αὐτοῦ ἀκούειν
  choice: Кто может его слушать?
  rationale: «Слушать» сохраняет повтор корня со значением слухового восприятия и одновременно допускает смысл внимательного принятия сказанного, не усиливая его до однозначного «принять».
theological_decisions:
- issue: Характер возражения учеников против речи Иисуса
  choice: Высказывание трудно воспринять или принять, без уточнения, является ли трудность интеллектуальной, нравственной или вызвана его суровостью.
  alternative: Высказывание лишь непонятно либо однозначно оскорбительно и неприемлемо.
  rationale: σκληρός допускает оттенки трудности, суровости и тяжести для восприятия. Основной текст и сноска сохраняют эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Местоимение «его» написано со строчной буквы по нормам современного нейтрального издания. Сохранены краткость реплики, единственное число λόγος и неоднозначность глагола ἀκούω.
