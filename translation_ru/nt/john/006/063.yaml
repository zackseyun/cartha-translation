id: JHN.6.63
reference: John 6:63
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τὸ πνεῦμά ἐστιν τὸ ζῳοποιοῦν, ἡ σὰρξ οὐκ ὠφελεῖ οὐδέν· τὰ ῥήματα ἃ ἐγὼ ⸀λελάληκα ὑμῖν πνεῦμά ἐστιν καὶ ζωή ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/063.yaml
  text: It is the Spirit who gives life[a]; the flesh benefits nothing[c][b]. The words that I have spoken to you are spirit and are life.
translation:
  language: ru
  text: Дух даёт жизнь[a], плоть не приносит никакой пользы[b]. Слова, которые Я сказал вам, — дух и жизнь[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух даёт жизнь». Греческое πνεῦμα может означать как «Дух», так и «дух»; в данном контексте вероятнее имеется в виду Святой Дух.'
    reason: alternative_reading
  - marker: b
    text: «Плоть» здесь может обозначать в широком смысле то, что является лишь человеческим; перевод «греховная природа» был бы более истолковывающим, чем требует греческий текст.
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «являются Духом и жизнью» или «духовны и животворны». Греческая формулировка кратка и преимущественно качественна.'
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα
  choice: Дух
  rationale: В первой части определённая форма и контекст Евангелия от Иоанна вероятнее всего указывают на Святого Духа; прописная буква передаёт этот вероятный референт, а примечание сохраняет лексическую неоднозначность.
- source_word: ζῳοποιοῦν
  choice: даёт жизнь
  rationale: Причастие настоящего времени означает «оживляющий, дающий жизнь»; личная глагольная конструкция естественна по-русски и сохраняет значение действующего субъекта.
- source_word: σὰρξ
  choice: плоть
  rationale: Прямое соответствие сохраняет широкий и намеренно неуточнённый контраст с Духом; варианты «греховная природа» или «человеческие усилия» были бы излишне толковательными.
- source_word: ὠφελεῖ οὐδέν
  choice: не приносит никакой пользы
  rationale: Естественная современная русская передача абсолютного отрицания со значением отсутствия пользы.
- source_word: ῥήματα
  choice: слова
  rationale: Передаёт произнесённые высказывания прямо и естественно.
- source_word: λελάληκα
  choice: Я сказал
  rationale: Русский совершенный вид естественно обозначает уже произнесённые слова с сохраняющейся значимостью; буквальное «говорил» хуже передавало бы результативность греческого перфекта.
- source_word: πνεῦμά ἐστιν
  choice: дух
  rationale: Строчная буква и именная формула сохраняют преимущественно качественный смысл без чрезмерного отождествления слов непосредственно со Святым Духом.
- source_word: ζωή
  choice: жизнь
  rationale: Прямой и устойчивый эквивалент ключевого иоанновского понятия.
theological_decisions:
- issue: Референт πνεῦμα в первой части
  choice: «Дух» как вероятное указание на Святого Духа
  alternative: «дух» как духовное начало или человеческий дух
  rationale: Определённая форма и иоанновский контекст благоприятствуют личному референту — Святому Духу, но примечание сохраняет реальную неоднозначность слова.
- issue: Значение σὰρξ в противопоставлении Духу
  choice: Сохранено широкое слово «плоть»
  alternative: «греховная природа», «человеческие усилия» или «тело»
  rationale: Текст не требует сведения понятия к одной антропологической или конфессиональной трактовке; «плоть» сохраняет напряжение оригинала.
- issue: Характер πνεῦμά ἐστιν в заключительной части
  choice: Качественная формула «слова… — дух и жизнь»
  alternative: «слова… — Дух и жизнь» или «слова… духовны и животворны»
  rationale: Безартиклевая форма сказуемого скорее качественная; краткая русская формула сохраняет сжатость и неоднозначность греческого текста.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены лаконичность оригинала, резкое противопоставление Духа и плоти и сжатая формула «дух и жизнь»; прописные и строчные буквы используются для передачи вероятного референта без устранения неоднозначности.
