  source_fidelity: В основном переданы связка οὖν, «знамение» для σημεῖον и важное значение πιστεύω с дательным («поверить Тебе»). Однако оба греческих глагола в вопросах стоят в настоящем времени (ποιεῖς, ἐργάζῃ). Будущие формы «совершишь» и «сделаешь» без необходимости переносят вызов собеседников в будущее и ослабляют непосредственность их вопроса.
  naturalness: «Какое же знамение Ты совершаешь?» и «Что Ты делаешь?» — естественные формы современного литературного русского в напряжённом вопросе. Разные глаголы («совершаешь» / «делаешь») сохраняют различие между ποιεῖν и ἐργάζεσθαι без неестественного оборота «какое дело Ты совершаешь».
