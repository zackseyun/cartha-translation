  text: εἶπον οὖν αὐτῷ· Τί οὖν ποιεῖς σὺ σημεῖον, ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι; τί ἐργάζῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/030.yaml
  text: So they said to him[a], “Then what sign are you doing, so that we may see and believe you? What work are you doing?”
translation:
  language: ru
  text: 'Тогда они сказали Ему: «Какое же знамение Ты совершаешь, чтобы мы увидели и поверили Тебе[a]? Что Ты делаешь?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доверились Тебе». Здесь буквально: «поверили Тебе»; употреблён дательный падеж, а не более обычное у Иоанна выражение «веровать в» кого-либо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπον οὖν αὐτῷ
  choice: Тогда они сказали Ему
  rationale: οὖν связывает реплику с предшествующим разговором; «тогда» естественно передаёт последовательность и вывод в современном русском.
- source_word: Τί οὖν
  choice: Какое же
  rationale: Частица «же» сохраняет повторное οὖν и настойчиво-вопросительный характер ответа.
- source_word: ποιεῖς σὺ σημεῖον
  choice: какое знамение Ты совершишь
  rationale: «Знамение» сохраняет характерный для Иоанна смысл σημεῖον как события, указывающего за пределы самого себя. Будущее в русском естественно выражает требование показать знамение, не утверждая, что греческая форма является будущим временем.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι
  choice: чтобы мы увидели и поверили Тебе
  rationale: Конструкция с ἵνα передаёт цель; дательный σοι точнее отражён как «Тебе», а не более богословски насыщенным «в Тебя».
- source_word: τί ἐργάζῃ
  choice: Что Ты сделаешь?
  rationale: В данном вызове настоящее греческое время по-русски естественно передаётся вопросом о том, какое дело Иисус предъявит как основание для веры; «сделаешь» также избегает неестественного «какое дело совершаешь».
theological_decisions:
- issue: Значение πιστεύω с дательным σοι
  choice: поверили Тебе
  alternative: уверовали в Тебя; доверились Тебе
  rationale: Греческий текст употребляет дательный без εἰς, поэтому основной текст сохраняет более прямой смысл — поверить Иисусу и Его словам, не исключая оттенка доверия.
translation_notes:
  register: Современный литературный русский, понятный широкому читателю. Сохранены повторная вопросительная настойчивость, ключевой иоанновский термин «знамение» и различие между «поверить Тебе» и «уверовать в Тебя».
