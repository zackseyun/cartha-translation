  text: Καὶ εὑρόντες αὐτὸν πέραν τῆς θαλάσσης εἶπον αὐτῷ· Ῥαββί, πότε ὧδε γέγονας;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/025.yaml
  text: And when they found him on the other side of the sea[a], they said to him, “Rabbi, when did you get here?”
translation:
  language: ru
  text: 'Найдя Его на другом берегу моря, они сказали Ему: «Равви, когда Ты сюда пришёл?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρόντες
  choice: Найдя
  rationale: Аористное причастие обозначает действие, предшествующее главному; русское деепричастие естественно и точно передаёт последовательность.
- source_word: πέραν τῆς θαλάσσης
  choice: на другом берегу моря
  rationale: Оборот указывает на местонахождение по ту сторону моря; выбранное выражение естественно по-русски и сохраняет географическое противопоставление.
- source_word: Ῥαββί
  choice: Равви
  rationale: Сохраняется транслитерированное иудейское почтительное обращение, без замены на толковое «Учитель».
- source_word: πότε
  choice: когда
  rationale: Прямой и естественный русский эквивалент вопросительного наречия времени.
- source_word: ὧδε
  choice: сюда
  rationale: В сочетании с глаголом прибытия направление «сюда» по-русски естественнее, чем статическое «здесь».
- source_word: γέγονας
  choice: пришёл
  rationale: Перфект γίνομαι в данном контексте идиоматически обозначает прибытие и последующее присутствие; «пришёл» ясно передаёт этот смысл без неестественной буквальности.
- source_word: Καὶ
  choice: не выражено отдельно
  rationale: Начальное καί связывает эпизод с предыдущим повествованием, однако после деепричастного оборота отдельное «и» в русском было бы тяжеловесным; связь сохраняется синтаксисом.
- source_word: εἶπον αὐτῷ
  choice: они сказали Ему
  rationale: Сохраняется прямое значение λέγω «сказать», хотя последующая реплика имеет форму вопроса.
