  text: ⸀ἀπεκρίθη αὐτῷ Σίμων Πέτρος· Κύριε, πρὸς τίνα ἀπελευσόμεθα; ῥήματα ζωῆς αἰωνίου ἔχεις,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/068.yaml
  text: Simon Peter answered him[a], “Lord, to whom will we go? You have words of eternal life,”
translation:
  language: ru
  text: 'Симон Пётр ответил Ему: «Господи[a], к кому нам идти? У Тебя слова вечной жизни,»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Учитель» или «Господин». Греческое обращение может выражать почтение, однако «Господи» сохраняет обычную передачу этого титула и соответствует его употреблению у Иоанна.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: ответил Ему
  rationale: Естественная русская передача повествовательного глагола ответа и дательного местоимения, относящегося к Иисусу.
- source_word: Σίμων Πέτρος
  choice: Симон Пётр
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма «Господи» естественно передаёт прямое обращение и сохраняет как уважительный, так и возможный христологический смысл титула κύριος.
- source_word: πρὸς τίνα ἀπελευσόμεθα
  choice: к кому нам идти?
  rationale: Конструкция с «к кому» сохраняет личную направленность вопроса; «нам идти» — естественная современная русская передача будущего времени в риторическом вопросе.
- source_word: ῥήματα ζωῆς αἰωνίου
  choice: слова вечной жизни
  rationale: Сохраняются множественное число ῥήματα и характерное для Иоанна выражение «вечная жизнь»; генитивная связь намеренно не уточняется сверх текста.
- source_word: ἔχεις
  choice: У Тебя
  rationale: Русская конструкция обладания звучит естественнее буквального «Ты имеешь», сохраняя значение настоящего времени.
theological_decisions:
- issue: Смысл обращения Κύριε к Иисусу
  choice: Господи
  alternative: Учитель / Господин
  rationale: «Господи» сохраняет обычную библейскую передачу κύριος и допускает одновременно уважительное обращение и более глубокий христологический оттенок, не заставляя читателя выбрать только один из них.
- issue: Связь в выражении ῥήματα ζωῆς αἰωνίου
  choice: слова вечной жизни
  alternative: слова, дающие вечную жизнь
  rationale: 'Буквальная генитивная конструкция сохраняет заложенную в греческом тексте ёмкость: слова могут пониматься как относящиеся к вечной жизни, несущие её или сообщающие её. Развёрнутый вариант неоправданно устранил бы эту неоднозначность.'
translation_notes:
  register: Современный литературный русский язык с традиционной библейской торжественностью без архаизации. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской практикой.
