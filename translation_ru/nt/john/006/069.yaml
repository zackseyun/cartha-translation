    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: мы
  rationale: Явное местоимение имеет усилительную функцию; начальное «А мы» естественно передаёт и акцент, и связь с предыдущей репликой.
- source_word: πεπιστεύκαμεν
  choice: поверили
  rationale: Перфект обозначает состоявшееся обретение веры с сохраняющимся результатом. Русское прошедшее совершенного вида в сочетании с контекстом естественно передаёт этот смысл.
- source_word: ἐγνώκαμεν
  choice: узнали
  rationale: Перфект γινώσκω выражает достигнутое знание, остающееся в силе. «Узнали» сохраняет момент обретения знания и не добавляет отсутствующей в тексте модальности.
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание веры и знания.
- source_word: ὁ ἅγιος
  choice: Святой
  rationale: Субстантивированное прилагательное употреблено как христологический титул. «Святой» естественно и достойно передаёт титульное значение; прописная буква обозначает личный титул.
- source_word: τοῦ θεοῦ
  choice: Божий
  rationale: Русское относительное прилагательное естественно передаёт широкую связь родительного падежа с Богом, не сводя её исключительно к происхождению.
theological_decisions:
- issue: Христологический титул в Ин 6:69
  choice: Святой Божий
  alternative: Святой от Бога; Христос, Сын Бога живого
  rationale: Основной текст SBLGNT гласит ὁ ἅγιος τοῦ θεοῦ. Перевод сохраняет этот титул и широкую генитивную связь, не гармонизируя стих с Мф 16:16 и не принимая более пространное позднее чтение.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием. «А мы» сохраняет контрастивное ударение явного ἡμεῖς. Местоимение «Ты» написано с прописной буквы как уважительное обращение к Иисусу, без изменения смысла исходного текста.
