  text: εἶπεν οὖν ὁ Ἰησοῦς τοῖς δώδεκα· Μὴ καὶ ὑμεῖς θέλετε ὑπάγειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/067.yaml
  text: So Jesus said to the Twelve[a], “You do not want to go away too, do you?”
translation:
  language: ru
  text: 'Тогда Иисус сказал Двенадцати: «Неужели и вы хотите уйти?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И вы тоже хотите уйти?» Греческий вопрос с μή обычно предполагает отрицательный ответ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Тогда
  rationale: Передаёт повествовательное и логическое продолжение после ухода многих учеников; в современном русском звучит естественнее, чем формальное «итак».
- source_word: τοῖς δώδεκα
  choice: Двенадцати
  rationale: Сохраняет устойчивое обозначение ближайшей группы учеников Иисуса без пояснительного добавления, которого нет в греческом тексте.
- source_word: Μὴ καὶ ὑμεῖς
  choice: Неужели и вы
  rationale: «Неужели» естественно передаёт вопрос с μή, предполагающий отрицательный ответ, а «и вы» отражает καί и подчёркнутое ὑμεῖς на фоне уже ушедших учеников.
- source_word: θέλετε
  choice: хотите
  rationale: Прямой и современный эквивалент, выражающий желание или намерение.
- source_word: ὑπάγειν
  choice: уйти
  rationale: Передаёт движение прочь в непосредственном контексте ухода учеников, не добавляя явно выраженного объекта «от Меня».
theological_decisions:
- issue: Сила вопроса Иисуса, введённого μή
  choice: Отрицательно ориентированный вопрос «Неужели и вы хотите уйти?» с ожиданием ответа «нет»
  alternative: Нейтральное «И вы хотите уйти?»
  rationale: μή в таком вопросе обычно указывает на ожидание отрицательного ответа, но не превращает вопрос в утверждение и не устраняет возможность реального выбора.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и устная по звучанию, но сохраняет достоинство повествования. Заглавная буква в «Двенадцати» подчёркивает устойчивое наименование группы.
