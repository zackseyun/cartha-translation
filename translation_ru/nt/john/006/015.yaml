  text: Ἰησοῦς οὖν γνοὺς ὅτι μέλλουσιν ἔρχεσθαι καὶ ἁρπάζειν αὐτὸν ἵνα ⸀ποιήσωσιν βασιλέα ἀνεχώρησεν ⸀πάλιν εἰς τὸ ὄρος αὐτὸς μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/015.yaml
  text: So Jesus[a], knowing that they were about to come and seize him in order to make him king, withdrew again to the mountain by himself.
translation:
  language: ru
  text: Итак, Иисус, зная, что они вот-вот придут и схватят Его силой, чтобы сделать Его царём, снова удалился на гору один.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Итак
  rationale: Передаёт вывод и продолжение повествования после реакции людей на совершённое знамение.
- source_word: γνοὺς
  choice: зная
  rationale: Естественно передаёт обстоятельственный аористный причастный оборот и основание последующего действия Иисуса.
- source_word: μέλλουσιν ἔρχεσθαι
  choice: собираются прийти
  rationale: Выражает предстоящее и намеренное действие; в данном контексте русское «собираются» звучит естественно и сохраняет оттенок близости события.
- source_word: ἁρπάζειν
  choice: силой захватить
  rationale: Явно передаёт присущий глаголу оттенок насильственного, принудительного действия, не сводя его к нейтральному «взять».
- source_word: ἵνα ποιήσωσιν βασιλέα
  choice: чтобы сделать царём
  rationale: Сохраняет значение цели конструкции ἵνα с сослагательным наклонением.
- source_word: ἀνεχώρησεν
  choice: удалился
  rationale: Естественно обозначает уход из сложившейся ситуации и соответствует контексту уклонения от намерения толпы.
- source_word: πάλιν
  choice: снова
  rationale: Передаёт повторность действия без лишнего уточнения.
- source_word: εἰς τὸ ὄρος
  choice: на гору
  rationale: Буквально и естественно передаёт направление движения; не уточняет географию сверх исходного текста.
- source_word: αὐτὸς μόνος
  choice: Он один
  rationale: Отдельная присоединённая конструкция сохраняет эмфатическое сочетание местоимения и прилагательного, оставаясь естественной по-русски.
theological_decisions:
- issue: Характер намерения людей сделать Иисуса царём
  choice: «силой захватить Его, чтобы сделать царём»
  alternative: «взять Его и сделать царём»
  rationale: ἁρπάζειν указывает на принуждение; перевод не смягчает попытку насильственно навязать Иисусу политическую царскую роль.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и достойное. Заглавная буква в местоимении «Его» соответствует принятому благоговейному русскому библейскому регистру. Тире перед «Он один» подчёркивает αὐτὸς μόνος без неестественного плеоназма.
