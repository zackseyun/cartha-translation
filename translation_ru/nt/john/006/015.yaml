revisions:
- from: Итак, Иисус, зная, что они собираются прийти и силой захватить Его, чтобы сделать царём, снова удалился на гору — Он один.
  to: Итак, Иисус, зная, что они вот-вот придут и схватят Его силой, чтобы сделать Его царём, снова удалился на гору один.
  rationale: 'Исправлены только стилистически и семантически безопасные места: приближенность действия передана через «вот-вот», насильственный оттенок ἁρπάζειν — через естественное «схватят Его силой», а αὐτὸς μόνος включено в плавный русский синтаксис как «на гору один». Значение и степень определённости оригинала не изменены.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:21:12Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: οὖν сохранено, намерение толпы передано как принудительное, цель — сделать Иисуса царём, а удаление, повторность и одиночество сохранены. Однако «собираются прийти» несколько смещает μέλλουσιν ἔρχεσθαι в сторону намерения, тогда как здесь прежде всего обозначена близость действия; «вот-вот придут» точнее. «Силой захватить» понятно, но для человека по-русски менее естественно, чем «схватить ... силой».'
  naturalness: Фраза «— Он один» после «удалился на гору» звучит как искусственно присоединённый, фрагментарный акцент. Русское «удалился ... один» естественно и достаточно передаёт αὐτὸς μόνος без утраты смысла. Остальной синтаксис плавный и соответствует современному литературному регистру.
  terminology: «Иисус», «царь», «гора» и «удалился» уместны. Употребление прописной буквы в «Его» допустимо в выбранном русском библейском регистре. Смысл ἁρπάζειν не следует смягчать до нейтрального «взять»; «схватить Его силой» сохраняет принудительный оттенок и звучит естественно.
  issues:
  - severity: low
    issue: «собираются прийти»
    rationale: Выражение может обозначать подготовку или намерение; μέλλουσιν с инфинитивом в данном контексте прежде всего указывает на неминуемое, близкое действие.
  - severity: medium
    issue: «силой захватить Его»
    rationale: Смысл принуждения сохранён, но сочетание менее идиоматично для физического действия над человеком; «схватить Его силой» естественнее и не ослабляет ἁρπάζειν.
  - severity: low
    issue: «— Он один»
    rationale: Изолированная присоединённая конструкция с тире искусственно утяжеляет русский текст. Позиция «один» после обстоятельства места естественно передаёт эмфатическое αὐτὸς μόνος.
