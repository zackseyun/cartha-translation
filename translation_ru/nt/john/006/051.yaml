  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ ἄρτος ὁ ζῶν ὁ ἐκ τοῦ οὐρανοῦ καταβάς· ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου ⸀ζήσει εἰς τὸν αἰῶνα, καὶ ὁ ἄρτος δὲ ὃν ἐγὼ δώσω ἡ σάρξ μού ⸀ἐστιν ὑπὲρ τῆς τοῦ κόσμου ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/051.yaml
  text: I am the living bread that came down from heaven[a]. If anyone eats of this bread, he will live forever[c][b]. And the bread that I will give for the life of the world is my flesh.
translation:
  language: ru
  text: Я — живой хлеб, сошедший с небес. Если кто будет есть этот хлеб, тот будет жить вечно. А хлеб, который Я дам ради жизни мира, — это Моя плоть.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἄρτος ὁ ζῶν
  choice: живой хлеб
  rationale: Причастие ζῶν передано как определение «живой»; вариант «хлеб жизни» относился бы к соседнему выражению и не переводил бы данную фразу точно.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: сошедший с небес
  rationale: Аористное причастие обозначает совершившееся нисхождение; русское причастие естественно и сохраняет христологическую силу высказывания.
- source_word: ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου
  choice: Если кто будет есть этот хлеб
  rationale: Конструкция ἐάν с аористным сослагательным выражает открытое общее условие. «Если кто» сохраняет неопределённое единственное число, а «будет есть» естественно передаёт условное действие; отдельная передача ἐκ по-русски была бы неестественной.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: тот будет жить вечно
  rationale: В Иоанновом употреблении εἰς τὸν αἰῶνα — устойчивое выражение со значением непрекращающейся, вечной длительности.
- source_word: ὁ ἄρτος δὲ ὃν ἐγὼ δώσω
  choice: А хлеб, который Я дам
  rationale: δέ развивает мысль и допускает мягкое русское «а», не обязательно обозначая сильное противопоставление. Будущее «дам» сохраняет указание на предстоящее самоотдание.
- source_word: ἡ σάρξ μού ἐστιν
  choice: это Моя плоть
  rationale: σάρξ передано конкретным словом «плоть», а не смягчающим «тело». Связка «это» делает русское именное предложение ясным, не меняя отождествления.
- source_word: ὑπὲρ τῆς τοῦ κόσμου ζωῆς
  choice: ради жизни мира
  rationale: «Ради» естественно выражает целевое и благотворное значение ὑπέρ. Формулировка сохраняет связь самоотдания Иисуса с жизнью мира.
- source_word: κόσμος
  choice: мир
  rationale: Сохраняется характерное для Иоанна широкое слово «мир» без истолковывающего сужения до «человечества» или иной группы.
theological_decisions:
- issue: Значение σάρξ в словах Иисуса о Себе
  choice: «плоть» в основном тексте
  alternative: «тело»
  rationale: Греческое слово конкретно и намеренно резко в данном контексте. «Тело» сгладило бы выражение и заранее направило бы его толкование.
- issue: Объём понятия «мир»
  choice: сохранить «мир» без сужения
  alternative: «человечество» или более узко определённая группа
  rationale: κόσμος оставляет широкую формулировку самого стиха; перевод не должен разрешать богословское напряжение посредством уточнения, отсутствующего в греческом тексте.
- issue: Смысл слов о нисхождении с небес
  choice: прямо передать как «сошедший с небес»
  alternative: истолковать как метафору божественного поручения
  rationale: Перевод сохраняет сильное христологическое утверждение греческого текста, не добавляя поясняющей доктринальной формулы.
- issue: Отношение самоотдания Иисуса к жизни мира
  choice: «ради жизни мира»
  alternative: «за жизнь мира» или «для жизни мира»
  rationale: «Ради» передаёт благотворно-целевую силу ὑπέρ, не уточняя сверх текста механизм или объём действия.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранены традиционно узнаваемые библейские выражения «живой хлеб», «сошедший с небес», «жить вечно» и «Моя плоть», но синтаксис остаётся естественным для современного читателя. Местоимения, относящиеся к Иисусу в прямой речи, даны с прописной буквы согласно устойчивой русской библейской издательской практике.
