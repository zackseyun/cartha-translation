  terminology: «Плоть» точно сохраняет намеренно конкретное σάρξ и не подменяет его толковательным «тело». «Мир» сохраняет широту κόσμος. Выражения «живой хлеб», «сошедший с небес» и «жить вечно» терминологически и стилистически удачны.
