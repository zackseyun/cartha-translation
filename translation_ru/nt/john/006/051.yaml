  source_fidelity: 'Русский текст точно передаёт основные элементы греческого оригинала: «живой хлеб», совершившееся нисхождение «с небес», общее условие, обещание вечной жизни, будущее «дам», конкретное σάρξ как «плоть» и широкий κόσμος как «мир». «Если кто будет есть этот хлеб» — естественная русская передача общего условия; оттенок частичного ἐκ не воспроизводится отдельно, но его буквальное воспроизведение («есть от этого хлеба») было бы менее естественным и не требуется для сохранения смысла. «Ради жизни мира» допустимо передаёт благотворно-целевую силу ὑπέρ.'
