  text: But he said to them[a], “It is I; do not be afraid.”
translation:
  language: ru
  text: 'Но Он сказал им[a]: «Это Я, не бойтесь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Я есмь». У Иоанна это выражение может быть обычным указанием на Себя, но может также перекликаться с более широкими богословскими темами.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ
  choice: Но Он
  rationale: Частица δέ мягко обозначает переход или противопоставление; «но» естественно передаёт смену хода повествования. Артикль ὁ употреблён местоименно и указывает на Иисуса.
- source_word: λέγει
  choice: сказал
  rationale: Греческий исторический презенс естественно передаётся в русском повествовании прошедшим временем.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж множественного числа прямо передан местоимением; адресаты понятны из контекста.
- source_word: Ἐγώ εἰμι
  choice: Это Я
  rationale: В непосредственном контексте выражение служит самоидентификацией и успокаивает учеников. «Это Я» звучит естественно по-русски; буквальное «Я есмь», способное нести более широкий богословский оттенок у Иоанна, сохранено в сноске.
- source_word: μὴ φοβεῖσθε
  choice: не бойтесь
  rationale: Естественная современная русская форма запрета, точно соответствующая контексту страха.
theological_decisions:
- issue: Передавать ли Ἐγώ εἰμι как простую самоидентификацию или как формулу с возможным богословским отзвуком
  choice: 'В основном тексте: «Это Я»'
  alternative: «Я есмь»
  rationale: Контекст прежде всего указывает на то, что Иисус называет Себя ученикам и успокаивает их. Однако характерное для Евангелия от Иоанна выражение ἐγώ εἰμι может иметь и более глубокий богословский отзвук, поэтому буквальный вариант приведён в сноске, не навязывая однозначного толкования.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная и достойная повествовательная речь. Местоимение «Он» применительно к Иисусу написано с прописной буквы согласно распространённой русской библейской традиции.
