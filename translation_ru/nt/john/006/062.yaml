  text: ἐὰν οὖν θεωρῆτε τὸν υἱὸν τοῦ ἀνθρώπου ἀναβαίνοντα ὅπου ἦν τὸ πρότερον;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/062.yaml
  text: Then what if you were to see the Son of Man ascending to where he was before?[a]
translation:
  language: ru
  text: Что же, если вы увидите Сына Человеческого восходящего туда, где Он был прежде?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «Итак, если вы увидите Сына Человеческого восходящего туда, где Он был прежде?» В греческом тексте это риторический условный вопрос; его следствие оставлено невысказанным.'
    reason: Сохранение синтаксической неоднозначности и более буквальной альтернативы.
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Что же, если
  rationale: Сочетание вводит вытекающий из предыдущих слов риторический условный вопрос. Эта формулировка сохраняет и выводное значение οὖν, и условность ἐὰν, не восполняя намеренно опущенное следствие.
- source_word: θεωρῆτε
  choice: вы увидите
  rationale: Глагол обозначает зрительное восприятие, нередко внимательное наблюдение. Будущее время естественно передаёт перспективное значение условной конструкции в современном русском языке.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Сына Человеческого
  rationale: Сохранено устойчивое евангельское самообозначение Иисуса с его мессианскими и даниилическими ассоциациями, без поясняющего парафраза.
- source_word: ἀναβαίνοντα
  choice: восходящего
  rationale: Причастие передаёт движение вверх и сохраняет возвышенный, потенциально небесный оттенок, не добавляя прямо не названного места назначения.
- source_word: ὅπου ἦν τὸ πρότερον
  choice: туда, где Он был прежде
  rationale: Формулировка ясно передаёт прежнее местонахождение или состояние и временную предшественность, не уточняя словами «на небе» или «у Отца» то, чего греческий текст здесь прямо не называет.
theological_decisions:
- issue: Следует ли прямо истолковать восхождение как возвращение на небо или к Отцу и развернуть указание на предсуществование
  choice: Сохранить формулировку «туда, где Он был прежде» без поясняющего добавления
  alternative: «на небо, где Он был прежде» или «к Отцу, у Которого Он был прежде»
  rationale: Греческий текст подразумевает прежнее бытие и восхождение, однако прямо не называет ни небо, ни Отца. Перевод сохраняет христологическую силу и одновременно не выходит за пределы сказанного.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Конструкция «Что же, если…?» естественно передаёт риторический вопрос, а «восходящего» сохраняет возвышенный оттенок исходного причастия. Местоимение «Он» написано с прописной буквы согласно распространённой русской библейской традиции.
