  text: Then Jesus went up on the mountain, and there he sat with his disciples.
translation:
  language: ru
  text: Тогда Иисус поднялся на гору и там сидел со своими учениками.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνῆλθεν
  choice: поднялся
  rationale: Аорист ἀνέρχομαι обозначает обычное движение вверх; «поднялся» естественно передаёт действие без излишне возвышенного оттенка.
- source_word: δὲ
  choice: тогда
  rationale: Здесь δέ продолжает повествование, не выражая заметного противопоставления; «тогда» ясно передаёт переход к следующему событию.
- source_word: εἰς τὸ ὄρος
  choice: на гору
  rationale: В сочетании с глаголом движения вверх выражение естественно означает подъём на гору или возвышенность. Определённый артикль указывает на конкретную гору в данной обстановке, не обязательно названную.
- source_word: Ἰησοῦς
  choice: Иисус
  rationale: Устоявшаяся русская форма личного имени.
- source_word: ἐκεῖ
  choice: там
  rationale: Прямой и естественный эквивалент наречия места.
- source_word: ἐκάθητο
  choice: сел
  rationale: Форма κάθημαι описывает пребывание сидя; в последовательном русском повествовании «сел» естественно передаёт переход к этому положению, хотя греческий имперфект может также оттенять состояние «сидел».
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: со Своими учениками
  rationale: μετά с родительным падежом означает совместность, а μαθηταί в контексте Евангелия — последователей, обучающихся у наставника; традиционное и точное соответствие — «ученики».
