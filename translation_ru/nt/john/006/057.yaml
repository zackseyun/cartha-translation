  text: καθὼς ἀπέστειλέν με ὁ ζῶν πατὴρ κἀγὼ ζῶ διὰ τὸν πατέρα, καὶ ὁ τρώγων με κἀκεῖνος ⸀ζήσει δι’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/057.yaml
  text: Just as the living Father sent me[a], and I live because of the Father[b], so also the one who feeds on me will live because of me.
translation:
  language: ru
  text: Как живой Отец послал Меня и Я живу благодаря Отцу[b], так и тот, кто ест[a] Меня, будет жить благодаря Мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «питается Мною». Греческий глагол конкретен и выразителен: он означает «есть» и может передавать наглядный оттенок жевания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «через Отца» и «через Меня». Греческий предлог допускает причинное и инструментальное понимание; в основном тексте выбрано причинное, чтобы сохранить параллель между отношением Сына к Отцу и отношением верующего к Сыну.'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς ... καὶ
  choice: Как ... так и
  rationale: Передаёт сопоставление, охватывающее всё предложение, и естественно связывает жизнь Сына от Отца с жизнью верующего от Сына.
- source_word: ὁ ζῶν πατὴρ
  choice: живой Отец
  rationale: Прямо передаёт атрибутивное причастие ζῶν и сохраняет характерный для Иоанна акцент на жизни, не подменяя его толкованием «животворящий».
- source_word: ἀπέστειλέν με
  choice: послал Меня
  rationale: Простое прошедшее время естественно передаёт аорист; «послал» не сужает смысл до формального поручения.
- source_word: κἀγὼ ζῶ
  choice: и Я живу
  rationale: Сохраняет настоящее время, личное местоимение и словесный повтор темы жизни.
- source_word: διὰ τὸν πατέρα / δι’ ἐμέ
  choice: благодаря Отцу / благодаря Мне
  rationale: διά с винительным падежом здесь естественно допускает причинное значение. Одинаковая передача обеих фраз сохраняет параллель Отец—Сын и Сын—верующий.
- source_word: ὁ τρώγων με
  choice: тот, кто ест Меня
  rationale: Передаёт субстантивированное причастие и конкретный, выразительный глагол τρώγω без ослабления до абстрактного «принимает» и без навязывания определённого конфессионального истолкования.
- source_word: κἀκεῖνος
  choice: так и тот
  rationale: Русская соотносительная конструкция передаёт усилительный смысл «и тот также» без тяжеловесного буквального повторения.
- source_word: ζήσει
  choice: будет жить
  rationale: Прямо передаёт будущее время и сохраняет словесную связь с «Я живу».
theological_decisions:
- issue: Характер связи жизни Сына с Отцом в διὰ τὸν πατέρα
  choice: 'Причинная передача: «Я живу благодаря Отцу»'
  alternative: «Я живу через Отца»
  rationale: Греческое διά с винительным падежом естественно выражает причину или основание. Формулировка сохраняет заявленную в стихе связь и параллель с жизнью человека благодаря Сыну, не делая дополнительных выводов о природе Сына или Его отношении к Отцу.
- issue: Евхаристический или более широкий метафорический смысл ὁ τρώγων με
  choice: Конкретное «тот, кто ест Меня»
  alternative: «тот, кто питается Мною»; «тот, кто приобщается ко Мне»
  rationale: Конкретность греческого глагола сохранена, однако перевод не определяет, следует ли понимать эти слова исключительно сакраментально или как более широкое указание на веру и единение со Христом.
translation_notes:
  register: Современный литературный русский язык; синтаксис торжественный, но понятный. Заглавные буквы в местоимениях «Меня», «Я», «Мне» соответствуют принятому русскому библейскому регистру. Конкретное «ест Меня» намеренно сохраняет резкость исходного образа.
