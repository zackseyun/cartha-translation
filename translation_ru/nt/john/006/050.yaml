  yaml_path: translation/nt/john/006/050.yaml
  text: This is the bread that comes down from heaven[b][a], so that anyone may eat from it and not die.
translation:
  language: ru
  text: Вот хлеб, сходящий с небес[a], чтобы всякий мог есть его и не умереть[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот хлеб, который сходит с небес».'
    reason: lexical_alternative
  - marker: b
    text: 'Выражение «не умереть» намеренно оставлено широким: в контексте его понимают как избавление от окончательной смерти, духовной смерти или эсхатологической гибели.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός
  choice: Вот
  rationale: Указательное слово непосредственно представляет и отождествляет хлеб; «вот» естественно и выразительно передаёт эту функцию в русском контексте.
- source_word: ἄρτος
  choice: хлеб
  rationale: Прямое и устойчивое соответствие, сохраняющее как буквальную, так и образную силу слова в Ин 6.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων
  choice: сходящий с небес
  rationale: Причастный оборот близко передаёт греческое настоящее причастие и его продолжающийся, живой характер.
- source_word: οὐρανός
  choice: небеса
  rationale: В данном контексте имеется в виду небесная, Божья сфера, а не физическое небо; русское «с небес» естественно в высоком, но современном библейском регистре.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно передаёт целевое, с возможным оттенком результата, значение греческого союза.
- source_word: τις
  choice: всякий
  rationale: 'Передаёт обобщённую неопределённость: любой человек, без ограничения; соответствует достоинству и ритму высказывания.'
- source_word: ἐξ αὐτοῦ
  choice: от него
  rationale: Естественное русское управление при обозначении вкушения части хлеба; местоимение согласовано с «хлеб».
- source_word: φάγῃ
  choice: мог есть
  rationale: Передаёт сослагательность аориста в целевой конструкции, не превращая действие в явно повторяющееся.
- source_word: μὴ ἀποθάνῃ
  choice: не умереть
  rationale: Сохраняет простое значение «умереть», не сужая его до духовной или окончательной гибели.
theological_decisions:
- issue: Характер смерти в выражении μὴ ἀποθάνῃ
  choice: Оставить широкую формулировку «не умереть».
  alternative: «не умереть духовно»; «не погибнуть навеки»
  rationale: Сам стих не уточняет вид смерти. Нейтральная формулировка сохраняет богословскую многозначность и напряжение речи Иисуса.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Причастный оборот сохраняет компактность и аспект исходного текста; формулировка не вводит конфессиональных уточнений.
