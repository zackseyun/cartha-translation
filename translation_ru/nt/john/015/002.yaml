source:
  edition: SBLGNT
  text: πᾶν κλῆμα ἐν ἐμοὶ μὴ φέρον καρπὸν αἴρει αὐτό, καὶ πᾶν τὸ καρπὸν φέρον καθαίρει αὐτὸ ἵνα ⸂καρπὸν πλείονα⸃ φέρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/002.yaml
  text: Every branch in me that does not bear fruit[a], he removes; and every branch that bears fruit[b], he prunes so that it may bear more fruit.
translation:
  language: ru
  text: Всякую ветвь во Мне, которая не приносит плода, Он удаляет[a], а всякую ветвь, которая приносит плод, обрезает[b], чтобы она приносила ещё больше плода.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «убирает». Глагол αἴρει может также означать «поднимает»; некоторые понимают его здесь именно так.'
    reason: alternative_reading
  - marker: b
    text: Глагол, переведённый как «обрезает», может также означать «очищает». В данном стихе он соответствует образу ухода за виноградной лозой и в то же время предваряет слова «вы уже чисты» в следующем стихе.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κλῆμα
  choice: всякую ветвь
  rationale: Сочетание πᾶν с существительным в единственном числе имеет распределительное значение; «всякую ветвь» естественно передаёт эту индивидуализирующую силу.
- source_word: ἐν ἐμοὶ
  choice: во Мне
  rationale: Прямой перевод сохраняет характерный для Иоанна язык пребывания и связи со Христом, не добавляя толкований вроде «соединённую со Мной».
- source_word: μὴ φέρον καρπὸν
  choice: которая не приносит плода
  rationale: Причастный оборот передан придаточным определительным для ясного современного русского языка; настоящее время сохраняет идею продолжающегося плодоношения или его отсутствия.
- source_word: αἴρει
  choice: удаляет
  rationale: В данном образе виноградной лозы значение «удаляет» лучше всего выражает действие над бесплодной ветвью и контрастирует с обрезкой плодоносящей. Возможные значения «убирает» и «поднимает» отмечены в сноске.
- source_word: καρπός
  choice: плод
  rationale: Обычный и точный эквивалент в образе виноградной лозы и в богословской речи Иоанна.
- source_word: καθαίρει
  choice: обрезает
  rationale: В виноградарском контексте это естественное обозначение действия, способствующего большему плодоношению. Значение «очищает» и словесная связь со следующим стихом сохранены в сноске.
- source_word: ἵνα καρπὸν πλείονα φέρῃ
  choice: чтобы она приносила ещё больше плода
  rationale: «Чтобы» передаёт цель, а «ещё больше плода» естественно выражает сравнительную степень πλείονα.
- source_word: καὶ πᾶν τὸ καρπὸν φέρον
  choice: а всякую ветвь, которая приносит плод
  rationale: Слово «ветвь» повторено, поскольку греческая конструкция с артиклем и причастием отсылает к κλῆμα; союз «а» естественно выражает смысловой контраст двух действий.
theological_decisions:
- issue: Значение αἴρει в первой части стиха
  choice: Он удаляет
  alternative: Он убирает / Он поднимает
  rationale: Ближайший контекст противопоставляет удаление бесплодной ветви обрезке плодоносящей. «Удаляет» сохраняет этот контраст, но не уточняет богословски, кого именно обозначает ветвь и как это связано с учениями об отступничестве или сохранении верующих. Вариант «поднимает» остаётся в сноске как реально существующее лексико-интерпретационное понимание.
- issue: Значение καθαίρει и связь с καθαροί в Ин 15:3
  choice: обрезает
  alternative: очищает
  rationale: Основной текст сохраняет ясность виноградарского образа, а сноска отмечает второе значение глагола и намеренную словесную перекличку с утверждением «вы уже чисты» в следующем стихе.
translation_notes:
  register: Современный литературный русский язык с ясной, симметричной структурой фразы. Сохранено прямое «во Мне», характерное для богословского языка Евангелия от Иоанна. Местоимения, относящиеся ко Христу, написаны с прописной буквы в соответствии с традиционным уважительным библейским регистром; синтаксис при этом остаётся современным и доступным.
