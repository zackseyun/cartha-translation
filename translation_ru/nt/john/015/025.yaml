  text: ἀλλ’ ἵνα πληρωθῇ ὁ λόγος ὁ ⸂ἐν τῷ νόμῳ αὐτῶν γεγραμμένος⸃ ὅτι Ἐμίσησάν με δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/025.yaml
  text: 'But this happened so that the word written in their Law might be fulfilled: ‘They hated me without cause.’[a][b][c]'
translation:
  language: ru
  text: 'Но это произошло, чтобы исполнилось слово, написанное в их Законе: «Они возненавидели Меня без причины».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «Но чтобы исполнилось слово, написанное в их Законе». В греческом тексте главная часть предложения не выражена и подразумевается из контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'Здесь «Закон» означает Писание в широком смысле: цитата взята из Псалмов (ср. Пс. 34:19; 68:5). Возможный перевод последних слов: «ни за что».'
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Но это произошло
  rationale: ἀλλά выражает противопоставление предшествующему; слова «это произошло» восполняют по контексту эллиптическую главную часть и делают русскую фразу естественной.
- source_word: ἵνα πληρωθῇ
  choice: чтобы исполнилось
  rationale: Передаёт ἵνα с аористом пассивного сослагательного наклонения, сохраняя характерную для Иоанна формулу исполнения и не устраняя оттенок цели/результата.
- source_word: ὁ λόγος
  choice: слово
  rationale: Здесь λόγος означает конкретное изречение Писания; «слово» естественно для русской формулы цитирования и не отсылает к титулу Логоса из пролога.
- source_word: ἐν τῷ νόμῳ αὐτῶν γεγραμμένος
  choice: написанное в их Законе
  rationale: Причастие перфекта передаёт то, что остаётся записанным; «их» сохраняет риторическое дистанцирование, а «Закон» буквально отражает νόμος.
- source_word: ὅτι
  choice: ':'
  rationale: Двоеточие естественно вводит содержание приведённого из Писания слова.
- source_word: Ἐμίσησάν με
  choice: Они возненавидели Меня
  rationale: Аорист передан совершенным видом прошедшего времени; «возненавидели» точно и естественно выражает наступившее отношение в цитате.
- source_word: δωρεάν
  choice: без причины
  rationale: δωρεάν в данном контексте означает беспричинно, незаслуженно; выражение «без причины» понятно современному читателю и сохраняет смысл отсутствия основания.
theological_decisions:
- issue: Значение выражения «в их Законе» при цитировании Псалмов
  choice: Сохранить «в их Законе», пояснив широкое значение слова в сноске.
  alternative: Передать как «в их Писании».
  rationale: Греческий текст прямо употребляет νόμος, хотя цитата происходит из Псалмов. Буквальная передача сохраняет напряжение оригинала, а примечание предотвращает ошибочное ограничение одним Пятикнижием.
- issue: Эллиптическая конструкция после ἀλλ’
  choice: Восполнить подразумеваемое «это произошло».
  alternative: 'Оставить формально: «Но чтобы исполнилось слово…»'
  rationale: В греческом главная часть подразумевается из контекста. В русском без её восполнения предложение звучит незавершённо; добавление не вводит нового события или учения.
- issue: 'Оттенок ἵνα: цель или результат'
  choice: Передать нейтральным «чтобы исполнилось».
  alternative: Уточнить как «для того чтобы» либо «так что».
  rationale: Русское «чтобы» сохраняет возможное наложение цели и результата, не усиливая детерминистическое прочтение сверх греческого синтаксиса.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксическая эллиптичность греческого восполнена минимально; термин «Закон» сохранён, а его широкое значение пояснено. Местоимение «Меня» написано с прописной буквы по устойчивой русской библейской издательской норме.
