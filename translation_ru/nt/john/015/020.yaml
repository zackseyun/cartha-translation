  text: μνημονεύετε τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν· Οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ· εἰ ἐμὲ ἐδίωξαν, καὶ ὑμᾶς διώξουσιν· εἰ τὸν λόγον μου ἐτήρησαν, καὶ τὸν ὑμέτερον τηρήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/020.yaml
  text: 'Remember the word that I said to you: ‘A servant is not greater than his master.’ If they persecuted me[a], they will also persecute you; if they kept my word[b], they will also keep yours.'
translation:
  language: ru
  text: 'Помните слово, которое Я сказал вам: «Раб не выше своего господина». Если Меня преследовали, будут преследовать и вас; если соблюдали Моё слово[a], будут соблюдать и ваше.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хранили Моё слово». Здесь «соблюдать» включает принятие слова и послушание ему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύετε
  choice: Помните
  rationale: Настоящее повелительное наклонение призывает продолжать помнить сказанное; «помните» естественно и точно передаёт побуждение.
- source_word: τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν
  choice: слово, которое Я сказал вам
  rationale: Здесь λόγος обозначает конкретное ранее произнесённое изречение; буквальная конструкция остаётся ясной в современном русском языке.
- source_word: δοῦλος
  choice: раб
  rationale: В сопоставлении с κύριος подчёркнуто подчинённое общественное положение; «раб» точнее, чем более широкое «слуга».
- source_word: μείζων
  choice: больше
  rationale: Сохраняет широкое сравнение по положению и превосходству, не сводя его лишь к важности или власти.
- source_word: κυρίου
  choice: господина
  rationale: В паре с «рабом» слово обозначает хозяина, обладающего властью над ним; строчная буква и форма «господин» не превращают его здесь в божественный титул.
- source_word: ἐδίωξαν / διώξουσιν
  choice: преследовали / будут преследовать
  rationale: Контекст враждебности к Иисусу и ученикам требует значения «подвергать гонениям, преследовать», а не нейтрального «идти следом».
- source_word: ἐτήρησαν / τηρήσουσιν
  choice: соблюдали / будут соблюдать
  rationale: τηρέω здесь может включать принятие слова, верность ему и послушание; «соблюдать слово» сохраняет эту смысловую широту и повтор глагола.
- source_word: τὸν λόγον μου ... τὸν ὑμέτερον
  choice: Моё слово ... ваше
  rationale: Сохранены лексический повтор и параллель между словом Иисуса и возвещением учеников; эллиптическое «ваше» естественно восстанавливает существительное «слово».
theological_decisions:
- issue: Передача δοῦλος в сравнении общественного положения
  choice: раб
  alternative: слуга
  rationale: Сила изречения основана на неравенстве раба и господина. «Раб» сохраняет выраженную подчинённость и не смягчает историческую реалию.
- issue: Смысл τηρέω применительно к слову Иисуса и учеников
  choice: соблюдали
  alternative: хранили; слушались
  rationale: Глагол допускает оттенки хранения, принятия и послушания. «Соблюдали» достаточно широко передаёт верность слову, а примечание сохраняет возможный оттенок «хранили».
- issue: Условные предложения о реакции мира
  choice: Если Меня преследовали… если соблюдали Моё слово…
  alternative: Если они преследовали… если они соблюдали…
  rationale: Русская форма с неопределённо-личным сказуемым естественно передаёт невыраженное греческое подлежащее и не уточняет без необходимости, кто именно имеется в виду.
translation_notes:
  register: Современный литературный русский язык с лаконичным, афористичным строем. Местоимения, относящиеся к Иисусу, написаны с прописной буквы по устойчивой русской библейской традиции. Синтаксический параллелизм исходного текста сохранён.
