id: JHN.15.18
reference: John 15:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Εἰ ὁ κόσμος ὑμᾶς μισεῖ, γινώσκετε ὅτι ἐμὲ πρῶτον ⸀ὑμῶν μεμίσηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/018.yaml
  text: If the world hates you[a], know that it has hated me before you.
translation:
  language: ru
  text: 'Если мир ненавидит вас, знайте: Меня он возненавидел прежде вас.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он прежде возненавидел Меня, а потом вас». Греческое выражение указывает на временное предшествование.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: мир
  rationale: В Евангелии от Иоанна слово может обозначать человеческий мир, противящийся Богу, однако «мир» сохраняет широту и богословскую напряжённость оригинала без пояснительного расширения.
- source_word: μισεῖ
  choice: ненавидит
  rationale: Настоящее время естественно передаётся русским настоящим и выражает общую, актуальную ситуацию.
- source_word: γινώσκετε
  choice: знайте
  rationale: 'Форма допускает изъявительное или повелительное понимание, но после условного придаточного контекст естественнее поддерживает призыв: «знайте».'
- source_word: ἐμὲ
  choice: Меня
  rationale: Начальная позиция после ὅτι придаёт местоимению эмфазу; вынесение «Меня» вперёд сохраняет это выделение.
- source_word: πρῶτον ὑμῶν
  choice: прежде вас
  rationale: Сочетание πρῶτον с родительным ὑμῶν выражает временное предшествование; «прежде вас» точно и естественно передаёт его по-русски.
- source_word: μεμίσηκεν
  choice: возненавидел
  rationale: Русский совершенный вид передаёт предшествующее наступление ненависти и её сохраняющуюся значимость; буквальная попытка воспроизвести греческий перфект была бы неестественной.
theological_decisions:
- issue: Смысл κόσμος в богословии Иоанна
  choice: Сохранить «мир» без истолковывающего дополнения.
  alternative: «мир, противящийся Богу» или «мировой порядок»
  rationale: Контекст подразумевает враждебность к Иисусу и Его ученикам, но сам термин остаётся широким. Перевод «мир» не сужает его до заранее заданной богословской схемы.
- issue: Наклонение γινώσκετε
  choice: Повелительное «знайте».
  alternative: Изъявительное «вы знаете»
  rationale: Обе трактовки морфологически возможны, однако условная конструкция и ход наставления лучше согласуются с призывом помнить о предшествующей ненависти мира к Иисусу.
translation_notes:
  register: Современный литературный русский язык, ясный и dignified по тону. Двоеточие после «знайте» естественно вводит содержание знания; прописная буква в «Меня» соответствует принятому русскому библейскому оформлению местоимений, относящихся к Иисусу.
