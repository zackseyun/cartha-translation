id: JHN.15.26
reference: John 15:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀Ὅταν ἔλθῃ ὁ παράκλητος ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός, τὸ πνεῦμα τῆς ἀληθείας ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται, ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/026.yaml
  text: When the Advocate comes[a], whom I will send to you from the Father—the Spirit of truth[c][b], who proceeds from the Father—he will testify about me.
translation:
  language: ru
  text: Когда придёт Заступник[a], которого Я пошлю вам от Отца, — Дух истины, исходящий от Отца[b], — Он будет свидетельствовать обо Мне[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «Помощник», «Утешитель», «Советник»; греческое παράκλητος можно также передать как «Параклет».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «который исходит от Отца». Эта формулировка позднее приобрела особое значение в богословских рассуждениях о Троице.'
    reason: cross_reference
  - marker: c
    text: 'Или: «даст свидетельство обо Мне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν ἔλθῃ
  choice: Когда придёт
  rationale: Сочетание ὅταν с аористом сослагательного наклонения указывает здесь на ожидаемое будущее событие; русское «когда придёт» передаёт это естественно и без значения многократности.
- source_word: ὁ παράκλητος
  choice: Заступник
  rationale: Слово обозначает того, кто призван быть рядом, помогать, представлять или выступать в защиту. «Заступник» сохраняет личный и представительский оттенок, особенно уместный рядом с темой свидетельства; другие допустимые значения вынесены в примечание.
- source_word: ὃν ἐγὼ πέμψω ὑμῖν
  choice: которого Я пошлю вам
  rationale: Будущее время πέμψω и дательный ὑμῖν переданы прямо и естественно; местоимение ἐγώ отражено формой «Я».
- source_word: παρὰ τοῦ πατρός
  choice: от Отца
  rationale: Παρά с родительным падежом выражает происхождение от лица или из его присутствия; «от Отца» точно и лаконично.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: Дух истины
  rationale: Сохранена характерная для Иоанна конструкция с родительным падежом, не сводящая выражение ни только к «истинному Духу», ни к пояснению «Дух, который есть истина».
- source_word: ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται
  choice: исходящий от Отца
  rationale: «Исходящий» сохраняет специфическое значение ἐκπορεύεται и его видовременную форму настоящего времени, не подменяя её более общим «приходящий».
- source_word: ἐκεῖνος
  choice: Он
  rationale: Мужское указательное местоимение подчёркивает личное представление Духа и соотносится с существительным παράκλητος; в русском естественно передаётся личным местоимением «Он».
- source_word: μαρτυρήσει περὶ ἐμοῦ
  choice: будет свидетельствовать обо Мне
  rationale: Глагол сохраняет смысл свидетельства, в том числе возможный судебный оттенок, а περί с родительным естественно передано как «обо Мне».
theological_decisions:
- issue: Передача παράκλητος в высказывании о Духе
  choice: Заступник
  alternative: Помощник; Утешитель; Советник; Параклет
  rationale: Ни один русский эквивалент не охватывает всего смыслового диапазона. «Заступник» передаёт личную, представительскую и защитную функцию и согласуется с последующим свидетельством, не делая один из других оттенков единственно возможным.
- issue: Личное обозначение Духа
  choice: которого… Он
  alternative: который… он; который… тот
  rationale: Хотя πνεῦμα в греческом среднего рода, относительное ὃ согласовано с ним грамматически, а последующее мужское ἐκεῖνος соотносится с παράκλητος и лично представляет Духа. Русские формы мужского рода сохраняют эту связь.
- issue: Передача ἐκπορεύεται
  choice: исходящий от Отца
  alternative: выходящий от Отца; приходящий от Отца
  rationale: Выбрана лексически прозрачная формулировка, сохраняющая точный глагол исходного текста. Она не добавляет к стиху более поздних богословских уточнений и не разрешает возникшие позднее споры.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавные буквы в «Я», «Мне», «Он» служат традиционным русским способом обозначения божественных лиц, не изменяя синтаксиса оригинала. Парные тире ясно выделяют приложение «Дух истины, исходящий от Отца».
