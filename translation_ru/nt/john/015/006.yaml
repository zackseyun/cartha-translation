  text: ἐὰν μή τις ⸀μένῃ ἐν ἐμοί, ἐβλήθη ἔξω ὡς τὸ κλῆμα καὶ ἐξηράνθη, καὶ συνάγουσιν αὐτὰ καὶ εἰς τὸ πῦρ βάλλουσιν καὶ καίεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/006.yaml
  text: If anyone does not remain in me[a], he is thrown out like the branch and dries up; and they gather them and throw them into the fire[b], and they are burned.
translation:
  language: ru
  text: Если кто не остаётся во Мне[a], того выбрасывают вон, как ветвь, и он засыхает. Такие ветви собирают, бросают в огонь[b], и ветвь сжигают[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не пребывает во Мне». «Пребывать» — традиционный перевод важного для Евангелия от Иоанна глагола, означающего оставаться и продолжать быть.'
    reason: lexical_alternative
  - marker: b
    text: Образ предупреждает об отвержении и сожжении, но сам стих не уточняет, идёт ли речь об утрате подлинного ученичества или об обнаружении того, что связь была лишь внешней.
    reason: alternative_reading
  - marker: c
    text: В греческом тексте глагол стоит в единственном числе; повтор слова «ветвь» передаёт возвращение к ветви как к собирательному образу.
    reason: source_form
lexical_decisions:
- source_word: μένῃ
  choice: остаётся
  rationale: Глагол μένω — ключевое слово у Иоанна со значением продолжения и постоянства. «Остаётся» ясно передаёт это значение на современном русском языке; традиционное «пребывает» отмечено в сноске.
- source_word: ἐν ἐμοί
  choice: во Мне
  rationale: Предложное сочетание сохранено буквально, чтобы не ослаблять его смысл до «со Мной» или пояснительного «связан со Мной».
- source_word: ἐβλήθη ἔξω
  choice: того выбрасывают вон
  rationale: Пассивная конструкция передана неопределённо-личной русской формой. Настоящее время естественно для общего условия и сохраняет яркость образа; «вон» передаёт ἔξω.
- source_word: ὡς τὸ κλῆμα
  choice: как ветвь
  rationale: В контексте κλῆμα означает ветвь виноградной лозы. Краткое «ветвь» сохраняет связь с развёрнутым образом предыдущих стихов.
- source_word: ἐξηράνθη
  choice: засыхает
  rationale: Глагол означает становиться сухим, засыхать. Настоящее время согласовано с общим характером условного образа и звучит естественно по-русски.
- source_word: συνάγουσιν αὐτὰ
  choice: такие ветви собирают
  rationale: Неопределённое множественное число деятелей передано русской неопределённо-личной формой. «Такие ветви» естественно выражает переход от одной показательной ветви к множественному αὐτά.
- source_word: εἰς τὸ πῦρ βάλλουσιν
  choice: бросают в огонь
  rationale: Прямое и современное соответствие греческому выражению без стилистически устаревшего «ввергают».
- source_word: καίεται
  choice: они сгорают
  rationale: По форме греческий глагол стоит в единственном числе, однако после множественного αὐτά смысл относится к собранным ветвям. Русское множественное число обеспечивает связность; формальная особенность отмечена в сноске.
- source_word: τις
  choice: кто
  rationale: В условной конструкции ἐὰν μή τις естественно передаётся русским «если кто не», сохраняя обобщённое единственное число.
theological_decisions:
- issue: Следует ли уточнять, говорит ли предупреждение об отпадении подлинного ученика или об обнаружении лишь внешней связи со Христом
  choice: Прямой образ предупреждения без догматического пояснения в основном тексте
  alternative: Истолковать ветвь либо как подлинного верующего, утратившего спасение, либо как человека, никогда не имевшего подлинного единения со Христом
  rationale: Сам стих говорит об исключении, засыхании и сожжении, но не разрешает последующие богословские споры о прежнем духовном состоянии этого человека. Сноска сохраняет силу предупреждения и его подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясной, конкретной образностью. Неопределённо-личные формы «выбрасывают», «собирают», «бросают» сохраняют не названных в греческом тексте деятелей. Традиционное «пребывать» не внесено в основной текст, но сохранено как значимая лексическая альтернатива.
