  verdict: revise
  source_fidelity: 'Смысл ключевых слов передан верно: ψυχή в данном контексте — «жизнь», а ὑπέρ естественно передано предлогом «за». Однако оборот «как если кто отдаст» придаёт пояснительному ἵνα условный оттенок («если»), которого в греческом тексте нет. Здесь ἵνα раскрывает, в чём состоит наивысшая любовь.'
  naturalness: «Как если кто отдаст» — архаизирующая и синтаксически тяжеловесная конструкция, не вполне соответствующая современному литературному русскому. Формула с «чем та, когда...» передаёт афористичность высказывания естественнее.
  terminology: «Жизнь» и «за своих друзей» удачны. В сноске о θῇ следует не добавлять к буквальному значению утверждение о добровольности как отдельный компонент лексического значения; достаточно указать буквальную альтернативу. Альтернатива «в пользу» для ὑπέρ в этой фразе звучит неестественно, поэтому лучше дать «ради» и «во имя».
  issues:
