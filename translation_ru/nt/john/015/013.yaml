  text: μείζονα ταύτης ἀγάπην οὐδεὶς ἔχει, ἵνα τις τὴν ψυχὴν αὐτοῦ θῇ ὑπὲρ τῶν φίλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/013.yaml
  text: 'No one has greater love than this: that someone lay down his life for his friends[a][b][c][d].'
translation:
  language: ru
  text: Нет большей любви, чем та, когда кто-то отдаёт свою жизнь за своих друзей.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «положит свою жизнь».'
    reason: lexical_alternative
  - marker: b
    text: Греческое ὑπέρ можно также передать словами «ради» или «во имя».
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα ταύτης ἀγάπην
  choice: Нет любви больше той
  rationale: Сравнительная конструкция с родительным ταύτης передана естественной русской формулой; указательное «той» отсылает вперёд к поясняющей части.
- source_word: οὐδεὶς ἔχει
  choice: нет
  rationale: Русская безличная конструкция естественно выражает общее отрицание обладания такой любовью, не меняя смысла.
- source_word: ἵνα τις
  choice: как если кто
  rationale: ἵνα здесь раскрывает содержание «той» любви, а τις сохраняется как неопределённое и обобщённое «кто».
- source_word: τὴν ψυχὴν αὐτοῦ θῇ
  choice: отдаст свою жизнь
  rationale: В данном контексте ψυχή означает земную жизнь, которой жертвуют вплоть до смерти; сочетание с τίθημι естественно передаётся по-русски глаголом «отдать».
- source_word: ὑπὲρ τῶν φίλων αὐτοῦ
  choice: за своих друзей
  rationale: «За» кратко и естественно передаёт благотворно-представительный смысл ὑπέρ, не сужая его обязательно до замещения; возвратное «своих» однозначно связывает друзей с субъектом действия.
theological_decisions:
- issue: Значение ψυχή в высказывании о самопожертвовании
  choice: «жизнь»
  alternative: «душу»
  rationale: Речь идёт о добровольной отдаче жизни до смерти, а не о противопоставлении тела и нематериальной души.
- issue: Смысл ὑπέρ применительно к жертвенной любви
  choice: «за»
  alternative: «ради» или «в пользу»
  rationale: Перевод сохраняет представительный и благотворный диапазон предлога, не навязывая исключительно заместительное толкование.
- issue: Обобщённый субъект τις
  choice: «кто»
  alternative: «кто-либо» или «человек»
  rationale: «Кто» сохраняет неопределённость и универсальность греческого местоимения без гендерного ограничения.
translation_notes:
  register: Современный литературный русский язык с достоинством афористического изречения. Синтаксис близок к привычной библейской формуле, но «отдаст свою жизнь» яснее для современного читателя, чем буквальное «положит душу».
