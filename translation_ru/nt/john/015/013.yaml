    issue: «как если кто отдаст»
    rationale: 'Конструкция вводит условное «если», тогда как ἵνα здесь поясняет содержание/образец любви: «что (когда) кто-то отдаёт...».'
  - severity: low
    issue: Форма будущего времени «отдаст»
    rationale: В сочетании с «как если» она усиливает условно-гипотетическое прочтение. Настоящее время обозначает общий, определяющий пример и звучит естественнее.
  - severity: low
    issue: Сноска a включает толкование «добровольно»
    rationale: Буквальная альтернатива допустима, но добровольность не выражена самим θῇ и не обязательна для лексической сноски.
  - severity: low
    issue: 'Сноска b: «в пользу»'
    rationale: Хотя это возможно в иных контекстах для ὑπέρ, применительно к отдаче жизни за друзей оборот по-русски неестественен.
