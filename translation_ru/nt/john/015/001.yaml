  text: I am the true vine[a], and my Father is the vinegrower.
translation:
  language: ru
  text: Я — истинная виноградная лоза, и Мой Отец — виноградарь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «земледелец»; греческое слово обозначает человека, возделывающего землю, а в данном образе — того, кто выращивает виноград и ухаживает за лозой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Я —
  rationale: Именная конструкция с тире естественно передаёт по-русски эмфатическое самоотождествление, не добавляя избыточного «Сам».
- source_word: ἄμπελος
  choice: виноградная лоза
  rationale: Это ясный и точный современный русский эквивалент, сохраняющий предметный образ; одно слово «лоза» может обозначать также побег или иной вьющийся стебель.
- source_word: ἀληθινή
  choice: истинная
  rationale: 'Сохраняет характерную для Иоанна смысловую глубину: истинное, подлинное и в полной мере соответствующее Божьей реальности, не сводя значение лишь к «настоящая».'
- source_word: πατήρ μου
  choice: Мой Отец
  rationale: Передаёт личное отношение Иисуса к Богу; прописные буквы соответствуют принятому русскому библейскому оформлению.
- source_word: γεωργός
  choice: виноградарь
  rationale: В общем смысле слово обозначает земледельца, но непосредственный контекст виноградной лозы естественно уточняет род труда. «Виноградарь» по-русски ясно обозначает человека, выращивающего виноград и ухаживающего за лозами.
theological_decisions:
- issue: Метафорическое самоотождествление Иисуса
  choice: Сохранить прямую метафору «Я — истинная виноградная лоза» без поясняющего расширения.
  alternative: Я — настоящая виноградная лоза.
  rationale: «Истинная» сохраняет как сам образ, так и характерное для Евангелия от Иоанна богословское напряжение между подлинной Божьей реальностью и её образами, не истолковывая метафору за читателя.
- issue: Обозначение роли Отца словом γεωργός
  choice: виноградарь
  alternative: земледелец; садовник; возделыватель лозы
  rationale: Контекстуально точное название не привносит особого учения, но сохраняет единство метафоры лозы и ухаживающего за ней человека. Более широкое словарное значение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Тире естественно оформляет метафорическое именное сказуемое; порядок слов сохраняет акцент исходного текста. Маркер сноски поставлен после соответствующего выражения.
