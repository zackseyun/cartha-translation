  text: εἰ ἐκ τοῦ κόσμου ἦτε, ὁ κόσμος ἂν τὸ ἴδιον ἐφίλει· ὅτι δὲ ἐκ τοῦ κόσμου οὐκ ἐστέ, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς ἐκ τοῦ κόσμου, διὰ τοῦτο μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/019.yaml
  text: If you were from the world[a], the world would love its own. But because you are not from the world, but I chose you out of the world, for this reason the world hates you.
translation:
  language: ru
  text: Если бы вы были от мира[a], мир любил бы своё. Но поскольку вы не от мира, а Я избрал вас из мира, поэтому мир ненавидит вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принадлежали миру». Греческое выражение ἐκ τοῦ κόσμου может указывать как на происхождение, так и на принадлежность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ κόσμου
  choice: от мира / из мира
  rationale: В первых двух случаях «от мира» естественно передаёт происхождение или принадлежность и сохраняет повтор греческого оборота; после «избрал» выражение «из мира» яснее передаёт оттенок выделения из среды мира.
- source_word: κόσμος
  choice: мир
  rationale: Сохраняет широкую богословскую категорию Иоанна и не сужает её до толкования вроде «мировая система».
- source_word: ἂν ... ἐφίλει
  choice: любил бы
  rationale: Условное наклонение естественно выражает нереальное условие и предполагаемое следствие.
- source_word: τὸ ἴδιον
  choice: своё
  rationale: Передаёт субстантивированное среднее число без добавления прямо не выраженного слова «людей».
- source_word: φιλέω
  choice: любить
  rationale: Естественно сохраняет резкое противопоставление глаголу μισέω и не переуточняет оттенок привязанности.
- source_word: ἐξελεξάμην
  choice: избрал
  rationale: Достоинный и привычный библейский эквивалент со значением выбора; не добавляет спорного уточнения «для Себя».
- source_word: διὰ τοῦτο
  choice: и потому
  rationale: Ясно выражает причинно-следственную связь в современном русском синтаксисе.
- source_word: μισεῖ
  choice: ненавидит
  rationale: Прямо передаёт настоящее время и не смягчает силу противопоставления.
theological_decisions:
- issue: Значение «мира» в контексте Иоанна
  choice: Сохранить слово «мир» без поясняющего расширения.
  alternative: «Мировая система» или «общество людей, противящихся Богу».
  rationale: Греческое κόσμος здесь несёт нравственно-духовной смысл, но более узкая расшифровка в основном тексте устранила бы намеренную широту образа.
- issue: Смысл выбора в ἐξελεξάμην
  choice: «Я избрал вас из мира».
  alternative: Формулировка с усиленным указанием на предопределение или выбор «для Себя».
  rationale: Текст утверждает выбор учеников Иисусом, но не разрешает сам по себе более поздние конфессиональные споры о предопределении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Избрал» предпочтено более разговорному «выбрал»; краткий параллелизм и повтор слова «мир» сохранены.
