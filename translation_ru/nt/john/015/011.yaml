id: JHN.15.11
reference: John 15:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ταῦτα λελάληκα ὑμῖν ἵνα ἡ χαρὰ ἡ ἐμὴ ἐν ὑμῖν ⸀ᾖ καὶ ἡ χαρὰ ὑμῶν πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/011.yaml
  text: I have spoken these things to you so that my joy may be in you[b][a], and your joy may be made full.
translation:
  language: ru
  text: Всё это я сказал вам, чтобы моя радость была в вас[a] и чтобы ваша радость стала полной[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди вас».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «исполнилась».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: всё это
  rationale: Передаёт множественное указание на сказанное ранее, оставаясь естественным для современного русского языка.
- source_word: λελάληκα
  choice: я сказал
  rationale: Естественно передаёт совершённое речевое действие и его сохраняющийся результат; буквальное «я говорил» могло бы ошибочно подчеркнуть длительность или повторяемость.
- source_word: ὑμῖν
  choice: вам
  rationale: Сохраняет дательный падеж и множественное число второго лица.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно выражает цель высказывания; повтор перед второй частью делает русскую фразу яснее, не меняя её смысла.
- source_word: ἡ χαρὰ ἡ ἐμὴ
  choice: моя радость
  rationale: Прямо и без истолковывающего расширения сохраняет принадлежность радости Иисусу.
- source_word: ἐν ὑμῖν
  choice: в вас
  rationale: Сохраняет основное пространственно-внутреннее значение ἐν и допускает смысл внутреннего присутствия радости; значение «среди вас» отмечено в сноске.
- source_word: ᾖ
  choice: была
  rationale: Сослагательная целевая конструкция после ἵνα естественно передаётся русским «чтобы … была».
- source_word: καὶ
  choice: и
  rationale: Простое соединение двух частей цели.
- source_word: ἡ χαρὰ ὑμῶν
  choice: ваша радость
  rationale: Естественно сохраняет противопоставление «моя радость» и «ваша радость».
- source_word: πληρωθῇ
  choice: стала полной
  rationale: Передаёт достижение полноты и результирующий оттенок аориста; русская конструкция естественна в сочетании со словом «радость».
theological_decisions:
- issue: Смысл выражения «моя радость»
  choice: Сохранено без поясняющего расширения как «моя радость».
  alternative: «радость, которую я даю»; «радость обо мне»
  rationale: Греческий текст не уточняет, идёт ли речь о собственной радости Иисуса, разделённой с учениками, или о радости, исходящей от единения с ним; перевод не сужает эту смысловую насыщенность.
- issue: Значение ἐν ὑμῖν
  choice: «в вас»
  alternative: «среди вас»
  rationale: Оба значения грамматически возможны. Основной текст сохраняет вероятный внутренний смысл, а сноска — подлинную альтернативу коллективного значения.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-возвышенный. Местоимения, относящиеся к Иисусу, написаны со строчной буквы по обычной современной орфографической норме; это не умаляет их богословского значения.
