id: JHN.15.5
reference: John 15:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ ἄμπελος, ὑμεῖς τὰ κλήματα. ὁ μένων ἐν ἐμοὶ κἀγὼ ἐν αὐτῷ οὗτος φέρει καρπὸν πολύν, ὅτι χωρὶς ἐμοῦ οὐ δύνασθε ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/005.yaml
  text: I am the vine[a]; you are the branches. The one who remains in me, and I in him, bears much fruit[b], because apart from me you are not able to do anything.
translation:
  language: ru
  text: 'Я — виноградная лоза, а вы — ветви. Кто остаётся[a] во Мне, и Я в нём[b], тот приносит много плода, потому что без Меня вы не можете делать ничего.


    [a] Или: «пребывает». Греческий глагол передаёт мысль о продолжающейся связи и постоянстве.

    [b] Форма греческого текста — мужской род, единственное число; здесь она имеет обобщающее значение и относится к любому ученику, который остаётся в Иисусе.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пребывает». Греческий глагол передаёт мысль о продолжающейся связи и постоянстве.'
    reason: lexical_alternative
  - marker: b
    text: Форма греческого текста — мужской род, единственное число; здесь она имеет обобщающее значение и относится к любому ученику, который остаётся в Иисусе.
    reason: grammatical_clarification
lexical_decisions:
- source_word: ἄμπελος
  choice: виноградная лоза
  rationale: В данном образе речь идёт о лозе винограда; это естественный и ясный русский эквивалент, сохраняющий сельскохозяйственную метафору.
- source_word: κλήματα
  choice: ветви
  rationale: В контексте виноградарства слово обозначает ветви или побеги лозы. «Ветви» звучит естественно и точно поддерживает метафору.
- source_word: ὁ μένων
  choice: кто остаётся
  rationale: Передаёт длительное, продолжающееся пребывание и при этом звучит естественно в современном русском. В сноске дан традиционный вариант «пребывает».
- source_word: ἐν ἐμοὶ ... ἐν αὐτῷ
  choice: во Мне ... в нём
  rationale: Предлог «в» сохраняет взаимность и сильный язык внутреннего единения в греческом тексте; вариант «со Мной» ослабил бы этот смысл.
- source_word: κἀγὼ
  choice: и Я
  rationale: 'Передаёт взаимную конструкцию: ученик остаётся в Иисусе, и Иисус — в ученике.'
- source_word: φέρει καρπὸν πολύν
  choice: приносит много плода
  rationale: Это естественное русское сочетание, сохраняющее образ лозы и плода без лишнего истолкования.
- source_word: χωρὶς ἐμοῦ
  choice: без Меня
  rationale: Естественно передаёт отсутствие или отделённость от Иисуса в данном контексте.
- source_word: οὐ δύνασθε ποιεῖν οὐδέν
  choice: вы не можете делать ничего
  rationale: Сохраняет прямо выраженную неспособность и широкий охват греческого οὐδέν, не превращая утверждение в запрет.
theological_decisions:
- issue: Взаимное пребывание в языке Евангелия от Иоанна
  choice: «остаётся во Мне, и Я в нём»
  alternative: «остаётся со Мной, и Я с ним»
  rationale: Буквенное «в» сохраняет богословскую глубину и напряжение взаимного пребывания, не сводя его к простому сопровождению.
- issue: Обобщающее значение мужского рода αὐτῷ
  choice: «в нём» с пояснением в сноске
  alternative: «в таком человеке» или множественное число
  rationale: Так сохраняются грамматическое число и род исходного текста, а сноска ясно указывает на представительное, обобщающее значение.
- issue: Широта утверждения «ничего»
  choice: сохранить «не можете делать ничего» без ограничения
  alternative: «не можете принести никакого плода»
  rationale: Греческий текст говорит шире, чем только о плоде. Перевод не сужает высказывание и не разрешает его богословскую напряжённость за читателя.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизации. Синтаксическая конструкция «кто ... тот» естественно передаёт греческое субстантивированное причастие и его обобщающий смысл. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской практикой.
