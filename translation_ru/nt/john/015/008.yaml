base_translation:
  language: en
  yaml_path: translation/nt/john/015/008.yaml
  text: 'In this my Father is glorified: that you bear much fruit and become my disciples.'
translation:
  language: ru
  text: В том прославляется Мой Отец, что вы приносите много плода и становитесь Моими учениками.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых древних рукописях: «и будете Моими учениками»; в принятом здесь тексте: «и становитесь Моими учениками».'
    reason: Значимая текстовая вариация между γένησθε («становитесь») и γενήσεσθε («будете»), влияющая на временной оттенок фразы.
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: В этом
  rationale: Сохраняет указательную формулу оригинала и её возможную связь как с последующим пояснением, так и с ближайшим контекстом.
- source_word: ἐδοξάσθη
  choice: прославлен
  rationale: Аорист передан краткой страдательной формой; по-русски она естественно выражает совершившееся или рассматриваемое как целое прославление.
- source_word: ἵνα
  choice: чтобы
  rationale: Сохраняет целевое/результативное значение союза, не устраняя присущую конструкции смысловую напряжённость.
- source_word: καρπὸν πολὺν φέρητε
  choice: вы приносили много плода
  rationale: Сохраняет образ плода и продолженный характер действия, естественно выраженный несовершенным видом.
- source_word: γένησθε
  choice: стали
  rationale: Передаёт значение становления в чтении SBLGNT, не заменяя его более статичным «были» или «явились».
- source_word: ἐμοὶ μαθηταί
  choice: Моими учениками
  rationale: Естественная русская передача дательного отношения принадлежности/соотнесённости с Иисусом.
theological_decisions:
- issue: Связь прославления Отца, плодоношения и ученичества
  choice: Сохранена конструкция «чтобы… и стали», в которой плодоношение и становление учениками вместе связаны с прославлением Отца.
  alternative: «Тем прославится Отец Мой, если вы принесёте много плода и будете Моими учениками»
  rationale: Выбранный вариант ближе к ἵνα и γένησθε и не превращает высказывание в простое условие.
- issue: Временная форма ἐδοξάσθη
  choice: «прославлен»
  alternative: «прославляется» или «прославится»
  rationale: Сохранён аорист оригинала без вынужденного сведения к настоящему или будущему времени; краткая форма допускает контекстуальное осмысление.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Заглавные буквы в «Мой/Моими» обозначают речь Иисуса об Отце и о Себе согласно принятой русской библейской традиции; синтаксис с двоеточием сохраняет пояснительную структуру стиха.
