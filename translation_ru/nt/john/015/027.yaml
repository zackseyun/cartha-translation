  yaml_path: translation/nt/john/015/027.yaml
  text: And you also testify[b][a], because you have been with me from the beginning.
translation:
  language: ru
  text: И вы также свидетельствуете, потому что вы с самого начала со Мной.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὑμεῖς δὲ
  choice: И вы тоже
  rationale: Сочетание сохраняет связь с предыдущим высказыванием, подчёркнутое местоимение ὑμεῖς и смысл сопричастности учеников к свидетельству Утешителя.
- source_word: μαρτυρεῖτε
  choice: свидетельствуете
  rationale: Настоящее изъявительное наклонение допускает утверждение о совершающемся свидетельстве; русское слово сохраняет как общий, так и судебный оттенок греческого глагола.
- source_word: ὅτι
  choice: потому что
  rationale: В данном контексте союз естественно вводит основание свидетельства учеников — их пребывание с Иисусом от начала.
- source_word: ἀπ’ ἀρχῆς
  choice: от начала
  rationale: Кратко и близко к греческой форме; выражение сохраняет контекстуальную открытость относительно того, какое именно начало имеется в виду.
- source_word: μετ’ ἐμοῦ ἐστε
  choice: вы со Мной
  rationale: Русская именная конструкция с настоящим временем естественно передаёт продолжающееся состояние, начавшееся ранее; добавлять «были» или «находитесь» не требуется.
theological_decisions:
- issue: Смысл выражения «от начала»
  choice: Оставлено без уточнения как «от начала»
  alternative: «с начала Моего служения» или абсолютное богословское «от начала»
  rationale: Ближайший контекст указывает на историческое пребывание учеников с Иисусом, делающее их свидетелями, однако основной текст не вводит отсутствующего в греческом уточнения и сохраняет допустимую смысловую открытость.
- issue: Временной смысл ἐστε
  choice: «вы со Мной» — продолжающееся состояние в настоящем
  alternative: «вы были со Мной» или «вы были и остаётесь со Мной»
  rationale: Греческая форма буквально стоит в настоящем времени. Русская конструкция «вы со Мной от начала» естественно выражает состояние, длящееся от прошлого до настоящего, не превращая его только в прошедшее.
translation_notes:
  register: Современный литературный русский язык, простой и достойный по тону. Формулировка следует греческому настоящему времени и избегает архаичного «свидетельствуйте», которое могло бы ошибочно восприниматься как повеление.
