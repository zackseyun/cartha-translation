id: JHN.15.23
reference: John 15:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ ἐμὲ μισῶν καὶ τὸν πατέρα μου μισεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/023.yaml
  text: The one who hates me also hates my Father.
translation:
  language: ru
  text: Кто ненавидит Меня, тот ненавидит и Моего Отца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... μισῶν
  choice: Кто ненавидит Меня, тот...
  rationale: Субстантивированное причастие обозначает всякого человека, для которого характерно это действие. Конструкция «кто..., тот...» естественна для современного русского языка и сохраняет обобщённый смысл греческого единственного числа.
- source_word: ἐμὲ
  choice: Меня
  rationale: Прямое дополнение. Написание с прописной буквы соответствует принятому русскому благоговейному оформлению местоимений, относящихся к Иисусу в данном контексте.
- source_word: μισῶν / μισεῖ
  choice: ненавидит / ненавидит
  rationale: Глагол μισέω означает «ненавидеть». Настоящее время передаёт общее, характерное отношение; повтор одного и того же русского глагола сохраняет лексический повтор оригинала.
- source_word: καὶ
  choice: и
  rationale: Частица καί здесь распространяет ненависть также на Отца. Русская конструкция «тот ненавидит и...» естественно передаёт присоединительное значение «также».
- source_word: τὸν πατέρα μου
  choice: Моего Отца
  rationale: Естественная передача притяжательной конструкции. «Отец» употреблено как обозначение Бога в речи Иисуса; прописная буква ясно показывает референта.
theological_decisions:
- issue: Оформление обозначения Бога Отца и относящегося к Иисусу местоимения
  choice: Меня; Моего Отца
  alternative: меня; моего отца
  rationale: Прописные буквы соответствуют устойчивой русской библейской традиции и помогают распознать богословские референты, не добавляя к смыслу оригинала конфессионально специфического толкования.
translation_notes:
  register: Краткая, ясная и торжественно-нейтральная формулировка на современном литературном русском языке. Парная конструкция «кто..., тот...» звучит естественно и сохраняет обобщённый характер изречения.
