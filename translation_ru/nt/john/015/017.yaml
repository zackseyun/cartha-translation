  yaml_path: translation/nt/john/015/017.yaml
  text: These things I command you[b][a], so that you may love one another.
translation:
  language: ru
  text: Это заповедую вам, чтобы вы любили друг друга.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот что Я заповедую вам: любите друг друга». Греческая конструкция может выражать как цель, так и, почти изъяснительно, содержание повеления.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: это
  rationale: Формально это средний род множественного числа («эти вещи»), но в современном русском при обобщённой отсылке к предшествующим наставлениям естественно употребить собирательное «это».
- source_word: ἐντέλλομαι
  choice: заповедую
  rationale: Глагол настоящего времени означает «повелевать, предписывать». «Заповедую» сохраняет прямую силу высказывания и уместно в возвышенном, но понятном библейском регистре.
- source_word: ὑμῖν
  choice: вам
  rationale: Дательный падеж местоимения второго лица множественного числа прямо передан русским «вам».
- source_word: ἵνα
  choice: чтобы
  rationale: Союз естественно передаёт цель или предполагаемый результат, не устраняя возможности близкого к изъяснительному понимания конструкции.
- source_word: ἀγαπᾶτε
  choice: любили
  rationale: Настоящее сослагательное после ἵνα в русском естественно передаётся формой прошедшего времени с «чтобы»; глагол не уточняет сверх текста длительность или повторяемость любви.
- source_word: ἀλλήλους
  choice: друг друга
  rationale: Обычное современное русское выражение взаимного действия внутри группы.
theological_decisions:
- issue: Соотношение повеления и придаточного с ἵνα
  choice: 'Основной текст передаёт ἵνα как указание на цель: «чтобы вы любили друг друга».'
  alternative: '«Вот что Я заповедую вам: любите друг друга».'
  rationale: Конструкция с ἵνα обычно выражает цель или результат, однако в языке Иоанна может приближаться к раскрытию содержания. Основной перевод сохраняет синтаксическую форму, а примечание — подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским словом «заповедую». Собирательное «это» предпочтено буквальному, но неестественному здесь «эти вещи».
