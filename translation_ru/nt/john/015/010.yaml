source:
  edition: SBLGNT
  text: ἐὰν τὰς ἐντολάς μου τηρήσητε, μενεῖτε ἐν τῇ ἀγάπῃ μου, καθὼς ἐγὼ ⸂τὰς ἐντολὰς τοῦ πατρός μου⸃ τετήρηκα καὶ μένω αὐτοῦ ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/010.yaml
  text: If you keep my commandments, you will remain in my love, just as I have kept my Father's commandments and remain in his love.
translation:
  language: ru
  text: Если вы будете соблюдать Мои заповеди, то останетесь в Моей любви, как Я соблюдал заповеди Моего Отца и остаюсь в Его любви.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: Если
  rationale: Передаёт реальное условие с сослагательным наклонением, не добавляя значения повторяемости.
- source_word: ἐντολάς
  choice: заповеди
  rationale: Сохраняет нравственно-авторитетную силу слова ἐντολή и естественно звучит в данном библейском контексте.
- source_word: τηρήσητε / τετήρηκα
  choice: будете соблюдать / соблюдал
  rationale: Глагол «соблюдать» естественно сочетается с «заповедями» и сохраняет повтор одного и того же греческого глагола τηρέω. Для перфекта τετήρηκα русское прошедшее «соблюдал» в связи с настоящим «остаюсь» естественно выражает устойчивую верность, имеющую значение в настоящем.
- source_word: μενεῖτε / μένω
  choice: останетесь / остаюсь
  rationale: Сохраняет единообразие ключевого для Иоанна глагола μένω и передаёт продолжение пребывания в отношениях любви ясным современным русским языком.
- source_word: ἐν τῇ ἀγάπῃ μου / αὐτοῦ ἐν τῇ ἀγάπῃ
  choice: в Моей любви / в Его любви
  rationale: Буквальная предложная конструкция сохраняет образ любви как сферы пребывания и параллелизм двух частей стиха.
- source_word: καθὼς
  choice: как и
  rationale: Ясно обозначает соответствие между поведением учеников и примером Иисуса.
- source_word: τοῦ πατρός μου
  choice: Моего Отца
  rationale: Естественная русская форма родительного падежа; прописная буква указывает на Отца как наименование Бога.
theological_decisions:
- issue: Связь между соблюдением заповедей и пребыванием в любви Иисуса
  choice: 'Условная связь передана прямо: «Если… то…»'
  alternative: Истолковать послушание либо как заслугу, приобретающую любовь, либо лишь как внешний признак без действительной условной связи
  rationale: Греческий текст формулирует настоящее условие и сопоставляет его с послушанием Иисуса Отцу, но не разъясняет здесь вопросы заслуги, спасения или окончательной стойкости; перевод сохраняет эту богословскую напряжённость.
- issue: Значение ἀγάπη
  choice: любовь
  alternative: милосердие
  rationale: «Любовь» — точный, современный и контекстуально естественный эквивалент, сохраняющий повтор в обеих частях стиха.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Местоимения, относящиеся к Иисусу и Отцу, написаны с прописной буквы согласно распространённой русской библейской традиции. Синтаксический параллелизм оригинала сохранён без архаизмов.
