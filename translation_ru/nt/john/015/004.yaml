id: JHN.15.4
reference: John 15:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μείνατε ἐν ἐμοί, κἀγὼ ἐν ὑμῖν. καθὼς τὸ κλῆμα οὐ δύναται καρπὸν φέρειν ἀφ’ ἑαυτοῦ ἐὰν μὴ ⸀μένῃ ἐν τῇ ἀμπέλῳ, οὕτως οὐδὲ ὑμεῖς ἐὰν μὴ ἐν ἐμοὶ ⸀μένητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/004.yaml
  text: Remain in me[a], and I in you. Just as the branch is not able to bear fruit by itself unless it remains in the vine, so neither can you unless you remain in me.
translation:
  language: ru
  text: Оставайтесь во Мне[a], и Я — в вас. Как ветвь не может приносить плод сама по себе, если не остаётся на лозе, так и вы не можете приносить плод, если не остаётесь во Мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пребудьте во Мне». Глагол μένω означает «оставаться, пребывать» и здесь подчёркивает продолжающееся пребывание и сохранение связи.'
    reason: Лексическая альтернатива с традиционным библейским соответствием.
lexical_decisions:
- source_word: μείνατε / μένῃ / μένητε
  choice: оставайтесь / остаётся / остаётесь
  rationale: Повтор одного корня сохраняет ключевой для стиха глагол μένω и передаёт продолжительное пребывание и верность связи. Современное «оставаться» понятнее широкому кругу читателей, чем традиционное «пребывать».
- source_word: ἐν ἐμοί
  choice: во Мне
  rationale: Предлог ἐν сохранён буквально, поскольку речь идёт не просто о близости или общении, а об образе внутреннего единения со Христом.
- source_word: κἀγὼ ἐν ὑμῖν
  choice: и Я — в вас
  rationale: Сохранена греческая эллиптическая конструкция без добавления глагола и без превращения её в явно сформулированное обещание будущего.
- source_word: τὸ κλῆμα
  choice: ветвь
  rationale: Естественное русское обозначение ветви виноградной лозы в данном образе.
- source_word: οὐ δύναται καρπὸν φέρειν
  choice: не может приносить плод
  rationale: Передаёт выраженную в δύναται невозможность и сохраняет устойчивый библейский земледельческий образ.
- source_word: ἀφ’ ἑαυτοῦ
  choice: сама по себе
  rationale: Естественно передаёт невозможность самостоятельного плодоношения; женский род согласован со словом «ветвь».
- source_word: ἐν τῇ ἀμπέλῳ
  choice: на лозе
  rationale: Русское «на лозе» естественно описывает пребывание ветви в составе лозы, не добавляя пояснительного «прикреплённой».
- source_word: οὕτως οὐδὲ ὑμεῖς
  choice: так и вы не можете приносить плод
  rationale: В русском явно восстановлен подразумеваемый из предыдущей части смысл «приносить плод», чтобы избежать грамматически незавершённой фразы; нового содержания это не добавляет.
theological_decisions:
- issue: Значение μένω в контексте ученичества и единения со Христом
  choice: оставаться
  alternative: пребывать
  rationale: «Оставаться» современно и ясно выражает продолжающуюся связь, не ослабляя призыва к постоянству. Традиционное «пребывать» отмечено в сноске как содержательно допустимая альтернатива.
- issue: Эллипсис в κἀγὼ ἐν ὑμῖν
  choice: и Я — в вас
  alternative: и Я останусь в вас
  rationale: В греческом тексте глагол не выражен. Сохранение эллипсиса не решает без необходимости, следует ли понимать фразу как повеление, утверждение или обещание, и удерживает богословское напряжение взаимного пребывания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавные буквы в местоимениях «Мне» и «Я» следуют принятой русской традиции при обращении ко Христу. Тире в «и Я — в вас» делает греческий эллипсис ясным без добавления отсутствующего глагола.
