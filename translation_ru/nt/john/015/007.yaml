source:
  edition: SBLGNT
  text: ἐὰν μείνητε ἐν ἐμοὶ καὶ τὰ ῥήματά μου ἐν ὑμῖν μείνῃ, ὃ ἐὰν θέλητε ⸀αἰτήσασθε καὶ γενήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/007.yaml
  text: If you remain in me and my words remain in you[a], ask whatever you want[b], and it will be done for you.
translation:
  language: ru
  text: Если вы останетесь во Мне и Мои слова останутся в вас, просите, чего пожелаете, — и это исполнится для вас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μείνητε / μείνῃ (μένω)
  choice: останетесь / останутся
  rationale: «Оставаться» естественно передаёт длительное пребывание и сохраняет повтор одного и того же греческого глагола в обеих частях условия.
- source_word: ἐν ἐμοὶ
  choice: во Мне
  rationale: Предлог передан буквально, чтобы сохранить характерный для Иоанна язык пребывания и единения, не ослабляя его до «со Мной».
- source_word: τὰ ῥήματά μου
  choice: Мои слова
  rationale: Прямой и естественный эквивалент, обозначающий сказанное Иисусом без поясняющей парафразы.
- source_word: ὃ ἐὰν θέλητε
  choice: чего пожелаете
  rationale: Передаёт неопределённый объект желания и широту греческой конструкции; «пожелаете» звучит достойно и естественно в современном литературном русском.
- source_word: αἰτήσασθε
  choice: просите
  rationale: Императив естественно передаёт призыв обращаться с просьбой; несовершенный вид в русском идиоматичен для общего повеления и не навязывает греческому аористу лишнюю однократность.
- source_word: γενήσεται ὑμῖν
  choice: это будет вам дано
  rationale: В контексте просьбы такая формулировка естественно передаёт наступление обещанного результата. Местоимение «это» соотносится с предметом просьбы; пассивная конструкция не называет действующего лица, как и греческий текст.
theological_decisions:
- issue: Условие и обещание об исполнении просьбы
  choice: 'Обещание сохранено внутри явного условия: ученики остаются в Иисусе, а Его слова — в них.'
  alternative: Передать обещание как безусловное или вынести условие за рамки связи с молитвой.
  rationale: Греческое ἐὰν вводит условный период, охватывающий последующее повеление и обещание. Перевод не добавляет иных условий, но и не устраняет прямо выраженное.
- issue: Смысл γενήσεται ὑμῖν
  choice: «это будет вам дано»
  alternative: «это исполнится для вас» / «это произойдёт для вас»
  rationale: Форма γίνομαι буквально выражает осуществление или наступление события. В контексте просьбы русский оборот «будет вам дано» наиболее естественен, хотя слегка конкретизирует подразумеваемое исполнение просьбы, не называя исполнителя.
translation_notes:
  register: Современный литературный русский с традиционно уважительным написанием местоимения «Мне» и притяжательного «Мои» применительно к Иисусу. Синтаксический параллелизм и повтор «останетесь / останутся» сохранены; фраза остаётся ясной для широкого читателя и не перегружена архаизмами.
