    rationale: Греческий ἐποίησεν — аорист, параллельный ἐποίησα. В современном русском совершенный вид «которых/каких никто другой не совершил» точнее представляет совершённые уникальные дела; «не совершал» способно создать оттенок повторяющегося действия.
