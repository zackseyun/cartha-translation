base_translation:
  language: en
  yaml_path: translation/nt/john/015/024.yaml
  text: If I had not done among them the works that no one else did[a], they would not have sin[b]; but now they have both seen and hated both me and my Father.
translation:
  language: ru
  text: Если бы Я не совершил среди них дел, каких никто другой не совершил, то они не имели бы греха[a]. Но теперь они и видели, и возненавидели и Меня, и Моего Отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то они не были бы виновны во грехе». Буквально по-гречески: «то они не имели бы греха».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔργα
  choice: дел
  rationale: «Дела» естественно передаёт ἔργα и сохраняет характерное для Евангелия от Иоанна обозначение деяний Иисуса, свидетельствующих о Нём.
- source_word: ἐποίησα ἐν αὐτοῖς
  choice: Я не совершил среди них
  rationale: Условная конструкция требует в русском сослагательного наклонения; ἐν αὐτοῖς имеет здесь локально-социальный смысл — действия были совершены среди этих людей, в их присутствии.
- source_word: ἃ οὐδεὶς ἄλλος ἐποίησεν
  choice: каких никто другой не совершал
  rationale: Формулировка подчёркивает уникальность дел Иисуса и естественно согласуется в русском с существительным «дел».
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: они не имели бы греха
  rationale: Сохранён буквальный и богословски значимый иоанновский оборот «иметь грех», не сведённый переводом только к юридической виновности.
- source_word: νῦν δὲ
  choice: Но теперь
  rationale: Ясно передаёт противопоставление нереальному условию и фактическому положению.
- source_word: καὶ ἑωράκασιν καὶ μεμισήκασιν
  choice: они и видели, и возненавидели
  rationale: Повтор «и… и…» передаёт соотносительную структуру καὶ… καὶ; русские формы обозначают состоявшиеся действия, сохраняющие значение для настоящего контекста.
- source_word: καὶ ἐμὲ καὶ τὸν πατέρα μου
  choice: и Меня, и Моего Отца
  rationale: Повторяющийся союз сохраняет греческое эмфатическое соединение обоих объектов ненависти.
theological_decisions:
- issue: Смысл выражения «не имели бы греха» применительно к виновности
  choice: Сохранить выражение «не имели бы греха».
  alternative: «Не были бы виновны во грехе».
  rationale: Контекст указывает на виновность перед лицом явленных дел Иисуса, однако буквальный иоанновский оборот шире юридического толкования и сохраняет богословское напряжение текста.
- issue: Связь ненависти к Иисусу с ненавистью к Отцу
  choice: 'Передать параллельно и эмфатически: «и Меня, и Моего Отца».'
  alternative: Сгладить до «Меня и Моего Отца».
  rationale: Повтор καί подчёркивает, что реакция на Иисуса одновременно направлена и против Отца; перевод не добавляет объяснения сверх текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис остаётся ясным для широкого читателя; заглавные местоимения при обращении к Иисусу и упоминании Его Лица следуют принятой русской библейской издательской традиции.
