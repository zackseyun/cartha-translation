  text: Αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμὴ ἵνα ἀγαπᾶτε ἀλλήλους καθὼς ἠγάπησα ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/012.yaml
  text: 'This is my command: that you love one another just as I have loved you[a].'
translation:
  language: ru
  text: 'Вот Моя заповедь: любите друг друга, как Я возлюбил вас.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот Моя заповедь: чтобы вы любили друг друга, как Я возлюбил вас».'
    reason: Возможна более формальная передача конструкции ἵνα как придаточного, раскрывающего содержание заповеди.
lexical_decisions:
- source_word: Αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμὴ
  choice: Вот Моя заповедь
  rationale: Естественная русская формула, указывающая на конкретную заповедь Иисуса; «заповедь» сохраняет авторитетную силу ἐντολή и уместна в современном литературном библейском регистре.
- source_word: ἵνα ἀγαπᾶτε
  choice: любите
  rationale: ἵνα вводит содержание заповеди. Русская форма повелительного наклонения прямо и естественно передаёт предписываемое действие, не перегружая фразу конструкцией «чтобы вы любили».
- source_word: ἀλλήλους
  choice: друг друга
  rationale: Обычный и точный русский эквивалент взаимного местоимения.
- source_word: καθὼς
  choice: как
  rationale: 'Передаёт сравнение: любовь Иисуса служит образцом любви учеников друг к другу.'
- source_word: ἠγάπησα ὑμᾶς
  choice: Я возлюбил вас
  rationale: Аорист передан совершенным видом; «возлюбил» сохраняет лексическую связь с языком любви и достоинство речи, оставаясь понятным современному читателю.
theological_decisions:
- issue: Характер любви учеников
  choice: как Я возлюбил вас
  alternative: точно так же, как Я возлюбил вас
  rationale: Перевод сохраняет сравнительную силу καθὼς и представляет любовь Иисуса как образец, не уточняя сверх текста степень или способ соответствия.
- issue: Сила высказывания Иисуса
  choice: 'Вот Моя заповедь: любите друг друга'
  alternative: 'Вот Моя заповедь: чтобы вы любили друг друга'
  rationale: Повелительная конструкция ясно сохраняет обязательный характер слов Иисуса, тогда как двоеточие показывает, что далее раскрывается содержание заповеди.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским тоном. Заглавные буквы в «Моя» и «Я» отражают традиционное русское оформление местоимений, относящихся к Иисусу; смысловой нагрузки сверх исходного текста им не придаётся.
