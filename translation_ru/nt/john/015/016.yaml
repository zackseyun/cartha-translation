source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς με ἐξελέξασθε, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς, καὶ ἔθηκα ὑμᾶς ἵνα ὑμεῖς ὑπάγητε καὶ καρπὸν φέρητε καὶ ὁ καρπὸς ὑμῶν μένῃ, ἵνα ὅ τι ἂν αἰτήσητε τὸν πατέρα ἐν τῷ ὀνόματί μου δῷ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/016.yaml
  text: You did not choose me[a], but I chose you and appointed you so that you should go and bear fruit, and that your fruit should remain, so that whatever you ask the Father in my name[c][b], he may give you.
translation:
  language: ru
  text: Не вы выбрали Меня[a], но Я выбрал вас и назначил вас, чтобы вы шли и приносили плод и чтобы ваш плод оставался[b], — чтобы Отец[c] дал вам всё, о чём вы попросите Его во имя Моё.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избрали». Глагол также может передаваться как «избирать», но в данном контексте речь непосредственно идёт о выборе Иисусом учеников; основной текст не придаёт этому слову узкого позднейшего богословского значения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пребывал». Глагол μένω, часто встречающийся у Иоанна, может обозначать продолжение, сохранение или пребывание; здесь «оставался» естественно выражает устойчивость плода.'
    reason: lexical_alternative
  - marker: c
    text: В греческом тексте сказано «Отец», а не «Мой Отец».
    reason: textual_clarity
lexical_decisions:
- source_word: ἐξελέξασθε / ἐξελεξάμην
  choice: избрали / избрал
  rationale: «Избрать» естественно передаёт осознанный выбор и сохраняет подчёркнутый контраст местоимений, не превращая глагол в узкий систематико-богословский термин.
- source_word: ἔθηκα
  choice: поставил
  rationale: В данном контексте «поставил» обозначает целенаправленное назначение и поручение; оно сохраняет образность τίθημι и не сужает смысл до рукоположения на церковную должность.
- source_word: ἵνα
  choice: чтобы
  rationale: Дважды вводит целевые или целево-результативные придаточные; повтор «чтобы» сохраняет структуру и движение греческой фразы.
- source_word: ὑπάγητε
  choice: шли
  rationale: Передаёт широкое значение движения и деятельности, не добавляя прямо отсутствующего в тексте указания на миссионерское путешествие.
- source_word: καρπὸν φέρητε
  choice: приносили плод
  rationale: Сохраняет ключевую для контекста Ин 15 метафору и звучит естественно в современном литературном русском языке.
- source_word: μένῃ
  choice: оставался
  rationale: Передаёт продолжительность и устойчивость плода, сохраняя связь с характерным для Иоанна глаголом μένω.
- source_word: ὅ τι ἂν αἰτήσητε
  choice: всё, о чём вы попросите
  rationale: Выражает неопределённо-широкий охват конструкции с ἄν; «попросите» естественно в контексте обращения к Отцу.
- source_word: ἐν τῷ ὀνόματί μου
  choice: во имя Моё
  rationale: Устойчивый и семантически открытый русский эквивалент, не сводящий выражение к одной интерпретации.
- source_word: δῷ
  choice: дал
  rationale: Русская форма в придаточном с «чтобы» естественно передаёт аористный конъюнктив в целево-результативной конструкции, не превращая его в отдельное категорическое будущее обещание.
- source_word: τὸν πατέρα
  choice: Отец
  rationale: Точно следует греческому «Отец», не добавляя отсутствующее притяжательное местоимение «Мой».
theological_decisions:
- issue: Возможное догматическое переосмысление ἐξελεξάμην как специального термина об избрании
  choice: «Я избрал вас» понимается прежде всего в непосредственном контексте выбора учеников и порученной им плодотворной деятельности.
  alternative: Передать специальным богословским термином или истолковать как исчерпывающее утверждение о порядке спасения.
  rationale: Текст подчёркивает инициативу Иисуса, однако сам по себе не требует сводить её к более поздней систематической формуле.
- issue: Смысл ἔθηκα ὑμᾶς
  choice: 'Передано как целенаправленное назначение и поручение: «поставил вас».'
  alternative: «Назначил вас» либо толкование как формального поставления на церковную должность.
  rationale: Контекст определяет цель — идти, приносить сохраняющийся плод и просить во имя Иисуса, — но не называет конкретной церковной должности.
- issue: Сила заключительного ἵνα
  choice: 'Сохранена зависимая целево-результативная конструкция: «чтобы Отец дал вам».'
  alternative: 'Выделить как безусловное самостоятельное обещание: «Отец даст вам».'
  rationale: Повтор ἵνα синтаксически связывает просьбу и дар Отца с предшествующим избранием, назначением и плодом; перевод не должен устранять эту связь.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Инверсия «во имя Моё» сохраняет узнаваемость формулы без общей архаизации. Заглавные буквы в местоимениях, относящихся к Иисусу, применены как традиционная русская издательская конвенция. Повторы «вас», «чтобы» и «плод» намеренно сохранены ради риторики и синтаксической связи оригинала.
