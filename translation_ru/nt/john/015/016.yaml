  terminology: «Выбрал» сохраняет нетехнический характер ἐκλέγομαι в данном контексте; «назначил» передаёт целенаправленное ἔθηκα, не сводя его к рукоположению. «Приносили плод» и «оставался» сохраняют образ и лексику Иоанна. «Отец», без «Мой», соответствует греческому тексту.
