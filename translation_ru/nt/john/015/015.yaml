source:
  edition: SBLGNT
  text: οὐκέτι ⸂λέγω ὑμᾶς⸃ δούλους, ὅτι ὁ δοῦλος οὐκ οἶδεν τί ποιεῖ αὐτοῦ ὁ κύριος· ὑμᾶς δὲ εἴρηκα φίλους, ὅτι πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου ἐγνώρισα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/015.yaml
  text: I no longer call you servants[a], because the servant does not know what his master is doing. But I have called you friends[b], because I have made known to you everything that I heard from my Father.
translation:
  language: ru
  text: Я уже не называю вас рабами[a], потому что раб не знает, что делает его господин[b]. Я же назвал вас друзьями, потому что открыл вам всё, что услышал от Моего Отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слугами». Греческое δοῦλος может обозначать слугу или раба; здесь «раб» яснее передаёт противопоставление подчинённого положения дружбе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «хозяин». Греческое κύριος здесь означает господина раба, а не употребляется как божественный или мессианский титул.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: уже не
  rationale: Естественно передаёт временное отрицание и изменение прежнего положения.
- source_word: λέγω ὑμᾶς
  choice: называю вас
  rationale: В этой конструкции λέγω означает именование или обозначение статуса; настоящее время сохранено.
- source_word: δούλους / δοῦλος
  choice: рабами / раб
  rationale: Контраст с друзьями подчёркивает подчинённое положение и отсутствие доверительного знания; «раб» точнее, чем более широкое «слуга».
- source_word: αὐτοῦ ὁ κύριος
  choice: его господин
  rationale: В данном социально-бытовом сопоставлении κύριος обозначает господина раба, а не божественный титул.
- source_word: εἴρηκα φίλους
  choice: назвал вас друзьями
  rationale: Русское совершенное прошедшее естественно выражает состоявшееся именование, результат которого сохраняется; частица «же» передаёт противопоставление δέ.
- source_word: πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου
  choice: всё, что услышал от Моего Отца
  rationale: Сохраняет всеохватность πάντα и прямое значение ἀκούω; παρά с родительным указывает на источник.
- source_word: ἐγνώρισα ὑμῖν
  choice: открыл вам
  rationale: Передаёт каузативное значение γνωρίζω — сделать известным, сообщить; «открыл» естественно в контексте доверительного сообщения и не добавляет содержания сверх исходного текста.
theological_decisions:
- issue: Передача δοῦλος в противопоставлении учеников рабам и друзьям
  choice: раб
  alternative: слуга; невольник
  rationale: «Раб» сохраняет социальную асимметрию, на которой строится противопоставление, не превращая её в конфессиональное утверждение о природе ученичества.
- issue: Передача κύριος в образе отношений раба и господина
  choice: господин
  alternative: хозяин; Господь
  rationale: Здесь слово обозначает социального господина раба. Строчная буква и контекст не позволяют ошибочно представить его как прямой христологический титул.
- issue: Результативность εἴρηκα
  choice: назвал вас друзьями
  alternative: называю вас друзьями; назвал и называю вас друзьями
  rationale: Совершенный вид естественно обозначает совершившееся именование с сохраняющимся результатом, не перегружая русский текст пояснительной формулой.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной синтаксической структурой. «Моего Отца» оформлено с прописных букв как уважительное обозначение Бога. Сохранены противопоставление рабов и друзей, источник откровения и различие временных форм без искусственного калькирования.
