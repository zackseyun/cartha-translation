  - severity: low
    issue: «Им нечем оправдать свой грех»
    rationale: Оборот допускает оттенок отсутствия способа или аргумента оправдать совершённый грех, тогда как πρόφασις οὐκ ἔχουσιν прежде всего утверждает отсутствие оправдания, отговорки или предлога. Замена устраняет это небольшое смысловое смещение.
