base_translation:
  language: en
  yaml_path: translation/nt/john/015/022.yaml
  text: If I had not come and spoken to them[a], they would not have sin[c][b]; but now they have no excuse for their sin.
translation:
  language: ru
  text: Если бы Я не пришёл и не говорил им, они не имели бы греха[a]. Но теперь у них нет оправдания за свой грех[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «они не имели бы греха». Возможный контекстуальный смысл: «они не были бы виновны в этом грехе».'
    reason: Сохраняет буквальное выражение оригинала и отмечает возможный контекстуальный оттенок ответственности, не внося его в основной текст.
  - marker: b
    text: 'Или: «у них нет предлога (или отговорки) для оправдания своего греха».'
    reason: πρόφασις может обозначать оправдание, отговорку или предлог; примечание отражает лексическую альтернативу.
lexical_decisions:
- source_word: εἰ μὴ ἦλθον
  choice: Если бы Я не пришёл
  rationale: Греческая конструкция выражает нереальное условие в прошлом; русское «если бы… не пришёл» естественно передаёт его условный смысл.
- source_word: ἐλάλησα αὐτοῖς
  choice: не говорил им
  rationale: Глагол λαλέω с дательным αὐτοῖς означает обращённую к ним речь; «говорил им» звучит естественно и не добавляет невыраженного объекта.
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: на них не было бы греха
  rationale: Оборот сохраняет ключевое слово «грех» и условность высказывания, но по-русски звучит естественнее буквального «они не имели бы греха». Он намеренно не уточняет, идёт ли речь о вине именно за отвержение откровения.
- source_word: νῦν δὲ
  choice: Но теперь
  rationale: Передаёт резкое противопоставление предполагаемой ситуации нынешней действительности.
- source_word: πρόφασιν οὐκ ἔχουσιν
  choice: им нечем оправдать
  rationale: В данном контексте πρόφασις означает основание для оправдания или отговорку. Русский оборот передаёт отсутствие оправдания естественно, не используя устаревшее «предлог».
- source_word: περὶ τῆς ἁμαρτίας αὐτῶν
  choice: свой грех
  rationale: При выражении «нечем оправдать» отношение περί с родительным естественно передаётся прямым дополнением; возвратное «свой» ясно соотносит грех с подлежащим.
theological_decisions:
- issue: Означает ли ἁμαρτίαν οὐκ εἴχοσαν полную безгрешность или отсутствие вины за отвержение Иисуса до Его откровения
  choice: Сохранено выражение с существительным «грех» без поясняющего ограничения.
  alternative: «они не были бы виновны в этом грехе»
  rationale: Контекст связывает ответственность с приходом и речью Иисуса, однако греческий текст буквально говорит, что они «не имели бы греха». Перевод не должен превращать контекстуальный оттенок в явное ограничение смысла.
translation_notes:
  register: Современный литературный русский, ясный и сдержанно торжественный. Заглавная буква в «Я» отражает принятый русский библейский узус. Формулировка избегает как архаичного «не имели бы греха» в основном тексте, так и чрезмерно толковательного «не были бы виновны именно в этом грехе».
