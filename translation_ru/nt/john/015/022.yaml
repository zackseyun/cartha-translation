  verdict: revise
  source_fidelity: Первое предложение в черновике в целом передаёт нереальное условие прошлого и сохраняет ἁμαρτία («грех»), однако оборот «на них не было бы греха» менее точно воспроизводит греческое «они не имели бы греха» и в современном русском звучит не вполне естественно. «Они не имели бы греха» достаточно ясно, литературно и сохраняет намеренную неоднозначность оригинала. Во втором предложении «им нечем оправдать свой грех» несколько меняет утверждение об отсутствии πρόφασις (основания для оправдания/отговорки) в утверждение об отсутствии средства оправдать грех. «У них нет оправдания за свой грех» точнее передаёт смысл и остаётся естественным.
  naturalness: «Если бы Я не пришёл и не говорил им» — естественная русская условная конструкция; несовершенный вид «не говорил» уместен для обозначения факта обращения к ним без искусственного ограничения единичным актом. «Но теперь у них нет оправдания за свой грех» — современная литературная и ясная формулировка.
  terminology: «Грех» сохраняет ключевой термин ἁμαρτία без богословского истолкования как исключительно «вины». «Оправдание» корректно передаёт πρόφασις в данном контексте; в примечании можно отметить вариант «предлог/отговорка», не вводя его в основной текст.
