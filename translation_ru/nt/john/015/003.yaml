  text: ἤδη ὑμεῖς καθαροί ἐστε διὰ τὸν λόγον ὃν λελάληκα ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/003.yaml
  text: Already you are clean because of the word that I have spoken to you[a].
translation:
  language: ru
  text: Вы уже чисты благодаря слову, которое Я сказал вам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через слово, которое Я сказал вам».'
    reason: 'Лексико-синтаксическая альтернатива: διά с винительным может быть понято с причинным либо близким к средственному оттенком.'
lexical_decisions:
- source_word: ἤδη
  choice: уже
  rationale: Передаёт наличное состояние, уже наступившее к моменту речи, и естественно звучит по-русски.
- source_word: ὑμεῖς
  choice: вы
  rationale: Явно выраженное местоимение сохраняется; дополнительное «сами» создало бы неуместный оттенок противопоставления.
- source_word: καθαροί
  choice: чисты
  rationale: Сохраняет образ очищения и словесную связь с ближайшим контекстом о виноградной лозе, не сужая смысл до абстрактной нравственной чистоты.
- source_word: διὰ τὸν λόγον
  choice: благодаря слову
  rationale: διά с винительным здесь естественно выражает основание или причину; «благодаря» передаёт причинно-средственный оттенок без тяжеловесности.
- source_word: λόγον
  choice: слову
  rationale: Прямой эквивалент, сохраняющий характерную для Иоанна лексику; «весть» или «учение» были бы более истолковывающими.
- source_word: ὃν λελάληκα
  choice: которое Я сказал
  rationale: Русское совершенное прошедшее естественно передаёт завершённое речевое действие с сохраняющимся результатом; буквальное «которое Я говорил» здесь менее точно и менее естественно.
- source_word: ὑμῖν
  choice: вам
  rationale: Прямо передаёт дательный адресата и множественное число.
theological_decisions:
- issue: Характер чистоты учеников
  choice: Передать утверждение о нынешней чистоте учеников, не вводя технической догматической категории.
  alternative: Истолковать её специально как сакраментальное очищение или судебное оправдание.
  rationale: Контекст связывает чистоту учеников со сказанным Иисусом словом и с образом лозы и очищения ветвей; перевод должен сохранить эту метафору и богословскую открытость.
- issue: Значение διὰ τὸν λόγον
  choice: 'Основной текст: «благодаря слову».'
  alternative: «через слово».
  rationale: Греческая конструкция допускает причинный оттенок, вероятный в данном контексте, но также может восприниматься инструментально; альтернативу следует сохранить в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Заглавная буква в местоимении «Я» следует принятой русской библейской типографической традиции при речи Иисуса. Синтаксис краток и сохраняет акцент на уже существующем состоянии учеников.
