  text: ἀλλὰ ταῦτα πάντα ποιήσουσιν ⸂εἰς ὑμᾶς⸃ διὰ τὸ ὄνομά μου, ὅτι οὐκ οἴδασιν τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/021.yaml
  text: But they will do all these things to you because of my name[a], because they do not know the one who sent me.
translation:
  language: ru
  text: Но всё это они будут делать с вами из-за Моего имени[a], потому что не знают Того, кто послал Меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против вас». Греческое выражение может обозначать действия, враждебно направленные против учеников.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт сильное противопоставление предшествующему высказыванию естественным для современного русского союзом.
- source_word: ταῦτα πάντα
  choice: всё это
  rationale: Естественно сохраняет и указательное значение ταῦτα, и полноту πάντα без тяжеловесного «все эти вещи».
- source_word: ποιήσουσιν
  choice: будут делать
  rationale: Прямо передаёт будущее время и широкое значение ποιέω, не сужая его до одного вида враждебного обращения.
- source_word: εἰς ὑμᾶς
  choice: вам
  rationale: Обозначает направленность действий на учеников и сохраняет более широкую формулировку греческого текста; в данном контексте возможен враждебный оттенок «против вас».
- source_word: διὰ τὸ ὄνομά μου
  choice: из-за Моего имени
  rationale: Передаёт причинное значение διά с винительным падежом и сохраняет богословски значимое слово «имя», представляющее личность и власть Иисуса.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно вводит причину описанного отношения к ученикам.
- source_word: οὐκ οἴδασιν
  choice: не знают
  rationale: Сохраняет простоту выражения и характерную для Иоанна возможность личностного, а не только информационного знания.
- source_word: τὸν πέμψαντά με
  choice: Пославшего Меня
  rationale: Естественно передаёт субстантивированное причастие, не добавляя отсутствующего в греческом тексте наименования «Отец».
theological_decisions:
- issue: Кого обозначает выражение «Пославшего Меня»
  choice: Неявная ссылка на Отца сохранена как «Пославшего Меня».
  alternative: «Отца, пославшего Меня»
  rationale: В контексте Евангелия от Иоанна референт понятен, однако в самом стихе стоит субстантивированное причастие, а не слово «Отец»; перевод не делает неявное обозначение явным.
- issue: Значение выражения «из-за Моего имени»
  choice: Сохранено буквальное и богословски ёмкое «имени».
  alternative: «из-за Меня» или «из-за Моей репутации»
  rationale: «Имя» здесь представляет личность, принадлежность и авторитет Иисуса; замена устранила бы важную образность оригинала.
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным библейским звучанием. Прописные буквы в местоимениях и причастии, относящихся к Иисусу и Отцу, соответствуют принятой русской религиозной издательской норме; синтаксис остаётся понятным обычному читателю.
