  text: Вы — Мои друзья, если исполняете то, что Я вам повелеваю.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Вы — Мои друзья, если делаете то, что Я вам повелеваю».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Вы
  rationale: Местоимение второго лица множественного числа стоит в начале и несёт некоторое смысловое выделение. Русское «Вы» естественно сохраняет явное подлежащее; тире дополнительно передаёт акцент без утяжеления «вы сами».
- source_word: φίλοι μού
  choice: Мои друзья
  rationale: φίλοι обозначает друзей и близкие личные отношения, а μού — принадлежность или отношение. «Мои друзья» — естественный и точный русский эквивалент.
- source_word: ἐστε
  choice: —
  rationale: 'В современном русском настоящая форма связки «быть» обычно опускается; именное сказуемое оформлено тире: «Вы — Мои друзья».'
- source_word: ἐὰν
  choice: если
  rationale: Союз с сослагательным наклонением вводит реальное условие. «Если» точнее, чем временное «когда».
- source_word: ποιῆτε
  choice: исполняете
  rationale: В контексте повелений ποιέω означает делать, осуществлять сказанное. «Исполняете» естественно сочетается с «повелеваю» и не добавляет явно выраженного длительного значения.
- source_word: ἃ
  choice: то, что
  rationale: Относительное местоимение среднего рода множественного числа указывает на содержание повеления. «То, что» естественно по-русски и сохраняет структуру исходного текста.
- source_word: ἐγὼ
  choice: Я
  rationale: Явное греческое местоимение подчёркивает говорящего. В русском оно сохранено; прописная буква соответствует принятому благоговейному оформлению местоимений, относящихся к Иисусу.
- source_word: ἐντέλλομαι
  choice: повелеваю
  rationale: Глагол обозначает властное предписание. «Повелеваю» сохраняет авторитет речи Иисуса; «советую» или «наставляю» неоправданно ослабили бы смысл.
- source_word: ὑμῖν
  choice: вам
  rationale: 'Дательный падеж множественного числа естественно передаётся словом «вам»: «то, что Я вам повелеваю».'
theological_decisions:
- issue: Связь дружбы с Иисусом и послушания в условном придаточном
  choice: «Вы — Мои друзья, если исполняете то, что Я вам повелеваю»
  alternative: «Вы — Мои друзья, когда исполняете то, что Я вам повелеваю»
  rationale: Конструкция ἐὰν с сослагательным наклонением прежде всего выражает условие, а не просто время. Перевод сохраняет прямую связь дружбы и послушания, не объясняя её через привнесённую доктрину о заслугах, спасении или стойкости.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис близок к греческому, но естественен для русского читателя. Прописные буквы в местоимениях «Мои», «Я» употреблены как традиционное уважительное оформление речи Иисуса.
