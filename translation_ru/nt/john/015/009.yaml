id: JHN.15.9
reference: John 15:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καθὼς ἠγάπησέν με ὁ πατήρ, κἀγὼ ⸂ὑμᾶς ἠγάπησα⸃, μείνατε ἐν τῇ ἀγάπῃ τῇ ἐμῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/009.yaml
  text: Just as the Father has loved me[a], I also have loved you; remain in my love.
translation:
  language: ru
  text: Как Отец полюбил Меня, так и Я полюбил вас. Оставайтесь в Моей любви.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: Как … так и
  rationale: Эта естественная русская сравнительная конструкция ясно передаёт соответствие между любовью Отца к Иисусу и любовью Иисуса к ученикам.
- source_word: ἠγάπησέν / ἠγάπησα
  choice: полюбил / полюбил
  rationale: Русские формы прошедшего времени совершенного вида естественно представляют любовь как целостное действие; её сохраняющаяся значимость раскрывается следующим повелением. «Возлюбил» возможно, но звучит более архаично.
- source_word: ὁ πατήρ
  choice: Отец
  rationale: В контексте Евангелия от Иоанна это обозначение Бога как Отца Иисуса; прописная буква соответствует титульному употреблению.
- source_word: κἀγὼ
  choice: так и Я
  rationale: Передаёт соединительное καί, акцент на ἐγώ и сравнительное соответствие, заданное καθὼς.
- source_word: ὑμᾶς
  choice: вас
  rationale: Форма второго лица множественного числа прямо и естественно передана русским «вас».
- source_word: μείνατε
  choice: Оставайтесь
  rationale: Повелительная форма передаёт призыв продолжать пребывать в уже существующей сфере любви; «оставайтесь» современно и сохраняет ключевой для этого отрывка смысл μένω.
- source_word: ἐν τῇ ἀγάπῃ τῇ ἐμῇ
  choice: в Моей любви
  rationale: Кратко и естественно передаёт предложную конструкцию и усиленное притяжательное определение; «любовь» является обычным современным соответствием ἀγάπη.
theological_decisions:
- issue: Значение ἀγάπη
  choice: любовь
  alternative: милосердие
  rationale: «Любовь» непосредственно и современно передаёт ἀγάπη; «милосердие» сузило бы значение и внесло бы отсутствующий в данном контексте оттенок.
- issue: Временной и аспектуальный оттенок ἠγάπησέν / ἠγάπησα
  choice: полюбил / полюбил
  alternative: любил / любил
  rationale: Греческий аорист представляет действия целостно, не утверждая, что любовь прекратилась. Совершенный вид лучше сохраняет эту целостность, а продолжающаяся реальность любви очевидна из призыва оставаться в ней.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским достоинством. Избрано «полюбил», а не более архаичное «возлюбил». Прописные буквы в «Отец», «Меня», «Я», «Моей» отражают титульное и благоговейное употребление без добавления нового смысла.
