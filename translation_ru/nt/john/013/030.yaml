  edition: SBLGNT
  text: λαβὼν οὖν τὸ ψωμίον ἐκεῖνος ⸂ἐξῆλθεν εὐθύς⸃. ἦν δὲ νύξ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/030.yaml
  text: So after taking the piece of bread[a], he went out immediately[c][b]. And it was night.
translation:
  language: ru
  text: Итак, взяв кусок хлеба[a], он[b] сразу вышел. Была ночь.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кусок пищи», «кусочек». Греческое слово ψωμίον обозначает небольшой кусок хлеба или другой пищи, поданной за трапезой.'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте стоит указательное местоимение со значением «тот»; оно выразительнее простого «он» и, вероятно, особо выделяет Иуду.
    reason: lexical_alternative
  - marker: c
    text: Слова «Была ночь» буквально указывают время; вместе с тем они могут перекликаться с проходящей через Евангелие от Иоанна темой света и тьмы.
    reason: cross_reference
lexical_decisions:
- source_word: λαβὼν
  choice: взяв
  rationale: 'Аористное причастие передаёт действие, предшествующее основному: сначала Иуда взял хлеб, затем вышел. Русское деепричастие естественно и точно сохраняет эту последовательность.'
- source_word: οὖν
  choice: итак
  rationale: Слово отмечает переход и развитие повествования. «Итак» сохраняет связующую функцию, не превращая её в строго логическое следствие.
- source_word: τὸ ψωμίον
  choice: кусок хлеба
  rationale: Уменьшительное ψωμίον обозначает небольшой кусок хлеба или пищи. «Кусок хлеба» ясно и естественно по-русски; менее конкретное «кусок» и стилистически окрашенное «кусочек» оставлены как возможные оттенки.
- source_word: ἐκεῖνος
  choice: он
  rationale: В данном контексте русское «он» естественно указывает на уже названного Иуду. Оттенок усиленного или дистанцирующего греческого указательного местоимения отмечен в сноске, поскольку буквальное «тот» здесь звучало бы неестественно без выраженного сопоставления.
- source_word: ἐξῆλθεν
  choice: вышел
  rationale: Глагол ἐξέρχομαι имеет прямое пространственное значение «выйти»; перевод не заменяет его более общим «ушёл».
- source_word: εὐθύς
  choice: сразу
  rationale: Передаёт незамедлительность действия современным нейтральным словом; «тотчас» было бы более высоким по регистру.
- source_word: ἦν δὲ νύξ
  choice: Была ночь
  rationale: Краткая отдельная фраза сохраняет буквальное указание времени и выразительную лаконичность греческого текста. Связка δέ в русском естественно остаётся невыраженной при переходе к этой итоговой фразе.
theological_decisions:
- issue: Возможный символический смысл ночи в Евангелии от Иоанна
  choice: 'В основном тексте «ночь» передана как буквальное указание времени: «Была ночь».'
  alternative: Раскрыть в переводе ночь как образ духовной тьмы.
  rationale: Греческая фраза сама по себе сообщает время. Возможная связь с темой света и тьмы у Иоанна сохраняется как смысловой резонанс и отмечается в сноске, но не вносится в основной текст как однозначное толкование.
- issue: Выразительность ἐκεῖνος по отношению к Иуде
  choice: В основном тексте употреблено естественное русское «он», а усилительная форма оригинала отмечена в сноске.
  alternative: Перевести буквально «тот» или более развёрнуто «тот человек».
  rationale: Греческое указательное местоимение может выделять Иуду и создавать оттенок дистанцирования. Однако самостоятельное русское «тот» в этой конструкции способно ошибочно создать явное противопоставление, которого текст не уточняет; сноска сохраняет реальную риторическую особенность оригинала.
translation_notes:
  register: Современный литературный русский язык с кратким, сдержанным и торжественным ритмом. Синтаксис сохраняет последовательность греческих действий, а заключительная отдельная фраза — её лаконичную повествовательную силу. Архаизмы и явное внесение символического толкования исключены.
