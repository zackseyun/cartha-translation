base_translation:
  language: en
  yaml_path: translation/nt/john/013/004.yaml
  text: He rises from the supper and lays aside his outer garments[a], and taking a towel[b], tied it around himself.
translation:
  language: ru
  text: Он встаёт из-за ужина, снимает верхнюю одежду и, взяв полотенце, опоясывается им.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγείρεται
  choice: встаёт
  rationale: Историческое настоящее передано настоящим временем; «встаёт» естественно и сохраняет живость повествования.
- source_word: ἐκ τοῦ δείπνου
  choice: из-за ужина
  rationale: Русское «встаёт из-за ужина» естественно обозначает, что Иисус поднялся со своего места во время трапезы; «ужин» соответствует контексту δεῖπνον.
- source_word: τίθησιν τὰ ἱμάτια
  choice: снимает верхнюю одежду
  rationale: В данном контексте τίθημι означает отложить после снятия, а ἱμάτια — верхнюю одежду; единственное собирательное «одежду» звучит по-русски естественно и не подразумевает полного обнажения.
- source_word: λαβὼν λέντιον
  choice: взяв полотенце
  rationale: Краткий деепричастный оборот точно передаёт аористное причастие; λέντιον обозначает полотенце или льняное полотнище для служения.
- source_word: διέζωσεν ἑαυτόν
  choice: опоясывается им
  rationale: «Опоясывается» точно передаёт действие διαζώννυμι, оставаясь понятным в современном литературном русском; местоимение «им» ясно отсылает к полотенцу.
