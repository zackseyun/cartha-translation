  text: νεύει οὖν τούτῳ Σίμων Πέτρος ⸂πυθέσθαι τίς ἂν εἴη⸃ περὶ οὗ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/024.yaml
  text: So Simon Peter motioned to this one to ask who it might be about whom he was speaking[a].
translation:
  language: ru
  text: Итак, Симон Пётр подал ему знак, чтобы тот спросил, о ком говорит Иисус и кто бы это мог быть.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεύει
  choice: подал знак
  rationale: Глагол обозначает невербальный жест или сигнал; «подал знак» естественно по-русски и не уточняет без основания, был ли это кивок.
- source_word: οὖν
  choice: тогда
  rationale: Частица отмечает повествовательное следствие и продолжение после предыдущего стиха; «тогда» передаёт эту связь естественно.
- source_word: τούτῳ
  choice: ему
  rationale: Указательное местоимение относится к ученику, уже названному в контексте; буквальное «этому» здесь звучало бы неестественно.
- source_word: πυθέσθαι
  choice: чтобы тот спросил
  rationale: Инфинитив передаёт содержание знака Петра — побуждение ученика задать вопрос.
- source_word: τίς ἂν εἴη
  choice: кого… имеет в виду
  rationale: В сочетании с περὶ οὗ и λέγει оборот означает вопрос о том, о ком говорит Иисус; русская идиома «кого имеет в виду» ясно передаёт смысл, хотя оттенок предположительности ἄν с оптативом выражен менее явно.
- source_word: περὶ οὗ λέγει
  choice: кого Иисус имеет в виду
  rationale: Идиоматический русский оборот передаёт «о ком он говорит» и устраняет возможную неясность местоимения «он» без изменения референта.
