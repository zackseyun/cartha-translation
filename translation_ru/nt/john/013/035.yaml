  text: ἐν τούτῳ γνώσονται πάντες ὅτι ἐμοὶ μαθηταί ἐστε, ἐὰν ἀγάπην ἔχητε ἐν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/035.yaml
  text: By this everyone will know that you are my disciples[b][a], if you have love for one another.
translation:
  language: ru
  text: По этому все узнают, что вы — мои ученики, если любите друг друга.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: По этому
  rationale: Оборот указывает на признак, по которому окружающие распознают учеников; «по этому» естественно передаёт инструментально-доказательное значение.
- source_word: γνώσονται
  choice: узнают
  rationale: Будущая форма γινώσκω здесь означает, что люди смогут распознать или понять данный факт; «узнают» сохраняет широту греческого выражения.
- source_word: πάντες
  choice: все
  rationale: Множественное число имеет обобщённое значение и охватывает всех людей без указания только на мужчин.
- source_word: ἐμοὶ μαθηταί ἐστε
  choice: вы — Мои ученики
  rationale: Дательный ἐμοί передаёт принадлежность; по-русски это естественно выражается притяжательным местоимением.
- source_word: ἐὰν
  choice: если
  rationale: Сохраняет условную форму греческого текста и не превращает признак ученичества в утверждение о его заслуживании.
- source_word: ἀγάπην ἔχητε ἐν ἀλλήλοις
  choice: будете любить друг друга
  rationale: Буквально говорится «иметь любовь друг среди друга»; глагольная конструкция по-русски естественно и ясно передаёт взаимную направленность любви.
theological_decisions:
- issue: Характер условия, вводимого ἐὰν
  choice: если будете любить друг друга
  alternative: когда будете любить друг друга
  rationale: '«Если» сохраняет условность исходного текста: взаимная любовь выступает опознавательным признаком учеников, без добавления мысли о том, что ею заслуживают ученичество.'
- issue: Значение πάντες
  choice: все
  alternative: все люди
  rationale: Краткое «все» естественно для русского контекста и сохраняет универсальный, а не исключительно мужской охват.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, торжественная и понятная. Заглавная буква в «Мои» используется как традиционный русский знак почтительного отношения к словам Иисуса о Себе, не меняя смысла исходного текста.
