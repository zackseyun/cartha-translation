  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: ἐν τούτῳ — указание на признак; πάντες — все; условие ἐὰν сохранено; взаимная любовь выражена естественно. Однако «будете любить» с будущим временем добавляет временную окраску, которой нет в настоящем сослагательном ἔχητε: речь о наличии взаимной любви как текущем признаке. Русское «если вы любите друг друга» точнее сохраняет условный и общий характер высказывания.'
  naturalness: «По этому все узнают» естественно, хотя «По этому все узнают, что…» требует нормативного раздельного написания именно в инструментальном значении. Исправленный вариант краток и литературно естественен.
  terminology: «Ученики» — устоявшаяся и точная передача μαθηταί. Заглавное «Мои» не имеет основания в греческом тексте и является конфессионально-типографским добавлением; в современном нейтральном литературном оформлении следует «мои». «Любите друг друга» адекватно передаёт ἀγάπην ἔχητε ἐν ἀλλήλοις без ненужной интерпретации.
  issues:
