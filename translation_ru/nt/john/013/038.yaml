base_translation:
  language: en
  yaml_path: translation/nt/john/013/038.yaml
  text: Jesus answered[a], “Will you lay down your life for me? Truly, truly, I say to you, the rooster will certainly not crow until you have denied me three times.”
translation:
  language: ru
  text: 'Иисус ответил: «Ты жизнь свою за Меня отдашь?[a] Истинно, истинно говорю тебе: петух не пропоёт, прежде чем ты трижды отречёшься от Меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «положишь жизнь свою за Меня?» Греческое ψυχή может означать «душа» или «жизнь»; здесь имеется в виду готовность отдать жизнь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: ответил
  rationale: Греческое историческое настоящее естественно передано русским прошедшим временем в повествовании.
- source_word: Τὴν ψυχήν σου
  choice: жизнь свою
  rationale: В сочетании с τίθημι слово ψυχή означает жизнь, которую человек готов отдать, а не особо выделенную нематериальную душу.
- source_word: ὑπὲρ ἐμοῦ
  choice: за Меня
  rationale: В контексте готовности умереть выражение «за Меня» естественно передаёт значение замещения или действия ради другого.
- source_word: θήσεις
  choice: отдашь
  rationale: Русское «отдать жизнь» идиоматично выражает смысл τίθημι τὴν ψυχήν и сохраняет идею добровольной жертвы.
- source_word: ἀμὴν ἀμὴν
  choice: Истинно, истинно
  rationale: Сохранены повтор и торжественная усилительная формула, характерная для речей Иисуса у Иоанна.
- source_word: οὐ μὴ ... φωνήσῃ
  choice: не пропоёт
  rationale: 'При конструкции с «как» русская формулировка естественно выражает категорическое предсказание: отречение непременно произойдёт прежде пения петуха.'
- source_word: ἀλέκτωρ
  choice: петух
  rationale: Обычное современное русское обозначение птицы.
- source_word: ἕως οὗ
  choice: как
  rationale: 'В отрицательной конструкции «не... как...» естественно обозначает предел: петух не пропоёт до совершения названного действия.'
- source_word: ἀρνήσῃ με
  choice: отречёшься от Меня
  rationale: В отношении личной верности ἀρνέομαι точнее и естественнее передаётся как «отречься от», а не просто «отрицать».
- source_word: τρίς
  choice: трижды
  rationale: Краткое, современное и литературное соответствие наречию τρίς.
theological_decisions:
- issue: Значение ψυχή в контексте готовности Петра умереть за Иисуса
  choice: жизнь
  alternative: душа
  rationale: Речь идёт о готовности принять смерть; «жизнь» передаёт конкретный жертвенный смысл и не навязывает более узкого антропологического толкования.
- issue: Связь пения петуха и трёх отречений
  choice: петух не пропоёт прежде трёх отречений
  alternative: менее определённая временная связь
  rationale: Конструкция οὐ μή ... ἕως οὗ выражает решительное предсказание и временной предел, не снимая риторической напряжённости слов Иисуса.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранены характерное для Иоанна удвоенное «истинно» и риторический вопрос. Местоимения, относящиеся к Иисусу, написаны с прописной буквы по принятой русской библейской стилистике.
