  source_fidelity: 'Перевод точно передаёт текст SBLGNT: условное εἰ сохранено как «Если», аористный пассив ἐδοξάσθη — как «был прославлен», оба будущих δοξάσει — как «прославит», а εὐθύς — как «тотчас». Повтор «Бог» и «прославит» воспроизводит намеренную структуру греческого предложения. «В Нём» и «в Себе» корректно сохраняют ἐν с дательным и не подменяют его более истолковательными вариантами.'
