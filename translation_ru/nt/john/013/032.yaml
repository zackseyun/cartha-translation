source:
  edition: SBLGNT
  text: ⸂εἰ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ,⸃ καὶ ὁ θεὸς δοξάσει αὐτὸν ἐν ⸀αὑτῷ, καὶ εὐθὺς δοξάσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/032.yaml
  text: If God was glorified in him[a], God will also glorify him in himself[b], and will glorify him at once.
translation:
  language: ru
  text: Если Бог был прославлен в Нём[a][c], то и Бог прославит Его в Себе[b] и тотчас прославит Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Поскольку Бог был прославлен в Нём». В греческом тексте стоит «если», хотя в данном контексте условие, вероятно, подразумевается как истинное.'
    reason: alternative_reading
  - marker: b
    text: Выражение «в Себе» можно также понимать как «у Себя» или «Сам Собою»; греческая формулировка кратка и допускает смысловую многогранность.
    reason: lexical_alternative
  - marker: c
    text: В некоторых древних рукописях слова «Если Бог был прославлен в Нём» отсутствуют.
    reason: textual_variant
lexical_decisions:
- source_word: εἰ
  choice: если
  rationale: Сохраняет прямо выраженное в греческом тексте условие, не заменяя его причинным «поскольку», хотя из контекста следует, что условие считается исполнившимся.
- source_word: ἐδοξάσθη
  choice: был прославлен
  rationale: Передаёт аорист страдательного залога и сохраняет лексическую связь с последующими формами δοξάσει.
- source_word: ἐν αὐτῷ
  choice: в Нём
  rationale: Буквально и ёмко передаёт ἐν с дательным падежом; вариант «через Него» был бы более истолковательным.
- source_word: δοξάσει
  choice: прославит
  rationale: Передаёт будущее время и сохраняет повтор ключевого глагола δοξάζω.
- source_word: ἐν αὑτῷ
  choice: в Себе
  rationale: Возвратное местоимение относится к Богу; формулировка сохраняет компактность и богословскую насыщенность греческого выражения.
- source_word: εὐθύς
  choice: тотчас
  rationale: Естественно и точно выражает непосредственность действия, не ослабляя её до значения «скоро».
theological_decisions:
- issue: Условное значение εἰ при подразумеваемой истинности условия
  choice: Сохранить в основном тексте «Если Бог был прославлен в Нём»
  alternative: «Поскольку Бог был прославлен в Нём»
  rationale: Контекст позволяет понимать условие как уже истинное, однако греческий текст использует εἰ, а не явно причинный союз. Перевод сохраняет форму высказывания и выносит контекстуальное понимание в сноску.
- issue: Значение ἐν αὑτῷ
  choice: «в Себе»
  alternative: «у Себя» или «Сам Собою»
  rationale: Основной вариант ближе всего к греческой конструкции и не снимает её смысловой и богословской напряжённости.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной синтаксической формой. Повтор слова «Бог» и глагола «прославить» сохранён ради структуры и смыслового параллелизма оригинала. Местоимения, относящиеся к Богу и Иисусу, написаны с прописной буквы по принятой в русской библейской традиции практике.
