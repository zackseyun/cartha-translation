base_translation:
  language: en
  yaml_path: translation/nt/john/013/010.yaml
  text: Jesus said to him[a], “The one who has bathed has no need except to wash his feet, but is completely clean. And you are clean, but not all of you.”
translation:
  language: ru
  text: 'Иисус сказал ему: «Тому, кто искупался[a], не нужно мыть ничего, кроме ног, но он весь чист. И вы чисты, но не все».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте употреблены два разных глагола: λούω — «купаться, омываться» (обычно о мытье всего тела) и νίπτω — «мыть» (часто отдельную часть тела, например ноги).'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Иисус сказал ему
  rationale: Историческое настоящее λέγει передано русским прошедшим временем, естественным для повествования, без изменения смысла.
- source_word: Ὁ λελουμένος
  choice: Тому, кто искупался
  rationale: Перфектное причастие от λούω обозначает человека, вымывшего всё тело, и подчёркивает сохраняющийся результат совершённого омовения. «Искупался» естественно передаёт это значение и позволяет отличить λούω от νίπτω.
- source_word: οὐκ ἔχει χρείαν εἰ μὴ
  choice: нужно… только
  rationale: Конструкция передаёт единственное исключение к отсутствию нужды. Русское «нужно… только» ясно и естественно выражает тот же смысл.
- source_word: τοὺς πόδας νίψασθαι
  choice: вымыть только ноги
  rationale: νίπτω обычно обозначает мытьё отдельной части тела; возвратный инфинитив передан естественной русской конструкцией при общем субъекте.
- source_word: καθαρὸς ὅλος
  choice: он весь чист
  rationale: Сочетание сохраняет образ телесной чистоты и одновременно не устраняет возможный духовный смысл; ὅλος передано словом «весь».
- source_word: καὶ ὑμεῖς καθαροί ἐστε
  choice: И вы чисты
  rationale: Сохранены множественное обращение и повтор ключевого слова καθαρός.
- source_word: ἀλλ’ οὐχὶ πάντες
  choice: но не все
  rationale: Фраза сохраняет намеренно краткое указание на исключение внутри группы; по-русски принадлежность к группе ясна из «вы» в предыдущей части.
theological_decisions:
- issue: Буквальный образ омовения и символическая духовная чистота
  choice: Сохранить слова «искупался», «вымыть ноги» и «чист», не поясняя символику в основном тексте.
  alternative: Добавить толкование вроде «духовно чист» или передать оба греческих глагола одним русским глаголом.
  rationale: Высказывание действует одновременно на буквальном и символическом уровнях. Лексическое различие и повтор «чист» сохраняют эту напряжённость, не навязывая определённого богословского толкования.
- issue: Род обобщающего причастия ὁ λελουμένος
  choice: Передать конструкцией «тому, кто искупался».
  alternative: Передать явно мужской формой «искупавшийся».
  rationale: Греческая форма грамматически мужского рода, но изречение имеет обобщающий характер. Русская конструкция с «кто» сохраняет единственное число и не делает мужской пол смысловым ограничением.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-достоинственным звучанием. «Искупался» выбрано ради естественности и различения двух греческих глаголов; двусмысленность слова «чист» намеренно сохранена.
