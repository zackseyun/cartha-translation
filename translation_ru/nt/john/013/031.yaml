source:
  edition: SBLGNT
  text: Ὅτε ⸀οὖν ἐξῆλθεν ⸀λέγει Ἰησοῦς· Νῦν ἐδοξάσθη ὁ υἱὸς τοῦ ἀνθρώπου, καὶ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/031.yaml
  text: So when he had gone out[a], Jesus said, “Now the Son of Man has been glorified, and God has been glorified in him.”
translation:
  language: ru
  text: 'Когда он вышел, Иисус сказал: «Теперь прославлен Сын Человеческий, и Бог прославлен в Нём[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через Него». Греческое выражение может означать, что Бог прославлен в Сыне или через Сына.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Когда
  rationale: Ὅτε вводит временное придаточное, а οὖν отмечает развитие повествования. В современном русском контекст достаточно передаёт этот переход; добавление «итак» или «поэтому» здесь звучало бы тяжеловесно.
- source_word: ἐξῆλθεν
  choice: он вышел
  rationale: Аорист ἐξέρχομαι указывает на совершившийся выход Иуды из помещения. Русский совершенный вид естественно передаёт предшествование без необходимости в специальной форме давнопрошедшего времени.
- source_word: λέγει
  choice: сказал
  rationale: Историческое настоящее греческого повествования естественно передаётся русским прошедшим временем.
- source_word: Νῦν
  choice: Теперь
  rationale: 'Передаёт временную и дискурсивную силу νῦν: с уходом Иуды наступил объявляемый Иисусом момент.'
- source_word: ἐδοξάσθη
  choice: прославлен
  rationale: Краткое страдательное причастие с нулевой связкой естественно и торжественно передаёт аорист пассива, не уточняя сверх текста, относится ли прославление только к кресту или ко всему комплексу предстоящих событий.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Сохраняет устойчивое самообозначение Иисуса и его ветхозаветные, в особенности даниилические, связи.
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Прямое и естественное соответствие θεός в данном контексте.
- source_word: ἐν αὐτῷ
  choice: в Нём
  rationale: Наиболее непосредственно сохраняет конструкцию ἐν с дательным и её реляционно-сферический смысл; возможное инструментальное понимание вынесено в сноску.
theological_decisions:
- issue: Объём понятия прославления Сына Человеческого
  choice: Формулировка оставляет прославление уже вступившей в действие реальностью, не сводя его лишь к одному событию.
  alternative: Уточнить в переводе, что речь исключительно о распятии либо исключительно о воскресении и возвышении.
  rationale: Текст не делает такого уточнения; в Евангелии от Иоанна смерть, воскресение и возвращение к Отцу образуют взаимосвязанный комплекс прославления.
- issue: Значение ἐν αὐτῷ
  choice: «в Нём»
  alternative: «через Него»
  rationale: Греческая конструкция допускает реляционное и инструментальное понимание. Основной текст сохраняет более прямое соответствие, а сноска — подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Традиционный титул «Сын Человеческий» сохранён; синтаксис сделан ясным и естественным. Местоимение «Нём» написано с прописной буквы по распространённой русской библейской издательской норме.
