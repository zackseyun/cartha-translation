  source_fidelity: 'Перевод точно передаёт греческий текст: временное придаточное Ὅτε, завершённое действие ἐξῆλθεν, историческое настоящее λέγει в естественном русском прошедшем времени, а также оба аориста пассива ἐδοξάσθη. «Прославлен» удачно сохраняет лаконичность и не сужает смысл прославления. «В Нём» является прямым соответствием ἐν αὐτῷ; альтернативное инструментальное понимание корректно отмечено в сноске.'
