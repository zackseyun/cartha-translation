  text: ὑμεῖς φωνεῖτέ με Ὁ διδάσκαλος καὶ Ὁ κύριος, καὶ καλῶς λέγετε, εἰμὶ γάρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/013.yaml
  text: You call me Teacher and Lord, and you speak rightly, for I am.
translation:
  language: ru
  text: Вы называете Меня Учителем и Господом[a] — и правильно говорите, потому что Я и есть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Владыкой». Греческое слово кю́риос указывает на власть или господство; здесь оно передано как титул «Господь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνεῖτέ με
  choice: называете Меня
  rationale: В конструкции с двумя именными дополнениями естественно передаёт то, как ученики именуют Иисуса; сохраняет прямоту греческого выражения.
- source_word: Ὁ διδάσκαλος
  choice: Учителем
  rationale: Современное и точное обозначение роли и титула Иисуса; греческий артикль выделяет титул, но отдельного воспроизведения в русской конструкции не требует.
- source_word: Ὁ κύριος
  choice: Господом
  rationale: Сохраняет обычное новозаветное титульное значение κύριος и его богословский вес, не сводя слово только к социальному обращению «господин».
- source_word: καλῶς λέγετε
  choice: правильно говорите
  rationale: Передаёт как оценку правильности (καλῶς), так и глагол речи (λέγετε), оставаясь естественным по-русски.
- source_word: εἰμὶ γάρ
  choice: потому что Я и есть
  rationale: Частица «и» естественно выражает по-русски подразумеваемое подтверждение названных титулов, тогда как буквальное «потому что Я есть» здесь звучит двусмысленно и неестественно.
theological_decisions:
- issue: Передача κύριος как титула Иисуса
  choice: Господь
  alternative: Господин / Владыка
  rationale: «Господь» соответствует устойчивому новозаветному титулу и сохраняет его христологический вес. Смысл власти и господства отмечен в сноске без чрезмерного уточнения.
- issue: Объём утверждения εἰμὶ γάρ
  choice: потому что Я и есть
  alternative: потому что так оно и есть / потому что Я таков
  rationale: Фраза подтверждает оба обращения — «Учитель» и «Господь». Перевод сохраняет краткость и не превращает выражение в отдельную формулу «Я есмь».
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Прописные буквы в местоимениях «Меня», «Я» соответствуют принятому русскому библейскому регистру; тире подчёркивает подтверждение Иисусом названных титулов.
