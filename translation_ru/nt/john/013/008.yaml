review_pass:
  verdict: revise
  source_fidelity: Первая реплика верно передаёт решительный отказ, выраженный οὐ μή ... εἰς τὸν αἰῶνα, а «мне ноги» — естественный русский эквивалент греческого притяжательного оборота. «Омою тебя» точно сохраняет переход от мытья ног к омовению самого Петра. Однако οὐκ ἔχεις — настоящее время; в русском условном высказывании естественно и точнее сохранить его как «у тебя нет», а не заменять будущим «не будет у тебя».
  naturalness: «Не будешь ты мыть мне ноги вовек» понятно, но инверсия и сочетание несовершенного инфинитива с «вовек» звучат несколько искусственно для современного литературного русского. «Ты никогда не будешь мыть мне ноги» естественно выражает категорическое неприятие будущего действия. Формула «у тебя нет части со Мной» более естественна, чем «не будет у тебя части со Мной», и сохраняет евангельскую сдержанность.
  terminology: «Омою», «часть со Мной» и «со Мной» удачно сохраняют литературный евангельский регистр и не конкретизируют значение μέρος как исключительно сакраментальное, сотериологическое либо этическое. Сноска должна отражать лексическую альтернативу «доля», но не представлять замену настоящего времени будущим как равноправную неоднозначность исходного текста.
