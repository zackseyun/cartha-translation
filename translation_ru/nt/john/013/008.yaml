- from: 'Пётр сказал ему: «Не будешь ты мыть мне ноги вовек!» Иисус ответил ему: «Если Я не омою тебя, не будет у тебя части со Мной».[a]'
  to: 'Пётр сказал Ему: «Ты никогда не будешь мыть мне ноги!» Иисус ответил ему: «Если Я не омою тебя, у тебя нет части со Мной».[a]'
  rationale: Исправлено будущее «не будет» на настоящее «у тебя нет» в соответствии с οὐκ ἔχεις. Первая реплика перестроена в более естественный современный русский порядок слов при сохранении усиленного категорического отказа. Сноска сокращена до действительно релевантной лексической альтернативы.
