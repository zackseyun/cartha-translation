  - severity: medium
    issue: 'В главной строке οὐκ ἔχεις передано будущим временем: «не будет у тебя».'
    rationale: В греческом стоит настоящее ἔχεις. Русское «у тебя нет части со Мной» и естественно в данной условной конструкции, и ближе к исходной временной форме.
  - severity: low
    issue: Сноска заявляет «аспектуально-временную неоднозначность» и предлагает будущее время как вариант.
    rationale: Лексическая вариативность μέρος («часть», «доля») обоснована, но настоящее ἔχεις не создаёт текстологически значимой временной неоднозначности, которую следовало бы выносить в сноску.
