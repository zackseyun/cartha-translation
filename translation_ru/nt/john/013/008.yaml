  text: λέγει αὐτῷ Πέτρος· Οὐ μὴ νίψῃς ⸂μου τοὺς πόδας⸃ εἰς τὸν αἰῶνα. ἀπεκρίθη ⸂Ἰησοῦς αὐτῷ⸃· Ἐὰν μὴ νίψω σε, οὐκ ἔχεις μέρος μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/008.yaml
  text: Peter said to him[a], “You will never wash my feet.” Jesus answered him, “If I do not wash you, you have no share with me.”
translation:
  language: ru
  text: 'Пётр сказал Ему: «Ты никогда не будешь мыть мне ноги!» Иисус ответил ему: «Если Я не омою тебя, у тебя нет части со Мной».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у тебя нет доли со Мной».'
    reason: 'Лексическая альтернатива: μέρος может означать «часть» или «долю»; оба варианта сохраняют широкое значение участия или принадлежности без богословской конкретизации.'
lexical_decisions:
- source_word: Οὐ μὴ νίψῃς … εἰς τὸν αἰῶνα
  choice: Не будешь ты … вовек
  rationale: Сочетание οὐ μή с аористом сослагательного наклонения и оборотом εἰς τὸν αἰῶνα выражает решительный отказ. «Вовек» естественно и с достоинством передаёт усиленное «никогда», а вынесенное местоимение подчёркивает категоричность Петра.
- source_word: μου τοὺς πόδας
  choice: мне ноги
  rationale: По-русски при обозначении частей тела естественна конструкция с дательным местоимением; смысл греческого притяжательного μου («мои ноги») сохранён.
- source_word: ἀπεκρίθη
  choice: ответил
  rationale: Обычный повествовательный эквивалент глагола ответа, соответствующий контексту прямой речи.
- source_word: Ἐὰν μὴ νίψω σε
  choice: Если Я не омою тебя
  rationale: Сохраняется явная условная конструкция греческого текста. «Омою» отличает более широкий ответ Иисуса о самом Петре от предыдущего конкретного упоминания мытья ног, не добавляя идеи полного очищения.
- source_word: νίψῃς / νίψω
  choice: мыть / омою
  rationale: Глагол νίπτω обозначает мытьё, часто части тела. В первой реплике естественно «мыть ноги»; в ответе литературное «омою тебя» сохраняет тот же образ и переход от ног к личности Петра.
- source_word: οὐκ ἔχεις μέρος
  choice: не будет у тебя части
  rationale: μέρος может означать часть, долю или участие. «Не будет у тебя части» сохраняет метафорическую широту и не сводит высказывание к заранее определённому богословскому механизму.
- source_word: μετ’ ἐμοῦ
  choice: со Мной
  rationale: μετά с родительным падежом означает совместность или связь — «со Мной»; перевод «во Мне» внёс бы отсутствующую здесь формулировку.
theological_decisions:
- issue: Смысл выражения μέρος μετ’ ἐμοῦ
  choice: «не будет у тебя части со Мной» — широкое обозначение принадлежности, участия или общения с Иисусом
  alternative: «у тебя нет участия во Мне» либо конкретизация как исключительно сакраментального, сотериологического или этического утверждения
  rationale: Греческий текст утверждает необходимость омовения Иисусом, но не определяет здесь точный богословский механизм. Перевод сохраняет напряжение и не навязывает узкого толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной евангельской интонацией. «Вовек» передаёт категоричность отказа без тяжеловесности; «омою» уместно в торжественной речи Иисуса. Прописные местоимения при обращении к Иисусу применены как русская издательская конвенция, не как толковательное добавление.
