lexical_decisions:
- source_word: ἀνακείμενος
  choice: возлежал
  rationale: Глагольная форма описывает принятую в древности позу за трапезой. «Возлежал» точно передаёт историческую обстановку и сохраняет достоинство повествования.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: один из Его учеников
  rationale: Прямой и естественный перевод греческой партитивной конструкции.
- source_word: ἐν τῷ κόλπῳ τοῦ Ἰησοῦ
  choice: рядом с Иисусом
  rationale: В контексте трапезы выражение указывает на место ученика непосредственно возле Иисуса. Такой перевод понятен современному читателю и не создаёт ошибочного впечатления, будто ученик лежал у Иисуса на коленях; буквальный образ сохранён в сноске.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: тот, которого любил Иисус
  rationale: Передаёт относительное придаточное прямо и естественно, сохраняя обычное значение глагола ἀγαπάω — «любить».
theological_decisions:
- issue: Положение любимого ученика относительно Иисуса
  choice: Передать застольное выражение как «рядом с Иисусом», сохранив буквальную форму в сноске.
  alternative: «у груди Иисуса»
  rationale: В данном контексте выражение прежде всего описывает расположение возлежавших за трапезой, хотя буквальный образ может иметь внутритекстовый отклик на Ин. 1:18. Основной текст не должен ни превращать пространственное описание в отдельное мистическое утверждение, ни скрывать его буквальную форму.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Возлежал» сохранено как точный историко-культурный термин; тире естественно выделяют пояснение о любимом ученике.
