  text: καὶ δείπνου ⸀γινομένου, τοῦ διαβόλου ἤδη βεβληκότος εἰς τὴν καρδίαν ⸂ἵνα παραδοῖ αὐτὸν Ἰούδας Σίμωνος ⸀Ἰσκαριώτου⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/002.yaml
  text: And during supper[a], when the devil had already put it into the heart of Judas Iscariot, Simon's son, to betray him[c][b],
translation:
  language: ru
  text: И во время ужина[a], когда дьявол уже вложил Иуде Искариоту, сыну Симона, в сердце мысль предать Его[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда шёл ужин». Греческий текст не означает, что ужин уже закончился.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «уже бросил (это) в сердце»; по смыслу также возможно: «уже побудил».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «выдать Его» или «передать Его». В данном контексте выражение означает предательство. Греческое именование допускает и перевод: «Иуде, сыну Симона Искариота».'
    reason: alternative_reading
lexical_decisions:
- source_word: δείπνου γινομένου
  choice: во время ужина
  rationale: 'Родительный самостоятельный оборот обозначает одновременное обстоятельство: ужин продолжался, а не уже закончился.'
- source_word: διάβολος
  choice: дьявол
  rationale: В повествовании Иоанна речь идёт о личностном злом существе; традиционное наименование ясно передаёт референта.
- source_word: ἤδη βεβληκότος εἰς τὴν καρδίαν
  choice: уже вложил в сердце
  rationale: Сохранена греческая метафора внедрения намерения и значение предшествования, выраженное перфектным причастием в составе оборота.
- source_word: ἵνα παραδοῖ
  choice: предать
  rationale: В контексте поступка Иуды глагол παραδίδωμι имеет силу «предать», хотя буквально означает также «выдать, передать».
- source_word: Ἰούδας Σίμωνος Ἰσκαριώτου
  choice: Иуде Искариоту, сыну Симона
  rationale: Такое построение естественно по-русски и, в соответствии с ближайшим контекстом и Иоанна 6:71, относит обозначение «Искариот» к Иуде, не создавая впечатления, будто оно непременно относится к Симону.
theological_decisions:
- issue: Соотношение дьявольского воздействия и ответственности Иуды
  choice: дьявол «вложил в сердце» Иуде намерение предать Иисуса
  alternative: дьявол уже побудил Иуду / действовал через Иуду
  rationale: Формулировка сохраняет приписанное дьяволу воздействие, но не устраняет личного действия и ответственности Иуды; вопрос о детерминизме текстом не разрешается.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейского повествования. «Ужин» понятнее обычному читателю, чем архаичное «вечеря». Местоимение «Его» написано с прописной буквы согласно распространённой русской библейской издательской норме.
