  text: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα εἰδὼς ὁ Ἰησοῦς ὅτι ⸀ἦλθεν αὐτοῦ ἡ ὥρα ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ εἰς τέλος ἠγάπησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/001.yaml
  text: Before the Feast of the Passover[a], Jesus, knowing that his hour had come to depart from this world to the Father, having loved his own who were in the world[b], loved them to the end.
translation:
  language: ru
  text: Перед праздником Пасхи Иисус, зная, что настал Его час перейти из этого мира к Отцу, возлюбив Своих, находившихся в мире, возлюбил их до конца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в полной мере», «совершенно». Греческое выражение может означать как любовь до самого последнего момента, так и любовь во всей её полноте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα
  choice: Перед праздником Пасхи
  rationale: Πρό с родительным падежом обозначает время — «перед, до»; δέ служит мягкой связкой и не требует отдельного русского слова. Сочетание «праздник Пасхи» ясно передаёт ἑορτή и πάσχα.
- source_word: εἰδὼς
  choice: зная
  rationale: Причастие выражает осознанное знание Иисуса, сопутствующее основному действию; русский деепричастный оборот естественно сохраняет эту связь.
- source_word: ἦλθεν αὐτοῦ ἡ ὥρα
  choice: настал Его час
  rationale: Сохраняется характерный для Иоанна образ «часа» как назначенного решающего времени, без замены его более узким толкованием.
- source_word: ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα
  choice: перейти из этого мира к Отцу
  rationale: «Перейти» передаёт перемену сферы и направление движения, не сводя выражение только к смерти; «к Отцу» сохраняет формулировку источника.
- source_word: ἀγαπήσας
  choice: возлюбив
  rationale: Форма передаёт предшествующую или обобщающую любовь Иисуса к Своим и сохраняет повтор корня ἀγαπάω в кульминационной части стиха.
- source_word: τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ
  choice: Своих, находившихся в мире
  rationale: «Своих» сохраняет намеренно широкое и личностное обозначение, не сужая его до «учеников»; определительный оборот передаёт их пребывание в мире.
- source_word: εἰς τέλος
  choice: до конца
  rationale: Буквальная и естественная русская формулировка сохраняет возможные временной и качественный оттенки; неоднозначность поясняется в сноске.
- source_word: ἠγάπησεν αὐτούς
  choice: любил их
  rationale: Простая глагольная форма сохраняет прямое значение ἀγαπάω. Несовершенный вид по-русски естественно сочетается с «до конца» и передаёт неослабевающую любовь, не добавляя отдельного действия показа любви.
theological_decisions:
- issue: Значение εἰς τέλος в утверждении о любви Иисуса
  choice: до конца
  alternative: в полной мере; совершенно
  rationale: Греческое выражение допускает как временной смысл — любовь до самого конца, так и качественный — любовь во всей полноте. Основной текст не устраняет эту богословски значимую многозначность, а сноска прямо её отмечает.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Заглавные местоименные формы «Его», «Своих» следуют принятому русскому религиозно-литературному регистру; синтаксис по возможности сохраняет последовательность греческих причастных конструкций.
