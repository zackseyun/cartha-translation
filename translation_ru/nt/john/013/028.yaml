  text: τοῦτο δὲ οὐδεὶς ἔγνω τῶν ἀνακειμένων πρὸς τί εἶπεν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/028.yaml
  text: But none of those reclining at the table knew why he said this to him[a].
translation:
  language: ru
  text: Но никто из возлежавших за столом не понял, для чего Он сказал ему это.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зачем Он сказал ему это».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: это
  rationale: Указательное местоимение отсылает к предшествующим словам Иисуса; русское «это» сохраняет указательную силу и естественно занимает позицию дополнения.
- source_word: δὲ
  choice: Но
  rationale: 'Частица обозначает лёгкое противопоставление: Иисус обратился к Иуде, но остальные не поняли цели Его слов.'
- source_word: οὐδεὶς
  choice: никто
  rationale: Передаёт полное отрицание и естественно сочетается с партитивной конструкцией «из возлежавших».
- source_word: ἔγνω
  choice: не понял
  rationale: В данном контексте γινώσκω означает не просто обладание знанием, а осмысление цели сказанного; «не понял» естественно передаёт этот смысл.
- source_word: τῶν ἀνακειμένων
  choice: из возлежавших за столом
  rationale: Глагол описывает принятую в древности позу участников трапезы. Добавление «за столом» ясно обозначает контекст трапезы для современного читателя.
- source_word: πρὸς τί
  choice: для чего
  rationale: Оборот выражает цель или намерение. «Для чего» сохраняет целевую направленность точнее, чем более широкое «почему».
- source_word: εἶπεν αὐτῷ
  choice: Он сказал ему это
  rationale: Конструкция естественно передаётся как «сказал ему»; «это» соответствует вынесенному в начало τοῦτο. Прописная буква в местоимении обозначает Иисуса по принятой русской библейской издательской традиции, не меняя смысла текста.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением исторической детали «возлежавших». Формулировка «для чего» передаёт целевой оттенок πρὸς τί и остаётся понятной обычному читателю.
