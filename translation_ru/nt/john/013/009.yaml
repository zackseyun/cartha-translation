  text: λέγει αὐτῷ Σίμων Πέτρος· Κύριε, μὴ τοὺς πόδας μου μόνον ἀλλὰ καὶ τὰς χεῖρας καὶ τὴν κεφαλήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/009.yaml
  text: Simon Peter says to him[a], “Lord, not only my feet, but also my hands and my head.”
translation:
  language: ru
  text: 'Симон Пётр говорит Ему: «Господи[a], не только мои ноги, но и руки, и голову!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Учитель». Греч. кю́риос.'
    reason: 'Лексическая альтернатива: κύριος может быть уважительным обращением; «Господи» сохраняет также более широкий титульный смысл в Евангелии от Иоанна.'
lexical_decisions:
- source_word: λέγει
  choice: говорит
  rationale: Сохранено историческое настоящее греческого повествования, естественное и выразительное по-русски.
- source_word: αὐτῷ
  choice: Ему
  rationale: Местоимение передано напрямую; прописная буква по русской библейской издательской традиции указывает на Иисуса, ясно названного в контексте.
- source_word: Σίμων Πέτρος
  choice: Симон Пётр
  rationale: Использована устоявшаяся русская форма имени.
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма естественно передаёт обращение κύριε и сохраняет как уважительное, так и богословское звучание титула.
- source_word: μὴ τοὺς πόδας μου μόνον ἀλλὰ καὶ
  choice: не только мои ноги, но и
  rationale: 'Конструкция передаёт контрастное расширение: не одни ноги, а также другие части тела.'
- source_word: τὰς χεῖρας καὶ τὴν κεφαλήν
  choice: руки, и голову
  rationale: Притяжательное значение «мои» естественно распространяется с первого однородного члена на остальные; повторять местоимение по-русски необязательно.
- source_word: подразумеваемое действие в эллиптической реплике
  choice: омой
  rationale: 'В греческом ответ эллиптичен: действие восстанавливается из непосредственного контекста омовения ног. В русском его добавление делает реплику грамматически полной и однозначно связывает перечисление с просьбой Петра.'
theological_decisions:
- issue: Передача κύριος при обращении к Иисусу
  choice: Господь / Господи
  alternative: Учитель
  rationale: «Господи» — обычное соответствие κύριε, сохраняющее присущую Евангелию от Иоанна смысловую насыщенность и не сводящее титул только к роли учителя.
- issue: Подразумеваемое действие просьбы Петра
  choice: явно добавить «омой»
  alternative: 'сохранить эллипсис: «не только мои ноги, но и руки, и голову»'
  rationale: Добавление не вносит нового действия, а эксплицирует действие, заданное ближайшим контекстом; это обеспечивает естественность современной русской речи.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Историческое настоящее сохранено. Реплика передана естественно, с экспликацией подразумеваемого из контекста глагола «омой».
