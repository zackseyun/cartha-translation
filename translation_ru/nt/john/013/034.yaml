  naturalness: 'Формулировка «Новую заповедь даю вам: любите друг друга. Как Я возлюбил вас, так и вы любите друг друга» литературна, ясна и соответствует возвышенному, но современно воспринимаемому регистру. Сноска, однако, предлагает неполную и по-русски неудачную альтернативную конструкцию.'
