  text: ἐντολὴν καινὴν δίδωμι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους, καθὼς ἠγάπησα ὑμᾶς ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/034.yaml
  text: 'A new commandment I give to you: that you love one another[a]. Just as I loved you[b], you also are to love one another.'
translation:
  language: ru
  text: 'Новую заповедь даю вам: любите друг друга. Как Я возлюбил вас, так и вы любите друг друга.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντολὴν καινὴν
  choice: новую заповедь
  rationale: «Заповедь» естественно передаёт формальную нравственную силу ἐντολή в контексте Иоанна; «новую» сохраняет неуточнённую новизну καινός.
- source_word: δίδωμι ὑμῖν
  choice: даю вам
  rationale: Настоящее время и дательный адресата переданы прямо и торжественно.
- source_word: ἵνα ἀγαπᾶτε ἀλλήλους
  choice: любите друг друга
  rationale: После «даю заповедь» оборот с ἵνα выражает содержание заповеди; русская форма повелительного наклонения естественно передаёт её побудительную силу.
- source_word: καθὼς ἠγάπησα ὑμᾶς
  choice: как Я возлюбил вас
  rationale: «Как» сохраняет сопоставление, а прошедшее совершенного вида передаёт аорист и уже явленную любовь Иисуса.
- source_word: ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους
  choice: так и вы любите друг друга
  rationale: «Так и вы» передаёт акцент καὶ ὑμεῖς и естественно связывает любовь учеников с любовью Иисуса как её образцом; повтор глагола сохранён.
theological_decisions:
- issue: В чём состоит новизна заповеди
  choice: Оставить просто «новую заповедь», не поясняя характер новизны
  alternative: «обновлённую заповедь» или пояснение новизны во Христе
  rationale: Сам стих называет заповедь новой, но не определяет, нова ли она по времени, качеству или осуществлению; перевод не должен устранять эту смысловую открытость.
- issue: Связь второй конструкции ἵνα с предыдущей фразой
  choice: «так и вы любите друг друга»
  alternative: «чтобы и вы любили друг друга»
  rationale: Основной текст естественно передаёт увещевательную силу и параллель с любовью Иисуса, а сноска сохраняет возможное более формальное прочтение конструкции цели или результата.
translation_notes:
  register: Современный литературный русский язык с достоинством прощальной речи. Заглавное «Я» употреблено как традиционное типографическое обозначение речи Иисуса, без добавления толкования. Лексический повтор «любить» и «друг друга» сохранён.
