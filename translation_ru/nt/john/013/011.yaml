  text: ᾔδει γὰρ τὸν παραδιδόντα αὐτόν· διὰ τοῦτο εἶπεν ⸀ὅτι Οὐχὶ πάντες καθαροί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/011.yaml
  text: For he knew the one who was betraying him; for this reason he said[a], “Not all of you are clean.”
translation:
  language: ru
  text: 'Ведь Он знал того, кто предавал Его; поэтому сказал[a]: «Не все вы чисты».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «того, кто выдавал Его». В данном контексте речь идёт о предательстве Иуды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: Он знал
  rationale: Плюсквамперфектная форма οἶδα здесь обозначает имевшееся у Иисуса знание; в русском повествовании естественно простое прошедшее время «знал».
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит пояснение к предыдущему утверждению; «ведь» ясно и естественно передаёт эту связь.
- source_word: τὸν παραδιδόντα αὐτόν
  choice: того, кто предавал Его
  rationale: Причастие настоящего времени характеризует человека через совершаемое им действие. В контексте Страстей παραδίδωμι означает предательскую выдачу Иисуса; «предавал» передаёт контекстуальный смысл, тогда как буквальное «выдавал» сохранено в примечании.
- source_word: διὰ τοῦτο
  choice: поэтому
  rationale: Передаёт прямую причинно-следственную связь между знанием Иисуса и Его словами.
- source_word: εἶπεν ὅτι
  choice: 'сказал:'
  rationale: ὅτι вводит прямую речь, что по-русски естественно выражается двоеточием и кавычками.
- source_word: Οὐχὶ πάντες καθαροί ἐστε
  choice: Не все вы чисты
  rationale: Такой порядок слов естественен для русского языка, сохраняет обращённость ко множеству учеников и оставляет у «чисты» телесно-духовную многозначность контекста омовения.
theological_decisions:
- issue: Значение παραδιδόντα применительно к Иуде
  choice: предавал
  alternative: выдавал
  rationale: «Предавал» ясно выражает смысл действия Иуды в данном повествовании, не добавляя доктринальных деталей; более буквальная возможность отмечена в сноске.
- issue: Значение καθαροί в речи об омовении
  choice: чисты
  alternative: непорочны
  rationale: «Чисты» сохраняет намеренное взаимодействие образа телесного омовения с духовно-нравственным смыслом; «непорочны» неоправданно устранило бы первый план.
translation_notes:
  register: Современный литературный русский язык; тон сдержанный и достойный. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской традиции. Союзно-частичная связка «Ведь… поэтому и…» естественно передаёт обе логические связи греческого текста без тяжеловесного повтора.
