  text: ⸀ἔβλεπον εἰς ἀλλήλους οἱ μαθηταὶ ἀπορούμενοι περὶ τίνος λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/022.yaml
  text: The disciples were looking at one another, at a loss about whom he was speaking.
translation:
  language: ru
  text: Ученики смотрели друг на друга, недоумевая, о ком Он говорит.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ученики продолжали смотреть друг на друга, не понимая, о ком Он говорит».'
    reason: 'Лексико-видовой вариант: «продолжали смотреть» явнее выражает длительность имперфекта, а «не понимая» — смысл растерянности, переданный словом ἀπορούμενοι.'
lexical_decisions:
- source_word: ἔβλεπον
  choice: смотрели
  rationale: Имперфект изображает продолжающееся в тот момент действие; русское несовершенное прошедшее естественно передаёт этот видовой оттенок.
- source_word: εἰς ἀλλήλους
  choice: друг на друга
  rationale: Устойчивое и естественное русское выражение взаимно направленного взгляда.
- source_word: οἱ μαθηταὶ
  choice: ученики
  rationale: Артикль указывает на уже известных из контекста учеников; добавление «Его» не требуется и отсутствует в греческом тексте.
- source_word: ἀπορούμενοι
  choice: недоумевая
  rationale: Деепричастие сохраняет сопутствующее основному действию состояние растерянности и неуверенности.
- source_word: περὶ τίνος
  choice: о ком
  rationale: Точно и естественно передаёт вопрос о лице после περί с родительным падежом.
- source_word: λέγει
  choice: Он говорит
  rationale: Историческое настоящее сохранено как настоящее время, что возможно и естественно в русском косвенном вопросе и удерживает временную форму оригинала.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с естественным повествовательным ритмом. Местоимение «Он» написано с прописной буквы согласно принятому в русском библейском стиле уважительному употреблению; это графическое решение не добавляет в текст нового референта.
