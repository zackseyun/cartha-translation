lexical_decisions:
- source_word: εἰδὼς
  choice: зная
  rationale: Причастие передаёт обстоятельственный фон для следующего действия Иисуса; «зная» естественно по-русски и не переопределяет временной оттенок формы.
- source_word: πάντα
  choice: всё
  rationale: Средний род множественного числа имеет всеохватный смысл; русское «всё» передаёт его естественно и без ненужной тяжеловесности.
- source_word: ἔδωκεν
  choice: отдал
  rationale: В сочетании «отдал всё в его руки» глагол выражает завершённую передачу власти или распоряжения, сохраняя конкретный образ исходного текста.
- source_word: εἰς τὰς χεῖρας
  choice: в его руки
  rationale: Сохранён ясный и естественный для русского языка образ передачи власти и полномочий.
- source_word: ὁ πατὴρ
  choice: Отец
  rationale: Передан именно титул «Отец», без добавления отсутствующего в греческом притяжательного местоимения.
- source_word: ἀπὸ θεοῦ
  choice: от Бога
  rationale: Перевод сохраняет слово «Бог», а не заменяет его словом «Отец», и точно передаёт указание на происхождение.
- source_word: ἐξῆλθεν
  choice: пришёл
  rationale: В данном контексте глагол указывает на происхождение и приход; «пришёл» звучит естественно, тогда как «вышел» сохраняется как допустимая более буквальная альтернатива в сноске.
- source_word: πρὸς τὸν θεὸν
  choice: к Богу
  rationale: Предлог πρός при глаголе движения естественно передаётся направлением «к Богу», не добавляя прямо не выраженного «обратно».
- source_word: ὑπάγει
  choice: идёт
  rationale: Настоящее время сохранено; «идёт» передаёт предстоящий уход Иисуса без добавления толкования.
theological_decisions:
- issue: Язык происхождения Христа в ἀπὸ θεοῦ ἐξῆλθεν
  choice: он пришёл от Бога
  alternative: он вышел от Бога
  rationale: Основной текст естественно выражает происхождение и миссию Иисуса, не ослабляя формулу «от Бога»; более буквальное «вышел» отмечено как возможное, чтобы сохранить богословскую насыщенность и лексическую неоднозначность.
- issue: Направление в πρὸς τὸν θεὸν ὑπάγει
  choice: идёт к Богу
  alternative: возвращается к Богу
  rationale: Контекст допускает смысл возвращения, однако слово «обратно» в самой фразе отсутствует. Поэтому основной перевод не делает этот вывод явным.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Сохранена незавершённая синтаксическая конструкция стиха, продолжающаяся в Ин. 13:4. Местоимения, относящиеся к Иисусу, даны со строчной буквы как обычная современная орфографическая норма; титулы «Отец» и «Бог» — с прописной.
