lexical_decisions:
- source_word: εἶτα
  choice: Затем
  rationale: Передаёт последовательность действий в повествовании естественным современным русским языком.
- source_word: βάλλει ὕδωρ
  choice: наливает воду
  rationale: Хотя βάλλω имеет широкое значение «класть, бросать», в сочетании с водой и сосудом по-русски естественно «наливать».
- source_word: εἰς τὸν νιπτῆρα
  choice: в умывальницу
  rationale: νιπτήρ обозначает сосуд для умывания; «умывальница» точно передаёт назначение предмета и сохраняет достоинство стиля.
- source_word: ἤρξατο νίπτειν
  choice: начинает мыть
  rationale: Сохраняет начинательное значение ἤρξατο и согласуется с историческим настоящим βάλλει; единый русский презенс делает повествование естественным.
- source_word: τοὺς πόδας τῶν μαθητῶν
  choice: ноги ученикам
  rationale: Дательный принадлежности при частях тела естественен для русского языка и точно передаёт отношение греческого родительного.
- source_word: ἐκμάσσειν
  choice: вытирать их
  rationale: Передаёт действие вытирания или обсушивания; местоимение явно относится к ногам.
- source_word: τῷ λεντίῳ
  choice: полотенцем
  rationale: Контекстуально ясный и общеупотребительный эквивалент названия ткани для вытирания.
- source_word: ᾧ ἦν διεζωσμένος
  choice: которым был опоясан
  rationale: Формально и кратко передаёт состояние, выраженное перифрастической конструкцией, не добавляя отсутствующего в тексте объяснения.
