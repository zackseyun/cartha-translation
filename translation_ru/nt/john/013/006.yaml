id: JHN.13.6
reference: John 13:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἔρχεται οὖν πρὸς Σίμωνα Πέτρον. ⸀λέγει ⸀αὐτῷ· Κύριε, σύ μου νίπτεις τοὺς πόδας;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/006.yaml
  text: So he comes to Simon Peter. He says to him[a], “Lord, are you washing my feet?”
translation:
  language: ru
  text: 'Итак, Он подходит к Симону Петру. Пётр говорит Ему: «Господи[a], Ты моешь мне ноги?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господин». Греческое κύριε могло служить почтительным обращением, хотя здесь в основном тексте сохранено «Господи».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: подходит
  rationale: Настоящее историческое сохранено ради живости повествования; глагол передаёт движение Иисуса к Петру и естественно звучит в данной сцене.
- source_word: οὖν
  choice: итак
  rationale: Передаёт переход к следующему моменту повествования и связь с предыдущим описанием омовения ног.
- source_word: πρὸς Σίμωνα Πέτρον
  choice: к Симону Петру
  rationale: Предлог πρός с винительным обозначает направленное движение к человеку.
- source_word: λέγει αὐτῷ
  choice: Пётр говорит Ему
  rationale: 'Настоящее историческое сохранено. Имя Петра повторено для ясности русского текста: по контексту именно он обращается к подошедшему Иисусу; местоимение αὐτῷ передано как «Ему».'
- source_word: Κύριε
  choice: Господи
  rationale: Обычное обращение к Иисусу как к Господу сохраняет уважительный и возможный христологический смысл; более общее значение уважительного обращения отмечено в сноске.
- source_word: σύ
  choice: Ты
  rationale: Явно выраженное греческое местоимение несёт эмфатическое ударение; русское «Ты» естественно сохраняет изумление Петра.
- source_word: μου
  choice: мне
  rationale: При русском глаголе «мыть» конструкция «мыть мне ноги» естественно выражает принадлежность и отражает греческий родительный местоимения.
- source_word: νίπτεις
  choice: моешь
  rationale: Глагол обозначает омовение части тела; настоящее время соответствует происходящему действию и вопросу Петра.
- source_word: τοὺς πόδας
  choice: ноги
  rationale: Русская конструкция «моешь мне ноги» естественно передаёт определённые по контексту ноги Петра без отдельного притяжательного местоимения.
theological_decisions:
- issue: Передача κύριος в обращении Петра к Иисусу
  choice: Господи
  alternative: господин
  rationale: «Господи» сохраняет основное новозаветное обозначение Иисуса и христологический оттенок Евангелия от Иоанна, не исключая того, что форма обращения в данном контексте могла также выражать почтительное «господин»; эта возможность вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Историческое настоящее оригинала сохранено. Заглавные буквы в местоимениях «Он», «Ему», «Ты» следуют принятой русской традиции уважительного обозначения Иисуса; синтаксис при этом остаётся естественным и понятным.
