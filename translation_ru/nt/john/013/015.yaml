  source_fidelity: 'Перевод точно передаёт структуру греческого текста: γάρ как объяснение («Ведь»), ὑπόδειγμα как «пример», целевое ἵνα («чтобы»), сопоставление καθὼς («так же, как») и включение учеников καὶ ὑμεῖς («и вы»). «Я поступил с вами» — жизнеспособная нейтральная передача широкого ποιέω с ὑμῖν; она не навязывает более узкий благотворный оттенок «для вас».'
