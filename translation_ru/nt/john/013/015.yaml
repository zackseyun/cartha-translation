id: JHN.13.15
reference: John 13:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὑπόδειγμα γὰρ ἔδωκα ὑμῖν ἵνα καθὼς ἐγὼ ἐποίησα ὑμῖν καὶ ὑμεῖς ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/015.yaml
  text: For I have given you an example[a], so that just as I have done to you[c][b], you also may do.
translation:
  language: ru
  text: Ведь Я дал вам пример[a], чтобы и вы поступали так же, как Я поступил с вами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «образец».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα
  choice: пример
  rationale: Слово обозначает пример или образец, предлагаемый для подражания; «пример» естественно и точно звучит в современном русском контексте.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит объяснение предшествующего действия и наставления; «ведь» естественно передаёт эту связь по-русски.
- source_word: ἔδωκα
  choice: дал
  rationale: Простой прошедший вид прямо передаёт греческий аорист; сохраняющаяся значимость действия ясна из цели, выраженной далее.
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт целевое значение греческого союза ясно и естественно.
- source_word: καθὼς
  choice: так же, как
  rationale: Явно выражает соответствие между поступком Иисуса и ожидаемым поступком учеников.
- source_word: ἐποίησα ὑμῖν
  choice: Я поступил с вами
  rationale: «Поступить с кем-либо» естественно передаёт широкое ποιέω с дательным лиц и не добавляет однозначно благотворного смысла «для вас», отсутствующего в самой форме.
- source_word: καὶ ὑμεῖς
  choice: и вы
  rationale: Сохраняет добавочное и эмфатическое включение учеников.
- source_word: ποιῆτε
  choice: поступали
  rationale: Несовершенный вид естественно выражает предполагаемое соответствующее действие после целевого «чтобы», не превращая фразу в прямое повеление.
theological_decisions:
- issue: Характер подражания поступку Иисуса
  choice: Передать поступок Иисуса как пример, которому ученики должны следовать, не уточняя, предписан ли здесь обязательный обряд омовения ног или более широкий образ служения.
  alternative: Истолковать слова либо как прямое установление всеобщего обряда омовения ног, либо лишь как отвлечённый символ без конкретной силы примера.
  rationale: Текст прямо связывает действие Иисуса с последующим соответствующим действием учеников, но сам по себе не разрешает конфессиональный вопрос о форме и сфере исполнения.
- issue: Значение дательного ὑμῖν
  choice: «с вами»
  alternative: «для вас»
  rationale: Дательный допускает контекстуальный оттенок пользы, однако нейтральное «с вами» ближе сохраняет неоднозначность конструкции и не навязывает благотворное истолкование.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и достойная по тону. Порядок слов слегка перестроен ради естественного русского синтаксиса, при этом причинная связь, цель и сопоставление сохранены.
