  text: ἀμὴν ἀμὴν λέγω ὑμῖν, οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ οὐδὲ ἀπόστολος μείζων τοῦ πέμψαντος αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/016.yaml
  text: Truly[a], truly, I say to you, a servant is not greater than his master[c][b], nor is an apostle greater than the one who sent him.
translation:
  language: ru
  text: 'Истинно, истинно говорю вам: раб не больше своего господина, и посланник[a] не больше пославшего его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «апостол». Греческое слово означает человека, которого послали с поручением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Истинно, истинно
  rationale: Сохраняет характерное для Евангелия от Иоанна торжественное удвоение и передаёт его усилительное значение естественным литературным русским языком.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Близко передаёт настоящее время и устойчивую речевую формулу, не утяжеляя русский текст.
- source_word: δοῦλος
  choice: раб
  rationale: В сопоставлении с господином важна зависимость и подчинённое положение; «раб» точнее сохраняет силу греческого слова, чем более мягкое «слуга».
- source_word: μείζων
  choice: больше
  rationale: Передаёт превосходство в положении или ранге и естественно звучит в обеих параллельных частях изречения.
- source_word: κύριος
  choice: господин
  rationale: Здесь слово обозначает господина раба в социальной паре δοῦλος/κύριος, а не обязательно титул «Господь».
- source_word: ἀπόστολος
  choice: посланник
  rationale: В данном параллелизме акцент сделан на отношении посланного к пославшему. «Посланник» прозрачно передаёт обычное значение слова и не сужает его до позднейшего титульного употребления.
- source_word: τοῦ πέμψαντος αὐτόν
  choice: пославшего его
  rationale: Естественно и точно передаёт субстантивированное причастие и сохраняет явную связь с «посланником».
theological_decisions:
- issue: Значение κύριος в сравнении
  choice: господин
  alternative: Господь
  rationale: Непосредственный контекст строит социальную аналогию «раб — господин»; титульное прочтение возможно как контекстуальный отзвук, но грамматика изречения его не требует.
- issue: Передача ἀπόστολος
  choice: посланник
  alternative: апостол
  rationale: Смысл порученного и отправленного человека здесь прямо раскрывается словами «пославшего его». «Посланник» сохраняет этот общий смысл, не исключая возможной связи с апостольским служением.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Сохранены повтор «истинно, истинно» и параллельное построение двух частей. «Раб» и «господин» передают выраженную в оригинале иерархию без смягчения.
