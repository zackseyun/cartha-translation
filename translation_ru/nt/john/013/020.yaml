source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ λαμβάνων ⸀ἄν τινα πέμψω ἐμὲ λαμβάνει, ὁ δὲ ἐμὲ λαμβάνων λαμβάνει τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/020.yaml
  text: Truly[a], truly, I say to you, whoever receives anyone I send receives me[b], and whoever receives me receives the one who sent me.
translation:
  language: ru
  text: 'Истинно, истинно говорю вам: кто принимает того, кого Я пошлю, тот принимает Меня; а кто принимает Меня, принимает Пославшего Меня.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В контексте Евангелия от Иоанна «Пославший Меня» — Отец.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Истинно, истинно
  rationale: Сохраняет удвоенную торжественную формулу Иисуса и передаёт её смысл понятным современным русским языком.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямо и естественно передаёт устойчивую речевую формулу Евангелия от Иоанна.
- source_word: ὁ λαμβάνων ἄν τινα πέμψω
  choice: кто принимает того, кого Я пошлю
  rationale: Конструкция с ἄν, неопределённым местоимением τινα и сослагательным πέμψω имеет обобщённо-неопределённый смысл. Русская конструкция «кто… того, кого…» естественно передаёт любого посланного Иисусом, не ограничивая высказывание мужчиной.
- source_word: λαμβάνει
  choice: принимает
  rationale: Сохраняет повтор одного и того же глагола и тем самым подчёркивает последовательную связь между посланным, Иисусом и Пославшим Его. «Принимает» здесь допускает значения принятия, признания и радушного приёма, не сужая смысл до гостеприимства.
- source_word: ὁ δὲ ἐμὲ λαμβάνων
  choice: а кто принимает Меня
  rationale: Частица δέ здесь продолжает параллельное высказывание с лёгким переходом; русское «а» естественно связывает две части, не создавая сильного противопоставления.
- source_word: τὸν πέμψαντά με
  choice: Пославшего Меня
  rationale: Субстантивированное причастие передаёт обозначение Бога через Его действие — Он послал Иисуса. Такая формулировка сохраняет лаконичность и не добавляет в основной текст отсутствующее здесь слово «Отец».
theological_decisions:
- issue: Кого обозначает выражение «Пославшего Меня»
  choice: Сохранено выражение «Пославшего Меня»; в сноске указано, что в контексте Евангелия речь идёт об Отце.
  alternative: «Отца, пославшего Меня»
  rationale: В богословии и контексте Евангелия от Иоанна Пославший — Отец, однако в самом стихе слово «Отец» отсутствует. Перевод сохраняет образную и реляционную формулировку оригинала, не подменяя её пояснением.
- issue: Обобщённый смысл причастия ὁ λαμβάνων
  choice: «кто принимает»
  alternative: «принимающий» или «тот, кто принимает»
  rationale: Мужской род греческого причастия имеет здесь общий, а не исключительно мужской смысл. Русское «кто» точно и естественно передаёт эту обобщённость.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Прописные буквы в местоимениях и причастном именовании, относящихся к Иисусу и Отцу, соответствуют принятому русскому библейскому регистру. Повтор «принимает» намеренно сохранён как смысловой каркас стиха.
