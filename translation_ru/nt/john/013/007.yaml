  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὃ ἐγὼ ποιῶ σὺ οὐκ οἶδας ἄρτι, γνώσῃ δὲ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/007.yaml
  text: Jesus answered and said to him[a], “What I am doing you do not know now[b], but you will understand after these things.”
translation:
  language: ru
  text: 'Иисус сказал ему в ответ: «Того, что Я делаю, ты сейчас не знаешь, но поймёшь после этого».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «после этих вещей». Это может относиться как к дальнейшему ходу этой сцены, так и к более поздним событиям, которые прояснят смысл поступка Иисуса.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Иисус сказал ему в ответ
  rationale: Естественная русская повествовательная формула передаёт оба греческих глагола ответа и речи без тяжеловесного буквального «ответил и сказал ему».
- source_word: Ὃ ἐγὼ ποιῶ
  choice: Того, что Я делаю
  rationale: Передаёт относительную конструкцию и настоящее действие Иисуса; местоимение ἐγώ отражено явным «Я».
- source_word: σὺ οὐκ οἶδας ἄρτι
  choice: ты сейчас не знаешь
  rationale: Сохраняет прямое значение οἶδα «знать», временное ἄρτι и подчёркнутое σὺ посредством явного «ты».
- source_word: γνώσῃ δὲ
  choice: но поймёшь
  rationale: В контексте γινώσκω указывает на будущее постижение смысла действия; иной русский глагол сохраняет различие с οἶδας.
- source_word: μετὰ ταῦτα
  choice: после этого
  rationale: Естественно и достаточно формально передаёт временную фразу, не уточняя, какие именно последующие события имеются в виду.
theological_decisions:
- issue: Временной объём обещанного будущего понимания
  choice: «после этого» без уточнения события
  alternative: После объяснения омовения ног; после креста и воскресения; позднее благодаря действию Духа
  rationale: Греческое μετὰ ταῦτα не определяет однозначно момент будущего понимания, поэтому перевод сохраняет смысловую открытость.
translation_notes:
  register: Современный литературный русский язык; речь ясная и достойная. Формула «сказал ему в ответ» естественно передаёт двойное греческое введение речи. Различие οἶδας и γνώσῃ сохранено словами «не знаешь» и «поймёшь».
