source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Πέτρος· Κύριε, διὰ τί οὐ δύναμαί σοι ⸀ἀκολουθῆσαι ἄρτι; τὴν ψυχήν μου ὑπὲρ σοῦ θήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/037.yaml
  text: Peter said to him[a], “Lord[b], why am I not able to follow you now? I will lay down my life for you.”
translation:
  language: ru
  text: 'Пётр сказал Ему: «Господи, почему я не могу последовать за Тобой сейчас? Я отдам за Тебя свою жизнь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: сказал
  rationale: Греческое историческое настоящее естественно передано русским прошедшим временем в повествовании.
- source_word: Κύριε
  choice: Господи
  rationale: Традиционная и естественная форма прямого обращения к Иисусу, сохраняющая уважение и возможный богословский вес титула.
- source_word: διὰ τί οὐ δύναμαί
  choice: почему я не могу
  rationale: Точно и естественно передаёт вопрос о невозможности последовать сейчас.
- source_word: σοι ἀκολουθῆσαι
  choice: последовать за Тобой
  rationale: Сохраняет как буквальный смысл движения вслед за Иисусом, так и оттенок ученичества.
- source_word: ἄρτι
  choice: сейчас
  rationale: Современный и точный эквивалент временного наречия.
- source_word: τὴν ψυχήν μου
  choice: свою жизнь
  rationale: В сочетании с τίθημι выражение означает готовность умереть, а не отдельное утверждение о метафизической душе.
- source_word: ὑπὲρ σοῦ
  choice: за Тебя
  rationale: В русском выражении «отдать жизнь за кого-либо» естественно передаёт готовность пожертвовать собой ради другого, не уточняя заместительный оттенок сверх контекста.
- source_word: θήσω
  choice: отдам
  rationale: Идиоматичное русское соответствие выражению «положить жизнь»; звучит естественно и ясно для современного читателя.
theological_decisions:
- issue: Значение ψυχή в заявлении Петра
  choice: жизнь
  alternative: душа
  rationale: Контекст говорит о готовности Петра умереть за Иисуса; перевод «душа» внёс бы не требуемый здесь метафизический смысл.
- issue: Смысл ἀκολουθέω
  choice: последовать
  alternative: пойти вместе; сопровождать
  rationale: «Последовать» сохраняет одновременно пространственный смысл и богословский оттенок ученичества в Евангелии от Иоанна.
- issue: Оттенок ὑπὲρ σοῦ
  choice: за Тебя
  alternative: ради Тебя; вместо Тебя
  rationale: Формулировка «за Тебя» сохраняет широту греческого оборота и не навязывает более узкое заместительное толкование.
translation_notes:
  register: 'Современный литературный русский язык; речь Петра передана прямо, естественно и с достоинством. Заглавные буквы в местоимениях обращения к Иисусу использованы в соответствии с распространённой русской библейской традицией. Текст не нуждается в сносках: необходимые смысловые различия естественно передаются в основном тексте.'
