  text: εἰ ταῦτα οἴδατε, μακάριοί ἐστε ἐὰν ποιῆτε αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/017.yaml
  text: If you know these things[a], you are blessed if you do them.
translation:
  language: ru
  text: Если вы знаете всё это, то вы блаженны[a], если так поступаете.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «счастливы», «благополучны». Греческое слово обозначает не только чувство счастья, но и благословенное, подлинно благое состояние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: если
  rationale: Передаёт условный союз и сохраняет условную структуру греческой фразы.
- source_word: ταῦτα
  choice: всё это
  rationale: Естественно передаёт указание на предшествующие пример и наставление Иисуса; слово «всё» помогает сохранить собирательно-множественный смысл греческой формы.
- source_word: οἴδατε
  choice: знаете
  rationale: Прямое соответствие глаголу знания; контекст предполагает понимание, но сам глагол не требует перевода «понимаете».
- source_word: μακάριοί
  choice: блаженны
  rationale: Сохраняет библейский смысл благословенного, угодного Богу состояния и не сводит высказывание к субъективному чувству счастья.
- source_word: ἐὰν
  choice: если
  rationale: Передаёт реальное, но зависящее от действия условие.
- source_word: ποιῆτε αὐτά
  choice: так поступаете
  rationale: Естественная русская формулировка, обозначающая осуществление на деле только что изложенного наставления; местоименное «так» ясно отсылает к «всему этому».
theological_decisions:
- issue: Передача μακάριοι в контексте ученичества
  choice: блаженны
  alternative: счастливы; благополучны
  rationale: «Блаженны» сохраняет богословскую весомость и идею благого состояния перед Богом, не уточняя сверх текста, в чём именно проявляется благословение.
- issue: Соотношение знания и исполнения
  choice: 'сохранены два условных оборота: «если… если…»'
  alternative: «Зная это и поступая так, вы блаженны»
  rationale: Греческий текст сначала предполагает знание, а затем ставит блаженство в зависимость от исполнения; выбранная структура сохраняет это напряжение и не сливает два условия.
translation_notes:
  register: Современный литературный русский язык с сохранением узнаваемого библейского термина «блаженны». Формулировка краткая, понятная и близкая к условной структуре оригинала.
