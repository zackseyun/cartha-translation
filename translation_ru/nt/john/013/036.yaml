  text: Λέγει αὐτῷ Σίμων Πέτρος· Κύριε, ποῦ ὑπάγεις; ⸀ἀπεκρίθη Ἰησοῦς· Ὅπου ὑπάγω οὐ δύνασαί μοι νῦν ἀκολουθῆσαι, ⸂ἀκολουθήσεις δὲ ὕστερον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/036.yaml
  text: Simon Peter says to him[a], “Lord, where are you going?” Jesus answered, “Where I am going, you are not able to follow me now[b], but you will follow later.”
translation:
  language: ru
  text: 'Симон Пётр говорит Ему: «Господи, куда Ты идёшь?» Иисус ответил: «Куда Я иду, ты сейчас не можешь последовать за Мной[a], но последуешь позже[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «ты сейчас не в силах последовать за Мной». В греческом тексте прямо употреблён глагол со значением способности или возможности.'
    reason: lexical_alternative
  - marker: b
    text: Слова «последуешь позже» могут намекать на то, что впоследствии Пётр последует за Иисусом путём страдания или смерти, однако сама формулировка этого не уточняет.
    reason: cross_reference
lexical_decisions:
- source_word: Λέγει
  choice: говорит
  rationale: Историческое настоящее греческого повествования сохранено, поскольку по-русски оно здесь звучит естественно и придаёт сцене непосредственность.
- source_word: Κύριε
  choice: Господи
  rationale: Обычная русская форма прямого обращения к κύριος; передаёт уважительный титул, не сводя его значение только к обращению «Учитель».
- source_word: ποῦ ὑπάγεις / Ὅπου ὑπάγω
  choice: куда Ты идёшь / куда Я иду
  rationale: Естественно передаёт ὑπάγω и сохраняет словесную связь между вопросом Петра и ответом Иисуса, не уточняя места назначения.
- source_word: ἀπεκρίθη
  choice: ответил
  rationale: Краткий и естественный повествовательный эквивалент греческого аориста.
- source_word: οὐ δύνασαί μοι νῦν ἀκολουθῆσαι
  choice: ты сейчас не можешь последовать за Мной
  rationale: Глагол «можешь» прямо сохраняет выраженное в δύναμαι значение способности или возможности; «последовать за Мной» естественно передаёт ἀκολουθέω с дательным μοι.
- source_word: ἀκολουθήσεις δὲ ὕστερον
  choice: но последуешь позже
  rationale: Сохранены будущее время, противопоставление δέ и временное наречие ὕστερον; формулировка не уточняет характера будущего следования.
theological_decisions:
- issue: Смысл будущего следования Петра за Иисусом
  choice: Оставить слова «последуешь позже» без уточнения того, каким образом это исполнится.
  alternative: Истолковать их непосредственно как указание на мученическую смерть Петра, его восстановленное ученичество после воскресения или окончательное следование в славу.
  rationale: Сам греческий текст не называет конкретного события. Нейтральная формулировка сохраняет заложенную в повествовании богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с традиционно возвышенным, но понятным библейским регистром. Историческое настоящее сохранено. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской практикой; синтаксис при этом остаётся современным и естественным.
