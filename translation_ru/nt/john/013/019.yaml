  text: ἀπ’ ἄρτι λέγω ὑμῖν πρὸ τοῦ γενέσθαι, ἵνα ⸂πιστεύσητε ὅταν γένηται⸃ ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/019.yaml
  text: From now on I am telling you before it happens[a], so that when it does happen, you may believe that I am he.
translation:
  language: ru
  text: Отныне говорю вам об этом прежде, чем это произойдёт, чтобы, когда это произойдёт, вы поверили, что это Я[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, буквально: «что Я есть». Греческое выражение может также перекликаться с формулами божественного самооткровения у Исаии и в других местах Евангелия от Иоанна.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπ’ ἄρτι
  choice: Уже теперь
  rationale: Передаёт исходную временную точку и связь с настоящим моментом; в данном контексте естественнее, чем буквальное «отныне», поскольку речь идёт о предсказании до события.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Естественно передаёт настоящее время и прямое обращение без ненужного усиления длительности.
- source_word: πρὸ τοῦ γενέσθαι
  choice: прежде, чем оно произойдёт
  rationale: Сохраняет отношение предшествования, выраженное πρό с артиклевым инфинитивом, и не уточняет само событие сверх контекста.
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт целевое значение придаточного.
- source_word: πιστεύσητε
  choice: вы поверили
  rationale: Сохраняет обычное для πιστεύω значение «верить» и целевую направленность аориста конъюнктива после ἵνα, не навязывая оттенок начала веры.
- source_word: ὅταν γένηται
  choice: когда оно произойдёт
  rationale: Передаёт будущее событие, выраженное ὅταν с конъюнктивом, ясным современным русским языком.
- source_word: ὅτι ἐγώ εἰμι
  choice: что Я есть
  rationale: Максимально сохраняет отсутствие именной части сказуемого и возможный отзвук формулы божественного самооткровения; необычность русского оборота уместна здесь и пояснена в сноске.
theological_decisions:
- issue: Абсолютное выражение ἐγώ εἰμι в контексте Евангелия от Иоанна и возможная аллюзия на божественное самооткровение
  choice: что Я есть
  alternative: что это Я
  rationale: Греческий текст не содержит выраженной именной части сказуемого. «Что Я есть» сохраняет богословскую напряжённость и возможную связь с формулами самоидентификации у Исаии и в других местах Евангелия от Иоанна; более естественное «что это Я» могло бы свести выражение к простой идентификации.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Повтор «произойдёт» сохранён вслед за повтором одного греческого глагола; необычная формула «Я есть» намеренно удерживает смысловую и богословскую неоднозначность оригинала.
