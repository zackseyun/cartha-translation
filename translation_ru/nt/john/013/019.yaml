  source_fidelity: «Уже теперь» ослабляет направленное вперёд значение ἀπ’ ἄρτι; «отныне» точнее передаёт исходную точку «с этого момента и далее». Остальная синтаксическая структура, целевое «чтобы» и повтор будущего события в целом соответствуют греческому тексту.
  naturalness: Оборот «что Я есть» в современном литературном русском звучит неестественно и может быть понят как неполное или ошибочное предложение. Нейтральное «что это Я» естественно передаёт самoидентификацию, а буквальная абсолютная форма и её возможный подтекст должны быть сохранены в сноске.
  terminology: «Поверили» уместно для πιστεύσητε. «Это Я» не вводит отсутствующий в греческом предикат «он» и не предрешает богословское значение абсолютного ἐγώ εἰμι; сноска сохраняет как буквальное чтение, так и возможную аллюзию.
