base_translation:
  language: en
  yaml_path: translation/nt/john/013/025.yaml
  text: So he[a], leaning back in this way against Jesus' chest, says to him, “Lord, who is it?”
translation:
  language: ru
  text: 'И он, так откинувшись к груди Иисуса[a], спрашивает Его: «Господи, кто это?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возлёг у груди Иисуса». За столом в то время обычно ели полулёжа; здесь описано, как ученик отклонился назад к Иисусу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπεσὼν
  choice: откинувшись
  rationale: Причастие описывает движение назад из принятой за столом позы возлежания; «откинувшись» естественно передаёт направленное движение к Иисусу.
- source_word: ἐκεῖνος
  choice: он
  rationale: Местоимение отсылает к ученику, названному в предыдущем контексте; добавление «ученик» здесь не требуется и сделало бы выражение более явным, чем греческий текст.
- source_word: οὕτως
  choice: так
  rationale: Сохраняет связь с только что описанным положением ученика и кратко передаёт «таким образом».
- source_word: ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ
  choice: к груди Иисуса
  rationale: Предлог с винительным падежом в сочетании с причастием выражает направленность движения; «к груди» естественно передаёт позу без излишней анатомической буквальности.
- source_word: λέγει αὐτῷ
  choice: спрашивает Его
  rationale: Историческое настоящее сохранено. В русском контексте глагол «спрашивает» естественно вводит непосредственно следующую вопросительную реплику и передаёт речевой акт λέγει.
- source_word: Κύριε
  choice: Господи
  rationale: Русская звательная форма «Господи» традиционна и естественна при прямом обращении к Иисусу, сохраняя как уважительное, так и богословское звучание κύριος.
- source_word: τίς ἐστιν;
  choice: кто это?
  rationale: Естественный русский вопрос об идентичности человека; сохраняет невыраженность грамматического подлежащего в греческом.
theological_decisions:
- issue: Передача κύριος в обращении к Иисусу
  choice: Господи
  alternative: Учитель / господин
  rationale: «Господи» сохраняет возможный диапазон от почтительного обращения до исповедального титула и не сводит выражение только к бытовой вежливости.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельского повествования. Историческое настоящее сохранено. Местоимение «Его» написано с прописной буквы согласно устойчивой русской библейской практике; формулировка не добавляет имени ученика, которого данный стих прямо не называет.
