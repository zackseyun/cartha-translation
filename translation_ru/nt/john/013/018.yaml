  verdict: revise
  source_fidelity: Первая и вторая фразы точно передают οὐ περὶ πάντων ὑμῶν λέγω и οἶδα τίνας ἐξελεξάμην; «кого избрал» не навязывает характера избрания. Цитата сохраняет образ τρώγων и ἐπῆρεν ... τὴν πτέρναν. Однако «Но пусть исполнится Писание» в русском обычно звучит как побудительное пожелание («да исполнится»), тогда как ἀλλ’ ἵνα вводит целевую/объяснительную конструкцию с эллиптически подразумеваемым «это/говорю это».
