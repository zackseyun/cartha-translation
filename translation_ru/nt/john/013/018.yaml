source:
  edition: SBLGNT
  text: οὐ περὶ πάντων ὑμῶν λέγω· ἐγὼ οἶδα ⸀τίνας ἐξελεξάμην· ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ· Ὁ τρώγων ⸀μου τὸν ἄρτον ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/018.yaml
  text: 'I am not speaking about all of you[a]. I know whom I have chosen[c][b]. But this is so that the Scripture may be fulfilled: ‘The one who eats my bread has lifted up his heel against me.’'
translation:
  language: ru
  text: 'Не обо всех вас Я говорю. Я знаю, кого избрал. Но это для того, чтобы исполнилось Писание: «Тот, кто ест Мой хлеб, поднял на Меня свою пяту».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Цитата из Псалма 40:10 (в иной нумерации — 41:9). «Поднять пяту» — образ вражды и предательства.
    reason: cross_reference_and_lexical_explanation
lexical_decisions:
- source_word: οὐ περὶ πάντων ὑμῶν λέγω
  choice: Не обо всех вас Я говорю
  rationale: 'Естественный русский порядок слов сохраняет значение περὶ («о, относительно») и область отрицания: сказанное относится не ко всем ученикам.'
- source_word: οἶδα
  choice: Я знаю
  rationale: Формально перфектная форма οἶδα в койне имеет настоящее значение.
- source_word: τίνας ἐξελεξάμην
  choice: кого избрал
  rationale: Передаёт личный объект и аорист ἐξελεξάμην без добавочного уточнения о характере или цели избрания.
- source_word: ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ
  choice: Но пусть исполнится Писание
  rationale: Сохраняет эллиптичность греческой конструкции и язык исполнения Писания, не вводя в основной текст отсутствующее указательное «это» и не усиливая причинную предопределённость.
- source_word: Ὁ τρώγων μου τὸν ἄρτον
  choice: Тот, кто ест Мой хлеб
  rationale: Субстантивированное причастие передано естественной русской относительной конструкцией; μου отнесено к τὸν ἄρτον согласно наиболее вероятному синтаксису.
- source_word: ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ
  choice: поднял на Меня свою пяту
  rationale: Сохраняет телесную метафору цитаты и её враждебный оттенок, не заменяя образ толкованием «предал».
theological_decisions:
- issue: Связь избрания Иисусом с предателем
  choice: Передать ἐξελεξάμην просто как «избрал»
  alternative: Уточнить «избрал ко спасению» или «избрал апостолами»
  rationale: Сам стих не определяет вид избрания; перевод сохраняет богословское напряжение и не решает его в пользу конфессионального толкования.
- issue: Значение ἀλλ’ ἵνα в связи с предательством и Писанием
  choice: «Но пусть исполнится Писание»
  alternative: «Но это произошло для того, чтобы Писание непременно исполнилось»
  rationale: Выбранная формулировка сохраняет целевую/результативную открытость ἵνα и не добавляет более жёсткой причинности, чем выражено в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавные местоимения при обращении Христа к Себе сохранены как распространённая русская издательская норма. Образ «поднял… пяту» намеренно не сглажен; его смысл пояснён в сноске.
