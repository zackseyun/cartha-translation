base_translation:
  language: en
  yaml_path: translation/nt/john/013/027.yaml
  text: And after the piece of bread[a], then Satan entered into him. So Jesus said to him, “What you are doing[b], do more quickly.”
translation:
  language: ru
  text: 'После того как Иуда взял кусок хлеба[a], в него вошёл сатана. Тогда Иисус сказал ему: «Что делаешь, делай скорее[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кусочек пищи». Греческое слово обозначает небольшой кусок пищи; в контексте трапезы это, вероятно, кусок хлеба, который Иисус обмакнул и подал Иуде.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «делай быстрее». В греческом употреблена сравнительная форма наречия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ψωμίον
  choice: кусок хлеба
  rationale: Уменьшительная форма обозначает небольшой кусок пищи; в контексте трапезы речь идёт о куске хлеба. Это конкретная и естественная современная формулировка.
- source_word: εἰσῆλθεν εἰς ἐκεῖνον
  choice: в него вошёл
  rationale: Прямо передаёт конструкцию εἰσέρχομαι + εἰς и сохраняет личный характер действия, не добавляя объяснений о его природе или степени.
- source_word: ὁ Σατανᾶς
  choice: сатана
  rationale: Устоявшаяся русская передача имени-титула; этимологическое истолкование «противник» здесь не требуется.
- source_word: λέγει οὖν αὐτῷ ὁ Ἰησοῦς
  choice: Тогда Иисус сказал ему
  rationale: Прошедшее время естественно для русского повествования, а «тогда» передаёт связующую функцию οὖν в данном контексте.
- source_word: Ὃ ποιεῖς
  choice: Что делаешь
  rationale: Сохраняет настоящее время и непосредственность действия, не вводя интерпретирующее «что собираешься сделать».
- source_word: ποίησον
  choice: делай
  rationale: Повтор того же русского глагола отражает повтор ποιεῖς/ποίησον и сохраняет краткость приказа.
- source_word: τάχιον
  choice: скорее
  rationale: «Скорее» естественно передаёт сравнительную форму наречия и в русском может означать призыв действовать быстрее.
theological_decisions:
- issue: Характер действия сатаны по отношению к Иуде
  choice: Сохранить прямую формулировку «в него вошёл сатана»
  alternative: «сатана овладел им» или «Иуда отдался сатане»
  rationale: Греческий текст говорит о вхождении сатаны, но не разъясняет его механизм и степень. Прямая передача сохраняет богословское напряжение и не превращает сказанное ни в метафору, ни в развёрнутое учение об одержимости.
translation_notes:
  register: Современный литературный русский язык с лаконичным, повествовательным строем. Сохранены резкость повеления, прямое описание вхождения сатаны и повтор глагола ποιέω. Имя «сатана» написано со строчной буквы по обычной норме современного русского библейского текста.
