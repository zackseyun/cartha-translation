  source_fidelity: 'Основной смысл передан верно: ψωμίον обозначено как кусок хлеба, прямое «в него вошёл сатана» сохраняет формулировку εἰσῆλθεν εἰς ἐκεῖνον, а повеление передано без богословских пояснений. Однако сочетание «после того куска хлеба» в современном русском неясно: оно может восприниматься как обозначение предмета, а не события, после которого произошло вхождение. Контекстуальное «после того как Иуда взял кусок хлеба» естественно передаёт смысл и соответствует непосредственно предшествующему контексту, не добавляя доктринального истолкования.'
