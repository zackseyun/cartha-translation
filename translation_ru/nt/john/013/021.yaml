base_translation:
  language: en
  yaml_path: translation/nt/john/013/021.yaml
  text: After saying these things[a], Jesus was troubled in spirit, and testified and said, “Truly, truly, I say to you, one of you will betray me.”
translation:
  language: ru
  text: 'Сказав это, Иисус встревожился духом, засвидетельствовал и сказал: «Истинно, истинно говорю вам: один из вас предаст Меня[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «выдаст Меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: Сказав это
  rationale: Аористное причастие естественно передаётся русским деепричастным оборотом; сохраняются временная последовательность и лаконичность оригинала.
- source_word: ἐταράχθη τῷ πνεύματι
  choice: был потрясён в духе
  rationale: Передаёт сильное внутреннее смятение Иисуса, не сводя его к гневу и не добавляя отсутствующего в тексте объяснения; «в духе» сохраняет указание на внутреннюю сферу переживания.
- source_word: ἐμαρτύρησεν
  choice: засвидетельствовал
  rationale: Сохраняет характерную для Иоанна лексику свидетельства и подчёркивает весомость последующего заявления.
- source_word: Ἀμὴν ἀμὴν
  choice: Истинно, истинно
  rationale: Сохраняет повтор и торжественную усилительную формулу, оставаясь понятным современному русскому читателю.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямо и естественно передаёт греческую формулу без стилистического ослабления.
- source_word: εἷς ἐξ ὑμῶν
  choice: один из вас
  rationale: Естественный русский эквивалент партитивной конструкции, сохраняющий личную остроту слов Иисуса.
- source_word: παραδώσει με
  choice: предаст Меня
  rationale: В данном контексте глагол обозначает предательскую передачу Иисуса противникам; более буквальное значение «выдаст Меня» сохранено в сноске.
theological_decisions:
- issue: Передача внутреннего потрясения Иисуса
  choice: был потрясён в духе
  alternative: встревожился духом
  rationale: Формулировка сохраняет подлинность человеческого переживания Иисуса и не объясняет его догматически; вместе с тем она не приписывает ему непременно гнев, который современное «возмутился» могло бы подразумевать.
- issue: Передача παραδίδωμι в предсказании предательства
  choice: предаст Меня
  alternative: выдаст Меня
  rationale: Основной текст ясно передаёт вероломный характер поступка одного из учеников, а сноска сохраняет более буквальный смысл передачи во власть других.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной библейской торжественностью. Повтор «Истинно, истинно» и глагол «засвидетельствовал» сохраняют иоанновскую выразительность; местоимение «Меня» написано с прописной буквы в соответствии с принятой русской библейской издательской традицией.
