id: JHN.13.29
reference: John 13:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τινὲς γὰρ ἐδόκουν, ἐπεὶ τὸ γλωσσόκομον ⸀εἶχεν Ἰούδας, ὅτι λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἀγόρασον ὧν χρείαν ἔχομεν εἰς τὴν ἑορτήν, ἢ τοῖς πτωχοῖς ἵνα τι δῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/029.yaml
  text: For some thought that[a], because Judas had the money box, Jesus was telling him[b], “Buy what we need for the feast,” or that he should give something to the poor.
translation:
  language: ru
  text: 'Некоторые думали, что, поскольку денежный ящик был у Иуды, Иисус говорит ему: «Купи то, что нам нужно к празднику», — или что Иисус велит ему дать что-нибудь бедным.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς
  choice: некоторые
  rationale: Неопределённое множественное число указывает на некоторых из присутствовавших; краткое и естественное соответствие.
- source_word: ἐδόκουν
  choice: думали
  rationale: Передаёт ошибочное предположение учеников; имперфект естественно выражен повествовательным прошедшим временем.
- source_word: ἐπεὶ
  choice: поскольку
  rationale: 'Вводит основание их предположения: денежный ящик находился у Иуды.'
- source_word: γλωσσόκομον
  choice: денежный ящик
  rationale: Термин обозначает вместилище для общих денег; перевод сохраняет предметное значение, не уточняя его сверх источника.
- source_word: εἶχεν Ἰούδας
  choice: был у Иуды
  rationale: Сохраняет простое значение «имел, держал» и естественно подразумевает, что деньги были в его ведении.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Иисус говорит ему
  rationale: 'Историческое настоящее сохранено: оно живо звучит по-русски внутри передаваемого предположения.'
- source_word: Ἀγόρασον
  choice: Купи
  rationale: Прямой и естественный перевод аористного повелительного наклонения.
- source_word: ὧν χρείαν ἔχομεν
  choice: то, что нам нужно
  rationale: Идиоматично передаёт относительную конструкцию и не утрачивает смысла необходимости.
- source_word: εἰς τὴν ἑορτήν
  choice: к празднику
  rationale: ἑορτή означает религиозный праздник; контекст указывает на Пасху, но стих здесь не повторяет её название.
- source_word: τοῖς πτωχοῖς
  choice: бедным
  rationale: Естественное субстантивированное употребление при глаголе «дать».
- source_word: ἵνα τι δῷ
  choice: велит ему дать что-нибудь
  rationale: В русском косвенном изложении ясно передаёт предполагаемое поручение Иисуса и сохраняет альтернативу после ἤ.
theological_decisions:
- issue: Название праздника
  choice: празднику
  alternative: Пасхе / пасхальному празднику
  rationale: Сохранено общее слово ἑορτή; пасхальный контекст очевиден из раздела, но конкретизация внутри стиха добавляла бы отсутствующее слово.
translation_notes:
  register: 'Современный литературный русский, ясный и достойный. Синтаксис сохраняет причинную вставку и две альтернативы ученического предположения, но избегает неестественной кальки. Сноски не добавлены: русское «денежный ящик» прозрачно, а пасхальный контекст не требует пояснения в самом стихе.'
