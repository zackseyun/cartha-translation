review_pass:
  verdict: revise
  source_fidelity: В целом перевод точно передаёт участников, причинное основание их предположения, содержание предполагаемого поручения купить нужное к празднику и альтернативу дать что-либо бедным. Однако вторая альтернатива в греческом зависит от того же «думали, что»; в данном русском тексте это синтаксическое отношение выражено менее ясно.
  naturalness: Современный литературный русский в целом естественен. Повторение «что Иисус велит ему» во второй части делает координацию двух предполагаемых объяснений прозрачной и снимает неудачное соединение «Иисус говорит ему ... — или велит ему».
  terminology: «Денежный ящик», «праздник» и «бедные» приемлемы и не добавляют конфессиональной конкретизации. «К празднику» естественно передаёт εἰς τὴν ἑορτήν.
  issues:
  - severity: medium
    issue: Не вполне ясно синтаксическое подчинение второй альтернативы.
    rationale: 'Греческое ἤ вводит второе содержание предположения: некоторые думали либо что Иисус говорит Иуде купить необходимое, либо что Иисус велит ему дать что-нибудь бедным. Формулировка «— или велит ему» может читаться как продолжение авторского утверждения о том, что Иисус действительно велит, а не как второй вариант того, что предполагали присутствующие.'
  revised_text: 'Некоторые думали, что, поскольку денежный ящик был у Иуды, Иисус говорит ему: «Купи то, что нам нужно к празднику», — или что Иисус велит ему дать что-нибудь бедным.'
