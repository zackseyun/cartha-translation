revisions:
- from: 'Некоторые же думали, что, поскольку денежный ящик был у Иуды, Иисус говорит ему: «Купи то, что нам нужно к празднику», — или велит ему дать что-нибудь бедным.'
  to: 'Некоторые думали, что, поскольку денежный ящик был у Иуды, Иисус говорит ему: «Купи то, что нам нужно к празднику», — или что Иисус велит ему дать что-нибудь бедным.'
  rationale: Ясно выражена зависимость обеих альтернатив от «думали, что», при сохранении исторического настоящего «говорит», общего обозначения праздника и без добавления пасхальной конкретизации.
