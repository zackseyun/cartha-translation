source:
  edition: SBLGNT
  text: Ὅτε οὖν ἔνιψεν τοὺς πόδας αὐτῶν ⸀καὶ ἔλαβεν τὰ ἱμάτια αὐτοῦ ⸂καὶ ἀνέπεσεν⸃, πάλιν εἶπεν αὐτοῖς· Γινώσκετε τί πεποίηκα ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/012.yaml
  text: So when he had washed their feet and taken his garments and reclined again[a], he said to them[b], “Do you understand what I have done for you?”
translation:
  language: ru
  text: 'Когда же он омыл им ноги, взял свою одежду и возлёг за столом[a], то снова сказал им: «Понимаете ли вы, что я сделал для вас[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол обозначает положение полулёжа за столом, принятое во время трапезы.
    reason: Лексическое пояснение исторически специфичного выражения.
  - marker: b
    text: 'Или: «что я сделал вам»; греческий дательный падеж допускает оба понимания, хотя контекст служения поддерживает перевод «для вас».'
    reason: Альтернативная передача дательного падежа.
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Когда же
  rationale: «Когда» передаёт временное значение ὅτε, а частица «же» естественно обозначает продолжение повествования и сохраняет связующую силу οὖν.
- source_word: ἔνιψεν τοὺς πόδας αὐτῶν
  choice: омыл им ноги
  rationale: Естественная русская конструкция точно передаёт действие и принадлежность ног ученикам; совершенный вид соответствует завершённому действию.
- source_word: ἔλαβεν τὰ ἱμάτια αὐτοῦ
  choice: взял свою одежду
  rationale: Сохраняется прямое значение ἔλαβεν — «взял», без контекстуально возможного, но более истолковывающего «надел»; собирательное «одежда» естественно передаёт множественное ἱμάτια.
- source_word: ἀνέπεσεν
  choice: возлёг за столом
  rationale: В контексте трапезы глагол обозначает положение полулёжа за столом; такой перевод сохраняет историческую обстановку точнее, чем «сел».
- source_word: πάλιν
  choice: снова
  rationale: Прямой русский эквивалент наречия повторности. В основном тексте оно отнесено к возвращению Иисуса на место за столом; возможная иная синтаксическая связь отмечена в сноске.
- source_word: Γινώσκετε
  choice: Понимаете ли вы
  rationale: Вопрос касается не осведомлённости учеников о совершённом действии, а постижения его смысла, поэтому «понимаете» точнее контекстуального значения.
- source_word: τί πεποίηκα ὑμῖν
  choice: что я сделал для вас
  rationale: Совершенный вид «сделал» естественно выражает завершённое действие с сохраняющимся значением; «для вас» передаёт вероятный благодетельный оттенок дательного ὑμῖν, а формально возможное «с вами/вам» отмечено в сноске.
theological_decisions:
- issue: Положение Иисуса за столом после омовения ног
  choice: возлёг за столом
  alternative: сел за стол; снова занял место за столом
  rationale: Перевод сохраняет конкретный исторический образ древней трапезы, не превращая его в современную позу сидя и не добавляя богословского толкования.
- issue: Синтаксическая связь πάλιν
  choice: снова возлёг за столом
  alternative: возлёг за столом и снова сказал им
  rationale: Контекст естественно указывает на возвращение Иисуса к прежнему месту после омовения ног, однако положение наречия допускает его связь с «сказал»; эта подлинная неоднозначность сохранена в сноске.
- issue: Значение дательного ὑμῖν
  choice: для вас
  alternative: вам; с вами
  rationale: Контекст служения поддерживает благодетельное значение «для вас», но греческий дательный сам по себе допускает более нейтральное понимание, поэтому альтернатива приведена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным строем. Местоимения, относящиеся к Иисусу, даны со строчной буквы по общим нормам современного русского текста; архаичное «возлёг» сохранено как точный культурно-исторический термин и пояснено в сноске.
