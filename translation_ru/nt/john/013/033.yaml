  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τεκνία, ἔτι μικρὸν μεθ’ ὑμῶν εἰμι· ζητήσετέ με, καὶ καθὼς εἶπον τοῖς Ἰουδαίοις ὅτι Ὅπου ⸂ἐγὼ ὑπάγω⸃ ὑμεῖς οὐ δύνασθε ἐλθεῖν, καὶ ὑμῖν λέγω ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/033.yaml
  text: Little children[a], I am with you a little while longer. You will seek me, and just as I said to the Jews, ‘Where I am going[b], you are not able to come,’ so now I also say to you.
translation:
  language: ru
  text: 'Дети, Я с вами ещё недолго. Вы будете искать Меня, и, как Я сказал иудеям[a]: «Куда Я ухожу, вы не можете прийти[b]», — так и вам говорю теперь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В Евангелии от Иоанна слово «иудеи» в некоторых контекстах может обозначать более узко — иудейских начальников.
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «не в состоянии прийти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: Дети Мои
  rationale: Ласковое уменьшительное обращение выражает близость и нежность. Буквальное «детки» в современном русском может звучать чрезмерно по-детски или сниженно; «Дети Мои» естественно передаёт отеческую теплоту, хотя притяжательное значение в греческом прямо не выражено.
- source_word: ἔτι μικρόν
  choice: ещё недолго
  rationale: Сочетание обозначает краткое оставшееся время. «Ещё недолго» кратко и естественно передаёт временной смысл.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: Я буду с вами
  rationale: В сочетании с указанием на оставшееся краткое время русский будущий вид естественно передаёт смысл продолжающегося присутствия, выраженный в греческом настоящим временем.
- source_word: ζητήσετέ με
  choice: Вы будете искать Меня
  rationale: Будущее время и значение ζητέω переданы прямо; «искать» сохраняет весомость формулировки и её связь с другими местами Евангелия от Иоанна.
- source_word: τοῖς Ἰουδαίοις
  choice: иудеям
  rationale: Это прямое соответствие греческому обозначению. Контекст иногда допускает более узкий смысл — представителей иудейской власти, но сам стих не требует такого уточнения.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: Куда Я ухожу
  rationale: ὑπάγω здесь означает уход или отправление. «Ухожу» естественно передаёт не только движение, но и мотив предстоящего отсутствия.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: вы не можете прийти
  rationale: Формулировка сохраняет выраженную глаголом δύνασθε невозможность или неспособность прийти, не уточняя её причину.
- source_word: καὶ ὑμῖν λέγω ἄρτι
  choice: так теперь говорю и вам
  rationale: «Так» ясно передаёт сопоставление с ранее сказанным, «теперь» соответствует ἄρτι, а «и вам» естественно выражает параллельное применение слов к ученикам.
theological_decisions:
- issue: Значение τοῖς Ἰουδαίοις в контексте Евангелия от Иоанна
  choice: иудеям
  alternative: иудейским начальникам
  rationale: Основной текст сохраняет широкое и буквальное обозначение, не сужая круг адресатов без достаточного основания. Возможный контекстуально более узкий смысл отмечен в сноске.
- issue: Характер невозможности прийти вслед за Иисусом
  choice: вы не можете прийти
  alternative: вы не в состоянии прийти
  rationale: Перевод сохраняет утверждение о невозможности, но не объясняет, временная ли она, духовная или обусловлена иной причиной; эта смысловая напряжённость остаётся открытой.
translation_notes:
  register: Современный литературный русский язык с тёплым, но достойным обращением. Формулировки просты и понятны; сохранены повтор, прямая речь и неуточнённый характер невозможности последовать за Иисусом. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией.
