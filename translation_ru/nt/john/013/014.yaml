source:
  edition: SBLGNT
  text: εἰ οὖν ἐγὼ ἔνιψα ὑμῶν τοὺς πόδας ὁ κύριος καὶ ὁ διδάσκαλος, καὶ ὑμεῖς ὀφείλετε ἀλλήλων νίπτειν τοὺς πόδας·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/014.yaml
  text: If I then[a], the Lord and the Teacher, have washed your feet, you also ought to wash one another’s feet.
translation:
  language: ru
  text: Итак, если Я, Господь и Учитель, омыл вам ноги, то и вы должны омывать ноги друг другу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ οὖν
  choice: Итак, если … то
  rationale: Сохраняет условную конструкцию εἰ и выводное значение οὖν, естественно передавая ход рассуждения по-русски.
- source_word: ἐγὼ
  choice: Я
  rationale: Явное местоимение сохранено, поскольку в греческом оно эмфатично и противопоставляет поступок Иисуса обязанности учеников.
- source_word: ἔνιψα
  choice: омыл
  rationale: Аорист обозначает завершённое действие, только что совершённое Иисусом; совершенный вид естественно передаёт его завершённость.
- source_word: ὑμῶν τοὺς πόδας
  choice: вам ноги
  rationale: Естественная русская конструкция с дательным лицом сохраняет смысл греческого оборота и избегает тяжеловесного «ваши ноги».
- source_word: ὁ κύριος
  choice: Господь
  rationale: Передаёт κύριος как титул Иисуса и сохраняет контраст между Его высоким положением и смиренным поступком.
- source_word: ὁ διδάσκαλος
  choice: Учитель
  rationale: Передаёт титульное употребление существительного рядом с «Господь»; прописная буква уместна как обозначение Иисуса.
- source_word: καὶ ὑμεῖς
  choice: то и вы
  rationale: 'Сохраняет усиленное местоимение и ответное соответствие: если так поступил Иисус, ученики также обязаны поступать так.'
- source_word: ὀφείλετε
  choice: должны
  rationale: Точно и естественно выражает нравственную обязанность, заложенную в ὀφείλετε, без превращения формы в прямое повеление.
- source_word: ἀλλήλων
  choice: друг другу
  rationale: При глаголе омовения естественная русская взаимная конструкция с дательным падежом передаёт реципрокное значение.
- source_word: νίπτειν τοὺς πόδας
  choice: омывать ноги
  rationale: Сохраняет конкретное действие — омовение части тела — и не подменяет его обобщённой идеей служения.
theological_decisions:
- issue: Передача κύριος как христологического титула
  choice: Господь
  alternative: Господин; Владыка
  rationale: В контексте это признанный учениками титул Иисуса. «Господь» сохраняет его титульный и богословский вес, а также контраст с исполненным смирения действием.
- issue: Характер обязанности омывать ноги
  choice: Сохранить конкретное выражение «омывайте ноги друг другу» в форме «должны омывать ноги друг другу»
  alternative: служить друг другу со смирением
  rationale: Греческий текст прямо называет омовение ног. Более широкое значение примера не должно вытеснять конкретную формулировку стиха.
translation_notes:
  register: Современный литературный русский язык с dignified библейским регистром. «Омыл/омывать» точнее и стилистически уместнее для данного ритуально-бытового действия, чем нейтральное «вымыл/мыть». Порядок «Господь и Учитель» сохранён; логическая связка «Итак, если … то» делает вывод ясным без сглаживания условной формы.
