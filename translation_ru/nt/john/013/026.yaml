source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται ὁ Ἰησοῦς· Ἐκεῖνός ἐστιν ᾧ ἐγὼ ⸀βάψω τὸ ψωμίον ⸂καὶ δώσω αὐτῷ⸃· ⸂βάψας οὖν⸃ τὸ ⸀ψωμίον δίδωσιν Ἰούδᾳ Σίμωνος ⸀Ἰσκαριώτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/026.yaml
  text: Jesus answers[a], “It is he to whom I will dip the piece of bread and give it.” So, having dipped the piece of bread, he gives it to Judas, the son of Simon Iscariot.
translation:
  language: ru
  text: 'Иисус отвечает: «Это тот, кому Я обмакну кусок хлеба и подам». И, обмакнув кусок хлеба, Он подаёт его Иуде, сыну Симона Искариота.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иуде Искариоту, сыну Симона». Греческую конструкцию можно понять и так.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: отвечает
  rationale: Историческое настоящее сохраняет живость повествования Иоанна и естественно звучит по-русски.
- source_word: Ἐκεῖνός ἐστιν
  choice: Это тот
  rationale: Передаёт указательно-отождествляющую конструкцию применительно к человеку без стилистически тяжёлого «Он тот».
- source_word: ᾧ
  choice: кому
  rationale: Дательный относительного местоимения естественно связывается с последующим «подам»; смысл всей конструкции остаётся ясным.
- source_word: βάψω
  choice: обмакну
  rationale: Будущее время передано явно; глагол обозначает погружение куска пищи, а не омовение.
- source_word: ψωμίον
  choice: кусок хлеба
  rationale: Ясно и современно передаёт небольшой кусок хлеба или пищи; «кусочек» могло бы внести ненужный уменьшительный оттенок.
- source_word: καὶ δώσω αὐτῷ
  choice: и подам
  rationale: «Подам» естественно для передачи пищи человеку; предмет и адресат уже выражены в конструкции, поэтому местоимения не повторяются.
- source_word: βάψας οὖν
  choice: И, обмакнув
  rationale: Деепричастная конструкция отражает предшествующее действие аористного причастия, а «и» естественно передаёт повествовательное οὖν в данном контексте.
- source_word: δίδωσιν
  choice: Он подаёт его
  rationale: Сохранено историческое настоящее; местоимение «его» необходимо по-русски для ясного обозначения куска хлеба.
- source_word: Ἰούδᾳ Σίμωνος Ἰσκαριώτου
  choice: Иуде, сыну Симона Искариота
  rationale: Следует наиболее непосредственной синтаксической связи греческих родительных форм, сохраняя альтернативное понимание в сноске.
theological_decisions:
- issue: К кому относится наименование «Искариот» в заключительной фразе
  choice: «Иуде, сыну Симона Искариота»
  alternative: «Иуде Искариоту, сыну Симона»
  rationale: Формы Σίμωνος Ἰσκαριώτου непосредственно допускают понимание «Симона Искариота», однако традиционное отнесение эпитета к Иуде также возможно; неоднозначность не устраняется молча, а отмечается в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Исторические настоящие «отвечает» и «подаёт» сохранены ради повествовательной живости. Прописные местоимения «Я», «Он» употреблены как принятая в русском библейском стиле форма почтительности.
