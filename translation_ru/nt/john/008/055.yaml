source:
  edition: SBLGNT
  text: καὶ οὐκ ἐγνώκατε αὐτόν, ἐγὼ δὲ οἶδα αὐτόν· κἂν εἴπω ὅτι οὐκ οἶδα αὐτόν, ἔσομαι ὅμοιος ⸀ὑμῖν ψεύστης· ἀλλὰ οἶδα αὐτὸν καὶ τὸν λόγον αὐτοῦ τηρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/055.yaml
  text: Yet you have not known him[a], but I know him. If I were to say that I do not know him, I would be a liar like you. But I do know him[c][b], and I keep his word.
translation:
  language: ru
  text: Вы так и не познали Его[a], а Я знаю Его. Если бы Я сказал, что не знаю Его[b], то был бы таким же лжецом, как вы. Но Я знаю Его и храню Его слово[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вы не знаете Его». Греческий глагол стоит в форме перфекта и может подчёркивать сохраняющееся отсутствие истинного познания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Если Я скажу, что не знаю Его». Греческая конструкция допускает более буквальную передачу настоящим временем, однако здесь выражает предположение.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «соблюдаю» или «исполняю». Глагол также может означать бережно хранить и верно соблюдать сказанное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκατε
  choice: так и не познали
  rationale: 'Перфект указывает на сохраняющийся результат: собеседники до сих пор не пришли к истинному познанию Бога. Оборот «так и не познали» естественно передаёт эту длительную недостаточность, не смешивая её с οἶδα.'
- source_word: οἶδα
  choice: знаю
  rationale: Хотя форма исторически перфектная, глагол имеет настоящее стативное значение «знать».
- source_word: κἂν εἴπω ... ἔσομαι
  choice: Если бы Я сказал ... то был бы
  rationale: Русская условная конструкция естественно передаёт гипотетический характер высказывания; буквальное будущее «буду» здесь звучало бы менее естественно.
- source_word: ὅμοιος ὑμῖν ψεύστης
  choice: таким же лжецом, как вы
  rationale: Передаёт прямое и резкое сопоставление с собеседниками, сохраняя существительное ψεύστης «лжец».
- source_word: τὸν λόγον αὐτοῦ
  choice: Его слово
  rationale: Сохраняет характерную для Иоанна лексику и не сужает λόγος до отдельного приказа или только сообщения.
- source_word: τηρῶ
  choice: храню
  rationale: «Храню» удерживает смысл верности, соблюдения и бережного отношения к слову, не сводя глагол лишь к исполнению правил.
- source_word: καὶ ... δὲ ... ἀλλὰ
  choice: а ... Но
  rationale: Русские противительные союзы ясно передают последовательные контрасты; начальное καί естественно включено в «Вы так и не познали», без тяжеловесного буквального «и».
theological_decisions:
- issue: Уникальное знание Бога Иисусом в противопоставлении Его собеседникам
  choice: Сохранено прямое утверждение Иисуса о том, что Он знает Бога и хранит Его слово.
  alternative: Добавить пояснение об исключительном богосыновстве либо ослабить «знаю» до знакомства.
  rationale: Стих сам резко противопоставляет истинное знание и верность Иисуса отсутствию такого знания у Его оппонентов; перевод не должен ни расширять это утверждение догматической формулой, ни смягчать его.
translation_notes:
  register: Современный литературный русский язык с достоинством и прямотой исходной полемики. Местоимения, относящиеся к Богу и Иисусу, написаны с прописной буквы согласно распространённой русской библейской традиции. Различие между ἐγνώκατε и οἶδα передано как «так и не познали» и «знаю».
