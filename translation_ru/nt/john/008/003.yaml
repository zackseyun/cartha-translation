  yaml_path: translation/nt/john/008/003.yaml
  text: Then[a] the scribes and the Pharisees brought to him a woman caught in adultery, and having set her in the midst,
translation:
  language: ru
  text: Тогда[a] книжники и фарисеи привели к Нему женщину, пойманную в прелюбодеянии, и, поставив её посреди собравшихся,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Продолжение рассказа о женщине, пойманной в прелюбодеянии (Ин. 7:53–8:11). См. примечание к Ин. 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: ἄγουσιν
  choice: привели
  rationale: Историческое настоящее передано прошедшим временем для естественного хода русского повествования; приставка «при-» выражает движение к Иисусу.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Устоявшееся русское обозначение знатоков и учителей Закона в новозаветном контексте.
- source_word: ἐν μοιχείᾳ κατειλημμένην
  choice: пойманную в прелюбодеянии
  rationale: Перфектное страдательное причастие указывает на женщину, которую застали при совершении прелюбодеяния; выбран естественный и традиционно понятный русский оборот.
- source_word: στήσαντες
  choice: поставив
  rationale: 'Аористное причастие обозначает предшествующее намеренное действие: женщину поставили перед присутствующими.'
- source_word: ἐν μέσῳ
  choice: посреди собравшихся
  rationale: Греческое выражение буквально означает «посреди»; добавление «собравшихся» естественно обозначает подразумеваемую группу людей, не сужая её до одних обвинителей.
