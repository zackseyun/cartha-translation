  yaml_path: translation/nt/john/008/048.yaml
  text: The Jews answered and said to him[c][b][a], “Are we not right in saying that you are a Samaritan and have a demon?”
translation:
  language: ru
  text: 'Иудеи ответили Ему: «Разве не правы мы, когда говорим, что Ты самарянин и что у Тебя бес?»[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В Евангелии от Иоанна слово «иудеи» нередко обозначает конкретную группу противников Иисуса, а не всех иудеев без исключения. В некоторых контекстах возможны переводы «жители Иудеи» или «иудейские вожди».
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «имеешь беса»; возможный перевод: «Ты одержим бесом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ
  choice: Иудеи ответили Ему
  rationale: Греческая формула буквально содержит два речевых глагола — «ответили и сказали Ему», однако в современном русском такое сочетание звучит избыточно; «ответили Ему» естественно передаёт повествовательную функцию обоих глаголов.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Это прямое соответствие греческому обозначению. Контекст может сужать круг подразумеваемых лиц, но само выражение не уточняет «вожди»; поэтому такое уточнение не внесено в основной текст.
- source_word: Οὐ καλῶς λέγομεν ἡμεῖς
  choice: Разве не правы мы, когда говорим
  rationale: Отрицательный вопрос предполагает утвердительный ответ, а καλῶς означает «правильно, справедливо». Формулировка сохраняет риторический нажим и звучит естественно по-русски.
- source_word: Σαμαρίτης εἶ σὺ
  choice: Ты самарянин
  rationale: Прямое этническое и религиозное обозначение, употреблённое здесь как оскорбление; эмфатическое σὺ естественно передано местоимением «Ты».
- source_word: δαιμόνιον ἔχεις
  choice: в Тебе бес
  rationale: Греческая идиома буквально означает «имеешь беса». Русское «в Тебе бес» сохраняет образ обладания/присутствия и менее интерпретативно, чем «Ты одержим бесом».
theological_decisions:
- issue: Кого обозначает οἱ Ἰουδαῖοι в повествовании Иоанна
  choice: иудеи
  alternative: иудейские вожди; жители Иудеи
  rationale: Основной текст следует лексической форме оригинала и не сужает референт без прямого указания. Сноска предупреждает, что в данном повествовательном контексте речь идёт о конкретной группе противников Иисуса, а не обо всех иудеях без исключения.
- issue: Степень интерпретации выражения δαιμόνιον ἔχεις
  choice: в Тебе бес
  alternative: Ты одержим бесом
  rationale: Выбрана формулировка, близкая к буквальному «имеешь беса», чтобы не определять точный характер предполагаемого демонического воздействия сильнее, чем это делает греческий текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксическая избыточность «ответили и сказали» сглажена ради естественности, тогда как риторическая форма обвинения и резкость исходной реплики сохранены.
