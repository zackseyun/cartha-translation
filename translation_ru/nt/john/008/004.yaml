lexical_decisions:
- source_word: λέγουσιν
  choice: сказали
  rationale: Историческое настоящее передано прошедшим временем, естественным для русского повествования.
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Прямое и общепонятное обращение, соответствующее греческому звательному падежу.
- source_word: κατείληπται
  choice: застали
  rationale: Греческий перфект пассивного залога обозначает уже совершившееся задержание, результат которого сохраняет значение в данной сцене; русское «застали» естественно выражает это в контексте.
- source_word: ἐπαυτοφώρῳ
  choice: прямо во время
  rationale: Передаёт идиоматическое значение поимки непосредственно при совершении поступка и сохраняет усилительный оттенок.
- source_word: μοιχευομένη
  choice: прелюбодеяния
  rationale: Причастие настоящего времени указывает, что женщину застали, когда она совершала прелюбодеяние; конструкция с «во время» естественна по-русски.
