base_translation:
  language: en
  yaml_path: translation/nt/john/008/050.yaml
  text: But I do not seek my own glory[b][a]; there is One who seeks it and judges.
translation:
  language: ru
  text: Я же не ищу своей славы; есть Тот, кто ищет её и судит.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «есть тот, кто ищет и судит». Объект при «ищет» в греческом тексте не выражен; подразумевается слава Иисуса из предыдущей части стиха. Из контекста обычно понимают, что речь идёт об Отце, хотя здесь греческий текст прямо Его не называет.'
    reason: Передаёт подразумеваемый объект глагола и сохраняет неназванность субъекта в греческом тексте.
lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: Я же
  rationale: Выраженное местоимение сохраняет смысловое ударение, а «же» естественно передаёт контраст, обозначенный δέ.
- source_word: οὐ ζητῶ
  choice: не ищу
  rationale: Простое настоящее время точно передаёт форму глагола и сохраняет лексическую связь с ζητῶν далее в стихе.
- source_word: τὴν δόξαν μου
  choice: славы Себе
  rationale: В данном контексте δόξα означает славу или почёт. Формулировка «славы Себе» естественно выражает отрицание стремления к собственной славе, не усиливая его словом «собственной» без необходимости.
- source_word: ἔστιν ὁ ζητῶν
  choice: есть Тот, Кто ищет её
  rationale: Субстантивированное причастие передано как «Тот, Кто». Местоимение «её» восполняет подразумеваемый объект — славу Иисуса — и делает русскую фразу естественной.
- source_word: καὶ κρίνων
  choice: и судит
  rationale: Координированное причастие естественно передано личной формой настоящего времени; «судит» сохраняет судебный оттенок κρίνω.
theological_decisions:
- issue: Кто является не названным прямо Тем, Кто ищет и судит
  choice: В основном тексте субъект оставлен как «Тот», без прямого отождествления с Отцом.
  alternative: «Есть Отец, Который ищет её и судит».
  rationale: Контекст позволяет понимать здесь Отца, однако греческий текст этого стиха прямо Его не называет. Перевод сохраняет намеренную недосказанность и не разрешает её за автора.
- issue: Подразумеваемый объект глагола ζητῶν
  choice: Добавлено «её», то есть славу Иисуса из предыдущей части предложения.
  alternative: 'Буквально: «есть Ищущий и Судящий».'
  rationale: Объект грамматически не выражен, но ясно восстанавливается из τὴν δόξαν μου. Его добавление необходимо для естественного современного русского языка и не меняет смысла.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Заглавные буквы в «Тот, Кто» указывают на божественного референта, подразумеваемого контекстом, но имя «Отец» в текст не внесено. Возвратное местоимение «Себе» написано с заглавной буквы в соответствии с принятым благоговейным оформлением речи о Христе.
