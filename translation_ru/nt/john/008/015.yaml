  yaml_path: translation/nt/john/008/015.yaml
  text: You judge according to the flesh[a]; I judge no one.
translation:
  language: ru
  text: Вы судите по плоти[a]; я никого не сужу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по человеческим меркам» или «по внешности».'
    reason: Лексические альтернативы передают вероятные контекстуальные оттенки κατὰ τὴν σάρκα, не устраняя неоднозначность основного текста.
lexical_decisions:
- source_word: ὑμεῖς
  choice: Вы
  rationale: Явно выраженное местоимение второго лица множественного числа создаёт контраст с ἐγώ; русское «Вы» естественно передаёт этот контраст.
- source_word: κατὰ τὴν σάρκα
  choice: по плоти
  rationale: 'Формально близкая и понятная в библейском контексте передача сохраняет многозначность выражения: речь может идти о человеческих, земных либо внешних критериях, но основной текст не сводит смысл лишь к одному толкованию.'
- source_word: κρίνετε
  choice: судите
  rationale: Настоящее время и прямое значение глагола переданы кратко и естественно.
- source_word: ἐγὼ
  choice: Я
  rationale: Явно выраженное местоимение подчёркивает противопоставление «Вы — Я».
- source_word: οὐ κρίνω οὐδένα
  choice: Я никого не сужу
  rationale: Такая конструкция естественна для современного русского языка и сохраняет краткость и силу отрицания.
theological_decisions:
- issue: Значение σάρξ в выражении κατὰ τὴν σάρκα
  choice: «по плоти» в основном тексте
  alternative: «по человеческим меркам»; «по внешности»
  rationale: Буквальная передача сохраняет характерную для Иоанна лексику и богословское напряжение, не подменяя неоднозначное выражение одним истолкованием. Более разъясняющие варианты вынесены в сноску.
- issue: Абсолютное звучание слов «Я никого не сужу»
  choice: Сохранено без поясняющей вставки
  alternative: Уточнить смысл как отсутствие суда в данной ситуации или суда по плоти
  rationale: Греческий текст формулирует утверждение без явного ограничения. Возможное согласование с ближайшим и более широким контекстом не следует вносить непосредственно в перевод.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественно-нейтральной формулировкой. Сохранено симметричное противопоставление «Вы…; Я…». Местоимение «Я» написано с прописной буквы как начало второй части предложения, без введения дополнительных конфессиональных формулировок.
