  text: ταῦτα αὐτοῦ λαλοῦντος πολλοὶ ἐπίστευσαν εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/030.yaml
  text: As he was saying these things[b][a], many believed in him.
translation:
  language: ru
  text: Пока он говорил всё это, многие поверили в него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уверовали в него».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: всё это
  rationale: Форма множественного числа указывает на содержание предшествующей речи. По-русски «всё это» естественно передаёт совокупность сказанного, не утяжеляя фразу буквальным «эти вещи».
- source_word: αὐτοῦ λαλοῦντος
  choice: пока он говорил
  rationale: 'Генитив абсолютный с причастием настоящего времени обозначает действие, продолжавшееся одновременно с главным: люди поверили в ходе его речи.'
- source_word: πολλοὶ
  choice: многие
  rationale: Субстантивированное прилагательное естественно передаётся без добавления слова «люди».
- source_word: ἐπίστευσαν
  choice: поверили
  rationale: Аорист представляет событие как целое. «Поверили» — современная и ясная передача; более традиционное «уверовали» приведено в сноске.
- source_word: εἰς αὐτόν
  choice: в него
  rationale: Сочетание πιστεύω с εἰς у Иоанна выражает направленное на Иисуса доверие, а не только согласие с его словами. Русское «поверили в него» сохраняет эту личностную направленность.
theological_decisions:
- issue: Передача πιστεύω εἰς αὐτόν в речи Иоанна
  choice: поверили в него
  alternative: поверили ему
  rationale: Предлог εἰς требует сохранить направленность веры на личность Иисуса. Вариант «поверили ему» мог бы сузить смысл до признания истинности его слов и стереть значимое отличие от конструкции с дательным падежом в следующем стихе.
- issue: Традиционная религиозная окраска глагола πιστεύω
  choice: поверили
  alternative: уверовали
  rationale: «Поверили» понятно современному читателю и вместе с дополнением «в него» передаёт религиозно-личностный смысл без искусственного усиления. «Уверовали» остаётся допустимым традиционным вариантом.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и повествовательная. Местоимения, относящиеся к Иисусу, даны со строчной буквы по общим нормам современного текста. Конструкция «пока… говорил» сохраняет одновременность и длительность действия исходного причастия.
