  text: διὰ τί τὴν λαλιὰν τὴν ἐμὴν οὐ γινώσκετε; ὅτι οὐ δύνασθε ἀκούειν τὸν λόγον τὸν ἐμόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/043.yaml
  text: Why do you not understand my way of speaking? Because you are not able to hear my word[a][b].
translation:
  language: ru
  text: Почему вы не понимаете того, как Я говорю[a]? Потому что вы не способны слышать Моё слово[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мою речь»; возможно также: «Мою манеру говорить». Греческое слово обозначает речь или способ говорить и отличается от слова, употреблённого далее в выражении «Моё слово».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не можете слышать Моё слово».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιὰν
  choice: что Я говорю
  rationale: Вопрос передаёт речь Иисуса как воспринимаемое выражение и остаётся естественным по-русски; отличие от λόγος во второй части сохраняется за счёт перевода «Моё слово».
- source_word: γινώσκετε
  choice: понимаете
  rationale: В данном контексте речь идёт о понимании речи Иисуса, а не просто о знании или узнавании.
- source_word: ἀκούειν
  choice: слышать
  rationale: Сохранено основное значение глагола; возможная идея принятия или послушного восприятия не внесена прямо в перевод.
- source_word: λόγον
  choice: слово
  rationale: «Слово» естественно обозначает сказанное Иисусом и сохраняет богословскую насыщенность λόγος, не сводя его однозначно к «учению» или «посланию».
- source_word: οὐ δύνασθε
  choice: не способны
  rationale: Формулировка прямо выражает неспособность, а не только нежелание, и при этом звучит естественно в современном русском языке.
- source_word: ὅτι
  choice: Потому что
  rationale: Союз вводит причину непонимания, названного в предыдущем вопросе.
- source_word: τὴν ἐμὴν / τὸν ἐμόν
  choice: Я / Моё
  rationale: При перестройке первой части принадлежность речи Иисусу передана личным местоимением, а во второй — притяжательным; смысл обоих греческих притяжательных местоимений сохранён.
theological_decisions:
- issue: Характер неспособности в словах «не способны слышать Моё слово»
  choice: Передать утверждение как реальную неспособность, не объясняя её богословский механизм.
  alternative: Истолковать её непосредственно как нравственное нежелание, судебное ожесточение либо духовную неспособность.
  rationale: Сам стих утверждает неспособность, но не даёт полного объяснения её природы; перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Заглавные буквы в местоимениях, относящихся к Иисусу, соответствуют распространённой русской библейской издательской традиции. Формулировка сохраняет различие между λαλιά и λόγος, насколько это возможно без неестественной буквальности.
