  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Νῦν ἐγνώκαμεν ὅτι δαιμόνιον ἔχεις. Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται, καὶ σὺ λέγεις· Ἐάν τις τὸν λόγον μου τηρήσῃ, οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/052.yaml
  text: The Jews said to him[a], “Now we know that you have a demon. Abraham died, and the prophets also, yet you say, ‘If anyone keeps my word[c][b], he will certainly never taste death forever.’”
translation:
  language: ru
  text: 'Иудеи сказали ему: «Теперь мы знаем, что в тебе бес. Авраам умер, и пророки тоже, а ты говоришь: „Кто соблюдает моё слово, тот вовек не вкусит смерти“».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не вкусит смерти вовек». Усиленное греческое отрицание означает, что он никогда не вкусит смерти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Прямое обозначение названной в тексте группы; варианты «иудейские вожди» и «жители Иудеи» добавляли бы отсутствующее в данном выражении уточнение.
- source_word: Νῦν ἐγνώκαμεν
  choice: Теперь мы знаем
  rationale: Естественно передаёт достигнутое понимание как наличное состояние.
- source_word: δαιμόνιον ἔχεις
  choice: в тебе бес
  rationale: Естественная русская передача буквального «ты имеешь беса», не сводящая выражение к более интерпретирующему «ты одержим».
- source_word: Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται
  choice: Авраам умер, и пророки тоже
  rationale: Передаёт простой факт смерти и присоединительное значение καί.
- source_word: καὶ σὺ λέγεις
  choice: а ты говоришь
  rationale: Союз «а» естественно выражает контраст с предшествующим утверждением.
- source_word: Ἐάν τις
  choice: Кто
  rationale: В русском обобщённо-условная конструкция «кто..., тот...» естественно передаёт греческое «если кто».
- source_word: τὸν λόγον μου τηρήσῃ
  choice: соблюдает моё слово
  rationale: «Слово» сохраняет λόγος, а «соблюдает» передаёт τηρέω, не сужая его до одного лишь послушания.
- source_word: οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα
  choice: вовек не вкусит смерти
  rationale: «Не вкусит» сохраняет метафору, οὐ μή передано решительным отрицанием, а «вовек» естественно распространяет отрицание на всё будущее.
theological_decisions:
- issue: Смысл обещания о смерти
  choice: Сохранить образное выражение «не вкусит смерти» без поясняющего истолкования.
  alternative: Перевести как «не испытает духовной/вечной смерти» либо понять только как физическую смерть.
  rationale: Контекст допускает напряжение между буквальным пониманием оппонентов и более глубоким смыслом слов Иисуса; перевод не должен заранее разрешать эту многослойность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Иудеи» сохраняет прямую форму источника; «в тебе бес» звучит естественнее буквального «ты имеешь беса». Конструкция «кто..., тот...» обеспечивает ясность обобщённого условия. Маркер сноски поставлен после всей цитаты, к которой относится пояснение.
