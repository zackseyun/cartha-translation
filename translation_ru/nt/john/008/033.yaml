  text: ἀπεκρίθησαν ⸂πρὸς αὐτόν⸃· Σπέρμα Ἀβραάμ ἐσμεν καὶ οὐδενὶ δεδουλεύκαμεν πώποτε· πῶς σὺ λέγεις ὅτι Ἐλεύθεροι γενήσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/033.yaml
  text: They answered him[a], “We are Abraham’s offspring and have never been enslaved to anyone. How can you say[c][b], ‘You will become free’?”
translation:
  language: ru
  text: 'Они ответили Ему: «Мы — потомки Авраама[a] и никогда никому не были рабами[b]. Как же Ты говоришь: „Станете свободными“[c]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «семя Авраама». В греческом употреблено существительное в единственном числе с собирательным значением, обозначающее происхождение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «никому не служили». Здесь глагол может означать служение, однако противопоставление свободе подчёркивает смысл рабской зависимости.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «будете свободными». Более буквально греческий текст означает «станете свободными».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν πρὸς αὐτόν
  choice: Они ответили Ему
  rationale: Естественная русская передача прямого ответа, обращённого к Иисусу; сочетание с «Ему» сохраняет адресата.
- source_word: Σπέρμα Ἀβραάμ
  choice: потомки Авраама
  rationale: Греческое σπέρμα употреблено как собирательное обозначение физического происхождения. «Потомки» ясно и естественно передаёт этот смысл в современном русском языке.
- source_word: οὐδενὶ δεδουλεύκαμεν πώποτε
  choice: никогда никому не были рабами
  rationale: Перфект δεδουλεύκαμεν и контраст со свободой указывают на состояние рабской зависимости. Русская конструкция естественна и сохраняет усиление πώποτε в форме «никогда».
- source_word: πῶς σὺ λέγεις
  choice: Как же Ты говоришь
  rationale: Частица «же» естественно передаёт недоумение и возражение, а местоимение «Ты» отражает выраженное в греческом σὺ.
- source_word: Ἐλεύθεροι γενήσεσθε
  choice: Станете свободными
  rationale: «Станете» сохраняет значение перехода в новое состояние, выраженное γενήσεσθε, а «свободными» точно передаёт ἐλεύθεροι.
theological_decisions:
- issue: Передача δουλεύω в контексте противопоставления рабства и свободы
  choice: были рабами
  alternative: служили
  rationale: В ближайшем контексте (Ин. 8:34–36) речь идёт именно о рабстве и освобождении. Выбор сохраняет социальную и богословскую силу образа, не сводя глагол к общему значению служения.
- issue: Передача Σπέρμα Ἀβραάμ
  choice: потомки Авраама
  alternative: семя Авраама
  rationale: Фраза выражает притязание на физическое происхождение от Авраама. «Потомки» не привносит дополнительных богословских выводов, а примечание сохраняет буквальный собирательный образ.
translation_notes:
  register: Современный литературный русский язык с ясной, dignified диалогической формой. Заглавные местоимения при обращении к Иисусу соответствуют принятой русской библейской традиции. Формулировка сохраняет недоумение говорящих и переходное значение «станете», не разрешая подразумеваемое напряжение между их историческим утверждением и духовным смыслом последующего ответа.
