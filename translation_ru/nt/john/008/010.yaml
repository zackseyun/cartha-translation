  text: Ἀνακύψας δὲ ὁ Ἰησοῦς, καὶ μηδένα θεασάμενος πλὴν τῆς γυναικός, εἶπεν αὐτῇ, Ἡ γυνή, ποῦ εἰσιν ἐκεῖνοι οἱ κατήγοροί σου; Οὐδείς σε κατέκρινεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/010.yaml
  text: Then Jesus[a] straightened up, and seeing no one except the woman, said to her, "Woman, where are those accusers of yours? Has no one condemned you?"
translation:
  language: ru
  text: 'Иисус[a] выпрямился и, не увидев никого, кроме женщины, сказал ей: «Женщина, где те, твои обвинители? Никто тебя не осудил?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот стих входит в рассказ о женщине, пойманной в прелюбодеянии (Ин. 7:53–8:11), которого нет в наиболее ранних греческих рукописях. См. примечание к Ин. 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνακύψας
  choice: выпрямился
  rationale: Передаёт изменение положения тела Иисуса после того, как Он наклонился и писал на земле; естественнее и точнее по контексту, чем «встал» или «поднял голову».
- source_word: θεασάμενος
  choice: не увидев
  rationale: Передаёт зрительное восприятие, выраженное аористным причастием; отрицательная конструкция сохранена в соответствии с греческим текстом.
- source_word: οἱ κατήγοροί σου
  choice: те, кто обвинял тебя
  rationale: Естественная современная формулировка, сохраняющая юридический оттенок существительного «обвинители» без излишне канцелярского звучания.
- source_word: κατέκρινεν
  choice: осудил
  rationale: В данном судебном контексте означает вынесение обвинительного решения, а не просто суждение или порицание.
theological_decisions:
- issue: Текстологический статус Ин 7:53–8:11
  choice: Сохранить стих в основном тексте и обозначить сноской его рукописную историю
  alternative: Исключить отрывок из основного текста или заключить его в скобки
  rationale: Заданная византийская редакция содержит этот стих, однако для открытости перед читателем важно отметить отсутствие всего отрывка в наиболее ранних греческих рукописях.
translation_notes:
  register: Современный литературный русский язык; речь ясная и достойная. Обращение «Женщина» сохраняет греческое γυνή и в данном контексте не является грубым.
