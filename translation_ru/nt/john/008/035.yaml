id: JHN.8.35
reference: John 8:35
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ δοῦλος οὐ μένει ἐν τῇ οἰκίᾳ εἰς τὸν αἰῶνα· ⸀ὁ υἱὸς μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/035.yaml
  text: The servant does not remain in the household forever[b][a]; the son remains forever.
translation:
  language: ru
  text: Раб[a] не остаётся в доме навсегда; сын[b] остаётся навсегда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «слуга»; греческое слово может иметь оба значения, но здесь «раб» яснее передаёт противопоставление статусов раба и сына в доме.
    reason: lexical_alternative
  - marker: b
    text: В контексте слово «сын» может также косвенно указывать на Иисуса, хотя само высказывание имеет форму общего изречения.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: раб
  rationale: Передаёт несвободное и зависимое положение δοῦλος и ясно сохраняет противопоставление сыну; «слуга» могло бы ослабить различие в статусе.
- source_word: μένει
  choice: остаётся
  rationale: Естественное современное соответствие, повторённое в обеих частях стиха ради сохранения структуры и смыслового контраста.
- source_word: οἰκία
  choice: дом
  rationale: «Дом» естественно обозначает здесь не только здание, но и семейный круг, к которому человек принадлежит; это сохраняет конкретность греческого слова и смысл положения внутри дома.
- source_word: εἰς τὸν αἰῶνα
  choice: навсегда
  rationale: Идиоматично передаёт неограниченную длительность и повторяется в обеих частях.
- source_word: υἱός
  choice: сын
  rationale: Сохраняет мужской род и противопоставление рабу в контексте принадлежности к дому и постоянного положения в нём.
- source_word: δέ
  choice: не выражено отдельным словом
  rationale: Контраст и развитие мысли достаточно переданы сопоставлением двух частей; добавление «но» или «же» перед первой частью по-русски могло бы звучать зависимо от предыдущего предложения и сильнее конкретизировать оттенок частицы.
theological_decisions:
- issue: Возможный христологический смысл слова «сын»
  choice: 'Написано со строчной буквы: «сын»'
  alternative: «Сын» с прописной буквы как прямой титул Иисуса
  rationale: Высказывание имеет форму общего изречения о положении раба и сына в доме, но в контексте может одновременно указывать на Иисуса. Строчная буква сохраняет эту смысловую напряжённость и не превращает возможный подтекст в однозначный титул.
translation_notes:
  register: Современный литературный русский язык; краткая, симметричная и достойная формулировка. Повтор «остаётся… навсегда» намеренно сохраняет параллелизм греческого текста. «В доме» звучит естественнее, чем отвлечённое «в домохозяйстве», и в данном контексте включает смысл принадлежности к семье.
