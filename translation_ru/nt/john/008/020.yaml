base_translation:
  language: en
  yaml_path: translation/nt/john/008/020.yaml
  text: He spoke these words in the treasury while teaching in the temple[a], and no one seized him[b], because his hour had not yet come.
translation:
  language: ru
  text: Эти слова Он сказал в сокровищнице, когда учил в храме[a]. И никто не схватил Его, потому что час Его ещё не настал[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на территории храма»; греческое слово обозначает весь храмовый комплекс, а не только внутреннее святилище.'
    reason: lexical_alternative
  - marker: b
    text: 'В Евангелии от Иоанна выражение «час Его» связано с назначенным временем страданий и прославления Иисуса; возможный перевод: «назначенный Ему час».'
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα τὰ ῥήματα
  choice: Эти слова
  rationale: Передаёт непосредственную отсылку к предшествующей речи и естественно звучит по-русски.
- source_word: ἐλάλησεν
  choice: произнёс
  rationale: В сочетании со «словами» это естественная русская передача значения «говорить, произносить» без добавления смысла.
- source_word: ἐν τῷ γαζοφυλακίῳ
  choice: у сокровищницы
  rationale: Термин может обозначать храмовую сокровищницу или связанную с ней зону. Предлог «у» естественно указывает на место служения и избегает представления, будто Иисус находился внутри хранилища.
- source_word: διδάσκων
  choice: когда учил
  rationale: Передаёт одновременность причастного оборота с основным действием в естественном современном русском синтаксисе.
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: Краткая традиционная передача; греческое ἱερόν обозначает весь храмовый комплекс, что уточнено в сноске.
- source_word: ἐπίασεν
  choice: схватил
  rationale: Сохраняет физический и враждебный оттенок πιάζω, не сужая значение до формально-юридического «арестовал».
- source_word: οὔπω ἐληλύθει
  choice: ещё не пришёл
  rationale: Естественно передаёт плюсквамперфект в данном повествовательном контексте и сохраняет характерную образность Иоанна.
- source_word: ἡ ὥρα αὐτοῦ
  choice: час Его
  rationale: Буквальная формулировка сохраняет богословски значимый мотив «часа» в Евангелии от Иоанна.
theological_decisions:
- issue: Иоанново употребление выражения «час Его»
  choice: Сохранить буквальное выражение «час Его» в основном тексте.
  alternative: назначенный Ему час; Его время
  rationale: Выражение у Иоанна указывает на предопределённое время решающих страданий и прославления Иисуса. Буквальная передача сохраняет тематическое напряжение и не сводит фразу к простой хронологической отметке.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно возвышенный. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской практикой; смысловые неоднозначности не устранены.
