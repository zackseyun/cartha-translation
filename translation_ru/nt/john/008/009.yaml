source:
  edition: robinson-pierpont-2005-byzantine
  text: Οἱ δὲ ἀκούσαντες, καὶ ὑπὸ τῆς συνειδήσεως ἐλεγχόμενοι, ἐξήρχοντο εἷς καθ' εἷς, ἀρξάμενοι ἀπὸ τῶν πρεσβυτέρων ἕως τῶν ἐσχάτων· καὶ κατελείφθη μόνος ὁ Ἰησοῦς, καὶ ἡ γυνὴ ἐν μέσῳ ἑστῶσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/009.yaml
  text: But those[a] who heard it, being convicted by their conscience, went out one by one, beginning with the older ones down to the last. And Jesus was left alone, with the woman standing in the midst.
translation:
  language: ru
  text: Услышав это,[a] они, обличаемые совестью, стали уходить один за другим, начиная со старших и вплоть до последних. Иисус остался один, а женщина стояла посреди.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Продолжение рассказа о женщине, взятой в прелюбодеянии (Ин. 7:53–8:11). См. примечание к Ин. 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: συνείδησις
  choice: совесть
  rationale: Обычное и точное русское обозначение внутренней нравственной способности различать добро и зло и свидетельствовать о виновности человека.
- source_word: ἐλέγχω
  choice: обличаемые
  rationale: Передаёт выявление и осознание вины под воздействием совести, не сводя смысл лишь к внешнему упрёку или судебному осуждению.
- source_word: πρεσβύτερος
  choice: старшие
  rationale: В данном противопоставлении речь естественнее понимать как старшинство по возрасту или положению, а не как формальную должность пресвитера.
- source_word: ἕως τῶν ἐσχάτων
  choice: вплоть до последних
  rationale: Сохраняет множественное число и обозначает последовательность уходивших, не уточняя, были ли «последние» именно самыми молодыми.
- source_word: ἐν μέσῳ
  choice: посреди
  rationale: Сохраняет пространственную формулировку оригинала без добавления неуказанного объекта, например «собравшихся».
theological_decisions:
- issue: Кем были «старшие» и «последние»
  choice: Сохранить общее обозначение «старшие… последние»
  alternative: «Старики… молодые» или «старейшины… остальные»
  rationale: Греческий текст не называет последних молодыми и не требует понимать старших как должностных лиц; перевод сохраняет эту неоднозначность.
- issue: Фраза о том, что Иисус остался один, при присутствии женщины
  choice: «Иисус остался один, а женщина стояла посреди»
  alternative: «Остались только Иисус и женщина»
  rationale: Так сохраняются грамматическое выделение Иисуса словом μόνος и отдельное упоминание женщины, не устраняя напряжение исходной формулировки.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Стали уходить» естественно передаёт продолженное действие имперфекта ἐξήρχοντο; порядок «один за другим» сохраняет εἷς καθ’ εἷς.
