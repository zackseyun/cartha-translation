  text: ὑμεῖς ποιεῖτε τὰ ἔργα τοῦ πατρὸς ὑμῶν. ⸀εἶπαν αὐτῷ· Ἡμεῖς ἐκ πορνείας ⸂οὐ γεγεννήμεθα⸃· ἕνα πατέρα ἔχομεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/041.yaml
  text: You are doing the works of your father.” They said to him[a], “We were not born of sexual immorality; we have one Father—God.”
translation:
  language: ru
  text: 'Вы делаете дела вашего отца». Они сказали Ему: «Мы не рождены от блуда[a]. У нас один Отец — Бог».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мы не незаконнорождённые». Буквально по-гречески: «Мы не рождены от блуда».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖτε
  choice: делаете
  rationale: Настоящее время передаёт совершаемое ими действие; русское «делаете» естественно и сохраняет связь с существительным «дела».
- source_word: τὰ ἔργα
  choice: дела
  rationale: «Дела» — обычный и уместный эквивалент ἔργα, сохраняющий характерную для Иоанна связь между действием и происхождением.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: вашего отца
  rationale: Сохраняет буквальный образ отцовства и намеренную напряжённость вопроса о духовном происхождении.
- source_word: ἐκ πορνείας
  choice: от блуда
  rationale: Кратко и близко передаёт исходную конструкцию ἐκ с указанием происхождения; «блуд» в современном литературном библейском регистре обозначает недозволенную половую связь, не сводя выражение сразу к незаконнорождённости.
- source_word: οὐ γεγεννήμεθα
  choice: мы рождены не
  rationale: Русская краткая страдательная форма естественно передаёт результативное состояние греческого перфекта, а положение отрицания позволяет связать его прежде всего с «от блуда».
- source_word: ἕνα πατέρα ἔχομεν
  choice: у нас один Отец
  rationale: Естественная русская конструкция выражает обладание и подчёркивает единственность Отца.
- source_word: τὸν θεόν
  choice: Бог
  rationale: Именная конструкция после тире естественно передаёт приложение, отождествляющее единственного Отца с Богом.
theological_decisions:
- issue: Следует ли раскрыть ἐκ πορνείας как прямое утверждение о незаконнорождённости
  choice: Сохранить в основном тексте образ рождения «от блуда»
  alternative: Мы не незаконнорождённые
  rationale: Греческое выражение может подразумевать отрицание незаконнорождённости и содержать полемический намёк, однако буквальная формулировка говорит о рождении ἐκ πορνείας. Основной текст сохраняет эту неоднозначность, а примечание поясняет идиоматический смысл.
- issue: Отцовство в выражении τοῦ πατρὸς ὑμῶν
  choice: вашего отца
  alternative: вашего праотца
  rationale: «Отец» сохраняет развивающуюся в отрывке богословскую напряжённость между физическим происхождением, духовным родством и Богом как Отцом, не предрешая референта в самом этом предложении.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Местоимение «Ему» написано с прописной буквы согласно устойчивой русской библейской традиции; «Отец» также с прописной, поскольку далее прямо отождествлён с Богом. Тире ясно передаёт приложение «Бог».
