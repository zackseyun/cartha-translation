  text: Ἀβραὰμ ὁ πατὴρ ὑμῶν ἠγαλλιάσατο ἵνα ἴδῃ τὴν ἡμέραν τὴν ἐμήν, καὶ εἶδεν καὶ ἐχάρη.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/056.yaml
  text: Abraham your father rejoiced to see my day[b][a]; he saw it and was glad.
translation:
  language: ru
  text: Авраам, ваш отец, ликовал, ожидая увидеть мой день[a][b]; он увидел его и обрадовался.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «ликовал, чтобы увидеть мой день» или «ликовал о том, что увидит мой день». Греческая конструкция с ἵνα допускает несколько близких смысловых оттенков.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «мой день» может в широком смысле относиться к мессианскому дню Иисуса или к исполнению Его миссии; сам стих не уточняет, какое именно событие или время имеется в виду.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀβραὰμ ὁ πατὴρ ὑμῶν
  choice: Авраам, ваш отец
  rationale: Сохраняет имя и обращение к собеседникам, а также близкий к греческому порядку слов акцент на Аврааме; приложение звучит естественно по-русски.
- source_word: ἠγαλλιάσατο
  choice: ликовал
  rationale: Глагол передаёт сильную, восторженную радость; «ликовал» сохраняет эту интенсивность и отличается от последующего ἐχάρη.
- source_word: ἵνα ἴδῃ
  choice: ожидая увидеть
  rationale: Естественно выражает направленность радости Авраама к предстоящему видению, не превращая ἵνα однозначно только в цель или только в содержание; близкие варианты отмечены в сноске.
- source_word: τὴν ἡμέραν τὴν ἐμήν
  choice: мой день
  rationale: Буквально и ёмко сохраняет богословски насыщенное, но не уточнённое самим стихом выражение.
- source_word: καὶ εἶδεν
  choice: он увидел его
  rationale: Местоимение «его» естественно восстанавливает подразумеваемое дополнение — «день» — без добавления нового содержания.
- source_word: καὶ ἐχάρη
  choice: и обрадовался
  rationale: Передаёт χαίρω обычным современным словом и сохраняет различие с более сильным «ликовал» в первой части стиха.
theological_decisions:
- issue: Смысл выражения «мой день»
  choice: Сохранить буквальное выражение «мой день», не уточняя событие или период.
  alternative: Земное служение Иисуса; мессианское исполнение; смерть и воскресение; день окончательного явления Христа.
  rationale: Сам стих не определяет точнее, какой аспект мессианского дня имеется в виду; перевод не должен снимать эту богословскую многозначность.
- issue: Смысловой оттенок ἵνα в выражении о радости Авраама
  choice: 'Передать как направленное в будущее ожидание: «ликовал, ожидая увидеть».'
  alternative: 'Цель: «ликовал, чтобы увидеть»; содержание: «ликовал о том, что увидит»; инфинитивная связь: «ликовал, желая увидеть».'
  rationale: Греческая конструкция допускает несколько тесно связанных оттенков. Основной текст должен быть естественным по-русски, а сноска сохраняет реальную грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным, но не архаичным звучанием. «Ликовал» оправдано силой исходного глагола; «обрадовался» создаёт естественный контраст. Местоимение «мой» набрано со строчной буквы, поскольку греческое письмо не кодирует особого богословского регистра заглавной буквой.
