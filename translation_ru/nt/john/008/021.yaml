  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς· Ἐγὼ ὑπάγω καὶ ζητήσετέ με, καὶ ἐν τῇ ἁμαρτίᾳ ὑμῶν ἀποθανεῖσθε· ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/021.yaml
  text: So he said to them again[a], “I am going away, and you will seek me, and you will die in your sin. Where I am going[c][b], you are not able to come.”
translation:
  language: ru
  text: 'Итак, он снова сказал им: «Я ухожу, и вы будете искать меня[a], и умрёте в вашем грехе[b]. Куда я ухожу, вы не можете прийти».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будете разыскивать меня». Глагол может обозначать поиски человека, а в Евангелии от Иоанна также допускает более глубокий духовный смысл.'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте слово «грех» стоит в единственном числе. Это может подчёркивать продолжающееся состояние, а не отдельные греховные поступки.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: итак
  rationale: Передаёт связь с предшествующим разговором и естественно вводит продолжение речи, не превращая эту связь в чрезмерно жёсткий причинный вывод.
- source_word: πάλιν
  choice: снова
  rationale: Естественно и точно передаёт повторность действия.
- source_word: ὑπάγω
  choice: ухожу
  rationale: Передаёт настоящее время и оттенок удаления или отбытия; в контексте Иоанна сохраняет более глубокий смысл ухода Иисуса, не разъясняя его прямо в основном тексте.
- source_word: ζητήσετέ με
  choice: будете искать меня
  rationale: Глагол ζητέω означает искать или разыскивать; «искать» сохраняет как буквальный, так и возможный духовный смысл.
- source_word: ἐν τῇ ἁμαρτίᾳ ὑμῶν
  choice: в своём грехе
  rationale: Сохраняет единственное число ἁμαρτίᾳ и естественно передаёт отнесённость греха к адресатам. Формулировка допускает понимание греха как продолжающегося состояния, а не только как отдельных поступков.
- source_word: ἀποθανεῖσθε
  choice: умрёте
  rationale: Прямой и естественный эквивалент будущей формы греческого глагола.
- source_word: ὅπου ἐγὼ ὑπάγω
  choice: куда я ухожу
  rationale: В русском языке направление движения естественно выражается словом «куда»; повторение «ухожу» сохраняет лексическую связь с первой частью стиха.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: вы не можете прийти
  rationale: Сохраняет выраженную глаголом δύνασθε невозможность или неспособность прийти и звучит естественно по-русски.
theological_decisions:
- issue: Единственное число ἁμαρτίᾳ
  choice: «в своём грехе»
  alternative: «в своих грехах»
  rationale: В греческом тексте стоит единственное число. Его сохранение не сводит высказывание к перечню отдельных проступков и оставляет открытым характерный для Иоанна смысл пребывания в грехе, не вводя это толкование в основной текст.
- issue: Смысл ухода Иисуса в ὑπάγω
  choice: «Я ухожу»
  alternative: «Я удаляюсь» / «Я отправляюсь»
  rationale: '«Ухожу» естественно обозначает отбытие и при этом сохраняет богословскую многозначность: ближайший контекст не требует прямо называть смерть, воскресение или возвращение к Отцу.'
- issue: Характер невозможности в οὐ δύνασθε ἐλθεῖν
  choice: «вы не можете прийти»
  alternative: «вы не сможете прийти»
  rationale: Настоящее время «не можете» точнее соответствует δύνασθε и оставляет без дополнительного толкования вопрос о причине этой невозможности.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-достоинственным синтаксисом. Местоимения, относящиеся к Иисусу, написаны со строчной буквы по общим современным нормам; смыслового или богословского снижения это не предполагает. Союз «и» перед «умрёте» сохранён в соответствии с греческим текстом, без замены на толковательное «но».
