  text: But Jesus[a] went to the Mount of Olives.
translation:
  language: ru
  text: Иисус же[a] пошёл на Масличную гору.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот стих продолжает рассказ о женщине, застигнутой в прелюбодеянии (Ин. 7:53–8:11). Текстологические свидетельства см. в примечании к Ин. 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: πορεύομαι
  choice: пошёл
  rationale: Аорист ἐπορεύθη здесь имеет активное значение и обозначает простое направленное движение; «пошёл» естественно передаёт его в современном русском языке.
- source_word: ὄρος
  choice: гора
  rationale: В сочетании с τῶν Ἐλαιῶν передаётся общепринятым русским географическим названием «Масличная гора».
- source_word: ἐλαία
  choice: Масличная
  rationale: Родительный падеж множественного числа τῶν Ἐλαιῶν буквально связан с маслинами или масличными деревьями; традиционное русское название «Масличная гора» точно и узнаваемо.
- source_word: δέ
  choice: же
  rationale: 'Частица отмечает переход и одновременно противопоставляет действие Иисуса предыдущему сообщению: другие разошлись по домам, Иисус же пошёл на Масличную гору.'
theological_decisions: []
translation_notes:
