  source_fidelity: '«Чтобы найти основание обвинить Его» несколько отходит от ἵνα ἔχωσιν κατηγορίαν κατ’ αὐτοῦ: в греческом сказано, что они стремились «иметь обвинение против Него», без добавления действия «найти». «Писал пальцем на земле» точнее передаёт εἰς τὴν γῆν, чем «по земле». Остальные элементы, включая несовершенный вид «писал» и широкое значение μὴ προσποιούμενος, переданы верно.'
  naturalness: Исправленный текст сохраняет современный литературный и сдержанно библейский регистр. «Чтобы иметь обвинение против Него» естественно в данном юридическом контексте и точнее, чем перифраза с «основанием обвинить».
  terminology: «Испытывая» допустимо для πειράζοντες и передаёт враждебную проверку без излишней интерпретации. «Обвинение против Него» сохраняет юридический оттенок κατηγορία. Имя Иисус и традиционное почтительное написание «Его» употреблены последовательно.
