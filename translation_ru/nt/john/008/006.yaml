    rationale: ἔχωσιν означает «имели», а не «нашли»; «основание обвинить» также менее непосредственно передаёт κατηγορίαν κατ’ αὐτοῦ, чем «обвинение против Него».
  - severity: low
    issue: Предлог «по» в выражении «писал пальцем по земле» неточно обозначает поверхность письма.
    rationale: В русском «писать на земле» яснее и ближе к εἰς τὴν γῆν («на земле»).
