  text: Τοῦτο δὲ ἔλεγον πειράζοντες αὐτόν, ἵνα ἔχωσιν κατηγορίαν κατ' αὐτοῦ. Ὁ δὲ Ἰησοῦς κάτω κύψας, τῷ δακτύλῳ ἔγραφεν εἰς τὴν γῆν, μὴ προσποιούμενος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/006.yaml
  text: They[a] were saying this to test him, so that they might have an accusation against him. But Jesus, bending down, wrote on the ground with his finger, paying no attention.
translation:
  language: ru
  text: Они[a] говорили это, испытывая Его, чтобы иметь обвинение против Него. Но Иисус, наклонившись, писал пальцем на земле, не обращая на них внимания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Продолжение рассказа о женщине, уличённой в прелюбодеянии (Ин. 7:53–8:11). Этот рассказ отсутствует во многих ранних греческих рукописях; в некоторых рукописях он помещён в другом месте. См. примечание к Ин. 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: πειράζοντες
  choice: испытывая
  rationale: Передаёт намеренную проверку Иисуса с целью поставить Его в затруднительное положение, не сводя значение ни к нейтральной проверке, ни исключительно к искушению.
- source_word: κατηγορίαν κατ' αὐτοῦ
  choice: основание обвинить Его
  rationale: Естественно по-русски выражает цель противников — получить повод или материал для обвинения; конструкция сохраняет юридический оттенок κατηγορία.
- source_word: κάτω κύψας
  choice: наклонившись
  rationale: Кратко и естественно передаёт сопутствующее действие аористного причастия.
- source_word: ἔγραφεν εἰς τὴν γῆν
  choice: писал … по земле
  rationale: Имперфект передан длительным «писал»; «по земле» является естественным русским обозначением поверхности письма.
- source_word: μὴ προσποιούμενος
  choice: не обращая на них внимания
  rationale: Передаёт смысл намеренного невнимания, засвидетельствованный данной византийской формой текста, без более узкого уточнения «как будто не слышал».
theological_decisions:
- issue: Текстовый статус рассказа Ин 7:53–8:11
  choice: Сохранить стих в основном тексте и отметить текстологическую проблему в сноске.
  alternative: Опустить рассказ или заключить его в скобки.
  rationale: Предоставленный источник Robinson–Pierpont 2005 Byzantine включает этот текст; примечание честно сообщает читателю о его отсутствии в ряде ранних рукописей, не решая вопрос молча.
- issue: Неуказанный объект выражения μὴ προσποιούμενος
  choice: «не обращая на них внимания»
  alternative: «делая вид, будто не слышит»
  rationale: Греческий текст не уточняет непосредственно слух; выбранная формулировка сохраняет более широкое значение и не добавляет лишней детали.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинный. Заглавная буква в местоимении «Его» следует принятому русскому библейскому стилю. Причастные конструкции сохранены там, где они звучат естественно; причинно-целевая связь выражена без перегрузки канцеляризмами.
