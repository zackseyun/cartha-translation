source:
  edition: SBLGNT
  text: καὶ ἐν τῷ νόμῳ δὲ τῷ ὑμετέρῳ γέγραπται ὅτι δύο ἀνθρώπων ἡ μαρτυρία ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/017.yaml
  text: And even in your law it is written that the testimony of two men is true[a].
translation:
  language: ru
  text: И в вашем законе написано, что свидетельство двух людей истинно.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νόμῳ
  choice: законе
  rationale: Здесь νόμος обозначает авторитетный для собеседников Иисуса закон, к которому Он обращается; строчная буква сохраняет непосредственный юридико-писанийный смысл и не сужает его до формального названия Пятикнижия.
- source_word: ὑμετέρῳ
  choice: вашем
  rationale: Притяжательное местоимение передаёт риторическое дистанцирование в прямом обращении, не усиливая его добавлением «вашем собственном».
- source_word: γέγραπται
  choice: написано
  rationale: Обычная русская формула ссылки на Писание естественно передаёт перфект страдательного залога и сохраняет смысл продолжающей действовать записи.
- source_word: δύο ἀνθρώπων
  choice: двух людей
  rationale: ἄνθρωπος обозначает человека и в данном юридическом изречении — человеческих свидетелей. Русское «двух людей» точно и естественно передаёт родительный оборот, не внося не требуемого контекстом ограничения только мужчинами.
- source_word: μαρτυρία
  choice: свидетельство
  rationale: Слово сохраняет судебный оттенок и естественно сочетается с оборотом «двух людей».
- source_word: ἀληθής
  choice: истинно
  rationale: Передаёт прямое значение «истинно»; подразумеваемая юридическая действительность свидетельства остаётся неявной, как и в греческом тексте.
- source_word: καὶ ... δὲ
  choice: И
  rationale: В данном контексте сочетание служит связкой с лёгким усилением. Русское «И» звучит естественно; добавление «даже» могло бы придать фразе более резкий акцент, чем требуется.
theological_decisions:
- issue: Риторическая сила выражения «в вашем законе»
  choice: Сохранить прямое «в вашем законе» без смягчения.
  alternative: «в законе»; «в вашем собственном законе»
  rationale: Греческий текст явно содержит притяжательное ὑμετέρῳ. Такой перевод удерживает напряжение речи, но не превращает его в утверждение, будто Иисус отвергает закон.
- issue: Значение ἀνθρώπων в юридическом изречении
  choice: «двух людей»
  alternative: «двух мужчин»; «двоих»
  rationale: Форма ἀνθρώπων грамматически не обозначает исключительно мужчин и в формуле касается человеческих свидетелей вообще. «Людей» сохраняет этот объём значения без конфессионального или доктринального уточнения.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и понятная формулировка с сохранением юридического оттенка и риторического «вашем».
