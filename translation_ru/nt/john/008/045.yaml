  yaml_path: translation/nt/john/008/045.yaml
  text: But because I tell the truth[a], you do not believe me.
translation:
  language: ru
  text: А поскольку Я говорю истину, вы Мне не верите.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более формально: «А Я, потому что говорю истину, — вы Мне не верите». Греческий союз допускает передачу словом «что», однако здесь он, вероятнее всего, имеет причинный смысл: «поскольку».'
    reason: лексическая и синтаксическая альтернатива
lexical_decisions:
- source_word: ἐγὼ
  choice: Я
  rationale: Явно выраженное местоимение сохраняет смысловое ударение и противопоставление Иисуса тем, к кому Он обращается.
- source_word: δὲ
  choice: А
  rationale: Союз обозначает противопоставление предыдущей мысли; русское «а» естественно связывает стих с контекстом и не делает контраст чрезмерно резким.
- source_word: ὅτι
  choice: поскольку
  rationale: 'В данном построении союз лучше понимать причинно: слушатели не верят Иисусу именно потому, что Он говорит истину. «Поскольку» ясно передаёт эту связь и сохраняет достоинство речи.'
- source_word: τὴν ἀλήθειαν
  choice: истину
  rationale: Это прямой и устойчивый русский эквивалент; отсутствие артикля в русском языке не меняет определённости понятия в контексте.
- source_word: λέγω
  choice: говорю
  rationale: Настоящее время и обычное значение глагола переданы прямо; сочетание «говорю истину» естественно для литературного русского языка и ближе к форме оригинала, чем «рассказываю правду».
- source_word: οὐ πιστεύετέ μοι
  choice: вы Мне не верите
  rationale: Глагол с дательным дополнением означает верить кому-либо; перевод сохраняет личную направленность недоверия и порядок с отрицанием.
theological_decisions:
- issue: Значение ὅτι и связь истинной речи Иисуса с неверием слушателей
  choice: 'Причинное: «поскольку Я говорю истину»'
  alternative: 'Изъяснительное или более формальное: «что Я говорю истину»'
  rationale: 'Ближайший контекст и противопоставление предыдущему стиху поддерживают причинное понимание: истинность слов Иисуса оказывается причиной, по которой собеседники отвергают Его. Это сохраняет напряжение и иронию текста, не добавляя конфессионального толкования.'
translation_notes:
  register: Современный литературный русский язык; тон краткий и достойный. Заглавные формы «Я», «Мне» применены как традиционное уважительное оформление местоимений, относящихся к Иисусу. Причинная связь выражена естественно, без сглаживания резкой логики высказывания.
