  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐάν τις τὸν ⸂ἐμὸν λόγον⸃ τηρήσῃ, θάνατον οὐ μὴ θεωρήσῃ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/051.yaml
  text: Truly, truly, I say to you, if anyone keeps my word, he will certainly never see death forever.
translation:
  language: ru
  text: 'Истинно, истинно говорю вам: кто соблюдёт Моё слово, тот не увидит смерти вовек.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Истинно, истинно
  rationale: Сохраняет торжественное удвоение и традиционную, понятную современному читателю формулу особого заверения.
- source_word: τηρήσῃ
  choice: сохранит
  rationale: Передаёт идею верного соблюдения и удержания слова, не сводя смысл только к слушанию или внешнему исполнению.
- source_word: τὸν ἐμὸν λόγον
  choice: Моё слово
  rationale: Естественный русский эквивалент для учения или сказанного Иисусом; единственное число оригинала сохранено.
- source_word: θάνατον ... θεωρήσῃ
  choice: не увидит смерти
  rationale: Сохраняет образное выражение оригинала, а не заменяет его толкованием вроде «не умрёт».
- source_word: οὐ μὴ ... εἰς τὸν αἰῶνα
  choice: не ... вовек
  rationale: Сильное греческое отрицание вместе с временной формулой передано категоричным и естественным русским оборотом.
theological_decisions:
- issue: Обещание не увидеть смерти при очевидности физической смерти учеников
  choice: Сохранено буквальное и напряжённое выражение «не увидит смерти вовек»
  alternative: «никогда не умрёт» или пояснение о духовной/вечной смерти
  rationale: Текст намеренно выражен образно и в контексте вызывает непонимание собеседников; перевод не должен заранее разрешать богословское напряжение.
translation_notes:
  register: Современный литературный русский с достоинством и лёгкой библейской торжественностью. Инверсия «кто..., тот...» делает неопределённое τις естественным по-русски; «вовек» кратко и точно сохраняет εἰς τὸν αἰῶνα.
