  text: ἐὰν οὖν ὁ υἱὸς ὑμᾶς ἐλευθερώσῃ, ὄντως ἐλεύθεροι ἔσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/036.yaml
  text: So if the Son sets you free[a], you will be truly free.
translation:
  language: ru
  text: Итак, если Сын освободит вас, вы будете поистине свободны.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «действительно свободны»; «свободны на самом деле». Греческое наречие подчёркивает, что эта свобода подлинна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Итак, если
  rationale: «Если» передаёт условие, а «итак» сохраняет выводный характер οὖν и связь с предшествующим рассуждением.
- source_word: ὁ υἱὸς
  choice: Сын
  rationale: Определённая форма и контекст Евангелия от Иоанна указывают на христологический титул, относящийся к Иисусу.
- source_word: ὑμᾶς
  choice: вас
  rationale: Передаёт второе лицо множественного числа без стилистического утяжеления.
- source_word: ἐλευθερώσῃ
  choice: освободит
  rationale: Естественный русский глагол, ясно выражающий действие и условную перспективу будущего.
- source_word: ὄντως
  choice: поистине
  rationale: Подчёркивает подлинность и действительность свободы, сохраняя достоинство и выразительность речи.
- source_word: ἐλεύθεροι
  choice: свободны
  rationale: Предикативное краткое прилагательное передаёт состояние, возникшее в результате освобождения, и сохраняет связь с глаголом «освободит».
- source_word: ἔσεσθε
  choice: будете
  rationale: Прямо и естественно передаёт форму будущего времени.
theological_decisions:
- issue: Кого обозначает «Сын»
  choice: Христологический титул, относящийся к Иисусу
  alternative: Обычное обозначение некоего сына
  rationale: В контексте Иоанна 8 и всего Евангелия определённое «Сын» относится к Иисусу и связано с его особой властью даровать свободу.
- issue: Характер обещанной свободы
  choice: Подлинная свобода в широком смысле, без дополнительного сужения в переводе
  alternative: Только внутренняя, политическая или социальная свобода
  rationale: Ближайший контекст говорит о рабстве греху, однако сам стих формулирует результат широко; перевод не добавляет отсутствующего в стихе уточнения.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная. «Поистине» слегка возвышенно, но общеупотребительно в библейском контексте и точно передаёт эмфазу ὄντως.
