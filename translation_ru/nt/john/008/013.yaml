  text: εἶπον οὖν αὐτῷ οἱ Φαρισαῖοι· Σὺ περὶ σεαυτοῦ μαρτυρεῖς· ἡ μαρτυρία σου οὐκ ἔστιν ἀληθής.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/013.yaml
  text: So the Pharisees said to him, “You are testifying about yourself; your testimony is not true.”
translation:
  language: ru
  text: 'Тогда фарисеи сказали Ему: «Ты свидетельствуешь о Себе; Твоё свидетельство не истинно[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твоё свидетельство недействительно». Буквально по-гречески: «не истинно»; в данном контексте выражение может также указывать на отсутствие юридической силы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Тогда
  rationale: Передаёт повествовательно-логическое продолжение предыдущих слов Иисуса; в данном контексте звучит естественнее, чем более формальное «итак».
- source_word: εἶπον ... αὐτῷ οἱ Φαρισαῖοι
  choice: фарисеи сказали Ему
  rationale: Естественный русский порядок слов сохраняет подлежащее, глагол и выраженное в греческом тексте местоимение.
- source_word: Σὺ περὶ σεαυτοῦ μαρτυρεῖς
  choice: Ты свидетельствуешь Сам о Себе
  rationale: «Ты» и «Сам о Себе» передают эмфатическое личное местоимение Σὺ и возвратное σεαυτοῦ, сохраняя полемический акцент реплики.
- source_word: ἡ μαρτυρία σου
  choice: Твоё свидетельство
  rationale: Сохраняет лексическую связь с «свидетельствуешь» и судебно-доказательный оттенок существительного μαρτυρία.
- source_word: οὐκ ἔστιν ἀληθής
  choice: не истинно
  rationale: Прямо передаёт ἀληθής и не сводит обвинение исключительно к юридической недействительности.
theological_decisions:
- issue: Смысл возражения фарисеев против свидетельства о самом себе
  choice: «Твоё свидетельство не истинно»
  alternative: «Твоё свидетельство недействительно»
  rationale: Контекст допускает юридический оттенок действительности свидетельства, однако ἀληθής шире узкого процессуального термина. Основной текст сохраняет напряжение между утверждением о неистинности и возражением против доказательной силы.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой полемической речи. Заглавные буквы в местоимениях, относящихся к Иисусу, соответствуют принятой русской библейской традиции; смысловых уточнений сверх греческого текста не добавлено.
