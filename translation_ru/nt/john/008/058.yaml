  yaml_path: translation/nt/john/008/058.yaml
  text: Jesus said to them[a], “Truly, truly, I say to you, before Abraham came to be[b], I am.”
translation:
  language: ru
  text: 'Иисус сказал им: «Истинно, истинно говорю вам: прежде чем Авраам начал существовать[a], Я есть[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прежде чем Авраам родился». Греческий глагол имеет более широкий смысл: «возник», «начал существовать».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможная смысловая передача: «Я уже был». Буквально по-гречески: «Я есть»; настоящее время сохраняет необычную форму выражения и её возможный богословский отзвук.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν αὐτοῖς Ἰησοῦς
  choice: Иисус сказал им
  rationale: Прямая и естественная передача греческой повествовательной формулы с сохранением адресата.
- source_word: Ἀμὴν ἀμὴν
  choice: Истинно, истинно
  rationale: Сохраняет торжественное удвоение и понятным современному читателю языком передаёт подтверждающую силу формулы.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Близко передаёт греческую формулу прямого обращения и сохраняет характерный для Евангелия от Иоанна оборот.
- source_word: πρὶν Ἀβραὰμ γενέσθαι
  choice: прежде чем Авраам начал существовать
  rationale: Передаёт временное отношение и возникновение бытия, выраженное γίνομαι, не сужая смысл до одного лишь рождения; в современном русском звучит естественнее буквального «пришёл в бытие».
- source_word: ἐγὼ εἰμί
  choice: Я есть
  rationale: Сохраняет настоящее время, подчёркнутое местоимение и необычную абсолютную форму греческого выражения, не сводя его смысл только к предсуществованию.
- source_word: Ἀβραὰμ
  choice: Авраам
  rationale: Общепринятая русская форма библейского имени.
theological_decisions:
- issue: Передача ἐγὼ εἰμί в христологически насыщенном контексте
  choice: Я есть
  alternative: Я уже был; Я существую
  rationale: Греческий текст использует настоящее время и необычно абсолютную формулу. «Я есть» сохраняет грамматическую резкость и возможный отзвук божественного самообозначения, не навязывая его толкование и не сводя высказывание к простому утверждению о предсуществовании.
- issue: Контраст между γενέσθαι и ἐγὼ εἰμί
  choice: начал существовать … Я есть
  alternative: родился … Я уже был
  rationale: Выбранная передача сохраняет противопоставление возникновения Авраама продолжающемуся и абсолютному самоутверждению Иисуса, не устраняя заложенное в тексте богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Формула «Истинно, истинно» и намеренно необычное «Я есть» сохраняют риторическую и богословскую напряжённость оригинала; местоимение «Я» написано с прописной буквы по устойчивой русской библейской издательской традиции.
