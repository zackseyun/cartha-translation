lexical_decisions:
- source_word: γνώσεσθε
  choice: узнаете
  rationale: Будущее время γινώσκω передаёт как знание, так и возможный оттенок прихода к знанию. «Узнаете» естественно выражает этот процессуальный оттенок, не сводя значение к одному лишь интеллектуальному пониманию.
- source_word: ἀλήθειαν / ἀλήθεια
  choice: истину / истина
  rationale: Определённый артикль и повтор одного слова сохранены; в русском отсутствие артикля не мешает воспринимать «истину» как конкретно обозначенную в контексте.
- source_word: ἐλευθερώσει
  choice: освободит
  rationale: Прямой и естественный русский эквивалент каузативного глагола ἐλευθερόω; не уточняет вид свободы сверх сказанного в стихе.
- source_word: ὑμᾶς
  choice: вас
  rationale: Передаёт второе лицо множественного числа без добавочного усиления.
- source_word: καὶ ... καὶ
  choice: и ... и
  rationale: Сохраняет сочинительную структуру, последовательность и ритмический повтор греческого текста.
theological_decisions:
- issue: Характер свободы в выражении «истина освободит вас»
  choice: Не уточнять в основном тексте, от чего именно истина освободит.
  alternative: «истина освободит вас от греха»
  rationale: Сам стих оставляет объект освобождения неназванным, хотя ближайший контекст связывает свободу с освобождением от греха. Перевод сохраняет эту краткость и позволяет контексту раскрыть смысл.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, торжественная и понятная. Сохранены повтор «истина» и параллельная конструкция оригинала.
