  text: Ὡς δὲ ἐπέμενον ἐρωτῶντες αὐτόν, ἀνακύψας εἶπεν αὐτοῖς, Ὁ ἀναμάρτητος ὑμῶν, πρῶτος ἐπ' αὐτὴν τὸν λίθον βαλέτω.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/007.yaml
  text: But when[a] they continued questioning him, he straightened up and said to them, "Let the one among you who is without sin be the first to throw a stone at her."
translation:
  language: ru
  text: 'Но когда[a] они продолжали расспрашивать Его, Он выпрямился и сказал им: «Кто из вас без греха, пусть первым бросит в неё камень».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот стих входит в рассказ о женщине, уличённой в прелюбодеянии (Ин. 7:53–8:11), которого нет в самых ранних греческих рукописях. См. примечание к Ин. 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπέμενον ἐρωτῶντες
  choice: продолжали расспрашивать
  rationale: Сочетание имперфекта ἐπέμενον с причастием настоящего времени ἐρωτῶντες передаёт длительное, настойчиво продолжающееся действие; «расспрашивать» естественно выражает повторные вопросы.
- source_word: ἀνακύψας
  choice: выпрямился
  rationale: Передаёт физическое движение Иисуса из наклонённого положения, описанного в предыдущем стихе, без избыточного уточнения.
- source_word: ἀναμάρτητος
  choice: без греха
  rationale: Редкое прилагательное означает «не имеющий греха»; формулировка сохраняет нравственную и судебную напряжённость контекста и не сужает смысл до непричастности лишь к данному проступку.
- source_word: πρῶτος ἐπ' αὐτὴν τὸν λίθον βαλέτω
  choice: пусть первым бросит в неё камень
  rationale: 'Сохраняет порядок и силу греческого призыва: именно человек без греха должен первым начать исполнение приговора.'
theological_decisions:
- issue: Объём значения ἀναμάρτητος
  choice: без греха
  alternative: не виновен; не совершал такого греха
  rationale: Греческое слово не ограничивает утверждение конкретным грехом женщины. Перевод сохраняет широкую и намеренно напряжённую формулировку, не разрешая её богословски.
translation_notes:
  register: Современный литературный русский язык с ясной, dignified библейской интонацией. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской традиции; синтаксис остаётся естественным для современного читателя.
