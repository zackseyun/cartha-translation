source:
  edition: SBLGNT
  text: εἶπεν ⸀οὖν ὁ Ἰησοῦς· Ὅταν ὑψώσητε τὸν υἱὸν τοῦ ἀνθρώπου, τότε γνώσεσθε ὅτι ἐγώ εἰμι, καὶ ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν, ἀλλὰ καθὼς ἐδίδαξέν με ὁ ⸀πατὴρ ταῦτα λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/028.yaml
  text: So Jesus said[a], “When you lift up the Son of Man, then you will know that I am he, and that I do nothing from myself, but just as the Father taught me[b], I speak these things.”
translation:
  language: ru
  text: 'Итак, Иисус сказал: «Когда вы вознесёте[a] Сына Человеческого, тогда узнаете, что это Я[b] и что Я ничего не делаю от Себя, но говорю это так, как научил Меня Отец».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «вознесёте» может указывать и на физическое поднятие на кресте, и — в характерном для Иоанна смысле — на возвышение и прославление.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Я есмь». В греческом тексте сказано просто ἐγώ εἰμι («Я есмь»), без выраженного дополнения или именной части сказуемого.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Итак
  rationale: Передаёт связь и вывод из предшествующего разговора, оставаясь естественным для современного русского повествования.
- source_word: Ὅταν
  choice: Когда
  rationale: Сослагательное наклонение с ὅταν здесь указывает на конкретное ожидаемое событие, а не на повторяющееся действие.
- source_word: ὑψώσητε
  choice: вознесёте
  rationale: 'Глагол сохраняет характерную для Иоанна двойственность: физическое поднятие Иисуса на кресте и Его возвышение или прославление.'
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Сына Человеческого
  rationale: Устоявшаяся передача мессианского самообозначения, сохраняющая его связь с библейской традицией.
- source_word: γνώσεσθε
  choice: узнаете
  rationale: Передаёт будущее осознание или распознание; в данном контексте звучит естественнее, чем более отвлечённое «познаете».
- source_word: ἐγώ εἰμι
  choice: это Я
  rationale: Естественная по-русски эллиптическая формула отождествления. Отсутствие выраженного сказуемого в греческом и возможный более глубокий смысл отмечены в сноске.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: от Себя
  rationale: Сохраняет значение источника и подразумеваемой самостоятельной инициативы, не добавляя толкования в основной текст.
- source_word: ποιῶ οὐδέν
  choice: Я ничего не делаю
  rationale: Передаёт общее утверждение настоящего времени и греческое отрицание без ослабления.
- source_word: καθὼς ἐδίδαξέν με ὁ πατήρ
  choice: так, как научил Меня Отец
  rationale: Передаёт соответствие, выраженное καθώς, и сохраняет характерное для Евангелия наименование «Отец».
- source_word: ταῦτα λαλῶ
  choice: говорю это
  rationale: Естественно передаёт речевое действие и указательное ταῦτα без тяжеловесного «говорю эти вещи».
theological_decisions:
- issue: Передача эллиптического ἐγώ εἰμι
  choice: это Я
  alternative: Я есмь
  rationale: Основной вариант естественен в современном русском, но не превращает выражение в явное именование Бога. Буквальная форма, сохраняющая торжественность и возможную аллюзию на божественное самооткровение, приведена в сноске.
- issue: Смысл ὑψώσητε в контексте Евангелия от Иоанна
  choice: вознесёте
  alternative: поднимете; распнёте; возвысите
  rationale: «Вознесёте» позволяет услышать как поднятие на крест, так и возвышение или прославление, не сводя намеренную двойственность к одному смыслу.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Заглавные буквы в местоимениях «Себя» и «Меня» следуют принятой русской издательской традиции при обозначении Христа; смысловые неоднозначности вынесены в краткие сноски.
