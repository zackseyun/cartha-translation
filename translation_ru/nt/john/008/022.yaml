lexical_decisions:
- source_word: ἔλεγον
  choice: говорили
  rationale: Имперфект передаёт продолжавшееся или повторявшееся обсуждение; русское «говорили» естественно сохраняет этот повествовательный аспект.
- source_word: οὖν
  choice: же
  rationale: Частица связывает реплику с предшествующими словами Иисуса и передаёт повествовательное продолжение или вывод без излишне строгого логического оттенка.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Это прямое лексическое соответствие греческому выражению. Контекст Евангелия от Иоанна иногда допускает более узкий смысл — иудейские руководители или противники Иисуса, — однако сам стих явно его не уточняет.
- source_word: Μήτι
  choice: Неужели
  rationale: Μήτι вводит вопрос, предполагающий отрицательный ответ; «неужели» естественно выражает недоверчивое предположение.
- source_word: ἀποκτενεῖ ἑαυτόν
  choice: Он убьёт Себя
  rationale: Прямая и ясная передача будущего времени и возвратного местоимения без архаической окраски.
- source_word: ὅτι
  choice: и потому
  rationale: ὅτι здесь связывает предположение с цитируемыми словами Иисуса как с основанием для него. Конструкция «и потому говорит» естественна по-русски и сохраняет причинную связь.
- source_word: λέγει
  choice: говорит
  rationale: Сохраняется настоящее время греческого текста в живом пересказе слов Иисуса.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: Куда Я ухожу
  rationale: «Ухожу» передаёт движение и оттенок удаления в ὑπάγω, не уточняя конечного места.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: вы не можете прийти
  rationale: Естественная и точная передача выраженной глаголом δύνασθε невозможности.
theological_decisions:
- issue: Кого обозначает выражение οἱ Ἰουδαῖοι в Евангелии от Иоанна
  choice: В основном тексте сохранено «иудеи»
  alternative: «жители Иудеи» или «иудейские руководители»
  rationale: Греческое выражение само по себе не сужает круг до руководителей. Примечание сохраняет контекстуальные возможности и помогает не понимать слово как безусловное обозначение всего еврейского народа.
translation_notes:
  register: Современный литературный русский язык; ясный, достойный повествовательный стиль. Прописные буквы в местоимениях, относящихся к Иисусу, соответствуют принятой русской библейской издательской традиции. Подлинная неоднозначность οἱ Ἰουδαῖοι сохранена в основном тексте и пояснена в сноске.
