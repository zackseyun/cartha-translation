id: JHN.8.44
reference: John 8:44
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ πατρὸς τοῦ διαβόλου ἐστὲ καὶ τὰς ἐπιθυμίας τοῦ πατρὸς ὑμῶν θέλετε ποιεῖν. ἐκεῖνος ἀνθρωποκτόνος ἦν ἀπ’ ἀρχῆς, καὶ ἐν τῇ ἀληθείᾳ ⸂οὐκ ἔστηκεν⸃, ὅτι οὐκ ἔστιν ἀλήθεια ἐν αὐτῷ. ὅταν λαλῇ τὸ ψεῦδος, ἐκ τῶν ἰδίων λαλεῖ, ὅτι ψεύστης ἐστὶν καὶ ὁ πατὴρ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/044.yaml
  text: You are from your father[a], the devil, and you want to do your father's desires. He was a murderer from the beginning, and he has not stood in the truth, because there is no truth in him. Whenever he speaks the lie, he speaks from his own nature[c][b], because he is a liar and the father of it.
translation:
  language: ru
  text: Ваш отец — дьявол, и вы хотите исполнять желания своего отца. Он был убийцей от начала и не стоит в истине[a], потому что в нём нет истины. Когда он говорит ложь, то говорит от себя[b], потому что он лжец и отец лжи[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «не устоял в истине» или «не пребывает в истине». Греческое выражение само по себе не требует вывода, что прежде он находился в истине.'
    reason: Сохранение временной и богословской неоднозначности выражения οὐκ ἔστηκεν.
  - marker: b
    text: 'Буквально: «говорит из своего», то есть из того, что ему свойственно и принадлежит.'
    reason: Пояснение сжатого греческого оборота ἐκ τῶν ἰδίων.
  - marker: c
    text: 'Буквально: «и её отец», где «её» наиболее естественно относится к лжи. Формально возможно понять местоимение как «его», однако тогда речь шла бы об отце дьявола.'
    reason: Сохранение референциальной неоднозначности местоимения αὐτοῦ.
lexical_decisions:
- source_word: ἐκ τοῦ πατρὸς τοῦ διαβόλου
  choice: Ваш отец — дьявол
  rationale: По-русски это естественно передаёт происхождение или принадлежность, выраженные ἐκ при εἰμί, и сохраняет прямоту слов Иисуса.
- source_word: ἐπιθυμίας
  choice: желания
  rationale: Широкое и современное слово без неоправданного сведения смысла к сексуальной похоти.
- source_word: θέλετε ποιεῖν
  choice: хотите исполнять
  rationale: Передаёт волю и намерение; «исполнять желания» естественно по-русски.
- source_word: ἀνθρωποκτόνος
  choice: убийца
  rationale: Прямой и общеупотребительный эквивалент названия того, кто убивает людей.
- source_word: ἀπ’ ἀρχῆς
  choice: от начала
  rationale: Сохраняет краткую и характерную для Иоанна формулу.
- source_word: ἐν τῇ ἀληθείᾳ οὐκ ἔστηκεν
  choice: не стоит в истине
  rationale: Сохраняет образ стояния и не утверждает однозначно, что дьявол прежде пребывал в истине, а затем отпал.
- source_word: ὅταν λαλῇ τὸ ψεῦδος
  choice: когда он говорит ложь
  rationale: Естественно передаёт повторяющееся действие и сохраняет существительное с артиклем без неидиоматичного русского «говорит эту ложь».
- source_word: ἐκ τῶν ἰδίων λαλεῖ
  choice: говорит своё
  rationale: Кратко и достаточно буквально передаёт речь из того, что принадлежит ему самому; смысл пояснён в сноске.
- source_word: ψεύστης
  choice: лжец
  rationale: Прямой современный эквивалент.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: отец лжи
  rationale: В русском это ясно связывает местоимение с ближайшим смысловым предшественником τὸ ψεῦδος и избегает двусмысленного «его отец»; компактность греческой фразы и возможная альтернатива отмечены в сноске.
theological_decisions:
- issue: Подразумевает ли οὐκ ἔστηκεν, что дьявол прежде пребывал в истине
  choice: «не стоит в истине» — без утверждения о прежнем состоянии
  alternative: «не устоял» или «не остался в истине», что может подразумевать прежнее пребывание в ней
  rationale: Греческая форма допускает обсуждение временного оттенка, но контекст не требует от перевода разрешать вопрос о прежнем состоянии дьявола.
- issue: К чему относится αὐτοῦ в ὁ πατὴρ αὐτοῦ
  choice: 'к лжи: «отец лжи»'
  alternative: «его отец», то есть отец самого дьявола; либо буквально «её отец»
  rationale: Ближайший и контекстуально связный референт — τὸ ψεῦδος. Формулировка «его отец» породила бы не требуемое текстом богословское утверждение.
translation_notes:
  register: Современный литературный русский, прямой и торжественно-сдержанный. Формулы «от начала», «в истине» и «отец лжи» сохраняют иоанновскую образность; синтаксис остаётся доступным обычному читателю.
