  source_fidelity: Первая часть, «Ваш отец — дьявол», в русском языке естественно передаёт принадлежность, выраженную ἐκ ... ἐστέ. «Не стоит в истине» удачно сохраняет образ устойчивого состояния без утверждения о прежнем пребывании в истине. Однако «говорит своё» в современном русском обычно значит «высказывает собственное мнение» и не передаёт достаточно ясно ἐκ τῶν ἰδίων — речь из того, что ему свойственно.
  naturalness: Текст в целом литературный и ясный. «Говорит от себя» — обычная, естественная русская формула и в данном контексте лучше выражает происхождение лжи из самого говорящего. Сноска устраняет риск понимания этого выражения как независимого высказывания, а не как речи из собственного, присущего ему источника.
  terminology: «Дьявол», «убийца», «истина» и «лжец» точны и соответствуют современному литературному библейскому регистру. «Отец лжи» — естественная русская экспликация наиболее вероятной связи αὐτοῦ с τὸ ψεῦδος; сноска корректно отмечает формальную альтернативу, не навязывая богословского вывода.
