  text: ἔλεγον οὖν αὐτῷ· Ποῦ ἐστιν ὁ πατήρ σου; ἀπεκρίθη Ἰησοῦς· Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου· εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/019.yaml
  text: So they were saying to him[a], “Where is your Father?” Jesus answered, “You know neither me nor my Father. If you knew me, you would know my Father also.”
translation:
  language: ru
  text: 'Тогда они спросили Его: «Где Твой Отец?» Иисус ответил: «Вы не знаете ни Меня, ни Моего Отца. Если бы вы знали Меня, то знали бы и Моего Отца».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: спросили
  rationale: В данном контексте глагол речи вводит прямой вопрос, поэтому по-русски естественно «спросили». Греческий имперфект допускает значение продолжавшейся или повторявшейся речи, однако «стали спрашивать» могло бы чрезмерно подчеркнуть начало либо повторность действия.
- source_word: οὖν
  choice: тогда
  rationale: Передаёт связь с предшествующим рассуждением и естественно продолжает повествование, не придавая реплике излишне строгого логического оттенка, возможного у «поэтому».
- source_word: Ποῦ ἐστιν ὁ πατήρ σου;
  choice: Где Твой Отец?
  rationale: Прямая и естественная передача вопроса. Прописная буква указывает на Бога как на подразумеваемого Отца Иисуса, что ясно из ближайшего контекста Евангелия от Иоанна.
- source_word: Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου
  choice: Вы не знаете ни Меня, ни Моего Отца
  rationale: Конструкция «ни… ни…» точно передаёт οὔτε…οὔτε. «Знаете» сохраняет широту οἶδα — знание, узнавание и личное ведение — без сужения смысла до одного оттенка.
- source_word: εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ἂν ᾔδειτε
  choice: Если бы вы знали Меня, то знали бы и Моего Отца
  rationale: Русская конструкция с «если бы… знали бы» естественно передаёт нереальное условие, относящееся к настоящему. Частица «и» передаёт καί и сохраняет связь между знанием Иисуса и знанием Отца.
theological_decisions:
- issue: Написание слова «Отец» с прописной буквы
  choice: «Твой Отец», «Моего Отца»
  alternative: «твой отец», «моего отца»
  rationale: В контексте Иисус говорит о Боге как о Своём Отце. Прописная буква помогает современному читателю увидеть подразумеваемого референта, не добавляя нового содержания.
- issue: Смысл знания Иисуса и Отца
  choice: Сохранён широкий глагол «знать»
  alternative: «узнавать», «понимать», «познавать»
  rationale: Повтор одного и того же глагола сохраняет богословскую связь между знанием Иисуса и знанием Отца и не сводит её лишь к интеллектуальному пониманию, распознаванию или процессу познания.
- issue: Временная и модальная сила условного предложения
  choice: 'Настоящее нереальное условие: «Если бы вы знали… то знали бы…»'
  alternative: 'Прошедшее нереальное условие: «Если бы вы прежде познали… то познали бы…»'
  rationale: Имперфект ᾔδειτε с ἄν здесь естественно выражает противоречащее действительности положение в настоящем. Русская формулировка сохраняет это значение и не привносит акцент на прошлом.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно возвышенный. Местоимения, относящиеся к Иисусу и Богу, написаны с прописной буквы в соответствии с принятой русской библейской традицией. Прямая речь оформлена естественно; богословская напряжённость между незнанием Иисуса и незнанием Отца сохранена без поясняющей вставки.
