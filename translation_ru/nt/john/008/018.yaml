  text: ἐγώ εἰμι ὁ μαρτυρῶν περὶ ἐμαυτοῦ καὶ μαρτυρεῖ περὶ ἐμοῦ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/018.yaml
  text: I am the one who testifies about myself[a], and the Father who sent me testifies about me.
translation:
  language: ru
  text: Я сам свидетельствую о себе[a], и Отец, пославший Меня, свидетельствует обо Мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я — тот, кто свидетельствует о себе».'
    reason: Более буквальная передача субстантивированного причастия ὁ μαρτυρῶν.
lexical_decisions:
- source_word: ἐγώ εἰμι ὁ μαρτυρῶν
  choice: Я сам свидетельствую
  rationale: Артиклированное причастие обозначает того, кто свидетельствует; по-русски личная глагольная форма звучит естественнее, а «сам» передаёт выраженное ἐγώ и возвратное ἐμαυτοῦ, не превращая оборот в абсолютное «Я есмь».
- source_word: μαρτυρῶν / μαρτυρεῖ
  choice: свидетельствую / свидетельствует
  rationale: Одинаковый русский корень сохраняет повтор и судебно-свидетельский мотив текста.
- source_word: περὶ ἐμαυτοῦ / περὶ ἐμοῦ
  choice: о себе / обо Мне
  rationale: περί с родительным падежом естественно передаётся как «о, относительно»; этот вариант не усиливает смысл до «в Свою пользу».
- source_word: ὁ πέμψας με πατήρ
  choice: Отец, пославший Меня
  rationale: Причастный оборот точно передаёт определительное значение греческого артиклированного причастия; слово «Мой» в оригинале отсутствует.
theological_decisions:
- issue: Значение выражения ἐγώ εἰμι в данном предложении
  choice: 'Передать как часть обычной именной конструкции: «Я сам свидетельствую»'
  alternative: «Я есмь свидетельствующий»
  rationale: После ἐγώ εἰμι следует выраженное сказуемое ὁ μαρτυρῶν, поэтому здесь не следует искусственно создавать абсолютное богословское изречение «Я есмь».
- issue: Наименование Отца
  choice: «Отец» без поясняющего добавления
  alternative: «Мой Отец» или «Бог Отец»
  rationale: Греческий текст называет второго свидетеля Отцом, пославшим Иисуса, но не содержит притяжательного местоимения или слова «Бог».
- issue: Судебно-свидетельский мотив
  choice: Сохранить повтор глагола «свидетельствовать»
  alternative: Разнообразить формулировку словами «подтверждать» или «говорить»
  rationale: Лексический повтор важен для рассуждения о двух свидетелях и не должен стилистически сглаживаться.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и юридико-свидетельской лексики. Заглавные буквы в местоимениях «Меня/Мне» отражают принятую русскую библейскую издательскую традицию, не добавляя содержания к оригиналу.
