  text: καὶ ⸀ἔλεγεν αὐτοῖς· Ὑμεῖς ἐκ τῶν κάτω ἐστέ, ἐγὼ ἐκ τῶν ἄνω εἰμί· ὑμεῖς ἐκ ⸂τούτου τοῦ κόσμου⸃ ἐστέ, ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/023.yaml
  text: And he was saying to them[a], “You are from below; I am from above. You are from this world[b]; I am not from this world.”
translation:
  language: ru
  text: 'И Он говорил им: «Вы — снизу, Я — сверху; вы — от этого мира[a], Я — не от этого мира».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: У Иоанна «мир» нередко означает не только сотворённый мир или землю, но и человеческий порядок, отчуждённый от Бога.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: говорил
  rationale: Имперфект передаёт продолжающуюся речь в данном эпизоде; русское «говорил» сохраняет этот видовой оттенок и звучит естественно.
- source_word: Ὑμεῖς / ἐγὼ
  choice: Вы / Я
  rationale: Явные местоимения сохранены ради подчёркнутого противопоставления слушателей Иисусу.
- source_word: ἐκ τῶν κάτω / ἐκ τῶν ἄνω
  choice: от нижнего / от вышнего
  rationale: Так сохраняются повтор предлога ἐκ, смысл происхождения или принадлежности и вертикальная образность без уточнения, не выраженного прямо в греческом тексте.
- source_word: κόσμος
  choice: мир
  rationale: «Мир» — естественный и достаточно широкий эквивалент; он позволяет сохранить характерную для Иоанна многозначность, не сводя κόσμος ни к физической земле, ни к прямо названной нравственной системе.
- source_word: τούτου τοῦ κόσμου / τοῦ κόσμου τούτου
  choice: этого мира
  rationale: Указательное местоимение сохранено, а различие греческого порядка слов не воспроизводится искусственно, поскольку по-русски обе конструкции естественно выражаются одинаково.
- source_word: οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου
  choice: Я — не от этого мира
  rationale: Формулировка сохраняет конструкцию происхождения с ἐκ и параллелизм стиха; вариант «не принадлежу этому миру» был бы более истолковывающим.
theological_decisions:
- issue: Смысл противопоставления «от нижнего / от вышнего» и «от этого мира»
  choice: Сохранена образная речь о происхождении или сфере принадлежности без развёрнутого догматического пояснения.
  alternative: Перевести как «из земного мира / из небесного мира» либо выразить контраст прямо в нравственных категориях.
  rationale: Греческий текст создаёт резкий христологический контраст, но сам не заменяет вертикальную образность однозначным определением. Буквенно-естественная передача сохраняет богословское напряжение.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Формы «нижнего / вышнего» несколько возвышенны, но понятны и обеспечивают точный параллелизм. Тире подчёркивают явное противопоставление местоимений.
