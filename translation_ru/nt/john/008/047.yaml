  text: ὁ ὢν ἐκ τοῦ θεοῦ τὰ ῥήματα τοῦ θεοῦ ἀκούει· διὰ τοῦτο ὑμεῖς οὐκ ἀκούετε ὅτι ἐκ τοῦ θεοῦ οὐκ ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/047.yaml
  text: The one who is from God hears the words of God[a]. For this reason you do not hear[b], because you are not from God.
translation:
  language: ru
  text: Кто от Бога,[a] тот слышит слова Бога. Вы потому и не слышите,[b] что вы не от Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение «от Бога» указывает на источник или происхождение; возможно также передать: «принадлежит Богу».'
    reason: lexical_alternative
  - marker: b
    text: 'Или, если понять греческий союз в изъяснительном смысле: «Вы потому и не слышите, что вы не от Бога», то есть не слышите того, что вы не от Бога. Однако причинный смысл лучше соответствует контексту.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ὢν
  choice: Кто …, тот
  rationale: Субстантивированное причастие обозначает человека определённого рода. Русская соотносительная конструкция естественно передаёт обобщённый смысл и сохраняет единственное число.
- source_word: ἐκ τοῦ θεοῦ
  choice: от Бога
  rationale: Предлог ἐκ указывает на источник или происхождение. Формулировка «от Бога» сохраняет характерный для Иоанна образ, не сводя его к одному богословскому толкованию.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: слова Бога
  rationale: ῥήματα передано конкретным множественным числом «слова», а родительный падеж сохраняет связь этих слов с Богом без лишнего перефразирования.
- source_word: ἀκούει / ἀκούετε
  choice: слышит / слышите
  rationale: Повтор одного русского глагола воспроизводит повтор в греческом тексте. В контексте подразумевается восприимчивое слушание, но перевод «повинуется» был бы более узким истолкованием.
- source_word: διὰ τοῦτο
  choice: потому и
  rationale: Эта естественная русская конструкция передаёт причинно-следственную связь и вместе с частицей «и» сохраняет подчёркнутый вывод.
- source_word: ὅτι
  choice: что (в причинном значении)
  rationale: В данной конструкции «что» естественно означает «потому что» и лучше всего соответствует контексту, хотя формально возможен и изъяснительный смысл.
- source_word: ἐκ τοῦ θεοῦ οὐκ ἐστέ
  choice: вы не от Бога
  rationale: Повтор «от Бога» сохраняет словесную симметрию оригинала и его открытую формулировку об источнике или происхождении.
theological_decisions:
- issue: Смысл выражения «от Бога»
  choice: 'Сохранить образ источника или происхождения: «от Бога»'
  alternative: «принадлежит Богу» или уточнение через конкретную систематическую категорию
  rationale: Текст не поясняет выражение посредством более поздних категорий избрания, возрождения или членства в завете; перевод сохраняет богословскую напряжённость и лексику Иоанна.
- issue: Смысл глагола ἀκούω
  choice: «слышит / слышите»
  alternative: «слушается / повинуетесь»
  rationale: В контексте слышание включает принятие сказанного, однако основной текст не должен подменять сам глагол его предполагаемым следствием.
- issue: Функция союза ὅτι
  choice: 'Причинное значение: «что» в смысле «потому что»'
  alternative: 'Изъяснительное значение: «не слышите того, что вы не от Бога»'
  rationale: 'Причинное прочтение лучше соответствует ходу мысли: отсутствие слышания объясняется тем, что собеседники не от Бога. Формальная неоднозначность отмечена в сноске.'
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Конструкция «Кто …, тот …» естественна для общего утверждения; повтор «слышит / слышите» и «от Бога» намеренно сохранён. Во втором предложении местоимение «вы» передаёт явное и подчёркнутое ὑμεῖς.
