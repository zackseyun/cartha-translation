  yaml_path: translation/nt/john/008/057.yaml
  text: So the Jews said to him, “You are not yet fifty years old, and you have seen Abraham?”
translation:
  language: ru
  text: 'Тогда иудеи[a] сказали ему: «Тебе ещё нет и пятидесяти лет, и ты видел Авраама?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жители Иудеи»; возможно также: «иудейские руководители» — в зависимости от того, насколько широкий круг людей обозначает здесь Иоанн словом οἱ Ἰουδαῖοι.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Прямой и традиционно понятный перевод повествовательного обозначения у Иоанна; сам текст здесь не ограничивает круг говорящих одними руководителями.
- source_word: οὖν
  choice: тогда
  rationale: Передаёт связь реплики с предшествующими словами Иисуса и естественно звучит в русском повествовании; возможный оттенок следствия сохраняется контекстом.
- source_word: Πεντήκοντα ἔτη οὔπω ἔχεις
  choice: Тебе ещё нет и пятидесяти лет
  rationale: Естественная русская передача греческого возрастного оборота с усилительным «и», подчёркивающим очевидное несоответствие возраста.
- source_word: ἑώρακας
  choice: ты видел
  rationale: Русское прошедшее время естественно передаёт перфект ὁράω в вопросе о состоявшемся личном видении; форма не уточняет способ или обстоятельства этой встречи.
- source_word: καὶ
  choice: и
  rationale: Сохраняет простое греческое соединение и риторически выражает недоверие говорящих, не заменяя его толковательным «неужели».
- source_word: Ἀβραὰμ
  choice: Авраама
  rationale: Общепринятая русская форма библейского имени в требуемом падеже.
theological_decisions:
- issue: Значение οἱ Ἰουδαῖοι в повествовании Иоанна
  choice: иудеи
  alternative: жители Иудеи; иудейские руководители
  rationale: Греческое выражение допускает контекстуальные оттенки, однако в этом стихе прямо не сказано, что речь идёт только о руководителях или исключительно о жителях области. Основной текст сохраняет широкое обозначение, а варианты вынесены в сноску.
- issue: Характер утверждения о видении Авраама
  choice: и ты видел Авраама?
  alternative: и неужели ты видел Авраама?
  rationale: Буквальная вопросительная форма сохраняет недоверие говорящих, выраженное контекстом и интонацией, не добавляя отсутствующего в греческом усилительного слова.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified повествовательным тоном. Местоимения, относящиеся к Иисусу, даны со строчной буквы согласно общим современным нормам; недоверие собеседников передано синтаксисом вопроса без добавления толковательных усилителей.
