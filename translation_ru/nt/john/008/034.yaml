source:
  edition: SBLGNT
  text: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι πᾶς ὁ ποιῶν τὴν ἁμαρτίαν δοῦλός ἐστιν τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/034.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you[b], everyone who practices sin is a servant of sin.”
translation:
  language: ru
  text: 'Иисус ответил им: «Истинно, истинно говорю вам: всякий, кто грешит[a], — раб греха[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «делает грех». Форма настоящего времени может указывать на действие вообще, продолжающееся или характерное.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «слуга греха». Греческое δοῦλος может обозначать раба или слугу; здесь «раб» лучше передаёт мысль о несвободе.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: Иисус ответил им
  rationale: Естественный для современного русского повествовательный порядок слов; ἀπεκρίθη передано обычным глаголом ответа без лишнего усиления.
- source_word: Ἀμὴν ἀμὴν
  choice: Истинно, истинно
  rationale: Сохраняет характерное для Евангелия от Иоанна удвоение и торжественную уверенность формулы, оставаясь понятным современному читателю.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Близкая и естественная передача торжественной формулы настоящего времени.
- source_word: πᾶς ὁ ποιῶν τὴν ἁμαρτίαν
  choice: всякий, кто грешит
  rationale: Русский глагол несовершенного вида естественно выражает общее или продолжающееся совершение греха, не превращая причастие в утверждение лишь об одном отдельном поступке.
- source_word: δοῦλος
  choice: раб
  rationale: В контексте спора о свободе слово обозначает несвободу и подчинённость; «раб» передаёт метафору сильнее и точнее, чем «слуга».
- source_word: τῆς ἁμαρτίας
  choice: греха
  rationale: Родительный падеж сохраняет образ принадлежности и подчинения греху; артикль не требует отдельного выражения по-русски.
theological_decisions:
- issue: Характер утверждения о совершающем грех
  choice: «всякий, кто грешит»
  alternative: «всякий, кто совершает грех» / «всякий, кто творит грех»
  rationale: Настоящее причастие ποιῶν допускает общее, продолжающееся или характерное действие. Несовершенный вид «грешит» сохраняет эту широту и не ограничивает высказывание ни единичным поступком, ни явно сформулированным образом жизни.
- issue: Сила метафоры δοῦλος
  choice: «раб греха»
  alternative: «слуга греха»
  rationale: Непосредственный контекст посвящён свободе и рабству, поэтому «раб» сохраняет центральную идею зависимости и не смягчает её конфессионально обусловленным выбором.
translation_notes:
  register: Современный литературный русский с сохранением торжественной иоанновской формулы «Истинно, истинно». Пунктуация подчёркивает именную связку в заключительном утверждении; лексика понятна широкому читателю, а сильный образ рабства не смягчён.
