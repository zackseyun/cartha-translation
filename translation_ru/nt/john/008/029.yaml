  text: καὶ ὁ πέμψας με μετ’ ἐμοῦ ἐστιν· οὐκ ἀφῆκέν με ⸀μόνον, ὅτι ἐγὼ τὰ ἀρεστὰ αὐτῷ ποιῶ πάντοτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/029.yaml
  text: And the one who sent me is with me[a]. He has not left me alone[b], because I always do what is pleasing to him.
translation:
  language: ru
  text: И Пославший меня — со мной. Он не оставил меня одного, потому что я всегда делаю то, что Ему угодно.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πέμψας με
  choice: Пославший меня
  rationale: Субстантивированное причастие аориста передано причастной конструкцией, сохраняющей характерное для текста указание на Отца без добавления слова «Отец».
- source_word: μετ’ ἐμοῦ ἐστιν
  choice: со мной
  rationale: Краткая естественная русская конструкция точно выражает присутствие и сопутствие; связка настоящего времени по-русски закономерно опущена.
- source_word: οὐκ ἀφῆκέν με μόνον
  choice: Он не оставил меня одного
  rationale: Аорист передан русским прошедшим временем; «оставил меня одного» естественно отражает предикативное μόνον и не усиливает значение до «покинул» или «оставил на произвол судьбы».
- source_word: ὅτι
  choice: потому что
  rationale: Союз сохраняет прямое причинное отношение, присутствующее в греческом тексте.
- source_word: τὰ ἀρεστὰ αὐτῷ
  choice: то, что Ему угодно
  rationale: Естественная русская субстантивированная конструкция передаёт буквально выраженное «угодное Ему», не сводя смысл лишь к субъективному удовольствию.
- source_word: ποιῶ πάντοτε
  choice: я всегда делаю
  rationale: Настоящее время и πάντοτε переданы как постоянное, неизменное действие с естественным для русского порядком слов.
theological_decisions:
- issue: Кого обозначает «Пославший меня»
  choice: Сохранено относительное обозначение без подстановки слова «Отец».
  alternative: «Отец, пославший меня» или «Тот, кто послал меня».
  rationale: В контексте речь идёт об Отце, однако греческий текст использует именно субстантивированное причастие. Такая передача сохраняет форму и богословски значимую тему посланничества.
- issue: Причинная связь между присутствием Пославшего и постоянным исполнением угодного Ему
  choice: Сохранено прямое «потому что».
  alternative: Ослабить связь союзом «ведь» или истолковать её как следствие, а не причину.
  rationale: ὅτι естественно имеет здесь причинное значение. Перевод не должен сглаживать возможное богословское напряжение или дополнительно объяснять характер этой связи.
- issue: Временной оттенок ἀφῆκεν
  choice: «не оставил» — простое прошедшее время.
  alternative: «не оставляет» для подчёркивания продолжающегося присутствия.
  rationale: Русское прошедшее время непосредственно соответствует аористу, а продолжающееся присутствие уже выражено словами «со мной» в настоящем времени.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-сдержанный. Начальное «И» сохранено как элемент связности речи. Местоимения, относящиеся к Иисусу, написаны со строчной буквы; относящиеся к Богу — с прописной по традиционному библейскому оформлению. Тире естественно компенсирует отсутствие связки в именном сказуемом.
