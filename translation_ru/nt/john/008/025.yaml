  text: ἔλεγον οὖν αὐτῷ· Σὺ τίς εἶ; ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Τὴν ἀρχὴν ⸂ὅ τι⸃ καὶ λαλῶ ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/025.yaml
  text: So they were saying to him, “Who are you?” Jesus said to them, “Just what I have been telling you from the beginning.”
translation:
  language: ru
  text: 'Тогда они спросили Его: «Кто же Ты?» Иисус сказал им: «Зачем Я вообще говорю с вами?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза трудна и допускает разные толкования. Возможно также: «Именно то, что Я говорю вам с самого начала» (или: «То, что Я говорю вам с самого начала»).'
    reason: Τὴν ἀρχὴν может быть идиоматическим «вообще», а ὅ τι — вопросительным «зачем»; это соответствует вопросительному знаку в SBLGNT. Альтернативный разбор понимает выражение в значении «с самого начала» и даёт ответ-утверждение.
lexical_decisions:
- source_word: ἔλεγον
  choice: спросили
  rationale: Имперфект глагола «говорить» вводит прямой вопрос; по-русски естественно передать речевое действие как «спросили», не акцентируя продолжительность.
- source_word: οὖν
  choice: тогда
  rationale: Передаёт логико-повествовательную связь с предшествующими словами Иисуса.
- source_word: Σὺ τίς εἶ;
  choice: Кто же Ты?
  rationale: Частица «же» естественно передаёт выраженное местоимением Σὺ акцентированное обращение к Иисусу.
- source_word: Τὴν ἀρχὴν
  choice: с самого начала
  rationale: В принятом для основного текста синтаксическом разборе выражение имеет временное значение и подчёркивает неизменность сказанного Иисусом.
- source_word: ὅ τι καὶ λαλῶ ὑμῖν
  choice: то, что Я и говорю вам
  rationale: Сохраняет значение λαλῶ как «говорю» и усилительную функцию καί; формулировка намеренно не заменена более толковательным «кем Я называл Себя».
theological_decisions:
- issue: Смысл трудной фразы Τὴν ἀρχὴν ὅ τι καὶ λαλῶ ὑμῖν
  choice: Именно то, что Я и говорю вам с самого начала
  alternative: Зачем Я вообще говорю с вами?
  rationale: Греческая конструкция допускает несколько разборов. Основной текст следует древнему и широко принятому пониманию ответа как ссылки Иисуса на Его прежние слова, но примечание сохраняет реальную грамматическую неоднозначность и не превращает ответ в более определённое христологическое самоименование.
translation_notes:
  register: Современный литературный русский язык; речь проста и достойна. Заглавные местоимения в отношении Иисуса употреблены последовательно. Несколько необычная форма ответа сохранена, чтобы не скрывать трудность греческого синтаксиса.
