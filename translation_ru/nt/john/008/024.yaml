  text: εἶπον οὖν ὑμῖν ὅτι ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν· ἐὰν γὰρ μὴ πιστεύσητε ὅτι ἐγώ εἰμι, ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/024.yaml
  text: So I told you that you will die in your sins. For unless you believe that I am[a], you will die in your sins.
translation:
  language: ru
  text: Поэтому Я сказал вам, что вы умрёте в своих грехах. Ведь если вы не поверите, что Я есмь[a], то умрёте в своих грехах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что это Я». В греческом после слов «Я есмь» нет явно выраженного дополнения или именной части; эта формулировка может иметь особый отзвук в Евангелии от Иоанна.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν ὑμῖν
  choice: Поэтому Я и сказал вам
  rationale: «Поэтому» передаёт выводное οὖν и связывает слова с предшествующим рассуждением; частица «и» естественно подчёркивает эту связь по-русски. Аорист εἶπον передан простым прошедшим временем.
- source_word: ἀποθανεῖσθε
  choice: вы умрёте
  rationale: Прямо передаёт будущее время ἀποθνῄσκω, не добавляя значения погибели, которого сам глагол здесь не требует.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: в своих грехах
  rationale: Сохранены предлог ἐν и множественное число «грехах»; возвратное «своих» естественно для русского и ясно соотносит грехи с подлежащим «вы».
- source_word: ἐὰν γὰρ μὴ
  choice: Ведь если ... не
  rationale: «Ведь» передаёт пояснительное γάρ, а конструкция «если ... не» — отрицательное условие ἐὰν μή.
- source_word: πιστεύσητε
  choice: поверите
  rationale: Стандартное и контекстуально уместное соответствие πιστεύω; совершенный вид естественно выражает условие, направленное к решающему акту признания и веры, не исключая более широкого смысла доверия.
- source_word: ὅτι ἐγώ εἰμι
  choice: что Я есмь
  rationale: Греческая фраза не содержит именной части сказуемого. Формула «Я есмь» сохраняет эту грамматическую открытость и возможный более глубокий отзвук, оставаясь узнаваемой в возвышенном библейском регистре русского языка.
theological_decisions:
- issue: Передача абсолютного выражения ἐγώ εἰμι без явно названного сказуемого
  choice: что Я есмь
  alternative: что это Я; что Я — Тот
  rationale: Основной текст не восполняет отсутствующее в греческом сказуемое и тем самым сохраняет напряжение между контекстуальным самоотождествлением Иисуса и возможным отзвуком языка божественного самооткровения. Смысловой вариант вынесен в примечание.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской формулой «Я есмь». В остальном синтаксис прост и понятен; повтор заключительной фразы сохранён вслед за греческим текстом.
