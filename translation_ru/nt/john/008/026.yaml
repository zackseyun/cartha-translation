base_translation:
  language: en
  yaml_path: translation/nt/john/008/026.yaml
  text: I have many things to say and to judge concerning you[a]. But the one who sent me is true, and what I heard from him[b], these things I speak to the world.
translation:
  language: ru
  text: Многое Я имею сказать и судить о вас[a]. Но Пославший Меня истинен, и то, что Я услышал от Него, то и говорю миру[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «относительно вас».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст явно повторяет указательное местоимение: «и то, что Я услышал от Него, это говорю миру»; повтор придаёт словам выразительный акцент.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: многое
  rationale: Субстантивированное прилагательное среднего рода во множественном числе естественно передаётся собирательным русским «многое».
- source_word: περὶ ὑμῶν
  choice: о вас
  rationale: περί с родительным обозначает предмет речи или суждения; «о вас» естественно и сохраняет широту значения.
- source_word: λαλεῖν καὶ κρίνειν
  choice: сказать о вас и во многом вас судить
  rationale: Повтор «вас» и добавление «во многом» позволяют по-русски ясно связать πολλά с обоими инфинитивами, не сужая κρίνειν до осуждения.
- source_word: κρίνειν
  choice: судить
  rationale: «Судить» сохраняет широкий диапазон κρίνω и не вводит более узкое значение «осуждать».
- source_word: ὁ πέμψας με
  choice: Пославший Меня
  rationale: Субстантивированное причастие передаёт греческую форму без добавления отсутствующего в стихе слова «Отец».
- source_word: ἀληθής
  choice: истинен
  rationale: «Истинен» сохраняет смысл истинности и достоверности говорящего, а также характерный для Иоанна богословский оттенок.
- source_word: ἃ ἤκουσα παρ’ αὐτοῦ
  choice: то, что Я услышал от Него
  rationale: Оборот естественно передаёт содержание услышанного и источник сообщения.
- source_word: ταῦτα
  choice: то и
  rationale: Русская коррелятивная конструкция «то, что… то и…» сохраняет явное возобновление и акцент греческого ταῦτα без тяжеловесного «эти вещи».
- source_word: λαλῶ εἰς τὸν κόσμον
  choice: говорю миру
  rationale: При глаголе речи εἰς обозначает направленность сообщения; дательный «миру» естественен в современном русском.
theological_decisions:
- issue: Кого обозначает «Пославший Меня»
  choice: Референт не назван прямо, как и в греческом тексте.
  alternative: «Пославший Меня Отец»
  rationale: Контекст указывает на Отца, однако добавление существительного устранило бы сохранённую исходным текстом имплицитность.
- issue: Значение κρίνειν
  choice: «судить»
  alternative: «осуждать»
  rationale: Более широкое «судить» сохраняет смысловую напряжённость и не утверждает без необходимости именно обвинительный приговор.
- issue: Сила ἀληθής
  choice: «истинен»
  alternative: «правдив» / «верен»
  rationale: «Истинен» не ограничивает слово только правдивостью речи или надёжностью и сохраняет иоанновский смысловой резонанс.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Местоимения, относящиеся к Иисусу и Отцу, даны с прописной буквы по устойчивой русской библейской традиции. Конструкция «то, что… то и…» одновременно естественна по-русски и передаёт акцент греческого возобновительного ταῦτα.
