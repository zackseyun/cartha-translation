  naturalness: «Многое Я имею сказать и судить о вас» — несколько приподнятая, но понятная и литературная библейская формула; она естественнее для данного регистра, чем добавление «мог бы». Порядок слов также позволяет отнести «о вас» к обоим инфинитивам, как в греческом.
  terminology: «Пославший Меня», «истинен», «судить» и «миру» уместны и сохраняют исходную имплицитность и смысловой диапазон. Прописные буквы соответствуют принятой русской библейской традиции.
