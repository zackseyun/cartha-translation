lexical_decisions:
- source_word: πάλιν
  choice: снова
  rationale: 'Естественно передаёт повторность действия: Иисус вновь наклоняется после предшествующего эпизода.'
- source_word: κάτω κύψας
  choice: наклонившись
  rationale: Сочетание наречия κάτω с причастием κύψας описывает движение тела вниз; по-русски направление естественно выражено самим глаголом.
- source_word: ἔγραφεν
  choice: писал
  rationale: Несовершенный вид передаёт греческий имперфект и представляет действие как продолжавшееся, не уточняя содержание написанного.
- source_word: εἰς τὴν γῆν
  choice: на земле
  rationale: В данном контексте γῆ обозначает поверхность земли перед Иисусом; русская конструкция «писал на земле» естественна и соответствует смыслу.
