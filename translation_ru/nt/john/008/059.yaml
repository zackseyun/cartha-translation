reference: John 8:59
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἦραν οὖν λίθους ἵνα βάλωσιν ἐπ’ αὐτόν· Ἰησοῦς δὲ ἐκρύβη καὶ ἐξῆλθεν ἐκ τοῦ ⸀ἱεροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/059.yaml
  text: So they picked up stones to throw at him[a], but Jesus hid himself and went out of the temple.
translation:
  language: ru
  text: Тогда они подняли камни, чтобы бросить в него, но Иисус скрылся и вышел из храма[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Точнее: «из храмового комплекса» или «со дворов храма». Греческое ἱερόν обозначает весь храмовый комплекс, а не внутреннее святилище.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: подняли
  rationale: Глагол αἴρω здесь означает, что они взяли камни в руки для нападения. «Подняли камни» точно передаёт действие и естественно звучит по-русски.
- source_word: οὖν
  choice: тогда
  rationale: Частица связывает это действие с предшествующими словами Иисуса как последующую реакцию. «Тогда» естественно передаёт эту повествовательную и смысловую связь.
- source_word: λίθους
  choice: камни
  rationale: Обычное и точное соответствие λίθους в контексте попытки побить человека камнями.
- source_word: ἵνα βάλωσιν ἐπ’ αὐτόν
  choice: чтобы бросить в него
  rationale: Оборот ἵνα с сослагательным наклонением выражает цель; русская конструкция с «чтобы» сохраняет её прямо и естественно.
- source_word: ἐκρύβη
  choice: скрылся
  rationale: Хотя форма морфологически пассивна, в данном контексте она допускает возвратное значение. «Скрылся» не вводит неназванного действующего лица и не добавляет чудесных подробностей.
- source_word: ἐξῆλθεν
  choice: вышел
  rationale: Прямо передаёт физическое удаление Иисуса из указанного места.
- source_word: ἐκ τοῦ ἱεροῦ
  choice: из храма
  rationale: Краткое и привычное выражение для основного текста; более точное значение ἱερόν как всего храмового комплекса поясняется в сноске.
theological_decisions:
- issue: Характер ухода Иисуса
  choice: Передать только то, что Иисус скрылся и вышел
  alternative: Добавить, что Он чудесным образом прошёл среди них или стал невидимым
  rationale: Текст SBLGNT сообщает лишь, что Иисус скрылся и вышел из храма. Подробности из более поздних рукописных расширений не следует вносить в перевод.
translation_notes:
  register: Современный литературный русский язык; изложение краткое, ясное и достойное. Местоимение «него» дано со строчной буквы согласно общим нормам современной русской орфографии. Сноска помещена после слова «храма», к которому относится пояснение.
