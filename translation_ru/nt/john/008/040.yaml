source:
  edition: SBLGNT
  text: νῦν δὲ ζητεῖτέ με ἀποκτεῖναι, ἄνθρωπον ὃς τὴν ἀλήθειαν ὑμῖν λελάληκα ἣν ἤκουσα παρὰ τοῦ θεοῦ· τοῦτο Ἀβραὰμ οὐκ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/040.yaml
  text: But now you are seeking to kill me, a man who has told you the truth that I heard from God. Abraham did not do this.
translation:
  language: ru
  text: Но теперь вы стремитесь убить Меня — человека, который сказал вам истину, услышанную от Бога. Этого Авраам не сделал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Но теперь
  rationale: Передаёт и временное значение νῦν, и противопоставление, выраженное δέ, естественным русским оборотом.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: вы стремитесь убить Меня
  rationale: Сохраняет значение целенаправленного намерения в конструкции ζητέω с инфинитивом и настоящее время, не усиливая глагол до «пытаетесь».
- source_word: ἄνθρωπον
  choice: человека
  rationale: Прямо передаёт ἄνθρωπον и подчёркивает подлинную человечность Иисуса; винительный падеж естественно связан с «Меня» через пояснительное приложение.
- source_word: τὴν ἀλήθειαν ὑμῖν λελάληκα
  choice: сказал вам истину
  rationale: Естественная русская передача речи, завершённой в прошлом и сохраняющей значение в настоящем; определённость истины выражена контекстом.
- source_word: ἣν ἤκουσα παρὰ τοῦ θεοῦ
  choice: услышанную от Бога
  rationale: 'Причастный оборот ясно связывает относительное местоимение с «истиной», а παρά с родительным передаётся как указание на источник: «от Бога».'
- source_word: τοῦτο Ἀβραὰμ οὐκ ἐποίησεν
  choice: Авраам так не поступал
  rationale: Идиоматично передаёт смысл «Авраам этого не сделал», относя τοῦτο к описанному образу действий, без излишней буквальности.
theological_decisions:
- issue: Передача ἄνθρωπον в самоописании Иисуса
  choice: человека
  alternative: мужчину
  rationale: «Человека» является точным и естественным соответствием в данном контексте и сохраняет указание на человечность Иисуса, не внося посторонних христологических пояснений.
- issue: Источник услышанной Иисусом истины в παρὰ τοῦ θεοῦ
  choice: от Бога
  alternative: от Отца
  rationale: Перевод сохраняет именно θεός и не заменяет его более конкретным титулом «Отец», которого в данном стихе нет.
- issue: Референт τοῦτο в заключительной фразе
  choice: так не поступал
  alternative: этого не сделал
  rationale: Местоимение может охватывать описанное намерение убить того, кто возвестил Божью истину. Русское «так не поступал» сохраняет широкую соотнесённость и не уточняет её сверх текста.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Заглавное «Меня» следует принятой в русской библейской традиции почтительной орфографии. Тире оформляет приложение «человека» и делает длинную фразу прозрачной.
