  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Κἂν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἀληθής ἐστιν ἡ μαρτυρία μου, ὅτι οἶδα πόθεν ἦλθον καὶ ποῦ ὑπάγω· ὑμεῖς δὲ οὐκ οἴδατε πόθεν ἔρχομαι ⸀ἢ ποῦ ὑπάγω.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/014.yaml
  text: Jesus answered and said to them[a], “Even if I testify about myself, my testimony is true, because I know where I came from and where I am going[b]; but you do not know where I come from or where I am going.”
translation:
  language: ru
  text: 'Иисус ответил им: «Даже если Я свидетельствую о Самом Себе, Моё свидетельство истинно, потому что Я знаю, откуда пришёл и куда иду; а вы не знаете, откуда Я пришёл или куда иду».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «откуда Я пришёл и куда иду».'
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς
  choice: Иисус ответил им
  rationale: Русское «ответил им» естественно передаёт семитизированную повествовательную формулу «ответил и сказал им», не создавая тяжеловесного повтора.
- source_word: Κἂν
  choice: Даже если
  rationale: Сохраняет уступительное значение конструкции и ход рассуждения Иисуса.
- source_word: μαρτυρῶ περὶ ἐμαυτοῦ
  choice: свидетельствую о Самом Себе
  rationale: «Свидетельствую» сохраняет характерную для контекста лексику свидетельства, а «о Самом Себе» прямо передаёт περί с родительным падежом, не добавляя более узкого юридического смысла.
- source_word: ἀληθής ἐστιν ἡ μαρτυρία μου
  choice: Моё свидетельство истинно
  rationale: «Истинно» сохраняет связь с темой истины у Иоанна; «действительно» или «юридически действительно» неоправданно сузили бы смысл.
- source_word: ὅτι οἶδα
  choice: потому что Я знаю
  rationale: Передаёт причинную связь и прямое утверждение знания без ослабления.
- source_word: πόθεν ἦλθον καὶ ποῦ ὑπάγω
  choice: откуда пришёл и куда иду
  rationale: Естественно различает совершившийся приход и продолжающееся направленное движение; в русском контексте подлежащее «Я» не требуется повторять при каждом глаголе.
- source_word: ὑμεῖς δὲ οὐκ οἴδατε
  choice: а вы не знаете
  rationale: Явное «вы» сохраняет противопоставление, а союз «а» звучит естественно и точно передаёт контраст δέ.
theological_decisions:
- issue: Характер свидетельства Иисуса о Себе
  choice: Свидетельство названо истинным на основании знания Иисусом Своего происхождения и назначения.
  alternative: Передать ἀληθής как «действительно» или явно уточнить небесное происхождение и возвращение к Отцу.
  rationale: Греческий текст говорит об истинности свидетельства и уникальном знании Иисуса, но в самом стихе не формулирует это в более узких юридических или развернуто христологических терминах. Перевод сохраняет напряжение и позволяет контексту Евангелия раскрыть его смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавные местоимения при обращении Иисуса к Себе использованы в соответствии с распространённой русской библейской традицией. Избыточная формула «ответил и сказал» сглажена ради естественности. Маркер текстологической сноски поставлен после предложения.
