base_translation:
  language: en
  yaml_path: translation/nt/john/008/039.yaml
  text: They answered and said to him[a], “Abraham is our father.” Jesus says to them, “If you are Abraham’s children, you would be doing Abraham’s works.”
translation:
  language: ru
  text: 'Они ответили Ему: «Наш отец — Авраам». Иисус говорит им: «Если вы дети Авраама, то вы делали бы дела Авраама»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если бы вы были детьми Авраама, то делали бы дела Авраама». Греческий имперфект допускает понимание условия как противоречащего действительности.'
    reason: 'Лексико-грамматическая альтернатива: условное сочетание настоящего времени и имперфекта допускает более явно контрфактическую передачу.'
lexical_decisions:
- source_word: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Они ответили Ему
  rationale: Обычная для греческого повествования формула с двумя глаголами естественно передаётся по-русски одним глаголом «ответили»; смысл ответа и последующей речи сохраняется, а тяжеловесное «ответили и сказали» устранено.
- source_word: Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν
  choice: Наш отец — Авраам
  rationale: Сохраняет прямое и выразительное утверждение происхождения от Авраама; порядок слов естественен для современного русского языка.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Иисус говорит им
  rationale: Настоящее время сохраняет историческое настоящее оригинала и придаёт повествованию живость.
- source_word: τέκνα τοῦ Ἀβραάμ
  choice: дети Авраама
  rationale: «Дети» точно передаёт гендерно нейтральное τέκνα и выражает родственную принадлежность, не сужая её до сыновей мужского пола.
- source_word: τὰ ἔργα τοῦ Ἀβραὰμ
  choice: дела Авраама
  rationale: «Дела» сохраняет конкретный нравственно-поведенческий смысл ἔργα и связь между принадлежностью Аврааму и соответствующими поступками.
- source_word: ἐποιεῖτε
  choice: делали бы
  rationale: Несовершенный вид передаёт имперфективный характер формы, а частица «бы» — её вероятную условную, противоречащую действительности силу в данном контексте.
theological_decisions:
- issue: Характер принадлежности Аврааму в ответе Иисуса
  choice: Родственное обозначение «дети Авраама» сохранено буквально и противопоставлено делам собеседников.
  alternative: Истолковать слова как прямое отрицание физического происхождения или как утверждение исключительно духовного сыновства.
  rationale: Сам стих сопоставляет заявление об Аврааме как отце с отсутствием соответствующих дел, но не формулирует здесь исчерпывающего учения о физическом и духовном происхождении.
- issue: Условный смысл слов Иисуса
  choice: Основной текст сохраняет формально настоящее время в условии («если вы дети»), но передаёт имперфект следствия как «делали бы».
  alternative: «Если бы вы были детьми Авраама, то делали бы дела Авраама».
  rationale: 'Так сохраняется напряжение необычного греческого построения: настоящее ἐστε в условной части и имперфект ἐποιεῖτε в главной. Альтернативная полностью контрфактическая формулировка дана в примечании.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Историческое настоящее сохранено. Формула «ответили и сказали» естественно сокращена до «ответили», без потери содержания.
