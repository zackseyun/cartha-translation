  text: '[A] in our law, Moses commanded that such women be stoned. So what do you say?'
translation:
  language: ru
  text: А в нашем Законе Моисей повелел побивать таких женщин камнями.[a] А Ты что скажешь?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Продолжение рассказа о женщине, застигнутой в прелюбодеянии (Ин. 7:53–8:11). См. примечание к Ин. 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: Ἐν δὲ τῷ νόμῳ ἡμῶν
  choice: А в нашем Законе
  rationale: Предлог ἐν передан естественным русским «в», δὲ — мягким связующим «а». «Закон» написан с прописной буквы как обозначение Моисеева Закона, а ἡμῶν сохранено словом «нашем».
- source_word: ἐνετείλατο
  choice: повелел
  rationale: Глагол выражает авторитетное предписание; «повелел» естественно и точно передаёт его силу в контексте Моисеева Закона.
- source_word: τὰς τοιαύτας
  choice: таких женщин
  rationale: Форма женского рода множественного числа указывает на женщин такого рода; существительное добавлено по-русски для ясности без сужения контекстуального смысла.
- source_word: λιθοβολεῖσθαι
  choice: побивать… камнями
  rationale: Устойчивое русское выражение точно обозначает казнь через забрасывание камнями; пассивная конструкция греческого текста естественно преобразована в русскую конструкцию после «повелел».
- source_word: σὺ οὖν τί λέγεις;
  choice: А Ты что скажешь?
  rationale: Ударное σὺ передано явным «Ты», οὖν — естественной связью «а», а настоящее λέγεις в вопросе по-русски идиоматично передаётся формой «скажешь».
theological_decisions:
- issue: Характер предписания Моисеева Закона
  choice: 'Сохранено прямое утверждение говорящих: «Моисей повелел»'
  alternative: Уточнить или согласовать высказывание с конкретными ветхозаветными нормами
  rationale: Стих передаёт формулировку обвинителей; перевод не должен добавлять правовую или богословскую оценку их утверждения.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Обращение «Ты» написано с прописной буквы согласно распространённой русской библейской традиции. Маркер текстологического примечания поставлен после первого предложения, чтобы не разрывать его начало.
