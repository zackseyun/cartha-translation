source:
  edition: SBLGNT
  text: ⸂ἃ ἐγὼ⸃ ἑώρακα παρὰ τῷ ⸀πατρὶ λαλῶ· καὶ ὑμεῖς οὖν ⸂ἃ ἠκούσατε⸃ παρὰ ⸂τοῦ πατρὸς⸃ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/038.yaml
  text: I speak what I have seen with the Father[a], and you, then, do what you have heard from your father.
translation:
  language: ru
  text: Я говорю то, что видел у Отца[a], а вы, в свою очередь, делаете то, что слышали от своего отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в присутствии Отца». В первом обороте греческий предлог указывает на пребывание рядом с Отцом; во втором обороте другая падежная конструкция означает источник: «от своего отца».'
    reason: Уточнение различия между παρά с дательным и παρά с родительным.
lexical_decisions:
- source_word: ἃ
  choice: то, что
  rationale: Нейтрально и естественно передаёт субстантивированное относительное местоимение во множественном числе как содержание речи.
- source_word: ἑώρακα
  choice: видел
  rationale: Русская форма прошедшего времени естественно передаёт совершённое восприятие, сохраняющее значение для настоящего контекста; буквальное аспектуальное соответствие греческому перфекту по-русски невозможно.
- source_word: παρὰ τῷ πατρὶ
  choice: у Отца
  rationale: Παρά с дательным обозначает пребывание рядом или в присутствии кого-либо; «у Отца» естественно выражает эту близость, не сводя оборот к источнику сообщения.
- source_word: λαλῶ
  choice: говорю
  rationale: Прямое и естественное соответствие глаголу «говорить»; сочетание «говорю то, что» сохраняет прямое дополнение греческого текста.
- source_word: οὖν
  choice: в свою очередь
  rationale: Передаёт связующий и контрастно-сопоставительный оттенок частицы в параллели «Я… а вы…», не превращая её в чрезмерно строгий логический вывод.
- source_word: ἃ ἠκούσατε
  choice: то, что слышали
  rationale: Сохраняет параллель с «то, что видел» и естественно передаёт греческий аорист без искусственного русского перфекта.
- source_word: παρὰ τοῦ πατρὸς
  choice: от своего отца
  rationale: Παρά с родительным обозначает источник. Возвратное «своего» делает подразумеваемую принадлежность ясной по-русски, не называя отца дьяволом прежде прямого уточнения в ст. 44.
- source_word: ποιεῖτε
  choice: делаете
  rationale: Настоящее время и обычный русский глагол сохраняют как текущий, так и характерный характер действий.
- source_word: πατήρ / πατρὸς
  choice: Отец / отец
  rationale: Прописная буква в первом случае отмечает Бога Отца; строчная во втором сохраняет намеренный контраст и ещё не раскрытую прямо личность другого отца.
theological_decisions:
- issue: Следует ли прямо назвать второго отца дьяволом
  choice: Сохранить выражение «от своего отца»
  alternative: «от отца» или «от дьявола»
  rationale: В самом стихе второй отец не назван; его личность прямо раскрывается позднее, в ст. 44. Перевод сохраняет риторическое развитие и не вносит последующее уточнение раньше времени.
- issue: Значение первого оборота παρά с дательным
  choice: «у Отца» — в присутствии Отца
  alternative: «от Отца» — как полученное от источника
  rationale: Дательный после παρά прежде всего выражает близость или присутствие. Это сохраняет различие между тем, что Иисус видел у Отца, и тем, что собеседники слышали от своего отца.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достоинственный. Параллель «Я говорю… а вы… делаете» сохранена; «в свою очередь» передаёт οὖν без тяжеловесного «поэтому».
