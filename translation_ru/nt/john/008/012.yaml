  text: Πάλιν οὖν αὐτοῖς ⸂ἐλάλησεν ὁ Ἰησοῦς⸃ λέγων· Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου· ὁ ἀκολουθῶν ⸀ἐμοὶ οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ, ἀλλ’ ἕξει τὸ φῶς τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/012.yaml
  text: So Jesus spoke to them again[a], saying, “I am the light of the world. The one who follows me will certainly not walk in the darkness[b], but will have the light of life.”
translation:
  language: ru
  text: 'Итак, Иисус снова сказал им: «Я — свет мира. Кто следует за Мной, тот никогда не будет ходить во тьме[a], но будет иметь свет жизни[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте употреблено усиленное отрицание (οὐ μή): «ни в коем случае не будет ходить во тьме».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «свет жизни» можно также понять как «свет, дающий жизнь».
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν οὖν
  choice: Итак, … снова
  rationale: «Снова» передаёт повторность Πάλιν, а «итак» сохраняет связующую функцию οὖν, не придавая ей чрезмерно строгого логического значения.
- source_word: αὐτοῖς ἐλάλησεν … λέγων
  choice: заговорил с ними
  rationale: Естественная русская конструкция передаёт обращённую к ним речь и вводит прямую цитату без тяжеловесного буквального повтора «говорил… говоря».
- source_word: Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου
  choice: Я — свет мира
  rationale: Прямо передаёт именную конструкцию с подчёркнутым местоимением, не добавляя в перевод явно выраженной отсылки к Божественному имени.
- source_word: ὁ ἀκολουθῶν ἐμοὶ
  choice: Кто следует за Мной
  rationale: Естественно передаёт субстантивированное причастие как обобщённое обозначение любого следующего за Иисусом человека.
- source_word: οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ
  choice: никогда не будет ходить во тьме
  rationale: «Никогда не будет» ясно передаёт усиленное греческое отрицание οὐ μή, а образ «ходить во тьме» сохраняется без истолковывающей замены.
- source_word: ἀλλ’ ἕξει
  choice: но будет иметь
  rationale: Сохраняет противопоставление и простое будущее значение глагола ἔχω.
- source_word: τὸ φῶς τῆς ζωῆς
  choice: свет жизни
  rationale: 'Буквальная генитивная конструкция сохраняет смысловую открытость выражения: свет может пониматься как связанный с жизнью, принадлежащий ей или дающий её.'
theological_decisions:
- issue: Смысл самоопределения Ἐγώ εἰμι
  choice: «Я — свет мира» без дополнительного пояснения о Божественном имени
  alternative: Усилить формулировку так, чтобы явно обозначить возможную отсылку к речениям «Я есмь»
  rationale: Здесь Ἐγώ εἰμι грамматически связано с именной частью «свет мира»; перевод следует явному синтаксису и не исключает более широкого богословского звучания в контексте Евангелия.
- issue: Значение выражения «свет жизни»
  choice: Сохранить буквальное выражение «свет жизни»
  alternative: «свет, дающий жизнь» или «животворящий свет»
  rationale: Связь между «светом» и «жизнью» в греческом родительном падеже не сведена к одному толкованию; буквальная формулировка сохраняет эту богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным звучанием. Метафоры «свет мира», «ходить во тьме» и «свет жизни» сохранены; местоимение «Мной» написано с прописной буквы по устойчивой русской библейской издательской традиции.
