lexical_decisions:
- source_word: μὴ σὺ
  choice: Неужели Ты
  rationale: Частица μή вводит вопрос, предполагающий отрицательный ответ; «неужели» естественно передаёт по-русски недоверчивый и вызывающий характер реплики.
- source_word: μείζων
  choice: больше
  rationale: Сравнительная степень сохраняет широкое значение превосходства по положению или значимости, не уточняя его преждевременно.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: нашего отца Авраама
  rationale: Передаёт сравнительный генитив и сохраняет обозначение Авраама как почитаемого предка народа.
- source_word: ὅστις ἀπέθανεν
  choice: который умер
  rationale: Прямо передаёт исторический факт смерти Авраама, выраженный аористом.
- source_word: καὶ οἱ προφῆται ἀπέθανον
  choice: И пророки умерли
  rationale: 'Сохраняет добавочный параллельный довод: умер не только Авраам, но и пророки.'
- source_word: τίνα σεαυτὸν ποιεῖς
  choice: За кого Ты Себя выдаёшь?
  rationale: Естественная русская идиома передаёт обвинительный вопрос о том, кем Иисус представляет или объявляет Себя, не разрешая вопрос о Его личности.
theological_decisions:
- issue: Риторическое оспаривание положения Иисуса по отношению к Аврааму и пророкам
  choice: Передать вопрос как недоверчивое возражение, предполагающее ответ «нет»
  alternative: Нейтральное «Ты больше нашего отца Авраама?»
  rationale: μή указывает на ожидаемый отрицательный ответ. Формулировка сохраняет напряжение спора и не добавляет в речь собеседников готового богословского вывода.
