  text: οἶδα ὅτι σπέρμα Ἀβραάμ ἐστε· ἀλλὰ ζητεῖτέ με ἀποκτεῖναι, ὅτι ὁ λόγος ὁ ἐμὸς οὐ χωρεῖ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/037.yaml
  text: I know that you are Abraham’s offspring[a]; but you are seeking to kill me[b], because my word has no place in you.
translation:
  language: ru
  text: Я знаю, что вы — потомки Авраама[a]. Но вы стремитесь убить Меня, потому что Моё слово не находит места в вас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «семя Авраама».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не вмещается в вас»; возможный оттенок: «не распространяется среди вас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπέρμα Ἀβραάμ
  choice: потомки Авраама
  rationale: Существительное σπέρμα употреблено в собирательном значении и обозначает физическое происхождение. Множественное «потомки» естественно по-русски и не вводит заранее понятие духовного сыновства.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: вы стремитесь убить Меня
  rationale: Конструкция ζητέω с инфинитивом выражает направленное намерение или попытку. «Стремитесь убить» сохраняет длительный характер настоящего времени и не сводит смысл только к желанию или уже совершаемой попытке.
- source_word: ὁ λόγος ὁ ἐμὸς
  choice: Моё слово
  rationale: Прямой перевод сохраняет характерную для Иоанна лексику и её смысловую многослойность; «весть» или «учение» были бы более узкими толкованиями.
- source_word: οὐ χωρεῖ ἐν ὑμῖν
  choice: не находит места в вас
  rationale: Перевод сохраняет образ отсутствия внутреннего пространства для слова и естественно звучит по-русски, не исключая оттенков непринятия и отсутствия продвижения.
- source_word: ἀλλὰ
  choice: но
  rationale: Союз ясно передаёт резкое противопоставление признанного происхождения от Авраама и стремления убить Иисуса.
- source_word: οἶδα ὅτι
  choice: Я знаю, что
  rationale: Прямо и естественно передаёт вводную конструкцию и придаточное изъяснительное.
theological_decisions:
- issue: Соотношение физического происхождения от Авраама и подлинного соответствия Аврааму
  choice: «потомки Авраама» передаёт прежде всего генеалогический смысл
  alternative: «дети Авраама»
  rationale: В этом стихе Иисус признаёт физическое происхождение собеседников, но противопоставляет ему их враждебное отношение. Перевод не предрешает дальнейшее развитие темы истинного сыновства в контексте.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Метафора «не находит места» сохранена; местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией.
