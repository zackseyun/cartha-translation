  text: τίς ἐξ ὑμῶν ἐλέγχει με περὶ ἁμαρτίας; ⸀εἰ ἀλήθειαν λέγω, διὰ τί ὑμεῖς οὐ πιστεύετέ μοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/046.yaml
  text: Which one of you convicts me of sin? If I speak the truth[c][b][a], why do you not believe me?
translation:
  language: ru
  text: Кто из вас уличит Меня в грехе?[a] Если Я говорю истину, почему вы Мне не верите?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто из вас докажет, что Я виновен в грехе?»'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «почему вы Мне не доверяете?» Греческое слово может означать как веру словам человека, так и доверие ему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς ἐξ ὑμῶν
  choice: Кто из вас
  rationale: Естественно и точно передаёт вопросительное выражение со значением «кто из вашей среды», сохраняя прямой вызов слушателям.
- source_word: ἐλέγχει με περὶ ἁμαρτίας
  choice: уличит Меня в грехе
  rationale: Глагол ἐλέγχω здесь имеет оттенок выявления и доказательства вины; русское «уличить в грехе» естественно передаёт этот судебно-обличительный смысл. Настоящее время греческого глагола в риторическом вопросе по-русски идиоматично выражено совершенным будущим.
- source_word: εἰ ἀλήθειαν λέγω
  choice: Если Я говорю истину
  rationale: Сохраняет условную форму εἰ и не заменяет её истолковывающим «поскольку»; «говорю истину» звучит достойно и понятно.
- source_word: διὰ τί
  choice: почему
  rationale: Прямой и естественный русский эквивалент вопроса о причине.
- source_word: πιστεύετέ μοι
  choice: вы Мне не верите
  rationale: Дательный объект при πιστεύω допускает значения веры словам человека и доверия ему; «верить Мне» сохраняет обе стороны настолько, насколько это возможно по-русски.
theological_decisions:
- issue: Риторическая сила заявления Иисуса о безгрешности и истинности
  choice: Передать оба вопроса прямо, не смягчая и не разворачивая подразумеваемое утверждение.
  alternative: «Может ли кто-нибудь из вас доказать, что Я виновен хотя бы в одном грехе?»
  rationale: Греческий текст сам связывает вызов доказать грех с истинностью слов Иисуса. Прямой перевод сохраняет сильное христологическое содержание, не добавляя отсутствующих в тексте уточнений.
translation_notes:
  register: Современный литературный русский язык; речь прямая, торжественная без архаизации. Заглавные местоимения при обращении Иисуса к Себе сохранены как принятая русская библейская издательская норма.
