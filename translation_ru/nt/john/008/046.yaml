  source_fidelity: '«Кто из вас уличит Меня в грехе?» точно передаёт τίς ἐξ ὑμῶν ἐλέγχει με περὶ ἁμαρτίας: сохранены обращённый к слушателям вызов, обличительно-судебный оттенок ἐλέγχει и широкое «в грехе». Совершенное будущее «уличит» в русском риторическом вопросе естественно выражает возможность доказать обвинение. «Если Я говорю истину, почему вы Мне не верите?» сохраняет условное εἰ, прямое ἀλήθειαν λέγω и πιστεύετε с дательным объектом, не устраняя допустимый оттенок доверия.'
