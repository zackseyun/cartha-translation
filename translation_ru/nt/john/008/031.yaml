  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἔλεγεν οὖν ὁ Ἰησοῦς πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους· Ἐὰν ὑμεῖς μείνητε ἐν τῷ λόγῳ τῷ ἐμῷ, ἀληθῶς μαθηταί μού ἐστε,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/031.yaml
  text: So Jesus was saying to the Jews who had believed him[a], “If you remain in my word, you are truly my disciples,”
translation:
  language: ru
  text: 'Итак, Иисус говорил поверившим Ему иудеям[a]: «Если вы останетесь в Моём слове, то вы действительно Мои ученики».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уверовавшим в Него». Буквально по-гречески: «поверившим Ему».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔλεγεν
  choice: говорил
  rationale: Имперфект передаёт продолженное действие в прошлом; русское «говорил» естественно сохраняет этот видовой оттенок.
- source_word: οὖν
  choice: итак
  rationale: Обозначает продолжение и вывод из предшествующего повествования, не придавая связи чрезмерно строгой логической силы.
- source_word: πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους
  choice: поверившим Ему иудеям
  rationale: Перфектное причастие указывает на совершившееся ранее действие с сохраняющимся результатом. Дательный αὐτῷ передан прямо как «Ему», без добавления предлога «в».
- source_word: Ἐὰν
  choice: если
  rationale: Естественно передаёт условие, выраженное сочетанием ἐὰν с сослагательным наклонением.
- source_word: ὑμεῖς
  choice: вы
  rationale: Явное местоимение сохранено, что передаёт присутствующее в греческом тексте лёгкое смысловое выделение.
- source_word: μείνητε
  choice: останетесь
  rationale: Сохраняет характерный для Иоанна смысл пребывания и продолжения, оставаясь современным и ясным.
- source_word: ἐν τῷ λόγῳ τῷ ἐμῷ
  choice: в Моём слове
  rationale: Буквально и естественно сохраняет иоанновскую лексику и богословскую многозначность λόγος, не сужая его до одного лишь «учения».
- source_word: ἀληθῶς
  choice: действительно
  rationale: Передаёт подлинность ученичества современным литературным русским языком.
- source_word: μαθηταί μού ἐστε
  choice: вы действительно Мои ученики
  rationale: «Ученики» — установившийся и точный евангельский эквивалент μαθηταί; порядок слов звучит естественно по-русски.
theological_decisions:
- issue: Передача πιστεύω с дательным αὐτῷ
  choice: поверившим Ему
  alternative: уверовавшим в Него
  rationale: В греческом тексте употреблён дательный без εἰς, поэтому основной текст сохраняет прямой смысл «поверить кому-либо», не внося более полную богословскую формулу. Традиционно возможное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Заглавные буквы в местоимениях, относящихся к Иисусу, соответствуют распространённой русской издательской норме; синтаксис сделан ясным без устранения смыслового напряжения между заявленной верой и последующим диалогом.
