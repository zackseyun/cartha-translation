  text: ἀπεκρίθη Ἰησοῦς· Ἐὰν ἐγὼ ⸀δοξάσω ἐμαυτόν, ἡ δόξα μου οὐδέν ἐστιν· ἔστιν ὁ πατήρ μου ὁ δοξάζων με, ὃν ὑμεῖς λέγετε ὅτι θεὸς ⸀ἡμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/054.yaml
  text: Jesus answered[a], “If I glorify myself, my glory is nothing. My Father is the one who glorifies me, he whom you say is our God,”
translation:
  language: ru
  text: 'Иисус ответил: «Если Я прославляю Самого Себя, то слава Моя — ничто. Меня прославляет Мой Отец, о Котором вы говорите, что Он — наш Бог[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «ваш Бог».'
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ответил
  rationale: Обычная и естественная повествовательная передача глагола ἀποκρίνομαι в диалоге.
- source_word: δοξάσω / δοξάζων
  choice: прославляю / прославляет
  rationale: «Прославлять» сохраняет характерную для Евангелия от Иоанна тему славы и богословскую насыщенность δοξάζω.
- source_word: ἡ δόξα μου οὐδέν ἐστιν
  choice: слава Моя — ничто
  rationale: Близко передаёт прямую конструкцию греческого текста и звучит достойно и понятно по-русски.
- source_word: ὁ πατήρ μου
  choice: Мой Отец
  rationale: Передаёт личное обозначение Бога в речи Иисуса; прописная буква соответствует русской библейской издательской традиции.
- source_word: ὁ δοξάζων με
  choice: Меня прославляет Мой Отец
  rationale: Артиклированное причастие передано личной глагольной конструкцией; она естественна по-русски и сохраняет акцент на Отце как прославляющем Иисуса.
- source_word: ὃν ὑμεῖς λέγετε ὅτι θεὸς ἡμῶν ἐστιν
  choice: 'о Котором вы говорите: «Он — наш Бог»'
  rationale: Русская конструкция с «говорить о ком-либо» естественно передаёт соотнесение относительного местоимения с Отцом, а прямая речь ясно выражает содержание утверждения.
- source_word: θεὸς
  choice: Бог
  rationale: В контексте имеется в виду Бог Израиля, поэтому употреблена прописная буква.
- source_word: ἡμῶν
  choice: наш
  rationale: Основной текст следует чтению SBLGNT ἡμῶν; вариант ὑμῶν отражён в сноске.
theological_decisions:
- issue: Местоимение в θεὸς ἡμῶν/ὑμῶν ἐστιν
  choice: наш Бог
  alternative: ваш Бог
  rationale: Основной текст следует предоставленному чтению SBLGNT ἡμῶν («наш»). Содержательно значимый вариант ὑμῶν («ваш») не устраняется, а указывается в текстологической сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Прописные местоимения в речи Иисуса («Я», «Самого Себя», «Моя») и относящееся к Отцу «Котором» соответствуют распространённой русской религиозно-издательской норме; они не добавляют отдельного толкования. Синтаксис слегка перестроен ради естественности русского языка без устранения смыслового акцента на Отце как прославляющем Иисуса.
