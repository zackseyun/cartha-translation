  text: ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ ὁ θεὸς πατὴρ ὑμῶν ἦν ἠγαπᾶτε ἂν ἐμέ, ἐγὼ γὰρ ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω· οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα, ἀλλ’ ἐκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/042.yaml
  text: Jesus said to them[a], “If God were your Father, you would love me, because I came from God and am here. For I have not come from myself[b], but he sent me.”
translation:
  language: ru
  text: 'Иисус сказал им: «Если бы Бог был вашим Отцом, вы любили бы Меня, потому что Я вышел от Бога и нахожусь здесь[a]. Ведь Я пришёл не Сам от Себя[b] — Меня послал Он».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вышел от Бога и пришёл». Глагол может подчёркивать как прибытие, так и нынешнее присутствие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пришёл не по собственной инициативе». Греческое выражение может указывать и на источник, и на самостоятельность действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ ὁ θεὸς πατὴρ ὑμῶν ἦν, ἠγαπᾶτε ἂν ἐμέ
  choice: Если бы Бог был вашим Отцом, вы любили бы Меня
  rationale: Сочетание εἰ с имперфектом и ἄν выражает условие, представленное как не соответствующее действительности; русская конструкция «если бы... был... любили бы» точно передаёт этот смысл.
- source_word: ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω
  choice: Я вышел от Бога и пришёл
  rationale: «Вышел от Бога» сохраняет указание на источник и словесный образ ἐξέρχομαι, не превращая его в позднейший технический термин; «пришёл» естественно передаёт ἥκω как прибытие с сохраняющимся результатом.
- source_word: οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα
  choice: Ведь Я пришёл не Сам от Себя
  rationale: Формулировка сохраняет буквальный образ источника и одновременно допускает подразумеваемый смысл отсутствия самостоятельной инициативы; перфект естественно передаётся русским прошедшим совершенного вида.
- source_word: ἀλλ’ ἐκεῖνός με ἀπέστειλεν
  choice: это Он послал Меня
  rationale: Указательное ἐκεῖνος имеет эмфатическую силу; конструкция «это Он» естественно подчёркивает Бога как отправителя, а «послал» сохраняет миссионный смысл ἀποστέλλω.
theological_decisions:
- issue: Язык происхождения Иисуса без привнесения позднейшей догматической терминологии
  choice: Я вышел от Бога и пришёл
  alternative: Я исшёл от Бога и пришёл
  rationale: Основной текст утверждает происхождение и посланничество Иисуса, но использует обычные русские глаголы, соответствующие обычным греческим глаголам. Более торжественное «исшёл» могло бы восприниматься как специальная богословская формула.
- issue: Смысл ἀπ’ ἐμαυτοῦ
  choice: пришёл не Сам от Себя
  alternative: пришёл не по собственной воле
  rationale: Выбранный вариант сохраняет неоднозначность между источником и самостоятельной инициативой и поддерживает параллель с «от Бога»; альтернативный вариант однозначно сужает смысл до инициативы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным библейским регистром. Прописные местоимения при обращении к Иисусу и упоминании Бога выбраны как традиционная издательская норма русского библейского текста; они не добавляют отдельного смыслового утверждения.
