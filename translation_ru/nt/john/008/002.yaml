  text: At dawn he came again to the temple, and all the people were coming to him; and he sat down and began to teach them.
translation:
  language: ru
  text: На рассвете Он снова пришёл в храм. Весь народ шёл к Нему, и Он, сев, учил их.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот стих продолжает рассказ о женщине, схваченной в прелюбодеянии (Ин. 7:53–8:11), отсутствующий в самых ранних греческих рукописях. См. примечание к Ин. 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: Ὄρθρου
  choice: На рассвете
  rationale: Родительный времени обозначает раннее утро, около восхода солнца; «на рассвете» передаёт это кратко и естественно.
- source_word: παρεγένετο
  choice: пришёл
  rationale: Глагол обозначает прибытие или появление в определённом месте; при указании направления «в храм» естественно русское «пришёл».
- source_word: ἱερόν
  choice: храм
  rationale: Слово обозначает весь храмовый комплекс, включая дворы, где учили народ, а не только внутреннее святилище; традиционное «храм» остаётся понятным в контексте.
- source_word: πᾶς ὁ λαὸς ἤρχετο
  choice: Весь народ шёл
  rationale: 'Имперфект передаёт продолжавшееся или разворачивавшееся действие: люди подходили к Иисусу; «шёл» естественно сохраняет этот оттенок.'
- source_word: καθίσας
  choice: сев
  rationale: Аористное причастие обозначает действие, предшествовавшее обучению; деепричастие «сев» лаконично сохраняет последовательность.
- source_word: ἐδίδασκεν
  choice: учил
  rationale: Имперфект естественно передаёт продолженное действие. В отличие от «начал учить», перевод «учил» не закрепляет возможное, но не обязательное начинательное значение.
