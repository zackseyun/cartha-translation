source:
  edition: SBLGNT
  text: καὶ ἐὰν κρίνω δὲ ἐγώ, ἡ κρίσις ἡ ἐμὴ ⸀ἀληθινή ἐστιν, ὅτι μόνος οὐκ εἰμί, ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/016.yaml
  text: But even if I do judge[a], my judgment is true, because I am not alone, but I and the Father who sent me.
translation:
  language: ru
  text: 'Но даже если Я и сужу[a], Мой суд истинен, потому что Я не один: со Мной Отец, пославший Меня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если Я сужу»; «если Мне случится судить». Греческий условный оборот допускает более формальную передачу, но в данном контексте, вероятно, имеет уступительный смысл: «даже если Я и сужу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν κρίνω
  choice: даже если Я и сужу
  rationale: Сочетание ἐὰν с сослагательным κρίνω выражает условную возможность; в данном контексте оборот имеет уступительный оттенок, естественно передаваемый по-русски как «даже если Я и сужу».
- source_word: δὲ
  choice: Но
  rationale: Частица обозначает контраст с предыдущим высказыванием и естественно передаётся противительным союзом.
- source_word: ἡ κρίσις ἡ ἐμὴ
  choice: Мой суд
  rationale: Сохраняет юридический и богословский смысл κρίσις и естественно передаёт конструкцию с притяжательным определением.
- source_word: ἀληθινή
  choice: истинен
  rationale: Передаёт значение истинности, не сводя его только к юридической действительности или обоснованности, и сохраняет характерную для Иоанна смысловую связь с истиной.
- source_word: μόνος οὐκ εἰμί
  choice: Я не один
  rationale: Прямо сохраняет мысль о том, что Иисус действует и свидетельствует не в одиночку.
- source_word: ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ
  choice: со Мной Отец, пославший Меня
  rationale: Идиоматичный русский оборот ясно выражает совместность Иисуса и Отца. Причастный оборот сохраняет определительную функцию πέμψας με; добавление «со Мной» эксплицирует подразумеваемую связку после «Я не один», не меняя смысла.
theological_decisions:
- issue: Связь суда Иисуса со свидетельством Отца
  choice: Истинность суда Иисуса обоснована тем, что Он не один, но с Ним пославший Его Отец.
  alternative: Высказывание можно понимать более узко — лишь как юридический довод о требуемом числе свидетелей.
  rationale: 'Перевод сохраняет прямое основание, указанное в греческом тексте: суд Иисуса не отделён от Отца. При этом он не разворачивает данное утверждение в более поздние догматические формулы.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Местоимения, относящиеся к Иисусу и Отцу, написаны с прописной буквы как традиционная издательская норма; синтаксис сделан естественным для современного читателя.
