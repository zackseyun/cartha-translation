  source_fidelity: 'Перевод точно передаёт уступительно-условный оборот ἐὰν κρίνω δὲ ἐγώ («Но даже если Я и сужу»), утверждение об истинности суда и основание: Иисус не один, а вместе с пославшим Его Отцом. Оборот «со Мной Отец» является естественным русским раскрытием эллиптической координации «Я и Отец» и не добавляет нового богословского содержания.'
