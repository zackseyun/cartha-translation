id: JHN.8.11
reference: John 8:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἡ δὲ εἶπεν, Οὐδείς, κύριε. Εἶπεν δὲ ὁ Ἰησοῦς, Οὐδὲ ἐγώ σε κατακρίνω· πορεύου, καὶ μηκέτι ἁμάρτανε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/011.yaml
  text: She[a] said, "No one, Lord." And Jesus said, "Neither do I condemn you; go, and sin no more."
translation:
  language: ru
  text: 'Она[a] ответила: «Никто, Господи». Тогда Иисус сказал: «И Я тебя не осуждаю. Иди и больше не греши».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Это заключительный стих рассказа о женщине, застигнутой в прелюбодеянии (Ин. 7:53–8:11). См. примечание к Ин. 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: κύριε
  choice: Господи
  rationale: Звательная форма передаёт уважительное обращение и признание власти Иисуса; «господин» также возможно по контексту, но «Господи» сохраняет смысловую открытость греческого обращения и естественно звучит в библейском русском регистре.
- source_word: κατακρίνω
  choice: осуждаю
  rationale: Глагол имеет судебный оттенок — вынести обвинительный приговор; русское «осуждаю» естественно передаёт этот смысл в данном контексте.
- source_word: μηκέτι ἁμάρτανε
  choice: больше не греши
  rationale: Передаёт повеление прекратить грех и впредь к нему не возвращаться, не уточняя сверх текста характер или длительность прежнего действия.
- source_word: πορεύου
  choice: иди
  rationale: Краткое и естественное соответствие повелительной форме настоящего времени в данном контексте.
theological_decisions:
- issue: Смысл обращения κύριε
  choice: Господи
  alternative: господин
  rationale: Греческое слово допускает как вежливое «господин», так и более высокое исповедальное «Господь». Выбран традиционный вариант, не снимающий возможного признания власти Иисуса.
- issue: Связь неосуждения с призывом оставить грех
  choice: Сохранены как два последовательных самостоятельных высказывания
  alternative: Связать причинно или условно
  rationale: В оригинале Иисус сначала отказывается осудить женщину, а затем повелевает ей больше не грешить; текст не формулирует прощение как условное.
translation_notes:
  register: Современный литературный русский язык с краткой, dignified прямой речью. Союз δέ передан контекстно как «тогда» во второй реплике, а в первой — через глагол ответа; повторяющееся буквальное «же» устранено как неестественное. Маркер текстологической сноски поставлен непосредственно после первого слова стиха.
