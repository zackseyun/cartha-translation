  text: ἀπεκρίθη Ἰησοῦς· Ἐγὼ δαιμόνιον οὐκ ἔχω, ἀλλὰ τιμῶ τὸν πατέρα μου, καὶ ὑμεῖς ἀτιμάζετέ με.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/049.yaml
  text: Jesus answered[a], “I do not have a demon, but I honor my Father, and you dishonor me.”
translation:
  language: ru
  text: 'Иисус ответил: «Во Мне нет беса, но Я чту Моего Отца, а вы бесчестите Меня».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ответил
  rationale: Обычный и естественный русский эквивалент повествовательного глагола ответа в диалоге.
- source_word: δαιμόνιον οὐκ ἔχω
  choice: во Мне нет беса
  rationale: Сохраняет прямой образ греческого оборота «иметь беса», но звучит естественнее в современном русском, чем «Я не имею беса»; толкование как одержимости вынесено в сноску.
- source_word: τιμῶ
  choice: чту
  rationale: Достойный и понятный эквивалент со значением почитания; позволяет сохранить смысловой контраст с ἀτιμάζω.
- source_word: τὸν πατέρα μου
  choice: Моего Отца
  rationale: Контекст Евангелия от Иоанна ясно указывает на Бога; прописная буква обозначает это контекстуальное отнесение, не добавляя нового содержания.
- source_word: ἀτιμάζετέ
  choice: бесчестите
  rationale: 'Сохраняет явный лексический контраст τιμάω/ἀτιμάζω: «чту/бесчестите».'
- source_word: με
  choice: Меня
  rationale: Прямой эквивалент объектного местоимения; прописная буква соответствует принятому благоговейному русскому оформлению речи о Христе.
- source_word: Ἐγώ ... ὑμεῖς
  choice: Я ... а вы
  rationale: Явное противопоставление местоимений передано конструкцией с противительным «а».
theological_decisions:
- issue: Значение выражения δαιμόνιον ἔχω
  choice: 'Сохранить предметный образ: «во Мне нет беса».'
  alternative: «Я не одержим бесом».
  rationale: Основной текст не должен без необходимости заменять греческий оборот истолковывающей формулировкой; вероятный смысл одержимости указан в сноске.
- issue: Кого Иисус называет «Моим Отцом»
  choice: Бог, названный Отцом; «Отец» с прописной буквы.
  alternative: Родной отец в обычном семейном смысле.
  rationale: Ближайший и широкий контекст Иоанна однозначно указывает на Бога, при этом перевод сохраняет исходную формулировку без догматического расширения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Чту» и «бесчестите» сохраняют риторический контраст оригинала; форма «во Мне нет беса» понятна и менее искусственна, чем буквальное «Я не имею беса».
