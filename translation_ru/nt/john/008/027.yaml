id: JHN.8.27
reference: John 8:27
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐκ ἔγνωσαν ὅτι τὸν πατέρα αὐτοῖς ἔλεγεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/027.yaml
  text: They did not understand that he was speaking to them about the Father[a].
translation:
  language: ru
  text: Они не поняли, что Он говорил им об Отце[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Они не знали, что Он говорил им об Отце».'
    reason: 'Лексическая альтернатива для οὐκ ἔγνωσαν: глагол может означать как отсутствие понимания, так и отсутствие знания.'
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: не поняли
  rationale: В данном контексте γινώσκω обозначает неспособность уловить смысл слов Иисуса и понять, кого Он имеет в виду. Вариант «не поняли» естественен по-русски и сохраняет когнитивный смысл; буквальное «не знали» отмечено в сноске.
- source_word: ὅτι
  choice: что
  rationale: Союз вводит придаточное изъяснительное, раскрывающее содержание того, чего они не поняли.
- source_word: τὸν πατέρα
  choice: об Отце
  rationale: В ближайшем контексте Евангелия от Иоанна имеется в виду Бог как Отец Иисуса. Прописная буква передаёт это контекстуальное указание, не добавляя к греческому тексту отдельного богословского утверждения.
- source_word: αὐτοῖς
  choice: им
  rationale: 'Дательный падеж при λέγω естественно передаётся по-русски как адресат речи: «говорил им».'
- source_word: ἔλεγεν
  choice: говорил
  rationale: Русская форма несовершенного вида естественно передаёт длительное или продолжающееся значение греческого имперфекта.
theological_decisions:
- issue: Кого обозначает «Отец»
  choice: Иисус говорил им о Боге Отце.
  alternative: Иисус говорил о человеческом отце.
  rationale: В непосредственном контексте Евангелия от Иоанна «Отец» служит обозначением Бога, Отца Иисуса. Написание с прописной буквы отражает контекстуальный референт, не привнося позднейших догматических формулировок.
- issue: Передача γινώσκω в контексте
  choice: «не поняли»
  alternative: «не знали» или «не распознали»
  rationale: Здесь речь идёт прежде всего о том, что слушатели не уловили, кого Иисус называет Отцом. При этом лексическая возможность «не знали» сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная и достойная формулировка. Местоимение «Он» написано с прописной буквы согласно принятой русской библейской традиции; это не устраняет каких-либо смысловых неоднозначностей стиха.
