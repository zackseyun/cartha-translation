  verdict: revise
  source_fidelity: Нужна небольшая правка. Аорист εἶπαν лучше передать совершенным «сказали», а не «говорили». Формулировка вопроса должна прямо отражать «что это такое, что Он говорит нам», не подменяя её отвлечённым «что означает сказанное Им нам». Неоднозначность ὅτι сохранена в основном тексте и примечании.
  naturalness: «Что означает сказанное Им нам» тяжеловесно и не вполне естественно для современной прямой речи. «Что это такое, о чём Он говорит нам?» — литературно, ясно и близко к греческому. «И ещё» избыточно интерпретирует простое καί; «И что значит...» естественно передаёт присоединение второго непонятного фрагмента.
  terminology: «Отец» передан без добавления местоимения «Мой», как в греческом. Повтор временного выражения и мотив видения сохранены. Причинное прочтение ὅτι оставлено основным, а изъяснительное — в примечании.
  issues:
