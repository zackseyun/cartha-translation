  text: εἶπαν οὖν ἐκ τῶν μαθητῶν αὐτοῦ πρὸς ἀλλήλους· Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με; καί· ⸀Ὅτι ὑπάγω πρὸς τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/017.yaml
  text: 'So some of his disciples said to one another[a], “What is this that he is saying to us: ‘A little while, and you will not see me, and again a little while, and you will see me’? And, ‘Because I am going to the Father’?”'
translation:
  language: ru
  text: 'Итак, некоторые из Его учеников сказали друг другу: «Что это такое, о чём Он говорит нам: „Ещё немного — и вы не будете видеть Меня, и ещё немного — и увидите Меня“? И что значит: „Потому что Я иду к Отцу“[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Что Я иду к Отцу». Греческий союз может вводить содержание высказывания («что») или иметь причинное значение («потому что»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Итак
  rationale: Передаёт выводно-повествовательный переход от предыдущих слов Иисуса, не делая причинную связь чрезмерно жёсткой.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: некоторые из Его учеников
  rationale: Предлог ἐκ имеет партитивное значение и указывает не на всех учеников, а на часть из них.
- source_word: πρὸς ἀλλήλους
  choice: друг другу
  rationale: Естественно передаёт взаимное общение, выраженное местоимением ἀλλήλους.
- source_word: Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν
  choice: Что означает сказанное Им нам
  rationale: Естественная современная русская формулировка, сохраняющая недоумение учеников относительно смысла слов Иисуса.
- source_word: Μικρὸν
  choice: Ещё немного
  rationale: В данном контексте слово имеет временной смысл; русская формула передаёт подразумеваемый краткий промежуток времени.
- source_word: θεωρεῖτέ
  choice: будете видеть
  rationale: Передаёт зрительное восприятие без добавочного толкования; несовершенный вид уместен для данного глагола и конструкции.
- source_word: ὄψεσθέ
  choice: увидите
  rationale: Будущая форма ὁράω передана естественным русским совершенным видом; различие с θεωρεῖτε слегка отражено видом глагола, но общий мотив видения сохранён.
- source_word: πάλιν
  choice: снова
  rationale: Прямой и современный эквивалент наречия повторности.
- source_word: Ὅτι ὑπάγω πρὸς τὸν πατέρα
  choice: Потому что Я иду к Отцу
  rationale: Сохраняет возможное причинное значение ὅτι и форму цитируемых слов, хотя синтаксис намеренно остаётся несколько необычным, как и в греческом тексте. Возможное изъяснительное понимание вынесено в примечание.
- source_word: τὸν πατέρα
  choice: к Отцу
  rationale: Сохраняет определённое обозначение «Отец» и не добавляет отсутствующее в греческом тексте притяжательное «Мой».
theological_decisions:
- issue: К чему относятся уход Иисуса и последующее видение Его
  choice: Не уточнять референт и сохранить недоумение учеников
  alternative: Истолковать слова как указание на смерть и воскресение, вознесение и духовное присутствие либо явления после воскресения
  rationale: Сам стих не разрешает вопрос и подчёркивает непонимание учеников; конкретизация внесла бы в перевод толкование, отсутствующее в тексте.
- issue: Значение ὅτι перед словами об уходе к Отцу
  choice: 'В основном тексте передать причинно: «Потому что»'
  alternative: 'Изъяснительное: «Что Я иду к Отцу»'
  rationale: Оба синтаксических понимания возможны. Основной текст сохраняет причинное звучание ранее произнесённой фразы, а примечание фиксирует реальную грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Повтор «немного» и неопределённость слов Иисуса сохранены; синтаксическая шероховатость фразы «Потому что Я иду к Отцу» не сглажена толкованием.
