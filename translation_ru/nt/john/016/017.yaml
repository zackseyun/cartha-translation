    issue: Время глагола «говорили»
    rationale: εἶπαν — аорист, сообщающий единичную реплику; «сказали» точнее и естественнее в данном повествовании.
  - severity: low
    issue: Тяжеловесная и менее прямая передача вопроса
    rationale: «Что означает сказанное Им нам» преобразует личную реплику «что Он говорит нам» в номинализацию. Более прямой русский вопрос ближе к исходному синтаксису и звучит естественнее.
  - severity: low
