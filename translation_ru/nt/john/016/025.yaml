id: JHN.16.25
reference: John 16:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ταῦτα ἐν παροιμίαις λελάληκα ὑμῖν· ⸀ἔρχεται ὥρα ὅτε οὐκέτι ἐν παροιμίαις λαλήσω ὑμῖν ἀλλὰ παρρησίᾳ περὶ τοῦ πατρὸς ⸀ἀπαγγελῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/025.yaml
  text: I have spoken these things to you in figures of speech[a]. An hour is coming when I will no longer speak to you in figures of speech[c][b], but will tell you plainly about the Father.
translation:
  language: ru
  text: Я говорил вам всё это иносказательно[a]. Наступает час[b], когда Я уже не буду говорить вам иносказательно, но прямо[c] расскажу вам об Отце.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «притчами», «образным языком» или «прикровенно»; греческое слово здесь указывает на образную или непрямую речь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наступает время». В Евангелии от Иоанна слово «час» нередко имеет особое богословское значение.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «открыто» или «со всей откровенностью»; здесь имеется в виду ясная, неиносказательная речь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαις
  choice: иносказательно
  rationale: В данном контексте слово обозначает образную, непрямую или до некоторой степени сокрытую речь, а не обязательно притчу как особый жанр.
- source_word: λελάληκα
  choice: Я говорил
  rationale: Передаёт совершившуюся речь, сохраняющую значение для настоящего, и естественно звучит по-русски в связи с последующим будущим временем.
- source_word: ἔρχεται ὥρα
  choice: наступает час
  rationale: Сохраняет характерный для Евангелия от Иоанна образ «часа» и его возможную богословскую значимость, не заменяя его толкованием «время».
- source_word: οὐκέτι
  choice: уже не
  rationale: Естественно и точно выражает прекращение прежнего способа речи в будущем.
- source_word: λαλήσω
  choice: буду говорить
  rationale: Сохраняет повтор глагола речи и подчёркивает контраст между двумя способами изложения.
- source_word: παρρησίᾳ
  choice: прямо
  rationale: В противопоставлении иносказательной речи означает ясное и непосредственное высказывание, а не прежде всего смелость или публичность.
- source_word: ἀπαγγελῶ
  choice: расскажу
  rationale: Естественно передаёт сообщение или раскрытие сведений; в сочетании «об Отце» звучит яснее современному читателю, чем «возвещу».
- source_word: περὶ τοῦ πατρὸς
  choice: об Отце
  rationale: Точно и естественно передаёт предмет речи, сохраняя в контексте Иоанна значимость наименования «Отец».
theological_decisions:
- issue: Передача ὥρα в контексте Евангелия от Иоанна
  choice: наступает час
  alternative: наступает время
  rationale: Буквальное «час» сохраняет характерную иоанновскую формулировку и её богословский оттенок, не утверждая сверх текста, к какому именно событию она относится.
- issue: Смысл παρρησίᾳ в противопоставлении ἐν παροιμίαις
  choice: прямо
  alternative: открыто; с полной откровенностью
  rationale: Контекст противопоставляет непрямую, образную речь ясному сообщению; «прямо» передаёт этот контраст, не смещая акцент к бесстрашию говорящего.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным библейского текста строем. «Иносказательно» сохраняет смысл непрямой образной речи без узкого жанрового значения слова «притча». Заглавные местоимения при обращении Иисуса к Себе использованы в соответствии с распространённой русской библейской издательской традицией.
