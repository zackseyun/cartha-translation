- from: Но когда придёт Он — Дух истины, — то поведёт вас ко всей истине[a], потому что будет говорить не от Себя[b], а скажет то, что услышит, и возвестит вам грядущее[c].
  to: Но когда придёт Он, Дух истины, Он поведёт вас ко всей истине[a], потому что будет говорить не от Себя[b], а будет говорить то, что услышит, и возвестит вам грядущее[c].
  rationale: Правка устраняет неестественную русскую конструкцию с тире и частицей «то», сохраняя эмфатическое личное «Он» и приложение «Дух истины». Параллельное «будет говорить» точнее отражает две будущие формы λαλήσει. Сноска к спорному оттенку ἐν сохраняет формально более близкую альтернативу без неоправданной замены глагола.
