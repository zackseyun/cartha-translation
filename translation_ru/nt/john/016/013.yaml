  text: ὅταν δὲ ἔλθῃ ἐκεῖνος, τὸ πνεῦμα τῆς ἀληθείας, ὁδηγήσει ὑμᾶς ⸂ἐν τῇ ἀληθείᾳ πάσῃ⸃, οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ, ἀλλ’ ὅσα ⸀ἀκούσει λαλήσει, καὶ τὰ ἐρχόμενα ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/013.yaml
  text: But when he[a], the Spirit of truth, comes, he will guide you into all the truth. For he will not speak from himself, but whatever he hears he will speak[d][c][b], and he will declare to you the things that are coming.
translation:
  language: ru
  text: Но когда придёт Он, Дух истины, Он поведёт вас ко всей истине[a], потому что будет говорить не от Себя[b], а будет говорить то, что услышит, и возвестит вам грядущее[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поведёт вас во всей истине». Буквально греческое выражение содержит предлог «в»; при глаголе «вести» возможен и направительный смысл.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «не будет говорить самостоятельно». Буквально: «не от Себя».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «то, что должно произойти»; «то, что наступает».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Но когда
  rationale: ὅταν вводит временное придаточное с будущей направленностью, а δέ передаёт мягкое противопоставление предыдущему контексту.
- source_word: ἔλθῃ ἐκεῖνος
  choice: придёт Он
  rationale: Аорист конъюнктива после ὅταν естественно передаётся будущим временем. Выделенное «Он» отражает личное указание ἐκεῖνος и сохраняет эмфазу греческого текста.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: Дух истины
  rationale: Сохранена формальная конструкция с родительным падежом; прописная буква соответствует контекстуальному обозначению Святого Духа.
- source_word: ὁδηγήσει ὑμᾶς
  choice: поведёт вас
  rationale: ὁδηγέω означает вести или направлять. «Поведёт» естественно сохраняет образ движения и хорошо сочетается с направительным «ко всей истине».
- source_word: ἐν τῇ ἀληθείᾳ πάσῃ
  choice: ко всей истине
  rationale: Хотя ἐν формально обычно означает «в», при глаголе ведения выражение может иметь направительный оттенок. Русское «поведёт ко всей истине» естественно и не предполагает уже достигнутого пребывания в ней; более буквальный вариант отмечен в сноске.
- source_word: οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ
  choice: потому что будет говорить не от Себя
  rationale: Сохранено буквальное значение ἀφ’ ἑαυτοῦ — «от себя», выражающее источник речи. «Потому что» естественно передаёт пояснительное γάρ.
- source_word: ἀλλ’ ὅσα ἀκούσει λαλήσει
  choice: а скажет то, что услышит
  rationale: Переданы противопоставление и будущая форма ἀκούσει. Русский глагол совершенного вида «услышит» естественно обозначает восприятие, предшествующее сообщению.
- source_word: τὰ ἐρχόμενα
  choice: грядущее
  rationale: Субстантивированное причастие обозначает то, что наступает или должно произойти. «Грядущее» кратко, понятно и сохраняет широту выражения без сведения его только к предсказаниям.
- source_word: ἀναγγελεῖ ὑμῖν
  choice: возвестит вам
  rationale: ἀναγγέλλω означает объявлять, сообщать, возвещать. «Возвестит» соответствует торжественному откровенному характеру контекста, оставаясь понятным современному читателю.
theological_decisions:
- issue: Личное обозначение Духа
  choice: Личное местоимение «Он» с прописной буквы
  alternative: Избежать местоимения и назвать только «Дух истины»
  rationale: Мужской указательный элемент ἐκεῖνος, несмотря на средний род πνεῦμα, подчёркивает личное указание. Русское «Он» передаёт эту особенность, не добавляя отдельного догматического утверждения.
- issue: Значение ἐν τῇ ἀληθείᾳ πάσῃ
  choice: «ко всей истине»
  alternative: «во всей истине»
  rationale: При глаголе ὁδηγέω выражение допускает направительное понимание, естественное для русского глагола «поведёт». Формально-локативное понимание остаётся реальной возможностью и приведено в сноске.
- issue: Зависимость речи Духа
  choice: Сохранить «не от Себя» без пояснения источника или власти
  alternative: «не по собственной воле» / «не от собственной власти»
  rationale: Буквальная формулировка сохраняет богословское напряжение текста и не уточняет сверх сказанного, идёт ли речь преимущественно об источнике, самостоятельной инициативе или власти.
- issue: Объём выражения τὰ ἐρχόμενα
  choice: «грядущее»
  alternative: «то, что должно произойти»
  rationale: Нейтральное собирательное выражение сохраняет неопределённость греческого текста относительно конкретного состава будущих событий.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренно возвышенной библейской интонацией. Тире выделяют приложение «Дух истины» и сохраняют акцент греческого ἐκεῖνος без тяжеловесного синтаксиса. Прописные буквы в местоимениях, относящихся к Духу, употреблены последовательно в рамках данного стиха.
