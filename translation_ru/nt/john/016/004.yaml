base_translation:
  language: en
  yaml_path: translation/nt/john/016/004.yaml
  text: But I have spoken these things to you so that when their hour comes[a], you may remember that I told you. But I did not tell you these things from the beginning, because I was with you.
translation:
  language: ru
  text: Но Я сказал вам об этом, чтобы, когда придёт их час[a], вы вспомнили, что Я говорил вам. А с самого начала Я не говорил вам об этом, потому что был с вами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте после «вспомнили» вновь употреблено местоимение αὐτῶν («их»). Его связь с последующими словами трудна для естественной передачи по-русски; возможна более буквальная передача: «когда придёт их час, вы вспомнили их — что Я говорил вам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λελάληκα
  choice: Я сказал
  rationale: Перфект указывает на уже произнесённые слова, сохраняющие значение в предстоящих обстоятельствах; в современном русском «сказал» здесь естественнее буквального «говорил».
- source_word: ταῦτα
  choice: об этом
  rationale: Указание относится к только что данным предупреждениям; «об этом» естественно передаёт греческое множественное ταῦτα без тяжеловесного «эти вещи».
- source_word: ἵνα
  choice: чтобы
  rationale: Сохраняет целевое значение союза и звучит естественно по-русски.
- source_word: ὅταν ἔλθῃ ἡ ὥρα αὐτῶν
  choice: когда придёт их час
  rationale: Сохраняет будущую неопределённость конструкции ὅταν с сослагательным наклонением и иоанновский образ назначенного часа, не уточняя неоднозначный референт αὐτῶν.
- source_word: μνημονεύητε
  choice: вы вспомнили
  rationale: Передаёт предполагаемый будущий результат; совершенный вид естественен в русском придаточном цели.
- source_word: ὅτι ἐγὼ εἶπον ὑμῖν
  choice: что Я говорил вам
  rationale: Передаёт содержание воспоминания. «Говорил вам» естественно отсылает к прежнему предупреждению и избегает лишнего дополнения.
- source_word: ἐξ ἀρχῆς
  choice: с самого начала
  rationale: Точно и идиоматично передаёт исходную временную точку.
- source_word: μεθ’ ὑμῶν ἤμην
  choice: был с вами
  rationale: Прямое и естественное соответствие греческому выражению совместного присутствия.
theological_decisions:
- issue: Референт и два вхождения αὐτῶν
  choice: В основном тексте первое αὐτῶν передано как «их» в выражении «их час», а второе учтено в примечании.
  alternative: 'Более буквально: «когда придёт их час, вы вспомнили о них, что Я говорил вам».'
  rationale: Греческий текст SBLGNT содержит два вхождения αὐτῶν, однако их последовательное буквальное воспроизведение по-русски неясно и тяжеловесно. Основной текст сохраняет неоднозначное «их час», а примечание открыто показывает трудность второго местоимения, не закрепляя спорный референт.
translation_notes:
  register: Современный литературный русский, ясный и достоинственный. Обращение к ученикам передано строчной формой «вам/вами»; местоимение «Я» в речи Иисуса оставлено с прописной буквы согласно распространённой русской библейской издательской традиции. Повтор «говорил» сохраняет связь между предупреждением и последующим воспоминанием.
