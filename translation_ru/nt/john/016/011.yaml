  text: and concerning judgment[c][b][a], because the ruler of this world has been judged.
translation:
  language: ru
  text: и о суде — потому что над правителем этого мира уже совершён суд.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «правитель этого мира уже подвергнут суду». Греческая форма указывает на состоявшийся суд, результат которого сохраняет силу.'
