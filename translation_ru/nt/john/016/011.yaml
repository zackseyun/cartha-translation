    reason: cross_reference
lexical_decisions:
- source_word: περὶ δὲ κρίσεως
  choice: и о суде
  rationale: περί с родительным обозначает тему («о»), δέ продолжает последовательность и передано союзом «и», а κρίσις прямо соответствует слову «суд».
- source_word: ὅτι
  choice: потому что
  rationale: В данном пояснительном предложении ὅτι вводит причину, поэтому естественно передать его причинным оборотом «потому что».
- source_word: ὁ ἄρχων τοῦ κόσμου τούτου
  choice: правитель этого мира
  rationale: ἄρχων означает носителя власти; «правитель» ясно передаёт это значение, не добавляя идеи царского происхождения. κόσμος в данном иоанновском выражении передан обычным словом «мир».
- source_word: κέκριται
  choice: уже осуждён
  rationale: Перфект страдательного залога указывает на состоявшийся суд, результат которого сохраняется. В русском «уже осуждён» естественно выражает достигнутый и сохраняющий силу результат; значение осуждения поддерживается контекстом Ин 12:31, хотя греческий глагол буквально шире.
theological_decisions:
- issue: Кого обозначает «правитель этого мира»
  choice: Сохранить титул в основном тексте, не называя сатану прямо.
  alternative: «сатана, правитель этого мира»
  rationale: В контексте Евангелия от Иоанна выражение, вероятнее всего, относится к сатане, однако сам стих употребляет титул, а не имя. Это различие сохранено, а вероятная идентификация вынесена в примечание.
- issue: Смысл κέκριται
  choice: «уже осуждён»
  alternative: «уже судим» / «над ним уже совершён суд»
  rationale: Русское «судим» обычно описывает продолжающийся судебный процесс и плохо передаёт греческий перфект. «Осуждён» естественно выражает итог неблагоприятного суда в этом контексте, а примечание сохраняет более широкое буквальное значение глагола.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмически ясная формулировка. Традиционное «князь мира сего» заменено более понятным «правитель этого мира», при этом образ власти сохранён.
