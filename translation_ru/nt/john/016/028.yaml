  text: ἐξῆλθον ⸀ἐκ τοῦ πατρὸς καὶ ἐλήλυθα εἰς τὸν κόσμον· πάλιν ἀφίημι τὸν κόσμον καὶ πορεύομαι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/028.yaml
  text: I came from the Father and have come into the world. Again[a], I am leaving the world and going to the Father.
translation:
  language: ru
  text: Я вышел от Отца и пришёл в мир. И снова оставляю мир и иду к Отцу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: Я вышел от Отца
  rationale: Сочетание «вышел от» естественно по-русски передаёт движение и происхождение, выраженные ἐξέρχομαι и ἐκ, не превращая их в расширенное богословское толкование.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: пришёл в мир
  rationale: Русский совершенный вид естественно передаёт совершившееся пришествие с сохраняющейся значимостью; «в мир» точно отражает направление εἰς.
- source_word: πάλιν
  choice: Теперь
  rationale: Здесь πάλιν обозначает обратное, последующее движение после пришествия в мир. «Теперь» естественно связывает две части высказывания, хотя буквальное «снова» также возможно.
- source_word: ἀφίημι τὸν κόσμον
  choice: я оставляю мир
  rationale: Настоящее время сохранено и в контексте выражает предстоящее, уже наступающее действие.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: иду к Отцу
  rationale: «Иду к» кратко и естественно передаёт направленное движение πρός без добавления отсутствующего в тексте объяснения.
theological_decisions:
- issue: Отношение Иисуса к Отцу в выражении ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: Передать прямо как «вышел от Отца»
  alternative: «пришёл от Отца» или расширенное указание на предсуществование и воплощение
  rationale: Формулировка сохраняет сильное утверждение текста об исходе Иисуса от Отца и возвращении к Нему, не ослабляя его до общего посланничества и не добавляя догматического пояснения.
- issue: Значение πάλιν в переходе ко второй части
  choice: «Теперь» как указание на следующий, обратный этап движения
  alternative: «снова» / «опять»
  rationale: 'В контексте речь не о повторном оставлении мира, а о соответствующем обратном движении: от пришествия в мир к уходу из мира. «Теперь» передаёт дискурсивную функцию естественнее, не устраняя структурного контраста.'
translation_notes:
  register: Современный литературный русский язык; фраза краткая, торжественная без архаизации. Синтаксический параллелизм исхода от Отца, пришествия в мир, оставления мира и движения к Отцу сохранён.
