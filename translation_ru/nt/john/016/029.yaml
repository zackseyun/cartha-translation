source:
  edition: SBLGNT
  text: ⸀Λέγουσιν οἱ μαθηταὶ αὐτοῦ· Ἴδε νῦν ⸀ἐν παρρησίᾳ λαλεῖς, καὶ παροιμίαν οὐδεμίαν λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/029.yaml
  text: His disciples said[a], “Look[b], now you are speaking openly and are not speaking in any figure of speech.”
translation:
  language: ru
  text: 'Его ученики сказали: «Вот, теперь Ты говоришь прямо[a] и не говоришь никаких иносказаний[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «открыто», «ясно». Греческое выражение может означать открытую, прямую или откровенную речь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «образных выражений», «притч» или «прикровенных изречений». Здесь имеется в виду образная или непрямая речь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν
  choice: сказали
  rationale: Историческое настоящее передано естественным для современного русского повествования прошедшим временем.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Его ученики
  rationale: Естественная русская передача греческой притяжательной конструкции.
- source_word: Ἴδε
  choice: Вот
  rationale: Вводное слово привлекает внимание к замеченной учениками перемене; «вот» звучит естественно и достойно.
- source_word: νῦν
  choice: теперь
  rationale: Передаёт временное указание и подчёркивает воспринимаемое учениками изменение речи Иисуса.
- source_word: ἐν παρρησίᾳ
  choice: прямо
  rationale: В данном контексте выражение противопоставлено иносказанию и означает открытую, ясную, недвусмысленную речь.
- source_word: λαλεῖς
  choice: говоришь
  rationale: Настоящее время сохраняет непосредственную оценку учениками текущей речи Иисуса.
- source_word: παροιμίαν
  choice: иносказаний
  rationale: В Иоанновом контексте слово обозначает образную или непрямую речь; «иносказание» естественно выражает это значение, не сужая его до пословицы.
- source_word: οὐδεμίαν λέγεις
  choice: не говоришь никаких
  rationale: Сохраняет глагольную параллель греческого текста и выразительную полную отрицательность.
theological_decisions:
- issue: Значение ἐν παρρησίᾳ в противопоставлении παροιμία
  choice: Иисус говорит прямо, а не иносказательно
  alternative: Иисус говорит открыто или со смелостью
  rationale: Ближайшее противопоставление образной или непрямой речи указывает прежде всего на ясность и прямоту выражения, не исключая более широких оттенков слова.
translation_notes:
  register: Современный литературный русский язык; речь естественная и сдержанно-достойная. Заглавное «Ты» употреблено в прямом обращении к Иисусу по принятой русской библейской традиции. Маркеры сносок поставлены непосредственно после соответствующих выражений.
