  text: But because I have spoken these things to you[a], sorrow has filled your heart.
translation:
  language: ru
  text: Но поскольку Я сказал вам это, скорбь наполнила ваше сердце.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваши сердца». В греческом тексте слово «сердце» стоит в единственном числе, а притяжательное местоимение — во множественном; такая конструкция может выражать общую внутреннюю скорбь всей группы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Но
  rationale: Передаёт противопоставление предыдущей мысли естественным современным союзом.
- source_word: ὅτι
  choice: оттого, что
  rationale: В контексте союз имеет причинное значение и указывает, почему ученики охвачены скорбью.
- source_word: ταῦτα
  choice: это
  rationale: Естественное русское собирательное обозначение только что сказанного; буквальное «эти вещи» здесь звучало бы тяжеловесно.
- source_word: λελάληκα
  choice: Я сказал
  rationale: Русская форма совершенного вида естественно передаёт завершённую речь с сохраняющимся результатом; «говорил» могло бы ослабить завершённость перфекта.
- source_word: ὑμῖν
  choice: вам
  rationale: Передаёт дательный падеж множественного числа без ненужного уточнения «всем вам».
- source_word: ἡ λύπη
  choice: скорбью
  rationale: «Скорбь» соответствует глубокой печали и сохраняет торжественный, но понятный регистр.
- source_word: πεπλήρωκεν
  choice: наполнилось
  rationale: Сохраняет образ наполнения, заложенный в πληρόω, и естественно сочетается в русском с «сердце» и творительным падежом.
- source_word: ὑμῶν τὴν καρδίαν
  choice: ваше сердце
  rationale: Сохраняет греческое единственное число καρδίαν при обращении к группе и возможный оттенок общей внутренней скорби.
theological_decisions:
- issue: Собирательное единственное число «сердце» или распределительное множественное «сердца»
  choice: ваше сердце
  alternative: ваши сердца
  rationale: В греческом стоит местоимение множественного числа при существительном «сердце» в единственном числе. Единственное число сохраняет возможность видеть здесь общее внутреннее состояние учеников, не исключая распределительного понимания.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сделан естественным для русского, а образ наполненного скорбью сердца и значимое единственное число сохранены.
