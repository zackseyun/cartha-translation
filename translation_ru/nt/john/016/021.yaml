  text: ἡ γυνὴ ὅταν τίκτῃ λύπην ἔχει, ὅτι ἦλθεν ἡ ὥρα αὐτῆς· ὅταν δὲ γεννήσῃ τὸ παιδίον, οὐκέτι μνημονεύει τῆς θλίψεως διὰ τὴν χαρὰν ὅτι ἐγεννήθη ἄνθρωπος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/021.yaml
  text: When a woman is giving birth[a], she has sorrow because her hour has come; but when she has given birth to the child, she no longer remembers the distress because of the joy that a child has been born into the world.
translation:
  language: ru
  text: Когда женщина рожает, она испытывает скорбь, потому что настал её час; но когда она родит ребёнка, то уже не помнит мучений от радости, что человек родился в мир.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что в мир родился человек». Греческое слово, переведённое как «человек», обозначает здесь человека вообще, а не новорождённого мужского пола.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: женщина
  rationale: В общем примере о родах речь идёт о женщине, а не обязательно о жене.
- source_word: ὅταν τίκτῃ
  choice: когда женщина рожает
  rationale: Настоящее сослагательное с ὅταν обозначает обычную ситуацию и продолжающийся процесс; по-русски это естественно передаётся настоящим временем.
- source_word: λύπην ἔχει
  choice: она испытывает скорбь
  rationale: λύπη охватывает скорбь и душевное страдание, а не только физическую боль; это также сохраняет связь с контекстом скорби, сменяющейся радостью.
- source_word: ἡ ὥρα αὐτῆς
  choice: настал её час
  rationale: Сохраняется образ «часа», тематически значимый в Евангелии от Иоанна, при ясном указании на наступившее время родов.
- source_word: γεννήσῃ τὸ παιδίον
  choice: она родит ребёнка
  rationale: Аорист после ὅταν представляет рождение как завершившееся событие; совершенный вид русского глагола передаёт эту завершённость.
- source_word: οὐκέτι μνημονεύει
  choice: уже не помнит
  rationale: Прямой и естественный эквивалент, сохраняющий формулировку исходного текста.
- source_word: τῆς θλίψεως
  choice: мучений
  rationale: В контексте родов θλῖψις обозначает тяжёлое страдание и муку; множественное число «мучений» естественно по-русски и не вводит технического эсхатологического оттенка.
- source_word: διὰ τὴν χαράν
  choice: от радости
  rationale: διά с винительным выражает причину; «от радости» кратко и естественно передаёт причинное значение.
- source_word: ὅτι ἐγεννήθη
  choice: что ... родился
  rationale: ὅτι вводит содержание и основание радости; русское «что» сохраняет эту связь без излишнего уточнения.
- source_word: ἄνθρωπος
  choice: человек
  rationale: ἄνθρωπος здесь обозначает человеческое существо вообще, а не ребёнка мужского пола; «человек» точно сохраняет лексику источника и звучит достойно.
- source_word: εἰς τὸν κόσμον
  choice: в мир
  rationale: 'Естественная русская передача направления: человек появляется, рождаясь в мир.'
theological_decisions:
- issue: Обобщённое значение ἄνθρωπος
  choice: человек
  alternative: ребёнок; мужчина
  rationale: Грамматически мужской род не указывает здесь на пол новорождённого. «Человек» сохраняет обобщённый смысл и иоанновскую формулировку, не подменяя её более контекстуальным «ребёнок» и не создавая впечатления, будто речь только о мальчике.
translation_notes:
  register: Современный литературный русский язык с dignified, но доступной синтаксической формой. Сохранены иоанновское «её час» и различие между ребёнком (παιδίον) и человеком (ἄνθρωπος). Маркер сноски помещён непосредственно после предложения.
