  text: καὶ ὑμεῖς οὖν ⸂νῦν μὲν λύπην⸃ ἔχετε· πάλιν δὲ ὄψομαι ὑμᾶς, καὶ χαρήσεται ὑμῶν ἡ καρδία, καὶ τὴν χαρὰν ὑμῶν οὐδεὶς ⸀αἴρει ἀφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/022.yaml
  text: So you also now have sorrow; but I will see you again[a], and your heart will rejoice, and no one will take your joy from you.
translation:
  language: ru
  text: Так и вы теперь скорбите; но Я снова увижу вас[a], и ваше сердце возрадуется, и вашу радость никто у вас не отнимет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по смыслу: «вы снова увидите Меня». Буквально по-гречески: «Я снова увижу вас»; такая формулировка может подчёркивать инициативу Иисуса в новой встрече с учениками.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: так
  rationale: Передаёт вывод и сопоставление с образом роженицы в предыдущем стихе, сохраняя естественную связь в русском тексте.
- source_word: νῦν μὲν λύπην ἔχετε
  choice: теперь скорбите
  rationale: Естественно передаёт нынешнее состояние печали; противопоставление, обозначенное μέν, выражено последующим «но».
- source_word: πάλιν δὲ ὄψομαι ὑμᾶς
  choice: но Я снова увижу вас
  rationale: 'Сохраняет контраст δέ, значение повторности πάλιν и грамматически явную инициативу Иисуса: Он — субъект, ученики — объект.'
- source_word: χαρήσεται ὑμῶν ἡ καρδία
  choice: ваше сердце возрадуется
  rationale: Передаёт единственное число «сердце» и глагольную форму χαρήσεται, а также сохраняет смысловую связь с последующим словом «радость».
- source_word: τὴν χαρὰν ὑμῶν
  choice: вашу радость
  rationale: Прямо передаёт притяжательную конструкцию и сохраняет лексическую связь с «возрадуется».
- source_word: οὐδεὶς αἴρει ἀφ’ ὑμῶν
  choice: никто у вас не отнимет
  rationale: Будущее время естественно следует будущей направленности высказывания; «у вас» передаёт ἀφ’ ὑμῶν и по-русски сочетается с глаголом «отнять».
theological_decisions:
- issue: Субъект и смысловой акцент будущей встречи
  choice: Я снова увижу вас
  alternative: вы снова увидите Меня
  rationale: Греческий текст прямо называет Иисуса субъектом действия, а учеников — объектом. Основной текст не гармонизирован с близким выражением в Ин. 16:16 и сохраняет возможный акцент на инициативе Иисуса.
- issue: Временная форма заключительного утверждения
  choice: никто у вас не отнимет
  alternative: никто у вас не отнимает
  rationale: Хотя αἴρει стоит в настоящем времени, весь ряд ориентирован на грядущее утешение. Русское будущее время ясно выражает контекстуальный смысл, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной, но понятной библейской интонацией. Заглавное «Я» употреблено как традиционное типографическое обозначение речи Иисуса, без внесения дополнительного смысла.
