language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐν τῷ ὀνόματί μου αἰτήσεσθε, καὶ οὐ λέγω ὑμῖν ὅτι ἐγὼ ἐρωτήσω τὸν πατέρα περὶ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/026.yaml
  text: On that day you will ask in my name[a], and I do not say to you that I will ask the Father concerning you[c][b];
translation:
  language: ru
  text: В тот день вы будете просить во имя Моё, и Я не говорю вам, что буду просить Отца о вас[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за вас», «ради вас».'
    reason: Выражение περὶ ὑμῶν может обозначать как предмет просьбы («о вас»), так и просьбу в чью-либо пользу («за вас»).
  - marker: b
    text: 'В греческом тексте для двух случаев просьбы употреблены разные глаголы: αἰτέω — о просьбе учеников и ἐρωτάω — о просьбе Иисуса к Отцу.'
    reason: Лексическое различие исходного текста невозможно без смыслового смещения последовательно воспроизвести естественными разными русскими глаголами.
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: В тот день
  rationale: Естественное современное русское выражение времени, сохраняющее указательное значение ἐκείνῃ.
- source_word: ἐν τῷ ὀνόματί μου
  choice: во имя Моё
  rationale: Сохраняет устойчивую и богословски значимую иоанновскую формулу, не сводя её только к власти или полномочию.
- source_word: αἰτήσεσθε
  choice: будете просить
  rationale: Будущее время и второе лицо множественного числа переданы прямо; «просить» естественно для просьбы и молитвы.
- source_word: οὐ λέγω ὑμῖν
  choice: Я не говорю вам
  rationale: Прямо сохраняет настоящее время и не добавляет оттенка категорического отрицания будущего ходатайства.
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание того, чего Иисус не говорит, а не причину.
- source_word: ἐρωτήσω
  choice: буду просить
  rationale: Передаёт будущее время естественным русским глаголом; различие между αἰτέω и ἐρωτάω отмечено в сноске, поскольку его трудно естественно воспроизвести разными русскими словами.
- source_word: τὸν πατέρα
  choice: Отца
  rationale: Сохраняет иоанновское наименование без добавления отсутствующего в греческом тексте притяжательного местоимения.
- source_word: περὶ ὑμῶν
  choice: о вас
  rationale: Близко передаёт περί с родительным падежом и сохраняет возможный оттенок просьбы за кого-либо без его обязательного уточнения в основном тексте.
theological_decisions:
- issue: Отрицает ли Иисус здесь всякое Своё будущее ходатайство
  choice: Фраза переведена как сообщение о том, чего Иисус не говорит ученикам в данном контексте.
  alternative: «Я не буду просить Отца за вас», что превращало бы высказывание в прямое отрицание будущего ходатайства.
  rationale: Греческое οὐ λέγω ὑμῖν ὅτι не равнозначно простому οὐκ ἐρωτήσω. Дословная структура сохраняет напряжение между непосредственным обращением учеников к Отцу во имя Иисуса и другими новозаветными текстами о Его ходатайстве.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Инверсия «во имя Моё» сохраняет узнаваемую формулу и звучит естественно в данном жанре. Пунктуация завершена точкой, поскольку стих подан отдельно.
