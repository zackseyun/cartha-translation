  text: ἀλλ’ ἐγὼ τὴν ἀλήθειαν λέγω ὑμῖν, συμφέρει ὑμῖν ἵνα ἐγὼ ἀπέλθω. ἐὰν ⸀γὰρ μὴ ἀπέλθω, ὁ παράκλητος ⸂οὐ μὴ ἔλθῃ⸃ πρὸς ὑμᾶς· ἐὰν δὲ πορευθῶ, πέμψω αὐτὸν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/007.yaml
  text: 'But I am telling you the truth: it is better for you that I go away. For if I do not go away[a], the Advocate will certainly not come to you; but if I go, I will send him to you.'
translation:
  language: ru
  text: 'Но Я говорю вам правду: для вас лучше, чтобы Я ушёл. Ведь если Я не уйду, Заступник[a] к вам не придёт; а если уйду, то пошлю Его к вам.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Помощник», «Советник», «Утешитель»; греч. «Параклет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Но
  rationale: Передаёт противопоставление печали учеников в предшествующем контексте.
- source_word: τὴν ἀλήθειαν λέγω ὑμῖν
  choice: Я говорю вам правду
  rationale: Естественно и прямо передаёт торжественное заверение в истинности сказанного.
- source_word: συμφέρει ὑμῖν
  choice: для вас лучше
  rationale: Современное идиоматичное выражение пользы или преимущества для адресатов.
- source_word: ἵνα ἐγὼ ἀπέλθω
  choice: чтобы Я ушёл
  rationale: Передаёт содержание того, что послужит ученикам во благо, и сохраняет повтор глагола в следующей фразе.
- source_word: ἐὰν γὰρ μὴ ἀπέλθω
  choice: Ведь если Я не уйду
  rationale: Сохраняет условную конструкцию, повтор глагола и пояснительную функцию γάρ.
- source_word: ὁ παράκλητος
  choice: Заступник
  rationale: Передаёт личного представителя и защитника; значимый более широкий диапазон слова указан в сноске.
- source_word: οὐ μὴ ἔλθῃ
  choice: не придёт
  rationale: Категорическая форма будущего отрицания в русском контексте естественно передаёт усиленное греческое οὐ μή; добавление наречия могло бы звучать тяжеловесно.
- source_word: πρὸς ὑμᾶς
  choice: к вам
  rationale: Точно передаёт направленность движения, выраженную πρός с винительным падежом.
- source_word: ἐὰν δὲ πορευθῶ
  choice: а если уйду
  rationale: δέ выражает контраст двух условий; «уйду» естественно в контексте, хотя в оригинале употреблён другой глагол движения.
- source_word: πέμψω αὐτὸν
  choice: пошлю Его
  rationale: Передаёт обычное значение πέμπω и личный характер мужского местоимения αὐτόν.
theological_decisions:
- issue: Передача παράκλητος в прощальной речи Иисуса
  choice: Заступник
  alternative: Помощник; Советник; Утешитель; Параклет
  rationale: «Заступник» сохраняет личный и представительский оттенок титула, не сводя его только к утешению. Ни один русский эквивалент не охватывает всего смыслового диапазона, поэтому варианты приведены в сноске.
- issue: Личное обозначение Духа/Параклета
  choice: Его
  alternative: его как неодушевлённый объект или безличная передача
  rationale: Греческое αὐτόν относится к παράκλητος и в повествовании обозначает личного посланника; русский перевод сохраняет эту личную соотнесённость.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Заглавные буквы в местоимениях «Я», «Его» следуют принятой русской библейской издательской практике. Повтор «ушёл / уйду» сохраняет композиционную связь исходного текста; в последнем условии тот же русский глагол выбран ради естественности, хотя греческий использует πορεύομαι вместо ἀπέρχομαι.
