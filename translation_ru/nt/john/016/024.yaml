  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἕως ἄρτι οὐκ ᾐτήσατε οὐδὲν ἐν τῷ ὀνόματί μου· αἰτεῖτε καὶ λήμψεσθε, ἵνα ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/024.yaml
  text: Until now you have asked for nothing in my name[a]. Ask, and you will receive[c][b], so that your joy may be full.
translation:
  language: ru
  text: До сих пор вы ничего не просили во имя Моё[a]. Просите[b] — и получите, чтобы ваша радость была полной[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «во имя Моё» может обозначать просьбу, связанную с личностью, властью и миссией Иисуса; буквальная формулировка сохранена, чтобы не сужать её смысл.
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «Продолжайте просить». Форма настоящего повелительного наклонения в данном контексте может подразумевать продолжающееся или повторяющееся действие.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «чтобы ваша радость достигла полноты».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἄρτι
  choice: До сих пор
  rationale: Естественно передаёт временной предел «вплоть до настоящего момента».
- source_word: οὐκ ᾐτήσατε οὐδὲν
  choice: вы ничего не просили
  rationale: Русская конструкция с «ничего» идиоматично передаёт греческое отрицание; «просили» обозначает просьбу, а не вопрос.
- source_word: ἐν τῷ ὀνόματί μου
  choice: во имя Моё
  rationale: Сохраняет буквальный и богословски ёмкий образ, не сводя его к одному толкованию.
- source_word: αἰτεῖτε
  choice: Просите
  rationale: Настоящее повелительное наклонение передано естественной русской формой, которая допускает как общий, так и продолжающийся или повторяющийся призыв.
- source_word: λήμψεσθε
  choice: получите
  rationale: Точно и естественно передаёт обещанный ответ на просьбу.
- source_word: ἵνα
  choice: чтобы
  rationale: Сохраняет целевое или результирующее значение союза без излишней тяжеловесности.
- source_word: ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη
  choice: ваша радость была полной
  rationale: Передаёт состояние достигнутой полноты, выраженное перфектной конструкцией, на естественном современном русском языке.
theological_decisions:
- issue: Значение просьбы «во имя Моё»
  choice: Сохранить выражение «во имя Моё» без поясняющей вставки.
  alternative: «от Моего имени», «Моей властью», «в единении со Мной»
  rationale: Греческое выражение богословски многозначно; буквальная передача сохраняет связь с личностью, властью и миссией Иисуса, не ограничивая смысл одним истолкованием.
- issue: Характер полноты радости
  choice: «чтобы ваша радость была полной»
  alternative: «чтобы ваша радость исполнилась» или «достигла совершенства»
  rationale: Выбранная формулировка сохраняет образ полноты и не вносит дополнительной идеи нравственного совершенства.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Местоимение «Моё» написано с прописной буквы в соответствии с традиционным русским оформлением прямой речи Христа; синтаксис остаётся доступным и не архаичным.
