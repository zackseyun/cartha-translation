lexical_decisions:
- source_word: Ταῦτα
  choice: всё это
  rationale: Указательное местоимение среднего рода во множественном числе отсылает к предыдущим словам Иисуса. По-русски «всё это» естественно передаёт совокупность сказанного, не превращая её в одно отдельное высказывание.
- source_word: λελάληκα
  choice: Я сказал
  rationale: Перфект λαλέω обозначает уже произнесённые слова, сохраняющие значение для слушателей. Русское прошедшее совершенного вида естественно передаёт этот смысл; буквальное «Я говорил» могло бы ошибочно звучать как незавершённое или повторявшееся действие.
- source_word: ὑμῖν
  choice: вам
  rationale: Дательный падеж местоимения второго лица множественного числа прямо и естественно передаётся словом «вам».
- source_word: ἵνα μὴ
  choice: чтобы … не
  rationale: Сочетание вводит отрицательную цель; русская конструкция «чтобы … не» сохраняет её ясно и естественно.
- source_word: σκανδαλισθῆτε
  choice: не отступили от веры
  rationale: В контексте предстоящих гонений глагол обозначает духовное падение или отход, а не просто эмоциональную обиду. Добавление «от веры» делает предполагаемый смысл понятным современному читателю; более буквальный образ сохранён в примечании.
theological_decisions:
- issue: Смысл σκανδαλισθῆτε в контексте ученичества и гонений
  choice: не отступили от веры
  alternative: не преткнулись; не были сбиты с пути; не соблазнились
  rationale: Последующий контекст говорит об изгнании и убийствах учеников, поэтому предупреждение касается опасности духовного отпадения. При этом греческий глагол сохраняет образ препятствия, из-за которого человек спотыкается; альтернативы вынесены в сноску, чтобы не скрывать широту смысла.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно торжественный. Порядок слов естественный для прямой речи; «всё это» связывает стих с предшествующим наставлением. Выражение «отступили от веры» понятно широкому читателю, а сноска сохраняет буквальный образ и лексическую неоднозначность.
