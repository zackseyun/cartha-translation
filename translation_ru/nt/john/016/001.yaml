  text: Я сказал вам всё это, чтобы вы не преткнулись[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не соблазнились», «не были введены в соблазн» или «не были сбиты с пути». Греческий глагол может обозначать преткновение, которое ведёт к неверию или отступничеству.'
