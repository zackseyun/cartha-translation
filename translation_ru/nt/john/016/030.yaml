base_translation:
  language: en
  yaml_path: translation/nt/john/016/030.yaml
  text: Now we know that you know all things and have no need that anyone should question you[a]. By this we believe that you came from God.
translation:
  language: ru
  text: Теперь мы знаем, что Ты знаешь всё и Тебе не нужно, чтобы кто-либо Тебя спрашивал[a]. На этом основании мы верим, что Ты пришёл от Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы кто-либо задавал Тебе вопросы». Греческий глагол может означать «спрашивать» или «задавать вопросы»; здесь контекст касается знания Иисуса и не высказанных учениками вопросов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: Теперь
  rationale: Передаёт настоящее осознание учеников естественным современным русским словом.
- source_word: οἴδαμεν
  choice: мы знаем
  rationale: Форма οἶδα имеет значение настоящего времени; простое «знаем» точно и идиоматично.
- source_word: οἶδας πάντα
  choice: Ты знаешь всё
  rationale: Передаёт всеохватность πάντα без добавочного богословского пояснения.
- source_word: οὐ χρείαν ἔχεις
  choice: не нуждаешься
  rationale: Естественно передаёт греческое выражение отсутствия нужды, сохраняя его смысловой акцент.
- source_word: ἵνα τίς σε ἐρωτᾷ
  choice: в том, чтобы кто-нибудь Тебя спрашивал
  rationale: Конструкция с «чтобы» отражает греческий оборот; «спрашивал» сохраняет широкое значение ἐρωτάω и не привносит оттенка враждебного допроса.
- source_word: ἐν τούτῳ
  choice: Поэтому
  rationale: 'В данном контексте выражает основание вывода учеников: знание Иисуса служит причиной их исповедания.'
- source_word: πιστεύομεν
  choice: мы верим
  rationale: Прямое и уместное в исповедальном контексте соответствие πιστεύομεν.
- source_word: ἀπὸ θεοῦ
  choice: от Бога
  rationale: Точно сохраняет формулировку источника, не заменяя «Бога» на более конкретное «Отца».
- source_word: ἐξῆλθες
  choice: Ты пришёл
  rationale: В сочетании «от Бога» естественно передаёт происхождение и посланничество Иисуса; буквальное «вышел» в современном русском могло бы звучать пространственно и двусмысленно.
theological_decisions:
- issue: Христологическая сила слов «Ты знаешь всё»
  choice: Сохранить исповедание учеников без поясняющего расширения.
  alternative: Добавить формулировку, прямо называющую всеведение.
  rationale: Греческий текст сам несёт сильное христологическое утверждение, но перевод не должен превращать его в более развёрнутую догматическую формулу.
- issue: Значение ἀπὸ θεοῦ ἐξῆλθες
  choice: Ты пришёл от Бога
  alternative: Ты вышел от Бога; Ты пришёл от Отца
  rationale: Выбранный вариант прямо передаёт божественное происхождение или посланничество и сохраняет напряжение формулировки, не подменяя θεοῦ словом «Отца».
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Местоимение «Ты» по отношению к Иисусу написано с прописной буквы согласно распространённой русской библейской издательской традиции; синтаксис остаётся ясным для обычного читателя.
