source:
  edition: SBLGNT
  text: ⸀ἔγνω Ἰησοῦς ὅτι ἤθελον αὐτὸν ἐρωτᾶν, καὶ εἶπεν αὐτοῖς· Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων ὅτι εἶπον· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/019.yaml
  text: Jesus knew that they wanted to ask him[a], and he said to them, “Are you discussing this with one another, that I said, ‘A little while, and you no longer see me, and again a little while[c][b], and you will see me’?”
translation:
  language: ru
  text: 'Иисус знал, что они хотели спросить Его, и сказал им: «Вы обсуждаете между собой то, что[a] Я сказал: „Ещё немного — и вы Меня не будете видеть, и ещё немного — и увидите Меня“[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что Я сказал». Греческий союз может вводить как содержание обсуждения, так и его причину.'
    reason: alternative_reading
  - marker: b
    text: 'В греческом тексте здесь употреблены два разных глагола со значением зрения: сначала θεωρέω — «видеть, наблюдать», затем ὁράω — «видеть». В основном тексте оба переданы однокоренными русскими словами ради естественного параллелизма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: знал
  rationale: Аорист γινώσκω обозначает осведомлённость Иисуса о намерении учеников; «знал» прямо и естественно передаёт смысл.
- source_word: ἤθελον αὐτὸν ἐρωτᾶν
  choice: хотели спросить Его
  rationale: Так естественно передаётся продолжавшееся намерение учеников обратиться с вопросом непосредственно к Иисусу.
- source_word: Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων
  choice: Вы спрашиваете друг друга об этом
  rationale: В данном контексте ζητέω указывает на попытку учеников выяснить смысл сказанного между собой. «Спрашиваете друг друга» сохраняет вопросительный характер их обсуждения и не добавляет оттенка спора.
- source_word: ὅτι εἶπον
  choice: о том, что Я сказал
  rationale: ὅτι понято как вводящее содержание обсуждения. Конструкция с повтором «об этом — о том, что» сохраняет Περὶ τούτου и ясно присоединяет последующую цитату.
- source_word: Μικρὸν
  choice: Ещё немного
  rationale: Субстантивированное прилагательное обозначает краткий промежуток времени; это краткий и естественный русский эквивалент.
- source_word: οὐ θεωρεῖτέ με
  choice: вы Меня не будете видеть
  rationale: Настоящее время в греческом стоит после временного «ещё немного» и относится к предстоящему периоду. Русское будущее передаёт эту временную соотнесённость, не добавляя отсутствующего в тексте «больше» или «перестанете».
- source_word: πάλιν μικρὸν καὶ ὄψεσθέ με
  choice: и ещё немного — и увидите Меня
  rationale: Передаёт повтор краткого временного указания, последовательность событий и будущее значение ὄψεσθε естественным русским языком.
theological_decisions:
- issue: Соотношение глаголов θεωρέω и ὁράω в двух параллельных частях
  choice: Передать оба глагола через «видеть/увидеть» и отметить различие в сноске
  alternative: Различить их в основном тексте как «наблюдать» и «увидеть»
  rationale: В контексте основной акцент лежит на предстоящем отсутствии и последующем новом видении Иисуса. Искусственное разведение русских глаголов могло бы создать не выраженное явно богословское противопоставление; сноска сохраняет лексическое различие оригинала.
- issue: Функция ὅτι после вопроса Иисуса
  choice: 'Понять как вводящее содержание: «о том, что Я сказал»'
  alternative: 'Понять причинно: «потому что Я сказал»'
  rationale: Оба значения грамматически возможны. Основной текст естественно связывает обсуждение учеников с содержанием слов Иисуса, а причинное прочтение сохранено в сноске.
- issue: Характер вопроса Иисуса
  choice: 'Сохранить прямой вопрос: «Вы спрашиваете друг друга…?»'
  alternative: 'Передать как утверждение: «Вы спрашиваете друг друга…»'
  rationale: Вопросительная форма оригинала показывает, что Иисус открыто обращается к скрытому намерению учеников, не превращая реплику в простую констатацию.
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным синтаксисом. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно принятой русской библейской традиции. Тире помогают естественно передать временную последовательность и границы вложенной цитаты.
