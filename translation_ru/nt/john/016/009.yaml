  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ ἁμαρτίας
  choice: о грехе
  rationale: Предлог περί с родительным падежом вводит тему обличения; краткое «о грехе» естественно по-русски и сохраняет параллельную структуру стихов 9–11. Единственное число передаёт абстрактную категорию греха.
- source_word: μέν
  choice: —
  rationale: Частица отмечает первый пункт последовательности, продолженной в стихах 10–11. Отдельный словесный эквивалент по-русски не требуется; членение ряда передано синтаксисом и пунктуацией.
- source_word: ὅτι
  choice: потому что
  rationale: В данном контексте союз вводит основание или пояснение того, почему речь идёт о грехе. «Потому что» ясно передаёт причинно-пояснительную связь, не отождествляя грамматически грех и неверие столь жёстко, как конструкция с «в том, что».
- source_word: οὐ πιστεύουσιν
  choice: они не верят
  rationale: Настоящее время обозначает существующую реальность неверия; «не верят» — прямой и естественный современный русский эквивалент.
- source_word: εἰς ἐμέ
  choice: в Меня
  rationale: Иоаннова конструкция πιστεύω εἰς выражает веру и доверие, направленные на Иисуса; русское «верить в Меня» естественно сохраняет личностную направленность.
theological_decisions:
- issue: Как соотнесены грех и неверие в Иисуса
  choice: Неверие в Иисуса представлено как основание того, почему Дух обличает мир о грехе в данном контексте.
  alternative: 'Понять неверие как строгое определение всего содержания слова «грех»: «грех в том, что они не верят в Меня».'
  rationale: Союз ὅτι допускает пояснительный и причинный оттенки. Перевод «потому что» сохраняет причинно-пояснительную связь и не расширяет утверждение до общей доктринальной формулы.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, естественная и достаточно торжественная. Тире обозначает переход от темы к её объяснению. Местоимение «Меня» написано с прописной буквы согласно принятой русской библейской издательской традиции.
