base_translation:
  language: en
  yaml_path: translation/nt/john/016/018.yaml
  text: So they were saying[a], “What is this that he says, ‘A little while’? We do not know what he is saying.”
translation:
  language: ru
  text: 'Итак, они говорили: «Что значит: „Ненадолго“? Мы не знаем, о чём Он говорит».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: они говорили
  rationale: Имперфект передаёт продолжавшееся или повторявшееся обсуждение; русское «говорили» естественно сохраняет этот аспект в контексте.
- source_word: οὖν
  choice: Итак
  rationale: Передаёт связь с предшествующими словами и вывод, к которому пришли ученики.
- source_word: Τί ἐστιν τοῦτο ὃ λέγει μικρόν
  choice: 'Что это значит, когда Он говорит: «Ненадолго»?'
  rationale: По-русски буквальное «Что это, которое Он говорит» неестественно; выбранная формулировка ясно передаёт вопрос об употреблённом Иисусом выражении, не объясняя заранее его смысл.
- source_word: μικρόν
  choice: Ненадолго
  rationale: В данном контексте субстантивированное/наречное употребление обозначает краткий промежуток времени; «ненадолго» звучит естественно и сохраняет краткость повторяемого выражения.
- source_word: οὐκ οἴδαμεν
  choice: Мы не понимаем
  rationale: Хотя буквально возможно «мы не знаем», в вопросе о непонятной речи современное русское «не понимаем» естественно выражает смысл.
- source_word: τί λαλεῖ
  choice: о чём Он говорит
  rationale: Сохраняет речевое значение λαλεῖ и естественно отличается от вводящего цитату λέγει.
