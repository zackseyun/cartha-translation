source:
  edition: SBLGNT
  text: ταῦτα λελάληκα ὑμῖν ἵνα ἐν ἐμοὶ εἰρήνην ἔχητε· ἐν τῷ κόσμῳ θλῖψιν ἔχετε, ἀλλὰ θαρσεῖτε, ἐγὼ νενίκηκα τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/033.yaml
  text: I have spoken these things to you so that in me you may have peace[a]. In the world you have tribulation, but take courage[b]; I have overcome the world.
translation:
  language: ru
  text: 'Всё это Я сказал вам, чтобы во Мне вы имели мир. В мире вы испытываете скорбь[a], но мужайтесь[b]: Я победил мир.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедствие», «страдание», «тяготу».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ободритесь», «не падайте духом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα λελάληκα ὑμῖν
  choice: Всё это Я сказал вам
  rationale: «Всё это» естественно отсылает ко всей предшествующей речи Иисуса. Русское совершенное прошедшее «сказал» передаёт завершённость действия; отдельной формы настоящего перфекта в русском языке нет.
- source_word: ἵνα ἐν ἐμοὶ εἰρήνην ἔχητε
  choice: чтобы во Мне вы имели мир
  rationale: «Чтобы» сохраняет целевое значение ἵνα, а буквальное «во Мне» удерживает важный для Иоанна язык пребывания и единения, не сводя его к «через Меня».
- source_word: ἐν τῷ κόσμῳ
  choice: В мире
  rationale: Сохраняет многозначное и богословски нагруженное κόσμος без поясняющего сужения до «падшего мира» или «мировой системы».
- source_word: θλῖψιν ἔχετε
  choice: вы испытываете скорбь
  rationale: Настоящее время ἔχετε передано настоящим временем. «Испытываете скорбь» естественнее по-русски, чем буквальное «имеете скорбь», и сохраняет тяжесть θλῖψις.
- source_word: θαρσεῖτε
  choice: мужайтесь
  rationale: Краткий повелительный глагол передаёт призыв к твёрдости и мужеству; он уместен в современном литературном библейском регистре и не добавляет причины, которой нет в самом глаголе.
- source_word: ἐγὼ νενίκηκα τὸν κόσμον
  choice: Я победил мир
  rationale: Русское совершенное прошедшее передаёт свершившуюся победу. Личное местоимение сохранено как выразительно подчёркнутое; «победил мир» воспроизводит прямоту и силу греческого выражения.
theological_decisions:
- issue: Значение κόσμος в обоих употреблениях
  choice: мир
  alternative: падший мир; враждебный Богу миропорядок
  rationale: Прямое соответствие сохраняет иоанновскую многозначность и контраст между миром «во Мне» и скорбью «в мире», не вводя в текст готового истолкования.
- issue: Перфект νενίκηκα до завершения крестных событий в повествовании
  choice: Я победил мир
  alternative: Я одержу победу над миром; Я побеждаю мир
  rationale: Совершенный вид сохраняет представленную как уже свершившуюся победу и не превращает греческий перфект ни в будущее время, ни в незавершённый процесс.
- issue: Связь мира с пребыванием во Христе
  choice: во Мне вы имели мир
  alternative: через Меня у вас был мир; в единении со Мной вы имели мир
  rationale: Буквальное «во Мне» сохраняет богословскую ёмкость выражения и не решает за читателя, следует ли понимать его преимущественно инструментально, мистически или реляционно.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис ясен для широкого читателя; «мужайтесь» несколько возвышенно, но общепонятно и точно передаёт повелительное θαρσεῖτε. Двоеточие перед заключительным заявлением естественно выражает смысловую связь, не уточняя её сверх греческого текста.
