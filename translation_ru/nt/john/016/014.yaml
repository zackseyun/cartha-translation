id: JHN.16.14
reference: John 16:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐκεῖνος ἐμὲ δοξάσει, ὅτι ἐκ τοῦ ἐμοῦ λήμψεται καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/014.yaml
  text: He will glorify me[a], because he will take from what is mine and declare it to you.
translation:
  language: ru
  text: Он прославит Меня, потому что возьмёт из того, что принадлежит Мне[a], и возвестит это вам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «получит из того, что принадлежит Мне».'
    reason: Лексически λήμψεται может означать как «возьмёт», так и «получит».
lexical_decisions:
- source_word: ἐκεῖνος
  choice: Он
  rationale: Указательное местоимение относится к упомянутому в ближайшем контексте Духу. В современном русском личное местоимение звучит естественно; усиленное «Тот» здесь не требуется.
- source_word: ἐμὲ
  choice: Меня
  rationale: Прямое дополнение при глаголе «прославит»; прописная буква соответствует принятому русскому библейскому оформлению местоимений, относящихся к Христу.
- source_word: δοξάσει
  choice: прославит
  rationale: Передаёт богословскую весомость δοξάζω в Евангелии от Иоанна и точнее, чем более узкое «почтит».
- source_word: ὅτι
  choice: потому что
  rationale: В данном контексте союз вводит причину того, каким образом Дух прославит Иисуса.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: из того, что принадлежит Мне
  rationale: Передаёт конструкцию с ἐκ и субстантивированным притяжательным местоимением, не уточняя сверх текста, идёт ли речь об учении, власти или откровении.
- source_word: λήμψεται
  choice: возьмёт
  rationale: λαμβάνω допускает значения «брать» и «получать». «Возьмёт» сохраняет активный оттенок и естественно сочетается с «из того, что принадлежит Мне»; вариант «получит» отмечен в сноске.
- source_word: ἀναγγελεῖ
  choice: возвестит это
  rationale: Глагол означает сообщать или возвещать. «Это» естественно восполняет подразумеваемый объект, определяемый предыдущей фразой.
- source_word: ὑμῖν
  choice: вам
  rationale: Форма второго лица множественного числа обращена к ученикам и прямо передаётся русским «вам».
theological_decisions:
- issue: Отношение Духа к Иисусу во фразе ἐκ τοῦ ἐμοῦ λήμψεται
  choice: возьмёт из того, что принадлежит Мне
  alternative: получит от Меня; получит из того, что принадлежит Мне
  rationale: 'Формулировка сохраняет широкий смысл: Дух сообщает принадлежащее Сыну. Она не превращает выражение в более узкое техническое утверждение и не вносит в перевод позднейшие догматические формулы.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Синтаксис ясен для широкого читателя; формула «из того, что принадлежит Мне» сохраняет намеренную смысловую широту оригинала.
