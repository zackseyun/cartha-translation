  yaml_path: translation/nt/john/016/027.yaml
  text: For the Father himself loves you[a], because you have loved me and have believed that I came from God.
translation:
  language: ru
  text: Ведь сам Отец любит вас, потому что вы полюбили Меня и поверили, что Я пришёл от Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что Я вышел от Бога». Греческое выражение может также подразумевать, что Иисус пришёл из присутствия Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς γὰρ ὁ πατὴρ
  choice: Ведь сам Отец
  rationale: «Ведь» естественно вводит пояснение к предыдущей мысли, а «сам» сохраняет усилительное значение αὐτός при слове «Отец».
- source_word: φιλεῖ ὑμᾶς
  choice: любит вас
  rationale: φιλέω выражает личную любовь и расположение; «любит» звучит естественно и не ослабляет смысл.
- source_word: ὅτι ὑμεῖς ἐμὲ πεφιλήκατε
  choice: потому что вы полюбили Меня
  rationale: Первое ὅτι имеет причинное значение. «Полюбили» естественно передаёт совершённое действие с сохраняющимся результатом; явные местоимения сохраняют смысловое выделение учеников и Иисуса без тяжеловесности.
- source_word: καὶ πεπιστεύκατε
  choice: и поверили
  rationale: Форма перфекта указывает на обретённую и сохраняющуюся веру; русский совершенный вид естественно передаёт это в данном контексте.
- source_word: ὅτι ἐγὼ παρὰ τοῦ θεοῦ ἐξῆλθον
  choice: что Я пришёл от Бога
  rationale: Второе ὅτι вводит содержание веры. «Пришёл от Бога» ясно передаёт происхождение и посланничество, не превращая выражение в расширенную догматическую формулу.
theological_decisions:
- issue: Христологический смысл выражения παρὰ τοῦ θεοῦ ἐξῆλθον
  choice: что Я пришёл от Бога
  alternative: что Я вышел от Бога; что Я пришёл от Бога, из Его присутствия
  rationale: Перевод сохраняет утверждение Иисуса о Его происхождении и миссии от Бога, не уточняя сверх текста характер этого исхождения. Возможный оттенок выхода из Божьего присутствия отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; фраза звучит ясно и достойно. Заглавные буквы в «Отец», «Меня» и «Я» соответствуют принятому русскому библейскому оформлению. Смысловая связь с предыдущим стихом передана словом «ведь».
