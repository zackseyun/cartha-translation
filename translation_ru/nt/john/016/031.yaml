  text: Jesus answered them[a], “Do you now believe?”
translation:
  language: ru
  text: 'Иисус ответил им: «Теперь вы верите?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Теперь вы верите». Греческий текст допускает прочтение как утверждение, хотя контекст скорее указывает на риторический вопрос.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ответил
  rationale: Обычная и естественная передача повествовательного аориста ἀποκρίνομαι в контексте диалога.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж множественного числа обозначает адресатов ответа; русское «ответил им» точно и естественно.
- source_word: Ἰησοῦς
  choice: Иисус
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: Ἄρτι
  choice: теперь
  rationale: Передаёт непосредственную временную отнесённость ἄρτι и сохраняет оттенок противопоставления ближайшему контексту.
- source_word: πιστεύετε
  choice: вы верите
  rationale: Настоящее время, действительный залог, второе лицо множественного числа; «верите» — прямая и привычная передача πιστεύω в Евангелии от Иоанна.
theological_decisions:
- issue: Смысл и интонация Ἄρτι πιστεύετε;
  choice: 'Риторический вопрос: «Теперь вы верите?»'
  alternative: 'Утверждение: «Теперь вы верите».'
  rationale: В греческой рукописной традиции исходная пунктуация не определяет однозначно вопрос или утверждение. Контекст следующего стиха, где ученикам предсказывается рассеяние, благоприятствует вопросительной, вероятно иронической интонации, однако альтернативное чтение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная и достойная повествовательная формулировка. Двоеточие перед прямой речью соответствует русской пунктуационной норме.
