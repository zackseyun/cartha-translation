  yaml_path: translation/nt/john/016/012.yaml
  text: I still have many things to say to you[a], but you are not able to bear them now.
translation:
  language: ru
  text: Мне ещё многое нужно сказать вам, но сейчас вы не можете этого вынести.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но сейчас вы не можете всё это понести»; или: «но сейчас вы не можете всё это перенести». Греческий глагол может означать «нести», «выносить» или «переносить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι πολλὰ ἔχω ὑμῖν λέγειν
  choice: Мне ещё многое нужно сказать вам
  rationale: Русская конструкция «мне нужно сказать» естественно передаёт греческий оборот ἔχω + инфинитив в значении того, что ещё предстоит сказать; «ещё многое» сохраняет продолженность ἔτι и субстантивированное πολλὰ.
- source_word: ἀλλ’ οὐ δύνασθε
  choice: но сейчас вы не можете
  rationale: «Но» прямо передаёт противопоставление, а «не можете» естественно и точно выражает отсутствие способности в οὐ δύνασθε.
- source_word: βαστάζειν
  choice: этого вынести
  rationale: «Вынести» сохраняет возможные оттенки несения тяжести и перенесения чего-либо, не сводя смысл только к интеллектуальному пониманию или эмоциональной стойкости.
- source_word: ἄρτι
  choice: сейчас
  rationale: «Сейчас» ясно обозначает нынешний момент в противопоставлении последующему времени.
theological_decisions:
- issue: Характер нынешней неспособности учеников, выраженной глаголом βαστάζειν
  choice: «не можете этого вынести» — ученики пока не способны воспринять и понести тяжесть дальнейшего откровения
  alternative: «не можете этого понять» или «не можете это стерпеть»
  rationale: Греческий глагол допускает образы несения, выдерживания и перенесения. Формулировка «вынести» сохраняет смысловую и богословскую напряжённость, не ограничивая неспособность учеников лишь пониманием или лишь эмоциональным терпением.
translation_notes:
  register: Современный литературный русский язык; фраза звучит естественно и достойно. Местоимение «этого» собирательно отсылает к «многому», что соответствует русской норме. Смысл βαστάζειν намеренно не сведён к одному только пониманию.
