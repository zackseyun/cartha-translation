  yaml_path: translation/nt/john/016/016.yaml
  text: A little while[a], and you no longer see me; and again a little while, and you will see me.
translation:
  language: ru
  text: Ещё немного — и вы больше не будете видеть меня[a]; а потом ещё немного — и увидите меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь употреблены два разных глагола со значением «видеть»: θεωρέω в первой части и ὁράω во второй. Возможен оттенок различия, однако оба переданы одним русским глаголом, поскольку главным здесь является временной контраст.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μικρὸν
  choice: ещё немного
  rationale: Субстантивированное прилагательное среднего рода употреблено наречно и обозначает краткий промежуток времени. «Ещё немного» естественно по-русски и сохраняет повтор и краткость периода.
- source_word: οὐκέτι
  choice: больше не
  rationale: Передаёт прекращение действия и в современном русском звучит естественнее буквального «уже не» в этой временной конструкции.
- source_word: θεωρεῖτέ
  choice: будете видеть
  rationale: Хотя форма греческого глагола — настоящее время, сочетание «ещё немного — и» по-русски естественно требует будущего времени. θεωρέω может означать внимательное наблюдение, но здесь основное значение — видеть.
- source_word: πάλιν
  choice: снова
  rationale: Сохраняет идею последующего возобновления зрения и параллельное построение фразы.
- source_word: ὄψεσθέ
  choice: увидите
  rationale: Будущая форма ὁράω естественно передаётся совершенным видом «увидите», обозначающим наступление нового момента видения.
- source_word: με
  choice: меня
  rationale: Прямое дополнение, относящееся к Иисусу. Строчная буква соответствует нейтральной современной орфографии и не добавляет конфессионального оформления.
- source_word: καὶ
  choice: и
  rationale: Повторяющийся союз образует две уравновешенные части высказывания; русское «и» сохраняет их ритм и связь.
theological_decisions:
- issue: Следует ли различать θεωρέω и ὁράω разными русскими глаголами, предполагая разные способы видения
  choice: Оба глагола переданы формами глагола «видеть», при этом видовые и временные формы различаются по требованиям русского языка
  alternative: «перестанете наблюдать меня… увидите меня» или «не будете видеть меня… узрите меня»
  rationale: Значения двух греческих глаголов в данном контексте существенно пересекаются. Резкое лексическое разграничение могло бы внести не обозначенное текстом богословское различие; основной явный контраст здесь временной.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмически параллельная фраза. Конструкция «ещё немного — и» естественно ориентирует первую часть на будущее, хотя в греческом стоит настоящее время. «Снова немного» слегка необычно, но сохраняет повтор Μικρὸν и πάλιν без разъясняющего расширения.
