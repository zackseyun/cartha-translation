base_translation:
  language: en
  yaml_path: translation/nt/john/016/032.yaml
  text: Behold[a], an hour is coming, and has come, when you will be scattered, each to his own, and will leave me alone. Yet I am not alone, because the Father is with me.
translation:
  language: ru
  text: Вот, наступает час — и уже наступил, — когда вы рассеетесь, каждый в своё[a], и оставите Меня одного. Но Я не один, потому что Отец со Мной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каждый к себе домой», «каждый в своё место» или «каждый к тому, что ему принадлежит». Греческое выражение шире обозначения конкретного места и может относиться вообще к тому, что принадлежит каждому.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Вот
  rationale: Естественный современный русский маркер привлечения внимания, сохраняющий торжественный тон без архаичности.
- source_word: ἔρχεται ὥρα καὶ ἐλήλυθεν
  choice: наступает час — и уже наступил
  rationale: 'Сохраняет напряжение между настоящим временем и перфектом: решающий момент приближается и одновременно уже наступил. Слово «час» здесь означает определённое решающее время.'
- source_word: ἵνα
  choice: когда
  rationale: После выражения о наступающем часе вводит содержание и событие, характеризующее этот час; «когда» естественно передаёт временной смысл.
- source_word: σκορπισθῆτε
  choice: вы рассеетесь
  rationale: Передаёт разобщение учеников; русская возвратная форма естественнее буквальной пассивной конструкции и не уточняет внешнюю силу сверх сказанного.
- source_word: ἕκαστος εἰς τὰ ἴδια
  choice: каждый к своему
  rationale: Сохраняет компактность и широту выражения τὰ ἴδια, которое может относиться к своему дому, месту, имуществу или собственной сфере.
- source_word: κἀμὲ μόνον ἀφῆτε
  choice: и оставите Меня одного
  rationale: Точно передаёт оставление Иисуса учениками, не усиливая значение до более интерпретирующего «бросите» или «покинете».
- source_word: καὶ οὐκ εἰμὶ μόνος
  choice: Но Я не один
  rationale: Союз «но» ясно и естественно выражает контраст между уходом учеников и присутствием Отца.
- source_word: ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν
  choice: потому что Отец со Мной
  rationale: Прямо передаёт основание утверждения Иисуса и сохраняет важный для Иоанна титул «Отец».
theological_decisions:
- issue: Соотношение оставления Иисуса учениками и присутствия Отца
  choice: Но Я не один, потому что Отец со Мной
  alternative: И Я не один, ибо Отец со Мной
  rationale: 'Перевод сохраняет напряжение текста: ученики действительно оставят Иисуса одного, однако Он не один в абсолютном смысле благодаря присутствию Отца; дальнейшие богословские выводы в стих не вносятся.'
- issue: Неопределённость выражения ἕκαστος εἰς τὰ ἴδια
  choice: каждый к своему
  alternative: каждый к себе домой
  rationale: Не сужает греческое выражение до дома, поскольку оно может обозначать то, что принадлежит каждому, его место или собственную сферу.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной торжественностью. Заглавные местоимения «Меня», «Я», «Мной» следуют принятой русской библейской стилистике. Тире выделяют вставное «и уже наступил» и помогают сохранить временное напряжение оригинала.
