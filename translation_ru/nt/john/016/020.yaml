  source_fidelity: 'Перевод точно передаёт структуру и смысл греческого текста: двойное торжественное «Истинно», обращение «говорю вам», противопоставление учеников и мира, а также переход печали в радость. «Станет радостью» адекватно отражает εἰς χαρὰν γενήσεται, не ослабляя образ превращения до простой последующей смены состояний.'
  naturalness: Текст звучит естественно на современном литературном русском при уместно торжественном регистре. «Будете плакать и скорбеть» передаёт два глагола выражения горя без неестественной архаизации; «будете печалиться» и «ваша печаль» образуют ясную смысловую связь.
  terminology: «Мир» правильно сохраняет широкий иоанновский κόσμος без конфессионально окрашенного уточнения. «Радоваться», «печалиться» и «радость» последовательны и стилистически уместны. Формула «Истинно, истинно говорю вам» соответствует устойчивому, торжественному характеру речи в Евангелии от Иоанна.
