id: JHN.16.20
reference: John 16:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι κλαύσετε καὶ θρηνήσετε ὑμεῖς, ὁ δὲ κόσμος χαρήσεται· ⸀ὑμεῖς λυπηθήσεσθε, ἀλλ’ ἡ λύπη ὑμῶν εἰς χαρὰν γενήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/020.yaml
  text: Truly[a], truly, I say to you, you will weep and mourn, but the world will rejoice; you will be grieved, but your grief will become joy.
translation:
  language: ru
  text: 'Истинно, истинно говорю вам: вы будете плакать и скорбеть, а мир будет радоваться. Вы будете печалиться, но ваша печаль станет радостью[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обратится в радость».'
    reason: Вариант естественной передачи εἰς χαρὰν γενήσεται; основной текст ближе воспроизводит значение γίνομαι «становиться».
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Истинно, истинно
  rationale: Сохраняет торжественное усиление посредством повтора и естественно звучит в литературном русском языке; «аминь, аминь» формально ближе, но менее понятно как вводная формула обычному современному читателю.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямо передаёт греческую формулу обращения и сохраняет характерный для Иоанна оборот.
- source_word: κλαύσετε καὶ θρηνήσετε
  choice: будете плакать и скорбеть
  rationale: Передаёт два взаимодополняющих выражения горя, не сводя их к одному глаголу. «Причитать» точнее подчёркивало бы внешнее оплакивание во втором глаголе, но в современном русском имеет нежелательный разговорно-экспрессивный оттенок.
- source_word: ὁ δὲ κόσμος
  choice: а мир
  rationale: Сохраняет контраст и широкое иоанновское обозначение κόσμος без поясняющего добавления вроде «неверующий».
- source_word: χαρήσεται
  choice: будет радоваться
  rationale: Передаёт будущую форму и сохраняет смысловую связь с существительным χαρά — «радость» — в конце стиха.
- source_word: λυπηθήσεσθε
  choice: будете печалиться
  rationale: Естественно передаёт состояние скорби и сохраняет корневую связь с последующим «печаль», соответствующую связи λυπηθήσεσθε и λύπη.
- source_word: ἡ λύπη ὑμῶν
  choice: ваша печаль
  rationale: Ясное и естественное соответствие, поддерживающее лексическую связь с «будете печалиться».
- source_word: εἰς χαρὰν γενήσεται
  choice: станет радостью
  rationale: Близко передаёт конструкцию εἰς с γίνομαι как переход в иное состояние и не объясняет сверх текста, каким именно образом произойдёт эта перемена.
theological_decisions:
- issue: Иоанновское употребление κόσμος
  choice: мир
  alternative: неверующий мир; мир, враждебный Иисусу
  rationale: В контексте слово обозначает коллективную среду, противопоставленную ученикам, но сам стих не вводит уточняющего определения. Более широкое «мир» сохраняет богословскую многозначность иоанновского термина.
- issue: Характер превращения печали в радость
  choice: печаль станет радостью
  alternative: печаль сменится радостью
  rationale: Греческое εἰς χαρὰν γενήσεται говорит не только о последующей радости, но грамматически представляет саму печаль как становящуюся радостью. Перевод сохраняет эту напряжённую формулировку, не сводя её к простой смене чувств.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Повтор «истинно, истинно» и формула «говорю вам» сохранены как характерные черты речи Иисуса у Иоанна. Маркер примечания поставлен при обороте, к которому относится лексическая альтернатива.
