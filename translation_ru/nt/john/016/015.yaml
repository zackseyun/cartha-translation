id: JHN.16.15
reference: John 16:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πάντα ὅσα ἔχει ὁ πατὴρ ἐμά ἐστιν· διὰ τοῦτο εἶπον ὅτι ἐκ τοῦ ἐμοῦ λαμβάνει καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/015.yaml
  text: Everything that the Father has is mine[a]. That is why I said that he takes from what is mine and will declare it to you.
translation:
  language: ru
  text: Всё, что есть у Отца, — Моё. Поэтому Я сказал, что Он берёт[a] из того, что Моё, и возвестит вам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «получает».'
    reason: 'Лексическая альтернатива: λαμβάνει может означать как «берёт», так и «получает».'
lexical_decisions:
- source_word: πάντα ὅσα
  choice: Всё, что
  rationale: Передаёт всеохватность выражения естественным современным русским языком.
- source_word: ἔχει ὁ πατήρ
  choice: есть у Отца
  rationale: Русская конструкция «есть у» естественно выражает значение обладания, сохраняя настоящее время и титульное употребление слова «Отец».
- source_word: ἐμά ἐστιν
  choice: Моё
  rationale: Кратко и непосредственно передаёт предикативное притяжательное значение и силу утверждения о принадлежности всего Сыну.
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Ясно передаёт причинно-следственную связь с последующим объяснением.
- source_word: εἶπον
  choice: Я сказал
  rationale: Простой прошедший вид естественно передаёт греческий аорист в данном контексте.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: из того, что Моё
  rationale: Раскрывает эллиптическую греческую конструкцию, сохраняя указание на источник и принадлежность Сыну.
- source_word: λαμβάνει
  choice: берёт
  rationale: Сохраняет настоящее время и допустимое активное значение λαμβάνω; вариант «получает» дан в сноске, чтобы не устранять лексическую неоднозначность.
- source_word: ἀναγγελεῖ
  choice: возвестит
  rationale: Сохраняет будущее время и передаёт торжественный, откровенный характер сообщения без добавления отсутствующего в тексте содержания.
- source_word: ὑμῖν
  choice: вам
  rationale: Естественно передаёт дательный падеж адресата — учеников.
theological_decisions:
- issue: Отношение того, чем обладает Отец, к Сыну
  choice: Всё, что есть у Отца, — Моё
  alternative: Всё, что имеет Отец, принадлежит Мне
  rationale: Формулировка сохраняет сильное утверждение текста о принадлежности Сыну всего, что есть у Отца, не вводя более поздней догматической терминологии.
- issue: Получение Духом от Сына
  choice: Он берёт из того, что Моё
  alternative: Он получает из того, что Моё
  rationale: Глагол λαμβάνει допускает оттенки «берёт» и «получает». Основной текст и сноска сохраняют эту смысловую напряжённость, не уточняя сверх текста характер отношения Духа к Сыну.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавные буквы в местоимениях «Я», «Он», «Моё» отмечают личные упоминания Сына и Духа в принятой русской библейской традиции; синтаксис остаётся ясным для обычного читателя.
