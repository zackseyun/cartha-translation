  text: И они будут делать всё это, потому что не познали ни Отца, ни Меня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не знали ни Отца, ни Меня»; возможно также: «не пришли к познанию ни Отца, ни Меня». Греческая форма допускает эти смысловые оттенки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз сохраняет связь с предшествующим высказыванием.
- source_word: ταῦτα ποιήσουσιν
  choice: они будут делать это
  rationale: Будущее время передано прямо; русское «это» естественно отсылает к перечисленным ранее враждебным действиям, хотя греческое ταῦτα формально имеет множественное число.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит причину описанных действий.
- source_word: οὐκ ἔγνωσαν
  choice: не познали
  rationale: Аорист γινώσκω здесь обозначает отсутствие подлинного, личностного знания; «не познали» сохраняет как итоговый смысл, так и характерную для Иоанна тему познания.
- source_word: τὸν πατέρα
  choice: Отца
  rationale: Речь идёт о Боге как Отце; прописная буква передаёт титульное употребление.
- source_word: οὐδὲ ἐμέ
  choice: ни Меня
  rationale: Конструкция «не… ни… ни…» естественно и точно передаёт присоединение второго отрицательного дополнения; прописная буква соответствует традиционному русскому оформлению местоимения, относящегося к Христу.
theological_decisions:
- issue: Иоаннова тема познания Отца и Иисуса
  choice: не познали ни Отца, ни Меня
  alternative: не знали Отца и Меня; не узнали Отца и Меня
  rationale: «Познали» не сводит смысл к осведомлённости и сохраняет указание на отсутствие подлинного отношения к Отцу и Иисусу, не добавляя догматического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формулировка ясна широкому читателю; повтор «ни… ни…» сохраняет риторический акцент исходного текста.
