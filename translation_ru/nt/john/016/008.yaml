base_translation:
  language: en
  yaml_path: translation/nt/john/016/008.yaml
  text: And when that one comes[c][b][a], he will convict the world concerning sin and concerning righteousness and concerning judgment.
translation:
  language: ru
  text: И когда он придёт, то обличит мир относительно греха, праведности и суда.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тот»; греческое указательное местоимение имеет усилительный оттенок и относится к Утешителю, о котором говорится выше.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «справедливости».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθὼν
  choice: когда он придёт
  rationale: Аористное причастие здесь имеет временное значение; придаточное с «когда» естественно передаёт его по-русски.
- source_word: ἐκεῖνος
  choice: он
  rationale: Указательное местоимение относится к Утешителю, названному в ближайшем контексте. В основном тексте выбрано естественное русское местоимение, а усилительный оттенок греческого отмечен в сноске.
- source_word: ἐλέγξει
  choice: обличит
  rationale: Глагол означает выявить вину или неправоту, изобличить; «обличит» сохраняет нравственно-судебный оттенок, не сводя смысл только к осуждению.
- source_word: τὸν κόσμον
  choice: мир
  rationale: Сохраняется широкое и богословски значимое для Иоанна обозначение мира без уточняющего перетолкования как исключительно людей или системы.
- source_word: περὶ
  choice: в том, что касается
  rationale: Оборот естественно вводит три области обличения и передаёт значение «относительно, касательно»; общая конструкция охватывает все три повторения предлога.
- source_word: ἁμαρτίας
  choice: греха
  rationale: Сохранено единственное число греческого существительного; его конкретный смысл раскрывается следующим стихом.
- source_word: δικαιοσύνης
  choice: праведности
  rationale: «Праведность» сохраняет нравственный и богословский диапазон δικαιοσύνη и лучше соответствует пояснению в следующем стихе; возможное «справедливость» отмечено в сноске.
- source_word: κρίσεως
  choice: суда
  rationale: «Суд» сохраняет юридический и эсхатологический диапазон κρίσις, не сужая значение до осуждения как результата суда.
theological_decisions:
- issue: Указательный и усилительный характер ἐκεῖνος
  choice: В тексте — «он», с указанием в сноске буквального усилительного оттенка «тот».
  alternative: «тот» / «именно он»
  rationale: Референтом в контексте является приходящий Утешитель. Самостоятельное «тот» в современном русском звучит неестественно, а «именно он» способно чрезмерно усилить противопоставление; сноска сохраняет особенность оригинала.
- issue: Значение δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: Контекст следующего стиха связывает слово с уходом Иисуса к Отцу, поэтому «праведность» лучше сохраняет вероятный христологический и нравственный смысл, не исключая оттенка справедливости.
- issue: Характер действия ἐλέγξει над миром
  choice: обличит
  alternative: докажет миру его неправоту / изобличит
  rationale: Выбор сохраняет напряжение между выявлением греха, доказательством неправоты и судебным обличением, не определяя заранее, означает ли действие также внутреннее убеждение.
translation_notes:
  register: Современный литературный русский, сдержанный и торжественный. Тире облегчает восприятие пояснительного оборота после «обличит мир». Местоимения, относящиеся к Богу и Духу, не капитализированы, поскольку греческий текст такого различия не выражает.
