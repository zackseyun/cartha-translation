  source_fidelity: '«Но теперь» точно передаёт νῦν δέ как переход с оттенком противопоставления. «Я ухожу к Тому, Кто послал Меня» сохраняет настоящее время ὑπάγω, направление, заданное πρός, и не добавляет явно слово «Отец». «Никто из вас не спрашивает Меня: „Куда Ты уходишь?“» точно воспроизводит отрицание, партитивное «из вас» и прямой вопрос без интерпретационного смягчения.'
  naturalness: Текст звучит естественно и литературно по-русски. «Ухожу к Тому» и «Куда Ты уходишь?» согласованно передают движение и уместны в торжественно-нейтральном библейском регистре.
