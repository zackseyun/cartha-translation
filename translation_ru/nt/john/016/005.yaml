  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: νῦν δὲ ὑπάγω πρὸς τὸν πέμψαντά με καὶ οὐδεὶς ἐξ ὑμῶν ἐρωτᾷ με· Ποῦ ὑπάγεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/005.yaml
  text: But now I am going to the one who sent me, and none of you asks me, ‘Where are you going?’
translation:
  language: ru
  text: 'Но теперь Я ухожу к Тому, Кто послал Меня, и никто из вас не спрашивает Меня: «Куда Ты уходишь?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Но теперь
  rationale: Передаёт контраст, выраженный δέ, и естественно связывает фразу с предшествующей речью.
- source_word: ὑπάγω
  choice: Я ухожу
  rationale: Передаёт направленное удаление в настоящем времени и в данном контексте звучит естественнее, чем буквальное «иду».
- source_word: πρὸς τὸν πέμψαντά με
  choice: к Тому, Кто послал Меня
  rationale: Сохраняет личный характер субстантивированного причастия и не добавляет прямо не названное здесь слово «Отец».
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: никто из вас
  rationale: Прямой и естественный эквивалент партитивного оборота.
- source_word: ἐρωτᾷ με
  choice: не спрашивает Меня
  rationale: В контексте речь идёт о заданном вопросе, поэтому «спрашивает» точно передаёт значение глагола.
- source_word: Ποῦ ὑπάγεις;
  choice: Куда Ты уходишь?
  rationale: Естественно передаёт вопрос о направлении движения и сохраняет соответствие с тем же глаголом ὑπάγω в первой части стиха.
theological_decisions:
- issue: Кого обозначает выражение «Тот, Кто послал Меня»
  choice: Не уточнять в тексте, что это Отец
  alternative: «к Отцу, пославшему Меня»
  rationale: В богословии Евангелия от Иоанна подразумевается Отец, однако греческий текст данного стиха использует только субстантивированное причастие; перевод сохраняет эту формулировку без поясняющего добавления.
- issue: Кажущееся противоречие с вопросами учеников в Ин. 13:36 и 14:5
  choice: Сохранить абсолютную формулировку «никто из вас не спрашивает» без истолковывающего смягчения
  alternative: «теперь никто из вас не спрашивает» или «никто из вас не расспрашивает»
  rationale: Источник формулирует утверждение прямо. Возможная прагматическая связь с нынешним моментом или глубиной вопроса остаётся для толкования и не должна молча разрешаться переводом.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Прописные местоимения при обращении к Иисусу и обозначении Его и Пославшего выбраны в соответствии с устойчивой русской библейской издательской традицией; это орфографическое почтение, а не добавление к содержанию.
