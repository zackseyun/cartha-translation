base_translation:
  language: en
  yaml_path: translation/nt/john/016/002.yaml
  text: They will make you outcasts from the synagogues[a]; indeed[b], an hour is coming when everyone who kills you will think he is offering service to God.
translation:
  language: ru
  text: Вас исключат из синагог[a]. Но наступает час, когда всякий, кто убьёт вас, будет думать, что приносит Богу служение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изгонят из синагог»; «отлучат от синагог».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «приносит Богу религиозное служение»; возможно: «совершает богослужение Богу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσυναγώγους ποιήσουσιν ὑμᾶς
  choice: Вас будут исключать из синагог
  rationale: Предикативное прилагательное с ποιέω обозначает изгнание или исключение из общины; русская конструкция естественно передаёт это значение и сохраняет множественное число «синагог».
- source_word: ἀλλ’
  choice: Более того
  rationale: 'Союз вводит не простое противопоставление, а усиление: преследование дойдёт от исключения до убийства.'
- source_word: ἔρχεται ὥρα
  choice: наступает час
  rationale: Сохранена характерная для Иоанна метафора «час», без её интерпретирующей замены словом «время».
- source_word: ἵνα
  choice: когда
  rationale: После выражения «наступает час» союз естественно вводит содержание этого часа с временным оттенком.
- source_word: πᾶς ὁ ἀποκτείνας ὑμᾶς
  choice: всякий, кто убьёт вас
  rationale: Переданы обобщающий смысл πᾶς и личная конструкция субстантивированного причастия.
- source_word: δόξῃ
  choice: будет думать
  rationale: Глагол выражает субъективное убеждение преследователя, а не действительную угодность его поступка Богу.
- source_word: λατρείαν προσφέρειν τῷ θεῷ
  choice: тем самым служит Богу
  rationale: Естественная русская формулировка передаёт культовое, религиозное служение, которое убийца ошибочно усматривает в своём поступке; «тем самым» связывает служение именно с убийством.
theological_decisions:
- issue: Самопонимание преследователей выражено языком богослужебного служения
  choice: будет думать, что тем самым служит Богу
  alternative: будет думать, что приносит Богу служение / совершает служение Богу
  rationale: 'Перевод сохраняет шокирующую иронию: убийца считает своё действие религиозным служением, но текст не подтверждает правильность этого убеждения.'
- issue: Обобщающий мужской единственный субъект πᾶς ὁ ἀποκτείνας
  choice: всякий, кто убьёт вас, будет думать
  alternative: каждый, кто убьёт вас, будет думать
  rationale: «Всякий» естественно передаёт универсальный, родовой смысл греческой конструкции без добавления отдельного местоимения, которое в русском не требуется.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Более того» передаёт нарастание угрозы; «наступает час» сохраняет иоанновскую образность. Формулировка «тем самым служит Богу» звучит естественно, тогда как буквальная конструкция вынесена в примечание.
