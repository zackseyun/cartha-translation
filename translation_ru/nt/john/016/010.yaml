    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ
  choice: о
  rationale: Предлог естественно вводит очередную тему в параллельном ряду стихов 9–11 и сохраняет повторяющуюся структуру.
- source_word: δικαιοσύνης
  choice: праведности
  rationale: «Праведность» передаёт основной богословский и нравственный диапазон δικαιοσύνη; возможное значение «справедливость» отмечено в сноске.
- source_word: δέ
  choice: а
  rationale: Здесь частица переводит переход к следующему пункту перечисления, не выражая резкого противопоставления.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит основание, связанное с уходом Иисуса к Отцу.
- source_word: πρὸς τὸν πατέρα
  choice: к Отцу
  rationale: При глаголе движения πρός естественно передаётся как «к»; определённый титул сохранён без добавления «Моему».
- source_word: ὑπάγω
  choice: Я иду
  rationale: Настоящее время с ближайшей будущей направленностью передано естественной русской формой, сохраняющей непосредственность ухода.
- source_word: οὐκέτι
  choice: больше не
  rationale: Оборот ясно выражает прекращение возможности видеть Иисуса.
- source_word: θεωρεῖτέ
  choice: увидите
  rationale: В контексте речь идёт о дальнейшем зрительном восприятии; русское будущее время согласуется с предстоящим уходом, не усиливая значение до «созерцать» или «наблюдать».
theological_decisions:
- issue: Значение δικαιοσύνη в связи с уходом Иисуса к Отцу
  choice: праведность
  alternative: справедливость
  rationale: Основной текст сохраняет широкое библейское понятие праведности и допускает смысл оправдания или подтверждения правоты Иисуса Его возвращением к Отцу, не делая этот вывод явным в переводе. Альтернативный аспект справедливости сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением параллельной структуры рассуждения. Тире подчёркивает переход от темы к её основанию; прописные местоимения при обращении к Иисусу соответствуют принятому русскому библейскому регистру.
