  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐμὲ οὐκ ἐρωτήσετε οὐδέν· ἀμὴν ἀμὴν λέγω ὑμῖν, ⸂ἄν τι⸃ αἰτήσητε τὸν πατέρα ⸂δώσει ὑμῖν ἐν τῷ ὀνόματί μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/023.yaml
  text: And in that day you will ask me nothing[a]. Truly, truly, I say to you, whatever you ask the Father in my name[b], he will give to you.
translation:
  language: ru
  text: 'И в тот день вы ни о чём не будете Меня спрашивать[a]. Истинно, истинно говорю вам: чего бы вы ни попросили у Отца во имя Моё, Он даст вам[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь и далее употреблены разные глаголы: сначала ἐρωτάω — «спрашивать, задавать вопрос» — по отношению к Иисусу, затем αἰτέω — «просить» — по отношению к Отцу.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможное членение: «чего бы вы ни попросили у Отца, Он даст вам во имя Моё».'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: в тот день
  rationale: Естественное русское временное выражение, сохраняющее указательный и богословски насыщенный характер формулы Иоанна.
- source_word: ἐμὲ οὐκ ἐρωτήσετε οὐδέν
  choice: вы ни о чём не будете Меня спрашивать
  rationale: Передаёт явно выраженное «Меня» и полное отрицание; глагол «спрашивать» естественно допускает смысл обращения с вопросом, не сужая его до одного толкования.
- source_word: ἀμὴν ἀμὴν
  choice: Истинно, истинно
  rationale: Сохраняет характерное для Евангелия от Иоанна торжественное удвоение и звучит понятно в современном литературном русском.
- source_word: ἄν τι αἰτήσητε τὸν πατέρα
  choice: чего бы вы ни попросили у Отца
  rationale: Русская уступительно-неопределённая конструкция естественно передаёт открытый объём ἄν τι, а «попросили у» ясно выражает просительный смысл αἰτέω.
- source_word: ἐν τῷ ὀνόματί μου
  choice: во имя Моё
  rationale: Устоявшаяся, достойная и богословски ёмкая передача, не уточняющая сверх текста характер связи просьбы с именем Иисуса.
- source_word: δώσει ὑμῖν
  choice: Он даст вам
  rationale: Близко следует греческому тексту, не добавляя подразумеваемого объекта; в русском он восстанавливается из предшествующего относительного оборота.
theological_decisions:
- issue: Различие между ἐρωτάω применительно к Иисусу и αἰτέω применительно к Отцу
  choice: Передать первое как «спрашивать», второе как «просить» и пояснить различие в сноске.
  alternative: Оба глагола передать одинаково словом «просить» либо первый — более узко как «задавать вопросы».
  rationale: Разные русские глаголы естественно отражают лексический контраст, не превращая возможный оттенок первого глагола в жёсткое толкование.
- issue: Объём обещания о просьбе во имя Иисуса
  choice: Передать обещание прямо, без добавочных условий.
  alternative: Включить пояснение о соответствии просьбы воле Иисуса.
  rationale: Сам стих не формулирует такого условия; перевод сохраняет его богословскую напряжённость и не вносит контекстуальное толкование в основной текст.
- issue: Синтаксическая связь выражения ἐν τῷ ὀνόματί μου
  choice: В основном тексте связать «во имя Моё» с просьбой к Отцу.
  alternative: 'Связать выражение с последующим «Он даст вам»: «Он даст вам во имя Моё».'
  rationale: Пунктуация и синтаксическая связь допускают обсуждение; выбранное членение наиболее естественно в данном контексте, а подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Местоимения, относящиеся к Иисусу и Отцу, написаны с прописной буквы согласно распространённой русской библейской норме; архаичные формы сведены к выразительной формуле «Истинно, истинно» и традиционному обороту «во имя Моё».
