  text: εἰ ἐκείνους εἶπεν θεοὺς πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο, καὶ οὐ δύναται λυθῆναι ἡ γραφή,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/035.yaml
  text: If he called those to whom the word of God came ‘gods’—and the Scripture cannot be broken—[a][b]
translation:
  language: ru
  text: Если Он назвал «богами»[a] тех, к кому пришло слово Божье, — а Писание не может быть отменено[b], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «божественными существами». По-гречески буквально: «богами»; это перекликается с Псалмом 81:6 (82:6 в иной нумерации). Некоторые толкователи понимают этих лиц как людей-судей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не может быть лишено силы» или «не может быть отвергнуто».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Если
  rationale: Сохраняет условную форму аргумента и естественно вводит посылку рассуждения.
- source_word: ἐκείνους εἶπεν θεοὺς
  choice: Он назвал «богами» тех
  rationale: Глагол εἶπεν в этой конструкции передаёт наименование; «назвал» естественно по-русски и сохраняет точное θεούς — «богами».
- source_word: πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο
  choice: к кому было обращено слово Бога
  rationale: Передаёт направленность πρός и событийный смысл ἐγένετο без неестественной русской кальки «слово пришло»; контекст указывает на Божье обращение к названным лицам.
- source_word: οὐ δύναται λυθῆναι
  choice: не может быть отменено
  rationale: Передаёт невозможность лишить Писание силы или действия; это значение λυθῆναι в данном контексте яснее современному русскому читателю, чем буквальное «нарушено».
- source_word: ἡ γραφή
  choice: Писание
  rationale: Устоявшееся обозначение авторитетного священного текста; прописная буква ясно показывает специальное употребление.
theological_decisions:
- issue: Значение слова θεούς в цитате
  choice: Сохранено буквальное «богами» в кавычках без истолкования в основном тексте.
  alternative: «судьями» или «божественными существами»
  rationale: Довод Иисуса опирается на формулировку Псалма 81:6 (82:6 в иной нумерации). Замена на «судей» или иное толкование преждевременно разрешила бы реальную неоднозначность.
- issue: Сила выражения «Писание не может быть отменено»
  choice: Передано как невозможность отменить или лишить Писание силы.
  alternative: «Писание не может быть нарушено» или «не может быть устранено»
  rationale: Фраза утверждает непреложность Писания в ходе аргумента, не добавляя более широкой конфессиональной формулировки о природе богодухновенности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Кавычки при слове «богами» обозначают цитируемое наименование и помогают сохранить богословское напряжение. Тире перед вводным замечанием и после него отражают незавершённость синтаксиса стиха, продолжающегося в Ин. 10:36.
