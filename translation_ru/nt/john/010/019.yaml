lexical_decisions:
- source_word: Σχίσμα
  choice: разделение
  rationale: Существительное обозначает раскол или разделение; здесь речь идёт о различных откликах людей на слова Иисуса.
- source_word: πάλιν
  choice: снова
  rationale: Наречие указывает, что подобное разделение уже происходило ранее.
- source_word: ἐγένετο
  choice: возникло
  rationale: Форма γίνομαι передаёт появление или наступление состояния; сочетание «возникло разделение» естественно в современном русском языке.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: среди иудеев
  rationale: Это прямой перевод греческого выражения. В Евангелии от Иоанна Ἰουδαῖοι имеет контекстно обусловленный смысл, поэтому возможные уточнения вынесены в сноску.
- source_word: διὰ
  choice: из-за
  rationale: Предлог с винительным падежом выражает причину; «из-за» ясно и естественно передаёт эту связь.
- source_word: τοὺς λόγους τούτους
  choice: этих слов
  rationale: λόγοι относится к предшествующим словам Иисуса; «слова» — прямой и естественный русский эквивалент.
theological_decisions:
- issue: Значение Ἰουδαῖοι в Евангелии от Иоанна
  choice: В основном тексте — «иудеи», со сноской о контекстных значениях.
  alternative: «жители Иудеи» или «иудейские руководители»
  rationale: Так сохраняется греческая формулировка и одновременно предотвращается ошибочное понимание выражения как обобщения обо всём еврейском народе.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная и достойная формулировка. Причинная конструкция вынесена в начало, как в консультационном английском тексте, без ущерба для смысла греческого оригинала.
