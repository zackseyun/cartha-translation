source:
  edition: SBLGNT
  text: κἀγὼ ⸂δίδωμι αὐτοῖς ζωὴν αἰώνιον⸃, καὶ οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα, καὶ οὐχ ἁρπάσει τις αὐτὰ ἐκ τῆς χειρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/028.yaml
  text: And I give them eternal life, and they will certainly never perish forever, and no one will snatch them out of my hand.
translation:
  language: ru
  text: Я даю им вечную жизнь, и они никогда не погибнут, и никто не вырвет их из моей руки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζωὴν αἰώνιον
  choice: вечную жизнь
  rationale: Устойчивое и точное соответствие, передающее жизнь, относящуюся к грядущему веку и не имеющую конца.
- source_word: οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα
  choice: никогда не погибнут
  rationale: «Никогда» естественно по-русски передаёт усиленное отрицание οὐ μή вместе с идиомой εἰς τὸν αἰῶνα; будущее «не погибнут» соответствует смыслу аористного сослагательного в этой конструкции.
- source_word: ἁρπάσει
  choice: похитит
  rationale: Передаёт насильственное завладение или вырывание из-под защиты; в русском контексте хорошо сочетается с образом овец и руки пастыря.
- source_word: ἐκ τῆς χειρός μου
  choice: из моей руки
  rationale: Сохранён конкретный образ единственного числа без замены на более отвлечённое «из-под моей власти».
theological_decisions:
- issue: Сила обещания о том, что овцы не погибнут
  choice: они никогда не погибнут
  alternative: они не погибнут вовек / они точно никогда не погибнут
  rationale: Формулировка сохраняет категоричность усиленного греческого отрицания и временную полноту выражения, не добавляя отдельного богословского объяснения о механизме или условиях сохранения.
- issue: Образ защищающей руки Иисуса
  choice: из моей руки
  alternative: из-под моей защиты
  rationale: Конкретная метафора оригинала сохранена, чтобы не сводить её заранее только к одному толкованию — защите, власти или принадлежности.
translation_notes:
  register: Современный литературный русский язык; фраза ясная, торжественная и естественная. Местоимение «моей» дано со строчной буквы согласно обычной современной орфографии; это не умаляет референта и не вносит отсутствующего в греческом типографского различия.
