source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν πάλιν πέραν τοῦ Ἰορδάνου εἰς τὸν τόπον ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων, καὶ ἔμεινεν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/040.yaml
  text: And he went away again across the Jordan to the place where John had first been baptizing[a], and he stayed there.
translation:
  language: ru
  text: И Он снова ушёл за Иордан, туда, где Иоанн прежде крестил, и остался там.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: ушёл
  rationale: Глагол обозначает удаление из прежнего места; «ушёл» естественно передаёт не только движение, но и оставление места.
- source_word: πάλιν
  choice: снова
  rationale: Прямо выражает повторность действия в современном русском языке.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: за Иордан
  rationale: Оборот указывает на местонахождение по другую сторону реки; «за Иордан» кратко, естественно и сохраняет пространственную перспективу исходного текста.
- source_word: εἰς τὸν τόπον ὅπου
  choice: туда, где
  rationale: Естественная русская передача движения к названному далее месту без тяжеловесного повтора слова «место».
- source_word: ἦν Ἰωάννης τὸ πρῶτον βαπτίζων
  choice: Иоанн прежде крестил
  rationale: Передаёт более раннее и продолжавшееся тогда служение Иоанна; «прежде» здесь естественно выражает значение τὸ πρῶτον, а несовершенный вид «крестил» — длительность действия.
- source_word: ἔμεινεν ἐκεῖ
  choice: остался там
  rationale: Точно и естественно передаёт пребывание Иисуса в этом месте.
theological_decisions: []
