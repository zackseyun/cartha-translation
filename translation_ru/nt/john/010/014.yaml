lexical_decisions:
- source_word: ποιμήν
  choice: пастух
  rationale: Обычное значение слова — человек, пасущий стадо. «Пастух» сохраняет непосредственный образ речи и не привносит более поздних церковных ассоциаций слова «пастор».
- source_word: καλός
  choice: добрый
  rationale: В данном контексте слово выражает нравственное достоинство и образцовое качество. Традиционное и естественное сочетание «добрый пастух» передаёт это без излишнего истолкования.
- source_word: γινώσκω / γινώσκουσί
  choice: знаю / знают
  rationale: Глагол обозначает личное, взаимное знание, а не только распознавание. Русское «знать» естественно сохраняет этот смысл.
- source_word: τὰ ἐμὰ / τὰ ἐμά
  choice: Моих / Мои
  rationale: Субстантивированное притяжательное прилагательное среднего рода во множественном числе буквально означает «Моё / принадлежащее Мне», но по контексту называет тех, кто принадлежит пастуху. «Моих / Мои» сохраняет краткость, принадлежность и взаимную структуру фразы, не добавляя прямо отсутствующее здесь слово «овцы».
- source_word: ἐγώ εἰμι
  choice: Я —
  rationale: Русская именная конструкция с тире естественно передаёт настоящее время самоотождествления «Я есмь / Я являюсь», сохраняя явное ударение на «Я» без архаизма.
- source_word: καί
  choice: новое предложение без отдельного союза; затем «и»
  rationale: Первое καί связывает самоотождествление со следующим утверждением; в современном русском разделение на два предложения звучит естественно и сохраняет последовательность мысли. Второе καί передано союзом «и», выражающим взаимность двух соотнесённых действий.
theological_decisions:
- issue: Передача взаимного знания Иисуса и принадлежащих Ему без внесения позднейших догматических формулировок
  choice: Моих / Мои
  alternative: Моих овец / Мои овцы; тех, кто принадлежит Мне
  rationale: Такой перевод сохраняет личную принадлежность и взаимное знание, оставаясь близким к намеренно краткому греческому выражению. Он не подставляет из контекста существительное «овцы» и не расширяет текст пояснительной конструкцией.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Пастух» сохраняет живую метафору; прописные буквы в «Моих», «Мои», «Меня» соответствуют принятому русскому библейскому оформлению местоимений, относящихся к Христу. Тире позволяет избежать архаического «есмь».
