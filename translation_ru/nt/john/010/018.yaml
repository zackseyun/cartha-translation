source:
  edition: SBLGNT
  text: οὐδεὶς ⸀αἴρει αὐτὴν ἀπ’ ἐμοῦ, ἀλλ’ ἐγὼ τίθημι αὐτὴν ἀπ’ ἐμαυτοῦ. ἐξουσίαν ἔχω θεῖναι αὐτήν, καὶ ἐξουσίαν ἔχω πάλιν λαβεῖν αὐτήν· ταύτην τὴν ἐντολὴν ἔλαβον παρὰ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/018.yaml
  text: No one takes it from me[a], but I lay it down of myself. I have authority to lay it down, and I have authority to take it up again[c][b]. This command I received from my Father.
translation:
  language: ru
  text: Никто не отнимает её у Меня, но Я Сам отдаю её.[a] Я имею власть[b] отдать её и имею власть снова взять её.[c] Это повеление Я получил от Моего Отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от Самого Себя»; то есть добровольно, по собственной воле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «имею право» или «имею силу». Греческое слово может обозначать как правомочие, так и реальную возможность действовать.'
    reason: lexical_alternative
  - marker: c
    text: То есть снова взять жизнь; местоимение относится к словам «Моя жизнь» в предыдущем стихе (Ин. 10:17).
    reason: cross_reference
lexical_decisions:
- source_word: αἴρει αὐτὴν ἀπ’ ἐμοῦ
  choice: отнимает её у Меня
  rationale: «Отнимать у» естественно передаёт действие, совершаемое против воли того, у кого что-либо забирают, и ясно противопоставляется добровольной самоотдаче Иисуса.
- source_word: τίθημι αὐτὴν
  choice: отдаю её
  rationale: В русском сочетание «отдать жизнь» естественнее буквального «положить жизнь» и точно передаёт устойчивый смысл выражения в данном контексте.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: Я Сам
  rationale: Так подчёркивается личная и добровольная инициатива Иисуса, но не создаётся впечатление Его независимости от Отца, поскольку далее прямо упомянуто повеление Отца.
- source_word: ἐξουσίαν ἔχω
  choice: Я властен
  rationale: Краткая русская формулировка включает право и реальную возможность действовать, сохраняя повтор исходного выражения.
- source_word: πάλιν λαβεῖν αὐτήν
  choice: вновь принять её
  rationale: «Принять» сохраняет возможный оттенок как активного обретения, так и получения жизни вновь; «вновь» непосредственно передаёт πάλιν.
- source_word: ἐντολήν
  choice: повеление
  rationale: В данном контексте речь идёт о конкретном поручении или предписании Отца; «повеление» звучит естественнее, чем «заповедь», и не ослабляет обязательной силы слова.
- source_word: παρὰ τοῦ πατρός μου
  choice: от Моего Отца
  rationale: Передаёт источник повеления и сохраняет личное обозначение отношений Иисуса с Отцом.
theological_decisions:
- issue: Добровольность смерти Иисуса и Его отношение к воле Отца
  choice: «Я Сам отдаю её»
  alternative: «отдаю её по собственной воле»
  rationale: Выбранная формулировка ясно утверждает добровольность самоотдачи, не истолковывая ἀπ’ ἐμαυτοῦ как независимость от Отца; напряжение сохраняется благодаря заключительным словам о полученном повелении.
- issue: Значение ἐξουσία применительно к смерти и возвращению жизни
  choice: «властен»
  alternative: «имею право» или «имею силу»
  rationale: «Властен» охватывает и правомочие, и действенную способность, не сводя смысл только к физической силе или юридическому праву.
- issue: Смысл πάλιν λαβεῖν αὐτήν
  choice: «вновь принять её»
  alternative: «снова взять её» или «вернуть её Себе»
  rationale: «Принять» сохраняет лексическую неоднозначность λαμβάνω и не вводит более определённую модель воскресения, чем выражено в исходном тексте.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным звучанием. Повтор «властен» сохранён ради риторического параллелизма. Прописные местоимения при обращении к Иисусу и Отцу соответствуют принятому русскому библейскому регистру.
