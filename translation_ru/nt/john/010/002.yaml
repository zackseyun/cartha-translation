  text: But the one who enters through the door is the shepherd of the sheep[a].
translation:
  language: ru
  text: А тот, кто входит через дверь, — пастух овец[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен и неопределённый смысл: «пастух овец». Греческое ποιμήν («пастух») употреблено без артикля, но контекст допускает определённое понимание: законный пастух противопоставлен тем, кто входит не через дверь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰσερχόμενος
  choice: А тот, кто входит
  rationale: Субстантивированное причастие обозначает человека, которого характеризует это действие. Оборот «тот, кто входит» естественен в современном русском языке, а δέ передано союзом «а», выражающим противопоставление вору и грабителю из предыдущего стиха.
- source_word: διὰ τῆς θύρας
  choice: через дверь
  rationale: διά с родительным падежом здесь обозначает движение через что-либо; перевод сохраняет простой пространственный образ.
- source_word: ποιμήν
  choice: пастух
  rationale: В современном русском «пастух» — естественное обозначение человека, пасущего овец. Именная часть сказуемого в русском языке не требует артикля, поэтому форма сама по себе не устраняет возможную смысловую неоднозначность между определённым и классифицирующим пониманием.
- source_word: τῶν προβάτων
  choice: овец
  rationale: Перевод непосредственно сохраняет образ овец; слово «стадо» было бы более интерпретирующим.
theological_decisions:
- issue: Определённость ποιμήν в составе именного сказуемого
  choice: пастух овец
  alternative: тот самый пастух овец / один из пастухов овец
  rationale: У ποιμήν нет артикля, однако контекст противопоставляет вошедшего законным путём незаконным пришельцам и допускает определённое понимание. Русское «пастух овец» естественно сохраняет эту неоднозначность, не усиливая текст ни до явно определённого «тот самый пастух», ни до неопределённого «один из пастухов».
translation_notes:
  register: Современный литературный русский язык с простым, достоинственным синтаксисом. «А» естественно передаёт контраст; тире оформляет составное именное сказуемое. Выбрано общеупотребительное «пастух», а не более церковно окрашенное «пастырь».
