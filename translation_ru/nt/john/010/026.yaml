  text: ἀλλὰ ὑμεῖς οὐ πιστεύετε, ⸂ὅτι οὐκ⸃ ἐστὲ ἐκ τῶν προβάτων τῶν ⸀ἐμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/026.yaml
  text: But you do not believe[a], because you are not among my sheep.
translation:
  language: ru
  text: Но вы не верите, потому что вы не из Моих овец.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но вы не верите, что вы не из Моих овец». Греческий союз может вводить не причину, а содержание того, чему они не верят.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Естественно передаёт противопоставление предыдущему описанию овец Иисуса.
- source_word: ὑμεῖς
  choice: вы
  rationale: Явно выраженное местоимение сохраняет лёгкое смысловое выделение адресатов без избыточного усиления.
- source_word: οὐ πιστεύετε
  choice: не верите
  rationale: Настоящее время и отрицание естественно передаются русским настоящим временем; «верить» соответствует характерному для Иоанна словоупотреблению.
- source_word: ὅτι
  choice: потому что
  rationale: Причинное значение наиболее естественно в данном контексте, однако возможное изъяснительное значение сохранено в примечании.
- source_word: οὐκ ἐστὲ
  choice: вы не
  rationale: В сочетании «вы не из» русская конструкция естественно передаёт отрицательную связку без искусственного добавления глагола «быть» в настоящем времени.
- source_word: ἐκ τῶν προβάτων
  choice: из … овец
  rationale: Предлог «из» сохраняет образ принадлежности к группе и ближе к греческому ἐκ, оставаясь естественным по-русски.
- source_word: τῶν ἐμῶν
  choice: Моих
  rationale: Притяжательное местоимение естественно определяет слово «овец»; прописная буква соответствует принятому благоговейному оформлению речи о Христе.
theological_decisions:
- issue: Значение ὅτι и связь между неверием и принадлежностью к овцам Иисуса
  choice: 'Причинное: «потому что вы не из Моих овец»'
  alternative: 'Изъяснительное: «не верите, что вы не из Моих овец»'
  rationale: Контекст противопоставляет овец, которые слышат голос Иисуса и следуют за Ним, Его противникам; причинное прочтение хорошо передаёт ход мысли. Поскольку греческий союз допускает также изъяснительное понимание и этот выбор богословски значим, альтернатива вынесена в примечание без разрешения более широкого доктринального спора.
translation_notes:
  register: Современный литературный русский язык; краткая, достоинственная и понятная формулировка. Образ овец и подлинная неоднозначность греческого союза сохранены.
