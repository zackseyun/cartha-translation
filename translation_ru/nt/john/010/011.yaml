  source_fidelity: 'Перевод точно передаёт греческий текст. «Я — добрый пастух» адекватно отражает Ἐγώ εἰμι ὁ ποιμὴν ὁ καλός, сохраняя выраженное местоимение без не требуемого текстом богословского усиления. «Отдаёт свою жизнь за овец» естественно передаёт идиому τὴν ψυχὴν αὐτοῦ τίθησιν ὑπὲρ τῶν προβάτων: ψυχή в данном контексте верно понята как жизнь, а «за» сохраняет широкий благотворный/представительский смысл ὑπέρ.'
