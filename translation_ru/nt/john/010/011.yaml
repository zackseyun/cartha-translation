id: JHN.10.11
reference: John 10:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ὁ ποιμὴν ὁ καλός· ὁ ποιμὴν ὁ καλὸς τὴν ψυχὴν αὐτοῦ τίθησιν ὑπὲρ τῶν προβάτων·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/011.yaml
  text: I am the good shepherd[c][b][a]. The good shepherd lays down his life for the sheep.
translation:
  language: ru
  text: Я — добрый пастух[a]. Добрый пастух отдаёт свою жизнь[b] за овец[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благородный (образцовый) пастух»; греческое слово καλός обозначает доброе, прекрасное, благородное или достойное подражания.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «полагает свою душу»; это греческое выражение означает «отдаёт свою жизнь».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ради овец», «на благо овец».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Я —
  rationale: Именная конструкция с тире естественно передаёт по-русски самоидентификацию «Я есмь / Я являюсь», а явное местоимение «Я» сохраняет акцент без архаизации.
- source_word: ποιμήν
  choice: пастух
  rationale: Прямое и понятное обозначение человека, пасущего овец; «пастырь» придало бы выражению более архаический и церковно-терминологический оттенок.
- source_word: καλός
  choice: добрый
  rationale: Сохраняет традиционное и естественное название, включая смысл нравственной доброты и образцового достоинства; возможный оттенок «благородный, превосходный» отмечен в сноске.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: свою жизнь
  rationale: В сочетании с τίθησιν речь идёт о добровольной отдаче жизни, а не отдельно о нематериальной душе. Возвратное «свою» естественно соотносит жизнь с подлежащим.
- source_word: τίθησιν
  choice: отдаёт
  rationale: Русское «отдаёт жизнь» естественно передаёт греческую идиому буквально со значением «полагает свою душу/жизнь» и её жертвенный смысл.
- source_word: ὑπὲρ
  choice: за
  rationale: В выражении «отдать жизнь за» предлог естественно сохраняет заместительный и благотворный диапазон значения ὑπέρ, не закрепляя одну теорию искупления.
- source_word: τῶν προβάτων
  choice: овец
  rationale: Существительное передано без добавления притяжательного местоимения, которого нет в греческом; русская конструкция «за овец» не требует определённого артикля.
theological_decisions:
- issue: Сила самоидентификации Ἐγώ εἰμι
  choice: «Я — добрый пастух» без архаического «есмь» и без пояснительного усиления
  alternative: «Я есмь добрый пастырь»; «Именно Я — добрый пастух»
  rationale: Здесь выражение грамматически вводит именную часть сказуемого. Формулировка сохраняет акцент на «Я», но не навязывает отдельного указания на божественное имя.
- issue: Значение καλός в титуле пастуха
  choice: «добрый пастух»
  alternative: «благородный пастух»; «образцовый пастух»
  rationale: «Добрый» точно и узнаваемо передаёт центральный смысл, а сноска сохраняет более широкий оттенок нравственного достоинства и образцовости.
- issue: Смысл ὑπὲρ τῶν προβάτων применительно к смерти Иисуса
  choice: «за овец»
  alternative: «ради овец»; «на благо овец»
  rationale: Формулировка сохраняет возможные представительский, заместительный и благотворный оттенки, не сводя текст к одной конфессиональной модели искупления.
translation_notes:
  register: Современный литературный русский язык, ясный и dignified. Выбрано общеупотребительное «пастух», чтобы сохранить конкретный образ и не вводить церковный титул «пастырь». Тире естественно оформляет русскую именную конструкцию и удерживает акцент явного Ἐγώ.
