source:
  edition: SBLGNT
  text: ὃν ὁ πατὴρ ἡγίασεν καὶ ἀπέστειλεν εἰς τὸν κόσμον ὑμεῖς λέγετε ὅτι Βλασφημεῖς, ὅτι εἶπον· Υἱὸς τοῦ θεοῦ εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/036.yaml
  text: do you say of the one whom the Father sanctified and sent into the world[a], ‘You are blaspheming,’ because I said, ‘I am the Son of God’?”
translation:
  language: ru
  text: 'Вы говорите тому, кого Отец освятил[a] и послал в мир: «Ты богохульствуешь», — потому что Я сказал: «Я — Сын Божий»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посвятил»; возможно также: «отделил для особого служения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγίασεν
  choice: освятил
  rationale: Сохраняет прямую связь ἁγιάζω со святостью и богословское напряжение текста. В данном контексте слово также может означать посвящение или отделение для особого служения, что отмечено в сноске.
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Прямой и естественный эквивалент, сохраняющий характерный для Иоанна язык посланничества и не добавляющий толкования «поручил миссию».
- source_word: εἰς τὸν κόσμον
  choice: в мир
  rationale: Обычный и контекстуально точный перевод; сохраняет богословски значимое для Евангелия от Иоанна употребление слова κόσμος.
- source_word: Βλασφημεῖς
  choice: Ты богохульствуешь
  rationale: Настоящее время передано естественной русской формой прямого обвинения; «богохульствовать» точно выражает религиозный смысл βλασφημέω в данном контексте.
- source_word: Υἱὸς τοῦ θεοῦ
  choice: Сын Божий
  rationale: Устоявшееся и естественное русское наименование, сохраняющее христологическую значимость выражения без добавления последующих догматических формулировок.
- source_word: ὃν ὁ πατὴρ
  choice: Тому, Кого Отец
  rationale: Дательный «Тому» обусловлен русским управлением глагола «говорить»; конструкция ясно сохраняет относительное придаточное и его отнесённость к Иисусу.
- source_word: ὅτι ... ὅτι
  choice: говорите ... потому что Я сказал
  rationale: Первое ὅτι передаётся через прямую речь без отдельного союза, а второе — причинным «потому что», что естественно выражает основание обвинения.
theological_decisions:
- issue: Значение ἡγίασεν применительно к Сыну
  choice: освятил
  alternative: посвятил; отделил для особого служения
  rationale: Основной текст сохраняет формальное значение и связь со святостью, не истолковывая действие как нравственное исправление Сына. Возможный миссионный оттенок посвящения или отделения указан в сноске.
- issue: Христологическая сила выражения Υἱὸς τοῦ θεοῦ
  choice: Сын Божий
  alternative: Божий Сын
  rationale: «Сын Божий» — естественная титульная форма в русском языке; она сохраняет вес выражения в контексте обвинения в богохульстве, не внося в стих формулировок позднейшей догматики.
translation_notes:
  register: Современный литературный русский язык, торжественный, но понятный. Начальное «неужели» естественно передаёт вопросительный вызов конструкции ὑμεῖς λέγετε; местоимения в прямой речи оформлены по традиционной русской библейской орфографии. Синтаксис сохраняет противопоставление между действием Отца и обвинением собеседников.
