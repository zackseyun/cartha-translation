  text: ὁ πατήρ μου ⸀ὃ δέδωκέν ⸀μοι ⸂πάντων μεῖζων⸃ ἐστίν, καὶ οὐδεὶς δύναται ἁρπάζειν ἐκ τῆς χειρὸς τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/029.yaml
  text: My Father[a], who has given them to me, is greater than all, and no one is able to snatch them out of the Father's hand.
translation:
  language: ru
  text: Отец Мой[a], Который дал их Мне, больше всех, и никто не может вырвать их из руки Отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Отец Мой — то, что Он дал Мне, — больше всех». Греческая формулировка здесь трудна; некоторые понимают так, что с остальными сравнивается сам дар, а не Отец.'
    reason: Альтернативное понимание трудной греческой конструкции и рукописной вариативности.
lexical_decisions:
- source_word: ὁ πατήρ μου
  choice: Отец Мой
  rationale: Естественная и традиционно возвышенная русская передача притяжательного оборота, сохраняющая отношение Иисуса к Богу как к Отцу без дополнительных толкований.
- source_word: ὃ δέδωκέν μοι
  choice: Который дал их Мне
  rationale: Форма среднего рода ὃ и синтаксис трудны, однако в контексте речь идёт об овцах из стихов 27–28. Личное местоимение «их» делает контекстуальный референт ясным; совершенный вид «дал» естественно передаёт состоявшийся дар с сохраняющимся результатом. Буквально-синтаксическая альтернатива вынесена в примечание.
- source_word: πάντων μεῖζων
  choice: больше всех
  rationale: Сохраняет широкий объём сравнения, не уточняя без основания, имеются ли в виду все лица или всё сущее.
- source_word: οὐδεὶς δύναται
  choice: никто не может
  rationale: Современная и точная русская передача прямого значения способности или возможности.
- source_word: ἁρπάζειν
  choice: вырвать
  rationale: Передаёт насильственное изъятие и естественно сочетается с образом руки; также сохраняет связь с предыдущим стихом.
- source_word: ἐκ τῆς χειρὸς τοῦ πατρός
  choice: из руки Отца
  rationale: Предлог «из» точно отражает ἐκ, а образ руки сохраняет значение власти, обладания и защиты.
theological_decisions:
- issue: Текстологическая и синтаксическая трудность ὃ δέδωκέν μοι
  choice: 'Основной текст соотносит относительное предложение с Отцом и явно обозначает овец местоимением «их»: «Который дал их Мне».'
  alternative: '«То, что дал Мне Отец Мой, больше всего» или более буквально: «Отец Мой — то, что Он дал Мне, — больше всех».'
  rationale: Греческая конструкция трудна, а рукописная традиция расходится. Контекст поддерживает понимание овец как данных Сыну людей, но средний род относительного местоимения допускает понимание самого дара как подлежащего сравнения. Поэтому контекстуально ясная передача дана в тексте, а подлинная неоднозначность сохранена в примечании.
- issue: Объём сравнения в πάντων μεῖζων
  choice: «больше всех» без уточнения категории сравниваемых
  alternative: «больше всего» или «превыше всех и всего»
  rationale: Греческое πάντων допускает широкий охват. Перевод не сужает его до людей и не расширяет пояснительной вставкой до формулы «всех и всего».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Прописные буквы в «Мой», «Который», «Мне» следуют принятой русской практике почтительного обозначения Бога и Христа. Формулировка остаётся понятной обычному читателю и не вводит конфессиональных уточнений.
