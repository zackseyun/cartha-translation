base_translation:
  language: en
  yaml_path: translation/nt/john/010/039.yaml
  text: So they were seeking again to seize him[a], but he escaped from their hand.
translation:
  language: ru
  text: Итак, они снова пытались схватить Его, но Он ускользнул из их рук[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вышел из их руки»; это выражение означает, что Он освободился от их власти или захвата.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: попытались
  rationale: Имперфект в сочетании с инфинитивом передаёт продолжавшуюся или безуспешную попытку; по-русски «попытались схватить» естественно выражает эту ситуацию.
- source_word: οὖν
  choice: тогда
  rationale: Передаёт развитие повествования и следствие предшествующего обмена репликами без излишне формального «итак» или «поэтому».
- source_word: πάλιν
  choice: снова
  rationale: Прямо передаёт повторность действия.
- source_word: πιάσαι
  choice: схватить
  rationale: Сохраняет физический и враждебный оттенок πιάζω, не добавляя формально-правового значения «арестовать».
- source_word: ἐξῆλθεν
  choice: ускользнул
  rationale: В сочетании с идиомой «из их руки» глагол описывает выход из-под власти или захвата; «ускользнул» естественно передаёт результат по-русски, хотя несколько явнее выражает подразумеваемое избавление.
- source_word: ἐκ τῆς χειρὸς αὐτῶν
  choice: из их рук
  rationale: Русское множественное число является естественным эквивалентом греческого идиоматического единственного числа и обозначает освобождение из-под захвата или власти.
theological_decisions:
- issue: Следует ли явно передавать избавление Иисуса как бегство или сохранять буквальное «вышел из их руки»
  choice: Он ускользнул из их рук
  alternative: Он вышел из их руки
  rationale: Греческий текст буквально использует «вышел из их руки», но это идиома выхода из-под власти или захвата. Русское «ускользнул из их рук» сохраняет образ и ясно передаёт исход, не уточняя способ избавления.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Заглавное «Его/Он» применено как традиционная русская форма почтительного обозначения Иисуса. Маркер сноски поставлен после всего выражения, которое она поясняет.
