lexical_decisions:
- source_word: Ἐγένετο
  choice: отмечали
  rationale: 'В сочетании с названием праздника передаёт событийное значение глагола γίνομαι естественным современным русским языком: праздник проходил, его отмечали.'
- source_word: τότε
  choice: В то время
  rationale: Сохраняет временной переход, выраженный τότε, и естественно звучит в повествовании.
- source_word: τὰ ἐγκαίνια
  choice: праздник Обновления
  rationale: Передаёт значение греческого названия праздника обновления и повторного освящения храма, не заменяя его общеупотребительным позднейшим названием «Ханука».
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: в Иерусалиме
  rationale: Естественная русская передача обозначения места.
- source_word: χειμὼν ἦν
  choice: Была зима
  rationale: Прямая и краткая передача простой описательной фразы; сохраняет самостоятельность этой атмосферной и временной детали.
theological_decisions:
- issue: Определение τὰ ἐγκαίνια
  choice: 'В основном тексте: «праздник Обновления»'
  alternative: «Ханука»; «праздник Освящения»
  rationale: Перевод греческого термина сохраняет первичность исходного текста и указывает на обновление и повторное освящение храма. Знакомое современному читателю название «Ханука» дано в примечании, не подменяя собой формулировку оригинала.
translation_notes:
  register: Современный литературный русский язык; изложение краткое, ясное и dignified. Название «Обновление» написано с прописной буквы как собственное название праздника.
