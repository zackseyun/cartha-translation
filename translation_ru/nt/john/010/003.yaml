source:
  edition: SBLGNT
  text: τούτῳ ὁ θυρωρὸς ἀνοίγει, καὶ τὰ πρόβατα τῆς φωνῆς αὐτοῦ ἀκούει καὶ τὰ ἴδια πρόβατα ⸀φωνεῖ κατ’ ὄνομα καὶ ἐξάγει αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/003.yaml
  text: To him the gatekeeper opens[a], and the sheep hear his voice, and he calls his own sheep by name and leads them out.
translation:
  language: ru
  text: Ему привратник открывает, и овцы слышат его голос; он зовёт своих овец по имени и выводит их.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведёт их наружу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ
  choice: Ему
  rationale: Дательный падеж указывает на пастуха из предыдущего стиха; «ему» естественно передаёт личную отсылку без лишнего истолкования.
- source_word: ὁ θυρωρός
  choice: привратник
  rationale: Обозначает человека, охраняющего вход и открывающего его; слово уместно для входа в овечий загон и сохраняет достоинство стиля.
- source_word: ἀνοίγει
  choice: открывает
  rationale: Прямое и естественное соответствие форме настоящего времени.
- source_word: τὰ πρόβατα
  choice: овцы
  rationale: Обычное обозначение овец в пастушеском образе; определённость в русском языке ясна из контекста.
- source_word: τῆς φωνῆς αὐτοῦ ἀκούει
  choice: слышат его голос
  rationale: 'Хотя при среднем роде множественного числа в греческом стоит глагол в единственном числе, по-русски требуется множественное: «овцы слышат». Формулировка сохраняет буквальный и relational смысл образа.'
- source_word: τὰ ἴδια πρόβατα
  choice: своих овец
  rationale: Возвратное притяжательное местоимение естественно выражает принадлежность овец действующему лицу и передаёт акцент ἴδια.
- source_word: φωνεῖ κατ’ ὄνομα
  choice: зовёт … по имени
  rationale: Передаёт личный, индивидуальный зов каждой овцы и естественно звучит по-русски.
- source_word: ἐξάγει αὐτά
  choice: выводит их
  rationale: ἐξάγω допускает значения «выводить» и «вести наружу»; «выводит» кратко и точно передаёт направленное движение из загона, не уточняя сверх текста способ ведения.
theological_decisions:
- issue: Пастушеский образ и действующее лицо
  choice: Действия отнесены к пастуху без прямого называния Иисуса в самом стихе.
  alternative: Явно назвать действующее лицо Иисусом или истолковать отдельные элементы образа.
  rationale: Греческий текст продолжает метафору предыдущего стиха и использует местоимение; перевод не должен преждевременно раскрывать её богословское значение.
- issue: Оттенок ἐξάγει
  choice: «выводит их»
  alternative: «ведёт их наружу»
  rationale: Оба значения возможны; основной текст сохраняет обычный русский глагол движения изнутри наружу, а примечание отмечает альтернативу с более явным акцентом на ведении.
translation_notes:
  register: Современный литературный русский язык; фраза ясная, сдержанная и образная. Точка с запятой разграничивает реакцию овец и последующие действия пастуха. Маркер примечания поставлен после соответствующей фразы.
