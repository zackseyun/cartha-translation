  text: πάντες ὅσοι ἦλθον ⸂πρὸ ἐμοῦ⸃ κλέπται εἰσὶν καὶ λῃσταί· ἀλλ’ οὐκ ἤκουσαν αὐτῶν τὰ πρόβατα.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/008.yaml
  text: All who came before me are thieves and robbers[a], but the sheep did not listen to them.
translation:
  language: ru
  text: Все, кто пришёл прежде Меня, — воры и разбойники[a], но овцы их не слушали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «впереди Меня». Выражение может означать как временное предшествование («прежде Меня»), так и выступление вперёд с притязанием на власть независимо от Иисуса. Судя по контексту, речь идёт о ложных пастырях, а не обо всех прежних служителях Бога.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες ὅσοι
  choice: Все, кто
  rationale: Естественная русская конструкция, сохраняющая обобщающий и распределительный смысл греческого выражения.
- source_word: ἦλθον
  choice: приходил
  rationale: Прошедшее время передаёт греческий аорист; единственное число согласуется в русском с относительным местоимением «кто» при обобщающем «все».
- source_word: πρὸ ἐμοῦ
  choice: прежде Меня
  rationale: Передаёт прежде всего временной смысл, оставаясь достаточно открытым для оттенка предшествования; неоднозначность пояснена в сноске.
- source_word: κλέπται
  choice: воры
  rationale: Обычный и точный эквивалент, соответствующий образу незаконного присвоения в контексте.
- source_word: λῃσταί
  choice: разбойники
  rationale: Сохраняет отличие от «воров» и более сильный, насильственный оттенок λῃστής.
- source_word: ἀλλ’
  choice: но
  rationale: Естественно передаёт простое противительное значение союза.
- source_word: οὐκ ἤκουσαν αὐτῶν
  choice: их не слушали
  rationale: В контексте овец и голоса речь идёт не только о физическом слышании, но и о признании голоса и отклике на него.
- source_word: τὰ πρόβατα
  choice: овцы
  rationale: Стандартное и естественное обозначение в пастырском образе; определённость ясна из контекста.
theological_decisions:
- issue: Объём выражения «все, кто приходил прежде Меня»
  choice: Сохранить широкую формулировку исходного текста, не вводя ограничение непосредственно в стих.
  alternative: «Все, кто приходил впереди Меня», либо явное уточнение о самозваных пастырях и претендентах на власть.
  rationale: Форма греческого текста широка, однако контекст не требует понимать её как осуждение всех прежних посланников Бога. Перевод сохраняет напряжение, а контекстуальное уточнение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественно-сдержанная. Местоимение «Меня» написано с прописной буквы согласно распространённой русской библейской издательской традиции.
