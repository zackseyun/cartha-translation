  source_fidelity: 'Перевод точно передаёт все основные элементы греческого текста: καθὼς — «как», взаимное γινώσκειν — «Отец знает Меня, и Я знаю Отца», τὴν ψυχήν μου τίθημι — «отдаю жизнь Мою», ὑπὲρ τῶν προβάτων — «за овец». Настоящее время «отдаю» соответствует τίθημι и в данном контексте естественно обозначает добровольное самоотдание. «Как» корректно сохраняет связь с предыдущим высказыванием о взаимном знании пастыря и овец, не навязывая иной синтаксической связи.'
