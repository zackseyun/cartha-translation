source:
  edition: SBLGNT
  text: καθὼς γινώσκει με ὁ πατὴρ κἀγὼ γινώσκω τὸν πατέρα, καὶ τὴν ψυχήν μου τίθημι ὑπὲρ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/015.yaml
  text: just as the Father knows me and I know the Father[b][a], and I lay down my life for the sheep.
translation:
  language: ru
  text: как Отец знает Меня, и Я знаю Отца; и Я отдаю жизнь Мою за овец.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «душу Мою»; здесь это слово означает «жизнь» в контексте самопожертвования.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ради овец». Греческий предлог может выражать действие в пользу кого-либо, а также иметь представительский или жертвенный оттенок.'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: как
  rationale: Вводит сравнение с предшествующим высказыванием о взаимном знании пастыря и овец; в данном продолжающемся предложении естественное русское «как» сохраняет связь без избыточного усиления.
- source_word: γινώσκει / γινώσκω
  choice: знает / знаю
  rationale: Сохраняет единый греческий глагол и его глубокий личностно-реляционный смысл, не превращая перевод в толкование.
- source_word: ὁ πατὴρ / τὸν πατέρα
  choice: Отец / Отца
  rationale: Передаёт определённую форму и характерное для Иоанна именование; прописная буква уместна как обозначение Бога Отца.
- source_word: κἀγὼ
  choice: и Я
  rationale: Передаёт слияние καί + ἐγώ и сохраняет симметрию двух частей высказывания.
- source_word: τὴν ψυχήν μου
  choice: жизнь Мою
  rationale: В контексте добровольной смерти ψυχή означает жизнь; порядок слов сохраняет торжественный, но понятный библейский регистр.
- source_word: τίθημι
  choice: отдаю
  rationale: Русское «отдавать жизнь» естественно передаёт идиому τίθημι τὴν ψυχήν и подчёркивает добровольность, не требуя буквального и менее ясного «полагаю».
- source_word: ὑπὲρ
  choice: за
  rationale: В сочетании «отдать жизнь за» естественно выражает действие ради и в пользу овец, сохраняя возможную жертвенную и заместительную силу предлога без догматического сужения.
- source_word: τῶν προβάτων
  choice: овец
  rationale: Сохраняет центральный образ овец, а не заменяет его собирательным «стадо».
theological_decisions:
- issue: Сила ὑπὲρ в самопожертвовании Иисуса
  choice: «за овец»
  alternative: «ради овец»; «вместо овец»
  rationale: «За» в русском сочетании «отдать жизнь за» охватывает пользу, представительство и жертвенную направленность, не ограничивая греческий предлог одной технической формулой.
- issue: Значение ψυχή в данном контексте
  choice: «жизнь»
  alternative: «душу»
  rationale: Речь идёт о добровольной смерти доброго пастыря, поэтому «жизнь» точно передаёт контекстуальное значение и не создаёт ошибочного впечатления, будто имеется в виду только нематериальная часть человека.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Прописные местоимения в отношении Иисуса и наименование «Отец» следуют принятому русскому религиозному регистру. Точка с запятой помогает сохранить структуру греческого предложения и связь с предшествующим стихом.
