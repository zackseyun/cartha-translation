  yaml_path: translation/nt/john/010/007.yaml
  text: So Jesus said to them again[a], “Truly, truly, I say to you, I am the door for the sheep.”
translation:
  language: ru
  text: 'Итак, Иисус снова сказал им: «Истинно, истинно говорю вам: Я — дверь[a] для овец».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ворота для овец». Греческое слово θύρα может означать как дверь, так и ворота, в том числе в пастушеском образе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Итак
  rationale: Передаёт логическое и повествовательное продолжение предыдущего разговора, не сводя связь только к временной последовательности.
- source_word: πάλιν
  choice: снова
  rationale: Естественно и прямо обозначает повторное обращение Иисуса.
- source_word: Ἀμὴν ἀμὴν
  choice: Истинно, истинно
  rationale: Сохраняет характерный для Иоанна повтор и торжественную убедительность формулы, оставаясь понятным современному читателю.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Близко передаёт греческую формулу речи и сохраняет её возвышенный, но естественный ритм.
- source_word: ὅτι
  choice: не выражено отдельным словом
  rationale: После формулы «говорю вам» русский язык естественно вводит содержание высказывания двоеточием; смысл союза полностью представлен синтаксисом.
- source_word: ἐγώ εἰμι
  choice: Я —
  rationale: Личное местоимение сохраняет подчёркнутое самоотождествление, а тире естественно оформляет именное сказуемое в русском языке.
- source_word: θύρα
  choice: дверь
  rationale: Основное и прямое соответствие греческому слову; контекстуально возможный вариант «ворота» указан в сноске.
- source_word: τῶν προβάτων
  choice: для овец
  rationale: Естественно по-русски выражает связь входа с овцами в образе овчарни, не разворачивая метафору в богословское пояснение.
theological_decisions:
- issue: Метафорическое самоотождествление Иисуса
  choice: Я — дверь для овец
  alternative: Я — дверь овец / Я — ворота для овец
  rationale: Перевод сохраняет метафору точки входа и доступа, не добавляя толкования об исключительности, спасении или овчарне сверх прямо сказанного в стихе.
- issue: Значение родительного τῶν προβάτων
  choice: для овец
  alternative: овец
  rationale: Греческий родительный допускает ассоциативную связь, точный характер которой не выражен явно. Русское «для овец» передаёт образ естественно, хотя несколько яснее обозначает назначение; более формальное «дверь овец» по-русски двусмысленно и неестественно.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной формулы «Истинно, истинно говорю вам». Порядок слов естественный, метафора не разъясняется внутри текста. Маркер сноски помещён после всего предложения.
