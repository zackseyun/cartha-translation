  text: εἰ δὲ ποιῶ, κἂν ἐμοὶ μὴ πιστεύητε τοῖς ἔργοις ⸀πιστεύετε, ἵνα γνῶτε καὶ ⸀γινώσκητε ὅτι ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν ⸂τῷ πατρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/038.yaml
  text: But if I do them[a], even if you do not believe me, believe the works, so that you may know and continue to know that the Father is in me[c][b], and I am in the Father.
translation:
  language: ru
  text: Но если Я совершаю их, то, даже если Мне не верите[a], верьте делам, чтобы вы узнали и впредь знали[b], что Отец — во Мне и Я — в Отце.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не верите в Меня». Греческая конструкция допускает оба значения; в данном контексте «Мне не верите» лучше подчёркивает противопоставление: верьте хотя бы свидетельству дел.'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте употреблены две формы глагола «знать»; вероятно, речь идёт сначала об обретении знания, а затем о дальнейшем, устойчивом знании.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῶ
  choice: совершаю их
  rationale: Настоящее время передаёт совершаемые Иисусом дела; местоимение «их» естественно восполняет подразумеваемый объект из ближайшего контекста.
- source_word: κἂν ἐμοὶ μὴ πιστεύητε
  choice: даже если Мне не верите
  rationale: Конструкция πιστεύω с дательным ἐμοί допускает значения «верить Мне» и «верить в Меня». Здесь «Мне не верите» яснее сохраняет противопоставление последующему призыву верить делам.
- source_word: τοῖς ἔργοις πιστεύετε
  choice: верьте делам
  rationale: 'Формулировка сохраняет компактность греческого текста: дела выступают свидетельством, которому следует поверить, а не самостоятельным объектом религиозной веры.'
- source_word: ἔργοις
  choice: делам
  rationale: «Дела» сохраняет характерную для Иоанна лексику ἔργα и не подменяет её более истолковывающим словом «знамения».
- source_word: ἵνα γνῶτε καὶ γινώσκητε
  choice: чтобы вы узнали и продолжали знать
  rationale: 'Так передано различие между аористом γνῶτε и настоящим временем γινώσκητε: обретение знания и его дальнейшее устойчивое сохранение.'
- source_word: ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν τῷ πατρί
  choice: Отец — во Мне и Я — в Отце
  rationale: Прямое «в/во» сохраняет взаимность выражения и его богословскую напряжённость без поясняющей перефразировки.
- source_word: πατήρ
  choice: Отец
  rationale: Артикулированное ὁ πατήρ передано как «Отец», без добавления отсутствующего в греческом притяжательного местоимения.
theological_decisions:
- issue: Взаимное пребывание Отца и Сына
  choice: Сохранено буквальное реляционное выражение «Отец — во Мне и Я — в Отце».
  alternative: «Отец един со Мной, и Я един с Отцом» или «Отец пребывает во Мне, и Я пребываю в Отце».
  rationale: Буквальная формулировка передаёт сильное христологическое утверждение Иоанна, не вводя в перевод более позднюю догматическую терминологию и не сводя образ к одному толкованию.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сохранён достаточно близко к греческому, но сформулирован естественно; прописные местоимения при обращении ко Христу соответствуют принятой русской библейской традиции.
