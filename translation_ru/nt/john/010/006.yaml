  verdict: revise
  source_fidelity: Греч. παροιμία обозначает образное, иносказательное высказывание и в Иоанна не обязательно является «притчей» в более привычном синоптическом смысле παραβολή. Глагол εἶπεν — «сказал», а не «рассказал»; последнее вместе с «притчей» неоправданно сужает и повествовательно переоформляет исходное выражение. «Не поняли, что́ Он говорил им» точно передаёт οὐκ ἔγνωσαν τίνα ἦν ἃ ἐλάλει αὐτοῖς.
  naturalness: «Иисус сказал им это иносказание» литературно, понятно и достаточно естественно для библейского регистра. Слово «иносказание» не является разговорным, но уместно в современном литературном переводе и избегает ложного жанрового сужения. Ударное «что́» помогает читателю отличить союзное слово от союза.
  terminology: «Иносказание» — основной вариант для παροιμίαν; сноска сохраняет допустимые альтернативы «притча», «образная речь» и «изречение». Имя «Иисус» и уважительное «Он» сохранены. Сноска привязана к слову, которое она поясняет.
  issues:
