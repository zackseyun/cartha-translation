  text: ταύτην τὴν παροιμίαν εἶπεν αὐτοῖς ὁ Ἰησοῦς· ἐκεῖνοι δὲ οὐκ ἔγνωσαν τίνα ⸀ἦν ἃ ἐλάλει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/006.yaml
  text: Jesus spoke this figure of speech to them[a], but they did not understand what he was saying to them.
translation:
  language: ru
  text: Иисус сказал им это иносказание[a], но они не поняли, что́ Он говорил им.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «притча», «образная речь» или «изречение». Греческое слово имеет широкий смысл и может обозначать образное, не буквальное высказывание; здесь оно относится к сказанному Иисусом о пастухе и овцах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαν
  choice: притчу
  rationale: В данном контексте слово обозначает образную, иносказательную речь Иисуса о пастухе и овцах. «Притча» естественно и понятно по-русски, однако сноска сохраняет более широкий смысл греческого слова и не приравнивает его безоговорочно к παραβολή.
- source_word: εἶπεν
  choice: рассказал
  rationale: Сочетание «рассказал притчу» естественно для современного русского языка и передаёт речевое действие, хотя буквально глагол означает «сказал».
- source_word: ἐκεῖνοι δὲ
  choice: но они
  rationale: Передаёт противопоставление между речью Иисуса и реакцией слушателей без неестественного усиления указательного местоимения.
- source_word: οὐκ ἔγνωσαν
  choice: не поняли
  rationale: В контексте речь идёт не об отсутствии знания, а о неспособности постичь смысл образной речи.
- source_word: τίνα ἦν ἃ ἐλάλει αὐτοῖς
  choice: о чём Он им говорил
  rationale: Естественно передаёт смысл несколько неловкой греческой конструкции — слушатели не поняли содержания и смысла сказанного им — без добавления явного «что Он имел в виду».
theological_decisions:
- issue: Жанровое обозначение речи Иисуса
  choice: притча со сноской о широком значении
  alternative: иносказание / образная речь / пословица
  rationale: Выбор не утверждает техническое тождество с синоптическими притчами; широкий диапазон παροιμία сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык; фраза ясная и естественная, с уважительным традиционным написанием местоимения «Он» применительно к Иисусу. Подлинная широта значения παροιμία отмечена в сноске.
