    issue: «Рассказал им эту притчу»
    rationale: εἶπεν означает «сказал», а παροιμίαν имеет более широкий смысл, чем «притча». Сочетание «рассказал ... притчу» дважды сужает характеристику речи Иисуса и может создать неуместную ассоциацию с техническим жанром синоптической притчи.
  - severity: low
    issue: В сноске «образный рассказ»
    rationale: «Образный рассказ» предполагает повествовательную форму, которой греческое παροιμία само по себе не требует. «Образная речь» точнее и шире.
