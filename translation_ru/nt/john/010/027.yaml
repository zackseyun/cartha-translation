  text: τὰ πρόβατα τὰ ἐμὰ τῆς φωνῆς μου ⸀ἀκούουσιν, κἀγὼ γινώσκω αὐτά, καὶ ἀκολουθοῦσίν μοι,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/027.yaml
  text: My sheep hear my voice, and I know them, and they follow me.
translation:
  language: ru
  text: Мои овцы слышат Мой голос; Я знаю их, и они следуют за Мной.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πρόβατα τὰ ἐμὰ
  choice: Мои овцы
  rationale: Естественно передаёт образ овец и выраженную артиклем с притяжательным местоимением принадлежность; более тяжёлое «овцы, принадлежащие Мне» здесь не требуется.
- source_word: τῆς φωνῆς μου ἀκούουσιν
  choice: слышат Мой голос
  rationale: Сохраняет прямое значение ἀκούω и личный характер φωνή в образе пастуха; настоящее время обозначает постоянное, характерное действие.
- source_word: κἀγὼ γινώσκω αὐτά
  choice: Я знаю их
  rationale: Передаёт καί + ἐγώ без избыточного усиления, а γινώσκω — без поясняющего расширения, сохраняя возможную глубину личных отношений.
- source_word: ἀκολουθοῦσίν μοι
  choice: они следуют за Мной
  rationale: Естественный русский эквивалент конструкции с дательным падежом; настоящее время передано как постоянное, характерное действие.
theological_decisions:
- issue: Оттенок γινώσκω в образе пастуха и овец
  choice: «знаю» без смыслового расширения
  alternative: «знаю лично» или «узнаю»
  rationale: «Знаю» сохраняет заложенную в контексте глубину отношений, но не сужает и не разъясняет её сверх сказанного в греческом тексте.
translation_notes:
  register: Современный литературный русский язык; краткий, ясный и достойный синтаксис. Прописные буквы в местоимениях «Мой», «Мной» употреблены как традиционный русский способ почтительного указания на Христа, без изменения смысла исходного текста.
