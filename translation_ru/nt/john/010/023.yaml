lexical_decisions:
- source_word: περιεπάτει
  choice: ходил
  rationale: Имперфект передаёт продолжавшееся в прошлом действие; русское «ходил» в данном контексте естественно выражает его длительность.
- source_word: ἱερῷ
  choice: по территории храма
  rationale: ἱερόν обозначает весь храмовый комплекс, а не только внутреннее святилище; формулировка ясно указывает на доступную внешнюю территорию.
- source_word: στοᾷ
  choice: в портике
  rationale: στοά — крытая галерея с колоннами; «портик» является точным и уместным архитектурным термином.
- source_word: τοῦ Σολομῶνος
  choice: Соломона
  rationale: Генитив естественно передан русским родительным падежом в составе названия места.
- source_word: καὶ
  choice: не выражено отдельным словом
  rationale: В русском начале предложения союз «и» без более широкого контекста звучит менее естественно; повествовательная связь сохраняется последовательностью текста.
