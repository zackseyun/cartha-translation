id: JHN.10.20
reference: John 10:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἔλεγον δὲ πολλοὶ ἐξ αὐτῶν· Δαιμόνιον ἔχει καὶ μαίνεται· τί αὐτοῦ ἀκούετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/020.yaml
  text: But many of them were saying[a], “He has a demon and is insane. Why do you listen to him?”
translation:
  language: ru
  text: 'Но многие из них говорили: «В Нём бес, и Он безумствует. Зачем вы Его слушаете?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: говорили
  rationale: Форма имперфекта обозначает продолжающуюся или повторявшуюся речь; русское несовершенное «говорили» естественно передаёт этот аспект.
- source_word: δὲ
  choice: Но
  rationale: Союз выражает контраст с иной реакцией присутствующих в ближайшем контексте.
- source_word: πολλοὶ ἐξ αὐτῶν
  choice: многие из них
  rationale: 'Естественно и точно передаёт партитивное выражение: так говорила значительная часть группы, но не обязательно все.'
- source_word: Δαιμόνιον ἔχει
  choice: В Нём бес
  rationale: Прямо передаёт обвинение в наличии демона, не заменяя его более интерпретирующим выражением «одержим бесом».
- source_word: μαίνεται
  choice: безумствует
  rationale: Передаёт состояние и поведение человека, которого обвиняют в безумии, сохраняя глагольную форму греческого текста и избегая современного клинического диагноза.
- source_word: τί αὐτοῦ ἀκούετε;
  choice: Зачем вы Его слушаете?
  rationale: В данном вопросе τί имеет значение «зачем/почему», а ἀκούω с родительным падежом здесь естественно означает «слушать»; «зачем» хорошо передаёт призыв прекратить слушать.
theological_decisions:
- issue: Передача враждебного обвинения против Иисуса
  choice: «В Нём бес, и Он безумствует»
  alternative: «Он одержим бесом и безумен»
  rationale: Выбранный вариант близок к структуре и лексике греческого текста, ясно представляет слова противников как клеветническое обвинение и не вводит дополнительного учения о природе одержимости.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Бес» сохраняет привычную библейскую лексику; «безумствует» понятно современному читателю и не звучит как медицинская квалификация. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской практикой.
