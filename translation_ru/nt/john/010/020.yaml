  source_fidelity: 'Текст точно передаёт греческий оригинал: имперфект ἔλεγον отражён формой «говорили», партитивное πολλοὶ ἐξ αὐτῶν — «многие из них», а резкое обвинение Δαιμόνιον ἔχει καὶ μαίνεται сохранено без смягчения. Вопрос τί αὐτοῦ ἀκούετε? естественно передан как «Зачем вы Его слушаете?»'
  naturalness: Фраза звучит по-русски естественно в современном литературном библейском регистре. Оборот «В Нём бес» несколько возвышенно-библейский, но понятен, идиоматичен в данном жанре и удачно сохраняет прямоту обвинения. «Безумствует» передаёт именно приписываемое Иисусу поведение/состояние, а не навязывает клинический диагноз.
  terminology: «Бес» является уместным традиционным русским библейским соответствием δαιμόνιον. Формулировка не утверждает обвинение рассказчика, а передаёт слова противников. Написание местоимений с прописной буквы последовательно соответствует заявленной редакционной практике.
