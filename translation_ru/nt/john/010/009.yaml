  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ θύρα· δι’ ἐμοῦ ἐάν τις εἰσέλθῃ σωθήσεται καὶ εἰσελεύσεται καὶ ἐξελεύσεται καὶ νομὴν εὑρήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/009.yaml
  text: I am the door. If anyone enters through me[a], he will be saved, and will go in and go out and find pasture.
translation:
  language: ru
  text: Я — дверь[a]. Если кто войдёт через Меня, тот будет спасён, будет входить и выходить и найдёт пастбище.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ворота». Греческое слово может обозначать дверь или ворота; в основном тексте сохранено более прямое соответствие «дверь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: дверь
  rationale: Основное значение слова — «дверь», «вход». Этот вариант прямо передаёт метафору Иисуса; уместное в пастушеском контексте «ворота» указано в сноске.
- source_word: δι’ ἐμοῦ
  choice: через Меня
  rationale: διά с родительным падежом обозначает средство или посредство; «через Меня» естественно и точно показывает, что вход возможен посредством Иисуса.
- source_word: ἐάν τις εἰσέλθῃ
  choice: если кто войдёт
  rationale: Конструкция выражает общее открытое условие. «Если кто» сохраняет неопределённость τις и звучит кратко и достойно в русском библейском повествовании.
- source_word: σωθήσεται
  choice: будет спасён
  rationale: Страдательная форма сохраняет как широкий богословский смысл спасения, так и образ безопасности стада, не сводя высказывание лишь к физическому избавлению.
- source_word: εἰσελεύσεται καὶ ἐξελεύσεται
  choice: будет входить и выходить
  rationale: Парная формула передана естественно по-русски и сохраняет образ свободного движения, не добавляя толкования о его значении.
- source_word: νομὴν
  choice: пастбище
  rationale: В контексте образа овец слово обозначает место выпаса или корм; «пастбище» — ясный и современный русский эквивалент.
- source_word: εὑρήσει
  choice: найдёт
  rationale: Прямой эквивалент εὑρίσκω сохраняет простоту исходного утверждения.
theological_decisions:
- issue: Метафорический смысл θύρα в контексте пастушества
  choice: дверь
  alternative: ворота
  rationale: «Дверь» наиболее непосредственно передаёт греческое слово и сохраняет форму иоанновского высказывания «Я — дверь». «Ворота» контекстуально возможно, поэтому отмечено в сноске, но не внесено в основной текст.
- issue: Объём значения σωθήσεται
  choice: будет спасён
  alternative: будет избавлен; окажется в безопасности
  rationale: Перевод «будет спасён» удерживает богословскую широту выражения и одновременно допускает пастушеский образ защиты, не ограничивая смысл одним из этих аспектов.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным библейским звучанием. Конструкция «если кто» немного возвышенна, но общеупотребительна и точно сохраняет открытый, неопределённый охват греческого τις. Заглавное «Меня» следует принятой русской практике почтительного обозначения Иисуса.
