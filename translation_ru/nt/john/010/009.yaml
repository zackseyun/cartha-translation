  source_fidelity: 'Перевод точно передаёт все основные элементы греческого текста: emphатическое «Я — дверь», условие общего характера («Если кто войдёт через Меня»), будущее страдательное «будет спасён», парную формулу «будет входить и выходить» и «найдёт пастбище». Различие между аористным «войдёт» в условии и последующими будущими формами удачно сохранено. Добавленное «тот» служит естественной русской корреляцией и не меняет смысла.'
