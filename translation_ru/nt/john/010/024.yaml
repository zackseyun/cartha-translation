base_translation:
  language: en
  yaml_path: translation/nt/john/010/024.yaml
  text: So the Jews surrounded him and were saying to him[a], “How long will you keep us in suspense? If you are the Messiah[b], tell us plainly.”
translation:
  language: ru
  text: 'Тогда иудеи[b] окружили Его и говорили Ему: «Долго ещё Ты будешь держать нас в неизвестности?[a] Если Ты — Мессия, скажи нам прямо».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Доколе Ты поднимаешь нашу душу?» Это выражение означает держать кого-либо в неопределённости или напряжённом ожидании.'
    reason: lexical_alternative
  - marker: b
    text: В Евангелии от Иоанна слово «иудеи» в некоторых контекстах обозначает не весь еврейский народ, а более узкий круг иудейских властей или противников Иисуса.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκύκλωσαν
  choice: окружили
  rationale: Передаёт буквальное значение глагола и возможный оттенок напряжённого, настойчивого сближения.
- source_word: οὖν
  choice: тогда
  rationale: Естественно обозначает развитие повествования; в данном контексте не навязывает более сильной логической причинности.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Сохраняет формально широкое обозначение греческого текста, не подменяя его уточнением «вожди»; возможное контекстуальное сужение пояснено в сноске.
- source_word: ἔλεγον
  choice: стали спрашивать
  rationale: Имперфект передан как разворачивающееся речевое действие; поскольку далее следует вопрос и требование, «спрашивать» звучит естественно по-русски.
- source_word: Ἕως πότε τὴν ψυχὴν ἡμῶν αἴρεις
  choice: Долго ещё Ты будешь держать нас в неизвестности?
  rationale: Передаёт смысл идиомы о состоянии неопределённости, сохраняя настойчивый тон вопроса; буквальный образ отмечен в сноске.
- source_word: ὁ χριστός
  choice: Мессия
  rationale: Здесь слово употреблено как иудейский мессианский титул, а не как имя.
- source_word: εἰπὲ ἡμῖν παρρησίᾳ
  choice: скажи нам прямо
  rationale: Естественно передаёт требование открытого и недвусмысленного заявления.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В вопросе речь идёт о титуле ожидаемого Помазанника; «Мессия» ясно сохраняет этот историко-иудейский контекст.
- issue: Кого обозначает οἱ Ἰουδαῖοι
  choice: иудеи
  alternative: иудейские вожди / противники Иисуса
  rationale: Сам стих не уточняет социальную группу, поэтому основной текст сохраняет неоднозначность, а вероятное контекстуальное сужение вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Местоимения, относящиеся к Иисусу, оформлены с прописной буквы по принятой русской библейской традиции. Обе сноски отмечены в основном тексте; маркер [b] относится к слову «иудеи» и в окончательной редакции должен стоять непосредственно после него.
