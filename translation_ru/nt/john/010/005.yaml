  text: ἀλλοτρίῳ δὲ οὐ μὴ ⸀ἀκολουθήσουσιν ἀλλὰ φεύξονται ἀπ’ αὐτοῦ, ὅτι οὐκ οἴδασι τῶν ἀλλοτρίων τὴν φωνήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/005.yaml
  text: But they will certainly not follow a stranger[a]; instead, they will flee from him[b], because they do not know the voice of strangers.
translation:
  language: ru
  text: Но за чужим они ни за что не пойдут[a], а убегут от него, потому что не знают голоса чужих[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никогда не пойдут». В греческом тексте употреблено усиленное отрицание (οὐ μή).'
    reason: lexical_alternative
  - marker: b
    text: «Не знают голоса» можно также понять как «не узнают голоса».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: за чужим
  rationale: В пастушеской метафоре речь идёт не об иностранце, а о человеке, который овцам не свой. Субстантивированное «чужой» естественно передаёт это значение, а конструкция «идти за» соответствует русскому употреблению в данном контексте.
- source_word: οὐ μὴ ἀκολουθήσουσιν
  choice: ни за что не пойдут
  rationale: Сочетание οὐ μή с будущим временем выражает усиленное отрицание. «Ни за что не пойдут» сохраняет категоричность и звучит естественно в современном русском языке.
- source_word: φεύξονται ἀπ’ αὐτοῦ
  choice: убегут от него
  rationale: Глагол φεύγω с ἀπό обозначает бегство или удаление от кого-либо. «Убегут от него» ясно и естественно сохраняет силу образа.
- source_word: οἴδασι
  choice: не знают
  rationale: οἶδα может означать как знание, так и узнавание. Буквальное «не знают» сохраняет семантическую широту и перекликается с темой знакомого голоса в ближайшем контексте.
- source_word: τῶν ἀλλοτρίων τὴν φωνήν
  choice: голоса чужих
  rationale: 'Сохранено греческое единственное число «голос» при родительном множественного «чужих»: имеется в виду характерный голос любого из тех, кто овцам не свой.'
- source_word: δὲ ... ἀλλὰ
  choice: Но ... а
  rationale: Парная противопоставительная конструкция естественно передаётся по-русски сочетанием «но ... а», подчёркивающим противоположные действия.
theological_decisions:
- issue: Смысл образа чужого в метафоре об овцах и пастухе
  choice: Сохранить слово «чужой» внутри метафоры без поясняющего отождествления.
  alternative: Прямо назвать чужого ложным учителем или незаконным вождём.
  rationale: Сам стих не раскрывает референта образа. Его конкретизация в основном тексте устранила бы намеренно сохранённую образность и внесла бы толкование в перевод.
translation_notes:
  register: Современный литературный русский язык с ясной, dignified формулировкой. «Ни за что не пойдут» передаёт усиленное отрицание без архаизма; пастушеская метафора и неоднозначность глагола οἶδα сохранены.
