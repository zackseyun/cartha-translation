id: JHN.10.25
reference: John 10:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Εἶπον ὑμῖν καὶ οὐ πιστεύετε· τὰ ἔργα ἃ ἐγὼ ποιῶ ἐν τῷ ὀνόματι τοῦ πατρός μου ταῦτα μαρτυρεῖ περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/025.yaml
  text: Jesus answered them[a], “I told you, and you do not believe[b]. The works that I do in the name of my Father—these testify about me.”
translation:
  language: ru
  text: 'Иисус ответил им: «Я сказал вам, но вы не верите. Дела, которые Я совершаю во имя Моего Отца,[a] — они свидетельствуют обо Мне».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «властью Моего Отца».'
    reason: Лексическая альтернатива для ἐν τῷ ὀνόματι, поясняющая возможный оттенок полномочия.
  - marker: b
    text: 'Или: «дают свидетельство обо Мне».'
    reason: Лексическая альтернатива для μαρτυρεῖ, сохраняющая более развёрнутый образ свидетельства.
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ответил
  rationale: Обычная и естественная передача повествовательной формы ἀποκρίνομαι в диалоге.
- source_word: Εἶπον ὑμῖν
  choice: Я сказал вам
  rationale: Передаёт аорист как отсылку к уже произнесённым словам, сохраняя явное ὑμῖν и не уточняя сверх текста, что именно было сказано.
- source_word: οὐ πιστεύετε
  choice: но вы не верите
  rationale: «Верить» сохраняет ключевую для Евангелия от Иоанна лексику и допускает как неприятие слов Иисуса, так и отсутствие веры в Него.
- source_word: τὰ ἔργα
  choice: Дела
  rationale: «Дела» — естественный и устойчивый русский эквивалент, сохраняющий связь с иоанновской темой дел Иисуса.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: во имя Моего Отца
  rationale: 'Формальная идиоматическая передача сохраняет семантическую широту выражения: представительство, полномочие и связь с Отцом.'
- source_word: ταῦτα μαρτυρεῖ περὶ ἐμοῦ
  choice: они свидетельствуют обо Мне
  rationale: Местоимение «они» подхватывает «дела» и передаёт эмфатическое ταῦτα; «свидетельствуют» сохраняет важный для Иоанна образ свидетельства.
theological_decisions:
- issue: Связь дел Иисуса с именем и властью Отца
  choice: «во имя Моего Отца»
  alternative: «властью Моего Отца»
  rationale: Основной текст сохраняет буквальный образ имени и не сводит его значение только к полномочию; возможный смысл власти указан в примечании.
- issue: Функция дел Иисуса
  choice: «они свидетельствуют обо Мне»
  alternative: «они дают свидетельство обо Мне»
  rationale: Выбрана современная и естественная формулировка, сохраняющая судебно-свидетельскую лексику Евангелия без дополнительного истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Заглавные местоимения в обращении к Божественным Лицам соответствуют принятой русской библейской издательской традиции; синтаксис остаётся ясным для широкого читателя.
