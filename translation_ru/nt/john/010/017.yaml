  text: διὰ τοῦτό ⸂με ὁ πατὴρ⸃ ἀγαπᾷ ὅτι ἐγὼ τίθημι τὴν ψυχήν μου, ἵνα πάλιν λάβω αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/017.yaml
  text: For this reason the Father loves me[a], because I lay down my life so that I may take it up again.
translation:
  language: ru
  text: Потому Отец и любит Меня, что Я отдаю Свою жизнь, чтобы вновь обрести её.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Свою душу». Здесь слово ψυχή, скорее всего, означает жизнь, которую Иисус отдаёт, умирая, и затем вновь обретает.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Потому
  rationale: Естественно вводит последующую причину в конструкции «потому… что» и сохраняет связь с контекстом.
- source_word: με ὁ πατὴρ ἀγαπᾷ
  choice: Отец и любит Меня
  rationale: Сохраняет определённое «Отец», без добавления отсутствующего в греческом притяжательного местоимения; частица «и» естественно оформляет русскую причинную конструкцию.
- source_word: ὅτι
  choice: что
  rationale: В парной конструкции «потому… что» передаёт причинное значение ὅτι.
- source_word: τίθημι τὴν ψυχήν μου
  choice: Я отдаю Свою жизнь
  rationale: В данном контексте выражение означает добровольно пойти на смерть. Русское «отдаю жизнь» звучит естественно и передаёт добровольность действия.
- source_word: ἵνα
  choice: чтобы
  rationale: Сохраняет целевую направленность придаточного, не устраняя возможный оттенок результата.
- source_word: πάλιν λάβω αὐτήν
  choice: вновь принять её
  rationale: Глагол λαμβάνω допускает значение «принять» и в контексте означает снова обрести жизнь; формулировка сохраняет лексическую неоднозначность между «принять» и «взять».
theological_decisions:
- issue: Значение ψυχή в контексте добровольной смерти Иисуса
  choice: жизнь
  alternative: душа
  rationale: Речь идёт о жизни, которую Иисус отдаёт в смерти и вновь принимает; «душа» могла бы привнести не выраженное здесь противопоставление души и тела.
- issue: Значение ἵνα λάβω в связи смерти и воскресения
  choice: чтобы вновь принять её
  alternative: чтобы снова взять её
  rationale: Сохранена целевая конструкция и не уточняется сверх текста механизм возвращения жизни; «принять» также отражает допустимый смысл λαμβάνω.
translation_notes:
  register: Современный литературный русский язык; краткая и достоинственная формулировка. Заглавные буквы в местоимениях, относящихся к Иисусу, соответствуют принятой русской библейской издательской традиции.
