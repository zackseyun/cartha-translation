  text: εἰ οὐ ποιῶ τὰ ἔργα τοῦ πατρός μου, μὴ πιστεύετέ μοι·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/037.yaml
  text: If I am not doing the works of my Father[a], do not believe me;
translation:
  language: ru
  text: Если Я не совершаю дел Моего Отца, не верьте Мне[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не верьте Моим словам».'
    reason: Лексико-синтаксическая альтернатива для πιστεύετέ μοι.
lexical_decisions:
- source_word: εἰ οὐ ποιῶ
  choice: Если Я не совершаю
  rationale: Условная конструкция передана прямо; настоящее время выражает совершаемые Иисусом дела без излишнего уточнения их длительности.
- source_word: τὰ ἔργα
  choice: дел
  rationale: «Дела» естественно передаёт ἔργα и сохраняет значимый для Евангелия от Иоанна мотив дел Иисуса, свидетельствующих о Нём.
- source_word: τοῦ πατρός μου
  choice: Моего Отца
  rationale: Прямо передаёт родительный оборот; современный порядок слов звучит естественно, а прописная буква указывает на Бога как Отца Иисуса.
- source_word: μὴ πιστεύετέ μοι
  choice: не верьте Мне
  rationale: Сохраняет прямую конструкцию πιστεύω с дательным падежом и не устраняет смысловое наложение личного доверия и признания слов говорящего.
theological_decisions:
- issue: Значение πιστεύω с дательным μοι
  choice: «не верьте Мне»
  alternative: «не верьте Моим словам»
  rationale: Греческая конструкция допускает обращённую к личности веру или доверие, при этом в контексте речь также идёт о признании слов Иисуса. Основной текст сохраняет личную форму, а возможный смысл, связанный с Его словами, отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и dignified без архаического порядка слов. Прописные буквы в местоимениях прямой речи и в слове «Отец» соответствуют традиционному благоговейному библейскому регистру.
