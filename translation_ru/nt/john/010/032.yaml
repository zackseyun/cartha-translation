base_translation:
  language: en
  yaml_path: translation/nt/john/010/032.yaml
  text: Jesus answered them[a], “I showed you many good works from the Father[b]; for which of them are you stoning me?”
translation:
  language: ru
  text: 'Иисус ответил им: «Я показал вам много добрых дел, исходящих от Отца[a]. За какое из них[b] вы побиваете Меня камнями?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от Отца»; в греческом тексте здесь нет слова «Моего».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «из-за какого из этих дел».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ответил
  rationale: Обычный повествовательный глагол ответа; естественный и точный русский эквивалент.
- source_word: Πολλὰ ἔργα καλὰ
  choice: много добрых дел
  rationale: Сохраняет характерное для Иоанна слово «дела» и передаёт καλὰ как нравственно добрые и благотворные дела.
- source_word: ἔδειξα
  choice: показал
  rationale: Передаёт смысл явного предъявления совершённых дел и не заменяет его более толковательным «совершил».
- source_word: ἐκ τοῦ πατρός
  choice: исходящих от Отца
  rationale: Естественно выражает источник дел, обозначенный предлогом ἐκ, и не добавляет отсутствующего в греческом местоимения «Моего».
- source_word: διὰ ποῖον αὐτῶν ἔργον
  choice: за какое из них
  rationale: διά с винительным выражает причину или основание; местоимение отсылает к ранее названным делам, а единственное число сохраняется в слове «какое».
- source_word: λιθάζετε
  choice: побиваете Меня камнями
  rationale: Сохраняет настоящее время и прямое значение глагола, не добавляя толкования «пытаетесь» или «хотите».
theological_decisions:
- issue: Обозначение Отца в словах Иисуса
  choice: от Отца
  alternative: от Моего Отца
  rationale: В греческом тексте нет притяжательного местоимения μου. Формулировка не усиливает христологическое утверждение сверх исходного текста, тогда как контекст сохраняет ясную связь Иисуса с Отцом.
- issue: Связь дел с Отцом
  choice: дела, исходящие от Отца
  alternative: дела Отца
  rationale: Так явно сохраняется значение источника, выраженное ἐκ, без сведения оборота только к принадлежности или поручению.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Побиваете камнями» сохранено как традиционное, но понятное обозначение казни или нападения посредством камней; настоящее время не заменено толковательным выражением намерения.
