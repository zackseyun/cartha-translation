  source_fidelity: 'Текст точно передаёт греческий оригинал: «ответил», «много добрых дел», «показал», источник дел «от Отца», причинное «за какое из них» и настоящее время в «побиваете ... камнями». Оборот «исходящих от Отца» корректно раскрывает ἐκ как указание на источник, не добавляя «Моего».'
  naturalness: Формулировка естественна для современного литературного русского при сохранении умеренного библейского регистра. «Побивать камнями» остаётся понятным и точным обозначением λιθάζειν; настоящее время уместно в напряжённой прямой речи.
  terminology: «Добрые дела» последовательно передаёт καλὰ ἔργα и сохраняет важную для Иоанна лексику «дел». «Отец» передан без несуществующего в данном тексте притяжательного местоимения. Сноски привязаны к релевантным русским словам и верно поясняют как отсутствие μου, так и причинное значение διά.
