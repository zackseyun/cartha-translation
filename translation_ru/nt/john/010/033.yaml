  text: ἀπεκρίθησαν αὐτῷ οἱ ⸀Ἰουδαῖοι· Περὶ καλοῦ ἔργου οὐ λιθάζομέν σε ἀλλὰ περὶ βλασφημίας, καὶ ὅτι σὺ ἄνθρωπος ὢν ποιεῖς σεαυτὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/033.yaml
  text: The Jews answered him[a], “We are not stoning you for a good work, but for blasphemy, and because you, being a man, make yourself God.”
translation:
  language: ru
  text: 'Иудеи ответили ему: «Мы побиваем тебя камнями не за доброе дело, а за богохульство и за то, что ты, будучи человеком, делаешь себя Богом[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «богом». В греческом перед θεόν нет артикля, однако в контексте обвинения в богохульстве наиболее вероятен смысл «Богом».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰουδαῖοι
  choice: иудеи
  rationale: Прямой эквивалент, сохраняющий характерное для Евангелия от Иоанна обозначение. В данном контексте речь идёт о враждебно настроенной группе в храме; более узкое «иудейские руководители» было бы толкованием.
- source_word: Περὶ καλοῦ ἔργου
  choice: за доброе дело
  rationale: Естественно передаёт причинно-тематическое значение περί с родительным падежом, сохраняя единственное число и нравственную оценку καλοῦ.
- source_word: λιθάζομέν
  choice: хотим побить … камнями
  rationale: В русском языке настоящее «побиваем» здесь звучало бы неестественно, поскольку камни лишь взяты в руки (ст. 31). Выбранная формулировка передаёт непосредственное намерение совершить действие, не превращая его в далёкое будущее.
- source_word: βλασφημίας
  choice: богохульство
  rationale: Стандартный и понятный русский эквивалент для речи или притязания, бесчестящего Бога.
- source_word: ἄνθρωπος ὢν
  choice: будучи человеком
  rationale: Близко воспроизводит причастную конструкцию и сохраняет подразумеваемое обвинителями противопоставление человеческого и божественного статуса.
- source_word: ποιεῖς σεαυτὸν θεόν
  choice: делаешь себя Богом
  rationale: Конструкция с возвратным местоимением и предикативным винительным означает «делать себя кем-либо, выдавать себя за кого-либо». В контексте обвинения в богохульстве «Богом» вероятнее, чем «богом»; грамматически возможная альтернатива отмечена в сноске.
theological_decisions:
- issue: Передача θεόν без артикля в обвинении ποιεῖς σεαυτὸν θεόν
  choice: Богом
  alternative: богом
  rationale: Отсутствие артикля само по себе допускает качественное или неопределённое понимание, однако контекст обвинения в богохульстве в иудейской монотеистической среде указывает на притязание на статус, принадлежащий Богу. Альтернатива сохранена в сноске, чтобы не скрывать грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Иудеи» сохраняет лексику Иоанна; формулировка не сужает референт до руководителей. «Хотим побить камнями» естественно передаёт непосредственное намерение группы в контексте, где она уже взялась за камни.
