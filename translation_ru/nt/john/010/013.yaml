  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀ὅτι μισθωτός ἐστιν καὶ οὐ μέλει αὐτῷ περὶ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/013.yaml
  text: because he is a hired hand and does not care about the sheep.
translation:
  language: ru
  text: потому что он наёмный работник и ему нет дела до овец.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит причину бегства наёмного работника, описанного в предыдущем контексте; «потому что» ясно передаёт причинную связь по-русски.
- source_word: μισθωτός
  choice: наёмный работник
  rationale: Слово обозначает человека, работающего за плату, в отличие от пастуха, которому принадлежат овцы. Этот вариант современен, понятен и не содержит архаической или чрезмерно отрицательной окраски.
- source_word: οὐ μέλει αὐτῷ περὶ
  choice: ему нет дела до
  rationale: Греческая безличная конструкция выражает отсутствие заботы и заинтересованности. Русское выражение естественно и сохраняет нравственную остроту противопоставления.
- source_word: τῶν προβάτων
  choice: овец
  rationale: Буквальный эквивалент сохраняет центральный для отрывка образ овец и не заменяет его более обобщённым словом «стадо».
theological_decisions:
- issue: Характеристика наёмного работника в противопоставлении доброму пастуху
  choice: Передать прямую нравственную оценку текста, не отождествляя наёмного работника с какой-либо конкретной группой.
  alternative: Истолковать наёмного работника как определённый класс ложных руководителей либо смягчить смысл до простой профессиональной отстранённости.
  rationale: Стих объясняет его поведение тем, что он наёмный работник и не заботится об овцах. Перевод сохраняет это противопоставление, но не добавляет не названной в тексте идентификации.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, естественная и достойная. «Наёмный работник» нейтральнее устаревшего «наёмник», а «ему нет дела до овец» ясно передаёт отсутствие заботы.
