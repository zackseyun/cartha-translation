  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἔστιν γεγραμμένον ἐν τῷ νόμῳ ὑμῶν ⸀ὅτι Ἐγὼ εἶπα· Θεοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/034.yaml
  text: Jesus answered them[a], “Is it not written in your Law, ‘I said, you are gods’?”
translation:
  language: ru
  text: 'Иисус ответил им: «Разве не написано в вашем Законе: „Я сказал: вы — боги[a]“?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «божественные существа». Иисус цитирует Псалом 81:6 (82:6 в иной нумерации); значение этого выражения толкуют по-разному, поэтому в основном тексте сохранена прямая формулировка цитаты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: ответил им
  rationale: Естественная для современного русского языка передача повествовательной формулы ответа с сохранением адресата.
- source_word: Οὐκ ἔστιν γεγραμμένον
  choice: Разве не написано
  rationale: Форма риторического вопроса передаёт греческое отрицательное вопросительное предложение, а «написано» сохраняет обычную формулу введения цитаты из Писания.
- source_word: ἐν τῷ νόμῳ ὑμῶν
  choice: в вашем Законе
  rationale: Здесь νόμος обозначает Писание в широком смысле, поскольку цитируется Псалом 81:6 (82:6 в иной нумерации), а не только Пятикнижие; прописная буква указывает на это употребление.
- source_word: Ἐγὼ εἶπα
  choice: Я сказал
  rationale: Прямая передача цитаты без добавочного усиления, не требуемого русским контекстом.
- source_word: Θεοί
  choice: боги
  rationale: Наиболее прямая лексическая передача θεοί, сохраняющая формулировку и интерпретационное напряжение цитаты.
- source_word: ἐστε
  choice: вы —
  rationale: Именное сказуемое с тире естественно передаёт связку «вы есть»; слово «названы» не добавляется, поскольку его нет в греческом тексте.
theological_decisions:
- issue: Передача θεοί в цитате из Псалма 81:6 (82:6)
  choice: боги
  alternative: божественные существа
  rationale: Основной текст сохраняет прямое значение греческого слова и риторическую силу довода Иисуса, не разрешая спор о том, кого обозначает псалом. Возможная интерпретационная передача вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык; синтаксис естественный и торжественно-нейтральный. Вложенные кавычки ясно отделяют слова Писания от речи Иисуса.
