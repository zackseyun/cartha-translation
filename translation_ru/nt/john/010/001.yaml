source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ μὴ εἰσερχόμενος διὰ τῆς θύρας εἰς τὴν αὐλὴν τῶν προβάτων ἀλλὰ ἀναβαίνων ἀλλαχόθεν ἐκεῖνος κλέπτης ἐστὶν καὶ λῃστής·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/001.yaml
  text: Truly[a], truly, I say to you, the one who does not enter through the door into the sheepfold[c][b], but climbs up from somewhere else—that man is a thief and a robber.
translation:
  language: ru
  text: '«Истинно, истинно говорю вам: кто входит в загон для овец[b] не через дверь[a], а перелезает через ограду в другом месте, тот — вор и разбойник[c].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через ворота». Греческое θύρα может обозначать дверь или ворота — в зависимости от контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в овечий двор». Греческое αὐλή обозначает огороженный двор или загон.'
    reason: lexical_alternative
  - marker: c
    text: В греческом тексте различаются «вор» (κλέπτης) и «разбойник» (λῃστής); второе слово нередко подразумевает более открытое или насильственное ограбление.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Истинно, истинно
  rationale: Сохраняет торжественную удвоенную формулу и передаёт её смысл естественным, понятным современному русскому читателю выражением.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямо и без лишнего перефразирования передаёт формулу обращения.
- source_word: ὁ μὴ εἰσερχόμενος
  choice: кто входит… не
  rationale: Русская конструкция «кто… тот» естественно передаёт субстантивированное причастие в обобщённом единственном числе.
- source_word: διὰ τῆς θύρας
  choice: через дверь
  rationale: «Дверь» — основное соответствие θύρα; в контексте ограды возможно также «ворота», что отмечено в сноске.
- source_word: εἰς τὴν αὐλὴν τῶν προβάτων
  choice: в загон для овец
  rationale: Передаёт αὐλή как огороженное место для овец ясно и идиоматично, не добавляя аллегорического толкования.
- source_word: ἀλλὰ ἀναβαίνων ἀλλαχόθεν
  choice: а перелезает туда в другом месте
  rationale: «Перелезает» сохраняет физический образ преодоления ограды, выраженный ἀναβαίνων, а «в другом месте» передаёт ἀλλαχόθεν.
- source_word: ἐκεῖνος
  choice: тот
  rationale: Соотносительная конструкция «кто… тот» естественно передаёт указательное и выделительное значение ἐκεῖνος.
- source_word: κλέπτης
  choice: вор
  rationale: Обычное русское соответствие для человека, который крадёт, часто тайно.
- source_word: λῃστής
  choice: разбойник
  rationale: Сохраняет отличие от κλέπτης и возможный оттенок открытого или насильственного грабежа.
theological_decisions:
- issue: Образ αὐλή и θύρα
  choice: Сохранить конкретный образ «двери» и «загона для овец» без аллегорического пояснения.
  alternative: Передать как «ворота» и «овечий двор».
  rationale: Стих вводит образ, который раскрывается далее; перевод не должен заранее отождествлять его элементы с конкретными богословскими реалиями.
- issue: Обобщённая форма ὁ μὴ εἰσερχόμενος… ἐκεῖνος
  choice: Передать естественной русской конструкцией «кто… тот».
  alternative: «Тот, кто не входит… он…»
  rationale: Конструкция сохраняет обобщённое единственное число и выделение человека, о котором идёт речь, без стилистической тяжеловесности.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным евангельским регистром. Двоеточие после вводной формулы и конструкция «кто… тот» обеспечивают естественное русское течение фразы; тире подчёркивает итоговое определение.
