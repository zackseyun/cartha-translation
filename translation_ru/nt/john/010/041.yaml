  text: καὶ πολλοὶ ἦλθον πρὸς αὐτὸν καὶ ἔλεγον ὅτι Ἰωάννης μὲν σημεῖον ἐποίησεν οὐδέν, πάντα δὲ ὅσα εἶπεν Ἰωάννης περὶ τούτου ἀληθῆ ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/041.yaml
  text: And many came to him and were saying, “John did no sign, but everything that John said about this man was true.”
translation:
  language: ru
  text: 'И многие пришли к Нему и говорили: «Иоанн не совершил ни одного знамения, но всё, что Иоанн сказал об этом Человеке[a], было правдой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о Нём». Буквально: «об этом» или «об этом человеке».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: многие
  rationale: Субстантивированное прилагательное естественно передаётся без добавления слова «люди».
- source_word: ἦλθον πρὸς αὐτόν
  choice: пришли к Нему
  rationale: Передаёт движение к Иисусу и естественно соответствует повествовательной перспективе.
- source_word: ἔλεγον
  choice: говорили
  rationale: Несовершенный вид русского глагола сохраняет длительный или повторяющийся характер речи, выраженный имперфектом.
- source_word: σημεῖον
  choice: знамение
  rationale: 'В Евангелии от Иоанна это тематически значимое слово: чудесное действие служит знаком, указывающим за пределы самого события.'
- source_word: ἐποίησεν οὐδέν
  choice: не совершил ни одного
  rationale: Естественная русская конструкция сохраняет категорическое отрицание греческого текста.
- source_word: πάντα δὲ ὅσα
  choice: но всё, что
  rationale: Передаёт всеохватность выражения и противопоставление с δέ.
- source_word: περὶ τούτου
  choice: об этом Человеке
  rationale: Указательное местоимение относится к Иисусу; такая передача сохраняет его дейктическую силу и остаётся естественной в прямой речи.
- source_word: ἀληθῆ ἦν
  choice: было правдой
  rationale: Прямо передаёт значение истинности сказанного без добавления идеи последующего доказательства.
theological_decisions:
- issue: Терминология σημεῖον в Евангелии от Иоанна
  choice: знамение
  alternative: чудо
  rationale: '«Знамение» сохраняет характерную для Иоанна смысловую нагрузку: действие не только чудесно, но и указывает на личность и миссию Иисуса.'
- issue: Референт περὶ τούτου
  choice: об этом Человеке
  alternative: о Нём
  rationale: Выбранный вариант сохраняет указательную силу τούτου, не внося дополнительного богословского толкования; более краткий вариант дан в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Заглавные буквы в местоимениях, относящихся к Иисусу, следуют принятой русской библейской издательской практике; «Человеке» также оформлено с заглавной буквы в этом референтном употреблении.
