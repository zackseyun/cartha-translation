id: JHN.10.21
reference: John 10:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀ἄλλοι ἔλεγον· Ταῦτα τὰ ῥήματα οὐκ ἔστιν δαιμονιζομένου· μὴ δαιμόνιον δύναται τυφλῶν ὀφθαλμοὺς ⸀ἀνοῖξαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/021.yaml
  text: Others were saying[a], “These words are not those of a demon-possessed man. A demon cannot open the eyes of the blind, can it?”
translation:
  language: ru
  text: 'Другие говорили: «Это не слова человека, одержимого бесом. Разве бес может открыть глаза слепым?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλοι
  choice: Другие
  rationale: Передаёт противопоставление другой группе говоривших в предыдущем контексте без ненужного уточнения.
- source_word: ἔλεγον
  choice: говорили
  rationale: Несовершенный вид естественно передаёт греческий имперфект, указывающий на продолжавшиеся или повторявшиеся высказывания.
- source_word: Ταῦτα τὰ ῥήματα
  choice: Это не слова
  rationale: Слово «слова» прямо и естественно обозначает произнесённые Иисусом речи; указательное местоимение согласовано с нормой современного русского языка.
- source_word: οὐκ ἔστιν δαιμονιζομένου
  choice: не слова человека, одержимого бесом
  rationale: Греческий родительный оборот идиоматически указывает, кому могли бы принадлежать эти слова. Русская формулировка ясна, но не добавляет учения о точном характере демонического воздействия сверх сказанного в тексте.
- source_word: μὴ
  choice: Разве
  rationale: Частица вводит риторический вопрос, предполагающий отрицательный ответ; «разве» естественно передаёт это ожидание.
- source_word: δαιμόνιον
  choice: бес
  rationale: Прямой и укоренённый в русском библейском языке эквивалент, понятный современному читателю.
- source_word: δύναται
  choice: может
  rationale: В сочетании с «разве» сохраняет форму риторического вопроса и его ожидаемый отрицательный ответ без превращения вопроса в утверждение.
- source_word: τυφλῶν ὀφθαλμοὺς
  choice: глаза слепым
  rationale: Естественная русская конструкция сохраняет явное упоминание глаз и связь с исцелением слепорождённого.
- source_word: ἀνοῖξαι
  choice: открыть
  rationale: Сохраняет конкретный образ исходного текста, не заменяя его толковательным «вернуть зрение».
theological_decisions:
- issue: Передача δαιμονίζομαι и δαιμόνιον
  choice: человек, одержимый бесом / бес
  alternative: человек, находящийся под властью беса / демон
  rationale: Выбранная формулировка привычна и ясна по-русски, прямо передаёт демоническую обусловленность, но не развивает частную доктрину о механизме или степени одержимости.
- issue: Сила риторического вопроса с μή
  choice: Разве бес может открыть глаза слепым?
  alternative: Бес ведь не может открыть глаза слепым?
  rationale: «Разве» ясно указывает на ожидаемый отрицательный ответ и одновременно сохраняет вопросительную форму и ход рассуждения говорящих.
translation_notes:
  register: Современный литературный русский язык; речь проста, естественна и достойна. Сохранены риторический вопрос, конкретный образ открытия глаз и несовершенный вид глагола речи.
