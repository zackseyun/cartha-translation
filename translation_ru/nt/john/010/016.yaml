  text: καὶ ἄλλα πρόβατα ἔχω ἃ οὐκ ἔστιν ἐκ τῆς αὐλῆς ταύτης· κἀκεῖνα ⸂δεῖ με⸃ ἀγαγεῖν, καὶ τῆς φωνῆς μου ἀκούσουσιν, καὶ ⸀γενήσονται μία ποίμνη, εἷς ποιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/016.yaml
  text: And I have other sheep that are not from this sheepfold[a]. I must bring them also, and they will listen to my voice. Then there will be one flock[b], one shepherd.
translation:
  language: ru
  text: Есть у меня и другие овцы, не из этого загона. И их я должен привести; они услышат мой голос[a], и будет одно стадо[b], один пастух.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут слушать мой голос». Греческий глагол может означать как «слышать», так и «слушать»; в данном контексте он может включать в себя отклик на голос.'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте различаются «загон» (αὐλή — огороженное место) и «стадо» (ποίμνη — группа овец). Поэтому здесь именно «одно стадо», а не «один загон».
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλα πρόβατα
  choice: другие овцы
  rationale: πρόβατα обозначает овец вообще, а не конкретно ягнят; ἄλλα указывает на других овец помимо уже упомянутых.
- source_word: αὐλή
  choice: загон
  rationale: В пастушеском контексте слово обозначает огороженное место для овец. «Загон» естественно передаёт этот образ и сохраняет отличие от ποίμνη — самого стада.
- source_word: κἀκεῖνα
  choice: и их
  rationale: Местоимение относится к «другим овцам»; «и их» кратко и естественно передаёт добавочное значение κἀκεῖνα.
- source_word: δεῖ με ἀγαγεῖν
  choice: я должен привести
  rationale: δεῖ выражает необходимость, а ἀγαγεῖν — приведение или ведение к месту. Формулировка сохраняет силу необходимости, не объясняя её богословскую природу сверх текста.
- source_word: τῆς φωνῆς μου ἀκούσουσιν
  choice: они послушаются моего голоса
  rationale: ἀκούω допускает значения «услышать» и «слушать». В образе овец, следующих за пастухом, русское «послушаются голоса» естественно передаёт не только восприятие звука, но и отклик, сохраняя при этом примечание о буквальной альтернативе.
- source_word: γενήσονται
  choice: будет
  rationale: Форма указывает на будущее возникновение единого стада. Безлично-предикативное русское «будет одно стадо» естественно выражает итоговое состояние, не перегружая фразу.
- source_word: μία ποίμνη
  choice: одно стадо
  rationale: ποίμνη — группа овец, то есть стадо, а не ограда или загон.
- source_word: εἷς ποιμήν
  choice: один пастух
  rationale: ποιμήν буквально означает пастуха. Современное слово «пастух» ясно сохраняет предметный образ и не привносит более узкого церковного оттенка слова «пастырь».
theological_decisions:
- issue: Различение αὐλή и ποίμνη
  choice: этот загон … одно стадо
  alternative: этот двор/овчий двор … одно стадо; этот загон … один загон
  rationale: 'В греческом тексте употреблены разные существительные: αὐλή — ограда или загон, ποίμνη — стадо. Их различение не позволяет превратить единство овец под одним пастухом в утверждение об одном общем ограждённом месте или учреждении.'
- issue: Сила δεῖ
  choice: я должен привести
  alternative: мне нужно привести; мне необходимо привести
  rationale: «Должен» сохраняет выраженную в тексте необходимость, в том числе возможный богословский вес этого слова у Иоанна, но не уточняет источник необходимости.
- issue: Значение ἀκούω в пастушеском образе
  choice: послушаются моего голоса
  alternative: услышат мой голос
  rationale: Контекст предполагает отклик овец на голос пастуха, однако глагол сам по себе допускает и более прямое значение «услышат»; эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с простым, достойным синтаксисом. Местоимения, относящиеся к Иисусу, даны со строчной буквы согласно нейтральной современной орфографической практике. «Пастух» выбрано вместо более церковного «пастырь», чтобы последовательно сохранить живой образ овец, загона и стада.
