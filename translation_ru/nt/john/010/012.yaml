source:
  edition: SBLGNT
  text: ὁ ⸀μισθωτὸς καὶ οὐκ ὢν ποιμήν, οὗ οὐκ ⸀ἔστιν τὰ πρόβατα ἴδια, θεωρεῖ τὸν λύκον ἐρχόμενον καὶ ἀφίησιν τὰ πρόβατα καὶ φεύγει— καὶ ὁ λύκος ἁρπάζει αὐτὰ καὶ ⸀σκορπίζει—
base_translation:
  language: en
  yaml_path: translation/nt/john/010/012.yaml
  text: The hired hand[a], who is not a shepherd and whose sheep are not his own, sees the wolf coming and leaves the sheep and flees—and the wolf snatches them and scatters them.
translation:
  language: ru
  text: Наёмный работник, который не пастух и которому овцы не принадлежат, видит приближающегося волка, оставляет овец[a] и убегает — а волк хватает их и рассеивает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бросает овец». Глагол может обозначать не просто уход, а оставление их в опасности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθωτός
  choice: наёмный работник
  rationale: Передаёт работника, служащего за плату, без архаического или изначально бранного оттенка; сохраняет противопоставление пастуху.
- source_word: οὐκ ὢν ποιμήν
  choice: который не пастух
  rationale: Причастная конструкция естественно передана определительным придаточным, при этом сохранено прямое утверждение, что этот человек не пастух.
- source_word: οὗ οὐκ ἔστιν τὰ πρόβατα ἴδια
  choice: которому овцы не принадлежат
  rationale: Естественно выражает отсутствие принадлежности и личной связи, заключённое в ἴδια, не добавляя толкования.
- source_word: θεωρεῖ τὸν λύκον ἐρχόμενον
  choice: видит приближающегося волка
  rationale: Передаёт восприятие надвигающейся опасности и движение волка; «приближающегося» звучит по-русски естественнее буквального «идущего».
- source_word: ἀφίησιν
  choice: оставляет
  rationale: Сохраняет широкий смысл глагола; контекст указывает на предосудительное оставление в опасности, а более сильный вариант отмечен в сноске.
- source_word: φεύγει
  choice: убегает
  rationale: Современное и ясное обозначение бегства от опасности.
- source_word: ἁρπάζει αὐτά
  choice: хватает их
  rationale: Передаёт резкое, насильственное действие хищника без введения дополнительного смысла уничтожения или похищения.
- source_word: σκορπίζει
  choice: разгоняет
  rationale: В пастушеском образе естественно передаёт рассеивание овец волком; дополнение «их» восстанавливается из контекста.
theological_decisions:
- issue: Метафорический характер образов пастуха, наёмного работника, овец и волка
  choice: Сохранить буквальную лексику пастушеского образа без истолкования его участников внутри стиха.
  alternative: Заменить образы толковательными обозначениями вроде «руководитель», «подопечные» или «враг».
  rationale: В Ин 10 развёрнута цельная пастушеская метафора. Истолковывающая замена сузила бы её возможный смысл и внесла бы в перевод выводы, прямо не выраженные в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с ясной, но достойной формулировкой. «Наёмный работник» предпочтён слову «наёмник», которое в современном русском часто прежде всего означает вооружённого бойца за плату и может вносить лишний отрицательный оттенок. Тире сохраняет резкий переход к последствиям бегства.
