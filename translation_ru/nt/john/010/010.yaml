id: JHN.10.10
reference: John 10:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ κλέπτης οὐκ ἔρχεται εἰ μὴ ἵνα κλέψῃ καὶ θύσῃ καὶ ἀπολέσῃ· ἐγὼ ἦλθον ἵνα ζωὴν ἔχωσιν καὶ περισσὸν ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/010.yaml
  text: The thief comes only to steal and slaughter and destroy[a]; I came so that they may have life[b], and have it abundantly.
translation:
  language: ru
  text: Вор приходит только для того, чтобы украсть, заколоть и погубить[a]. Я пришёл, чтобы они имели жизнь и имели её в избытке[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «убить». Греческий глагол часто означает заклание животного, что соответствует образу овец в этом контексте.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «имели жизнь во всей полноте»; «имели её с избытком».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ κλέπτης
  choice: вор
  rationale: 'Определённый артикль допускает обобщённо-определённое значение: речь идёт о воре как типическом образе в рассуждении о пастухе и овцах.'
- source_word: οὐκ ἔρχεται εἰ μὴ
  choice: приходит только для того, чтобы
  rationale: Оборот выражает исключительную цель прихода; выбранная формулировка естественна по-русски и сохраняет эту смысловую силу.
- source_word: κλέψῃ
  choice: украсть
  rationale: Инфинитив естественно передаёт цель действия после русского оборота «только для того, чтобы».
- source_word: θύσῃ
  choice: заколоть
  rationale: Глагол θύω часто обозначает заклание животного. «Заколоть» сохраняет образ овец в ближайшем контексте и конкретнее общего «убить».
- source_word: ἀπολέσῃ
  choice: погубить
  rationale: Слово передаёт доведение до гибели или полного уничтожения, не уточняя способ и не сужая смысл до физического убийства.
- source_word: ἐγὼ ἦλθον
  choice: Я пришёл
  rationale: Простое прошедшее время естественно передаёт аорист и подчёркнутое ἐγώ в противопоставлении миссии Иисуса приходу вора.
- source_word: ἵνα ζωὴν ἔχωσιν
  choice: чтобы они имели жизнь
  rationale: Формулировка сохраняет целевое придаточное и ключевое для Иоанна слово «жизнь», не добавляя отсутствующего в данном стихе определения «вечную».
- source_word: περισσὸν ἔχωσιν
  choice: имели её в избытке
  rationale: Фраза естественно связывает изобилие с уже названной жизнью и сохраняет повтор глагола ἔχωσιν.
theological_decisions:
- issue: Объём значения ζωὴ у Иоанна
  choice: жизнь
  alternative: вечная жизнь; истинная жизнь
  rationale: В греческом тексте нет определения «вечная». Простое «жизнь» сохраняет богословскую ёмкость термина и не подменяет перевод толкованием.
- issue: Смысл περισσὸν
  choice: в избытке
  alternative: во всей полноте; с избытком
  rationale: Выражение указывает на полноту и изобилие даруемой жизни, но само по себе не говорит о материальном благополучии; перевод не вводит такого уточнения.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-возвышенным звучанием. Синтаксический параллелизм двух целей сохранён; повтор «имели» отражает греческий текст. «Заколоть» выбрано как понятное контекстуальное слово, а более общее «убить» вынесено в примечание.
