lexical_decisions:
- source_word: ὅταν
  choice: Когда
  rationale: Вводит неопределённо-временное придаточное с сослагательным наклонением; «когда» естественно передаёт обобщённое описание действия.
- source_word: τὰ ἴδια πάντα
  choice: всех своих
  rationale: Субстантивированное выражение обозначает всех принадлежащих пастуху; мужской одушевлённый оборот в русском естественно подразумевает овец, не повторяя существительное раньше греческого текста.
- source_word: ἐκβάλῃ
  choice: выведет
  rationale: Передаёт движение наружу из загона и подходит пастушескому контексту, не приписывая действию излишней резкости; более сильное «выгонит» отмечено в сноске.
- source_word: ἔμπροσθεν αὐτῶν πορεύεται
  choice: идёт впереди них
  rationale: Естественно и точно сохраняет пространственный образ пастуха, ведущего стадо.
- source_word: τὰ πρόβατα αὐτῷ ἀκολουθεῖ
  choice: овцы следуют за ним
  rationale: Русское управление «следовать за» естественно передаёт дательный объект при ἀκολουθέω.
- source_word: ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ
  choice: потому что знают его голос
  rationale: Сохраняет причинную связь и основное значение οἶδα «знать», не сужая его до одного лишь узнавания.
theological_decisions:
- issue: Пастушеский образ и сила глагола ἐκβάλῃ
  choice: «выведет»
  alternative: «выгонит» или «изведёт наружу»
  rationale: В непосредственном контексте пастух выводит принадлежащих ему овец из загона. «Выведет» сохраняет направленность движения наружу, не внося в образ неподтверждённой враждебности или принуждения; при этом более резкий возможный оттенок исходного глагола указан в сноске.
translation_notes:
  register: Современный литературный русский язык; простая, достойная повествовательная фраза. Выражение «всех своих» сохраняет лаконичность оригинала, а «идёт впереди них» — конкретный пастушеский образ.
