  yaml_path: translation/nt/john/010/031.yaml
  text: So the Jews picked up stones again to stone him[a].
translation:
  language: ru
  text: Тогда иудеи снова взялись за камни, чтобы побить Его камнями[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В данном контексте возможно также: «иудейские вожди» или «жители Иудеи». У Иоанна выражение «иудеи» часто обозначает определённых противников Иисуса, а не еврейский народ в целом.'
    reason: Альтернативное контекстуальное понимание οἱ Ἰουδαῖοι; пояснение предотвращает неоправданное обобщение, не сужая основной текст.
lexical_decisions:
- source_word: Ἐβάστασαν
  choice: взялись за
  rationale: В сочетании с «камни» и указанием цели глагол означает, что противники взяли камни для немедленного применения. «Взялись за камни» естественно по-русски и не уточняет без необходимости, лежали ли камни на земле.
- source_word: οὖν
  choice: тогда
  rationale: Частица связывает реакцию противников с предшествующими словами Иисуса. В повествовании «тогда» звучит естественно и передаёт следствие либо последовательность, не делая логическую связь чрезмерно формальной.
- source_word: πάλιν
  choice: снова
  rationale: Прямо передаёт повторность действия и перекликается с более ранней попыткой побить Иисуса камнями.
- source_word: λίθους
  choice: камни
  rationale: Обычное и точное соответствие существительному λίθος; цель использования камней раскрывается последующим оборотом.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Сохраняет явную формулировку греческого текста и традиционное для русского библейского языка обозначение. Поскольку в Евангелии от Иоанна выражение нередко относится к определённым противникам Иисуса, а не ко всему еврейскому народу, контекстуальное ограничение отмечено в сноске.
- source_word: ἵνα λιθάσωσιν
  choice: чтобы побить камнями
  rationale: Оборот с ἵνα выражает цель, а λιθάζω означает казнить или поражать посредством бросания камней. Русское «побить камнями» точно и идиоматично передаёт способ действия без добавления прямо не выраженного глагола «убить».
- source_word: αὐτόν
  choice: Его
  rationale: Местоимение относится к Иисусу; прописная буква соответствует принятой русской библейской издательской норме для местоимений, относящихся к Нему.
theological_decisions:
- issue: Объём значения οἱ Ἰουδαῖοι в Евангелии от Иоанна
  choice: В основном тексте — «иудеи», с контекстуальным пояснением в сноске.
  alternative: «иудейские вожди» или «жители Иудеи»
  rationale: Греческий текст не уточняет общественное положение участников, поэтому основной перевод не сужает референт до вождей. Вместе с тем сноска предупреждает, что выражение Иоанна в подобных контекстах часто обозначает конкретных противников Иисуса, а не еврейский народ в целом.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Формулировка краткая и повествовательно естественная; сохранены повторность действия, целевая конструкция и неоднозначный объём слова «иудеи».
