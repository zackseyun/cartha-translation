  text: καὶ ⸂πολλοὶ ἐπίστευσαν εἰς αὐτὸν ἐκεῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/042.yaml
  text: And many believed in him there.
translation:
  language: ru
  text: И многие там поверили в Него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Обычный соединительный союз, связывающий итог стиха с предшествующим повествованием без добавочного причинного или временного оттенка.
- source_word: πολλοὶ
  choice: многие
  rationale: Субстантивированное прилагательное обозначает многих людей; русское «многие» передаёт это кратко и естественно.
- source_word: ἐπίστευσαν
  choice: поверили
  rationale: Аорист πιστεύω прямо обозначает состоявшийся акт веры; «поверили» естественно по-русски и не добавляет специально выраженного начинательного оттенка.
- source_word: εἰς αὐτόν
  choice: в Него
  rationale: Сочетание πιστεύω εἰς с личным объектом передаёт веру и доверие, направленные на Иисуса; «поверили в Него» — естественное русское соответствие.
- source_word: ἐκεῖ
  choice: там
  rationale: Кратко и точно сохраняет указание на место, подчёркнутое греческим порядком слов.
theological_decisions:
- issue: Передача πιστεύω εἰς αὐτόν в контексте веры в Иисуса
  choice: поверили в Него
  alternative: уверовали в Него
  rationale: «Поверили в Него» сохраняет личную направленность веры и остаётся понятным современному читателю. «Уверовали» допустимо, но имеет более выраженную церковно-книжную окраску и может сильнее подсказывать богословски специализированное прочтение, чем требует краткая греческая фраза.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и естественная фраза. Порядок «многие там поверили» сохраняет акцент на месте, оставаясь идиоматичным. Заглавная буква в местоимении «Него» следует принятой русской библейской типографической традиции.
