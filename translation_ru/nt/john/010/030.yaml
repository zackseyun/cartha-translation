  text: I and the Father are one[a].
translation:
  language: ru
  text: Я и Отец — одно[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое слово «одно» стоит в среднем роде: оно подчёркивает единство, не отождествляя Иисуса и Отца как одно лицо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: Я
  rationale: Явно выраженное местоимение первого лица сохраняет смысловое ударение греческого текста.
- source_word: καὶ
  choice: и
  rationale: Простой соединительный союз связывает два различённых субъекта без добавочного оттенка.
- source_word: ὁ πατὴρ
  choice: Отец
  rationale: В контексте Евангелия от Иоанна это титульное обозначение Отца Иисуса; прописная буква соответствует современному русскому библейскому употреблению.
- source_word: ἕν
  choice: одно
  rationale: Форма среднего рода передаёт единство, но не отождествляет Иисуса и Отца как одно лицо. Русское «одно» прямо сохраняет грамматически значимый средний род.
- source_word: ἐσμεν
  choice: — одно
  rationale: Русская именная конструкция в настоящем времени естественно опускает связку «есть/суть»; два подлежащих «Я и Отец» сохраняют различение субъектов, тогда как сказуемое «одно» утверждает их единство.
theological_decisions:
- issue: Значение среднего рода ἕν при глаголе первого лица множественного числа ἐσμεν в христологически значимом высказывании
  choice: «Я и Отец — одно» утверждает действительное единство Иисуса и Отца, сохраняя их личностное различие.
  alternative: «Я и Отец едины»; «Я и Отец — одно лицо»
  rationale: «Одно» сохраняет средний род ἕν и богословское напряжение исходного текста. Вариант «едины» естественен, но может сузить смысл до согласия или единодушия; «одно лицо» противоречит среднему роду и множественному числу глагола и привносит отсутствующее в тексте толкование.
translation_notes:
  register: Краткая, торжественная и естественная для современного литературного русского формулировка. Тире нормативно оформляет нулевую связку между составным подлежащим и именной частью сказуемого; традиционное «суть» не используется как архаичное.
