  text: ἔστιν δὲ ἐν τοῖς Ἱεροσολύμοις ἐπὶ τῇ προβατικῇ κολυμβήθρα ἡ ἐπιλεγομένη Ἑβραϊστὶ ⸀Βηθεσδά, πέντε στοὰς ἔχουσα·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/002.yaml
  text: There is in Jerusalem[a], by the Sheep Gate, a pool called Bethesda in Hebrew[c][b], having five porticoes.
translation:
  language: ru
  text: В Иерусалиме, у Овечьих ворот[a], есть купальня, по-еврейски называемая Вифезда[b][c]; у неё пять крытых колоннад.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте слово «ворота» не выражено прямо; вероятно, речь идёт о местности у Овечьих ворот (ср. Неемии 3:1; 12:39).
    reason: cross_reference
  - marker: b
    text: 'Или: «по-арамейски». У Иоанна выражение «по-еврейски» нередко обозначает местный семитский язык Иудеи, а не только древнееврейский язык в строгом смысле.'
    reason: lexical_alternative
  - marker: c
    text: В некоторых рукописях вместо «Вифезда» стоит «Вифзата» или «Вифсаида».
    reason: textual_variant
lexical_decisions:
- source_word: ἔστιν δὲ
  choice: есть
  rationale: Настоящее время ἔστιν сохранено; лёгкая связующая частица δέ не требует отдельного выражения в естественном русском предложении.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: в Иерусалиме
  rationale: Передаёт название города в принятой русской форме.
- source_word: ἐπὶ τῇ προβατικῇ
  choice: у Овечьих ворот
  rationale: Прилагательное употреблено эллиптически; вероятнее всего, имеются в виду Овечьи ворота или прилегающая к ним местность. Подразумеваемое слово «ворота» раскрыто в тексте, а неоднозначность отмечена в сноске.
- source_word: κολυμβήθρα
  choice: купальня
  rationale: Точное и привычное в библейском контексте обозначение устроенного водоёма; оно естественно отличает сам водоём от упомянутых рядом ворот.
- source_word: ἡ ἐπιλεγομένη
  choice: называемая
  rationale: Естественно передаёт причастие, вводя название купальни.
- source_word: Ἑβραϊστὶ
  choice: по-еврейски
  rationale: Основной текст прямо сохраняет формулировку греческого оригинала; возможное указание на местный арамейский язык пояснено в сноске.
- source_word: Βηθεσδά
  choice: Вифезда
  rationale: Передаёт чтение SBLGNT в общепринятой русской форме; иные рукописные чтения вынесены в сноску.
- source_word: πέντε στοὰς ἔχουσα
  choice: у неё пять крытых колоннад
  rationale: στοά обозначает крытую колоннаду или галерею. Конструкция с личным местоимением звучит естественно по-русски и сохраняет характеристику купальни.
