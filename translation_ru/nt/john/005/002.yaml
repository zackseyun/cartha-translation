translation_notes:
  register: 'Современный литературный русский язык с ясным, достойным звучанием. Синтаксис слегка перестроен ради естественности: местоположение вынесено в начало, а оборот πέντε στοὰς ἔχουσα передан самостоятельной частью после точки с запятой. Толкование эллиптического προβατικῇ не скрыто и оговорено в сноске.'
