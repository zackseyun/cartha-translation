  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διὰ τοῦτο οὖν μᾶλλον ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι ὅτι οὐ μόνον ἔλυε τὸ σάββατον, ἀλλὰ καὶ πατέρα ἴδιον ἔλεγε τὸν θεόν, ἴσον ἑαυτὸν ποιῶν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/018.yaml
  text: For this reason[a], therefore, the Jews were seeking all the more to kill him, because he was not only breaking the Sabbath, but was also calling God his own Father[b], making himself equal with God.
translation:
  language: ru
  text: По этой причине иудеи[a] ещё больше стремились убить Его, потому что Он не только нарушал субботу, но и называл Бога Своим Отцом, делая Себя равным Богу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В Евангелии от Иоанна слово «иудеи» в подобных контекстах часто обозначает конкретных противников Иисуса из Иудеи или некоторых иудейских руководителей, а не всех иудеев без различия.
    reason: cultural_note
  - marker: b
    text: 'Или: «ставя Себя наравне с Богом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο οὖν
  choice: Поэтому
  rationale: Оба греческих связующих элемента выражают вывод из предшествующего; в современном русском их совокупное значение естественно передаётся одним словом «поэтому», без тяжеловесного дублирования.
- source_word: μᾶλλον
  choice: ещё настойчивее
  rationale: Передаёт усиление уже существовавшего стремления и хорошо сочетается с продолженным значением имперфекта ἐζήτουν.
- source_word: ἐζήτουν ... ἀποκτεῖναι
  choice: искали случая убить
  rationale: Имперфект обозначает продолжающиеся попытки или намерение. Русское «искали случая убить» естественно передаёт целенаправленное стремление, не утверждая, что попытка убийства происходила в тот же момент.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Сохраняет прямое лексическое значение греческого выражения; контекстуальное ограничение круга лиц вынесено в примечание.
- source_word: ἔλυε τὸ σάββατον
  choice: нарушал субботу
  rationale: В данном контексте λύω означает нарушение или отмену обязательности субботнего предписания; «нарушал субботу» — ясная и устоявшаяся русская передача обвинения.
- source_word: πατέρα ἴδιον ἔλεγε τὸν θεόν
  choice: называл Бога Своим Отцом
  rationale: Сохраняет эмфатическое ἴδιον — «Своим собственным» — в естественной русской форме с прописным местоимением по принятому благоговейному стилю.
- source_word: ἴσον ἑαυτὸν ποιῶν τῷ θεῷ
  choice: тем самым ставя Себя наравне с Богом
  rationale: Передаёт обстоятельственное причастие как следствие предыдущего утверждения и сохраняет прямой смысл равенства с Богом.
theological_decisions:
- issue: Христологическая сила слов о равенстве с Богом
  choice: ставя Себя наравне с Богом
  alternative: заявляя о Своём равенстве Богу
  rationale: Выбранная формулировка близко передаёт ποιῶν и не ослабляет утверждение текста, но также не добавляет позднейшей богословской терминологии.
- issue: Кого обозначает выражение οἱ Ἰουδαῖοι
  choice: иудеи — с контекстуальным пояснением в сноске
  alternative: иудейские начальники
  rationale: Основной текст сохраняет широту греческого обозначения, а сноска предотвращает ошибочное понимание, будто речь идёт обо всех иудеях без различия.
- issue: Чья оценка выражена словами о нарушении субботы
  choice: сохранено прямое повествовательное изложение обвинения
  alternative: по их мнению, нарушал субботу
  rationale: Греческий текст не содержит явного ограничителя «по их мнению»; добавлять его в основной текст означало бы разрешить сохраняемое повествованием напряжение.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис слегка упрощён ради естественности, при этом логическая связь, продолженный характер враждебного намерения и христологическая напряжённость оригинала сохранены.
