lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: Не удивляйтесь
  rationale: Настоящее повелительное наклонение с μή выражает запрет; современное и естественное русское соответствие, сохраняющее смысл θαυμάζω.
- source_word: τοῦτο
  choice: этому
  rationale: Указательное местоимение относится к предшествующему утверждению; дательный падеж обусловлен управлением глагола «удивляться».
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит основание запрета; причинное значение ясно передано по-русски.
- source_word: ἔρχεται ὥρα
  choice: наступает час
  rationale: Сохранён образ «часа», значимый в лексике Иоанна; настоящее время передаёт приближение будущего события.
- source_word: ἐν ᾗ
  choice: когда
  rationale: Естественно передаёт временное относительное выражение буквально означающее «в который».
- source_word: πάντες οἱ ἐν τοῖς μνημείοις
  choice: все, находящиеся в гробницах
  rationale: Субстантивированная конструкция передана как «все, находящиеся…»; «гробницы» сохраняет конкретный образ мест погребения.
- source_word: ἀκούσουσιν
  choice: услышат
  rationale: Точно передаёт форму будущего времени и обычное значение ἀκούω в данном контексте.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: его голос
  rationale: Родительный падеж при ἀκούω является греческим управлением; по-русски естествен винительный падеж без смыслового расширения.
theological_decisions:
- issue: Намёк на воскресение через образ находящихся в местах погребения
  choice: Сохранить конкретный образ «гробниц», не добавляя прямого упоминания воскресения
  alternative: Передать как «мёртвые» или прямо пояснить воскресение
  rationale: Перевод сохраняет собственную формулировку стиха и его богословское напряжение, не превращая подразумеваемое в явное.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Наступает час» сохраняет характерный для Евангелия от Иоанна образ, а причастный оборот остаётся понятным и не перегружает фразу.
