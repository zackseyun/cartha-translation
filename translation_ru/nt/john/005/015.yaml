base_translation:
  language: en
  yaml_path: translation/nt/john/005/015.yaml
  text: The man went away and reported to the Jews that Jesus was the one who had made him well[a].
translation:
  language: ru
  text: Тот человек ушёл и сообщил иудеям, что Иисус — тот, кто исцелил его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иудейским руководителям»; или: «жителям Иудеи» — в зависимости от того, как в данном контексте понимается употреблённое Иоанном слово «иудеи».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: пошёл
  rationale: Аорист ἀπέρχομαι обозначает уход с места действия; «пошёл» естественно передаёт движение в современном русском повествовании.
- source_word: ὁ ἄνθρωπος
  choice: тот человек
  rationale: Определённый артикль отсылает к уже известному из контекста исцелённому человеку; указательное «тот» обеспечивает естественную русскую связность.
- source_word: ἀνήγγειλεν
  choice: сообщил
  rationale: ἀναγγέλλω означает сообщить, возвестить или довести до сведения. «Сообщил» подходит для передачи конкретной информации и не усиливает оттенок публичного провозглашения.
- source_word: τοῖς Ἰουδαίοις
  choice: иудеям
  rationale: Основной текст сохраняет прямое лексическое значение Ἰουδαῖοι, не сужая его до руководителей и не разрешая контекстуальную неоднозначность.
- source_word: ὅτι Ἰησοῦς ἐστιν ὁ ποιήσας αὐτὸν ὑγιῆ
  choice: что это Иисус исцелил его
  rationale: Русская выделительная конструкция «это Иисус» естественно передаёт Ἰησοῦς ἐστιν ὁ ποιήσας. Глагол «исцелил» ясно и кратко выражает идиому ποιέω с предикативным ὑγιῆ в данном контексте.
theological_decisions:
- issue: Кого обозначает τοῖς Ἰουδαίοις в Евангелии от Иоанна
  choice: Сохранить «иудеям» в основном тексте и отметить контекстуальные варианты в сноске.
  alternative: «иудейским руководителям» или «жителям Иудеи»
  rationale: Греческое слово допускает разные контекстуальные оттенки. Основной перевод не должен без необходимости сужать референт, однако сноска предупреждает читателя о реальной неоднозначности и помогает избежать чрезмерно широкого обобщения.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Формулировка сохраняет повествовательную краткость оригинала; неоднозначность обозначения Ἰουδαῖοι вынесена в сноску.
