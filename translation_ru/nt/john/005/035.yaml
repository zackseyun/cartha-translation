source:
  edition: SBLGNT
  text: ἐκεῖνος ἦν ὁ λύχνος ὁ καιόμενος καὶ φαίνων, ὑμεῖς δὲ ἠθελήσατε ἀγαλλιαθῆναι πρὸς ὥραν ἐν τῷ φωτὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/035.yaml
  text: He was the lamp that was burning and shining[a], and you were willing to rejoice for a time in his light.
translation:
  language: ru
  text: Он был светильником, который горел и светил, а вы захотели лишь на время порадоваться при его свете.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «недолго». Выражение обозначает ограниченный промежуток времени, а не обязательно буквальный час.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: Он
  rationale: В контексте указательное местоимение подчёркнуто отсылает к Иоанну Крестителю; русское «Он» естественно сохраняет эту отсылку.
- source_word: λύχνος
  choice: светильник
  rationale: Слово обозначает переносной источник света, а не свет как абстрактное понятие; «светильник» сохраняет отличие Иоанна от самого Света в образной системе Евангелия.
- source_word: καιόμενος καὶ φαίνων
  choice: который горел и светил
  rationale: Оба причастия описывают продолжающееся действие светильника; придаточное предложение звучит естественно по-русски и сохраняет оба образа.
- source_word: ἠθελήσατε
  choice: вы захотели
  rationale: Передаёт волевое отношение, выраженное аористом, не превращая его в устойчивое или длительное желание.
- source_word: ἀγαλλιαθῆναι
  choice: порадоваться
  rationale: Передаёт сильную радость в доступной современной форме; в сочетании с временным ограничением естественнее, чем более книжное «ликовать».
- source_word: πρὸς ὥραν
  choice: лишь на время
  rationale: Оборот означает ограниченный промежуток, необязательно буквальный час; «лишь» ясно подчёркивает кратковременность отклика.
- source_word: ἐν τῷ φωτὶ αὐτοῦ
  choice: при его свете
  rationale: Это естественный русский способ обозначить радость благодаря свету светильника, при сохранении метафоры свидетельства Иоанна.
theological_decisions:
- issue: Различие между Иоанном и Иисусом в образах света
  choice: Иоанн назван «светильником», а не «светом».
  alternative: Он был светом.
  rationale: Греческий текст употребляет λύχνος, а не φῶς. Перевод сохраняет образ Иоанна как свидетельствующего и производного источника освещения, не отождествляя его с высшим Светом.
translation_notes:
  register: Современный литературный русский язык; достоинство библейской речи сочетается с понятностью. «Светильник» точно сохраняет предметную метафору, а «при его свете» звучит естественно и не устраняет образную связь.
