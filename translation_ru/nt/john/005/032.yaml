source:
  edition: SBLGNT
  text: ἄλλος ἐστὶν ὁ μαρτυρῶν περὶ ἐμοῦ, καὶ οἶδα ὅτι ἀληθής ἐστιν ἡ μαρτυρία ἣν μαρτυρεῖ περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/032.yaml
  text: There is another who testifies about me[a], and I know that the testimony which he testifies about me is true.
translation:
  language: ru
  text: Есть другой, свидетельствующий обо мне, и я знаю, что свидетельство, которое он даёт обо мне, истинно.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλος
  choice: Другой
  rationale: Передаёт неопределённое указание на иного свидетеля и сохраняет контраст с собственным свидетельством Иисуса. Прописная буква соответствует контекстуальному указанию на Отца, не называя Его прямо.
- source_word: ὁ μαρτυρῶν
  choice: свидетельствующий
  rationale: Субстантивированное причастие настоящего времени передано причастием, сохраняющим длительный характер действия и формальную структуру греческого текста.
- source_word: περὶ ἐμοῦ
  choice: обо Мне
  rationale: Естественно передаёт значение περί с родительным падежом — предмет или содержание свидетельства.
- source_word: οἶδα
  choice: Я знаю
  rationale: Прямой и обычный русский эквивалент глагола знания.
- source_word: ἀληθής
  choice: истинно
  rationale: Кратко и точно характеризует свидетельство как соответствующее истине, не сужая значение до юридической действительности или личной правдивости.
- source_word: ἡ μαρτυρία
  choice: свидетельство
  rationale: Сохраняет судебно-свидетельскую лексику контекста и связь с однокоренным глаголом.
- source_word: ἣν μαρτυρεῖ
  choice: которое Он даёт
  rationale: Сохраняет относительное предложение, но избегает неестественного русского сочетания «свидетельство, которым Он свидетельствует»; «даёт свидетельство» является естественной русской сочетаемостью.
theological_decisions:
- issue: Личность «Другого» (ἄλλος)
  choice: Референт прямо не назван; сохранено «Другой»
  alternative: Иоанн Креститель; Отец; иной свидетель в юридическом смысле
  rationale: Сам стих не называет свидетеля, поэтому перевод не вставляет явное отождествление. Прописные местоимения отражают наиболее вероятную связь с Отцом в контексте, однако имя «Отец» не добавляется.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены повтор ключевого слова «свидетельство/свидетельствующий» и относительная конструкция, но заключительная глагольная фраза сделана естественной для русского языка.
