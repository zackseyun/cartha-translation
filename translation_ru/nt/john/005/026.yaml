  text: ὥσπερ γὰρ ὁ πατὴρ ἔχει ζωὴν ἐν ἑαυτῷ, οὕτως ⸂καὶ τῷ υἱῷ ἔδωκεν⸃ ζωὴν ἔχειν ἐν ἑαυτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/026.yaml
  text: For just as the Father has life in himself[b][a], so he also granted the Son to have life in himself.
translation:
  language: ru
  text: Ведь как Отец имеет жизнь в Самом Себе[a], так и Сыну Он дал иметь жизнь в Самом Себе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Жизнь в Самом Себе» может означать жизнь, внутренне присущую Ему Самому; перевод сохраняет выражение греческого текста, не заменяя его богословским термином «самосущая жизнь».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дал Сыну иметь жизнь в Самом Себе». Такая формулировка сохранена и в основном тексте; её не следует разворачивать в более узкое богословское толкование.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Ведь как
  rationale: «Ведь» передаёт пояснительное γάρ и связывает стих с предшествующей мыслью, а «как… так и» естественно воспроизводит соотносительную конструкцию ὥσπερ… οὕτως καί.
- source_word: ὁ πατὴρ
  choice: Отец
  rationale: В контексте Евангелия от Иоанна это определённое именование Бога; прописная буква соответствует современному русскому библейскому употреблению.
- source_word: ἔχει ζωὴν ἐν ἑαυτῷ
  choice: имеет жизнь в Самом Себе
  rationale: Близко передаёт греческие ἔχει и ἐν ἑαυτῷ, не заменяя образное выражение богословским термином «самобытная жизнь».
- source_word: οὕτως καὶ
  choice: так и
  rationale: Сохраняет параллель «как… так и» и значение καί.
- source_word: τῷ υἱῷ
  choice: Сыну
  rationale: Дательный падеж обозначает косвенное дополнение при ἔδωκεν; прописная буква отражает титульное употребление.
- source_word: ἔδωκεν
  choice: дал
  rationale: Прямое и естественное соответствие обычному значению δίδωμι; форма прошедшего времени передаёт аорист, не добавляя аспектуального толкования.
- source_word: ζωὴν ἔχειν ἐν ἑαυτῷ
  choice: иметь жизнь в Самом Себе
  rationale: Сохраняет инфинитивную конструкцию и точный словесный параллелизм с выражением об Отце.
theological_decisions:
- issue: Следует ли выражать ἐν ἑαυτῷ техническими терминами «самосуществование» или «самобытность»
  choice: Сохранить выражение «жизнь в Самом Себе»
  alternative: «самосущая жизнь» или «жизнь, источник которой — Он Сам»
  rationale: Греческий текст допускает богословский вывод о внутренне присущей жизни, однако сам не употребляет технического термина. Буквенная образность сохраняет смысловую глубину и неоднозначность.
- issue: Как передать дарование жизни Сыну без догматического сглаживания
  choice: «Сыну Он дал иметь жизнь в Самом Себе»
  alternative: «наделил Сына способностью иметь жизнь в Самом Себе»
  rationale: Основной текст сохраняет прямое утверждение ἔδωκεν и не объясняет его через позднейшие догматические категории. «Наделил способностью» было бы более толковательным и могло бы сузить смысл.
translation_notes:
  register: Современный литературный русский язык с dignified библейским регистром. Синтаксический параллелизм Отца и Сына сохранён. Местоимение «Он» добавлено для естественности и устранения двусмысленности русского порядка слов; прописные буквы в «Самом Себе» следуют принятому благоговейному оформлению божественного референта.
