source:
  edition: SBLGNT
  text: Οὐ δύναμαι ἐγὼ ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν· καθὼς ἀκούω κρίνω, καὶ ἡ κρίσις ἡ ἐμὴ δικαία ἐστίν, ὅτι οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/030.yaml
  text: I am not able to do anything from myself. Just as I hear[a], I judge, and my judgment is just, because I do not seek my own will, but the will of the one who sent me.
translation:
  language: ru
  text: Я ничего не могу делать от себя[a]. Как слышу, так и сужу, и суд мой справедлив, потому что я ищу не своей воли, а воли Пославшего меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ничего не могу делать самостоятельно». Греческое выражение может подчёркивать действие не из собственного источника, то есть не независимо.'
    reason: Лексическая альтернатива для ἀπ’ ἐμαυτοῦ.
lexical_decisions:
- source_word: Οὐ δύναμαι ἐγὼ ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν
  choice: Я ничего не могу делать от самого себя
  rationale: Сохраняет явное отрицание способности и значение источника в ἀπ’ ἐμαυτοῦ. Формулировка указывает не просто на действие без посторонней помощи, а на действие, исходящее независимо от Отца.
- source_word: καθὼς ἀκούω κρίνω
  choice: Как слышу, так и сужу
  rationale: Парная русская конструкция естественно передаёт соответствие, выраженное καθὼς, а «сужу» сохраняет судебное значение κρίνω и связь с последующим κρίσις.
- source_word: ἡ κρίσις ἡ ἐμὴ δικαία ἐστίν
  choice: суд мой справедлив
  rationale: В судебном контексте «справедлив» точно и естественно передаёт δικαία; «суд» сохраняет лексическую связь с глаголом «сужу».
- source_word: οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν
  choice: я ищу не своей воли
  rationale: «Ищу» сохраняет образ и направленность ζητῶ, а «своей» передаёт подчёркнутое притяжательное τὸ ἐμὸν без пересказа как «чего хочу».
- source_word: ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με
  choice: а воли Пославшего меня
  rationale: Субстантивированное причастие передано кратко и естественно, без добавления слова «Отец», которого в греческом тексте здесь нет.
theological_decisions:
- issue: Отношение действий Сына к Пославшему в выражении ἀπ’ ἐμαυτοῦ
  choice: от самого себя
  alternative: самостоятельно; сам по себе
  rationale: 'Перевод сохраняет напряжение текста: речь идёт о невозможности независимого действия и об источнике действия, но формулировка не превращается ни в утверждение об абсолютной неспособности, ни в явное догматическое пояснение.'
- issue: Значение δικαία при κρίσις
  choice: суд мой справедлив
  alternative: суд мой праведен; суд мой верен
  rationale: «Справедлив» наиболее прямо выражает судебную правильность решения, не исключая его нравственной праведности.
- issue: Обозначение τοῦ πέμψαντός με
  choice: Пославшего меня
  alternative: Того, кто послал меня; Отца, пославшего меня
  rationale: Сохраняется данное в тексте относительное обозначение без внесения слова «Отец»; прописная буква служит традиционным русским указанием на Бога, не меняя референта.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис «как слышу, так и сужу» выбран ради ясного и естественного выражения соответствия. Местоимения первого лица даны со строчной буквы согласно нейтральной современной норме; обозначение «Пославшего» — с прописной как традиционное наименование Бога.
