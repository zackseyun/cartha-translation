lexical_decisions:
- source_word: λέγει
  choice: говорит
  rationale: Сохранено историческое настоящее греческого повествования; в русском евангельском рассказе оно звучит естественно и передаёт особенность исходного текста.
- source_word: αὐτῷ
  choice: ему
  rationale: Прямая передача дательного падежа как косвенного дополнения без ненужного уточнения.
- source_word: Ἔγειρε
  choice: Встань
  rationale: Повелительная форма требует немедленно подняться. «Встань» естественно и достаточно широко передаёт действие в данном контексте.
- source_word: ἆρον
  choice: возьми
  rationale: В контексте переносимой подстилки глагол означает поднять и взять её с собой. «Возьми» звучит естественно, не добавляя отдельно не выраженного указания нести.
- source_word: κράβαττόν
  choice: циновку
  rationale: Греческое слово обозначает простую переносную подстилку для сна, а не обязательно предмет мебели. «Циновка» ясно передаёт лёгкую подстилку, которую можно взять и понести.
- source_word: περιπάτει
  choice: ходи
  rationale: Глагол обозначает физическую ходьбу. «Ходи» сохраняет форму настоящего императива и в этом контексте естественно выражает восстановленную способность ходить, не добавляя слов о самом исцелении.
theological_decisions:
- issue: Характер повелений Иисуса в контексте исцеления
  choice: 'Три повеления переданы прямо: встать, взять циновку и ходить.'
  alternative: «Встань и исцелись», а также другие поясняющие переложения.
  rationale: В греческом тексте исцеление подразумевается контекстом, но в самом стихе прямо не названо. Перевод не должен добавлять богословское или повествовательное пояснение к словам Иисуса.
translation_notes:
  register: 'Современный литературный русский язык; краткая, властная и естественная прямая речь. Историческое настоящее сохранено. Лексема «циновка» выбрана вместо потенциально вводящего в заблуждение «постель»: речь идёт о простой переносной подстилке.'
