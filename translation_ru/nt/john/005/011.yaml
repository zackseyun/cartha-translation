id: JHN.5.11
reference: John 5:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸂ὃς δὲ⸃ ἀπεκρίθη αὐτοῖς· Ὁ ποιήσας με ὑγιῆ ἐκεῖνός μοι εἶπεν Ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/011.yaml
  text: But he answered them[a], “The one who made me well—that one said to me[b], ‘Pick up your mat and walk.’”
translation:
  language: ru
  text: 'Но он ответил им: «Тот, кто исцелил меня, сказал мне: „Подними свою подстилку[a] и ходи“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «циновку»; греческое слово означает простую переносную подстилку или тюфяк для сна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ответил
  rationale: Обычный повествовательный глагол ответа; прямой и естественный русский эквивалент.
- source_word: Ὁ ποιήσας με ὑγιῆ
  choice: Тот, кто исцелил меня
  rationale: В контексте исцеления естественно передаёт значение сочетания «сделавший меня здоровым», не добавляя более широкого смысла «сделал целостным».
- source_word: ἐκεῖνός
  choice: тот
  rationale: Указательное местоимение в конструкции «Тот, кто…» сохраняет акцент на исцелившем человеке; отдельное повторение «именно он» по-русски было бы избыточным.
- source_word: Ἆρον
  choice: Подними
  rationale: Передаёт конкретное повеление поднять лежавшую подстилку; звучит естественно и ясно.
- source_word: κράβαττόν
  choice: подстилку
  rationale: Обозначает простую переносную постель или тюфяк, а не современную кровать как предмет мебели.
- source_word: περιπάτει
  choice: ходи
  rationale: Естественно передаёт настоящее повелительное наклонение и сохраняет возможный оттенок продолженного действия.
- source_word: δὲ
  choice: Но
  rationale: Передаёт лёгкое противопоставление ответа мужчины прозвучавшему обвинению.
theological_decisions:
- issue: Смысл описания исцеления
  choice: исцелил меня
  alternative: сделал меня здоровым / целым
  rationale: Контекст говорит о физическом исцелении. Формулировка не привносит более широкого духовного смысла, которого данный стих явно не выражает.
translation_notes:
  register: Современный литературный русский язык; речь ясная и достойная. Прямая речь оформлена естественно, а исторический предмет назван словом, не создающим образа большой кровати.
