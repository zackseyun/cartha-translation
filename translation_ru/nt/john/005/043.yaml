base_translation:
  language: en
  yaml_path: translation/nt/john/005/043.yaml
  text: I have come in my Father's name[a], and you do not receive me. If another comes in his own name[b], you will receive him.
translation:
  language: ru
  text: Я пришёл во имя Моего Отца[a], и вы Меня не принимаете. Если другой придёт во имя своё[b], его вы примете.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с полномочиями Моего Отца». Оборот «во имя» может обозначать действие как представителя, наделённого властью.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по собственной власти». Выражение «во имя своё» резко противопоставлено словам Иисуса о том, что Он пришёл во имя Своего Отца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: Я пришёл
  rationale: Русское прошедшее совершенного вида естественно передаёт совершившийся приход Иисуса с сохраняющимся результатом; буквальное воспроизведение греческого перфекта формой «пришёл и пребываю» было бы избыточно истолковывающим.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: во имя Моего Отца
  rationale: Сохраняет греческий образ и его смысловой диапазон — имя, представительство и полномочия, — не сводя выражение только к власти.
- source_word: οὐ λαμβάνετέ με
  choice: вы Меня не принимаете
  rationale: В данном контексте λαμβάνω означает принять или признать Иисуса, а не физически взять; «принимать» также позволяет сохранить повтор с будущей формой того же глагола.
- source_word: ἄλλος
  choice: другой
  rationale: Прямо сохраняет контраст между Иисусом и неопределённым иным лицом, не добавляя его идентификации.
- source_word: ἐν τῷ ὀνόματι τῷ ἰδίῳ
  choice: во имя самого себя
  rationale: Передаёт усилительное τῷ ἰδίῳ и сохраняет параллель с «во имя Моего Отца», подчёркивая самостоятельное притязание без сведения смысла лишь к полномочиям.
- source_word: ἐκεῖνον λήμψεσθε
  choice: его вы примете
  rationale: Повтор «примете» воспроизводит риторическое противопоставление форм одного λαμβάνω; вынесенное «его» передаёт указательно-контрастную силу ἐκεῖνον.
theological_decisions:
- issue: Следует ли прямо пояснить в основном тексте, что Отец — Бог
  choice: Сохранить «Моего Отца» и использовать прописные буквы
  alternative: Добавить «Бога, Моего Отца» или писать со строчной буквы
  rationale: Контекст Евангелия ясно указывает на Бога, а традиционная русская капитализация обозначает божественный референт, не добавляя отсутствующих в греческом слов.
- issue: Следует ли переводить обороты с ὄνομα исключительно языком полномочий
  choice: Сохранить параллельные обороты «во имя…» в основном тексте
  alternative: «по полномочию Моего Отца» / «по собственной власти»
  rationale: Оборот включает представительство и полномочия, но не исчерпывается ими; буквальный образ сохраняет смысловую широту и резкий контраст двух частей стиха.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены параллелизм двух оборотов «во имя» и повтор глагола «принимать». Местоимения, относящиеся к Иисусу и Отцу, написаны с прописной буквы согласно принятому благоговейному регистру; «другой» оставлено со строчной.
