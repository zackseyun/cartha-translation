id: JHN.5.14
reference: John 5:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μετὰ ταῦτα εὑρίσκει αὐτὸν ὁ Ἰησοῦς ἐν τῷ ἱερῷ καὶ εἶπεν αὐτῷ· Ἴδε ὑγιὴς γέγονας· μηκέτι ἁμάρτανε, ἵνα μὴ χεῖρόν ⸂σοί τι⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/014.yaml
  text: After these things Jesus found him in the temple and said to him[a], “See, you have become well. Sin no more[c][b], so that something worse may not happen to you.”
translation:
  language: ru
  text: 'После этого Иисус нашёл его в храме и сказал ему: «Вот, ты выздоровел[a]. Больше не греши, чтобы с тобой не случилось чего-нибудь худшего[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «ты стал здоров»; греческая форма подчёркивает наступившее и сохраняющееся состояние здоровья.'
    reason: lexical_alternative
  - marker: b
    text: Предупреждение не уточняет, была ли прежняя болезнь вызвана каким-либо конкретным грехом и означает ли «худшее» земное страдание, окончательный суд или и то и другое.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: После этого
  rationale: Естественная современная русская формула повествовательного перехода; передаёт последовательность событий, хотя греческое выражение буквально имеет множественное число.
- source_word: εὑρίσκει
  choice: нашёл
  rationale: Греческий исторический презенс естественно передаётся русским прошедшим временем в повествовании.
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: ἱερόν обозначает храмовый комплекс; краткое «в храме» точно и не добавляет локализации во дворах.
- source_word: Ἴδε
  choice: Вот
  rationale: Передаёт привлечение внимания естественно и без архаического оттенка.
- source_word: ὑγιὴς γέγονας
  choice: ты выздоровел
  rationale: Русский глагол передаёт совершившийся переход к здоровому состоянию и сохраняющийся результат перфекта γέγονας.
- source_word: μηκέτι ἁμάρτανε
  choice: Больше не греши
  rationale: Передаёт требование прекратить грех, не превращая грамматический вид настоящего императива в чрезмерно определённое «не продолжай грешить».
- source_word: ἵνα μὴ χεῖρόν σοί τι γένηται
  choice: чтобы с тобой не случилось чего-нибудь худшего
  rationale: Сохраняет целевое или предупредительно-результативное значение ἵνα μή, неопределённость τι и сравнительное χεῖρον в естественном русском синтаксисе.
theological_decisions:
- issue: Связь греха и страдания в предупреждении Иисуса
  choice: Предупреждение переведено прямо, без утверждения, что прежняя болезнь была наказанием за конкретный грех, и без уточнения природы худшего исхода.
  alternative: Истолковать прежнюю болезнь как прямое наказание за определённый грех либо определить «худшее» только как земное страдание или только как окончательный суд.
  rationale: Греческий текст связывает дальнейший грех с возможностью худшего исхода, но явно не определяет ни причину прежней болезни, ни природу грозящего последствия; эту богословскую напряжённость следует сохранить.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достойный. «После этого» и «Вот» избегают ненужной архаизации; «выздоровел» звучит естественнее буквального «стал здоров», смысл которого сохранён в примечании.
