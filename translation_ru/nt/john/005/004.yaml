  yaml_path: translation/nt/john/005/004.yaml
  text: For an angel would go down into the pool from time to time and stir up the water. Therefore, the first one to step in after the stirring of the water would become well from whatever disease afflicted him.
translation:
  language: ru
  text: Ведь ангел время от времени сходил в купальню и взбалтывал воду. Поэтому первый вошедший в неё после того, как вода приходила в движение, исцелялся[a], какой бы болезнью ни был поражён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот стих, как и вторая половина стиха 3, отсутствует в самых ранних греческих папирусах, в том числе в папирусах 66 и 75 III века, а также в важнейших рукописях IV века — Синайском и Ватиканском кодексах. Он присутствует в византийской традиции большинства рукописей, а также в ранних латинских и сирийских переводах. Многие исследователи считают его ранним добавлением переписчика, поясняющим, почему больные собирались у купальни.
    reason: textual_critical
lexical_decisions:
- source_word: κατὰ καιρὸν
  choice: время от времени
  rationale: Оборот обозначает периодически повторявшееся действие, не указывая на строго установленное время.
- source_word: κατέβαινεν
  choice: сходил
  rationale: Имперфект передаёт обычное повторявшееся действие в прошлом; русский несовершенный вид естественно выражает эту повторяемость.
- source_word: ἐτάρασσεν τὸ ὕδωρ
  choice: возмущал воду
  rationale: Глагол означает приводить воду в движение, взбалтывать; «возмущал» сохраняет образ и соответствует достоинству библейского регистра.
- source_word: ἐμβὰς
  choice: входил в неё
  rationale: Причастие аориста указывает на вхождение в купальню; местоимение «неё» естественно уточняет подразумеваемый объект.
- source_word: ὑγιὴς ἐγίνετο
  choice: исцелялся
  rationale: 'Имперфект выражает повторявшийся результат: всякий раз первый вошедший становился здоровым. «Исцелялся» передаёт смысл естественно и кратко.'
- source_word: ᾧ δήποτε κατείχετο νοσήματι
  choice: какой бы болезнью ни был поражён
  rationale: Конструкция подчёркивает отсутствие исключений, а пассивное κατείχετο с обозначением болезни идиоматически означает, что болезнь владела человеком или поражала его.
theological_decisions:
- issue: Текстологический статус стиха
  choice: Стих переведён по указанному византийскому исходному тексту, а существенное разночтение отмечено в сноске.
  alternative: Опустить стих из основного текста или заключить его в скобки.
  rationale: Заданный источник включает стих, поэтому он переводится как основной текст; при этом ранняя рукописная традиция требует ясного текстологического уведомления без замалчивания спорности.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повторяемость обоих действий, выраженная греческими имперфектами, передана несовершенным видом: «сходил», «исцелялся». Союз γάρ передан как «ведь», поскольку стих объясняет предшествующее повествование.'
