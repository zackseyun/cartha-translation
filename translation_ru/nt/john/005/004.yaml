revisions:
- from: Ведь ангел время от времени сходил в купальню и возмущал воду. И кто первым входил в неё после того, как вода приходила в движение, тот исцелялся[a], какой бы болезнью ни был поражён.
  to: Ведь ангел время от времени сходил в купальню и взбалтывал воду. Поэтому первый вошедший в неё после того, как вода приходила в движение, исцелялся[a], какой бы болезнью ни был поражён.
  rationale: Правка уточняет физический смысл «взбалтывал воду», делает описание первого человека, вошедшего после движения воды, более естественным и ближе к греческому причастию, а также отчётливо передаёт выводное οὖν. Несовершенный вид «сходил», «приходила в движение», «исцелялся» сохраняет повторяемый характер описываемого правила. Сноска сохранена и стилистически сглажена без изменения её текстологического содержания.
