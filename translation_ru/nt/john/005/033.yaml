base_translation:
  language: en
  yaml_path: translation/nt/john/005/033.yaml
  text: You have sent to John[a], and he has testified to the truth.
translation:
  language: ru
  text: Вы послали к Иоанну, и он засвидетельствовал об истине.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дал свидетельство истине».'
    reason: Лексически допустимый вариант для греческого глагола μαρτυρέω; основной текст сохраняет естественный современный русский оборот «засвидетельствовать об истине».
lexical_decisions:
- source_word: ὑμεῖς
  choice: Вы
  rationale: Личное местоимение сохранено, хотя лицо уже выражено формой глагола; в русском тексте оно естественно передаёт лёгкое смысловое выделение без усилительного «сами».
- source_word: ἀπεστάλκατε
  choice: посылали людей
  rationale: Перфект обозначает совершённое прежде действие, значимое для настоящего рассуждения. Русское «посылали» естественно отсылает к известному эпизоду; слово «людей» восполняет подразумеваемый объект посылки и делает фразу ясной.
- source_word: πρὸς Ἰωάννην
  choice: к Иоанну
  rationale: Предлог πρός с именем лица обозначает направление к нему. Уточнение «Крестителю» не добавлено, поскольку греческий текст называет его просто Иоанном.
- source_word: μεμαρτύρηκε
  choice: засвидетельствовал
  rationale: Совершенный вид передаёт состоявшееся свидетельство, сохраняющее значение в настоящем контексте, а само слово удерживает юридико-свидетельскую окраску глагола.
- source_word: τῇ ἀληθείᾳ
  choice: истину
  rationale: При глаголе «засвидетельствовать» винительный падеж по-русски естественно передаёт греческий дательный объекта свидетельства. Определённость греческого выражения здесь выражается лексически и контекстуально, поскольку в русском языке нет артикля.
theological_decisions:
- issue: Иоанновское употребление понятия «истина»
  choice: истину
  alternative: об истине
  rationale: Выбор сохраняет богословски значимое понятие без уточнения его содержания и без сведения его к простой правдивости. Вариант «об истине» также возможен, но несколько ослабляет прямую связь свидетельства с истиной.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно торжественный. Формулировка избегает архаичного «свидетельствовал истине» и не добавляет титул Иоанна, отсутствующий в исходном тексте.
