lexical_decisions:
- source_word: Ἐὰν
  choice: Если
  rationale: Передаёт условное значение без добавления оттенка повторяемости.
- source_word: ἐγὼ
  choice: Я
  rationale: Явное местоимение сохраняет лёгкое смысловое выделение говорящего.
- source_word: μαρτυρῶ
  choice: свидетельствую
  rationale: Естественно передаёт речь свидетеля и сохраняет юридико-доказательный оттенок глагола.
- source_word: περὶ ἐμαυτοῦ
  choice: Сам о Себе
  rationale: Точно передаёт значение «о самом себе»; порядок слов естественен для русского языка и сохраняет акцент на самостоятельном свидетельстве.
- source_word: ἡ μαρτυρία μου
  choice: Моё свидетельство
  rationale: Сохраняет родство с глаголом «свидетельствую» и доказательный контекст.
- source_word: οὐκ ἔστιν ἀληθής
  choice: не истинно
  rationale: Прямо передаёт ἀληθής и не снимает напряжение с Ин 8:14 посредством сужения смысла до одной лишь юридической действительности.
theological_decisions:
- issue: Смысл слов Иисуса о том, что Его свидетельство «не истинно»
  choice: Сохранить прямую формулировку «не истинно».
  alternative: «не имеет силы» или «не считается достоверным»
  rationale: Греческое ἀληθής прямо означает «истинный», хотя контекст свидетельских показаний допускает юридический смысл действительности или достаточности. Основной текст сохраняет богословское напряжение, а примечание сообщает контекстуальную альтернативу.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достойный регистр. Заглавные буквы в местоимениях, относящихся к Иисусу, соответствуют принятой русской библейской издательской традиции; синтаксис остаётся ясным для широкого читателя.
