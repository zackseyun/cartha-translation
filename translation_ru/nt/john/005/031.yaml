  text: Если Я свидетельствую о Себе, Моё свидетельство не истинно.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моё свидетельство не имеет силы» — в контексте правил о свидетельских показаниях.'
