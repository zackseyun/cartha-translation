base_translation:
  language: en
  yaml_path: translation/nt/john/005/042.yaml
  text: 'But I know you: you do not have the love of God in yourselves.'
translation:
  language: ru
  text: 'Но Я знаю вас: в вас нет любви к Богу.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «любви Бога». Хотя в данном контексте наиболее вероятно «любви к Богу», греческое выражение может также означать «любви Бога» или «любви, исходящей от Бога».'
    reason: Альтернативное понимание неоднозначного родительного падежа.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт сильное противопоставление предшествующему контексту естественным русским союзом.
- source_word: ἔγνωκα
  choice: Я знаю
  rationale: Перфект выражает установившееся знание; настоящее время по-русски естественно передаёт его статальное значение.
- source_word: ὑμᾶς
  choice: вас
  rationale: Прямое дополнение во множественном числе.
- source_word: ὅτι
  choice: ':'
  rationale: Двоеточие естественно вводит содержание того, что Иисус знает о собеседниках.
- source_word: τὴν ἀγάπην τοῦ θεοῦ
  choice: любви Божьей
  rationale: 'Сохраняет родительную конструкцию и её подлинную неоднозначность: любовь к Богу либо любовь, исходящая от Бога или принадлежащая Ему.'
- source_word: οὐκ ἔχετε
  choice: нет
  rationale: Русская конструкция «в вас нет» ясно и естественно передаёт отсутствие внутренне присущего качества.
- source_word: ἐν ἑαυτοῖς
  choice: в вас
  rationale: Передаёт внутреннее наличие или отсутствие; в сочетании с «нет» звучит современнее и естественнее буквального «в самих себе».
theological_decisions:
- issue: Значение родительного падежа в выражении τὴν ἀγάπην τοῦ θεοῦ
  choice: В основном тексте сохранено неоднозначное «любви Божьей».
  alternative: «любви к Богу»; «любви, исходящей от Бога»; «Божьей любви»
  rationale: Греческий генитив допускает как объективное значение (любовь к Богу), так и субъектное либо более широкое значение (любовь Бога или исходящая от Него). Контекст поддерживает первое, но грамматика не требует окончательно устранять неоднозначность.
translation_notes:
  register: Современный литературный русский язык; речь краткая, прямая и достойная. Заглавная буква в «Я» отражает традиционное благоговейное оформление речи Иисуса. Форма «Божьей» естественна для современного читателя и сохраняет смысловую неоднозначность оригинала.
