  source_fidelity: 'Основной смысл передан верно: Иисус заявляет о Своём знании слушателей и об отсутствии в них любви. Однако русское «любовь Божья» обычно понимается прежде всего как любовь, принадлежащая Богу или исходящая от Него, тогда как в данном контексте наиболее вероятно объективное значение генитива — любовь к Богу. Сноска верно отмечает грамматическую возможность иных оттенков, но основной текст и её формулировка создают ненужное впечатление, будто «Божья любовь» столь же прямо выражает «любовь к Богу».'
