lexical_decisions:
- source_word: ὁ πέμψας με πατὴρ
  choice: пославший Меня Отец
  rationale: Причастный оборот естественно передаёт определительное значение греческого артиклированного причастия и сохраняет достоинство русской библейской речи.
- source_word: ἐκεῖνος
  choice: Он Сам
  rationale: Так передаётся усилительное указательное значение без неестественного для русского языка «тот» после уже названного Отца.
- source_word: μεμαρτύρηκεν
  choice: засвидетельствовал
  rationale: Глагол сохраняет смысл свидетельства, а совершенный вид передаёт совершившееся действие с сохраняющейся значимостью.
- source_word: περὶ ἐμοῦ
  choice: обо Мне
  rationale: Естественное современное соответствие περί с родительным падежом.
- source_word: οὔτε ... οὔτε
  choice: не ... и не
  rationale: В данном русском предложении эта конструкция естественнее буквального «ни ... ни» при сохранении двойного отрицания.
- source_word: φωνὴν αὐτοῦ
  choice: Его голоса
  rationale: φωνή в контексте слышания непосредственно означает голос.
- source_word: πώποτε ἀκηκόατε
  choice: никогда не слышали
  rationale: Отрицание вместе с πώποτε идиоматично передаётся русским «никогда»; форма прошедшего времени естественно выражает отсутствие такого опыта до настоящего момента.
- source_word: εἶδος αὐτοῦ
  choice: Его облика
  rationale: «Облик» охватывает видимую форму или внешний вид и не уточняет природу восприятия сверх греческого текста.
- source_word: ἑωράκατε
  choice: не видели
  rationale: Естественное русское выражение отсутствия зрительного опыта, соответствующее греческому перфекту в контексте.
theological_decisions:
- issue: Усилительное ἐκεῖνος по отношению к Отцу
  choice: Он Сам засвидетельствовал обо Мне
  alternative: тот засвидетельствовал обо Мне
  rationale: «Он Сам» сохраняет акцент на Отце как свидетеле Иисуса, не привнося дополнительных богословских утверждений и не создавая стилистической шероховатости.
- issue: Значение εἶδος αὐτοῦ
  choice: Его облика
  alternative: Его вида / Его формы
  rationale: «Облик» сохраняет возможность понимать слово как видимую форму или явление, не разрешая заложенную в тексте смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Прописные местоимения при обращении ко Христу и упоминании Отца следуют принятой русской религиозно-издательской традиции. Конечная запятая сохранена, поскольку стих синтаксически продолжается далее.
