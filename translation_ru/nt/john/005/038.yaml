base_translation:
  language: en
  yaml_path: translation/nt/john/005/038.yaml
  text: And you do not have his word abiding in you[a], because you do not believe the one whom he sent.
translation:
  language: ru
  text: И слово Его не пребывает в вас, потому что вы не верите Тому, Кого Он послал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λόγον
  choice: слова
  rationale: «Слово» прямо передаёт λόγος как Божье открытое слово и сохраняет характерную для Иоанна лексику.
- source_word: ἔχετε ... ἐν ὑμῖν μένοντα
  choice: нет в вас пребывающим
  rationale: Конструкция передаёт отсутствие продолжающегося внутреннего присутствия слова; «пребывать» естественно вписывается в богословский словарь Иоанна и сохраняет длительный оттенок μένω.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит причину утверждения первой части стиха.
- source_word: ὃν ἀπέστειλεν ἐκεῖνος
  choice: Тому, Кого Он послал
  rationale: Относительная конструкция относится к Иисусу как Посланному Отцом; прописные местоимения соответствуют принятой русской библейской издательской практике, не добавляя нового смысла.
- source_word: τούτῳ ... οὐ πιστεύετε
  choice: вы не верите Тому
  rationale: Дательный падеж при πιστεύω передан русской конструкцией «верить кому»; вынесенное τούτῳ сохраняется посредством ударного «Тому».
theological_decisions:
- issue: Связь между пребыванием Божьего слова в людях и их неверием Посланному
  choice: Неверие Посланному названо причиной или свидетельством того, что слово Отца не пребывает в них.
  alternative: Можно понимать речь уже и конкретнее — как неспособность внутренне хранить или принимать Писание.
  rationale: Перевод сохраняет причинную связь ὅτι и не вводит частного учения о возрождении, просвещении или неотступности.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Основной текст несколько формальнее обычной речи ради сохранения конструкции «иметь слово пребывающим»; сноска предлагает более естественный русский синтаксис.
