  text: καὶ εὐθέως ἐγένετο ὑγιὴς ὁ ἄνθρωπος καὶ ἦρε τὸν κράβαττον αὐτοῦ καὶ περιεπάτει. Ἦν δὲ σάββατον ἐν ἐκείνῃ τῇ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/009.yaml
  text: And immediately the man became well[a], and he picked up his mat and began to walk[c][b]. Now that day was a Sabbath.
translation:
  language: ru
  text: И тотчас человек выздоровел, взял свою подстилку[a] и стал ходить[b]. День же тот был субботой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свою постель». Греческое κράβαττον обозначает простую подстилку, тюфяк или переносное спальное место, а не обязательно кровать как предмет мебели.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ходил». Форма греческого глагола может подчёркивать продолжавшееся действие; в данном контексте её можно также понимать как начало ходьбы после исцеления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: тотчас
  rationale: Передаёт мгновенность исцеления и сохраняет достойный повествовательный стиль.
- source_word: ἐγένετο ὑγιὴς
  choice: выздоровел
  rationale: Естественно выражает переход человека из болезненного состояния в здоровое, не добавляя явно выраженного в греческом тексте деятеля.
- source_word: ὁ ἄνθρωπος
  choice: человек
  rationale: Точно передаёт ἄνθρωπος и естественно отсылает к уже известному участнику повествования.
- source_word: ἦρε
  choice: взял
  rationale: В данном контексте означает, что исцелённый поднял и понёс переносную постель; «взял» звучит естественно и не перегружает фразу.
- source_word: κράβαττον
  choice: подстилку
  rationale: Обозначает простую переносную постель или тюфяк, а не предмет мебели, который современный читатель обычно представляет при слове «кровать».
- source_word: περιεπάτει
  choice: стал ходить
  rationale: Передаёт имперфект как начавшееся и продолжавшееся действие после исцеления, не сводя значение к одному шагу.
- source_word: Ἦν δὲ
  choice: День же тот был
  rationale: Частица δέ вводит поясняющее повествовательное замечание; «же» сохраняет переход без чрезмерно сильного противопоставления.
- source_word: σάββατον
  choice: субботой
  rationale: В русском языке прямо обозначает день субботнего покоя; творительный падеж естественен после «был».
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: день тот
  rationale: Смысл временного оборота естественно включён в русскую именную конструкцию «день тот был субботой».
theological_decisions:
- issue: Передача σάββατον как повествовательной временной пометы
  choice: День же тот был субботой
  alternative: А это было в субботу
  rationale: Выбранный вариант сохраняет отдельное поясняющее предложение и близко следует структуре греческого текста, не внося дополнительных конфессиональных оттенков.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным повествовательным тоном. Синтаксис сохраняет последовательность действий и отдельную помету о субботе; архаизмы и конфессионально маркированные формулы не используются.
