  naturalness: 'Текст в целом звучит естественно для современного литературного русского с уместно возвышенным евангельским регистром. «Ответил и сказал им» несколько традиционно, но прозрачно и оправдано близостью к исходнику. Строчная буква в «от себя» соответствует обычной русской орфографии: это возвратное местоимение относится к Сыну, а не титул.'
  terminology: '«Сын» и «Отец» удачно оформлены как титулы. Примечание b следует заменить: его утверждение о «полной нераздельности» является богословским выводом, а не необходимым текстологическим пояснением; примечание должно объяснять выделенное ἐκεῖνος и параллелизм, не навязывая доктринального вывода.'
