source:
  edition: SBLGNT
  text: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ⸀ἔλεγεν αὐτοῖς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν ⸀ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα· ἃ γὰρ ἂν ἐκεῖνος ποιῇ, ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/019.yaml
  text: So Jesus answered and said to them[a], “Truly, truly, I say to you, the Son is not able to do anything from himself unless he sees the Father doing it; for whatever that one does[b], these things the Son also does likewise.”
translation:
  language: ru
  text: 'Итак, Иисус ответил и сказал им: «Истинно, истинно говорю вам: Сын ничего не может делать от себя[a], если не видит, что делает Отец. Ведь что бы Он ни делал, то и Сын делает так же[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более идиоматично: «Сын не может ничего делать сам по себе, кроме того, что видит, как делает Отец».'
    reason: lexical_alternative
  - marker: b
    text: «Он» передаёт выделенное в греческом тексте «Тот», то есть Отец; оборот «что бы… ни — то и» выражает полное соответствие действий.
    reason: lexical_note
lexical_decisions:
- source_word: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ἔλεγεν αὐτοῖς
  choice: Итак, Иисус ответил им
  rationale: '«Итак» передаёт связующую и выводную силу οὖν. Сочетание аориста ἀπεκρίνατο и имперфекта ἔλεγεν естественно передано одной русской формулой речи: буквальное «ответил и говорил» здесь было бы тяжеловесно.'
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: Истинно, истинно говорю вам
  rationale: Сохраняются торжественное удвоение и формула настоящего времени; выражение понятно современному читателю и соответствует возвышенному регистру.
- source_word: οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν
  choice: Сын ничего не может делать от Себя
  rationale: Переданы способность/невозможность в οὐ δύναται и буквальная направленность ἀφ’ ἑαυτοῦ. Формулировка сохраняет утверждение о нераздельности действий Сына и Отца, не подменяя его пояснением о намерении.
- source_word: ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα
  choice: если не видит, что делает Отец
  rationale: Русская придаточная конструкция естественно выражает исключительное условие и охватывает неопределённое τι без искусственного «делающим что-либо».
- source_word: ἃ γὰρ ἂν ἐκεῖνος ποιῇ
  choice: Ведь что бы Он ни делал
  rationale: Оборот «что бы… ни» передаёт обобщающее значение относительного местоимения с ἄν и сослагательным наклонением. Местоимение указывает на Отца; прописная буква помогает избежать двусмысленности в русском тексте.
- source_word: ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ
  choice: то и Сын делает так же
  rationale: Корреляция «что бы… то и» сохраняет соответствие ἃ… ταῦτα, а «так же» передаёт ὁμοίως без избыточного повторения.
theological_decisions:
- issue: Невозможность Сына действовать «от Себя»
  choice: Сын ничего не может делать от Себя
  alternative: Сын ничего не может делать самостоятельно
  rationale: Сохранена напряжённость исходного утверждения о зависимости и полном единстве действий. «Самостоятельно» могло бы сильнее внушать мысль об отдельной инициативе и тем самым уже истолковывать текст.
- issue: Обозначения Сына и Отца
  choice: Сын / Отец
  alternative: сын / отец
  rationale: В контексте это определённые соотносительные наименования Иисуса и Бога; прописные буквы ясны русскому читателю и не добавляют к тексту конфессионального толкования.
- issue: Соотношение зависимости Сына и Его достоинства
  choice: Основной текст оставлен без догматического уточнения; пояснение ограничено утверждением о нераздельности действий
  alternative: Добавить в основной текст формулу о божестве или равенстве Сына
  rationale: Исходный стих говорит о невозможности независимого действия и о полном соответствии действий Сына действиям Отца. Перевод не должен ни ослаблять это утверждение, ни вносить отсутствующую догматическую формулу.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельской речи. Синтаксис сделан естественным для обычного читателя, при этом сохранены двойное «истинно», титулы «Сын» и «Отец», категоричность οὐ δύναται и обобщающее «что бы… ни».
