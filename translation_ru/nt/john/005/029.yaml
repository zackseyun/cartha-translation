  yaml_path: translation/nt/john/005/029.yaml
  text: and will come out—those who have done good to the resurrection of life[a], but those who have done evil to the resurrection of judgment.
translation:
  language: ru
  text: 'и выйдут: делавшие добро — в воскресение жизни, а творившие зло — в воскресение суда.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в воскресение осуждения». В греческом тексте стоит слово «суд», имеющее более широкое значение; «осуждение» — более узкое толкование, принятое в некоторых переводах.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύσονται
  choice: выйдут
  rationale: В контексте выхода умерших из гробниц (ст. 28–29) это естественный современный русский эквивалент, передающий движение наружу.
- source_word: τὰ ἀγαθὰ ποιήσαντες
  choice: делавшие добро
  rationale: Субстантивированное τὰ ἀγαθὰ обозначает добро как предмет поступков; причастие аориста обобщает совершённые дела.
- source_word: ἀνάστασιν ζωῆς
  choice: в воскресение жизни
  rationale: Сохраняет генитивную конструкцию и параллелизм с ἀνάστασιν κρίσεως, не заменяя её более толковательным «воскресением для жизни».
- source_word: τὰ φαῦλα πράξαντες
  choice: творившие зло
  rationale: φαῦλα в контексте суда имеет нравственный смысл «зло»; «творившие» естественно передаёт πράξαντες и сохраняет умеренное лексическое различие с ποιήσαντες.
- source_word: ἀνάστασιν κρίσεως
  choice: в воскресение суда
  rationale: κρίσις прежде всего означает «суд»; этот перевод не сужает значение до «осуждения» и сохраняет смысловую напряжённость оригинала.
- source_word: δὲ
  choice: а
  rationale: Русский противительный союз ясно и естественно обозначает контраст между двумя группами и исходами.
theological_decisions:
- issue: Следует ли передавать κρίσεως более узко как «осуждения» или шире как «суда»
  choice: суда
  alternative: осуждения
  rationale: Само слово κρίσις не требует более узкого значения «осуждение». «Суд» сохраняет широту греческого слова, не устраняя сурового контраста стиха.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной библейской интонацией. Двоеточие и тире делают симметрию двух групп явной без добавления отсутствующих в оригинале смысловых связей.
