id: JHN.5.20
reference: John 5:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ γὰρ πατὴρ φιλεῖ τὸν υἱὸν καὶ πάντα δείκνυσιν αὐτῷ ἃ αὐτὸς ποιεῖ, καὶ μείζονα τούτων δείξει αὐτῷ ἔργα, ἵνα ὑμεῖς θαυμάζητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/020.yaml
  text: For the Father loves the Son and shows him all that he himself is doing; and he will show him greater works than these[a], so that you may marvel.
translation:
  language: ru
  text: Ведь Отец любит Сына и показывает Ему всё, что Сам делает. Он покажет Ему и дела, более великие, чем эти[a], чтобы вы изумились.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «так что вы изумитесь». Греческая конструкция с ἵνα и сослагательным наклонением может выражать цель, а в данном контексте также допускать оттенок последующего изумления слушателей Иисуса.'
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: любит
  rationale: Передаёт личную любовь Отца к Сыну без искусственного ослабления смысла; в употреблении Иоанна φιλέω может пересекаться по значению с ἀγαπάω.
- source_word: δείκνυσιν ... δείξει
  choice: показывает ... покажет
  rationale: Сохраняет прямое значение и лексическую связь настоящей и будущей форм одного греческого глагола.
- source_word: πάντα ἃ αὐτὸς ποιεῖ
  choice: всё, что Сам делает
  rationale: Естественно передаёт полноту πάντα и эмфатическое αὐτός; настоящее время не требует в русском языке тяжеловесной формы «делает сейчас».
- source_word: μείζονα τούτων ... ἔργα
  choice: дела больше этих
  rationale: Сохраняет сравнительную конструкцию и характерный для Иоанна термин «дела», не сводя его только к чудесам или знамениям.
- source_word: ἵνα ὑμεῖς θαυμάζητε
  choice: чтобы вы изумлялись
  rationale: Передаёт ἵνα с сослагательным наклонением как целевую конструкцию, сохраняя при этом возможный оттенок результата; множественное «вы» обращено к слушателям Иисуса.
theological_decisions:
- issue: Характер любви Отца к Сыну, выраженной глаголом φιλέω
  choice: «любит» без указания на меньшую или лишь человеческую привязанность
  alternative: «питает привязанность»
  rationale: Более узкая формулировка могла бы привнести не требуемое текстом различие между φιλέω и ἀγαπάω и ослабить высказывание об отношении Отца и Сына.
- issue: Целевой или результативный смысл ἵνα ὑμεῖς θαυμάζητε
  choice: «чтобы вы изумлялись»
  alternative: «так что вы изумитесь» / «чтобы вы изумились»
  rationale: Основной текст сохраняет обычную целевую форму, а примечание отмечает допустимый в контексте оттенок ожидаемого результата, не снимая неоднозначности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Ему» и «Сам» написаны с прописной буквы по принятой русской библейской традиции; синтаксис разбит на два предложения для ясности. «Изумлялись» сохраняет возвышенный, но понятный оттенок θαυμάζω.
