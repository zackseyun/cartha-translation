- from: Ведь Отец любит Сына и показывает Ему всё, что Сам делает. Он покажет Ему и дела больше этих[a], чтобы вы изумлялись.
  to: Ведь Отец любит Сына и показывает Ему всё, что Сам делает. Он покажет Ему и дела, более великие, чем эти[a], чтобы вы изумились.
  rationale: Уточнена сравнительная конструкция, чтобы точно передать μείζονα τούτων ἔργα и устранить русскую двусмысленность. «Чтобы вы изумились» более естественно сочетается с будущим «покажет» и не устраняет возможного целевого либо результативного оттенка ἵνα, который отмечен в сноске.
