  verdict: revise
  source_fidelity: 'Смысл передан в целом точно: φιλεῖ — «любит», δείκνυσιν/δείξει — «показывает/покажет», а эмфатическое αὐτός адекватно отражено словом «Сам». Однако «дела больше этих» в современном русском звучит неестественно и может быть понято как указание на размер либо количество, а не на сравнительное превосходство дел.'
  naturalness: «Чтобы вы изумлялись» грамматически возможно, но в связи с будущим единичным «покажет» звучит менее естественно, чем «чтобы вы изумились». Формулировка «дела, более великие, чем эти» ясна, литературна и сохраняет достойный библейский регистр.
  terminology: «Отец», «Сын» и «дела» сохранены. «Дела» удачно передаёт ἔργα, не сужая его до чудес. Прописные буквы в местоимениях соответствуют заявленной библейской редакционной традиции.
