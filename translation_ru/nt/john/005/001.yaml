id: JHN.5.1
reference: John 5:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ⸀ἦν ἑορτὴ τῶν Ἰουδαίων, καὶ ⸀ἀνέβη Ἰησοῦς εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/001.yaml
  text: After these things[a], there was a feast of the Jews[b], and Jesus went up to Jerusalem.
translation:
  language: ru
  text: После этого был иудейский праздник, и Иисус поднялся в Иерусалим.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: После этого
  rationale: Естественная современная русская переходная формула; передаёт связь с предшествующими событиями, а множественное ταῦτα по-русски идиоматично выражается единственным «этого».
- source_word: ἦν
  choice: был
  rationale: В сочетании с «праздник» естественно вводит событие и сохраняет значение имперфекта без излишнего уточнения длительности.
- source_word: ἑορτὴ τῶν Ἰουδαίων
  choice: иудейский праздник
  rationale: Передаёт религиозный праздник, отмечаемый иудейским народом; атрибутивная конструкция естественнее по-русски, чем буквальное «праздник иудеев».
- source_word: ἀνέβη
  choice: поднялся
  rationale: Сохраняет направленность движения вверх — как географическую, так и традиционно связанную с паломничеством в Иерусалим.
- source_word: Ἱεροσόλυμα
  choice: Иерусалим
  rationale: Устоявшаяся русская форма географического названия.
theological_decisions:
- issue: Значение Ἰουδαίων в данном контексте
  choice: иудейский
  alternative: юдейский / праздник иудеев / праздник жителей Иудеи
  rationale: Здесь слово характеризует религиозное празднование народа, а не региональную принадлежность жителей Иудеи. «Иудейский» точно и нейтрально передаёт этот смысл, не привнося полемического оттенка.
- issue: Неопределённость конкретного праздника
  choice: праздник без уточнения
  alternative: конкретное название праздника
  rationale: Греческий текст не называет праздник, поэтому перевод не отождествляет его ни с Пасхой, ни с каким-либо другим праздником.
translation_notes:
  register: Современный литературный русский язык; краткий, повествовательный и достойный стиль. Синтаксис естественный, при этом сохранены ключевые пространственные и культурно-религиозные нюансы оригинала.
