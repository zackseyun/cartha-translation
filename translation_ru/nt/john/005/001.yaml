  source_fidelity: 'Текст точно передаёт греческий оригинал: «После этого» естественно воспроизводит Μετὰ ταῦτα; «был» соответствует вводному ἦν; «иудейский праздник» верно передаёт ἑορτὴ τῶν Ἰουδαίων без необоснованной идентификации праздника; «поднялся в Иерусалим» сохраняет смысл ἀνέβη и традиционный для пути в Иерусалим пространственный оттенок.'
