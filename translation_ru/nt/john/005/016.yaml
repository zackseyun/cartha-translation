base_translation:
  language: en
  yaml_path: translation/nt/john/005/016.yaml
  text: And because of this the Jews were persecuting Jesus[a], because he was doing these things on the Sabbath.
translation:
  language: ru
  text: И потому иудеи[a] преследовали Иисуса за то, что Он делал всё это в субботу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные варианты: «иудеяне» или, по смыслу данного контекста, «иудейские вожди». У Иоанна это слово часто обозначает определённую группу противников Иисуса, а не всех евреев без различия.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: и потому
  rationale: Оборот указывает на предшествующее событие как на причину враждебного отношения; «и потому» естественно передаёт причинно-следственную связь.
- source_word: ἐδίωκον
  choice: преследовали
  rationale: Имперфект выражает продолжающееся или повторявшееся враждебное действие; «преследовали» не привносит ещё не высказанного здесь намерения убить.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Это прямое обозначение группы в греческом тексте. Контекст может сужать круг подразумеваемых лиц, однако такое уточнение лучше сохранить в сноске, а не вводить в основной текст.
- source_word: ταῦτα
  choice: это
  rationale: Хотя греческое местоимение имеет форму множественного числа, в современном русском «делал это» естественно отсылает к описанным действиям в целом; буквальное «эти вещи» здесь неидиоматично.
- source_word: ἐποίει
  choice: делал
  rationale: В сочетании с контекстом несовершенный вид русского глагола передаёт длительный или повторный характер имперфекта без тяжеловесной конструкции.
- source_word: ἐν σαββάτῳ
  choice: в субботу
  rationale: Обычный и естественный русский способ обозначить время действия; он сохраняет отсылку к субботнему дню.
theological_decisions:
- issue: Кого обозначает οἱ Ἰουδαῖοι в данном контексте Евангелия от Иоанна
  choice: иудеи
  alternative: жители Иудеи; в данном контексте — иудейские вожди
  rationale: Основной текст сохраняет прямое и не суженное заранее обозначение исходника. Сноска предупреждает, что в повествовании Иоанна слово нередко относится к конкретной группе противников Иисуса, а не ко всем евреям без различия.
translation_notes:
  register: Современный литературный русский язык; изложение краткое и dignified. Заглавная буква в местоимении «Он» соответствует принятому благоговейному регистру русского библейского текста, не изменяя смысла оригинала.
