id: JHN.5.34
reference: John 5:34
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐγὼ δὲ οὐ παρὰ ἀνθρώπου τὴν μαρτυρίαν λαμβάνω, ἀλλὰ ταῦτα λέγω ἵνα ὑμεῖς σωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/034.yaml
  text: But I do not receive testimony from man; rather, I say these things so that you may be saved.
translation:
  language: ru
  text: Но Я не принимаю свидетельства от человека, а говорю это для того, чтобы вы были спасены.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: от человека
  rationale: Предлог παρά с родительным падежом указывает на источник. Единственное число сохранено по греческому тексту; в данном контексте выражение обозначает человеческий источник свидетельства вообще.
- source_word: τὴν μαρτυρίαν
  choice: свидетельства
  rationale: «Свидетельство» естественно сочетается с глаголом «принимать» и сохраняет доказательный, почти судебный оттенок контекста.
- source_word: λαμβάνω
  choice: принимаю
  rationale: Настоящее время передано прямо. «Принимать свидетельство» здесь означает получать или признавать его как свидетельство, без излишнего уточнения смысла.
- source_word: ταῦτα
  choice: это
  rationale: Хотя греческое местоимение имеет форму среднего рода множественного числа, современное русское «это» естественно указывает на сказанное и не требует тяжеловесного «эти вещи».
- source_word: λέγω
  choice: говорю
  rationale: Простое настоящее время естественно передаёт греческий презенс и хорошо сочетается с дополнением «это».
- source_word: ἵνα ὑμεῖς σωθῆτε
  choice: для того, чтобы вы были спасены
  rationale: Оборот ясно передаёт цель, а страдательная конструкция сохраняет пассивную форму σωθῆτε и не уточняет сверх текста, кем и каким образом совершается спасение.
- source_word: δὲ ... ἀλλὰ
  choice: Но ... же
  rationale: Начальное «но» сохраняет связь и противопоставление предшествующему контексту; частица «же» естественно выделяет положительную цель слов Иисуса после отрицания зависимости от человеческого свидетельства.
theological_decisions:
- issue: Смысл выражения «чтобы вы были спасены»
  choice: Сохранена широкая формулировка о спасении без уточнения его механизма или конфессиональной модели.
  alternative: «чтобы вы обрели спасение»; «чтобы вы были избавлены»
  rationale: Глагол σῴζω несёт полный богословский смысл спасения, однако сам стих не конкретизирует его модель. Пассивная формулировка сохраняет и смысл, и напряжение исходного текста.
- issue: Отношение Иисуса к человеческому свидетельству
  choice: «не принимаю свидетельства от человека»
  alternative: «не нуждаюсь в свидетельстве человека»
  rationale: 'Вариант «не нуждаюсь» может верно передавать контекстуальный оттенок, но добавляет понятие нужды, которого непосредственно нет в λαμβάνω. Более формальное «не принимаю» сохраняет неоднозначность: речь может идти о получении, признании или опоре на свидетельство.'
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Заглавная буква в местоимении «Я» соответствует принятому русскому библейскому регистру. Порядок второй части слегка адаптирован для естественного русского синтаксиса, при этом контраст и целевая конструкция сохранены.
