  text: δόξαν παρὰ ἀνθρώπων οὐ λαμβάνω,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/041.yaml
  text: I do not receive glory from men[b][a],
translation:
  language: ru
  text: Я не принимаю славы от людей.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «почёта» или «похвалы» вместо «славы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξαν
  choice: славы
  rationale: «Слава» сохраняет важную для Евангелия от Иоанна лексическую связь с темой славы; в данном контексте слово означает также почёт, похвалу или признание со стороны людей.
- source_word: παρὰ ἀνθρώπων
  choice: от людей
  rationale: Предлог παρά с родительным падежом указывает на источник. Множественное ἀνθρώπων здесь естественно и точно передаётся общеродовым русским словом «людей».
- source_word: οὐ λαμβάνω
  choice: не принимаю
  rationale: λαμβάνω может означать «получать» или «принимать». «Не принимаю» естественно звучит по-русски применительно к славе и не добавляет отсутствующего в греческом тексте значения «не ищу».
theological_decisions:
- issue: Характер утверждения Иисуса о человеческом признании
  choice: Основной текст прямо говорит, что Иисус не принимает славы от людей, не уточняя мотив или абсолютный охват высказывания.
  alternative: 'Передать смысл толковательно: «Я не ищу признания у людей» или понимать это как абсолютное отрицание всякой чести от любого человека.'
  rationale: Контекст указывает на независимость миссии и достоинства Иисуса от человеческого признания, однако греческий текст употребляет λαμβάνω, а не «искать». Буквенная напряжённость сохраняется без внесения толкования в основной текст.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified формулировка с естественным порядком слов. «Людей» точно передаёт общее значение ἀνθρώπων без ненужного гендерного сужения.
