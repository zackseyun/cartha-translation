base_translation:
  language: en
  yaml_path: translation/nt/john/005/039.yaml
  text: You search the Scriptures because you think that in them you have eternal life[a]; and these are the ones that testify about me.
translation:
  language: ru
  text: Вы исследуете Писания, потому что думаете, что в них имеете вечную жизнь[a]; и именно они свидетельствуют обо Мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Исследуйте Писания, потому что думаете, что в них имеете вечную жизнь» — если понимать Ἐραυνᾶτε как повелительное, а не изъявительное наклонение.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐραυνᾶτε
  choice: Вы исследуете
  rationale: Форма допускает изъявительное и повелительное прочтение. В контексте естественнее описание существующей практики собеседников; повелительное прочтение сохранено в сноске.
- source_word: τὰς γραφάς
  choice: Писания
  rationale: Речь идёт о священных текстах Израиля; «Писания» — естественный и устоявшийся русский эквивалент.
- source_word: ὅτι
  choice: потому что
  rationale: 'Союз понят причинно: далее названа причина, по которой собеседники исследуют Писания.'
- source_word: δοκεῖτε
  choice: думаете
  rationale: Передаёт их убеждение или предположение естественным современным языком, не усиливая критический оттенок.
- source_word: ἐν αὐταῖς
  choice: в них
  rationale: Сохраняет прямое пространственно-смысловое значение предлога ἐν и отсылку к Писаниям.
- source_word: ζωὴν αἰώνιον
  choice: вечную жизнь
  rationale: Устоявшийся и последовательный эквивалент характерного для Иоанна выражения.
- source_word: ἐκεῖναί
  choice: именно они
  rationale: Местоимение относится к Писаниям и имеет выделительное значение; частица «именно» естественно передаёт этот акцент по-русски.
- source_word: αἱ μαρτυροῦσαι
  choice: свидетельствуют
  rationale: Сохраняет важную для Иоанна лексику свидетельства и звучит ясно и естественно.
- source_word: περὶ ἐμοῦ
  choice: обо Мне
  rationale: Естественно передаёт περί с родительным падежом в значении «о, относительно».
theological_decisions:
- issue: Наклонение Ἐραυνᾶτε
  choice: 'изъявительное: «Вы исследуете Писания»'
  alternative: 'повелительное: «Исследуйте Писания»'
  rationale: 'Греческая форма грамматически допускает оба прочтения. Ближайший контекст скорее поддерживает изъявительное: Иисус описывает практику собеседников и показывает, что, исследуя Писания, они не приходят к Тому, о Ком те свидетельствуют. Подлинная неоднозначность сохранена в сноске.'
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранена традиционная библейская лексика «Писания», «вечная жизнь», «свидетельствуют», при этом синтаксис остаётся естественным для современного читателя. Местоимение «Мне» написано с прописной буквы в соответствии с распространённой русской издательской практикой для речи о Христе.
