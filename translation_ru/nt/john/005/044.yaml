  yaml_path: translation/nt/john/005/044.yaml
  text: How are you able to believe[c][b][a], receiving glory from one another and not seeking the glory that is from the only God?
translation:
  language: ru
  text: Как вы можете поверить, получая славу[a] друг от друга и не ища славы, которая исходит от единственного Бога[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «почёт» — в обоих случаях вместо «слава» (греч. δόξα).'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «славы, которая исходит от одного-единственного Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασθε ὑμεῖς πιστεῦσαι
  choice: Как вы можете поверить
  rationale: Передаёт риторический вопрос о возможности веры; явное ὑμεῖς естественно выражено местоимением «вы», а аористный инфинитив πιστεῦσαι — совершенным видом «поверить», указывающим на приход к вере без сужения смысла до отдельного доктринального оттенка.
- source_word: δόξαν
  choice: славу
  rationale: «Слава» сохраняет повтор одного и того же греческого слова в обеих частях стиха и контраст между признанием от людей и славой от Бога; контекстуально возможно также «почёт».
- source_word: παρ’ ἀλλήλων λαμβάνοντες
  choice: принимаете славу друг от друга
  rationale: Причастие передано личной формой внутри естественной русской условной конструкции; «друг от друга» точно выражает взаимность, а «принимаете» — получение или принятие человеческой славы.
- source_word: καὶ ... οὐ ζητεῖτε
  choice: а ... не ищете
  rationale: Русское противительное «а» ясно передаёт смысловой контраст, возникающий между человеческим источником славы и Богом, хотя греческое καί формально является соединительным союзом.
- source_word: τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ
  choice: славы, которая исходит от единственного Бога
  rationale: Родительный падеж обусловлен русским управлением при отрицании «не ищете»; относительная конструкция естественно раскрывает определительный оборот, а «единственного Бога» прямо передаёт μόνος.
theological_decisions:
- issue: Значение πιστεῦσαι в контексте Иоанна
  choice: поверить
  alternative: верить; довериться
  rationale: «Поверить» сохраняет широкое значение прихода к вере и согласуется с аористным инфинитивом, не сводя слово исключительно к интеллектуальному признанию или к специально сформулированному понятию доверия.
- issue: Единообразная передача δόξα
  choice: слава в обоих случаях
  alternative: почёт; признание
  rationale: 'Одинаковая передача сохраняет намеренный лексический и богословский контраст: слава, получаемая людьми друг от друга, противопоставлена славе, исходящей от Бога.'
- issue: Передача τοῦ μόνου θεοῦ
  choice: единственного Бога
  alternative: единого Бога; одного только Бога
  rationale: «Единственный Бог» непосредственно выражает исключительность μόνος и сохраняет монотеистическое утверждение текста без дополнительных христологических или конфессиональных уточнений.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Условное «если» делает связь причастного оборота с риторическим вопросом естественной для русского языка. Лексический повтор «слава» сохранён намеренно; все сноски отмечены в основном тексте.
