  rationale: Прямо передаёт собирательное значение большого числа людей и сохраняет несколько возвышенный, но понятный регистр.
- source_word: τῶν ἀσθενούντων
  choice: больных
  rationale: В данном контексте причастие обозначает людей, страдающих телесными недугами; «больных» естественно вводит последующий перечень.
- source_word: τυφλῶν
  choice: слепых
  rationale: Точный и естественный эквивалент обозначения людей, лишённых зрения.
- source_word: χωλῶν
  choice: хромых
  rationale: Передаёт нарушение способности ходить без излишнего расширения значения.
- source_word: ξηρῶν
  choice: иссохших
  rationale: Сохраняет буквальный образ «сухих, иссохших» применительно к телу или конечностям и не сводит неоднозначное обозначение исключительно к параличу.
