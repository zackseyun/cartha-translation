  text: εἰ γὰρ ἐπιστεύετε Μωϋσεῖ, ἐπιστεύετε ἂν ἐμοί, περὶ γὰρ ἐμοῦ ἐκεῖνος ἔγραψεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/046.yaml
  text: For if you believed Moses[a], you would believe me[b], for he wrote about me.
translation:
  language: ru
  text: Ибо если бы вы верили Моисею, то верили бы Мне, ибо он написал обо Мне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Ведь если бы
  rationale: Частица γάρ связывает стих с предыдущим рассуждением и естественно передаётся словом «ведь»; εἰ вводит нереальное условие.
- source_word: ἐπιστεύετε Μωϋσεῖ
  choice: вы верили Моисею
  rationale: Дательный падеж при πιστεύω обозначает того, кому верят. Форма имперфекта в условной конструкции передана современным русским сослагательным оборотом «если бы… верили».
- source_word: ἐπιστεύετε ἂν ἐμοί
  choice: то верили бы и Мне
  rationale: Имперфект с ἄν выражает следствие нереального условия. Дательный ἐμοί точнее передаётся как «Мне», а не «в Меня»; «и» естественно подчёркивает соответствие двух частей.
- source_word: περὶ γὰρ ἐμοῦ
  choice: потому что… обо Мне
  rationale: περί с родительным означает «о, относительно»; повторное γάρ здесь указывает основание, поэтому «потому что» ясно и естественно передаёт связь.
- source_word: ἐκεῖνος
  choice: он
  rationale: Указательное местоимение подчёркнуто отсылает к Моисею, но русское «тот» здесь звучало бы неестественно; контекст сохраняет акцент на Моисее.
- source_word: ἔγραψεν
  choice: писал
  rationale: Аорист сообщает о совершённом в прошлом письменном свидетельстве. Русское «писал» в данном контексте естественно обозначает содержание писаний Моисея, не ограничивая утверждение одним текстом.
theological_decisions:
- issue: Характер свидетельства Моисея об Иисусе
  choice: он писал обо Мне
  alternative: тот написал обо Мне
  rationale: Перевод сохраняет утверждение, что писания Моисея свидетельствуют об Иисусе, но не уточняет, идёт ли речь об одном месте или о более широком свидетельстве, поскольку греческий текст этого не определяет.
- issue: Значение веры в конструкции с дательным падежом
  choice: верили Моисею… верили бы и Мне
  alternative: доверяли Моисею… доверяли бы и Мне
  rationale: Одинаковый русский глагол сохраняет повтор одного и того же греческого πιστεύω. Формулировка «верили Мне» не привносит конструкцию «верить в», отсутствующую в оригинале.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Заглавная буква в «Мне» следует принятой русской библейской практике при обращении Христа к Себе. Синтаксический параллелизм двух форм «верили» сохранён.
