  verdict: approve
  source_fidelity: Текст точно передаёт греческое καὶ οὐ θέλετε ἐλθεῖν πρός με ἵνα ζωὴν ἔχητε. «Но» уместно выявляет контрастное значение καί в данном контексте; «не хотите» сохраняет волевой смысл θέλετε, а «прийти ко Мне» не подменяет образ истолкованием. Конструкция «чтобы иметь жизнь» естественно выражает цель и не добавляет к ζωή определения «вечная».
  naturalness: Формулировка краткая, ясная и литературно естественная для современного русского языка. «Ко Мне» благозвучно после «прийти»; написание «Мне» с прописной буквы последовательно отражает уважительное редакционное оформление речи Иисуса.
  terminology: «Жизнь» — точный эквивалент ζωή и сохраняет богословскую ёмкость без неоправданного расширения до «вечной жизни». Сноска b корректно обозначает характерный для Иоанна контекст, одновременно прямо отмечая, что слово «вечная» в стихе отсутствует. Сноска a верно фиксирует нейтральную альтернативу для καί.
