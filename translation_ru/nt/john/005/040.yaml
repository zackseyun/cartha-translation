  text: καὶ οὐ θέλετε ἐλθεῖν πρός με ἵνα ζωὴν ἔχητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/040.yaml
  text: Yet you are not willing to come to me so that you may have life[a][b].
translation:
  language: ru
  text: Но вы не хотите прийти ко Мне, чтобы иметь жизнь.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И вы не хотите прийти ко Мне, чтобы иметь жизнь». Греческий союз можно передать простым «и».'
    reason: lexical_alternative
  - marker: b
    text: 'У Иоанна слово «жизнь» часто имеет более полный смысл: жизнь от Бога, то есть вечную жизнь, хотя слово «вечная» здесь прямо не употреблено.'
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Но
  rationale: Хотя καί обычно означает «и», здесь союз противопоставляет нежелание слушателей свидетельству Писаний о Христе (ст. 39); русское «но» естественно передаёт этот контраст.
- source_word: οὐ θέλετε
  choice: вы не хотите
  rationale: Передаёт волевой оттенок θέλω без усиления до более категоричного «отказываетесь».
- source_word: ἐλθεῖν πρός με
  choice: прийти ко Мне
  rationale: Сохраняет конкретный образ прихода к Иисусу и не заменяет его толкованием «поверить в Меня».
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно и точно передаёт целевое значение союза.
- source_word: ζωὴν
  choice: жизнь
  rationale: Сохраняет лексически выраженное слово без добавления отсутствующего в данном стихе определения «вечную».
- source_word: ἔχητε
  choice: иметь
  rationale: После русского «чтобы» инфинитив при совпадающем субъекте естественно передаёт греческий конъюнктив цели.
theological_decisions:
- issue: Передавать ли ζωὴν как «жизнь» или «вечную жизнь»
  choice: жизнь
  alternative: вечную жизнь
  rationale: В Евангелии от Иоанна ζωή часто означает жизнь от Бога и имеет эсхатологическую полноту, однако αἰώνιος здесь отсутствует; поэтому уточнение не внесено в основной текст.
- issue: Толковать ли «прийти ко Мне» непосредственно как веру
  choice: прийти ко Мне
  alternative: поверить в Меня / прийти ко Мне с верой
  rationale: Приход к Иисусу в богословии Иоанна тесно связан с верой, но перевод сохраняет исходный образ, не подменяя его истолкованием.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified формулировка. «Ко Мне» сохраняет традиционно почтительное написание местоимения применительно к Иисусу. Конструкция «чтобы иметь жизнь» намеренно сохраняет лаконичность и смысловую ёмкость оригинала.
