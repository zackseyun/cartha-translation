lexical_decisions:
- source_word: ἰαθεὶς
  choice: исцелённый
  rationale: Субстантивированное причастие аориста в пассивном залоге передано кратко и естественно; оно сохраняет значение совершившегося исцеления и не называет действующего лица сверх того, что выражено в греческом тексте.
- source_word: οὐκ ᾔδει
  choice: не знал
  rationale: Прямой и естественный русский эквивалент, подходящий контексту неизвестной личности исцелившего.
- source_word: τίς ἐστιν
  choice: кто это
  rationale: Естественная русская форма косвенного вопроса о личности; она сохраняет настоящее время греческого ἐστιν и не требует добавлять местоимение с богословски обусловленной прописной буквой.
- source_word: ἐξένευσεν
  choice: незаметно удалился
  rationale: Передаёт не только уход, но и контекстуальный оттенок незаметного отступления или ухода из поля зрения, свойственный редкому глаголу ἐκνεύω.
- source_word: ὄχλου ὄντος
  choice: в том месте была толпа
  rationale: Генитив абсолютный передан отдельной пояснительной частью; это сохраняет обстоятельственный оттенок и не делает причинную связь более жёсткой, чем в оригинале.
- source_word: ἐν τῷ τόπῳ
  choice: в том месте
  rationale: Сохраняет явное указание на место, выраженное греческой предложной группой, и звучит естественно по-русски.
