  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔχω τὴν μαρτυρίαν ⸀μείζω τοῦ Ἰωάννου, τὰ γὰρ ἔργα ἃ ⸀δέδωκέν μοι ὁ πατὴρ ἵνα τελειώσω αὐτά, αὐτὰ τὰ ἔργα ⸀ἃ ποιῶ, μαρτυρεῖ περὶ ἐμοῦ ὅτι ὁ πατήρ με ἀπέσταλκεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/036.yaml
  text: But I have testimony greater than John's[a], for the works that the Father has given me to complete—these very works that I am doing—testify about me that the Father has sent me.
translation:
  language: ru
  text: 'Но у Меня есть свидетельство более весомое, чем свидетельство Иоанна: ведь дела, которые Отец дал Мне завершить, — сами эти дела, которые Я совершаю, — свидетельствуют обо Мне, что Меня послал Отец.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαρτυρίαν
  choice: свидетельство
  rationale: Сохраняет судебно-доказательный оттенок и естественно сочетается с «есть у Меня»; в контексте речь идёт о подтверждении того, кем является Иисус.
- source_word: μείζω
  choice: более весомое
  rationale: В данном контексте сравнительная форма говорит не о физической величине, а о большей доказательной силе. «Более весомое» звучит естественно по-русски и не сводит смысл лишь к общественной важности.
- source_word: τοῦ Ἰωάννου
  choice: чем свидетельство Иоанна
  rationale: Греческий родительный сравнительный эллиптичен; явное повторение слова «свидетельство» устраняет возможное русское понимание «больше самого Иоанна».
- source_word: ἔργα
  choice: дела
  rationale: 'Сохраняет широкий и богословски значимый смысл: не только чудеса, но вся порученная Отцом деятельность Иисуса.'
- source_word: δέδωκέν μοι
  choice: дал Мне
  rationale: Русский совершенный вид передаёт завершённое поручение с сохраняющимся результатом естественнее, чем тяжеловесная аналитическая конструкция.
- source_word: ὁ πατήρ
  choice: Отец
  rationale: Передаёт титульное обозначение Бога в Его отношении к Иисусу, не добавляя отсутствующего в греческом притяжательного местоимения.
- source_word: ἵνα τελειώσω αὐτά
  choice: совершить
  rationale: Передаёт цель поручения и идею доведения дел до исполнения; в современном литературном русском «совершить дела» естественнее, чем «завершить дела» в этом контексте.
- source_word: αὐτὰ τὰ ἔργα
  choice: сами эти дела
  rationale: Сохраняет эмфатическое повторение αὐτά и прямую отсылку к только что названным делам.
- source_word: ἃ ποιῶ
  choice: которые Я совершаю
  rationale: Настоящее время передаёт продолжающуюся деятельность; повтор «совершить / совершаю» отражает связь τελειόω и ποιέω, хотя русские формы частично сближаются лексически.
- source_word: μαρτυρεῖ περὶ ἐμοῦ
  choice: свидетельствуют обо Мне
  rationale: Передаёт свидетельский и доказательный смысл глагола; множественное число естественно согласуется в русском с «дела», тогда как греческий глагол стоит в единственном числе при среднем роде множественного числа.
- source_word: ἀπέσταλκεν
  choice: Меня послал Отец
  rationale: Совершенный вид «послал» естественно выражает состоявшееся послание с сохраняющейся значимостью; порядок слов сохраняет смысловой акцент заключительной части.
theological_decisions:
- issue: Характер свидетельства, подтверждающего полномочия Иисуса
  choice: Дела, порученные Отцом, обладают большей доказательной силой, чем свидетельство Иоанна, и подтверждают посланничество Иисуса.
  alternative: Понимать «дела» исключительно как чудеса, удостоверяющие власть Иисуса.
  rationale: Греческое ἔργα шире слова «чудеса» и может охватывать всю деятельность, порученную Иисусу Отцом. Перевод не сужает значение без прямого основания в стихе.
- issue: Передача ὁ πατήρ
  choice: Отец
  alternative: Бог; Мой Отец
  rationale: В оригинале стоит титульное ὁ πατήρ без слова «Бог» и без явного притяжательного местоимения; перевод сохраняет это отношение и не добавляет толкование.
- issue: Смысл сравнения μείζω τοῦ Ἰωάννου
  choice: Более весомое свидетельство, чем свидетельство Иоанна
  alternative: Свидетельство, большее, чем Иоанн; свидетельство более важное, чем Иоанново
  rationale: Контекст сопоставляет свидетельства по их подтверждающей силе. Развёртывание эллипсиса необходимо для ясности по-русски, но не меняет предмет сравнения.
translation_notes:
  register: Современный литературный русский с достоинством и ясностью. Синтаксическое обрамление «сами эти дела, которые Я совершаю» сохраняет эмфазу оригинала. Заглавные буквы в местоимениях, относящихся к Иисусу, следуют принятому русскому библейскому регистру; они являются издательской нормой, а не дополнительным смысловым уточнением.
