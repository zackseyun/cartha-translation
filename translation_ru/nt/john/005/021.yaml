  verdict: approve
  source_fidelity: Перевод точно передаёт сравнительно-пояснительную конструкцию ὥσπερ γὰρ … οὕτως καί, воскресение мёртвых (ἐγείρει τοὺς νεκρούς), а также дважды употреблённое ζῳοποιεῖ. «Оживляет» удачно сохраняет повтор исходного глагола. «Их» в первой части — естественное для русского языка эксплицирование дополнения, ясно отсылающего к «мёртвых» и не меняющего смысла. «Тех, кого хочет» точно передаёт οὓς θέλει.
  naturalness: Фраза звучит естественно и литературно по-русски. «Ведь как … так и …» хорошо работает как связная реплика в контексте речи Иисуса; «кого хочет» современно и не снижает регистра.
  terminology: «Отец» и «Сын» с прописной буквы корректно отражают контекстуальные титулы. «Воскрешает мёртвых» и «оживляет» различают, но не противопоставляют, два греческих глагола и сохраняют их богословски значимый параллелизм без привнесения толкования.
