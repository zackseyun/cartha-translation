id: JHN.5.21
reference: John 5:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἐγείρει τοὺς νεκροὺς καὶ ζῳοποιεῖ, οὕτως καὶ ὁ υἱὸς οὓς θέλει ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/021.yaml
  text: For just as the Father raises the dead and gives life[b][a], so also the Son gives life to whom he wishes.
translation:
  language: ru
  text: Ведь как Отец воскрешает мёртвых и оживляет их, так и Сын оживляет тех, кого хочет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Ведь как
  rationale: «Ведь» естественно передаёт пояснительное γάρ, а «как» открывает сопоставление ὥσπερ… οὕτως.
- source_word: ὁ πατὴρ
  choice: Отец
  rationale: В контексте это наименование Бога Отца; прописная буква сохраняет титульное употребление.
- source_word: ἐγείρει τοὺς νεκρούς
  choice: воскрешает мёртвых
  rationale: В контексте возвращения мёртвых к жизни «воскрешает» точнее и естественнее, чем буквальное «поднимает».
- source_word: ζῳοποιεῖ
  choice: оживляет
  rationale: Одно русское слово передаёт значение «делает живым, дарует жизнь» и позволяет сохранить повтор глагола в обеих частях стиха.
- source_word: οὕτως καὶ
  choice: так и
  rationale: Сохраняет соответствующую часть сопоставительной конструкции и явный параллелизм действий Отца и Сына.
- source_word: ὁ υἱὸς
  choice: Сын
  rationale: В контексте это христологическое наименование, параллельное слову «Отец».
- source_word: οὓς θέλει
  choice: тех, кого хочет
  rationale: Естественная современная русская передача относительной конструкции и действительной воли Сына без архаичного «кого изволит».
theological_decisions:
- issue: Параллелизм Отца и Сына в даровании жизни
  choice: Сохранена симметричная формулировка «Отец… оживляет — Сын оживляет».
  alternative: Ослабить параллель посредством разных глаголов или более свободного пересказа.
  rationale: Греческая конструкция прямо сопоставляет животворящее действие Сына с действием Отца; перевод сохраняет это утверждение, не добавляя богословских пояснений.
- issue: Значение θέλει и воля Сына
  choice: «кого хочет»
  alternative: «кого пожелает»; «кого изволит»
  rationale: «Хочет» ясно выражает волеизъявление и звучит естественно в современном литературном русском; оно не ограничивает и не ослабляет власть Сына.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Повтор «оживляет» намеренно сохраняет лексический параллелизм оригинала. Местоимение «их» в первой части добавлено как естественное русское дополнение, однозначно отсылающее к мёртвым.
