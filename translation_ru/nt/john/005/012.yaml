  text: So they asked him[a], “Who is the man who said to you, ‘Pick it up and walk’?”
translation:
  language: ru
  text: 'Тогда они спросили его: «Кто тот человек, который сказал тебе: „Подними её и ходи“?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Подними и ходи». Предмет в греческом тексте не назван; из предыдущего контекста ясно, что речь идёт о подстилке, на которой лежал исцелённый.'
    reason: Уточняет, что местоимение «её» введено для естественности русского языка и обозначает подразумеваемый предмет, отсутствующий в греческой формулировке.
lexical_decisions:
- source_word: ἠρώτησαν
  choice: спросили
  rationale: Аорист ἐρωτάω обозначает простой факт вопроса; нейтральное «спросили» не привносит излишней враждебности.
- source_word: οὖν
  choice: тогда
  rationale: Передаёт повествовательное следствие и продолжение после предыдущего стиха естественным современным русским языком.
- source_word: ὁ ἄνθρωπος
  choice: тот человек
  rationale: Артикль и последующее определительное причастие выделяют конкретного мужчину; конструкция «тот человек, который» естественно передаёт греческое выражение.
- source_word: ὁ εἰπών σοι
  choice: который сказал тебе
  rationale: Сохраняет значение атрибутивного аористного причастия и дательного местоимения без усиления до «велел».
- source_word: Ἆρον
  choice: Возьми
  rationale: Императив αἴρω означает поднять или взять; объект в греческом не выражен и восстанавливается из предыдущего контекста.
- source_word: καὶ περιπάτει
  choice: и иди
  rationale: В данном контексте περιπατέω означает ходить; «иди» звучит естественно как повеление, не переинтерпретируя вид настоящего императива.
