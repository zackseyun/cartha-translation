id: JHN.5.45
reference: John 5:45
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μὴ δοκεῖτε ὅτι ἐγὼ κατηγορήσω ὑμῶν πρὸς τὸν πατέρα· ἔστιν ὁ κατηγορῶν ὑμῶν Μωϋσῆς, εἰς ὃν ὑμεῖς ἠλπίκατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/045.yaml
  text: 'Do not think that I will accuse you before the Father[a]; there is one who accuses you: Moses[b], in whom you have put your hope.'
translation:
  language: ru
  text: Не думайте, что Я буду обвинять вас перед Отцом[a]. Есть тот, кто обвиняет вас, — Моисей[b], на которого вы возложили надежду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не полагайте, что Я буду выдвигать против вас обвинение перед Отцом».'
    reason: lexical_alternative
  - marker: b
    text: То есть Моисей, на которого они возлагали надежду, особенно как на посредника и свидетеля закона, сам выступает их обвинителем.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ δοκεῖτε
  choice: Не думайте
  rationale: Запрет с μή и формой настоящего времени естественно передаётся прямым и понятным выражением «не думайте»; возможное «не полагайте» отмечено как стилистическая альтернатива.
- source_word: κατηγορήσω
  choice: буду обвинять
  rationale: Глагол κατηγορέω обозначает обвинение или предъявление обвинения, а не вынесение приговора; поэтому «обвинять» сохраняет юридический оттенок без усиления до «осудить».
- source_word: πρὸς τὸν πατέρα
  choice: перед Отцом
  rationale: В сочетании с глаголом обвинения эта формулировка естественно передаёт направленность обвинения к Отцу и судебный образ; «Отец» сохранено как характерное для Иоанна именование.
- source_word: ἔστιν ὁ κατηγορῶν ὑμῶν
  choice: Есть тот, кто обвиняет вас
  rationale: Конструкция вводит обвинителя, противопоставленного Иисусу, а причастие настоящего времени передано глаголом настоящего времени.
- source_word: Μωϋσῆς
  choice: Моисей
  rationale: Общепринятая русская форма имени.
- source_word: εἰς ὃν
  choice: на которого
  rationale: При глаголе надежды εἰς выражает направленность упования на лицо; русский оборот «возложить надежду на» точно и естественно передаёт это значение.
- source_word: ἠλπίκατε
  choice: вы возложили надежду
  rationale: Перфект указывает на совершившееся действие с сохраняющимся результатом; эта формулировка передаёт как прежнее возложение надежды, так и продолжающуюся уверенность.
theological_decisions:
- issue: Юридический смысл слов Иисуса об обвинении
  choice: «буду обвинять», а не «буду осуждать»
  alternative: «буду осуждать вас перед Отцом»
  rationale: Κατηγορέω означает выступать с обвинением или предъявлять обвинение, но не обозначает окончательного осуждения; перевод не добавляет более сильного судебного утверждения.
- issue: На кого возложена надежда
  choice: Надежда возложена непосредственно «на Моисея»
  alternative: «на закон Моисея» или «на писания Моисея»
  rationale: Хотя ближайший контекст связывает Моисея с его писаниями, греческий текст прямо называет самого Моисея; это напряжение сохранено в основном тексте.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и доступным синтаксисом. Прописные местоимения «Я» и титул «Отец» соответствуют принятому русскому библейскому регистру. Тире перед именем «Моисей» подчёркивает раскрытие личности обвинителя, присутствующее в греческой конструкции.
