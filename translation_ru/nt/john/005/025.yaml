base_translation:
  language: en
  yaml_path: translation/nt/john/005/025.yaml
  text: Truly[a], truly, I say to you that an hour is coming, and now is, when the dead will hear the voice of the Son of God[d][c][b], and those who hear will live.
translation:
  language: ru
  text: 'Истинно, истинно говорю вам: наступает час — и уже настал, — когда мёртвые услышат голос Сына Божьего, и те, кто услышит, будут жить.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «услышавшие будут жить». Греческое причастие имеет форму аориста и может подчёркивать, что жизнь следует за слышанием голоса Сына.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Истинно, истинно
  rationale: Сохраняет торжественное двойное утверждение и привычное для русской библейской речи звучание, оставаясь понятным современному читателю.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямо передаёт обращение и сохраняет характерный ритм Иоаннова изречения.
- source_word: ἔρχεται ὥρα
  choice: наступает час
  rationale: Сохраняет конкретное слово «час», значимое в Евангелии от Иоанна, а не обобщает его до «времени».
- source_word: καὶ νῦν ἐστιν
  choice: и уже настал
  rationale: Естественно передаёт по-русски парадоксальное сочетание будущего наступления часа с его нынешней реальностью.
- source_word: οἱ νεκροὶ
  choice: мёртвые
  rationale: Не сужает значение ни до духовно мёртвых, ни только до физически умерших, сохраняя контекстуальную напряжённость.
- source_word: ἀκούσουσιν τῆς φωνῆς
  choice: услышат голос
  rationale: Точно и естественно передаёт личный характер φωνή и глагол восприятия ἀκούω.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: Сына Божьего
  rationale: Прямо сохраняет полный христологический титул; форма «Божьего» современна, литературна и прозрачна.
- source_word: οἱ ἀκούσαντες
  choice: услышавшие
  rationale: 'Сохраняет аористное причастие и последовательность: услышав голос, они оживут; возможная временная нюансировка отмечена в сноске.'
- source_word: ζήσουσιν
  choice: оживут
  rationale: В данном контексте естественно выражает переход мёртвых к жизни, не уточняя, идёт ли речь исключительно о духовном оживлении или телесном воскресении.
theological_decisions:
- issue: Значение «мёртвых» в контексте Ин 5
  choice: 'Оставлено без поясняющего определения: «мёртвые».'
  alternative: «духовно мёртвые» или «умершие»
  rationale: Слова «и уже настал» указывают на настоящее измерение, тогда как дальнейший контекст говорит и о будущем телесном воскресении; перевод не должен устранять эту напряжённость.
- issue: Значение ζήσουσιν
  choice: «оживут»
  alternative: «будут жить»
  rationale: «Оживут» естественно сочетается с подлежащим «мёртвые» и обозначает обретение жизни, не добавляя конкретного механизма или единственного богословского толкования.
- issue: Христологический титул τοῦ υἱοῦ τοῦ θεοῦ
  choice: «Сына Божьего»
  alternative: «Божьего Сына»
  rationale: Сохраняет традиционную и ясную форму титула без дополнительного толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством и узнаваемым Иоанновым ритмом. Тире выделяют напряжённое сочетание «наступает» и «уже настал». Сохранены повтор «истинно, истинно», термин «час» и богословская неоднозначность образа мёртвых.
