id: JHN.5.23
reference: John 5:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἵνα πάντες τιμῶσι τὸν υἱὸν καθὼς τιμῶσι τὸν πατέρα. ὁ μὴ τιμῶν τὸν υἱὸν οὐ τιμᾷ τὸν πατέρα τὸν πέμψαντα αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/023.yaml
  text: so that all may honor the Son just as they honor the Father. The one who does not honor the Son does not honor the Father who sent him.
translation:
  language: ru
  text: чтобы все чтили Сына так же, как чтут Отца. Кто не чтит Сына, тот не чтит и Отца, пославшего Его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно вводит целевое следствие и сохраняет целевую силу греческого союза.
- source_word: πάντες
  choice: все
  rationale: Кратко и точно передаёт обобщающее значение формы множественного числа.
- source_word: τιμῶσι / τιμῶν / τιμᾷ
  choice: чтили / чтит
  rationale: Глагол «чтить» точно выражает оказание должной чести и позволяет сохранить намеренный лексический повтор.
- source_word: τὸν υἱὸν
  choice: Сына
  rationale: В контексте это личностное христологическое наименование; прописная буква соответствует современной русской библейской орфографии.
- source_word: καθὼς
  choice: так же, как
  rationale: Передаёт сильное соответствие в сравнении, не ослабляя его до неопределённого сходства.
- source_word: τὸν πατέρα
  choice: Отца
  rationale: Контекст указывает на Бога Отца; прописная буква обозначает титульно-личностное употребление.
- source_word: ὁ μὴ τιμῶν
  choice: Кто не чтит
  rationale: Естественная русская конструкция для обобщающего субстантивированного причастия; сохраняет универсальный характер утверждения.
- source_word: τὸν πέμψαντα αὐτόν
  choice: пославшего Его
  rationale: Причастный оборот точно и компактно определяет Отца как Того, кто послал Сына; «Его» имеет ясный контекстуальный референт.
- source_word: πέμψαντα
  choice: пославшего
  rationale: Прямо передаёт обычное значение πέμπω; вариант «уполномочившего» необоснованно сужал бы смысл.
theological_decisions:
- issue: Сила сравнения между почитанием Сына и почитанием Отца
  choice: «так же, как»
  alternative: «как»
  rationale: Формулировка сохраняет выраженное в καθώς тесное соответствие, не добавляя к тексту более поздней догматической терминологии.
- issue: Прописные буквы в словах «Сын» и «Отец»
  choice: Оба наименования написаны с прописной буквы
  alternative: Строчные «сын» и «отец»
  rationale: Хотя греческий текст сам по себе не кодирует такое различие, в данном контексте слова служат личностными наименованиями Иисуса и Бога Отца; русская орфография делает референцию ясной без добавления нового содержания.
- issue: Передача местоимения αὐτόν
  choice: «Его» с прописной буквы
  alternative: «его» со строчной буквы
  rationale: Прописная буква соответствует принятой русской библейской орфографии для местоимения, относящегося к Сыну, хотя в греческом регистр не несёт богословского значения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского высказывания. Сохранены трёхкратный повтор корня «чтить», параллелизм Сына и Отца и сильное сравнительное выражение. Союз «и» перед «Отца» добавлен как естественный русский усилительно-соединительный элемент, не меняющий содержания отрицательного параллелизма.
