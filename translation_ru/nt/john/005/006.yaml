  yaml_path: translation/nt/john/005/006.yaml
  text: When Jesus saw this man lying there[a], and knew that he had already been there a long time, he said to him, “Do you want to become well?”
translation:
  language: ru
  text: 'Увидев этого человека лежащим и зная, что он уже давно находится в таком состоянии[a], Иисус спросил его: «Хочешь стать здоровым?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что он уже давно находится здесь». Греческий текст не уточняет, относится ли длительность к состоянию человека или к его пребыванию у купальни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: этот человек
  rationale: Указательное местоимение относится к конкретному больному, упомянутому в контексте; явное существительное естественно для русского языка.
- source_word: ἰδὼν
  choice: увидев
  rationale: Деепричастие естественно передаёт предшествующее главному глаголу действие аористного причастия.
- source_word: κατακείμενον
  choice: лежит
  rationale: Передаёт положение человека без добавления отсутствующего в греческом тексте указания на место.
- source_word: γνοὺς
  choice: зная
  rationale: Передаёт осведомлённость Иисуса, не уточняя, каким образом Он это узнал.
- source_word: πολὺν ἤδη χρόνον ἔχει
  choice: он находится в таком состоянии уже долгое время
  rationale: Греческая конструкция буквально не называет ни место, ни болезнь; контекстуальное «в таком состоянии» сохраняет смысл и исходную недосказанность.
- source_word: λέγει αὐτῷ
  choice: Иисус спросил его
  rationale: Историческое настоящее естественно передано русским прошедшим временем; «спросил» соответствует следующему прямому вопросу.
- source_word: Θέλεις
  choice: хочешь
  rationale: Прямое и современное выражение желания или воли.
- source_word: ὑγιὴς γενέσθαι
  choice: стать здоровым
  rationale: «Стать» сохраняет значение перехода в новое состояние в γενέσθαι, а «здоровым» естественно передаёт ὑγιής в контексте исцеления.
theological_decisions:
- issue: Природа знания Иисуса в γνοὺς
  choice: Передать как простое знание без указания его источника.
  alternative: Уточнить, что Иисус узнал это сверхъестественно либо из наблюдения или рассказа.
  rationale: Текст сообщает о знании Иисуса, но не объясняет, каким образом оно было получено.
- issue: К чему относится длительность в πολὺν ἤδη χρόνον ἔχει
  choice: Основной текст относит её к состоянию человека, сохраняя широкую формулировку.
  alternative: Понять её как длительность пребывания у купальни.
  rationale: В самой конструкции объект не выражен; ближайший контекст допускает понимание длительности состояния, тогда как место пребывания прямо не названо.
translation_notes:
  register: Современный литературный русский язык; прямой вопрос звучит просто и достойно. Формулировка избегает как архаизма «желаешь ли», так и медицински узкого «выздороветь», сохраняя переходное значение «стать здоровым».
