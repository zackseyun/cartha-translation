  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτῷ ὁ ἀσθενῶν· Κύριε, ἄνθρωπον οὐκ ἔχω ἵνα ὅταν ταραχθῇ τὸ ὕδωρ βάλῃ με εἰς τὴν κολυμβήθραν· ἐν ᾧ δὲ ἔρχομαι ἐγὼ ἄλλος πρὸ ἐμοῦ καταβαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/007.yaml
  text: The sick man answered him, “Lord, I have no one to put me into the pool when the water is stirred up; but while I am coming, another goes down before me.”
translation:
  language: ru
  text: 'Больной ответил Ему: «Господин, у меня нет никого, кто опустил бы меня в купальню, когда вода приходит в движение. А пока я добираюсь сам, другой спускается раньше меня».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἀσθενῶν
  choice: больной
  rationale: Субстантивированное причастие обозначает человека, страдающего болезнью; краткое русское «больной» естественно в повествовании.
- source_word: Κύριε
  choice: Господин
  rationale: В прямом обращении к ещё не узнанному собеседнику κύριε может означать уважительное «господин»; это сохраняет повествовательную ситуацию и не предрешает исповедальный смысл «Господь».
- source_word: βάλῃ με
  choice: опустил бы меня
  rationale: Буквально глагол может значить «бросить/положить», но применительно к помещению человека в купальню естественно и точно «опустить».
- source_word: ταραχθῇ τὸ ὕδωρ
  choice: вода приходит в движение
  rationale: Передаёт пассивную форму и наблюдаемое возмущение воды, не добавляя в стих не названного здесь деятеля.
- source_word: κολυμβήθραν
  choice: купальню
  rationale: Традиционное и понятное обозначение водоёма/бассейна для омовения или купания в данном контексте.
- source_word: ἐν ᾧ δὲ ἔρχομαι ἐγώ
  choice: А пока я добираюсь сам
  rationale: Оборот выражает время, за которое больной самостоятельно движется к воде; «добираюсь» естественно передаёт затруднённое приближение, а явное ἐγώ — самостоятельность.
- source_word: καταβαίνει
  choice: спускается
  rationale: Сохраняет пространственный образ нисхождения в купальню.
theological_decisions:
- issue: Значение обращения Κύριε
  choice: Господин
  alternative: Господи
  rationale: Обе передачи лексически возможны, однако в этой сцене больной ещё не знает, кто с ним говорит (ср. 5:13). Уважительное «Господин» сохраняет эту повествовательную неопределённость и не отрицает более высокого христологического употребления κύριος в других местах.
- issue: Причина движения воды
  choice: не называть деятеля
  alternative: добавить ангела как причину движения воды
  rationale: В тексте SBLGNT данного стиха сказано лишь, что вода приходит в движение; добавление ангела сюда не имеет основания в представленном греческом тексте.
translation_notes:
  register: Современный литературный русский язык, с уважительным обращением и ясным, естественным синтаксисом. Заглавное «Ему» соответствует принятому в русской библейской традиции почтительному написанию местоимений о Христе, не изменяя смысла исходного текста.
