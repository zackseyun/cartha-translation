id: JHN.5.10
reference: John 5:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι τῷ τεθεραπευμένῳ· Σάββατόν ἐστιν, ⸀καὶ οὐκ ἔξεστίν σοι ἆραι τὸν ⸀κράβαττον.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/010.yaml
  text: So the Jews were saying to the man who had been healed[a], “It is the Sabbath[c][b], and it is not lawful for you to carry your mat.”
translation:
  language: ru
  text: 'Иудеи[a] говорили исцелённому: «Сегодня суббота, и тебе не позволено нести свою подстилку[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В зависимости от того, как это выражение употреблено здесь у Иоанна, возможно также: «иудейские начальники» или «жители Иудеи».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «поднять свою подстилку». Греческое слово обозначает переносную подстилку или тюфяк для сна, а не обязательно кровать.'
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: ἔλεγον
  choice: говорили
  rationale: Имперфект передаёт продолжающуюся или повторявшуюся речь; русская форма несовершенного вида естественно сохраняет этот оттенок.
- source_word: οὖν
  choice: не выражено отдельным словом
  rationale: Связь с предшествующим событием в русском повествовании ясна без отдельного «итак/поэтому»; такое опущение делает фразу естественнее, не устраняя логической последовательности.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Сохраняет формально широкое обозначение греческого текста и не сужает его без прямого указания контекста до начальников или властей.
- source_word: τῷ τεθεραπευμένῳ
  choice: исцелённому
  rationale: Субстантивированное причастие естественно по-русски обозначает мужчину, который был исцелён; результат совершившегося исцеления сохраняется.
- source_word: Σάββατόν ἐστιν
  choice: Сегодня суббота
  rationale: Естественная современная русская формулировка временного утверждения; «сегодня» эксплицирует подразумеваемый день, не меняя смысла.
- source_word: οὐκ ἔξεστίν σοι
  choice: тебе не позволено
  rationale: Передаёт значение дозволенности и нормативный характер возражения, не усиливая его до прямой цитаты конкретной заповеди.
- source_word: ἆραι
  choice: нести
  rationale: В данном контексте речь идёт не только о поднятии, но о переноске предмета, вызвавшей возражение относительно субботы.
- source_word: κράβαττον
  choice: подстилку
  rationale: Обозначает переносное место для сна — тюфяк или подстилку, а не обязательно кровать с каркасом; «подстилка» понятно современному читателю и соответствует сцене.
theological_decisions:
- issue: Кого обозначает οἱ Ἰουδαῖοι в Евангелии от Иоанна
  choice: иудеи
  alternative: иудейские начальники; жители Иудеи
  rationale: Сам стих не уточняет, что говорившие были начальниками, и не требует географического значения. Основной текст поэтому сохраняет широкое обозначение оригинала, а возможные контекстуальные уточнения вынесены в примечание.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанный. Реплика звучит естественно, но сохраняет нормативный оттенок субботнего запрета. Термин «иудеи» оставлен без конфессионально или исторически мотивированного сужения; его возможная неоднозначность отмечена в сноске.
