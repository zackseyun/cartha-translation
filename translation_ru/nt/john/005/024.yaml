language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων τῷ πέμψαντί με ἔχει ζωὴν αἰώνιον, καὶ εἰς κρίσιν οὐκ ἔρχεται ἀλλὰ μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/024.yaml
  text: Truly[a], truly, I say to you, whoever hears my word and believes him who sent me has eternal life, and does not come into judgment[b], but has passed from death into life.
translation:
  language: ru
  text: 'Истинно, истинно говорю вам: тот, кто слышит Моё слово и верит Пославшему Меня, имеет вечную жизнь и не приходит на суд[a], но уже перешёл[b] от смерти к жизни.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не приходит под осуждение». Греческое κρίσις может означать суд вообще или, в данном контексте, неблагоприятный приговор.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческая форма глагола обозначает завершившийся переход с сохраняющимся результатом: человек «перешёл» или «перешёл из смерти в жизнь».'
    reason: verbal_aspect
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Истинно, истинно
  rationale: Передаёт торжественную усилительную формулу Иисуса естественным и понятным современным русским языком, сохраняя повтор.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямая и естественная передача греческой речевой формулы.
- source_word: ὁ ... ἀκούων καὶ πιστεύων
  choice: тот, кто слышит ... и верит
  rationale: Передаёт обобщающий характер артиклевых причастий без сужения круга лиц.
- source_word: τὸν λόγον μου
  choice: Моё слово
  rationale: Сохраняет и непосредственный смысл сказанного Иисусом, и характерное для Иоанна звучание слова λόγος.
- source_word: πιστεύων τῷ πέμψαντί με
  choice: верит Пославшему Меня
  rationale: Дательный падеж при πιστεύω естественно передаётся русской конструкцией «верить кому», не добавляя отсутствующего в тексте предлога.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: имеет вечную жизнь
  rationale: Настоящее время ἔχει выражает уже имеющееся обладание; «вечная жизнь» — точная и устойчивая передача выражения.
- source_word: εἰς κρίσιν οὐκ ἔρχεται
  choice: не приходит на суд
  rationale: Сохраняет широкое значение κρίσις как суда, не подменяя его более узким понятием осуждения.
- source_word: μεταβέβηκεν
  choice: уже перешёл
  rationale: Совершенный вид передаёт завершившийся переход, а «уже» подчёркивает сохраняющийся результат греческого перфекта без тяжеловесной конструкции.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: от смерти к жизни
  rationale: Естественно по-русски сохраняет резкое противопоставление и направление перехода.
theological_decisions:
- issue: Значение κρίσις в контексте спасения
  choice: суд
  alternative: осуждение
  rationale: В контексте возможен неблагоприятный исход суда, однако само слово κρίσις шире прямого «осуждения». Основной текст сохраняет эту смысловую напряжённость, а примечание указывает альтернативу.
- issue: Временная соотнесённость вечной жизни и перехода от смерти к жизни
  choice: настоящее обладание жизнью и уже совершившийся переход с сохраняющимся результатом
  alternative: только будущее получение жизни или только будущее оправдание на суде
  rationale: Настоящее ἔχει и перфект μεταβέβηκεν описывают нынешнюю реальность и завершённый переход; перевод передаёт грамматику, не встраивая её в частную конфессиональную систему.
translation_notes:
  register: Современный литературный русский язык с торжественным, но ясным библейским звучанием. Синтаксис остаётся близким к греческому, при этом естественен для обычного читателя. Заглавные буквы в местоимениях и обозначении Пославшего соблюдают принятую русскую библейскую издательскую традицию.
