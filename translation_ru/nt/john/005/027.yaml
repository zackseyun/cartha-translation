id: JHN.5.27
reference: John 5:27
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐξουσίαν ἔδωκεν ⸀αὐτῷ κρίσιν ποιεῖν, ὅτι υἱὸς ἀνθρώπου ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/027.yaml
  text: And he gave him authority to execute judgment[a], because he is the Son of Man.
translation:
  language: ru
  text: И дал Ему власть совершать суд, потому что Он — Сын Человеческий.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что Он — сын человеческий», то есть принадлежит к человеческому роду. В основном тексте сохранено более вероятное для Евангелия от Иоанна употребление этого выражения как титула.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: власть
  rationale: Передаёт предоставленное Отцом законное полномочие, а не просто силу или способность.
- source_word: ἔδωκεν
  choice: дал
  rationale: Прямо и естественно передаёт аорист δίδωμι; субъект восстанавливается из контекста как Отец.
- source_word: αὐτῷ
  choice: Ему
  rationale: Дательный падеж местоимения относится в контексте к Сыну.
- source_word: κρίσιν ποιεῖν
  choice: совершать суд
  rationale: Сохраняет судебный характер греческого сочетания и ближе к его форме, чем обобщённое «судить»; по-русски звучит достойно и понятно.
- source_word: ὅτι
  choice: потому что
  rationale: Вводит основание, по которому дана власть.
- source_word: υἱὸς ἀνθρώπου
  choice: Сын Человеческий
  rationale: В контексте Евангелия от Иоанна выражение, несмотря на отсутствие артикля, вероятнее всего служит устойчивым титулом Иисуса и перекликается с Дан 7.
- source_word: ἐστίν
  choice: Он —
  rationale: Настоящее время связки естественно передано по-русски нулевой связкой; тире подчёркивает именную часть без добавления нового смысла.
theological_decisions:
- issue: Титул ли υἱὸς ἀνθρώπου или общее указание на человеческую природу
  choice: «Сын Человеческий» как христологический титул
  alternative: «сын человеческий», то есть человек, разделяющий человеческую природу
  rationale: Иоаннов контекст и вероятная перекличка с Дан 7 поддерживают титульное понимание, особенно рядом с темой судебной власти. Однако безартиклевую форму можно понять и как указание на принадлежность к человечеству, поэтому эта подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Прописные местоимения «Ему», «Он» употреблены в соответствии с распространённой русской библейской традицией; формулировка не снимает неоднозначности безартиклевого υἱὸς ἀνθρώπου.
