  source_fidelity: 'Смысл передан верно: условное противопоставление, настоящее «не верите», будущее «как поверите?» и контраст между написанным Моисеем и словами Иисуса сохранены. Однако «тому, что написал он» сглаживает множественное число γράμμασιν и звучит менее непосредственно, чем перевод с существительным.'
  naturalness: Оборот «написал он» стилистически отмечен и несколько тяжеловесен для современного литературного русского. «Его писаниям» естественнее и лучше сохраняет форму и параллелизм исходного текста.
  terminology: «Писания» адекватно передаёт γράμματα в данном контексте, не сводя его к частным письмам и не навязывая термин «Писание» как каноническое обозначение. «Словам» точно передаёт ῥήμασιν. Прописное «Моим» сохранено как принятая русская библейская орфографическая конвенция.
