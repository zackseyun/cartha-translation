  text: εἰ δὲ τοῖς ἐκείνου γράμμασιν οὐ πιστεύετε, πῶς τοῖς ἐμοῖς ῥήμασιν πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/047.yaml
  text: But if you do not believe his writings[a], how will you believe my words?
translation:
  language: ru
  text: Но если вы не верите его писаниям[a], как поверите Моим словам?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его письмам». Здесь имеются в виду написанные Моисеем тексты.'
    reason: Передаёт лексическую альтернативу γράμματα и поясняет референт местоимения в контексте, сохраняя основной текст кратким.
lexical_decisions:
- source_word: εἰ δὲ
  choice: Но если
  rationale: Передаёт условие и контраст с предшествующим рассуждением естественным русским оборотом.
- source_word: τοῖς ἐκείνου γράμμασιν
  choice: тому, что написал он
  rationale: Контекст указывает на написанное Моисеем; такая формулировка естественна по-русски, сохраняет местоименное указание и не сужает γράμματα до частных писем.
- source_word: οὐ πιστεύετε
  choice: вы не верите
  rationale: В данном контексте πιστεύω означает признание свидетельства истинным; настоящее время передано настоящим временем.
- source_word: πῶς ... πιστεύσετε
  choice: как поверите
  rationale: Сохраняет вопросительное πῶς и будущее время πιστεύσετε, не заменяя их более толковательным «как можете поверить».
- source_word: τοῖς ἐμοῖς ῥήμασιν
  choice: Моим словам
  rationale: Естественно передаёт ῥήματα как произнесённые слова и сохраняет противопоставление написанному Моисеем.
theological_decisions:
- issue: К кому относится ἐκείνου («он»)?
  choice: Местоимение относится к Моисею, названному в ближайшем контексте
  alternative: Повторить имя «Моисей» непосредственно в основном тексте
  rationale: В Ин 5:45–46 Моисей прямо назван и представлен как писавший об Иисусе. Местоименная формулировка сохраняет связность греческого текста, а сноска поясняет референта.
- issue: Характер веры, выраженной πιστεύω
  choice: В обоих случаях переводить через «верить/поверить»
  alternative: Передать как «доверять»
  rationale: Здесь речь прежде всего о признании истинности письменного и устного свидетельства; единый корень в русском переводе сохраняет риторический параллелизм.
translation_notes:
  register: Современный литературный русский, ясный и dignified; инверсия «написал он» слегка выделяет противопоставление «он — Я» без добавления имени в основной текст. Местоимение «Моим» оформлено с прописной буквы согласно традиционной русской библейской практике.
