revisions:
- from: Но если вы не верите тому, что написал он[a], как поверите Моим словам?
  to: Но если вы не верите его писаниям[a], как поверите Моим словам?
  rationale: Замена описательного оборота на «его писаниям» восстанавливает множественное число исходного текста, устраняет неестественную инверсию и сохраняет контекстуальную отсылку к Моисею. Сноска исправлена, чтобы не называть собирательный русский оборот буквальным переводом и при этом честно отметить возможное значение «письма».
