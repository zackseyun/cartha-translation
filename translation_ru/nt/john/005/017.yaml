  yaml_path: translation/nt/john/005/017.yaml
  text: But he answered them[a], “My Father is working until now, and I also am working.”
translation:
  language: ru
  text: 'Но Он ответил им: «Мой Отец доныне трудится, и Я тружусь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт лёгкое противопоставление реакции Иисуса предшествующему обвинению и естественно связывает стих с контекстом.
- source_word: ἀπεκρίνατο αὐτοῖς
  choice: Он ответил им
  rationale: Прямой и естественный русский эквивалент депонентного глагола с дательным дополнением.
- source_word: Ὁ πατήρ μου
  choice: Мой Отец
  rationale: Сохраняет личное обращение Иисуса к Богу как к Отцу и богословскую значимость выражения.
- source_word: ἕως ἄρτι
  choice: доныне
  rationale: Кратко и точно обозначает продолжающееся вплоть до настоящего момента действие; соответствует достоинству литературного регистра.
- source_word: ἐργάζεται
  choice: трудится
  rationale: Русская форма настоящего времени естественно допускает продолжающееся действие и не требует искусственной передачи английского прогрессива.
- source_word: κἀγὼ
  choice: и Я
  rationale: Сжатая форма κἀγώ соединяет и подчёркивает Я; в русском параллелизм и явное местоимение достаточно передают присоединение Иисуса к действию Отца.
- source_word: ἐργάζομαι
  choice: тружусь
  rationale: Повтор того же корня сохраняет намеренный греческий параллелизм между действием Отца и действием Иисуса.
theological_decisions:
- issue: Соотношение труда Иисуса и труда Отца в контексте субботы
  choice: «Мой Отец доныне трудится, и Я тружусь»
  alternative: «Мой Отец доныне продолжает трудиться, и Я тоже продолжаю трудиться»
  rationale: Перевод сохраняет прямой параллелизм двух форм ἐργάζομαι и его богословское напряжение, не добавляя объяснений о субботе, божественной прерогативе или равенстве.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. «Доныне» понятно в контексте и компактно передаёт ἕως ἄρτι. Заглавные «Он», «Мой Отец», «Я» применены как традиционная русская типографическая норма для божественных Лиц, не изменяя смысла исходного текста.
