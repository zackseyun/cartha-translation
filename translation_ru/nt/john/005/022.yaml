  text: οὐδὲ γὰρ ὁ πατὴρ κρίνει οὐδένα, ἀλλὰ τὴν κρίσιν πᾶσαν δέδωκεν τῷ υἱῷ,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/022.yaml
  text: For the Father judges no one, but has given all judgment to the Son,
translation:
  language: ru
  text: Ведь Отец никого не судит, но весь суд отдал Сыну.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Ведь
  rationale: Частица γάρ вводит пояснение к предыдущей мысли, а οὐδέ усиливает отрицание. В данном русском контексте «ведь» естественно передаёт пояснительную связь, тогда как отдельное «даже» было бы тяжеловесным.
- source_word: ὁ πατὴρ
  choice: Отец
  rationale: В контексте Евангелия от Иоанна это титульное обозначение Бога в Его отношении к Сыну; прописная буква уместна в русском библейском тексте.
- source_word: κρίνει οὐδένα
  choice: никого не судит
  rationale: Настоящее время выражает общее положение. Глагол «судит» сохраняет связь с существительным κρίσις и не сужает значение до одного лишь осуждения.
- source_word: ἀλλὰ
  choice: но
  rationale: Передаёт прямое и сильное противопоставление между тем, что Отец никого не судит, и передачей суда Сыну.
- source_word: τὴν κρίσιν πᾶσαν
  choice: весь суд
  rationale: Сочетание означает всю полноту суда как действия и функции. «Весь суд» сохраняет существительное и объём πᾶσαν, не добавляя отсутствующего в тексте слова «власть».
- source_word: δέδωκεν
  choice: отдал
  rationale: Греческий перфект обозначает совершившуюся передачу с сохраняющимся результатом. Русский совершенный вид «отдал» естественно передаёт достигнутый результат; «передал» также возможно, но звучит несколько административно.
- source_word: τῷ υἱῷ
  choice: Сыну
  rationale: Греческий текст употребляет титул «Сын» без притяжательного местоимения; перевод сохраняет эту титульную форму и не добавляет «Своему».
theological_decisions:
- issue: Соотношение суда Отца и суда Сына
  choice: 'Сохранено прямое утверждение: Отец никого не судит, но весь суд отдал Сыну.'
  alternative: 'Уточнить: «не судит независимо от Сына» или ограничить высказывание только последним судом.'
  rationale: Таких уточнений в греческом тексте нет. Перевод сохраняет богословское напряжение и не вводит гармонизирующих оговорок.
- issue: Христологический титул «Сын»
  choice: Сохранить «Сын» как титул.
  alternative: Передать как «Своему Сыну» или со строчной буквы.
  rationale: Артикль и контекст указывают на устойчивое титульное употребление; притяжательное местоимение в источнике отсутствует.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-сдержанный. Порядок слов естественен для русского; лексический повтор «судит — суд» намеренно сохранён вслед за греческим κρίνει — κρίσιν.
