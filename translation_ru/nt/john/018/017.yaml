  text: λέγει οὖν ⸂τῷ Πέτρῳ ἡ παιδίσκη ἡ θυρωρός⸃· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν εἶ τοῦ ἀνθρώπου τούτου; λέγει ἐκεῖνος· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/017.yaml
  text: So the servant girl who kept the door said to Peter[a], “You are not also one of this man's disciples, are you?” He said, “I am not.”
translation:
  language: ru
  text: 'Тогда служанка[a], дежурившая у входа, сказала Петру: «Ты ведь тоже не из учеников этого человека?» Он сказал: «Нет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рабыня»; «дежурившая у входа» передаёт значение греческого слова «привратница».'
    reason: Лексическая альтернатива для παιδίσκη и пояснение функционального значения θυρωρός.
lexical_decisions:
- source_word: οὖν
  choice: Тогда
  rationale: Передаёт переход в повествовании и связь с предыдущим событием, не придавая фразе излишне строгого логического оттенка.
- source_word: παιδίσκη
  choice: служанка
  rationale: Обозначает молодую служанку или рабыню; в основном тексте естественное русское «служанка» передаёт её положение без неоправданного уточнения юридического статуса.
- source_word: θυρωρός
  choice: стоявшая у дверей
  rationale: Естественно передаёт её функцию — следить за входом — и согласуется с контекстом двора; более буквальное «привратница» сохранено в примечании.
- source_word: Μὴ καὶ σὺ
  choice: Ты ведь тоже не…?
  rationale: Частица μή предполагает отрицательный ответ; конструкция с «ведь» и отрицанием естественно выражает это ожидание по-русски.
- source_word: ἐκ τῶν μαθητῶν
  choice: из учеников
  rationale: Сохраняет значение принадлежности к группе и звучит естественно в современном русском.
- source_word: τοῦ ἀνθρώπου τούτου
  choice: этого человека
  rationale: Передаёт обычное значение ἄνθρωπος и несколько отстранённый тон указательного местоимения, не превращая выражение в титул.
- source_word: ἐκεῖνος
  choice: Он
  rationale: В контексте однозначно относится к Петру; русское местоимение естественнее буквального «тот».
- source_word: Οὐκ εἰμί
  choice: Нет
  rationale: Краткий русский ответ естественно и точно передаёт эллиптическое отрицание «не являюсь», не добавляя нового содержания.
theological_decisions:
- issue: Сила отрицательного вопроса с μή
  choice: «Ты ведь тоже не из учеников…?» — вопрос, предполагающий отрицательный ответ
  alternative: Нейтральное «Ты тоже один из учеников…?»
  rationale: Так сохраняется прагматическая направленность греческого вопроса, не усиливая её до категорического утверждения.
- issue: Социальный статус παιδίσκη
  choice: В основном тексте «служанка»
  alternative: «Рабыня»
  rationale: Греческое слово допускает оба оттенка, однако здесь на первом плане роль девушки у входа, а её точный юридический статус не установлен; вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский, ясный и сдержанный. Реплика служанки передаёт ожидаемый отрицательный ответ, а ответ Петра остаётся предельно кратким. Маркер сноски поставлен после имени Петра, как в консультационном английском тексте.
