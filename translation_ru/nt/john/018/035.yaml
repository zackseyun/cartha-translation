  text: ἀπεκρίθη ὁ Πιλᾶτος· Μήτι ἐγὼ Ἰουδαῖός εἰμι; τὸ ἔθνος τὸ σὸν καὶ οἱ ἀρχιερεῖς παρέδωκάν σε ἐμοί· τί ἐποίησας;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/035.yaml
  text: Pilate answered[a], “I am not a Jew, am I? Your own nation and the chief priests handed you over to me. What have you done?”
translation:
  language: ru
  text: 'Пилат ответил: «Разве я иудей[a]? Твой народ и первосвященники передали тебя мне. Что ты сделал?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «житель Иудеи». Греческое слово может обозначать как этническую и религиозную принадлежность («иудей»), так и региональную («житель Иудеи»), в зависимости от контекста.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ответил
  rationale: Обычный повествовательный глагол ответа; естественно вводит реплику Пилата.
- source_word: Μήτι
  choice: Разве я…?
  rationale: Частица вводит риторический вопрос, предполагающий отрицательный ответ; русское «разве» передаёт эту направленность без добавления пояснений.
- source_word: Ἰουδαῖός
  choice: иудей
  rationale: В данном противопоставлении Пилата народу Иисуса прежде всего выражает этническую и религиозно-национальную принадлежность. Возможное региональное значение отмечено в сноске.
- source_word: τὸ ἔθνος τὸ σὸν
  choice: твой народ
  rationale: Здесь ἔθνος обозначает народ как общность; притяжательное местоимение сохраняет дистанцирующий тон Пилата. «Твой собственный народ» по-русски звучало бы избыточно.
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся и точное русское обозначение представителей высшего храмового священства во множественном числе.
- source_word: παρέδωκάν
  choice: передали
  rationale: Передаёт вручение Иисуса римской власти в судебном контексте, не привнося более узкого значения «предали».
- source_word: τί ἐποίησας
  choice: Что ты сделал?
  rationale: Прямой и естественный вопрос о поступке, который стал причиной нынешнего разбирательства.
theological_decisions:
- issue: Значение Ἰουδαῖος в Евангелии от Иоанна
  choice: иудей
  alternative: иудеянин
  rationale: Риторический вопрос Пилата и последующее «твой народ» поддерживают широкое этническое и национальное значение. Поскольку слово может также обозначать жителя Иудеи, эта реальная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; реплика краткая и риторически острая. Местоимения «ты/тебя» оставлены со строчной буквы, поскольку регистр оригинала не кодирует особого почтительного написания и говорит Пилат.
