  source_fidelity: Текст в целом точно передаёт последовательность и судебно-полемический тон греческого оригинала. Однако ἐλάλησα — аорист, а не имперфект, как утверждает обоснование; перевод «говорил» в этой краткой реплике может неоправданно вносить длительный аспект. Более точное и естественное «сказал» согласует оба прошедших аориста (ἐλάλησα, εἶπον), не устраняя различия, несущественного для русского употребления.
  naturalness: Русский текст краток, современен и хорошо читается. «Допрашиваешь» уместно в сцене официального разбирательства, а «Спроси» естественно передаёт второй, параллельный императив без неуклюжего «допроси». Порядок «что Я им сказал» несколько естественнее и яснее, чем «что Я говорил им».
  terminology: Заглавные местоимения соответствуют заявленной библейской редакционной традиции. «Вот» удачно передаёт ἴδε как указательно-привлекающую внимание частицу; сноска корректно отмечает возможный более буквальный призыв к зрительному вниманию.
