  text: τί με ⸂ἐρωτᾷς; ἐρώτησον⸃ τοὺς ἀκηκοότας τί ἐλάλησα αὐτοῖς· ἴδε οὗτοι οἴδασιν ἃ εἶπον ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/021.yaml
  text: Why do you question me? Question those who have heard what I said to them. Look[a], they know what I said.
translation:
  language: ru
  text: Почему ты Меня допрашиваешь? Спроси тех, кто слышал, что Я им сказал. Вот[a], они знают, что Я сказал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Посмотри: они знают, что Я сказал».'
    reason: Лексема ἴδε может передаваться как призыв посмотреть или как частица, привлекающая внимание.
lexical_decisions:
- source_word: τί με ἐρωτᾷς
  choice: Почему ты Меня допрашиваешь?
  rationale: Вопрос с τί выражает прямой вызов, а «допрашиваешь» естественно передаёт официальный характер разбирательства у первосвященника, не превращая реплику в специальную юридическую формулу.
- source_word: ἐρώτησον
  choice: Спроси
  rationale: Аористный императив требует непосредственного действия. В русском повтор «допроси» звучал бы неестественно и мог бы предполагать формальный допрос свидетелей; «спроси» ясно и точно передаёт повеление.
- source_word: τοὺς ἀκηκοότας
  choice: тех, кто слышал
  rationale: Перфектное причастие обозначает людей, слышавших речь Иисуса и потому способных свидетельствовать о ней. Русская форма «слышал» передаёт это естественно.
- source_word: τί ἐλάλησα αὐτοῖς
  choice: что Я говорил им
  rationale: Имперфект ἐλάλησα здесь относится к тому, что Иисус говорил слушателям; «говорил» естественно передаёт речь без добавочного оттенка наставления.
- source_word: ἴδε
  choice: Вот
  rationale: ἴδε привлекает внимание к названным людям. Русское «вот» кратко и современно, тогда как «взгляни» могло бы чрезмерно подчёркивать буквальное зрительное действие.
- source_word: οὗτοι οἴδασιν
  choice: они знают
  rationale: Местоимение «они» естественно отсылает к только что упомянутым слушателям; указательная сила οὗτοι поддерживается предшествующим «вот».
- source_word: ἃ εἶπον ἐγώ
  choice: что Я говорил
  rationale: «Что Я говорил» идиоматично передаёт содержание известного им свидетельства. Явное ἐγώ создаёт акцент на говорящем, который в русском поддержан личным местоимением «Я».
theological_decisions:
- issue: Официально-судебный тон ответа Иисуса первосвященнику
  choice: Передать первое ἐρωτάω глаголом «допрашиваешь», а повеление — нейтральным «спроси».
  alternative: 'Передать оба вхождения одинаково: «Почему ты Меня спрашиваешь? Спроси…»'
  rationale: Контекст позволяет услышать в первом вопросе оттенок допроса, но русский требует избежать неестественного «допроси тех». Различие сохраняет судебную обстановку, не усиливая её сверх меры.
translation_notes:
  register: Современный литературный русский язык с достойным, прямым тоном. Заглавные местоимения при обращении к Иисусу и от Его лица следуют принятой русской библейской издательской традиции. Синтаксис сохраняет краткость и настойчивость оригинала.
