  text: εἶπεν οὖν αὐτοῖς ⸀ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς, καὶ κατὰ τὸν νόμον ὑμῶν κρίνατε αὐτόν. ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Ἡμῖν οὐκ ἔξεστιν ἀποκτεῖναι οὐδένα·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/031.yaml
  text: So Pilate said to them[a], “Take him yourselves and judge him according to your law.” The Jews said to him, “It is not lawful for us to put anyone to death.”
translation:
  language: ru
  text: 'Тогда Пилат сказал им: «Возьмите его сами и судите по вашему закону». Иудеи[a] ответили ему: «Нам не позволено предавать смерти кого бы то ни было».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч. οἱ Ἰουδαῖοι: «иудеи». В этом контексте речь идёт об иудейских властях или обвинителях, разговаривавших с Пилатом, а не обо всём иудейском народе.'
    reason: Уточнение контекстуального значения οἱ Ἰουδαῖοι и предотвращение обобщающего прочтения.
lexical_decisions:
- source_word: οὖν
  choice: Тогда
  rationale: Передаёт повествовательную связь с предыдущей репликой естественно для современного русского языка; возможный оттенок следствия сохраняется контекстом.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: Возьмите его сами
  rationale: Явное ὑμεῖς придаёт повелению противопоставительный акцент, естественно выражаемый русским «сами».
- source_word: κατὰ τὸν νόμον ὑμῶν
  choice: по вашему закону
  rationale: Обычная русская формула соответствия правовой норме; сохраняет дистанцирующее «вашему».
- source_word: κρίνατε αὐτόν
  choice: судите
  rationale: Сохраняет широкий юридический смысл κρίνω, не сужая его до конкретной формы судебного разбирательства.
- source_word: οἱ Ἰουδαῖοι
  choice: Иудеи
  rationale: Формально передаёт греческое обозначение, а сноска уточняет, что здесь речь идёт о присутствующих иудейских властях или обвинителях, а не обо всём народе.
- source_word: Ἡμῖν οὐκ ἔξεστιν
  choice: Нам не позволено
  rationale: Естественно передаёт отсутствие законного права или разрешения, не уточняя сверх текста, кем именно установлен запрет.
- source_word: ἀποκτεῖναι οὐδένα
  choice: предавать смерти кого бы то ни было
  rationale: В судебном контексте выражает юридическое лишение жизни точнее, чем общее «убивать», при этом не сужает значение до технического термина «казнить».
theological_decisions:
- issue: Кого обозначает οἱ Ἰουδαῖοι в данном контексте
  choice: В основном тексте — «Иудеи», с контекстуальным пояснением в сноске
  alternative: «иудейские власти» или «иудейские обвинители»
  rationale: Так сохраняется формулировка греческого текста и одновременно предотвращается ошибочное отнесение реплики ко всему иудейскому народу.
- issue: Характер запрета в словах Ἡμῖν οὐκ ἔξεστιν
  choice: «Нам не позволено»
  alternative: «Мы не вправе» или «Нам не разрешается»
  rationale: Перевод сохраняет неоднозначность относительно точного правового основания запрета и не вносит в основной текст историко-правового объяснения.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Реплики переданы естественно, но юридические оттенки сохранены; «предавать смерти» выбрано вместо разговорного «убивать» и более узкого «казнить».
