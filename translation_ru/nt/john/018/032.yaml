  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος τοῦ Ἰησοῦ πληρωθῇ ὃν εἶπεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/032.yaml
  text: so that the word of Jesus would be fulfilled[a], which he had spoken[c][b], indicating by what kind of death he was about to die.
translation:
  language: ru
  text: чтобы исполнилось слово Иисуса[a], которое Он сказал[c], давая понять, какой смертью Ему предстояло умереть.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сказанное Иисусом».'
    reason: lexical_alternative
  - marker: b
    text: Иисус ранее указал на способ Своей смерти — вероятно, на распятие; ср. Ин. 12:32–33.
    reason: cross_reference
  - marker: c
    text: 'Или: «которое Он сказал, чтобы показать».'
    reason: syntactic_alternative
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт целевое или результативное значение союза и сохраняет связь с предшествующим стихом.
- source_word: ὁ λόγος τοῦ Ἰησοῦ
  choice: слово Иисуса
  rationale: Сохраняет характерную для Иоанна формулу исполнения; здесь λόγος означает высказанное Иисусом изречение, а не титул «Слово» из Ин. 1:1.
- source_word: πληρωθῇ
  choice: исполнилось
  rationale: Передаёт аорист пассивного залога в сослагательном наклонении и сохраняет богословски значимый мотив исполнения сказанного.
- source_word: ὃν εἶπεν
  choice: которое Он сказал
  rationale: Относительное местоимение отсылает к «слову»; русский синтаксис прямо сохраняет эту связь.
- source_word: σημαίνων
  choice: давая понять
  rationale: Естественно передаёт обстоятельственное причастие и значение указания на смысл или способ, не превращая его однозначно в придаточное цели.
- source_word: ποίῳ θανάτῳ
  choice: какой смертью
  rationale: Передаёт вопрос о виде и способе смерти, сохраняя творительный оттенок греческого дательного.
- source_word: ἤμελλεν ἀποθνῄσκειν
  choice: Ему предстояло умереть
  rationale: Выражает ожидаемое будущее, не усиливая μέλλω до однозначного утверждения о предопределении.
theological_decisions:
- issue: Исполнение прежнего слова Иисуса
  choice: «чтобы исполнилось слово Иисуса»
  alternative: «чтобы сбылось сказанное Иисусом»
  rationale: «Исполнилось» сохраняет характерный для Евангелия язык исполнения и его богословский вес, тогда как «сбылось» звучит более обще и ослабляет этот мотив.
- issue: Смысл μέλλω применительно к смерти Иисуса
  choice: «Ему предстояло умереть»
  alternative: «Ему было суждено умереть»
  rationale: Выбранный вариант передаёт будущее ожидание и близость события, не внося в сам глагол более сильного утверждения о предопределении.
- issue: Связь причастия σημαίνων с глаголом εἶπεν
  choice: «сказал, давая понять»
  alternative: «сказал, чтобы показать»
  rationale: Причастная конструкция сохраняет допустимую смысловую открытость между пояснением и целью и ближе следует греческому синтаксису.
translation_notes:
  register: Современный литературный русский с сохранением сдержанного библейского достоинства. Строчная начальная буква уместна, поскольку стих синтаксически продолжает Ин. 18:31. Местоимение «Он» написано с прописной буквы согласно принятой русской библейской издательской традиции.
