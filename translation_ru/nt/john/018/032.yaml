  source_fidelity: 'Текст точно передаёт греческий синтаксис и смысл: ἵνα πληρωθῇ отражено как «чтобы исполнилось», λόγος — как «слово», а относительное предложение и причастие σημαίνων сохранены без искусственного усиления. «Какой смертью» передаёт ποίῳ θανάτῳ как вопрос о виде/способе смерти; «Ему предстояло умереть» адекватно передаёт ἤμελλεν ἀποθνῄσκειν, не привнося идеи предопределённости.'
