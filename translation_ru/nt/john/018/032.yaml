  terminology: «Исполнилось слово Иисуса» сохраняет важный для Иоанна мотив исполнения, не смешивая λόγος здесь с титульным «Слово» из Ин. 1:1. Имя Иисуса, терминология смерти и примечание о вероятной отсылке к распятию оформлены корректно; примечания не навязывают догматического толкования.
