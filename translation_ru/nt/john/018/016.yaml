  verdict: approve
  source_fidelity: 'Перевод точно передаёт греческий текст: «стоял» корректно выражает продолжающееся положение (εἱστήκει), «снаружи у двери» сохраняет оба пространственных компонента, а «вышел… и ввёл Петра внутрь» воспроизводит последовательность действий. «Которого знал первосвященник» адекватно передаёт ὁ γνωστὸς τοῦ ἀρχιερέως, не определяя степень или характер знакомства.'
