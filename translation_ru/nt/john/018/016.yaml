  terminology: «Ученик», «первосвященник» и «привратница» употреблены точно и в подходящем регистре. Женский род «привратнице» обоснован женским артиклем τῇ при θυρωρῷ. Сноски стоят у соответствующих слов и сохраняют лексическую неопределённость γνωστός и ролевое значение θυρωρός. В английской аудиторской записи маркеры сносок, по-видимому, размещены у иных слов, однако русские маркеры и их содержание внутренне согласованы и соответствуют греческому тексту.
