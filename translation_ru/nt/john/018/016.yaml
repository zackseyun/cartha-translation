source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος εἱστήκει πρὸς τῇ θύρᾳ ἔξω. ἐξῆλθεν οὖν ὁ μαθητὴς ὁ ἄλλος ⸀ὁ γνωστὸς ⸂τοῦ ἀρχιερέως⸃ καὶ εἶπεν τῇ θυρωρῷ καὶ εἰσήγαγεν τὸν Πέτρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/016.yaml
  text: But Peter was standing outside at the door[a]. So the other disciple, who was known to the high priest[b], went out and spoke to the doorkeeper and brought Peter in.
translation:
  language: ru
  text: Пётр же стоял снаружи у двери. Тогда другой ученик, которого знал первосвященник[a], вышел, обратился к привратнице[b] и ввёл Петра внутрь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был знаком с первосвященником». Греческий текст не уточняет, насколько близко они были знакомы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «женщине, сторожившей вход». Греческое слово обозначает человека, находившегося у входа и следившего за ним.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκει
  choice: стоял
  rationale: Форма передаёт продолжающееся состояние Петра; русское «стоял» естественно выражает его положение в этот момент.
- source_word: πρὸς τῇ θύρᾳ ἔξω
  choice: снаружи у двери
  rationale: 'Перевод сохраняет оба пространственных элемента: Пётр находился вне двора и возле входной двери.'
- source_word: ὁ μαθητὴς ὁ ἄλλος
  choice: другой ученик
  rationale: «Ученик» — устойчивый и контекстуально точный перевод μαθητής в евангельском повествовании.
- source_word: ὁ γνωστὸς τοῦ ἀρχιερέως
  choice: которого знал первосвященник
  rationale: Такая формулировка естественна по-русски и не уточняет степень близости между ними, не обозначенную греческим текстом.
- source_word: ἀρχιερεύς
  choice: первосвященник
  rationale: Общепринятое русское наименование данной иудейской священнической должности.
- source_word: εἶπεν τῇ θυρωρῷ
  choice: обратился к привратнице
  rationale: Поскольку содержание речи не приводится, «обратился» звучит естественнее буквального «сказал»; женская форма артикля указывает, что у входа находилась женщина.
- source_word: εἰσήγαγεν τὸν Πέτρον
  choice: ввёл Петра внутрь
  rationale: Глагол означает привести или ввести внутрь; выбранный вариант ясно передаёт переход Петра через вход.
