source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτῷ ὁ Πιλᾶτος· Οὐκοῦν βασιλεὺς εἶ σύ; ἀπεκρίθη ⸀ὁ Ἰησοῦς· Σὺ λέγεις ὅτι βασιλεύς ⸀εἰμι. ἐγὼ εἰς τοῦτο γεγέννημαι καὶ εἰς τοῦτο ἐλήλυθα εἰς τὸν κόσμον ἵνα μαρτυρήσω τῇ ἀληθείᾳ· πᾶς ὁ ὢν ἐκ τῆς ἀληθείας ἀκούει μου τῆς φωνῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/037.yaml
  text: 'Then Pilate said to him[a], “So then, are you a king?” Jesus answered, “You say that I am a king. For this I have been born, and for this I have come into the world: that I should bear witness to the truth. Everyone who is of the truth listens to my voice.”'
translation:
  language: ru
  text: 'Тогда Пилат сказал ему: «Итак, ты царь?» Иисус ответил: «Ты говоришь, что я царь.[a] Я для того родился и для того пришёл в мир, чтобы свидетельствовать об истине. Всякий, кто от истины, слышит мой голос».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «Ты говоришь: „Я царь“» или «Ты верно говоришь, что я царь». Греческая фраза кратка и может звучать как сдержанное подтверждение.'
    reason: Сохраняет неоднозначность краткой греческой формулировки ответа Иисуса и ясно обозначает, что альтернативы относятся к его словам.
lexical_decisions:
- source_word: Οὐκοῦν
  choice: Итак
  rationale: Передаёт вывод, который Пилат делает из предшествующих слов Иисуса, и естественно звучит в русском вопросе.
- source_word: βασιλεὺς
  choice: царь
  rationale: Обычное и контекстуально точное обозначение царя; сохраняет как политический, так и мессианский смысл допроса.
- source_word: Σὺ λέγεις ὅτι βασιλεύς εἰμι
  choice: Ты говоришь, что я царь
  rationale: Близко воспроизводит краткую и неоднозначную греческую формулировку, не превращая её без достаточных оснований ни в категорическое подтверждение, ни в уклончивое отрицание.
- source_word: γεγέννημαι
  choice: я … родился
  rationale: Естественный русский эквивалент перфекта в данном контексте; не вносит отсутствующих здесь богословских ассоциаций слова «рождён» в значении происхождения.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: пришёл в мир
  rationale: Сохраняет отдельное высказывание о приходе Иисуса в мир и его возможный иоанновский смысл миссии и происхождения.
- source_word: μαρτυρήσω τῇ ἀληθείᾳ
  choice: свидетельствовать об истине
  rationale: Естественно передаёт целевую конструкцию и сохраняет судебно-свидетельскую лексику Евангелия от Иоанна.
- source_word: πᾶς ὁ ὢν ἐκ τῆς ἀληθείας
  choice: всякий, кто от истины
  rationale: Сохраняет образ источника или принадлежности, выраженный предлогом ἐκ, не сводя его к одному толкованию.
- source_word: ἀκούει μου τῆς φωνῆς
  choice: слышит мой голос
  rationale: Передаёт обычное значение ἀκούω и сохраняет естественную русскую формулировку и связь с иоанновским образом голоса пастыря; контекст допускает также оттенок внимательного, послушного слушания.
theological_decisions:
- issue: Оттенок ответа Иисуса Пилату (Σὺ λέγεις ὅτι βασιλεύς εἰμι)
  choice: 'Неоднозначное, сдержанное подтверждение: «Ты говоришь, что я царь»'
  alternative: 'Категорическое подтверждение: «Ты верно говоришь, что я царь»; либо более дистанцированный ответ: «Это говоришь ты»'
  rationale: Греческая фраза допускает несколько оттенков, но сама по себе не выражает ни усиленного подтверждения, ни отрицания. Основной текст сохраняет её краткость, а примечание указывает возможные прочтения.
- issue: Соотношение выражений «родился» и «пришёл в мир»
  choice: Сохранить обе части как самостоятельные и параллельные
  alternative: Объединить их в одно общее утверждение о миссии
  rationale: Иоанновская формулировка различает рождение и приход в мир и может нести смысл, связанный с воплощением; перевод не устраняет это различие и не добавляет догматического пояснения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой («всякий», «свидетельствовать»). Местоимения написаны со строчной буквы в соответствии с современной нейтральной издательской практикой и без добавления отсутствующих в греческом тексте графических почтительных форм.
