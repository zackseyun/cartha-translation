base_translation:
  language: en
  yaml_path: translation/nt/john/018/005.yaml
  text: They answered him, “Jesus the Nazarene.” He said to them, “I am he.” Now Judas, who was betraying him, was also standing with them.
translation:
  language: ru
  text: 'Они ответили ему: «Иисуса Назарянина». Он сказал им: «Это я».[a] Иуда, который предавал его, тоже стоял с ними.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я есть» (греч. ἐγώ εἰμι); здесь выражение служит ответом «Это я», но может сохранять и более широкий оттенок.'
    reason: Сохранить буквальную форму и подлинную смысловую неоднозначность греческого выражения.
lexical_decisions:
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Иисуса Назарянина
  rationale: Винительный падеж сохранён как прямой ответ на подразумеваемое «кого вы ищете?»; «Назарянин» — естественное современное обозначение уроженца или жителя Назарета.
- source_word: Ἐγώ εἰμι
  choice: Это я
  rationale: В данном диалоге это естественный русский ответ со значением самоидентификации; при этом сноска сохраняет буквальную форму и возможный более широкий смысл выражения.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: который предавал его
  rationale: Причастие настоящего времени передаёт разворачивающееся предательство, а не только будущий или уже завершённый поступок.
- source_word: εἱστήκει ... μετ’ αὐτῶν
  choice: стоял с ними
  rationale: 'Сохраняется пространственная и повествовательная деталь: Иуда находился среди пришедшей группы и разделял её позицию.'
theological_decisions:
- issue: Возможный богословский оттенок Ἐγώ εἰμι
  choice: 'В основном тексте: «Это я»; буквальная форма указана в сноске'
  alternative: «Я есмь» или «Я есть»
  rationale: Непосредственный синтаксический контекст требует ответа о личности разыскиваемого, однако формула ἐγώ εἰμι у Иоанна может восприниматься как намеренно многозначная. Сноска сохраняет эту напряжённость, не навязывая исключительно теофаническое прочтение.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Порядок фраз близок к греческому повествованию; союз δέ перед сообщением об Иуде передан естественным присоединением без тяжеловесного «же».
