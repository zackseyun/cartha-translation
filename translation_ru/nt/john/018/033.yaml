  yaml_path: translation/nt/john/018/033.yaml
  text: So Pilate went back into the governor’s headquarters and called Jesus and said to him[b][a], “Are you the King of the Jews?”
translation:
  language: ru
  text: 'Итак, Пилат снова вошёл в преторию[a], позвал Иисуса и сказал ему: «Ты — царь иудеев[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть в официальную резиденцию или штаб-квартиру римского наместника.
