lexical_decisions:
- source_word: Εἰσῆλθεν οὖν πάλιν
  choice: Тогда Пилат снова вошёл
  rationale: Сочетание передаёт переход к следующему действию и повторный вход Пилата. «Тогда» естественно выражает повествовательную связь οὖν, а «снова вошёл» — значение πάλιν при глаголе движения.
- source_word: πραιτώριον
  choice: преторию
  rationale: «Претория» — точное и закрепившееся в русском библейском языке обозначение официальной резиденции или штаб-квартиры римского наместника; значение пояснено в сноске.
- source_word: ἐφώνησεν τὸν Ἰησοῦν
  choice: позвал Иисуса
  rationale: Здесь φωνέω означает позвать кого-либо. «Позвал» звучит естественно и не усиливает смысл до формального «приказал привести».
- source_word: εἶπεν αὐτῷ
  choice: сказал Ему
  rationale: Сохранён общий глагол речи λέγω, тогда как вопросительная форма прямой речи сама передаёт функцию вопроса.
- source_word: Σὺ εἶ ὁ βασιλεὺς
  choice: Ты — Царь
  rationale: Русская вопросительная интонация позволяет сохранить начальную позицию и акцент явного местоимения σύ. Тире естественно оформляет именную часть сказуемого; прописная буква отмечает титульное употребление без добавления богословского вывода.
- source_word: τῶν Ἰουδαίων
  choice: иудеев
  rationale: В контексте римского обвинения традиционное и исторически уместное «Царь иудеев» передаёт этнорелигиозно-политическое обозначение. Возможный географический оттенок «жителей Иудеи» сохранён в сноске.
theological_decisions:
- issue: Значение Ἰουδαίων в царском титуле
  choice: иудеев
  alternative: жителей Иудеи
  rationale: В сцене суда речь идёт о формулировке политического обвинения, для которой «Царь иудеев» наиболее естественно и исторически узнаваемо. Поскольку Ἰουδαῖοι в некоторых контекстах может обозначать жителей Иудеи, эта неоднозначность отмечена, но не внесена в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. «Претория» сохраняет точный исторический термин и сопровождается доступным пояснением. Реплика Пилата построена естественно для русского языка, при этом начальное «Ты» сохраняет акцент греческого текста.
