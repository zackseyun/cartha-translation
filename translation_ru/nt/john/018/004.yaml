  source_fidelity: '«Тогда» приемлемо передаёт повествовательно-логическое οὖν в данном контексте. «Зная всё, что Его ожидало» точно выражает εἰδὼς πάντα τὰ ἐρχόμενα ἐπ’ αὐτόν: сохранены как предшествующее знание Иисуса, так и полнота предстоящего. «Вышел» и «сказал им» соответствуют ἐξῆλθεν и λέγει; прошедшее время для исторического настоящего естественно по-русски. Вопрос «Кого вы ищете?» точно передаёт греческий текст.'
  naturalness: Текст звучит естественно, ясно и литературно. Порядок слов сохраняет смысловой акцент на осведомлённости Иисуса и не утяжеляет повествование.
  terminology: Имя Иисус передано нормативно. «Искать» сохраняет более значимый и нейтральный регистр ζητεῖτε, чем разговорное «разыскивать» или «ищете кого-то». Формулировка не вносит конфессиональных или доктринальных уточнений.
