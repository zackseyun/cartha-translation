  text: Ἰησοῦς ⸀οὖν εἰδὼς πάντα τὰ ἐρχόμενα ἐπ’ αὐτὸν ⸂ἐξῆλθεν, καὶ λέγει⸃ αὐτοῖς· Τίνα ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/004.yaml
  text: Jesus therefore[a], knowing all the things coming upon him, went out and said to them, “Whom are you seeking?”
translation:
  language: ru
  text: 'Тогда Иисус, зная всё, что Его ожидало[a], вышел и сказал им: «Кого вы ищете?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «всё, что надвигалось на Него»; также возможно: «всё, что должно было с Ним произойти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: тогда
  rationale: Передаёт повествовательное продолжение и связь с предшествующими событиями естественным для современного русского языка способом; «итак» здесь звучало бы излишне рассудочно.
- source_word: εἰδὼς
  choice: зная
  rationale: Естественно передаёт обстоятельственное причастие и подчёркивает предварительное осознание Иисусом предстоящих событий.
- source_word: πάντα τὰ ἐρχόμενα ἐπ’ αὐτόν
  choice: всё, что Его ожидало
  rationale: Идиоматично передаёт полноту πάντα и направленность грядущих событий на Иисуса, не конкретизируя их сверх сказанного в греческом тексте. Более буквальный образ отмечен в сноске.
- source_word: ἐξῆλθεν
  choice: вышел
  rationale: Прямой и нейтральный эквивалент, не добавляющий отсутствующих в тексте деталей вроде движения «вперёд».
- source_word: λέγει
  choice: сказал
  rationale: Греческий исторический презенс естественно передан русским прошедшим временем в повествовании.
- source_word: Τίνα ζητεῖτε
  choice: Кого вы ищете?
  rationale: Точно передаёт вопрос с τίνα в роли прямого дополнения и сохраняет весомое, но естественное значение ζητέω.
theological_decisions:
- issue: Предварительное знание Иисуса о предстоящих Ему событиях
  choice: Сохранено прямое утверждение, что Иисус знал всё, что Его ожидало.
  alternative: Можно было бы усилить формулировку до «в совершенстве зная всё, что должно было с Ним произойти».
  rationale: Греческий текст ясно подчёркивает полноту знания Иисуса, но не требует добавления систематического богословского определения или указания на предопределённость событий.
translation_notes:
  register: Современный литературный русский язык; фраза звучит естественно и достойно. Синтаксис сохраняет акцент на осведомлённости Иисуса и Его сознательном выходе навстречу пришедшим.
