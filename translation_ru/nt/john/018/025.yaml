base_translation:
  language: en
  yaml_path: translation/nt/john/018/025.yaml
  text: Simon Peter was standing and warming himself. So they said to him[a], “You are not also one of his disciples, are you?” He denied it and said, “I am not.”
translation:
  language: ru
  text: 'Симон Пётр стоял и грелся. Тогда его спросили[a]: «И ты не из его учеников?» Он отрёкся и сказал: «Нет, я не из них».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Неужели и ты из его учеников?» Греческая форма вопроса предполагает отрицательный ответ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ
  choice: тем временем стоял
  rationale: δέ — мягкая повествовательная связка; «тем временем» естественно возвращает повествование к Петру и не выражает резкого противопоставления.
- source_word: ἑστὼς καὶ θερμαινόμενος
  choice: стоял и грелся
  rationale: Передаёт продолжающееся положение и действие; упоминание огня не добавляется, поскольку в этом стихе его нет.
- source_word: εἶπον οὖν αὐτῷ
  choice: Тогда его спросили
  rationale: Множественное число сохранено неопределённо-личной конструкцией, а οὖν передано естественной повествовательной связкой «тогда»; глагол «спросили» соответствует форме последующей прямой речи.
- source_word: Μὴ καὶ σὺ ... εἶ;
  choice: И ты не ...?
  rationale: Начальное μή задаёт вопрос с ожиданием отрицательного ответа, а καὶ σὺ передано сочетанием «и ты».
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: из Его учеников
  rationale: ἐκ с родительным обозначает принадлежность к группе; русская конструкция естественна и сохраняет образ исходного выражения.
- source_word: ἠρνήσατο ἐκεῖνος
  choice: Он отрёкся
  rationale: «Отрёкся» передаёт отказ признать свою принадлежность к ученикам; ἐκεῖνος здесь выражено обычным местоимением без избыточной эмфазы.
- source_word: Οὐκ εἰμί
  choice: Нет, я не из них
  rationale: Русский ответ требует естественного восполнения подразумеваемой именной части из вопроса; «из них» не расширяет смысл за пределы принадлежности к ученикам.
theological_decisions:
- issue: Характер отречения Петра
  choice: Передать как отрицание своей принадлежности к ученикам Иисуса
  alternative: Расширить до общего отрицания связи с Иисусом
  rationale: Греческий ответ краток и эллиптичен, а его подразумеваемое содержание определяется непосредственно заданным вопросом.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и ясное. Местоимение «Его» написано с прописной буквы по принятой в русском библейском стиле традиции, без изменения смысла исходного текста.
