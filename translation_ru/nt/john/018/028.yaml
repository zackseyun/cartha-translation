source:
  edition: SBLGNT
  text: Ἄγουσιν οὖν τὸν Ἰησοῦν ἀπὸ τοῦ Καϊάφα εἰς τὸ πραιτώριον· ἦν δὲ πρωΐ· καὶ αὐτοὶ οὐκ εἰσῆλθον εἰς τὸ πραιτώριον, ἵνα μὴ μιανθῶσιν ⸀ἀλλὰ φάγωσιν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/028.yaml
  text: So they led Jesus from Caiaphas into the governor’s headquarters[a]. Now it was early morning. They themselves did not enter the headquarters, so that they would not be defiled[c][b], but could eat the Passover.
translation:
  language: ru
  text: Итак, Иисуса повели от Каиафы в резиденцию правителя[a]. Было раннее утро. Сами они не вошли в резиденцию, чтобы не оскверниться[b] и тем самым могли есть Пасху[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в преторий» — официальную резиденцию римского правителя, служившую также местом управления и суда.'
    reason: lexical_alternative
  - marker: b
    text: То есть не стать обрядово нечистыми.
    reason: cultural_note
  - marker: c
    text: Выражение «есть Пасху» может относиться либо непосредственно к пасхальной трапезе, либо шире к праздничным трапезам и обрядам в дни Пасхи.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγουσιν
  choice: повели
  rationale: Историческое настоящее естественно передано русским прошедшим временем; «повели» соответствует перемещению Иисуса под стражей.
- source_word: οὖν
  choice: итак
  rationale: Сохраняет связь с предшествующим повествованием и оттенок следствия или продолжения.
- source_word: πραιτώριον
  choice: резиденция правителя
  rationale: Передаёт официальную резиденцию и место судебно-административной деятельности римского наместника понятнее, чем одна транслитерация.
- source_word: πρωΐ
  choice: раннее утро
  rationale: Обозначает раннюю часть дня, не уточняя время как рассвет.
- source_word: αὐτοὶ
  choice: сами они
  rationale: 'Сохраняет эмфатическое противопоставление: Иисуса привели туда, однако приведшие сами внутрь не вошли.'
- source_word: μιανθῶσιν
  choice: оскверниться
  rationale: В данном контексте обозначает приобретение обрядовой нечистоты; примечание поясняет культурно-религиозный смысл.
- source_word: φάγωσιν τὸ πάσχα
  choice: иметь возможность вкусить пасху
  rationale: Сохраняет буквальную широту выражения и целевое значение конструкции, не решая спор о том, имеется ли в виду собственно пасхальная трапеза или более широкие праздничные трапезы.
- source_word: Καϊάφα
  choice: Каиафа
  rationale: Традиционная русская передача личного имени.
- source_word: Ἰησοῦν
  choice: Иисус
  rationale: Традиционная русская передача личного имени.
theological_decisions:
- issue: Значение выражения «вкусить пасху» в связи с хронологией Страстей у Иоанна
  choice: Сохранено выражение «вкусить пасху» без уточнения его узкого или широкого значения.
  alternative: «есть пасхальную трапезу» или «участвовать в праздничных трапезах»
  rationale: Греческое выражение допускает обсуждение того, относится ли оно конкретно к пасхальной трапезе или шире к праздничной пище и обрядам. Перевод не устраняет эту смысловую и хронологическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. «Вкусить пасху» сохраняет традиционную религиозную формулу и неоднозначность оригинала; строчная буква в слове «пасха» обозначает пасхальную пищу или празднование, а не служит собственным названием праздника в современном редакционном употреблении.
