  text: ἔστιν δὲ συνήθεια ὑμῖν ἵνα ἕνα ⸂ἀπολύσω ὑμῖν⸃ ἐν τῷ πάσχα· βούλεσθε οὖν ⸄ἀπολύσω ὑμῖν⸅ τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/039.yaml
  text: But you have a custom that I release one man for you at the Passover[a]. So do you want me to release to you the King of the Jews?
translation:
  language: ru
  text: Но у вас есть обычай, по которому на Пасху я отпускаю вам одного человека. Итак, хотите, чтобы я отпустил вам Царя Иудейского?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царя иудеев»; возможно также: «царя жителей Иудеи». Греческое слово может обозначать и иудеев, и жителей Иудеи в зависимости от контекста; здесь оно входит в устойчивый титул, употребляемый в повествовании о страстях.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνήθεια
  choice: обычай
  rationale: Передаёт установившуюся общественную практику в контексте суда и праздника; «привычка» звучала бы слишком лично.
- source_word: ἵνα ἕνα ἀπολύσω ὑμῖν
  choice: чтобы я отпускал вам одного узника
  rationale: Придаточное раскрывает содержание обычая. Существительное «узника» естественно восполняет подразумеваемое лицо и ясно передаёт судебный контекст, хотя в греческом сказано буквально «одного».
- source_word: ἀπολύω
  choice: отпускал / отпустил
  rationale: Глагол точно обозначает освобождение заключённого; различие вида в русском естественно отражает повторяющийся обычай в первом случае и предлагаемое разовое действие во втором.
- source_word: ἐν τῷ πάσχα
  choice: на Пасху
  rationale: Естественное современное русское обозначение времени совершения действия в связи с праздником.
- source_word: βούλεσθε οὖν
  choice: Хотите же
  rationale: «Хотите» понятно и современно передаёт волеизъявление, а «же» сохраняет связующий, выводный оттенок οὖν без тяжеловесного «итак».
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: Царя Иудейского
  rationale: Устоявшаяся и естественная русская форма титула в повествовании о страстях; прописная буква отмечает его функцию как титула, не устраняя иронии контекста.
theological_decisions:
- issue: Значение Ἰουδαίων в титуле τὸν βασιλέα τῶν Ἰουδαίων
  choice: Царя Иудейского
  alternative: царя иудеев / царя жителей Иудеи
  rationale: В повествовании Иоанна это закреплённая формула царского и мессианского обвинения против Иисуса. «Иудейский» сохраняет привычный русский титул и допускает этнорелигиозный смысл; возможный региональный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю. Синтаксис сохраняет противопоставление δὲ и выводный переход οὖν. Формулировка dignified, без архаического «желаете ли»; «узника» добавлено для ясности по контексту.
