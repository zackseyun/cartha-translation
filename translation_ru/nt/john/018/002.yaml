source:
  edition: SBLGNT
  text: ᾔδει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν τὸν τόπον, ὅτι πολλάκις ⸀συνήχθη Ἰησοῦς ἐκεῖ μετὰ τῶν μαθητῶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/002.yaml
  text: Judas, who was betraying him, also knew the place, because Jesus had often gathered there with his disciples.
translation:
  language: ru
  text: Иуда, предававший Его[a], тоже знал это место, потому что Иисус часто собирался там со своими учениками[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выдававший Его»; буквально: «передававший Его».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «часто встречался там со своими учениками».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: знал
  rationale: Передаёт обычное значение οἶδα — знание или осведомлённость; в контексте речь идёт о знакомстве Иуды с местом.
- source_word: δὲ καὶ
  choice: тоже
  rationale: Частица δέ мягко продолжает повествование и не требует отдельного русского слова, тогда как καί сохраняется в добавочном значении «тоже».
- source_word: ὁ παραδιδοὺς αὐτὸν
  choice: предававший Его
  rationale: Причастный оборот сохраняет глагольную характеристику Иуды и нравственно-повествовательный смысл παραδίδωμι в рассказе о страстях.
- source_word: τὸν τόπον
  choice: это место
  rationale: Указательное «это» естественно отсылает к уже названному месту и передаёт определённость греческого артикля в русском контексте.
- source_word: ὅτι
  choice: потому что
  rationale: Здесь ὅτι вводит причину, по которой Иуда знал место.
- source_word: πολλάκις
  choice: часто
  rationale: Кратко и естественно передаёт неоднократность действия.
- source_word: συνήχθη
  choice: собирался
  rationale: 'Русская возвратная форма естественно передаёт пассивную по форме, но непереходную по смыслу конструкцию: Иисус неоднократно собирался там вместе с учениками.'
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: со своими учениками
  rationale: Передаёт совместность, выраженную μετά с родительным падежом, и естественно связывает учеников с Иисусом.
theological_decisions:
- issue: Значение παραδιδοὺς применительно к Иуде
  choice: предававший
  alternative: выдававший / передававший в руки властей
  rationale: В контексте повествования об аресте глагол обозначает не нейтральную передачу, а предательство; при этом сноска сохраняет буквальный образ передачи в чужие руки.
- issue: Значение пассивной формы συνήχθη
  choice: Иисус часто собирался там со своими учениками
  alternative: Иисус часто встречался там со своими учениками
  rationale: Выбранный вариант сохраняет лексику совместного собрания, не создавая неестественной русской пассивной конструкции и не привнося дополнительного богословского смысла.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельского повествования. Начальное δέ не передано искусственным вводным словом; связь с контекстом выражена плавным продолжением фразы. Местоимение «Его» написано с прописной буквы для ясной отсылки к Иисусу, тогда как притяжательное «своими» оставлено со строчной в соответствии с обычной современной нормой.
