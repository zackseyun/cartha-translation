source:
  edition: SBLGNT
  text: ἦν δὲ Καϊάφας ὁ συμβουλεύσας τοῖς Ἰουδαίοις ὅτι συμφέρει ἕνα ἄνθρωπον ⸀ἀποθανεῖν ὑπὲρ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/014.yaml
  text: Caiaphas was the one who had advised the Jews that it was better for one man to die for the people[a][b].
translation:
  language: ru
  text: Каиафа же был тем, кто посоветовал иудеям[a], что лучше одному человеку умереть за народ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иудейским руководителям» или «жителям Иудеи» — в зависимости от того, как в данном контексте понимается употреблённое Иоанном слово «иудеи».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «ради народа», «на благо народа»; в контексте выражение может также иметь представительский или жертвенный оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: же был
  rationale: δέ служит мягкой связкой с предыдущим повествованием; частица «же» передаёт эту связь, не создавая сильного противопоставления и не добавляя временного «теперь».
- source_word: Καϊάφας
  choice: Каиафа
  rationale: Имя передано в принятой русской библейской форме.
- source_word: ὁ συμβουλεύσας
  choice: тем, кто посоветовал
  rationale: Субстантивированное причастие указывает на Каиафу как на человека, ранее давшего этот совет; совершенный вид «посоветовал» естественно выражает завершённое предшествующее действие.
- source_word: τοῖς Ἰουδαίοις
  choice: иудеям
  rationale: В греческом тексте стоит общее обозначение без явного уточнения «руководители»; основной текст сохраняет эту формулировку, а возможные контекстуальные значения отмечены в сноске.
- source_word: ὅτι συμφέρει
  choice: что лучше
  rationale: συμφέρει выражает пользу или целесообразность; «лучше» естественно по-русски передаёт смысл в контексте политического расчёта.
- source_word: ἕνα ἄνθρωπον
  choice: одному человеку
  rationale: Сохранены числительное «один» и указание на отдельного человека; дательный падеж обусловлен русской конструкцией «лучше кому-либо умереть».
- source_word: ἀποθανεῖν
  choice: умереть
  rationale: Прямое и точное соответствие инфинитиву.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: за народ
  rationale: Краткая естественная формулировка сохраняет значение действия ради или на благо народа и одновременно не устраняет возможный заместительный или жертвенный оттенок.
- source_word: λαοῦ
  choice: народ
  rationale: λαός означает «народ»; здесь не следует заменять его словом «нация», поскольку в данном стихе отсутствует ἔθνος.
theological_decisions:
- issue: Возможный искупительный или заместительный оттенок ὑπὲρ τοῦ λαοῦ
  choice: за народ
  alternative: ради народа; на благо народа; вместо народа
  rationale: Предлог ὑπέρ допускает благотворное, представительское и в определённом контексте заместительное понимание. Основной текст сохраняет ёмкую формулировку, не превращая политический совет Каиафы в явное догматическое утверждение.
- issue: Референт τοῖς Ἰουδαίοις в Евангелии от Иоанна
  choice: иудеям
  alternative: иудейским руководителям; жителям Иудеи
  rationale: Сам греческий текст не сужает значение существительного. Поскольку в данном контексте оно может обозначать иудейское руководство, но формально выражено шире, основной текст сохраняет неоднозначность, а варианты приводятся в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением сдержанного повествовательного тона. Формулировка следует греческому тексту, не усиливая контраст δέ и не разрешая неоднозначность слов «иудеи» и ὑπέρ.
