base_translation:
  language: en
  yaml_path: translation/nt/john/018/022.yaml
  text: And when he had said these things[a], one of the officers standing by struck Jesus, saying[b], “Is this how you answer the high priest?”
translation:
  language: ru
  text: 'Когда Он это сказал, один из служителей, стоявший рядом, ударил Иисуса по лицу[a] и сказал: «Так Ты отвечаешь первосвященнику?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дал Иисусу пощёчину». Греческое выражение означает удар рукой, обычно по лицу, и может подразумевать пощёчину или сходный удар.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα δὲ αὐτοῦ εἰπόντος
  choice: Когда Он это сказал
  rationale: Генитив абсолютный передан естественным временным придаточным; «это» в русском языке идиоматично отсылает к только что сказанным словам, не меняя смысла греческого множественного ταῦτα.
- source_word: εἷς παρεστηκὼς τῶν ὑπηρετῶν
  choice: один из служителей, стоявших рядом
  rationale: ὑπηρέται здесь обозначает подчинённых должностных лиц при первосвященническом окружении; «служители» сохраняет широту термина и не уточняет без необходимости, что это была храмовая стража.
- source_word: ἔδωκεν ῥάπισμα τῷ Ἰησοῦ
  choice: ударил Иисуса по лицу
  rationale: Выражение обозначает удар рукой по лицу, вероятно пощёчину; выбранная формулировка естественна по-русски и не фиксирует точный вид удара.
- source_word: εἰπών
  choice: и сказал
  rationale: Сопутствующее причастие естественно передано однородным сказуемым в русском повествовании.
- source_word: Οὕτως ἀποκρίνῃ τῷ ἀρχιερεῖ;
  choice: Так Ты отвечаешь первосвященнику?
  rationale: «Так» точно передаёт указание на манеру ответа и сохраняет краткий, укоризненный тон вопроса; ἀρχιερεύς передан традиционным и точным словом «первосвященник».
theological_decisions:
- issue: Кем были ὑπηρέται
  choice: служители при первосвященническом окружении
  alternative: стражники / храмовая стража / слуги
  rationale: Контекст допускает официальных служителей, вероятно храмовый персонал, однако сам термин шире; перевод не вводит более узкую идентификацию как бесспорную.
translation_notes:
  register: Современный литературный русский язык; повествование сдержанное и ясное. Местоимение «Ты» в прямом обращении написано с прописной буквы согласно распространённой русской библейской традиции, без добавления богословского толкования.
