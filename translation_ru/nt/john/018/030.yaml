source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Εἰ μὴ ἦν οὗτος ⸂κακὸν ποιῶν⸃, οὐκ ἄν σοι παρεδώκαμεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/030.yaml
  text: They answered and said to him[a], “If this man were not an evildoer, we would not have handed him over to you.”
translation:
  language: ru
  text: 'Они сказали ему в ответ: «Если бы этот человек не делал зла[a], мы не передали бы его тебе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не был злодеем».'
    reason: В данном контексте причастное выражение κακὸν ποιῶν можно передать как обозначение человека по его поступкам, однако основной текст точнее сохраняет его глагольную форму.
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν
  choice: сказали ему в ответ
  rationale: Естественно передаёт оба глагола семитизированной повествовательной формулы, не создавая тяжеловесного русского «ответили и сказали».
- source_word: οὗτος
  choice: этот человек
  rationale: Сохраняет указательное, несколько дистанцированное обозначение Иисуса, не усиливая его до презрительного «этот тип».
- source_word: κακὸν ποιῶν
  choice: не делал зла
  rationale: Сохраняет глагольную силу причастия ποιῶν и обобщённый нравственный смысл κακόν, не превращая слова обвинителей в точный юридический термин.
- source_word: οὐκ ἄν ... παρεδώκαμεν
  choice: мы не передали бы
  rationale: Передаёт ирреальное следствие в прошедшем времени и судебно-контекстуальное значение παραδίδωμι.
- source_word: σοι ... αὐτόν
  choice: его тебе
  rationale: Естественный русский порядок дополнений; местоимения относятся соответственно к Иисусу и Пилату.
theological_decisions:
- issue: Характер обвинения против Иисуса
  choice: не делал зла
  alternative: не был злодеем; не был преступником
  rationale: Греческое κακὸν ποιῶν описывает совершающего зло, но не формулирует конкретного правового обвинения. Выбранный вариант сохраняет намеренную общность и уклончивость ответа.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Формула «сказали ему в ответ» естественнее буквального «ответили и сказали», а «передали» ясно звучит в контексте передачи обвиняемого власти.
