  source_fidelity: 'Текст точно передаёт греческую конструкцию: «сказали ему в ответ» естественно воспроизводит повествовательную формулу ἀπεκρίθησαν καὶ εἶπαν; «этот человек» сохраняет дистанцированное οὗτος; «не делал зла» передаёт глагольный характер κακὸν ποιῶν без неоправданной юридической конкретизации. Условное «Если бы… мы не передали бы» корректно отражает ирреальное условие и следствие οὐκ ἄν … παρεδώκαμεν.'
