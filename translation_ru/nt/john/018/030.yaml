  terminology: «Зло» сохраняет широкое, не техническое значение κακόν. Альтернатива «не был злодеем» уместно отмечена в сноске как возможная субстантивная передача, не подменяя основной глагольный смысл. Имена и специальные богословские термины в стихе отсутствуют.
