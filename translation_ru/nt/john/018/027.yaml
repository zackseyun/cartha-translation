base_translation:
  language: en
  yaml_path: translation/nt/john/018/027.yaml
  text: Then Peter denied it again[a], and immediately a rooster crowed.
translation:
  language: ru
  text: Тогда Пётр снова отрёкся[a], и тотчас пропел петух.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «снова это отрицал»; в греческом тексте дополнение прямо не названо, но подразумевается из предыдущего вопроса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: снова
  rationale: Наречие обозначает повторение и естественно передаёт очередное отречение Петра.
- source_word: οὖν
  choice: тогда
  rationale: Частица связывает ответ Петра с предшествующим вопросом и здесь естественно передаёт последовательность событий, не усиливая логическое следствие.
- source_word: ἠρνήσατο
  choice: отрёкся
  rationale: В контексте рассказа глагол означает отречение Петра; непереходная русская конструкция сохраняет отсутствие явно выраженного дополнения в греческом тексте.
- source_word: Πέτρος
  choice: Пётр
  rationale: Устоявшаяся русская форма личного имени.
- source_word: καὶ
  choice: и
  rationale: Простой соединительный союз связывает отречение с последовавшим событием.
- source_word: εὐθέως
  choice: тотчас
  rationale: Передаёт непосредственную временную последовательность в естественном и достойном повествовательном стиле.
- source_word: ἀλέκτωρ
  choice: петух
  rationale: Обычное современное русское обозначение самца курицы.
- source_word: ἐφώνησεν
  choice: пропел
  rationale: При подлежащем «петух» это естественный русский способ передать изданный им характерный звук; видовая форма уместна для единичного события.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким, напряжённым повествовательным ритмом. «Отрёкся» сохраняет традиционно узнаваемый, но по-прежнему понятный глагол; «тотчас» придаёт фразе достойное библейское звучание без архаизации.
