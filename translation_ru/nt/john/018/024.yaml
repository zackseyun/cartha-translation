  yaml_path: translation/nt/john/018/024.yaml
  text: So Annas sent him bound to Caiaphas the high priest[a].
translation:
  language: ru
  text: Итак, Анна послал Его связанным к первосвященнику Каиафе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, если понимать эти слова как вставное пояснение к предшествующим событиям: «Анна же ещё раньше послал Его связанным к первосвященнику Каиафе».'
    reason: Альтернативное контекстуальное понимание временной последовательности.
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Аорист действительного залога обозначает в основном тексте последовательное повествовательное действие; «послал» — естественный современный эквивалент.
- source_word: οὖν
  choice: тогда
  rationale: Союз отмечает переход и развитие повествования. «Тогда» естественно передаёт здесь последовательность, не усиливая логическое следствие.
- source_word: αὐτὸν
  choice: Его
  rationale: Местоимение относится к Иисусу; прописная буква соответствует принятой русской библейской издательской норме.
- source_word: ὁ Ἅννας
  choice: Анна
  rationale: Традиционная русская форма имени Ἅννας.
- source_word: δεδεμένον
  choice: связанным
  rationale: 'Перфектное страдательное причастие указывает на состояние Иисуса при отправлении: Он был связан. Формулировка не добавляет отсутствующего в греческом усиления «по-прежнему».'
- source_word: πρὸς Καϊάφαν
  choice: к … Каиафе
  rationale: Предлог πρός при глаголе движения обозначает направление к лицу; имя передано в традиционной русской форме и поставлено в дательном падеже.
- source_word: τὸν ἀρχιερέα
  choice: первосвященнику
  rationale: Термин обозначает должность иудейского первосвященника; в русском предложении приложение естественно ставится перед именем.
theological_decisions:
- issue: Последовательность событий в связи с ближайшим контекстом
  choice: 'Основной текст передаёт аорист как очередное событие повествования: Анна тогда послал Иисуса к Каиафе.'
  alternative: 'Понимать стих как вставное ретроспективное пояснение: «Анна же ещё раньше послал Его…»'
  rationale: Греческий аорист естественно допускает простое повествовательное прочтение, но контекст позволяет видеть здесь отсылку к уже совершившейся отправке. Основной текст не разрешает спор гармонизирующей добавкой, а примечание сохраняет контекстуальную альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис прост и понятен; сохранены связность рассказа, состояние δεδεμένον и неоднозначность временной последовательности посредством примечания.
