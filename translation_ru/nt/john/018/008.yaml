  text: ἀπεκρίθη Ἰησοῦς· Εἶπον ὑμῖν ὅτι ἐγώ εἰμι· εἰ οὖν ἐμὲ ζητεῖτε, ἄφετε τούτους ὑπάγειν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/008.yaml
  text: Jesus answered[a], “I told you that I am he. So if you are seeking me, let these men go.”
translation:
  language: ru
  text: 'Иисус ответил: «Я сказал вам, что это Я.[a] Итак, если вы ищете Меня, позвольте этим людям уйти».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я есть». В греческом тексте сказано буквально: «Я есть»; в данном контексте эти слова служат ответом при опознании, но могут также иметь дополнительный богословский оттенок.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ответил
  rationale: Обычная и естественная передача повествовательной формы ἀποκρίνομαι в диалоге.
- source_word: Εἶπον ὑμῖν
  choice: Я сказал вам
  rationale: Буквально и естественно передаёт аорист λέγω с косвенным дополнением ὑμῖν и отсылает к только что произнесённым словам Иисуса.
- source_word: ἐγώ εἰμι
  choice: это Я
  rationale: В контексте опознания по-русски естественно сказать «это Я»; при этом возможное абсолютное звучание «Я есть» сохранено в примечании.
- source_word: ζητεῖτε
  choice: ищете
  rationale: Настоящее время и прямое значение глагола естественно передаются формой «ищете».
- source_word: ἄφετε
  choice: позвольте
  rationale: Передаёт значение разрешения в аористном императиве, не привнося более узкого смысла освобождения из-под стражи.
- source_word: τούτους
  choice: этим людям
  rationale: Указательное местоимение относится к находящимся рядом спутникам Иисуса; существительное делает референт ясным по-русски без существенного смыслового добавления.
- source_word: ὑπάγειν
  choice: уйти
  rationale: В сочетании с ἄφετε обозначает разрешение удалиться; «уйти» здесь естественнее простого «идти».
theological_decisions:
- issue: Передача ἐγώ εἰμι в контексте Евангелия от Иоанна
  choice: это Я
  alternative: Я есть
  rationale: Непосредственно речь идёт об опознании Иисуса теми, кто пришёл Его арестовать, поэтому «это Я» ясно передаёт основной смысл. Однако в Евангелии от Иоанна абсолютное ἐγώ εἰμι может иметь дополнительный богословский оттенок; вариант «Я есть» указан в примечании, чтобы не устранять эту напряжённость.
translation_notes:
  register: Современный литературный русский язык; реплика звучит ясно и достойно. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской традиции.
