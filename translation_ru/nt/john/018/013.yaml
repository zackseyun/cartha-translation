source:
  edition: SBLGNT
  text: καὶ ⸀ἤγαγον πρὸς Ἅνναν πρῶτον· ἦν γὰρ πενθερὸς τοῦ Καϊάφα, ὃς ἦν ἀρχιερεὺς τοῦ ἐνιαυτοῦ ἐκείνου·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/013.yaml
  text: And they led him first to Annas, for he was the father-in-law of Caiaphas, who was high priest that year.
translation:
  language: ru
  text: И сначала его отвели к Анне, потому что он был тестем Каиафы, который в тот год был первосвященником.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: отвели его
  rationale: ἄγω означает «вести, отводить, приводить»; в контексте задержания «отвели» естественно передаёт перемещение Иисуса под стражей. Местоимение «его» восполняет подразумеваемое из контекста дополнение.
- source_word: πρὸς Ἅνναν
  choice: к Анне
  rationale: πρός с винительным падежом обозначает направление движения к лицу; русский эквивалент «к Анне» точен и естественен.
- source_word: πρῶτον
  choice: сначала
  rationale: Наречие указывает на первый этап последовательности; «сначала» ясно показывает, что Анна был первым, к кому отвели Иисуса.
- source_word: πενθερός
  choice: тесть
  rationale: Слово конкретно обозначает отца жены; «тесть» является точным современным русским соответствием.
- source_word: ἀρχιερεύς
  choice: первосвященник
  rationale: Это традиционный и общепонятный русский термин для иудейской первосвященнической должности.
- source_word: τοῦ ἐνιαυτοῦ ἐκείνου
  choice: в тот год
  rationale: Такой оборот естественно передаёт временное указание греческого родительного сочетания без неуклюжей буквальности.
- source_word: Ἅνναν
  choice: Анна
  rationale: Использована закрепившаяся в русской библейской традиции форма имени; после предлога — «к Анне».
- source_word: Καϊάφα
  choice: Каиафа
  rationale: Использована закрепившаяся русская библейская форма имени; в родительном падеже — «Каиафы».
theological_decisions:
- issue: К кому относится определение «который в тот год был первосвященником»
  choice: К Каиафе
  alternative: Отнесение к Анне вследствие неясной русской формулировки
  rationale: Греческое относительное местоимение ὃς естественно относится к ближайшему предшествующему имени Καϊάφα. Русский порядок слов сохраняет эту синтаксическую связь и не создаёт отсутствующей в исходном тексте двусмысленности.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный повествовательный стиль. Формулировка следует греческому синтаксису, но звучит естественно; богословских уточнений сверх исходного текста не внесено.
