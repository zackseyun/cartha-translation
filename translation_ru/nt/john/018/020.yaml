  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Ἐγὼ παρρησίᾳ ⸀λελάληκα τῷ κόσμῳ· ἐγὼ πάντοτε ἐδίδαξα ἐν συναγωγῇ καὶ ἐν τῷ ἱερῷ, ὅπου ⸀πάντες οἱ Ἰουδαῖοι συνέρχονται, καὶ ἐν κρυπτῷ ἐλάλησα οὐδέν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/020.yaml
  text: Jesus answered him[a], “I have spoken openly to the world. I always taught in the synagogue and in the temple, where all the Jews gather[b], and I said nothing in secret.”
translation:
  language: ru
  text: 'Иисус ответил ему: «Я открыто говорил миру. Я всегда учил в синагоге и в храме[a] — там, где собираются все иудеи[b], — и ничего не говорил тайно».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на храмовой территории», «во дворах храма». Греческое ἱερόν обозначает весь храмовый комплекс, а не только внутреннее святилище.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «весь иудейский народ»; в некоторых контекстах Евангелия от Иоанна — «жители Иудеи». Значение греческого Ἰουδαῖοι определяется контекстом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: открыто
  rationale: В данном контексте слово противопоставлено выражению ἐν κρυπτῷ («тайно»), поэтому передаёт прежде всего публичный, нескрываемый характер речи, а не смелость говорящего.
- source_word: λελάληκα
  choice: говорил
  rationale: Русский видо-временной строй не позволяет буквально воспроизвести греческий перфект без неестественной конструкции; прошедшее время сохраняет связь с предшествующим публичным служением Иисуса.
- source_word: τῷ κόσμῳ
  choice: всему миру
  rationale: Сохраняется характерное для Иоанна слово «мир» и широта выражения; дательный оборот естественен по-русски.
- source_word: πάντοτε
  choice: всегда
  rationale: Прямо и естественно передаёт постоянный характер публичного учения.
- source_word: ἐδίδαξα
  choice: учил
  rationale: Обычное русское соответствие глаголу διδάσκω; несовершенный вид естественно описывает неоднократную деятельность.
- source_word: ἐν συναγωγῇ
  choice: в синагоге
  rationale: Сохранено единственное число греческого текста, которое может иметь обобщающее значение и обозначать обычное место публичного наставления.
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: Краткое традиционное соответствие; поскольку ἱερόν обозначает весь храмовый комплекс, это уточнено в сноске.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: все иудеи
  rationale: В контексте синагоги и храма выражение шире круга властей и относится к иудейскому народу как религиозной общине; контекстная неоднозначность слова отмечена в сноске.
- source_word: συνέρχονται
  choice: собираются
  rationale: Естественно передаёт совместное публичное собрание.
- source_word: ἐν κρυπτῷ
  choice: тайно
  rationale: Ясно сохраняет смысловой контраст с «открыто».
- source_word: ἐλάλησα οὐδέν
  choice: ничего не говорил
  rationale: Идиоматичная русская конструкция, точно сохраняющая полное отрицание.
- source_word: ἀπεκρίθη αὐτῷ
  choice: ответил ему
  rationale: Стандартная и естественная передача повествовательной формулы.
theological_decisions:
- issue: Значение οἱ Ἰουδαῖοι в Евангелии от Иоанна
  choice: «иудеи» — здесь в широком смысле иудейского народа, собиравшегося для богослужения и наставления
  alternative: «жители Иудеи»; в иных контекстах — «иудейские власти»
  rationale: Упоминание синагоги и храма указывает здесь на широкую общинную среду, а не требует ограничения значения религиозными руководителями. Сноска сохраняет контекстную многозначность и не вносит в текст недопустимого антииудейского оттенка.
- issue: Утверждение Иисуса, что Он ничего не говорил тайно
  choice: Сохранено категорическое выражение без поясняющего ограничения
  alternative: Истолковать как отсутствие тайного учения, противопоставленного публичному, с учётом частных бесед Иисуса
  rationale: Перевод не должен сглаживать напряжение между буквальной формулировкой этого стиха и упоминаниями частных бесед в Евангелии; толкование не вносится в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Синтаксис краток и ясен; повтор «Я» сохранён как часть выразительного противопоставления публичного служения Иисуса обвинению в тайном учении. Все сноски поставлены непосредственно после соответствующих слов.
