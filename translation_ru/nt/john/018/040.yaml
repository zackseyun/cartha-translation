  text: ἐκραύγασαν οὖν ⸀πάλιν λέγοντες· Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν. ἦν δὲ ὁ Βαραββᾶς λῃστής.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/040.yaml
  text: So they shouted again[a], saying, “Not this man, but Barabbas!” Now Barabbas was a robber.
translation:
  language: ru
  text: 'И тогда они снова закричали: «Не этого, а Варавву!» Варавва же был разбойником.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может также означать «бандит»; в некоторых контекстах — вооружённого повстанца.
    reason: 'Лексическая альтернатива: сохранение диапазона значений λῃστής без навязывания политической интерпретации основному тексту.'
lexical_decisions:
- source_word: ἐκραύγασαν
  choice: закричали
  rationale: Глагол обозначает громкий крик; «закричали» естественно передаёт его силу в современном русском языке.
- source_word: οὖν
  choice: И тогда
  rationale: Частица связывает ответ толпы с предшествующим предложением Пилата; «и тогда» естественно передаёт продолжение повествования без чрезмерно логического оттенка.
- source_word: πάλιν
  choice: снова
  rationale: Прямо передаёт повторность действия.
- source_word: λέγοντες
  choice: двоеточие перед прямой речью
  rationale: Русская конструкция с глаголом речи «закричали» и двоеточием естественно передаёт греческое причастие «говоря», избегая тяжеловесного повтора.
- source_word: Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν
  choice: Не Его, а Варавву
  rationale: Сохраняет резкое противопоставление; русское местоимение в данном контексте естественно передаёт указательное τοῦτον, а винительный падеж восполняет подразумеваемый глагол выбора или освобождения.
- source_word: Βαραββᾶν / Βαραββᾶς
  choice: Варавву / Варавва
  rationale: Использована укоренившаяся русская форма имени с надлежащим падежным изменением.
- source_word: ἦν δὲ
  choice: же был
  rationale: Частица «же» вводит поясняющее замечание о Варавве и сохраняет связь с предшествующей фразой.
- source_word: λῃστής
  choice: разбойником
  rationale: «Разбойник» — прямой и понятный эквивалент, способный обозначать участника вооружённого грабежа; более специальный смысл политического повстанца самим стихом однозначно не установлен.
theological_decisions:
- issue: Смысл λῃστής в характеристике Вараввы
  choice: разбойником
  alternative: бандитом; участником вооружённого мятежа
  rationale: Основное значение слова связано с разбоем и бандитизмом. В отдельных исторических контекстах оно может относиться к вооружённому повстанцу, однако данный стих сам по себе не требует политически конкретизированного перевода. Возможная широта значения сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, напряжённая прямая речь сохранена. Причастие λέγοντες передано нормативной русской пунктуацией, а не буквальным «говоря». Заглавная буква в «Его» помогает ясно соотнести местоимение с Иисусом в принятой русской библейской орфографии, не добавляя нового содержания.
