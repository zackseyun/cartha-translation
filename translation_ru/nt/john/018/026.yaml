  text: λέγει εἷς ἐκ τῶν δούλων τοῦ ἀρχιερέως, συγγενὴς ὢν οὗ ἀπέκοψεν Πέτρος τὸ ὠτίον· Οὐκ ἐγώ σε εἶδον ἐν τῷ κήπῳ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/026.yaml
  text: One of the high priest’s servants[a], being a relative of the man whose ear Peter had cut off, said, “Didn’t I see you in the garden with him?”
translation:
  language: ru
  text: 'Один из рабов первосвященника[a], родственник человека, которому Пётр отсёк ухо, сказал: «Не я ли видел тебя с Ним в саду?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуг». Греческое слово δοῦλος в зависимости от контекста может означать раба или слугу; здесь «рабов» передаёт зависимый статус домашних людей первосвященника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλων
  choice: рабов
  rationale: В данном контексте речь идёт о зависимых членах дома первосвященника; «рабов» сохраняет выраженный словом δοῦλος несвободный статус, не смягчая его до общего «слуг».
- source_word: ἀρχιερέως
  choice: первосвященника
  rationale: Обычное и точное обозначение высшей священнической должности в контексте Страстей.
- source_word: συγγενὴς ὢν
  choice: родственник
  rationale: Естественная русская аппозиция передаёт обстоятельственный причастный оборот и ясно указывает на родственную связь говорящего с пострадавшим.
- source_word: οὗ
  choice: того человека, которому
  rationale: 'Референт относительного местоимения естественно прояснён по-русски: ухо принадлежало человеку, родственником которого был говорящий.'
- source_word: ἀπέκοψεν
  choice: отсёк
  rationale: Глагол точно передаёт полное отделение уха; предшествование событию и так ясно из повествовательного контекста.
- source_word: ὠτίον
  choice: ухо
  rationale: Естественный русский эквивалент; возможный уменьшительный оттенок формы здесь несущественен.
- source_word: Οὐκ ἐγώ σε εἶδον
  choice: Разве не я видел тебя
  rationale: Конструкция с οὐκ ожидает утвердительного ответа, а явное ἐγώ получает в русском надлежащее эмфатическое выражение «не я».
- source_word: ἐν τῷ κήπῳ
  choice: в саду
  rationale: Прямой и контекстуально уместный эквивалент κῆπος.
- source_word: μετ’ αὐτοῦ
  choice: с Ним
  rationale: Местоимение относится к Иисусу; прописная буква соответствует принятой русской библейской орфографической традиции и не меняет смысла.
theological_decisions:
- issue: Передача δοῦλος в буквальном бытовом контексте
  choice: рабы
  alternative: слуги
  rationale: «Рабы» сохраняет социально-правовую несвободу, подразумеваемую словом δοῦλος применительно к домашнему персоналу первосвященника; «слуги» могло бы неоправданно смягчить значение.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Формулировка вопроса сохраняет ожидаемый утвердительный ответ и особое ударение на личности очевидца.
