  text: Ὁ οὖν ἀρχιερεὺς ἠρώτησεν τὸν Ἰησοῦν περὶ τῶν μαθητῶν αὐτοῦ καὶ περὶ τῆς διδαχῆς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/019.yaml
  text: So the high priest questioned Jesus about his disciples and about his teaching[a].
translation:
  language: ru
  text: Тогда первосвященник спросил Иисуса о его учениках и о его учении.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «задал Иисусу вопросы» или «расспросил Иисуса». Греческий глагол может обозначать как простой вопрос, так и официальное расспрашивание; основной вариант сохраняет нейтральное значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Тогда
  rationale: Передаёт продолжение повествования и связь с предшествующими событиями естественным для современного русского языка способом.
- source_word: ἀρχιερεὺς
  choice: первосвященник
  rationale: Общепринятое и точное обозначение иудейской первосвященнической должности; имя исторического лица в текст не добавляется.
- source_word: ἠρώτησεν
  choice: расспросил
  rationale: В данном контексте обозначает целенаправленные вопросы в обстановке официального разбирательства, но не усиливает значение до «допрашивал».
- source_word: περὶ
  choice: о
  rationale: Естественно обозначает предмет расспросов в обоих случаях употребления.
- source_word: μαθητῶν
  choice: учениках
  rationale: Сохраняет характерную для Евангелий связь учителя и учеников точнее, чем более общее «последователях».
- source_word: διδαχῆς
  choice: учении
  rationale: Точно и естественно передаёт содержание того, чему учил Иисус, без более узкого оттенка слова «доктрина».
- source_word: αὐτοῦ
  choice: Его
  rationale: В обоих случаях местоимение относится к Иисусу; прописная буква соответствует принятому достоинственному русскому библейскому регистру.
theological_decisions:
- issue: Титул ἀρχιερεύς в повествовательном контексте, где речь идёт об Анне, а официально признанным Римом первосвященником был Каиафа
  choice: Передать непосредственно как «первосвященник»
  alternative: «Анна, первосвященник» или «старший священник»
  rationale: Перевод следует формулировке греческого текста и не гармонизирует историческую подробность посредством добавления имени или замены титула.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Повтор «о Его… и о Его…» сохраняет параллельную структуру греческого текста. Форма «расспросил» передаёт контекст слушания без чрезмерно жёсткого юридического оттенка.
