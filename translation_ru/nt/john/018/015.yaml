  yaml_path: translation/nt/john/018/015.yaml
  text: Simon Peter was following Jesus[a], and so was another disciple. That disciple was known to the high priest, and he went in with Jesus into the courtyard of the high priest,
translation:
  language: ru
  text: За Иисусом шли Симон Пётр и другой ученик.[a] Этот ученик был знаком первосвященнику и вошёл вместе с Иисусом во двор первосвященника.
  philosophy: optimal-equivalence
  footnotes:
