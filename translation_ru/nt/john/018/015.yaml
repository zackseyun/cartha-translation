    text: 'Или, более буквально: «За Иисусом шёл Симон Пётр, а также другой ученик». В греческом тексте действие второго ученика подразумевается.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκολούθει
  choice: шли
  rationale: Имперфект передаёт продолжавшееся действие; в сочетании с двумя однородными субъектами естественное русское «шли» сохраняет этот повествовательный фон.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Здесь частица служит мягкой связкой в развитии повествования; русская фраза естественно продолжает контекст без добавления «теперь» или искусственного противопоставления.
- source_word: καὶ ἄλλος μαθητής
  choice: и ещё один ученик
  rationale: Оборот присоединяет второго ученика как участника того же действия. Русская конструкция делает общее сказуемое явным, не меняя смысла.
- source_word: μαθητής
  choice: ученик
  rationale: Обычное и контекстуально точное обозначение ученика и последователя Иисуса в Евангелии от Иоанна.
- source_word: ἐκεῖνος
  choice: этот
  rationale: Указательное местоимение отсылает к только что упомянутому другому ученику; «этот ученик» естественно по-русски.
- source_word: γνωστός
  choice: был знаком первосвященнику
  rationale: 'Сохраняет прямой смысл: первосвященник знал ученика. Формулировка не усиливает степень знакомства, как это сделало бы «был хорошо знаком».'
- source_word: ἀρχιερεῖ / ἀρχιερέως
  choice: первосвященнику / первосвященника
  rationale: Стандартный русский эквивалент ἀρχιερεύς; единственное число сохранено в обоих случаях.
- source_word: συνεισῆλθεν
  choice: вошёл вместе с
  rationale: Передаёт и вхождение, и совместность действия, выраженную приставкой συν-.
- source_word: αὐλήν
  choice: двор
  rationale: В данном контексте обозначает внутренний двор резиденции первосвященника; «двор» ясно и не добавляет отсутствующего в тексте слова «дворец».
