base_translation:
  language: en
  yaml_path: translation/nt/john/018/006.yaml
  text: So when he said to them[a], “I am he,” they went backward and fell to the ground.
translation:
  language: ru
  text: 'Итак, когда Он сказал им: «Это Я»[a], они отступили назад и упали на землю.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я есмь» (или «Я есть»). Это греческое выражение может также перекликаться с характерными для Евангелия от Иоанна изречениями «Я есмь».'
    reason: Сохраняет буквальную форму и возможный богословский отзвук Ἐγώ εἰμι, тогда как основной текст передаёт контекстуальную самоидентификацию.
lexical_decisions:
- source_word: ὡς οὖν
  choice: И когда
  rationale: Передаёт временную связь ὡς и продолжение повествования, выраженное οὖν, естественным современным русским оборотом.
- source_word: εἶπεν αὐτοῖς
  choice: Он сказал им
  rationale: Прямое и формально близкое соответствие греческой конструкции с косвенным дополнением.
- source_word: Ἐγώ εἰμι
  choice: Это Я
  rationale: В непосредственном контексте это ответ-самоидентификация на вопрос о том, кого ищут; выражение естественно по-русски. Буквальная форма, значимая для возможного иоанновского отзвука, сохранена в сноске.
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: они отступили назад
  rationale: Передаёт реальное движение назад; «отступили» естественно описывает внезапную реакцию, а «назад» сохраняет явное εἰς τὰ ὀπίσω.
- source_word: ἔπεσαν χαμαί
  choice: упали на землю
  rationale: Точно и естественно передаёт физическое падение, выраженное χαμαί.
theological_decisions:
- issue: Передача Ἐγώ εἰμι в иоанновском контексте с возможным богословским отзвуком
  choice: Это Я
  alternative: Я есмь / Я есть
  rationale: Ближайший контекст указывает на обычную самоидентификацию, поэтому основной текст должен быть понятен современному читателю. Вместе с тем буквальное «Я есмь» может перекликаться с характерными для Евангелия от Иоанна изречениями, и эта неоднозначность сохранена в сноске без навязывания одного толкования.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Заглавная буква в местоимении «Он» отражает устойчивую русскую библейскую издательскую практику; речь обозначена русскими кавычками. Маркер [a] помещён непосредственно после сказуемого с адресатом, как в консультационном тексте.
