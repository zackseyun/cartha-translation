  text: After saying these things[a], Jesus went out with his disciples across the Kidron Valley, where there was a garden, into which he and his disciples entered.
translation:
  language: ru
  text: Сказав это, Иисус вместе со Своими учениками вышел на другую сторону Кедронского потока[a], где был сад. В него вошли Он и Его ученики.
