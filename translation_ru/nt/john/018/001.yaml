    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: Сказав это
  rationale: Аористное причастие естественно передаётся предшествующим деепричастным оборотом; «это» ясно отсылает к предыдущим словам Иисуса.
- source_word: ἐξῆλθεν
  choice: пошёл
  rationale: В контексте движения из прежнего места и затем через поток естественное русское «пошёл» передаёт действие без излишне буквального и стилистически неловкого «вышел… на другую сторону».
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: вместе со Своими учениками
  rationale: Передаёт сопровождение, выраженное σύν с дательным падежом; «вместе» сохраняет явный совместный характер движения.
- source_word: πέραν τοῦ χειμάρρου τοῦ Κεδρών
  choice: на другую сторону Кедронского потока
  rationale: πέραν обозначает переход на дальнюю сторону, а χείμαρρος — сезонный водоток или русло; «поток» сохраняет водный образ, не превращая его безоговорочно в долину.
- source_word: ὅπου ἦν κῆπος
  choice: Там был сад
  rationale: Естественная современная русская конструкция точно передаёт наличие сада в указанном месте.
- source_word: εἰς ὃν εἰσῆλθεν
  choice: в который вошли
  rationale: Сохраняет направительное значение εἰς и связь относительного местоимения с садом.
- source_word: αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ
  choice: Он и Его ученики
  rationale: Явно воспроизводит названных в греческом подлежащих, не добавляя усилительного «Сам».
