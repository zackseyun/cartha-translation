  text: ὁ οὖν Ἰούδας λαβὼν τὴν σπεῖραν καὶ ἐκ τῶν ἀρχιερέων καὶ ⸂ἐκ τῶν⸃ Φαρισαίων ὑπηρέτας ἔρχεται ἐκεῖ μετὰ φανῶν καὶ λαμπάδων καὶ ὅπλων.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/003.yaml
  text: So Judas[a], having taken the cohort and officers from the chief priests and from the Pharisees[b], comes there with lanterns and torches and weapons.
translation:
  language: ru
  text: Итак, Иуда, взяв отряд[a] и служителей[b] от первосвященников и фарисеев, приходит туда с фонарями, факелами и оружием.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когорту», «воинский отряд». Греческое слово может обозначать воинское подразделение, не обязательно подразумевая, что оно присутствовало в полном составе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «стражников», «храмовую стражу». Речь идёт об официальных служителях при первосвященниках и фарисеях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Итак
  rationale: Передаёт связь с предыдущим повествованием и вызванное им развитие событий, не делая причинный вывод чрезмерно явным.
- source_word: λαβὼν
  choice: взяв с собой
  rationale: Сохраняет предшествующее главному глаголу действие причастия и естественно выражает сопровождение людьми.
- source_word: σπεῖραν
  choice: отряд
  rationale: Обозначает воинское подразделение, но не создаёт ложного впечатления, будто присутствовала полная когорта установленной численности.
- source_word: ὑπηρέτας
  choice: служителей
  rationale: Широкое обозначение официальных служащих при иудейских властях; не уточняет их функцию как храмовой стражи сверх сказанного в тексте.
- source_word: ἀρχιερέων
  choice: первосвященников
  rationale: Устоявшееся русское обозначение ведущих представителей священнической власти во множественном числе.
- source_word: Φαρισαίων
  choice: фарисеев
  rationale: Устоявшаяся передача названия религиозной группы.
- source_word: ἔρχεται
  choice: приходит
  rationale: Сохраняет историческое настоящее и живость повествовательной манеры Иоанна.
- source_word: ἐκεῖ
  choice: туда
  rationale: Естественно указывает на уже названное в контексте место как цель движения.
- source_word: φανῶν
  choice: фонарями
  rationale: Передаёт переносные закрытые или защищённые источники света и сохраняет отличие от λαμπάδων.
- source_word: λαμπάδων
  choice: факелами
  rationale: Естественная передача открытых переносных источников огня, отличных от фонарей.
- source_word: ὅπλων
  choice: оружием
  rationale: Ясно передаёт общее обозначение средств вооружённой силы.
theological_decisions:
- issue: Состав и численность пришедших арестовывать Иисуса
  choice: «отряд и служители первосвященников и фарисеев»
  alternative: «когорта и стражники первосвященников и фарисеев»
  rationale: Формулировка сохраняет две составляющие группы — военное подразделение и служащих иудейских властей, — но не утверждает, что явилась вся римская когорта, и не сужает роль ὑπηρέται исключительно до храмовой полиции.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Историческое настоящее сохранено; синтаксис сделан естественным для русского языка без устранения неоднозначности терминов σπεῖρα и ὑπηρέται.
