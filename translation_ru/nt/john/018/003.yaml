  terminology: «Отряд» — допустимая нейтральная передача σπεῖρα; сноска корректно указывает варианты «когорта» и «воинский отряд» и не утверждает присутствие полной когорты. «Служители» сохраняет широту ὑπηρέται; вариант «храмовая стража» оставлен в сноске как возможность, а не внесён в основной текст. «Первосвященники», «фарисеи», «фонари», «факелы» и «оружие» уместны.
