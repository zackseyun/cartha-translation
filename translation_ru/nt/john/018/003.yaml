  source_fidelity: 'Основной смысл передан точно: Иуда появляется с воинским отрядом и служителями, связанными с первосвященниками и фарисеями; сохранены историческое настоящее, два разных вида источников света и общее обозначение оружия. Однако в исходной формулировке связь «служителей» с предлогом ἐκ («от первосвященников и фарисеев») выражена менее ясно, а сноска b поставлена после «фарисеев», хотя относится прежде всего к «служителям».'
