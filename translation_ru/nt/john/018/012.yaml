  text: So the cohort[a], the commander, and the officers of the Jews seized Jesus and bound him.
translation:
  language: ru
  text: Тогда отряд, командир отряда и служители иудейских властей[a] схватили Иисуса и связали его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв. «иудеев». Или: «иудейских начальников»; возможно также: «жителей Иудеи». В Евангелии от Иоанна слово «иудеи» нередко обозначает более узкую группу, а не весь еврейский народ.'
    reason: Основной текст передаёт контекстуальную функцию выражения τῶν Ἰουδαίων при ὑπηρέται, а примечание сохраняет буквальное чтение и возможную неоднозначность его референта.
lexical_decisions:
- source_word: οὖν
  choice: Тогда
  rationale: Передаёт повествовательный переход и связь с предшествующей сценой естественным для современного русского языка способом.
- source_word: σπεῖρα
  choice: отряд
  rationale: Военный термин может обозначать когорту или её подразделение; «отряд» ясно передаёт военный характер группы, не утверждая её полную штатную численность.
- source_word: χιλίαρχος
  choice: командир
  rationale: Обозначает старшего военного начальника; «командир» понятно современному читателю, тогда как «хилиарх» малоупотребительно, а «тысяченачальник» может быть воспринято как буквальное указание на число подчинённых.
- source_word: ὑπηρέται
  choice: служители
  rationale: В данном контексте это должностные служители, участвующие в задержании, а не домашние слуги. Выбор сохраняет институциональный смысл, не конкретизируя их как храмовую стражу сверх текста.
- source_word: τῶν Ἰουδαίων
  choice: иудеев
  rationale: Формально передаёт греческий родительный оборот. Возможное более узкое указание на иудейские власти сохраняется в примечании, а не вносится в основной текст.
- source_word: συνέλαβον
  choice: схватили
  rationale: Передаёт физическое задержание и силу действия, не ограничивая смысл формально-юридической процедурой ареста.
- source_word: ἔδησαν
  choice: связали
  rationale: Прямой и естественный перевод глагола со значением связывания человека.
theological_decisions:
- issue: Объём значения τῶν Ἰουδαίων в Евангелии от Иоанна
  choice: 'В основном тексте: «иудеев».'
  alternative: «иудейских начальников» или «жителей Иудеи».
  rationale: Греческое выражение сохранено без молчаливого сужения. Примечание предупреждает, что в контексте Иоанна оно нередко обозначает определённую группу, особенно представителей властей, а не весь еврейский народ.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным стилем. «Отряд» предпочтён более технической «когорте», а «командир» — архаичным или узкоспециальным обозначениям. Местоимение «Его» оформлено с традиционной прописной буквы в отношении Иисуса.
