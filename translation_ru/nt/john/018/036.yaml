id: JHN.18.36
reference: John 18:36
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐκ τοῦ κόσμου τούτου· εἰ ἐκ τοῦ κόσμου τούτου ἦν ἡ βασιλεία ἡ ἐμή, οἱ ὑπηρέται ⸂οἱ ἐμοὶ ἠγωνίζοντο ἄν⸃, ἵνα μὴ παραδοθῶ τοῖς Ἰουδαίοις· νῦν δὲ ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/036.yaml
  text: Jesus answered[a], “My kingdom is not from this world. If my kingdom were from this world, my servants would be fighting so that I might not be handed over to the Jews. But as it is, my kingdom is not from here.”
translation:
  language: ru
  text: 'Иисус ответил: «Моё царство не от этого мира. Если бы Моё царство было от этого мира, Мои слуги сражались бы, чтобы Меня не выдали иудеям[a]. Но в действительности Моё царство не отсюда».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жителям Иудеи»; возможно, здесь имеются в виду прежде всего иудейские власти.'
    reason: Слово Ἰουδαῖοι может обозначать иудеев вообще, жителей Иудеи или, в данном контексте, иудейских руководителей.
lexical_decisions:
- source_word: βασιλεία
  choice: царство
  rationale: «Царство» — естественный и традиционно понятный русский эквивалент, который в данном контексте может обозначать как царскую власть, так и подвластную ей область.
- source_word: ἐκ τοῦ κόσμου τούτου
  choice: не от этого мира
  rationale: Предлог ἐκ указывает прежде всего на источник или происхождение; «не от этого мира» сохраняет эту мысль точнее, чем «не принадлежит этому миру».
- source_word: κόσμος
  choice: мир
  rationale: 'Прямой и ясный эквивалент, сохраняющий характерную для Иоанна многозначность: человечество, сотворенный мир и нынешний порядок, противящийся Богу.'
- source_word: ὑπηρέται
  choice: слуги
  rationale: Слово обозначает состоящих у кого-либо на службе. «Слуги» естественно сочетается с образом царства и не приписывает им неоправданно узкую официальную функцию.
- source_word: ἠγωνίζοντο ἄν
  choice: сражались бы
  rationale: Форма передает нереальное условие и предполагаемое продолжающееся сопротивление; по-русски «сражались бы» выражает это естественно и без излишней детализации.
- source_word: ἵνα μὴ παραδοθῶ
  choice: чтобы Меня не выдали
  rationale: Сохраняется значение цели и судебно-политический оттенок παραδίδωμι; «выдали» звучит современно и уместно в сцене передачи Иисуса властям.
- source_word: τοῖς Ἰουδαίοις
  choice: иудеям
  rationale: Основной текст сохраняет широкое лексическое значение греческого обозначения, а примечание указывает на возможный более узкий контекстуальный смысл.
- source_word: νῦν δὲ
  choice: но в действительности
  rationale: Здесь выражение противопоставляет реальное положение дел только что описанному нереальному условию, а не просто обозначает момент времени.
- source_word: ἐντεῦθεν
  choice: не отсюда
  rationale: Краткий указательный оборот сохраняет отличие заключительной формулировки от более развернутого «не от этого мира».
theological_decisions:
- issue: Отношение царства Иисуса к миру
  choice: «не от этого мира» — указание на источник и природу царства
  alternative: «не принадлежит этому миру» или «не является частью этого мира»
  rationale: Греческий текст отрицает происхождение царства из нынешнего мирового порядка, но сам по себе не отрицает его присутствия или действия в мире.
- issue: Кого обозначает τοῖς Ἰουδαίοις
  choice: В основном тексте — «иудеям», с примечанием о возможном более узком значении
  alternative: «жителям Иудеи» или «иудейским властям»
  rationale: Термин допускает более широкое этнорелигиозное и более узкое региональное либо властное прочтение. Контекст поддерживает узкий смысл, но не требует вносить его непосредственно в основной текст.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Повтор «Моё царство» сохранен вслед за греческим текстом. Местоимения, относящиеся к Иисусу в прямой речи, написаны с прописной буквы в соответствии с распространенной русской библейской издательской традицией.
