  text: πάλιν οὖν ⸂ἐπηρώτησεν αὐτούς⸃· Τίνα ζητεῖτε; οἱ δὲ εἶπαν· Ἰησοῦν τὸν Ναζωραῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/007.yaml
  text: So he asked them again[a], “Whom are you seeking?” And they said, “Jesus the Nazarene.”
translation:
  language: ru
  text: 'Тогда Он снова спросил их: «Кого вы ищете?» Они ответили: «Иисуса Назарянина[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисуса из Назарета»; греч. «Иисуса Назарянина».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν οὖν
  choice: Тогда… снова
  rationale: πάλιν обозначает повторение вопроса, а οὖν связывает его с предшествующим событием; «тогда» естественно передаёт ход повествования без чрезмерно сильного логического оттенка «поэтому».
- source_word: ἐπηρώτησεν αὐτούς
  choice: Он… спросил их
  rationale: Глагол обозначает прямой вопрос; «спросил» точно и естественно передаёт его в данном контексте. Местоимение «Он» указывает на Иисуса, названного в контексте.
- source_word: Τίνα ζητεῖτε
  choice: Кого вы ищете?
  rationale: Винительный вопросительного местоимения и настоящее время глагола естественно передаются современным русским вопросом «Кого вы ищете?».
- source_word: οἱ δὲ εἶπαν
  choice: Они ответили
  rationale: Хотя буквально возможно «они сказали», в диалогическом обмене русское «ответили» естественно выражает функцию реплики; δέ здесь служит переходом в повествовании.
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Иисуса Назорея
  rationale: «Назорей» сохраняет форму греческого обозначения Ναζωραῖος как прозвания или идентифицирующего наименования, не сводя его без пояснения к описательному «из Назарета».
theological_decisions:
- issue: Передача Ναζωραῖος как обозначения Иисуса
  choice: Назорей
  alternative: из Назарета
  rationale: Греческая форма является идентифицирующим обозначением и сама по себе не требует догматического толкования. «Назорей» формально сохраняет выражение оригинала, а распространённое географическое понимание указано в сноске; при этом его не следует смешивать с термином «назирей».
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно торжественный. Заглавная буква в «Он» соответствует принятому библейскому регистру; двоеточие и кавычки оформляют прямую речь по нормам русского языка.
