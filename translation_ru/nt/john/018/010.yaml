  text: Σίμων οὖν Πέτρος ἔχων μάχαιραν εἵλκυσεν αὐτὴν καὶ ἔπαισεν τὸν τοῦ ἀρχιερέως δοῦλον καὶ ἀπέκοψεν αὐτοῦ τὸ ⸀ὠτάριον τὸ δεξιόν. ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/010.yaml
  text: Then Simon Peter[a], having a sword, drew it and struck the high priest’s servant and cut off his right ear. Now the servant’s name was Malchus.
translation:
  language: ru
  text: Тогда Симон Пётр, у которого был меч, вынул его, ударил раба первосвященника и отсёк ему правое ухо. Раба звали Малх.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Тогда
  rationale: Передаёт переход к следующему действию в повествовании, не придавая связке излишне логического оттенка.
- source_word: ἔχων μάχαιραν
  choice: у которого был меч
  rationale: Естественно передаёт причастную конструкцию; «меч» сохраняет широкое значение μάχαιρα без неоправданного уточнения вида оружия.
- source_word: εἵλκυσεν αὐτὴν
  choice: выхватил его
  rationale: В данном контексте естественно обозначает извлечение оружия и стремительность действия; местоимение согласовано с русским словом «меч».
- source_word: ἔπαισεν
  choice: ударил
  rationale: Прямое, современное и стилистически достойное соответствие глаголу нанесения удара.
- source_word: τὸν τοῦ ἀρχιερέως δοῦλον
  choice: раба первосвященника
  rationale: «Раб» точнее сохраняет значение δοῦλος и выраженное в греческой конструкции отношение принадлежности; «слуга» возможно контекстуально, но может ослабить несвободный статус.
- source_word: ἀπέκοψεν
  choice: отсёк
  rationale: Точно и лаконично передаёт полное отделение ударом режущего оружия.
- source_word: ὠτάριον τὸ δεξιόν
  choice: правое ухо
  rationale: Уменьшительная форма здесь не требует русского уменьшительного; «мочка уха» было бы неоправданным уточнением.
- source_word: ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος
  choice: Раба звали Малх
  rationale: Идиоматическая русская передача дательной конструкции; δέ вводит дополнительную идентифицирующую информацию и не требует отдельного союза. Форма «Малх» соответствует принятой русской библейской передаче имени Μάλχος.
theological_decisions:
- issue: Передача δοῦλος
  choice: раб
  alternative: слуга
  rationale: Принадлежность первосвященнику выражена явно, поэтому «раб» сохраняет социальный статус и не смягчает исходное слово; при этом контекст не позволяет подробнее определить юридическую форму зависимости.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Сохранена последовательность действий и различие между «мечом» как широким обозначением оружия и отсутствующим в источнике уточнением его типа. Архаичные обороты устранены; имя дано в привычной русской библейской форме.
