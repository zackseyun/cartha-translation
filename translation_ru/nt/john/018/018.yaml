base_translation:
  language: en
  yaml_path: translation/nt/john/018/018.yaml
  text: The servants and the officers were standing there[a], having made a charcoal fire because it was cold, and they were warming themselves[b]. Peter also was standing with them and warming himself.
translation:
  language: ru
  text: Рабы[a] и служители[b] стояли у разведённого ими угольного костра, потому что было холодно, и грелись. Пётр тоже стоял с ними и грелся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуги». Греческое слово может обозначать как раба, так и слугу; здесь, вероятно, имеются в виду несвободные домашние работники.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «стражники». Речь идёт об официальных служителях, вероятно связанных с храмом или домом первосвященника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: рабы
  rationale: Слово обозначает несвободных домашних работников; «рабы» сохраняет вероятный социальный статус, тогда как «слуги» может его сгладить.
- source_word: ὑπηρέται
  choice: служители
  rationale: В Евангелии от Иоанна это официальные служители, связанные с первосвященническим окружением и способные выполнять силовые поручения; «служители» не сужает значение до одних стражников.
- source_word: ἀνθρακιὰν πεποιηκότες
  choice: у разведённого ими угольного костра
  rationale: Передаёт конкретную деталь об огне на древесном угле и завершённое действие причастия с сохраняющимся результатом; перестройка естественна для русского повествования.
- source_word: ὅτι ψῦχος ἦν
  choice: потому что было холодно
  rationale: Ясно сохраняет причинное значение ὅτι.
- source_word: ἐθερμαίνοντο
  choice: грелись
  rationale: Естественно передаёт продолженное возвратное действие имперфекта.
- source_word: ἦν δὲ καὶ ὁ Πέτρος μετ’ αὐτῶν ἑστὼς
  choice: Вместе с ними стоял и Пётр
  rationale: Сохраняет положение Петра среди этой группы, его позу и добавочный акцент καί без тяжеловесной кальки.
- source_word: θερμαινόμενος
  choice: тоже грелся
  rationale: Передаёт продолжающееся действие и подчёркивает, что Пётр делал то же самое, что и остальные.
- source_word: δέ
  choice: нулевая передача / связь порядком предложений
  rationale: Слабый повествовательный соединитель не требует отдельного русского «теперь» или усиленного противопоставления.
