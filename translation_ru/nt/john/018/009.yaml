  text: ἵνα πληρωθῇ ὁ λόγος ὃν εἶπεν ὅτι Οὓς δέδωκάς μοι οὐκ ἀπώλεσα ἐξ αὐτῶν οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/009.yaml
  text: 'so that the word that he had spoken might be fulfilled: “Of those whom you have given me[a], I lost not one.”'
translation:
  language: ru
  text: 'чтобы исполнилось сказанное Им слово: «Из тех, кого Ты дал Мне, Я не потерял ни одного[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никого из них»; «ни одного из них».'
    reason: Лексико-синтаксические варианты передачи партитивного выражения ἐξ αὐτῶν οὐδένα.
lexical_decisions:
- source_word: ἵνα πληρωθῇ
  choice: чтобы исполнилось
  rationale: Передаёт целевое-результативную конструкцию с ἵνα и пассивный аорист конъюнктива πληρωθῇ, сохраняя характерный для Иоанна язык исполнения.
- source_word: ὁ λόγος ὃν εἶπεν
  choice: слово, которое Он сказал
  rationale: λόγος здесь означает конкретное ранее произнесённое изречение Иисуса, а не титул «Слово»; конструкция остаётся ясной и близкой к греческой.
- source_word: ὅτι
  choice: ':'
  rationale: Двоеточие естественно вводит содержание ранее сказанного как прямую цитату.
- source_word: Οὓς δέδωκάς μοι
  choice: Из тех, кого Ты дал Мне
  rationale: Начальное «из тех» подготавливает партитивное ἐξ αὐτῶν; форма «дал» естественно передаёт совершённое действие с сохраняющимся результатом в данном контексте.
- source_word: οὐκ ἀπώλεσα
  choice: Я не потерял
  rationale: В контексте защиты доверенных Иисусу учеников ἀπόλλυμι означает утрату, а не активное уничтожение; «не потерял» также сохраняет связь с Ин. 17:12.
- source_word: ἐξ αὐτῶν οὐδένα
  choice: ни одного
  rationale: Кратко и выразительно передаёт усиленное отрицание «ни одного из их числа»; партитивный смысл уже выражен оборотом «Из тех».
theological_decisions:
- issue: Характер исполнения сказанного
  choice: «чтобы исполнилось слово»
  alternative: «чтобы сбылось сказанное»
  rationale: Формулировка сохраняет богословский вес языка исполнения, но не объявляет прежние слова Иисуса формальной пророческой формулой сверх того, что сказано в тексте.
- issue: Значение ἀπώλεσα применительно к ученикам
  choice: «Я не потерял»
  alternative: «Я не дал погибнуть»
  rationale: Выбор сохраняет многозначность и словесную связь с прежним высказыванием Иисуса, не сводя смысл к одной догматической трактовке.
- issue: Референт местоимений в цитате
  choice: Прописные «Ты», «Мне», «Я» для Отца и Иисуса
  alternative: Строчные «ты», «мне», «я»
  rationale: Прописные буквы соответствуют принятой русской библейской издательской традиции почтительного обозначения Бога; они не меняют синтаксис или референцию исходного текста.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным, но не архаичным синтаксисом. Сохранены повтор «слово… сказал» и структура прямой цитаты, отражающие лексику оригинала.
