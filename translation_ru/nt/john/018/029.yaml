  yaml_path: translation/nt/john/018/029.yaml
  text: So Pilate went outside to them and said, “What accusation do you bring against this man?”
translation:
  language: ru
  text: 'Тогда Пилат вышел к ним и спросил: «Какое обвинение вы предъявляете против этого человека?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν … ἔξω
  choice: вышел
  rationale: Глагол ἐξέρχομαι вместе с наречием ἔξω подчёркивает движение из внутреннего помещения наружу. Русское «вышел» естественно и без избыточного повтора передаёт оба элемента.
- source_word: οὖν
  choice: тогда
  rationale: В данном повествовательном контексте οὖν связывает действие с предшествующей сценой и продвигает рассказ. «Тогда» звучит естественно и сохраняет связующую функцию.
- source_word: πρὸς αὐτούς
  choice: к ним
  rationale: Предлог πρός с винительным падежом обозначает направленное движение к людям; «к ним» точно и естественно передаёт этот смысл.
- source_word: φησίν
  choice: спросил
  rationale: Историческое настоящее передано русским прошедшим временем в соответствии с нормами повествования. Поскольку далее следует прямой вопрос, «спросил» естественнее буквального «сказал» и не меняет коммуникативной функции.
- source_word: Τίνα κατηγορίαν … φέρετε
  choice: В чём вы обвиняете
  rationale: Оборот буквально означает «какое обвинение вы предъявляете». Идиоматическое русское «В чём вы обвиняете» ясно сохраняет судебный смысл и активное предъявление обвинения.
- source_word: κατὰ τοῦ ἀνθρώπου τούτου
  choice: этого человека
  rationale: κατά с родительным имеет значение «против», уже выраженное управлением глагола «обвиняете»; ὁ ἄνθρωπος οὗτος здесь обозначает конкретного человека мужского пола, а по-русски «этого человека» является естественной формулировкой.
