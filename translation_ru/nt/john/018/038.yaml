  text: λέγει αὐτῷ ὁ Πιλᾶτος· Τί ἐστιν ἀλήθεια; Καὶ τοῦτο εἰπὼν πάλιν ἐξῆλθεν πρὸς τοὺς Ἰουδαίους, καὶ λέγει αὐτοῖς· Ἐγὼ οὐδεμίαν ⸂εὑρίσκω ἐν αὐτῷ αἰτίαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/038.yaml
  text: Pilate said to him[a], “What is truth?” After saying this, he went out again to the Jews and said to them, “I find no case against him.”
translation:
  language: ru
  text: 'Пилат сказал Ему: «Что есть истина?» Сказав это, он снова вышел к иудеям[a] и сказал им: «Я не нахожу за Ним никакой вины».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к иудейским вождям». В Евангелии от Иоанна слово «иудеи» иногда обозначает более узко представителей иудейских властей или противостоящую Иисусу группу, о которой говорится в данном контексте.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Πιλᾶτος
  choice: Пилат сказал Ему
  rationale: Историческое настоящее λέγει естественно передано русским прошедшим временем; местоимение сохранено как дополнение.
- source_word: Τί ἐστιν ἀλήθεια;
  choice: Что есть истина?
  rationale: Передаёт краткость и общий, не конкретизированный артиклем характер вопроса; формула естественна в русском литературном и философском контексте.
- source_word: Καὶ τοῦτο εἰπὼν
  choice: Сказав это
  rationale: Деепричастный оборот кратко и естественно передаёт предшествующее действие аористного причастия εἰπών.
- source_word: πάλιν ἐξῆλθεν
  choice: снова вышел
  rationale: Прямо передаёт повторность πάλιν и движение наружу, выраженное ἐξῆλθεν.
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: к иудеям
  rationale: Основной текст сохраняет прямое лексическое значение Ἰουδαίους; контекстуально более узкое понимание отмечено в сноске.
- source_word: καὶ λέγει αὐτοῖς
  choice: и сказал им
  rationale: Историческое настоящее передано прошедшим временем для цельного русского повествования.
- source_word: Ἐγὼ οὐδεμίαν εὑρίσκω ἐν αὐτῷ αἰτίαν
  choice: Я не нахожу за Ним никакой вины
  rationale: В судебном контексте αἰτία означает вину, основание для обвинения или обвинение; русское выражение «не нахожу за ним никакой вины» естественно и сохраняет юридический смысл.
theological_decisions:
- issue: Значение Ἰουδαίοις в повествовании о суде над Иисусом
  choice: В основном тексте — «иудеям», со сноской о возможном более узком значении
  alternative: иудейским вождям; представителям иудейских властей
  rationale: Лексическая форма сохранена без молчаливого сужения значения, однако контекст допускает, что речь идёт не обо всём народе, а о противостоящих Иисусу представителях властей или присутствующей группе обвинителей.
- issue: Юридический смысл αἰτία
  choice: никакой вины
  alternative: никаких оснований для обвинения; никакого обвинения
  rationale: Выбранная формулировка естественна по-русски и сохраняет судебный характер заявления Пилата, не превращая его лишь в общую нравственную оценку.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис краткий и ясный; традиционно узнаваемое «Что есть истина?» сохранено как точное и естественное выражение. Прописные буквы в местоимениях, относящихся к Иисусу, употреблены согласно распространённой русской библейской издательской норме.
