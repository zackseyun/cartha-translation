base_translation:
  language: en
  yaml_path: translation/nt/john/018/034.yaml
  text: Jesus answered[a], “Are you saying this on your own, or did others tell you about me?”
translation:
  language: ru
  text: 'Иисус ответил: «Ты говоришь это от себя[a] или другие сказали тебе обо Мне?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от себя»; Иисус спрашивает, исходят ли эти слова от самого Пилата.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ответил
  rationale: Обычный повествовательный глагол ответа; естественно передаёт реплику Иисуса в данном диалоге.
- source_word: Ἀπὸ σεαυτοῦ
  choice: ты сам
  rationale: Естественное современное русское выражение, указывающее, что слова исходят лично от Пилата; буквальный образ источника пояснён в сноске.
- source_word: σὺ
  choice: ты
  rationale: Отдельно выраженное местоимение в греческом несёт смысловое ударение; в русском сочетание «ты сам» сохраняет этот акцент.
- source_word: τοῦτο λέγεις
  choice: это говоришь
  rationale: Сохраняет настоящее время и отсылку к предыдущему вопросу Пилата без лишнего истолкования.
- source_word: ἢ ἄλλοι εἶπόν σοι
  choice: или другие сказали тебе
  rationale: Аорист передан естественным русским прошедшим временем; «другие» сохраняет неопределённость греческого текста.
- source_word: περὶ ἐμοῦ
  choice: обо Мне
  rationale: Кратко и естественно передаёт значение περί с родительным падежом — «о, относительно».
theological_decisions:
- issue: Смысл вопроса Иисуса Пилату
  choice: 'Вопрос передан как выяснение источника слов Пилата: говорит ли он это сам или услышал от других.'
  alternative: «Ты спрашиваешь это от себя?» — более истолковывающая передача, смещающая внимание со сказанного на сам акт вопроса.
  rationale: Греческий текст говорит о происхождении высказывания Пилата и не раскрывает прямо его мотивов; перевод сохраняет эту сдержанность и напряжение.
translation_notes:
  register: Современный литературный русский язык; реплика краткая, естественная и достойная по тону. Заглавная буква в «Мне» соответствует принятому благоговейному оформлению местоимений, относящихся к Иисусу.
