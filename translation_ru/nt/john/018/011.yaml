  text: εἶπεν οὖν ὁ Ἰησοῦς τῷ Πέτρῳ· Βάλε τὴν ⸀μάχαιραν εἰς τὴν θήκην· τὸ ποτήριον ὃ δέδωκέν μοι ὁ πατὴρ οὐ μὴ πίω αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/011.yaml
  text: So Jesus said to Peter[a], “Put the sword into its sheath[b]. Shall I not drink the cup that the Father has given me?”
translation:
  language: ru
  text: 'Тогда Иисус сказал Петру: «Вложи меч в ножны[a]. Неужели Мне не выпить чашу[b], которую дал Мне Отец?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть в футляр для клинка.
    reason: lexical_clarification
  - marker: b
    text: '«Чаша» — библейский образ страдания или участи, назначенной Богом; ср. молитву Иисуса в Гефсимании: Мф. 26:39; Мк. 14:36; Лк. 22:42.'
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: Тогда
  rationale: Передаёт повествовательный переход и связь с предшествующим событием естественным для современного русского языка способом.
- source_word: Βάλε
  choice: Вложи
  rationale: В данном контексте повелительная форма означает поместить оружие обратно; «вложи» естественно сочетается с «меч в ножны» и сохраняет конкретный образ.
- source_word: μάχαιραν
  choice: меч
  rationale: Обычное и достаточно широкое обозначение клинкового оружия в сцене ареста; более узкое «кинжал» было бы неоправданным уточнением.
- source_word: θήκην
  choice: ножны
  rationale: Точное и общеупотребительное русское название футляра для клинкового оружия.
- source_word: ποτήριον
  choice: чашу
  rationale: Сохраняет библейскую метафору назначенной Богом участи и страдания, не сводя её к одному догматическому толкованию.
- source_word: δέδωκέν
  choice: дал
  rationale: Русское прошедшее совершенного вида естественно передаёт завершённое действие с сохраняющимся результатом; буквальная передача греческого перфекта была бы тяжеловесной.
- source_word: ὁ πατήρ
  choice: Отец
  rationale: Сохраняет определённое наименование без добавления отсутствующего в греческом тексте притяжательного местоимения «Мой».
- source_word: οὐ μὴ πίω αὐτό;
  choice: Неужели Мне не выпить
  rationale: Риторический вопрос предполагает утвердительный ответ и выражает готовность Иисуса принять данную Отцом чашу; конструкция звучит естественно и сохраняет вопросительную форму.
theological_decisions:
- issue: Значение образа чаши
  choice: Сохранить метафору «чаша» в основном тексте и пояснить её широкое библейское значение в сноске.
  alternative: Передать как «предстоящее страдание», «назначенную участь» или «чашу Божьего гнева».
  rationale: Контекст указывает на страдание и предназначенный Иисусу путь, однако сам стих не сужает значение до одного конкретного богословского определения.
- issue: Отношение Иисуса к Отцу
  choice: Передать слова как добровольное принятие Иисусом того, что дал Отец, без дополнительного вероучительного пояснения.
  alternative: Добавить «Мой Отец» или перефразировать как прямое указание на порученную миссию.
  rationale: Простой перевод сохраняет выраженные в стихе сыновнее послушание и достоинство Иисуса, ничего не добавляя к формулировке оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Вложи меч в ножны» сохраняет конкретность сцены, а «Неужели Мне не выпить чашу» — естественную риторическую силу и неразрешённую метафору оригинала.
