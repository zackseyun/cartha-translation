review_pass:
  verdict: revise
  source_fidelity: В целом условная судебная аргументация и широкий смысл δέρεις переданы верно. Однако «что именно было не так» добавляет к μαρτύρησον περὶ τοῦ κακοῦ требование точного указания конкретного пункта («именно»), которого в греческом нет. Лучше сохранить призыв свидетельствовать относительно предполагаемого дурного/неправильного высказывания без этого усиления.
  naturalness: Текст звучит современно и литературно. «Засвидетельствуй об этом» естественнее, чем несколько тяжеловесное «засвидетельствуй, что именно было не так», и сохраняет судебный оттенок.
  terminology: «Засвидетельствуй» удачно передаёт μαρτύρησον. «Бьёшь» остаётся широким и не предрешает, был ли это единичный удар или более тяжёлое избиение. Местоимение «Меня» уместно писать с прописной буквы в данном стиле перевода.
