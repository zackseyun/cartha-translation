  to: 'Иисус ответил ему: «Если Я сказал что-то не так, засвидетельствуй об этом; а если Я сказал верно, почему ты бьёшь Меня?[a]»'
  rationale: Убрано не имеющее опоры в оригинале усиление «именно». Формулировка «засвидетельствуй об этом» передаёт юридически окрашенное μαρτύρησον и его отнесённость к предполагаемо неправильному сказанному, не перегружая русский текст.
