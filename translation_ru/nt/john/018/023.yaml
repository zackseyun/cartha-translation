  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Εἰ κακῶς ἐλάλησα, μαρτύρησον περὶ τοῦ κακοῦ· εἰ δὲ καλῶς, τί με δέρεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/023.yaml
  text: Jesus answered him[a], “If I spoke wrongly, testify about the wrong; but if rightly[b], why do you strike me?”
translation:
  language: ru
  text: 'Иисус ответил ему: «Если Я сказал что-то не так, засвидетельствуй об этом; а если Я сказал верно, почему ты бьёшь Меня?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «почему ты Меня ударяешь?» Греческий глагол может обозначать как отдельный удар, так и избиение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ Ἰησοῦς
  choice: Иисус ответил ему
  rationale: Естественный русский порядок слов точно передаёт повествовательную формулу и адресата ответа.
- source_word: Εἰ κακῶς ἐλάλησα
  choice: Если Я сказал что-то не так
  rationale: Оборот передаёт неправильность или предосудительность сказанного, не сужая смысл до фактической лжи или нравственного зла.
- source_word: μαρτύρησον
  choice: засвидетельствуй
  rationale: Сохраняет судебно-правовой оттенок требования представить свидетельство, а не просто высказать возражение.
- source_word: περὶ τοῦ κακοῦ
  choice: что именно было не так
  rationale: Естественно раскрывает субстантивированное выражение и сохраняет связь с κακῶς, не уточняя сверх текста характер предполагаемой неправоты.
- source_word: εἰ δὲ καλῶς
  choice: а если Я сказал верно
  rationale: Повторение глагола, подразумеваемого в греческом, необходимо для ясного и естественного русского противопоставления; «верно» противопоставлено «не так».
- source_word: τί με δέρεις
  choice: почему ты Меня бьёшь?
  rationale: Передаёт идиоматическое значение τί как вопрос о причине; «бьёшь» сохраняет широкий смысл удара без необоснованного уточнения его вида.
theological_decisions:
- issue: Характер ответа Иисуса на насилие
  choice: Ответ передан как требование свидетельства и указание на необоснованность удара.
  alternative: Усилить формулировку прямым обвинением в незаконности или несправедливости.
  rationale: Греческий текст имеет судебный оттенок, но прямо не добавляет оценочных слов «незаконно» или «несправедливо»; перевод сохраняет аргумент без богословского расширения.
translation_notes:
  register: Современный литературный русский язык; речь ясная и достойная, с сохранением судебного оттенка глагола «засвидетельствуй» и строгого условного противопоставления.
