id: JHN.12.24
reference: John 12:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ ὁ κόκκος τοῦ σίτου πεσὼν εἰς τὴν γῆν ἀποθάνῃ, αὐτὸς μόνος μένει· ἐὰν δὲ ἀποθάνῃ, πολὺν καρπὸν φέρει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/024.yaml
  text: Truly[a], truly, I say to you, unless the grain of wheat falls into the ground and dies, it remains by itself; but if it dies[b], it bears much fruit.
translation:
  language: ru
  text: 'Истинно, истинно говорю вам: если пшеничное зерно, упав в землю, не умрёт, оно так и останется одно[a]; если же умрёт[b], то принесёт много плода.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оно останется само по себе».'
    reason: lexical_alternative
  - marker: b
    text: Образ указывает на зерно, которое должно умереть в земле, чтобы принести плод. В контексте Иисус применяет этот образ к Своей смерти, а в следующих стихах — и к тем, кто следует за Ним.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Истинно, истинно
  rationale: Двойное ἀμήν — характерная для Евангелия от Иоанна торжественная формула, подчёркивающая истинность и значимость последующего высказывания. Повтор сохранён.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямая и естественная передача обращения, сохраняющая форму греческой фразы.
- source_word: ἐὰν μὴ
  choice: если ... не
  rationale: В данном сложном предложении такая конструкция звучит по-русски естественнее, чем «если только не», и точно выражает отрицательное условие.
- source_word: ὁ κόκκος τοῦ σίτου
  choice: пшеничное зерно
  rationale: Естественное русское обозначение зерна пшеницы, точно сохраняющее сельскохозяйственный образ.
- source_word: πεσὼν εἰς τὴν γῆν
  choice: упав в землю
  rationale: 'Деепричастный оборот передаёт предшествующее обстоятельственное причастие и сохраняет последовательность образа: зерно падает в землю, затем умирает.'
- source_word: ἀποθάνῃ
  choice: умрёт
  rationale: Прямая передача глагола «умирать»; будущее совершенного вида естественно для русского условного предложения и сохраняет резкость метафоры.
- source_word: αὐτὸς μόνος μένει
  choice: оно так и останется одно
  rationale: «Останется одно» передаёт μένει и μόνος, а частица «так и» естественно подчёркивает неизменность и бесплодную единичность зерна. Возможная передача «само по себе» дана в примечании.
- source_word: ἐὰν δὲ ἀποθάνῃ
  choice: если же умрёт
  rationale: Частица «же» ясно передаёт противопоставление δέ предыдущему условию.
- source_word: πολὺν καρπὸν φέρει
  choice: принесёт много плода
  rationale: Сохраняется библейская и иоанновская метафора принесения плода без расширения до «урожая», которого прямо нет в тексте.
theological_decisions:
- issue: Сельскохозяйственный образ с подразумеваемым христологическим смыслом и применением к ученикам
  choice: Сохранить в основном тексте буквальный образ зерна, смерти и плода, не раскрывая его применение внутри самого стиха.
  alternative: Прямо пояснить в переводе, что Иисус говорит о собственной смерти и её плодах для многих.
  rationale: Контекст связывает образ прежде всего с предстоящей смертью Иисуса, а следующие стихи распространяют тот же принцип на Его последователей. Однако данный стих выражает это посредством образа, а не явного толкования, поэтому богословское напряжение сохранено, а контекстуальная связь отмечена лишь в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Сохранены характерный двойной зачин «Истинно, истинно», повтор глагола «умрёт» и метафора принесения плода. Местоимение «оно» однозначно относится к зерну; прописные местоимения в отношении Иисуса употреблены только в пояснительной сноске согласно принятой русской религиозной издательской норме.
