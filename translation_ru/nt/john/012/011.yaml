  text: because many of the Jews were going away because of him and were believing in Jesus[a][b][c][d].
translation:
  language: ru
  text: потому что многие из иудеев[a] уходили из-за него[b] и верили в Иисуса[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «жителей Иудеи». У Иоанна слово «иудеи» в зависимости от контекста может обозначать иудейский народ, жителей Иудеи или иудейских руководителей.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «отходили». В греческом тексте не сказано прямо, от кого они уходили; вероятно, подразумевается отход от позиции или влияния противников Иисуса.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «доверяли Иисусу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит причину решения первосвященников, о котором сказано в предыдущем стихе.
- source_word: πολλοὶ … τῶν Ἰουδαίων
  choice: многие из иудеев
  rationale: 'Передаёт партитивную конструкцию: речь идёт о многих людях из более широкой группы, а не обо всех иудеях.'
- source_word: δι’ αὐτόν
  choice: из-за него
  rationale: διά с винительным падежом имеет здесь причинное значение; Лазарь был причиной описанной реакции людей.
- source_word: ὑπῆγον
  choice: уходили
  rationale: Имперфект указывает на продолжавшееся или повторявшееся действие. Дополнение в греческом тексте не названо, поэтому перевод не уточняет, от кого именно они уходили.
- source_word: ἐπίστευον εἰς τὸν Ἰησοῦν
  choice: верили в Иисуса
  rationale: Сохраняет направленность веры на Иисуса и не добавляет отсутствующих в стихе выводов о статусе этих людей; форма «верили» передаёт имперфект без обязательного значения начала действия.
theological_decisions:
- issue: Значение Ἰουδαίων в Евангелии от Иоанна
  choice: иудеев
  alternative: жителей Иудеи; иудейских руководителей
  rationale: В данном контексте выражение обозначает многих представителей иудейского народа, но не всех поголовно. Основной перевод сохраняет широкий термин оригинала, а возможный географический оттенок отмечен в сноске.
- issue: Неуказанная точка удаления при ὑπῆγον
  choice: уходили
  alternative: отходили от иудейских руководителей; покидали их
  rationale: Контекст допускает уход из-под влияния противников Иисуса, однако объект глагола в оригинале не выражен. Перевод сохраняет эту недосказанность.
- issue: Смысл πιστεύω εἰς
  choice: верили в Иисуса
  alternative: доверяли Иисусу; возлагали веру на Иисуса
  rationale: Текст говорит о вере, направленной на Иисуса, но сам по себе не уточняет всех её богословских следствий.
translation_notes:
  register: Современный литературный русский язык; причинная связь с предыдущим стихом сохранена. Формулировка намеренно не называет объект глагола «уходили», поскольку он отсутствует в греческом тексте. Повтор причинных конструкций «потому что из-за него» допустим и точно различает связь с предыдущим стихом и роль Лазаря.
