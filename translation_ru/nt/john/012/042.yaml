lexical_decisions:
- source_word: ὅμως μέντοι
  choice: И всё же
  rationale: Сочетание частиц выражает усиленное уступительное противопоставление; «И всё же» естественно передаёт его в современном русском языке.
- source_word: καὶ ἐκ τῶν ἀρχόντων πολλοὶ
  choice: даже среди начальников многие
  rationale: ἐκ с родительным указывает на принадлежность к группе, а ἄρχοντες обозначает представителей руководящей власти. «Начальники» сохраняет общий характер обозначения, не сужая его прямо до членов синедриона.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: поверили в Него
  rationale: Обычная для Иоанна конструкция πιστεύω εἰς выражает направленную на Иисуса веру; перевод не ослабляет и не усиливает утверждение автора.
- source_word: διὰ τοὺς Φαρισαίους
  choice: из-за фарисеев
  rationale: διά с винительным обозначает причину. Страх понятен из контекста, но прямо в обороте не назван.
- source_word: οὐχ ὡμολόγουν
  choice: не признавали этого открыто
  rationale: Имперфект передаёт продолжающееся или обычное уклонение от публичного признания. В греческом объект не выражен; «этого» отсылает к их вере, а «открыто» раскрывает публичный характер ὁμολογέω в данном контексте, не превращая выражение в позднейшую конфессиональную формулу.
- source_word: ἵνα μὴ
  choice: чтобы … не
  rationale: 'Передаёт цель: они избегали признания, чтобы не столкнуться с указанным последствием.'
- source_word: ἀποσυνάγωγοι γένωνται
  choice: их не отлучили от синагоги
  rationale: ἀποσυνάγωγος обозначает исключение из синагогальной общины. Естественная русская пассивная конструкция передаёт результативный смысл γένωνται без уточнения не названной в тексте процедуры.
theological_decisions:
- issue: Характер веры начальников в свете богословия Евангелия от Иоанна
  choice: Передать ἐπίστευσαν прямо как «поверили», сохранив рядом указание на отсутствие открытого признания.
  alternative: Ослабить до «заявляли, что верят» либо усилить до утверждения об их подлинном спасении.
  rationale: Стих одновременно утверждает их веру в Иисуса и сообщает, что они не признавали её открыто. Перевод сохраняет это напряжение и не решает вопрос об окончательном духовном состоянии этих людей за автора.
translation_notes:
  register: Современный литературный русский язык с dignified, но доступным синтаксисом. «Начальники» сохраняет институциональный оттенок без добавления «иудейские» или прямого отождествления с синедрионом. Заглавное «Него» следует принятой русской библейской орфографической традиции при местоименном указании на Иисуса.
