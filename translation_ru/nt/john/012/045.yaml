  text: καὶ ὁ θεωρῶν ἐμὲ θεωρεῖ τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/045.yaml
  text: And the one who sees me sees the one who sent me[a].
translation:
  language: ru
  text: И тот, кто видит Меня, видит Пославшего Меня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «созерцает»; греческий глагол может обозначать внимательное, осмысленное видение, а не только физическое зрение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз сохраняет связь с предшествующим высказыванием.
- source_word: ὁ θεωρῶν
  choice: тот, кто видит
  rationale: Субстантивированное причастие настоящего времени обозначает любого человека, совершающего это действие; оборот естественен по-русски и сохраняет обобщённое значение.
- source_word: ἐμὲ
  choice: Меня
  rationale: Прямое дополнение первого лица; прописная буква соответствует принятому в русском библейском стиле написанию местоимений, относящихся к Христу.
- source_word: θεωρεῖ
  choice: видит
  rationale: Передаёт значение зрительного восприятия и сохраняет повтор того же греческого глагола; возможный оттенок внимательного созерцания отмечен в сноске.
- source_word: τὸν πέμψαντά με
  choice: Пославшего Меня
  rationale: Субстантивированное аористное причастие естественно передаётся русским причастием и сохраняет обозначение Бога через Его действие, не добавляя отсутствующего в тексте титула «Отец».
theological_decisions:
- issue: Связь между видением Иисуса и видением Пославшего Его
  choice: 'Сохранено прямое параллельное утверждение: видящий Иисуса видит Пославшего Его.'
  alternative: Ослабить смысл до познания Бога через Иисуса либо усилить формулировку до явного утверждения онтологического тождества.
  rationale: Греческий текст выражает непосредственное единство откровения, но не поясняет его дополнительными догматическими формулами; перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной синтаксической формой. Повтор «видит… видит» сохранён как значимый элемент оригинала; «Пославшего» не заменено словом «Отец», поскольку такого титула в стихе нет.
