id: JHN.12.32
reference: John 12:32
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: κἀγὼ ⸀ἐὰν ὑψωθῶ ἐκ τῆς γῆς, πάντας ἑλκύσω πρὸς ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/032.yaml
  text: And I[a], when I am lifted up from the earth[c][b], will draw all people to myself.
translation:
  language: ru
  text: И Я, когда буду вознесён от земли[a][b], привлеку всех к Себе[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если буду вознесён». В греческом употреблена условная форма, однако в контексте речь идёт о предстоящей смерти Иисуса как о несомненном событии.'
    reason: alternative_reading
  - marker: b
    text: 'Слово «вознесён» может также означать «возвышен, прославлен»: у Иоанна здесь соединены распятие и прославление Иисуса.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «всех». Вероятнее всего, имеются в виду все люди; стих сам по себе не уточняет, как понимать это выражение в последующих богословских спорах о пределах спасения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: И Я
  rationale: Слияние καί и ἐγώ выражает связь с предыдущей мыслью и лёгкое личное ударение. «И Я» естественно передаёт обе функции.
- source_word: ἐὰν
  choice: когда
  rationale: Хотя ἐάν с сослагательным наклонением формально допускает перевод «если», в контексте Евангелия смерть Иисуса представлена как предстоящее несомненное событие. Условная форма отмечена в сноске.
- source_word: ὑψωθῶ
  choice: буду вознесён
  rationale: Глагол ὑψόω здесь соединяет буквальное поднятие на кресте с возвышением и прославлением. «Буду вознесён» сохраняет это намеренное двойное значение.
- source_word: ἐκ τῆς γῆς
  choice: от земли
  rationale: 'Здесь γῆ означает землю в пространственном смысле: Иисус будет поднят над землёй при распятии. Формулировка также соответствует пояснению в следующем стихе.'
- source_word: πάντας
  choice: всех
  rationale: Форма мужского рода во множественном числе естественно указывает на людей. В русском языке «всех» в данном контексте ясно и ёмко, не добавляя в основной текст отсутствующего существительного.
- source_word: ἑλκύσω
  choice: привлеку
  rationale: ἕλκω может означать тянуть или влечь. «Привлеку» естественно звучит по-русски и сохраняет идею направляющего воздействия, не уточняя его механизм.
- source_word: πρὸς ἐμαυτόν
  choice: к Себе
  rationale: Возвратное ἐμαυτόν сильнее простого местоимения. «К Себе» точно сохраняет возвратное ударение.
theological_decisions:
- issue: Объём значения πάντας в связи со спасением
  choice: всех
  alternative: всех людей; всех без различия; каждого без исключения
  rationale: Греческая форма естественно относится к людям, но сам стих не разрешает более поздних споров о том, означает ли это каждого человека без исключения или людей всякого рода. Краткое «всех» сохраняет широту утверждения, не навязывая конфессионального толкования.
- issue: Двойное значение ὑψωθῶ у Иоанна
  choice: буду вознесён
  alternative: буду поднят; буду возвышен
  rationale: У Иоанна образ одновременно указывает на распятие и прославление. «Буду вознесён» позволяет услышать оба смысла, тогда как один лишь перевод «буду возвышен» ослабил бы указание на способ смерти.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранён краткий, торжественный строй высказывания и характерная для Иоанна смысловая многослойность. Прописные буквы в «Я» и «Себе» отражают устойчивую русскую библейскую издательскую традицию, не меняя смысла текста.
