base_translation:
  language: en
  yaml_path: translation/nt/john/012/015.yaml
  text: Do not be afraid[a], daughter of Zion. Look, your King is coming[e][d][c][b], seated on a donkey’s colt.
translation:
  language: ru
  text: «Не бойся, дочь Сиона! Вот, твой Царь идёт, сидя на ослёнке»[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сидя на молодом осле». Эти слова перекликаются с Захарией 9:9, где Сиону возвещается приход его Царя.'
    reason: lexical_alternative; cross_reference; cultural_note
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: Не бойся
  rationale: Естественная современная передача запрета, сохраняющая прямую повелительную форму и смысл φοβέομαι.
- source_word: θυγάτηρ Σιών
  choice: дочь Сиона
  rationale: Сохраняет пророческое олицетворение Сиона/Иерусалима и узнаваемую библейскую формулу без разъясняющей подстановки.
- source_word: ἰδοὺ
  choice: Вот
  rationale: Краткая и естественная русская частица, привлекающая внимание к грядущему Царю; менее архаична, чем «се».
- source_word: ὁ βασιλεύς σου
  choice: твой Царь
  rationale: Точно передаёт определённую именную группу с притяжательным местоимением. Прописная буква отмечает титульное мессианское употребление применительно к Иисусу.
- source_word: ἔρχεται
  choice: идёт
  rationale: Передаёт настоящее время и динамику приближения; в данном контексте естественнее буквального «приходит».
- source_word: καθήμενος
  choice: сидя
  rationale: Сохраняет обстоятельственный характер причастия и не добавляет значения «верхом», прямо не выраженного греческим словом.
- source_word: ἐπὶ πῶλον ὄνου
  choice: на ослёнке
  rationale: Русское «ослёнок» естественно обозначает молодого осла и компактно передаёт оба компонента греческого выражения; буквальная структура приведена в примечании.
theological_decisions:
- issue: Аллюзия на Захарию 9:9 и мессианское царское достоинство Иисуса
  choice: Сохранить обращения «дочь Сиона» и «твой Царь» без истолковывающего расширения в основном тексте.
  alternative: Заменить Сион Иерусалимом или прямо назвать Иисуса обещанным Мессией.
  rationale: Греческий текст передаёт пророческую формулу и царский образ, но не разворачивает их толкование внутри данного стиха; перевод сохраняет аллюзию и не снимает её литературно-богословское напряжение.
- issue: Прописная буква в слове «Царь»
  choice: Писать «Царь» с прописной буквы.
  alternative: Писать «царь» со строчной буквы.
  rationale: Регистр букв не задан древнегреческой рукописной традицией. Прописная буква уместна как русская редакционная передача титульного мессианского употребления применительно к Иисусу, не меняющая лексического смысла.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. «Вот» выбрано вместо архаического «се», а традиционная формула «дочь Сиона» сохранена ради связи с пророческим контекстом. Единственный маркер [a] стоит в основном тексте и объединяет необходимое буквальное и контекстуальное пояснение.
