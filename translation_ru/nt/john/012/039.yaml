  text: 'По этой причине они не могли поверить, потому что Исаия снова сказал:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь с предшествующим контекстом естественным современным русским выражением.
- source_word: οὐκ ἠδύναντο
  choice: они не могли
  rationale: Прямо сохраняет выраженную греческим глаголом невозможность, не подменяя её одной лишь нежелательностью.
- source_word: πιστεύειν
  choice: поверить
  rationale: Естественно передаёт πιστεύω в данном контексте; совершенный вид уместен для конкретной реакции на откровение и сохраняет обычную для Иоанна лексику веры.
- source_word: ὅτι
  choice: ведь
  rationale: Вводит основание последующего утверждения и по-русски естественно связывает его с новой цитатой из Исаии.
- source_word: πάλιν
  choice: также
  rationale: Показывает, что далее приводится ещё одно изречение Исаии; здесь «также» звучит естественнее буквального «снова», не предполагая повторения тех же слов.
- source_word: εἶπεν
  choice: сказал
  rationale: Обычная и точная формула введения цитаты.
- source_word: Ἠσαΐας
  choice: Исаия
  rationale: Традиционная и общепонятная русская форма имени пророка.
theological_decisions:
- issue: Характер невозможности поверить
  choice: «они не могли поверить»
  alternative: «они не хотели верить»
  rationale: Греческий текст прямо говорит о невозможности. Перевод сохраняет эту богословскую напряжённость, но не объясняет её в терминах какой-либо конфессиональной системы.
- issue: Связь ὅτι со следующим изречением Исаии
  choice: «ведь Исаия также сказал»
  alternative: «потому что Исаия снова сказал»
  rationale: «Ведь» сохраняет причинно-пояснительную связь и одновременно избегает тяжеловесной русской конструкции после «поэтому».
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Формулировка лаконична и сохраняет открытую богословскую напряжённость исходного текста.
