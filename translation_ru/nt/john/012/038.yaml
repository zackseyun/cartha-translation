source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος Ἠσαΐου τοῦ προφήτου πληρωθῇ ὃν εἶπεν· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/038.yaml
  text: 'so that the word of Isaiah the prophet might be fulfilled[a], which he said: “Lord, who has believed our report? And to whom has the arm of the Lord been revealed?”'
translation:
  language: ru
  text: 'чтобы исполнилось слово, сказанное пророком Исаией:


    «Господи, кто поверил нашей вести[a]?


    И кому открылась мышца Господня?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тому, что мы слышали»; или: «нашему сообщению».'
    reason: 'Лексическая неоднозначность ἀκοή: слово может обозначать слышание либо содержание услышанного и возвещённого.'
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Сохраняет целевое/результативное соединение с предшествующим повествованием, не устраняя присущую греческому обороту смысловую напряжённость.
- source_word: ὁ λόγος Ἠσαΐου τοῦ προφήτου … ὃν εἶπεν
  choice: слово, сказанное пророком Исаией
  rationale: Естественная русская формулировка передаёт λόγος как «слово» и явно связывает изречение с пророком Исаией, избегая тяжеловесного буквального оборота «слово Исаии… которое он сказал».
- source_word: πληρωθῇ
  choice: исполнилось
  rationale: Передаёт аорист пассивного залога и сохраняет характерный для Иоанна мотив исполнения Писания.
- source_word: Κύριε
  choice: Господи
  rationale: Естественная русская форма звательного обращения к Господу.
- source_word: τίς ἐπίστευσεν
  choice: кто поверил
  rationale: Русское прошедшее время естественно передаёт греческий аорист в риторическом вопросе.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: нашей вести
  rationale: ἀκοή может обозначать услышанное, весть или сообщение. «Наша весть» ясно передаёт содержание возвещения, а подлинная лексическая неоднозначность отмечена в сноске.
- source_word: ὁ βραχίων κυρίου
  choice: рука Господня
  rationale: Сохраняет библейскую метафору явленной силы и действия Господа; «рука» в современном русском звучит естественнее анатомически буквального «мышца».
- source_word: τίνι ἀπεκαλύφθη
  choice: кому открылась
  rationale: Сохраняет пассивно-возвратный смысл глагола и естественно звучит вместе с метафорой «рука Господня».
theological_decisions:
- issue: Язык исполнения Писания и оттенок цели/результата
  choice: «чтобы исполнилось»
  alternative: «так исполнилось» / «в результате исполнилось»
  rationale: Оборот с ἵνα может совмещать оттенки цели и результата. Формулировка не сводит связь неверия с исполнением пророчества только к одному из этих оттенков.
- issue: Смысл ἀκοή в цитате из Исаии
  choice: «нашей вести»
  alternative: «услышанному от нас» / «нашему сообщению»
  rationale: Греческое слово допускает как оттенок слышания, так и обозначение услышанного сообщения. Основной текст выбирает естественный для контекста вариант, а альтернативы сохраняются в сноске.
- issue: Метафора βραχίων κυρίου
  choice: «рука Господня»
  alternative: «сила Господа»
  rationale: Образ не истолковывается отвлечённо как «сила», а сохраняется как библейская метафора Божьего могущественного действия.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксис вводной формулы сглажен ради естественности, а поэтический параллелизм цитаты сохранён. Форма «Господня» поддерживает возвышенный регистр, оставаясь понятной современному читателю.
