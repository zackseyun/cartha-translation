  text: ταῦτα εἶπεν Ἠσαΐας ⸀ὅτι εἶδεν τὴν δόξαν αὐτοῦ, καὶ ἐλάλησεν περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/041.yaml
  text: Isaiah said these things because he saw his glory and spoke about him[a].
translation:
  language: ru
  text: Исаия сказал это потому, что увидел Его славу и говорил о Нём.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Исаия сказал это потому, что увидел славу Бога и говорил о Нём». В контексте Евангелия от Иоанна местоимения, вероятнее всего, относятся к Иисусу, однако в основе этих слов лежит видение славы Господа у Исаии (Ис. 6:1).'
    reason: Сохранение возможной неоднозначности референта местоимений.
lexical_decisions:
- source_word: ταῦτα
  choice: это
  rationale: Нейтральное собирательное «это» естественно отсылает по-русски к приведённым выше пророческим словам, хотя греческая форма стоит во множественном числе.
- source_word: εἶπεν
  choice: сказал
  rationale: Прямое соответствие аористу λέγω; отличие от последующего ἐλάλησεν передано глаголом «говорил».
- source_word: Ἠσαΐας
  choice: Исаия
  rationale: Устоявшаяся русская библейская форма имени пророка.
- source_word: ὅτι
  choice: потому, что
  rationale: В данном контексте союз наиболее естественно выражает причину; изъяснительное «что» грамматически возможно, но хуже соответствует ходу мысли.
- source_word: εἶδεν
  choice: видел
  rationale: Естественная передача аориста ὁράω; в русском придаточном согласование видовременной перспективы делает «видел» более плавным, чем «увидел».
- source_word: τὴν δόξαν
  choice: славу
  rationale: «Слава» сохраняет богословскую насыщенность δόξα и устойчивую лексику Евангелия от Иоанна.
- source_word: αὐτοῦ
  choice: Его
  rationale: Местоимение передано без добавления имени, чтобы не устранять формальную неоднозначность оригинала; прописная буква указывает на божественного референта в рамках русской библейской традиции.
- source_word: ἐλάλησεν
  choice: говорил
  rationale: Передаёт λαλέω и слегка отличает его от εἶπεν «сказал»; несовершенный вид естественно описывает содержание пророческой речи.
- source_word: περὶ αὐτοῦ
  choice: о Нём
  rationale: Краткое и естественное современное соответствие περί с родительным падежом; местоименный характер оригинала сохранён.
theological_decisions:
- issue: К кому относятся местоимения αὐτοῦ / αὐτοῦ
  choice: В основном тексте сохранены местоимения «Его / о Нём»; в контексте Иоанна они, вероятнее всего, относятся к Иисусу.
  alternative: Понимать оба местоимения как относящиеся к Богу или Господу в более общем смысле.
  rationale: Ближайший контекст Ин 12:37–41 применяет слова Исаии к неверию в Иисуса и поддерживает христологическое прочтение. Однако фон Ис 6 — видение славы Господа, а сам греческий стих называет референта лишь местоимениями, поэтому перевод не подставляет имя и отмечает неоднозначность в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка лаконична и понятна; традиционная форма имени «Исаия» и термин «слава» сохранены. Прописные буквы в местоимениях соответствуют распространённой русской библейской практике, не заменяя местоименный референт явным именем.
