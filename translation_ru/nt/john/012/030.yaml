id: JHN.12.30
reference: John 12:30
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸂Ἰησοῦς καὶ εἶπεν⸃· Οὐ δι’ ἐμὲ ⸂ἡ φωνὴ αὕτη⸃ γέγονεν ἀλλὰ δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/030.yaml
  text: Jesus answered and said[a], “This voice has not come for my sake, but for yours.”
translation:
  language: ru
  text: 'Иисус ответил: «Не ради Меня прозвучал этот голос, а ради вас».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Этот голос прозвучал не из-за Меня, а из-за вас». Греческий предлог может указывать и на причину, хотя в данном контексте вероятнее значение «ради», то есть «для пользы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν
  choice: Иисус ответил
  rationale: В греческом это обычная повествовательная формула. По-русски «ответил и сказал» звучит избыточно; «ответил» естественно передаёт её функцию.
- source_word: ἡ φωνὴ αὕτη
  choice: этот голос
  rationale: Контекст указывает на только что услышанный небесный голос, а не просто на неопределённый звук.
- source_word: γέγονεν
  choice: прозвучал
  rationale: Перфект γίνομαι обозначает состоявшееся явление голоса. «Прозвучал» естественно сочетается со словом «голос» и передаёт событие без буквального, но неестественного «произошёл».
- source_word: δι’ ἐμὲ ... δι’ ὑμᾶς
  choice: ради Меня ... ради вас
  rationale: Одинаковый перевод сохраняет параллелизм и контраст. В контексте διά с винительным вероятнее выражает предназначение или пользу, хотя допустимо и причинное понимание.
- source_word: Οὐ ... ἀλλὰ
  choice: не ... а
  rationale: Прямо и естественно передаёт греческое противопоставление.
theological_decisions:
- issue: Назначение небесного голоса
  choice: Голос прозвучал не ради Иисуса, а ради слушателей.
  alternative: Голос прозвучал не из-за Иисуса, а из-за слушателей.
  rationale: 'Контекст поддерживает значение предназначения или пользы: голос был дан для слушателей, а не для подтверждения, необходимого Иисусу. Сноска сохраняет возможный причинный оттенок διά, не делая его основным.'
translation_notes:
  register: Современный литературный русский язык; фраза краткая и торжественная без архаизмов. Местоимение «Меня» написано с прописной буквы как принятое в русском библейском стиле обращение к Иисусу. Маркер сноски поставлен после всей цитаты.
