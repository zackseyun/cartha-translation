  source_fidelity: 'Текст точно передаёт основное противопоставление греческого оригинала: голос прозвучал не ради Иисуса, а ради слушателей. «Прозвучал» естественно передаёт γέγονεν применительно к голосу, а «ради Меня ... ради вас» сохраняет параллелизм δι’ ἐμέ ... δι’ ὑμᾶς и его наиболее вероятный целевой/бенефактивный смысл.'
