  text: ὁ ἀθετῶν ἐμὲ καὶ μὴ λαμβάνων τὰ ῥήματά μου ἔχει τὸν κρίνοντα αὐτόν· ὁ λόγος ὃν ἐλάλησα ἐκεῖνος κρινεῖ αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/048.yaml
  text: 'The one who rejects me and does not receive my words has one who judges him: the word that I spoke will judge him on the last day[a][b].'
translation:
  language: ru
  text: 'Кто отвергает Меня и не принимает Моих слов[a], тот имеет судью: слово, которое Я произнёс, — оно будет судить его в последний день[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не принимает того, что Я говорю». Греческий глагол может означать получение, принятие или благосклонное восприятие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «весть, которую Я возвестил». Греческое слово λόγος в этом контексте может означать как «слово», так и «весть, послание».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶν
  choice: отвергает
  rationale: Передаёт сознательное неприятие Иисуса, сохраняя личную направленность глагола и не ослабляя его до простого пренебрежения.
- source_word: μὴ λαμβάνων τὰ ῥήματά μου
  choice: не принимает Моих слов
  rationale: «Принимает» естественно по-русски выражает как получение, так и признание или принятие сказанного; буквальное «не получает» здесь звучало бы неясно.
- source_word: ῥήματά
  choice: слов
  rationale: Множественное число отражает отдельные произнесённые Иисусом слова; «изречений» имело бы излишне книжный оттенок.
- source_word: ἔχει τὸν κρίνοντα αὐτόν
  choice: уже имеет судью
  rationale: Сохраняет необычную конструкцию о наличии судьи в настоящем; «уже» естественно раскрывает подразумеваемую актуальность, не меняя будущего времени последующего суда.
- source_word: ὁ λόγος
  choice: слово
  rationale: Сохраняет единственное число и весомое, почти персонифицированное звучание λόγος; возможное контекстуальное значение — «весть».
- source_word: ὃν ἐλάλησα
  choice: которое Я произнёс
  rationale: Передаёт аорист и устный характер речи; «произнёс» в данном контексте естественнее сочетания «слово, которое Я сказал».
- source_word: ἐκεῖνος
  choice: оно
  rationale: Отдельное местоимение после тире сохраняет эмфатическое указание на то самое слово.
- source_word: κρινεῖ
  choice: будет судить
  rationale: Не сужает значение до «осудит», поскольку греческий глагол обозначает суд и сам по себе не предрешает формулировку исхода.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: в последний день
  rationale: Устоявшееся и естественное русское выражение для эсхатологического времени без внесения дополнительной доктринальной схемы.
theological_decisions:
- issue: Кто или что выступает судящим
  choice: Высказанное Иисусом слово представлено как судья или действующее основание последнего суда.
  alternative: Понять «слово» лишь как безличный критерий суда либо заменить его непосредственным указанием на Иисуса как Судью.
  rationale: Синтаксис сначала говорит, что отвергающий уже имеет судью, а затем прямо указывает на произнесённое Иисусом слово. Формулировка сохраняет эту персонификацию и не устраняет напряжение с другими местами Евангелия о роли Сына в суде.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Прописные местоимения при обращении к Иисусу соответствуют распространённой русской издательской традиции. Двоеточие и тире помогают ясно передать пояснительную структуру и эмфатическое ἐκεῖνος.
