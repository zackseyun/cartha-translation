lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: На следующий день
  rationale: Естественное русское обозначение следующего дня, точно передающее временную последовательность.
- source_word: ὁ ὄχλος πολὺς
  choice: множество людей
  rationale: Передаёт многочисленность толпы и естественно сочетается с последующим причастием во множественном смысловом согласовании.
- source_word: ὁ ἐλθὼν εἰς τὴν ἑορτήν
  choice: пришедших на праздник
  rationale: Причастный оборот естественно передаёт определительное значение греческого артиклированного причастия; предшествование прихода понятно из контекста.
- source_word: ἀκούσαντες
  choice: услышав
  rationale: Деепричастие сохраняет обстоятельственное значение аористного причастия и его смысловое отношение к людям, составляющим множество.
- source_word: ὅτι ἔρχεται ὁ Ἰησοῦς
  choice: что Иисус идёт
  rationale: Настоящее время сохраняет исторический презенс греческого текста и живость повествования без смыслового уточнения способа передвижения.
- source_word: εἰς Ἱεροσόλυμα
  choice: в Иерусалим
  rationale: Обычное современное русское выражение направления движения к городу.
