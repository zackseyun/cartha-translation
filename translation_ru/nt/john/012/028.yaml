  text: πάτερ, δόξασόν σου τὸ ὄνομα. ἦλθεν οὖν φωνὴ ἐκ τοῦ οὐρανοῦ· Καὶ ἐδόξασα καὶ πάλιν δοξάσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/028.yaml
  text: 'Father[a], glorify your name. Then a voice came from heaven: “I have glorified it, and I will glorify it again.”'
translation:
  language: ru
  text: 'Отец, прославь Своё имя! Тогда с неба раздался голос: «Я прославил его и прославлю снова».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάτερ
  choice: Отец
  rationale: Звательная форма прямого обращения к Богу. В греческом нет притяжательного местоимения, поэтому «Мой Отец» не добавляется.
- source_word: δόξασόν
  choice: прославь
  rationale: Аорист повелительного наклонения от δοξάζω. «Прославь» естественно по-русски и сохраняет характерную для Иоанна богословскую связь со славой Бога.
- source_word: σου τὸ ὄνομα
  choice: Своё имя
  rationale: Возвратное «Своё» в русском естественно соотносит имя с адресатом повеления; «имя» сохраняет библейский смысл явленного характера и славы Бога.
- source_word: ἦλθεν οὖν φωνὴ ἐκ τοῦ οὐρανοῦ
  choice: И тогда с неба раздался голос
  rationale: Фраза передаёт развитие повествования; «раздался голос» — естественное русское выражение для появления слышимого голоса, а «с неба» сохраняет указание на его божественное происхождение.
- source_word: Καὶ ἐδόξασα καὶ πάλιν δοξάσω
  choice: Я уже прославил его и прославлю снова
  rationale: Аорист ἐδόξασα передан завершённым прошедшим действием с актуальным результатом посредством «уже»; будущее δοξάσω — «прославлю». Местоимение «его» восполняет подразумеваемый объект «имя» и согласуется с его грамматическим родом в русском.
theological_decisions:
- issue: Подразумеваемый объект в ответе с неба
  choice: Добавить «его», относящееся к слову «имя»
  alternative: 'Оставить объект невыраженным: «Я уже прославил и прославлю снова»'
  rationale: В греческом объект восстанавливается из контекста, но без него русская фраза звучит неестественно и может быть понята как непереходное употребление. «Его» ясно указывает на Божье имя, не вводя нового смысла.
- issue: Передача δοξάζω в богословски значимом контексте Евангелия от Иоанна
  choice: прославить
  alternative: почтить; явить славу
  rationale: «Прославить» сохраняет повторяющуюся у Иоанна лексику славы и не ослабляет смысл до простого оказания почести.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизации. Местоимение «Своё» написано с прописной буквы как уважительное обозначение Бога; прямая речь оформлена по нормам русской пунктуации.
