  naturalness: Текст звучит естественно и литературно. «С неба раздался голос» — удачная современная передача φωνὴ ἐκ τοῦ οὐρανοῦ. Удаление «уже» делает реплику более точной и столь же плавной.
  terminology: «Отец», «прославь», «имя» и повтор «прославил / прославлю» верно сохраняют иоанновскую лексику славы. «Своё» уместно как русское возвратное местоимение, соотнесённое с адресатом обращения.
