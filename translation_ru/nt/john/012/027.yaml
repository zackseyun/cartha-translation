base_translation:
  language: en
  yaml_path: translation/nt/john/012/027.yaml
  text: Now my soul is troubled[a], and what should I say? Father, save me from this hour. But for this reason I came to this hour.
translation:
  language: ru
  text: Теперь душа Моя встревожена, и что Мне сказать?[a] Отец, спаси Меня от этого часа. Но ради этого Я и пришёл к этому часу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также риторическое прочтение: «И что Мне сказать? „Отец, спаси Меня от этого часа“?» В древнегреческом тексте первоначальная пунктуация не сохранилась, поэтому эти слова можно понимать либо как риторический вопрос, либо как прямую просьбу.'
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: Теперь
  rationale: Передаёт непосредственность нынешнего состояния Иисуса и естественно звучит по-русски.
- source_word: ἡ ψυχή μου
  choice: душа Моя
  rationale: Сохраняет образ внутренней жизни и личности, а также торжественность высказывания, не сводя ψυχή только к эмоциям.
- source_word: τετάρακται
  choice: встревожена
  rationale: Передаёт результирующее состояние сильного внутреннего смятения, выраженное перфектом, в современном литературном русском.
- source_word: τί εἴπω
  choice: что Мне сказать?
  rationale: Естественно передаёт совещательный конъюнктив и внутреннее размышление говорящего.
- source_word: πάτερ
  choice: Отец
  rationale: Прямое обращение к Богу; нормативная и естественная русская форма.
- source_word: σῶσόν με ἐκ τῆς ὥρας ταύτης
  choice: спаси Меня от этого часа
  rationale: Близко передаёт повелительную форму и ἐκ; «час» сохраняет значимый для Евангелия от Иоанна мотив назначенного времени страданий и прославления.
- source_word: ἀλλὰ διὰ τοῦτο
  choice: Но ведь ради этого
  rationale: Передаёт контраст и целевую направленность фразы; частица «ведь» естественно подчёркивает обоснование последующего утверждения.
- source_word: ἦλθον εἰς τὴν ὥραν ταύτην
  choice: Я и пришёл к этому часу
  rationale: Сохраняет движение к назначенному часу, выраженное εἰς, не заменяя его более толковательным «пришёл ради этого часа».
theological_decisions:
- issue: Являются ли слова «Отец, спаси Меня от этого часа» прямой просьбой или отвергаемой риторической возможностью?
  choice: 'В основном тексте они включены в риторический вопрос: «И что Мне сказать? „Отец, спаси Меня от этого часа“?»'
  alternative: 'Прямая просьба: «И что Мне сказать? Отец, спаси Меня от этого часа. Но ради этого Я и пришёл к этому часу».'
  rationale: В древнейших рукописях пунктуация не была оригинальной, поэтому греческий допускает оба прочтения. Риторическое оформление хорошо связывает τί εἴπω с последующей цитатой и контрастом ἀλλά, однако прямую просьбу нельзя исключить; она сохранена в примечании, чтобы не устранять подлинную неоднозначность и богословское напряжение.
translation_notes:
  register: Современный литературный русский с умеренно торжественным евангельским регистром. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской традиции. Термин «час» сохранён ради сквозного иоанновского мотива.
