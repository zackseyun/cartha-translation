  text: τοσαῦτα δὲ αὐτοῦ σημεῖα πεποιηκότος ἔμπροσθεν αὐτῶν οὐκ ἐπίστευον εἰς αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/037.yaml
  text: Although he had done so many signs before them[a], they did not believe in him[b],
translation:
  language: ru
  text: Хотя Он совершил у них на глазах столько знамений, они не верили в Него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческая форма глагола может подчёркивать продолжавшееся или повторявшееся неверие.
