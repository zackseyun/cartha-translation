lexical_decisions:
- source_word: τοσαῦτα
  choice: столько
  rationale: 'Передаёт количественное ударение: знамений было много.'
- source_word: δὲ
  choice: хотя
  rationale: Противительный смысл δέ и уступительный смысл всей конструкции естественно выражены союзом «хотя» без избыточного начального «но».
- source_word: σημεῖα
  choice: знамений
  rationale: Сохраняет характерный для Иоанна термин, указывающий не только на чудо, но и на его откровенное значение.
- source_word: πεποιηκότος
  choice: совершил
  rationale: В сочетании «хотя Он совершил» естественно передаёт предшествующее действие причастия перфекта и его сохраняющуюся значимость.
- source_word: ἔμπροσθεν αὐτῶν
  choice: у них на глазах
  rationale: Ясно и современно передаёт публичность и непосредственную видимость знамений.
- source_word: οὐκ ἐπίστευον
  choice: не верили
  rationale: Естественная русская форма несовершенного вида передаёт продолжавшееся неверие, не добавляя явно не выраженной идеи сознательного отказа.
- source_word: εἰς αὐτόν
  choice: в Него
  rationale: Нормальное русское соответствие иоанновой конструкции πιστεύω εἰς, выражающей веру, направленную на Иисуса.
theological_decisions:
- issue: Видовой оттенок имперфекта ἐπίστευον
  choice: они не верили в Него
  alternative: они так и не поверили в Него
  rationale: «Не верили» естественно сохраняет длительный или устойчивый характер неверия. Вариант «так и не поверили» сильнее подчёркивал бы итог и мог бы привнести дополнительный оттенок окончательности.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная. «Знамения» сохраняет богословски значимую лексику Евангелия от Иоанна, а «у них на глазах» естественно передаёт смысл открытого совершения знамений.
