source:
  edition: SBLGNT
  text: ὁ φιλῶν τὴν ψυχὴν αὐτοῦ ⸀ἀπολλύει αὐτήν, καὶ ὁ μισῶν τὴν ψυχὴν αὐτοῦ ἐν τῷ κόσμῳ τούτῳ εἰς ζωὴν αἰώνιον φυλάξει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/025.yaml
  text: The one who loves his life loses it[b][a], and the one who hates his life in this world will keep it for eternal life.
translation:
  language: ru
  text: Кто любит свою жизнь, тот теряет её, а кто ненавидит свою жизнь в этом мире, тот сохранит её для вечной жизни.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «душу»; греческое ψυχή в зависимости от контекста может означать жизнь, самого человека или душу.'
    reason: lexical_alternative
  - marker: b
    text: '«Ненавидит свою жизнь» — намеренно резкий парадокс: речь идёт об отказе ставить сохранение своей жизни в нынешнем мире превыше всего, а не о презрении к себе.'
    reason: interpretive_clarification
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: кто любит
  rationale: Субстантивированное причастие настоящего времени имеет обобщающий смысл; русская конструкция «кто любит» естественно передаёт его без утраты длительного, характерного отношения.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: свою жизнь
  rationale: В данном контексте ψυχή обозначает жизнь человека, которой он дорожит и которую может потерять или сохранить. Возвратное «свою» естественно соотносит её с субъектом каждого придаточного.
- source_word: ἀπολλύει αὐτήν
  choice: теряет её
  rationale: Настоящее время и переходная конструкция переданы прямо; «теряет» естественно противопоставлено будущему «сохранит».
- source_word: ὁ μισῶν
  choice: кто ненавидит
  rationale: Сильное значение μισέω сохранено, чтобы не сглаживать намеренный парадокс высказывания.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: в этом мире
  rationale: Прямое и естественное соответствие, которое также ограничивает парадокс рамками нынешнего мирового порядка.
- source_word: φυλάξει αὐτήν
  choice: сохранит её
  rationale: Будущее время передано явно; «сохранит» хорошо выражает удержание и сбережение жизни и образует ясный контраст с «теряет».
- source_word: εἰς ζωὴν αἰώνιον
  choice: для вечной жизни
  rationale: εἰς выражает направленность к цели или результату; «для вечной жизни» звучит естественно и сохраняет эту направленность.
theological_decisions:
- issue: Смысл выражения «ненавидит свою жизнь»
  choice: Сохранить резкое выражение как намеренный парадокс об отказе считать нынешнюю жизнь высшей ценностью.
  alternative: «любит свою жизнь меньше» или «не дорожит своей жизнью»
  rationale: Греческий текст употребляет μισέω, а уточнение «в этом мире» задаёт рамки противопоставления нынешней и вечной жизни. Смягчение в основном тексте преждевременно разрешило бы напряжение.
- issue: Передача ψυχή
  choice: «жизнь» в обеих частях
  alternative: «душа» или «сам человек»
  rationale: Противопоставление «теряет — сохранит» в контексте относится прежде всего к жизни человека; перевод «душа» мог бы привнести не требуемое текстом противопоставление души и тела.
translation_notes:
  register: Современный литературный русский язык; краткая симметричная форма афоризма сохранена. Повтор «свою жизнь» удерживает риторический параллелизм оригинала, а местоимение «тот» делает русскую конструкцию ясной и естественной.
