  text: καὶ ἐάν τίς μου ἀκούσῃ τῶν ῥημάτων καὶ μὴ ⸀φυλάξῃ, ἐγὼ οὐ κρίνω αὐτόν, οὐ γὰρ ἦλθον ἵνα κρίνω τὸν κόσμον ἀλλ’ ἵνα σώσω τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/047.yaml
  text: And if anyone hears my words and does not keep them[a], I do not judge him; for I did not come to judge the world[b], but to save the world.
translation:
  language: ru
  text: И если кто услышит Мои слова и не соблюдёт их[a], Я не сужу его, потому что Я пришёл не для того, чтобы судить мир, а чтобы спасти мир.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я не осуждаю его». Греческий глагол может означать как суд вообще, так и неблагоприятный приговор.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τίς
  choice: если кто
  rationale: 'Естественная русская условная конструкция, сохраняющая открытое, обобщённое значение: речь идёт о любом человеке.'
- source_word: ἀκούσῃ
  choice: услышит
  rationale: Передаёт основное значение глагола, не добавляя подразумеваемой внимательности или послушания, которые могло бы внести «прислушается».
- source_word: μου … τῶν ῥημάτων
  choice: Мои слова
  rationale: Естественно передаёт речь Иисуса и сохраняет конкретное значение произнесённых слов.
- source_word: φυλάξῃ
  choice: сохранит их
  rationale: φυλάσσω охватывает значения хранения, соблюдения и верности услышанному. «Сохранит» удерживает эту широту лучше, чем более узкое «исполнит» или «послушается».
- source_word: οὐ κρίνω αὐτόν
  choice: Я не сужу его
  rationale: «Сужу» сохраняет повтор ключевого глагола κρίνω в следующей части стиха и не сужает его значение до одного лишь осуждения.
- source_word: ἦλθον
  choice: Я пришёл
  rationale: Аорист обобщённо указывает на приход и миссию Иисуса; русское прошедшее время передаёт это естественно.
- source_word: ἵνα κρίνω
  choice: для того, чтобы судить
  rationale: Ясно выражает цель, обозначенную конструкцией ἵνα с сослагательным наклонением.
- source_word: τὸν κόσμον
  choice: мир
  rationale: Стандартная и контекстуально уместная передача κόσμος в Евангелии от Иоанна; искусственно сужать значение до «людей» нет оснований.
- source_word: ἵνα σώσω
  choice: чтобы спасти
  rationale: Сохраняет выражение цели и центральное библейское значение σῴζω — спасать.
theological_decisions:
- issue: Соотношение слов «Я не сужу его» с другими высказываниями Евангелия от Иоанна о суде
  choice: Сохранить глагол «судить» и не уточнять время или вид суда.
  alternative: «Я не осуждаю его» либо «Я не сужу его сейчас».
  rationale: Стих противопоставляет цели прихода Иисуса — суд и спасение. Буквенная лексическая связь сохраняет богословское напряжение с другими местами, не разрешая его посредством пояснительного перевода.
- issue: Обобщённое мужское местоимение αὐτόν
  choice: «его»
  alternative: «такого человека»
  rationale: Местоимение согласовано с неопределённым τις и имеет обобщённую силу. Русское «если кто… его» естественно сохраняет и число, и грамматическую форму исходного текста.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и умеренно формальным звучанием. Повтор «мир» и глагольная связь «сужу — судить» сохранены ради риторической и смысловой структуры оригинала.
