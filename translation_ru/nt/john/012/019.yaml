id: JHN.12.19
reference: John 12:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἱ οὖν Φαρισαῖοι εἶπαν πρὸς ἑαυτούς· Θεωρεῖτε ὅτι οὐκ ὠφελεῖτε οὐδέν· ἴδε ὁ ⸀κόσμος ὀπίσω αὐτοῦ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/019.yaml
  text: So the Pharisees said to one another[a], “You see that you are accomplishing nothing. Look—the world has gone after him.”
translation:
  language: ru
  text: 'Тогда фарисеи сказали друг другу: «Вы видите, что ничего не добиваетесь. Вот, мир[a] пошёл за ним».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все пошли за ним». В греческом тексте буквально сказано «мир»; вероятно, это риторическое преувеличение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Тогда
  rationale: Передаёт связь с предшествующей сценой как её последствие и естественно вводит реакцию фарисеев в русском повествовании.
- source_word: πρὸς ἑαυτούς
  choice: друг другу
  rationale: 'В данном контексте возвратное местоимение имеет взаимное значение: фарисеи разговаривают между собой.'
- source_word: Θεωρεῖτε
  choice: Вы видите
  rationale: Сохраняет форму настоящего времени изъявительного наклонения и передаёт раздражённое признание очевидного результата.
- source_word: οὐκ ὠφελεῖτε οὐδέν
  choice: ничего не добиваетесь
  rationale: Естественно выражает тщетность их действий против Иисуса, сохраняя усиленное греческое отрицание.
- source_word: ἴδε
  choice: Вот
  rationale: Передаёт резкое привлечение внимания без архаичного оттенка слова «се» и естественно звучит перед следующим утверждением.
- source_word: κόσμος
  choice: мир
  rationale: Сохраняет образ и ключевую лексику греческого текста, не заменяя риторическое преувеличение толкованием «все».
- source_word: ὀπίσω αὐτοῦ
  choice: за ним
  rationale: Естественный русский оборот, сохраняющий образ следования за человеком.
- source_word: ἀπῆλθεν
  choice: пошёл
  rationale: Передаёт аорист как совершившееся действие с очевидным для говорящих результатом; сочетание «пошёл за ним» естественно по-русски.
theological_decisions:
- issue: Объём значения κόσμος в словах фарисеев
  choice: Сохранить «мир» как риторическое преувеличение
  alternative: «все пошли за ним» или «вся толпа пошла за ним»
  rationale: Фарисеи в раздражении гиперболически описывают успех Иисуса. Формулировка «мир» сохраняет греческое выражение и характерную для Иоанна лексику, не превращая реплику в утверждение о буквальном всеобщем следовании.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно dignified; реплика передаёт раздражение и ощущение беспомощности без архаизмов. Местоимение «ним» написано со строчной буквы, чтобы не добавлять отсутствующее в греческом тексте конфессиональное оформление.
