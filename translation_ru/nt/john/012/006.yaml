  text: εἶπεν δὲ τοῦτο οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ, ἀλλ’ ὅτι κλέπτης ἦν καὶ τὸ γλωσσόκομον ⸀ἔχων τὰ βαλλόμενα ἐβάσταζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/006.yaml
  text: He said this not because he cared about the poor[a], but because he was a thief, and having the money box[b], he used to take what was put into it.
translation:
  language: ru
  text: Он сказал это не потому, что заботился о бедных, а потому, что был вором, и денежный ящик[a] был у него, и он забирал себе то, что туда клали[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «денежная сумка». Греческое слово обозначает вместилище, в котором хранили деньги.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «уносил»; возможно также: «присваивал». Греческий глагол часто означает «нести» или «носить», но слова о том, что Иуда был вором, указывают здесь на присвоение денег.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ τοῦτο
  choice: Он сказал это
  rationale: δέ имеет здесь лёгкую связующую функцию, которую нет необходимости передавать отдельным русским союзом; выражение естественно продолжает повествование.
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: не потому, что… а потому, что
  rationale: Парная конструкция точно и естественно передаёт противопоставление отвергнутой и действительной причин.
- source_word: περὶ τῶν πτωχῶν ἔμελεν αὐτῷ
  choice: заботился о бедных
  rationale: Русское выражение передаёт личную заинтересованность и заботу, выраженные μέλει с дательным лицом и περί с родительным.
- source_word: κλέπτης
  choice: вором
  rationale: κλέπτης обозначает тайно крадущего, поэтому «вор», а не «разбойник», сохраняет смысловое различие.
- source_word: τὸ γλωσσόκομον ἔχων
  choice: денежный ящик находился у него
  rationale: Передаёт обладание и фактический доступ Иуды к вместилищу для общих денег без добавления формальной должности или полномочий.
- source_word: τὰ βαλλόμενα
  choice: то, что туда клали
  rationale: Субстантивированное страдательное причастие передано естественной русской придаточной конструкцией; «туда» ясно указывает на денежный ящик.
- source_word: ἐβάσταζεν
  choice: забирал себе
  rationale: Имперфект передаёт повторяющееся действие, а ближайший контекст («был вором») указывает на присвоение. «Забирал себе» сохраняет некоторую широту глагола и менее категорично, чем прямое «крал».
theological_decisions:
- issue: Значение ἐβάσταζεν в связи с обвинением Иуды в воровстве
  choice: забирал себе то, что туда клали
  alternative: носил то, что туда клали; присваивал то, что туда клали
  rationale: Сам по себе βαστάζω часто означает «нести» или «носить», однако прямое определение Иуды как вора делает значение присвоения наиболее вероятным. Основной текст передаёт этот контекстуальный смысл, а сноска сохраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинный. Двоеточие естественно вводит пояснение обвинения. Повторяющийся характер действия передан несовершенным видом «забирал»; неоднозначность βαστάζω отмечена в сноске.
