id: JHN.12.35
reference: John 12:35
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἔτι μικρὸν χρόνον τὸ φῶς ⸂ἐν ὑμῖν⸃ ἐστιν. περιπατεῖτε ⸀ὡς τὸ φῶς ἔχετε, ἵνα μὴ σκοτία ὑμᾶς καταλάβῃ, καὶ ὁ περιπατῶν ἐν τῇ σκοτίᾳ οὐκ οἶδεν ποῦ ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/035.yaml
  text: So Jesus said to them[a], “The light is still among you for a little while. Walk while you have the light, so that darkness may not overtake you. The one who walks in the darkness does not know where he is going.”
translation:
  language: ru
  text: 'Тогда Иисус сказал им: «Свет ещё недолго будет среди вас[a]. Ходите, пока у вас есть свет, чтобы тьма не настигла вас. Тот, кто ходит во тьме, не знает, куда идёт».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в вас»; или: «с вами». Греческое выражение допускает несколько пониманий, хотя в непосредственном контексте речь, вероятнее всего, идёт о присутствии Иисуса среди слушателей.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Тогда
  rationale: Естественно связывает ответ Иисуса с предшествующим разговором, не придавая союзу чрезмерно строгого логического значения.
- source_word: Ἔτι μικρὸν χρόνον
  choice: ещё недолго
  rationale: Кратко и естественно передаёт как ἔτι («ещё»), так и ограниченность оставшегося времени.
- source_word: τὸ φῶς
  choice: свет
  rationale: Сохраняет исходный образ и его богословскую насыщенность в Евангелии от Иоанна, не заменяя метафору толкованием.
- source_word: ἐν ὑμῖν
  choice: среди вас
  rationale: В непосредственном контексте речь идёт о пока ещё продолжающемся присутствии Иисуса перед слушателями; неоднозначность предлога отмечена в сноске.
- source_word: περιπατεῖτε
  choice: Ходите
  rationale: Сохраняет образ хождения, который может обозначать и конкретное движение, и образ жизни; перевод «живите» неоправданно устранил бы эту образность.
- source_word: ὡς τὸ φῶς ἔχετε
  choice: пока у вас есть свет
  rationale: ὡς понимается во временном смысле, что соответствует настоятельности призыва воспользоваться светом, пока он доступен.
- source_word: ἵνα μὴ
  choice: чтобы ... не
  rationale: Ясно и естественно выражает отрицательную цель или предупреждение в современном русском языке.
- source_word: σκοτία
  choice: тьма
  rationale: Сохраняет характерное для Иоанна противопоставление света и тьмы и обладает уместным литературным регистром.
- source_word: καταλάβῃ
  choice: настигла
  rationale: Передаёт образ тьмы, которая догоняет и захватывает человека; контекстуально точнее, чем более отвлечённое «одолела».
- source_word: ὁ περιπατῶν ἐν τῇ σκοτίᾳ
  choice: Тот, кто ходит во тьме
  rationale: Естественно передаёт обобщённое субстантивированное причастие и сохраняет повтор образа хождения.
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: не знает, куда идёт
  rationale: Идиоматично и точно передаёт незнание направления движения, сохраняя настоящее время.
theological_decisions:
- issue: Значение ἐν ὑμῖν применительно к свету
  choice: среди вас
  alternative: «в вас» или «с вами»
  rationale: Контекст указывает прежде всего на ограниченное по времени открытое присутствие Иисуса среди слушателей. Однако греческое выражение допускает также внутреннее или сопутствующее значение, поэтому варианты сохранены в сноске, без навязывания учения о внутреннем пребывании.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и образности оригинала. Повторы «свет», «тьма» и «ходить» намеренно сохранены как важные элементы иоанновского противопоставления.
