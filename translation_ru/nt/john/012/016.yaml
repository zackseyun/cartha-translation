review_pass:
  verdict: revise
  source_fidelity: 'Последнее выражение ταῦτα ἐποίησαν αὐτῷ означает «сделали всё это ему/по отношению к нему», а не «для него». Перевод «для него» добавляет благоприятельно-целевое значение, которого дательный αὐτῷ сам по себе не задаёт. Остальные ключевые соответствия верны: «не поняли», «сначала», «был прославлен», «вспомнили» и «было написано о нём» точно и естественно передают греческий текст.'
  naturalness: Предлагаемая формулировка современна и литературна. Оборот «сделали всё это по отношению к нему» несколько более эксплицитен, чем греческий дательный, но в русском избегает неестественного «сделали всё это ему» и не вносит положительной окраски «для него».
  terminology: «Был прославлен» сохраняет существенную для Иоанна многозначность ἐδοξάσθη. Сноска к этому слову уместно даёт лишь общий контекст, не сужая значение до одного события. «О нём» корректно передаёт ἐπ’ αὐτῷ в данном контексте.
  issues:
  - severity: medium
    issue: «Всё это сделали для него»
    rationale: «Для него» обычно выражает цель, пользу или совершение в чьих-либо интересах. Греческое αὐτῷ после ἐποίησαν обозначает адресата/лицо, по отношению к которому совершены действия; английский audit trail также фиксирует «to him», а не «for him».
  - severity: low
    issue: Сноска c повторяет основное чтение
    rationale: Фраза «было написано о нём» уже стоит в основном тексте, поэтому она не функционирует как лексическая альтернатива. Сноска заменена на действительно отличающийся, но равно допустимый порядок слов.
