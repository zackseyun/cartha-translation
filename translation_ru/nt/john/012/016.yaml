  text: ⸀ταῦτα οὐκ ἔγνωσαν ⸂αὐτοῦ οἱ μαθηταὶ⸃ τὸ πρῶτον, ἀλλ’ ὅτε ἐδοξάσθη Ἰησοῦς τότε ἐμνήσθησαν ὅτι ταῦτα ἦν ἐπ’ αὐτῷ γεγραμμένα καὶ ταῦτα ἐποίησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/016.yaml
  text: His disciples did not understand these things at first[a], but when Jesus was glorified[c][b], then they remembered that these things had been written about him and that they had done these things to him.
translation:
  language: ru
  text: Сначала его ученики всего этого не поняли[a], но, когда Иисус был прославлен[b], они вспомнили, что всё это было написано о нём[c] и что всё это сделали по отношению к нему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всего этого не знали».'
    reason: lexical_alternative
  - marker: b
    text: В Евангелии от Иоанна прославление Иисуса обычно связано с его смертью, воскресением и возвышением.
    reason: cross_reference
  - marker: c
    text: 'Или: «о нём было написано всё это».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνωσαν
  choice: не поняли
  rationale: В данном контексте речь идёт не просто о незнании фактов, а о том, что ученики поначалу не постигли значения происходившего; при этом сноска сохраняет более буквальную возможность «не знали».
- source_word: αὐτοῦ οἱ μαθηταί
  choice: его ученики
  rationale: Естественная русская передача принадлежности и связи учеников с Иисусом.
- source_word: τὸ πρῶτον
  choice: сначала
  rationale: Кратко и естественно передаёт временное значение «поначалу».
- source_word: ἐδοξάσθη
  choice: был прославлен
  rationale: Сохраняет характерный для Иоанна богословски насыщенный глагол, не сводя его значение только к почёту или возвышению.
- source_word: ἐμνήσθησαν
  choice: вспомнили
  rationale: Естественная передача формы глагола в последовательности повествования.
- source_word: ἐπ’ αὐτῷ γεγραμμένα
  choice: было написано о нём
  rationale: ἐπί с дательным здесь указывает на содержание написанного — «о нём, относительно него»; русское прошедшее время передаёт предшествование Писания моменту воспоминания.
- source_word: ταῦτα ἐποίησαν αὐτῷ
  choice: всё это сделали для него
  rationale: Передаёт повтор ταῦτα и дательный αὐτῷ естественным русским оборотом; «для него» соответствует благоприятному характеру действий при входе Иисуса в Иерусалим, хотя греческая конструкция допускает менее определённое отношение.
- source_word: ταῦτα
  choice: всё это
  rationale: Сохраняет повтор указательного местоимения и его собирательную отсылку к описанным действиям и деталям.
theological_decisions:
- issue: Значение прославления Иисуса в Евангелии от Иоанна
  choice: Сохранено выражение «был прославлен» без уточнения момента и объёма прославления.
  alternative: «был возвеличен» или прямое отнесение только к воскресению и вознесению
  rationale: У Иоанна прославление Иисуса связано многослойно с его смертью, воскресением и возвышением. Перевод не устраняет эту богословскую напряжённость уточняющим толкованием.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет повествовательную последовательность и повтор «всё это». Термин «прославлен» оставлен без поясняющей замены, чтобы сохранить характерное для Иоанна значение.
