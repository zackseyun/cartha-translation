id: JHN.12.43
reference: John 12:43
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἠγάπησαν γὰρ τὴν δόξαν τῶν ἀνθρώπων μᾶλλον ἤπερ τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/043.yaml
  text: For they loved the glory of men rather than the glory of God[a].
translation:
  language: ru
  text: Ведь они возлюбили человеческую славу больше, чем славу Божью.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «славу от людей больше, чем славу от Бога»; по смыслу также возможно: «людское одобрение больше, чем одобрение Бога».'
    reason: Сохраняется возможность понимать родительный падеж как указание на источник, а δόξα — как похвалу или одобрение.
lexical_decisions:
- source_word: ἠγάπησαν
  choice: возлюбили
  rationale: Аорист действительного залога передаёт совершившуюся направленность их любви и выбора. «Возлюбили» сохраняет силу ἀγαπάω и связь с лексикой любви, не сводя значение к более слабому «предпочли».
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит основание для предыдущего утверждения. «Ведь» естественно передаёт пояснительно-причинную связь в современном русском языке.
- source_word: τὴν δόξαν τῶν ἀνθρώπων
  choice: человеческую славу
  rationale: «Слава» сохраняет широкий диапазон δόξα и важную для Евангелия от Иоанна лексическую связь. Прилагательное «человеческую» естественно передаёт общий, не ограниченный мужчинами смысл ἀνθρώπων и оставляет открытым оттенок славы, исходящей от людей.
- source_word: μᾶλλον ἤπερ
  choice: больше, чем
  rationale: Оборот ясно выражает сравнительное предпочтение одного другому, сохраняя форму сравнения греческого текста.
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: славу Божью
  rationale: Формулировка сохраняет параллелизм с «человеческой славой» и не сужает родительный падеж до одного лишь значения источника.
theological_decisions:
- issue: Значение δόξα в противопоставлении человеческого и Божьего
  choice: слава
  alternative: похвала; одобрение; почёт
  rationale: «Слава» сохраняет как широкое значение слова, так и его богословский резонанс у Иоанна. В данном контексте возможен смысл похвалы или одобрения, но явное внесение этого значения в основной текст неоправданно сужало бы оригинал.
- issue: Смысл родительного падежа в τῶν ἀνθρώπων и τοῦ θεοῦ
  choice: человеческая слава / слава Божья
  alternative: слава от людей / слава от Бога
  rationale: Греческий родительный может указывать на источник или принадлежность. Выбранная пара сохраняет эту смысловую открытость и симметрию оригинала; вариант с «от» точнее выражает вероятный контекстуальный оттенок одобрения, но разрешает неоднозначность.
- issue: Обобщающее значение ἀνθρώπων
  choice: человеческую
  alternative: людей; людскую
  rationale: Здесь ἄνθρωποι обозначает людей вообще, а не только мужчин. «Человеческую» точно и естественно передаёт обобщающий смысл без гендерного сужения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. «Возлюбили» передаёт силу глагола, а «Божью» звучит естественнее в современной речи, чем более архаичное «Божию».
