  text: ὁ δὲ Ἰησοῦς ⸀ἀποκρίνεται αὐτοῖς λέγων· Ἐλήλυθεν ἡ ὥρα ἵνα δοξασθῇ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/023.yaml
  text: But Jesus answered them[a], saying[b], “The hour has come for the Son of Man to be glorified.”
translation:
  language: ru
  text: 'Иисус же ответил им: «Пришёл час[a], чтобы Сын Человеческий[b] был прославлен».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «настало время». В греческом тексте стоит слово «час» — повторяющееся у Иоанна обозначение назначенного Иисусу времени страданий и славы.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Сын человека». Это наименование перекликается с Дан. 7:13–14; традиционная форма «Сын Человеческий» сохранена ради этой смысловой связи.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται αὐτοῖς λέγων
  choice: ответил им
  rationale: Историческое настоящее передано естественным для русского повествования прошедшим временем. Причастие λέγων не воспроизводится отдельно, поскольку двоеточие перед прямой речью ясно передаёт его функцию и позволяет избежать тяжеловесного «ответил им, говоря».
- source_word: Ἐλήλυθεν
  choice: пришёл
  rationale: Совершенный вид и контекст передают наступление назначенного часа как уже свершившийся факт с сохраняющимся результатом.
- source_word: ἡ ὥρα
  choice: час
  rationale: «Час» сохраняет повторяющийся в Евангелии от Иоанна образ назначенного момента страданий и прославления Иисуса; более общее «время» ослабило бы эту связь.
- source_word: ἵνα δοξασθῇ
  choice: чтобы … был прославлен
  rationale: Конструкция сохраняет целевое или содержательное значение ἵνα и страдательный залог δοξασθῇ, не уточняя явно, кто прославляет Сына Человеческого.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшееся русское наименование сохраняет связь с образом из Даниила 7 и христологическое звучание выражения в Евангелии от Иоанна.
theological_decisions:
- issue: Смысл «часа» Иисуса
  choice: Пришёл час
  alternative: Настало время
  rationale: Выбранный вариант сохраняет характерный для Иоанна богословски насыщенный мотив «часа», не сводя его только к хронологическому моменту.
- issue: Передача ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  alternative: Сын человека
  rationale: Традиционная форма узнаваема для современного русского читателя и сохраняет межтекстовую связь с Даниилом 7. При этом перевод не разъясняет титул внутри основного текста и не снимает присущую ему смысловую напряжённость.
- issue: Страдательный залог δοξασθῇ
  choice: был прославлен
  alternative: принял славу
  rationale: Страдательная конструкция точнее сохраняет грамматику оригинала и намеренно не называет действующего лица, тогда как «принял славу» несколько смещает акцент.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Союз «же» сохраняет переход и лёгкое противопоставление δέ. Формула «говоря» опущена как неестественная перед прямой речью; её функция выражена двоеточием. Кавычки и прописные буквы оформлены по нормам русского религиозно-литературного текста.
