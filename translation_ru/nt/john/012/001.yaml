source:
  edition: SBLGNT
  text: Ὁ οὖν Ἰησοῦς πρὸ ἓξ ἡμερῶν τοῦ πάσχα ἦλθεν εἰς Βηθανίαν, ὅπου ἦν ⸀Λάζαρος, ὃν ἤγειρεν ἐκ νεκρῶν ⸀Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/001.yaml
  text: So Jesus came to Bethany six days before the Passover[a], where Lazarus was, whom Jesus had raised from the dead.
translation:
  language: ru
  text: Итак, за шесть дней до Пасхи Иисус пришёл в Вифанию, где был Лазарь, которого Иисус воскресил из мёртвых.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «из числа мёртвых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Итак
  rationale: Передаёт повествовательную связь с предшествующим контекстом, не превращая её в чрезмерно строгий логический вывод.
- source_word: πρὸ ἓξ ἡμερῶν τοῦ πάσχα
  choice: за шесть дней до Пасхи
  rationale: Естественная русская передача временной конструкции; «Пасха» обозначает известный иудейский праздник.
- source_word: ἦλθεν εἰς Βηθανίαν
  choice: пришёл в Вифанию
  rationale: Точно и естественно передаёт движение к месту без добавочного значения, содержащегося в варианте «прибыл».
- source_word: ὅπου ἦν Λάζαρος
  choice: где был Лазарь
  rationale: Сохраняет простую локативную формулировку оригинала, не уточняя без основания, жил ли или находился там Лазарь временно.
- source_word: ἤγειρεν
  choice: воскресил
  rationale: 'В контексте возвращения Лазаря к жизни русское «воскресил» естественно выражает каузативный смысл: Иисус поднял его из состояния смерти.'
- source_word: ἐκ νεκρῶν
  choice: из мёртвых
  rationale: Традиционная и понятная русская формула, сохраняющая образ выхода из числа умерших; буквальный оттенок пояснён в сноске.
theological_decisions:
- issue: Повтор имени Иисуса в относительном придаточном
  choice: которого Иисус воскресил
  alternative: которого Он воскресил
  rationale: В греческом тексте имя Ἰησοῦς повторено явно; его сохранение подчёркивает, кто воскресил Лазаря, и точнее отражает источник.
- issue: Язык воскресения применительно к Лазарю
  choice: воскресил из мёртвых
  alternative: поднял из мёртвых
  rationale: «Воскресил» в современном русском ясно передаёт контекстуальный смысл ἐγείρω, не вводя дополнительных догматических уточнений о природе возвращения Лазаря к жизни.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис близок к греческому, но естественен по-русски; повтор имени «Иисус» намеренно сохранён.
