id: JHN.12.17
reference: John 12:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐμαρτύρει οὖν ὁ ὄχλος ὁ ὢν μετ’ αὐτοῦ ὅτε τὸν Λάζαρον ἐφώνησεν ἐκ τοῦ μνημείου καὶ ἤγειρεν αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/017.yaml
  text: So the crowd that had been with him when he called Lazarus out of the tomb and raised him from the dead was bearing witness[a].
translation:
  language: ru
  text: Итак, народ, который был с Ним, когда Он вызвал Лазаря из гробницы и воскресил его из мёртвых, свидетельствовал об этом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «продолжал свидетельствовать». Греческая форма может указывать на продолжавшееся или повторявшееся действие; тема свидетельства неоднократно звучит в Евангелии от Иоанна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρει
  choice: свидетельствовал об этом
  rationale: Имперфект передаёт продолжающееся в тот момент свидетельство; «свидетельствовал» сохраняет важную для Евангелия от Иоанна лексику свидетельства. «Об этом» естественно обозначает содержание свидетельства, заданное следующим придаточным.
- source_word: οὖν
  choice: итак
  rationale: Передаёт повествовательно-логическую связь с предшествующим контекстом, не усиливая её до строгого причинного вывода.
- source_word: ὁ ὄχλος
  choice: народ
  rationale: В данном контексте обозначает собравшуюся массу людей; «народ» звучит естественно и достойно в русском евангельском повествовании.
- source_word: ὁ ὢν μετ’ αὐτοῦ
  choice: который был с Ним
  rationale: Определительный оборот выделяет именно тех людей, которые находились с Иисусом при воскрешении Лазаря; русский текст сохраняет эту отсылку без излишнего временного уточнения.
- source_word: ὅτε
  choice: когда
  rationale: Прямо и естественно вводит временное придаточное.
- source_word: ἐφώνησεν
  choice: вызвал
  rationale: В сочетании с ἐκ τοῦ μνημείου глагол означает, что Иисус позвал Лазаря выйти из гробницы; «вызвал … из» ясно передаёт направленность действия.
- source_word: ἐκ τοῦ μνημείου
  choice: из гробницы
  rationale: μνημεῖον здесь означает место погребения, а предлог ἐκ указывает движение наружу.
- source_word: ἤγειρεν
  choice: воскресил
  rationale: В контексте возвращения Лазаря к жизни русское «воскресил» прямо и естественно передаёт каузативный смысл ἐγείρω.
- source_word: ἐκ νεκρῶν
  choice: из мёртвых
  rationale: Сохраняет устойчивую новозаветную формулу и её буквальный образ выхода из числа мёртвых.
theological_decisions:
- issue: Утверждение о воскрешении Лазаря
  choice: воскресил его из мёртвых
  alternative: поднял его из мёртвых
  rationale: Перевод прямо сохраняет утверждение греческого текста о возвращении Лазаря к жизни, не ослабляя его и не добавляя догматического толкования.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Прописное «Ним/Он» употреблено по русской традиции для ясной отсылки к Иисусу. Формулировка сохраняет длинную греческую синтаксическую связь, но остаётся понятной обычному читателю.
