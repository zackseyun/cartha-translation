  text: ἔρχεται ⸀ὁ Φίλιππος καὶ λέγει τῷ Ἀνδρέᾳ· ⸀ἔρχεται Ἀνδρέας καὶ Φίλιππος ⸀καὶ λέγουσιν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/022.yaml
  text: Philip comes and tells Andrew[a]; Andrew and Philip come and tell Jesus.
translation:
  language: ru
  text: Филипп приходит и говорит Андрею[a]. Андрей и Филипп приходят и говорят Иисусу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь последовательно употреблено историческое настоящее: «приходит… говорит… приходят… говорят». Такой повествовательный приём придаёт рассказу живость; в переводах его нередко заменяют прошедшим временем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: приходит
  rationale: Историческое настоящее сохранено, чтобы передать живость повествования Иоанна; глагол обозначает движение к следующему собеседнику.
- source_word: λέγει
  choice: говорит
  rationale: Нейтральное и естественное соответствие в конструкции с адресатом в дательном падеже; не уточняет содержание сообщения, которого греческий текст здесь не приводит.
- source_word: τῷ Ἀνδρέᾳ
  choice: Андрею
  rationale: Дательный падеж передаёт адресата речи; имя дано в принятой русской библейской форме.
- source_word: ἔρχεται Ἀνδρέας καὶ Φίλιππος
  choice: Андрей и Филипп приходят
  rationale: Единственное число греческого глагола при составном подлежащем естественно передано русским множественным числом; историческое настоящее сохранено.
- source_word: λέγουσιν
  choice: говорят
  rationale: Сохраняет параллель с λέγει и не добавляет отсутствующего в оригинале содержания сообщения.
- source_word: τῷ Ἰησοῦ
  choice: Иисусу
  rationale: Дательный падеж естественно обозначает адресата речи; имя дано в принятой русской библейской форме.
- source_word: καί
  choice: и
  rationale: Сохранена простая сочинительная связь греческого текста без добавления временного или причинно-следственного оттенка.
theological_decisions: []
