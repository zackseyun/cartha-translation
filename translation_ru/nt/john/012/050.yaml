source:
  edition: SBLGNT
  text: καὶ οἶδα ὅτι ἡ ἐντολὴ αὐτοῦ ζωὴ αἰώνιός ἐστιν. ἃ οὖν ⸂ἐγὼ λαλῶ⸃, καθὼς εἴρηκέν μοι ὁ πατήρ, οὕτως λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/050.yaml
  text: And I know that his commandment is eternal life. So what I speak[a], I speak just as the Father has told me.
translation:
  language: ru
  text: И Я знаю, что Его заповедь — вечная жизнь. Поэтому то, что Я говорю, Я говорю так, как сказал Мне Отец.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντολή
  choice: заповедь
  rationale: «Заповедь» естественно передаёт авторитетное повеление и сохраняет торжественный, библейский регистр без излишней архаичности.
- source_word: ζωὴ αἰώνιος
  choice: вечная жизнь
  rationale: Устойчивое для Иоанна выражение, передающее и непреходящую длительность, и жизнь грядущего века.
- source_word: ἃ
  choice: то, что
  rationale: Естественная русская передача среднего рода множественного числа относительного местоимения; обозначает содержание речи Иисуса.
- source_word: λαλῶ
  choice: Я говорю
  rationale: Одинаковый перевод обоих употреблений сохраняет намеренный повтор греческого глагола.
- source_word: καθὼς
  choice: так, как
  rationale: Ясно выражает соответствие речи Иисуса тому, что велел Ему Отец, и звучит естественно по-русски.
- source_word: εἴρηκέν μοι
  choice: сказал Мне
  rationale: Русский совершенный вид естественно передаёт состоявшееся слово Отца, сохраняющее силу; более буквальное «сказал Мне» не добавляет идеи, которой нет в тексте.
- source_word: ὁ πατήρ
  choice: Отец
  rationale: Сохраняет определённый титул без добавления притяжательного «Мой», отсутствующего в греческом тексте.
- source_word: οὖν
  choice: поэтому
  rationale: Передаёт логическое следствие яснее, чем нейтральное «итак», и соответствует связи между двумя частями стиха.
- source_word: οἶδα
  choice: Я знаю
  rationale: Прямая и естественная передача уверенного утверждения οἶδα.
theological_decisions:
- issue: Значение выражения «Его заповедь — вечная жизнь»
  choice: Сохранено прямое отождествляющее выражение «заповедь — вечная жизнь».
  alternative: «Его заповедь ведёт к вечной жизни» или «Его заповедь касается вечной жизни».
  rationale: В греческом тексте стоит прямая именная конструкция с ἐστιν («есть»). Буквенная по смыслу передача сохраняет богословскую ёмкость и не сводит связь заповеди с жизнью лишь к результату или теме.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Заглавные буквы в местоимениях «Я», «Его», «Мне» следуют традиционному русскому оформлению речи о Боге и Христе; синтаксический повтор сохранён как риторически значимый.
