source:
  edition: SBLGNT
  text: Ἔγνω ⸀οὖν ὄχλος πολὺς ἐκ τῶν Ἰουδαίων ὅτι ἐκεῖ ἐστιν, καὶ ἦλθον οὐ διὰ τὸν Ἰησοῦν μόνον, ἀλλ’ ἵνα καὶ τὸν Λάζαρον ἴδωσιν ὃν ἤγειρεν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/009.yaml
  text: So a large crowd of the Jews learned that he was there[a], and they came not only because of Jesus, but also so that they might see Lazarus, whom he had raised from the dead.
translation:
  language: ru
  text: Итак, многие иудеи[a] узнали, что Он там, и пришли не только ради Иисуса, но и чтобы увидеть Лазаря, которого Он воскресил из мёртвых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «люди из Иудеи». Греческое слово может обозначать как иудеев вообще, так и, в некоторых контекстах Евангелия от Иоанна, людей из Иудеи.'
    reason: Сохраняет контекстуальную неоднозначность термина Ἰουδαῖοι, не сужая региональное значение до уроженцев Иудеи.
lexical_decisions:
- source_word: Ἔγνω
  choice: узнало
  rationale: Аорист γινώσκω обозначает получение сведений; «узнало» естественно передаёт наступившее знание.
- source_word: οὖν
  choice: И вот
  rationale: Связывает событие с предшествующим повествованием и передаёт переход к последствию без чрезмерно логического оттенка русского «поэтому».
- source_word: ὄχλος πολὺς
  choice: множество
  rationale: Передаёт многочисленную группу людей и согласуется с грамматическим числом собирательного существительного.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: иудеев
  rationale: В данном праздничном контексте обозначает людей из иудейского народа; неоднозначность между этнорелигиозным и региональным значениями отмечена в сноске.
- source_word: ὅτι ἐκεῖ ἐστιν
  choice: что Он там
  rationale: Сохраняет настоящее время греческого текста в косвенной речи; подразумеваемый субъект — Иисус.
- source_word: ἦλθον
  choice: они пришли
  rationale: Явно выраженное русское местоимение устраняет возможное рассогласование с собирательным словом «множество» и естественно передаёт множественное число греческого глагола.
- source_word: οὐ διὰ τὸν Ἰησοῦν μόνον
  choice: не только из-за Иисуса
  rationale: διά с винительным падежом выражает причину или побуждение; «из-за» здесь нейтрально означает мотив прихода.
- source_word: ἀλλ’ ἵνα καὶ ... ἴδωσιν
  choice: но и чтобы увидеть
  rationale: Передаёт противопоставление и цель, выраженную ἵνα с сослагательным наклонением.
- source_word: ὃν ἤγειρεν ἐκ νεκρῶν
  choice: которого Он воскресил из мёртвых
  rationale: В контексте ἐγείρω означает возвращение Лазаря к жизни; «воскресил из мёртвых» сохраняет устойчивую библейскую формулу.
theological_decisions:
- issue: Значение Ἰουδαίων в Евангелии от Иоанна
  choice: иудеев
  alternative: уроженцев Иудеи / жителей Иудеи
  rationale: Непосредственный контекст допускает этнорелигиозное значение, однако у Иоанна слово может иметь и региональное значение. Основной текст использует обычное русское соответствие, а сноска сохраняет смысловую неоднозначность.
- issue: Субъект глагола ἤγειρεν
  choice: Он воскресил
  alternative: Иисус воскресил
  rationale: Греческий текст оставляет субъект невыраженным, но контекст однозначно указывает на Иисуса; местоимение сохраняет структуру источника без ненужного уточнения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный повествовательный стиль. Заглавное «Он» применено к Иисусу по принятой русской библейской традиции; синтаксис адаптирован для естественного согласования после собирательного слова «множество».
