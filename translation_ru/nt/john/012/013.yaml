source:
  edition: SBLGNT
  text: ἔλαβον τὰ βαΐα τῶν φοινίκων καὶ ἐξῆλθον εἰς ὑπάντησιν αὐτῷ, καὶ ⸀ἐκραύγαζον· Ὡσαννά, εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου, ⸂καὶ ὁ⸃ βασιλεὺς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/013.yaml
  text: They took the palm branches and went out to meet him[a], and they were crying out, “Hosanna! Blessed is the one who comes in the name of the Lord[c][b], even the King of Israel!”
translation:
  language: ru
  text: 'Они взяли пальмовые ветви и вышли Ему навстречу, и громко восклицали: «Осанна![a] Благословен Тот, Кто приходит во имя Господа, — Царь Израиля!»[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Осанна» — возглас еврейского происхождения со значением «спаси же» или «прошу, спаси»; к тому времени он употреблялся также как возглас хвалы.
    reason: lexical_alternative
  - marker: b
    text: Эти слова перекликаются с Псалмом 117:26 (в иной нумерации — 118:26).
    reason: cross_reference
  - marker: c
    text: 'Или: «Благословен Тот, Кто приходит во имя Господа, и Царь Израиля». Греческое «и» может присоединять царский титул как пояснение к словам «Тот, Кто приходит во имя Господа».'
    reason: alternative_reading
lexical_decisions:
- source_word: βαΐα τῶν φοινίκων
  choice: пальмовые ветви
  rationale: Естественное русское выражение, точно передающее ветви финиковых пальм без ненужной тяжеловесности.
- source_word: ἐξῆλθον εἰς ὑπάντησιν αὐτῷ
  choice: вышли Ему навстречу
  rationale: Прямо и идиоматично передаёт выход навстречу человеку, не добавляя толкования «приветствовать».
- source_word: ἐκραύγαζον
  choice: восклицая
  rationale: Передаёт продолжительное или повторявшееся громкое возглашение, выраженное греческим имперфектом.
- source_word: Ὡσαννά
  choice: Осанна
  rationale: Сохраняет закрепившуюся в русском библейском и богослужебном языке транслитерацию; исходный смысл пояснён в сноске.
- source_word: εὐλογημένος ὁ ἐρχόμενος
  choice: Благословен Идущий
  rationale: Передаёт субстантивированное причастие и узнаваемую формулу Псалма 117:26 в достойном, но понятном русском стиле.
- source_word: ἐν ὀνόματι κυρίου
  choice: во имя Господа
  rationale: Формально сохраняет библейское выражение и соответствует греческому κυρίου.
- source_word: καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ
  choice: И Царь Израиля
  rationale: 'Сохраняет явное καί и подлинную синтаксическую неоднозначность: слова могут продолжать благословение или добавлять царский титул.'
theological_decisions:
- issue: Передача κύριος в отсылке к Псалму 117:26
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Перевод следует непосредственно греческому κυρίου; написание капителью внесло бы в основной текст интерпретацию еврейского тетраграмматона, стоящего за цитатой.
- issue: Связь выражения καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ с предшествующей фразой
  choice: И Царь Израиля
  alternative: то есть Царь Израиля
  rationale: Простое «и» сохраняет греческую конструкцию и её напряжение; пояснительное «то есть» однозначно превращало бы титул в приложение, тогда как καί допускает более буквальное соединение.
- issue: Царско-мессианский смысл возгласа
  choice: сохранить титул «Царь Израиля» без поясняющего расширения
  alternative: израильский Царь-Мессия
  rationale: Текст прямо называет Иисуса Царём Израиля, но не содержит здесь слова «Мессия»; добавлять его в основной текст не следует.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Ему», «Идущий», «Господа» и «Царь» оформлены с прописной буквы в соответствии с русской христианской издательской традицией. Порядок сносок приведён в соответствие с местом поясняемых выражений.
