base_translation:
  language: en
  yaml_path: translation/nt/john/012/034.yaml
  text: So the crowd answered him[a], "We have heard from the Law that the Messiah remains forever[b], and how can you say that the Son of Man must be lifted up? Who is this Son of Man?"
translation:
  language: ru
  text: 'Тогда народ ответил Ему: «Мы слышали из Закона, что Мессия[b] пребывает вовеки. Как же Ты говоришь, что Сын Человеческий должен быть поднят[a]? Кто этот Сын Человеческий?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вознесён». У Иоанна это слово может указывать как на физическое поднятие, так и на возвышение, прославление.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Христос»; здесь это слово передано как «Мессия», поскольку оно употреблено как титул.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτῷ ὁ ὄχλος
  choice: Тогда народ ответил Ему
  rationale: οὖν продолжает ход повествования и здесь естественно передаётся словом «тогда». ὄχλος обозначает собравшийся народ; «народ» звучит естественнее, чем «толпа», в прямой речи этого контекста.
- source_word: Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου
  choice: Мы слышали из Закона
  rationale: Аорист ἠκούσαμεν передаёт усвоенное ими учение. «Из Закона» сохраняет формулировку оригинала, где νόμος может обозначать свидетельство Писания в более широком смысле.
- source_word: ὁ χριστός
  choice: Мессия
  rationale: Слово употреблено как титул ожидаемого Помазанника; «Мессия» ясно передаёт иудейский контекст высказывания.
- source_word: μένει εἰς τὸν αἰῶνα
  choice: пребывает вовеки
  rationale: Сохраняется длительный смысл μένει и устойчивое значение εἰς τὸν αἰῶνα. Формулировка литературна и понятна в библейском контексте.
- source_word: πῶς λέγεις σὺ
  choice: Как же Ты говоришь
  rationale: Частица «же» передаёт недоумение и возражение, выраженные вопросом πῶς и подчёркнутым σὺ.
- source_word: δεῖ ὑψωθῆναι
  choice: должен быть вознесён
  rationale: 'δεῖ выражает необходимость. «Вознесён» позволяет не сводить ὑψωθῆναι только к физическому поднятию: у Иоанна слово связано и с крестной смертью, и с прославлением.'
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшаяся передача титульного выражения, сохраняющая его библейские ассоциации.
theological_decisions:
- issue: Передача титула ὁ χριστός
  choice: Мессия
  alternative: Христос
  rationale: Вопрос народа касается ожидаемого Помазанника, который пребывает вовеки. «Мессия» сохраняет иудейскую мессианскую рамку, а примечание сообщает буквальную греческую форму.
- issue: Многозначность ὑψωθῆναι у Иоанна
  choice: быть вознесённым
  alternative: быть поднятым
  rationale: Выбранная формулировка сохраняет напряжение между физическим поднятием на кресте и возвышением или прославлением, не ограничивая смысл одним толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Формы «Ему» и «Ты» написаны с прописной буквы по принятой русской традиции обращения к Иисусу. Маркеры примечаний поставлены непосредственно при словах, к которым относятся.
