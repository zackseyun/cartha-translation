lexical_decisions:
- source_word: Διὰ τί
  choice: Почему
  rationale: Естественная и точная передача вопроса о причине.
- source_word: τοῦτο τὸ μύρον
  choice: это благовоние
  rationale: μύρον обозначает ароматическое средство, часто дорогое и употреблявшееся для умащения; «благовоние» естественно для данного контекста и не навязывает современный образ спиртовых духов.
- source_word: οὐκ ἐπράθη
  choice: было не продать
  rationale: Русская конструкция с инфинитивом естественно передаёт риторический вопрос о неосуществлённой возможности, сохраняя значение пассивного аориста «не было продано».
- source_word: τριακοσίων δηναρίων
  choice: за триста динариев
  rationale: Родительный цены передан предлогом «за»; историческое название денежной единицы сохранено, а её приблизительная покупательная ценность пояснена в сноске.
- source_word: καὶ ἐδόθη πτωχοῖς
  choice: и не раздать деньги бедным
  rationale: В греческом буквально «и [не] отдано бедным»; в контексте подразумеваются вырученные от продажи средства. Добавление «деньги» делает смысл естественным и ясным по-русски, не меняя референта.
