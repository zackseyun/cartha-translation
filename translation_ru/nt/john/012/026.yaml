source:
  edition: SBLGNT
  text: ἐὰν ἐμοί ⸂τις διακονῇ⸃ ἐμοὶ ἀκολουθείτω, καὶ ὅπου εἰμὶ ἐγὼ ἐκεῖ καὶ ὁ διάκονος ὁ ἐμὸς ἔσται· ⸀ἐάν τις ἐμοὶ διακονῇ τιμήσει αὐτὸν ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/026.yaml
  text: If anyone serves me[a], let him follow me; and where I am, there my servant will be also. If anyone serves me, the Father will honor him.
translation:
  language: ru
  text: Если кто служит Мне[a], пусть следует за Мной; и где Я, там будет и Мой слуга. Если кто служит Мне, того почтит Отец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте употреблена обобщённая конструкция в мужском роде и единственном числе: «Если кто служит Мне… того почтит Отец».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονῇ
  choice: служит
  rationale: Глагол обозначает служение Иисусу в широком смысле; «служит» естественно по-русски и не создаёт ненужной ассоциации с церковной должностью.
- source_word: ἀκολουθείτω
  choice: пусть следует
  rationale: Форма передаёт повеление продолжать следовать за Иисусом как Его ученик, не усиливая его до «обязан».
- source_word: διάκονος
  choice: слуга
  rationale: Здесь речь о человеке, служащем Иисусу, а не о церковной должности диакона; «слуга» сохраняет связь с глаголом «служит» и общий характер обозначения.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: где Я
  rationale: Краткая русская конструкция естественно передаёт смысл; местоимение «Я» сохраняет присутствующее в греческом тексте личное ударение без тяжеловесного «где нахожусь Я Сам».
- source_word: ἐκεῖ καὶ
  choice: там будет и
  rationale: 'Конструкция сохраняет как указание места «там», так и добавочное значение καί: слуга также будет там.'
- source_word: τιμήσει
  choice: почтит
  rationale: Глагол обещает оказание чести; «почтит» точно, кратко и сохраняет будущее время.
- source_word: ὁ πατήρ
  choice: Отец
  rationale: Греческий текст говорит «Отец», не добавляя притяжательного «Мой»; перевод не вносит отсутствующего уточнения.
- source_word: τις
  choice: кто
  rationale: В условной конструкции русское «если кто» естественно передаёт неопределённое и обобщённое значение без ограничения по полу.
- source_word: αὐτὸν
  choice: того
  rationale: Указательное «того» ясно отсылает к предшествующему «кто» и позволяет естественно передать греческое единственное число без искусственного указания на мужской пол.
theological_decisions:
- issue: Обобщённое обозначение человека в условных предложениях
  choice: Использовать естественную русскую корреляцию «если кто… того», пояснив обобщённое значение в сноске.
  alternative: 'Передать мужским существительным и местоимением: «если кто… его».'
  rationale: Греческий текст использует неопределённое τις и согласованное с ним мужское единственное число, однако в русском «кто… того» грамматически естественно, относится к человеку любого пола и сохраняет единственное число. Сноска делает форму источника прозрачной.
- issue: Характер обещанной Отцом чести
  choice: Передать просто «почтит Отец», не уточняя вид или время этой чести.
  alternative: Истолковать честь как небесную награду или эсхатологическое прославление.
  rationale: Стих обещает Божью честь служащему Иисусу, но здесь не определяет её конкретную форму; перевод сохраняет широту и богословское напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавные буквы в «Мне», «Мной», «Я», «Мой» отражают традиционное почтительное оформление речи об Иисусе; «Отец» оформлено как титул. Порядок слов в последней фразе слегка маркирован («того почтит Отец»), чтобы ясно сохранить соотнесение условного и главного предложений.
