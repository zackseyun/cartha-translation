source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ λαβοῦσα λίτραν μύρου νάρδου πιστικῆς πολυτίμου ἤλειψεν τοὺς πόδας τοῦ Ἰησοῦ καὶ ἐξέμαξεν ταῖς θριξὶν αὐτῆς τοὺς πόδας αὐτοῦ· ἡ δὲ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/003.yaml
  text: Then Mary took a litra of costly pure nard perfume[a], anointed Jesus's feet, and wiped his feet with her hair[c][b]. And the house was filled with the fragrance of the perfume.
translation:
  language: ru
  text: Тогда Мария взяла литру[a] очень дорогого благовонного масла из чистого[b] нарда[c], помазала ноги Иисуса и вытерла их своими волосами. Дом наполнился ароматом масла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Литра — римская мера веса, примерно 327 граммов, то есть около трети килограмма.
    reason: cultural_note
  - marker: b
    text: 'Или: «настоящего». Точное значение греческого слова, переведённого как «чистого» (πιστικῆς), остаётся предметом споров.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «спикенард».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Тогда
  rationale: Передаёт продолжение повествования и связь с предыдущей сценой без излишне сильного логического вывода.
- source_word: λαβοῦσα
  choice: взяла
  rationale: Аористное причастие естественно передано личной формой русского глагола в последовательности повествовательных действий.
- source_word: λίτραν
  choice: литру
  rationale: Сохранено название древнеримской меры веса; её приблизительная величина поясняется в сноске.
- source_word: μύρου
  choice: благовонного масла
  rationale: В данном контексте μύρον обозначает ароматическое масло или мазь для помазания; этот вариант ясен современному читателю и согласуется с упоминанием аромата.
- source_word: νάρδου
  choice: нарда
  rationale: Сохранено конкретное название дорогого ароматического вещества растительного происхождения.
- source_word: πιστικῆς
  choice: чистого
  rationale: Наиболее вероятно обозначает качество и неподдельность нарда, однако лексическое значение спорно, что отмечено в сноске.
- source_word: πολυτίμου
  choice: очень дорогого
  rationale: Передаёт высокую стоимость, подчёркнутую исходным словом.
- source_word: ἤλειψεν
  choice: помазала
  rationale: Точно передаёт нанесение благовонного масла, сохраняя возможный символический оттенок, но не навязывая богословского истолкования.
- source_word: τοὺς πόδας τοῦ Ἰησοῦ
  choice: ноги Иисуса
  rationale: Прямое и естественное соответствие исходной конструкции.
- source_word: ἐξέμαξεν ταῖς θριξὶν αὐτῆς
  choice: вытерла их своими волосами
  rationale: Передаёт действие и инструментальный дательный падеж естественной русской конструкцией; местоимение ясно отсылает к ногам Иисуса.
- source_word: ἡ δὲ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου
  choice: Дом наполнился ароматом масла
  rationale: Сохраняет образ распространившегося по дому запаха и звучит естественно по-русски.
theological_decisions:
- issue: Возможное богословское переосмысление действия помазания
  choice: Глагол ἤλειψεν передан как «помазала» в его прямом повествовательном смысле.
  alternative: «нанесла масло на ноги»
  rationale: «Помазала» лексически точно и сохраняет возможный символический смысл эпизода, не превращая его прямо в утверждение о таинстве, царском посвящении или иной доктрине.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Древняя мера сохранена с пояснением. Термин «благовонное масло» понятнее современному читателю, чем традиционное «миро», а традиционное обозначение приведено в сноске. Местоимения, относящиеся к Иисусу, не выделены прописной буквой, поскольку такое выделение отсутствует в греческом тексте и является поздней редакционной традицией.
