  text: λέγει ⸀δὲ ⸂Ἰούδας ὁ Ἰσκαριώτης εἷς τῶν μαθητῶν αὐτοῦ⸃, ὁ μέλλων αὐτὸν παραδιδόναι·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/004.yaml
  text: But Judas Iscariot[a], one of his disciples—the one who was about to betray him—said,
translation:
  language: ru
  text: 'Но Иуда Искариот, один из Его учеников, который собирался предать Его[a], сказал:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «который собирался передать Его».'
    reason: Лексическая альтернатива для παραδιδόναι, сохраняющая основной смысл передачи в чужие руки.
lexical_decisions:
- source_word: λέγει
  choice: сказал
  rationale: Греческое историческое настоящее естественно передаётся в русском повествовании прошедшим временем.
- source_word: δὲ
  choice: Но
  rationale: Частица обозначает лёгкое противопоставление поступку Марии и вводит последующее возражение.
- source_word: Ἰούδας ὁ Ἰσκαριώτης
  choice: Иуда Искариот
  rationale: Использована закрепившаяся в русском языке форма имени.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: один из Его учеников
  rationale: Слово «ученик» точно сохраняет отношения учителя и ученика, существенные для евангельского повествования.
- source_word: ὁ μέλλων
  choice: который собирался
  rationale: Оборот передаёт предстоящее действие; «собирался» звучит естественно по-русски и сохраняет направленность к будущему.
- source_word: παραδιδόναι
  choice: предать
  rationale: В контексте поступка Иуды глагол обозначает не просто передачу Иисуса властям, но предательство; более буквальный вариант приведён в сноске.
theological_decisions:
- issue: Передача παραδιδόναι применительно к поступку Иуды по отношению к Иисусу
  choice: предать
  alternative: выдать; передать
  rationale: «Предать» естественно выражает нравственный и повествовательный смысл поступка Иуды. Вариант «выдать» лучше сохраняет конкретный смысл передачи Иисуса властям, поэтому отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; повествовательный исторический презенс передан прошедшим временем. Структура стиха сохранена как ввод к прямой речи в следующем стихе. Местоимение «Его» написано с прописной буквы в соответствии с распространённой русской библейской издательской традицией.
