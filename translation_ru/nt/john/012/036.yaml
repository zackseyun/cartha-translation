id: JHN.12.36
reference: John 12:36
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀ὡς τὸ φῶς ἔχετε, πιστεύετε εἰς τὸ φῶς, ἵνα υἱοὶ φωτὸς γένησθε. Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/036.yaml
  text: While you have the light[a], believe in the light, so that you may become sons of light. Jesus spoke these things[b], and he departed and hid from them.
translation:
  language: ru
  text: Пока у вас есть свет, верьте в свет, чтобы стать сынами света[a]. Иисус сказал это[b], затем ушёл и скрылся от них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «детьми света». В греческом тексте буквально: «сынами света» — это образное выражение о людях, которых характеризует свет.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «Сказав это, Иисус ушёл и скрылся от них».'
    reason: syntactic_alternative
lexical_decisions:
- source_word: ὡς τὸ φῶς ἔχετε
  choice: Пока у вас есть свет
  rationale: 'ὡς с настоящим временем здесь имеет временной смысл: «пока / пока ещё». Формулировка сохраняет срочность призыва и образ света.'
- source_word: πιστεύετε εἰς τὸ φῶς
  choice: верьте в свет
  rationale: Прямо передаёт характерное для Иоанна сочетание πιστεύω εἰς, не заменяя веру более узким толкованием вроде одного лишь доверия.
- source_word: ἵνα υἱοὶ φωτὸς γένησθε
  choice: чтобы стать сынами света
  rationale: «Чтобы» передаёт целевое значение ἵνα, «стать» — значение γίνομαι, а «сынами света» сохраняет мужскую форму и образный семитский оборот оригинала.
- source_word: Ταῦτα ἐλάλησεν Ἰησοῦς
  choice: Иисус сказал это
  rationale: По-русски «сказал это» естественнее буквального «говорил это» и точно передаёт ссылку на предшествующие слова.
- source_word: ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν
  choice: затем ушёл и скрылся от них
  rationale: Два согласованных глагола естественно передают последовательность действия аористного причастия и основного глагола; «скрылся» уместно отражает средне-непереходное значение формы ἐκρύβη.
theological_decisions:
- issue: Образное выражение υἱοὶ φωτός
  choice: сыны света
  alternative: дети света
  rationale: Основной текст сохраняет прямо выраженное в греческом мужское существительное υἱοί и традиционный библейский образ. В сноске поясняется, что идиома относится ко всем людям, которых характеризует свет, а не только к мужчинам.
- issue: Иоанново выражение πιστεύω εἰς
  choice: верьте в свет
  alternative: доверьтесь свету
  rationale: «Верить в» сохраняет богословски значимую и характерную для Евангелия от Иоанна конструкцию, не сводя её к одному оттенку доверия.
translation_notes:
  register: Современный литературный русский язык; речь ясная и достойная, без архаизмов. Сохранены ключевые для Иоанна повторы слова «свет» и образ «сынов света».
