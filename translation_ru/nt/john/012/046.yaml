  source_fidelity: 'Текст точно передаёт греческий оригинал: «Я пришёл» адекватно выражает ἐλήλυθα в естественном русском прошедшем совершенного вида; «в мир как свет» сохраняет направление εἰς τὸν κόσμον и качественное безартиклевое φῶς; «каждый, кто верит в Меня» верно передаёт πᾶς ὁ πιστεύων εἰς ἐμέ; «не остался во тьме» естественно выражает целевой отрицательный результат μὴ μείνῃ.'
