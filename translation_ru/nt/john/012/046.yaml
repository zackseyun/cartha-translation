source:
  edition: SBLGNT
  text: ἐγὼ φῶς εἰς τὸν κόσμον ἐλήλυθα, ἵνα πᾶς ὁ πιστεύων εἰς ἐμὲ ἐν τῇ σκοτίᾳ μὴ μείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/046.yaml
  text: I have come into the world as light[b][a], so that everyone who believes in me may not remain in the darkness.
translation:
  language: ru
  text: Я пришёл в мир как свет, чтобы каждый, кто верит в Меня, не остался во тьме.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φῶς
  choice: как свет
  rationale: 'Безартиклевое φῶς имеет качественный смысл: Иисус приходит как свет. Русская конструкция естественно сохраняет метафору и не требует неопределённого артикля или примечания.'
- source_word: εἰς τὸν κόσμον
  choice: в мир
  rationale: Предлог εἰς с винительным выражает направленность движения; «в мир» естественно передаёт смысл пришествия.
- source_word: ἐλήλυθα
  choice: Я пришёл
  rationale: Греческий перфект обозначает совершившееся пришествие с сохраняющимся результатом. В современном русском языке прошедшее совершенного вида передаёт это естественнее буквального «Я пришедший» или добавочного толкования.
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт цель пришествия кратко и естественно.
- source_word: πᾶς ὁ πιστεύων
  choice: каждый, кто верит
  rationale: Передаёт общий и всеохватный класс людей, обозначенный πᾶς с субстантивированным причастием настоящего времени.
- source_word: πιστεύων εἰς ἐμέ
  choice: верит в Меня
  rationale: Стандартное и естественное русское выражение личной веры, направленной на Иисуса.
- source_word: ἐν τῇ σκοτίᾳ
  choice: во тьме
  rationale: «Тьма» сохраняет устойчивую и богословски насыщенную метафору Иоанна; русский язык не нуждается в артикле для обозначения этой узнаваемой сферы.
- source_word: μὴ μείνῃ
  choice: не остался
  rationale: 'Совершенный вид естественно соответствует аористу сослагательного наклонения после ἵνα и выражает цель: верующий не должен продолжить пребывание во тьме.'
theological_decisions:
- issue: Христологическое самоопределение через образ света
  choice: «Я пришёл в мир как свет»
  alternative: «Я, свет, пришёл в мир»; «Я пришёл принести миру свет»
  rationale: Выбранный вариант сохраняет отождествление Иисуса со светом и функцию света, не превращая метафору в поясняющий пересказ и не усиливая синтаксис сверх греческого текста.
- issue: Объём выражения πᾶς ὁ πιστεύων
  choice: «каждый, кто верит»
  alternative: «всякий верующий»; «кто верит»
  rationale: Формулировка сохраняет универсальный охват класса верующих, не привнося позиции в споры о природе или происхождении веры.
- issue: Цель и результат пришествия
  choice: «чтобы… не остался во тьме»
  alternative: «чтобы… не пребывал во тьме»
  rationale: Глагол «остался» подчёркивает выход из прежнего состояния и естественно передаёт отрицательную целевую конструкцию, не утверждая механизмы спасения, которых стих не объясняет.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-сдержанный. Заглавная буква в местоимении «Меня» следует принятой русской библейской традиции. Синтаксис близок к греческому, но не калькирован.
