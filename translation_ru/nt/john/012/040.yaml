source:
  edition: SBLGNT
  text: Τετύφλωκεν αὐτῶν τοὺς ὀφθαλμοὺς καὶ ⸀ἐπώρωσεν αὐτῶν τὴν καρδίαν, ἵνα μὴ ἴδωσιν τοῖς ὀφθαλμοῖς καὶ νοήσωσιν τῇ καρδίᾳ καὶ ⸀στραφῶσιν, καὶ ⸀ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/040.yaml
  text: He has blinded their eyes and hardened their heart[a], so that they may not see with their eyes and understand with their heart and turn[c][b], and I would heal them.
translation:
  language: ru
  text: Он ослепил их глаза и ожесточил их сердце, чтобы они не видели глазами, не понимали сердцем и не обратились[a], и Я исцелил бы их[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не возвратились»; греческую форму можно также передать как «не были обращены».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и Я исцелю их». В греческом употреблена форма будущего времени; русское «исцелил бы» передаёт связь с возможным обращением в этой конструкции.'
    reason: lexical_alternative
  - marker: c
    text: Здесь цитируется Исайя 6:10.
    reason: cross_reference
lexical_decisions:
- source_word: Τετύφλωκεν
  choice: ослепил
  rationale: Греческий перфект описывает совершённое действие с сохраняющимся результатом. В русском контексте совершенный вид «ослепил» естественно передаёт это состояние без тяжеловесной конструкции.
- source_word: ἐπώρωσεν
  choice: ожесточил
  rationale: Глагол означает сделать нечувствительным, огрубить или ожесточить. «Ожесточил» сохраняет образ судебного ожесточения и хорошо сочетается с «сердцем».
- source_word: καρδίαν / καρδίᾳ
  choice: сердце / сердцем
  rationale: Слово обозначает внутренний центр мысли и воли. Буквальное «сердце» сохраняет библейскую антропологию, а познавательный оттенок выражен глаголом «понимали».
- source_word: ἵνα μὴ
  choice: чтобы ... не
  rationale: Конструкция может выражать цель или результат. Русское «чтобы ... не» сохраняет эту напряжённость, не сводя её только к предостережению.
- source_word: ἴδωσιν τοῖς ὀφθαλμοῖς
  choice: видели глазами
  rationale: Сохранены конкретный образ и параллелизм с выражением «понимали сердцем».
- source_word: νοήσωσιν
  choice: понимали
  rationale: Глагол обозначает осмысление и постижение; «понимали» естественно передаёт его значение в данном параллелизме.
- source_word: στραφῶσιν
  choice: обратились
  rationale: Форма может пониматься как пассивная или как непереходное «повернулись, возвратились». «Обратились» естественно передаёт пророческий призыв к возвращению, не вводя явно названного объекта.
- source_word: ἰάσομαι
  choice: Я исцелил бы их
  rationale: Греческая форма — будущее время, однако в зависимости от предшествующей конструкции исцеление представлено как следствие возможного обращения. Русское условное наклонение ясно передаёт эту связь; формальная альтернатива отмечена в сноске.
- source_word: αὐτῶν τὴν καρδίαν
  choice: их сердце
  rationale: В греческом стоит единственное число с собирательным значением. Оно сохранено, чтобы передать корпоративный образ цитаты.
theological_decisions:
- issue: Божественное действие в ослеплении и ожесточении
  choice: 'Сохранён явный субъект: «Он ослепил... и ожесточил...»'
  alternative: Безличная или страдательная конструкция, смягчающая прямое указание на действующего
  rationale: Греческие глаголы имеют подразумеваемое единственное действующее лицо в цитате из Исайи. Перевод сохраняет трудное богословское напряжение судебного ожесточения, а не устраняет его.
- issue: Значение στραφῶσιν в контексте обращения
  choice: «обратились»
  alternative: «были обращены» или «возвратились»
  rationale: «Обратились» допускает значение возвращения к Богу, но не навязывает узкую конфессиональную формулу и сохраняет возможность непереходного понимания греческой страдательной формы.
- issue: Связь обращения и исцеления
  choice: «и Я исцелил бы их»
  alternative: «и Я исцелю их»
  rationale: Основной текст передаёт исцеление как неосуществившееся следствие возможного обращения, не отрицая будущей формы греческого глагола; её более формальное прочтение дано в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого параллелизма. Местоимения «Он» и «Я» написаны с прописной буквы как указания на Бога в непосредственном контексте цитаты. Тире перед последней частью помогает ясно отделить возможное исцеление от ряда отрицательных придаточных и избежать ошибочного прочтения «не исцелил бы».
