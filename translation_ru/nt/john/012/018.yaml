  text: διὰ τοῦτο ⸀καὶ ὑπήντησεν αὐτῷ ὁ ὄχλος ὅτι ⸀ἤκουσαν τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/018.yaml
  text: For this reason also the crowd went to meet him[b][a], because they heard that he had done this sign.
translation:
  language: ru
  text: Поэтому толпа и пошла Ему навстречу[a], услышав, что Он совершил это знамение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «толпа встретила Его». Греческий глагол обозначает движение навстречу кому-либо.'
    reason: lexical_alternative
  - marker: b
    text: '«Знамение» — характерное для Иоанна обозначение чудесного деяния, указывающего на личность и миссию Иисуса; возможный перевод: «чудо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Передаёт явную причинно-следственную связь с предшествующим рассказом естественным современным русским оборотом.
- source_word: καὶ
  choice: и
  rationale: Сохраняет присоединительное значение частицы; в сочетании «поэтому… и» оно идиоматично выражает обусловленность действия названной причиной.
- source_word: ὑπήντησεν αὐτῷ
  choice: вышел Ему навстречу
  rationale: Передаёт заложенное в глаголе направленное движение для встречи; местоимение относится к Иисусу.
- source_word: ὁ ὄχλος
  choice: народ
  rationale: В данном контексте обозначает множество собравшихся людей; «народ» звучит естественно и достойно, не подразумевая формально организованной группы.
- source_word: ὅτι ἤκουσαν
  choice: услышав, что
  rationale: Русский деепричастный оборот ясно и естественно передаёт причинное значение ὅτι и предшествующее получение известия.
- source_word: τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον
  choice: что Он совершил это знамение
  rationale: «Совершил» передаёт завершённое действие перфектного инфинитива, а «это» указывает на конкретное знамение, упомянутое в контексте.
- source_word: τὸ σημεῖον
  choice: знамение
  rationale: Сохраняет характерный для Иоанна смысл чудесного деяния как указания на личность и миссию Иисуса, не сводя его лишь к чуду.
theological_decisions:
- issue: Передача иоанновского σημεῖον
  choice: знамение
  alternative: чудо
  rationale: «Знамение» сохраняет указующий, откровенный смысл термина в Евангелии от Иоанна; «чудо» точнее подчёркивало бы необычайность события, но ослабило бы этот смысл.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и повествовательная. Конструкция «поэтому… и» сохраняет связь с предыдущим контекстом. Прописные буквы в местоимениях, относящихся к Иисусу, соответствуют принятому русскому библейскому регистру.
