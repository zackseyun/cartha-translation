  text: Ἰησοῦς δὲ ἔκραξεν καὶ εἶπεν· Ὁ πιστεύων εἰς ἐμὲ οὐ πιστεύει εἰς ἐμὲ ἀλλὰ εἰς τὸν πέμψαντά με,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/044.yaml
  text: But Jesus cried out and said[a], “The one who believes in me does not believe in me[b], but in the one who sent me,”
translation:
  language: ru
  text: 'Но Иисус громко возгласил: «Кто верит в Меня[a], верит не в Меня, а в Пославшего Меня[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Верующий в Меня».'
    reason: Лексическая альтернатива, более формально отражающая субстантивированное причастие ὁ πιστεύων.
  - marker: b
    text: Эти слова не отрицают, что вера обращена к Иисусу; они показывают, что вера в Него неотделима от веры в Отца, Который Его послал.
    reason: Контекстуальное пояснение, предотвращающее ошибочное прочтение при сохранении напряжённой формулировки оригинала.
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт переход с оттенком противопоставления предыдущему повествованию и естественно звучит по-русски.
- source_word: ἔκραξεν καὶ εἶπεν
  choice: громко возгласил
  rationale: Кратко и естественно передаёт громкое публичное провозглашение; отдельное «и сказал» в русском было бы избыточным.
- source_word: Ὁ πιστεύων
  choice: Кто верит
  rationale: Передаёт обобщённое субстантивированное причастие без тяжеловесного «тот, кто верит» и сохраняет общий, продолжающийся характер высказывания.
- source_word: πιστεύων / πιστεύει εἰς
  choice: верит в
  rationale: Устоявшееся и точное соответствие конструкции πιστεύω εἰς в богословской и современной литературной русской речи; повтор глагола сохраняет структуру оригинала.
- source_word: τὸν πέμψαντά με
  choice: Пославшего Меня
  rationale: Сохраняет причастную конструкцию и намеренно не уточняет в основном тексте, что речь об Отце.
theological_decisions:
- issue: Фраза «не в Меня верит, но в Пославшего Меня» может быть понята как отрицание веры в Иисуса.
  choice: Напряжённая формулировка оригинала сохранена без добавления слова «только».
  alternative: «Верит не только в Меня, но и в Пославшего Меня» или прямое уточнение «в Отца».
  rationale: В греческом тексте нет слов «только» и «Отец». Высказывание связывает веру в Иисуса с верой в Пославшего Его; перевод не должен устранять эту богословскую напряжённость поясняющей вставкой.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным звучанием. Прописные буквы в местоимениях «Меня» и в причастии «Пославшего» соответствуют традиционному русскому библейскому регистру; синтаксис остаётся компактным и пригодным для публичного чтения.
