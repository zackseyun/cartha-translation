  text: εὑρὼν δὲ ὁ Ἰησοῦς ὀνάριον ἐκάθισεν ἐπ’ αὐτό, καθώς ἐστιν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/014.yaml
  text: 'Then Jesus[a], having found a young donkey, sat on it, just as it is written:'
translation:
  language: ru
  text: 'Иисус же, найдя молодого осла[a], сел на него, как написано:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ослёнка». Греческое слово ὀνάριον означает осла, часто молодого.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν
  choice: найдя
  rationale: Деепричастие естественно передаёт аористное причастие и указывает на действие, предшествующее основному глаголу.
- source_word: δὲ
  choice: же
  rationale: Частица служит мягкой связкой в повествовании; «же» сохраняет связь с предыдущим контекстом, не создавая резкого противопоставления.
- source_word: ὀνάριον
  choice: молодого осла
  rationale: Уменьшительная форма обозначает осла, нередко молодого; такой перевод понятен современному читателю и не добавляет излишней конкретики.
- source_word: ἐκάθισεν ἐπ’ αὐτό
  choice: сел на него
  rationale: Прямо и естественно передаёт греческое выражение, не заменяя его более истолковывающим «взошёл верхом».
- source_word: καθώς ἐστιν γεγραμμένον
  choice: как написано
  rationale: Естественная русская формула введения цитаты из Писания; передаёт соответствие действия написанному и сохраняет результативный смысл перфекта.
- source_word: ὁ Ἰησοῦς
  choice: Иисус
  rationale: В русском языке артикль при личном имени не передаётся.
theological_decisions:
- issue: Связь действия Иисуса с последующей цитатой из Писания
  choice: Представить действие Иисуса как соответствующее написанному, не уточняя в самом переводе мотив его поступка.
  alternative: Передать более истолковательно, явно обозначив намеренное исполнение пророчества.
  rationale: Стих сообщает о действии, а затем вводит цитату формулой «как написано»; он утверждает соответствие Писанию, но прямо не формулирует мотив.
translation_notes:
  register: Современный литературный русский язык; формулировка проста и достойна, синтаксис сохраняет последовательность исходного текста. Местоимение «него» согласовано с русским словом «осёл».
