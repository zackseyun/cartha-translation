  text: ἐποίησαν οὖν αὐτῷ δεῖπνον ἐκεῖ, καὶ ἡ Μάρθα διηκόνει, ὁ δὲ Λάζαρος εἷς ἦν ⸀ἐκ τῶν ἀνακειμένων σὺν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/002.yaml
  text: So they made a dinner for him there[a], and Martha was serving, but Lazarus was one of those reclining at the table with him.
translation:
  language: ru
  text: Итак, там устроили для Него ужин. Марфа прислуживала, а Лазарь был одним из возлежавших с Ним за столом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «одним из возлежавших с Ним». Во время торжественной трапезы было принято не сидеть, а возлежать у стола.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐποίησαν
  choice: устроили
  rationale: В сочетании с δεῖπνον глагол означает приготовить или устроить трапезу; «устроили ужин» естественно по-русски и не уточняет не названных в тексте устроителей.
- source_word: οὖν
  choice: не передано отдельным словом
  rationale: Связь с предыдущим повествованием естественно выражена самим продолжением рассказа; буквальное «итак» здесь звучало бы излишне логически, а «тогда» могло бы усилить временное значение.
- source_word: αὐτῷ
  choice: для Него
  rationale: Дательный обозначает лицо, в честь или ради которого была устроена трапеза; местоимение относится к Иисусу.
- source_word: δεῖπνον
  choice: ужин
  rationale: Слово обозначает главную, обычно вечернюю трапезу; «ужин» — ясное современное соответствие без преувеличенного оттенка слова «пир».
- source_word: ἐκεῖ
  choice: там
  rationale: Локативное наречие отсылает к Вифании, названной в контексте.
- source_word: διηκόνει
  choice: прислуживала
  rationale: Имперфект передаёт продолжающееся действие во время трапезы; здесь речь идёт об обслуживании гостей, а не о церковном служении.
- source_word: δὲ
  choice: а
  rationale: Русское «а» естественно передаёт мягкое сопоставление между Марфой, которая прислуживала, и Лазарем, который находился среди участников трапезы.
- source_word: εἷς ἦν ἐκ
  choice: был одним из
  rationale: Сохраняет греческую конструкцию принадлежности к группе и не превращает её в простое указание на присутствие.
- source_word: ἀνακειμένων
  choice: возлежавших … за столом
  rationale: Сохраняет культурно значимую позу участников торжественной трапезы; добавление «за столом» делает значение понятным современному читателю.
- source_word: σὺν αὐτῷ
  choice: с Ним
  rationale: Передаёт совместное участие в трапезе; местоимение относится к Иисусу.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Возлежавших» сохранено ради историко-культурной точности и разъяснено в сноске; заглавные формы местоимений, относящихся к Иисусу, соответствуют принятому русскому библейскому регистру.
