  text: τοῦτο δὲ ἔλεγεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/033.yaml
  text: He was saying this to signify what kind of death he was about to die[a].
translation:
  language: ru
  text: Он говорил это, давая понять, какой смертью Ему предстояло умереть[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каким образом Ему предстояло умереть». Греческое выражение может подчёркивать способ смерти.'
    reason: Лексико-синтаксическая альтернатива для ποίῳ θανάτῳ.
lexical_decisions:
- source_word: τοῦτο
  choice: это
  rationale: Указательное местоимение среднего рода в единственном числе отсылает к предшествующим словам Иисуса; естественный русский эквивалент — «это».
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Здесь δέ имеет слабую связующую функцию. В русском повествовании связь естественно передаётся последовательностью предложений; «но» создало бы излишнее противопоставление, а «теперь» добавило бы временной оттенок.
- source_word: ἔλεγεν
  choice: говорил
  rationale: Имперфект передаёт действие в прошедшем времени с контекстуально-развёрнутым аспектом; русское несовершенное «говорил» сохраняет этот оттенок естественно.
- source_word: σημαίνων
  choice: давая понять
  rationale: Причастие обозначает указание или косвенное сообщение смысла. «Давая понять» естественно по-русски и сохраняет непрямой характер указания.
- source_word: ποίῳ θανάτῳ
  choice: какой смертью
  rationale: Дательный падеж указывает на вид и способ смерти. Русский творительный «какой смертью» одновременно сохраняет вопрос о характере и способе смерти.
- source_word: ἤμελλεν
  choice: Ему предстояло
  rationale: μέλλω указывает на предстоящее будущее, не требуя само по себе усиленного перевода «было суждено». Безличная конструкция естественна в современном литературном русском.
- source_word: ἀποθνῄσκειν
  choice: умереть
  rationale: Дополнительный инфинитив при ἤμελλεν; совершенный вид естественно обозначает предстоящее наступление смерти.
theological_decisions:
- issue: Следует ли прямо назвать распятие
  choice: Сохранить косвенную формулировку «какой смертью Ему предстояло умереть»
  alternative: «что Ему предстояло умереть на кресте» или «как Его казнят»
  rationale: Евангелист говорит о виде или способе смерти, но в данном стихе прямо не называет распятие. Его уточнение в основном тексте вышло бы за рамки греческой формулировки.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Местоимение «Ему» написано с прописной буквы согласно распространённой русской библейской издательской традиции. Формулировка сохраняет непрямое указание исходного текста и не называет распятие явно.
