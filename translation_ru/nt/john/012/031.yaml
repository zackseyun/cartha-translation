id: JHN.12.31
reference: John 12:31
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: νῦν κρίσις ἐστὶν τοῦ κόσμου τούτου, νῦν ὁ ἄρχων τοῦ κόσμου τούτου ἐκβληθήσεται ἔξω·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/031.yaml
  text: Now is the judgment of this world[b][a]; now the ruler of this world will be cast out.
translation:
  language: ru
  text: Теперь настал суд над этим миром; теперь правитель этого мира будет изгнан вон.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «правителем этого мира» обычно понимается Сатана; возможный перевод титула — «князь этого мира».
    reason: Указывает распространённое контекстуальное отождествление, не внося его в основной текст, и сохраняет традиционный лексический вариант для ἄρχων.
lexical_decisions:
- source_word: νῦν
  choice: теперь
  rationale: Повторено в обеих частях стиха, чтобы сохранить временной акцент и параллелизм греческого текста.
- source_word: κρίσις ἐστὶν τοῦ κόσμου τούτου
  choice: настал суд над этим миром
  rationale: Родительный падеж допускает сжатую конструкцию «суд этого мира», но по-русски она может звучать так, будто мир сам судит; «суд над этим миром» естественно передаёт мир как объект решающего суда.
- source_word: κόσμου τούτου
  choice: этим миром / этого мира
  rationale: Сохранено указательное значение τούτου и характерное для Иоанна выражение «этот мир».
- source_word: ἄρχων
  choice: правитель
  rationale: Современное и понятное обозначение носителя власти; не вводит прямо имя того, кого подразумевает титул.
- source_word: ἐκβληθήσεται ἔξω
  choice: будет изгнан вон
  rationale: Сохранены будущее время, страдательный залог и усиленное значение удаления, создаваемое сочетанием глагола с ἔξω.
theological_decisions:
- issue: Кого обозначает «правитель этого мира»
  choice: В основном тексте сохранён титул без прямого отождествления.
  alternative: Сатана / дьявол; олицетворённый порядок этого мира.
  rationale: В контексте Евангелия от Иоанна выражение обычно относят к Сатане, однако греческий текст употребляет титул, а не имя; перевод не устраняет эту формальную сдержанность.
- issue: Направленность суда
  choice: 'Мир представлен объектом суда: «суд над этим миром».'
  alternative: «Суд этого мира» — формально более близкая, но по-русски неоднозначная конструкция.
  rationale: Контекст и обычное понимание родительного оборота указывают на суд, совершаемый над миром, при этом слово «осуждение» не вводится, чтобы не сужать значение κρίσις.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Повтор «теперь» сохраняет риторический параллелизм оригинала; «настал суд» звучит естественнее буквального «теперь есть суд».
