base_translation:
  language: en
  yaml_path: translation/nt/john/012/007.yaml
  text: So Jesus said[a], “Leave her alone[b], so that she may keep it for the day of my burial.”
translation:
  language: ru
  text: 'Тогда Иисус сказал: «Оставь её в покое, чтобы она сохранила это[a] ко дню Моего погребения[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Оставь её в покое: она сохранила это для дня Моего погребения». Некоторые понимают эту фразу как описание того, что она уже сделала, а не того, что ей ещё предстоит сделать.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Оставь её в покое, чтобы она сохранила это до дня Моего погребения». Греческую конструкцию можно понять и в более явно временном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Тогда
  rationale: Передаёт продолжение повествования и связь с предыдущими словами; в данном контексте звучит естественнее, чем более строго логическое «поэтому».
- source_word: Ἄφες αὐτήν
  choice: Оставь её в покое
  rationale: Единственное число повелительного наклонения сохранено; выражение естественно передаёт требование прекратить мешать женщине или упрекать её.
- source_word: ἵνα
  choice: чтобы
  rationale: Сохраняет целевую или результативную связь между повелением и последующим действием, не устраняя синтаксическую трудность фразы.
- source_word: εἰς τὴν ἡμέραν
  choice: ко дню
  rationale: Указывает на будущий день как на цель сохранения и не делает временное значение «до дня» единственно возможным.
- source_word: ἐνταφιασμοῦ
  choice: погребения
  rationale: Точный, ясный и стилистически достойный эквивалент, охватывающий приготовление к положению тела в гробницу и само погребение.
- source_word: τηρήσῃ
  choice: она сохранила
  rationale: Форма сослагательного наклонения после ἵνα передана целевой конструкцией «чтобы она сохранила»; значение — сберечь или оставить для определённого случая.
- source_word: αὐτό
  choice: это
  rationale: Сохраняет местоименную форму оригинала и отсылает к благовонию без добавления отсутствующего в стихе существительного.
theological_decisions:
- issue: Связь помазания с предстоящим погребением Иисуса
  choice: Передать слова как указание позволить ей сохранить это ко дню погребения Иисуса.
  alternative: '«Оставь её в покое: она сохранила это для дня Моего погребения» или «Оставь её в покое, чтобы она сохранила это до дня Моего погребения».'
  rationale: Греческая конструкция допускает разные синтаксические понимания. Основной текст сохраняет направленность к предстоящему погребению, а примечания фиксируют реальные альтернативы, не разрешая неоднозначность богословским толкованием.
translation_notes:
  register: Современный литературный русский язык с ясным и достойным звучанием. Единственное число «оставь» сохраняет грамматику греческого текста. Прописная буква в «Моего» следует принятому благоговейному библейскому оформлению, не меняя смысла.
