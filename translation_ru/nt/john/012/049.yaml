base_translation:
  language: en
  yaml_path: translation/nt/john/012/049.yaml
  text: For I have not spoken from myself[b][a], but the Father who sent me has himself given me a command as to what I should say and what I should speak.
translation:
  language: ru
  text: 'Ведь Я говорил не от Себя[a], но Отец, пославший Меня, Сам дал Мне повеление: что сказать и что говорить[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не по Своей инициативе»; «не по Своей власти».'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте употреблены два разных глагола: «сказать» и «говорить»; перевод сохраняет это различие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐμαυτοῦ
  choice: не от Себя
  rationale: Близко передаёт греческое выражение и сохраняет мысль о том, что Иисус говорит не независимо от Отца; вариант «не по собственной воле» был бы более истолковывающим.
- source_word: οὐκ ἐλάλησα
  choice: Я говорил не
  rationale: Русское прошедшее время естественно обобщает служение и речь Иисуса до этого момента; порядок слов приспособлен к конструкции «не от Себя».
- source_word: ὁ πέμψας με πατὴρ
  choice: пославший Меня Отец
  rationale: Причастный оборот естественно передаёт субстантивированное греческое причастие; «Отец» оформлено как божественное наименование.
- source_word: αὐτός
  choice: Сам
  rationale: Сохраняет выраженное в греческом тексте усиление.
- source_word: ἐντολήν
  choice: повеление
  rationale: Передаёт обязательную и властную силу слова, звуча при этом естественно в современном литературном русском языке.
- source_word: δέδωκεν
  choice: дал
  rationale: Русский совершенный вид передаёт завершённое действие с сохраняющимся результатом без неестественной попытки формально воспроизвести греческий перфект.
- source_word: τί εἴπω
  choice: что сказать
  rationale: Инфинитив после слова «повеление» естественно передаёт косвенный вопрос с направляющей силой.
- source_word: τί λαλήσω
  choice: что произнести
  rationale: Выбор сохраняет отличие от предшествующего εἴπω и избегает полного лексического сглаживания двух греческих глаголов.
theological_decisions:
- issue: Отношение речи Сына к повелению Отца
  choice: Иисус говорит не независимо от Отца, но в соответствии с данным Им повелением.
  alternative: Передать выражение так, будто Иисус лишь обычный человеческий пророк, либо будто Он действует независимо, хотя и согласованно с Отцом.
  rationale: Формулировка сохраняет явную в стихе зависимость служения и речи Иисуса от пославшего Его Отца, не делая дополнительных выводов о природе Сына.
- issue: Передача πατήρ
  choice: Отец
  alternative: отец
  rationale: В контексте Евангелия от Иоанна это наименование Бога и отношение Иисуса к Нему, поэтому уместна прописная буква.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Местоимения, относящиеся к Иисусу и Отцу, написаны с прописной буквы согласно распространённой русской библейской традиции. Повтор исходного текста сохранён, но два глагола разведены как «сказать» и «произнести».
