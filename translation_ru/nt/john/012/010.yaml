  source_fidelity: «Поэтому первосвященники решили убить и Лазаря» точно передаёт решение, выраженное ἐβουλεύσαντο, целевое/содержательное ἵνα с инфинитивом «убить», а также добавочное καί («и Лазаря»). «Поэтому» приемлемо передаёт связующую роль δέ в данном повествовательном контексте и согласуется с английским audit trail («So»), не меняя смысла.
