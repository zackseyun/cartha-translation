  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐβουλεύσαντο δὲ οἱ ἀρχιερεῖς ἵνα καὶ τὸν Λάζαρον ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/010.yaml
  text: So the chief priests decided to kill Lazarus also,[a]
translation:
  language: ru
  text: Поэтому первосвященники решили убить и Лазаря.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «замыслили убить также и Лазаря».'
    reason: Лексическая альтернатива для ἐβουλεύσαντο и иной естественный способ передать добавочное καί.
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: решили
  rationale: Глагол обозначает обдуманное намерение, приведшее к определённому решению. «Решили» естественно звучит по-русски и передаёт намеренную, целенаправленную волю; возможное «замыслили» сильнее подчёркивает составление плана.
- source_word: δὲ
  choice: поэтому
  rationale: В данном повествовательном контексте частица связывает решение первосвященников с причиной, указанной в предыдущем стихе. «Поэтому» естественно передаёт это развитие мысли, не создавая излишнего противопоставления.
- source_word: οἱ ἀρχιερεῖς
  choice: первосвященники
  rationale: Во множественном числе выражение обозначает представителей высшего священнического руководства. «Первосвященники» — устоявшийся и точный русский эквивалент в евангельском контексте.
- source_word: ἵνα
  choice: убить
  rationale: После глагола решения конструкция ἵνα с сослагательным наклонением естественно передаётся русским инфинитивом, выражающим содержание и цель решения.
- source_word: καὶ
  choice: и
  rationale: 'Частица имеет добавочное значение: Лазарь также стал целью наряду с Иисусом. В конструкции «и Лазаря» это значение ясно и естественно выражено по-русски.'
- source_word: τὸν Λάζαρον
  choice: Лазаря
  rationale: Имя передано в его традиционной русской форме; артикль отдельно не переводится.
- source_word: ἀποκτείνωσιν
  choice: убить
  rationale: Прямой и стилистически естественный эквивалент. «Предать смерти» могло бы необоснованно предполагать формальную судебную процедуру, а «убить преступным образом» добавило бы отсутствующую в самом глаголе оценку.
theological_decisions:
- issue: Характер намерения первосвященников в отношении Лазаря
  choice: Передать прямо как принятое ими решение убить Лазаря
  alternative: Усилить оттенок предумышленного сговора словами «составили заговор» или «сговорились»
  rationale: Текст ясно говорит о сознательном смертельном намерении, но не употребляет специального обозначения заговора. Перевод сохраняет тяжесть сказанного, не добавляя лишней интерпретации.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанное. Слово «первосвященники» сохранено как устоявшийся библейский термин, понятный широкому читателю.
