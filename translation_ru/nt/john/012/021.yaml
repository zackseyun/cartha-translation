source:
  edition: SBLGNT
  text: οὗτοι οὖν προσῆλθον Φιλίππῳ τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας, καὶ ἠρώτων αὐτὸν λέγοντες· Κύριε, θέλομεν τὸν Ἰησοῦν ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/021.yaml
  text: So these came to Philip[a], who was from Bethsaida in Galilee, and were asking him, saying, “Lord, we want to see Jesus.”
translation:
  language: ru
  text: 'Итак, эти люди подошли к Филиппу, который был из Вифсаиды Галилейской, и просили его: «Господин[a], мы хотим увидеть Иисуса».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое κύριε может быть вежливым обращением «господин»; в других контекстах то же слово переводится «Господи».
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι
  choice: эти люди
  rationale: Указательное местоимение во множественном числе отсылает к грекам, упомянутым в предыдущем стихе. Добавление «люди» естественно для русского языка и не уточняет пол сверх контекста.
- source_word: οὖν
  choice: итак
  rationale: Передаёт связь с предыдущим повествованием и дальнейшее развитие событий.
- source_word: προσῆλθον
  choice: подошли к
  rationale: Точно и естественно передаёт движение к человеку с целью обратиться к нему.
- source_word: Φιλίππῳ
  choice: Филиппу
  rationale: Традиционная русская форма имени в дательном падеже.
- source_word: τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας
  choice: который был из Вифсаиды Галилейской
  rationale: Относительное придаточное естественно передаёт греческую определительную конструкцию; «Вифсаида Галилейская» сохраняет географическое уточнение.
- source_word: ἠρώτων
  choice: просили
  rationale: В данном контексте глагол означает обращение с просьбой. Несовершенный вид русского глагола соответствует длительному или повторному оттенку греческого имперфекта без излишнего усиления.
- source_word: λέγοντες
  choice: двоеточие перед прямой речью
  rationale: В современном русском повествовании содержание причастия «говоря» естественно выражается введением прямой речи; буквальное «говоря» было бы тяжеловесным.
- source_word: Κύριε
  choice: Господин
  rationale: Звательная форма κύριε обращена к Филиппу и здесь наиболее вероятно служит формой почтительного обращения, а не исповеданием его как Господа. Смысловая широта греческого слова отмечена в сноске.
- source_word: θέλομεν
  choice: мы хотим
  rationale: Прямо и современно передаёт желание или намерение говорящих.
- source_word: τὸν Ἰησοῦν
  choice: Иисуса
  rationale: Стандартная русская форма имени в винительном падеже.
- source_word: ἰδεῖν
  choice: увидеть
  rationale: Сохраняет прямое значение инфинитива ὁράω; возможный подразумеваемый смысл встречи не внесён в основной текст.
theological_decisions:
- issue: Значение κύριε в обращении к Филиппу
  choice: Господин
  alternative: Господи
  rationale: Адресатом является Филипп, поэтому контекст указывает на вежливое обращение «господин». Однако κύριε имеет также значение «Господи», и эта лексическая многозначность сохранена в сноске, чтобы не скрывать форму оригинала и не приписывать говорящим неуместное богословское исповедание о Филиппе.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис прямой речи сделан естественным для русского повествования; географическое обозначение передано в традиционной библейской форме.
