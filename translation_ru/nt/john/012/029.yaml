  text: ὁ οὖν ὄχλος ὁ ἑστὼς καὶ ἀκούσας ἔλεγεν βροντὴν γεγονέναι· ἄλλοι ἔλεγον· Ἄγγελος αὐτῷ λελάληκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/029.yaml
  text: So the crowd that was standing there and had heard it was saying that thunder had happened; others were saying[a], “An angel has spoken to him.”
translation:
  language: ru
  text: 'Итак, стоявший там народ, услышав это, говорил: «Прогремел гром»; другие же говорили: «Ангел сказал Ему».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ангел говорил с Ним».'
    reason: лексическая и синтаксическая альтернатива для αὐτῷ λελάληκεν
lexical_decisions:
- source_word: οὖν
  choice: Итак
  rationale: Передаёт связь с предшествующим небесным голосом и продолжает повествование.
- source_word: ὄχλος
  choice: народ
  rationale: Естественное русское обозначение собравшейся массы людей в данном контексте; «толпа» также возможно, но звучит несколько менее возвышенно.
- source_word: ὁ ἑστὼς
  choice: стоявший там
  rationale: Передаёт определительное значение перфектного причастия и обозначенную контекстом локализацию.
- source_word: ἀκούσας
  choice: услышав это
  rationale: Деепричастие отражает действие, предшествующее речи; «это» восполняет подразумеваемый голос или звук из предыдущего стиха.
- source_word: ἔλεγεν
  choice: говорил
  rationale: Несовершенный вид естественно передаёт длительное или повторявшееся высказывание группы.
- source_word: βροντὴν γεγονέναι
  choice: Прогремел гром
  rationale: Идиоматичное русское выражение, точно передающее мнение народа о том, что раздался гром, без неестественного буквального оборота «гром произошёл».
- source_word: ἄλλοι
  choice: другие же
  rationale: Ясно противопоставляет вторую часть собравшихся первой.
- source_word: Ἄγγελος
  choice: ангел
  rationale: В контексте небесного голоса имеется в виду небесный вестник, поэтому «ангел» точнее общего «вестник».
- source_word: αὐτῷ
  choice: с Ним
  rationale: При русском глаголе «говорить» конструкция «говорить с кем-либо» естественна; греческий дательный допускает также передачу «Ему».
- source_word: λελάληκεν
  choice: говорил
  rationale: Русское прошедшее совершенного действия в прямой речи естественно выражает состоявшийся речевой акт; отдельная морфологическая передача результативности греческого перфекта здесь звучала бы тяжеловесно.
theological_decisions:
- issue: Кем толпа считала небесного говорящего
  choice: ангел
  alternative: вестник
  rationale: Контекст указывает на предполагаемое сверхъестественное существо, но текст передаёт лишь толкование части народа и не подтверждает его как слова повествователя.
- issue: Направленность речи ангела
  choice: говорил с Ним
  alternative: сказал Ему
  rationale: «Говорил с Ним» сохраняет возможный оттенок обращения или общения в λαλέω с дательным, тогда как «сказал Ему» могло бы сильнее предполагать конкретное сообщённое содержание.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю. Сохранено различие между двумя истолкованиями услышанного; буквальный, но неестественный оборот о «произошедшем громе» заменён обычным русским выражением. Маркер сноски поставлен непосредственно после относящейся к нему реплики.
