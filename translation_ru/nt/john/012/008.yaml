source:
  edition: SBLGNT
  text: τοὺς πτωχοὺς γὰρ πάντοτε ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/008.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: ru
  text: Ведь бедные[a] всегда с вами, а Я не всегда с вами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть бедные люди.
    reason: 'Лексическое пояснение: греческое прилагательное употреблено как существительное и обозначает людей.'
lexical_decisions:
- source_word: πτωχούς
  choice: бедные
  rationale: Субстантивированное прилагательное обозначает бедных людей как группу. Русское «бедные» естественно и кратко сохраняет эту форму.
- source_word: γάρ
  choice: ведь
  rationale: Частица вводит пояснение к предыдущим словам; «ведь» естественно передаёт эту пояснительную связь в современном русском языке.
- source_word: πάντοτε
  choice: всегда
  rationale: «Всегда» точно и естественно передаёт временное значение наречия; одинаковый перевод сохраняет параллелизм двух частей.
- source_word: ἔχετε μεθ’ ἑαυτῶν
  choice: с вами
  rationale: В данном контексте сочетание обозначает постоянное присутствие рядом, а не обладание. Русская именная конструкция «с вами» естественнее буквального «имеете при себе» и не добавляет будущего времени.
- source_word: ἐμέ
  choice: Я
  rationale: При русской конструкции «Я … с вами» объектное греческое местоимение закономерно преобразуется в подлежащее без изменения референта или смысла.
- source_word: δέ
  choice: а
  rationale: Союз выражает сопоставление и контраст. Русское «а» передаёт его естественнее, чем более резкое «но».
- source_word: οὐ πάντοτε
  choice: не всегда
  rationale: Прямо сохраняет отрицание и временной контраст, не уточняя сверх текста, когда именно присутствие прекратится.
theological_decisions:
- issue: Возможное истолкование слов Иисуса как умаления заботы о бедных
  choice: Сохранено прямое сопоставление постоянного присутствия бедных и ограниченного по времени присутствия Иисуса без дополнительных оценок.
  alternative: Парафраз, согласно которому бедные менее важны, либо смягчение, устраняющее контраст.
  rationale: Греческий текст утверждает различие в доступности и времени присутствия, но не говорит, что забота о бедных неважна. Перевод сохраняет напряжение высказывания, не разрешая его доктринальной вставкой.
- issue: Настоящее или будущее время в переводе ἔχετε
  choice: Настоящее время передано безглагольной русской конструкцией «с вами».
  alternative: «Всегда будут с вами… Я не всегда буду с вами».
  rationale: В греческом обе формы ἔχετε стоят в настоящем времени. Русская конструкция сохраняет обобщённый смысл и параллелизм, не вводя явно будущего времени.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Параллелизм двух частей сохранён, лишние временные и богословские уточнения не добавлены.
