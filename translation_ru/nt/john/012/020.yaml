review_pass:
  verdict: revise
  source_fidelity: Фраза «пришедших на праздник» передаёт общий смысл, но заменяет настоящее причастие ἀναβαινόντων («поднимавшихся / шедших [в Иерусалим]») результативным «пришедших». Более точная русская конструкция сохраняет принадлежность греков к группе направлявшихся на праздник и цель их пути. Добавление «и» для δέ допустимо.
  naturalness: «Среди тех, кто шёл на праздник, чтобы поклониться, были и некоторые греки» — естественный современный литературный русский. Оно избегает несколько тяжеловесного сочетания «пришедших на праздник для поклонения».
  terminology: «Греки» верно передаёт Ἕλληνές и не подменяет его словом «язычники». Сноска в проекте чрезмерно конкретизирует («люди греческого происхождения или культуры») и вводит классификацию «другие неиудеи», которой текст не даёт. Сноска должна лишь отметить неуточнённость их отношения к иудаизму.
  issues:
  - severity: medium
    issue: Видо-временной и пространственный оттенок ἀναβαινόντων утрачен.
    rationale: «Пришедших» говорит о уже состоявшемся прибытии, тогда как настоящее причастие обозначает группу шедших/поднимавшихся на праздник. Русское «тех, кто шёл» точнее без добавления не названного в стихе пункта назначения.
  - severity: low
    issue: Сноска излишне описывает идентичность греков.
    rationale: Она правильно не отождествляет их автоматически с язычниками, но формулировки о происхождении, культуре и «других неиудеях» выходят за пределы того, что прямо устанавливает текст. Лучше сохранить именно неуточнённость.
  revised_text: Среди тех, кто шёл на праздник, чтобы поклониться, были и некоторые греки[a].
