revisions:
- from: Среди пришедших на праздник для поклонения были и некоторые греки[a].
  to: Среди тех, кто шёл на праздник, чтобы поклониться, были и некоторые греки[a].
  rationale: Исправление восстанавливает процессуальный смысл ἀναβαινόντων и более прямо выражает цель через «чтобы поклониться». Термин «греки» сохранён, а сноска сокращена, чтобы не приписывать этим людям происхождение, статус или религиозную принадлежность, не указанные в стихе.
  reviewer_model: gpt-5.6-terra
