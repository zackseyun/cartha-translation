base_translation:
  language: en
  yaml_path: translation/nt/john/012/020.yaml
  text: There were some Greeks among those going up to worship at the feast[a].
translation:
  language: ru
  text: Среди тех, кто шёл на праздник, чтобы поклониться, были и некоторые греки[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «некоторые эллины». Текст не уточняет, каково было их отношение к иудаизму.'
    reason: Сохраняет значение Ἕλληνες как «греки» и не разрешает спорный вопрос об их религиозном статусе.
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: были и
  rationale: ἦσαν передано экзистенциальной конструкцией «были», а мягкая связка δέ — естественной в данном порядке слов частицей «и», отмечающей переход и присоединение к контексту без временного значения.
- source_word: Ἕλληνές τινες
  choice: некоторые греки
  rationale: Ἕλληνες прямо обозначает греков, а τινες придаёт неопределённость. Перевод «язычники» неоправданно обобщил бы этнокультурное обозначение.
- source_word: ἐκ τῶν ἀναβαινόντων
  choice: среди пришедших
  rationale: ἐκ указывает, что греки входили в число паломников. Буквальное «восходивших» сохраняло бы образ движения вверх, но в современном русском звучало бы неестественно без явного упоминания Иерусалима; завершённое «пришедших» согласуется с их присутствием на празднике.
- source_word: ἵνα προσκυνήσωσιν
  choice: для поклонения
  rationale: ἵνα с сослагательным наклонением выражает цель, а προσκυνέω здесь означает религиозное поклонение.
- source_word: ἐν τῇ ἑορτῇ
  choice: на праздник
  rationale: В сочетании с целью прибытия русское «на праздник» естественно передаёт участие в праздничном богослужении; в контексте речь идёт о празднике Пасхи.
theological_decisions:
- issue: Кем были Ἕλληνες
  choice: Сохранено прямое обозначение «греки».
  alternative: «язычники» или уточнение «грекоязычные иудеи / прозелиты»
  rationale: Текст называет их греками и сообщает, что они пришли поклониться на празднике, но не уточняет, были ли они прозелитами, боящимися Бога или принадлежали к иной группе. Перевод не разрешает эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Перестановка обстоятельства в начало делает экзистенциальную конструкцию естественной; «праздник» оставлен без добавленного названия, как в исходном стихе.
