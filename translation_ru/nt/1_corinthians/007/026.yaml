  text: νομίζω οὖν τοῦτο καλὸν ὑπάρχειν διὰ τὴν ἐνεστῶσαν ἀνάγκην, ὅτι καλὸν ἀνθρώπῳ τὸ οὕτως εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/026.yaml
  text: 'Therefore I think this is good because of the present distress: that it is good for a man to remain as he is[a][b][c].'
translation:
  language: ru
  text: 'Итак, я полагаю, что ввиду нынешних тяжёлых обстоятельств[a] это хорошо: человеку[b] хорошо оставаться в своём нынешнем положении[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «ввиду нынешней нужды», «из-за нынешнего бедствия» или «ввиду надвигающегося кризиса».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мужчине»; греческое слово может обозначать как мужчину, так и человека вообще.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «быть так».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίζω
  choice: я считаю
  rationale: Передаёт личное, обдуманное суждение Павла, а не безусловное повеление; в современном русском звучит естественно и достойно.
- source_word: οὖν
  choice: итак
  rationale: Ясно обозначает вывод из предшествующего рассуждения.
- source_word: τοῦτο καλὸν ὑπάρχειν
  choice: лучше
  rationale: В данном контексте καλόν выражает практическую уместность или предпочтительность. Русское «лучше» позволяет естественно передать повтор καλόν в цельном предложении, хотя формально возможно «это хорошо».
- source_word: διὰ τὴν ἐνεστῶσαν ἀνάγκην
  choice: из-за нынешнего бедствия
  rationale: ἀνάγκη может обозначать нужду, необходимость или тяжёлые обстоятельства; «бедствие» передаёт внешнее давление ситуации. ἐνεστῶσαν указывает на нынешнее, уже наличное положение, хотя форма допускает обсуждаемую контекстуальную перспективу.
- source_word: ὅτι
  choice: что
  rationale: Вводит содержание суждения Павла; в русском при перестройке предложения его функция передана конструкцией «считаю, что».
- source_word: καλὸν
  choice: лучше
  rationale: Передаёт оценку как практическую предпочтительность в данных обстоятельствах, не превращая её в утверждение об абсолютном нравственном превосходстве.
- source_word: ἀνθρώπῳ
  choice: человеку
  rationale: ἄνθρωπος здесь естественно может иметь обобщённое значение. Русское «человеку» сохраняет единственное число и не вносит ненужного ограничения только мужчинами.
- source_word: τὸ οὕτως εἶναι
  choice: оставаться в таком положении
  rationale: Буквально «быть так». Контекст и настоящее εἶναι допускают естественное русское указание на сохранение нынешнего состояния; буквальный вариант отмечен в сноске.
theological_decisions:
- issue: Характер совета Павла
  choice: Ситуативное пастырское суждение, обусловленное нынешним бедствием
  alternative: Вневременное предпочтение безбрачию или запрет брака
  rationale: Формула «я считаю» и основание «из-за нынешнего бедствия» удерживают совет в конкретной ситуации. Перевод не превращает его ни в абсолютный запрет брака, ни в чисто необязательное личное мнение.
- issue: Обобщённость ἀνθρώπῳ
  choice: человеку
  alternative: мужчине
  rationale: Слово ἄνθρωπος способно обозначать человека вообще; ближайший контекст охватывает разные брачные состояния. Нейтральное по охвату русское соответствие сохраняет возможную обобщённость исходного текста.
translation_notes:
  register: Современный литературный русский, ясный и сдержанный. Сохранён личный характер апостольского суждения и его обусловленность обстоятельствами; неоднозначность ἀνάγκη и буквальность заключительной конструкции вынесены в сноски.
