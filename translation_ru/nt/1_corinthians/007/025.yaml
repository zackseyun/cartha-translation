reference: 1 Corinthians 7:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν παρθένων ἐπιταγὴν κυρίου οὐκ ἔχω, γνώμην δὲ δίδωμι ὡς ἠλεημένος ὑπὸ κυρίου πιστὸς εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/025.yaml
  text: Concerning virgins[a], I have no command from the Lord[c][b], but I give my judgment as one who by the Lord’s mercy is trustworthy.
translation:
  language: ru
  text: Что же касается девственниц[a], то у меня нет повеления от Господа, но я высказываю своё суждение[b] как человек, который по милости Господа достоин доверия[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «незамужних женщин»; согласно некоторым толкованиям контекста — «дочерей-девственниц». В греческом тексте буквально: «девственниц».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «своё мнение» или «свой совет». Здесь Павел противопоставляет своё обдуманное суждение прямому «повелению от Господа».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «верен». Греческое слово может означать как «верный», так и «надёжный, достойный доверия»; здесь, вероятно, имеется в виду, что по милости Господа Павлу можно доверять как советчику.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Что же касается
  rationale: Естественная русская формула перехода к новой теме; передаёт περί и связующую силу δέ, не добавляя временного значения.
- source_word: τῶν παρθένων
  choice: девственниц
  rationale: παρθένος прежде всего обозначает девственницу, обычно молодую незамужнюю женщину. Буквальный общий термин сохраняет неопределённость того, о какой именно группе идёт речь.
- source_word: ἐπιταγὴν κυρίου
  choice: повеления от Господа
  rationale: ἐπιταγή означает властное повеление или предписание; оборот «от Господа» ясно указывает на источник повеления.
- source_word: γνώμην δὲ δίδωμι
  choice: но я высказываю своё суждение
  rationale: γνώμη здесь означает обдуманное суждение, мнение или совет и противопоставлено прямому повелению; «высказываю» естественно передаёт δίδωμι в русском сочетании.
- source_word: ὡς ἠλεημένος ὑπὸ κυρίου
  choice: как человек, который по милости Господа
  rationale: Передаёт основание, связанное с полученной от Господа милостью, в естественной русской форме без предположения, что речь идёт о личной заслуге Павла.
- source_word: πιστὸς εἶναι
  choice: достоин доверия
  rationale: πιστός может означать как верность, так и надёжность. В данном контексте выражение подчёркивает надёжность Павла как дающего суждение, однако альтернативное значение отмечено в сноске.
theological_decisions:
- issue: Характер авторитета Павлова суждения при отсутствии прямого повеления Господа
  choice: Павел отличает отсутствие прямого повеления от Господа от собственного обдуманного суждения, которое он даёт как достойный доверия по милости Господа.
  alternative: Считать эти слова лишь частным мнением без авторитетного веса либо косвенной ссылкой на неизвестное повеление Иисуса.
  rationale: 'Противопоставление ἐπιταγή и γνώμη сохраняется: Павел не утверждает, что передаёт прямое повеление Господа, но и не представляет своё суждение как небрежное или ненадёжное частное мнение.'
- issue: Значение πιστός
  choice: В основном тексте — «достоин доверия».
  alternative: «верен».
  rationale: Оба значения допустимы лексически. Контекст поддерживает надёжность Павла как советчика, но сноска сохраняет возможное значение нравственной и служебной верности.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Формула «Что же касается» обозначает тематический переход. Синтаксис сохраняет контраст между прямым повелением и Павловым суждением, не снижая последнее до случайного личного мнения и не приравнивая его к прямому изречению Господа.
