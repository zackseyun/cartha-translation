base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/039.yaml
  text: A wife is bound for as long as her husband lives[a]; but if her husband dies, she is free to be married to whom she wishes[b], only in the Lord.
translation:
  language: ru
  text: Жена связана, пока жив её муж; если же её муж умрёт[a], она свободна выйти замуж за кого захочет — только в Господе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «уснёт»; в греческом это распространённый эвфемизм смерти.'
    reason: lexical_alternative
  - marker: b
    text: 'Выражение «только в Господе» часто понимают как указание вступать в брак только с тем, кто принадлежит Господу, то есть с единоверцем; возможно и более широкое понимание: поступать в согласии с верностью Господу.'
    reason: alternative_reading
lexical_decisions:
- source_word: Γυνὴ
  choice: Жена
  rationale: В брачном контексте слово обозначает жену, а не женщину вообще.
- source_word: δέδεται
  choice: связана
  rationale: Перфект страдательного залога выражает сохраняющееся состояние брачной связанности; добавление «законом» отсутствует в данном греческом тексте.
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: пока жив
  rationale: Естественно и точно передаёт продолжительность условия.
- source_word: ὁ ἀνὴρ αὐτῆς
  choice: её муж
  rationale: В данном контексте ἀνήρ означает мужа.
- source_word: κοιμηθῇ
  choice: уснёт смертным сном
  rationale: Сохраняет образ сна и одновременно ясно передаёт обычный эвфемистический смысл — смерть.
- source_word: ἐλευθέρα ἐστὶν
  choice: она свободна
  rationale: Передаёт освобождение от прежних брачных уз естественным современным языком.
- source_word: ᾧ θέλει γαμηθῆναι
  choice: выйти замуж за кого пожелает
  rationale: Естественная русская формулировка, точно выражающая свободу выбора нового мужа.
- source_word: μόνον ἐν κυρίῳ
  choice: только в Господе
  rationale: Сохраняет краткость и богословскую ёмкость греческого выражения, не подменяя его одной интерпретацией.
theological_decisions:
- issue: Значение выражения «в Господе» при повторном браке
  choice: только в Господе
  alternative: только за верующего / лишь так, как подобает принадлежащей Господу
  rationale: Греческое выражение допускает сжатую смысловую широту. Буквальная формулировка сохраняет её, а распространённое понимание поясняется в сноске.
- issue: Эвфемизм смерти
  choice: уснёт смертным сном
  alternative: умрёт / уснёт
  rationale: Один глагол «уснёт» в современном русском может быть ошибочно понят буквально, тогда как «умрёт» устраняет исходный образ. Выбранная формулировка сохраняет метафору и делает смысл ясным.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет противопоставление двух частей стиха; богословски насыщенное выражение «в Господе» оставлено без истолковывающего расширения в основном тексте.
