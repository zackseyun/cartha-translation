  source_fidelity: 'Греческое κοιμηθῇ — эвфемизм смерти («уснёт»), но сочетание «уснёт смертным сном» не воспроизводит форму исходного текста: оно добавляет существительное и стилистически архаично. В современном литературном русском естественно передать смысл глаголом «умрёт», отметив буквальный образ сна в сноске. Остальные смысловые соответствия сохранены: длительность брачной связанности, свобода вступить в новый брак и ограничение «только в Господе».'
  naturalness: «Уснёт смертным сном» звучит книжно-архаически и тяжеловесно для целевого современного литературного регистра. «Умрёт» ясно и естественно; сноска сохраняет лексическую особенность греческого выражения. Формулировка «за кого захочет» более естественна в современной речи, чем «за кого пожелает», без смысловой потери.
  terminology: «В Господе» следует сохранить в основном тексте без интерпретирующего расширения. В сноске допустимо указать распространённое понимание, но его следует сформулировать как толкование, а не как единственное значение. «Жена», «муж», «связана» и «свободна» соответствуют брачному контексту и регистру.
