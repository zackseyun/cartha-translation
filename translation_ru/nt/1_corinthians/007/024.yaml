  text: ἕκαστος ἐν ᾧ ἐκλήθη, ἀδελφοί, ἐν τούτῳ μενέτω παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/024.yaml
  text: Brothers[b][a], let each one remain with God in that condition in which he was called.
translation:
  language: ru
  text: Братья[a], пусть каждый остаётся перед Богом[b] в том положении, в каком был призван.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Обращение «братья» здесь относится ко всей общине, включая женщин.
    reason: cultural_note
  - marker: b
    text: 'Или: «с Богом»; возможно также: «в присутствии Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: каждый
  rationale: Дистрибутивное единственное число передано естественным русским словом «каждый», сохраняющим личную направленность наставления.
- source_word: ἐν ᾧ ... ἐν τούτῳ
  choice: в том положении, в каком
  rationale: Повтор конструкции ἐν с относительным и указательным местоимениями указывает на жизненное или общественное положение, обсуждаемое в контексте; русская соотносительная конструкция сохраняет эту связь.
- source_word: ἐκλήθη
  choice: был призван
  rationale: 'Сохранён страдательный залог без добавления действующего лица: в контексте подразумевается Божий призыв, но прямо в этой фразе субъект действия не назван.'
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохранена форма обращения мужского рода; в данном контексте она обращена ко всей общине, что поясняется в сноске.
- source_word: μενέτω
  choice: пусть остаётся
  rationale: Форма повелительного наклонения передаёт призыв продолжать оставаться в данном положении и соответствует повторяющейся теме отрывка.
- source_word: παρὰ θεῷ
  choice: перед Богом
  rationale: παρά с дательным может обозначать близость, присутствие или отношение. «Перед Богом» естественно выражает жизнь в Божьем присутствии, не устраняя возможный оттенок «с Богом».
theological_decisions:
- issue: Следует ли прямо назвать Бога действующим лицом при ἐκλήθη
  choice: Сохранить «был призван», не добавляя «Богом»
  alternative: «был призван Богом»
  rationale: Контекст Павловых посланий указывает на Божий призыв, однако греческий текст оставляет действующее лицо невыраженным; перевод не делает подразумеваемое явным.
- issue: Как передать ἀδελφοί при обращении к смешанной общине
  choice: «братья» со сноской о включающем употреблении
  alternative: «братья и сёстры»
  rationale: Основной текст сохраняет грамматическую форму оригинала, а сноска разъясняет, что обращение охватывает всю общину.
- issue: Смысл παρὰ θεῷ
  choice: «перед Богом»
  alternative: «с Богом» или «в присутствии Бога»
  rationale: Сжатая греческая конструкция допускает оттенки присутствия и отношений с Богом; основной вариант звучит естественно по-русски, а альтернативы сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык; фраза звучит ясно и достойно. Порядок слов слегка сглажен по сравнению с греческим ради естественности, при этом соотносительная конструкция «в том положении, в каком» сохраняет структуру и смысл оригинала.
