review_pass:
  verdict: revise
  source_fidelity: '«Безраздельной преданности» не вполне точно передаёт ἀπερισπάστως: это слово означает «без отвлечения», «не будучи отвлекаемыми», а не исключительность или цельность преданности. εὐπάρεδρον обозначает постоянную обращённость/пребывание при Господе; это несколько конкретнее, чем просто «преданность». Образ βρόχος удачно сохранён словом «петлю».'
  naturalness: Текст в целом литературен и ясен. Предлагаемое «неотвлечённого пребывания при Господе» естественно для современного литературного библейского русского и точнее выражает сочетание εὐπάρεδρον ... ἀπερισπάστως.
  terminology: «Господу» уместно для τῷ κυρίῳ. «Благопристойность» допустимо и хорошо передаёт εὔσχημον в этой сжатой параллельной конструкции. «Петлю» следует сохранить, поскольку она передаёт намеренно образный βρόχος, согласуясь и с английским контрольным текстом («noose»).
  issues:
  - severity: medium
    issue: «Безраздельной»
    rationale: «Безраздельный» обычно означает неразделённый, всецело принадлежащий или исключительный; ἀπερισπάστως говорит об отсутствии отвлечений. Такая замена также лучше сохраняет различие между качеством пребывания у Господа и идеей исключительной преданности.
  - severity: low
    issue: «Преданности»
    rationale: Слово возможно по смыслу, но сглаживает пространственно-образный оттенок εὐπάρεδρον («быть при, находиться рядом»). «Пребывание при Господе» сохраняет его без добавления узкого понятия церковного служения.
  revised_text: Говорю это для вашей же пользы — не для того, чтобы набросить на вас петлю, а ради благопристойности и неотвлечённого пребывания при Господе.
