  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τοῦτο δὲ πρὸς τὸ ὑμῶν αὐτῶν ⸀σύμφορον λέγω, οὐχ ἵνα βρόχον ὑμῖν ἐπιβάλω, ἀλλὰ πρὸς τὸ εὔσχημον καὶ ⸀εὐπάρεδρον τῷ κυρίῳ ἀπερισπάστως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/035.yaml
  text: I say this for your own benefit, not to put a noose on you, but for what is proper and for undistracted devotion to the Lord.
translation:
  language: ru
  text: Говорю это для вашей же пользы — не для того, чтобы набросить на вас петлю, а ради благопристойности и неотвлечённого пребывания при Господе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμφορον
  choice: польза
  rationale: Передаёт то, что полезно и благотворно для самих адресатов; усилительная конструкция ὑμῶν αὐτῶν отражена словами «вашей же».
- source_word: βρόχος
  choice: петля
  rationale: Сохраняет яркий буквальный образ силка или петли, означающий навязывающее ограничение, не заменяя его более общим словом «стеснение».
- source_word: εὔσχημον
  choice: благопристойность
  rationale: Передаёт идею достойного, подобающего поведения в сжатой именной форме, соответствующей греческому выражению.
- source_word: εὐπάρεδρον
  choice: преданность
  rationale: В данном контексте обозначает постоянную обращённость к Господу и готовность быть при Нём; «преданность» звучит естественно по-русски, не сужая смысл до конкретного церковного служения.
- source_word: ἀπερισπάστως
  choice: безраздельной
  rationale: Передаёт отсутствие отвлечения и внутренней раздвоенности; в сочетании с «преданностью» естественно выражает наречный смысл исходного текста.
theological_decisions:
- issue: Характер наставления Павла
  choice: Сохранено противопоставление пользы адресатов и навязывания им «петли»
  alternative: Передать βρόχος как нейтральное «ограничение» или «стеснение»
  rationale: Буквальный образ подчёркивает, что Павел не намерен принуждать или лишать свободы, не превращая его совет в обязательное предписание.
- issue: Отношение εὔσχημον и εὐπάρεδρον к цели высказывания
  choice: 'Оба понятия переданы как параллельные цели: «ради благопристойности и безраздельной преданности Господу»'
  alternative: Развернуть как «чтобы вы благопристойно и без отвлечений служили Господу»
  rationale: Именная конструкция сохраняет структуру оригинала и не добавляет более узкое понятие «служение», которого в греческом тексте прямо нет.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис сохраняет риторическое противопоставление оригинала; образ «набросить петлю» намеренно оставлен выразительным, но понятным.
