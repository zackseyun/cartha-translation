lexical_decisions:
- source_word: ἐγκρατεύονται
  choice: могут владеть собой
  rationale: Форма обозначает способность проявлять самообладание; в данном контексте речь идёт прежде всего о сдерживании полового влечения. Русское выражение естественно передаёт смысл, не сводя его к отвлечённому обладанию качеством.
- source_word: γαμησάτωσαν
  choice: пусть вступают в брак
  rationale: Передаёт повелительное наклонение третьего лица множественного числа и звучит естественно в современном литературном русском.
- source_word: κρεῖττον
  choice: лучше
  rationale: Прямой и естественный эквивалент сравнительной формы.
- source_word: γαμῆσαι
  choice: вступить в брак
  rationale: Точно передаёт инфинитив и сохраняет параллель с предыдущим повелением.
- source_word: πυροῦσθαι
  choice: сгорать от страсти
  rationale: Сохраняет метафору горения и передаёт наиболее вероятный в контексте смысл — сильное половое влечение; добавление «от страсти» делает подразумеваемое основание метафоры понятным современному читателю.
- source_word: δὲ
  choice: Но
  rationale: Передаёт лёгкое противопоставление предыдущему наставлению.
theological_decisions:
- issue: Значение πυροῦσθαι
  choice: сгорать от страсти
  alternative: гореть; подвергаться огню суда
  rationale: Непосредственный контекст связывает выражение с неспособностью владеть собой и с вступлением в брак, поэтому наиболее вероятно значение сильного полового желания. При этом буквальная краткая передача сохранена в примечании как подлинная лексическая возможность.
translation_notes:
  register: Современный литературный русский язык; наставительный, но не архаичный тон. Повтор «вступить в брак» сохраняет риторическую связь греческих форм γαμησάτωσαν и γαμῆσαι.
