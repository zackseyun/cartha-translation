  yaml_path: translation/nt/1_corinthians/007/009.yaml
  text: But if they do not have self-control[a], let them marry; for it is better to marry than to burn.
translation:
  language: ru
  text: Но если они не владеют собой, пусть вступают в брак, потому что лучше вступить в брак, чем гореть.[a]
  philosophy: optimal-equivalence
  footnotes:
