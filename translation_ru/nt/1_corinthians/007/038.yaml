  text: ὥστε καὶ ὁ ⸀γαμίζων ⸂τὴν παρθένον ἑαυτοῦ⸃ καλῶς ποιεῖ, ⸂καὶ ὁ⸃ μὴ ⸁γαμίζων κρεῖσσον ⸀ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/038.yaml
  text: So then[a], the one who gives his own virgin in marriage does well, and the one who does not give her in marriage will do better.
translation:
  language: ru
  text: Итак[a], тот, кто выдаёт замуж свою деву, поступает хорошо, а тот, кто не выдаёт её замуж, поступит лучше.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «тот, кто женится на своей невесте-девственнице, поступает хорошо, а тот, кто не женится на ней, поступит лучше». Другое распространённое понимание: речь идёт о его дочери-девственнице. Однако греческий глагол здесь обычно имеет значение «выдавать замуж», поэтому основной текст сохраняет этот смысл, не уточняя, кем именно приходится ему дева.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Итак
  rationale: Передаёт вывод из предшествующего рассуждения естественным для современного русского языка способом.
- source_word: γαμίζων
  choice: выдаёт замуж
  rationale: Сохраняет каузативное значение глагола γαμίζω — не просто «женится», а «выдаёт замуж» — и не смешивает его с γαμέω.
- source_word: τὴν παρθένον ἑαυτοῦ
  choice: свою деву
  rationale: «Дева» передаёт παρθένος и позволяет не уточнять спорное отношение женщины к мужчине; слово имеет возвышенную, но понятную литературную окраску.
- source_word: καλῶς ποιεῖ
  choice: поступает хорошо
  rationale: Передаёт положительную оценку действия, не превращая её в безусловное предписание.
- source_word: μὴ γαμίζων
  choice: не выдаёт её замуж
  rationale: Последовательно сохраняет каузативный смысл; местоимение «её» естественно восполняет подразумеваемое дополнение.
- source_word: κρεῖσσον ποιήσει
  choice: поступит лучше
  rationale: Сохраняет сравнительную степень κρεῖσσον и будущее время ποιήσει, не усиливая выражение до превосходной степени.
theological_decisions:
- issue: Кого обозначает выражение τὴν παρθένον ἑαυτοῦ и как понимать γαμίζω
  choice: Основной текст сохраняет каузативное значение «выдаёт замуж» и не уточняет, является ли дева дочерью или подопечной.
  alternative: 'Возможны понимания: «кто женится на своей невесте-девственнице» либо, с явным уточнением отношения, «кто выдаёт замуж свою дочь-девственницу».'
  rationale: В 1 Кор 7:36–38 это выражение допускает разные истолкования. Форма γαμίζω естественнее означает «выдавать замуж», однако точное общественное или семейное отношение мужчины к деве в самом выражении не названо. Перевод не должен без необходимости устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским словом «дева». Формулировка «свою деву» намеренно сохраняет необычность и неоднозначность греческого оборота; примечание разъясняет основные варианты, не закрепляя конфессионально обусловленного толкования.
