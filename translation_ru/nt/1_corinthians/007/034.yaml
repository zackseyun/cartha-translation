source:
  edition: SBLGNT
  text: ⸀καὶ μεμέρισται. καὶ ἡ γυνὴ ⸂ἡ ἄγαμος⸃ καὶ ἡ ⸀παρθένος μεριμνᾷ τὰ τοῦ κυρίου, ἵνα ᾖ ἁγία καὶ ⸀τῷ σώματι καὶ ⸁τῷ πνεύματι· ἡ δὲ γαμήσασα μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/034.yaml
  text: And she is divided. And the unmarried woman[a], that is, the virgin, is concerned about the things of the Lord, so that she may be holy both in body and in spirit. But the married woman is concerned about the things of the world, how she may please her husband.
translation:
  language: ru
  text: И он разделён. А незамужняя женщина[a], то есть дева, заботится о Господнем, чтобы быть святой и телом, и духом. Замужняя же заботится о мирском — о том, как угодить мужу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «А незамужняя женщина и дева заботятся о Господнем». Греческий текст допускает понимание этих слов как перечисления двух категорий, а не как отождествления незамужней женщины с девой.'
    reason: alternative_reading
lexical_decisions:
- source_word: μεμέρισται
  choice: он разделён
  rationale: Перфект пассива передаёт сохраняющееся состояние разделённости и продолжает мысль предыдущего стиха; метафора не заменена более толковательным «отвлекается».
- source_word: γυνὴ ἡ ἄγαμος
  choice: незамужняя женщина
  rationale: В противопоставлении замужней женщине γυνή обозначает женщину, не состоящую в браке; «незамужняя» естественно и точно для русского контекста.
- source_word: παρθένος
  choice: дева
  rationale: Сохраняет лексическую определённость παρθένος и звучит достойно в библейском регистре; значение не расширено до общего «девушка».
- source_word: γυνὴ ἡ ἄγαμος καὶ ἡ παρθένος
  choice: незамужняя женщина, то есть дева
  rationale: Аппозитивное прочтение согласуется с единственным числом μεριμνᾷ и даёт ясную русскую фразу; возможное перечисление двух категорий сохранено в сноске.
- source_word: μεριμνᾷ
  choice: заботится о
  rationale: В данном контексте слово указывает на направленность забот и внимания, не обязательно на греховную тревогу.
- source_word: τὰ τοῦ κυρίου
  choice: о Господнем
  rationale: Естественная русская субстантивация сохраняет противопоставление тому, что относится к Господу, и «мирскому».
- source_word: ἵνα ᾖ ἁγία
  choice: чтобы быть святой
  rationale: Передаёт целевое значение ἵνα с сослагательным наклонением и сохраняет прямую лексику святости.
- source_word: τῷ σώματι καὶ τῷ πνεύματι
  choice: и телом, и духом
  rationale: Дательный отношения передан естественной русской конструкцией; парное «и… и…» отражает греческое καὶ… καὶ без навязывания антропологической схемы.
- source_word: ἡ δὲ γαμήσασα
  choice: замужняя же
  rationale: Субстантивированное причастие обозначает женщину в браке; краткая форма естественно поддерживает контраст.
- source_word: τὰ τοῦ κόσμου
  choice: о мирском
  rationale: Сохраняет структурное противопоставление «Господнему» и не придаёт выражению более резко отрицательного смысла, чем требует контекст.
- source_word: πῶς ἀρέσῃ τῷ ἀνδρί
  choice: о том, как угодить мужу
  rationale: В брачном контексте ἀνήρ означает «муж»; конструкция естественно передаёт предмет её заботы.
theological_decisions:
- issue: Следует ли понимать «незамужняя женщина и дева» как две категории или как пояснительное наименование одной категории
  choice: 'Аппозитивное прочтение: «незамужняя женщина, то есть дева»'
  alternative: 'Сочинительное прочтение: «незамужняя женщина и дева»'
  rationale: Сжатый греческий синтаксис допускает оба понимания, однако глагол μεριμνᾷ в единственном числе благоприятствует единому субъекту. Альтернативное прочтение не устранено, а указано в сноске.
- issue: Смысл выражения «о мирском»
  choice: Нейтрально передать сферу земных брачных обязанностей
  alternative: Истолковать как нравственно порочную мирскость
  rationale: Контекст сопоставляет разные направленности забот, но сам по себе не требует осуждать стремление замужней женщины угодить мужу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формы «Господнем», «дева», «святой» сохраняют достоинство и богословскую лексику, тогда как синтаксис остаётся доступным обычному читателю. Начальное «он разделён» намеренно сохраняет связь и местоименный субъект из предыдущего контекста.
