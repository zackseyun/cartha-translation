base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/040.yaml
  text: But she is happier if she remains as she is[a], according to my judgment—and I think that I also have the Spirit of God.
translation:
  language: ru
  text: Но она счастливее, если останется в таком положении[a], по моему суждению. И я думаю, что тоже имею Духа Божьего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «блаженнее». Греческая сравнительная форма μακαριωτέρα может обозначать как большее счастье, так и более блаженное состояние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαριωτέρα
  choice: счастливее
  rationale: Сравнительная форма μακάριος здесь описывает более благоприятное и счастливое состояние в рамках пастырского совета. «Счастливее» естественно звучит по-русски, тогда как «блаженнее» возможно, но сильнее окрашено религиозно.
- source_word: ἐὰν οὕτως μείνῃ
  choice: если останется в таком положении
  rationale: μένω означает «оставаться», а οὕτως отсылает к обсуждаемому состоянию женщины без мужа. Формулировка сохраняет эту отсылку, не уточняя сверх контекста.
- source_word: κατὰ τὴν ἐμὴν γνώμην
  choice: по моему суждению
  rationale: γνώμη обозначает обдуманное мнение или суждение. Этот вариант передаёт взвешенный характер совета Павла и не звучит столь обыденно, как «по-моему».
- source_word: δοκῶ
  choice: я думаю
  rationale: Форма передаёт сдержанное утверждение. «Я думаю» сохраняет риторическую скромность, не превращая слова Павла в выражение неуверенности.
- source_word: κἀγὼ
  choice: и я
  rationale: Красис καὶ ἐγώ имеет добавочное значение «и я», вероятно подразумевая сопоставление с другими людьми, претендующими на духовное разумение.
- source_word: πνεῦμα θεοῦ
  choice: Духа Божьего
  rationale: В данном контексте выражение у Павла относится к Божьему Духу, а не просто к духовному настрою. Традиционно понятная форма «Духа Божьего» естественна в русском библейском регистре.
- source_word: ἔχειν
  choice: имею
  rationale: Прямой эквивалент инфинитива «иметь» при δοκῶ; не требует более тяжеловесного «обладать».
theological_decisions:
- issue: Относится ли πνεῦμα θεοῦ к Святому Духу или к общему духовному настрою
  choice: Фраза передана как «Духа Божьего», то есть как указание на Божьего Духа.
  alternative: «дух от Бога» или «духовное разумение от Бога»
  rationale: В словоупотреблении Павла πνεῦμα θεοῦ обычно обозначает Божьего Духа. Здесь Павел подтверждает духовную состоятельность своего совета, не называя его прямой заповедью Господа.
- issue: Сила утверждения δοκῶ ... πνεῦμα θεοῦ ἔχειν
  choice: Сдержанное по форме, но действительное заявление о водительстве Духа.
  alternative: Неуверенность Павла в том, имеет ли он Духа, либо исключительно ироническая реплика.
  rationale: «Я думаю» сохраняет риторическую скромность δοκῶ, однако контекст не требует понимать эти слова как сомнение Павла в присутствии Духа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сохраняет последовательность греческого высказывания, но остаётся естественным для современного читателя; подлинная сдержанность слов Павла не устранена.
