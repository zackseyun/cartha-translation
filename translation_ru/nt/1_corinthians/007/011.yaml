  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ χωρισθῇ, μενέτω ἄγαμος ἢ τῷ ἀνδρὶ καταλλαγήτω— καὶ ἄνδρα γυναῖκα μὴ ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/011.yaml
  text: But if she does separate[a], let her remain unmarried[b], or else be reconciled to her husband—and a husband must not divorce his wife.
translation:
  language: ru
  text: Если же она всё-таки разойдётся с мужем[a], пусть остаётся незамужней или примирится с мужем. И муж не должен разводиться с женой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но даже если она разойдётся с мужем». Греческое выражение может иметь уступительный оттенок.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «не должен отпускать жену». В брачном контексте этот глагол обычно означает развод.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ καὶ
  choice: Если же она всё-таки
  rationale: Сочетание вводит условие с возможным уступительным оттенком. «Всё-таки» естественно передаёт καί в значении «даже если», не превращая условие в утверждение.
- source_word: χωρισθῇ
  choice: разойдётся с мужем
  rationale: χωρίζω здесь означает супружеское расхождение или раздельное проживание. Выражение не отождествляется с формальным разводом и сохраняет отличие от ἀφιέναι; «с мужем» проясняет подразумеваемую брачную связь.
- source_word: μενέτω
  choice: пусть остаётся
  rationale: Императив настоящего времени выражает предписание продолжать находиться в указанном состоянии; по-русски естественно передаётся конструкцией «пусть остаётся».
- source_word: ἄγαμος
  choice: незамужней
  rationale: В отношении женщины ἄγαμος означает не состоящую в браке. «Незамужней» точно передаёт семейное положение и согласуется с женским субъектом.
- source_word: καταλλαγήτω
  choice: примирится
  rationale: Пассивный императив аориста означает «пусть будет примирена / пусть примирится». Возвратная форма естественна по-русски и сохраняет relational sense примирения без уточнения его процесса.
- source_word: τῷ ἀνδρί
  choice: с мужем
  rationale: ἀνήρ в брачном контексте означает мужа; русский глагол «примириться» требует предлога «с» и творительного падежа.
- source_word: ἄνδρα
  choice: муж
  rationale: В парном наставлении ἀνήρ имеет значение «муж», а не просто «мужчина».
- source_word: γυναῖκα
  choice: с женой
  rationale: γυνή в данном брачном контексте означает жену. Русская конструкция «разводиться с» требует творительного падежа.
- source_word: μὴ ἀφιέναι
  choice: не должен разводиться
  rationale: Инфинитивная конструкция продолжает предписание предыдущего контекста и имеет запретительную силу. В брачном контексте ἀφίημι обозначает отпускание жены, то есть развод; «не должен» ясно передаёт нормативный характер.
theological_decisions:
- issue: Следует ли одинаково переводить χωρισθῇ и ἀφιέναι
  choice: Передать χωρισθῇ как «разойдётся с мужем», а ἀφιέναι как «разводиться с женой»
  alternative: Оба глагола перевести словом «разводиться» либо оба — более общим «расставаться»
  rationale: Павел употребляет разные глаголы. Сохранение различия не навязывает χωρισθῇ формально-юридическое значение и одновременно отражает обычную брачную силу ἀφιέναι.
- issue: Как передать уступительный оттенок ἐὰν δὲ καὶ
  choice: Выразить его словом «всё-таки»
  alternative: 'Перевести нейтрально: «Если же она разойдётся»; либо сильнее: «Но даже если она разойдётся»'
  rationale: καί может придавать условию уступительный оттенок. «Всё-таки» передаёт его естественно и сохраняет условный характер высказывания.
- issue: Как выразить подразумеваемый женский субъект χωρισθῇ
  choice: Употребить местоимение «она» и пояснить брачную связь словами «с мужем»
  alternative: 'Назвать субъект существительным: «если же жена разойдётся»'
  rationale: Субъект восстанавливается из непосредственного контекста. Местоимение сохраняет связность текста, а дополнение устраняет возможную бытовую неоднозначность русского «разойдётся».
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Различие между супружеским расхождением и разводом сохранено. Союз перед заключительным наставлением оформлен отдельным предложением для естественного русского синтаксиса; тире оригинала не несёт самостоятельного смыслового значения.
