  text: καὶ οἱ χρώμενοι ⸂τὸν κόσμον⸃ ὡς μὴ καταχρώμενοι· παράγει γὰρ τὸ σχῆμα τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/031.yaml
  text: and those who use the world as not making full use of it[b][a]; for the present form of this world is passing away.
translation:
  language: ru
  text: и те, кто пользуется миром, — как те, кто не пользуется им в полной мере[a], потому что облик этого мира проходит[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как те, кто не использует его до конца»; глагол может также означать «не злоупотребляющие им».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «форма» или «внешний облик» этого мира.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρώμενοι
  choice: пользуется
  rationale: Причастие от χράομαι означает «пользоваться»; по-русски эта форма естественно передаёт взаимодействие с благами и порядками мира.
- source_word: τὸν κόσμον
  choice: миром
  rationale: κόσμος здесь обозначает нынешний мир в его общественном и материальном устройстве; прямое «мир» сохраняет широту исходного слова.
- source_word: ὡς μὴ καταχρώμενοι
  choice: словно не пользующиеся им в полной мере
  rationale: καταχράομαι в сочетании с χράομαι создаёт игру слов и может означать усиленное или полное пользование. Перевод сохраняет эту связь, не сводя смысл исключительно к злоупотреблению.
- source_word: παράγει
  choice: проходит
  rationale: Настоящее время изображает продолжающийся процесс; «проходит» передаёт преходящий характер нынешнего мирового порядка.
- source_word: τὸ σχῆμα
  choice: облик
  rationale: σχῆμα означает форму, внешний вид или образ существования. «Облик» кратко и естественно сохраняет отличие нынешней формы мира от его сущности.
- source_word: τοῦ κόσμου τούτου
  choice: этого мира
  rationale: Указательное τούτου явно сохранено и подчёркивает именно нынешний, преходящий миропорядок.
theological_decisions:
- issue: Смысл καταχρώμενοι в связи с χρώμενοι
  choice: Пользоваться миром, но не пользоваться им в полной мере
  alternative: Не злоупотреблять миром; словно вовсе им не пользоваться
  rationale: Сочетание χρώμενοι / καταχρώμενοι предполагает словесное противопоставление обычного и полного либо чрезмерного пользования. Основной текст сохраняет это напряжение, а примечание отмечает возможный смысл «злоупотреблять».
- issue: Значение σχῆμα
  choice: Преходящий облик или нынешняя форма мира
  alternative: Только внешняя видимость мира; сущностная природа мира
  rationale: σχῆμα указывает на нынешний вид или устройство мира, а не обязательно на его сущность. «Облик» сохраняет эту смысловую грань без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет параллелизм наставлений в контексте и игру однокоренных глаголов. Тире помогает естественно оформить причастный оборот, а «потому что» ясно передаёт причинное γάρ.
