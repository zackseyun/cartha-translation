    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: жена
  rationale: В непосредственном контексте брака и взаимных супружеских обязанностей слово обозначает замужнюю женщину; «жена» точнее общего «женщина».
- source_word: ἀνήρ
  choice: муж
  rationale: В паре с γυνή и в брачном контексте слово означает супруга, а не мужчину вообще.
- source_word: ἰδίου σώματος
  choice: своим телом
  rationale: Передаёт значение принадлежности самому человеку и естественно сохраняет акцент ἴδιος на собственном теле.
- source_word: ἐξουσιάζει
  choice: властна / властен над
  rationale: Глагол означает обладать властью или правом распоряжения. Краткая русская конструкция сохраняет прямой смысл и взаимный характер утверждения, не усиливая его до идеи принудительного господства.
- source_word: ἀλλά
  choice: но
  rationale: Ясно передаёт противопоставление между самим человеком и его супругом или супругой.
- source_word: ὁμοίως δὲ καὶ
  choice: так же и
  rationale: Естественно по-русски подчёркивает точную взаимность и параллелизм второй части стиха.
theological_decisions:
- issue: Характер супружеской власти в стихе
  choice: Сохранить прямое утверждение о взаимной власти супругов над телом друг друга, не добавляя односторонней иерархии или принуждения.
  alternative: Ослабить до «тело не принадлежит ей/ему» либо усилить до «супруг распоряжается телом другого».
  rationale: 'Греческая формулировка намеренно симметрична: одно и то же утверждается сначала о жене, затем о муже. Перевод сохраняет эту взаимность и напряжённость прямого слова о власти, не подменяя его толкованием.'
translation_notes:
  register: Современный литературный русский язык; лаконичный, достоинственный синтаксис сохраняет параллелизм оригинала. Формы «властна / властен» понятны современному читателю и не требуют добавления отсутствующих в греческом глаголов во второй части каждого противопоставления.
