  text: But I say this as a concession[a], not as a command.
translation:
  language: ru
  text: Но это я говорю как уступку[a], а не как повеление.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в порядке допущения»; «как позволение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: это
  rationale: Указательное местоимение сохраняет естественную отсылку к ближайшему контексту, не уточняя без достаточных оснований, направлена ли она только назад или также вперёд.
- source_word: δὲ
  choice: но
  rationale: Передаёт мягкое противопоставление между допускаемым и обязательным.
- source_word: λέγω
  choice: я говорю
  rationale: Естественно передаёт форму настоящего времени и сохраняет личную формулировку Павла.
- source_word: κατὰ συγγνώμην
  choice: как уступку
  rationale: В данном контексте выражение обозначает допускающее послабление, а не прощение; выбранная формулировка ясно противопоставлена повелению.
- source_word: οὐ κατ’ ἐπιταγήν
  choice: а не как повеление
  rationale: «Повеление» передаёт авторитетное предписание и образует точный смысловой контраст с уступкой.
theological_decisions:
- issue: Следует ли понимать слова Павла как разрешительное послабление или как менее обязательную форму повеления
  choice: Павел прямо представляет сказанное как уступку, а не как обязательное повеление.
  alternative: Его совет может сохранять косвенный апостольский авторитет.
  rationale: Перевод сохраняет явное противопоставление συγγνώμη и ἐπιταγή, не делая дополнительных выводов о пределах апостольского авторитета.
translation_notes:
  register: Современный литературный русский язык; краткая и dignified формулировка. «Уступка» понятна обычному читателю, а сноска раскрывает разрешительный оттенок греческого выражения.
