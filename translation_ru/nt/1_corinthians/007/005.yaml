language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μὴ ἀποστερεῖτε ἀλλήλους, εἰ μήτι ἂν ἐκ συμφώνου πρὸς καιρὸν ἵνα ⸀σχολάσητε ⸀τῇ προσευχῇ καὶ πάλιν ἐπὶ τὸ αὐτὸ ⸀ἦτε, ἵνα μὴ πειράζῃ ὑμᾶς ὁ Σατανᾶς διὰ τὴν ἀκρασίαν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/005.yaml
  text: Do not deprive one another[a], except perhaps by mutual agreement for a time, so that you may devote yourselves to prayer, and then come together again[b], so that Satan may not tempt you because of your lack of self-control.
translation:
  language: ru
  text: Не лишайте друг друга[a], разве что по взаимному согласию и лишь на время, чтобы посвятить себя молитве; затем снова будьте вместе[b], чтобы Сатана не искушал вас из-за недостатка самообладания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В данном контексте речь идёт о том, чтобы не лишать друг друга супружеской близости.
    reason: contextual_clarification
  - marker: b
    text: 'Буквально: «снова будьте вместе»; в контексте речь идёт о возобновлении супружеской жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστερεῖτε
  choice: лишайте
  rationale: Глагол означает лишать другого того, что ему причитается. В ближайшем контексте речь идёт о супружеской близости, однако русский текст сохраняет отсутствие прямого дополнения в греческом и не становится излишне откровенным.
- source_word: ἀλλήλους
  choice: друг друга
  rationale: Естественная русская передача взаимности, подчёркивающая, что наставление одинаково относится к обоим супругам.
- source_word: εἰ μήτι ἂν
  choice: разве что
  rationale: Оборот вводит ограниченное, не безусловное исключение. «Разве что» естественно передаёт его в современном русском языке.
- source_word: ἐκ συμφώνου
  choice: по взаимному согласию
  rationale: Передаёт совместное согласие обоих супругов, не позволяя понять решение как одностороннее.
- source_word: πρὸς καιρόν
  choice: лишь на время
  rationale: Указывает на ограниченную продолжительность; частица «лишь» ясно подчёркивает временный характер воздержания.
- source_word: σχολάσητε
  choice: посвятить себя
  rationale: В данном сочетании глагол обозначает освобождение времени и сосредоточенность на определённом занятии; выбранная формулировка естественно сочетается с молитвой.
- source_word: τῇ προσευχῇ
  choice: молитве
  rationale: Единственное число соответствует греческому тексту и обозначает молитву как занятие или практику вообще.
- source_word: πάλιν ἐπὶ τὸ αὐτὸ ἦτε
  choice: снова будьте вместе
  rationale: Передача сохраняет скромную косвенность греческого выражения и в контексте указывает на возобновление обычной супружеской близости, не делая формулировку более явной, чем оригинал.
- source_word: πειράζῃ
  choice: искушал
  rationale: При сатане как действующем лице речь идёт о побуждении ко греху, а не о нейтральном испытании.
- source_word: ὁ Σατανᾶς
  choice: сатана
  rationale: Традиционная русская передача личного имени; контекст говорит о личном действующем лице, а не об абстрактной враждебной силе.
- source_word: ἀκρασίαν
  choice: недостатка самообладания
  rationale: Выражает неспособность сохранять воздержание и остаётся ясным современному читателю; «невоздержанность» звучало бы книжно и могло бы восприниматься как более резкая нравственная оценка.
theological_decisions:
- issue: Следует ли явно назвать супружескую близость как подразумеваемый объект ἀποστερεῖτε
  choice: 'Сохранить конструкцию без прямого дополнения: «Не лишайте друг друга»'
  alternative: «Не лишайте друг друга супружеской близости»
  rationale: Предшествующий контекст ясно определяет предмет речи, но в самом стихе объект не назван. Выбранный вариант сохраняет лаконичность и скромность оригинала, а сноска устраняет возможную неясность.
- issue: Насколько явно передавать πάλιν ἐπὶ τὸ αὐτὸ ἦτε
  choice: «снова будьте вместе»
  alternative: «снова вступайте в супружескую близость»
  rationale: Выражение в контексте подразумевает возобновление супружеских отношений, включая половую близость, но греческий текст говорит об этом косвенно. Перевод сохраняет эту намеренную сдержанность.
- issue: Понимать ли ὁ Σατανᾶς как личное имя или как общее обозначение противника
  choice: Личное имя «сатана»
  alternative: «противник»
  rationale: В данном месте Павел говорит о сатане как о личном действующем лице. Транслитерация не добавляет к тексту каких-либо конфессиональных уточнений.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанный. Синтаксис сохраняет последовательность наставления, цели и предостережения. Формулировки избегают как архаичного «невоздержание», так и более явной сексуальной лексики, чем допускает косвенный язык оригинала.
