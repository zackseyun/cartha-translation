id: 1CO.7.21
reference: 1 Corinthians 7:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Δοῦλος ἐκλήθης; μή σοι μελέτω· ἀλλ’ εἰ καὶ δύνασαι ἐλεύθερος γενέσθαι, μᾶλλον χρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/021.yaml
  text: Were you called as a servant? Do not let it trouble you. But if indeed you are able to become free[a], rather make use of it.
translation:
  language: ru
  text: Ты был рабом, когда был призван? Пусть это тебя не тревожит. Но если ты действительно можешь стать свободным, лучше воспользуйся этой возможностью.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но даже если ты можешь стать свободным, лучше пользуйся своим нынешним положением», то есть оставайся как есть. В греческом после слов «лучше воспользуйся» объект не назван, поэтому выражение понимают обоими способами.'
    reason: alternative_reading
lexical_decisions:
- source_word: Δοῦλος
  choice: рабом
  rationale: В данном контексте слово обозначает несвободный, подневольный статус, что подтверждается противопоставлением возможности стать свободным; «слуга» ослабило бы этот смысл.
- source_word: ἐκλήθης
  choice: когда был призван
  rationale: Сохранён характерный для Павла язык призвания без добавления отсутствующих в греческом тексте слов «Богом» или «к вере». Оборот естественно указывает на положение человека во время призвания.
- source_word: μή σοι μελέτω
  choice: пусть это тебя не тревожит
  rationale: Передаёт значение заботы или беспокойства и сохраняет пастырский тон греческого выражения.
- source_word: ἐλεύθερος γενέσθαι
  choice: стать свободным
  rationale: Прямо передаёт изменение общественного и правового положения — переход от рабства к свободе.
- source_word: μᾶλλον χρῆσαι
  choice: лучше воспользуйся этой возможностью
  rationale: Объект глагола в греческом не назван. В основном тексте подразумевается непосредственно предшествующая возможность стать свободным; существенная альтернативная трактовка сохранена в примечании.
theological_decisions:
- issue: Неоднозначность μᾶλλον χρῆσαι
  choice: Призыв воспользоваться возможностью получить свободу.
  alternative: Призыв воспользоваться своим нынешним положением, то есть остаться рабом.
  rationale: Ближайший контекст позволяет понимать подразумеваемым объектом возможность стать свободным. Однако греческий текст не называет объект прямо, поэтому исторически засвидетельствованная альтернативная трактовка не исключена и вынесена в примечание.
translation_notes:
  register: Современный литературный русский язык; обращение на «ты» соответствует единственному числу греческих форм. Формулировка сохраняет достоинство тона, ясно называет рабский статус и не устраняет синтаксическую неоднозначность заключительной фразы.
