  source_fidelity: 'Текст точно передаёт основные элементы греческого оригинала: δοῦλος — «раб», ἐκλήθης — «был призван», μή σοι μελέτω — «пусть это тебя не тревожит», ἐλεύθερος γενέσθαι — «стать свободным». Основное чтение μᾶλλον χρῆσαι передано как призыв воспользоваться возможностью свободы; невыраженный в греческом объект обоснован ближайшим контекстом и не скрыт от читателя.'
