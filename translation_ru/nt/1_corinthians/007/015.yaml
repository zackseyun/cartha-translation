  text: εἰ δὲ ὁ ἄπιστος χωρίζεται, χωριζέσθω· οὐ δεδούλωται ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ ἐν τοῖς τοιούτοις, ἐν δὲ εἰρήνῃ κέκληκεν ⸀ἡμᾶς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/015.yaml
  text: But if the unbeliever separates[a], let him separate. The brother or the sister is not enslaved in such cases[c][b], but God has called us in peace.
translation:
  language: ru
  text: Но если неверующий супруг уходит[a], пусть уходит. Брат или сестра в таких случаях не находятся в порабощении[b]. Бог призвал нас жить в мире[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разлучается». Глагол может обозначать разлучение или уход и сам по себе не уточняет, идёт ли речь о юридически оформленном разводе.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не порабощён». Здесь употреблён глагол δουλόω («порабощать»), а не более обычный глагол со значением «связывать».'
    reason: lexical_alternative
  - marker: c
    text: 'В некоторых рукописях: «вас» вместо «нас».'
    reason: textual_variant
lexical_decisions:
- source_word: ὁ ἄπιστος
  choice: неверующий супруг
  rationale: В греческом стоит субстантивированное «неверующий», но контекст однозначно указывает на неверующего супруга; явное существительное необходимо для естественного и ясного русского текста.
- source_word: χωρίζεται / χωριζέσθω
  choice: уходит / пусть уходит
  rationale: В брачном контексте глагол означает разлучение или уход. Повтор одного русского глагола сохраняет риторическую связь и не уточняет, идёт ли речь о юридическом разводе или фактическом уходе.
- source_word: οὐ δεδούλωται
  choice: не порабощены
  rationale: δουλόω буквально связано с рабством и порабощением, а не с обычным «связывать». Перевод сохраняет сильный образ исходного слова и не превращает фразу в техническое постановление о брачных узах.
- source_word: ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ
  choice: брат или сестра
  rationale: Сохранено употреблённое Павлом обозначение верующих через язык духовного родства без контекстуальной подмены словами «муж или жена».
- source_word: ἐν τοῖς τοιούτοις
  choice: в таких случаях
  rationale: Естественная русская передача идиоматического множественного выражения, относящегося к ситуациям, подобным только что описанной.
- source_word: ἐν δὲ εἰρήνῃ κέκληκεν ἡμᾶς ὁ θεός
  choice: Бог призвал нас к миру
  rationale: Русское «призвал к миру» естественно передаёт мир как направленность и характер Божьего призвания. Перфект передан прошедшим видом совершенного действия, результат которого сохраняется.
theological_decisions:
- issue: Объём свободы, выраженной οὐ δεδούλωται
  choice: Переведено буквально-образно как «не порабощены» без определения последствий для повторного брака.
  alternative: «не связаны» как возможное техническое разрешение на расторжение брака и новый брак
  rationale: Стих не раскрывает полного объёма этой свободы. Выбор сохраняет лексику δουλόω и не навязывает конфессионального вывода.
- issue: Референт ὁ ἄπιστος
  choice: «неверующий супруг»
  alternative: «неверующий»
  rationale: Хотя греческое выражение формально не содержит слова «супруг», ближайший брачный контекст устанавливает референт. В русском добавление существительного предотвращает неясность, не меняя смысла.
- issue: Отношение ἐν δὲ εἰρήνῃ к предыдущему утверждению
  choice: 'Оформлено отдельным предложением: «Бог призвал нас к миру».'
  alternative: «но Бог призвал нас к миру»
  rationale: δὲ допускает слабый переход, а точная логическая связь остаётся неоднозначной. Разделение предложений не навязывает жёсткого противопоставления, сохраняя при этом связь мысли.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified библейским регистром. Формулировка избегает архаизмов «неверный», «не связан узами» и не превращает стих в юридико-догматическую формулу. Согласование «брат или сестра… не порабощены» употреблено во множественном числе как естественное обобщение лиц разного пола.
