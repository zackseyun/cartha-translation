base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/032.yaml
  text: But I want you to be free from anxieties. The unmarried man is concerned with the things of the Lord[a], how he may please the Lord;
translation:
  language: ru
  text: Но я хочу, чтобы вы не были обременены заботами. Неженатый[a] заботится о том, что принадлежит Господу, — о том, как угодить Господу;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не состоящий в браке человек». В греческом тексте употреблена форма мужского рода и единственного числа («неженатый»), хотя в окружающем отрывке Павел шире говорит о состоящих и не состоящих в браке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω δὲ
  choice: Но я хочу
  rationale: 'θέλω прямо выражает желание, а δέ здесь естественно передать как мягкое противопоставление предыдущему рассуждению: «но».'
- source_word: ὑμᾶς ἀμερίμνους εἶναι
  choice: чтобы вы были свободны от забот
  rationale: ἀμέριμνος означает свободу от тревог и обременяющих забот, а не полное безразличие. Формулировка сохраняет этот смысл и звучит естественно по-русски.
- source_word: ὁ ἄγαμος
  choice: Неженатый
  rationale: Субстантивированное прилагательное стоит в мужском роде и единственном числе. Русское «неженатый» точно сохраняет как брачный статус, так и грамматический род исходного текста.
- source_word: μεριμνᾷ
  choice: заботится
  rationale: Глагол может означать «заботиться», «быть озабоченным». Здесь забота направлена на Господне, поэтому нейтрально-положительное «заботится» уместнее, при этом сохраняется смысловая связь с ἀμερίμνους.
- source_word: τὰ τοῦ κυρίου
  choice: о делах Господа
  rationale: Греческое выражение широко обозначает всё относящееся к Господу. «Дела Господа» естественно передаёт эту сферу по-русски, не сводя её к одной конкретной обязанности.
- source_word: κυρίου / κυρίῳ
  choice: Господа / Господу
  rationale: κύριος в данном христианском контексте является титулом «Господь»; русский перевод сохраняет его богословскую и лексическую силу.
- source_word: πῶς ἀρέσῃ τῷ κυρίῳ
  choice: о том, как угодить Господу
  rationale: πῶς вводит рассматриваемый способ или цель, а сослагательное ἀρέσῃ указывает на предполагаемое действие. Русский инфинитив после «как» естественно передаёт эту направленность.
theological_decisions:
- issue: Мужской род и единственное число в противопоставлении состоящих и не состоящих в браке
  choice: 'Сохранить в основном тексте мужскую форму: «Неженатый»'
  alternative: «Не состоящий в браке человек»
  rationale: Греческая форма имеет мужской род и единственное число, а в соседних стихах Павел отдельно рассматривает положение мужчин и женщин. Поэтому мужская форма сохраняется, а более широкая связь с общей темой безбрачия поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Смысловая связь между «свободны от забот» и «заботится» сохранена без придания второму выражению обязательно отрицательного оттенка.
