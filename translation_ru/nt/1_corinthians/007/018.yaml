  text: περιτετμημένος τις ἐκλήθη; μὴ ἐπισπάσθω· ἐν ἀκροβυστίᾳ ⸂κέκληταί τις⸃; μὴ περιτεμνέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/018.yaml
  text: Was anyone called while circumcised? He should not try to reverse it[a]. Was anyone called while uncircumcised? He should not be circumcised.
translation:
  language: ru
  text: Кто был призван, будучи обрезанным? Пусть не пытается скрыть следы обрезания.[a] Кто был призван необрезанным? Пусть не обрезывается.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть не становится необрезанным», то есть пусть не пытается скрыть или устранить внешние признаки обрезания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτετμημένος
  choice: будучи обрезанным
  rationale: Перфектное причастие обозначает состояние, возникшее в результате уже совершённого обрезания; такой оборот естественно передаёт состояние человека в момент призвания.
- source_word: ἐκλήθη / κέκληταί
  choice: был призван
  rationale: В контексте речь идёт о Божьем призвании к христианской жизни. Единая русская формулировка в обеих частях сохраняет параллелизм, не превращая «призван» в более истолковывающее «обратился».
- source_word: ἐπισπάσθω
  choice: пусть не пытается скрыть следы обрезания
  rationale: Глагол буквально означает восстановить вид необрезанности, то есть скрыть или устранить видимые последствия обрезания. Ясный перевод в основном тексте сопровождается более буквальным вариантом в сноске.
- source_word: ἐν ἀκροβυστίᾳ
  choice: необрезанным
  rationale: Предложная конструкция обозначает состояние человека при призвании; русское прилагательное передаёт это естественно и без неясного буквализма.
- source_word: περιτεμνέσθω
  choice: пусть не обрезывается
  rationale: Запретительная форма с μή передана прямым наставлением, сохраняющим параллель с первой частью стиха.
theological_decisions:
- issue: Смысл «призван» в обеих частях
  choice: Призван Богом к христианской жизни, находясь в данном религиозно-телесном состоянии
  alternative: Призван в общем смысле или просто позван
  rationale: Ближайший контекст 1 Кор 7 связывает призвание с Божьим призывом верующего. Сам перевод сохраняет слово «призван», не подменяя его более узким толкованием «обратился».
translation_notes:
  register: Современный литературный русский язык; краткая симметричная конструкция сохраняет риторический параллелизм греческого текста. Формулировка с «пусть» передаёт наставительный запрет без излишней категоричности.
