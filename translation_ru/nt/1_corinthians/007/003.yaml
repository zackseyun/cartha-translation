  text: The husband must give to his wife her marital duty, and likewise the wife to her husband.
translation:
  language: ru
  text: Муж пусть исполняет супружеский долг перед женой[a], и жена — перед мужем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «долг», «обязательство» или «то, что причитается». В данном контексте речь идёт о взаимной интимной обязанности супругов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναικί / γυνή
  choice: жене / жена
  rationale: В непосредственном контексте наставлений о браке речь идёт именно о жене, а не о женщине вообще.
- source_word: ἀνήρ / ἀνδρί
  choice: муж / мужем
  rationale: В брачном контексте слово обозначает мужа; перевод сохраняет параллель между супругами.
- source_word: ὀφειλήν
  choice: то, что ей причитается в браке
  rationale: Существительное буквально означает долг или то, что причитается. Контекст указывает на супружескую, в частности интимную, обязанность, но сама лексема выражена шире; формулировка сохраняет эту смысловую напряжённость.
- source_word: ἀποδιδότω
  choice: пусть отдаёт
  rationale: Настоящее повелительное наклонение выражает продолжающуюся обязанность; «пусть отдаёт» естественно передаёт как повелительную силу, так и идею возвращения должного.
- source_word: ὁμοίως δὲ καὶ
  choice: и … пусть так же поступает
  rationale: Передаёт добавочную связь и подчёркнутую взаимность требований к мужу и жене без тяжеловесного буквального воспроизведения частиц.
theological_decisions:
- issue: Насколько явно обозначить содержание супружеского долга
  choice: В основном тексте — «то, что ей причитается в браке», с пояснением в сноске.
  alternative: «супружеский долг»; «долг»; «супружеские права»
  rationale: Греческое ὀφειλή означает причитающееся или обязательство, тогда как контекст стихов 2, 4–5 придаёт ему интимный смысл. Выбранный вариант не скрывает брачный контекст, но и не сужает значение слова сильнее оригинала; параллельная конструкция сохраняет взаимность обязательства.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная, без архаизма «воздавать должное». Симметричная структура подчёркивает равную взаимность обязанности супругов.
