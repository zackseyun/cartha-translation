base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/007.yaml
  text: But I want all men to be as I myself am. Yet each has his own gift from God, one in this way and another in that way.
translation:
  language: ru
  text: 'Но я хочу, чтобы все люди были как я сам. Однако у каждого свой дар от Бога: один — так, другой — иначе.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλω
  choice: я хотел бы
  rationale: В данном контексте передаёт личное желание Павла, не превращая его в повеление.
- source_word: πάντας ἀνθρώπους
  choice: все люди
  rationale: ἄνθρωπος здесь имеет общее значение «человек»; по-русски множественное «люди» естественно и не ограничивает смысл мужчинами.
- source_word: χάρισμα
  choice: дар
  rationale: Передаёт данный Богом особый дар или способность, сохраняя богословскую связь с Божьей благодатью без лишнего пояснения.
- source_word: ὁ μὲν οὕτως, ὁ δὲ οὕτως
  choice: у одного — такой, у другого — иной
  rationale: Естественно воспроизводит греческое сопоставление различных даров и состояний.
theological_decisions:
- issue: Что означает «были как я»
  choice: Сохранить выражение без уточнения
  alternative: Добавить «неженатыми» или «воздержанными»
  rationale: Контекст связывает слова Павла с брачным состоянием и самообладанием, однако сам стих не называет конкретно ни безбрачие, ни воздержание; уточнение сняло бы подлинную неоднозначность.
- issue: Характер различий между людьми
  choice: Назвать каждое состояние собственным даром от Бога
  alternative: Представить один образ жизни даром, а другой лишь допустимым состоянием
  rationale: 'Греческий текст прямо говорит, что каждый имеет собственный дар: один такой, другой иной, не устанавливая здесь духовного превосходства одного состояния.'
translation_notes:
  register: Современный литературный русский язык; ясная, сдержанная и достойная формулировка. Синтаксис сохраняет противопоставление личного желания Павла и различия Божьих даров.
